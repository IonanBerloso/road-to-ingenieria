# Rúbrica compartida (fase I de Fluidos, unidad i-rub, 29 de septiembre de
# 2026). La deducción del tiempo de vaciado de un depósito por un orificio,
# tal como la dan las diapositivas 11, 13 y 14 del tema 13 (y la práctica 13
# del guion, que mide ese tiempo). No sustituye a ninguna rúbrica escrita:
# ningún ejercicio de Fluidos tenía todavía este `redactar`.
#
# Cae en dos convocatorias: 1920-1par-5 a) (depósito cerrado, con el aire de
# arriba en expansión isoterma; pide solo el tramo cuadrado, y sin integrar)
# y 2324-ord-5 a) (abierto,
# con el orificio por encima del fondo); el b) de 2324-ord-5 pide razonar
# sin cálculo lo que dice la expresión, y es el último punto.
#
# Los `minimo` son los cuatro pasos de las diapositivas 13 y 14: Bernoulli
# en un instante, el caudal real, la ecuación fundamental y la integral
# planteada. La
# NOTA de 1920-1par-5, «Los resultados sin deducción de la expresión NO SON
# VÁLIDOS», va citada literal en el punto de la ecuación fundamental.
titulo: El tiempo de vaciado de un depósito, deducido
cuando: >-
  La expresión del tiempo que tarda en bajar el nivel de un depósito que se
  vacía por un orificio: Bernoulli en un instante, el caudal real con los
  coeficientes del orificio, el balance de volumen en un intervalo dt y la
  integral entre los dos niveles. Cae en dos de las dieciséis convocatorias,
  una con el depósito cerrado y el aire de arriba expandiéndose, y otra
  abierto con el orificio por encima del fondo.
puntos:
  - punto: |
      **Bernoulli en un instante, entre la lámina y el orificio**:
      $V_{2t} = \sqrt{2g\left(P_1/\gamma + h\right)}$, con $h$ medida desde
      el orificio y $P_1$ la presión manométrica sobre la lámina, que es cero
      si el depósito está abierto.
    porque: |
      El flujo no es permanente, y aun así se puede: el nivel baja tan
      despacio que Bernoulli vale en cada instante, que es como lo justifica
      la diapositiva 13 del tema 13. La altura se mide desde el
      orificio, no desde el fondo: en la ordinaria de 2024 el orificio está
      a 200 mm del fondo, el agua que queda por debajo no sale nunca y la
      expresión impresa lleva la altura del depósito menos esos 200 mm.
    minimo: true
  - punto: |
      **El caudal real, con los coeficientes del orificio**:
      $Q_{2r} = C_v\,C_c\,A_{orificio}\,V_{2t} = C_d\,A_{orificio}\,V_{2t}$.
    porque: |
      $V_{2t}$ es la velocidad teórica. El caudal que sale de verdad es menor
      porque el chorro va algo más despacio y se contrae, y eso lo corrigen
      el coeficiente de velocidad y el de contracción, cuyo producto es el
      de descarga (diapositivas 11 y 14 del tema 13). Sin ellos el tiempo
      sale corto.
    minimo: true
  - punto: |
      **La ecuación fundamental del vaciado**, escrita:
      $dV = Q_{2r}\,dt = -A_{dep}\,dh$. El volumen que sale por el orificio
      en $dt$ es el que baja la lámina, y el signo menos está porque $h$
      disminuye.
    porque: |
      Es la ecuación que la diapositiva 13 del tema 13 llama así, y es la
      deducción: sin esta línea, el tiempo final es una fórmula recordada. El
      primer parcial de 2020 lo avisa con una nota: «Los resultados sin
      deducción de la expresión NO SON VÁLIDOS». Olvidar el signo da un
      tiempo negativo, o unos límites de integración al revés que lo
      esconden.
    minimo: true
  - punto: |
      **Separar variables y plantear la integral entre el nivel inicial y el
      final**, con la sección del depósito dentro si cambia con la altura,
      por tramos, y resolverla si el enunciado lo pide. Abierto y de sección
      constante queda
      $t = \dfrac{\sqrt{2}\,A_{dep}}{C_d\,A_{orificio}\,\sqrt{g}}\left(\sqrt{h_{inicial}} - \sqrt{h_{final}}\right)$.
    porque: |
      Es la integral de la diapositiva 14 del tema 13, y la fórmula del
      recuadro vale solo para ese caso: depósito abierto y sección
      constante. Si la sección cambia, como en el depósito del primer
      parcial de 2020, que es cuadrado arriba y circular abajo, hay una
      integral por tramo, cada una con su área, y los tiempos se suman. Y
      resolverla no siempre se pide: el a) de ese mismo examen quiere la
      expresión del tramo cuadrado planteada y sin integrar.
    minimo: true
  - punto: |
      **Si el depósito está cerrado, la presión del aire cambia con el
      nivel**: al bajar la lámina el aire de arriba se expande, $P_1$ deja de
      ser constante y entra en la integral en función de $h$, con la ley de
      la transformación que dé el enunciado.
    porque: |
      Por eso la diapositiva 14 deja $P_1/\gamma$ dentro de la integral y
      solo lo quita en el caso abierto. El primer parcial de 2020 lo pide
      así: el aire «tiene presión atmosférica y su proceso de
      expansión/compresión es isotermo», y la expresión, «sin necesidad de
      ser integrada, debe estar lo más simplificada posible». Tratar $P_1$
      como constante es resolver otro depósito.
  - punto: |
      **Lo que dice la expresión antes de hacer ninguna cuenta**: la
      velocidad de salida va con $\sqrt{h}$, así que con la lámina más baja
      sale menos caudal y el mismo volumen tarda más en salir.
    porque: |
      La ordinaria de 2024 lo pregunta así, «razonar la respuesta sin
      necesidad de realizar ningún tipo de cálculo», y el resultado impreso
      es ese argumento: el segundo cuarto del depósito tarda más que el
      primero porque empieza más abajo. Se contesta leyendo la fórmula, no
      evaluándola.
