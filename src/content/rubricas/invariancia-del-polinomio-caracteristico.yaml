# Rúbrica compartida (fase D0 de la auditoría del 27 de septiembre de 2026).
# Sale de la demostración modelo que ya estaba escrita en las resoluciones de
# los tres ejercicios que la piden —`exalg2122-ext-4-el-parametro-que-decide-si-diagonaliza`,
# `exalg2324-ord-4-tres-autovalores-distintos-y-una-base-ortogonal` y
# `exalg2425-ord-4-el-polinomio-caracteristico-y-una-que-no-se-puede`— y del
# tema 7, que la da con las mismas tres igualdades. Los `minimo` son los pasos
# sin los que la cadena no se sostiene: la semejanza, el λI metido entre P⁻¹ y
# P, el factor común con los lados respetados y el determinante multiplicativo.
# El recíproco falso es el de la ordinaria de 2022-2023, ejercicio 4.
titulo: El polinomio característico no cambia al cambiar de base
cuando: >-
  Demuestra que dos matrices semejantes, B = P⁻¹AP, tienen el mismo polinomio
  característico: el de un endomorfismo no depende de la base en que se
  escriba su matriz. Es el apartado a) del ejercicio 4 en la extraordinaria de
  2021-2022 y en las ordinarias de 2023-2024 y de 2024-2025, las tres veces
  como demostración entera.
puntos:
  - punto: |
      **Traducir el enunciado a semejanza.** Las matrices de un mismo
      endomorfismo en dos bases cumplen $B=P^{-1}AP$, con $P$ la matriz de
      cambio de base, que es regular.
    porque: |
      «Cambiar de base» no se puede meter en un determinante, y $P^{-1}AP$
      sí: lo que hay que probar es
      $\left|B-\lambda I\right|=\left|A-\lambda I\right|$. Y que $P$ sea
      regular no es un adorno: es lo que deja escribir $P^{-1}$ y, al final,
      cancelar $\left|P\right|$.
    minimo: true
  - punto: |
      **Meter también $\lambda I$ entre $P^{-1}$ y $P$:**
      $\lambda I=\lambda P^{-1}P=P^{-1}\left(\lambda I\right)P$.
    porque: |
      Es la idea de la demostración y el paso que se olvida. Sin él,
      $P^{-1}AP-\lambda I$ no tiene factor común y la cuenta se queda parada
      en la primera igualdad.
    minimo: true
  - punto: |
      **Sacar factor común respetando los lados:**
      $B-\lambda I=P^{-1}\left(A-\lambda I\right)P$, con $P^{-1}$ a la
      izquierda y $P$ a la derecha.
    porque: |
      El producto de matrices no es conmutativo: $P^{-1}$ y $P$ no se pueden
      juntar mientras $A-\lambda I$ esté en medio. Si se pudiera, toda matriz
      sería igual a sus semejantes y no habría nada que demostrar.
    minimo: true
  - punto: |
      **Tomar determinantes y nombrar las propiedades:** el determinante de un
      producto es el producto de los determinantes, y
      $\left|P^{-1}\right|=1/\left|P\right|$. Así que

      $$
      \left|B-\lambda I\right|
      =\left|P^{-1}\right|\left|A-\lambda I\right|\left|P\right|
      =\left|A-\lambda I\right|
      $$
    porque: |
      Aquí las matrices se convierten en números, y los números sí conmutan:
      por eso $\left|P^{-1}\right|$ y $\left|P\right|$ se pueden juntar y
      cancelar. Y $\left|P^{-1}\right|=1/\left|P\right|$ sale de la misma
      propiedad aplicada a $P^{-1}P=I$.
    minimo: true
  - punto: |
      **Cerrar con lo que significa, sin darle la vuelta.** Los autovalores
      —y con ellos la traza y el determinante— son del endomorfismo, no de la
      matriz. Pero dos matrices con el mismo polinomio **no** tienen por qué
      ser semejantes.
    porque: |
      La lectura es lo que da sentido al apartado: sin ella, «los autovalores
      de $f$» no significaría nada. Y el recíproco es falso: la ordinaria de
      2022-2023 trae dos matrices con el mismo polinomio característico de las
      que una diagonaliza y la otra no, así que no pueden ser semejantes.
