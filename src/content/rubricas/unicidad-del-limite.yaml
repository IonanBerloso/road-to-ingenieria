# Rúbrica compartida (fase D0 de la auditoría del 27 de septiembre de 2026).
# Sale de la demostración modelo de `ex1920-3-unicidad-del-limite`, la que ya
# estaba escrita en su resolución. El enunciado es palabra por palabra el
# ejercicio 2.6 del boletín del tema 2, que en la página del tema
# (`unicidad-del-limite`) lleva la misma demostración con su rúbrica escrita en
# el paso. Los `minimo` son lo que la demostración no puede perder: el absurdo
# con dos límites distintos, el máximo de los dos índices y la desigualdad
# triangular.
titulo: Si el límite de una sucesión existe, es único
cuando: >-
  Demuestra que una sucesión no puede tener dos límites distintos. Cae como
  demostración entera, con los diez puntos en COMP4, en la primera evaluación
  de 2019-2020, y es el ejercicio 2.6 del boletín del tema 2. El esquema
  —suponer dos y llegar a un absurdo— sirve para cualquier unicidad.
puntos:
  - punto: |
      **El planteamiento del absurdo: dos límites $L_1 \neq L_2$ de la misma
      sucesión.**
    porque: |
      Es el esquema de toda demostración de unicidad, y decirlo de entrada
      enseña que se reconoce. «Sea $L$ el límite» no plantea nada: da por
      supuesto lo que hay que demostrar.
    minimo: true
  - punto: |
      **Tomar $\varepsilon = \frac{|L_1-L_2|}{2}$, positivo porque
      $L_1 \neq L_2$.**
    porque: |
      La mitad de la distancia es lo que deja los dos entornos disjuntos. Con
      $\varepsilon = |L_1-L_2|$ se solaparían, un término podría estar en los
      dos a la vez y no habría contradicción.
  - punto: |
      **Cada límite con su índice —$|x_n-L_1| < \varepsilon$ para $n>m_1$ y
      $|x_n-L_2| < \varepsilon$ para $n>m_2$— y tomar
      $n > \max(m_1, m_2)$.**
    porque: |
      Cada límite da su $m$ y no tienen por qué coincidir. Sin el máximo no se
      sabe que las dos desigualdades valen en el mismo $n$, y sin eso no se
      pueden sumar. Un solo $m$ para los dos es el descuido que más se ve.
    minimo: true
  - punto: |
      **La desigualdad triangular, pasando por $x_n$:
      $|L_1-L_2| \le |L_1-x_n| + |x_n-L_2| < 2\varepsilon = |L_1-L_2|$.**
    porque: |
      Es el único puente entre los dos candidatos: la definición da la
      distancia de cada uno a los términos, no entre ellos. Es la forma
      algebraica de decir que ningún número está en los dos entornos a la vez.
    minimo: true
  - punto: |
      **El cierre: $|L_1-L_2| < |L_1-L_2|$ es imposible, luego $L_1 = L_2$.**
    porque: |
      La contradicción es que un número sea menor que sí mismo, y hay que
      escribirla, no quedarse en «llegamos a un absurdo». Y lo imposible es que
      haya dos límites, no que la sucesión converja: el enunciado parte de que
      el límite existe.
