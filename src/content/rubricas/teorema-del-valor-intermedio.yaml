# Rúbrica compartida (fase D0 de la auditoría del 27 de septiembre de 2026).
# Sale de la demostración modelo de
# `ex1617-ord-2-el-valor-intermedio-demostrado`, la que ya estaba escrita en su
# resolución: Weierstrass para tener dónde se alcanzan el mínimo y el máximo,
# los casos triviales y Bolzano aplicado a y(x) − H entre esos dos puntos.
# Los `minimo` son los dos teoremas nombrados y en su orden y la función
# auxiliar con sus signos: la resolución dice que, con ocho puntos de
# explicación formal, señalar dónde entra cada cosa es lo que se evalúa.
titulo: El teorema del valor intermedio, en su forma fuerte
cuando: >-
  Demuestra que si y es continua en [a,b], con mínimo m y máximo M, para todo
  H ∈ [m,M] existe x ∈ [a,b] con y(x) = H. Cae así, escrito enteramente en
  símbolos y sin nombrar el teorema, en la ordinaria de 2016-2017, con COMP4 8
  y COMP2 0. Aplicar Bolzano a una función concreta para ver que toma un valor
  es otro ejercicio, y no usa esta rúbrica.
puntos:
  - punto: |
      **Weierstrass, primero y por su nombre**: $y$ es continua en el cerrado
      y acotado $[a,b]$, así que **alcanza** su mínimo y su máximo en puntos
      $x_1, x_2 \in [a,b]$, con $y(x_1) = m$ e $y(x_2) = M$.
    porque: |
      Es el paso que suele olvidarse, y sin él no hay nada que hacer: que $m$
      sea el ínfimo no garantiza que la función lo tome. En $(0,1]$ la función
      $y(x) = x$ es continua y no tiene mínimo que usar.
    minimo: true
  - punto: |
      **Los casos triviales**: si $H = m$ sirve $x_1$, si $H = M$ sirve $x_2$,
      y queda por ver $m < H < M$.
    porque: |
      Bolzano pide signos estrictamente opuestos en los extremos, y con $H$
      igual a $m$ o a $M$ uno de los dos sería cero. Una línea deja limpio el
      caso que importa.
  - punto: |
      **La función auxiliar** $h(x) = y(x)-H$, continua por serlo $y$, en el
      intervalo cerrado de extremos $x_1$ y $x_2$, sea cual sea su orden.
    porque: |
      Convierte «tomar el valor $H$» en «anularse», que es de lo que habla
      Bolzano. Y hay que decir en qué intervalo: $x_1$ puede quedar a la
      derecha de $x_2$, y el argumento no depende de eso.
    minimo: true
  - punto: |
      **Los signos, y Bolzano**: $h(x_1) = m-H < 0$ y $h(x_2) = M-H > 0$, así
      que existe $x$ entre $x_1$ y $x_2$ con $h(x) = 0$, es decir $y(x) = H$.
    porque: |
      El teorema que da un cero cuando hay cambio de signo es **Bolzano**, no
      Rolle: Rolle habla de la derivada y exige derivabilidad, que aquí no se
      supone. Cambiar un nombre por otro en una demostración de ocho puntos
      cuesta casi todo el ejercicio.
    minimo: true
  - punto: |
      **Dónde se usa cada hipótesis**, con su contraejemplo: el cerrado, para
      Weierstrass; la continuidad, para los dos teoremas.
    porque: |
      Sin continuidad, la función que vale 0 en $[0,1)$ y 1 en $[1,2]$ tiene
      mínimo 0 y máximo 1 y no toma ningún valor intermedio. Decir dónde entra
      cada hipótesis no es relleno: es exactamente lo que se está evaluando.
