# Rúbrica compartida (fase I de Fluidos, unidad i-rub, 29 de septiembre de
# 2026). NUEVA: no estaba en la lista de candidatas del plan; salió al
# contar la curva de la instalación. La expresión $H_m = A - B\,Q^2$ de una
# turbobomba sacada de dos puntos de funcionamiento, el de la instalación de
# partida y el que queda al modificarla, tal como se mueve ese punto en las
# diapositivas 9, 14, 15 y 16 del tema 25. No sustituye a ninguna rúbrica
# escrita.
#
# Cae en dos convocatorias, con el mismo planteamiento: 1920-2par-4 b)
# («sabiendo que cuando la presión en el depósito superior es de 70 kPa, el
# caudal disminuye un 10%»; hoy en `fuera`, lo rescata su unidad) y
# 2324-ord-6 b) («cuando la válvula se cierra parcialmente, generando unas
# pérdidas de 8 m, el caudal disminuye un 10%»). Los dos resultados impresos
# se reproducen así (cifras.mjs). El a) de 2223-ord-9, que pide explicar el
# método de laboratorio, es pariente pero no la misma deducción, y queda
# fuera (mapa.md). Si la sesión principal no la quiere, se borra el fichero y
# no cambia nada más.
#
# Los `minimo` son los cuatro pasos sin los que no hay curva: qué es un
# punto de funcionamiento, el primero, el segundo con lo que ha cambiado y el
# sistema de dos ecuaciones.
titulo: La curva de la bomba sacada de dos puntos de funcionamiento
cuando: >-
  Deducir la expresión analítica de la curva de una turbobomba, H = A - B Q²,
  a partir de dos puntos de funcionamiento: el de la instalación tal como
  está y el que resulta al presurizar un depósito o cerrar la válvula, del
  que el enunciado da el caudal. Cae en dos de las dieciséis convocatorias,
  las dos después de haber deducido la curva de la instalación, que tiene su
  propia rúbrica.
puntos:
  - punto: |
      **Qué es un punto de funcionamiento**: el corte de la curva de la bomba
      con la de la instalación que hay en ese momento,
      $H_{mtb}(Q) = H_{mi}(Q)$. Al modificar la instalación cambia su curva,
      no la de la bomba.
    porque: |
      Es la definición de la diapositiva 9 del tema 25, «punto de
      funcionamiento P ($H_{mi} = H_{mtb}$)». Todo el método descansa en la
      segunda frase: como la bomba es la misma, sus dos puntos están en la
      misma curva, y eso da dos ecuaciones con las mismas dos incógnitas.
    minimo: true
  - punto: |
      **El primer punto, en la instalación de partida**: el caudal que da el
      enunciado y su altura leída en la curva de la instalación ya deducida,
      $H_1 = H_{mi}(Q_1)$.
    porque: |
      Es el punto P de la diapositiva 9: la altura que da la bomba es la que
      pide la instalación a ese caudal. No hace falta ningún dato de la
      bomba para escribirlo, y por eso en los dos exámenes este apartado va
      detrás del que deduce la curva de la instalación.
    minimo: true
  - punto: |
      **El segundo punto, con lo que ha cambiado y al caudal nuevo**:
      presurizar un depósito suma $\Delta P/\gamma$ al término independiente,
      $H_2 = H_{mi}(Q_2) + \Delta P/\gamma$; cerrar la válvula suma su
      pérdida adicional, $H_2 = H_{mi}(Q_2) + h_{f\,valv}$. Con «el caudal
      disminuye un 10%», $Q_2 = 0{,}9\,Q_1$.
    porque: |
      Son los dos modos de mover el punto de las diapositivas 14 a 16 del
      tema 25. En la 16, la pérdida adicional de la válvula es la distancia
      vertical, **al caudal nuevo**, entre el punto nuevo y la curva con la
      válvula abierta: sumarla al caudal de antes, o evaluar la curva en
      $Q_1$, da otro punto y otra bomba. La presión va en columna del fluido
      que se bombea: los 70 kPa del segundo parcial de 2020 son 7,14 m de
      agua.
    minimo: true
  - punto: |
      **Dos ecuaciones y dos incógnitas**: $A - B\,Q_1^{2} = H_1$ y
      $A - B\,Q_2^{2} = H_2$, de donde
      $B = \dfrac{H_2 - H_1}{Q_1^{2} - Q_2^{2}}$ y $A = H_1 + B\,Q_1^{2}$.
    porque: |
      Es lo que queda cuando los dos puntos están en la misma curva de la
      bomba, y así salen los dos resultados impresos: en la ordinaria de 2024,
      $H_m = 73{,}41 - 2{,}17\cdot 10^{-3}\,Q^{2}$ con $Q$ en l/s. Si $B$ sale
      negativa, la curva de la bomba subiría con el caudal: algún punto está
      mal puesto.
    minimo: true
  - punto: |
      **Las unidades de $Q$, dichas y las mismas en las dos curvas.**
    porque: |
      $B$ cambia en un factor de un millón según $Q$ vaya en l/s o en m³/s.
      El segundo parcial de 2020 imprime sin unidades la curva de la
      instalación, que solo funciona con $Q$ en l/s, y la de la bomba,
      $50{,}74 - 5333{,}53\,Q^{2}$, que solo funciona con $Q$ en m³/s: son
      coherentes, pero solo se ve evaluando las dos al mismo caudal. Una
      curva de la bomba sin unidades no se puede cortar con nada.
