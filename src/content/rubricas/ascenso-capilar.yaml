# Rúbrica compartida (fase I de Fluidos, unidad i-rub, 29 de septiembre de
# 2026). La deducción del ascenso capilar en un tubo de sección cualquiera,
# generalizando la del tubo circular de la diapositiva 29 del tema 2 (numerada
# por su pie; es la 22 del PDF), con los dos casos de la 28 y la definición de
# la 27. La práctica 3 del guion pide lo mismo, «deducción de la ley de
# Jurin para tubos y placas». No sustituye a ninguna rúbrica escrita.
#
# Cae, pedida como deducción, en dos convocatorias: 2223-ext-1 a) (sección
# rectangular b × 2b) y 2324-ord-1 b) (entre un tubo cuadrado y otro
# circular, «de cualquier fluido»). La usan en un cálculo sin pedirla
# 2122-ext-1 (tubo circular) y 2425-ord-2 (tubo cuadrado): mapa.md.
#
# Los `minimo` son las fuerzas del menisco, el equilibrio vertical, el
# perímetro y el área de la sección concreta, y el signo: con esos cuatro la
# expresión sirve para cualquier tubo y para subir o bajar.
titulo: El ascenso capilar en un tubo de cualquier sección
cuando: >-
  La expresión del ascenso o descenso capilar en un tubo que no es circular
  —rectangular, o el hueco entre dos tubos—, desde el equilibrio vertical de
  la columna entre la tensión superficial y el peso. Cae como deducción en
  dos de las dieciséis convocatorias, y la expresión se usa en otras dos para
  calcular un diámetro o corregir la lectura de un piezómetro.
puntos:
  - punto: |
      **Las fuerzas del menisco, dibujadas, y hacia dónde va**: la tensión
      superficial tira a lo largo de toda la línea de contacto con la pared,
      formando el ángulo de contacto $\theta$. Si el líquido moja, porque la
      adhesión gana a la cohesión, el menisco es cóncavo y el líquido sube;
      si no moja, es convexo y baja.
    porque: |
      Son los dos casos de la diapositiva 28 del tema 2, con sus ejemplos,
      agua y vidrio, mercurio y vidrio. La ordinaria de 2024 lo pide como
      apartado, «determinar claramente en la figura las fuerzas que
      condicionan la subida / bajada del fluido», y la práctica 3 del guion
      pide «el diagrama de fuerzas que conforman los meniscos». Sin el
      dibujo no se ve qué paredes tiran, que es el punto siguiente.
    minimo: true
  - punto: |
      **El equilibrio vertical de la columna levantada**: la componente
      vertical de la tensión superficial por el perímetro mojado equilibra
      el peso de la columna, $\sigma\cos\theta\cdot P = \gamma\cdot A\cdot h$,
      y de ahí $h = \sigma\cos\theta\,P/(\gamma A)$.
    porque: |
      Es el razonamiento de la diapositiva 29 del tema 2, «la componente
      vertical de la fuerza de tensión superficial debe equilibrar el peso de
      la columna de líquido de altura h», que allí se hace para el tubo
      circular. Con otra sección el equilibrio es el mismo y solo cambian el
      perímetro y el área. Copiar la fórmula del tubo circular para un
      rectángulo es justo lo que estos apartados ponen a prueba.
    minimo: true
  - punto: |
      **El perímetro de todas las paredes que moja el líquido, y el área
      libre entre ellas**: en un rectángulo de lados $b$ y $2b$, $P = 6b$ y
      $A = 2b^{2}$; entre un tubo cuadrado de lado $b$ y otro circular de
      diámetro $D$ metido dentro, $P = 4b + \pi D$ y
      $A = b^{2} - \pi D^{2}/4$.
    porque: |
      Son los dos casos de examen, y lo impreso lo confirma:
      $h = 3\sigma\cos\theta/(\gamma b)$ en la extraordinaria de 2023 y
      $h = 4\sigma\,(4b + \pi D)\cos\theta/\big(\gamma\,(4b^{2} - \pi D^{2})\big)$
      en la ordinaria de 2024. En el segundo el líquido moja las dos
      paredes, la de fuera y la de dentro, y las dos tiran: quien cuenta solo
      el cuadrado se deja el término $\pi D$.
    minimo: true
  - punto: |
      **El signo lo pone $\cos\theta$**: la misma expresión vale para el
      ascenso y para el descenso, y con $\theta > 90^{\circ}$ da una $h$
      negativa, el líquido por debajo del nivel exterior.
    porque: |
      La ordinaria de 2024 pide «la expresión válida para determinar el
      ascenso/descenso capilar de cualquier fluido». Fijar $\theta = 0$ por
      costumbre contesta solo a la mitad: el
      mercurio de la diapositiva 28 no moja y baja.
    minimo: true
  - punto: |
      **La comprobación con el tubo circular**: con $P = 2\pi R$ y
      $A = \pi R^{2}$, la expresión general tiene que dar la de la
      diapositiva, $h = 2\sigma\cos\theta/(\rho g R)$.
    porque: |
      Es una comprobación gratis: si tu expresión no se reduce a la de la
      diapositiva 29 del tema 2 para un círculo, el perímetro o el área están
      mal. La misma diapositiva da la ley de Jurin, $h\cdot D$ constante para
      una pareja de líquido y sólido a una temperatura dada, que sale de ahí.
  - punto: |
      **La tensión superficial en N/m**: es fuerza por unidad de longitud, y
      los enunciados la suelen dar en dyn/cm, que son
      $10^{-3}$ N/m.
    porque: |
      La diapositiva 27 del tema 2 la define como «la fuerza necesaria para
      mantener la unidad de longitud de membrana en equilibrio». De los
      cuatro ejercicios del cuadernillo que usan esta expresión, tres la dan en dyn/cm
      y el cuarto en J/m², que es lo mismo que N/m. Meter las dyn/cm como si
      fueran N/m da una altura mil veces mayor.
