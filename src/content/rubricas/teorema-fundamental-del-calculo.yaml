# Rúbrica compartida (fase D2 de la auditoría del 27 de septiembre de 2026).
# Sale de las dos demostraciones modelo que ya estaban escritas: la de la
# resolución de `ex1314-ord-2-barrow-y-la-campana-de-gauss` y la del apartado
# (b) de `ex1617-3ev-2-dos-demostraciones`, donde esta misma rúbrica estaba
# escrita a mano dentro del paso: la aditividad, el valor medio integral y el
# límite con la continuidad. Los `minimo` son el enunciado con su hipótesis,
# el valor medio integral nombrado y el límite con la continuidad usada otra
# vez; sin cualquiera de los tres no hay demostración. Usar este teorema para
# demostrar la regla de Barrow es otro ejercicio, con su rúbrica
# (`regla-de-barrow`).
titulo: La primera parte del teorema fundamental, enunciada y demostrada
cuando: >-
  Demuestra que si f es continua en [a,b], la función integral
  F(x) = ∫ₐˣ f(t) dt es derivable y F'(x) = f(x). Cae como «enunciar y
  demostrar el teorema fundamental del Cálculo Infinitesimal» en la ordinaria y
  en la extraordinaria de 2013-2014, las dos veces antes de estudiar la
  función integral de la campana de Gauss, y como apartado (b) de la tercera
  evaluación de 2016-2017, escrito en símbolos y sin nombrarlo.
puntos:
  - punto: |
      **El enunciado, con su hipótesis:** si $f$ es continua en $[a,b]$,
      $F(x)=\int_{a}^{x}f(t)\,dt$ es derivable y $F'(x)=f(x)$.
    porque: |
      La tesis son dos cosas, que la derivada existe y cuánto vale, y la
      hipótesis es la que las da: con $f$ solo integrable, $F$ es continua
      pero puede no ser derivable. Si $f$ salta, $F$ tiene un pico justo ahí.
    minimo: true
  - punto: |
      **El cociente incremental, con la aditividad de la integral:**
      $\dfrac{F(x+h)-F(x)}{h}=\dfrac{1}{h}\displaystyle\int_{x}^{x+h}f(t)\,dt$.
    porque: |
      Derivar es calcular el límite de este cociente, y la aditividad
      convierte el incremento de $F$ en la integral de un trozo pequeño, que es
      lo único que se sabe manejar.
  - punto: |
      **El teorema del valor medio integral, citado por su nombre:** como $f$
      es continua entre $x$ y $x+h$, existe $\xi_{h}$ entre los dos con
      $\int_{x}^{x+h}f(t)\,dt=f\left(\xi_{h}\right)h$, así que el cociente vale
      $f\left(\xi_{h}\right)$.
    porque: |
      Es el teorema que hace falta, y es la primera vez que entra la
      continuidad. Usar aquí la regla de Barrow sería circular: Barrow se
      deduce de lo que se está demostrando.
    minimo: true
  - punto: |
      **El límite, con la continuidad usada otra vez:** $\xi_{h}$ queda
      atrapado entre $x$ y $x+h$, así que $\xi_{h}\to x$ cuando $h\to0$, y por
      la continuidad de $f$ en $x$,
      $F'(x)=\lim_{h\to0}f\left(\xi_{h}\right)=f(x)$.
    porque: |
      Que $\xi_{h}$ tienda a $x$ no basta: hace falta que
      $f\left(\xi_{h}\right)$ tienda a $f(x)$, y eso es exactamente la
      continuidad en $x$. Son las dos veces que entra la hipótesis, y conviene
      que se vean las dos.
    minimo: true
  - punto: |
      **Lo que da, en una línea:** toda función continua tiene primitiva, y una
      función integral se deriva sin calcular la integral.
    porque: |
      Es la mitad del teorema que se usa después: el examen la pide para
      estudiar funciones integrales cuya integral no se puede escribir con
      funciones elementales, como la de $e^{-t^{2}/2}$.
