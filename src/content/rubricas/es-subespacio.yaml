# Rúbrica compartida (fase D0 de la auditoría del 27 de septiembre de 2026).
# La comprobación de siempre de que un subconjunto es subespacio, tal como la
# escriben las resoluciones modelo —el nulo con su motivo, dos elementos y dos
# escalares genéricos, la propiedad que cierra el conjunto y la conclusión— y
# como la da el tema 1. La usan
# `exalg2223-ord-2-el-nucleo-dado-y-la-matriz-que-sale-de-el` (a), donde el
# primer punto es la definición del núcleo que el enunciado pide, y
# `exalg2324-ext-1-dos-combinaciones-y-las-matrices-de-traza-nula` (b). Los
# `minimo` son la condición del conjunto, el nulo, los elementos genéricos y
# la propiedad que cierra. El subespacio propio y la suma de dos subespacios
# llevan rúbrica propia, porque cada uno tiene un detalle que esta no mira.
titulo: Un subconjunto es subespacio, con el nulo y las combinaciones lineales
cuando: >-
  La demostración de que un subconjunto dado por una condición es subespacio
  vectorial, comprobando que contiene al vector nulo y que es cerrado para las
  combinaciones lineales. Es la demostración más repetida de la asignatura:
  cae, con un disfraz u otro, en las ocho convocatorias transcritas. Aquí
  sirve para el núcleo de una aplicación lineal (ordinaria de 2022-2023,
  ejercicio 2) y para las matrices de traza nula (extraordinaria de 2023-2024,
  ejercicio 1).
puntos:
  - punto: |
      **El conjunto por su condición, y dónde vive:** qué tiene que cumplir
      un elemento para estar dentro. Por ejemplo,
      $\operatorname{Ker}\left(f\right)=\left\{\overline{x}\in V\;/\;f\left(\overline{x}\right)=\overline{0}\right\}$,
      un subconjunto de $V$, el espacio de partida.
    porque: |
      Es la condición que se va a comprobar dos veces, con el nulo y con la
      combinación. Y cuando el enunciado pide definir el conjunto —el núcleo,
      por ejemplo—, esta línea es la definición y se puntúa aparte.
    minimo: true
  - punto: |
      **El criterio, dicho antes de usarlo:** un subconjunto no vacío es
      subespacio si
      $\alpha\overline{x}+\beta\overline{y}$ vuelve a estar dentro para
      cualesquiera $\overline{x},\overline{y}$ del conjunto y
      $\alpha,\beta\in K$.
    porque: |
      Sin decir qué se comprueba, lo que sigue es una lista de cuentas sin
      conclusión. Y la forma con la combinación ahorra escribir dos
      comprobaciones, la suma y el producto por un escalar; si se hacen por
      separado, tienen que estar las dos.
  - punto: |
      **El vector nulo, con su motivo concreto.** En el núcleo,
      $f\left(\overline{0}\right)=\overline{0}$ por ser $f$ lineal; en las
      matrices de traza nula, $\operatorname{traza}\left(O\right)=0$.
    porque: |
      Es lo que asegura que no es vacío, y la comprobación más barata: si el
      nulo no está, el conjunto no es subespacio y se acabó. Escribir que el
      nulo está sin decir por qué es afirmar justo lo que había que comprobar.
    minimo: true
  - punto: |
      **Dos elementos y dos escalares cualesquiera**, no un ejemplo con
      números.
    porque: |
      Cerrado significa para **todos**. Un ejemplo que funciona no demuestra
      nada; lo único que se demuestra con un ejemplo es que un conjunto **no**
      es subespacio, con un contraejemplo concreto.
    minimo: true
  - punto: |
      **La propiedad que cierra el conjunto, nombrada donde entra.** En el
      núcleo, la linealidad de $f$:

      $$
      f\left(\alpha\overline{x}+\beta\overline{y}\right)
      =\alpha f\left(\overline{x}\right)+\beta f\left(\overline{y}\right)
      =\overline{0}
      $$

      En las matrices de traza nula, que la traza es lineal:

      $$
      \operatorname{traza}\left(\alpha A+\beta B\right)
      =\alpha\operatorname{traza}\left(A\right)+\beta\operatorname{traza}\left(B\right)
      =0
      $$
    porque: |
      Es el único sitio donde entra lo que hace especial al conjunto, y sin
      nombrarlo la cuenta parece una casualidad. Y hay que nombrar la
      propiedad buena: la traza es lineal pero **no** multiplicativa, y el
      producto de matrices ni siquiera hace falta, porque un subespacio solo
      tiene que aguantar sumas y productos por escalares.
    minimo: true
  - punto: |
      **La conclusión, con el espacio:** «luego es subespacio vectorial de…»,
      y el espacio escrito.
    porque: |
      Un subconjunto no es subespacio en abstracto, sino de un espacio
      concreto: el núcleo lo es del espacio de partida, no del de llegada, y
      las matrices de traza nula lo son de
      $M_{2\times2}\left(\mathbb{R}\right)$. Es media línea, y distingue haber
      entendido la definición de haberla recitado.
