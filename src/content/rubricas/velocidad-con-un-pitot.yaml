# Rúbrica compartida (fase I de Fluidos, unidad i-rub, 29 de septiembre de
# 2026). NUEVA: no estaba en la lista de candidatas del plan. La velocidad
# de un flujo medida con un Pitot y una toma estática —un piezómetro abierto
# o el tubo exterior de un Prandtl— unidos por un manómetro en U, tal como la
# dan las diapositivas 3 a 8 del tema 13. No sustituye a ninguna rúbrica
# escrita.
#
# Nace del recuento: el plan ponía 2526-ord-4 entre los micromanómetros, y su
# manómetro en U está conectado a un tubo de Prandtl en la tubería D2 (visto
# en la figura a 300 ppp). Con esa corrección, esta deducción cae pedida en
# tres convocatorias: 2021-2par-2 d) («deducir previamente la expresión de
# cálculo»), 2425-ext-9 a) («obtener la ecuación que define la velocidad del
# avión en función de la lectura manométrica») y 2526-ord-4 b), cuya NOTA
# exige demostrar toda expresión. Tres unidades de examen tienen encargado un
# `redactar` sobre ella; sin este fichero serían tres rúbricas en línea de lo
# mismo. Si la sesión principal no la quiere, se borra el fichero y no cambia
# nada más.
#
# Los `minimo` son qué mide cada toma, Bernoulli hasta el punto de
# estancamiento, la hidrostática del manómetro y la expresión final; la NOTA
# de 2526-ord-4 va citada literal en el último de ellos.
titulo: La velocidad medida con un Pitot y un manómetro diferencial
cuando: >-
  La expresión de la velocidad de un flujo en función de la lectura de un
  manómetro en U conectado a un tubo de Pitot y a una toma de presión
  estática, piezómetro abierto o tubo de Prandtl. Cae pedida como deducción en
  tres de las dieciséis convocatorias: una gasolina en una tubería, el
  avión con un Pitot a cada lado, y un depósito con boquilla cuya nota exige
  demostrar toda expresión que se use.
puntos:
  - punto: |
      **Qué mide cada toma**: el Pitot, con la boca de cara al flujo, mide la
      presión total, porque en su boca el fluido se para; el piezómetro o
      los orificios laterales del tubo estático miden la presión estática; y
      la diferencia entre las dos es la presión dinámica, $V^{2}/2g$.
    porque: |
      Es la clasificación de la diapositiva 3 del tema 13: el Pitot mide la
      presión total, y la presión dinámica se mide con la combinación de
      piezómetro y Pitot o con la de tubo estático y Pitot, que es el tubo de
      Prandtl. La diapositiva 6 da la razón, «en el punto de estancamiento
      $V_F = 0$». Leer un Pitot como si fuera una toma estática deja toda la
      deducción sin sentido: la diferencia que mide el manómetro ya no es la
      presión dinámica.
    minimo: true
  - punto: |
      **Bernoulli entre un punto del flujo sin perturbar y la boca del
      Pitot**, a la misma cota y sin pérdidas:
      $\dfrac{P_1}{\gamma} + \dfrac{V_1^{2}}{2g} = \dfrac{P_2}{\gamma}$.
    porque: |
      Es el primer recuadro de la diapositiva 8 del tema 13, y el de la 7
      una vez corregido: la 7 escribe, por errata,
      $P_2/\gamma = P_2/\gamma + V_2^{2}/2g$. En el punto de estancamiento
      la altura cinética se ha convertido en presión.
      Las dos hipótesis hay que decirlas, porque son las que permiten que en
      la ecuación no quede ni una cota ni una pérdida.
    minimo: true
  - punto: |
      **La hidrostática por el manómetro, de una toma a la otra**:
      $\dfrac{P_2 - P_1}{\gamma} = R\left(\dfrac{s_0}{s} - 1\right)$ en
      columna del fluido que circula, con $s_0$ el líquido manométrico y $s$
      el que circula.
    porque: |
      Es la segunda parte de la diapositiva 7 del tema 13 (que escribe
      $-(R+1)$ donde va $-(R+a)$), y la de la 8 para
      el tubo de Prandtl. Al recorrer el manómetro, la distancia del eje de
      la tubería al primer menisco aparece sumando y restando y se cancela:
      si arrastras esa distancia hasta el final, algo está mal. El $-1$ es la
      columna del propio fluido que circula dentro de la rama del manómetro.
    minimo: true
  - punto: |
      **La velocidad, despejada**:
      $V_1 = \sqrt{2gR\left(\dfrac{s_0}{s} - 1\right)}$. En un gas, $s$ es
      la del gas, y con mercurio frente a aire el $-1$ apenas cuenta. Y es
      la velocidad en el punto de la boca, no la media de la sección.
    porque: |
      Es el recuadro final de la diapositiva 7, y los tres enunciados lo
      piden deducido, no recordado: «deducir previamente la expresión de
      cálculo» (segundo parcial de 2021), «obtener la ecuación que define la
      velocidad del avión en función de la lectura manométrica»
      (extraordinaria de 2025) y la nota de la ordinaria de 2026: «Toda
      expresión empleada en el cálculo de este ejercicio debe demostrarse de
      forma breve y concisa». La extraordinaria de 2025 imprime la misma
      expresión con la densidad relativa del aire. Lo de la boca lo recuerda
      el resultado impreso de la extraordinaria de 2024: el Pitot da «la
      velocidad de un punto del eje», y el rotámetro, un valor promedio.
    minimo: true
  - punto: |
      **El líquido manométrico, más pesado que el que circula**, en la U
      normal de la diapositiva; y cuanto más se le parece, más larga es la
      lectura para la misma velocidad.
    porque: |
      La figura de la diapositiva 7 lo escribe, $s_0 > s$. Con uno más ligero
      en esa U, el fluido que circula lo desplaza y se lo lleva: es la
      respuesta impresa del segundo parcial de 2021 cuando se cambia la
      gasolina por agua, «No se puede usar con agua ya que el agua es más
      densa y el agua arrastraría el líquido manométrico». En ese mismo
      ejercicio, 3,4 cm de altura cinética se leen como medio metro de
      columna, porque las dos densidades se parecen.
  - punto: |
      **Dónde vale la toma estática**: en una sección donde las líneas de
      corriente son paralelas.
    porque: |
      La diapositiva 4 del tema 13 pone la condición: si las líneas de
      corriente son paralelas, en el plano perpendicular al flujo la
      variación de presión es hidrostática, y el piezómetro lee la presión
      del flujo. Una toma en un codo, donde las líneas se curvan, lee otra
      cosa, y la diferencia con el Pitot deja de ser solo la presión
      dinámica.
