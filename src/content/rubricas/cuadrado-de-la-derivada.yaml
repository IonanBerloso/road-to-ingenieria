# Rúbrica compartida (fase D0 de la auditoría del 27 de septiembre de 2026).
# Sale de las resoluciones modelo que ya estaban escritas en
# `ex1718-ext-2-el-cuadrado-de-la-derivada` y
# `ex2324-ext-2-el-cuadrado-de-la-derivada`, que tienen el mismo enunciado y
# la misma figura: h' = 2f'f'', los signos leídos en el dibujo, la tabla y los
# tres extremos. Los `minimo` son lo que las dos resoluciones dicen que se
# puntúa: la derivada de h, cada signo justificado con lo que se ve, los
# mínimos con h = 0 y el máximo en la inflexión, que es el que se escapa.
titulo: El crecimiento y los extremos de h = (f')², leídos en la gráfica de f
cuando: >-
  Estudia el crecimiento y los extremos locales de h(x) = (f'(x))² cuando f
  solo se conoce por su gráfica, con un máximo, una inflexión y un mínimo.
  Cae con el mismo enunciado y la misma figura en las extraordinarias de
  2017-2018 y de 2023-2024, con siete u ocho puntos de COMP4 y ninguna
  cuenta.
puntos:
  - punto: |
      **La derivada de $h$, por la regla de la cadena**:
      $h'(x) = 2f'(x)\,f''(x)$, y su signo es el **producto** de los signos de
      $f'$ y de $f''$.
    porque: |
      Es todo el ejercicio. El 2 no decide nada, y el valor de $f$ no aparece
      en ningún sitio: $h$ se construye con la pendiente, no con la altura.
      Mirar solo dónde crece $f$ da la mitad del producto, y el signo puede
      salir al revés.
    minimo: true
  - punto: |
      **Los tres puntos que parten el intervalo, con nombre**: el máximo
      $x_1$, la inflexión $x_2$ y el mínimo $x_3$, con
      $a < x_1 < x_2 < x_3 < b$.
    porque: |
      Son los únicos sitios donde $h'$ puede cambiar de signo: los dos ceros
      de $f'$ y el de $f''$. Sin nombrarlos no hay tabla que escribir.
  - punto: |
      **Cada signo justificado con lo que se ve, y la tabla**: $f'$ por si la
      curva sube o baja, $f''$ por hacia dónde abre. Con eso, $h$ decrece en
      $(a,x_1)$, crece en $(x_1,x_2)$, decrece en $(x_2,x_3)$ y crece en
      $(x_3,b)$.
    porque: |
      No hay fórmula de $f$, así que la única justificación posible es la
      lectura del dibujo, y es la que se corrige. Un signo sin su porqué es
      un signo copiado.
    minimo: true
  - punto: |
      **Los mínimos en $x_1$ y $x_3$**: allí $f' = 0$ y por tanto $h = 0$, y
      como $h$ es un cuadrado nunca baja de cero, son **mínimos absolutos**.
    porque: |
      Sale sin derivar nada más: el valor más bajo que puede tomar un
      cuadrado es 0, así que donde $f$ tiene sus extremos $h$ toca su suelo.
      Decir que son absolutos es más de lo que se pide, y es gratis.
    minimo: true
  - punto: |
      **El máximo local en la inflexión $x_2$**: allí $f'' = 0$ con
      $f' \neq 0$, y $h'$ pasa de $+$ a $-$.
    porque: |
      Es el extremo que más se pierde. Elevar al cuadrado no conserva los
      extremos, y aquí ni siquiera se eleva $f$: en el máximo de $f$ hay un
      **mínimo** de $h$, y el máximo de $h$ está donde la pendiente de $f$ es
      más pronunciada, que en ese tramo es la inflexión.
    minimo: true
  - punto: |
      **El criterio usado**: el cambio de signo de $h'$, no la segunda
      derivada de $h$.
    porque: |
      Con una función dada solo por su dibujo no hay forma de derivar $h$ dos
      veces. El criterio de la primera derivada es el único disponible, y
      decirlo es parte del rigor que se puntúa.
  - punto: |
      **La lectura en una frase**: $h$ mide lo empinada que está $f$, sin
      importar hacia dónde.
    porque: |
      Es cero donde $f$ está horizontal y máxima donde está más inclinada.
      Escrita y justificada, esa frase resume la tabla entera y sirve para
      comprobarla mirando el dibujo.
