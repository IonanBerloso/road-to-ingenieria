# Rúbrica compartida (fase D2 de la auditoría del 27 de septiembre de 2026).
# Sale de las resoluciones modelo que ya estaban escritas en los tres
# ejercicios de examen que piden los valores «justificando la respuesta»:
# `ex2425-ext-10-la-ampliacion-par-de-t-mas-pi`,
# `ex2425-ord-8-fourier-con-meseta` y
# `ex2526-ord-8-fourier-de-la-ampliacion-impar`. Las tres hacen lo mismo con
# cada punto: lo llevan al periodo básico, miran si allí hay salto, aplican
# Dirichlet —la función donde es continua, la media de los laterales donde
# salta— y dan el valor de la función aparte, que en un salto puede no
# existir. La usa también `cuando-la-funcion-ni-existe`, el ejercicio 11.6 del
# tema 11, que es el de la ordinaria de 2016-2017 y pide lo mismo sin la
# palabra «justificando».
#
# Las condiciones de Dirichlet no las escribe ninguna de las tres
# resoluciones, que nombran el teorema y nada más. Entran, y como mínimo,
# porque el tema 11 dice que son lo que el examen puntúa cuando pide
# «justificando la respuesta»; se escriben con sus palabras (sección
# «Dirichlet: a qué converge la serie donde la función salta»). Los otros
# cuatro `minimo` son los pasos que las resoluciones sí escriben para cada
# punto: sin la reducción, la decisión de si hay salto, el valor de la serie
# o el de la función, uno de los dos números que pide el enunciado se queda
# sin justificar. El dibujo no es mínimo: comprueba, no justifica.
titulo: Los valores de la serie de Fourier en unos puntos, justificados con Dirichlet
cuando: >-
  Calcula, justificando la respuesta, el valor de la serie de Fourier S(t) y el
  de la función —f(t), o F(t) si es una ampliación— en unos puntos dados, que
  hay que llevar primero al periodo básico. La justificación es el teorema de
  Dirichlet, con sus condiciones escritas como en el tema 11. Cae con esas
  palabras en la ordinaria y la extraordinaria de 2024-2025 y en la ordinaria
  de 2025-2026, dentro del ejercicio de Fourier del segundo parcial. Sin
  «justificando», la misma pregunta está en doce convocatorias anteriores, de
  la ordinaria de 2016-2017 a la extraordinaria de 2023-2024, y la de 2016-2017
  es el ejercicio 11.6 del tema 11.
puntos:
  - punto: |
      **Las condiciones de Dirichlet, dichas para la función cuya serie has
      calculado** —la ampliada, si el enunciado amplía—: es periódica y, en
      un periodo, **continua a trozos**, con un número finito de
      discontinuidades, todas de salto y con límites laterales finitos, y
      **derivable a trozos**. Y lo que da el teorema: la serie converge en
      todo $t$, a la función donde es continua y a la media de los límites
      laterales donde salta.
    porque: |
      Es lo que pide «justificando la respuesta»: sin el teorema y sus
      condiciones, los valores que vienen detrás son afirmaciones sin apoyo.
      Una función hecha de un número finito de tramos de polinomio las
      cumple, y por eso lo que se evalúa es decirlo. Cada condición sostiene
      la fórmula: con una asíntota dentro del periodo, como la de $\tan t$
      en $t=\frac{\pi}{2}$, no hay límites laterales finitos que promediar.
    minimo: true
  - punto: |
      **Cada punto, llevado al periodo básico con la cuenta escrita**:
      $t_0-kT$, con $k$ entero —negativo si $t_0$ es negativo— y $T$ el
      periodo de la función ampliada, hasta caer en el intervalo donde está
      escrita su fórmula.
    porque: |
      La serie y la función repiten cada $T$, así que en $t_0$ valen lo mismo
      que en el punto reducido; la fórmula, en cambio, solo está escrita en
      un periodo, y sustituir en ella el punto sin reducir da un número que
      no es ni el de la serie ni el de la función. La cuenta enseña además
      qué periodo has usado: una ampliación de $(0,\pi)$ tiene periodo
      $2\pi$, y reducir con $\pi$ lleva el punto a otro sitio. En una
      ampliación impar, $\frac{3\pi}{2}$ caería en $\frac{\pi}{2}$ en vez de
      en $-\frac{\pi}{2}$, donde la función vale lo opuesto.
    minimo: true
  - punto: |
      **Salto o no, decidido en cada punto reducido**: dentro de un tramo la
      función es continua; en un empalme de dos tramos, o en la costura
      entre dos periodos, se escriben los dos límites laterales y se
      comparan. En la costura, el de la izquierda sale del final del periodo
      y el de la derecha, de su principio.
    porque: |
      Un salto no siempre está donde la fórmula cambia de expresión: dos
      tramos pueden empalmar sin salto por dentro del periodo, y la función
      puede saltar al pasar de un periodo al siguiente, que es algo que la
      fórmula no enseña. En una ampliación impar, además, el origen salta en
      cuanto la función del enunciado no tiende a $0$ allí.
    minimo: true
  - punto: |
      **El valor de la serie, por Dirichlet**: donde no hay salto,
      $S(t_0)=F(t_0)$ —el límite común, si $F$ no está definida en ese
      punto—; en un salto, $S(t_0)=\dfrac{F(t_0^{-})+F(t_0^{+})}{2}$, la
      media de los dos límites que acabas de escribir.
    porque: |
      Son las dos ramas del teorema, y cada punto usa una. La igualdad con
      $F$ es un resultado, no una definición: la serie es otra función,
      hecha de senos y cosenos, y coincide con $F$ solo donde $F$ es
      continua. En un salto no elige lado, se queda en medio: contestar con
      uno de los dos límites es dar el valor de un solo lado.
    minimo: true
  - punto: |
      **$F(t_0)$ aparte de $S(t_0)$**: el valor de la función sale de su
      definición —la del enunciado, o la de la ampliación que has escrito—,
      y si el punto reducido queda fuera de los intervalos donde está
      definida, se escribe que **no está definida** ahí.
    porque: |
      Son dos objetos, y el enunciado pregunta por los dos. La serie existe
      en todo $\mathbb{R}$, porque es una suma de senos y cosenos; la
      función, solo donde la definen, y un intervalo abierto o una
      desigualdad estricta dejan fuera los extremos de un tramo, que es donde
      puede estar el salto. Ponerle a $F$ el valor de $S$, o uno de sus
      límites laterales, es inventarse un dato que el enunciado no da.
    minimo: true
  - punto: |
      **El dibujo de la función, usado para comprobar**: varios periodos, con
      cada salto marcado y un punto a la altura de la media.
    porque: |
      Es donde se ve un salto que la fórmula esconde —en la costura, o en el
      origen de una ampliación impar— y donde se comprueba que el punto
      reducido cae en el tramo que dice la cuenta. No sustituye a los límites
      escritos: los confirma.
