# Rúbrica compartida (fase P, unidad p9m, 22 de octubre de 2026). Es, punto
# por punto, la que ya estaba escrita en el paso `redactar` de
# `exerm1920-2par-4-la-ecuacion-de-los-tres-momentos`, y la usa también
# `exerm1718-ext-2-la-ecuacion-de-los-tres-momentos`, que pide la misma
# deducción sin «Deducir la» delante. No cambia nada del texto: el
# enunciado de 2020 no lo citaba. Las ecuaciones son las de los apuntes del
# tema 11, apartado 11.3 (pp. 5-7, figuras 11.3 a 11.7).
#
# En el sitio, la pregunta cae de teoría y con 1 punto como cuestión 2 de la
# extraordinaria del 14 de junio de 2018 («Ecuación de los 3 momentos») y
# como cuestión 4 de la segunda parte del 7 de enero de 2020 («Deducir la
# ecuación de los 3 momentos.»). No cae como teoría en ningún otro
# examen del sitio.
#
# Los `minimo` son el sistema isostático, los diagramas de cada vano, la
# viga conjugada y la ecuación: sin cualquiera de ellos no hay deducción. El
# último, los casos, se puntúa pero no es mínimo.
titulo: La ecuación de los tres momentos, deducida
cuando: >-
  Deducir la ecuación de los tres momentos de una viga continua, del sistema
  isostático con los flectores de los apoyos como incógnitas a la ecuación
  11.3, con el voladizo y el empotramiento. Cae como cuestión de teoría de 1
  punto en la extraordinaria de junio de 2018 y en la segunda parte de enero
  de 2020.
puntos:
  - punto: >-
      Viga continua de N vanos y N + 1 apoyos, hiperestática de grado N − 1.
      Se libera el giro encima de cada apoyo intermedio y se ponen sus
      flectores Mi como incógnitas; quedan N vigas biapoyadas (figuras 11.3
      y 11.4).
    porque: >-
      Es el sistema isostático equivalente, y la condición que falta es la
      que se ha liberado.
    minimo: true
  - punto: >-
      En cada vano [i], con inercia Ii, el flector es la suma de dos rectas,
      la de Mi−1 y la de Mi, y del diagrama isostático de las cargas, de área
      Ai y centro de gravedad a ai del apoyo izquierdo y a bi del derecho.
    porque: >-
      Son los tres diagramas cuyas áreas y centros entran en la viga
      conjugada.
    minimo: true
  - punto: >-
      Con la viga conjugada, los giros de los dos lados del apoyo i son los
      cortantes conjugados de los vanos [i] e [i + 1] (ecs. 11.1 y 11.2,
      p. 6), con los descensos de los apoyos si los hay.
    porque: >-
      Es el paso que convierte la condición de giros en una ecuación con los
      flectores.
    minimo: true
  - punto: >-
      Igualando los dos giros y multiplicando por 6E sale la ecuación (11.3,
      p. 7), Mi−1 Li/Ii + 2Mi (Li/Ii + Li+1/Ii+1) + Mi+1 Li+1/Ii+1 =
      −6Ai ai/(Li Ii) − 6Ai+1 bi+1/(Li+1 Ii+1), más el término de los
      descensos de los apoyos.
    porque: >-
      Es la ecuación que pide la pregunta.
    minimo: true
  - punto: >-
      Casos: con la misma inercia y apoyos fijos queda la ec. 11.4; un
      voladizo se cambia por su flector en el apoyo (figura 11.6), y un
      empotramiento, por un vano ficticio de inercia infinita (figura 11.7).
    porque: >-
      Es como se usa en los problemas, y el empotramiento es el caso que más
      se olvida.
