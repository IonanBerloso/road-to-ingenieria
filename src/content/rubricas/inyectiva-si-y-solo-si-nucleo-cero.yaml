# Rúbrica compartida (fase D0 de la auditoría del 27 de septiembre de 2026).
# Sale de la demostración modelo que ya estaba escrita en las resoluciones de
# `exalg2122-ord-2-tres-datos-cruzados-y-el-nucleo-por-ecuaciones` y
# `exalg2425-ord-2-inyectiva-si-y-solo-si-el-nucleo-es-cero`, y del tema 2:
# las dos direcciones, la linealidad en cada una —f(0) = 0 a la ida, la resta
# a la vuelta— y el núcleo al final. Los `minimo` son las dos direcciones, los
# dos sitios donde entra la linealidad y el paso por el núcleo. El
# contraejemplo de x² es el que dan las dos resoluciones.
titulo: Una aplicación lineal es inyectiva si y solo si su núcleo es el cero
cuando: >-
  Demuestra las dos implicaciones de f inyectiva ⟺ Ker(f) = {0} para una
  aplicación lineal f. Cae entero como apartado a) del ejercicio 2 en las
  ordinarias de 2021-2022 y de 2024-2025. La extraordinaria de 2023-2024 pide
  solo la vuelta —núcleo trivial implica inyectiva— y su ejercicio lleva la
  rúbrica escrita en el paso.
puntos:
  - punto: |
      **Anunciar las dos direcciones** y escribir cada una bajo su flecha,
      $\Rightarrow$ y $\Leftarrow$.
    porque: |
      Es un «si y solo si»: demostrar una sola implicación es demostrar medio
      teorema, y es lo que más se entrega. Separarlas desde el principio deja
      claro qué se supone en cada mitad.
    minimo: true
  - punto: |
      **$\Rightarrow$:** si $\overline{x}\in\operatorname{Ker}\left(f\right)$,
      entonces
      $f\left(\overline{x}\right)=\overline{0}=f\left(\overline{0}\right)$, y la
      inyectividad obliga a $\overline{x}=\overline{0}$.
    porque: |
      El paso que se salta es $f\left(\overline{0}\right)=\overline{0}$, y sale
      de la linealidad: es el primer sitio donde se usa. Sin él no hay dos
      vectores con la misma imagen a los que aplicar la definición de
      inyectiva.
    minimo: true
  - punto: |
      **$\Leftarrow$, empezando por lo que se supone:** sean $\overline{x}$ e
      $\overline{y}$ con $f\left(\overline{x}\right)=f\left(\overline{y}\right)$;
      hay que llegar a $\overline{x}=\overline{y}$.
    porque: |
      Inyectiva significa «imágenes iguales, originales iguales», así que ese
      es el primer renglón. Arrancar por $\overline{x}=\overline{y}$ es escribir
      la demostración al revés, y no demuestra nada.
  - punto: |
      **La linealidad, dicha donde entra:**
      $f\left(\overline{x}-\overline{y}\right)=f\left(\overline{x}\right)-f\left(\overline{y}\right)=\overline{0}$.
    porque: |
      Es el segundo sitio donde se usa, y sin ella el teorema es falso:
      $f\left(x\right)=x^{2}$ en $\mathbb{R}$ solo anula al $0$ y no es
      inyectiva, porque $f\left(2\right)=f\left(-2\right)$.
    minimo: true
  - punto: |
      **Pasar por el núcleo y cerrar:**
      $\overline{x}-\overline{y}\in\operatorname{Ker}\left(f\right)=\left\{\overline{0}\right\}$,
      luego $\overline{x}=\overline{y}$ y $f$ es inyectiva.
    porque: |
      La hipótesis de esta mitad es que el núcleo es
      $\left\{\overline{0}\right\}$, y hay que verla entrar: saltar de la resta
      a $\overline{x}=\overline{y}$ sin nombrar el núcleo se come el dato. Y la
      última palabra tiene que ser «inyectiva», que es lo que se pedía.
    minimo: true
