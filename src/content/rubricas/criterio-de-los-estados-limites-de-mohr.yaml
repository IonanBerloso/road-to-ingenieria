# Rúbrica compartida (fase P, unidad p9o, 22 de octubre de 2026). Es, punto
# por punto, la que ya estaba escrita en el paso `redactar` de
# `exerm1819-1par-3-el-criterio-de-los-estados-limites-de-mohr`, y la usa
# también `exerm1617-ext-1-el-criterio-de-mohr-deducido`, que pide lo mismo
# con «Deducir el» delante. No cambia nada del texto: el enunciado de 2018
# no lo citaba. Las ecuaciones son las de los apuntes del tema 6, apartado
# 6.4 (pp. 6-9, figuras 6.1 a 6.3).
#
# En el sitio, la pregunta cae de teoría y con 1 punto como cuestión 1 de la
# extraordinaria del 16 de junio de 2017 («Deducir el criterio de los
# estados límites de Mohr.»), como cuestión 3 del primer parcial del 16 de
# noviembre de 2018 y como cuestión 2 del examen final del 13 de enero de
# 2023 («Criterio de los estados límites de Mohr.»).
#
# Los `minimo` son la curva intrínseca, la recta, sen ϕ, la tensión
# equivalente y la condición de no fallo: sin cualquiera de ellos no hay
# criterio. El último, los casos, se puntúa pero no es mínimo.
titulo: El criterio de los estados límites de Mohr
cuando: >-
  Deducir o explicar el criterio de los estados límites de Mohr, de la curva
  intrínseca a la tensión equivalente σeqv = σ1 − kσ3 y la condición de no
  fallo. Cae como cuestión de teoría de 1 punto en la extraordinaria de junio
  de 2017, en el primer parcial de noviembre de 2018 y en el examen final de
  enero de 2023.
puntos:
  - punto: >-
      Se explica la curva intrínseca: la envolvente de los círculos de
      Mohr máximos de los estados que hacen fallar al material; no hay
      fallo si el círculo máximo queda dentro (fig. 6.1).
    porque: >-
      Es la idea del criterio. Sin ella, la recta no se sabe de dónde
      sale.
    minimo: true
  - punto: >-
      Se sustituye la curva por la recta tangente a los círculos de
      tracción pura (0, σet) y compresión pura (−σec, 0), con su
      dibujo (fig. 6.2).
    porque: >-
      Son los dos ensayos que se tienen. Un dibujo sin los dos
      círculos y la recta tangente deja la deducción sin soporte.
    minimo: true
  - punto: >-
      Se obtiene sen ϕ = (σec − σet)/(σec + σet) = (1 − k)/(1 + k),
      con k = σet/σec (ecs. 6.11 y 6.12).
    porque: >-
      Es la geometría de los dos centros: diferencia de radios entre
      suma de radios. La definición de k, en ese orden, es la que se
      confunde.
    minimo: true
  - punto: >-
      Se define σeqv como el ensayo de tracción cuyo círculo tiene la
      tangente común con el círculo máximo del estado paralela a la
      recta intrínseca, y se plantea sen ϕ = QR/QS (fig. 6.3, ecs.
      6.13 y 6.14).
    porque: >-
      Es el paso que convierte un estado cualquiera en uno uniaxial
      equivalente, que es lo que hacen todos los criterios.
    minimo: true
  - punto: >-
      Se despeja σeqv = σ1 − kσ3 (ec. 6.15) y la condición de no fallo
      σeqv < σet (ec. 6.16).
    porque: >-
      Es el resultado que se usa. Sin la condición, el criterio no
      decide nada.
    minimo: true
  - punto: >-
      Se comenta que con k = 1 es Tresca, y que la compresión pura da
      σeqv = σet, así que la condición también la cubre; vale para
      materiales frágiles y dúctiles.
    porque: >-
      Son las dos comprobaciones que dicen que la fórmula está bien
      puesta, y las dos que el apunte cita.
