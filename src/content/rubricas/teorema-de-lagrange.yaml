# Rúbrica compartida (fase D0 de la auditoría del 27 de septiembre de 2026).
# Sale de la demostración modelo de
# `ex1516-ext-3-enunciar-y-demostrar-lagrange`, la que ya estaba escrita en su
# resolución: el enunciado con las dos hipótesis separadas, la curva menos la
# cuerda y Rolle aplicado a esa diferencia. La misma pregunta cae en la
# extraordinaria de 2012-2013 (`ex1213-ext-3-enunciar-y-demostrar-lagrange`),
# que lleva todavía su rúbrica escrita en el paso. Los `minimo` son el
# enunciado entero —las hipótesis en su intervalo y la tesis con su
# cuantificador—, la función auxiliar y las hipótesis de Rolle comprobadas
# sobre ella.
titulo: El teorema de Lagrange, enunciado y demostrado con Rolle
cuando: >-
  Enuncia y demuestra el teorema del valor medio: si f es continua en [a,b] y
  derivable en (a,b), existe c ∈ (a,b) con f'(c) = (f(b) − f(a))/(b − a).
  Cae como «enunciar y demostrar» en la extraordinaria de 2015-2016 y en la de
  2012-2013. Cuando el examen solo pide enunciarlo y comprobar si se aplica a
  una función, la demostración no entra y esta rúbrica tampoco.
puntos:
  - punto: |
      **Continua en el cerrado, derivable en el abierto**: cada hipótesis en
      su intervalo, $[a,b]$ y $(a,b)$.
    porque: |
      Escribir «continua y derivable en $[a,b]$» pierde el punto y además es
      un teorema más débil: dejaría fuera $\sqrt{x}$ en $[0,1]$, que tiene
      tangente vertical en el origen y cumple el teorema. Las dos hipótesis
      van en intervalos distintos a propósito.
    minimo: true
  - punto: |
      **La tesis con su cuantificador**: existe **al menos un**
      $c \in (a,b)$ con $f'(c) = \dfrac{f(b)-f(a)}{b-a}$.
    porque: |
      El teorema no dice cuántos hay ni dónde están. «El punto $c$» o «un
      único $c$» afirma algo falso —en $\mathrm{sen}\,x$ sobre $[0,2\pi]$ hay
      dos—, y poner $c$ en el cerrado admitiría $c = a$, que la demostración
      no da.
    minimo: true
  - punto: |
      **La función auxiliar, escrita entera**:
      $g(x) = f(x)-f(a)-\dfrac{f(b)-f(a)}{b-a}\,(x-a)$, y qué es: la
      distancia vertical de la curva a la cuerda.
    porque: |
      Es la única idea de toda la demostración; el resto es comprobación.
      Restar la cuerda fabrica una función que vale lo mismo en los dos
      extremos, que es lo que Rolle necesita y $f$ en general no cumple.
    minimo: true
  - punto: |
      **Las tres hipótesis de Rolle, comprobadas sobre $g$**: continua en
      $[a,b]$ y derivable en $(a,b)$ porque $f$ lo es y la cuerda es un
      polinomio; $g(a) = 0$ y $g(b) = 0$, calculados.
    porque: |
      Aplicar un teorema sin comprobar que se puede aplicar es el fallo que
      este ejercicio busca. $g(b) = f(b)-f(a)-\left(f(b)-f(a)\right) = 0$ se
      calcula, no se afirma.
    minimo: true
  - punto: |
      **Que $g'(c) = 0$ es la tesis**, con la equivalencia escrita:
      $g'(x) = f'(x)-\dfrac{f(b)-f(a)}{b-a}$.
    porque: |
      Sin derivar $g$, la demostración termina en Rolle y no en Lagrange. La
      derivada de la cuerda es la constante $\frac{f(b)-f(a)}{b-a}$, y
      despejarla es lo que devuelve el enunciado.
  - punto: |
      **La lectura geométrica y un contraejemplo**: en $c$ la tangente es
      paralela a la cuerda; y las hipótesis no sobran, porque
      $\left|x\right|$ en $[-1,1]$ tiene cuerda horizontal y ningún punto con
      $f' = 0$.
    porque: |
      Son los dos avisos que suman puntos: el dibujo impide olvidar la
      fórmula, y el contraejemplo enseña para qué está cada hipótesis.
