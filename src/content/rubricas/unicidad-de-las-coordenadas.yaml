# Rúbrica compartida (fase D0 de la auditoría del 27 de septiembre de 2026).
# Sale de la demostración modelo que ya estaba escrita en las resoluciones de
# `exalg2122-ext-1-un-subespacio-por-generadores-y-otro-por-ecuaciones` (a.ii)
# y `exalg2425-ext-1-las-coordenadas-son-unicas-y-un-subespacio-de-matrices`
# (a), y del tema 1: dos expresiones, la resta, la definición de libre y la
# conclusión. Los `minimo` son los tres primeros pasos, sin los que no hay
# demostración. El último punto es el error que el tema 1 señala en esta
# demostración —concluir que la familia es base—, y el que caza la pieza
# trampa del mismo apartado en la extraordinaria de 2022-2023.
titulo: Sobre una familia libre, la expresión de un vector es única
cuando: >-
  Demuestra que si un vector se escribe como combinación lineal de una familia
  libre, los coeficientes son únicos, que es la unicidad de las coordenadas en
  una base. Cae en el apartado a) del ejercicio 1 de la extraordinaria de
  2021-2022 (a.ii), de la extraordinaria de 2022-2023 y de la extraordinaria
  de 2024-2025, que la pide detrás de definir base y coordenadas.
puntos:
  - punto: |
      **Suponer dos expresiones del mismo vector:**
      $\overline{x}=\sum\alpha_{i}\overline{u}_{i}=\sum\beta_{i}\overline{u}_{i}$.
    porque: |
      Demostrar que algo es único es suponer que hay dos y ver que coinciden.
      Escribir solo $\overline{x}=\sum\alpha_{i}\overline{u}_{i}$ y afirmar que
      los $\alpha_{i}$ son únicos es repetir el enunciado.
    minimo: true
  - punto: |
      **Restar y agrupar:**
      $\sum\left(\alpha_{i}-\beta_{i}\right)\overline{u}_{i}=\overline{0}$.
    porque: |
      Convierte «dos expresiones» en «una combinación igual al vector nulo»,
      que es de lo que habla la definición de libre. Sin este paso la
      hipótesis no tiene dónde entrar.
    minimo: true
  - punto: |
      **La definición de libre, escrita y aplicada:** la única combinación de
      la familia que da $\overline{0}$ es la de coeficientes todos nulos, luego
      $\alpha_{i}-\beta_{i}=0$ para todo $i$.
    porque: |
      Todo el peso de la demostración está en este paso. «Como son
      independientes, sale», sin decir qué significa independientes, no deja
      ver que la hipótesis se ha usado.
    minimo: true
  - punto: |
      **Cerrar con lo que se pedía:** $\alpha_{i}=\beta_{i}$ para todo $i$, así
      que las dos expresiones eran la misma.
    porque: |
      Es el renglón que ata la cuenta al enunciado —la expresión es única, las
      coordenadas son únicas— y el que se busca para dar el punto por cerrado.
  - punto: |
      **Decir qué se ha usado, y solo eso:** que la familia es **libre**, no
      que sea base.
    porque: |
      Ser sistema generador es lo que da la **existencia** de la expresión; la
      unicidad no lo necesita. Concluir de aquí que una familia libre es base
      es el error que más aparece con este enunciado:
      $\left\{\left(1,0,0\right)\right\}$ es libre en $\mathbb{R}^{3}$ y solo
      genera una recta.
