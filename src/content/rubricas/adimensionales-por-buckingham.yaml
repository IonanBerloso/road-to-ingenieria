# Rúbrica compartida (fase I de Fluidos, unidad i-rub, 29 de septiembre de
# 2026). Los seis pasos del teorema de pi tal como los dan la diapositiva 7
# del tema 16 y los Apuntes, vol. I, págs. 4 y 7-11 (el problema resuelto de
# la caída de presión en una tubería). Generaliza la rúbrica que estaba
# escrita en el paso de `exflu2526-ord-7-el-submarino-que-no-se-puede-ensayar`
# y la sustituye; lo que cambia está en `mapa.md` de la unidad.
#
# Cae en once convocatorias (recuento.mjs). En diez sirve entera:
# 1920-2par-2 a) y b), 2021-2par-4 a), 2021-ord-6 a), 2122-ord-8,
# 2223-ext-5 a), 2324-ord-7 a), 2324-ext-5 a), 2425-ord-5 a), 2425-ext-4 y
# 2526-ord-7 a). La undécima, 1920-ord-5 a), pide «el método rápido o
# intuitivo», que ni las diapositivas ni los Apuntes describen, y el punto
# del sistema de exponentes no le sirve: esa lleva su rúbrica en el paso
# (mapa.md).
#
# Los `minimo` son la lista de variables, sus dimensiones, el número de
# grupos, la comprobación de las repetidas y el despeje de cada grupo: son
# los pasos 1 a 5 de la diapositiva, y los enunciados de 1920-2par-2,
# 2122-ord-8, 2425-ord-5 y 2425-ext-4 los exigen con todas las letras.
titulo: Los parámetros adimensionales, por el teorema de pi
cuando: >-
  Obtener los parámetros adimensionales de un fenómeno por el teorema de pi o
  de Vaschy-Buckingham, con las variables repetidas que impone el enunciado o
  elegidas y justificadas. Cae en once de las dieciséis convocatorias, una
  de ellas con otro método, y en ocho es el primer apartado de un ejercicio
  de semejanza, que tiene su propia rúbrica. Varias lo exigen con palabras
  que puntúan: «uso
  obligatorio del teorema», «indicar claramente el procedimiento empleado y
  los pasos dados», «completar la tabla de potencias».
puntos:
  - punto: |
      **Todas las variables del fenómeno, y ninguna dos veces**: las $n$ que
      da el enunciado, contadas. Si da la viscosidad cinemática $\nu$ y la
      densidad $\rho$, no añadas además $\mu$, porque $\nu = \mu/\rho$: las
      tres juntas repiten información.
    porque: |
      Es el paso 1 de la diapositiva 7 del tema 16, «determinar todas las
      variables físicas implicadas», y todo lo demás cuelga de él: una
      variable de menos quita un grupo y una de más lo añade. Meter $\nu$,
      $\mu$ y $\rho$ a la vez da un grupo $\mu/(\rho\,\nu)$ que vale uno
      siempre y no describe nada; la diapositiva 8 escribe el número de
      Reynolds de las dos maneras, $\rho V D/\mu = V D/\nu$, precisamente
      porque son la misma información.
    minimo: true
  - punto: |
      **La ecuación de dimensiones de cada variable, en masa, longitud y
      tiempo, en una tabla**: una fila por dimensión y una columna por
      variable, con los exponentes.
    porque: |
      Son los pasos 2 y 3 de la diapositiva 7, y dos enunciados la piden con
      esas palabras: «indicar claramente las dimensiones de todas las
      variables involucradas (mediante una tabla por ejemplo)» y «completar
      la tabla de potencias». Además es donde se cazan las dimensiones que
      engañan: la tensión superficial es fuerza por unidad de longitud,
      $MT^{-2}$ (Apuntes, vol. I, pág. 8), y una variable sin dimensiones
      —un ángulo, una pendiente, una rugosidad relativa— es ya un grupo por
      sí sola.
    minimo: true
  - punto: |
      **Cuántos grupos salen, y de dónde sale ese número**: $n - m$, con $m$
      el número de dimensiones fundamentales que aparecen de verdad en la
      tabla.
    porque: |
      Es el teorema, diapositiva 6 del tema 16. Allí se lee «en la Mecánica
      de Fluidos $m = 3$ (M,L,T)» porque casi siempre aparecen las tres,
      pero no es una regla para restar tres a ciegas: en el vertedero en V de
      la extraordinaria de 2025 las variables son $Q$, $H$, $\theta$ y $g$,
      no hay masa en ninguna, $m = 2$, y lo impreso son dos grupos. Quien
      resta tres se queda con uno.
    minimo: true
  - punto: |
      **Por qué valen las variables repetidas**: tantas como dimensiones
      aparecen en la tabla, que entre todas las contengan, y que ninguna se
      pueda obtener combinando las otras —por ejemplo, una longitud y un
      volumen—. Si el enunciado las impone, se comprueba igual; si no valen,
      se dice y se propone otra lista.
    porque: |
      Es el paso 4 de la diapositiva 7, y los Apuntes (vol. I, pág. 4) añaden
      el ejemplo: «no se pueden tomar como variables repetidas una longitud
      (L) y un volumen (L³)». El segundo parcial de 2020 lo convierte en
      apartado —¿valen $\mu$, $\varepsilon$ y $c$?, y la respuesta impresa es
      que sí—, y otro de 2021 pide elegirlas «justificadamente». Con
      repetidas que no cubren las dimensiones, o que dependen unas de otras,
      el sistema de exponentes no tiene solución y se descubre a mitad del
      despeje.
    minimo: true
  - punto: |
      **Cada grupo despejado, no reconocido**: una de las otras variables
      por las repetidas elevadas a exponentes incógnita,
      $\pi_i = X_i\,r_1^{a}\,r_2^{b}\,r_3^{c}$, y el sistema de exponentes
      de masa, longitud y tiempo igualados a cero, resuelto.
    porque: |
      Es el paso 5 de la diapositiva 7, y así lo hacen los Apuntes (vol. I,
      págs. 8 a 10) con cada grupo del problema resuelto. Escribir «$\pi_2$
      es el número de Reynolds» sin el despeje contesta a otra pregunta, y el
      examen lo dice: «solo se valorarán los números adimensionales
      deducidos siguiendo estrictamente las condiciones impuestas y cuya
      deducción esté debidamente justificada» (segundo parcial de 2020),
      «indicar claramente el procedimiento empleado y los pasos dados»
      (ordinaria de 2025).
    minimo: true
  - punto: |
      **La comprobación de que cada grupo es adimensional**, sustituyendo
      las dimensiones.
    porque: |
      Es el paso 6 de la diapositiva 7. Cuesta una línea por grupo y caza un
      exponente con el signo cambiado, que en el despeje no se ve; los
      Apuntes (vol. I, pág. 10) hacen la comprobación completa de uno de los
      siete grupos para enseñar cómo.
  - punto: |
      **Qué número es cada grupo**, si lo es: Reynolds, Euler, Froude, Mach,
      Weber, o su inverso, y qué fuerzas compara.
    porque: |
      Las diapositivas 8 a 10 del tema 16 los dan con lo que representa cada
      uno, y el apartado siguiente del examen —la semejanza— se contesta con
      esos nombres. Que salgan invertidos no es un error: los grupos «son
      independientes pero no son únicos», porque dependen de las repetidas
      elegidas (Apuntes, vol. I, pág. 5), y la ordinaria de 2026 imprime
      $c/U$ y $\nu/(U L)$, los inversos de Mach y de Reynolds.
