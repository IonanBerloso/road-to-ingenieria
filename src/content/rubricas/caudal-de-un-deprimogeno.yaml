# Rúbrica compartida (fase I de Fluidos, unidad i-rub, 29 de septiembre de
# 2026). La deducción del caudal de un aparato deprimógeno con manómetro en
# U, tal como la dan las diapositivas 15 a 19 y 21 del tema 13. Generaliza la
# rúbrica que estaba escrita en el paso de
# `exflu2425-ord-8-el-diafragma-y-su-liquido-manometrico` y la sustituye.
#
# Cae en tres convocatorias: 2122-ord-6 b) (venturímetro con dos
# manómetros), 2223-ord-5 a) (venturímetro, con el sentido del flujo) y
# 2425-ord-8 a) (diafragma). El vertedero de pared delgada de 2122-ext-6 a)
# NO entra, aunque la consigna publicada de 2425-ord-8 lo cuente como «la
# misma deducción con otro dibujo»: las diapositivas 22 a 25 del tema 13 lo
# deducen integrando la velocidad por franjas de altura, sin manómetro y sin
# continuidad entre dos secciones. Está en `mapa.md`.
#
# Los `minimo` son Bernoulli sin pérdidas, la continuidad, la traducción de
# la lectura y el papel de cada coeficiente: son los cuatro pasos de la
# deducción de las diapositivas 16 a 18.
titulo: El caudal de un venturímetro o de un diafragma, deducido
cuando: >-
  La expresión del caudal real que mide un aparato deprimógeno —venturímetro
  o diafragma— con un manómetro en U, desde Bernoulli hasta dejarla en
  función de las áreas, la lectura, las dos densidades y los coeficientes.
  Cae en tres de las dieciséis convocatorias, dos veces con venturímetro y
  una con diafragma. No sirve para el vertedero, que se deduce de otra
  manera.
puntos:
  - punto: |
      **Entre qué dos secciones, y sin pérdidas**: Bernoulli entre la
      entrada (1) y la garganta o el orificio (2) como si el fluido fuera
      ideal, $B_1 = B_{2t}$, con la $t$ de teórica.
    porque: |
      Es el primer paso de la diapositiva 16 del tema 13, y es lo que hace
      legítimo escribir la ecuación tal cual. También es lo que obliga a
      poner un coeficiente después: una deducción que lo mete desde la
      primera línea no explica de dónde sale, y parece un factor de
      corrección caído del cielo en vez de la diferencia entre el fluido
      ideal y el real.
    minimo: true
  - punto: |
      **La continuidad, escrita, para quitar $V_1$**:
      $V_1 = (A_{2t}/A_{1t})\,C_{c2}\,V_{2t}$, y decir que de ahí sale el
      $1 - (C_{c2}\,A_{2t}/A_{1t})^{2}$ del denominador.
    porque: |
      Es la segunda ecuación de la diapositiva 16, con las dos hipótesis que
      la diapositiva escribe: el mismo coeficiente de velocidad en las dos
      secciones y sin contracción en la entrada. Ese denominador es el único
      sitio donde entra la geometría del conducto, y quien lo copia de
      memoria no sabe qué hacer cuando el conducto es mucho más ancho que el
      estrechamiento y el término se acerca a uno.
    minimo: true
  - punto: |
      **La lectura $R$ traducida a diferencia de alturas piezométricas del
      fluido que circula**: la hidrostática por el manómetro da
      $\dfrac{P_1 - P_2}{\gamma} + z_1 - z_2 = R\left(\dfrac{\gamma_0}{\gamma} - 1\right)$
      con la U normal y $R\left(1 - \dfrac{\gamma_0}{\gamma}\right)$ con la U
      invertida, con $\gamma_0$ el líquido manométrico y $\gamma$ el que
      circula, como en la diapositiva.
    porque: |
      Es la ecuación (3) de la diapositiva 17 del tema 13, y es el paso
      delicado. La resta ya lleva dentro la diferencia de cotas entre las
      tomas: por eso ese desnivel no se suma aparte, aunque el enunciado lo
      dé o el aparato esté inclinado, como el de la propia diapositiva.
      Escribir $R\,\gamma_0$ a secas, sin restar la columna del fluido que
      circula, sobrestima el caudal. Y ojo con la letra: la ordinaria de
      2022 y la de 2025 llaman $\gamma_0$ al fluido que circula, al revés
      que la diapositiva.
    minimo: true
  - punto: |
      **Cuál de las dos opciones de manómetro**: con un líquido más pesado
      que el que circula, en U normal, el paréntesis es
      $\gamma_0/\gamma - 1$; con uno más ligero, en U invertida, es
      $1 - \gamma_0/\gamma$. Di cuál usas.
    porque: |
      Cambian el signo del paréntesis y la forma del manómetro. La ordinaria
      de 2025 lo dice en el enunciado, «existen dos opciones posibles, en
      función del fluido manométrico seleccionado, cualquiera de ellas es
      válida», y su resultado impreso da las dos. La ordinaria de 2022 monta
      las dos a la vez en el mismo venturímetro, una encima y otra debajo, y
      el cociente de lecturas que pide sale de igualarlas. Y dos de los tres
      ejercicios que usan esta rúbrica son el segundo caso: la ordinaria de
      2022 pide la expresión con el manómetro de arriba, el del líquido más
      ligero, y el venturímetro de la ordinaria de 2023 tiene agua encima de
      glicol.
  - punto: |
      **Qué corrige cada coeficiente**:
      $Q_r = C_{v2}\,C_{c2}\,A_{2t}\,V_{2t}$. En el venturímetro el chorro no
      se contrae, $C_{c2} = 1$, y queda el de velocidad; en el diafragma
      $C_{c2} \neq 1$, y los dos se agrupan en el suyo,
      $C_{diaf} = C_{v2}\,C_{c2}\big/\sqrt{1 - (C_{c2}\,A_{2t}/A_{1t})^{2}}$.
    porque: |
      Es la diapositiva 18, y la tabla de la 21 pone los dos aparatos uno al
      lado del otro. Si no dices qué hace cada coeficiente, no puedes
      justificar por qué la misma deducción da coeficientes tan distintos:
      en el diafragma la vena se contrae detrás de la placa (diapositiva
      19), y además «genera pérdidas importantes», mientras que el
      venturímetro «no genera pérdidas de carga adicionales en la
      instalación».
    minimo: true
  - punto: |
      **El área de la fórmula es la del orificio o la garganta**, $A_{2t}$,
      no la de la vena contraída.
    porque: |
      La vena contraída no se mide: por eso su área va dentro del
      coeficiente de contracción. Escribir la fórmula con el área real del
      chorro y además el coeficiente es contar la contracción dos veces.
