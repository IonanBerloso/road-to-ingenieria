# Rúbrica compartida (fase P, unidad p9m, 22 de octubre de 2026). Sale de la
# que ya estaba escrita en el paso `redactar` de
# `exerm1314-1par-1-la-rebanada-de-directriz-curva`, y la usa también
# `exerm1718-ext-1-las-ecuaciones-de-la-pieza-curva`, que pide la misma
# deducción con otro texto y sin figura. Cambia lo que solo valía con la
# figura de 2013-2014: el punto 1 dice ahora que la rebanada se dibuja (allí
# venía dibujada), y los `porque` de los puntos 1, 4 y 5 ya no citan aquel
# enunciado («como dice el enunciado», «es lo que pide el enunciado»,
# «el enunciado dice que R es función de θ»). Las ecuaciones son las de los
# apuntes del tema 7, apartado 7.6 (pp. 13-14, figura 7.7).
#
# La pregunta cae, siempre de teoría y con 1 punto, como pregunta 1 del
# primer parcial de 2013-2014 (con la figura de la rebanada) y como
# cuestión 1 de la extraordinaria del 14 de junio de 2018 («Deducir las
# ecuaciones diferenciales de equilibrio en una pieza prismática curva…»).
#
# Los `minimo` son el dibujo con los sentidos y las tres proyecciones: sin
# cualquiera de ellos no hay deducción. El último, los infinitésimos y el
# radio variable, se puntúa pero no es mínimo.
titulo: Las ecuaciones diferenciales de equilibrio de la pieza curva, deducidas
cuando: >-
  Deducir las ecuaciones diferenciales de equilibrio de la rebanada de una
  pieza prismática curva con cargas radial y tangencial por unidad de
  longitud: dN/dθ = T − qθR, dT/dθ = −N − qrR y dM/dθ = TR, con los sentidos
  de la figura 7.7. Cae como cuestión de teoría de 1 punto en el primer
  parcial de 2013-2014 y en la extraordinaria de junio de 2018.
puntos:
  - punto: >-
      Se dibuja y se aísla la rebanada de ángulo dθ con los esfuerzos y las
      cargas en sus sentidos positivos, se dice que θ crece hacia la derecha
      y que las cargas actúan sobre la longitud R dθ de la directriz.
    porque: >-
      Los signos de las tres ecuaciones salen de esos sentidos; con θ medido
      al revés cambian, y las cargas van por unidad de longitud del eje.
    minimo: true
  - punto: >-
      Fuerzas según la tangente del centro: cada cara está girada dθ/2; con
      cos(dθ/2) ≈ 1 y sen(dθ/2) ≈ dθ/2, los axiles dan dN, las cortantes
      −T dθ y la carga qθ R dθ: dN/dθ = T − qθ R (ec. 7.18).
    porque: >-
      Es la primera ecuación, y su término −T dθ es el que la pieza recta no
      tiene.
    minimo: true
  - punto: >-
      Fuerzas según el radio: los axiles dan −N dθ (hacia O), las cortantes
      −dT y la carga −qr R dθ: dT/dθ = −N − qr R (ec. 7.19).
    porque: >-
      La componente radial del axil es lo que acopla las ecuaciones de una
      pieza curva.
    minimo: true
  - punto: >-
      Momentos respecto de O: T y qr son radiales y pasan por O; N, N + dN y
      qθ R dθ tienen brazo R. Queda dM = R dN + qθ R² dθ (ec. 7.20) y, con la
      primera, dM/dθ = T R (ec. 7.21).
    porque: >-
      Es la tercera ecuación, y con la primera lleva a la de la pieza recta
      con dx = R dθ.
    minimo: true
  - punto: >-
      Se desprecian los productos de diferenciales (dN dθ, dT dθ) y se dice
      que las ecuaciones valen aunque R cambie con θ, con O el centro de
      curvatura de la rebanada.
    porque: >-
      Es lo que deja las ecuaciones lineales, y la directriz de una pieza
      curva no tiene por qué ser un arco de circunferencia.
