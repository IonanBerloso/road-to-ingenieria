# Rúbrica compartida (fase D0 de la auditoría del 27 de septiembre de 2026).
# Sale de la demostración modelo de `ex1920-2-seno-de-una-suma`, la que ya
# estaba escrita en su resolución: las definiciones exponenciales, el segundo
# miembro desarrollado, la cancelación y la definición reconocida al final. El
# mismo enunciado es el ejercicio 1.28 del boletín (`identidad-seno-suma`, en
# el tema 1), que lleva todavía su rúbrica escrita en el paso. Los `minimo`
# son lo que sostiene la demostración: sin las definiciones no hay de dónde
# partir, con la fórmula real es circular y sin la cancelación no hay cuenta.
titulo: El seno de una suma, para argumentos complejos
cuando: >-
  Demuestra que sen(z₁+z₂) = sen z₁ cos z₂ + cos z₁ sen z₂ para todos z₁, z₂
  complejos, desde las definiciones exponenciales. Cae entera en la primera
  evaluación de 2019-2020, con COMP4 8, y es el ejercicio 1.28 del boletín
  del tema 1. Las otras identidades de la familia, como la de cos² z, cambian
  las cuentas y llevan su propia rúbrica.
puntos:
  - punto: |
      **Las dos definiciones, escritas antes de nada.**
      $\mathrm{sen}\,w = \dfrac{e^{iw}-e^{-iw}}{2i}$ y
      $\cos w = \dfrac{e^{iw}+e^{-iw}}{2}$, válidas para todo $w \in \mathbb{C}$.
    porque: |
      Son el único punto de partida legítimo: el seno complejo no es «el seno
      de siempre con $z$ dentro», es una función nueva que se define así. Y
      que valgan en todo el plano, porque la exponencial compleja lo hace, es
      de donde sale el «$\forall z_1, z_2$» del enunciado.
    minimo: true
  - punto: |
      **Por qué hay algo que demostrar**, en una línea, y la fórmula real sin
      usar en ningún paso.
    porque: |
      Que una propiedad del seno real se conserve no es automático: el seno
      complejo ni siquiera está acotado, porque
      $\mathrm{sen}(2i) = i\,\mathrm{senh}\,2 \approx 3{,}63\,i$. Si la
      identidad del bachillerato aparece como paso, la demostración es
      circular: usa lo que tenía que probar.
    minimo: true
  - punto: |
      **El segundo miembro, desarrollado sumando a sumando**: cada producto
      da cuatro exponenciales sobre $4i$.
    porque: |
      Es el camino que cierra en cuatro líneas. Partir del primer miembro
      obliga a descomponer $e^{i(z_1+z_2)}$ y adivinar cómo agruparlo: llega
      al mismo sitio por un camino donde es fácil perderse.
  - punto: |
      **Qué se cancela, a la vista.** Los términos en $e^{\pm i(z_1-z_2)}$
      aparecen con signos opuestos y se van; los otros dos se duplican y queda
      $\dfrac{2e^{i(z_1+z_2)}-2e^{-i(z_1+z_2)}}{4i}$.
    porque: |
      Ahí está el ejercicio. Escribir «operando queda» y saltar al resultado
      es lo que un corrector marca como paso no justificado, y es justo el
      trozo que se puntúa.
    minimo: true
  - punto: |
      **Cerrar reconociendo la definición** de $\mathrm{sen}(z_1+z_2)$, y
      decir que no se ha supuesto nada sobre $z_1$ ni $z_2$.
    porque: |
      El último renglón convierte una cadena de igualdades en una
      demostración: sin él has llegado a una expresión, con él has probado la
      identidad para todos los complejos, que es lo que se pedía.
