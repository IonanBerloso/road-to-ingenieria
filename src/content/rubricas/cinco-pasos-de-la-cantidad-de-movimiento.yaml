# Rúbrica compartida (fase I de Fluidos, unidad i-rub, 29 de septiembre de
# 2026). Los cinco pasos del teorema de la cantidad de movimiento tal como
# los da la diapositiva 3 del tema 15, con las hipótesis del álabe de las
# diapositivas 5 y 6 y el signo de la fuerza de la 8; el teorema, en la
# diapositiva 8 del tema 14. No sustituye a ninguna rúbrica escrita.
#
# Cae, con una nota impresa que exige los pasos, en cuatro convocatorias:
# 1920-2par-1 a), 2021-ord-4 c) (transcrito el 30 de septiembre de 2026),
# 2223-ext-4 b) y 2526-ord-6. Vale igual para los otros ejercicios de
# cantidad de movimiento del cuadernillo, que no llevan la nota (mapa.md).
#
# Las cuatro notas van citadas literales en el primer punto, que es
# `minimo`, y cada paso es `minimo` porque las notas exigen todos. El
# último punto, el sentido de la fuerza sobre el sólido, es la
# respuesta y no un paso: va sin `minimo`.
titulo: Los cinco pasos de la cantidad de movimiento
cuando: >-
  La resolución de un problema de fuerzas de un flujo sobre un sólido —un
  codo, una boquilla, una pieza en Y, un álabe fijo o móvil— por el teorema
  de la cantidad de movimiento, con los cinco pasos de clase a la vista:
  volumen de control, ejes, fuerzas exteriores, velocidades y caudales, y el
  teorema por componentes. Cuatro convocatorias lo exigen con una nota que
  obliga a seguirlos o penaliza no hacerlo.
puntos:
  - punto: |
      **Los cinco pasos, numerados y en el orden de clase**, cada uno con su
      título, de forma que quien corrige los encuentre sin buscarlos.
    porque: |
      La diapositiva 3 del tema 15 dice que «es recomendable» seguirlos; los
      exámenes van más lejos. Cuatro convocatorias lo exigen con una nota:
      «Nota: en la resolución se deben seguir obligatoriamente los cinco
      pasos» (segundo parcial de 2020); «NOTA: se penalizará no indicar los
      pasos empleados habitualmente en la resolución del apartado c)» (final
      de junio de 2021); «Nota: en la resolución se deben seguir
      obligatoriamente los pasos requeridos» (extraordinaria de 2023); y
      «Nota: se penalizarán aquellos ejercicios que en su resolución no hayan
      seguido claramente los cinco pasos vistos en clase» (ordinaria de
      2026). Con la fuerza bien calculada y los pasos mezclados, se pierden
      puntos igual.
    minimo: true
  - punto: |
      **Paso 1, el volumen de control, dibujado**: el trozo de fluido donde
      cambia el vector velocidad, con cada sección de entrada y de salida
      marcada.
    porque: |
      Es el paso 1 de la diapositiva 3 del tema 15: «se selecciona el
      volumen de fluido en el cual varía el vector velocidad». Todo lo demás
      se refiere a él: qué fuerzas son exteriores, qué entra y qué sale. Un
      volumen de control que corta por donde no se conoce la presión deja una
      incógnita de más.
    minimo: true
  - punto: |
      **Paso 2, los ejes, dibujados sobre la figura**, y con ellos el signo
      de cada componente de velocidad y de fuerza.
    porque: |
      Es el paso 2 de la diapositiva. Sin ejes, un signo cambiado no se puede
      ni detectar: la fuerza sale con el módulo bien y el sentido al revés,
      que es media respuesta perdida cuando el enunciado pide «módulo,
      dirección y sentido».
    minimo: true
  - punto: |
      **Paso 3, todas las fuerzas exteriores sobre el volumen de control**:
      las de volumen, el peso si el plano no es horizontal; y las de
      superficie, la presión en cada sección de entrada y de salida,
      $p\,A$, y la reacción del sólido $R$, incógnita y con un sentido
      supuesto. En un chorro libre la presión es la atmosférica y no hace
      fuerza.
    porque: |
      Es el paso 3 de la diapositiva: «fuerzas de volumen y fuerzas
      superficiales». En un codo o una pieza intercalada en una tubería, las
      $p\,A$ de las secciones pueden pesar mucho más que el término de
      cantidad de movimiento, y olvidarlas da una reacción que no se parece a
      la real. En
      un álabe no están porque el chorro va a presión atmosférica, que es una
      de las hipótesis de la diapositiva 5.
    minimo: true
  - punto: |
      **Paso 4, velocidades y caudales en cada entrada y cada salida**: con
      la continuidad, y con Bernoulli si falta una presión o una velocidad.
      En un álabe fijo, sin rozamiento, sin cambio de cota y a presión
      atmosférica, el módulo de la velocidad se conserva; en un álabe que se
      mueve, las velocidades son las relativas al álabe.
    porque: |
      Es el paso 4 de la diapositiva 3, y las diapositivas 5 y 6 del tema 15
      dan las cuatro hipótesis del álabe y la consecuencia, $V_1 = V_2$. La
      extraordinaria de 2023 las pregunta como apartado. En el álabe que huye
      del chorro del segundo parcial de 2020, la fuerza impresa solo sale con
      la velocidad del chorro relativa al álabe y el caudal que le alcanza;
      con la absoluta sale más del doble.
    minimo: true
  - punto: |
      **Paso 5, el teorema eje por eje**:
      $\sum \vec{F}_{ext} = \rho\left(\sum_{salen} Q_i\,\vec{v}_i - \sum_{entran} Q_i\,\vec{v}_i\right)$,
      una ecuación por eje, con cada término proyectado según los ejes del
      paso 2.
    porque: |
      Es la expresión de la diapositiva 3 del tema 15, la misma que la 8 del
      tema 14 deduce. Lo que sale menos lo que entra, y no al revés: con el
      orden cambiado la reacción sale con el sentido contrario, y todo lo que
      se calcula después, los anclajes o la potencia, arrastra el error.
    minimo: true
  - punto: |
      **La fuerza que pide el enunciado, con su sentido**: $R$ es lo que el
      sólido hace sobre el fluido, y lo que el fluido hace sobre el sólido es
      $-R$. Módulo, dirección y sentido, dichos.
    porque: |
      La diapositiva 8 del tema 15 lo escribe para el álabe: la fuerza que
      ejerce el chorro sobre el álabe es $F_x = -R_x$. Los enunciados piden
      unas veces la fuerza sobre la pieza y otras la que hacen los anclajes,
      y son opuestas: contestar con la que no es da el sentido al revés.
