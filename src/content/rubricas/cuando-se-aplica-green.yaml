# Rúbrica compartida (fase D2 de la auditoría del 27 de septiembre de 2026).
# Sale de las resoluciones modelo que ya estaban escritas en los dos
# ejercicios de examen que piden «aplicando, si es posible, la fórmula de
# Green»: `ex1213-ext-8-el-campo-con-dos-rectas-prohibidas` y
# `ex1516-ext-4-el-agujero-que-rompe-green`. La usa también
# `green-que-no-se-puede-aplicar`, el ejercicio 8.10 del tema 8, que es el
# enunciado de 2015-2016 y llevaba su rúbrica escrita en el paso.
#
# Las dos resoluciones deciden por el mismo camino: el integrando de Green
# sale nulo, el campo deja de ser C¹ en puntos que están dentro del disco
# —dos rectas enteras en 2012-2013, que además cortan a la curva; el origen
# en 2015-2016—, Green no se puede aplicar, y la cuenta de Green, que da
# cero, no vale aunque en 2012-2013 coincida con el valor bueno. Ninguna de
# las dos rescata Green quitando un disco pequeño alrededor del punto malo,
# así que la rúbrica no lo pide: lo que se evalúa es decidir.
#
# Las resoluciones escriben la hipótesis que falla; el enunciado entero, con
# la curva cerrada, el sentido positivo y las parciales continuas en toda la
# región, es el que el tema 8 pide decir en voz alta, y se le añade lo que el
# tema calla y el teorema necesita: curva simple y regular a trozos, y un
# abierto que contenga la región. Los `minimo` son el teorema con sus
# hipótesis, el sitio donde falla el campo, si ese sitio cae en la región, la
# conclusión y por qué la cuenta de Green no cuenta: sin cualquiera de ellos,
# «si es posible» se queda sin contestar. Comprobar la curva no es mínimo: en
# los dos ejercicios es una circunferencia, y descartarla no decide nada.
titulo: Cuándo se aplica el teorema de Green, comprobado en toda la región
cuando: >-
  Decide, y justifica, si el teorema de Green se puede aplicar a una integral
  de línea sobre una curva cerrada cuando el campo deja de ser de clase C¹ en
  algún punto del plano. Cae con las palabras «aplicando, si es posible, la
  fórmula de Green», detrás de un apartado que pide la misma integral
  parametrizando, en las extraordinarias de 2012-2013 y de 2015-2016, con
  COMP4 4 las dos; el enunciado de 2015-2016 es también el ejercicio 8.10 del
  tema 8. Si el campo es de clase C¹ en toda la región, Green se aplica sin más
  y esta rúbrica no hace falta.
puntos:
  - punto: |
      **El teorema, con sus hipótesis escritas**: $C$ es una curva cerrada
      simple, regular a trozos y recorrida en sentido positivo —antihorario,
      con la región a la izquierda—; $D$ es la región que encierra; $P$ y
      $Q$ tienen derivadas parciales continuas en un abierto que contiene
      $D$ entera, borde incluido. Entonces
      $\oint_C P\,dx+Q\,dy=\iint_D\left(\dfrac{\partial Q}{\partial x}-\dfrac{\partial P}{\partial y}\right)dA$.
    porque: |
      «Si es posible» pregunta por las hipótesis, y no se puede decir cuál
      falla sin haberlas escrito. La que decide estos ejercicios está
      escrita sobre la región, no sobre la curva: pide un abierto que
      contenga $D$ entera, y no basta con que el campo sea bueno a lo largo
      de $C$.
    minimo: true
  - punto: |
      **Las hipótesis de la curva, comprobadas aunque se cumplan**: es
      cerrada, simple y regular a trozos, y se recorre en sentido positivo si
      el enunciado no dice otra cosa.
    porque: |
      Descartarlas cuesta una línea y deja claro que lo que falla es el
      campo, no el borde. Y el sentido cuenta aunque no sea lo que se
      pregunta: recorrida al revés, la fórmula vale con el signo cambiado.
  - punto: |
      **Dónde deja de ser $C^{1}$ el campo, localizado**: los puntos donde se
      anula algún denominador de $P$ o de $Q$ —o donde alguna de las dos deja
      de estar definida o de ser derivable—, escritos como puntos o como
      rectas del plano.
    porque: |
      «No se cumple la hipótesis», sin el sitio, es una afirmación sin
      prueba, y el sitio decide todo lo que viene después. Puede ser un
      punto o una recta entera: un denominador que es el producto de dos
      factores de primer grado se anula en dos rectas.
    minimo: true
  - punto: |
      **Si ese sitio cae en la región**: dentro, sobre el borde o fuera,
      comparado con la curva —con una circunferencia, la distancia al centro
      frente al radio—.
    porque: |
      Lo que rompe el teorema no es que el campo tenga puntos malos sino
      dónde están: con una curva que los deje fuera, el mismo campo cumple
      las hipótesis y Green vale. Mirar solo la curva no basta, porque un
      punto malo en el centro del disco no la toca. Y si alguno cae sobre la
      curva misma, ni siquiera la integral de línea es una integral
      ordinaria: hay que decir en qué sentido se calcula.
    minimo: true
  - punto: |
      **La conclusión, escrita**: si algún punto malo está en la región,
      borde incluido, Green **no se puede aplicar** a esa región tal cual; si
      todos quedan fuera, se aplica.
    porque: |
      Es lo que pregunta «si es posible», y la respuesta es una frase, no un
      número. «Tal cual» porque el teorema sigue valiendo en una región que
      deje fuera los puntos malos; lo que no vale es aplicarlo a la región
      entera que encierra la curva del enunciado.
    minimo: true
  - punto: |
      **Por qué la cuenta de Green no vale aunque dé un número**: con la
      hipótesis rota,
      $\iint_D\left(\dfrac{\partial Q}{\partial x}-\dfrac{\partial P}{\partial y}\right)dA$
      no tiene por qué ser la integral de línea, aunque el integrando se
      anule en todos los puntos donde el campo existe. El valor bueno es el
      que sale por otro camino —la parametrización—, y si los dos coinciden,
      la coincidencia no rehabilita a Green.
    porque: |
      De un teorema cuyas hipótesis fallan no se sigue nada. La cuenta puede
      dar un valor falso —el campo $\dfrac{(-y,\,x)}{x^{2}+y^{2}}$ tiene
      rotacional nulo fuera del origen y circulación distinta de cero
      alrededor de él— o acertar por casualidad, y ninguna de las dos cosas
      se sabe sin calcular la integral de otra forma. Y que el integrando
      valga cero en todos los puntos menos uno no arregla nada: la hipótesis
      no habla de áreas, habla del campo en cada punto de la región.
    minimo: true
