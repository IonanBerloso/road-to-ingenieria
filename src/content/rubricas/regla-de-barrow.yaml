# Rúbrica compartida (fase D0 de la auditoría del 27 de septiembre de 2026).
# Sale de las demostraciones modelo que ya estaban escritas en
# `ex1920-3ev-4-barrow-otra-vez` y `ex2021-3ev-4-barrow-demostrado`, que
# responden al mismo enunciado palabra por palabra: el teorema fundamental
# fabrica una primitiva, dos primitivas difieren en una constante por el
# teorema del valor medio y la constante se cancela al restar. El mismo
# enunciado cae en la tercera evaluación de 2018-2019
# (`ex1819-3ev-3-barrow-tercera-vez`), que lleva todavía su rúbrica escrita en
# el paso. Los `minimo` son los dos enunciados, el paso del valor medio en un
# intervalo y el cierre: las resoluciones dicen que una demostración de COMP4
# se juzga por si las hipótesis están dichas y usadas.
titulo: El teorema fundamental del cálculo, y la regla de Barrow demostrada con él
cuando: >-
  Enuncia el teorema fundamental del Cálculo Infinitesimal y úsalo para
  demostrar la regla de Barrow. Cae con la misma redacción en las terceras
  evaluaciones de 2018-2019, 2019-2020 y 2020-2021, siempre con los diez
  puntos en COMP4.
puntos:
  - punto: |
      **El teorema fundamental, con su hipótesis**: si $f$ es **continua** en
      $[a,b]$ y $F(x) = \int_a^{x}f(t)\,dt$, entonces $F$ es derivable en
      $[a,b]$ y $F'(x) = f(x)$, con derivadas laterales en $a$ y en $b$.
    porque: |
      Se puntúa solo, y la continuidad es lo que hace derivable a $F$: con $f$
      solo integrable, $F$ es continua pero puede tener un pico donde $f$
      salta. Y el error más caro es enunciar como teorema fundamental la
      propia regla de Barrow: la demostración se queda sin punto de partida.
    minimo: true
  - punto: |
      **La regla de Barrow, enunciada aparte**: si $f$ es continua en $[a,b]$
      y $G$ es **cualquier** primitiva suya, $\int_a^{b}f(x)\,dx = G(b)-G(a)$.
    porque: |
      Son dos enunciados y la pregunta pide los dos. La palabra «cualquier» es
      la que hace útil la regla, y toda la demostración existe para
      justificarla.
    minimo: true
  - punto: |
      **$F$ es una primitiva, y $(G-F)' = 0$**: por el teorema fundamental
      $F' = f$, y si $G' = f$ en todo $[a,b]$ la diferencia tiene derivada
      nula.
    porque: |
      Es el puente entre los dos enunciados: el teorema fundamental
      **construye** una primitiva y Barrow **usa** una cualquiera. Si $G' = f$
      fallara en un punto, la resta no sería nula ahí.
  - punto: |
      **Por qué $G-F$ es constante**: por el teorema del valor medio de
      Lagrange, y porque $[a,b]$ es un **intervalo**.
    porque: |
      «Derivada nula, luego constante» es un teorema, no una obviedad, y es
      falso fuera de un intervalo: en $(-1,0)\cup(0,1)$ una función puede
      valer 0 a un lado y 1 al otro con derivada nula. Es el paso que casi
      todo el mundo se salta, y donde se decide la nota.
    minimo: true
  - punto: |
      **La constante se cancela, y $F(a) = 0$**:
      $G(b)-G(a) = \left[F(b)+C\right]-\left[F(a)+C\right] = F(b)-F(a)$, con
      $F(a) = \int_a^{a}f = 0$ y $F(b) = \int_a^{b}f$.
    porque: |
      Son las dos líneas que cierran el argumento. No hay que calcular $C$ ni
      imponer $G(a) = 0$: si hiciera falta la primitiva que se anula en $a$,
      habría que conocer la integral para poder usarla, y el método sería
      circular.
    minimo: true
