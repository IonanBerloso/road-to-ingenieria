# Rúbrica compartida (fase I de Fluidos, unidad i-rub, 29 de septiembre de
# 2026). La deducción de la curva característica de una instalación de
# bombeo tal como la dan las diapositivas 6, 8, 9, 10 y 14 a 16 del tema 25,
# con las pérdidas de las diapositivas 2, 4 y 16 del tema 19. Generaliza la
# rúbrica que estaba escrita en el paso de
# `exflu2425-ext-2-la-bomba-y-la-valvula-que-hay-que-cerrar` y la sustituye;
# lo que cambia respecto de aquella está en `mapa.md` de la unidad.
#
# Cae en nueve convocatorias, contadas sobre el cuadernillo 2020-2025 y la
# ordinaria de 2026: 1920-2par-4 a), 2021-3par-6 a), 2122-ord-11 a),
# 2223-ord-9 b), 2223-ext-8 a), 2324-ord-6 a) y c), 2324-ext-6 a),
# 2425-ord-9 a) y 2425-ext-2 a). Tres de ellas (1920-2par-4, 2021-3par-6 y
# 2425-ord-9) están hoy en `fuera` y las rescatan sus unidades.
#
# Los `minimo` son el balance entre los dos extremos, el término
# independiente, las pérdidas tramo a tramo y la expresión final con sus
# números y unidades: sin cualquiera de los cuatro no hay curva que cortar con
# la de la bomba. Desde la revisión del 29 de septiembre (B14) también lo es
# la altura cinética del chorro, que el propio punto condiciona a que la
# instalación acabe en uno. Las cifras de los `porque` están recalculadas en
# `cifras.mjs` de la unidad.
titulo: La curva característica de la instalación, deducida
cuando: >-
  La expresión analítica de la curva característica de una instalación de
  bombeo, H = f(Q), desde el balance de energía entre sus dos extremos hasta
  dejarla con los coeficientes calculados. Cae en nueve de las dieciséis
  convocatorias, y las nueve piden las pérdidas por Hazen-Williams. En la
  ordinaria de 2024 cae dos veces en el mismo ejercicio, antes y después de
  presurizar un depósito. De ella cuelgan el punto de funcionamiento, la
  cavitación y el coste, así que un error aquí se lleva el ejercicio entero.
puntos:
  - punto: |
      **De dónde a dónde**, dicho antes de la primera ecuación: el balance
      de energía entre los dos extremos de la instalación —la lámina del
      depósito de aspiración y la del de llegada, o la salida del chorro si
      acaba en una boquilla—, con la bomba como la energía que falta,
      $H_{mi} = B_B - B_A + h_{f\,A-B}$.
    porque: |
      La curva no es una fórmula que se recuerda: es ese balance. Así la
      define la diapositiva 6 del tema 25, «energía por unidad de peso
      necesaria en la instalación para elevar el caudal Q desde el depósito
      inferior al superior». Elegir mal los extremos sale caro: si
      terminas en la brida de salida de la bomba y no en la lámina de
      llegada, te dejas la altura y la presión de ese depósito, y todo lo que
      se calcula después sale mal.
    minimo: true
  - punto: |
      **El término independiente, aparte y con su signo**:
      $H_{mi0} = \Delta z + \Delta P/\gamma$, lo que la bomba tiene que dar
      con caudal nulo, con la presión en columna del fluido que se bombea.
    porque: |
      La diapositiva 8 del tema 25 lo separa y le da nombre, cota
      piezométrica de la instalación, y la 14 enseña que es lo que se mueve al
      presurizar un depósito: la curva sube entera. No siempre es el
      desnivel. En la extraordinaria de 2025 el agua baja 13 m y aun así hace
      falta bomba, porque el depósito de llegada está a 20 mca: el término
      sale $+7$ m. Y en el circuito de filtrado de la ordinaria de 2023 el
      agua sale del depósito y vuelve a él, así que el término es cero, la
      curva impresa no lo lleva y presurizar el depósito no cambia nada.
    minimo: true
  - punto: |
      **La altura cinética del final, si acaba en un chorro**: el término
      $\Delta V^{2}/2g$ del balance. Si el destino es un depósito, su lámina
      está quieta y lo que cuenta es la pérdida de entrada, si el enunciado
      la da; si es una boquilla, la altura cinética del chorro va dentro,
      además de la pérdida de la propia boquilla.
    porque: |
      La diapositiva 8 del tema 25 lo escribe en la curva, y se olvida con
      facilidad porque no es una pérdida. En las tres boquillas de la
      extraordinaria de 2024, la altura cinética de los chorros es más de un
      tercio del coeficiente de $Q^{2}$ impreso. Quien la quita obtiene una
      curva más baja y un punto de funcionamiento con más caudal del que la
      bomba da de verdad.
    minimo: true
  - punto: |
      **Las pérdidas tramo a tramo, cada una con la velocidad de su
      tubería**: aspiración e impulsión por separado, las continuas con la
      fórmula que pide el enunciado y las menores como factor de paso,
      $k\,V^{2}/2g$, o como longitud equivalente sumada a la del tramo, según
      vengan los datos.
    porque: |
      La diapositiva 4 del tema 19 escribe la pérdida total como una suma de
      términos, cada uno con su $V^{2}/2g$: con dos diámetros hay dos
      velocidades, y cada factor de paso multiplica a la de su tramo. Sumar
      todas las $k$ y multiplicarlas por una sola velocidad es un error que
      no se nota en el resultado, porque da un número creíble. Las
      dos maneras de contar una pieza valen (diapositivas 2 y 4 del tema 19);
      lo que no vale es inventarse una $k$ para un codo que el enunciado da en
      metros de longitud equivalente.
    minimo: true
  - punto: |
      **Hazen-Williams con su exponente**: las pérdidas continuas van con
      $J_1\,L\,Q^{1{,}852}$, con $Q$ en l/s, y con ellas las piezas dadas
      como longitud equivalente, sumadas a $L$; con $Q^{2}$ van solo las
      piezas dadas como factor de paso y la altura cinética de los chorros.
      La curva queda como $H_{mi0} + a\,Q^{2} + b\,Q^{1{,}852}$, y no es una
      parábola: dilo.
    porque: |
      Es la expresión de la diapositiva 16 del tema 19, con
      $J_1 = 1{,}2117\cdot 10^{10}/\left(C_{HW}^{1{,}852}\,D^{4{,}87}\right)$
      y $D$ en milímetros, válida cuando la viscosidad cinemática es la del
      agua, unos $10^{-6}$ m²/s. Las nueve convocatorias que piden esta curva
      piden Hazen-Williams, y en todas las curvas impresas las pérdidas
      continuas van con $Q^{1{,}852}$. Escribir $H = A + B\,Q^{2}$ sin decirlo
      es aproximar sin avisar, y el punto de funcionamiento sale desplazado.
      En la extraordinaria de 2025 los tres codos vienen en metros y van
      dentro del término de $Q^{1{,}852}$; el de $Q^{2}$ impreso,
      $8{,}21\cdot 10^{-5}$, son solo las tres $k$: salida, entrada y válvula.
  - punto: |
      **La expresión final, con los coeficientes calculados y sus
      unidades**: $H$ en mca y $Q$ en l/s, dicho junto a la fórmula.
    porque: |
      La curva existe para cortarla con la de la bomba, analíticamente o
      dibujando las dos (diapositivas 9 y 10 del tema 25). Una cadena de
      símbolos no se puede cortar con nada, y unos coeficientes sin unidades
      tampoco: $5333{,}53\,Q^{2}$ con $Q$ en m³/s es
      $5{,}33\cdot 10^{-3}\,Q^{2}$ con $Q$ en l/s. Solo las dos soluciones
      de 2024 lo imprimen junto a la curva; el segundo parcial de 2020 da
      sin unidades una curva de la instalación que solo funciona en l/s y
      una de la bomba que solo funciona en m³/s.
    minimo: true
  - punto: |
      **Si la instalación cambia, qué término cambia**: presurizar o subir un
      depósito mueve $H_{mi0}$; maniobrar la válvula cambia su factor de paso,
      y con él el coeficiente de $Q^{2}$ del tramo donde está.
    porque: |
      Son los dos modos de mover el punto de funcionamiento de las
      diapositivas 14 a 16 del tema 25, y los exámenes piden la curva nueva:
      en la ordinaria de 2024, al presurizar un depósito, el término
      independiente pasa de 30 a 38 m y los otros dos no cambian. Rehacer la
      curva desde cero para eso es perder tiempo, y cambiar el término
      equivocado da una curva que corta a la bomba donde no es.
