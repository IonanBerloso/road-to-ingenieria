# Rúbrica compartida (fase D0 de la auditoría del 27 de septiembre de 2026).
# Sale de las demostraciones modelo que ya estaban escritas en las
# resoluciones de `ex1516-2ev-3-teorema-del-punto-fijo` y
# `ex1718-3ev-3-definiciones-y-punto-fijo`, que son la misma y la del tema 3:
# la función auxiliar g(x) = f(x) − x, los signos en los extremos, los casos
# borde y Bolzano. Los `minimo` son las dos hipótesis, la auxiliar, los signos
# que salen de que f no se salga del intervalo y Bolzano nombrado. La
# unicidad entra como punto sin mínimo: una convocatoria la excluye del
# enunciado y la otra la pregunta.
titulo: El teorema del punto fijo, la existencia
cuando: >-
  Demuestra que si f es continua en [a,b] y f(x) ∈ [a,b] para todo x, existe
  c ∈ [a,b] con f(c) = c. Cae como «enunciar y demostrar» en la segunda
  evaluación de 2015-2016, que pide solo la existencia, y como apartado c) de
  la tercera de 2017-2018, que añade cuándo es única. La versión que pide
  demostrar también la unicidad, la de la tercera de 2015-2016, lleva una
  segunda demostración y su propia rúbrica.
puntos:
  - punto: |
      **Las dos hipótesis, escritas y usadas**: $f$ continua en $[a,b]$ **y**
      $f\left([a,b]\right) \subseteq [a,b]$. La tesis: existe al menos un
      $c \in [a,b]$ con $f(c) = c$.
    porque: |
      La segunda es la que suele olvidarse y es la que hace el teorema: dice
      que la gráfica no se sale del cuadrado $[a,b]\times[a,b]$. Sin ella,
      $f(x) = x+1$ en $[0,1]$ es continua y no tiene ningún punto fijo.
    minimo: true
  - punto: |
      **La función auxiliar** $g(x) = f(x)-x$, continua por ser diferencia de
      continuas, y la frase que la justifica: un punto fijo de $f$ es un
      **cero** de $g$.
    porque: |
      Es el truco entero, y es lo que se puntúa: «$f(x) = x$» no tiene
      teorema que lo ataque y «$g(x) = 0$» sí. Aplicar Bolzano a $f$
      directamente no sirve, porque $f$ no tiene por qué anularse.
    minimo: true
  - punto: |
      **Los signos en los extremos, sacados de la segunda hipótesis**: como
      $f(a) \ge a$, $g(a) \ge 0$; como $f(b) \le b$, $g(b) \le 0$.
    porque: |
      Es el único sitio donde entra que $f$ no se sale del intervalo. Escribir
      los signos sin decir de dónde vienen es afirmar justo lo que había que
      razonar.
    minimo: true
  - punto: |
      **Los casos borde**: si $g(a) = 0$, el punto fijo es $a$; si
      $g(b) = 0$, es $b$.
    porque: |
      Las desigualdades son amplias y Bolzano, en su forma estricta, pide
      signos **opuestos**. Despachar los dos casos cuesta diez segundos, y es
      el detalle por el que COMP4 baja de nota una demostración que por lo
      demás está bien.
  - punto: |
      **Bolzano, citado por su nombre**, en el caso general: $g(a) > 0 > g(b)$
      y $g$ continua dan un $c \in (a,b)$ con $g(c) = 0$, es decir $f(c) = c$.
    porque: |
      El teorema que da ceros es Bolzano, no Weierstrass: el máximo de $f$ no
      tiene por qué cumplir $f(x) = x$. Con $f(x) = 1+\frac{x}{3}$ en $[1,2]$
      el máximo está en $x=2$ y el punto fijo en $1{,}5$.
    minimo: true
  - punto: |
      **Lo que el teorema no dice: la unicidad.** Garantiza al menos un punto
      fijo; que sea único pide que $g$ sea estrictamente monótona, por ejemplo
      con $f'(x) < 1$ en $(a,b)$ o con $f$ contractiva.
    porque: |
      Hay funciones que cumplen las dos hipótesis con dos puntos fijos
      —$x^{2}$ y $\sqrt{x}$ en $[0,1]$ los tienen en 0 y en 1— y la identidad
      los tiene todos. Y pedir monotonía para la existencia es añadir una
      hipótesis que Bolzano no necesita: resta tanto como omitir una.
