# Rúbrica compartida (fase D0 de la auditoría del 27 de septiembre de 2026).
# Sale de la demostración modelo que ya estaba escrita en las resoluciones de
# `exalg2122-ext-2-tres-imagenes-en-una-base-torcida` (a.ii) y
# `exalg2223-ext-2-cuatro-imagenes-y-una-matriz-que-no-es-cuadrada` (a), y del
# tema 2: una combinación nula de las imágenes, la linealidad para meterla
# dentro, la inyectividad para sacar el vector de dentro y la libertad de
# partida para anular los coeficientes. Los `minimo` son esos cuatro pasos,
# uno por hipótesis más el arranque. El contraejemplo de la aplicación nula
# es el del tema 2 y el de la pieza trampa de 2022-2023.
titulo: Una aplicación lineal inyectiva lleva familias libres a familias libres
cuando: >-
  Demuestra que si f es lineal e inyectiva y {u_1, …, u_n} es libre, entonces
  {f(u_1), …, f(u_n)} también es libre. Cae en el apartado a) del ejercicio 2
  de la extraordinaria de 2021-2022 (a.ii, detrás de que las imágenes de un
  sistema generador generan la imagen) y de la extraordinaria de 2022-2023.
puntos:
  - punto: |
      **Arrancar por una combinación nula de las imágenes:**
      $\sum\alpha_{i}f\left(\overline{u}_{i}\right)=\overline{0}$, con el
      objetivo dicho: que todos los $\alpha_{i}$ son cero.
    porque: |
      Es la definición de libre aplicada a la familia de llegada, que es la que
      hay que probar libre. Empezar por los $\overline{u}_{i}$ es partir de la
      hipótesis en vez de la tesis: de ahí sale que los $\overline{u}_{i}$ son
      libres, que ya se sabía.
    minimo: true
  - punto: |
      **Meterla dentro por linealidad:**
      $\sum\alpha_{i}f\left(\overline{u}_{i}\right)=f\left(\sum\alpha_{i}\overline{u}_{i}\right)=\overline{0}$.
    porque: |
      Es el paso que convierte una afirmación sobre las imágenes en una sobre
      un solo vector de partida, y hay que decir que se usa la linealidad: es
      la primera de las tres hipótesis que entran.
    minimo: true
  - punto: |
      **La inyectividad, en el paso que la necesita:**
      $\sum\alpha_{i}\overline{u}_{i}\in\operatorname{Ker}\left(f\right)=\left\{\overline{0}\right\}$
      —o, con la definición, $f\left(\sum\alpha_{i}\overline{u}_{i}\right)=f\left(\overline{0}\right)$—,
      así que $\sum\alpha_{i}\overline{u}_{i}=\overline{0}$.
    porque: |
      Es justo el paso que no se puede saltar, y el contraejemplo cabe en una
      línea: la aplicación nula es lineal y manda cualquier familia libre a
      $\left\{\overline{0},\dots,\overline{0}\right\}$. Sin inyectividad, de
      $f\left(\sum\alpha_{i}\overline{u}_{i}\right)=\overline{0}$ no se deduce
      nada sobre lo de dentro.
    minimo: true
  - punto: |
      **La libertad de partida, nombrada:** como
      $\left\{\overline{u}_{1},\dots,\overline{u}_{n}\right\}$ es libre, de
      $\sum\alpha_{i}\overline{u}_{i}=\overline{0}$ sale $\alpha_{i}=0$ para
      todo $i$.
    porque: |
      Es la otra hipótesis, y entra al final. Si no se dice aquí, no se ve de
      dónde sale que los coeficientes se anulen.
    minimo: true
  - punto: |
      **La conclusión, con la palabra del enunciado:** la única combinación
      nula de las imágenes es la trivial, así que
      $\left\{f\left(\overline{u}_{1}\right),\dots,f\left(\overline{u}_{n}\right)\right\}$
      es libre.
    porque: |
      Cierra la demostración volviendo a lo que se pedía. Y, junto con que las
      imágenes de un sistema generador generan la imagen, da el corolario que
      se usa a diario: una aplicación lineal inyectiva lleva bases a bases de
      la imagen.
