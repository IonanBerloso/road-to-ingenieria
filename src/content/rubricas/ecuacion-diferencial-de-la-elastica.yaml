# Rúbrica compartida (fase P, unidad p9j, 22 de octubre de 2026, a petición
# de la revisión rev-p9j). Sale de las dos rúbricas que ya estaban escritas
# en los pasos `redactar` de `exerm2021-ext-3-la-ecuacion-diferencial-de-la-elastica`
# y `exerm1819-ext-3-la-ecuacion-diferencial-de-la-curva-elastica`, que
# piden la misma deducción: decían lo mismo con otras palabras y ya no
# coincidían (la de 2021 cerraba el punto 3 con dθ/dx = M/(EIz), ec. 10.9;
# la de 2019 añadía en el último para qué sirve la ecuación integrada).
# Esta es la unión de las dos, punto por punto, con las ecuaciones de los
# apuntes del tema 10 (pp. 4-7, figura 10.3 en la p. 6).
#
# La pregunta cae, siempre de teoría y con 1 punto, como «Deducir la
# ecuación diferencial de la curva elástica.» en la extraordinaria del 2 de
# febrero de 2021 y como «Ecuación diferencial de la curva elástica.» en la
# del 21 de junio de 2019; con esta segunda redacción está también en
# cuatro PDF que el sitio aún no publica (13-ERM-matofin-pviejo,
# 16-ERM-ene2, 18-ERM-EME-urta2-ene2 y 18-ERM-EME-urtfin-enefin).
#
# Los `minimo` son las dos mitades de la curvatura (la mecánica y la
# geométrica), el punto de partida, el signo con el dibujo y el paso de la
# exacta a la aproximada: sin cualquiera de ellos no hay deducción. El
# último, cuándo vale, se puntúa pero no es mínimo.
titulo: La ecuación diferencial de la curva elástica, deducida
cuando: >-
  Deducir la ecuación diferencial de la curva elástica, de la flexión de la
  rebanada a v,xx = −M/(EIz), con el signo de los ejes del curso (y hacia
  abajo) y el paso de la exacta a la aproximada. Cae como cuestión de teoría
  de 1 punto en la extraordinaria de febrero de 2021 y en la de junio de
  2019, y en cuatro convocatorias más de 2013 a 2018 que el sitio aún no
  publica.
puntos:
  - punto: >-
      Se parte de la flexión: las secciones siguen planas, la fibra a
      distancia y de la neutra se alarga εx = y/ρ (ec. 10.1) y, con Hooke,
      σx = Ey/ρ (ec. 10.2).
    porque: >-
      Es la curvatura que impone la deformación de la sección: sin la
      hipótesis de las secciones planas no hay de dónde sacar ρ, ni
      deducción.
    minimo: true
  - punto: >-
      Se iguala con la tensión de flexión, σx = My/Iz (ec. 10.3), y sale
      1/ρ = M/(EIz) (ec. 10.4).
    porque: >-
      Es la mitad mecánica de la ecuación: cuánto se curva la rebanada con un
      flector dado.
    minimo: true
  - punto: >-
      La fibra neutra no cambia de longitud: ρ dθ = dx, así que la curvatura
      es 1/ρ = dθ/dx (ecs. 10.7 y 10.8), y dθ/dx = M/(EIz) (ec. 10.9).
    porque: >-
      Es la mitad geométrica: la misma curvatura escrita con el giro de la
      tangente a la elástica.
    minimo: true
  - punto: >-
      El signo, con el dibujo: con y hacia abajo y M positivo, el giro
      disminuye al avanzar en x, y dθ/dx = −M/(EIz) (figura 10.3 y
      ec. 10.10).
    porque: >-
      Es lo que distingue una deducción de una fórmula recordada, y es justo
      lo que más se confunde con los libros que toman y hacia arriba.
    minimo: true
  - punto: >-
      Con sen θ = v,x y cos θ = 1 + u,x (ec. 10.11) se llega a la exacta,
      v,xx/√(1 − v,x²) = −M/(EIz) (ec. 10.12); con giros pequeños, θ = v,x y
      u,x = 0 (ec. 10.13), y queda la aproximada, v,xx = −M/(EIz)
      (ec. 10.14).
    porque: >-
      La que se integra en los problemas es la aproximada, y hay que decir
      qué se ha despreciado para llegar a ella.
    minimo: true
  - punto: >-
      Se dice cuándo vale y para qué sirve: flexión en un plano principal,
      giros pequeños y viga esbelta, en la que la cortante apenas añade
      flecha; integrada dos veces, con las condiciones de los apoyos, da el
      giro y la flecha.
    porque: >-
      Son las hipótesis que la deducción ha ido usando, y las dos constantes
      de integración son las que fijan los apoyos.
