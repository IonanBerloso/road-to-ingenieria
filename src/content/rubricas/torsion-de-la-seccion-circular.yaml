# Rúbrica compartida (fase P, unidad p9o, 22 de octubre de 2026). Es, punto
# por punto, la que ya estaba escrita en el paso `redactar` de
# `exerm1819-2par-1-la-torsion-de-la-seccion-circular`, y la usa también
# `exerm1617-ext-2-la-torsion-de-piezas-prismaticas-circulares`, que pide lo
# mismo con «prismáticas». No cambia nada del texto: el enunciado de 2019 no
# lo citaba. Las ecuaciones son las de los apuntes del tema 12, apartado
# 12.2 (pp. 4-9, figuras 12.1 a 12.5).
#
# En el sitio, la pregunta cae de teoría y con 1 punto como cuestión 2 de la
# extraordinaria del 16 de junio de 2017 («Torsión en piezas prismáticas de
# sección circular.») y como cuestión 1 de la segunda parte del 16 de enero
# de 2019 («Torsión en piezas de sección circular.»).
#
# Los `minimo` son la hipótesis de Coulomb, las deformaciones y tensiones y
# la tensión en función del torsor: sin cualquiera de ellos no hay teoría.
# Los otros tres, la tensión máxima, el giro y el estado de tensiones del
# borde, se puntúan pero no son mínimos.
titulo: La torsión en piezas de sección circular
cuando: >-
  Explicar la torsión de las piezas de sección circular, de la hipótesis de
  Coulomb a la tensión tangencial τ = Mt·r/Ip, la tensión máxima y el ángulo
  girado. Cae como cuestión de teoría de 1 punto en la extraordinaria de
  junio de 2017 y en la segunda parte de enero de 2019.
puntos:
  - punto: >-
      Se enuncia la hipótesis de Coulomb, que las secciones siguen
      planas y giran como sólidos rígidos con los radios rectos, y se
      escriben los desplazamientos de un punto, u = 0, v = −φz,
      w = φy (ecs. 12.1 a 12.3).
    porque: >-
      Es la única hipótesis, y todo lo demás se deduce de ella.
    minimo: true
  - punto: >-
      Se sacan las deformaciones, solo γxy = −zφ,x y γzx = yφ,x, y con
      Hooke las tensiones, cuya resultante τ = Grφ,x es perpendicular
      al radio (ecs. 12.4 a 12.6).
    porque: >-
      Dice qué tensiones hay (solo tangenciales) y cómo se reparten,
      proporcionales a la distancia al centro.
    minimo: true
  - punto: >-
      Se iguala el momento de las tensiones al torsor, Mt = GIpφ,x, y
      se llega a φ,x = Mt/(GIp) y τ = Mt r/Ip (ecs. 12.7 a 12.10).
    porque: >-
      Es el resultado central: la tensión en función del esfuerzo.
    minimo: true
  - punto: >-
      Se da la tensión máxima en el borde, 16Mt/(πD³) en la maciza y
      su versión hueca con Ip = π(D⁴ − d⁴)/32 (ecs. 12.11 y 12.12).
    porque: >-
      Es la fórmula que se usa para dimensionar.
  - punto: >-
      Se integra el giro, φB − φA = ∫ Mt/(GIp) dx, que con GIp
      constante es el área del diagrama de torsores entre GIp
      (ecs. 12.13 y 12.14).
    porque: >-
      Es la otra mitad del problema, la rigidez.
  - punto: >-
      Se comenta que en el borde hay cortadura pura y que las
      tensiones principales van a 45°, por donde rompen los
      materiales frágiles (págs. 8 y 9).
    porque: >-
      Explica las roturas helicoidales y une el tema con el estado de
      tensiones del tema 2.
