# Rúbrica compartida (fase D0 de la auditoría del 27 de septiembre de 2026).
# Sale de la demostración modelo que ya estaba escrita en las resoluciones de
# `exalg2122-ord-4-una-simetrica-con-tres-autovalores-limpios` (a.i),
# `exalg2324-ext-4-esta-si-se-diagonaliza` (b) y
# `exalg2425-ext-4-diagonalizar-con-una-base-ortonormal` (a), y del tema 7: el
# vector nulo añadido a mano, la linealidad de f y el λ sacado factor común.
# Los `minimo` son esos tres pasos: el nulo es lo que el enunciado pone a
# prueba, y sin los otros dos la demostración no prueba nada. El atajo del
# núcleo lo dan las tres resoluciones como forma más corta, y va sin mínimo.
titulo: El subespacio propio de un autovalor es subespacio vectorial
cuando: >-
  Demuestra que los autovectores de un autovalor λ, junto con el vector nulo,
  forman un subespacio vectorial de E. Cae como demostración entera en el
  ejercicio 4 de la ordinaria de 2021-2022 (apartado a.i), de la extraordinaria
  de 2023-2024 (apartado b) y de la extraordinaria de 2024-2025 (apartado a),
  las tres con el conjunto escrito igual: se quita el nulo y se vuelve a
  añadir.
puntos:
  - punto: |
      **El $\overline{0}$ está por construcción, y decir por qué el enunciado
      lo añade a mano.** No es autovector —cumple
      $f\left(\overline{0}\right)=\lambda\overline{0}$ para cualquier
      $\lambda$—, pero sin él el conjunto no sería subespacio.
    porque: |
      Es el detalle que el ejercicio pone a prueba. Dos autovectores opuestos,
      $\overline{x}$ y $-\overline{x}$, suman $\overline{0}$: sin la unión con
      $\left\{\overline{0}\right\}$ la suma se saldría del conjunto. Y es
      también lo que asegura que no es vacío.
    minimo: true
  - punto: |
      **Dos vectores y dos escalares cualesquiera:** $\overline{x}$ e
      $\overline{y}$ del conjunto, con
      $f\left(\overline{x}\right)=\lambda\overline{x}$ y
      $f\left(\overline{y}\right)=\lambda\overline{y}$, y $\alpha,\beta\in K$.
    porque: |
      La condición la cumplen todos los elementos, también el $\overline{0}$,
      así que no hay casos que separar. Y tienen que ser genéricos: un ejemplo
      con números comprueba un caso, no que el conjunto sea cerrado.
  - punto: |
      **La linealidad de $f$, nombrada en el paso donde entra:**

      $$
      f\left(\alpha\overline{x}+\beta\overline{y}\right)
      =\alpha f\left(\overline{x}\right)+\beta f\left(\overline{y}\right)
      $$
    porque: |
      Es el único sitio donde se usa que $f$ es un endomorfismo, y sin ella el
      resultado es falso: con $f\left(x\right)=x^{2}$ en $\mathbb{R}$ y
      $\lambda=1$, los $x$ con $f\left(x\right)=x$ son $0$ y $1$, y
      $\left\{0,1\right\}$ no es cerrado para la suma.
    minimo: true
  - punto: |
      **Sacar $\lambda$ factor común y concluir:**

      $$
      \alpha\lambda\overline{x}+\beta\lambda\overline{y}
      =\lambda\left(\alpha\overline{x}+\beta\overline{y}\right)
      $$

      así que $\alpha\overline{x}+\beta\overline{y}$ está en el conjunto, y el
      conjunto es subespacio de $E$.
    porque: |
      La combinación cumple la condición que define el conjunto, y eso es
      estar dentro, sea el $\overline{0}$ o un autovector. Sin esta línea se ha
      hecho la cuenta, pero no se ha dicho qué demuestra.
    minimo: true
  - punto: |
      **La lectura, en una línea:** el conjunto es
      $\operatorname{Ker}\left(f-\lambda\,\mathrm{id}\right)$, y el núcleo de
      una aplicación lineal siempre es subespacio.
    porque: |
      No se pide y suma: dice **por qué** es subespacio en vez de solo
      comprobarlo, y es como se calcula en la práctica, resolviendo
      $\left(A-\lambda I\right)\overline{x}=\overline{0}$. Si se usa como
      demostración entera, hay que decir que $f-\lambda\,\mathrm{id}$ es
      lineal.
