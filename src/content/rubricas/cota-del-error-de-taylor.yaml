# Rúbrica compartida (fase D0 de la auditoría del 27 de septiembre de 2026).
# Sale de las resoluciones modelo que ya estaban escritas en
# `ex2122-2ev-3-cota-en-el-otro-sentido` y `ex2223-2ev-4-cota-y-error-exacto`,
# que son el mismo ejercicio con otra gráfica: el polinomio de orden 1 leído
# en las curvas, la cota del error con el resto de Lagrange y el error exacto
# comparado con ella. Cubre los apartados b) y c), que son los de COMP4. Los
# `minimo` son el resto escrito, el máximo de |f''| en todo el intervalo —las
# dos resoluciones enseñan que tomarlo en un solo punto da una cota falsa— y
# la comprobación que pide el último apartado.
titulo: La cota del error de Taylor de orden 1, leída en las gráficas y comprobada
cuando: >-
  Acota el error de aproximar f(x) con el polinomio de Taylor de orden 1 en a,
  leyendo f'' en su gráfica, y compara la cota con el error exacto. Cae con el
  mismo enunciado, cambiando la figura y los puntos, en las segundas
  evaluaciones de 2021-2022 y 2022-2023, con COMP4 6. Con un polinomio de orden
  n el resto lleva la derivada n+1 y la potencia n+1 de x − a, y el
  razonamiento es el mismo.
puntos:
  - punto: |
      **El resto de Lagrange, escrito**:
      $R_1(x) = \dfrac{f''(\xi)}{2!}\,(x-a)^{2}$, con $\xi$ entre $a$ y $x$.
    porque: |
      El error de un polinomio de orden 1 lo decide la derivada siguiente, la
      segunda: por eso el enunciado dibuja $f''$. Sin el resto escrito, la
      cota que venga después no se sabe de dónde sale.
    minimo: true
  - punto: |
      **Dónde vive $\xi$**: en el intervalo que va de $a$ a $x$, a la
      izquierda del centro si $x < a$; y como no se sabe en qué punto está,
      se acota $\left|f''\right|$ en **todo** ese intervalo.
    porque: |
      La fórmula no distingue direcciones, porque $(x-a)^{2}$ es positivo a
      los dos lados, pero el intervalo donde hay que mirar $f''$ sí cambia.
      Mirarlo al otro lado del centro es acotar otra cosa.
  - punto: |
      **El máximo de $\left|f''\right|$ en ese intervalo**, leído en su
      gráfica: en su pico si lo tiene dentro, en un extremo si es monótona.
      Nunca el valor en un solo punto.
    porque: |
      Es el error que persiguen los dos exámenes. Tomar $f''$ en el centro o
      en el punto donde se aproxima puede dar una cota menor que el error
      real —en uno de ellos daba 0 con un error de 2—, y una cota que no
      acota nada no vale ningún punto.
    minimo: true
  - punto: |
      **El redondeo, hacia arriba y solo hacia arriba**, si el máximo se lee
      entre dos líneas de la rejilla.
    porque: |
      Una cota generosa sigue siendo una cota; redondear hacia abajo la
      invalida. Decir hacia dónde se redondea enseña que se sabe qué es una
      cota.
  - punto: |
      **La cota, con la distancia al cuadrado y el factorial**:
      $\left|R_1(x)\right| \le \dfrac{M}{2}\,(x-a)^{2}$.
    porque: |
      Olvidar el $2!$ duplica la cota, y usar $\left|x-a\right|$ sin elevar al
      cuadrado cambia la cuenta entera. Es la línea que se corrige con
      números.
  - punto: |
      **El error exacto y la comprobación**: $\left|f(x)-P_1(x)\right|$ con el
      valor real de la función, y escrito que no pasa de la cota.
    porque: |
      Es lo que pide el último apartado, y tiene que salir por construcción:
      la cota usa el peor valor de $f''$ y el error real, su valor en un
      $\xi$ concreto. Si saliera mayor, delataría un error de cuenta, no un
      problema de la función.
    minimo: true
