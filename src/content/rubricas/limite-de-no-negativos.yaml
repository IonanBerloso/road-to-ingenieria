# Rúbrica compartida (fase D0 de la auditoría del 27 de septiembre de 2026).
# Sale de la demostración modelo de `ex1617-3-limite-no-negativo`, la que ya
# estaba escrita en su resolución: la definición, el absurdo, el épsilon de la
# mitad y el choque con la hipótesis. Los `minimo` son lo que la propia
# resolución dice que se puntúa o sin lo que la demostración no se sostiene.
titulo: Si todos los términos son no negativos, el límite también
cuando: >-
  Demuestra que si a_n ≥ 0 para todo n y la sucesión converge a L, entonces
  L ≥ 0. Cae como demostración entera en el primer parcial —2016-2017, con
  COMP4 8— y es el ejercicio 2.3 del boletín del tema 2. Su reflejo, con
  a_n ≤ 0, cambia los signos y necesitaría una rúbrica propia.
puntos:
  - punto: |
      **La definición de límite, escrita.**
      $\forall\varepsilon>0\;\exists\, m \in \mathbb{N} : n>m \Rightarrow \left|a_n-L\right| < \varepsilon$.
    porque: |
      Forma parte de lo que se puntúa, y es la herramienta: todo lo que sigue
      sale de aplicarla con un épsilon concreto. Quien no la escribe no tiene
      de dónde sacar el $m$.
    minimo: true
  - punto: |
      **Reducción al absurdo: suponer $L < 0$.**
    porque: |
      La conclusión es una desigualdad no estricta, y negarla da un número
      negativo con el que se construye el épsilon. Sin decir qué se supone,
      la contradicción del final no cierra nada.
    minimo: true
  - punto: |
      **Tomar $\varepsilon = -L/2$, y decir que es positivo porque $L$ es
      negativo.**
    porque: |
      Es la mitad de la distancia de $L$ a 0. Con $\varepsilon = |L|$ el
      intervalo llegaría justo hasta 0 y podría darse $a_n = 0$, que la
      hipótesis permite: el choque dejaría de ser limpio.
  - punto: |
      **Existe $m$ con $a_n < L + \varepsilon = L/2 < 0$ para todo $n > m$.**
    porque: |
      De $|a_n - L| < \varepsilon$ basta el lado de arriba, y es lo que deja
      **todos** los términos a partir de $m$ estrictamente negativos.
    minimo: true
  - punto: |
      **La contradicción con $a_n \ge 0$, y la conclusión $L \ge 0$.**
    porque: |
      Hay que decir contra qué hipótesis choca. Y la conclusión es $\ge$, no
      $>$: con $a_n = 1/n$, todos estrictamente positivos, el límite es 0.
