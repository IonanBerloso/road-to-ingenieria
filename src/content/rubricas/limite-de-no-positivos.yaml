# Rúbrica compartida (fase D0 de la auditoría del 27 de septiembre de 2026).
# Sale de la demostración modelo de `ex1718-3-limite-no-positivo`, la que ya
# estaba escrita en su resolución —la misma que la de `ex2425-3-limite-no-positivo`
# y la de `ex1920-rec-3-el-signo-sobrevive-al-limite`—, y la usan esos tres
# ejercicios de examen. Es el reflejo de `limite-de-no-negativos` con los signos
# cambiados, y lleva los mismos `minimo`: la definición escrita, el absurdo y el
# índice a partir del cual todos los términos serían positivos.
titulo: Si todos los términos son no positivos, el límite también
cuando: >-
  Demuestra que si a_n ≤ 0 para todo n y la sucesión converge a L, entonces
  L ≤ 0. Cae como demostración entera en tres convocatorias: en la primera
  evaluación de 2017-2018, con COMP4 8, y en la cuarta evaluación de
  2019-2020 y la primera de 2024-2025, las dos con los diez puntos en COMP4.
  Es el reflejo del ejercicio 2.3 del boletín del tema 2.
puntos:
  - punto: |
      **La definición de límite, escrita.**
      $\forall\varepsilon>0\;\exists\, m \in \mathbb{N} : n>m \Rightarrow \left|a_n-L\right| < \varepsilon$.
    porque: |
      Forma parte de lo que se puntúa, y es la herramienta: la contradicción
      sale de aplicarla con un épsilon concreto. Quien no la escribe no tiene
      de dónde sacar el $m$.
    minimo: true
  - punto: |
      **Reducción al absurdo: suponer $L > 0$.**
    porque: |
      La tesis es una desigualdad no estricta, y negarla da un número positivo
      con el que se construye el épsilon. Sin decir qué se supone, la
      contradicción del final no cierra nada.
    minimo: true
  - punto: |
      **Tomar $\varepsilon = L/2$, y decir que es positivo porque se ha
      supuesto $L$ positivo.**
    porque: |
      La definición solo se puede invocar con un épsilon positivo, y este lo es
      gracias a lo supuesto: si $L$ fuera negativo, no valdría. Cualquier
      $\varepsilon$ con $0 < \varepsilon < L$ serviría; la mitad deja la banda
      entera a la derecha del 0 con margen, y es la más cómoda de escribir.
  - punto: |
      **Existe $m$ con $a_n > L - \varepsilon = L/2 > 0$ para todo $n > m$.**
    porque: |
      De $|a_n - L| < \varepsilon$ basta el lado de abajo —en su reflejo, con
      $a_n \ge 0$, era el de arriba—, y es lo que deja **todos** los términos
      a partir de $m$ estrictamente positivos.
    minimo: true
  - punto: |
      **La contradicción con $a_n \le 0$, y la conclusión $L \le 0$.**
    porque: |
      Hay que decir contra qué hipótesis choca. Y la conclusión es $\le$, no
      $<$: con $a_n = -1/n$, todos estrictamente negativos, el límite es 0.
