# Rúbrica compartida (fase D0 de la auditoría del 27 de septiembre de 2026).
# Sale de la demostración modelo de `ex2021-2ev-2-rolle-enunciar-y-demostrar`,
# la que ya estaba escrita en su resolución: Weierstrass da el máximo y el
# mínimo, la igualdad en los extremos mete uno de los dos dentro y Fermat anula
# la derivada allí. Los `minimo` son el enunciado con sus tres hipótesis y los
# tres pasos que encadenan esos teoremas; la resolución insiste en que cada
# hipótesis hace un trabajo distinto, y eso es lo que el corrector mira. El
# contraejemplo del valor absoluto es el del tema 4.
titulo: El teorema de Rolle, enunciado y demostrado
cuando: >-
  Enuncia y demuestra el teorema de Rolle: si f es continua en [a,b], derivable
  en (a,b) y f(a) = f(b), existe c ∈ (a,b) con f'(c) = 0. Cae como apartado a)
  de la segunda evaluación de 2020-2021, antes de otro que pide comprobar si
  se aplica a una función a trozos. Rolle es también el paso central de la
  demostración de Lagrange, que tiene su propia rúbrica.
puntos:
  - punto: |
      **El enunciado con sus tres hipótesis**: continua en el cerrado
      $[a,b]$, derivable en el abierto $(a,b)$ y $f(a) = f(b)$. La tesis:
      existe al menos un $c \in (a,b)$ con $f'(c) = 0$.
    porque: |
      Un teorema enunciado sin sus hipótesis es la conclusión suelta, y eso
      no se puntúa. Cada una va en su intervalo a propósito: la derivabilidad
      solo se pide en el abierto, que es donde se va a usar.
    minimo: true
  - punto: |
      **Weierstrass, citado por su nombre**: $f$ es continua en el cerrado y
      acotado $[a,b]$, así que alcanza su máximo absoluto $M$ y su mínimo
      absoluto $m$.
    porque: |
      Es lo que garantiza que hay un extremo al que aplicarle algo. El máximo
      y el mínimo los da la continuidad, no la igualdad $f(a) = f(b)$:
      atribuírselos a ella es el error que este ejercicio busca.
    minimo: true
  - punto: |
      **El caso $M = m$**: la función es constante, $f'(x) = 0$ en todo
      $(a,b)$ y cualquier punto sirve de $c$.
    porque: |
      Es el caso en que el paso siguiente no funciona, porque no hay ningún
      valor distinto de $f(a)$. Despacharlo cuesta una línea y deja la
      demostración sin agujero.
  - punto: |
      **El caso $M > m$, y dónde entra $f(a) = f(b)$**: al menos uno de los
      dos valores es distinto de $f(a) = f(b)$, así que no se alcanza ni en
      $a$ ni en $b$: hay un $c$ **interior** donde $f$ tiene un extremo.
    porque: |
      Es el trabajo de la tercera hipótesis: meter un extremo dentro. Sin ella
      los dos podrían estar en los bordes, como en una función monótona, y no
      habría ningún punto con tangente horizontal.
    minimo: true
  - punto: |
      **Fermat en ese $c$**: hay un extremo en un punto interior y $f$ es
      derivable ahí, porque $c \in (a,b)$; luego $f'(c) = 0$.
    porque: |
      Fermat pide las dos cosas y hay que decir de dónde sale cada una. Sin
      derivabilidad el argumento se cae: $\left|x\right|$ en $[-1,1]$ cumple
      $f(-1) = f(1)$, tiene su mínimo dentro y su derivada no se anula en
      ningún punto, porque en 0 no existe.
    minimo: true
  - punto: |
      **Qué hace cada hipótesis**, dicho al final: la continuidad da los
      extremos, la igualdad mete uno dentro y la derivabilidad permite aplicar
      Fermat.
    porque: |
      Ninguna sobra y cada una hace un trabajo distinto. Saber cuál hace qué
      es lo que se evalúa, y escribirlo en una línea lo demuestra.
