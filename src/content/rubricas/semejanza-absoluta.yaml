# Rúbrica compartida (fase I de Fluidos, unidad i-rub, 29 de septiembre de
# 2026). Razonar si la semejanza dinámica absoluta es posible, tal como la dan
# las diapositivas 8 a 10 y 15 a 18 del tema 16 y los Apuntes, vol. I, págs.
# 14 a 16. Generaliza la rúbrica que estaba escrita en el paso de
# `exflu2223-ord-6-mach-y-reynolds-a-la-vez` y la sustituye; lo que cambia
# está en `mapa.md` de la unidad.
#
# Cae en diez convocatorias: 1920-2par-2 c), 1920-ord-5 b), 2021-ord-6 b) y
# c), 2122-ext-5, 2223-ord-6 a) y b), 2223-ext-5 b), 2324-ord-7 b),
# 2324-ext-5 b), 2425-ord-5 b) y 2526-ord-7 b).
#
# Los `minimo` son la definición, qué números gobiernan, las igualdades
# combinadas y la condición que resulta contrastada con los datos: con eso
# la pregunta está contestada. La semejanza restringida es lo que se hace
# después, cuando la respuesta es que no, y va sin `minimo`.
titulo: La semejanza dinámica absoluta, posible o no
cuando: >-
  Razonar si es posible la semejanza dinámica absoluta entre un modelo a
  escala y su prototipo, y bajo qué condición: igualar a la vez los números
  que gobiernan el fenómeno, combinarlos y contrastar la condición con los
  fluidos, la gravedad y la escala del enunciado. Cae en diez de las
  dieciséis convocatorias, en ocho de ellas detrás de los adimensionales, y
  la respuesta impresa es que no en la mayoría: lo que se puntúa es por qué,
  y qué haría falta.
puntos:
  - punto: |
      **Qué es la semejanza dinámica absoluta**, dicho: modelo y prototipo
      geométricamente semejantes y con **todos** los parámetros
      adimensionales del fenómeno iguales. Basta igualar todos menos el que
      lleva la incógnita, la fuerza o la caída de presión, que sale igual
      solo.
    porque: |
      Es la definición de la diapositiva 15 del tema 16, y sin ella no hay
      criterio para decir que sí o que no. Los Apuntes (vol. I, pág. 14)
      añaden lo segundo: «es suficiente verificar que todos los parámetros
      menos uno sean iguales, ya que por la función que los relaciona, se
      verificará la igualdad de todos». Igualar también el de la fuerza no es
      un error, pero ese no pone ninguna condición: es lo que se mide.
    minimo: true
  - punto: |
      **Qué números gobiernan este fenómeno, y por qué**: los obtenidos en el
      apartado anterior o los habituales, cada uno por la variable que lo
      trae: la viscosidad, Reynolds; la gravedad, Froude; la
      compresibilidad, Mach; la tensión superficial, Weber.
    porque: |
      Las diapositivas 8 a 10 del tema 16 dan qué fuerzas compara cada uno.
      Muchos enunciados no los nombran —dicen «compresibilidad» y
      «viscosidad»— y la traducción es parte de la respuesta. El segundo
      parcial de 2020 lo pide así: «se puede basar la respuesta en los
      números adimensionales deducidos en el paso anterior, o en los
      habituales cuyo uso esté justificado por la lista de variables
      involucradas. En el caso en el que se opte por esta segunda opción se
      debe justificar».
    minimo: true
  - punto: |
      **Las igualdades, planteadas a la vez y combinadas**, no razonadas de
      palabra. Con Froude y Reynolds, y $\lambda = L_m/L_p$, salen
      $V_m/V_p = \lambda^{1/2}$ y $\nu_m/\nu_p = \lambda^{3/2}$; con Mach y
      Reynolds y el mismo gas a la misma temperatura, $V_m = V_p$ y
      $\rho_m/\rho_p = 1/\lambda$.
    porque: |
      «No se pueden cumplir las dos» es una afirmación; lo que se puntúa es
      la cuenta que la sostiene. Al combinar las igualdades desaparecen las
      velocidades y queda una condición sobre las propiedades del fluido y la
      escala, que es lo que el examen pide y lo que no se puede adivinar. Las
      dos primeras relaciones son las de la diapositiva 15 del tema 16.
    minimo: true
  - punto: |
      **La condición, contrastada con los datos y dicha con palabras**: con
      el mismo fluido y la misma gravedad, la única escala posible es
      $\lambda = 1$, y a escala reducida no hay semejanza absoluta. Si algo
      puede cambiar —la presión del gas, el fluido, la gravedad—, la
      condición da el valor que haría falta, y se compara con lo que hay.
    porque: |
      Es la conclusión de los Apuntes (vol. I, pág. 15): con la misma
      gravedad y la misma viscosidad, «la escala geométrica ... habrá de ser
      la unidad». Y la condición es la respuesta útil: en la final de junio
      de 2021 la semejanza pediría el aire del túnel a 10 bar, y el túnel
      llega a 6, así que no; en la extraordinaria de 2024 pediría una
      gravedad de 1,38 m/s² en el planeta del prototipo. «Habría que cambiar
      de fluido» no dice nada que no se supiera antes de empezar.
    minimo: true
  - punto: |
      **Si no se puede, cuál se sacrifica y por qué**: en un flujo en carga
      se conserva Reynolds y se renuncia a Froude; en superficie libre, al
      revés; y Mach se desprecia por debajo de 0,3. Si el gas es el mismo,
      presurizar el modelo es la otra salida, porque la velocidad del sonido
      y la viscosidad apenas dependen de la presión.
    porque: |
      Es la regla de la diapositiva 18 del tema 16 —semejanza restringida de
      Reynolds en carga, de Froude en superficie libre— y la de la
      diapositiva 9, «cuando el número de Mach es menor de 0,3 el flujo es
      incompresible». Elegir al revés es el error caro: el número sale, el
      apartado queda completo y todo lo que viene después está mal. La salida
      de presurizar la abre la nota de dos enunciados con gases, la
      ordinaria de 2023 y la final de junio de 2021: la velocidad del sonido
      y la viscosidad son «muy poco dependientes de la presión y muy
      dependientes de la temperatura».
