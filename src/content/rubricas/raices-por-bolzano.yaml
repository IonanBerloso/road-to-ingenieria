# Rúbrica compartida (fase D2 de la auditoría del 27 de septiembre de 2026).
# Sale de las resoluciones modelo que ya estaban escritas en el tema 3
# —`bolzano-raiz-unica`, `bolzano-tres-raices-de-una-quintica` y
# `punto-fijo-del-coseno`— y en
# `ex1617-5rec-1-una-sola-raiz-y-hay-que-probarlo`, que tiene el mismo
# enunciado que la primera. Las cuatro hacen lo mismo: ponen nombre a la
# función, dicen por qué es continua en un cerrado, calculan los dos signos y
# citan a Bolzano; y cuando el enunciado pide más, añaden la monotonía para la
# unicidad o un intervalo por raíz.
#
# Los `minimo` son esas cuatro líneas, porque son la aplicación entera: sin
# cualquiera de ellas falta una hipótesis del teorema o falta su conclusión.
# La unicidad y las k raíces no llevan mínimo aunque el enunciado que las pide
# no quede contestado sin ellas: la rúbrica la comparten ejercicios que piden
# una cosa y no la otra —la quíntica pide tres raíces y no unicidad; el
# coseno, unicidad y no tres raíces—, y un mínimo que no aplica avisaría en la
# página de una falta que no lo es. Cuando un enunciado las pide, lo dice su
# consigna.
#
# Se llama «raíces» y no «una raíz» por lo mismo: cubre también «exactamente
# una» y «al menos tres». Demostrar el teorema del valor intermedio es otro
# ejercicio y tiene su rúbrica, `teorema-del-valor-intermedio`.
titulo: Las raíces de una ecuación, garantizadas con Bolzano
cuando: >-
  Demuestra que una ecuación tiene al menos una raíz en un intervalo aplicando
  el teorema de Bolzano a una función concreta y, si el enunciado lo pide, que
  es la única o que hay al menos k. Cae como ejercicio 1 de la recuperación de
  la quinta evaluación de 2016-2017 —una raíz positiva de x·eˣ − 1, y si tiene
  más—, que es el 3.5 de los problemas complementarios del tema 3; el tema 3 la
  usa además con x⁵ − 3x + 1 = 0, al menos tres raíces, y con cos x = x,
  exactamente una. El apartado b) de la segunda evaluación de 2018-2019 aplica
  Bolzano a f' y el a) de la segunda de 2023-2024 a f − 1, pero los dos llevan
  su rúbrica escrita en el paso porque piden más: el enunciado del teorema y
  el paso de punto crítico a extremo el primero, una segunda demostración con
  Lagrange el segundo. Demostrar el propio teorema del valor intermedio es
  otro ejercicio, con su rúbrica.
puntos:
  - punto: |
      **La función y el intervalo, escritos**: la función cuyo cero es la
      raíz, con nombre —la del enunciado si ya viene dada; la ecuación pasada
      a un lado, $g(x) = 0$, si viene como ecuación; $g = f-k$ si lo que se
      pide es que $f$ tome el valor $k$—, y el intervalo **cerrado** $[a,b]$
      en el que aplicas el teorema.
    porque: |
      Bolzano habla de ceros de una función, y una ecuación con $x$ a los dos
      lados no tiene teorema que la ataque: aplicado a uno solo de los
      miembros, diría dónde se anula ese miembro, que es otra pregunta. Y el
      intervalo decide lo que queda demostrado: la raíz sale en el abierto
      $(a,b)$, así que tiene que estar donde la pide el enunciado; si la
      quiere positiva, con $a \ge 0$.
    minimo: true
  - punto: |
      **La continuidad de $g$ en ese cerrado, con su motivo**: polinomio;
      suma, producto o composición de continuas; cociente con un denominador
      que no se anula en $[a,b]$. Y si $g$ tiene un punto delicado —un
      denominador que se anula, un logaritmo, una raíz par, un empalme—, que
      queda fuera del intervalo.
    porque: |
      Es la hipótesis que hace el teorema, y se pide en el cerrado, extremos
      incluidos. Sin ella el cambio de signo no obliga a cortar el eje:
      $\frac{1}{x}$ vale $-1$ en $x = -1$ y $1$ en $x = 1$ y no se anula
      nunca: salta de un signo al otro en $x = 0$, donde no está definida.
      «Es continua», sin el motivo, afirma justo lo que había que comprobar.
    minimo: true
  - punto: |
      **Los signos en los extremos, calculados**: $g(a)$ y $g(b)$ con su
      valor, exacto o acotado, y los dos signos escritos: $g(a) < 0 < g(b)$,
      o al revés.
    porque: |
      El cambio de signo es la otra hipótesis, y se demuestra con dos
      números: «se ve en la gráfica» o «claramente es positivo» no demuestran
      nada. Cuando el valor no sale exacto —una exponencial, un coseno—,
      basta acotarlo con lo que se sabe sin calculadora, porque lo único que
      se usa es el signo. Y tiene que ser estricto: si uno de los dos vale
      cero, ese extremo ya es una raíz y el teorema sobra.
    minimo: true
  - punto: |
      **La conclusión, con el teorema nombrado**: por el teorema de Bolzano
      existe **al menos un** $c \in (a,b)$ con $g(c) = 0$, y la frase que lo
      devuelve al enunciado: ese $c$ es la solución de la ecuación, la raíz
      positiva o el punto donde $f$ vale $k$.
    porque: |
      Bolzano da existencia y nada más. Hablar de «la raíz», con artículo, ya
      afirma que es única, y situarla en el punto medio afirma dónde está:
      ninguna de las dos cosas la da el teorema. Y el nombre es lo que
      convierte las tres líneas anteriores en una demostración; el teorema
      que da un cero con un cambio de signo es Bolzano, no Rolle, que habla
      de la derivada.
    minimo: true
  - punto: |
      **Si se pide que sea la única: la monotonía, o Rolle.** El signo de
      $g'$ en todo el conjunto donde afirmas la unicidad —siempre positivo, o
      siempre negativo, salvo en puntos aislados donde se anule— hace a $g$
      estrictamente monótona, y entonces corta el eje una vez como mucho. O
      por reducción al absurdo: dos raíces $c_1 < c_2$ darían por Rolle un
      $\xi \in (c_1,c_2)$ con $g'(\xi) = 0$, y $g'$ no se anula. Si $g'$
      cambia de signo, por tramos: en cada tramo monótono, una raíz como
      mucho, y donde no hay ninguna, el motivo, con los valores de $g$ allí.
    porque: |
      Bolzano da un mínimo de raíces, nunca un máximo: $x^{3}-x$ cambia de
      signo en $[-2,2]$ y tiene tres. Y la monotonía vale solo donde se ha
      comprobado: $x^{2}-1$ crece en $(0,+\infty)$ y tiene ahí una raíz, y
      tiene otra en $x = -1$. Que $g$ tenga un mínimo tampoco obliga a cortar
      dos veces: lo decide cuánto vale en él.
  - punto: |
      **Si se piden $k$ raíces: $k$ intervalos, cada uno con su cambio de
      signo.** Los valores de $g$ en $k+1$ puntos ordenados, con los signos
      alternando, y Bolzano en cada tramo. Los abiertos son disjuntos —dos
      tramos pueden compartir un extremo, que no es raíz porque su signo es
      estricto—, así que las $k$ raíces son distintas.
    porque: |
      Dos cambios de signo en intervalos que se solapan pueden ser la misma
      raíz contada dos veces: $x$ cambia de signo en $[-1,1]$ y en $[-2,2]$,
      y tiene una sola. Eso da **al menos** $k$; para exactamente $k$ falta la
      cota por arriba, que es Rolle: si $g'$ se anula $k-1$ veces como mucho,
      $g$ no tiene más de $k$ raíces. El grado de un polinomio no la da,
      porque cuenta también las raíces complejas.
