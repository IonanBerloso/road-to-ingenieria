# Rúbrica compartida (fase D0 de la auditoría del 27 de septiembre de 2026).
# Sale de la demostración modelo que ya estaba escrita en las resoluciones de
# `exalg2122-ord-3-ortonormalizar-con-un-producto-escalar-que-no-es-el-de-siempre`
# (a.ii) y `exalg2223-ext-3-cuando-existe-la-inversa-y-cuanto-vale` (a), y del
# tema 6: la norma por su definición, la bilinealidad, la simetría que da el 2,
# la definición de ortogonal al final y las equivalencias que dan los dos
# sentidos a la vez. Los `minimo` son las dos definiciones, la simetría y los
# dos sentidos; la extraordinaria de 2022-2023 pide además definir norma y
# vectores ortogonales, y la rúbrica las mira donde la demostración las usa.
titulo: Pitágoras en un espacio euclídeo, la igualdad de normas equivale a ser ortogonales
cuando: >-
  Demuestra que en un espacio vectorial euclídeo ‖u + v‖² = ‖u‖² + ‖v‖² si y
  solo si u y v son ortogonales, desarrollando el cuadrado con el producto
  escalar. Cae en el apartado a.ii del ejercicio 3 de la ordinaria de
  2021-2022, detrás de la desigualdad triangular, y de la extraordinaria de
  2022-2023, detrás de definir vectores ortogonales y norma. La desigualdad
  triangular y la identidad de polarización empiezan con el mismo desarrollo
  y terminan distinto.
puntos:
  - punto: |
      **La norma por su definición:**
      $\left\|\overline{x}\right\|=\sqrt{\left\langle\overline{x},\overline{x}\right\rangle}$,
      que existe porque el producto escalar es definido positivo. Así que
      $\left\|\overline{u}+\overline{v}\right\|^{2}=\left\langle\overline{u}+\overline{v},\overline{u}+\overline{v}\right\rangle$.
    porque: |
      Es el único puente entre las normas del enunciado y el producto escalar,
      que es lo que se puede desarrollar; la norma, con su raíz, no. Y si el
      enunciado pide definir la norma, esta línea es esa definición.
    minimo: true
  - punto: |
      **Abrir el producto por bilinealidad**, en cuatro sumandos y sin
      coordenadas:

      $$
      \left\langle\overline{u},\overline{u}\right\rangle
      +\left\langle\overline{u},\overline{v}\right\rangle
      +\left\langle\overline{v},\overline{u}\right\rangle
      +\left\langle\overline{v},\overline{v}\right\rangle
      $$
    porque: |
      Parece un producto notable y no lo es: es una propiedad del producto
      escalar, y hay que nombrarla. Y el enunciado habla de un espacio
      euclídeo cualquiera: hacerlo en $\mathbb{R}^{3}$ con componentes
      demuestra un caso, no el teorema.
  - punto: |
      **Juntar los dos cruzados por la simetría,**
      $\left\langle\overline{v},\overline{u}\right\rangle=\left\langle\overline{u},\overline{v}\right\rangle$,
      y de ahí

      $$
      \left\|\overline{u}+\overline{v}\right\|^{2}
      =\left\|\overline{u}\right\|^{2}
      +2\left\langle\overline{u},\overline{v}\right\rangle
      +\left\|\overline{v}\right\|^{2}
      $$
    porque: |
      El $2$ sale de la simetría, no de la bilinealidad: la bilinealidad abre
      el paréntesis y la simetría junta dos de los sumandos. Son dos
      propiedades distintas de la definición, las dos hacen falta, y
      confundirlas es el error de este desarrollo.
    minimo: true
  - punto: |
      **La igualdad del enunciado equivale a
      $\left\langle\overline{u},\overline{v}\right\rangle=0$**, restando
      $\left\|\overline{u}\right\|^{2}+\left\|\overline{v}\right\|^{2}$ a los
      dos lados; y eso es, **por definición**, $\overline{u}\perp\overline{v}$.
    porque: |
      La demostración termina en la definición de ortogonal, y hay que
      escribirla: es lo que convierte una cuenta en el teorema. Ser distintos
      no tiene nada que ver: $\left(1,0\right)$ y $\left(2,0\right)$ son
      distintos y su producto escalar usual vale $2$.
    minimo: true
  - punto: |
      **Los dos sentidos, dichos:** cada paso es una equivalencia, así que la
      cadena vale de izquierda a derecha y de derecha a izquierda a la vez.
    porque: |
      Es un «si y solo si». Quien escribe la cadena con $\Rightarrow$ ha
      demostrado una mitad; con $\Leftrightarrow$, y diciendo por qué cada
      paso lo es, las dos de una vez, sin repetirla al revés.
    minimo: true
