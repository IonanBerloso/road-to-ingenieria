# Rúbrica compartida (fase D0 de la auditoría del 27 de septiembre de 2026).
# Sale de la demostración modelo que ya estaba escrita en las resoluciones de
# `exalg2324-ord-1-cambiar-de-base-para-que-salga-1-0-0` (b) y
# `exalg2425-ord-1-la-suma-de-subespacios-y-una-base-de-r4` (a): la
# definición, el nulo como suma de nulos, los dos elementos descompuestos y el
# reagrupamiento con cada paréntesis en su subespacio. Los `minimo` son la
# definición —que la ordinaria de 2024-2025 pide aparte— y los dos pasos donde
# entra que S y T son subespacios. El último punto es la pieza trampa del paso
# `justificar` de la ordinaria de 2024-2025, dicha como lo que no hay que
# escribir.
titulo: La suma de dos subespacios es un subespacio
cuando: >-
  Demuestra que si S y T son subespacios de V, entonces S + T, el conjunto de
  las sumas s + t con s en S y t en T, también lo es. Cae en el ejercicio 1 de
  la ordinaria de 2023-2024 (apartado b) y en el de la ordinaria de 2024-2025
  (apartado a), que además pide definir S + T.
puntos:
  - punto: |
      **La definición de $S+T$, escrita:**
      $S+T=\left\{s+t\;:\;s\in S,\;t\in T\right\}$.
    porque: |
      Es lo que se usa para escribir sus elementos, y cuando el enunciado la
      pide es media respuesta. Y no es la unión: en $\mathbb{R}^{2}$, los dos
      ejes unidos contienen a $\left(1,0\right)$ y a $\left(0,1\right)$ pero no
      a su suma. $S+T$ es el menor subespacio que contiene a los dos.
    minimo: true
  - punto: |
      **No es vacío, y por qué:**
      $\overline{0}=\overline{0}+\overline{0}\in S+T$, porque $S$ y $T$
      contienen al $\overline{0}$ por ser subespacios.
    porque: |
      Hay que decir de dónde sale cada sumando, no solo escribir la igualdad.
      Es la primera vez que se usa que $S$ y $T$ son subespacios.
    minimo: true
  - punto: |
      **Dos elementos cualesquiera, escritos con la definición:**
      $u=s_{1}+t_{1}$ y $v=s_{2}+t_{2}$, con $s_{1},s_{2}\in S$ y
      $t_{1},t_{2}\in T$, y dos escalares $\alpha,\beta\in K$.
    porque: |
      Sin descomponerlos no hay forma de usar la hipótesis, que habla de $S$ y
      de $T$ por separado. Y tienen que ser genéricos: una suma con números no
      demuestra que el conjunto sea cerrado.
  - punto: |
      **Reagrupar y decir por qué cada paréntesis está donde está:**

      $$
      \alpha u+\beta v
      =\left(\alpha s_{1}+\beta s_{2}\right)+\left(\alpha t_{1}+\beta t_{2}\right)
      $$

      con el primero en $S$ y el segundo en $T$ **porque son subespacios**.
      Luego $\alpha u+\beta v\in S+T$, y $S+T$ es subespacio de $V$.
    porque: |
      Reordenar los cuatro sumandos vale porque la suma de vectores es
      conmutativa y asociativa, pero lo que demuestra es la frase de después:
      cada paréntesis se queda en su subespacio porque es cerrado. Sin
      nombrarlo, la cuenta está hecha y la demostración no.
    minimo: true
  - punto: |
      **No pedir de más:** no hace falta que cada elemento se escriba de una
      sola manera como $s+t$.
    porque: |
      En general no se escribe de una sola manera: si $S$ y $T$ comparten
      vectores no nulos, un mismo elemento admite infinitas descomposiciones.
      Esa unicidad es la de la suma directa $S\oplus T$, que ocurre si y solo
      si $S\cap T=\left\{\overline{0}\right\}$, y esta demostración no la usa
      para nada.
