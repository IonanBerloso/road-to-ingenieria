# Rúbrica compartida (fase D0 de la auditoría del 27 de septiembre de 2026).
# Sale de la demostración modelo de `ex2223-3-desigualdad-al-limite`, la que ya
# estaba escrita en su resolución, y la usan los tres ejercicios de examen con
# este mismo enunciado. Los `minimo` son lo que la resolución dice que se
# puntúa o que se pierde: la definición escrita y el máximo de los dos índices.
titulo: Si x_n ≤ y_n para todo n, el límite de x_n no pasa del de y_n
cuando: >-
  Demuestra que si x_n ≤ y_n para todo n, x_n converge a x e y_n a y,
  entonces x ≤ y. Cae como demostración entera una y otra vez: entre las
  convocatorias transcritas, en el primer parcial de 2018-2019 (apartado b),
  en la segunda evaluación de 2019-2020 y en el primer parcial de 2022-2023,
  que la puntúa entera como COMP4. Es el ejercicio 2.5 del boletín del tema 2.
puntos:
  - punto: |
      **La definición de límite, escrita.**
      $\forall\varepsilon>0\;\exists\, m \in \mathbb{N} : n>m \Rightarrow \left|a_n-a\right| < \varepsilon$.
    porque: |
      Forma parte de lo que se puntúa, y se va a usar dos veces, una por cada
      sucesión, cada una con su índice.
    minimo: true
  - punto: |
      **Reducción al absurdo: suponer $x > y$ y tomar
      $\varepsilon = (x - y)/2 > 0$.**
    porque: |
      La negación de $x \le y$ da una diferencia positiva, y su mitad es el
      épsilon que separa los dos límites sin que se toquen.
    minimo: true
  - punto: |
      **Por converger cada una: $x_n > (x + y)/2$ para $n > m_1$ e
      $y_n < (x + y)/2$ para $n > m_2$.**
    porque: |
      De cada definición basta un lado: el de abajo para $x_n$ y el de arriba
      para $y_n$. Los dos se encuentran en el punto medio.
  - punto: |
      **Tomar $n > \max(m_1, m_2)$, para que valgan las dos a la vez.**
    porque: |
      Cada sucesión converge a su ritmo y sus índices no tienen por qué
      coincidir. Sin el máximo no se sabe que las dos desigualdades valen en
      el mismo $n$, y sin eso no se pueden encadenar. Es el punto que más se
      pierde.
    minimo: true
  - punto: |
      **Entonces $y_n < x_n$, contra la hipótesis; luego $x \le y$.**
    porque: |
      Hay que nombrar la hipótesis con la que choca. Y la conclusión es
      $\le$ aunque la hipótesis fuera estricta: con $x_n = 0$ e $y_n = 1/n$,
      $x_n < y_n$ siempre y los dos límites valen 0.
