# Rúbrica compartida (fase D0 de la auditoría del 27 de septiembre de 2026).
# Sale de la resolución modelo de `ex1718-rec-3-dos-sucesiones-a-trozos`, la
# que ya estaba escrita, y la usan los dos ejercicios de examen con estas dos
# mismas sucesiones: ese entero y el apartado a) de
# `ex1617-3ev-5-convergencia-y-la-derivada-de-x`, cuya resolución dice lo
# mismo. Es el ejercicio 2.8 del boletín del tema 2 (`alternante-frente-a-salto`
# en la página del tema). Los `minimo` son lo que el enunciado pide con todas
# las letras —la definición— y los dos argumentos sin los que «de forma
# argumentada» se queda en una afirmación: el teorema de las subsucesiones y la
# cola.
titulo: La convergencia, definida y estudiada en la sucesión alternante y en la del salto
cuando: >-
  Define la convergencia de una sucesión y estudia, de forma argumentada, la
  de dos sucesiones hechas con las mismas dos ramas, 2 + 1/n y −2 − 1/n: una
  las alterna según n sea impar o par, y la otra cambia de rama en n = 50.
  Cae en la tercera evaluación de 2016-2017 y en la cuarta de 2017-2018, con
  COMP4 7 las dos, y es el ejercicio 2.8 del boletín del tema 2.
puntos:
  - punto: |
      **La definición de convergencia, escrita.**
      $\forall\varepsilon>0\;\exists\, m \in \mathbb{N} : n>m \Rightarrow \left|a_n-L\right| < \varepsilon$.
    porque: |
      El enunciado la pide con todas las letras, y es la que decide el
      ejercicio: la condición se exige **a partir de** un $m$, no para todos
      los $n$. Primero el $\varepsilon$ y después el $m$; al revés dice otra
      cosa.
    minimo: true
  - punto: |
      **La alternante, partida en dos subsucesiones:** la de los impares,
      $2+\frac1n \to 2$, y la de los pares, $-2-\frac1n \to -2$.
    porque: |
      Es la forma de negar una convergencia sin ningún épsilon. Calcular los
      primeros términos y ver que saltan no demuestra nada: hay que nombrar las
      dos subsucesiones y sus dos límites.
  - punto: |
      **El teorema que la cierra:** si una sucesión converge a $L$, toda
      subsucesión suya converge a $L$; con dos límites distintos, la alternante
      no converge.
    porque: |
      Sin el teorema, las dos subsucesiones son un dato y no una conclusión. Se
      usa por contrarrecíproco, y hay que decirlo. Vale también con la
      definición: con $\varepsilon = 1$ ningún $L$ está a menos de 1 de $2$ y
      de $-2$ a la vez.
    minimo: true
  - punto: |
      **Está acotada, $|a_n| \le 3$, y aun así no converge: oscila, no diverge
      a infinito.**
    porque: |
      Es el contraejemplo de manual a «acotada implica convergente». Y la
      palabra importa: «no converge» y «tiende a infinito» son cosas distintas,
      y esta sucesión hace lo primero sin hacer lo segundo.
  - punto: |
      **La del salto converge a $-2$:** sus 49 primeros términos son un número
      finito y no intervienen, y desde $n = 50$ vale $-2-\frac1n$.
    porque: |
      La convergencia solo mira la cola. El 2 al que se acercan los primeros
      términos es un episodio finito, y quien contesta 2, o 0 como «la media»,
      está mirando el principio.
    minimo: true
  - punto: |
      **Con la definición:** dado $\varepsilon>0$, tomar
      $m = \max\left(50, \left\lceil \frac{1}{\varepsilon} \right\rceil\right)$;
      para $n>m$ se está en la segunda rama y
      $\left|a_n+2\right| = \frac1n < \varepsilon$.
    porque: |
      El máximo con 50 es lo que hace el trabajo: garantiza que ya se está en
      la segunda rama. Con $\left\lceil \frac{1}{\varepsilon} \right\rceil$ a
      secas, para un $\varepsilon$ grande se estaría todavía en la primera.
