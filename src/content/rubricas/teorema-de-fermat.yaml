# Rúbrica compartida (fase D0 de la auditoría del 27 de septiembre de 2026).
# Sale de la demostración modelo de `ex1920-2ev-3-teorema-de-fermat`, la que
# ya estaba escrita en su resolución y es la del tema 4: el signo fijo del
# numerador, los dos límites laterales y la derivabilidad que los obliga a
# coincidir. El mismo teorema, con otras palabras, cae en la extraordinaria de
# 2016-2017 (`ex1617-ext-3-por-que-la-derivada-se-anula-en-un-maximo`), que
# lleva todavía su rúbrica escrita en el paso, y en el apartado a) de la
# segunda evaluación de 2016-2017. Los `minimo` son los tres pasos sin los que
# la demostración no existe.
titulo: Por qué la derivada se anula en un máximo (teorema de Fermat)
cuando: >-
  Demuestra que si f es derivable en x₀ y tiene ahí un máximo local, entonces
  f'(x₀) = 0. Cae como demostración entera, con COMP4 10 y ni un punto de
  cálculo, en la segunda evaluación de 2019-2020 y en la extraordinaria de
  2016-2017, y como apartado a) en la segunda evaluación de 2016-2017. Con un
  mínimo se invierten los signos y el argumento es el mismo.
puntos:
  - punto: |
      **Que $x_0$ es interior**, dicho de entrada: el enunciado lo da por
      supuesto al decir «derivable en $x_0$».
    porque: |
      Sin dos lados no hay argumento: $f(x) = x$ en $[0,1]$ tiene su máximo
      en 1, es derivable ahí y $f'(1) = 1$. Solo existe el límite por la
      izquierda, y da la mitad de lo que hace falta. Decir la hipótesis que
      el enunciado se calla cuesta una línea.
  - punto: |
      **La hipótesis de máximo, traducida**: existe $\delta > 0$ con
      $f(x_0+h)-f(x_0) \le 0$ para todo $h$ con $\left|h\right| < \delta$.
    porque: |
      Es el motor de la demostración: el numerador del cociente incremental
      tiene signo fijo **por los dos lados**. Quien no escribe la definición
      se queda con «es el más alto» y no tiene nada con lo que operar.
    minimo: true
  - punto: |
      **Los dos límites laterales, con el signo del denominador en cada
      uno**: con $h > 0$ el cociente es $\le 0$, y el límite da
      $f'(x_0) \le 0$; con $h < 0$ el denominador es negativo, el cociente
      es $\ge 0$ y $f'(x_0) \ge 0$.
    porque: |
      Es la demostración entera: el numerador tiene el mismo signo a los dos
      lados y el denominador no. Hacer un solo lado prueba media desigualdad.
      Y al pasar al límite las desigualdades no estrictas se conservan, que es
      lo que deja escribir $\le$ y $\ge$ para la derivada.
    minimo: true
  - punto: |
      **La derivabilidad, usada donde toca**: los dos límites laterales
      existen y son el **mismo número**, $f'(x_0)$.
    porque: |
      Es la bisagra que más se salta. Sin ella habría dos derivadas laterales
      distintas, una $\le 0$ y otra $\ge 0$, sin contradicción ninguna: es lo
      que pasa con $f(x) = -\left|x\right|$ en 0, con laterales $-1$ y $+1$.
    minimo: true
  - punto: |
      **El cierre**: $0 \le f'(x_0) \le 0$, luego $f'(x_0) = 0$.
    porque: |
      El único número que es a la vez $\le 0$ y $\ge 0$ es el cero. Es un
      renglón, y es el que convierte dos desigualdades en la tesis.
