# La rúbrica de las láminas de Expresión Gráfica como datos (auditoría de
# Expresión Gráfica del 8 de octubre de 2026, B8).
#
# Transcrita de la única página del fichero «Rúbrica sobre corrección de
# láminas» que reparte la asignatura: una tabla de ocho filas con dos
# columnas, BIEN y MAL, y una nota al pie. Se leyó con su texto y renderizada,
# y se cotejó línea por línea. La página no lleva fecha ni nombres; se cita
# por el título que imprime arriba, como en el tema 7. Arriba a la derecha
# deja dos huecos para rellenar («Lámina: ……. Fecha de entrega: ……»), que
# no son de la rúbrica y no se copian.
#
# Cómo se lee cada campo:
#   - `texto` es la línea impresa, entera y tal cual: con su «(1)» donde la
#     hoja la pone, y sin el punto final donde la hoja no lo pone («No
#     normalizada o inadecuada»). Los dobles espacios de la hoja («de otro
#     color  o mal», «doblada o  rota», «información  para») son de su
#     maquetación y van con uno solo.
#   - Una línea es lo que la hoja empieza en renglón nuevo. «Rigor en las
#     construcciones geométricas. Marcar ejes y puntos notables.» es una sola,
#     aunque lleve dos frases, igual que su pareja en MAL.
#   - `sub` son los guiones de «Aplicación de normas de representación (1):»
#     y de su pareja en MAL, en su orden.
#   - `donde` es el tema o los temas del sitio que lo explican, como en
#     `criterios/`. Un tema sin hacer sale como «todavía no»: es lo que la
#     rúbrica pide y el sitio aún no enseña (B8). Lo que no es de ningún tema
#     (la entrega en plazo, la actitud en clase) no lleva `donde`.
#   - Solo las líneas de BIEN llevan `donde`: cada una de MAL es el revés de
#     una de BIEN, y el tema que explica una explica la otra.

fuente: «Rúbrica para láminas de Expresión Gráfica» · Expresión Gráfica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). Una página sin fecha ni nombres, transcrita entera.

titulo: RÚBRICA PARA LÁMINAS DE EXPRESIÓN GRÁFICA
columnas:
  bien: BIEN
  mal: MAL
nota:
  marca: '(1)'
  texto: En las láminas de conjuntos y de piezas

filas:
  - id: cajetin-y-textos
    criterio: Cajetín y textos
    bien:
      - texto: Datos completos, rotulado a tinta negra y bien presentado.
        donde: [t07-normalizacion]
      - texto: Escritura normalizada en todo el plano.
        donde: [t07-normalizacion]
      # La cifra de cota «se lee desde abajo o desde la derecha»: lo explica
      # el tema 10, y es donde más se nota el sentido de lectura.
      - texto: El sentido de lectura se respeta.
        donde: [t10-acotacion]
      # Dos cosas: el cajetín ampliado es la lista de piezas, que se ordena
      # en el despiece (tema 13), y el nombre completo de una pieza
      # normalizada es su designación, que da el tema 11.
      - texto: Cajetín ampliado ordenado y con nombres completos de piezas normalizadas (1)
        donde: [t11-sistemas-de-union, t13-conjunto-y-despiece]
    mal:
      - texto: Datos incompletos, ilegibles, a lápiz o tinta de otro color o mal presentado.
      - texto: Escritura de tamaño inferior al normalizado, desalineada o mal orientada.
      - texto: Cajetín ampliado desordenado y con nombres de piezas normalizadas incompletos

  - id: escala
    criterio: Escala
    bien:
      - texto: Normalizada y adecuada al formato.
        donde: [t07-normalizacion]
      - texto: Figuran todas las escalas utilizadas en el cajetín y junto a las vistas.
        donde: [t07-normalizacion]
    mal:
      - texto: No normalizada o inadecuada
      - texto: Mal aplicada.
      - texto: No figura en la lámina.

  - id: solucion-y-proceso
    criterio: Solución y proceso
    bien:
      # Las construcciones con método son las del diédrico, que se hacen en
      # el Taller con la tolerancia de una regla; los ejes, el tema 7.
      - texto: Rigor en las construcciones geométricas. Marcar ejes y puntos notables.
        donde: [t03-metodos-descriptivos, t07-normalizacion]
      - texto: Medidas/proporciones correctas.
        donde: [t08-vistas-y-perspectivas]
      - texto: Desarrollo lógico, claro, ordenado y fácil de seguir.
      - texto: Soluciones claras, definidas y diferenciadas de las construcciones auxiliares y los datos.
      # El tema 7 solo nombra el símbolo del método en el cajetín; dibujar
      # las vistas en el europeo es del tema 8.
      - texto: Utilización del Sistema de Proyecciones Europeo.
        donde: [t08-vistas-y-perspectivas]
      - texto: Destreza en los trazados croquizados.
        donde: [t08-vistas-y-perspectivas]
      - texto: 'Aplicación de normas de representación (1):'
        sub:
          - texto: '- Vistas mínimas y representativas.'
            donde: [t08-vistas-y-perspectivas]
          - texto: '- Cortes adecuados, bien ejecutados, rayado con espaciado uniforme y diferenciado.'
            donde: [t09-cortes-y-secciones]
          - texto: '- Acotación clara, concisa y completa.'
            donde: [t10-acotacion]
          - texto: '- Tolerancias y ajustes correctamente indicados en las cotas funcionales.'
            donde: [t12-acabados-y-tolerancias]
          - texto: '- Acabados superficiales correctamente indicados diferenciando tipos de superficies.'
            donde: [t12-acabados-y-tolerancias]
          # El material de cada pieza se escribe en la lista de piezas del
          # despiece: lo enseñará el tema 13. Hoy no está en ningún tema
          # (auditoría, B8).
          - texto: '- Material correctamente indicado asignándolo por la función de la pieza.'
            donde: [t13-conjunto-y-despiece]
    mal:
      - texto: Construcciones geométricas sin método o imprecisas. Faltan ejes o puntos notables.
      - texto: Medidas incorrectas o desproporcionadas.
      - texto: Desarrollo ilógico, confuso, desordenado o difícil de seguir.
      - texto: Soluciones sin marcar claramente o sin definir todos sus datos.
      - texto: No respetar el Sistema de Proyecciones Europeo.
      - texto: Croquizado indeciso, poco esmerado.
      - texto: 'Incorrecta aplicación de normas de representación:'
        sub:
          - texto: '- Vistas sobrantes o poco representativas.'
          - texto: '- Cortes inadecuados, mal ejecutados, rayado no uniforme o no diferenciado.'
          - texto: '- Acotación dudosa, repetida o incompleta.'
          - texto: '- Tolerancias y ajustes mal indicados o en cotas no funcionales.'
          - texto: '- Acabados superficiales mal indicados o sin diferenciar tipos de superficies'
          - texto: '- Material mal indicado o no apropiado para la función de la pieza.'

  - id: lineas
    criterio: Líneas
    bien:
      - texto: Trazado a lápiz (se pueden utilizar lápices de colores para marcar la solución, salvo (1)).
      - texto: Utilización de dos grosores diferenciados.
        donde: [t07-normalizacion]
      - texto: Utilización adecuada de los grosores y de los diferentes tipos de líneas.
        donde: [t07-normalizacion]
      - texto: Trazados uniformes, conectados los vértices y las tangencias.
    mal:
      - texto: Trazado a tinta.
      - texto: Utilización de un solo grosor o de dos no diferenciables.
      - texto: Utilización incorrecta de los grosores o de los diferentes tipos de líneas.
      - texto: Trazados irregulares, sin conectar los vértices o las tangencias.

  - id: presentacion
    criterio: Presentación
    bien:
      - texto: Trazado limpio, claro y ordenado.
      # Los márgenes y el recuadro de la hoja A3 de la escuela, en el tema 7.
      - texto: Utilización adecuada del espacio de la lámina.
        donde: [t07-normalizacion]
      - texto: Lámina cuidada.
      # El plegado del A3 en paños de 125, 105 y 190, en el tema 7.
      - texto: Entrega desenrollada o doblada según normativa.
        donde: [t07-normalizacion]
      - texto: No hay manchas, ni borrones, ni marcas que demeriten la presentación del mismo.
    mal:
      - texto: Trazado indefinido o desordenado.
      - texto: Trazados superpuestos o fuera de márgenes.
      - texto: Lámina arrugada, marcada, doblada o rota.
      - texto: Entrega enrollada o doblada incorrectamente.
      - texto: Hay manchas o borrones o marcas.

  - id: tiempo
    criterio: Tiempo
    bien:
      - texto: Entrega de láminas en plazo.
      - texto: Acudir con las láminas a clase para las actividades previstas (corrección, trabajo en equipo o individual…).
    mal:
      - texto: Entrega de láminas fuera de plazo.
      - texto: No acudir con las láminas a clase para las actividades previstas

  - id: actitud
    criterio: Actitud
    bien:
      - texto: Saber contestar a preguntas sobre la lámina, utilizando un lenguaje técnico.
      - texto: Mostrar interés por buscar información para resolver las láminas.
      - texto: Poner empeño en resolverlas.
      - texto: Utilizarlas como método de aprendizaje.
      - texto: Actitud colaborativa.
    mal:
      - texto: No contestar a preguntas sobre la lámina, o no utilizar un lenguaje técnico.
      - texto: No buscar información para resolver las láminas.
      - texto: No poner empeño en resolverlas.
      - texto: Utilizarlas como mero trámite.
      - texto: Actitud no colaborativa.

  - id: general
    criterio: General
    bien:
      - texto: En general, la calidad del dibujo es excelente.
    mal:
      - texto: En general, la calidad del dibujo es pobre.
