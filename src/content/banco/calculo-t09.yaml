    opciones:
      - texto: '$W=0$'
        porque: |-
          Valdría cero si $P$ y $Q$ estuvieran en la misma solución, o si el
          camino fuera cerrado. Aquí $Q$ está en la curva de $C=5$ y $P$ en la
          de $C=17$.
      - texto: '$W=12$'
        correcta: true
        porque: |-
          Por ser exacta, $V=\nabla U$ es conservativo: el trabajo no depende
          del camino, solo de los extremos. $W=U(P)-U(Q)=17-5=12$, por muchas
          vueltas que dé $L$.
      - texto: '$W=19$'
        porque: |-
          Es una suma de niveles ($17+2$, o $14+5$), y el trabajo es una
          diferencia: $U(P)-U(Q)=17-5=12$.
      - texto: '$W<0$'
        porque: |-
          El trabajo es el potencial del final menos el del principio, y se va
          de $Q$ a $P$: $U(P)-U(Q)=17-5>0$. Sería negativo yendo de $P$ a $Q$.

  - id: almacen-de-libros
    bloque: '9.3.5'
    diapositiva: 10
    pregunta: |
      Un almacén de libros retira constantemente un 2% de los libros
      almacenados, pero también recibe continuamente 400 nuevos libros. Según
      este modelo, ¿Qué ocurrirá con el número de libros en stock después de
      un largo período de tiempo?
    opciones:
      - texto: Tenderá hacia 0
        porque: |-
          Se vaciaría si solo se retiraran libros, $N'=-0{,}02N$. Los 400 que
          entran lo impiden: con pocos libros salen muy pocos y siguen entrando
          400.
      - texto: Tenderá hacia cierto valor constante
        correcta: true
        porque: |-
          El modelo es la EDO lineal $N'=400-0{,}02N$, con solución
          $N=20\,000+(N_0-20\,000)e^{-0{,}02t}$, que tiende a $20\,000$. Es el
          nivel en el que lo que sale, $0{,}02\cdot20\,000=400$, iguala a lo
          que entra.
      - texto: Tenderá hacia infinito
        porque: |-
          Crecería sin fin si entrara siempre más de lo que sale, pero lo que
          sale crece con $N$: por encima de $20\,000$ libros salen más de 400
          y $N'<0$.
      - texto: No hay datos para conocerlo
        porque: |-
          Falta saber cuántos libros hay al principio, $N_0$, pero el límite no
          depende de eso: $e^{-0{,}02t}\to0$ para cualquier $N_0$, y todas las
          soluciones van a $20\,000$.

  - id: dos-soluciones-por-el-origen
    bloque: '9.4'
    diapositiva: 11
    pregunta: |
      El mapa de pendientes de la figura corresponde a la EDO

      $$
      \frac{dy}{dx}=3y^{2/3}
      $$

      Las funciones $y=0$ e $y=x^3$ cuyas gráficas se muestran son ambas
      soluciones que pasan por el mismo punto $(0,0)$. ¿Contradice esto el
      teorema de existencia y unicidad de soluciones?
    figura: |
      <svg viewBox="0 0 340 290" role="img" width="340" height="290"
           aria-labelledby="cq9-pendientes-t cq9-pendientes-d">
        <title id="cq9-pendientes-t">El mapa de pendientes de y′ = 3 y elevado a dos tercios</title>
        <desc id="cq9-pendientes-d">Una retícula de trocitos que marcan la pendiente en cada punto del primer cuadrante: casi planos cerca del eje x y cada vez más empinados al subir. Resaltadas, dos soluciones que salen del origen: la recta y igual a cero, sobre el eje x, y la curva y igual a x al cubo, que sube desde el origen y se hace casi vertical hacia x igual a uno coma siete.</desc>
