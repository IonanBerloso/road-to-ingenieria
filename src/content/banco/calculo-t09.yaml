    opciones:
      - texto: Este ejemplo contradice el teorema.
        porque: |-
          Un ejemplo no puede contradecir un teorema: si hay dos soluciones por
          el mismo punto, es que falla alguna hipótesis. El teorema solo
          garantiza la unicidad si $F$ y $F_y$ son continuas cerca del punto.
      - texto: 'En este ejemplo no se verifica la hipótesis de continuidad de $F(x,y)$ en un entorno de $(0,0)$.'
        porque: |-
          $F(x,y)=3y^{2/3}=3\sqrt[3]{y^2}$ es continua en todo el plano,
          también en $(0,0)$, y por eso hay solución. Esa hipótesis, la de la
          existencia, sí se cumple.
      - texto: 'En este ejemplo no se verifica la hipótesis de continuidad de $F_y(x,y)$ en un entorno de $(0,0)$.'
        correcta: true
        porque: |-
          $F_y=2y^{-1/3}=\frac{2}{\sqrt[3]{y}}$ no existe en $y=0$ y se dispara
          cerca: no es continua en ningún entorno de $(0,0)$. Sin esa
          hipótesis el teorema no promete una sola solución, y de hecho hay
          dos, $y=0$ e $y=x^3$.

  # La diapositiva no da la temperatura del cuerpo al morir. Con la normal,
  # 37 °C, la ley de Newton da las 9:26, y la opción más cercana es la A,
  # 9:24, que sale exacta redondeando k a 0,4. Con 36,5 °C saldrían las
  # 9:30, a medio camino entre A y B.
  - id: hora-de-la-muerte
    bloque: '9.4'
    diapositiva: 12
    pregunta: |
      La policía ha encontrado el cadáver de una persona, dentro de una
      habitación. Un modo de determinar aproximadamente la hora de la muerte,
      cuando ha ocurrido pocas horas antes, es estudiar el proceso de
      enfriamiento del cadáver. Se ha tomado la temperatura al cadáver a las
      12:00 y a las 13:00 horas, siendo estos valores 26ºC y 24ºC
      respectivamente. La habitación se encuentra a 20ºC.

      ¿A qué hora falleció la persona?
    opciones:
      - texto: A las 9:24
        correcta: true
        porque: |-
          Por la ley de Newton, la diferencia con la habitación decae como
          $Ce^{-kt}$: de las 12:00 a las 13:00 pasa de 6 a 4 °C, así que
          $e^{-k}=\frac23$. Si al morir estaba a 37 °C, la diferencia era 17,
          y bajar de 17 a 6 lleva $\frac{\ln(17/6)}{\ln(3/2)}\approx2{,}57$
          horas: murió hacia las 9:26, y la opción más cercana es esta.
      - texto: A las 9:36
        porque: |-
          Son 2 h 24 min antes de las 12:00, y con $e^{-k}=\frac23$ eso pide que
          el cuerpo estuviera a unos 35,9 °C al morir, por debajo de los 37 °C
          normales.
      - texto: A las 6:30
        porque: |-
          Es lo que sale si el cadáver se enfriara siempre 2 °C por hora, como
          entre las 12:00 y las 13:00: de 37 a 26 °C son 11 °C, cinco horas y
          media. Pero se enfría más deprisa cuanto más caliente está, así que
          tardó bastante menos.
      - texto: A las 6:40
        porque: |-
          Supone aún más tiempo que el enfriamiento a ritmo constante de la C.
          Con la ley de Newton, en las 5 h 20 min que van de las 6:40 a las
          12:00 la diferencia con la habitación habría bajado de 17 a unos
          2 °C, y a las 12:00 el cadáver estaría a unos 22 °C, no a 26.

  - id: frecuencia-de-un-muelle
    bloque: '9.5.4'
    diapositiva: 13
    pregunta: |
      Si despreciamos la amortiguación del medio, la oscilación de una masa
      $m$ que cuelga de un muelle puede modelizarse mediante la EDO

      $$
      my''(t)+ky(t)=0.
      $$

      ¿Cuál de las siguientes situaciones da lugar a un movimiento con mayor
      frecuencia de oscilación?
    opciones:
      - texto: '$k=6,\ m=2$'
        correcta: true
        porque: |-
          Las soluciones son $C_1\cos(\omega t)+C_2\operatorname{sen}(\omega t)$
          con $\omega=\sqrt{k/m}$: manda el cociente $k/m$, no $k$ ni $m$ por
          separado. Aquí $k/m=3$, el mayor de los cuatro; los otros dan 1,
          $\frac13$ y $\frac43$.
      - texto: '$k=4,\ m=4$'
        porque: |-
          $k/m=1$, así que $\omega=1$. Que $k$ y $m$ sean iguales no tiene nada
          de especial: con $k=6$ y $m=2$ el cociente es 3.
      - texto: '$k=2,\ m=6$'
        porque: |-
          Es la más lenta, con $k/m=\frac13$. Sale al invertir el cociente,
          porque $m/k=3$ es aquí el mayor; pero con más masa se oscila más
          despacio, no más deprisa.
      - texto: '$k=8,\ m=6$'
        porque: |-
          Tiene el muelle más duro, $k=8$, pero también la masa mayor:
          $k/m=\frac43$, menos que el 3 de la A. Mirar solo $k$ engaña.
      - texto: En todos los casos la frecuencia es la misma
        porque: |-
          La frecuencia depende de $k/m$, que cambia de un caso a otro: 3, 1,
          $\frac13$ y $\frac43$.

  - id: amplitud-de-una-oscilacion-forzada
    bloque: '9.5.4'
    diapositiva: 14
    pregunta: |
      Considerar el siguiente modelo de oscilación de una masa:

      $$
      3y''(t)+y'(t)+2y(t)=10\operatorname{sen}(2t)
      $$

      Supongamos que deseamos disminuir lo más posible el valor $M$ de la
      amplitud de la oscilación resultante, y que para ello se nos permite
      cambiar ligeramente el valor de uno de los parámetros $m$, $\beta$, $k$
      ò $w$. ¿Cuál de las siguientes posibilidades seguiremos?
    opciones:
      - texto: 'Aumentar $\beta$'
        porque: |-
          También baja la amplitud, pero muy poco: en
          $M=\frac{10}{\sqrt{(k-mw^2)^2+(\beta w)^2}}$ el amortiguamiento
          aporta $(\beta w)^2=4$, frente a $(k-mw^2)^2=100$. Subir $\beta$ un
          10 % baja $M$ menos de un 0,5 %.
      - texto: 'Disminuir $\beta$'
        porque: |-
          Con menos amortiguamiento el denominador de $M$ baja y la amplitud
          sube, aunque poco: es lo contrario de lo que se busca.
      - texto: 'Aumentar $w$'
        correcta: true
        porque: |-
          El modelo es $my''+\beta y'+ky=10\operatorname{sen}(wt)$ con $m=3$,
          $\beta=1$, $k=2$ y $w=2$, y su amplitud es
          $M=\frac{10}{\sqrt{(k-mw^2)^2+(\beta w)^2}}=\frac{10}{\sqrt{104}}\approx0{,}98$.
          La frecuencia natural es $\sqrt{2/3}\approx0{,}82$ y la de la fuerza
          ya está por encima: subir $w$ aleja de la resonancia, y como $mw^2$
          crece con el cuadrado, un 10 % más de $w$ baja $M$ un 20 %.
      - texto: 'Disminuir $w$'
        porque: |-
          Acerca la frecuencia de la fuerza a la natural del sistema,
          $\sqrt{k/m}=\sqrt{2/3}\approx0{,}82$: es ir hacia la resonancia, y la
          amplitud crece.
      - texto: 'Aumentar $k$'
        porque: |-
          Como $k-mw^2=2-12<0$, subir $k$ acerca ese término a cero: la
          frecuencia natural sube hacia $w=2$ y la amplitud crece.
      - texto: 'Disminuir $m$'
        porque: |-
          Hace lo mismo que subir $k$: $mw^2$ baja hacia $k$, la frecuencia
          natural $\sqrt{k/m}$ sube hacia $w$ y la amplitud crece.
