    opciones:
      - texto: La curva A
        porque: |-
          Es una parábola hacia abajo, y los puntos de inflexión están en una
          hacia arriba. En su vértice, $(1;\ 4{,}5)$,
          $y''=2x-x^2+y=2-1+4{,}5=5{,}5$, que no es cero.
      - texto: La curva B
        correcta: true
        porque: |-
          Derivando la EDO, $y''=2x-y'=2x-x^2+y$, que se anula justo cuando
          $y=x^2-2x$: la parábola de vértice $(1,-1)$ que pasa por $(0,0)$ y
          por $(2,0)$. Las soluciones la cruzan, y al cruzarla $y''$ cambia de
          signo: son inflexiones de verdad.
      - texto: La curva C
        porque: |-
          Tiene la forma de la buena, $x^2-2x$, pero bajada tres unidades: en
          su vértice, $(1,-4)$, $y''=2x-x^2+y=2-1-4=-3$, que no es cero.

  - id: brillo-de-una-estrella
    bloque: '9.3.1'
    diapositiva: 6
    pregunta: |
      El brillo de una estrella decrece a una tasa del 10% de su brillo actual
      cada millón de años. Sea $B_0$ una constante que se expresa en las
      unidades en que se mide el brillo de la estrella y $t$ el tiempo en
      millones de años. ¿Cuál de las siguientes funciones puede expresar el
      brillo de la estrella?
    opciones:
      - texto: '$B(t)=B_0e^t$'
        porque: |-
          Crece, y además al 100 % por millón de años: es la solución de
          $B'=B$. El brillo decrece, y un 10 %.
      - texto: '$B(t)=B_0e^{-0{,}1t}$'
        correcta: true
        porque: |-
          Decrecer un 10 % del brillo actual es $B'=-0{,}1B$, de variables
          separables: $\frac{dB}{B}=-0{,}1\,dt$, y sale $B=B_0e^{-0{,}1t}$,
          con $B_0$ el brillo en $t=0$.
      - texto: '$B(t)=B_0e^{0{,}1t}$'
        porque: |-
          La tasa es la buena, pero con el signo cambiado: es la solución de
          $B'=0{,}1B$, un brillo que crece un 10 % por millón de años.
      - texto: '$B(t)=-0{,}1tB_0$'
        porque: |-
          Su derivada es constante, $-0{,}1B_0$: pierde siempre lo mismo, no un
          10 % de lo que hay. Además vale cero en $t=0$ y es negativa después,
          y un brillo no es negativo.

  - id: maduracion-de-los-platanos
    bloque: '9.3.1'
    diapositiva: 7
    pregunta: |
      El estado de maduración de los plátanos en modernas cámaras de
      maduración se describe aproximadamente mediante la EDO
      $R'(t)=0{,}5(2-R)$, donde $t$ se expresa en semanas. El valor $R=0$
      corresponde a un plátano completamente verde, mientras que $R=1{,}5$
      corresponde a uno listo para consumir. Supongamos que los plátanos se
      introducen en la cámara con un estado de maduración $R=0{,}5$. ¿Cuánto
      tiempo deberán dejarse dentro de la cámara?
    opciones:
      - texto: 1,3 semanas
        porque: |-
          Es lo que sale si madura siempre al ritmo del principio,
          $R'(0)=0{,}5\cdot1{,}5=0{,}75$ por semana: $1/0{,}75\approx1{,}3$.
          Pero $R'$ baja a medida que $R$ se acerca a 2, y a las 1,3 semanas
          $R\approx1{,}22$: todavía no está listo.
      - texto: 2,9 semanas
        porque: |-
          Se pasa: a las 2,9 semanas $R=2-1{,}5e^{-1{,}45}\approx1{,}65$. Tanto
          no lo necesita ni un plátano completamente verde: de $R=0$ a
          $R=1{,}5$ se tarda $2\ln4\approx2{,}8$ semanas.
      - texto: 4,3 semanas
        porque: |-
          Es casi el doble de lo necesario: a las 4,3 semanas $R\approx1{,}83$,
          ya muy cerca del tope, 2. Ni desde completamente verde se tarda
          tanto: $2\ln4\approx2{,}8$ semanas.
      - texto: 2,2 semanas
        correcta: true
        porque: |-
          Separando variables, $\frac{dR}{2-R}=0{,}5\,dt$, y con $R(0)=0{,}5$
          queda $2-R=1{,}5e^{-0{,}5t}$. El plátano está listo cuando $R=1{,}5$:
          $1{,}5e^{-0{,}5t}=0{,}5$, $e^{-0{,}5t}=\frac13$ y
          $t=2\ln3\approx2{,}2$ semanas.

  - id: trabajo-a-lo-largo-de-una-solucion
    bloque: '9.3.3'
    diapositiva: 8
    pregunta: |
      Considerar la EDO exacta $M(x,y)dx+N(x,y)dy=0$. Considerar la gráfica de
      una solución $y(x)$ de la EDO y dos puntos $P$ y $Q$ sobre la misma.
      ¿Qué puede decirse del trabajo $W$ que efectúa el campo vectorial
      $V=(M(x,y),N(x,y))$ cuando una partícula se traslada desde $P$ hasta $Q$
      siguiendo esa trayectoria?
    opciones:
      - texto: '$W>0$'
        porque: |-
          Para que el campo hiciera un trabajo positivo, la partícula tendría
          que subir de nivel de $U$, el potencial de $V$. Pero $P$ y $Q$ están
          en la misma solución, y una solución es una curva de nivel,
          $U(x,y)=C$.
      - texto: '$W<0$'
        porque: |-
          Un trabajo negativo pediría bajar de nivel de $U$, y sobre una misma
          solución $U$ vale lo mismo en $P$ que en $Q$.
      - texto: '$W=0$'
        correcta: true
        porque: |-
          A lo largo de una solución, $M\,dx+N\,dy=0$ en cada punto: es lo que
          dice la EDO. Así que el integrando del trabajo es cero en todo el
          camino. Por ser exacta se ve también de otra forma: $V=\nabla U$ y
          $W=U(Q)-U(P)=C-C=0$.
      - texto: 'No puede asegurarse nada acerca de $W$'
        porque: |-
          Se sabe sin conocer $M$, $N$, $P$ ni $Q$: el camino es una solución,
          y sobre ella $M\,dx+N\,dy$ se anula punto a punto.

  # En el original, P está en la curva de 17 y Q en la de 5 (mirado a
  # 600 ppp), con las de 14 y 2 muy cerca; con esas dos la diferencia
  # también sería 12, así que la respuesta no depende de cómo se lea. Se
  # redibuja con P y Q claramente sobre 17 y 5.
  - id: trabajo-entre-dos-niveles
    bloque: '9.3.3'
    diapositiva: 9
    pregunta: |
      Considerar la EDO exacta $M(x,y)dx+N(x,y)dy=0$. Supongamos que
      $U(x,y)=C$ es su solución general. La figura muestra algunas soluciones
      particulares, y se indica el valor de $C$ de cada una. ¿Qué puede
      decirse del trabajo $W$ que efectúa el campo vectorial
      $V=(M(x,y),N(x,y))$ cuando una partícula se traslada desde $Q$ hasta $P$
      siguiendo la trayectoria $L$?
    figura: |
      <svg viewBox="0 0 340 300" role="img" width="340" height="300"
           aria-labelledby="cq9-niveles-t cq9-niveles-d">
        <title id="cq9-niveles-t">Seis curvas de nivel y un camino de Q a P</title>
        <desc id="cq9-niveles-d">Seis curvas cerradas, unas dentro de otras, con su valor de C escrito encima: 2 la más pequeña, en el centro, y luego 5, 8, 11, 14 y 17 hacia fuera. Las de dentro están abolladas por arriba, como un riñón. Q está abajo a la derecha, sobre la curva de 5, y P arriba, sobre la de 17. Un camino L con revueltas sale de Q, cruza la de 8, cruza tres veces la de 11 —sale, vuelve a entrar y sale otra vez—, cruza la de 14, se asoma por fuera de la de 17 y vuelve a ella en P; una flecha marca que va de Q a P.</desc>
