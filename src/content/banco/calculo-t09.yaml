    opciones:
      - texto: Sí
        porque: |-
          Tiene forma de exponencial, como tantas soluciones, pero los signos
          no cuadran: sube, $y'>0$, y se curva hacia arriba, $y''>0$, así que
          $y''+y'>0$ en todo punto, y la EDO pide $y''+y'=-3$.
      - texto: 'No'
        correcta: true
        porque: |-
          La EDO dice que $y''+y'=-3<0$ en todo punto: $y'$ e $y''$ no pueden
          ser positivas a la vez, y en la gráfica lo son en todas partes. De
          hecho, las soluciones son $y=C_1+C_2e^{-x}-3x$, y las que se curvan
          hacia arriba, con $C_2>0$, son todas decrecientes.
      - texto: No puede saberse, falta información
        porque: |-
          La fórmula de $y(x)$ no hace falta: los signos de $y'$ y de $y''$ se
          leen en la gráfica. Crece y se curva hacia arriba, y con esos signos
          $y''+y'$ no puede valer $-3$.

