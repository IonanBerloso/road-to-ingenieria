      - texto: La gráfica A
        porque: |-
          Su punto más bajo, hacia $(-1{,}8;\ 1{,}8)$, cumple $x+y=0$, que es
          lo que exige la EDO donde la tangente es horizontal. Tiene la forma
          de las soluciones, $y=Ce^x-x-1$: es la de $C=e^{1{,}8}\approx6$.
      - texto: La gráfica B
        porque: |-
          El mínimo está hacia $(-0{,}95;\ 0{,}95)$, sobre la recta $y=-x$, como
          pide la EDO donde $y'=0$. Es la solución $y=Ce^x-x-1$ con
          $C=e^{0{,}95}\approx2{,}6$.
      - texto: La gráfica C
        porque: |-
          Baja hasta cerca de $(0{,}45;\ -0{,}45)$ y vuelve a subir: el mínimo
          está sobre $y=-x$, donde tiene que estar. Es la solución
          $y=Ce^x-x-1$ con $C=e^{-0{,}45}\approx0{,}64$.
      - texto: La gráfica D
        correcta: true
        porque: |-
          En su punto más bajo, $(1;\ -2)$, la tangente es horizontal, pero la
          EDO pide ahí $y'=x+y=1-2=-1$. Todas las soluciones que tienen un
          mínimo lo tienen sobre la recta $y=-x$, y $(1;\ -2)$ no está en ella.

