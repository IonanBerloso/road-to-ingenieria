asignatura: calculo
tema: t09-ecuaciones-diferenciales
titulo: Las cuestiones de las diapositivas del tema 9
fuente: >-
  Las diapositivas de clase del tema 9 de Cálculo, «Ecuaciones diferenciales»
  (UPV/EHU): catorce preguntas tipo test para las cuestiones en grupo y para
  el oral de la final y de la extraordinaria. Las diapositivas no traen la
  solución: la respuesta y el porqué de cada opción son de este sitio, y las
  figuras están redibujadas.
diapositivas: 14
bloques:
  - { id: '9.1', titulo: Planteamiento del problema }
  - { id: '9.2.1', titulo: Derivadas sucesivas de y(x) }
  - { id: '9.3.1', titulo: EDO de variables separables }
  - { id: '9.3.3', titulo: EDO exactas }
  - { id: '9.3.5', titulo: EDO lineales }
  - { id: '9.4', titulo: Existencia y unicidad para EDO de orden 1 }
  - { id: '9.5.4', titulo: Movimiento armónico }
preguntas:
  - id: que-no-puede-ser-solucion
    bloque: '9.1'
    diapositiva: 1
    pregunta: |
      ¿Cuál de las siguientes NO puede ser una solución de una ecuación
      diferencial?
    opciones:
      - texto: '$f=2y+7$'
        porque: |-
          Las letras no importan: es una función $f$ de la variable $y$, y
          cumple la EDO $\frac{df}{dy}=2$.
      - texto: '$q(d)=2d^2-6e^d$'
        porque: |-
          Es una función derivable de $d$, así que cumple, por ejemplo,
          $q'(d)=4d-6e^d$. Que la variable se llame $d$ no cambia nada.
      - texto: '$6y^2+2xy=\sqrt{x}$'
        porque: |-
          Define $y(x)$ de forma implícita, y derivando la igualdad sale una
          EDO que esa función cumple: $12yy'+2y+2xy'=\frac{1}{2\sqrt{x}}$. Una
          solución no tiene por qué venir despejada: las de las EDO exactas,
          $U(x,y)=C$, tampoco lo están.
      - texto: '$y=4\operatorname{sen}(8\pi z)$'
        porque: |-
          Es una función de $z$, y derivándola dos veces,
          $y''=-256\pi^2\operatorname{sen}(8\pi z)=-64\pi^2y$: es la EDO de un
          oscilador.
      - texto: '$y=4\operatorname{sen}(8\pi)$'
        porque: |-
          Aunque no lleve variable, es una función: la constante
          $4\operatorname{sen}(8\pi)=0$. Y $y=0$ es solución de $y'=0$, y de
          cualquier EDO lineal homogénea.
      - texto: Todas las anteriores pueden ser solución de una ecuación diferencial
        correcta: true
        porque: |-
          Cualquier función derivable cumple al menos una EDO: la que dice
          cuánto vale su derivada. Las cinco de arriba son funciones —de $y$,
          de $d$, de $x$ en forma implícita, de $z$, y una constante—, así que
          ninguna queda fuera.

  - id: contaminante-del-lago
    bloque: '9.1'
    diapositiva: 2
    pregunta: |
      La cantidad de cierto contaminante en un lago está descendiendo con una
      tasa del 30% por año. Si $p(t)$ es la cantidad total de contaminante
      como función del tiempo $t$ (en años), ¿cuál de las siguientes EDO
      modeliza esta situación?
    opciones:
      - texto: |-
          $p'(t)=-30$
        porque: |-
          Quita 30 unidades al año, haya las que haya. Confunde el porcentaje
          con una cantidad fija: el 30 % de $p$ es $0{,}3p$, y depende de $p$.
      - texto: |-
          $p'(t)=-0{,}3$
        porque: |-
          Tiene el 0,3, pero le falta la $p$: es un descenso fijo de 0,3
          unidades al año. La tasa es un 30 % de lo que hay en cada momento,
          así que la derivada tiene que ser proporcional a $p$.
      - texto: |-
          $p'(t)=p-30$
        porque: |-
          Con más de 30 unidades en el lago daría $p'>0$: el contaminante
          aumentaría. Y un 30 % no es restar 30.
      - texto: |-
          $p'(t)=-0{,}3p$
        correcta: true
        porque: |-
          Una tasa del 30 % por año quiere decir que la cantidad cambia a razón
          del 30 % de lo que hay, $0{,}3p$, con signo menos porque desciende. La
          solución, $p=p_0e^{-0{,}3t}$, baja cada vez más despacio, a medida
          que queda menos.
      - texto: |-
          $p'(t)=0{,}7p$
        porque: |-
          El 0,7 es lo que queda, el 100 % menos el 30 %, pero como tasa de
          cambio dice que $p$ crece un 70 % al año: $p=p_0e^{0{,}7t}$. Confunde
          lo que queda con lo que cambia.

