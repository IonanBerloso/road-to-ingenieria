# Banco de práctica para el test de los temas 7 a 10 (17 de diciembre).
#
# Lo que conviene saber antes de tocarlo:
#
# · `propio`. Las preguntas son nuestras y cubren cuatro temas. El banco
#   vive en la página del 7, el primero —/ciencia-materiales/
#   t07-aleaciones-metalicas/cuestiones/—, y con `propio` la página se titula
#   con el banco, dice que las preguntas son nuestras y enlaza los cuatro
#   temas, y cada uno de los cuatro enlaza el banco (content.config.ts).
# · Sin `puntuacion`. Ni la presentación (diapositivas 8, 9, 14 y 20) ni la
#   guía (págs. 8 a 11) dicen cuántas preguntas tiene el test, cuánto dura ni
#   si penaliza. No se inventa: el +0,40/−0,15 es del test de mínimos del
#   tema 1, no de este.
# · Sin `opciones: 4`. El esquema lo reserva para cuando el original fija el
#   número de opciones, y del formato de este test no consta nada. Todas
#   traen cuatro igualmente, con una sola buena.
# · Bloques. Uno por cada tema de la diapositiva 8, con su número y su título
#   tal cual. La página de cuestiones enseña el número porque el id empieza
#   por cifra.
# · La buena no va siempre en la misma letra: la página de cuestiones no
#   baraja las opciones (el simulacro sí).
# · Encima de cada pregunta, `# de:` dice qué apartado del sitio la contesta.
#   «(nuevo)» es una sección que entró en el tema junto con este banco, el 29
#   de septiembre de 2026.
# · Revisado el 29 de septiembre de 2026, con una revisión independiente: 46
#   preguntas reescritas por id. La buena era la opción más larga en 47 de 65
#   y ahora lo es en 13 (18 con empates), y ninguna es 1,5 veces la siguiente;
#   car-pentagonos marcaba como buena una frase falsa, y fib-cuadro-de-carbono
#   decía que un compuesto se clasifica «por tener dos fases».
asignatura: ciencia-materiales
tema: t07-aleaciones-metalicas
titulo: Preguntas para el test de los temas 7 a 10
propio:
  temas:
    - t07-aleaciones-metalicas
    - t08-materiales-ceramicos
    - t09-materiales-polimericos
    - t10-materiales-compuestos
  orden: ordenadas por los doce temas de las presentaciones de la asignatura
fuente: >-
  Preguntas propias · Road to Ingeniería, escritas sobre la teoría de los
  temas 7 a 10 del sitio y ordenadas por los doce temas de las presentaciones
  de la asignatura (Ciencia de Materiales, UPV/EHU, curso 2025-2026,
  presentación de la asignatura, diapositiva 8). NO son las del test del 17 de
  diciembre, que no tenemos, ni salen de las presentaciones de los alumnos ni
  de las preguntas guía de la profesora. Del formato del test no consta nada
  en el material: aquí van con cuatro opciones y una válida, como el test de
  mínimos, y sin simulacro porque no se sabe cómo puntúa.
bloques:
  - { id: '1', titulo: Aceros }
  - { id: '2', titulo: Fundiciones }
  - { id: '3', titulo: Aleaciones de Cu y Aleaciones de Ti }
  - { id: '4', titulo: Aleaciones de Al y Aleaciones de Mg }
  - { id: '5', titulo: Cerámicos Abrasivos. Carburos y Nitruros }
  - { id: '6', titulo: Cerámicos Refractarios. Sílices y Aluminosilicatos }
  - { id: '7', titulo: El Carbono y sus Alótropos }
  - { id: '8', titulo: Termoplásticos y Termoestables. Estructura }
  - { id: '9', titulo: Termoplásticos y Termoestables. Procesado }
  - { id: '10', titulo: Homopolímeros y Copolímeros }
  - { id: '11', titulo: Materiales Compuestos o Composites. Partículas }
  - { id: '12', titulo: Materiales Compuestos o Composites. Fibras }

preguntas:
  # ── 1 · ACEROS ─────────────────────────────────────────────────────
  # de: t07 «Los aceros al carbono», «### El código de cuatro cifras» y su ErrorTipico
  - id: ace-cifras-aisi
    bloque: '1'
    pregunta: En un acero AISI 4340, ¿qué dicen las dos últimas cifras?
    opciones:
      - texto: La familia de aleación
        porque: La familia la dicen las dos primeras, el 43, que lleva níquel, cromo y molibdeno.
      - texto: El carbono, en centésimas de punto, un 0,40 %
        correcta: true
        porque: Por eso el 4340, el 5140 y el 8640 tienen el mismo carbono y se distinguen solo por los aleantes.
      - texto: Un 40 % de elementos de aleación
        porque: En el 4340 ni el 43 ni el 40 son un porcentaje de aleación, y un acero es casi todo hierro.
      - texto: La dureza que alcanza templado
        porque: El código habla de composición, no de propiedades; la dureza depende además del tratamiento.

  # de: t07 «Los aceros inoxidables» y su ErrorTipico
  - id: ace-inoxidable-cromo
    bloque: '1'
    pregunta: ¿Qué hace inoxidable a un acero?
    opciones:
      - texto: Que no se oxida nunca, porque el hierro queda protegido por el níquel
        porque: Se oxida, y enseguida. Lo que lo protege es el óxido de cromo; el níquel está para estabilizar la austenita.
      - texto: Mucho carbono, que forma carburos duros en la superficie
        porque: Los carburos dan dureza, no protección; los inoxidables martensíticos llevan más carbono por la dureza, no por la corrosión.
      - texto: Alrededor de un 11 % de cromo, cuyo óxido impermeable se rehace solo
        correcta: true
        porque: 'Es la idea del tema: el óxido de cromo se queda pegado y no deja pasar el oxígeno, y si se raya se vuelve a formar.'
      - texto: Un recubrimiento de cinc aplicado después de laminarlo
        porque: Eso es el galvanizado, que protege a un acero corriente desde fuera. El inoxidable se protege con su propio cromo.

  # de: t07 «Los aceros inoxidables»
  - id: ace-austenitico
    bloque: '1'
    pregunta: Un inoxidable con níquel, no magnético, muy dúctil, el que mejor resiste la corrosión y el más común en fregaderos y cubiertos, es…
    opciones:
      - texto: Ferrítico
        porque: Los ferríticos son BCC, magnéticos y baratos, y no llevan el níquel que estabiliza la austenita.
      - texto: Martensítico
        porque: Los martensíticos llevan más carbono y se templan; son los de cuchillería e instrumental.
      - texto: De herramientas
        porque: Los aceros de herramientas se definen por su dureza y sus carburos, no por resistir la corrosión.
      - texto: Austenítico
        correcta: true
        porque: El níquel deja la austenita FCC estable a temperatura ambiente, y de ahí salen la ductilidad y que no sea magnético.

  # de: t07 «Los aceros de baja aleación»
  - id: ace-baja-aleacion
    bloque: '1'
    pregunta: ¿Qué se gana, sobre todo, añadiendo a un acero pequeñas cantidades de cromo, níquel, molibdeno o manganeso?
    opciones:
      - texto: 'Templabilidad: retrasan la transformación de la austenita'
        correcta: true
        porque: 'Las narices del diagrama se van a la derecha y la velocidad crítica baja: una pieza gruesa, o templada en aceite, llega entera a martensita.'
      - texto: Que se vuelve inoxidable, porque el cromo forma su capa de óxido
        porque: Para eso hace falta alrededor de un 11 % de cromo, no unas pequeñas cantidades.
      - texto: Que funde a menos temperatura y se puede colar como una fundición
        porque: Lo que hace fundir bajo a una fundición es su carbono, cerca del eutéctico, no los aleantes.
      - texto: Que pesa bastante menos, y compite con el aluminio
        porque: Unos pocos por ciento de aleantes no cambian el problema del peso; para eso se sale del hierro.

  # de: t07 «Los aceros de herramientas» (nuevo)
  - id: ace-rapidos
    bloque: '1'
    pregunta: ¿Por qué los aceros rápidos se llaman así?
    opciones:
      - texto: Porque se templan mucho más deprisa que los demás aceros de herramientas
        porque: El nombre no viene del temple sino del corte.
      - texto: Porque llevan poco carbono y se mecanizan deprisa
        porque: Es al revés. Son aceros de herramientas, con mucho carbono, y lo que hacen es mecanizar a otros.
      - texto: Porque conservan la dureza en caliente y cortan más deprisa
        correcta: true
        porque: Un acero templado corriente se reviene con el calor del filo y se ablanda; los rápidos, con mucho wolframio o molibdeno, no.
      - texto: Porque sus carburos se disuelven rápido al calentarlos
        porque: Justo lo contrario. Sus carburos son los que aguantan el desgaste, y sirven porque no se deshacen.

  # ── 2 · FUNDICIONES ────────────────────────────────────────────────
  # de: t07 «Las fundiciones»; t04 «El diagrama hierro-carburo de hierro»
  - id: fun-acero-o-fundicion
    bloque: '2'
    pregunta: ¿Qué separa un acero de una fundición?
    opciones:
      - texto: Que la fundición tiene grafito y el acero no
        porque: La fundición blanca no tiene grafito, tiene cementita, y es una fundición.
      - texto: Que la fundición lleva silicio
        porque: El silicio empuja el carbono a grafito, pero no marca la frontera.
      - texto: El 0,76 % de carbono del eutectoide
        porque: Esa es la frontera entre los aceros hipoeutectoides y los hipereutectoides.
      - texto: El carbono, por encima de un 2,14 % es fundición
        correcta: true
        porque: Es el máximo que disuelve la austenita; por encima ya no son aceros.

  # de: t07 «Las fundiciones, una a una» (nuevo)
  - id: fun-por-que-se-cuelan
    bloque: '2'
    pregunta: ¿Por qué las fundiciones se cuelan en moldes en lugar de forjarse?
    opciones:
      - texto: Porque son tan dúctiles que no hace falta forjarlas
        porque: 'No lo son todas: la gris y la blanca son frágiles, y la dúctil tampoco se forja. Se cuelan porque funden bajo.'
      - texto: Porque rondan el eutéctico, funden mucho más bajo que el acero y el líquido corre bien por el molde
        correcta: true
        porque: El eutéctico del hierro-carburo de hierro está a 1147 °C, casi 400 °C por debajo del hierro puro.
      - texto: Porque funden más alto que el acero y no se pueden calentar lo bastante para forjarlas
        porque: Es al revés. Funden más bajo.
      - texto: Porque el grafito se quema si se golpean en caliente
        porque: 'No es eso: el grafito no arde dentro del metal. Se cuelan porque funden bajo y el líquido corre bien por el molde.'

  # de: t07 «Las fundiciones, una a una» (nuevo) y su ErrorTipico
  - id: fun-gris-traccion
    bloque: '2'
    pregunta: La fundición gris es frágil y débil a tracción porque…
    opciones:
      - texto: Sus láminas de grafito concentran la tensión como grietas
        correcta: true
        porque: Y a compresión esas láminas se cierran, así que resiste mucho más. La misma asimetría que un cerámico.
      - texto: Tiene el carbono en forma de cementita, que es durísima y frágil
        porque: Esa es la blanca, que es frágil por otra razón.
      - texto: Lleva magnesio o cerio, que debilitan la matriz de hierro
        porque: Esos dos dan grafito en esferas, la dúctil, que es justo la que no es frágil.
      - texto: Tiene muy poco carbono y su matriz es ferrita blanda
        porque: Tiene mucho, entre un 3 y un 4,5 % casi siempre.

  # de: t07 «Las fundiciones, una a una» (nuevo); t04 «Las fundiciones»
  - id: fun-ductil
    bloque: '2'
    pregunta: ¿Cómo se consigue una fundición dúctil o esferoidal?
    opciones:
      - texto: Recociendo mucho tiempo una fundición blanca hasta descomponer la cementita
        porque: Eso da la maleable, con el grafito en rosetas.
      - texto: Enfriándola muy deprisa para que el grafito no tenga tiempo de crecer
        porque: Deprisa, el carbono se queda en cementita y sale blanca.
      - texto: Quitándole casi todo el silicio para que el grafito salga redondo
        porque: Sin silicio el grafito sale peor, no mejor; es el camino de la blanca.
      - texto: Añadiendo un poco de magnesio o de cerio antes de colar
        correcta: true
        porque: Así el grafito sale en esferas, que concentran la tensión mucho menos que las láminas, y la fundición se estira mucho más.

  # de: t07 «Las fundiciones, una a una» (nuevo); t04 «Las fundiciones»
  - id: fun-blanca
    bloque: '2'
    pregunta: Una fundición durísima, resistente al desgaste, imposible de mecanizar y con el carbono en forma de cementita es la…
    opciones:
      - texto: Gris
        porque: La gris tiene el carbono en láminas de grafito y se mecaniza muy bien.
      - texto: Blanca
        correcta: true
        porque: Poco silicio y enfriamiento rápido. Su rotura es blanca por la cementita, y es la materia prima de la maleable.
      - texto: Maleable
        porque: La maleable es la blanca después del recocido, con el carbono ya en rosetas de grafito.
      - texto: Vermicular
        porque: La vermicular tiene grafito corto y grueso, entre la gris y la dúctil.

  # ── 3 · ALEACIONES DE Cu Y DE Ti ───────────────────────────────────
  # de: t07 «### Cobre»; «El cobre y el titanio, más de cerca» (nuevo) y su ErrorTipico
  - id: cuti-laton
    bloque: '3'
    pregunta: El latón es una aleación de cobre con…
    opciones:
      - texto: Estaño
        porque: Cobre con estaño es el bronce.
      - texto: Níquel
        porque: Cobre con níquel es un cuproníquel, el sistema isomorfo del tema 4.
      - texto: Cinc
        correcta: true
        porque: Con hasta cerca de un 39 % de cinc es de fase alfa, dúctil; con más aparece la beta (tema 4).
      - texto: Berilio
        porque: El cobre-berilio es otra aleación, la de cobre más resistente, que se endurece por precipitación.

  # de: t07 «El cobre y el titanio, más de cerca» (nuevo)
  - id: cuti-endurecer-cobre
    bloque: '3'
    pregunta: ¿Cómo se endurece la mayoría de las aleaciones de cobre?
    opciones:
      - texto: Por temple, como un acero, formando martensita
        porque: La mayoría no se endurece con un tratamiento térmico, y el temple es el que endurece a los aceros.
      - texto: Por deformación en frío y por disolución sólida
        correcta: true
        porque: Los dos mecanismos del tema 3 que valen para cualquier metal. Las excepciones se endurecen por precipitación, y la más conocida es el cobre-berilio.
      - texto: Todas por precipitación, disueltas y envejecidas como el aluminio
        porque: Solo algunas, como el cobre-berilio.
      - texto: Por nitruración de la superficie, como un acero
        porque: La nitruración es un tratamiento de la superficie de los aceros (tema 6).

  # de: t07 «El cobre y el titanio, más de cerca» (nuevo)
  - id: cuti-alotropia-titanio
    bloque: '3'
    pregunta: A temperatura ambiente el titanio es HC, la fase alfa. ¿Qué le pasa a 882 °C?
    opciones:
      - texto: Pasa a BCC, la fase beta
        correcta: true
        porque: Es alotrópico, como el hierro, y los aleantes eligen bando entre las dos fases.
      - texto: Funde
        porque: Funde mucho más alto, a 1668 °C, según la tabla del tema.
      - texto: Pasa a FCC, como el hierro a 912 °C
        porque: El hierro pasa de BCC a FCC; el titanio, de HC a BCC.
      - texto: Se vuelve amorfo
        porque: 'Calentar un sólido cristalino no lo vuelve amorfo: como mucho cambia de una red a otra, hasta que funde.'

  # de: t07 «El cobre y el titanio, más de cerca» (nuevo)
  - id: cuti-ti64
    bloque: '3'
    pregunta: La Ti-6Al-4V, la aleación de titanio más usada, en aviones e implantes, es…
    opciones:
      - texto: Una aleación alfa, que no se puede tratar térmicamente
        porque: Las que se tratan para subir mucho la resistencia son precisamente las alfa más beta, y esta es una de ellas.
      - texto: Un titanio con un 6 % de hierro y un 4 % de vanadio
        porque: El «6Al» es aluminio, no hierro.
      - texto: Una aleación beta con un 6 % de vanadio y un 4 % de aluminio
        porque: Los números van al revés, y no es beta sino alfa más beta.
      - texto: Una aleación alfa más beta, con un 6 % de aluminio y un 4 % de vanadio
        correcta: true
        porque: El aluminio estabiliza la alfa y el vanadio la beta, y queda una de las que se tratan térmicamente.

  # de: t07 «El cobre y el titanio, más de cerca» (nuevo); «### Titanio»
  - id: cuti-titanio-atmosfera
    bloque: '3'
    pregunta: ¿Por qué el titanio se funde y se suelda en vacío o con gas inerte?
    opciones:
      - texto: Porque al fundirlo desprende humos tóxicos que no se pueden respirar
        porque: El tema no dice nada de eso; de hecho se usa en implantes por lo bien que lo tolera el cuerpo.
      - texto: Porque funde a tan poca temperatura que el aire lo enfriaría
        porque: Funde muy alto, a 1668 °C.
      - texto: Porque en caliente reacciona con el oxígeno y el nitrógeno, que lo vuelven frágil
        correcta: true
        porque: Y eso, con lo difícil que es de extraer, es lo que lo hace caro.
      - texto: Porque su capa de óxido se desprende con el calor y, al enfriarse, ya no se rehace
        porque: La capa de óxido lo protege de la corrosión a temperatura ambiente; el problema en caliente es que reacciona.

  # ── 4 · ALEACIONES DE Al Y DE Mg ───────────────────────────────────
  # de: t07 «### Magnesio» y la figura de densidades
  - id: almg-mas-ligero
    bloque: '4'
    pregunta: ¿Cuál es el metal estructural más ligero?
    opciones:
      - texto: El aluminio
        porque: Pesa 2,70 g/cm³, algo más de un tercio que el hierro, pero el magnesio pesa menos.
      - texto: El titanio
        porque: Con 4,51 g/cm³ queda entre el aluminio y el hierro.
      - texto: El magnesio
        correcta: true
        porque: Con 1,74 g/cm³, menos de la cuarta parte que el hierro.
      - texto: El níquel
        porque: Con 8,90 g/cm³ pesa más que el propio hierro.

  # de: t07 «Las aleaciones de aluminio y de magnesio, por familias» (nuevo)
  - id: almg-no-tratable
    bloque: '4'
    pregunta: ¿Qué serie de aluminios de forja NO se endurece por precipitación?
    opciones:
      - texto: La 2xxx, de cobre
        porque: Es de las tratables térmicamente, la de la estructura de los aviones.
      - texto: La 5xxx, de magnesio
        correcta: true
        porque: Se endurece por deformación en frío y por disolución sólida, como la 1xxx y la 3xxx.
      - texto: La 6xxx, de magnesio y silicio
        porque: Es tratable; el 6061-T6 es de esta serie, disuelto y envejecido.
      - texto: La 7xxx, de cinc
        porque: Es tratable, y de las más resistentes.

  # de: t07 «Las aleaciones de aluminio y de magnesio, por familias» (nuevo) y su ErrorTipico
  - id: almg-6061-t6
    bloque: '4'
    pregunta: ¿Qué dice la designación 6061-T6 de un aluminio?
    opciones:
      - texto: Que lleva un 6 % de magnesio y un 0,61 % de silicio
        porque: En un 6061 las cifras no son porcentajes; el 61 solo identifica la aleación dentro de su serie.
      - texto: Que es de cinc y está endurecido por deformación
        porque: El cinc es la serie 7xxx, y la letra de la deformación es la H.
      - texto: Que es de la serie del magnesio y el silicio, y está recocido
        porque: Recocido es la O; la T6 es disuelto y envejecido.
      - texto: Que es de la serie del magnesio y el silicio, disuelto y envejecido
        correcta: true
        porque: La primera cifra da la serie y la T6, las dos etapas del endurecimiento por precipitación del tema 6.

  # de: t07 «### Magnesio»; «Las aleaciones de aluminio y de magnesio, por familias» (nuevo)
  - id: almg-magnesio-se-cuela
    bloque: '4'
    pregunta: ¿Por qué la mayor parte del magnesio se cuela en lugar de conformarse en frío?
    opciones:
      - texto: Porque es HC, con pocos sistemas de deslizamiento
        correcta: true
        porque: Por eso se deforma mal en frío. Lo que se conforma, se conforma en caliente; lo que se cuela, casi siempre se inyecta a presión en moldes metálicos.
      - texto: Porque funde más alto que el acero y no se puede calentar para forjarlo
        porque: Funde a 650 °C, muy por debajo del hierro.
      - texto: Porque es FCC y tan blando que no aguanta la laminación
        porque: El FCC es el aluminio, que se conforma muy bien. El magnesio es HC.
      - texto: Porque se corroe en cuanto se lamina y pierde la superficie
        porque: Se corroe con facilidad, sobre todo con sal, pero no es eso lo que impide conformarlo en frío.

  # de: t07 «Cómo se elige»; ejemplo «La masa que se ahorra cambiando acero por aluminio»
  - id: almg-resistencia-por-masa
    bloque: '4'
    pregunta: Una aleación de aluminio resiste la mitad que un acero. ¿Por qué puede ser mejor para un avión?
    opciones:
      - texto: Porque es más dúctil y se deforma antes de romper
        porque: 'No es la razón: un aluminio de avión no es más dúctil que un acero corriente. Lo que decide es la resistencia por unidad de masa.'
      - texto: Porque aguanta más temperatura que el acero
        porque: Es al revés. El aluminio funde a 660 °C y pierde resistencia mucho antes.
      - texto: Porque pesa un tercio, y lleva la misma carga con menos masa
        correcta: true
        porque: La columna que decide es una división, la resistencia por unidad de masa.
      - texto: Porque su red HC lo hace más rígido
        porque: El aluminio es FCC. HC son el magnesio y el titanio.

  # ── 5 · CERÁMICOS ABRASIVOS. CARBUROS Y NITRUROS ───────────────────
  # de: t08 «Los abrasivos, los carburos y los nitruros» (nuevo)
  - id: abr-que-se-le-pide
    bloque: '5'
    pregunta: Además de ser más duro que lo que corta, ¿qué se le pide a un abrasivo?
    opciones:
      - texto: Que conduzca bien la electricidad, para que el roce no lo cargue de estática y salten chispas
        porque: No es una de las exigencias del tema; muchos abrasivos son aislantes.
      - texto: Que aguante el calor del roce sin ablandarse ni reaccionar, y que sea bastante tenaz
        correcta: true
        porque: Al rozar se calienta mucho, y un grano que se desmenuza antes de tiempo no corta.
      - texto: Que sea dúctil como un metal, para deformarse en lugar de romperse
        porque: Un cerámico no lo es; se le pide tenacidad suficiente, no ductilidad.
      - texto: Que sea transparente, para poder ver el corte a través del grano
        porque: No tiene nada que ver con cortar.

  # de: t08 «Los abrasivos, los carburos y los nitruros» (nuevo)
  - id: abr-nitruro-de-boro
    bloque: '5'
    pregunta: ¿Por qué los aceros se mecanizan con nitruro de boro cúbico y no con diamante?
    opciones:
      - texto: Porque el nitruro de boro cúbico es más duro que el diamante y se gasta menos
        porque: Es el segundo más duro; el primero sigue siendo el diamante.
      - texto: Porque el diamante conduce la electricidad y se desgasta por chispas
        porque: El diamante es aislante, y eso no tiene que ver con cortar acero.
      - texto: Porque el carbono del diamante reacciona con el hierro caliente del corte
        correcta: true
        porque: Es un límite químico, no de dureza. El nitruro de boro cúbico, con la estructura de la blenda, no tiene ese problema.
      - texto: Porque el diamante se ablanda con el calor del corte y pierde el filo
        porque: El diamante no se ablanda en caliente; lo que le pasa con el hierro caliente es que su carbono reacciona.

  # de: t08 «Los abrasivos, los carburos y los nitruros» (nuevo)
  - id: abr-lija
    bloque: '5'
    pregunta: El polvo abrasivo pegado sobre papel o tela, como en una lija, es un abrasivo…
    opciones:
      - texto: Aglomerado
        porque: Aglomerado es el de una muela, granos pegados con un aglomerante vítreo o de resina.
      - texto: Suelto
        porque: Suelto es el polvo en una pasta de agua o aceite, para pulir.
      - texto: Sinterizado
        porque: Sinterizar es una forma de fabricar cerámicos técnicos desde polvo, no una forma de usar un abrasivo.
      - texto: Revestido
        correcta: true
        porque: Es la tercera de las tres formas del tema, junto al aglomerado y el suelto.

  # de: t08 «Los abrasivos, los carburos y los nitruros» (nuevo); «Por qué un cerámico es frágil»
  - id: abr-por-que-duros
    bloque: '5'
    pregunta: ¿De dónde sale la dureza de carburos y nitruros como el SiC o el nitruro de boro cúbico?
    opciones:
      - texto: De sus enlaces covalentes, fuertes y con dirección
        correcta: true
        porque: 'Es la misma causa que hace frágil a un cerámico, vista desde el otro lado: las dislocaciones casi no se mueven.'
      - texto: Del oxígeno de su red, como en la alúmina
        porque: No llevan oxígeno; son cerámicos sin ser óxidos.
      - texto: De su enlace metálico, que no tiene dirección
        porque: Un enlace sin dirección es justo el que deja moverse a las dislocaciones; el SiC y el nitruro de boro son casi covalentes puros.
      - texto: De ser amorfos, sin planos cristalinos por los que puedan deslizar
        porque: Son cristalinos; la dureza sale del enlace, no del desorden.

  # de: t08 ErrorTipico «Duro no quiere decir resistente» (nuevo); t10 «Reforzados con partículas»
  - id: abr-carburo-en-cobalto
    bloque: '5'
    pregunta: ¿Por qué el carburo de wolframio de las herramientas de corte va casi siempre dentro de una matriz de cobalto?
    opciones:
      - texto: Porque el carburo solo no es bastante duro para cortar acero
        porque: Es de los más duros; lo que le falta no es dureza.
      - texto: Porque el carburo es duro pero frágil, y el metal pone la tenacidad
        correcta: true
        porque: Es un cermet, el metal duro de las plaquitas. Duro no quiere decir tenaz.
      - texto: Para que la herramienta conduzca mejor el calor del corte y no se queme el filo
        porque: El carburo ya conduce bien el calor; el cobalto está para darle la tenacidad que le falta.
      - texto: Porque el cobalto le da su color y lo protege del óxido
        porque: 'No es su función: el cobalto sujeta los granos y frena las grietas.'

  # ── 6 · CERÁMICOS REFRACTARIOS. SÍLICES Y ALUMINOSILICATOS ─────────
  # de: t08 «Los refractarios» (nuevo)
  - id: ref-porosidad
    bloque: '6'
    pregunta: ¿Qué le da la porosidad a un refractario?
    opciones:
      - texto: 'Solo ventajas: aísla, aguanta el choque térmico y además resiste más, y por eso todos son porosos'
        porque: 'Tiene un precio: los poros quitan resistencia y dejan entrar la escoria, y por eso hay refractarios densos.'
      - texto: Más resistencia mecánica, a cambio de aislar peor
        porque: Es al revés. Los poros aíslan y quitan resistencia.
      - texto: Aísla y aguanta el choque térmico, pero resiste menos y deja pasar la escoria
        correcta: true
        porque: Reparte las exigencias en dos bandos, y por eso se elige un refractario para cada zona del horno.
      - texto: Nada, porque los poros se cierran al calentarlo en el horno
        porque: El tema dice que la porosidad sí cuenta, y en los dos sentidos.

  # de: t08 «Los refractarios» (nuevo)
  - id: ref-silice-es-acido
    bloque: '6'
    pregunta: Un refractario de sílice es ácido. ¿Qué escoria lo ataca?
    opciones:
      - texto: Una rica en cal o en magnesia, básica
        correcta: true
        porque: Un refractario tiene que ser del mismo carácter que la escoria que toca, y la cal y la magnesia son del contrario.
      - texto: Una rica en sílice
        porque: Esa es del mismo carácter; la que ataca a la sílice es la básica.
      - texto: Ninguna, por ser casi sílice pura
        porque: La pureza no lo libra de reaccionar con una escoria básica.
      - texto: Solo el metal fundido, nunca la escoria
        porque: 'Falso: lo que ataca a un refractario de sílice es una escoria básica, rica en cal o en magnesia.'

  # de: t08 «Los refractarios», «### Lo que dice el diagrama sílice-alúmina» (nuevo); t04 «Diagramas de fase de cerámicos»
  - id: ref-alumina-en-silice
    bloque: '6'
    pregunta: En un refractario de sílice, ¿qué hace un poco de alúmina?
    opciones:
      - texto: Lo mejora, porque la alúmina funde más alto y sube la temperatura de todo el ladrillo
        porque: Pasado el eutéctico, más alúmina sí es más refractario; con muy poca, no.
      - texto: Nada, porque sílice y alúmina no se disuelven en estado sólido
        porque: 'No se disuelven en sólido, pero la alúmina forma mullita, y sílice y mullita tienen un eutéctico a 1587 °C: eso basta.'
      - texto: Lo vuelve un vidrio al enfriarlo, y deja de ser cristalino
        porque: No es lo que dice el diagrama; lo que aparece es líquido a menos temperatura.
      - texto: 'Lo empeora: aparece líquido a 1587 °C, por debajo de donde funde la sílice'
        correcta: true
        porque: El eutéctico está muy cerca de la sílice pura. Por eso se fabrican con la alúmina tan baja como se puede.

  # de: t08 «Las sílices y los aluminosilicatos» (nuevo)
  - id: ref-silice-neutra
    bloque: '6'
    pregunta: ¿Por qué la sílice, SiO₂, es neutra y un tetraedro SiO₄ suelto no lo es?
    opciones:
      - texto: Porque en la sílice el silicio pierde su carga al unirse al oxígeno
        porque: El silicio sigue aportando cuatro cargas positivas; lo que cambia es de quién son los oxígenos.
      - texto: Porque cada tetraedro comparte sus cuatro oxígenos con sus vecinos
        correcta: true
        porque: Cada oxígeno es de dos tetraedros a la vez; con los cuatro compartidos no sobra ninguna carga.
      - texto: Porque en la sílice el silicio se rodea de seis oxígenos en vez de cuatro
        porque: Sigue en tetraedro, con cuatro; la relación de radios, 0,286, da coordinación 4.
      - texto: Porque la sílice es amorfa y sus cargas se reparten al azar
        porque: El cuarzo es sílice cristalina y también es neutra.

  # de: t08 «Las sílices y los aluminosilicatos» (nuevo)
  - id: ref-arcilla-mojada
    bloque: '6'
    pregunta: ¿Por qué la arcilla mojada se puede moldear y la seca no?
    opciones:
      - texto: Porque el agua disuelve la arcilla y la convierte en una pasta líquida que se moldea
        porque: 'No la disuelve: la arcilla sigue siendo plaquitas sólidas, solo que rodeadas de agua.'
      - texto: Porque al mojarla se vuelve amorfa y pierde sus planos
        porque: El agua no cambia la estructura de la caolinita.
      - texto: Porque el agua reacciona con ella y forma mullita, que es blanda
        porque: La mullita aparece al cocerla, a temperatura alta, no al mojarla.
      - texto: Porque el agua rodea sus plaquitas de una película que las deja deslizar
        correcta: true
        porque: Las plaquitas de caolinita están unidas por fuerzas débiles, y la película de agua las deja resbalar unas sobre otras.

  # de: t08 ErrorTipico «Silicio, sílice, silicato y silicona son cuatro cosas» (nuevo)
  - id: ref-silicona
    bloque: '6'
    pregunta: ¿Cuál de estos cuatro es un polímero?
    opciones:
      - texto: La sílice
        porque: Es el óxido del silicio, SiO₂, un cerámico.
      - texto: La silicona
        correcta: true
        porque: Una cadena de silicio y oxígeno alternados con grupos orgánicos colgando, la de los elastómeros del tema 9.
      - texto: El silicio
        porque: Es un elemento, el semiconductor del tema 1.
      - texto: Un silicato
        porque: Es un cerámico de tetraedros SiO₄ con otros cationes.

  # de: t08 ErrorTipico «Refractario no quiere decir aislante» (nuevo)
  - id: ref-no-es-aislante
    bloque: '6'
    pregunta: ¿Es cierto que un refractario es, por definición, un buen aislante térmico?
    opciones:
      - texto: Sí, porque todo cerámico aísla el calor, y un refractario no deja de ser un cerámico
        porque: El carburo de silicio y el grafito son refractarios y conducen muy bien el calor.
      - texto: 'No: refractario dice que aguanta la temperatura, y los que aíslan son los porosos'
        correcta: true
        porque: Lo que aísla es el aire de los poros, y un horno suele llevar una cara densa y una capa aislante detrás.
      - texto: Sí, porque si no aislara, el calor se escaparía y el horno se enfriaría
        porque: El horno usa una capa aislante detrás, pero la cara que toca el fuego es densa.
      - texto: No, porque los refractarios son metálicos y todos conducen el calor
        porque: Son cerámicos, y el grafito de los especiales tampoco es un metal.

  # ── 7 · EL CARBONO Y SUS ALÓTROPOS ─────────────────────────────────
  # de: t08 «El carbono y sus alótropos» (nuevo); t03 «Polimorfismo, y la densidad teórica»
  - id: car-que-es-alotropo
    bloque: '7'
    pregunta: ¿Qué son los alótropos del carbono?
    opciones:
      - texto: Formas del mismo elemento con los átomos enlazados de otra manera
        correcta: true
        porque: Es el polimorfismo del tema 3 cuando lo sufre un elemento.
      - texto: Átomos de carbono con distinto número de neutrones en el núcleo
        porque: Eso serían isótopos, que cambian el núcleo; un alótropo cambia cómo se enlazan los átomos.
      - texto: Compuestos del carbono con metales, como los carburos de las herramientas
        porque: Un carburo es un compuesto de dos elementos; un alótropo es carbono puro.
      - texto: Carbonos de distinta pureza, según cuánto hidrógeno les quede
        porque: Todos son carbono puro; lo que cambia es el enlace y la geometría.

  # de: t08 «El carbono y sus alótropos» (nuevo)
  - id: car-conduce-o-no
    bloque: '7'
    pregunta: ¿Por qué el diamante no conduce la electricidad y el grafito sí?
    opciones:
      - texto: Porque el grafito es en realidad un metal, con sus átomos en una nube de electrones
        porque: Es carbono con enlace covalente dentro de sus láminas; conduce sin ser un metal.
      - texto: Porque el diamante es amorfo y sus electrones no encuentran camino
        porque: Es cristalino, con la red cúbica del diamante; lo que pasa es que no le queda ningún electrón libre.
      - texto: Porque al carbono del grafito le queda un electrón libre, y al del diamante no
        correcta: true
        porque: Es la diferencia entre sp² y sp³, y por eso el grafito conduce a lo largo de las láminas y muy poco de una a otra.
      - texto: Porque el grafito natural lleva impurezas metálicas que conducen
        porque: El grafito puro conduce igual; la razón es su enlace.

  # de: t08 «El carbono y sus alótropos», «### Grafito» (nuevo); t01 «Cristalino o amorfo»
  - id: car-grafito-lubrica
    bloque: '7'
    pregunta: ¿Por qué el grafito sirve de lubricante sólido y es la mina del lápiz?
    opciones:
      - texto: Porque dentro de cada lámina los enlaces son débiles, y se rompen al frotarlo contra el papel
        porque: Es al revés. Dentro de la lámina son covalentes y fuertes.
      - texto: Porque sus láminas, unidas solo por Van der Waals, deslizan unas sobre otras
        correcta: true
        porque: Enlaces fuertes dentro de la lámina y débiles entre láminas; por ahí se desliza.
      - texto: Porque es un líquido muy viscoso que se queda pegado al papel
        porque: Es un sólido cristalino.
      - texto: Porque sus electrones libres hacen de lubricante entre las láminas
        porque: Eso explica que conduzca, no que deslice.

  # de: t08 ErrorTipico «El diamante no es la forma estable del carbono» (nuevo); t03 «Polimorfismo, y la densidad teórica»
  - id: car-forma-estable
    bloque: '7'
    pregunta: A temperatura y presión ambiente, ¿cuál es la forma estable del carbono?
    opciones:
      - texto: El diamante
        porque: El diamante es metaestable. No pasa a grafito porque reordenar su red exige romper enlaces muy fuertes.
      - texto: El fullereno
        porque: 'No: la forma estable a temperatura y presión ambiente es el grafito; el fullereno es una molécula cerrada.'
      - texto: El grafeno
        porque: El grafeno es una lámina suelta de grafito, no la forma estable en masa.
      - texto: El grafito
        correcta: true
        porque: El diamante se forma a presiones enormes, y a temperatura ambiente se queda como está porque el cambio es lentísimo.

  # de: t08 «El carbono y sus alótropos», «### Grafeno» (nuevo)
  - id: car-grafeno
    bloque: '7'
    pregunta: ¿Qué es el grafeno?
    opciones:
      - texto: Una sola lámina de grafito, de un átomo de espesor
        correcta: true
        porque: Un material en dos dimensiones, sin enlaces débiles entre láminas, y por eso tan resistente en su plano.
      - texto: Una molécula cerrada de 60 átomos
        porque: Ese es el fullereno C₆₀.
      - texto: Una capa fina de diamante depositada desde un gas
        porque: El diamante también se deposita en capas, pero es carbono sp³, no una lámina de grafito.
      - texto: Grafito molido en polvo muy fino
        porque: Un polvo de grafito sigue siendo grafito, con muchas láminas apiladas.

  # de: t08 «El carbono y sus alótropos», «### Fullerenos» (nuevo)
  - id: car-pentagonos
    bloque: '7'
    pregunta: El C₆₀ tiene 20 hexágonos y 12 pentágonos. ¿Para qué hacen falta los pentágonos?
    opciones:
      - texto: Para unir cada molécula con las de alrededor en el sólido
        porque: Las moléculas de C₆₀ se sujetan unas a otras por Van der Waals, como en cualquier sólido molecular.
      - texto: Para que la molécula conduzca la electricidad como el grafito o los nanotubos
        porque: Conducir es cosa del electrón libre del sp², que tienen igual los hexágonos; y el sólido de C₆₀ apenas conduce.
      - texto: 'Para cerrar la jaula: con hexágonos solos, la lámina solo se enrolla'
        correcta: true
        porque: Con hexágonos solos sale, como mucho, un tubo; para cerrar una jaula hacen falta exactamente doce pentágonos.
      - texto: Son defectos de fabricación que se quitan al purificarlo
        porque: 'Sin ellos no habría molécula cerrada: todos los fullerenos llevan doce.'

  # de: t08 «El carbono y sus alótropos», «### Nanotubos» (nuevo)
  - id: car-nanotubo
    bloque: '7'
    pregunta: Según el ángulo con el que esté enrollada su lámina, un nanotubo de carbono…
    opciones:
      - texto: Es de una pared o de varias
        porque: Eso depende de cuántas láminas lleve, no del ángulo.
      - texto: Es diamante o grafito
        porque: Un nanotubo es siempre una lámina de grafeno enrollada.
      - texto: Es siempre aislante
        porque: Puede conducir como un metal.
      - texto: Conduce como un metal o es semiconductor
        correcta: true
        porque: Con los mismos átomos y el mismo enlace; lo cambia solo la geometría.

  # ── 8 · TERMOPLÁSTICOS Y TERMOESTABLES. ESTRUCTURA ─────────────────
  # de: t09 «Las formas de las cadenas»; «Termoplásticos, termoestables y elastómeros»
  - id: est-termoplastico
    bloque: '8'
    pregunta: ¿Qué estructura tienen las cadenas de un termoplástico?
    opciones:
      - texto: Una red tridimensional en la que todo está unido a todo
        porque: Esa es la de un termoestable.
      - texto: Cadenas enrolladas con unos pocos entrecruzamientos
        porque: Esa es la de un elastómero.
      - texto: Lineales o ramificadas, sujetas entre sí solo por fuerzas secundarias
        correcta: true
        porque: Por eso el calor las separa, el material se ablanda y funde, y se puede reciclar fundiéndolo.
      - texto: Cadenas unidas por enlace metálico
        porque: En un polímero no hay enlace metálico.

  # de: t09 «Termoplásticos, termoestables y elastómeros» y su ErrorTipico
  - id: est-termoestable-calor
    bloque: '8'
    pregunta: ¿Qué le pasa a un termoestable al calentarlo mucho?
    opciones:
      - texto: Se degrada, se descompone o se quema antes de fundir
        correcta: true
        porque: Sus cadenas están reticuladas; el calor no las separa, rompe los enlaces.
      - texto: Se funde y se puede volver a moldear
        porque: Eso es un termoplástico.
      - texto: Nada, aguanta cualquier temperatura
        porque: Termoestable dice que el calor no lo ablanda, no que no le afecte.
      - texto: Se vuelve un elastómero
        porque: Un elastómero es otra estructura, con pocos entrecruzamientos, no un termoestable caliente.

  # de: t09 «Cómo se colocan los grupos laterales» (nuevo); «Amorfos y cristalinos, y las dos temperaturas»
  - id: est-atactico
    bloque: '8'
    pregunta: El poliestireno corriente es amorfo y transparente porque…
    opciones:
      - texto: Es isotáctico, con todos los anillos de benceno al mismo lado de la cadena
        porque: Una cadena isotáctica es regular y cristaliza; el poliestireno corriente no.
      - texto: Está reticulado, y la red no deja ordenarse a las cadenas
        porque: Es un termoplástico, de cadenas sueltas.
      - texto: Tiene muy poca masa molar, y sus cadenas cortas no se ordenan
        porque: La masa molar cambia la resistencia y la temperatura de fusión; lo que decide aquí es la regularidad de la cadena.
      - texto: 'Es atáctico: sus anillos van al azar y la cadena cristaliza mal'
        correcta: true
        porque: Una cadena atáctica no encaja con sus vecinas. El polipropileno, en cambio, es sobre todo isotáctico y semicristalino.

  # de: t09 «Cómo se forma la red de un termoestable» (nuevo)
  - id: est-red-o-cadena
    bloque: '8'
    pregunta: Al polimerizar, ¿qué decide que salga una red tridimensional y no cadenas lineales?
    opciones:
      - texto: Que la polimerización sea por condensación
        porque: Por condensación salen también termoplásticos lineales, como el PET.
      - texto: Que algún monómero tenga tres o más puntos de unión
        correcta: true
        porque: Con dos, cada monómero se engancha a un vecino por lado y sale una cadena; con tres o más, y bastantes uniones, una red.
      - texto: Que se polimerice a temperatura alta
        porque: La temperatura cambia la velocidad, no si sale cadena o red.
      - texto: Que la cadena sea muy larga
        porque: Una cadena larga sigue siendo una cadena.

  # de: t09 «Cómo se forma la red de un termoestable» (nuevo)
  - id: est-condensacion
    bloque: '8'
    pregunta: En la polimerización por condensación…
    opciones:
      - texto: Se abre un doble enlace y la cadena crece por un extremo sin que sobre nada
        porque: Eso es la adición, la del polietileno.
      - texto: Solo se forman termoestables
        porque: Por condensación se hacen el PET y muchos nailons, que son termoplásticos.
      - texto: En cada unión suele salir una molécula pequeña, a menudo agua
        correcta: true
        porque: Así se hacen los poliésteres, muchos nailons y las resinas fenólicas.
      - texto: El polímero se condensa a partir de un gas, como el rocío
        porque: El nombre viene de la molécula que sale en cada unión, no de un cambio de estado.

  # ── 9 · TERMOPLÁSTICOS Y TERMOESTABLES. PROCESADO ──────────────────
  # de: t09 «Cómo se procesan»
  - id: pro-inyeccion
    bloque: '9'
    pregunta: Piezas de termoplástico complicadas, en serie y en segundos, se hacen por…
    opciones:
      - texto: Moldeo por inyección
        correcta: true
        porque: El termoplástico fundido se inyecta a presión en un molde frío.
      - texto: Extrusión
        porque: La extrusión da piezas de sección constante, como tubos y perfiles.
      - texto: Soplado
        porque: El soplado da piezas huecas, como botellas.
      - texto: Moldeo por compresión
        porque: Ese es el de los termoestables, que curan dentro del molde; las piezas de termoplástico complicadas, en segundos, se inyectan.

  # de: t09 «Cómo se forma la red de un termoestable» (nuevo); «Cómo se procesan»
  - id: pro-termoestable-en-molde
    bloque: '9'
    pregunta: ¿Por qué un termoestable tiene que tomar su forma a la vez que cura, dentro del molde?
    opciones:
      - texto: Porque tiene que evaporarse dentro del molde el disolvente de la resina
        porque: Curar no es secar; cura por reacción química, también en un molde cerrado.
      - texto: Porque un termoestable no se puede calentar sin que se queme
        porque: Se cura a menudo con calor; lo que no hace es fundir.
      - texto: Porque la red que forma al curar no se deshace, y no se puede refundir
        correcta: true
        porque: Por eso se moldea por compresión o por transferencia, y no se inyecta fundido como un termoplástico.
      - texto: Porque así sale más barato que moldearlo después, ya curado
        porque: No es cuestión de precio; después no habría otra manera.

  # de: t09 «Los aditivos, y otras formas de dar forma» (nuevo) y su ErrorTipico
  - id: pro-plastificante
    bloque: '9'
    pregunta: Un aditivo que se mete entre las cadenas del PVC, baja su transición vítrea y lo vuelve flexible es…
    opciones:
      - texto: Una carga
        porque: Una carga son partículas sólidas que abaratan y suelen dar rigidez; hace casi lo contrario.
      - texto: Un plastificante
        correcta: true
        porque: El PVC de una tubería no lleva; el de una manguera o el forro de un cable, sí.
      - texto: Un estabilizante
        porque: Un estabilizante frena la degradación por la luz y la oxidación.
      - texto: Un retardante de llama
        porque: Un retardante de llama le pone difícil arder.

  # de: t09 «Los aditivos, y otras formas de dar forma» (nuevo); «Cómo se comportan a tracción»
  - id: pro-hilado
    bloque: '9'
    pregunta: Al hilar una fibra de polímero, ¿para qué se estira después?
    opciones:
      - texto: Para hacerla más fina y ligera, sin cambiar su resistencia
        porque: Sí cambia su resistencia, y ese es el motivo.
      - texto: Para curarla y que no se funda al usarla
        porque: Curar es formar una red, cosa de termoestables.
      - texto: Para desordenar las cadenas y que cristalice menos
        porque: Estirar ordena las cadenas, no las desordena.
      - texto: Para alinear las cadenas a lo largo de la fibra
        correcta: true
        porque: 'Alineadas, resisten mucho más en esa dirección: es el cuello del ensayo de tracción, hecho a propósito.'

  # de: t09 «Los aditivos, y otras formas de dar forma» (nuevo)
  - id: pro-transferencia
    bloque: '9'
    pregunta: El moldeo por transferencia, que calienta el material en una cámara aparte y lo empuja a un molde caliente donde cura, se usa sobre todo con…
    opciones:
      - texto: Termoestables
        correcta: true
        porque: Es el moldeo por compresión mejorado para ellos, y da piezas más complicadas.
      - texto: Termoplásticos de envase
        porque: Esos se inyectan, se soplan o se termoconforman.
      - texto: Fibras
        porque: Las fibras se hilan.
      - texto: Espumas
        porque: Las espumas se hacen llenando el polímero de burbujas.

  # ── 10 · HOMOPOLÍMEROS Y COPOLÍMEROS ───────────────────────────────
  # de: t09 «De qué están hechas las cadenas»; «Homopolímeros y copolímeros» (nuevo) y su ErrorTipico
  - id: cop-que-es
    bloque: '10'
    pregunta: ¿Qué es un copolímero?
    opciones:
      - texto: Una mezcla de cadenas de dos polímeros distintos, bien revueltas
        porque: En una mezcla cada cadena es de un solo tipo; en un copolímero los dos meros están en la misma cadena.
      - texto: Un polímero reforzado con fibras de otro material
        porque: Eso es un material compuesto, del tema 10.
      - texto: Un polímero con dos meros distintos en la misma cadena
        correcta: true
        porque: 'Los dos meros van en la misma cadena, unidos por enlaces covalentes: no es una mezcla.'
      - texto: Dos cadenas iguales unidas por puentes de azufre
        porque: Eso es la vulcanización de un caucho.

  # de: t09 «Homopolímeros y copolímeros» (nuevo)
  - id: cop-en-bloque
    bloque: '10'
    pregunta: Una cadena A-A-A-A-A-A-B-B-B-B-B-B… es un copolímero…
    opciones:
      - texto: Al azar
        porque: Al azar, A y B irían sin ningún orden.
      - texto: Alternado
        porque: Alternado sería A-B-A-B…
      - texto: Injertado
        porque: Injertado sería una cadena de A con ramas enteras de B colgando.
      - texto: En bloque
        correcta: true
        porque: Tramos largos de un mero seguidos de tramos largos del otro.

  # de: t09 «Homopolímeros y copolímeros» (nuevo)
  - id: cop-sbs
    bloque: '10'
    pregunta: ¿Por qué el SBS, estireno-butadieno-estireno, es un elastómero termoplástico?
    opciones:
      - texto: Porque sus bloques de estireno hacen de nudos rígidos que el calor ablanda
        correcta: true
        porque: A temperatura ambiente es elástico como un caucho vulcanizado, y en caliente se moldea como un termoplástico.
      - texto: Porque está vulcanizado con azufre, y esos puentes se deshacen al calentarlo
        porque: 'Los puentes de azufre son covalentes y el calor no los deshace: un caucho vulcanizado no se vuelve a moldear.'
      - texto: Porque es un copolímero al azar, y su cadena irregular no cristaliza
        porque: Es en bloque, y de eso depende que los bloques de estireno se junten en nudos.
      - texto: Porque es un termoestable con muy pocos puntos de unión en su red
        porque: 'Un termoestable no se vuelve a moldear: su red es covalente y el calor no la deshace.'

  # de: t09 «Homopolímeros y copolímeros» (nuevo); «Amorfos y cristalinos, y las dos temperaturas»
  - id: cop-al-azar-cristalinidad
    bloque: '10'
    pregunta: Meter al azar un poco de un segundo mero en un polímero suele…
    opciones:
      - texto: Subir su cristalinidad, porque la cadena se vuelve más regular
        porque: Al azar la vuelve menos regular.
      - texto: Bajar su cristalinidad y volverlo más flexible y más transparente
        correcta: true
        porque: Una cadena irregular cristaliza mal. El polipropileno con algo de etileno al azar es más claro y flexible que el solo.
      - texto: Convertirlo en un termoestable
        porque: Para eso harían falta puntos de unión para formar una red, no un segundo mero.
      - texto: No cambiar nada si es poco
        porque: Basta un poco para romper la regularidad.

  # de: t09 «De qué están hechas las cadenas»; «Homopolímeros y copolímeros» (nuevo)
  - id: cop-homopolimero
    bloque: '10'
    pregunta: ¿Cuál de estos es un homopolímero?
    opciones:
      - texto: El ABS
        porque: 'Es un terpolímero: caucho de butadieno con ramas de estireno-acrilonitrilo injertadas.'
      - texto: El SBR de los neumáticos
        porque: Es un copolímero al azar de estireno y butadieno.
      - texto: El polipropileno
        correcta: true
        porque: Repite siempre el mismo mero, como el polietileno, el PVC y el poliestireno.
      - texto: El SBS
        porque: Es un copolímero en bloque.

  # ── 11 · COMPUESTOS DE PARTÍCULAS ──────────────────────────────────
  # de: t10 «Reforzados con partículas»
  - id: par-dispersion
    bloque: '11'
    pregunta: En un compuesto reforzado por dispersión, ¿qué hacen las partículas?
    opciones:
      - texto: Llevan la mayor parte de la carga, como la grava en el hormigón
        porque: 'Ni las partículas grandes hacen eso: se reparten la carga con la matriz. Las de dispersión no la llevan ellas mismas.'
      - texto: Frenan a las dislocaciones de la matriz metálica
        correcta: true
        porque: Como en el endurecimiento por precipitación; son de decenas de nanómetros y no se disuelven al calentar.
      - texto: Dan color y abaratan
        porque: Eso sería una carga de un plástico, no un refuerzo por dispersión.
      - texto: Se disuelven al calentar y vuelven a precipitar al envejecer
        porque: Eso es el endurecimiento por precipitación; la ventaja de la dispersión es justo que sus partículas no se disuelven.

  # de: t10 «Tres compuestos de partículas, de cerca» (nuevo)
  - id: par-cotas
    bloque: '11'
    pregunta: Para un compuesto de partículas grandes, ¿qué da $E_m V_m + E_p V_p$?
    opciones:
      - texto: El módulo exacto del compuesto, sea cual sea el tamaño y la forma de las partículas
        porque: Con partículas grandes no hay fórmula exacta, solo dos cotas.
      - texto: La cota inferior, la de suponer que las dos fases llevan la misma tensión
        porque: Esa es la de las inversas; la media pesada con las fracciones es la de arriba.
      - texto: La cota superior, la de suponer que las dos fases se deforman lo mismo
        correcta: true
        porque: El módulo real cae entre esta y la inferior, porque ninguna de las dos suposiciones se cumple del todo.
      - texto: El módulo perpendicular a las partículas, que es el más bajo de los dos
        porque: Las partículas no tienen una dirección, como las fibras.

  # de: t10 «Tres compuestos de partículas, de cerca» (nuevo)
  - id: par-armado
    bloque: '11'
    pregunta: ¿Por qué funciona el hormigón armado?
    opciones:
      - texto: Porque el acero sube la resistencia a compresión, que es justo la que le falta al hormigón
        porque: Es al revés. Al hormigón le falta la de tracción.
      - texto: Porque el acero y el cemento reaccionan y forman una aleación resistente
        porque: No reaccionan así; el acero va metido en barras.
      - texto: Porque el acero hace el hormigón más ligero y más fácil de colar
        porque: El acero pesa más que el hormigón.
      - texto: Porque el acero lleva la tracción, se dilata casi como el hormigón y el cemento lo protege
        correcta: true
        porque: El cemento, alcalino, lo protege de la corrosión; y las barras son corrugadas para que agarren.

  # de: t10 «Tres compuestos de partículas, de cerca» (nuevo); t08 «Por qué un cerámico es frágil» (vidrio templado)
  - id: par-pretensado
    bloque: '11'
    pregunta: En el hormigón pretensado, los cables de acero tensados…
    opciones:
      - texto: Lo dejan comprimido, y una tracción tiene que vencer antes esa compresión
        correcta: true
        porque: Es la misma idea que el vidrio templado del tema 8.
      - texto: Estiran el hormigón para que se vuelva más dúctil
        porque: El hormigón sigue siendo frágil; lo que se consigue es que trabaje comprimido.
      - texto: Sustituyen a la grava como refuerzo, y así el hormigón pesa menos y resiste más
        porque: Los áridos siguen ahí y son la mayor parte del volumen; los cables lo que hacen es comprimirlo.
      - texto: Calientan el hormigón para que fragüe antes y más fuerte
        porque: El fraguado es una reacción con el agua; los cables no tienen nada que ver.

  # de: t10 ErrorTipico «El hormigón no seca: fragua» (nuevo)
  - id: par-fragua
    bloque: '11'
    pregunta: El hormigón endurece porque…
    opciones:
      - texto: Se seca al evaporarse el agua
        porque: Es el error típico. Fragua incluso bajo el agua, y si se seca antes de tiempo sale más débil.
      - texto: Se enfría
        porque: No hace falta calentarlo ni enfriarlo para que endurezca.
      - texto: El cemento reacciona químicamente con el agua
        correcta: true
        porque: Por eso se mantiene húmedo los primeros días, para que la reacción no se quede a medias.
      - texto: Los áridos se sueldan entre sí por difusión
        porque: Eso es sinterizar, en un horno y por debajo de la fusión; el hormigón fragua a temperatura ambiente y lo pega la pasta de cemento.

  # ── 12 · COMPUESTOS DE FIBRAS ──────────────────────────────────────
  # de: t10 «Reforzados con fibras»
  - id: fib-longitud-critica
    bloque: '12'
    pregunta: ¿Por qué una fibra tiene que ser más larga que su longitud crítica para llevar toda la carga que puede?
    opciones:
      - texto: Porque las fibras cortas tienen más grietas por unidad de longitud y rompen con menos carga
        porque: Lo de las grietas explica por qué una fibra fina resiste más que el material en bloque; la longitud crítica va de cómo le entra la carga.
      - texto: Porque la carga le entra por la superficie, y si es corta se sale antes de romperse
        correcta: true
        porque: La longitud crítica depende de la resistencia de la fibra, de su diámetro y de lo bien que se pegue a la matriz.
      - texto: Porque una fibra corta no se puede alinear con la carga dentro de la matriz
        porque: Las discontinuas también se pueden alinear.
      - texto: Porque una fibra corta pesa poco y no puede con su parte de la carga
        porque: El peso no es lo que decide; es cómo le entra la carga.

  # de: t10 «### La regla de las mezclas» y su ErrorTipico
  - id: fib-transversal
    bloque: '12'
    pregunta: En un compuesto de fibras continuas y alineadas, ¿cómo es la rigidez perpendicular a las fibras?
    opciones:
      - texto: La media de los módulos pesada con las fracciones de volumen, igual que a lo largo
        porque: Es el error típico; esa media solo vale en la dirección de las fibras.
      - texto: Mayor que a lo largo de las fibras
        porque: Es al revés. A lo largo es donde es máxima.
      - texto: Cercana a la de la matriz, aunque haya mucha fibra
        correcta: true
        porque: Perpendicular, las dos fases llevan la misma tensión y la matriz blanda se deforma casi sola.
      - texto: Igual a la de la fibra
        porque: Eso sería si no hubiera matriz.

  # de: t10 «### La regla de las mezclas» (la figura y su ErrorTipico)
  - id: fib-calculo-longitudinal
    bloque: '12'
    pregunta: Fibra de vidrio de 69 GPa en epoxi de 3,4 GPa, con un 50 % de fibra. ¿Cuánto vale el módulo en la dirección de las fibras?
    opciones:
      - texto: 6,5 GPa
        porque: Ese es el módulo perpendicular a las fibras, con la regla de las inversas.
      - texto: 34,5 GPa
        porque: Es solo la parte de la fibra, 0,5 por 69; falta sumar la de la matriz.
      - texto: 72,4 GPa
        porque: Es sumar los dos módulos sin pesarlos, y sale más rígido que la propia fibra.
      - texto: 36,2 GPa
        correcta: true
        porque: 0,5 por 69 más 0,5 por 3,4. Más de cinco veces el perpendicular.

  # de: t10 «Las matrices y la orientación de las fibras» (nuevo)
  - id: fib-matriz-ceramica
    bloque: '12'
    pregunta: En un compuesto de matriz cerámica, ¿para qué están las fibras?
    opciones:
      - texto: Para darle tenacidad, desviando o cosiendo las grietas
        correcta: true
        porque: Todo eso gasta energía, y el cerámico deja de romperse de golpe.
      - texto: Para darle la rigidez que a una matriz cerámica le falta frente a un metal
        porque: Un cerámico ya es rígido, a menudo más que un metal; lo que le falta es tenacidad.
      - texto: Para que el compuesto conduzca la electricidad
        porque: No están para eso; lo que le falta a un cerámico es tenacidad.
      - texto: Para que el cerámico se pueda fundir y moldear
        porque: Las fibras no vuelven fundible ni moldeable a un cerámico; están para darle tenacidad.

  # de: t10 «Las matrices y la orientación de las fibras» (nuevo)
  - id: fib-al-azar
    bloque: '12'
    pregunta: Fibras cortas orientadas al azar en un plano dan un compuesto…
    opciones:
      - texto: Tan rígido en todas las direcciones como el de fibras continuas en su dirección buena
        porque: En cada dirección solo trabaja una parte de las fibras.
      - texto: Igual en todas las direcciones del plano, pero menos rígido en cada una
        correcta: true
        porque: Solo una parte de las fibras apunta hacia donde va la carga; a cambio, es el más barato de fabricar.
      - texto: Rígido solo en una dirección
        porque: Eso es el de fibras alineadas.
      - texto: Sin ningún refuerzo, porque las fibras cortas no llevan carga
        porque: Si son más largas que la crítica, sí la llevan.

  # de: t10 ErrorTipico «Fibra de carbono es la mitad del material» (nuevo); t01 «Las cuatro familias»
  - id: fib-cuadro-de-carbono
    bloque: '12'
    pregunta: Un cuadro de bicicleta «de fibra de carbono» es…
    opciones:
      - texto: Un cerámico, porque lo que más se ve y lo que lo hace rígido son sus fibras
        porque: Un compuesto junta dos materiales distintos, cada uno en su fase, y se clasifica por eso, no por el que más se ve.
      - texto: Un polímero puro, porque la resina es lo que le da la forma
        porque: 'No es puro: lleva fibras, y la resina sola es mucho menos rígida; la rigidez la dan ellas.'
      - texto: Grafito macizo, mecanizado en forma de tubos
        porque: Las fibras están embebidas en una matriz, no forman un bloque.
      - texto: Un compuesto de fibras de carbono en una matriz, casi siempre de epoxi
        correcta: true
        porque: Las fibras dan la rigidez; la matriz las sujeta, les pasa la carga y decide hasta qué temperatura aguanta.
