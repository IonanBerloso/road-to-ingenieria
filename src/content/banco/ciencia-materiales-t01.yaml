asignatura: ciencia-materiales
tema: t01-introduccion
titulo: Cien preguntas del test de contenidos mínimos
fuente: >-
  Preguntas propias · Road to Ingeniería, escritas sobre el Tema 1 de Ciencia
  de Materiales (UPV/EHU, curso 2025-2026). NO son las del test: del examen
  real solo tenemos el del 27 de septiembre de 2024, que está transcrito entre
  los ejercicios del tema. Estas cien imitan su formato —cuatro opciones, una
  válida— y su reparto por bloques, para poder hacer simulacros distintos.
puntuacion:
  preguntas: 25
  minutos: 45
  acierto: 0.4
  fallo: -0.15
  aprueba: 5

# El reparto imita el del examen de 2024, contado pregunta a pregunta: de sus
# veinticinco, once iban de familias de materiales, cuatro de sólidos y
# cristalinidad, tres de enlaces, cuatro de niveles y definiciones y el resto
# repartido. Aquí hay cuarenta de familias sobre cien, y el simulador saca
# esa misma proporción: un simulacro que reparta al azar entrena un examen
# que no existe.

preguntas:
  # ── FAMILIAS DE MATERIALES ─────────────────────────────────────────
  - id: fam-propiedades-metales
    bloque: familias
    pregunta: Conducen bien el calor y la electricidad, son dúctiles y reflejan la luz. ¿De qué familia se habla?
    opciones:
      - texto: Metales
        correcta: true
        porque: Las cuatro a la vez solo las reúnen los metales.
      - texto: Cerámicos
        porque: Los cerámicos son aislantes y frágiles, justo lo contrario.
      - texto: Polímeros
        porque: Los polímeros conducen poco y no reflejan la luz.
      - texto: Compuestos
        porque: Un compuesto hereda las propiedades de sus componentes; no tiene una lista propia.

  - id: fam-propiedades-ceramicos
    bloque: familias
    pregunta: Aislantes del calor y la electricidad, resisten altas temperaturas, duros y frágiles. ¿Qué familia es?
    opciones:
      - texto: Cerámicos
        correcta: true
        porque: Es la definición del tema, con sus cuatro rasgos.
      - texto: Metales
        porque: Los metales conducen y son dúctiles, no frágiles.
      - texto: Polímeros
        porque: Los polímeros no resisten altas temperaturas; es lo que peor llevan.
      - texto: Semiconductores
        porque: Los semiconductores se definen por su conductividad intermedia, no por dureza.

  - id: fam-propiedades-polimeros
    bloque: familias
    pregunta: Ligeros y flexibles, conducen poco y resisten la corrosión. ¿Qué familia es?
    opciones:
      - texto: Polímeros
        correcta: true
        porque: Los tres rasgos del tema, y el de la corrosión es el que los distingue de los metales.
      - texto: Cerámicos
        porque: Los cerámicos son duros y frágiles, no flexibles.
      - texto: Metales
        porque: Los metales conducen bien y se corroen.
      - texto: Compuestos
        porque: Un compuesto no tiene propiedades de familia propias.

  - id: fam-enlace-de-los-metales
    bloque: familias
    pregunta: ¿Qué enlace tienen los materiales metálicos?
    opciones:
      - texto: Metálico
        correcta: true
        porque: Cationes en una nube de electrones libres.
      - texto: Iónico
        porque: El iónico es entre un metal y un no metal, no entre metales.
      - texto: Covalente
        porque: El covalente es entre no metales.
      - texto: Van der Waals
        porque: Es un enlace secundario, entre moléculas, y mucho más débil.

  - id: fam-enlace-de-los-ceramicos
    bloque: familias
    pregunta: ¿Qué enlace tienen los materiales cerámicos?
    opciones:
      - texto: Iónico y/o covalente
        correcta: true
        porque: 'El tema lo dice así, con la barra: puede ser uno, otro o los dos.'
      - texto: Solo iónico
        porque: El «solo» lo hace falso; muchos cerámicos tienen carácter covalente.
      - texto: Metálico
        porque: Si tuvieran enlace metálico conducirían, y los cerámicos son aislantes.
      - texto: Solo covalente
        porque: Mismo problema que el «solo iónico» por el otro lado.

  - id: fam-enlace-de-los-polimeros
    bloque: familias
    pregunta: ¿Qué enlace predomina en los polímeros?
    opciones:
      - texto: Covalente, sobre todo entre carbono e hidrógeno
        correcta: true
        porque: Son macromoléculas de cadenas carbonadas unidas covalentemente.
      - texto: Iónico
        porque: No hay cesión de electrones entre metal y no metal.
      - texto: Metálico
        porque: No hay metales ni electrones libres; por eso no conducen.
      - texto: Puentes de hidrógeno dentro de la cadena
        porque: Los puentes de hidrógeno actúan entre cadenas, no las forman.

  - id: fam-que-es-un-composite
    bloque: familias
    pregunta: ¿Qué define a un material compuesto o composite?
    opciones:
      - texto: Que tiene más de una fase y sus propiedades salen de las de sus componentes
        correcta: true
        porque: 'Es la definición del tema: dos o más materiales juntos.'
      - texto: Que está formado por más de un elemento químico
        porque: Entonces el latón o la sílice serían compuestos, y no lo son.
      - texto: Que se fabrica mezclando polvos y calentando
        porque: Eso describe un proceso de sinterizado, que también usan los cerámicos.
      - texto: Que tiene propiedades mejores que cualquiera de sus componentes
        porque: Suele ser el objetivo, pero no es la definición y no siempre ocurre.

  - id: fam-clasificar-bronce
    bloque: familias
    pregunta: El bronce es un material…
    opciones:
      - texto: Metálico
        correcta: true
        porque: Es una aleación de cobre y estaño; una aleación sigue siendo un metal.
      - texto: Compuesto
        porque: Una aleación es una sola fase mezclada a nivel atómico, no dos materiales juntos.
      - texto: Cerámico
        porque: No hay no metales en su composición.
      - texto: Polimérico
        porque: No hay cadenas de carbono.

  - id: fam-clasificar-vidrio
    bloque: familias
    pregunta: El vidrio es un material…
    opciones:
      - texto: Cerámico
        correcta: true
        porque: El tema lo lista entre los cerámicos, junto con la arcilla y el cemento.
      - texto: Polimérico
        porque: No tiene cadenas carbonadas.
      - texto: Metálico
        porque: Ni conduce ni es dúctil.
      - texto: Compuesto
        porque: Es una sola fase, aunque sea amorfa.

  - id: fam-clasificar-madera
    bloque: familias
    pregunta: La madera, en la clasificación del tema, es un material…
    opciones:
      - texto: Compuesto
        correcta: true
        porque: Fibras de celulosa en una matriz de lignina; dos fases y propiedades heredadas.
      - texto: Polimérico
        porque: Sus componentes son polímeros, pero la madera es los dos juntos.
      - texto: Cerámico
        porque: No hay enlace iónico ni óxidos.
      - texto: Natural, y por eso no entra en la clasificación
        porque: Natural o sintético es otra forma de clasificar, que no choca con esta.

  - id: fam-clasificar-poliestireno
    bloque: familias
    pregunta: El poliestireno es un material…
    opciones:
      - texto: Polimérico
        correcta: true
        porque: 'El «poli-» del nombre lo dice: cadenas de monómeros de estireno.'
      - texto: Cerámico
        porque: No hay metales ni óxidos.
      - texto: Compuesto
        porque: Es un solo material, de una fase.
      - texto: Metálico
        porque: No conduce ni es dúctil.

  - id: fam-clasificar-alumina
    bloque: familias
    pregunta: La alúmina, Al₂O₃, es un material…
    opciones:
      - texto: Cerámico
        correcta: true
        porque: Es un óxido, o sea metal más no metal; los óxidos son cerámicos.
      - texto: Metálico
        porque: 'Lleva aluminio, pero unido a oxígeno: eso ya no es un metal.'
      - texto: Compuesto
        porque: «Compuesto químico» y «material compuesto» no son lo mismo.
      - texto: Semiconductor
        porque: La alúmina es aislante, no semiconductora.

  - id: fam-clasificar-hormigon
    bloque: familias
    pregunta: El hormigón es un ejemplo de material…
    opciones:
      - texto: Compuesto
        correcta: true
        porque: 'Áridos embebidos en una matriz de cemento: dos fases.'
      - texto: Cerámico
        porque: El cemento lo es, pero el hormigón entero es cemento más áridos.
      - texto: Metálico
        porque: Solo lleva metal si está armado, y entonces sigue siendo compuesto.
      - texto: Polimérico
        porque: No hay cadenas de carbono.

  - id: fam-clasificar-fibra-vidrio
    bloque: familias
    pregunta: Una resina de poliéster reforzada con fibra de vidrio es…
    opciones:
      - texto: Un compuesto, de matriz polimérica y refuerzo cerámico
        correcta: true
        porque: Matriz más refuerzo, y cada uno de una familia distinta.
      - texto: Un polímero, porque la matriz manda
        porque: 'La matriz no manda: lo que define al compuesto es que haya dos fases.'
      - texto: Un cerámico, porque la fibra de vidrio lo es
        porque: Mismo error al revés.
      - texto: Una aleación
        porque: Una aleación es de metales y se mezcla a nivel atómico.

  - id: fam-criterio-de-clasificacion
    bloque: familias
    pregunta: ¿En base a qué se clasifican los materiales en metales, cerámicos y polímeros?
    opciones:
      - texto: A su estructura atómica y su composición química
        correcta: true
        porque: Es el criterio del tema, y explica por qué el latón y el acero caen juntos.
      - texto: A su dureza
        porque: La dureza es una consecuencia; hay cerámicos blandos y metales durísimos.
      - texto: A su resistencia mecánica
        porque: 'Mismo problema: es una propiedad, no el criterio.'
      - texto: A su aplicación
        porque: El mismo material sirve para cosas distintas y no cambia de familia.

  - id: fam-cual-no-es-ceramico
    bloque: familias
    pregunta: ¿Cuál de estos NO es un material cerámico?
    opciones:
      - texto: Polietileno
        correcta: true
        porque: 'Es un polímero: cadenas de carbono e hidrógeno.'
      - texto: Sílice
        porque: Es un óxido, el cerámico más común.
      - texto: Carburo de silicio
        porque: Los carburos son cerámicos.
      - texto: Nitruro de boro
        porque: Los nitruros son cerámicos.

  - id: fam-cual-no-es-metal
    bloque: familias
    pregunta: ¿Cuál de estos NO es un material metálico?
    opciones:
      - texto: Grafito
        correcta: true
        porque: Es carbono puro con enlace covalente; conduce, pero no es un metal.
      - texto: Latón
        porque: Aleación de cobre y cinc.
      - texto: Acero
        porque: Aleación de hierro y carbono.
      - texto: Wolframio
        porque: Metal puro, y de los más duros y refractarios que hay.

  - id: fam-polimerizacion
    bloque: familias
    pregunta: ¿Qué es la polimerización?
    opciones:
      - texto: El encadenamiento de monómeros en macromoléculas
        correcta: true
        porque: 'Es la definición del tema: moléculas pequeñas que se encadenan.'
      - texto: El calentamiento de un polímero hasta que se ablanda
        porque: Eso es fundir o reblandecer, no polimerizar.
      - texto: La mezcla de dos polímeros distintos
        porque: Eso sería una mezcla o un compuesto.
      - texto: La cristalización de las cadenas de un plástico
        porque: Eso ocurre después, y explica la transparencia, no la formación.

  - id: fam-transparencia-polimeros
    bloque: familias
    pregunta: ¿De qué depende que un polímero sea opaco o transparente?
    opciones:
      - texto: De su cristalinidad
        correcta: true
        porque: 'Es el mismo mecanismo que la alúmina: lo óptico lo decide el orden interno.'
      - texto: De la longitud de sus cadenas
        porque: La longitud cambia la resistencia y la viscosidad, no la transparencia.
      - texto: De si tiene electrones deslocalizados
        porque: Los polímeros no los tienen; sus electrones están localizados en los enlaces.
      - texto: Del color de su monómero
        porque: El color y la transparencia son cosas distintas.

  - id: fam-metales-aleaciones
    bloque: familias
    pregunta: Las aleaciones metálicas…
    opciones:
      - texto: Siguen siendo materiales metálicos, con enlace metálico
        correcta: true
        porque: Mezclar dos metales no cambia el tipo de enlace.
      - texto: Son materiales compuestos, porque tienen dos componentes
        porque: Se mezclan a nivel atómico y forman una sola fase; un compuesto tiene fases separadas.
      - texto: Pierden la conductividad de los metales puros
        porque: La bajan un poco, pero siguen conduciendo.
      - texto: Pasan a tener enlace iónico
        porque: Haría falta un no metal que aceptara electrones.

  - id: fam-ejemplo-metal-ceramico-polimero
    bloque: familias
    pregunta: ¿Qué trío tiene un metal, un cerámico y un polímero, por ese orden?
    opciones:
      - texto: Titanio, sílice, polipropileno
        correcta: true
        porque: Metal puro, óxido cerámico y polímero. Uno de cada.
      - texto: Acero, latón, níquel
        porque: Los tres metálicos.
      - texto: Vidrio, cuarzo, diamante
        porque: Los tres cerámicos o covalentes.
      - texto: Celulosa, caucho, epoxi
        porque: Los tres poliméricos.

  - id: fam-uso-cobre
    bloque: familias
    pregunta: El cobre se usa en cables eléctricos por…
    opciones:
      - texto: Su conductividad eléctrica y su ductilidad
        correcta: true
        porque: 'Las dos que da la tabla de aplicaciones del tema: conducir y poder estirarse en hilo.'
      - texto: Su dureza y su resistencia al desgaste
        porque: Eso es lo que decide el acero para herramientas.
      - texto: Su biocompatibilidad
        porque: Eso es lo del titanio en prótesis.
      - texto: Su transparencia
        porque: Un metal no es transparente.

  - id: fam-uso-titanio
    bloque: familias
    pregunta: El titanio se usa en prótesis por…
    opciones:
      - texto: Biocompatibilidad, resistencia y ligereza
        correcta: true
        porque: Las tres de la tabla del tema.
      - texto: Su conductividad
        porque: No es lo que se busca en una prótesis.
      - texto: Su bajo coste
        porque: El titanio es caro; se usa a pesar de eso.
      - texto: Su transparencia a los rayos X
        porque: No lo es, y no es el criterio.

  - id: fam-uso-superaleaciones
    bloque: familias
    pregunta: Las superaleaciones de níquel se usan en aeroespacial porque combinan…
    opciones:
      - texto: Resistencia, baja densidad y aguante a alta temperatura
        correcta: true
        porque: Las tres del tema, y es el ejemplo de por qué hacen falta materiales nuevos.
      - texto: Conductividad y ductilidad
        porque: Eso es el cobre en cables.
      - texto: Transparencia y aislamiento
        porque: Eso es el vidrio en ventanas.
      - texto: Dureza y bajo coste
        porque: Una superaleación no es barata.

  - id: fam-uso-polietileno
    bloque: familias
    pregunta: El polietileno se usa en film de embalaje por…
    opciones:
      - texto: Transparencia y flexibilidad
        correcta: true
        porque: Las dos de la tabla del tema.
      - texto: Dureza y resistencia al desgaste
        porque: Eso descarta un film.
      - texto: Conductividad térmica
        porque: Los polímeros aíslan, y para un film no es el criterio.
      - texto: Resistencia a altas temperaturas
        porque: Es justo lo que peor llevan los polímeros.

  - id: fam-cuatro-criterios
    bloque: familias
    pregunta: Según el tema, ¿cuáles son los criterios para elegir un material?
    opciones:
      - texto: Condiciones de uso, propiedades, degradación y coste
        correcta: true
        porque: Los cuatro del tema, y el coste es el que más se olvida.
      - texto: Dureza, densidad, conductividad y precio
        porque: Son propiedades concretas, no los criterios generales.
      - texto: Composición, estructura, procesado y comportamiento
        porque: Eso es la cadena de la asignatura, no los criterios de elección.
      - texto: Resistencia, ligereza, disponibilidad y estética
        porque: Mezcla propiedades con otras cosas y deja fuera la degradación.

  - id: fam-degradacion
    bloque: familias
    pregunta: Al elegir un material hay que tener en cuenta su degradación porque…
    opciones:
      - texto: Sus propiedades cambian durante la vida útil
        correcta: true
        porque: Un material que se corroe o envejece deja de cumplir lo que se le pedía.
      - texto: Los materiales degradados son más baratos
        porque: El coste es otro criterio distinto.
      - texto: La degradación mejora la resistencia
        porque: Es lo contrario.
      - texto: Es un requisito legal
        porque: Puede serlo, pero el tema lo plantea como criterio técnico.

  - id: fam-por-que-nuevos-materiales
    bloque: familias
    pregunta: ¿Cuál NO es una razón que el tema dé para necesitar materiales nuevos?
    opciones:
      - texto: Porque los materiales clásicos se están agotando
        correcta: true
        porque: El tema no dice eso. Habla de innovación, energías nuevas, mejor uso y contaminación.
      - texto: Porque las energías nuevas no existen sin ellos
        porque: Sí lo dice, con las células solares como ejemplo.
      - texto: Porque un vehículo más ligero rinde más
        porque: Sí lo dice, como ejemplo de usar mejor lo que ya existe.
      - texto: Porque fabricarlos contamina y hay que medirlo
        porque: Es la cuarta razón del tema.

  - id: fam-semiconductores-familia
    bloque: familias
    pregunta: Los semiconductores, en la clasificación del tema…
    opciones:
      - texto: Están fuera de las cuatro familias, entre los materiales avanzados
        correcta: true
        porque: El tema los pone en el cajón de avanzados, con los biomateriales.
      - texto: Son una quinta familia clásica
        porque: Las familias clásicas son cuatro.
      - texto: Son un tipo de cerámico
        porque: El silicio no es un óxido ni un compuesto metal-no metal.
      - texto: Son un tipo de metal
        porque: Su conductividad está entre la de un conductor y la de un aislante.

  - id: fam-biomateriales
    bloque: familias
    pregunta: ¿Cuál de estos es un biomaterial de los que cita el tema?
    opciones:
      - texto: Celulosa
        correcta: true
        porque: El tema cita la celulosa y el quitosano.
      - texto: Silicio
        porque: Es el semiconductor del tema.
      - texto: Acero inoxidable
        porque: Se usa en medicina, pero el tema no lo lista como biomaterial.
      - texto: Alúmina
        porque: Es el cerámico del ejemplo de la transparencia.

  - id: fam-otras-clasificaciones
    bloque: familias
    pregunta: Además de por estructura y composición, ¿cómo más se pueden clasificar los materiales?
    opciones:
      - texto: Por su origen, natural o sintético, y por la propiedad para la que se usan
        correcta: true
        porque: Las dos que cita el tema, y dice que no chocan con la clasificación principal.
      - texto: Solo por su dureza
        porque: La dureza no da una clasificación completa.
      - texto: Por su precio de mercado
        porque: El tema no lo plantea como clasificación.
      - texto: Por el país donde se fabrican
        porque: No tiene que ver con el material.

  - id: fam-ceramicos-cristalinos
    bloque: familias
    pregunta: Sobre la cristalinidad de los cerámicos, es cierto que…
    opciones:
      - texto: Pueden ser cristalinos o no, y el vidrio es el caso no cristalino
        correcta: true
        porque: El tema dice «cristalinos o no» justamente por el vidrio.
      - texto: Todos son cristalinos
        porque: El vidrio es cerámico y amorfo.
      - texto: Ninguno es cristalino
        porque: La mayoría lo son.
      - texto: Solo son cristalinos los que llevan metales
        porque: No es el criterio; la sílice cristalina es cuarzo y la amorfa es vidrio.

  - id: fam-polimeros-cristalinidad
    bloque: familias
    pregunta: Sobre la cristalinidad de los polímeros, el tema dice que son…
    opciones:
      - texto: Semicristalinos o amorfos
        correcta: true
        porque: 'Nunca totalmente cristalinos: las cadenas largas lo impiden.'
      - texto: Siempre cristalinos
        porque: Las cadenas largas no se ordenan del todo.
      - texto: Siempre amorfos
        porque: Muchos tienen zonas cristalinas; de ahí «semicristalinos».
      - texto: Cristalinos solo al calentarlos
        porque: Calentar suele desordenarlos más, no ordenarlos.

  - id: fam-metales-cristalinos
    bloque: familias
    pregunta: Los metales, en cuanto a estructura, son…
    opciones:
      - texto: Cristalinos
        correcta: true
        porque: El tema los define como cristalinos, y por eso el aluminio tiene red cúbica.
      - texto: Amorfos
        porque: Existen metales amorfos de laboratorio, pero no es lo que el tema dice.
      - texto: Semicristalinos
        porque: Ese término es el de los polímeros.
      - texto: Depende de la aleación, y la mitad son amorfos
        porque: Las aleaciones comunes son igualmente cristalinas.

  - id: fam-composites-cuatro-unidades
    bloque: familias
    pregunta: ¿Por qué el tema dice que los compuestos no son una familia «en el mismo sentido» que las otras tres?
    opciones:
      - texto: Porque son dos o más materiales juntos, no un tipo de material
        correcta: true
        porque: Su definición es estructural, no de composición o enlace.
      - texto: Porque son más modernos
        porque: El hormigón y la madera no tienen nada de modernos.
      - texto: Porque no se estudian en la asignatura
        porque: Se estudian, y tienen una unidad propia al final del curso.
      - texto: Porque no tienen aplicaciones industriales
        porque: Tienen muchísimas; la fibra de carbono es una.

  - id: fam-que-decide-acero-herramientas
    bloque: familias
    pregunta: El acero se usa en herramientas por…
    opciones:
      - texto: Dureza, tenacidad y resistencia al desgaste
        correcta: true
        porque: Las tres de la tabla de aplicaciones del tema.
      - texto: Ligereza y transparencia
        porque: Ni una cosa ni la otra.
      - texto: Conductividad térmica
        porque: No es lo que decide una herramienta de corte.
      - texto: Biocompatibilidad
        porque: Eso es el titanio en prótesis.

  - id: fam-vidrio-ventanas
    bloque: familias
    pregunta: El vidrio se usa en ventanas por…
    opciones:
      - texto: Transparencia y ser aislante
        correcta: true
        porque: Las dos de la tabla del tema.
      - texto: Ductilidad
        porque: El vidrio es frágil; no se deforma, se rompe.
      - texto: Conductividad eléctrica
        porque: Es aislante, y es justo lo que se busca.
      - texto: Resistencia al impacto
        porque: Es de lo peor que tiene.

  - id: fam-cual-conduce
    bloque: familias
    pregunta: De estos cuatro materiales, ¿cuál conduce bien la electricidad?
    opciones:
      - texto: Aluminio
        correcta: true
        porque: Es un metal, y los metales tienen electrones libres.
      - texto: Alúmina
        porque: Es un cerámico aislante, aunque el nombre se parezca.
      - texto: Polietileno
        porque: Polímero, aislante.
      - texto: Vidrio
        porque: Cerámico, aislante.

  - id: fam-alumina-vs-aluminio
    bloque: familias
    pregunta: El aluminio y la alúmina…
    opciones:
      - texto: Son de familias distintas; uno es metal y la otra cerámico
        correcta: true
        porque: 'La alúmina es Al₂O₃, un óxido: metal más no metal.'
      - texto: Son el mismo material con dos nombres
        porque: Uno es el metal puro y la otra su óxido.
      - texto: Son los dos metales, y la alúmina es una aleación
        porque: Una aleación es de metales; el oxígeno no lo es.
      - texto: Son los dos cerámicos
        porque: El aluminio puro es un metal.

  - id: fam-elegir-equilibrio
    bloque: familias
    pregunta: Al elegir las propiedades que debe tener un material, el tema avisa de que…
    opciones:
      - texto: Casi siempre es un equilibrio entre varias, no una sola
        correcta: true
        porque: Lo dice literalmente, y es lo que hace difícil la elección.
      - texto: Siempre manda la resistencia mecánica
        porque: Depende de la aplicación; en un film manda la flexibilidad.
      - texto: Basta con optimizar la más importante
        porque: Es justo lo que el tema desaconseja.
      - texto: Las propiedades no se pueden comparar entre sí
        porque: Se comparan constantemente; de eso va elegir.

  # ── ENLACES ────────────────────────────────────────────────────────
  - id: enl-ionico-entre-quien
    bloque: enlaces
    pregunta: El enlace iónico se forma entre…
    opciones:
      - texto: Un metal y un no metal
        correcta: true
        porque: El metal cede electrones y el no metal los acepta.
      - texto: Dos no metales
        porque: Eso da un enlace covalente.
      - texto: Dos metales
        porque: Eso da un enlace metálico.
      - texto: Dos moléculas
        porque: Entre moléculas actúan los enlaces secundarios.

  - id: enl-covalente-electrones
    bloque: enlaces
    pregunta: En el enlace covalente, los electrones…
    opciones:
      - texto: Se comparten entre los dos átomos
        correcta: true
        porque: Ninguno los atrae lo bastante como para arrancárselos al otro.
      - texto: Los cede uno y los acepta el otro
        porque: Eso es el iónico.
      - texto: Quedan libres en una nube
        porque: Eso es el metálico.
      - texto: Saltan de un átomo a otro alternativamente
        porque: No es así como se describe ningún enlace del tema.

  - id: enl-metalico-nube
    bloque: enlaces
    pregunta: En el enlace metálico, la nube de electrones rodea a…
    opciones:
      - texto: Cationes
        correcta: true
        porque: Los átomos ceden electrones a la nube, así que quedan positivos.
      - texto: Aniones
        porque: 'Es la trampa clásica: si fueran negativos, se repelerían con la nube.'
      - texto: Átomos neutros
        porque: Al ceder sus electrones dejan de ser neutros.
      - texto: Moléculas
        porque: En un metal no hay moléculas separadas.

  - id: enl-que-decide
    bloque: enlaces
    pregunta: ¿Qué propiedad de los átomos decide qué tipo de enlace se forma?
    opciones:
      - texto: La electronegatividad
        correcta: true
        porque: Es la tendencia a atraer electrones, y de su diferencia sale el tipo de enlace.
      - texto: El peso atómico
        porque: No interviene en el tipo de enlace.
      - texto: El radio atómico
        porque: Influye en la estructura, no en el tipo de enlace.
      - texto: El punto de fusión
        porque: Es una consecuencia del enlace, no su causa.

  - id: enl-electronegatividad-ionico
    bloque: enlaces
    pregunta: Un átomo que retiene poco los electrones frente a otro que los atrae mucho forma…
    opciones:
      - texto: Un enlace iónico
        correcta: true
        porque: La diferencia grande hace que uno los ceda del todo.
      - texto: Un enlace covalente
        porque: El covalente sale cuando los dos los atraen parecido.
      - texto: Un enlace metálico
        porque: El metálico sale cuando muchos átomos los retienen poco.
      - texto: Un puente de hidrógeno
        porque: Es un enlace secundario, entre moléculas ya formadas.

  - id: enl-primarios-vs-secundarios
    bloque: enlaces
    pregunta: La diferencia entre enlaces primarios y secundarios es que…
    opciones:
      - texto: Los primarios unen átomos y los secundarios moléculas, y son mucho más débiles
        correcta: true
        porque: Intramoleculares frente a intermoleculares, y esa diferencia de fuerza lo explica todo.
      - texto: Los primarios son más antiguos en la teoría
        porque: No es una cuestión histórica.
      - texto: Los secundarios solo se dan en los metales
        porque: Se dan sobre todo en moleculares, como el hielo.
      - texto: Los secundarios son más fuertes
        porque: Es al revés, y por eso el hielo funde a cero grados.

  - id: enl-van-der-waals
    bloque: enlaces
    pregunta: Las fuerzas de Van der Waals aparecen porque…
    opciones:
      - texto: Los electrones de una molécula sin carga neta pueden repartirse de forma desigual y formar un dipolo
        correcta: true
        porque: Y dos dipolos bien orientados se atraen. Es la definición del tema.
      - texto: Las moléculas tienen carga neta y se atraen
        porque: Si tuvieran carga neta serían iones, y sería enlace iónico.
      - texto: Los átomos comparten electrones entre moléculas
        porque: Compartir es covalente, y eso es intramolecular.
      - texto: El hidrógeno se une a un átomo electronegativo
        porque: Eso es el puente de hidrógeno, que es el otro secundario.

  - id: enl-puente-hidrogeno
    bloque: enlaces
    pregunta: Un puente de hidrógeno se forma cuando un hidrógeno está unido a…
    opciones:
      - texto: Nitrógeno, oxígeno o flúor
        correcta: true
        porque: Los tres muy electronegativos que cita el tema.
      - texto: Carbono
        porque: El carbono no es lo bastante electronegativo.
      - texto: Cualquier metal
        porque: Con un metal el hidrógeno no forma ese tipo de puente.
      - texto: Otro hidrógeno
        porque: Dos hidrógenos forman una molécula, no un puente.

  - id: enl-agua-que-la-une
    bloque: enlaces
    pregunta: ¿Qué mantiene unidas entre sí las moléculas de agua?
    opciones:
      - texto: Puentes de hidrógeno
        correcta: true
        porque: Es el ejemplo del tema, y explica que el hielo sea un sólido molecular.
      - texto: Enlaces covalentes
        porque: El covalente une el oxígeno con sus hidrógenos dentro de la molécula.
      - texto: Enlaces iónicos
        porque: El agua no está hecha de iones colocados en una red.
      - texto: Enlace metálico
        porque: No hay metales ni electrones libres.

  - id: enl-nacl
    bloque: enlaces
    pregunta: El cloruro sódico, NaCl, tiene enlace…
    opciones:
      - texto: Iónico
        correcta: true
        porque: Sodio metal cede y cloro no metal acepta. Es el ejemplo del tema.
      - texto: Covalente
        porque: Haría falta que los dos fueran no metales.
      - texto: Metálico
        porque: El cloro no es un metal.
      - texto: De Van der Waals
        porque: Ese es secundario y no forma la red de la sal.

  - id: enl-diamante
    bloque: enlaces
    pregunta: El diamante tiene enlace…
    opciones:
      - texto: Covalente
        correcta: true
        porque: Carbono con carbono, compartiendo electrones en una red continua.
      - texto: Iónico
        porque: Es un solo elemento; no hay quien ceda ni quien acepte.
      - texto: Metálico
        porque: El carbono no es un metal y el diamante no conduce.
      - texto: Molecular
        porque: Molecular es un tipo de sólido, no de enlace, y el diamante no tiene moléculas sueltas.

  - id: enl-metano
    bloque: enlaces
    pregunta: El metano, CH₄, tiene enlace…
    opciones:
      - texto: Covalente
        correcta: true
        porque: Carbono e hidrógeno, dos no metales que comparten.
      - texto: Iónico
        porque: No hay ningún metal que ceda electrones; carbono e hidrógeno son no metales.
      - texto: Metálico
        porque: No hay metal ni electrones libres.
      - texto: Iónico dentro y covalente fuera
        porque: No existe esa combinación.

  # ── CRISTALINO Y AMORFO ────────────────────────────────────────────
  - id: cri-definicion-cristalino
    bloque: cristalino
    pregunta: Un sólido es cristalino cuando…
    opciones:
      - texto: Sus partículas se ordenan con un orden de largo alcance
        correcta: true
        porque: El mismo patrón se repite a lo largo de todo el material.
      - texto: Es transparente
        porque: El hierro es cristalino y opaco.
      - texto: Es duro
        porque: La dureza no tiene que ver con el orden.
      - texto: Tiene forma geométrica a simple vista
        porque: Eso es la macroestructura; un metal cristalino no parece un cristal.

  - id: cri-definicion-amorfo
    bloque: cristalino
    pregunta: Un sólido amorfo…
    opciones:
      - texto: Solo tiene orden de corto alcance, entre vecinos
        correcta: true
        porque: No hay un patrón que se repita por todo el material.
      - texto: No tiene forma definida
        porque: «Amorfo» habla del orden interno, no de la forma exterior.
      - texto: Es siempre blando
        porque: El vidrio es amorfo y es rígido.
      - texto: Tiene varias fases
        porque: Eso es otra cosa; un amorfo puede ser de una sola fase.

  - id: cri-ejemplo-amorfo
    bloque: cristalino
    pregunta: El ejemplo de sólido amorfo que da el tema es…
    opciones:
      - texto: El vidrio
        correcta: true
        porque: Es el amorfo de todos los exámenes.
      - texto: El cuarzo
        porque: El cuarzo es sílice cristalina; el vidrio es la misma sílice desordenada.
      - texto: El hierro
        porque: Metal, cristalino.
      - texto: El diamante
        porque: Red covalente perfectamente ordenada.

  - id: cri-orden-largo-alcance
    bloque: cristalino
    pregunta: «Orden de largo alcance» significa que…
    opciones:
      - texto: El mismo patrón se repite a lo largo de todo el material
        correcta: true
        porque: Es lo que distingue cristalino de amorfo.
      - texto: Los átomos están muy separados
        porque: No habla de distancias sino de repetición.
      - texto: El material es muy grande
        porque: Un cristal microscópico también tiene orden de largo alcance.
      - texto: Hay orden solo entre átomos vecinos
        porque: Eso es orden de corto alcance, el del amorfo.

  - id: cri-microscopia-ordenada
    bloque: cristalino
    pregunta: Al microscopio se ve que la estructura de un material es ordenada. Entonces es…
    opciones:
      - texto: Cristalino
        correcta: true
        porque: Ordenado es cristalino, por definición.
      - texto: Amorfo
        porque: Amorfo es lo contrario.
      - texto: Perfecto
        porque: Cristalino no quiere decir sin defectos.
      - texto: Compuesto
        porque: Compuesto va de fases, no de orden.

  - id: cri-cuarzo-vs-vidrio
    bloque: cristalino
    pregunta: El cuarzo y el vidrio pueden tener la misma composición y aun así…
    opciones:
      - texto: Uno es cristalino y el otro amorfo
        correcta: true
        porque: 'Es otro caso de «la composición no decide»: lo que cambia es el orden.'
      - texto: Uno es metal y el otro cerámico
        porque: Los dos son cerámicos.
      - texto: Uno es compuesto y el otro no
        porque: Ninguno de los dos es un material compuesto.
      - texto: Tienen enlaces distintos
        porque: El enlace es el mismo; lo que cambia es cómo se ordena.

  - id: cri-metales-son
    bloque: cristalino
    pregunta: Los materiales metálicos, en cuanto al orden interno, son…
    opciones:
      - texto: Cristalinos
        correcta: true
        porque: Y por eso tiene sentido hablar de la red cúbica del aluminio.
      - texto: Amorfos
        porque: No es lo que dice el tema.
      - texto: Unos sí y otros no, a partes iguales
        porque: El tema los define como cristalinos sin matices.
      - texto: Cristalinos solo si son puros
        porque: Las aleaciones también lo son.

  - id: cri-mayoria-ceramicos
    bloque: cristalino
    pregunta: ¿Qué afirmación sobre la cristalinidad es correcta?
    opciones:
      - texto: La mayor parte de los cerámicos son cristalinos, pero el vidrio no
        correcta: true
        porque: Por eso el tema dice «cristalinos o no» al describirlos.
      - texto: Todos los cerámicos son amorfos
        porque: 'Es al revés: la mayoría son cristalinos.'
      - texto: Los polímeros son totalmente cristalinos
        porque: Son semicristalinos o amorfos.
      - texto: Los compuestos son siempre amorfos
        porque: Depende de sus componentes.

  - id: cri-defectos
    bloque: cristalino
    pregunta: Un material cristalino con defectos en su red…
    opciones:
      - texto: Sigue siendo cristalino
        correcta: true
        porque: Cristalino es tener orden de largo alcance, no ser perfecto.
      - texto: Pasa a ser amorfo
        porque: Haría falta perder el orden en todo el material.
      - texto: Pasa a ser un compuesto
        porque: Un defecto no crea una segunda fase.
      - texto: Deja de tener propiedades definidas
        porque: Los defectos precisamente ajustan las propiedades; es el tema 3.

  - id: cri-que-nivel
    bloque: cristalino
    pregunta: Que un material sea cristalino o amorfo se decide en el nivel…
    opciones:
      - texto: Atómico
        correcta: true
        porque: Es cómo se ordenan los átomos en el espacio.
      - texto: Subatómico
        porque: Ahí se decide el enlace, no el orden.
      - texto: Microscópico
        porque: Ahí se ven granos y fases, que es un paso más arriba.
      - texto: Macroscópico
        porque: A simple vista no se distingue.

  - id: cri-transparencia-no-implica
    bloque: cristalino
    pregunta: ¿Es cierto que los materiales cristalinos son generalmente transparentes?
    opciones:
      - texto: No, la mayoría de los metales son cristalinos y opacos
        correcta: true
        porque: 'Es una opción trampa del examen de 2024: mezcla una definición buena con una falsedad.'
      - texto: Sí, el orden interno deja pasar la luz
        porque: El hierro es cristalino y no se ve a través de él.
      - texto: Sí, salvo en los polímeros
        porque: El contraejemplo son los metales.
      - texto: Solo si además son duros
        porque: La dureza no tiene nada que ver.

  - id: cri-sinterizado-alumina
    bloque: cristalino
    pregunta: La alúmina calentada sin aditivo sale opaca porque…
    opciones:
      - texto: Quedan poros con aire entre los granos
        correcta: true
        porque: Es el ejemplo del tema, y ocurre a nivel microscópico.
      - texto: Su estructura pasa a ser amorfa
        porque: No es cuestión de orden atómico sino de poros.
      - texto: Cambia su composición química
        porque: La composición es prácticamente la misma.
      - texto: El aluminio se oxida
        porque: La alúmina ya es el óxido.

  # ── TIPOS DE SÓLIDOS ───────────────────────────────────────────────
  - id: sol-hielo-molecular
    bloque: solidos
    pregunta: El hielo es un sólido…
    opciones:
      - texto: Molecular
        correcta: true
        porque: Lo que une el sólido son puentes de hidrógeno entre moléculas de agua.
      - texto: Covalente
        porque: El covalente es el enlace de dentro de cada molécula, no el que une el sólido.
      - texto: Iónico
        porque: No está hecho de iones en una red.
      - texto: Metálico
        porque: No hay metales.

  - id: sol-diamante-covalente
    bloque: solidos
    pregunta: El diamante es un sólido…
    opciones:
      - texto: Covalente
        correcta: true
        porque: Todos sus átomos están unidos covalentemente en una red continua.
      - texto: Molecular
        porque: No hay moléculas separadas que unir.
      - texto: Iónico
        porque: Un solo elemento no forma iones de signos distintos.
      - texto: Metálico
        porque: No conduce como un metal.

  - id: sol-cual-mantiene-unido
    bloque: solidos
    pregunta: Lo que clasifica a un sólido cristalino es…
    opciones:
      - texto: La fuerza que mantiene unidas sus partículas
        correcta: true
        porque: Por eso el hielo es molecular aunque por dentro sea covalente.
      - texto: El enlace que hay dentro de cada molécula
        porque: Ese es el error típico del hielo.
      - texto: Su dureza
        porque: Es una consecuencia, no el criterio.
      - texto: Su punto de fusión
        porque: También es consecuencia.

  - id: sol-ionico-ejemplos
    bloque: solidos
    pregunta: ¿Cuál de estos es un sólido iónico?
    opciones:
      - texto: Fluoruro de calcio
        correcta: true
        porque: Metal más no metal, unidos por atracción electrostática.
      - texto: Grafito
        porque: Carbono covalente.
      - texto: Hielo
        porque: Es molecular; lo unen puentes de hidrógeno, no iones.
      - texto: Cobre
        porque: Metálico, con sus cationes en una nube de electrones.

  - id: sol-covalente-dureza
    bloque: solidos
    pregunta: Comparados con los sólidos moleculares, los covalentes son…
    opciones:
      - texto: Mucho más duros y de mayor punto de fusión
        correcta: true
        porque: Hay que romper enlaces primarios, no separar moléculas.
      - texto: Más blandos
        porque: 'Es al revés: diamante frente a hielo.'
      - texto: Iguales en dureza
        porque: La diferencia es enorme.
      - texto: Siempre conductores
        porque: El diamante es aislante.

  - id: sol-grafito
    bloque: solidos
    pregunta: El grafito es un sólido…
    opciones:
      - texto: Covalente
        correcta: true
        porque: El tema lo lista junto al diamante entre los covalentes.
      - texto: Molecular
        porque: No está hecho de moléculas sueltas.
      - texto: Metálico
        porque: Conduce, pero su enlace es covalente.
      - texto: Iónico
        porque: Es carbono puro.

  - id: sol-metalico-que-hay
    bloque: solidos
    pregunta: Un sólido metálico está formado por…
    opciones:
      - texto: Cationes en una nube de electrones
        correcta: true
        porque: Es la descripción del tema, y de ahí salen la conducción y la ductilidad.
      - texto: Aniones en una nube de electrones
        porque: 'La trampa de siempre: los átomos ceden, así que quedan positivos.'
      - texto: Moléculas unidas por Van der Waals
        porque: Eso es un sólido molecular.
      - texto: Iones de dos signos alternados
        porque: Eso es un sólido iónico.

  - id: sol-por-que-funde-hielo
    bloque: solidos
    pregunta: ¿Por qué el hielo funde a cero grados y el diamante no funde en condiciones normales?
    opciones:
      - texto: Porque en el hielo basta con romper enlaces secundarios, que son débiles
        correcta: true
        porque: En el diamante habría que romper la red covalente entera.
      - texto: Porque el agua es líquida a temperatura ambiente
        porque: Eso es la consecuencia, no la causa.
      - texto: Porque el diamante es más denso
        porque: La densidad no decide el punto de fusión.
      - texto: Porque el hielo es amorfo
        porque: El hielo es cristalino.

  - id: sol-polimeros-que-tipo
    bloque: solidos
    pregunta: Los polímeros, como sólidos, se parecen más a los…
    opciones:
      - texto: Moleculares, porque entre cadenas actúan enlaces secundarios
        correcta: true
        porque: Dentro de la cadena es covalente; entre cadenas, secundarios.
      - texto: Iónicos
        porque: No hay iones en un polímero; sus enlaces son covalentes.
      - texto: Metálicos
        porque: No hay electrones libres.
      - texto: Covalentes puros como el diamante
        porque: 'En un covalente puro no hay unidades separables, y aquí sí: las cadenas.'

  - id: sol-silice-caracter
    bloque: solidos
    pregunta: La sílice, SiO₂, tiene carácter…
    opciones:
      - texto: Iónico y covalente a la vez
        correcta: true
        porque: 'Es un cerámico: metal o metaloide más no metal, con enlace mixto.'
      - texto: Puramente metálico
        porque: No conduce ni es dúctil.
      - texto: Puramente molecular
        porque: 'No hay moléculas de SiO₂ sueltas en el sólido: es una red.'
      - texto: De Van der Waals
        porque: Es un enlace secundario y no forma redes así.

  # ── NIVELES DE LA ESTRUCTURA ───────────────────────────────────────
  - id: niv-cuantos
    bloque: niveles
    pregunta: ¿A cuántos niveles se estudia la estructura de un material?
    opciones:
      - texto: Cuatro
        correcta: true
        porque: Subatómico, atómico, microscópico y macroscópico.
      - texto: Dos
        porque: Solo dos son los que el tema usa en sus ejemplos, pero hay cuatro.
      - texto: Tres
        porque: Falta uno; se olvida casi siempre el subatómico.
      - texto: Seis
        porque: Seis son las familias de propiedades.

  - id: niv-subatomico
    bloque: niveles
    pregunta: El nivel subatómico se refiere a…
    opciones:
      - texto: Cómo es cada átomo
        correcta: true
        porque: Y de ahí sale el tipo de enlace.
      - texto: Cómo se ordenan los átomos
        porque: Eso es el nivel atómico.
      - texto: Cómo se agrupan granos y fases
        porque: Eso es el microscópico.
      - texto: Lo que se ve a simple vista
        porque: Eso es el macroscópico.

  - id: niv-atomico
    bloque: niveles
    pregunta: El nivel atómico se refiere a…
    opciones:
      - texto: Cómo se ordenan los átomos en el espacio
        correcta: true
        porque: Es donde se decide que el aluminio sea dúctil y el magnesio frágil.
      - texto: La estructura interna de cada átomo
        porque: Eso es el subatómico.
      - texto: El tamaño de los granos
        porque: Eso es el microscópico.
      - texto: La forma de la pieza
        porque: Eso es el macroscópico.

  - id: niv-microscopico
    bloque: niveles
    pregunta: El nivel microscópico se refiere a…
    opciones:
      - texto: Cómo se agrupan grupos de átomos, en granos, poros y fases
        correcta: true
        porque: Es lo que se ve al microscopio, y donde se decide que la alúmina sea opaca.
      - texto: La disposición interna de los átomos que forman el material
        porque: Eso es el nivel atómico, y es la trampa del examen de 2024.
      - texto: Cómo es cada átomo por dentro
        porque: Eso es el subatómico.
      - texto: Lo que se aprecia sin instrumentos
        porque: Eso es el macroscópico.

  - id: niv-macroscopico
    bloque: niveles
    pregunta: El nivel macroscópico se refiere a…
    opciones:
      - texto: Lo que se ve a simple vista
        correcta: true
        porque: La pieza tal como la tienes en la mano.
      - texto: Lo que se ve con mil aumentos
        porque: Eso es el microscópico.
      - texto: El ordenamiento de los átomos
        porque: Eso es el atómico.
      - texto: El interior del átomo
        porque: Eso es el subatómico.

  - id: niv-donde-enlace
    bloque: niveles
    pregunta: ¿En qué nivel se decide el tipo de enlace de un material?
    opciones:
      - texto: Subatómico
        correcta: true
        porque: Depende de cómo es cada átomo, en concreto de su electronegatividad.
      - texto: Atómico
        porque: Ahí se decide cómo se ordenan, ya con el enlace dado.
      - texto: Microscópico
        porque: Ahí se ven granos y fases.
      - texto: Macroscópico
        porque: A simple vista no se ve un enlace.

  - id: niv-donde-alumina
    bloque: niveles
    pregunta: Que una alúmina sea opaca o transparente se decide en el nivel…
    opciones:
      - texto: Microscópico
        correcta: true
        porque: Depende de si quedan poros entre los granos.
      - texto: Atómico
        porque: La red atómica es la misma en las dos.
      - texto: Subatómico
        porque: El enlace no cambia.
      - texto: Macroscópico
        porque: Se ve a simple vista, pero se decide un nivel más abajo.

  - id: niv-donde-aluminio-magnesio
    bloque: niveles
    pregunta: Que el aluminio sea dúctil y el magnesio frágil se decide en el nivel…
    opciones:
      - texto: Atómico
        correcta: true
        porque: Uno tiene red cúbica y el otro hexagonal.
      - texto: Subatómico
        porque: Los dos tienen el mismo tipo de enlace.
      - texto: Microscópico
        porque: No es cuestión de granos ni de poros.
      - texto: Macroscópico
        porque: A simple vista los dos parecen metales ligeros.

  - id: niv-cual-no-es-nivel
    bloque: niveles
    pregunta: ¿Cuál de estos NO es uno de los cuatro niveles del tema?
    opciones:
      - texto: Molecular
        correcta: true
        porque: Los cuatro son subatómico, atómico, microscópico y macroscópico.
      - texto: Subatómico
        porque: Sí lo es, y es el que más se olvida.
      - texto: Microscópico
        porque: Sí es uno de los cuatro; es el de los granos y las fases.
      - texto: Macroscópico
        porque: Sí es uno de los cuatro; es lo que se ve a simple vista.

  - id: niv-aumentos
    bloque: niveles
    pregunta: El nivel atómico se observa con un orden de aumentos de…
    opciones:
      - texto: Diez millones
        correcta: true
        porque: Es el orden que da la figura del tema; el microscópico va con unos mil.
      - texto: Mil
        porque: Ese es el orden del nivel microscópico.
      - texto: Diez
        porque: Con diez aumentos se sigue en lo macroscópico.
      - texto: Cien mil millones
        porque: Se pasa de largo; con eso no se observa nada útil.

  # ── DEFINICIONES Y LA CADENA ───────────────────────────────────────
  - id: def-propiedad
    bloque: definiciones
    pregunta: Una propiedad de un material es…
    opciones:
      - texto: La respuesta del material ante un estímulo externo
        correcta: true
        porque: La definición del tema, y «estímulo» es lo que la hace general.
      - texto: Una característica que se deduce de su fórmula química
        porque: Es justo lo que el tema desmonta.
      - texto: El valor que aparece en la tabla del fabricante
        porque: Ese valor es una medida de la propiedad, y depende del procesado.
      - texto: Su comportamiento ante una fuerza
        porque: Eso es solo la familia mecánica.

  - id: def-cuantas-familias-propiedades
    bloque: definiciones
    pregunta: ¿Cuántas familias de propiedades distingue el tema?
    opciones:
      - texto: Seis
        correcta: true
        porque: Mecánicas, eléctricas, térmicas, magnéticas, ópticas y químicas.
      - texto: Cuatro
        porque: Cuatro son los niveles de la estructura y las familias de materiales.
      - texto: Tres
        porque: Tres son los enlaces primarios.
      - texto: Ocho
        porque: Son menos de ocho; el tema enumera exactamente seis.

  - id: def-estructura
    bloque: definiciones
    pregunta: La estructura de un material es…
    opciones:
      - texto: La disposición de sus elementos internos
        correcta: true
        porque: Y se estudia a cuatro escalas.
      - texto: Su forma exterior
        porque: Eso sería solo lo macroscópico, y no es la definición.
      - texto: Su composición química
        porque: La composición es qué átomos hay; la estructura, cómo están puestos.
      - texto: El conjunto de sus propiedades
        porque: Las propiedades son consecuencia de la estructura.

  - id: def-ciencia-vs-ingenieria
    bloque: definiciones
    pregunta: La ingeniería de materiales, frente a la ciencia de materiales…
    opciones:
      - texto: Parte de las propiedades que hacen falta y diseña la estructura que las da
        correcta: true
        porque: La misma relación recorrida en sentido contrario.
      - texto: Estudia la relación entre estructura y propiedades
        porque: Eso es la ciencia de materiales.
      - texto: Solo trabaja con materiales ya existentes
        porque: Diseña materiales nuevos continuamente.
      - texto: Se ocupa únicamente de la fabricación
        porque: La fabricación es una parte, no la definición.

  - id: def-la-cadena
    bloque: definiciones
    pregunta: ¿Cuál es el orden correcto de la cadena que ordena la asignatura?
    opciones:
      - texto: Procesado → estructura → propiedades → comportamiento
        correcta: true
        porque: Es la cadena del tema, y se recorre en los dos sentidos.
      - texto: Estructura → procesado → propiedades → comportamiento
        porque: 'El procesado va primero: es lo que cambia la estructura.'
      - texto: Composición → estructura → propiedades → comportamiento
        porque: La composición no es un eslabón de la cadena.
      - texto: Propiedades → estructura → procesado → comportamiento
        porque: Ese sería el orden de la ingeniería, y aun así el comportamiento no va al final ahí.

  - id: def-que-cambia-el-procesado
    bloque: definiciones
    pregunta: El procesado de un material cambia…
    opciones:
      - texto: Su estructura
        correcta: true
        porque: Y con ella sus propiedades. Es el primer eslabón.
      - texto: Su composición química
        porque: Fundir o laminar no cambia de qué está hecho.
      - texto: Directamente su comportamiento, sin pasar por la estructura
        porque: La cadena no se salta eslabones.
      - texto: Solo su forma exterior
        porque: Cambia el interior, y eso es lo que importa.

  - id: def-acero-lima-clip
    bloque: definiciones
    pregunta: El acero de una lima y el de un clip pueden tener la misma composición y comportarse al revés porque…
    opciones:
      - texto: Tienen distinta estructura, y la fija el procesado
        correcta: true
        porque: Es el segundo ejemplo del ErrorTipico del tema.
      - texto: La lima lleva más carbono
        porque: El ejemplo parte precisamente de que la composición es la misma.
      - texto: El clip está más frío
        porque: La temperatura de uso no es lo que los distingue.
      - texto: Es imposible, la composición determina el comportamiento
        porque: Es justo la idea que el tema viene a desmontar.

  - id: def-microestructura-influye
    bloque: definiciones
    pregunta: La microestructura de un material influye en…
    opciones:
      - texto: Muchas propiedades, entre ellas las mecánicas y las ópticas
        correcta: true
        porque: Decir «tan solo las ópticas» fue una opción falsa del examen de 2024.
      - texto: Solo las propiedades ópticas
        porque: Ese «solo» es lo que la hace falsa.
      - texto: Solo las propiedades mecánicas
        porque: El ejemplo de la alúmina es óptico.
      - texto: Ninguna, porque las decide la composición
        porque: Es la idea que el tema desmonta.

  - id: def-para-que-controlar
    bloque: definiciones
    pregunta: Para poder elegir un material hay que controlar tres cosas. ¿Cuáles?
    opciones:
      - texto: Sus características, la relación estructura-propiedades y las técnicas de procesado
        correcta: true
        porque: Las tres del tema.
      - texto: Su precio, su disponibilidad y su resistencia
        porque: El precio es un criterio de elección, no una de las tres.
      - texto: Su composición, su color y su densidad
        porque: Son datos sueltos, no lo que hay que dominar.
      - texto: El fabricante, la norma y el ensayo
        porque: No es lo que dice el tema.

  - id: def-estimulo-ejemplos
    bloque: definiciones
    pregunta: ¿Cuál de estos NO es un ejemplo de propiedad como respuesta a un estímulo?
    opciones:
      - texto: Su fórmula química
        correcta: true
        porque: 'No es una respuesta a nada: es composición.'
      - texto: Cuánto se deforma al tirar de él
        porque: 'Respuesta a una fuerza: propiedad mecánica.'
      - texto: Cuánto calor conduce
        porque: 'Respuesta a un gradiente de temperatura: propiedad térmica.'
      - texto: Si deja pasar la luz
        porque: 'Respuesta a la luz: propiedad óptica.'

  # ── MATERIALES AVANZADOS ───────────────────────────────────────────
  - id: ava-semiconductor-cual
    bloque: avanzados
    pregunta: ¿Cuál de estos es un semiconductor?
    opciones:
      - texto: Germanio
        correcta: true
        porque: El tema cita el silicio y el germanio.
      - texto: Plata
        porque: El mejor conductor que hay.
      - texto: Cromo
        porque: Metal, conductor.
      - texto: Alúmina
        porque: Cerámico, aislante.

  - id: ava-semiconductor-que-es
    bloque: avanzados
    pregunta: Un semiconductor se define por tener…
    opciones:
      - texto: Propiedades eléctricas entre las de un conductor y las de un aislante
        correcta: true
        porque: Es la definición del tema.
      - texto: Conductividad mayor que la de los metales
        porque: Eso sería un superconductor, y no es lo mismo.
      - texto: Conductividad nula
        porque: Eso es un aislante.
      - texto: Dureza intermedia
        porque: La definición es eléctrica, no mecánica.

  - id: ava-donde-se-usan
    bloque: avanzados
    pregunta: Los semiconductores se usan sobre todo en…
    opciones:
      - texto: Aplicaciones electrónicas
        correcta: true
        porque: Es el uso que cita el tema.
      - texto: Estructuras de edificios
        porque: Ahí van acero y hormigón.
      - texto: Envases alimentarios
        porque: Ahí van polímeros.
      - texto: Herramientas de corte
        porque: Ahí van aceros y cerámicos duros.

  - id: ava-avanzados-cuales
    bloque: avanzados
    pregunta: Los materiales avanzados que cita el tema son…
    opciones:
      - texto: Semiconductores y biomateriales
        correcta: true
        porque: Son los dos grupos que el tema pone fuera de las cuatro familias.
      - texto: Compuestos y aleaciones
        porque: Los compuestos son una de las cuatro familias y las aleaciones son metales.
      - texto: Nanomateriales y superconductores
        porque: Existen, pero el tema no los cita en este apartado.
      - texto: Cerámicos técnicos y polímeros de ingeniería
        porque: Siguen siendo cerámicos y polímeros.

  - id: enl-por-que-no-conducen-polimeros
    bloque: enlaces
    pregunta: ¿Por qué los polímeros no conducen la electricidad?
    opciones:
      - texto: Porque sus electrones están localizados en los enlaces covalentes
        correcta: true
        porque: Para conducir hacen falta cargas libres, y aquí no las hay.
      - texto: Porque sus cadenas son muy largas
        porque: La longitud no impide conducir por sí sola.
      - texto: Porque son amorfos
        porque: El vidrio es amorfo y el cobre cristalino, y ninguno de los dos hechos explica la conducción.
      - texto: Porque tienen electrones deslocalizados que se anulan
        porque: No los tienen; ese es el rasgo de los metales.

  - id: cri-vidrio-por-que-amorfo
    bloque: cristalino
    pregunta: ¿Por qué el vidrio es amorfo si su composición es parecida a la del cuarzo?
    opciones:
      - texto: Porque al enfriarse sus átomos no llegan a ordenarse en un patrón repetido
        correcta: true
        porque: Mismo material, distinto orden. Otra vez la estructura por encima de la composición.
      - texto: Porque tiene impurezas
        porque: Un vidrio purísimo sigue siendo amorfo.
      - texto: Porque su enlace es distinto
        porque: El enlace es el mismo tipo en los dos.
      - texto: Porque es transparente y los cristales no lo son
        porque: El cuarzo también es transparente, y muchos cristales lo son.
