    opciones:
      - texto: Sólo tiene términos seno.
        porque: |-
          Solo senos sería si $u$ fuese impar. Pero $f$ y $g$ son impares y
          $h$ es par: $u(-t)=\bigl(-f(t)\bigr)\bigl(-g(t)\bigr)h(t)=u(t)$, par.
      - texto: Sólo tiene términos coseno.
        correcta: true
        porque: |-
          $f$ es impar —una senoidal que pasa por el origen—, $g$ también —una
          cúbica que se repite— y $h$ es par —una parábola que se repite—.
          Impar por impar es par, y por par sigue siendo par: $u$ es par y su
          serie solo tiene cosenos, más el término constante.
      - texto: Tiene términos seno y coseno.
        porque: |-
          Los tendría si $u$ no tuviese simetría, y la tiene:
          $u(-t)=f(-t)g(-t)h(-t)=\bigl(-f(t)\bigr)\bigl(-g(t)\bigr)h(t)=u(t)$.
          Una función par no tiene senos.

  - id: u-igual-a-menos-s-de-menos-t
    bloque: '11.2.4'
    diapositiva: 9
    pregunta: |
      Sea $S(t)=\sum_{k=1}^{\infty}b_k\operatorname{sen}\frac{2k\pi t}{T}$ la
      serie de Fourier de cierta función continua $s(t)$.

      Calcular la serie de Fourier $U(t)$ de la función $u(t)=-s(-t)$
    opciones:
      - texto: '$U(t)=S(t)$'
        correcta: true
        porque: |-
          Cambiar $t$ por $-t$ cambia el signo de cada seno: la serie de
          $s(-t)$ es $S(-t)=-S(t)$, y la de $u(t)=-s(-t)$ es $-S(-t)=S(t)$.
          Equivale a decir que $s$ es impar y que $u=s$.
      - texto: '$U(t)=-S(t)$'
        porque: |-
          $-S(t)$ es la serie de $s(-t)$, sin el signo menos de delante:
          $u=-s(-t)$ le da otra vuelta al signo y vuelve a $S(t)$.
      - texto: '$U(t)$ no puede calcularse'
        porque: |-
          Se puede, y sin calcular ningún coeficiente: la serie de $s(-t)$
          sale de cambiar $t$ por $-t$ en $S$, y cada seno cambia de signo.

  # El punto de t = 8 vale 3 y el de t = 0 vale 4, y con T = 8 tendrían que
  # coincidir. Los números de B salen de promediar los nueve puntos como si
  # fueran nueve muestras de un periodo; con los ocho de t = 0 a t = 7 serían
  # a0 ≈ 4,63, a1 ≈ −0,60 y b1 ≈ −0,85. B sigue siendo la única posible: A y
  # C dan un valor medio que no casa con ningún reparto de los datos.
