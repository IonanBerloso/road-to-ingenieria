    opciones:
      - texto: El espectro A
        porque: |-
          Es el de $u$ multiplicado por $1{,}5$ y con $2$ sumado a cada raya.
          Pero $b$ es una constante y solo cambia el término de frecuencia
          $0$: los armónicos de $v$ son los de $u$ multiplicados por $a$, y
          $b$ no les llega.
      - texto: El espectro B
        correcta: true
        porque: |-
          $v=au+b$ tiene los armónicos de $u$ multiplicados por $a$, y la
          constante $b$ solo mueve la raya de frecuencia $0$. En B todos los
          armónicos son $1{,}5$ veces los de $u$ ($1{,}5$, $4{,}5$, $1{,}5$,
          $3$…) y la raya de $0$ pasa de $2$ a $5=1{,}5\cdot 2+2$: $a=1{,}5$
          y $b=2$.

  - id: sumas-parciales-de-tres-funciones
    bloque: '11.2.3'
    diapositiva: 5
    pregunta: |
      Cada figura muestra la gráfica de la suma de los cinco primeros términos
      de la serie de Fourier de una de las funciones $u(t)$, $v(t)$, $w(t)$
      indicadas.

      $$
      \begin{aligned}
      u(t)&=|t-1|, && t\in(-1,1),\ T=2\\
      v(t)&=t+1, && t\in(-1,1),\ T=2\\
      w(t)&=t-1, && t\in(-2,1),\ T=3
      \end{aligned}
      $$

      Asociar cada función a su correspondiente gráfica.
    figura: |
      <svg viewBox="0 0 516 166" role="img" width="516" height="166"
           aria-labelledby="cq11-sumas-t cq11-sumas-d">
        <title id="cq11-sumas-t">Tres sumas parciales de series de Fourier</title>
        <desc id="cq11-sumas-d">Tres gráficas, cada una la suma de cinco términos de una serie de Fourier, con pequeñas ondulaciones. La 1 va de menos 3 a 0, por debajo del eje: sube en rampa y cae de golpe cerca de t igual a 1 y de t igual a menos 2, con periodo 3. La 2 va de 0 a 2: baja en rampa y sube de golpe cerca de t igual a menos 1 y de t igual a 1, con periodo 2. La 3 va de 0 a 2: sube en rampa y cae de golpe cerca de t igual a menos 1 y de t igual a 1, con periodo 2.</desc>
        <style>
            .cq11-sumas-eje { stroke: var(--rule); stroke-width: 1.1; fill: none; }
            .cq11-sumas-c { stroke: var(--d1); stroke-width: 2.8; fill: none; }
            .cq11-sumas-c2 { stroke: var(--alt); stroke-width: 2.8; fill: none; }
            .cq11-sumas-cp { stroke: var(--d1); stroke-width: 2.4; fill: none; stroke-dasharray: 6 4; }
            .cq11-sumas-cp2 { stroke: var(--alt); stroke-width: 2.4; fill: none; stroke-dasharray: 6 4; }
            .cq11-sumas-g { stroke: var(--faint); stroke-width: 1.1; fill: none; stroke-dasharray: 3 3; }
            .cq11-sumas-fue { stroke: var(--faint); stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
            .cq11-sumas-f { fill: var(--live); fill-opacity: .12; stroke: none; }
            .cq11-sumas-f2 { fill: var(--alt); fill-opacity: .12; stroke: none; }
            .cq11-sumas-pt { fill: var(--live); }
            .cq11-sumas-punta { fill: var(--live); stroke: none; }
            .cq11-sumas-hueco { fill: var(--paper); stroke: var(--live); stroke-width: 2; }
            .cq11-sumas-o { fill: var(--flag); }
            .cq11-sumas-n { fill: var(--faint); font-size: 10px; font-family: var(--mono); paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
            .cq11-sumas-l { font-size: 10.5px; font-family: var(--mono); font-weight: 700; paint-order: stroke; stroke: var(--paper); stroke-width: 3.4px; stroke-linejoin: round; }
