    opciones:
      - texto: '$\begin{cases}u(t)\to 3\\ v(t)\to 2\\ w(t)\to 1\end{cases}$'
        porque: |-
          Cambia $u$ por $v$: las dos tienen periodo $2$ y van de $0$ a $2$,
          pero en $(-1,1)$ $u=1-t$ baja y $v=t+1$ sube. La gráfica 3 sube
          entre salto y salto, así que es la de $v$.
      - texto: '$\begin{cases}u(t)\to 2\\ v(t)\to 1\\ w(t)\to 3\end{cases}$'
        porque: |-
          Acierta $u$, pero la gráfica 1 va de $-3$ a $0$ y tiene periodo
          $3$: es la de $w=t-1$ en $(-2,1)$. $v=t+1$ se mueve entre $0$ y
          $2$.
      - texto: '$\begin{cases}u(t)\to 1\\ v(t)\to 2\\ w(t)\to 3\end{cases}$'
        porque: |-
          La gráfica 1 está entera por debajo del eje, y $u=|t-1|$ nunca es
          negativa. Tampoco la 2 puede ser $v$: baja entre salto y salto, y
          $v=t+1$ sube.
      - texto: '$\begin{cases}u(t)\to 2\\ v(t)\to 3\\ w(t)\to 1\end{cases}$'
        correcta: true
        porque: |-
          En $(-1,1)$, $|t-1|=1-t$ baja de $2$ a $0$: la gráfica 2, que baja
          entre salto y salto con periodo $2$. $v=t+1$ sube de $0$ a $2$ con
          periodo $2$: la 3. Y $w=t-1$ sube de $-3$ a $0$ con periodo $3$: la
          1, la única por debajo del eje.

  - id: la-serie-de-leibniz
    bloque: '11.2.3'
    diapositiva: 6
    pregunta: |
      La serie de Fourier $S(t)$ de la función periódica cuya gráfica muestra
      la figura es

      $$
      S(t)=\frac{4}{\pi}\sum_{k=0}^{\infty}\frac{\operatorname{sen}(2k+1)t}{2k+1}
      $$

      Calcular el siguiente valor: $R=1-\frac{1}{3}+\frac{1}{5}-\frac{1}{7}+\dots$
