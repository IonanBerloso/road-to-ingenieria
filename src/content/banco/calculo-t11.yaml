asignatura: calculo
tema: t11-fourier
titulo: Las cuestiones de las diapositivas del tema 11
fuente: >-
  Las diapositivas de clase del tema 11 de Cálculo, «Introducción al análisis
  de Fourier» (UPV/EHU): diez preguntas tipo test para las cuestiones en grupo
  y para el oral de la final y de la extraordinaria. Las diapositivas no traen
  la solución: la respuesta y el porqué de cada opción son de este sitio, y
  las figuras están redibujadas.
diapositivas: 10
bloques:
  - { id: '11.1', titulo: Planteamiento del problema }
  - { id: '11.2.1-11.2.2', titulo: Coeficientes de la serie de Fourier }
  - { id: '11.2.3', titulo: Convergencia }
  - { id: '11.2.4', titulo: Funciones pares e impares }
  - { id: '11.2.5', titulo: Interpretación de los coeficientes }
preguntas:
