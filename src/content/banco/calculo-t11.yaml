      </svg>
    opciones:
      - texto: '$R=\infty$'
        porque: |-
          La serie alterna los signos y sus términos bajan a cero, así que
          converge: es el criterio de Leibniz. No diverge; vale
          $\frac{\pi}{4}$.
      - texto: '$R=1$'
        porque: |-
          $1$ es lo que vale la función en $t=\frac{\pi}{2}$, es decir,
          $S\left(\frac{\pi}{2}\right)=\frac{4}{\pi}R=1$. Falta despejar:
          $R=\frac{\pi}{4}$.
      - texto: '$R=\frac{\pi}{4}$'
        correcta: true
        porque: |-
          En $t=\frac{\pi}{2}$, $\operatorname{sen}\frac{(2k+1)\pi}{2}$ vale
          $1,-1,1,-1\dots$, así que $S\left(\frac{\pi}{2}\right)=\frac{4}{\pi}R$.
          La función es continua ahí y vale $1$, y la serie converge a ese
          valor: $\frac{4}{\pi}R=1$, $R=\frac{\pi}{4}$.
      - texto: '$R=\pi$'
        porque: |-
          $\frac{4}{\pi}R=1$ da $R=\frac{\pi}{4}$, no $\pi$. Con $R=\pi$ la
          serie valdría $4$ en $t=\frac{\pi}{2}$, y la función vale $1$.

  - id: t-a-la-sexta-en-cero-dos-pi
    bloque: '11.2.4'
    diapositiva: 7
    pregunta: |
      Considerar la siguiente función $y(t)$ periódica de período $T=2\pi$:

      $$
      y(t)=t^6,\quad t\in(0,2\pi)
      $$

      ¿Qué puede decirse de su serie de Fourier?
    opciones:
      - texto: Sólo tiene términos seno.
        porque: |-
          Solo senos exigiría una función impar, y la extensión periódica de
          $t^6$ desde $(0,2\pi)$ no lo es: en $-t$ vale $(2\pi-t)^6$, que es
          positiva y no puede ser $-t^6$.
      - texto: Sólo tiene términos coseno.
        porque: |-
          Es la trampa: $t^6$ es par como polinomio, pero aquí solo se usa en
          $(0,2\pi)$ y se repite. La función periódica no es par: en $-t$ vale
          $(2\pi-t)^6$, que no es $t^6$.
      - texto: Tiene términos seno y coseno.
        correcta: true
        porque: |-
          La función definida en $(0,2\pi)$ y repetida no es par ni impar: en
          $-t$ vale $(2\pi-t)^6$, que no es ni $t^6$ ni $-t^6$. Sin simetría,
          nada obliga a que se anulen los $a_n$ o los $b_n$, y tiene de los
          dos.

  - id: producto-de-tres-funciones
    bloque: '11.2.4'
    diapositiva: 8
    pregunta: |
      Considerar las funciones $f(t)$, $g(t)$ y $h(t)$ cuyas gráficas muestra
      la figura. ¿Qué puede decirse de la serie de Fourier de la función
      $u(t)=f(t)g(t)h(t)$?
