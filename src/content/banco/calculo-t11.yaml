    opciones:
      - texto: '$\begin{cases}a_0\simeq -2{,}17\\ a_1\simeq 1{,}43\\ b_1\simeq -0{,}75\end{cases}$'
        porque: |-
          $a_0$ es el valor medio de la señal, y todos los datos están entre
          $2$ y $6$: no puede salir negativo.
      - texto: '$\begin{cases}a_0\simeq 4{,}44\\ a_1\simeq 0{,}13\\ b_1\simeq -0{,}76\end{cases}$'
        correcta: true
        porque: |-
          $a_0$ es el valor medio: los nueve valores suman $40$, y
          $\frac{40}{9}\approx 4{,}44$. Con las mismas nueve muestras,
          $a_1\approx\frac{2}{9}\sum y_i\cos\frac{2\pi t_i}{8}\approx 0{,}13$
          y $b_1\approx\frac{2}{9}\sum y_i\operatorname{sen}\frac{2\pi t_i}{8}\approx -0{,}76$.
      - texto: '$\begin{cases}a_0\simeq 2{,}36\\ a_1\simeq -3{,}12\\ b_1\simeq -2{,}75\end{cases}$'
        porque: |-
          $a_0$ es el valor medio, y $2{,}36$ queda por debajo de ocho de los
          nueve datos: la media de los valores sale $\frac{40}{9}\approx 4{,}44$.
