    opciones:
      - texto: El espectro A
        porque: |-
          En vez de la amplitud, suma o resta los coeficientes: $3+4=7$ en
          $2F$ y $8-6=2$ en $5F$. Seno y coseno de la misma frecuencia se
          combinan como los catetos de un triángulo: $\sqrt{3^2+4^2}=5$ y
          $\sqrt{8^2+6^2}=10$.
      - texto: El espectro B
        porque: |-
          Toma el número que multiplica a $\pi Ft$ por el del armónico:
          $4\pi Ft=2\pi\cdot 2Ft$ es el armónico $2F$, no $4F$, y
          $10\pi Ft$ es $5F$, no $10F$. Además en $4F$ pone $3+4=7$ en lugar
          de $\sqrt{3^2+4^2}=5$.
      - texto: El espectro C
        correcta: true
        porque: |-
          $2\pi Ft$ es la fundamental, $4\pi Ft$ el segundo armónico y
          $10\pi Ft$ el quinto. Las amplitudes: $12$ en $F$,
          $\sqrt{3^2+4^2}=5$ en $2F$ y $\sqrt{8^2+6^2}=10$ en $5F$.

  # Estas diapositivas escriben la serie como a0 + Σ(ak cos + bk sen): la
  # opción buena da a0 = 5, el valor medio. La prosa del tema 11 del sitio la
  # escribe con a0/2 delante, y con esa forma sería a0 = 10. El porqué lo dice.
  - id: coeficientes-linealizando
    bloque: '11.2.1-11.2.2'
    diapositiva: 3
    pregunta: |
      Calcular los coeficientes de Fourier de la siguiente función:

      $$
      y(t)=2\cos^2 4t+8\operatorname{sen}^2 6t+6\operatorname{sen}t\cos t
      $$
    opciones:
      - texto: '$\begin{cases}a_0=0\\ a_3=2\\ a_2=2\\ b_8=6\end{cases}$'
        porque: |-
          Copia números del enunciado sin linealizar, y los cuadrados no son
          armónicos. Tampoco puede ser $a_0=0$: $2\cos^2 4t$ y
          $8\operatorname{sen}^2 6t$ nunca son negativos, y el valor medio de
          $y$ sale $1+4=5$.
      - texto: '$\begin{cases}a_7=4\\ b_2=2\\ b_4=5\end{cases}$'
        porque: |-
          Le falta el término constante, y la función tiene valor medio $5$:
          $2\cos^2 4t$ aporta $1$ y $8\operatorname{sen}^2 6t$ aporta $4$. Y
          ningún término de $y$ tiene la frecuencia de un $a_7$.
      - texto: '$\begin{cases}a_0=5\\ a_4=1\\ b_1=3\\ a_6=-4\end{cases}$'
        correcta: true
        porque: |-
          Se linealiza: $2\cos^2 4t=1+\cos 8t$,
          $8\operatorname{sen}^2 6t=4-4\cos 12t$ y
          $6\operatorname{sen}t\cos t=3\operatorname{sen}2t$. Queda
          $y=5+3\operatorname{sen}2t+\cos 8t-4\cos 12t$, de periodo $\pi$ y
          $\omega_0=2$: $b_1=3$, $a_4=1$, $a_6=-4$ y, escrita como
          $a_0+\sum(\dots)$, $a_0=5$ (con $\frac{a_0}{2}$ delante sería
          $a_0=10$).
      - texto: '$\begin{cases}a_0=3\\ a_3=-1\\ b_2=6\\ b_9=3\end{cases}$'
        porque: |-
          $a_0=3$ no es el valor medio: los cuadrados aportan $1+4=5$. Y
          $b_2=6$ copia el $6$ de $6\operatorname{sen}t\cos t$, que es
          $3\operatorname{sen}2t$: amplitud $3$, no $6$.

  - id: espectro-de-a-u-mas-b
    bloque: '11.2.1-11.2.2'
    diapositiva: 4
    pregunta: |
      La figura muestra el espectro discreto de cierta señal $u(t)$.
      Construimos una nueva señal $v(t)$ aplicando a $u(t)$ un cambio de
      escala y una traslación vertical, es decir, $v(t)=au(t)+b$, donde $a$ y
      $b$ son constantes reales. ¿Cuál de los siguientes será el espectro
      discreto de $v(t)$?
    figura: |
      <svg viewBox="0 0 340 408" role="img" width="340" height="408"
           aria-labelledby="cq11-espectro-v-t cq11-espectro-v-d">
