    opciones:
      - texto: El espectro A
        porque: |-
          Acierta $F$ y $2F$, pero pone el $3$ de $3\cos(12\pi t)$ en $3F$:
          $12\pi t=2\pi\cdot 6t$ es la frecuencia $6$, cuatro veces la
          fundamental, $1{,}5$, así que va en $4F$. Y la raya de la constante
          no va hacia abajo: el espectro dibuja amplitudes, y el $-1$ aporta
          una raya de altura $1$.
      - texto: El espectro B
        correcta: true
        porque: |-
          La fundamental es la del término más lento, $\cos(3\pi t)$:
          $F=1{,}5$, así que $6\pi t$ es $2F$ y $12\pi t$ es $4F$. Las
          amplitudes: $1$ en $0$, $2$ en $F$, $\sqrt{4^2+3^2}=5$ en $2F$
          —seno y coseno de la misma frecuencia se juntan—, nada en $3F$ y
          $3$ en $4F$.
      - texto: El espectro C
        porque: |-
          En $2F$ pone $3$, como si solo contara $3\cos(6\pi t)$ y olvidara
          el seno de la misma frecuencia: juntos dan $\sqrt{4^2+3^2}=5$. Y el
          $5$ de $4F$ no sale de ningún término: ahí solo está
          $3\cos(12\pi t)$.

