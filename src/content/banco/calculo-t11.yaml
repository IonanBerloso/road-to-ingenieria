        <desc id="cq11-espectro-v-d">Tres espectros de rayas, uno debajo de otro, con las frecuencias de 0 a 7F. El de u(t) tiene rayas de 2, 1, 3, 1, 2, 1,5, 1 y 3. En A, cada raya es la de u multiplicada por 1,5 y con 2 sumado: 5, 3,5, 6,5, 3,5, 5, 4,25, 3,5 y 6,5. En B, la raya de la frecuencia 0 vale 5 y las demás son las de u multiplicadas por 1,5: 1,5, 4,5, 1,5, 3, 2,25, 1,5 y 4,5.</desc>
