        <desc id="cq5-area-d">Dos curvas entre x igual a cero y x igual a 2,5, con un eje vertical marcado en 1,42, 2,85, 3,21 y los demás múltiplos de 0,357. y(x) empieza en 1,42, sube hasta un máximo de 3,21 en x igual a dos y baja hasta 2,85 en 2,5. Debajo, y prima de x sale de cero, sube hasta 1,4 cerca de x igual a uno, corta el eje en dos y baja hasta menos 1,4. Está sombreada la región entre y prima y el eje, de cero a 2,5: por encima del eje hasta x igual a dos y por debajo después.</desc>
