    opciones:
      - texto: |-
          $\displaystyle\int_0^5 y(h(t))\,h'(t)\,dt$
        porque: |-
          Está bien aplicado: $h(0)=1$ y $h(5)=4$, así que la integral es
          $\int_{h(0)}^{h(5)}y(x)\,dx=\int_1^4 y(x)\,dx$. Que $h$ baje de $1$
          por el camino no importa, con tal de que $y$ sea continua también en
          esos valores, que la gráfica no enseña.
      - texto: |-
          $\displaystyle\int_0^{8{,}75} y(h(t))\,h'(t)\,dt$
        porque: |-
          También lleva de $1$ a $4$: $h(0)=1$ y $h(8{,}75)=4$. Lo que $h$
          sube por encima de $4$ lo vuelve a bajar, y esas dos pasadas se
          cancelan.
      - texto: |-
          $\displaystyle\int_{10}^{-2{,}5} y(h(t))\,h'(t)\,dt$
        porque: |-
          Los límites van al revés que la $t$, pero da igual: el de abajo es
          $t=10$, con $h(10)=1$, y el de arriba $t=-2{,}5$, con $h(-2{,}5)=4$.
          Lleva a $\int_1^4$.
      - texto: |-
          $\displaystyle\int_{10}^{5} y(h(t))\,h'(t)\,dt$
        porque: |-
          El de abajo es $t=10$, con $h(10)=1$, y el de arriba $t=5$, con
          $h(5)=4$: otra vez $\int_1^4$. Que el límite de abajo sea mayor que
          el de arriba no es un error.
      - texto: |-
          $\displaystyle\int_{-1{,}25}^{10} y(h(t))\,h'(t)\,dt$
        correcta: true
        porque: |-
          Tiene los extremos cambiados: $h(-1{,}25)=4$ y $h(10)=1$, así que
          calcula $\int_4^1 y(x)\,dx=-\int_1^4 y(x)\,dx$. El límite de abajo
          tiene que ser una $t$ con $h(t)=1$, y el de arriba, una con
          $h(t)=4$.

  # Las opciones son de la regla con h = 0,5, los nueve valores de la
  # cuadrícula; con h = 1 saldría (2 + 7 + 5 + 5 + 1,75)/3 ≈ 6,9, que no está.
