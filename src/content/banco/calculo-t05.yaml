    opciones:
      - texto: La gráfica A
        porque: |-
          Tiene la forma buena —es una primitiva de $y$—, pero empieza en unos
          $0{,}4$, y $F(0{,}5)=\int_{0{,}5}^{0{,}5}y(t)\,dt=0$. Es $F$ subida
          $0{,}4$.
      - texto: La gráfica B
        correcta: true
        porque: |-
          Empieza en $F(0{,}5)=0$ y tiene en cada punto la pendiente que marca
          $y$: sube un poco mientras $y>0$, hasta $x=1$; baja entre $1$ y $2$,
          donde $y<0$, y vuelve a $0$ en $x=2$, porque las dos áreas se
          compensan; después sube cada vez más deprisa.
      - texto: La gráfica C
        porque: |-
          Es $-F$: baja donde $F$ sube. Entre $0{,}5$ y $1$ la gráfica de $y$
          está por encima del eje, así que $F'=y>0$ y $F$ tiene que empezar
          subiendo.

  - id: derivada-de-una-integral-definida
    bloque: '5.6'
    diapositiva: 8
    pregunta: |
      Sea $y(x)$ la función continua en $[a,b]$. ¿Es cierta la siguiente
      igualdad?

      $\dfrac{d}{dx}\left(\displaystyle\int_a^b y(x)\,dx\right)=y(x)$
    opciones:
      - texto: Es cierta
        porque: |-
          $\int_a^b y(x)\,dx$ es un número: no depende de $x$, que dentro de la
          integral es una variable muda. Su derivada es $0$. El teorema
          fundamental habla de $\frac{d}{dx}\int_a^x y(t)\,dt=y(x)$, con la
          $x$ en el límite de arriba.
      - texto: No es cierta
        correcta: true
        porque: |-
          Con los dos límites fijos, la integral es una constante y su derivada
          vale $0$, no $y(x)$. La igualdad vale para $\int_a^x y(t)\,dt$, con
          el límite de arriba variable: eso es el teorema fundamental.

  - id: cual-es-la-funcion-integral
    bloque: '5.6'
    diapositiva: 9
    pregunta: |
      Considerar las funciones $u(x)$ y $v(x)$ cuyas gráficas muestra la
      figura. Una de ellas corresponde a la función $y(x)$ y la otra a la
      función integral

      $F(x)=\displaystyle\int_0^x y(z)\,dz$

      ¿Cuál de las funciones es $y(x)$ y cuál es $F(x)$?
