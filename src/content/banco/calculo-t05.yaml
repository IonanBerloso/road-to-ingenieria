    opciones:
      - texto: Las tres negativas
        porque: |-
          La (1) vale $y'(4)-y'(0)$, y en $x=0$ la curva baja ($y'(0)<0$)
          mientras que en $x=4$ sube ($y'(4)>0$): es positiva. Y la (3)
          también, porque lo que se ve entre $0$ y $3$ está por encima del eje.
      - texto: Las tres positivas
        porque: |-
          La (1) y la (3) lo son, pero la (2) vale $y(3)-y(0)$, y $y(3)$ está
          debajo de la mancha: la curva puede pasar por encima o por debajo de
          $y(0)\approx 0{,}8$, porque la mancha llega en $x=3$ hasta más arriba
          de $1$.
      - texto: '(1) $>0$, (3) $>0$, (2) indeterminado'
        correcta: true
        porque: |-
          Por la regla de Newton-Leibniz, (1) $=y'(4)-y'(0)>0$, porque en $0$
          la curva baja y en $4$ sube. (3) es el área entre $0$ y $3$: la parte
          visible, hasta $x\approx 2{,}1$, pasa de $1{,}3$, y la mancha no deja
          bajar lo oculto de $-0{,}3$. Y (2) $=y(3)-y(0)$ depende de un valor
          tapado.
      - texto: '(1) $>0$, (2) $<0$, (3) indeterminado'
        porque: |-
          (2) $=y(3)-y(0)$ no se puede decidir: la mancha tapa $y(3)$ y en
          $x=3$ llega hasta más arriba de $1$, por encima de
          $y(0)\approx 0{,}8$. En cambio (3) sí se decide: lo visible pesa más
          que lo que la mancha puede esconder por debajo del eje.

  - id: limite-como-integral
    bloque: '5.6'
    diapositiva: 14
    pregunta: |
      Calcular:

      $$
      \lim_{n\to\infty}\frac{1}{n}\left(\left(\frac{1}{n}\right)^3+\left(\frac{2}{n}\right)^3+\left(\frac{3}{n}\right)^3+\left(\frac{4}{n}\right)^3+\cdots+\left(\frac{n}{n}\right)^3\right)
      $$
    opciones:
      - texto: '$1/2$'
        porque: |-
          Es $\int_0^1 x\,dx$, y la función es $x^3$, no $x$. La suma es una
          suma de Riemann de $x^3$ en $[0,1]$, con puntos $\frac{k}{n}$ y
          ancho $\frac{1}{n}$.
      - texto: '$1/3$'
        porque: |-
          Es $\int_0^1 x^2\,dx$, como si los cubos fueran cuadrados. Con
          $x^3$, la integral es $\frac{x^4}{4}\Big|_0^1=\frac{1}{4}$.
      - texto: '$1/4$'
        correcta: true
        porque: |-
          La expresión es $\sum_{k=1}^{n}\frac{1}{n}\left(\frac{k}{n}\right)^3$,
          una suma de Riemann de $x^3$ en $[0,1]$ con tramos de ancho
          $\frac{1}{n}$. Su límite es $\int_0^1 x^3\,dx=\frac{1}{4}$.
      - texto: infinito
        porque: |-
          La suma crece con $n$, pero el $\frac{1}{n}$ de delante la
          compensa: cada sumando no pasa de $\frac{1}{n}$ y hay $n$, así que el
          total no pasa de $1$.

  # El original pasa por 3,7 en t = −2,5 y por 4,3 en t = −1,25; se redibuja
  # con h = 4 en los dos, que es lo que las opciones dan por hecho (las otras
  # cuatro lecturas, h(0) = h(10) = 1 y h(5) = h(8,75) = 4, sí casan). Además,
  # h se sale de [1, 4] en todas las opciones: la pregunta da por hecho que y
  # es continua también fuera de lo dibujado. La respuesta no cambia.
  - id: cambio-de-variable-mal-aplicado
    bloque: '5.7'
    diapositiva: 15
    pregunta: |
      Considerar la función continua $y(x)$ y la función continua con derivada
      continua $h(t)$ cuyas gráficas muestra la figura.

      Para calcular el valor de $\displaystyle\int_1^4 y(x)\,dx$ aplicamos el
      cambio $x=h(t)$.

