    opciones:
      - texto: '$F(x)$ es creciente en $(1;\,1{,}5)$'
        correcta: true
        porque: |-
          Por el teorema fundamental, $F'(x)=y(x)$, y en $(1;\,1{,}5)$ la
          gráfica de $y$ está por encima del eje: $F'>0$, así que $F$ crece.
      - texto: '$F(x)$ es decreciente en $(1;\,2{,}5)$'
        porque: |-
          $F'=y$ es positiva hasta $x=2$ y negativa después: $F$ crece en
          $(1,2)$ y solo decrece en $(2;\,2{,}5)$. Se confunde que $y$
          decrezca, que es lo que pasa desde $x=1$, con que decrezca $F$.
      - texto: '$F(x)$ es convexa en $(0{,}5;\,2{,}5)$'
        porque: |-
          $F''=y'$, y $y$ sube hasta $x=1$ y baja después: $F''$ cambia de
          signo en $x=1$, así que $F$ cambia de concavidad ahí y no es convexa
          en todo el intervalo.
      - texto: Ninguna de las anteriores afirmaciones es cierta.
        porque: |-
          La A lo es: $F'(x)=y(x)$ es positiva en $(1;\,1{,}5)$, así que $F$
          crece ahí.

