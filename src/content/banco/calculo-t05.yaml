  Las diapositivas de clase del tema 5 de Cálculo, «Integración» (UPV/EHU):
  dieciséis preguntas tipo test para las cuestiones en grupo y para el oral de
  la final y de la extraordinaria. Las diapositivas no traen la solución: la
  respuesta y el porqué de cada opción son de este sitio, y las figuras están
