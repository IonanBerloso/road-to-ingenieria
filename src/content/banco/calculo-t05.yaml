  - id: tres-sumas-para-el-valor-medio
    bloque: '5.2'
    diapositiva: 1
    pregunta: |
      Los tres gráficos A, B, C muestran el cálculo aproximado del valor medio
      de $y(x)$ en $[-1{,}5;\,1]$, utilizando los puntos $x_0=-1{,}5$,
      $x_1=-1$, $x_2=-0{,}5$, $x_3=0$, $x_4=0{,}5$, $x_5=1$.

      Sin embargo, sólo en uno de ellos el gráfico se corresponde con la
      expresión correcta de cálculo que aparece debajo, ¿en cuál?
    figura: |
