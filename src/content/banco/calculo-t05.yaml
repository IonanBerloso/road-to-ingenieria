      </svg>
    opciones:
      - texto: >-
          El gráfico A, con
          $\overline{y}\cong\dfrac{1}{1-(-1{,}5)}\displaystyle\sum_{k=0}^{5}h\,y\left(\dfrac{x_{k+1}+x_k}{2}\right)$
        porque: |-
          En A cada rectángulo tiene la altura del extremo izquierdo de su
          base —el de $[0;\,0{,}5]$ llega a $y(0)=1$—, y la fórmula de debajo
          evalúa en los puntos medios. Además, con $k$ hasta $5$ pediría un
          $x_6$ que no existe.
      - texto: >-
          El gráfico B, con
          $\overline{y}\cong\dfrac{1}{1-(-1{,}5)}\displaystyle\sum_{k=1}^{5}h\,y(x_k)$
        correcta: true
        porque: |-
          Los rectángulos de B tienen la altura del extremo derecho de cada
          base: el último llega a $y(1)$, por encima de la curva. Es justo lo
          que suma la fórmula, $h\,y(x_1)+\dots+h\,y(x_5)$, los cinco extremos
          derechos, con $h=0{,}5$.
      - texto: >-
          El gráfico C, con
          $\overline{y}\cong\dfrac{1}{1-(-1{,}5)}\displaystyle\sum_{k=0}^{5}h\,y(x_k)$
        porque: |-
          En C la altura es la del punto medio de cada base —la curva corta el
          techo de cada rectángulo por la mitad—, y la fórmula suma $y(x_k)$ de
          $k=0$ a $5$: seis extremos para cinco tramos, uno de más, y ninguno
          es un punto medio.

  - id: unicidad-de-la-integral
    bloque: '5.2'
    diapositiva: 2
    pregunta: |
      Sea $y(x)$ una función continua en $[a,b]$. Considerar el siguiente
      límite:

      $L=\displaystyle\lim_{n\to\infty}\sum_{k=0}^{n-1}h\,y(z_k)\qquad h=\frac{b-a}{n}\qquad x_k=a+kh\qquad z_k\in[x_k,x_{k+1}]$

      Ahora elegimos los puntos $z_k$ de los siguientes modos: (1)
      $z_k=x_k$; (2) $z_k=x_{k+1}$; (3) $z_k=\dfrac{x_{k+1}+x_k}{2}$; (4)
      $z_k$ es un punto aleatorio de $[x_k,x_{k+1}]$.

      ¿Cuál de las siguientes afirmaciones es cierta?
    opciones:
      - texto: 'El valor de L depende del modo (1), (2), (3) o (4) de elegir los puntos $z_k$.'
        porque: |-
          Con cada modo sale una suma de Riemann distinta para cada $n$, pero
          todas tienden al mismo número, $\int_a^b y(x)\,dx$, cuando $y$ es
          continua. Los modos cambian la aproximación, no el límite.
      - texto: El valor de L no tiene por qué existir.
        porque: |-
          Existe siempre que $y$ sea continua en $[a,b]$: toda función
          continua en un intervalo cerrado es integrable, y el límite de sus
          sumas de Riemann es su integral.
      - texto: >-
          El valor de L siempre existe y tiene el mismo valor, sin importar el
          modo de elegir los puntos $z_k$.
        correcta: true
        porque: |-
          Una función continua en $[a,b]$ es integrable: sus sumas de Riemann
          tienden a $\int_a^b y(x)\,dx$ se elijan como se elijan los $z_k$,
          porque al estrecharse los tramos los valores de $y$ dentro de cada
          uno se parecen cada vez más.

  - id: unidades-de-la-integral
    bloque: '5.2'
    diapositiva: 3
    pregunta: |
      Supongamos que $x$ se mide en horas e $y$ en gramos/metro. ¿En qué
      unidades se mide $\displaystyle\int_a^b y(x)\,dx$?
    opciones:
      - texto: En (hora)²/metro
        porque: |-
          Las unidades de la integral son las de $y$ por las de $x$, porque
          suma productos $y\,dx$: gramos/metro por hora. Aquí han desaparecido
          los gramos y la hora sale al cuadrado.
      - texto: En (gramos/hora)²
        porque: |-
          Nada se eleva al cuadrado: $y\,dx$ es un producto de una cantidad en
          gramos/metro por otra en horas.
      - texto: En (gramos x metro)/hora
        porque: |-
          Da la vuelta a las unidades: la integral multiplica las de $y$,
          gramos/metro, por las de $x$, horas; no multiplica por metros ni
          divide por horas.
      - texto: En (gramos/metro) x hora
        correcta: true
        porque: |-
          La integral es un límite de sumas de productos $y(x)\,\Delta x$, así
          que sus unidades son las de $y$ por las de $x$: (gramos/metro) por
          hora.

  - id: consumo-de-fuel
    bloque: '5.2'
    diapositiva: 4
    pregunta: |
      La función $y(t)$ es la velocidad de consumo de fuel de un avión en
      vuelo. Si $t$ se expresa en minutos, ¿Qué representa la integral
      $\displaystyle\int_0^{30}y(t)\,dt$?
    opciones:
      - texto: La media de fuel consumido durante los primeros 30 minutos de vuelo
        porque: |-
          La media sería $\frac{1}{30}\int_0^{30}y(t)\,dt$, el consumo medio
          por minuto. La integral sin dividir es el total.
      - texto: El total de fuel consumido durante los primeros 30 minutos de vuelo
        correcta: true
        porque: |-
          Integrar una velocidad de consumo, cantidad de fuel por minuto, a lo
          largo del tiempo da lo consumido: el fuel gastado entre el minuto
          $0$ y el $30$.
      - texto: El tiempo que tarda el avión en consumir 30 litros de fuel
        porque: |-
          El $30$ es un límite de integración en minutos, no una cantidad de
          fuel: la integral acumula el fuel de los primeros 30 minutos.
      - texto: La media del tiempo que tarda el avión en consumir 30 litros de fuel
        porque: |-
          Mezcla la media y el tiempo: la integral de una velocidad de consumo
          da fuel, no minutos, y no divide por nada.

  - id: cortes-con-el-valor-medio
    bloque: '5.4-5.5'
    diapositiva: 5
    pregunta: |
      Sea $y(x)$ la función continua en $[0,10]$ que muestra la figura.
      Calcular el número N de puntos de intersección que existen entre la
      gráfica de $y(x)$ y la recta

      $y=\overline{y}$
    figura: |
      <svg viewBox="0 0 420 260" role="img" width="420" height="260"
