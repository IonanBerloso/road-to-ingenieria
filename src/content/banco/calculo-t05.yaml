    opciones:
      - texto: '$N=2$'
        porque: |-
          Salen dos si se cuentan solo los cortes con la joroba grande, la de
          $x=8$. Pero la loma de $x=2$ también pasa por encima de
          $\overline{y}\approx 2{,}4$: llega a $2{,}7$.
      - texto: '$N=3$'
        porque: |-
          Tres saldrían con una media por debajo de $2{,}15$, lo que vale
          $y(0)$: la curva empezaría por encima de la recta y se perdería un
          corte. Pero el área bajo la curva es de unas $23{,}7$ unidades, y la
          media, $2{,}4$.
      - texto: '$N=4$'
        correcta: true
        porque: |-
          El valor medio es
          $\overline{y}=\frac{1}{10}\int_0^{10}y(x)\,dx\approx\frac{23{,}7}{10}\approx 2{,}4$,
          contando cuadros bajo la curva. La recta $y=2{,}4$ corta la subida
          hacia la loma de $x=2$, que llega a $2{,}7$, su bajada, la subida de
          la joroba de $x=8$ y su bajada: cuatro puntos.
      - texto: '$N=5$'
        porque: |-
          Sobra uno: la curva empieza por debajo de la media, en $2{,}15$, y
          cada uno de sus cuatro tramos de subida o de bajada cruza la recta
          una sola vez.

