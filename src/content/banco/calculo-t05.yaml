    opciones:
      - texto: '1,43'
        porque: |-
          Es $\int_0^{2{,}5}y'(x)\,dx=y(2{,}5)-y(0)=2{,}85-1{,}42=1{,}43$: la
          integral, no el área. El trozo entre $2$ y $2{,}5$, donde $y'<0$,
          resta en vez de sumar.
      - texto: '1,25'
        porque: |-
          Se queda corta: solo la parte de encima del eje, de $0$ a $2$, ya
          vale $y(2)-y(0)=3{,}21-1{,}42=1{,}79$.
      - texto: '2,15'
        correcta: true
        porque: |-
          El área es $\int_0^{2}y'\,dx-\int_2^{2{,}5}y'\,dx$, y por la regla de
          Newton-Leibniz cada integral es una diferencia de valores de $y$:
          $(3{,}21-1{,}42)+(3{,}21-2{,}85)=1{,}79+0{,}36=2{,}15$.

  - id: agua-por-una-tuberia
    bloque: '5.6'
    diapositiva: 11
    pregunta: |
      Por una tubería circula un caudal de agua a razón de $v(t)$ litros por
      minuto. La cantidad de agua que circula por la tubería en el intervalo
      entre $t=2$ y $t=4$ minutos está representada por…
    opciones:
      - texto: '$\displaystyle\int_2^4 v(t)\,dt$'
        correcta: true
        porque: |-
          El caudal es agua por unidad de tiempo, así que la cantidad es su
          integral en el tiempo: litros por minuto por minutos. Integrar un
          ritmo de cambio da el cambio total.
      - texto: '$v(4)-v(2)$'
        porque: |-
          Es cuánto ha cambiado el caudal entre los dos instantes, en litros
          por minuto. Sería la cantidad si $v$ fuera el agua acumulada, no su
          ritmo.
      - texto: '$\dfrac{1}{(4-2)}\displaystyle\int_2^4 v(t)\,dt$'
        porque: |-
          Es el caudal medio entre $t=2$ y $t=4$, en litros por minuto. Para
          la cantidad hay que quitar la división: multiplicar por los $2$
          minutos.

