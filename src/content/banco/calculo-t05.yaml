      </svg>
    opciones:
      - texto: 1-2-3
        porque: |-
          Pone el 1 por delante del 2, y el 2 recorre más: el área bajo su
          recta es un trapecio de $\frac{4+1}{2}\cdot 4=10$, frente al
          rectángulo de $2\cdot 4=8$ del 1.
      - texto: 1-3-2
        porque: |-
          El 2 es el que más recorre, $10$, y aquí va el último. El 3, con
          $7{,}5$, es el que menos.
      - texto: 2-3-1
        porque: |-
          Acierta con el 2, pero el 3 recorre $\frac{3\cdot 3}{2}+3\cdot 1=7{,}5$,
          menos que los $8$ del 1: acaba más rápido que él, pero empieza
          parado.
      - texto: 2-1-3
        correcta: true
        porque: |-
          La distancia es el área bajo la gráfica de la velocidad: $10$ para
          el 2 (un trapecio de bases $4$ y $1$), $8$ para el 1 (un rectángulo
          de $2\times 4$) y $7{,}5$ para el 3 (un triángulo de
          $\frac{3\cdot 3}{2}=4{,}5$ más un rectángulo de $3$).
      - texto: 3-1-2
        porque: |-
          Ordena por la velocidad final, y lo que cuenta es el área bajo toda
          la gráfica: el 3 acaba el más rápido, pero, como arranca de $0$,
          recorre solo $7{,}5$, el que menos.
      - texto: 3-2-1
        porque: |-
          Casi todo al revés: el 3 es el que menos recorre, $7{,}5$, y el 2 el
          que más, $10$.

  - id: mancha-de-tinta
    bloque: '5.6'
    diapositiva: 13
    pregunta: |
      Hemos trazado sobre un papel la gráfica de una función $y(x)$ dos veces
      derivable. Pero, como ves, se nos ha derramado encima un bote de tinta
      negra. Decide, si es posible, cuál de las siguientes integrales es
      positiva, negativa, o igual a cero.

      $(1)\ \displaystyle\int_0^4 y''(x)\,dx\qquad$ $(2)\ \displaystyle\int_0^3 y'(x)\,dx\qquad$ $(3)\ \displaystyle\int_0^3 y(x)\,dx$
