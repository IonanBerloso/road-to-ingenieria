    opciones:
      - texto: No puede saberse
        porque: |-
          Se sabe con $F'=y$: la pendiente de la que sea $F$ tiene que valer,
          en cada punto, lo que vale la otra. Con $u=F$ cuadra: $u$ empieza
          plana, porque $v(0)=0$, y se empina a medida que $v$ crece.
      - texto: '$u(x)=y(x)$, $v(x)=F(x)$'
        porque: |-
          Entonces $v'=u$, y en $x=0$ la pendiente de $v$ tendría que ser
          $u(0)=0$: $v$ empezaría plana. Arranca con pendiente $1$, así que no
          es la integral de $u$.
      - texto: '$u(x)=F(x)$, $v(x)=y(x)$'
        correcta: true
        porque: |-
          $u$ empieza plana, con pendiente $v(0)=0$, y se empina a medida que
          $v$ crece: su pendiente en cada punto es el valor de $v$, como pide
          $F'=y$. Y el área bajo $v$ entre $0$ y $2{,}5$, de unas $2$
          unidades, es lo que vale $u$ en $x=2{,}5$.

  # La y del original acaba en unos 2,90 en x = 2,5, y las opciones salen de
  # leer ahí la marca de 2,85 (1,43 = 2,85 − 1,42). Se redibuja con
  # y(2,5) = 2,85 y con y′ como su derivada exacta. La respuesta no cambia:
  # con 2,90, el área sería 2,09 y la más cercana seguiría siendo 2,15.
  - id: area-con-la-derivada
    bloque: '5.6'
    diapositiva: 10
    pregunta: |
      La figura muestra las gráficas de una función $y(x)$ y la de su
      derivada. Calcular el valor aproximado del área de la región sombreada.
