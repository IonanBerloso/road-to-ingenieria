    opciones:
      - texto: '9,3'
        porque: |-
          Supondría una producción media de $9{,}3/4\approx 2{,}3$ miles de
          litros al día, y la curva solo pasa de ese nivel en un tramo corto
          alrededor de $t=2$. Con un solo par de tramos, $h=2$, Simpson da
          $\frac{2}{3}(v_0+4v_2+v_4)\approx 9{,}2$, que salta todas las
          oscilaciones.
      - texto: '7,6'
        correcta: true
        porque: |-
          Con $h=0{,}5$ y los nueve valores de la cuadrícula ($2$; $2{,}25$;
          $1{,}75$; $2$; $2{,}5$; $1{,}75$; $1{,}25$; $1{,}75$; $1{,}75$),
          $\frac{0{,}5}{3}[v_0+4(v_1+v_3+v_5+v_7)$ $+\,2(v_2+v_4+v_6)+v_8]$
          $=\frac{45{,}75}{6}\approx 7{,}6$.
          Con $h=1$ saldría $6{,}9$, que no está entre las opciones.
      - texto: '5,8'
        porque: |-
          Supondría una producción media de $1{,}45$ miles de litros al día, y
          la curva solo baja de $1{,}5$ en dos tramos cortos, cerca de $t=3$ y
          de $t=3{,}85$.
      - texto: '10,2'
        porque: |-
          Es imposible: $v$ no pasa de $2{,}5$, así que en cuatro días la
          producción no puede llegar a $2{,}5\cdot 4=10$ miles de litros.
