    opciones:
      - texto: 'En el punto $x=0{,}67$ se obtendrá una aproximación por defecto.'
        porque: |-
          Es cierta, y aquí se busca la que no lo es: a la derecha de $0{,}66$
          la curva se dobla hacia arriba y queda por encima de la tangente, así
          que la tangente da un valor algo menor que el verdadero.
      - texto: 'En el punto $x=0{,}65$ se obtendrá una aproximación por exceso.'
        porque: |-
          Es cierta: a la izquierda de $0{,}66$ la curva se dobla hacia abajo
          y queda por debajo de la tangente, que se pasa. En
          $(0{,}66;\ 0{,}4)$ hay un punto de inflexión, y la curva cruza ahí
          su tangente.
      - texto: 'En el punto $x=0{,}69$ es en el que se obtendrá la peor aproximación.'
        porque: |-
          Es cierta: el error de la diferencial crece al alejarse del punto de
          tangencia, y $0{,}69$ está a $0{,}03$ de $0{,}66$, el triple que los
          otros dos.
      - texto: |-
          Si $y'(0{,}66)=-1{,}18$, empleando la diferencial: $y(0{,}69)\sim 0{,}36$
        porque: |-
          Es cierta: $y(0{,}69)\approx0{,}4-1{,}18\cdot0{,}03=0{,}3646$, que
          redondeado es $0{,}36$.
      - texto: |-
          Si $y'(0{,}66)=-1{,}18$, empleando la diferencial: $y(0{,}65)\sim 0{,}47$
        correcta: true
        porque: |-
          $y(0{,}65)\approx0{,}4+(-1{,}18)(-0{,}01)=0{,}4118$, unos $0{,}41$, y
          no $0{,}47$: esta es la afirmación que no se cumple. Con pendiente
          negativa, retroceder una centésima sube el valor en $0{,}0118$.

