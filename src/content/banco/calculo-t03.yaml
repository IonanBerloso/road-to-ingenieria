        <text class="cq3-comp-inversa-l" x="240.6" y="60.2" text-anchor="start" fill="var(--d1)">g(x)</text>
        <text class="cq3-comp-inversa-l" x="208.1" y="133.6" text-anchor="start" fill="var(--d3)">f(x)</text>
      </svg>
    opciones:
      - texto: '$1$'
        porque: |-
          Es $g(1)$, tomando $x=1$ como si fuera el único punto con $f(x)=2$.
          Hay tres: $x=1$, $x=3$ y $x=5$.
      - texto: '$3$'
        porque: |-
          Es uno de los $x$ con $f(x)=2$, sin aplicarle $g$. Y no es el único:
          $f$ vale $2$ también en $x=1$ y en $x=5$.
      - texto: '$4$'
        porque: |-
          Es $g(3)$, tomando $x=3$ como la antiimagen de $2$. Pero $f(1)$ y
          $f(5)$ también valen $2$, así que no hay una sola.
      - texto: '$1$ y $4$'
        porque: |-
          Trata $f^{-1}(2)$ como el conjunto de los $x$ con $f(x)=2$, y aquí
          $f^{-1}$ es la función inversa, que no existe. Ni aun así saldría
          esto: esos $x$ son $1$, $3$ y $5$, y $g(5)$ vale algo menos de $1$.
      - texto: No existe
        correcta: true
        porque: |-
          $f$ vale $2$ en tres puntos, $x=1$, $x=3$ y $x=5$, así que no es
          inyectiva y no tiene función inversa: $f^{-1}(2)$ no está definido,
          ni tampoco $g(f^{-1}(2))$.

  # Decisión: se marcan la B y la D. Las cuatro opciones cruzan «existe el
  # límite» con «se sabe su valor», y las dos ciertas son las complementarias:
  # no se sabe si existe, y si existe vale L. La D lo es con el convenio de la
  # caracterización por sucesiones, a_n ≠ a, que el enunciado no escribe: con
  # a_n = a para todo n fallaría (la función que vale 0 salvo en 0, donde vale
  # 1, da L = 1 y tiene límite 0). Leída al pie de la letra, solo la B.
  - id: una-sucesion-no-basta
    bloque: '3.5'
    varias: true
    diapositiva: 8
    pregunta: |
      Supongamos que $\{a_n\}_{n\in\mathbb{N}}$ es una sucesión que converge
      hacia el valor $a$. Supongamos que $y(x)$ es una función tal que

      $$
      \lim_{n\to\infty}\{y(a_n)\}=L
      $$

      ¿Cuál de las siguientes afirmaciones es cierta?
    opciones:
      - texto: '$y(x)$ tiene límite en el punto $x=a$ y este límite vale $L$.'
        porque: |-
          Una sola sucesión no basta: el límite exige que $y(a_n)\to L$ para
          todas las que tienden a $a$. Con $y(x)=\operatorname{sen}\frac{1}{x}$
          en $a=0$, la sucesión $a_n=\frac{1}{n\pi}$ da $y(a_n)=0$ para todo
          $n$, y el límite no existe.
      - texto: 'No puede saberse si $y(x)$ tiene límite en el punto $x=a$.'
        correcta: true
        porque: |-
          Con una sola sucesión no se decide: para que haya límite, todas las
          sucesiones que tienden a $a$ tienen que dar lo mismo. Puede existir,
          como con $y(x)=x$, o no, como con $y(x)=\operatorname{sen}\frac{1}{x}$
          en $a=0$ y $a_n=\frac{1}{n\pi}$.
      - texto: '$y(x)$ tiene límite en el punto $x=a$ pero no es posible saber cuál es el valor de este límite.'
        porque: |-
          Da por hecho que el límite existe, y una sola sucesión no lo
          garantiza: $\operatorname{sen}\frac{1}{x}$ no tiene límite en $0$
          aunque $a_n=\frac{1}{n\pi}$ dé $y(a_n)\to0$.
      - texto: 'En el caso de que el límite de $y(x)$ exista, su valor debe ser $L$.'
        correcta: true
        porque: |-
          Si el límite existe, toda sucesión que tienda a $a$ sin tomar el
          valor $a$ lleva $y(a_n)$ a ese límite, y esta lleva a $L$: tiene que
          ser $L$. Una sucesión no dice si el límite existe, pero sí cuánto
          vale si existe. Se sobreentiende $a_n\neq a$: la sucesión constante
          $a_n=a$ solo mira $y(a)$, que no cuenta para el límite.

  - id: tantear-por-la-derecha
    bloque: '3.5'
    diapositiva: 9
    pregunta: |
      Estás tratando de adivinar el valor de $\lim_{x\to a}y(x)$ para cierta
      función $y(x)$. Supongamos que calculas $y(a+0{,}1)$, $y(a+0{,}01)$,
      $y(a+0{,}001)$, $y(a+0{,}0001)$, etc. y obtienes que estos valores son
      siempre $0$. Entonces, ¿puedes asegurar que $\lim_{x\to a}y(x)=0$?
    opciones:
      - texto: Sí
        porque: |-
          Esos puntos son una sola sucesión, y todos a la derecha de $a$.
          $y(x)=\operatorname{sen}\frac{\pi}{x-a}$ vale $0$ en todos ellos,
          porque $\frac{\pi}{10^{-k}}=10^k\pi$, y no tiene límite en $a$:
          oscila entre $-1$ y $1$.
      - texto: 'No'
        correcta: true
        porque: |-
          Has probado una sola sucesión, y solo por la derecha. Para asegurar
          el límite hace falta que $y(x)$ se acerque a $0$ para todos los $x$
          cercanos a $a$, y $y(x)=\operatorname{sen}\frac{\pi}{x-a}$ vale $0$
          en todos los puntos que calculas y no tiene límite.

  # Decisión: la A es verdadera como consecuencia (si hay límite, coincide con el
  # lateral derecho, que vale L), pero no es lo que significa la condición,
  # que es exactamente la definición del lateral derecho: la B.
  - id: limite-lateral-derecho-por-sucesiones
    bloque: '3.5'
    diapositiva: 10
    pregunta: |
      Sea $y(x)$ una función. ¿Qué significa la siguiente condición?

      $$
      \forall\{a_n\}_{n\in\mathbb{N}}\ /\ \lim_{n\to\infty}a_n=a\ \wedge\ a_n>a\ \Rightarrow\ \lim_{n\to\infty}y(a_n)=L
      $$
    opciones:
      - texto: 'El límite de $y(x)$ en el punto $x=a$, si existe, es igual a $L$.'
        porque: |-
          Es una consecuencia, no lo que significa: la condición solo mira
          sucesiones por la derecha, y dice que el límite lateral derecho
          existe y vale $L$. El límite completo puede no existir, si por la
          izquierda la función se acerca a otra cosa.
      - texto: 'El límite lateral derecho de $y(x)$ en el punto $x=a$ es igual a $L$.'
        correcta: true
        porque: |-
          Es la definición del límite lateral derecho con sucesiones: todas
          las que tienden a $a$ por la derecha, con $a_n>a$, llevan $y(a_n)$
          a $L$.
      - texto: 'El límite lateral izquierdo de $y(x)$ en el punto $x=a$ es igual a $L$.'
        porque: |-
          Los $a_n$ cumplen $a_n>a$: se acercan a $a$ por la derecha. Del lado
          izquierdo la condición no dice nada.

  # Decisión: la A también es verdadera como consecuencia (si hay límite,
  # coincide con el lateral izquierdo). Ninguna opción equivale exactamente a
  # la condición; la C es la más precisa (implica la A) y la que se marca.
  - id: limite-lateral-izquierdo-por-una-sucesion
    bloque: '3.5'
    diapositiva: 11
    pregunta: |
      Sea $y(x)$ una función. ¿Qué significa la siguiente condición?

      $$
      \exists\{a_n\}_{n\in\mathbb{N}}\ /\ \lim_{n\to\infty}a_n=a\ \wedge\ a_n<a\ \wedge\ \lim_{n\to\infty}y(a_n)=L
      $$
    opciones:
      - texto: 'El límite de $y(x)$ en el punto $x=a$, si existe, es igual a $L$.'
        porque: |-
          Es cierto, pero se queda corto: una sucesión por la izquierda dice
          algo más fino, que el límite lateral izquierdo, si existe, vale $L$.
          La A sale de ahí, porque si hay límite coincide con los laterales.
      - texto: 'El límite lateral izquierdo de $y(x)$ en el punto $x=a$ es igual a $L$.'
        porque: |-
          La condición dice «existe una sucesión», no «todas»: una sola no
          garantiza que el lateral exista. $y(x)=\operatorname{sen}\frac{1}{x}$
          con $a_n=-\frac{1}{n\pi}$ da $y(a_n)=0$ y no tiene límite por la
          izquierda en $0$.
      - texto: 'El límite lateral izquierdo de $y(x)$ en el punto $x=a$, si existe, es igual a $L$.'
        correcta: true
        porque: |-
          Si el límite por la izquierda existe, todas las sucesiones que
          llegan a $a$ por la izquierda dan ese valor, y esta da $L$: tiene que
          ser $L$. Que exista no se puede asegurar con una sola sucesión, y
          por eso el «si existe».
      - texto: 'No existe límite de $y(x)$ en el punto $x=a$.'
        porque: |-
          Nada lo impide: con $y(x)=x$, cualquier sucesión que tienda a $a$
          por la izquierda cumple la condición con $L=a$, y el límite existe.

  - id: limite-y-cercania
    bloque: '3.7'
    diapositiva: 12
    pregunta: |
      La siguiente afirmación ¿es correcta o incorrecta?

      La expresión $\lim_{x\to a}y(x)=L$ significa que si el punto $x=x_1$
      está más cerca de $x=a$ que el punto $x=x_2$ entonces $y(x_1)$ estará
      más cerca de $L$ que $y(x_2)$.
    opciones:
      - texto: Correcta
        porque: |-
          El límite no ordena las distancias: solo dice que $y(x)$ queda tan
          cerca de $L$ como se quiera si $x$ está lo bastante cerca de $a$.
          $y(x)=x\operatorname{sen}\frac{1}{x}$ tiende a $0$ en $0$, y
          $x_1=\frac{2}{5\pi}$, más cerca de $0$ que $x_2=\frac{1}{\pi}$, da
          $y(x_1)=\frac{2}{5\pi}$, más lejos de $0$ que $y(x_2)=0$.
      - texto: Incorrecta
        correcta: true
        porque: |-
          El límite promete cercanía, no orden: para cada margen alrededor de
          $L$ hay un entorno de $a$ en el que $y(x)$ no se sale de ese margen,
          pero dentro puede subir y bajar. $x\operatorname{sen}\frac{1}{x}$ tiende a $0$ y
          vale $0$ en $\frac{1}{\pi}$ pero no en $\frac{2}{5\pi}$, que está más
          cerca de $0$.

  - id: el-limite-no-mira-el-punto
    bloque: '3.7'
    diapositiva: 13
    pregunta: |
      El hecho de que exista o no exista

      $$
      \lim_{x\to a}y(x)=L
      $$

      depende de cómo esté definido el valor $y(a)$.
    opciones:
      - texto: Siempre
        porque: |-
          El límite no mira el punto: la definición solo usa los $x$ con
          $0<|x-a|<\delta$, y $x=a$ queda fuera. Cambiar $y(a)$, o no
          definirlo, no cambia el límite.
      - texto: Nunca
        correcta: true
        porque: |-
          La definición de límite solo usa los $x$ con $0<|x-a|<\delta$, así
          que el valor en $x=a$ no interviene. $y(x)=\frac{x^2}{x}$ no está
          definida en $0$ y tiene límite $0$, el mismo que $y(x)=x$.
      - texto: A veces
        porque: |-
          En ningún caso depende: lo que decide $y(a)$ es la continuidad, que
          pide además que el límite coincida con $y(a)$. El límite solo mira
          alrededor.

  - id: limite-donde-no-esta-definida
    bloque: '3.7'
    diapositiva: 14
    pregunta: |
      Si $y(x)$ no está definida en punto $x=a$, entonces ¿qué puede
      afirmarse del valor $\lim_{x\to a}y(x)=L$?
    opciones:
      - texto: No existe
        porque: |-
          El límite no necesita el valor en $a$:
          $\frac{\operatorname{sen}x}{x}$ no está definida en $0$ y su límite
          ahí vale $1$.
      - texto: Puede ser 0
        correcta: true
        porque: |-
          Puede ser $0$, o cualquier otro número: $y(x)=\frac{x^2}{x}$ no está
          definida en $0$ y su límite ahí es $0$. Que falte $y(a)$ no dice
          nada del límite, porque la definición no mira ese punto.
      - texto: Debe ser infinito
        porque: |-
          Confunde «no definida» con «se dispara»: $\frac{1}{x^2}$ tiende a
          infinito en $0$, pero $\frac{x^2}{x}$ tampoco está definida en $0$ y
          tiende a $0$.
      - texto: Ninguna de las anteriores respuestas es cierta
        porque: |-
          La B lo es: $\frac{x^2}{x}$ no está definida en $x=0$ y tiene límite
          $0$ en ese punto.

  - id: cero-entre-cero
    bloque: '3.7'
    diapositiva: 15
    pregunta: |
      Si $\lim_{x\to a}f(x)=0$ y $\lim_{x\to a}g(x)=0$, entonces ¿qué puede
      afirmarse del siguiente valor?

      $$
      \lim_{x\to a}\frac{f(x)}{g(x)}
      $$
    opciones:
      - texto: No existe
        porque: |-
          Puede existir: con $f(x)=g(x)=x-a$ el cociente vale $1$ cerca de $a$
          y el límite es $1$.
      - texto: Tiene que existir
        porque: |-
          Puede no existir: con $f(x)=x-a$ y $g(x)=(x-a)^2$ el cociente es
          $\frac{1}{x-a}$, que por la derecha se va a $+\infty$ y por la
          izquierda a $-\infty$.
      - texto: No hay suficiente información
        correcta: true
        porque: |-
          $0/0$ es una indeterminación: según cómo vayan $f$ y $g$ a cero, el
          límite es cualquier número o no existe. $\frac{2(x-a)}{x-a}\to2$,
          $\frac{(x-a)^2}{x-a}\to0$ y $\frac{x-a}{(x-a)^2}$ no tiene límite.

  - id: cociente-de-dos-rectas
    bloque: '3.7'
    diapositiva: 16
    pregunta: |
      Considerar las funciones lineales $f(x)$ y $g(x)$ cuya gráfica muestra
      la figura. ¿Qué puede asegurarse del siguiente valor?

      $$
      \lim_{x\to a}\frac{f(x)}{g(x)}
      $$
