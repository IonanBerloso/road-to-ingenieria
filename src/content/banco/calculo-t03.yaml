    opciones:
      - texto: '$D=[0,1]$'
        porque: |-
          En $[0,1]$ la función solo sube: el mínimo está un poco a la
          izquierda del eje $y$, así que desde $x=0$ ya va hacia arriba. Es
          inyectiva y tiene inversa.
      - texto: '$D=[-3,0]$'
        correcta: true
        porque: |-
          El mínimo no cae en el eje $y$, sino un poco a su izquierda, hacia
          $x\approx-0{,}3$: en $[-3,0]$ la función baja hasta ahí y vuelve a
          subir un poco hasta $f(0)=-3$. Los valores de entre el mínimo y $-3$
          se alcanzan dos veces, así que no es inyectiva y no hay inversa.
      - texto: '$D=[-3,-1]\cup(2,3]$'
        porque: |-
          Parece la trampa y no lo es: en $[-3,-1]$ la función baja de
          $f(-3)=1$ a unos $-2{,}7$, y en $(2,3]$ sube de $1$ a unos $3{,}8$
          sin llegar a tomar el $1$, porque $x=2$ se queda fuera. Los dos
          trozos no comparten ningún valor: es inyectiva y tiene inversa
          aunque $D$ no sea un intervalo.
      - texto: '$D=[4,5]$'
        porque: |-
          El máximo está justo antes de $x=4$, así que en $[4,5]$ la función
          solo baja, de $5$ a $2$: es inyectiva y tiene inversa.
      - texto: '$D=[2,3]$'
        porque: |-
          Entre $2$ y $3$ la función sube sin parar, de $1$ a unos $3{,}8$: es
          inyectiva y tiene inversa.
      - texto: '$D=[1,3]$'
        porque: |-
          En $[1,3]$ la función solo sube, de unos $-1{,}6$ a unos $3{,}8$,
          lejos de los dos extremos: tiene inversa.

  - id: inversa-de-una-rama-de-parabola
    bloque: '3.3'
    diapositiva: 2
    pregunta: |
      Considerar la función $y(x)=(x-1)^2,\ x<1$

      Calcular la función inversa $y^{-1}(x)$
    opciones:
      - texto: '$y^{-1}(x)=(x-1)^{-2}$'
        porque: |-
          Es $\frac{1}{(x-1)^2}$, la función recíproca: confunde el $-1$ de
          $y^{-1}$, que quiere decir inversa para la composición, con el
          exponente $-1$ de $1/y$.
      - texto: '$y^{-1}(x)=\frac{1}{(x-1)^2}$'
        porque: |-
          Es la A escrita de otra forma: $1/y(x)$, el recíproco, no la función
          que deshace $y$. Por ejemplo, $y(-1)=4$, así que la inversa tiene que
          llevar el $4$ al $-1$, y esta da $\frac{1}{9}$.
      - texto: '$y^{-1}(x)=1+\sqrt{x}$'
        porque: |-
          Es la inversa de la otra rama, la de $x>1$: devuelve valores mayores
          que $1$, y el dominio de partida es $x<1$. Al despejar
          $x-1=\pm\sqrt{y}$ hay que quedarse con el signo menos, porque
          $x-1<0$.
      - texto: '$y^{-1}(x)=1-\sqrt{x}$'
        correcta: true
        porque: |-
          De $y=(x-1)^2$ sale $x-1=\pm\sqrt{y}$, y como $x<1$, $x-1$ es
          negativo: $x=1-\sqrt{y}$. Cambiando los nombres,
          $y^{-1}(x)=1-\sqrt{x}$, que devuelve valores menores que $1$, como
          tiene que ser.

