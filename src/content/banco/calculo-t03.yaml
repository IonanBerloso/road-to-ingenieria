      ¿Es correcto el siguiente razonamiento, que hace uso de la regla de
      L'Hôpital?

      $$
      L=\lim_{x\to\infty}\frac{x+\operatorname{sen}x}{x}=\frac{\infty}{\infty}=\left[\text{L'Hopital}\right]=\lim_{x\to\infty}\frac{1+\cos x}{1}
      $$

