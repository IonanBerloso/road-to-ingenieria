    opciones:
      - texto: '$2$'
        porque: |-
          Es $f'(4)$, la pendiente de la gráfica: falta multiplicar por la
          velocidad de $P$, $5$ cm/s.
      - texto: '$4$'
        porque: |-
          Es $f(4)$, lo que mide $h$ en ese instante, no lo deprisa que
          cambia.
      - texto: '$10$'
        correcta: true
        porque: |-
          $h$ es la altura de la gráfica encima de $P$: $h=f(x)$, con $x$ la
          posición de $P$. Por la regla de la cadena,
          $\frac{dh}{dt}=f'(x)\frac{dx}{dt}=f'(4)\cdot5=2\cdot5=10$ cm/s, con
          $f'(4)=2$ leído en la gráfica de $f'$.
      - texto: '$5/2$'
        porque: |-
          Divide entre $f'(4)$ en lugar de multiplicar: la regla de la cadena
          da $\frac{dh}{dt}=f'(4)\cdot\frac{dx}{dt}$.

  - id: regla-de-la-cadena-con-unidades
    bloque: '3.12.6'
    diapositiva: 42
    pregunta: |
      Un corredor está corriendo los 1000 metros lisos. Consideremos las
      siguientes variables: $v$=velocidad a la que se está desplazando (en
      Km/h); $r$=ritmo cardíaco (en pulsaciones/minuto); $c$=velocidad de
      circulación sanguínea (en cm/s). Consideremos las funciones $c(r)$ y
      $r(v)$. Supongamos que en un momento de la carrera, su ritmo cardíaco
      está aumentando a razón 10 pulsaciones/minuto por cada Km/h que el
      corredor aumenta su velocidad; y que la velocidad de circulación de su
      sangre aumenta en 0,01 cm/s por cada pulsación/minuto que aumenta su
      ritmo cardíaco. Calcular en ese mismo instante el ritmo con el que
      cambia su velocidad de circulación sanguínea respecto a su velocidad de
      desplazamiento.
    opciones:
      - texto: 0,1 (cm/s)/(Km/h)
        correcta: true
        porque: |-
          Por la regla de la cadena,
          $\frac{dc}{dv}=\frac{dc}{dr}\cdot\frac{dr}{dv}=0{,}01\cdot10=0{,}1$,
          y las pulsaciones por minuto se simplifican: quedan cm/s por cada
          km/h.
      - texto: 0,1 (pulsaciones/minuto)/(Km/h)
        porque: |-
          El número es el bueno, pero esas son las unidades de
          $\frac{dr}{dv}$. Lo que se pide es cuánto cambia la circulación, en
          cm/s, por cada km/h.
      - texto: 0,001 (Km/h)/(pulsaciones/minuto)
        porque: |-
          Divide las dos razones en lugar de multiplicarlas, $0{,}01/10$, y
          da unas unidades que no son las de $\frac{dc}{dv}$.
      - texto: 0,001 (pulsaciones/minuto)/(cm/s)
        porque: |-
          Divide en lugar de multiplicar y deja al revés las unidades: la regla
          de la cadena da $\frac{dc}{dv}=\frac{dc}{dr}\cdot\frac{dr}{dv}=0{,}01\cdot10$.

