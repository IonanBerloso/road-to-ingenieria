      - texto: '$3$'
        porque: |-
          La figura no da ese número: cuando $s=4$, $h=f(4)=4$ y $f'(4)=2$, y
          lo que se pide es $\frac{ds}{dh}=\frac{1}{f'(4)}$.
      - texto: '$4$'
        porque: |-
          Es $h=f(4)$, la altura de $P$ cuando $s=4$, no la razón de cambio.
      - texto: '$2$'
        porque: |-
          Es $\frac{dh}{ds}=f'(4)$, lo que cambia $h$ por cada unidad de $s$.
          Se pide al revés, $\frac{ds}{dh}$, que es su inversa: $\frac{1}{2}$.
      - texto: '$0{,}5$'
        correcta: true
        porque: |-
          $h=f(s)$, así que $\frac{dh}{ds}=f'(s)$ y, por la derivada de la
          función inversa, $\frac{ds}{dh}=\frac{1}{f'(s)}$. En $s=4$ la
          gráfica de $f'$ da $f'(4)=2$: $\frac{ds}{dh}=\frac{1}{2}=0{,}5$.

  - id: interpretacion-de-la-inversa
    bloque: '3.12.7'
    diapositiva: 44
    pregunta: |
      Supongamos que el nivel de un río está aumentando en las últimas horas
      debido a las fuertes lluvias. Sea $y(t)$ el nivel (en cm) que tiene su
      caudal por encima del nivel de seguridad, en el instante $t$ (en horas).
      ¿Cómo se interpreta el siguiente dato?

      $$
      \left(y^{-1}\right)'(5)=2
      $$
    opciones:
      - texto: >-
          En el momento en que el nivel del agua era de 2 cm, el ritmo del
          tiempo que transcurría por cada cm de subida de nivel era de 5 horas.
        porque: |-
          Cambia los papeles del $5$ y del $2$: el $5$ es el nivel, lo que
          entra en $y^{-1}$, y el $2$ es lo que vale la derivada, en horas por
          centímetro.
      - texto: 'A las dos de la mañana, el ritmo de caída de lluvia era de 5 cm por hora'
        porque: |-
          $y^{-1}$ no da la lluvia en función de la hora: da el instante en
          que el río alcanza cada nivel. Y la lluvia no aparece en el dato.
      - texto: >-
          En el momento en que el nivel del agua era de 5 cm, el ritmo del
          tiempo que transcurría por cada cm de subida de nivel era de 2 horas.
        correcta: true
        porque: |-
          $y^{-1}$ lleva cada nivel al instante en que se alcanza, así que su
          derivada se mide en horas por centímetro. $\left(y^{-1}\right)'(5)=2$:
          cuando el nivel era de $5$ cm, cada centímetro más de subida tardaba
          unas $2$ horas.
      - texto: 'A las cinco de la mañana, el ritmo de caída de lluvia era de 2 cm por hora'
        porque: |-
          Lee el $5$ como una hora y el $2$ como lluvia: el $5$ es un nivel del
          río, en cm, y el $2$ son horas por cada cm que sube.

  - id: bote-amarrado-al-muelle
    bloque: '3.12.8'
    diapositiva: 45
    pregunta: |
      Un bote está amarrado al muelle, como muestra la figura. Si desde el
      muelle tiramos de la cuerda a una velocidad de 20 cm/s, ¿a qué velocidad
      se aproximará el bote al muelle?
    figura: |
      <svg viewBox="0 0 340 210" role="img" width="340" height="210"
           aria-labelledby="cq3-bote-t cq3-bote-d">
