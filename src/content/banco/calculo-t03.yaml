asignatura: calculo
tema: t03-funciones-reales
titulo: Las cuestiones de las diapositivas del tema 3
fuente: >-
  Las diapositivas de clase del tema 3 de Cálculo, «Funciones reales de una
  variable real» (UPV/EHU): cuarenta y siete preguntas tipo test para las
  cuestiones en grupo y para el oral de la final y de la extraordinaria. Las
  diapositivas no traen la solución: la respuesta y el porqué de cada opción
  son de este sitio, y las figuras están redibujadas.
diapositivas: 47
bloques:
  - { id: '3.3', titulo: La función inversa }
  - { id: '3.4', titulo: Composición de funciones }
  - { id: '3.5', titulo: Límite y límites laterales }
  - { id: '3.7', titulo: Concepto de límite e indeterminaciones }
  - { id: '3.10', titulo: Indeterminaciones y asíntotas horizontales }
  - { id: '3.11', titulo: Concepto de continuidad }
  - { id: '3.11.3-4', titulo: Teoremas de las funciones continuas }
  - { id: '3.12.1-2', titulo: Derivada y velocidad de cambio }
  - { id: '3.12.5', titulo: La diferencial }
  - { id: '3.12.6', titulo: Regla de la cadena }
  - { id: '3.12.7', titulo: Derivada de la función inversa }
  - { id: '3.12.8', titulo: Derivada de una función implícita }
  - { id: '3.13', titulo: "Regla de L'Hôpital" }
