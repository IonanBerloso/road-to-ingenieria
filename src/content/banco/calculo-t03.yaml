    opciones:
      - texto: '$[-2,2]$'
        porque: |-
          Se queda corta y cierra los extremos: en $(-1,3)$ la función sube
          desde $-2$ hasta $4$ sin tomar ninguno de los dos, y el $2$ lo
          alcanza hacia $x\approx1{,}5$, en mitad de $D$.
      - texto: '$[-2,4]$'
        porque: |-
          Son los valores buenos, pero con los extremos dentro. $D$ es
          abierto: $x=-1$ y $x=3$ no están, así que $f$ no llega a valer ni
          $-2$ ni $4$ y el intervalo imagen es abierto.
      - texto: '$[-3,-1]\cup[2,3]$'
        porque: |-
          Mezcla los ejes: son trozos del eje $x$, no valores de la función.
          El dominio de la inversa son los valores que toma $f$ en $D$, y esos
          se leen en el eje $y$.
      - texto: '$(-2,2)$'
        porque: |-
          Los paréntesis están bien, pero se para en $2$: la función sigue
          subiendo y se acerca a $4$ cuando $x$ se acerca a $3$.
      - texto: '$(-2,4)$'
        correcta: true
        porque: |-
          En $(-1,3)$ la función es creciente, así que es inyectiva, y sus
          valores van de $f(-1)=-2$ a $f(3)=4$ sin tomar ninguno de los dos,
          porque $D$ es abierto. El dominio de la inversa es el recorrido de
          $f$ en $D$: $(-2,4)$.
      - texto: '$(0,4)$'
        porque: |-
          Empieza donde la gráfica corta el eje $x$, hacia $x\approx0{,}5$,
          pero $D$ empieza en $x=-1$: entre $-1$ y $0{,}5$ la función toma
          todos los valores de entre $-2$ y $0$.

  - id: grafica-de-la-inversa
    bloque: '3.3'
    diapositiva: 4
    pregunta: |
      ¿Cuál de las tres funciones $u(x)$, $v(x)$, $w(x)$ corresponde a la
      inversa de $y(x)$?
    figura: |
      <svg viewBox="0 0 340 370" role="img" width="340" height="370"
           aria-labelledby="cq3-inversa-t cq3-inversa-d">
        <title id="cq3-inversa-t">Cuatro funciones: y, u, v y w</title>
        <desc id="cq3-inversa-d">Cuatro curvas sobre una cuadrícula de lado 1. y(x) sube despacio de izquierda a derecha, pasa por (0, 2) con la tangente vertical y por (1, 3), y llega a unos 3,8 en x = 6. u(x) sube muy empinada desde abajo, pasa por (1, −1), se aplana en (2, 0) con la tangente horizontal y sigue subiendo por (3, 1). v(x) es u al revés: baja desde arriba, pasa por (1, 1), se aplana en (2, 0) y sigue bajando por (3, −1). w(x) es y al revés: baja despacio, pasa por (0, −2) con la tangente vertical y por (1, −3).</desc>
