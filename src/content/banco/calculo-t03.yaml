        <text class="cq3-inversa-l" x="272.7" y="97.7" text-anchor="middle" fill="var(--d3)">y(x)</text>
        <text class="cq3-inversa-l" x="224.6" y="58.1" text-anchor="end" fill="var(--d2-tinta)">u(x)</text>
        <text class="cq3-inversa-l" x="155.8" y="162.3" text-anchor="start" fill="var(--d1)">v(x)</text>
        <text class="cq3-inversa-l" x="199.5" y="323.7" text-anchor="middle" fill="var(--graphite)">w(x)</text>
      </svg>
    opciones:
      - texto: '$u(x)$'
        correcta: true
        porque: |-
          La gráfica de la inversa es la de $y$ reflejada en la recta $y=x$.
          La de $y(x)$ pasa por $(0,2)$ con la tangente vertical y por
          $(1,3)$; su reflejo pasa por $(2,0)$ con la tangente horizontal y
          por $(3,1)$, y esa es $u$.
      - texto: '$v(x)$'
        porque: |-
          $v$ es $u$ reflejada en el eje $x$: baja donde $u$ sube. La inversa
          de una función creciente, como $y$, también es creciente.
      - texto: '$w(x)$'
        porque: |-
          $w$ es la gráfica de $y$ reflejada en el eje $x$, es decir, $-y(x)$:
          la opuesta, no la inversa. La inversa se refleja en la recta $y=x$.
      - texto: Ninguna de las tres
        porque: |-
          La $u$ lo es: el reflejo de la gráfica de $y$ en la recta $y=x$
          coincide con ella punto por punto. Por ejemplo, $(1,3)$ está en la
          de $y$ y $(3,1)$ en la de $u$, y las dos se cortan sobre la recta
          $y=x$.

  - id: trigonometricas-inversas-en-pi
    bloque: '3.3'
    diapositiva: 5
    pregunta: |
      Las siguientes igualdades ¿son verdaderas o falsas?

      1. $\operatorname{arctg}(\operatorname{tg}(\pi))=\pi$
      2. $\operatorname{arcsen}(\operatorname{sen}(\pi))=\pi$
      3. $\arccos(\cos(\pi))=\pi$
    opciones:
      - texto: Las tres son verdaderas
        porque: |-
          Lo serían si cada función inversa deshiciera siempre a la directa, y
          eso solo pasa dentro de su rango: la arcotangente devuelve ángulos
          de $(-\pi/2,\pi/2)$ y el arcoseno de $[-\pi/2,\pi/2]$, y ahí no está
          $\pi$.
      - texto: Las tres son falsas
        porque: |-
          La 3 es verdadera: $\cos(\pi)=-1$ y $\arccos(-1)=\pi$, porque el
          arcocoseno devuelve ángulos de $[0,\pi]$, y $\pi$ está en ese
          intervalo.
      - texto: Sólo es verdadera la 1
        porque: |-
          $\operatorname{tg}(\pi)=0$ y $\operatorname{arctg}(0)=0$, no $\pi$:
          la arcotangente solo devuelve ángulos de $(-\pi/2,\pi/2)$.
      - texto: Sólo es verdadera la 2
        porque: |-
          $\operatorname{sen}(\pi)=0$ y $\operatorname{arcsen}(0)=0$: el
          arcoseno devuelve el ángulo de $[-\pi/2,\pi/2]$ con ese seno, que es
          el $0$ y no el $\pi$.
      - texto: Sólo es verdadera la 3
        correcta: true
        porque: |-
          $\operatorname{arctg}(\operatorname{tg}\pi)=\operatorname{arctg}0=0$
          y $\operatorname{arcsen}(\operatorname{sen}\pi)=\operatorname{arcsen}0=0$,
          pero $\arccos(\cos\pi)=\arccos(-1)=\pi$. Solo el arcocoseno devuelve
          ángulos de $[0,\pi]$, que es donde está $\pi$.

  - id: composicion-multiple
    bloque: '3.4'
    diapositiva: 6
    pregunta: |
      Considerar las dos funciones cuyas gráficas muestra la figura. Calcular
      el valor de $f(g(f(g(2))))$.
