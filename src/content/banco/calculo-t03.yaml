    opciones:
      - texto: 'La función es continua en $x=5$'
        correcta: true
        porque: |-
          En $x=5$ la gráfica pasa sin saltos ni huecos: la función está
          definida ahí y los valores de alrededor se acercan a $y(5)$, unos
          $3{,}9$. Existe el valor, existe el límite y coinciden.
      - texto: 'La función no es continua en $x=5$'
        porque: |-
          Nada en $x=5$ la rompe: la curva pasa por ahí seguida, cerca de su
          máximo. Una discontinuidad se vería como un salto o un punto hueco.
      - texto: Falta información
        porque: |-
          La gráfica da lo necesario: si faltara el punto o estuviera
          desplazado, se dibujaría con un círculo hueco, como en las dos
          preguntas siguientes. Aquí la curva sigue sin cortes.

  # Decisión: con el convenio de mirar solo los puntos del dominio, la función es
  # continua (x = 5 no está en el dominio: los dos círculos son huecos), y la
  # buena sería la A. Se marca la B con la definición del tema —existe y(5),
  # existe el límite y coinciden—, que en x = 5 falla dos veces.
