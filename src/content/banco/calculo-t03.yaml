        <desc id="cq3-comp-inversa-d">Dos curvas sobre una cuadrícula de lado 1. f sale del origen, pasa por (1, 2), llega a su máximo, unos 2,7, hacia x = 2, baja pasando por (3, 2) hasta su mínimo, 1, hacia x = 4,25, y sube hasta terminar en (5, 2). g empieza en x = 0 a unos −0,8, pasa por (1, 1) y por (3, 4), llega a su máximo, algo más de 4, hacia x = 3,3, y cae hasta terminar en x = 5 por debajo de 1.</desc>
