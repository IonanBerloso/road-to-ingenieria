    opciones:
      - texto: Infinito
        porque: |-
          Haría falta que $f'$ creciera mucho más deprisa que $g'$, y en la
          figura $f'$ vale más o menos el doble que $g'$: el cociente se queda
          cerca de $2$.
      - texto: '$0{,}5$'
        porque: |-
          Es $\frac{g'}{f'}$, el cociente al revés: la recta de $f'$ es la más
          empinada, así que $\frac{f'}{g'}$ ronda $2$.
      - texto: '$2$'
        correcta: true
        porque: |-
          Las dos derivadas son rectas por el origen, $f'(x)\approx2x$ y
          $g'(x)\approx x$: su cociente vale $2$ en todo lo que se ve. Si
          siguen así, $f$ y $g$ crecen sin límite, como $x^2$ y $\frac{x^2}{2}$,
          y L'Hôpital da $L=\lim\frac{f'}{g'}=2$. Es una estimación, que es lo
          que se pide: la figura solo enseña el tramo de $0$ a $0{,}22$.
      - texto: '$0$'
        porque: |-
          Saldría si $f'$ fuera despreciable frente a $g'$, y es al revés: en
          toda la figura $f'$ vale casi el doble que $g'$.
