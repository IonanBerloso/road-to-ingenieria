          Dice que el límite en $+\infty$ es $R$, y eso es verdad, pero no
          dice lo que se ve en la figura: que la gráfica llega a $R$ siempre
          por debajo. Eso es lo que añade la B.
      - texto: '$\forall\delta>0\ \exists N\in\mathbb{R}\ /\ y(x)\in(R-\delta,R)\ \forall x>N$'
        correcta: true
        porque: |-
          La gráfica se acerca a la recta $y=R$ sin cruzarla, siempre por
          debajo: a partir de un $N$, los valores quedan tan cerca de $R$ como
          se quiera y son menores que $R$. Es un límite $R$ al que se llega
          por debajo.
      - texto: '$\forall\delta>0\ \exists N\in\mathbb{R}\ /\ y(x)\in(R-\delta,R+\delta)\ \forall x<N$'
        porque: |-
          Con $x<N$ habla de lo que pasa hacia $-\infty$, y la figura enseña
          lo que pasa al avanzar hacia la derecha, hacia $+\infty$.
      - texto: '$\forall\delta>0\ \exists N\in\mathbb{R}\ /\ y(x)\in(R,R+\delta)\ \forall x>N$'
        porque: |-
          Pone los valores por encima de $R$, y la gráfica se acerca por
          debajo de la recta $y=R$, sin llegar a cruzarla.

