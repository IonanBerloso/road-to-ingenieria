  # Decisión (dibujo): el original, mirado a 600 ppp, toca fondo en x ≈ −0,25, a
  # la izquierda del eje, y pasa por (−3, 1) y por (2, 1). Con el 2 fuera de
  # (2,3], la C es inyectiva y la única sin inversa es la B. Quien lea el
  # mínimo en x = 0 no encuentra ninguna, o elige la C creyendo que sus dos
  # trozos repiten valores. Se redibuja con la cuártica que pasa por (−3, 1),
  # (0, −3), (2, 1), (4, 5) y (5, 2): corta el eje en −2,42 y 1,66 y tiene el
  # máximo en x ≈ 3,87, como el original, y el mínimo en x ≈ −0,30.
