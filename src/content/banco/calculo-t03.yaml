        <desc id="cq3-bote-d">Un bote flota en el agua, a la izquierda. De su proa sale una cuerda tensa que sube en diagonal hasta lo alto del borde del muelle, a la derecha, y desde ahí sigue horizontal por encima del muelle, con una flecha que indica hacia dónde se tira de ella.</desc>
        <style>
            .cq3-bote-eje { stroke: var(--rule); stroke-width: 1.1; fill: none; }
            .cq3-bote-c { stroke: var(--d1); stroke-width: 2.8; fill: none; }
            .cq3-bote-c2 { stroke: var(--alt); stroke-width: 2.8; fill: none; }
            .cq3-bote-cp { stroke: var(--d1); stroke-width: 2.4; fill: none; stroke-dasharray: 6 4; }
            .cq3-bote-cp2 { stroke: var(--alt); stroke-width: 2.4; fill: none; stroke-dasharray: 6 4; }
