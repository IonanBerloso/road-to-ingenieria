    opciones:
      - texto: A 20 cm/s
        porque: |-
          Solo si la cuerda fuera horizontal. Va inclinada, y con $x$ la
          distancia horizontal y $L$ la cuerda, $x'=\frac{L}{x}L'$: como $L$ es
          más larga que $x$, el bote va más deprisa que la cuerda.
      - texto: A más de 20 cm/s
        correcta: true
        porque: |-
          Con $x$ la distancia horizontal del bote al muelle, $a$ la altura a
          la que sube la cuerda y $L$ su longitud, $L^2=x^2+a^2$. Derivando,
          $2L\,L'=2x\,x'$, así que $x'=\frac{L}{x}L'$, y como $L>x$ el bote se
          mueve más deprisa que los $20$ cm/s de la cuerda.
      - texto: A menos de 20 cm/s
        porque: |-
          Es la intuición de que la inclinación resta, y la cuenta dice lo
          contrario: de $L^2=x^2+a^2$ sale $x'=\frac{L}{x}L'$, con
          $\frac{L}{x}>1$. Cuanto más cerca está el bote, más deprisa se
          acerca.

