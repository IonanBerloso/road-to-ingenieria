    opciones:
      - texto: '$\forall\delta>0\ \exists N\in\mathbb{R}\ /\ y(x)\in(R-\delta,R+\delta)\ \forall x>N$'
        correcta: true
        porque: |-
          La flecha del eje $x$ apunta a la izquierda: $x$ crece hacia ese
          lado, y $x\to\infty$ es avanzar hacia allí. Por ese lado la gráfica
          oscila alrededor de $R$, por encima y por debajo, con ondas cada vez
          más pequeñas: el límite es $R$ y hay que dejar margen a los dos
          lados.
      - texto: '$\forall\delta>0\ \exists N\in\mathbb{R}\ /\ y(x)\in(R-\delta,R)\ \forall x<N$'
        porque: |-
          Tiene dos fallos: $x<N$ describe $x\to-\infty$, que aquí queda a la
          derecha, y el intervalo solo admite valores por debajo de $R$,
          cuando la gráfica oscila a los dos lados.
      - texto: '$\forall\delta>0\ \exists N\in\mathbb{R}\ /\ y(x)\in(R-\delta,R+\delta)\ \forall x<N$'
        porque: |-
          El intervalo es el bueno, pero $x<N$ es $x\to-\infty$: es lo que
          parece si se lee el eje como de costumbre, creciendo hacia la
          derecha. La flecha apunta a la izquierda, así que el infinito está
          a ese lado y hacen falta los $x>N$.
      - texto: '$\forall\delta>0\ \exists N\in\mathbb{R}\ /\ y(x)\in(R,R+\delta)\ \forall x<N$'
        porque: |-
          Falla dos veces: $x<N$ es el otro infinito, y la gráfica no se queda
          por encima de $R$, sino que oscila a los dos lados.

