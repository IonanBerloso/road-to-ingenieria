    opciones:
      - texto: '$-1$'
        porque: |-
          Es $g(2)$, solo el primer paso: la composición se lee de dentro
          hacia fuera y quedan tres funciones por aplicar.
      - texto: '$0$'
        porque: |-
          Ningún paso de la cadena da $0$: $g(2)=-1$, $f(-1)=-2$, $g(-2)=2$
          y $f(2)=3$.
      - texto: '$1$'
        porque: |-
          Es donde se cruzan las dos gráficas, hacia $x=1$, pero la cadena no
          pasa por ahí: $g(2)=-1$, $f(-1)=-2$, $g(-2)=2$ y $f(2)=3$.
      - texto: '$3$'
        correcta: true
        porque: |-
          De dentro hacia fuera: $g(2)=-1$, $f(-1)=-2$, $g(-2)=2$ y
          $f(2)=3$. Cada resultado se busca después en el eje $x$ de la
          gráfica siguiente.
      - texto: '$-2$'
        porque: |-
          Es $f(g(2))=f(-1)$, el segundo paso: faltan $g(-2)=2$ y $f(2)=3$.

  - id: composicion-con-la-inversa
    bloque: '3.4'
    diapositiva: 7
    pregunta: |
      Considerar las dos funciones cuyas gráficas muestra la figura. Calcular
      el valor de $g(f^{-1}(2))$.
    figura: |
      <svg viewBox="0 0 340 265" role="img" width="340" height="265"
