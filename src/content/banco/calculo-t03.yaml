    opciones:
      - texto: Vale 2
        correcta: true
        porque: |-
          Las dos rectas se anulan en el mismo punto $a$, así que
          $f(x)=m_f(x-a)$ y $g(x)=m_g(x-a)$, y para $x\neq a$ el cociente es
          $m_f/m_g$. De $a$ al eje $y$ las dos avanzan lo mismo, y en ese
          tramo $f$ sube $6$ y $g$ sube $3$: $m_f/m_g=2$.
      - texto: No existe
        porque: |-
          Es un $0/0$, pero se simplifica: el factor $x-a$ está arriba y
          abajo, y el cociente vale $2$ en todos los $x\neq a$.
      - texto: No hay suficiente información
        porque: |-
          La figura basta: las dos se anulan en $a$, y sus cortes con el eje
          $y$, en $6$ y en $3$, fijan la razón de las pendientes. Ni siquiera
          hace falta saber cuánto vale $a$.
      - texto: Vale 1/2
        porque: |-
          Es $g/f$, el cociente al revés: $f$ es la recta más empinada, con el
          doble de pendiente que $g$.

  - id: cero-por-cualquier-funcion
    bloque: '3.10'
    diapositiva: 17
    pregunta: |
      Considerar la función $f(x)$ tal que $\lim_{x\to a}f(x)=0$.

      Ahora consideremos otra función $g(x)$ definida en un entorno del punto
      $x=a$. Entonces se cumple:

      $$
      \lim_{x\to a}f(x)g(x)=0.
      $$

      ¿Es cierta esta afirmación?
    opciones:
      - texto: Es cierta siempre
        porque: |-
          Falla si $g$ se dispara: con $f(x)=x-a$ y $g(x)=\frac{1}{(x-a)^2}$
          (con cualquier valor en $a$), el producto es $\frac{1}{x-a}$, que no
          tiende a $0$.
      - texto: No es cierta nunca
        porque: |-
          Muchas veces sí lo es: basta que $g$ esté acotada cerca de $a$. Con
          $f(x)=x-a$ y $g(x)=\cos x$, el producto tiende a $0$.
      - texto: En cada caso, puede o no ser cierta
        correcta: true
        porque: |-
          Depende de $g$: si está acotada cerca de $a$, el producto tiende a
          $0$; si no, puede fallar. Con $f(x)=x-a$, $g(x)=5$ da $0$, y
          $g(x)=\frac{1}{(x-a)^2}$ da $\frac{1}{x-a}$, que no tiene límite.

  - id: infinito-menos-infinito
    bloque: '3.10'
    diapositiva: 18
    pregunta: |
      Considerar las funciones $f(x)$ y $g(x)$ tales que

      $$
      \lim_{x\to a}f(x)=\lim_{x\to a}g(x)=\infty.
      $$

      Entonces se cumple:

      $$
      \lim_{x\to a}f(x)-g(x)=0.
      $$

      ¿Es cierta esta afirmación?
    opciones:
      - texto: Es cierta siempre
        porque: |-
          $\infty-\infty$ es una indeterminación: con
          $f(x)=\frac{1}{(x-a)^2}+1$ y $g(x)=\frac{1}{(x-a)^2}$ la diferencia
          vale $1$ para todo $x\neq a$.
      - texto: No es cierta nunca
        porque: |-
          A veces sí: si $f=g$, la diferencia es $0$ para todo $x$ y su límite
          también.
      - texto: En cada caso, puede o no ser cierta
        correcta: true
        porque: |-
          $\infty-\infty$ no tiene un valor fijo: depende de cómo crezcan las
          dos. Con $g(x)=\frac{1}{(x-a)^2}$, $f=g$ da $0$, $f=g+1$ da $1$ y
          $f=2g$ da $+\infty$.

  # Decisión: la A también es verdadera para la función de la figura (es la
  # definición de que el límite en +∞ es R). La B es más precisa, porque dice
  # además que se llega por debajo, que es lo que se ve; en la diapositiva 20,
  # con la misma batería de opciones, la buena es la A, y el par está hecho
  # para que aquí sea la B.
