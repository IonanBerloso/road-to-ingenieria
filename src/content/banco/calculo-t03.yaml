      </svg>
    opciones:
      - texto: '$4$'
        porque: |-
          Resta al revés, la de $g$ menos la de $f$, y además no divide entre
          la longitud del intervalo, $3-(-4)=7$.
      - texto: '$-4$'
        porque: |-
          Es la diferencia de los incrementos, $(-2-1)-(2-1)=-4$, sin dividir
          entre la longitud del intervalo: la velocidad media es el incremento
          dividido entre $3-(-4)=7$.
      - texto: '$4/7$'
        porque: |-
          Es la resta al revés, la velocidad media de $g$ menos la de $f$:
          $\frac{1}{7}-\left(-\frac{3}{7}\right)=\frac{4}{7}$.
      - texto: '$-4/7$'
        correcta: true
        porque: |-
          La velocidad media es el incremento entre la longitud del intervalo:
          la de $f$ es $\frac{f(3)-f(-4)}{7}=\frac{-2-1}{7}=-\frac{3}{7}$ y la
          de $g$, $\frac{2-1}{7}=\frac{1}{7}$. La diferencia es
          $-\frac{3}{7}-\frac{1}{7}=-\frac{4}{7}$.

  - id: velocidad-media-del-area
    bloque: '3.12.1-2'
    diapositiva: 30
    pregunta: |
      Supongamos que el radio de un círculo aumenta de $r_1$ a $r_2$. ¿Cuál es
      el valor de la velocidad media de cambio del área?
    opciones:
      - texto: 'Menor que $2\pi r_2$'
        porque: |-
          Es cierta, pero no es la única: la velocidad media es
          $\frac{\pi r_2^2-\pi r_1^2}{r_2-r_1}=\pi(r_1+r_2)$, menor que
          $2\pi r_2$, y cumple también la B y la C. La respuesta completa es
          la D.
      - texto: 'Mayor que $2\pi r_1$'
        porque: |-
          Es cierta, pero no la única: $\pi(r_1+r_2)>2\pi r_1$ porque
          $r_2>r_1$, y también se cumplen la A y la C, así que la respuesta es
          la D.
      - texto: 'Es igual a la longitud de la circunferencia que tiene como radio la media aritmética de $r_1$ y $r_2$.'
        porque: |-
          Es cierta: $2\pi\cdot\frac{r_1+r_2}{2}=\pi(r_1+r_2)$, que es la
          velocidad media. Pero la A y la B también lo son, y la D las recoge
          todas.
      - texto: Las tres afirmaciones anteriores son ciertas
        correcta: true
        porque: |-
          La velocidad media es
          $\frac{\pi r_2^2-\pi r_1^2}{r_2-r_1}=\pi(r_1+r_2)$. Como $r_1<r_2$,
          queda entre $2\pi r_1$ y $2\pi r_2$, y es justo $2\pi$ por la media
          de los radios: las tres son ciertas.

  - id: tangente-al-valor-absoluto
    bloque: '3.12.1-2'
    diapositiva: 31
    pregunta: |
      En el punto $x=0$, la función $y(x)=|x|$...
    opciones:
      - texto: 'Tiene como recta tangente la recta $y=0$'
        porque: |-
          $y=0$ toca la gráfica solo en el origen, pero eso no la hace
          tangente: la tangente tiene la pendiente de la derivada, y $|x|$ no
          es derivable en $0$.
      - texto: Tiene infinitas rectas tangentes
        porque: |-
          Las rectas por el origen con pendiente entre $-1$ y $1$ tocan la
          gráfica solo en ese punto, pero tocar no es ser tangente: tangente
          hay como mucho una, la de pendiente $y'(0)$, y aquí esa derivada no
          existe.
      - texto: No tiene recta tangente
        correcta: true
        porque: |-
          La tangente en un punto es la recta con la pendiente de la derivada,
          y en $x=0$ las derivadas laterales valen $-1$ y $1$: no coinciden,
          $|x|$ no es derivable en $0$ y no hay recta tangente.
      - texto: 'Tiene dos rectas tangentes, $y=x$ e $y=-x$'
        porque: |-
          Son las tangentes laterales, una a cada lado del pico: la de la
          derecha con pendiente $1$ y la de la izquierda con pendiente $-1$.
          Como no coinciden, no hay recta tangente.

  - id: derivable-implica-continua
    bloque: '3.12.1-2'
    diapositiva: 32
    pregunta: |
      Supongamos que existe $y'(a)$. ¿Qué puede afirmarse del valor

      $$
      L=\lim_{x\to a}y(x)?
      $$
    opciones:
      - texto: '$L$ existe, pero no se tiene suficiente información para conocer su valor.'
        porque: |-
          El valor se conoce: si $y$ es derivable en $a$, es continua en $a$,
          y el límite es $y(a)$.
      - texto: '$L=y(a)$'
        correcta: true
        porque: |-
          Derivable implica continua:
          $y(x)-y(a)=\frac{y(x)-y(a)}{x-a}(x-a)\to y'(a)\cdot0=0$, así que
          $\lim_{x\to a}y(x)=y(a)$.
      - texto: |-
          $L=y'(a)$
        porque: |-
          Confunde el límite de la función con el del cociente incremental:
          $y'(a)$ es el límite de $\frac{y(x)-y(a)}{x-a}$, y el de $y(x)$ es
          $y(a)$.
      - texto: '$L$ puede no existir'
        porque: |-
          Si existe $y'(a)$, $y$ es continua en $a$, y entonces el límite
          existe y vale $y(a)$.

  - id: contrarreciproco
    bloque: '3.12.1-2'
    diapositiva: 33
    pregunta: |
      Tu ama dice: "Si te comes todo, tendrás postre". Tú sabes que esto
      significa: "Si no te comes todo, no tendrás postre". Ahora, tu profesor
      de cálculo te dice: "Si $y(x)$ es derivable en $x$, entonces $y(x)$ es
      continua en $x$". Tú sabes que esto significa...
    opciones:
      - texto: 'Si $y(x)$ no es derivable en $x$, entonces $y(x)$ no es continua en $x$'
        porque: |-
          Es como se entiende en casa la frase de tu ama, y en matemáticas no
          vale: «si A, entonces B» no dice nada de lo que pasa cuando falla A.
          $|x|$ no es derivable en $0$ y es continua.
      - texto: 'Si $y(x)$ no es continua en $x$, entonces $y(x)$ no es derivable en $x$'
        correcta: true
        porque: |-
          Es el contrarrecíproco, que equivale a la frase del profesor: si
          fuera derivable sería continua, así que si no es continua no puede
          ser derivable.
      - texto: 'Si sólo sabemos que $y(x)$ no es continua en $x$, entonces no tenemos datos para saber si $y(x)$ es derivable en $x$'
        porque: |-
          Los tenemos: saber que no es continua basta para saber que no es
          derivable, porque derivable implica continua.

