    opciones:
      - texto: Es cierta
        porque: |-
          Solo para las sucesiones que llegan a $5$ por la izquierda. Si se
          acercan por la derecha, $y(a_n)$ tiende a unos $3{,}2$, y $y(5)$
          vale unos $2{,}6$.
      - texto: No es cierta
        correcta: true
        porque: |-
          La propiedad es la continuidad en $x=5$ escrita con sucesiones, y
          falla: $y(5)$ es el punto relleno, unos $2{,}6$, y una sucesión que
          llegue a $5$ por la derecha, como $a_n=5+\frac{1}{n}$, da valores
          que tienden a unos $3{,}2$.
      - texto: No puede saberse si es cierta o no
        porque: |-
          La figura lo decide: el punto relleno da $y(5)$, y el trozo de la
          derecha empieza más arriba, en un círculo hueco. Basta una sucesión
          por la derecha para que falle.

  - id: bolzano-en-x-a-la-100
    bloque: '3.11.3-4'
    diapositiva: 24
    pregunta: |
      La ecuación $x^{100}-9x^2+1=0$ ¿tiene alguna solución en el intervalo
      $[0,2]$?
    opciones:
      - texto: Sí
        correcta: true
        porque: |-
          $p(x)=x^{100}-9x^2+1$ es continua, $p(0)=1>0$ y
          $p(1)=1-9+1=-7<0$: por el teorema de Bolzano se anula en algún punto
          de $(0,1)$. Y como $p(2)=2^{100}-35>0$, hay otra raíz en $(1,2)$.
      - texto: 'No'
        porque: |-
          Basta evaluar en tres puntos: $p(0)=1$, $p(1)=-7$ y
          $p(2)=2^{100}-35$ cambian de signo dos veces, así que por Bolzano hay
          al menos dos soluciones.
      - texto: No puede saberse
        porque: |-
          Puede saberse sin resolverla: los signos de $p(0)=1$ y $p(1)=-7$
          bastan para que el teorema de Bolzano garantice una raíz entre $0$ y
          $1$.

  - id: acotacion-de-una-continua
    bloque: '3.11.3-4'
    diapositiva: 25
    pregunta: |
      Sea $y(x)$ una función continua en el intervalo $[a,b]$. Entonces existe
      un número real positivo $R$ tal que la gráfica de $y(x)$ está contenida
      en el rectángulo $x\in[a,b]$, $y\in[-R,R]$.

      ¿Es cierta esta afirmación?
    opciones:
      - texto: Siempre es cierta
        correcta: true
        porque: |-
          Una función continua en un intervalo cerrado y acotado alcanza, por
          el teorema de Weierstrass, un máximo $M$ y un mínimo $m$. Basta
          tomar $R=\max(|M|,|m|)+1$.
      - texto: Sólo es cierta algunas veces
        porque: |-
          La afirmación vale siempre que el intervalo sea cerrado y acotado,
          como aquí. Falla en uno abierto: $\frac{1}{x}$ es continua en $(0,1]$
          y no está acotada.
      - texto: 'No se tiene suficiente información sobre $y(x)$'
        porque: |-
          Basta con lo que dice el enunciado: continua en $[a,b]$, cerrado y
          acotado, garantiza por el teorema de Weierstrass que tiene máximo y
          mínimo, y por tanto que está acotada.

  - id: extremos-de-x-cuadrado-en-un-abierto
    bloque: '3.11.3-4'
    diapositiva: 26
    pregunta: |
      La función $y(x)=x^2$ tiene máximo y mínimo globales en el intervalo
      $(-1,1)$. ¿Es cierta esta afirmación?
    opciones:
      - texto: Es cierta
        porque: |-
          El mínimo sí, $y(0)=0$, pero el máximo no: $x^2$ se acerca a $1$
          cuando $x$ va hacia $\pm1$ y nunca lo alcanza, porque los extremos
          no son del intervalo. Weierstrass no se aplica en un intervalo
          abierto.
      - texto: '$y(x)$ tiene mínimo global pero no máximo global.'
        correcta: true
        porque: |-
          El mínimo es $y(0)=0$, porque $x^2\ge0$. El máximo tendría que ser
          $1$, que es el supremo, y no se alcanza: $x=\pm1$ se quedan fuera
          del intervalo abierto.
      - texto: '$y(x)$ tiene máximo global pero no mínimo global.'
        porque: |-
          Está al revés: el mínimo, $y(0)=0$, está dentro del intervalo; lo
          que falta es el máximo, porque $x^2$ se acerca a $1$ sin llegar.
      - texto: '$y(x)$ no tiene ni máximo ni mínimo globales.'
        porque: |-
          El mínimo existe: $x=0$ está en $(-1,1)$ e $y(0)=0\le x^2$ para todo
          $x$. Solo falta el máximo.

  - id: un-metro-de-estatura
    bloque: '3.11.3-4'
    diapositiva: 27
    pregunta: |
      ¿En algún instante de tu vida has tenido exactamente un metro de
      estatura?
    opciones:
      - texto: Sí
        correcta: true
        porque: |-
          La estatura es una función continua del tiempo: al nacer medías
          unos $50$ cm y ahora más de un metro. Por el teorema de los valores
          intermedios, en algún instante mediste exactamente $1$ m.
      - texto: 'No'
        porque: |-
          Para no pasar nunca por $1$ m habría que saltar de golpe de menos a
          más de un metro, y la estatura no da saltos: crece de forma
          continua.
      - texto: No puede saberse
        porque: |-
          Se sabe sin haberlo medido nunca: una función continua que va de
          unos $0{,}5$ m a más de $1$ m toma todos los valores intermedios, y
          el $1$ es uno de ellos.

  - id: sesenta-puntos-en-un-partido
    bloque: '3.11.3-4'
    diapositiva: 28
    pregunta: |
      Supongamos que en un partido de basket, el equipo local ha conseguido 96
      puntos. ¿En algún instante del partido el equipo local ha tenido
      exactamente 60 puntos?
    opciones:
      - texto: Sí
        porque: |-
          Sería el teorema de los valores intermedios, y no se aplica: el
          marcador no es continuo, avanza a saltos de $1$, $2$ o $3$ puntos.
          De $59$ se puede pasar a $61$ o a $62$ sin tener nunca $60$.
      - texto: 'No'
        porque: |-
          Tampoco se puede descartar: si en algún momento el equipo metió un
          punto estando en $59$, o una canasta de dos estando en $58$, pasó
          por $60$.
      - texto: No puede saberse
        correcta: true
        porque: |-
          El marcador va a saltos de $1$, $2$ o $3$ puntos, así que no es una
          función continua y el teorema de los valores intermedios no dice
          nada: pudo pasar por $60$ o saltárselo, por ejemplo con un triple
          desde $58$.

