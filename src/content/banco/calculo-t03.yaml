    opciones:
      - texto: El razonamiento es correcto
        porque: |-
          La regla de L'Hôpital solo funciona en un sentido: si existe el
          límite de $\frac{f'}{g'}$, el de $\frac{f}{g}$ vale lo mismo. Si el
          de las derivadas no existe, no dice nada, y aquí $L$ sí existe:
          $\frac{x+\operatorname{sen}x}{x}=1+\frac{\operatorname{sen}x}{x}\to1$.
      - texto: El razonamiento no es correcto
        correcta: true
        porque: |-
          L'Hôpital permite concluir cuando el límite de las derivadas existe,
          no cuando falta. Aquí ni hace falta:
          $\frac{x+\operatorname{sen}x}{x}=1+\frac{\operatorname{sen}x}{x}$, y
          como $|\operatorname{sen}x|\le1$, $\frac{\operatorname{sen}x}{x}\to0$
          y $L=1$.

  # Decisión (revisión del 28 de septiembre de 2026): el enunciado pide el
  # límite en el infinito y la figura solo enseña f′ y g′ entre 0 y 0,22.
  # Las dos son rectas por el origen de pendientes 2 y 1, así que su cociente
  # es 2 en todo el tramo y, extrapolado, también en el infinito: la C vale
  # leída tal cual, sin suponer una errata. Leída en x → 0 con f(0) = g(0) = 0
  # también saldría 2.
  - id: lhopital-con-las-derivadas
    bloque: '3.13'
    diapositiva: 47
    pregunta: |
      La figura muestra las gráficas de $f'(x)$ y $g'(x)$. Estimar el límite

      $$
      L=\lim_{x\to\infty}\frac{f(x)}{g(x)}
      $$
    figura: |
      <svg viewBox="0 0 360 290" role="img" width="360" height="290"
           aria-labelledby="cq3-lhopital-t cq3-lhopital-d">
        <title id="cq3-lhopital-t">Las gráficas de f′ y de g′ cerca de 0</title>
        <desc id="cq3-lhopital-d">Sobre una cuadrícula fina, dos curvas que salen del origen, entre x = 0 y x = 0,22. f′(x) es una recta que sube el doble de deprisa: vale 0,2 en x = 0,1 y 0,3 en x = 0,15. g′(x) sube más despacio, curvándose un poco hacia arriba: vale algo más de 0,1 en x = 0,1 y unos 0,25 en x = 0,22.</desc>
        <style>
            .cq3-lhopital-eje { stroke: var(--rule); stroke-width: 1.1; fill: none; }
