    opciones:
      - texto: '$-1$'
        porque: |-
          Es $g'(3)$ solo: falta multiplicar por $f'(g(3))=f'(1)=3$.
      - texto: '$1$'
        porque: |-
          Es $g(3)$, el punto donde hay que evaluar $f'$, no el resultado:
          $h'(3)=f'(g(3))\,g'(3)=f'(1)\cdot(-1)$.
      - texto: '$3$'
        porque: |-
          Es $f'(g(3))=f'(1)$, sin multiplicar por $g'(3)=-1$, que cambia el
          signo.
      - texto: '$-3$'
        correcta: true
        porque: |-
          Por la regla de la cadena, $h'(3)=f'(g(3))\,g'(3)$. En la figura,
          $g(3)=1$, $f'(1)=3$ y $g'(3)=-1$: $h'(3)=3\cdot(-1)=-3$.

  - id: deposito-conico
    bloque: '3.12.6'
    diapositiva: 40
    pregunta: |
      Estamos llenando de agua un depósito cónico. El volumen $V$ de agua que
      hay en el depósito en cada instante es:

      $$
      V=\frac{1}{3}\pi r^2h
      $$

      donde $r$ y $h$ son el radio y la altura de la parte del depósito que ya
      se ha llenado hasta ese instante. ¿Cuál es la velocidad de cambio de $V$
      respecto al tiempo?
    opciones:
      - texto: '$\frac{dV}{dt}=\frac{\pi}{3}\left(2r\frac{dr}{dt}h+r^2\frac{dh}{dt}\right)$'
        correcta: true
        porque: |-
          $r$ y $h$ cambian con el tiempo, así que se deriva el producto
          $r^2h$ con la regla del producto, y por la regla de la cadena la
          derivada de $r^2$ es $2r\frac{dr}{dt}$: queda
          $2r\frac{dr}{dt}h+r^2\frac{dh}{dt}$.
      - texto: '$\frac{dV}{dt}=\frac{\pi}{3}\left(2r\frac{dr}{dt}\frac{dh}{dt}\right)$'
        porque: |-
          Deriva el producto como el producto de las derivadas. La regla del
          producto suma dos términos: $2r\frac{dr}{dt}h+r^2\frac{dh}{dt}$.
      - texto: '$\frac{dV}{dt}=\frac{\pi}{3}\left(2rh+r^2\frac{dh}{dt}\right)$'
        porque: |-
          Al derivar $r^2$ se queda en $2r$: falta el $\frac{dr}{dt}$ de la
          regla de la cadena, porque $r$ también depende del tiempo.
      - texto: '$\frac{dV}{dt}=\frac{\pi}{3}\left(r^2+2rh\frac{dh}{dt}\right)$'
        porque: |-
          Cambia los papeles de $r$ y de $h$ y pierde el $\frac{dr}{dt}$: la
          regla del producto da $2r\frac{dr}{dt}h+r^2\frac{dh}{dt}$.

  - id: punto-que-recorre-el-eje
    bloque: '3.12.6'
    diapositiva: 41
    pregunta: |
      Ver la figura. Supongamos que un punto $P$ se desplaza por el eje $OX$ a
      una velocidad de 5 cm/s. Calcular la velocidad a la que cambia la
      distancia $h$ en el instante en que $P$ alcanza la posición $(4,0)$.
