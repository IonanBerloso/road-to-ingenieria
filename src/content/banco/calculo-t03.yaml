          avanza.
      - texto: '$m=\frac{y(b)-y(a)}{b-a}$'
        correcta: true
        porque: |-
          La pendiente es lo que sube la recta dividido entre lo que avanza:
          de $(a,y(a))$ a $(b,y(b))$ sube $y(b)-y(a)$ y avanza $b-a$. Aquí
          sale negativa, porque $y(b)<y(a)$ y la secante baja.
      - texto: '$m=\frac{y(a)-y(b)}{b-a}$'
        porque: |-
          Resta los valores en un orden y las abscisas en el otro, y eso
          cambia el signo: saldría positiva, cuando la secante de la figura
          baja de izquierda a derecha.

  # Decisión: la B (la definición de V′(1)) y la C (su valor, 4π) son exactas;
  # la A y la D son cocientes incrementales, aproximaciones. Se marca la E,
  # que es la única que puede ser la respuesta única y la que la diapositiva
  # busca; si no se aceptan la A y la D como «representación» de la
  # velocidad, la pregunta tiene dos buenas y ninguna única.
  - id: velocidad-de-cambio-del-volumen
    bloque: '3.12.1-2'
    diapositiva: 35
    pregunta: |
      Deseamos conocer el modo en que cambia el volumen de aire en el interior
      de un globo que estamos hinchando. Se sabe que el volumen $V$ del globo
      esférico de radio $r$ es:

      $$
      V=\frac{4}{3}\pi r^3
      $$

      ¿Cuál de las siguientes expresiones representa la velocidad de cambio de
      $V$ cuando el radio es igual a 1?
    opciones:
      - texto: '$\frac{V(1{,}01)-V(1)}{0{,}01}\cong 12{,}69$'
        porque: |-
          Es el cociente incremental con $h=0{,}01$, una aproximación por la
          derecha: $12{,}69$ frente al valor exacto $4\pi\approx12{,}57$. Vale,
          pero no es la única: la respuesta que las recoge todas es la E.
      - texto: '$\lim_{h\to0}\frac{V(1+h)-V(1)}{h}$'
        porque: |-
          Es la definición exacta de $V'(1)$, pero no la única de la lista que
          la representa: la C da su valor y la A y la D lo aproximan. La
          respuesta completa es la E.
      - texto: '$4\pi$'
        porque: |-
          Es el valor exacto, $V'(r)=4\pi r^2$ en $r=1$, pero no la única
          opción que representa esa velocidad: la B es su definición y la A y
          la D la aproximan, así que la respuesta es la E.
      - texto: '$\frac{V(0{,}99)-V(1)}{-0{,}01}\cong 12{,}44$'
        porque: |-
          Es el cociente incremental con $h=-0{,}01$, una aproximación por la
          izquierda: $12{,}44$, por debajo de $4\pi\approx12{,}57$. Como las
          otras tres también valen, la respuesta es la E.
      - texto: Las cuatro respuestas son correctas
        correcta: true
        porque: |-
          La velocidad de cambio en $r=1$ es $V'(1)=4\pi\approx12{,}57$: la B
          es su definición, la C su valor, y la A y la D la aproximan con
          $h=0{,}01$ por cada lado, $12{,}69$ y $12{,}44$, que dejan a $4\pi$
          en medio.

  - id: derivada-de-ln-3
    bloque: '3.12.1-2'
    diapositiva: 36
    pregunta: |
      ¿Verdadero o falso?

      $$
      \frac{d}{dx}\left(\ln 3\right)=\frac{1}{3}
      $$
    opciones:
      - texto: Verdadero
        porque: |-
          Aplica $(\ln x)'=\frac{1}{x}$ con $x=3$, pero $\ln 3$ no depende de
          $x$: es un número, unos $1{,}1$, y su derivada es $0$.
      - texto: Falso
        correcta: true
        porque: |-
          $\ln 3$ es una constante, así que su derivada respecto de $x$ es
          $0$. El $\frac{1}{3}$ sale de derivar $\ln x$ y evaluar después en
          $x=3$, que es otra cosa.

  # Dos ciertas a propósito: la B lee c′(83) y la C lee r′(34). La
  # diapositiva 42 usa como datos, casi palabra por palabra, esas dos frases.
  - id: interpretacion-de-la-derivada
    bloque: '3.12.1-2'
    varias: true
    diapositiva: 37
    pregunta: |
      Un corredor está corriendo los 1000 metros lisos. Consideremos las
      siguientes variables: $v$=velocidad a la que se está desplazando (en
      Km/h); $r$=ritmo cardíaco (en pulsaciones/minuto); $c$=velocidad de
      circulación sanguínea (en cm/s). Consideremos las funciones $c(r)$ y
      $r(v)$. Supongamos que $c'(83)=0{,}01$ y $r'(34)=10$. ¿Cómo se
      interpretan estos datos?
    opciones:
      - texto: >-
          Cuando el ritmo cardíaco es de 34 pulsaciones/minuto, la velocidad
          de circulación de su sangre aumenta en 10 cm/s por cada
          pulsación/minuto que aumenta su ritmo cardíaco.
        porque: |-
          Cruza los dos datos: el $34$ es una velocidad, en km/h, no un ritmo
          cardíaco, y el $10$ son pulsaciones/minuto por cada km/h, no cm/s por
          pulsación/minuto. Lo que se sabe de la circulación es
          $c'(83)=0{,}01$.
      - texto: >-
          Cuando el ritmo cardíaco es de 83 pulsaciones/minuto, la velocidad
          de circulación de su sangre aumenta en 0,01 cm/s por cada
          pulsación/minuto que aumenta su ritmo cardíaco.
        correcta: true
        porque: |-
          Es la lectura de $c'(83)=0{,}01$: la derivada de la circulación
          respecto del ritmo, cuando el ritmo vale $83$ pulsaciones/minuto, se
          mide en cm/s por pulsación/minuto, y dice que cada pulsación/minuto
          de más sube la circulación unos $0{,}01$ cm/s.
      - texto: >-
          Cuando la velocidad del corredor es de 34 Km/h, su ritmo cardíaco
          está aumentando a razón 10 pulsaciones/minuto por cada Km/h que el
          corredor aumenta su velocidad.
        correcta: true
        porque: |-
          Es la lectura de $r'(34)=10$: la derivada del ritmo respecto de la
          velocidad, cuando la velocidad es de $34$ km/h, se mide en
          pulsaciones/minuto por km/h, y dice que cada km/h de más sube el
          ritmo unas $10$ pulsaciones/minuto.

  - id: aproximacion-por-la-diferencial
    bloque: '3.12.5'
    diapositiva: 38
    pregunta: |
      La figura muestra la recta tangente a la gráfica de una función $y(x)$
      en el punto $(0{,}66;\ 0{,}4)$. Si utilizamos la aproximación de $y(x)$
      mediante la diferencial para estimar los valores de $y(x)$ en los puntos
