    opciones:
      - texto: >-
          El único punto en el que hay un extremo local es en $x=-4$, porque en
          $x=4$ y $x=6$ la función no es derivable.
        porque: |-
          Un extremo local no pide derivada: en $x=4$ hay un pico, un máximo
          local, y en $x=6$ un vértice hacia abajo, un mínimo local. Y en
          $x=-3$ la función vale $-5$, menos que todo lo que tiene alrededor:
          otro mínimo local.
      - texto: >-
          El máximo absoluto se alcanza en $x=4$ pero no es un máximo local
          porque la función no es derivable en $x=4$.
        porque: |-
          Lo primero es verdad y lo segundo no: un máximo absoluto en un punto
          interior es también máximo local, porque $f(4)=4$ supera a todos los
          valores de alrededor. La derivabilidad no entra en la definición de
          extremo.
      - texto: 'El mínimo absoluto se alcanza en $x=-4$.'
        porque: |-
          En $x=-4$ hay un mínimo local, con $f(-4)=-3$, pero no el absoluto:
          el punto relleno dice que $f(-3)=-5$, más abajo. El círculo hueco de
          $(-3,-2)$ no es de la gráfica; el punto relleno, sí.
      - texto: Ninguna de las tres afirmaciones (A), (B) y (C) es cierta.
        correcta: true
        porque: |-
          La A olvida que en los picos de $x=4$ y $x=6$ también hay extremos,
          la B niega que un máximo absoluto interior sea local, y la C no ve
          que $f(-3)=-5$ queda por debajo de $f(-4)=-3$. Las tres son falsas.
      - texto: Las tres afirmaciones (A), (B) y (C) son ciertas.
        porque: |-
          Bastaría con que fallara una, y fallan las tres: hay extremos locales
          en $x=4$ y $x=6$, el máximo absoluto de $x=4$ es también local, y el
          mínimo absoluto está en $x=-3$, no en $x=-4$.

  - id: beneficio-maximo-del-ano
