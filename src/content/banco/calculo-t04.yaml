    opciones:
      - texto: '$a=0$, $b>0$, $c>0$'
        porque: |-
          $a=y(4)$, y en $x=4$ la gráfica está por encima del eje, a una
          altura de casi $2$: $a>0$, no $0$. El cero de $y$ está en $x=3$.
      - texto: '$a<0$, $b<0$, $c<0$'
        porque: |-
          Los dos primeros signos están al revés: en $x=4$ la función es
          positiva, $a=y(4)>0$, y crece, $b=y'(4)>0$. Solo la concavidad, hacia
          abajo, da un coeficiente negativo.
      - texto: '$a>0$, $b<0$, $c>0$'
        porque: |-
          $b=y'(4)$, y en $x=4$ la función sube hacia su máximo de
          $x\approx 4{,}75$: $b>0$. Y $c=\frac{y''(4)}{2}$ es negativo, porque
          ahí la curva es cóncava hacia abajo.
      - texto: '$a<0$, $b>0$, $c>0$'
        porque: |-
          $a=y(4)$ es la altura de la curva en $x=4$, que está por encima del
          eje: $a>0$. Y la curva se dobla hacia abajo antes del máximo, así que
          $c<0$.
      - texto: '$a>0$, $b>0$, $c>0$'
        porque: |-
          Acierta $a$ y $b$, pero no $c=\frac{y''(4)}{2}$: antes del máximo la
          curva es cóncava hacia abajo, con $y''(4)<0$. La concavidad cambia
          cerca de $x=3$, en el punto de inflexión.
      - texto: '$a>0$, $b>0$, $c<0$'
        correcta: true
        porque: |-
          Los coeficientes del polinomio de Taylor en $4$ son $a=y(4)$,
          $b=y'(4)$ y $c=\frac{y''(4)}{2}$. En $x=4$ la curva está por encima
          del eje ($a>0$), sube hacia su máximo ($b>0$) y se dobla hacia abajo
          ($c<0$).

