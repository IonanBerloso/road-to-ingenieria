    opciones:
      - texto: '$h(x)$ es creciente en $(1,2)$'
        porque: |-
          En $(1,2)$, $f$ crece de $2$ a $5$, y en ese rango $g$ decrece:
          $h'(x)=g'(f(x))\,f'(x)$ es negativo por positivo, así que $h$
          decrece.
      - texto: '$h(x)$ es decreciente en $(2,3)$'
        porque: |-
          En $(2,3)$, $f$ crece de $5$ a $6$, y entre $5$ y $6$ $g$ también
          crece: $h'(x)=g'(f(x))\,f'(x)>0$, y $h$ crece.
      - texto: '$h(x)$ es decreciente en $(3,4)$'
        correcta: true
        porque: |-
          Por la regla de la cadena, $h'(x)=g'(f(x))\,f'(x)$. En $(3,4)$, $f$
          baja de $6$ a $5$, con $f'<0$, y entre $5$ y $6$ $g$ crece, con
          $g'>0$: $h'<0$, así que $h$ decrece.
      - texto: '$h(x)$ es decreciente en $(4,5)$'
        porque: |-
          En $(4,5)$, $f$ baja de $5$ a $2$, y en ese rango $g$ también baja:
          $h'$ es negativo por negativo, positivo, y $h$ crece. Que las dos
          bajen no hace bajar la compuesta.

  # La (1) del original tiene los ceros y los signos de y″, pero no su tamaño:
  # cerca del máximo de y vale −0,8, y la curvatura de la y medida da −1,3.
  # Se redibuja como la derivada segunda exacta de la y medida, que es lo que
  # la pregunta pretende; la respuesta no cambia.
  - id: derivada-segunda-de-la-grafica
    bloque: '4.8'
    diapositiva: 18
    pregunta: |
      Dada la función $y(x)$ cuya gráfica se muestra, ¿Alguna de las gráficas
      (1) o (2) puede corresponder a la de $y''(x)$.
    figura: |
      <svg viewBox="0 0 340 414" role="img" width="340" height="414"
           aria-labelledby="cq4-segunda-t cq4-segunda-d">
        <title id="cq4-segunda-t">Una función y dos candidatas a su derivada segunda</title>
        <desc id="cq4-segunda-d">Tres recuadros, uno debajo de otro, con el mismo eje x de menos dos a dos. En el primero, y(x): sube de 0,73 a un máximo de 0,85 cerca de x igual a menos 1,55, baja hasta un mínimo suave de 0,29 cerca de x igual a 0,15, sube apenas hasta 0,34 cerca de 0,83 y baja hasta menos 0,3 en x igual a dos. La (1) empieza en menos 0,35, baja hasta menos 1,3 cerca de menos 1,6, sube cortando el eje en menos 0,83 hasta 0,75 cerca de menos 0,2, baja cortando el eje en 0,5 hasta menos 1,15 cerca de 1,35 y sube cortando el eje en 1,8 hasta 1,1. La (2) sube de 0,85 a un máximo de 1,55 cerca de menos 1,55, baja hasta menos 0,8 cerca de 0,1, sube hasta 1,3 cerca de 1,7 y acaba en uno.</desc>
