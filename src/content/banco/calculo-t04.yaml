           aria-labelledby="cq4-compuesta-t cq4-compuesta-d">
        <title id="cq4-compuesta-t">Las funciones f y g</title>
        <desc id="cq4-compuesta-d">Dos recuadros. En el primero, f(x): un arco de parábola que va de (1, 2) a un máximo en (3, 6) y baja a (5, 2), pasando por (2, 5) y por (4, 5). En el segundo, g(x): baja desde (2, 10), pasa por (3, 5) y por (4, 2), toca su mínimo en (5, 1) y sube hasta (6, 2).</desc>
