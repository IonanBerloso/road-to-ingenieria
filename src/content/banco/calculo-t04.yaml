    opciones:
      - texto: La función (1)
        porque: |-
          Se anula cerca de los extremos de $y$, pero se queda corta: su máximo
          no llega a $1{,}5$, y $y$ sube de unos $-0{,}8$ en $x=-0{,}5$ a unos
          $2$ en $x=1$, una pendiente media de más de $1{,}8$. Por el teorema
          del valor medio, $y'$ tendría que alcanzar ese valor.
      - texto: La función (2)
        porque: |-
          Cambia de signo en $x\approx-3{,}2$, cuando $y$ todavía sube hacia su
          máximo de $x\approx-2{,}8$: entre esos dos puntos $y$ crece y la (2)
          es negativa. La derivada tiene que anularse justo en los extremos de
          $y$.
      - texto: La función (3)
        correcta: true
        porque: |-
          Se anula en $x\approx-2{,}8$, $x\approx-1{,}2$ y $x\approx 1{,}65$,
          justo donde $y$ tiene sus extremos; es positiva donde $y$ sube y
          negativa donde baja; y su máximo, de unos $2$, cae donde $y$ es más
          empinada.
      - texto: Ninguna de las tres funciones
        porque: |-
          La (3) cumple todo lo que tiene que cumplir $y'$: se anula en los
          extremos de $y$, tiene el signo de su crecimiento y su tamaño casa
          con la pendiente de la gráfica.

  - id: funcion-desde-su-derivada
    bloque: '4.8'
    diapositiva: 14
    pregunta: |
      Dada la función $y'(x)$ de la figura, ¿cuál de las gráficas (1), (2) o
      (3) puede corresponder a la de $y(x)$?
