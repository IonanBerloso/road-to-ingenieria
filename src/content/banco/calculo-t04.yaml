    opciones:
      - texto: La función (1)
        correcta: true
        porque: |-
          $y'$ es negativa hasta $x\approx-2{,}65$, positiva hasta
          $x\approx 0{,}6$ y negativa después: $y$ baja, sube y vuelve a bajar,
          con el mínimo y el máximo ahí, como la (1). Y la (1) sube de unos
          $0{,}35$ a unos $1{,}9$, una pendiente media de menos de $0{,}5$,
          compatible con el máximo de $y'$, que es $0{,}7$.
      - texto: La función (2)
        porque: |-
          Tiene los extremos casi donde toca, pero sube demasiado: de unos
          $-0{,}75$ a unos $2$ entre $x=-2{,}6$ y $x=0{,}6$, una pendiente
          media de unos $0{,}85$. Por el teorema del valor medio $y'$ tendría
          que llegar a ese valor, y su máximo es $0{,}7$.
      - texto: La función (3)
        porque: |-
          Hace justo lo contrario: sube donde $y'$ es negativa y baja donde es
          positiva. Tiene un máximo cerca de $x=-2{,}5$, donde $y$ debería
          tener un mínimo.
      - texto: Ninguna de las tres funciones
        porque: |-
          La (1) es compatible con todo lo que dice $y'$: dónde baja $y$, dónde
          sube, y cuánto.

  - id: funcion-y-sus-dos-derivadas
    bloque: '4.8'
    diapositiva: 15
    pregunta: |
      La gráficas (1), (2) y (3) corresponden a las de $y(x)$, $y'(x)$,
      $y''(x)$ aunque no necesariamente en ese orden. ¿Qué gráfica corresponde
      a qué función?
    figura: |
      <svg viewBox="0 0 380 300" role="img" width="380" height="300"
           aria-labelledby="cq4-cadena-t cq4-cadena-d">
        <title id="cq4-cadena-t">Tres curvas: una función y sus dos primeras derivadas</title>
        <desc id="cq4-cadena-d">Tres curvas en los mismos ejes, entre x igual a menos dos y x igual a uno, sobre una cuadrícula de media unidad. La (1), con forma de parábola, baja de 1,5 a un mínimo de menos 1,4 en x igual a menos 0,5 y sube a 1,5, cortando el eje en menos 1,55 y 0,55. La (2) sube de 0,7 a un máximo de uno en x igual a menos 1,55, baja cortando el eje en menos 0,5 hasta un mínimo de menos uno en x igual a 0,55 y sube a menos 0,7. La (3) sube de menos 0,9 a un máximo de 0,17 en x igual a menos 0,5, cortando el eje en menos uno y en cero, y baja a menos 0,9.</desc>
