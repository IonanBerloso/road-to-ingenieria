    opciones:
      - texto: (1)
        correcta: true
        porque: |-
          $y$ sube hasta su máximo de $x=3$ y baja después: $y'$ es positiva
          antes de $3$, negativa después y se anula en $3$. Además, $y$ sube
          de $0$ a $2{,}1$ entre $x=0$ y $x=1$ aplanándose, así que $y'(0)$
          pasa de $2{,}1$: la (1) empieza en $2{,}5$.
      - texto: (2)
        porque: |-
          Tiene el cero en $x=3$ y el signo bien, pero es demasiado pequeña:
          empieza en $1{,}2$ y $y$ sube $2{,}1$ entre $x=0$ y $x=1$. Con una
          derivada que no pasa de $1{,}2$ en ese tramo, $y$ subiría como mucho
          $1{,}2$.
      - texto: (3)
        porque: |-
          Tiene el signo al revés: es negativa antes de $x=3$, donde $y$ sube,
          y positiva después, donde baja. Es la derivada de una curva con un
          mínimo en $x=3$, no con un máximo.

  - id: crecimiento-de-la-compuesta
    bloque: '4.8'
    diapositiva: 17
    pregunta: |
      Considerar las funciones $f(x)$ y $g(x)$ que muestra la figura. Sea
      $h(x)=g(f(x))$. ¿Cuál de las siguientes afirmaciones es cierta?
    figura: |
