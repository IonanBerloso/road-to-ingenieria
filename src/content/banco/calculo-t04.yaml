    opciones:
      - texto: '$|E|\le\dfrac{3}{4!}2^4$'
        correcta: true
        porque: |-
          Ahora $c\in(-2,0)$, y en ese intervalo la derivada cuarta baja hasta
          unos $-2{,}75$ cerca de $x=-1{,}4$: $|y^{(4)}(c)|\le 3$. Con
          $(0-(-2))^4=2^4$, la cota es $\frac{3}{4!}2^4=2$.
      - texto: '$|E|\le\dfrac{4}{4!}2^4$'
        correcta: true
        porque: |-
          $4\ge 2{,}75$, así que también acota el error, aunque más holgada
          que la A. El $4$ es el valor con el que empieza la gráfica, en
          $x=-4$, fuera del intervalo.
      - texto: '$|E|\le\dfrac{2}{4!}2^4$'
        porque: |-
          $2$ no llega: entre $x=-2$ y $x=0$ la derivada cuarta baja hasta
          $-2{,}75$, y su valor absoluto pasa de $2$. Es la cota que vale en
          $(-3,-2)$, no en $(-2,0)$.
      - texto: '$|E|\le\dfrac{2{,}5}{4!}2^4$'
        porque: |-
          Se queda corta por poco: el mínimo de la derivada cuarta en $(-2,0)$
          es de unos $-2{,}75$, así que su valor absoluto llega a
          $2{,}75>2{,}5$.

  - id: conservacion-del-signo-sin-continuidad
    bloque: '4.7'
    diapositiva: 11
    pregunta: |
      Sea $y(x)$ una función. ¿Es verdadera o falsa la siguiente afirmación?

      $y(a)>0\Rightarrow\exists h>0\ /\ y(x)>0\ \ \forall x\in(a-h,a+h)$
    opciones:
      - texto: Es verdadera.
        porque: |-
          Es la conservación del signo, pero sin su hipótesis: la continuidad
          en $a$. Sin ella, la función que vale $1$ en $x=a$ y $-1$ en el resto
          cumple $y(a)>0$ y es negativa en todos los demás puntos de cualquier
          entorno.
      - texto: Es falsa.
        correcta: true
        porque: |-
          La afirmación no pide que $y$ sea continua, y sin continuidad falla:
          la función que vale $1$ en $x=a$ y $-1$ en todos los demás puntos
          tiene $y(a)>0$ y ningún entorno de $a$ donde sea positiva. Con $y$
          continua en $a$ sí sería verdadera.

