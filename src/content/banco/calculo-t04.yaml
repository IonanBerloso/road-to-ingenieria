    opciones:
      - texto: |-
          (2) es $y(x)$. (1) es $y'(x)$. (3) es $y''(x)$.
        porque: |-
          La (1) sí es la derivada de la (2): se anula en $x\approx-1{,}55$ y
          $x\approx 0{,}55$, donde la (2) tiene sus extremos. Pero la (3) no es
          la derivada de la (1): la (1) tiene su mínimo en $x=-0{,}5$, y ahí la
          (3) no se anula, tiene su máximo.
      - texto: |-
          (3) es $y(x)$. (2) es $y'(x)$. (1) es $y''(x)$.
        correcta: true
        porque: |-
          Cada una es la derivada de la anterior: la (2) se anula en $x=-0{,}5$,
          donde la (3) tiene su máximo, y es positiva donde la (3) sube; la (1)
          se anula en $x\approx-1{,}55$ y $x\approx 0{,}55$, donde la (2) tiene
          su máximo y su mínimo.
      - texto: |-
          (1) es $y(x)$. (3) es $y'(x)$. (2) es $y''(x)$.
        porque: |-
          Si la (1) fuera $y$, su derivada se anularía en su mínimo,
          $x=-0{,}5$, y la (3) no se anula ahí: tiene su máximo. La (1), con
          forma de parábola, es la del final de la cadena, $y''$.
      - texto: |-
          (2) es $y(x)$. (3) es $y'(x)$. (1) es $y''(x)$.
        porque: |-
          La (3) no puede ser la derivada de la (2): la (2) tiene extremos en
          $x\approx-1{,}55$ y $x\approx 0{,}55$, y la (3) no se anula en
          ninguno de los dos. Es al revés: la (2) es la derivada de la (3).

  - id: derivada-de-una-parabola
    bloque: '4.8'
    diapositiva: 16
    pregunta: |
      Dada la función $y(x)$ cuya gráfica se muestra, alguna de las gráficas
      (1), (2) o (3) puede corresponder a la de $y'(x)$. ¿Cuál?
    figura: |
      <svg viewBox="0 0 406 368" role="img" width="406" height="368"
           aria-labelledby="cq4-parabola-t cq4-parabola-d">
        <title id="cq4-parabola-t">Una parábola y tres rectas candidatas a su derivada</title>
        <desc id="cq4-parabola-d">Cuatro recuadros. En el primero, y(x): una parábola que sale del origen, sube hasta un máximo de 3,8 en x igual a tres y vuelve a cero en x igual a seis. La (1) es una recta que baja de 2,5 en x igual a cero a menos 2,5 en x igual a seis, cortando el eje en tres. La (2), una recta que baja de 1,2 a menos 1,2, también con el corte en tres. La (3), una recta que sube de menos 1,65 a 1,65, con el corte en tres.</desc>
