    opciones:
      - texto: '$|E|\le\dfrac{2{,}5}{3!}(3-2)^3$'
        porque: |-
          $2{,}5$ es, más o menos, $y'''(2)$, el valor en el centro del
          desarrollo. Pero el resto de Lagrange evalúa $y'''$ en un punto
          desconocido de $(2,3)$, y ahí llega a valer casi $5{,}2$: la cota
          tiene que usar el máximo de $|y'''|$ en el intervalo.
      - texto: '$|E|\le\dfrac{5{,}5}{3!}(3-2)^3$'
        correcta: true
        porque: |-
          El resto es $E=\frac{y'''(c)}{3!}(3-2)^3$ con $c\in(2,3)$, y en ese
          intervalo $y'''$ sube de unos $2{,}3$ a unos $5{,}2$: $|y'''(c)|\le
          5{,}5$, la primera línea de la cuadrícula por encima. Es la cota que
          se lee en la gráfica.
      - texto: '$|E|\le\dfrac{5{,}5}{4!}(3-2)^4$'
        porque: |-
          Mezcla dos órdenes: $P_2$ deja un resto con la derivada tercera,
          $3!$ y la potencia $3$; el $4!$ y la potencia $4$ son los de $P_3$.
          Y se queda corta: $\frac{5{,}5}{24}\approx 0{,}23$, y el error vale
          al menos $\frac{2{,}3}{6}\approx 0{,}38$.
      - texto: '$|E|\le\dfrac{6}{3!}(3-2)^3$'
        correcta: true
        porque: |-
          $6$ es mayor que el máximo de $|y'''|$ en $[2,3]$, unos $5{,}2$, así
          que también acota el error: una cota holgada sigue siendo una cota.
          Es más holgada que la de la B, que es la que se lee en la cuadrícula.

  # Decisión: la diapositiva seguramente pretendía una sola buena, la A, la cota
  # que sale de leer en la cuadrícula el máximo de |y⁽⁴⁾| en [−3,−2], unos
  # 1,8 (medido a 600 ppp: −1,81 en x = −2). Pero la D también es cierta,
