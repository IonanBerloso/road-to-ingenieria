        <text class="cq4-cadena-l" x="58.1" y="50.7" text-anchor="end" fill="var(--d1)">(1)</text>
        <text class="cq4-cadena-l" x="58.1" y="109.4" text-anchor="end" fill="var(--alt)">(2)</text>
        <text class="cq4-cadena-l" x="58.1" y="224.6" text-anchor="end" fill="var(--d2)">(3)</text>
