    opciones:
      - texto: |-
          (1) puede ser la gráfica de $y''(x)$.
        correcta: true
        porque: |-
          En el máximo de $y$, cerca de $x=-1{,}55$, la curva es cóncava hacia
          abajo y la (1) es negativa; en el mínimo suave de cerca de
          $x=0{,}15$ es cóncava hacia arriba y la (1), positiva; y la (1)
          cambia de signo donde $y$ cambia de concavidad.
      - texto: |-
          (2) puede ser la gráfica de $y''(x)$.
        porque: |-
          En el máximo de $y$, cerca de $x=-1{,}55$, la (2) vale unos $1{,}5$:
          diría que ahí $y$ es cóncava hacia arriba, y en un máximo es al
          revés. Y en el mínimo de cerca de $x=0{,}15$ es negativa.
      - texto: |-
          Ni (1) ni (2) pueden ser la gráfica de $y''(x)$.
        porque: |-
          La (1) es compatible con la gráfica: negativa donde $y$ se curva
          hacia abajo, alrededor de sus máximos, y positiva alrededor de su
          mínimo.

  - id: concavidad-de-la-inversa
    bloque: '4.8'
    diapositiva: 19
    pregunta: |
      Supongamos que $y(x)$ es una función dos veces derivable en el intervalo
      $(a,b)$, que admite inversa $y^{-1}(x)$. Si conocemos la concavidad de
      $y(x)$, ¿Podemos asegurar algo acerca de la concavidad de $y^{-1}(x)$?
    opciones:
      - texto: 'La concavidad de $y^{-1}(x)$ es la misma que la de $y(x)$.'
        porque: |-
          Falla con $y=x^2$ en $(0,1)$: es convexa y su inversa, $\sqrt{x}$, es
          cóncava. Solo coinciden cuando $y$ decrece, como $y=\frac{1}{x}$ en
          $(1,2)$, convexa y con inversa convexa.
      - texto: 'La concavidad de $y^{-1}(x)$ es la contraria que la de $y(x)$.'
        porque: |-
          Es lo que pasa si $y$ crece: $y=x^2$ en $(0,1)$ es convexa y
          $\sqrt{x}$, cóncava. Pero si $y$ decrece se conserva: $y=\frac{1}{x}$
          es convexa y su inversa, ella misma, también.
      - texto: 'No podemos asegurar nada acerca de la concavidad de $y^{-1}(x)$.'
        correcta: true
        porque: |-
          Derivando dos veces la inversa, $(y^{-1})''=-\frac{y''}{(y')^3}$, así
          que su concavidad depende del signo de $y''$ y también del de $y'$.
          Solo con la concavidad de $y$ no basta: $x^2$ en $(0,1)$ la invierte
          y $\frac{1}{x}$ la conserva.
