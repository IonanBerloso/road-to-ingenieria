asignatura: calculo
tema: t04-estudio-local
titulo: Las cuestiones de las diapositivas del tema 4
fuente: >-
  Las diapositivas de clase del tema 4 de Cálculo, «Estudio local de funciones
  reales de una variable real» (UPV/EHU): diecinueve preguntas tipo test para
  las cuestiones en grupo y para el oral de la final y de la extraordinaria.
  Las diapositivas no traen la solución: la respuesta y el porqué de cada
  opción son de este sitio, y las figuras están redibujadas.
diapositivas: 19
bloques:
  - { id: '4.1-4.2', titulo: Extremos locales y globales }
  - { id: '4.3', titulo: El teorema de Rolle }
  - { id: '4.4', titulo: El teorema del valor medio }
  - { id: '4.5', titulo: Crecimiento }
  - { id: '4.6', titulo: El teorema de Taylor }
  - { id: '4.7', titulo: Conservación del signo }
  - { id: '4.8', titulo: 'Derivadas, crecimiento y concavidad' }
