    opciones:
      - texto: '$N=0$'
        porque: |-
          La pendiente media entre los extremos es
          $\frac{y(17)-y(3)}{17-3}=\frac{4-2}{14}=\frac{1}{7}$, y por el teorema
          del valor medio al menos un punto tiene esa derivada. Cero es
          imposible.
      - texto: '$N=1$'
        porque: |-
          El teorema del valor medio asegura al menos uno, no uno solo. Hay que
          contar los puntos donde la tangente es paralela a la recta que une
          $(3,2)$ y $(17,4)$, y son tres.
      - texto: '$N=2$'
        porque: |-
          Se queda corto: en la subida del primer mínimo al máximo la pendiente
          pasa dos veces por $\frac{1}{7}$, al arrancar y al frenar, y en la
          subida final, una vez más.
      - texto: '$N=3$'
        correcta: true
        porque: |-
          $\frac{1}{7}$ es una pendiente positiva y pequeña. En las bajadas la
          derivada es negativa y no la alcanza; en la subida del primer mínimo
          al máximo crece desde $0$ y vuelve a $0$, y pasa dos veces por
          $\frac{1}{7}$; en la subida final, que arranca con derivada $0$, una
          vez. Tres puntos.
      - texto: '$N=4$'
        porque: |-
          Sobra uno: en las bajadas, de $x=3$ al primer mínimo y del máximo al
          segundo mínimo, la derivada es negativa y no puede valer
          $\frac{1}{7}$. Solo quedan las dos subidas, con dos puntos y uno.

  # Decisión: la E da por hecho que el ritmo de cambio no se hace positivo entre
  # dos medidas. En rigor la tabla da cinco valores sueltos de dT/dt, y con
  # eso la F también se defiende. Se marca la E, que es lo que la pregunta
  # pretende (crecimiento y signo de la derivada).
  - id: temperatura-mas-baja
    bloque: '4.5'
    diapositiva: 6
    pregunta: |
      La siguiente tabla muestra el ritmo de cambio de la temperatura T en
      cierta localidad, medida cada hora desde las 7:00 hasta las 11:00. ¿En
      cuál de estas horas la temperatura era menor?

      $$
      \begin{array}{|l|c|c|c|c|c|}\hline t\ (\text{horas}) & 7 & 8 & 9 & 10 & 11\\ \hline dT/dt\ (\text{grados/hora}) & -5 & -1 & 0 & -2 & -4\\ \hline\end{array}
      $$
    opciones:
      - texto: A las 7:00
        porque: |-
          A las 7:00 el ritmo es $-5$: la temperatura está bajando, así que un
          rato después ya es menor. La hora más fría no es la del ritmo más
          negativo, sino aquella hasta la que la temperatura no ha dejado de
          bajar.
      - texto: A las 8:00
        porque: |-
          El ritmo de las 8:00, $-1$, es negativo: la temperatura sigue bajando
          después. Que baje más despacio que a las 7:00 no quiere decir que
          haya tocado fondo.
      - texto: A las 9:00
        porque: |-
          A las 9:00 el ritmo es $0$, y eso tienta a ver un mínimo. Pero a las
          10:00 y a las 11:00 vuelve a ser negativo, así que la temperatura
          sigue bajando: el $0$ es una pausa, no un mínimo.
      - texto: A las 10:00
        porque: |-
          A las 10:00 el ritmo es $-2$: la temperatura todavía baja, y a las
          11:00 es menor.
      - texto: A las 11:00
        correcta: true
        porque: |-
          El ritmo es negativo en todas las medidas salvo a las 9:00, donde
          vale $0$: la temperatura no ha dejado de bajar en toda la mañana, así
          que la más baja es la última, la de las 11:00. Con derivada negativa,
          la función decrece.
      - texto: No puede saberse
        porque: |-
          Con lo que da la tabla se puede: el ritmo de cambio no es positivo en
          ninguna medida, así que la temperatura baja o se estanca toda la
          mañana. El único resquicio es que no dice qué pasa entre dos medidas,
          y la pregunta supone que el ritmo no cambia de signo entre ellas.

  - id: inversa-de-una-creciente
    bloque: '4.5'
    diapositiva: 7
    pregunta: |
      Supongamos que $y(x)$ es una función derivable y creciente en el
      intervalo $(a,b)$. Sabemos que $y(x)$ admite función inversa
      $y^{-1}(x)$. ¿Cuál de las siguientes afirmaciones es cierta?
    opciones:
      - texto: '$y^{-1}(x)$ es también creciente'
        correcta: true
        porque: |-
          Si $x_1<x_2$, entonces $y(x_1)<y(x_2)$, y leída al revés esa
          desigualdad dice que la inversa conserva el orden: a un valor mayor
          le corresponde un origen mayor. Donde $y'\ne 0$, además,
          $(y^{-1})'=\frac{1}{y'}$ tiene el mismo signo que $y'$.
      - texto: '$y^{-1}(x)$ es decreciente'
        porque: |-
          Confunde la inversa con la función $\frac{1}{y}$, que sí decrece si
          $y$ crece y es positiva. La inversa deshace $y$ y conserva el orden:
          si $y(x_1)<y(x_2)$, es porque $x_1<x_2$.
      - texto: '$y^{-1}(x)$ puede ser creciente o decreciente'
        porque: |-
          El sentido de la inversa no es libre: lo fija el de $y$. Al reflejar
          la gráfica respecto de la recta $y=x$, una curva que sube sigue
          subiendo.

  # Decisión: la diapositiva seguramente pretendía una sola buena, la B, la cota
