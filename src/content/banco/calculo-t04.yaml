        <desc id="cq4-primitiva-d">Cuatro recuadros con los mismos ejes, de x igual a menos cuatro a x igual a dos. En el primero, y prima de x: empieza en menos 1,6, se anula en x igual a menos 2,65, llega a un máximo de 0,7 en x igual a menos uno, se anula en 0,6 y acaba en menos 1,7. La (1) baja de 1,3 a un mínimo de 0,35 en menos 2,7, sube hasta un máximo de 1,9 cerca de 0,6 y baja hasta uno. La (2) baja de 0,8 a un mínimo de menos 0,75 en menos 2,65, sube hasta un máximo de dos cerca de 0,8 y baja hasta 0,9. La (3) sube de 0,7 a un máximo de 2,1 cerca de menos 2,5, baja hasta un mínimo de 0,4 cerca de uno y sube hasta uno.</desc>
