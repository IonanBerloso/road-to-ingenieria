    opciones:
      - texto: En el primer trimestre
        porque: |-
          En marzo está el pico más alto de los que hay dentro del año, un
          máximo local, pero la gráfica acaba el año todavía más arriba: el
          beneficio de los últimos días de diciembre lo supera. El máximo
          absoluto de un intervalo cerrado puede estar en un extremo.
      - texto: En el segundo trimestre
        porque: |-
          En abr-jun el beneficio no hace más que bajar, desde el pico de marzo
          hasta el valle de finales de junio: ahí anda el mínimo del año, no el
          máximo.
      - texto: En el tercer trimestre
        porque: |-
          En jul-sep el beneficio sube desde el valle de junio, pero termina
          por debajo del pico de marzo. El pequeño máximo de principios de
          octubre ya es del cuarto trimestre.
      - texto: En el cuarto trimestre
        correcta: true
        porque: |-
          El beneficio más alto del año es el del último día: la gráfica
          termina subiendo con fuerza y acaba por encima del pico de marzo. En
          un intervalo cerrado, el máximo absoluto se busca entre los máximos
          locales y los extremos del intervalo, y aquí gana el extremo.

  - id: dos-corredores
    bloque: '4.3'
    diapositiva: 3
    pregunta: |
      Dos corredores comienzan la carrera en el mismo instante y llegan a la
      vez a la meta. ¿Cuál de las siguientes afirmaciones es cierta?
    opciones:
      - texto: >-
          Aparte de al inicio y al final de la carrera, en algún otro instante
          ambos corredores iban a la par.
        porque: |-
          Uno puede ir delante toda la carrera y que el otro lo alcance justo
          en la meta. Que las posiciones coincidan en los extremos no obliga a
          que coincidan en medio.
      - texto: Ambos corredores llegaron a la meta a la misma velocidad.
        porque: |-
          Llegar a la vez es coincidir en la posición, no en la velocidad: uno
          puede entrar esprintando y el otro frenando.
      - texto: En algún instante de la carrera, ambos corrían a la misma velocidad.
        correcta: true
        porque: |-
          Es el teorema de Rolle aplicado a la diferencia de posiciones,
          $d(t)=s_1(t)-s_2(t)$: vale $0$ al salir y $0$ al llegar, así que en
          algún instante intermedio $d'(t)=0$, es decir, $v_1(t)=v_2(t)$.
      - texto: Ninguna de las anteriores afirmaciones es cierta en general.
        porque: |-
          La C lo es siempre, con tal de que las posiciones sean funciones
          derivables del tiempo: la diferencia de posiciones empieza y acaba en
          $0$, y Rolle da un instante con la misma velocidad.

  - id: valor-medio-del-valor-absoluto
    bloque: '4.4'
    diapositiva: 4
    pregunta: |
      Para la función $y(x)=|x|$ definida en el intervalo $[-0{,}5;\,2]$,
      existe un punto $c\in(-0{,}5;\,2)$ tal que:

      $y'(c)=\dfrac{y(2)-y(-0{,}5)}{2-(-0{,}5)}$

      ¿Verdadero o falso?
    opciones:
      - texto: Es verdadero.
        porque: |-
          El cociente vale $\frac{2-0{,}5}{2{,}5}=0{,}6$, y la derivada de
          $|x|$ solo toma dos valores, $-1$ para $x<0$ y $1$ para $x>0$:
          ninguno es $0{,}6$. Se elige esta opción al aplicar el teorema del
          valor medio sin mirar sus hipótesis.
      - texto: Es falso.
        correcta: true
        porque: |-
          $|x|$ no es derivable en $x=0$, que está dentro del intervalo, así
          que el teorema del valor medio no se aplica. Y la cuenta lo confirma:
          se pide $y'(c)=0{,}6$, y $y'$ solo vale $-1$ o $1$.
      - texto: No puede saberse si es verdadero o falso
        porque: |-
          Se sabe haciendo la cuenta: la pendiente media es $0{,}6$ y la
          derivada de $|x|$ vale $\pm 1$ donde existe. Que el teorema no se
          aplique no deja la pregunta en el aire.

  - id: pendiente-un-septimo
    bloque: '4.4'
    diapositiva: 5
    pregunta: |
      Dada la función $y(x)$ cuya gráfica se muestra, calcular el número N de
      puntos $z\in(3,17)\ /\ y'(z)=\frac{1}{7}$.
    figura: |
