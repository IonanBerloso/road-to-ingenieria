    opciones:
      - texto: '$|E|\le\dfrac{2}{4!}(-3+2)^4$'
        correcta: true
        porque: |-
          El resto es $E=\frac{y^{(4)}(c)}{4!}(-3+2)^4$ con $c\in(-3,-2)$. En
          ese intervalo la derivada cuarta baja de unos $1{,}5$ en $x=-3$ a
          unos $-1{,}8$ en $x=-2$, así que $|y^{(4)}(c)|\le 2$: es la cota que
          se lee en la gráfica.
      - texto: '$|E|\le\dfrac{1{,}5}{4!}(-3+2)^4$'
        porque: |-
          $1{,}5$ es lo que vale la derivada cuarta en $x=-3$, pero la cota
          tiene que valer para cualquier $c\in(-3,-2)$, y cerca de $x=-2$ la
          derivada cuarta llega a $-1{,}8$: su valor absoluto pasa de $1{,}5$.
      - texto: '$|E|\le\dfrac{-3}{4!}(-3+2)^4$'
        porque: |-
          Una cota de $|E|$ no puede ser negativa, porque $|E|\ge 0$. El $-3$
          sale de leer el valor más negativo de la gráfica, que además está
          fuera de $(-3,-2)$, y olvidar el valor absoluto.
      - texto: '$|E|\le\dfrac{3}{4!}(-3+2)^4$'
        correcta: true
        porque: |-
          $3$ supera el máximo de $|y^{(4)}|$ en $[-3,-2]$, que es de $1{,}8$,
          así que también acota el error, aunque más holgada que la A. Sale de
          mirar la gráfica fuera del intervalo, donde la derivada cuarta baja
          hasta $-2{,}75$.

  # Decisión: la diapositiva seguramente pretendía una sola buena, la A, la cota
  # que sale de leer en la cuadrícula el máximo de |y⁽⁴⁾| en [−2,0], unos
  # 2,75 (medido a 600 ppp: −2,75 en x ≈ −1,4). Pero la B también es cierta,
  # porque 4 > 2,75: van las dos.
  - id: cota-de-taylor-en-0
    bloque: '4.6'
    diapositiva: 10
    varias: true
    pregunta: |
      La figura muestra la gráfica de la derivada cuarta de $y(x)$. Supongamos
      que se utiliza el polinomio de Taylor de orden 3 ($P_3(x)$) en el punto
      $a = -2$ para calcular aproximadamente el valor de $y(0)$. Calcular una
      cota del error E cometido.
    figura: |
      <svg viewBox="0 0 340 300" role="img" width="340" height="300"
           aria-labelledby="cq4-taylor-4b-t cq4-taylor-4b-d">
        <title id="cq4-taylor-4b-t">La gráfica de la derivada cuarta de y(x)</title>
        <desc id="cq4-taylor-4b-d">La gráfica de la derivada cuarta de y(x) entre x igual a menos cuatro y x igual a 3,5, sobre una cuadrícula de media unidad. Empieza en cuatro, baja deprisa hasta un rellano de 1,8 cerca de x igual a menos 3,5, corta el eje en menos 2,5 y llega a un mínimo de menos 2,75 cerca de x igual a menos 1,4. Sube, corta el eje cerca de menos 0,35, hace un máximo pequeño de 2,4 cerca de x igual a 0,8 y un mínimo de 2 en 1,6, y sube hasta un máximo de 5,2 cerca de x igual a tres antes de caer hasta 2,8 en 3,5.</desc>
