    opciones:
      - texto: La igualdad es cierta en general.
        porque: |-
          La primera igualdad vale siempre, porque $D_1$ y $D_2$ solo
          comparten el segmento $x=0$; las otras piden que $F$ integre lo
          mismo en las dos mitades. Con $F=x$: $\iint_{D_1}x=-1$ e
          $\iint_{D_2}x=1$, así que $\iint_D x=0$, y no $-2$ ni $2$.
      - texto: La igualdad no es cierta en general.
        correcta: true
        porque: |-
          Partir $D$ en $D_1$ y $D_2$ siempre suma, pero
          $2\iint_{D_1}F=2\iint_{D_2}F$ exige que $F$ integre lo mismo en las
          dos mitades, y eso no pasa con cualquier $F$: con $F=x$,
          $\iint_{D_1}x\,dx\,dy=-1$ e $\iint_{D_2}x\,dx\,dy=1$.

  - id: simetria-que-iguala-las-dos-mitades
    bloque: '7.2'
    diapositiva: 2
    pregunta: |
      ¿Qué propiedad de $F(x,y)$ nos permite asegurar que las siguientes
      igualdades son ciertas?

      $$
      \iint_D F(x,y)\,dx\,dy=\iint_{D_1}F(x,y)\,dx\,dy+\iint_{D_2}F(x,y)\,dx\,dy=2\iint_{D_1}F(x,y)\,dx\,dy=2\iint_{D_2}F(x,y)\,dx\,dy
      $$
