        <text class="cq7-tetraedro-n" x="176.4" y="185.1" text-anchor="start" fill="var(--faint)">x</text>
        <text class="cq7-tetraedro-n" x="222.2" y="71.2" text-anchor="start" fill="var(--faint)">y</text>
        <text class="cq7-tetraedro-n" x="82.8" y="53.9" text-anchor="middle" fill="var(--faint)">z</text>
      </svg>
    opciones:
      - texto: '$\int_0^1\int_0^{1-z}\int_0^{2(1-x-z)}F(x,y,z)\,dy\,dx\,dz$'
        correcta: true
        porque: |-
          $R$ es el tetraedro de vértices $(0,0,0)$, $(1,0,0)$, $(0,2,0)$ y
          $(0,0,1)$, bajo el plano $x+\frac{y}{2}+z=1$. Despejando, $y$ va de
          $0$ a $2(1-x-z)$; en $y=0$ queda $x+z\le1$, así que $x$ va de $0$ a
          $1-z$; y $z$, de $0$ a $1$.
      - texto: '$\int_0^2\int_0^{\frac{2-y}{2}}\int_0^{2-2z-y}F(x,y,z)\,dx\,dz\,dy$'
        porque: |-
          Los límites de $y$ y de $z$ están bien, pero el de $x$ no: de
          $x+\frac{y}{2}+z=1$ sale $x=1-z-\frac{y}{2}=\frac{2-2z-y}{2}$. Sin
          dividir por $2$, en $y=z=0$ $x$ llegaría a $2$, y el vértice está en
          $x=1$.
      - texto: '$\int_0^1\int_0^{1-z}\int_0^{2-2z-2y}F(x,y,z)\,dy\,dz\,dx$'
        porque: |-
          La integral de dentro es en $y$ y su límite lleva la propia $y$, y
          la de en medio es en $z$ y su límite lleva $z$: así no se puede
          evaluar. En ese orden habría que escribir $y$ hasta $2-2z-2x$ y $z$
          hasta $1-x$.

