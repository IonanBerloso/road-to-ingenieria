    opciones:
      - texto: '$\int_0^{\pi/2}\int_0^{1}\int_0^{1-\rho^2}F(\rho\cos\theta,\rho\operatorname{sen}\theta,z)\,dz\,d\rho\,d\theta$'
        porque: |-
          Falla en tres cosas: $\theta$ de $0$ a $\pi/2$ es el primer
          cuadrante, y el sólido está sobre el segundo, con $x\le0$ e $y\ge0$;
          el techo es $z=1+\rho^2$, no $1-\rho^2$; y falta el jacobiano $\rho$.
      - texto: '$\int_{\pi/2}^{\pi}\int_0^{1}\int_0^{\rho^2}F(\rho\cos\theta,\rho\operatorname{sen}\theta,z)\,\rho\,dz\,d\rho\,d\theta$'
        porque: |-
          $\theta$, $\rho$ y el jacobiano están bien, pero el techo no:
          $x^2+y^2=z-1$ es $z=1+\rho^2$, y $z=\rho^2$ es el paraboloide sin
          subir.
      - texto: '$\int_{\pi/2}^{\pi}\int_0^{1}\int_0^{1+\rho^2}F(\rho\cos\theta,\rho\operatorname{sen}\theta,z)\,\rho\,dz\,d\rho\,d\theta$'
        correcta: true
        porque: |-
          La superficie $x^2+y^2=z-1$ es $z=1+\rho^2$ en cilíndricas. El
          sólido está sobre el cuarto de círculo de radio $1$ del segundo
          cuadrante, entre $(-1,0)$ y $(0,1)$: $\theta\in[\pi/2,\pi]$ y
          $\rho\in[0,1]$. Y el jacobiano es $\rho$.

  - id: esfericas-bajo-el-plano-z-0
    bloque: '7.8.4-7.8.5'
    diapositiva: 29
    pregunta: |
      Considerar la función $F(x,y,z)$ definida en el sólido $R$ que muestra
      la figura, limitado inferiormente por la superficie $x^2+y^2+z^2=4$.

      ¿Cuál es la expresión en coordenadas esféricas de
      $\iiint_R F(x,y,z)\,dx\,dy\,dz$?
