      </svg>
    opciones:
      - texto: '$F(x,y,z)=x+y+z$'
        porque: |-
          $x+y+z$ no es par en $x$: el término $x$ cambia de signo al pasar de
          $R_1$ a $R_2$, y sus integrales en las dos mitades son opuestas. Las
          de $y$ y de $z$ sí coinciden, pero la suma ya no:
          $\iiint_{R_1}F\ne\iiint_{R_2}F$.
      - texto: '$F(x,y,z)=\cos x+y^2+z^3$'
        correcta: true
        porque: |-
          $\cos x+y^2+z^3$ no cambia al poner $-x$ en lugar de $x$:
          $\cos(-x)=\cos x$, y los otros dos términos no dependen de $x$. Como
          $R_2$ es el reflejo de $R_1$ en el plano $x=0$, las dos integrales
          valen lo mismo, y cada una es la mitad de la de $R$.
      - texto: Ambas funciones verifican la propiedad
        porque: |-
          Solo la segunda: $x+y+z$ lleva el término $x$, impar, que integra con
          signos opuestos en las dos mitades.
      - texto: La propiedad se verifica para cualquier función $F(x,y,z)$
        porque: |-
          La simetría del sólido no basta: hace falta también que $F$ sea par
          en $x$. Con $F=x$, las integrales en $R_1$ y en $R_2$ son opuestas y
          la de $R$ vale $0$.

