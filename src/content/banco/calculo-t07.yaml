    opciones:
      - texto: El sólido A
        correcta: true
        porque: |-
          Con los tres pares de límites constantes, $x\in[0,1]$, $z\in[0,1]$ e
          $y\in[0,2]$, la integral recorre una caja: la de $A$, que va de
          $(0,0,0)$ a $(1,2,1)$. Con límites constantes el orden de
          integración da igual.
      - texto: El sólido B
        porque: |-
          $B$ es media caja: por arriba lo corta el plano inclinado que baja de
          $z=1$ en $y=0$ a $z=0$ en $y=2$, así que $z$ va de $0$ a
          $1-\frac{y}{2}$, no hasta $1$. Con límites constantes se integra la
          caja entera.
      - texto: El sólido C
        porque: |-
          $C$ es el tetraedro bajo el plano $x+\frac{y}{2}+z=1$: sus límites
          dependen de las otras variables, por ejemplo $x$ de $0$ a
          $1-\frac{y}{2}-z$. Unos límites constantes describen una caja.
      - texto: La integral no se evalúa de ese modo para ninguno de los tres sólidos.
        porque: |-
          Hay uno para el que vale: la caja $A$, que es justo el recinto que
          describen tres pares de límites constantes.
      - texto: La integral se evalúa de ese modo para los tres sólidos.
        porque: |-
          Solo vale para la caja: $B$ tiene por techo el plano
          $z=1-\frac{y}{2}$ y $C$, una cara inclinada, y con límites constantes
          cualquier recinto sale caja.

