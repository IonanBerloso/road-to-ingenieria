    opciones:
      - texto: '$F(-x,y)=-F(x,y)$'
        porque: |-
          Es la simetría impar en $x$: con ella las integrales en $D_1$ y en
          $D_2$ son opuestas, y la de $D$ vale $0$. Las igualdades piden que
          sean iguales.
      - texto: '$F(-x,y)=F(x,y)$'
        correcta: true
        porque: |-
          $D_2$ es el reflejo de $D_1$ respecto del eje $y$. Si
          $F(-x,y)=F(x,y)$, el cambio $x\to-x$ lleva la integral en $D_1$ a la
          de $D_2$ sin cambiar su valor: las dos valen lo mismo y cada una es
          la mitad del total.
      - texto: '$F(-x,-y)=F(x,y)$'
        porque: |-
          Es la simetría respecto del origen, que lleva $(x,y)$ a $(-x,-y)$:
          $D_1$ iría a parar a $[0,1]\times[-2,0]$, que no está en $D$. No
          relaciona $D_1$ con $D_2$.
      - texto: '$F(x,-y)=F(x,y)$'
        porque: |-
          Es la simetría respecto del eje $x$, que cambia $y$ por $-y$, y $D$
          está entero por encima del eje: no relaciona $D_1$ con $D_2$.

  - id: volumen-entre-dos-cilindros-parabolicos-dados
    bloque: '7.2'
    diapositiva: 3
    pregunta: |
      Calcular el volumen $V$ del sólido limitado por los fragmentos de los
      cilindros parabólicos $y=x^2+2$, $y=2x^2$ que muestra la figura.
    figura: |
      <svg viewBox="0 0 340 290" role="img" width="340" height="290"
           aria-labelledby="cq7-cilindros-dados-t cq7-cilindros-dados-d">
