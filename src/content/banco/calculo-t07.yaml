    opciones:
      - texto: '$\int_0^1\int_0^{1-z}\int_0^2F(x,y,z)\,dx\,dy\,dz$'
        porque: |-
          Pone en $x$ el recorrido de $y$: la caja mide $1$ en $x$ y $2$ en
          $y$. Y a cada altura $z$, $y$ llega hasta $2-2z$, que es donde el
          plano $z=1-\frac{y}{2}$ corta esa altura, no hasta $1-z$.
      - texto: '$\int_0^1\int_0^2\int_0^{2-y}F(x,y,z)\,dz\,dy\,dx$'
        porque: |-
          El techo $z=2-y$ vale $2$ en $y=0$, y el sólido solo tiene $1$ de
          alto. El plano de la figura baja de $z=1$ en $y=0$ a $z=0$ en
          $y=2$: es $z=1-\frac{y}{2}$.
      - texto: '$\int_0^2\int_0^{1-\frac{y}{2}}\int_0^1F(x,y,z)\,dx\,dz\,dy$'
        correcta: true
        porque: |-
          $R$ es la mitad de la caja $[0,1]\times[0,2]\times[0,1]$ que queda
          bajo el plano que va de la arista $y=0$, $z=1$ a la arista $y=2$,
          $z=0$: $z=1-\frac{y}{2}$. Así, $x\in[0,1]$, $z\in[0,1-\frac{y}{2}]$
          e $y\in[0,2]$.

