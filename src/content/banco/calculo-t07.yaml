    opciones:
      - texto: '$\begin{array}{l}\boxed{1}:\frac{x}{4}+\frac{3}{4}\\ \boxed{2}:\frac{x}{4}\\ \boxed{3}:\frac{x}{4}\\ \boxed{4}:x-3\end{array}$'
        porque: |-
          $\boxed{1}$ tiene que ser el borde de abajo, $y=\frac{x}{4}$, y en el
          tramo central $\boxed{2}$ y $\boxed{3}$ no pueden ser los dos
          $\frac{x}{4}$: la integral iría de un borde a sí mismo y valdría
          cero.
      - texto: '$\begin{array}{l}\boxed{1}:\frac{y}{4}\\ \boxed{2}:\frac{y}{4}\\ \boxed{3}:\frac{y}{4}+\frac{3}{4}\\ \boxed{4}:y-3\end{array}$'
        porque: |-
          Tiene la forma buena, pero en la variable equivocada: la integral de
          dentro es en $y$, así que sus límites son funciones de $x$, los
          bordes despejados como $y=f(x)$.
      - texto: '$\begin{array}{l}\boxed{1}:\frac{x}{4}\\ \boxed{2}:\frac{x}{4}\\ \boxed{3}:\frac{x}{4}+\frac{3}{4}\\ \boxed{4}:x-3\end{array}$'
        correcta: true
        porque: |-
          Con $x$ por fuera, cada límite es un borde despejado como $y=f(x)$.
          El de abajo es $y=\frac{x}{4}$, de $(0,0)$ a $(4,1)$; el de arriba,
          $y=\frac{x}{4}+\frac34$, de $(1,1)$ a $(5,2)$. Entre $x=0$ y $x=1$ el
          techo es $y=x$, y entre $x=4$ y $x=5$ el suelo es $y=x-3$.
      - texto: '$\begin{array}{l}\boxed{1}:\frac{x}{4}\\ \boxed{2}:\frac{x}{4}\\ \boxed{3}:x-3\\ \boxed{4}:\frac{x}{4}+\frac{3}{4}\end{array}$'
        porque: |-
          Acierta los dos primeros, pero cambia $\boxed{3}$ y $\boxed{4}$: en
          el tramo central el techo es $y=\frac{x}{4}+\frac34$, e $y=x-3$ es el
          suelo del último tramo, de $(4,1)$ a $(5,2)$.

