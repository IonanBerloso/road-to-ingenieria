        <text class="cq7-simetrico-n" x="145.8" y="37.6" text-anchor="middle" fill="var(--faint)">z</text>
      </svg>
    opciones:
      - texto: '$\iiint_R xyz\,dx\,dy\,dz=0$'
        correcta: true
        porque: |-
          $xyz$ cambia de signo al poner $-x$ en lugar de $x$, y $R$ es
          simétrico respecto del plano $x=0$: lo que aporta cada punto
          $(x,y,z)$ lo cancela su reflejo $(-x,y,z)$, y la integral vale $0$.
      - texto: '$\iiint_R \left(x^2+y+z\right)dx\,dy\,dz\le 0$'
        porque: |-
          En $R$ es $y\ge0$ y $z\ge0$, y $x^2\ge0$: el integrando no es
          negativo en ningún punto y es positivo en casi todos, así que la
          integral es positiva.
      - texto: '$\iiint_R dx\,dy\,dz\ge 4$'
        porque: |-
          $\iiint_R dx\,dy\,dz$ es el volumen de $R$, y $R$ cabe en la caja
          $[-1,1]\times[0,1]\times[0,2]$, de volumen $4$, sin llenarla: el
          techo solo llega a $z=2$ en los bordes $x=\pm1$ y baja en el centro.
          El volumen es menor que $4$.

