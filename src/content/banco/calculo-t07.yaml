    opciones:
      - texto: '$\begin{cases}x=-u+v\\ y=u-v\end{cases}$'
        porque: |-
          Da $y=-x$ para todos los $(u,v)$: lleva el rectángulo entero a una
          recta, y su jacobiano es $0$. No puede transformar un recinto con
          área en otro.
      - texto: '$\begin{cases}x=u+2v\\ y=u+v\end{cases}$'
        porque: |-
          Lleva bien dos vértices, $(-1,0)$ a $(-1,-1)$ y $(1,0)$ a $(1,1)$,
          pero $(1,2)$ va a $(5,3)$, fuera de $D_1$, cuyo vértice de la derecha
          es $(3,-1)$.
      - texto: '$\begin{cases}x=u+v\\ y=u-v\end{cases}$'
        correcta: true
        porque: |-
          Lleva los vértices del rectángulo a los del cuadrado:
          $(-1,0)\mapsto(-1,-1)$, $(1,0)\mapsto(1,1)$, $(1,2)\mapsto(3,-1)$ y
          $(-1,2)\mapsto(1,-3)$. Como es lineal, lleva lados a lados, y $D_2$
          entero a $D_1$.

  # La diapositiva rotula la cuarta opción otra vez como «C»: aquí es la
  # cuarta, sin más.
  - id: jacobiano-de-un-cambio-lineal-entre-triangulos
    bloque: '7.4'
    diapositiva: 17
    pregunta: |
      Considerar la función continua $F(x,y)$ definida en el dominio $D_1$ que
      muestra la figura. Considerar el cambio de variables lineal que
      trasforma el recinto $D_1$ en el recinto $D_2$:

      $$
      \begin{cases}x=au+bv\\ y=cu+dv\end{cases}\qquad a,b,c,d\in\mathbb{R}
      $$

      Calcular el Jacobiano de esta transformación.
    figura: |
      <svg viewBox="0 0 406 206" role="img" width="406" height="206"
