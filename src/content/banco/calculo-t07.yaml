    opciones:
      - texto: '$\begin{array}{l}\boxed{1}:x\\ \boxed{2}:\frac{x}{4}+\frac{3}{4}\\ \boxed{3}:x-3\end{array}$'
        porque: |-
          Son los bordes despejados como $y=f(x)$, y la integral de dentro es
          en $x$: sus límites tienen que ser funciones de $y$. $\boxed{1}:x$
          pondría la propia variable de integración en su límite.
      - texto: '$\begin{array}{l}\boxed{1}:y\\ \boxed{2}:4y-3\\ \boxed{3}:y+3\end{array}$'
        correcta: true
        porque: |-
          Con $y$ por fuera, cada límite es un borde despejado como $x=g(y)$.
          Para $0\le y\le1$, $x$ va del lado $y=x$, o sea $x=y$, hasta
          $x=4y$. Para $1\le y\le2$, del lado de arriba, de $(1,1)$ a $(5,2)$,
          que es $x=4y-3$, hasta el de la derecha, de $(4,1)$ a $(5,2)$, que es
          $x=y+3$.
      - texto: '$\begin{array}{l}\boxed{1}:0\\ \boxed{2}:y+3\\ \boxed{3}:y\end{array}$'
        porque: |-
          $\boxed{1}=0$ haría del eje $y$ el borde izquierdo, y el
          paralelogramo solo lo toca en el origen: para $0\le y\le1$ empieza
          en $x=y$. Y en el segundo tramo $y+3$ es el borde derecho, no el
          izquierdo.
      - texto: '$\begin{array}{l}\boxed{1}:0\\ \boxed{2}:x-3\\ \boxed{3}:\frac{1}{4}x+\frac{3}{4}\end{array}$'
        porque: |-
          $\boxed{2}$ y $\boxed{3}$ son funciones de $x$, y la integral de
          dentro es en $x$. Los bordes del segundo tramo, despejados como
          $x=g(y)$, son $x=4y-3$ y $x=y+3$.

