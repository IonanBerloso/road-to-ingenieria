    opciones:
      - texto: '$\begin{array}{l}\boxed{1}:\frac{3}{5}y\\ \boxed{2}:\frac{5}{2}y\\ \boxed{3}:\frac{3}{5}y\\ \boxed{4}:\frac{19}{3}-\frac{2}{3}y\end{array}$'
        correcta: true
        porque: |-
          Con $y$ por fuera, los bordes se despejan como $x=g(y)$. El de la
          izquierda, de $(0,0)$ a $(3,5)$, es $y=\frac53x$, o sea $x=\frac35y$.
          Hasta $y=2$ el de la derecha es el de abajo, $y=\frac25x$, o sea
          $x=\frac52y$; y de $y=2$ a $y=5$, el lado de $(5,2)$ a $(3,5)$, que
          es $x=\frac{19}{3}-\frac23y$.
      - texto: '$\begin{array}{l}\boxed{1}:\frac{3}{5}x\\ \boxed{2}:\frac{5}{2}x\\ \boxed{3}:\frac{3}{5}x\\ \boxed{4}:\frac{19}{3}-\frac{2}{3}x\end{array}$'
        porque: |-
          Son las mismas expresiones con $x$ en lugar de $y$, y la integral de
          dentro es en $x$: sus límites no pueden depender de $x$, sino de
          $y$, que va por fuera.
      - texto: '$\begin{array}{l}\boxed{1}:\frac{5}{3}y\\ \boxed{2}:\frac{2}{5}y\\ \boxed{3}:\frac{5}{3}y\\ \boxed{4}:\frac{19}{3}-\frac{2}{3}y\end{array}$'
        porque: |-
          Copia los coeficientes de las rectas escritas como $y=f(x)$ en vez
          de despejar $x$: el borde $y=\frac53x$ es $x=\frac35y$, y el
          $y=\frac25x$ es $x=\frac52y$. Por eso $\boxed{1}$ le queda por encima
          a $\boxed{2}$.

