    opciones:
      - texto: '$\begin{array}{l}\boxed{1}:-\sqrt{4-(y-2)^2}\\ \boxed{2}:0\\ \boxed{3}:x\\ \boxed{4}:y\end{array}$'
        correcta: true
        porque: |-
          La curva es la mitad izquierda de la circunferencia
          $x^2+(y-2)^2=4$, de centro $(0,2)$ y radio $2$. Como los límites de
          fuera, $0$ y $4$, son los de $y$, la integral de dentro es en $x$, y
          $x$ va del arco, $x=-\sqrt{4-(y-2)^2}$, al eje $y$, $x=0$.
      - texto: '$\begin{array}{l}\boxed{1}:0\\ \boxed{2}:\sqrt{4-(y-2)^2}\\ \boxed{3}:x\\ \boxed{4}:y\end{array}$'
        porque: |-
          Describe la mitad derecha del disco: con $x$ de $0$ a
          $+\sqrt{4-(y-2)^2}$ los puntos quedan a la derecha del eje $y$, y el
          recinto de la figura está a la izquierda.
      - texto: '$\begin{array}{l}\boxed{1}:0\\ \boxed{2}:-\sqrt{4-(y-2)^2}\\ \boxed{3}:y\\ \boxed{4}:x\end{array}$'
        porque: |-
          Pone $y$ como variable de dentro con límites que dependen de la
          propia $y$, y deja fuera $x$ de $0$ a $4$, cuando en el recinto $x$ va
          de $-2$ a $0$.

