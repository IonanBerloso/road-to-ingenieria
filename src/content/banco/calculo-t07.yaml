  - { id: '7.8.4-7.8.5', titulo: Coordenadas cilíndricas y esféricas }
preguntas:
  - id: dominio-partido-en-dos-mitades
    bloque: '7.2'
    diapositiva: 1
    pregunta: |
      Considerar una función $F(x,y)$ definida en el dominio $D=D_1\cup D_2$
      que muestra la figura. ¿Son ciertas las siguientes igualdades?

      $$
      \iint_D F(x,y)\,dx\,dy=\iint_{D_1}F(x,y)\,dx\,dy+\iint_{D_2}F(x,y)\,dx\,dy=2\iint_{D_1}F(x,y)\,dx\,dy=2\iint_{D_2}F(x,y)\,dx\,dy
      $$
    figura: |
      <svg viewBox="0 0 340 265" role="img" width="340" height="265"
           aria-labelledby="cq7-dominio-1-t cq7-dominio-1-d">
        <title id="cq7-dominio-1-t">El dominio D partido en dos mitades por el eje y</title>
        <desc id="cq7-dominio-1-d">El rectángulo D, de x entre menos uno y uno y de y entre cero y dos, sombreado. El eje y lo parte en dos mitades iguales: D₁ a la izquierda y D₂ a la derecha.</desc>
        <style>
            .cq7-dominio-1-eje { stroke: var(--rule); stroke-width: 1.1; fill: none; }
            .cq7-dominio-1-c { stroke: var(--d1); stroke-width: 2.8; fill: none; }
            .cq7-dominio-1-c2 { stroke: var(--alt); stroke-width: 2.8; fill: none; }
