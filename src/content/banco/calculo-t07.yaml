    opciones:
      - texto: '$\int_1^3\int_1^5\int_0^{1+y(4-y)}F(x,y,z)\,dy\,dz\,dx$'
        porque: |-
          La integral de dentro es en $y$ y su límite, $1+y(4-y)$, depende de
          la propia $y$: no se puede evaluar. Esa expresión es el techo en
          $z$, y solo vale como límite de $z$.
      - texto: '$\int_1^5\int_2^{2+\sqrt{5-z}}\int_1^3F(x,y,z)\,dx\,dy\,dz$'
        correcta: true
        porque: |-
          Según la figura, $R$ está sobre el rectángulo $1\le x\le3$,
          $2\le y\le4$, entre $z=1$ y el cilindro. A cada altura
          $z\in[1,5]$, despejando $y^2-4y+(z-1)=0$ sale $y=2\pm\sqrt{5-z}$, y
          la rama de $y\ge2$ da $y$ de $2$ a $2+\sqrt{5-z}$; $x$ va de $1$ a
          $3$.
      - texto: '$\int_1^4\int_1^3\int_0^{1+y(4-y)}F(x,y,z)\,dz\,dx\,dy$'
        porque: |-
          El orden es posible, pero los límites no son los de la figura: $R$
          empieza en $z=1$, no en $z=0$, y ocupa $2\le y\le4$, no
          $1\le y\le4$. En ese orden serían $\int_2^4\int_1^3\int_1^{1+y(4-y)}$.

  # Decisión: dos de las tres integrales no tienen sentido, la B y la C, y
  # ninguna opción las junta. La diapositiva no dice si busca las dos: se
  # marcan las dos (varias: true).
  - id: que-integral-no-tiene-sentido
    bloque: '7.8.1-7.8.3'
    diapositiva: 27
    varias: true
    pregunta: |
      ¿Cuál de las siguientes integrales NO tiene sentido?
    opciones:
      - texto: '$\int_1^3\int_{y-1}^{2}\int_0^{y}F(x,y,z)\,dz\,dx\,dy$'
        porque: |-
          Cada límite depende solo de variables que se integran por fuera: $z$
          de $0$ a $y$, $x$ de $y-1$ a $2$, e $y$ de $1$ a $3$. Y como
          $y-1\le 2$ en ese intervalo, los límites de $x$ están en orden. Es
          una integral bien planteada.
      - texto: '$\int_1^3\int_0^{y}\int_2^{y-1}F(x,y,z)\,dx\,dy\,dz$'
        correcta: true
        porque: |-
          La integral central es en $y$, y sus límites, de $0$ a $y$, dependen
          de la propia $y$: no hay forma de leerlos. Los límites de una
          variable solo pueden depender de las que se integran por fuera de
          ella, y aquí la de fuera es $z$.
      - texto: '$\int_{-1}^{1}\int_{-\sqrt{1-x^2}}^{\sqrt{1-x^2}}\int_0^{\sqrt{x^2+y^2-1}}F(x,y,z)\,dz\,dy\,dx$'
        correcta: true
        porque: |-
          Las dos integrales de fuera recorren el disco $x^2+y^2\le1$, y dentro
          de él $x^2+y^2-1\le 0$: el límite superior $\sqrt{x^2+y^2-1}$ no es
          un número real salvo en el borde.
      - texto: Ninguna de las tres integrales tiene sentido
        porque: |-
          La primera sí lo tiene: cada uno de sus límites depende solo de
          variables de fuera. Las que fallan son la segunda y la tercera.
      - texto: Las tres integrales tienen sentido
        porque: |-
          La segunda pone en los límites de $y$ la propia $y$, y la tercera
          pide la raíz de $x^2+y^2-1$, que es negativo dentro del disco unidad.

  - id: cilindricas-bajo-un-paraboloide
    bloque: '7.8.4-7.8.5'
    diapositiva: 28
    pregunta: |
      Considerar la función $F(x,y,z)$ definida en el sólido $R$ que muestra
      la figura, limitado superiormente por la superficie $x^2+y^2=z-1$.
      ¿Cuál es la expresión en coordenadas cilíndricas de
      $\iiint_R F(x,y,z)\,dx\,dy\,dz$?
    figura: |
      <svg viewBox="0 0 300 280" role="img" width="300" height="280"
           aria-labelledby="cq7-cilindricas-t cq7-cilindricas-d">
        <title id="cq7-cilindricas-t">Un cuarto de cilindro con el techo en el paraboloide z = 1 + x² + y²</title>
        <desc id="cq7-cilindricas-d">Una caja de referencia en trazo discontinuo, de la esquina menos uno, cero, dos arriba a la izquierda a la esquina cero, uno, cero abajo a la derecha. El sólido R es un cuarto de cilindro de radio uno sobre el cuarto de círculo del suelo con x negativa e y positiva. Delante se ven sus dos caras planas, sobre los planos x igual a cero e y igual a cero, que se juntan en el eje z; la pared del cilindro queda detrás. Su techo es el paraboloide, con forma de cuenco: a la altura uno sobre el eje z y subiendo hasta la altura dos en el borde del cilindro.</desc>
