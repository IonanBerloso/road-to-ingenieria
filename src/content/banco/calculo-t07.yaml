    opciones:
      - texto: '$\int_0^{\pi/2}\int_{\pi/2}^{\pi}\int_0^{2}F(r\operatorname{sen}\varphi\cos\theta,r\operatorname{sen}\varphi\operatorname{sen}\theta,r\cos\varphi)\,r^2\,dr\,d\varphi\,d\theta$'
        porque: |-
          Los límites están bien, pero falta el $\operatorname{sen}\varphi$ del
          jacobiano: en esféricas
          $dx\,dy\,dz=r^2\operatorname{sen}\varphi\,dr\,d\varphi\,d\theta$.
      - texto: '$\int_0^{\pi/2}\int_0^{\pi/2}\int_0^{4}F(r\operatorname{sen}\varphi\cos\theta,r\operatorname{sen}\varphi\operatorname{sen}\theta,r\cos\varphi)\,r^2\operatorname{sen}\varphi\,dr\,d\varphi\,d\theta$'
        porque: |-
          Dos fallos: $\varphi$ de $0$ a $\pi/2$ es la mitad de arriba, y el
          sólido está por debajo de $z=0$; y el radio llega a $2$, no a $4$,
          porque $x^2+y^2+z^2=4$ es $r^2=4$.
      - texto: '$\int_0^{\pi/2}\int_{\pi/2}^{\pi}\int_0^{2}F(r\operatorname{sen}\varphi\cos\theta,r\operatorname{sen}\varphi\operatorname{sen}\theta,r\cos\varphi)\,r^2\operatorname{sen}\varphi\,dr\,d\varphi\,d\theta$'
        correcta: true
        porque: |-
          El sólido es el trozo de bola de radio $2$ con $x\ge0$, $y\ge0$ y
          $z\le0$, entre $(0,2,0)$ y $(2,0,-2)$: $r\in[0,2]$,
          $\theta\in[0,\pi/2]$ y, por estar debajo del plano $z=0$,
          $\varphi\in[\pi/2,\pi]$. Con el jacobiano
          $r^2\operatorname{sen}\varphi$.
