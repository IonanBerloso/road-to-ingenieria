    opciones:
      - texto: '$\dfrac{1}{3}$'
        porque: |-
          Es demasiado poco: en cada $x\in[0,1]$ la base tiene una anchura
          $(x^2+2)-2x^2=2-x^2\ge 1$, así que su área pasa de $1$, y el sólido
          tiene tres de alto. El volumen pasa de $3$.
      - texto: '$\dfrac{2}{3}$'
        porque: |-
          Tampoco llega: la base mide $\int_0^1(2-x^2)\,dx=\frac53$ y la
          altura, de $z=-1$ a $z=2$, es $3$. $\frac23$ no alcanza ni el área
          de la base.
      - texto: '$5$'
        correcta: true
        porque: |-
          Según la figura, el sólido va de $x=0$ a $x=1$, entre $y=2x^2$ e
          $y=x^2+2$, y de $z=-1$ a $z=2$. La base mide
          $\int_0^1\big[(x^2+2)-2x^2\big]dx=\int_0^1(2-x^2)\,dx=\frac53$, y por
          la altura, $3$: $V=5$.
      - texto: '$4$'
        porque: |-
          Pediría una base de $\frac43$, que es lo que sale con
          $\int_0^1(2-2x^2)\,dx$, poniendo $y=2$ donde va $y=x^2+2$. La base
          mide $\frac53$, y por $3$ de alto, $5$.

