    opciones:
      - texto: '$J=\dfrac{1}{3}$'
        correcta: true
        porque: |-
          Un cambio lineal multiplica las áreas por $\lvert J\rvert$:
          $\text{área}(D_1)=\lvert J\rvert\,\text{área}(D_2)$. $D_1$ mide
          $\frac12$ y $D_2$, de vértices $(0,0)$, $(2,1)$ y $(1,2)$, mide
          $\frac12\lvert 2\cdot2-1\cdot1\rvert=\frac32$: $\lvert J\rvert=\frac13$.
          Llevando $(2,1)$ a $(1,0)$ y $(1,2)$ a $(1,1)$ sale $a=b=\frac13$,
          $c=-\frac13$, $d=\frac23$ y $J=ad-bc=\frac13$.
      - texto: '$J=-\dfrac{2}{3}$'
        porque: |-
          $\lvert J\rvert$ tiene que ser el cociente de las áreas,
          $\frac{1/2}{3/2}=\frac13$, y $\frac23$ no lo es. El signo menos solo
          saldría emparejando los vértices al revés, y daría $-\frac13$.
      - texto: '$J=\dfrac{3}{4}$'
        porque: |-
          Es el producto de las dos áreas, $\frac32\cdot\frac12$, y lo que las
          relaciona es un cociente: $\text{área}(D_1)=\lvert J\rvert\,\text{área}(D_2)$,
          así que $\lvert J\rvert=\frac13$.
      - texto: '$J=\dfrac{1}{4}$'
        porque: |-
          Tampoco sale del cociente de áreas, que es $\frac{1/2}{3/2}=\frac13$.
          Con $\lvert J\rvert=\frac14$, $D_2$ tendría que medir $2$, y mide
          $\frac32$.

  # Decisión: la B y la C describen las dos el semidisco de abajo, cada una en un
  # orden, y la diapositiva pregunta «cuál» en singular: se marcan las dos
  # (varias: true). La D da el mismo número, 9π/2, pero es el semidisco de
  # la derecha; su porqué lo explica.
  - id: integral-polar-de-un-semidisco
    bloque: '7.5'
    diapositiva: 18
    varias: true
    pregunta: |
      ¿Cuál de las integrales es equivalente a

      $$
      \int_0^3\left(\int_\pi^{2\pi}\rho\,d\theta\right)d\rho\,?
      $$
    opciones:
      - texto: '$\int_0^3\left(\int_{-\sqrt{9-x^2}}^{0}dy\right)dx$'
        porque: |-
          Con $x$ de $0$ a $3$ e $y$ de $-\sqrt{9-x^2}$ a $0$ recorre solo el
          cuarto de disco del cuarto cuadrante, la mitad de la región: vale
          $\frac{9\pi}{4}$.
      - texto: '$\int_{-3}^{0}\left(\int_{-\sqrt{9-y^2}}^{\sqrt{9-y^2}}dx\right)dy$'
        correcta: true
        porque: |-
          La integral polar recorre $\rho\in[0,3]$ y $\theta\in[\pi,2\pi]$ con
          el jacobiano $\rho$: el semidisco de radio $3$ por debajo del eje
          $x$, con integrando $1$. Esta lo describe con $y$ por fuera: $y$ de
          $-3$ a $0$ y, a cada altura, $x$ de $-\sqrt{9-y^2}$ a
          $\sqrt{9-y^2}$.
      - texto: '$\int_{-3}^{3}\left(\int_{-\sqrt{9-x^2}}^{0}dy\right)dx$'
        correcta: true
        porque: |-
          Es el mismo semidisco de abajo con $x$ por fuera: $x$ de $-3$ a $3$
          y, en cada abscisa, $y$ desde el arco, $-\sqrt{9-x^2}$, hasta el eje.
          Vale lo mismo que la polar, $\frac{9\pi}{2}$.
      - texto: '$\int_{-3}^{3}\left(\int_{0}^{\sqrt{9-y^2}}dx\right)dy$'
        porque: |-
          Da el mismo número, $\frac{9\pi}{2}$, porque las dos mitades del
          disco tienen la misma área, pero es el semidisco de la derecha, y la
          polar recorre el de abajo. Con integrando $y$ en vez de $1$, la polar
          daría $-18$ y esta, $0$.

