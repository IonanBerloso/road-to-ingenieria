        <desc id="cq7-elipses-d">Dos recuadros. En el (1), el recinto D sombreado entre dos elipses centradas en el origen y alargadas en vertical: la de dentro corta los ejes en x igual a más y menos uno y en y igual a más y menos dos; la de fuera, en x igual a más y menos dos y en y igual a más y menos cuatro. En el (2), sobre una rejilla, la gráfica de h entre t igual a cero y t igual a seis: empieza en medio, sube, pasa por la altura uno en t igual a uno, baja casi hasta cero en t igual a dos, sube hasta la altura dos en t igual a cuatro y vuelve a bajar hasta terminar en la altura uno en t igual a seis.</desc>
