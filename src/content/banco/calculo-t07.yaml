      </svg>
    opciones:
      - texto: Verdadero
        porque: |-
          $\int_0^1\int_1^2$ recorre el cuadrado $[0,1]\times[1,2]$, y $D$ es
          solo la mitad: el triángulo por debajo de la recta $x+y=2$. Con
          $F=1$, la integral de la derecha da $1$ y el área de $D$ es
          $\frac12$.
      - texto: Falso
        correcta: true
        porque: |-
          Para cada $x\in[0,1]$, $y$ va de $1$ hasta la hipotenusa, $y=2-x$, y
          no hasta $2$: $\iint_D F=\int_0^1\left(\int_1^{2-x}F\,dy\right)dx$.
          Los límites constantes describen el cuadrado entero.

