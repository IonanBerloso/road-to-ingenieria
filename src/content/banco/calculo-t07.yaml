    opciones:
      - texto: '$\dfrac{40}{3}$'
        correcta: true
        porque: |-
          Según la figura, el sólido está entre $x=y^2$, que pasa por el origen
          y por $(1,\pm1)$, y $x=4-y^2$, que pasa por $(4,0)$ y por $(3,\pm1)$,
          con $y\in[-1,1]$ y $z\in[0,2]$. La base mide
          $\int_{-1}^{1}\big[(4-y^2)-y^2\big]dy=8-\frac43=\frac{20}{3}$, y por
          $2$ de alto: $V=\frac{40}{3}$.
      - texto: '$\dfrac{20}{3}$'
        porque: |-
          Es el área de la base, $\int_{-1}^{1}(4-2y^2)\,dy=\frac{20}{3}$, sin
          multiplicar por la altura: el sólido va de $z=0$ a $z=2$.
      - texto: '$\dfrac{2}{3}$'
        porque: |-
          Es demasiado poco: la base tiene en cada $y$ una anchura
          $4-2y^2\ge 2$, así que su área pasa de $4$, y con dos de alto el
          volumen pasa de $8$.
      - texto: '$\dfrac{26}{3}$'
        porque: |-
          La caja de la figura mide $4\cdot2\cdot2=16$, y lo que queda fuera
          del sólido son dos cuñas parabólicas de
          $2\int_{-1}^{1}y^2\,dy=\frac43$ cada una: $V=16-\frac83=\frac{40}{3}$.
          Para llegar a $\frac{26}{3}$ habría que quitar $\frac{22}{3}$.

  # La diapositiva trae el paraboloide sobre el cuadrado con la curva de
  # nivel dibujada. No hace falta para contestar y el enunciado no la nombra:
  # no se redibuja.
  - id: curva-de-nivel-del-valor-medio
    bloque: '7.2'
    diapositiva: 5
    pregunta: |
      Considerar la función $F(x,y)=x^2+y^2$ en el dominio
      $D=[-1,1]\times[-1,1]$. Calcular la curva de nivel

      $$
      F(x,y)=\overline{M}
      $$

      siendo $\overline{M}$ el valor medio de $F(x,y)$.
    opciones:
      - texto: '$x^2+y^2=\dfrac{1}{3}$'
        porque: |-
          Es el valor medio de $x^2$ solo:
          $\frac14\iint_D x^2\,dx\,dy=\frac14\cdot\frac43=\frac13$. Falta
          sumar el de $y^2$, que vale lo mismo.
      - texto: '$x^2+y^2=\dfrac{2}{3}$'
        correcta: true
        porque: |-
          $\overline{M}=\frac{1}{4}\iint_D (x^2+y^2)\,dx\,dy$, con $4$ el área
          del cuadrado. Cada sumando da
          $\int_{-1}^{1}x^2\,dx\cdot\int_{-1}^{1}dy=\frac23\cdot2=\frac43$, así
          que $\overline{M}=\frac14\cdot\frac83=\frac23$ y la curva de nivel es
          la circunferencia $x^2+y^2=\frac23$.
      - texto: '$x^2+y^2=2$'
        porque: |-
          $2$ es el valor máximo de $F$ en el cuadrado, el de las esquinas,
          $1+1$. El valor medio queda muy por debajo, y la circunferencia
          $x^2+y^2=2$ solo toca $D$ en esas cuatro esquinas.
      - texto: '$x^2+y^2=3$'
        porque: |-
          La circunferencia de radio $\sqrt3$ no toca el cuadrado, donde $F$
          no pasa de $2$. Un valor medio no puede superar al máximo.

  - id: limites-constantes-en-un-triangulo
    bloque: '7.3'
    diapositiva: 6
    pregunta: |
      Considerar la función continua $F(x,y)$ definida en el dominio $D$ que
      muestra la figura. Entonces:

      $$
      \iint_D F(x,y)\,dx\,dy=\int_0^1\left(\int_1^2F(x,y)\,dy\right)dx
      $$

      ¿Verdadero o falso?
