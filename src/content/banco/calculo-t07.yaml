    opciones:
      - texto: '$2\pi$'
        correcta: true
        porque: |-
          Con las polares generalizadas $x=\rho\cos\theta$,
          $y=2\rho\operatorname{sen}\theta$, de jacobiano $2\rho$, es
          $x^2+\frac{y^2}{4}=\rho^2$ y $D$ queda entre $\rho=1$ y $\rho=2$. La
          integral es
          $\int_0^{2\pi}\int_1^2h'(\rho^2)\,2\rho\,d\rho\,d\theta=2\pi\big[h(\rho^2)\big]_1^2=2\pi\big(h(4)-h(1)\big)$,
          y la gráfica da $h(4)=2$ y $h(1)=1$: $2\pi$.
      - texto: '$4\pi$'
        porque: |-
          Es $2\pi\,h(4)$: olvida restar el valor en el borde de dentro,
          $h(1)=1$. La integral es $2\pi\big(h(4)-h(1)\big)=2\pi$.
      - texto: '$\pi$'
        porque: |-
          Sale con el jacobiano de las polares normales, $\rho$, en vez del de
          las generalizadas, $2\rho$: la elipse $x^2+\frac{y^2}{4}=\rho^2$ pide
          $y=2\rho\operatorname{sen}\theta$, y ese $2$ dobla el resultado.
      - texto: '$6\pi$'
        porque: |-
          Suma los dos valores en vez de restarlos:
          $2\pi\big(h(4)+h(1)\big)=6\pi$. Al integrar la derivada se resta:
          $2\pi\big(h(4)-h(1)\big)=2\pi$.

  - id: solido-simetrico-partido-en-dos
    bloque: '7.8.1-7.8.3'
    diapositiva: 21
    pregunta: |
      Considerar sólido $R$ que muestra la figura, simétrico respecto al plano
      $x=0$. Considerar la descomposición de $R$ en los dos sólidos $R_1$ y
      $R_2$. ¿Cuál de las funciones indicadas $F(x,y,z)$ verifica la siguiente
      propiedad?

      $$
      \iiint_R F(x,y,z)\,dx\,dy\,dz=2\iiint_{R_1}F(x,y,z)\,dx\,dy\,dz=2\iiint_{R_2}F(x,y,z)\,dx\,dy\,dz
      $$
    figura: |
      <svg viewBox="0 0 462 181" role="img" width="462" height="181"
           aria-labelledby="cq7-simetrico-partido-t cq7-simetrico-partido-d">
        <title id="cq7-simetrico-partido-t">El sólido R, simétrico respecto del plano x = 0, y sus dos mitades</title>
        <desc id="cq7-simetrico-partido-d">Tres recuadros en perspectiva. En el primero, el sólido R: una pieza sobre un rectángulo del suelo, con el techo curvo, alto en los dos extremos y bajo en el centro, simétrica respecto del plano x igual a cero. En el segundo, R₁, la mitad de R con x positiva; en el tercero, R₂, la mitad con x negativa, con la cara del corte a la vista. Las dos mitades son una el reflejo de la otra.</desc>
