    opciones:
      - texto: '$\begin{array}{l}\boxed{1}:\frac{2}{5}y\\ \boxed{2}:\frac{5}{3}y\\ \boxed{3}:\frac{2}{5}x\\ \boxed{4}:-\frac{3}{2}y+\frac{19}{2}\end{array}$'
        porque: |-
          Tiene los coeficientes buenos, pero casi todos con $y$, y la
          integral de dentro es en $y$: sus límites tienen que ser funciones de
          $x$.
      - texto: '$\begin{array}{l}\boxed{1}:\frac{5}{2}y\\ \boxed{2}:\frac{3}{5}y\\ \boxed{3}:\frac{5}{2}y\\ \boxed{4}:-\frac{3}{2}y+\frac{19}{2}\end{array}$'
        porque: |-
          Despeja los bordes como $x=g(y)$, que es lo que haría falta con $y$
          por fuera. Aquí $y$ se integra por dentro, así que sus límites son
          funciones de $x$.
      - texto: '$\begin{array}{l}\boxed{1}:\frac{2}{5}x\\ \boxed{2}:\frac{5}{3}x\\ \boxed{3}:\frac{2}{5}x\\ \boxed{4}:-\frac{3}{2}x+\frac{19}{2}\end{array}$'
        correcta: true
        porque: |-
          Con $x$ por fuera, los bordes se escriben como $y=f(x)$: el de abajo,
          de $(0,0)$ a $(5,2)$, es $y=\frac25x$; el de arriba a la izquierda,
          de $(0,0)$ a $(3,5)$, es $y=\frac53x$; y el de la derecha, de $(3,5)$
          a $(5,2)$, tiene pendiente $-\frac32$: $y=-\frac32x+\frac{19}{2}$.

