    opciones:
      - texto: '$\begin{array}{l}\boxed{1}:-1\\ \boxed{2}:1\\ \boxed{3}:-2\\ \boxed{4}:2\\ \boxed{5}:-1\\ \boxed{6}:1\end{array}$'
        porque: |-
          Con límites constantes se integran tres rectángulos,
          $[-2,-1]\times[-1,1]$, $[-1,1]\times[-2,2]$ y $[1,2]\times[-1,1]$:
          una cruz que contiene el recinto y además las esquinas que quedan
          fuera de los arcos.
      - texto: '$\begin{array}{l}\boxed{1}:-\sqrt{1-(x+1)^2}\\ \boxed{2}:+\sqrt{1-(x+1)^2}\\ \boxed{3}:-1-\sqrt{1-x^2}\\ \boxed{4}:1+\sqrt{1-x^2}\\ \boxed{5}:-\sqrt{1-(x-1)^2}\\ \boxed{6}:+\sqrt{1-(x-1)^2}\end{array}$'
        correcta: true
        porque: |-
          Los lóbulos son semicírculos de radio $1$. Entre $x=-2$ y $x=-1$
          manda el de centro $(-1,0)$: $y=\pm\sqrt{1-(x+1)^2}$. Entre $x=-1$ y
          $x=1$, del lóbulo de abajo, de centro $(0,-1)$, al de arriba, de
          centro $(0,1)$: de $-1-\sqrt{1-x^2}$ a $1+\sqrt{1-x^2}$. Y entre $x=1$
          y $x=2$, el de centro $(1,0)$: $y=\pm\sqrt{1-(x-1)^2}$.
      - texto: '$\begin{array}{l}\boxed{1}:-\sqrt{1-(x-1)^2}\\ \boxed{2}:+\sqrt{1-(x-1)^2}\\ \boxed{3}:1+\sqrt{1-x^2}\\ \boxed{4}:1-\sqrt{1-x^2}\\ \boxed{5}:-\sqrt{1-(x+1)^2}\\ \boxed{6}:+\sqrt{1-(x+1)^2}\end{array}$'
        porque: |-
          Cambia los lóbulos laterales: el de la izquierda, para
          $x\in[-2,-1]$, es $(x+1)^2+y^2=1$, y $(x-1)^2+y^2=1$ es el de la
          derecha. Y en el tramo central los dos límites salen del lóbulo de
          arriba: el suelo del recinto es $-1-\sqrt{1-x^2}$.

  - id: ordenar-tres-integrales-de-f-positiva
    bloque: '7.3'
    diapositiva: 15
    pregunta: |
      Supongamos que la función $F(x,y)$ es positiva para todo $(x,y)$.
      Ordenar los valores de las siguientes integrales.

      $$
      I_1=\int_0^1\left(\int_{x^2}^1F(x,y)\,dy\right)dx,\quad I_2=\int_0^1\left(\int_{x^3}^1F(x,y)\,dy\right)dx,\quad I_3=\int_0^1\left(\int_{x}^1F(x,y)\,dy\right)dx
      $$
    opciones:
      - texto: '$I_3<I_1<I_2$'
        correcta: true
        porque: |-
          Para $0<x<1$ es $x^3<x^2<x$, así que la región de $I_3$, entre $y=x$
          e $y=1$, está dentro de la de $I_1$, entre $y=x^2$ e $y=1$, y esta
          dentro de la de $I_2$. Con $F>0$, más región es más integral:
          $I_3<I_1<I_2$.
      - texto: '$I_1<I_2<I_3$'
        porque: |-
          Ordena las regiones al revés: entre $0$ y $1$ las potencias altas son
          más pequeñas, $x^3<x^2<x$, así que empezar en $y=x^3$ deja más
          región por encima que empezar en $y=x$. La de $I_3$ es la más
          pequeña.
      - texto: '$I_2<I_1<I_3$'
        porque: |-
          Acierta que $I_1$ queda en medio, pero cambia los extremos: la región
          de $I_2$, que empieza en $y=x^3$, es la mayor, y la de $I_3$, que
          empieza en $y=x$, la menor.
      - texto: '$I_3<I_2<I_1$'
        porque: |-
          Pone $I_1$ por encima de $I_2$, y la región de $I_2$ contiene a la de
          $I_1$: entre $0$ y $1$, $x^3\le x^2$, así que desde $y=x^3$ hasta $1$
          hay más región que desde $y=x^2$.

