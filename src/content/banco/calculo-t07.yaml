        porque: |-
          $y$ de $0$ a $4$ para todos los $x$ describe el rectángulo
          $[-2,0]\times[0,4]$, que contiene el semidisco y además las dos
          esquinas que quedan fuera del arco.
      - texto: '$\begin{array}{l}\boxed{1}:0\\ \boxed{2}:2-\sqrt{4-x^2}\\ \boxed{3}:2+\sqrt{4-x^2}\end{array}$'
        correcta: true
        porque: |-
          Con $x$ por fuera, de $-2$ a $0$, se despeja $y$ de la circunferencia
          $x^2+(y-2)^2=4$: $y=2\pm\sqrt{4-x^2}$. Para cada $x$, $y$ va del arco
          de abajo, $2-\sqrt{4-x^2}$, al de arriba, $2+\sqrt{4-x^2}$.
      - texto: '$\begin{array}{l}\boxed{1}:0\\ \boxed{2}:-\sqrt{4-(y-2)^2}\\ \boxed{3}:+\sqrt{4-(y-2)^2}\end{array}$'
        porque: |-
          Son los límites de $x$ despejados de la circunferencia, funciones de
          $y$, y la integral de dentro es en $y$: sus límites tienen que
          depender de $x$.

