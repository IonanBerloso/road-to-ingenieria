asignatura: calculo
tema: t07-integral-multiple
titulo: Las cuestiones de las diapositivas del tema 7
fuente: >-
  Las diapositivas de clase del tema 7 de Cálculo, «Integral múltiple»
  (UPV/EHU): veintinueve preguntas tipo test para las cuestiones en grupo y
  para el oral de la final y de la extraordinaria. Las diapositivas no traen
  la solución: la respuesta y el porqué de cada opción son de este sitio, y
  las figuras están redibujadas.
