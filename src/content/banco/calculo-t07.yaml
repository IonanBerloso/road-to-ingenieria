        <desc id="cq7-cilindros-dibujados-d">Una caja de referencia en trazo discontinuo, de la esquina cero, uno, dos a la esquina cuatro, menos uno, cero. Dentro, dos paredes verticales curvas de altura dos. La primera es la parábola con el vértice en el origen, abierta hacia las x positivas, que llega a las caras y igual a más y menos uno en x igual a uno. La segunda es la parábola con el vértice en x igual a cuatro, abierta hacia las x negativas, que llega a esas caras en x igual a tres. El sólido es lo que queda entre las dos paredes, con su cara de arriba sombreada; las marcas uno y tres, en la arista de delante, señalan dónde acaban las paredes.</desc>
