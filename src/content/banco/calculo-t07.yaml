    opciones:
      - texto: '$\int_{-\pi/4}^{\pi/4}\left(\int_0^1F(\rho\cos\theta,\rho\operatorname{sen}\theta)\,\rho\,d\rho\right)d\theta$'
        porque: |-
          Es el hueco de la derecha, y además con $\rho$ de $0$ a $1$: el trozo
          del disco pequeño entre $-\pi/4$ y $\pi/4$. $D$ es la corona entre
          los radios $1$ y $3$ que da la vuelta por la izquierda.
      - texto: '$\int_{\pi/4}^{7\pi/4}\left(\int_1^3F(\rho\cos\theta,\rho\operatorname{sen}\theta)\,d\rho\right)d\theta$'
        porque: |-
          Los límites están bien, pero falta el jacobiano: en polares
          $dx\,dy=\rho\,d\rho\,d\theta$.
      - texto: '$\int_{\pi/4}^{7\pi/4}\left(\int_1^3F(\rho\cos\theta,\rho\operatorname{sen}\theta)\,\rho\,d\rho\right)d\theta$'
        correcta: true
        porque: |-
          $D$ está entre las circunferencias de radio $1$ y $3$ y entre los
          segmentos a $\pi/4$ y a $-\pi/4$, dando la vuelta por la izquierda:
          $\theta$ de $\pi/4$ a $7\pi/4$ y $\rho$ de $1$ a $3$, con el
          jacobiano $\rho$.
      - texto: '$\int_{-\pi/4}^{\pi/4}\left(\int_1^3F(\rho\cos\theta,\rho\operatorname{sen}\theta)\,\rho\,d\rho\right)d\theta$'
        porque: |-
          Toma el ángulo del hueco, de $-\pi/4$ a $\pi/4$, que es justo lo que
          no es de $D$. Girando en sentido antihorario desde el segmento de
          $\pi/4$ se llega al de $7\pi/4$ por la izquierda.

  - id: polares-generalizadas-entre-dos-elipses
    bloque: '7.5'
    diapositiva: 20
    pregunta: |
      Considerar el recinto $D$ que muestra la figura (1), limitado por dos
      elipses. Considerar también la función derivable $h(t)$, cuya gráfica
      muestra la figura (2). Calcular:

      $$
      \iint_D h'\!\left(x^2+\frac{y^2}{4}\right)dx\,dy
      $$
    figura: |
      <svg viewBox="0 0 386 266" role="img" width="386" height="266"
