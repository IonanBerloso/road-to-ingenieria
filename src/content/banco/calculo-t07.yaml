    opciones:
      - texto: '$\begin{array}{l}\boxed{1}:-x-1\\ \boxed{2}:+\sqrt{1-x^2}\\ \boxed{3}:0\\ \boxed{4}:1\\ \boxed{5}:-\sqrt{1-x^2}\\ \boxed{6}:-x+1\end{array}$'
        correcta: true
        porque: |-
          Entre $x=-1$ y $x=0$ el recinto va del segmento de $(-1,0)$ a
          $(0,-1)$, que es $y=-x-1$, al cuarto de circunferencia de arriba,
          $y=\sqrt{1-x^2}$. Entre $x=0$ y $x=1$, del cuarto de circunferencia
          de abajo, $y=-\sqrt{1-x^2}$, al segmento de $(0,1)$ a $(1,0)$, que es
          $y=-x+1$.
      - texto: '$\begin{array}{l}\boxed{1}:-1\\ \boxed{2}:1\\ \boxed{3}:0\\ \boxed{4}:1\\ \boxed{5}:-1\\ \boxed{6}:1\end{array}$'
        porque: |-
          Con límites constantes, $y$ de $-1$ a $1$ en los dos tramos, se
          integra el cuadrado $[-1,1]\times[-1,1]$ entero, y el recinto es solo
          una parte: le faltan las cuatro esquinas.
      - texto: '$\begin{array}{l}\boxed{1}:x-1\\ \boxed{2}:+\sqrt{x^2-1}\\ \boxed{3}:0\\ \boxed{4}:1\\ \boxed{5}:+\sqrt{x^2-1}\\ \boxed{6}:x+1\end{array}$'
        porque: |-
          $\sqrt{x^2-1}$ no es real para $|x|<1$, que es todo el recinto: la
          circunferencia unidad es $y=\pm\sqrt{1-x^2}$. Y las rectas tienen la
          pendiente cambiada: el lado de $(0,1)$ a $(1,0)$ es $y=1-x$, no
          $y=x+1$.

