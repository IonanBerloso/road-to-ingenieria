    opciones:
      - texto: La representación A
        porque: |-
          Tiene el argumento bien, el doble del de $z$, unos $120^\circ$, pero
          se sale de la circunferencia unidad. Con $|z|<1$, $|z^2|=|z|^2$ es
          todavía más pequeño que $|z|$: al elevar al cuadrado, un complejo
          de dentro del círculo unidad se acerca al origen.
      - texto: La representación B
        correcta: true
        porque: |-
          Al elevar al cuadrado, el argumento se duplica y el módulo se eleva
          al cuadrado. $z$ está a unos $60^\circ$ y dentro de la
          circunferencia unidad, así que $z^2$ está a unos $120^\circ$, en el
          segundo cuadrante, y más cerca del origen que $z$, porque
          $|z|^2<|z|$ cuando $|z|<1$. Solo B cumple las dos cosas.
      - texto: La representación C
        porque: |-
          Está dentro de la circunferencia unidad, pero en el tercer
          cuadrante, a unos $210^\circ$. El argumento de $z^2$ es el doble del
          de $z$: unos $120^\circ$, en el segundo cuadrante.

  - id: una-raiz-cubica
    bloque: '1.3'
    diapositiva: 8
    pregunta: |
      Considerar el número complejo $z$ que muestra la figura. ¿Cuál de los
      tres números complejos A, B o C es una raíz cúbica de $z$?
    figura: |
