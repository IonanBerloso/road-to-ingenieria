    opciones:
      - texto: '$\theta=\operatorname{arctg}\left(\frac{y}{x}\right)$'
        porque: |-
          $\operatorname{arctg}(y/x)$ sale negativa, entre $-\pi/2$ y $0$: es
          un argumento de $z$, pero medido en sentido horario. El $\theta$ del
          dibujo da la vuelta en sentido antihorario y está entre $3\pi/2$ y
          $2\pi$.
      - texto: '$\theta=2\pi+\operatorname{arctg}\left(\frac{y}{x}\right)$'
        correcta: true
        porque: |-
          Con $x>0$ e $y<0$, $\operatorname{arctg}(y/x)$ está entre $-\pi/2$
          y $0$; sumarle una vuelta entera da el mismo punto medido en sentido
          antihorario, entre $3\pi/2$ y $2\pi$, que es el $\theta$ del dibujo.
      - texto: '$\theta=\pi+\operatorname{arctg}\left(\frac{y}{x}\right)$'
        porque: |-
          $\pi+\operatorname{arctg}(y/x)$ cae entre $\pi/2$ y $\pi$, en el
          segundo cuadrante: apunta justo al lado contrario de $z$. Sumar
          $\pi$ es para cuando $x<0$, y aquí $x>0$.

  - id: opuesto-del-conjugado
    bloque: '1.3'
    diapositiva: 6
    pregunta: |
      Dado el número complejo $z$, considerar los dos números complejos
      siguientes: $z_1$, el opuesto del conjugado de $z$, y $z_2$, el
      conjugado del opuesto de $z$. ¿Es cierto que $z_1=z_2$?
    opciones:
      - texto: Es cierto en general
        correcta: true
        porque: |-
          Con $z=x+iy$: el conjugado es $x-iy$ y su opuesto, $z_1=-x+iy$; el
          opuesto es $-x-iy$ y su conjugado, $z_2=-x+iy$. Salen iguales para
          todo $z$: conjugar y cambiar de signo se pueden hacer en cualquier
          orden, porque $\overline{-z}=-\overline{z}$.
      - texto: No es cierto en general
        porque: |-
          Lo es siempre: $z_1=-\overline{z}$ y $z_2=\overline{-z}$, y conjugar
          no toca los factores reales, así que $\overline{-z}=-\overline{z}$.
          Con $z=2+3i$, los dos valen $-2+3i$.
      - texto: Depende de $z_1$ y $z_2$
        porque: |-
          $z_1$ y $z_2$ no se eligen: los fija $z$. Y para cualquier $z=x+iy$
          los dos salen $-x+iy$, así que no hay nada de lo que dependa.

