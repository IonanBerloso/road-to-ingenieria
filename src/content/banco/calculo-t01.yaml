      </svg>
    opciones:
      - texto: La representación A
        porque: |-
          La recta horizontal $y=-3$ es la de $\operatorname{Im}(z)=-3$, que
          sale de $z-\overline{z}=-6i$. Aquí se suman $z$ y su conjugado, y
          las partes imaginarias se cancelan.
      - texto: La representación B
        porque: |-
          El punto $-3$ cumple la condición, pero no es el único: también
          $-3+i$, $-3-5i$ o cualquier $-3+iy$, porque la condición no dice
          nada de la parte imaginaria.
      - texto: La representación C
        correcta: true
        porque: |-
          Con $z=x+iy$, $z+\overline{z}=2x$, así que la condición es $2x=-6$:
          $x=-3$ con $y$ cualquiera, la recta vertical
          $\operatorname{Re}(z)=-3$.

