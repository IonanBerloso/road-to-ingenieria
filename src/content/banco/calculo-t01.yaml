    opciones:
      - texto: '$\theta=\operatorname{arctg}\left(\frac{y}{x}\right)$'
        correcta: true
        porque: |-
          $z$ está en el primer cuadrante, con $x>0$ e $y>0$:
          $\operatorname{arctg}(y/x)$ cae entre $0$ y $\pi/2$, que es donde
          está el $\theta$ del dibujo. Es el único cuadrante en el que la
          arcotangente da el argumento sin corregirla.
      - texto: '$\theta=2\pi+\operatorname{arctg}\left(\frac{y}{x}\right)$'
        porque: |-
          Es la arcotangente más una vuelta entera: señala la misma dirección,
          pero pasa de $2\pi$, y el $\theta$ del dibujo está entre $0$ y
          $\pi/2$. Sumar $2\pi$ es la corrección del cuarto cuadrante, donde
          $\operatorname{arctg}(y/x)$ sale negativa.
      - texto: '$\theta=\pi+\operatorname{arctg}\left(\frac{y}{x}\right)$'
        porque: |-
          Sumar $\pi$ gira media vuelta y lleva al tercer cuadrante: es la
          corrección para cuando $x<0$, y aquí $x>0$.

