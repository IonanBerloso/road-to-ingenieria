      </svg>
    opciones:
      - texto: La figura A
        porque: |-
          Una elipse de focos $z_1$ y $z_2$ es el lugar de los puntos cuyas
          distancias a los focos suman una constante **mayor** que la
          distancia entre ellos. Aquí la suma vale justo $d$, la distancia
          entre los focos, y la elipse degenera.
      - texto: La figura B
        correcta: true
        porque: |-
          Por la desigualdad triangular,
          $|z-z_1|+|z-z_2|\ge|z_1-z_2|=d$, con igualdad exactamente cuando
          $z$ está en el segmento que une $z_1$ y $z_2$. El lugar es ese
          segmento, con sus extremos.
      - texto: La figura C
        porque: |-
          Fuera del segmento la igualdad se rompe: un punto de la recta más
          allá de $z_2$, a distancia $t$ de él, suma $(d+t)+t=d+2t>d$. De la
          recta solo vale el trozo entre $z_1$ y $z_2$.
      - texto: El lugar geométrico es el vacío
        porque: |-
          El punto medio entre $z_1$ y $z_2$ ya es del lugar: está a $d/2$ de
          cada uno y suma $d$. Y lo mismo cualquier punto del segmento que los
          une.

