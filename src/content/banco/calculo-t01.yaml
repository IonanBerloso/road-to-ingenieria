      - texto: '$\theta=\operatorname{arctg}\left(\frac{y}{x}\right)$'
        porque: |-
          Con $x<0$ e $y>0$ el cociente $y/x$ es negativo, y
          $\operatorname{arctg}(y/x)$ sale entre $-\pi/2$ y $0$: un ángulo del
          cuarto cuadrante, el opuesto a donde está $z$. La arcotangente solo
          devuelve ángulos de $(-\pi/2,\pi/2)$, y aquí hay que corregirla.
      - texto: '$\theta=2\pi+\operatorname{arctg}\left(\frac{y}{x}\right)$'
        porque: |-
          $2\pi+\operatorname{arctg}(y/x)$ cae entre $3\pi/2$ y $2\pi$, en el
          cuarto cuadrante: es la corrección para $x>0$ e $y<0$. Aquí $z$
          está en el segundo.
      - texto: '$\theta=\pi+\operatorname{arctg}\left(\frac{y}{x}\right)$'
        correcta: true
        porque: |-
          Como $y/x<0$, $\operatorname{arctg}(y/x)$ está entre $-\pi/2$ y $0$,
          y sumarle $\pi$ lo lleva a $(\pi/2,\pi)$, el segundo cuadrante, que
          es donde está el $\theta$ del dibujo. Siempre que $x<0$ se suma
          $\pi$.

