      </svg>
    opciones:
      - texto: La representación A
        porque: |-
          Es el lugar de $\left|z+\overline{z}\right|\ge 6$, lo de fuera de la
          banda: la desigualdad está al revés.
      - texto: La representación B
        correcta: true
        porque: |-
          $z+\overline{z}=2x$, así que la condición es $|2x|\le 6$, es decir
          $-3\le x\le 3$, con $y$ libre: la banda vertical entre las rectas
          $x=-3$ y $x=3$, con los bordes, porque la desigualdad no es
          estricta.
      - texto: La representación C
        porque: |-
          Las dos rectas son el lugar de la igualdad,
          $\left|z+\overline{z}\right|=6$. La condición es «menor o igual», y
          la cumplen también todos los puntos de entre las dos.
      - texto: La representación D
        porque: |-
          Ese segmento solo tiene números reales, y la condición no le pide
          nada a la parte imaginaria: $2+5i$ la cumple igual que $2$.

