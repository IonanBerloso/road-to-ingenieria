      - texto: La figura A
        porque: |-
          Para que haya elipse la suma tiene que superar la distancia entre
          los focos, $d$; aquí vale $d/2$, menos de lo que puede sumar
          cualquier punto.
      - texto: La figura B
        porque: |-
          Los puntos del segmento suman $d$, no $d/2$. Y ningún punto del
          plano suma menos de $d$.
      - texto: La figura C
        porque: |-
          Sobre la recta, los puntos del segmento suman $d$ y los de fuera,
          más. Ninguno se queda en $d/2$.
      - texto: El lugar geométrico es el vacío
        correcta: true
        porque: |-
          Por la desigualdad triangular,
          $|z-z_1|+|z-z_2|\ge|z_1-z_2|=d$ para todo $z$: la suma nunca baja
          de $d$, así que nunca vale $d/2$. Ningún punto cumple la condición.

