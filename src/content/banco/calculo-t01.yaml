tema: t01-complejos
titulo: Las cuestiones de las diapositivas del tema 1
fuente: >-
  Las diapositivas de clase del tema 1 de Cálculo, «Números complejos»
  (UPV/EHU): diecinueve preguntas tipo test para las cuestiones en grupo y
  para el oral de la final y de la extraordinaria. Las diapositivas no traen
  la solución: la respuesta y el porqué de cada opción son de este sitio, y
  las figuras están redibujadas.
diapositivas: 19
bloques:
  - { id: '1.1', titulo: Forma binómica }
  - { id: '1.2', titulo: El argumento }
  - { id: '1.3', titulo: 'Conjugado, potencias y raíces' }
  - { id: lugares, titulo: Lugares geométricos }
preguntas:
  - id: re-mas-im-igual-a-i
    bloque: '1.1'
    diapositiva: 1
    pregunta: |
      Para calcular la solución de la ecuación
      $\operatorname{Re}(z)+\operatorname{Im}(z)=i$, ¿es correcto el siguiente
      cálculo?

      *Sea $z=x+iy$; $\operatorname{Re}(z)=x$, $\operatorname{Im}(z)=iy$.
      Sustituyendo en la ecuación, $x+iy=i$. Por tanto la solución es $x=0$,
      $y=1$, es decir, $z=i$.*
    opciones:
      - texto: El cálculo es correcto
        porque: |-
          Falla en la segunda línea: la parte imaginaria de $z=x+iy$ es $y$,
          un número real, y no $iy$. Con eso la ecuación dice $x+y=i$, un
          número real igual a $i$, que no puede ser. La «solución» tampoco la
          cumple: $\operatorname{Re}(i)+\operatorname{Im}(i)=0+1=1$.
      - texto: El cálculo no es correcto
        correcta: true
        porque: |-
          $\operatorname{Im}(z)=y$ es real, así que
          $\operatorname{Re}(z)+\operatorname{Im}(z)=x+y$ es real para
          cualquier $z$ y nunca vale $i$: la ecuación no tiene solución. El
          cálculo lo esconde al escribir $\operatorname{Im}(z)=iy$, y su
          $z=i$ da $0+1=1$.

