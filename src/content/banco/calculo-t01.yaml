      - texto: La figura A
        correcta: true
        porque: |-
          Las distancias a $z_1$ y a $z_2$ suman una constante, $2d$, mayor
          que la distancia entre ellos, $d$: es la definición de la elipse de
          focos $z_1$ y $z_2$, con semieje mayor $d$.
      - texto: La figura B
        porque: |-
          Los puntos del segmento suman exactamente $d$, la distancia entre
          $z_1$ y $z_2$, y aquí hace falta $2d$. El segmento es el lugar de la
          suma igual a $d$.
      - texto: La figura C
        porque: |-
          De la recta solo suman $2d$ dos puntos, los extremos del eje mayor
          de la elipse, a $d/2$ más allá de $z_1$ y de $z_2$. Los del segmento
          suman $d$, y los de más lejos, más de $2d$.
      - texto: El lugar geométrico es el vacío
        porque: |-
          Hay puntos que la cumplen: el de la recta a $d/2$ más allá de $z_2$
          está a $d/2$ de $z_2$ y a $3d/2$ de $z_1$, y suma $2d$.

