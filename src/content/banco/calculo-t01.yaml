    opciones:
      - texto: '$-1\le\operatorname{Re}(z)\le-2$'
        porque: |-
          Habla de la parte real, y la banda de la figura es horizontal: la
          acota la parte imaginaria. Además no la cumple ningún número, porque
          pide $x\ge -1$ y $x\le -2$ a la vez.
      - texto: '$-1<\operatorname{Re}(z)<-2$'
        porque: |-
          También fija la parte real, y además es imposible: ningún $x$ es a
          la vez mayor que $-1$ y menor que $-2$.
      - texto: '$-1\le\operatorname{Im}(z)\le 2$'
        porque: |-
          Acota bien la parte imaginaria, pero con los bordes dentro, y en la
          figura las rectas $y=-1$ e $y=2$ van en trazo discontinuo: quedan
          fuera.
      - texto: '$-1<\operatorname{Im}(z)<2$'
        correcta: true
        porque: |-
          La banda horizontal está entre $y=-1$ e $y=2$, y los bordes van en
          trazo discontinuo, que quiere decir que no son del lugar:
          desigualdades estrictas.

