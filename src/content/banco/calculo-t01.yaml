    opciones:
      - texto: '$|z-1-2i|\ge 3$'
        correcta: true
        porque: |-
          $|z-(1+2i)|$ es la distancia de $z$ a $1+2i$, el centro de la
          circunferencia. La zona sombreada es la de fuera, a distancia mayor
          que el radio, $3$, y la circunferencia va en trazo continuo, así que
          también entra: «mayor o igual».
      - texto: '$|z+1+2i|>3$'
        porque: |-
          $|z+1+2i|=|z-(-1-2i)|$ mide la distancia a $-1-2i$, y el centro de
          la figura es $1+2i$. Además es estricta, y la circunferencia de la
          figura va en trazo continuo.
      - texto: '$|z-1-2i|\le 3$'
        porque: |-
          Es el disco, los puntos a distancia $3$ o menos del centro. En la
          figura el disco queda sin sombrear: lo sombreado es lo de fuera.
