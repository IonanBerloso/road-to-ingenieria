      - texto: La representación A
        porque: |-
          Esa región es la de $\left|z+\overline{z}\right|\ge 6$. Un módulo no
          vale nunca un número negativo, así que no puede ser la solución de
          $\left|z+\overline{z}\right|=-6$.
      - texto: El lugar geométrico es el vacío
        correcta: true
        porque: |-
          Un módulo es siempre mayor o igual que cero, y $-6$ es negativo:
          ningún $z$ cumple $\left|z+\overline{z}\right|=-6$.
      - texto: La representación C
        porque: |-
          Esas dos rectas son el lugar de $\left|z+\overline{z}\right|=6$, con
          el $6$ positivo. Con $-6$ no hay nada: un módulo no es nunca
          negativo.
      - texto: La representación D
        porque: |-
          Para los reales de ese segmento,
          $\left|z+\overline{z}\right|=|2x|$ va de $0$ a $6$, y nunca es $-6$.
          Ningún complejo, real o no, da un módulo negativo.

