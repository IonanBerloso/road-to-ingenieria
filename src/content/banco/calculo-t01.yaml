    opciones:
      - texto: '$\theta=\operatorname{arctg}\left(\frac{y}{x}\right)$'
        porque: |-
          Con $x<0$ e $y<0$ el cociente $y/x$ es positivo, y
          $\operatorname{arctg}(y/x)$ sale entre $0$ y $\pi/2$: primer
          cuadrante, la dirección opuesta a la de $z$. Es la trampa del
          tercer cuadrante: el cociente no distingue $(x,y)$ de $(-x,-y)$.
      - texto: '$\theta=2\pi+\operatorname{arctg}\left(\frac{y}{x}\right)$'
        porque: |-
          Una vuelta entera sumada a un ángulo del primer cuadrante lo deja en
          el primer cuadrante: $2\pi+\operatorname{arctg}(y/x)$ señala hacia
          $(-x,-y)$, no hacia $z$.
      - texto: '$\theta=\pi+\operatorname{arctg}\left(\frac{y}{x}\right)$'
        correcta: true
        porque: |-
          $y/x>0$ y $\operatorname{arctg}(y/x)$ está entre $0$ y $\pi/2$;
          sumarle $\pi$ lo lleva a $(\pi,3\pi/2)$, el tercer cuadrante: el
          $\theta$ del dibujo, medido desde el semieje real positivo en
          sentido antihorario.

