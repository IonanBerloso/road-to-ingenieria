          de la figura los lleva en trazo discontinuo: no son del lugar.
      - texto: '$-1<\operatorname{Re}(z)<3$'
        porque: |-
          Sin acotar la parte imaginaria es una banda vertical infinita, y la
          figura se corta arriba en $y=4$ y abajo en $y=-2$.
