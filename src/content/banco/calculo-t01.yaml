    opciones:
      - texto: El número A
        correcta: true
        porque: |-
          $z$ está en la circunferencia unidad, a unos $240^\circ$, y sus
          raíces cúbicas tienen módulo $\sqrt[3]{1}=1$ y argumentos
          $(240^\circ+360^\circ k)/3$: $80^\circ$, $200^\circ$ y $320^\circ$.
          A está a unos $320^\circ$, y
          $3\cdot 320^\circ=960^\circ=240^\circ+2\cdot 360^\circ$.
      - texto: El número B
        porque: |-
          Tiene módulo $1$, pero está a unos $190^\circ$: al elevarlo al cubo
          su argumento sería $570^\circ$, que son $210^\circ$ y no los
          $240^\circ$ de $z$. Las raíces cúbicas de $z$ están a $80^\circ$,
          $200^\circ$ y $320^\circ$.
      - texto: El número C
        porque: |-
          Está a unos $100^\circ$, y la raíz más cercana está a $80^\circ$, al
          otro lado del eje imaginario. Al cubo, el argumento de C sería
          $300^\circ$, no $240^\circ$.

