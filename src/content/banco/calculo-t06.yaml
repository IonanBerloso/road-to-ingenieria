    opciones:
      - texto: '$x^2-y^2=z$'
        porque: |-
          Es un paraboloide hiperbólico, una silla de montar. La figura es un
          cono doble: dos hojas que se juntan en punta en el origen.
      - texto: '$x^2+z^2=y$'
        porque: |-
          Es un paraboloide: una sola hoja, abierta hacia las $y$ positivas y
          con el vértice redondeado. La figura tiene dos hojas unidas en
          punta: un cono.
      - texto: '$z^2+y^2=x^2$'
        porque: |-
          Es un cono, pero con el eje en el eje $x$: sus secciones circulares
          son las de $x$ constante. El de la figura se abre a lo largo del eje
          $y$.
      - texto: '$x^2+z^2=y^2$'
        correcta: true
        porque: |-
          Es un cono de eje $y$: cada sección $y=k$ es la circunferencia
          $x^2+z^2=k^2$, de radio $|k|$, que crece al alejarse del origen
          hacia los dos lados. Es lo que se ve: dos hojas a lo largo del eje
          $y$, unidas en el origen.

