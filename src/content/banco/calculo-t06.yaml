    opciones:
      - texto: '$F_x(x,y)>0,\ F_y(x,y)>0$'
        porque: |-
          $F_y>0$ es verdad —la superficie sube al avanzar en el sentido del
          eje $y$—, pero $F_x$ no es positiva en todas partes: cada perfil con
          $y$ fijo sube hasta la cresta y luego baja.
      - texto: '$F_x(x,y)<0,\ F_y(x,y)>0$'
        porque: |-
          Tampoco es $F_x<0$ en todas partes: antes de la cresta, al avanzar
          en $x$, la superficie sube.
      - texto: '$F_y(x,y)$ cambia de signo, $F_x(x,y)>0$'
        porque: |-
          Es al revés: el perfil que pasa de subir a bajar es el de $y$ fijo,
          en la dirección $x$. En la dirección $y$ la superficie sube siempre.
      - texto: '$F_x(x,y)$ cambia de signo, $F_y(x,y)>0$'
        correcta: true
        porque: |-
          Con $y$ fijo, cada perfil es un arco: sube hasta la cresta y después
          baja, así que $F_x$ pasa de positiva a negativa. Con $x$ fijo, la
          superficie sube siempre al avanzar en $y$: $F_y>0$.
      - texto: Las anteriores afirmaciones son falsas
        porque: |-
          La D describe la superficie: un arco en la dirección $x$ y una
          subida continua en la dirección $y$.

  # El original no da las funciones. Los signos se han leído sobre la
  # diapositiva a 600 ppp comparando la altura de cada esquina de la
  # superficie con la de la esquina de su dominio; la figura se redibuja con
  # funciones de esos mismos signos y conserva la orientación de los ejes de
  # cada panel: en el (4) el eje x apunta a la izquierda.
  - id: cuatro-superficies-y-sus-parciales
    bloque: '6.9'
    diapositiva: 18
    pregunta: |
      Para las funciones $z=F(x,y)$ de la figura, ¿cuál de las afirmaciones es
      cierta?
    figura: |
      <svg viewBox="0 0 342 338" role="img" width="342" height="338"
           aria-labelledby="cq6-cuatro-t cq6-cuatro-d">
        <title id="cq6-cuatro-t">Cuatro superficies sobre su dominio</title>
        <desc id="cq6-cuatro-d">Cuatro superficies, cada una flotando sobre un cuadrado sombreado del plano xy y con sus propios ejes. La (1) está más alta en la esquina del origen y baja al avanzar en x y al avanzar en y; en la dirección x se arquea un poco hacia abajo y en la dirección y se hunde un poco. La (2) está más baja en la esquina del origen y sube en las dos direcciones; se arquea hacia abajo en la dirección x y se curva hacia arriba en la dirección y. La (3) baja al avanzar en x y sube al avanzar en y; se hunde en la dirección x y se abomba en la dirección y. En la (4) el eje x apunta hacia la izquierda y el eje y hacia delante: sube hacia donde apunta el eje x y baja hacia donde apunta el eje y; se arquea hacia abajo en la dirección x y se curva hacia arriba en la dirección y.</desc>
