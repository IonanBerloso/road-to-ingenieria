    opciones:
      - texto: '$\begin{cases}y^2+z^2=x+0{,}2\\ x^2+y^2=1,\ x=1{,}2\end{cases}$'
        porque: |-
          $y^2+z^2=x+0{,}2$ es un paraboloide de eje $x$, y el sólido de la
          figura tiene el eje en el eje $y$: el vértice sobre ese eje y la
          tapa en el plano $y=1{,}2$.
      - texto: '$\begin{cases}x^2+y^2=z-0{,}2\\ y^2+z^2=1,\ x=1{,}2\end{cases}$'
        porque: |-
          $x^2+y^2=z-0{,}2$ tiene el eje vertical, y el de la figura está
          tumbado a lo largo del eje $y$. Además junta un cilindro de eje $x$
          con el plano $x=1{,}2$, que no cierran ese paraboloide.
      - texto: '$\begin{cases}x^2+z^2=y-0{,}2\\ x^2+z^2=1,\ y=1{,}2\end{cases}$'
        correcta: true
        porque: |-
          $x^2+z^2=y-0{,}2$ es un paraboloide de eje $y$ con el vértice en
          $(0;\ 0{,}2;\ 0)$, y en $y=1{,}2$ su corte es $x^2+z^2=1$, la
          circunferencia de radio $1$ que cierra la tapa. Casa con la caja del
          dibujo, que va de $-1$ a $1$ en $x$ y en $z$.
      - texto: '$\begin{cases}x^2+z^2=y^2-0{,}2\\ x^2+z^2=1,\ y=1{,}2\end{cases}$'
        porque: |-
          $x^2+z^2=y^2-0{,}2$ es un hiperboloide de dos hojas, no un
          paraboloide. Y ni siquiera casa con la tapa: en $y=1{,}2$ da
          $x^2+z^2=1{,}24$, no $1$.

  - id: limite-segun-el-camino
    bloque: '6.8'
    diapositiva: 10
    pregunta: |
      Calcular:

      $$
      \lim_{(x,y)\to(1,2)}\frac{x+y-3}{y-x-1}
      $$
    opciones:
      - texto: '$0$'
        porque: |-
          En $(1,2)$ el numerador y el denominador valen $0$ los dos: es una
          indeterminación $\frac{0}{0}$, no un $0$. Por la recta $x=1$ el
          cociente es $\frac{y-2}{y-2}=1$ todo el rato.
      - texto: '$-1$'
        porque: |-
          Es lo que sale al acercarse por la recta $y=2$:
          $\frac{x-1}{1-x}=-1$. Pero por la recta $x=1$ sale $1$, y un límite
          que depende del camino no existe.
      - texto: El límite no existe
        correcta: true
        porque: |-
          Con $x=1+h$, $y=2+k$, el cociente es $\frac{h+k}{k-h}$: vale $1$ por
          la recta $x=1$ ($h=0$) y $-1$ por la recta $y=2$ ($k=0$). Dos
          caminos, dos valores: el límite no existe.

  - id: numerador-de-orden-mayor
    bloque: '6.8'
    diapositiva: 11
    pregunta: |
      Para calcular:

      $$
      \lim_{(x,y)\to(0,0)}\frac{x^{10}y^{10}}{x+y}
      $$

      ¿Es correcto en siguiente razonamiento?

      *“El numerador tiende hacia $0$ con orden mayor que el denominador, de
      modo que el límite es $0$”*
    opciones:
      - texto: El razonamiento es correcto
        porque: |-
          Comparar órdenes solo sirve si el denominador se anula únicamente en
          el punto, y $x+y$ se anula en toda la recta $y=-x$. Por la curva
          $y=-x+x^{21}$, pegada a esa recta, $x+y=x^{21}$ y el cociente se
          comporta como $\frac{x^{20}}{x^{21}}=\frac{1}{x}$: no tiende a $0$.
      - texto: El razonamiento no es correcto
        correcta: true
        porque: |-
          El denominador se anula en toda la recta $y=-x$, no solo en el
          origen, y cerca de ella el cociente se dispara. Por la curva
          $y=-x+x^{21}$, $x+y=x^{21}$ y el cociente se comporta como
          $\frac{x^{20}}{x^{21}}=\frac{1}{x}$: el límite no es $0$; no existe.

  # Decisión: por C₂ el límite solo existe por la izquierda. y₂ = 2x − 1 cambia de
  # signo en x = 0,5: con x < 0,5 manda la fórmula de abajo (0,65) y con
  # x > 0,5 la de arriba (0,95), así que lím F(x, y₂(x)) no existe. La figura
  # del original solo dibuja C₂ en y ≤ 0, y la A da el límite por ese lado:
  # se marca la A, que es la que la diapositiva pretende, y su porqué lo
  # avisa. La figura no se redibuja: la pregunta se contesta con las fórmulas.
  - id: limites-por-dos-curvas
    bloque: '6.8'
    diapositiva: 12
    pregunta: |
      Considerar la función:

      $$
      F(x,y)=\begin{cases}-0{,}2(x^2-y^2)+1 & \text{si } 0\le x\le 1,\ 0<y\le 1\\ -0{,}2(x^2+y^2)+0{,}7 & \text{si } 0\le x\le 1,\ -1\le y\le 0\end{cases}
      $$

      Calcular $\lim\limits_{x\to 0{,}5}F(x,y(x))$ para las curvas

      $$
      \begin{cases}C_1: y_1(x)=2(x-0{,}5)^2\\ C_2: y_2(x)=2x-1\end{cases}
      $$
    opciones:
      - texto: '$\begin{cases}\lim\limits_{x\to 0{,}5}F(x,y_1(x))=0{,}95\\ \lim\limits_{x\to 0{,}5}F(x,y_2(x))=0{,}65\end{cases}$'
        correcta: true
        porque: |-
          Por $C_1$, $y_1>0$ al acercarse y manda la fórmula de arriba:
          $-0{,}2\cdot 0{,}25+1=0{,}95$. Por $C_2$ con $x<0{,}5$, $y_2<0$ y
          manda la de abajo: $-0{,}2\cdot 0{,}25+0{,}7=0{,}65$. Ojo: con
          $x>0{,}5$ es $y_2>0$ y sale $0{,}95$, así que el $0{,}65$ es el
          límite por la izquierda.
      - texto: '$\begin{cases}\lim\limits_{x\to 0{,}5}F(x,y_1(x))=0{,}35\\ \lim\limits_{x\to 0{,}5}F(x,y_2(x))=0{,}65\end{cases}$'
        porque: |-
          El $0{,}65$ de $C_2$ es el de la fórmula de abajo, pero $0{,}35$ no
          sale de ninguna: por $C_1$, con $y_1>0$, manda la de arriba y da
          $-0{,}2\cdot 0{,}25+1=0{,}95$.
      - texto: '$\begin{cases}\lim\limits_{x\to 0{,}5}F(x,y_1(x))=0{,}75\\ \lim\limits_{x\to 0{,}5}F(x,y_2(x))=0{,}55\end{cases}$'
        porque: |-
          $0{,}75$ es la fórmula de abajo con el signo del $0{,}2$ cambiado,
          $0{,}2\cdot 0{,}25+0{,}7$, y $C_1$ ni siquiera usa esa fórmula,
          porque $y_1>0$. En $(0{,}5;\ 0)$ la de arriba da $0{,}95$ y la de
          abajo, $0{,}65$.

  - id: limite-por-una-curva
    bloque: '6.8'
    diapositiva: 13
    pregunta: |
      Consideremos las funciones $z=F(x,y)$, $y=y(x)$ tales que

      $$
      \lim_{x\to a}y(x)=b,\qquad \lim_{x\to a}F(x,y(x))=L
      $$

      ¿Cuál de las siguientes afirmaciones es cierta?
    opciones:
      - texto: '$\lim\limits_{(x,y)\to(a,b)}F(x,y)=L$'
        porque: |-
          Un camino no basta: el límite doble exige lo mismo por todos.
          $F=\frac{xy}{x^2+y^2}$ tiende a $0$ por $y=0$ y a $\frac{1}{2}$ por
          $y=x$, y en $(0,0)$ no tiene límite.
      - texto: 'Si existe $\lim\limits_{(x,y)\to(a,b)}F(x,y)$, entonces este límite es $L$'
        correcta: true
        porque: |-
          Si el límite doble existe, es el mismo por cualquier camino que
          llegue al punto, y $(x,y(x))$ es uno. El camino no demuestra que
          exista, pero si existe, dice cuánto vale: $L$.
      - texto: Las afirmaciones A y B son falsas
        porque: |-
          La B es cierta: cuando el límite doble existe coincide con el
          límite por cualquier camino, y el de la curva $y=y(x)$ vale $L$.

  - id: condicion-epsilon-delta
    bloque: '6.8'
    diapositiva: 14
    pregunta: |
      Supongamos que una función $z=F(x,y)$ definida en un punto $(a,b)$
      verifica la siguiente condición:

      $$
      \forall\varepsilon>0\ \exists\delta>0\ /\ \sqrt{(x-a)^2+(y-b)^2}<\delta\Rightarrow\left|F(x,y)-F(a,b)\right|<\varepsilon
      $$

      ¿Cuál es su significado?
    opciones:
      - texto: '$F(x,y)$ admite límite en $(a,b)$.'
        porque: |-
          Se queda corta. Admitir límite sería la condición con un número $L$
          cualquiera en lugar de $F(a,b)$; aquí el límite existe **y además
          vale** $F(a,b)$, que es justo la continuidad.
      - texto: '$F(x,y)$ es continua en $(a,b)$.'
        correcta: true
        porque: |-
          Es la definición de continuidad: $F(x,y)$ se acerca tanto como se
          quiera a $F(a,b)$ en cuanto $(x,y)$ está lo bastante cerca de
          $(a,b)$. Con límites,
          $\lim_{(x,y)\to(a,b)}F(x,y)=F(a,b)$.
      - texto: '$F(x,y)$ es acotada.'
        porque: |-
          La condición solo habla de lo que pasa cerca de $(a,b)$: de ella
          sale que $F$ está acotada en un entorno del punto, pero no en todo
          su dominio. $F=\frac{1}{x}$ es continua en $(1,0)$ y no está
          acotada.
      - texto: '$F(x,y)$ es no acotada.'
        porque: |-
          Tampoco: $F=\operatorname{sen}x$ cumple la condición en todos los
          puntos y está acotada. La condición no dice nada de cotas.

  - id: conclusiones-de-np-y-nm
    bloque: '6.9'
    varias: true
    diapositiva: 15
    pregunta: |
      Considerar la función $N(p,m)$ donde:

      $N$ =número de estudiantes que solicitan matricularse en la EIG

      $p$ =tasa de paro en la CAPV

      $m$ =coste de la matrícula

      Supongamos que se verifica: $N_p>0,\ N_m<0$

      ¿Qué conclusiones podemos extraer?
    opciones:
      - texto: Un aumento del paro hará aumentar las solicitudes de matricula.
        correcta: true
        porque: |-
          $N_p>0$ dice que, con el coste fijo, $N$ crece al crecer $p$: más
          paro, más solicitudes. Es una conclusión local y con la otra
          variable quieta, que es lo que dice una derivada parcial.
      - texto: Una disminución del coste de matrícula hará aumentar las solicitudes de matricula.
        correcta: true
        porque: |-
          $N_m<0$: $N$ va al revés que $m$, así que al bajar el coste, con el
          paro fijo, las solicitudes suben.
      - texto: Una disminución del paro hará disminuir las solicitudes de matricula.
        correcta: true
        porque: |-
          Es la otra cara de $N_p>0$: si $N$ crece cuando $p$ crece, también
          decrece cuando $p$ decrece.
      - texto: Un aumento del coste de matrícula hará disminuir las solicitudes de matricula.
        correcta: true
        porque: |-
          $N_m<0$: al subir $m$ con el paro fijo, $N$ baja.

  # Se quita «como muestra la figura»: la foto de la pizza es decorativa y no
  # se redibuja; la fórmula del área basta para contestar.
  - id: el-trozo-de-pizza
    bloque: '6.9'
    diapositiva: 16
    pregunta: |
      Supongamos que cortas un trozo de pizza de radio $r$. Sabemos que el
      área $A$ del trozo es:

      $$
      A=\frac{r^2\theta}{2}
      $$

      Normalmente las pizzerías disponen de varios tamaños para sus pizzas. El
      área $A$ del trozo ¿crece a mayor velocidad aumentando $r$ o bien
      aumentando $\theta$?
    opciones:
      - texto: 'Aumentando $\theta$'
        porque: |-
          Las velocidades son $A_\theta=\frac{r^2}{2}$ y $A_r=r\theta$, y
          ninguna gana siempre: $A_\theta$ es mayor solo si
          $\theta<\frac{r}{2}$. Con $r=2$ y $\theta=3$ gana $r$: $A_r=6$
          frente a $A_\theta=2$.
      - texto: 'Aumentando $r$'
        porque: |-
          Aumentar $r$ gana solo si $A_r=r\theta$ supera a
          $A_\theta=\frac{r^2}{2}$, es decir, si $\theta>\frac{r}{2}$. Con
          $r=4$ y $\theta=1$ es al revés: $A_r=4$ y $A_\theta=8$.
      - texto: 'Depende de los valores de $r$ y $\theta$ que se tomen.'
        correcta: true
        porque: |-
          Las dos velocidades son las derivadas parciales, $A_r=r\theta$ y
          $A_\theta=\frac{r^2}{2}$, y cuál es mayor depende del punto:
          $A_r>A_\theta$ cuando $\theta>\frac{r}{2}$, y al revés cuando
          $\theta<\frac{r}{2}$.

