    opciones:
      - texto: 'Primero $F_{xx}(x,y)<0$ y luego $F_{xx}(x,y)>0$'
        correcta: true
        porque: |-
          $P$ sale del borde $x=-\pi$ y avanza hacia las $x$ crecientes, a la
          izquierda del dibujo. El perfil que recorre sube primero a una
          cresta, cóncavo ($F_{xx}<0$), y después baja a un valle y vuelve a
          subir, convexo ($F_{xx}>0$); el cambio está hacia $x=0$.
      - texto: 'Primero $F_{xx}(x,y)>0$ y luego $F_{xx}(x,y)<0$'
        porque: |-
          Es el orden de quien lo recorre al revés, desde $x=\pi$. El eje $x$
          apunta a la izquierda y $P$ empieza en el borde $x=-\pi$: pasa
          primero por la cresta ($F_{xx}<0$) y luego por el valle
          ($F_{xx}>0$).
      - texto: 'Primero $F_{yy}(x,y)<0$ y luego $F_{yy}(x,y)>0$'
        porque: |-
          $F_{yy}$ mide la curvatura en la dirección $y$, y $P$ avanza con $y$
          fijo: cruza cortes $x=\text{cte}$ que se curvan todos igual en la
          dirección $y$, hacia abajo. No cambia de signo.
      - texto: '$F_{yy}(x,y)>0$ siempre'
        porque: |-
          En la dirección $y$, de atrás hacia delante, la superficie baja cada
          vez más deprisa: es cóncava, y $F_{yy}<0$.
