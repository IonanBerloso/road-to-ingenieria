      - texto: '$F_v(P)<0$'
        porque: |-
          $v$ apunta hacia la derecha, y en $P$ las curvas suben hacia la
          derecha: se pasa a curvas de valor mayor. $F_v(P)>0$.
      - texto: '$F_{-u}(R)>0$'
        porque: |-
          $u$ apunta hacia abajo, así que $-u$ apunta hacia arriba, y los
          valores crecen hacia abajo: subiendo, $F$ disminuye. $F_{-u}(R)<0$.
      - texto: '$F_{-w}(M)>0$'
        porque: |-
          $w$ va hacia abajo, casi perpendicular a las curvas y hacia valores
          mayores; $-w$ va al revés, hacia valores menores: $F_{-w}(M)<0$.
      - texto: '$F_{-s}(N)>0$'
        correcta: true
        porque: |-
          $s$ sale de $N$ hacia arriba, casi perpendicular a las curvas y
          hacia valores menores: $F_s(N)<0$. La dirección opuesta, $-s$, va
          hacia valores mayores, y $F_{-s}(N)>0$.

  # El original no da la función de este mapa: se redibuja con una propia que
  # conserva su aspecto —familias de curvas en U arriba y en arco abajo— y el
  # papel de cada punto; los módulos del gradiente en los seis se calculan en
  # el guion de figuras, que se para si E no es el mayor.
  - id: donde-el-gradiente-es-mayor
    bloque: '6.13'
    diapositiva: 31
    pregunta: |
      Considerar el siguiente gráfico de curvas de nivel una función $F(x,y)$.
      ¿En cuál de los puntos indicados el módulo del gradiente es mayor?
