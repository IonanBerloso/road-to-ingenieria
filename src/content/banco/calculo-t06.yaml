asignatura: calculo
tema: t06-varias-variables
titulo: Las cuestiones de las diapositivas del tema 6
fuente: >-
  Las diapositivas de clase del tema 6 de Cálculo, «Funciones reales de varias
  variables reales» (UPV/EHU): treinta y nueve preguntas tipo test para las
  cuestiones en grupo y para el oral de la final y de la extraordinaria. Las
  diapositivas no traen la solución: la respuesta y el porqué de cada opción
  son de este sitio, y las figuras están redibujadas.
