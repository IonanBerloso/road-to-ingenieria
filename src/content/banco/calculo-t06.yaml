    opciones:
      - texto: La superficie A
        porque: |-
          Sus generatrices, las rectas de la superficie, son paralelas al eje
          $y$, y su perfil está en el plano $xz$: es $xz=1$. En $yz=1$ falta
          la $x$, así que las rectas tienen que ser paralelas al eje $x$.
      - texto: La superficie B
        correcta: true
        porque: |-
          En $yz=1$ no aparece la $x$: es un cilindro de generatrices
          paralelas al eje $x$, y su corte con cualquier plano $x=\text{cte}$
          es la hipérbola $z=\frac{1}{y}$. Es la B: rectas paralelas al eje
          $x$ y un perfil alto junto al eje $z$ que baja al crecer $y$.
      - texto: La superficie C
        porque: |-
          Sus generatrices son verticales, paralelas al eje $z$: su ecuación
          no lleva $z$, como $xy=1$. En $yz=1$ la variable que falta es la
          $x$.
      - texto: La superficie D
        porque: |-
          También tiene las generatrices verticales, paralelas al eje $z$: su
          ecuación no lleva $z$. Las de $yz=1$ son paralelas al eje $x$.

