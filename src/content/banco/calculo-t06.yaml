    opciones:
      - texto: '$\begin{array}{l}(1)\ F_x(x,y)<0,\ F_y(x,y)<0\\ (2)\ F_x(x,y)>0,\ F_y(x,y)<0\end{array}$'
        porque: |-
          La (1) está bien: baja al avanzar en $x$ y al avanzar en $y$. Pero
          la (2) sube en las dos direcciones, así que su $F_y$ es positiva.
      - texto: '$\begin{array}{l}(3)\ F_x(x,y)<0,\ F_y(x,y)<0\\ (4)\ F_x(x,y)>0,\ F_y(x,y)<0\end{array}$'
        porque: |-
          La (4) está bien, pero la (3) sube al avanzar en el sentido del eje
          $y$: su $F_y$ es positiva, no negativa.
      - texto: '$\begin{array}{l}(1)\ F_x(x,y)<0,\ F_y(x,y)<0\\ (3)\ F_x(x,y)>0,\ F_y(x,y)>0\end{array}$'
        porque: |-
          La (1) está bien, pero la (3) baja al avanzar en el sentido del eje
          $x$: su $F_x$ es negativa.
      - texto: '$\begin{array}{l}(2)\ F_x(x,y)>0,\ F_y(x,y)>0\\ (4)\ F_x(x,y)>0,\ F_y(x,y)<0\end{array}$'
        correcta: true
        porque: |-
          La (2) sube al avanzar en $x$ y en $y$. En la (4) hay que mirar las
          flechas: su eje $x$ apunta a la izquierda, y hacia ese lado la
          superficie sube, así que $F_x>0$; hacia donde apunta el eje $y$,
          baja: $F_y<0$.

