    opciones:
      - texto: El gráfico A
        correcta: true
        porque: |-
          En el mapa hay un punto abajo a la izquierda al que llegan las
          flechas de alrededor, un máximo, y otro abajo a la derecha del que
          salen, un mínimo. A tiene justo ahí sus dos familias de curvas
          cerradas, y las flechas cruzan sus curvas en perpendicular.
      - texto: El gráfico B
        porque: |-
          B tiene una familia de curvas cerradas alrededor del origen, así que
          allí habría un máximo o un mínimo, con las flechas llegando o
          saliendo de todos lados. En el mapa no: por encima del origen las
          flechas van hacia la derecha y por debajo, hacia la izquierda.
      - texto: El gráfico C
        porque: |-
          C no tiene ninguna curva cerrada: sus curvas se abren hacia los
          lados, así que no tiene máximos ni mínimos locales. El mapa sí
          tiene uno a cada lado, abajo.

  - id: el-gradiente-mal-dibujado
    bloque: '6.13'
    diapositiva: 33
    pregunta: |
      Considerar el siguiente gráfico de curvas de nivel de $z=F(x,y)$. En uno
      de los puntos está dibujado erróneamente el vector gradiente, ¿en cuál?
    figura: |
      <svg viewBox="0 0 340 318" role="img" width="340" height="318"
           aria-labelledby="cq6-gradientes-t cq6-gradientes-d">
        <title id="cq6-gradientes-t">El mapa ondulado con un vector gradiente dibujado en cada punto</title>
        <desc id="cq6-gradientes-d">Un mapa de curvas de nivel ondulado: cada curva cruza el dibujo de izquierda a derecha haciendo un valle hacia x = −0,7 y una cresta hacia x = 0,3. Los valores crecen hacia abajo: las etiquetas dicen 1,2, 1,44 y 1,92 a la izquierda, de arriba abajo, y 2,28, 2,52 y 2,76 en el centro, más abajo. P está arriba a la izquierda y M abajo a la izquierda, donde las curvas suben hacia la derecha; R está arriba a la derecha, justo pasada la cresta, y N abajo a la derecha, donde las curvas bajan hacia la derecha. En cada punto hay dibujada una flecha que pretende ser el gradiente. En P apunta hacia abajo a la derecha, en R hacia abajo a la izquierda y en M hacia abajo, las tres perpendiculares a las curvas y hacia valores mayores. En N es perpendicular a las curvas pero apunta hacia arriba a la derecha, hacia valores menores.</desc>
        <style>
            .cq6-gradientes-eje { stroke: var(--rule); stroke-width: 1.1; fill: none; }
            .cq6-gradientes-c { stroke: var(--d1); stroke-width: 2.8; fill: none; }
            .cq6-gradientes-c2 { stroke: var(--alt); stroke-width: 2.8; fill: none; }
            .cq6-gradientes-cp { stroke: var(--d1); stroke-width: 2.4; fill: none; stroke-dasharray: 6 4; }
            .cq6-gradientes-cp2 { stroke: var(--alt); stroke-width: 2.4; fill: none; stroke-dasharray: 6 4; }
            .cq6-gradientes-g { stroke: var(--faint); stroke-width: 1.1; fill: none; stroke-dasharray: 3 3; }
            .cq6-gradientes-fue { stroke: var(--faint); stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
            .cq6-gradientes-f { fill: var(--live); fill-opacity: .12; stroke: none; }
            .cq6-gradientes-f2 { fill: var(--alt); fill-opacity: .12; stroke: none; }
            .cq6-gradientes-pt { fill: var(--live); }
            .cq6-gradientes-punta { fill: var(--alt); stroke: none; }
            .cq6-gradientes-hueco { fill: var(--paper); stroke: var(--live); stroke-width: 2; }
            .cq6-gradientes-o { fill: var(--flag); }
            .cq6-gradientes-n { fill: var(--faint); font-size: 10px; font-family: var(--mono); paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
            .cq6-gradientes-l { font-size: 10.5px; font-family: var(--mono); font-weight: 700; paint-order: stroke; stroke: var(--paper); stroke-width: 3.4px; stroke-linejoin: round; }
            .cq6-gradientes-niv { stroke: var(--d1); stroke-width: 1.3; fill: none; stroke-linejoin: round; }
