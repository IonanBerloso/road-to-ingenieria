    opciones:
      - texto: '$F_x(x,y)<0,\ F_y(x,y)<0$'
        correcta: true
        porque: |-
          El dominio está en $x\le 0$, $y\le 0$, detrás de los ejes. Al
          avanzar en el sentido del eje $x$, hacia la izquierda del dibujo, la
          superficie baja, y al avanzar en el del eje $y$, hacia delante,
          también: las dos parciales son negativas.
      - texto: '$F_x(x,y)>0,\ F_y(x,y)<0$'
        porque: |-
          La superficie sube hacia la derecha del dibujo, pero el eje $x$
          apunta a la izquierda: en el sentido de las $x$ crecientes baja, y
          $F_x<0$.
      - texto: '$F_x(x,y)<0,\ F_y(x,y)>0$'
        porque: |-
          $F_x<0$ está bien, pero el eje $y$ apunta hacia delante, y en ese
          sentido la superficie baja: $F_y<0$.
      - texto: '$F_x(x,y)>0,\ F_y(x,y)>0$'
        porque: |-
          Es lo que parece si se lee el dibujo sin mirar hacia dónde apuntan
          los ejes: la superficie sube hacia la derecha y hacia el fondo, que
          son los sentidos de las $x$ y de las $y$ negativas.

