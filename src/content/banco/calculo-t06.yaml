    opciones:
      - texto: '$F_{xx}(x,y)>0$'
        porque: |-
          Con $y$ fijo, el perfil es un arco que sube y baja: cóncavo, así que
          $F_{xx}<0$, no positiva.
      - texto: '$F_{yy}(x,y)<0$'
        porque: |-
          Con $x$ fijo, la superficie sube en línea recta al avanzar en $y$:
          las líneas de la malla en esa dirección son rectas, y $F_{yy}=0$. No
          es negativa.
      - texto: 'Para cada valor de $x$,, $F(x,y)$ tiene velocidad decreciente.'
        porque: |-
          Fijado $x$, la velocidad es $F_y$, y es constante: la superficie
          sube en línea recta en la dirección $y$. Ni crece ni decrece.
      - texto: 'Para cada valor de $y$, $F(x,y)$ tiene velocidad creciente.'
        porque: |-
          Fijado $y$, la velocidad es $F_x$: positiva antes de la cresta, cero
          en ella y negativa después. Decrece, no crece: el perfil es cóncavo.
      - texto: Ninguna de las afirmaciones anteriores es cierta.
        correcta: true
        porque: |-
          En la dirección $x$ el perfil es un arco cóncavo: $F_{xx}<0$ y la
          velocidad $F_x$ decrece. En la dirección $y$ la superficie sube en
          línea recta: $F_{yy}=0$ y la velocidad $F_y$ es constante. Ninguna
          de las cuatro se cumple.

  # Las curvaturas se han medido sobre la diapositiva a 600 ppp: cuánto se
  # separa cada borde de la superficie de la cuerda que une sus extremos. En
  # la (1) la curvatura es pequeña pero del mismo signo en los dos bordes de
  # cada dirección; la figura la redibuja algo más marcada para que se lea.
  - id: cuatro-superficies-y-sus-derivadas-segundas
    bloque: '6.14'
    diapositiva: 38
    pregunta: |
      Para las funciones $z=F(x,y)$ de la figura, ¿cuál de las afirmaciones es
      cierta?
    figura: |
      <svg viewBox="0 0 342 338" role="img" width="342" height="338"
           aria-labelledby="cq6-cuatro2-t cq6-cuatro2-d">
        <title id="cq6-cuatro2-t">Cuatro superficies sobre su dominio</title>
        <desc id="cq6-cuatro2-d">Cuatro superficies, cada una flotando sobre un cuadrado sombreado del plano xy y con sus propios ejes. La (1) está más alta en la esquina del origen y baja al avanzar en x y al avanzar en y; en la dirección x se arquea un poco hacia abajo y en la dirección y se hunde un poco. La (2) está más baja en la esquina del origen y sube en las dos direcciones; se arquea hacia abajo en la dirección x y se curva hacia arriba en la dirección y. La (3) baja al avanzar en x y sube al avanzar en y; se hunde en la dirección x y se abomba en la dirección y. En la (4) el eje x apunta hacia la izquierda y el eje y hacia delante: sube hacia donde apunta el eje x y baja hacia donde apunta el eje y; se arquea hacia abajo en la dirección x y se curva hacia arriba en la dirección y.</desc>
