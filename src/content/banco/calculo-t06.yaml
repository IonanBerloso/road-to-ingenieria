    opciones:
      - texto: '$c>0,\ m>0,\ n>0$'
        porque: |-
          $c$ y $m$ están bien, pero $n=F_y(a,b)$ es negativa: subiendo desde
          $P$ se va hacia el centro, donde los valores son menores.
      - texto: '$c<0,\ m>0,\ n<0$'
        porque: |-
          $m$ y $n$ están bien, pero $c=F(a,b)$ es el valor de la curva que
          pasa por $P$, la del $4$: positivo.
      - texto: '$c>0,\ m<0,\ n>0$'
        porque: |-
          Tiene $m$ y $n$ al revés. Los valores crecen hacia fuera, y $P$ está
          abajo a la derecha: hacia la derecha se sale, $m>0$; hacia arriba se
          entra, $n<0$.
      - texto: '$c<0,\ m<0,\ n<0$'
        porque: |-
          Solo acierta $n$: $c=F(a,b)=4$ es positivo, y desde $P$, hacia la
          derecha, se sale hacia valores mayores, así que $m>0$.
      - texto: '$c>0,\ m>0,\ n<0$'
        correcta: true
        porque: |-
          $c=F(a,b)$ es el valor de la curva que pasa por $P$, $4$. $m$ y $n$
          son $F_x(a,b)$ y $F_y(a,b)$: los valores crecen del centro hacia
          fuera y $P$ está abajo a la derecha, así que a la derecha $F$ crece
          ($m>0$) y hacia arriba decrece ($n<0$).

  - id: regla-de-la-cadena-en-t-igual-a-3
    bloque: '6.11'
    diapositiva: 23
    pregunta: |
      El gráfico de la izquierda muestra las curvas de nivel de cierta función
      $F(x,y)$. Los dos otros gráficos corresponden a funciones de cambio de
      variable $x(t)$, $y(t)$. ¿Cuál es el signo de $\frac{dF}{dt}$ en $t=3$?
    figura: |
      <svg viewBox="0 0 516 166" role="img" width="516" height="166"
           aria-labelledby="cq6-cadena-t cq6-cadena-d">
        <title id="cq6-cadena-t">Las curvas de nivel de F y las gráficas de x(t) e y(t)</title>
        <desc id="cq6-cadena-d">Tres gráficas. La primera, las curvas de nivel de F: circunferencias con centro en el origen, de radios 0,5, 1, 1,5 y así hasta 4, rotuladas 0, 1, 2… hasta 7 de dentro hacia fuera. La segunda, x(t) entre t = 0 y t = 4: empieza en −1, baja un poco, sube hasta casi 3 hacia t = 2,4 y baja deprisa: en t = 3 vale algo menos de 2 y está bajando. La tercera, y(t): empieza en −0,5, sube hasta 1,4 hacia t = 1,9 y baja despacio: en t = 3 vale 1 y está bajando.</desc>
