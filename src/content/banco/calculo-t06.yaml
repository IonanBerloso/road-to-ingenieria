    opciones:
      - texto: El punto A
        porque: |-
          A está dentro de una familia de curvas en U, donde van bastante
          juntas, pero bastante menos que en E: el mismo salto de valor
          ocupa más distancia.
      - texto: El punto B
        porque: |-
          B está junto al eje $x$, donde las curvas se separan: el gradiente
          es pequeño.
      - texto: El punto C
        porque: |-
          C está en el fondo de una U, donde las curvas están más separadas
          que en casi cualquier otro sitio del mapa: su gradiente es de los
          más pequeños.
      - texto: El punto D
        porque: |-
          D está en lo alto de una familia de arcos, lejos de donde se
          aprietan: las curvas pasan separadas.
      - texto: El punto E
        correcta: true
        porque: |-
          En E las curvas de nivel están más juntas que en ningún otro punto
          marcado: la función cambia de una curva a la siguiente en menos
          distancia, y eso es un gradiente de módulo mayor.
      - texto: El punto F
        porque: |-
          En F las curvas van juntas, pero bastante menos que en E, donde se
          aprietan dos familias a la vez y la distancia entre curvas es la
          menor del mapa.

  # El original tampoco da estas funciones: el mapa y el gráfico A se rehacen
  # con una misma función propia, y el B y el C con otras dos, conservando el
  # aspecto de cada gráfico y lo que decide la respuesta: un máximo abajo a
  # la izquierda y un mínimo abajo a la derecha en el mapa y en A.
  - id: mapa-de-gradientes
    bloque: '6.13'
    diapositiva: 32
    pregunta: |
      Considerar el mapa de gradientes de cierta función $F(x,y)$. ¿A cuál de
      los tres gráficos de curvas de nivel corresponde dicho mapa?
    figura: |
      <svg viewBox="0 0 342 374" role="img" width="342" height="374"
           aria-labelledby="cq6-campo-t cq6-campo-d">
        <title id="cq6-campo-t">Un mapa de gradientes y tres mapas de curvas de nivel</title>
        <desc id="cq6-campo-d">Cuatro cuadros. El primero es un mapa de gradientes: flechas del mismo largo en una rejilla. Abajo a la izquierda hay un punto al que llegan las flechas de todo alrededor, y abajo a la derecha otro del que salen hacia todos lados. Arriba a la izquierda las flechas apuntan hacia la izquierda y algo hacia arriba; a lo largo del eje y apuntan a la derecha por encima del origen y a la izquierda por debajo. En A, curvas de nivel con dos familias de curvas cerradas abajo, una a cada lado, y curvas que rodean las esquinas de arriba. En B, varias familias de curvas cerradas, una de ellas alrededor del origen. En C, curvas que se abren hacia la izquierda y hacia la derecha, entre rectas horizontales, sin ninguna cerrada.</desc>
        <style>
            .cq6-campo-eje { stroke: var(--rule); stroke-width: 1.1; fill: none; }
