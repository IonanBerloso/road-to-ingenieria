        porque: |-
          (a) es una silla de montar, sin máximos ni mínimos, y (1) está hecha
          de cuatro familias de curvas cerradas, cada una alrededor de un pico
          o de un hoyo. Una silla no tiene curvas de nivel cerradas.
      - texto: '(a)-(3),(b)-(1),(c)-(2)'
        porque: |-
          Acierta la silla, pero (b) es de revolución, con ondas que salen del
          centro: sus curvas de nivel son las circunferencias concéntricas de
          (2), no las cuatro familias de (1).
      - texto: '(a)-(3),(b)-(2),(c)-(1)'
        correcta: true
        porque: |-
          (a) es una silla de montar: sube en una dirección y baja en la otra,
          y sus curvas de nivel son las hipérbolas de (3). (b) es de
          revolución: circunferencias concéntricas, (2). Y (c) tiene dos picos
          y dos hoyos repartidos por los cuadrantes, cada uno rodeado de sus
          curvas cerradas: (1).
      - texto: '(a)-(2),(b)-(1),(c)-(3)'
        porque: |-
          (a) no tiene curvas de nivel cerradas: es una silla de montar, y
          sus curvas son hipérbolas. Las circunferencias de (2) son las de la
          superficie de revolución, (b).

