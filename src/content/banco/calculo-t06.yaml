    opciones:
      - texto: 'En $P$.'
        porque: |-
          En $P$ la flecha es perpendicular a las curvas y apunta hacia abajo
          a la derecha, hacia valores mayores: es un gradiente.
      - texto: 'En $M$.'
        porque: |-
          En $M$ también: perpendicular a las curvas y hacia valores mayores,
          que en este mapa están abajo.
      - texto: 'En $R$.'
        porque: |-
          En $R$ las curvas bajan hacia la derecha, y la flecha va hacia abajo
          a la izquierda, perpendicular a ellas y hacia valores mayores. Está
          bien.
      - texto: 'En $N$.'
        correcta: true
        porque: |-
          En $N$ la flecha es perpendicular a las curvas, pero apunta hacia
          arriba, hacia valores menores: es $-\nabla F$. El gradiente apunta
          siempre hacia donde la función crece, y aquí crece hacia abajo.

  - id: gradiente-de-la-temperatura
    bloque: '6.13'
    diapositiva: 34
    pregunta: |
      Supongamos que la temperatura en un punto $(x,y,z)$ de una habitación
      está dada por una función $T(x,y,z)$. Supongamos que la habitación está
      siendo caldeada por un radiador que se encuentra en el origen de
      coordenadas. Considerar un punto $(a,b,c)$ de la habitación, siendo $a$,
      $b$ y $c$ positivos.

      ¿Cuál de los siguientes vectores podría ser $\nabla T(a,b,c)$?
    opciones:
      - texto: '$(2,2,-4)$'
        porque: |-
          Con componentes positivas en $x$ y en $y$ se aleja del radiador en
          esas dos direcciones, y el calor viene del origen.
      - texto: '$(-3,-3,-5)$'
        correcta: true
        porque: |-
          El gradiente apunta hacia donde la temperatura sube más deprisa, que
          es hacia el radiador. Desde $(a,b,c)$, con las tres coordenadas
          positivas, ir hacia el origen es disminuir las tres: las tres
          componentes tienen que ser negativas, y solo lo son en
          $(-3,-3,-5)$.
      - texto: '$(-2,2,5)$'
        porque: |-
          Tiene dos componentes positivas: en $y$ y en $z$ se aleja del
          radiador, y el calor viene del origen.
      - texto: '$(3,3,5)$'
        porque: |-
          Apunta justo hacia fuera, lejos del radiador: es la dirección en la
          que la temperatura baja, la de $-\nabla T$.

  - id: gradiente-de-x2-mas-y2-mas-z2
    bloque: '6.13'
    diapositiva: 35
    pregunta: |
      Sea $F(x,y,z)=x^2+y^2+z^2$. Entonces, el vector $\nabla F(a,b,c)$ es…
    opciones:
      - texto: 'Perpendicular a un cilindro vertical que pasa por el punto $(a,b,c)$.'
        porque: |-
          El cilindro vertical por el punto, $x^2+y^2=a^2+b^2$, tiene por
          normal $(2a,2b,0)$, horizontal, y $\nabla F=(2a,2b,2c)$ solo lo es
          si $c=0$.
      - texto: 'Perpendicular a un plano horizontal que pasa por el punto $(a,b,c)$.'
        porque: |-
          La normal a un plano horizontal es vertical, y
          $\nabla F=(2a,2b,2c)$ solo es vertical si $a=b=0$.
      - texto: Ninguna de las anteriores es cierta.
        correcta: true
        porque: |-
          $\nabla F=(2a,2b,2c)$ es perpendicular a la superficie de nivel que
          pasa por el punto, la esfera $x^2+y^2+z^2=a^2+b^2+c^2$: apunta en
          la dirección del radio. Ni al cilindro ni al plano, salvo en puntos
          particulares.

  # «Ritmo» se lee como la velocidad con su signo, Np o Nm: así la C es falsa
  # y la D cierta. Leído como su valor absoluto, las dos dependerían del signo
  # de Np y de Nm, que el enunciado no da; la A y la B son ciertas se lea como
  # se lea.
  - id: conclusiones-de-npp-y-nmm
    bloque: '6.14'
    varias: true
    diapositiva: 36
    pregunta: |
      Sean:

      $N(p,m)$=número de estudiantes que solicitan matricularse en la EIG

      $p$ =tasa de paro en la CAPV

      $m$ =coste de la matrícula

      Supongamos que se verifica: $N_{pp}<0,\ N_{mm}>0$

      ¿Qué conclusiones podemos extraer?
    opciones:
      - texto: A medida que aumenta el paro, las solicitudes de matricula pueden aumentar o pueden disminuir.
        correcta: true
        porque: |-
          $N_{pp}<0$ dice cómo cambia la velocidad $N_p$ —cada vez es menor—,
          no su signo. Con $N_p$ positiva las solicitudes suben y con $N_p$
          negativa bajan: puede pasar cualquiera de las dos.
      - texto: A medida que disminuye el coste de la matrícula, las solicitudes de matricula pueden aumentar o pueden disminuir.
        correcta: true
        porque: |-
          Lo mismo con $m$: $N_{mm}>0$ dice que $N_m$ crece con $m$, no si es
          positiva o negativa, así que al bajar el coste las solicitudes
          pueden ir hacia cualquier lado.
      - texto: A medida que aumenta el paro, el número de solicitudes de matricula cambia a un ritmo cada vez mayor.
        porque: |-
          El ritmo al que cambian las solicitudes con el paro es $N_p$, y
          $N_{pp}<0$ dice que $N_p$ decrece al aumentar $p$: el ritmo es cada
          vez menor, no mayor.
      - texto: A medida que aumenta el coste de la matrícula, el número de solicitudes de matricula cambia a un ritmo cada vez mayor.
        correcta: true
        porque: |-
          El ritmo es $N_m$, y $N_{mm}>0$ dice que crece al aumentar $m$: cada
          vez mayor.

  # La superficie del original sube en línea recta en la dirección y: las
  # líneas de su malla en esa dirección son rectas y paralelas. Por eso Fyy = 0
  # y la velocidad Fy es constante, y la B y la C son falsas.
  # «x,,» con dos comas está así en la diapositiva.
