    opciones:
      - texto: '$(1)\ F_{xx}(x,y)<0,\ F_{yy}(x,y)<0$'
        porque: |-
          En la dirección $x$ la (1) se arquea un poco hacia abajo, $F_{xx}<0$,
          pero en la dirección $y$ se hunde por debajo de la cuerda: es
          convexa, y $F_{yy}>0$.
      - texto: '$(2)\ F_{xx}(x,y)>0,\ F_{yy}(x,y)>0$'
        porque: |-
          La (2) sí se curva hacia arriba en la dirección $y$, $F_{yy}>0$,
          pero en la dirección $x$ se arquea hacia abajo: sus perfiles con $y$
          fijo son arcos, y $F_{xx}<0$.
      - texto: '$(3)\ F_{xx}(x,y)>0,\ F_{yy}(x,y)<0$'
        correcta: true
        porque: |-
          La (3) se hunde en la dirección $x$ —sus perfiles con $y$ fijo
          quedan por debajo de la cuerda, $F_{xx}>0$— y se abomba en la
          dirección $y$, donde quedan por encima: $F_{yy}<0$.
      - texto: '$(4)\ F_{xx}(x,y)>0,\ F_{yy}(x,y)>0$'
        porque: |-
          La (4) se arquea hacia abajo en la dirección de su eje $x$, que en
          el dibujo apunta a la izquierda: $F_{xx}<0$.

  - id: el-punto-que-cruza-el-dominio
    bloque: '6.14'
    diapositiva: 39
    pregunta: |
      Para la función $z=F(x,y)$ de la figura, supongamos que el punto $P$
      cruza el dominio siguiendo la dirección del eje OX. ¿Cuál de las
      siguientes afirmaciones es cierta?
    figura: |
      <svg viewBox="0 0 340 260" role="img" width="340" height="260"
           aria-labelledby="cq6-onda-t cq6-onda-d">
        <title id="cq6-onda-t">Una superficie ondulada en la dirección x</title>
        <desc id="cq6-onda-d">Una superficie sobre el rectángulo de x entre menos pi y pi e y entre 0 y 2, dentro de una caja de aristas finas de altura 4. El eje x apunta hacia la izquierda y el eje y hacia delante. En la dirección x la superficie hace una onda: partiendo del borde derecho, x = −π, sube a una cresta, baja a un valle y vuelve a subir hasta el borde izquierdo, x = π. En la dirección y, de atrás hacia delante, baja cada vez más deprisa. El punto P está en el borde derecho del dominio, en x = −π e y = 1.</desc>
