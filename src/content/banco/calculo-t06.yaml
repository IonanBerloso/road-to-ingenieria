    opciones:
      - texto: '$\left.\frac{dF}{dt}\right|_{t=3}>0$'
        porque: |-
          Sería positiva si el punto se alejara del origen, porque $F$ crece
          hacia fuera. En $t=3$, $x$ e $y$ son positivas y las dos están
          bajando: el punto se acerca al origen.
      - texto: '$\left.\frac{dF}{dt}\right|_{t=3}<0$'
        correcta: true
        porque: |-
          $\frac{dF}{dt}=F_x\,x'(t)+F_y\,y'(t)$. $F$ crece hacia fuera y en
          $t=3$ el punto está en el primer cuadrante, así que $F_x>0$ y
          $F_y>0$; y las dos gráficas bajan en $t=3$: $x'<0$ e $y'<0$. Los
          dos sumandos son negativos.
      - texto: '$\left.\frac{dF}{dt}\right|_{t=3}=0$'
        porque: |-
          Sería cero si el punto se moviera por una curva de nivel, sin
          acercarse ni alejarse del origen. En $t=3$ las dos coordenadas bajan
          a la vez y la distancia al origen disminuye.

  - id: z-theta-del-paraboloide
    bloque: '6.11'
    diapositiva: 24
    pregunta: |
      Considerar el paraboloide $z=x^2+y^2$. Apliquemos el cambio de variables
      a coordenadas polares:

      $$
      \begin{cases}x=\rho\cos\theta\\ y=\rho\operatorname{sen}\theta\end{cases}
      $$

      ¿Cuál es el signo de $z_\theta$?
    opciones:
      - texto: '$z_\theta>0$ siempre'
        porque: |-
          En polares $z=\rho^2$, que no depende del ángulo: girar a radio fijo
          no sube ni baja. $z_\theta$ es cero, no positiva.
      - texto: '$z_\theta<0$ siempre'
        porque: |-
          Por la regla de la cadena,
          $z_\theta=2x(-\rho\operatorname{sen}\theta)+2y(\rho\cos\theta)=0$:
          los dos términos se cancelan siempre.
      - texto: '$z_\theta=0$ siempre'
        correcta: true
        porque: |-
          $z=\rho^2\cos^2\theta+\rho^2\operatorname{sen}^2\theta=\rho^2$ no
          depende de $\theta$, así que $z_\theta=0$. Girar alrededor del eje
          sin cambiar de radio es moverse por una curva de nivel del
          paraboloide.
      - texto: 'El signo de $z_\theta$ depende de $\theta$ y $\rho$'
        porque: |-
          Dependería si la superficie no fuera de revolución. $z=\rho^2$ no
          lleva $\theta$, y $z_\theta=0$ para cualquier $\theta$ y cualquier
          $\rho$.

  - id: derivada-direccional-de-x2-menos-y2
    bloque: '6.12'
    diapositiva: 25
    pregunta: |
      Calcular la derivada direccional de la función $z=x^2-y^2$ en el punto
      $(-3,-2)$ siguiendo la dirección $v=(1,-1)$.
    opciones:
      - texto: '$F_{(1,-1)}(-3,-2)=-10$'
        porque: |-
          Es $\nabla z\cdot v$ sin normalizar $v$. La derivada direccional usa
          el vector unitario, y $|(1,-1)|=\sqrt{2}$: falta dividir entre
          $\sqrt{2}$.
      - texto: '$F_{(1,-1)}(-3,-2)=-\frac{10}{\sqrt{2}}$'
        correcta: true
        porque: |-
          $\nabla z=(2x,-2y)$ vale $(-6,4)$ en $(-3,-2)$, y el unitario de $v$
          es $\frac{(1,-1)}{\sqrt{2}}$:
          $\frac{-6\cdot 1+4\cdot(-1)}{\sqrt{2}}=-\frac{10}{\sqrt{2}}$.
      - texto: '$F_{(1,-1)}(-3,-2)=3$'
        porque: |-
          Con $\nabla z(-3,-2)=(-6,4)$, el producto por $(1,-1)$ es $-10$,
          negativo, y dividido entre $\sqrt{2}$ da $-\frac{10}{\sqrt{2}}$: un
          $3$ positivo no sale por ningún camino.
      - texto: '$F_{(1,-1)}(-3,-2)=-\frac{3}{\sqrt{3}}$'
        porque: |-
          El $\sqrt{3}$ no es el módulo de $v$, que es $\sqrt{2}$, y el $-3$
          tampoco sale del gradiente: $\nabla z\cdot v=-6-4=-10$.

  - id: direccion-de-altura-constante
    bloque: '6.12'
    diapositiva: 26
    pregunta: |
      Supongamos que nos encontramos en el punto $P(0{,}6;\ 0{,}8)$ en una región
      en la que la altitud viene dada por la función

      $$
      F(x,y)=\operatorname{sen}(\pi x+2\pi y)
      $$

      ¿En qué dirección $v$ debemos desplazarnos desde $P$ de modo que nos
      mantengamos con la misma elevación?
    opciones:
      - texto: 'La dirección $v$ debe ser paralela al eje OY.'
        porque: |-
          El eje OY es la dirección $(0,1)$, y su producto con el gradiente,
          paralelo a $(1,2)$, es $2\ne 0$: por ahí la altura cambia.
      - texto: 'La dirección $v$ debe ser perpendicular al vector $(-3,2)$.'
        porque: |-
          Perpendicular a $(-3,2)$ es la dirección $(2,3)$, y
          $(2,3)\cdot(1,2)=8\ne 0$: no es perpendicular al gradiente, así que
          la altura cambia.
      - texto: 'La dirección $v$ debe ser paralela al vector $(3,-1)$.'
        porque: |-
          $(3,-1)\cdot(1,2)=1\ne 0$: casi perpendicular al gradiente, pero no
          del todo. Por esa dirección la altura cambia, aunque despacio.
      - texto: 'La dirección $v$ debe ser perpendicular al vector $(1,2)$.'
        correcta: true
        porque: |-
          $\nabla F=\cos(\pi x+2\pi y)\,(\pi,2\pi)$, y en $P$ el coseno vale
          $\cos(2{,}2\pi)\ne 0$: el gradiente es paralelo a $(1,2)$. Para no
          cambiar de altura hay que moverse perpendicular al gradiente, es
          decir, a $(1,2)$.

  - id: estimar-la-derivada-direccional
    bloque: '6.12'
    diapositiva: 27
    pregunta: |
      De cierta función $z=F(x,y)$ conocemos la siguiente información:

      $$
      \begin{cases}F(8;\ 5)=33{,}1\\ F(8{,}01;\ 5)=33{,}3\\ F(8;\ 5{,}02)=33{,}0\end{cases}
      $$

      Estimar el valor de la velocidad con que cambia $z$ cuando nos
      desplazamos desde el punto $(8;\ 5)$ siguiendo la dirección $v=(3,4)$.
    opciones:
      - texto: '$1$'
        porque: |-
          Las parciales estimadas son $F_x\approx 20$ y $F_y\approx -5$, y con
          ellas la derivada en la dirección de $(3,4)$ es
          $\frac{20\cdot 3-5\cdot 4}{5}=8$: el $1$ no sale de ninguna cuenta.
      - texto: '$-5$'
        porque: |-
          $-5$ es la estimación de $F_y$ sola, la velocidad en la dirección
          del eje $y$. En la dirección $(3,4)$ cuentan las dos parciales:
          $20\cdot 0{,}6-5\cdot 0{,}8=8$.
      - texto: '$40$'
        porque: |-
          Es $\nabla F\cdot v=20\cdot 3-5\cdot 4=40$ sin normalizar: $v$ mide
          $5$, y dividido entre $5$ queda $8$.
      - texto: '$8$'
        correcta: true
        porque: |-
          $F_x\approx\frac{33{,}3-33{,}1}{0{,}01}=20$ y
          $F_y\approx\frac{33{,}0-33{,}1}{0{,}02}=-5$. El unitario de $(3,4)$
          es $(0{,}6;\ 0{,}8)$, y $20\cdot 0{,}6+(-5)\cdot 0{,}8=12-4=8$.

  - id: descenso-mas-rapido
    bloque: '6.12'
    diapositiva: 28
    pregunta: |
      Supongamos que la superficie de cierto monte se puede modelizar
      mediante:

      $$
      z=25-2x^2-4y^2
      $$

      Una excursionista se encuentra en el punto $(1,1,19)$ y en ese momento
      comienza una fuerte ventisca. Entonces ella decide descender lo más
      rápido posible. ¿Cuál es la dirección en la que debe comenzar el
      descenso?
    opciones:
      - texto: '$(-4x,-8y)$'
        porque: |-
          Es el gradiente, $\nabla z=(-4x,-8y)$, sin evaluar. El gradiente
          apunta hacia donde más se sube, y además una dirección es un vector
          concreto: en $(1,1)$ sería $(-4,-8)$.
      - texto: '$(4x,8y)$'
        porque: |-
          Es $-\nabla z$, que es la idea buena, pero sin evaluar: una
          dirección es un vector concreto, y en $(1,1)$ vale $(4,8)$.
      - texto: '$(-4,-8)$'
        porque: |-
          Es el gradiente en $(1,1)$, la dirección de máximo **ascenso**.
          Para bajar lo más rápido hay que ir al revés.
      - texto: '$(4,8)$'
        correcta: true
        porque: |-
          Se baja lo más rápido en la dirección contraria al gradiente.
          $\nabla z=(-4x,-8y)$ vale $(-4,-8)$ en $(1,1)$, y la opuesta es
          $(4,8)$.

  - id: mayor-o-menor-que-f-en-1-1
    bloque: '6.12'
    diapositiva: 29
    pregunta: |
      De cierta función $F(x,y)$ sabemos que $\nabla F(1,1)=(3,-5)$.

      Supongamos que hacemos un pequeño desplazamiento desde el punto $(1,1)$
      siguiendo la dirección $v(4,2)$. El valor de $F(x,y)$ en el nuevo
      punto, ¿será mayor o menor que $F(1,1)$?
    opciones:
      - texto: Mayor
        correcta: true
        porque: |-
          Lo decide el signo de la derivada direccional, que es el de
          $\nabla F\cdot v=3\cdot 4+(-5)\cdot 2=2>0$: en esa dirección $F$
          crece, así que un paso pequeño da un valor mayor.
      - texto: Menor
        porque: |-
          La componente $-5$ tira hacia abajo, pero va multiplicada por $2$ y
          la $3$ por $4$: $\nabla F\cdot v=12-10=2>0$. En esa dirección $F$
          crece.

