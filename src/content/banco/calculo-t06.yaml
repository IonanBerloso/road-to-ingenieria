    opciones:
      - texto: La gráfica A
        porque: |-
          Son rectas paralelas, y $F$ depende de $x$ e $y$ solo a través de
          $x^2+y^2$: vale lo mismo en todos los puntos de una circunferencia
          centrada en el origen. Sus curvas de nivel son circunferencias así,
          nunca rectas.
      - texto: La gráfica B
        correcta: true
        porque: |-
          La gráfica de $g$ corta la altura $u=3$ en $t=0$ y en $t=5$.
          Entonces $F=3$ pide $x^2+y^2-4=0$ o $x^2+y^2-4=5$: las
          circunferencias de centro el origen y radios $2$ y $3$.
      - texto: La gráfica C
        porque: |-
          Toda curva de nivel de $F$ está hecha de circunferencias centradas
          en el origen, porque $F$ solo depende de $x^2+y^2$; en particular,
          es simétrica respecto del eje $x$. La parábola $y=x^2$ no lo es.

  - id: superficies-y-curvas-de-nivel
    bloque: '6.1-6.2'
    diapositiva: 4
    pregunta: |
      Asociar cada superficie (a), (b), (c) con el gráfico de sus curvas de
      nivel (1), (2), (3).
    figura: |
      <svg viewBox="0 0 516 338" role="img" width="516" height="338"
           aria-labelledby="cq6-sup-niv-t cq6-sup-niv-d">
        <title id="cq6-sup-niv-t">Tres superficies y tres mapas de curvas de nivel</title>
        <desc id="cq6-sup-niv-d">Arriba, tres superficies en perspectiva. La (a) es una silla de montar: sube en dos esquinas opuestas y baja en las otras dos. La (b) es de revolución: un bulto en el centro rodeado de ondas circulares cada vez más bajas. La (c) tiene dos picos y dos hoyos repartidos por los cuatro cuadrantes. Abajo, tres mapas de curvas de nivel. En el (1), cuatro familias de curvas cerradas, una en cada cuadrante. En el (2), circunferencias concéntricas repartidas a distancias desiguales. En el (3), hipérbolas en las cuatro esquinas, que dejan libre una cruz a lo largo de los ejes.</desc>
        <style>
            .cq6-sup-niv-eje { stroke: var(--rule); stroke-width: 1.1; fill: none; }
            .cq6-sup-niv-c { stroke: var(--d1); stroke-width: 2.8; fill: none; }
            .cq6-sup-niv-c2 { stroke: var(--alt); stroke-width: 2.8; fill: none; }
            .cq6-sup-niv-cp { stroke: var(--d1); stroke-width: 2.4; fill: none; stroke-dasharray: 6 4; }
            .cq6-sup-niv-cp2 { stroke: var(--alt); stroke-width: 2.4; fill: none; stroke-dasharray: 6 4; }
            .cq6-sup-niv-g { stroke: var(--faint); stroke-width: 1.1; fill: none; stroke-dasharray: 3 3; }
            .cq6-sup-niv-fue { stroke: var(--faint); stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
            .cq6-sup-niv-f { fill: var(--live); fill-opacity: .12; stroke: none; }
            .cq6-sup-niv-f2 { fill: var(--alt); fill-opacity: .12; stroke: none; }
            .cq6-sup-niv-pt { fill: var(--live); }
            .cq6-sup-niv-punta { fill: var(--faint); stroke: none; }
            .cq6-sup-niv-hueco { fill: var(--paper); stroke: var(--live); stroke-width: 2; }
            .cq6-sup-niv-o { fill: var(--flag); }
            .cq6-sup-niv-n { fill: var(--faint); font-size: 10px; font-family: var(--mono); paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
            .cq6-sup-niv-l { font-size: 10.5px; font-family: var(--mono); font-weight: 700; paint-order: stroke; stroke: var(--paper); stroke-width: 3.4px; stroke-linejoin: round; }
            .cq6-sup-niv-m { fill: var(--paper); stroke: var(--d1); stroke-width: .7; stroke-linejoin: round; }
