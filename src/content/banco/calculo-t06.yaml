    bloque: '6.1-6.2'
    diapositiva: 1
    pregunta: |
      La gráfica muestra cuatro curvas de nivel de cierta superficie, y cuatro
      puntos de su dominio. ¿En cuál de los trayectos que se indican más
      abajo, el cambio en la altitud es mayor?
