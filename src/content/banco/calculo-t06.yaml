    opciones:
      - texto: '$(x+a)^2+(z+b)^2=y+c$'
        porque: |-
          Es un paraboloide con el eje paralelo al eje $y$, abierto hacia las
          $y$ crecientes. El de la figura tiene el eje paralelo al eje $x$: su
          boca está en un plano $x=\text{cte}$.
      - texto: '$(y-a)^2+(z-b)^2=x-c$'
        correcta: true
        porque: |-
          Un paraboloide con el vértice en $(c,a,b)$ y el eje paralelo al eje
          $x$, abierto hacia las $x$ crecientes. Es el de la figura: la boca
          está en un plano $x=\text{cte}$ y mira hacia el lado de las $x$
          positivas.
      - texto: '$(x-a)^2+(z-b)^2=y-c$'
        porque: |-
          Tiene la forma buena, un paraboloide desplazado, pero con el eje
          paralelo al eje $y$. En la figura la boca está en un plano
          $x=\text{cte}$ y se abre hacia las $x$ positivas.
      - texto: '$(y-a)^2+(z-b)^2=(x-c)^2$'
        porque: |-
          Es un cono de eje paralelo al eje $x$, con dos hojas y el vértice en
          punta. La figura tiene una sola hoja y el vértice redondeado.

  - id: yz-igual-a-uno
    bloque: '6.5'
    diapositiva: 8
    pregunta: |
      ¿Cuál de las superficies se corresponde con la siguiente ecuación?

      $$
      yz=1
      $$
    figura: |
      <svg viewBox="0 0 342 338" role="img" width="342" height="338"
           aria-labelledby="cq6-cilindros-t cq6-cilindros-d">
        <title id="cq6-cilindros-t">Cuatro superficies cilíndricas</title>
        <desc id="cq6-cilindros-d">Cuatro trozos de cilindro hiperbólico, cada uno con sus ejes. En A, las rectas de la superficie son paralelas al eje y, y su perfil, en el plano xz, baja desde lo alto junto al eje z al crecer x. En B, las rectas son paralelas al eje x, y el perfil, en el plano yz, baja desde lo alto junto al eje z al crecer y. En C, las rectas son verticales, paralelas al eje z, y el perfil está en el plano xy. D es también un cilindro de rectas verticales, visto desde otro lado: sus ejes x e y salen hacia la derecha.</desc>
        <style>
            .cq6-cilindros-eje { stroke: var(--rule); stroke-width: 1.1; fill: none; }
            .cq6-cilindros-c { stroke: var(--d1); stroke-width: 2.8; fill: none; }
            .cq6-cilindros-c2 { stroke: var(--alt); stroke-width: 2.8; fill: none; }
            .cq6-cilindros-cp { stroke: var(--d1); stroke-width: 2.4; fill: none; stroke-dasharray: 6 4; }
            .cq6-cilindros-cp2 { stroke: var(--alt); stroke-width: 2.4; fill: none; stroke-dasharray: 6 4; }
            .cq6-cilindros-g { stroke: var(--faint); stroke-width: 1.1; fill: none; stroke-dasharray: 3 3; }
            .cq6-cilindros-fue { stroke: var(--faint); stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
            .cq6-cilindros-f { fill: var(--live); fill-opacity: .12; stroke: none; }
            .cq6-cilindros-f2 { fill: var(--alt); fill-opacity: .12; stroke: none; }
            .cq6-cilindros-pt { fill: var(--live); }
            .cq6-cilindros-punta { fill: var(--faint); stroke: none; }
            .cq6-cilindros-hueco { fill: var(--paper); stroke: var(--live); stroke-width: 2; }
            .cq6-cilindros-o { fill: var(--flag); }
            .cq6-cilindros-n { fill: var(--faint); font-size: 10px; font-family: var(--mono); paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
            .cq6-cilindros-l { font-size: 10.5px; font-family: var(--mono); font-weight: 700; paint-order: stroke; stroke: var(--paper); stroke-width: 3.4px; stroke-linejoin: round; }
            .cq6-cilindros-m { fill: var(--paper); stroke: var(--d1); stroke-width: .7; stroke-linejoin: round; }
            .cq6-cilindros-md { fill: var(--rule); stroke: var(--d1); stroke-width: .7; stroke-linejoin: round; }
            .cq6-cilindros-base { fill: var(--live); fill-opacity: .14; stroke: var(--live); stroke-width: .8; }
