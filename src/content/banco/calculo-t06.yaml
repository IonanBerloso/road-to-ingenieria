    opciones:
      - texto: De M a R
        porque: |-
          M, N y S están los tres fuera de la curva de nivel exterior, y R
          dentro de la más pequeña: los tres trayectos cruzan las mismas
          cuatro curvas y cambian lo mismo de altura. Que de M a R el camino
          sea más corto hace el cambio más rápido, no mayor.
      - texto: De S a R
        porque: |-
          Desde S hay más camino hasta R, pero se cruzan las mismas cuatro
          curvas que desde M o desde N: el desnivel es el mismo. La distancia
          cuenta para la rapidez del cambio, no para su tamaño.
      - texto: De N a R
        porque: |-
          N, como M y S, queda fuera de la curva exterior: desde cualquiera de
          los tres hasta R se cruzan las cuatro curvas, y el desnivel es el
          mismo.
      - texto: Los cambios de altitud en los tres trayectos anteriores son aproximadamente iguales
        correcta: true
        porque: |-
          Los tres puntos de partida están fuera de la curva exterior y R
          está dentro de la interior: los tres trayectos cruzan las mismas
          cuatro curvas, así que suben o bajan lo mismo. «Aproximadamente»,
          porque entre dos curvas de nivel la altura no se conoce con
          exactitud.

