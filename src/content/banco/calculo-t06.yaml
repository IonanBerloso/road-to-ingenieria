    opciones:
      - texto: 'En $P$: $F_x(x,y)<0$, $F_y(x,y)<0$'
        porque: |-
          $F_y<0$ es verdad en todo el mapa, porque los valores crecen hacia
          abajo. Pero en $P$ las curvas suben hacia la derecha: avanzando en
          $x$ se pasa a curvas de valor mayor, y $F_x>0$.
      - texto: 'En $M$: $F_x(x,y)>0$, $F_y(x,y)>0$'
        porque: |-
          En $M$ sí es $F_x>0$, porque las curvas suben hacia la derecha. Pero
          los valores crecen hacia abajo en todo el mapa: al subir, $F$
          disminuye, y $F_y<0$.
      - texto: 'En $R$: $F_x(x,y)<0$, $F_y(x,y)<0$'
        correcta: true
        porque: |-
          Los valores crecen hacia abajo, así que $F_y<0$ en todo el mapa. En
          $R$, a la derecha de la cresta, las curvas bajan hacia la derecha:
          avanzando en $x$ se queda por encima de ellas, en valores menores,
          y $F_x<0$.
      - texto: 'En $N$: $F_x(x,y)<0$, $F_y(x,y)>0$'
        porque: |-
          $F_x<0$ en $N$ está bien, pero $F_y$ no es positiva en ningún punto:
          los valores de las curvas crecen hacia abajo.

  - id: aproximacion-de-x2-mas-y3
    bloque: '6.10'
    diapositiva: 21
    pregunta: |
      Considerar la función $F(x,y)=x^2+y^3$. ¿Cuál de las siguientes es la
      expresión de la aproximación mediante la diferencial en el punto
      $(2,1)$?
    opciones:
      - texto: '$F(2+h,1+k)\simeq 6+3h+4k$'
        porque: |-
          Tiene los coeficientes de $h$ y de $k$ cambiados de sitio ($4$ es
          $F_x$ y $3$ es $F_y$) y el término independiente mal:
          $F(2,1)=4+1=5$, no $6$.
      - texto: '$F(2+h,1+k)\simeq 5+4h+3k$'
        correcta: true
        porque: |-
          En $(2,1)$: $F=5$, $F_x=2x=4$ y $F_y=3y^2=3$. Así que
          $F(2+h,1+k)\simeq F(2,1)+F_x\,h+F_y\,k=5+4h+3k$.
      - texto: '$F(2+h,1+k)\simeq 4+5h+2k$'
        porque: |-
          Ninguno de sus tres números sale de las cuentas: en $(2,1)$, $F=5$,
          $F_x=4$ y $F_y=3$.
      - texto: '$F(2+h,1+k)\simeq 5-4h-3k$'
        porque: |-
          Son los números buenos con los signos cambiados: la diferencial suma
          $F_x\,h+F_y\,k$, y aquí las dos parciales son positivas.

  - id: signos-de-la-diferencial
    bloque: '6.10'
    diapositiva: 22
    pregunta: |
      La figura muestra un diagrama de curvas de nivel cierta función
      $F(x,y)$. La aproximación a $F(x,y)$ mediante la diferencial en un
      entorno del punto $P(a,b)$ es:

      $$
      F(x,y)\simeq c+m(x-a)+n(y-b)
      $$

      ¿Cuál es el signo de los coeficientes $c$, $m$ y $n$?
