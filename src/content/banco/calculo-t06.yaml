    opciones:
      - texto: '$x^2+z^2=y$'
        porque: |-
          Es el paraboloide de eje $y$, pero abierto hacia las $y$ positivas:
          $x^2+z^2\ge 0$ obliga a $y\ge 0$. El de la figura se abre hacia el
          otro lado.
      - texto: '$x^2+z^2=y^2$'
        porque: |-
          Es un cono, con dos hojas y el vértice en punta. La figura es una
          sola hoja con el vértice redondeado: un paraboloide.
      - texto: '$x^2+z^2=-y$'
        correcta: true
        porque: |-
          $x^2+z^2=-y$ obliga a $y\le 0$: un paraboloide de eje $y$ con el
          vértice en el origen y abierto hacia las $y$ negativas, como el de
          la figura.
      - texto: '$x^2+z^2=-y^2$'
        porque: |-
          Solo la cumple el origen: el primer miembro es mayor o igual que
          cero y el segundo, menor o igual. No es una superficie, es un
          punto.

  # La diapositiva no da a, b ni c. El dibujo usa a = 1, b = 1, c = −1: el
  # vértice en (−1, 1, 1) y la boca en x = 1,6, como en el original, donde el
  # vértice queda detrás del eje z y la boca mira hacia quien mira.
  - id: paraboloide-desplazado
    bloque: '6.4'
    diapositiva: 7
    pregunta: |
      ¿Cuál es la ecuación de la superficie que muestra la figura?
    figura: |
