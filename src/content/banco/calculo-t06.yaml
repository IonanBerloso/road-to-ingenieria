    opciones:
      - texto: De M a R
        correcta: true
        porque: |-
          Los tres trayectos cambian lo mismo de altura, porque cruzan las
          mismas cuatro curvas, así que el más rápido es el más corto. Del
          lado de M las curvas están apretadas y R queda cerca: se cruzan las
          cuatro en muy poco recorrido.
      - texto: De S a R
        porque: |-
          De S a R se atraviesa la zona donde las curvas están más separadas:
          el mismo desnivel repartido en más camino, que es el cambio más
          lento de los tres.
      - texto: De N a R
        porque: |-
          Desde N hay bastante más camino hasta R que desde M, con el mismo
          desnivel: el cambio es más lento. La pendiente es mayor donde las
          curvas se aprietan, del lado de M.
      - texto: Los cambios de altitud en los tres trayectos anteriores se producen aproximadamente a la misma velocidad
        porque: |-
          El desnivel sí es el mismo en los tres, pero no el camino: desde M
          se cruzan las cuatro curvas en mucho menos recorrido que desde N o
          desde S. Cambiar lo mismo en menos camino es cambiar más rápido.

  - id: curva-de-nivel-de-g-compuesta
    bloque: '6.1-6.2'
    diapositiva: 3
    pregunta: |
      Considerar la función $u=g(t)$ cuya gráfica se muestra en la figura
      Definimos la siguiente función de dos variables:

      $$
      F(x,y)=g\left(x^2+y^2-4\right)
      $$

      ¿Cuál de las siguientes gráficas corresponde a la curva de nivel
      $F(x,y)=3$?
    figura: |
      <svg viewBox="0 0 342 338" role="img" width="342" height="338"
           aria-labelledby="cq6-g-nivel-t cq6-g-nivel-d">
        <title id="cq6-g-nivel-t">La gráfica de g y tres candidatas a la curva de nivel F = 3</title>
        <desc id="cq6-g-nivel-d">Cuatro gráficas. La primera es la de u = g(t) entre t = 0 y t = 6: empieza en u = 3, sube hasta algo más de 4 en t = 2,5, vuelve a valer 3 en t = 5 y baja hasta menos de 2 en t = 6. En A, tres rectas paralelas de pendiente menos uno: x + y = −1, x + y = 1 y x + y = 3. En B, dos circunferencias con centro en el origen, de radios 2 y 3. En C, la parábola y = x².</desc>
