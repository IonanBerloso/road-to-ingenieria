    opciones:
      - texto: La gráfica A
        porque: |-
          Es la gráfica de $Y'(s)$, positiva donde $Y$ crece. Pero multiplicar
          $y(t)$ por $t$ es derivar su transformada y cambiarle el signo,
          $H(s)=-Y'(s)$: la simétrica de esta respecto del eje $s$.
      - texto: La gráfica B
        correcta: true
        porque: |-
          $\mathcal{L}(ty(t))=-Y'(s)$. Donde $Y$ crece, hasta su máximo cerca
          de $s=1$, $H$ es negativa; en el máximo se anula; y después, donde
          $Y$ baja despacio, $H$ es positiva y pequeña.

  - id: convolucion-con-t
    bloque: '10.5'
    diapositiva: 12
    pregunta: |
      Calcular $\mathcal{L}(u(t))$ siendo $u(t)$ una función que verifica la
      ecuación:

      $$
      u'(t)=t*u(t),\quad u(0)=1
      $$
    opciones:
      - texto: '$\mathcal{L}(u(t))=\frac{s^2}{s^3-1}$'
        correcta: true
        porque: |-
          El asterisco es la convolución, que se transforma en un producto:
          $\mathcal{L}(t*u)=\frac{1}{s^2}U$. Con $\mathcal{L}(u')=sU-1$ queda
          $sU-1=\frac{U}{s^2}$, y $U=\frac{s^2}{s^3-1}$.
      - texto: '$\mathcal{L}(u(t))=\frac{s^3}{s^2-1}$'
        porque: |-
          Intercambia los exponentes, y así crece como $s$ cuando
          $s\to\infty$. Una transformada de Laplace tiende a cero.
      - texto: '$\mathcal{L}(u(t))=\frac{s^2-4}{s^3+1}$'
        porque: |-
          El $s^3+1$ saldría de $sU-1=-\frac{U}{s^2}$, es decir, de
          $u'=-t*u$, con el signo cambiado. Y el numerador no cuadra con
          ningún dato: con $u(0)=1$ es $s^2$.
      - texto: '$\mathcal{L}(u(t))=\frac{s^2+3}{s^4-1}$'
        porque: |-
          El $s^4-1$ aparece si se transforma $u'$ como si fuera $u''$, con
          $s^2U-s$. La de $u'$ es $sU-1$, y lleva a $(s^3-1)U=s^2$.

  - id: ecuacion-lineal-con-convolucion
    bloque: '10.5'
    diapositiva: 13
    pregunta: |
      Resolver: $ay'(t)+by(t)=u(t)\quad(a\neq0)$
    opciones:
      - texto: '$y(t)=\frac{1}{a}u(t)*e^{-\frac{bt}{a}}+y(0)e^{-\frac{bt}{a}}$'
        correcta: true
        porque: |-
          Transformando, $a(sY-y(0))+bY=U$, así que
          $Y=\frac1a\,U\cdot\frac{1}{s+b/a}+\frac{y(0)}{s+b/a}$. El producto
          vuelve como convolución, y $\frac{1}{s+b/a}$ es la transformada de
          $e^{-bt/a}$.
      - texto: '$y(t)=u(t)e^{\frac{bt}{a}}+au(0)e^{\frac{bt}{a}}$'
        porque: |-
          Tiene tres fallos: multiplica donde va una convolución, porque el
          producto de transformadas no es la transformada del producto; el
          exponente lleva el signo cambiado; y usa $u(0)$ en vez de $y(0)$.
      - texto: '$y(t)=u(t)*e^{\frac{bt}{a}}+\frac{u(0)}{a}e^{\frac{bt}{a}}$'
        porque: |-
          Acierta con la convolución, pero no con la exponencial: el polo de
          $\frac{1}{as+b}$ está en $s=-\frac ba$, y da $e^{-bt/a}$. Además le
          falta el $\frac1a$, y el valor inicial que entra al transformar $y'$
          es el de $y$, no el de $u$.

  - id: sistema-equivalente
    bloque: '10.6'
    diapositiva: 14
    pregunta: |
      Considerar la EDO de orden 2 siguiente:

      $$
      x''(t)-x'(t)-2x(t)=4,\quad x(0)=3,\ x'(0)=1
      $$

      ¿Cuál de los sistemas de EDO indicados es equivalente a la EDO?
    opciones:
      - texto: |-
          $\begin{cases}x'(t)=y(t)\\ y'(t)=4+2x(t)+y(t)\\ y(0)=1\\ x(0)=3\end{cases}$
        correcta: true
        porque: |-
          Se llama $y$ a la derivada, $y=x'$. Entonces
          $y'=x''=4+x'+2x=4+2x+y$, y las condiciones pasan tal cual:
          $x(0)=3$ e $y(0)=x'(0)=1$.
      - texto: |-
          $\begin{cases}y'(t)=x(t)\\ x'(t)=4+2x(t)+y(t)\\ y(0)=3\\ x(0)=1\end{cases}$
        porque: |-
          Cambia los papeles: aquí la incógnita es $y$, con $y(0)=3$, y su
          derivada es $x$, con $x(0)=1$. Pero entonces la segunda ecuación
          dice $y''=4+2y'+y$, que no es la EDO; para serlo tendría que ser
          $x'=4+x+2y$.
