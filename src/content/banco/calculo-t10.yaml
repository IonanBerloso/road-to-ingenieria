asignatura: calculo
tema: t10-laplace
titulo: Las cuestiones de las diapositivas del tema 10
fuente: >-
  Las diapositivas de clase del tema 10 de Cálculo, «Transformada de Laplace»
  (UPV/EHU): catorce preguntas tipo test para las cuestiones en grupo y para
  el oral de la final y de la extraordinaria. Las diapositivas no traen la
  solución: la respuesta y el porqué de cada opción son de este sitio, y las
  figuras están redibujadas.
diapositivas: 14
bloques:
  - { id: '10.1-10.2', titulo: Transformada de Laplace de una función }
  - { id: '10.4', titulo: Propiedades de la transformada de Laplace }
  - { id: '10.5', titulo: Convolución }
  - { id: '10.6', titulo: Sistemas lineales }
preguntas:
  - id: derivadas-iguales
    bloque: '10.1-10.2'
    diapositiva: 1
    pregunta: |
      ¿Es cierta la siguiente propiedad?

      *“Sean $f(t)$ y $g(t)$ dos funciones tales que $f'(t)=g'(t)$. Sean
      $\mathcal{L}(f(t))=F(s)$, $\mathcal{L}(g(t))=G(s)$.*

      *Entonces, a medida que el valor de $s$ aumenta, los valores de $F(s)$ y
      $G(s)$ se hacen cada vez más próximos”*
    opciones:
      - texto: La propiedad es cierta en general.
        correcta: true
        porque: |-
          Con $f'=g'$, las dos funciones se diferencian en una constante:
          $f=g+C$. Por linealidad, $F(s)=G(s)+\frac{C}{s}$, y la distancia
          entre ellas, $\frac{|C|}{s}$, se hace tan pequeña como se quiera al
          crecer $s$.
      - texto: La propiedad no es cierta en general.
        porque: |-
          Tienta pensar que, si $f$ y $g$ son distintas, sus transformadas
          seguirán separadas. Pero con $f'=g'$ solo se diferencian en una
          constante $C$, y la transformada de esa diferencia, $\frac{C}{s}$,
          tiende a cero.

  - id: transformada-de-una-funcion-a-trozos
    bloque: '10.1-10.2'
    diapositiva: 2
    pregunta: |
      Calcular la transformada de Laplace $F(s)$ de la siguiente función:

      $$
      f(t)=\begin{cases}1 & t\in(0,1)\\ e^{2t} & t\in(1,\infty)\end{cases}
      $$
    opciones:
      - texto: '$F(s)=\begin{cases}\frac{1}{s} & s\in(0,1)\\ \frac{1}{s-2} & s\in(1,\infty)\end{cases}$'
        porque: |-
          Transforma cada trozo por separado y reparte los resultados por
          intervalos de $s$, pero $(0,1)$ y $(1,\infty)$ son intervalos de
          $t$. $F(s)$ es una sola integral sobre todo $t\ge0$, y los dos trozos
          cuentan a la vez para cada $s$.
      - texto: '$F(s)=\frac{1}{s}-\frac{e^{-s}}{s}+\frac{1}{(s-2)e^{s-2}}$'
        correcta: true
        porque: |-
          Se parte la integral en $t=1$: $\int_0^1e^{-st}\,dt=\frac{1-e^{-s}}{s}$
          y $\int_1^\infty e^{(2-s)t}\,dt=\frac{e^{2-s}}{s-2}$, que converge
          para $s>2$. Sumadas dan esta expresión.
      - texto: '$f(t)$ no tiene transformada de Laplace'
        porque: |-
          $e^{2t}$ crece, pero no más que una exponencial: $e^{2t}e^{-st}$ se
          integra en $(1,\infty)$ en cuanto $s>2$. Solo fallaría con algo que
          crezca más deprisa que cualquier exponencial, como $e^{t^2}$.

