    opciones:
      - texto: '$-1-sY(s)=2Y(s)+\frac{3}{s-1}$'
        porque: |-
          Es la transformada de $y'$ cambiada de signo, $-(sY+1)$, y con
          $\frac{3}{s-1}$, que corresponde a $3e^{t}$ y no a $3e^{-t}$.
      - texto: '$1+sY(s)=2Y(s)+\frac{3}{s+1}$'
        correcta: true
        porque: |-
          $\mathcal{L}(y')=sY-y(0)$ y $\mathcal{L}(e^{-t})=\frac{1}{s+1}$. En
          la gráfica, $y(0)=-1$, así que $sY+1=2Y+\frac{3}{s+1}$.
      - texto: '$sY(s)=1+2Y(s)+\frac{3}{s-1}$'
        porque: |-
          Pasando el 1 al otro lado queda $sY-1$, que corresponde a $y(0)=1$,
          y la gráfica sale de $-1$. Además $\frac{3}{s-1}$ es la transformada
          de $3e^{t}$, no de $3e^{-t}$.
      - texto: '$s+sY(s)=2Y(s)+\frac{3}{s+1}$'
        porque: |-
          Multiplica el valor inicial por $s$, como en la transformada de
          $y''$, $s^2Y-s\,y(0)-y'(0)$. En la de $y'$ va solo:
          $sY-y(0)=sY+1$.

  - id: funcion-retrasada
    bloque: '10.1-10.2'
    diapositiva: 6
    pregunta: |
      Sea $Y(s)=\mathcal{L}(y(t))$. Construimos una nueva función $h(t)$ del
      siguiente modo:

      $$
      h(t)=\begin{cases}0 & \text{si } t<a\\ y(t-a) & \text{si } t>a\end{cases}
      $$

      Siendo $a>0$. ¿Cuál será $\mathcal{L}(h(t))=H(s)$?
    opciones:
      - texto: '$H(s)=Y(s-a)$'
        porque: |-
          Es la otra traslación: $Y(s-a)$ es la transformada de $e^{at}y(t)$.
          Multiplicar por una exponencial en $t$ traslada en $s$; retrasar en
          $t$ multiplica por una exponencial en $s$.
      - texto: '$H(s)=\frac{Y(s)}{a}$'
        porque: |-
          Dividir entre $a$ recuerda al cambio de escala,
          $\mathcal{L}(y(at))=\frac1aY\left(\frac sa\right)$, pero aquí no se
          cambia la escala del tiempo: la función se retrasa $a$ unidades.
      - texto: '$H(s)=e^{a}Y(s)$'
        porque: |-
          $e^{a}$ es una constante: sería la transformada de $e^{a}y(t)$, la
          misma función multiplicada por un número. El retraso deja un factor
          que depende de $s$.
      - texto: '$H(s)=e^{-sa}Y(s)$'
        correcta: true
        porque: |-
          $H(s)=\int_a^\infty e^{-st}y(t-a)\,dt$, y con $\tau=t-a$ queda
          $\int_0^\infty e^{-s(\tau+a)}y(\tau)\,d\tau=e^{-sa}Y(s)$: retrasar la
          función $a$ unidades multiplica su transformada por $e^{-as}$.

  - id: condicion-inicial-en-la-derivada
    bloque: '10.1-10.2'
    diapositiva: 7
    pregunta: |
      Calcular la transformada de Laplace $Y(s)$ de la función $y(t)$ que
      verifica la EDO

      $$
      \frac{dy}{dt}=5y+3e^{-3t},\quad y'(0)=-7
      $$
    opciones:
      - texto: '$Y(s)=\frac{3s+2}{(s-3)(s+5)}$'
        porque: |-
          Los factores del denominador llevan los signos cambiados: el $5y$ da
          $s-5$, y el $3e^{-3t}$, $\frac{3}{s+3}$. Aquí salen $s-3$ y $s+5$.
      - texto: '$Y(s)=-\frac{2s+3}{(s+3)(s-5)}$'
        correcta: true
        porque: |-
          El dato es $y'(0)$, y la transformada de $y'$ pide $y(0)$: se saca
          de la propia EDO en $t=0$, $-7=5y(0)+3$, así que $y(0)=-2$. Entonces
          $sY+2=5Y+\frac{3}{s+3}$, y despejando, $Y=-\frac{2s+3}{(s+3)(s-5)}$.
      - texto: '$Y(s)=\frac{s+4}{(s-1)(s+5)}$'
        porque: |-
          Su denominador no sale de esta ecuación: el $5y$ da el factor $s-5$
          y el $3e^{-3t}$, el $s+3$. Con $s-1$ y $s+5$ sería otra EDO.
      - texto: '$Y(s)=-\frac{s+4}{(s+3)(s-5)}$'
        porque: |-
          El denominador es el bueno, pero el numerador no sale con ningún
          valor inicial: con $y(0)=y_0$, $(s-5)Y=y_0+\frac{3}{s+3}$, y el
          numerador es $y_0(s+3)+3$. Para que empiece por $-s$ hace falta
          $y_0=-1$, y entonces queda $-s$, no $-(s+4)$.

  - id: funciones-iguales-desde-a
    bloque: '10.1-10.2'
    diapositiva: 8
    pregunta: |
      Supongamos que $u(t)$ y $v(t)$ son idénticas en el intervalo
      $(a,\infty)$. Calcular la transformada de Laplace de $u(t)-v(t)$.
    opciones:
      - texto: '$\int_0^\infty e^{st}(u(t)-v(t))dt$'
        porque: |-
          Lleva $e^{st}$, con el signo del exponente cambiado: no es la
          transformada. Con $e^{-st}$ y los límites de 0 a $\infty$ sí lo
          sería.
      - texto: '$\int_0^a e^{-st}(u(t)-v(t))ds$'
        porque: |-
          Integra en $s$, y la variable de integración es $t$: $s$ es la de la
          transformada. Así escrita, la integral da una función de $t$, no de
          $s$.
      - texto: '$\int_a^\infty e^{-st}(u(t)-v(t))dt$'
        porque: |-
          Es justo el trozo que vale cero: en $(a,\infty)$, $u=v$ y el
          integrando se anula. Lo que queda de la transformada es la integral
          de 0 a $a$.
      - texto: '$\int_0^a e^{-st}(u(t)-v(t))dt$'
        correcta: true
        porque: |-
          $\mathcal{L}(u-v)=\int_0^\infty e^{-st}(u-v)\,dt$, y de $a$ en
          adelante $u-v=0$: la integral se queda en la de 0 a $a$.

  - id: una-ecuacion-integral
    bloque: '10.4'
    diapositiva: 9
    pregunta: |
      Resolver la ecuación $\int_0^t u(z)dz+u(t)=2t$
    opciones:
      - texto: '$u(t)=1-e^{2t}$'
        porque: |-
          Cumple $u(0)=0$, que es lo que la ecuación da en $t=0$, pero nada
          más. Derivando la ecuación, $u+u'=2$, y aquí $u+u'=1-3e^{2t}$.
      - texto: '$u(t)=\cos 2t+e^t$'
        porque: |-
          En $t=0$ la integral vale cero y el segundo miembro también, así que
          $u(0)=0$. Esta da $u(0)=\cos0+e^0=2$.
      - texto: '$u(t)=2-2e^{-t}$'
        correcta: true
        porque: |-
          La integral de 0 a $t$ se transforma en $\frac{U}{s}$:
          $\frac{U}{s}+U=\frac{2}{s^2}$, así que
          $U=\frac{2}{s(s+1)}=\frac2s-\frac{2}{s+1}$ y $u=2-2e^{-t}$. Se
          comprueba: $\int_0^t(2-2e^{-z})\,dz=2t-2+2e^{-t}$, y sumándole $u$
          da $2t$.
      - texto: '$u(t)=2-2e^{-z}$'
        porque: |-
          Tiene la forma de la solución, pero con la letra equivocada: $z$ es
          la variable de integración, y fuera de la integral no existe. La
          solución es una función de $t$.

  - id: ecuacion-integral-con-t
    bloque: '10.4'
    diapositiva: 10
    pregunta: |
      Resolver la ecuación $\int_0^t zu(z)dz=1+tu(t)-e^t$
    opciones:
      - texto: '$u(t)=\operatorname{sen}t-\cos t$'
        porque: |-
          Derivando la ecuación, $tu=u+tu'-e^t$, y en $t=0$ queda $u(0)=1$.
          Esta da $u(0)=\operatorname{sen}0-\cos0=-1$.
      - texto: '$u(t)=e^t$'
        correcta: true
        porque: |-
          Con la transformada, $\mathcal{L}(tu)=-U'(s)$, y la integral de 0 a
          $t$ divide entre $s$: $-\frac{U'}{s}=\frac1s-U'-\frac{1}{s-1}$.
          Despejando, $U'=-\frac{1}{(s-1)^2}$, así que $U=\frac{1}{s-1}$ (sin
          constante, porque $U\to0$) y $u=e^t$. Se comprueba:
          $\int_0^tze^z\,dz=te^t-e^t+1$.
      - texto: '$u(t)=e^t\cos t$'
        porque: |-
          Empieza bien, $u(0)=1$, pero se anula en $t=\frac{\pi}{2}$, y ahí el
          segundo miembro vale $1-e^{\pi/2}<0$, mientras que el primero es la
          integral de $ze^z\cos z$, positiva en $\left(0,\frac{\pi}{2}\right)$.
      - texto: '$u(t)=e^{2t}-e^t$'
        porque: |-
          Derivando la ecuación y poniendo $t=0$ sale $u(0)=1$, y esta da
          $u(0)=1-1=0$.

  - id: multiplicar-por-t
    bloque: '10.4'
    diapositiva: 11
    pregunta: |
      La figura muestra la transformada de Laplace $Y(s)$ de cierta función
