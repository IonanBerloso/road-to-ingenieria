    opciones:
      - texto: '$F(s)=\begin{cases}0 & s\in(0,2)\\ \frac{1}{s} & s\in(2,4)\\ 0 & s\in(4,\infty)\end{cases}$'
        porque: |-
          Copia la forma de $f$ en la variable $s$, como si los intervalos de
          $t$ lo fueran de $s$. La transformada integra la función entera para
          cada $s$ y da una sola expresión, no un trozo por intervalo.
      - texto: '$F(s)=\frac{e^{-4s}-e^{-2s}}{(s-2)(s-4)}$'
        porque: |-
          Mete los instantes del salto, 2 y 4, en el denominador, como si
          fueran traslaciones en $s$. Y para $s>4$ sale negativa, cuando la
          transformada de una función que nunca es negativa es positiva.
      - texto: '$F(s)=\frac{e^{-2s}-e^{-4s}}{s}$'
        correcta: true
        porque: |-
          $F(s)=\int_2^4e^{-st}\,dt=\frac{e^{-2s}-e^{-4s}}{s}$. Es lo mismo que
          escribir $f=u(t-2)-u(t-4)$ con el escalón y transformar cada uno:
          $\frac{e^{-2s}}{s}-\frac{e^{-4s}}{s}$.

  - id: invertir-la-transformada
    bloque: '10.1-10.2'
    diapositiva: 4
    pregunta: |
      Resolver la siguiente ecuación:

      $$
      \int_0^\infty e^{-st}y(t)dt=\frac{1}{(s+1)(s-3)}
      $$
    opciones:
      - texto: '$y(t)=\int_0^\infty\frac{e^{st}ds}{(s+1)(s-3)}$'
        porque: |-
          Imita la definición cambiando el signo del exponente e integrando en
          $s$, pero la transformada no se invierte así. Esa integral ni
          siquiera existe: el integrando crece como $e^{st}$ y tiene un polo
          en $s=3$.
      - texto: '$y(t)=\frac{1}{4}e^{-3t}-\frac{1}{4}e^{t}$'
        porque: |-
          Tiene los exponentes con el signo cambiado. $\frac{1}{s-a}$ es la
          transformada de $e^{at}$: el factor $s-3$ da $e^{3t}$ y el $s+1$,
          $e^{-t}$.
      - texto: '$y(t)=\frac{1}{4}e^{3t}-\frac{1}{4}e^{-t}$'
        correcta: true
        porque: |-
          La integral es la transformada de $y$, así que se busca la función
          cuya transformada es $\frac{1}{(s+1)(s-3)}$. En fracciones simples
          es $\frac{1/4}{s-3}-\frac{1/4}{s+1}$, y la tabla da
          $\frac14e^{3t}-\frac14e^{-t}$.
      - texto: '$y(t)=\frac{1}{5}e^{3t}-\frac{1}{5}e^{-t}$'
        porque: |-
          Los exponentes son los buenos, pero no el coeficiente. En
          $\frac{1}{(s+1)(s-3)}=\frac{A}{s-3}+\frac{B}{s+1}$, tapando $s-3$ y
          poniendo $s=3$ sale $A=\frac{1}{3+1}=\frac14$, no $\frac15$.

  # La curva del original, y la redibujada, es y = C·e^(2t) − e^(−t) con
  # C = 3·10⁻⁶: por eso se dispara hacia t = 6. Su y(0) es −1 a la precisión
  # del dibujo, que es lo que la pregunta pide leer.
