asignatura: calculo
tema: t08-integral-curvilinea
titulo: Las cuestiones de las diapositivas del tema 8
fuente: >-
  Las diapositivas de clase del tema 8 de Cálculo, «Integral curvilínea»
  (UPV/EHU): treinta preguntas tipo test para las cuestiones en grupo y para
  el oral de la final y de la extraordinaria. Las diapositivas no traen la
  solución: la respuesta y el porqué de cada opción son de este sitio, y las
  figuras están redibujadas.
diapositivas: 30
bloques:
  - { id: '8.1', titulo: Planteamiento del problema }
  - { id: '8.2', titulo: Integral curvilínea en el plano }
  - { id: '8.3', titulo: Integral curvilínea en el espacio }
  - { id: '8.4', titulo: Integral curvilínea en un campo de gradientes }
  - { id: '8.5', titulo: Teorema de Green }
  - { id: '8.6', titulo: Integral curvilínea respecto a la longitud del arco }
preguntas:
  - id: campo-vertical-que-cambia-de-sentido-en-x
    bloque: '8.1'
    diapositiva: 1
    pregunta: |
      La figura muestra un campo vectorial $V(x,y)$. ¿Cuál de las expresiones
      $V(x,y)$ le corresponde?
