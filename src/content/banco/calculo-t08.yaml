    opciones:
      - texto: '(1) $U$, (2) $V$, (3) $W$'
        porque: |-
          Cambia entre sí los dos radiales. En (1) las flechas crecen al
          alejarse del origen, que es $V=(x,y)$, de módulo $\sqrt{x^2+y^2}$; en
          (2) miden todas lo mismo, que es $U$, de módulo $1$.
      - texto: '(1) $U$, (2) $W$, (3) $V$'
        porque: |-
          Cambia $V$ por $W$: (2) es radial, con las flechas saliendo del
          origen, y $W=(y,-x)$ es perpendicular al radio, así que no sale del
          origen sino que gira a su alrededor. El que gira es (3).
      - texto: '(1) $V$, (2) $U$, (3) $W$'
        correcta: true
        porque: |-
          Los dos radiales se distinguen por el largo: $V=(x,y)$ crece con la
          distancia al origen (1) y $U=V/\lVert V\rVert$ tiene módulo $1$ en
          todas partes (2). $W=(y,-x)$ es perpendicular a $(x,y)$ en cada
          punto, así que gira alrededor del origen: en $(0,1)$ vale $(1,0)$,
          hacia la derecha, en sentido horario, como (3).
      - texto: '(1) $V$, (2) $W$, (3) $U$'
        porque: |-
          Acierta (1), pero (2) es radial y $W=(y,-x)$ gira; y $U$, que es
          radial, no puede ser (3), el único gráfico que rodea el origen.
      - texto: '(1) $W$, (2) $U$, (3) $V$'
        porque: |-
          (1) es radial y $W$ es perpendicular al radio; y (3), que rodea el
          origen, no puede ser $V=(x,y)$, que apunta hacia fuera.
      - texto: '(1) $W$, (2) $V$, (3) $U$'
        porque: |-
          Pone el giro en un gráfico radial y un campo radial en el que gira.
          Además (2), con todas las flechas iguales, es $U$, no $V$.

  - id: trabajo-de-0-y-de-m-a-n
    bloque: '8.1'
    diapositiva: 7
    pregunta: |
      El trabajo realizado por el campo de fuerza $V(x,y)=(0,y)$ cuando un
      objeto se desplaza en línea recta desde $M(1,1)$ hasta $N(1,-1)$ es…
    opciones:
      - texto: Positivo
        porque: |-
          Solo cuenta la segunda mitad: de $y=0$ a $y=-1$ el campo apunta hacia
          abajo, como el movimiento, y aporta $+1/2$. Pero de $y=1$ a $y=0$
          apunta hacia arriba, contra el movimiento, y aporta $-1/2$.
      - texto: Negativo
        porque: |-
          Solo cuenta la primera mitad, la que va contra el campo. En la
          segunda, por debajo del eje $x$, el campo y el movimiento van los dos
          hacia abajo, y los dos trozos se compensan.
      - texto: Cero
        correcta: true
        porque: |-
          Por el segmento $x=1$, con $y$ de $1$ a $-1$:
          $W=\int_1^{-1}y\,dy=\left[\frac{y^2}{2}\right]_1^{-1}=\frac12-\frac12=0$.
          Es lo mismo que decir que $V$ es el gradiente de $y^2/2$, que vale lo
          mismo en $M$ y en $N$.

  - id: signo-del-trabajo-en-cinco-trayectorias
    bloque: '8.1'
    diapositiva: 8
    pregunta: |
      Considerar el campo vectorial $V$. La figura muestra el campo
      $U(x,y)=\dfrac{V}{\lVert V\rVert}$ y cinco trayectorias $C_1$ a $C_5$.
      Considerar el trabajo realizado por $V$ al trasladar una masa a lo largo
      de cada una de ellas. ¿Cuál de las afirmaciones es cierta?
    figura: |
