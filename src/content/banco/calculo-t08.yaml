    opciones:
      - texto: '$A\cdot M$'
        correcta: true
        porque: |-
          Por Green, con $X=yg(xy)$ e $Y=xf(xy)$: $Y_x=f(xy)+xyf'(xy)$ y
          $X_y=g(xy)+xyg'(xy)$. Como $f-g=M$ es constante, $f'=g'$ y queda
          $Y_x-X_y=f(xy)-g(xy)=M$: la circulación, en sentido positivo, es
          $\iint_D M\,dx\,dy=A\cdot M$.
      - texto: '$0$'
        porque: |-
          Sería cero si las dos funciones fueran iguales. Aquí
          $Y_x-X_y=f(xy)-g(xy)=M$, una constante distinta de cero: la
          circulación es $M$ veces el área.
      - texto: 'No se puede calcular porque depende de $f(t)$ y de $g(t)$'
        porque: |-
          Se calcula sin conocerlas: en $Y_x-X_y$ los términos con derivadas
          se cancelan, porque $f'=g'$, y lo que queda, $f-g$, es la constante
          $M$ de la figura.

  - id: masa-de-una-curva-sobre-una-superficie-de-nivel
    bloque: '8.6'
    diapositiva: 30
    pregunta: |
      Considerar una curva suave $C$ en el espacio, dada por
      $(x(t),y(t),z(t))$, $t\in[\alpha,\beta]$, cuyo vector tangente tiene
      siempre módulo $1$. Supongamos que $C$ está situada sobre la superficie
      de nivel $F(x,y,z)=k$ de cierta función de densidad de masa
      $F(x,y,z)$. Calcular la masa $M$ contenida en $C$.
    opciones:
      - texto: '$M=\dfrac{k}{\beta-\alpha}$'
        porque: |-
          Divide por la longitud en vez de multiplicar. La masa es
          $\int_C F\,ds$: la densidad, que vale $k$ en toda la curva, por la
          longitud, que es $\beta-\alpha$ porque la curva avanza a velocidad
          $1$.
      - texto: '$M=\dfrac{k}{\beta+\alpha}$'
        porque: |-
          Además de dividir, usa $\beta+\alpha$: la longitud de una curva
          recorrida a velocidad $1$ en $[\alpha,\beta]$ es $\beta-\alpha$, y la
          masa es densidad por longitud.
      - texto: '$M=k(\beta-\alpha)$'
        correcta: true
        porque: |-
          $M=\int_C F\,ds=\int_\alpha^\beta F(x(t),y(t),z(t))\,\lVert r'(t)\rVert\,dt$.
          Sobre la curva $F=k$, y $\lVert r'(t)\rVert=1$:
          $M=\int_\alpha^\beta k\,dt=k(\beta-\alpha)$.
