        <desc id="cq8-rectangulo-d">Una malla de flechas del mismo largo que giran en sentido antihorario alrededor del origen, que queda abajo a la izquierda. Encima, la trayectoria C: el rectángulo de vértices uno, dos y siete, siete, recorrido en sentido horario: el lado de arriba hacia la derecha, el de la derecha hacia abajo, el de abajo hacia la izquierda y el de la izquierda hacia arriba.</desc>
