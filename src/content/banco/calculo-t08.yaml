    opciones:
      - texto: Es conservativo
        correcta: true
        porque: |-
          En cada fila todas las flechas son iguales, y al subir solo crece la
          componente vertical: la horizontal no cambia. Es
          $V(t,y)=(c,g(y))$, con $\partial X/\partial y=0=\partial Y/\partial t$:
          el gradiente de $F=ct+G(y)$, siendo $G$ una primitiva de $g$.
      - texto: No es conservativo
        porque: |-
          Que las flechas cambien de dirección al subir no basta para
          descartarlo: lo que decide es si coinciden las derivadas cruzadas.
          Aquí $X$ es constante e $Y$ solo depende de $y$, y las dos derivadas
          cruzadas son cero.
      - texto: No puede saberse
        porque: |-
          La figura lo dice: la componente horizontal es la misma en todo el
          dibujo y la vertical solo cambia con la altura. Todo campo
          $(c,g(y))$ es un gradiente.

  - id: circulacion-de-una-armonica
    bloque: '8.4'
    diapositiva: 21
    pregunta: |
      Se dice que una función $F(x,y)$ es armónica si verifica la ecuación

      $$
      F_{xx}+F_{yy}=0
      $$

      Supongamos que $C$ es una curva suave y cerrada. Entonces el valor de
      $\oint_C F_y(x,y)\,dx-F_x(x,y)\,dy$ es…
    opciones:
      - texto: '$>0$'
        porque: |-
          Por Green,
          $\oint_C F_y\,dx-F_x\,dy=\iint_D(-F_{xx}-F_{yy})\,dx\,dy$ sobre la
          región $D$ que encierra $C$, y ser armónica anula el integrando en
          cada punto.
      - texto: '$<0$'
        porque: |-
          El signo da igual: el integrando de Green, $-(F_{xx}+F_{yy})$, es
          cero en todos los puntos.
      - texto: '$=0$'
        correcta: true
        porque: |-
          Con $X=F_y$ e $Y=-F_x$, $Y_x-X_y=-F_{xx}-F_{yy}=0$. Por Green, la
          circulación es la integral doble de cero, con $F$ de clase $C^2$
          dentro de $C$.

  - id: curvas-de-nivel-y-trayectoria
    bloque: '8.4'
    diapositiva: 22
    pregunta: |
      Sea $F(x,y)$ una función con derivadas parciales continuas. Considerar:

      - Las curvas de nivel de $F(x,y)$ que muestra la figura.
      - La trayectoria $C$ entre los puntos $M$ y $N$.

      Calcular el valor de $\int_C F_x(x,y)\,dx+F_y(x,y)\,dy$
    figura: |
      <svg viewBox="0 0 340 265" role="img" width="340" height="265"
           aria-labelledby="cq8-niveles-camino-t cq8-niveles-camino-d">
        <title id="cq8-niveles-camino-t">Curvas de nivel de F y una trayectoria de M a N</title>
        <desc id="cq8-niveles-camino-d">Unas curvas de nivel cerradas y anidadas, con forma de judía, rotuladas de dentro afuera con sus valores: dos, cinco, ocho, once y catorce. Arriba a la derecha asoma un trozo de la curva de nivel diecisiete. El punto M está sobre la curva de nivel cinco, abajo a la derecha, y el punto N sobre la de diecisiete, arriba. La trayectoria C sale de M, sube dando un par de curvas y cruzando las de nivel ocho, once y catorce, y llega a N.</desc>
