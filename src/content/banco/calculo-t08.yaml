    opciones:
      - texto: Es conservativo
        porque: |-
          Un campo conservativo tiene circulación nula en toda curva cerrada, y
          en una circunferencia alrededor del centro, recorrida en el sentido
          de las flechas, este campo va siempre a favor: la circulación es
          positiva.
      - texto: No es conservativo
        correcta: true
        porque: |-
          El campo gira alrededor del centro. En una circunferencia centrada
          ahí y recorrida en el sentido de las flechas, el horario,
          $V\cdot dr>0$ en cada punto, y la circulación es positiva. Si fuera
          conservativo, sería cero.
      - texto: No puede saberse
        porque: |-
          La figura basta: para descartar que sea conservativo hace falta una
          sola curva cerrada con circulación distinta de cero, y la
          circunferencia alrededor del centro lo es.

