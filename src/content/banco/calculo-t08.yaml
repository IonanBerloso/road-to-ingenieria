    opciones:
      - texto: '$V(x,y)=(x^3,0)$'
        porque: |-
          Es horizontal, porque tiene nula la segunda componente, y las flechas
          de la figura son verticales.
      - texto: '$V(x,y)=(x^2,0)$'
        porque: |-
          Es horizontal, y además $x^2\ge 0$ la haría apuntar siempre hacia la
          derecha.
      - texto: '$V(x,y)=(0,x^3)$'
        correcta: true
        porque: |-
          Vertical, con la segunda componente $x^3$, que tiene el signo de $x$:
          hacia arriba a la derecha y hacia abajo a la izquierda. Y crece
          deprisa: en $x=4$ mide $64$ veces lo que en $x=1$, por eso las
          flechas de cerca del eje apenas se ven.
      - texto: '$V(x,y)=(0,x^2)$'
        porque: |-
          Es vertical, pero $x^2\ge 0$: apuntaría hacia arriba a los dos lados
          del eje $y$, y en la figura las de la izquierda apuntan hacia abajo.

