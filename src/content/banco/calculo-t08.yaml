    opciones:
      - texto: 'El mayor trabajo se realiza en el trayecto $C_1$.'
        porque: |-
          $C_1$ es la que pasa más cerca del origen, donde $V=(x,y)$ es más
          corto: su trabajo, $2(x_m+y_m)$ con su punto medio $(x_m,y_m)$, es
          $6{,}4$, el menor de los tres.
      - texto: 'El mayor trabajo se realiza en el trayecto $C_2$.'
        porque: |-
          Queda más arriba que $C_1$, pero su punto medio, $(2,3)$, da
          $W=2(2+3)=10$, y el de $C_3$ está bastante más lejos en la dirección
          del movimiento: da $20{,}4$.
      - texto: 'El mayor trabajo se realiza en el trayecto $C_3$.'
        correcta: true
        porque: |-
          En un segmento recto de desplazamiento $d$, el trabajo de $V=(x,y)$
          es $W=d\cdot r_m$, con $r_m$ el punto medio. Con $d=(2,2)$ igual en
          los tres, $W=2(x_m+y_m)$: $6{,}4$ en $C_1$, $10$ en $C_2$ y $20{,}4$
          en $C_3$, la que queda más lejos en la dirección $(1,1)$.
      - texto: No puede saberse cuál de los trabajos es mayor.
        porque: |-
          Se puede saber: el campo es conocido y las trayectorias se leen en la
          figura. En un segmento, $W=d\cdot r_m$, y eso da $6{,}4$, $10$ y
          $20{,}4$.
      - texto: El trabajo es el mismo en todas las trayectorias
        porque: |-
          Tienen la misma longitud y la misma dirección, pero el campo no es
          constante: crece al alejarse del origen, y $C_3$ está donde $V$ es
          más largo.

