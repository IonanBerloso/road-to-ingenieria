    opciones:
      - texto: '$V(x,y)=(y^3,0)$'
        porque: |-
          Es horizontal, pero $y^3$ es negativo por debajo del eje $x$: allí
          sus flechas irían hacia la izquierda, y en la figura van todas hacia
          la derecha.
      - texto: '$V(x,y)=(y^2,0)$'
        correcta: true
        porque: |-
          Es horizontal y $y^2\ge 0$: todas las flechas hacia la derecha, más
          largas cuanto más lejos del eje $x$ e iguales a la misma distancia
          por encima y por debajo. Cada fila es constante porque no depende de
          $x$.
      - texto: '$V(x,y)=(0,x^3)$'
        porque: |-
          Es vertical: tiene nula la primera componente, y en la figura todas
          las flechas son horizontales.
      - texto: '$V(x,y)=(0,x^2)$'
        porque: |-
          Es vertical, y además apuntaría hacia arriba en todo el plano, porque
          $x^2\ge 0$.

