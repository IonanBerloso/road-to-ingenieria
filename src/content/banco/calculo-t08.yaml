    opciones:
      - texto: '$W=A$'
        correcta: true
        porque: |-
          Por Green, con $X=-y$ e $Y=0$:
          $\oint_C -y\,dx=\iint_D (Y_x-X_y)\,dx\,dy=\iint_D 1\,dx\,dy=A$. La
          flecha de la figura recorre $C$ en sentido antihorario, el positivo,
          así que el signo no cambia.
      - texto: '$W=2A$'
        porque: |-
          $2A$ sale con $Y_x-X_y=2$, que es el caso de $(-y,x)$. Para
          $(-y,0)$, $Y_x-X_y=0-(-1)=1$.
      - texto: '$W=A/2$'
        porque: |-
          Confunde $\oint -y\,dx$ con la fórmula del área,
          $A=\frac12\oint x\,dy-y\,dx$, que lleva el $\frac12$ porque suma dos
          integrales que valen $A$ cada una. $\oint -y\,dx$ sola ya es $A$.
      - texto: 'Para hacer el cálculo es necesario conocer una parametrización $(x(t),y(t))$ de $C$'
        porque: |-
          Green evita parametrizar: la circulación es la integral doble de
          $Y_x-X_y$ sobre la región que encierra $C$, y aquí vale $1$. Basta
          el área.

  - id: circulacion-de-0-x-en-una-curva-cerrada
    bloque: '8.5'
    diapositiva: 27
    pregunta: |
      Considerar el campo vectorial $V(x,y)=(0,x)$ y una trayectoria cerrada y
      suave $C$ que encierra un área $A$ (ver figura). Calcular el valor del
      trabajo $W$ realizado por $V$ al trasladar una partícula a lo largo de
      $C$.
    figura: |
      <svg viewBox="0 0 340 265" role="img" width="340" height="265"
           aria-labelledby="cq8-green-v-t cq8-green-v-d">
        <title id="cq8-green-v-t">El campo V = (0, x) y una curva cerrada recorrida en sentido antihorario</title>
        <desc id="cq8-green-v-d">Una malla de flechas: todas verticales, hacia arriba a la derecha del eje y y hacia abajo a la izquierda, más largas cuanto más lejos del eje. Encima, una curva cerrada suave con forma de judía, con una muesca arriba, que rodea el origen. La región que encierra está sombreada, y una flecha en su borde de arriba, a la izquierda, apunta hacia la izquierda: la curva se recorre en sentido antihorario.</desc>
