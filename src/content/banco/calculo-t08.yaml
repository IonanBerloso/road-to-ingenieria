    opciones:
      - texto: '$W_C=90$'
        porque: |-
          Tiene el signo de un recorrido antihorario, y las flechas de $C$ van
          en sentido horario. Además $90$ sería tres veces el área, y
          $Y_x-X_y$ vale $2$.
      - texto: '$W_C=-50$'
        porque: |-
          El signo está bien, pero $50$ sería el doble del área de un cuadrado
          de lado $5$. El rectángulo va de $x=1$ a $x=7$ y de $y=2$ a $y=7$:
          seis por cinco, $30$.
      - texto: '$W_C=-60$'
        correcta: true
        porque: |-
          Por Green, en sentido antihorario
          $\oint_C=\iint_D (Y_x-X_y)\,dx\,dy=\iint_D 2\,dx\,dy=2\cdot 30=60$,
          con $D$ el rectángulo de $6$ por $5$. Las flechas recorren $C$ en
          sentido horario, así que $W=-60$.
      - texto: '$W_C=-40$'
        porque: |-
          Sería el doble de un área de $20$. Con $Y_x-X_y=1-(-1)=2$ y el
          rectángulo de $6$ por $5$, la circulación vale $60$ en valor
          absoluto.

  - id: curva-que-sigue-un-campo-de-modulo-k
    bloque: '8.2'
    diapositiva: 14
    pregunta: |
      Considerar el campo vectorial $V(x,y)=(X(x,y),Y(x,y))$ y la curva
      $C=(x(t),y(t))$, $t\in[\alpha,\beta]$, que cumplen las siguientes
      propiedades:

      $$
      \lVert V\rVert=k>0,\quad x'(t)=X(x(t),y(t)),\quad y'(t)=Y(x(t),y(t))
      $$

      Calcular $\int_C X(x,y)\,dx+Y(x,y)\,dy$
    opciones:
      - texto: '$0$'
        porque: |-
          Sería el caso de una curva perpendicular al campo. Aquí la curva va
          con el campo: su velocidad es $V$, y el integrando
          $Xx'+Yy'=X^2+Y^2=k^2$ es positivo.
      - texto: '$k$'
        porque: |-
          Olvida dos cosas: que el integrando es $\lVert V\rVert^2=k^2$, no
          $k$, y que se integra en $t$ de $\alpha$ a $\beta$.
      - texto: '$k^2(\beta-\alpha)$'
        correcta: true
        porque: |-
          Como $x'=X$ e $y'=Y$ sobre la curva,
          $\int_C X\,dx+Y\,dy=\int_\alpha^\beta (X^2+Y^2)\,dt=\int_\alpha^\beta k^2\,dt=k^2(\beta-\alpha)$.
      - texto: '$k^3(\beta+\alpha)$'
        porque: |-
          Fallan el exponente y el intervalo: el integrando es $X^2+Y^2=k^2$,
          y una constante integrada en $[\alpha,\beta]$ da la constante por
          $\beta-\alpha$, no por $\beta+\alpha$.

  - id: curva-que-sigue-el-campo-y-el-campo-girado
    bloque: '8.2'
    diapositiva: 15
    pregunta: |
      Considerar el campo vectorial $V(x,y)=(X(x,y),Y(x,y))$ y la curva
      $C=(x(t),y(t))$, $t\in[\alpha,\beta]$, que cumple las siguientes
      propiedades:

      $$
      x'(t)=X(x(t),y(t)),\quad y'(t)=Y(x(t),y(t))
      $$

      Entonces el valor $\int_C -Y(x,y)\,dx+X(x,y)\,dy$ es…
    opciones:
      - texto: '$>0$'
        porque: |-
          $(-Y,X)$ es $V$ girado un cuarto de vuelta, perpendicular a $V$ en
          cada punto, y la curva avanza siguiendo $V$: el integrando
          $-Yx'+Xy'=-YX+XY$ es cero en cada instante.
      - texto: '$=0$'
        correcta: true
        porque: |-
          Sobre la curva $x'=X$ e $y'=Y$, así que
          $\int_C -Y\,dx+X\,dy=\int_\alpha^\beta(-YX+XY)\,dt=0$: el campo
          girado es perpendicular al camino en todos sus puntos.
      - texto: '$<0$'
        porque: |-
          El integrando no tiene signo: es $-YX+XY$, idénticamente cero, porque
          la curva va con $V$ y $(-Y,X)$ es perpendicular a $V$.

  - id: trabajo-de-un-campo-constante
    bloque: '8.3'
    diapositiva: 16
    pregunta: |
      Supongamos que $V$ es un campo vectorial constante. Calcular el trabajo
      $W$ realizado por $V$ al trasladar una partícula siguiendo una
      trayectoria recta desde un punto $P$ hasta un punto $Q$.
    opciones:
      - texto: '$W=\lvert V\rvert\,\lvert PQ\rvert$'
        porque: |-
          Solo vale cuando $V$ es paralelo a $PQ$ y del mismo sentido. En
          general el trabajo recoge la componente de $V$ en la dirección del
          desplazamiento: $\lvert V\rvert\,\lvert PQ\rvert\cos\theta$.
      - texto: '$W=V\,\lvert PQ\rvert$'
        porque: |-
          $V$ por un número es un vector, y el trabajo es un escalar.
      - texto: '$W=\lvert V\rvert\,PQ$'
        porque: |-
          También es un vector: el $PQ$ estirado por $\lvert V\rvert$. Y no
          tiene en cuenta el ángulo entre el campo y el desplazamiento.
      - texto: '$W=V\bullet PQ$'
        correcta: true
        porque: |-
          Con $r(t)=P+t\,PQ$, $t\in[0,1]$, es $dr=PQ\,dt$, y como $V$ no
          cambia, $W=\int_0^1 V\bullet PQ\,dt=V\bullet PQ$.

  # La C es la buena con la hipótesis de siempre en el tema, que la
  # diapositiva no escribe: V de clase C¹ en un dominio sin agujeros. Con
  # V = (−y, x)/(x² + y²) alrededor del origen falla, y el porqué lo dice.
  - id: circulacion-en-una-curva-cerrada
    bloque: '8.4'
    diapositiva: 17
    pregunta: |
      Considerar el campo vectorial $V(x,y)=(X(x,y),Y(x,y))$. Considerar una
      curva cerrada $C$. ¿Cuál de las siguientes afirmaciones es cierta?
    opciones:
      - texto: 'Si $\oint_C X(x,y)\,dx+Y(x,y)\,dy=0$ entonces $V$ es conservativo'
        porque: |-
          Que la circulación sea cero en una curva cerrada no basta: un campo
          conservativo la tiene nula en todas. $V=(0,x^2)$ no es conservativo,
          porque $Y_x-X_y=2x$, y en la circunferencia unidad da
          $\iint 2x\,dx\,dy=0$ por simetría.
      - texto: 'Si $X_x=Y_y$ entonces $\oint_C X(x,y)\,dx+Y(x,y)\,dy=0$'
        porque: |-
          $X_x=Y_y$ no es la condición. $V=(-y,x)$ la cumple, porque las dos
          valen $0$, y en la circunferencia unidad recorrida en sentido
          antihorario da $2\pi$.
      - texto: 'Si $X_y=Y_x$ entonces $\oint_C X(x,y)\,dx+Y(x,y)\,dy=0$'
        correcta: true
        porque: |-
          $X_y=Y_x$ es la condición de campo conservativo, con la hipótesis de
          siempre en el tema: $V$ de clase $C^1$ en un dominio sin agujeros.
          Entonces, por Green, $\oint_C=\iint (Y_x-X_y)\,dx\,dy=0$. Sin esa
          hipótesis falla: $\frac{(-y,x)}{x^2+y^2}$ cumple $X_y=Y_x$ fuera del
          origen y da $2\pi$ alrededor de él.
      - texto: '$\oint_C X(x,y)\,dx+Y(x,y)\,dy=0$'
        porque: |-
          Falla para muchos campos: $V=(-y,x)$ da $2\pi$ en la circunferencia
          unidad recorrida en sentido antihorario.

