    opciones:
      - texto: '$0$'
        porque: |-
          Sería cero si $M$ y $N$ estuvieran en la misma curva de nivel, o si
          $C$ fuera cerrada. $M$ está en la de nivel $5$ y $N$, en la de $17$.
      - texto: '$12$'
        correcta: true
        porque: |-
          $F_x\,dx+F_y\,dy$ es la diferencial de $F$, así que la integral solo
          depende de los extremos: $F(N)-F(M)=17-5=12$, dé $C$ las vueltas que
          dé.
      - texto: '$-8$'
        porque: |-
          $-8$ no sale de los extremos de $C$: $F(N)-F(M)=17-5=12$, y con el
          sentido cambiado sería $-12$.
      - texto: '$17$'
        porque: |-
          Es $F(N)$, el valor en el punto final, sin restarle el del inicial,
          $F(M)=5$.

  - id: curvas-de-nivel-y-fragmento-de-nivel
    bloque: '8.4'
    diapositiva: 23
    pregunta: |
      Sea $F(x,y)$ una función con derivadas parciales continuas. Considerar:

      - Las curvas de nivel de $F(x,y)$ que muestra la figura.
      - El fragmento $C$ de curva de nivel entre los puntos $M$ y $N$.

      Calcular el valor de $\int_C F_x(x,y)\,dx+F_y(x,y)\,dy$
    figura: |
      <svg viewBox="0 0 340 265" role="img" width="340" height="265"
           aria-labelledby="cq8-niveles-fragmento-t cq8-niveles-fragmento-d">
        <title id="cq8-niveles-fragmento-t">Curvas de nivel de F y un trozo de una de ellas, de M a N</title>
        <desc id="cq8-niveles-fragmento-d">Unas curvas de nivel cerradas y anidadas, con forma de judía, rotuladas de dentro afuera con sus valores: dos, cinco, ocho, once y catorce. Los puntos M y N están los dos sobre la curva de nivel cinco: M abajo a la derecha y N a la izquierda. La trayectoria C es el trozo de esa misma curva que va de M a N por arriba, pasando por la muesca de la judía.</desc>
