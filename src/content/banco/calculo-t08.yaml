    opciones:
      - texto: '$W_C\approx 60$'
        porque: |-
          Solo el último tramo, de $(4,6)$ a $(10,6)$, ya da
          $\int_4^{10}(x+6)\,dx=78$, y el primero suma otros $24$: el total no
          puede quedarse en $60$.
      - texto: '$W_C\approx 180$'
        porque: |-
          Casi dobla el valor. $V$ es el gradiente de
          $\varphi=\frac{x^2}{2}+xy-\frac{y^2}{2}$, y el trabajo es
          $\varphi(10,6)-\varphi(0,4)=92-(-8)=100$.
      - texto: '$W_C\approx 100$'
        correcta: true
        porque: |-
          $V=\nabla\varphi$ con $\varphi=\frac{x^2}{2}+xy-\frac{y^2}{2}$, así
          que solo importan los extremos, $(0,4)$ y $(10,6)$:
          $W=92-(-8)=100$. Por tramos sale igual: $24$ en el primero, $-2$ en
          el vertical y $78$ en el último.
      - texto: '$W_C\approx 150$'
        porque: |-
          Por tramos: $24$ en el primer horizontal, $-2$ en el vertical, donde
          el campo empuja contra la subida, y $78$ en el último. Son $100$.

  - id: trabajo-en-un-rectangulo
    bloque: '8.2'
    diapositiva: 13
    pregunta: |
      La figura muestra el campo $V(x,y)=(x-y,x+y)$, con los vectores
      dibujados con el mismo módulo, y la trayectoria $C$. Calcular el trabajo
      realizado por $V$ al trasladar una partícula a lo largo de $C$.
