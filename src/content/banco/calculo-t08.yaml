    opciones:
      - texto: '$W_{C_1}<W_{C_2}<W_{C_3}$'
        correcta: true
        porque: |-
          $W_{C_1}=0$: $C_1$ sale del origen por un radio, y $V=(-y,x)$ es
          perpendicular a $(x,y)$. En $C_2$, con $x=1$,
          $W_{C_2}=\int_{-1}^{1}1\,dy=2$. En $C_3$, arco de radio $\sqrt2$
          recorrido en sentido antihorario, $V$ es tangente y mide $\sqrt2$:
          $W_{C_3}=\sqrt2\cdot\sqrt2\,\frac{\pi}{2}=\pi$. Y $0<2<\pi$.
      - texto: '$W_{C_1}<W_{C_3}<W_{C_2}$'
        porque: |-
          Pone el arco por debajo del segmento vertical. Unen los mismos
          puntos, pero $V$ no es conservativo, y en el arco va siempre tangente
          con módulo $\sqrt2$: $W_{C_3}=\pi$, más que los $2$ de $C_2$.
      - texto: '$W_{C_2}<W_{C_1}<W_{C_3}$'
        porque: |-
          Pone $W_{C_1}$ por encima de $W_{C_2}$, y $W_{C_1}=0$: a lo largo de
          $C_1$, que sale radialmente del origen, $V$ es perpendicular al
          camino.
      - texto: '$W_{C_2}<W_{C_3}<W_{C_1}$'
        porque: |-
          $W_{C_1}$ es el menor, no el mayor: vale $0$, porque $C_1$ va por un
          radio y $V=(-y,x)$ es perpendicular al radio.
      - texto: '$W_{C_3}<W_{C_2}<W_{C_1}$'
        porque: |-
          Es el orden al revés: $W_{C_3}=\pi$, $W_{C_2}=2$ y $W_{C_1}=0$.
      - texto: '$W_{C_3}<W_{C_1}<W_{C_2}$'
        porque: |-
          Pone $W_{C_3}$ como el menor, y es el mayor: en el arco $V$ va
          siempre en el sentido del movimiento, con módulo $\sqrt2$, y da
          $\pi$.

  - id: trabajo-aproximado-en-una-escalera
    bloque: '8.1'
    diapositiva: 12
    pregunta: |
      Considerar el campo $V(x,y)=(x+y,x-y)$, que en la figura se muestra con
      los vectores con el mismo módulo. Considerar también la trayectoria $C$.
      ¿Cuál de los siguientes valores es el que más se aproxima al valor $W$
      del trabajo realizado por $V$ a lo largo de $C$?
    figura: |
      <svg viewBox="0 0 340 265" role="img" width="340" height="265"
           aria-labelledby="cq8-escalera-t cq8-escalera-d">
        <title id="cq8-escalera-t">El campo (x + y, x − y) con todas las flechas del mismo largo y una trayectoria en escalera</title>
        <desc id="cq8-escalera-d">Una malla de flechas del mismo largo en el primer cuadrante: abajo a la derecha apuntan hacia arriba a la derecha y arriba a la izquierda, hacia abajo a la derecha. Encima, la trayectoria C, en tres tramos rectos: del punto cero, cuatro va hacia la derecha hasta el cuatro, cuatro; sube hasta el cuatro, seis, y sigue hacia la derecha hasta el diez, seis.</desc>
        <style>
            .cq8-escalera-eje { stroke: var(--rule); stroke-width: 1.1; fill: none; }
            .cq8-escalera-c { stroke: var(--d1); stroke-width: 2.8; fill: none; }
            .cq8-escalera-c2 { stroke: var(--alt); stroke-width: 2.8; fill: none; }
            .cq8-escalera-cp { stroke: var(--d1); stroke-width: 2.4; fill: none; stroke-dasharray: 6 4; }
            .cq8-escalera-cp2 { stroke: var(--alt); stroke-width: 2.4; fill: none; stroke-dasharray: 6 4; }
            .cq8-escalera-g { stroke: var(--faint); stroke-width: 1.1; fill: none; stroke-dasharray: 3 3; }
            .cq8-escalera-fue { stroke: var(--faint); stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
            .cq8-escalera-f { fill: var(--live); fill-opacity: .12; stroke: none; }
            .cq8-escalera-f2 { fill: var(--alt); fill-opacity: .12; stroke: none; }
            .cq8-escalera-pt { fill: var(--live); }
            .cq8-escalera-punta { fill: var(--live); stroke: none; }
            .cq8-escalera-hueco { fill: var(--paper); stroke: var(--live); stroke-width: 2; }
