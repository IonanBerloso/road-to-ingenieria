    opciones:
      - texto: '$V(x,y)=(0,\ y(y-1))$'
        porque: |-
          El signo cambia donde toca, en $y=0$ y en $y=1$, pero va en la
          segunda componente: sería un campo vertical, y el de la figura es
          horizontal.
      - texto: '$V(x,y)=(0,\ x(x-1))$'
        porque: |-
          Es vertical y depende de $x$: cambiaría de una columna a otra. En la
          figura cambia de una fila a otra.
      - texto: '$V(x,y)=(x(x-1),0)$'
        porque: |-
          Es horizontal, pero depende de $x$: cambiaría de sentido entre las
          columnas $x=0$ y $x=1$, y en la figura cada fila tiene todas sus
          flechas iguales.
      - texto: '$V(x,y)=(y(y-1),0)$'
        correcta: true
        porque: |-
          Horizontal y constante en cada fila, porque solo depende de $y$.
          $y(y-1)$ es negativo para $0<y<1$, donde las flechas van hacia la
          izquierda, y positivo por encima de $y=1$ y por debajo de $y=0$,
          donde van hacia la derecha.

  - id: campo-diagonal-constante-por-filas
    bloque: '8.1'
    diapositiva: 5
    pregunta: |
      La figura muestra un campo vectorial $V(x,y)$. Sea $h(t)$ una función.
      ¿Cuál de las expresiones $V(x,y)$ corresponde al campo?
    figura: |
      <svg viewBox="0 0 340 265" role="img" width="340" height="265"
