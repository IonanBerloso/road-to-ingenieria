    opciones:
      - texto: '$F(x,y)=x^2$'
        porque: |-
          Su gradiente es $(2x,0)$: se aleja del eje $y$, hacia la derecha para
          $x>0$ y hacia la izquierda para $x<0$. Es justo el sentido contrario
          al de la figura.
      - texto: '$F(x,y)=-x^2$'
        correcta: true
        porque: |-
          $\nabla(-x^2)=(-2x,0)$: horizontal, hacia el eje $y$ desde los dos
          lados y más largo cuanto más lejos, como en la figura. El gradiente
          apunta hacia donde $F$ crece, y $-x^2$ tiene su máximo en el eje $y$.
      - texto: '$F(x,y)=-2x$'
        porque: |-
          Su gradiente es $(-2,0)$, constante: todas las flechas iguales y
          hacia la izquierda. $-2x$ es la primera componente del gradiente
          bueno, no la función.
      - texto: '$F(x,y)=y^2$'
        porque: |-
          Su gradiente es $(0,2y)$, vertical, y las flechas de la figura son
          horizontales.

  - id: ordenar-tres-trabajos-en-un-giro
    bloque: '8.1'
    diapositiva: 11
    pregunta: |
      Considerar el campo $V(x,y)=(-y,x)$, que en la figura se muestra con los
      vectores con el mismo módulo. Considerar también las tres trayectorias
      $C_1$, $C_2$ y $C_3$. Ordenar los valores del trabajo $W$ efectuado por
      $V$ a lo largo de cada una de ellas.
    figura: |
      <svg viewBox="0 0 340 265" role="img" width="340" height="265"
           aria-labelledby="cq8-giro-tres-caminos-t cq8-giro-tres-caminos-d">
        <title id="cq8-giro-tres-caminos-t">El campo (−y, x) con todas las flechas del mismo largo y tres caminos</title>
        <desc id="cq8-giro-tres-caminos-d">Una malla de flechas del mismo largo que giran alrededor del origen en sentido antihorario. Encima, tres caminos. C₁ es el segmento que sale del origen hasta el punto uno, uno. C₂ es el segmento vertical x igual a uno, recorrido hacia arriba desde y igual a menos uno hasta y igual a uno. C₃ es el arco de la circunferencia de radio raíz de dos centrada en el origen que une esos mismos dos puntos por la derecha, recorrido hacia arriba.</desc>
