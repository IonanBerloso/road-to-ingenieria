    opciones:
      - texto: Es conservativo
        correcta: true
        porque: |-
          Todas las flechas son horizontales y su largo solo depende de $x$:
          $V=(f(x),0)$. Es el gradiente de una primitiva $F$ de $f$, y en
          efecto $X_y=0=Y_x$.
      - texto: No es conservativo
        porque: |-
          Que las flechas crezcan de una columna a otra no rompe nada. A lo
          largo de una vertical el campo no cambia, así que $X_y=0$, y $Y=0$ da
          $Y_x=0$: las derivadas cruzadas coinciden.
      - texto: No puede saberse
        porque: |-
          La figura da la forma del campo, $V=(f(x),0)$, y cualquier campo así
          es el gradiente de una primitiva de $f$.

