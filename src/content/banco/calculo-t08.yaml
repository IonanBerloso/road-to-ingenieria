    opciones:
      - texto: '$V(x,y)=(x,0)$'
        porque: |-
          Es horizontal: tiene nula la segunda componente, así que sus flechas
          irían a la derecha para $x>0$ y a la izquierda para $x<0$. Las de la
          figura son verticales.
      - texto: '$V(x,y)=(y,0)$'
        porque: |-
          También es horizontal, y en el semiplano superior de la figura todas
          sus flechas irían hacia la derecha, más largas cuanto más arriba.
      - texto: '$V(x,y)=(0,x)$'
        correcta: true
        porque: |-
          Es vertical, y la segunda componente es $x$: hacia arriba a la
          derecha del eje $y$, hacia abajo a la izquierda, y más larga cuanto
          más lejos del eje. No depende de $y$, así que cada columna tiene
          todas sus flechas iguales, como en la figura.
      - texto: '$V(x,y)=(0,y)$'
        porque: |-
          Es vertical, pero su sentido lo decide $y$: en el semiplano superior,
          que es el que se ve, todas sus flechas apuntarían hacia arriba y
          crecerían con la altura. En la figura cambian de sentido al cruzar el
          eje $y$.

  - id: campo-vertical-que-crece-deprisa
    bloque: '8.1'
    diapositiva: 2
    pregunta: |
      La figura muestra un campo vectorial $V(x,y)$. ¿Cuál de las expresiones
      $V(x,y)$ le corresponde?
