    opciones:
      - texto: '$V(x,y)=(h(x),-h(x))$'
        porque: |-
          Tiene la dirección buena, la de $(1,-1)$, pero depende de $x$: cada
          columna tendría todas sus flechas iguales. En la figura lo que se
          repite son las filas.
      - texto: '$V(x,y)=(h(x),h(x))$'
        porque: |-
          Es paralelo a $(1,1)$, la otra diagonal, y además depende de $x$, así
          que cambiaría a lo largo de cada fila.
      - texto: '$V(x,y)=(h(y),-h(y))$'
        correcta: true
        porque: |-
          Es $h(y)\,(1,-1)$: siempre paralelo a la diagonal $(1,-1)$ e igual a
          lo largo de cada fila, porque solo depende de $y$. Donde $h(y)>0$
          apunta abajo a la derecha y donde $h(y)<0$, arriba a la izquierda: en
          la figura $h$ tiene el signo de $y$, como $h(t)=t$.
      - texto: '$V(x,y)=(h(y),h(y))$'
        porque: |-
          Depende de $y$, que está bien, pero es paralelo a $(1,1)$: apuntaría
          arriba a la derecha o abajo a la izquierda, y las flechas de la
          figura siguen la otra diagonal.

  - id: asociar-tres-campos-con-su-expresion
    bloque: '8.1'
    diapositiva: 6
    pregunta: |
      Asociar cada uno de los gráficos de campo vectorial con su expresión
      analítica

      $$
      U(x,y)=\left(\frac{x}{\sqrt{x^2+y^2}},\frac{y}{\sqrt{x^2+y^2}}\right),\quad V(x,y)=(x,y),\quad W(x,y)=(y,-x)
      $$
    figura: |
      <svg viewBox="0 0 462 166" role="img" width="462" height="166"
           aria-labelledby="cq8-tres-campos-t cq8-tres-campos-d">
        <title id="cq8-tres-campos-t">Tres campos vectoriales alrededor del origen</title>
        <desc id="cq8-tres-campos-d">Tres recuadros con una malla de flechas cada uno. En el (1), las flechas salen del origen en todas direcciones y son más largas cuanto más lejos de él; junto al origen se quedan en la punta. En el (2), también salen del origen, pero todas miden lo mismo. En el (3), las flechas giran alrededor del origen en sentido horario: arriba apuntan a la derecha y a la derecha, hacia abajo; son más largas cuanto más lejos del origen.</desc>
