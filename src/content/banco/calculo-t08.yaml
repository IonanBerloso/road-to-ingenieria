    opciones:
      - texto: '$W=A$'
        correcta: true
        porque: |-
          Por Green, con $X=0$ e $Y=x$:
          $\oint_C x\,dy=\iint_D (Y_x-X_y)\,dx\,dy=\iint_D 1\,dx\,dy=A$, con
          $C$ recorrida en sentido antihorario, como indica la flecha.
      - texto: '$W=2A$'
        porque: |-
          $2A$ sale con $Y_x-X_y=2$, que es el caso de $(-y,x)$. Para $(0,x)$,
          $Y_x-X_y=1-0=1$.
      - texto: '$W=A/2$'
        porque: |-
          Confunde $\oint x\,dy$ con la fórmula del área,
          $A=\frac12\oint x\,dy-y\,dx$, que lleva el $\frac12$ porque suma dos
          integrales que valen $A$ cada una. $\oint x\,dy$ sola ya es $A$.
      - texto: 'Para hacer el cálculo es necesario conocer una parametrización $(x(t),y(t))$ de $C$'
        porque: |-
          Green evita parametrizar: la circulación es la integral doble de
          $Y_x-X_y=1$ sobre la región que encierra $C$, es decir, su área.

  - id: circulacion-de-menos-y-x-en-una-curva-cerrada
    bloque: '8.5'
    diapositiva: 28
    pregunta: |
      Considerar el campo vectorial $S(x,y)=(-y,x)$ y una trayectoria cerrada
      y suave $C$ que encierra un área $A$ (ver figura). Calcular el valor del
      trabajo $W$ realizado por $S$ al trasladar una partícula a lo largo de
      $C$.
    figura: |
      <svg viewBox="0 0 340 265" role="img" width="340" height="265"
           aria-labelledby="cq8-green-s-t cq8-green-s-d">
        <title id="cq8-green-s-t">El campo S = (−y, x) y una curva cerrada recorrida en sentido antihorario</title>
        <desc id="cq8-green-s-d">Una malla de flechas: giran alrededor del origen en sentido antihorario y son más largas cuanto más lejos de él. Encima, una curva cerrada suave con forma de judía, con una muesca arriba, que rodea el origen. La región que encierra está sombreada, y una flecha en su borde de arriba, a la izquierda, apunta hacia la izquierda: la curva se recorre en sentido antihorario.</desc>
