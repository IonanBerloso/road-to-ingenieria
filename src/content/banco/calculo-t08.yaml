    opciones:
      - texto: 'Es positivo para $C_1$.'
        porque: |-
          $C_1$ es horizontal y $U$, y por tanto $V$, es vertical en todos sus
          puntos: $V\cdot dr=0$ a lo largo de toda la trayectoria y el trabajo
          es cero.
      - texto: 'Es negativo para $C_2$.'
        porque: |-
          $C_2$ baja por el semiplano inferior, donde $V$ también apunta hacia
          abajo: el campo empuja a favor del movimiento y el trabajo es
          positivo.
      - texto: 'Puede ser 0 para $C_3$.'
        correcta: true
        porque: |-
          $C_3$ sube: por debajo del eje $x$ va contra $V$, que apunta hacia
          abajo, y ese tramo da trabajo negativo; por encima va a favor. La
          figura solo da la dirección de $V$, no su módulo, así que los dos
          tramos pueden compensarse: puede ser $0$, o de cualquier signo.
      - texto: 'Es negativo para $C_4$.'
        porque: |-
          $C_4$ sube por el semiplano superior, donde $V$ apunta hacia arriba:
          va a favor del campo y el trabajo es positivo.
      - texto: 'Es positivo para $C_5$.'
        porque: |-
          $C_5$ sube por el semiplano inferior, contra $V$, que allí apunta
          hacia abajo: el trabajo es negativo.

  - id: tres-segmentos-paralelos-en-x-y
    bloque: '8.1'
    diapositiva: 9
    pregunta: |
      Considerar el campo vectorial $V(x,y)=(x,y)$. La figura muestra los
      vectores con el mismo módulo y tres trayectorias rectas y paralelas,
      todas de igual longitud. ¿A lo largo de qué trayectoria el trabajo
      efectuado por $V$ es mayor?
    figura: |
      <svg viewBox="0 0 340 265" role="img" width="340" height="265"
           aria-labelledby="cq8-tres-segmentos-t cq8-tres-segmentos-d">
        <title id="cq8-tres-segmentos-t">El campo (x, y) con todas las flechas del mismo largo y tres segmentos paralelos</title>
        <desc id="cq8-tres-segmentos-d">Una malla de flechas del mismo largo que apuntan en dirección contraria al origen. Encima, tres segmentos paralelos de la misma longitud, los tres en la dirección de la diagonal y recorridos hacia arriba a la derecha. C₁ va del punto uno, cero coma dos al tres, dos coma dos. C₂, del uno, dos al tres, cuatro. C₃, del cinco, tres coma dos al siete, cinco coma dos: es el más alejado del origen.</desc>
        <style>
            .cq8-tres-segmentos-eje { stroke: var(--rule); stroke-width: 1.1; fill: none; }
            .cq8-tres-segmentos-c { stroke: var(--d1); stroke-width: 2.8; fill: none; }
            .cq8-tres-segmentos-c2 { stroke: var(--alt); stroke-width: 2.8; fill: none; }
            .cq8-tres-segmentos-cp { stroke: var(--d1); stroke-width: 2.4; fill: none; stroke-dasharray: 6 4; }
            .cq8-tres-segmentos-cp2 { stroke: var(--alt); stroke-width: 2.4; fill: none; stroke-dasharray: 6 4; }
            .cq8-tres-segmentos-g { stroke: var(--faint); stroke-width: 1.1; fill: none; stroke-dasharray: 3 3; }
            .cq8-tres-segmentos-fue { stroke: var(--faint); stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
            .cq8-tres-segmentos-f { fill: var(--live); fill-opacity: .12; stroke: none; }
            .cq8-tres-segmentos-f2 { fill: var(--alt); fill-opacity: .12; stroke: none; }
            .cq8-tres-segmentos-pt { fill: var(--live); }
            .cq8-tres-segmentos-punta { fill: var(--live); stroke: none; }
            .cq8-tres-segmentos-hueco { fill: var(--paper); stroke: var(--live); stroke-width: 2; }
            .cq8-tres-segmentos-o { fill: var(--flag); }
            .cq8-tres-segmentos-n { fill: var(--faint); font-size: 10px; font-family: var(--mono); paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
            .cq8-tres-segmentos-l { font-size: 10.5px; font-family: var(--mono); font-weight: 700; paint-order: stroke; stroke: var(--paper); stroke-width: 3.4px; stroke-linejoin: round; }
            .cq8-tres-segmentos-v { stroke: var(--faint); stroke-width: 1.2; fill: none; }
            .cq8-tres-segmentos-vp { fill: var(--faint); stroke: none; }
            .cq8-tres-segmentos-c3 { stroke: var(--d2); stroke-width: 2.8; fill: none; }
            .cq8-tres-segmentos-pc { fill: var(--d1); stroke: none; }
            .cq8-tres-segmentos-pc2 { fill: var(--alt); stroke: none; }
            .cq8-tres-segmentos-pc3 { fill: var(--d2); stroke: none; }
            .cq8-tres-segmentos-nv { stroke: var(--graphite); stroke-width: 1.5; fill: none; }
        </style>
        <path class="cq8-tres-segmentos-v" d="M48.5 222.6L40.7 230.4"/>
