    opciones:
      - texto: '$W=A$'
        porque: |-
          Cada mitad de $S=(-y,x)$ da $A$: $\oint -y\,dx=A$ y $\oint x\,dy=A$.
          Juntas suman $2A$, porque $Y_x-X_y=1-(-1)=2$.
      - texto: '$W=2A$'
        correcta: true
        porque: |-
          Por Green,
          $\oint_C -y\,dx+x\,dy=\iint_D (Y_x-X_y)\,dx\,dy=\iint_D 2\,dx\,dy=2A$,
          con $C$ recorrida en sentido antihorario, como indica la flecha.
      - texto: '$W=A/2$'
        porque: |-
          Es la fórmula del área al revés: $A=\frac12\oint_C x\,dy-y\,dx$, así
          que la circulación de $S$ es el doble del área, no la mitad.
      - texto: 'Para hacer el cálculo es necesario conocer una parametrización $(x(t),y(t))$ de $C$'
        porque: |-
          Green evita parametrizar: la circulación de $S$ es la integral doble
          de $Y_x-X_y=2$ sobre la región, el doble de su área.

  - id: circulacion-con-dos-funciones-que-difieren-en-m
