    opciones:
      - texto: '$0$'
        correcta: true
        porque: |-
          $C$ es un trozo de curva de nivel: $F$ no cambia a lo largo de ella,
          y $M$ y $N$ están los dos en la de nivel $5$. La integral es
          $F(N)-F(M)=5-5=0$.
      - texto: '$5$'
        porque: |-
          $5$ es el valor de $F$ en $M$ y en $N$, no la integral, que es la
          diferencia entre los extremos: $5-5$.
      - texto: '$-5$'
        porque: |-
          Tampoco con el signo cambiado: entre dos puntos del mismo nivel la
          diferencia de $F$ es cero.
      - texto: '$7$'
        porque: |-
          Ni siquiera es la diferencia entre dos niveles de la figura, que van
          de tres en tres. Y $M$ y $N$ están en el mismo.

  - id: curvas-de-nivel-y-curva-orientada
    bloque: '8.4'
    diapositiva: 24
    pregunta: |
      Sea $F(x,y)$ una función con derivadas parciales continuas. Considerar:

      - Las curvas de nivel de $F(x,y)$ que muestra la figura.
      - La curva $C$ entre los puntos $M$ y $N$.

      Calcular el valor de $\int_C F_x(x,y)\,dx+F_y(x,y)\,dy$
    figura: |
      <svg viewBox="0 0 340 265" role="img" width="340" height="265"
           aria-labelledby="cq8-niveles-orientada-t cq8-niveles-orientada-d">
        <title id="cq8-niveles-orientada-t">Curvas de nivel de F y una curva orientada entre M y N</title>
        <desc id="cq8-niveles-orientada-d">Unas curvas de nivel cerradas y anidadas, con forma de judía, rotuladas de dentro afuera con sus valores: dos, cinco, ocho, once y catorce. El punto M está sobre la curva de nivel cinco, a la derecha, y el punto N sobre la de catorce, arriba a la derecha. La curva C sale de N, baja por fuera de la de once hasta abajo del todo y vuelve hacia dentro hasta M. La flecha, en el tramo que baja, dice que se recorre de N a M.</desc>
