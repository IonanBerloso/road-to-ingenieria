        <text class="cq8-dos-funciones-l" x="127.5" y="77" text-anchor="end" fill="var(--d1)">f(t)</text>
        <text class="cq8-dos-funciones-l" x="127.5" y="148.8" text-anchor="end" fill="var(--d1)">g(t)</text>
