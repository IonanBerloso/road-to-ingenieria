      </svg>
    opciones:
      - texto: '$0$'
        porque: |-
          Solo daría cero entre puntos del mismo nivel, y $M$ está en la curva
          de nivel $5$ y $N$, en la de $14$.
      - texto: '$-5$'
        porque: |-
          Es $-F(M)$, no la integral, que es el valor en el punto final menos
          el valor en el inicial: $5-14$.
      - texto: '$-9$'
        correcta: true
        porque: |-
          La flecha de $C$ va de $N$ a $M$: la integral de $\nabla F$ es
          $F(M)-F(N)=5-14=-9$.
      - texto: '$9$'
        porque: |-
          Es el salto entre los dos niveles, pero recorrido de $M$ a $N$. La
          flecha de la figura va de $N$ a $M$, y eso cambia el signo.

  # La diapositiva trae la superficie z = 1/xy con la curva dibujada encima.
  # No hace falta para contestar —la integral es 0 para cualquier curva
  # sobre esa superficie—, así que no se redibuja y el «(ver figura)» se
  # quita.
  - id: integral-sobre-la-superficie-xyz-igual-a-1
    bloque: '8.4'
    diapositiva: 25
    pregunta: |
      Sea $F(t)$ una función con derivada segunda continua y $C$ una curva
      suave en el espacio, situada sobre la superficie $z=1/xy$, que une los
      puntos $M$ y $N$. Entonces, el valor

      $$
      \int_C F'(xyz)\,(yz\,dx+xz\,dy+xy\,dz)
      $$

      es…
    opciones:
      - texto: '$0$'
        correcta: true
        porque: |-
          $yz\,dx+xz\,dy+xy\,dz$ es la diferencial de $xyz$, así que el
          integrando es $d\big[F(xyz)\big]$ y la integral vale $F(xyz)$ en $N$
          menos en $M$. Sobre la superficie $z=1/xy$ es $xyz=1$ en todos los
          puntos: $F(1)-F(1)=0$.
      - texto: '$>0$'
        porque: |-
          El resultado no depende del camino ni del sentido: es la diferencia
          de $F(xyz)$ entre los extremos, y en los dos $xyz=1$.
      - texto: '$<0$'
        porque: |-
          Por lo mismo: la integral es $F(xyz)$ en $N$ menos en $M$, y $xyz$
          vale $1$ en los dos, porque están sobre $z=1/xy$.
      - texto: No se tiene suficiente información
        porque: |-
          Hacen falta solo dos cosas, y las da el enunciado: que el integrando
          es la diferencial de $F(xyz)$ y que en toda la superficie $xyz=1$. Da
          igual cómo sea $F$ y por dónde vaya $C$.

  - id: circulacion-de-menos-y-0-en-una-curva-cerrada
    bloque: '8.5'
    diapositiva: 26
    pregunta: |
      Considerar el campo vectorial $U(x,y)=(-y,0)$ y una trayectoria cerrada
      y suave $C$ que encierra un área $A$ (ver figura). Calcular el valor del
      trabajo $W$ realizado por $U$ al trasladar una partícula a lo largo de
      $C$.
    figura: |
      <svg viewBox="0 0 340 265" role="img" width="340" height="265"
           aria-labelledby="cq8-green-u-t cq8-green-u-d">
        <title id="cq8-green-u-t">El campo U = (−y, 0) y una curva cerrada recorrida en sentido antihorario</title>
        <desc id="cq8-green-u-d">Una malla de flechas: todas horizontales, hacia la izquierda por encima del eje x y hacia la derecha por debajo, más largas cuanto más lejos del eje. Encima, una curva cerrada suave con forma de judía, con una muesca arriba, que rodea el origen. La región que encierra está sombreada, y una flecha en su borde de arriba, a la izquierda, apunta hacia la izquierda: la curva se recorre en sentido antihorario.</desc>
        <style>
