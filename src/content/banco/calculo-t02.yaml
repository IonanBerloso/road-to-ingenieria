asignatura: calculo
tema: t02-sucesiones
titulo: Las cuestiones de las diapositivas del tema 2
fuente: >-
  Las diapositivas de clase del tema 2 de Cálculo, «Sucesiones y series
  numéricas» (UPV/EHU): veinte preguntas tipo test para las cuestiones en
  grupo y para el oral de la final y de la extraordinaria. Las diapositivas no
  traen la solución: la respuesta y el porqué de cada opción son de este sitio.
diapositivas: 20
bloques:
  - { id: '2.3', titulo: Cotas superior e inferior }
  - { id: '2.4', titulo: El concepto de límite }
  - { id: '2.5', titulo: Suma y producto convergentes }
  - { id: '2.7', titulo: Convergencia monótona }
  - { id: '2.8.2', titulo: El teorema del punto fijo }
  - { id: '2.8.3', titulo: Series }
preguntas:
  - id: cotas-de-2-mas-1-entre-n
    bloque: '2.3'
    diapositiva: 1
    pregunta: |
      Considerar la sucesión definida por:

      $\{a_n\}_{n\in\mathbb{N}}\ /\ a_n=2+\dfrac{1}{n},\ n=1,2,3,4\ldots$

      ¿Cuál de las siguientes afirmaciones es cierta?
    opciones:
      - texto: 'El valor $p=2{,}000001$ es una cota inferior de la sucesión'
        porque: |-
          Una cota inferior tiene que quedar por debajo de todos los términos,
          y $a_n=2+\frac{1}{n}$ baja de $2{,}000001$ en cuanto
          $\frac{1}{n}<10^{-6}$, es decir, para $n>10^{6}$. Los términos se
          acercan a $2$ tanto como se quiera.
      - texto: 'El valor $p=2+10^{-20}$ es una cota inferior de la sucesión'
        porque: |-
          Es el mismo error con un número todavía más pegado a $2$: para
          $n>10^{20}$, $a_n=2+\frac{1}{n}<2+10^{-20}$. Por muy poco que $p$
          pase de $2$, algún término queda por debajo.
      - texto: 'Existe un número $q<3$ que es una cota superior de la sucesión'
        porque: |-
          El primer término es $a_1=2+1=3$, y una cota superior no puede
          quedar por debajo de ningún término. Las cotas superiores son los
          $q\ge 3$: el supremo es $3$, y se alcanza.
      - texto: 'Ningún número $p>2$ puede ser cota inferior de la sucesión'
        correcta: true
        porque: |-
          $a_n=2+\frac{1}{n}$ decrece hacia $2$ sin llegar: dado cualquier
          $p>2$, para $n>\frac{1}{p-2}$ se tiene $a_n<p$, y $p$ deja de ser
          cota. El ínfimo es $2$, la mayor de las cotas inferiores, y no se
          alcanza.

  - id: acotada-inferiormente
    bloque: '2.3'
    diapositiva: 2
    pregunta: |
      Considerar la sucesión definida por:

      $\{a_n\}_{n\in\mathbb{N}}\ /\ a_n=\begin{cases}4-\dfrac{1}{n} & \text{si } n \text{ es par}\\ n^2 & \text{si } n \text{ es impar}\end{cases}$

      ¿Cuál de las siguientes afirmaciones es cierta?
    opciones:
      - texto: La sucesión está acotada superiormente
        porque: |-
          Los términos impares, $n^2$, crecen sin límite: $1, 9, 25, 49\ldots$
          Ningún número queda por encima de todos, así que no tiene cota
          superior.
      - texto: La sucesión está acotada inferiormente
        correcta: true
        porque: |-
          Los pares valen $4-\frac{1}{n}\ge\frac{7}{2}$ y los impares
          $n^2\ge 1$, así que ningún término baja de $1$, que es $a_1$: $1$ es
          cota inferior, y además el mínimo.
      - texto: La sucesión es en parte acotada y en parte no acotada
        porque: |-
          Estar acotada es una propiedad de la sucesión entera, no de unos
          términos: como los impares no tienen techo, la sucesión no está
          acotada. Lo que se puede decir con precisión es que está acotada
          inferiormente y no superiormente.
      - texto: La sucesión es creciente
        porque: |-
          Baja de $a_3=9$ a $a_4=4-\frac{1}{4}=\frac{15}{4}$: los impares
          saltan cada vez más arriba y los pares vuelven cerca de $4$. Para
          ser creciente, cada término tendría que superar al anterior.

  - id: dos-limites-distintos
    bloque: '2.4'
    diapositiva: 3
    pregunta: |
      Considerar la sucesión definida por:

      $\{a_n\}_{n\in\mathbb{N}}\ /\ a_n=\begin{cases}4+\dfrac{1}{n} & \text{si } n \text{ es par}\\ 1+\dfrac{1}{n} & \text{si } n \text{ es impar}\end{cases}$

      ¿Cuál de las siguientes afirmaciones es cierta?
    opciones:
      - texto: 'El límite de $\{a_n\}_{n\in\mathbb{N}}$ es 4'
        porque: |-
          Los términos pares se acercan a $4$, pero los impares se quedan
          cerca de $1$: fuera del entorno $(3,5)$ quedan infinitos términos,
          todos los impares, y eso impide que el límite sea $4$.
      - texto: 'El límite de $\{a_n\}_{n\in\mathbb{N}}$ es 1'
        porque: |-
          Es la misma trampa por el otro lado: los impares tienden a $1$, pero
          los pares, que también son infinitos, se quedan fuera de cualquier
          entorno $(1-r,1+r)$ de radio menor que $3$.
      - texto: 'Los límites de $\{a_n\}_{n\in\mathbb{N}}$ son 1 y 4'
        porque: |-
          El límite, si existe, es único. $1$ y $4$ son los límites de dos
          subsucesiones, la de los impares y la de los pares, y que no
          coincidan es justo lo que demuestra que la sucesión no converge.
      - texto: '$\{a_n\}_{n\in\mathbb{N}}$ no tiene límite'
        correcta: true
        porque: |-
          La subsucesión de los pares tiende a $4$ y la de los impares, a $1$.
          Si la sucesión tuviera límite, todas sus subsucesiones tenderían a
          ese mismo valor; como dan dos distintos, no lo tiene.

  - id: terminos-y-valores
    bloque: '2.4'
    diapositiva: 4
    pregunta: |
      Considerar la sucesión definida por:

      $\{a_n\}_{n\in\mathbb{N}}\ /\ a_n=\begin{cases}4 & \text{si } n \text{ es par}\\ 1+\dfrac{1}{n} & \text{si } n \text{ es impar}\end{cases}$

      ¿Cuál de las siguientes afirmaciones es cierta?
    opciones:
      - texto: >-
          El entorno de centro 4 y radio 1, es decir, el intervalo $(3,5)$,
          contiene sólo un término de la sucesión, que es el propio valor 4.
        porque: |-
          Contiene infinitos términos: $a_2, a_4, a_6\ldots$, todos los pares.
          Que valgan lo mismo no los convierte en uno solo: la definición de
          límite cuenta términos, no valores distintos.
      - texto: >-
          Los términos pares de la sucesión valen siempre 4, por tanto fuera
          del entorno $(1-r,1+r)$ sólo habrá a lo sumo un número finito de
          términos de la sucesión. En consecuencia, el límite de la sucesión
          es 1.
        porque: |-
          Cuenta todos los $4$ como si fueran un solo término. Son infinitos,
          y para cualquier radio $r<3$ quedan todos fuera de $(1-r,1+r)$: fuera
          del entorno hay infinitos términos, así que el límite no es $1$.
      - texto: >-
          El límite de $\{a_n\}_{n\in\mathbb{N}}$ es 4 para los términos pares
          y 1 para los términos impares.
        porque: |-
          El límite es de la sucesión entera, no de unos términos. Lo que
          tiende a $4$ es la subsucesión de los pares, y lo que tiende a $1$,
          la de los impares; como no coinciden, $\{a_n\}$ no tiene límite.
      - texto: Ninguna de las afirmaciones anteriores es cierta.
        correcta: true
        porque: |-
          La A y la B confunden términos con valores: los pares son infinitos
          términos, aunque todos valgan $4$. La C atribuye a la sucesión los
          límites de sus dos subsucesiones, y como son distintos, la sucesión
          no tiene límite.

  - id: positivos-con-limite-cero
    bloque: '2.4'
    diapositiva: 5
    pregunta: |
      ¿Es cierta la siguiente afirmación?

      *Si $a_n>0$ para todo $n$ y $\{a_n\}_{n\in\mathbb{N}}$ converge hacia el
      valor $L$, entonces $L>0$.*
    opciones:
      - texto: La afirmación es cierta
        porque: |-
          Falla con $a_n=\frac{1}{n}$: todos sus términos son positivos y su
          límite es $0$. Al pasar al límite, la desigualdad estricta $a_n>0$
          puede convertirse en una igualdad.
      - texto: La afirmación es falsa
        correcta: true
        porque: |-
          El contraejemplo es $a_n=\frac{1}{n}$: positiva para todo $n$ y con
          límite $0$, que no es mayor que $0$. Lo que se conserva es la
          desigualdad débil, $L\ge 0$.
      - texto: No puede precisar
        porque: |-
          Se puede precisar, y con un solo ejemplo: $a_n=\frac{1}{n}$ tiene
          todos sus términos positivos y límite $0$, así que la afirmación es
          falsa.

  - id: no-negativos-limite-no-negativo
    bloque: '2.4'
    diapositiva: 6
    pregunta: |
      ¿Es cierta la siguiente afirmación?

      *Si $a_n\ge 0$ para todo $n$ y $\{a_n\}_{n\in\mathbb{N}}$ converge hacia
      el valor $L$, entonces $L\ge 0$.*
    opciones:
      - texto: La afirmación es cierta
        correcta: true
        porque: |-
          Si fuera $L<0$, con $\varepsilon=-\frac{L}{2}$ los términos acabarían
          en $\left(\frac{3L}{2},\frac{L}{2}\right)$, todos negativos, en
          contra de $a_n\ge 0$. Así que $L\ge 0$: la desigualdad débil
          sobrevive al límite.
      - texto: La afirmación es falsa
        porque: |-
          Un límite negativo obligaría a los términos a ser negativos a partir
          de un momento, y aquí ninguno lo es. El ejemplo de siempre,
          $a_n=\frac{1}{n}$, da $L=0$, que cumple $L\ge 0$.
      - texto: No se puede precisar
        porque: |-
          Se demuestra para toda sucesión: es la conservación del signo en su
          versión con desigualdad débil. El límite de unos términos no
          negativos es no negativo.

  - id: limite-negativo-cola-negativa
    bloque: '2.4'
    diapositiva: 7
    pregunta: |
      ¿Es cierta la siguiente afirmación?

      *Si $\{a_n\}_{n\in\mathbb{N}}$ es convergente hacia $L$ y $L<0$, entonces
      existe un término de la sucesión a partir del cual todos los siguientes
      términos son negativos.*
    opciones:
      - texto: La afirmación es cierta
        correcta: true
        porque: |-
          Con $\varepsilon=-\frac{L}{2}>0$, la definición de límite da un $n_0$
          a partir del cual $|a_n-L|<-\frac{L}{2}$, es decir,
          $a_n<\frac{L}{2}<0$. Es la conservación del signo.
      - texto: La afirmación es falsa
        porque: |-
          Confunde este caso con el de límite $0$, donde el signo puede ser
          cualquiera. Con $L<0$ hay margen: los términos acaban a menos de
          $\frac{|L|}{2}$ de $L$, y ahí todo es negativo.
      - texto: No se puede precisar
        porque: |-
          La definición de límite lo decide, con $\varepsilon=\frac{|L|}{2}$:
          a partir de cierto $n_0$, todos los términos quedan en
          $\left(\frac{3L}{2},\frac{L}{2}\right)$, que son todos negativos.

  - id: limite-cero-signo-libre
    bloque: '2.4'
    diapositiva: 8
    pregunta: |
      ¿Es cierta la siguiente afirmación?

      *Si $\{a_n\}_{n\in\mathbb{N}}$ es convergente hacia 0, entonces no puede
      asegurarse nada acerca del signo de $a_n$.*
    opciones:
      - texto: La afirmación es cierta
        correcta: true
        porque: |-
          Hay sucesiones con límite $0$ de todos los signos: $\frac{1}{n}$ es
          positiva, $-\frac{1}{n}$ negativa, $\frac{(-1)^n}{n}$ alterna y la
          constante $0$ no es ni una cosa ni otra. Con límite $0$ no hay
          margen para conservar ningún signo.
      - texto: La afirmación es falsa
        porque: |-
          Para que fuera falsa habría que poder asegurar algún signo, y
          $\frac{1}{n}$, $-\frac{1}{n}$ y $\frac{(-1)^n}{n}$ tienden las tres a
          $0$ con signos distintos. La conservación del signo necesita un
          límite distinto de cero.
      - texto: No se puede precisar
        porque: |-
          Se precisa con dos ejemplos: $\frac{1}{n}\to 0$ es positiva y
          $-\frac{1}{n}\to 0$ es negativa, así que el límite $0$ no decide el
          signo.

  - id: decreciente-y-positiva
    bloque: '2.4'
    diapositiva: 9
    pregunta: |
      ¿Es cierta la siguiente afirmación?

      *Si $\{a_n\}_{n\in\mathbb{N}}$ es decreciente y $a_n>0$ para todo $n$,
      entonces es convergente.*
    opciones:
      - texto: La afirmación es cierta
        correcta: true
        porque: |-
          Es decreciente y está acotada inferiormente por $0$: por el teorema
          de la convergencia monótona converge, y su límite es el ínfimo de
          sus términos, que es mayor o igual que $0$.
      - texto: La afirmación es falsa
        porque: |-
          Para no converger tendría que bajar sin freno u oscilar, y no puede
          hacer ninguna de las dos cosas: es monótona, y el $0$ la frena por
          debajo. Monótona y acotada implica convergente.
      - texto: No se puede precisar
        porque: |-
          El teorema de la convergencia monótona lo decide sin conocer la
          sucesión: decreciente y acotada inferiormente, converge.

  - id: el-limite-se-alcanza
    bloque: '2.4'
    diapositiva: 10
    pregunta: |
      ¿Es cierta la siguiente afirmación?

      *Si $\{a_n\}_{n\in\mathbb{N}}$ converge hacia $L$, entonces $a_n$ nunca
      alcanza el valor $L$.*
    opciones:
      - texto: La afirmación es cierta
        porque: |-
          La constante $a_n=L$ converge a $L$ y lo alcanza en todos sus
          términos. También $a_n=\frac{1+(-1)^n}{n}$ tiende a $0$ y vale $0$
          en todos los impares.
      - texto: La afirmación es falsa
        correcta: true
        porque: |-
          La definición de límite pide que los términos acaben tan cerca de
          $L$ como se quiera, y nada impide que lleguen a valer $L$. La
          sucesión constante $a_n=L$ es el ejemplo más corto.
      - texto: No se puede precisar
        porque: |-
          Un ejemplo lo zanja: la constante $a_n=L$ converge a $L$ y lo alcanza
          siempre, así que la afirmación es falsa.

  - id: las-desigualdades-pasan-al-limite
    bloque: '2.4'
    diapositiva: 11
    pregunta: |
      Supongamos que $\{x_n\}_{n\in\mathbb{N}}$ e $\{y_n\}_{n\in\mathbb{N}}$
      son dos sucesiones convergentes cuyos límites son $x$ e $y$,
      respectivamente. Supongamos que $x_n\le y_n$ para todo $n$. Entonces,
      ¿necesariamente se verifica que $x\le y$?
    opciones:
      - texto: Sí
        correcta: true
        porque: |-
          La sucesión $y_n-x_n$ tiene todos sus términos mayores o iguales que
          $0$ y converge a $y-x$; por la conservación del signo, $y-x\ge 0$.
          La desigualdad débil se conserva al pasar al límite.
      - texto: 'No'
        porque: |-
          Quien lo niega suele pensar en la desigualdad estricta, que sí puede
          perderse: $0<\frac{1}{n}$ y los dos límites valen $0$. Pero de
          $\le$ a $\le$ no se pierde nada.
      - texto: No se puede precisar
        porque: |-
          Se deduce siempre, sin conocer las sucesiones: aplicando la
          conservación del signo a $y_n-x_n\ge 0$ sale $y-x\ge 0$.

  - id: regla-del-sandwich
    bloque: '2.4'
    diapositiva: 12
    pregunta: |
      Supongamos que $\{x_n\}_{n\in\mathbb{N}}$ e $\{y_n\}_{n\in\mathbb{N}}$
      son dos sucesiones que convergen al mismo valor $L$. Supongamos que
      $\{z_n\}_{n\in\mathbb{N}}$ es otra sucesión tal que $x_n\le z_n\le y_n$.
      Entonces, ¿es siempre cierto que $\{z_n\}_{n\in\mathbb{N}}$ converge
      hacia $L$?
    opciones:
      - texto: Sí
        correcta: true
        porque: |-
          Es la regla del sándwich: dado $\varepsilon>0$, a partir de un
          momento $x_n$ e $y_n$ están los dos en $(L-\varepsilon,L+\varepsilon)$,
          y $z_n$, atrapada entre ellas, también. Así que $z_n\to L$.
      - texto: 'No'
        porque: |-
          Podría fallar si las dos sucesiones de fuera tuvieran límites
          distintos: entonces $z_n$ podría oscilar entre ellos. Con el mismo
          límite no le queda sitio:
          $L-\varepsilon<x_n\le z_n\le y_n<L+\varepsilon$.
      - texto: No se puede precisar
        porque: |-
          Se precisa para cualquier $z_n$: el hueco entre $x_n$ e $y_n$ se
          cierra alrededor de $L$, y $z_n$ no tiene otro sitio donde ir.

  # «Creciente» es aquí estricta, $a_{n+1}>a_n$, como en la teoría del tema 2
  # y en el ejercicio creciente-con-limite-cero, que resuelve esta misma
  # pregunta del boletín. Con la definición débil, $a_{n+1}\ge a_n$, la buena
  # sería la D (la constante 0) y la B dejaría de serlo.
  - id: creciente-hacia-cero
    bloque: '2.4'
    diapositiva: 13
    pregunta: |
      Supongamos que $\{a_n\}_{n\in\mathbb{N}}$ es una sucesión creciente cuyo
      límite es 0. ¿Cuál de las siguientes afirmaciones es cierta?
    opciones:
      - texto: 'Existe $n$ tal que $a_n>0$'
        porque: |-
          Si algún término fuera positivo, todos los siguientes serían mayores
          que él, y el límite quedaría por encima de ese término, no en $0$.
          Una sucesión creciente se acerca a su límite por debajo.
      - texto: '$a_n<0$ para todo $n$'
        correcta: true
        porque: |-
          El límite de una sucesión creciente es el supremo de sus términos,
          así que $a_n\le 0$. Y ninguno puede valer $0$: el siguiente sería
          estrictamente mayor, positivo, y el límite ya no sería $0$. Un
          ejemplo es $a_n=-\frac{1}{n}$.
      - texto: '$\{a_n\}_{n\in\mathbb{N}}$ puede tener términos positivos y negativos'
        porque: |-
          Una sucesión cualquiera con límite $0$ podría, pero esta es
          creciente: en cuanto un término fuera positivo, todos los siguientes
          también, y el límite sería positivo.
      - texto: 'Es posible que $a_n=0$ para un cierto $n$'
        porque: |-
          Con «creciente» en sentido estricto, $a_{n+1}>a_n$, que es la
          definición del tema, el término siguiente a un cero sería positivo y
          el límite no podría ser $0$. Solo con la definición débil,
          $a_{n+1}\ge a_n$, valdría la sucesión constante $0$.

  - id: suma-convergente
    bloque: '2.5'
    diapositiva: 14
    pregunta: |
      Sean las sucesiones $\{a_n\}_{n\in\mathbb{N}}$ y
      $\{b_n\}_{n\in\mathbb{N}}$ tales que la sucesión
      $\{a_n+b_n\}_{n\in\mathbb{N}}$ es convergente. Entonces:
    opciones:
      - texto: '$\{a_n\}_{n\in\mathbb{N}}$ y $\{b_n\}_{n\in\mathbb{N}}$ deben ser convergentes'
        porque: |-
          $a_n=n$ y $b_n=-n$ divergen las dos y su suma es la constante $0$,
          que converge. Lo que es cierto es el recíproco: si las dos
          convergen, la suma converge.
      - texto: 'Es posible que $\{a_n\}_{n\in\mathbb{N}}$ y $\{b_n\}_{n\in\mathbb{N}}$ sean divergentes'
        correcta: true
        porque: |-
          Con $a_n=n$ y $b_n=-n$, la primera tiende a $+\infty$ y la segunda a
          $-\infty$, y $a_n+b_n=0$ converge: los dos infinitos se cancelan.
      - texto: >-
          Al menos una de las sucesiones $\{a_n\}_{n\in\mathbb{N}}$ o
          $\{b_n\}_{n\in\mathbb{N}}$ debe ser convergente.
        porque: |-
          El mismo ejemplo, $a_n=n$ y $b_n=-n$, tiene suma convergente sin que
          converja ninguna de las dos. Y si una convergiera, la otra también,
          porque $b_n=(a_n+b_n)-a_n$.

  - id: producto-convergente
    bloque: '2.5'
    diapositiva: 15
    pregunta: |
      Sean las sucesiones $\{a_n\}_{n\in\mathbb{N}}$ y
      $\{b_n\}_{n\in\mathbb{N}}$ tales que la sucesión
      $\{a_n\cdot b_n\}_{n\in\mathbb{N}}$ es convergente. Entonces:
    opciones:
      - texto: >-
          Ambas sucesiones $\{a_n\}_{n\in\mathbb{N}}$ y
          $\{b_n\}_{n\in\mathbb{N}}$ deben ser también convergentes
        porque: |-
          $a_n=n$ diverge y $b_n=\frac{1}{n^2}$ converge, y su producto,
          $\frac{1}{n}$, converge a $0$. Que el producto converja no dice nada
          de cada factor por separado.
      - texto: >-
          Alguna de las sucesiones $\{a_n\}_{n\in\mathbb{N}}$ o
          $\{b_n\}_{n\in\mathbb{N}}$ puede ser divergente
        correcta: true
        porque: |-
          Con $a_n=n$, divergente, y $b_n=\frac{1}{n^2}$, el producto es
          $\frac{1}{n}\to 0$: converge aunque un factor diverja, porque el
          otro va a $0$ más deprisa.
      - texto: >-
          Al menos una de las sucesiones $\{a_n\}_{n\in\mathbb{N}}$ o
          $\{b_n\}_{n\in\mathbb{N}}$ debe ser convergente.
        porque: |-
          Con $a_n=b_n=(-1)^n$ no converge ninguna de las dos, y su producto
          es la constante $1$. Dos sucesiones que oscilan pueden dar un
          producto convergente.

  - id: cada-vez-mas-cerca
    bloque: '2.7'
    diapositiva: 16
    pregunta: |
      Supongamos que $\{a_n\}_{n\in\mathbb{N}}$ es una sucesión tal que a
      medida que aumenta $n$, el valor de $a_n$ está cada vez más próximo a
      cierto número L. Es decir, $a_{n+1}$ está más próximo a L que $a_n$.
      ¿Es L el límite de $\{a_n\}_{n\in\mathbb{N}}$?
    opciones:
      - texto: Sí
        porque: |-
          Acercarse siempre no es acercarse del todo: $a_n=\frac{1}{n}$ está
          cada vez más cerca de $-1$, porque $\frac{1}{n}+1$ decrece, y su
          límite es $0$. El límite pide que la distancia baje de cualquier
          $\varepsilon$, no solo que baje.
      - texto: No necesariamente
        correcta: true
        porque: |-
          La distancia a L puede bajar siempre sin tender a $0$.
          $a_n=\frac{1}{n}$ se acerca a $-1$ en cada paso, a distancia
          $1+\frac{1}{n}$, que nunca baja de $1$: su límite es $0$, no $-1$.

  - id: cotas-de-n-entre-n-mas-1
    bloque: '2.7'
    diapositiva: 17
    varias: true
    pregunta: |
      Consideremos el siguiente conjunto de números reales:

      $A=\left\{\dfrac{n}{n+1}\right\}\quad n=1,2,3,\ldots$

      ¿Cuál de las siguientes afirmaciones es cierta?
    opciones:
      - texto: 'El conjunto $A$ está acotado superior e inferiormente'
        correcta: true
        porque: |-
          $\frac{n}{n+1}=1-\frac{1}{n+1}$ va de $\frac{1}{2}$, con $n=1$,
          hacia $1$ sin llegar: todos sus elementos están entre $\frac{1}{2}$
          y $1$.
      - texto: 'El valor $M=1$ es el supremo de $A$'
        correcta: true
        porque: |-
          $1$ es cota superior, porque $\frac{n}{n+1}<1$, y ninguna menor lo
          es: $1-\frac{1}{n+1}$ se acerca a $1$ tanto como se quiera. Es un
          supremo que no se alcanza.
      - texto: 'El valor $M=0{,}99999999$ es una cota superior de $A$'
        porque: |-
          $\frac{n}{n+1}>0{,}99999999$ en cuanto $\frac{1}{n+1}<10^{-8}$, es
          decir, para $n\ge 10^{8}$. Por muy cerca de $1$ que esté, un número
          menor que $1$ no es cota superior.
      - texto: 'El valor $m=0$ es el ínfimo de $A$'
        porque: |-
          $0$ es cota inferior, pero no la mayor: $\frac{1}{2}$ también lo es,
          y es un elemento de $A$. El ínfimo es la mayor de las cotas
          inferiores.
      - texto: 'El valor $m=1/2$ es el ínfimo de $A$'
        correcta: true
        porque: |-
          $\frac{1}{2}$ es el primer elemento, con $n=1$, y todos los demás son
          mayores, porque $\frac{n}{n+1}$ crece: es cota inferior y está en
          $A$, así que es el ínfimo, y además el mínimo.

  # El enunciado no dice cuánto vale a₁. Con a₁ > 0 el límite es √A, la C;
  # con a₁ < 0 sería −√A, que no está entre las opciones.
  - id: limite-de-la-recurrencia
    bloque: '2.8.2'
    diapositiva: 18
    pregunta: |
      Sea $A>0$. Considerar la sucesión recurrente:

      $\{a_n\}_{n\in\mathbb{N}}\ /\ a_{n+1}=\dfrac{1}{2}\left(a_n+\dfrac{A}{a_n}\right),\quad n=1,2,3,\ldots$

      Si $\{a_n\}$ es convergente, ¿cuál es su límite L?
    opciones:
      - texto: '$L=A$'
        porque: |-
          $L=A$ cumple la ecuación del punto fijo,
          $L=\frac{1}{2}\left(L+\frac{A}{L}\right)$, solo si
          $A=\frac{1}{2}(A+1)$, es decir, si $A=1$. Para cualquier otro $A$
          no es el límite.
      - texto: '$L=A^2$'
        porque: |-
          El punto fijo cumple $L^2=A$, y con $L=A^2$ eso pide $A^4=A$, que
          entre los positivos solo cumple $A=1$. El límite es la raíz cuadrada
          de $A$, no su cuadrado.
      - texto: '$L=\sqrt{A}$'
        correcta: true
        porque: |-
          Si $a_n\to L$, también $a_{n+1}\to L$, y pasando al límite en la
          recurrencia, $L=\frac{1}{2}\left(L+\frac{A}{L}\right)$, es decir,
          $L^2=A$. Empezando en $a_1>0$ todos los términos son positivos, así
          que $L=\sqrt{A}$: es el método de Herón para calcular raíces.
      - texto: '$L=\sqrt[3]{A}$'
        porque: |-
          $\left(\sqrt[3]{A}\right)^2=A^{2/3}$, que solo vale $A$ si $A=1$. La
          raíz cúbica sería el límite de otra recurrencia,
          $a_{n+1}=\frac{1}{3}\left(2a_n+\frac{A}{a_n^2}\right)$.

  - id: serie-convergente-termino-a-cero
    bloque: '2.8.3'
    diapositiva: 19
    pregunta: |
      Supongamos que la serie $\displaystyle\sum_{n=1}^{\infty}a_n$ es
      convergente. ¿Cuál de las siguientes afirmaciones es cierta?
    opciones:
      - texto: 'La sucesión $\{a_n\}_{n\in\mathbb{N}}$ puede ser divergente hacia infinito'
        porque: |-
          Si $a_n\to\infty$, a partir de un momento todos los términos pasan
          de $1$ y las sumas parciales crecen sin límite: la serie divergería.
          Una serie convergente obliga a su término general a tender a $0$.
      - texto: 'La sucesión $\{a_n\}_{n\in\mathbb{N}}$ converge hacia 0'
        correcta: true
        porque: |-
          $a_n=S_n-S_{n-1}$, y si las sumas parciales $S_n$ convergen a $S$,
          la diferencia tiende a $S-S=0$. Es la condición necesaria de
          convergencia de una serie.
      - texto: 'No puede saberse nada acerca de la convergencia de la sucesión $\{a_n\}_{n\in\mathbb{N}}$'
        porque: |-
          Se sabe lo más importante: de $a_n=S_n-S_{n-1}$ sale que $a_n\to 0$.
          Lo que no vale es el recíproco, que $a_n\to 0$ baste para que la
          serie converja.

  - id: termino-a-cero-no-basta
    bloque: '2.8.3'
    diapositiva: 20
    pregunta: |
      Supongamos que el límite de la sucesión $\{a_n\}_{n\in\mathbb{N}}$ es 0.
      Entonces, ¿necesariamente la serie $\displaystyle\sum_{n=1}^{\infty}a_n$
      es convergente?
    opciones:
      - texto: Sí, necesariamente
        porque: |-
          La serie armónica lo desmiente: $\frac{1}{n}\to 0$ y
          $\sum\frac{1}{n}$ diverge. Que el término general tienda a $0$ es
          necesario para que la serie converja, pero no suficiente.
      - texto: No necesariamente
        correcta: true
        porque: |-
          $a_n=\frac{1}{n}$ tiende a $0$ y su serie, la armónica, diverge: sus
          sumas parciales crecen como $\ln n$. La condición $a_n\to 0$ solo
          descarta series, no garantiza la convergencia de ninguna.
