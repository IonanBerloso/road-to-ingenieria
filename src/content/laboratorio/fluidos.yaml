  - tema: 4
    practica: 5
    sesion: 1
    titulo: Práctica 5 · La presión de un depósito, leída en un manómetro en U
    que: |
      **Qué se busca.** La presión del aire de un depósito presurizado, a
      partir del desnivel de un manómetro en U.

      **Equipo.** Dos recipientes, un manómetro en U con varios líquidos
      manométricos y una regla metálica, un barómetro, y aire comprimido con
      un manorreductor.

      **Qué se mide.** Con la presión fijada en la válvula reguladora, la
      altura de cada menisco con la regla, y la presión atmosférica en el
      barómetro. La presión se regula para que el mercurio no pase de la
      curva central del tubo.

      Se recorre el manómetro desde la rama abierta, donde la presión
      manométrica es cero, hasta el depósito, sumando al bajar y restando al
      subir, cada tramo con su líquido:

      $$
      \frac{p_1}{\gamma_{\text{agua}}} = \sum_i \pm\, s_i\,h_i
      \qquad
      p_{\text{abs}} = p_1 + p_{\text{atm}}
      $$

      *Procedencia: Práctica 5 · Guion de prácticas 2025-26.*
    trabajo:
      - Explicar el método y dibujar el esquema con las alturas medidas.
      - 'La presión manométrica del depósito dicha de seis maneras: en el SI, el técnico y el CGS; como altura de agua; como altura de un líquido de $s = 2$, la mitad que la de agua; y en atmósferas.'
      - La absoluta, sumándole la del barómetro, en bar y en metros de columna de mercurio, con $s = 13{,}6$.
    donde:
      tema: t04-hidrostatica
      texto: Los aparatos, y qué mide cada uno
      apartado: los-aparatos-y-qué-mide-cada-uno
    ejercicios:
      - exflu2526-ord-1-el-manometro-dentro-del-deposito-presurizado
      - exflu2324-ord-3-los-dos-manometros-y-el-que-miente
      - exflu2122-ord-4-los-dos-depositos-y-el-helio

  - tema: 4
    practica: 6
    sesion: 1
    titulo: Práctica 6 · Dos micromanómetros frente a un tubo en U
    que: |
      **Qué se busca.** Medir una variación pequeña de presión a la vez con
      un micromanómetro y con un tubo en U, y comparar lo sensible que es
      cada uno.

      **Equipo.** Un micromanómetro inclinado y otro de líquidos inmiscibles,
      cada uno junto a un manómetro en U; una jeringa para crear la variación
      de presión, tubo flexible y piezas en T.

      **Qué se mide.** Las alturas de las dos ramas del tubo en U, y la
      posición inicial y final del menisco del micromanómetro, para la misma
      variación.

      $$
      \Delta p_{U} = \gamma\,R
      \qquad
      \Delta p_{\text{incl}} = \gamma\,l\sin\theta
      \qquad
      \Delta p_{\text{inm}} = (\gamma_p - \gamma_l)\,y
      $$

      $\gamma$ es el peso específico del líquido de cada aparato; $R$, el
      desnivel del tubo en U; $l$, lo que avanza el menisco a lo largo del
      tubo inclinado; e $y$, lo que se desplaza la separación entre el líquido
      pesado, $\gamma_p$, y el ligero, $\gamma_l$, con depósitos grandes
      frente al tubo. La
      **sensibilidad** es la presión que corresponde a 1 mm de lectura, la
      mínima longitud que se da por fiable: cuanto menor, más fino mide el
      aparato.

      *Procedencia: Práctica 6 · Guion de prácticas 2025-26.*
    trabajo:
      - Esquema de la práctica, y la deducción de las expresiones de cada aparato, diciendo qué alturas se han medido.
      - 'El grado de sensibilidad de cada micromanómetro y del tubo en U: la presión mínima, en pascales, que se lee con 1 mm.'
      - Las presiones medidas, en el SI y en metros de columna del líquido del tubo en U.
    donde:
      tema: t04-hidrostatica
      texto: El micromanómetro de líquidos inmiscibles, y su sensibilidad
      apartado: el-micromanómetro-de-líquidos-inmiscibles-y-su-sensibilidad
    ejercicios:
      - exflu2425-ord-3-disenar-la-sensibilidad-del-micromanometro
      - exflu2324-ext-3-el-micromanometro-de-liquidos-inmiscibles
      - exflu2223-ord-1-el-micromanometro-de-dos-liquidos
      - exflu2021-1par-2-el-micromanometro-que-hay-que-disenar

  # ── Sesión 2 · cálculo de fuerzas, y la cavitación (guía 5.2)
  - tema: 7
    practica: 7
    sesion: 2
    titulo: Práctica 7 · El momento del agua sobre una compuerta, equilibrado con pesas
    que: |
      **Qué se busca.** Medir el momento que hace el agua sobre una compuerta
      y compararlo con el que dan los prismas de presiones.

      **Equipo.** Un banco con un cuerpo en forma de cuarto de anillo que gira
      sobre una articulación, un recipiente para el agua, un contrapeso y
      pesas calibradas de 2, 20, 50 y 100 g. La cara plana que se sumerge
      mide $a = 100$ mm de alto y $b = 75$ mm de ancho; su borde inferior
      está a $D = 200$ mm por debajo de la articulación, y el platillo de las
      pesas, a $L = 275$ mm de ella.

      **Qué se mide.** Con el aparato nivelado y equilibrado sin agua con el
      contrapeso, se cuelga una pesa y se añade agua hasta que el brazo
      vuelve a su posición; se anota la altura $h$ del agua sobre el borde
      inferior de la cara plana. Cuatro medidas por lo menos con la cara
      sumergida en parte, $h \le a$, y otras cuatro con ella entera bajo el
      agua, entre 100 y 200 mm.

      Las fuerzas sobre las caras curvas son perpendiculares a arcos con
      centro en la articulación, así que pasan por ella y no dan momento:
      solo cuenta la cara plana. Con $m$ la masa colgada:

      $$
      h \le a:\quad m\,L = \frac{\rho\,b\,h^{2}}{2}\left(D - \frac{h}{3}\right)
      $$

      $$
      h > a:\quad m\,L = \rho\,b\,a\left(h - \frac{a}{2}\right)\left[D - \frac{a}{2} + \frac{a^{2}}{12\,(h - a/2)}\right]
      $$

      *Procedencia: Práctica 7 · Guion de prácticas 2025-26.*
    trabajo:
      - 'Esquema y fundamento de la práctica, con el equilibrado inicial sin agua: qué compensa el contrapeso y por qué hace falta.'
      - 'Los prismas de presiones acotados sobre la compuerta en función de $h$, en los dos casos: triángulo con la cara sumergida en parte, trapecio con ella entera.'
      - Razonar qué momento da el agua sobre la parte curva, y deducir el peso teórico que equilibra cada altura en los dos casos.
      - Una tabla con el peso teórico y el real de cada medida, y la gráfica de los dos frente a $h$ —el teórico como curva, el real en puntos—, justificando por qué no coinciden.
    donde:
      tema: t07-fuerzas-superficies
      texto: Medir la fuerza sobre una superficie en el laboratorio
      apartado: medir-la-fuerza-sobre-una-superficie-en-el-laboratorio
    ejercicios:
      - exflu2425-ord-1-el-cuarto-de-cilindro-y-la-compuerta-triangular
      - exflu2324-ord-4-la-compuerta-abc-con-vacuometro
      - exflu2122-ord-5-la-compuerta-de-cuarto-de-cilindro
      - exflu2021-1par-3-la-compuerta-que-se-abre-a-los-cuatro-metros

  - tema: 8
    practica: 8
    sesion: 2
    titulo: Práctica 8 · El hidrómetro, y cuánto pesa
    que: |
      **Qué se busca.** Leer la densidad relativa de varios líquidos con
      hidrómetros —densímetros— y sacar, con la misma medida, el peso de cada
      hidrómetro.

      **Equipo.** Hidrómetros de distintas escalas, una probeta de 500 ml y
      líquidos de distinto peso específico.

      **Qué se mide.** La densidad relativa que marca el hidrómetro al
      flotar, y lo que sube el nivel de la probeta al meterlo, que es el
      volumen que desaloja. Se mete despacio, notando el empuje, y sin que
      roce las paredes.

      Un cuerpo que flota está en equilibrio con su empuje, así que el peso
      del hidrómetro es el del líquido que desaloja:

      $$
      W = E = \gamma_{\text{agua}}\; s\; (V_f - V_i)
      $$

      En un líquido más denso se hunde menos, pero el empuje es el mismo:
      es su peso.

      *Procedencia: Práctica 8 · Guion de prácticas 2025-26.*
    trabajo:
      - Explicar en pocas líneas el empuje.
      - Un cuadro con cada líquido, lo que marca el hidrómetro y los dos niveles de la probeta.
      - El peso de cada hidrómetro, a partir del volumen desalojado y de la densidad leída.
    donde:
      tema: t08-fuerzas-cuerpos
      texto: El hidrómetro y la pesada hidrostática
      apartado: el-hidrómetro-y-la-pesada-hidrostática
    ejercicios:
      - exflu2324-ext-2-la-gabarra-que-se-hundio
      - exflu2021-1par-1-seis-afirmaciones-y-las-seis-falsas

  - tema: 8
    practica: 9
    sesion: 2
    titulo: Práctica 9 · La densidad de un líquido por pesada hidrostática
    que: |
      **Qué se busca.** La densidad de un líquido a partir del peso que
      pierde un cuerpo de volumen conocido al sumergirlo en él.

      **Equipo.** Una balanza de precisión con soporte para pesar colgado, un
      termómetro ajustado para tener un volumen de 5,5 cm³ —es el cuerpo que
      se sumerge—, una probeta de 100 ml y el líquido.

      **Qué se mide.** Lo que marca la balanza con el termómetro colgado en
      el aire, $P_1$, y con él sumergido entero en el líquido sin tocar las
      paredes, $P_2$; y la temperatura del líquido. La diferencia es el
      empuje:

      $$
      P_1 - P_2 = E = \rho_{\text{líq}}\,g\,V
      \qquad\Longrightarrow\qquad
      \rho_{\text{líq}} = \frac{P_1 - P_2}{g\,V}
      $$

      Con las lecturas en gramos y $V$ en cm³, $(P_1 - P_2)/V$ da la densidad
      directamente en g/cm³.

      *Procedencia: Práctica 9 · Guion de prácticas 2025-26.*
    trabajo:
      - Cómo sale la densidad del líquido de $P_1$ y $P_2$, con los 5,5 cm³ del termómetro.
      - La densidad relativa del líquido del ensayo, que es una mezcla de agua y acetona.
      - Con la temperatura del líquido, aplicar al resultado el factor de corrección que da la tabla del guion para esa temperatura.
    donde:
      tema: t08-fuerzas-cuerpos
      texto: El hidrómetro y la pesada hidrostática
      apartado: el-hidrómetro-y-la-pesada-hidrostática
    ejercicios:
      - exflu2122-ext-3-el-balancin-en-dos-fluidos

  - tema: 25
    practica: 26
    sesion: 2
    titulo: Práctica 26 · La cavitación en el estrechamiento de un venturi
    que: |
      **Qué se busca.** Ver aparecer la cavitación en la garganta de un
      aparato tipo venturi al ir subiendo el caudal, y seguir las presiones a
      la entrada y en la garganta antes y durante el fenómeno.

      **Equipo.** El aparato de cavitación, horizontal, con un manómetro a la
      entrada (1) y un vacuómetro en la garganta (2), de secciones
      $A_1 = 150$ mm² y $A_2 = 36$ mm²; un rotámetro de coeficiente 0,977, y
      el alimentador de caudal y la válvula de membrana que comparte con el
      canal hidrodinámico.

      **Qué se mide.** Para diez caudales por lo menos, de menor a mayor: el
      caudal, la presión a la entrada y la de la garganta, anotando cuándo
      empieza a cavitar y cómo avanza. Y la temperatura del agua.

      $$
      v_i = \frac{Q}{A_i}
      \qquad
      h_{f,1\text{-}2} = \left(\frac{p_1}{\gamma} + \frac{v_1^{2}}{2g}\right) - \left(\frac{p_2}{\gamma} + \frac{v_2^{2}}{2g}\right)
      \qquad
      K = \frac{h_{f,1\text{-}2}}{v_1^{2}/2g}
      $$

      Al estrecharse la sección la velocidad sube y la presión baja; cavita
      cuando la presión **absoluta** de la garganta,
      $p_{2,\text{abs}} = p_2 + p_{\text{atm}}$, llega a la presión de vapor
      del agua a su temperatura.

      *Procedencia: Práctica 26 · Guion de prácticas 2025-26.*
    trabajo:
      - 'Para cada caudal: el caudal real, las presiones a la entrada y en la garganta en mca, la absoluta de la garganta, las dos velocidades y la energía cinética a la entrada.'
      - Deducir con Bernoulli la pérdida entre la entrada y la garganta, y calcularla con su factor de paso $K$ referido a $v_1^2/2g$.
      - 'Las curvas de las presiones —manométricas y absolutas— frente al caudal, y la de la entrada frente a la energía cinética y frente al caudal, interpretando qué cambia con la cavitación: en la garganta, la absoluta no puede bajar de la de vapor.'
      - La presión de vapor del agua a la temperatura medida, en el cuadro nº 8 de «Cuadros y ábacos», comparada con la mínima medida en la garganta, con la razón de la diferencia.
    donde:
      tema: t25-bombeo
      texto: 'La cavitación a la vista: la práctica 26'
      apartado: la-cavitación-a-la-vista-la-práctica-26
    ejercicios:
      - exflu2122-ext-8-la-cota-maxima-de-la-aspiracion
      - exflu2021-ord-4-el-ariete-con-la-longitud-por-incognita

  # ── Sesión 3 · medida del flujo: presiones, velocidad y orificios (guía 5.3)
  - tema: 13
    practica: 10
    sesion: 3
    titulo: Práctica 10 · Presión estática, dinámica y total en una tubería
    que: |
      **Qué se busca.** Distinguir la presión estática, la dinámica y la
      total en una tubería, y los aparatos con que se mide cada una.

      **Equipo.** Un banco con bomba sumergible, tuberías y piezas
      especiales; un piezómetro abierto a la atmósfera; un conjunto
      presurizado de piezómetro, tubo de Pitot y tubo estático conectados a
      la tubería; un depósito tarado para medir el caudal, y un rotámetro.

      **Qué se mide.** Para seis caudales, la altura del piezómetro abierto y
      las del conjunto presurizado, y lo que sube el depósito tarado en un
      tiempo, para el caudal volumétrico.

      El piezómetro marca la presión **estática**; el Pitot, que para el
      fluido en su boca, la **total**; y la diferencia entre los dos es la
      **dinámica**:

      $$
      \frac{v^{2}}{2g} = h_{\text{Pitot}} - h_{\text{piezómetro}}
      \qquad
      v = \sqrt{2g\,\Delta h}
      \qquad
      Q = v\,\frac{\pi D^{2}}{4}
      $$

      *Procedencia: Práctica 10 · Guion de prácticas 2025-26.*
    trabajo:
      - Esquema de la práctica.
      - Para cada caudal, la presión estática en el eje con el piezómetro abierto, la dinámica con el Pitot y el piezómetro presurizados, y el caudal con esa dinámica y el diámetro.
      - 'El caudal por el método volumétrico, y por qué no coincide con el del Pitot: el Pitot da la velocidad en un punto y el caudal pide la media de la sección. Y al revés: la dinámica a partir del caudal medido, comparada con la del Pitot.'
      - La diferencia entre lo que marcan el tubo estático y el piezómetro, y la pérdida de carga entre los dos.
      - Las gráficas de $h_f$ frente a $v^2/2g$ y frente a $Q$, con los datos del conjunto presurizado.
    donde:
      tema: t13-medidores
      texto: Reconocer un Pitot en un esquema
      apartado: reconocer-un-pitot-en-un-esquema
    ejercicios:
      - exflu2526-ord-4-el-deposito-y-sus-dos-sondas
      - exflu2425-ext-9-el-pitot-del-avion-que-se-bloquea
      - exflu2324-ext-4-el-venturimetro-calibrado-con-un-pitot
      - exflu2021-2par-2-el-pitot-y-el-piezometro-juntos

  - tema: 13
    practica: 11
    sesion: 3
    titulo: Práctica 11 · La velocidad de un chorro de aire, con un Pitot
    que: |
      **Qué se busca.** La velocidad del aire que sale de una tobera a la
      atmósfera, a partir de su presión dinámica.

      **Equipo.** La instalación de aire comprimido con manorreductor y
      enchufe rápido, un tubo de Pitot en su soporte, un manómetro
      diferencial en U con agua, un barómetro y un termómetro.

      **Qué se mide.** Con el Pitot centrado en la salida, el desnivel del
      manómetro en U para tres velocidades, regulando la presión para que el
      agua no salga del manómetro. Y la presión y la temperatura del aire,
      que dan su densidad.

      Como el chorro sale a la atmósfera, su presión estática es la del
      ambiente, y el Pitot marca solo la dinámica:

      $$
      \rho_{\text{aire}} = \frac{p_{\text{atm}}}{R_{\text{aire}}\,T}
      \qquad
      \rho_{\text{agua}}\,g\,R = \frac{1}{2}\,\rho_{\text{aire}}\,v^{2}
      \quad\Longrightarrow\quad
      v = \sqrt{\frac{2\,\rho_{\text{agua}}\,g\,R}{\rho_{\text{aire}}}}
      $$

      *Procedencia: Práctica 11 · Guion de prácticas 2025-26.*
    trabajo:
      - Explicar el método y dibujar el esquema.
      - Deducir la velocidad en función de la lectura del manómetro.
      - La velocidad de salida del aire para cada una de las tres lecturas.
    donde:
      tema: t13-medidores
      texto: Reconocer un Pitot en un esquema
      apartado: reconocer-un-pitot-en-un-esquema
    ejercicios:
      - exflu2425-ext-9-el-pitot-del-avion-que-se-bloquea

  - tema: 13
    practica: 12
    sesion: 3
    titulo: Práctica 12 · Los tres coeficientes de un orificio
    que: |
      **Qué se busca.** Los coeficientes de velocidad, de contracción y de
      gasto de un orificio, y ver que todo flujo real pierde carga.

      **Equipo.** Todo en serie: el alimentador de caudal, un rotámetro de
      coeficiente 0,918, un depósito con piezómetro abierto y rebosadero,
      orificios de 20 y de 22 mm cuya salida está a 23,8 mm de la base, y un
      tubo de Pitot en el chorro. Además, un limnímetro con una pieza en U de
      42 mm para medir el chorro.

      **Qué se mide.** Para seis caudales, en régimen permanente: la altura
      del piezómetro, la del Pitot, las dos lecturas del limnímetro que dan
      el diámetro del chorro, y el caudal del rotámetro como referencia.

      $$
      v_t = \sqrt{2gh}
      \qquad
      v_r = \sqrt{2g\,h_P}
      \qquad
      C_v = \frac{v_r}{v_t}
      \qquad
      C_c = \frac{A_r}{A_t}
      \qquad
      C_d = C_v\,C_c = \frac{Q_r}{Q_t}
      $$

      con $h$ y $h_P$ las alturas del piezómetro y del Pitot medidas desde el
      eje del orificio.

      *Procedencia: Práctica 12 · Guion de prácticas 2025-26.*
    trabajo:
      - 'Para cada caudal: las velocidades teórica y real, las secciones teórica y real del chorro, los caudales teórico y real, y los tres coeficientes.'
      - Comparar el caudal real calculado con el del rotámetro para ver si se llegó al régimen permanente, tabular las diferencias y hallar el coeficiente de contracción medio.
      - Con una hoja de cálculo, las curvas de $C_v$ frente a la velocidad real y de $C_c$ y $C_d$ frente al caudal real, razonando su forma.
      - Caudal real frente a teórico y velocidad real frente a teórica, con su recta de tendencia —la pendiente es el coeficiente de gasto en una y el de velocidad en la otra—, y la pérdida de carga frente a la energía cinética de salida.
    donde:
      tema: t13-medidores
      texto: Torricelli, y los tres coeficientes
      apartado: torricelli-y-los-tres-coeficientes
    ejercicios:
      - exflu2021-ord-2-el-coeficiente-medido-por-la-perdida

  - tema: 13
    practica: 13
    sesion: 3
    titulo: Práctica 13 · El tiempo de vaciado de un depósito
    que: |
      **Qué se busca.** Medir cuánto tarda en vaciarse un depósito de sección
      constante y compararlo con el tiempo teórico.

      **Equipo.** Un depósito con piezómetro abierto, rebosadero y un
      obturador en el orificio, un cronómetro y el alimentador de caudal.

      **Qué se mide.** Con el orificio tapado y el depósito lleno hasta un
      nivel, se quita el obturador y se cronometra el vaciado. Desde cuatro
      niveles distintos, y nunca en menos de 10 segundos.

      Con $A$ la sección del depósito y $a$ la del orificio, en cada instante
      el nivel baja lo que sale por el orificio:

      $$
      -A\,\mathrm{d}h = C_d\,a\sqrt{2gh}\;\mathrm{d}t
      \quad\Longrightarrow\quad
      t = \frac{2A}{C_d\,a\sqrt{2g}}\left(\sqrt{h_0} - \sqrt{h_f}\right)
      $$

      Con $C_d = 1$ sale el tiempo ideal, más corto que el real.

      *Procedencia: Práctica 13 · Guion de prácticas 2025-26.*
    trabajo:
      - La expresión del tiempo teórico en función de las variables del ensayo.
      - El tiempo teórico de cada vaciado, comparado con el medido, y los motivos de la diferencia.
    donde:
      tema: t13-medidores
      texto: Vaciado de depósitos
      apartado: vaciado-de-depósitos
    ejercicios:
      - exflu2324-ord-5-el-tiempo-de-vaciado
      - exflu1920-1par-5-el-vaciado-con-cambio-de-seccion

  # ── Sesión 4 · medida del flujo: calibrar medidores y vertederos (guía 5.4)
  - tema: 13
    practica: 14
    sesion: 4
    titulo: Práctica 14 · Calibrar un venturímetro
    que: |
      **Qué se busca.** Manejar un venturímetro y tararlo: su coeficiente
      sale de comparar el caudal real con el teórico.

      **Equipo.** Un banco con bomba sumergida en un depósito, tuberías, una
      válvula de asiento inclinado para regular el caudal, un rotámetro de
      coeficiente 0,944 y el venturímetro, con tres piezómetros presurizados:
      a la entrada (1), en la garganta (2) y a la salida (3).

      **Qué se mide.** Para seis caudales, sin aire en el circuito: el caudal
      del rotámetro, que hay que corregir con su coeficiente, y las alturas
      $h_1$, $h_2$ y $h_3$.

      $$
      R = h_1 - h_2
      \qquad
      Q_t = A_2\sqrt{\frac{2g\,R}{1 - (A_2/A_1)^{2}}}
      \qquad
      C_v = \frac{Q_r}{Q_t}
      \qquad
      Re_1 = \frac{v_1\,D_1}{\nu}
      $$

      *Procedencia: Práctica 14 · Guion de prácticas 2025-26.*
    trabajo:
      - Esquema de la práctica.
      - 'Con $Q$, $h_1$, $h_2$ y $h_3$ en una tabla, para cada caudal: $R$, el coeficiente del venturímetro, la pérdida entre la entrada y la salida, la velocidad y la energía cinética en la tubería, y el Reynolds con $\nu = 10^{-6}\ \text{m}^2/\text{s}$.'
      - Las curvas $R$–$Q$, $C_v$–$Re$ y $h_{f,1\text{-}3}$–$v_1^2/2g$, con sus conclusiones.
    donde:
      tema: t13-medidores
      texto: 'Calibrar un medidor: venturímetros, diafragmas y rotámetros'
      apartado: calibrar-un-medidor-venturímetros-diafragmas-y-rotámetros
    ejercicios:
      - exflu2324-ext-4-el-venturimetro-calibrado-con-un-pitot
      - exflu2223-ord-5-el-venturimetro-que-dice-hacia-donde-va
      - exflu2122-ord-6-los-dos-manometros-del-venturimetro
      - exflu2021-2par-2-el-pitot-y-el-piezometro-juntos

  - tema: 13
    practica: 15
    sesion: 4
    titulo: Práctica 15 · Calibrar un diafragma
    que: |
      **Qué se busca.** Medir caudales en una tubería con un diafragma, y
      tararlo.

      **Equipo.** Los dos bancos de pérdidas de carga, cada uno con un ramal
      de diafragma —tubería de 21,3 mm y orificio de 13 mm—, manómetro
      diferencial digital, manómetros en U de agua y de mercurio, rotámetro y
      caudalímetro digital.

      **Qué se mide.** Para seis caudales, hasta unos 1000 ml/s: el caudal
      del caudalímetro digital y la lectura del manómetro diferencial
      digital o la del de mercurio.

      $$
      Q_t = A_2\sqrt{\frac{2g\,R\,(s_m - 1)}{1 - (A_2/A_1)^{2}}}
      \qquad
      \frac{A_2}{A_1} = \left(\frac{13}{21{,}3}\right)^{2}
      \qquad
      C = \frac{Q_r}{Q_t}
      $$

      con $R$ el desnivel del manómetro de mercurio, $s_m = 13{,}6$, y agua
      circulando.

      *Procedencia: Práctica 15 · Guion de prácticas 2025-26.*
    trabajo:
      - Esquema, y una memoria breve de cómo se hizo.
      - Deducir el caudal teórico del diafragma con el manómetro diferencial que se ha usado.
      - 'Un cuadro con el caudal real, el teórico y el coeficiente $C$; y la gráfica con el real en abscisas y el teórico en ordenadas, de la que $C$ se saca gráficamente: la pendiente es $1/C$.'
      - Comparar con el ábaco del diafragma VDI —el nº 15 de «Cuadros y ábacos»—, para lo que hacen falta antes $A_2/A_1$, $v_1$ y $Re_1$.
    donde:
      tema: t13-medidores
      texto: 'Calibrar un medidor: venturímetros, diafragmas y rotámetros'
      apartado: calibrar-un-medidor-venturímetros-diafragmas-y-rotámetros
    ejercicios:
      - exflu2425-ord-8-el-diafragma-y-su-liquido-manometrico

  - tema: 13
    practica: 16
    sesion: 4
    titulo: Práctica 16 · Los medidores indirectos de flujo
    que: |
      **Qué se busca.** Conocer los medidores indirectos de flujo, que dan la
      velocidad o el caudal a partir de otra lectura y casi todos se taran.
      Como la práctica 4, en el guion es un
      capítulo descriptivo, sin toma de datos ni trabajo de gabinete.

      **De velocidad**: los anemómetros de cazoletas y de paletas, el de
      hilo caliente y el molinete hidráulico. **Volumétricos**: los
      contadores de desplazamiento positivo —como el de disco de las casas— y
      los de turbina. **Caudalímetros**: los manómetros diferenciales que
      extraen la raíz cuadrada, los electromagnéticos y los de ultrasonidos.

      $$
      Q = C\sqrt{\Delta h}
      \qquad
      Q = S\,v,\quad E_s \propto v
      \qquad
      v = \frac{c_1 - c_2}{2\cos\alpha}
      $$

      La primera es la de los diferenciales de raíz cuadrada, sobre un
      aparato deprimógeno; la segunda, la del electromagnético, donde la
      tensión inducida crece con la velocidad; la tercera, la del de
      ultrasonidos, con $c_1$ y $c_2$ las velocidades del sonido a favor y en
      contra de la corriente.

      *Procedencia: Práctica 16 · Guion de prácticas 2025-26.*
    trabajo:
      - 'No hay cálculos que entregar: se trata de reconocer cada aparato y su principio.'
      - 'Qué convierte cada uno en velocidad o en caudal: el giro de unas cazoletas o de una hélice, el enfriamiento de un hilo caliente, la tensión que induce un fluido conductor al cortar un campo magnético, o la diferencia de un ultrasonido a favor y en contra de la corriente.'
      - 'Por qué casi todos se taran: el principio da una proporcionalidad, y la constante sale de calibrarlos.'
    donde:
      tema: t13-medidores
      texto: Los medidores indirectos
      apartado: los-medidores-indirectos

  - tema: 13
    practica: 17
    sesion: 4
    titulo: Práctica 17 · Calibrar un rotámetro
    que: |
      **Qué se busca.** Conocer el rotámetro y su coeficiente de corrección:
      lo que marca frente al caudal que pasa de verdad.

      **Equipo.** Dos bancos, cada uno con grupo hidráulico —depósito y
      bomba—, tuberías con una válvula reguladora, un rotámetro, un depósito
      tarado y un cronómetro.

      **Qué se mide.** Para seis caudales: lo que marca el rotámetro, y el
      tiempo que tarda en llenarse un volumen del depósito tarado, dos veces
      por lo menos.

      $$
      Q_r = \frac{V}{t}
      \qquad
      C = \frac{Q_r}{Q_{\text{rot}}}
      $$

      *Procedencia: Práctica 17 · Guion de prácticas 2025-26.*
    trabajo:
      - Esquema de la práctica.
      - Para cada caudal, el real por el método volumétrico y el que indica el rotámetro, y el coeficiente medio de corrección.
      - 'La recta del caudal real frente al indicado, y qué significa su pendiente: es el coeficiente $C$.'
    donde:
      tema: t13-medidores
      texto: 'Calibrar un medidor: venturímetros, diafragmas y rotámetros'
      apartado: calibrar-un-medidor-venturímetros-diafragmas-y-rotámetros
    ejercicios:
      - exflu2324-ext-4-el-venturimetro-calibrado-con-un-pitot
      - exflu2223-ord-5-el-venturimetro-que-dice-hacia-donde-va
      - exflu2021-3par-2-el-factor-de-paso-de-la-valvula

  - tema: 13
    practica: 23
    sesion: 4
    titulo: Práctica 23 · Calibrar vertederos de pared delgada
    que: |
      **Qué se busca.** Medir caudales en un canal abierto con vertederos de
      pared delgada, y sacar su coeficiente.

      **Equipo.** El canal hidrodinámico con su alimentador de caudal y su
      rotámetro, un medidor de nivel y cuatro vertederos de pared delgada:
      rectangular, horizontal con contracciones laterales, y en V de 60° y de
      30°.

      **Qué se mide.** Con el vertedero puesto y el canal lleno, la altura
      inicial del agua sobre el umbral; después, para tres caudales en
      régimen, el nivel y el caudal. El agua no debe rebasar la forma del
      vertedero.

      $$
      Q_{t,\text{rect}} = \frac{2}{3}\,L\sqrt{2g}\,H^{3/2}
      \qquad
      Q_{t,V} = \frac{8}{15}\tan\frac{\theta}{2}\,\sqrt{2g}\,H^{5/2}
      \qquad
      C = \frac{Q_r}{Q_t}
      $$

      con $H$ la altura del agua sobre el umbral o el vértice, $L$ el ancho
      del rectangular y $\theta$ el ángulo de la V.

      *Procedencia: Práctica 23 · Guion de prácticas 2025-26.*
    trabajo:
      - Esquema, descripción de los elementos, y cómo cambia el flujo al llegar al vertedero y por qué.
      - La velocidad del agua aguas arriba del vertedero.
      - Deducir el caudal teórico de un vertedero de pared delgada, con sus hipótesis, y calcularlo.
      - El caudal real frente al teórico, de donde sale el coeficiente de cada vertedero; y la altura del agua, antes de que la afecte el vertedero, frente al caudal real.
    donde:
      tema: t13-medidores
      texto: Vertederos, que miden un canal por lo que sobresale
      apartado: vertederos-que-miden-un-canal-por-lo-que-sobresale
    ejercicios:
      - exflu2425-ext-4-el-vertedero-en-v-por-analisis-dimensional
      - exflu2122-ext-6-los-dos-vertederos-del-mismo-canal

  # ── Sesión 5 · flujos reales en conductos, y máquinas (guía 5.5)
  - tema: 15
    practica: 18
    sesion: 5
    titulo: Práctica 18 · La fuerza de un chorro sobre obstáculos que lo desvían
    que: |
      **Qué se busca.** La fuerza de un chorro vertical sobre obstáculos que
      lo desvían distintos ángulos, medida con pesas y comparada con la del
      teorema de la cantidad de movimiento.

      **Equipo.** El banco de calibrado de rotámetros y fuerza de un chorro:
      grupo hidráulico, tuberías y válvulas, rotámetro, y un depósito de
      metacrilato con un inyector de 8 mm que lanza el chorro hacia arriba,
      una plataforma para pesas con un indicador de nivel, pesas ranuradas y
      cuatro obstáculos que desvían el chorro 30°, 90°, 120° y 180°.

      **Qué se mide.** Con una pesa puesta, se abre la válvula hasta que el
      chorro sostiene la plataforma en su marca, y se lee el caudal. Con
      pesas de 40, 300 y 500 g en los obstáculos de 90°, 120° y 180°, y de 20
      y 90 g en el de 30°.

      En equilibrio, la fuerza del chorro iguala al peso. Si el obstáculo
      desvía el chorro un ángulo $\beta$, la velocidad no cambia al rodearlo
      y se desprecia lo que frena el chorro al subir desde la boquilla:

      $$
      F = \rho\,Q\,v_0\,(1 - \cos\beta)
      \qquad
      v_0 = \frac{Q}{\pi d^{2}/4}
      \qquad
      F = m\,g
      $$

      Con $\beta = 90^{\circ}$ es $\rho\,Q\,v_0$, y con $180^{\circ}$, el
      doble.

      **Del guion, fuera del programa de la guía.** La guía no la pone en
      ninguna sesión. Va aquí, en la quinta, porque la presentación de la
      asignatura junta en su último bloque las pérdidas de carga y la
      cantidad de movimiento.

      *Procedencia: Práctica 18 · Guion de prácticas 2025-26.*
    trabajo:
      - Esquema y fundamento del ensayo, con el principio con que se equilibra la plataforma.
      - Deducir la fuerza del chorro sobre el obstáculo con la ecuación de la cantidad de movimiento, y de ahí el peso teórico que equilibra cada ensayo.
      - Comparar el peso teórico con el real y razonar la diferencia.
      - La fuerza medida con cada obstáculo frente al cuadrado de la velocidad de salida, y en una sola gráfica la teórica y la medida de un obstáculo a varios caudales.
    donde:
      tema: t15-aplicaciones-tcm
      texto: Álabe fijo
      apartado: álabe-fijo
