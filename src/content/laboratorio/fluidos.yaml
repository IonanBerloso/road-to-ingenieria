asignatura: fluidos
herramienta: con manómetros, medidores de caudal, bancos de pérdidas y bombas,
enIndice: las 27 prácticas del guion, por las que pregunta el examen escrito; qué se mide en cada una, dónde lo explica el sitio y en qué ejercicios de examen sale lo mismo.
entradilla: >-
  Son las prácticas del laboratorio de la escuela, y el examen escrito
  pregunta por ellas: la prueba final, que es el 100 % de la nota, trae
  preguntas de las prácticas además de teoría y ejercicios, y cualquier sesión
  trabajada durante el curso es evaluable. Aquí está qué se mide en cada una,
  con qué aparato y con qué expresión, dónde lo explica el sitio y en qué
  ejercicios de examen sale lo mismo.
fuente: |
  «Guion de prácticas» · Mecánica de Fluidos e Hidráulica 2025-26, Escuela de
  Ingeniería de Gipuzkoa (UPV/EHU): las 27 prácticas, con su objeto, su
  material, su método y su trabajo de gabinete, y las hojas de datos del
  anexo. La guía de la asignatura, apartados 5 («Programa de prácticas de
  laboratorio»), 6 («Tipo de actividades programadas») y 7 («Evaluación»). Y
  la presentación de la asignatura 2025-26, diapositivas 3, 4, 21 y 22. El
  guion, la guía y los «Vídeos de las prácticas» (YouTube) los reparte la
  asignatura en eGela; aquí no se copia ni se enlaza ninguno, y lo que se lee
  de cada práctica es un resumen nuestro. Las tablas que se citan —los
  cuadros nº 6, 8 y 25 y el ábaco nº 15— son de «Cuadros y ábacos».
aviso: |
  Esta página **no corrige nada y no sustituye a las prácticas**. Este curso
  son voluntarias y sin informe obligatorio (presentación, diapositiva 22):
  el guion describe un informe por sesión y la guía dice que los grupos
  «podrán» entregarlo. Se hacen en grupo —de tres, según la presentación; de
  cinco como mucho, según la guía— y el calendario está en eGela. Aquí no
  están los valores que se miden en el laboratorio, ni el informe, ni los
  vídeos.

  Lo que sí se puede preparar es lo que pregunta el escrito: qué mide cada
  práctica, con qué aparato y con qué expresión. Las expresiones son nuestras
  —el guion da el fundamento de cada práctica en una línea— y salen de los
  temas del sitio que cada práctica enlaza.

  Las sesiones de esta página son los cinco bloques del programa de
  prácticas de la guía (apartado 5). Que cada bloque sea una sesión es
  lectura nuestra: el apartado 6 dice que cada grupo hace cinco sesiones de
  tres horas, con unas tres prácticas en cada una, y los bloques traen entre
  cuatro y seis. La presentación agrupa las prácticas de otra manera, también
  en cinco bloques —propiedades de los fluidos; medición de presiones y
  cálculo de fuerzas; máquinas hidráulicas; aplicaciones de Bernoulli; y
  pérdidas de carga y cantidad de movimiento— (diapositiva 21), así que el
  orden real puede ser otro: manda el calendario. Y el guion trae cuatro
  prácticas que la guía no numera en su programa, la 18, la 21, la 25 y la
  27; van en la sesión que mejor les cuadra, y cada una dice por qué.

actividades:
  # ── Sesión 1 · propiedades de los fluidos y medida de la presión (guía 5.1)
  - tema: 2
    practica: 1
    sesion: 1
    titulo: Práctica 1 · El peso de un volumen conocido, en tres sistemas de unidades
    que: |
      **Qué se busca.** El peso específico y la densidad de un líquido,
      pesando un volumen conocido de él.

      **Equipo.** Una balanza de precisión, una probeta pequeña —de 5 o de
      10 ml—, una pipeta y el líquido problema.

      **Qué se mide.** Lo que marca la balanza, en gramos, con el volumen de
      líquido de la probeta. Todo lo demás sale de ahí y de la gravedad:

      $$
      \rho = \frac{m}{V}
      \qquad
      \gamma = \frac{W}{V} = \rho\,g
      \qquad
      s = \frac{\rho}{\rho_{\text{agua}}} = \frac{\gamma}{\gamma_{\text{agua}}}
      $$

      La trampa está en las unidades. En el técnico la masa va en UTM y el
      peso en kilopondios, con $1\ \text{kp} = 9{,}8\ \text{N}$ y
      $1\ \text{UTM} = 9{,}8\ \text{kg}$; en el CGS, la masa en gramos y el
      peso en dinas, con $1\ \text{N} = 10^{5}\ \text{dyn}$.

      *Procedencia: Práctica 1 · Guion de prácticas 2025-26.*
    trabajo:
      - Explicar el método y tabular lo medido, la pesada y el volumen.
      - Un cuadro con el peso, la masa, la densidad, el peso específico y la densidad relativa del líquido en el SI, en el técnico y en el CGS.
      - 'El mismo cuadro en un planeta con $g = 3{,}5\ \text{m/s}^2$. La masa, la densidad y $s$ no cambian; el peso y el peso específico sí. Y en el técnico se nota: aquí un kilo de masa pesa un kilopondio, y allí poco más de un tercio.'
    donde:
      tema: t02-propiedades
      texto: La balanza y la densidad
      apartado: la-balanza-y-la-densidad
    ejercicios:
      - exflu2425-ext-1-el-dioxido-de-carbono-comprimido
      - exflu2021-1par-4-el-deposito-que-se-dilata

  - tema: 2
    practica: 2
    sesion: 1
    titulo: Práctica 2 · La viscosidad de un aceite, medida con un reloj en el viscosímetro Engler
    que: |
      **Qué se busca.** La viscosidad de un aceite en grados Engler a varias
      temperaturas, y de ahí su viscosidad cinemática y la dinámica.

      **Equipo.** El viscosímetro Engler —una vasija con un orificio
      calibrado, dentro de un baño maría con termómetro—, agua destilada, el
      aceite, un cronómetro, un matraz de 200 ml, una balanza y probetas.

      **Qué se mide.** El tiempo que tardan en llenar el matraz hasta los
      200 ml, primero el agua a 20 °C y después el aceite a cada temperatura,
      dos veces cada una; y la pesada de 10 ml de cada líquido, para su
      densidad.

      $$
      {}^{\circ}\!E = \frac{t_{\text{aceite}}(T)}{t_{\text{agua}}(20\,^{\circ}\text{C})}
      \qquad
      \mu = \rho\,\nu
      $$

      Los grados Engler no son una unidad de viscosidad sino una comparación
      de tiempos: para pasarlos a viscosidad cinemática está el cuadro nº 6
      de «Cuadros y ábacos», que da la equivalencia.

      *Procedencia: Práctica 2 · Guion de prácticas 2025-26.*
    trabajo:
      - Con la media de los dos cronometrados, los grados Engler a cada temperatura, y la gráfica de la viscosidad en °E frente a la temperatura.
      - La viscosidad cinemática en stokes, con la equivalencia del cuadro nº 6.
      - Con la pesada de 10 ml, la densidad, el peso específico y la densidad relativa del aceite y del agua a una temperatura, en el técnico, en el SI y en el CGS.
      - 'La viscosidad dinámica del aceite a esa temperatura en los tres sistemas: $\text{kp}\cdot\text{s/m}^2$, $\text{Pa}\cdot\text{s}$ y poise.'
    donde:
      tema: t02-propiedades
      texto: El viscosímetro Engler, o medir la viscosidad con un reloj
      apartado: el-viscosímetro-engler-o-medir-la-viscosidad-con-un-reloj
    ejercicios:
      - exflu2021-1par-1-seis-afirmaciones-y-las-seis-falsas

  - tema: 2
    practica: 3
    sesion: 1
    titulo: Práctica 3 · La capilaridad, con agua y con mercurio
    que: |
      **Qué se busca.** Ver la capilaridad: cómo sube o baja un líquido en un
      tubo fino o entre dos placas muy juntas, y qué forma toman sus
      meniscos.

      **Equipo.** Agua y mercurio, tubos de vidrio de 1,81 y de 1 mm de
      diámetro, placas paralelas y alcohol para limpiar.

      **Qué se observa.** No se mide nada: se mira. El agua moja el vidrio y
      sube, con el menisco cóncavo; el mercurio no lo moja y baja, con el
      menisco convexo. Igualando la componente vertical de la tensión
      superficial con el peso de la columna:

      $$
      h_{\text{tubo}} = \frac{4\,\sigma\cos\theta}{\rho\,g\,D}
      \qquad
      h_{\text{placas}} = \frac{2\,\sigma\cos\theta}{\rho\,g\,e}
      $$

      con $D$ el diámetro del tubo y $e$ la separación entre las placas. A
      igual separación, entre placas el líquido sube la mitad que en un tubo
      de ese diámetro.

      *Procedencia: Práctica 3 · Guion de prácticas 2025-26.*
    trabajo:
      - Un esquema que compare lo que hacen el agua y el mercurio en cada tubo y entre las placas.
      - El diagrama de fuerzas de cada menisco —la cohesión dentro del líquido y la adhesión al vidrio— y por qué de él sale un menisco cóncavo o uno convexo.
      - La ley de Jurin, deducida para el tubo y para las placas.
    donde:
      tema: t02-propiedades
      texto: Tensión superficial y capilaridad
      apartado: tensión-superficial-y-capilaridad
    ejercicios:
      - exflu2425-ord-2-el-piezometro-que-miente-por-capilaridad
      - exflu2324-ord-1-la-capilaridad-entre-dos-tubos
      - exflu2223-ext-1-la-capilaridad-en-un-rectangulo
      - exflu2122-ext-1-la-savia-que-sube-treinta-metros
      - exflu2021-1par-1-seis-afirmaciones-y-las-seis-falsas

  - tema: 4
    practica: 4
    sesion: 1
    titulo: Práctica 4 · Los aparatos que miden la presión
    que: |
      **Qué se busca.** Conocer los aparatos que miden presiones y qué mide
      cada uno. En el guion es un capítulo descriptivo, con una figura de
      cada aparato y sin toma de datos ni trabajo de gabinete; la guía la
      cuenta como práctica de la primera sesión.

      **Los directos** solo usan la hidrostática: el piezómetro, el tubo en U
      con uno o varios líquidos manométricos, el diferencial —que conecta dos
      depósitos en vez de un depósito y la atmósfera— y, para presiones
      pequeñas, el de líquidos inmiscibles, el inclinado y el de gancho.

      **Los indirectos** van tarados: la presión deforma un elemento —el tubo
      elíptico del Bourdon, una membrana, un fuelle— y ese desplazamiento
      mueve una aguja o se convierte en una señal. Según lo que miden se
      llaman manómetros, vacuómetros o mano-vacuómetros, y el Bourdon puede
      ser de presiones relativas o de absolutas.

      $$
      p_1 - p_2 = g\,h\,(\rho_m - \rho)
      \qquad
      \Delta p = \gamma\,l\sin\theta
      $$

      La primera es la del diferencial, con $h$ el desnivel del líquido
      manométrico, de densidad $\rho_m$. La segunda, la del inclinado con su
      depósito grande: la lectura $l$ a lo largo del tubo es $1/\sin\theta$
      veces el desnivel que de verdad se mide.

      *Procedencia: Práctica 4 · Guion de prácticas 2025-26.*
    trabajo:
      - 'No hay cálculos que entregar. Lo que conviene llevar sabido es qué mide cada aparato: barómetro, manómetro, vacuómetro, diferencial y micromanómetro.'
      - Un Bourdon de relativas lee respecto de lo que tiene por fuera del tubo, que casi siempre es la atmósfera, pero no si está dentro de otro depósito presurizado; uno de absolutas lee respecto del vacío. Las dos lecturas se diferencian en la presión de ese entorno, y es una pregunta que se repite en los exámenes.
      - 'Las reglas de uso que da el guion: no pasar de dos tercios de la escala si la presión es constante ni de la mitad si varía, glicerina en la esfera si oscila, un sifón delante si se mide vapor, y abrir despacio la válvula de conexión.'
      - 'Por qué el inclinado y el de dos líquidos sirven para presiones pequeñas: los dos alargan la lectura para el mismo salto de presión.'
    donde:
      tema: t04-hidrostatica
      texto: Los aparatos, y qué mide cada uno
      apartado: los-aparatos-y-qué-mide-cada-uno
    ejercicios:
