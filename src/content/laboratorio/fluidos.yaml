  - tema: 18
    practica: 19
    sesion: 5
    titulo: Práctica 19 · La pérdida de carga en tuberías de PVC, cobre y acero galvanizado
    que: |
      **Qué se busca.** La pérdida de carga en tuberías de distintos
      materiales, medida en el laboratorio y comparada con la de las
      fórmulas.

      **Equipo.** Los dos bancos de pérdidas de carga, con grupo hidráulico,
      manómetro diferencial digital, manómetros en U de agua y de mercurio,
      rotámetro y caudalímetro digital. En el banco 1, tubos de PVC de 13 y
      21,3 mm y 645 mm de largo, y de cobre y acero galvanizado de 13 mm y
      595 mm; en el banco 2, de 1000 mm: PVC de 21,3 mm, cobre de 16 mm y
      galvanizado de 20,1 mm.

      **Qué se mide.** En dos tuberías, para seis caudales a intervalos
      parecidos desde el máximo —unos 1000 ml/s—: el caudal y lo que marcan
      los manómetros de columna de agua.

      Con el diámetro constante, la velocidad no cambia entre las tomas y la
      pérdida es lo que baja la altura piezométrica:

      $$
      h_f = \left(\frac{p_1}{\gamma} + z_1\right) - \left(\frac{p_2}{\gamma} + z_2\right)
      \qquad
      h_f = f\,\frac{L}{D}\,\frac{v^{2}}{2g}
      \qquad
      h_f = J_1\,L\,Q^{1{,}852}
      $$

      La segunda es Darcy-Weisbach, con $f$ del ábaco de Moody; la tercera,
      Hazen-Williams con el $J_1$ del cuadro nº 25 y $Q$ en l/s.

      *Procedencia: Práctica 19 · Guion de prácticas 2025-26.*
    trabajo:
      - Esquema, y cuadros con todas las lecturas.
      - Cómo sale $h_f$ de cada tubería con Bernoulli entre las dos tomas y la lectura del manómetro.
      - La pérdida medida para cada caudal, y las dos curvas $h_f$–$Q$ del banco en un mismo diagrama, comparadas.
      - En la tubería que el guion señala para cada banco, la pérdida calculada con Darcy-Weisbach y Moody y con Hazen-Williams, y las tres curvas $h_f$–$Q$ —medida, Hazen-Williams y Darcy-Weisbach— juntas para compararlas.
    donde:
      tema: t18-perdidas-carga
      texto: La ecuación de Darcy-Weisbach
      apartado: la-ecuación-de-darcy-weisbach
    ejercicios:
      - exflu2526-ord-8-el-alcohol-entre-a-y-b

  - tema: 19
    practica: 20
    sesion: 5
    titulo: Práctica 20 · Factor de paso y longitud equivalente de un codo y una curva
    que: |
      **Qué se busca.** La longitud equivalente $L_e$ y el factor de paso $K$
      de piezas especiales, medidos en el laboratorio.

      **Equipo.** Los bancos de pérdidas de carga, con los manómetros
      conectados a las tomas rápidas de la entrada y la salida de la pieza:
      un codo brusco y una curva larga.

      **Qué se mide.** Para seis caudales por lo menos, desde el máximo de
      1000 ml/s: el caudal y las lecturas del manómetro en U de mercurio a la
      entrada y a la salida de la pieza.

      $$
      h_f = R\,(s_m - 1)
      \qquad
      K = \frac{h_f}{v^{2}/2g}
      \qquad
      L_e = \frac{K\,D}{f}
      $$

      La primera da la pérdida en metros de columna de agua con el desnivel
      $R$ del mercurio, porque la pieza tiene el mismo diámetro a la entrada y
      a la salida.

      *Procedencia: Práctica 20 · Guion de prácticas 2025-26.*
    trabajo:
      - Esquema de la práctica.
      - La expresión de la pérdida en la pieza, y su valor para cada caudal.
      - El factor de paso para cada caudal y su media en cada pieza; y lo mismo con la longitud equivalente, a través de Darcy-Weisbach y el coeficiente de fricción $f$.
      - La curva característica $h_f$–$Q$ de cada pieza.
    donde:
      tema: t19-conducciones
      texto: Los dos métodos
      apartado: los-dos-métodos
    ejercicios:
      - exflu1920-2par-4-la-bomba-deducida-presurizando-el-deposito
      - exflu2324-ord-8-el-codo-y-su-longitud-equivalente

  - tema: 19
    practica: 21
    sesion: 5
    titulo: Práctica 21 · La pérdida en un ensanchamiento brusco y en uno progresivo
    que: |
      **Qué se busca.** La pérdida, el factor de paso y la longitud
      equivalente de un ensanchamiento brusco y de uno progresivo, medidos y
      comparados con los de los cuadros.

      **Equipo.** El banco 2 de pérdidas de carga, con tubería horizontal de
      metacrilato que pasa de 12 a 42 mm de diámetro, en brusco y en
      progresivo de 15°; un rotámetro de coeficiente 0,9332, y como mucho
      3000 l/h.

      **Qué se mide.** Para seis caudales por lo menos, lo que marcan los
      manómetros en U antes y después del ensanchamiento.

      $$
      h_f = \frac{p_1 - p_2}{\gamma} + \frac{v_1^{2} - v_2^{2}}{2g}
      \qquad
      K = \frac{h_f}{v_1^{2}/2g}
      \qquad
      h_{f,\text{brusco}} = \frac{(v_1 - v_2)^{2}}{2g}
      $$

      La última es la de Borda-Carnot, que el tema 15 deduce con la cantidad
      de movimiento, cuando casi todas las demás pérdidas localizadas se
      tabulan. Al ensancharse la presión **sube**, y aun así se pierde
      carga.

      **Del guion, fuera del programa de la guía.** La guía no la nombra: su
      5.2, las pérdidas en piezas especiales, es el título de la práctica 20.
      Va en la quinta, con las otras pérdidas en piezas especiales.

      *Procedencia: Práctica 21 · Guion de prácticas 2025-26.*
    trabajo:
      - Esquema, y la deducción de la pérdida en el ensanchamiento.
      - 'Para cada caudal: la velocidad en la tubería y en el ensanchamiento, la pérdida medida y el factor de paso $K$ referido a la energía cinética de entrada; y la media de $K$ en cada ensanchamiento.'
      - 'La pérdida teórica de cada caudal con los datos de «Cuadros y ábacos». En el progresivo, de 15°, el guion pide la cuenta de las dos formas: como progresivo, que es para ángulos de hasta 10°, y como brusco, que es para los mayores.'
      - La longitud equivalente con Darcy-Weisbach, referida a la velocidad de entrada; las curvas $h_f$–$Q$ real y teórica de cada ensanchamiento, y la real de los dos juntos; y $K$ frente a $v_1^2/2g$.
    donde:
      tema: t19-conducciones
      texto: Pérdidas menores
      apartado: pérdidas-menores

  - tema: 19
    practica: 22
    sesion: 5
    titulo: Práctica 22 · El factor de paso de una válvula según lo abierta que esté
    que: |
      **Qué se busca.** Cómo cambian el factor de paso y la longitud
      equivalente de una válvula según lo abierta que esté.

      **Equipo.** Los bancos de pérdidas de carga, en el ramal de la válvula
      que se mide, con el manómetro en U de mercurio o el diferencial
      digital, y el rotámetro con el caudalímetro digital.

      **Qué se mide.** Con la válvula abierta, a tres cuartos, a media y a un
      cuarto —tres posiciones como mínimo, según la válvula—, tres caudales en
      cada una con las presiones a la entrada y a la salida; con tres
      posiciones, nueve medidas.

      $$
      h_f = R\,(s_m - 1)
      \qquad
      K = \frac{h_f}{v^{2}/2g}
      \qquad
      L_e = \frac{K\,D}{f}
      $$

      *Procedencia: Práctica 22 · Guion de prácticas 2025-26.*
    trabajo:
      - Esquema de la instalación.
      - La pérdida en la válvula para cada apertura y cada uno de sus tres caudales, y la media de $K$ y de $L_e$ en cada apertura.
      - 'Explicar cómo evolucionan $K$ y $L_e$ al ir cerrando la válvula: crecen, y cada vez más deprisa.'
    donde:
      tema: t19-conducciones
      texto: Factor de paso y longitud equivalente de una válvula
      apartado: factor-de-paso-y-longitud-equivalente-de-una-válvula
    ejercicios:
      - exflu1920-2par-4-la-bomba-deducida-presurizando-el-deposito
      - exflu2021-3par-2-el-factor-de-paso-de-la-valvula
      - exflu2021-2par-4-el-aerosol-y-la-valvula-con-mercurio

  - tema: 24
    practica: 24
    sesion: 5
    titulo: Práctica 24 · Las máquinas hidráulicas por dentro
    que: |
      **Qué se busca.** Ver por dentro las máquinas hidráulicas
      —turbomáquinas y de desplazamiento positivo, motoras y receptoras— y
      reconocer sus elementos.

      **Equipo.** Turbobombas; bombas de desplazamiento positivo, tanto
      alternativas como rotativas; motores hidráulicos, y turbinas de los dos
      tipos, de acción y de reacción.

      **Qué se hace.** Con el responsable del laboratorio se analiza cada
      máquina y, cuando hace falta, se desmonta, para ver sus piezas y qué
      hace cada una. No se mide nada y no hay expresiones: lo que se trabaja
      son las clasificaciones, por el principio de funcionamiento, por el
      sentido en que se intercambia la energía, por la dirección del flujo
      respecto del rodete y por los parámetros adimensionales. De esta parte,
      los exámenes han preguntado los elementos de cada turbina, la función
      del distribuidor y los tipos de cierre de una turbobomba.

      *Procedencia: Práctica 24 · Guion de prácticas 2025-26.*
    trabajo:
      - Un resumen de lo visto, con esquemas de cada tipo de máquina y de sus elementos.
      - 'Clasificar cada máquina con los criterios del fundamento: principio de funcionamiento, sentido del intercambio de energía y dirección del flujo en el rodete.'
    donde:
      tema: t24-bombas
      texto: Los elementos de una turbobomba, y sus cierres
      apartado: los-elementos-de-una-turbobomba-y-sus-cierres
    ejercicios:
      - exflu2526-ord-9-ocho-huecos-y-un-descuento
      - exflu2223-ext-9-accion-y-reaccion-en-una-tabla
      - exflu2122-ord-10-cinco-preguntas-de-maquinas
      - exflu2021-3par-1-las-maquinas-hidraulicas-de-corrido

  - tema: 25
    practica: 25
    sesion: 5
    titulo: Práctica 25 · La curva de una bomba, y la válvula que la regula
    que: |
      **Qué se busca.** Los puntos de la curva característica $H_m$–$Q$ de
      una bomba, la curva de la instalación y la pérdida en la válvula de
      regulación a distintas aperturas.

      **Equipo.** Dos bancos: el informatizado de bombas en serie y en
      paralelo, con tubería de PVC de 21,3 mm y $z = 200$ mm; y el banco 2 de
      pérdidas de carga, con variador de velocidad, vacuómetro y manómetro
      Bourdon —con sus tomas a 140 mm de diferencia de cota— y caudalímetro.

      **Qué se mide.** Con las válvulas abiertas y en régimen permanente, las
      lecturas del vacuómetro, del manómetro y del caudalímetro; después,
      maniobrando las válvulas de impulsión, lo mismo en otros puntos de
      funcionamiento, seis por lo menos.

      $$
      H_m = \frac{p_s - p_e}{\gamma} + (z_s - z_e) + \frac{v_s^{2} - v_e^{2}}{2g}
      \qquad
      H_i = K\,Q^{2}
      \qquad
      h_{f,\text{válv}} = H_m(Q) - H_i(Q)
      $$

      La presión de entrada, la del vacuómetro, es negativa: al restarla se
      suma. La última da lo que pierde la válvula, cerrada en parte, en el
      nuevo caudal, respecto de la instalación con la válvula abierta del
      todo.

      **Del guion, fuera del programa de la guía.** La guía no la numera
      entre sus prácticas, pero el título de su quinto bloque nombra también
      las bombas y las instalaciones de bombeo, que es lo que mide esta: por
      eso va en la quinta.

      *Procedencia: Práctica 25 · Guion de prácticas 2025-26.*
    trabajo:
      - Para cada punto, la altura manométrica de la bomba y el caudal real; y la curva $H_m$–$Q$ en mca frente a l/h, con una hoja de cálculo y su línea de tendencia.
      - La expresión $H_i = K\,Q^2$ de la instalación con la válvula de impulsión abierta del todo, dibujada sobre la de la bomba con seis puntos por lo menos.
      - La pérdida en la válvula de regulación a una apertura, analítica y gráficamente, y a otras dos solo sobre la gráfica; y su $L_e$ y su $K$ en las tres.
    donde:
      tema: t25-bombeo
      texto: La curva de una bomba, medida en el banco
      apartado: la-curva-de-una-bomba-medida-en-el-banco
    ejercicios:
      - exflu2425-ext-2-la-bomba-y-la-valvula-que-hay-que-cerrar
      - exflu2324-ord-6-la-bomba-deducida-de-dos-puntos
      - exflu2122-ord-11-la-boquilla-y-la-valvula-que-se-cierra

  - tema: 20
    practica: 27
    sesion: 5
    titulo: Práctica 27 · El golpe de ariete en un tubo de PVC y en uno de cobre
    que: |
      **Qué se busca.** Ver un golpe de ariete y entenderlo: la celeridad de
      la onda, si el cierre es rápido o lento, y cuánto tarda en cerrarse la
      válvula.

      **Equipo.** Dos tubos de 3 m en paralelo: uno de PVC de 28,4 mm de
      diámetro interior y 1,8 mm de pared, con tres tomas de presión, y otro
      de cobre de 26 mm y 1,0 mm, con dos. Al final de cada uno, una válvula
      —una esférica y otra neumática—; otra esférica al principio del de PVC;
      un piezómetro que hace de chimenea de equilibrio; un depósito auxiliar;
      y el ordenador que registra la sobrepresión.

      **Qué se mide.** El caudal por el método volumétrico, y la sobrepresión
      que da el ordenador al cerrar la válvula, para tres caudales por lo
      menos en cada tubo. Al final, con la chimenea abierta, se vuelve a
      cerrar para ver en pantalla la sobrepresión.

      $$
      a = \frac{9900}{\sqrt{48{,}3 + k\,\dfrac{D}{e}}}
      \qquad
      \Delta H_{\text{Allievi}} = \frac{a\,v}{g}
      \qquad
      \Delta H_{\text{Michaud}} = \frac{2\,L\,v}{g\,t_c}
      $$

      con $k$ de 33 para el PVC —entre 20 y 50— y de $0{,}8$ para el cobre,
      según el guion. El cierre es rápido si $t_c < 2L/a$, y entonces vale
      Allievi; si no, Michaud.

      **Del guion, fuera del programa de la guía.** La guía no la pone en
      ninguna sesión. Va en la quinta, la de los flujos reales en conductos.

      *Procedencia: Práctica 27 · Guion de prácticas 2025-26.*
    trabajo:
      - El caudal de cada ensayo, y la celeridad de la onda en cada tubo con la ayuda que da el guion.
      - Para cada ensayo, decidir si el cierre fue rápido o lento y, con la fórmula que toque y la sobrepresión medida, despejar el tiempo de cierre. Con tubos de 3 m, $2L/a$ es de centésimas de segundo o menos.
      - Con una hoja de cálculo, la sobrepresión frente al tiempo de cierre, una curva por material.
    donde:
      tema: t20-golpe-ariete
      texto: 'Cierre lento o rápido: la clasificación lo decide todo'
      apartado: cierre-lento-o-rápido-la-clasificación-lo-decide-todo
    ejercicios:
      - exflu2021-ord-4-el-ariete-con-la-longitud-por-incognita
      - exflu2021-3par-3-la-valvula-de-retencion-y-el-corte-de-luz
      - exflu1920-2par-3-el-canal-y-la-tuberia-forzada
