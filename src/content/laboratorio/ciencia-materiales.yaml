asignatura: ciencia-materiales
herramienta: con máquina de tracción, durómetro, microscopio y placas de Petri,
enIndice: las seis prácticas, el 20 % de la nota con su examen escrito; qué pide cada una y con qué fórmulas, y lo que se calcula con los guiones resuelto paso a paso.
entradilla: >-
  Son las seis prácticas del laboratorio de la escuela. Valen el 20 % de la
  nota y se aprueban aparte, con un 5,0: un 40 % son los informes y
  cuestionarios y un 60 %, un examen escrito de prácticas, con un mínimo de
  4,0 en cada parte. Aquí no se entrega nada: se dice qué pide cada práctica y
  con qué fórmulas, y lo que se puede calcular con los datos de los guiones
  está resuelto como ejercicio guiado entre los del tema que enlaza cada
  práctica.
fuente: |
  Los guiones de las seis prácticas y sus anexos · Ciencia de Materiales,
  Escuela de Ingeniería de Gipuzkoa (UPV/EHU), curso 2025-2026: «Práctica 1:
  clasificación de materiales»; «Práctica 2. Ensayo de tracción», con las
  figuras para el informe, el test previo y la actividad de aula; «Ensayo de
  dureza» y las fichas técnicas del acero F125, del latón y del aluminio 5754;
  «Protección catódica por ánodo de sacrificio» y «Fundamento electroquímico
  de la corrosión del acero»; «Determinación práctica de los efectos del
  trabajo en frío» y su presentación; «Tratamientos térmicos del acero» y su
  hoja de datos, y la plantilla «Informe de ejemplo». Los guiones y las fichas
  los reparte la asignatura en eGela, y aquí no se copia ninguno: lo que se lee
  es un resumen nuestro. El reparto 40/60, los mínimos y el examen escrito
  salen de la guía del alumnado 2025-2026, apartado 8, «Evaluación» (pág. 9), y
  de la presentación de la asignatura, diapositivas 10, 11, 14 y 21.
aviso: |
  Esta página **no corrige nada y no sustituye a las prácticas**. La
  asistencia es obligatoria, se trabaja en grupos de tres o cuatro y hay que
  llegar con el guion leído: antes de empezar se hacen preguntas, y quien no lo
  ha leído no hace la práctica (diap. 11). Cada alumno hace además un breve
  cuestionario de cada práctica, y en las que elige el profesor el grupo
  entrega un informe en siete días.

  Lo que sí se puede preparar aquí es el **examen escrito de prácticas**, que
  en 2025-2026 fue el 12 de diciembre (diap. 21): qué se mide en cada
  práctica, con qué fórmula y qué se concluye. Ni la guía ni la presentación
  dicen cómo es ese examen —cuánto dura, qué tipo de preguntas trae o si se
  puede llevar algo—, así que los ejercicios de aquí salen de lo que piden los
  guiones y no de un examen visto.

  Cuando hay informe, la plantilla de la asignatura pide introducción,
  fundamento teórico, procedimiento experimental —«sin copiar el guion»—,
  resultados y discusión, conclusiones y bibliografía, con las páginas, las
  tablas y las figuras numeradas y citadas en el texto, y solo figuras de los
  equipos que se han usado.

actividades:
  - tema: 1
    practica: 1
    titulo: Práctica 1 · Clasificar los materiales de objetos reales
    que: |
      **Qué se busca.** Reconocer de qué material está hecho cada objeto,
      encajarlo en su familia y explicar con sus propiedades por qué se usa ahí.

      **Equipo y medidas.** Los objetos que hay en el laboratorio. No se mide
      nada y el guion no trae fórmulas: es una tabla de cuatro columnas
      —objeto, material, propiedades y utilización— que se rellena con los
      objetos delante.

      *Procedencia: Práctica 1 · Guion «Práctica 1: clasificación de
      materiales».*
    trabajo:
      - Para cada objeto, decir de qué material es y a qué familia pertenece —metal, cerámico, polímero o compuesto—.
      - Escribir las propiedades de ese material que explican el uso del objeto, y el uso en la última columna.
      - El guion no dice si hay informe; lo que sí hay, según la presentación, es el breve cuestionario individual de cada práctica.
    donde:
      tema: t01-introduccion
      texto: Las cuatro familias, y las que no caben
      apartado: las-cuatro-familias-y-las-que-no-caben

  - tema: 2
    practica: 2
    titulo: Práctica 2 · El ensayo de tracción de un acero y un polipropileno
    que: |
      **Qué se busca.** Sacar las propiedades de tracción de una probeta de
      acero y otra de polipropileno a partir de sus curvas, y ver lo distinto
      que se comportan un metal y un polímero.

      **Equipo y datos.** La máquina de ensayos de tracción, con el acero a
      2 mm/min y el polipropileno a 5 y a 50 mm/min, y las dimensiones de las
      dos probetas antes y después: el acero pasa de $L_0 = 40$ mm y
      $A_0 = 53{,}5$ mm² a $L_f = 61$ mm y $A_f = 18{,}8$ mm², y el
      polipropileno, de 40 mm y 48 mm² a 78 mm y 9,4 mm². Las curvas son las
      cinco «figuras para hacer el informe».

      **Qué se mide.** El límite elástico, la resistencia a la tracción, la
      resistencia a la fractura, el módulo de Young, el alargamiento, la
      reducción de área, y la tensión y la deformación reales en la fractura.

      $$
      \%EL = \frac{L_f - L_0}{L_0}\cdot 100
      $$

      $$
      \%AR = \frac{A_0 - A_f}{A_0}\cdot 100
      $$

      $$
      \sigma = \frac{F}{A_0}
      \qquad
      \varepsilon = \frac{L_f - L_0}{L_0}
      $$

      $$
      E = \frac{\sigma_2 - \sigma_1}{\varepsilon_2 - \varepsilon_1}
      $$

      $$
      F_F = \sigma_F\,A_0
      \qquad
      \sigma_{F,\text{real}} = \frac{F_F}{A_f}
      $$

      $$
      \varepsilon_T = \ln\frac{l_f}{l_0}
      $$

      *Procedencia: Práctica 2 · Guion «Práctica 2. Ensayo de tracción»,
      «Figuras para hacer el informe», «Test previo a la práctica» y
      «Actividad de aula».*
    trabajo:
      - "Antes de entrar, el test previo: los objetivos de la práctica y las cinco magnitudes de la curva —límite elástico, resistencia a tracción, módulo, deformación y tensión a ruptura— emparejadas con su letra en una gráfica."
      - Con las dimensiones de antes y después, el alargamiento y la reducción de área de cada probeta.
      - En la curva hasta rotura, el límite elástico donde la recta se curva, la resistencia a la tracción en el punto más alto y la de fractura donde acaba la curva. El módulo, en la gráfica del tramo inicial, como pendiente entre dos puntos de la recta. El guion imprime el denominador del módulo como ε₂ − ε₂; es ε₂ − ε₁.
      - "La tensión y la deformación reales en la fractura, con el área final. En el acero la figura 2 da carga frente a desplazamiento y la fuerza de rotura se lee; en el polipropileno la gráfica da tensión y la fuerza se despeja, F = σ·A0. En la figura 2 el eje de carga está corregido a mano: se lee 25,0 kN arriba, no 250."
      - "Las unidades cambian de una gráfica a otra: el acero da la deformación en mm/mm y el polipropileno en %. Y la figura 5, la del polipropileno a 5 mm/min que no llega a romper, no se usa para las propiedades."
      - La actividad de aula, un problema con tres materiales en una tabla, está resuelta entre los ejercicios del tema 2.
    donde:
      tema: t02-propiedades-mecanicas
      texto: Las cinco propiedades de tracción
      apartado: las-cinco-propiedades-de-tracción
    ejercicios:
      - ejcmlab-p2-actividad-de-aula
      - ejcmlab-p2-test-previo-y-modulos
      - ejcmlab-p2-probetas-del-guion

  - tema: 2
    practica: 3
    titulo: Práctica 3 · La dureza Brinell de un acero, un latón y un aluminio
    que: |
      **Qué se busca.** Medir la dureza Brinell de tres metales, estimar con
      ella su resistencia a la tracción y compararla con las de los otros dos
      metales; las fichas técnicas que acompañan al guion sirven para
      contrastarla.

      **Equipo.** Un durómetro Brinell con bola de acero templado de 2,5 mm y
      un microscopio de 50 aumentos —objetivo de 5 y visor de 10—, en el que
      cada milímetro de la escala son 0,02 mm de huella. Las probetas son de
      acero F125, de latón y de una aleación de aluminio 5754, y cada una
      tiene su ficha técnica.

      **Qué se mide.** El diámetro $d$ de la huella. La carga se elige con la
      constante de ensayo $K$ —30 para aceros; 10 para bronces, cobres y
      latones; 5 para aleaciones de aluminio; 2,5 para plomo-estaño, en
      kg/mm²— y el tiempo, con el material: 30 s el acero, de 10 a 20 s el
      latón y 40 s el aluminio. La huella vale si queda entre $D/4$ y $D/2$, y
      la ideal es $d = 0{,}375\,D$.

      $$
      HB = \frac{F}{A} = \frac{2F}{\pi D\left(D - \sqrt{D^{2}-d^{2}}\right)}
      $$

      $$
      F = K\,D^{2}
      \qquad
      \frac{D}{4} < d < \frac{D}{2}
      $$

      $$
      R = HB\cdot m + n
      $$

      Con $m = 0{,}36$ y $n = 0$ si la dureza es menor de 175 HB, $m = 0{,}34$
      y $n = 0$ si es mayor, y rectas propias para los aceros al Ni, al Cr-Ni
      y al Cr-V. El resultado se escribe con la dureza, las letras HB, el
      diámetro de la bola, la carga y el tiempo: **100 HB 5 250 30**.

      *Procedencia: Práctica 3 · Guion «Ensayo de dureza» y fichas técnicas
      del acero F125, del latón y del aluminio 5754.*
    trabajo:
      - "Antes de ensayar, la carga de cada probeta con F = K·D² para la bola de 2,5 mm: es la primera tabla del informe."
      - Aplicar la carga el tiempo que toca a cada material, medir la huella al microscopio y pasarla a milímetros reales.
      - Comprobar que la huella queda entre D/4 y D/2, y que hay al menos cuatro diámetros de huella hasta el borde y entre huellas.
      - Calcular HB y la resistencia R de cada metal; la ficha de cada uno sirve para ver si sale razonable.
      - En el informe, las tres durezas comparadas con lo que suponen para el uso de cada material, y otros ensayos de dureza con su fundamento y en qué se diferencian del Brinell.
    donde:
      tema: t02-propiedades-mecanicas
      texto: La dureza, y otros ensayos
      apartado: la-dureza-y-otros-ensayos
    ejercicios:
      - ejcmlab-p3-carga-y-huella
      - ejcmlab-p3-f125-dureza-y-resistencia

  - tema: 6
    practica: 4
    titulo: Práctica 4 · La corrosión del acero, y el zinc que lo protege
    que: |
      **Qué se busca.** Ver dónde se oxida el acero —las zonas anódicas— y
      cómo un metal más activo lo protege si se le une: la protección catódica
      por ánodo de sacrificio.

      **Equipo y reactivos.** Dos placas de Petri, dos clavos de acero, uno de
      acero galvanizado —recubierto de zinc—, hilo de cobre y una placa de
      acero pulida a espejo. Un gel de agar-agar con cloruro sódico, que hace
      de puente salino, y dos indicadores: el **hexacianoferrato**, que según
      el fundamento forma un complejo **azul** con el Fe²⁺ y marca los
      ánodos, y la **fenolftaleína**, que se vuelve **rosa** con los OH⁻ y
      marca los cátodos.

      **Qué se observa.** Los colores que salen alrededor de cada clavo y de
      una gota del gel sobre el acero pulido.

      $$
      \text{Fe} \rightarrow \text{Fe}^{2+} + 2e^{-}
      \qquad
      \text{Zn} \rightarrow \text{Zn}^{2+} + 2e^{-}
      $$

      $$
      \text{O}_2 + 2\,\text{H}_2\text{O} + 4e^{-} \rightarrow 4\,\text{OH}^{-}
      $$

      $$
      \text{Fe}^{2+} + 2\,\text{OH}^{-} \rightarrow \text{Fe(OH)}_2
      $$

      El sitio no tiene un apartado de corrosión: el galvanizado solo se
      nombra al final de los tratamientos termoquímicos del tema 6, y la
      práctica está resuelta como ejercicio guiado en ese tema.

      *Procedencia: Práctica 4 · Guion «Protección catódica por ánodo de
      sacrificio» y «Fundamento electroquímico de la corrosión del acero».*
    trabajo:
      - Preparar las dos disoluciones indicadoras y el gel, que se hierve con el agar-agar y la sal y lleva 2 ml de cada indicador.
      - En una placa, un clavo de acero unido con hilo de cobre a uno galvanizado y otro clavo de acero suelto, cubiertos de gel hasta que gelifique.
      - "Seguir la evolución de los colores y explicar qué hace de ánodo y qué de cátodo en cada clavo. En las fotos de la práctica el clavo suelto sale pardo de herrumbre, no azul: el guion pide ferrocianuro, y el azul directo con el Fe²⁺ es el del ferricianuro."
      - Echar una gota del gel sobre el acero pulido y explicar por qué el centro y el borde de la gota se colorean distinto.
    donde:
      tema: t06-tratamientos-termicos
      texto: Los tratamientos termoquímicos
      apartado: los-tratamientos-termoquímicos
    ejercicios:
      - ejcmlab-p4-anodos-y-catodos

  - tema: 3
    practica: 5
    titulo: Práctica 5 · El trabajo en frío de un hilo de cobre
    que: |
      **Qué se busca.** Deformar en frío hilos de cobre puro y construir la
      curva de sus propiedades mecánicas frente al trabajo en frío.

      **Equipo y datos.** La máquina de tracción, con hilos de 100 mm de
      longitud inicial y una velocidad de 100 mm/min, y la medida de los
      diámetros antes y después de estirar cada hilo.

      **Qué se mide.** El trabajo en frío de cada hilo y, al ensayarlo a
      rotura, su límite elástico —aquí, para ir rápido, la tensión donde la
      curva deja de ser recta—, su tensión máxima y su ductilidad.

      $$
      \%TF = \frac{A_0 - A_f}{A_0}\cdot 100
      = \left(1 - \frac{d_f^{2}}{d_0^{2}}\right)\cdot 100
      $$

      *Procedencia: Práctica 5 · Guion «Determinación práctica de los efectos
      del trabajo en frío» y la presentación «Experimental: explicación TF».*
    trabajo:
      - Ensayar a rotura un hilo sin deformar, para tener las propiedades de partida.
      - Con cada hilo nuevo, medir el diámetro, estirarlo en la máquina lo que marca la tabla del guion —0, 5, 10, 15 y 20 mm—, soltarlo, medir el diámetro final y calcular su trabajo en frío.
      - Volver a ensayar cada hilo estirado hasta rotura y anotar el límite elástico, la tensión máxima y la ductilidad.
      - Representar las tres propiedades frente al trabajo en frío, explicar la tendencia con las dislocaciones y compararla con la bibliografía.
    donde:
      tema: t03-estructura-cristalina
      texto: Cómo se endurece un metal
      apartado: cómo-se-endurece-un-metal
    ejercicios:
      - ejcmlab-p5-trabajo-en-frio

  - tema: 6
    practica: 6
    titulo: Práctica 6 · Cuatro tratamientos térmicos al acero F125
    que: |
      **Qué se busca.** Austenizar cuatro piezas de acero F125, enfriarlas de
      cuatro maneras —recocido, normalizado, temple y temple más revenido— y
      comparar su dureza y su microestructura con las de una pieza sin tratar.

      **Equipo y condiciones.** Una mufla, agua para templar, un durómetro
      Rockwell C —150 kg y cono de diamante, con la lectura en la escala negra—
      y el microscopio. El F125 tiene de 0,38 a 0,45 % de C, con cromo y
      molibdeno, y el guion le da HRC 32 de partida. La hoja de datos austeniza
      a 900 °C durante 45 minutos y enfría así: el recocido, dentro de la mufla
      apagada; el normalizado, al aire; el temple, en agua; y el temple más
      revenido, en agua y revenido a 400 °C una hora. El guion pone el revenido
      entre 450 y 600 °C.

      **Qué se mide.** La dureza HRC de las cinco piezas y, al microscopio, si
      cada muestra tiene poco, medio o mucho carbono. El guion no trae
      fórmulas; para leer el carbono por la cantidad de perlita sirve la regla
      de la palanca del tema 4:

      $$
      W_{\text{perlita}} = \frac{C_0 - 0{,}022}{0{,}76 - 0{,}022}
      $$

      La dureza que da cada microestructura, que es lo que ordena las cuatro
      piezas, está explicada en el tema 5, en «Qué dureza da cada
      microestructura»; el enlace de abajo lleva al recocido y el normalizado
      del tema 6.

      *Procedencia: Práctica 6 · Guion «Tratamientos térmicos del acero» y la
      hoja «Dureza HRC y microscopio: datos experimentales».*
    trabajo:
      - Austenizar las cuatro piezas y enfriar cada una a su manera, anotando cómo.
      - Medir la dureza Rockwell C de las cuatro y de la pieza de referencia sin tratar, y rellenar la tabla de tratamiento y dureza del guion.
      - Mirar tres muestras al microscopio y decidir, por la proporción de perlita, si tienen poco, medio o mucho carbono.
      - Explicar cada microestructura —ferrita y perlita gruesa, ferrita y perlita fina, martensita, martensita revenida— y por qué ordena las durezas.
    donde:
      tema: t06-tratamientos-termicos
      texto: El recocido de los aceros
      apartado: el-recocido-de-los-aceros
    ejercicios:
      - ejcmlab-p6-tratamientos-f125
