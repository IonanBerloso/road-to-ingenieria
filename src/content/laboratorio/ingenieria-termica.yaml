asignatura: ingenieria-termica
herramienta: de ordenador, con Termograf y en las sesiones de TermoLagun,
enIndice: las prácticas de ordenador, el 32 % de la nota en la evaluación continua; qué pide cada una, y la sesión de TermoLagun resuelta paso a paso.
entradilla: >-
  Son las prácticas de ordenador, que en la evaluación continua valen el 32 %
  de la nota. Aquí no se entregan: se dice qué pide cada una, y la sesión que
  es un ejercicio de la colección está resuelta paso a paso.
fuente: |
  «Guía de Termograf y modo de entrega» y el ejercicio 4 de TermoLagun con su
  resolución · Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa
  (UPV/EHU). Termograf es un programa de la Universidad de Zaragoza, con
  licencia gratuita de estudiante en termograf.unizar.es; los ficheros de cada
  ejercicio los reparte la asignatura en eGela, y aquí no se copia ninguno. El
  32 % sale de la presentación de la asignatura, lámina 14, «Evaluación».
aviso: |
  Esta página **no corrige nada y no sustituye a las prácticas**. Las de
  ordenador se entregan en Termograf y en las sesiones de TermoLagun, y lo que
  se corrige es lo que se escribe allí. Aquí está lo que se puede preparar
  antes: el orden de pasos que pide Termograf en cada ejercicio, y la sesión 4
  de TermoLagun, que es el ejercicio 7.8 de la colección del tema 7 y está
  resuelta como ejercicio guiado. Las otras sesiones y las dos tareas de
  laboratorio (GL) tienen su guion en eGela, y aquí no están.

actividades:
  - tema: 3
    titulo: Un ejercicio de Termograf, en el orden que pide su guía
    programa: Termograf
    que: |
      Un diagrama termodinámico en el que se crean los estados, los procesos y
      los ciclos del ejercicio, y una zona de datos con las propiedades de cada
      uno. El enunciado se abre desde el propio programa y tiene al lado la
      zona de respuestas, que es lo que se corrige.
    trabajo:
      - "Antes de dibujar nada, cinco elecciones y en este orden: el sistema —masa de control o volumen de control, en energía o en potencia, y el convenio ΔU = Q − W—, el modelo —sustancia real, gas ideal o gas perfecto—, la sustancia, las unidades y el diagrama."
      - Crear cada estado y fijarlo en cuanto se conozcan dos propiedades intensivas independientes, para que no se mueva al trabajar con los demás.
      - Unir los estados con el proceso que toca y, si el ejercicio es un ciclo, cerrarlo haciendo coincidir el último estado con el primero.
      - Crear como variable, en el editor de ecuaciones, cualquier magnitud que el programa no dé, con los decimales en punto y sin el signo igual delante.
      - Escribir cada resultado en su casilla de la zona de respuestas, porque el dibujo no se corrige y las casillas sí.
    donde:
      tema: t03-sustancias-puras
      texto: "Decidir la zona: el paso que nadie escribe"

  - tema: 7
    titulo: La sesión 4 de TermoLagun, la mezcla que pierde calor
    que: |
      Se mezclan 3 kg/s de agua a 20 bar y 400 °C con 0,5 kg/s de agua a
      30 °C, y durante la mezcla se pierden 908 kW hacia un ambiente a 20 °C.
      Es el ejercicio 7.8 de la colección del tema 7, y está resuelto como
      ejercicio guiado entre los del tema, con las tablas de vapor del sitio.
    trabajo:
      - Decidir la zona de cada corriente —la de 400 °C es vapor sobrecalentado; la de 30 °C, líquido— y sacar sus entalpías.
      - Con el balance de energía de la mezcla, la entalpía de salida, y con ella el título y el volumen específico de la mezcla.
      - Con el balance de exergía, la exergía destruida y el rendimiento exergético, tomando como referencia 15 °C y 1 bar.
    donde:
      tema: t07-analisis-exergetico
      texto: La exergía de flujo, y el rendimiento exergético
