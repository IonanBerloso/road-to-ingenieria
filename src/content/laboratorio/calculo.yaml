asignatura: calculo
fuente: |
  Guiones «Actividades de laboratorio con GeoGebra», capítulos 1, 2, 4, 5, 6, 8
  y 11 · Cálculo, Grado en Ingeniería, UPV/EHU. Los nueve programas `.ggb` los
  distribuye la asignatura; aquí no se copia ninguno.
aviso: |
  Esta página **no corrige nada y no sustituye al laboratorio**. Es un índice de
  lo que hay: qué programa se usa en cada tema, qué deja ver y qué se pide
  hacer con él, resumido, con el enlace al apartado donde eso mismo está
  explicado aquí. Los guiones y los ficheros son de la asignatura y se piden en
  el aula virtual. Existe porque el resto del sitio prepara el examen escrito, y
  el examen escrito no es toda la asignatura: siete temas tienen además una
  sesión de ordenador que se evalúa, y no nombrarla dejaba creer que no está.

actividades:
  - tema: 1
    titulo: El producto de complejos, visto como giro y cambio de escala
    programa: transformaciones.ggb
    que: |
      Dos vistas gráficas a la vez: en una se construye una cadena de números
      complejos, cada uno a partir del anterior, y en la otra se ven los mismos
      números en otro orden. Multiplicar deja de ser una fórmula y se convierte
      en lo que hace: girar y estirar.
    trabajo:
      - Definir un complejo desde su módulo y su argumento y encadenar seis más, cada uno a partir del anterior.
      - Reconocer, mirando la segunda vista, qué operación lleva de cada número al siguiente cuando el orden cambia.
      - Usar las propiedades de cada variable para decidir en qué vista se dibuja.
    donde:
      tema: t01-complejos
      texto: La forma polar, y por qué el producto es un giro

  - tema: 2
    titulo: La convergencia de una sucesión, con su épsilon y su banda
    programa: sucesion.ggb
    que: |
      Los términos de la sucesión como puntos del plano, el límite L, el entorno
      de radio épsilon a su alrededor y una banda horizontal que enseña cuáles
      caen dentro. La definición deja de ser una frase con dos cuantificadores y
      pasa a ser algo que se mira.
    trabajo:
      - Introducir una sucesión cualquiera y su límite, y buscar a ojo a partir de qué término se queda dentro de la banda.
      - Repetir con siete sucesiones del guion, entre ellas las que llevan factoriales y las que salen del número e.
      - "Usar la recta y = M para estudiar las que no están acotadas: a partir de qué término superan M."
    donde:
      tema: t02-sucesiones
      texto: Qué significa converger

  - tema: 2
    titulo: La serie, que es la sucesión de sus sumas parciales
    programa: serie.ggb
    que: |
      Lo mismo que el anterior, pero dibujando las sumas parciales en vez de los
      términos. Enseña de un vistazo la diferencia que más cuesta: que el
      término tienda a cero no dice nada, y que lo que converge o no es la
      sucesión de sumas.
    trabajo:
      - Comparar la armónica con la de los cuadrados, que se parecen término a término y no se parecen en nada al sumarlas.
      - Ver qué le pasa a la geométrica según el valor de la razón.
      - Mirar una alternada y entender por qué las sumas parciales saltan por encima y por debajo del límite.
    donde:
      tema: t02-sucesiones
      texto: Series, y la primera pregunta que hay que hacerse

  - tema: 4
    titulo: Lagrange y Rolle, y el punto que garantizan
    programa: Lagrange y Rolle.ggb
    que: |
      La función, su derivada, la secante entre los dos extremos del intervalo y
      la horizontal a la altura de la velocidad media. El punto del teorema es
      donde la derivada corta esa horizontal, y se ve moverse al cambiar el
      intervalo.
    trabajo:
      - Elegir un intervalo donde el teorema del valor medio se pueda aplicar y localizar el punto a ojo, antes de calcularlo.
      - Calcularlo después y comprobar que coincide.
      - Repetir en un intervalo donde el teorema NO se pueda aplicar, y mirar qué es exactamente lo que falla.
      - "Hacer lo mismo con Rolle: buscar el punto de derivada nula, y luego un intervalo donde no lo haya."
    donde:
      tema: t04-estudio-local
      texto: Los teoremas del valor medio

  - tema: 4
    titulo: El polinomio de Taylor, y cuánto orden hace falta
    programa: Teorema de Taylor.ggb
    que: |
      La función y sus polinomios de Taylor de orden uno a tres alrededor de un
      punto, con las derivadas calculadas por el propio programa. El primero es
      la recta tangente; los demás se van pegando a la curva.
    trabajo:
      - Fijar el punto, el desplazamiento y el orden, y acotar el error que se comete al aproximar.
      - Buscar el orden más pequeño que deja el error por debajo de una diezmilésima.
      - Comprobar con ese orden que el error real es menor que la cota.
      - "Responder qué pasa al alejarse del punto: si hace falta más orden o menos."
    donde:
      tema: t04-estudio-local
      texto: El polinomio de Taylor

  - tema: 5
    titulo: El cambio de variable, y los límites que cambian con él
    programa: cambio de variable.ggb
    que: |
      Dos vistas: en una, la función que se integra; en la otra, la función del
      cambio. Los nuevos límites se leen en la segunda, como los cortes de esa
      función con dos rectas horizontales, y el programa calcula las dos
      integrales para compararlas.
    trabajo:
      - Elegir la función y el cambio, y localizar en la segunda vista los dos nuevos límites de integración.
      - Comprobar que el valor de la integral es el mismo antes y después del cambio.
      - Fijarse en que las dos vistas no usan los mismos ejes, que es de donde sale la mitad de los errores.
    donde:
      tema: t05-integracion
      texto: El cambio de variable

  - tema: 5
    titulo: El teorema de la media, y la altura del rectángulo
    programa: Teorema de la media.ggb
    que: |
      La integral, la longitud del intervalo y su cociente —el valor medio—
      dibujado como recta horizontal. Los puntos donde esa recta corta la
      función son los que el teorema garantiza.
    trabajo:
      - Introducir la función asignada, localizar el punto del teorema y comprobar la interpretación geométrica.
      - Elegir después un intervalo donde el teorema no se pueda aplicar y mirar qué pasa con la tesis allí.
    donde:
      tema: t05-integracion
      texto: El valor medio de una función

  - tema: 6
    titulo: La superficie, sus curvas de nivel y el gradiente encima
    que: |
      Esta actividad no trae programa cerrado: se construye en GeoGebra a partir
      de una función asignada, con el comando de curva implícita para el mapa de
      niveles. Lo que se monta es exactamente la figura que el examen pide
      dibujar a mano.
    trabajo:
      - Representar la superficie y, aparte, su mapa de curvas de nivel.
      - Añadir el plano tangente en un punto cualquiera, y el plano secante que pasa por él.
      - Dibujar el gradiente sobre el mapa de niveles y hacer visible su módulo.
      - Presentar tres situaciones distintas del gradiente sobre el mapa y explicar qué propiedad se cumple en cada una.
    donde:
      tema: t06-varias-variables
      texto: El gradiente, y las tres preguntas que contesta

  - tema: 8
    titulo: La integral de línea, el campo conservativo y Green
    programa: integralcurvilinea.ggb
    que: |
      El campo vectorial como una malla de flechas, dos trayectorias de trabajo
      que se pueden deformar arrastrando sus puntos, y la integral recalculada
      al vuelo. Es la manera de ver de una vez qué significa que el valor no
      dependa del camino.
    trabajo:
      - Calcular la integral a lo largo de una curva y repetirla deformándola sin mover los extremos.
      - Hacer lo mismo con la otra curva y comparar.
      - Cerrar una trayectoria circular y leer lo que sale.
      - Comprobar analíticamente la condición de campo conservativo y, si se cumple, obtener la función potencial.
      - Cambiar a un campo distinto y calcular con la fórmula de Green la integral sobre una curva cerrada.
    donde:
      tema: t08-integral-curvilinea
      texto: Cuándo una integral de línea no depende del camino

  - tema: 11
    titulo: La serie de Fourier, con sus armónicos y su espectro
    programa: Fourier.ggb
    que: |
      La función periódica, la suma de sus N primeros armónicos y el espectro
      discreto, los tres a la vez. Subir N es ver cómo la suma se va pegando a
      la función, y ver dónde no lo consigue.
    trabajo:
      - Introducir una función periódica y dibujar su aproximación para cuatro valores distintos de N.
      - En un punto de salto, comprobar que la serie tiende a la media de los dos límites laterales.
      - En un punto donde la función es continua, comprobar que tiende al valor de la función.
      - Mirar qué les pasa a los coeficientes y a la amplitud del armónico k-ésimo según crece k.
    donde:
      tema: t11-fourier
      texto: El teorema de Dirichlet
