ejercicios:
  - id: ejter-dentro-o-fuera-de-la-campana
    titulo: Tres volúmenes a la misma presión
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería, sobre el procedimiento de
      decisión de zona del Tema 3 de la asignatura. Los valores de saturación
      a 1 bar se leen en las tablas de vapor, y son los mismos que usa el
      ejercicio 3.2 de la colección. No es de examen.
    nivel: ejemplo
    enunciado: |
      Tres recipientes contienen agua, los tres a $P = 1\ \text{bar}$, con
      volúmenes específicos distintos:

      - **A**: $v_A = 0{,}0010018\ \text{m}^3/\text{kg}$
      - **B**: $v_B = 0{,}85\ \text{m}^3/\text{kg}$
      - **C**: $v_C = 3{,}0\ \text{m}^3/\text{kg}$

      a) ¿En qué zona está cada uno?

      b) Para el que esté dentro de la campana, calcular su título.

      *Los volúmenes de saturación a 1 bar, de [la tabla de saturación por
      presión](/road-to-ingenieria/ingenieria-termica/tablas/#saturacion-presion),
      como en el examen se sacan del anexo.*
    pide: La zona de cada uno de los tres, y el título del que tenga.
    pasos:
      - tipo: reconocer
        pregunta: |
          Con la presión dada y el volumen específico dado, ¿qué dos números
          hay que mirar antes de abrir ninguna otra tabla?
        opciones:
          - texto: >-
              El volumen específico del líquido saturado y el del vapor
              saturado seco a esa presión, y comparar el dato con los dos
            correcta: true
            mensaje: |
              Eso es. Esos dos números parten la recta de volúmenes en tres
              tramos, y cada tramo se calcula con una tabla distinta. Cuestan
              diez segundos y deciden la mitad del ejercicio.
          - texto: >-
              La temperatura de saturación a esa presión, para compararla con
              la temperatura del enunciado
            mensaje: |
              Es el procedimiento correcto **cuando el enunciado da la
              temperatura**. Aquí no la da: da el volumen específico, así que
              la comparación tiene que ser con volúmenes.
          - texto: >-
              El título, que es el que dice si hay dos fases
            mensaje: |
              El título no está tabulado: se calcula, y solo tiene sentido si
              ya sabes que estás dentro de la campana. Es la consecuencia de
              la decisión, no la forma de tomarla.

      - tipo: calcular
        titulo: El título del recipiente B
        pregunta: |
          $v_B = 0{,}85$ está entre $v'$ y $v''$, así que hay dos fases.
          ¿Cuál es su título?
        respuesta:
          tipo: numero
          valor: '0.5015'
          tolerancia: 0.002
          formato: un número entre 0 y 1
        distractores:
          - valor: '0.4985'
            mensaje: |
              Has calculado la fracción de líquido, $1-x$. El título es la
              fracción de **vapor**: comprueba que el numerador es
              $v - v'$ y no $v'' - v$.
          - valor: '0.9994'
            mensaje: |
              Eso es la fracción de **volumen** ocupada por el vapor, no la de
              masa. Son cosas muy distintas y el título es la de masa: el
              vapor llena casi todo el recipiente siendo solo la mitad del
              agua que hay dentro. Confundirlas es el error que hace que los
              títulos parezcan siempre altísimos.
        pista: |
          $x = (v - v')/(v'' - v')$, con la fila de 1 bar de la tabla de
          saturación: $v' = 0{,}0010432$ y $v'' = 1{,}6939\ \text{m}^3/\text{kg}$.
        desarrollo: |
          $$
          x_B = \frac{v_B - v'}{v'' - v'}
          = \frac{0{,}85 - 0{,}0010432}{1{,}6939 - 0{,}0010432}
          = 0{,}5015
          $$

          Medio kilo de vapor por cada kilo de mezcla. Y sin embargo ese medio
          kilo de vapor ocupa el 99,94 % del volumen: el líquido, con la misma
          masa, cabe en poco más de medio litro por kilogramo.

      - tipo: justificar
        pregunta: Ordena la clasificación de los tres. Una pieza es falsa.
        piezas:
          - texto: >-
              A tiene 0,0010018 m³/kg, menor que $v' = 0{,}0010432$: está a la
              izquierda de la campana, es líquido comprimido.
          - texto: >-
              B tiene 0,85 m³/kg, entre $v'$ y $v''$: está dentro de la
              campana, es vapor húmedo, y por eso tiene título.
          - texto: >-
              C tiene 3,0 m³/kg, mayor que $v'' = 1{,}6939$: está a la derecha
              de la campana, es vapor sobrecalentado.
          - texto: >-
              Y como los tres están a la misma presión, los tres están a la
              misma temperatura, 99,6 °C.
            trampa: true
            mensaje: |
              Solo B lo está. La igualdad entre presión y temperatura de
              saturación vale **dentro** de la campana, que es donde las
              isotermas y las isóbaras son la misma horizontal. Fuera, $P$ y
              $T$ vuelven a ser independientes: A puede estar a 20 °C y C a
              300 °C, los dos a 1 bar.
    resolucion: |
      **a) Las tres zonas.** Con $v' = 0{,}0010432$ y $v'' = 1{,}6939$ a
      1 bar, la recta de volúmenes queda partida en tres:

      | recipiente | $v$ | comparación | zona |
      |---|---|---|---|
      | A | 0,0010018 | $v < v'$ | líquido comprimido |
      | B | 0,85 | $v' < v < v''$ | vapor húmedo |
      | C | 3,0 | $v > v''$ | vapor sobrecalentado |

      **b) El título de B.**

      $$
      x_B = \frac{0{,}85 - 0{,}0010432}{1{,}6939 - 0{,}0010432} = 0{,}5015
      $$

      **Lo que hay que llevarse.** La misma sustancia, la misma presión y tres
      estados que se calculan de tres maneras distintas. Nada en el enunciado
      lo dice: lo dicen los dos números de la tabla de saturación, y por eso se
      miran siempre primero.

  - id: ejter-el-exponente-que-se-lee-de-dos-estados
    titulo: El exponente que se lee de dos estados
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería, sobre la ley del proceso
      politrópico del Tema 3 de la asignatura. No es de examen ni de la
      colección.
    nivel: ejemplo
    enunciado: |
      Un gas ideal pasa de $P_1 = 2\ \text{bar}$ y
      $v_1 = 0{,}5\ \text{m}^{3}/\text{kg}$ a $P_2 = 1\ \text{bar}$ y
      $v_2 = 0{,}8\ \text{m}^{3}/\text{kg}$ según un proceso politrópico.

      a) ¿Cuál es el exponente politrópico?

      b) ¿El proceso está por encima o por debajo del adiabático, si
      $\gamma = 1{,}4$?
    pide: El exponente politrópico, y dónde queda respecto del adiabático.
    pasos:
      - tipo: reconocer
        pregunta: |
          Con dos estados y la ley $Pv^{n} = \text{cte}$, ¿cómo se despeja el
          exponente?
        opciones:
          - texto: >-
              Igualando $P_1v_1^{n} = P_2v_2^{n}$ y tomando logaritmos en los
              dos lados
            correcta: true
            mensaje: |
              Exacto. El exponente está arriba, así que para bajarlo hace
              falta un logaritmo. Es la única manera de despejarlo cuando lo
              que tienes son dos estados.
          - texto: >-
              Dividiendo las presiones entre los volúmenes específicos
            mensaje: |
              Eso daría un número, pero no el exponente: la relación no es
              lineal. El $n$ está en el exponente y no se puede despejar sin
              logaritmos.
          - texto: >-
              No se puede: hacen falta las temperaturas
            mensaje: |
              Con $Pv^{n} = \text{cte}$ bastan las presiones y los volúmenes
              específicos. Las temperaturas darían el mismo resultado por otro
              camino, porque la ecuación de estado las relaciona con estos
              cuatro datos.

      - tipo: calcular
        titulo: El exponente
        pregunta: |
          ¿Cuánto vale $n$?
        respuesta:
          tipo: numero
          valor: '1.475'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '0.678'
            mensaje: |
              Has invertido la fracción de logaritmos. Comprueba con el
              sentido físico: si al expandirse la presión cae a la mitad
              mientras el volumen sube un 60 %, la caída de presión es la más
              rápida de las dos, y eso obliga a un exponente **mayor** que uno.
          - valor: '1.6'
            mensaje: |
              Ese es el cociente $v_2/v_1$, no el exponente. La relación de
              volúmenes es un dato del problema; el exponente es lo que hay
              que sacar de él y de la relación de presiones.
        pista: |
          De $P_1v_1^{n} = P_2v_2^{n}$ sale
          $n = \ln(P_1/P_2)\,/\,\ln(v_2/v_1)$.
        desarrollo: |
          $$
          n = \frac{\ln(P_1/P_2)}{\ln(v_2/v_1)}
          = \frac{\ln 2}{\ln 1{,}6}
          = \frac{0{,}6931}{0{,}4700} = 1{,}475
          $$

      - tipo: justificar
        pregunta: Ordena la respuesta al apartado b). Una pieza es falsa.
        piezas:
          - texto: >-
              El exponente sale 1,475, y el del proceso adiabático reversible
              es $\gamma = 1{,}4$.
          - texto: >-
              Luego el proceso está **por encima** del adiabático: cae la
              presión más deprisa de lo que caería sin intercambiar calor.
          - texto: >-
              Eso significa que el gas, además de expandirse, cede calor
              durante el proceso.
          - texto: >-
              Y como $n > \gamma$, el proceso no puede ser reversible.
            trampa: true
            mensaje: |
              El exponente no decide la reversibilidad. Que exista una ley
              $Pv^{n} = \text{cte}$ con $n$ constante ya **es** la hipótesis
              de reversibilidad interna: el gas tiene una presión definida en
              cada instante. Lo que $n$ dice es cuánto calor entra o sale, no
              cómo de bien va el proceso.
    resolucion: |
      **a) El exponente.** De $P_1v_1^{n} = P_2v_2^{n}$, tomando logaritmos:

      $$
      n = \frac{\ln(P_1/P_2)}{\ln(v_2/v_1)} = \frac{\ln 2}{\ln 1{,}6}
      = 1{,}475
      $$

      **b) Por encima del adiabático.** $1{,}475 > 1{,}4$, así que la presión
      cae más deprisa de lo que caería en una expansión sin intercambio de
      calor: el gas cede calor mientras se expande.

      **La comprobación que conviene hacer siempre.** Los cuatro exponentes con
      nombre —0 isóbaro, 1 isotermo, $\gamma$ adiabático, $\pm\infty$ isócoro—
      sirven de regla graduada. Situar el resultado entre ellos dice, sin más
      cuentas, qué tipo de proceso te ha salido; y si cae donde el enunciado no
      describe, hay un error antes.

  - id: ejter-cuatro-estados-y-la-zona-de-cada-uno
    titulo: Cuatro estados del agua, y la zona de cada uno
    fuente: >-
      Ejercicio propio · Road to Ingeniería. De nivel de colección, escrito
      para practicar la lectura de las tablas de vapor y la interpolación. No
      es de la colección ni ha caído en examen.
    nivel: practica
    enunciado: |
      Cuatro estados del agua:

      - **A**: $5\ \text{bar}$ y $120\ \text{°C}$
      - **B**: $0{,}3\ \text{bar}$ y $80\ \text{°C}$
      - **C**: $70\ \text{°C}$ y $v = 3\ \text{m}^3/\text{kg}$
      - **D**: $4\ \text{bar}$ y $v = 0{,}5\ \text{m}^3/\text{kg}$

      a) ¿En qué zona está cada uno?

      b) Para el que esté dentro de la campana, calcular su presión y su
      título.

      *Los valores de saturación, de [la tabla por
      presión](/road-to-ingenieria/ingenieria-termica/tablas/#saturacion-presion)
      y de [la tabla por
      temperatura](/road-to-ingenieria/ingenieria-termica/tablas/#saturacion-temperatura),
      como en el examen se sacan del anexo.*
    pide: La zona de cada uno de los cuatro, y la presión y el título del que esté en la campana.
    pasos:
      - tipo: reconocer
        pregunta: |
          El estado B está a 0,3 bar y 80 °C. ¿Qué hay que comparar para saber
          en qué zona está?
        opciones:
          - texto: >-
              Los 80 °C con la temperatura de saturación a 0,3 bar
            correcta: true
            mensaje: |
              Eso es. Con presión y temperatura se busca a qué temperatura
              hierve el agua a esa presión, y se compara: por encima, vapor
              sobrecalentado; por debajo, líquido comprimido. A 0,3 bar el agua
              hierve a 69,095 °C, así que B, a 80 °C, ya es vapor.
          - texto: >-
              Los 80 °C con 100 °C, que es donde hierve el agua
            mensaje: |
              El agua hierve a 100 °C a una presión concreta —1,0142 bar, según
              la tabla por temperatura—, no a cualquiera. A 0,3 bar hierve mucho
              antes, y el número con el que hay que comparar es el de esa
              presión.
          - texto: >-
              El volumen específico con $v'$ y $v''$ a 0,3 bar
            mensaje: |
              Sería lo correcto si el dato fuera un volumen, como en C y en D.
              En B lo que se tiene es una temperatura, y la comparación se hace
              con temperaturas.

      - tipo: calcular
        titulo: La presión del estado C
        pregunta: |
          El que cae dentro de la campana es C: 3 m³/kg queda entre $v'$ y
          $v''$ a 70 °C. ¿A qué presión está?
        respuesta:
          tipo: magnitud
          valor: '0.3120 bar'
          tolerancia: 0.005
          formato: una presión, con su unidad
        distractores:
          - valor: '1 bar'
            mensaje: |
              El enunciado no da la presión de C, y eso no la deja en la
              atmosférica. Dentro de la campana la presión la fija la
              temperatura: a 70 °C es la de saturación, y se lee en la tabla
              por temperatura.
          - valor: '0.3 bar'
            mensaje: |
              Esa es la fila de la tabla por presión cuya saturación queda más
              cerca de 70 °C —está a 69,095 °C—, pero no es 70. La tabla por
              temperatura tiene la fila de 70 °C y da la presión sin
              interpolar.
        pista: |
          Dentro de la campana, $P = P_{sat}(T)$: busca la fila de 70 °C en la
          tabla por temperatura.
        desarrollo: |
          En la campana presión y temperatura van juntas, así que la presión de
          C es la de saturación a 70 °C, y la tabla por temperatura la da
          directamente:

          $$
          P_C = P_{sat}(70\ \text{°C}) = 0{,}31201\ \text{bar}
          $$

          Algo más de 0,3 bar: por eso a 0,3 bar el agua hierve un poco por
          debajo de 70 °C.

      - tipo: calcular
        titulo: El título del estado C
        pregunta: |
          ¿Qué título tiene C?
        respuesta:
          tipo: numero
          valor: '0.5952'
          tolerancia: 0.002
          formato: un número entre 0 y 1
        distractores:
          - valor: '0.4048'
            mensaje: |
              Esa es la fracción de líquido, $1-x$. El título mide el vapor: en
              el numerador va $v - v'$, lo que el volumen se ha alejado del
              líquido saturado.
          - valor: '0.5737'
            mensaje: |
              Has usado $v'$ y $v''$ de la fila de 0,3 bar, cuya saturación está
              a 69,095 °C y no a 70. Con ese grado de diferencia $v''$ pasa de
              5,0395 a 5,2284 m³/kg, y el título se mueve dos centésimas. Entra
              en la tabla por temperatura, por la fila de 70 °C.
        pista: |
          $x = (v - v')/(v'' - v')$, con los dos volúmenes de la fila de 70 °C.
        desarrollo: |
          $$
          x_C = \frac{3 - 0{,}0010228}{5{,}0395 - 0{,}0010228} = 0{,}5952
          $$

          Seis décimas de la masa son vapor. Y casi todo el volumen: el
          líquido, con las otras cuatro décimas, no llega a medio litro por
          kilogramo de mezcla.

      - tipo: justificar
        pregunta: Ordena la clasificación de los cuatro. Una pieza es falsa.
        piezas:
          - texto: >-
              A: a 5 bar la saturación está a 151,83 °C, y A está a 120 °C,
              por debajo. Líquido comprimido.
          - texto: >-
              B: a 0,3 bar la saturación está a 69,095 °C, y B está a 80 °C,
              por encima. Vapor sobrecalentado.
          - texto: >-
              C: a 70 °C, 3 m³/kg queda entre $v' = 0{,}0010228$ y
              $v'' = 5{,}0395$. Vapor húmedo, a 0,31201 bar y con título
              0,5952.
          - texto: >-
              D: a 4 bar, $v'' = 0{,}46238$ y D tiene 0,5 m³/kg, por encima.
              Vapor sobrecalentado, aunque cerca de la campana.
          - texto: >-
              B está por debajo de 100 °C, así que es agua líquida: el agua
              hierve a 100 °C.
            trampa: true
            mensaje: |
              El agua hierve a 100 °C cuando está a 1,0142 bar, que es la
              presión que la tabla da para esa temperatura. A 0,3 bar hierve a
              69,095 °C, y a 80 °C ya es vapor. La temperatura de ebullición es la de
              saturación a la presión que haya, no un número fijo.
    resolucion: |
      **Qué se compara en cada caso.** Con presión y temperatura, la
      temperatura con la de saturación a esa presión. Con un volumen, el
      volumen con $v'$ y $v''$ a la presión o a la temperatura que se tenga.

      | estado | datos | comparación | zona |
      |---|---|---|---|
      | A | 5 bar, 120 °C | $120 < 151{,}83$ | líquido comprimido |
      | B | 0,3 bar, 80 °C | $80 > 69{,}095$ | vapor sobrecalentado |
      | C | 70 °C, 3 m³/kg | $0{,}0010228 < 3 < 5{,}0395$ | vapor húmedo |
      | D | 4 bar, 0,5 m³/kg | $0{,}5 > 0{,}46238$ | vapor sobrecalentado |

      **La presión y el título de C.** Dentro de la campana la presión es la
      de saturación a 70 °C, $P_C = 0{,}31201\ \text{bar}$, y

      $$
      x_C = \frac{3 - 0{,}0010228}{5{,}0395 - 0{,}0010228} = 0{,}5952
      $$

      **Lo que hay que llevarse.** El agua no hierve a 100 °C: hierve a la
      temperatura de saturación de la presión que tenga. B, a 80 °C, ya es
      vapor porque está a 0,3 bar, donde el agua hierve a 69,095 °C. Y D
      enseña por qué se compara siempre, aunque el dato parezca claro: a
      4 bar el vapor saturado seco ocupa 0,46238 m³/kg, y 0,5 queda fuera de
      la campana por poco.

  - id: ejter-el-condensador-que-fija-su-presion
    titulo: El condensador a 42,7 °C, y la presión que le toca
    fuente: >-
      Ejercicio propio · Road to Ingeniería. De nivel de colección, escrito
      para practicar la lectura de las tablas de vapor y la interpolación. No
      es de la colección ni ha caído en examen.
    nivel: practica
    enunciado: |
      En el condensador de una central de vapor, el vapor condensa a
      $42{,}7\ \text{°C}$: entra vapor saturado seco y sale líquido saturado,
      los dos a esa temperatura.

      a) ¿A qué presión trabaja el condensador?

      b) ¿Qué entalpía tiene el líquido que sale?

      *Las propiedades del agua, de [la tabla de saturación por
      temperatura](/road-to-ingenieria/ingenieria-termica/tablas/#saturacion-temperatura),
      como en el examen se sacan del anexo.*
    pide: La presión del condensador y la entalpía del líquido que sale.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado da una temperatura y nada más. ¿Por qué la temperatura
          sola fija la presión del condensador?
        opciones:
          - texto: >-
              Porque el vapor está condensando: dentro de la campana presión y
              temperatura no son independientes, y la presión es la de
              saturación a 42,7 °C
            correcta: true
            mensaje: |
              Eso es. Mientras conviven líquido y vapor, presión y temperatura
              son el mismo dato leído en dos columnas de la tabla. Fijada una,
              la otra sale de ella.
          - texto: >-
              No la fija: haría falta además el título del vapor
            mensaje: |
              El título hace falta para las propiedades de la mezcla, no para
              la presión. Toda la horizontal de la campana, de título 0 a
              título 1, está a la misma presión y a la misma temperatura.
          - texto: >-
              Es la atmosférica, porque el líquido sale del condensador
            mensaje: |
              Nada en el enunciado dice que el condensador esté abierto, y la
              tabla dice que no puede estarlo: a 1 bar el agua condensa a
              99,606 °C, no a 42,7. Para condensar a 42,7 °C la presión tiene
              que ser la de saturación a esa temperatura.

      - tipo: calcular
        titulo: La presión del condensador
        pregunta: |
          42,7 °C no es una fila de la tabla. ¿A qué presión trabaja el
          condensador?
        respuesta:
          tipo: magnitud
          valor: '0.08518 bar'
          tolerancia: 0.005
          formato: una presión, con su unidad
        distractores:
          - valor: '0.08651 bar'
            mensaje: |
              Esa es la fila de 43 °C tal cual. 42,7 °C está entre las filas de
              42 y 43, a siete décimas del camino desde 42, y la presión se
              interpola con esa fracción. Quedarse con la fila más cercana
              cambia aquí la presión un 1,6 %.
          - valor: '0.08342 bar'
            mensaje: |
              Has medido la fracción desde el otro extremo: 0,3 en vez de 0,7.
              La fracción es lo que 42,7 se ha alejado de 42, y con ella se
              avanza desde la presión de 42 °C.
        pista: |
          Entre las filas de 42 y 43 °C: $P = P_{42} + 0{,}7\,(P_{43} - P_{42})$.
        desarrollo: |
          Con las presiones de las filas de 42 y 43 °C:

          $$
          P = 0{,}082096 + 0{,}7\,(0{,}086508 - 0{,}082096) = 0{,}085184\ \text{bar}
          $$

          Unos 8,5 kPa: el condensador trabaja muy por debajo de la presión
          atmosférica. Y se puede comprobar por el otro lado: la tabla por
          presión trae la fila de 0,085 bar, con la saturación a 42,663 °C,
          casi la del enunciado.

      - tipo: calcular
        titulo: La entalpía del líquido que sale
        pregunta: |
          El líquido sale saturado a 42,7 °C. ¿Qué entalpía tiene?
        respuesta:
          tipo: magnitud
          valor: '178.8 kJ/kg'
          tolerancia: 0.002
          formato: una entalpía específica, con su unidad
        distractores:
          - valor: '2578.4 kJ/kg'
            mensaje: |
              Esa es la columna de al lado, $h''$: la del vapor saturado seco,
              el que **entra**. El que sale es líquido, y su entalpía es $h'$.
              Entre las dos van unos 2.400 kJ/kg, que es lo que cede cada kilo
              al condensar.
          - valor: '180.07 kJ/kg'
            mensaje: |
              Esa es la fila de 43 °C tal cual, sin interpolar. 42,7 está al
              70 % del camino desde la fila de 42 °C, y $h'$ también:
              $175{,}89 + 0{,}7\cdot 4{,}18$.
        pista: |
          La misma fracción que para la presión, 0,7, en la columna $h'$.
        desarrollo: |
          $$
          h' = 175{,}89 + 0{,}7\,(180{,}07 - 175{,}89) = 178{,}82\ \text{kJ/kg}
          $$

          Es la entalpía con la que el líquido sale hacia la bomba. La del vapor
          que entra, en la columna de al lado, es 2578,4 kJ/kg, y la diferencia,
          2399,5 kJ/kg, es lo que cede cada kilo al condensar entero.

      - tipo: justificar
        pregunta: Ordena la lectura del condensador. Una pieza es falsa.
        piezas:
          - texto: >-
              Mientras el vapor condensa conviven líquido y vapor, y la presión
              es la de saturación a 42,7 °C.
          - texto: >-
              42,7 °C no es una fila de la tabla: se interpola entre 42 y
              43 °C, al 70 % del intervalo.
          - texto: >-
              Sale 0,085184 bar, unos 8,5 kPa: el condensador trabaja muy por
              debajo de la presión atmosférica.
          - texto: >-
              La misma fracción da $h' = 178{,}82$ kJ/kg para el líquido que
              sale.
          - texto: >-
              Y como el líquido y el vapor están a la misma temperatura, los
              dos tienen la misma entalpía.
            trampa: true
            mensaje: |
              Tienen la misma temperatura y la misma presión, pero no la misma
              entalpía: $h' = 178{,}82$ y $h'' = 2578{,}4$ kJ/kg. La diferencia,
              casi 2.400 kJ/kg, es el calor latente, lo que cede el vapor al
              condensar sin cambiar de temperatura. Son las dos columnas que se
              confunden cuando se lee la tabla deprisa.
    resolucion: |
      **La idea.** Mientras el vapor condensa conviven las dos fases, y ahí
      presión y temperatura no son independientes: la presión del condensador
      es la de saturación a 42,7 °C. No se elige; la impone la temperatura a la
      que se condensa.

      **a) La presión.** 42,7 °C cae entre las filas de 42 y 43 °C, al 70 %
      del intervalo:

      $$
      P = 0{,}082096 + 0{,}7\,(0{,}086508 - 0{,}082096) = 0{,}085184\ \text{bar}
      $$

      **b) La entalpía del líquido.** Con la misma fracción, en la columna
      $h'$:

      $$
      h' = 175{,}89 + 0{,}7\,(180{,}07 - 175{,}89) = 178{,}82\ \text{kJ/kg}
      $$

      **La comprobación.** La tabla por presión trae la fila de 0,085 bar, con
      la saturación a 42,663 °C y $h' = 178{,}67$ kJ/kg: casi el mismo estado,
      y casi los mismos números. Las dos tablas describen la misma curva de
      saturación, y entrar por una o por la otra tiene que dar lo mismo.

  - id: ejter-la-olla-a-presion-y-su-valvula
    titulo: La olla a presión, y la presión que entra en la tabla
    fuente: >-
      Ejercicio propio · Road to Ingeniería. De nivel de colección, escrito
      para practicar la lectura de las tablas de vapor y la interpolación. No
      es de la colección ni ha caído en examen.
    nivel: practica
    enunciado: |
      La válvula de una olla a presión deja salir vapor cuando dentro hay
      $0{,}8\ \text{bar}$ más que fuera, y fuera hay $1\ \text{bar}$. Mientras
      la válvula sopla, dentro conviven agua líquida y vapor.

      a) ¿A qué temperatura hierve el agua dentro de la olla?

      b) ¿Cuánta energía hace falta para evaporar cada kilogramo de esa agua?

      *Las propiedades del agua, de [la tabla de saturación por
      presión](/road-to-ingenieria/ingenieria-termica/tablas/#saturacion-presion),
      como en el examen se sacan del anexo.*
    pide: La temperatura de ebullición dentro de la olla y el calor latente a esa presión.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Con qué presión se entra en la tabla de saturación?
        opciones:
          - texto: >-
              Con 1,8 bar: la tabla está escrita en presiones absolutas, y los
              0,8 bar son lo que la olla tiene por encima de la presión de
              fuera
            correcta: true
            mensaje: |
              Eso es. La válvula mide diferencias, como un manómetro, y la tabla
              está referida al vacío. Sumar la presión exterior es lo primero
              que se hace con cualquier lectura relativa.
          - texto: >-
              Con 0,8 bar, que es la presión de la válvula
            mensaje: |
              Esa es la diferencia con el exterior, no la presión que hay
              dentro. A 0,8 bar el agua herviría a 93,5 °C, por debajo de lo que
              hierve en un cazo abierto, y una olla a presión existe justo para
              lo contrario.
          - texto: >-
              Con 1 bar, porque la válvula está abierta y dentro no puede haber
              más presión que fuera
            mensaje: |
              La válvula solo deja salir vapor mientras dentro hay 0,8 bar más
              que fuera: si la presión bajara de ahí, se cerraría. Por eso
              dentro se mantienen 1,8 bar mientras sopla.

      - tipo: calcular
        titulo: La temperatura de ebullición
        pregunta: |
          1,8 bar no es una fila de la tabla. ¿A qué temperatura hierve el agua
          dentro de la olla?
        respuesta:
          tipo: magnitud
          valor: '116.7 °C'
          tolerancia: 0.003
          formato: una temperatura, con su unidad
        distractores:
          - valor: '93.49 °C'
            mensaje: |
              Esa temperatura es la de una olla sin presión: a 0,8 bar, la
              lectura de la válvula, el agua hierve a 93,5 °C, y a 1 bar, la de
              fuera, a 99,6 °C. Dentro hay las dos sumadas, 1,8 bar, y en una
              olla a presión el agua tiene que hervir por encima de 100 °C.
          - valor: '120.21 °C'
            mensaje: |
              Esa es la fila de 2 bar tal cual. 1,8 bar está entre 1,5 y 2 bar,
              al 60 % del intervalo, y la temperatura se interpola con esa
              fracción. La fila más cercana se lleva tres grados y medio.
          - valor: '111.35 °C'
            mensaje: |
              Esa es la fila de 1,5 bar, sin interpolar. 1,8 bar no es 1,5:
              está al 60 % del camino hacia 2 bar, y la temperatura de
              saturación sube con la presión.
        pista: |
          Entre 1,5 y 2 bar, la fracción es $(1{,}8 - 1{,}5)/(2 - 1{,}5)$.
        desarrollo: |
          La fracción del intervalo, y con ella la temperatura:

          $$
          f = \frac{1{,}8 - 1{,}5}{2 - 1{,}5} = 0{,}6
          \qquad
          T = 111{,}35 + 0{,}6\,(120{,}21 - 111{,}35) = 116{,}67\ \text{°C}
          $$

          Diecisiete grados por encima de lo que hierve el agua en un cazo
          abierto a 1 bar, 99,606 °C. Para eso sirve la olla.

      - tipo: calcular
        titulo: La energía para evaporar un kilogramo
        pregunta: |
          ¿Cuánta energía hace falta para evaporar cada kilogramo de agua
          dentro de la olla?
        respuesta:
          tipo: magnitud
          valor: '2211 kJ/kg'
          tolerancia: 0.002
          formato: una energía por kilogramo, con su unidad
        distractores:
          - valor: '2701 kJ/kg'
            mensaje: |
              Esa es $h''$, la entalpía del vapor saturado a 1,8 bar. Lo que
              cuesta evaporar es la diferencia entre el vapor y el líquido del
              que sale, $l_v = h'' - h'$: el líquido ya trae sus 489,67 kJ/kg.
          - valor: '2273.5 kJ/kg'
            mensaje: |
              Ese es el calor latente a 0,8 bar, la lectura de la válvula.
              Dentro de la olla hay 1,8 bar, y a más presión el calor latente
              es menor.
          - valor: '2201.5 kJ/kg'
            mensaje: |
              Ese es el calor latente de la fila de 2 bar, sin interpolar.
              Entre 1,5 y 2 bar hay que ir al 60 %, con $h'$ y con $h''$.
        pista: |
          $l_v = h'' - h'$, con las dos interpoladas a 1,8 bar.
        desarrollo: |
          Con la misma fracción, 0,6, en las dos columnas de entalpía:

          $$
          h' = 467{,}13 + 0{,}6\,(504{,}7 - 467{,}13) = 489{,}67
          $$

          $$
          h'' = 2693{,}1 + 0{,}6\,(2706{,}2 - 2693{,}1) = 2700{,}96
          $$

          $$
          l_v = 2700{,}96 - 489{,}67 = 2211{,}29\ \text{kJ/kg}
          $$

          Interpolar directamente el calor latente de las dos filas da lo
          mismo: la resta y la interpolación lineal se pueden hacer en
          cualquier orden.

      - tipo: justificar
        pregunta: Ordena el razonamiento de la olla. Una pieza es falsa.
        piezas:
          - texto: >-
              La tabla va en presiones absolutas: 0,8 bar por encima de 1 bar
              son 1,8 bar.
          - texto: >-
              1,8 bar está entre las filas de 1,5 y 2 bar, al 60 % del
              intervalo.
          - texto: >-
              Con agua y vapor juntos, la temperatura es la de saturación a
              1,8 bar: 116,67 °C.
          - texto: >-
              Cada kilogramo que se evapora se lleva
              $l_v = h'' - h' = 2211{,}29$ kJ/kg.
          - texto: >-
              Y si se sube el fuego, el agua se calienta por encima de
              116,67 °C.
            trampa: true
            mensaje: |
              Mientras quede agua líquida y la válvula mantenga 1,8 bar, la
              temperatura no se mueve de la de saturación: el calor de más
              evapora más agua, y la válvula deja salir ese vapor. En la
              campana presión y temperatura no son independientes, y por eso la
              olla cocina a temperatura fija.
    resolucion: |
      **La presión que entra en la tabla.** La válvula mide lo que la olla
      tiene por encima del exterior, y la tabla está en absolutas: dentro hay
      $1 + 0{,}8 = 1{,}8$ bar. Como conviven agua y vapor, el estado está en la
      campana y la temperatura es la de saturación a esa presión.

      **a) La temperatura.** 1,8 bar cae entre 1,5 y 2 bar, al 60 %:

      $$
      T = 111{,}35 + 0{,}6\,(120{,}21 - 111{,}35) = 116{,}67\ \text{°C}
      $$

      **b) El calor latente.** Con la misma fracción en $h'$ y en $h''$:

      $$
      l_v = h'' - h' = 2700{,}96 - 489{,}67 = 2211{,}29\ \text{kJ/kg}
      $$

      **Lo que hay que llevarse.** Con 0,8 bar, la lectura de la válvula,
      habría salido 93,5 °C: una olla a presión que hierve por debajo de un
      cazo. Cuando un resultado contradice para qué sirve el aparato, el error
      está en el dato que se llevó a la tabla.

  - id: ejter-el-titulo-que-sale-de-la-entalpia
    titulo: El título que sale de una entalpía
    fuente: >-
      Ejercicio propio · Road to Ingeniería. De nivel de colección, escrito
      para practicar la lectura de las tablas de vapor y la interpolación. No
      es de la colección ni ha caído en examen.
    nivel: practica
    enunciado: |
      Agua a $6\ \text{bar}$ con una entalpía específica de
      $2300\ \text{kJ/kg}$.

      a) ¿En qué zona está?

      b) ¿Cuál es su título?

      c) ¿Cuál es su volumen específico?

      d) ¿Y su energía interna específica?

      *Las propiedades del agua, de [la tabla de saturación por
      presión](/road-to-ingenieria/ingenieria-termica/tablas/#saturacion-presion),
      como en el examen se sacan del anexo.*
    pide: La zona, el título, el volumen específico y la energía interna.
    pasos:
      - tipo: reconocer
        pregunta: |
          El dato es una entalpía a 6 bar. ¿Cómo se decide la zona?
        opciones:
          - texto: >-
              Comparando 2300 con $h'$ y $h''$ a 6 bar: si queda entre las
              dos, es vapor húmedo
            correcta: true
            mensaje: |
              Eso es. La regla de los dos volúmenes vale con cualquier propiedad
              específica: se compara el dato con el valor del líquido saturado y
              con el del vapor saturado a esa presión. A 6 bar son 670,38 y
              2756,1, y 2300 queda en medio.
          - texto: >-
              Buscando 2300 en la tabla de vapor sobrecalentado a 6 bar
            mensaje: |
              Esa tabla empieza en el vapor saturado seco, con
              $h'' = 2756{,}1$, y sube desde ahí: ningún vapor sobrecalentado a
              6 bar tiene 2300 kJ/kg. Entrar en ella sin comparar antes es el
              error que más ejercicios tumba en este tema.
          - texto: >-
              Comparando con la temperatura de saturación a 6 bar
            mensaje: |
              Sería lo correcto si el dato fuera una temperatura. Aquí es una
              entalpía, y la comparación se hace con entalpías.

      - tipo: calcular
        titulo: El título
        pregunta: |
          2300 queda entre $h'$ y $h''$ a 6 bar. ¿Cuál es el título?
        respuesta:
          tipo: numero
          valor: '0.7813'
          tolerancia: 0.002
          formato: un número entre 0 y 1
        distractores:
          - valor: '0.2187'
            mensaje: |
              Esa es la fracción de líquido, $1-x$. El título mide el vapor: en
              el numerador va $h - h'$, lo que la entalpía se ha alejado de la
              del líquido saturado.
          - valor: '0.8345'
            mensaje: |
              Has dividido la entalpía entre $h''$ a secas. El título mide dónde
              cae $h$ entre $h'$ y $h''$, y el líquido saturado no está en cero:
              hay que restar $h'$ arriba y abajo.
        pista: |
          $x = (h - h')/(h'' - h')$, con la fila de 6 bar.
        desarrollo: |
          $$
          x = \frac{2300 - 670{,}38}{2756{,}1 - 670{,}38} = 0{,}7813
          $$

          Es la misma fórmula que con el volumen específico: la propiedad que
          se tenga, entre las de las dos fases.

      - tipo: calcular
        titulo: El volumen específico
        pregunta: |
          Con ese título, ¿qué volumen específico tiene el agua?
        respuesta:
          tipo: magnitud
          valor: '0.2468 m3/kg'
          tolerancia: 0.005
          formato: un volumen específico, con su unidad
        distractores:
          - valor: '0.0699 m3/kg'
            mensaje: |
              Has cambiado los pesos. El título multiplica al vapor,
              $v = x\,v'' + (1-x)\,v'$; con los pesos al revés sale el volumen
              de un agua casi líquida, y un título de 0,78 es sobre todo vapor.
          - valor: '0.3156 m3/kg'
            mensaje: |
              Ese es $v''$ a 6 bar, el del vapor saturado seco. El agua tiene un
              22 % de líquido, que apenas ocupa sitio pero pesa: el volumen de
              la mezcla es la media ponderada, no el del vapor.
        pista: |
          $v = x\,v'' + (1-x)\,v'$, con los dos volúmenes de la fila de 6 bar.
        desarrollo: |
          $$
          v = 0{,}7813\cdot 0{,}31558 + 0{,}2187\cdot 0{,}0011006 = 0{,}2468\ \text{m}^3/\text{kg}
          $$

          El líquido casi no cuenta en el volumen: sin su término saldría
          0,2466. Donde sí cuenta es en la masa, y por eso el título no se lee
          a ojo en el diagrama.

      - tipo: calcular
        titulo: La energía interna
        pregunta: |
          La tabla de saturación no trae $u$. ¿Cuánto vale la energía interna
          específica?
        respuesta:
          tipo: magnitud
          valor: '2152 kJ/kg'
          tolerancia: 0.002
          formato: una energía interna específica, con su unidad
        distractores:
          - valor: '2298.5 kJ/kg'
            mensaje: |
              Has restado $Pv$ con la presión en bar: $6\cdot 0{,}2468 = 1{,}48$.
              Para que $Pv$ salga en kJ/kg la presión va en kPa, 600, y el
              producto son 148 kJ/kg.
          - valor: '2448.1 kJ/kg'
            mensaje: |
              Has sumado $Pv$ en vez de restarlo. De $h = u + Pv$ sale
              $u = h - Pv$: la energía interna es siempre menor que la
              entalpía.
        pista: |
          De $h = u + Pv$ sale $u = h - Pv$, con $P$ en kPa para que el
          producto salga en kJ/kg.
        desarrollo: |
          $$
          u = h - Pv = 2300 - 600\cdot 0{,}2468 = 2151{,}9\ \text{kJ/kg}
          $$

          La tabla de saturación da $v$, $h$ y $s$, pero no $u$. En una mezcla
          se despeja de la definición de entalpía, y la trampa está en las
          unidades: bar por metro cúbico por kilogramo no es kJ/kg; kPa por
          metro cúbico por kilogramo, sí.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              A 6 bar, $h' = 670{,}38$ y $h'' = 2756{,}1$ kJ/kg: 2300 queda
              entre las dos, así que es vapor húmedo.
          - texto: >-
              El título sale de la entalpía como saldría del volumen:
              $x = (h - h')/(h'' - h') = 0{,}7813$.
          - texto: >-
              Con el título, cualquier otra propiedad específica es la media
              ponderada de las dos fases: $v = 0{,}2468$ m³/kg.
          - texto: >-
              La tabla no trae $u$: se despeja de $u = h - Pv$, con la presión
              en kPa, y sale 2151,9 kJ/kg.
          - texto: >-
              Y la temperatura también se pondera con el título, entre la del
              líquido y la del vapor.
            trampa: true
            mensaje: |
              Dentro de la campana las dos fases están a la misma temperatura,
              la de saturación a 6 bar: 158,83 °C, sea cual sea el título. El
              título pondera propiedades **específicas** —$v$, $h$, $u$, $s$—,
              que son distintas en cada fase; la temperatura no lo es.
    resolucion: |
      **a) La zona.** A 6 bar la tabla da $h' = 670{,}38$ y $h'' = 2756{,}1$
      kJ/kg. El dato, 2300, queda entre las dos: vapor húmedo, a la
      temperatura de saturación, 158,83 °C.

      **b) El título.**

      $$
      x = \frac{2300 - 670{,}38}{2756{,}1 - 670{,}38} = 0{,}7813
      $$

      **c) El volumen específico.**

      $$
      v = 0{,}7813\cdot 0{,}31558 + 0{,}2187\cdot 0{,}0011006 = 0{,}2468\ \text{m}^3/\text{kg}
      $$

      **d) La energía interna.** La tabla de saturación no la trae, y se
      despeja de la entalpía, con la presión en kPa:

      $$
      u = 2300 - 600\cdot 0{,}2468 = 2151{,}9\ \text{kJ/kg}
      $$

      **Lo que hay que llevarse.** El título se puede sacar de cualquier
      propiedad específica que dé el enunciado, y una vez sacado da todas las
      demás. La única que no se pondera es la temperatura: dentro de la
      campana es una sola.

  - id: ejter-vapor-a-8-bar-entre-dos-filas
    titulo: Vapor a 8 bar y 320 °C, entre dos filas de la tabla
    fuente: >-
      Ejercicio propio · Road to Ingeniería. De nivel de colección, escrito
      para practicar la lectura de las tablas de vapor y la interpolación. No
      es de la colección ni ha caído en examen.
    nivel: practica
    enunciado: |
      Vapor de agua a $8\ \text{bar}$ y $320\ \text{°C}$.

      a) ¿En qué zona está?

      b) ¿Cuál es su entalpía específica?

      c) ¿Y su volumen específico?

      *Las propiedades, de [la tabla de vapor sobrecalentado a
      8 bar](/road-to-ingenieria/ingenieria-termica/tablas/#sobrecalentado-8),
      como en el examen se sacan del anexo.*
    pide: La zona, la entalpía y el volumen específico.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de abrir la tabla de 8 bar, ¿qué hay que comprobar?
        opciones:
          - texto: >-
              Que 320 °C está por encima de la temperatura de saturación a
              8 bar: entonces es vapor sobrecalentado, y esa es su tabla
            correcta: true
            mensaje: |
              Eso es. A 8 bar la saturación está a 170,41 °C —lo da la tabla
              de saturación por presión—, y 320 °C queda muy por encima. Con
              presión y temperatura, esa comparación decide la zona.
          - texto: >-
              Nada: con presión y temperatura el estado está siempre en la tabla
              de sobrecalentado
            mensaje: |
              Solo si la temperatura supera a la de saturación. Agua a 8 bar y
              150 °C es líquido comprimido, y en esa tabla no la encontrarías.
          - texto: >-
              Que el título esté entre 0 y 1
            mensaje: |
              El título solo existe dentro de la campana. Con presión y
              temperatura independientes no se está en ella, y fuera de la
              campana no hay título que calcular.

      - tipo: calcular
        titulo: La entalpía
        pregunta: |
          La tabla de 8 bar tiene las filas de 300 y 350 °C. ¿Qué entalpía tiene
          el vapor a 320 °C?
        respuesta:
          tipo: magnitud
          valor: '3099.0 kJ/kg'
          tolerancia: 0.001
          formato: una entalpía específica, con su unidad
        distractores:
          - valor: '3056.9 kJ/kg'
            mensaje: |
              Esa es la fila de 300 °C tal cual. 320 °C no está en la tabla:
              está a 20 grados de 300 y a 30 de 350, así que la entalpía se
              interpola al 40 % del camino. Quedarse con la fila más cercana
              deja fuera 42 kJ/kg.
          - valor: '3120.1 kJ/kg'
            mensaje: |
              Has tomado la fracción al revés, 0,6 en vez de 0,4. La fracción
              es lo que 320 se ha alejado de 300 —20 de 50— y se aplica desde
              la entalpía de 300 °C.
          - valor: '2768.3 kJ/kg'
            mensaje: |
              Esa es la fila «Sat.» del bloque: el vapor saturado seco a 8 bar.
              Este vapor está 150 grados por encima de la saturación, y su
              entalpía es la de su temperatura, no la de la campana.
        pista: |
          La fracción es $(320 - 300)/(350 - 300)$, y con ella se avanza desde la
          entalpía de 300 °C.
        desarrollo: |
          $$
          f = \frac{320 - 300}{350 - 300} = 0{,}4
          \qquad
          h = 3056{,}9 + 0{,}4\,(3162{,}2 - 3056{,}9) = 3099{,}0\ \text{kJ/kg}
          $$

      - tipo: calcular
        titulo: El volumen específico
        pregunta: |
          ¿Y su volumen específico?
        respuesta:
          tipo: magnitud
          valor: '0.3363 m3/kg'
          tolerancia: 0.005
          formato: un volumen específico, con su unidad
        distractores:
          - valor: '0.3242 m3/kg'
            mensaje: |
              Esa es la fila de 300 °C. El volumen se interpola igual que la
              entalpía, al 40 % entre 300 y 350 °C.
          - valor: '0.3423 m3/kg'
            mensaje: |
              La fracción al revés otra vez: 0,6 en vez de 0,4. Es la misma
              fracción para todas las columnas, y se cuenta desde la fila de
              300 °C.
          - valor: '0.2403 m3/kg'
            mensaje: |
              Esa es la fila «Sat.»: el vapor saturado seco a 8 bar. A 320 °C
              el vapor ocupa bastante más.
        pista: |
          La misma fracción, 0,4, en la columna $v$.
        desarrollo: |
          $$
          v = 0{,}32416 + 0{,}4\,(0{,}35442 - 0{,}32416) = 0{,}33626\ \text{m}^3/\text{kg}
          $$

          Con la misma fracción sale cualquier otra columna de esas dos filas:
          la entropía, por ejemplo, es 7,3049 kJ/(kg·K).

      - tipo: justificar
        pregunta: Ordena la lectura. Una pieza es falsa.
        piezas:
          - texto: >-
              A 8 bar la saturación está a 170,41 °C: a 320 °C el vapor está
              sobrecalentado.
          - texto: >-
              El bloque de 8 bar tiene las filas de 300 y 350 °C, y 320 queda
              al 40 % del intervalo desde 300.
          - texto: >-
              Con esa fracción se interpola cada columna por separado:
              $h = 3099{,}0$ kJ/kg y $v = 0{,}33626$ m³/kg.
          - texto: >-
              Como 320 está más cerca de 300 que de 350, la fila de 300 °C vale
              tal cual: la diferencia es de redondeo.
            trampa: true
            mensaje: |
              Son 42 kJ/kg de entalpía y un 3,6 % de volumen, y eso no es
              redondeo: es más de lo que cambia la entalpía entre 6 y 8 bar a
              esa temperatura. Una fila vale para su temperatura; entre dos
              filas se interpola, esté uno más cerca de una o de otra.
    resolucion: |
      **a) La zona.** A 8 bar la saturación está a 170,41 °C, y 320 °C queda
      muy por encima: vapor sobrecalentado, en el bloque de 8 bar.

      **b) y c) La interpolación.** 320 °C cae entre las filas de 300 y
      350 °C:

      $$
      f = \frac{320 - 300}{350 - 300} = 0{,}4
      $$

      $$
      h = 3056{,}9 + 0{,}4\,(3162{,}2 - 3056{,}9) = 3099{,}0\ \text{kJ/kg}
      $$

      $$
      v = 0{,}32416 + 0{,}4\,(0{,}35442 - 0{,}32416) = 0{,}33626\ \text{m}^3/\text{kg}
      $$

      **Lo que hay que llevarse.** La fracción se calcula una vez, con la
      variable que se conoce —aquí la temperatura—, y sirve para todas las
      columnas de esas dos filas. Lo que no vale es quedarse con la fila más
      cercana: 42 kJ/kg no son redondeo.

  - id: ejter-siete-bar-que-no-estan-en-la-tabla
    titulo: Siete bar, que no están en la tabla
    fuente: >-
      Ejercicio propio · Road to Ingeniería. De nivel de colección, escrito
      para practicar la lectura de las tablas de vapor y la interpolación. No
      es de la colección ni ha caído en examen.
    nivel: practica
    enunciado: |
      Vapor de agua a $7\ \text{bar}$ y $300\ \text{°C}$. ¿Cuál es su volumen
      específico? ¿Y su entropía específica?

      *Las propiedades, de [la tabla de vapor
      sobrecalentado](/road-to-ingenieria/ingenieria-termica/tablas/#sobrecalentado),
      como en el examen se sacan del anexo.*
    pide: El volumen específico y la entropía específica a 7 bar y 300 °C.
    pasos:
      - tipo: reconocer
        pregunta: |
          La tabla de sobrecalentado no tiene bloque de 7 bar. ¿Qué se hace?
        opciones:
          - texto: >-
              Leer la fila de 300 °C en los bloques de 6 y de 8 bar, e
              interpolar entre los dos en la presión
            correcta: true
            mensaje: |
              Eso es. La temperatura sí está en la tabla y la presión cae entre
              dos bloques: se lee la misma fila en los dos y se interpola. 7 está
              justo en medio de 6 y 8, así que la fracción es 0,5.
          - texto: >-
              Usar el bloque de 6 bar, que es el más próximo por debajo
            mensaje: |
              Entre 6 y 8 bar, a 300 °C, el volumen específico cambia un 25 %.
              Tomar un bloque vecino no es redondear: es calcular otro estado.
          - texto: >-
              Interpolar en la tabla de saturación, entre 6,5 y 7,5 bar
            mensaje: |
              La tabla de saturación describe la campana, y a 7 bar la
              saturación está a 164,95 °C: 300 °C queda muy por encima. Esa
              tabla sirve aquí para decidir la zona, no para leer propiedades.

      - tipo: calcular
        titulo: El volumen específico
        pregunta: |
          ¿Qué volumen específico tiene el vapor a 7 bar y 300 °C?
        respuesta:
          tipo: magnitud
          valor: '0.3793 m3/kg'
          tolerancia: 0.025
          formato: un volumen específico, con su unidad
        distractores:
          - valor: '0.4344 m3/kg'
            mensaje: |
              Ese es el volumen a 6 bar, sin interpolar. Entre 6 y 8 bar el
              volumen cae de 0,43442 a 0,32416 m³/kg, y a 7 bar hay que ir a la
              mitad.
          - valor: '0.3242 m3/kg'
            mensaje: |
              Ese es el volumen a 8 bar, sin interpolar. 7 bar no es 8: está
              justo entre los dos bloques, y el volumen también.
          - valor: '0.2728 m3/kg'
            mensaje: |
              Ese es $v''$ a 7 bar, el del vapor saturado seco, de la tabla de
              saturación. A 300 °C el vapor está 135 grados por encima de la
              saturación, y ocupa bastante más.
        pista: |
          A 300 °C la tabla da $v = 0{,}43442$ a 6 bar y $0{,}32416$ a 8 bar, y
          7 bar queda en medio.
        desarrollo: |
          $$
          v = 0{,}43442 + 0{,}5\,(0{,}32416 - 0{,}43442) = 0{,}37929\ \text{m}^3/\text{kg}
          $$

          Es lo que da la recta entre los dos bloques, y es lo que se hace con
          el anexo delante. Pero conviene saber cuánto fiarse: lejos de la
          campana el vapor se parece a un gas ideal y su volumen va casi como
          $1/P$, no como una recta. En la resolución está cuánto se aparta: un
          2 %, y por eso aquí se da por buena cualquier respuesta dentro de ese
          margen.

      - tipo: calcular
        titulo: La entropía
        pregunta: |
          ¿Y su entropía específica?
        respuesta:
          tipo: magnitud
          valor: '7.3043 kJ/(kg K)'
          tolerancia: 0.002
          formato: una entropía específica, con su unidad
        distractores:
          - valor: '7.374 kJ/(kg K)'
            mensaje: |
              Has tomado uno de los dos bloques sin interpolar: 7,374 es la
              entropía a 6 bar, y 7,2345 la de 8 bar, igual de lejos por el otro
              lado. A 7 bar hay que ir a la mitad.
          - valor: '6.7071 kJ/(kg K)'
            mensaje: |
              Ese es $s''$ a 7 bar, el del vapor saturado seco. A 300 °C el
              vapor está muy por encima de la saturación, y su entropía es
              mayor.
        pista: |
          A 300 °C la tabla da $s = 7{,}374$ a 6 bar y $7{,}2345$ a 8 bar.
        desarrollo: |
          $$
          s = 7{,}374 + 0{,}5\,(7{,}2345 - 7{,}374) = 7{,}3043\ \text{kJ/(kg·K)}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              A 7 bar la saturación está a 164,95 °C: a 300 °C el vapor está
              sobrecalentado.
          - texto: >-
              No hay bloque de 7 bar, así que se lee la fila de 300 °C a 6 y a
              8 bar y se interpola en la presión, al 50 %.
          - texto: >-
              El volumen cae un 25 % entre los dos bloques y la entropía un
              2 %: equivocarse de bloque se nota en las dos.
          - texto: >-
              Como la entalpía casi no cambia entre 6 y 8 bar, tampoco hace
              falta interpolar el volumen: vale el de cualquiera de los dos
              bloques.
            trampa: true
            mensaje: |
              La entalpía casi no cambia —3062,0 frente a 3056,9 kJ/kg, un
              0,2 %—, pero el volumen sí: 0,43442 frente a 0,32416 m³/kg. Cada
              propiedad depende de la presión a su manera, y la que más depende
              es justamente el volumen, que va casi como $1/P$.
    resolucion: |
      **La zona.** A 7 bar la saturación está a 164,95 °C, así que a 300 °C el
      vapor está sobrecalentado. La tabla no tiene bloque de 7 bar: se lee la
      fila de 300 °C en los de 6 y 8 bar, y 7 queda justo en medio.

      **El volumen y la entropía.**

      $$
      v = 0{,}43442 + 0{,}5\,(0{,}32416 - 0{,}43442) = 0{,}37929\ \text{m}^3/\text{kg}
      $$

      $$
      s = 7{,}374 + 0{,}5\,(7{,}2345 - 7{,}374) = 7{,}3043\ \text{kJ/(kg·K)}
      $$

      **Cuánto fiarse de la recta.** Entre 6 y 8 bar, a 300 °C, la entalpía
      apenas cambia —de 3062,0 a 3056,9 kJ/kg—, la entropía baja un 2 % y el
      volumen un 25 %. Y el volumen no baja en línea recta: va casi como
      $1/P$, porque el producto $Pv$ casi no cambia, 2,6065 a 6 bar y 2,5933
      a 8. Con él, a 7 bar saldría

      $$
      v \approx \frac{2{,}5999}{7} = 0{,}3714\ \text{m}^3/\text{kg}
      $$

      un 2 % por debajo de la recta. En el examen se interpola en línea recta,
      como aquí; lo que conviene saber es que en el volumen ese es el orden del
      error, y que en la entalpía no se nota.

  - id: ejter-la-interpolacion-doble
    titulo: Vapor a 110 bar y 480 °C, que obliga a interpolar dos veces
    fuente: >-
      Ejercicio propio · Road to Ingeniería. De nivel de colección, escrito
      para practicar la lectura de las tablas de vapor y la interpolación. No
      es de la colección ni ha caído en examen.
    nivel: practica
    enunciado: |
      Vapor de agua a $110\ \text{bar}$ y $480\ \text{°C}$ entra en la turbina
      de alta presión de una central. Calcular su entalpía y su entropía
      específicas.

      *Las propiedades, de [la tabla de vapor
      sobrecalentado](/road-to-ingenieria/ingenieria-termica/tablas/#sobrecalentado-100),
      en sus bloques de 100 y 125 bar, como en el examen se sacan del anexo.*
    pide: La entalpía y la entropía a 110 bar y 480 °C.
    pasos:
      - tipo: reconocer
        pregunta: |
          Ni 110 bar ni 480 °C están en la tabla. ¿Cómo se organiza la
          interpolación?
        opciones:
          - texto: >-
              Se interpola en la temperatura dentro del bloque de 100 bar y
              dentro del de 125, y después, entre esos dos resultados, en la
              presión
            correcta: true
            mensaje: |
              Eso es: dos interpolaciones simples encadenadas. Cada una lleva su
              fracción —0,6 en temperatura, de 450 a 500 °C, y 0,4 en presión,
              de 100 a 125 bar—, y el orden da igual: empezando por la presión
              sale lo mismo.
          - texto: >-
              Se interpola solo en la temperatura, en el bloque más próximo, el
              de 100 bar
            mensaje: |
              Eso da el estado a 100 bar y 480 °C, no a 110. Aquí la presión
              pesa: entre 100 y 125 bar la entalpía cambia 35 kJ/kg y la
              entropía 0,14, y el 40 % de eso no es despreciable.
          - texto: >-
              Se promedian las cuatro esquinas del recuadro: 100 y 125 bar, 450
              y 500 °C
            mensaje: |
              La media de las cuatro esquinas es el valor en el centro del
              recuadro, a 112,5 bar y 475 °C, no en el punto que buscas. Cada
              interpolación lleva su propia fracción.

      - tipo: calcular
        titulo: La entalpía
        pregunta: |
          ¿Qué entalpía tiene el vapor a 110 bar y 480 °C?
        respuesta:
          tipo: magnitud
          valor: '3307.9 kJ/kg'
          tolerancia: 0.001
          formato: una entalpía específica, con su unidad
        distractores:
          - valor: '3322.0 kJ/kg'
            mensaje: |
              Te falta una de las dos interpolaciones. 3322,0 es el valor a
              100 bar: interpolado en la temperatura, pero no en la presión.
              Falta ir al 40 % del camino hacia el valor de 125 bar, 3286,72, y
              eso baja la entalpía 14 kJ/kg.
          - valor: '3225.9 kJ/kg'
            mensaje: |
              Has interpolado solo en la presión, en la fila de 450 °C. Falta la
              temperatura: 480 está al 60 % del camino hacia 500 °C, y eso sube
              la entalpía más de 80 kJ/kg.
        pista: |
          Primero, en cada bloque, $h = h_{450} + 0{,}6\,(h_{500} - h_{450})$;
          luego, entre los dos bloques, al 40 %.
        desarrollo: |
          En la temperatura, dentro de cada bloque:

          $$
          h_{100} = 3242{,}3 + 0{,}6\,(3375{,}1 - 3242{,}3) = 3321{,}98
          $$

          $$
          h_{125} = 3201{,}4 + 0{,}6\,(3343{,}6 - 3201{,}4) = 3286{,}72
          $$

          Y en la presión, entre los dos:

          $$
          h = 3321{,}98 + 0{,}4\,(3286{,}72 - 3321{,}98) = 3307{,}88\ \text{kJ/kg}
          $$

      - tipo: calcular
        titulo: La entropía
        pregunta: |
          ¿Y la entropía?
        respuesta:
          tipo: magnitud
          valor: '6.4727 kJ/(kg K)'
          tolerancia: 0.001
          formato: una entropía específica, con su unidad
        distractores:
          - valor: '6.5285 kJ/(kg K)'
            mensaje: |
              Una sola interpolación, la de la temperatura, dentro de un solo
              bloque: 6,5285 es la entropía a 100 bar y 480 °C. Falta ir al
              40 % hacia el valor de 125 bar, 6,38896.
          - valor: '6.3631 kJ/(kg K)'
            mensaje: |
              Una sola interpolación, la de la presión, en la fila de 450 °C.
              Falta subir en la temperatura hasta 480 °C, al 60 % del camino
              hacia 500.
        pista: |
          Las mismas dos fracciones que para la entalpía, 0,6 y 0,4, en la
          columna $s$.
        desarrollo: |
          $$
          s_{100} = 6{,}4219 + 0{,}6\,(6{,}5995 - 6{,}4219) = 6{,}52846
          $$

          $$
          s_{125} = 6{,}2749 + 0{,}6\,(6{,}465 - 6{,}2749) = 6{,}38896
          $$

          $$
          s = 6{,}52846 + 0{,}4\,(6{,}38896 - 6{,}52846) = 6{,}47266\ \text{kJ/(kg·K)}
          $$

      - tipo: justificar
        pregunta: Ordena la interpolación doble. Una pieza es falsa.
        piezas:
          - texto: >-
              A 110 bar la saturación está a 318,08 °C: a 480 °C el vapor está
              sobrecalentado.
          - texto: >-
              La tabla no tiene ni 110 bar ni 480 °C: hacen falta los bloques de
              100 y 125 bar, y en cada uno las filas de 450 y 500 °C.
          - texto: >-
              Dentro de cada bloque se interpola en la temperatura, al 60 %; y
              entre los dos resultados, en la presión, al 40 %.
          - texto: >-
              El orden no cambia nada: interpolar primero en la presión y
              después en la temperatura da los mismos 3307,88 kJ/kg.
          - texto: >-
              Como 110 bar está más cerca de 100 que de 125, el bloque de
              100 bar vale tal cual.
            trampa: true
            mensaje: |
              Eso deja la entalpía 14 kJ/kg alta y la entropía 0,056 alta.
              Estar más cerca de un bloque dice hacia qué lado te equivocas si
              no interpolas, no que el error sea pequeño: el 40 % del salto
              entre bloques es casi la mitad.
    resolucion: |
      **La zona.** A 110 bar la saturación está a 318,08 °C, y a 480 °C el
      vapor está sobrecalentado. La rejilla no tiene ni esa presión ni esa
      temperatura, así que el estado queda dentro de un recuadro: bloques de
      100 y 125 bar, filas de 450 y 500 °C.

      **Las dos fracciones.**

      $$
      f_T = \frac{480 - 450}{500 - 450} = 0{,}6
      \qquad
      f_P = \frac{110 - 100}{125 - 100} = 0{,}4
      $$

      **La entalpía.** En la temperatura dentro de cada bloque, y luego en la
      presión:

      $$
      h_{100} = 3321{,}98 \qquad h_{125} = 3286{,}72 \qquad
      h = 3321{,}98 + 0{,}4\,(3286{,}72 - 3321{,}98) = 3307{,}88\ \text{kJ/kg}
      $$

      **La entropía.** Con las mismas fracciones:

      $$
      s_{100} = 6{,}52846 \qquad s_{125} = 6{,}38896 \qquad
      s = 6{,}52846 + 0{,}4\,(6{,}38896 - 6{,}52846) = 6{,}47266\ \text{kJ/(kg·K)}
      $$

      **La comprobación.** Empezando por la presión —a 450 °C sale 3225,94 y a
      500 °C, 3362,5— y terminando en la temperatura se llega a los mismos
      3307,88. La interpolación doble no depende del orden, y hacerla de las
      dos maneras es la forma de cazar un número mal copiado.

  - id: ejter-la-temperatura-que-sale-de-la-entalpia
    titulo: La temperatura que sale de una entalpía
    fuente: >-
      Ejercicio propio · Road to Ingeniería. De nivel de colección, escrito
      para practicar la lectura de las tablas de vapor y la interpolación. No
      es de la colección ni ha caído en examen.
    nivel: practica
    enunciado: |
      El balance de energía de un sobrecalentador dice que el vapor sale a
      $10\ \text{bar}$ con una entalpía de $3100\ \text{kJ/kg}$.

      a) ¿A qué temperatura sale?

      b) ¿Qué entropía tiene?

      *Las propiedades, de [la tabla de vapor sobrecalentado a
      10 bar](/road-to-ingenieria/ingenieria-termica/tablas/#sobrecalentado-10),
      como en el examen se sacan del anexo.*
    pide: La temperatura y la entropía del vapor a la salida.
    pasos:
      - tipo: reconocer
        pregunta: |
          Con la presión y la entalpía, ¿cómo se saca la temperatura?
        opciones:
          - texto: >-
              Se comprueba que 3100 supera a $h''$ a 10 bar, se busca en la
              columna $h$ del bloque de 10 bar entre qué dos filas cae, y la
              temperatura se interpola con esa fracción
            correcta: true
            mensaje: |
              Eso es: interpolación inversa. Lo que se conoce es la entalpía,
              así que la fracción se calcula con ella y se aplica a la columna
              de temperaturas.
          - texto: >-
              Es la temperatura de saturación a 10 bar, 179,88 °C
            mensaje: |
              Solo si el vapor estuviera en la campana. A 10 bar,
              $h'' = 2777{,}1$ kJ/kg, y 3100 queda por encima: vapor
              sobrecalentado, y ahí presión y temperatura son independientes.
          - texto: >-
              Despejando la temperatura de $h = c_p\,T$
            mensaje: |
              Eso supone un gas ideal de calor específico constante, con la
              entalpía contada desde el cero absoluto. El vapor a 10 bar no se
              comporta así, y las tablas del agua cuentan la entalpía desde el
              punto triple: el vapor se lee en su tabla.

      - tipo: calcular
        titulo: La temperatura
        pregunta: |
          ¿A qué temperatura sale el vapor?
        respuesta:
          tipo: magnitud
          valor: '322.7 °C'
          tolerancia: 0.002
          formato: una temperatura, con su unidad
        distractores:
          - valor: '327.3 °C'
            mensaje: |
              Has medido la fracción desde el otro extremo. 3100 está a
              48,4 kJ/kg de la fila de 300 °C y a 58,2 de la de 350: más cerca
              de 300, y la temperatura también.
          - valor: '300 °C'
            mensaje: |
              Esa es la fila de abajo, sin interpolar. 3100 no está en la
              columna de entalpías: cae entre 3051,6 y 3158,2, al 45 % del
              intervalo, y la temperatura va al 45 % entre 300 y 350 °C.
          - valor: '179.88 °C'
            mensaje: |
              Esa es la de saturación a 10 bar. Sería la temperatura si el
              vapor estuviera en la campana, y con 3100 kJ/kg, por encima de
              $h'' = 2777{,}1$, no lo está.
        pista: |
          La fracción se calcula con la entalpía,
          $(3100 - 3051{,}6)/(3158{,}2 - 3051{,}6)$, y se aplica a las
          temperaturas.
        desarrollo: |
          $$
          f = \frac{3100 - 3051{,}6}{3158{,}2 - 3051{,}6} = 0{,}4540
          \qquad
          T = 300 + 0{,}4540\cdot 50 = 322{,}70\ \text{°C}
          $$

      - tipo: calcular
        titulo: La entropía
        pregunta: |
          ¿Qué entropía tiene el vapor a la salida?
        respuesta:
          tipo: magnitud
          valor: '7.2056 kJ/(kg K)'
          tolerancia: 0.001
          formato: una entropía específica, con su unidad
        distractores:
          - valor: '7.2219 kJ/(kg K)'
            mensaje: |
              Has tomado la fracción al revés, 0,546 en vez de 0,454. La
              entropía se interpola con la misma fracción que la temperatura,
              contando desde la fila de 300 °C.
          - valor: '6.585 kJ/(kg K)'
            mensaje: |
              Ese es $s''$ a 10 bar, la fila «Sat.» del bloque. El vapor está
              143 grados por encima de la saturación, y su entropía se lee en
              sus filas.
        pista: |
          La misma fracción, 0,4540, entre las entropías de 300 y 350 °C.
        desarrollo: |
          $$
          s = 7{,}1246 + 0{,}4540\,(7{,}3029 - 7{,}1246) = 7{,}2056\ \text{kJ/(kg·K)}
          $$

          La fracción se calcula una vez, con la propiedad que se conoce, y
          vale para todas las columnas de esas dos filas.

      - tipo: justificar
        pregunta: Ordena la interpolación inversa. Una pieza es falsa.
        piezas:
          - texto: >-
              A 10 bar, $h'' = 2777{,}1$ kJ/kg: con 3100 el vapor está
              sobrecalentado, y la temperatura no es la de saturación.
          - texto: >-
              En el bloque de 10 bar, 3100 cae entre 3051,6 (300 °C) y 3158,2
              (350 °C), al 45,4 % del intervalo.
          - texto: >-
              Esa fracción da la temperatura, 322,70 °C, y la misma fracción da
              la entropía, 7,2056 kJ/(kg·K).
          - texto: >-
              La fracción se calcula con las temperaturas de las dos filas y se
              aplica a la columna de entalpías.
            trampa: true
            mensaje: |
              Es al revés, y es el error de interpolar en la variable que no es.
              Lo que se conoce es la entalpía, así que la fracción mide dónde
              cae 3100 entre 3051,6 y 3158,2; lo que se busca es la
              temperatura, y ahí es donde se aplica.
    resolucion: |
      **La zona.** A 10 bar, $h'' = 2777{,}1$ kJ/kg, y 3100 queda por encima:
      vapor sobrecalentado. Presión y entalpía fijan el estado, y la
      temperatura hay que buscarla.

      **a) La temperatura.** En la columna $h$ del bloque de 10 bar, 3100 cae
      entre las filas de 300 y 350 °C:

      $$
      f = \frac{3100 - 3051{,}6}{3158{,}2 - 3051{,}6} = 0{,}4540
      \qquad
      T = 300 + 0{,}4540\cdot 50 = 322{,}70\ \text{°C}
      $$

      **b) La entropía.** Con la misma fracción:

      $$
      s = 7{,}1246 + 0{,}4540\,(7{,}3029 - 7{,}1246) = 7{,}2056\ \text{kJ/(kg·K)}
      $$

      **Lo que hay que llevarse.** La interpolación inversa es la misma cuenta
      leída al revés: la fracción sale de la columna que se conoce y se aplica
      a la que se busca. Y una vez calculada, sirve para cualquier otra columna
      de esas dos filas.

  - id: ejter-la-expansion-que-entra-en-la-campana
    titulo: La expansión isoentrópica que entra en la campana
    fuente: >-
      Ejercicio propio · Road to Ingeniería. De nivel de colección, escrito
      para practicar la lectura de las tablas de vapor y la interpolación. No
      es de la colección ni ha caído en examen.
    nivel: practica
    enunciado: |
      Vapor de agua a $30\ \text{bar}$ y $400\ \text{°C}$ se expande de forma
      isoentrópica hasta $0{,}08\ \text{bar}$.

      a) ¿Sale como vapor húmedo o como vapor sobrecalentado?

      b) Si sale húmedo, ¿con qué título?

      c) ¿Qué entalpía tiene a la salida?

      *Las propiedades, de [la tabla de vapor sobrecalentado a
      30 bar](/road-to-ingenieria/ingenieria-termica/tablas/#sobrecalentado-30)
      y de [la de saturación por
      presión](/road-to-ingenieria/ingenieria-termica/tablas/#saturacion-presion),
      como en el examen se sacan del anexo.*
    pide: Si sale húmedo o sobrecalentado, su título y su entalpía.
    pasos:
      - tipo: reconocer
        pregunta: |
          La salida está a 0,08 bar y tiene la misma entropía que la entrada.
          ¿Qué se compara para saber si sale húmeda?
        opciones:
          - texto: >-
              La entropía de la entrada con $s'$ y $s''$ a 0,08 bar: si queda
              entre las dos, sale vapor húmedo
            correcta: true
            mensaje: |
              Eso es. La entropía es la propiedad que la expansión conserva, así
              que es la que se lleva a la salida. Allí se compara con las dos de
              saturación, igual que se haría con un volumen o con una entalpía.
          - texto: >-
              La temperatura de entrada, 400 °C, con la de saturación a
              0,08 bar
            mensaje: |
              400 °C es la temperatura de la entrada, y la de la salida es
              justo lo que no se conoce. Lo que la expansión conserva es la
              entropía, y la comparación se hace con ella.
          - texto: >-
              La entropía de la entrada con $s''$ a 30 bar
            mensaje: |
              Eso diría si la entrada está sobrecalentada, que ya se sabe:
              400 °C a 30 bar. La pregunta es por la salida, y la salida está a
              0,08 bar: ahí es donde hay que mirar $s'$ y $s''$.

      - tipo: calcular
        titulo: El título a la salida
        pregunta: |
          Con $s_2 = s_1$, ¿qué título tiene el vapor a la salida?
        respuesta:
          tipo: numero
          valor: '0.8292'
          tolerancia: 0.002
          formato: un número entre 0 y 1
        distractores:
          - valor: '0.1708'
            mensaje: |
              Esa es la fracción de líquido, $1-x$. El título mide el vapor: en
              el numerador va $s - s'$, lo que la entropía se ha alejado de la
              del líquido saturado.
          - valor: '0.8415'
            mensaje: |
              Has dividido la entropía entre $s''$ a secas. El título mide dónde
              cae $s$ entre $s'$ y $s''$, y el líquido saturado no está en cero:
              hay que restar $s'$ arriba y abajo.
        pista: |
          $s_1$ se lee a 30 bar y 400 °C; a la salida,
          $x = (s_1 - s')/(s'' - s')$ con la fila de 0,08 bar.
        desarrollo: |
          De la tabla de 30 bar, a 400 °C, $s_1 = 6{,}9234$ kJ/(kg·K). A
          0,08 bar:

          $$
          x_2 = \frac{6{,}9234 - 0{,}59249}{8{,}2273 - 0{,}59249} = 0{,}8292
          $$

          Un 17 % del vapor ha condensado sin que nadie le quite calor: lo ha
          hecho la propia expansión.

      - tipo: calcular
        titulo: La entalpía a la salida
        pregunta: |
          ¿Qué entalpía tiene el vapor a la salida?
        respuesta:
          tipo: magnitud
          valor: '2165.9 kJ/kg'
          tolerancia: 0.002
          formato: una entalpía específica, con su unidad
        distractores:
          - valor: '2576.2 kJ/kg'
            mensaje: |
              Ese es $h''$ a 0,08 bar, el del vapor saturado seco. El vapor sale
              con un 17 % de líquido, y su entalpía es la media ponderada con el
              título, bastante menor.
          - valor: '584.1 kJ/kg'
            mensaje: |
              Has cambiado los pesos: el título multiplica a $h''$, no a $h'$.
              Con los pesos al revés sale un líquido con algo de vapor, y un
              título de 0,83 es lo contrario.
          - valor: '3231.7 kJ/kg'
            mensaje: |
              Esa es la entalpía de la entrada. Isoentrópica no quiere decir
              isoentálpica: la entropía se conserva y la entalpía baja, que es
              de donde sale el trabajo.
        pista: |
          $h_2 = h' + x_2\,(h'' - h')$, con la fila de 0,08 bar.
        desarrollo: |
          $$
          h_2 = 173{,}84 + 0{,}8292\,(2576{,}2 - 173{,}84) = 2165{,}9\ \text{kJ/kg}
          $$

          Frente a los 3231,7 kJ/kg de la entrada, la entalpía ha bajado algo
          más de 1.065 kJ/kg: es el trabajo que daría por cada kilogramo una
          turbina ideal entre estos dos estados.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              A la entrada, 30 bar y 400 °C están en la tabla de sobrecalentado:
              $s_1 = 6{,}9234$ kJ/(kg·K).
          - texto: >-
              Isoentrópica quiere decir $s_2 = s_1$, y con $P_2 = 0{,}08$ bar el
              estado de salida queda fijado.
          - texto: >-
              A 0,08 bar, $s' = 0{,}59249$ y $s'' = 8{,}2273$: $s_2$ queda
              entre las dos, así que sale vapor húmedo, con título 0,8292.
          - texto: >-
              Con el título, la entalpía de salida es la media ponderada de las
              dos fases: 2165,9 kJ/kg.
          - texto: >-
              Y como la expansión es isoentrópica, el vapor sale a la misma
              temperatura a la que entró.
            trampa: true
            mensaje: |
              Isoentrópica no es isoterma. El vapor sale a la temperatura de
              saturación a 0,08 bar, 41,509 °C: ha bajado casi 360 grados. Lo
              que se conserva es la entropía, y es la única propiedad que se
              puede llevar de la entrada a la salida.
    resolucion: |
      **La propiedad que se lleva a la salida.** La expansión es
      isoentrópica, así que $s_2 = s_1$. A la entrada, 30 bar y 400 °C están
      en la rejilla: $s_1 = 6{,}9234$ kJ/(kg·K).

      **a) Húmedo o sobrecalentado.** A 0,08 bar, $s' = 0{,}59249$ y
      $s'' = 8{,}2273$. $s_2$ queda entre las dos: el vapor sale húmedo, a la
      temperatura de saturación, 41,509 °C.

      **b) El título.**

      $$
      x_2 = \frac{6{,}9234 - 0{,}59249}{8{,}2273 - 0{,}59249} = 0{,}8292
      $$

      **c) La entalpía.**

      $$
      h_2 = 173{,}84 + 0{,}8292\,(2576{,}2 - 173{,}84) = 2165{,}9\ \text{kJ/kg}
      $$

      **Y no siempre entra en la campana.** Si la expansión se parara en
      5 bar, allí $s'' = 6{,}8207$, por debajo de 6,9234: el vapor seguiría
      sobrecalentado, y habría que buscarlo con la entropía en el bloque de
      5 bar. Por eso la comparación con $s''$ se hace siempre, a la presión de
      salida y antes de calcular nada.

  - id: ejter-el-agua-a-100-bar-que-no-es-saturada
    titulo: Agua a 100 bar y 45 °C, y lo que se equivoca tomarla por saturada
    fuente: >-
      Ejercicio propio · Road to Ingeniería. De nivel de colección, escrito
      para practicar la lectura de las tablas de vapor y la interpolación. No
      es de la colección ni ha caído en examen.
    nivel: practica
    enunciado: |
      A la salida de la bomba de alimentación de una caldera, el agua está a
      $100\ \text{bar}$ y $45\ \text{°C}$.

      a) ¿En qué zona está?

      b) ¿Qué entalpía tiene, según la tabla de líquido comprimido?

      c) ¿Cuánto se equivoca quien aproxima esa entalpía por la del líquido
      saturado a la misma temperatura, $h \approx h'(45\ \text{°C})$?

      *Las propiedades, de [la tabla de líquido comprimido a
      100 bar](/road-to-ingenieria/ingenieria-termica/tablas/#liquido-100) y de
      [la de saturación por
      temperatura](/road-to-ingenieria/ingenieria-termica/tablas/#saturacion-temperatura),
      como en el examen se sacan del anexo.*
    pide: La zona, la entalpía de la tabla y lo que se equivoca la aproximación del líquido saturado.
    pasos:
      - tipo: reconocer
        pregunta: |
          Agua a 100 bar y 45 °C. ¿Qué tabla se abre?
        opciones:
          - texto: >-
              La de líquido comprimido: 45 °C queda muy por debajo de la
              temperatura de saturación a 100 bar, que es 311 °C
            correcta: true
            mensaje: |
              Eso es. Con presión y temperatura se compara con la de
              saturación, y por debajo es líquido comprimido. A 100 bar la
              tabla de líquido comprimido tiene su propio bloque.
          - texto: >-
              La de saturación a 100 bar, porque el agua está líquida
            mensaje: |
              El líquido saturado a 100 bar está a 311 °C, y el agua del
              enunciado, a 45. Es agua líquida, pero no saturada: la fila de
              100 bar de la tabla de saturación describe otro estado.
          - texto: >-
              La de vapor sobrecalentado a 100 bar
            mensaje: |
              El bloque de vapor sobrecalentado de 100 bar empieza en la
              saturación, 311 °C, y sube desde ahí. A 45 °C no hay vapor: hay
              líquido.

      - tipo: calcular
        titulo: La entalpía de la tabla
        pregunta: |
          La tabla de 100 bar tiene las filas de 40 y 60 °C. ¿Qué entalpía tiene
          el agua a 45 °C?
        respuesta:
          tipo: magnitud
          valor: '197.16 kJ/kg'
          tolerancia: 0.006
          formato: una entalpía específica, con su unidad
        distractores:
          - valor: '1408.1 kJ/kg'
            mensaje: |
              Esa es $h'$ a 100 bar, de la tabla de saturación por presión: el
              líquido saturado a 311 °C. El agua del enunciado está a 45 °C y es
              otro estado, con siete veces menos entalpía.
          - valor: '188.43 kJ/kg'
            mensaje: |
              Esa es $h'$ a 45 °C: la aproximación que el apartado c) pide
              comparar. Aquí se pide la tabla de líquido comprimido, en su bloque
              de 100 bar, interpolando entre 40 y 60 °C.
          - valor: '176.36 kJ/kg'
            mensaje: |
              Esa es la fila de 40 °C tal cual. 45 °C está al 25 % del camino
              hacia 60 °C, y en esos 20 grados la entalpía sube 83 kJ/kg: la
              cuarta parte son casi 21.
        pista: |
          Entre 40 y 60 °C, la fracción es $(45 - 40)/(60 - 40) = 0{,}25$.
        desarrollo: |
          $$
          h = 176{,}36 + 0{,}25\,(259{,}55 - 176{,}36) = 197{,}16\ \text{kJ/kg}
          $$

      - tipo: calcular
        titulo: Lo que se equivoca la aproximación
        pregunta: |
          La aproximación lee $h'(45\ \text{°C})$ en la tabla de saturación por
          temperatura. ¿Cuánto vale la diferencia $h - h'(45\ \text{°C})$?
        respuesta:
          tipo: magnitud
          valor: '8.73 kJ/kg'
          tolerancia: 0.05
          formato: una entalpía específica, con su unidad
        distractores:
          - valor: '-8.73 kJ/kg'
            mensaje: |
              Has restado al revés, $h'(45\ \text{°C}) - h$. La tabla de
              líquido comprimido da más que la aproximación, así que
              $h - h'$ es positiva: la aproximación se queda corta.
          - valor: '-1210.9 kJ/kg'
            mensaje: |
              Has restado $h'$ a 100 bar, el líquido saturado a la misma
              **presión**. La aproximación de un líquido se hace a la misma
              **temperatura**, porque su entalpía depende casi solo de ella.
        pista: |
          $h'$ a 45 °C está en la fila de 45 de la tabla por temperatura;
          réstaselo a la $h$ del paso anterior.
        desarrollo: |
          $$
          h - h'(45\ \text{°C}) = 197{,}16 - 188{,}43 = 8{,}73\ \text{kJ/kg}
          $$

          Un 4,4 % de la entalpía del agua, por defecto.

      - tipo: justificar
        pregunta: Ordena la comparación. Una pieza es falsa.
        piezas:
          - texto: >-
              A 100 bar la saturación está a 311 °C, y el agua a 45 °C: líquido
              comprimido.
          - texto: >-
              La tabla de 100 bar tiene las filas de 40 y 60 °C; 45 °C queda al
              25 % y sale $h = 197{,}16$ kJ/kg.
          - texto: >-
              La aproximación toma $h'$ a 45 °C, 188,43 kJ/kg, y se queda
              8,73 kJ/kg corta: un 4,4 %.
          - texto: >-
              Frente a los 2.528 kJ/kg que hacen falta para llevar ese agua a
              vapor saturado a 100 bar, 8,73 es un 0,3 %; en una resta entre dos
              estados líquidos parecidos, no es despreciable.
          - texto: >-
              Y si se quiere aproximar mejor, se toma $h'$ a 100 bar, que es la
              presión que tiene el agua.
            trampa: true
            mensaje: |
              $h'$ a 100 bar es la del líquido saturado a 311 °C, 1408,1 kJ/kg:
              siete veces más. La entalpía de un líquido depende casi solo de la
              temperatura, y por eso la aproximación se hace a la misma
              temperatura, no a la misma presión.
    resolucion: |
      **a) La zona.** A 100 bar la saturación está a 311 °C, y el agua está a
      45: líquido comprimido. Se lee en el bloque de 100 bar de la tabla de
      líquido comprimido.

      **b) La entalpía.** 45 °C cae entre las filas de 40 y 60 °C, al 25 %:

      $$
      h = 176{,}36 + 0{,}25\,(259{,}55 - 176{,}36) = 197{,}16\ \text{kJ/kg}
      $$

      **c) El error de la aproximación.** La tabla por temperatura da
      $h'(45\ \text{°C}) = 188{,}43$ kJ/kg, y

      $$
      h - h'(45\ \text{°C}) = 197{,}16 - 188{,}43 = 8{,}73\ \text{kJ/kg}
      $$

      un 4,4 % por defecto.

      **Cuándo vale y cuándo no.** Para llevar ese agua hasta vapor saturado a
      100 bar hacen falta $2725{,}5 - 197{,}16 = 2528{,}34$ kJ/kg, y a su lado
      8,73 es un 0,3 %: en una caldera la aproximación no se nota. En una
      cuenta que resta dos estados líquidos parecidos, en cambio, 8,73 kJ/kg
      puede ser del orden del resultado entero. Lo que no cambia es con qué se
      aproxima: con $h'$ a la misma **temperatura**. $h'$ a 100 bar, 1408,1
      kJ/kg, es otro estado.

  - id: ejter-el-deposito-rigido-que-se-calienta
    titulo: El depósito rígido sobre la placa eléctrica
    fuente: >-
      Ejercicio 3.2 de la colección de problemas del Tema 3 · Ingeniería
      Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El material
      publica su resolución, y el desarrollo está contrastado contra ella.
    nivel: practica
    enunciado: |
      Un recipiente rígido y cerrado de $V = 0{,}5\ \text{m}^{3}$ se calienta
      con una placa eléctrica. Contiene agua como mezcla bifásica a
      $P_1 = 1\ \text{bar}$ y título $x_1 = 0{,}5$. Tras calentarlo, la
      presión sube a $P_2 = 1{,}5\ \text{bar}$.

      a) La temperatura en cada estado.

      b) La masa de vapor presente en cada estado.

      c) El calor aportado.

      *Las propiedades del agua, de [la tabla de saturación por
      presión](/road-to-ingenieria/ingenieria-termica/tablas/#saturacion-presion),
      como en el examen se sacan del anexo.*
    pide: Las dos temperaturas, las dos masas de vapor y el calor aportado.
    pasos:
      - tipo: reconocer
        pregunta: |
          El recipiente es rígido y está cerrado. ¿Qué propiedad se conserva
          entre los dos estados?
        opciones:
          - texto: >-
              El volumen específico, porque ni el volumen ni la masa cambian
            correcta: true
            mensaje: |
              Exacto, y es la clave del ejercicio: $v_2 = v_1$. En el
              diagrama $T\text{-}v$ el proceso es una **vertical**, y esa
              vertical es la que permite entrar en la segunda tabla sin más
              datos que la presión.
          - texto: >-
              La temperatura, porque el recipiente está cerrado
            mensaje: |
              Cerrado quiere decir que no entra ni sale masa, no que no entre
              calor. Aquí entra calor por la placa, y el enunciado dice que la
              presión sube: en la campana, subir la presión es subir la
              temperatura.
          - texto: >-
              La energía interna, porque no hay trabajo
            mensaje: |
              Que no haya trabajo hace que $Q = \Delta U$, no que
              $\Delta U = 0$. Si la energía interna no cambiara, el calor
              aportado sería cero y la placa estaría de adorno.

      - tipo: calcular
        titulo: El volumen específico, que no cambia
        pregunta: |
          ¿Cuánto vale $v_1$, y por tanto $v_2$?
        respuesta:
          tipo: magnitud
          valor: '0.8475 m3/kg'
          tolerancia: 0.02
          formato: un volumen específico, con su unidad
        distractores:
          - valor: '1.6949 m3/kg'
            mensaje: |
              Has sumado $v'$ y $v''$ sin ponderar. La media pesa cada fase
              por su fracción de masa: con título 0,5 es la media aritmética,
              y la media aritmética de 1,6939 y 0,0010432 es la mitad de eso.
          - valor: '0.5015 m3/kg'
            mensaje: |
              Ese número aparece en otro ejercicio como título, no aquí como
              volumen. Comprueba la fórmula: $v = x\,v'' + (1-x)\,v'$, con los
              volúmenes de la tabla a 1 bar.
        pista: |
          $v_1 = x_1 v'' + (1-x_1) v'$, con la fila de 1 bar de la tabla de
          saturación: $v' = 0{,}0010432$ y $v'' = 1{,}6939\ \text{m}^3/\text{kg}$.
        desarrollo: |
          $$
          v_1 = 0{,}5\cdot 1{,}6939 + 0{,}5\cdot 0{,}0010432
          = 0{,}8475\ \frac{\text{m}^{3}}{\text{kg}} = v_2
          $$

          Y de ahí sale también la masa, que hará falta luego:

          $$
          m = \frac{V}{v} = \frac{0{,}5}{0{,}8475} = 0{,}59\ \text{kg}
          $$

      - tipo: calcular
        titulo: El título en el estado final
        pregunta: |
          Con $v_2 = 0{,}8475$ y los valores de la tabla a 1,5 bar, ¿cuál es
          $x_2$?
        respuesta:
          tipo: numero
          valor: '0.7308'
          tolerancia: 0.003
          formato: un número entre 0 y 1
        distractores:
          - valor: '0.5'
            mensaje: |
              El título **no** se conserva. Lo que se conserva es el volumen
              específico; al subir la presión, $v''$ baja de 1,6939 a 1,1593,
              y el mismo volumen específico corresponde ahora a una fracción
              de vapor mayor.
          - valor: '0.2692'
            mensaje: |
              Has puesto la resta del revés, $(v'' - v)/(v'' - v')$, y eso es
              $1 - x$: la fracción de líquido. El título mide vapor, y aquí el
              vapor tiene que haber aumentado respecto del 0,5 inicial, no
              disminuido.
        pista: |
          $x_2 = (v_2 - v')/(v'' - v')$, con la fila de 1,5 bar:
          $v' = 0{,}0010527$ y $v'' = 1{,}1593\ \text{m}^3/\text{kg}$.
        desarrollo: |
          $$
          x_2 = \frac{0{,}8475 - 0{,}0010527}{1{,}1593 - 0{,}0010527}
          = 0{,}7308
          $$

          Sube de 0,5 a 0,73 sin que entre ni salga nada del depósito: lo que
          ha cambiado no es la cantidad de agua, es cuánta de ella está en
          fase vapor.

      - tipo: calcular
        titulo: La masa de vapor al final
        pregunta: |
          ¿Cuántos kilogramos de vapor hay en el estado 2?
        respuesta:
          tipo: magnitud
          valor: '0.431 kg'
          tolerancia: 0.02
          formato: una masa, con su unidad
        distractores:
          - valor: '0.295 kg'
            mensaje: |
              Esa es la del estado inicial, $0{,}5 \cdot 0{,}59$. La pregunta
              es por el final, con el título ya subido a 0,7308.
          - valor: '0.59 kg'
            mensaje: |
              Esa es la masa **total** de agua del depósito. La de vapor es su
              fracción, que es lo que el título mide.
        pista: |
          $m'' = x\,m$, con la masa total que salió antes.
        desarrollo: |
          $$
          m''_2 = x_2\,m = 0{,}7308\cdot 0{,}59 = 0{,}431\ \text{kg}
          $$

          Frente a $m''_1 = 0{,}5\cdot 0{,}59 = 0{,}295\ \text{kg}$ al
          principio: se han evaporado 136 gramos.

      - tipo: calcular
        titulo: El calor aportado
        pregunta: |
          El recipiente es rígido, así que no hay trabajo de frontera. ¿Cuánto
          calor ha aportado la placa?
        respuesta:
          tipo: magnitud
          valor: '298 kJ'
          tolerancia: 0.02
          formato: un calor, con su unidad
        distractores:
          - valor: '323 kJ'
            mensaje: |
              Has hecho el balance con las entalpías,
              $m(h_2 - h_1)$. En un sistema **cerrado** la propiedad que
              interviene es la energía interna; la entalpía es de los
              volúmenes de control. Réstale a cada entalpía su $Pv$.
          - valor: '505 kJ'
            mensaje: |
              Ese es $\Delta u$ por kilogramo, no el calor total. Falta
              multiplicar por los 0,59 kg que hay en el depósito.
        pista: |
          Saca $h_1$ y $h_2$ con los títulos, pásalas a $u = h - Pv$, y aplica
          $Q = m\,\Delta u$. La tabla de saturación da, a 1 bar,
          $h' = 417{,}50$ y $h'' = 2674{,}9$; a 1,5 bar, $h' = 467{,}13$ y
          $h'' = 2693{,}1\ \text{kJ/kg}$.
        desarrollo: |
          Las entalpías, con cada título y su fila de tabla:

          $$
          h_1 = 0{,}5\cdot 2674{,}9 + 0{,}5\cdot 417{,}50 = 1546{,}2\ \text{kJ/kg}
          $$
          $$
          h_2 = 0{,}7308\cdot 2693{,}1 + 0{,}2692\cdot 467{,}13 = 2093{,}9\ \text{kJ/kg}
          $$

          Las tablas de la asignatura dan $h$ y $v$ pero no siempre $u$, así
          que se despeja de la definición:

          $$
          u_1 = h_1 - P_1v_1 = 1546{,}2 - 100\cdot 0{,}8475 = 1461{,}45
          $$
          $$
          u_2 = h_2 - P_2v_2 = 2093{,}9 - 150\cdot 0{,}8475 = 1966{,}78
          $$

          Y como el volumen es constante, $W = 0$:

          $$
          Q = m\,(u_2 - u_1) = 0{,}59\cdot(1966{,}78 - 1461{,}45) = 298\ \text{kJ}
          $$

      - tipo: justificar
        pregunta: Ordena el planteamiento del ejercicio. Una pieza es falsa.
        piezas:
          - texto: >-
              El recipiente es rígido y cerrado, así que $v_2 = v_1$: en el
              diagrama T-v el proceso es una vertical.
          - texto: >-
              Con $v_1 = 0{,}8475$ y la tabla a 1,5 bar sale $x_2 = 0{,}7308$,
              y con él la masa de vapor final.
          - texto: >-
              Al ser rígido no hay trabajo de frontera, luego
              $Q = m\,\Delta u_{12}$, y las energías internas salen de las
              entalpías restando $Pv$.
          - texto: >-
              Y como el proceso es a volumen constante, el calor se puede
              calcular directamente como $m\,c_v\,\Delta T$.
            trampa: true
            mensaje: |
              Esa fórmula es del **gas ideal**, y aquí la sustancia es agua en
              dos fases, que no lo es ni de lejos. Además fallaría por otro
              motivo: buena parte del calor se va en evaporar agua sin subir
              la temperatura, y un $c_v\,\Delta T$ no puede contabilizar un
              cambio de fase.
    resolucion: |
      **La idea.** El recipiente es rígido y cerrado, así que el volumen
      específico no cambia: $v_2 = v_1$. Esa vertical en el diagrama
      $T\text{-}v$ es lo que permite entrar en la tabla de 1,5 bar sin
      ningún dato más.

      **a) Las temperaturas.** Los dos estados están dentro de la campana, así
      que la temperatura es la de saturación de su presión:
      $\theta_1 = 99{,}61\ \text{°C}$ y $\theta_2 = 111{,}35\ \text{°C}$.

      **b) Las masas de vapor.**

      $$
      v_1 = 0{,}5\cdot 1{,}6939 + 0{,}5\cdot 0{,}0010432 = 0{,}8475
      \qquad
      m = \frac{0{,}5}{0{,}8475} = 0{,}59\ \text{kg}
      $$
      $$
      x_2 = \frac{0{,}8475 - 0{,}0010527}{1{,}1593 - 0{,}0010527} = 0{,}7308
      $$
      $$
      m''_1 = 0{,}295\ \text{kg}
      \qquad
      m''_2 = 0{,}431\ \text{kg}
      $$

      **c) El calor.** Sin trabajo de frontera, $Q = m\,\Delta u_{12}$, y las
      energías internas salen de $u = h - Pv$:

      $$
      u_1 = 1461{,}45 \qquad u_2 = 1966{,}78 \qquad
      Q = 0{,}59\cdot 505{,}33 = 298\ \text{kJ}
      $$

      **Una comprobación que conviene hacer.** ¿Es razonable que subir 12
      grados cueste 298 kJ? Calentar 0,59 kg de agua líquida 12 grados
      costaría unos 30 kJ. Los otros 270 se van en evaporar 136 gramos, y a
      unos 2.230 kJ por kilogramo de calor latente eso son 303 kJ, del mismo
      orden. Las cuentas cuadran, y de paso queda claro dónde se va el calor
      en un cambio de fase: casi todo en cambiar de fase.

  - id: ejter-col37-el-vapor-que-se-enfria-a-volumen-constante
    titulo: El vapor que se enfría a volumen constante, y dónde empieza a condensar
    fuente: >-
      Ejercicio 3.7 de «Ejercicios · Tema 3 (agua)», colección de la asignatura
      · Ingeniería Térmica, EIG-GIE Donostia (UPV/EHU), que lo toma del Moran y
      Shapiro 3.24. Dos de sus tres respuestas —0,844 y 0,0017— se reproducen
      exactas con las tablas de vapor del sitio, que siguen el anexo del
      curso, sacando el volumen a 7 bar como se explica en la resolución. La
      tercera no: la colección
      publica «14,2 ºC» y la interpolación da 140,2 ºC. Aquí se publica
      140,2 y el motivo está escrito en la resolución. Hasta el 13 de
      septiembre de 2026 esta línea decía «sus tres respuestas se reproducen»,
      que era justo lo contrario de lo que el propio desarrollo explicaba.
    nivel: practica
    enunciado: |
      Un depósito rígido y cerrado contiene $1\ \text{m}^{3}$ de vapor de agua.
      La presión y la temperatura inicial del vapor son $7\ \text{bar}$ y
      $500\ ^\circ\text{C}$, respectivamente. El vapor de agua cede calor al
      medio circundante, de tal forma que se enfría.

      Determínese a qué temperatura comienza a condensar el agua, y fracción de
      condensado cuando la presión es igual a $0{,}5\ \text{bar}$. ¿Qué volumen
      en $\text{m}^{3}$ ocupa el líquido saturado en este estado?
    pide: La temperatura de comienzo de la condensación, la fracción condensada y el volumen de líquido.
    pasos:
      - tipo: reconocer
        pregunta: |
          El depósito es rígido y cerrado. ¿Qué propiedad se mantiene constante
          durante todo el enfriamiento?
        opciones:
          - texto: El volumen específico, porque ni el volumen ni la masa cambian
            correcta: true
            mensaje: |
              Eso es, y es la llave del problema entero. $v = V/m$ con las dos
              constantes: el estado se mueve por una **vertical** en el
              diagrama $T$–$v$, y eso basta para entrar en cualquier tabla sin
              más datos.
          - texto: La presión, porque el depósito está cerrado
            mensaje: |
              Cerrado quiere decir que no entra ni sale masa, no que la presión
              aguante. De hecho la presión baja: el enunciado la sigue hasta
              0,5 bar.
          - texto: La temperatura, porque cede calor lentamente
            mensaje: |
              Si la temperatura no cambiara no habría enfriamiento. Ceder calor
              despacio hace el proceso casi reversible, que es otra cosa.
          - texto: La energía interna, porque no hay trabajo
            mensaje: |
              No hay trabajo —el volumen no cambia—, pero sí hay calor, y
              $\Delta U = Q$. La energía interna baja: es justamente lo que se
              está sacando del depósito.

      - tipo: calcular
        titulo: Dónde empieza a condensar
        pregunta: |
          Con $v = 0{,}5070\ \text{m}^{3}/\text{kg}$, ¿a qué temperatura corta
          el enfriamiento la curva de vapor saturado?
        respuesta:
          tipo: magnitud
          valor: '140.2 °C'
          tolerancia: 0.003
          formato: una temperatura, con su unidad
        distractores:
          - valor: '138.9 °C'
            mensaje: |
              Esa es la fila de 3,5 bar tal cual, sin interpolar. Su
              $v_g = 0{,}52418$ es mayor que nuestro 0,5070, así que la
              temperatura buscada está algo por encima.
          - valor: '165 °C'
            mensaje: |
              Esa es la de saturación a 7 bar, la presión **inicial**. Pero el
              vapor arranca a 500 °C, muy lejos de la campana: antes de
              condensar tiene que enfriarse mucho, y mientras tanto la presión
              cae.
          - valor: '81.32 °C'
            mensaje: |
              Esa es la de saturación a 0,5 bar, el estado **final**. Para
              entonces ya lleva mucho condensado; la pregunta es dónde empezó.
        pista: |
          Busca en la tabla de saturación la presión cuyo $v_g$ vale 0,5070, e
          interpola entre las dos filas que lo rodean.
        desarrollo: |
          $$
          m = \frac{V}{v} = \frac{1}{0{,}5070} = 1{,}972\ \text{kg}
          $$

          Entre 3,5 bar ($v_g = 0{,}52418$, $T = 138{,}86$) y 4 bar
          ($v_g = 0{,}46238$, $T = 143{,}61$):

          $$
          T = 138{,}86 + \frac{0{,}52418-0{,}5070}{0{,}52418-0{,}46238}\,(143{,}61-138{,}86)
          = 140{,}2\ ^\circ\text{C}
          $$

      - tipo: calcular
        titulo: La fracción condensada
        pregunta: |
          A $0{,}5\ \text{bar}$ —donde $v_f = 0{,}0010299$ y
          $v_g = 3{,}2400\ \text{m}^{3}/\text{kg}$—, ¿qué fracción de la masa se
          ha condensado?
        respuesta:
          tipo: numero
          valor: '0.844'
          tolerancia: 0.005
          formato: una fracción entre 0 y 1
        distractores:
          - valor: '0.156'
            mensaje: |
              Ese es el **título**, la fracción de vapor. La pregunta es la
              contraria: lo condensado es $1-x$.
          - valor: '0.515'
            mensaje: |
              Ese número no sale de aquí. Comprueba que has restado $v_f$ en el
              numerador y que el denominador es $v_g - v_f$, no $v_g$ solo.
        pista: |
          $x = \dfrac{v - v_f}{v_g - v_f}$, y lo condensado es $1-x$.
        desarrollo: |
          $$
          x = \frac{0{,}5070-0{,}0010299}{3{,}2400-0{,}0010299} = 0{,}1562
          \qquad
          1-x = 0{,}844
          $$

      - tipo: calcular
        titulo: El volumen que ocupa el líquido
        pregunta: |
          ¿Cuántos metros cúbicos del depósito ocupa ese líquido saturado?
        respuesta:
          tipo: magnitud
          valor: '0.00171 m^3'
          tolerancia: 0.03
          formato: un volumen, con su unidad
        distractores:
          - valor: '0.844 m^3'
            mensaje: |
              Esa es la fracción de **masa**, no de volumen, y ahí está toda la
              gracia del ejercicio: el 84 % de la masa cabe en el 0,17 % del
              depósito.
          - valor: '1.664 m^3'
            mensaje: |
              Esos son los kilogramos de líquido, no su volumen. Falta
              multiplicar por $v_f$, que es mil veces menor que el del vapor.
        pista: |
          $V_f = (1-x)\,m\,v_f$.
        desarrollo: |
          $$
          V_f = 0{,}844 \cdot 1{,}972 \cdot 0{,}0010299 = 0{,}00171\ \text{m}^{3}
          $$

      - tipo: justificar
        pregunta: Ordena la lectura del resultado. Una pieza es falsa.
        piezas:
          - texto: 'El 84,4 % de la masa es líquido y ocupa 0,00171 m³, o sea el 0,17 % del depósito.'
          - texto: 'Cabe porque el volumen específico del líquido es unas tres mil veces menor que el del vapor a esa presión.'
          - texto: 'Como casi toda la masa es líquido, el depósito está prácticamente lleno de agua.'
            trampa: true
            mensaje: |
              Justo al revés, y es lo que este ejercicio existe para enseñar.
              Mirando por una ventana verías el depósito **lleno de vapor**,
              con un dedo de agua en el fondo. Fracción de masa y fracción de
              volumen no se parecen en nada dentro de la campana.
    resolucion: |
      **La llave: el volumen específico no cambia.** El depósito es rígido y
      está cerrado, así que $v = V/m$ tiene las dos cosas constantes.

      **El volumen de partida, que el anexo no tabula.** Las tablas del anexo
      —y las del sitio, que siguen su rejilla— no tienen isobara de 7 bar: a
      500 °C hay que ir entre la de 6 bar, $v = 0{,}59200$, y la de 8 bar,
      $v = 0{,}44332\ \text{m}^{3}/\text{kg}$. La recta entre las dos da
      0,5177, un 2 % de más, porque a 500 °C el vapor se comporta casi como un
      gas ideal y su volumen va como $1/P$. Lo que casi no cambia es el
      producto $Pv$, así que se interpola él:

      $$
      v = \frac{1}{7}\cdot\frac{6\cdot 0{,}59200 + 8\cdot 0{,}44332}{2}
      = 0{,}5070\ \frac{\text{m}^{3}}{\text{kg}}
      $$

      Es lo que da la tabla de 7 bar del Moran, que es de donde viene el
      ejercicio. Con él, la masa: $m = 1/0{,}5070 = 1{,}972$ kg, y ese 0,5070
      vale para todo el problema. Quien interpole en línea recta llega a
      139,4 °C, 0,8405 y 0,00167 m³: el mismo razonamiento, un 2 % desplazado.

      **Dónde empieza a condensar.** El estado baja por una vertical en el
      diagrama $T$–$v$ hasta tocar la curva de vapor saturado, es decir hasta
      la presión cuyo $v_g$ vale 0,5070. En la tabla queda entre 3,5 bar
      ($v_g = 0{,}52418$) y 4 bar ($v_g = 0{,}46238$), e interpolando:

      $$
      T = 138{,}86 + \frac{0{,}52418-0{,}5070}{0{,}52418-0{,}46238}\,(143{,}61-138{,}86)
      = 140{,}2\ ^\circ\text{C}
      $$

      **Y aquí hay que decir algo del enunciado.** La colección publica como
      respuesta «14,2 ºC», y no es lo que sale: es 140,2 con un dígito
      perdido. Las otras dos respuestas de la misma línea —0,844 y 0,0017—
      salen exactas, así que no es que el problema esté mal resuelto, es una
      errata al escribir el resultado. Se dice en voz alta porque un alumno que
      obtenga 140 y lea 14,2 va a pensar que se ha equivocado él.

      **La fracción condensada.** A 0,5 bar:

      $$
      x = \frac{0{,}5070-0{,}0010299}{3{,}2400-0{,}0010299} = 0{,}1562
      \qquad
      1-x = 0{,}844
      $$

      **El volumen de líquido.**

      $$
      V_f = 0{,}844 \cdot 1{,}972 \cdot 0{,}0010299 = 0{,}00171\ \text{m}^{3}
      $$

      **Y lo que hay que llevarse.** El 84,4 % de la masa es líquido y ocupa el
      **0,17 %** del depósito. Si pudieras mirar dentro verías un depósito
      lleno de vapor con un dedo de agua en el fondo. Dentro de la campana,
      fracción de masa y fracción de volumen no se parecen en nada — y el
      título, que es lo que se calcula, siempre es de masa.
