ejercicios:
  - id: ejter-que-es-exactamente-el-coeficiente-de-pelicula
    titulo: Qué es exactamente el coeficiente de película
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería, sobre la ley de Newton del
      enfriamiento del Tema 9 de la asignatura. No es de examen ni de la
      colección.
    nivel: ejemplo
    enunciado: |
      Una placa de $0{,}5\ \text{m}^{2}$ está a $90\ \text{°C}$ y la rodea aire
      quieto a $20\ \text{°C}$. En esas condiciones el coeficiente de película
      vale $h = 12\ \text{W/(m}^{2}\text{·K)}$.

      a) ¿Cuánto calor cede la placa por convección?

      b) Se pone un ventilador delante y el coeficiente sube a
      $h = 60\ \text{W/(m}^{2}\text{·K)}$. ¿Cuánto cede ahora?
    pide: El calor cedido por convección, antes y después del ventilador.
    pasos:
      - tipo: reconocer
        pregunta: |
          El coeficiente de película ha pasado de 12 a 60 sin cambiar ni la
          placa ni el aire. ¿De qué es propiedad $h$?
        opciones:
          - texto: >-
              De nada: no es una propiedad, es el resultado de cómo se mueve
              el fluido junto a la pared
            correcta: true
            mensaje: |
              Eso es. Por eso hay una correlación distinta para cada
              geometría y cada régimen: $h$ no se busca en una tabla como la
              conductividad, se **calcula** para la situación concreta.
          - texto: >-
              Del material de la placa, como la conductividad
            mensaje: |
              Si lo fuera, poner un ventilador no lo cambiaría. La placa es la
              misma antes y después, y $h$ se ha multiplicado por cinco.
          - texto: >-
              Del aire, y se busca en la tabla de propiedades a la temperatura
              de película
            mensaje: |
              En la tabla se buscan la conductividad, la viscosidad y el
              Prandtl **del aire**, que sí son propiedades. Con ellas se
              calcula $h$; $h$ mismo no está en ninguna tabla, porque depende
              también de la velocidad y de la forma del cuerpo.

      - tipo: calcular
        titulo: El calor con el aire quieto
        pregunta: |
          ¿Cuánto calor cede la placa?
        respuesta:
          tipo: magnitud
          valor: '420 W'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '840 W'
            mensaje: |
              Te has dejado el área. $h$ está por **metro cuadrado**: hay que
              multiplicar por los $0{,}5\ \text{m}^{2}$, no por uno.
          - valor: '330 W'
            mensaje: |
              Has usado la media de las dos temperaturas, 55, en lugar de su
              diferencia. La ley de Newton va con el **salto**: 90 menos 20.
        pista: |
          $\dot{Q} = h\,A\,(\theta_s - \theta_\infty)$.
        desarrollo: |
          $$
          \dot{Q} = h\,A\,(\theta_s - \theta_\infty)
          = 12 \cdot 0{,}5 \cdot (90 - 20) = 420\ \text{W}
          $$

          El salto vale lo mismo en grados Celsius que en kelvin —70 en los
          dos—, así que aquí no hace falta convertir. Es de las pocas veces en
          la asignatura que da igual, y conviene saber **por qué** da igual:
          porque es una diferencia.

      - tipo: calcular
        titulo: El calor con el ventilador
        pregunta: |
          Con $h = 60\ \text{W/(m}^{2}\text{·K)}$, ¿cuánto cede?
        respuesta:
          tipo: magnitud
          valor: '2100 W'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '84 W'
            mensaje: |
              Has dividido. $h$ no es una resistencia: es lo contrario, una
              conductancia. La resistencia de la convección es $1/(hA)$, así
              que subir $h$ **baja** la resistencia y **sube** el calor.
          - valor: '2520 W'
            mensaje: |
              Has sumado los dos coeficientes, 12 más 60. El ventilador no
              añade un mecanismo nuevo: cambia el que ya había, así que el 12
              desaparece.
        pista: |
          La misma cuenta, con el otro coeficiente.
        desarrollo: |
          $$
          \dot{Q} = 60 \cdot 0{,}5 \cdot 70 = 2100\ \text{W}
          $$

          Cinco veces más, exactamente las cinco veces que ha subido $h$. La
          ley de Newton es lineal en las tres cosas que la componen.

      - tipo: justificar
        pregunta: Ordena lo que este ejemplo deja probado. Una pieza es falsa.
        piezas:
          - texto: >-
              El calor por convección es proporcional al área, al salto de
              temperatura y al coeficiente de película.
          - texto: >-
              De los tres factores, el único que no se conoce de entrada es
              $h$, y por eso el tema entero va de calcularlo.
          - texto: >-
              Un ventilador multiplica por cinco el calor cedido sin tocar ni
              la placa ni el aire.
          - texto: >-
              Como $h$ ha subido, la placa se enfría más deprisa y por eso el
              salto de temperatura también aumenta.
            trampa: true
            mensaje: |
              El salto es un dato del enunciado: la placa sigue a 90 °C y el
              aire a 20. Lo que cambia es cuánto calor hace falta aportarle
              para mantenerla ahí. Mezclar «cede más calor» con «está más
              caliente» es el error que luego arruina los ejercicios de
              régimen transitorio.
    resolucion: |
      **a) Con el aire quieto.**

      $$
      \dot{Q} = h\,A\,(\theta_s - \theta_\infty)
      = 12 \cdot 0{,}5 \cdot (90-20) = 420\ \text{W}
      $$

      **b) Con el ventilador.**

      $$
      \dot{Q} = 60 \cdot 0{,}5 \cdot 70 = 2100\ \text{W}
      $$

      **Lo que hay que llevarse.** La ley de Newton no es una ley física en el
      sentido en que lo es la de Fourier: es la **definición** de $h$. Dice
      «llamo $h$ a lo que hay que poner ahí para que la cuenta salga», y todo
      el trabajo del tema —Reynolds, Prandtl, Nusselt, las correlaciones— es
      averiguar cuánto vale ese número en cada situación.

      Por eso conviene tener claro desde el principio que $h$ no se busca: se
      calcula. Y que cuando un enunciado te lo da, como aquí, te está
      ahorrando justamente la parte difícil.
  - id: ejter-el-rayleigh-que-obliga-a-churchill-chu
    titulo: El Rayleigh que obliga a usar Churchill y Chu
    fuente: >-
      Ejemplo · Road to Ingeniería, escrito a propósito para el caso que el
      material publicado esquiva: un Rayleigh por encima de mil millones, donde
      la correlación laminar corta ya no vale y no hay atajo. No es de examen ni
      de la colección.
    nivel: ejemplo
    enunciado: |
      Una tubería horizontal de vapor de $600\ \text{mm}$ de diámetro exterior
      tiene su superficie a $150\ \text{°C}$ y está rodeada de aire quieto a
      $20\ \text{°C}$.

      Calcúlese el calor que pierde por convección natural, por metro de
      tubería.

      Propiedades del aire a la temperatura de película:
      $k = 0{,}030\ \text{W/(m·K)}$,
      $\nu = 2{,}15\cdot 10^{-5}\ \text{m}^{2}/\text{s}$,
      $\text{Pr} = 0{,}702$. Tómese $g = 9{,}8\ \text{m/s}^{2}$ y, para el
      aire, $\beta = 1/T$.
    pide: El calor perdido por convección natural, en vatios por metro.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de elegir correlación, ¿qué hay que calcular y por qué?
        opciones:
          - texto: >-
              El Rayleigh, porque es el que dice si la correlación corta
              —$\text{Nu} = 0{,}53\,\text{Ra}^{1/4}$— se puede usar o no
            correcta: true
            mensaje: |
              Exacto. La corta lleva su condición pegada: $\text{Ra} < 10^{9}$.
              Comprobarla no es un trámite, es lo que decide si el resto del
              ejercicio está bien planteado.
          - texto: >-
              El Reynolds, para saber si es laminar o turbulento
            mensaje: |
              Aquí no hay nadie empujando el aire: no hay velocidad, así que no
              hay Reynolds. En convección natural el papel de Reynolds lo hace
              Grashof, y quien decide el régimen es Rayleigh.
          - texto: >-
              Nada: en un cilindro horizontal siempre vale Churchill y Chu
            mensaje: |
              Vale siempre, sí —hasta $\text{Ra} \le 10^{12}$—, y por eso es la
              de referencia. Pero si no compruebas Rayleigh no sabes si podías
              haberte ahorrado la fórmula larga, ni si el ejercicio se ataca
              mejor por otro lado.

      - tipo: calcular
        titulo: El Rayleigh
        pregunta: |
          ¿Cuánto vale $\text{Ra}$?
        respuesta:
          tipo: numero
          valor: '1.167e9'
          tolerancia: 30000000
          formato: un número, en notación científica si quieres
        distractores:
          - valor: '1.663e9'
            mensaje: |
              Ese es el **Grashof**, sin multiplicar por el Prandtl.
              $\text{Ra} = \text{Gr}\cdot\text{Pr}$, y aquí el Prandtl vale
              0,702, así que la diferencia no es pequeña: baja el resultado un
              30 %.
          - valor: '1.459e8'
            mensaje: |
              Has usado el radio, 0,3 m, en vez del diámetro. Y fíjate en lo
              que eso hace: el cubo divide por ocho, el Rayleigh se queda en
              $1{,}5\cdot 10^{8}$ y **concluirías que puedes usar la
              correlación corta**. Un error de longitud característica no da un
              número algo peor: cambia de fórmula.
        pista: |
          $\text{Gr} = g\,\beta\,\Delta\theta\,D^{3}/\nu^{2}$, con
          $\beta = 1/T_f$ y $T_f = 85 + 273$. Después, $\text{Ra} =
          \text{Gr}\cdot\text{Pr}$.
        desarrollo: |
          La temperatura de película es $(150+20)/2 = 85\ \text{°C}$, o sea
          $358\ \text{K}$, y de ahí $\beta = 1/358 = 2{,}793\cdot 10^{-3}$.

          $
          \text{Gr} = \frac{9{,}8\cdot 2{,}793\cdot 10^{-3}\cdot 130\cdot
          0{,}6^{3}}{\left(2{,}15\cdot 10^{-5}\right)^{2}}
          = 1{,}663\cdot 10^{9}
          $
          $
          \text{Ra} = 1{,}663\cdot 10^{9}\cdot 0{,}702 = 1{,}167\cdot 10^{9}
          $

          Por encima de $10^{9}$, aunque sea por poco: la correlación corta
          queda fuera.

      - tipo: calcular
        titulo: El Nusselt
        pregunta: |
          Con Churchill y Chu, ¿cuánto vale $\text{Nu}$?
        respuesta:
          tipo: numero
          valor: '121.4'
          tolerancia: 2
          formato: un número
        distractores:
          - valor: '97.97'
            mensaje: |
              Ese es el de la correlación corta,
              $\text{Nu} = 0{,}53\,\text{Ra}^{1/4}$, que aquí **no se puede
              usar**: el Rayleigh se ha pasado de $10^{9}$. Y no falla poco:
              se queda un 19 % por debajo.
          - valor: '11.02'
            mensaje: |
              Te has dejado el cuadrado de fuera. Toda la llave de Churchill y
              Chu va elevada a dos; sin él el Nusselt sale once veces menor.
        pista: |
          $\text{Nu} = \left\{0{,}6 + 0{,}387\,\text{Ra}^{1/6} /
          \left[1+(0{,}559/\text{Pr})^{9/16}\right]^{8/27}\right\}^{2}$.
          Empieza por $\text{Ra}^{1/6}$.
        desarrollo: |
          Por partes, que es como no equivocarse:

          $
          \text{Ra}^{1/6} = \left(1{,}167\cdot 10^{9}\right)^{1/6} = 32{,}45
          $
          $
          \left[1+\left(\frac{0{,}559}{0{,}702}\right)^{9/16}\right]^{8/27}
          = \left[1+0{,}8798\right]^{8/27} = 1{,}2057
          $
          $
          \text{Nu} = \left\{0{,}6 + \frac{0{,}387\cdot 32{,}45}{1{,}2057}
          \right\}^{2} = \left\{0{,}6 + 10{,}42\right\}^{2} = 121{,}4
          $

      - tipo: calcular
        titulo: El calor por metro
        pregunta: |
          ¿Cuánto calor pierde la tubería por cada metro de longitud?
        respuesta:
          tipo: magnitud
          valor: '1487 W/m'
          tolerancia: 0.02
          formato: una potencia por unidad de longitud, con su unidad
        distractores:
          - valor: '1200 W/m'
            mensaje: |
              Eso sale de haber usado la correlación corta. Es exactamente lo
              que cuesta no comprobar Rayleigh: 287 W por metro, un 19 %, y en
              una tubería de cincuenta metros son catorce kilovatios.
          - valor: '744 W/m'
            mensaje: |
              Has usado el radio en el perímetro. El área lateral por metro es
              $\pi D$, no $\pi R$.
        pista: |
          Primero $h = \text{Nu}\,k/D$, y luego
          $\dot{q}' = h\,\pi D\,\Delta\theta$.
        desarrollo: |
          $
          h = \frac{\text{Nu}\,k}{D} = \frac{121{,}4\cdot 0{,}030}{0{,}6}
          = 6{,}07\ \frac{\text{W}}{\text{m}^{2}\text{K}}
          $
          $
          \dot{q}' = h\,\pi D\,\Delta\theta
          = 6{,}07\cdot\pi\cdot 0{,}6\cdot 130 = 1487\ \frac{\text{W}}{\text{m}}
          $

          Seis vatios por metro cuadrado y kelvin es un valor típico de
          convección natural en aire: dos órdenes de magnitud por debajo del
          agua en movimiento del tema. Y aun así, con trece metros cuadrados de
          tubería por cada diez metros, se van casi quince kilovatios.

      - tipo: justificar
        pregunta: Ordena el planteamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              No hay velocidad impuesta, así que es convección natural y el
              número que decide el régimen es Rayleigh, no Reynolds.
          - texto: >-
              Ra sale $1{,}167\cdot 10^{9}$, por encima de $10^{9}$, así que la
              correlación corta queda descartada y hay que usar Churchill y Chu.
          - texto: >-
              Con Nu = 121,4 el coeficiente de película vale 6,07 y la tubería
              pierde 1.487 W por metro.
          - texto: >-
              Como el Rayleigh apenas pasa de $10^{9}$, las dos correlaciones
              dan prácticamente lo mismo y da igual cuál se use.
            trampa: true
            mensaje: |
              Es la conclusión cómoda y es falsa: la corta da 1.200 W/m frente
              a 1.487, un 19 % menos. Que una frontera se cruce por poco no
              significa que las dos fórmulas se parezcan a los lados; significa
              que ninguna de las dos es continua con la otra ahí. La condición
              se comprueba y se obedece.
    resolucion: |
      **La temperatura de película y las propiedades.** $(150+20)/2 = 85$ °C,
      es decir 358 K, y con ella $\beta = 1/358 = 2{,}793\cdot 10^{-3}$.

      **El régimen.**

      $
      \text{Gr} = \frac{g\,\beta\,\Delta\theta\,D^{3}}{\nu^{2}}
      = \frac{9{,}8\cdot 2{,}793\cdot 10^{-3}\cdot 130\cdot 0{,}216}{4{,}6225\cdot 10^{-10}}
      = 1{,}663\cdot 10^{9}
      $
      $
      \text{Ra} = \text{Gr}\cdot\text{Pr} = 1{,}167\cdot 10^{9} > 10^{9}
      $

      **La correlación, y por qué esta y no la otra.** Con $\text{Ra}$ por
      encima de $10^{9}$ la alternativa laminar $0{,}53\,\text{Ra}^{1/4}$ está
      fuera de su rango. Queda Churchill y Chu:

      $
      \text{Nu} = \left\{0{,}6 + \frac{0{,}387\cdot 32{,}45}{1{,}2057}
      \right\}^{2} = 121{,}4
      $

      **El calor.**

      $
      h = \frac{121{,}4\cdot 0{,}030}{0{,}6} = 6{,}07
      \qquad
      \dot{q}' = 6{,}07\cdot\pi\cdot 0{,}6\cdot 130 = 1487\ \text{W/m}
      $

      **Por qué existe este ejercicio.** Porque en el material publicado no
      hay ninguno donde Churchill y Chu sea inevitable. En el examen de enero
      de 2026 el Rayleigh sale $1{,}86\cdot 10^{9}$ —también por encima— y la
      resolución oficial dice que la correlación «no es aconsejable para un
      examen» y resuelve por otra vía, aprovechando que el enunciado da la
      temperatura exterior. En enero de 2017-2018 el Rayleigh se queda por
      debajo y la laminar vale.

      Aquí no hay escapatoria: lo que se pide es precisamente el calor que
      sale de la superficie, así que no se puede entrar por el otro extremo.
      Y el precio de saltarse la comprobación está medido: **un 19 %**.
  - id: ejter-cuanta-tuberia-para-calentar-el-agua
    titulo: Cuánta tubería hace falta para calentar el agua
    fuente: >-
      Ejercicio 9.2 de la colección de problemas del Tema 9 · Ingeniería
      Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El material lo
      resuelve entero y publica sus valores intermedios; los cuatro están
      rehechos y contrastados contra él.
    nivel: practica
    enunciado: |
      Se quieren calentar $3\ \text{kg/s}$ de agua líquida desde
      $10\ \text{°C}$ hasta $66\ \text{°C}$. Para ello se hace circular el
      agua por un tubo cuya superficie interior está a $82\ \text{°C}$. El
      diámetro de la tubería es de $5\ \text{cm}$.

      Calcúlese la longitud de tubería necesaria.

      Propiedades del agua a la temperatura característica:
      $\rho = 992{,}9\ \text{kg/m}^{3}$, $k = 0{,}628\ \text{W/(m·K)}$,
      $c_p = 4.179\ \text{J/(kg·K)}$, $\text{Pr} = 4{,}524$,
      $\nu = 6{,}949\cdot 10^{-7}\ \text{m}^{2}/\text{s}$.
    pide: La longitud de tubería, en metros.
    pasos:
      - tipo: reconocer
        pregunta: |
          El flujo es interior a una tubería. ¿A qué temperatura hay que leer
          las propiedades del agua?
        opciones:
          - texto: >-
              A la del fluido, que aquí es la media entre entrada y salida:
              38 °C
            correcta: true
            mensaje: |
              Exacto. Dittus-Boelter es la única de las correlaciones del tema
              que **no** usa la temperatura de película, y por eso conviene
              escribirlo en el folio antes de abrir la tabla.
          - texto: >-
              A la de película, la media entre la pared y el fluido:
              $(82+38)/2 = 60\ \text{°C}$
            mensaje: |
              Esa es la de las otras tres correlaciones del tema —placa plana,
              exterior de tubería y convección natural—, y por eso el error es
              tan fácil. Dittus-Boelter es la excepción: propiedades a la
              temperatura del fluido.
          - texto: >-
              A la de la pared, 82 °C, porque es donde ocurre el intercambio
            mensaje: |
              El intercambio ocurre en la capa límite, no en la pared, y la
              capa límite está a temperaturas intermedias. Ninguna correlación
              del tema evalúa las propiedades a la temperatura de la pared
              sola.

      - tipo: calcular
        titulo: El número de Reynolds
        pregunta: |
          ¿Cuánto vale el Reynolds del flujo?
        respuesta:
          tipo: numero
          valor: '110735'
          tolerancia: 0.02
          formato: un número grande, sin unidades
        distractores:
          - valor: '55361'
            mensaje: |
              Has usado el radio como longitud característica. En flujo
              interior a una tubería, la longitud característica es el
              **diámetro** entero: 0,05 m, no 0,025.
          - valor: '77515'
            mensaje: |
              Has usado la velocidad sin dividir por la densidad, es decir
              tomando el gasto másico como si fuera volumétrico. La velocidad
              sale de $c = \dot m/(\rho A)$.
        pista: |
          Primero la velocidad, $c = \dot m/(\rho A)$ con
          $A = \pi D^{2}/4$, y luego $\text{Re} = cD/\nu$.
        desarrollo: |
          $$
          A = \frac{\pi D^{2}}{4} = 1{,}9635\cdot 10^{-3}\ \text{m}^{2}
          \qquad
          c = \frac{3}{992{,}9\cdot 1{,}9635\cdot 10^{-3}}
          = 1{,}539\ \frac{\text{m}}{\text{s}}
          $$

          $$
          \text{Re} = \frac{c\,D}{\nu}
          = \frac{1{,}539\cdot 0{,}05}{6{,}949\cdot 10^{-7}} = 110.735
          $$

          Muy por encima de 10.000, así que Dittus-Boelter es aplicable sin
          reservas.

      - tipo: calcular
        titulo: El coeficiente de película
        pregunta: |
          El agua **se calienta**, así que el exponente de Prandtl es 0,4.
          ¿Cuánto vale $h$?
        respuesta:
          tipo: magnitud
          valor: '5733 W/m2 K'
          tolerancia: 0.02
          formato: un coeficiente de película, con su unidad
        distractores:
          - valor: '4929 W/m2 K'
            mensaje: |
              Has usado el exponente 0,3, que es el del fluido que **se
              enfría**. Aquí la pared está a 82 °C y el agua entra a 10: el
              agua se calienta, y el exponente es 0,4. La diferencia es un
              14 % en el Nusselt, y se traslada entera a la longitud.
          - valor: '456.4 W/m2 K'
            mensaje: |
              Ese es el número de Nusselt, que es adimensional. Para pasar a
              coeficiente de película hay que multiplicarlo por $k/D$: la
              unidad lo delata.
        pista: |
          $\text{Nu} = 0{,}023\,\text{Re}^{0{,}8}\text{Pr}^{0{,}4}$, y de ahí
          $h = \text{Nu}\,k/D$.
        desarrollo: |
          $$
          \text{Nu} = 0{,}023\cdot 110.735^{0{,}8}\cdot 4{,}524^{0{,}4}
          = 456{,}4
          $$

          $$
          h = \frac{\text{Nu}\,k}{D} = \frac{456{,}4\cdot 0{,}628}{0{,}05}
          = 5.733\ \frac{\text{W}}{\text{m}^{2}\text{K}}
          $$

      - tipo: calcular
        titulo: La longitud
        pregunta: |
          Igualando el calor que gana el agua con el que entra por la pared,
          ¿qué longitud de tubería hace falta?
        respuesta:
          tipo: magnitud
          valor: '17.7 m'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '20.9 m'
            mensaje: |
              Has usado la diferencia media logarítmica de temperaturas,
              37,23 °C. Es el criterio riguroso y **esta asignatura ha
              decidido no usarlo**: sus transparencias dicen que se emplea la
              temperatura media. Con ella el salto es de 44 grados y la
              longitud, 17,7 m.
          - valor: '35.4 m'
            mensaje: |
              El doble. Has puesto el radio donde va el diámetro en la
              superficie lateral: es $\pi D L$, no $\pi r L$. Media superficie
              obliga al doble de tubo.
        pista: |
          $\dot Q = \dot m c_p \Delta\theta$, y también
          $\dot Q = h\,(\pi D L)(\theta_{pared} - \theta_{media})$ con la
          temperatura media del agua, 38 °C.
        desarrollo: |
          $$
          \dot Q = \dot m\,c_p\,(\theta_s - \theta_i)
          = 3\cdot 4.179\cdot 56 = 702.072\ \text{W}
          $$

          $$
          702.072 = 5.733\cdot(\pi\cdot 0{,}05\cdot L)\cdot(82 - 38)
          \;\Longrightarrow\;
          L = 17{,}7\ \text{m}
          $$

      - tipo: justificar
        pregunta: Ordena el método del ejercicio. Una pieza es falsa.
        piezas:
          - texto: >-
              Flujo interior a tubería, así que la longitud característica es
              el diámetro y las propiedades se leen a la temperatura del
              fluido, 38 °C.
          - texto: >-
              Con Re = 110.735 el flujo es turbulento de sobra, así que
              Dittus-Boelter es aplicable, y con exponente 0,4 porque el agua
              se calienta.
          - texto: >-
              De Nusselt sale h, y de igualar los dos calores —el que gana el
              agua y el que entra por la pared— sale la longitud.
          - texto: >-
              Y si el tubo fuera el doble de largo, el agua saldría al doble
              de temperatura.
            trampa: true
            mensaje: |
              No, porque el salto de temperatura que impulsa el calor **se va
              agotando**: cuanto más se acerca el agua a los 82 °C de la
              pared, menos calor entra por metro. El agua nunca pasaría de 82,
              por muchos metros de tubo que pongas. Justamente por eso el
              promedio correcto es logarítmico y no lineal, y por eso la
              decisión del curso de usar la media aritmética es una
              simplificación consciente.
    resolucion: |
      **La temperatura característica.** Flujo interior, así que Dittus-Boelter
      pide las propiedades a la temperatura del **fluido**:
      $(10+66)/2 = 38\ \text{°C}$. Es la única correlación del tema que no usa
      la de película.

      **Reynolds.**

      $$
      c = \frac{\dot m}{\rho A} = 1{,}539\ \frac{\text{m}}{\text{s}}
      \qquad
      \text{Re} = \frac{1{,}539\cdot 0{,}05}{6{,}949\cdot 10^{-7}} = 110.735
      $$

      **Nusselt y h.** El agua se calienta, luego $n = 0{,}4$:

      $$
      \text{Nu} = 0{,}023\cdot 110.735^{0{,}8}\cdot 4{,}524^{0{,}4} = 456{,}4
      \qquad
      h = 5.733\ \frac{\text{W}}{\text{m}^{2}\text{K}}
      $$

      **La longitud.**

      $$
      \dot Q = 3\cdot 4.179\cdot 56 = 702.072\ \text{W}
      \qquad
      L = \frac{702.072}{5.733\cdot\pi\cdot 0{,}05\cdot 44} = 17{,}7\ \text{m}
      $$

      **Un aviso sobre el 44.** Ese salto es la media aritmética entre pared y
      fluido, y es lo que esta asignatura ha decidido usar: sus transparencias
      dicen expresamente que **no** se emplea la diferencia media logarítmica.
      Con ella el salto sería 37,23 °C y la longitud, 20,9 m —un 18 % más—.
      Los dos números son defendibles; el del curso es el primero.

  - id: ejter-el-agua-que-corre-por-dentro-de-la-tuberia
    titulo: La convección de dentro, y por qué apenas pesa
    fuente: >-
      Parte del ejercicio 3 de la convocatoria ordinaria de enero de 2026 ·
      Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen publica su resolución oficial, y el desarrollo está contrastado
      contra ella.
    nivel: examen
    enunciado: |
      Por una tubería de $D_1 = 0{,}5\ \text{m}$ de diámetro interior circula
      un gasto de $0{,}3\ \text{kg/s}$ de agua, que entra a $250\ \text{°C}$ y
      sale a $150\ \text{°C}$.

      Propiedades del agua a la temperatura característica:
      $\rho = 864{,}3\ \text{kg/m}^{3}$, $k = 0{,}663\ \text{W/(m·K)}$,
      $\text{Pr} = 0{,}91$,
      $\nu = 1{,}55039\cdot 10^{-7}\ \text{m}^{2}/\text{s}$.

      a) La velocidad del agua y su número de Reynolds.

      b) El coeficiente de película interior.
    pide: La velocidad, el Reynolds y el coeficiente de película interior.
    pasos:
      - tipo: reconocer
        pregunta: |
          El agua entra a 250 °C y sale a 150 °C. ¿A qué temperatura se leen
          las propiedades, y qué exponente de Prandtl toca?
        opciones:
          - texto: >-
              A 200 °C, la media del fluido, y con exponente 0,3 porque el
              agua se enfría
            correcta: true
            mensaje: |
              Los dos aciertos van juntos y salen del mismo dato: el agua
              entra más caliente de lo que sale, así que se enfría, y en flujo
              interior las propiedades van a la temperatura del fluido.
          - texto: >-
              A 200 °C, y con exponente 0,4 porque el fluido intercambia calor
            mensaje: |
              La temperatura es correcta pero el exponente no. El 0,4 es del
              fluido que **se calienta**; aquí el agua pierde 100 grados por
              el camino, así que se enfría y el exponente es 0,3.
          - texto: >-
              A la temperatura de película, y con exponente 0,3
            mensaje: |
              El exponente es correcto pero la temperatura no. Dittus-Boelter
              es la excepción del tema: propiedades a la temperatura del
              fluido, no a la de película. La de película es para la
              convección **exterior**, que en este mismo ejercicio se evalúa a
              60,35 °C.

      - tipo: calcular
        titulo: La velocidad del agua
        pregunta: |
          ¿A qué velocidad circula el agua por el tubo?
        respuesta:
          tipo: magnitud
          valor: '0.00177 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '0.00708 m/s'
            mensaje: |
              Has usado el radio en vez del diámetro al calcular el área. La
              sección es $\pi D^{2}/4$ con $D = 0{,}5$, y sale 0,196 m²: casi
              un quinto de metro cuadrado, que es mucho tubo para 0,3 kg/s.
          - valor: '1.77 m/s'
            mensaje: |
              Un factor mil, probablemente de la densidad. El agua a 200 °C
              tiene 864,3 kg/m³, no 0,8643.
        pista: |
          $c = \dot m/(\rho A)$, con $A = \pi D_1^{2}/4 = 0{,}196\ \text{m}^2$.
        desarrollo: |
          $$
          A_{int} = \frac{\pi\cdot 0{,}5^{2}}{4} = 0{,}196\ \text{m}^{2}
          \qquad
          c = \frac{0{,}3}{864{,}3\cdot 0{,}196}
          = 0{,}00177\ \frac{\text{m}}{\text{s}}
          $$

          Menos de dos milímetros por segundo. Es lentísimo, y es lo que hace
          interesante el apartado siguiente.

      - tipo: calcular
        titulo: El Reynolds
        pregunta: |
          ¿Cuánto vale el número de Reynolds, y basta para aplicar
          Dittus-Boelter?
        respuesta:
          tipo: numero
          valor: '5704'
          tolerancia: 0.02
          formato: un número, sin unidades
        distractores:
          - valor: '2851'
            mensaje: |
              Has usado el radio como longitud característica. En flujo
              interior es el **diámetro** entero, 0,5 m. Y fíjate en lo que el
              error te habría hecho concluir: 2.851 sigue estando por encima
              de 2.100, así que Dittus-Boelter parecería aplicable igual y
              nada te habría avisado.
          - valor: '22804'
            mensaje: |
              Has usado el radio al calcular la **sección**, así que la
              velocidad te ha salido cuatro veces mayor de lo que es. La
              sección de un tubo es $\pi D^{2}/4$, y con medio metro de
              diámetro son 0,196 m², no 0,049.
        pista: |
          $\text{Re} = c\,D_1/\nu$, con la velocidad del paso anterior.
        desarrollo: |
          $$
          \text{Re} = \frac{0{,}00177\cdot 0{,}5}{1{,}55039\cdot 10^{-7}}
          = 5.704
          $$

          Está por debajo de los 10.000 que Dittus-Boelter pide como condición
          cómoda, pero **por encima de 2.100**, que es el umbral de flujo
          turbulento y el límite que la propia asignatura admite. La
          resolución oficial lo comprueba explícitamente antes de seguir.

      - tipo: calcular
        titulo: El coeficiente de película interior
        pregunta: |
          Con $n = 0{,}3$, ¿cuánto vale $h_{int}$?
        respuesta:
          tipo: magnitud
          valor: '29.98 W/m2 K'
          tolerancia: 0.02
          formato: un coeficiente de película, con su unidad
        distractores:
          - valor: '22.61 W/m2 K'
            mensaje: |
              Ese es el número de Nusselt, que es adimensional. Falta
              multiplicarlo por $k/D$ para convertirlo en coeficiente de
              película.
          - valor: '14.99 W/m2 K'
            mensaje: |
              Has multiplicado el Nusselt por $k$ pero te has dejado el
              dividir por el diámetro. Es $h = \text{Nu}\,k/D$, y aquí $D$
              vale 0,5, así que dividir por él **duplica** el resultado.

              Y un aviso de paso sobre el exponente: cambiarlo de 0,3 a 0,4
              aquí apenas mueve nada, porque el Prandtl del agua a 200 °C es
              0,91, y 0,91 elevado a casi cualquier cosa sigue siendo casi 1.
              La elección del exponente importa cuando el Prandtl se aleja de
              la unidad, como en el ejercicio 9.2 de la colección, donde vale
              4,5 y la diferencia es del 14 %.
        pista: |
          $\text{Nu} = 0{,}023\,\text{Re}^{0{,}8}\text{Pr}^{0{,}3}$ y
          $h = \text{Nu}\,k/D_1$.
        desarrollo: |
          $$
          \text{Nu} = 0{,}023\cdot 5.704^{0{,}8}\cdot 0{,}91^{0{,}3} = 22{,}61
          $$

          $$
          h_{int} = \frac{22{,}61\cdot 0{,}663}{0{,}5}
          = 29{,}98\ \frac{\text{W}}{\text{m}^{2}\text{K}}
          $$

      - tipo: justificar
        pregunta: Ordena la lectura del resultado. Una pieza es falsa.
        piezas:
          - texto: >-
              El agua circula a 1,8 mm/s, que para un tubo de medio metro de
              diámetro es un caudal minúsculo.
          - texto: >-
              Por eso el Reynolds se queda en 5.704, apenas turbulento, y el
              coeficiente de película sale de solo 30 W/(m²·K).
          - texto: >-
              Con ese valor tan bajo, la resistencia de convección interior
              pesa un 15,9 % del circuito, más que las dos conducciones
              juntas.
          - texto: >-
              Y como el agua va tan despacio, la convección interior es la
              resistencia dominante del problema.
            trampa: true
            mensaje: |
              Es la segunda por la cola, no la dominante. Con el 15,9 % queda
              por detrás del aislante —30,8 %— y de la convección exterior
              —53 %—, que es la que manda. Que un valor sea sorprendentemente
              bajo no lo convierte en el que decide: eso lo dice el reparto
              completo, no la intuición.
    resolucion: |
      **La temperatura característica y el exponente.** Flujo interior, así que
      las propiedades van a la temperatura del fluido, $(250+150)/2 = 200$ °C.
      Y el agua se enfría, así que en Dittus-Boelter $n = 0{,}3$.

      **a) Velocidad y Reynolds.**

      $$
      A_{int} = \frac{\pi\cdot 0{,}5^{2}}{4} = 0{,}196\ \text{m}^{2}
      \qquad
      c = \frac{0{,}3}{864{,}3\cdot 0{,}196} = 0{,}00177\ \frac{\text{m}}{\text{s}}
      $$
      $$
      \text{Re} = \frac{0{,}00177\cdot 0{,}5}{1{,}55039\cdot 10^{-7}} = 5.704 > 2.100
      $$

      **b) El coeficiente de película.**

      $$
      \text{Nu} = 0{,}023\cdot 5.704^{0{,}8}\cdot 0{,}91^{0{,}3} = 22{,}61
      \qquad
      h_{int} = \frac{22{,}61\cdot 0{,}663}{0{,}5} = 29{,}98\ \frac{\text{W}}{\text{m}^{2}\text{K}}
      $$

      **Lo que hay que llevarse.** Treinta W/(m²·K) para agua es un valor
      pobrísimo: en el ejercicio 9.2 de la colección, con agua a 1,5 m/s en un
      tubo de 5 cm, salían 5.733. La diferencia son casi doscientas veces, y
      toda viene de la velocidad: aquí el agua va a menos de dos milímetros
      por segundo porque el tubo es enorme para el caudal que lleva. Un buen
      recordatorio de que $h$ no es una propiedad del fluido, sino de lo que
      el fluido está haciendo.

  - id: ejter-la-pared-por-dos-caminos-y-el-numero-que-sobraba
    titulo: La pared por dos caminos, y el dato que parecía sobrar
    fuente: >-
      Ejercicio 3 de la convocatoria ordinaria de enero de 2024-2025 ·
      Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen exige resolver los dos primeros apartados **de las dos maneras**,
      y publica su resolución oficial manuscrita; los cinco valores están
      rehechos y contrastados contra ella.
    nivel: examen
    enunciado: |
      Una pared de conductividad térmica $12\ \text{W/(m·K)}$, altura
      $1{,}5\ \text{m}$ y espesor $30\ \text{cm}$ está en contacto con aire
      exterior **en reposo** a $5\ \text{°C}$. La superficie interior de la
      pared se encuentra a $22\ \text{°C}$ y las pérdidas de calor a través de
      la pared son de $80\ \text{W/m}^{2}$.

      a) La temperatura superficial exterior de la pared.

      b) El coeficiente de convección entre la pared y el aire exterior.

      c) El número de Nusselt en la capa límite térmica exterior.

      **Atención**: los apartados a) y b) deben resolverse de ambas maneras,
      tanto analíticamente como empleando la analogía eléctrica.

      **Nota**: para los parámetros adimensionales de la convección debe
      utilizarse como temperatura característica la media entre la de la
      superficie y la del fluido.

      Dato: conductividad del aire a la temperatura característica,
      $k_f = 0{,}02458\ \text{W/(m·K)}$.
    pide: La temperatura exterior, el coeficiente de convección y el Nusselt.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado dice que el aire exterior está **en reposo**. ¿Qué
          decide eso?
        opciones:
          - texto: >-
              Que la convección exterior es natural, no forzada, y con ella la
              correlación y la longitud característica que hay que usar
            correcta: true
            mensaje: |
              Exacto. Y en convección natural sobre una placa plana vertical la
              longitud característica es **la altura**, que es de donde sale
              el 1,5 m del enunciado: el dato que parecía no hacer falta en
              ningún sitio.
          - texto: >-
              Que no hay convección: sin movimiento del aire, el calor solo
              sale por conducción
            mensaje: |
              El aire se mueve solo, empujado por su propia diferencia de
              densidades al calentarse junto a la pared. Eso es precisamente
              la convección natural, y es la que gobierna la cara exterior de
              cualquier fachada.
          - texto: >-
              Que el coeficiente de convección es el del aire quieto, un valor
              tabulado
            mensaje: |
              No hay un valor tabulado universal: $h$ depende de la geometría,
              del salto de temperatura y de las propiedades del aire. Aquí, de
              hecho, sale del balance —80 W/m² entre 15 grados— y no de
              ninguna tabla.

      - tipo: calcular
        titulo: La temperatura de la cara exterior
        pregunta: |
          ¿A qué temperatura está la superficie exterior de la pared?
        respuesta:
          tipo: magnitud
          valor: '20 C'
          tolerancia: 0.005
          formato: una temperatura, con su unidad
        distractores:
          - valor: '2 C'
            mensaje: |
              Ese es el **salto** que produce la pared,
              $\dot q\,L/k = 2$ grados, no la temperatura de la cara. Hay que
              restárselo a los 22 de la cara interior.
          - valor: '-178 C'
            mensaje: |
              Has metido el espesor en centímetros: $80\cdot 30/12 = 200$
              grados de caída, en una pared de treinta centímetros. El
              resultado debería haberte parado antes de escribirlo. La
              conductividad va en W/(m·K), así que el espesor va en metros.
        pista: |
          Por la analogía, $\dot q = (\theta_1-\theta_2)/(L/k)$, con
          $L/k = 0{,}3/12$.
        desarrollo: |
          **Por la analogía eléctrica**, la resistencia de conducción por
          unidad de área es $L/k = 0{,}3/12 = 0{,}025$:

          $$
          80 = \frac{22 - \theta_2}{0{,}025}
          \;\Longrightarrow\;
          \theta_2 = 20\ \text{°C}
          $$

          **Y analíticamente**, integrando la ecuación de la conducción en
          régimen permanente, sin generación y con $k$ constante:

          $$
          \frac{d^{2}\theta}{dx^{2}} = 0
          \;\Longrightarrow\;
          \theta(x) = C_1x + C_2
          $$

          La condición de contorno **de primera especie** —temperatura
          impuesta— da $C_2 = 22$; la **de segunda especie** —flujo impuesto—
          da $C_1$ por la ley de Fourier, $80 = -12\,C_1$, es decir
          $C_1 = -6{,}67$. Y entonces

          $$
          \theta(0{,}3) = -6{,}67\cdot 0{,}3 + 22 = 20\ \text{°C}
          $$

          Los dos caminos dan lo mismo porque son el mismo: la analogía es esa
          integración ya hecha.

      - tipo: calcular
        titulo: El coeficiente de convección
        pregunta: |
          ¿Cuánto vale el coeficiente de película entre la pared y el aire?
        respuesta:
          tipo: magnitud
          valor: '5.33 W/m2 K'
          tolerancia: 0.02
          formato: un coeficiente de película, con su unidad
        distractores:
          - valor: '4.71 W/m2 K'
            mensaje: |
              Has usado el salto entre la cara **interior** y el aire, 22
              menos 5. La resistencia de convección va solo de la superficie
              exterior al aire: sus dos extremos son 20 y 5.
          - valor: '0.1875 W/m2 K'
            mensaje: |
              Eso es la **resistencia** de convección por unidad de área,
              $1/h$, en m²·K/W. El coeficiente es su inversa, y la unidad lo
              delata.
        pista: |
          Ley de enfriamiento de Newton: $\dot q = h\,(\theta_2 - \theta_f)$,
          con la misma densidad de flujo de 80 W/m².
        desarrollo: |
          En régimen permanente el mismo calor que atraviesa la pared por
          conducción sale al aire por convección — es la **condición de
          contorno de tercera especie**:

          $$
          h = \frac{\dot q}{\theta_2 - \theta_f} = \frac{80}{20 - 5}
          = 5{,}33\ \frac{\text{W}}{\text{m}^{2}\text{K}}
          $$

          Por analogía sale igual, resolviendo el circuito entero de una vez:

          $$
          80 = \frac{22-5}{\dfrac{0{,}3}{12} + \dfrac{1}{h}}
          \;\Longrightarrow\;
          h = 5{,}33
          $$

          Y fíjate en el reparto: la conducción aporta 0,025 de resistencia y
          la convección 0,1875, siete veces y media más. Treinta centímetros
          de pared pesan menos que la película de aire quieto que tiene
          pegada.

      - tipo: calcular
        titulo: El número de Nusselt
        pregunta: |
          ¿Cuál es el número de Nusselt en la capa límite exterior?
        respuesta:
          tipo: numero
          valor: '325.5'
          tolerancia: 0.01
          formato: un número, sin unidades
        distractores:
          - valor: '65.1'
            mensaje: |
              Has usado el **espesor** de la pared, 0,3 m, como longitud
              característica. En convección natural sobre una placa vertical
              la longitud característica es la **altura**: por eso el enunciado
              da los 1,5 m, que no hacen falta para ninguna otra cosa.
          - valor: '0.0031'
            mensaje: |
              Has invertido la fracción. El Nusselt compara la convección con
              la conducción en la capa límite, así que el coeficiente de
              película va arriba: $\text{Nu} = h\,\Pi/k_f$.
        pista: |
          $\text{Nu} = h\,\Pi/k_f$, con $\Pi$ la altura de la pared.
        desarrollo: |
          La temperatura característica, como dice el enunciado, es la media
          entre superficie y fluido:

          $$
          \theta_{cc} = \frac{5+20}{2} = 12{,}5\ \text{°C}
          $$

          y a ella se lee la conductividad del aire. Con la altura como
          longitud característica:

          $$
          \text{Nu} = \frac{h\,\Pi}{k_f} = \frac{5{,}33\cdot 1{,}5}{0{,}02458}
          = 325{,}5
          $$

      - tipo: justificar
        pregunta: Ordena por qué el enunciado da la altura. Una pieza es falsa.
        piezas:
          - texto: >-
              La altura no aparece en la conducción: la resistencia de una
              pared plana es $L/k$ con $L$ el espesor, y el área se cancela al
              trabajar por metro cuadrado.
          - texto: >-
              Tampoco en el coeficiente de convección, que sale de dividir la
              densidad de flujo entre el salto de temperatura.
          - texto: >-
              Aparece solo en el Nusselt, porque en convección natural sobre
              una placa vertical la longitud característica es la altura.
          - texto: >-
              Y si la pared fuese el doble de alta, el coeficiente de
              convección sería el doble.
            trampa: true
            mensaje: |
              El coeficiente no cambiaría: sale de 80 W/m² entre 15 grados, y
              ninguno de los dos depende de la altura. Lo que se duplicaría es
              el **Nusselt**, que es un número adimensional y lleva la altura
              dentro. Confundir «h depende de la geometría» con «h se calcula
              con la geometría» es el paso en falso: aquí $h$ se ha medido, no
              se ha correlacionado.
    resolucion: |
      **a) La cara exterior, a 20 °C.** Por la analogía, con
      $L/k = 0{,}025$:

      $$
      80 = \frac{22-\theta_2}{0{,}025} \;\Longrightarrow\; \theta_2 = 20\ \text{°C}
      $$

      Y analíticamente, integrando $d^{2}\theta/dx^{2} = 0$ con la condición
      de primera especie —$\theta(0) = 22$— y la de segunda —$\dot q = -k\,C_1$,
      de donde $C_1 = -6{,}67$—, sale $\theta(0{,}3) = 20$. Los dos caminos
      coinciden porque la analogía **es** esa integración ya hecha.

      **b) El coeficiente, 5,33 W/(m²·K).** Condición de tercera especie: el
      calor que sale por conducción entra al aire por convección.

      $$
      h = \frac{80}{20-5} = 5{,}33\ \frac{\text{W}}{\text{m}^{2}\text{K}}
      $$

      **c) El Nusselt, 325,5.** Convección natural en placa vertical: la
      longitud característica es la altura y la temperatura característica, la
      media entre superficie y fluido.

      $$
      \text{Nu} = \frac{5{,}33\cdot 1{,}5}{0{,}02458} = 325{,}5
      $$

      **Lo que hay que llevarse.** Este ejercicio enseña dos cosas que no se
      ven en el resultado. La primera es que la analogía eléctrica y la
      integración son lo mismo, y por eso el examen las pide las dos: para que
      no uses la analogía como una receta. La segunda es que un dato del
      enunciado que no encaja en ninguna cuenta —los 1,5 m de altura— casi
      siempre está señalando qué correlación toca; aquí, que la convección es
      natural y sobre una placa vertical.
