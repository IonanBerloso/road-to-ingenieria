ejercicios:
  - id: ejter-por-que-la-radiacion-va-a-la-cuarta
    titulo: Por qué la radiación va a la cuarta
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería, sobre la ley de
      Stefan-Boltzmann del Tema 10 de la asignatura. No es de examen ni de la
      colección.
    nivel: ejemplo
    enunciado: |
      Una superficie negra a $327\ \text{°C}$ está dentro de una sala muy
      grande cuyas paredes están a $27\ \text{°C}$.

      a) ¿Cuánto calor neto emite por radiación, por metro cuadrado?

      b) ¿Qué fracción de lo que emite acaba siendo calor neto?

      Datos: $\sigma = 5{,}67\cdot 10^{-8}\ \text{W/(m}^{2}\text{·K}^{4})$, y
      $T = \theta + 273$.
    pide: El calor neto por radiación y qué fracción es de lo emitido.
    pasos:
      - tipo: reconocer
        pregunta: |
          La superficie emite $\sigma T^{4}$. ¿Por qué eso no es todavía el
          calor que pierde?
        opciones:
          - texto: >-
              Porque las paredes de la sala también emiten, y parte de esa
              radiación vuelve a la superficie
            correcta: true
            mensaje: |
              Eso es. La radiación va en los dos sentidos siempre: lo que se
              mide como pérdida es la **diferencia**, y por eso la fórmula
              lleva dos temperaturas y no una.
          - texto: >-
              Porque hay que descontar lo que se pierde por convección
            mensaje: |
              La convección es otro mecanismo y se suma aparte; no descuenta
              nada de la radiación. Aquí el problema está dentro de la propia
              radiación: la sala devuelve parte.
          - texto: >-
              Porque parte de la radiación se refleja en la propia superficie
            mensaje: |
              La superficie es negra, así que no refleja nada: absorbe todo lo
              que le llega. Y aun así el calor neto no es $\sigma T^{4}$,
              porque lo que le llega no es cero.

      - tipo: calcular
        titulo: El calor neto
        pregunta: |
          ¿Cuánto calor neto emite por metro cuadrado?
        respuesta:
          tipo: magnitud
          valor: '6889 W/m2'
          tolerancia: 0.02
          formato: una potencia por unidad de área, con su unidad
        distractores:
          - valor: '7348 W/m2'
            mensaje: |
              Eso es lo que la superficie **emite**, sin descontar lo que le
              llega de la sala. Falta restar $\sigma T_{\text{alr}}^{4}$.
          - valor: '648 W/m2'
            mensaje: |
              Has metido los grados Celsius en la fórmula. La ley de
              Stefan-Boltzmann solo funciona en kelvin, y aquí el error no es
              del 10 % ni del 50 %: es de un factor **once**.
        pista: |
          $\sigma\left(T^{4} - T_{\text{alr}}^{4}\right)$, con las dos
          temperaturas en kelvin.
        desarrollo: |
          $$
          T = 327 + 273 = 600\ \text{K}, \qquad
          T_{\text{alr}} = 27 + 273 = 300\ \text{K}
          $$
          $$
          \dot{q} = \sigma\left(T^{4} - T_{\text{alr}}^{4}\right)
          = 5{,}67\cdot 10^{-8}\left(600^{4} - 300^{4}\right)
          $$
          $$
          = 5{,}67\cdot 10^{-8}\cdot 1{,}215\cdot 10^{11}
          = 6889\ \frac{\text{W}}{\text{m}^{2}}
          $$

      - tipo: calcular
        titulo: Qué fracción es
        pregunta: |
          La superficie emite $7348\ \text{W/m}^{2}$ y el neto son
          $6889$. ¿Qué fracción del total es el neto?
        respuesta:
          tipo: numero
          valor: '0.9375'
          tolerancia: 0.002
          formato: una fracción entre 0 y 1
        distractores:
          - valor: '0.5'
            mensaje: |
              Ese es el cociente de las temperaturas: la sala está justo a la
              mitad de kelvin que la superficie. Pero la ley no va con la
              temperatura, va con su cuarta potencia.
          - valor: '0.75'
            mensaje: |
              Has elevado al cuadrado: $1 - (1/2)^{2}$. La ley de
              Stefan-Boltzmann es de cuarto grado, no de segundo.
        pista: |
          Divide, o mejor: fíjate en que $T_{\text{alr}}/T = 1/2$ exactamente.
        desarrollo: |
          $$
          \frac{\dot{q}}{\sigma T^{4}}
          = 1 - \left(\frac{T_{\text{alr}}}{T}\right)^{4}
          = 1 - \left(\frac{1}{2}\right)^{4}
          = 1 - \frac{1}{16} = 0{,}9375
          $$

          La sala está a la mitad de temperatura absoluta y aporta **un
          dieciseisavo**. Ese es el sentido práctico de la cuarta potencia:
          en cuanto hay un salto de temperatura apreciable, el cuerpo frío
          casi deja de contar.

      - tipo: justificar
        pregunta: Ordena la lectura del resultado. Una pieza es falsa.
        piezas:
          - texto: >-
              El calor neto es la diferencia de las dos emisiones, porque la
              radiación viaja en los dos sentidos.
          - texto: >-
              Con la sala a la mitad de kelvin, su aportación es
              $(1/2)^{4}$, o sea un dieciseisavo.
          - texto: >-
              Por eso el neto, 6889, es ya el 93,75 % de lo que la superficie
              emite ella sola.
          - texto: >-
              Y por eso, cuando el salto es grande, la temperatura del entorno
              puede ignorarse sin cometer error apreciable.
            trampa: true
            mensaje: |
              «Sin error apreciable» es mucho decir con un 6,25 %: en un
              examen esa diferencia cambia la tercera cifra de todos los
              resultados posteriores. Lo que la cuarta potencia justifica es
              que el entorno **pese poco**, no que se pueda borrar de la
              fórmula. Y en los casos habituales del tema —una pared a 40 °C
              en una sala a 20— la diferencia de kelvin es pequeña y el
              entorno pesa casi tanto como el cuerpo.
    resolucion: |
      **a) El calor neto.** Primero a kelvin, que en esta ley no es opcional:
      600 y 300 K.

      $$
      \dot{q} = \sigma\left(T^{4} - T_{\text{alr}}^{4}\right)
      = 5{,}67\cdot 10^{-8}\left(600^{4} - 300^{4}\right)
      = 6889\ \frac{\text{W}}{\text{m}^{2}}
      $$

      **b) La fracción.** La superficie sola emite
      $\sigma\cdot 600^{4} = 7348\ \text{W/m}^{2}$, así que el neto es el
      **93,75 %**. Y ese número no hay que dividirlo para obtenerlo:

      $$
      1 - \left(\frac{300}{600}\right)^{4} = 1 - \frac{1}{16} = 0{,}9375
      $$

      **Lo que hay que llevarse.** Dos cosas, y la segunda se olvida más.

      La primera es que en radiación **no hay grados Celsius**. Meterlos aquí
      no produce un error del 10 %: produce 648 donde había 6889.

      La segunda es cuánto amplifica la cuarta potencia. Subir la superficie
      de 327 a 427 °C —cien grados, que sobre 600 K son solo un 17 % más—
      lleva la emisión de 7348 a $13\,614\ \text{W/m}^{2}$: un 85 % más, casi
      el doble. Elevar a la cuarta convierte un 17 % en un 85 %. Por eso la radiación no
      se puede despreciar en un horno aunque sea despreciable en un radiador
      de calefacción, y por eso es el único de los tres mecanismos que no es
      lineal con la temperatura.
  - id: ejter-col101-la-carretera-al-sol
    titulo: La carretera al sol, y la ecuación de cuarto grado que se resuelve tanteando
    fuente: >-
      Ejercicio 10.1 de las diapositivas del Tema 10, «Transmisión de calor
      por radiación térmica» · Ingeniería Térmica, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Las diapositivas traen su resolución, y el
      desarrollo está contrastado contra ella. La lámina 29 acaba en 331,5 K,
      58,5 °C, pero la raíz de su propia ecuación es 331,3 K, 58,3 °C: sus
      iteraciones segunda y tercera se desvían unas décimas. Aquí se publica
      la raíz, y las dos caben en la tolerancia.
    nivel: practica
    enunciado: |
      Una carretera de asfalto negro absorbe $1.103{,}75\ \text{W/m}^{2}$ de
      energía por radiación térmica en verano. La temperatura del aire es de
      $32\ \text{°C}$. El coef. de convección entre el aire y la carretera es
      de $16\ \text{W/m}^{2}\text{·°C}$. Calcúlese la temperatura de la
      carretera.

      *La resolución de las diapositivas trata el asfalto como cuerpo negro
      —absorbe todo lo que le llega y emite $\sigma T^{4}$—, con
      $\sigma = 5{,}67\cdot 10^{-8}\ \text{W/(m}^{2}\text{·K}^{4})$ y
      $T = \theta + 273$.*
    pide: La temperatura a la que se estabiliza la carretera.
    pasos:
      - tipo: reconocer
        pregunta: |
          La carretera ni se calienta ni se enfría: está en régimen
          estacionario. ¿Qué balance fija su temperatura?
        opciones:
          - texto: >-
              Lo que absorbe se va por dos caminos: por convección al aire y
              por radiación, $\sigma T^{4}$, por ser negra
            correcta: true
            mensaje: |
              Eso es: $G = h\,(T - T_{aire}) + \sigma T^{4}$. Y como un
              término es lineal en $T$ y el otro de cuarto grado, la ecuación
              no se despeja a mano: se busca su raíz.
          - texto: >-
              Lo que absorbe se lo lleva todo el aire, por convección
            mensaje: |
              Eso olvida que la carretera, caliente, también radia. Es la
              primera aproximación de la resolución y sirve solo para
              arrancar: da 101 °C, y a esa temperatura la carretera emitiría
              más de lo que absorbe.
          - texto: >-
              Que se pone a la temperatura del aire, 32 °C, porque está en
              equilibrio con él
            mensaje: |
              Estacionario no es equilibrio con el aire: la carretera recibe
              1.103,75 W por metro cuadrado, y para deshacerse de ellos tiene
              que estar más caliente que lo que la rodea.

      - tipo: calcular
        titulo: La primera aproximación, sin la emisión
        pregunta: |
          Para arrancar, la resolución desprecia la emisión:
          $G = h\,(T_0 - T_{aire})$. ¿Cuánto vale $T_0$?
        respuesta:
          tipo: magnitud
          valor: '101 °C'
          tolerancia: 0.005
          formato: una temperatura, con su unidad
        distractores:
          - valor: '69 °C'
            mensaje: |
              Eso es el **salto**, $G/h = 69$ °C. La temperatura de la
              carretera es la del aire más ese salto: 32 + 69.
          - valor: '374 °C'
            mensaje: |
              Ese número es la temperatura en **kelvin**: 374 K son 101 °C. Se
              puede contestar en cualquiera de las dos escalas, pero el número
              tiene que ir con la suya.
        pista: |
          $T_0 = T_{aire} + G/h$.
        desarrollo: |
          $$
          T_0 = (32+273) + \frac{1.103{,}75}{16} = 374\ \text{K}
          $$

          Es decir, 101 °C. Demasiado, y se ve sin seguir: a 374 K la
          carretera emitiría $\sigma T_0^{4} = 1.109\ \text{W/m}^{2}$, más de
          lo que absorbe.

      - tipo: calcular
        titulo: La temperatura de la carretera
        pregunta: |
          Con Newton-Raphson sobre
          $f(T) = \sigma T^{4} + h\,T - (G + h\,T_{aire})$, partiendo de
          374 K, ¿a qué temperatura se estabiliza la carretera?
        respuesta:
          tipo: magnitud
          valor: '58.3 °C'
          # Relativa sobre kelvin (§17): 0,005 son 1,7 K. Acepta el 58,5 °C de
          # la lámina 29 y el 58,2 de quien use 273,15.
          tolerancia: 0.005
          formato: una temperatura, con su unidad
        distractores:
          - valor: '101 °C'
            mensaje: |
              Esa es la primera aproximación, sin la emisión: el punto de
              partida de Newton-Raphson, no el resultado. A esa temperatura la
              carretera emitiría más de lo que absorbe.
          - valor: '77.9 °C'
            mensaje: |
              Has puesto la radiación como intercambio con un entorno a 32 °C,
              $\sigma\,(T^{4} - T_{aire}^{4})$. El enunciado ya da lo que la
              carretera **absorbe**, 1.103,75 W/m²: lo que le llega de fuera
              está dentro de ese número, y lo que sale es su emisión entera,
              $\sigma T^{4}$.
          - valor: '331.3 °C'
            mensaje: |
              Ese número es la temperatura en kelvin: 331,3 K son 58,3 °C.
        pista: |
          $T_{n+1} = T_n - f(T_n)/f'(T_n)$, con $f'(T) = 4\sigma T^{3} + h$. En
          tres vueltas ya no cambia la décima.
        desarrollo: |
          $$
          f(T) = 5{,}67\cdot 10^{-8}\,T^{4} + 16\,T - 5.983{,}75
          \qquad
          f'(T) = 4\cdot 5{,}67\cdot 10^{-8}\,T^{3} + 16
          $$

          $$
          T_1 = 374 - \frac{1.109{,}6}{27{,}86} = 334{,}2\ \text{K}
          \qquad
          T_2 = 334{,}2 - \frac{70{,}76}{24{,}47} = 331{,}3\ \text{K}
          $$

          La tercera vuelta ya no mueve la décima: 331,3 K, que son
          **58,3 °C**. La lámina 29 acaba en 331,5 K por dos deslices de unas
          décimas: su segunda vuelta escribe 331,2 donde sale 331,3, y la
          tercera, 331,5 donde desde 331,2 saldría otra vez 331,3. La
          diferencia cabe en la tolerancia.

      - tipo: calcular
        titulo: Por dónde se va lo que absorbe
        pregunta: |
          A esa temperatura, ¿qué fracción de los 1.103,75 W/m² que absorbe la
          carretera vuelve a salir por radiación?
        respuesta:
          tipo: numero
          valor: '0.619'
          tolerancia: 0.01
          formato: una fracción entre 0 y 1
        distractores:
          - valor: '0.381'
            mensaje: |
              Esa es la parte que se lleva el **aire**, $h\,(T - T_{aire})/G$.
              La pregunta es la otra: la que sale radiada.
          - valor: '1.005'
            mensaje: |
              Has usado la primera aproximación, 374 K: con ella la carretera
              emitiría el 100,5 % de lo que absorbe, y encima tendría que ceder
              calor al aire. Imposible, y por eso esa temperatura hay que
              corregirla.
        pista: |
          $\sigma T^{4}/G$, con $T = 331{,}3\ \text{K}$.
        desarrollo: |
          $$
          \sigma T^{4} = 5{,}67\cdot 10^{-8}\cdot 331{,}3^{4} = 683{,}1\ \frac{\text{W}}{\text{m}^{2}}
          \qquad
          h\,(T-T_{aire}) = 16\cdot(331{,}3-305) = 420{,}8\ \frac{\text{W}}{\text{m}^{2}}
          $$

          $$
          \frac{683{,}1}{1.103{,}75} = 0{,}619
          $$

          Seis de cada diez vatios salen radiados, y cuatro se los lleva el
          aire. Los dos juntos suman lo que entra, que es la comprobación.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              En régimen estacionario, lo que absorbe la carretera sale por
              convección y por radiación: $G = h\,(T-T_{aire}) + \sigma T^{4}$.
          - texto: >-
              La ecuación es de cuarto grado y no se despeja a mano: se arranca
              sin la emisión, 374 K, y Newton-Raphson la baja a 331,3 K.
          - texto: >-
              A 58,3 °C, el 62 % de lo absorbido se va por radiación y el 38 %
              por convección.
          - texto: >-
              Como la carretera está solo 26 °C por encima del aire, la
              radiación es despreciable frente a la convección.
            trampa: true
            mensaje: |
              Es al revés: la radiación se lleva 683 W/m² y la convección, 421.
              La radiación no va con el salto sino con la cuarta potencia de la
              temperatura **absoluta** de la carretera, y 331 K a la cuarta es
              mucho aunque el salto con el aire sea pequeño. Despreciarla daría
              101 °C.
    resolucion: |
      **El balance.** La carretera está en régimen estacionario: lo que
      absorbe del sol, $G$, sale por convección al aire y por radiación. Como
      es negra, emite $\sigma T^{4}$:

      $$
      G = h\,(T - T_{aire}) + \sigma T^{4}
      \;\Longrightarrow\;
      5{,}67\cdot 10^{-8}\,T^{4} + 16\,T - 5.983{,}75 = 0
      $$

      con $T_{aire} = 305\ \text{K}$ y $5.983{,}75 = 1.103{,}75 + 16\cdot 305$.

      **La raíz, por Newton-Raphson.** Se arranca sin la emisión:

      $$
      T_0 = 305 + \frac{1.103{,}75}{16} = 374\ \text{K}
      $$

      y se itera con $T_{n+1} = T_n - f(T_n)/f'(T_n)$,
      $f'(T) = 4\sigma T^{3} + 16$:

      $$
      T_1 = 374 - \frac{1.109{,}6}{27{,}86} = 334{,}2
      \qquad
      T_2 = 334{,}2 - \frac{70{,}76}{24{,}47} = 331{,}3
      $$

      La tercera ya no cambia la décima. La carretera se estabiliza a
      331,3 K, **58,3 °C**. Las diapositivas llegan a 331,5 K, 58,5 °C, por
      dos deslices de unas décimas: su segunda vuelta escribe 331,2 donde la
      cuenta da 331,3, y la tercera, 331,5 donde desde 331,2 saldría otra vez
      331,3.

      **La comprobación.** A 331,3 K la carretera emite
      $\sigma T^{4} = 683{,}1\ \text{W/m}^{2}$ y cede al aire
      $16\cdot 26{,}3 = 420{,}8\ \text{W/m}^{2}$. Suman los 1.103,75 que
      absorbe, y el 62 % sale radiado.

      **Lo que hay que llevarse.** Es el caso del último párrafo del tema:
      convección y radiación sobre la misma superficie. La convección es
      lineal en la temperatura y la radiación va a la cuarta, así que la
      ecuación **no se despeja a mano**. Se arranca de una aproximación con
      sentido —aquí, sin la emisión— y se corrige; y ese arranque ya avisa de
      que despreciar la radiación no vale: daría 101 °C donde son 58.

  - id: ejter-dos-placas-y-una-pantalla
    titulo: Dos placas, y qué cambia poner una pantalla
    fuente: >-
      Ejercicio 10.2 de la colección de problemas del Tema 10 · Ingeniería
      Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). Las diapositivas
      del tema lo resuelven en las láminas 30 a 33, con 273 en vez de 273,15,
      y el desarrollo está contrastado contra ellas: sus 128,66 y
      64,33 kW/m² coinciden con los de aquí dentro de la tolerancia. En b)
      la lámina 32 escribe 55,944 kW/m², y su propia fórmula da 55,14: es una
      errata.
    nivel: practica
    enunciado: |
      Dos placas paralelas se encuentran muy próximas entre sí. Una está a
      $1.000\ \text{°C}$ y la otra a $500\ \text{°C}$. Calcúlese el
      intercambio neto de calor por radiación entre ambas, por unidad de
      superficie, en tres casos:

      a) Ambas placas son negras.

      b) Ambas son grises, con emisividad $0{,}6$.

      c) Ambas son negras y entre ellas se interpone una tercera placa negra.

      Dato: $\sigma = 5{,}67\cdot 10^{-8}\ \text{W/(m}^{2}\text{K}^{4})$.
    pide: Los tres intercambios netos por unidad de superficie.
    pasos:
      - tipo: reconocer
        pregunta: |
          Las placas están «muy próximas entre sí». ¿Qué simplifica eso?
        opciones:
          - texto: >-
              Que cada una ve solo a la otra: el factor de visión vale 1 y no
              hay que buscarlo en ninguna gráfica
            correcta: true
            mensaje: |
              Exacto. Toda la radiación que sale de una llega a la otra, así
              que $F_{12} = 1$ y la resistencia geométrica se reduce a
              $1/A$. Es la razón de que el enunciado insista en lo de
              «próximas».
          - texto: >-
              Que la conducción entre ellas es despreciable
            mensaje: |
              Al revés: si estuvieran muy próximas y hubiera aire en medio, la
              conducción sería **más** importante, no menos. Lo que la
              proximidad simplifica es la geometría de la radiación, no la
              existencia de otros mecanismos —que el enunciado sencillamente
              no considera—.
          - texto: >-
              Que las dos están a la misma temperatura
            mensaje: |
              El enunciado dice que están a 1.000 y a 500 °C. Si estuvieran a
              la misma temperatura no habría intercambio neto ninguno, que es
              justamente lo que la fórmula devuelve cuando
              $T_1^{4} = T_2^{4}$.

      - tipo: calcular
        titulo: Con las dos placas negras
        pregunta: |
          ¿Cuánto vale el intercambio neto por metro cuadrado si las dos son
          negras?
        respuesta:
          tipo: magnitud
          valor: '128711 W/m2'
          tolerancia: 0.02
          formato: una densidad de flujo de calor, con su unidad
        distractores:
          - valor: '53156 W/m2'
            mensaje: |
              Has puesto las temperaturas en grados Celsius. La ley de
              Stefan-Boltzmann va con la temperatura **absoluta** elevada a la
              cuarta, así que 1.000 °C son 1.273,15 K. Fíjate en el tamaño del
              error: menos de la mitad del valor correcto, y sin ningún aviso.
          - valor: '148971 W/m2'
            mensaje: |
              Has calculado solo lo que emite la placa caliente,
              $\sigma T_1^{4}$, sin restar lo que le devuelve la fría. El
              intercambio **neto** es la diferencia de las dos cuartas
              potencias.
        pista: |
          Con las dos negras no hay resistencias superficiales, y con
          $F_{12}=1$ queda $\dot q = \sigma\,(T_1^{4}-T_2^{4})$, en kelvin.
        desarrollo: |
          $$
          T_1 = 1.273{,}15\ \text{K}
          \qquad
          T_2 = 773{,}15\ \text{K}
          $$

          $$
          \dot q = \sigma\left(T_1^{4}-T_2^{4}\right)
          = 5{,}67\cdot 10^{-8}\left(2{,}627\cdot 10^{12} - 3{,}573\cdot 10^{11}\right)
          $$
          $$
          = 128.711\ \frac{\text{W}}{\text{m}^{2}}
          $$

          Casi 129 kW por metro cuadrado. Ese es el orden de magnitud de la
          radiación en un horno, y por eso a estas temperaturas los otros dos
          mecanismos casi no cuentan.

      - tipo: calcular
        titulo: Con las dos placas grises
        pregunta: |
          Con emisividad 0,6 en las dos, ¿cuánto vale ahora?
        respuesta:
          tipo: magnitud
          valor: '55162 W/m2'
          tolerancia: 0.02
          formato: una densidad de flujo de calor, con su unidad
        distractores:
          - valor: '77227 W/m2'
            mensaje: |
              Has multiplicado por 0,6 el resultado de las placas negras. No
              es proporcional: las dos superficies reflejan, y esa radiación
              rebota entre ellas. El denominador correcto es
              $1/\varepsilon_1 + 1/\varepsilon_2 - 1$, que aquí vale 2,33, no
              1,67.
          - valor: '38613 W/m2'
            mensaje: |
              Has usado $1/\varepsilon_1 + 1/\varepsilon_2$ sin restar el uno.
              Ese $-1$ no es cosmético: sale de que las dos resistencias
              superficiales y la geométrica comparten los mismos nodos, y sin
              él el intercambio saldría siempre menor de lo que es.
        pista: |
          $\dot q = \dfrac{\sigma(T_1^{4}-T_2^{4})}
          {1/\varepsilon_1 + 1/\varepsilon_2 - 1}$.
        desarrollo: |
          $$
          \frac{1}{0{,}6}+\frac{1}{0{,}6}-1 = 2{,}333
          $$

          $$
          \dot q = \frac{128.711}{2{,}333} = 55.162\ \frac{\text{W}}{\text{m}^{2}}
          $$

          Un 43 % de lo que intercambiarían siendo negras. Con emisividad 0,6
          cada una, el conjunto se comporta como si tuviera una emisividad
          efectiva de 0,43.

      - tipo: calcular
        titulo: Con una pantalla negra en medio
        pregunta: |
          Volviendo a las dos placas negras, ¿cuánto intercambian si se
          interpone una tercera placa negra?
        respuesta:
          tipo: magnitud
          valor: '64355 W/m2'
          tolerancia: 0.02
          formato: una densidad de flujo de calor, con su unidad
        distractores:
          - valor: '128711 W/m2'
            mensaje: |
              Ese es el valor sin pantalla. Una pantalla negra intercalada
              **duplica** la resistencia del circuito: ahora hay dos saltos en
              serie, del 1 al 3 y del 3 al 2, en vez de uno.
          - valor: '42904 W/m2'
            mensaje: |
              Has dividido por tres. Con **una** pantalla el circuito tiene dos
              resistencias en serie, así que el intercambio se divide por dos;
              por tres se dividiría con dos pantallas.
        pista: |
          Con todas negras, la pantalla añade una resistencia igual a la que
          ya había: el circuito pasa de una a dos en serie.
        desarrollo: |
          Con las tres superficies negras y $F = 1$ en los dos huecos, el
          circuito tiene dos resistencias iguales en serie:

          $$
          \dot q = \frac{\sigma\left(T_1^{4}-T_2^{4}\right)}{2}
          = \frac{128.711}{2} = 64.355\ \frac{\text{W}}{\text{m}^{2}}
          $$

          La regla general, con $n$ pantallas negras, es dividir por $n+1$. Y
          la pantalla se pone a la temperatura que haga cuadrar el balance:
          aquí, la que da el mismo flujo en los dos tramos.

      - tipo: justificar
        pregunta: Ordena la comparación de los tres casos. Una pieza es falsa.
        piezas:
          - texto: >-
              Con las dos placas negras el intercambio es máximo, 128,7 kW/m²:
              nada se refleja y nada estorba.
          - texto: >-
              Bajar la emisividad a 0,6 lo reduce a 55,2 kW/m², porque parte
              de la radiación rebota en vez de absorberse.
          - texto: >-
              Y una pantalla negra intercalada lo reduce a la mitad, 64,4
              kW/m², sin cambiar ninguna emisividad.
          - texto: >-
              Luego una pantalla negra es más eficaz que bajar la emisividad
              de las dos placas a 0,6.
            trampa: true
            mensaje: |
              Los números dicen lo contrario: la pantalla deja 64,4 kW/m² y
              las placas grises, 55,2. Bajar la emisividad ha sido más eficaz
              **en este caso**. Y es coherente con la práctica: las pantallas
              de radiación que se usan de verdad no son negras, son de baja
              emisividad, y entonces sí ganan por goleada —es lo que hace un
              termo—.
    resolucion: |
      **La geometría, primero.** Las placas están muy próximas, así que cada
      una ve solo a la otra: $F_{12} = 1$ y la resistencia geométrica es
      $1/A$.

      **a) Ambas negras.** Sin resistencias superficiales:

      $$
      \dot q = \sigma\left(1.273{,}15^{4} - 773{,}15^{4}\right)
      = 128.711\ \frac{\text{W}}{\text{m}^{2}}
      $$

      **b) Ambas grises, $\varepsilon = 0{,}6$.**

      $$
      \dot q = \frac{128.711}{\frac{1}{0{,}6}+\frac{1}{0{,}6}-1}
      = \frac{128.711}{2{,}333} = 55.162\ \frac{\text{W}}{\text{m}^{2}}
      $$

      **c) Dos negras con una pantalla negra.** El circuito pasa de una
      resistencia a dos en serie:

      $$
      \dot q = \frac{128.711}{2} = 64.355\ \frac{\text{W}}{\text{m}^{2}}
      $$

      **Las comprobaciones, que aquí hacen falta.** Este ejercicio no trae
      resultados publicados, así que hay que verificarlo por otro lado, y hay
      tres maneras: el caso negro tiene que ser el **máximo** de los tres,
      porque cualquier emisividad menor que uno solo puede estorbar; el caso
      gris tiene que salir menor que el negro y mayor que cero; y la pantalla
      tiene que dar exactamente la mitad, porque duplica una resistencia que
      era única. Los tres se cumplen.

  - id: ejter-el-conducto-dentro-del-conducto
    titulo: El conducto dentro del conducto, y la fórmula corta que no vale
    fuente: >-
      Ejercicio 10.3 de la colección de problemas del Tema 10 · Ingeniería
      Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). Las diapositivas
      del tema lo resuelven en las láminas 34 a 36, con el circuito completo
      de resistencias, y el desarrollo está contrastado contra ellas: sus
      3,074 y 1,393 kW/m, y la reducción del 54,68 %, se reproducen.
    nivel: practica
    enunciado: |
      Un conducto transporta un líquido caliente. Su diámetro exterior es de
      $0{,}8\ \text{m}$ y la emisividad de su superficie exterior,
      $0{,}5$. Está embebido en otro conducto de $1\ \text{m}$ de diámetro
      interior y emisividad interior $0{,}3$. Entre ambos se ha hecho el vacío
      para reducir las pérdidas. El conducto interior está a $550\ \text{K}$ y
      el exterior a $300\ \text{K}$.

      a) Las pérdidas de calor por metro de longitud.

      b) La reducción de esas pérdidas si el conducto interior se pinta con
      una pintura de emisividad $0{,}15$.
    pide: Las pérdidas por metro y la reducción porcentual al bajar la emisividad.
    pasos:
      - tipo: reconocer
        pregunta: |
          Entre los dos conductos se ha hecho el vacío. ¿Qué implica eso para
          el cálculo?
        opciones:
          - texto: >-
              Que solo hay radiación: sin materia en medio no puede haber ni
              conducción ni convección
            correcta: true
            mensaje: |
              Exacto, y es la única razón de que el enunciado mencione el
              vacío. La radiación es el único mecanismo que no necesita medio,
              y por eso los termos y los criostatos se hacen así.
          - texto: >-
              Que la radiación también se anula, porque no hay nada que la
              transporte
            mensaje: |
              La radiación es una onda electromagnética: viaja por el vacío
              perfectamente. Si no fuera así no nos llegaría el calor del Sol,
              que atraviesa 150 millones de kilómetros de vacío.
          - texto: >-
              Que hay que usar la transmisividad del vacío en las fórmulas
            mensaje: |
              El vacío no absorbe ni refleja nada, así que no interviene con
              ninguna propiedad: sencillamente deja pasar toda la radiación.
              Lo que hace es eliminar los otros dos mecanismos.

      - tipo: calcular
        titulo: Las pérdidas por metro
        pregunta: |
          ¿Cuánto calor pierde el conducto interior por metro de longitud?
        respuesta:
          tipo: magnitud
          valor: '3074 W/m'
          tolerancia: 0.02
          formato: una potencia por unidad de longitud, con su unidad
        distractores:
          - valor: '5943 W/m'
            mensaje: |
              Has usado la fórmula corta,
              $\dot Q = A_1\varepsilon_1\sigma(T_1^{4}-T_2^{4})$, que solo vale
              cuando la superficie exterior es **mucho** mayor que la interior.
              Aquí son 0,8 y 1 m de diámetro: se parecen demasiado, y por eso
              el enunciado te da la emisividad del conducto exterior. Casi el
              doble de error.
          - valor: '11886 W/m'
            mensaje: |
              Es el intercambio que habría entre dos superficies negras. Las
              dos emisividades, 0,5 y 0,3, añaden resistencias superficiales
              que reducen el resultado a un tercio.
        pista: |
          Circuito completo: $R_1 = (1-\varepsilon_1)/(\varepsilon_1 A_1)$,
          $R_{12} = 1/(A_1 F_{12})$ con $F_{12}=1$, y
          $R_2 = (1-\varepsilon_2)/(\varepsilon_2 A_2)$. Por metro,
          $A_1 = \pi\cdot 0{,}8$ y $A_2 = \pi\cdot 1$.
        desarrollo: |
          Por metro de conducto, $A_1 = 2{,}513$ y $A_2 = 3{,}142\ \text{m}^{2}$.
          El conducto interior es convexo y está rodeado, así que $F_{12} = 1$.

          $$
          R_1 = \frac{1-0{,}5}{0{,}5\cdot 2{,}513} = 0{,}3979
          \quad
          R_{12} = \frac{1}{2{,}513} = 0{,}3979
          \quad
          R_2 = \frac{1-0{,}3}{0{,}3\cdot 3{,}142} = 0{,}7427
          $$

          $$
          \dot Q = \frac{\sigma\left(550^{4}-300^{4}\right)}{1{,}5385}
          = 3.074\ \frac{\text{W}}{\text{m}}
          $$

      - tipo: calcular
        titulo: Con la pintura de baja emisividad
        pregunta: |
          Pintando el conducto interior con $\varepsilon_1 = 0{,}15$, ¿cuánto
          pierde ahora?
        respuesta:
          tipo: magnitud
          valor: '1393 W/m'
          tolerancia: 0.02
          formato: una potencia por unidad de longitud, con su unidad
        distractores:
          - valor: '922 W/m'
            mensaje: |
              Has escalado el resultado anterior por el cociente de
              emisividades, $3.074\cdot 0{,}15/0{,}5$. No es proporcional: lo
              que cambia es **una** de las tres resistencias del circuito, y
              las otras dos siguen ahí.
          - valor: '2049 W/m'
            mensaje: |
              Comprueba la resistencia superficial nueva:
              $(1-0{,}15)/(0{,}15\cdot 2{,}513) = 2{,}255$, que es casi seis
              veces la anterior. El total pasa de 1,54 a 3,40, y el calor cae
              a menos de la mitad.
        pista: |
          Solo cambia $R_1$. Recalcúlala con la emisividad nueva y vuelve a
          sumar las tres.
        desarrollo: |
          $$
          R_1' = \frac{1-0{,}15}{0{,}15\cdot 2{,}513} = 2{,}2547
          \qquad
          \sum R = 2{,}2547 + 0{,}3979 + 0{,}7427 = 3{,}3953
          $$

          $$
          \dot Q = \frac{\sigma\left(550^{4}-300^{4}\right)}{3{,}3953}
          = 1.393\ \frac{\text{W}}{\text{m}}
          $$

          Una reducción del **54,7 %** con una mano de pintura, y sin tocar
          nada más de la instalación.

      - tipo: justificar
        pregunta: Ordena por qué no vale la fórmula corta. Una pieza es falsa.
        piezas:
          - texto: >-
              La fórmula $\dot Q = A_1\varepsilon_1\sigma\,\Delta T^{4}$ sale de
              despreciar la resistencia superficial del cuerpo exterior.
          - texto: >-
              Esa resistencia, $(1-\varepsilon_2)/(\varepsilon_2 A_2)$, es
              despreciable cuando $A_2$ es enorme, y aquí solo es un 25 %
              mayor que $A_1$.
          - texto: >-
              De hecho es la mayor de las tres, 0,74 frente a 0,40 y 0,40:
              despreciarla es despreciar casi la mitad del circuito.
          - texto: >-
              Y por eso la fórmula corta da menos calor del real, al haber
              eliminado una resistencia.
            trampa: true
            mensaje: |
              Da **más**, no menos: quitar una resistencia de un circuito en
              serie baja la resistencia total y sube el flujo. Por eso la
              fórmula corta daba 5.943 W/m frente a los 3.074 reales, casi el
              doble. Es un error del lado peligroso, porque hace parecer las
              pérdidas mayores de lo que son.
    resolucion: |
      **Solo radiación.** El vacío entre los dos conductos elimina la
      conducción y la convección, y deja la radiación como único mecanismo.

      **El circuito.** Por metro de longitud,
      $A_1 = \pi\cdot 0{,}8 = 2{,}513$ y $A_2 = \pi\cdot 1 = 3{,}142\ \text{m}^{2}$.
      El conducto interior es convexo y está completamente rodeado, así que
      $F_{12} = 1$ y toda su radiación llega al exterior.

      $$
      R_1 = \frac{1-\varepsilon_1}{\varepsilon_1 A_1}
      \qquad
      R_{12} = \frac{1}{A_1}
      \qquad
      R_2 = \frac{1-\varepsilon_2}{\varepsilon_2 A_2}
      $$

      **a) Con $\varepsilon_1 = 0{,}5$**: las tres valen 0,3979, 0,3979 y
      0,7427, y suman 1,5385.

      $$
      \dot Q = \frac{5{,}67\cdot 10^{-8}\left(550^{4}-300^{4}\right)}{1{,}5385}
      = 3.074\ \frac{\text{W}}{\text{m}}
      $$

      **b) Con $\varepsilon_1 = 0{,}15$**: solo cambia la primera, que pasa a
      2,2549, y el total a 3,3955.

      $$
      \dot Q = 1.393\ \frac{\text{W}}{\text{m}}
      \qquad
      \text{reducción} = \frac{3.074 - 1.393}{3.074} = 54{,}7\ \%
      $$

      **Y la comprobación que da sentido al ejercicio.** La fórmula corta,
      $A_1\varepsilon_1\sigma\Delta T^{4}$, daría 5.943 W/m: casi el doble.
      Solo vale cuando la superficie que rodea es mucho mayor que la rodeada,
      y aquí un metro contra ochenta centímetros no lo es. El aviso está en el
      propio enunciado: si te dan la emisividad de la superficie exterior, es
      porque hace falta.

  - id: ejter-col106-el-techo-radiante-y-la-fachada-de-vidrio
    titulo: El techo radiante y la fachada de vidrio, con paredes que devuelven lo que reciben
    fuente: >-
      Ejercicio 10.6 de las diapositivas del Tema 10, «Transmisión de calor
      por radiación térmica» · Ingeniería Térmica, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Las diapositivas traen su resolución, y el
      desarrollo está contrastado contra ella: sus tres resultados, 911,29 W,
      2.653,22 W y 1.642 W, se reproducen.
    nivel: practica
    enunciado: |
      Un local comercial de dimensiones $7 \times 5 \times 3{,}7\ \text{m}$
      (largo-ancho-alto) tiene toda la fachada acristalada. El local se
      calefacta mediante paneles radiantes a $35\ \text{°C}$ cubren toda la
      superficie del techo. Si el resto de paredes se mantiene a
      $20\ \text{°C}$, salvo el frontal de la fachada que está a
      $2\ \text{°C}$, calcúlese el flujo neto de calor entre el techo y la
      fachada si:

      a) Todos los planos son negros

      b) Todas las paredes son refractarias salvo techo y fachada, que son
      negros.

      c) El techo es un plano gris de emisividad $0{,}8$ y la fachada
      acristalada es un plano gris de emisividad $0{,}6$. El resto de paredes
      son refractarias.

      *La fachada es la pared de 5 m de ancho y 3,7 m de alto, y comparte con
      el techo, de 7 × 5 m, la arista de 5 m. El factor de visión entre los
      dos se lee en el ábaco de rectángulos perpendiculares con una arista
      común: entrando con $a/b = 3{,}7/5 = 0{,}74$ y $c/b = 7/5 = 1{,}4$, la
      resolución lee $F_{12} = 0{,}14$. Toma también
      $\sigma = 5{,}67\cdot 10^{-8}\ \text{W/(m}^{2}\text{·K}^{4})$ y
      $T = \theta + 273$.*
    pide: El intercambio neto de radiación entre el techo y la fachada en los tres casos.
    pasos:
      - tipo: reconocer
        pregunta: |
          En a) todas las superficies son negras y cada una está a su
          temperatura. ¿Qué parte del circuito interviene en el intercambio
          **neto** entre techo y fachada?
        opciones:
          - texto: >-
              Solo la resistencia directa, $1/(A_1F_{12})$: lo que el techo
              manda a las paredes lo absorben ellas, que son negras, y no se lo
              devuelven a la fachada
            correcta: true
            mensaje: |
              Eso es. Una superficie negra no refleja nada: el techo intercambia
              con las paredes y las paredes con la fachada, pero son
              intercambios distintos. Entre techo y fachada solo cuenta lo que
              va directo.
          - texto: >-
              Las tres resistencias, porque parte de lo que sale del techo llega
              a la fachada rebotando en las paredes
            mensaje: |
              Rebotar es reflejar, y una superficie negra no refleja nada. Eso
              sí pasará en b), con las paredes refractarias: devolverán todo lo
              que reciban.
          - texto: >-
              Ninguna: con las superficies negras no hay resistencias
            mensaje: |
              Desaparecen las superficiales, $(1-\varepsilon)/(\varepsilon A)$,
              que valen cero con $\varepsilon = 1$. Las geométricas,
              $1/(A_iF_{ij})$, dependen solo de la geometría y siguen ahí.

      - tipo: calcular
        titulo: Con todas las superficies negras
        pregunta: |
          ¿Cuánto vale el intercambio neto entre techo y fachada en a)?
        respuesta:
          tipo: magnitud
          valor: '911.3 W'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '0.4169 W'
            mensaje: |
              Has metido las temperaturas en grados Celsius. En radiación,
              kelvin siempre: con 35 y 2 el resultado sale más de dos mil veces
              menor.
          - valor: '6509 W'
            mensaje: |
              Has tomado $F_{12} = 1$, como si toda la radiación del techo fuera
              a parar a la fachada. Le llega el 14 %: el resto va a las paredes
              y al suelo.
          - valor: '481.7 W'
            mensaje: |
              Has multiplicado $F_{12}$ por el área de la **fachada**. $F_{12}$
              es la fracción de lo que sale del **techo** que llega a la
              fachada, y va con $A_1$; la reciprocidad lo dice:
              $A_1F_{12} = A_2F_{21}$.
        pista: |
          $\dot Q_{12} = A_1\,F_{12}\,\sigma\left(T_1^{4}-T_2^{4}\right)$, con
          $A_1 = 7\cdot 5\ \text{m}^{2}$ y las temperaturas en kelvin.
        desarrollo: |
          $$
          \dot Q_{12} = (7\cdot 5)\cdot 0{,}14\cdot 5{,}67\cdot 10^{-8}\left(308^{4}-275^{4}\right) = 911{,}3\ \text{W}
          $$

          Los 20 °C de las paredes no entran en la cuenta: el intercambio de
          cada una con el techo y con la fachada es otro asunto.

      - tipo: calcular
        titulo: Lo que la fachada ve de las paredes
        pregunta: |
          Para b) hace falta $F_{23}$, la fracción de lo que sale de la
          fachada que llega a las paredes. Con la reciprocidad y la suma a
          uno, ¿cuánto vale?
        respuesta:
          tipo: numero
          valor: '0.7351'
          tolerancia: 0.01
          formato: un factor de visión, entre 0 y 1
        distractores:
          - valor: '0.86'
            mensaje: |
              Esa es $F_{13}$, lo que el **techo** ve de las paredes. La suma a
              uno se hace sobre una misma superficie emisora: para la fachada,
              $F_{21} + F_{23} = 1$, y $F_{21}$ no es 0,14.
          - valor: '0.926'
            mensaje: |
              Has aplicado la reciprocidad al revés, $F_{21} = A_2F_{12}/A_1$.
              Es $A_1F_{12} = A_2F_{21}$: la fachada es más pequeña que el
              techo, así que ve más techo del que el techo ve de ella.
        pista: |
          Primero $F_{21} = A_1F_{12}/A_2$; la fachada solo ve techo y
          paredes, así que $F_{21} + F_{23} = 1$.
        desarrollo: |
          $$
          F_{21} = \frac{A_1}{A_2}\,F_{12} = \frac{7\cdot 5}{5\cdot 3{,}7}\cdot 0{,}14 = 0{,}2649
          \qquad
          F_{23} = 1 - 0{,}2649 = 0{,}7351
          $$

          Y para el techo, $F_{13} = 1 - 0{,}14 = 0{,}86$.

      - tipo: calcular
        titulo: Con las paredes refractarias
        pregunta: |
          En b), con techo y fachada negros y el resto refractario, ¿cuánto
          vale el intercambio neto entre techo y fachada?
        respuesta:
          tipo: magnitud
          valor: '2653 W'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '911.3 W'
            mensaje: |
              Ese es el de a): solo el camino directo. Con las paredes
              refractarias hay un segundo camino, porque todo lo que les llega
              del techo lo devuelven, y parte va a la fachada.
          - valor: '598.3 W'
            mensaje: |
              Has puesto los dos caminos en serie. Los dos van del techo a la
              fachada, entre los mismos nodos: están en paralelo, y la
              resistencia equivalente es **menor** que cualquiera de las dos.
        pista: |
          Una superficie refractaria no gana ni pierde calor neto: su
          radiosidad es igual a su poder emisivo y su nodo queda libre. El
          calor va del techo a la fachada por dos caminos en paralelo: el
          directo, $1/(A_1F_{12})$, y el que pasa por las paredes,
          $1/(A_1F_{13}) + 1/(A_2F_{23})$.
        desarrollo: |
          $$
          \frac{1}{A_1F_{12}} = \frac{1}{35\cdot 0{,}14} = 0{,}2041
          \qquad
          \frac{1}{A_1F_{13}} + \frac{1}{A_2F_{23}} = \frac{1}{35\cdot 0{,}86} + \frac{1}{18{,}5\cdot 0{,}7351} = 0{,}1068
          $$

          $$
          R = \frac{0{,}2041\cdot 0{,}1068}{0{,}2041 + 0{,}1068} = 0{,}0701
          \qquad
          \dot Q_{12} = \frac{5{,}67\cdot 10^{-8}\left(308^{4}-275^{4}\right)}{0{,}0701} = 2.653\ \text{W}
          $$

          Casi el triple que en a). Y las resistencias van en
          $\text{m}^{-2}$, porque aquí el potencial es un poder emisivo, en
          W/m².

      - tipo: calcular
        titulo: Con techo y fachada grises
        pregunta: |
          En c), con el techo gris de emisividad 0,8, la fachada gris de 0,6 y
          el resto refractario, ¿cuánto vale el intercambio neto?
        respuesta:
          tipo: magnitud
          valor: '1642 W'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '188.5 W'
            mensaje: |
              Has escrito las resistencias superficiales sin el área,
              $(1-\varepsilon)/\varepsilon$. Tienen que ir en las mismas
              unidades que la $R$ de b), en $\text{m}^{-2}$:
              $(1-\varepsilon)/(\varepsilon A)$.
          - valor: '1812 W'
            mensaje: |
              Has cruzado las emisividades: 0,8 es la del techo y 0,6 la de la
              fachada. Con la emisividad baja en la superficie pequeña, que es
              lo que pasa de verdad, la resistencia superficial pesa más y el
              intercambio sale menor.
          - valor: '2408 W'
            mensaje: |
              Te has dejado la resistencia superficial de la fachada, 0,0360.
              Es la mayor de las dos, porque el vidrio tiene la emisividad más
              baja y la fachada es la superficie más pequeña.
        pista: |
          A cada lado de la $R$ de b) se añade la resistencia superficial de
          su superficie, $(1-\varepsilon)/(\varepsilon A)$, en serie.
        desarrollo: |
          $$
          \frac{1-0{,}8}{0{,}8\cdot 35} = 0{,}00714
          \qquad
          \frac{1-0{,}6}{0{,}6\cdot 18{,}5} = 0{,}03604
          $$

          $$
          \dot Q_{12} = \frac{5{,}67\cdot 10^{-8}\left(308^{4}-275^{4}\right)}{0{,}00714 + 0{,}0701 + 0{,}03604} = 1.642\ \text{W}
          $$

      - tipo: justificar
        pregunta: Ordena la comparación de los tres casos. Una pieza es falsa.
        piezas:
          - texto: >-
              Con todo negro, entre techo y fachada solo cuenta el camino
              directo: 911 W.
          - texto: >-
              Si las paredes son refractarias, devuelven todo lo que reciben y
              abren un segundo camino en paralelo: 2.653 W, casi el triple.
          - texto: >-
              Con techo y fachada grises se añaden sus resistencias
              superficiales, en serie, y el intercambio baja a 1.642 W.
          - texto: >-
              Como las paredes refractarias no intercambian calor neto, no
              cambian nada respecto de a).
            trampa: true
            mensaje: |
              No intercambian calor **neto**, que no es lo mismo que no
              intervenir: reciben radiación del techo y la reemiten, y parte
              llega a la fachada. Por eso el intercambio entre techo y fachada
              casi se triplica, de 911 a 2.653 W.
    resolucion: |
      **La geometría.** Techo, $A_1 = 7\cdot 5 = 35\ \text{m}^{2}$; fachada,
      $A_2 = 5\cdot 3{,}7 = 18{,}5\ \text{m}^{2}$; y el resto —suelo y tres
      paredes— forma la superficie 3. Con $F_{12} = 0{,}14$ del ábaco, la suma
      a uno y la reciprocidad dan el resto:

      $$
      F_{13} = 1 - 0{,}14 = 0{,}86
      \qquad
      F_{21} = \frac{35}{18{,}5}\cdot 0{,}14 = 0{,}2649
      \qquad
      F_{23} = 1 - 0{,}2649 = 0{,}7351
      $$

      El potencial entre techo y fachada es siempre el mismo:
      $\sigma\left(308^{4}-275^{4}\right) = 186{,}0\ \text{W/m}^{2}$.

      **a) Todo negro.** Solo el camino directo:

      $$
      \dot Q_{12} = 35\cdot 0{,}14\cdot 186{,}0 = 911{,}3\ \text{W}
      $$

      **b) Paredes refractarias.** Una superficie **refractaria** es la que
      no intercambia calor neto: todo lo que le llega lo devuelve. En el
      circuito, su radiosidad es igual a su poder emisivo y su nodo queda
      libre, sin fuente, así que abre un segundo camino entre techo y
      fachada, en paralelo con el directo:

      $$
      R = \frac{0{,}2041\cdot 0{,}1068}{0{,}2041 + 0{,}1068} = 0{,}0701
      \qquad
      \dot Q_{12} = \frac{186{,}0}{0{,}0701} = 2.653\ \text{W}
      $$

      **c) Techo y fachada grises.** Sus resistencias superficiales, en
      serie con la $R$ de b):

      $$
      \dot Q_{12} = \frac{186{,}0}{0{,}00714 + 0{,}0701 + 0{,}03604} = 1.642\ \text{W}
      $$

      **Un aviso sobre los 20 °C del enunciado.** No se usan en ningún
      apartado. En a) porque el intercambio neto entre techo y fachada no
      depende de las paredes, que son negras; en b) y c) porque una pared
      refractaria no se mantiene a ninguna temperatura: toma la que resulte
      del balance.

      **Lo que hay que llevarse.** Las paredes refractarias no ganan ni
      pierden calor, y aun así casi triplican el intercambio entre techo y
      fachada: lo que les llega lo reemiten, y parte va a parar a la
      fachada. «No intercambia calor neto» no quiere decir «no interviene».
      Y el orden de los tres resultados tiene sentido: los caminos en
      paralelo suman, las resistencias superficiales en serie restan.

