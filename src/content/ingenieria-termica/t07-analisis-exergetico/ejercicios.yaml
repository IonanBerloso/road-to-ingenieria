ejercicios:
  - id: ejter-lo-que-vale-un-calor-segun-donde-este
    titulo: Lo que vale un calor según a qué temperatura esté
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería, sobre la exergía de un calor
      y el teorema de Guy-Stodola, Tema 7 de la asignatura. No es de examen ni
      de la colección.
    nivel: ejemplo
    enunciado: |
      El ambiente está a $22\ \text{°C}$.

      a) ¿Cuánto trabajo se podría sacar, como máximo, de $500\ \text{kJ}$ de
      calor disponibles a $600\ \text{K}$?

      b) ¿Y de los mismos 500 kJ a $310\ \text{K}$?

      c) Un proceso genera $S_G = 0{,}42\ \text{kJ/K}$. ¿Cuánta exergía
      destruye?
    pide: Las dos exergías del calor y la exergía destruida.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué la exergía de un calor depende de la temperatura a la que
          está disponible?
        opciones:
          - texto: >-
              Porque el máximo trabajo que se puede sacar de él es el de un
              motor reversible entre esa temperatura y la del ambiente, y eso
              es el rendimiento de Carnot
            correcta: true
            mensaje: |
              Exacto, y por eso el factor $(1-T_0/T)$ te suena: **es** el
              rendimiento de Carnot del tema 5. La exergía de un calor no es
              un concepto nuevo, es el segundo principio puesto en
              kilojulios.
          - texto: >-
              Porque el calor específico cambia con la temperatura
            mensaje: |
              El calor específico cambia, sí, pero eso afectaría a cuánto
              calor hay, no a cuánto de ese calor es aprovechable. La exergía
              depende de la temperatura por el segundo principio, no por las
              propiedades del fluido.
          - texto: >-
              Porque a más temperatura hay más energía
            mensaje: |
              El enunciado dice 500 kJ en los dos casos: la **energía** es la
              misma. Lo que cambia es su calidad, es decir cuánta de ella se
              puede convertir en trabajo. Eso es exactamente lo que este tema
              mide.

      - tipo: calcular
        titulo: La exergía del calor a 600 K
        pregunta: |
          ¿Cuánto vale la exergía de esos 500 kJ a 600 K?
        respuesta:
          tipo: magnitud
          valor: '254.2 kJ'
          tolerancia: 0.02
          formato: una energía, con su unidad
        distractores:
          - valor: '245.8 kJ'
            mensaje: |
              Eso es la **anergia**, $Q\,T_0/T$: la parte que no hay manera de
              convertir en trabajo. Las dos suman los 500 kJ, y la que se pide
              es la otra.
          - valor: '500 kJ'
            mensaje: |
              Sería la exergía de 500 kJ de **trabajo**, que sí vale íntegro.
              Un calor no: el segundo principio se queda con una parte, y
              cuánta lo dice el factor de Carnot.
        pista: |
          $Ex_Q = Q\left(1 - T_0/T\right)$, con las dos temperaturas en
          kelvin.
        desarrollo: |
          $$
          Ex_Q = 500\left(1 - \frac{295}{600}\right) = 500\cdot 0{,}5083
          = 254{,}2\ \text{kJ}
          $$

          Poco más de la mitad. Los otros 245,8 kJ son anergia y no los
          recupera ninguna máquina.

      - tipo: calcular
        titulo: Los mismos 500 kJ, a 310 K
        pregunta: |
          ¿Y si esos 500 kJ estuvieran disponibles a 310 K en vez de a 600?
        respuesta:
          tipo: magnitud
          valor: '24.2 kJ'
          tolerancia: 0.02
          formato: una energía, con su unidad
        distractores:
          - valor: '254.2 kJ'
            mensaje: |
              Ese es el valor a 600 K. La energía es la misma en los dos
              casos, 500 kJ; lo que cambia es su calidad, y a 310 K —quince
              grados por encima del ambiente— casi no queda nada aprovechable.
          - valor: '475.8 kJ'
            mensaje: |
              Esa es la anergia. A 310 K la proporción se ha dado la vuelta:
              ahora lo aprovechable es la parte pequeña.
        pista: |
          La misma fórmula, cambiando 600 por 310.
        desarrollo: |
          $$
          Ex_Q = 500\left(1 - \frac{295}{310}\right) = 500\cdot 0{,}0484
          = 24{,}2\ \text{kJ}
          $$

          **Diez veces menos**, con la misma energía. Ese es todo el argumento
          de la cogeneración y de la recuperación de calor residual: el calor
          a baja temperatura es abundante y casi no vale nada.

      - tipo: calcular
        titulo: La exergía destruida
        pregunta: |
          Un proceso genera 0,42 kJ/K de entropía. ¿Cuánta exergía destruye?
        respuesta:
          tipo: magnitud
          valor: '123.9 kJ'
          tolerancia: 0.02
          formato: una energía, con su unidad
        distractores:
          - valor: '0.42 kJ'
            mensaje: |
              Eso es la entropía generada, en kJ/K, no la exergía destruida.
              Guy-Stodola las relaciona multiplicando por la temperatura
              **absoluta del ambiente**: 295 K.
          - valor: '9.24 kJ'
            mensaje: |
              Has multiplicado por 22, la temperatura en grados Celsius. La
              $T_0$ de Guy-Stodola es absoluta y va en kelvin, como todas las
              temperaturas que aparecen multiplicando o dividiendo.
        pista: |
          $Ex_D = T_0\,S_G$, con $T_0 = 295\ \text{K}$.
        desarrollo: |
          $$
          Ex_D = T_0\,S_G = 295\cdot 0{,}42 = 123{,}9\ \text{kJ}
          $$

      - tipo: justificar
        pregunta: Ordena lo que este ejercicio enseña. Una pieza es falsa.
        piezas:
          - texto: >-
              La exergía de un calor es lo que un motor reversible sacaría de
              él contra el ambiente: el factor $(1-T_0/T)$ es Carnot.
          - texto: >-
              Por eso los mismos 500 kJ valen 254 a 600 K y solo 24 a 310 K:
              la energía es la misma y la calidad, no.
          - texto: >-
              Y Guy-Stodola pone en kilojulios lo que la entropía generada
              decía en kJ/K, multiplicando por la temperatura del ambiente.
          - texto: >-
              Luego, si el ambiente estuviera más frío, la exergía destruida
              por ese proceso sería mayor.
            trampa: true
            mensaje: |
              Sería **menor**: $Ex_D = T_0S_G$, así que baja con $T_0$. Y tiene
              sentido físico, aunque despiste: con un ambiente más frío hay un
              foco frío mejor, cada julio de calor vale más, y la misma
              irreversibilidad cuesta menos trabajo perdido. Es la razón de que
              las centrales rindan más en invierno.
    resolucion: |
      **a) y b) La exergía del mismo calor a dos temperaturas.** Con
      $T_0 = 295\ \text{K}$:

      $$
      Ex_Q\big|_{600} = 500\left(1-\frac{295}{600}\right) = 254{,}2\ \text{kJ}
      \qquad
      Ex_Q\big|_{310} = 500\left(1-\frac{295}{310}\right) = 24{,}2\ \text{kJ}
      $$

      **c) La exergía destruida.** Por Guy-Stodola:

      $$
      Ex_D = T_0\,S_G = 295\cdot 0{,}42 = 123{,}9\ \text{kJ}
      $$

      **Lo que hay que llevarse.** Las tres cuentas son de una línea y las
      tres dicen lo mismo desde sitios distintos: la energía se conserva y la
      exergía no. Un calor a baja temperatura es energía de sobra y trabajo de
      casi nada; y cada unidad de entropía que un proceso genera se traduce en
      kilojulios de trabajo que ya nadie va a recuperar.

  - id: ejter-el-agua-caliente-y-la-fria-que-se-mezclan
    titulo: Dos aguas que se mezclan, y la energía que no se pierde
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería, sobre la exergía de un
      sistema cerrado del tema 7. Es el molde que más se repite en las
      diecisiete convocatorias leídas —algo caliente metido en agua dentro de
      un recipiente adiabático, del que se pide la exergía destruida—, y el
      sitio no tenía ninguno. No es de examen ni de la colección: los números
      son nuestros y están elegidos para que la temperatura de equilibrio salga
      redonda.
    nivel: ejemplo
    enunciado: |
      En un recipiente **adiabático y rígido** se vierten $2\ \text{kg}$ de
      agua a $80\ \text{°C}$ sobre $8\ \text{kg}$ de agua a $20\ \text{°C}$, y
      se deja evolucionar hasta el equilibrio. El ambiente está a
      $20\ \text{°C}$.

      a) La temperatura de equilibrio.

      b) La entropía generada en el universo.

      c) La exergía destruida, **por los dos caminos**: con Guy-Stodola y con
      el balance de exergía del conjunto.

      Tómese el agua como incompresible, con $c = 4{,}18\ \text{kJ/(kg}\cdot
      \text{K)}$.
    pide: La temperatura final, la entropía generada y la exergía destruida por los dos caminos.

    pasos:
      - tipo: reconocer
        pregunta: |
          El recipiente es adiabático: no sale ni entra energía. ¿Por qué se
          destruye exergía entonces?
        opciones:
          - texto: >-
              Porque la energía se conserva pero se **reparte a una
              temperatura más baja**, y a menor temperatura vale menos trabajo
            correcta: true
            mensaje: |
              Eso es, y es la idea entera del tema. Los mismos kilojulios que
              estaban a 80 °C acaban a 32 °C, y desde 32 °C ya no se puede
              sacar el trabajo que se sacaba desde 80. **Nada se ha perdido y
              todo vale menos.**
          - texto: >-
              Porque parte del calor se escapa al ambiente
            mensaje: |
              No se escapa nada: el recipiente es adiabático y eso es un dato
              del enunciado. Precisamente por eso el ejercicio es interesante
              — la destrucción ocurre **dentro**, sin que salga un julio.
          - texto: >-
              Porque la energía interna del conjunto disminuye
            mensaje: |
              No disminuye. Comprueba el balance: lo que pierde el agua
              caliente es exactamente lo que gana la fría, y el total no
              cambia. Lo que cambia es a qué temperatura está.
          - texto: >-
              Porque el proceso no es adiabático de verdad, solo idealmente
            mensaje: |
              El enunciado lo declara adiabático y así se resuelve. Buscar
              una fuga es esquivar la pregunta: la irreversibilidad de este
              proceso es la **diferencia de temperaturas**, no una pérdida.

      - tipo: calcular
        titulo: La temperatura de equilibrio
        pregunta: |
          ¿A qué temperatura acaban las dos aguas?
        respuesta:
          tipo: magnitud
          valor: '32 °C'
          tolerancia: 0.02
          formato: una temperatura, con su unidad
        distractores:
          - valor: '50 °C'
            mensaje: |
              Esa es la media de las dos temperaturas, y solo valdría si las
              masas fueran iguales. Hay **cuatro veces más** agua fría que
              caliente, así que el equilibrio queda mucho más cerca de los
              20 °C.
          - valor: '68 °C'
            mensaje: |
              Has ponderado al revés: has dado más peso a la caliente. La que
              pesa ocho kilos es la fría.
        pista: |
          Balance de energía en un adiabático: lo que pierde una es lo que gana
          la otra, y el calor específico se cancela.
        desarrollo: |
          El recipiente es adiabático y rígido, así que $Q=0$ y $W=0$: la
          energía interna del conjunto no cambia. Con el modelo incompresible
          y el mismo $c$ para las dos:

          $
          m_c\left(\theta_2-\theta_c\right)+m_f\left(\theta_2-\theta_f\right)=0
          $

          $
          \theta_2=\frac{2\cdot 80+8\cdot 20}{2+8}
          =\frac{160+160}{10}=32\ \text{°C}
          $

          Los números están elegidos para que salga entero. Fíjate en que el
          calor específico **se ha ido**: en una mezcla del mismo fluido, la
          temperatura de equilibrio no depende de $c$.

      - tipo: calcular
        titulo: La entropía generada
        pregunta: |
          ¿Cuánta entropía se genera en el universo?
        respuesta:
          tipo: magnitud
          valor: '0.120 kJ/K'
          tolerancia: 0.03
          formato: una entropía, con su unidad
        distractores:
          - valor: '1.342 kJ/K'
            mensaje: |
              Eso es solo lo que **gana** el agua fría. La caliente pierde
              entropía, y hay que sumar las dos variaciones: el resultado es
              pequeño porque casi se cancelan, y esa cancelación casi total es
              justo lo que hace difícil el apartado.
          - valor: '0 kJ/K'
            mensaje: |
              Cero saldría si el proceso fuese reversible, y no lo es:
              mezclar dos temperaturas distintas nunca lo es. Si te sale cero,
              revisa el signo de uno de los dos logaritmos.
        pista: |
          Cada masa cambia su entropía en $m\,c\ln\left(T_2/T_1\right)$, con las
          temperaturas en kelvin. El ambiente no interviene: no le llega calor.
        desarrollo: |
          Como no sale calor del recipiente, el medio circundante no cambia su
          entropía y todo lo generado está dentro:

          $
          S_G=m_c\,c\ln\frac{T_2}{T_c}+m_f\,c\ln\frac{T_2}{T_f}
          $

          $
          S_G=8{,}36\ln\frac{305{,}15}{353{,}15}
          +33{,}44\ln\frac{305{,}15}{293{,}15}
          $

          $
          S_G=-1{,}221+1{,}342=0{,}120\ \frac{\text{kJ}}{\text{K}}
          $

          **Cuidado con esto:** los dos sumandos valen más de 1 y el resultado
          es 0,12. Redondear los logaritmos a dos decimales aquí te cambia el
          resultado a la mitad o al doble, porque lo que queda es la diferencia
          de dos números casi iguales.

      - tipo: calcular
        titulo: La exergía destruida, por Guy-Stodola
        pregunta: |
          ¿Cuánta exergía se ha destruido?
        respuesta:
          tipo: magnitud
          valor: '35.3 kJ'
          tolerancia: 0.03
          formato: una energía, con su unidad
        distractores:
          - valor: '42.5 kJ'
            mensaje: |
              Has multiplicado por la temperatura inicial del agua caliente.
              Guy-Stodola usa **la del ambiente**, y solo la del ambiente: es
              el único foco al que el universo podría tirar el calor.
          - valor: '401.3 kJ'
            mensaje: |
              Esa es la energía que ha pasado de un agua a la otra, y no es lo
              destruido. La energía se conserva entera; lo que se destruye es
              su **capacidad de dar trabajo**, y eso es mucho menor.
        pista: |
          $B_D=T_0\,S_G$, con $T_0$ en kelvin.
        desarrollo: |
          $
          B_D=T_0\,S_G=293{,}15\cdot 0{,}120
          =35{,}3\ \text{kJ}
          $

          Treinta y cinco kilojulios de trabajo que ya no se pueden sacar de
          nada. Y no ha salido ni un julio del recipiente.

      - tipo: calcular
        titulo: Y por el otro camino
        pregunta: |
          Calcula ahora la variación de exergía del conjunto, que en un
          recipiente aislado y sin trabajo tiene que ser la exergía destruida
          cambiada de signo. ¿Cuánto vale $\Delta B$?
        respuesta:
          tipo: magnitud
          valor: '-35.3 kJ'
          tolerancia: 0.03
          formato: una energía con su signo y su unidad
        distractores:
          - valor: '35.3 kJ'
            mensaje: |
              El módulo está bien y el signo no. La exergía del conjunto
              **baja**: la destruida es lo que ha desaparecido, así que
              $\Delta B$ es negativa y $B_D=-\Delta B$.
          - valor: '-43.3 kJ'
            mensaje: |
              Esa es solo la del agua caliente. La fría **gana** exergía —se
              calienta y se aleja del ambiente—, y hay que sumar las dos.
        pista: |
          Para cada masa, $\Delta B=m\,c\left(T_2-T_1\right)-T_0\,\Delta S$.
          Súmalas.
        desarrollo: |
          Para el agua caliente:

          $
          \Delta B_c=8{,}36\left(305{,}15-353{,}15\right)
          -293{,}15\left(-1{,}221\right)=-401{,}3+358{,}0=-43{,}3\ \text{kJ}
          $

          Y para la fría:

          $
          \Delta B_f=33{,}44\left(305{,}15-293{,}15\right)
          -293{,}15\left(1{,}342\right)=401{,}3-393{,}3=8{,}0\ \text{kJ}
          $

          $
          \Delta B=-43{,}3+8{,}0=-35{,}3\ \text{kJ}
          \;\Longrightarrow\;
          B_D=35{,}3\ \text{kJ}
          $

          **Los dos caminos dan lo mismo, y eso no es casualidad**: son la
          misma ecuación escrita de dos maneras. Fíjate en que el agua fría
          **gana** exergía y aun así el conjunto pierde: lo que gana la fría no
          llega a compensar lo que pierde la caliente, y esa diferencia es
          exactamente lo destruido.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El recipiente es adiabático y rígido, así que la energía interna
              del conjunto no cambia y la temperatura de equilibrio sale del
              balance de energía: 32 °C.
          - texto: >-
              La entropía que pierde el agua caliente y la que gana la fría no
              se cancelan del todo: quedan 0,120 kJ/K generados.
          - texto: >-
              Esos 0,120 kJ/K, multiplicados por la temperatura del ambiente,
              son 35,2 kJ de exergía destruida.
          - texto: >-
              Y como el recipiente es adiabático, esos 35,2 kJ son energía que
              ha salido del sistema hacia el ambiente.
            trampa: true
            mensaje: |
              No ha salido **nada**: el recipiente es adiabático, y esa es la
              gracia del ejercicio. Los 35,2 kJ no son energía que se haya ido
              a ningún sitio, son **trabajo que ya no se puede obtener** de una
              energía que sigue entera dentro del recipiente. Confundir energía
              destruida con energía perdida es el error de fondo del tema: la
              energía no se destruye nunca — la exergía sí, y sin moverse.
    resolucion: |
      **a) La temperatura de equilibrio.** Adiabático y rígido, luego $\Delta
      U=0$:

      $
      \theta_2=\frac{2\cdot 80+8\cdot 20}{10}=32\ \text{°C}
      $

      **b) La entropía generada.** Al ambiente no le llega calor, así que todo
      lo generado está dentro:

      $
      S_G=8{,}36\ln\frac{305{,}15}{353{,}15}+33{,}44\ln\frac{305{,}15}{293{,}15}
      =-1{,}221+1{,}342=0{,}120\ \frac{\text{kJ}}{\text{K}}
      $

      **c) La exergía destruida, por los dos caminos.**

      Guy-Stodola:

      $
      B_D=T_0\,S_G=293{,}15\cdot 0{,}120=35{,}3\ \text{kJ}
      $

      Balance de exergía del conjunto:

      $
      \Delta B=\left(-43{,}3\right)+8{,}0=-35{,}3\ \text{kJ}
      \;\Longrightarrow\;
      B_D=-\Delta B=35{,}3\ \text{kJ}
      $

      $
      \boxed{\;\theta_2=32\ \text{°C}\qquad
      S_G=0{,}120\ \text{kJ/K}\qquad
      B_D=35{,}3\ \text{kJ}\;}
      $

      **Lo que hay que llevarse.** Tres cosas, y la primera es por la que este
      ejercicio existe.

      1. **Los dos caminos no son dos ejercicios: son el mismo.** Y el examen
         los pide por separado —enero y febrero de 2025 los piden los dos, uno
         detrás de otro, y valen la mitad de los puntos cada uno—. Si solo
         sabes uno, tienes medio apartado.
      2. **En un adiabático se destruye exergía sin que salga nada.** No hay
         fuga que buscar: la irreversibilidad es la diferencia de temperaturas,
         y ocurre entera dentro del recipiente.
      3. **La entropía generada es una resta de números casi iguales.** Los dos
         sumandos pasan de 1 y el resultado es 0,12. Redondear los logaritmos
         pronto te cambia el resultado al doble o a la mitad, así que se
         arrastran los decimales hasta el final.

  - id: ejter-el-rendimiento-exergetico-de-un-compresor
    titulo: El rendimiento exergético de un compresor, y por qué no es el isentrópico
    fuente: >-
      Ejemplo · Road to Ingeniería, sobre la definición de rendimiento
      exergético del Tema 7 de la asignatura. La prosa lo define para el
      compresor, y lo piden el apartado g) del ejercicio 7.3 de las
      diapositivas y la extraordinaria de junio de 2017: este ejemplo es la
      entrada a los dos. No es de examen ni de la colección.
    nivel: ejemplo
    enunciado: |
      Un compresor adiabático toma aire a $1\ \text{bar}$ y $20\ \text{°C}$ y
      lo entrega a $6\ \text{bar}$ y $280\ \text{°C}$.

      a) ¿Cuál es su rendimiento exergético?

      b) ¿Cuánta exergía destruye por kilogramo?

      Estado de referencia: $20\ \text{°C}$ y $1\ \text{bar}$. Aire:
      $c_p = 1{,}0045$, $R' = 0{,}287\ \text{kJ/(kg·K)}$, $\gamma = 1{,}4$.
    pide: El rendimiento exergético del compresor y la exergía que destruye.
    pasos:
      - tipo: reconocer
        pregunta: |
          En un rendimiento exergético, arriba va lo que se busca y abajo lo
          que se paga. En un compresor, ¿qué es cada cosa?
        opciones:
          - texto: >-
              Arriba, el aumento de exergía del aire; abajo, el trabajo
              consumido
            correcta: true
            mensaje: |
              Eso es. Lo que se compra es trabajo y lo que se busca es aire a
              presión, o sea aire con más exergía. El cociente dice qué parte
              del trabajo se ha quedado dentro del aire en forma aprovechable.
          - texto: >-
              Arriba, el trabajo consumido; abajo, el aumento de exergía
            mensaje: |
              Está al revés, y se nota en el resultado: saldría mayor que uno.
              Un rendimiento exergético nunca pasa de uno, porque la exergía no
              se crea.
          - texto: >-
              Arriba, el trabajo que haría un compresor isentrópico; abajo, el
              real
            mensaje: |
              Eso es el rendimiento **isentrópico**, que compara el compresor
              con una máquina ideal que va a los mismos estados de presión. El
              exergético no compara con nada: mide cuánto del trabajo pagado
              sigue siendo aprovechable.

      - tipo: calcular
        titulo: El trabajo consumido
        pregunta: |
          ¿Cuánto trabajo consume por kilogramo?
        respuesta:
          tipo: magnitud
          valor: '261.2 kJ/kg'
          tolerancia: 0.02
          formato: una energía específica, con su unidad
        distractores:
          - valor: '186.6 kJ/kg'
            mensaje: |
              Has usado $c_v$. En un volumen de control el trabajo va con la
              **entalpía**, no con la energía interna, y por eso el calor
              específico que toca es $c_p$.
          - valor: '281.3 kJ/kg'
            mensaje: |
              Has restado las temperaturas en kelvin **y** sumado 273 al
              resultado, o has usado 553 y 273. El salto es 280 − 20 = 260, y
              vale lo mismo en las dos escalas.
        pista: |
          Adiabático y en régimen estacionario: $w = h_2 - h_1 =
          c_p(T_2 - T_1)$.
        desarrollo: |
          $$
          w = c_p\,(T_2 - T_1) = 1{,}0045\cdot(553 - 293)
          = 261{,}2\ \frac{\text{kJ}}{\text{kg}}
          $$

      - tipo: calcular
        titulo: La variación de entropía
        pregunta: |
          ¿Cuánto vale $s_2 - s_1$?
        respuesta:
          tipo: magnitud
          valor: '0.1238 kJ/(kg K)'
          tolerancia: 0.02
          formato: un calor específico, con su unidad
        distractores:
          - valor: '0.6380 kJ/(kg K)'
            mensaje: |
              Te has quedado con el término de la temperatura y has olvidado el
              de la presión. Comprimir **baja** la entropía, y aquí resta
              0,5142: sin él el resultado se multiplica por cinco.
          - valor: '1.1523 kJ/(kg K)'
            mensaje: |
              Has sumado los dos términos en vez de restarlos. El de la presión
              entra con signo menos, porque la presión sube.
        pista: |
          $s_2 - s_1 = c_p\ln(T_2/T_1) - R'\ln(P_2/P_1)$.
        desarrollo: |
          $$
          s_2 - s_1 = 1{,}0045\,\ln\frac{553}{293} - 0{,}287\,\ln 6
          = 0{,}6380 - 0{,}5142 = 0{,}1238\ \frac{\text{kJ}}{\text{kg}\cdot\text{K}}
          $$

          Positiva, y el compresor es adiabático: **toda** esa entropía se ha
          generado dentro. Eso es lo que va a costar exergía.

      - tipo: calcular
        titulo: El rendimiento exergético
        pregunta: |
          ¿Cuánto vale el rendimiento exergético?
        respuesta:
          tipo: numero
          valor: '0.861'
          tolerancia: 0.005
          formato: una fracción entre 0 y 1
        distractores:
          - valor: '0.753'
            mensaje: |
              Ese es el rendimiento **isentrópico**: el compresor ideal entre
              1 y 6 bar saldría a 488,9 K y gastaría 196,8 kJ/kg. Es otra
              pregunta, y da otro número — este compresor es «peor» como
              máquina isentrópica que como conservador de exergía.
          - valor: '0.139'
            mensaje: |
              Esa es la fracción **destruida**, no la aprovechada. Las dos
              suman uno, así que has calculado bien y has contestado lo
              contrario.
        pista: |
          $\eta_{ex} = \dfrac{\psi_2 - \psi_1}{w}$, con
          $\psi_2 - \psi_1 = (h_2 - h_1) - T_0\,(s_2 - s_1)$.
        desarrollo: |
          $$
          \psi_2 - \psi_1 = 261{,}2 - 293\cdot 0{,}1238
          = 261{,}2 - 36{,}3 = 224{,}9\ \frac{\text{kJ}}{\text{kg}}
          $$
          $$
          \eta_{ex} = \frac{224{,}9}{261{,}2} = 0{,}861
          $$

          De cada cien kilojulios de trabajo, ochenta y seis se quedan dentro
          del aire como capacidad de volver a producir trabajo, y catorce se
          han perdido para siempre.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El compresor es adiabático, así que toda la entropía que aparece
              entre la entrada y la salida se ha generado dentro.
          - texto: >-
              Por Guy-Stodola, la exergía destruida es $T_0$ por esa entropía
              generada: 293 · 0,1238 = 36,3 kJ/kg.
          - texto: >-
              Y esos 36,3 son exactamente lo que falta entre los 261,2 que se
              pagan y los 224,9 que se llevan: el rendimiento es 0,861.
          - texto: >-
              Como el rendimiento exergético es 0,861, el compresor consume un
              13,9 % más de trabajo del que consumiría uno reversible.
            trampa: true
            mensaje: |
              No: el reversible que llevara el aire **al mismo estado final**
              gastaría 224,9 kJ/kg, y 261,2 sobre 224,9 es un 16,1 % más, no un
              13,9 %. El 13,9 % es la fracción del trabajo **pagado** que se
              pierde, que se mide sobre el denominador grande. Es la confusión
              de siempre entre «un 14 % de lo que pago» y «un 14 % más de lo
              mínimo».
    resolucion: |
      **a) El rendimiento exergético.**

      El trabajo, con la entalpía porque es un volumen de control:

      $$
      w = c_p\,(T_2-T_1) = 1{,}0045\cdot 260 = 261{,}2\ \frac{\text{kJ}}{\text{kg}}
      $$

      La variación de entropía, con sus dos términos:

      $$
      s_2 - s_1 = 1{,}0045\,\ln\frac{553}{293} - 0{,}287\,\ln 6
      = 0{,}1238\ \frac{\text{kJ}}{\text{kg}\cdot\text{K}}
      $$

      Y con ella el aumento de exergía de la corriente:

      $$
      \psi_2-\psi_1 = (h_2-h_1) - T_0\,(s_2-s_1)
      = 261{,}2 - 293\cdot 0{,}1238 = 224{,}9\ \frac{\text{kJ}}{\text{kg}}
      $$
      $$
      \eta_{ex} = \frac{224{,}9}{261{,}2} = 0{,}861
      $$

      **b) La exergía destruida.** Al ser adiabático, la entropía generada es
      la variación entera, y Guy-Stodola la convierte en exergía:

      $$
      ex_D = T_0\,s_{gen} = 293\cdot 0{,}1238 = 36{,}3\ \frac{\text{kJ}}{\text{kg}}
      $$

      Y cuadra por los dos caminos: $261{,}2 - 224{,}9 = 36{,}3$.

      **Lo que hay que llevarse, y es la razón de este ejercicio.** El
      rendimiento exergético y el isentrópico **no son el mismo número y no
      miden lo mismo**. Aquí salen 0,861 y 0,753.

      El isentrópico compara este compresor con otro que llegara a 6 bar
      partiendo del mismo estado, y castiga que el aire salga más caliente de
      lo necesario. El exergético no compara con ninguna máquina: mira cuánto
      del trabajo pagado sigue estando disponible en el aire tal como sale, a
      553 K y 6 bar — y ese aire caliente, aunque sea un fastidio para el
      compresor, **tiene exergía**. Por eso el exergético sale más alto.

      Cuál usar lo decide el enunciado. Cuando pregunta «rendimiento
      exergético» está pidiendo el segundo, y responder con el primero es un
      cero con la cuenta bien hecha.
  - id: ejter-la-tuberia-que-pierde-calor-y-lo-que-cuesta
    titulo: La tubería que pierde calor, y lo que eso cuesta en trabajo
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Una tubería de vapor atraviesa una nave. Su superficie exterior se
      mantiene a $150\ ^\circ\text{C}$ y cede al aire de la nave, que está a
      $20\ ^\circ\text{C}$, un flujo de calor de $30\ \text{kW}$.

      El ambiente de referencia es ese mismo aire, $T_0 = 20\ ^\circ\text{C}$.
    pide: La entropía generada por la transmisión y la potencia perdida.
    pasos:
      - tipo: reconocer
        pregunta: |
          El calor sale de la tubería y entra en el aire. ¿Dónde se genera
          entropía en este proceso?
        opciones:
          - texto: En el salto de temperatura entre la superficie y el aire
            correcta: true
            mensaje: |
              Eso es. Transmitir calor a través de una diferencia finita de
              temperatura es irreversible, y ahí es donde se genera. El
              volumen de control que hay que tomar incluye el salto entero.
          - texto: Dentro de la tubería, porque el vapor se enfría
            mensaje: |
              El vapor cediendo calor a temperatura casi constante no genera
              entropía por sí solo. Lo irreversible es el salto de 150 a 20,
              no lo que pase antes.
          - texto: En ningún sitio, porque el calor se conserva
            mensaje: |
              El calor se conserva —es el primer principio— y aun así la
              entropía crece. Son dos balances distintos, y el segundo es el
              que dice qué se ha estropeado.
          - texto: En el aire de la nave, que se calienta
            mensaje: |
              El aire recibe entropía, sí, pero recibe más de la que pierde la
              tubería. La diferencia entre las dos es lo generado, y no vive
              en uno de los dos lados sino en el salto.

      - tipo: calcular
        titulo: La entropía generada
        pregunta: |
          Con la superficie a $423{,}15\ \text{K}$ y el aire a
          $293{,}15\ \text{K}$, ¿cuánta entropía se genera por segundo?
        respuesta:
          tipo: magnitud
          valor: '0.03144 kW/K'
          tolerancia: 0.02
          formato: en kW/K, con tres cifras
        distractores:
          - valor: '0.070897 kW/K'
            mensaje: |
              Eso es solo $\dot{Q}/T_s$, lo que la tubería pierde. Falta
              restarlo de lo que el aire gana, que es más porque está más
              frío.
          - valor: '-0.03144 kW/K'
            mensaje: |
              Los signos al revés. La entropía generada nunca es negativa: se
              resta lo que sale de lo que entra, no al contrario.
        pista: |
          $\dot{S}_{gen} = \dfrac{\dot{Q}}{T_0} - \dfrac{\dot{Q}}{T_s}$.
        desarrollo: |
          $$
          \dot{S}_{gen} = \frac{30}{293{,}15} - \frac{30}{423{,}15}
          = 0{,}102337 - 0{,}070897 = 0{,}031440\ \text{kW/K}
          $$

      - tipo: calcular
        titulo: La potencia perdida
        pregunta: |
          Por Guy-Stodola, ¿cuánta potencia se está destruyendo?
        respuesta:
          tipo: magnitud
          valor: '9.217 kW'
          tolerancia: 0.02
          formato: en kW, con tres cifras
        distractores:
          - valor: '30 kW'
            mensaje: |
              Esos son los 30 kW de calor, no su exergía. El calor que sale a
              150 grados todavía vale algo; lo que se destruye es esa parte,
              no el calor entero.
          - valor: '20.78 kW'
            mensaje: |
              Has multiplicado por la temperatura de la superficie. En
              Guy-Stodola el factor es siempre la del **ambiente**, porque es
              contra él contra el que se mide lo que se podría haber sacado.
        pista: |
          $\dot{B}_D = T_0 \dot{S}_{gen}$, con $T_0$ en kelvin.
        desarrollo: |
          $$
          \dot{B}_D = 293{,}15 \cdot 0{,}031440 = 9{,}217\ \text{kW}
          $$

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: 'La exergía del calor a 423,15 K vale $\dot{Q}\left(1-\frac{T_0}{T_s}\right) = 9{,}217$ kW, exactamente lo destruido.'
          - texto: 'Coincide porque el calor acaba en el ambiente, y allí su exergía es cero: se destruye toda.'
          - texto: Se destruyen 30 kW, que es todo el calor que la tubería pierde.
            trampa: true
            mensaje: |
              Lo que se pierde son 30 kW de **energía** y 9,22 kW de
              **exergía**. Confundirlos es el error que este ejercicio existe
              para evitar: aislar la tubería ahorra energía, pero lo que
              recupera de trabajo es la cifra pequeña.
    resolucion: |
      **Dónde está la irreversibilidad.** El calor sale de la superficie a
      423,15 K y entra en el aire a 293,15 K. El primer principio dice que los
      30 kW se conservan; el segundo dice que en el camino se ha estropeado
      algo, y lo mide contando entropía a los dos lados.

      **La entropía generada.** La tubería pierde $30/423{,}15 = 0{,}070897$
      kW/K y el aire gana $30/293{,}15 = 0{,}102337$ kW/K. El aire gana más
      porque está más frío: la misma energía vale más entropía cuanto menor es
      la temperatura a la que se entrega. La diferencia,
      $0{,}031440$ kW/K, es lo generado.

      **Lo que cuesta.** Guy-Stodola lo convierte en potencia:
      $\dot{B}_D = T_0\dot{S}_{gen} = 293{,}15 \cdot 0{,}031440 = 9{,}217$ kW.

      **La comprobación que conviene hacer siempre.** La exergía que llevaban
      esos 30 kW al salir de la tubería es
      $30\left(1 - 293{,}15/423{,}15\right) = 9{,}217$ kW. Sale lo mismo, y no
      es casualidad: como el calor termina en el ambiente, donde su exergía es
      nula, se destruye toda la que traía. Cuando el calor acaba en algún
      sitio útil los dos números ya no coinciden, y entonces la diferencia es
      justo lo aprovechado.

      **Y la lectura de ingeniería.** Aislar esa tubería ahorra 30 kW de
      energía, pero solo recupera 9,22 kW de capacidad de producir trabajo. Es
      la cifra pequeña la que hay que comparar contra el coste del aislante.

  - id: ejter-el-bloque-de-acero-que-se-enfria-solo
    titulo: El bloque de acero que se enfría solo, por los dos caminos
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Un bloque de acero de $50\ \text{kg}$, con calor específico
      $c = 0{,}45\ \text{kJ/(kg}\cdot\text{K)}$, sale de un horno a
      $500\ \text{K}$ y se deja enfriar al aire hasta ponerse a la temperatura
      ambiente, $T_0 = 300\ \text{K}$.

      No se recoge nada de ese calor: se va al aire tal cual.
    pide: La exergía destruida, calculada de las dos maneras.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de calcular: ¿qué distingue este proceso de uno reversible?
        opciones:
          - texto: Que el bloque se enfría contra el ambiente sin producir trabajo
            correcta: true
            mensaje: |
              Exacto. El bloque tenía capacidad de producir trabajo por estar
              caliente, y se ha gastado entera en calentar un poco el aire.
              Una máquina entre el bloque y el ambiente habría sacado algo.
          - texto: Que el acero cambia de fase
            mensaje: |
              No hay cambio de fase: es un sólido que baja de temperatura, y
              por eso basta con $mc\,\Delta T$ y $mc\ln(T_2/T_1)$.
          - texto: Que el calor específico no es constante
            mensaje: |
              El enunciado lo da constante, y esa no es la irreversibilidad.
              Aunque variase, el proceso seguiría siendo irreversible por
              donde lo es: el salto de temperatura contra el ambiente.
          - texto: Que la entropía del bloque disminuye
            mensaje: |
              Disminuye, y eso no tiene nada de raro: es un sistema cerrado
              que cede calor. Lo que no puede disminuir es la del bloque más
              la del ambiente juntos.

      - tipo: calcular
        titulo: La entropía generada
        pregunta: |
          Sumando la del bloque y la del ambiente, ¿cuánta entropía se genera?
        respuesta:
          tipo: magnitud
          valor: '3.506 kJ/K'
          tolerancia: 0.02
          formato: en kJ/K, con tres cifras
        distractores:
          - valor: '11.494 kJ/K'
            mensaje: |
              Ese es el valor absoluto de la variación del bloque. Falta
              sumarle la del ambiente, que es positiva y mayor: $+15$ kJ/K.
          - valor: '15 kJ/K'
            mensaje: |
              Esa es solo la del ambiente, $Q/T_0$. El bloque pierde 11,494 y
              hay que restarlos.
        pista: |
          $\Delta S_{bloque} = mc\ln(T_0/T_1)$ y $\Delta S_{amb} = Q/T_0$, con
          $Q = mc(T_1-T_0)$.
        desarrollo: |
          $$
          Q = 50 \cdot 0{,}45 \cdot (500-300) = 4500\ \text{kJ}
          $$

          $$
          \Delta S_{bloque} = 22{,}5\ln\frac{300}{500} = -11{,}494\ \text{kJ/K}
          \qquad
          \Delta S_{amb} = \frac{4500}{300} = 15\ \text{kJ/K}
          $$

          $$
          S_{gen} = 15 - 11{,}494 = 3{,}506\ \text{kJ/K}
          $$

      - tipo: calcular
        titulo: La exergía destruida
        pregunta: |
          ¿Cuánta exergía se ha destruido?
        respuesta:
          tipo: magnitud
          valor: '1052 kJ'
          tolerancia: 0.02
          formato: en kJ, redondeada
        distractores:
          - valor: '4500 kJ'
            mensaje: |
              Esos son los 4500 kJ de calor que se han ido al aire. Solo una
              parte de ellos era capacidad de producir trabajo; el resto no se
              podía aprovechar de ninguna manera.
          - valor: '3448 kJ'
            mensaje: |
              Ese es el término $T_0\Delta S_{bloque}$ suelto. La exergía
              destruida es $T_0 S_{gen}$, con la entropía **generada**, no con
              la del bloque.
        pista: |
          $B_D = T_0 S_{gen}$.
        desarrollo: |
          $$
          B_D = 300 \cdot 3{,}506 = 1052\ \text{kJ}
          $$

      - tipo: justificar
        pregunta: Ordena la comprobación por el segundo camino. Una pieza es falsa.
        piezas:
          - texto: 'La exergía del bloque baja $\Delta B = \Delta U - T_0\Delta S = -4500 - 300(-11{,}494) = -1052$ kJ.'
          - texto: 'Como no se recoge trabajo y el calor acaba en el ambiente, esos 1052 kJ no van a ninguna parte: se destruyen.'
          - texto: Los dos caminos dan distinto porque el balance de exergía incluye el trabajo y Guy-Stodola no.
            trampa: true
            mensaje: |
              Dan exactamente lo mismo, y esa es la comprobación. Guy-Stodola
              y el balance de exergía son la misma ecuación escrita de dos
              maneras; si te salen distintos, hay un error de signo en alguno
              de los dos.
    resolucion: |
      **Por qué hay dos caminos.** El curso enseña la exergía destruida de dos
      formas y los exámenes de 2024-2025 piden las dos por separado, puntuando
      cada una. Conviene hacerlas siempre las dos: la segunda no es trabajo
      extra, es la comprobación de la primera.

      **Camino 1 · Guy-Stodola.** El bloque cede
      $Q = mc(T_1-T_0) = 50 \cdot 0{,}45 \cdot 200 = 4500$ kJ. Su entropía baja
      $mc\ln(T_0/T_1) = 22{,}5\ln 0{,}6 = -11{,}494$ kJ/K, y la del ambiente
      sube $4500/300 = 15$ kJ/K, porque lo recibe entero a 300 K. Generada:
      $3{,}506$ kJ/K. Y $B_D = T_0 S_{gen} = 300 \cdot 3{,}506 = 1052$ kJ.

      **Camino 2 · el balance de exergía.** La exergía de un sistema cerrado
      cambia en $\Delta B = \Delta U - T_0\Delta S$ —los términos de presión no
      entran porque el volumen del sólido no cambia—. Aquí
      $\Delta U = -4500$ kJ y $T_0\Delta S = 300 \cdot (-11{,}494) = -3448$ kJ,
      así que $\Delta B = -4500 + 3448 = -1052$ kJ. El bloque ha perdido 1052
      kJ de exergía; como no se ha recogido ningún trabajo y el calor termina
      en el ambiente, donde no vale nada, esos 1052 kJ se han destruido.

      **Los dos dan 1052 kJ**, que es lo que había que ver.

      **Lo que enseña la comparación.** De los 4500 kJ de energía que el bloque
      soltó, solo 1052 —el 23 %— eran capacidad de producir trabajo. Una
      máquina térmica perfecta entre el bloque y el ambiente habría sacado
      exactamente esos 1052 kJ y ni uno más. El resto no se ha desperdiciado:
      nunca fue aprovechable.

  - id: ejter-col71-la-compresion-politropica-que-destruye-fuera
    titulo: La compresión politrópica, que no destruye nada dentro y sí fuera
    fuente: >-
      Ejercicio 7.1 de las diapositivas del Tema 7, «Análisis exergético» ·
      Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). Las
      diapositivas traen su resolución, y el desarrollo está contrastado contra
      ella. Sus dos resultados, 1,19 y 5,50 kJ, se reproducen; la lámina 21
      escribe γ = 1,4 en el calor específico politrópico, pero el −0,21 que usa
      es el de γ = 1 + R'/cv = 1,396, el coherente con sus datos.
    nivel: practica
    enunciado: |
      Un dispositivo cilindro-pistón contiene $0{,}8\ \text{kg}$ de oxígeno a
      $27\ ^\circ\text{C}$ y $100\ \text{kPa}$. El oxígeno se comprime a la
      mitad de su volumen. La temperatura del ambiente exterior es de
      $25\ ^\circ\text{C}$ y la temperatura de referencia es de
      $15\ ^\circ\text{C}$. Calcúlese la exergía destruida en el universo, si:

      a) la compresión se produce según un proceso con un exponente
      politrópico de 1,3.

      b) si la temperatura al final de la compresión es de
      $107\ ^\circ\text{C}$ y el calor intercambiado es el mismo que el
      obtenido en el apartado anterior

      *Para el oxígeno como gas ideal, la resolución de las diapositivas toma
      $c_v = 0{,}657$ y $R' = 0{,}260\ \text{kJ/(kg·K)}$.*
    pide: La exergía destruida en el universo con la compresión politrópica y con la que acaba a 107 °C con el mismo calor.
    pasos:
      - tipo: reconocer
        pregunta: |
          En a) la compresión es politrópica, un proceso internamente
          reversible: dentro del oxígeno no se genera entropía. ¿Dónde se
          destruye exergía, entonces?
        opciones:
          - texto: >-
              En el paso del calor del gas, que está entre 300 y 369 K, al
              ambiente, que está a 298 K: es transmitir calor a través de una
              diferencia finita de temperaturas
            correcta: true
            mensaje: |
              Eso es. El gas es reversible por dentro, pero el **universo**
              —gas más ambiente— no: el calor cae de la temperatura del gas a
              la del ambiente sin pasar por ninguna máquina, y esa caída es la
              irreversibilidad. En b) se le suma otra, dentro del propio gas.
          - texto: En ningún sitio, porque un proceso politrópico es reversible
            mensaje: |
              Reversible **por dentro**, que no es lo mismo. El enunciado pide
              la exergía destruida en el universo, y el universo incluye el
              paso del calor al ambiente a través de un salto de temperatura.
              Las diapositivas lo plantean justo así: el gas no destruye nada,
              el universo sí.
          - texto: En el ambiente, que recibe el calor a 25 °C y no a 15 °C
            mensaje: |
              Que la referencia sea 15 °C no destruye nada: solo fija contra qué
              se mide. De hecho el calor llega al ambiente todavía con algo de
              exergía, 0,39 kJ, precisamente porque 25 °C está por encima de la
              referencia.
          - texto: En la compresión misma, porque el gas se calienta
            mensaje: |
              Calentarse al comprimir no es irreversible: un gas comprimido de
              forma reversible y adiabática también se calienta. Lo que genera
              entropía aquí no es que el gas suba de temperatura, es que el
              calor que cede cae al ambiente a través de un salto.

      - tipo: calcular
        titulo: La temperatura al final de la compresión politrópica
        pregunta: |
          Con $n = 1{,}3$ y el volumen reducido a la mitad, ¿a qué temperatura
          acaba el oxígeno en el apartado a)?
        respuesta:
          tipo: magnitud
          valor: '369.3 K'
          tolerancia: 0.005
          formato: una temperatura, con su unidad
        distractores:
          - valor: '738.7 K'
            mensaje: |
              Has elevado la relación de volúmenes a $n$ en vez de a $n-1$. En
              la politrópica lo que se conserva es $T\,v^{\,n-1}$, así que
              $T_2/T_1 = (v_1/v_2)^{n-1} = 2^{0{,}3}$.
          - valor: '352.0 K'
            mensaje: |
              Has usado el exponente $(n-1)/n$, que es el de la relación de
              **presiones**, con la relación de volúmenes. Con volúmenes el
              exponente es $n-1$; el otro necesita $P_2/P_1$, que aquí no es
              igual a 2.
          - valor: '243.7 K'
            mensaje: |
              Has puesto la relación de volúmenes al revés,
              $(v_2/v_1)^{n-1} = 0{,}5^{0{,}3}$: eso enfriaría el gas al
              comprimirlo. $v_1/v_2 = 2$, porque el volumen final es la mitad.
        pista: |
          En una politrópica se conserva $T\,v^{\,n-1}$:
          $T_2 = T_1\,(v_1/v_2)^{n-1}$, con la temperatura en kelvin.
        desarrollo: |
          $$
          T_2 = 300\cdot 2^{0{,}3} = 369{,}34\ \text{K}
          $$

          Unos 96 °C: el gas acaba más caliente que el ambiente, y por eso el
          calor va del gas hacia fuera.

      - tipo: calcular
        titulo: El calor que cede el gas
        pregunta: |
          ¿Cuánto calor intercambia el oxígeno en la compresión politrópica,
          con su signo?
        respuesta:
          tipo: magnitud
          valor: '-11.63 kJ'
          tolerancia: 0.02
          formato: un calor con su signo y su unidad
        distractores:
          - valor: '11.63 kJ'
            mensaje: |
              El módulo está bien y el signo no. Con el convenio del curso, el
              calor que **sale** del sistema es negativo, y aquí sale: la
              energía interna del gas sube 36,45 kJ y recibe 48,08 de trabajo.
          - valor: '-12.15 kJ'
            mensaje: |
              Has usado $c_n = c_v\,(n-\gamma)/(n-1)$ con $\gamma = 1{,}4$, el
              valor que escribe la diapositiva. Con $c_v = 0{,}657$ y
              $R' = 0{,}260$, el $\gamma$ coherente es $1 + R'/c_v = 1{,}396$, y
              con él $c_n = -0{,}2097$. Parece un redondeo, pero en la exergía
              destruida pesa mucho.
          - valor: '-48.08 kJ'
            mensaje: |
              Ese es el **trabajo** de la compresión,
              $W = m\,R'\,(T_2-T_1)/(1-n)$. El calor sale del primer principio,
              $Q = \Delta U + W$, y la energía interna sube 36,45 kJ.
        pista: |
          El trabajo politrópico es $W = m\,R'\,(T_2-T_1)/(1-n)$, y el calor
          sale del primer principio: $Q = m\,c_v\,(T_2-T_1) + W$.
        desarrollo: |
          $$
          W = \frac{0{,}8\cdot 0{,}260\cdot(369{,}34-300)}{1-1{,}3} = -48{,}08\ \text{kJ}
          $$

          $$
          Q = 0{,}8\cdot 0{,}657\cdot 69{,}34 + (-48{,}08) = 36{,}45 - 48{,}08 = -11{,}63\ \text{kJ}
          $$

          Es lo mismo que $Q = m\,c_n\,(T_2-T_1)$ con el calor específico
          politrópico $c_n = 0{,}657 - 0{,}260/0{,}3 = -0{,}2097$: negativo,
          porque el gas se calienta **mientras** cede calor.

      - tipo: calcular
        titulo: La exergía destruida en el universo, en a)
        pregunta: |
          El gas cambia su entropía en
          $\Delta S = m\,(c_v\ln(T_2/T_1) + R'\ln(v_2/v_1))$ y el ambiente
          recibe el calor a 298 K. ¿Cuánta exergía se destruye en el universo?
        respuesta:
          tipo: magnitud
          valor: '1.196 kJ'
          tolerancia: 0.025
          formato: una energía, con su unidad
        distractores:
          - valor: '1.59 kJ'
            mensaje: |
              Has llevado el calor hasta la temperatura de referencia, 288 K,
              como si el ambiente estuviera a 15 °C. Eso es dar por destruida
              **toda** la exergía del calor al salir del gas. El ambiente está a
              25 °C y recibe el calor todavía con 0,39 kJ de exergía, que no se
              destruyen.
          - valor: '1.24 kJ'
            mensaje: |
              Has multiplicado la entropía generada por la temperatura del
              **ambiente**, 298 K. En Guy-Stodola va la de **referencia**,
              $T_0 = 288\ \text{K}$, que es contra la que se mide la exergía. El
              enunciado da las dos a propósito.
          - valor: '0 kJ'
            mensaje: |
              Cero sería si el universo fuera reversible, y no lo es. El gas no
              genera entropía por dentro, pero el calor que cede cae de su
              temperatura a la del ambiente sin pasar por ninguna máquina, y
              eso genera $S_G = \Delta S_{gas} + |Q|/T_{amb} > 0$.
        pista: |
          $S_G = \Delta S_{gas} - Q/T_{amb}$, con $Q$ el calor del gas
          (negativo) y $T_{amb} = 298\ \text{K}$; y $Ex_D = T_0\,S_G$ con
          $T_0 = 288\ \text{K}$.
        desarrollo: |
          $$
          \Delta S_{gas} = 0{,}8\left(0{,}657\ln\frac{369{,}34}{300} + 0{,}260\ln\frac{1}{2}\right) = -0{,}03488\ \text{kJ/K}
          $$

          $$
          S_G = -0{,}03488 + \frac{11{,}63}{298} = 0{,}00415\ \text{kJ/K}
          $$

          $$
          Ex_D = 288\cdot 0{,}00415 = 1{,}20\ \text{kJ}
          $$

          Las diapositivas dan 1,19: son los mismos números, redondeados de
          otra manera.

      - tipo: calcular
        titulo: La exergía destruida en el universo, en b)
        pregunta: |
          En b) el gas acaba a 380 K con el mismo volumen final y el mismo
          calor, $-11{,}63\ \text{kJ}$. ¿Cuánta exergía se destruye ahora en el
          universo?
        respuesta:
          tipo: magnitud
          valor: '5.50 kJ'
          tolerancia: 0.02
          formato: una energía, con su unidad
        distractores:
          - valor: '4.11 kJ'
            mensaje: |
              Esa es solo la del **gas**: la entropía que genera por dentro,
              con el calor saliendo a su temperatura media, 340 K. Es la
              irreversibilidad nueva de este apartado, pero el enunciado pide
              la del universo, y hay que sumarle la de la caída del calor de
              340 a 298 K, otros 1,39 kJ.
          - valor: '1.39 kJ'
            mensaje: |
              Esa es solo la del paso del calor al ambiente, la misma clase de
              irreversibilidad que en a). En b) hay otra, dentro del gas:
              acaba a 380 K y no a 369 con el mismo calor y el mismo volumen, y
              eso cuesta 4,11 kJ más.
          - valor: '5.89 kJ'
            mensaje: |
              Has llevado el calor hasta 288 K, como si el ambiente estuviera a
              la temperatura de referencia. Está a 25 °C: con 298 K en el
              balance de entropía salen 5,50 kJ.
        pista: |
          Lo mismo que en a), con $T_2 = 380\ \text{K}$: la entropía del gas
          baja menos, porque acaba más caliente, y el ambiente recibe los
          mismos 11,63 kJ.
        desarrollo: |
          $$
          \Delta S_{gas} = 0{,}8\left(0{,}657\ln\frac{380}{300} + 0{,}260\ln\frac{1}{2}\right) = -0{,}01993\ \text{kJ/K}
          $$

          $$
          S_G = -0{,}01993 + \frac{11{,}63}{298} = 0{,}01910\ \text{kJ/K}
          $$

          $$
          Ex_D = 288\cdot 0{,}01910 = 5{,}50\ \text{kJ}
          $$

          Casi cinco veces más que en a), con el mismo calor. La diferencia
          no está en el ambiente: está **dentro** del gas.

      - tipo: justificar
        pregunta: Ordena la lectura de los dos apartados. Una pieza es falsa.
        piezas:
          - texto: >-
              En a) el gas no genera entropía: toda la destrucción es la caída
              del calor de la temperatura del gas a los 298 K del ambiente,
              1,2 kJ.
          - texto: >-
              En b) el gas acaba más caliente con el mismo calor y el mismo
              volumen, así que ha recibido más trabajo: 53,68 kJ frente a
              48,08.
          - texto: >-
              Ese trabajo de más se disipa dentro del gas, 4,11 kJ destruidos,
              y la caída del calor añade otros 1,39: en total, 5,50 kJ.
          - texto: >-
              En b) se destruye más porque el gas cede más calor al ambiente.
            trampa: true
            mensaje: |
              Cede **el mismo**: el enunciado lo fija, 11,63 kJ en los dos
              apartados. Lo que cambia es el camino. En a) el gas llega a 369 K
              por un proceso reversible; en b) llega a 380 K con el mismo calor
              y el mismo volumen, y la única forma es que el pistón haya
              empujado con más trabajo, 53,68 kJ en vez de 48,08. Ese trabajo de
              más se disipa dentro del gas, y esa es la irreversibilidad nueva.
    resolucion: |
      **La idea.** La compresión de a) es politrópica, un proceso
      internamente reversible: el oxígeno no genera entropía. Pero el
      enunciado pide la exergía destruida **en el universo**, y el calor que
      cede el gas cae hasta el ambiente, a 25 °C, a través de un salto de
      temperatura. Esa caída es irreversible. En b) se añade otra
      irreversibilidad, dentro del gas.

      **Los datos.** $T_1 = 300\ \text{K}$, $T_{amb} = 298\ \text{K}$ y
      $T_0 = 288\ \text{K}$, con 273 como las diapositivas. Oxígeno:
      $c_v = 0{,}657$ y $R' = 0{,}260\ \text{kJ/(kg·K)}$, así que
      $\gamma = 1 + R'/c_v = 1{,}396$.

      **a) El estado final y el calor.**

      $$
      T_2 = 300\cdot 2^{0{,}3} = 369{,}34\ \text{K}
      $$

      $$
      W = \frac{0{,}8\cdot 0{,}260\cdot(369{,}34-300)}{1-1{,}3} = -48{,}08\ \text{kJ}
      \qquad
      \Delta U = 0{,}8\cdot 0{,}657\cdot 69{,}34 = 36{,}45\ \text{kJ}
      $$

      $$
      Q = 36{,}45 - 48{,}08 = -11{,}63\ \text{kJ}
      $$

      **a) La exergía destruida, por Guy-Stodola.** La entropía del gas
      baja, y la del ambiente sube lo que recibe:

      $$
      \Delta S_{gas} = 0{,}8\left(0{,}657\ln\frac{369{,}34}{300} + 0{,}260\ln\frac{1}{2}\right) = -0{,}03488\ \text{kJ/K}
      $$

      $$
      S_G = -0{,}03488 + \frac{11{,}63}{298} = 0{,}00415\ \text{kJ/K}
      \qquad
      Ex_D = 288\cdot 0{,}00415 = 1{,}20\ \text{kJ}
      $$

      **Y por el balance de exergía**, que es el camino de las diapositivas.
      La presión de referencia no la da el enunciado; las diapositivas toman
      $P_0 = 100\ \text{kPa}$, y en la exergía destruida no influye, porque el
      $P_0\,\Delta V$ del gas y el del ambiente se anulan. Con
      $V_1 = 0{,}624\ \text{m}^{3}$ y $\Delta V = -0{,}312\ \text{m}^{3}$:

      $$
      \Delta Ex_{gas} = 36{,}45 + 100\cdot(-0{,}312) - 288\cdot(-0{,}03488) = 15{,}29\ \text{kJ}
      $$

      $$
      \Delta Ex_{amb} = \left(1-\frac{288}{298}\right)\cdot 11{,}63 - (48{,}08 - 100\cdot 0{,}312) = 0{,}39 - 16{,}88 = -16{,}49\ \text{kJ}
      $$

      $$
      \Delta Ex_{univ} = 15{,}29 - 16{,}49 = -1{,}20\ \text{kJ}
      $$

      Así que $Ex_D = 1{,}20\ \text{kJ}$. Las diapositivas dan 1,19: los mismos
      números, redondeados de otra manera.

      **b) El mismo calor y 380 K.** Con el volumen final y el calor fijados,
      el trabajo sale del primer principio:

      $$
      W = -11{,}63 - 0{,}8\cdot 0{,}657\cdot 80 = -53{,}68\ \text{kJ}
      $$

      $$
      \Delta S_{gas} = 0{,}8\left(0{,}657\ln\frac{380}{300} + 0{,}260\ln\frac{1}{2}\right) = -0{,}01993\ \text{kJ/K}
      $$

      $$
      S_G = -0{,}01993 + \frac{11{,}63}{298} = 0{,}01910\ \text{kJ/K}
      \qquad
      Ex_D = 288\cdot 0{,}01910 = 5{,}50\ \text{kJ}
      $$

      **De dónde sale la diferencia.** Las diapositivas la parten en dos, y es
      la lectura que enseña. El gas, con el calor saliendo a su temperatura
      media, $T_m = (300+380)/2 = 340\ \text{K}$, genera por dentro

      $$
      S_{G,gas} = -0{,}01993 + \frac{11{,}63}{340} = 0{,}01428\ \text{kJ/K}
      \qquad
      288\cdot 0{,}01428 = 4{,}11\ \text{kJ}
      $$

      y la caída del calor de 340 a 298 K destruye

      $$
      \left(1-\frac{288}{340}\right)\cdot 11{,}63 - \left(1-\frac{288}{298}\right)\cdot 11{,}63 = 1{,}78 - 0{,}39 = 1{,}39\ \text{kJ}
      $$

      Y $4{,}11 + 1{,}39 = 5{,}50$: cuadra.

      **Lo que hay que llevarse.** Tres cosas.

      1. **Reversible por dentro no es reversible en el universo.** La
         politrópica no genera entropía en el gas, pero su calor cae al
         ambiente a través de un salto de temperatura, y eso destruye 1,2 kJ.
      2. **El ambiente y la referencia son dos temperaturas distintas, y cada
         una tiene su sitio.** El ambiente, 298 K, es donde acaba el calor y va
         en el balance de entropía; la referencia, 288 K, va en Guy-Stodola.
      3. **La exergía destruida es una resta de números casi iguales, y los
         redondeos se notan.** La lámina 21 escribe $\gamma = 1{,}4$ en el
         calor específico politrópico; con ese valor el calor saldría
         $-12{,}15\ \text{kJ}$ y la exergía destruida en a), 1,70 kJ en vez de
         1,20. El coherente con $c_v = 0{,}657$ y $R' = 0{,}260$ es 1,396, y es
         el que da el $-0{,}21$ que usa la propia diapositiva.

  - id: ejter-col72-la-resistencia-que-convierte-trabajo-en-calor-tibio
    titulo: La resistencia eléctrica, que convierte trabajo en calor tibio
    fuente: >-
      Ejercicio 7.2 de las diapositivas del Tema 7, «Análisis exergético» ·
      Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). Las
      diapositivas traen su resolución, y el desarrollo está contrastado contra
      ella. Sus tres resultados, 106,4 °C, 28,01 kJ y 13,54 %, se reproducen.
    nivel: practica
    enunciado: |
      Una resistencia eléctrica de 30 ohmios recibe una corriente de 6
      amperios durante 30 segundos. La masa de la resistencia es de 0,1
      libras, su calor específico es de $0{,}2\ \text{BTU/lb·R}$ y su
      temperatura inicial es de $70\ ^\circ\text{F}$.

      Calcúlese la temperatura final de la resistencia, la exergía destruida
      en el proceso y el rendimiento exergético del proceso si, durante los
      primeros 30 segundos, el 90 % de la potencia eléctrica consumida por la
      resistencia se disipa en forma de calor. Considérese
      $18\ ^\circ\text{C}$ y $1\ \text{bar}$ como condiciones de referencia.

      *La resolución de las diapositivas convierte con 1 lb = 0,4536 kg,
      1 BTU = 1,055 kJ y 1 K = 1,8 R.*
    pide: La temperatura final, la exergía destruida en la resistencia y su rendimiento exergético.
    pasos:
      - tipo: reconocer
        pregunta: |
          La resistencia recibe 32,4 kJ de trabajo eléctrico y suelta el 90 %
          como calor. ¿Por qué destruye tanta exergía, si la energía se
          conserva?
        opciones:
          - texto: >-
              Porque recibe trabajo, que es exergía pura, y lo convierte en
              energía interna y en calor a poco más de 60 °C, que valen muy
              poco trabajo
            correcta: true
            mensaje: |
              Eso es. No se pierde un julio, pero el trabajo eléctrico podía
              convertirse entero en cualquier otra cosa y el calor tibio no: a
              64 °C de media, de cada kilojulio de calor solo se sacarían unos
              0,14 de trabajo. Esa degradación es lo que se destruye.
          - texto: Porque el 90 % de la energía se pierde en forma de calor
            mensaje: |
              Esa energía no se pierde: sale como calor y sigue existiendo. Lo
              que se pierde es su **calidad**. Si ese calor saliera a 1000 °C
              valdría casi tanto como el trabajo; sale a poco más de 60 °C, y
              por eso vale tan poco.
          - texto: Porque la resistencia se calienta 85 grados
            mensaje: |
              Calentarse no destruye exergía por sí mismo: la resistencia
              caliente **tiene** exergía, 0,43 kJ, que ha ganado. Lo que
              destruye es convertir trabajo en ese calentamiento y en calor a
              baja temperatura.
          - texto: Porque la corriente es muy alta para una resistencia tan pequeña
            mensaje: |
              La corriente fija cuánta energía entra, $I^{2}Rt$, no qué fracción
              se destruye. Con la mitad de corriente entraría la cuarta parte
              de energía y se seguiría destruyendo casi toda: el problema es la
              conversión, no la cantidad.

      - tipo: calcular
        titulo: La temperatura final de la resistencia
        pregunta: |
          Del trabajo eléctrico, $I^{2}Rt = 32{,}4\ \text{kJ}$, el 90 % sale
          como calor. ¿A qué temperatura acaba la resistencia?
        respuesta:
          tipo: magnitud
          valor: '106.4 °C'
          tolerancia: 0.005
          formato: una temperatura, con su unidad
        distractores:
          - valor: '874.2 °C'
            mensaje: |
              Has metido en la resistencia los 32,4 kJ enteros. El 90 % sale
              como calor durante esos mismos 30 segundos, así que en ella solo
              se quedan 3,24 kJ.
          - valor: '59.8 °C'
            mensaje: |
              Has tomado la masa como 0,1 kg. Son 0,1 **libras**, 0,04536 kg:
              menos de la mitad de masa, y por eso se calienta más del doble.
          - valor: '155.3 °C'
            mensaje: |
              Has sumado el salto a 70 como si fueran grados Celsius. La
              temperatura inicial es 70 °F, que son 21,1 °C:
              $(70-32)/1{,}8$.
        pista: |
          $\Delta U = W_e - |Q| = 3{,}24\ \text{kJ}$ y $\Delta U = m\,c\,\Delta T$,
          con la masa y el calor específico pasados a kg y a kJ/(kg·K).
        desarrollo: |
          Las conversiones:

          $$
          m = 0{,}1\cdot 0{,}4536 = 0{,}04536\ \text{kg}
          \qquad
          c = 0{,}2\cdot\frac{1{,}055\cdot 1{,}8}{0{,}4536} = 0{,}8373\ \text{kJ/(kg·K)}
          $$

          $$
          \Delta T = \frac{3{,}24}{0{,}04536\cdot 0{,}8373} = 85{,}31\ \text{K}
          $$

          $$
          \theta_1 = \frac{70-32}{1{,}8} = 21{,}11\ ^\circ\text{C}
          \qquad
          \theta_2 = 21{,}11 + 85{,}31 = 106{,}42\ ^\circ\text{C}
          $$

      - tipo: calcular
        titulo: La exergía que gana la resistencia
        pregunta: |
          Con la resistencia como sustancia incompresible y
          $T_0 = 291\ \text{K}$, ¿cuánto aumenta su exergía?
        respuesta:
          tipo: magnitud
          valor: '0.425 kJ'
          tolerancia: 0.03
          formato: una energía, con su unidad
        distractores:
          - valor: '3.24 kJ'
            mensaje: |
              Ese es el aumento de **energía interna**, $m\,c\,\Delta T$. La
              exergía sube menos, porque hay que restarle $T_0\,\Delta S$: la
              mayor parte de ese calentamiento no se podría volver a convertir
              en trabajo.
          - valor: '-14.64 kJ'
            mensaje: |
              Has metido las temperaturas en grados Celsius dentro del
              logaritmo, $\ln(106{,}4/21{,}1)$. La entropía va siempre con
              temperaturas absolutas: $\ln(379{,}4/294{,}1)$. Una exergía que
              **baja** al calentar algo por encima del ambiente es la señal de
              que algo está mal.
        pista: |
          $\Delta Ex = m\left[c\,(T_2-T_1) - T_0\,c\ln(T_2/T_1)\right]$: el
          término de presión no entra, porque el sólido no cambia de volumen.
        desarrollo: |
          $$
          \Delta Ex = 0{,}04536\cdot 0{,}8373\left(85{,}31 - 291\ln\frac{379{,}42}{294{,}11}\right) = 0{,}425\ \text{kJ}
          $$

          De los 3,24 kJ que se han quedado en la resistencia, solo 0,43 son
          exergía: a 106 °C, la mayor parte de esa energía ya no se podría
          volver a convertir en trabajo.

      - tipo: calcular
        titulo: La exergía destruida en la resistencia
        pregunta: |
          Con la frontera en la propia resistencia, el calor sale a su
          temperatura media, $T_m = 336{,}76\ \text{K}$. ¿Cuánta exergía se
          destruye?
        respuesta:
          tipo: magnitud
          valor: '28.01 kJ'
          tolerancia: 0.02
          formato: una energía, con su unidad
        distractores:
          - valor: '31.97 kJ'
            mensaje: |
              Eso es lo destruido en el **universo**: has dejado que el calor se
              enfríe hasta el ambiente, $W_e - \Delta Ex = 32{,}4 - 0{,}425$. La
              resolución pone la frontera en la resistencia y cuenta el calor
              con la exergía que lleva al salir de ella, 3,96 kJ, que ahí dentro
              no se destruye.
          - valor: '25.18 kJ'
            mensaje: |
              Has puesto todo el calor saliendo a la temperatura **final**,
              379 K. Durante los 30 segundos la resistencia pasa de 294 a
              379 K, y el calor sale a todas las temperaturas intermedias; la
              resolución toma la media, 336,76 K.
        pista: |
          Balance de exergía de la resistencia:
          $Ex_D = W_e - \Delta Ex - (1 - T_0/T_m)\,|Q|$.
        desarrollo: |
          $$
          Ex_Q = \left(1-\frac{291}{336{,}76}\right)\cdot 29{,}16 = 3{,}96\ \text{kJ}
          $$

          $$
          Ex_D = 32{,}4 - 0{,}425 - 3{,}96 = 28{,}01\ \text{kJ}
          $$

          Y por Guy-Stodola, que tiene que dar lo mismo:

          $$
          S_G = 0{,}04536\cdot 0{,}8373\ln\frac{379{,}42}{294{,}11} + \frac{29{,}16}{336{,}76} = 0{,}09626\ \text{kJ/K}
          $$

          $$
          Ex_D = 291\cdot 0{,}09626 = 28{,}01\ \text{kJ}
          $$

      - tipo: calcular
        titulo: El rendimiento exergético
        pregunta: |
          Lo que se busca de una resistencia es calentar: la exergía que gana
          y la del calor que entrega. ¿Qué fracción del trabajo eléctrico acaba
          ahí?
        respuesta:
          tipo: numero
          valor: '0.1354'
          tolerancia: 0.005
          formato: una fracción entre 0 y 1
        distractores:
          - valor: '0.9'
            mensaje: |
              Ese es el reparto de la **energía**: el 90 % sale como calor. El
              rendimiento exergético mira cuánto **trabajo** vale lo que sale, y
              29,16 kJ de calor a 64 °C valen 3,96.
          - valor: '0.0131'
            mensaje: |
              Has contado como producto solo lo que gana la resistencia,
              0,425 kJ. El calor que entrega también es producto —calentar es
              para lo que sirve una resistencia—, y lleva 3,96 kJ de exergía.
          - valor: '0.8646'
            mensaje: |
              Esa es la fracción **destruida**, 28,01 entre 32,4. El rendimiento
              es lo que queda: $1 - 0{,}8646$.
        pista: |
          $\eta_{ex} = \dfrac{\Delta Ex + Ex_Q}{W_e}$.
        desarrollo: |
          $$
          \eta_{ex} = \frac{0{,}425 + 3{,}96}{32{,}4} = 0{,}1354
          $$

          El 86,5 % del trabajo eléctrico se destruye.

      - tipo: justificar
        pregunta: Ordena la lectura del resultado. Una pieza es falsa.
        piezas:
          - texto: >-
              El trabajo eléctrico, 32,4 kJ, es exergía pura: se podría
              convertir entero en cualquier otra forma de energía.
          - texto: >-
              La resistencia lo convierte en 3,24 kJ de energía interna, que
              valen 0,43 kJ de exergía, y en 29,16 kJ de calor a 64 °C de
              media, que valen 3,96.
          - texto: >-
              Todo lo demás, 28,01 kJ, se destruye: el rendimiento exergético es
              del 13,5 %.
          - texto: >-
              Como el 90 % de la energía eléctrica sale en forma de calor útil,
              el rendimiento exergético de la resistencia es del 90 %.
            trampa: true
            mensaje: |
              El 90 % es el reparto de la **energía**, y en energía una
              resistencia rinde el 100 %: no se pierde nada. El rendimiento
              exergético mira otra cosa, cuánto trabajo se podría recuperar de
              lo que sale, y 29,16 kJ de calor a 64 °C solo dan 3,96. Por eso
              calentar con una resistencia rinde un 13,5 % aunque no se pierda
              un julio.
    resolucion: |
      **La idea.** La resistencia recibe trabajo eléctrico, que es exergía
      pura, y lo convierte en dos cosas de poco valor: un poco de energía
      interna —se calienta— y calor que sale a poco más de 60 °C. La energía se
      conserva entera; la exergía, no.

      **La temperatura final.** El trabajo eléctrico es $W_e = I^{2}Rt$:

      $$
      W_e = 6^{2}\cdot 30\cdot 30 = 32400\ \text{J} = 32{,}4\ \text{kJ}
      $$

      El 90 % sale como calor, $|Q| = 29{,}16\ \text{kJ}$, y el resto, 3,24 kJ,
      se queda en la resistencia. Con las conversiones de las diapositivas,
      $m = 0{,}04536\ \text{kg}$ y $c = 0{,}8373\ \text{kJ/(kg·K)}$:

      $$
      \Delta T = \frac{3{,}24}{0{,}04536\cdot 0{,}8373} = 85{,}31\ \text{K}
      \qquad
      \theta_2 = 21{,}11 + 85{,}31 = 106{,}42\ ^\circ\text{C}
      $$

      **La exergía que gana la resistencia.** Como sólido incompresible, con
      $T_0 = 291\ \text{K}$ y las temperaturas en kelvin, 294,11 y 379,42:

      $$
      \Delta Ex = 0{,}04536\cdot 0{,}8373\left(85{,}31 - 291\ln\frac{379{,}42}{294{,}11}\right) = 0{,}425\ \text{kJ}
      $$

      **La exergía destruida.** La resolución pone la frontera en la
      resistencia, y el calor sale de ella a su temperatura media,
      $T_m = (294{,}11 + 379{,}42)/2 = 336{,}76\ \text{K}$:

      $$
      Ex_Q = \left(1-\frac{291}{336{,}76}\right)\cdot 29{,}16 = 3{,}96\ \text{kJ}
      $$

      $$
      Ex_D = 32{,}4 - 0{,}425 - 3{,}96 = 28{,}01\ \text{kJ}
      $$

      Por Guy-Stodola sale lo mismo: la entropía generada es la que gana la
      resistencia más la que se lleva el calor,
      $S_G = 0{,}00967 + 29{,}16/336{,}76 = 0{,}09626\ \text{kJ/K}$, y
      $291\cdot 0{,}09626 = 28{,}01\ \text{kJ}$.

      **El rendimiento exergético.** Lo que se busca de una resistencia es
      calentar, así que el producto es la exergía que gana y la del calor que
      entrega:

      $$
      \eta_{ex} = \frac{0{,}425 + 3{,}96}{32{,}4} = 0{,}1354
      $$

      El 13,54 %, lo mismo que las diapositivas.

      **Un aviso sobre la frontera.** Si el sistema fuera el universo, el
      calor acabaría en el ambiente a 291 K y perdería también sus 3,96 kJ: se
      destruirían $32{,}4 - 0{,}425 = 31{,}98\ \text{kJ}$ y el rendimiento
      bajaría al 1,3 %. La resolución contesta con la frontera en la
      resistencia, y así se contesta aquí.

      **Lo que hay que llevarse.** Una resistencia no pierde energía —en
      energía rinde el 100 %— y aun así destruye el 86 % de la exergía que
      recibe. Es la forma más cara de calentar: gasta trabajo, lo más valioso
      que hay, en fabricar calor a 64 °C, que vale casi nada. Por eso una
      bomba de calor, que mueve calor en vez de fabricarlo, calienta lo mismo
      con mucho menos trabajo.

  - id: ejter-col73-difusor-compresor-e-intercambiador-y-donde-se-va-la-exergia
    titulo: Difusor, compresor e intercambiador, y dónde se va la exergía
    fuente: >-
      Ejercicio 7.3 de las diapositivas del Tema 7, «Análisis exergético» ·
      Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). Las
      diapositivas traen su resolución, y el desarrollo está contrastado contra
      ella. La entropía generada en el intercambiador que imprime la lámina 44,
      247,7 W/K, es 242,7: lo dice su propia exergía destruida, 70,63 kW.
    nivel: practica
    enunciado: |
      En un difusor entran $0.5\ \text{kg/s}$ de nitrógeno a
      $180\ \text{m/s}$ y condiciones estándar. El difusor tiene un
      rendimiento interno del 90%. A continuación, el nitrógeno entra a un
      compresor cuya relación de compresión es de 12. La temperatura a la
      salida del compresor es de $425\ ^\circ\text{C}$. Para reducir dicha
      temperatura hasta los $35\ ^\circ\text{C}$, se envía el nitrógeno a un
      intercambiador de calor de aire, alimentado por aire a
      $20\ ^\circ\text{C}$. Si el aire experimenta una variación de
      temperatura de $20\ \text{K}$, calcúlese:

      a) Relación de compresión del difusor

      b) Entropía generada en difusor, compresor e intercambiador de calor

      c) Potencia del compresor

      d) Rendimiento interno del compresor

      e) Gasto de aire necesario en intercambiador

      f) Exergía destruida en difusor, compresor e intercambiador de calor
      (tómese como estado de referencia $1\ \text{atm}$ y
      $18\ ^\circ\text{C}$)

      g) Rendimiento exergético de cada elemento

      h) ¿Qué modificación harías en primer lugar, para mejorar el balance
      exergético de la instalación?

      *La resolución de las diapositivas toma para el nitrógeno
      $c_p = 1{,}034$ y $R' = 0{,}298\ \text{kJ/(kg·K)}$, y para el aire
      $c_p = 1{,}0045$ y $R' = 0{,}287\ \text{kJ/(kg·K)}$; como «condiciones
      estándar», $25\ ^\circ\text{C}$ y $1\ \text{atm}$; la velocidad a la
      salida del difusor, nula; y el intercambiador sin pérdidas de carga, con
      el aire a $1\ \text{atm}$.*
    pide: La relación de compresión del difusor, la potencia y el rendimiento interno del compresor, el gasto de aire, la exergía destruida en el intercambiador y qué cambiar primero.
    pasos:
      - tipo: reconocer
        pregunta: |
          El nitrógeno entra al difusor a 180 m/s y sale casi parado, sin
          trabajo ni calor. ¿De dónde sale la subida de presión?
        opciones:
          - texto: >-
              De la energía cinética: al frenarse, se convierte en entalpía, y
              la parte que se frena sin pérdidas sube la presión
            correcta: true
            mensaje: |
              Eso es. Un difusor es una tobera al revés: cambia velocidad por
              presión. Los 16,2 kJ/kg de energía cinética calientan el
              nitrógeno 15,7 grados, y la presión sube lo que subiría en un
              difusor ideal que se calentara solo el 90 % de eso. Por eso hace
              falta el rendimiento interno para sacar la relación de presiones.
          - texto: Del trabajo que le transmite el compresor aguas abajo
            mensaje: |
              El difusor va antes del compresor y no tiene eje: cada equipo se
              balancea por separado. Lo único que trae el nitrógeno al entrar
              es su velocidad, y de ahí sale todo.
          - texto: Del calor que recibe al frenarse contra las paredes
            mensaje: |
              El difusor se toma adiabático: no entra calor. El nitrógeno se
              calienta, sí, pero con su propia energía cinética, no con calor
              de fuera.
          - texto: De que la sección se estrecha, como en una tobera
            mensaje: |
              Es al revés: un difusor subsónico se **ensancha**. Al ensancharse
              la velocidad baja, y lo que pierde el gas en energía cinética lo
              gana en entalpía y en presión.

      - tipo: calcular
        titulo: La relación de compresión del difusor
        pregunta: |
          Con la velocidad de salida nula, la temperatura real de salida es
          $T_2 = 298 + 180^{2}/(2\cdot 1034) = 313{,}67\ \text{K}$. Con el
          rendimiento interno del 90 %, ¿cuánto vale $P_2/P_1$?
        respuesta:
          tipo: numero
          valor: '1.174'
          tolerancia: 0.008
          formato: una relación de presiones, sin unidad
        distractores:
          - valor: '1.195'
            mensaje: |
              Has metido en la isentrópica la temperatura **real** de salida,
              313,67 K. La presión la fija el difusor ideal, el que se calienta
              solo el 90 % de eso: $T_{2s} = 298 + 0{,}9\cdot 15{,}67 = 312{,}10\ \text{K}$.
          - valor: '1.013'
            mensaje: |
              Has elevado al exponente de las temperaturas, $(\gamma-1)/\gamma$,
              en vez de al de las presiones. Para pasar de una relación de
              temperaturas a una de presiones el exponente es mayor que uno:
              $\beta = (T_{2s}/T_1)^{\gamma/(\gamma-1)}$.
        pista: |
          $T_{2s} = T_1 + \eta_D\,(T_2 - T_1)$ y
          $P_2/P_1 = (T_{2s}/T_1)^{\gamma/(\gamma-1)}$, con
          $\gamma/(\gamma-1) = c_p/R'$.
        desarrollo: |
          $$
          T_{2s} = 298 + 0{,}9\cdot(313{,}67-298) = 312{,}10\ \text{K}
          $$

          $$
          \beta_D = \left(\frac{312{,}10}{298}\right)^{1{,}034/0{,}298} = 1{,}174
          $$

          Con $\gamma = 1{,}4$ redondeado el exponente sería 3,5 y saldría 1,176:
          las dos lecturas valen. La presión de salida,
          $101{,}325\cdot 1{,}174 = 118{,}96\ \text{kPa}$.

      - tipo: calcular
        titulo: La potencia del compresor
        pregunta: |
          El compresor lleva el nitrógeno de 313,67 K a 698 K. ¿Qué potencia
          consume?
        respuesta:
          tipo: magnitud
          valor: '198.7 kW'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '141.4 kW'
            mensaje: |
              Has usado $c_v$. En un volumen de control el trabajo va con la
              **entalpía**, así que el calor específico es
              $c_p = 1{,}034\ \text{kJ/(kg·K)}$.
          - valor: '206.8 kW'
            mensaje: |
              Has empezado la compresión en 298 K, la temperatura de **entrada
              al difusor**. El nitrógeno llega al compresor ya calentado por el
              frenado, a 313,67 K.
          - valor: '397.4 kW'
            mensaje: |
              Eso es el trabajo por **kilogramo**, 397,4 kJ/kg, escrito como
              potencia. Falta multiplicar por el gasto, 0,5 kg/s.
        pista: |
          Adiabático y en régimen estacionario:
          $\dot{W} = \dot{m}\,c_p\,(T_3 - T_2)$.
        desarrollo: |
          $$
          \dot{W}_C = 0{,}5\cdot 1{,}034\cdot(698-313{,}67) = 198{,}7\ \text{kW}
          $$

      - tipo: calcular
        titulo: El rendimiento interno del compresor
        pregunta: |
          El compresor multiplica la presión por 12. ¿Cuál es su rendimiento
          interno?
        respuesta:
          tipo: numero
          valor: '0.854'
          tolerancia: 0.012
          formato: una fracción entre 0 y 1
        distractores:
          - valor: '1.171'
            mensaje: |
              Has puesto el cociente del revés. En un compresor el real consume
              **más** que el ideal, así que el rendimiento es ideal entre real,
              $(T_{3s}-T_2)/(T_3-T_2)$, y sale menor que uno.
          - valor: '0.780'
            mensaje: |
              Has empezado la compresión en 298 K, como si no hubiera difusor.
              El compresor recibe el nitrógeno a 313,67 K, y tanto la
              isentrópica como el salto real parten de ahí.
          - valor: '0.111'
            mensaje: |
              Has metido la temperatura en grados Celsius en la isentrópica,
              $40{,}67\cdot 12^{0{,}288}$. Las relaciones entre $T$ y $P$ de un
              gas ideal van siempre en kelvin.
        pista: |
          $T_{3s} = T_2\,(P_3/P_2)^{(\gamma-1)/\gamma}$ y
          $\eta_s = (T_{3s}-T_2)/(T_3-T_2)$.
        desarrollo: |
          $$
          T_{3s} = 313{,}67\cdot 12^{0{,}298/1{,}034} = 641{,}9\ \text{K}
          $$

          $$
          \eta_{sC} = \frac{641{,}9-313{,}67}{698-313{,}67} = 0{,}854
          $$

          Con $\gamma = 1{,}4$ la isentrópica sale a 638,0 K y el rendimiento,
          0,844; las diapositivas dan 0,8538. Todos caben en la tolerancia.

      - tipo: calcular
        titulo: El gasto de aire del intercambiador
        pregunta: |
          El nitrógeno se enfría de 698 a 308 K cediendo su calor a aire que se
          calienta 20 K. ¿Cuánto aire hace falta?
        respuesta:
          tipo: magnitud
          valor: '10.04 kg/s'
          tolerancia: 0.02
          formato: un gasto másico, con su unidad
        distractores:
          - valor: '14.05 kg/s'
            mensaje: |
              Has usado $c_v$ para el aire. Las dos corrientes atraviesan el
              intercambiador en flujo, y el balance va con entalpías:
              $c_p = 1{,}0045$.
          - valor: '20.07 kg/s'
            mensaje: |
              Has hecho el balance con un kilogramo de nitrógeno, sin
              multiplicar por su gasto. Pasan 0,5 kg/s, así que el calor es la
              mitad, y el aire también.
        pista: |
          Intercambiador adiabático: lo que cede el nitrógeno lo gana el aire,
          $\dot{m}_{N_2}\,c_{p,N_2}\,(T_3-T_4) = \dot{m}_a\,c_{p,a}\,\Delta T_a$.
        desarrollo: |
          $$
          \dot{m}_a = \frac{0{,}5\cdot 1{,}034\cdot(698-308)}{1{,}0045\cdot 20} = \frac{201{,}63}{20{,}09} = 10{,}04\ \text{kg/s}
          $$

          Las diapositivas lo redondean a 10 kg/s. A la entrada son
          $10{,}04\cdot 0{,}287\cdot 293/101{,}325 = 8{,}33\ \text{m}^{3}/\text{s}$.

      - tipo: calcular
        titulo: La exergía destruida en el intercambiador
        pregunta: |
          Con $\dot{m}_a = 10{,}036\ \text{kg/s}$ y la referencia a 291 K,
          ¿cuánta exergía se destruye en el intercambiador?
        respuesta:
          tipo: magnitud
          valor: '70.6 kW'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '78.5 kW'
            mensaje: |
              Esa es toda la exergía que **pierde el nitrógeno** al enfriarse.
              Una parte, 7,9 kW, la gana el aire; lo destruido es la
              diferencia.
          - valor: '201.6 kW'
            mensaje: |
              Ese es el **calor** que pasa de una corriente a otra, y se
              conserva entero. Lo que se destruye es la capacidad de hacer
              trabajo que se pierde por el camino, y se calcula con la
              entropía, no con la energía.
        pista: |
          Guy-Stodola, sin términos de presión porque no hay pérdidas de carga:
          $\dot{S}_G = \dot{m}_{N_2}c_p\ln(T_4/T_3) + \dot{m}_a c_{p,a}\ln(T_i/T_s)$
          y $\dot{E}x_D = T_0\,\dot{S}_G$.
        desarrollo: |
          $$
          \dot{S}_G = 0{,}5\cdot 1{,}034\ln\frac{308}{698} + 10{,}036\cdot 1{,}0045\ln\frac{313}{293} = 0{,}2427\ \text{kW/K}
          $$

          $$
          \dot{E}x_D = 291\cdot 0{,}2427 = 70{,}6\ \text{kW}
          $$

          Por el balance de exergía sale lo mismo: el nitrógeno pierde
          $78{,}55\ \text{kW}$ de exergía y el aire gana 7,91, y
          $78{,}55 - 7{,}91 = 70{,}64$. La lámina 44 imprime 247,7 W/K; con su
          propia exergía destruida, $70{,}63/291 = 0{,}2427\ \text{kW/K}$, son
          242,7.

      - tipo: justificar
        pregunta: Ordena la respuesta a la h). Una pieza es falsa.
        piezas:
          - texto: >-
              Se destruyen 84 kW en total: 0,75 en el difusor, 12,6 en el
              compresor y 70,6 en el intercambiador.
          - texto: >-
              El intercambiador se lleva el 84 % y rinde un 10 %: enfría el
              nitrógeno 390 grados para calentar el aire solo 20.
          - texto: >-
              Lo primero sería aprovechar el calor del nitrógeno a 425 °C en
              algo que lo pida caliente, o comprimir en dos etapas con
              enfriamiento intermedio para que no llegue tan caliente.
          - texto: >-
              Lo primero, el compresor: es el que consume la potencia y su
              rendimiento interno, un 85 %, es el más bajo de la instalación.
            trampa: true
            mensaje: |
              El compresor destruye 12,6 kW y rinde exergéticamente un 93,7 %:
              es el equipo **mejor** aprovechado. Su rendimiento interno mide
              otra cosa, lo lejos que está de una compresión isentrópica. Lo que
              manda para decidir es la exergía destruida en kilovatios, y ahí el
              intercambiador, con 70,6, gana de lejos.
    resolucion: |
      **Los datos.** Nitrógeno: $c_p = 1{,}034$ y $R' = 0{,}298\ \text{kJ/(kg·K)}$;
      aire: $c_p = 1{,}0045$ y $R' = 0{,}287\ \text{kJ/(kg·K)}$. Entrada a
      298 K y 101,325 kPa; referencia, $T_0 = 291\ \text{K}$ y 1 atm. El
      exponente de la isentrópica, $c_p/R'$: es con lo que calculan las
      diapositivas, aunque escriban $\gamma = 1{,}4$.

      **a) El difusor.** Adiabático y sin trabajo: la energía cinética se
      convierte en entalpía.

      $$
      T_2 = 298 + \frac{180^{2}}{2\cdot 1034} = 313{,}67\ \text{K}
      \qquad
      T_{2s} = 298 + 0{,}9\cdot 15{,}67 = 312{,}10\ \text{K}
      $$

      $$
      \beta_D = \left(\frac{312{,}10}{298}\right)^{1{,}034/0{,}298} = 1{,}174
      $$

      Es decir, $P_2 = 118{,}96\ \text{kPa}$.

      **c) y d) El compresor.** Con $P_3 = 12\cdot 118{,}96 = 1427{,}5\ \text{kPa}$:

      $$
      \dot{W}_C = 0{,}5\cdot 1{,}034\cdot(698-313{,}67) = 198{,}7\ \text{kW}
      $$

      $$
      T_{3s} = 313{,}67\cdot 12^{0{,}298/1{,}034} = 641{,}9\ \text{K}
      \qquad
      \eta_{sC} = \frac{641{,}9-313{,}67}{698-313{,}67} = 0{,}854
      $$

      **e) El aire.** $\dot{m}_a = 201{,}63/(1{,}0045\cdot 20) = 10{,}04\ \text{kg/s}$,
      8,33 m³/s a la entrada.

      **b) y f) La entropía generada y la exergía destruida.** Las tres por
      Guy-Stodola, $\dot{E}x_D = T_0\,\dot{S}_G$:

      $$
      \dot{S}_{G,D} = 0{,}5\left(1{,}034\ln\frac{313{,}67}{298} - 0{,}298\ln(1{,}174)\right) = 0{,}00259\ \text{kW/K}
      $$

      $$
      \dot{S}_{G,C} = 0{,}5\left(1{,}034\ln\frac{698}{313{,}67} - 0{,}298\ln(12)\right) = 0{,}0433\ \text{kW/K}
      $$

      $$
      \dot{S}_{G,I} = 0{,}5\cdot 1{,}034\ln\frac{308}{698} + 10{,}036\cdot 1{,}0045\ln\frac{313}{293} = 0{,}2427\ \text{kW/K}
      $$

      **g) Los rendimientos exergéticos.** El del difusor es la exergía de
      flujo que sale entre la que entra, con la energía cinética dentro de la
      de entrada: $14{,}78/16{,}29 = 0{,}907$. El del compresor, lo que gana el
      nitrógeno entre la potencia: $0{,}5\cdot(386{,}98-14{,}78)/198{,}7 = 0{,}937$.
      Y el del intercambiador, lo que gana el aire entre lo que pierde el
      nitrógeno: $7{,}91/78{,}55 = 0{,}101$.

      | | $\dot{S}_G$ (W/K) | $\dot{E}x_D$ (kW) | $\eta_{ex}$ |
      |---|---|---|---|
      | difusor | 2,59 | 0,75 | 90,7 % |
      | compresor | 43,3 | 12,6 | 93,7 % |
      | intercambiador | 242,7 | 70,6 | 10,1 % |

      Coinciden con las diapositivas salvo en la entropía generada del
      intercambiador, que la lámina 44 imprime como 247,7 W/K: con su propia
      exergía destruida, $70{,}63/291$, son 242,7.

      **h) Qué cambiar primero.** Se destruyen 84 kW, y 70,6 son del
      intercambiador: el 84 %. Es también el de peor rendimiento, un 10 %. El
      motivo se ve en el enunciado: el nitrógeno baja de 425 a 35 °C para
      subir el aire de 20 a 40, así que el calor cae cientos de grados de una
      corriente a otra sin producir nada. Las diapositivas no contestan este
      apartado; lo que dicen sus números es que lo primero es no tirar ese
      calor a aire casi frío: aprovecharlo en algo que lo pida caliente, o
      comprimir en dos etapas con enfriamiento intermedio para que el
      nitrógeno no llegue a 425 °C.

      **Lo que hay que llevarse.** Para decidir qué mejorar se mira la
      exergía destruida en kilovatios, no el rendimiento interno: el
      compresor, con el peor rendimiento interno de los dos equipos que lo
      tienen, es el mejor aprovechado de los tres.

  - id: ejter-col78-la-mezcla-que-pierde-calor-y-sale-humeda
    titulo: La mezcla que pierde calor y sale húmeda, y lo poco que se lleva ese calor
    fuente: >-
      Ejercicio 7.8 de las diapositivas del Tema 7, «Análisis exergético», que
      es también el ejercicio de la sesión 4 de TermoLagun, en las prácticas de
      ordenador · Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU). El material publica su resolución, que lee el vapor de entrada
      en el diagrama de Mollier; aquí se resuelve con las tablas y se contrasta
      con ella.
    nivel: practica
    enunciado: |
      Se mezclan $3\ \text{kg/s}$ de agua a $20\ \text{bar}$ y
      $400\ ^\circ\text{C}$, con $0{,}5\ \text{kg/s}$ de agua a
      $30\ ^\circ\text{C}$. Durante la mezcla se disipan $908\ \text{kW}$ de
      calor al exterior que se encuentra a $20\ ^\circ\text{C}$. Calcúlese el
      volumen específico de la mezcla resultante, la exergía destruida en el
      proceso y su rendimiento exergético. Tómese como estado de referencia
      $15\ ^\circ\text{C}$ y $1\ \text{bar}$.

      *Las propiedades del agua, de [las tablas de
      vapor](/road-to-ingenieria/ingenieria-termica/tablas/#sobrecalentado-20).
      Para el agua líquida, como en la resolución,
      $c_p = 4{,}186\ \text{kJ/(kg·K)}$.*
    pide: El volumen específico de la mezcla, la exergía destruida y el rendimiento exergético.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de ningún balance: ¿en qué zona está cada corriente de entrada?
        opciones:
          - texto: La de 400 °C es vapor sobrecalentado y la de 30 °C, líquido, porque a 20 bar el agua satura a 212,38 °C
            correcta: true
            mensaje: |
              Eso es. Con presión y temperatura se compara con la saturación a
              esa presión: por encima, vapor; por debajo, líquido. La primera se
              lee en la tabla de sobrecalentado de 20 bar; la segunda, con el
              modelo incompresible o con $h'$ a 30 °C, que casi coinciden.
          - texto: Las dos son vapor, porque las dos son «agua» a la misma presión
            mensaje: |
              «Agua» no dice la fase. A 20 bar hierve a 212,38 °C, y la
              corriente de 30 °C está casi doscientos grados por debajo: es
              líquido.
          - texto: La de 30 °C es vapor húmedo, porque está entre dos temperaturas de saturación
            mensaje: |
              Para estar dentro de la campana hace falta estar **justo** a la
              temperatura de saturación de su presión. Con presión y
              temperatura independientes, o se está por encima o por debajo.

      - tipo: calcular
        titulo: La entalpía de la mezcla
        pregunta: |
          Con $h_1$ de la tabla y $h_2 \approx c_p\,\theta_2$, ¿qué entalpía
          tiene la corriente que sale?
        respuesta:
          tipo: magnitud
          valor: '2542.8 kJ/kg'
          tolerancia: 0.005
          formato: una entalpía específica, con su unidad
        distractores:
          - valor: '2802.2 kJ/kg'
            mensaje: |
              Te has dejado los 908 kW que se pierden. Con el calor fuera del
              balance, la mezcla saldría con toda la energía que traen las dos
              corrientes, y no es así.
          - valor: '3061.6 kJ/kg'
            mensaje: |
              Has sumado el calor en vez de restarlo. Se **disipa** al exterior:
              sale del volumen de control, y con el convenio de la asignatura es
              $\dot Q = -908\ \text{kW}$.
          - valor: '2966.6 kJ/kg'
            mensaje: |
              Has dividido entre 3 kg/s, el gasto de la corriente caliente.
              Sale la mezcla de las dos: 3,5 kg/s.
        pista: |
          $\dot Q = (\dot m_1 + \dot m_2)\,h_3 - \dot m_1 h_1 - \dot m_2 h_2$, con
          $\dot Q = -908\ \text{kW}$. A 20 bar y 400 °C la tabla tiene fila
          propia.
        desarrollo: |
          $h_1 = 3248{,}3\ \text{kJ/kg}$ de la fila de 400 °C a 20 bar, y
          $h_2 = 4{,}186 \cdot 30 = 125{,}58\ \text{kJ/kg}$:

          $$
          h_3 = \frac{-908 + 3 \cdot 3248{,}3 + 0{,}5 \cdot 125{,}58}{3{,}5}
          = 2542{,}8\ \frac{\text{kJ}}{\text{kg}}
          $$

      - tipo: calcular
        titulo: El volumen específico de la mezcla
        pregunta: |
          La mezcla sale a 20 bar. ¿Qué volumen específico tiene?
        respuesta:
          tipo: magnitud
          valor: '0.08628 m^3/kg'
          tolerancia: 0.01
          formato: un volumen específico, con su unidad
        distractores:
          - valor: '0.099585 m^3/kg'
            mensaje: |
              Ese es $v''$ a 20 bar, el del vapor saturado **seco**. Con
              $h_3 = 2542{,}8$, entre $h' = 908{,}5$ y $h'' = 2798{,}3$, la mezcla
              está dentro de la campana: tiene título, y su volumen es la media
              ponderada.
          - valor: '0.01448 m^3/kg'
            mensaje: |
              Has cambiado los pesos. El título multiplica al vapor,
              $v = v' + x\,(v'' - v')$, y un título de 0,86 es sobre todo vapor.
        pista: |
          Primero la zona: compara $h_3$ con $h'$ y $h''$ a 20 bar. Si cae entre
          los dos, $x_3 = (h_3 - h')/(h'' - h')$ y después
          $v_3 = v' + x_3\,(v'' - v')$.
        desarrollo: |
          A 20 bar, $h' = 908{,}5$ y $h'' = 2798{,}3\ \text{kJ/kg}$: la mezcla
          sale húmeda.

          $$
          x_3 = \frac{2542{,}8 - 908{,}5}{2798{,}3 - 908{,}5} = 0{,}8648
          $$

          $$
          v_3 = 0{,}0011767 + 0{,}8648\,(0{,}099585 - 0{,}0011767)
          = 0{,}08628\ \frac{\text{m}^{3}}{\text{kg}}
          $$

      - tipo: calcular
        titulo: La exergía destruida
        pregunta: |
          Con $s_1 = 7{,}1292$, $s_2 = 4{,}186\ln(303/273) = 0{,}4364$ y
          $s_3 = 5{,}8127\ \text{kJ/(kg·K)}$, ¿cuánta exergía se destruye?
        respuesta:
          tipo: magnitud
          valor: '529.2 kW'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '544.7 kW'
            mensaje: |
              Te has dejado la exergía que se va con el calor,
              $(1 - 288/293)\cdot(-908) = -15{,}5\ \text{kW}$. Es poca, pero
              sale del volumen de control y no se ha destruido.
          - valor: '560.2 kW'
            mensaje: |
              Has puesto la exergía del calor con el signo cambiado. El calor
              **sale**, así que se lleva exergía: $-15{,}5\ \text{kW}$, no
              $+15{,}5$.
          - valor: '-363.3 kW'
            mensaje: |
              Has hecho Guy-Stodola con la entropía de las corrientes y sin el
              calor. Los 908 kW que salen al ambiente a 293 K se llevan
              $908/293 = 3{,}10\ \text{kW/K}$ de entropía, y sin ese término la
              generada sale negativa: la señal de que falta algo.
        pista: |
          Como no se sabe a qué temperatura sale el calor, se extiende la
          frontera hasta el medio circundante, a 20 °C. Después
          $\dot{E}x_D = (1 - T_0/T_{MC})\,\dot Q - \dot A_3 + \dot A_1 + \dot A_2$,
          o $T_0\,\dot S_G$.
        desarrollo: |
          Con $a = (h - h_0) - T_0\,(s - s_0)$ y la referencia a 15 °C,
          $h_0 = 62{,}79$ y $s_0 = 0{,}2239$:

          $$
          \dot A_1 = 3590{,}4 \qquad \dot A_2 = 0{,}8 \qquad \dot A_3 = 3046{,}4\ \text{kW}
          $$

          $$
          \dot{E}x_D = \left(1 - \frac{288}{293}\right)(-908) - 3046{,}4 + 3590{,}4 + 0{,}8
          = 529{,}2\ \text{kW}
          $$

          Y por Guy-Stodola, con la frontera en el medio a 293 K:

          $$
          \dot S_G = 3{,}5 \cdot 5{,}8127 - 0{,}5 \cdot 0{,}4364 - 3 \cdot 7{,}1292 + \frac{908}{293}
          = 1{,}838\ \frac{\text{kW}}{\text{K}}
          \qquad
          T_0\,\dot S_G = 529{,}2\ \text{kW}
          $$

      - tipo: calcular
        titulo: El rendimiento exergético
        pregunta: |
          ¿Qué fracción de la exergía que traen las dos corrientes sale con la
          mezcla?
        respuesta:
          tipo: numero
          valor: '0.848'
          tolerancia: 0.003
          formato: una fracción entre 0 y 1
        distractores:
          - valor: '0.853'
            mensaje: |
              Es $1 - \dot{E}x_D/(\dot A_1 + \dot A_2)$, que cuenta como
              aprovechados los 15,5 kW de exergía que se van con el calor. No
              los aprovecha nadie: lo útil es la corriente que sale, y el
              rendimiento es $\dot A_3/(\dot A_1 + \dot A_2)$.
          - valor: '0.152'
            mensaje: |
              Esa es la fracción que **no** sale con la mezcla: la destruida
              más la que se lleva el calor. El rendimiento es la otra parte.
        pista: |
          $\eta_{ex} = \dfrac{\dot A_3}{\dot A_1 + \dot A_2}$, con las exergías
          de flujo del paso anterior.
        desarrollo: |
          $$
          \eta_{ex} = \frac{3046{,}4}{3590{,}4 + 0{,}8} = 0{,}848
          $$

      - tipo: justificar
        pregunta: Ordena dónde se va la exergía. Una pieza es falsa.
        piezas:
          - texto: 'Entran 3591,2 kW de exergía, casi todos con el vapor a 400 °C; el agua a 30 °C apenas trae 0,8.'
          - texto: 'Mezclar vapor a 400 °C con agua a 30 °C es un salto de temperatura enorme, y ahí se destruyen 529 kW.'
          - texto: 'Los 908 kW de calor salen al ambiente a 20 °C, cinco grados por encima de la referencia, y solo se llevan 15,5 kW de exergía.'
          - texto: 'Así que la mayor parte de la exergía que falta se ha ido con los 908 kW de calor perdido.'
            trampa: true
            mensaje: |
              Es lo que sugiere el número grande, y es lo contrario. El calor
              sale a una temperatura muy cercana a la del ambiente, y a esa
              temperatura casi no vale nada como trabajo: 15,5 kW de 908. Lo
              que se destruye —529 kW, treinta y cuatro veces más— se destruye
              al mezclar dos corrientes a temperaturas tan distintas. Aislar el
              mezclador no arreglaría casi nada.
    resolucion: |
      **Las dos corrientes, cada una en su zona.** A 20 bar el agua satura a
      212,38 °C: la corriente de 400 °C es vapor sobrecalentado,
      $h_1 = 3248{,}3$ y $s_1 = 7{,}1292$, de la tabla de 20 bar; la de 30 °C
      es líquido, y con el modelo incompresible $h_2 = 125{,}58\ \text{kJ/kg}$
      y $s_2 = 0{,}4364\ \text{kJ/(kg·K)}$.

      **El balance de energía**, con el calor que sale:

      $$
      h_3 = \frac{-908 + 3 \cdot 3248{,}3 + 0{,}5 \cdot 125{,}58}{3{,}5}
      = 2542{,}8\ \frac{\text{kJ}}{\text{kg}}
      $$

      **La mezcla sale húmeda.** A 20 bar, $h' = 908{,}5$ y $h'' = 2798{,}3$:

      $$
      x_3 = 0{,}8648
      \qquad
      v_3 = 0{,}0011767 + 0{,}8648\,(0{,}099585 - 0{,}0011767)
      = 0{,}08628\ \frac{\text{m}^{3}}{\text{kg}}
      \qquad
      s_3 = 5{,}8127
      $$

      **La exergía destruida.** El calor sale a una temperatura que no se
      conoce, así que la frontera se lleva hasta el medio circundante, a
      20 °C. Con la referencia a 15 °C y las exergías de flujo
      $\dot A_1 = 3590{,}4$, $\dot A_2 = 0{,}8$ y $\dot A_3 = 3046{,}4$ kW:

      $$
      \dot{E}x_D = \left(1 - \frac{288}{293}\right)(-908) - 3046{,}4 + 3590{,}4 + 0{,}8
      = 529{,}2\ \text{kW}
      $$

      Lo mismo que por Guy-Stodola: $\dot S_G = 1{,}838\ \text{kW/K}$ y
      $T_0\,\dot S_G = 529{,}2\ \text{kW}$.

      **El rendimiento exergético.**

      $$
      \eta_{ex} = \frac{\dot A_3}{\dot A_1 + \dot A_2} = \frac{3046{,}4}{3591{,}2}
      = 0{,}848
      $$

      **Lo que hay que llevarse.** De los 3591 kW de exergía que entran se
      destruyen 529 al mezclar y solo 15,5 se van con los 908 kW de calor. La
      pérdida de **energía** es el calor; la de **exergía**, la mezcla. Son
      dos cosas distintas, y confundirlas lleva a aislar lo que no importa.

      > **Cómo lo hace la resolución oficial.** Lee el vapor de entrada en el
      > diagrama de Mollier, $h_1 = 3245$ y $s_1 = 7{,}12$, en lugar de la
      > tabla, y de ahí salen su $h_3 = 2540$, sus 524,07 kW y su 84,97 %. Y
      > arrastra el título con tres valores distintos: escribe
      > $x_3 = 0{,}856$, calcula $v_3 = 0{,}08615$ con 0,8635 —que es el que
      > da su propia cuenta— y $s_3 = 5{,}7999$ con 0,8615. Nada de eso cambia
      > las conclusiones, y sus resultados caben en las casillas de aquí.

  - id: ejter-col711-la-bomba-y-la-turbina-que-la-mueve
    titulo: La bomba que rinde un 77 % y no un 84, y la turbina que la mueve
    fuente: >-
      Ejercicio 7.11 de las diapositivas del Tema 7, «Análisis exergético» ·
      Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). Las
      diapositivas traen su resolución, y el desarrollo está contrastado contra
      ella. Se aparta de ella en la bomba, que rinde un 77 % y no un 84 %, y en
      la turbina, que destruye 66 kW y no 47: las dos cosas se explican en la
      resolución.
    nivel: practica
    enunciado: |
      Una bomba con una relación de compresión de 50 trabaja con un caudal de
      80 l/s de agua a $15\ ^\circ\text{C}$ y $1\ \text{bar}$. Para accionar
      la bomba, se utiliza una turbina de vapor con una eficiencia interna del
      88%, alimentada con vapor a $20\ \text{bar}$ y $400\ ^\circ\text{C}$,
      expandiéndolo a $0{,}05\ \text{bar}$. La temperatura del agua a la
      salida de la bomba es de $15{,}4\ ^\circ\text{C}$. Calcúlese:

      a) El rendimiento interno de la bomba;

      b) el consumo mínimo de vapor requerido por la turbina;

      c) la exergía destruida en la turbina y la bomba;

      d) la eficiencia exergética de la turbina y la bomba.

      *La resolución de las diapositivas toma como estado de referencia el del
      agua que entra en la bomba, $15\ ^\circ\text{C}$ y $1\ \text{bar}$, y un
      gasto de $80\ \text{kg/s}$. Las propiedades del agua, de [la tabla de
      líquido a 50 bar](/road-to-ingenieria/ingenieria-termica/tablas/#liquido-50)
      y de [la de saturación por
      temperatura](/road-to-ingenieria/ingenieria-termica/tablas/#saturacion-temperatura),
      y las del vapor, de [la de 20
      bar](/road-to-ingenieria/ingenieria-termica/tablas/#sobrecalentado-20) y
      de [la de saturación por
      presión](/road-to-ingenieria/ingenieria-termica/tablas/#saturacion-presion),
      como en el examen se sacan del anexo.*
    pide: El rendimiento interno de la bomba, el gasto de vapor, y la exergía destruida y el rendimiento exergético de la turbina y de la bomba.
    pasos:
      - tipo: reconocer
        pregunta: |
          Para el rendimiento interno de la bomba hace falta su trabajo
          isentrópico. ¿Cómo se saca, con las tablas del curso?
        opciones:
          - texto: >-
              Con $v\,\Delta P$: el agua casi no cambia de volumen, y la tabla
              de líquido a 50 bar va de 20 en 20 °C, demasiado gruesa para una
              bomba que calienta el agua décimas de grado
            correcta: true
            mensaje: |
              Eso es. $w_s = v\,(P_2-P_1) = 4{,}90\ \text{kJ/kg}$, y es casi
              exacto: la formulación completa del agua da 4,899. La tabla sí
              sirve para la salida real, porque ahí se interpola la entalpía,
              que crece casi en línea recta con la temperatura.
          - texto: >-
              Buscando en la tabla de 50 bar la entalpía que tiene la entropía
              de entrada, interpolando entre 0 y 20 °C
            mensaje: |
              Es el camino de las diapositivas, y aquí falla. La entropía no
              crece en línea recta con la temperatura —va como un logaritmo—, y
              la recta entre 0 y 20 °C pone la salida isentrópica a 15,2 °C
              cuando está a 15,05. En una bomba que calienta el agua 0,4 grados,
              eso infla el trabajo isentrópico un 13 %.
          - texto: Con $c\,\Delta T$, porque la bomba calienta el agua 0,4 grados
            mensaje: |
              Ese calentamiento es justo lo que **no** es isentrópico: sale del
              trabajo que se pierde. Una bomba ideal casi no calienta el agua;
              su trabajo va entero a subir la presión.
          - texto: Con $h_2 - h_1$, las entalpías de entrada y de salida
            mensaje: |
              Eso es el trabajo **real**, el de la bomba que calienta el agua
              hasta 15,4 °C. El isentrópico es el de una bomba ideal entre las
              mismas presiones, y es menor.

      - tipo: calcular
        titulo: El rendimiento interno de la bomba
        pregunta: |
          Con $w_s = v\,\Delta P$ y el trabajo real sacado de las tablas —la
          salida, en la de líquido a 50 bar y 15,4 °C; la entrada, como líquido
          a 15 °C—, ¿cuál es el rendimiento interno de la bomba?
        respuesta:
          tipo: numero
          valor: '0.766'
          tolerancia: 0.03
          formato: una fracción entre 0 y 1
        distractores:
          - valor: '0.867'
            mensaje: |
              Has sacado el trabajo isentrópico de la tabla de 50 bar,
              interpolando entre 0 y 20 °C con la entropía de entrada. La
              entropía no es lineal en la temperatura, y esa recta pone la
              salida ideal a 15,2 °C en lugar de a 15,05: el trabajo
              isentrópico sale 5,55 en vez de 4,90. Es el método de las
              diapositivas; con su entalpía de entrada,
              $4{,}186\cdot 15 = 62{,}79$, llegan al 84 %.
          - valor: '1.306'
            mensaje: |
              Has puesto el cociente del revés, real entre ideal. En una bomba
              el trabajo real es el **mayor**, así que el rendimiento es ideal
              entre real y sale menor que uno.
          - valor: '0.234'
            mensaje: |
              Esa es la fracción del trabajo que se **pierde**, $1 - \eta_s$. El
              rendimiento es la que se aprovecha.
        pista: |
          $w_s = v_1\,(P_2-P_1)$ con $v_1 = 0{,}0010009\ \text{m}^3/\text{kg}$;
          la entalpía de entrada, $h' = 62{,}981$ a 15 °C; la de salida, entre
          las filas de 0 y 20 °C del líquido a 50 bar, $5{,}03$ y
          $88{,}61\ \text{kJ/kg}$.
        desarrollo: |
          $$
          w_s = 0{,}0010009\cdot(5000-100) = 4{,}904\ \text{kJ/kg}
          $$

          $$
          h_2 = 5{,}03 + \frac{15{,}4}{20}\cdot(88{,}61-5{,}03) = 69{,}387\ \text{kJ/kg}
          \qquad
          w = 69{,}387 - 62{,}981 = 6{,}406\ \text{kJ/kg}
          $$

          $$
          \eta_{sB} = \frac{4{,}904}{6{,}406} = 0{,}766
          $$

          La formulación exacta del agua da 0,772, y el modelo de líquido
          incompresible, $w = c\,\Delta T + v\,\Delta P$, da 0,746: los tres caben
          en la tolerancia. El 84 % de las diapositivas, no; la resolución
          explica por qué.

      - tipo: calcular
        titulo: El gasto de vapor de la turbina
        pregunta: |
          La turbina da exactamente la potencia que consume la bomba con sus
          80 kg/s. ¿Cuánto vapor necesita?
        respuesta:
          tipo: magnitud
          valor: '0.542 kg/s'
          tolerancia: 0.04
          formato: un gasto másico, con su unidad
        distractores:
          - valor: '0.477 kg/s'
            mensaje: |
              Has usado el trabajo isentrópico de la turbina, 1074,6 kJ/kg. La
              turbina real da el 88 % de eso, 945,6, así que hace falta más
              vapor.
          - valor: '0.420 kg/s'
            mensaje: |
              Has dividido el trabajo isentrópico entre el rendimiento, como en
              un compresor. En una turbina el real es el **menor**:
              $w_T = 0{,}88\,w_s$.
        pista: |
          $\dot{m}_T\,(h_3-h_4) = \dot{m}_B\,w_B$. En la turbina,
          $h_3 = 3248{,}3$ y $s_3 = 7{,}1292$ a 20 bar y 400 °C; la salida
          isentrópica, en la mezcla de 0,05 bar con esa entropía.
        desarrollo: |
          A 0,05 bar, $s' = 0{,}4762$ y $s'' = 8{,}3938$:

          $$
          x_{4s} = \frac{7{,}1292-0{,}4762}{8{,}3938-0{,}4762} = 0{,}8403
          \qquad
          h_{4s} = 137{,}75 + 0{,}8403\cdot 2422{,}95 = 2173{,}7\ \text{kJ/kg}
          $$

          $$
          w_T = 0{,}88\cdot(3248{,}3-2173{,}7) = 945{,}6\ \text{kJ/kg}
          $$

          $$
          \dot{m}_T = \frac{80\cdot 6{,}406}{945{,}6} = 0{,}542\ \text{kg/s}
          $$

          Las diapositivas dan 0,552, con las entalpías leídas en el diagrama
          de Mollier —3250 y 2160— y su trabajo de bomba, 6,63.

      - tipo: calcular
        titulo: La exergía destruida en la turbina
        pregunta: |
          El vapor sale de la turbina a 0,05 bar con
          $h_4 = 2302{,}7\ \text{kJ/kg}$. Con $T_0 = 288\ \text{K}$, ¿cuánta
          exergía destruye la turbina?
        respuesta:
          tipo: magnitud
          valor: '65.8 kW'
          tolerancia: 0.03
          formato: una potencia, con su unidad
        distractores:
          - valor: '47.3 kW'
            mensaje: |
              Es el número de las diapositivas, y sale de leer las entropías en
              el diagrama de Mollier: 7,15 a la entrada y 7,45 a la salida, un
              salto de 0,30. Con las tablas son 7,1292 y 7,5506: el salto es
              0,42, y la exergía destruida, un 40 % mayor.
          - valor: '578.2 kW'
            mensaje: |
              Esa es toda la exergía que **pierde el vapor** al pasar por la
              turbina. La mayor parte sale como trabajo, 512,5 kW; lo destruido
              es solo lo que falta.
        pista: |
          Turbina adiabática: $\dot{S}_G = \dot{m}_T\,(s_4-s_3)$, con $s_4$ en la
          mezcla de 0,05 bar, y $\dot{E}x_D = T_0\,\dot{S}_G$.
        desarrollo: |
          $$
          x_4 = \frac{2302{,}7-137{,}75}{2422{,}95} = 0{,}8935
          \qquad
          s_4 = 0{,}4762 + 0{,}8935\cdot 7{,}9176 = 7{,}5506
          $$

          $$
          \dot{E}x_D = 288\cdot 0{,}542\cdot(7{,}5506-7{,}1292) = 65{,}8\ \text{kW}
          $$

      - tipo: calcular
        titulo: El rendimiento exergético de la turbina
        pregunta: |
          ¿Qué fracción de la exergía que pierde el vapor sale como trabajo?
        respuesta:
          tipo: numero
          valor: '0.886'
          tolerancia: 0.005
          formato: una fracción entre 0 y 1
        distractores:
          - valor: '0.918'
            mensaje: |
              Es el de las diapositivas, con el salto de entropía del diagrama
              de Mollier, 0,30. Con el de las tablas, 0,4214, lo que se destruye
              por kilogramo son 121,4 kJ/kg y no 86, y el rendimiento baja a
              0,886.
          - valor: '0.114'
            mensaje: |
              Esa es la fracción que se **destruye**, 121,4 entre 1067. El
              rendimiento es la que sale como trabajo: 945,6 entre 1067.
        pista: |
          $\eta_{ex} = \dfrac{w_T}{a_{f3}-a_{f4}}$, y en la resta de exergías de
          flujo la referencia se va:
          $a_{f3}-a_{f4} = (h_3-h_4) - T_0\,(s_3-s_4)$.
        desarrollo: |
          $$
          a_{f3}-a_{f4} = 945{,}6 + 288\cdot 0{,}4214 = 1067{,}0\ \text{kJ/kg}
          $$

          $$
          \eta_{ex,T} = \frac{945{,}6}{1067{,}0} = 0{,}886
          $$

          Un poco mayor que el rendimiento interno, 0,88, porque el vapor sale a
          32,9 °C, más caliente que la referencia: parte de lo que pierde por
          rozamiento se queda en él como un calentamiento que todavía vale
          algo.

      - tipo: justificar
        pregunta: Ordena la comparación entre la bomba y la turbina. Una pieza es falsa.
        piezas:
          - texto: >-
              Por kilogramo, la turbina destruye 121 kJ/kg y la bomba solo
              1,5.
          - texto: >-
              Pero por la bomba pasan 80 kg/s y por la turbina medio kilo por
              segundo: unas ciento cincuenta veces más masa.
          - texto: >-
              Por eso la bomba destruye unos 120 kW, casi el doble que la
              turbina, aunque solo caliente el agua 0,4 grados.
          - texto: >-
              Como la bomba solo calienta el agua 0,4 grados, lo que destruye es
              despreciable frente a la turbina.
            trampa: true
            mensaje: |
              Cuatro décimas de grado en 80 kg/s de agua son mucho: la bomba
              pierde 1,5 kJ por cada kilo, y pasan ochenta por segundo. Destruye
              unos 120 kW, casi el doble que la turbina. Lo que decide no es
              cuánto se calienta el agua, sino cuánto trabajo se paga de más
              sobre el isentrópico, multiplicado por todo lo que pasa.
    resolucion: |
      **El estado de referencia.** El enunciado no lo da. Las diapositivas
      toman el del agua que entra en la bomba, 15 °C y 1 bar,
      $T_0 = 288\ \text{K}$, y así la exergía del agua a la entrada es cero. El
      gasto de la bomba, 80 kg/s, con la densidad del agua redondeada a 1000.

      **a) La bomba: el trabajo isentrópico, con $v\,\Delta P$.** El agua
      líquida casi no cambia de volumen:

      $$
      w_s = 0{,}0010009\cdot(5000-100) = 4{,}904\ \text{kJ/kg}
      $$

      **El trabajo real, con la tabla.** A la salida, 50 bar y 15,4 °C, entre
      las filas de 0 y 20 °C del líquido a 50 bar; a la entrada, el agua a
      15 °C y 1 bar, que se lee como líquido a 15 °C, $h_1 = 62{,}981$:

      $$
      h_2 = 5{,}03 + \frac{15{,}4}{20}\cdot(88{,}61-5{,}03) = 69{,}387\ \text{kJ/kg}
      \qquad
      w = 69{,}387 - 62{,}981 = 6{,}406\ \text{kJ/kg}
      $$

      $$
      \eta_{sB} = \frac{4{,}904}{6{,}406} = 0{,}766
      $$

      **Por qué las diapositivas dan un 84 %.** Sacan el trabajo isentrópico
      de la misma tabla de 50 bar: buscan la entalpía que tiene la entropía de
      entrada, interpolando entre 0 y 20 °C. Y la entropía de un líquido no
      crece en línea recta con la temperatura —va con $c\ln T$—, así que esa
      recta coloca la salida isentrópica a 15,2 °C cuando está a 15,05. En una
      bomba que solo calienta el agua 0,4 grados eso es mucho: el trabajo
      isentrópico sale 5,57 en vez de 4,90. Además toman la entalpía de
      entrada como $4{,}186\cdot 15 = 62{,}79$, con un cero distinto del de la
      tabla, y eso infla también el trabajo real, que les sale 6,63. Con los
      dos errores, $5{,}57/6{,}63 = 0{,}84$.

      La prueba de que el bueno es el 77 %: la formulación completa del agua,
      IAPWS-95 —la misma con la que están calculadas las tablas del sitio—, da
      $w_s = 4{,}899$ y $w = 6{,}348\ \text{kJ/kg}$, y
      $4{,}899/6{,}348 = 0{,}772$. El modelo de líquido incompresible,
      $w = c\,\Delta T + v\,\Delta P = 6{,}58\ \text{kJ/kg}$, da 0,746: atribuye
      a rozamiento toda la subida de 0,4 grados, y una pequeña parte, 0,05, la
      pone la propia compresión.

      **b) El vapor que hace falta.** La turbina da justo la potencia de la
      bomba, $80\cdot 6{,}406 = 512{,}5\ \text{kW}$. Con la tabla de 20 bar,
      $h_3 = 3248{,}3$ y $s_3 = 7{,}1292$; la salida isentrópica, en la mezcla de
      0,05 bar:

      $$
      x_{4s} = \frac{7{,}1292-0{,}4762}{7{,}9176} = 0{,}8403
      \qquad
      h_{4s} = 137{,}75 + 0{,}8403\cdot 2422{,}95 = 2173{,}7\ \text{kJ/kg}
      $$

      $$
      w_T = 0{,}88\cdot(3248{,}3-2173{,}7) = 945{,}6\ \text{kJ/kg}
      \qquad
      \dot{m}_T = \frac{512{,}5}{945{,}6} = 0{,}542\ \text{kg/s}
      $$

      «Mínimo» porque es el vapor que haría falta sin ninguna otra pérdida
      entre la turbina y la bomba. Las diapositivas dan 0,552, con 3250 y 2160
      leídos en el diagrama de Mollier y su trabajo de bomba, 6,63.

      **c) y d) La turbina.** Sale con
      $h_4 = 3248{,}3 - 945{,}6 = 2302{,}7\ \text{kJ/kg}$, título 0,8935 y
      $s_4 = 7{,}5506$:

      $$
      \dot{E}x_{D,T} = 288\cdot 0{,}542\cdot(7{,}5506-7{,}1292) = 65{,}8\ \text{kW}
      \qquad
      \eta_{ex,T} = \frac{945{,}6}{945{,}6 + 288\cdot 0{,}4214} = 0{,}886
      $$

      Las diapositivas dan 47,29 kW y 91,81 %: leen en el diagrama de Mollier
      $s_3 = 7{,}15$ y $s_4 = 7{,}45$, un salto de 0,30 donde las tablas dan
      0,42. Incluso con su propia entalpía de salida, 2290,8, la entropía a
      0,05 bar es 7,51, no 7,45.

      **c) y d) La bomba, y por qué hay que mirarla con cuidado.** La bomba es
      adiabática, así que lo que destruye es $T_0\,\dot{m}\,(s_2-s_1)$, y aquí
      está la trampa numérica del ejercicio: $s_2 - s_1$ es una diferencia en
      la cuarta cifra decimal, y la tabla de 50 bar, de 20 en 20 °C, no la
      resuelve. Interpolando en ella sale $s_2 = 0{,}2275$ y una destrucción
      de 69,6 kW; las diapositivas, con $s_1 = 4{,}186\ln(288/273)$, llegan a
      86,05 kW. La forma de sacarla bien con lo que hay es la ecuación de
      Gibbs, $T\,ds = dh - v\,dP$, que para el agua casi a temperatura
      constante da

      $$
      s_2 - s_1 = \frac{w - v\,\Delta P}{T} = \frac{6{,}406-4{,}904}{288{,}35} = 0{,}00521\ \text{kJ/(kg·K)}
      $$

      $$
      \dot{E}x_{D,B} = 288\cdot 80\cdot 0{,}00521 = 120\ \text{kW}
      \qquad
      \eta_{ex,B} = \frac{6{,}406 - 288\cdot 0{,}00521}{6{,}406} = 0{,}766
      $$

      La formulación exacta da 115,8 kW y 0,772. Y fíjate en lo que dicen los
      dos números: la bomba destruye casi exactamente el trabajo que se paga
      de más sobre el isentrópico, $80\cdot(6{,}406-4{,}904) = 120\ \text{kW}$, y
      su rendimiento exergético es el interno. Pasa cuando el agua entra a la
      temperatura de referencia y apenas se calienta: lo que se pierde por
      rozamiento calienta el agua a 288 K, donde ese calor ya no vale nada.

      **Lo que hay que llevarse.** Dos cosas. Una, de método: en una bomba, el
      trabajo isentrópico se saca con $v\,\Delta P$ y no de la tabla de líquido
      comprimido, cuya rejilla es demasiado gruesa para diferencias de
      décimas de grado —solo vale si la salida cae casi encima de una fila,
      como en el 7.14—. Y otra, de lectura: la bomba destruye más exergía que
      la turbina, 120 kW frente a 66, aunque por kilo pierda ochenta veces
      menos, porque mueve unas ciento cincuenta veces más masa.

  - id: ejter-col712-el-helio-que-se-calienta-y-pierde-exergia
    titulo: El helio agitado a presión constante, que se calienta y pierde exergía
    fuente: >-
      Ejercicio 7.12 de las diapositivas del Tema 7, «Análisis exergético» ·
      Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). Las
      diapositivas traen su resolución, y el desarrollo está contrastado contra
      ella. Sus resultados, 1257,92 kJ, 12,64 % y −1369,14 kJ, se reproducen. El
      enunciado es el de la lámina 54, porque el de la lámina 19 no trae la
      temperatura del medio ni la de referencia, sin las que no se puede
      resolver.
    nivel: practica
    enunciado: |
      Un dispositivo cilindro-pistón contiene $1{,}5\ \text{kg}$ de He a
      $35\ ^\circ\text{C}$ y $5\ \text{bar}$. Un mezclador con una potencia de
      $0{,}8\ \text{kW}$ funciona durante 30 minutos, revolviendo el helio,
      hasta que la temperatura es de $90\ ^\circ\text{C}$. Si la fricción
      entre el pistón y las paredes del cilindro es despreciable, calcule:

      a) Exergía destruida en el proceso

      b) Rendimiento exergético del proceso

      c) Variación de exergía del universo, si el medio circundante se
      encuentra a $25\ ^\circ\text{C}$.

      Nota: Tómese temperatura de referencia $20\ ^\circ\text{C}$.

      *Para el helio, la resolución de las diapositivas toma $R' = 2{,}077$,
      $c_v = 3{,}11$ y $c_p = 5{,}18\ \text{kJ/(kg·K)}$, y
      $P_0 = 1\ \text{bar}$.*
    pide: La exergía destruida en el helio, su rendimiento exergético y la variación de exergía del universo.
    pasos:
      - tipo: reconocer
        pregunta: |
          El pistón se mueve sin rozamiento mientras el mezclador agita el
          helio. ¿Qué le pasa a la presión del gas?
        opciones:
          - texto: Se mantiene en 5 bar, y el helio se dilata empujando el pistón
            correcta: true
            mensaje: |
              Eso es: con el pistón libre, lo que fija la presión es el peso
              del pistón y la atmósfera, que no cambian. El helio se calienta a
              presión constante, se dilata y hace trabajo de frontera, 171 kJ,
              mientras el mezclador le mete 1440.
          - texto: Sube, porque el helio se calienta dentro de un recipiente cerrado
            mensaje: |
              Subiría si el volumen no pudiera cambiar, que es el ejercicio 7.5:
              helio en un depósito **rígido**. Aquí el pistón está libre, así
              que el gas se dilata y la presión se queda donde la fija el
              pistón.
          - texto: Baja, porque el helio cede calor al exterior
            mensaje: |
              Ceder calor no fija la presión: la fija el pistón. Y el helio
              recibe mucha más energía del mezclador de la que cede: acaba
              55 grados más caliente.
          - texto: No se puede saber sin conocer el volumen final
            mensaje: |
              Se sabe sin él: un pistón que se mueve libremente y sin rozamiento
              mantiene la presión del gas igual a la que él impone. El volumen
              final sale después, de la ecuación del gas ideal a 5 bar y 90 °C.

      - tipo: calcular
        titulo: El calor que cede el helio
        pregunta: |
          El mezclador mete $0{,}8\cdot 1800 = 1440\ \text{kJ}$ y el helio acaba a
          90 °C a presión constante. ¿Cuánto calor intercambia, con su signo?
        respuesta:
          tipo: magnitud
          valor: '-1012 kJ'
          tolerancia: 0.02
          formato: un calor con su signo y su unidad
        distractores:
          - valor: '-1183 kJ'
            mensaje: |
              Te has dejado el trabajo de frontera: has hecho
              $Q = \Delta U - 1440$ como si el volumen no cambiara. El helio se
              dilata a 5 bar y empuja el pistón, y esos 171 kJ también salen en
              el balance.
          - valor: '1868 kJ'
            mensaje: |
              Has sumado el trabajo del mezclador con el signo cambiado. Con el
              convenio del curso, el trabajo que **entra** es negativo,
              $W_P = -1440\ \text{kJ}$, y en $Q = \Delta U + W + W_P$ resta.
          - valor: '1012 kJ'
            mensaje: |
              El módulo está bien y el signo no: el calor **sale** del helio.
              Entran 1440 kJ por el eje y solo 428 se quedan en él o empujan el
              pistón; el resto se va por las paredes.
        pista: |
          Primer principio con los dos trabajos:
          $Q = \Delta U + W + W_P$, con $W_P = -1440\ \text{kJ}$ y el de
          frontera $W = P\,(V_2-V_1) = m\,R'\,(T_2-T_1)$.
        desarrollo: |
          $$
          W = 1{,}5\cdot 2{,}077\cdot 55 = 171{,}35\ \text{kJ}
          \qquad
          \Delta U = 1{,}5\cdot 3{,}11\cdot 55 = 256{,}57\ \text{kJ}
          $$

          $$
          Q = 256{,}57 + 171{,}35 - 1440 = -1012{,}08\ \text{kJ}
          $$

          Es lo mismo que $Q = m\,c_p\,\Delta T + W_P$: a presión constante, la
          energía interna y el trabajo de frontera se juntan en la entalpía.

      - tipo: calcular
        titulo: La variación de exergía del helio
        pregunta: |
          Con $T_0 = 293\ \text{K}$ y $P_0 = 1\ \text{bar}$, ¿cuánto cambia la
          exergía del helio, $A_2 - A_1$?
        respuesta:
          tipo: magnitud
          valor: '-83.2 kJ'
          tolerancia: 0.02
          formato: una energía con su signo y su unidad
        distractores:
          - valor: '83.2 kJ'
            mensaje: |
              El módulo está bien y el signo no: la exergía del helio **baja**.
              Se calienta, pero el término $T_0\,\Delta S$ pesa más que lo que
              gana en energía y en volumen.
          - valor: '256.6 kJ'
            mensaje: |
              Eso es lo que sube la **energía interna**, $m\,c_v\,\Delta T$. La
              exergía cambia en $\Delta U + P_0\,\Delta V - T_0\,\Delta S$, y aquí
              el último término se come a los otros dos.
          - valor: '-117.5 kJ'
            mensaje: |
              Te has dejado el término $P_0\,(V_2-V_1)$: el helio se dilata
              0,343 m³ contra la atmósfera, y eso suma 34,3 kJ a su exergía.
        pista: |
          $A_2 - A_1 = m\left[c_v\,(T_2-T_1) + P_0\,(v_2-v_1) - T_0\,(s_2-s_1)\right]$,
          con $v = R'T/P$ y, a presión constante,
          $s_2 - s_1 = c_p\ln(T_2/T_1)$.
        desarrollo: |
          $$
          A_2 - A_1 = 1{,}5\left(3{,}11\cdot 55 + 100\cdot\frac{2{,}077\cdot 55}{500} - 293\cdot 5{,}18\ln\frac{363}{308}\right) = -83{,}21\ \text{kJ}
          $$

          El helio se calienta y aun así **pierde** exergía: a 5 bar su exergía
          es sobre todo de presión, y calentarlo a presión constante le sube
          la entropía más de lo que le sube la energía.

      - tipo: calcular
        titulo: La exergía destruida en el helio
        pregunta: |
          Con la frontera en el helio, el calor sale a su temperatura media,
          $T_m = 335{,}5\ \text{K}$. ¿Cuánta exergía se destruye en el proceso?
        respuesta:
          tipo: magnitud
          valor: '1257.9 kJ'
          tolerancia: 0.02
          formato: una energía, con su unidad
        distractores:
          - valor: '1369.1 kJ'
            mensaje: |
              Esa es la del **universo**: has dejado que el calor se enfríe hasta
              el medio, a 298 K, y es la respuesta de la c) cambiada de signo.
              La a) pone la frontera en el helio, y el calor sale de él a
              335,5 K con 128,2 kJ de exergía que ahí todavía no se han
              destruido.
          - valor: '1440 kJ'
            mensaje: |
              Has dado por destruido todo el trabajo del mezclador. Una parte
              sale como exergía: 137 kJ de trabajo útil sobre el pistón y 128 en
              el calor, aunque el helio pierda otros 83.
          - valor: '1223.7 kJ'
            mensaje: |
              Has contado como exergía todo el trabajo de frontera, 171,35 kJ.
              Una parte, $P_0\,(V_2-V_1) = 34{,}27\ \text{kJ}$, se gasta en
              apartar la atmósfera y no se puede aprovechar: el trabajo útil es
              137,08.
        pista: |
          Balance de exergía del helio:
          $Ex_D = -(A_2-A_1) + \left(1-\frac{T_0}{T_m}\right)Q - \left[W - P_0\,(V_2-V_1)\right] - W_P$.
        desarrollo: |
          $$
          Ex_Q = \left(1-\frac{293}{335{,}5}\right)\cdot(-1012{,}08) = -128{,}21\ \text{kJ}
          \qquad
          Ex_W = 171{,}35 - 100\cdot 0{,}3427 = 137{,}08\ \text{kJ}
          $$

          $$
          Ex_D = 83{,}21 - 128{,}21 - 137{,}08 + 1440 = 1257{,}92\ \text{kJ}
          $$

          Por Guy-Stodola, con
          $S_G = 1{,}2766 + 1012{,}08/335{,}5 = 4{,}2933\ \text{kJ/K}$, sale
          $293\cdot 4{,}2933 = 1257{,}9\ \text{kJ}$: los dos caminos cuadran.

      - tipo: calcular
        titulo: El rendimiento exergético del helio
        pregunta: |
          Con la definición de las diapositivas —el trabajo útil, el cambio de
          exergía del helio y la exergía del calor, entre el trabajo del
          mezclador—, ¿cuánto vale el rendimiento exergético?
        respuesta:
          tipo: numero
          valor: '0.1264'
          tolerancia: 0.005
          formato: una fracción entre 0 y 1
        distractores:
          - valor: '0.0492'
            mensaje: |
              Ese es el del **universo**, con el calor llegando al medio a
              298 K: ahí solo le quedan 16,98 kJ de exergía. El del helio cuenta
              el calor al salir de él, a 335,5 K, con 128,2.
          - valor: '0.1742'
            mensaje: |
              Has puesto la exergía que pierde el helio **abajo**, junto al
              trabajo del mezclador, como si fuera combustible:
              $(137{,}08 + 128{,}20)/(1440 + 83{,}21)$. Es una definición que
              existe, pero la del curso la deja arriba con su signo, y así el
              rendimiento es $1 - Ex_D/W_P$.
          - valor: '0.8736'
            mensaje: |
              Esa es la fracción **destruida**, 1257,92 entre 1440. El
              rendimiento es lo que queda.
        pista: |
          $\eta_{ex} = \dfrac{Ex_W + (A_2-A_1) + |Ex_Q|}{|W_P|}$.
        desarrollo: |
          $$
          \eta_{ex} = \frac{137{,}08 + (-83{,}21) + 128{,}21}{1440} = 0{,}1264
          $$

          El 87 % del trabajo del mezclador se destruye. Agitar un gas es
          convertir trabajo en calor por rozamiento, y eso es de lo más
          irreversible que hay.

      - tipo: calcular
        titulo: La variación de exergía del universo
        pregunta: |
          El medio circundante está a 25 °C. ¿Cuánto cambia la exergía del
          universo?
        respuesta:
          tipo: magnitud
          valor: '-1369.1 kJ'
          tolerancia: 0.02
          formato: una energía con su signo y su unidad
        distractores:
          - valor: '1369.1 kJ'
            mensaje: |
              El signo al revés: la exergía del universo solo puede **bajar**, y
              lo que baja es exactamente lo destruido.
          - valor: '-1257.9 kJ'
            mensaje: |
              Esa es solo la destrucción dentro del helio. En el universo hay
              que sumar la del calor al caer de 335,5 K al medio, a 298 K:
              $128{,}21 - 16{,}98 = 111{,}23\ \text{kJ}$ más.
          - valor: '-83.2 kJ'
            mensaje: |
              Esa es solo la del helio. El universo incluye el medio, que da los
              1440 kJ del mezclador y recibe el calor y el trabajo útil: su
              exergía baja 1285,9 kJ.
        pista: |
          $\Delta Ex_{univ} = -Ex_{D,univ} = -T_0\,S_{G,univ}$, con
          $S_{G,univ} = \Delta S_{He} + |Q|/T_{medio}$.
        desarrollo: |
          $$
          S_{G,univ} = 1{,}2766 + \frac{1012{,}08}{298} = 4{,}6728\ \text{kJ/K}
          $$

          $$
          \Delta Ex_{univ} = -293\cdot 4{,}6728 = -1369{,}1\ \text{kJ}
          $$

          Lo mismo que suman el helio y el medio:
          $-83{,}21 - 1285{,}94 = -1369{,}15\ \text{kJ}$.

      - tipo: justificar
        pregunta: Ordena la lectura del ejercicio. Una pieza es falsa.
        piezas:
          - texto: >-
              El mezclador mete 1440 kJ de trabajo, que es exergía pura, y el
              rozamiento de las paletas lo convierte en energía interna del
              helio.
          - texto: >-
              Esa energía sale como 171 kJ de trabajo sobre el pistón y 1012 kJ
              de calor a unos 62 °C de media, y el helio acaba 55 grados más
              caliente.
          - texto: >-
              De la exergía del mezclador solo quedan 182 kJ en lo que sale y en
              el propio helio: el resto, 1258, se destruye.
          - texto: >-
              Como el helio se calienta 55 grados, gana exergía, y por eso el
              rendimiento no es todavía peor.
            trampa: true
            mensaje: |
              Pierde exergía, 83 kJ, aunque se caliente. A 5 bar el helio tiene
              exergía sobre todo por estar a presión, y calentarlo a presión
              constante le sube más la entropía que la energía. Esos 83 kJ
              restan en el numerador del rendimiento, y por eso sale un 12,6 %
              y no un 18.
    resolucion: |
      **La idea.** El pistón es libre y sin rozamiento, así que el helio
      evoluciona a presión constante, 5 bar. El mezclador le mete trabajo, que
      el rozamiento de las paletas convierte en energía interna; el helio se
      calienta, se dilata empujando el pistón y cede calor por las paredes. Hay
      dos fronteras que mirar: la del helio, con el calor saliendo a su
      temperatura media, y la del universo, con el calor acabando en el medio a
      25 °C.

      **Los datos.** $T_1 = 308$, $T_2 = 363$, $T_m = 335{,}5$,
      $T_{medio} = 298$ y $T_0 = 293\ \text{K}$, con 273 como las
      diapositivas. Helio: $R' = 2{,}077$, $c_v = 3{,}11$ y
      $c_p = 5{,}18\ \text{kJ/(kg·K)}$.

      **El balance de energía.**

      $$
      W = 1{,}5\cdot 2{,}077\cdot 55 = 171{,}35\ \text{kJ}
      \qquad
      W_P = -0{,}8\cdot 1800 = -1440\ \text{kJ}
      $$

      $$
      \Delta U = 1{,}5\cdot 3{,}11\cdot 55 = 256{,}57\ \text{kJ}
      \qquad
      Q = 256{,}57 + 171{,}35 - 1440 = -1012{,}08\ \text{kJ}
      $$

      Los volúmenes, 1,919 y 2,262 m³, salen de la ecuación del gas ideal a
      5 bar.

      **a) La exergía destruida en el helio.** El balance de exergía de un
      sistema cerrado, con $P_0 = 100\ \text{kPa}$:

      $$
      A_2 - A_1 = 1{,}5\left(3{,}11\cdot 55 + 100\cdot\frac{2{,}077\cdot 55}{500} - 293\cdot 5{,}18\ln\frac{363}{308}\right) = -83{,}21\ \text{kJ}
      $$

      $$
      Ex_Q = \left(1-\frac{293}{335{,}5}\right)\cdot(-1012{,}08) = -128{,}21\ \text{kJ}
      \qquad
      Ex_W = 171{,}35 - 34{,}27 = 137{,}08\ \text{kJ}
      $$

      $$
      Ex_D = 83{,}21 - 128{,}21 - 137{,}08 + 1440 = 1257{,}92\ \text{kJ}
      $$

      Y por Guy-Stodola, con
      $\Delta S = 1{,}5\cdot 5{,}18\ln(363/308) = 1{,}2766\ \text{kJ/K}$:

      $$
      S_G = 1{,}2766 + \frac{1012{,}08}{335{,}5} = 4{,}2933\ \text{kJ/K}
      \qquad
      Ex_D = 293\cdot 4{,}2933 = 1257{,}9\ \text{kJ}
      $$

      **b) El rendimiento exergético.** Con la definición de las
      diapositivas, lo que sale o se queda en forma aprovechable entre lo que
      entra:

      $$
      \eta_{ex} = \frac{137{,}08 - 83{,}21 + 128{,}21}{1440} = 0{,}1264
      $$

      Es $1 - 1257{,}92/1440$, como tiene que ser. Si el calor se cuenta cuando
      ya ha llegado al medio, con
      $(1 - 293/298)\cdot 1012{,}08 = 16{,}98\ \text{kJ}$, el rendimiento del
      universo baja a $(137{,}08 - 83{,}21 + 16{,}98)/1440 = 0{,}0492$.

      **c) La variación de exergía del universo.** El helio pierde 83,21 kJ, y
      el medio, que da el trabajo del mezclador y recibe el calor y el trabajo
      útil, pierde

      $$
      \Delta Ex_{medio} = \left(1-\frac{293}{298}\right)\cdot 1012{,}08 + 137{,}08 - 1440 = -1285{,}94\ \text{kJ}
      $$

      $$
      \Delta Ex_{univ} = -83{,}21 - 1285{,}94 = -1369{,}15\ \text{kJ}
      $$

      Que es la exergía destruida en el universo, cambiada de signo: los
      1257,92 kJ del helio más lo que destruye el calor al caer de 335,5 a
      298 K, $128{,}21 - 16{,}98 = 111{,}23\ \text{kJ}$. Las diapositivas dan
      −1369,14. La lámina 62 escribe en el medio un $\Delta V$ de
      $-0{,}312\ \text{m}^{3}$, que es el del ejercicio 7.1; el que usa su
      cuenta, y el bueno, es $-0{,}343$.

      **Lo que hay que llevarse.** Agitar un gas es de lo más irreversible que
      hay: de 1440 kJ de trabajo se destruyen 1258 dentro del propio helio. Y
      un detalle que engaña: el helio se calienta 55 grados y **pierde**
      exergía, porque a 5 bar vale sobre todo por su presión, y calentarlo a
      presión constante le sube más la entropía que la energía.

  - id: ejter-col713-la-valvula-el-separador-y-el-intercambiador
    titulo: La válvula, el separador y el intercambiador, tres destrucciones de tamaño muy distinto
    fuente: >-
      Ejercicio 7.13 de las diapositivas del Tema 7, «Análisis exergético» ·
      Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). Las
      diapositivas resuelven solo la válvula de laminación que pone el vapor a
      2 bar, y esa parte está contrastada contra ellas: sus 844,4 kW salen
      842,7 con las tablas del sitio; el separador y el intercambiador están
      resueltos aquí.
    nivel: practica
    enunciado: |
      En un separador adiabático, un gasto de $7\ \text{kg/s}$ de vapor de
      agua a $180\ ^\circ\text{C}$ y $5\ \text{bar}$ se mezcla con un gasto de
      $4\ \text{kg/s}$ de agua a $75\ ^\circ\text{C}$ y $2\ \text{bar}$, y se
      extraen dos corrientes: una de vapor saturado seco y otra de líquido
      saturado, ambas a $2\ \text{bar}$. La corriente de vapor saturado seco se
      conduce a un intercambiador de calor, donde se calienta aire de
      $20\ ^\circ\text{C}$ a $30\ ^\circ\text{C}$. Al salir del intercambiador
      de calor, el vapor se encuentra en estado de vapor húmedo con un título
      de 0,7. Considerando un estado de referencia de $18\ ^\circ\text{C}$ y
      $1\ \text{bar}$, calcúlese la entropía generada en cada sistema de la
      instalación, la exergía destruida y el rendimiento exergético de cada
      sistema.

      *Las propiedades del agua y del vapor, de [las tablas de
      vapor](/road-to-ingenieria/ingenieria-termica/tablas/#sobrecalentado),
      como en el examen se sacan del anexo. Para el aire, el
      $c_p = 1{,}0045\ \text{kJ/(kg·K)}$ que usan las diapositivas en el
      ejercicio 7.3.*
    pide: La entropía generada, la exergía destruida y el rendimiento exergético de la válvula, del separador y del intercambiador.
    pasos:
      - tipo: reconocer
        pregunta: |
          El vapor llega a 5 bar y el separador trabaja a 2. ¿Qué hay entre
          medias, y qué se conserva en ello?
        opciones:
          - texto: Una válvula de laminación, que baja la presión sin cambiar la entalpía
            correcta: true
            mensaje: |
              Eso es, y es lo primero que hay que ver: el enunciado no la
              nombra, pero sin ella el vapor no entra en un separador a 2 bar.
              Es un sistema más de la instalación, y el que resuelven las
              diapositivas: $h_2 = h_1$, y la entropía sube.
          - texto: Una turbina, que aprovecha la caída de presión
            mensaje: |
              Sería lo sensato, y justo por eso destruye tanto lo que hay: una
              válvula baja la presión igual que una turbina, pero sin sacar
              trabajo. Si hubiera una turbina, el enunciado daría su
              rendimiento o su potencia.
          - texto: Nada, el vapor entra en el separador a 5 bar
            mensaje: |
              El separador está a 2 bar —sus dos salidas lo están—, y en un
              recipiente no puede haber dos presiones. El vapor tiene que haber
              bajado de presión antes de entrar.
          - texto: Un intercambiador que enfría el vapor hasta saturarlo
            mensaje: |
              Enfriarlo no le baja la presión, y separar las fases ya lo hace el
              separador. Lo que hace falta entre 5 y 2 bar es bajar la presión,
              y lo que hace eso sin trabajo es una válvula.

      - tipo: calcular
        titulo: La entropía generada en la válvula
        pregunta: |
          A 5 bar y 180 °C, entre la saturación y la fila de 200 °C, el vapor
          tiene $h_1 = 2811{,}1\ \text{kJ/kg}$ y
          $s_1 = 6{,}9612\ \text{kJ/(kg·K)}$. ¿Cuánta entropía genera la
          válvula?
        respuesta:
          tipo: magnitud
          valor: '2.896 kW/K'
          tolerancia: 0.02
          formato: una entropía por unidad de tiempo, con su unidad
        distractores:
          - valor: '0.414 kW/K'
            mensaje: |
              Esa es la de un kilogramo, $s_2 - s_1 = 0{,}4137\ \text{kJ/(kg·K)}$.
              Por la válvula pasan 7 kg/s.
          - valor: '1.160 kW/K'
            mensaje: |
              Has tomado la salida como vapor saturado a 2 bar,
              $s'' = 7{,}1269$. Con $h = 2811{,}1$ el vapor sigue sobrecalentado
              a 2 bar —a unos 171 °C—, y su entropía hay que interpolarla entre
              150 y 200 °C.
        pista: |
          Válvula adiabática: $h_2 = h_1$. A 2 bar, entre 150 °C
          ($h = 2769{,}1$, $s = 7{,}2810$) y 200 °C ($h = 2870{,}7$,
          $s = 7{,}5081$). Y $\dot{S}_G = \dot{m}\,(s_2-s_1)$.
        desarrollo: |
          $$
          s_2 = 7{,}2810 + \frac{2811{,}1-2769{,}1}{2870{,}7-2769{,}1}\cdot(7{,}5081-7{,}2810) = 7{,}3749
          $$

          $$
          \dot{S}_G = 7\cdot(7{,}3749-6{,}9612) = 2{,}896\ \text{kW/K}
          $$

          Las diapositivas dan 2,902, con las entropías leídas en el diagrama
          de Mollier.

      - tipo: calcular
        titulo: El vapor que sale del separador
        pregunta: |
          El separador es adiabático y recibe los 7 kg/s de vapor laminado y
          los 4 kg/s de agua a 75 °C. ¿Cuánto vapor saturado seco sale?
        respuesta:
          tipo: magnitud
          valor: '6.987 kg/s'
          tolerancia: 0.01
          formato: un gasto másico, con su unidad
        distractores:
          - valor: '4.013 kg/s'
            mensaje: |
              Ese es el **líquido**: has despejado la otra salida. Las dos suman
              11 kg/s, y la de vapor es la grande.
          - valor: '7.334 kg/s'
            mensaje: |
              Has tomado el agua de entrada como si ya estuviera saturada a
              2 bar. Entra a 75 °C, más fría: se calienta hasta 120 °C a costa
              del vapor, y por eso sale menos vapor.
          - valor: '6.787 kg/s'
            mensaje: |
              Has tomado el vapor de entrada como saturado a 5 bar,
              $h'' = 2748{,}1$. Está a 180 °C, sobrecalentado, con
              $h = 2811{,}1$, y ese exceso de energía evapora 0,2 kg/s más.
        pista: |
          Masa, $\dot{m}_4 + \dot{m}_5 = 11$; energía,
          $7\,h_2 + 4\,h_3 = \dot{m}_5\,h'' + \dot{m}_4\,h'$, con $h'$ y $h''$ a
          2 bar y el agua a 75 °C leída como líquido,
          $h_3 = 314{,}03\ \text{kJ/kg}$.
        desarrollo: |
          $$
          \dot{m}_5 = \frac{7\cdot 2811{,}1 + 4\cdot 314{,}03 - 11\cdot 504{,}7}{2706{,}2-504{,}7} = 6{,}987\ \text{kg/s}
          $$

          Y $\dot{m}_4 = 11 - 6{,}987 = 4{,}013\ \text{kg/s}$ de líquido.

      - tipo: calcular
        titulo: La exergía destruida en el separador
        pregunta: |
          Con $s_2 = 7{,}3749$, el agua a 75 °C con $s_3 = 1{,}0158$ y las dos
          salidas saturadas a 2 bar, ¿cuánta exergía destruye el separador?
        respuesta:
          tipo: magnitud
          valor: '72.4 kW'
          tolerancia: 0.08
          formato: una potencia, con su unidad
        distractores:
          - valor: '915 kW'
            mensaje: |
              Has metido en el separador el vapor a 5 bar, con
              $s_1 = 6{,}9612$, como si no hubiera válvula. Lo que destruye la
              laminación se te ha sumado aquí: es de la válvula, no del
              separador.
          - valor: '-72.4 kW'
            mensaje: |
              El signo al revés: has restado lo que sale de lo que entra. La
              entropía generada es la que sale menos la que entra, y en un
              equipo adiabático nunca es negativa.
        pista: |
          Separador adiabático:
          $\dot{S}_G = \dot{m}_5\,s'' + \dot{m}_4\,s' - 7\,s_2 - 4\,s_3$, con
          $s' = 1{,}5302$ y $s'' = 7{,}1269$ a 2 bar, y
          $\dot{E}x_D = T_0\,\dot{S}_G$.
        desarrollo: |
          $$
          \dot{S}_G = 6{,}987\cdot 7{,}1269 + 4{,}013\cdot 1{,}5302 - 7\cdot 7{,}3749 - 4\cdot 1{,}0158 = 0{,}2488\ \text{kW/K}
          $$

          $$
          \dot{E}x_D = 291\cdot 0{,}2488 = 72{,}4\ \text{kW}
          $$

          Es una resta de números de 56 kW/K que se anulan hasta dejar 0,25, y
          por eso es tan sensible: la formulación exacta del agua, sin
          interpolar en la tabla, da 67 kW. La tolerancia admite las dos
          lecturas.

      - tipo: calcular
        titulo: La exergía destruida en el intercambiador
        pregunta: |
          El vapor pasa de saturado seco a título 0,7 a 2 bar y el aire se
          calienta de 20 a 30 °C. ¿Cuánta exergía se destruye en el
          intercambiador?
        respuesta:
          tipo: magnitud
          valor: '1093 kW'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '1201 kW'
            mensaje: |
              Esa es toda la exergía que **pierde el vapor**. El aire gana
              108 kW; lo destruido es la diferencia.
          - valor: '4615 kW'
            mensaje: |
              Ese es el **calor** que pasa del vapor al aire, y se conserva
              entero. Lo que se destruye es la exergía que se pierde por el
              camino, y se calcula con la entropía.
          - valor: '2550 kW'
            mensaje: |
              Has leído el título 0,7 como la fracción que condensa. El título
              es la fracción de **vapor**: condensa el 30 %, no el 70 %.
        pista: |
          El calor, $\dot{m}_5\cdot 0{,}3\,(h''-h')$, fija el gasto de aire con
          $c_p = 1{,}0045$. Después,
          $\dot{S}_G = \dot{m}_5\,(s_6 - s'') + \dot{m}_a\,c_p\ln(303/293)$.
        desarrollo: |
          $$
          \dot{Q} = 6{,}987\cdot 0{,}3\cdot(2706{,}2-504{,}7) = 4614{,}6\ \text{kW}
          \qquad
          \dot{m}_a = \frac{4614{,}6}{1{,}0045\cdot 10} = 459{,}4\ \text{kg/s}
          $$

          $$
          \dot{S}_G = 6{,}987\cdot(-0{,}3\cdot 5{,}5967) + 459{,}4\cdot 1{,}0045\ln\frac{303}{293} = 3{,}755\ \text{kW/K}
          $$

          $$
          \dot{E}x_D = 291\cdot 3{,}755 = 1092{,}7\ \text{kW}
          $$

      - tipo: calcular
        titulo: El rendimiento exergético del intercambiador
        pregunta: |
          ¿Qué fracción de la exergía que pierde el vapor acaba en el aire?
        respuesta:
          tipo: numero
          valor: '0.090'
          tolerancia: 0.005
          formato: una fracción entre 0 y 1
        distractores:
          - valor: '1'
            mensaje: |
              Ese es el rendimiento **energético**: todo el calor que cede el
              vapor lo recibe el aire, porque el intercambiador no pierde nada
              hacia fuera. En exergía es otra cosa: el aire se lleva 108 kW de
              los 1201 que suelta el vapor.
          - valor: '0.910'
            mensaje: |
              Esa es la fracción **destruida**, 1093 entre 1201. El rendimiento
              es la que acaba en el aire.
        pista: |
          $\eta_{ex} = \dfrac{\dot{m}_a\left[c_p\,\Delta T - T_0\,c_p\ln(T_i/T_s)\right]}{\dot{m}_5\left[(h_5-h_6) - T_0\,(s_5-s_6)\right]}$.
        desarrollo: |
          $$
          \dot{m}_a\,\Delta a_{aire} = 459{,}4\cdot 1{,}0045\left(10 - 291\ln\frac{303}{293}\right) = 108{,}0\ \text{kW}
          $$

          $$
          \dot{m}_5\,\Delta a_{vapor} = 6{,}987\cdot(0{,}3\cdot 2201{,}5 - 291\cdot 0{,}3\cdot 5{,}5967) = 1200{,}8\ \text{kW}
          $$

          $$
          \eta_{ex} = \frac{108{,}0}{1200{,}8} = 0{,}090
          $$

          Y $1200{,}8 - 108{,}0 = 1092{,}8\ \text{kW}$ destruidos: cuadra con
          Guy-Stodola.

      - tipo: justificar
        pregunta: Ordena la comparación de los tres sistemas. Una pieza es falsa.
        piezas:
          - texto: >-
              La válvula destruye 843 kW sin producir nada: baja 7 kg/s de vapor
              de 5 a 2 bar, una caída de presión que aprovecharía una turbina.
          - texto: >-
              El intercambiador destruye todavía más, 1093 kW, y rinde un 9 %:
              usa vapor a 120 °C para calentar aire 10 grados, a 25 °C de
              media.
          - texto: >-
              El separador es el que menos destruye, unos 70 kW, y rinde un
              98 %: casi toda la exergía que entra sale en sus dos corrientes.
          - texto: >-
              El separador es el que más exergía destruye, porque mezcla dos
              corrientes a temperaturas muy distintas.
            trampa: true
            mensaje: |
              Es el que **menos** destruye: unos 70 kW, frente a 843 de la
              válvula y 1093 del intercambiador. Mezcla vapor a 171 °C con agua
              a 75, sí, pero las dos corrientes salen a 120 °C, en medio, y eso
              pesa poco al lado de la caída de presión de la válvula o del
              salto de 120 a 25 °C del intercambiador.
    resolucion: |
      **La instalación, sistema por sistema.** El vapor llega a 5 bar y el
      separador está a 2: entre medias hay una válvula de laminación, aunque el
      enunciado no la nombre. Son tres sistemas —válvula, separador e
      intercambiador—, los tres adiabáticos hacia fuera. Referencia:
      $T_0 = 291\ \text{K}$ y, para el agua, líquido a 18 °C,
      $h_0 = 75{,}54$ y $s_0 = 0{,}2678$.

      **La válvula.** A 5 bar y 180 °C, interpolando entre la saturación, a
      151,83 °C, y la fila de 200 °C, con la fracción 0,5848:

      $$
      h_1 = 2748{,}1 + 0{,}5848\cdot(2855{,}8-2748{,}1) = 2811{,}1\ \text{kJ/kg}
      \qquad
      s_1 = 6{,}8207 + 0{,}5848\cdot(7{,}0610-6{,}8207) = 6{,}9612
      $$

      $h_2 = h_1$, y a 2 bar el vapor sigue sobrecalentado, a 170,7 °C, con
      $s_2 = 7{,}3749$:

      $$
      \dot{S}_G = 7\cdot(7{,}3749-6{,}9612) = 2{,}896\ \text{kW/K}
      \qquad
      \dot{E}x_D = 291\cdot 2{,}896 = 842{,}7\ \text{kW}
      $$

      Con las exergías de flujo,
      $a_{f1} = (2811{,}1-75{,}54) - 291\cdot(6{,}9612-0{,}2678) = 787{,}8$ y
      $a_{f2} = 667{,}4\ \text{kJ/kg}$, el rendimiento de la válvula es
      $667{,}4/787{,}8 = 0{,}847$. Las diapositivas dan 2,902 kW/K, 844,4 kW y
      84,7 %, con las entropías del diagrama de Mollier: la misma válvula.

      **El separador.** Con el agua a 75 °C leída como líquido,
      $h_3 = 314{,}03$ y $s_3 = 1{,}0158$, y las salidas saturadas a 2 bar:

      $$
      \dot{m}_5 = \frac{7\cdot 2811{,}1 + 4\cdot 314{,}03 - 11\cdot 504{,}7}{2706{,}2-504{,}7} = 6{,}987\ \text{kg/s}
      \qquad
      \dot{m}_4 = 4{,}013\ \text{kg/s}
      $$

      $$
      \dot{S}_G = 6{,}987\cdot 7{,}1269 + 4{,}013\cdot 1{,}5302 - 7\cdot 7{,}3749 - 4\cdot 1{,}0158 = 0{,}2488\ \text{kW/K}
      \qquad
      \dot{E}x_D = 72{,}4\ \text{kW}
      $$

      Su rendimiento, lo que sale en las dos corrientes entre lo que entra,
      con $a_{f5} = 634{,}67$, $a_{f4} = 61{,}81$ y $a_{f3} = 20{,}83$:
      $(6{,}987\cdot 634{,}67 + 4{,}013\cdot 61{,}81)/(7\cdot 667{,}40 + 4\cdot 20{,}83) = 0{,}985$.

      **Un aviso sobre este número.** La entropía generada del separador es una
      resta de números de 56 kW/K que se anulan hasta dejar 0,25, así que es
      muy sensible a cómo se lee $s_2$: la interpolación lineal de la tabla lo
      deja en 7,3749, y la formulación exacta del agua, en 7,3809. Con la
      exacta salen 67 kW en vez de 72,4. Las dos lecturas son legítimas y el
      paso admite las dos; lo que no cambia es que el separador es, con
      diferencia, el que menos destruye.

      **El intercambiador.** El vapor pasa de $x = 1$ a $x = 0{,}7$ a 2 bar y
      cede

      $$
      \dot{Q} = 6{,}987\cdot 0{,}3\cdot 2201{,}5 = 4614{,}6\ \text{kW}
      \qquad
      \dot{m}_a = \frac{4614{,}6}{1{,}0045\cdot 10} = 459{,}4\ \text{kg/s}
      $$

      $$
      \dot{S}_G = 6{,}987\cdot(-0{,}3\cdot 5{,}5967) + 459{,}4\cdot 1{,}0045\ln\frac{303}{293} = 3{,}755\ \text{kW/K}
      \qquad
      \dot{E}x_D = 1092{,}7\ \text{kW}
      $$

      El vapor suelta 1200,8 kW de exergía y el aire se lleva 108,0: el
      rendimiento es 0,090.

      **Lo que hay que llevarse.** Tres destrucciones de tamaño muy distinto,
      y el orden no es el que sugiere el enunciado. La válvula, 843 kW, tira
      una caída de presión que podía mover una turbina. El intercambiador,
      1093 kW, usa vapor a 120 °C para calentar aire 10 grados. Y el
      separador, que da nombre al ejercicio, apenas destruye unos 70 kW: que
      las dos corrientes acaben a la misma temperatura cuesta poco al lado de
      lo demás.

  - id: ejter-col714-la-instalacion-entera-sistema-por-sistema
    titulo: La instalación entera, sistema por sistema, y la caldera que se lo lleva casi todo
    fuente: >-
      Ejercicio 7.14 de las diapositivas del Tema 7, «Análisis exergético» ·
      Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). Las
      diapositivas traen su resolución, y el desarrollo está contrastado contra
      ella. El enunciado es el de la lámina 66, que añade el dato del líquido
      saturado sin el que no se resuelve, y la única discrepancia es el
      rendimiento exergético de la bomba: 87 % y no el 91,57 % de la lámina 71,
      que no sale ni de sus propios números.
    nivel: practica
    enunciado: |
      Un gasto de $1\ \text{kg/s}$ de vapor a $200\ ^\circ\text{C}$ y
      $10\ \text{bar}$ pasa a través de una válvula de laminación. Esta
      válvula alimenta una cámara de mezcla, donde se mezcla con un gasto de
      agua a $1\ \text{bar}$ y $35\ ^\circ\text{C}$. La mezcla sale en estado
      de líquido saturado y se envía a un generador de vapor, que produce
      vapor sobrecalentado a $500\ ^\circ\text{C}$ y $50\ \text{bar}$ para
      alimentar una turbina de vapor. Antes de entrar en el generador de
      vapor, el agua pasa por un precalentador, donde se precalienta a
      $120\ ^\circ\text{C}$ mediante el vapor que sale de la turbina. La
      turbina de vapor opera con una eficiencia interna del 85 %. Si se
      requiriese una bomba para completar la instalación, esta tendría una
      eficiencia interna del 83 %. La salida de la turbina está a
      $4\ \text{bar}$.

      Utilizando una temperatura de referencia de $15\ ^\circ\text{C}$,
      calcúlese la destrucción de exergía y el rendimiento exergético de cada
      sistema de la instalación. Considérese una temperatura de
      $900\ ^\circ\text{C}$ en el hogar del generador de vapor.

      *Las propiedades del agua y del vapor, de [las tablas de
      vapor](/road-to-ingenieria/ingenieria-termica/tablas/#sobrecalentado),
      como en el examen se sacan del anexo. Como en las diapositivas,
      $P_0 = 1\ \text{bar}$.*
    pide: La exergía destruida y el rendimiento exergético de la válvula, la cámara de mezcla, la bomba, el precalentador, el generador de vapor y la turbina.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado dice «si se requiriese una bomba». ¿Hace falta, y
          dónde?
        opciones:
          - texto: >-
              Sí, entre la cámara de mezcla y el precalentador, para subir el
              agua de 1 a 50 bar
            correcta: true
            mensaje: |
              Eso es. La cámara trabaja a 1 bar —el agua entra a esa presión— y
              el generador de vapor produce vapor a 50 bar. Calentar no sube la
              presión de un líquido: hay que bombearlo, y la bomba va antes del
              precalentador, que ya trabaja a 50 bar.
          - texto: No, porque el generador de vapor sube la presión al calentar el agua
            mensaje: |
              Un generador de vapor calienta a presión constante: el agua entra
              a la presión a la que sale el vapor. Si el vapor sale a 50 bar,
              alguien ha tenido que subir el agua a 50 bar antes.
          - texto: Sí, pero después del generador, para mover el vapor hasta la turbina
            mensaje: |
              El vapor sale del generador a 50 bar y va a la turbina, que
              descarga a 4: fluye solo, cuesta abajo. Una bomba mueve líquido,
              y comprimir vapor costaría un compresor y muchísimo más trabajo.
          - texto: No, porque la válvula ya da al agua la presión que necesita
            mensaje: |
              Una válvula de laminación hace lo contrario: **baja** la presión.
              Pone el vapor de 10 a 1 bar para que entre en la cámara, y el
              agua sale de ella a 1 bar.

      - tipo: calcular
        titulo: El agua que entra en la cámara de mezcla
        pregunta: |
          El vapor laminado entra en la cámara con
          $h_2 = h_1 = 2828{,}3\ \text{kJ/kg}$ y la mezcla sale como líquido
          saturado a 1 bar. ¿Cuánta agua a 35 °C hace falta?
        respuesta:
          tipo: magnitud
          valor: '8.900 kg/s'
          tolerancia: 0.01
          formato: un gasto másico, con su unidad
        distractores:
          - valor: '9.900 kg/s'
            mensaje: |
              Ese es el gasto que **sale** de la cámara, el agua más el
              kilogramo de vapor. La que entra a 35 °C es uno menos.
          - valor: '8.711 kg/s'
            mensaje: |
              Has tomado el vapor como saturado a 10 bar, $h'' = 2777{,}1$.
              Entra a 200 °C, sobrecalentado, con $h = 2828{,}3$: trae más
              energía, y hace falta más agua fría para dejarlo en líquido
              saturado.
          - valor: '0.1124 kg/s'
            mensaje: |
              Has despejado el cociente del revés. El balance es
              $1\cdot(h_2-h_4) = \dot{m}_3\,(h_4-h_3)$: un kilo de vapor tiene
              que calentar muchos kilos de agua fría.
        pista: |
          Cámara adiabática: $1\cdot h_2 + \dot{m}_3\,h_3 = (1+\dot{m}_3)\,h'$,
          con $h' = 417{,}50$ a 1 bar y $h_3 = 146{,}63\ \text{kJ/kg}$, el
          líquido a 35 °C.
        desarrollo: |
          $$
          \dot{m}_3 = \frac{2828{,}3-417{,}50}{417{,}50-146{,}63} = 8{,}900\ \text{kg/s}
          $$

          Salen $\dot{m}_4 = 9{,}900\ \text{kg/s}$, y ese es el gasto de todo lo
          que viene detrás: bomba, precalentador, generador y turbina.

      - tipo: calcular
        titulo: La exergía destruida en la válvula
        pregunta: |
          A 1 bar con $h = 2828{,}3$, el vapor tiene $s_2 = 7{,}7302$; a la
          entrada, $s_1 = 6{,}6955$. ¿Cuánta exergía destruye la válvula?
        respuesta:
          tipo: magnitud
          valor: '298.0 kW'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '901.7 kW'
            mensaje: |
              Esa es toda la exergía que **entra** en la válvula. Sale con
              603,7 kW todavía: lo destruido es la diferencia, un tercio.
          - valor: '15.5 kW'
            mensaje: |
              Has multiplicado por 15, la temperatura de referencia en grados
              Celsius. Guy-Stodola va en kelvin: 288.
        pista: |
          $\dot{S}_G = \dot{m}_1\,(s_2-s_1)$ y $\dot{E}x_D = T_0\,\dot{S}_G$.
        desarrollo: |
          $$
          \dot{E}x_D = 288\cdot 1\cdot(7{,}7302-6{,}6955) = 298{,}0\ \text{kW}
          $$

          Su rendimiento exergético, lo que sale entre lo que entra, es
          $603{,}7/901{,}7 = 0{,}6695$: la válvula tira un tercio de la exergía
          del vapor sin sacar nada a cambio.

      - tipo: calcular
        titulo: El rendimiento exergético de la bomba
        pregunta: |
          La bomba sube los 9,9 kg/s de líquido saturado de 1 a 50 bar con un
          rendimiento interno del 83 %. ¿Cuál es su rendimiento exergético?
        respuesta:
          tipo: numero
          valor: '0.870'
          tolerancia: 0.01
          formato: una fracción entre 0 y 1
        distractores:
          - valor: '0.83'
            mensaje: |
              Ese es el rendimiento **interno**, y es dato. El exergético sale
              mayor: el trabajo que se pierde calienta el agua, y a 100 °C ese
              calentamiento todavía vale algo.
          - valor: '0.130'
            mensaje: |
              Esa es la fracción **destruida**. El rendimiento es lo que gana el
              agua en exergía entre la potencia que consume la bomba.
        pista: |
          $w_s$ sale de la tabla de 50 bar con $s = s' = 1{,}3028$, o de
          $v'\,\Delta P$; $w = w_s/0{,}83$. Y
          $\eta_{ex} = \dfrac{w - T_0\,(s_5-s_4)}{w}$.
        desarrollo: |
          Con la tabla de 50 bar, entre 80 y 100 °C, la entalpía con
          $s = 1{,}3028$ es 422,63, y

          $$
          w_s = 422{,}63 - 417{,}50 = 5{,}13\ \text{kJ/kg}
          \qquad
          w = \frac{5{,}13}{0{,}83} = 6{,}18\ \text{kJ/kg}
          $$

          El agua sale con $h_5 = 417{,}50 + 6{,}18 = 423{,}68$, que en la tabla
          de 50 bar, entre 100 y 120 °C, da $s_5 = 1{,}3056$:

          $$
          \eta_{ex} = \frac{6{,}18 - 288\cdot(1{,}3056-1{,}3028)}{6{,}18} = 0{,}870
          $$

          Con $v'\,\Delta P = 0{,}0010432\cdot 4900 = 5{,}11\ \text{kJ/kg}$ sale
          0,873: lo mismo. Aquí la tabla sí sirve, al revés que en la bomba
          del ejercicio 7.11, porque la salida isentrópica cae a 99,95 °C, casi
          encima de la fila de 100 °C, y no en medio de un intervalo de 20
          grados.

          Las diapositivas dan 91,57 %, pero con sus propias exergías,
          $(488{,}81 - 435{,}32)/61{,}37$, sale 0,872: el 91,57 no se reproduce
          por ningún camino.

      - tipo: calcular
        titulo: La exergía destruida en el generador de vapor
        pregunta: |
          El agua entra al generador a 50 bar y 120 °C y sale a 500 °C; el
          calor viene de un hogar a 900 °C. ¿Cuánta exergía se destruye?
        respuesta:
          tipo: magnitud
          valor: '8436 kW'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '15552 kW'
            mensaje: |
              Has dado por destruido el calor entero menos lo que gana el agua,
              como si el calor no tuviera exergía. Del hogar a 900 °C sale con
              mucha: $(1 - 288/1173)\cdot 28.983 = 21.867\ \text{kW}$.
          - valor: '6278 kW'
            mensaje: |
              Has puesto el hogar a 900 en la entropía del calor, en grados
              Celsius. En $\dot{Q}/T$ la temperatura es absoluta: 1173 K.
        pista: |
          $\dot{Q} = \dot{m}\,(h_7-h_6)$,
          $\dot{S}_G = \dot{m}\,(s_7-s_6) - \dot{Q}/T_{hogar}$ y
          $\dot{E}x_D = T_0\,\dot{S}_G$. En la tabla, $h_6 = 507{,}19$ y
          $s_6 = 1{,}5236$; $h_7 = 3434{,}7$ y $s_7 = 6{,}9781$.
        desarrollo: |
          $$
          \dot{Q} = 9{,}900\cdot(3434{,}7-507{,}19) = 28.983\ \text{kW}
          $$

          $$
          \dot{S}_G = 9{,}900\cdot(6{,}9781-1{,}5236) - \frac{28.983}{1173} = 29{,}29\ \text{kW/K}
          $$

          $$
          \dot{E}x_D = 288\cdot 29{,}29 = 8436\ \text{kW}
          $$

          El calor sale del hogar con
          $(1-288/1173)\cdot 28.983 = 21.867\ \text{kW}$ de exergía y el agua
          gana 13.431: el rendimiento es 0,614.

      - tipo: calcular
        titulo: El rendimiento exergético de la turbina
        pregunta: |
          La turbina expande los 9,9 kg/s de 50 bar y 500 °C a 4 bar con un
          rendimiento interno del 85 %. ¿Cuál es su rendimiento exergético?
        respuesta:
          tipo: numero
          valor: '0.899'
          tolerancia: 0.005
          formato: una fracción entre 0 y 1
        distractores:
          - valor: '0.85'
            mensaje: |
              Ese es el rendimiento **interno**, y es dato. El exergético
              compara el trabajo con la exergía que pierde el vapor, no con el
              trabajo isentrópico, y sale mayor.
          - valor: '1.058'
            mensaje: |
              Has puesto arriba el trabajo **isentrópico**, 660,7 kJ/kg. El
              producto de la turbina es el trabajo que da de verdad, 561,6.
          - valor: '0.394'
            mensaje: |
              Has dividido el trabajo entre toda la exergía del vapor a la
              **entrada**. El vapor sale todavía con mucha, 802 kJ/kg, que se
              aprovecha en el precalentador; lo que cuenta es lo que pierde en
              la turbina.
        pista: |
          $h_{8s}$ en la tabla de 4 bar con $s = 6{,}9781$;
          $w = 0{,}85\,(h_7-h_{8s})$; $s_8$ con $h_8$ en la misma tabla; y
          $\eta_{ex} = \dfrac{w}{(h_7-h_8) - T_0\,(s_7-s_8)}$.
        desarrollo: |
          A 4 bar, $s = 6{,}9781$ cae entre 150 y 200 °C:

          $$
          h_{8s} = 2752{,}8 + \frac{6{,}9781-6{,}9306}{7{,}1723-6{,}9306}\cdot 108{,}1 = 2774{,}0\ \text{kJ/kg}
          $$

          $$
          w = 0{,}85\cdot(3434{,}7-2774{,}0) = 561{,}6\ \text{kJ/kg}
          \qquad
          h_8 = 3434{,}7 - 561{,}6 = 2873{,}1\ \text{kJ/kg}
          $$

          Con $h_8$, entre 200 y 250 °C a 4 bar, $s_8 = 7{,}1969$:

          $$
          \eta_{ex} = \frac{561{,}6}{561{,}6 - 288\cdot(6{,}9781-7{,}1969)} = 0{,}899
          $$

      - tipo: justificar
        pregunta: Ordena el balance de la instalación. Una pieza es falsa.
        piezas:
          - texto: >-
              Se destruyen 9,66 MW en total, y el generador de vapor se lleva
              8,44: casi nueve de cada diez.
          - texto: >-
              Es porque pasa el calor de un hogar a 900 °C a agua que está entre
              120 y 500 °C: cientos de grados de salto.
          - texto: >-
              Detrás van la turbina, 624 kW, la válvula, 298, la cámara, 194,
              el precalentador, 97, y la bomba, 8.
          - texto: >-
              La turbina es la que más exergía destruye, porque es la que más
              energía mueve.
            trampa: true
            mensaje: |
              Mueve mucha energía, 5,56 MW de trabajo, y destruye solo 624 kW:
              rinde un 90 % exergético. Lo que decide cuánto se destruye no es
              cuánta energía pasa, sino a través de qué salto: el generador de
              vapor pasa 29 MW de calor a través de cientos de grados, y ahí se
              van 8,44 MW.
    resolucion: |
      **La instalación.** El vapor se lamina de 10 a 1 bar, se mezcla con agua
      a 35 °C y sale como líquido saturado a 1 bar; una bomba lo sube a 50 bar,
      el precalentador lo calienta hasta 120 °C con el vapor que sale de la
      turbina, el generador lo convierte en vapor a 500 °C y la turbina lo
      expande hasta 4 bar. Referencia: $T_0 = 288\ \text{K}$ y, para el agua,
      líquido a 15 °C, $h_0 = 62{,}98$ y $s_0 = 0{,}2245$. Las exergías de
      flujo, $a_f = (h-h_0) - T_0\,(s-s_0)$.

      **La válvula.** $h_2 = h_1 = 2828{,}3$; a 1 bar, entre 150 y 200 °C,
      $s_2 = 7{,}7302$:

      $$
      a_{f1} = (2828{,}3-62{,}98) - 288\cdot(6{,}6955-0{,}2245) = 901{,}7\ \text{kJ/kg}
      \qquad
      a_{f2} = (2828{,}3-62{,}98) - 288\cdot(7{,}7302-0{,}2245) = 603{,}7\ \text{kJ/kg}
      $$

      $$
      \dot{E}x_D = 288\cdot(7{,}7302-6{,}6955) = 298{,}0\ \text{kW}
      \qquad
      \eta_{ex} = \frac{603{,}7}{901{,}7} = 0{,}6695
      $$

      **La cámara de mezcla.**

      $$
      \dot{m}_3 = \frac{2828{,}3-417{,}50}{417{,}50-146{,}63} = 8{,}900\ \text{kg/s}
      $$

      $$
      \dot{S}_G = 9{,}900\cdot 1{,}3028 - 7{,}7302 - 8{,}900\cdot 0{,}50513 = 0{,}6719\ \text{kW/K}
      \qquad
      \dot{E}x_D = 288\cdot 0{,}6719 = 193{,}5\ \text{kW}
      $$

      Su rendimiento, la exergía que sale entre la que entra:
      $435{,}2/(603{,}7 + 25{,}1) = 0{,}692$.

      **La bomba.** $w_s = 5{,}13$ y $w = 6{,}18\ \text{kJ/kg}$, 61,2 kW para
      los 9,9 kg/s, y $s_5 = 1{,}3056$:

      $$
      \dot{E}x_D = 288\cdot 9{,}900\cdot(1{,}3056-1{,}3028) = 7{,}98\ \text{kW}
      \qquad
      \eta_{ex} = 0{,}870
      $$

      **El precalentador.** Recibe el agua con $h_5 = 423{,}68$ y la deja a
      120 °C, $h_6 = 507{,}19$: son
      $9{,}900\cdot(507{,}19-423{,}68) = 826{,}7\ \text{kW}$ que le quita al
      vapor de escape, que pasa de $h_8 = 2873{,}1$ a $h_9 = 2789{,}6$, con
      $s_9 = 7{,}0130$:

      $$
      \dot{S}_G = 9{,}900\cdot(1{,}5236-1{,}3056+7{,}0130-7{,}1969) = 0{,}3376\ \text{kW/K}
      \qquad
      \dot{E}x_D = 288\cdot 0{,}3376 = 97{,}2\ \text{kW}
      $$

      Su rendimiento, lo que gana el agua entre lo que pierde el vapor:
      $205{,}1/302{,}3 = 0{,}678$.

      **El generador de vapor.**

      $$
      \dot{Q} = 9{,}900\cdot(3434{,}7-507{,}19) = 28.983\ \text{kW}
      \qquad
      \dot{S}_G = 9{,}900\cdot(6{,}9781-1{,}5236) - \frac{28.983}{1173} = 29{,}29\ \text{kW/K}
      $$

      $$
      \dot{E}x_D = 288\cdot 29{,}29 = 8436\ \text{kW}
      \qquad
      \eta_{ex} = \frac{13.431}{21.867} = 0{,}614
      $$

      **La turbina.** $\dot{W} = 9{,}900\cdot 561{,}6 = 5560\ \text{kW}$, y

      $$
      \dot{E}x_D = 288\cdot 9{,}900\cdot(7{,}1969-6{,}9781) = 623{,}8\ \text{kW}
      \qquad
      \eta_{ex} = 0{,}899
      $$

      **El balance, junto.**

      | sistema | $\dot{E}x_D$ (kW) | $\eta_{ex}$ |
      |---|---|---|
      | válvula | 298,0 | 67,0 % |
      | cámara de mezcla | 193,5 | 69,2 % |
      | bomba | 8,0 | 87,0 % |
      | precalentador | 97,2 | 67,8 % |
      | generador de vapor | 8436 | 61,4 % |
      | turbina | 623,8 | 89,9 % |

      Coinciden con las diapositivas salvo en la bomba: la lámina 71 da un
      rendimiento del 91,57 %, y con sus propios números,
      $(488{,}81-435{,}32)/61{,}37$, sale el 87,2 %.

      **Lo que hay que llevarse.** El generador de vapor se lleva casi nueve de
      cada diez kilovatios destruidos, y no por rendir mal —su 61 % se parece
      al de la válvula o al del precalentador—, sino por el tamaño de lo que
      pasa por él: 29 MW de calor cayendo cientos de grados. Por eso, para
      mejorar una instalación así, lo primero es acercar la temperatura del
      agua a la del hogar, y la bomba, con 8 kW, es lo último que hay que
      mirar.
