ejercicios:
  - id: ejter-la-tobera-y-lo-que-no-se-desprecia
    titulo: La tobera, donde la energía cinética es el ejercicio
    fuente: >-
      Ejercicio de tobera propuesto en el Tema 4 · Ingeniería Térmica, Escuela
      de Ingeniería de Gipuzkoa (UPV/EHU). El material publica los resultados
      —688,2 m/s, 31,58 kg/s y 0,023 m²—, y el desarrollo está reconstruido y
      comprobado contra ellos.
    nivel: practica
    enunciado: |
      En una tobera entra un fluido con una entalpía de
      $3.025\ \text{kJ/kg}$ y una velocidad de $60\ \text{m/s}$. La entalpía a
      la salida es de $2.790\ \text{kJ/kg}$.

      a) La velocidad del chorro a la salida.

      b) El gasto de fluido, si la sección de entrada es de
      $0{,}1\ \text{m}^{2}$ y el volumen específico a la entrada es de
      $0{,}19\ \text{m}^{3}/\text{kg}$.

      c) La sección de salida, si el volumen específico allí es de
      $0{,}5\ \text{m}^{3}/\text{kg}$.

      d) ¿El fluido es compresible o incompresible?
    pide: La velocidad de salida, el gasto, la sección de salida y si el fluido es compresible.
    pasos:
      - tipo: reconocer
        pregunta: |
          De la ecuación de la energía en régimen estacionario, ¿qué términos
          sobreviven en una tobera?
        opciones:
          - texto: >-
              Solo el salto de entalpía y el de energía cinética: una tobera
              no intercambia calor ni trabajo, y no hay desnivel
            correcta: true
            mensaje: |
              Eso es. Y fíjate en que aquí la energía cinética **no** se
              desprecia: es lo único que queda al otro lado, y es lo que el
              aparato existe para producir.
          - texto: >-
              Solo el salto de entalpía, porque la energía cinética siempre se
              desprecia frente a ella
            mensaje: |
              Se desprecia en turbinas, compresores y calderas, donde los
              saltos de entalpía son de cientos de kJ/kg y las velocidades de
              unas decenas de m/s. En una tobera pasa lo contrario: el salto
              de entalpía se convierte **entero** en velocidad, y si lo tachas
              no queda ecuación.
          - texto: >-
              El salto de entalpía y el trabajo de eje, porque la tobera
              acelera el fluido y eso es trabajo
            mensaje: |
              Acelerar no es trabajo de eje. El trabajo de eje entra por un
              árbol que gira, y una tobera no tiene partes móviles: es un tubo
              que se estrecha. Lo que hace es convertir entalpía en energía
              cinética dentro del propio fluido.

      - tipo: calcular
        titulo: La velocidad de salida
        pregunta: |
          ¿A qué velocidad sale el chorro?
        respuesta:
          tipo: magnitud
          valor: '688.2 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '488.5 m/s'
            mensaje: |
              Te has dejado el factor 2. La energía cinética específica es
              $c^{2}/2$, así que al despejar la velocidad ese 2 pasa
              multiplicando al salto de entalpía, no dividiendo.
          - valor: '63.8 m/s'
            mensaje: |
              Un factor mil: has metido el salto de entalpía en kJ/kg donde la
              fórmula lo quiere en J/kg. 235 kJ/kg son 235.000 J/kg, y de ahí
              sale una velocidad de cientos de metros por segundo, que es lo
              que hace una tobera.
        pista: |
          $\frac{c_2^{2}-c_1^{2}}{2} = h_1 - h_2$, con las entalpías en J/kg.
        desarrollo: |
          $$
          c_2 = \sqrt{2\,(h_1 - h_2) + c_1^{2}}
          = \sqrt{2\cdot 235.000 + 60^{2}}
          $$
          $$
          = \sqrt{473.600} = 688{,}2\ \frac{\text{m}}{\text{s}}
          $$

          Por encima de la velocidad del sonido en el aire. No es casualidad:
          las toberas que convierten saltos de entalpía de este tamaño son
          justamente las supersónicas.

          Un apunte sobre los 60 m/s de entrada: despreciarlos daría 685,6 m/s,
          un 0,4 % menos, y sería una respuesta perfectamente válida. Es lo
          normal en una tobera —la velocidad de entrada casi nunca cuenta— y
          por eso las transparencias escriben directamente
          $c_2^{2}/2 \simeq h_1 - h_2$. Aquí se han conservado porque el
          enunciado los da y no cuesta nada.

      - tipo: calcular
        titulo: El gasto
        pregunta: |
          Con la sección y el volumen específico de la entrada, ¿cuál es el
          gasto másico?
        respuesta:
          tipo: magnitud
          valor: '31.58 kg/s'
          tolerancia: 0.02
          formato: un caudal másico, con su unidad
        distractores:
          - valor: '1.14 kg/s'
            mensaje: |
              Has multiplicado por el volumen específico en vez de dividir. La
              continuidad es $\dot m = Ac/v$: cuanto más voluminoso es cada
              kilogramo, **menos** kilogramos caben por segundo en la misma
              sección.
          - valor: '12 kg/s'
            mensaje: |
              Has mezclado secciones: el área y la velocidad son de la
              entrada, y el volumen específico que has usado, 0,5 m³/kg, es el
              de la salida. Cada sección se evalúa con sus tres datos.

              Un aviso de paso: si lo que te ha salido es $A\,c = 6$, eso es
              el caudal **volumétrico** en m³/s, y la unidad lo delata. Falta
              dividir por el volumen específico para pasarlo a másico.
        pista: |
          $\dot m = A_1 c_1 / v_1$, con los datos de la entrada.
        desarrollo: |
          $$
          \dot m = \frac{A_1\,c_1}{v_1} = \frac{0{,}1\cdot 60}{0{,}19}
          = 31{,}58\ \frac{\text{kg}}{\text{s}}
          $$

      - tipo: calcular
        titulo: La sección de salida
        pregunta: |
          El gasto es el mismo a la salida. ¿Qué sección hace falta allí?
        respuesta:
          tipo: magnitud
          valor: '0.0229 m2'
          tolerancia: 0.02
          formato: un área, con su unidad
        distractores:
          - valor: '0.1 m2'
            mensaje: |
              Esa es la sección de **entrada**. Que el gasto se conserve no
              significa que la sección lo haga: el fluido sale once veces más
              rápido y ocupando dos veces y media más volumen por kilogramo,
              y la sección tiene que ajustarse a las dos cosas.
          - valor: '0.0087 m2'
            mensaje: |
              Has usado el volumen específico de la entrada. Cada tramo de la
              tobera se calcula con las propiedades de su propia sección, y
              aquí el fluido se ha expandido de 0,19 a 0,5 m³/kg.
        pista: |
          De $\dot m = A_2 c_2 / v_2$, despeja el área con los datos de la
          salida.
        desarrollo: |
          $$
          A_2 = \frac{\dot m\,v_2}{c_2} = \frac{31{,}58\cdot 0{,}5}{688{,}2}
          = 0{,}0229\ \text{m}^{2}
          $$

          Menos de una cuarta parte de la sección de entrada. La tobera se estrecha, y
          eso es lo que la hace una tobera.

      - tipo: justificar
        pregunta: Ordena la respuesta al apartado d). Una pieza es falsa.
        piezas:
          - texto: >-
              El volumen específico pasa de 0,19 a 0,5 m³/kg entre la entrada
              y la salida.
          - texto: >-
              Es decir, el mismo kilogramo de fluido ocupa dos veces y media
              más volumen al final que al principio.
          - texto: >-
              Un fluido incompresible mantendría su volumen específico, así
              que este no lo es: es compresible.
          - texto: >-
              Y como el fluido es compresible, la ecuación de continuidad
              $\dot m = Ac/v$ deja de valer y hay que corregirla.
            trampa: true
            mensaje: |
              La continuidad vale siempre, y precisamente por eso está escrita
              con el volumen específico y no con una densidad constante: cada
              sección se evalúa con su propio $v$. Lo que dejaría de valer con
              un fluido compresible es la forma simplificada $A_1c_1 = A_2c_2$,
              que es la de los líquidos.
    resolucion: |
      **El planteamiento.** Una tobera no intercambia calor ni trabajo de eje,
      y no hay desnivel, así que de la ecuación de la energía queda:

      $$
      \frac{c_2^{2} - c_1^{2}}{2} = h_1 - h_2
      $$

      **a) La velocidad de salida.** Con el salto de entalpía en J/kg:

      $$
      c_2 = \sqrt{2\cdot 235.000 + 3.600} = 688{,}2\ \frac{\text{m}}{\text{s}}
      $$

      **b) El gasto.** Por continuidad en la entrada:

      $$
      \dot m = \frac{0{,}1\cdot 60}{0{,}19} = 31{,}58\ \frac{\text{kg}}{\text{s}}
      $$

      **c) La sección de salida.** El mismo gasto, con las propiedades de allí:

      $$
      A_2 = \frac{31{,}58\cdot 0{,}5}{688{,}2} = 0{,}0229\ \text{m}^{2}
      $$

      **d) Compresible.** El volumen específico se multiplica por 2,6 entre la
      entrada y la salida, así que la densidad cambia y el fluido es
      compresible. Con esos valores —0,19 y 0,5 m³/kg— y ese salto de
      entalpía, lo más probable es que sea vapor de agua.

  - id: ejter-cuanta-agua-para-condensar-un-kilo
    titulo: Cuánta agua hace falta para condensar un kilo de vapor
    fuente: >-
      Apartado a) del ejercicio 2 de la convocatoria ordinaria de enero de
      2026 · Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU).
      El examen publica su resolución oficial, y el desarrollo está
      contrastado contra ella.
    nivel: examen
    enunciado: |
      A un condensador que trabaja a $0{,}5\ \text{bar}$ entran
      $0{,}7\ \text{kg/s}$ de vapor de agua con un volumen específico de
      $3\ \text{m}^{3}/\text{kg}$. El condensado sale como líquido saturado.
      El condensador usa un circuito de agua más fría para condensar el vapor;
      **ambas corrientes no se mezclan**. El agua de refrigeración entra a
      18 °C y sale a 35 °C.

      Calcúlese el gasto de agua de refrigeración necesaria.

      Datos de la tabla de saturación a 0,5 bar:
      $v' = 0{,}0010299$, $v'' = 3{,}24\ \text{m}^{3}/\text{kg}$,
      $h' = 340{,}54$, $h'' = 2645{,}2\ \text{kJ/kg}$. Para el agua líquida,
      $c_p = 4{,}186\ \text{kJ/(kg·K)}$.
    pide: El gasto másico del circuito de refrigeración.
    pasos:
      - tipo: reconocer
        pregunta: |
          Si el volumen de control abarca el condensador entero, ¿cuánto vale
          el calor que cruza su frontera?
        opciones:
          - texto: >-
              Cero: el calor pasa de una corriente a la otra **dentro** de la
              frontera, así que no la atraviesa
            correcta: true
            mensaje: |
              Exacto, y es lo que hace el ejercicio resoluble sin conocer
              ninguna potencia térmica. Si la frontera encerrara solo el
              vapor, entonces sí cruzaría, y aparecería un $\dot Q$ que
              habría que calcular.
          - texto: >-
              Es el calor latente de condensación del vapor, que sí sale del
              volumen de control
            mensaje: |
              Sale del vapor, pero no del volumen de control: se lo lleva el
              agua de refrigeración, que también está dentro. Cruzar la
              frontera es otra cosa que cambiar de corriente.
          - texto: >-
              No se puede saber, porque el enunciado no da la potencia del
              condensador
            mensaje: |
              No hace falta el dato porque el término vale cero por
              construcción. Ese es justamente el criterio para elegir la
              frontera: la que hace que el dato que falta no aparezca en la
              ecuación.

      - tipo: calcular
        titulo: El título del vapor a la entrada
        pregunta: |
          Con $v_1 = 3$ y los valores de saturación a 0,5 bar, ¿cuál es el
          título del vapor que entra?
        respuesta:
          tipo: numero
          valor: '0.926'
          tolerancia: 0.004
          formato: un número entre 0 y 1
        distractores:
          - valor: '0.0741'
            mensaje: |
              Has calculado la fracción de líquido. El título mide vapor, y
              este vapor entra casi seco: le queda un 7 % de líquido, no un
              93 %.
          - valor: '1'
            mensaje: |
              No entra seco. Su volumen específico, 3 m³/kg, es menor que el
              del vapor saturado seco a esa presión, 3,24: está **dentro** de
              la campana, aunque cerca del borde derecho.
        pista: |
          $x = (v - v')/(v'' - v')$.
        desarrollo: |
          $$
          x_1 = \frac{3 - 0{,}0010299}{3{,}24 - 0{,}0010299} = 0{,}926
          $$

      - tipo: calcular
        titulo: La entalpía a la entrada
        pregunta: |
          ¿Cuál es la entalpía del vapor que entra?
        respuesta:
          tipo: magnitud
          valor: '2474.4 kJ/kg'
          tolerancia: 0.02
          formato: una energía específica, con su unidad
        distractores:
          - valor: '2645.2 kJ/kg'
            mensaje: |
              Esa es la del vapor saturado **seco**, que sería el caso de
              título 1. Con título 0,926 la entalpía es la media ponderada de
              las dos fases, y sale algo menor.
          - valor: '340.54 kJ/kg'
            mensaje: |
              Esa es la del líquido saturado, que es la entalpía de **salida**,
              no la de entrada. El condensador convierte lo uno en lo otro.
        pista: |
          $h = x\,h'' + (1-x)\,h'$.
        desarrollo: |
          $$
          h_1 = 0{,}9259\cdot 2645{,}2 + 0{,}0741\cdot 340{,}54
          = 2474{,}4\ \frac{\text{kJ}}{\text{kg}}
          $$

          Con el título redondeado a tres cifras, 0,926, saldrían 2474,7: dos
          décimas de diferencia que no cambian nada aquí, pero que conviene ver
          para saber por qué el examen arrastra el título con cuatro.

          Y la de salida es directa, porque el condensado sale como líquido
          saturado: $h_2 = h' = 340{,}54\ \text{kJ/kg}$.

      - tipo: calcular
        titulo: El gasto de refrigeración
        pregunta: |
          ¿Cuántos kilogramos por segundo de agua de refrigeración hacen
          falta?
        respuesta:
          tipo: magnitud
          valor: '20.99 kg/s'
          tolerancia: 0.02
          formato: un caudal másico, con su unidad
        distractores:
          - valor: '-20.99 kg/s'
            mensaje: |
              El signo. Los dos paréntesis son negativos —el vapor pierde
              entalpía, y el agua entra más fría de lo que sale—, así que el
              cociente es positivo. Un gasto negativo no significa nada.
          - valor: '0.7 kg/s'
            mensaje: |
              Ese es el gasto de vapor. No tienen por qué coincidir, y de
              hecho no coinciden ni de lejos: condensar un kilo de vapor
              libera unos 2.130 kJ y calentar un kilo de agua diecisiete
              grados absorbe 71.
        pista: |
          Del balance $\dot m_1(h_2-h_1) + \dot m_{H_2O}(h_{out}-h_{in}) = 0$,
          con el modelo incompresible para el agua líquida.
        desarrollo: |
          El agua de refrigeración está a una presión no mucho mayor que la
          atmosférica, así que se le aplica el modelo de sustancia
          incompresible:

          $$
          h_{in} - h_{out} = c_p\,(\theta_{in} - \theta_{out})
          = 4{,}186\cdot(18 - 35) = -71{,}16\ \frac{\text{kJ}}{\text{kg}}
          $$

          $$
          \dot m_{H_2O} = \frac{\dot m_1\,(h_2 - h_1)}{h_{in} - h_{out}}
          = \frac{0{,}7\cdot(340{,}54 - 2474{,}4)}{-71{,}16}
          = 20{,}99\ \frac{\text{kg}}{\text{s}}
          $$

      - tipo: justificar
        pregunta: Ordena por qué salen treinta veces más kilos de agua. Una pieza es falsa.
        piezas:
          - texto: >-
              Cada kilogramo de vapor cede 2.134 kJ al condensarse, que es casi
              todo calor latente de cambio de fase.
          - texto: >-
              Cada kilogramo de agua de refrigeración absorbe
              $4{,}186\cdot 17 = 71$ kJ, porque solo cambia de temperatura y
              no de fase.
          - texto: >-
              El cociente entre los dos números es 30, y ese es el factor
              entre los dos gastos.
          - texto: >-
              Y saldría lo mismo con cualquier otro salto térmico del agua,
              porque el calor que hay que evacuar no cambia.
            trampa: true
            mensaje: |
              El calor a evacuar no cambia, pero el gasto sí: es ese calor
              **dividido** por lo que absorbe cada kilogramo, y eso depende
              del salto térmico. Con un salto de 34 grados en vez de 17 harían
              falta la mitad de kilos. Por eso el salto térmico del circuito
              de refrigeración es una decisión de diseño y no un dato
              caprichoso.
    resolucion: |
      **La frontera, primero.** Con el volumen de control sobre el condensador
      entero, el calor pasa de una corriente a la otra por dentro y no cruza:
      $\dot Q = 0$. Tampoco hay trabajo. Queda un balance entre las dos
      corrientes, que no se mezclan:

      $$
      \dot m_1\,(h_2 - h_1) + \dot m_{H_2O}\,(h_{out} - h_{in}) = 0
      $$

      **El vapor, por tablas.** Su volumen específico, 3 m³/kg, cae entre
      $v'$ y $v''$, así que hay dos fases:

      $$
      x_1 = \frac{3 - 0{,}0010299}{3{,}24 - 0{,}0010299} = 0{,}926
      \qquad
      h_1 = 2474{,}4\ \frac{\text{kJ}}{\text{kg}}
      $$

      Y a la salida, líquido saturado: $h_2 = h' = 340{,}54\ \text{kJ/kg}$.

      **El agua, por el modelo incompresible.** Está lejos de la saturación, y
      para un líquido así $\Delta h = c_p\,\Delta\theta$ es exacto de sobra:

      $$
      h_{in} - h_{out} = 4{,}186\cdot(18-35) = -71{,}16\ \frac{\text{kJ}}{\text{kg}}
      $$

      **El gasto.**

      $$
      \dot m_{H_2O} = \frac{0{,}7\cdot(340{,}54 - 2474{,}4)}{-71{,}16}
      = 20{,}99\ \frac{\text{kg}}{\text{s}}
      $$

      **La comprobación que da sentido al número.** Treinta veces más agua que
      vapor no es un error: condensar libera calor latente, y calentar sin
      cambiar de fase solo consume calor sensible. Los 2.134 kJ que suelta un
      kilo de vapor, repartidos a 71 kJ por kilo de agua, dan exactamente esos
      treinta.

  - id: ejter-la-bomba-que-consume-seis-kilovatios
    titulo: La bomba, y el signo de un trabajo que entra
    fuente: >-
      Apartado del ejercicio 2 de la convocatoria ordinaria de enero de 2026 ·
      Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen publica su resolución oficial, y el desarrollo está contrastado
      contra ella.
    nivel: examen
    enunciado: |
      El condensado del ejercicio anterior sale como líquido saturado a
      $0{,}5\ \text{bar}$, con $h_2 = 340{,}54\ \text{kJ/kg}$ y un gasto de
      $\dot m = 0{,}7\ \text{kg/s}$, y alimenta una bomba **adiabática** que
      eleva la presión hasta 50 bar, consumiendo para ello $6\ \text{kW}$.

      Calcúlese la entalpía del agua a la salida de la bomba.
    pide: La entalpía en la sección de salida de la bomba.
    pasos:
      - tipo: reconocer
        pregunta: |
          La bomba **consume** 6 kW. ¿Con qué signo entra ese dato?
        opciones:
          - texto: >-
              $\dot W = -6\ \text{kW}$, porque el trabajo entra al volumen de
              control y el convenio cuenta como positivo el que sale
            correcta: true
            mensaje: |
              Eso es, y es el mismo convenio del sistema cerrado: el trabajo
              es positivo cuando lo hace el sistema. Una bomba no lo hace, lo
              recibe.
          - texto: >-
              $\dot W = +6\ \text{kW}$, porque el enunciado dice que consume
              esa potencia
            mensaje: |
              El enunciado da el módulo y la dirección con palabras. Con el
              signo cambiado la entalpía saldría **menor** que la de entrada,
              es decir, el agua saldría de la bomba con menos energía que
              cuando entró.
          - texto: >-
              Depende de si la bomba es reversible o no
            mensaje: |
              El signo lo fija hacia dónde va la energía, no cómo de bien va.
              El rendimiento de la bomba es otra pregunta, y se contesta
              después comparando esta entalpía con la del proceso ideal.

      - tipo: calcular
        titulo: La entalpía de salida
        pregunta: |
          Con el balance de energía de la bomba, ¿cuál es $h_3$?
        respuesta:
          tipo: magnitud
          valor: '349.11 kJ/kg'
          tolerancia: 0.02
          formato: una energía específica, con su unidad
        distractores:
          - valor: '331.97 kJ/kg'
            mensaje: |
              Has puesto $\dot W = +6$. Fíjate en lo que dice el resultado: el
              agua saldría de la bomba con menos entalpía que al entrar, sin
              haber cedido calor a nadie —la bomba es adiabática—. La energía
              habría desaparecido.
          - valor: '8.57 kJ/kg'
            mensaje: |
              Eso es solo el **salto** de entalpía que produce la bomba, no la
              entalpía de salida. Falta sumarle la de entrada: la entalpía es
              una propiedad del estado, no lo que ha cambiado.
        pista: |
          De $q = h_3 - h_2 + w$ con $q = 0$, y $w = \dot W/\dot m$.
        desarrollo: |
          La bomba es adiabática, así que $q = 0$ y el balance queda

          $$
          w = h_2 - h_3
          \;\Longrightarrow\;
          h_3 = h_2 - \frac{\dot W}{\dot m}
          = 340{,}54 - \frac{-6}{0{,}7}
          = 349{,}11\ \frac{\text{kJ}}{\text{kg}}
          $$

          Ocho kilojulios y medio por kilogramo, que es lo que la bomba le
          mete al agua.

      - tipo: justificar
        pregunta: Ordena la comprobación del resultado. Una pieza es falsa.
        piezas:
          - texto: >-
              La bomba es adiabática, así que toda la energía que recibe se
              queda en el fluido: la entalpía tiene que subir.
          - texto: >-
              Sube 8,57 kJ/kg, que es la potencia de 6 kW repartida entre los
              0,7 kg que pasan cada segundo.
          - texto: >-
              El salto es pequeño comparado con los 2.134 kJ/kg que se
              acababan de evacuar en el condensador, y eso es lo normal:
              bombear líquido cuesta poco.
          - texto: >-
              Y como la presión sube de 0,5 a 50 bar, la temperatura del agua
              sube en la misma proporción.
            trampa: true
            mensaje: |
              La presión se multiplica por cien y la temperatura apenas se
              mueve: el agua es prácticamente incompresible, y comprimir un
              líquido casi no lo calienta. Es justamente lo que hace barato
              bombear y caro comprimir un gas, y es la razón de que en un
              ciclo de vapor se bombee líquido en vez de comprimir vapor.
    resolucion: |
      **El signo, primero.** La bomba consume 6 kW, es decir el trabajo
      **entra** al volumen de control, así que con el convenio de la
      asignatura $\dot W = -6\ \text{kW}$.

      **El balance.** La bomba es adiabática y se desprecian las variaciones
      de energía cinética y potencial, así que de la ecuación de la energía
      queda $0 = (h_3 - h_2) + w$:

      $$
      h_3 = h_2 - \frac{\dot W}{\dot m}
      = 340{,}54 - \frac{-6}{0{,}7} = 349{,}11\ \frac{\text{kJ}}{\text{kg}}
      $$

      **Por qué el número es razonable.** Son 8,57 kJ/kg para subir la presión
      de 0,5 a 50 bar. Con el modelo incompresible, el trabajo ideal de una
      bomba sale $v\,\Delta P \approx 0{,}00103\cdot 4.950 = 5{,}1\ \text{kJ/kg}$,
      así que la bomba real consume más que la ideal, que es lo que tiene que
      pasar. El cociente entre los dos da un 59 %, y es solo una estimación
      —el rendimiento de verdad se calcula con la entalpía isentrópica sacada
      de las tablas de líquido comprimido, y el examen publica 61,6 %—. Sirve
      para lo que sirven las estimaciones: para saber si el 8,57 era
      plausible antes de seguir.

  - id: ejter-el-aceite-y-el-agua-que-lo-enfria
    titulo: El aceite y el agua que lo enfría
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería, sobre el balance de un
      intercambiador del Tema 4 de la asignatura. No es de examen ni de la
      colección.
    nivel: ejemplo
    enunciado: |
      Un intercambiador enfría $0{,}5\ \text{kg/s}$ de aceite desde
      $90\ \text{°C}$ hasta $50\ \text{°C}$, usando agua que entra a
      $15\ \text{°C}$. Las dos corrientes no se mezclan y el intercambiador
      está bien aislado.

      Datos: $c_{p,aceite} = 1{,}9$ y
      $c_{p,agua} = 4{,}186\ \text{kJ/(kg·K)}$.

      a) ¿Qué potencia térmica cede el aceite?

      b) ¿Qué gasto de agua hace falta para que salga a $35\ \text{°C}$?
    pide: La potencia cedida por el aceite y el gasto de agua necesario.
    pasos:
      - tipo: reconocer
        pregunta: |
          El intercambiador está bien aislado. Con el volumen de control sobre
          el aparato entero, ¿cuánto calor cruza su frontera?
        opciones:
          - texto: >-
              Cero: el calor va de una corriente a la otra por dentro, y el
              aislamiento impide que salga al exterior
            correcta: true
            mensaje: |
              Exacto. Con eso el balance se queda en las dos corrientes: lo
              que pierde una lo gana la otra, y no hace falta ningún dato más.
          - texto: >-
              El que cede el aceite, 38 kW
            mensaje: |
              Ese calor sale del aceite, pero no del volumen de control: se lo
              lleva el agua, que también está dentro. Cruzar la frontera es
              otra cosa que cambiar de corriente.
          - texto: >-
              No se sabe: falta el coeficiente global de transmisión
            mensaje: |
              Ese dato haría falta para dimensionar el aparato —cuánta
              superficie de tubo—, que es otra pregunta. Para el balance de
              energía basta con saber que el calor no se escapa fuera.

      - tipo: calcular
        titulo: La potencia que cede el aceite
        pregunta: |
          ¿Cuánto calor cede el aceite por segundo?
        respuesta:
          tipo: magnitud
          valor: '38 kW'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '85.5 kW'
            mensaje: |
              Has usado la temperatura de entrada, 90, en vez del salto. El
              aceite se enfría **de** 90 **a** 50: lo que cuenta es la
              diferencia entre las dos, 40 grados.
          - valor: '167.4 kW'
            mensaje: |
              Has usado el calor específico del agua para el aceite. Cada
              fluido tiene el suyo, y precisamente esa diferencia —1,9 frente
              a 4,186— es la que hace que los dos gastos no se parezcan.
        pista: |
          $\dot Q = \dot m\,c_p\,\Delta\theta$, con los datos del aceite.
        desarrollo: |
          $$
          \dot Q = 0{,}5\cdot 1{,}9\cdot(90-50) = 38\ \text{kW}
          $$

      - tipo: calcular
        titulo: El gasto de agua
        pregunta: |
          ¿Cuánta agua hace falta para absorber esos 38 kW subiendo de 15 a
          35 °C?
        respuesta:
          tipo: magnitud
          valor: '0.454 kg/s'
          tolerancia: 0.02
          formato: un caudal másico, con su unidad
        distractores:
          - valor: '0.5 kg/s'
            mensaje: |
              Ese es el gasto de **aceite**. No tienen por qué coincidir, y no
              coinciden: el agua tiene un calor específico dos veces mayor y
              un salto de temperatura la mitad, así que hace falta casi la
              misma masa por casualidad, no por ninguna ley.
          - valor: '0.259 kg/s'
            mensaje: |
              Has usado un salto de 35 grados en vez de 20. El agua entra a 15
              y sale a 35: lo que absorbe es la diferencia entre las dos, no
              la temperatura de salida.
        pista: |
          Del balance, $\dot m_{agua} = \dot Q / [c_{p,agua}(\theta_{sal} -
          \theta_{ent})]$.
        desarrollo: |
          $$
          \dot m_{agua} = \frac{38}{4{,}186\cdot(35-15)}
          = 0{,}454\ \frac{\text{kg}}{\text{s}}
          $$

      - tipo: justificar
        pregunta: Ordena el planteamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Con el volumen de control sobre el aparato entero y bien
              aislado, ni el calor ni el trabajo cruzan la frontera.
          - texto: >-
              Queda un balance entre las dos corrientes: lo que pierde el
              aceite lo gana el agua, 38 kW.
          - texto: >-
              Y de ahí sale el gasto de agua, con su propio calor específico y
              su propio salto de temperatura.
          - texto: >-
              Si el agua entrara más fría, harían falta más kilogramos por
              segundo para llevarse los mismos 38 kW.
            trampa: true
            mensaje: |
              Harían falta **menos**. Entrando más fría y saliendo a la misma
              temperatura, cada kilogramo de agua absorbe más, así que hacen
              falta menos kilogramos. Es la misma cuenta del examen de enero
              de 2026: el gasto es el calor dividido por lo que absorbe cada
              kilo, y ese denominador crece con el salto.
    resolucion: |
      **La frontera.** El intercambiador está aislado, así que con el volumen
      de control sobre el aparato entero no cruza ni calor ni trabajo, y el
      balance se queda entre las dos corrientes.

      **a) El calor cedido por el aceite.**

      $$
      \dot Q = 0{,}5\cdot 1{,}9\cdot(90-50) = 38\ \text{kW}
      $$

      **b) El gasto de agua.**

      $$
      \dot m_{agua} = \frac{38}{4{,}186\cdot 20} = 0{,}454\ \frac{\text{kg}}{\text{s}}
      $$

      **Que salgan parecidos es casualidad.** 0,5 kg/s de aceite y 0,454 de
      agua, y no hay ninguna ley detrás: el agua tiene un calor específico
      2,2 veces mayor y un salto de temperatura la mitad, y los dos factores
      casi se cancelan. Cambia cualquiera de los dos y los gastos dejan de
      parecerse, como pasa en el condensador del examen de enero de 2026,
      donde salen treinta veces distintos.

  - id: ejter-la-misma-ecuacion-con-los-dos-signos
    titulo: La misma ecuación, con los dos signos
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería, sobre el convenio de signos
      aplicado a un volumen de control, Tema 4 de la asignatura. No es de
      examen ni de la colección.
    nivel: ejemplo
    enunciado: |
      Dos aparatos adiabáticos, los dos en régimen estacionario y los dos con
      la energía cinética y la potencial despreciables:

      - **Una turbina** por la que entra vapor con $h_1 = 3.000$ y sale con
        $h_2 = 2.600\ \text{kJ/kg}$.
      - **Una bomba** por la que entra agua con $h_1 = 200$ y sale con
        $h_2 = 210\ \text{kJ/kg}$.

      a) El trabajo específico de cada uno, con su signo.

      b) ¿Cuál de los dos produce y cuál consume, y cómo se ve en el
      resultado?
    pide: Los dos trabajos específicos con su signo, y qué significa cada uno.
    pasos:
      - tipo: reconocer
        pregunta: |
          Los dos aparatos son adiabáticos. ¿En qué se queda la ecuación de la
          energía?
        opciones:
          - texto: >-
              En $w = h_1 - h_2$, la misma para los dos: lo que el fluido
              pierde de entalpía sale como trabajo
            correcta: true
            mensaje: |
              Eso es, y es lo que hace interesante el ejercicio: **la ecuación
              es la misma**. Lo único que cambia es el orden de las entalpías,
              y de ahí sale el signo sin que haya que decidir nada.
          - texto: >-
              En dos ecuaciones distintas, una para la turbina y otra para la
              bomba
            mensaje: |
              No hay dos ecuaciones. Hay una, y dos aparatos que la recorren
              en direcciones contrarias. Escribir dos es justamente lo que
              lleva a equivocarse de signo cuando aparece un aparato nuevo.
          - texto: >-
              En $w = h_2 - h_1$, porque el trabajo va con la variación de
              entalpía
            mensaje: |
              Es la misma expresión con el signo cambiado, y el convenio de la
              asignatura decide cuál. De $q = h_2 - h_1 + w$ con $q = 0$ sale
              $w = h_1 - h_2$: el trabajo es positivo cuando la entalpía baja,
              que es lo que hace una turbina.

      - tipo: calcular
        titulo: El trabajo de la turbina
        pregunta: |
          ¿Cuánto trabajo específico da la turbina?
        respuesta:
          tipo: magnitud
          valor: '400 kJ/kg'
          tolerancia: 0.02
          formato: un trabajo específico, con su unidad
        distractores:
          - valor: '-400 kJ/kg'
            mensaje: |
              El signo. Una turbina **produce**, así que su trabajo es
              positivo con el convenio de la asignatura. Comprueba el orden:
              es $h_1 - h_2$, la de entrada menos la de salida.
          - valor: '5600 kJ/kg'
            mensaje: |
              Has sumado las dos entalpías en vez de restarlas. El trabajo
              sale de lo que el fluido **pierde** por el camino, no de lo que
              lleva encima.
        pista: |
          $w = h_1 - h_2$, con las entalpías de la turbina.
        desarrollo: |
          $$
          w_T = h_1 - h_2 = 3.000 - 2.600 = +400\ \frac{\text{kJ}}{\text{kg}}
          $$

      - tipo: calcular
        titulo: El trabajo de la bomba
        pregunta: |
          ¿Y el de la bomba, con la misma ecuación?
        respuesta:
          tipo: magnitud
          valor: '-10 kJ/kg'
          tolerancia: 0.02
          formato: un trabajo específico, con su unidad
        distractores:
          - valor: '10 kJ/kg'
            mensaje: |
              El signo, y es el punto del ejercicio. Aplicando **la misma**
              ecuación, $h_1 - h_2 = 200 - 210$, sale negativo. Que sea
              negativo no es un problema: es la manera que tiene el convenio
              de decirte que el trabajo entra.
          - valor: '410 kJ/kg'
            mensaje: |
              Has restado los dos trabajos entre sí. Cada aparato tiene el
              suyo y no se combinan: son dos volúmenes de control distintos.
        pista: |
          La misma, $w = h_1 - h_2$, sin cambiar nada.
        desarrollo: |
          $$
          w_B = h_1 - h_2 = 200 - 210 = -10\ \frac{\text{kJ}}{\text{kg}}
          $$

          Cuarenta veces menos, en valor absoluto, que el de la turbina. No es
          casualidad: comprimir un líquido cuesta poquísimo comparado con lo
          que da expandir un vapor, y en eso se apoya el ciclo de vapor entero.

      - tipo: justificar
        pregunta: Ordena la lectura de los dos signos. Una pieza es falsa.
        piezas:
          - texto: >-
              La ecuación es la misma para los dos aparatos, $w = h_1 - h_2$,
              porque los dos son adiabáticos y estacionarios.
          - texto: >-
              En la turbina la entalpía baja, así que el trabajo sale
              positivo: el aparato produce.
          - texto: >-
              En la bomba la entalpía sube, así que sale negativo: el aparato
              consume, y el convenio lo dice con el signo.
          - texto: >-
              Luego para la bomba hay que cambiar el signo de la ecuación y
              escribir $w = h_2 - h_1$.
            trampa: true
            mensaje: |
              Eso sería escribir el resultado a mano en vez de dejar que salga.
              La gracia del convenio es exactamente que **no** hay que tocar la
              ecuación: se sustituye y el signo informa. En cuanto empiezas a
              cambiar signos según lo que esperas, pierdes la única
              comprobación que tenías.
    resolucion: |
      **a) Los dos trabajos.** Los dos aparatos son adiabáticos y
      estacionarios, y en los dos se desprecian la energía cinética y la
      potencial, así que de $q = h_2 - h_1 + w$ queda la misma ecuación:

      $$
      w_T = 3.000 - 2.600 = +400\ \frac{\text{kJ}}{\text{kg}}
      \qquad
      w_B = 200 - 210 = -10\ \frac{\text{kJ}}{\text{kg}}
      $$

      **b) El signo lo dice todo.** Positivo, el aparato produce; negativo, el
      aparato consume. No hay que decidirlo: sale de sustituir.

      **Lo que hay que llevarse.** Esta es la comprobación más barata que hay
      en toda la asignatura. Si te sale una turbina con trabajo negativo o una
      bomba con trabajo positivo, no sigas: has invertido dos entalpías o has
      puesto un signo a mano. Cuesta tres segundos y ahorra el ejercicio.

  - id: ejter-el-compresor-reversible-que-destruye-exergia
    titulo: El compresor reversible que destruye exergía
    fuente: >-
      Ejercicio 1 de la convocatoria ordinaria de enero de 2024-2025 ·
      Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen publica su resolución oficial manuscrita, y los siete valores del
      desarrollo están rehechos y contrastados contra ella, incluidos los
      −2.184,53 kW de potencia.
    nivel: examen
    enunciado: |
      En un compresor **reversible** entran $2\ \text{kg/s}$ de helio a
      $1\ \text{bar}$ y $20\ \text{°C}$. La relación de compresión es
      $5$ y la temperatura del helio a la salida es de $90\ \text{°C}$.

      a) La variación de entropía del helio por unidad de tiempo.

      b) El exponente politrópico del proceso de compresión.

      c) La potencia del compresor.

      d) La exergía destruida en el universo por unidad de tiempo.

      **Nota**: considérese la temperatura de referencia igual a la del medio
      circundante, $15\ \text{°C}$.

      Datos del helio: $c_p = 5{,}19$, $c_v = 3{,}11$,
      $R' = 2{,}077\ \text{kJ/(kg·K)}$, $\gamma = 1{,}667$.
    pide: La variación de entropía, el exponente, la potencia y la exergía destruida.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado dice que el compresor es **reversible**. ¿Qué se puede
          anticipar de la exergía destruida en el universo?
        opciones:
          - texto: >-
              Nada todavía: reversible se refiere a lo que pasa dentro del
              compresor, y el calor que cede va a parar a un ambiente que está
              a otra temperatura
            correcta: true
            mensaje: |
              Exacto, y es la trampa entera del ejercicio. La resolución
              oficial lo dice con estas palabras: «aunque el compresor sea
              reversible, el intercambio de calor entre el compresor y el
              medio circundante es irreversible al ser motivado por una
              diferencia finita de temperaturas».
          - texto: >-
              Que vale cero, porque un proceso reversible no destruye exergía
            mensaje: |
              Sería cierto si el universo se acabara en la carcasa del
              compresor. El helio entra a 20 °C y sale a 90, y el calor que
              cede lo recibe un ambiente a 15: ahí hay un salto finito de
              temperatura, y eso es irreversible.
          - texto: >-
              Que es negativa, porque el compresor consume trabajo
            mensaje: |
              La exergía destruida nunca es negativa: es $T_0 S_G$ con
              $S_G \ge 0$. Que el compresor consuma trabajo afecta al signo de
              la potencia, no al de la destrucción.

      - tipo: calcular
        titulo: La variación de entropía del helio
        pregunta: |
          ¿Cuánto vale $\Delta\dot S_{12}$?
        respuesta:
          tipo: magnitud
          valor: '-4.462 kW/K'
          tolerancia: 0.02
          formato: una entropía por unidad de tiempo, con su unidad
        distractores:
          - valor: '4.462 kW/K'
            mensaje: |
              El signo. El helio se comprime y cede calor, así que su entropía
              **baja**. Los dos términos de la fórmula tiran en sentidos
              contrarios y gana el de la presión, que se multiplica por
              $\ln 5$.
          - valor: '-5.353 kW/K'
            mensaje: |
              Has usado $c_v$ en vez de $c_p$. En un volumen de control lo que
              se contabiliza es la entalpía, así que el calor específico que
              entra en la fórmula de la entropía es $c_p$. La forma con $c_v$
              existe, pero va emparejada con el cociente de **volúmenes**, no
              con el de presiones.
        pista: |
          Con las temperaturas en kelvin y la relación de compresión como
          cociente de presiones:

          $$
          \Delta\dot S = \dot m\left[c_p\ln\frac{T_2}{T_1} - R'\ln\frac{P_2}{P_1}\right]
          $$
        desarrollo: |
          $$
          \Delta\dot S_{12} = 2\left[5{,}19\ln\!\frac{363}{293}
          - 2{,}077\ln 5\right]
          $$
          $$
          = 2\,[1{,}1117 - 3{,}3427] = -4{,}462\ \frac{\text{kW}}{\text{K}}
          $$

          Comprimir baja la entropía más de lo que la sube calentarse. Es lo
          normal en un compresor refrigerado, y aquí se ve en que el término
          de la presión es tres veces el de la temperatura.

      - tipo: calcular
        titulo: El exponente politrópico
        pregunta: |
          ¿Cuál es el exponente del proceso de compresión?
        respuesta:
          tipo: numero
          valor: '1.1535'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '1.667'
            mensaje: |
              Ese es $\gamma$, el exponente del proceso **adiabático**. Aquí no
              lo es: el compresor cede calor, y por eso su exponente se queda
              muy por debajo, cerca del isotermo.
          - valor: '0.1331'
            mensaje: |
              Eso es $(n-1)/n$, un paso intermedio. Falta despejar: de
              $(n-1)/n = 0{,}1331$ sale $n = 1/(1-0{,}1331)$.
        pista: |
          De $\dfrac{T_2}{T_1} = \left(\dfrac{P_2}{P_1}\right)^{\frac{n-1}{n}}$,
          toma logaritmos y despeja.
        desarrollo: |
          $$
          \ln\!\frac{363}{293} = \frac{n-1}{n}\ln 5
          \;\Longrightarrow\;
          \frac{n-1}{n} = \frac{0{,}2142}{1{,}6094} = 0{,}1331
          $$

          $$
          n = \frac{1{,}6094}{1{,}6094 - 0{,}2142} = 1{,}1535
          $$

          Muy cerca de 1, que es el isotermo. Tiene sentido: el compresor está
          refrigerado, así que la temperatura sube mucho menos de lo que subiría
          en una compresión adiabática.

      - tipo: calcular
        titulo: La potencia del compresor
        pregunta: |
          ¿Qué potencia consume el compresor?
        respuesta:
          tipo: magnitud
          valor: '-2184.5 kW'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '2184.5 kW'
            mensaje: |
              El signo. Un compresor **consume**, así que con el convenio de la
              asignatura su trabajo es negativo. Fíjate en la fórmula: el
              paréntesis es $(T_1 - T_2)$, y $T_2$ es mayor.
          - valor: '-726.6 kW'
            mensaje: |
              Has usado $\dot m\,c_p\,\Delta T$, que es el salto de entalpía y
              no el trabajo. En un proceso politrópico con intercambio de calor
              los dos son distintos: la diferencia es justamente el calor
              cedido.
        pista: |
          Para un politrópico en régimen estacionario,
          $\dot W = \dot m\,\dfrac{n}{n-1}\,R'\,(T_1-T_2)$.
        desarrollo: |
          El trabajo de un proceso reversible en un volumen de control es
          $-\int v\,dP$, y con la ley politrópica esa integral se resuelve:

          $$
          \dot W_c = \dot m\,\frac{n}{n-1}\,R'\,(T_1-T_2)
          = 2\cdot\frac{1{,}1535}{0{,}1535}\cdot 2{,}077\cdot(293-363)
          $$
          $$
          = -2184{,}5\ \text{kW}
          $$

      - tipo: calcular
        titulo: La exergía destruida en el universo
        pregunta: |
          Con $\dot Q_c = -1457{,}9\ \text{kW}$ cedidos al ambiente a
          $15\ \text{°C}$, ¿cuánta exergía destruye el universo?
        respuesta:
          tipo: magnitud
          valor: '172.9 kW'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '0 kW'
            mensaje: |
              Es la respuesta que da el enunciado si te quedas en la palabra
              «reversible». Lo es **dentro** del compresor; fuera, el calor cae
              desde un helio que está entre 20 y 90 °C hasta un ambiente a 15,
              y ese salto finito destruye exergía.
          - valor: '0.6 kW'
            mensaje: |
              Eso es la entropía generada, en kW/K. Guy-Stodola la convierte en
              potencia multiplicando por la temperatura del ambiente en kelvin,
              288.
        pista: |
          $\Delta\dot S_{MC} = -\dot Q_c/T_{MC}$, se suma a la del helio, y el
          total es entropía generada porque el universo está aislado.
        desarrollo: |
          El medio circundante es un depósito térmico, así que recibe el calor
          a temperatura constante:

          $$
          \Delta\dot S_{MC} = \frac{-\dot Q_c}{T_{MC}} = \frac{1457{,}9}{288}
          = 5{,}06\ \frac{\text{kW}}{\text{K}}
          $$

          $$
          \dot S_{G,univ} = -4{,}462 + 5{,}06 = 0{,}6\ \frac{\text{kW}}{\text{K}}
          $$

          $$
          \dot{Ex}_D = T_0\,\dot S_{G,univ} = 288\cdot 0{,}6 = 172{,}9\ \text{kW}
          $$

      - tipo: justificar
        pregunta: Ordena por qué destruye exergía un compresor reversible. Una pieza es falsa.
        piezas:
          - texto: >-
              Dentro del compresor no hay irreversibilidad: el enunciado lo
              declara reversible y el proceso tiene una ley politrópica.
          - texto: >-
              Pero el compresor cede 1.457,9 kW de calor a un ambiente que está
              a 15 °C, mientras el helio está entre 20 y 90.
          - texto: >-
              Ese salto finito de temperatura es irreversible —es la tercera
              condición del tema 5— y genera 0,6 kW/K en el universo.
          - texto: >-
              Y si el compresor fuese adiabático, la exergía destruida sería
              todavía mayor, porque el helio saldría más caliente.
            trampa: true
            mensaje: |
              Sería **cero**. Sin calor que cruce hacia el ambiente no hay
              transferencia con salto finito, y un compresor adiabático y
              reversible es isentrópico: no destruye nada. Que el helio saliera
              más caliente encarecería el trabajo, que es otra cosa; la
              destrucción de exergía viene del calor, no de la temperatura de
              salida.
    resolucion: |
      **a) La variación de entropía del helio.**

      $$
      \Delta\dot S_{12} = 2\left[5{,}19\ln\!\frac{363}{293} - 2{,}077\ln 5\right]
      = -4{,}462\ \frac{\text{kW}}{\text{K}}
      $$

      **b) El exponente politrópico.** De la relación entre temperaturas y
      presiones:

      $$
      n = \frac{\ln 5}{\ln 5 - \ln(363/293)} = \frac{1{,}6094}{1{,}3952}
      = 1{,}1535
      $$

      **c) La potencia.** El proceso es reversible, así que el trabajo es
      $-\int v\,dP$, que con la ley politrópica se integra:

      $$
      \dot W_c = 2\cdot\frac{1{,}1535}{0{,}1535}\cdot 2{,}077\cdot(293-363)
      = -2184{,}5\ \text{kW}
      $$

      **d) La exergía destruida.** El calor cedido sale del balance de energía
      o, más corto, del calor específico politrópico:

      $$
      c_n = \frac{\gamma-n}{1-n}\,c_v = \frac{1{,}667-1{,}1535}{1-1{,}1535}
      \cdot 3{,}11 = -10{,}41
      \qquad
      \dot Q_c = 2\cdot(-10{,}41)\cdot 70 = -1457{,}9\ \text{kW}
      $$

      $$
      \Delta\dot S_{MC} = \frac{1457{,}9}{288} = 5{,}06
      \qquad
      \dot S_{G,univ} = -4{,}462 + 5{,}06 = 0{,}6\ \frac{\text{kW}}{\text{K}}
      $$

      $$
      \dot{Ex}_D = 288\cdot 0{,}6 = 172{,}9\ \text{kW}
      $$

      **La lección, y es de las buenas.** El enunciado regala la palabra
      «reversible» y medio examen se la cree. Lo es dentro del aparato; el
      universo incluye el ambiente, y entre el helio y el ambiente hay hasta setenta
      y cinco grados de diferencia en el punto más caliente. La resolución oficial lo cierra así:
      *aunque el compresor sea reversible, el intercambio de calor con el medio
      circundante es irreversible al ser motivado por una diferencia finita de
      temperaturas*.
