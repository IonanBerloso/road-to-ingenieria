ejercicios:
  - id: ejter-el-estado-que-cambia-sin-que-cambie-la-temperatura
    titulo: Dos fotos del mismo depósito
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería, sobre el par de estados que
      ilustra el postulado de estado en el Tema 1 de la asignatura. No es de
      examen ni de la colección.
    nivel: ejemplo
    enunciado: |
      Un depósito rígido contiene $m = 2\ \text{kg}$ de un gas. En un primer
      instante ocupa $V_1 = 1{,}5\ \text{m}^{3}$ y está a
      $\theta_1 = 20\ \text{°C}$; más tarde ocupa $V_2 = 2{,}5\ \text{m}^{3}$
      y sigue a $\theta_2 = 20\ \text{°C}$.

      a) ¿Ha cambiado el estado termodinámico del sistema?

      b) Calcular el volumen específico en los dos instantes.
    pide: Si el estado ha cambiado, y los dos volúmenes específicos.
    pasos:
      - tipo: reconocer
        pregunta: |
          La temperatura es la misma en las dos fotos. ¿Basta eso para decir
          que el sistema está en el mismo estado?
        opciones:
          - texto: >-
              No: el estado lo fijan dos propiedades intensivas
              independientes, y aquí solo se ha comprobado una
            correcta: true
            mensaje: |
              Exacto. El postulado de estado pide **dos**. Con una sola
              propiedad coincidiendo no se ha comprobado nada: falta la
              segunda, y aquí la segunda —el volumen específico— es
              justamente la que ha cambiado.
          - texto: >-
              Sí: la temperatura es la propiedad que define el estado
              termodinámico
            mensaje: |
              La temperatura es **una** propiedad, no el estado. Si bastara
              con ella, todo el aire de la habitación estaría en el mismo
              estado que el aire de una bombona a 200 bar, porque los dos
              están a la temperatura ambiente.
          - texto: >-
              No, porque el volumen ha cambiado, y el volumen es una
              propiedad intensiva
            mensaje: |
              La conclusión es correcta pero el motivo no: el volumen $V$ es
              **extensivo**, depende del tamaño del sistema. La propiedad
              intensiva que hay que mirar es el volumen específico $v = V/m$,
              y para eso hay que dividir.

      - tipo: calcular
        titulo: El volumen específico en la primera foto
        pregunta: |
          ¿Cuánto vale $v_1$?
        respuesta:
          tipo: magnitud
          valor: '0.75 m3/kg'
          tolerancia: 0.02
          formato: un volumen específico, con su unidad
        distractores:
          - valor: '1.333 m3/kg'
            mensaje: |
              Has dividido al revés, $m/V$. Eso es la densidad, que es la
              inversa del volumen específico: $\rho = 1/v$. La unidad lo
              delata, porque te habría salido en kg/m³.
          - valor: '3 m3/kg'
            mensaje: |
              Has multiplicado por la masa en vez de dividir. «Específico»
              significa siempre **por unidad de masa**, y por unidad de masa
              hay menos volumen que en total, no más.
        pista: |
          Específico quiere decir por kilogramo: reparte los 1,5 m³ entre los
          2 kg.
        desarrollo: |
          $$
          v_1 = \frac{V_1}{m} = \frac{1{,}5}{2} = 0{,}75\ \frac{\text{m}^{3}}{\text{kg}}
          $$

      - tipo: calcular
        titulo: El volumen específico en la segunda
        pregunta: |
          ¿Y $v_2$?
        respuesta:
          tipo: magnitud
          valor: '1.25 m3/kg'
          tolerancia: 0.02
          formato: un volumen específico, con su unidad
        distractores:
          - valor: '0.5 m3/kg'
            mensaje: |
              Ese es el **incremento** $v_2 - v_1$, no el valor de $v_2$. La
              pregunta pide dónde está el sistema en la segunda foto, no
              cuánto se ha movido.
        pista: |
          Lo mismo que antes, con los 2,5 m³.
        desarrollo: |
          $$
          v_2 = \frac{V_2}{m} = \frac{2{,}5}{2} = 1{,}25\ \frac{\text{m}^{3}}{\text{kg}}
          $$

          El sistema ha pasado de $(20\ \text{°C};\ 0{,}75\ \text{m}^{3}/\text{kg})$
          a $(20\ \text{°C};\ 1{,}25\ \text{m}^{3}/\text{kg})$: dos estados
          distintos, con la misma temperatura.

      - tipo: justificar
        pregunta: Ordena la respuesta al apartado a). Una pieza es falsa.
        piezas:
          - texto: >-
              El postulado de estado exige dos propiedades intensivas
              independientes para fijar el estado de un sistema simple.
          - texto: >-
              La temperatura coincide, pero el volumen específico pasa de
              0,75 a 1,25 m³/kg.
          - texto: >-
              Luego el estado ha cambiado, aunque una de las dos propiedades
              se haya quedado igual.
          - texto: >-
              El volumen total ha cambiado de 1,5 a 2,5 m³, y con eso ya
              basta para afirmar que el estado es otro.
            trampa: true
            mensaje: |
              El volumen total es extensivo: cambia si partes el sistema en
              dos, sin que haya pasado nada termodinámicamente. El estado se
              compara con propiedades **intensivas**, y por eso hay que
              dividir por la masa antes de concluir.
    resolucion: |
      **a) Sí, el estado ha cambiado.** El postulado de estado dice que un
      sistema simple queda fijado por dos propiedades intensivas
      independientes. Aquí la primera —la temperatura— coincide en las dos
      fotos, pero eso no cierra nada: hay que mirar la segunda.

      **b) Los volúmenes específicos.** El volumen es extensivo, así que para
      compararlo hay que hacerlo intensivo dividiendo por la masa:

      $$
      v_1 = \frac{1{,}5}{2} = 0{,}75\ \frac{\text{m}^{3}}{\text{kg}}
      \qquad
      v_2 = \frac{2{,}5}{2} = 1{,}25\ \frac{\text{m}^{3}}{\text{kg}}
      $$

      Los dos estados son $(20\ \text{°C};\ 0{,}75)$ y
      $(20\ \text{°C};\ 1{,}25)$, y son distintos. Que una propiedad se
      conserve no dice nada del estado; lo que lo fija es el par.

  - id: ejter-la-presion-que-se-lleva-a-la-tabla
    titulo: Lo que marca el manómetro y lo que pide la tabla
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería, sobre las equivalencias de
      presión del Tema 1 de la asignatura. No es de examen ni de la colección.
    nivel: ejemplo
    enunciado: |
      En una práctica de laboratorio, el manómetro de una caldera marca
      $2{,}5\ \text{bar}$. El barómetro de la sala marca ese día
      $750\ \text{mmHg}$.

      a) ¿Qué presión hay que llevar a la tabla de vapor de agua para buscar
      el estado del fluido de la caldera?

      b) Si la misma caldera se instalase en un refugio de montaña a 3.000 m,
      donde el barómetro marca $75\ \text{kPa}$, y el manómetro siguiera
      marcando lo mismo, ¿estaría el fluido en el mismo estado?
    pide: La presión absoluta en bar, y si el estado depende de dónde esté la caldera.
    pasos:
      - tipo: reconocer
        pregunta: |
          Las tablas de propiedades termodinámicas están tabuladas en presión
          **absoluta**. ¿Qué le falta a la lectura del manómetro?
        opciones:
          - texto: >-
              Sumarle la presión atmosférica local, que es la referencia
              respecto de la cual mide el aparato
            correcta: true
            mensaje: |
              Eso es. Un manómetro mide la diferencia con el ambiente que lo
              rodea; la tabla está escrita respecto del vacío. La diferencia
              entre las dos referencias es exactamente la atmosférica local.
          - texto: >-
              Nada: el bar ya es una unidad absoluta, y la lectura se puede
              usar tal cual
            mensaje: |
              El bar es una unidad, no una referencia. La misma presión se
              puede escribir en bares en relativas o en absolutas; lo que
              decide es respecto de qué se mide, no en qué se expresa.
          - texto: >-
              Restarle la presión atmosférica, porque el manómetro ya la
              lleva incluida
            mensaje: |
              Es al revés. El manómetro **descuenta** la atmosférica: por eso
              marca cero al aire libre, donde la presión absoluta es de una
              atmósfera. Para deshacer ese descuento hay que sumar.

      - tipo: calcular
        titulo: La presión que va a la tabla
        pregunta: |
          ¿Cuál es la presión absoluta del fluido de la caldera?
        respuesta:
          tipo: magnitud
          valor: '3.5 bar'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '2.5 bar'
            mensaje: |
              Esa es la lectura del manómetro tal cual, es decir la presión
              relativa. Es la que se ve en el aparato, no la que entra en la
              tabla.
          - valor: '1.5 bar'
            mensaje: |
              Has restado la atmosférica en vez de sumarla. Comprueba el
              signo con el caso extremo: un manómetro que marca cero está en
              un sitio donde la presión absoluta vale una atmósfera, no cero.
        pista: |
          En el Tema 1, $1\ \text{bar} = 750\ \text{mmHg}$. Con esa
          equivalencia, el barómetro de la sala marca justo un bar.
        desarrollo: |
          El barómetro da la atmosférica local en milímetros de mercurio, y
          la equivalencia del tema la pasa a bar:

          $$
          P_{atm} = 750\ \text{mmHg} = 1\ \text{bar}
          $$

          $$
          P_{abs} = P_{man} + P_{atm} = 2{,}5 + 1 = 3{,}5\ \text{bar}
          $$

      - tipo: calcular
        titulo: El mismo aparato, a 3.000 metros
        pregunta: |
          Con $75\ \text{kPa}$ de atmosférica y el manómetro marcando otra
          vez $2{,}5\ \text{bar}$, ¿cuál es ahora la presión absoluta?
        respuesta:
          tipo: magnitud
          valor: '3.25 bar'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '3.5 bar'
            mensaje: |
              Esa es la del laboratorio, al nivel del mar. Arriba la
              atmosférica es un cuarto de bar menor, y la absoluta baja con
              ella: la lectura del manómetro no ha cambiado, pero su
              referencia sí.
          - valor: '77.5 kPa'
            mensaje: |
              Has sumado 2,5 kPa en vez de 2,5 bar. Un bar son 100 kPa, así
              que la lectura del manómetro vale 250 kPa: pon las dos
              presiones en la misma unidad antes de sumarlas.
        pista: |
          Pasa los 75 kPa a bar —un bar son 100 kPa— y vuelve a sumar.
        desarrollo: |
          $$
          P_{atm} = 75\ \text{kPa} = 0{,}75\ \text{bar}
          $$

          $$
          P_{abs} = 2{,}5 + 0{,}75 = 3{,}25\ \text{bar}
          $$

          Un cuarto de bar menos que abajo. La aguja del manómetro está en el
          mismo sitio y el estado del fluido **no** es el mismo.

      - tipo: justificar
        pregunta: Ordena la respuesta al apartado b). Una pieza es falsa.
        piezas:
          - texto: >-
              El manómetro mide respecto de la atmósfera local, así que su
              lectura depende de dónde esté instalado.
          - texto: >-
              La presión absoluta ha pasado de 3,5 a 3,25 bar, y es la
              absoluta la que fija el estado junto con la temperatura.
          - texto: >-
              Luego no: el fluido está en otro estado, aunque la aguja del
              manómetro esté en el mismo sitio.
          - texto: >-
              Como el manómetro marca lo mismo, el fluido está en el mismo
              estado y la atmosférica es irrelevante.
            trampa: true
            mensaje: |
              Es la conclusión que hace el error: confundir el instrumento
              con la propiedad. La aguja repetida no es un estado repetido,
              porque lo que la aguja mide es una **diferencia**, y el otro
              término de la diferencia se ha movido.
    resolucion: |
      **a) La presión absoluta.** Las tablas están tabuladas respecto del
      vacío y el manómetro mide respecto del ambiente, así que hay que sumar
      la atmosférica local. Con la equivalencia del tema,
      $1\ \text{bar} = 750\ \text{mmHg}$, el barómetro marca exactamente un
      bar:

      $$
      P_{abs} = P_{man} + P_{atm} = 2{,}5 + 1 = 3{,}5\ \text{bar}
      $$

      **b) No, no está en el mismo estado.** A 3.000 metros la atmosférica
      vale $75\ \text{kPa} = 0{,}75\ \text{bar}$, y la absoluta pasa a
      $2{,}5 + 0{,}75 = 3{,}25\ \text{bar}$.

      La moraleja del ejercicio no es la cuenta, que es una suma: es que la
      lectura de un manómetro **no es una propiedad del sistema**. Es la
      diferencia entre una propiedad del sistema y una propiedad de la sala.
      Por eso en Termodinámica se trabaja en absolutas de principio a fin, y
      se pasa a relativas solo al final, si alguien pregunta qué marcaría el
      aparato.

  - id: ejter-la-temperatura-que-entra-en-un-logaritmo
    titulo: La temperatura que entra en un logaritmo
    fuente: >-
      Extraído del ejercicio 1 de la convocatoria ordinaria de enero de 2026 ·
      Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). Es el
      paso donde el examen convierte de escala; el ejercicio completo está en
      su convocatoria.
    nivel: practica
    enunciado: |
      Un gas evoluciona entre dos estados. El enunciado da el inicial en
      kelvin, $T_1 = 557{,}5\ \text{K}$, y el final en grados Celsius,
      $\theta_2 = 27\ \text{°C}$.

      Al calcular la variación de entropía aparece el término
      $\ln\!\left(\dfrac{T_2}{T_1}\right)$.

      a) ¿Cuánto vale ese logaritmo?

      b) ¿Cuánto vale la diferencia $T_2 - T_1$, y en qué escala se expresa?
    pide: El logaritmo del cociente y el salto de temperatura, cada uno en su escala.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado mezcla las dos escalas. ¿Cuál de las dos operaciones
          exige pasar a kelvin?
        opciones:
          - texto: >-
              El cociente. La diferencia vale lo mismo en las dos escalas,
              porque el desplazamiento de 273,15 se cancela al restar
            correcta: true
            mensaje: |
              Exacto, y es la regla entera del convenio: **restar** perdona,
              **dividir** no. En una diferencia el 273,15 aparece en los dos
              términos y se va; en un cociente, no.
          - texto: >-
              Las dos, porque en Termodinámica toda temperatura va siempre en
              kelvin
            mensaje: |
              Es una costumbre prudente y no te hará fallar nunca, pero la
              afirmación no es exacta: $\Delta T = \Delta\theta$, y hay
              expresiones —el calor de un sólido, el modelo incompresible—
              donde el enunciado da directamente el salto en grados Celsius y
              no hay nada que convertir.
          - texto: >-
              La diferencia, porque el resultado tiene que salir en kelvin
            mensaje: |
              Al revés. La diferencia es justamente la que no necesita
              conversión: 100 °C de salto son 100 K de salto. Lo que no
              sobrevive al cambio de escala es el **cociente**.

      - tipo: calcular
        titulo: El logaritmo del cociente
        pregunta: |
          ¿Cuánto vale $\ln(T_2/T_1)$?
        respuesta:
          tipo: numero
          valor: '-0.6199'
          tolerancia: 0.005
          formato: un número, negativo
        distractores:
          - valor: '-2.3553'
            mensaje: |
              Has metido los grados Celsius en el cociente:
              $\ln(27/284{,}5)$. Es casi cuatro veces el valor correcto, y
              con él se van la entropía y todos los apartados que dependan de
              ella. Pasa las dos a kelvin antes de dividir.
          - valor: '0.6199'
            mensaje: |
              El signo. El gas se enfría, $T_2 < T_1$, así que el cociente es
              menor que uno y su logaritmo es negativo. Un logaritmo positivo
              aquí significaría que el gas se ha calentado.
        pista: |
          $\theta_2 = 27\ \text{°C}$ son 300 K. El otro dato ya viene en
          kelvin.
        desarrollo: |
          $$
          T_2 = 27 + 273 = 300\ \text{K}
          $$

          $$
          \ln\!\left(\frac{T_2}{T_1}\right)
          = \ln\!\left(\frac{300}{557{,}5}\right)
          = \ln(0{,}5381) = -0{,}6197
          $$

      - tipo: calcular
        titulo: El salto de temperatura
        pregunta: |
          ¿Cuánto vale $T_2 - T_1$?
        respuesta:
          tipo: magnitud
          valor: '-257.5 K'
          tolerancia: 0.02
          formato: una temperatura, con su unidad
        distractores:
          - valor: '-530.5 K'
            mensaje: |
              Has restado 27 menos 557,5 sin convertir: has mezclado grados
              Celsius con kelvin en la misma resta. Las dos temperaturas
              tienen que estar en la misma escala, y da igual cuál sea
              mientras sea la misma.
        pista: |
          Puedes hacerla en kelvin —300 menos 557,5— o en grados Celsius —27
          menos 284,5—. Comprueba que sale lo mismo.
        desarrollo: |
          En kelvin:

          $$
          T_2 - T_1 = 300 - 557{,}5 = -257{,}5\ \text{K}
          $$

          Y en grados Celsius, con $\theta_1 = 557{,}5 - 273 = 284{,}5\ \text{°C}$:

          $$
          \theta_2 - \theta_1 = 27 - 284{,}5 = -257{,}5\ \text{°C}
          $$

          El mismo número. Un salto de temperatura se escribe indistintamente
          en K o en °C, y en los enunciados de esta asignatura aparecen las
          dos formas.

      - tipo: justificar
        pregunta: Ordena el porqué del convenio. Una pieza es falsa.
        piezas:
          - texto: >-
              Las dos escalas se diferencian en un desplazamiento constante,
              $T = \theta + 273{,}15$.
          - texto: >-
              Al restar dos temperaturas el desplazamiento aparece en los dos
              términos y se cancela, así que la diferencia es la misma.
          - texto: >-
              Al dividirlas no se cancela nada, y el cociente cambia de
              valor: por eso todo cociente, logaritmo o potencia exige
              kelvin.
          - texto: >-
              Como el desplazamiento es constante, el cociente también se
              conserva y la conversión solo sirve para presentar el
              resultado.
            trampa: true
            mensaje: |
              Es la intuición que falla. Que el desplazamiento sea constante
              es justamente lo que **rompe** el cociente: $(a+c)/(b+c)$ no es
              $a/b$ salvo que $c$ valga cero. Con la resta sí se conserva,
              porque ahí $c$ se cancela.
    resolucion: |
      **a) El logaritmo.** Hay que pasar el estado 2 a kelvin antes de
      dividir:

      $$
      T_2 = 27 + 273 = 300\ \text{K}
      \qquad
      \ln\!\left(\frac{300}{557{,}5}\right) = -0{,}6197
      $$

      Hacerlo en grados Celsius daría $\ln(27/284{,}5) = -2{,}36$, casi
      cuatro veces más, y arrastraría el error a la entropía, a la exergía y
      a todo lo que venga detrás.

      **b) El salto.** $-257{,}5$, y da igual la escala:
      $300 - 557{,}5$ en kelvin y $27 - 284{,}5$ en grados Celsius dan el
      mismo número.

      **La regla, en una línea.** El desplazamiento de 273 se cancela al
      restar y no se cancela al dividir. De ahí que $\Delta T = \Delta\theta$
      mientras que $T_2/T_1 \neq \theta_2/\theta_1$, y de ahí la costumbre
      que evita el problema de raíz: **pasar todas las temperaturas a kelvin
      en la primera línea del folio**.
