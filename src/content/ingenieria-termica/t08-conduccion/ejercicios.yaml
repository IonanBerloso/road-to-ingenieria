ejercicios:
  - id: ejter-el-muro-de-tres-capas-y-la-que-manda
    titulo: El muro de tres capas, y la que manda
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería, sobre el reparto de
      resistencias en serie del Tema 8 de la asignatura. No es de examen ni de
      la colección.
    nivel: ejemplo
    enunciado: |
      Un muro de fachada tiene tres capas, de dentro hacia fuera:

      | capa | espesor | conductividad |
      |---|---|---|
      | enfoscado | $2\ \text{cm}$ | $1{,}4\ \text{W/(m·K)}$ |
      | aislante | $6\ \text{cm}$ | $0{,}04\ \text{W/(m·K)}$ |
      | ladrillo | $1{,}5\ \text{cm}$ | $0{,}5\ \text{W/(m·K)}$ |

      Las temperaturas superficiales son $20\ \text{°C}$ dentro y
      $-5\ \text{°C}$ fuera.

      a) La resistencia térmica total, por unidad de área.

      b) Qué porcentaje aporta cada capa.

      c) El flujo de calor por metro cuadrado.
    pide: La resistencia total, el reparto por capas y la densidad de flujo.
    pasos:
      - tipo: reconocer
        pregunta: |
          Las tres capas están una detrás de otra. ¿Cómo se combinan sus
          resistencias?
        opciones:
          - texto: >-
              En serie: se suman, porque el mismo calor atraviesa las tres una
              tras otra
            correcta: true
            mensaje: |
              Exacto, y es la analogía con la ley de Ohm entera. El calor es
              la intensidad y no tiene por dónde repartirse: pasa por las tres
              capas el mismo.
          - texto: >-
              En paralelo: se suman sus inversas, porque las tres conducen a
              la vez
            mensaje: |
              El paralelo es para caminos alternativos —un puente térmico al
              lado del aislante, por ejemplo—. Aquí no hay alternativa: el
              calor tiene que cruzar las tres capas, una detrás de otra.
          - texto: >-
              Se toma la mayor, porque las otras son despreciables
            mensaje: |
              Va a resultar que una es casi todo, y eso es la respuesta del
              apartado b), no el método. Primero se suman las tres y luego se
              mira el reparto; al revés, no hay manera de saber si la
              aproximación valía.

      - tipo: calcular
        titulo: La resistencia total
        pregunta: |
          ¿Cuánto vale la resistencia térmica del muro por metro cuadrado?
        respuesta:
          tipo: magnitud
          valor: '1.544 m2 K/W'
          tolerancia: 0.02
          formato: una resistencia térmica por unidad de área, con su unidad
        distractores:
          - valor: '0.049 m2 K/W'
            mensaje: |
              Has sumado los espesores y dividido por la suma de las
              conductividades. Cada capa tiene su propia resistencia $L/k$, y
              lo que se suma son las resistencias, no los espesores.
          - valor: '0.0096 m2 K/W'
            mensaje: |
              Has sumado las inversas, es decir has combinado en paralelo. Las
              capas de un muro van en serie: el calor las cruza una detrás de
              otra.
        pista: |
          $R = L/k$ para cada capa, y las tres se suman. Ojo a los
          centímetros.
        desarrollo: |
          $$
          R_1 = \frac{0{,}02}{1{,}4} = 0{,}0143
          \qquad
          R_2 = \frac{0{,}06}{0{,}04} = 1{,}500
          \qquad
          R_3 = \frac{0{,}015}{0{,}5} = 0{,}030
          $$

          $$
          R_{TOTAL} = 1{,}544\ \frac{\text{m}^{2}\text{K}}{\text{W}}
          $$

      - tipo: calcular
        titulo: El porcentaje del aislante
        pregunta: |
          ¿Qué porcentaje de la resistencia total aporta la capa de aislante?
        respuesta:
          tipo: numero
          valor: '97.1'
          tolerancia: 0.5
          formato: un porcentaje, sin el símbolo
        distractores:
          - valor: '63.2'
            mensaje: |
              Has calculado la fracción de **espesor**, 6 cm de 9,5. La
              resistencia no se reparte por espesor: se reparte por $L/k$, y
              la conductividad del aislante es treinta y cinco veces menor que
              la del enfoscado.
          - valor: '1.94'
            mensaje: |
              Ese es el del ladrillo. El aislante es la capa de conductividad
              más baja con diferencia, así que es la que más resiste, no la
              que menos.
        pista: |
          Divide $R_2$ entre el total y multiplica por cien.
        desarrollo: |
          $$
          \frac{R_2}{R_{TOTAL}} = \frac{1{,}500}{1{,}544} = 97{,}1\ \%
          $$

          Y el reparto completo: enfoscado 0,93 %, aislante 97,1 %, ladrillo
          1,94 %. **Seis centímetros de un material deciden el muro entero**, y
          los otros tres centímetros y medio no pintan nada.

      - tipo: calcular
        titulo: El flujo de calor
        pregunta: |
          ¿Cuánto calor pierde el muro por metro cuadrado?
        respuesta:
          tipo: magnitud
          valor: '16.19 W/m2'
          tolerancia: 0.02
          formato: una densidad de flujo de calor, con su unidad
        distractores:
          - valor: '9.71 W/m2'
            mensaje: |
              Has usado un salto de 15 grados. El salto va de 20 °C a −5 °C, y
              entre un número positivo y uno negativo la diferencia se
              **suma**: son 25 grados.
          - valor: '38.6 W/m2'
            mensaje: |
              Has multiplicado por la resistencia en vez de dividir. La
              analogía es la ley de Ohm: la intensidad es la diferencia de
              potencial **partida por** la resistencia.
        pista: |
          $\dot q = \Delta\theta / R_{TOTAL}$, con un salto de 25 grados.
        desarrollo: |
          $$
          \dot q = \frac{20 - (-5)}{1{,}544} = 16{,}19\ \frac{\text{W}}{\text{m}^{2}}
          $$

      - tipo: justificar
        pregunta: Ordena la conclusión de ingeniería. Una pieza es falsa.
        piezas:
          - texto: >-
              Las tres capas van en serie, así que sus resistencias se suman y
              el reparto va por $L/k$, no por espesor.
          - texto: >-
              El aislante aporta el 97 % con seis centímetros, porque su
              conductividad es treinta y cinco veces menor que la del
              enfoscado.
          - texto: >-
              Luego, para reducir las pérdidas, lo único que rinde es tocar el
              aislante: doblar cualquiera de las otras dos capas no cambiaría
              nada apreciable.
          - texto: >-
              Y por eso este muro se comporta igual que la tubería del examen
              de enero de 2026, donde también mandaba el aislante.
            trampa: true
            mensaje: |
              En aquella tubería mandaba la **convección exterior**, con un
              53 %, y el aislante se quedaba en el 31 %. No hay una respuesta
              general a «cuál manda»: depende del caso, y por eso la pregunta
              se contesta calculando el reparto y no de memoria. Ese es
              justamente el hábito que este ejercicio quiere dejar.
    resolucion: |
      **a) La resistencia total.** Tres capas en serie, cada una con $L/k$:

      $$
      R = \frac{0{,}02}{1{,}4} + \frac{0{,}06}{0{,}04} + \frac{0{,}015}{0{,}5}
      = 0{,}0143 + 1{,}500 + 0{,}030 = 1{,}544\ \frac{\text{m}^{2}\text{K}}{\text{W}}
      $$

      **b) El reparto.**

      | capa | R | % |
      |---|---|---|
      | enfoscado | 0,0143 | 0,93 |
      | **aislante** | 1,500 | **97,1** |
      | ladrillo | 0,030 | 1,94 |

      **c) El flujo.**

      $$
      \dot q = \frac{25}{1{,}544} = 16{,}19\ \frac{\text{W}}{\text{m}^{2}}
      $$

      **Lo que hay que llevarse.** El reparto no va por espesor sino por
      $L/k$, y con cuatro órdenes de magnitud entre un aislante y un metal eso
      significa que casi siempre hay **una** capa que decide y las demás
      sobran del cálculo. Encontrarla antes de proponer nada es todo el oficio
      del tema; suponerla, el error.

  - id: ejter-el-aislante-de-la-camara-frigorifica
    titulo: El aislante que evita la condensación
    fuente: >-
      Ejercicio 8.1 de la colección de problemas del Tema 8 · Ingeniería
      Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El material lo
      resuelve dos veces —integrando y por analogía termoeléctrica— y publica
      el resultado, 5,25 cm; el desarrollo está contrastado contra él.
    nivel: practica
    enunciado: |
      En una cámara frigorífica la temperatura superficial interior es de
      $-20\ \text{°C}$. Sobre la pared metálica se quiere colocar un
      aislamiento de plástico rígido de conductividad térmica
      $k = 0{,}03\ \text{W/(m·K)}$. Una de las paredes, de
      $100\ \text{m}^{2}$ de sección, tiene una ganancia de calor por
      transmisión de $2\ \text{kW}$.

      Si el aire exterior tiene una temperatura de rocío de $15\ \text{°C}$,
      calcúlese el espesor mínimo de aislamiento para evitar la condensación
      superficial en el exterior.
    pide: El espesor mínimo del aislamiento, en centímetros.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado da una temperatura de **rocío**, no una temperatura de
          aire. ¿Qué condición impone eso sobre la cara exterior del
          aislamiento?
        opciones:
          - texto: >-
              Que no puede estar por debajo de 15 °C, porque si lo estuviera
              el vapor del aire condensaría sobre ella
            correcta: true
            mensaje: |
              Exacto. El rocío es la temperatura a la que el aire empieza a
              soltar su humedad, y una superficie más fría que eso se moja. La
              condición del problema es «la cara exterior, al menos a 15 °C»,
              y de ahí sale el espesor mínimo.
          - texto: >-
              Que la cara exterior tiene que estar a 15 °C exactamente, porque
              es la temperatura del aire
            mensaje: |
              El rocío no es la temperatura del aire: es a la que ese aire
              condensaría. El aire estará más caliente. Lo que el problema
              pide es un **mínimo**, así que la condición es una desigualdad
              y el caso límite es la igualdad.
          - texto: >-
              Que el aislamiento tiene que soportar 15 °C sin degradarse
            mensaje: |
              Eso sería un problema de materiales. Aquí la condensación es un
              fenómeno térmico: agua líquida apareciendo sobre una superficie
              fría, que en una cámara frigorífica significa goteo, hielo y
              pérdida de aislamiento.

      - tipo: calcular
        titulo: La resistencia térmica necesaria
        pregunta: |
          ¿Qué resistencia térmica, por unidad de área, tiene que ofrecer el
          aislamiento?
        respuesta:
          tipo: magnitud
          valor: '1.75 m2 K/W'
          tolerancia: 0.02
          formato: una resistencia térmica por unidad de área, con su unidad
        distractores:
          - valor: '0.0175 m2 K/W'
            mensaje: |
              Has dividido por los 2.000 W totales sin repartirlos entre los
              100 m² de pared. La resistencia por unidad de área se calcula
              con la **densidad** de flujo: 2.000 W entre 100 m² son
              20 W/m².
          - valor: '0.25 m2 K/W'
            mensaje: |
              Has usado un salto de 5 grados en vez de 35. El salto va de
              −20 °C a +15 °C, y entre un número negativo y uno positivo la
              diferencia se **suma**: $15 - (-20) = 35$.
        pista: |
          La densidad de flujo es $2000/100 = 20\ \text{W/m}^{2}$, y el salto
          de temperatura, de −20 a 15 °C.
        desarrollo: |
          Despreciando la resistencia de la pared metálica, que tiene una
          conductividad muchísimo mayor que la del aislante, el circuito se
          queda en una sola resistencia:

          $$
          R = \frac{\theta_e - \theta_i}{\dot q}
          = \frac{15 - (-20)}{2000/100}
          = \frac{35}{20} = 1{,}75\ \frac{\text{m}^{2}\text{K}}{\text{W}}
          $$

      - tipo: calcular
        titulo: El espesor
        pregunta: |
          Con $k = 0{,}03\ \text{W/(m·K)}$, ¿qué espesor hace falta?
        respuesta:
          tipo: magnitud
          valor: '5.25 cm'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '58.3 m'
            mensaje: |
              Has dividido por $k$ en vez de multiplicar. La resistencia de una
              pared plana es $L/k$: cuanto **peor** conduce el material, menos
              espesor hace falta para la misma resistencia.
          - valor: '175 cm'
            mensaje: |
              Has tomado la resistencia como si ya fuera un espesor. Las
              unidades lo delatan: 1,75 está en m²·K/W, y para convertirlo en
              metros hay que multiplicar por una conductividad, que va en
              W/(m·K).
        pista: |
          $R = L/k$, así que $L = R\,k$.
        desarrollo: |
          $$
          L = R\,k = 1{,}75\cdot 0{,}03 = 0{,}0525\ \text{m} = 5{,}25\ \text{cm}
          $$

          Cinco centímetros y cuarto. Y es un **mínimo**: con menos, la cara
          exterior se quedaría por debajo del rocío y la pared goteando.

      - tipo: justificar
        pregunta: Ordena por qué se puede despreciar la pared metálica. Una pieza es falsa.
        piezas:
          - texto: >-
              La resistencia de una capa plana es $L/k$, así que crece con el
              espesor y baja con la conductividad.
          - texto: >-
              La conductividad de un metal es del orden de decenas de W/(m·K),
              y la del plástico rígido, 0,03: más de mil veces menor.
          - texto: >-
              Luego la resistencia de la chapa es despreciable frente a la del
              aislante, y el circuito se reduce a una sola resistencia.
          - texto: >-
              Y como la chapa no ofrece resistencia, tampoco hay salto de
              temperatura en el aislante: los 35 grados caen en la chapa.
            trampa: true
            mensaje: |
              Es justo al revés, y es el sentido físico de la analogía: en un
              circuito en serie, la caída de potencial se reparte
              **proporcionalmente a las resistencias**. La chapa, que no
              ofrece casi ninguna, apenas tiene salto de temperatura; los 35
              grados caen enteros en el aislante, que es el que resiste.
    resolucion: |
      **La condición.** La temperatura de rocío del aire exterior es 15 °C, así
      que la cara exterior del aislamiento no puede bajar de ahí sin que
      condense agua encima. El caso límite —el espesor **mínimo**— es el que
      la deja justo a 15 °C.

      **El circuito.** La pared metálica tiene una conductividad más de mil
      veces mayor que la del plástico, así que su resistencia es despreciable
      y queda una sola:

      $$
      R = \frac{\theta_e - \theta_i}{\dot q} = \frac{15-(-20)}{20}
      = 1{,}75\ \frac{\text{m}^{2}\text{K}}{\text{W}}
      $$

      **El espesor.**

      $$
      L = R\,k = 1{,}75\cdot 0{,}03 = 5{,}25\ \text{cm}
      $$

      **Las dos vías dan lo mismo, y conviene verlo.** El material resuelve
      este ejercicio también integrando la ecuación de la conducción:
      $\theta(x) = C_1x + C_2$ con las dos condiciones de contorno, de donde
      $C_1 = 35/e$, y aplicando Fourier,
      $\dot Q = -k\,(35/e)\,A$, sale el mismo 0,0525 m. La analogía
      termoeléctrica no es una aproximación: es esa integración ya hecha, y
      por eso se puede usar sin remordimientos siempre que el régimen sea
      estacionario y unidimensional.

  - id: ejter-que-resistencia-manda-en-la-tuberia
    titulo: Qué resistencia manda en la tubería
    fuente: >-
      Ejercicio 3 de la convocatoria ordinaria de enero de 2026 · Ingeniería
      Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      su resolución oficial, y las cuatro resistencias están rehechas y
      contrastadas contra ella.
    nivel: examen
    enunciado: |
      Por una tubería de $0{,}5\ \text{m}$ de diámetro interior fluye un gasto
      de $0{,}3\ \text{kg/s}$ de agua. La tubería consta de dos capas: una de
      3 cm de espesor y conductividad $52\ \text{W/(m·K)}$, y la exterior, de
      6 cm de espesor y $0{,}75\ \text{W/(m·K)}$. El agua entra a
      $250\ \text{°C}$ y sale a $150\ \text{°C}$; el aire exterior está en
      reposo a $10\ \text{°C}$, y la superficie exterior de la tubería, a
      $110{,}7\ \text{°C}$.

      Dato del agua a la temperatura característica:
      $c_p = 4.500\ \text{J/(kg·K)}$. La resistencia de convección interior
      vale $R_{ci} = 2{,}2369\cdot 10^{-4}\ \text{K/W}$.

      a) La potencia térmica que pierde el agua.

      b) La longitud de tubería necesaria para ese enfriamiento.

      c) Cuál es la resistencia dominante y qué porcentaje representa.
    pide: La potencia, la longitud y el reparto de las cuatro resistencias.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado da la temperatura de la superficie exterior, 110,7 °C.
          ¿Para qué sirve ese dato?
        opciones:
          - texto: >-
              Para calcular la resistencia de convección exterior por
              diferencia, sin necesidad de ninguna correlación
            correcta: true
            mensaje: |
              Exacto, y es el regalo del enunciado. Conocidos el calor y las
              dos temperaturas que hay a los lados de esa resistencia, sale
              dividiendo; sin ese dato habría que aplicar Churchill y Chu,
              que la propia resolución oficial dice que no es aconsejable en
              un examen.
          - texto: >-
              Para comprobar que el aislamiento aguanta la temperatura
            mensaje: |
              Sería una comprobación de materiales, no un dato del cálculo. En
              un problema de transmisión de calor, una temperatura de
              superficie que aparece «de más» casi siempre está ahí para
              ahorrarte una correlación.
          - texto: >-
              No sirve para nada: es un dato redundante que se puede deducir
              del resto
            mensaje: |
              Deducirla exigiría conocer el coeficiente de convección exterior,
              que es justo lo que no se sabe. El dato es el que cierra el
              circuito por el lado de fuera.

      - tipo: calcular
        titulo: La potencia térmica
        pregunta: |
          ¿Cuánto calor pierde el agua al enfriarse de 250 a 150 °C?
        respuesta:
          tipo: magnitud
          valor: '135000 W'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '135 W'
            mensaje: |
              Un factor mil: el $c_p$ del enunciado viene en J/(kg·K), no en
              kJ. Con 4.500 J/(kg·K), el producto sale directamente en vatios.
          - valor: '337500 W'
            mensaje: |
              Has usado un salto de 250 grados en vez de 100. El agua se
              enfría **de** 250 **a** 150: el salto es la diferencia entre las
              dos, no la temperatura de entrada.
        pista: |
          $\dot Q = \dot m\,c_p\,(\theta_{in} - \theta_{out})$.
        desarrollo: |
          $$
          \dot Q = 0{,}3\cdot 4.500\cdot(250 - 150) = 135.000\ \text{W}
          $$

      - tipo: calcular
        titulo: La resistencia de convección exterior
        pregunta: |
          Con la superficie exterior a 110,7 °C y el aire a 10 °C, ¿cuánto
          vale $R_{ce}$?
        respuesta:
          tipo: magnitud
          valor: '7.459e-4 K/W'
          tolerancia: 0.02
          formato: una resistencia térmica, con su unidad
        distractores:
          - valor: '1.341e3 K/W'
            mensaje: |
              Has dividido al revés, el calor entre el salto de temperatura.
              La analogía es la ley de Ohm: la resistencia es la diferencia de
              potencial **partida por** la intensidad, no al contrario.
          - valor: '1.7778e-3 K/W'
            mensaje: |
              Has usado el salto entre el agua y el aire, 250 menos 10. Esta
              resistencia es solo la de la película exterior: los dos extremos
              que la limitan son la superficie del tubo y el aire, 110,7 y 10.
        pista: |
          $R = \Delta\theta/\dot Q$, con la diferencia entre superficie
          exterior y aire.
        desarrollo: |
          $$
          R_{ce} = \frac{\theta_3 - \theta_{f,ext}}{\dot Q}
          = \frac{110{,}7 - 10}{135.000}
          = 7{,}459\cdot 10^{-4}\ \frac{\text{K}}{\text{W}}
          $$

      - tipo: calcular
        titulo: El porcentaje de la resistencia dominante
        pregunta: |
          Las cuatro resistencias suman
          $1{,}40741\cdot 10^{-3}\ \text{K/W}$. ¿Qué porcentaje del total
          representa la de convección exterior?
        respuesta:
          tipo: numero
          valor: '53.0'
          tolerancia: 0.5
          formato: un porcentaje, sin el símbolo
        distractores:
          - valor: '30.8'
            mensaje: |
              Ese es el del aislante, $4{,}34\cdot 10^{-4}$, que es la segunda
              en importancia. La exterior es mayor: $7{,}46\cdot 10^{-4}$.
          - valor: '0.26'
            mensaje: |
              Ese es el de la chapa de acero, y es la lección del apartado: con
              una conductividad de 52 frente a 0,75, el acero no pinta nada en
              el circuito. Podrías quitarlo del cálculo y el resultado
              cambiaría en la tercera cifra.
        pista: |
          Divide $7{,}459\cdot 10^{-4}$ entre el total y multiplica por cien.
        desarrollo: |
          $$
          \frac{R_{ce}}{R_{TOTAL}} = \frac{7{,}459\cdot 10^{-4}}
          {1{,}40741\cdot 10^{-3}} = 53{,}0\ \%
          $$

          Con el reparto completo: convección interior 15,9 %, acero 0,26 %,
          aislante 30,8 % y convección exterior 53,0 %.

      - tipo: justificar
        pregunta: Ordena la conclusión de ingeniería. Una pieza es falsa.
        piezas:
          - texto: >-
              Más de la mitad de la resistencia del conjunto está en la
              película de aire exterior, en reposo.
          - texto: >-
              El aislante aporta el 31 % y la chapa de acero, el 0,26 %: entre
              los dos metales y aislantes, manda con diferencia el aislante.
          - texto: >-
              Luego, para reducir pérdidas, actuar sobre el aire exterior
              rinde más que engordar el aislamiento.
          - texto: >-
              Y por eso conviene poner un ventilador que mueva el aire
              alrededor de la tubería.
            trampa: true
            mensaje: |
              Ventilar sube el coeficiente de convección, así que **baja** esa
              resistencia y el tubo pierde **más** calor. Aquí la resistencia
              exterior es una aliada: si lo que quieres es conservar el calor
              del agua, el aire quieto te conviene. La lección es que la
              resistencia dominante es donde más se nota cualquier cambio,
              para bien o para mal.
    resolucion: |
      **a) La potencia.** Balance de energía sobre el agua, con el modelo
      incompresible:

      $$
      \dot Q = \dot m\,c_p\,\Delta\theta = 0{,}3\cdot 4.500\cdot 100
      = 135.000\ \text{W}
      $$

      **b) La longitud.** El circuito de dentro hacia afuera —convección
      interior, acero, aislante— tiene todas sus resistencias inversamente
      proporcionales a $L$, así que la longitud sale despejando:

      $$
      \dot Q = \frac{\theta_{f,int} - \theta_3}{(R_{ci}+R_1+R_2)}
      \;\Longrightarrow\;
      L = \frac{135.000}{1.421{,}7} \approx 95\ \text{m}
      $$

      **c) El reparto.** Con la resistencia exterior sacada por diferencia:

      | resistencia | K/W | % |
      |---|---|---|
      | convección interior | $2{,}24\cdot 10^{-4}$ | 15,9 |
      | acero | $3{,}65\cdot 10^{-6}$ | 0,26 |
      | aislante | $4{,}34\cdot 10^{-4}$ | 30,8 |
      | **convección exterior** | $7{,}46\cdot 10^{-4}$ | **53,0** |

      **Lo que hay que llevarse.** La resistencia dominante es la película de
      aire exterior, y la del acero es despreciable: 0,26 %. Identificar cuál
      manda **antes** de decidir dónde invertir es todo el oficio de este
      tema, y aquí la respuesta es incómoda —lo que más pesa no es el material
      que has elegido, sino el aire que hay fuera—.
