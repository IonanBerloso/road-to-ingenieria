ejercicios:
  - id: exter1718-ext-3-sesenta-centimetros-de-fachada-y-tres-vatios
    titulo: Sesenta centímetros de fachada, y tres vatios por metro cuadrado
    fuente: Ejercicio 3 de la convocatoria extraordinaria de 2017-2018, celebrada el 18 de junio de 2018 · Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El PDF trae la resolución manuscrita del profesor; el desarrollo se hizo a ciegas desde el enunciado y se contrastó después contra ella.
    nivel: examen
    enunciado: |
      La fachada de una vivienda está compuesta de dos capas: la del lado
      exterior, en contacto con aire a $5\ ^\circ\text{C}$, tiene un espesor de
      $20\ \text{cm}$ y una conductividad térmica de
      $0{,}3\ \text{W/m}\cdot\text{K}$. El coeficiente de convección entre el
      aire exterior y la superficie de esa capa es de
      $11\ \text{W/m}^{2}\text{K}$. La capa del lado interior, en contacto con
      el aire interior, tiene un espesor de $40\ \text{cm}$ y conductividad
      térmica de $0{,}1\ \text{W/m}\cdot\text{K}$. La temperatura superficial de
      dicha capa interior es de $20\ ^\circ\text{C}$. Calcúlese la densidad del
      flujo de calor a través de la fachada, la temperatura en el medio de cada
      una de las capas y la temperatura superficial exterior de la fachada.
      Despréciese el intercambio de calor por radiación.
    pide: El flujo de calor por metro cuadrado y tres temperaturas dentro del muro.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado no da el coeficiente de convección del aire **interior**.
          ¿Falta un dato?
        opciones:
          - texto: No — da la temperatura de la superficie interior, y con ella el circuito arranca ahí
            correcta: true
            mensaje: |
              Exacto. Ese coeficiente serviría para llegar desde el aire
              interior hasta la pared, y ese tramo ya nos lo dan resuelto: la
              superficie está a 20 °C. El circuito va de esa superficie hasta
              el aire de fuera, y ahí están todas las resistencias que hacen
              falta.
          - texto: Sí, y hay que suponerlo igual al exterior, 11 W/m²K
            mensaje: |
              Suponerlo sería inventar un dato, y además cambiaría el
              resultado. No hace falta: el enunciado da la temperatura de la
              superficie interior justamente para que no tengas que cruzar ese
              tramo.
          - texto: Sí, pero se puede despejar al final imponiendo que el aire interior esté a 20 °C
            mensaje: |
              Cuidado con esa lectura: los 20 °C son de la **superficie**, no
              del aire interior. El aire interior estará algo más caliente, y
              cuánto más depende justo del coeficiente que no tenemos.
          - texto: No, porque al despreciar la radiación desaparece la convección interior
            mensaje: |
              Son dos mecanismos distintos. Despreciar la radiación quita el
              término de radiación, no el de convección. Lo que hace
              innecesaria la convección interior es tener ya la temperatura de
              la superficie.

      - tipo: calcular
        titulo: El flujo de calor
        pregunta: |
          ¿Cuánto calor atraviesa cada metro cuadrado de fachada?
        respuesta:
          tipo: magnitud
          valor: '3.15 W/m^2'
          tolerancia: 0.02
          formato: una densidad de flujo de calor, con su unidad
        distractores:
          - valor: '4.38 W/m^2'
            mensaje: |
              Has cruzado los espesores con las conductividades: los 40 cm van
              con $k = 0{,}1$ y los 20 con $0{,}3$, no al revés. Fíjate en que
              la capa gruesa es además la peor conductora — es la que aísla.
          - valor: '0.0321 W/m^2'
            mensaje: |
              Has metido los espesores en centímetros. La conductividad está en
              vatios por **metro** y kelvin, así que 40 cm son 0,40 m.
        pista: |
          $q = \dfrac{\Delta\theta}{\sum R}$, con
          $R = \dfrac{e}{k}$ en cada capa y $R = \dfrac{1}{h}$ en la película.
        desarrollo: |
          $$
          \sum R = \frac{0{,}40}{0{,}1} + \frac{0{,}20}{0{,}3} + \frac{1}{11}
          = 4 + 0{,}667 + 0{,}091 = 4{,}758\ \text{m}^{2}\text{K/W}
          $$

          $$
          q = \frac{20-5}{4{,}758} = 3{,}15\ \text{W/m}^{2}
          $$

      - tipo: calcular
        titulo: La temperatura de la superficie exterior
        pregunta: |
          Bajando por el circuito desde los $20\ ^\circ\text{C}$, ¿a qué
          temperatura está la cara exterior de la fachada?
        respuesta:
          tipo: magnitud
          valor: '5.28 °C'
          tolerancia: 0.002
          formato: una temperatura, con su unidad
        distractores:
          - valor: '7.39 °C'
            mensaje: |
              Esa es la temperatura de la **junta entre las dos capas**. Falta
              bajar todavía los 20 cm de la capa exterior, que valen 0,667 de
              resistencia.
          - valor: '20 °C'
            mensaje: |
              Esa es la superficie **interior**, que es dato. La exterior está
              quince grados más abajo, y por eso hay flujo de calor.
        pista: |
          $\theta = 20 - q\,R$, sumando las resistencias que has ido dejando
          atrás.
        desarrollo: |
          $$
          \theta_{ext} = 20 - 3{,}15\,(4 + 0{,}667) = 5{,}28\ ^\circ\text{C}
          $$

          Y comprobando: $5{,}28 - 3{,}15/11 = 5{,}0$, el aire de fuera.

      - tipo: justificar
        pregunta: Ordena la lectura del reparto de resistencias. Una pieza es falsa.
        piezas:
          - texto: 'La capa interior sola vale 4 de los 4,758 de resistencia total: el 84 %.'
          - texto: 'Y la película de aire exterior, 0,091, es cincuenta y una veces menor que las dos capas juntas — por eso la cara exterior está a 5,28 y el aire a 5,0.'
          - texto: 'Para que la fachada aísle más, lo que más rinde es subir el coeficiente de convección exterior.'
            trampa: true
            mensaje: |
              Justo al revés, y es lo que este ejercicio enseña. Esa resistencia
              es **la más pequeña de las tres**: aunque la hicieras infinita
              solo ganarías un 2 % del total. Lo que manda es la capa interior,
              que ella sola vale el 84 %. En un circuito en serie, la
              resistencia que decide es la mayor, y las demás casi no se notan.
    resolucion: |
      **Por qué no falta el coeficiente del aire interior.** Es lo primero que
      uno echa en falta, y no hace falta: el enunciado da la **temperatura de
      la superficie** interior, que es justo el otro extremo de ese tramo. El
      circuito arranca ahí y termina en el aire de fuera.

      **Las tres resistencias, por metro cuadrado:**

      | tramo | resistencia | del total |
      |---|---|---|
      | capa interior, 40 cm con $k=0{,}1$ | 4,000 | **84 %** |
      | capa exterior, 20 cm con $k=0{,}3$ | 0,667 | 14 % |
      | película de aire exterior, $h=11$ | 0,091 | 2 % |

      $$
      q = \frac{20-5}{4{,}758} = 3{,}15\ \text{W/m}^{2}
      $$

      **Las temperaturas**, bajando por el circuito y perdiendo en cada tramo
      lo que su resistencia se lleva:

      $$
      \theta(\text{media de la capa interior}) = 20 - 3{,}15 \cdot 2 = 13{,}69\ ^\circ\text{C}
      $$

      $$
      \theta(\text{junta}) = 20 - 3{,}15 \cdot 4 = 7{,}39\ ^\circ\text{C}
      $$

      $$
      \theta(\text{media de la capa exterior}) = 7{,}39 - 3{,}15 \cdot 0{,}333 = 6{,}34\ ^\circ\text{C}
      $$

      $$
      \theta(\text{superficie exterior}) = 7{,}39 - 3{,}15 \cdot 0{,}667 = 5{,}28\ ^\circ\text{C}
      $$

      La comprobación que cierra el problema: desde esos 5,28 hasta el aire de
      5,0 hay $3{,}15/11 = 0{,}29$ grados, y cuadra.

      **Lo que hay que llevarse, y son tres cosas.**

      La primera es el reparto: **la capa interior sola es el 84 % del
      aislamiento**. Si alguien quiere que esa fachada pierda menos, ahí es
      donde tiene que gastar el dinero; engordar la capa exterior rinde seis
      veces menos por centímetro.

      La segunda es la película de aire, que vale un 2 %. Aunque soplara un
      vendaval y el coeficiente se multiplicara por diez, el flujo apenas
      cambiaría. **En una serie de resistencias manda la mayor**, y el resto es
      casi decorativo — que es exactamente lo contrario de lo que pasa en un
      intercambiador con aceite, donde la película lo era todo.

      Y la tercera se ve mirando el número final: sesenta centímetros de muro
      dejan pasar **3,15 W por metro cuadrado**. Una fachada de cien metros
      cuadrados pierde 315 vatios, menos que tres bombillas viejas. Es el
      orden de magnitud con el que se dimensiona una calefacción, y conviene
      tenerlo en la cabeza para saber cuándo un resultado es absurdo.

      > **Un apunte sobre el método.** La resolución oficial no usa el circuito
      > de resistencias: integra la ecuación del calor en cada capa y determina
      > las cuatro constantes con las condiciones de contorno. Sale lo mismo,
      > claro, y merece leerse — el circuito es el camino corto para una pared
      > plana con conductividades constantes, y la integración es el que sigue
      > valiendo cuando alguna de esas dos cosas deja de cumplirse.

  - id: exter1718-ext-1-el-ciclo-reversible-que-rinde-el-diez-por-ciento
    titulo: El ciclo reversible que rinde menos del diez por ciento
    fuente: Ejercicio 1 de la convocatoria extraordinaria de 2017-2018, celebrada el 18 de junio de 2018 · Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El PDF trae la resolución manuscrita del profesor; el desarrollo se hizo a ciegas desde el enunciado y se contrastó después contra ella.
    nivel: examen
    enunciado: |
      $1\ \text{kg}$ de nitrógeno desarrolla un ciclo termodinámico reversible
      formado por 3 procesos politrópicos. Inicalmente el nitrógeno evoluciona
      desde $11\ \text{bar}$ y $777\ ^\circ\text{C}$ hasta $8\ \text{bar}$ y
      $1367\ ^\circ\text{C}$. A continuación, evoluciona hasta una presión de
      $4\ \text{bar}$. Finalmente, regresa al estado inicial del ciclo según una
      politrópica de exponente $2{,}5$. Determínese para cada uno de los
      procesos, el exponente politrópico y el calor específico politrópico.
      Calcúlese también el rendimiento del ciclo. Considérese el nitrógeno gas
      ideal con calores específicos constantes.

      *Para el nitrógeno, la resolución toma
      $R' = 0{,}297\ \text{kJ/kg}\cdot\text{K}$ y $\gamma = 1{,}4$.*
    pide: Los tres exponentes, los tres calores específicos politrópicos y el rendimiento.
    pasos:
      - tipo: reconocer
        pregunta: |
          Del tramo 2-3 solo se sabe la presión final, 4 bar. ¿Cómo se fija el
          estado 3?
        opciones:
          - texto: Con el tramo 3-1, del que sí se conoce el exponente y los dos extremos de presión
            correcta: true
            mensaje: |
              Eso es, y es la llave del ejercicio. El tramo 3-1 tiene
              $n = 2{,}5$ y va de 4 a 11 bar hasta un estado 1 conocido, así que
              la relación politrópica da $T_3$. Con el estado 3 completo, el
              exponente del 2-3 sale de sus dos extremos.
          - texto: Con el propio tramo 2-3, suponiendo su exponente
            mensaje: |
              Su exponente es precisamente una de las incógnitas. No se puede
              suponer: se deduce, y para eso primero hay que tener el estado 3
              por otro lado.
          - texto: Suponiendo que el tramo 2-3 es isotermo
            mensaje: |
              Sería inventar un dato, y además falso: el nitrógeno baja de
              1.640 K a 572 en ese tramo. Nada en el enunciado dice isotermo.
          - texto: Suponiendo que el tramo 2-3 es adiabático, porque el ciclo es reversible
            mensaje: |
              Reversible no quiere decir adiabático: cada tramo es una
              politrópica reversible, con su propio calor. De hecho el 2-3 es
              el tramo por el que el ciclo cede calor.

      - tipo: calcular
        titulo: El exponente del tramo 1-2
        pregunta: |
          De $11\ \text{bar}$ y $1050\ \text{K}$ a $8\ \text{bar}$ y
          $1640\ \text{K}$. ¿Cuánto vale $n_{12}$?
        respuesta:
          tipo: numero
          valor: '0.4166'
          tolerancia: 0.005
          formato: un número, sin unidad
        distractores:
          - valor: '2.4'
            mensaje: |
              Has invertido el cociente de logaritmos. De
              $T_2/T_1 = (P_2/P_1)^{(n-1)/n}$ se despeja
              $n = \dfrac{\ln(P_2/P_1)}{\ln\left[(P_2/P_1)/(T_2/T_1)\right]}$,
              con el de las presiones arriba.
          - valor: '0.3605'
            mensaje: |
              Has metido las temperaturas en grados Celsius. En el cociente
              $T_2/T_1$ tienen que ir en kelvin: 1640/1050, no 1367/777.
        pista: |
          $n = \dfrac{\ln(P_2/P_1)}{\ln\left[(P_2/P_1)/(T_2/T_1)\right]}$.
        desarrollo: |
          $$
          n_{12} = \frac{\ln(8/11)}{\ln\left[(8/11)/(1640/1050)\right]} = 0{,}4166
          $$

      - tipo: calcular
        titulo: La temperatura del estado 3
        pregunta: |
          Por el tramo 3-1, con $n = 2{,}5$, ¿a qué temperatura está el estado 3?
        respuesta:
          tipo: magnitud
          valor: '572.3 K'
          tolerancia: 0.004
          formato: una temperatura, con su unidad
        distractores:
          - valor: '194.5 K'
            mensaje: |
              Has invertido el exponente: es $(n-1)/n = 0{,}6$, no
              $n/(n-1)$. Con el invertido el nitrógeno bajaría a 195 K, muy por
              debajo de lo razonable.
          - valor: '786.5 K'
            mensaje: |
              Has usado $\gamma = 1{,}4$, que sería el tramo adiabático. El
              enunciado da el exponente del 3-1: 2,5.
        pista: |
          $T_3 = T_1\left(\dfrac{P_3}{P_1}\right)^{(n-1)/n}$, con $n = 2{,}5$.
        desarrollo: |
          $$
          T_3 = 1050\left(\frac{4}{11}\right)^{1{,}5/2{,}5} = 572{,}3\ \text{K}
          $$

      - tipo: calcular
        titulo: El exponente del tramo 2-3
        pregunta: |
          Ahora ya se conocen los dos extremos del 2-3. ¿Cuánto vale $n_{23}$?
        respuesta:
          tipo: numero
          valor: '-1.927'
          tolerancia: 0.005
          formato: un número, sin unidad y con su signo
        distractores:
          - valor: '1.927'
            mensaje: |
              El signo es al revés. Con $n = +1{,}927$ el nitrógeno, al bajar de
              8 a 4 bar, solo se enfriaría hasta 1.174 K; para llegar a 572 hace
              falta que la presión y el volumen se muevan juntos, y eso es un
              exponente **negativo**.
          - valor: '2.8035'
            mensaje: |
              Has usado la temperatura del estado 1, 1050 K, donde iba la del
              3, 572,3. Es fácil confundirlas porque el ciclo vuelve al 1, pero
              el tramo 2-3 termina en el 3.
        pista: |
          La misma fórmula que en el 1-2, con los extremos del 2-3.
        desarrollo: |
          $$
          n_{23} = \frac{\ln(4/8)}{\ln\left[(4/8)/(572{,}3/1640)\right]} = -1{,}927
          $$

      - tipo: calcular
        titulo: El calor específico del tramo 2-3
        pregunta: |
          Con $c_v = R'/(\gamma-1) = 0{,}7425\ \text{kJ/kg}\cdot\text{K}$, ¿cuánto
          vale el calor específico politrópico del tramo de exponente negativo?
        respuesta:
          tipo: magnitud
          valor: '0.844 kJ/(kg K)'
          tolerancia: 0.02
          formato: un calor específico, con su unidad
        distractores:
          - valor: '-0.844 kJ/(kg K)'
            mensaje: |
              El signo es al revés. En $c_v\,\dfrac{\gamma-n}{1-n}$, con
              $n = -1{,}927$ numerador y denominador son **positivos**. Un
              exponente negativo da calor específico positivo.
          - valor: '0.7425 kJ/(kg K)'
            mensaje: |
              Ese es $c_v$ a secas. El calor específico politrópico es otro,
              distinto para cada tramo, y es el que multiplica el salto de
              temperatura para dar el calor.
        pista: |
          $c_n = c_v\,\dfrac{\gamma-n}{1-n}$.
        desarrollo: |
          $$
          c_{n,23} = 0{,}7425 \cdot \frac{1{,}4+1{,}927}{1+1{,}927} = 0{,}8440\ \text{kJ/kg}\cdot\text{K}
          $$

      - tipo: calcular
        titulo: El rendimiento del ciclo
        pregunta: |
          El trabajo neto sale $97{,}4\ \text{kJ/kg}$. El calor entra en los
          tramos 1-2 ($738{,}4$) y 3-1 ($260{,}1$). ¿Cuánto rinde el ciclo?
        respuesta:
          tipo: numero
          valor: '9.8'
          tolerancia: 0.3
          formato: el rendimiento en tanto por ciento, sin el símbolo
        distractores:
          - valor: '65.1'
            mensaje: |
              Ese es el rendimiento de **Carnot** entre 1.640 y 572 K, que es el
              máximo que podría dar un ciclo entre esas temperaturas. Este es
              reversible y aun así no se acerca, y ver por qué es lo que el
              ejercicio enseña.
          - valor: '13.2'
            mensaje: |
              Has dividido solo entre el calor del tramo 1-2. El 3-1 también
              absorbe calor —la temperatura sube de 572 a 1.050 K con $c_n$
              positivo—, y el rendimiento va sobre **todo** el calor que entra.
        pista: |
          $\eta = \dfrac{w_{neto}}{q_{entra}}$, sumando los dos tramos que
          absorben calor.
        desarrollo: |
          $$
          \eta = \frac{97{,}4}{738{,}4+260{,}1} = 0{,}0975
          $$

          Es decir, un **9,8 %**.

      - tipo: justificar
        pregunta: Ordena por qué un ciclo reversible rinde tan poco. Una pieza es falsa.
        piezas:
          - texto: 'Los tres calores específicos politrópicos son positivos, así que el calor entra donde la temperatura sube —tramos 1-2 y 3-1— y sale donde baja, en el 2-3.'
          - texto: 'El ciclo es reversible y rinde un 9,8 %, lejísimos del 65 % de Carnot entre 1.640 y 572 K: el calor no entra a la temperatura máxima ni sale a la mínima, sino repartido por todo el recorrido.'
          - texto: 'Como el ciclo es reversible, su rendimiento tiene que ser el de Carnot entre sus temperaturas extremas.'
            trampa: true
            mensaje: |
              Solo un ciclo reversible que tome **todo** el calor a la
              temperatura máxima y ceda **todo** a la mínima rinde como Carnot.
              Este es reversible tramo a tramo, pero absorbe calor a
              temperaturas que van de 572 a 1.640 K y lo cede entre 1.640 y 572.
              Reversible dice que no se genera entropía dentro; no dice nada de
              a qué temperaturas entra y sale el calor, que es lo que decide el
              rendimiento.
    resolucion: |
      **La llave, antes de ninguna cuenta: cómo se fija el estado 3.** Del tramo
      2-3 solo se sabe la presión final. Pero el 3-1 tiene exponente conocido,
      $n = 2{,}5$, y termina en el estado 1, que está completo:

      $$
      T_3 = 1050\left(\frac{4}{11}\right)^{1{,}5/2{,}5} = 572{,}3\ \text{K}
      $$

      **Los tres exponentes y los tres calores específicos.** Con
      $c_v = R'/(\gamma-1) = 0{,}297/0{,}4 = 0{,}7425\ \text{kJ/kg}\cdot\text{K}$:

      $$
      n_{12} = \frac{\ln(8/11)}{\ln\left[(8/11)/(1640/1050)\right]} = 0{,}4166
      \qquad
      n_{23} = \frac{\ln(4/8)}{\ln\left[(4/8)/(572{,}3/1640)\right]} = -1{,}927
      $$

      $$
      c_{n,12} = 0{,}7425\cdot\frac{1{,}4-0{,}4166}{1-0{,}4166} = 1{,}2516
      \qquad
      c_{n,23} = 0{,}7425\cdot\frac{1{,}4+1{,}927}{1+1{,}927} = 0{,}8440
      \qquad
      c_{n,31} = 0{,}7425\cdot\frac{1{,}4-2{,}5}{1-2{,}5} = 0{,}5445
      $$

      **Los tres exponentes caen en tres regiones distintas de la familia**
      —entre 0 y 1, negativo, y mayor que $\gamma$— y los tres dan calor
      específico positivo. Por eso cada calor va en el sentido en que se mueve
      la temperatura.

      **El calor y el trabajo de cada tramo**, por kilogramo:

      | tramo | exponente | calor | trabajo |
      |---|---|---|---|
      | 1-2 | 0,4166 | +738,4 kJ/kg | +300,4 kJ/kg |
      | 2-3 | −1,927 | −901,1 kJ/kg | −108,3 kJ/kg |
      | 3-1 | 2,5 | +260,1 kJ/kg | −94,6 kJ/kg |

      $$
      w_{12} = \frac{0{,}297\,(1640-1050)}{1-0{,}4166} = 300{,}4
      \qquad
      w_{23} = \frac{0{,}297\,(572{,}3-1640)}{1+1{,}927} = -108{,}3
      \qquad
      w_{31} = \frac{0{,}297\,(1050-572{,}3)}{1-2{,}5} = -94{,}6
      $$

      **La comprobación que un ciclo siempre permite:** el calor neto tiene que
      ser igual al trabajo neto. $738{,}4 - 901{,}1 + 260{,}1 = 97{,}4$ y
      $300{,}4 - 108{,}3 - 94{,}6 = 97{,}5$: el mismo número salvo el redondeo.

      $$
      \eta = \frac{97{,}4}{738{,}4+260{,}1} = 0{,}0975
      $$

      **Un 9,8 %, en un ciclo reversible.** Carnot entre las temperaturas
      extremas del ciclo daría $1 - 572{,}3/1640 = 0{,}651$, un 65 %. La
      distancia no la produce ninguna irreversibilidad —no hay ninguna—: la
      produce que el calor entra a temperaturas que van de 572 a 1.640 K y sale
      a temperaturas repartidas igual. Para rendir como Carnot haría falta
      tomarlo todo arriba y cederlo todo abajo. **Reversible dice que no se
      genera entropía; no dice a qué temperatura entra el calor**, y eso es lo
      que decide el rendimiento.

      > **Sobre el calor específico a volumen constante.** La resolución oficial
      > escribe $c_v = R'/(\gamma-1)$ y pone 0,737, que no es lo que da esa
      > fórmula con $R' = 0{,}297$: da 0,7425. Con su valor, los calores salen
      > un 0,7 % más bajos —732,8, −894,7 y 258,0— y el ciclo **no cierra**: el
      > calor neto queda en 96,1 frente a un trabajo de 97,1. Con el valor
      > coherente cierra, que es la comprobación de arriba. El rendimiento sale
      > 9,8 % de las dos maneras.

  - id: exter1718-ext-2-los-signos-antes-de-la-cuenta
    titulo: Los signos antes de la cuenta, y un universo que genera aunque el proceso no
    fuente: Ejercicio 2 de la convocatoria extraordinaria de 2017-2018, celebrada el 18 de junio de 2018 · Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El PDF trae la resolución manuscrita del profesor; el desarrollo se hizo a ciegas desde el enunciado y se contrastó después contra ella.
    nivel: examen
    enunciado: |
      $100\ \text{dm}^{3}$ de aire se encuentran a $4{,}8\ \text{bar}$ y
      $305\ ^\circ\text{C}$ en un cilindro-pistón, que al contacto con un foco a
      $5\ ^\circ\text{C}$, se enfrían hasta los $41\ ^\circ\text{C}$ según un
      proceso de exponente politrópico $-1{,}4$. Calcúlese el intercambio de
      calor y de trabajo total, así como la entropía generada en el universo.
      Se valorará especialmente aquellas resoluciones que deduzcan previamente
      a cualquier cálculo, el signo de los resultados.

      *Para el aire, la resolución toma $c_p = 1{,}005$, $c_v = 0{,}718$ y
      $R' = 0{,}287\ \text{kJ/kg}\cdot\text{K}$.*
    pide: El signo y el valor del calor, del trabajo y de la entropía generada en el universo.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de calcular: con $n = -1{,}4$ y el aire enfriándose, ¿qué le
          pasa a su volumen?
        opciones:
          - texto: Baja, y con él la presión, porque con exponente negativo van juntas y su producto es la temperatura
            correcta: true
            mensaje: |
              Eso es. Con $n$ negativo, $P = C\,v^{1{,}4}$: la presión y el
              volumen se mueven en el mismo sentido. Como $Pv = R'T$ y la
              temperatura baja, bajan los dos. Y si el volumen baja, **el aire
              recibe trabajo**: $W < 0$ sin hacer una sola cuenta.
          - texto: Sube, porque en una politrópica cuando la presión baja el volumen sube
            mensaje: |
              Eso vale para los exponentes **positivos**, que son los de clase.
              Con $n = -1{,}4$ la curva del P-v sube hacia la derecha: presión
              y volumen van juntos.
          - texto: No cambia, porque el foco solo intercambia calor
            mensaje: |
              El foco solo intercambia calor, pero el proceso tiene su propia
              ley, $Pv^{-1{,}4} = \text{cte}$, y con la temperatura bajando esa
              ley obliga a que el volumen cambie.
          - texto: No se puede saber sin calcular primero la presión final
            mensaje: |
              Se puede, y el enunciado premia hacerlo: basta con saber que con
              exponente negativo presión y volumen van juntos, y que su
              producto —la temperatura— baja.

      - tipo: calcular
        titulo: El trabajo
        pregunta: |
          Hay $0{,}2894\ \text{kg}$ de aire. ¿Cuánto trabajo intercambia?
        respuesta:
          tipo: magnitud
          valor: '-9.135 kJ'
          tolerancia: 0.02
          formato: un trabajo, con su unidad y con su signo
        distractores:
          - valor: '9.135 kJ'
            mensaje: |
              El módulo está bien y el signo no. El volumen baja, así que el aire
              **recibe** trabajo — el signo que el enunciado pide deducir antes
              de calcular.
          - valor: '-21.92 kJ'
            mensaje: |
              Te has dejado el denominador: el trabajo de una politrópica es
              $m\,R'\,\Delta T/(1-n)$, y aquí $1-n = 2{,}4$.
        pista: |
          $W = m\,\dfrac{R'\,(T_2-T_1)}{1-n}$.
        desarrollo: |
          $$
          W = 0{,}2894\cdot\frac{0{,}287\,(314-578)}{1+1{,}4} = -9{,}14\ \text{kJ}
          $$

      - tipo: calcular
        titulo: El calor
        pregunta: |
          La energía interna del aire baja $54{,}86\ \text{kJ}$. ¿Cuánto calor
          intercambia?
        respuesta:
          tipo: magnitud
          valor: '-63.99 kJ'
          tolerancia: 0.02
          formato: un calor, con su unidad y con su signo
        distractores:
          - valor: '-54.86 kJ'
            mensaje: |
              Esa es la variación de **energía interna**. Coincidiría con el
              calor si no hubiera trabajo, y aquí el aire recibe 9,1 kJ que
              también tiene que soltar.
          - valor: '-45.73 kJ'
            mensaje: |
              Has restado el trabajo con el signo cambiado. $Q = \Delta U + W$,
              y los dos son negativos: se suman, no se compensan.
        pista: |
          $Q = \Delta U + W$.
        desarrollo: |
          $$
          Q = -54{,}86 - 9{,}14 = -64{,}0\ \text{kJ}
          $$

          O por el calor específico politrópico,
          $c_n = 0{,}718\cdot\frac{1{,}4+1{,}4}{1+1{,}4} = 0{,}8377$:
          $Q = 0{,}2894\cdot 0{,}8377\cdot(314-578) = -64{,}0\ \text{kJ}$.

      - tipo: calcular
        titulo: La entropía generada en el universo
        pregunta: |
          La entropía del aire baja $0{,}1479\ \text{kJ/K}$, y el foco a
          $278\ \text{K}$ recibe los 64 kJ. ¿Cuánta entropía se genera?
        respuesta:
          tipo: magnitud
          valor: '0.0823 kJ/K'
          tolerancia: 0.02
          formato: una entropía, con su unidad
        distractores:
          - valor: '-0.1479 kJ/K'
            mensaje: |
              Esa es la variación de entropía **del aire**. Baja porque el aire
              cede calor. El universo son el aire y el foco juntos, y la
              generada no puede ser negativa.
          - valor: '0.2302 kJ/K'
            mensaje: |
              Esa es solo la del **foco**, $64/278$. Falta sumarle la del aire,
              que es negativa.
        pista: |
          $S_G = \Delta S_{aire} + \dfrac{-Q_{aire}}{T_{foco}}$.
        desarrollo: |
          $$
          S_G = -0{,}1479 + \frac{63{,}99}{278} = 0{,}0823\ \text{kJ/K}
          $$

      - tipo: justificar
        pregunta: Ordena los signos y su porqué. Una pieza es falsa.
        piezas:
          - texto: 'El volumen baja, así que el aire recibe trabajo: W < 0.'
          - texto: 'La temperatura baja, así que la energía interna baja; y como además recibe trabajo, el calor que cede es mayor que lo que baja U: Q = ΔU + W < 0.'
          - texto: 'Como el proceso es politrópico, y por tanto reversible, la entropía generada en el universo es cero.'
            trampa: true
            mensaje: |
              La politrópica es reversible **por dentro**: el aire no genera
              entropía. Pero el calor pasa de un aire que está entre 578 y 314 K
              a un foco a 278 K, y cruzar una diferencia finita de temperatura
              es irreversible. El universo genera 0,0823 kJ/K. Que cada parte
              sea reversible no hace reversible al conjunto.
    resolucion: |
      **Los signos, antes de calcular, que es lo que el enunciado puntúa
      aparte.** Con exponente negativo, $P = C\,v^{1{,}4}$: presión y volumen
      van juntos, y su producto —la temperatura— baja de 578 a 314 K. Así que el
      volumen baja y **el aire recibe trabajo**, $W < 0$. La temperatura baja,
      así que $\Delta U < 0$; y $Q = \Delta U + W$ es la suma de dos negativos:
      **el aire cede calor**, más del que pierde en energía interna. Y la
      entropía generada en el universo es **positiva**, porque hay calor
      cruzando una diferencia finita de temperatura.

      **Los números.** La masa sale de la ecuación de estado:

      $$
      m = \frac{4{,}8\cdot 10^{5}\cdot 0{,}1}{287\cdot 578} = 0{,}2894\ \text{kg}
      $$

      $$
      W = 0{,}2894\cdot\frac{0{,}287\,(314-578)}{1+1{,}4} = -9{,}14\ \text{kJ}
      \qquad
      \Delta U = 0{,}2894\cdot 0{,}718\cdot(314-578) = -54{,}86\ \text{kJ}
      $$

      $$
      Q = \Delta U + W = -64{,}0\ \text{kJ}
      $$

      **La entropía del universo**, que son el aire y el foco. La presión final
      sale de la politrópica, $P_2 = 4{,}8\,(314/578)^{0{,}5833} = 3{,}363$ bar:

      $$
      \Delta S_{aire} = 0{,}2894\left(1{,}005\ln\frac{314}{578} - 0{,}287\ln\frac{3{,}363}{4{,}8}\right)
      = -0{,}1479\ \text{kJ/K}
      $$

      $$
      \Delta S_{foco} = \frac{63{,}99}{278} = 0{,}2302\ \text{kJ/K}
      \qquad
      S_G = -0{,}1479 + 0{,}2302 = 0{,}0823\ \text{kJ/K}
      $$

      **Dónde está la irreversibilidad, que es la trampa.** El proceso es
      politrópico y por tanto reversible **por dentro**: el aire no genera
      nada. Toda la entropía generada está en la frontera, en el calor que pasa
      de un aire entre 578 y 314 K a un foco a 278. Es la misma lección que los
      dos gases con pistón de enero de 2018: **que cada parte sea reversible no
      hace reversible al conjunto**.

      > **Sobre las cifras oficiales.** La resolución da $Q = -63{,}91$ kJ y
      > $W = -9{,}135$ kJ. La diferencia con los de aquí está en la masa, que
      > redondea a 0,289 en la cuenta del calor y usa sin redondear en la del
      > trabajo. $S_G = 0{,}082$ kJ/K sale igual.
