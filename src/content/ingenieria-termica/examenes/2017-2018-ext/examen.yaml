asignatura: ingenieria-termica
convocatoria: extraordinaria
curso: '2017-2018'
fecha: 18 de junio de 2018
# Bilingüe, con el castellano en la primera página y el euskera en la segunda.
# Da **3 horas**, media más que la mayoría, y cada ejercicio vale un tercio.
#
# **Es la última convocatoria celebrada en junio.** A partir de 2019-2020 la
# segunda convocatoria pasa a enero o febrero, así que este examen y los de
# 2016-2017 y anteriores son el final de una época — y se nota en el tiempo,
# tres horas frente a las 2,5 de ahora.
#
# Su ejercicio 3, el que entra, es el más limpio de transmisión de calor de
# toda la asignatura: una fachada de dos capas donde **todos los datos están en
# el enunciado** y no hace falta abrir el anexo ni una vez. Por eso vale como
# peldaño de entrada al circuito de resistencias, que es un sitio donde el
# corpus tenía ejercicios de examen pero ninguno tan desnudo.
pdf: 2017-2018-ext.pdf

fuera:
  - n: 1
    motivo: >-
      Un kilogramo de nitrógeno recorriendo **un ciclo cerrado de tres
      politrópicas**: de 11 bar y 777 °C a 8 bar y 1367 °C, después hasta 4 bar,
      y de vuelta al principio por una politrópica de exponente 2,5. Pide el
      exponente y el calor específico politrópico de cada tramo, y el
      rendimiento del ciclo. **Sin transcribir todavía**: no falta material —el
      PDF trae su resolución oficial— sino el trabajo de escribirlo, que aquí
      es mucho: son tres procesos y hay que llevar la cuenta de los signos en
      los tres. Es el único sitio del material donde el exponente politrópico
      se usa para algo más que un proceso suelto, así que cuando se escriba
      conviene que sea entero y con su diagrama.

      **Y es el único ciclo que sigue estando en el temario.** Hay otro en
      enero de 2016 —una turbina de gas con regeneración— pero los ciclos de
      potencia salieron del programa y no vuelven a caer; este, en cambio, no
      es un ciclo de potencia sino tres politrópicas encadenadas, que es
      materia del tema 3 y se examina todos los años.
  - n: 2
    motivo: >-
      Cien decímetros cúbicos de aire a 4,8 bar y 305 °C en un cilindro-pistón
      que se enfría hasta 41 °C contra un foco a 5 °C, por una politrópica de
      exponente $-1{,}4$. Pide el calor, el trabajo y la entropía generada en el
      universo, y añade una frase que conviene no perderse: «se valorará
      especialmente aquellas resoluciones que **deduzcan previamente a
      cualquier cálculo el signo de los resultados**». **Sin transcribir
      todavía**, y con el mismo aviso que el ejercicio 3 de enero de 2019: es
      la cuarta aparición de la familia de los signos, y lo que aporta es que
      aquí los signos son **la mitad de la nota de un ejercicio normal**, no un
      ejercicio aparte. Cuando se escriba, eso es lo que hay que destacar.

ejercicios:
  # Ejercicio 3 · la fachada de dos capas. Todos los datos en el enunciado, sin
  # anexo, y el reparto de resistencias a la vista: 84 % / 14 % / 2 %.
  - id: exter1718-ext-3-sesenta-centimetros-de-fachada-y-tres-vatios
