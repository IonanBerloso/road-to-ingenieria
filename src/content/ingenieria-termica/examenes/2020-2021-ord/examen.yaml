curso: '2020-2021'
convocatoria: ordinaria
fecha: enero de 2021
# Bilingüe, con el castellano en la primera página y el euskera en la segunda.
# Da **3,5 horas**, que junto a febrero de 2022 es la excepción frente a las
# 2,5 de la mayoría.
#
# **Es el único examen encadenado del corpus**, y eso cambia cómo se hace. El
# ejercicio 2 dice literalmente «el proceso que ocurre en el ejercicio
# anterior» y el 3 arranca con «el agua del ejercicio 2». Un fallo en el
# primero se arrastra hasta el final, así que aquí los números intermedios hay
# que anotarlos con cuidado: el gasto de agua, 0,435 kg/s, no lo pide el
# ejercicio 1 pero lo necesita el 3.
#
# Su ejercicio 1 vale por lo que enseña de un intercambiador con aceite: el
# aceite está a 101 °C y la pared que lo toca, a 30. **Setenta y un grados de
# caída en una película de décimas de milímetro**, mientras el acero del tubo
# se lleva dos. En un intercambiador con aceite el cuello de botella está
# siempre en el aceite.
pdf: 2020-2021-ord.pdf

fuera:
  - n: 2
    motivo: >-
      Pide la exergía destruida y el rendimiento exergético del proceso entre
      el agua y el aceite del ejercicio anterior, tomando como temperatura de
      referencia la del fluido más frío. **Sin transcribir todavía**: no falta
      material —el PDF trae su resolución oficial— sino el trabajo de
      escribirlo. Es además el único del corpus donde **la temperatura de
      referencia no es un ambiente sino uno de los fluidos del problema**, lo
      que conviene tratar despacio cuando se escriba.
  - n: 3
    motivo: >-
      El agua del ejercicio 2, al salir de los 9,5 m, se envía a una cámara
      adiabática donde se mezcla con 1 kg/s de vapor a 400 °C y 6 bar. Pide el
      rendimiento exergético de la bomba necesaria antes de la cámara —con
      rendimiento interno del 82 % y presión de entrada 1,4 bar— y la exergía
      destruida en la mezcla. **Sin transcribir todavía**, por lo mismo. Es el
      tercer eslabón de la cadena, así que depende de los dos anteriores.

ejercicios:
  - id: exter2021-ord-1-el-aceite-que-se-lleva-setenta-grados
    tema: t09-conveccion
    n: 1
