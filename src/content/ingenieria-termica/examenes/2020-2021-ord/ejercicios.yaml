ejercicios:
  - id: exter2021-ord-1-el-aceite-que-se-lleva-setenta-grados
    titulo: El aceite que se lleva setenta grados, y el acero que se lleva dos
    fuente: Ejercicio 1 de la convocatoria ordinaria de enero de 2020-2021 · Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen es bilingüe y publica su resolución oficial manuscrita, contra la que está contrastado el desarrollo.
    nivel: examen
    enunciado: |
      Dos tubos concéntricos de $9{,}5\ \text{m}$ de longitud conducen por el
      tubo interior $0{,}9\ \text{kg/s}$ de aceite para motor que entra a
      $106\ ^\circ\text{C}$ y sale a $96\ ^\circ\text{C}$, mientras por el tubo
      exterior circula agua que entra a $14\ ^\circ\text{C}$ y sale a
      $25\ ^\circ\text{C}$. El diámetro interior del tubo interior es de
      $2{,}5\ \text{cm}$, su espesor de $0{,}5\ \text{cm}$ y el diámetro
      interior del tubo exterior es de $5\ \text{cm}$. Si el tubo interior
      tiene una conductividad de $55\ \text{W/m}\cdot\text{K}$, calcúlense las
      temperaturas superficiales interior y exterior del tubo interior.
      Despréciense las pérdidas de calor entre el tubo exterior y el medio
      circundante.

      *Datos del aceite de motor: $\rho = 839{,}445\ \text{kg/m}^{3}$,
      $c_p = 2224{,}4\ \text{J/(kg}\cdot\text{K)}$,
      $k = 0{,}1366\ \text{W/(m}\cdot\text{K)}$,
      $\nu = 2{,}005\cdot10^{-5}\ \text{m}^{2}/\text{s}$, $Pr = 273{,}96$.*
    pide: Las temperaturas de las dos caras del tubo interior.
    pasos:
      - tipo: reconocer
        pregunta: |
          Para calcular el calor que pasa, ¿hace falta mirar el lado del agua?
        opciones:
          - texto: 'No: con el gasto y las dos temperaturas del aceite ya está'
            correcta: true
            mensaje: |
              Eso es. El enunciado da todo del lado del aceite —gasto, entrada
              y salida— y dice que no hay pérdidas al exterior, así que ese
              calor es el que atraviesa el tubo. Los datos del agua sirven para
              otras cosas, no para esto.
          - texto: Sí, hay que igualar los dos balances para despejar el gasto de agua
            mensaje: |
              Se puede hacer, y da el gasto de agua —0,435 kg/s—, pero es un
              rodeo: el calor ya está determinado por el lado del aceite. Ese
              gasto hará falta en el ejercicio siguiente, no en este.
          - texto: Sí, porque el calor lo fija el fluido que más se calienta
            mensaje: |
              No lo fija ninguno «más» que otro: es el mismo calor el que sale
              del aceite y entra en el agua. Se calcula por el lado donde estén
              todos los datos.
          - texto: No hace falta ningún balance, basta la conducción del tubo
            mensaje: |
              La conducción relaciona las dos caras del tubo, pero necesita
              saber **cuánto** calor pasa. Ese número solo sale de un balance
              de energía en uno de los dos fluidos.

      - tipo: calcular
        titulo: El calor que atraviesa el tubo
        pregunta: |
          ¿Cuánto calor cede el aceite?
        respuesta:
          tipo: magnitud
          valor: '20.02 kW'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '20.02 W'
            mensaje: |
              El calor específico viene en julios por kilo y kelvin, no en
              kilojulios: son 20.020 W, o sea 20,02 kW.
          - valor: '204.6 kW'
            mensaje: |
              Has usado el salto del agua, 11 grados, con el gasto del aceite.
              Cada fluido va con el suyo.
        pista: |
          $\dot{Q} = \dot{m}\,c_p\,\Delta\theta$ en el lado del aceite.
        desarrollo: |
          $$
          \dot{Q} = 0{,}9 \cdot 2{,}2244 \cdot (106-96) = 20{,}02\ \text{kW}
          $$

      - tipo: calcular
        titulo: El coeficiente de convección del aceite
        pregunta: |
          Con $Re = 2722{,}3$ y $Pr = 273{,}96$, y la correlación de
          Dittus-Boelter para fluido que se enfría,
          $Nu = 0{,}023\,Re^{0{,}8}Pr^{0{,}3}$, ¿cuánto vale $h$?
        respuesta:
          tipo: magnitud
          valor: '378.88 W/(m^2 K)'
          tolerancia: 0.02
          formato: un coeficiente de convección, con su unidad
        distractores:
          - valor: '69.34 W/(m^2 K)'
            mensaje: |
              Eso es el número de Nusselt, que es adimensional. Falta
              multiplicar por $k$ y dividir por el diámetro.
          - valor: '265.2 W/(m^2 K)'
            mensaje: |
              Has usado el exponente 0,4 del Prandtl, el del fluido que se
              **calienta**. Aquí el aceite se enfría, así que va 0,3.
        pista: |
          $h = \dfrac{Nu\,k}{D_1}$, con $k$ la del aceite.
        desarrollo: |
          $$
          Nu = 0{,}023 \cdot 2722{,}3^{0{,}8} \cdot 273{,}96^{0{,}3} = 69{,}34
          $$

          $$
          h_1 = \frac{69{,}34 \cdot 0{,}1366}{0{,}025} = 378{,}88\ \frac{\text{W}}{\text{m}^{2}\text{K}}
          $$

      - tipo: calcular
        titulo: La temperatura de la cara interior
        pregunta: |
          Con el aceite a $101\ ^\circ\text{C}$ de media y
          $A_1 = 0{,}746\ \text{m}^{2}$, ¿a qué temperatura está la cara
          interior del tubo?
        respuesta:
          tipo: magnitud
          valor: '30.18 °C'
          tolerancia: 0.005
          formato: una temperatura, con su unidad
        distractores:
          - valor: '101 °C'
            mensaje: |
              Esa es la del aceite. La pared está mucho más fría: entre el
              aceite y ella hay una película que se lleva setenta grados.
          - valor: '57.5 °C'
            mensaje: |
              Has hecho la media entre el aceite y el agua. La pared no está a
              medio camino de los dos fluidos: está donde la ponen las dos
              resistencias, y la del aceite es mucho mayor — por eso queda
              pegada al lado del agua.
        pista: |
          $\dot{Q} = h_1 A_1(\theta_{aceite}-\theta_1)$, y se despeja
          $\theta_1$.
        desarrollo: |
          $$
          \theta_1 = 101 - \frac{20019{,}6}{378{,}88 \cdot 0{,}746}
          = 30{,}18\ ^\circ\text{C}
          $$

      - tipo: justificar
        pregunta: Ordena la lectura del resultado. Una pieza es falsa.
        piezas:
          - texto: 'La película de aceite se lleva 71 grados de caída y el acero del tubo solo 2, de 30,18 a 28,13 °C.'
          - texto: 'Es lo esperable: la resistencia del acero vale 0,000102 K/W y la de la película de aceite, 0,0035 — treinta y cinco veces más.'
          - texto: 'El acero apenas resiste porque es delgado; con un tubo más grueso la caída se repartiría a medias.'
            trampa: true
            mensaje: |
              No se repartiría ni de lejos. El acero conduce 400 veces mejor
              que el aceite —55 frente a 0,1366— así que habría que engordar el
              tubo hasta lo absurdo para que su resistencia se acercara a la de
              la película. Lo que manda no es el espesor: es **la
              conductividad**, y en un intercambiador con aceite el cuello de
              botella está siempre en el aceite.
    resolucion: |
      **El calor sale del lado donde están todos los datos.** El enunciado da
      gasto y las dos temperaturas del aceite, y dice que no hay pérdidas al
      exterior, así que ese calor es el que atraviesa el tubo:

      $$
      \dot{Q} = 0{,}9 \cdot 2{,}2244 \cdot 10 = 20{,}02\ \text{kW}
      $$

      Los datos del agua no hacen falta aquí. Sirven, de paso, para saber que
      su gasto es 0,435 kg/s, que es lo que pedirá el ejercicio siguiente — este
      examen está **encadenado**, y conviene guardar los números.

      **La película de aceite.** Convección forzada interior, así que
      Dittus-Boelter con el exponente 0,3 del fluido que se enfría:

      $$
      c = \frac{0{,}9}{839{,}445 \cdot \pi \cdot 0{,}025^{2}/4} = 2{,}184\ \text{m/s}
      \qquad
      Re = \frac{2{,}184 \cdot 0{,}025}{2{,}005\cdot10^{-5}} = 2722{,}3
      $$

      $$
      Nu = 0{,}023 \cdot 2722{,}3^{0{,}8}\cdot 273{,}96^{0{,}3} = 69{,}34
      \;\Longrightarrow\;
      h_1 = 378{,}88\ \frac{\text{W}}{\text{m}^{2}\text{K}}
      $$

      La resolución oficial aplica Dittus-Boelter comparando el Reynolds con
      **2.100**, no con los 10.000 que suelen citarse como límite de validez.
      Es una convención del curso y conviene saberla: con 2.722 el flujo está
      en zona de transición, y otra fuente daría otro número.

      **Las dos temperaturas.**

      $$
      \theta_1 = 101 - \frac{20019{,}6}{378{,}88 \cdot 0{,}746} = 30{,}18\ ^\circ\text{C}
      $$

      $$
      R_{cond} = \frac{\ln(0{,}035/0{,}025)}{2\pi \cdot 55 \cdot 9{,}5} = 0{,}000102\ \text{K/W}
      \;\Longrightarrow\;
      \theta_2 = 30{,}18 - 20019{,}6 \cdot 0{,}000102 = 28{,}13\ ^\circ\text{C}
      $$

      **Y aquí está lo que hay que llevarse.** El aceite está a 101 °C y la
      pared que lo toca, a 30. **Setenta y un grados de caída en una película
      de unas décimas de milímetro.** El acero, en cambio, se lleva dos grados
      escasos.

      No es por el espesor: es por la conductividad. El acero conduce 400 veces
      mejor que el aceite, así que su resistencia —0,000102 K/W— es treinta y
      cinco veces menor que la de la película. En un intercambiador con aceite
      el cuello de botella está **siempre** en el aceite, y engordar o adelgazar
      el tubo no cambia nada apreciable. Si se quiere mejorar, se mejora la
      convección del lado malo: más velocidad, turbuladores, aletas por dentro.
