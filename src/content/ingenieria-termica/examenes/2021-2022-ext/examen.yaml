# Bilingüe, con el euskera primero y el castellano después.
#
# **Es la única de las diecisiete leídas que da tres horas** —«Denbora: 3
# ordu»—, frente a las 2,5 de la mayoría. El reparto es el de siempre: cada
# ejercicio, un tercio.
#
# Su ejercicio 2 es la turbina de gas de manual, y merece la pena por lo que
# tiene de traicionero: los dos rendimientos que pide, el isentrópico y el
# exergético, salen **98 % y 98,8 %**. Tan parecidos que invitan a pensar que
# miden lo mismo, y no lo miden — uno compara con otro proceso y el otro con
# el máximo teórico referido al ambiente. Coinciden aquí porque la máquina es
# muy buena y el salto de presión enorme.
pdf: 2021-2022-ext.pdf

fuera:
  - n: 1
    motivo: >-
      Dos corrientes de agua que se mezclan adiabáticamente: 0,5 kg/s con
      entalpía específica de 3.485 kJ/kg y otra a 111 °C con título 0,8, y la
      mezcla sale con entropía específica de 7,8 kJ/(kg·K). Pide el gasto de la
      corriente húmeda, la exergía destruida y el rendimiento exergético.
      **Sin transcribir todavía**: el PDF trae su resolución oficial, así que
      no falta material — falta escribirlo como ejercicio guiado. Es además
      inusual porque **el dato que cierra el problema es una entropía**, no una
      temperatura ni un título.
  - n: 3
    motivo: >-
      Una tubería de 5 cm de diámetro interior y 1 cm de espesor
      (k = 2 W/(m·K)) con 0,2 kg/s de agua, que atraviesa una sala a 20 °C con
      la superficie exterior a 60 °C, y después la misma tubería con 0,5 cm de
      aislante cuya superficie queda a 50 °C. Pide los dos flujos de calor y
      **la conductividad del aislante**, que es otra vez el balance térmico
      usado al revés. La resolución oficial lo resuelve con convección natural
      sobre cilindro horizontal, $Nu = 0{,}53\,Ra^{1/4}$. **Sin transcribir
      todavía**, por lo mismo que el 1.

ejercicios:
  - id: exter2122-ext-2-la-turbina-de-gas-y-los-dos-rendimientos
    tema: t04-volumen-de-control
    n: 2
