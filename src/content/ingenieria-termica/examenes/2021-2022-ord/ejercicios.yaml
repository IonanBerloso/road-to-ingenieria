ejercicios:
  - id: exter2122-ord-3-cincuenta-kilojulios-de-calor-que-quitan-exergia
    titulo: Cincuenta kilojulios de calor, y la exergía que baja
    fuente: Ejercicio 3 de la convocatoria ordinaria de 2021-2022, celebrada el 11 de enero de 2022 · Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El PDF trae la resolución manuscrita del profesor; el desarrollo se hizo a ciegas desde el enunciado y se contrastó después contra ella.
    nivel: examen
    enunciado: |
      En un dispositivo cilindro-pistón sin rozamiento se suministra
      $50\ \text{kJ/kg}$ de calor al aire que se encuentra en su interior a
      $2\ \text{bar}$ y $20\ ^\circ\text{C}$, mediante un proceso reversible,
      hasta que la temperatura llega hasta los $60\ ^\circ\text{C}$. Calcúlese
      la presión final, el trabajo intercambiado, la variación de entropía y la
      variación de exergía. Tómese como estado de referencia $1\ \text{bar}$ y
      $15\ ^\circ\text{C}$.

      Represéntese el proceso en los diagramas T-s y P-v.
    pide: La presión final, el trabajo, la variación de entropía y la de exergía.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado no dice qué proceso es: solo que es **reversible** y que
          el gas es aire. ¿Con eso basta?
        opciones:
          - texto: Sí — reversible y gas ideal significa politrópico, y el calor por grado fija el exponente
            correcta: true
            mensaje: |
              Eso es, y es el paso que decide el ejercicio entero. Todo proceso
              reversible de un gas ideal es politrópico; lo único que falta es
              **cuál**, y eso lo da el calor específico politrópico
              $c_n = q/\Delta\theta = 50/40 = 1{,}25\ \text{kJ/kg}\cdot\text{K}$.
          - texto: No — falta decir si es a presión constante, a volumen constante o adiabático
            mensaje: |
              Es la reacción natural, y esconde lo que el ejercicio quiere
              enseñar: esos tres son **casos particulares** de la familia
              politrópica, no la lista completa. Aquí el exponente sale 0,46,
              que no es ninguno de ellos.
          - texto: Hay que suponerlo isotermo, porque el calor es dato
            mensaje: |
              No puede ser isotermo: la temperatura pasa de 20 a 60 °C, y en un
              isotermo no cambiaría. Que el calor sea dato es justamente lo que
              permite **deducir** el proceso en vez de suponerlo.
          - texto: Con el calor y la temperatura final se saca todo sin necesidad de saber el proceso
            mensaje: |
              Para el trabajo, sí: sale del primer principio sin más. Pero la
              **presión final** y el volumen específico final necesitan saber
              por dónde ha ido el proceso, y sin ellos no hay variación de
              exergía.

      - tipo: calcular
        titulo: La presión final
        pregunta: |
          Con $c_v = 0{,}718$ y $c_p = 1{,}005\ \text{kJ/kg}\cdot\text{K}$,
          ¿a qué presión termina el aire?
        respuesta:
          tipo: magnitud
          valor: '1.793 bar'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '2.23 bar'
            mensaje: |
              Has usado el exponente con el signo cambiado. Cuidado: aquí
              $n = 0{,}46$ es **menor que 1**, así que $n/(n-1)$ es negativo y
              la presión **baja** mientras la temperatura sube.
          - valor: '2 bar'
            mensaje: |
              Eso sería suponer el proceso isóbaro. Si lo fuera, el calor por
              grado tendría que ser $c_p = 1{,}005$, y aquí son 1,25.
        pista: |
          $n = \dfrac{c_n - c_p}{c_n - c_v}$, y luego
          $P_2 = P_1\left(\dfrac{T_2}{T_1}\right)^{n/(n-1)}$.
        desarrollo: |
          $$
          n = \frac{1{,}25 - 1{,}005}{1{,}25 - 0{,}718} = 0{,}46
          $$

          $$
          P_2 = 2\left(\frac{333}{293}\right)^{\frac{0{,}46}{0{,}46-1}} = 1{,}793\ \text{bar}
          $$

      - tipo: calcular
        titulo: El trabajo intercambiado
        pregunta: |
          ¿Cuánto trabajo hace el aire por cada kilogramo?
        respuesta:
          tipo: magnitud
          valor: '21.28 kJ/kg'
          tolerancia: 0.02
          formato: un trabajo por unidad de masa, con su unidad
        distractores:
          - valor: '50 kJ/kg'
            mensaje: |
              Ese es el calor que entra. Solo una parte se convierte en
              trabajo; el resto —28,72 kJ/kg— se queda dentro subiendo la
              energía interna, que es lo que hace subir la temperatura.
          - valor: '28.72 kJ/kg'
            mensaje: |
              Esa es la variación de energía interna, $c_v\Delta\theta$. El
              trabajo es lo que queda del calor **después** de pagarla.
        pista: |
          Primer principio en un sistema cerrado: $q = \Delta u + w$.
        desarrollo: |
          $$
          w = q - c_v(\theta_2-\theta_1) = 50 - 0{,}718 \cdot 40 = 21{,}28\ \text{kJ/kg}
          $$

      - tipo: calcular
        titulo: La variación de exergía
        pregunta: |
          Con $\Delta s = 0{,}16\ \text{kJ/kg}\cdot\text{K}$,
          $v_1 = 0{,}42$ y $v_2 = 0{,}533\ \text{m}^{3}/\text{kg}$, y la
          referencia a $1\ \text{bar}$ y $15\ ^\circ\text{C}$, ¿cuánto varía la
          exergía del aire?
        respuesta:
          tipo: magnitud
          valor: '-6.09 kJ/kg'
          tolerancia: 0.02
          formato: una exergía por unidad de masa, con su unidad y con su signo
        distractores:
          - valor: '-6.86 kJ/kg'
            mensaje: |
              Has usado $T_0 = 293\ \text{K}$, la del aire al empezar, en vez
              de los $288$ de la referencia. Es un error fácil aquí porque el
              enunciado da dos temperaturas parecidas — y la propia resolución
              oficial lo escribe así en su última línea, aunque su resultado
              esté calculado con 288.
          - valor: '-17.36 kJ/kg'
            mensaje: |
              Te has dejado el término $P_0\,\Delta v$. En un sistema cerrado
              que se expande hay que descontar el trabajo que se gasta en
              apartar la atmósfera: son 11,3 kJ/kg, y no son pocos.
        pista: |
          $\Delta b = \Delta u + P_0\,\Delta v - T_0\,\Delta s$.
        desarrollo: |
          $$
          \Delta b = 0{,}718 \cdot 40 + 100\,(0{,}533-0{,}42) - 288 \cdot 0{,}16
          = -6{,}09\ \text{kJ/kg}
          $$

      - tipo: justificar
        pregunta: Ordena por qué la exergía baja habiendo entrado calor. Una pieza es falsa.
        piezas:
          - texto: 'El calor entra al aire, que está entre 20 y 60 °C, con el ambiente a 15: de los 50 kJ/kg que entran, solo $q - T_0\Delta s = 50 - 46{,}1 = 3{,}9$ son exergía.'
          - texto: 'Y el aire entrega $w - P_0\Delta v = 21{,}28 - 11{,}3 = 10{,}0$ kJ/kg de trabajo útil, más del doble de lo que ha recibido. La diferencia, 6,09, sale de su propia exergía.'
          - texto: 'La exergía baja porque parte de ella se ha destruido en el proceso.'
            trampa: true
            mensaje: |
              No se ha destruido **nada**: el enunciado dice que el proceso es
              reversible, y en un proceso reversible la exergía destruida es
              exactamente cero. Bajar y destruirse son cosas distintas — aquí
              la exergía **se ha ido**, transformada en trabajo útil, y salía
              más de la que entraba.
    resolucion: |
      **El paso que decide el ejercicio, y no lleva ninguna cuenta.** El
      enunciado no dice qué proceso es. Dice dos cosas que juntas lo dicen
      todo: el fluido es aire —gas ideal— y el proceso es **reversible**. Todo
      proceso reversible de un gas ideal es politrópico; lo único que falta es
      cuál, y eso lo da el calor repartido entre los grados que sube:

      $$
      c_n = \frac{q}{\theta_2-\theta_1} = \frac{50}{60-20} = 1{,}25\ \text{kJ/kg}\cdot\text{K}
      $$

      $$
      n = \frac{c_n - c_p}{c_n - c_v} = \frac{1{,}25 - 1{,}005}{1{,}25 - 0{,}718} = 0{,}46
      $$

      **Un exponente menor que uno**, que es lo que hace que la presión baje
      mientras la temperatura sube:

      $$
      P_2 = 2\left(\frac{333}{293}\right)^{\frac{0{,}46}{0{,}46-1}} = 1{,}793\ \text{bar}
      $$

      **El trabajo** sale del primer principio y no necesita saber nada de lo
      anterior:

      $$
      w = q - c_v(\theta_2-\theta_1) = 50 - 0{,}718\cdot 40 = 21{,}28\ \text{kJ/kg}
      $$

      **La entropía**, con la presión ya conocida:

      $$
      \Delta s = 1{,}005\ln\frac{333}{293} - 0{,}287\ln\frac{1{,}793}{2}
      = 0{,}16\ \text{kJ/kg}\cdot\text{K}
      $$

      **Y la exergía**, que es donde este ejercicio se pone interesante. Con
      $v_1 = 0{,}42$ y $v_2 = 0{,}533\ \text{m}^{3}/\text{kg}$:

      $$
      \Delta b = 0{,}718\cdot 40 + 100\,(0{,}533-0{,}42) - 288\cdot 0{,}16
      = -6{,}09\ \text{kJ/kg}
      $$

      **Le has metido 50 kJ/kg de calor y ha perdido 6 de exergía.** No hay
      ningún error, y entenderlo vale más que los cuatro números anteriores
      juntos. Míralo por las dos aduanas:

      - **Lo que entra con el calor.** El aire está entre 20 y 60 °C y el
        ambiente a 15. Un calor tan próximo a la temperatura ambiente casi no
        lleva calidad: $q - T_0\Delta s = 50 - 46{,}1 = 3{,}9\ \text{kJ/kg}$.
        De cincuenta kilojulios, **cuatro** sirven para algo.
      - **Lo que sale con el trabajo.** El aire hace 21,28 kJ/kg, pero de esos
        hay que descontar los 11,3 que se gastan en apartar la atmósfera para
        poder expandirse. Trabajo aprovechable: **10,0 kJ/kg**.

      Sale el doble de lo que entra, y la diferencia —6,09— la pone el aire de
      su bolsillo. Que el proceso sea reversible no significa que la exergía no
      pueda bajar: significa que no se **destruye** ninguna. Baja porque se
      marcha, convertida en trabajo útil.

      **La lección que se lleva uno de aquí:** el calor a baja temperatura es
      energía barata. Cincuenta kilojulios a sesenta grados valen lo mismo que
      cuatro kilojulios de electricidad, y por eso calentar una casa con una
      resistencia es tirar calidad a la basura mientras que hacerlo con una
      bomba de calor no lo es.

      > **Una errata de la resolución oficial, dicha para que no te vuelvas
      > loco.** Su última línea escribe $-(20+273)\cdot 0{,}16$, es decir
      > $T_0 = 293\ \text{K}$, cuando el enunciado fija la referencia en 15 °C.
      > El resultado del recuadro, $-6{,}088$, está calculado con 288 y es el
      > bueno; lo que está mal escrito es el 20. Si rehaces la cuenta con lo que
      > está impreso te sale −6,86 y vas a creer que te has equivocado tú.
