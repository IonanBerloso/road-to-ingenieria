asignatura: ingenieria-termica
convocatoria: ordinaria
curso: '2021-2022'
fecha: 11 de enero de 2022
# Bilingüe, con el castellano en la primera página y el euskera en la segunda,
# y con «Duración: 150 minutos» impreso.
#
# **Es el segundo examen encadenado del corpus**, con el ejercicio 2 colgando
# del 1. Pero lo hace mejor que el de enero de 2021, y la diferencia merece
# leerse porque es una decisión de quien escribe el examen: aquí el enunciado
# del 2 trae una **nota de rescate** —«si no se ha resuelto el ejercicio 1,
# tómense los siguientes datos aproximados»— con la temperatura del agua ya
# dada. Un fallo en el primero ya no arrastra el segundo. El de 2021 no lo
# hacía, y ahí un error temprano se llevaba dos tercios del examen.
#
# Su ejercicio 3 es el que entra, y es de los que cambian cómo se mira la
# asignatura: se le suministran 50 kJ/kg de calor al aire y **su exergía baja**
# en 6. Sin ninguna irreversibilidad, porque el proceso es reversible.
pdf: 2021-2022-ord.pdf

fuera:
  - n: 1
    motivo: >-
      Dos conductos concéntricos de 10 m. El interior lleva 0,5 kg/s de aire
      que entra a 90 °C y sale a 70, con 6 cm de diámetro interior, 8 de
      exterior y una conductividad de 45 W/(m·K); el exterior, de sección
      anular y 20 cm de diámetro, lleva 2 kg/s de agua. Pide las dos
      temperaturas superficiales del conducto de aire y **la temperatura
      promedio del agua**. **Sin transcribir todavía**: no falta material —el
      PDF trae su resolución oficial— sino el trabajo de escribirlo. Cuando se
      escriba, conviene que sea con el 2 detrás: los dos son el mismo aparato.
  - n: 2
    motivo: >-
      La exergía destruida y el rendimiento exergético de ese mismo conducto,
      con la referencia a 20 °C y 1 bar, el aire a 2 bar, y el dato de que
      **un tercio del calor que suelta el aire se escapa al exterior** en vez
      de calentar el agua. **Sin transcribir todavía**, por lo mismo. Trae dos
      cosas que valen aparte: el rendimiento sale del **44 %** —bajo, y el
      motivo es justo ese tercio que se pierde—, y la resolución oficial deja
      dicho de dónde sale la definición que usa, que es lo que otros exámenes
      dan por supuesto.

ejercicios:
  # Ejercicio 3 · el cilindro-pistón reversible al que entra calor y le baja la
  # exergía. Es el único del corpus donde el exponente politrópico hay que
  # deducirlo del calor en vez de leerlo del enunciado.
  - id: exter2122-ord-3-cincuenta-kilojulios-de-calor-que-quitan-exergia
    tema: t07-analisis-exergetico
    n: 3
