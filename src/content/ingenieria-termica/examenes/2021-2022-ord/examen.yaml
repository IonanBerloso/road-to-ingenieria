# Bilingüe, con el castellano en la primera página y el euskera en la segunda,
# y con «Duración: 150 minutos» impreso.
#
# **Es el segundo examen encadenado del corpus**, con el ejercicio 2 colgando
# del 1. Pero lo hace mejor que el de enero de 2021, y la diferencia merece
# leerse porque es una decisión de quien escribe el examen: aquí el enunciado
# del 2 trae una **nota de rescate** —«si no se ha resuelto el ejercicio 1,
# tómense los siguientes datos aproximados»— con la temperatura del agua ya
# dada. Un fallo en el primero ya no arrastra el segundo. El de 2021 no lo
# hacía, y ahí un error temprano se llevaba dos tercios del examen.
#
# Su ejercicio 3 es de los que cambian cómo se mira la asignatura: se le
# suministran 50 kJ/kg de calor al aire y **su exergía baja** en 6. Sin
# ninguna irreversibilidad, porque el proceso es reversible.
#
# Los dos primeros se escribieron juntos, porque son el mismo aparato, y dejan
# una observación que vale para todo el bloque de exergía: el tercio del calor
# que se escapa sale a la temperatura del agua, así que **no cambia la entropía
# generada**. Cambia adónde va la exergía que no se destruye, y con ello el
# rendimiento, que baja al 43,9 %; aislado sería el 65,9 %.
pdf: 2021-2022-ord.pdf

ejercicios:
