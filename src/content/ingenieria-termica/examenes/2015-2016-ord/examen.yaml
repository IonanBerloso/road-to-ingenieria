asignatura: ingenieria-termica
convocatoria: ordinaria
curso: '2015-2016'
fecha: enero de 2016
# Bilingüe, con el castellano en la primera página y el euskera en la segunda.
# Da **3 horas** y cada ejercicio vale 10 puntos — es la única convocatoria del
# corpus que imprime la puntuación de cada uno en vez de decir «un tercio».
#
# **Es la convocatoria más antigua transcribible, y la que más se aleja del
# temario de hoy.** Dos de sus tres ejercicios examinan cosas que la asignatura
# ya no cubre: un **ciclo de turbina de gas con regeneración** y un
# **condensador con R-134a**, es decir ciclos de potencia y ciclos de
# refrigeración. Ninguna de las diecisiete convocatorias posteriores vuelve a
# pedirlos. Conviene tenerlo escrito porque cambia cómo hay que leer estos
# exámenes viejos: **no valen como simulacro completo**, y sus ejercicios de
# transmisión de calor sí.
#
# El tercero, el que entra, es de los que se recuerdan: una plancha de pie
# sobre la tabla, con los tres mecanismos en el mismo problema y dos
# resultados que sorprenden — la radiación gana a la convección, y la placa
# está siete décimas de grado más caliente por dentro.
pdf: 2015-2016-ord.pdf

fuera:
  - n: 1
    motivo: >-
      El condensador de un sistema de refrigeración con R-134a que entra a
      10 bar y 70 °C y sale como líquido saturado, refrigerado por 800 m³/h de
      aire que pasa de 20 a 30 °C. Pide la exergía destruida, el rendimiento
      exergético y —el apartado bueno— **el título del refrigerante a la salida
      si la suciedad reduce el calor intercambiado un 20 %**. **No se transcribe,
      y el motivo es de temario, no de trabajo**: los ciclos de refrigeración y
      las tablas del R-134a no están en el programa actual de la asignatura, y
      ninguna convocatoria posterior a 2016 los pide. Transcribirlo sería
      añadir a la ruta material que ya no se examina.
  - n: 2
    motivo: >-
      Un motor de turbina de gas **con regeneración** que da 235 kW netos con un
      rendimiento del 38 % y relación de presiones 8, del que se pide el
      rendimiento interno de la turbina conocidos el del compresor (85 %) y la
      eficiencia del regenerador (76 %). **No se transcribe, por lo mismo**: los
      ciclos de potencia salieron del temario y no vuelven a aparecer. Es una
      pena, porque es un ejercicio bien construido —hay que recorrer el ciclo
      entero al revés para despejar un solo dato—, y queda anotado por si el
      programa vuelve a incluirlos.

ejercicios:
  # Ejercicio 3 · la plancha. Conducción, convección natural y radiación en el
  # mismo problema, y la radiación gana.
  - id: exter1516-ord-3-la-plancha-de-pie-sobre-la-tabla
    tema: t10-radiacion
    n: 3
