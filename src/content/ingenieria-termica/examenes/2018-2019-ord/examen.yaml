asignatura: ingenieria-termica
convocatoria: ordinaria
curso: '2018-2019'
fecha: enero de 2019
# **Solo en castellano, y esta vez comprobado como toca**: la página 2 ya es la
# resolución del profesor, así que no hay versión en euskera detrás. La forma
# de comprobarlo importa porque el 10 de septiembre de 2026 se falló cinco
# veces seguidas dando por hecho el idioma de una convocatoria mirando su
# primera página; aquí lo que descarta el euskera es haber visto **qué hay en
# la segunda**. Da 2,5 horas y cada ejercicio vale un tercio.
#
# Su ejercicio 1 trae **una fotografía** —un radiador de módulos— en vez de un
# esquema dibujado, que es el único caso así del corpus.
#
# Y su ejercicio 2 es el que entra, por lo que enseña fuera del examen: un
# termo eléctrico doméstico donde se puede seguir la electricidad desde el
# enchufe hasta el agua y ver cuánta capacidad de producir trabajo queda en
# cada escalón. Queda el **7 %**, y ese número es el argumento entero de por
# qué existen las bombas de calor.
pdf: 2018-2019-ord.pdf

fuera:
  - n: 1
    motivo: >-
      Un radiador de agua caliente formado por módulos de 1 m de altura y
      0,8 m² de superficie cada uno, con la superficie exterior a 60 °C y el
      aire de la habitación a 20: pide **cuántos módulos hacen falta** para dar
      2 kW. **Sin transcribir todavía**: no falta material —el PDF trae su
      resolución oficial— sino el trabajo de escribirlo. Merece hacerse por dos
      cosas. Es convección natural sobre **placa vertical**, el caso más
      frecuente del temario y sin ejercicio propio en el corpus; y su respuesta
      no es una potencia ni una temperatura sino **un número entero de piezas**,
      que obliga a redondear hacia arriba y a decir por qué.
  - n: 3
    motivo: >-
      Un sistema abierto con 4 kg/s de aire que entra a 18 °C y sale a 34 tras
      un proceso de exponente politrópico $-2{,}6$. Su apartado a) pide deducir
      **gráficamente y sin cálculos** el signo del calor, del trabajo y de la
      variación de entropía, y el b) los mismos tres con números. **Sin
      transcribir todavía**, y aquí conviene decir por qué no corre prisa: es
      **el tercero de la misma familia** —los otros dos son enero de 2023 y
      febrero de 2020, los dos ya transcritos—, y de los tres es el único en
      sistema **abierto**. Eso es lo que aporta y es lo que habrá que destacar
      cuando se escriba, no los signos otra vez.

ejercicios:
  # Ejercicio 2 · el termo eléctrico. El agua arranca en el estado muerto, así
  # que toda su exergía final se ha ganado dentro del ejercicio.
  - id: exter1819-ord-2-el-termo-electrico-y-el-siete-por-ciento
    tema: t07-analisis-exergetico
    n: 2
