asignatura: ingenieria-termica
convocatoria: ordinaria
curso: '2018-2019'
fecha: enero de 2019
# **Solo en castellano, y esta vez comprobado como toca**: la página 2 ya es la
# resolución del profesor, así que no hay versión en euskera detrás. La forma
# de comprobarlo importa porque el 10 de septiembre de 2026 se falló cinco
# veces seguidas dando por hecho el idioma de una convocatoria mirando su
# primera página; aquí lo que descarta el euskera es haber visto **qué hay en
# la segunda**. Da 2,5 horas y cada ejercicio vale un tercio.
#
# Su ejercicio 1 trae **una fotografía** —un radiador de módulos— en vez de un
# esquema dibujado, que es el único caso así del corpus.
#
# Y su ejercicio 2 es el que entra, por lo que enseña fuera del examen: un
# termo eléctrico doméstico donde se puede seguir la electricidad desde el
# enchufe hasta el agua y ver cuánta capacidad de producir trabajo queda en
# cada escalón. Queda el **7 %**, y ese número es el argumento entero de por
# qué existen las bombas de calor.
pdf: 2018-2019-ord.pdf

ejercicios:
  # Ejercicio 1 · el radiador de módulos. Convección natural sobre placa
  # vertical, y el único del corpus cuya respuesta es un número de piezas.
  # Escrito el 12 de septiembre de 2026.
  - id: exter1819-ord-1-diecisiete-modulos-y-no-dieciseis
    tema: t09-conveccion
    n: 1

  # Ejercicio 2 · el termo eléctrico. El agua arranca en el estado muerto, así
  # que toda su exergía final se ha ganado dentro del ejercicio.
  - id: exter1819-ord-2-el-termo-electrico-y-el-siete-por-ciento
    tema: t07-analisis-exergetico
    n: 2

  # Ejercicio 3 · el tercero de la familia de los signos y el único en sistema
  # abierto, que es donde el trabajo técnico y el de frontera se separan.
  - id: exter1819-ord-3-el-mismo-proceso-con-dos-trabajos-de-signo-contrario
    tema: t04-volumen-de-control
    n: 3
