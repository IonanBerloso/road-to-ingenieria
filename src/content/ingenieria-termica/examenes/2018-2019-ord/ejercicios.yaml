ejercicios:
  - id: exter1819-ord-2-el-termo-electrico-y-el-siete-por-ciento
    titulo: El termo eléctrico, y el siete por ciento que llega al agua
    fuente: Ejercicio 2 de la convocatoria ordinaria de 2018-2019, celebrada en enero de 2019 · Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El PDF trae la resolución manuscrita del profesor; el desarrollo se hizo a ciegas desde el enunciado y se contrastó después contra ella.
    nivel: examen
    enunciado: |
      En un calentador eléctrico de $50$ litros se desea calentar agua desde
      $15\ ^\circ\text{C}$ hasta $60\ ^\circ\text{C}$ en $2$ horas. Calcúlese:

      a) La potencia mínima del calentador.

      b) La exergía destruida durante el proceso de calentamiento del agua
      desde la resistencia. Despréciese la capacidad térmica de la resistencia.
      Supóngase la temperatura de la resistencia constante e igual a
      $89\ ^\circ\text{C}$ y la temperatura del estado de referencia
      $15\ ^\circ\text{C}$.
    pide: La potencia mínima y la exergía destruida al calentar el agua.
    pasos:
      - tipo: reconocer
        pregunta: |
          El calentador tiene $50$ litros. ¿Cuánta masa de agua hay?
        opciones:
          - texto: Algo menos de 50 kg — hay que entrar en la tabla con la densidad del líquido saturado
            correcta: true
            mensaje: |
              Eso es. El agua líquida no pesa exactamente un kilo por litro
              salvo a 4 °C; a la temperatura media del proceso, 37,5 °C, su
              densidad es $993{,}15\ \text{kg/m}^{3}$, así que hay
              **49,66 kg**. Es una corrección de menos del 1 %, y el profesor
              la hace: conviene saber que existe.
          - texto: 50 kg exactos, porque un litro de agua es un kilo
            mensaje: |
              Es la aproximación de siempre y aquí se queda a un 0,7 %. Pero un
              litro de agua es un kilo **solo cerca de 4 °C**; a 37,5 °C son
              993 gramos. La resolución oficial hace la corrección, así que
              conviene saber por qué.
          - texto: Depende de la presión, y el enunciado no la da
            mensaje: |
              El agua líquida es prácticamente incompresible: su densidad
              apenas cambia con la presión, y por eso no hace falta el dato.
              Con la temperatura sí cambia, y eso es lo que hay que mirar.
          - texto: 'No hace falta la masa: la potencia sale del volumen directamente'
            mensaje: |
              El calor específico va **por kilogramo**, no por litro, así que
              la masa hace falta sí o sí. Los 50 litros son el camino para
              llegar a ella, no un sustituto.

      - tipo: calcular
        titulo: La potencia mínima
        pregunta: |
          Con $49{,}66\ \text{kg}$ y $c = 4{,}186\ \text{kJ/kg}\cdot\text{K}$,
          ¿qué potencia hace falta como mínimo?
        respuesta:
          tipo: magnitud
          valor: '1.3 kW'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '2.6 kW'
            mensaje: |
              Has dividido entre una hora en vez de entre dos. El enunciado da
              dos, y por eso la potencia es la mitad.
          - valor: '77.95 kW'
            mensaje: |
              Has dividido entre 120 en vez de entre 7.200: has puesto los
              minutos donde iban los segundos. Un kilovatio es un kilojulio
              **por segundo**.
        pista: |
          $Q = m\,c\,\Delta\theta$, y después $P = Q/t$ con $t$ en segundos.
        desarrollo: |
          $$
          Q = 49{,}66 \cdot 4{,}186 \cdot 45 = 9353{,}96\ \text{kJ}
          $$

          $$
          P = \frac{9353{,}96}{7200} = 1{,}3\ \text{kW}
          $$

          Se llama **mínima** porque supone que todo el calor llega al agua y
          nada se escapa por las paredes del termo.

      - tipo: calcular
        titulo: La exergía que gana el agua
        pregunta: |
          El agua parte de $15\ ^\circ\text{C}$, que es justo la temperatura de
          referencia, y su entropía sube $30{,}18\ \text{kJ/K}$. ¿Cuánta
          exergía gana?
        respuesta:
          tipo: magnitud
          valor: '662.59 kJ'
          tolerancia: 0.02
          formato: una exergía, con su unidad
        distractores:
          - valor: '9353.96 kJ'
            mensaje: |
              Esa es la **energía** que ha recibido. La exergía es la parte de
              ella que se podría reconvertir en trabajo, y son catorce veces
              menos: el agua acaba a 60 °C, no a 600.
          - valor: '8691.84 kJ'
            mensaje: |
              Ese es el término $T_0\,\Delta S$ solo. Va **restando** dentro de
              la expresión, no es el resultado.
        pista: |
          $\Delta B = \Delta U - T_0\,\Delta S$; el volumen no cambia, así que
          el término de $P_0$ desaparece.
        desarrollo: |
          $$
          \Delta B = 9353{,}96 - 288 \cdot 30{,}18 = 662{,}59\ \text{kJ}
          $$

      - tipo: calcular
        titulo: La exergía destruida
        pregunta: |
          El calor entra desde una resistencia a $89\ ^\circ\text{C}$. ¿Cuánta
          exergía se destruye al calentar el agua?
        respuesta:
          tipo: magnitud
          valor: '1249.55 kJ'
          tolerancia: 0.02
          formato: una exergía, con su unidad
        distractores:
          - valor: '1912.14 kJ'
            mensaje: |
              Esa es la exergía que **entra** con el calor desde la
              resistencia. Lo que se destruye es lo que entra menos lo que se
              queda en el agua.
          - valor: '662.59 kJ'
            mensaje: |
              Esa es la que **se queda** en el agua, o sea justo lo contrario
              de lo que se pierde. Las dos suman los 1.912 que entran.
        pista: |
          Entra $\left(1-\dfrac{T_0}{T_R}\right)Q$ y se queda $\Delta B$; lo
          que falta, se ha destruido.
        desarrollo: |
          $$
          \left(1-\frac{288}{362}\right)\cdot 9353{,}96 = 1912{,}14\ \text{kJ}
          $$

          $$
          Ex_D = 1912{,}14 - 662{,}59 = 1249{,}55\ \text{kJ}
          $$

      - tipo: justificar
        pregunta: Ordena qué ha pasado con la electricidad. Una pieza es falsa.
        piezas:
          - texto: 'La electricidad es exergía pura: los 9.354 kJ que paga el contador valen 9.354 kJ de trabajo.'
          - texto: 'Pero al degradarse a calor a 89 °C ya solo quedan 1.912, y de esos el agua se queda con 663.'
          - texto: 'El resto se ha perdido por las paredes del termo, y aislarlo mejor lo recuperaría.'
            trampa: true
            mensaje: |
              El enunciado pide la potencia **mínima**, es decir suponiendo que
              **no se pierde nada** por las paredes. Lo que desaparece no se
              escapa a ninguna parte: se destruye, primero al convertir
              electricidad en calor a 89 °C y después al pasar ese calor al
              agua. Aislar el termo está muy bien y no arregla nada de esto.
    resolucion: |
      **Primero, cuánta agua hay.** Cincuenta litros no son cincuenta kilos: a
      la temperatura media del proceso, 37,5 °C, la densidad del agua líquida
      es $993{,}15\ \text{kg/m}^{3}$, y salen **49,66 kg**. Es menos del 1 % y
      no cambia ninguna conclusión, pero conviene saber que un litro es un kilo
      solo cerca de 4 °C.

      **a) La potencia mínima.**

      $$
      Q = 49{,}66 \cdot 4{,}186 \cdot (60-15) = 9353{,}96\ \text{kJ}
      $$

      $$
      P = \frac{9353{,}96}{7200} = 1{,}3\ \text{kW}
      $$

      «Mínima» porque supone que todo el calor llega al agua. Un termo real
      pierde por las paredes y necesita algo más.

      **b) Y ahora la parte que enseña algo.** El agua arranca a
      $15\ ^\circ\text{C}$, que es exactamente la temperatura de referencia:
      **empieza en el estado muerto**, con exergía cero. Todo lo que tenga al
      final lo ha ganado aquí.

      $$
      \Delta B = \Delta U - T_0\,\Delta S = 9353{,}96 - 288\cdot 30{,}18
      = 662{,}59\ \text{kJ}
      $$

      Y lo que entra con el calor, que llega desde una resistencia a
      $89\ ^\circ\text{C}$:

      $$
      \left(1-\frac{T_0}{T_R}\right)Q = \left(1-\frac{288}{362}\right)\cdot 9353{,}96
      = 1912{,}14\ \text{kJ}
      $$

      $$
      Ex_D = 1912{,}14 - 662{,}59 = 1249{,}55\ \text{kJ}
      $$

      **La cadena completa, que el examen no pide y es lo que hay que
      llevarse.** Sigue los 9.354 kJ desde el enchufe:

      | dónde | exergía | qué queda |
      |---|---|---|
      | electricidad que paga el contador | 9.354 kJ | 100 % |
      | ya convertida en calor a 89 °C | 1.912 kJ | 20 % |
      | dentro del agua a 60 °C | 663 kJ | **7 %** |

      El primer salto —de electricidad a calor— destruye **7.442 kJ** sin que
      se pierda ni un julio de energía: una resistencia tiene un rendimiento
      energético del 100 % y un rendimiento exergético del 20 %. El segundo, el
      que este ejercicio pide, destruye otros 1.250 al pasar ese calor de los
      89 °C de la resistencia a un agua que empieza a 15.

      Y aquí está el argumento, con números: **una bomba de calor no es un
      lujo, es la forma de no tirar el 80 % de lo que pagas.** No inventa
      energía —el primer principio no lo permitiría—; lo que hace es no
      degradar la electricidad a calor de baja temperatura, que es donde se ha
      ido todo en esta tabla.
