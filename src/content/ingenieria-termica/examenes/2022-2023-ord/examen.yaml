asignatura: ingenieria-termica
curso: '2022-2023'
convocatoria: ordinaria
fecha: 10 de enero de 2023
# Es **bilingüe**: el enunciado entero en castellano y después el mismo en
# euskera. De las diecisiete convocatorias comparables, unas salen así, otras
# solo en castellano —enero de 2018— y otras solo en euskera —enero de 2025—,
# y no hay forma de saber cuál te va a tocar.
#
# Imprime dos datos que conviene tener antes de sentarse y que esta
# convocatoria confirma: **«Tiempo: 2.5 horas»** y «cada ejercicio vale un
# tercio del valor del examen total». Y el aviso de la Escuela, que va en
# negrita: las hojas sin nombre y apellidos, DNI, número de grupo y titulación
# **no se corrigen**.
#
# Su ejercicio 1 es una rareza que merece la pena buscar: pide **seis signos y
# ningún número**. Positivo, negativo o nulo para el calor específico
# politrópico, el calor, la variación de entropía, la generada en el sistema,
# la generada en el universo y —de propina— si las paredes del recipiente son
# rígidas o móviles. Se puede resolver gráficamente o por cálculo, y el propio
# enunciado dice que con una vía basta.
pdf: 2022-2023-ord.pdf

fuera:
  - n: 3
    motivo: >-
      Una tubería de cobre sin aislamiento —10 cm de diámetro interior, 3 mm de
      espesor, k = 385 W/(m·K)— que transporta 0,12 kg/s de agua a 80 °C por el
      exterior, y pide las pérdidas por unidad de longitud con la superficie
      exterior a 76 °C y, a partir de ahí, **la velocidad del viento**. Es el
      mismo giro que el de la emisividad de enero de 2018: el examen usa el
      balance térmico al revés, para deducir una condición del entorno en vez
      de un flujo de calor. **Sin transcribir todavía**; no falta material,
      falta escribirlo.

ejercicios:
  - id: exter2223-ord-1-seis-signos-y-ningun-numero
    tema: t03-sustancias-puras
    n: 1
  - id: exter2223-ord-2-la-turbina-que-es-mala-y-hay-que-decirlo
    tema: t06-entropia
    n: 2
