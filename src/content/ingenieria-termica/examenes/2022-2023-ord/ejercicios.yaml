ejercicios:
  - id: exter2223-ord-1-seis-signos-y-ningun-numero
    titulo: Seis signos, y ningún número que dar
    fuente: >-
      Ejercicio 1 de la convocatoria ordinaria de enero de 2022-2023 ·
      Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      enunciado permite resolverlo gráfica o analíticamente; aquí se hace por
      cálculo y, como su NOTA 1 pide a quien calcula, con el proceso
      representado en los diagramas. El desarrollo es nuestro.
    nivel: examen
    enunciado: |
      Se tiene 1 litro de aire a $20\ \text{°C}$ y $2\ \text{atm}$ en un
      recipiente que es sometido a un proceso de exponente politrópico igual
      a 3.5, tras el cual, el aire pasa a un nuevo estado de equilibrio en el
      que la presión es $1\ \text{atm}$. Dedúzcase, ya sea gráficamente o
      analíticamente:

      a) El signo del calor específico politrópico (positivo, negativo o
      nulo)

      b) El signo del intercambio de calor (positivo, negativo o nulo)

      c) El signo de la variación de entropía (positivo, negativo o nulo)

      d) El signo de la entropía generada en el sistema (positivo, negativo o
      nulo)

      e) El signo de la entropía generada en el universo (positivo, negativo
      o nulo)

      f) Si las paredes del recipiente son rígidas o móviles.

      NOTA 1: si se resuelve gráficamente, no es necesario que se resuelva
      también por cálculo. Si se decide resolver por cálculo, deberá también
      representarse el proceso en los diagramas de proceso más apropiados.

      NOTA 2: Considérese la diferencia de temperatura entre el sistema y el
      medio circundante, infinitesimalmente pequeña durante todo el proceso.

      *El enunciado no da los datos del aire; los que usa el sitio en todo el
      tema son $c_v = 0{,}7175\ \text{kJ/(kg·K)}$ y $\gamma = 1{,}4$.*
    pide: Los cinco signos y si las paredes se mueven. No hay que dar ningún valor.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de calcular nada: ¿qué decide el signo del calor específico
          politrópico?
        opciones:
          - texto: >-
              Dónde cae $n$ respecto de 1 y de $\gamma$, porque
              $c_n = c_v\,(n-\gamma)/(n-1)$ y lo que cambia de signo son los
              dos paréntesis
            correcta: true
            mensaje: |
              Exacto. Con $n = 3{,}5$ los dos paréntesis son positivos, así que
              $c_n$ también. La zona interesante es la de en medio: entre 1 y
              $\gamma$ el numerador es negativo y el denominador positivo, y
              ahí $c_n$ sale **negativo**, que es la rareza que este ejercicio
              existe para descartar.
          - texto: >-
              El signo del calor intercambiado
            mensaje: |
              Es al revés: $c_n$ es lo que, junto con el salto de temperatura,
              **determina** el signo del calor. Y el calor específico es una
              propiedad del proceso, no del resultado.
          - texto: >-
              Si el gas se expande o se comprime
            mensaje: |
              Eso decide el signo del trabajo, no el de $c_n$. Un mismo
              exponente politrópico da el mismo calor específico tanto si el
              proceso se recorre en un sentido como en el otro.

      - tipo: calcular
        titulo: El calor específico del proceso
        pregunta: |
          ¿Cuánto vale $c_n$?
        respuesta:
          tipo: magnitud
          valor: '0.6027 kJ/(kg K)'
          tolerancia: 0.02
          formato: un calor específico, con su unidad
        distractores:
          - valor: '-0.6027 kJ/(kg K)'
            mensaje: |
              El signo. Con $n = 3{,}5$, tanto $n-\gamma = 2{,}1$ como
              $n-1 = 2{,}5$ son positivos, así que el cociente lo es. El caso
              negativo existe, pero es el de $1 < n < \gamma$.
          - valor: '0.7175 kJ/(kg K)'
            mensaje: |
              Ese es $c_v$. El calor específico politrópico es propio del
              proceso y solo coincide con $c_v$ cuando $n \to \pm\infty$, es
              decir en el isócoro.
        pista: |
          $c_n = c_v\dfrac{n-\gamma}{n-1}$, con $n = 3{,}5$ y
          $\gamma = 1{,}4$.
        desarrollo: |
          $$
          c_n = c_v\,\frac{n-\gamma}{n-1}
          = 0{,}7175\cdot\frac{3{,}5-1{,}4}{3{,}5-1}
          = 0{,}7175\cdot 0{,}84 = 0{,}6027\ \frac{\text{kJ}}{\text{kg}\cdot\text{K}}
          $$

          **Positivo**, y con eso queda contestado el apartado a).

      - tipo: calcular
        titulo: La temperatura final
        pregunta: |
          Con la relación entre temperaturas y presiones de un politrópico,
          ¿a qué temperatura acaba el aire?
        respuesta:
          tipo: magnitud
          valor: '178.7 K'
          tolerancia: 0.02
          formato: una temperatura, con su unidad
        distractores:
          - valor: '146.6 K'
            mensaje: |
              Has supuesto que la temperatura cae en la misma proporción que
              la presión, a la mitad. No es proporcional: el exponente
              $(n-1)/n$ vale 0,714, así que la caída es menos brusca que la de
              la presión.
          - valor: '481.0 K'
            mensaje: |
              Has invertido el cociente de presiones. La presión **baja** de 2
              a 1 atm, así que el cociente $P_2/P_1$ vale 0,5 y la temperatura
              tiene que bajar con ella.
        pista: |
          $\dfrac{T_2}{T_1} = \left(\dfrac{P_2}{P_1}\right)^{\frac{n-1}{n}}$,
          con $T_1 = 293{,}15\ \text{K}$.
        desarrollo: |
          $$
          \frac{T_2}{T_1} = \left(\frac{1}{2}\right)^{\frac{2{,}5}{3{,}5}}
          = 0{,}5^{0{,}7143} = 0{,}6095
          $$

          $$
          T_2 = 293{,}15\cdot 0{,}6095 = 178{,}7\ \text{K} = -94{,}5\ \text{°C}
          $$

          Noventa y cuatro grados bajo cero. Es un enfriamiento brutal, y no es
          un error: con $n = 3{,}5$ el proceso es mucho más empinado que el
          adiabático, así que el gas no solo se enfría al expandirse, sino que
          además cede calor mientras lo hace.

      - tipo: calcular
        titulo: Cuánto cambia el volumen
        pregunta: |
          ¿En qué proporción cambia el volumen específico?
        respuesta:
          tipo: numero
          valor: '1.219'
          tolerancia: 0.005
          formato: un número, el cociente del volumen final entre el inicial
        distractores:
          - valor: '2'
            mensaje: |
              Ese es el cociente de presiones invertido, que sería la relación
              de volúmenes si el proceso fuese isotermo, con $n = 1$. Con
              $n = 3{,}5$ el volumen crece mucho menos, porque el gas se está
              enfriando a la vez.
          - valor: '0.8203'
            mensaje: |
              Has invertido el cociente. El gas se **expande** —la presión
              baja—, así que el volumen tiene que crecer y el cociente
              $v_2/v_1$ ser mayor que uno.
        pista: |
          De $Pv^{n} = \text{cte}$,
          $\dfrac{v_2}{v_1} = \left(\dfrac{P_1}{P_2}\right)^{1/n}$.
        desarrollo: |
          $$
          \frac{v_2}{v_1} = \left(\frac{2}{1}\right)^{1/3{,}5}
          = 2^{0{,}2857} = 1{,}219
          $$

          Un 22 % más de volumen. Y ahí está contestado el apartado f): si el
          volumen crece, **las paredes tienen que ser móviles**.

      - tipo: dibujar
        consigna: |
          La NOTA 1 lo exige a quien resuelve por cálculo: **representa el
          proceso en los diagramas P-v y T-s**, en papel, con los estados 1 y
          2 y, de referencia, la isoterma y la adiabática que pasan por el
          estado 1.
        comprueba:
          - punto: |
              En el P-v, el proceso baja de 2 a 1 atm y va hacia la derecha:
              el volumen crece un 22 %.
            porque: |
              Es el apartado f) visto en el dibujo. Si la curva va hacia la
              derecha el volumen aumenta, y un recipiente rígido no lo
              permitiría.
          - punto: |
              La curva del proceso cae más empinada que la adiabática que sale
              del estado 1, y la adiabática más que la isoterma: $n = 3{,}5$,
              $\gamma = 1{,}4$ y $1$.
            porque: |
              Es lo que decide el calor sin hacer cuentas: una expansión que
              queda por debajo de la adiabática ha tenido que ceder calor. Es
              el apartado b).
          - punto: |
              En el T-s, el estado 2 queda abajo y a la izquierda del 1: la
              temperatura baja hasta 178,7 K y la entropía también baja.
            porque: |
              Son los apartados b) y c) a la vez. Con la entropía bajando, el
              área bajo la curva es un calor que sale del sistema.
          - punto: |
              El proceso va en trazo continuo, no a trazos.
            porque: |
              Con una ley $Pv^{n}$ constante el gas pasa por estados de
              equilibrio, y así se dibuja un proceso internamente reversible.
              Es la mitad gráfica del apartado d).
        veredicto: |
          Si los dos diagramas cuentan lo mismo que las cuentas —expansión,
          enfriamiento, entropía que baja, calor que sale—, los seis
          apartados están contestados dos veces. Es lo que pide la NOTA 1: el
          dibujo no es un adorno, es la otra mitad de la respuesta.

      - tipo: justificar
        pregunta: Ordena la cadena de los cinco signos. Una pieza es falsa.
        piezas:
          - texto: >-
              $c_n = 0{,}6027 > 0$, porque con $n = 3{,}5$ los dos paréntesis
              de $(n-\gamma)/(n-1)$ son positivos.
          - texto: >-
              El gas se enfría de 293 K a 179 K, así que
              $Q = m\,c_n\,\Delta T$ es **negativo**: el sistema cede calor.
          - texto: >-
              Y $\Delta s = c_n\ln(T_2/T_1)$ también es negativo, por el mismo
              logaritmo.
          - texto: >-
              La entropía generada en el sistema es negativa, porque la del
              sistema disminuye.
            trampa: true
            mensaje: |
              La entropía generada **nunca** es negativa: es el término que el
              segundo principio obliga a ser mayor o igual que cero. Aquí vale
              **cero**, no negativo, y por dos motivos que el enunciado da: el
              proceso tiene una ley $Pv^{n}$ constante —luego es internamente
              reversible— y la NOTA 2 dice que la diferencia de temperatura con
              el ambiente es infinitesimal, lo que hace reversible también el
              intercambio de calor. Que la entropía del sistema baje es otra
              cosa, y es lo normal cuando se cede calor.
    resolucion: |
      **a) $c_n$, positivo.**

      $$
      c_n = c_v\,\frac{n-\gamma}{n-1} = 0{,}7175\cdot\frac{2{,}1}{2{,}5}
      = 0{,}6027\ \frac{\text{kJ}}{\text{kg}\cdot\text{K}} > 0
      $$

      **b) El calor, negativo.** La presión baja de 2 a 1 atm, y con
      $n = 3{,}5$ la temperatura cae a

      $$
      T_2 = 293{,}15\cdot 0{,}5^{0{,}7143} = 178{,}7\ \text{K}
      $$

      Con $c_n > 0$ y $\Delta T < 0$, $Q = m\,c_n\,\Delta T$ es **negativo**:
      el sistema cede calor.

      **c) La variación de entropía, negativa.** Del propio proceso
      politrópico, $\Delta s = c_n\ln(T_2/T_1) = 0{,}6027\cdot\ln 0{,}6095
      = -0{,}298\ \text{kJ/(kg·K)}$. Coherente: la entropía baja porque el
      calor sale.

      **d) y e) Las dos entropías generadas, nulas.** El proceso tiene una ley
      $Pv^{n} = \text{cte}$, así que el gas está en equilibrio en cada
      instante: es internamente reversible y $S_{G,sistema} = 0$. Y la NOTA 2
      del enunciado —diferencia de temperatura infinitesimal con el medio— es
      exactamente la tercera condición de reversibilidad del tema 5, así que
      tampoco hay irreversibilidad externa: $S_{G,universo} = 0$.

      **f) Paredes móviles.**

      $$
      \frac{v_2}{v_1} = 2^{1/3{,}5} = 1{,}219
      $$

      El volumen crece un 22 %, y un recipiente rígido no lo permitiría.

      **Por qué este ejercicio merece la pena aunque no pida números.** Los
      seis apartados salen de dos fórmulas y la NOTA 2 del enunciado, y ninguna
      de las tres es difícil. Lo difícil es no confundir «la entropía del
      sistema baja» con «la entropía generada es negativa», que son cosas
      distintas y suenan igual. Si separas esas dos ideas, el ejercicio se
      contesta en un folio y sin calculadora; si no, no hay manera.
  - id: exter2223-ord-2-la-turbina-que-es-mala-y-hay-que-decirlo
    titulo: La turbina que es mala, y hay que decir por qué
    fuente: >-
      Ejercicio 2 de la convocatoria ordinaria de enero de 2022-2023 ·
      Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen publica su resolución oficial manuscrita. Aquí se resuelve con la
      rejilla del anexo de tablas del curso, la de las tablas del sitio, que
      tiene la fila de 0,1 bar. La resolución oficial interpola la entropía de
      salida en presión, entre 0,06 y 0,35 bar, y por eso su exergía destruida
      (238,5 kW) y su rendimiento exergético (45,6 %) no son los de aquí
      (220,1 kW y 47,6 %): el paso de la exergía explica por qué.
    nivel: examen
    enunciado: |
      En una turbina de vapor se desarrollan $200\ \text{kW}$ de potencia. El
      vapor sale de la turbina a $0{,}1\ \text{bar}$ y $80\ \text{°C}$. El
      gasto de vapor es de $0{,}5\ \text{kg/s}$ y entra a la turbina a
      $20\ \text{bar}$. Calcúlese:

      a) ¿A qué temperatura entra el vapor en la turbina?

      b) ¿Cuál es el rendimiento interno de la turbina? Razónese si desde el
      punto de vista de las irreversibilidades la turbina es buena o mala.

      c) ¿Cuánta exergía se destruye en la turbina?

      d) ¿Cuál es el rendimiento exergético de la turbina?

      Tómese como temperatura de referencia para el cálculo de la exergía
      $15\ \text{°C}$.

      *Las propiedades del vapor, de [las tablas de
      vapor](/road-to-ingenieria/ingenieria-termica/tablas/#sobrecalentado-0-1),
      como en el examen se sacan del anexo.*
    pide: La temperatura de entrada, los dos rendimientos y la exergía destruida.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado da la presión de entrada pero no la temperatura. ¿Por
          dónde se empieza?
        opciones:
          - texto: >-
              Por el estado de salida, que sí está fijado, y el balance de
              energía: con la potencia y el gasto sale la entalpía de entrada,
              y con ella y la presión ya hay dos propiedades para entrar en la
              tabla
            correcta: true
            mensaje: |
              Exacto. El postulado de estado pide dos propiedades
              independientes, y a la entrada la segunda no viene dada: **se
              calcula**. A la salida sí están las dos, 0,1 bar y 80 °C. Es el
              orden que hay que aprender: primero el estado conocido y el
              balance, luego la tabla.
          - texto: >-
              Por la tabla de vapor sobrecalentado a 20 bar, buscando la
              temperatura que corresponda
            mensaje: |
              ¿Buscando con qué? Con una sola propiedad —la presión— la tabla
              tiene una columna entera de candidatos. Falta la segunda, y la
              segunda sale del balance de energía.
          - texto: >-
              Por el rendimiento isentrópico, suponiendo un valor típico
            mensaje: |
              El rendimiento es lo que el apartado b) pide **calcular**, así
              que suponerlo sería dar por sabido el resultado. Y además saldría
              44,8 %, que no es ningún valor típico: es el motivo de que el
              enunciado pregunte si la turbina es buena o mala.

      - tipo: calcular
        titulo: La entalpía de salida
        pregunta: |
          El vapor sale a 0,1 bar y 80 °C. ¿Cuál es su entalpía?
        respuesta:
          tipo: magnitud
          valor: '2649.3 kJ/kg'
          tolerancia: 0.005
          formato: una entalpía específica, con su unidad
        distractores:
          - valor: '2583.9 kJ/kg'
            mensaje: |
              Esa es $h''$ a 0,1 bar, la del vapor saturado. Pero a 0,1 bar el
              agua hierve a 45,81 °C y el vapor sale a 80: está
              **sobrecalentado**, y su entalpía se busca en la tabla de
              sobrecalentado de 0,1 bar, no en la de saturación.
          - valor: '2687.5 kJ/kg'
            mensaje: |
              Es la fila de 100 °C, la más cercana a 80. Pero 80 °C no está en
              la tabla, y quedarse con la fila más próxima cuesta 38 kJ/kg: hay
              que interpolar entre la de 50 y la de 100 °C, y 80 cae a un 60 %
              del recorrido.
        pista: |
          La tabla de 0,1 bar tiene filas a 50 y a 100 °C, y 80 °C está a
          $(80-50)/(100-50) = 0{,}6$ del recorrido.
        desarrollo: |
          Primero, dónde está el estado: a 0,1 bar el agua hierve a
          45,81 °C, y a 80 °C el vapor está sobrecalentado. En la tabla de
          0,1 bar, entre las filas de 50 y de 100 °C:

          $$
          h_2 = 2592{,}0 + 0{,}6\,(2687{,}5 - 2592{,}0) = 2649{,}3\ \frac{\text{kJ}}{\text{kg}}
          $$

          Y con la misma fracción, la entropía, que hará falta en el apartado
          c):

          $$
          s_2 = 8{,}1741 + 0{,}6\,(8{,}4489 - 8{,}1741) = 8{,}3390\ \frac{\text{kJ}}{\text{kg}\cdot\text{K}}
          $$

          A presión fija, la entalpía y la entropía del vapor cambian casi en
          línea recta con la temperatura, y por eso esta interpolación es
          fiable. Guárdate la idea: en el apartado c) aparece la interpolación
          que no lo es.

      - tipo: calcular
        titulo: La temperatura de entrada
        pregunta: |
          Con el balance de energía y la tabla a 20 bar, ¿a qué temperatura
          entra el vapor?
        respuesta:
          tipo: magnitud
          valor: '311.1 C'
          tolerancia: 0.005
          formato: una temperatura, con su unidad
        distractores:
          - valor: '300 C'
            mensaje: |
              Ese es el extremo inferior del intervalo de la tabla. La entalpía
              calculada, 3049,3, cae entre las de 300 y 350 °C —3024,2 y
              3137,7—, a un 22 % del recorrido.
          - valor: '325 C'
            mensaje: |
              Has interpolado a la mitad. Aquí la fracción es 0,221, no 0,5: la
              entalpía de entrada está mucho más cerca de la de 300 °C que de
              la de 350.
        pista: |
          Primero $h_1 = \dot W/\dot m + h_2$, y luego se interpola esa
          entalpía entre las filas de 300 y 350 °C de la tabla de 20 bar.
        desarrollo: |
          El balance de la turbina, que se toma adiabática y sin cambios de
          energía cinética ni potencial, como toda turbina salvo que el
          enunciado diga otra cosa:

          $$
          h_1 = \frac{\dot W}{\dot m} + h_2 = \frac{200}{0{,}5} + 2649{,}3
          = 3049{,}3\ \frac{\text{kJ}}{\text{kg}}
          $$

          Y con esa entalpía y los 20 bar, el estado ya está fijado:

          $$
          \frac{3049{,}3 - 3024{,}2}{3137{,}7 - 3024{,}2} = 0{,}2211
          \;\Longrightarrow\;
          \theta_1 = 300 + 0{,}2211\cdot 50 = 311{,}1\ \text{°C}
          $$

      - tipo: calcular
        titulo: El rendimiento interno
        pregunta: |
          ¿Cuál es el rendimiento isentrópico de la turbina?
        respuesta:
          tipo: numero
          valor: '0.448'
          tolerancia: 0.005
          formato: un número entre 0 y 1
        distractores:
          - valor: '2.231'
            mensaje: |
              Has puesto el estado 2 real en el denominador y el ideal en el
              numerador. El rendimiento pone arriba lo que se obtiene —el
              salto **real**— y abajo lo que se podría haber obtenido, que es
              el salto isentrópico y siempre es mayor.
          - valor: '0.8215'
            mensaje: |
              Ese es el título del estado isentrópico, $x_{2'} = 0{,}8215$, que
              es un paso intermedio. El rendimiento es un cociente de saltos de
              entalpía, no una fracción de vapor.
        pista: |
          $\eta_{ST} = (h_1-h_2)/(h_1-h_{2'})$, con $s_{2'} = s_1$. El estado
          2 prima cae dentro de la campana a 0,1 bar, así que hay que sacar su
          título primero.
        desarrollo: |
          La entropía de entrada, interpolando con la misma fracción de antes:

          $$
          s_1 = 6{,}7684 + 0{,}2211\,(6{,}9583-6{,}7684) = 6{,}8104
          \ \frac{\text{kJ}}{\text{kg}\cdot\text{K}}
          $$

          El estado isentrópico tiene esa misma entropía a 0,1 bar. Está entre
          $s' = 0{,}6492$ y $s'' = 8{,}1488$, así que cae dentro de la campana
          y tiene título:

          $$
          x_{2'} = \frac{6{,}8104 - 0{,}6492}{8{,}1488 - 0{,}6492} = 0{,}8215
          \qquad
          h_{2'} = 191{,}81 + 0{,}8215\,(2583{,}9-191{,}81) = 2157{,}0
          $$

          $$
          \eta_{ST} = \frac{3049{,}3 - 2649{,}3}{3049{,}3 - 2157{,}0}
          = \frac{400}{892{,}3} = 0{,}448
          $$

          **Un 44,8 %**, y ahí está contestada la segunda mitad del apartado:
          una turbina que funciona bien anda por encima del 80 %, así que
          desde el punto de vista de las irreversibilidades esta es **mala**.
          Está desperdiciando más de la mitad del salto que tenía disponible.

      - tipo: redactar
        que: deduccion
        consigna: |
          El apartado b) termina con un «razónese». En papel, como lo
          entregarías: **razona si, desde el punto de vista de las
          irreversibilidades, la turbina es buena o mala**. Cuatro o cinco
          líneas.
        rubrica:
          - punto: |
              **El dato que sostiene la respuesta**: el rendimiento interno,
              44,8 %.
            porque: |
              La pregunta pide una valoración, y una valoración sin el número
              en el que se apoya no se puede corregir: «es mala» a secas vale
              lo mismo que «es buena».
          - punto: |
              **La referencia con la que se compara**: una turbina que
              funciona bien pasa del 80 %.
            porque: |
              Bueno o malo es siempre respecto de algo, y el enunciado no da
              la referencia: hay que traerla. Es la línea que convierte un
              número en un juicio.
          - punto: |
              **Qué quiere decir el número**: de todo el salto de entalpía que
              la expansión podía dar, 892 kJ/kg, la turbina entrega 400; más
              de la mitad se pierde.
            porque: |
              Es la lectura física del rendimiento, y la que demuestra que
              sabes qué divide a qué.
          - punto: |
              **De dónde sale la pérdida**: de las irreversibilidades dentro
              de la turbina —rozamientos, turbulencia—, que generan entropía:
              el vapor sale con más entropía de la que entró, y por eso a más
              entalpía que el estado isentrópico.
            porque: |
              Es lo que el enunciado pregunta con «desde el punto de vista de
              las irreversibilidades», y sin esto la respuesta se queda en la
              cuenta.
          - punto: |
              **La conclusión, con la palabra**: la turbina es mala.
            porque: |
              Un razonamiento que no aterriza en la respuesta pedida deja al
              corrector adivinándola. Es una palabra y vale puntos.
        veredicto: |
          Si tu folio tiene los cinco, has razonado. Si te falta la
          referencia del 80 %, tienes un dato y una opinión, pero no un
          argumento: es la línea que más se olvida.

      - tipo: calcular
        titulo: La exergía destruida
        pregunta: |
          ¿Cuánta exergía destruye la turbina?
        respuesta:
          tipo: magnitud
          valor: '220.1 kW'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '0.7643 kW'
            mensaje: |
              Eso es la entropía generada, en kW/K. Guy-Stodola la convierte en
              exergía destruida multiplicando por la temperatura de referencia
              en kelvin, 288.
          - valor: '11.46 kW'
            mensaje: |
              Has multiplicado por 15, la temperatura de referencia en grados
              Celsius. La $T_0$ de Guy-Stodola es absoluta: 15 °C son 288 K.
          - valor: '238.5 kW'
            mensaje: |
              Es la cifra de la resolución oficial, y está un 8 % alta. Sale de
              interpolar la entropía de salida **en presión**, a 80 °C entre
              0,06 y 0,35 bar, dos filas de otras tablas (las del Moran):
              $s_2 = 8{,}4667$. Pero en el vapor la entropía no va con la
              presión sino con su logaritmo, $s \approx s_0 - R\ln p$, y entre
              0,06 y 0,35 bar, casi seis veces más, la recta se aparta mucho
              de la curva. Interpolando en $\ln p$, esas mismas dos filas dan
              8,342, y el anexo, que tiene la fila de 0,1 bar, da 8,3390. Esas
              trece centésimas de más en $s_2$ son los 18 kW de más.
        pista: |
          Una turbina adiabática no intercambia calor, así que
          $\dot S_G = \dot m\,(s_2 - s_1)$, con la $s_2$ del primer paso, y
          luego $Ex_D = T_0\,\dot S_G$.
        desarrollo: |
          Sin calor, el término del calor desaparece del balance de entropía y
          todo lo que hay es generación:

          $$
          \dot S_G = 0{,}5\,(8{,}3390 - 6{,}8104) = 0{,}7643\ \frac{\text{kW}}{\text{K}}
          $$

          $$
          \dot{Ex}_D = T_0\,\dot S_G = 288\cdot 0{,}7643 = 220{,}1\ \text{kW}
          $$

          Compáralo con los 200 kW que la turbina produce: **destruye más
          exergía de la que entrega**. Eso es lo que significa un rendimiento
          interno del 45 % dicho en kilovatios.

          La resolución oficial da 238,5 kW porque su $s_2$ sale de interpolar
          en presión entre dos filas muy separadas. La lección es general:
          **se interpola en la variable en la que la propiedad es casi
          lineal**. A presión fija, h y s son casi lineales en la
          temperatura; a temperatura fija, la s del vapor va con el logaritmo
          de la presión. Si la tabla obliga a interpolar en presión, que sea
          entre filas cercanas.

      - tipo: calcular
        titulo: El rendimiento exergético
        pregunta: |
          ¿Cuál es el rendimiento exergético de la turbina?
        respuesta:
          tipo: numero
          valor: '0.476'
          tolerancia: 0.005
          formato: un número entre 0 y 1
        distractores:
          - valor: '0.448'
            mensaje: |
              Ese es el rendimiento **isentrópico**. Se parecen —44,8 y
              47,6 %— y no son lo mismo: uno compara con el proceso ideal
              entre las mismas presiones, y el otro con toda la exergía que la
              corriente traía. Aquí salen próximos, pero no tienen por qué.
          - valor: '2.101'
            mensaje: |
              Has invertido la fracción. Un rendimiento mayor que uno debería
              haberte parado: significaría que la turbina entrega más trabajo
              del que la corriente puede dar.
        pista: |
          $\eta_{ex} = \dot W / [\dot m\,(a_{f1} - a_{f2})]$, con
          $a_f = h - T_0 s$.
        desarrollo: |
          $$
          a_{f1} = 3049{,}3 - 288\cdot 6{,}8104 = 1087{,}9
          \qquad
          a_{f2} = 2649{,}3 - 288\cdot 8{,}3390 = 247{,}7\ \frac{\text{kJ}}{\text{kg}}
          $$

          $$
          \eta_{ex} = \frac{200}{0{,}5\,(1087{,}9 - 247{,}7)}
          = \frac{200}{420{,}1} = 0{,}476
          $$

          La resolución oficial da 45,6 % porque arrastra la $s_2$ inflada del
          apartado c): la exergía de salida le sale más baja, la corriente
          parece entregar más, y el cociente baja.

      - tipo: dibujar
        consigna: |
          **Dibuja en un diagrama h-s el proceso real de la turbina y el
          isentrópico**, con la campana, las isobaras de 20 y de 0,1 bar y los
          estados 1, 2 y 2′.
        comprueba:
          - punto: |
              El estado 1 sobre la isobara de 20 bar, a 311 °C, fuera de la
              campana.
            porque: |
              Es el punto de partida de los dos procesos, el real y el ideal,
              y está sobrecalentado.
          - punto: |
              El estado 2′ justo debajo del 1, en vertical, sobre la isobara de
              0,1 bar y **dentro** de la campana, con título 0,82.
            porque: |
              Es la expansión ideal: isentrópica, vertical en el h-s. Que caiga
              dentro de la campana es lo que obliga a sacar su título antes que
              su entalpía.
          - punto: |
              El estado 2 sobre la misma isobara de 0,1 bar, a la derecha y por
              encima del 2′, y fuera de la campana: a 80 °C.
            porque: |
              La turbina real genera entropía, así que su salida está a la
              derecha de la ideal, y con más entalpía, porque se ha sacado
              menos trabajo.
          - punto: |
              El proceso real 1-2 a trazos, y las dos caídas de entalpía
              señaladas: 400 kJ/kg la real y 892 la ideal.
            porque: |
              A trazos porque es irreversible y no pasa por estados que se
              conozcan. Y las dos caídas son el rendimiento interno dibujado:
              400 entre 892, el 44,8 %.
        veredicto: |
          Si en tu dibujo el 2 queda a la derecha del 2′ y más alto, has
          dibujado una turbina con pérdidas. Si queda a la izquierda, la
          turbina generaría menos entropía que la ideal, y eso no puede ser.

      - tipo: justificar
        pregunta: Ordena la comprobación que cierra el ejercicio. Una pieza es falsa.
        piezas:
          - texto: >-
              La corriente de vapor entrega 420,1 kW de exergía al atravesar la
              turbina, que es $\dot m\,(a_{f1}-a_{f2})$.
          - texto: >-
              De esos, 200 kW salen como trabajo y 220,1 se destruyen: la suma
              da exactamente 420,1.
          - texto: >-
              Y el cociente entre lo que sale y lo que entraba, 200 entre
              420,1, es el rendimiento exergético: 47,6 %.
          - texto: >-
              Que la suma cuadre demuestra que la turbina es reversible,
              porque la exergía se conserva.
            trampa: true
            mensaje: |
              Demuestra lo contrario. La exergía **no** se conserva, y por eso
              el balance necesita el término de destrucción para cuadrar: si la
              turbina fuese reversible, ese término sería cero y los 420,1 kW
              saldrían enteros como trabajo. Que haga falta un sumando de
              220,1 es la medida de lo irreversible que es.
    resolucion: |
      **a) La temperatura de entrada.** No viene dada: se calcula. Primero el
      estado de salida, sobrecalentado a 0,1 bar y 80 °C, interpolando entre
      las filas de 50 y 100 °C de la tabla de 0,1 bar:

      $$
      h_2 = 2592{,}0 + 0{,}6\,(2687{,}5-2592{,}0) = 2649{,}3\ \frac{\text{kJ}}{\text{kg}}
      \qquad s_2 = 8{,}3390\ \frac{\text{kJ}}{\text{kg}\cdot\text{K}}
      $$

      Y con el balance de la turbina adiabática, la de entrada:

      $$
      h_1 = \frac{200}{0{,}5} + 2649{,}3 = 3049{,}3
      \;\Longrightarrow\;
      \theta_1 = 300 + 0{,}2211\cdot 50 = 311{,}1\ \text{°C}
      $$

      **b) El rendimiento interno, 44,8 %, y la turbina es mala.** Con
      $s_1 = 6{,}8104$ y $s_{2'} = s_1$ a 0,1 bar sale $x_{2'} = 0{,}8215$ y
      $h_{2'} = 2157{,}0$:

      $$
      \eta_{ST} = \frac{400}{892{,}3} = 44{,}8\ \%
      $$

      Una turbina que funciona correctamente pasa del 80 %, así que esta
      desperdicia más de la mitad del salto disponible. Eso es lo que el
      enunciado pide razonar, y la palabra que espera es «mala».

      **c) La exergía destruida.** Adiabática, así que toda la variación de
      entropía es generación:

      $$
      \dot S_G = 0{,}5\,(8{,}3390-6{,}8104) = 0{,}7643\ \frac{\text{kW}}{\text{K}}
      \qquad
      \dot{Ex}_D = 288\cdot 0{,}7643 = 220{,}1\ \text{kW}
      $$

      **d) El rendimiento exergético.**

      $$
      \eta_{ex} = \frac{\dot W}{\dot m\,(a_{f1}-a_{f2})} = \frac{200}{420{,}1}
      = 47{,}6\ \%
      $$

      **La comprobación que hay que hacer siempre en este tema.** Los 420,1 kW
      de exergía que entrega el vapor se reparten en dos: 200 de trabajo y
      220,1 destruidos. La suma cuadra al decimal, y son dos caminos que no
      comparten ecuación —uno sale de las entalpías y las entropías de los dos
      estados, el otro de Guy-Stodola—. Cuando los dos coinciden, el ejercicio
      está bien; cuando no, el error casi siempre está en una interpolación.

      **Y por qué la resolución oficial da 238,5 kW y 45,6 %.** Saca la
      entropía de salida interpolando a 80 °C entre 0,06 y 0,35 bar, dos filas
      de las tablas del Moran, y lo hace en línea recta en la presión:
      $s_2 = 8{,}4667$. Pero la entropía del vapor va con el logaritmo de la
      presión, y en un intervalo tan ancho la recta se aparta de la curva:
      interpolando en $\ln p$, las mismas dos filas dan 8,342, que es casi el
      8,3390 del anexo. Las trece centésimas de más en $s_2$ inflan la
      exergía destruida un 8 %. Con el anexo delante, que tiene la fila de
      0,1 bar, se interpola en temperatura, donde casi todo es lineal.

  - id: exter2223-ord-3-la-tuberia-que-mide-el-viento
    titulo: La tubería que mide el viento, y la correlación que se descarta sola
    fuente: Ejercicio 3 de la convocatoria ordinaria de enero de 2022-2023 · Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica su resolución oficial manuscrita, y los cuatro valores del desarrollo están rehechos y contrastados contra ella.
    nivel: examen
    enunciado: |
      Una tubería de cobre (conductividad del cobre,
      $k = 385\ \text{W/mK}$) de $10\ \text{cm}$ de diámetro interior y
      $0{,}3\ \text{cm}$ de espesor, sin aislamiento, transporta
      $0{,}12\ \text{kg/s}$ de agua caliente a $80\ ^\circ\text{C}$ de
      temperatura media. La tubería discurre por el exterior. Calcúlense:

      a) Las pérdidas de calor por unidad de longitud de tubería si la
      temperatura de la superficie exterior de la tubería es
      $76\ ^\circ\text{C}$.

      b) La velocidad del viento sobre la superficie exterior de la tubería, si
      el aire se encuentra a $20\ ^\circ\text{C}$.

      *Las propiedades que toma la resolución oficial de las tablas: agua a
      $80\ ^\circ\text{C}$, $\rho = 971{,}8\ \text{kg/m}^{3}$,
      $c_p = 4197\ \text{J/(kg}\cdot\text{K)}$,
      $k = 0{,}67\ \text{W/(m}\cdot\text{K)}$,
      $\nu = 3{,}653\cdot 10^{-7}\ \text{m}^{2}/\text{s}$ y $Pr = 2{,}22$;
      aire a la temperatura de película, $48\ ^\circ\text{C}$,
      $k = 0{,}02721\ \text{W/(m}\cdot\text{K)}$,
      $\nu = 1{,}7788\cdot 10^{-5}\ \text{m}^{2}/\text{s}$ y $Pr = 0{,}7233$.*
    pide: Las pérdidas por unidad de longitud y la velocidad del viento.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado da la temperatura de la superficie exterior. ¿Para qué
          sirve ese dato?
        opciones:
          - texto: Para cerrar el circuito por dentro y calcular el calor sin saber nada del aire
            correcta: true
            mensaje: |
              Exacto. Con el agua a 80 y la superficie a 76 ya hay un salto
              conocido a través de dos resistencias conocidas —la convección
              interior y la conducción del cobre—, así que el calor sale sin
              tocar el exterior. Y una vez sabido el calor, el exterior se
              resuelve **al revés**: de él sale $h$, y de $h$ el viento.
          - texto: Para calcular la conducción a través del cobre, que es la que manda
            mensaje: |
              La conducción del cobre no manda nada: su resistencia por metro
              vale $2{,}4\cdot 10^{-5}$ frente a $0{,}020$ de la convección
              interior. Es **ochocientas veces menor**, y podría despreciarse
              sin que cambiara el resultado.
          - texto: Para saber si el flujo exterior es laminar o turbulento
            mensaje: |
              Eso viene después, y no de la temperatura sino del Reynolds — que
              es justamente lo que hay que averiguar. Aquí la temperatura de la
              superficie es el dato que **evita** tener que saber nada del aire
              para el apartado a).
          - texto: Es un dato redundante, se podría calcular
            mensaje: |
              No se podría: para calcularla haría falta la resistencia
              exterior, y esa depende del viento, que es la incógnita. El
              enunciado la da precisamente para romper ese círculo.

      - tipo: calcular
        titulo: Las pérdidas por unidad de longitud
        pregunta: |
          Con el agua a $80\ ^\circ\text{C}$ y la superficie exterior a
          $76\ ^\circ\text{C}$, ¿cuánto calor se pierde por metro de tubería?
        respuesta:
          tipo: magnitud
          valor: '198.38 W/m'
          tolerancia: 0.02
          formato: un calor por unidad de longitud, con su unidad
        distractores:
          - valor: '166000 W/m'
            mensaje: |
              Has usado solo la conducción del cobre. Su resistencia es
              minúscula, así que sola daría un calor enorme; lo que frena de
              verdad es la película de agua pegada a la pared interior.
          - valor: '2777 W/m'
            mensaje: |
              Has puesto el salto de 80 a 20 en vez de a 76. Los 20 °C son del
              aire, y el aire está al otro lado de una resistencia que todavía
              no conoces.
        pista: |
          $\dot{Q}/L = \dfrac{\theta_{agua}-\theta_{sup}}{R_{conv,i} + R_{cond}}$,
          las dos por unidad de longitud.
        desarrollo: |
          La película de agua, con sus propiedades a 80 °C y Dittus-Boelter
          con el exponente del fluido que se enfría:

          $$
          c = \frac{0{,}12}{971{,}8 \cdot \pi \cdot 0{,}1^{2}/4} = 0{,}01572\ \text{m/s}
          \qquad
          Re = \frac{0{,}01572 \cdot 0{,}1}{3{,}653\cdot 10^{-7}} = 4304
          $$

          $$
          Nu = 0{,}023 \cdot 4304^{0{,}8} \cdot 2{,}22^{0{,}3} = 23{,}59
          \qquad
          h_i = \frac{23{,}59 \cdot 0{,}67}{0{,}1} = 158{,}05\ \frac{\text{W}}{\text{m}^{2}\text{K}}
          $$

          $$
          R_{cond} = \frac{\ln(0{,}106/0{,}10)}{2\pi \cdot 385}
          = 2{,}41\cdot 10^{-5}
          \qquad
          R_{conv,i} = \frac{1}{158{,}05\,\pi \cdot 0{,}1} = 0{,}020139
          $$

          $$
          \frac{\dot{Q}}{L} = \frac{80-76}{0{,}020163} = 198{,}38\ \text{W/m}
          $$

      - tipo: calcular
        titulo: El coeficiente exterior
        pregunta: |
          Ese mismo calor atraviesa la película de aire, con la superficie a
          $76$ y el aire a $20\ ^\circ\text{C}$. ¿Cuánto vale $h$ fuera?
        respuesta:
          tipo: magnitud
          valor: '10.64 W/(m^2 K)'
          tolerancia: 0.02
          formato: un coeficiente de convección, con su unidad
        distractores:
          - valor: '11.28 W/(m^2 K)'
            mensaje: |
              Has usado el diámetro interior, 0,10, en vez del exterior. La
              superficie por la que sale el calor es la de fuera: 0,106.
          - valor: '3.54 W/(m^2 K)'
            mensaje: |
              Te has dejado el $\pi D$: el área por metro de tubería es
              $\pi D_2$, no $D_2$.
        pista: |
          $\dot{Q}/L = h_2\,\pi D_2\,(\theta_{sup}-\theta_{aire})$.
        desarrollo: |
          $$
          h_2 = \frac{198{,}38}{\pi \cdot 0{,}106 \cdot (76-20)} = 10{,}64\ \frac{\text{W}}{\text{m}^{2}\text{K}}
          $$

      - tipo: calcular
        titulo: La velocidad del viento
        pregunta: |
          Con $Nu = 41{,}44$ y la correlación
          $Nu = 0{,}26\,Re^{0{,}6}Pr^{1/3}$ —válida para
          $1000 < Re < 2\cdot 10^{5}$—, con $Pr = 0{,}7233$ y
          $\nu = 1{,}7788\cdot 10^{-5}$, ¿a qué velocidad sopla el viento?
        respuesta:
          tipo: magnitud
          valor: '0.94 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '1.59 m/s'
            mensaje: |
              Ese sale de la **otra** correlación, la de
              $0{,}076\,Re^{0{,}7}$. Da $Re = 9472$, que **no está** en su
              rango de validez —$2\cdot 10^{5}$ a $10^{6}$—, así que hay que
              descartarla.
          - valor: '3.39 m/s'
            mensaje: |
              Eso son kilómetros por hora, no metros por segundo. Son 0,94 m/s,
              que efectivamente equivalen a 3,4 km/h.
        pista: |
          Despeja $Re$ de la correlación y después
          $c = Re\,\nu/D_2$.
        desarrollo: |
          $$
          41{,}44 = 0{,}26\,Re^{0{,}6}\,(0{,}7233)^{1/3}
          \;\Longrightarrow\;
          Re = 5609
          $$

          $$
          c = \frac{5609 \cdot 1{,}7788\cdot 10^{-5}}{0{,}106} = 0{,}94\ \text{m/s}
          $$

      - tipo: justificar
        pregunta: Ordena el criterio para elegir correlación. Una pieza es falsa.
        piezas:
          - texto: 'Se prueban las dos: la primera da $Re = 5609$ y la segunda, $Re = 9472$.'
          - texto: '5.609 está dentro de $1000$–$2\cdot10^{5}$, que es el rango de la primera; 9.472 está muy por debajo de $2\cdot10^{5}$, que es donde empieza la segunda, así que la segunda se contradice a sí misma.'
          - texto: 'Se elige la primera porque da el Reynolds más pequeño, y en caso de duda conviene quedarse del lado conservador.'
            trampa: true
            mensaje: |
              No se elige por ser mayor o menor: se elige por **coherencia**.
              Una correlación con rango de validez hay que usarla y después
              comprobar que el Reynolds que devuelve cae dentro de su propio
              rango. La segunda devuelve 9.472 diciendo que solo vale por
              encima de 200.000: se descarta ella sola, sin necesidad de
              criterio ninguno.
    resolucion: |
      **Por qué el enunciado da la temperatura de la superficie.** Sin ella no
      se puede empezar: la resistencia exterior depende del viento, y el viento
      es la incógnita. Dando los 76 °C se rompe el círculo — el calor sale del
      lado de dentro, donde todo se conoce, y el lado de fuera se resuelve
      después y al revés.

      **a) Las pérdidas.** Dos resistencias en serie por metro de tubería, y
      conviene mirar su tamaño antes de sumarlas:

      $$
      R_{cond} = \frac{\ln(0{,}106/0{,}10)}{2\pi\cdot 385} = 2{,}41\cdot 10^{-5}
      \qquad
      R_{conv,i} = 0{,}020139
      $$

      El cobre aporta **ochocientas veces menos** que la película de agua.
      Podría despreciarse sin que cambiara ni la tercera cifra, y eso es lo que
      hay que aprender del cobre: como conductor no ofrece resistencia
      apreciable, así que la temperatura de sus dos caras es prácticamente la
      misma y todo el trabajo lo hacen las dos convecciones.

      $$
      \frac{\dot{Q}}{L} = \frac{80-76}{0{,}020163} = 198{,}38\ \text{W/m}
      $$

      **b) De ahí al viento, en tres pasos.** El mismo calor atraviesa la
      película exterior, así que

      $$
      h_2 = \frac{198{,}38}{\pi\cdot 0{,}106\cdot 56} = 10{,}64\ \frac{\text{W}}{\text{m}^{2}\text{K}}
      \qquad
      Nu = \frac{10{,}64\cdot 0{,}106}{0{,}02721} = 41{,}44
      $$

      con las propiedades del aire a la temperatura de película,
      $(76+20)/2 = 48\ ^\circ\text{C}$.

      **Y aquí está lo que hay que copiar de la resolución oficial.** Hay dos
      correlaciones posibles y cada una trae su rango:

      $$
      Nu = 0{,}26\,Re^{0{,}6}Pr^{1/3} \quad (10^{3} < Re < 2\cdot10^{5})
      \qquad
      Nu = 0{,}076\,Re^{0{,}7}Pr^{1/3} \quad (2\cdot10^{5} < Re < 10^{6})
      $$

      Se prueban **las dos**. La primera devuelve $Re = 5609$, que cae dentro
      de su rango; la segunda devuelve $9472$, muy por debajo de los 200.000
      donde ella misma dice empezar. **La segunda se descarta sola**, sin
      necesidad de ningún criterio: una correlación con rango tiene que
      devolver un Reynolds coherente con él, y comprobarlo cuesta una división.

      $$
      c = \frac{5609 \cdot 1{,}7788\cdot10^{-5}}{0{,}106} = 0{,}94\ \text{m/s}
      $$

      **Y el sentido físico, que confirma el resultado.** 0,94 m/s son 3,4 km/h
      — una brisa apenas perceptible. Encaja con un $h$ exterior de 10,6, que
      está en la frontera entre la convección natural y la forzada. Si hubiera
      salido un viento de 20 m/s con esa $h$, habría que volver atrás.
