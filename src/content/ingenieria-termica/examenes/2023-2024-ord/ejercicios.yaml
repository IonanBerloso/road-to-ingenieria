ejercicios:
  - id: exter2324-ord-1-el-exponente-politropico-negativo
    titulo: El exponente politrópico negativo, y las dos cosas que bajan a la vez
    fuente: Ejercicio 1 de la convocatoria ordinaria de enero de 2023-2024 · Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica su resolución oficial manuscrita, contra la que está contrastado el desarrollo.
    nivel: examen
    enunciado: |
      En un dispositivo cilindro-pistón hay $5\ \text{kg}$ de aire a
      $2{,}5\ \text{bar}$ con un volumen de $2\ \text{m}^{3}$. A lo largo de un
      proceso de exponente politrópico de $-0{,}5$, se liberan
      $120\ \text{kJ}$ de calor. Calcúlese:

      a) Represéntese el proceso en los diagramas más apropiados.

      b) Temperatura final.

      c) Trabajo intercambiado.

      d) Volumen final.

      e) Variación entropía a lo largo del proceso.
    pide: La temperatura y el volumen finales, el trabajo y la variación de entropía.
    pasos:
      - tipo: reconocer
        pregunta: |
          El exponente politrópico es **negativo**, $n = -0{,}5$. ¿Qué
          significa eso en el diagrama $P$–$v$?
        opciones:
          - texto: Que la presión y el volumen se mueven en el mismo sentido
            correcta: true
            mensaje: |
              Eso es. De $Pv^{n} = \text{cte}$ con $n$ negativo sale
              $P = C\,v^{|n|}$: si el volumen baja, la presión baja también. Es
              lo contrario de todo lo habitual —isoterma, adiabática,
              isobárica— y por eso el enunciado lo elige.
          - texto: Que el proceso va hacia atrás en el tiempo
            mensaje: |
              El signo del exponente no dice nada del sentido del proceso. Lo
              que dice es la **forma** de la curva en el diagrama; el sentido
              lo marcan los estados 1 y 2.
          - texto: Que el gas se comporta como un líquido
            mensaje: |
              Sigue siendo un gas ideal y se le aplica $Pv = R'T$ igual que
              siempre. El exponente describe cómo se le obliga a evolucionar,
              no qué es.
          - texto: Que es imposible, porque n va entre 0 y γ
            mensaje: |
              Entre 0 y $\gamma$ están los casos **habituales** —isobárico,
              isotermo, adiabático— pero la politrópica admite cualquier
              exponente. Este ejercicio existe justamente para que no confundas
              «lo que se ve siempre» con «lo que puede pasar».

      - tipo: calcular
        titulo: La temperatura final
        pregunta: |
          Con $T_1 = 348{,}43\ \text{K}$ y
          $c_n = c_v\dfrac{n-\gamma}{n-1}$, ¿a qué temperatura acaba el aire?
        respuesta:
          tipo: magnitud
          valor: '322.04 K'
          tolerancia: 0.005
          formato: una temperatura, con su unidad
        distractores:
          - valor: '381.9 K'
            mensaje: |
              Has puesto el calor con signo positivo. El enunciado dice que se
              **liberan** 120 kJ: el gas los cede, así que $Q = -120$.
          - valor: '314.9 K'
            mensaje: |
              Has usado $c_v$ en vez de $c_n$. En una politrópica que no sea
              isócora el calor no va con $c_v$: va con el calor específico
              politrópico, que aquí vale 0,909.
        pista: |
          $Q = m\,c_n\,(T_2-T_1)$, y ojo al signo de $Q$.
        desarrollo: |
          $$
          c_n = 0{,}718\,\frac{-0{,}5-1{,}4}{-0{,}5-1} = 0{,}909\ \frac{\text{kJ}}{\text{kg}\,\text{K}}
          $$

          $$
          -120 = 5 \cdot 0{,}909 \cdot (T_2 - 348{,}43)
          \;\Longrightarrow\;
          T_2 = 322{,}04\ \text{K}
          $$

      - tipo: calcular
        titulo: El trabajo
        pregunta: |
          ¿Cuánto trabajo se intercambia en el proceso?
        respuesta:
          tipo: magnitud
          valor: '-25.26 kJ'
          tolerancia: 0.02
          formato: un trabajo con su signo, con su unidad
        distractores:
          - valor: '25.26 kJ'
            mensaje: |
              El módulo es correcto, pero el signo no. Sale negativo: el gas
              **recibe** trabajo mientras cede calor, que es lo raro de este
              proceso.
          - valor: '-94.74 kJ'
            mensaje: |
              Esa es la variación de energía interna, $m c_v \Delta T$. El
              trabajo es lo que queda del primer principio después de
              descontarla del calor.
        pista: |
          $W = \dfrac{m R'(T_1-T_2)}{n-1}$, o bien $W = Q - \Delta U$.
        desarrollo: |
          $$
          W = \frac{5 \cdot 0{,}287 \cdot (348{,}43-322{,}04)}{-0{,}5-1}
          = -25{,}26\ \text{kJ}
          $$

          Y se comprueba con el primer principio:
          $\Delta U = 5 \cdot 0{,}718 \cdot (-26{,}39) = -94{,}74$, así que
          $W = Q - \Delta U = -120 + 94{,}74 = -25{,}26$.

      - tipo: calcular
        titulo: El volumen final
        pregunta: |
          ¿Qué volumen ocupa el aire al final?
        respuesta:
          tipo: magnitud
          valor: '1.898 m^3'
          tolerancia: 0.01
          formato: un volumen, con su unidad
        distractores:
          - valor: '2.108 m^3'
            mensaje: |
              Has invertido el exponente. Con $n$ negativo el gas se
              **comprime** al enfriarse, no se expande — que es lo contrario de
              lo que uno espera y el motivo de que este ejercicio lo pregunte.
          - valor: '1.849 m^3'
            mensaje: |
              Has usado la relación de una adiabática, $\gamma$, en vez del
              exponente del enunciado.
        pista: |
          $T v^{n-1} = \text{cte}$, o directamente
          $V_2 = \dfrac{m R'T_2}{P_2}$ una vez conocida $P_2$.
        desarrollo: |
          $$
          V_2 = V_1\left(\frac{T_1}{T_2}\right)^{\frac{1}{n-1}}
          = 2\left(\frac{348{,}43}{322{,}04}\right)^{-\frac{2}{3}}
          = 1{,}898\ \text{m}^{3}
          $$

      - tipo: justificar
        pregunta: Ordena la lectura del proceso. Una pieza es falsa.
        piezas:
          - texto: 'La presión pasa de 250 a 243,5 kPa y el volumen de 2 a 1,898 m³: **bajan las dos**, que es lo que hace un exponente negativo.'
          - texto: 'El gas cede 120 kJ de calor y recibe 25,26 kJ de trabajo, y la diferencia son los 94,74 kJ que pierde de energía interna.'
          - texto: 'Como el volumen disminuye, el gas se está comprimiendo y por tanto la presión tiene que subir.'
            trampa: true
            mensaje: |
              Esa es la intuición que el ejercicio desmonta. «Comprimir sube la
              presión» vale para una isoterma o una adiabática, no para
              cualquier proceso: aquí la presión **baja** a la vez que el
              volumen, y eso es precisamente lo que significa $n < 0$. Lo que
              manda es la ley del proceso, no la intuición.
    resolucion: |
      **Qué significa un exponente negativo.** De $Pv^{n} = \text{cte}$ con
      $n = -0{,}5$ sale $P = C\,v^{0{,}5}$: **la presión crece con el
      volumen**. En el diagrama $P$–$v$ la curva sube hacia la derecha, al
      revés que todas las que se ven a diario. Aquí el gas se enfría, así que
      recorre esa curva hacia abajo y **bajan las dos cosas a la vez**, presión
      y volumen. Reconocerlo antes de calcular evita el error de dar por hecho
      que comprimir sube la presión.

      **b) La temperatura final.** Primero el estado 1:
      $T_1 = P_1V_1/(mR') = 250 \cdot 2/(5 \cdot 0{,}287) = 348{,}43$ K. Y el
      calor de una politrópica va con su calor específico propio:

      $$
      c_n = c_v\,\frac{n-\gamma}{n-1} = 0{,}718\,\frac{-1{,}9}{-1{,}5}
      = 0{,}909\ \frac{\text{kJ}}{\text{kg}\,\text{K}}
      $$

      Fíjate en que sale **positivo**. En las politrópicas habituales —las que
      caen entre 1 y $\gamma$— este calor específico es negativo, que es lo que
      produce la rareza de «calentar enfriando». Aquí no: con $n$ negativo el
      numerador y el denominador cambian de signo a la vez y $c_n > 0$, así que
      ceder calor enfría, como uno esperaría.

      $$
      -120 = 5 \cdot 0{,}909 \cdot (T_2-348{,}43)
      \;\Longrightarrow\;
      T_2 = 322{,}04\ \text{K} = 49{,}0\ ^\circ\text{C}
      $$

      **c) El trabajo.**

      $$
      W = \frac{mR'(T_1-T_2)}{n-1} = \frac{1{,}435 \cdot 26{,}39}{-1{,}5}
      = -25{,}26\ \text{kJ}
      $$

      Negativo: el gas **recibe** trabajo. Y el primer principio lo confirma:
      pierde 94,74 kJ de energía interna y cede 120 de calor, así que alguien
      tiene que estar metiéndole los 25,26 que faltan.

      **d) El volumen final.**

      $$
      V_2 = V_1\left(\frac{T_1}{T_2}\right)^{\frac{1}{n-1}} = 1{,}898\ \text{m}^{3}
      $$

      y con él $P_2 = mR'T_2/V_2 = 243{,}5$ kPa. Las dos por debajo de las
      iniciales, como anunciaba la forma de la curva.

      **e) La variación de entropía.**

      $$
      \Delta S = m\left[c_v\ln\frac{T_2}{T_1} + R'\ln\frac{V_2}{V_1}\right]
      = 5\,(-0{,}0565 - 0{,}0151) = -0{,}358\ \text{kJ/K}
      $$

      Negativa, y tiene que serlo: el sistema cede calor, y si además el
      proceso fuese reversible toda esa entropía habría salido con él. Que sea
      negativa **no viola nada**: el segundo principio prohíbe que baje la del
      universo, no la de un sistema que se enfría.

      **Lo que este ejercicio existe para enseñar** es que la familia de las
      politrópicas es mucho más ancha que los cuatro casos de clase. Un
      exponente puede ser negativo, y entonces el diagrama hace algo que la
      intuición no espera. La ley del proceso manda sobre lo que uno da por
      supuesto.
