ejercicios:
  - id: exter2324-ord-1-el-exponente-politropico-negativo
    titulo: El exponente politrópico negativo, y las dos cosas que bajan a la vez
    fuente: Ejercicio 1 de la convocatoria ordinaria de enero de 2023-2024 · Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica su resolución oficial manuscrita, contra la que está contrastado el desarrollo.
    nivel: examen
    enunciado: |
      En un dispositivo cilindro-pistón hay $5\ \text{kg}$ de aire a
      $2{,}5\ \text{bar}$ con un volumen de $2\ \text{m}^{3}$. A lo largo de un
      proceso de exponente politrópico de $-0{,}5$, se liberan
      $120\ \text{kJ}$ de calor. Calcúlese:

      a) Represéntese el proceso en los diagramas más apropiados.

      b) Temperatura final.

      c) Trabajo intercambiado.

      d) Volumen final.

      e) Variación entropía a lo largo del proceso.
    pide: La temperatura y el volumen finales, el trabajo y la variación de entropía.
    pasos:
      - tipo: reconocer
        pregunta: |
          El exponente politrópico es **negativo**, $n = -0{,}5$. ¿Qué
          significa eso en el diagrama $P$–$v$?
        opciones:
          - texto: Que la presión y el volumen se mueven en el mismo sentido
            correcta: true
            mensaje: |
              Eso es. De $Pv^{n} = \text{cte}$ con $n$ negativo sale
              $P = C\,v^{|n|}$: si el volumen baja, la presión baja también. Es
              lo contrario de todo lo habitual —isoterma, adiabática,
              isobárica— y por eso el enunciado lo elige.
          - texto: Que el proceso va hacia atrás en el tiempo
            mensaje: |
              El signo del exponente no dice nada del sentido del proceso. Lo
              que dice es la **forma** de la curva en el diagrama; el sentido
              lo marcan los estados 1 y 2.
          - texto: Que el gas se comporta como un líquido
            mensaje: |
              Sigue siendo un gas ideal y se le aplica $Pv = R'T$ igual que
              siempre. El exponente describe cómo se le obliga a evolucionar,
              no qué es.
          - texto: Que es imposible, porque n va entre 0 y γ
            mensaje: |
              Entre 0 y $\gamma$ están los casos **habituales** —isobárico,
              isotermo, adiabático— pero la politrópica admite cualquier
              exponente. Este ejercicio existe justamente para que no confundas
              «lo que se ve siempre» con «lo que puede pasar».

      - tipo: calcular
        titulo: La temperatura final
        pregunta: |
          Con $T_1 = 348{,}43\ \text{K}$ y
          $c_n = c_v\dfrac{n-\gamma}{n-1}$, ¿a qué temperatura acaba el aire?
        respuesta:
          tipo: magnitud
          valor: '322.04 K'
          tolerancia: 0.005
          formato: una temperatura, con su unidad
        distractores:
          - valor: '381.9 K'
            mensaje: |
              Has puesto el calor con signo positivo. El enunciado dice que se
              **liberan** 120 kJ: el gas los cede, así que $Q = -120$.
          - valor: '314.9 K'
            mensaje: |
              Has usado $c_v$ en vez de $c_n$. En una politrópica que no sea
              isócora el calor no va con $c_v$: va con el calor específico
              politrópico, que aquí vale 0,909.
        pista: |
          $Q = m\,c_n\,(T_2-T_1)$, y ojo al signo de $Q$.
        desarrollo: |
          $$
          c_n = 0{,}718\,\frac{-0{,}5-1{,}4}{-0{,}5-1} = 0{,}909\ \frac{\text{kJ}}{\text{kg}\,\text{K}}
          $$

          $$
          -120 = 5 \cdot 0{,}909 \cdot (T_2 - 348{,}43)
          \;\Longrightarrow\;
          T_2 = 322{,}04\ \text{K}
          $$

      - tipo: calcular
        titulo: El trabajo
        pregunta: |
          ¿Cuánto trabajo se intercambia en el proceso?
        respuesta:
          tipo: magnitud
          valor: '-25.26 kJ'
          tolerancia: 0.02
          formato: un trabajo con su signo, con su unidad
        distractores:
          - valor: '25.26 kJ'
            mensaje: |
              El módulo es correcto, pero el signo no. Sale negativo: el gas
              **recibe** trabajo mientras cede calor, que es lo raro de este
              proceso.
          - valor: '-94.74 kJ'
            mensaje: |
              Esa es la variación de energía interna, $m c_v \Delta T$. El
              trabajo es lo que queda del primer principio después de
              descontarla del calor.
        pista: |
          $W = \dfrac{m R'(T_1-T_2)}{n-1}$, o bien $W = Q - \Delta U$.
        desarrollo: |
          $$
          W = \frac{5 \cdot 0{,}287 \cdot (348{,}43-322{,}04)}{-0{,}5-1}
          = -25{,}26\ \text{kJ}
          $$

          Y se comprueba con el primer principio:
          $\Delta U = 5 \cdot 0{,}718 \cdot (-26{,}39) = -94{,}74$, así que
          $W = Q - \Delta U = -120 + 94{,}74 = -25{,}26$.

      - tipo: calcular
        titulo: El volumen final
        pregunta: |
          ¿Qué volumen ocupa el aire al final?
        respuesta:
          tipo: magnitud
          valor: '1.898 m^3'
          tolerancia: 0.01
          formato: un volumen, con su unidad
        distractores:
          - valor: '2.108 m^3'
            mensaje: |
              Has invertido el exponente. Con $n$ negativo el gas se
              **comprime** al enfriarse, no se expande — que es lo contrario de
              lo que uno espera y el motivo de que este ejercicio lo pregunte.
          - valor: '1.849 m^3'
            mensaje: |
              Has usado la relación de una adiabática, $\gamma$, en vez del
              exponente del enunciado.
        pista: |
          $T v^{n-1} = \text{cte}$, o directamente
          $V_2 = \dfrac{m R'T_2}{P_2}$ una vez conocida $P_2$.
        desarrollo: |
          $$
          V_2 = V_1\left(\frac{T_1}{T_2}\right)^{\frac{1}{n-1}}
          = 2\left(\frac{348{,}43}{322{,}04}\right)^{-\frac{2}{3}}
          = 1{,}898\ \text{m}^{3}
          $$

      - tipo: justificar
        pregunta: Ordena la lectura del proceso. Una pieza es falsa.
        piezas:
          - texto: 'La presión pasa de 250 a 243,5 kPa y el volumen de 2 a 1,898 m³: **bajan las dos**, que es lo que hace un exponente negativo.'
          - texto: 'El gas cede 120 kJ de calor y recibe 25,26 kJ de trabajo, y la diferencia son los 94,74 kJ que pierde de energía interna.'
          - texto: 'Como el volumen disminuye, el gas se está comprimiendo y por tanto la presión tiene que subir.'
            trampa: true
            mensaje: |
              Esa es la intuición que el ejercicio desmonta. «Comprimir sube la
              presión» vale para una isoterma o una adiabática, no para
              cualquier proceso: aquí la presión **baja** a la vez que el
              volumen, y eso es precisamente lo que significa $n < 0$. Lo que
              manda es la ley del proceso, no la intuición.
    resolucion: |
      **Qué significa un exponente negativo.** De $Pv^{n} = \text{cte}$ con
      $n = -0{,}5$ sale $P = C\,v^{0{,}5}$: **la presión crece con el
      volumen**. En el diagrama $P$–$v$ la curva sube hacia la derecha, al
      revés que todas las que se ven a diario. Aquí el gas se enfría, así que
      recorre esa curva hacia abajo y **bajan las dos cosas a la vez**, presión
      y volumen. Reconocerlo antes de calcular evita el error de dar por hecho
      que comprimir sube la presión.

      **b) La temperatura final.** Primero el estado 1:
      $T_1 = P_1V_1/(mR') = 250 \cdot 2/(5 \cdot 0{,}287) = 348{,}43$ K. Y el
      calor de una politrópica va con su calor específico propio:

      $$
      c_n = c_v\,\frac{n-\gamma}{n-1} = 0{,}718\,\frac{-1{,}9}{-1{,}5}
      = 0{,}909\ \frac{\text{kJ}}{\text{kg}\,\text{K}}
      $$

      Fíjate en que sale **positivo**. En las politrópicas habituales —las que
      caen entre 1 y $\gamma$— este calor específico es negativo, que es lo que
      produce la rareza de «calentar enfriando». Aquí no: con $n$ negativo el
      numerador y el denominador cambian de signo a la vez y $c_n > 0$, así que
      ceder calor enfría, como uno esperaría.

      $$
      -120 = 5 \cdot 0{,}909 \cdot (T_2-348{,}43)
      \;\Longrightarrow\;
      T_2 = 322{,}04\ \text{K} = 49{,}0\ ^\circ\text{C}
      $$

      **c) El trabajo.**

      $$
      W = \frac{mR'(T_1-T_2)}{n-1} = \frac{1{,}435 \cdot 26{,}39}{-1{,}5}
      = -25{,}26\ \text{kJ}
      $$

      Negativo: el gas **recibe** trabajo. Y el primer principio lo confirma:
      pierde 94,74 kJ de energía interna y cede 120 de calor, así que alguien
      tiene que estar metiéndole los 25,26 que faltan.

      **d) El volumen final.**

      $$
      V_2 = V_1\left(\frac{T_1}{T_2}\right)^{\frac{1}{n-1}} = 1{,}898\ \text{m}^{3}
      $$

      y con él $P_2 = mR'T_2/V_2 = 243{,}5$ kPa. Las dos por debajo de las
      iniciales, como anunciaba la forma de la curva.

      **e) La variación de entropía.**

      $$
      \Delta S = m\left[c_v\ln\frac{T_2}{T_1} + R'\ln\frac{V_2}{V_1}\right]
      = 5\,(-0{,}0565 - 0{,}0151) = -0{,}358\ \text{kJ/K}
      $$

      Negativa, y tiene que serlo: el sistema cede calor, y si además el
      proceso fuese reversible toda esa entropía habría salido con él. Que sea
      negativa **no viola nada**: el segundo principio prohíbe que baje la del
      universo, no la de un sistema que se enfría.

      **Lo que este ejercicio existe para enseñar** es que la familia de las
      politrópicas es mucho más ancha que los cuatro casos de clase. Un
      exponente puede ser negativo, y entonces el diagrama hace algo que la
      intuición no espera. La ley del proceso manda sobre lo que uno da por
      supuesto.

  - id: exter2324-ord-2-el-motor-que-mueve-un-compresor
    titulo: El motor térmico que mueve un compresor, y la temperatura del denominador
    fuente: Ejercicio 2 de la convocatoria ordinaria de 2023-2024, celebrada en enero de 2024 · Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica su resolución oficial manuscrita, contra la que está contrastado el desarrollo.
    nivel: examen
    enunciado: |
      Un motor térmico trabaja entre dos focos, a $300\ ^\circ\text{C}$ y
      $20\ ^\circ\text{C}$, recibiendo $60\ \text{kW}$ del foco caliente. Su
      rendimiento es el $80\ \%$ del rendimiento del motor reversible que
      trabajaría entre esos mismos focos. La potencia generada por este motor
      térmico se emplea en un compresor para comprimir $0{,}1\ \text{kg/s}$ de
      aire desde $1\ \text{bar}$ y $20\ ^\circ\text{C}$ hasta $5\ \text{bar}$ y
      $150\ ^\circ\text{C}$. Calcúlese:

      a) Represéntense los procesos en los diagramas más adecuados.

      b) La potencia del compresor.

      c) El flujo de calor en el compresor y el flujo de calor cedido por el
      motor térmico al foco frío.

      d) La exergía destruida en el compresor.

      e) El rendimiento exergético del compresor.

      Considérese $P_0 = 1\ \text{bar}$ y $T_0 = 20\ ^\circ\text{C}$.
    pide: La potencia, los dos calores, la exergía destruida y el rendimiento exergético.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué es exactamente lo que el motor le pasa al compresor?
        opciones:
          - texto: Solo la potencia mecánica, 23,46 kW — nada de calor
            correcta: true
            mensaje: |
              Eso es, y conviene tenerlo claro porque el ejercicio junta dos
              máquinas y es fácil mezclarlas. El motor recibe 60 kW de calor a
              300 °C y suelta 36,5 al foco frío; lo único que cruza hacia el
              compresor es el **eje**. Los 60 kW no aparecen en ninguna cuenta
              del compresor.
          - texto: Los 60 kW del foco caliente, que el compresor aprovecha
            mensaje: |
              Esos 60 kW entran al **motor**, no al compresor. El motor
              convierte una parte en trabajo y tira el resto al foco frío; lo
              que llega al compresor es solo esa parte, 23,46 kW.
          - texto: La potencia y el calor que el motor no ha aprovechado
            mensaje: |
              El calor no aprovechado —36,5 kW— se cede **al foco frío**, que
              es el ambiente a 20 °C. No va al compresor: si fuera allí, el
              enunciado tendría que decirlo.
          - texto: Depende del rendimiento exergético del compresor, que hay que calcular antes
            mensaje: |
              Al revés: el rendimiento exergético es lo **último** que se
              calcula, y necesita saber ya cuánta potencia entra. La cadena va
              hacia delante — primero el motor, luego el compresor.

      - tipo: calcular
        titulo: La potencia del compresor
        pregunta: |
          Con los focos a $300$ y $20\ ^\circ\text{C}$ y un rendimiento del
          $80\ \%$ del reversible, ¿qué potencia entrega el motor?
        respuesta:
          tipo: magnitud
          valor: '23.46 kW'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '29.32 kW'
            mensaje: |
              Ese es el trabajo del motor **reversible**. Falta aplicarle el
              80 %: el enunciado dice que el rendimiento real es esa fracción
              del reversible, no que sea el reversible.
          - valor: '48 kW'
            mensaje: |
              Has tomado el 80 % como si fuera el rendimiento del motor. Es el
              80 % **del rendimiento de Carnot**, que aquí vale 0,4887 — así
              que el rendimiento real es 0,391.
        pista: |
          $\eta = 0{,}8\left(1-\dfrac{T_f}{T_c}\right)$ y después
          $\dot{W} = \eta\,\dot{Q}_c$.
        desarrollo: |
          $$
          \eta = 0{,}8\left(1-\frac{293}{573}\right) = 0{,}3909
          \;\Longrightarrow\; \dot{W} = 0{,}3909 \cdot 60 = 23{,}46\ \text{kW}
          $$

      - tipo: calcular
        titulo: El calor del compresor
        pregunta: |
          El aire gana $13{,}07\ \text{kW}$ de entalpía y recibe
          $23{,}46\ \text{kW}$ de trabajo. ¿Cuánto calor intercambia el
          compresor?
        respuesta:
          tipo: magnitud
          valor: '-10.39 kW'
          tolerancia: 0.02
          formato: un flujo de calor, con su unidad y con su signo
        distractores:
          - valor: '13.07 kW'
            mensaje: |
              Esa es la entalpía que gana el aire. Si el compresor fuera
              adiabático coincidirían, pero aquí entra más trabajo del que el
              aire se queda: la diferencia se va como calor.
          - valor: '10.39 kW'
            mensaje: |
              El módulo está bien y el signo no. El compresor **cede** calor:
              le meten 23,46 kW de trabajo y el aire solo se queda con 13,07.
        pista: |
          Volumen de control en régimen permanente:
          $\dot{Q} = \Delta\dot{H} - \dot{W}_{entra}$.
        desarrollo: |
          $$
          \dot{Q} = 13{,}07 - 23{,}46 = -10{,}39\ \text{kW}
          $$

      - tipo: calcular
        titulo: La exergía destruida
        pregunta: |
          El aire baja su entropía en $9{,}287\ \text{W/K}$, y el calor sale por
          una superficie que se toma a la temperatura media del aire,
          $(423+293)/2$. ¿Cuánta exergía se destruye?
        respuesta:
          tipo: magnitud
          valor: '5.78 kW'
          tolerancia: 0.02
          formato: una exergía por unidad de tiempo, con su unidad
        distractores:
          - valor: '7.67 kW'
            mensaje: |
              Has puesto el calor a la temperatura **del ambiente**, 293 K, en
              vez de a la de la superficie por la que sale, 358. La diferencia
              es del 33 %, y no es un matiz: la temperatura del denominador es
              la de la frontera donde cruza el calor, y aquí esa frontera está
              caliente.
          - valor: '10.39 kW'
            mensaje: |
              Esos son los kilovatios de **calor** que suelta el compresor. La
              exergía destruida es otra cosa, y de hecho es menor: parte de ese
              calor se va llevándose exergía sin destruirla.
        pista: |
          $\dot{S}_G = \dot{m}(s_2-s_1) - \dfrac{\dot{Q}}{T_{sup}}$, y después
          $Ex_D = T_0\,\dot{S}_G$.
        desarrollo: |
          $$
          \dot{S}_G = -9{,}287 + \frac{10390{,}5}{358} = 19{,}737\ \text{W/K}
          $$

          $$
          Ex_D = 293 \cdot 19{,}737 = 5782{,}9\ \text{W}
          $$

      - tipo: justificar
        pregunta: Ordena la lectura del rendimiento. Una pieza es falsa.
        piezas:
          - texto: 'El compresor recibe 23,46 kW de trabajo, que es exergía pura, y el aire se lleva 15,79 de exergía de flujo: el rendimiento es 67,3 %.'
          - texto: 'De los 7,67 kW que no llegan al aire, 5,78 se destruyen dentro y 1,89 se marchan con el calor que sale a 358 K.'
          - texto: 'Y como el motor rinde un 39 %, el conjunto motor más compresor rinde el 39 % de 67,3, o sea un 26 %.'
            trampa: true
            mensaje: |
              Multiplicar los dos rendimientos así no significa nada, porque
              **miden cosas distintas**: el del motor compara trabajo con
              **calor** y el del compresor compara exergía con **exergía**. Para
              encadenarlos habría que escribir el rendimiento exergético del
              motor, que no es su 39 %: los 60 kW a 300 °C solo llevan
              $60(1-293/573) = 29{,}3$ kW de exergía, así que el motor rinde
              exergéticamente 23,46/29,3 = **80 %** — que es, no por casualidad,
              el 80 % del enunciado.
    resolucion: |
      **Es el único ejercicio del corpus que acopla dos máquinas**, y lo primero
      es no mezclarlas. El motor recibe 60 kW a 300 °C, entrega trabajo y tira
      el resto al foco frío; lo único que cruza hacia el compresor es el eje.

      **b) La potencia.** El rendimiento es el 80 % del de Carnot:

      $$
      \eta = 0{,}8\left(1-\frac{293}{573}\right) = 0{,}3909
      \;\Longrightarrow\; \dot{W} = 23{,}46\ \text{kW}
      $$

      **c) Los dos calores.** Al foco frío va lo que el motor no convierte,
      $60 - 23{,}46 = 36{,}55\ \text{kW}$. Y en el compresor, el aire gana
      $0{,}1\cdot 1{,}005\cdot 130 = 13{,}07\ \text{kW}$ de entalpía mientras
      recibe 23,46 de trabajo, así que sobran:

      $$
      \dot{Q}_{comp} = 13{,}07 - 23{,}46 = -10{,}39\ \text{kW}
      $$

      **d) Y aquí está la decisión que decide el ejercicio: a qué temperatura
      sale ese calor.** No es la del ambiente. La resolución oficial toma la
      temperatura de la superficie por la que cruza el calor como **el promedio
      entre la entrada y la salida del aire**, $(423+293)/2 = 358\ \text{K}$:

      $$
      \dot{S}_G = \dot{m}(s_2-s_1) - \frac{\dot{Q}}{T_{sup}}
      = -9{,}287 + \frac{10390{,}5}{358} = 19{,}737\ \text{W/K}
      $$

      $$
      Ex_D = 293 \cdot 19{,}73 = 5{,}78\ \text{kW}
      $$

      Si en vez de 358 se pusieran los 293 del ambiente saldrían **7,67 kW**: un
      33 % más. La regla, que es la del bloque entero, es que **la temperatura
      del denominador es la de la frontera por donde cruza el calor**, y dónde
      pongas la frontera es una decisión que hay que declarar.

      **e) El rendimiento.** Lo que entra es trabajo —exergía pura— y lo que
      sale útil es la exergía de flujo que gana el aire:

      $$
      \eta_{Ex} = \frac{15{,}79}{23{,}46} = 67{,}3\ \%
      $$

      El balance cierra por los dos lados, que es la comprobación que este
      bloque siempre pide: de los 23,46 kW que entran, **15,79** se quedan en el
      aire, **1,89** se van con el calor que sale a 358 K y **5,78** se
      destruyen dentro.

      > **Y una advertencia sobre encadenar rendimientos**, que es el error que
      > este ejercicio invita a cometer. El motor rinde 39 % y el compresor
      > 67,3 %, y multiplicarlos no da nada con sentido: el primero compara
      > trabajo con **calor** y el segundo exergía con **exergía**. Si se quiere
      > encadenar hay que poner los dos en la misma moneda — y entonces el motor
      > rinde exergéticamente $23{,}46/29{,}3 = 80\ \%$, que es exactamente el
      > 80 % del enunciado. No es casualidad: el rendimiento exergético de un
      > motor térmico **es** su fracción de Carnot.

  - id: exter2324-ord-3-cuatro-incognitas-en-la-misma-cadena
    titulo: Cuatro incógnitas en la misma cadena, y la correlación que gana esta vez
    fuente: Ejercicio 3 de la convocatoria ordinaria de 2023-2024, celebrada en enero de 2024 · Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica su resolución oficial manuscrita, contra la que está contrastado el desarrollo.
    nivel: examen
    enunciado: |
      A través de una tubería de acero de $5\ \text{m}$ de longitud y de
      $15\ \text{cm}$ y $18\ \text{cm}$ de diámetro interior y exterior,
      respectivamente, pasan $16\ \text{kg/s}$ de agua. A la entrada de la
      tubería, la temperatura del agua es $85\ ^\circ\text{C}$ y la presión es
      $1\ \text{bar}$. Para reducir las pérdidas de calor, se coloca una capa de
      magnesita sobre la tubería de acero, consiguiendo así que la pérdida de
      calor a través de la tubería sea $8000\ \text{W}$. Se mide la temperatura
      en la superficie exterior de la magnesita, y se sabe que su valor es
      $71\ ^\circ\text{C}$ cuando el viento a $15\ ^\circ\text{C}$ sopla
      perpendicular a la misma. Calcúlese:

      a) La temperatura de la superficie interior de la tubería de acero.

      b) La temperatura de la superficie exterior de la tubería de acero.

      c) El espesor de la capa de magnesita colocada en la tubería.

      d) La velocidad del viento.

      Considérese que la conductividad de la tubería en
      $k_{tuberia} = 14\ \text{W/(m}\cdot\text{K)}$, y la de la magnesita en
      $k_{magnesita} = 2{,}69\ \text{W/(m}\cdot\text{K)}$.

      Nota: Para calcular las propiedades termofísicas del agua, utilícese la
      temperatura de entrada del agua en la tubería.

      *De la resolución oficial: con las propiedades del agua a
      $85\ ^\circ\text{C}$ y Dittus-Boelter sale
      $h_{int} = 3957{,}9\ \text{W/m}^{2}\text{K}$, y con el balance el agua
      sale a $84{,}88\ ^\circ\text{C}$, así que su temperatura media es
      $84{,}94\ ^\circ\text{C}$. Y para el aire a la temperatura
      de película, $43\ ^\circ\text{C}$: $k = 0{,}02684\ \text{W/m}\cdot\text{K}$,
      $\nu = 1{,}7308\cdot 10^{-5}\ \text{m}^{2}/\text{s}$ y $Pr = 0{,}7247$,
      con las dos correlaciones alternativas de flujo cruzado sobre cilindro —
      $0{,}26\,Re^{0{,}6}Pr^{1/3}$ hasta $2\cdot 10^{5}$ y
      $0{,}076\,Re^{0{,}7}Pr^{1/3}$ de ahí a $10^{6}$.*
    pide: Dos temperaturas superficiales, el espesor del aislante y la velocidad del viento.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado da el calor perdido **y** una temperatura intermedia, la
          de la cara exterior de la magnesita. ¿Qué permite esa combinación?
        opciones:
          - texto: Recorrer la cadena en los dos sentidos desde esos dos datos, y despejar una incógnita en cada tramo
            correcta: true
            mensaje: |
              Exacto. Con el calor conocido, cada resistencia da su salto de
              temperatura. Desde el agua hacia fuera salen las dos superficies
              del acero; entre el acero y los 71 °C sale el espesor que falta; y
              desde los 71 hacia el aire sale el viento. **Cuatro incógnitas,
              una sola cadena.**
          - texto: Que el problema esté sobredeterminado, y haya que elegir qué datos usar
            mensaje: |
              No sobra nada: hay cuatro incógnitas y hacen falta los dos datos.
              Sin el calor no se puede recorrer ningún tramo; sin los 71 °C no
              se puede separar el espesor de la velocidad, porque las dos
              incógnitas caerían en el mismo tramo.
          - texto: Calcular el coeficiente global, que es lo único que hace falta
            mensaje: |
              El coeficiente global sirve para relacionar los dos extremos, pero
              aquí las incógnitas están **dentro** de la cadena. Hay que abrirla
              eslabón a eslabón.
          - texto: Suponer que el acero y la magnesita están a la misma temperatura
            mensaje: |
              No pueden estarlo: si lo estuvieran no pasaría calor entre ellos.
              Precisamente los saltos de temperatura entre eslabones son lo que
              el ejercicio calcula.

      - tipo: calcular
        titulo: La superficie interior del acero
        pregunta: |
          Con $h_{int} = 3957{,}9\ \text{W/m}^{2}\text{K}$ y el agua a
          $84{,}94\ ^\circ\text{C}$ de media —entra a 85 y sale a 84,88—, ¿a
          qué temperatura está la cara interior del tubo?
        respuesta:
          tipo: magnitud
          valor: '84.08 °C'
          tolerancia: 0.004
          formato: una temperatura, con su unidad
        distractores:
          - valor: '80.77 °C'
            mensaje: |
              Esa es la cara **exterior** del acero, un eslabón más allá. Entre
              las dos está la pared de acero, que se lleva 3,3 grados.
          - valor: '71 °C'
            mensaje: |
              Esa es la cara exterior de la **magnesita**, que es dato del
              enunciado y el otro extremo de la cadena. Quedan dos eslabones por
              recorrer antes de llegar ahí.
        pista: |
          $\theta_1 = \theta_{agua} - \dfrac{\dot{Q}}{h_{int}\,\pi D_1 L}$.
        desarrollo: |
          $$
          \theta_1 = 84{,}94 - \frac{8000}{3957{,}9 \cdot \pi \cdot 0{,}15 \cdot 5}
          = 84{,}08\ ^\circ\text{C}
          $$

          Menos de un grado: con agua forzada a casi un metro por segundo, la
          película interior casi no ofrece resistencia. Y fíjate en de dónde se
          parte: de la temperatura **media** del agua, no de la de entrada. El
          enunciado manda leer las propiedades a 85 °C, pero la ley de Newton
          va con la temperatura del fluido a lo largo del tubo, y el agua sale
          a 84,88.

      - tipo: calcular
        titulo: El espesor de la magnesita
        pregunta: |
          La cara exterior del acero está a $80{,}77\ ^\circ\text{C}$ y la de la
          magnesita a $71$. ¿Cuánto mide la capa?
        respuesta:
          tipo: magnitud
          valor: '9.8 mm'
          tolerancia: 0.02
          formato: un espesor, con su unidad
        distractores:
          - valor: '19.6 mm'
            mensaje: |
              Has restado **diámetros** donde había que restar radios. El
              espesor de una capa cilíndrica es $r_3-r_2$, la mitad de lo que
              crece el diámetro.
          - valor: '99.8 mm'
            mensaje: |
              Ese es el radio exterior $r_3$, no el espesor. Falta restarle el
              radio del acero, 9 cm.
        pista: |
          $R_{23} = \dfrac{\theta_2-\theta_3}{\dot{Q}}$, y de ahí
          $\ln(r_3/r_2) = R_{23}\,2\pi k L$.
        desarrollo: |
          $$
          R_{23} = \frac{80{,}77-71}{8000} = 1{,}22\cdot 10^{-3}\ \text{K/W}
          \;\Longrightarrow\; r_3 = 0{,}0998\ \text{m}
          $$

          $$
          e = 0{,}0998 - 0{,}09 = 9{,}8\ \text{mm}
          $$

      - tipo: calcular
        titulo: La velocidad del viento
        pregunta: |
          Con $h_3 = 45{,}57\ \text{W/m}^{2}\text{K}$ y $Nu = 338{,}84$, ¿a qué
          velocidad sopla?
        respuesta:
          tipo: magnitud
          valor: '16.12 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '16.51 m/s'
            mensaje: |
              Has usado la correlación del rango alto,
              $0{,}076\,Re^{0{,}7}Pr^{1/3}$. Su Reynolds sale 190.421, que está
              **por debajo** del $2\cdot 10^{5}$ donde empieza su validez, así
              que esa correlación se descarta ella sola.
          - valor: '17.88 m/s'
            mensaje: |
              Has usado el diámetro del acero, 18 cm. El viento pega sobre la
              magnesita, así que la longitud característica es la suya:
              19,96 cm.
        pista: |
          Despeja $Re$ de la correlación cuyo resultado caiga dentro de su
          propio rango, y luego $c = Re\,\nu/D_3$.
        desarrollo: |
          $$
          338{,}84 = 0{,}26\,Re^{0{,}6}\,0{,}7247^{1/3}
          \;\Longrightarrow\; Re = 185{.}952
          $$

          $$
          c = \frac{185952 \cdot 1{,}7308\cdot 10^{-5}}{0{,}1996} = 16{,}12\ \text{m/s}
          $$

      - tipo: justificar
        pregunta: Ordena cómo se elige entre las dos correlaciones. Una pieza es falsa.
        piezas:
          - texto: 'Se prueban las dos: la del rango bajo da $Re = 185.952$ y la del alto, $190.421$.'
          - texto: 'Las dos quedan por debajo de $2\cdot 10^{5}$, así que la válida es la del rango bajo — la del alto empieza justo ahí.'
          - texto: 'Y como aquí gana la del rango bajo, esa es la que hay que usar siempre en flujo cruzado sobre cilindro.'
            trampa: true
            mensaje: |
              No hay una que gane «siempre». En este mismo corpus, el ejercicio
              de febrero de 2025 —una tubería aislada casi igual— da Reynolds
              por encima de $2\cdot 10^{5}$ y ahí **gana la otra**. Lo que se
              repite no es la correlación ganadora sino el **método**: calcular
              con las dos y quedarse con aquella cuyo resultado caiga dentro de
              su propio rango.
    resolucion: |
      **El ejercicio de transmisión más completo del corpus**: cuatro incógnitas
      encadenadas, y todas salen del mismo dato — los 8.000 W que se pierden.
      Con el calor conocido, cada resistencia da su salto de temperatura, y el
      trabajo consiste en recorrer la cadena eslabón a eslabón.

      **a) y b) Las dos caras del acero.**

      $$
      \theta_1 = 84{,}94 - \frac{8000}{3957{,}9\cdot\pi\cdot 0{,}15\cdot 5} = 84{,}08\ ^\circ\text{C}
      $$

      $$
      \theta_2 = 84{,}08 - 8000\cdot\frac{\ln(18/15)}{2\pi\cdot 14\cdot 5}
      = 80{,}77\ ^\circ\text{C}
      $$

      La película de agua se lleva **menos de un grado** y la pared de acero,
      **3,3**. Con agua forzada a casi un metro por segundo, el lado del agua
      casi no cuenta.

      **c) El espesor**, despejado de la resistencia que falta para llegar a los
      71 °C medidos:

      $$
      R_{23} = \frac{80{,}77-71}{8000} = 1{,}22\cdot 10^{-3}\ \text{K/W}
      \;\Longrightarrow\; e = r_3 - r_2 = 9{,}8\ \text{mm}
      $$

      Un centímetro escaso de magnesita se lleva **9,8 grados**, tres veces más
      que centímetro y medio de acero. No es un gran aislante —su conductividad
      es 2,69, la de un refractario y no la de una lana— pero conduce cinco
      veces peor que el acero, y eso basta para que mande.

      **d) Y la velocidad**, con el mismo método de las dos correlaciones:

      $$
      h_3 = \frac{8000}{\pi\cdot 0{,}1996\cdot 5\cdot (71-15)} = 45{,}57\ \text{W/m}^{2}\text{K}
      \;\Longrightarrow\; Nu = 338{,}84
      $$

      | correlación | su rango | Reynolds que produce | ¿vale? |
      |---|---|---|---|
      | $0{,}26\,Re^{0{,}6}Pr^{1/3}$ | hasta $2\cdot 10^{5}$ | 185.952 | **sí** |
      | $0{,}076\,Re^{0{,}7}Pr^{1/3}$ | de $2\cdot 10^{5}$ a $10^{6}$ | 190.421 | no, se queda corto |

      $$
      c = \frac{185952\cdot 1{,}7308\cdot 10^{-5}}{0{,}1996} = 16{,}12\ \text{m/s}
      $$

      **Y la lectura que solo se ve teniendo las dos convocatorias delante.**
      Aquí gana la correlación del rango bajo; en febrero de 2025, con un
      problema casi idéntico, gana la del alto. La correlación ganadora **no es
      una propiedad del tipo de problema**: depende de dónde caiga el Reynolds,
      y por eso el método —probar las dos y comprobar el rango— es lo único que
      se puede memorizar. Quien memorice la fórmula acertará la mitad de las
      veces.
