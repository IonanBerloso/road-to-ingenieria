# Bilingüe, con el euskera en la primera página y el castellano en la segunda,
# y con «Tiempo: 2.5 horas» impreso.
#
# **~~«Escrito solo en castellano»~~ · corregido el 10 de septiembre de 2026.**
# Esta línea decía eso, y era falso: la página 1 está entera en euskera. Salió
# de mirar una página y no las veintinueve. Es el mismo error cometido ese
# mismo día con enero de 2025, y en el sentido contrario —allí se publicó
# «solo en euskera» siendo bilingüe—. La regla que sale de las dos: **el
# idioma de una convocatoria no se decide con una página.**
#
# **Y una nota vieja sobre repeticiones, que estuvo mal dos veces.** Decía que
# dos de los tres ejercicios de 2023-2024 eran copias de 2020 y 2021. El 10 de
# septiembre de 2026 se comprobó **contra este examen**, se vio que no se
# parecía en nada a enero de 2021 y se dio por falsa. Horas después, al abrir
# la convocatoria de febrero del mismo curso, resultó ser **cierta sobre
# ella**: su ejercicio 3 lleva los datos de enero de 2021 dígito a dígito.
#
# Así que la nota nunca estuvo mal: estaba **mal atribuida**, y comprobarla
# contra la convocatoria equivocada no la corrigió, la enterró. Queda escrito
# aquí porque es la forma de error más cara de este repositorio — una
# comprobación que sale «no» y deja a todo el mundo tranquilo (§17) — y porque
# la afirmación llegó a estar en el plan como criterio de orden.
#
# Su ejercicio 1 es de los que merecen buscarse: **un exponente politrópico
# negativo**, $n = -0{,}5$. Con eso la presión y el volumen se mueven en el
# mismo sentido, que es lo contrario de los cuatro casos de clase, y el
# calor específico politrópico sale **positivo** en lugar de negativo. Es el
# ejercicio que separa «he entendido la familia de las politrópicas» de «me sé
# los cuatro casos habituales».
