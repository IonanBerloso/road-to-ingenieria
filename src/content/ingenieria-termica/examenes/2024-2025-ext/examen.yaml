# Bilingüe, con el euskera en las dos primeras páginas y el castellano en la
# tercera. Da **3 horas**, como febrero de 2022.
#
# Su ejercicio 1 es el que cierra el escalón de los dos caminos, porque **el
# propio examen los exige**: pide la exergía destruida «mediante una de las dos
# maneras mostradas durante el curso» y después «mediante la otra». No es un
# capricho del enunciado — en un depósito rígido y adiabático el balance de
# exergía se reduce término a término a Guy-Stodola, y pedir las dos es
# comprobar que el alumno lo ha visto.
#
# Y su ejercicio 2 es **el único del corpus construido sobre una hoja de
# características de un fabricante**: potencia nominal, potencia útil, caudal
# de aire y hasta el nivel sonoro de un generador de aire caliente comercial.
# Es la clase de ejercicio que enseña que el análisis exergético se hace sobre
# equipos que se compran, no solo sobre volúmenes de control de pizarra.
