curso: '2024-2025'
convocatoria: extraordinaria
fecha: febrero de 2025
# Bilingüe, con el euskera en las dos primeras páginas y el castellano en la
# tercera. Da **3 horas**, como febrero de 2022.
#
# Su ejercicio 1 es el que cierra el escalón de los dos caminos, porque **el
# propio examen los exige**: pide la exergía destruida «mediante una de las dos
# maneras mostradas durante el curso» y después «mediante la otra». No es un
# capricho del enunciado — en un depósito rígido y adiabático el balance de
# exergía se reduce término a término a Guy-Stodola, y pedir las dos es
# comprobar que el alumno lo ha visto.
#
# Y su ejercicio 2 es **el único del corpus construido sobre una hoja de
# características de un fabricante**: potencia nominal, potencia útil, caudal
# de aire y hasta el nivel sonoro de un generador de aire caliente comercial.
# Es la clase de ejercicio que enseña que el análisis exergético se hace sobre
# equipos que se compran, no solo sobre volúmenes de control de pizarra.
pdf: 2024-2025-ext.pdf

fuera:
  - n: 2
    motivo: >-
      Un generador de aire caliente comercial, con su tabla de datos técnicos:
      200 kW de potencia nominal, 184 kW de potencia útil y 16.500 m³/h de aire.
      La diferencia entre las dos potencias son las pérdidas, básicamente los
      gases de combustión expulsados a 70 °C; la zona de intercambio interior
      está a 400 °C y el aire entra a 11 °C. Pide la temperatura de salida del
      aire, la exergía destruida y el rendimiento exergético. **Sin transcribir
      todavía**: no falta material —el PDF trae su resolución oficial— sino el
      trabajo de escribirlo. Merece hacerse entero por lo que tiene de raro:
      **los datos salen de un catálogo, no de un enunciado inventado**.
  - n: 3
    motivo: >-
      Una tubería horizontal de 6 m, 10 cm de diámetro interior y 4 mm de
      espesor, con 0,15 kg/s de agua que entra a 80 °C y 1 bar. Se le pone 1 cm
      de aislante y con eso las pérdidas bajan a 1 kW, quedando la superficie
      exterior del aislante en contacto con aire a 15 °C. Pide **la velocidad
      del aire** y el coeficiente global de transmisión referido a la superficie
      exterior. **Sin transcribir todavía**, por lo mismo. Es la cuarta
      aparición del balance térmico usado al revés para deducir una condición
      del entorno.

ejercicios:
  - id: exter2425-ext-1-el-bloque-de-acero-y-el-agua-que-apenas-se-entera
    tema: t06-entropia
    n: 1
