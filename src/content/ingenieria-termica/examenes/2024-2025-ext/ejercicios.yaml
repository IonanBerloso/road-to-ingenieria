ejercicios:
  - id: exter2425-ext-1-el-bloque-de-acero-y-el-agua-que-apenas-se-entera
    titulo: El bloque de acero y el agua que apenas se entera, por los dos caminos
    fuente: Ejercicio 1 de la convocatoria extraordinaria de febrero de 2025 · Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen es bilingüe y publica su resolución oficial manuscrita, contra la que está contrastado el desarrollo.
    nivel: examen
    enunciado: |
      Se sumerge un bloque de acero de $5\ \text{kg}$ a $80\ ^\circ\text{C}$ en
      $20$ litros de agua. El depósito rígido que contiene ambos elementos es
      adiabático. Tras sumergir el bloque, se espera el tiempo suficiente hasta
      que se alcance el equilibrio. En dicho estado de equilibrio, la
      temperatura es de $25\ ^\circ\text{C}$. Calcúlese:

      a) La temperatura inicial del agua.

      b) La exergía destruida en el proceso, realizando el cálculo mediante una
      de las dos maneras mostradas durante el curso.

      c) La exergía destruida en el proceso, realizando el cálculo mediante la
      otra manera mostrada durante el curso.

      Nota: calor específico del acero $= 0{,}44\ \text{kJ/kg}\cdot\text{K}$;
      calor específico del agua $= 4{,}186\ \text{kJ/kg}\cdot\text{K}$;
      temperatura de referencia: $15\ ^\circ\text{C}$.
    pide: La temperatura inicial del agua y la exergía destruida, por los dos caminos.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado da la temperatura **final** y pide una **inicial**.
          ¿Qué ecuación lo permite?
        opciones:
          - texto: El balance de energía, que aquí se reduce a que la energía interna no cambia
            correcta: true
            mensaje: |
              Eso es. Depósito rígido —no hay trabajo— y adiabático —no hay
              calor—, así que $\Delta U = 0$: lo que pierde el acero lo gana el
              agua. Con la temperatura final conocida, la única incógnita es la
              inicial del agua.
          - texto: El balance de entropía, imponiendo que la generada sea cero
            mensaje: |
              Sería suponer el proceso reversible, y no lo es: los apartados b)
              y c) piden precisamente la exergía que se destruye. Si fuera cero
              no habría nada que calcular.
          - texto: Hay que suponer que el agua estaba a la temperatura ambiente
            mensaje: |
              No hace falta suponerlo, y sería inventar un dato: el balance de
              energía la determina. De hecho sale 23,55 °C, que no es ninguna
              temperatura redonda.
          - texto: La ecuación de estado del agua líquida
            mensaje: |
              El agua se trata como incompresible, así que su ecuación de
              estado no aporta nada aquí: no hay presiones ni volúmenes en
              juego, solo temperaturas y capacidades térmicas.

      - tipo: calcular
        titulo: La temperatura inicial del agua
        pregunta: |
          Con $20$ litros de agua y el bloque de $5\ \text{kg}$ que baja de
          $80$ a $25\ ^\circ\text{C}$, ¿a qué temperatura estaba el agua?
        respuesta:
          tipo: magnitud
          valor: '23.55 °C'
          tolerancia: 0.003
          formato: una temperatura, con su unidad
        distractores:
          - valor: '15 °C'
            mensaje: |
              Esa es la temperatura de referencia, que sirve para medir la
              exergía y no tiene por qué coincidir con la del agua. Aquí no
              coincide.
          - valor: '52.5 °C'
            mensaje: |
              Esa es la media de 80 y 25, y supondría que las dos masas pesan
              lo mismo térmicamente. No lo hacen: el agua tiene treinta y ocho
              veces más capacidad térmica que el acero.
        pista: |
          $\Delta U = 0$: $m_{ac}c_{ac}(T_2-T_{ac,1}) + m_a c_a (T_2 - T_{a,1}) = 0$.
        desarrollo: |
          $$
          \theta_{a,1} = \frac{(5 \cdot 0{,}44 + 20 \cdot 4{,}186)\cdot 25 - 5 \cdot 0{,}44 \cdot 80}
          {20 \cdot 4{,}186} = 23{,}55\ ^\circ\text{C}
          $$

      - tipo: calcular
        titulo: La entropía generada
        pregunta: |
          El acero pierde $0{,}3726\ \text{kJ/K}$ y el agua gana $0{,}407$.
          ¿Cuánta entropía se genera?
        respuesta:
          tipo: magnitud
          valor: '0.0344 kJ/K'
          tolerancia: 0.03
          formato: una entropía, con su unidad
        distractores:
          - valor: '0.7796 kJ/K'
            mensaje: |
              Has sumado los dos valores absolutos. El acero se enfría, así que
              su variación es **negativa** y entra en la suma con su signo.
          - valor: '0.407 kJ/K'
            mensaje: |
              Esa es solo la del agua. Falta restarle lo que pierde el acero.
        pista: |
          Adiabático significa $\int\delta Q/T = 0$, así que
          $S_G = \Delta S_{total}$.
        desarrollo: |
          $$
          S_G = -0{,}3726 + 0{,}407 = 0{,}0344\ \text{kJ/K}
          $$

      - tipo: calcular
        titulo: La exergía destruida
        pregunta: |
          Con la referencia a $15\ ^\circ\text{C}$, ¿cuánta exergía se
          destruye?
        respuesta:
          tipo: magnitud
          valor: '9.91 kJ'
          tolerancia: 0.02
          formato: una energía, con su unidad
        distractores:
          - valor: '121 kJ'
            mensaje: |
              Esos son los kilojulios de **energía** que el acero le pasa al
              agua. No se destruyen: siguen ahí. Lo que se destruye es una
              parte mucho menor de su calidad.
          - valor: '10.25 kJ'
            mensaje: |
              Has multiplicado por los 298 K del equilibrio en vez de por los
              288 de la referencia. El factor de Guy-Stodola es siempre el del
              estado muerto.
        pista: |
          $B_D = T_0 S_G$, con $T_0 = 288\ \text{K}$.
        desarrollo: |
          $$
          B_D = 288 \cdot 0{,}0344 = 9{,}91\ \text{kJ}
          $$

      - tipo: justificar
        pregunta: Ordena por qué los dos caminos dan lo mismo. Una pieza es falsa.
        piezas:
          - texto: 'El balance de exergía de un sistema cerrado dice $\Delta B = \Delta U - T_0\Delta S + P_0\Delta V - B_D$.'
          - texto: 'Aquí el depósito es rígido y adiabático, así que $\Delta U = 0$ y $\Delta V = 0$, y solo queda $B_D = T_0\Delta S$ — que es literalmente Guy-Stodola.'
          - texto: 'Coinciden por casualidad, porque las temperaturas iniciales estaban muy próximas.'
            trampa: true
            mensaje: |
              No es casualidad ni depende de los datos: **son la misma
              ecuación**. En este sistema el balance de exergía se reduce
              término a término a Guy-Stodola, así que darían lo mismo con
              cualquier número. Que el examen pida las dos maneras es para
              comprobar que has entendido eso, no para que hagas dos cuentas
              distintas.
    resolucion: |
      **a) El balance de energía, leído al revés.** El depósito es rígido —sin
      trabajo— y adiabático —sin calor—, así que $\Delta U = 0$: lo que pierde
      el acero lo gana el agua. Con la temperatura final conocida, la incógnita
      es la inicial del agua:

      $$
      \theta_{a,1} = \frac{(5 \cdot 0{,}44 + 20 \cdot 4{,}186)\cdot 25 - 5 \cdot 0{,}44 \cdot 80}
      {20 \cdot 4{,}186} = 23{,}55\ ^\circ\text{C}
      $$

      **Fíjate en lo poco que se ha movido el agua.** El acero cae 55 grados y
      el agua sube **1,45**. Es la proporción de capacidades térmicas:
      $20 \cdot 4{,}186 = 83{,}7$ frente a $5 \cdot 0{,}44 = 2{,}2$, o sea
      treinta y ocho veces más. Por eso un bloque de metal al rojo apenas
      calienta un cubo de agua, y por eso el agua es el refrigerante de casi
      todo.

      **b) y c) Las dos maneras, y por qué son la misma.** El examen pide
      resolverlo «de una de las dos maneras mostradas durante el curso» y
      después «de la otra». Son Guy-Stodola y el balance de exergía del sistema
      cerrado:

      $$
      S_G = 5 \cdot 0{,}44\ln\frac{298}{353} + 20 \cdot 4{,}186\ln\frac{298}{296{,}55}
      = -0{,}3726 + 0{,}407 = 0{,}0344\ \text{kJ/K}
      $$

      $$
      B_D = T_0 S_G = 288 \cdot 0{,}0344 = 9{,}91\ \text{kJ}
      $$

      Y por el balance de exergía:
      $\Delta B = \Delta U - T_0\Delta S + P_0\Delta V - B_D$. Con el depósito
      rígido y adiabático, $\Delta U = 0$ y $\Delta V = 0$, así que la
      expresión se reduce **término a término** a $B_D = T_0\Delta S$. No es
      que coincidan con estos números: es que son la misma ecuación escrita de
      dos formas. Que el examen pida las dos es para comprobar que lo has visto.

      **Y la lectura final.** El acero le pasa al agua $121\ \text{kJ}$ de
      energía y no se pierde ni uno: siguen ahí, repartidos. Lo que desaparece
      son **9,91 kJ de exergía**, un 8 % de lo que se movió. Poco, y tiene
      sentido: las dos temperaturas de partida estaban relativamente cerca del
      ambiente, así que había poca calidad que estropear. Mete el mismo bloque
      a 800 grados y la cifra se dispara sin que cambie nada del método.
