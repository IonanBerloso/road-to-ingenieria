ejercicios:
  - id: exter1920-ext-1-cinco-signos-y-los-cinco-negativos
    titulo: Cinco signos, y los cinco salen negativos
    fuente: Ejercicio 1 de la convocatoria extraordinaria de 2019-2020, celebrada en febrero de 2020 · Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El PDF trae la resolución manuscrita del profesor; el desarrollo se hizo a ciegas desde el enunciado y se contrastó después contra ella.
    nivel: examen
    enunciado: |
      Durante un proceso de exponente politrópico igual a $-4$, una masa de
      $2\ \text{kg}$ de gas butano ($\text{C}_4\text{H}_{10}$; $\gamma = 1{,}1$;
      $c_p = 1{,}577\ \text{kJ/kg}\cdot\text{K}$;
      $c_v = 1{,}433\ \text{kJ/kg}\cdot\text{K}$) sufre un cambio de temperatura
      desde $50\ ^\circ\text{C}$ hasta $20\ ^\circ\text{C}$. Dedúzcase, por
      cálculo, el signo de las variaciones de presión, volumen específico,
      entropía y el signo del intercambio de calor y trabajo, si los hubiere.
    pide: El signo de cinco magnitudes, sin que ninguna respuesta sea un número.
    pasos:
      - tipo: reconocer
        pregunta: |
          Un exponente **negativo**, $n = -4$. En $Pv^{n} = \text{cte}$, ¿qué
          significa eso para la forma de la curva?
        opciones:
          - texto: Que la presión y el volumen específico se mueven en el mismo sentido
            correcta: true
            mensaje: |
              Eso es. Con $n$ negativo, $Pv^{-4} = \text{cte}$ se puede
              escribir $P = C\,v^{4}$: la presión **crece** con el volumen. Es
              lo contrario de todos los casos de clase, donde comprimir sube la
              presión.
          - texto: Que la curva es la misma que con $n = 4$, pero recorrida al revés
            mensaje: |
              No: el signo del exponente cambia la **forma**, no el sentido del
              recorrido. Con $n=4$ la curva baja; con $n=-4$ sube. Son dos
              familias distintas de curvas en el mismo diagrama.
          - texto: Que el proceso no puede existir, porque el exponente sale de una raíz
            mensaje: |
              Existe perfectamente: $n$ es un exponente cualquiera, y la
              familia politrópica cubre desde $-\infty$ hasta $+\infty$. Los
              cuatro casos de clase —isóbaro, isotermo, adiabático, isócoro—
              son solo cuatro valores concretos de esa recta.
          - texto: Que hay que usar el valor absoluto en las relaciones politrópicas
            mensaje: |
              Nunca. Las relaciones valen con el signo tal cual, y de hecho es
              el signo el que produce todo lo raro de este ejercicio. Cambiarlo
              a mano sería resolver otro problema.

      - tipo: calcular
        titulo: El volumen específico
        pregunta: |
          El gas se enfría de 50 a 20 °C. ¿Cuánto vale $v_2/v_1$?
        respuesta:
          tipo: numero
          valor: '0.9807'
          tolerancia: 0.002
          formato: un número, sin unidad — el cociente de los dos volúmenes
        distractores:
          - valor: '1.0197'
            mensaje: |
              Eso es $v_1/v_2$: has invertido el cociente. Ojo con el exponente
              de la relación, $T_2/T_1 = (v_1/v_2)^{n-1}$, que ya viene con las
              dos primas cambiadas de sitio respecto de lo que uno espera.
          - valor: '0.7385'
            mensaje: |
              Has usado $n$ en vez de $n-1$ en el exponente. Con $n = -4$ la
              diferencia entre 4 y 5 en un exponente es enorme.
        pista: |
          $\dfrac{T_2}{T_1} = \left(\dfrac{v_1}{v_2}\right)^{n-1}$, con
          $n - 1 = -5$.
        desarrollo: |
          $$
          \frac{v_2}{v_1} = \left(\frac{T_1}{T_2}\right)^{\frac{1}{n-1}}
          = \left(\frac{323}{293}\right)^{\frac{1}{-5}} = 0{,}9807
          $$

          El volumen **disminuye**. Y como $P$ va con $v$, la presión
          disminuye también: $P_2/P_1 = 0{,}925$.

      - tipo: calcular
        titulo: El calor específico politrópico
        pregunta: |
          Con $\gamma = 1{,}1$ y $c_v = 1{,}433$, ¿cuánto vale $c_n$?
        respuesta:
          tipo: magnitud
          valor: '1.4617 kJ/(kg K)'
          tolerancia: 0.02
          formato: un calor específico, con su unidad
        distractores:
          - valor: '-1.4617 kJ/(kg K)'
            mensaje: |
              El signo es al revés. En $c_n = c_v\dfrac{n-\gamma}{n-1}$ los dos
              paréntesis son negativos con $n=-4$, así que el cociente es
              **positivo**. Un $c_n$ negativo existe —pasa cuando $n$ está
              entre 1 y $\gamma$— pero no es este caso.
          - valor: '1.4049 kJ/(kg K)'
            mensaje: |
              Has invertido la fracción: $\dfrac{n-1}{n-\gamma}$ en vez de
              $\dfrac{n-\gamma}{n-1}$. Con estos números los dos salen cerca de
              1, así que el resultado parece razonable — y por eso conviene
              recordar de dónde viene: el $\gamma$ va arriba porque $c_n$ tiene
              que valer **cero** cuando $n=\gamma$, que es el caso adiabático.
        pista: |
          $c_n = c_v\,\dfrac{n-\gamma}{n-1}$.
        desarrollo: |
          $$
          c_n = 1{,}433 \cdot \frac{-4-1{,}1}{-4-1} = 1{,}433 \cdot 1{,}02
          = 1{,}4617\ \text{kJ/kg}\cdot\text{K}
          $$

          Positivo, y además **entre $c_v$ y $c_p$**.

      - tipo: calcular
        titulo: El calor intercambiado
        pregunta: |
          Con ese $c_n$ y los 2 kg de butano, ¿cuánto calor se intercambia?
        respuesta:
          tipo: magnitud
          valor: '-87.7 kJ'
          tolerancia: 0.02
          formato: un calor, con su unidad y con su signo
        distractores:
          - valor: '-43.85 kJ'
            mensaje: |
              Te has dejado la masa. El calor específico va por kilogramo y
              aquí hay **dos**; esto es el calor por unidad de masa, no el del
              sistema.
          - valor: '-94.62 kJ'
            mensaje: |
              Has usado $c_p$. El sistema es cerrado y el proceso no es
              isóbaro: de los tres calores específicos, el que toca es $c_n$.
        pista: |
          $Q = m\,c_n\,(\theta_2-\theta_1)$.
        desarrollo: |
          $$
          Q = 2 \cdot 1{,}4617 \cdot (20-50) = -87{,}7\ \text{kJ}
          $$

          Negativo: el gas **cede** calor.

          Y conviene comparar con lo que habría dado $c_v$, que es el error
          más fino de este paso: $2\cdot 1{,}433\cdot(-30) = -85{,}98$, que no
          es el calor sino la variación de **energía interna**. Se parecen
          tanto —un 2 %— porque el trabajo es minúsculo, y esa cercanía es
          justo lo que hace que el fallo pase desapercibido.

      - tipo: justificar
        pregunta: Ordena la conclusión sobre los cinco signos. Una pieza es falsa.
        piezas:
          - texto: 'La temperatura baja, y con $n<0$ la presión y el volumen bajan con ella: $\Delta P<0$ y $\Delta v<0$.'
          - texto: 'El volumen disminuye, así que el gas **recibe** trabajo: $W = m R\dfrac{T_2-T_1}{1-n} = -1{,}72$ kJ.'
          - texto: 'Y la entropía baja, $\Delta S = -0{,}285$ kJ/K, lo cual obliga a que la entropía generada sea negativa.'
            trampa: true
            mensaje: |
              Aquí está la trampa del ejercicio, y es la que más cuesta. Que la
              entropía **del sistema** baje no dice nada sobre la generada: el
              gas cede 87,7 kJ de calor, y con el calor **se lleva entropía**.
              La generada sigue siendo mayor o igual que cero, como en todo
              proceso. Confundir $\Delta S$ con $S_G$ es el error que este
              enunciado busca.
    resolucion: |
      **Lo que hay que ver antes de calcular: qué significa un exponente
      negativo.** En $Pv^{n} = \text{cte}$ con $n = -4$, la relación se puede
      escribir $P = C\,v^{4}$. La presión **crece con el volumen**, que es lo
      contrario de todo lo que uno tiene en la cabeza. Los cuatro casos de
      clase —isóbaro $n=0$, isotermo $n=1$, adiabático $n=\gamma$, isócoro
      $n=\infty$— viven todos en la zona positiva, y por eso la intuición que
      dan no sirve aquí.

      **El volumen.** De la relación entre temperaturas y volúmenes:

      $$
      \frac{v_2}{v_1} = \left(\frac{T_1}{T_2}\right)^{\frac{1}{n-1}}
      = \left(\frac{323}{293}\right)^{-\frac{1}{5}} = 0{,}9807
      $$

      **Disminuye.** Y con él la presión, porque van juntos:
      $P_2/P_1 = 0{,}925$, que la ecuación de estado confirma —
      $0{,}925 \cdot 0{,}9807 = 0{,}907 = T_2/T_1$.

      **El calor específico politrópico**, que es el que manda en el calor:

      $$
      c_n = c_v\,\frac{n-\gamma}{n-1} = 1{,}433\cdot\frac{-4-1{,}1}{-4-1}
      = 1{,}4617\ \text{kJ/kg}\cdot\text{K}
      $$

      Los dos paréntesis son negativos, así que $c_n$ sale **positivo**, y
      además cae entre $c_v$ y $c_p$. Con él:

      $$
      Q = m\,c_n\,(\theta_2-\theta_1) = 2 \cdot 1{,}4617 \cdot (-30) = -87{,}7\ \text{kJ}
      $$

      **El trabajo.**

      $$
      W = m\,R'\,\frac{T_2-T_1}{1-n} = 2 \cdot 0{,}143 \cdot \frac{-30}{5}
      = -1{,}72\ \text{kJ}
      $$

      Negativo: el gas **recibe** trabajo, coherente con que el volumen baje.
      Y fíjate en el tamaño — 1,72 frente a los 87,7 de calor. Casi todo lo que
      pasa aquí es calor.

      **La entropía.**

      $$
      \Delta S = m\,c_n\ln\frac{T_2}{T_1} = 2 \cdot 1{,}4617 \cdot \ln\frac{293}{323}
      = -0{,}285\ \text{kJ/K}
      $$

      **Los cinco signos son negativos.** $\Delta P$, $\Delta v$, $\Delta S$,
      $Q$ y $W$. No es casualidad ni es un truco del enunciado: es lo que pasa
      cuando un gas con exponente negativo se enfría.

      **Y la trampa, que es lo que este ejercicio puntúa de verdad.** Que
      $\Delta S$ sea negativa no significa que se haya violado el segundo
      principio ni que la entropía generada sea negativa. El sistema cede
      87,7 kJ de calor, y el calor **se lleva entropía consigo**. La entropía
      del sistema puede bajar todo lo que quiera mientras la del universo no
      baje. Confundir «la entropía del sistema baja» con «la entropía generada
      es negativa» es el error que este enunciado está cazando, y cae también
      en enero de 2023 con un exponente del otro extremo.

      > **Una errata de la resolución oficial.** Escribe $m = 4$ en tres sitios
      > —en la entropía, en el trabajo y en el calor— cuando el enunciado dice
      > **2 kg**. Sus tres resultados —$-0{,}285$, $-1{,}72$ y $-87{,}73$— están
      > calculados con 2 y son los buenos; lo que está mal es el 4 escrito. Si
      > rehaces las cuentas con lo impreso te salen exactamente el doble de
      > cada una.

  - id: exter1920-ext-3-las-dos-caras-de-la-misma-placa
    titulo: Las dos caras de la misma placa, y el intercambiador que regala el calor al aire
    fuente: Ejercicio 3 de la convocatoria extraordinaria de 2019-2020, celebrada en febrero de 2020 · Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El PDF trae la resolución manuscrita del profesor; el desarrollo se hizo a ciegas desde el enunciado y se contrastó después contra ella. Las dos figuras del cuadernillo no se reproducen y se describen con palabras, porque la disposición queda determinada del todo.
    nivel: examen
    enunciado: |
      Un intercambiador de calor de forma rectangular, con una sección de
      $4\times 6\ \text{m}$ en dirección perpendicular al flujo de calor, tiene
      su lado superior en contacto con aire a $18\ ^\circ\text{C}$, y su lado
      inferior en contacto con aire a $23\ ^\circ\text{C}$, según la figura
      adjunta. Por dentro del intercambiador, circulan dos corrientes de agua.
      La corriente caliente está del lado inferior (en contacto con el aire a
      $23\ ^\circ\text{C}$) y el agua entra a $40\ ^\circ\text{C}$ y sale a
      $39\ ^\circ\text{C}$, mientras que la corriente fría se encuentra del lado
      superior (en contacto con el aire a $18\ ^\circ\text{C}$), entrando el
      agua a $20\ ^\circ\text{C}$ y saliendo a $25\ ^\circ\text{C}$. El calor
      que se transfiere de la corriente caliente a la fría dentro del
      intercambiador, es el doble del que se transfiere desde la parte superior
      del intercambiador de calor hacia el aire que se encuentra a
      $18\ ^\circ\text{C}$. Calcúlese el gasto de cada corriente de agua.

      *Las dos figuras del cuadernillo muestran una placa de 6 m de largo y
      4 m de ancho con dos capas de agua superpuestas: la fría arriba, bajo el
      aire a 18 °C, y la caliente abajo, sobre el aire a 23 °C, corriendo en
      sentidos opuestos. La resolución toma cada cara a la temperatura media de
      la corriente que la toca —22,5 °C arriba y 39,5 °C abajo— y las
      propiedades del aire del anexo a cada temperatura de película: a
      20,25 °C, $k = 0{,}02516$, $\mu = 1{,}8262\cdot 10^{-5}$,
      $\rho = 1{,}203$ y $Pr = 0{,}7308$; a 31,25 °C, $k = 0{,}02597$,
      $\mu = 1{,}8778\cdot 10^{-5}$, $\rho = 1{,}1593$ y $Pr = 0{,}7279$. Para
      el agua, $c = 4182\ \text{J/kg}\cdot\text{K}$.*
    pide: El gasto de las dos corrientes de agua.
    pasos:
      - tipo: reconocer
        pregunta: |
          Las dos caras de la placa son horizontales y las dos pierden calor
          hacia el aire. ¿Qué tienen de distinto para la convección?
        opciones:
          - texto: La orientación — arriba la cara caliente mira hacia arriba, y abajo mira hacia abajo
            correcta: true
            mensaje: |
              Eso es, y lo cambia todo. Encima de la cara de arriba, el aire
              que se calienta sube y deja sitio al frío: convecciona bien. Bajo
              la cara de abajo, el aire calentado queda **atrapado** contra la
              placa y apenas se renueva: convecciona mal. Son dos correlaciones
              distintas.
          - texto: Nada, las dos son placas horizontales y llevan la misma correlación
            mensaje: |
              En convección natural la orientación es media correlación. Una
              placa caliente mirando hacia abajo convecciona mucho peor que
              mirando hacia arriba, y el anexo trae una correlación para cada
              caso.
          - texto: La de abajo convecciona mejor, porque su salto de temperatura es mayor
            mensaje: |
              Su salto sí es mayor, casi cuatro veces, y aun así su coeficiente
              sale **menor**: 1,31 frente a 2,95 W/m²K. El salto pesa en el
              Rayleigh, pero la orientación pesa más.
          - texto: Solo cambia la temperatura del aire, y eso se arregla con las propiedades
            mensaje: |
              Las propiedades cambian, sí, pero lo que decide es la geometría
              del flujo: hacia dónde puede escapar el aire que se calienta. Eso
              no está en ninguna propiedad, está en la correlación.

      - tipo: calcular
        titulo: El coeficiente de la cara de arriba
        pregunta: |
          Arriba, $Ra = 8{,}241\cdot 10^{8}$, en la zona de
          $Nu = 0{,}15\,Ra^{1/3}$. Con $L = A/P = 1{,}2\ \text{m}$, ¿cuánto vale
          $h$?
        respuesta:
          tipo: magnitud
          valor: '2.949 W/(m^2 K)'
          tolerancia: 0.02
          formato: un coeficiente de convección, con su unidad
        distractores:
          - valor: '0.959 W/(m^2 K)'
            mensaje: |
              Has usado la correlación de la cara caliente mirando **hacia
              abajo**, $0{,}27\,Ra^{1/4}$. Esa es la de la otra cara. Arriba el
              aire caliente sube libre, y la correlación es la de exponente
              $1/3$.
          - valor: '140.6 W/(m^2 K)'
            mensaje: |
              Ese es el **Nusselt**, adimensional. Falta $h = Nu\,k/L$.
        pista: |
          $Nu = 0{,}15\,Ra^{1/3}$ y $h = Nu\,k/L$.
        desarrollo: |
          $$
          Nu = 0{,}15\,(8{,}241\cdot 10^{8})^{1/3} = 140{,}63
          \qquad
          h_{sup} = \frac{140{,}63\cdot 0{,}02516}{1{,}2} = 2{,}949\ \text{W/m}^{2}\text{K}
          $$

          Y el calor que sale por arriba:
          $\dot{Q}_{sup} = 2{,}949\cdot 24\cdot(22{,}5-18) = 318{,}4\ \text{W}$.

      - tipo: calcular
        titulo: El gasto de la corriente fría
        pregunta: |
          La fría recibe de la caliente el doble de lo que pierde por arriba, y
          pierde $318{,}4\ \text{W}$ por arriba. ¿Qué gasto lleva?
        respuesta:
          tipo: magnitud
          valor: '0.0152 kg/s'
          tolerancia: 0.02
          formato: un gasto másico, con su unidad
        distractores:
          - valor: '0.0305 kg/s'
            mensaje: |
              Has usado todo lo que le llega de la caliente, $2\dot{Q}_{sup}$,
              y te has olvidado de lo que se le escapa por arriba. Lo que la
              calienta es la **diferencia**: $2\dot{Q}_{sup}-\dot{Q}_{sup}$.
          - valor: '0.0761 kg/s'
            mensaje: |
              Has usado un salto de un grado, que es el de la corriente
              **caliente**. La fría sube de 20 a 25: cinco grados.
        pista: |
          Balance de la fría: $2\dot{Q}_{sup} - \dot{Q}_{sup} = \dot{m}_F\,c\,(25-20)$.
        desarrollo: |
          $$
          \dot{m}_F = \frac{318{,}4}{4182\cdot 5} = 0{,}0152\ \text{kg/s}
          $$

      - tipo: calcular
        titulo: El gasto de la corriente caliente
        pregunta: |
          Por abajo se pierden $519{,}9\ \text{W}$. La caliente paga eso y lo
          que le da a la fría. ¿Qué gasto lleva?
        respuesta:
          tipo: magnitud
          valor: '0.2766 kg/s'
          tolerancia: 0.02
          formato: un gasto másico, con su unidad
        distractores:
          - valor: '0.1523 kg/s'
            mensaje: |
              Te has dejado lo que se pierde **por abajo**. La corriente
              caliente toca el aire a 23 °C y le cede 519,9 W, además de lo que
              le da a la fría.
          - valor: '0.0553 kg/s'
            mensaje: |
              Has usado cinco grados de salto, que son los de la fría. La
              caliente solo baja **uno**, de 40 a 39, y por eso necesita tanto
              gasto.
        pista: |
          Balance de la caliente: $\dot{Q}_{inf} + 2\dot{Q}_{sup} = \dot{m}_C\,c\,(40-39)$.
        desarrollo: |
          $$
          \dot{m}_C = \frac{519{,}9 + 2\cdot 318{,}4}{4182\cdot 1} = 0{,}2766\ \text{kg/s}
          $$

      - tipo: justificar
        pregunta: Ordena lo que dicen las dos caras. Una pieza es falsa.
        piezas:
          - texto: 'La cara de abajo convecciona peor —1,31 frente a 2,95 W/m²K— aunque su salto de temperatura sea casi cuatro veces mayor: con la cara caliente mirando hacia abajo, el aire calentado queda atrapado.'
          - texto: 'Como intercambiador es malísimo: de los 1.157 W que suelta la corriente caliente, la fría se queda 318; el 72 % acaba en los dos aires.'
          - texto: 'Como el aire de abajo está más caliente que el de arriba, por la cara de abajo se pierde menos calor.'
            trampa: true
            mensaje: |
              Se pierde **más**: 519,9 W abajo frente a 318,4 arriba. El aire
              de abajo está más caliente, pero la placa también —39,5 °C contra
              22,5—, así que su salto es de 16,5 grados y el de arriba de 4,5.
              Ese salto compensa de sobra el peor coeficiente. Lo que decide es
              la diferencia entre la placa y su aire, no la temperatura del
              aire sola.
    resolucion: |
      **Lo primero es ver que la misma placa tiene dos convecciones
      distintas.** Las dos caras son horizontales y las dos están más calientes
      que su aire, pero no son el mismo caso: arriba la cara caliente mira
      **hacia arriba** —el aire calentado sube libre—, y abajo mira **hacia
      abajo** —el aire calentado queda atrapado contra la placa—. Cada una
      lleva su correlación.

      Las dos comparten la longitud característica, $L = A/P = 24/20 = 1{,}2$ m,
      y la resolución toma cada cara a la temperatura media de la corriente que
      la toca: 22,5 °C arriba y 39,5 °C abajo.

      **Arriba, cara caliente hacia arriba:**

      $$
      Gr = \frac{9{,}8\cdot\frac{1}{293{,}25}\cdot 4{,}5\cdot 1{,}2^{3}\cdot 1{,}203^{2}}{(1{,}8262\cdot 10^{-5})^{2}}
      = 1{,}128\cdot 10^{9}
      \;\Longrightarrow\; Ra = 8{,}241\cdot 10^{8}
      $$

      $$
      Nu = 0{,}15\,Ra^{1/3} = 140{,}63
      \qquad h_{sup} = 2{,}949\ \text{W/m}^{2}\text{K}
      \qquad \dot{Q}_{sup} = 2{,}949\cdot 24\cdot 4{,}5 = 318{,}4\ \text{W}
      $$

      **Abajo, cara caliente hacia abajo:**

      $$
      Gr = \frac{9{,}8\cdot\frac{1}{304{,}25}\cdot 16{,}5\cdot 1{,}2^{3}\cdot 1{,}1593^{2}}{(1{,}8778\cdot 10^{-5})^{2}}
      = 3{,}500\cdot 10^{9}
      \;\Longrightarrow\; Ra = 2{,}548\cdot 10^{9}
      $$

      $$
      Nu = 0{,}27\,Ra^{1/4} = 60{,}66
      \qquad h_{inf} = 1{,}313\ \text{W/m}^{2}\text{K}
      \qquad \dot{Q}_{inf} = 1{,}313\cdot 24\cdot 16{,}5 = 519{,}9\ \text{W}
      $$

      **Los dos balances.** El dato que cierra el problema es que la caliente
      le da a la fría el doble de lo que la fría pierde por arriba. La fría se
      queda con la diferencia; la caliente paga lo que da y lo que pierde por
      abajo:

      $$
      \dot{m}_F = \frac{2\dot{Q}_{sup}-\dot{Q}_{sup}}{c\,(25-20)} = \frac{318{,}4}{4182\cdot 5}
      = 0{,}0152\ \text{kg/s}
      $$

      $$
      \dot{m}_C = \frac{\dot{Q}_{inf}+2\dot{Q}_{sup}}{c\,(40-39)} = \frac{519{,}9+636{,}9}{4182}
      = 0{,}2766\ \text{kg/s}
      $$

      **Las dos lecturas que se lleva uno.**

      La orientación manda más que el salto. La cara de abajo tiene un Rayleigh
      tres veces mayor y un salto casi cuatro veces mayor, y aun así su
      coeficiente sale **2,2 veces menor**. Es el techo radiante del que habla
      el ejercicio del suelo radiante, ahora con números: una superficie
      caliente mirando hacia abajo es una mala estufa.

      Y como intercambiador, el aparato es un desastre. De los 1.157 W que
      suelta la corriente caliente, 520 se van por abajo y 318 por arriba: **la
      fría solo conserva el 27,5 %**. Un intercambiador sin aislar que tiene
      aire por las dos caras regala la mayor parte del calor al ambiente — y
      por eso los de verdad van aislados.
