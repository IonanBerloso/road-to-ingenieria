convocatoria: extraordinaria
curso: '2019-2020'
fecha: febrero de 2020
# Bilingüe, con el castellano en la primera página y el euskera en la segunda.
# Las dieciséis restantes son la resolución del profesor. Da **2,5 horas** y
# cada ejercicio vale un tercio.
#
# Es la **segunda** convocatoria de Térmica cuyo enunciado trae una figura —la
# otra es enero de 2018—, y aquí son dos: un esquema en planta del
# intercambiador del ejercicio 3 y un dibujo en perspectiva del mismo aparato.
# Conviene recordar cómo se resolvió aquello, porque vale igual aquí: la figura
# no se reprodujo, **se describió con palabras** dentro del enunciado, y bastó
# porque la disposición queda determinada del todo.
#
# Su ejercicio 1 es el que entra, y es **el gemelo del ejercicio 1 de enero de
# 2023 en la otra esquina de la familia politrópica**: aquel pide los signos
# con $n = 3{,}5$, este con $n = -4$. Los dos enseñan lo mismo y por caminos
# opuestos, y por eso los dos merecen estar: la trampa —confundir que la
# entropía del sistema baje con que la generada sea negativa— se cae mucho más
# fácil cuando **los cinco signos salen negativos a la vez**, que es lo que
# pasa aquí.
pdf: 2019-2020-ext.pdf

fuera:
  - n: 2
    motivo: >-
      Una bola de acero de 5 cm de radio a 90 °C sumergida en 20 litros de agua
      a 20 °C dentro de un recipiente adiabático, que pide la exergía destruida
      y el rendimiento exergético. **No se transcribe, y aquí el motivo no es
      que falte trabajo: es que ya está cubierto.** Es el molde que más se
      repite de toda la asignatura —sale también en enero y en febrero de
      2025— y el corpus tiene dos ejercicios sobre él, el ejemplo de entrada de
      las dos masas de agua y el de enero de 2025 con los números de examen.
      Escribir un tercero duplicaría contenido sin enseñar nada nuevo. Se
      declara aquí para que quien abra esta convocatoria sepa que el ejercicio
      existe y dónde practicarlo.
  - n: 3
    motivo: >-
      Un intercambiador rectangular de 4×6 m con **dos aires a distinta
      temperatura**, 18 °C por arriba y 23 °C por abajo, y dos corrientes de
      agua por dentro en contracorriente: la caliente de 40 a 39 °C pegada al
      aire caliente, la fría de 20 a 25 °C pegada al frío. El dato que lo cierra
      es una relación entre flujos —«el calor de la caliente a la fría es el
      doble del que sale hacia el aire de 18 °C»— y pide los dos gastos.
      **Sin transcribir todavía**, y de los tres es el que más cuesta. La
      figura no es el problema —se describe con palabras, como se hizo con la
      de enero de 2018—; lo caro es que hay que sacar del anexo las propiedades
      del aire para **dos correlaciones de convección natural sobre placa
      horizontal a la vez**, una con la cara caliente hacia arriba y otra hacia
      abajo, que es la única pareja así del corpus. Cuando se escriba, conviene
      que sea por eso.

ejercicios:
  # Ejercicio 1 · butano con exponente politrópico -4, y los cinco signos
