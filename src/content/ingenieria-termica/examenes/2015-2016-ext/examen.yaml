asignatura: ingenieria-termica
convocatoria: extraordinaria
curso: '2015-2016'
fecha: 16 de junio de 2016
# Bilingüe, con el castellano en la primera página y el euskera en la segunda.
# Da **3,5 horas**, el examen más largo del corpus, y cada ejercicio vale un
# tercio.
#
# **La última convocatoria que faltaba por montar de las transcribibles**, y la
# segunda que examina material fuera del temario de hoy: su ejercicio 2 son los
# ciclos Otto y Diesel, que salieron del programa igual que la turbina de gas de
# enero de 2016 y no vuelven a caer en las diecisiete convocatorias
# posteriores.
#
# Su ejercicio 1 merece una nota aparte aunque no se transcriba, porque su
# apartado b) es de los mejores del material entero: primero se resuelve el
# compresor **con los datos que dan** —una politrópica de exponente 1,2— y
# después el enunciado dice que lo que se ha medido de verdad es otra cosa, y
# pregunta si con esas mediciones hay entropía generada. Es el ejercicio que
# enseña la diferencia entre lo que un modelo predice y lo que una máquina
# hace.
#
# Y el que entra es el termopar, que enseña a desconfiar de una medida.
pdf: 2015-2016-ext.pdf

fuera:
  - n: 1
    motivo: >-
      Aire que entra a un compresor a 290 K y 98 kPa y se comprime hasta
      670 kPa por una politrópica de exponente 1,2: pide el trabajo, el calor y
      la variación de entropía por unidad de masa. Y después, en el apartado b),
      **cambia las reglas**: se mide la temperatura de salida y son 420 K, se
      mide el trabajo consumido y son 220 kJ/kg, y la superficie del compresor
      está a 345 K — «dígase si según estas mediciones hay entropía generada y
      cuánta». **Sin transcribir todavía**: no falta material —el PDF trae su
      resolución oficial— sino el trabajo de escribirlo. Merece hacerse por ese
      apartado b), que no tiene equivalente: es el único del corpus donde el
      enunciado enfrenta **el modelo con la medida** y pregunta cuál de las dos
      manda.
  - n: 2
    motivo: >-
      Un ciclo Otto de relación de compresión 9 y un ciclo Diesel de relación
      20, los dos con la misma temperatura máxima de 2250 K y las mismas
      condiciones de admisión, de los que se piden el trabajo neto, el
      rendimiento y —del Diesel— la relación de corte. **No se transcribe, y el
      motivo es de temario, no de trabajo**: los ciclos de potencia salieron del
      programa de la asignatura y ninguna convocatoria posterior a 2016 los
      pide. Es la misma razón por la que queda fuera la turbina de gas de enero
      de 2016.

ejercicios:
  # Ejercicio 3 · el termopar que radia hacia unas paredes frías. Dos alumnos,
