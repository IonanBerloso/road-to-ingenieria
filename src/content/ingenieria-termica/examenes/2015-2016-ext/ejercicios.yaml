ejercicios:
  - id: exter1516-ext-3-el-termopar-que-no-mide-lo-que-cree
    titulo: El termopar que no mide lo que cree, y el escudo que lo arregla
    fuente: Ejercicio 3 de la convocatoria extraordinaria de 2015-2016, celebrada el 16 de junio de 2016 · Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El PDF trae la resolución manuscrita del profesor; el desarrollo se hizo a ciegas desde el enunciado y se contrastó después contra ella. Su figura no se reproduce —es del cuadernillo— y se describe con palabras, porque la disposición queda determinada del todo.
    nivel: examen
    enunciado: |
      Se desea medir la temperatura de un gas que fluye por un conducto largo
      cuyas paredes están a $500\ \text{K}$. Para ello, se encarga a dos
      estudiantes de ingeniería que utilicen un termopar soldado a tope (ver
      figura) con una emisividad de $0{,}8$. Uno de los alumnos inserta
      directamente el termopar en la tubería y la lectura indicada por el
      termopar es de $600\ \text{K}$. El otro alumno protege el termopar con un
      delgado escudo cilíndrico contra la radiación que se encuentra a
      $610\ \text{K}$ y cuyo diámetro interno es considerablemente mayor que el
      diámetro del termopar. En este caso, la lectura del termopar indica
      $619\ \text{K}$. Si el coeficiente de transferencia de calor por
      convección entre la superficie del termopar y el gas es de
      $142\ \text{W/m}^{2}\text{K}$, calcúlese:

      a) el error en la lectura del estudiante que no protege el termopar

      b) el error en la lectura del estudiante que protege el termopar

      *La figura del cuadernillo son dos dibujos del mismo conducto visto por
      fuera: en el primero el termopar entra por la pared y su punta queda
      desnuda dentro de la corriente; en el segundo, la punta va rodeada por un
      cilindro corto y abierto por los dos extremos, que la tapa de las paredes
      sin estorbar el paso del gas.*
    pide: Cuánto se equivoca cada uno de los dos alumnos.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué el termopar no marca la temperatura del gas?
        opciones:
          - texto: Porque además de tocar el gas, radia hacia unas paredes más frías, y se queda en el equilibrio entre las dos cosas
            correcta: true
            mensaje: |
              Eso es. La punta del termopar recibe calor del gas por convección
              y lo pierde por radiación hacia las paredes de 500 K. Se
              estabiliza donde las dos se igualan, y ese punto está **por
              debajo** de la temperatura del gas. El termopar no miente: mide
              su propia temperatura, que no es la que queremos.
          - texto: Porque el termopar tiene un error de fabricación que hay que calibrar
            mensaje: |
              No hay ningún defecto: un termopar perfecto haría exactamente lo
              mismo. El error no está en el instrumento sino en **la física de
              meterlo ahí**, y por eso se corrige con un escudo y no con una
              calibración.
          - texto: Porque el gas se enfría al pasar junto al termopar
            mensaje: |
              El termopar es diminuto frente al caudal: lo que le quita al gas
              es despreciable. Lo que cambia no es la temperatura del gas, sino
              la del termopar.
          - texto: Porque la conducción a lo largo del hilo se lleva calor hacia fuera
            mensaje: |
              Ese efecto existe y tiene nombre —error por conducción del
              vástago—, pero aquí el enunciado no da ni longitud ni
              conductividad del hilo, señal de que no es lo que se pide. Lo que
              sí da es la emisividad y la temperatura de las paredes.

      - tipo: calcular
        titulo: La temperatura de verdad del gas
        pregunta: |
          Del alumno que no protege el termopar: si su lectura es
          $600\ \text{K}$ y las paredes están a $500$, ¿a qué temperatura está
          el gas?
        respuesta:
          tipo: magnitud
          valor: '621.4 K'
          tolerancia: 0.003
          formato: una temperatura, con su unidad
        distractores:
          - valor: '600 K'
            mensaje: |
              Esa es la lectura, no el gas. Si fueran iguales no habría nada que
              calcular — y el ejercicio existe precisamente porque no lo son.
          - valor: '578.6 K'
            mensaje: |
              Has restado donde había que sumar. El termopar **pierde** calor
              por radiación, así que se queda más frío que el gas: el gas está
              por encima de la lectura, no por debajo.
        pista: |
          En equilibrio, lo que entra por convección sale por radiación:
          $h\,(T_g - T_1) = \varepsilon\,\sigma\,(T_1^{4} - T_{pared}^{4})$.
        desarrollo: |
          $$
          142\,(T_g - 600) = 0{,}8 \cdot 5{,}67\cdot 10^{-8}\,(600^{4}-500^{4})
          = 3043{,}7
          $$

          $$
          T_g = 600 + \frac{3043{,}7}{142} = 621{,}4\ \text{K}
          $$

      - tipo: calcular
        titulo: El error del que no protege
        pregunta: |
          ¿De cuánto es el error de su lectura, en tanto por ciento de la
          temperatura del gas?
        respuesta:
          tipo: numero
          valor: '3.45'
          tolerancia: 0.03
          formato: el error en tanto por ciento, sin el símbolo
        distractores:
          - valor: '21.43'
            mensaje: |
              Ese es el error en **kelvin**, que también es una respuesta
              correcta a otra pregunta. Aquí se pide en tanto por ciento:
              divide entre la temperatura del gas.
          - valor: '0.43'
            mensaje: |
              Ese es el error del **otro** alumno, el que sí protege el
              termopar. Ocho veces menor, y esa es la gracia del ejercicio.
        pista: |
          $\dfrac{|T_g - T_1|}{T_g}\cdot 100$.
        desarrollo: |
          $$
          \frac{621{,}4-600}{621{,}4}\cdot 100 = 3{,}45\ \%
          $$

      - tipo: calcular
        titulo: El error del que sí protege
        pregunta: |
          Ahora el otro alumno: lectura $619\ \text{K}$ y escudo a $610$.
          ¿Cuánto se equivoca?
        respuesta:
          tipo: numero
          valor: '0.43'
          tolerancia: 0.03
          formato: el error en tanto por ciento, sin el símbolo
        distractores:
          - valor: '2.67'
            mensaje: |
              Ese es el error en **kelvin**. La pregunta pide el tanto por
              ciento, igual que la anterior.
          - valor: '3.45'
            mensaje: |
              Ese es el error del alumno que **no** protege el termopar. Si te
              sale el mismo, revisa contra qué temperatura estás radiando:
              ahora enfrente hay un escudo a 610 K, no unas paredes a 500.
        pista: |
          Mismo balance, cambiando las paredes de 500 K por el escudo de 610.
        desarrollo: |
          $$
          142\,(T_g - 619) = 0{,}8 \cdot 5{,}67\cdot 10^{-8}\,(619^{4}-610^{4})
          = 378{,}9
          $$

          $$
          T_g = 621{,}7\ \text{K} \;\Longrightarrow\;
          \frac{621{,}7-619}{621{,}7}\cdot 100 = 0{,}43\ \%
          $$

      - tipo: justificar
        pregunta: Ordena por qué el escudo funciona. Una pieza es falsa.
        piezas:
          - texto: 'El escudo se calienta hasta 610 K, así que el termopar ya no radia contra 500 sino contra algo que está casi a su temperatura.'
          - texto: 'Y como la radiación va con la diferencia de cuartas potencias, esos 110 grados menos de salto reducen la pérdida de 3.044 a 379 W/m²: el error pasa de 3,45 % a 0,43.'
          - texto: 'Las dos medidas no se pueden comparar, porque cada alumno ha medido en condiciones distintas.'
            trampa: true
            mensaje: |
              Al contrario: **es la comprobación que cierra el problema**. Los
              dos alumnos miden el mismo gas por caminos distintos, y las dos
              cuentas dan 621,4 y 621,7 K. Que dos medidas mal hechas de
              maneras diferentes lleven al mismo número es la mejor señal de
              que el modelo es correcto.
    resolucion: |
      **Lo que este ejercicio enseña no es una fórmula, es una desconfianza
      útil.** Un termopar mide **su propia temperatura**, no la del fluido en
      el que está metido. Si además de tocar el gas ve unas paredes más frías,
      radia hacia ellas y se queda por debajo del gas — y lo hace sin dar
      ninguna señal de error.

      **El alumno que no protege el termopar.** Su punta está a 600 K en
      equilibrio entre lo que le da el gas y lo que pierde radiando hacia los
      500 K de las paredes:

      $$
      142\,(T_g - 600) = 0{,}8\cdot 5{,}67\cdot 10^{-8}\,(600^{4}-500^{4})
      = 3043{,}7\ \text{W/m}^{2}
      $$

      $$
      T_g = 621{,}4\ \text{K} \;\Longrightarrow\; \text{error} = 3{,}45\ \%
      $$

      **El que sí lo protege.** El escudo se calienta hasta 610 K, y ahora el
      termopar radia contra eso en vez de contra las paredes:

      $$
      142\,(T_g - 619) = 0{,}8\cdot 5{,}67\cdot 10^{-8}\,(619^{4}-610^{4})
      = 378{,}9\ \text{W/m}^{2}
      $$

      $$
      T_g = 621{,}7\ \text{K} \;\Longrightarrow\; \text{error} = 0{,}43\ \%
      $$

      **La comprobación que cierra el problema.** Los dos alumnos han medido el
      mismo gas de dos maneras distintas, y las dos cuentas dan **621,4 y
      621,7 K**. Ese acuerdo no lo pide el enunciado y es lo primero que hay
      que mirar: si salieran diez grados distintos, habría un error en algún
      sitio.

      **Y la lectura de fondo, que vale para cualquier medida.** El escudo no
      aísla nada ni toca el gas: lo único que hace es **ponerse en medio y
      calentarse**. Al hacerlo, la superficie que el termopar ve pasa de 500 K
      a 610, y como la radiación va con la diferencia de cuartas potencias, ese
      cambio divide la pérdida por ocho.

      Es la misma idea que la pantalla de radiación de junio de 2017, con una
      diferencia que conviene ver: allí la pantalla se ponía para **reducir un
      intercambio** y aquí para **no falsear una medida**. El mecanismo es el
      mismo; el objetivo, no. Y por eso en un horno industrial los termopares
      van casi siempre apantallados, y por eso una lectura de temperatura sin
      saber qué hay alrededor del sensor no vale gran cosa.

  - id: exter1516-ext-1-el-modelo-dice-reversible-y-la-medida-no
    titulo: El modelo dice reversible, y la medida dice que no
    fuente: Ejercicio 1 de la convocatoria extraordinaria de 2015-2016, celebrada el 16 de junio de 2016 · Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El PDF trae la resolución manuscrita del profesor; el desarrollo se hizo a ciegas desde el enunciado y se contrastó después contra ella.
    nivel: examen
    enunciado: |
      En un compresor entra aire a $290\ \text{K}$ y $98\ \text{kPa}$, y se nos
      dice que se comprime según una politrópica de exponente $1{,}2$, hasta
      una presión de $670\ \text{kPa}$. Calcúlese:

      a- el trabajo, el calor intercambiado y la variación de entropía por
      unidad de masa de aire, según los datos facilitados.

      b- Sin embargo, cuando se mide la temperatura de salida del aire, se
      observa que es de $420\ \text{K}$. Asimismo, la transferencia de calor
      entre el compresor y su entorno tiene lugar a una temperatura media en la
      superficie externa de $345\ \text{K}$. También se mide el consumo real de
      trabajo del compresor y es de $220\ \text{kJ/kg}$. Dígase si según estas
      mediciones hay entropía generada y cuánta por unidad de masa de aire.

      *Para el aire como gas ideal, la resolución toma
      $c_p = 1{,}0045$ y $R' = 0{,}287\ \text{kJ/kg}\cdot\text{K}$.*
    pide: Lo que predice el modelo politrópico, y si la máquina medida genera entropía.
    pasos:
      - tipo: reconocer
        pregunta: |
          El apartado a) dice «se nos dice que se comprime según una
          politrópica». ¿Qué supone eso sobre la entropía generada **dentro**
          del compresor?
        opciones:
          - texto: Que es cero por hipótesis, porque una politrópica es un proceso reversible
            correcta: true
            mensaje: |
              Eso es, y la palabra que lo delata es «**se nos dice**». El
              apartado a) calcula con un modelo que es reversible por
              construcción; el b) mide la máquina de verdad y pregunta si
              aquello era cierto. El ejercicio entero es comprobar una
              hipótesis contra una medida.
          - texto: Que es positiva, porque todo compresor real es irreversible
            mensaje: |
              Es verdad de los compresores reales, y es justo lo que el
              apartado b) va a comprobar. Pero el a) no habla de la máquina
              real: habla del **modelo** que «se nos dice», y ese modelo es
              reversible.
          - texto: Que es negativa, porque la entropía del aire baja
            mensaje: |
              La entropía del aire baja, sí —sale calor—, pero eso es la
              variación de entropía, no la generada. La generada nunca es
              negativa; lo prohíbe el segundo principio.
          - texto: Que no se puede saber sin conocer la temperatura de la superficie
            mensaje: |
              Para el modelo no hace falta: una politrópica es reversible por
              definición y no genera nada. La temperatura de la superficie la
              da el apartado b), y hace falta allí, para la máquina real.

      - tipo: calcular
        titulo: La temperatura que predice el modelo
        pregunta: |
          Con $n = 1{,}2$, ¿a qué temperatura saldría el aire según el
          modelo?
        respuesta:
          tipo: magnitud
          valor: '399.5 K'
          tolerancia: 0.004
          formato: una temperatura, con su unidad
        distractores:
          - valor: '502.3 K'
            mensaje: |
              Has usado $\gamma = 1{,}4$ en el exponente, que sería el compresor
              adiabático reversible. El enunciado dice $n = 1{,}2$: el aire
              cede calor mientras se comprime, y por eso sale más frío.
          - valor: '420 K'
            mensaje: |
              Esa es la temperatura **medida**, la del apartado b). El modelo
              predice otra, y la diferencia entre las dos es precisamente lo que
              el ejercicio quiere que mires.
        pista: |
          $\dfrac{T_2}{T_1} = \left(\dfrac{P_2}{P_1}\right)^{(n-1)/n}$.
        desarrollo: |
          $$
          T_2 = 290 \cdot \left(\frac{670}{98}\right)^{0{,}2/1{,}2} = 399{,}5\ \text{K}
          $$

      - tipo: calcular
        titulo: El trabajo que predice el modelo
        pregunta: |
          Es un sistema abierto. ¿Cuánto trabajo por kilogramo consumiría el
          compresor según el modelo?
        respuesta:
          tipo: magnitud
          valor: '-188.56 kJ/kg'
          tolerancia: 0.02
          formato: un trabajo por unidad de masa, con su unidad y con su signo
        distractores:
          - valor: '-157.13 kJ/kg'
            mensaje: |
              Ese es el trabajo **de frontera**, $\int P\,dv$, el de un sistema
              cerrado. En un volumen de control lo que se intercambia por el eje
              es el técnico, $-\int v\,dP$, que para una politrópica es $n$
              veces el de frontera: $1{,}2\cdot 157{,}13$.
          - valor: '-110 kJ/kg'
            mensaje: |
              Eso es $c_p\,\Delta T$, que sería el trabajo si el compresor fuera
              adiabático. Con $n = 1{,}2$ sale calor, y el primer principio de
              un volumen de control lleva ese calor dentro:
              $w = q - \Delta h$.
        pista: |
          $w = \dfrac{n}{n-1}\,R'\,(T_1-T_2)$.
        desarrollo: |
          $$
          w = \frac{1{,}2}{0{,}2}\cdot 0{,}287\cdot(290-399{,}5) = -188{,}56\ \text{kJ/kg}
          $$

          Y el calor, por el primer principio:
          $q = c_p\,(T_2-T_1) + w = 1{,}0045\cdot 109{,}5 - 188{,}56 = -78{,}57\ \text{kJ/kg}$.

      - tipo: calcular
        titulo: El calor que cede la máquina real
        pregunta: |
          Ahora las medidas: el aire sale a $420\ \text{K}$ y el compresor
          consume $220\ \text{kJ/kg}$. ¿Cuánto calor cede por kilogramo?
        respuesta:
          tipo: magnitud
          valor: '-89.42 kJ/kg'
          tolerancia: 0.02
          formato: un calor por unidad de masa, con su unidad y con su signo
        distractores:
          - valor: '-78.57 kJ/kg'
            mensaje: |
              Ese es el calor del **modelo**. Con las medidas cambian las dos
              cosas que entran en el balance —la temperatura de salida y el
              trabajo—, así que el calor también cambia.
          - valor: '89.42 kJ/kg'
            mensaje: |
              El módulo está bien y el signo no. El compresor **cede** calor a
              su entorno: le entran 220 kJ/kg de trabajo y el aire solo se queda
              con 130,6 de entalpía.
        pista: |
          $q = c_p\,(T_2-T_1) + w$, con los valores medidos.
        desarrollo: |
          $$
          q = 1{,}0045\cdot(420-290) - 220 = -89{,}42\ \text{kJ/kg}
          $$

      - tipo: calcular
        titulo: La entropía generada según las medidas
        pregunta: |
          La entropía del aire cambia $-0{,}1796\ \text{kJ/kg}\cdot\text{K}$, y
          el calor sale por una superficie a $345\ \text{K}$. ¿Cuánta entropía
          se genera?
        respuesta:
          tipo: magnitud
          valor: '0.0796 kJ/(kg K)'
          tolerancia: 0.02
          formato: una entropía por unidad de masa, con su unidad
        distractores:
          - valor: '-0.1796 kJ/(kg K)'
            mensaje: |
              Esa es la variación de entropía **del aire**, no la generada. Baja
              porque el aire cede calor, y el calor se lleva entropía consigo.
              La generada es otra cosa, y nunca es negativa.
          - valor: '0.0723 kJ/(kg K)'
            mensaje: |
              Has puesto el calor a la temperatura **media del aire**, 355 K.
              Aquí el enunciado da la de la superficie por la que sale el calor,
              345 K, y esa es la que va en el denominador: es la frontera por
              donde cruza. La media del aire solo se usa cuando el enunciado no
              da nada mejor.
        pista: |
          $s_G = \Delta s - \dfrac{q}{T_{sup}}$.
        desarrollo: |
          $$
          \Delta s = 1{,}0045\ln\frac{420}{290} - 0{,}287\ln\frac{670}{98} = -0{,}1796\ \text{kJ/kg}\cdot\text{K}
          $$

          $$
          s_G = -0{,}1796 + \frac{89{,}42}{345} = 0{,}0796\ \text{kJ/kg}\cdot\text{K}
          $$

          Positiva: **el compresor real es irreversible**, aunque el modelo
          dijera que no.

      - tipo: justificar
        pregunta: Ordena lo que dicen el modelo y la medida. Una pieza es falsa.
        piezas:
          - texto: 'El modelo predice que el aire sale a 399,5 K consumiendo 188,6 kJ/kg; la máquina real lo saca a 420 K consumiendo 220.'
          - texto: 'Esos 31,4 kJ/kg de más y esos 20 grados de más son la huella de la irreversibilidad: con las medidas, la entropía generada sale positiva, 0,0796 kJ/kg·K.'
          - texto: 'Como la entropía del aire baja en los dos casos —−0,23 en el modelo y −0,18 en la medida—, el proceso real no puede ser irreversible.'
            trampa: true
            mensaje: |
              La entropía del aire baja porque el compresor **cede calor**, y el
              calor se lleva entropía hacia fuera. Eso no dice nada de la
              generada: la generada es lo que queda después de descontar lo que
              se ha ido con el calor, y aquí queda positiva. Es la misma trampa
              que en los ejercicios de los signos — confundir la variación de
              entropía del sistema con la entropía generada.
    resolucion: |
      **Lo que hace único a este ejercicio está en una palabra del
      enunciado:** «se nos dice que se comprime según una politrópica». El
      apartado a) calcula con un **modelo**, que es reversible por hipótesis. El
      b) **mide** la máquina de verdad y pregunta si aquello era cierto. Es el
      único sitio del material donde un examen enfrenta el modelo con la medida.

      **a) El modelo.** Con $n = 1{,}2$:

      $$
      T_2 = 290\left(\frac{670}{98}\right)^{0{,}2/1{,}2} = 399{,}5\ \text{K}
      $$

      $$
      w = \frac{1{,}2}{0{,}2}\cdot 0{,}287\cdot(290-399{,}5) = -188{,}56\ \text{kJ/kg}
      $$

      $$
      q = 1{,}0045\cdot 109{,}5 - 188{,}56 = -78{,}57\ \text{kJ/kg}
      \qquad
      \Delta s = 1{,}0045\ln\frac{399{,}5}{290} - 0{,}287\ln\frac{670}{98} = -0{,}23\ \text{kJ/kg}\cdot\text{K}
      $$

      De propina, un número redondo que no es casualidad: con $n = 1{,}2$ y
      $\gamma = 1{,}4$, el calor específico politrópico vale exactamente
      $c_n = c_v\,\dfrac{n-\gamma}{n-1} = -c_v$, y por eso
      $q = -c_v\,\Delta T = -0{,}7175\cdot 109{,}5 = -78{,}57$, igual que por el
      primer principio.

      **b) La medida.** Con la temperatura y el trabajo medidos:

      $$
      q = 1{,}0045\cdot(420-290) - 220 = -89{,}42\ \text{kJ/kg}
      $$

      $$
      \Delta s = 1{,}0045\ln\frac{420}{290} - 0{,}287\ln\frac{670}{98} = -0{,}1796\ \text{kJ/kg}\cdot\text{K}
      $$

      $$
      s_G = \Delta s - \frac{q}{T_{sup}} = -0{,}1796 + \frac{89{,}42}{345}
      = 0{,}0796\ \text{kJ/kg}\cdot\text{K}
      $$

      **Hay entropía generada, y es positiva: el compresor real es
      irreversible.** La respuesta a «dígase si hay» es que sí, y la prueba es
      el número.

      | | modelo | medida |
      |---|---|---|
      | temperatura de salida | 399,5 K | 420 K |
      | trabajo | −188,56 kJ/kg | −220 kJ/kg |
      | calor | −78,57 kJ/kg | −89,42 kJ/kg |
      | entropía del aire | −0,23 kJ/kg·K | −0,18 kJ/kg·K |
      | entropía generada | 0, por hipótesis | **+0,0796 kJ/kg·K** |

      **Lo que se lleva uno de aquí**, y vale para cualquier cosa que se
      modelice: un modelo reversible no es una afirmación sobre la máquina, es
      una aproximación, y la medida es la que decide. Aquí la huella de la
      irreversibilidad se ve en dos cifras que cualquiera puede leer en un
      banco de ensayo: 31,4 kJ/kg de trabajo de más y 20 grados de más a la
      salida.

      Y un aviso que ya sale en otros ejercicios del corpus, con otra cara: la
      entropía del aire **baja** en los dos casos, y eso no contradice que el
      real sea irreversible. Baja porque sale calor. La generada es lo que queda
      después de descontar lo que se ha llevado ese calor.

      > **Sobre la última cifra.** La resolución oficial escribe
      > $\Delta s = -0{,}18$ y obtiene $s_G = 0{,}0795$; con $-0{,}18$ saldría
      > 0,0792, así que la cuenta está hecha con el valor sin redondear,
      > $-0{,}1796$. Aquí se escribe ese, y sale 0,0796.
