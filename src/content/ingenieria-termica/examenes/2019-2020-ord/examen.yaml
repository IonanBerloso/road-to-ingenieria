asignatura: ingenieria-termica
convocatoria: ordinaria
curso: '2019-2020'
fecha: enero de 2020
# Bilingüe, con el euskera en la primera página y el castellano en la segunda.
# Da **2,5 horas** y cada ejercicio vale un tercio.
#
# **Su ejercicio 2 es el separador de la extraordinaria de 2023-2024, palabra
# por palabra.** Mismos 0,5 kg/s de vapor a 2 bar y 250 °C, mismas dos
# corrientes de salida, misma referencia y misma superficie a 126 °C. Lo único
# que cambia es lo que se pregunta: aquí no piden la entropía generada, solo la
# exergía destruida y el rendimiento. Está declarado en `fuera` con el enlace,
# porque transcribirlo otra vez sería duplicar.
#
# Con esto van **dos repeticiones literales encontradas** entre convocatorias de
# Térmica —esta y la de los tubos concéntricos de 2021 en 2024—, y las dos con
# cuatro años de separación. No es una casualidad del corpus: es información
# para quien prepara el examen, y por eso se dice en las dos convocatorias en
# vez de en una nota interna.
pdf: 2019-2020-ord.pdf

fuera:
  - n: 2
    motivo: >-
      El separador térmicamente mal aislado, con 0,5 kg/s de vapor a 2 bar y
      250 °C. **No se transcribe porque ya está**: es el mismo enunciado que el
      ejercicio 2 de la extraordinaria de 2023-2024, dígito a dígito, y aquel
      está resuelto entero —el separador mal aislado y el noventa y siete por
      ciento que engaña—. La única diferencia es que allí piden además la
      entropía generada, así que aquella resolución cubre esta y sobra. Se
      declara aquí para que quien abra esta convocatoria sepa dónde está.
  - n: 3
    motivo: >-
      Un suelo radiante que calefacta un local de 5×5 m con la superficie a
      29 °C y el local a 21 °C: pide el flujo de calor y, después, el gasto de
      agua por los 35 m de tubo de 20 mm que lo alimentan, con la pared
      exterior del tubo a 38 °C y el agua a 40. **Sin transcribir todavía**: no
      falta material —el PDF trae su resolución oficial— sino el trabajo de
      escribirlo. Merece hacerse por dos cosas que no tiene ningún otro: es
      **convección natural sobre una placa horizontal con la cara caliente
      hacia arriba**, que es el caso que más aparece en la vida real y ninguno
      en el corpus, y su apartado b) va **al revés que de costumbre** — el
      calor es dato y lo que se busca es el gasto.

ejercicios:
  # Ejercicio 1 · el cilindro-pistón cuyo estado final lo fija una fuerza, no
  # una presión, y con dos irreversibilidades a la vez.
  - id: exter1920-ord-1-el-proceso-que-lo-define-una-fuerza
    tema: t07-analisis-exergetico
    n: 1
