ejercicios:
  - id: exter1920-ord-1-el-proceso-que-lo-define-una-fuerza
    titulo: El proceso que no lo define una presión, sino una fuerza
    fuente: Ejercicio 1 de la convocatoria ordinaria de 2019-2020, celebrada en enero de 2020 · Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El PDF trae la resolución manuscrita del profesor; el desarrollo se hizo a ciegas desde el enunciado y se contrastó después contra ella.
    nivel: examen
    enunciado: |
      En un cilindro pistón de $10\ \text{cm}$ de diámetro interior, hay
      $2\ \text{kg}$ de aire a $1\ \text{bar}$ y $20\ ^\circ\text{C}$. Cuando se
      aplica una fuerza total exterior que sumada a la presión exterior, es
      equivalente a $2000\ \text{N}$, el aire se lleva a una temperatura final
      de $119\ ^\circ\text{C}$ en el momento en el que el desplazamiento se
      detiene. Calcúlese la exergía destruida durante el proceso. Tómese como
      temperatura de referencia $18\ ^\circ\text{C}$ y presión de referencia
      $1\ \text{bar}$, así como una temperatura media de las paredes del
      cilindro de $67\ ^\circ\text{C}$.
    pide: La exergía destruida durante el proceso.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado no da la presión final: da una **fuerza**. ¿Qué fija el
          estado final?
        opciones:
          - texto: La fuerza dividida entre el área del pistón, que es la presión exterior que el gas acaba igualando
            correcta: true
            mensaje: |
              Eso es. El desplazamiento se detiene cuando el gas equilibra al
              exterior, así que $P_2 = F/A_{\text{pistón}}$. Es la única forma de
              entrar: sin el diámetro del cilindro, el dato de 2000 N no
              serviría para nada.
          - texto: La temperatura final de 119 °C, con la ecuación de estado
            mensaje: |
              La temperatura sola no basta: la ecuación de estado tiene dos
              incógnitas, $P_2$ y $V_2$, y hace falta otra ecuación. Esa otra
              ecuación es precisamente la fuerza.
          - texto: Que el proceso es isóbaro, porque el pistón se mueve libremente
            mensaje: |
              El pistón se mueve, pero contra una presión exterior **nueva**.
              La presión del gas pasa de 1 bar a 2,546, así que de isóbaro
              nada: lo que es constante durante el desplazamiento es la presión
              de fuera, no la de dentro.
          - texto: Hay que suponer el proceso adiabático y usar la relación de la adiabática
            mensaje: |
              No se puede: el enunciado da la temperatura de las paredes del
              cilindro, y eso solo tiene sentido si sale calor por ellas. De
              hecho salen 61 kJ.

      - tipo: calcular
        titulo: La presión final
        pregunta: |
          Con los $2000\ \text{N}$ y el cilindro de $10\ \text{cm}$, ¿a qué
          presión acaba el aire?
        respuesta:
          tipo: magnitud
          valor: '2.546 bar'
          tolerancia: 0.02
          formato: una presión, con su unidad
        distractores:
          - valor: '0.6366 bar'
            mensaje: |
              Has dividido entre el **diámetro** al cuadrado sin el
              $\pi/4$, o entre el perímetro. El área de un círculo de 10 cm son
              $78{,}54\ \text{cm}^{2}$, no 100.
          - valor: '3.546 bar'
            mensaje: |
              Le has sumado el bar de la atmósfera. No hay que sumarlo: el
              enunciado dice que los 2000 N son la fuerza total **ya sumada a
              la presión exterior**.
        pista: |
          $P_2 = \dfrac{F}{A}$, con $A = \pi D^{2}/4$.
        desarrollo: |
          $$
          P_2 = \frac{2000}{\pi \cdot 0{,}10^{2}/4} = 2{,}546\cdot 10^{5}\ \text{Pa}
          $$

      - tipo: calcular
        titulo: El trabajo
        pregunta: |
          Con $v_1 = 0{,}8409$ y $v_2 = 0{,}4418\ \text{m}^{3}/\text{kg}$,
          ¿cuánto trabajo se intercambia?
        respuesta:
          tipo: magnitud
          valor: '-203.26 kJ'
          tolerancia: 0.02
          formato: un trabajo, con su unidad y con su signo
        distractores:
          - valor: '203.26 kJ'
            mensaje: |
              El módulo está bien y el signo no. El volumen **disminuye**, así
              que el trabajo lo recibe el gas y en el convenio de esta
              asignatura eso es negativo.
          - valor: '-141.6 kJ'
            mensaje: |
              Has usado la media entre las dos presiones del gas. Eso valdría
              si el gas pasara por estados de equilibrio, y aquí no pasa: la
              presión que hace el trabajo es la de **fuera**, que vale 2,546
              bar desde el primer instante.
        pista: |
          La presión que trabaja es la exterior, constante:
          $W = m\,\dfrac{F}{A}\,(v_2-v_1)$.
        desarrollo: |
          $$
          W = 2 \cdot 254{,}6 \cdot (0{,}4418 - 0{,}8409) = -203{,}26\ \text{kJ}
          $$

      - tipo: calcular
        titulo: La exergía destruida
        pregunta: |
          El aire cede $61{,}1\ \text{kJ}$ por unas paredes a
          $67\ ^\circ\text{C}$, y su entropía sube $0{,}04856\ \text{kJ/K}$.
          ¿Cuánta exergía se destruye?
        respuesta:
          tipo: magnitud
          valor: '66.41 kJ'
          tolerancia: 0.02
          formato: una exergía, con su unidad
        distractores:
          - valor: '14.14 kJ'
            mensaje: |
              Te has quedado solo con la variación de entropía del gas. Falta
              el término del calor que sale, que aquí es **casi cuatro veces
              mayor**: sin él, la entropía generada saldría mucho menor de lo
              que es.
          - valor: '52.31 kJ'
            mensaje: |
              Al revés que el anterior: solo el término del calor, sin la
              variación de entropía del gas. Los dos suman, no se eligen.
        pista: |
          $S_G = \Delta S - \dfrac{Q}{T_{pared}}$ y después
          $B_D = T_0\,S_G$, con $T_0 = 291\ \text{K}$.
        desarrollo: |
          $$
          S_G = 0{,}04856 + \frac{61{,}1}{340} = 0{,}22822\ \text{kJ/K}
          $$

          $$
          B_D = 291 \cdot 0{,}22822 = 66{,}41\ \text{kJ}
          $$

      - tipo: justificar
        pregunta: Ordena de dónde sale la exergía destruida. Una pieza es falsa.
        piezas:
          - texto: 'Hay dos irreversibilidades a la vez: la compresión brusca —el gas no pasa por estados de equilibrio— y el calor cruzando desde el gas hasta unas paredes a 67 °C.'
          - texto: 'El término del calor pesa casi cuatro veces más que la variación de entropía del gas: 0,180 frente a 0,049 kJ/K.'
            # ojo: es una comparación, no una descomposición en dos fuentes
          - texto: 'Como la exergía destruida es positiva, el trabajo tiene que serlo también.'
            trampa: true
            mensaje: |
              No tienen nada que ver. La exergía destruida es **siempre**
              positiva o nula —lo dice el segundo principio— y el trabajo aquí
              es negativo porque el gas se comprime. Un proceso puede recibir
              trabajo y destruir exergía a la vez; de hecho es lo más normal
              cuando se comprime de golpe.
    resolucion: |
      **Lo que hace distinto a este ejercicio.** Casi todos los enunciados de
      sistema cerrado dan la presión final. Este da una **fuerza**, y por eso
      da también el diámetro del cilindro: el desplazamiento se detiene cuando
      el gas equilibra al exterior, así que

      $$
      P_2 = \frac{F}{A} = \frac{2000}{\pi \cdot 0{,}10^{2}/4}
      = 2{,}546\cdot 10^{5}\ \text{Pa}
      $$

      **El trabajo, y el error que este ejercicio caza.** La tentación es
      escribir $\int P\,dv$ con la presión **del gas**. No vale: al aplicar los
      2000 N de golpe el gas deja de estar en equilibrio, y una integral sobre
      estados de equilibrio no describe lo que pasa. Lo que empuja al pistón es
      la presión de **fuera**, constante desde el primer instante:

      $$
      W = m\,\frac{F}{A}\,(v_2-v_1) = 2 \cdot 254{,}6\,(0{,}4418-0{,}8409)
      = -203{,}26\ \text{kJ}
      $$

      Negativo: el gas recibe trabajo, coherente con que el volumen baje.

      **El calor**, del primer principio:

      $$
      Q = \Delta U + W = 142{,}16 - 203{,}26 = -61{,}1\ \text{kJ}
      $$

      Sale calor, y el enunciado ya lo anunciaba al dar la temperatura de las
      paredes: si fueran adiabáticas, ese dato sobraría.

      **La entropía generada y la exergía destruida.**

      $$
      \Delta S = 2\left(0{,}718\ln\frac{392}{293} + 0{,}287\ln\frac{0{,}4418}{0{,}8409}\right)
      = 0{,}04856\ \text{kJ/K}
      $$

      $$
      S_G = \Delta S - \frac{Q}{T_{pared}} = 0{,}04856 + \frac{61{,}1}{340}
      = 0{,}22822\ \text{kJ/K}
      $$

      $$
      B_D = T_0\,S_G = 291 \cdot 0{,}22822 = 66{,}41\ \text{kJ}
      $$

      **Dos irreversibilidades en el mismo proceso**, y conviene verlas por
      separado porque el examen no las separa: la compresión es brusca, y
      además el calor cruza un salto de temperatura para llegar a las paredes.
      El término del calor, 0,180 kJ/K, pesa casi cuatro veces más que la
      variación de entropía del gas, 0,049 — pero eso **no** significa que el
      73 % de la irreversibilidad sea del calor: son dos sumandos del mismo
      balance, no dos fuentes repartidas. Para repartirlas hace falta lo que
      pide el ejercicio de febrero de 2023, evaluar el calor a la temperatura
      media del proceso.

      **Y una observación sobre los números, que no cambia nada del método pero
      conviene ver.** Dos kilos de aire a 1 bar ocupan $1{,}68\ \text{m}^{3}$,
      y en un cilindro de 10 cm de diámetro eso son **214 metros de
      cilindro**. El enunciado se reproduce tal cual, con sus números, porque
      es lo que cayó; pero acostumbrarse a comprobar si un resultado
      intermedio es físicamente creíble es una costumbre que salva exámenes
      donde el disparate sí viene de un error propio.

  - id: exter1920-ord-3-el-suelo-radiante-y-los-cuatro-decimos-de-grado
    titulo: El suelo radiante, y el gasto que cuelga de cuatro décimas de grado
    fuente: Ejercicio 3 de la convocatoria ordinaria de 2019-2020, celebrada en enero de 2020 · Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El PDF trae la resolución manuscrita del profesor; el desarrollo se hizo a ciegas desde el enunciado y se contrastó después contra ella.
    nivel: examen
    enunciado: |
      a) Un sistema de suelo radiante debe calefactar un local de planta
      $5\times 5\ \text{m}^{2}$. La temperatura superficial de todo el suelo es
      de $29\ ^\circ\text{C}$, y la temperatura del local es de
      $21\ ^\circ\text{C}$. Calcúlese el flujo de calor a aportar por el suelo
      radiante.

      b) El flujo de calor del apartado anterior se suministra mediante un tubo
      de $35\ \text{m}$ de tubo de diámetro exterior $20\ \text{mm}$, espesor
      $2\ \text{mm}$ y conductividad de $0{,}45\ \text{W/(m}\cdot\text{K)}$,
      por el que circula agua a $40\ ^\circ\text{C}$. Calcúlese el gasto de
      agua por el tubo si la temperatura de la superficie exterior del tubo es
      de $38\ ^\circ\text{C}$.

      *Las propiedades salen del anexo. Aire a la temperatura de película,
      $25\ ^\circ\text{C}$: $\rho = 1{,}184\ \text{kg/m}^{3}$,
      $k = 0{,}02551\ \text{W/m}\cdot\text{K}$,
      $\mu = 1{,}849\cdot 10^{-5}\ \text{kg/m}\cdot\text{s}$ y
      $Pr = 0{,}7296$. Agua a $40\ ^\circ\text{C}$:
      $\rho = 992{,}1\ \text{kg/m}^{3}$, $k = 0{,}631\ \text{W/m}\cdot\text{K}$,
      $\mu = 6{,}53\cdot 10^{-4}\ \text{kg/m}\cdot\text{s}$ y $Pr = 4{,}32$.*
    pide: El calor que da el suelo, y el gasto de agua que hace falta para darlo.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué geometría de convección natural es un suelo radiante?
        opciones:
          - texto: Una placa horizontal con la cara caliente hacia arriba
            correcta: true
            mensaje: |
              Eso es, y es la orientación buena: el aire que se calienta junto
              al suelo sube sin estorbo y deja sitio al frío. Su longitud
              característica es el área entre el perímetro,
              $25/20 = 1{,}25\ \text{m}$.
          - texto: Una placa vertical, como el radiador de módulos
            mensaje: |
              El radiador es vertical porque está de pie contra la pared. El
              suelo está tumbado, y en convección natural la orientación lo
              cambia todo: la correlación y la longitud característica son
              otras.
          - texto: Una placa horizontal con la cara caliente hacia abajo
            mensaje: |
              Ese sería un **techo** radiante. Con la cara caliente hacia abajo
              el aire caliente queda atrapado debajo de la placa y convecciona
              mucho peor. El suelo calienta hacia arriba.
          - texto: Convección forzada, porque el aire del local se mueve
            mensaje: |
              El enunciado no da ninguna velocidad del aire, y es la señal: el
              aire solo se mueve porque el suelo lo calienta. Eso es
              convección natural, y manda el Rayleigh.

      - tipo: calcular
        titulo: El calor que da el suelo
        pregunta: |
          Con $Nu = 0{,}15\,Ra^{1/3}$, la correlación de la placa horizontal con
          la cara caliente hacia arriba para Rayleigh altos, ¿cuánto calor da el
          suelo?
        respuesta:
          tipo: magnitud
          valor: '706.6 W'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '1614 W'
            mensaje: |
              Has puesto $\beta = 1/25$, con la temperatura de película en
              grados Celsius. Para un gas ideal $\beta = 1/T$ en **kelvin**:
              $1/298$. En Celsius el Rayleigh sale doce veces mayor.
          - valor: '28.26 W'
            mensaje: |
              Eso es el calor por **metro cuadrado**. El suelo tiene 25, así
              que hay que multiplicar por el área.
        pista: |
          $Gr = \dfrac{g\,\beta\,\Delta\theta\,L^{3}\,\rho^{2}}{\mu^{2}}$,
          $Ra = Gr\cdot Pr$, y $\dot{Q} = h\,A\,\Delta\theta$ con
          $h = Nu\,k/L$.
        desarrollo: |
          $$
          Gr = \frac{9{,}8\cdot\frac{1}{298}\cdot 8\cdot 1{,}25^{3}\cdot 1{,}184^{2}}{(1{,}849\cdot 10^{-5})^{2}}
          = 2{,}107\cdot 10^{9}
          \qquad
          Ra = 2{,}107\cdot 10^{9}\cdot 0{,}7296 = 1{,}537\cdot 10^{9}
          $$

          $$
          Nu = 0{,}15\,(1{,}537\cdot 10^{9})^{1/3} = 173{,}1
          \qquad
          h = \frac{173{,}1\cdot 0{,}02551}{1{,}25} = 3{,}533\ \text{W/m}^{2}\text{K}
          $$

          $$
          \dot{Q} = 3{,}533 \cdot 25 \cdot 8 = 706{,}6\ \text{W}
          $$

      - tipo: calcular
        titulo: La cara interior del tubo
        pregunta: |
          Esos $706{,}6\ \text{W}$ cruzan la pared del tubo, que está a
          $38\ ^\circ\text{C}$ por fuera. ¿A qué temperatura está por dentro?
        respuesta:
          tipo: magnitud
          valor: '39.59 °C'
          tolerancia: 0.0003
          formato: una temperatura, con su unidad
        distractores:
          - valor: '40 °C'
            mensaje: |
              Esa es la del **agua**. Entre el agua y la cara interior está la
              película de convección, y aunque sea muy fina se lleva algo — de
              hecho, lo poco que se lleva es lo que decide el resto del
              ejercicio.
          - valor: '48 °C'
            mensaje: |
              Te has dejado el $2\pi$ de la resistencia cilíndrica,
              $\ln(r_2/r_1)/(2\pi k L)$. Sin él la pared parece seis veces más
              gruesa de lo que es.
        pista: |
          $\theta_1 = \theta_2 + \dot{Q}\,\dfrac{\ln(r_2/r_1)}{2\pi k L}$.
        desarrollo: |
          $$
          \theta_1 = 38 + 706{,}6\cdot\frac{\ln(0{,}01/0{,}008)}{2\pi\cdot 0{,}45\cdot 35}
          = 39{,}59\ ^\circ\text{C}
          $$

      - tipo: calcular
        titulo: El coeficiente de convección dentro del tubo
        pregunta: |
          El agua está a $40\ ^\circ\text{C}$ y la cara interior a $39{,}59$.
          ¿Cuánto vale $h$ dentro?
        respuesta:
          tipo: magnitud
          valor: '987.6 W/(m^2 K)'
          tolerancia: 0.03
          formato: un coeficiente de convección, con su unidad
        distractores:
          - valor: '790 W/(m^2 K)'
            mensaje: |
              Has usado la superficie **exterior** del tubo. La convección del
              agua ocurre en la cara interior, la de 16 mm.
          - valor: '200.8 W/(m^2 K)'
            mensaje: |
              Has puesto dos grados de salto —del agua a la cara exterior—. Esos
              dos grados son la pared y la película juntas; la película sola son
              0,41.
        pista: |
          $h = \dfrac{\dot{Q}}{\pi D_1 L\,(\theta_{agua}-\theta_1)}$.
        desarrollo: |
          $$
          h = \frac{706{,}6}{\pi\cdot 0{,}016\cdot 35\cdot (40-39{,}5933)}
          = 987{,}6\ \text{W/m}^{2}\text{K}
          $$

      - tipo: calcular
        titulo: El gasto de agua
        pregunta: |
          Con $Nu = 25{,}04$ y Dittus-Boelter con exponente $0{,}3$ —el agua cede
          calor—, ¿qué gasto circula?
        respuesta:
          tipo: magnitud
          valor: '0.0296 kg/s'
          tolerancia: 0.035
          formato: un gasto másico, con su unidad
        distractores:
          - valor: '0.0247 kg/s'
            mensaje: |
              Has usado el exponente $0{,}4$ del Prandtl, que es el de un fluido
              que **se calienta**. Aquí el agua cede calor al suelo y se enfría:
              toca $0{,}3$.
          - valor: '0.0463 kg/s'
            mensaje: |
              Has calculado el área de paso con el diámetro **exterior**. El
              agua va por dentro: 16 mm, no 20.
        pista: |
          Despeja $Re$ de $Nu = 0{,}023\,Re^{0{,}8}Pr^{0{,}3}$, y el gasto sale
          sin pasar por la velocidad: $\dot{m} = \pi D\mu\,Re/4$.
        desarrollo: |
          $$
          25{,}04 = 0{,}023\,Re^{0{,}8}\,4{,}32^{0{,}3} \;\Longrightarrow\; Re = 3613
          $$

          $$
          \dot{m} = \frac{\pi\cdot 0{,}016\cdot 6{,}53\cdot 10^{-4}\cdot 3613}{4}
          = 0{,}0296\ \text{kg/s}
          $$

      - tipo: justificar
        pregunta: Ordena cómo hay que leer el gasto. Una pieza es falsa.
        piezas:
          - texto: 'Todo el apartado cuelga de 0,41 grados entre el agua y la cara interior del tubo: la pared de plástico, con k = 0,45, se come el 80 % de los dos grados de salto.'
          - texto: 'Con Re = 3.613 el flujo ya no es laminar, pero está en transición: Dittus-Boelter se da por buena a partir de 10.000, así que el gasto hay que leerlo como una estimación.'
          - texto: 'Como el Reynolds pasa de 2.100, el flujo es plenamente turbulento y Dittus-Boelter da el gasto exacto.'
            trampa: true
            mensaje: |
              Pasar de 2.100 quiere decir que ya no es laminar, no que sea
              plenamente turbulento: entre unos 2.300 y 10.000 el flujo está en
              **transición**, y ahí Dittus-Boelter sobrestima. La propia
              resolución de febrero de 2023 la da por aplicable «Re > 10.000».
              Con 3.613 el número es una estimación razonable, no un resultado
              exacto.
    resolucion: |
      **a) El suelo es una placa horizontal con la cara caliente hacia
      arriba**, la orientación en que la convección natural funciona mejor. Su
      longitud característica es el área entre el perímetro,
      $L = 25/20 = 1{,}25\ \text{m}$, y las propiedades del aire se toman a la
      temperatura de película, 25 °C:

      $$
      Gr = \frac{9{,}8\cdot\frac{1}{298}\cdot 8\cdot 1{,}25^{3}\cdot 1{,}184^{2}}{(1{,}849\cdot 10^{-5})^{2}}
      = 2{,}107\cdot 10^{9}
      \;\Longrightarrow\; Ra = 1{,}537\cdot 10^{9}
      $$

      $$
      Nu = 0{,}15\,Ra^{1/3} = 173{,}1
      \qquad
      h = 3{,}533\ \text{W/m}^{2}\text{K}
      \qquad
      \dot{Q} = 3{,}533\cdot 25\cdot 8 = 706{,}6\ \text{W}
      $$

      **Un detalle de la correlación que merece verse.** Con exponente $1/3$,
      el Nusselt va con $L^{3\cdot 1/3} = L$, y $h = Nu\,k/L$ lo vuelve a
      dividir: **la longitud característica se cancela**. El coeficiente no
      depende del tamaño del suelo. El tamaño solo sirve para decidir qué
      correlación toca, a través del Rayleigh.

      **b) Del calor al gasto**, que es el camino al revés. Primero la pared
      del tubo, de fuera hacia dentro:

      $$
      \theta_1 = 38 + 706{,}6\cdot\frac{\ln(0{,}01/0{,}008)}{2\pi\cdot 0{,}45\cdot 35} = 39{,}59\ ^\circ\text{C}
      $$

      Después la película de agua, de la que sale el coeficiente:

      $$
      h = \frac{706{,}6}{\pi\cdot 0{,}016\cdot 35\cdot 0{,}4067} = 987{,}6\ \text{W/m}^{2}\text{K}
      \;\Longrightarrow\; Nu = \frac{987{,}6\cdot 0{,}016}{0{,}631} = 25{,}04
      $$

      Y Dittus-Boelter usada al revés —del Nusselt al Reynolds—, con exponente
      $0{,}3$ porque el agua se enfría:

      $$
      Re = 3613 \;\Longrightarrow\; \dot{m} = \frac{\pi D\mu\,Re}{4} = 0{,}0296\ \text{kg/s}
      $$

      **Tres cosas que hay que leer con este resultado delante.**

      La primera, la sensibilidad. El gasto cuelga de **0,41 grados** entre el
      agua y la cara interior, porque la pared de plástico se come el resto. Con
      un salto tan pequeño, cualquier error se amplifica: un 0,45 % en el calor
      del apartado a) se convierte en un 2,2 % en el coeficiente y en un 3 % en
      el gasto.

      La segunda, la validez. $Re = 3613$ ya no es laminar, pero está en
      transición, y Dittus-Boelter se da por buena a partir de 10.000 — lo dice
      la propia resolución de febrero de 2023. El gasto es una estimación
      razonable, no un número exacto.

      La tercera, y es la que el enunciado no pide: **una comprobación de
      coherencia**. Con 0,0296 kg/s, entregar 706,6 W enfría el agua
      $706{,}6/(0{,}0296\cdot 4179) = 5{,}7$ grados a lo largo de los 35 m. Así
      que «agua a 40 °C» solo puede ser una media, y hacia el final del tubo el
      agua quedaría por debajo de los 38 °C de la pared — imposible si el calor
      sale hacia fuera. El modelo de temperaturas uniformes a lo largo de todo
      el tubo no aguanta su propio resultado. Es una idealización de examen, y
      verlo es exactamente la costumbre que salva los problemas de verdad.

      > **Sobre las cifras oficiales.** La resolución da $\dot{Q} = 709{,}8$ W,
      > y el gasto, 0,03 kg/s. La diferencia está en su Grashof: está calculado
      > con $\rho = 1{,}192$ y no con el 1,184 que escribe en la lista de
      > propiedades. Es un 0,45 % en el calor — y, por la sensibilidad de
      > arriba, un 3 % en el gasto. Las dos cifras se aceptan en las casillas.
