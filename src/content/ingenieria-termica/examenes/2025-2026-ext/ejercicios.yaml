ejercicios:
  - id: exter2526-ext-1-la-resistencia-dentro-del-tanque
    titulo: La resistencia dentro del tanque, y la potencia que hace falta
    fuente: Apartado 1 del ejercicio 1 de la convocatoria extraordinaria de febrero de 2026 · Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica su resolución oficial, y el desarrollo está contrastado contra ella.
    nivel: examen
    enunciado: |
      Un tanque rígido, hermético y térmicamente aislado contiene
      $1{,}5\ \text{kg}$ de vapor húmedo a una presión de $200\ \text{kPa}$ y
      una entalpía de $1.654\ \text{kJ/kg}$. En el interior del tanque hay una
      resistencia eléctrica que se conecta durante $10$ minutos, hasta que el
      vapor pasa a estado de vapor saturado seco.

      El entorno se encuentra a una temperatura ambiente constante de
      $25\ ^\circ\text{C}$ y una presión de $100\ \text{kPa}$.

      Se pide la potencia eléctrica suministrada.
    pide: La potencia eléctrica de la resistencia.
    pasos:
      - tipo: reconocer
        pregunta: |
          Rígido, hermético y aislado. ¿Qué queda del balance de energía?
        opciones:
          - texto: Solo el trabajo eléctrico, igual a la variación de energía interna
            correcta: true
            mensaje: |
              Eso es. Aislado quita el calor, rígido quita el trabajo de
              frontera y hermético quita los flujos de masa. Lo único que
              entra es la resistencia, así que $W_e = m(u_2 - u_1)$ y el
              ejercicio se reduce a leer dos energías internas en la tabla.
          - texto: El calor y el trabajo de frontera, que se compensan
            mensaje: |
              Ninguno de los dos existe aquí: aislado es $Q = 0$ y rígido es
              $\Delta V = 0$. Compensarse sería otra cosa, y además habría que
              demostrarlo.
          - texto: La entalpía, porque el enunciado da $h_1$
            mensaje: |
              La entalpía aparece como **dato** para situar el estado 1, no
              porque el balance la use. En un sistema cerrado el balance va con
              $u$; la $h$ sirve aquí para entrar en la tabla y sacar el título.
          - texto: Nada, porque el sistema está aislado y no cambia
            mensaje: |
              Aislado térmicamente no quiere decir aislado del todo: por los
              cables entra energía. Un tanque aislado con una resistencia
              dentro se calienta perfectamente.

      - tipo: calcular
        titulo: El título inicial
        pregunta: |
          A $200\ \text{kPa}$, con $h' = 504{,}7$ y
          $h'' = 2.706{,}2\ \text{kJ/kg}$, ¿cuál es el título del vapor
          húmedo?
        respuesta:
          tipo: numero
          valor: '0.522'
          tolerancia: 0.005
          formato: un título entre 0 y 1
        distractores:
          - valor: '0.611'
            mensaje: |
              Has dividido $h_1$ entre $h''$ sin restar $h'$. El título mide
              dónde cae el estado **entre** líquido y vapor saturados, así que
              el origen es $h'$, no cero.
          - valor: '0.478'
            mensaje: |
              Ese es $1-x$, la fracción de líquido. El título es la de vapor.
        pista: |
          $x_1 = \dfrac{h_1 - h'}{h'' - h'}$.
        desarrollo: |
          $$
          x_1 = \frac{1654 - 504{,}7}{2706{,}2 - 504{,}7} = 0{,}522
          $$

      - tipo: calcular
        titulo: La presión final
        pregunta: |
          El volumen específico inicial es
          $v_1 = 0{,}46288\ \text{m}^{3}/\text{kg}$. Como el tanque es rígido y
          el estado final es vapor saturado seco, ¿a qué presión acaba?
        respuesta:
          tipo: magnitud
          valor: '4 bar'
          tolerancia: 0.03
          formato: una presión, con su unidad
        distractores:
          - valor: '200 kPa'
            mensaje: |
              Esa es la inicial. El vapor se calienta en un recipiente cerrado,
              así que la presión sube; lo que no cambia es el volumen
              específico.
          - valor: '3.5 bar'
            mensaje: |
              A 3,5 bar el vapor saturado tiene $v'' = 0{,}5243$, bastante más
              que nuestro 0,46288. Hay que bajar en la columna hasta encontrar
              el que coincide.
        pista: |
          Busca en la tabla de saturación la presión cuyo $v''$ vale 0,46288.
        desarrollo: |
          $$
          v_2 = v_1 = 0{,}46288\ \text{m}^{3}/\text{kg}
          \quad\text{y}\quad x_2 = 1
          \;\Longrightarrow\;
          P_2 = 4\ \text{bar}
          $$

      - tipo: calcular
        titulo: La potencia
        pregunta: |
          Con $u_1 = 1.561{,}4$ y $u_2 = 2.552{,}9\ \text{kJ/kg}$, y diez
          minutos de funcionamiento, ¿qué potencia da la resistencia?
        respuesta:
          tipo: magnitud
          valor: '2.48 kW'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '1487.3 kW'
            mensaje: |
              Esos son los kilojulios, no los kilovatios. Faltan los 600
              segundos: diez minutos, no diez.
          - valor: '148.73 kW'
            mensaje: |
              Has dividido entre 10 en vez de entre 600. El tiempo va en
              segundos si la potencia va en kilovatios.
        pista: |
          $\dot{W}_e = \dfrac{m\,(u_2-u_1)}{t}$, con $t$ en segundos.
        desarrollo: |
          $$
          W_e = 1{,}5 \cdot (2552{,}9 - 1561{,}4) = 1487{,}3\ \text{kJ}
          \qquad
          \dot{W}_e = \frac{1487{,}3}{600} = 2{,}48\ \text{kW}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: 'El tanque es rígido, así que $v_2 = v_1$ y el estado final queda fijado con solo saber que es vapor saturado seco.'
          - texto: 'Es aislado y cerrado, así que toda la energía eléctrica se queda dentro como energía interna.'
            trampa: true
            mensaje: |
              Al ser rígido no hay trabajo de frontera, así que **no hay
              expansión**: el vapor no empuja nada. Confundir «se calienta» con
              «se expande» es lo que lleva a buscar un trabajo que aquí no
              existe, y a no ver que el volumen específico es el dato que fija
              el estado final.
          - texto: 'Al calentarse a volumen constante el vapor se expande y realiza trabajo contra el entorno.'
    resolucion: |
      **Lo que quitan los tres adjetivos.** «Rígido» quita el trabajo de
      frontera, «hermético» quita los flujos de masa y «térmicamente aislado»
      quita el calor. Del balance de energía solo queda la resistencia:

      $$
      W_e = m\,(u_2 - u_1)
      $$

      Todo el ejercicio es, entonces, leer bien dos energías internas.

      **El estado 1.** A 200 kPa el vapor húmedo con $h_1 = 1654$ tiene

      $$
      x_1 = \frac{1654-504{,}7}{2706{,}2-504{,}7} = 0{,}522
      $$

      y con él $v_1 = 0{,}522 \cdot 0{,}88568 + 0{,}478 \cdot 0{,}0010605
      = 0{,}46288\ \text{m}^{3}/\text{kg}$. La energía interna sale de la
      definición de entalpía, que evita interpolar otra vez:
      $u_1 = h_1 - P_1v_1 = 1654 - 200 \cdot 0{,}46288 = 1561{,}4\ \text{kJ/kg}$.

      **El estado 2, que es donde está la idea.** El tanque es rígido, así que
      $v_2 = v_1$. Y el enunciado dice que acaba en vapor saturado seco, o sea
      $v_2 = v''$. Con esas dos cosas **el estado ya está fijado**: basta
      buscar en la tabla la presión cuyo $v''$ vale 0,46288, que es
      $4\ \text{bar}$. De ahí $h_2 = 2738{,}1$ y
      $u_2 = h_2 - P_2v_2 = 2738{,}1 - 400 \cdot 0{,}46288 = 2552{,}9\ \text{kJ/kg}$.

      **La potencia.**

      $$
      W_e = 1{,}5 \cdot (2552{,}9-1561{,}4) = 1487{,}3\ \text{kJ}
      \qquad
      \dot{W}_e = \frac{1487{,}3}{600} = 2{,}48\ \text{kW}
      $$

      **Y una comprobación de sentido.** Dos kilovatios y medio durante diez
      minutos para vaporizar el 48 % de kilo y medio de agua. Son unos 1.500 kJ
      para evaporar 0,72 kg, es decir unos 2.070 kJ por kilo — del orden de la
      entalpía de vaporización del agua a esas presiones, que ronda los 2.100.
      Cuadra.

  - id: exter2526-ext-1-lo-que-cuesta-calentar-con-una-resistencia
    titulo: Lo que cuesta calentar con una resistencia, medido en exergía
    fuente: Apartados 2 y 3 del ejercicio 1 de la convocatoria extraordinaria de febrero de 2026 · Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica su resolución oficial, y el desarrollo está contrastado contra ella.
    nivel: examen
    enunciado: |
      Del mismo tanque rígido, hermético y aislado del apartado anterior
      —$1{,}5\ \text{kg}$ de vapor que pasan de $200\ \text{kPa}$ y
      $x_1 = 0{,}522$ a vapor saturado seco a $4\ \text{bar}$, con
      $1.487{,}3\ \text{kJ}$ de trabajo eléctrico— se pide:

      2- la exergía destruida en el proceso

      3- el rendimiento exergético del proceso

      Tómese como estado de referencia el estado del medio circundante,
      $25\ ^\circ\text{C}$ y $100\ \text{kPa}$.
    pide: La exergía destruida y el rendimiento exergético.
    pasos:
      - tipo: reconocer
        pregunta: |
          El tanque está aislado y no intercambia calor con nadie. ¿De dónde
          sale entonces la entropía generada?
        opciones:
          - texto: De la propia disipación eléctrica, que es irreversible
            correcta: true
            mensaje: |
              Eso es. Convertir trabajo en calor por efecto Joule es el
              ejemplo de libro de proceso irreversible: el camino de vuelta
              —sacar trabajo del vapor caliente— no devuelve lo mismo. Como no
              hay calor al exterior, **toda** la entropía que gana el vapor es
              generada.
          - texto: 'De ninguna parte: aislado significa isentrópico'
            mensaje: |
              Isentrópico es adiabático **y reversible**. Aquí es adiabático e
              irreversible, así que la entropía sube sin que entre calor. Es
              la confusión que más cuesta puntos del tema.
          - texto: Del salto de temperatura con el ambiente
            mensaje: |
              No hay salto que aprovechar, porque el tanque está aislado: no
              cruza calor por la pared. La irreversibilidad está dentro, en la
              resistencia.
          - texto: De la expansión del vapor
            mensaje: |
              El tanque es rígido: no hay expansión. Ese es justo el trabajo
              que no existe en este problema.

      - tipo: calcular
        titulo: La exergía destruida
        pregunta: |
          Con $s_1 = 4{,}4515$ y $s_2 = 6{,}8959\ \text{kJ/(kg}\cdot\text{K)}$,
          ¿cuánta exergía se destruye?
        respuesta:
          tipo: magnitud
          valor: '1093 kJ'
          tolerancia: 0.02
          formato: una energía, con su unidad
        distractores:
          - valor: '3.667 kJ'
            mensaje: |
              Esa es la entropía generada, en kJ/K. Falta multiplicarla por la
              temperatura del ambiente para pasarla a kilojulios de trabajo
              perdido.
          - valor: '1487.3 kJ'
            mensaje: |
              Ese es todo el trabajo eléctrico. No se destruye entero: una
              parte —395 kJ— sí ha quedado almacenada como exergía del vapor,
              y es lo que hace que el rendimiento no sea cero.
        pista: |
          $B_D = T_0\,S_{gen}$, con $S_{gen} = m(s_2-s_1)$ porque no hay calor.
        desarrollo: |
          $$
          S_{gen} = 1{,}5 \cdot (6{,}8959-4{,}4515) = 3{,}667\ \text{kJ/K}
          $$

          $$
          B_D = 298{,}15 \cdot 3{,}667 = 1093\ \text{kJ}
          $$

      - tipo: calcular
        titulo: El rendimiento exergético
        pregunta: |
          ¿Qué fracción del trabajo eléctrico ha quedado como exergía del
          vapor?
        respuesta:
          tipo: numero
          valor: '0.265'
          tolerancia: 0.02
          formato: una fracción entre 0 y 1
        distractores:
          - valor: '0.735'
            mensaje: |
              Esa es la fracción destruida, no la aprovechada. El rendimiento
              es lo que se recupera partido de lo que se gasta.
          - valor: '1'
            mensaje: |
              Sería 1 si el proceso fuese reversible, y no lo es: calentar con
              una resistencia destruye casi tres cuartas partes de la
              capacidad de producir trabajo que tenía la electricidad.
        pista: |
          $\eta_B = \dfrac{\Delta B_{vapor}}{W_e}$, y
          $\Delta B_{vapor} = W_e - B_D$ porque no sale nada más del tanque.
        desarrollo: |
          $$
          \Delta B = 1487{,}3 - 1093 = 394{,}3\ \text{kJ}
          \qquad
          \eta_B = \frac{394{,}3}{1487{,}3} = 0{,}265
          $$

      - tipo: justificar
        pregunta: Ordena la lectura del resultado. Una pieza es falsa.
        piezas:
          - texto: 'La electricidad es exergía pura: sus 1.487,3 kJ podrían haberse convertido enteros en trabajo.'
          - texto: 'Al disiparlos en una resistencia, solo 394 kJ quedan como capacidad de producir trabajo y el resto se destruye.'
          - texto: 'El primer principio también se resiente: de los 1.487,3 kJ eléctricos, solo 394 llegan al vapor.'
            trampa: true
            mensaje: |
              El primer principio no pierde nada: **los 1.487,3 kJ están
              todos** en el vapor como energía interna. Lo que se pierde es su
              **calidad**, y esa es la diferencia entre los dos principios que
              este ejercicio existe para enseñar. Energía, toda; exergía, un
              26 %.
    resolucion: |
      **Por qué hay entropía generada si no entra calor.** El tanque está
      aislado, así que $\int \delta Q/T = 0$ y el balance de entropía se queda
      en $S_{gen} = m(s_2-s_1)$: **toda** la entropía que gana el vapor la ha
      generado el proceso. La irreversibilidad no está en la pared, está en la
      resistencia — convertir trabajo en calor por efecto Joule no se deshace.

      **La exergía destruida.**

      $$
      S_{gen} = 1{,}5 \cdot (6{,}8959 - 4{,}4515) = 3{,}667\ \text{kJ/K}
      \qquad
      B_D = T_0 S_{gen} = 298{,}15 \cdot 3{,}667 = 1093\ \text{kJ}
      $$

      **El rendimiento.** La electricidad es exergía pura: sus 1.487,3 kJ
      valían enteros como trabajo. Del tanque no sale nada —ni calor, ni masa,
      ni trabajo de frontera—, así que lo que no se ha destruido se ha quedado
      dentro:

      $$
      \Delta B_{vapor} = 1487{,}3 - 1093 = 394{,}3\ \text{kJ}
      \qquad
      \eta_B = \frac{394{,}3}{1487{,}3} = 0{,}265
      $$

      **Y la conclusión, que vale para cualquier calefactor eléctrico.** El
      primer principio no echa nada en falta: los 1.487,3 kJ están todos
      dentro del vapor. Lo que se ha ido es la **calidad**: de una energía que
      valía el 100 % como trabajo queda un 26 %. Calentar con una resistencia
      es termodinámicamente lo más caro que se puede hacer con la electricidad,
      y por eso una bomba de calor —que la usa para **mover** calor en vez de
      para fabricarlo— gana por goleada.
