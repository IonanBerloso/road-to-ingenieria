ejercicios:
  - id: exter2526-ext-1-la-resistencia-dentro-del-tanque
    titulo: La resistencia dentro del tanque, y la potencia que hace falta
    fuente: Apartado 1 del ejercicio 1 de la convocatoria extraordinaria de febrero de 2026 · Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica su resolución oficial, y el desarrollo está contrastado contra ella.
    nivel: examen
    enunciado: |
      Un tanque rígido, hermético y térmicamente aislado contiene
      $1{,}5\ \text{kg}$ de vapor húmedo a una presión de $200\ \text{kPa}$ y
      una entalpía de $1.654\ \text{kJ/kg}$. En el interior del tanque hay una
      resistencia eléctrica que se conecta durante $10$ minutos, hasta que el
      vapor pasa a estado de vapor saturado seco.

      El entorno se encuentra a una temperatura ambiente constante de
      $25\ ^\circ\text{C}$ y una presión de $100\ \text{kPa}$.

      Se pide la potencia eléctrica suministrada.
    pide: La potencia eléctrica de la resistencia.
    pasos:
      - tipo: reconocer
        pregunta: |
          Rígido, hermético y aislado. ¿Qué queda del balance de energía?
        opciones:
          - texto: Solo el trabajo eléctrico, igual a la variación de energía interna
            correcta: true
            mensaje: |
              Eso es. Aislado quita el calor, rígido quita el trabajo de
              frontera y hermético quita los flujos de masa. Lo único que
              entra es la resistencia, así que $W_e = m(u_2 - u_1)$ y el
              ejercicio se reduce a leer dos energías internas en la tabla.
          - texto: El calor y el trabajo de frontera, que se compensan
            mensaje: |
              Ninguno de los dos existe aquí: aislado es $Q = 0$ y rígido es
              $\Delta V = 0$. Compensarse sería otra cosa, y además habría que
              demostrarlo.
          - texto: La entalpía, porque el enunciado da $h_1$
            mensaje: |
              La entalpía aparece como **dato** para situar el estado 1, no
              porque el balance la use. En un sistema cerrado el balance va con
              $u$; la $h$ sirve aquí para entrar en la tabla y sacar el título.
          - texto: Nada, porque el sistema está aislado y no cambia
            mensaje: |
              Aislado térmicamente no quiere decir aislado del todo: por los
              cables entra energía. Un tanque aislado con una resistencia
              dentro se calienta perfectamente.

      - tipo: calcular
        titulo: El título inicial
        pregunta: |
          A $200\ \text{kPa}$, con $h' = 504{,}7$ y
          $h'' = 2.706{,}2\ \text{kJ/kg}$, ¿cuál es el título del vapor
          húmedo?
        respuesta:
          tipo: numero
          valor: '0.522'
          tolerancia: 0.005
          formato: un título entre 0 y 1
        distractores:
          - valor: '0.611'
            mensaje: |
              Has dividido $h_1$ entre $h''$ sin restar $h'$. El título mide
              dónde cae el estado **entre** líquido y vapor saturados, así que
              el origen es $h'$, no cero.
          - valor: '0.478'
            mensaje: |
              Ese es $1-x$, la fracción de líquido. El título es la de vapor.
        pista: |
          $x_1 = \dfrac{h_1 - h'}{h'' - h'}$.
        desarrollo: |
          $$
          x_1 = \frac{1654 - 504{,}7}{2706{,}2 - 504{,}7} = 0{,}522
          $$

      - tipo: calcular
        titulo: La presión final
        pregunta: |
          El volumen específico inicial es
          $v_1 = 0{,}46288\ \text{m}^{3}/\text{kg}$. Como el tanque es rígido y
          el estado final es vapor saturado seco, ¿a qué presión acaba?
        respuesta:
          tipo: magnitud
          valor: '4 bar'
          tolerancia: 0.03
          formato: una presión, con su unidad
        distractores:
          - valor: '200 kPa'
            mensaje: |
              Esa es la inicial. El vapor se calienta en un recipiente cerrado,
              así que la presión sube; lo que no cambia es el volumen
              específico.
          - valor: '3.5 bar'
            mensaje: |
              A 3,5 bar el vapor saturado tiene $v'' = 0{,}5243$, bastante más
              que nuestro 0,46288. Hay que bajar en la columna hasta encontrar
              el que coincide.
        pista: |
          Busca en la tabla de saturación la presión cuyo $v''$ vale 0,46288.
        desarrollo: |
          $$
          v_2 = v_1 = 0{,}46288\ \text{m}^{3}/\text{kg}
          \quad\text{y}\quad x_2 = 1
          \;\Longrightarrow\;
          P_2 = 4\ \text{bar}
          $$

      - tipo: calcular
        titulo: La potencia
        pregunta: |
          Con $u_1 = 1.561{,}4$ y $u_2 = 2.552{,}9\ \text{kJ/kg}$, y diez
          minutos de funcionamiento, ¿qué potencia da la resistencia?
        respuesta:
          tipo: magnitud
          valor: '2.48 kW'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '1487.3 kW'
            mensaje: |
              Esos son los kilojulios, no los kilovatios. Faltan los 600
              segundos: diez minutos, no diez.
          - valor: '148.73 kW'
            mensaje: |
              Has dividido entre 10 en vez de entre 600. El tiempo va en
              segundos si la potencia va en kilovatios.
        pista: |
          $\dot{W}_e = \dfrac{m\,(u_2-u_1)}{t}$, con $t$ en segundos.
        desarrollo: |
          $$
          W_e = 1{,}5 \cdot (2552{,}9 - 1561{,}4) = 1487{,}3\ \text{kJ}
          \qquad
          \dot{W}_e = \frac{1487{,}3}{600} = 2{,}48\ \text{kW}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: 'El tanque es rígido, así que $v_2 = v_1$ y el estado final queda fijado con solo saber que es vapor saturado seco.'
          - texto: 'Es aislado y cerrado, así que toda la energía eléctrica se queda dentro como energía interna.'
            trampa: true
            mensaje: |
              Al ser rígido no hay trabajo de frontera, así que **no hay
              expansión**: el vapor no empuja nada. Confundir «se calienta» con
              «se expande» es lo que lleva a buscar un trabajo que aquí no
              existe, y a no ver que el volumen específico es el dato que fija
              el estado final.
          - texto: 'Al calentarse a volumen constante el vapor se expande y realiza trabajo contra el entorno.'
    resolucion: |
      **Lo que quitan los tres adjetivos.** «Rígido» quita el trabajo de
      frontera, «hermético» quita los flujos de masa y «térmicamente aislado»
      quita el calor. Del balance de energía solo queda la resistencia:

      $$
      W_e = m\,(u_2 - u_1)
      $$

      Todo el ejercicio es, entonces, leer bien dos energías internas.

      **El estado 1.** A 200 kPa el vapor húmedo con $h_1 = 1654$ tiene

      $$
      x_1 = \frac{1654-504{,}7}{2706{,}2-504{,}7} = 0{,}522
      $$

      y con él $v_1 = 0{,}522 \cdot 0{,}88568 + 0{,}478 \cdot 0{,}0010605
      = 0{,}46288\ \text{m}^{3}/\text{kg}$. La energía interna sale de la
      definición de entalpía, que evita interpolar otra vez:
      $u_1 = h_1 - P_1v_1 = 1654 - 200 \cdot 0{,}46288 = 1561{,}4\ \text{kJ/kg}$.

      **El estado 2, que es donde está la idea.** El tanque es rígido, así que
      $v_2 = v_1$. Y el enunciado dice que acaba en vapor saturado seco, o sea
      $v_2 = v''$. Con esas dos cosas **el estado ya está fijado**: basta
      buscar en la tabla la presión cuyo $v''$ vale 0,46288, que es
      $4\ \text{bar}$. De ahí $h_2 = 2738{,}1$ y
      $u_2 = h_2 - P_2v_2 = 2738{,}1 - 400 \cdot 0{,}46288 = 2552{,}9\ \text{kJ/kg}$.

      **La potencia.**

      $$
      W_e = 1{,}5 \cdot (2552{,}9-1561{,}4) = 1487{,}3\ \text{kJ}
      \qquad
      \dot{W}_e = \frac{1487{,}3}{600} = 2{,}48\ \text{kW}
      $$

      **Y una comprobación de sentido.** Dos kilovatios y medio durante diez
      minutos para vaporizar el 48 % de kilo y medio de agua. Son unos 1.500 kJ
      para evaporar 0,72 kg, es decir unos 2.070 kJ por kilo — del orden de la
      entalpía de vaporización del agua a esas presiones, que ronda los 2.100.
      Cuadra.

  - id: exter2526-ext-1-lo-que-cuesta-calentar-con-una-resistencia
    titulo: Lo que cuesta calentar con una resistencia, medido en exergía
    fuente: Apartados 2 y 3 del ejercicio 1 de la convocatoria extraordinaria de febrero de 2026 · Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica su resolución oficial, y el desarrollo está contrastado contra ella.
    nivel: examen
    enunciado: |
      Del mismo tanque rígido, hermético y aislado del apartado anterior
      —$1{,}5\ \text{kg}$ de vapor que pasan de $200\ \text{kPa}$ y
      $x_1 = 0{,}522$ a vapor saturado seco a $4\ \text{bar}$, con
      $1.487{,}3\ \text{kJ}$ de trabajo eléctrico— se pide:

      2- la exergía destruida en el proceso

      3- el rendimiento exergético del proceso

      Tómese como estado de referencia el estado del medio circundante,
      $25\ ^\circ\text{C}$ y $100\ \text{kPa}$.
    pide: La exergía destruida y el rendimiento exergético.
    pasos:
      - tipo: reconocer
        pregunta: |
          El tanque está aislado y no intercambia calor con nadie. ¿De dónde
          sale entonces la entropía generada?
        opciones:
          - texto: De la propia disipación eléctrica, que es irreversible
            correcta: true
            mensaje: |
              Eso es. Convertir trabajo en calor por efecto Joule es el
              ejemplo de libro de proceso irreversible: el camino de vuelta
              —sacar trabajo del vapor caliente— no devuelve lo mismo. Como no
              hay calor al exterior, **toda** la entropía que gana el vapor es
              generada.
          - texto: 'De ninguna parte: aislado significa isentrópico'
            mensaje: |
              Isentrópico es adiabático **y reversible**. Aquí es adiabático e
              irreversible, así que la entropía sube sin que entre calor. Es
              la confusión que más cuesta puntos del tema.
          - texto: Del salto de temperatura con el ambiente
            mensaje: |
              No hay salto que aprovechar, porque el tanque está aislado: no
              cruza calor por la pared. La irreversibilidad está dentro, en la
              resistencia.
          - texto: De la expansión del vapor
            mensaje: |
              El tanque es rígido: no hay expansión. Ese es justo el trabajo
              que no existe en este problema.

      - tipo: calcular
        titulo: La exergía destruida
        pregunta: |
          Con $s_1 = 4{,}4515$ y $s_2 = 6{,}8959\ \text{kJ/(kg}\cdot\text{K)}$,
          ¿cuánta exergía se destruye?
        respuesta:
          tipo: magnitud
          valor: '1093 kJ'
          tolerancia: 0.02
          formato: una energía, con su unidad
        distractores:
          - valor: '3.667 kJ'
            mensaje: |
              Esa es la entropía generada, en kJ/K. Falta multiplicarla por la
              temperatura del ambiente para pasarla a kilojulios de trabajo
              perdido.
          - valor: '1487.3 kJ'
            mensaje: |
              Ese es todo el trabajo eléctrico. No se destruye entero: una
              parte —395 kJ— sí ha quedado almacenada como exergía del vapor,
              y es lo que hace que el rendimiento no sea cero.
        pista: |
          $B_D = T_0\,S_{gen}$, con $S_{gen} = m(s_2-s_1)$ porque no hay calor.
        desarrollo: |
          $$
          S_{gen} = 1{,}5 \cdot (6{,}8959-4{,}4515) = 3{,}667\ \text{kJ/K}
          $$

          $$
          B_D = 298{,}15 \cdot 3{,}667 = 1093\ \text{kJ}
          $$

      - tipo: calcular
        titulo: El rendimiento exergético
        pregunta: |
          ¿Qué fracción del trabajo eléctrico ha quedado como exergía del
          vapor?
        respuesta:
          tipo: numero
          valor: '0.265'
          tolerancia: 0.02
          formato: una fracción entre 0 y 1
        distractores:
          - valor: '0.735'
            mensaje: |
              Esa es la fracción destruida, no la aprovechada. El rendimiento
              es lo que se recupera partido de lo que se gasta.
          - valor: '1'
            mensaje: |
              Sería 1 si el proceso fuese reversible, y no lo es: calentar con
              una resistencia destruye casi tres cuartas partes de la
              capacidad de producir trabajo que tenía la electricidad.
        pista: |
          $\eta_B = \dfrac{\Delta B_{vapor}}{W_e}$, y
          $\Delta B_{vapor} = W_e - B_D$ porque no sale nada más del tanque.
        desarrollo: |
          $$
          \Delta B = 1487{,}3 - 1093 = 394{,}3\ \text{kJ}
          \qquad
          \eta_B = \frac{394{,}3}{1487{,}3} = 0{,}265
          $$

      - tipo: justificar
        pregunta: Ordena la lectura del resultado. Una pieza es falsa.
        piezas:
          - texto: 'La electricidad es exergía pura: sus 1.487,3 kJ podrían haberse convertido enteros en trabajo.'
          - texto: 'Al disiparlos en una resistencia, solo 394 kJ quedan como capacidad de producir trabajo y el resto se destruye.'
          - texto: 'El primer principio también se resiente: de los 1.487,3 kJ eléctricos, solo 394 llegan al vapor.'
            trampa: true
            mensaje: |
              El primer principio no pierde nada: **los 1.487,3 kJ están
              todos** en el vapor como energía interna. Lo que se pierde es su
              **calidad**, y esa es la diferencia entre los dos principios que
              este ejercicio existe para enseñar. Energía, toda; exergía, un
              26 %.
    resolucion: |
      **Por qué hay entropía generada si no entra calor.** El tanque está
      aislado, así que $\int \delta Q/T = 0$ y el balance de entropía se queda
      en $S_{gen} = m(s_2-s_1)$: **toda** la entropía que gana el vapor la ha
      generado el proceso. La irreversibilidad no está en la pared, está en la
      resistencia — convertir trabajo en calor por efecto Joule no se deshace.

      **La exergía destruida.**

      $$
      S_{gen} = 1{,}5 \cdot (6{,}8959 - 4{,}4515) = 3{,}667\ \text{kJ/K}
      \qquad
      B_D = T_0 S_{gen} = 298{,}15 \cdot 3{,}667 = 1093\ \text{kJ}
      $$

      **El rendimiento.** La electricidad es exergía pura: sus 1.487,3 kJ
      valían enteros como trabajo. Del tanque no sale nada —ni calor, ni masa,
      ni trabajo de frontera—, así que lo que no se ha destruido se ha quedado
      dentro:

      $$
      \Delta B_{vapor} = 1487{,}3 - 1093 = 394{,}3\ \text{kJ}
      \qquad
      \eta_B = \frac{394{,}3}{1487{,}3} = 0{,}265
      $$

      **Y la conclusión, que vale para cualquier calefactor eléctrico.** El
      primer principio no echa nada en falta: los 1.487,3 kJ están todos
      dentro del vapor. Lo que se ha ido es la **calidad**: de una energía que
      valía el 100 % como trabajo queda un 26 %. Calentar con una resistencia
      es termodinámicamente lo más caro que se puede hacer con la electricidad,
      y por eso una bomba de calor —que la usa para **mover** calor en vez de
      para fabricarlo— gana por goleada.
  - id: exter2526-ext-2-el-intercambiador-que-pierde-un-diez-por-ciento
    titulo: El intercambiador que pierde un diez por ciento, y las tres corrientes de entropía
    fuente: Ejercicio 2 de la convocatoria extraordinaria de febrero de 2026 · Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica su resolución oficial, y el desarrollo está contrastado contra ella.
    nivel: examen
    enunciado: |
      A un intercambiador de calor entra un gasto de $2\ \text{kg/s}$ de
      nitrógeno a $20\ ^\circ\text{C}$ y se calienta hasta
      $40\ ^\circ\text{C}$ mediante $1.500\ \text{m}^{3}/\text{h}$ de aire a
      $75\ ^\circ\text{C}$ y $2\ \text{atm}$. El intercambiador tiene unas
      pérdidas de calor del $10\ \%$ del calor cedido por el aire. El medio
      circundante se encuentra a $17\ ^\circ\text{C}$.

      Calcúlese:

      a) La entropía generada en el intercambiador

      b) La exergía destruida en el intercambiador

      c) El rendimiento exergético del intercambiador

      Tómese como estado de referencia $15\ ^\circ\text{C}$ y $1\ \text{bar}$.
    pide: La entropía generada, la exergía destruida y el rendimiento exergético.
    pasos:
      - tipo: reconocer
        pregunta: |
          El balance de entropía de este intercambiador tiene **tres**
          términos, no dos. ¿Cuál es el tercero?
        opciones:
          - texto: El calor que se escapa al medio circundante
            correcta: true
            mensaje: |
              Eso es, y es lo que hace distinto a este ejercicio. Un
              intercambiador adiabático solo tiene las dos corrientes; aquí el
              10 % se va por la carcasa, y ese calor **se lleva entropía
              fuera** del volumen de control. Sin ese término la entropía
              generada sale negativa, que es imposible.
          - texto: El trabajo, que en un intercambiador no es nulo
            mensaje: |
              Un intercambiador no tiene partes móviles: no hay trabajo. Por
              eso el balance de energía se reduce a las entalpías y al calor
              perdido.
          - texto: La entropía del propio aparato, que se calienta
            mensaje: |
              En régimen permanente nada dentro del aparato cambia con el
              tiempo: la carcasa está a la temperatura que esté, pero
              estacionaria. Lo que entra y lo que sale es lo único que cuenta.
          - texto: La diferencia de presión entre las dos corrientes
            mensaje: |
              El enunciado no da caída de presión en ninguna de las dos, así
              que los términos $R'\ln(P_2/P_1)$ valen cero. Están escritos en
              la fórmula general, pero aquí no aportan.

      - tipo: calcular
        titulo: El gasto de aire
        pregunta: |
          $1.500\ \text{m}^{3}/\text{h}$ a $75\ ^\circ\text{C}$ y
          $2\ \text{atm}$. ¿Cuántos kilos por segundo son?
        respuesta:
          tipo: magnitud
          valor: '0.8454 kg/s'
          # Estrecha a propósito: el distractor de los 343 K queda a un 1,5 %,
          # y con el 2 % por defecto se daría por bueno. Lo cazó el guardián.
          tolerancia: 0.01
          formato: un gasto másico, con su unidad
        distractores:
          - valor: '0.4227 kg/s'
            mensaje: |
              Te has dejado las 2 atm y has usado 1. La densidad va con la
              presión: a doble presión, doble masa por el mismo volumen.
          - valor: '0.8578 kg/s'
            mensaje: |
              Has usado $343\ \text{K}$ en vez de $348$. Son 75 °C, no 70 — y
              conviene saberlo porque **la resolución oficial imprime ese 343**
              aunque su resultado esté calculado con 348.
        pista: |
          $\dot{m} = \dfrac{P\dot{V}}{R'T}$, con $2\ \text{atm} = 202{,}65\ \text{kPa}$.
        desarrollo: |
          $$
          \dot{m}_{aire} = \frac{202{,}65 \cdot \frac{1500}{3600}}{0{,}287 \cdot 348}
          = 0{,}8454\ \text{kg/s}
          $$

      - tipo: calcular
        titulo: La entropía generada
        pregunta: |
          Con $\dot{m}_{N_2}(s_2-s_1) = 0{,}1365$ y
          $\dot{m}_{aire}(s_4-s_3) = -0{,}14353\ \text{kW/K}$, y
          $\dot{Q} = -4{,}59\ \text{kW}$ hacia un medio a
          $17\ ^\circ\text{C}$, ¿cuánta entropía se genera?
        respuesta:
          tipo: magnitud
          valor: '0.008868 kW/K'
          tolerancia: 0.03
          formato: una entropía por unidad de tiempo, con su unidad
        distractores:
          - valor: '-0.00703 kW/K'
            mensaje: |
              Te has dejado el término del calor perdido. Sin él sale negativa,
              y una entropía generada negativa es la señal más clara de que
              falta un término del balance: el segundo principio lo prohíbe.
          - valor: '0.28003 kW/K'
            mensaje: |
              Has sumado las dos corrientes en vez de restarlas. El aire se
              enfría, así que su variación de entropía es **negativa** y entra
              en la suma con su signo.
        pista: |
          $\dot{S}_G = \dot{m}_{N_2}\Delta s_{N_2} + \dot{m}_{aire}\Delta s_{aire} - \dfrac{\dot{Q}}{T_{MC}}$.
        desarrollo: |
          $$
          \dot{S}_G = 0{,}1365 - 0{,}14353 - \frac{-4{,}59}{290}
          = 0{,}008868\ \text{kW/K}
          $$

      - tipo: calcular
        titulo: La exergía destruida
        pregunta: |
          Con el estado de referencia a $15\ ^\circ\text{C}$ y la entropía
          generada del paso anterior,
          $\dot{S}_G = 0{,}008868\ \text{kW/K}$, ¿cuánta exergía se destruye
          por segundo?
        respuesta:
          tipo: magnitud
          valor: '2.55 kW'
          # El distractor que usa 290 K en vez de 288 queda a un 0,8 %, así que
          # la tolerancia tiene que ser menor. Pero la entropía generada,
          # recalculada con los datos redondeados del paso anterior, se mueve
          # también un 0,8 %, y con medio por ciento la cuenta buena quedaba
          # fuera y el distractor dentro: lo destapó el recálculo del 12 de
          # septiembre de 2026. Por eso la pregunta da la entropía generada, y
          # con ella la cuenta es de un solo paso.
          tolerancia: 0.005
          formato: una potencia, con su unidad
        distractores:
          - valor: '4.62 kW'
            mensaje: |
              Esa es toda la exergía que cede el aire. No se destruye entera:
              2,03 kW se los queda el nitrógeno y 0,03 se van con el calor
              perdido.
          - valor: '2.57 kW'
            mensaje: |
              Has usado los $290\ \text{K}$ del medio circundante en vez de los
              $288$ del **estado de referencia**. Son dos temperaturas
              distintas y el enunciado las da por separado a propósito: una
              dice adónde va el calor, la otra contra qué se mide la exergía.
        pista: |
          $\dot{B}_D = T_0\,\dot{S}_G$, con $T_0$ la del estado de referencia.
        desarrollo: |
          $$
          \dot{B}_D = 288 \cdot 0{,}008868 = 2{,}55\ \text{kW}
          $$

      - tipo: justificar
        pregunta: Ordena el cálculo del rendimiento. Una pieza es falsa.
        piezas:
          - texto: 'Lo que se quiere es calentar el nitrógeno, así que la exergía útil es la que él gana: 2,033 kW.'
          - texto: 'Lo que se gasta para conseguirlo es la exergía que cede el aire, 4,619 kW, y el cociente da un 44 %.'
          - texto: 'El rendimiento sale bajo porque el intercambiador pierde el 10 % del calor por la carcasa.'
            trampa: true
            mensaje: |
              Las pérdidas apenas cuentan: de los 4,619 kW de exergía que cede
              el aire, el calor perdido solo se lleva **0,032**. Lo que hunde
              el rendimiento es otra cosa — transferir calor a través de un
              salto de 55 grados destruye 2,55 kW, ochenta veces más que las
              pérdidas. Aislar mejor la carcasa no arreglaría casi nada;
              acercar las dos temperaturas, sí.
    resolucion: |
      **Los tres términos del balance de entropía.** Un intercambiador
      adiabático tiene dos corrientes y ya está. Aquí hay un tercero, y es la
      trampa del ejercicio: el 10 % del calor se escapa por la carcasa, y ese
      calor **saca entropía** del volumen de control. El balance queda

      $$
      \dot{S}_G = \dot{m}_{N_2}(s_2-s_1) + \dot{m}_{aire}(s_4-s_3) - \frac{\dot{Q}}{T_{MC}}
      $$

      y la frontera se lleva hasta el medio circundante precisamente para que
      esa integral tenga una temperatura constante y conocida.

      **El gasto de aire.** Es lo primero y donde más se falla, porque el dato
      viene en metros cúbicos por hora:

      $$
      \dot{m}_{aire} = \frac{202{,}65 \cdot \frac{1500}{3600}}{0{,}287 \cdot 348}
      = 0{,}8454\ \text{kg/s}
      $$

      **La temperatura de salida del aire** sale del balance de energía con las
      pérdidas dentro: el nitrógeno recibe el 90 % de lo que cede el aire, así
      que $\theta_4 = 20{,}88\ ^\circ\text{C}$ y
      $\dot{Q} = -4{,}59\ \text{kW}$.

      **a) La entropía generada.**

      $$
      \dot{S}_G = 0{,}1365 - 0{,}14353 + \frac{4{,}59}{290} = 0{,}008868\ \text{kW/K}
      $$

      Conviene mirar el tamaño de los tres sumandos: dos de ellos rondan
      $0{,}14$ y el resultado es **cincuenta veces menor**. Eso quiere decir
      que un redondeo temprano se come la respuesta entera, y es el motivo de
      arrastrar cinco cifras hasta el final.

      **b) La exergía destruida.** Con el estado de referencia a 15 °C —que
      **no** es la temperatura del medio circundante, y el enunciado las
      separa a propósito—:

      $$
      \dot{B}_D = 288 \cdot 0{,}008868 = 2{,}55\ \text{kW}
      $$

      **c) El rendimiento.** Lo útil es lo que gana el nitrógeno y lo gastado
      es lo que cede el aire:

      $$
      \eta_B = \frac{2{,}033}{4{,}619} = 44\ \%
      $$

      **Y la lectura que cambia lo que uno haría con el aparato.** De los
      4,619 kW de exergía que cede el aire, el calor perdido por la carcasa se
      lleva **0,032**. Aislar mejor el intercambiador no arreglaría
      prácticamente nada. Lo que destruye 2,55 kW es transferir calor a través
      de un salto de 55 grados, y eso solo se corrige acercando las dos
      temperaturas — con más superficie, o cambiando el caudal. Un balance de
      energía habría señalado las pérdidas; solo el de exergía dice dónde está
      el problema de verdad.
  - id: exter2526-ext-3-los-dos-cascos-en-el-tunel-de-viento
    titulo: Los dos cascos en el túnel de viento, y la correlación que se queda corta
    fuente: Ejercicio 3 de la convocatoria extraordinaria de febrero de 2026 · Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica su resolución oficial, y el desarrollo está contrastado contra ella.
    nivel: examen
    enunciado: |
      En un ensayo experimental realizado en un túnel de viento se estudia la
      transferencia de calor por convección forzada externa en cascos
      sometidos a un flujo de aire frontal uniforme. Dos configuraciones
      distintas de casco, denominadas Casco A y Casco B, presentan la misma
      forma general y el mismo diámetro equivalente, pero difieren en
      aberturas, protuberancias y detalles geométricos superficiales. Durante
      el ensayo se midieron las pérdidas de calor por convección en ambos
      cascos bajo condiciones idénticas de flujo:

      **Casco A: 512,8 W/m². Casco B: 596,4 W/m².**

      Datos del ensayo: temperatura ambiente $18\ ^\circ\text{C}$; velocidad
      del aire frontal en el banco $21{,}6\ \text{km/h}$; temperatura
      superficial promedio del casco $30{,}5\ ^\circ\text{C}$; diámetro
      equivalente del casco $22\ \text{cm}$.

      Calcúlese:

      a) el coeficiente de convección correspondiente a cada casco, a partir de
      los datos experimentales.

      b) el número de Nusselt experimental para cada casco.

      c) el número de Reynolds del flujo de aire en el túnel de viento, tomando
      como longitud característica el diámetro equivalente del casco.

      d) utilizando la correlación empírica para convección forzada externa
      sobre una hemiesfera lisa, calcular el valor teórico de $Nu$ y del
      coeficiente de convección, para una temperatura característica igual a la
      temperatura de película.

      $$
      Nu = 2 + 0{,}6\,Re^{1/2}\,Pr^{1/3}
      $$

      e) comparar los resultados experimentales con los obtenidos mediante la
      correlación y discutir las posibles causas de las discrepancias.
    pide: Los coeficientes experimentales, los Nusselt, el Reynolds, el valor teórico y la comparación.
    pasos:
      - tipo: reconocer
        pregunta: |
          Las propiedades del aire hay que sacarlas a alguna temperatura.
          ¿A cuál?
        opciones:
          - texto: A la de película, la media entre la superficie y el aire
            correcta: true
            mensaje: |
              Eso es: $(30{,}5+18)/2 = 24{,}25\ ^\circ\text{C}$. En convección
              externa las propiedades se evalúan ahí porque es la temperatura
              representativa de la capa límite, que es donde ocurre todo. El
              enunciado además lo dice con todas las letras.
          - texto: A la del aire de la corriente libre, 18 °C
            mensaje: |
              Es la tentación, porque es el fluido «que hay». Pero el aire que
              transporta el calor es el de la capa límite, que está más
              caliente: entre la superficie y la corriente.
          - texto: A la de la superficie, 30,5 °C
            mensaje: |
              Esa es la del sólido, no la del fluido. Las propiedades que
              entran en $Re$, $Pr$ y $Nu$ son todas del aire.
          - texto: A 0 °C, que es la de referencia de las tablas
            mensaje: |
              Las tablas de propiedades del aire se leen a la temperatura de
              trabajo, no a una de referencia. Aquí, además, entre 0 y 24 °C la
              viscosidad cinemática cambia casi un 20 %.

      - tipo: calcular
        titulo: El coeficiente del casco A
        pregunta: |
          Con $512{,}8\ \text{W/m}^{2}$ y un salto de superficie a aire de
          $30{,}5$ a $18\ ^\circ\text{C}$, ¿cuánto vale $h$?
        respuesta:
          tipo: magnitud
          valor: '41 W/(m^2 K)'
          tolerancia: 0.01
          formato: un coeficiente de convección, con su unidad
        distractores:
          - valor: '16.81 W/(m^2 K)'
            mensaje: |
              Has dividido entre 30,5 en vez de entre la **diferencia** de
              temperaturas. La ley de Newton va con el salto, no con la
              temperatura de la pared.
          - valor: '28.49 W/(m^2 K)'
            mensaje: |
              Has usado los 18 °C. El salto es 30,5 menos 18, que son 12,5 K.
        pista: |
          $\dot{Q}/A = h\,(\theta_s - \theta_f)$.
        desarrollo: |
          $$
          h_A = \frac{512{,}8}{30{,}5-18} = 41\ \frac{\text{W}}{\text{m}^{2}\text{K}}
          $$

      - tipo: calcular
        titulo: El Reynolds del ensayo
        pregunta: |
          Con $21{,}6\ \text{km/h}$, $D = 22\ \text{cm}$ y
          $\nu = 1{,}5551 \cdot 10^{-5}\ \text{m}^{2}/\text{s}$ a la
          temperatura de película, ¿cuál es el Reynolds?
        respuesta:
          tipo: numero
          valor: '84900'
          # Absoluta, como toda respuesta `numero`. Decía 0.02, y la cuenta
          # exacta —6 · 0,22 / 1,5551·10⁻⁵ = 84.882— no entraba. Cuatrocientos
          # es un 0,5 %.
          tolerancia: 400
          formato: un número sin unidades
        distractores:
          - valor: '305600'
            mensaje: |
              Has metido los 21,6 km/h tal cual. Hay que pasarlos a metros por
              segundo: dividir entre 3,6 da 6 m/s.
          - valor: '3859'
            mensaje: |
              Has usado los 22 en centímetros sin pasarlos a metros. En el SI
              la longitud característica va en metros: 0,22.
        pista: |
          $Re = \dfrac{c\,D}{\nu}$, con $c$ en m/s y $D$ en metros.
        desarrollo: |
          $$
          Re = \frac{6 \cdot 0{,}22}{1{,}5551\cdot 10^{-5}} = 8{,}49\cdot 10^{4}
          $$

      - tipo: calcular
        titulo: El coeficiente que predice la correlación
        pregunta: |
          Con $Pr = 0{,}7298$ y $k = 0{,}0254545\ \text{W/(m}\cdot\text{K)}$,
          ¿qué coeficiente de convección sale de la correlación?
        respuesta:
          tipo: magnitud
          valor: '18.4 W/(m^2 K)'
          tolerancia: 0.02
          formato: un coeficiente de convección, con su unidad
        distractores:
          - valor: '41 W/(m^2 K)'
            mensaje: |
              Ese es el experimental del casco A. La gracia del ejercicio es
              que **no coinciden**: la correlación predice menos de la mitad.
          - valor: '159 W/(m^2 K)'
            mensaje: |
              Eso es el Nusselt, que es adimensional. Falta despejar $h$
              multiplicando por $k$ y dividiendo por $D$.
        pista: |
          Primero $Nu = 2 + 0{,}6\,Re^{1/2}Pr^{1/3}$, y después
          $h = Nu\,k/D$.
        desarrollo: |
          $$
          Nu = 2 + 0{,}6\,(8{,}49\cdot 10^{4})^{1/2}\,(0{,}729)^{1/3} = 159
          $$

          $$
          h = \frac{159 \cdot 0{,}0254545}{0{,}22} = 18{,}4\ \frac{\text{W}}{\text{m}^{2}\text{K}}
          $$

      - tipo: justificar
        pregunta: Ordena la discusión del apartado e). Una pieza es falsa.
        piezas:
          - texto: 'La correlación describe una hemiesfera **lisa**, y un casco real tiene aberturas, ranuras y protuberancias.'
          - texto: 'Esos detalles disparan la turbulencia en la capa límite y con ella el intercambio de calor, así que la correlación subestima: predice 18,4 donde se miden 41 y 47,7.'
          - texto: 'La discrepancia indica que el ensayo está mal hecho, porque la correlación es la referencia teórica correcta.'
            trampa: true
            mensaje: |
              Al revés: **el dato manda y la correlación es la aproximación**.
              Una correlación empírica vale para la geometría con la que se
              obtuvo, y aquí la geometría es otra. Que el experimento dé más
              del doble no invalida el ensayo — dice que el casco no es una
              hemiesfera lisa, que es justo lo que el enunciado avisa en la
              primera línea.
    resolucion: |
      **La temperatura de película, que decide todo lo demás.** Las propiedades
      del aire se leen a $(30{,}5+18)/2 = 24{,}25\ ^\circ\text{C}$: $Pr =
      0{,}7298$, $\nu = 1{,}5551\cdot 10^{-5}$, $k = 0{,}0254545$. Equivocar
      esta temperatura no da un error pequeño: entre 18 y 30 grados la
      viscosidad cinemática cambia lo bastante como para mover el Reynolds
      varios miles.

      **a) Los coeficientes experimentales.** Ley de Newton, con el salto de
      12,5 K:

      $$
      h_A = \frac{512{,}8}{12{,}5} = 41
      \qquad
      h_B = \frac{596{,}4}{12{,}5} = 47{,}7\ \frac{\text{W}}{\text{m}^{2}\text{K}}
      $$

      **b) Los Nusselt experimentales.**

      $$
      Nu_A = \frac{41 \cdot 0{,}22}{0{,}0254545} = 354{,}6
      \qquad
      Nu_B = \frac{47{,}7 \cdot 0{,}22}{0{,}0254545} = 412{,}4
      $$

      **c) El Reynolds.** 21,6 km/h son 6 m/s, y con $D = 0{,}22$ m:

      $$
      Re = \frac{6 \cdot 0{,}22}{1{,}5551\cdot 10^{-5}} = 8{,}49\cdot 10^{4}
      $$

      **d) Lo que predice la correlación.**

      $$
      Nu = 2 + 0{,}6\,(8{,}49\cdot 10^{4})^{1/2}(0{,}729)^{1/3} = 159
      \;\Longrightarrow\;
      h = \frac{159 \cdot 0{,}0254545}{0{,}22} = 18{,}4\ \frac{\text{W}}{\text{m}^{2}\text{K}}
      $$

      **e) Y la comparación, que es el apartado que vale.** El experimento da
      41 y 47,7; la correlación, 18,4. **Entre dos y dos veces y media más.**
      No es un error de cuentas: la correlación está obtenida para una
      hemiesfera lisa, y un casco tiene aberturas, entradas de aire, ranuras,
      bordes y zonas de recirculación. Todo eso desordena la capa límite,
      adelanta la transición a turbulento y aumenta la mezcla — y más mezcla es
      más transporte de calor. La correlación **subestima**, y lo hace en la
      dirección previsible.

      **Lo que hay que llevarse, y sirve para toda la asignatura.** Cuando un
      dato experimental y una correlación no coinciden, la sospecha va primero
      a la correlación: vale para la geometría con la que se midió y para nada
      más. Aquí el propio enunciado lo avisa —«hemiesfera lisa»— y describe
      unos cascos que no lo son. Que el casco B disipe un 16 % más que el A con
      el mismo diámetro equivalente es la misma idea en pequeño: la forma
      general no basta, los detalles mandan.
