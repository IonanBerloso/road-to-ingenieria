asignatura: ingenieria-termica
curso: '2025-2026'
convocatoria: extraordinaria
fecha: febrero de 2026
# La segunda convocatoria de Térmica que entra como página, y **la primera que
# se transcribe desde cero**: la de enero ya tenía sus ejercicios escritos y
# solo hubo que montarla.
#
# Como la de enero, trae la **resolución oficial completa**, así que cada
# desarrollo nuestro se puede contrastar línea a línea. Se ha hecho al revés
# de como tienta: primero se resuelve a ciegas desde el enunciado y solo
# después se abre la resolución del profesor. Es la única forma de que el
# contraste signifique algo — si se mira antes, uno acaba reproduciendo sus
# pasos en vez de comprobarlos.
#
# **Dos erratas de la propia resolución oficial, encontradas así.** En el
# ejercicio 2 el gasto de aire está impreso como `202,650 · (1500/3600) /
# (0,287 · 343)`, y su resultado, 0,8454 kg/s, sale con **348** K —que es
# 75 °C— y no con 343. El número publicado es el bueno; lo que está mal es el
# 343 escrito. Va dicho porque un alumno que rehaga la división con el 343
# impreso obtiene 0,8578 y va a creer que se ha equivocado él.
#
# Tres ejercicios y, por ahora, dos resoluciones: el 1 está entero y el 2 y el
# 3 están declarados abajo con lo que falta de cada uno. Un hueco declarado es
# información; uno escondido, una promesa incumplida.
pdf: 2025-2026-ext.pdf

fuera:
  - n: 2
    motivo: >-
      Un intercambiador de calor donde 2 kg/s de nitrógeno se calientan de 20 a
      40 °C con 1.500 m³/h de aire a 75 °C y 2 atm, con unas pérdidas del 10 %
      del calor cedido por el aire. Pide entropía generada, exergía destruida y
      rendimiento exergético. **Está resuelto y contrastado —0,0088 kW/K,
      2,55 kW y un 44 % — pero todavía no está escrito como ejercicio guiado.**
      No falta material ni cuadra mal ningún número: falta el trabajo de
      redactarlo, y se dice así en vez de dejar la convocatoria aparentando
      estar entera.
  - n: 3
    motivo: >-
      Un ensayo de dos cascos de bicicleta, comparando su pérdida convectiva
      por unidad de superficie —512,8 y 596,4 W/m²— a 30,5 °C de superficie y
      18 °C de ambiente. Es el hueco de transmisión de calor de la
      convocatoria, y el más interesante de los tres porque el examen lo
      plantea como un ensayo con datos medidos y no como una tubería. **Sin
      transcribir todavía**, por lo mismo que el 2: es trabajo pendiente, no un
      hueco de material.

ejercicios:
  # Ejercicio 1 · un tanque rígido y aislado con una resistencia dentro. Tres
