curso: '2025-2026'
convocatoria: extraordinaria
fecha: febrero de 2026
# La segunda convocatoria de Térmica que entra como página, y **la primera que
# se transcribe desde cero**: la de enero ya tenía sus ejercicios escritos y
# solo hubo que montarla.
#
# Como la de enero, trae la **resolución oficial completa**, así que cada
# desarrollo nuestro se puede contrastar línea a línea. Se ha hecho al revés
# de como tienta: primero se resuelve a ciegas desde el enunciado y solo
# después se abre la resolución del profesor. Es la única forma de que el
# contraste signifique algo — si se mira antes, uno acaba reproduciendo sus
# pasos en vez de comprobarlos.
#
# **Dos erratas de la propia resolución oficial, encontradas así.** En el
# ejercicio 2 el gasto de aire está impreso como `202,650 · (1500/3600) /
# (0,287 · 343)`, y su resultado, 0,8454 kg/s, sale con **348** K —que es
# 75 °C— y no con 343. El número publicado es el bueno; lo que está mal es el
# 343 escrito. Va dicho porque un alumno que rehaga la división con el 343
# impreso obtiene 0,8578 y va a creer que se ha equivocado él.
#
# **Los tres ejercicios están, en cuatro resoluciones**, y sin un solo `fuera`.
# El 1 se parte en dos —el balance de energía por un lado y el exergético por
# otro— porque son dos ideas distintas y la segunda es la que vale; el 2 y el 3
# van enteros.
#
# El 3 merece una nota aparte porque no se parece a nada del resto del corpus:
# es un **ensayo real en un túnel de viento** con dos cascos de ciclismo, y su
# último apartado no pide un número sino explicar por qué la correlación de
# hemiesfera lisa predice 18,4 W/m²K donde se miden 41 y 47,7. La respuesta
# —los detalles de la geometría disparan la turbulencia— es la lección que se
# lleva un alumno de convección forzada, y viene envuelta en la costumbre más
# sana que puede aprender: **cuando el dato y la correlación discrepan, la
# sospecha va primero a la correlación.**
pdf: 2025-2026-ext.pdf

