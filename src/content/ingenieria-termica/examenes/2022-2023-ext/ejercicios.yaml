ejercicios:
  - id: exter2223-ext-2-el-nitrogeno-que-se-reparte-y-la-irreversibilidad-que-manda
    titulo: El nitrógeno que se reparte, y cuál de las dos irreversibilidades manda
    fuente: Ejercicio 2 de la convocatoria extraordinaria de 2022-2023, celebrada el 30 de enero de 2023 · Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El PDF trae la resolución manuscrita del profesor; el desarrollo se hizo a ciegas desde el enunciado y se contrastó después contra ella.
    nivel: examen
    enunciado: |
      En un pabellón a $20\ ^\circ\text{C}$, hay un recipiente rígido y sin
      aislamiento térmico de $0{,}2\ \text{m}^{3}$ lleno de nitrógeno a
      $20\ \text{bar}$ y $60\ ^\circ\text{C}$. El recipiente está conectado a
      otro recipiente vacío mediante una válvula, que en un momento determinado
      se abre, tras lo cual, la presión en el nuevo estado de equilibrio pasa a
      ser de $5\ \text{bar}$. Calcúlese:

      a) El volumen del recipiente que inicialmente se encuentra vacío.

      b) La entropía total generada en el universo.

      c) Determínese porcentualmente, cuál es la principal fuente de
      irreversibilidad.

      NOTA: Considérese a efectos de la pregunta b), como temperatura del
      proceso la temperatura media entre el estado inicial y el estado final.
    pide: El volumen del depósito vacío, la entropía generada y de dónde sale.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado dice «sin aislamiento térmico». ¿Qué temperatura tiene
          el nitrógeno al final?
        opciones:
          - texto: 20 °C, la del pabellón, porque acaba equilibrándose con él
            correcta: true
            mensaje: |
              Eso es, y es el dato que desbloquea el ejercicio entero. «Sin
              aislamiento» y «nuevo estado de equilibrio» dicen juntos que el
              gas termina a la temperatura del local. Sin eso no se puede
              calcular ningún volumen.
          - texto: 60 °C, porque en una expansión contra el vacío no hay trabajo ni cambia la energía interna
            mensaje: |
              Eso valdría si el depósito estuviera **aislado**: entonces sí,
              $\Delta U = 0$ y la temperatura no cambia. Aquí no lo está, y el
              enunciado se molesta en decirlo. El gas se enfría hasta los
              20 °C del pabellón cediendo 120 kJ.
          - texto: Hay que calcularla con la relación de una adiabática, $TV^{\gamma-1}$
            mensaje: |
              Esa relación vale para un proceso adiabático **y reversible**, y
              aquí no se cumple ninguna de las dos: el depósito no está
              aislado, y un gas que se lanza contra el vacío no está en
              equilibrio en ningún instante intermedio.
          - texto: La media entre 60 y 20, que es lo que dice la NOTA
            mensaje: |
              Cuidado con dónde se usa esa media. La NOTA la reserva para el
              apartado b) —es la temperatura a la que se supone que sale el
              calor— y no es el estado final del gas. El estado final es el
              equilibrio con el pabellón: 20 °C.

      - tipo: calcular
        titulo: El volumen del depósito vacío
        pregunta: |
          Con el nitrógeno como gas ideal, ¿cuánto mide el recipiente que
          estaba vacío?
        respuesta:
          tipo: magnitud
          valor: '0.504 m^3'
          tolerancia: 0.02
          formato: un volumen, con su unidad
        distractores:
          - valor: '0.704 m^3'
            mensaje: |
              Ese es el volumen **total** de los dos depósitos juntos. El que
              se pide es solo el que estaba vacío: hay que restarle los 0,2 m³
              del primero.
          - valor: '0.6 m^3'
            mensaje: |
              Has trabajado solo con las presiones, $0{,}2 \cdot 20/5 = 0{,}8$,
              y eso supone que la temperatura no cambia. Cambia: baja de 60 a
              20 °C, y el gas ocupa menos de lo que esa cuenta dice.
        pista: |
          $\dfrac{P_1 V_1}{T_1} = \dfrac{P_2 V_2}{T_2}$, con $T_2 = 293\ \text{K}$.
        desarrollo: |
          $$
          V_2 = \frac{20}{5} \cdot 0{,}2 \cdot \frac{293}{333} = 0{,}704\ \text{m}^{3}
          $$

          $$
          V_B = 0{,}704 - 0{,}2 = 0{,}504\ \text{m}^{3}
          $$

      - tipo: calcular
        titulo: La entropía generada en el universo
        pregunta: |
          El gas son $4{,}044\ \text{kg}$, cede $120{,}06\ \text{kJ}$ al
          pabellón y su entropía varía en $+1{,}127\ \text{kJ/K}$. ¿Cuánta
          entropía se genera en el universo?
        respuesta:
          tipo: magnitud
          valor: '1.537 kJ/K'
          tolerancia: 0.02
          formato: una entropía, con su unidad
        distractores:
          - valor: '1.127 kJ/K'
            mensaje: |
              Esa es solo la del gas. El universo son las dos partes: falta lo
              que gana el pabellón al recibir los 120 kJ.
          - valor: '0.717 kJ/K'
            mensaje: |
              Has restado en vez de sumar. El pabellón **recibe** calor, así
              que su entropía sube, y las dos subidas se suman.
        pista: |
          $\Delta S_{univ} = \Delta S_{gas} + \dfrac{Q_{MC}}{T_{MC}}$, con el
          pabellón a $293\ \text{K}$.
        desarrollo: |
          $$
          \Delta S_{univ} = 1{,}127 + \frac{120{,}06}{293} = 1{,}127 + 0{,}41
          = 1{,}537\ \text{kJ/K}
          $$

      - tipo: justificar
        pregunta: Ordena de dónde sale esa entropía. Una pieza es falsa.
        piezas:
          - texto: 'Hay dos irreversibilidades: el trasvase del gas al abrirse la válvula, y el calor que cruza una diferencia finita de temperatura entre el sistema y el pabellón.'
          - texto: 'La del trasvase se aísla poniendo el calor a la temperatura media del proceso: $1{,}127 + 120{,}06/313 = 1{,}511$ kJ/K de los 1,537.'
          - texto: 'Como el recipiente no está aislado y pierde 120 kJ, la mayor irreversibilidad es la del calor que se escapa.'
            trampa: true
            mensaje: |
              Es lo que parece y es lo contrario. Esos 120 kJ cruzan un salto
              de apenas veinte grados, y eso genera **0,026 kJ/K: el 1,7 %**.
              El otro 98,3 % lo genera el gas al lanzarse contra el vacío, que
              no cuesta ni un julio de calor. **Perder energía y generar
              entropía son cosas distintas**, y este ejercicio existe para
              separarlas.
    resolucion: |
      **a) El dato que hay que ver antes de escribir nada.** «Sin aislamiento
      térmico» y «nuevo estado de equilibrio» dicen juntos que el nitrógeno
      acaba a los $20\ ^\circ\text{C}$ del pabellón. Con eso, la ecuación de
      estado entre los dos equilibrios da el volumen:

      $$
      V_2 = \frac{P_1}{P_2}\, V_A \,\frac{T_2}{T_1}
      = \frac{20}{5} \cdot 0{,}2 \cdot \frac{293}{333} = 0{,}704\ \text{m}^{3}
      $$

      $$
      V_B = 0{,}704 - 0{,}2 = 0{,}504\ \text{m}^{3}
      $$

      **b) El calor, y una entropía que sube mientras el gas se enfría.** El
      conjunto de los dos depósitos es rígido, así que no hay trabajo y todo el
      calor es variación de energía interna:

      $$
      Q = m\,c_v\,(T_2 - T_1) = 4{,}044 \cdot 0{,}742 \cdot (293 - 333)
      = -120{,}06\ \text{kJ}
      $$

      Y la variación de entropía del gas:

      $$
      \Delta S = 4{,}044\left[1{,}039\ln\frac{293}{333} - 0{,}297\ln\frac{5}{20}\right]
      = +1{,}127\ \text{kJ/K}
      $$

      Conviene pararse aquí. **El gas pierde calor —y con el calor se va
      entropía— y aun así su entropía sube.** No hay contradicción: el término
      de la presión, que cae de 20 bar a 5, pesa mucho más que el de la
      temperatura. Si te sale negativa, has perdido el signo del logaritmo de
      las presiones.

      El pabellón recibe esos 120 kJ a temperatura constante:

      $$
      \Delta S_{univ} = 1{,}127 + \frac{120{,}06}{293} = 1{,}537\ \text{kJ/K}
      $$

      **c) Y el reparto, que es lo que este ejercicio enseña.** Las dos
      irreversibilidades se separan usando la temperatura media que manda la
      NOTA, $T_m = (333+293)/2 = 313\ \text{K}$, como temperatura a la que sale
      el calor del sistema:

      $$
      S_{G,sist} = \Delta S - \frac{Q}{T_m} = 1{,}127 + \frac{120{,}06}{313}
      = 1{,}511\ \text{kJ/K}
      $$

      Eso es el **trasvase**. Lo que queda hasta el total, $1{,}537 - 1{,}511
      = 0{,}026$, es el calor cruzando los veinte grados que separan el sistema
      del pabellón. En porcentaje:

      | fuente | kJ/K | del total |
      |---|---|---|
      | el gas lanzándose contra el vacío | 1,511 | **98,3 %** |
      | el calor cruzando 20 grados | 0,026 | 1,7 % |

      **La lección.** Lo llamativo del enunciado es que el depósito no está
      aislado y pierde 120 kJ, y ahí es donde la intuición pone la culpa. Pero
      una pérdida de calor grande a través de un salto pequeño de temperatura
      genera poquísima entropía, mientras que una expansión libre —que no
      cuesta ni un julio— la genera a espuertas. **Perder energía y destruir
      calidad son cosas distintas**, y saber cuál te está costando dinero es
      media asignatura.

      Y una consecuencia práctica que sale sola: si quisieras arreglar este
      proceso, aislar el depósito no serviría de nada. Lo que habría que hacer
      es no dejar que el gas se expanda solo — poner una turbina en medio.
