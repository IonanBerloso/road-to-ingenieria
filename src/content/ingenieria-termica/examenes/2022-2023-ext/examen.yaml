asignatura: ingenieria-termica
convocatoria: extraordinaria
curso: '2022-2023'
fecha: 30 de enero de 2023
# Bilingüe, con el euskera en la primera página y el castellano en la segunda.
# Da **2,5 horas**.
#
# **Segunda convocatoria fechada a 30 de enero, y ya son dos.** Igual que la de
# 2023-2024, la escuela la llama «de febrero» y el papel dice 30 de enero, en
# sus dos idiomas. Con dos casos deja de parecer una errata de cabecera; lo que
# no sabemos es cómo se llama eso en el calendario oficial, así que se publica
# la fecha del documento y nada más (§13).
#
# Su ejercicio 2 es de los que justifican leer un examen entero antes de
# elegir: parece el problema de siempre de un depósito que se vacía en otro, y
# el apartado c) —**«determínese porcentualmente cuál es la principal fuente de
# irreversibilidad»**— lo convierte en otra cosa. Es el único del corpus que
# pide **repartir la entropía generada entre sus causas**, y el resultado
# desmiente a la intuición: el depósito pierde 120 kJ de calor por no estar
# aislado, y eso solo explica el 1,7 %.
pdf: 2022-2023-ext.pdf

fuera:
  - n: 1
    motivo: >-
      Una tobera con 2 kg/s de vapor de agua a 300 °C y 20 bar. Pide hasta qué
      presión hay que expandir para obtener 600 m/s de chorro, la variación de
      temperatura y el área de la sección de salida. **Sin transcribir**, y
      aquí el motivo no es de trabajo pendiente sino de material: la resolución
      oficial resuelve los tres apartados **leyendo el diagrama de Mollier**
      —entra con $h_2 = 2844$ kJ/kg y sale con 9,2 bar y 205 °C— y ese diagrama
      es de una editorial: los gráficos escaneados de un manual no se
      republican aquí, se redibujan, y este no está redibujado. Sin él, el
      ejercicio no se puede seguir paso a paso: quedaría el enunciado y un
      número que hay que creerse. El propio profesor deja escrito por qué
      hace falta más de una lectura, y es la clase de detalle que convendría
      enseñar: **en el diagrama de Mollier no se representan las isócoras**, así
      que el volumen específico de salida hay que buscarlo en otro sitio.
  - n: 3
    motivo: >-
      Una tubería de hierro fundido de 50 mm de diámetro interior, 5 mm de
      espesor y 1,2 m de longitud, con 2 kg/s de agua líquida que entra a 38 °C
      y sale a 45 °C, y que pide la temperatura superficial exterior con
      $k = 52$ W/(m·K). **Sin transcribir todavía**: no falta material —el PDF
      trae su resolución oficial— sino el trabajo de escribirlo. Es el molde de
      convección interna en tubería con el que ya cuentan tres convocatorias
      del corpus, así que entra cuando toque y no arrastra nada.

      **Y tiene una razón extra para no dejarlo mucho más**: es el mismo
      enunciado, dígito a dígito, que el ejercicio 3 de junio de 2015 —una de
      las dos convocatorias que están solo en euskera y que por eso no se
      pueden montar—. Resolverlo aquí es lo más cerca que el sitio puede estar
      de cubrir aquella.

