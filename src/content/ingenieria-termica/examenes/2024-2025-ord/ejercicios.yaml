ejercicios:
  - id: exter2425-ord-1-el-compresor-reversible-que-destruye-exergia
    titulo: El compresor reversible que destruye exergía
    fuente: >-
      Ejercicio 1 de la convocatoria ordinaria de enero de 2024-2025 ·
      Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen publica su resolución oficial manuscrita, y los siete valores del
      desarrollo están rehechos y contrastados contra ella, incluidos los
      −2.184,53 kW de potencia.
    nivel: examen
    enunciado: |
      En un compresor **reversible** entran $2\ \text{kg/s}$ de helio a
      $1\ \text{bar}$ y $20\ \text{°C}$. La relación de compresión es
      $5$ y la temperatura del helio a la salida es de $90\ \text{°C}$.

      a) La variación de entropía del helio por unidad de tiempo.

      b) El exponente politrópico del proceso de compresión.

      c) La potencia del compresor.

      d) La exergía destruida en el universo por unidad de tiempo.

      **Nota**: considérese la temperatura de referencia igual a la del medio
      circundante, $15\ \text{°C}$.

      Datos del helio: $c_p = 5{,}19$, $c_v = 3{,}11$,
      $R' = 2{,}077\ \text{kJ/(kg·K)}$, $\gamma = 1{,}667$.
    pide: La variación de entropía, el exponente, la potencia y la exergía destruida.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado dice que el compresor es **reversible**. ¿Qué se puede
          anticipar de la exergía destruida en el universo?
        opciones:
          - texto: >-
              Nada todavía: reversible se refiere a lo que pasa dentro del
              compresor, y el calor que cede va a parar a un ambiente que está
              a otra temperatura
            correcta: true
            mensaje: |
              Exacto, y es la trampa entera del ejercicio. La resolución
              oficial lo dice con estas palabras: «aunque el compresor sea
              reversible, el intercambio de calor entre el compresor y el
              medio circundante es irreversible al ser motivado por una
              diferencia finita de temperaturas».
          - texto: >-
              Que vale cero, porque un proceso reversible no destruye exergía
            mensaje: |
              Sería cierto si el universo se acabara en la carcasa del
              compresor. El helio entra a 20 °C y sale a 90, y el calor que
              cede lo recibe un ambiente a 15: ahí hay un salto finito de
              temperatura, y eso es irreversible.
          - texto: >-
              Que es negativa, porque el compresor consume trabajo
            mensaje: |
              La exergía destruida nunca es negativa: es $T_0 S_G$ con
              $S_G \ge 0$. Que el compresor consuma trabajo afecta al signo de
              la potencia, no al de la destrucción.

      - tipo: calcular
        titulo: La variación de entropía del helio
        pregunta: |
          ¿Cuánto vale $\Delta\dot S_{12}$?
        respuesta:
          tipo: magnitud
          valor: '-4.462 kW/K'
          tolerancia: 0.02
          formato: una entropía por unidad de tiempo, con su unidad
        distractores:
          - valor: '4.462 kW/K'
            mensaje: |
              El signo. El helio se comprime y cede calor, así que su entropía
              **baja**. Los dos términos de la fórmula tiran en sentidos
              contrarios y gana el de la presión, que se multiplica por
              $\ln 5$.
          - valor: '-5.353 kW/K'
            mensaje: |
              Has usado $c_v$ en vez de $c_p$. En un volumen de control lo que
              se contabiliza es la entalpía, así que el calor específico que
              entra en la fórmula de la entropía es $c_p$. La forma con $c_v$
              existe, pero va emparejada con el cociente de **volúmenes**, no
              con el de presiones.
        pista: |
          Con las temperaturas en kelvin y la relación de compresión como
          cociente de presiones:

          $$
          \Delta\dot S = \dot m\left[c_p\ln\frac{T_2}{T_1} - R'\ln\frac{P_2}{P_1}\right]
          $$
        desarrollo: |
          $$
          \Delta\dot S_{12} = 2\left[5{,}19\ln\!\frac{363}{293}
          - 2{,}077\ln 5\right]
          $$
          $$
          = 2\,[1{,}1117 - 3{,}3427] = -4{,}462\ \frac{\text{kW}}{\text{K}}
          $$

          Comprimir baja la entropía más de lo que la sube calentarse. Es lo
          normal en un compresor refrigerado, y aquí se ve en que el término
          de la presión es tres veces el de la temperatura.

      - tipo: calcular
        titulo: El exponente politrópico
        pregunta: |
          ¿Cuál es el exponente del proceso de compresión?
        respuesta:
          tipo: numero
          valor: '1.1535'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '1.667'
            mensaje: |
              Ese es $\gamma$, el exponente del proceso **adiabático**. Aquí no
              lo es: el compresor cede calor, y por eso su exponente se queda
              muy por debajo, cerca del isotermo.
          - valor: '0.1331'
            mensaje: |
              Eso es $(n-1)/n$, un paso intermedio. Falta despejar: de
              $(n-1)/n = 0{,}1331$ sale $n = 1/(1-0{,}1331)$.
        pista: |
          De $\dfrac{T_2}{T_1} = \left(\dfrac{P_2}{P_1}\right)^{\frac{n-1}{n}}$,
          toma logaritmos y despeja.
        desarrollo: |
          $$
          \ln\!\frac{363}{293} = \frac{n-1}{n}\ln 5
          \;\Longrightarrow\;
          \frac{n-1}{n} = \frac{0{,}2142}{1{,}6094} = 0{,}1331
          $$

          $$
          n = \frac{1{,}6094}{1{,}6094 - 0{,}2142} = 1{,}1535
          $$

          Muy cerca de 1, que es el isotermo. Tiene sentido: el compresor está
          refrigerado, así que la temperatura sube mucho menos de lo que subiría
          en una compresión adiabática.

      - tipo: calcular
        titulo: La potencia del compresor
        pregunta: |
          ¿Qué potencia consume el compresor?
        respuesta:
          tipo: magnitud
          valor: '-2184.5 kW'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '2184.5 kW'
            mensaje: |
              El signo. Un compresor **consume**, así que con el convenio de la
              asignatura su trabajo es negativo. Fíjate en la fórmula: el
              paréntesis es $(T_1 - T_2)$, y $T_2$ es mayor.
          - valor: '-726.6 kW'
            mensaje: |
              Has usado $\dot m\,c_p\,\Delta T$, que es el salto de entalpía y
              no el trabajo. En un proceso politrópico con intercambio de calor
              los dos son distintos: la diferencia es justamente el calor
              cedido.
        pista: |
          Para un politrópico en régimen estacionario,
          $\dot W = \dot m\,\dfrac{n}{n-1}\,R'\,(T_1-T_2)$.
        desarrollo: |
          El trabajo de un proceso reversible en un volumen de control es
          $-\int v\,dP$, y con la ley politrópica esa integral se resuelve:

          $$
          \dot W_c = \dot m\,\frac{n}{n-1}\,R'\,(T_1-T_2)
          = 2\cdot\frac{1{,}1535}{0{,}1535}\cdot 2{,}077\cdot(293-363)
          $$
          $$
          = -2184{,}5\ \text{kW}
          $$

      - tipo: calcular
        titulo: La exergía destruida en el universo
        pregunta: |
          Con $\dot Q_c = -1457{,}9\ \text{kW}$ cedidos al ambiente a
          $15\ \text{°C}$, ¿cuánta exergía destruye el universo?
        respuesta:
          tipo: magnitud
          valor: '172.9 kW'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '0 kW'
            mensaje: |
              Es la respuesta que da el enunciado si te quedas en la palabra
              «reversible». Lo es **dentro** del compresor; fuera, el calor cae
              desde un helio que está entre 20 y 90 °C hasta un ambiente a 15,
              y ese salto finito destruye exergía.
          - valor: '0.6 kW'
            mensaje: |
              Eso es la entropía generada, en kW/K. Guy-Stodola la convierte en
              potencia multiplicando por la temperatura del ambiente en kelvin,
              288.
        pista: |
          $\Delta\dot S_{MC} = -\dot Q_c/T_{MC}$, se suma a la del helio, y el
          total es entropía generada porque el universo está aislado.
        desarrollo: |
          El medio circundante es un depósito térmico, así que recibe el calor
          a temperatura constante:

          $$
          \Delta\dot S_{MC} = \frac{-\dot Q_c}{T_{MC}} = \frac{1457{,}9}{288}
          = 5{,}06\ \frac{\text{kW}}{\text{K}}
          $$

          $$
          \dot S_{G,univ} = -4{,}462 + 5{,}06 = 0{,}6\ \frac{\text{kW}}{\text{K}}
          $$

          $$
          \dot{Ex}_D = T_0\,\dot S_{G,univ} = 288\cdot 0{,}6 = 172{,}9\ \text{kW}
          $$

      - tipo: justificar
        pregunta: Ordena por qué destruye exergía un compresor reversible. Una pieza es falsa.
        piezas:
          - texto: >-
              Dentro del compresor no hay irreversibilidad: el enunciado lo
              declara reversible y el proceso tiene una ley politrópica.
          - texto: >-
              Pero el compresor cede 1.457,9 kW de calor a un ambiente que está
              a 15 °C, mientras el helio está entre 20 y 90.
          - texto: >-
              Ese salto finito de temperatura es irreversible —es la tercera
              condición del tema 5— y genera 0,6 kW/K en el universo.
          - texto: >-
              Y si el compresor fuese adiabático, la exergía destruida sería
              todavía mayor, porque el helio saldría más caliente.
            trampa: true
            mensaje: |
              Sería **cero**. Sin calor que cruce hacia el ambiente no hay
              transferencia con salto finito, y un compresor adiabático y
              reversible es isentrópico: no destruye nada. Que el helio saliera
              más caliente encarecería el trabajo, que es otra cosa; la
              destrucción de exergía viene del calor, no de la temperatura de
              salida.
    resolucion: |
      **a) La variación de entropía del helio.**

      $$
      \Delta\dot S_{12} = 2\left[5{,}19\ln\!\frac{363}{293} - 2{,}077\ln 5\right]
      = -4{,}462\ \frac{\text{kW}}{\text{K}}
      $$

      **b) El exponente politrópico.** De la relación entre temperaturas y
      presiones:

      $$
      n = \frac{\ln 5}{\ln 5 - \ln(363/293)} = \frac{1{,}6094}{1{,}3952}
      = 1{,}1535
      $$

      **c) La potencia.** El proceso es reversible, así que el trabajo es
      $-\int v\,dP$, que con la ley politrópica se integra:

      $$
      \dot W_c = 2\cdot\frac{1{,}1535}{0{,}1535}\cdot 2{,}077\cdot(293-363)
      = -2184{,}5\ \text{kW}
      $$

      **d) La exergía destruida.** El calor cedido sale del balance de energía
      o, más corto, del calor específico politrópico:

      $$
      c_n = \frac{\gamma-n}{1-n}\,c_v = \frac{1{,}667-1{,}1535}{1-1{,}1535}
      \cdot 3{,}11 = -10{,}41
      \qquad
      \dot Q_c = 2\cdot(-10{,}41)\cdot 70 = -1457{,}9\ \text{kW}
      $$

      $$
      \Delta\dot S_{MC} = \frac{1457{,}9}{288} = 5{,}06
      \qquad
      \dot S_{G,univ} = -4{,}462 + 5{,}06 = 0{,}6\ \frac{\text{kW}}{\text{K}}
      $$

      $$
      \dot{Ex}_D = 288\cdot 0{,}6 = 172{,}9\ \text{kW}
      $$

      **La lección, y es de las buenas.** El enunciado regala la palabra
      «reversible» y medio examen se la cree. Lo es dentro del aparato; el
      universo incluye el ambiente, y entre el helio y el ambiente hay hasta setenta
      y cinco grados de diferencia en el punto más caliente. La resolución oficial lo cierra así:
      *aunque el compresor sea reversible, el intercambio de calor con el medio
      circundante es irreversible al ser motivado por una diferencia finita de
      temperaturas*.
  - id: exter2425-ord-3-la-pared-por-dos-caminos-y-el-numero-que-sobraba
    titulo: La pared por dos caminos, y el dato que parecía sobrar
    fuente: >-
      Ejercicio 3 de la convocatoria ordinaria de enero de 2024-2025 ·
      Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen exige resolver los dos primeros apartados de las dos maneras
      —analíticamente y por analogía eléctrica—, y publica su resolución
      oficial manuscrita; los cinco valores están rehechos y contrastados
      contra ella.
    nivel: examen
    enunciado: |
      Una pared de conductividad térmica $12\ \text{W/(m·K)}$, altura
      $1{,}5\ \text{m}$ y espesor $30\ \text{cm}$ está en contacto con aire
      exterior **en reposo** a $5\ \text{°C}$. La superficie interior de la
      pared se encuentra a $22\ \text{°C}$ y las pérdidas de calor a través de
      la pared son de $80\ \text{W/m}^{2}$.

      a) La temperatura superficial exterior de la pared.

      b) El coeficiente de convección entre la pared y el aire exterior.

      c) El número de Nusselt en la capa límite térmica exterior.

      **Atención**: los apartados a) y b) deben resolverse de ambas maneras,
      tanto analíticamente como empleando la analogía eléctrica.

      **Nota**: para los parámetros adimensionales de la convección debe
      utilizarse como temperatura característica la media entre la de la
      superficie y la del fluido.

      Dato: conductividad del aire a la temperatura característica,
      $k_f = 0{,}02458\ \text{W/(m·K)}$.
    pide: La temperatura exterior, el coeficiente de convección y el Nusselt.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado dice que el aire exterior está **en reposo**. ¿Qué
          decide eso?
        opciones:
          - texto: >-
              Que la convección exterior es natural, no forzada, y con ella la
              correlación y la longitud característica que hay que usar
            correcta: true
            mensaje: |
              Exacto. Y en convección natural sobre una placa plana vertical la
              longitud característica es **la altura**, que es de donde sale
              el 1,5 m del enunciado: el dato que parecía no hacer falta en
              ningún sitio.
          - texto: >-
              Que no hay convección: sin movimiento del aire, el calor solo
              sale por conducción
            mensaje: |
              El aire se mueve solo, empujado por su propia diferencia de
              densidades al calentarse junto a la pared. Eso es precisamente
              la convección natural, y es la que gobierna la cara exterior de
              cualquier fachada.
          - texto: >-
              Que el coeficiente de convección es el del aire quieto, un valor
              tabulado
            mensaje: |
              No hay un valor tabulado universal: $h$ depende de la geometría,
              del salto de temperatura y de las propiedades del aire. Aquí, de
              hecho, sale del balance —80 W/m² entre 15 grados— y no de
              ninguna tabla.

      - tipo: calcular
        titulo: La temperatura de la cara exterior
        pregunta: |
          ¿A qué temperatura está la superficie exterior de la pared?
        respuesta:
          tipo: magnitud
          valor: '20 C'
          tolerancia: 0.005
          formato: una temperatura, con su unidad
        distractores:
          - valor: '2 C'
            mensaje: |
              Ese es el **salto** que produce la pared,
              $\dot q\,L/k = 2$ grados, no la temperatura de la cara. Hay que
              restárselo a los 22 de la cara interior.
          - valor: '-178 C'
            mensaje: |
              Has metido el espesor en centímetros: $80\cdot 30/12 = 200$
              grados de caída, en una pared de treinta centímetros. El
              resultado debería haberte parado antes de escribirlo. La
              conductividad va en W/(m·K), así que el espesor va en metros.
        pista: |
          Por la analogía, $\dot q = (\theta_1-\theta_2)/(L/k)$, con
          $L/k = 0{,}3/12$.
        desarrollo: |
          **Por la analogía eléctrica**, la resistencia de conducción por
          unidad de área es $L/k = 0{,}3/12 = 0{,}025$:

          $$
          80 = \frac{22 - \theta_2}{0{,}025}
          \;\Longrightarrow\;
          \theta_2 = 20\ \text{°C}
          $$

          **Y analíticamente**, integrando la ecuación de la conducción en
          régimen permanente, sin generación y con $k$ constante:

          $$
          \frac{d^{2}\theta}{dx^{2}} = 0
          \;\Longrightarrow\;
          \theta(x) = C_1x + C_2
          $$

          La condición de contorno **de primera especie** —temperatura
          impuesta— da $C_2 = 22$; la **de segunda especie** —flujo impuesto—
          da $C_1$ por la ley de Fourier, $80 = -12\,C_1$, es decir
          $C_1 = -6{,}67$. Y entonces

          $$
          \theta(0{,}3) = -6{,}67\cdot 0{,}3 + 22 = 20\ \text{°C}
          $$

          Los dos caminos dan lo mismo porque son el mismo: la analogía es esa
          integración ya hecha.

      - tipo: calcular
        titulo: El coeficiente de convección
        pregunta: |
          ¿Cuánto vale el coeficiente de película entre la pared y el aire?
        respuesta:
          tipo: magnitud
          valor: '5.33 W/m2 K'
          tolerancia: 0.02
          formato: un coeficiente de película, con su unidad
        distractores:
          - valor: '4.71 W/m2 K'
            mensaje: |
              Has usado el salto entre la cara **interior** y el aire, 22
              menos 5. La resistencia de convección va solo de la superficie
              exterior al aire: sus dos extremos son 20 y 5.
          - valor: '0.1875 W/m2 K'
            mensaje: |
              Eso es la **resistencia** de convección por unidad de área,
              $1/h$, en m²·K/W. El coeficiente es su inversa, y la unidad lo
              delata.
        pista: |
          Ley de enfriamiento de Newton: $\dot q = h\,(\theta_2 - \theta_f)$,
          con la misma densidad de flujo de 80 W/m².
        desarrollo: |
          En régimen permanente el mismo calor que atraviesa la pared por
          conducción sale al aire por convección — es la **condición de
          contorno de tercera especie**:

          $$
          h = \frac{\dot q}{\theta_2 - \theta_f} = \frac{80}{20 - 5}
          = 5{,}33\ \frac{\text{W}}{\text{m}^{2}\text{K}}
          $$

          Por analogía sale igual, resolviendo el circuito entero de una vez:

          $$
          80 = \frac{22-5}{\dfrac{0{,}3}{12} + \dfrac{1}{h}}
          \;\Longrightarrow\;
          h = 5{,}33
          $$

          Y fíjate en el reparto: la conducción aporta 0,025 de resistencia y
          la convección 0,1875, siete veces y media más. Treinta centímetros
          de pared pesan menos que la película de aire quieto que tiene
          pegada.

      - tipo: calcular
        titulo: El número de Nusselt
        pregunta: |
          ¿Cuál es el número de Nusselt en la capa límite exterior?
        respuesta:
          tipo: numero
          valor: '325.5'
          tolerancia: 0.01
          formato: un número, sin unidades
        distractores:
          - valor: '65.1'
            mensaje: |
              Has usado el **espesor** de la pared, 0,3 m, como longitud
              característica. En convección natural sobre una placa vertical
              la longitud característica es la **altura**: por eso el enunciado
              da los 1,5 m, que no hacen falta para ninguna otra cosa.
          - valor: '0.0031'
            mensaje: |
              Has invertido la fracción. El Nusselt compara la convección con
              la conducción en la capa límite, así que el coeficiente de
              película va arriba: $\text{Nu} = h\,\Pi/k_f$.
        pista: |
          $\text{Nu} = h\,\Pi/k_f$, con $\Pi$ la altura de la pared.
        desarrollo: |
          La temperatura característica, como dice el enunciado, es la media
          entre superficie y fluido:

          $$
          \theta_{cc} = \frac{5+20}{2} = 12{,}5\ \text{°C}
          $$

          y a ella se lee la conductividad del aire. Con la altura como
          longitud característica:

          $$
          \text{Nu} = \frac{h\,\Pi}{k_f} = \frac{5{,}33\cdot 1{,}5}{0{,}02458}
          = 325{,}5
          $$

      - tipo: justificar
        pregunta: Ordena por qué el enunciado da la altura. Una pieza es falsa.
        piezas:
          - texto: >-
              La altura no aparece en la conducción: la resistencia de una
              pared plana es $L/k$ con $L$ el espesor, y el área se cancela al
              trabajar por metro cuadrado.
          - texto: >-
              Tampoco en el coeficiente de convección, que sale de dividir la
              densidad de flujo entre el salto de temperatura.
          - texto: >-
              Aparece solo en el Nusselt, porque en convección natural sobre
              una placa vertical la longitud característica es la altura.
          - texto: >-
              Y si la pared fuese el doble de alta, el coeficiente de
              convección sería el doble.
            trampa: true
            mensaje: |
              El coeficiente no cambiaría: sale de 80 W/m² entre 15 grados, y
              ninguno de los dos depende de la altura. Lo que se duplicaría es
              el **Nusselt**, que es un número adimensional y lleva la altura
              dentro. Confundir «h depende de la geometría» con «h se calcula
              con la geometría» es el paso en falso: aquí $h$ se ha medido, no
              se ha correlacionado.
    resolucion: |
      **a) La cara exterior, a 20 °C.** Por la analogía, con
      $L/k = 0{,}025$:

      $$
      80 = \frac{22-\theta_2}{0{,}025} \;\Longrightarrow\; \theta_2 = 20\ \text{°C}
      $$

      Y analíticamente, integrando $d^{2}\theta/dx^{2} = 0$ con la condición
      de primera especie —$\theta(0) = 22$— y la de segunda —$\dot q = -k\,C_1$,
      de donde $C_1 = -6{,}67$—, sale $\theta(0{,}3) = 20$. Los dos caminos
      coinciden porque la analogía **es** esa integración ya hecha.

      **b) El coeficiente, 5,33 W/(m²·K).** Condición de tercera especie: el
      calor que sale por conducción entra al aire por convección.

      $$
      h = \frac{80}{20-5} = 5{,}33\ \frac{\text{W}}{\text{m}^{2}\text{K}}
      $$

      **c) El Nusselt, 325,5.** Convección natural en placa vertical: la
      longitud característica es la altura y la temperatura característica, la
      media entre superficie y fluido.

      $$
      \text{Nu} = \frac{5{,}33\cdot 1{,}5}{0{,}02458} = 325{,}5
      $$

      **Lo que hay que llevarse.** Este ejercicio enseña dos cosas que no se
      ven en el resultado. La primera es que la analogía eléctrica y la
      integración son lo mismo, y por eso el examen las pide las dos: para que
      no uses la analogía como una receta. La segunda es que un dato del
      enunciado que no encaja en ninguna cuenta —los 1,5 m de altura— casi
      siempre está señalando qué correlación toca; aquí, que la convección es
      natural y sobre una placa vertical.
