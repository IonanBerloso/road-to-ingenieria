asignatura: ingenieria-termica
curso: '2024-2025'
convocatoria: ordinaria
fecha: enero de 2025
# **Este examen sale solo en euskera**, sin versión en castellano. No es un
# descuido del cuadernillo: de las diecisiete convocatorias comparables, unas
# son bilingües —enero de 2023—, otras solo en castellano —enero de 2018— y
# esta solo en euskera. Conviene saberlo antes del día del examen, porque no
# se elige.
#
# Es además el único de los leídos que **publica el peso de cada apartado**
# dentro del ejercicio: 25 % cada uno en el 1, 50 % y 50 % en el 2, y en el 3
# un reparto que dice mucho —20 % analítico y 20 % por analogía eléctrica para
# los apartados a) y b), y 20 % para el Nusselt—. O sea que **exige resolver
# lo mismo por los dos caminos y puntúa cada uno por separado**. Aun así no se
# rellena el campo `puntos`, que espera un reparto por competencia y esto es
# un reparto por apartado (§10).
#
# «Denbora: 2.5 ordu» — dos horas y media, como la mayoría.
pdf: 2024-2025-ord.pdf

fuera:
  - n: 2
    motivo: >-
      Cinco litros de agua a 90 °C que se vierten sobre un depósito adiabático
      con quince litros a 20 °C, y pide la variación de entropía específica del
      agua que ya estaba y la exergía destruida en el universo. **Sin
      transcribir todavía**, y es el que más pena da porque es **el molde que
      más se repite de toda la asignatura** —algo caliente metido en agua
      dentro de un recipiente adiabático— y sale también en febrero de 2020 y
      en febrero de 2025. El sitio tiene un ejemplo propio escrito justo para
      ese molde, así que el escalón no se queda cojo; lo que falta es la
      versión tal como cayó.

ejercicios:
  - id: exter2425-ord-1-el-compresor-reversible-que-destruye-exergia
    tema: t04-volumen-de-control
    n: 1
  - id: exter2425-ord-3-la-pared-por-dos-caminos-y-el-numero-que-sobraba
    tema: t09-conveccion
    n: 3
