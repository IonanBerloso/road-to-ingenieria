# **Es bilingüe**: el euskera en la primera página y el castellano en la
# segunda. Aquí se publicó el 10 de septiembre de 2026 diciendo que **salía
# solo en euskera**, y era falso: se había mirado la página 1 y se dio por
# hecho el resto. Corregido el mismo día. La lección es la de siempre en este
# proyecto —**mirar una página no es mirar el documento**— y es más cara de lo
# que parece, porque esa afirmación falsa dejaba fuera de alcance un ejercicio
# perfectamente transcribible.
#
# Lo que sí es cierto es que los tres formatos existen: enero de 2018 sale solo
# en castellano, este y enero de 2023 son bilingües, y las dos convocatorias de
# 2014-2015 —un folio cada una— solo en euskera. No se elige cuál te toca.
#
# Es además el único de los leídos que **publica el peso de cada apartado**
# dentro del ejercicio: 25 % cada uno en el 1, 50 % y 50 % en el 2, y en el 3
# un reparto que dice mucho —20 % analítico y 20 % por analogía eléctrica para
# los apartados a) y b), y 20 % para el Nusselt—. O sea que **exige resolver
# lo mismo por los dos caminos y puntúa cada uno por separado**. Aun así no se
# rellena el campo `puntos`, que espera un reparto por competencia y esto es
# un reparto por apartado (§10).
#
# «Denbora: 2.5 ordu» — dos horas y media, como la mayoría.
