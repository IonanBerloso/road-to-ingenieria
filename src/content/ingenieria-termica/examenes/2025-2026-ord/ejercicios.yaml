ejercicios:
  - id: exter2526-ord-1-el-exponente-que-sale-del-calor
    titulo: El exponente politrópico que sale del calor
    fuente: >-
      Apartado a) del ejercicio 1 de la convocatoria ordinaria de enero de
      2026 · Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU).
      El examen publica su resolución oficial, y el desarrollo está
      contrastado contra ella.
    nivel: examen
    enunciado: |
      En un cilindro pistón se expanden 3 kg de aire desde 6 bar y 0,8 m3
      hasta 27 °C según un proceso reversible, a través del cual se
      intercambian 240 KJ de calor hacia el medio circundante, que se
      encuentra a 20 °C. Calcúlese:

      a- el exponente politrópico del proceso

      b- la entropía generada en el proceso que ocurre en el cilindro-pistón

      c- la entropía generada en el universo

      d- la variación de exergía del universo

      e- el rendimiento exergético del proceso en el universo

      Tómese como estado de referencia 15°C y 1 bar.

      *De los cinco apartados, aquí se resuelve el **a)**. Los b) y c) van en
      la pieza siguiente y el d) en la tercera; el e) todavía no está, y la
      página de la convocatoria lo dice.*
    pide: El apartado a) del examen, el exponente politrópico, pasando por la temperatura del estado 1.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado da el calor, la masa y las dos temperaturas, y pide el
          exponente. ¿Qué relación conecta esas cosas?
        opciones:
          - texto: >-
              El calor específico politrópico: $Q = m\,c_n\,\Delta T$ da
              $c_n$, y $n = (c_n - c_p)/(c_n - c_v)$ da el exponente
            correcta: true
            mensaje: |
              Exacto. Es la única relación del tema que va **del calor al
              exponente**; las otras tres —las de $T$, $P$ y $v$— necesitan ya
              conocer $n$ para dar algo.
          - texto: >-
              La relación $T_2/T_1 = (P_2/P_1)^{(n-1)/n}$, despejando $n$
            mensaje: |
              Esa serviría si conocieras las dos presiones, y aquí $P_2$ es
              justamente lo que no se sabe todavía. De hecho el examen la usa
              **después**, con el $n$ ya calculado, para sacar $P_2$.
          - texto: >-
              La primera ley, $Q = \Delta U + W$, despejando el trabajo
            mensaje: |
              La primera ley da el trabajo, no el exponente: en ella no
              aparece $n$ por ninguna parte. Hace falta la relación que sí lo
              contiene, y esa es la del calor específico politrópico.

      - tipo: calcular
        titulo: La temperatura inicial
        pregunta: |
          Con la ecuación de estado del gas ideal, ¿cuánto vale $T_1$?
        respuesta:
          tipo: magnitud
          valor: '557.5 K'
          tolerancia: 0.02
          formato: una temperatura, con su unidad
        distractores:
          - valor: '0.5575 K'
            mensaje: |
              Un factor mil: has metido la presión en bar donde la constante
              está en kJ. Con $R'$ en kJ/(kg·K), la presión va en kPa, y
              6 bar son 600 kPa.
          - valor: '1672.5 K'
            mensaje: |
              Te has dejado la masa. La ecuación de estado en su forma
              extensiva es $PV = m R' T$: la $m$ está ahí porque $V$ es el
              volumen total. Si trabajas con el volumen específico, entonces
              sí es $Pv = R'T$ sin masa, pero aquí los 0,8 m³ son del cilindro
              entero.
        pista: |
          $T_1 = P_1V_1/(m R')$, con la presión en kPa.
        desarrollo: |
          $$
          T_1 = \frac{P_1V_1}{m\,R'} = \frac{600\cdot 0{,}8}{3\cdot 0{,}287}
          = 557{,}5\ \text{K} = 284{,}5\ \text{°C}
          $$

          Un aviso de lectura: el enunciado escribe ese dato como
          $v_1 = 0{,}8\ \text{m}^{3}$, con letra de volumen específico y
          unidad de volumen total. Manda la unidad, y aquí es el volumen del
          cilindro entero.

      - tipo: calcular
        titulo: El calor específico del proceso
        pregunta: |
          De $Q = m\,c_n\,(T_2 - T_1)$, ¿cuánto vale $c_n$?
        respuesta:
          tipo: magnitud
          valor: '0.3107 kJ/(kg·K)'
          tolerancia: 0.02
          formato: un calor específico, con su unidad
        distractores:
          - valor: '-0.3107 kJ/(kg·K)'
            mensaje: |
              El signo. Los dos factores son negativos —el calor sale, la
              temperatura baja—, así que su cociente es positivo. Si te sale
              negativo, has puesto $Q = +240$ o has invertido la resta de
              temperaturas.
          - valor: '0.7175 kJ/(kg·K)'
            mensaje: |
              Ese es $c_v$. El calor específico politrópico es propio del
              proceso y no coincide con ninguno de los dos clásicos: aquí sale
              positivo y menor que $c_v$, que es lo que corresponde a un proceso
              entre el adiabático ($n = \gamma$) y el isócoro; entre el isotermo
              y el adiabático saldría negativo.
        pista: |
          Despeja $c_n = Q/[m(T_2 - T_1)]$, con $Q = -240$ y las temperaturas
          en kelvin.
        desarrollo: |
          $$
          c_n = \frac{Q}{m\,(T_2 - T_1)} = \frac{-240}{3\cdot(300 - 557{,}5)}
          = 0{,}3107\ \frac{\text{kJ}}{\text{kg}\cdot\text{K}}
          $$

      - tipo: calcular
        titulo: El exponente
        pregunta: |
          Con $c_v = 0{,}7175$ y $c_p = 1{,}0045$, ¿cuánto vale $n$?
        respuesta:
          tipo: numero
          valor: '1.705'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '0.5864'
            mensaje: |
              Has invertido la fracción. Comprueba con el caso conocido: si el
              proceso fuera adiabático, $c_n = 0$, y la fórmula tiene que
              devolver $\gamma = 1{,}4$. Con
              $(c_n - c_p)/(c_n - c_v)$ sale $1{,}4$; del revés, 0,714.
          - valor: '1.4'
            mensaje: |
              Ese es $\gamma$, el exponente del proceso **adiabático**. Aquí
              el proceso no es adiabático: cede 240 kJ, y por eso su exponente
              se separa de 1,4.
        pista: |
          $n = (c_n - c_p)/(c_n - c_v)$, con los tres calores específicos.
        desarrollo: |
          $$
          n = \frac{c_n - c_p}{c_n - c_v}
          = \frac{0{,}3107 - 1{,}0045}{0{,}3107 - 0{,}7175}
          = 1{,}705
          $$

      - tipo: justificar
        pregunta: Ordena la lectura del resultado. Una pieza es falsa.
        piezas:
          - texto: >-
              El calor específico del proceso sale positivo, 0,3107, porque
              el gas cede calor mientras se enfría: los dos signos negativos
              se cancelan.
          - texto: >-
              Ese valor es menor que $c_v$: para el mismo salto de
              temperatura, el gas pierde la misma energía interna que en un
              enfriamiento a volumen constante, 554 kJ, pero solo cede 240 como
              calor; los otros 314 salen como trabajo de expansión.
          - texto: >-
              El exponente sale 1,705, por encima de $\gamma = 1{,}4$, lo que
              corresponde a una expansión que cede calor.
          - texto: >-
              Y como $n$ es mayor que $\gamma$, el proceso no puede ser
              reversible, en contra de lo que dice el enunciado.
            trampa: true
            mensaje: |
              El exponente no decide la reversibilidad. Que exista una ley
              $Pv^{n} = \text{cte}$ con $n$ constante ya **es** la hipótesis
              de reversibilidad interna: el gas tiene una presión definida en
              cada instante. Un $n$ mayor que $\gamma$ describe una expansión
              que además cede calor, que es exactamente lo que el enunciado
              cuenta.
    resolucion: |
      **Primero, la temperatura inicial.** No la pide el examen, pero sin ella
      no hay exponente. De la ecuación de estado, con la presión
      en kilopascales para que case con $R'$ en kJ:

      $$
      T_1 = \frac{P_1V_1}{m\,R'} = \frac{600\cdot 0{,}8}{3\cdot 0{,}287}
      = 557{,}5\ \text{K} = 284{,}5\ \text{°C}
      $$

      **a) El exponente.** Primero el calor específico del proceso, que es lo
      único que el enunciado permite calcular con el dato del calor:

      $$
      c_n = \frac{Q}{m\,(T_2-T_1)} = \frac{-240}{3\cdot(300-557{,}5)}
      = 0{,}3107\ \frac{\text{kJ}}{\text{kg}\cdot\text{K}}
      $$

      Y con los otros dos, que salen de $R'$ y $\gamma$:

      $$
      c_v = \frac{0{,}287}{0{,}4} = 0{,}7175
      \qquad
      c_p = 1{,}4\cdot 0{,}7175 = 1{,}0045
      $$
      $$
      n = \frac{c_n - c_p}{c_n - c_v}
      = \frac{0{,}3107 - 1{,}0045}{0{,}3107 - 0{,}7175} = 1{,}705
      $$

      **Comprobación de la fórmula.** Merece la pena verificarla con los dos
      casos que se saben de memoria, porque es fácil invertirla: con
      $c_n = c_v$ el denominador se anula y $n\to\pm\infty$, que es el proceso
      isócoro; con $c_n = 0$, es decir sin calor, sale
      $n = c_p/c_v = \gamma$, que es el adiabático. Los dos salen donde deben,
      así que la fracción está del derecho.

  - id: exter2526-ord-1-la-entropia-que-genera-el-universo
    titulo: Un proceso reversible que genera entropía
    fuente: >-
      Apartados b) y c) del ejercicio 1 de la convocatoria ordinaria de enero
      de 2026 · Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU). El examen publica su resolución oficial, y el desarrollo está
      contrastado contra ella.
    nivel: examen
    enunciado: |
      En un cilindro pistón se expanden 3 kg de aire desde 6 bar y 0,8 m3
      hasta 27 °C según un proceso reversible, a través del cual se
      intercambian 240 KJ de calor hacia el medio circundante, que se
      encuentra a 20 °C. Calcúlese:

      b- la entropía generada en el proceso que ocurre en el cilindro-pistón

      c- la entropía generada en el universo

      Tómese como estado de referencia 15°C y 1 bar.

      *Lo que hace falta del apartado a), resuelto en la pieza anterior: el
      estado 1 está a $557{,}5\ \text{K}$ y $600\ \text{kPa}$, el 2 a
      $300\ \text{K}$ y $134{,}144\ \text{kPa}$, el exponente politrópico es
      $n = 1{,}705$ y el calor específico del proceso
      $c_n = 0{,}3107\ \text{kJ/(kg·K)}$. Del aire, $c_v = 0{,}7175$,
      $c_p = 1{,}0045$ y $R' = 0{,}287\ \text{kJ/(kg·K)}$.*
    pide: Las dos entropías generadas, la del sistema y la del universo.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado dice que el proceso es reversible. ¿Qué se puede
          anticipar de la entropía generada **en el cilindro**?
        opciones:
          - texto: >-
              Que vale cero: la generación de entropía es exactamente la
              medida de la irreversibilidad, y aquí no la hay dentro del
              sistema
            correcta: true
            mensaje: |
              Exacto. Y aun así hay que calcularla, porque el apartado la pide
              y porque el cero es la **comprobación** de que has evaluado bien
              los dos términos del balance.
          - texto: >-
              Que vale lo mismo que la del universo, porque el sistema está
              dentro del universo
            mensaje: |
              El universo incluye además el medio circundante, y ahí es donde
              va a aparecer la irreversibilidad: el calor cruza con una
              diferencia finita de temperaturas. Las dos cifras van a salir
              distintas, y esa diferencia es todo el ejercicio.
          - texto: >-
              Que es negativa, porque el sistema cede calor
            mensaje: |
              Ceder calor hace bajar la **entropía** del sistema, no su
              entropía **generada**. La generada nunca es negativa: es el
              término que el segundo principio obliga a ser mayor o igual que
              cero.

      - tipo: calcular
        titulo: La variación de entropía del aire
        pregunta: |
          ¿Cuánto vale $m\,(s_2 - s_1)$?
        respuesta:
          tipo: magnitud
          valor: '-0.5776 kJ/K'
          tolerancia: 0.02
          formato: una entropía, con su unidad
        distractores:
          - valor: '-1.8683 kJ/K'
            mensaje: |
              Has usado $c_v$ con el cociente de presiones, o $c_p$ con el de
              volúmenes: las dos formas de la fórmula tienen que ir emparejadas.
              O bien $c_v\ln(T_2/T_1) + R'\ln(V_2/V_1)$, o bien
              $c_p\ln(T_2/T_1) - R'\ln(P_2/P_1)$, y el signo del segundo
              término cambia con ellas.
          - valor: '0.5776 kJ/K'
            mensaje: |
              El signo. El aire se enfría de 557,5 K a 300 K cediendo calor,
              así que su entropía **baja**. Que baje no tiene nada de raro: lo
              que no puede bajar es la del universo.
        pista: |
          $m(s_2-s_1) = m\left[c_p\ln\frac{T_2}{T_1} - R'\ln\frac{P_2}{P_1}\right]$,
          con las temperaturas en kelvin.
        desarrollo: |
          $$
          m\,(s_2-s_1) = 3\left[1{,}0045\ln\!\frac{300}{557{,}5}
          - 0{,}287\ln\!\frac{134{,}144}{600}\right]
          $$
          $$
          = 3\,[-0{,}6227 + 0{,}4298] = -0{,}5776\ \frac{\text{kJ}}{\text{K}}
          $$

          Los dos términos tiran en sentidos contrarios: enfriarse baja la
          entropía y expandirse la sube. Gana el enfriamiento.

      - tipo: calcular
        titulo: La entropía que se va con el calor
        pregunta: |
          ¿Cuánto vale $\int_1^2 \delta Q/T$ **para el sistema**?
        respuesta:
          tipo: magnitud
          valor: '-0.5776 kJ/K'
          tolerancia: 0.02
          formato: una entropía, con su unidad
        distractores:
          - valor: '-0.8191 kJ/K'
            mensaje: |
              Has dividido los 240 kJ por la temperatura del **medio
              circundante**, 293 K. Esa es la cuenta del medio, no la del
              sistema: la frontera del cilindro está a la temperatura del gas,
              que va cambiando durante el proceso, y por eso aquí hay que
              integrar.
          - valor: '-0.4303 kJ/K'
            mensaje: |
              Has dividido los 240 kJ por la temperatura inicial, 557,5 K,
              como si la frontera se mantuviera ahí. El gas se enfría durante
              el proceso, así que la temperatura del denominador va cambiando:
              esa es la razón de que el término sea una integral.
        pista: |
          En un proceso politrópico, $\delta Q = m\,c_n\,dT$, así que la
          integral vale $m\,c_n\ln(T_2/T_1)$.
        desarrollo: |
          $$
          \int_1^2 \frac{\delta Q}{T} = \int_1^2 \frac{m\,c_n\,dT}{T}
          = m\,c_n \ln\!\frac{T_2}{T_1}
          $$
          $$
          = 3\cdot 0{,}3107\cdot \ln\!\frac{300}{557{,}5}
          = -0{,}5776\ \frac{\text{kJ}}{\text{K}}
          $$

          El mismo número que el paso anterior, y no por casualidad: es lo que
          significa que el proceso sea internamente reversible.

      - tipo: calcular
        titulo: La entropía generada en el universo
        pregunta: |
          El medio circundante recibe los 240 kJ a temperatura constante de
          20 °C. ¿Cuánta entropía se genera en el universo?
        respuesta:
          tipo: magnitud
          valor: '0.2415 kJ/K'
          tolerancia: 0.02
          formato: una entropía, con su unidad
        distractores:
          - valor: '0 kJ/K'
            mensaje: |
              Ese es el resultado del sistema, no el del universo. Que el
              proceso sea reversible **dentro** del cilindro no impide que la
              transferencia de calor al ambiente sea irreversible: cruza una
              diferencia finita de temperaturas, y eso genera entropía.
          - valor: '1.3967 kJ/K'
            mensaje: |
              Has sumado los dos valores absolutos en vez de sumarlos con su
              signo. La entropía del sistema **baja** 0,5776 y la del medio
              **sube** 0,8191: se restan, y lo que queda es lo que se ha
              creado.
        pista: |
          $\Delta S_{MC} = Q/T_{MC}$ con $Q = +240$ para el medio, y luego
          suma las dos variaciones.
        desarrollo: |
          $$
          \Delta S_{MC} = \frac{Q}{T_{MC}} = \frac{240}{293}
          = 0{,}8191\ \frac{\text{kJ}}{\text{K}}
          $$

          El universo es un sistema aislado, así que toda su variación de
          entropía es entropía generada:

          $$
          S_{G,univ} = \Delta S_{sist} + \Delta S_{MC}
          = -0{,}5776 + 0{,}8191 = 0{,}2415\ \frac{\text{kJ}}{\text{K}}
          $$

      - tipo: justificar
        pregunta: Ordena por qué genera entropía un proceso reversible. Una pieza es falsa.
        piezas:
          - texto: >-
              Dentro del cilindro no hay irreversibilidad: la entropía que
              pierde el gas es exactamente la que se lleva el calor, y
              $S_G = 0$.
          - texto: >-
              Pero esos 240 kJ salen de un gas que está entre 284 y 27 °C y
              entran en un ambiente que está a 20 °C.
          - texto: >-
              Transferir calor con una diferencia finita de temperaturas es
              irreversible —es la tercera condición del tema 5—, y ahí es
              donde se generan los 0,2415 kJ/K.
          - texto: >-
              Luego el enunciado se contradice: un proceso no puede ser
              reversible y generar entropía a la vez.
            trampa: true
            mensaje: |
              No hay contradicción porque no se habla del mismo sistema.
              «Reversible» califica al proceso **dentro** del cilindro; la
              entropía generada que sale distinta de cero es la del
              **universo**, que incluye la frontera y el ambiente. La
              distinción entre irreversibilidad interna y externa existe
              justamente para poder decir esto sin contradecirse.
    resolucion: |
      **a) En el cilindro-pistón.** El balance de entropía del sistema es

      $$
      S_G = m\,(s_2-s_1) - \int_1^2\frac{\delta Q}{T}
      $$

      El primer término, con la fórmula del gas ideal:

      $$
      m\,(s_2-s_1) = 3\left[1{,}0045\ln\!\frac{300}{557{,}5}
      - 0{,}287\ln\!\frac{134{,}144}{600}\right] = -0{,}5776\ \frac{\text{kJ}}{\text{K}}
      $$

      El segundo, integrando sobre el proceso politrópico:

      $$
      \int_1^2\frac{\delta Q}{T} = m\,c_n\ln\!\frac{T_2}{T_1}
      = 3\cdot 0{,}3107\cdot\ln\!\frac{300}{557{,}5} = -0{,}5776\ \frac{\text{kJ}}{\text{K}}
      $$

      $$
      S_{G,sist} = -0{,}5776 - (-0{,}5776) = 0
      $$

      Coherente con que el enunciado declare el proceso reversible.

      **b) En el universo.** El medio circundante recibe los 240 kJ a
      temperatura constante, porque es lo bastante grande como para no
      calentarse:

      $$
      \Delta S_{MC} = \frac{240}{293} = 0{,}8191\ \frac{\text{kJ}}{\text{K}}
      $$

      $$
      S_{G,univ} = -0{,}5776 + 0{,}8191 = 0{,}2415\ \frac{\text{kJ}}{\text{K}}
      $$

      **Lo que hay que llevarse.** Los mismos 240 kJ valen −0,5776 kJ/K de
      entropía saliendo del gas y +0,8191 kJ/K entrando en el ambiente. La
      diferencia no es un error de redondeo: es lo que se pierde al dejar que
      el calor caiga por un desnivel de temperatura en vez de aprovecharlo.
      Cuánto vale eso en trabajo es la pregunta del tema 7.

  - id: exter2526-ord-1-la-exergia-que-el-universo-destruye
    titulo: La exergía que el universo destruye
    fuente: >-
      Apartados d) y e) del ejercicio 1 de la convocatoria ordinaria de enero
      de 2026 · Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU). El examen publica su resolución oficial, y el desarrollo está
      contrastado contra ella.
    nivel: examen
    enunciado: |
      En un cilindro pistón se expanden 3 kg de aire desde 6 bar y 0,8 m3
      hasta 27 °C según un proceso reversible, a través del cual se
      intercambian 240 KJ de calor hacia el medio circundante, que se
      encuentra a 20 °C. Calcúlese:

      d- la variación de exergía del universo

      e- el rendimiento exergético del proceso en el universo

      Tómese como estado de referencia 15°C y 1 bar.

      *Lo que hace falta de los apartados anteriores: el estado 1 está a
      $557{,}5\ \text{K}$ y ocupa $0{,}8\ \text{m}^{3}$, el 2 a
      $300\ \text{K}$ y $1{,}9255\ \text{m}^{3}$; el trabajo del proceso es
      $W = 314{,}25\ \text{kJ}$ y la entropía generada en el universo,
      $S_G = 0{,}2415\ \text{kJ/K}$. Del aire, $c_v = 0{,}7175$ y
      $R' = 0{,}287\ \text{kJ/(kg·K)}$.*

      *El apartado se resuelve en tres pasos —la exergía del sistema, la del
      medio circundante y la suma— y el último se comprueba por Guy-Stodola,
      que es lo que hace que este apartado valga la pena.*
    pide: Las tres variaciones de exergía, la comprobación cruzada de la última y el rendimiento exergético.
    pasos:
      - tipo: reconocer
        pregunta: |
          Para escribir el balance del **medio circundante**, ¿qué hay que
          hacer con el calor, el trabajo y el volumen del sistema?
        opciones:
          - texto: >-
              Cambiarles el signo a los tres: lo que sale del sistema entra en
              el medio, y el volumen que gana uno lo pierde el otro
            correcta: true
            mensaje: |
              Exacto, y es donde se pierde la mitad de la gente. El calor pasa
              de $-240$ a $+240$, el trabajo de $+314{,}25$ a $-314{,}25$, y
              $\Delta V$ de $+1{,}125$ a $-1{,}125$. Escribirlos en una línea
              aparte antes de sustituir ahorra el disgusto.
          - texto: >-
              Nada: son los mismos valores, porque el proceso es el mismo
            mensaje: |
              El proceso es el mismo pero el sistema no. Con los mismos signos
              estarías diciendo que el medio circundante también cede calor y
              también produce trabajo, y entonces esa energía no la recibe
              nadie.
          - texto: >-
              Cambiar solo el del calor, porque el trabajo lo hace el sistema
              en los dos casos
            mensaje: |
              El trabajo lo hace el sistema, y por eso el medio lo **recibe**:
              desde el punto de vista del medio, es trabajo que entra, y con
              el convenio de la asignatura eso es negativo. Los tres cambian.

      - tipo: calcular
        titulo: La exergía del sistema
        pregunta: |
          ¿Cuánto vale $\Delta Ex_{sist} = m\,\Delta a_{12}$?
        respuesta:
          tipo: magnitud
          valor: '-275.35 kJ'
          tolerancia: 0.02
          formato: una energía, con su unidad
        distractores:
          - valor: '-554.27 kJ'
            mensaje: |
              Eso es solo el primer término, $m(u_2-u_1)$. A la exergía le
              faltan los otros dos: el trabajo que se gasta en apartar la
              atmósfera y la parte que el segundo principio no deja convertir.
          - valor: '275.35 kJ'
            mensaje: |
              El signo. El aire acaba más frío y más cerca del ambiente que
              como empezó, así que su capacidad de dar trabajo ha
              **disminuido**: la exergía del sistema baja.
        pista: |
          Son tres términos:

          $$
          \Delta a = c_v(T_2-T_1) + P_0(v_2-v_1)
          - T_0\left[c_v\ln\frac{T_2}{T_1} + R'\ln\frac{v_2}{v_1}\right]
          $$

          con el volumen específico creciendo 0,3752 m³/kg.
        desarrollo: |
          $$
          \Delta a = 0{,}7175\,(300 - 557{,}5) + 100\cdot 0{,}3752
          $$
          $$
          - 288\left[0{,}7175\ln\!\frac{300}{557{,}5}
          + 0{,}287\ln\!\frac{1{,}9255}{0{,}8}\right]
          = -91{,}78\ \frac{\text{kJ}}{\text{kg}}
          $$

          $$
          \Delta Ex_{sist} = 3\cdot(-91{,}78) = -275{,}35\ \text{kJ}
          $$

      - tipo: calcular
        titulo: La exergía del medio circundante
        pregunta: |
          Con los signos ya cambiados —$Q = +240$, $W = -314{,}25$,
          $\Delta V = -1{,}125$—, ¿cuánto vale $\Delta Ex_{MC}$?
        respuesta:
          tipo: magnitud
          valor: '205.79 kJ'
          tolerancia: 0.02
          formato: una energía, con su unidad
        distractores:
          - valor: '4.1 kJ'
            mensaje: |
              Ese es solo el término del calor,
              $(1-T_0/T_{MC})\,Q$, que es pequeñísimo porque el medio está a
              20 °C y la referencia a 15: apenas cinco grados por encima del
              ambiente, así que ese calor casi no tiene exergía. Falta el
              término del trabajo, que es el gordo.
          - valor: '-205.79 kJ'
            mensaje: |
              El signo. El medio recibe 314 kJ de trabajo del pistón, así que
              su capacidad de dar trabajo **aumenta**. Revisa el corchete: el
              término del trabajo entra restando y $W$ ya es negativo.
        pista: |
          Con el medio circundante a 293 K:

          $$
          \Delta Ex_{MC} = \left(1-\frac{T_0}{T_{MC}}\right)Q - [W - P_0\,\Delta V]
          $$
        desarrollo: |
          $$
          \Delta Ex_{MC} = \left(1-\frac{288}{293}\right)240
          - \big[-314{,}25 - 100\cdot(-1{,}125)\big]
          $$
          $$
          = 4{,}10 - (-201{,}70) = 205{,}79\ \text{kJ}
          $$

          Dos términos de tamaños muy distintos: el trabajo aporta casi todo,
          y el calor, cincuenta veces menos. Es la lectura física del tema:
          **calor a cinco grados por encima del ambiente casi no vale nada**,
          mientras que el trabajo vale íntegro.

      - tipo: calcular
        titulo: La exergía destruida
        pregunta: |
          ¿Cuánta exergía destruye el universo en este proceso?
        respuesta:
          tipo: magnitud
          valor: '69.56 kJ'
          tolerancia: 0.02
          formato: una energía, con su unidad
        distractores:
          - valor: '481.14 kJ'
            mensaje: |
              Has sumado los dos valores absolutos. La exergía del sistema
              **baja** 275,35 y la del medio **sube** 205,79: se restan, y lo
              destruido es lo que no llega de una a otra.
          - valor: '0.2415 kJ'
            mensaje: |
              Eso es la entropía generada, en kJ/K, no la exergía destruida.
              Guy-Stodola las relaciona multiplicando por la temperatura del
              ambiente: $Ex_D = T_0\,S_G = 288\cdot 0{,}2415$.
        pista: |
          Suma las dos variaciones con su signo. El universo está aislado, así
          que todo lo que pierde de exergía es lo que se ha destruido.
        desarrollo: |
          $$
          \Delta Ex_{univ} = -275{,}35 + 205{,}79 = -69{,}56\ \text{kJ}
          $$

          Y por Guy-Stodola, con la entropía generada del apartado anterior:

          $$
          Ex_D = T_0\,S_G = 288\cdot 0{,}2415 = 69{,}55\ \text{kJ}
          $$

          Los mismos kilojulios por dos caminos que no comparten ni una
          ecuación. Cuando eso pasa, el ejercicio está bien.

      - tipo: calcular
        titulo: El rendimiento exergético
        pregunta: |
          De la exergía que pierde el sistema, ¿qué fracción llega al medio
          circundante?
        respuesta:
          tipo: numero
          valor: '0.7474'
          tolerancia: 0.003
          formato: una fracción entre 0 y 1
        distractores:
          - valor: '0.2526'
            mensaje: |
              Esa es la fracción **destruida**, 69,56 entre 275,35. El
              rendimiento es la que se aprovecha: la que llega al medio.
          - valor: '0.7325'
            mensaje: |
              Te has quedado solo con el trabajo útil, 201,70 kJ. Al medio le
              llega también la exergía del calor, 4,10 kJ: está a 20 °C y no a
              15, y aunque es poca, es suya.
          - valor: '1.1562'
            mensaje: |
              Has contado el trabajo entero, 314,25 kJ, en lugar del útil. Una
              parte se gasta en apartar la atmósfera, $P_0\,\Delta V =
              112{,}5$ kJ, y esa no la aprovecha nadie. Un rendimiento por
              encima de 1 es la señal.
        pista: |
          Lo que gana el medio entre lo que pierde el sistema:
          $\eta_{ex} = \dfrac{\Delta Ex_{MC}}{|\Delta Ex_{sist}|}
          = 1 - \dfrac{Ex_D}{|\Delta Ex_{sist}|}$.
        desarrollo: |
          $$
          \eta_{ex} = \frac{205{,}79}{275{,}35} = 0{,}7474
          \qquad\text{o}\qquad
          1 - \frac{69{,}56}{275{,}35} = 0{,}7474
          $$

          Tres cuartas partes de la exergía que pierde el aire llegan al
          medio, casi todas como trabajo; la otra cuarta parte es la que se
          destruye al dejar caer el calor hasta 20 °C.

      - tipo: justificar
        pregunta: Ordena la lectura del resultado. Una pieza es falsa.
        piezas:
          - texto: >-
              El sistema pierde 275,35 kJ de exergía al acercarse al estado
              muerto, y el medio circundante gana 205,79.
          - texto: >-
              Faltan 69,56 kJ, que no han llegado a ninguna parte: son la
              exergía destruida en la transferencia de calor.
          - texto: >-
              Y coinciden con $T_0\,S_G = 288\cdot 0{,}2415$, que es el
              teorema de Guy-Stodola.
          - texto: >-
              Esos 69,56 kJ se podrían recuperar con una máquina lo bastante
              buena, porque la energía no se destruye.
            trampa: true
            mensaje: |
              La **energía** no se destruye, y de hecho no falta ni un julio:
              está toda en el medio circundante. Lo destruido es la
              **exergía**, es decir la capacidad de esa energía para dar
              trabajo, y eso no lo recupera ninguna máquina. Es exactamente lo
              que el segundo principio prohíbe, y lo que este tema mide en
              kilojulios en vez de en kJ/K para que se entienda.

      - tipo: redactar
        consigna: |
          En papel, y como lo entregarías: **explica por qué la variación de
          exergía del universo sale negativa**.

          El examen no lo pide como apartado aparte, pero su resolución
          oficial termina con ese párrafo, y no es un adorno: es donde se ve
          si has entendido el balance o solo lo has calculado. Cinco o seis
          líneas.
        rubrica:
          - punto: |
              **Empezar por que el universo es un sistema aislado.** No entra
              ni sale nada de él, por definición.
            porque: |
              Es la premisa de la que cuelga todo lo demás. Sin decirla, la
              conclusión no se sigue: en un sistema **no** aislado la exergía
              puede bajar sencillamente porque se la lleva otro, y entonces no
              habría nada que explicar.
          - punto: |
              **Decir que en un sistema aislado la única causa posible de
              variación de exergía es la destrucción**, porque los términos
              del calor y del trabajo son cero.
            porque: |
              Es el paso lógico del argumento, y es el que separa una
              explicación de una descripción. Quien solo dice «sale negativa
              porque se destruye exergía» está enunciando el resultado, no
              justificándolo.
          - punto: |
              **Y que la destrucción es no negativa**, así que su efecto sobre
              el balance solo puede ser hacia abajo.
            porque: |
              Aquí se usa Guy-Stodola en la dirección útil: $Ex_D = T_0S_G$
              con $S_G \ge 0$ y $T_0 > 0$. El signo del resultado no es una
              casualidad de las cuentas, está obligado.
          - punto: |
              **Señalar dónde está la irreversibilidad**: en la transferencia
              de calor entre el gas y un medio a 20 °C, con una diferencia
              finita de temperaturas.
            porque: |
              Es la parte concreta, y la que demuestra que has leído el
              enunciado y no recitado una plantilla. La irreversibilidad tiene
              un sitio en este problema, y es la tercera condición de
              reversibilidad del tema 5.
          - punto: |
              **Decir explícitamente que el intercambio de trabajo NO es
              irreversible**, porque el enunciado declara reversible la
              expansión.
            porque: |
              Es el punto que distingue una respuesta buena de una completa, y
              el que la resolución oficial se molesta en escribir. Sin él,
              parece que todo el proceso es irreversible; con él queda claro
              que la irreversibilidad está en un sitio concreto y no en los
              demás.
          - punto: |
              Cerrar **con el número**: 69,56 kJ, y que coincide con
              $T_0\,S_G$.
            porque: |
              Una explicación cualitativa que no aterriza en la cifra del
              apartado anterior deja al corrector sin saber si has atado las
              dos cosas. Y son dos caminos independientes que dan lo mismo:
              eso es una comprobación, y decirlo vale puntos.
        veredicto: |
          Si tu folio tiene los seis, has explicado el balance. Si te falta el
          quinto —que el trabajo sí es reversible—, tienes una respuesta
          correcta pero incompleta: es una línea, y es la que demuestra que
          distingues dónde se destruye exergía y dónde no.
    resolucion: |
      **a) El sistema.** La exergía específica de un sistema cerrado es
      $a = (u-u_0) + P_0(v-v_0) - T_0(s-s_0)$, y su variación entre dos
      estados no depende de la referencia salvo por $P_0$ y $T_0$:

      $$
      \Delta a = c_v(T_2-T_1) + P_0(v_2-v_1)
      - T_0\left[c_v\ln\!\frac{T_2}{T_1} + R'\ln\!\frac{v_2}{v_1}\right]
      = -91{,}78\ \frac{\text{kJ}}{\text{kg}}
      $$

      $$
      \Delta Ex_{sist} = 3\cdot(-91{,}78) = -275{,}35\ \text{kJ}
      $$

      **b) El medio circundante.** Con los tres signos cambiados:

      $$
      \Delta Ex_{MC} = \left(1-\frac{288}{293}\right)240
      - \big[-314{,}25 + 112{,}5\big] = 4{,}10 + 201{,}70 = 205{,}79\ \text{kJ}
      $$

      **c) El universo, y la comprobación.**

      $$
      \Delta Ex_{univ} = -275{,}35 + 205{,}79 = -69{,}56\ \text{kJ}
      \qquad
      Ex_D = 288\cdot 0{,}2415 = 69{,}55\ \text{kJ}
      $$

      **e) El rendimiento exergético.** Lo que llega al medio entre lo que
      pierde el sistema:

      $$
      \eta_{ex} = \frac{4{,}10 + 201{,}70}{275{,}35} = 1 - \frac{69{,}56}{275{,}35}
      = 0{,}7474
      $$

      **Lo que hay que llevarse.** El proceso era **internamente reversible**
      —dentro del cilindro no se generaba nada— y aun así el universo tira 69,6
      kJ de trabajo a la basura. No se pierden por una máquina mala: se
      pierden por dejar caer 240 kJ de calor desde un gas caliente hasta un
      ambiente a 20 °C sin poner nada en medio que los aproveche. Ese es el
      argumento de la cogeneración, de la recuperación de calor residual y de
      medio libro de ingeniería energética.
  - id: exter2526-ord-2-cuanta-agua-para-condensar-un-kilo
    titulo: Cuánta agua hace falta para condensar un kilo de vapor
    fuente: >-
      Apartado a) del ejercicio 2 de la convocatoria ordinaria de enero de
      2026 · Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU).
      El examen publica su resolución oficial, y el desarrollo está
      contrastado contra ella.
    nivel: examen
    enunciado: |
      A un condensador que trabaja con una presión de condensación de 0,5 bar,
      entran 0,7 kg/s de vapor de agua con un volumen específico de 3 m3/kg.
      El condensado sale saturado y alimenta una bomba que aumenta la presión
      hasta 50 bar, consumiendo para ello 6 kW de potencia. El condensador
      utiliza un circuito de agua más fría para condensar el vapor. Ambas
      corrientes no se mezclan. El agua de refrigeración del condensador entra
      a 18 °C y sale a 35 °C.

      Calcúlese:

      a) El gasto de agua de refrigeración necesaria

      b) La exergía destruida en el condensador

      c) El rendimiento exergético del condensador

      d) El rendimiento interno de la bomba

      e) La exergía destruida en la bomba

      f) El rendimiento exergético de la bomba

      Tómese como estado de referencia 15°C y 1 bar.

      *De los seis apartados, aquí se resuelve el **a)**. El b) y el c) van en
      la pieza siguiente, y los tres de la bomba, en la otra.*

      *Las propiedades del agua, de [las tablas de
      vapor](/road-to-ingenieria/ingenieria-termica/tablas/#saturacion-presion),
      como en el examen se sacan del anexo. Para el agua líquida,
      $c_p = 4{,}186\ \text{kJ/(kg·K)}$.*
    pide: El gasto másico del circuito de refrigeración.
    pasos:
      - tipo: reconocer
        pregunta: |
          Si el volumen de control abarca el condensador entero, ¿cuánto vale
          el calor que cruza su frontera?
        opciones:
          - texto: >-
              Cero: el calor pasa de una corriente a la otra **dentro** de la
              frontera, así que no la atraviesa
            correcta: true
            mensaje: |
              Exacto, y es lo que hace el ejercicio resoluble sin conocer
              ninguna potencia térmica. Si la frontera encerrara solo el
              vapor, entonces sí cruzaría, y aparecería un $\dot Q$ que
              habría que calcular.
          - texto: >-
              Es el calor latente de condensación del vapor, que sí sale del
              volumen de control
            mensaje: |
              Sale del vapor, pero no del volumen de control: se lo lleva el
              agua de refrigeración, que también está dentro. Cruzar la
              frontera es otra cosa que cambiar de corriente.
          - texto: >-
              No se puede saber, porque el enunciado no da la potencia del
              condensador
            mensaje: |
              No hace falta el dato porque el término vale cero por
              construcción. Ese es justamente el criterio para elegir la
              frontera: la que hace que el dato que falta no aparezca en la
              ecuación.

      - tipo: calcular
        titulo: El título del vapor a la entrada
        pregunta: |
          Con $v_1 = 3$ y los valores de saturación a 0,5 bar, ¿cuál es el
          título del vapor que entra?
        respuesta:
          tipo: numero
          valor: '0.926'
          tolerancia: 0.004
          formato: un número entre 0 y 1
        distractores:
          - valor: '0.0741'
            mensaje: |
              Has calculado la fracción de líquido. El título mide vapor, y
              este vapor entra casi seco: le queda un 7 % de líquido, no un
              93 %.
          - valor: '1'
            mensaje: |
              No entra seco. Su volumen específico, 3 m³/kg, es menor que el
              del vapor saturado seco a esa presión, 3,24: está **dentro** de
              la campana, aunque cerca del borde derecho.
        pista: |
          $x = (v - v')/(v'' - v')$.
        desarrollo: |
          $$
          x_1 = \frac{3 - 0{,}0010299}{3{,}24 - 0{,}0010299} = 0{,}926
          $$

      - tipo: calcular
        titulo: La entalpía a la entrada
        pregunta: |
          ¿Cuál es la entalpía del vapor que entra?
        respuesta:
          tipo: magnitud
          valor: '2474.4 kJ/kg'
          tolerancia: 0.02
          formato: una energía específica, con su unidad
        distractores:
          - valor: '2645.2 kJ/kg'
            mensaje: |
              Esa es la del vapor saturado **seco**, que sería el caso de
              título 1. Con título 0,926 la entalpía es la media ponderada de
              las dos fases, y sale algo menor.
          - valor: '340.54 kJ/kg'
            mensaje: |
              Esa es la del líquido saturado, que es la entalpía de **salida**,
              no la de entrada. El condensador convierte lo uno en lo otro.
        pista: |
          $h = x\,h'' + (1-x)\,h'$.
        desarrollo: |
          $$
          h_1 = 0{,}9259\cdot 2645{,}2 + 0{,}0741\cdot 340{,}54
          = 2474{,}4\ \frac{\text{kJ}}{\text{kg}}
          $$

          Con el título redondeado a tres cifras, 0,926, saldrían 2474,7: dos
          décimas de diferencia que no cambian nada aquí, pero que conviene ver
          para saber por qué el examen arrastra el título con cuatro.

          Y la de salida es directa, porque el condensado sale como líquido
          saturado: $h_2 = h' = 340{,}54\ \text{kJ/kg}$.

      - tipo: calcular
        titulo: El gasto de refrigeración
        pregunta: |
          ¿Cuántos kilogramos por segundo de agua de refrigeración hacen
          falta?
        respuesta:
          tipo: magnitud
          valor: '20.99 kg/s'
          tolerancia: 0.02
          formato: un caudal másico, con su unidad
        distractores:
          - valor: '-20.99 kg/s'
            mensaje: |
              El signo. Los dos paréntesis son negativos —el vapor pierde
              entalpía, y el agua entra más fría de lo que sale—, así que el
              cociente es positivo. Un gasto negativo no significa nada.
          - valor: '0.7 kg/s'
            mensaje: |
              Ese es el gasto de vapor. No tienen por qué coincidir, y de
              hecho no coinciden ni de lejos: condensar un kilo de vapor
              libera unos 2.130 kJ y calentar un kilo de agua diecisiete
              grados absorbe 71.
        pista: |
          Del balance $\dot m_1(h_2-h_1) + \dot m_{H_2O}(h_{out}-h_{in}) = 0$,
          con el modelo incompresible para el agua líquida.
        desarrollo: |
          El agua de refrigeración está a una presión no mucho mayor que la
          atmosférica, así que se le aplica el modelo de sustancia
          incompresible:

          $$
          h_{in} - h_{out} = c_p\,(\theta_{in} - \theta_{out})
          = 4{,}186\cdot(18 - 35) = -71{,}16\ \frac{\text{kJ}}{\text{kg}}
          $$

          $$
          \dot m_{H_2O} = \frac{\dot m_1\,(h_2 - h_1)}{h_{in} - h_{out}}
          = \frac{0{,}7\cdot(340{,}54 - 2474{,}4)}{-71{,}16}
          = 20{,}99\ \frac{\text{kg}}{\text{s}}
          $$

      - tipo: justificar
        pregunta: Ordena por qué salen treinta veces más kilos de agua. Una pieza es falsa.
        piezas:
          - texto: >-
              Cada kilogramo de vapor cede 2.134 kJ al condensarse, que es casi
              todo calor latente de cambio de fase.
          - texto: >-
              Cada kilogramo de agua de refrigeración absorbe
              $4{,}186\cdot 17 = 71$ kJ, porque solo cambia de temperatura y
              no de fase.
          - texto: >-
              El cociente entre los dos números es 30, y ese es el factor
              entre los dos gastos.
          - texto: >-
              Y saldría lo mismo con cualquier otro salto térmico del agua,
              porque el calor que hay que evacuar no cambia.
            trampa: true
            mensaje: |
              El calor a evacuar no cambia, pero el gasto sí: es ese calor
              **dividido** por lo que absorbe cada kilogramo, y eso depende
              del salto térmico. Con un salto de 34 grados en vez de 17 harían
              falta la mitad de kilos. Por eso el salto térmico del circuito
              de refrigeración es una decisión de diseño y no un dato
              caprichoso.
    resolucion: |
      **La frontera, primero.** Con el volumen de control sobre el condensador
      entero, el calor pasa de una corriente a la otra por dentro y no cruza:
      $\dot Q = 0$. Tampoco hay trabajo. Queda un balance entre las dos
      corrientes, que no se mezclan:

      $$
      \dot m_1\,(h_2 - h_1) + \dot m_{H_2O}\,(h_{out} - h_{in}) = 0
      $$

      **El vapor, por tablas.** Su volumen específico, 3 m³/kg, cae entre
      $v'$ y $v''$, así que hay dos fases:

      $$
      x_1 = \frac{3 - 0{,}0010299}{3{,}24 - 0{,}0010299} = 0{,}926
      \qquad
      h_1 = 2474{,}4\ \frac{\text{kJ}}{\text{kg}}
      $$

      Y a la salida, líquido saturado: $h_2 = h' = 340{,}54\ \text{kJ/kg}$.

      **El agua, por el modelo incompresible.** Está lejos de la saturación, y
      para un líquido así $\Delta h = c_p\,\Delta\theta$ es exacto de sobra:

      $$
      h_{in} - h_{out} = 4{,}186\cdot(18-35) = -71{,}16\ \frac{\text{kJ}}{\text{kg}}
      $$

      **El gasto.**

      $$
      \dot m_{H_2O} = \frac{0{,}7\cdot(340{,}54 - 2474{,}4)}{-71{,}16}
      = 20{,}99\ \frac{\text{kg}}{\text{s}}
      $$

      **La comprobación que da sentido al número.** Treinta veces más agua que
      vapor no es un error: condensar libera calor latente, y calentar sin
      cambiar de fase solo consume calor sensible. Los 2.134 kJ que suelta un
      kilo de vapor, repartidos a 71 kJ por kilo de agua, dan exactamente esos
      treinta.

  - id: exter2526-ord-2-la-exergia-que-destruye-el-condensador
    titulo: El condensador, que tira cuatro quintas partes de la exergía del vapor
    fuente: >-
      Apartados b) y c) del ejercicio 2 de la convocatoria ordinaria de enero
      de 2026 · Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU). El examen publica su resolución oficial, y el desarrollo está
      contrastado contra ella.
    nivel: examen
    enunciado: |
      A un condensador que trabaja con una presión de condensación de 0,5 bar,
      entran 0,7 kg/s de vapor de agua con un volumen específico de 3 m3/kg.
      El condensado sale saturado y alimenta una bomba que aumenta la presión
      hasta 50 bar, consumiendo para ello 6 kW de potencia. El condensador
      utiliza un circuito de agua más fría para condensar el vapor. Ambas
      corrientes no se mezclan. El agua de refrigeración del condensador entra
      a 18 °C y sale a 35 °C.

      Calcúlese:

      b) La exergía destruida en el condensador

      c) El rendimiento exergético del condensador

      Tómese como estado de referencia 15°C y 1 bar.

      *Lo que hace falta del apartado a): el vapor entra con título 0,926 y
      $h_1 = 2474{,}4\ \text{kJ/kg}$, sale como líquido saturado a 0,5 bar, y
      el gasto de agua de refrigeración es $20{,}99\ \text{kg/s}$. Las
      entropías del vapor, de [las tablas de
      vapor](/road-to-ingenieria/ingenieria-termica/tablas/#saturacion-presion);
      para el agua líquida, $c_p = 4{,}186\ \text{kJ/(kg·K)}$.*
    pide: La exergía destruida y el rendimiento exergético del condensador.
    pasos:
      - tipo: reconocer
        pregunta: |
          Con el volumen de control sobre el condensador entero, ¿qué queda del
          balance de exergía?
        opciones:
          - texto: >-
              Solo las exergías de flujo de las dos corrientes y la destruida:
              ni calor ni trabajo cruzan la frontera
            correcta: true
            mensaje: |
              Eso es, la misma frontera del apartado a). El calor pasa del
              vapor al agua por dentro, así que no aparece: lo que el vapor
              pierde de exergía y no gana el agua es lo que se destruye.
          - texto: >-
              El término del calor, $(1 - T_0/T)\,\dot Q$, con el calor que
              cede el vapor
            mensaje: |
              Ese término aparecería si la frontera encerrara solo el vapor.
              Con las dos corrientes dentro, el calor no cruza, y lo que el
              vapor pierde se ve en la exergía que gana el agua.
          - texto: >-
              La variación de energía de las dos corrientes, que se compensa
            mensaje: |
              La energía se compensa —es el balance del apartado a)—, y
              justamente por eso no sirve aquí: la exergía **no** se compensa.
              Lo que falta entre la que pierde el vapor y la que gana el agua
              es la destruida.

      - tipo: calcular
        titulo: La exergía que pierde el vapor
        pregunta: |
          Con $s_1 = 7{,}1112$ y $s_2 = s' = 1{,}0912\ \text{kJ/(kg·K)}$,
          ¿cuánta exergía pierde el vapor al condensar?
        respuesta:
          tipo: magnitud
          valor: '280.08 kW'
          tolerancia: 0.005
          formato: una potencia, con su unidad
        distractores:
          - valor: '1493.7 kW'
            mensaje: |
              Esa es la **energía** que cede, $\dot m_1\,(h_1 - h_2)$. A la
              exergía le falta restarle $T_0$ por el salto de entropía: casi
              todo ese calor sale a 81 °C, apenas por encima del ambiente, y
              vale poco como trabajo.
          - valor: '343.29 kW'
            mensaje: |
              Has tomado $T_0 = 273\ \text{K}$. El estado de referencia es
              15 °C, 288 K: la temperatura del ambiente es la que multiplica al
              salto de entropía.
        pista: |
          $\dot m_1\,[(h_1 - h_2) - T_0\,(s_1 - s_2)]$, con $T_0 = 288\ \text{K}$.
          La entropía de entrada sale con el título:
          $s_1 = s' + x_1\,(s'' - s')$.
        desarrollo: |
          $$
          \dot m_1\,[(h_1 - h_2) - T_0(s_1 - s_2)]
          = 0{,}7\,[(2474{,}4 - 340{,}54) - 288\,(7{,}1112 - 1{,}0912)]
          = 280{,}08\ \text{kW}
          $$

          Es lo mismo que restar las dos exergías de flujo respecto del
          estado muerto, 299,66 y 19,58 kW, que es como lo hace la
          resolución oficial: el estado de referencia se va en la resta.

      - tipo: calcular
        titulo: La exergía que gana el agua
        pregunta: |
          ¿Cuánta exergía gana el agua de refrigeración al pasar de 18 a 35 °C?
        respuesta:
          tipo: magnitud
          valor: '56.97 kW'
          tolerancia: 0.01
          formato: una potencia, con su unidad
        distractores:
          - valor: '58.33 kW'
            mensaje: |
              Esa es la exergía con la que **sale**, contada desde el estado
              muerto. El agua no entra a 15 °C sino a 18, y ya trae 1,36 kW:
              lo que gana es la diferencia.
          - valor: '1493.7 kW'
            mensaje: |
              Esa es la **energía** que recibe, la misma que cede el vapor. De
              ella, a 35 °C, casi nada es exergía: el agua sale solo veinte
              grados por encima del ambiente.
        pista: |
          Con el modelo incompresible,
          $\Delta a = c_p\,(T_s - T_e) - T_0\,c_p \ln(T_s/T_e)$.
        desarrollo: |
          $$
          \dot m_{H_2O}\left[c_p\,(T_s - T_e) - T_0\,c_p\ln\frac{T_s}{T_e}\right]
          = 20{,}99\left[4{,}186\cdot 17 - 288\cdot 4{,}186\ln\frac{308}{291}\right]
          = 56{,}97\ \text{kW}
          $$

          De los 1.493,7 kW que recibe el agua, solo 57 son exergía.

      - tipo: calcular
        titulo: La exergía destruida
        pregunta: |
          ¿Cuánta exergía se destruye en el condensador?
        respuesta:
          tipo: magnitud
          valor: '223.12 kW'
          tolerancia: 0.005
          formato: una potencia, con su unidad
        distractores:
          - valor: '280.08 kW'
            mensaje: |
              Esa es toda la que pierde el vapor. No se destruye entera: el
              agua se lleva 56,97 kW. Lo destruido es lo que no llega.
          - valor: '-1213.6 kW'
            mensaje: |
              Has hecho Guy-Stodola con la entropía del vapor sola,
              $0{,}7\,(1{,}0912 - 7{,}1112) = -4{,}214\ \text{kW/K}$. La
              entropía generada es la del condensador entero: falta la que gana
              el agua, $+4{,}989\ \text{kW/K}$. Una exergía destruida negativa
              es la señal de que falta un término.
        pista: |
          Lo que pierde el vapor menos lo que gana el agua. Y se comprueba por
          Guy-Stodola: $T_0\,\dot S_G$, con las dos corrientes.
        desarrollo: |
          $$
          \dot{E}x_D = 280{,}08 - 56{,}97 = 223{,}12\ \text{kW}
          $$

          Y por Guy-Stodola, con la entropía que genera el condensador:

          $$
          \dot S_G = 0{,}7\,(1{,}0912 - 7{,}1112)
          + 20{,}99\cdot 4{,}186\ln\frac{308}{291}
          = -4{,}214 + 4{,}989 = 0{,}7747\ \text{kW/K}
          $$

          $$
          T_0\,\dot S_G = 288\cdot 0{,}7747 = 223{,}12\ \text{kW}
          $$

      - tipo: calcular
        titulo: El rendimiento exergético del condensador
        pregunta: |
          ¿Qué fracción de la exergía que pierde el vapor aprovecha el agua?
        respuesta:
          tipo: numero
          valor: '0.2034'
          tolerancia: 0.003
          formato: una fracción entre 0 y 1
        distractores:
          - valor: '0.7966'
            mensaje: |
              Esa es la fracción destruida, 223,12 entre 280,08. El
              rendimiento es la que llega al agua.
          - valor: '0.1947'
            mensaje: |
              Has dividido la exergía con la que sale el agua entre la que
              trae el vapor, 58,33 entre 299,66. El rendimiento compara lo que
              **gana** una corriente con lo que **pierde** la otra: 56,97
              entre 280,08.
        pista: |
          Lo que gana el agua entre lo que pierde el vapor.
        desarrollo: |
          $$
          \eta_{ex} = \frac{56{,}97}{280{,}08} = 0{,}2034
          $$

          Un 20 %. Cuatro quintas partes de la exergía del vapor se destruyen
          en el propio condensador.

      - tipo: justificar
        pregunta: Ordena por qué un condensador destruye tanto. Una pieza es falsa.
        piezas:
          - texto: 'El vapor condensa a 81,3 °C y el agua se calienta de 18 a 35 °C: el calor cruza una diferencia de temperatura de unos cincuenta grados.'
          - texto: 'Esa diferencia finita es la irreversibilidad, y genera 0,7747 kW/K: 223 kW de exergía destruida.'
          - texto: 'El agua sale a 35 °C, veinte grados por encima del ambiente, y con los 1.494 kW que recibe solo se lleva 57 de exergía.'
          - texto: 'Como el balance de energía cierra —todo lo que cede el vapor lo recibe el agua—, el condensador no pierde nada.'
            trampa: true
            mensaje: |
              No pierde **energía**, y por eso el apartado a) cuadra. Pierde
              **exergía**: de 280 kW de capacidad de hacer trabajo, 223 se
              quedan en agua templada que ya no sirve para casi nada. Que la
              energía se conserve y la exergía no es exactamente lo que este
              ejercicio pone en números.
    resolucion: |
      **La frontera.** La misma del apartado a), sobre el condensador entero:
      el calor pasa del vapor al agua por dentro y no cruza, y tampoco hay
      trabajo. Del balance de exergía quedan las dos corrientes y la
      destruida:

      $$
      \dot{E}x_D = -\dot m_1\,(a_{f2} - a_{f1}) - \dot m_{H_2O}\,(a_{f,s} - a_{f,e})
      $$

      **El vapor.** A 0,5 bar, con el título del apartado a), 0,9259:

      $$
      s_1 = 1{,}0912 + 0{,}9259\,(7{,}593 - 1{,}0912) = 7{,}1112
      \qquad
      s_2 = s' = 1{,}0912\ \text{kJ/(kg·K)}
      $$

      $$
      \dot m_1\,[(h_1 - h_2) - T_0(s_1 - s_2)]
      = 0{,}7\,[2133{,}9 - 288\cdot 6{,}02] = 280{,}08\ \text{kW}
      $$

      **El agua**, con el modelo incompresible:

      $$
      \dot m_{H_2O}\,(a_{f,s} - a_{f,e})
      = 20{,}99\left[4{,}186\cdot 17 - 288\cdot 4{,}186\ln\frac{308}{291}\right]
      = 56{,}97\ \text{kW}
      $$

      **b) La exergía destruida**, y la comprobación por Guy-Stodola:

      $$
      \dot{E}x_D = 280{,}08 - 56{,}97 = 223{,}12\ \text{kW}
      \qquad
      T_0\,\dot S_G = 288\,(-4{,}214 + 4{,}989) = 223{,}12\ \text{kW}
      $$

      **c) El rendimiento.**

      $$
      \eta_{ex} = \frac{56{,}97}{280{,}08} = 0{,}2034
      $$

      **Lo que hay que llevarse.** El condensador es el sitio de una central de
      vapor donde más se ve la diferencia entre los dos principios. Por
      energía no pierde nada: los 1.494 kW que cede el vapor los recibe el
      agua. Por exergía tira cuatro quintas partes, porque el calor baja
      cincuenta grados de golpe y acaba en agua a 35 °C, que ya no vale para
      mover nada. Por eso se condensa a la presión más baja que se pueda:
      cuanto más frío condensa el vapor, menos exergía queda por tirar.

  - id: exter2526-ord-2-la-bomba-que-consume-seis-kilovatios
    titulo: La bomba, del signo de su trabajo a sus dos rendimientos
    fuente: >-
      Apartados d), e) y f) del ejercicio 2 de la convocatoria ordinaria de
      enero de 2026 · Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU). El examen publica su resolución oficial, y el desarrollo está
      contrastado contra ella. La resolución escribe «s₃′ = s₂ = 1,3028», que
      es la entropía del líquido saturado a 1 bar y no a 0,5; su h₃′ = 345,82
      sale, en cambio, con la buena, 1,0912.
    nivel: examen
    enunciado: |
      A un condensador que trabaja con una presión de condensación de 0,5 bar,
      entran 0,7 kg/s de vapor de agua con un volumen específico de 3 m3/kg.
      El condensado sale saturado y alimenta una bomba que aumenta la presión
      hasta 50 bar, consumiendo para ello 6 kW de potencia. El condensador
      utiliza un circuito de agua más fría para condensar el vapor. Ambas
      corrientes no se mezclan. El agua de refrigeración del condensador entra
      a 18 °C y sale a 35 °C.

      Calcúlese:

      d) El rendimiento interno de la bomba

      e) La exergía destruida en la bomba

      f) El rendimiento exergético de la bomba

      Tómese como estado de referencia 15°C y 1 bar.

      *Lo que hace falta del apartado a): el condensado sale como líquido
      saturado a $0{,}5\ \text{bar}$ —su entalpía y su entropía, en [las
      tablas de
      vapor](/road-to-ingenieria/ingenieria-termica/tablas/#saturacion-presion)—
      y con un gasto de $\dot m = 0{,}7\ \text{kg/s}$. La bomba se toma
      adiabática. El agua a 50 bar, en [la tabla de líquido
      comprimido](/road-to-ingenieria/ingenieria-termica/tablas/#liquido-50).*
    pide: El rendimiento interno, la exergía destruida y el rendimiento exergético de la bomba.
    pasos:
      - tipo: reconocer
        pregunta: |
          La bomba **consume** 6 kW. ¿Con qué signo entra ese dato?
        opciones:
          - texto: >-
              $\dot W = -6\ \text{kW}$, porque el trabajo entra al volumen de
              control y el convenio cuenta como positivo el que sale
            correcta: true
            mensaje: |
              Eso es, y es el mismo convenio del sistema cerrado: el trabajo
              es positivo cuando lo hace el sistema. Una bomba no lo hace, lo
              recibe.
          - texto: >-
              $\dot W = +6\ \text{kW}$, porque el enunciado dice que consume
              esa potencia
            mensaje: |
              El enunciado da el módulo y la dirección con palabras. Con el
              signo cambiado la entalpía saldría **menor** que la de entrada,
              es decir, el agua saldría de la bomba con menos energía que
              cuando entró.
          - texto: >-
              Depende de si la bomba es reversible o no
            mensaje: |
              El signo lo fija hacia dónde va la energía, no cómo de bien va.
              El rendimiento de la bomba es otra pregunta, y se contesta
              después comparando esta entalpía con la del proceso ideal.

      - tipo: calcular
        titulo: La entalpía de salida
        pregunta: |
          Con el balance de energía de la bomba, ¿cuál es $h_3$?
        respuesta:
          tipo: magnitud
          valor: '349.11 kJ/kg'
          tolerancia: 0.02
          formato: una energía específica, con su unidad
        distractores:
          - valor: '331.97 kJ/kg'
            mensaje: |
              Has puesto $\dot W = +6$. Fíjate en lo que dice el resultado: el
              agua saldría de la bomba con menos entalpía que al entrar, sin
              haber cedido calor a nadie —la bomba es adiabática—. La energía
              habría desaparecido.
          - valor: '8.57 kJ/kg'
            mensaje: |
              Eso es solo el **salto** de entalpía que produce la bomba, no la
              entalpía de salida. Falta sumarle la de entrada: la entalpía es
              una propiedad del estado, no lo que ha cambiado.
        pista: |
          De $q = h_3 - h_2 + w$ con $q = 0$, y $w = \dot W/\dot m$.
        desarrollo: |
          La bomba es adiabática, así que $q = 0$ y el balance queda

          $$
          w = h_2 - h_3
          \;\Longrightarrow\;
          h_3 = h_2 - \frac{\dot W}{\dot m}
          = 340{,}54 - \frac{-6}{0{,}7}
          = 349{,}11\ \frac{\text{kJ}}{\text{kg}}
          $$

          Ocho kilojulios y medio por kilogramo, que es lo que la bomba le
          mete al agua.

      - tipo: calcular
        titulo: La entalpía de salida ideal
        pregunta: |
          Si la bomba fuera isentrópica, ¿con qué entalpía saldría el agua a
          $50\ \text{bar}$?
        respuesta:
          tipo: magnitud
          valor: '345.81 kJ/kg'
          tolerancia: 0.001
          formato: una energía específica, con su unidad
        distractores:
          - valor: '422.6 kJ/kg'
            mensaje: |
              Has tomado $s = 1{,}3028$, que es la entropía del líquido
              saturado a **1 bar**. El agua entra a 0,5 bar, con
              $s_2 = s' = 1{,}0912$. Es lo que escribe la resolución oficial,
              «$s_{3'} = s_2 = 1{,}3028$», aunque su 345,82 sale con la buena.
          - valor: '338.95 kJ/kg'
            mensaje: |
              Esa es la fila de 80 °C tal cual. Con $s = 1{,}0912$ el estado
              cae entre las filas de 80 y 100 °C, y además esa fila da menos
              entalpía que la de entrada: una bomba no deja el agua con menos
              energía de la que recibe.
        pista: |
          En la tabla de líquido comprimido a 50 bar, el estado con la entropía
          de entrada, $s = s_2 = 1{,}0912$: está entre las filas de 80 y
          100 °C.
        desarrollo: |
          A 50 bar, la fila de 80 °C tiene $s = 1{,}0723$ y $h = 338{,}95$; la
          de 100 °C, $s = 1{,}3034$ y $h = 422{,}85$:

          $$
          h_{3'} = 338{,}95 + \frac{1{,}0912 - 1{,}0723}{1{,}3034 - 1{,}0723}\,(422{,}85 - 338{,}95)
          = 345{,}81\ \frac{\text{kJ}}{\text{kg}}
          $$

          Y se puede comprobar sin tabla: para un líquido,
          $h_{3'} - h_2 \approx v\,\Delta P = 0{,}0010299 \cdot 4950 = 5{,}10$,
          y sale 345,64. Las dos décimas de diferencia son de interpolar en
          línea recta entre filas separadas veinte grados.

      - tipo: calcular
        titulo: El rendimiento interno
        pregunta: |
          ¿Cuál es el rendimiento interno de la bomba?
        respuesta:
          tipo: numero
          valor: '0.615'
          tolerancia: 0.025
          formato: una fracción entre 0 y 1
        distractores:
          - valor: '1.626'
            mensaje: |
              Has dividido al revés. En una bomba el trabajo real es **mayor**
              que el ideal, así que el rendimiento es el ideal entre el real:
              $(h_{3'} - h_2)/(h_3 - h_2)$. Al contrario que en una turbina.
          - valor: '0.991'
            mensaje: |
              Has dividido las dos entalpías de salida, 345,81 entre 349,11.
              El rendimiento compara los **saltos**, lo que la bomba ideal y la
              real le suben al agua, no las entalpías que tiene al final.
        pista: |
          $\eta_{s} = \dfrac{h_{3'} - h_2}{h_3 - h_2}$: en una bomba, el ideal
          arriba.
        desarrollo: |
          $$
          \eta_{s} = \frac{345{,}81 - 340{,}54}{349{,}11 - 340{,}54}
          = \frac{5{,}27}{8{,}57} = 0{,}615
          $$

          La resolución oficial da un 61,6 %, con su 345,82. Con la
          estimación $v\,\Delta P$, un 59,5 %: las dos lecturas valen, y la
          diferencia sale entera de dos décimas de entalpía, porque el
          trabajo ideal de la bomba son solo cinco kilojulios por kilo.

      - tipo: calcular
        titulo: La exergía destruida en la bomba
        pregunta: |
          A 50 bar y $h_3 = 349{,}11\ \text{kJ/kg}$, la tabla da
          $s_3 = 1{,}1003\ \text{kJ/(kg·K)}$. ¿Cuánta exergía destruye la
          bomba?
        respuesta:
          tipo: magnitud
          valor: '1.83 kW'
          tolerancia: 0.09
          formato: una potencia, con su unidad
        distractores:
          - valor: '6 kW'
            mensaje: |
              Ese es todo el trabajo que recibe. No se destruye entero: la
              mayor parte se queda en el agua como exergía, 4,17 kW.
          - valor: '4.17 kW'
            mensaje: |
              Esa es la exergía que **gana** el agua. La destruida es lo que
              falta hasta los 6 kW que se le dan.
        pista: |
          Adiabática y con una sola corriente: $\dot{E}x_D = T_0\,\dot m\,(s_3 - s_2)$,
          o lo que entra como trabajo menos lo que gana el agua.
        desarrollo: |
          $$
          \dot{E}x_D = T_0\,\dot m\,(s_3 - s_2) = 288 \cdot 0{,}7 \cdot (1{,}1003 - 1{,}0912)
          = 1{,}83\ \text{kW}
          $$

          Por el balance de exergía sale lo mismo: el agua gana
          $0{,}7\,[8{,}57 - 288\cdot 0{,}0091] = 4{,}17\ \text{kW}$, y de los
          6 que entran faltan 1,83.

      - tipo: calcular
        titulo: El rendimiento exergético de la bomba
        pregunta: |
          ¿Cuál es el rendimiento exergético de la bomba?
        respuesta:
          tipo: numero
          valor: '0.695'
          tolerancia: 0.03
          formato: una fracción entre 0 y 1
        distractores:
          - valor: '0.305'
            mensaje: |
              Esa es la fracción destruida, 1,83 entre 6. El rendimiento es la
              que se queda en el agua.
          - valor: '0.615'
            mensaje: |
              Ese es el rendimiento **interno**, el del apartado d). El
              exergético es otra cuenta: la exergía que gana el agua entre el
              trabajo que se le da, 4,17 entre 6.
        pista: |
          $\eta_{ex} = \dfrac{\dot m\,(a_{f3} - a_{f2})}{|\dot W|}$.
        desarrollo: |
          $$
          \eta_{ex} = \frac{4{,}17}{6} = 0{,}695
          $$

          Más alto que el interno, y no es casualidad: el interno cuenta como
          perdido todo lo que la bomba mete de más, 3,3 kJ/kg, y el exergético
          ve que parte de eso sigue valiendo —calienta un agua que ya está a
          81 °C—. Solo se ha destruido lo que se va en $T_0\,\Delta s$.

      - tipo: justificar
        pregunta: Ordena la lectura de los dos rendimientos. Una pieza es falsa.
        piezas:
          - texto: 'La bomba ideal subiría la entalpía del agua 5,27 kJ/kg; la real le mete 8,57. El rendimiento interno es su cociente, un 61,5 %.'
          - texto: 'Los 3,3 kJ/kg de más calientan el agua menos de un grado, y eso sube su entropía: de ahí salen los 1,83 kW de exergía destruida.'
          - texto: 'El rendimiento exergético es mayor, un 69,5 %, porque parte de esa energía de más sigue siendo exergía: el agua ya estaba a 81 °C.'
          - texto: 'Como los dos rendimientos miden lo mismo, la diferencia entre el 61,5 y el 69,5 % es un error de redondeo.'
            trampa: true
            mensaje: |
              No miden lo mismo. El interno compara la bomba con una bomba
              ideal, y todo lo que se aparte cuenta como pérdida; el exergético
              compara lo que el agua gana en capacidad de hacer trabajo con lo
              que se le da. Ocho puntos no son redondeo: son la parte del
              trabajo de más que no se ha destruido.
    resolucion: |
      **El signo, primero.** La bomba consume 6 kW, es decir el trabajo
      **entra** al volumen de control, así que con el convenio de la
      asignatura $\dot W = -6\ \text{kW}$. Adiabática y sin variaciones de
      energía cinética ni potencial:

      $$
      h_3 = h_2 - \frac{\dot W}{\dot m}
      = 340{,}54 - \frac{-6}{0{,}7} = 349{,}11\ \frac{\text{kJ}}{\text{kg}}
      $$

      **d) El rendimiento interno.** La bomba ideal llevaría el agua a 50 bar
      con la misma entropía de entrada, $s_2 = s' = 1{,}0912$. En la tabla de
      líquido comprimido a 50 bar ese estado cae entre las filas de 80 y
      100 °C:

      $$
      h_{3'} = 338{,}95 + \frac{1{,}0912 - 1{,}0723}{1{,}3034 - 1{,}0723}\,(422{,}85 - 338{,}95)
      = 345{,}81\ \frac{\text{kJ}}{\text{kg}}
      $$

      $$
      \eta_{s} = \frac{345{,}81 - 340{,}54}{349{,}11 - 340{,}54} = 0{,}615
      $$

      **e) La exergía destruida.** A 50 bar y $h_3 = 349{,}11$, la tabla da
      $s_3 = 1{,}1003$. Adiabática y con una sola corriente, toda la entropía
      que gana el agua es generada:

      $$
      \dot{E}x_D = T_0\,\dot m\,(s_3 - s_2) = 288\cdot 0{,}7\cdot 0{,}0091
      = 1{,}83\ \text{kW}
      $$

      **f) El rendimiento exergético.** De los 6 kW, el agua se queda
      $6 - 1{,}83 = 4{,}17\ \text{kW}$:

      $$
      \eta_{ex} = \frac{4{,}17}{6} = 0{,}695
      $$

      **Lo que hay que llevarse.** Los dos rendimientos de una bomba no miden
      lo mismo. El interno la compara con la ideal y da por perdido todo lo
      que consume de más; el exergético mira qué parte de lo que consume
      acaba siendo capacidad de hacer trabajo, y reconoce que calentar un
      agua que ya está a 81 °C no es tirar del todo la energía.

      > **Dos avisos sobre estos números.** El primero, una errata de la
      > resolución oficial: escribe «$s_{3'} = s_2 = 1{,}3028$», que es la
      > entropía del líquido saturado a 1 bar; su $h_{3'} = 345{,}82$ sale
      > con la buena, 1,0912, así que el 61,6 % que publica es correcto. El
      > segundo, cuánto se puede fiar uno de ellos. El trabajo ideal de la
      > bomba son cinco kilojulios por kilo y la entropía que genera, nueve
      > milésimas, y los dos salen de restar números casi iguales leídos en
      > una tabla con filas cada veinte grados. Con la formulación completa,
      > sin interpolar, sale un 59,4 %, 1,97 kW y un 67 %; con la estimación
      > $v\,\Delta P$ del líquido, lo mismo. En el examen manda la tabla, y
      > aquí se aceptan las dos lecturas.

  - id: exter2526-ord-3-que-resistencia-manda-en-la-tuberia
    titulo: Qué resistencia manda en la tubería
    fuente: >-
      Ejercicio 3 de la convocatoria ordinaria de enero de 2026 · Ingeniería
      Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica
      su resolución oficial, y las cuatro resistencias están rehechas y
      contrastadas contra ella.
    nivel: examen
    enunciado: |
      Por una tubería de 0,5 m de diámetro interior fluye un gasto de
      0,3 kg/s de agua. La tubería consta de dos capas, una de 3 cm de espesor
      y conductividad de 52 W/mK y otra, la exterior, de 6 cm de espesor y
      0,75 W/mK de conductividad. El agua entra a la tubería a 250 °C,
      mientras que el aire exterior a la tubería se encuentra en reposo y a
      una temperatura de 10 °C. La superficie exterior de la tubería en
      contacto con el aire se encuentra a 110,7 °C. Calcúlese:

      a) Al cabo de cuántos metros de longitud de tubería habrá descendido la
      temperatura del agua que circula por la tubería hasta los 150 °C.

      b) Cuál es la resistencia térmica dominante y cuál es el porcentaje que
      cada una de las resistencias térmicas que forman el circuito
      termoeléctrico equivalente representa, respecto a la resistencia térmica
      total.

      *Aquí se resuelven los dos apartados: el a) pasando primero por la
      potencia térmica que pierde el agua, que el examen no pide pero sin la
      cual no hay longitud.*

      *Lo que hace falta de la pieza siguiente, donde se calcula: el agua a la
      temperatura característica tiene $c_p = 4.500\ \text{J/(kg·K)}$, y la
      resistencia de convección interior vale
      $R_{ci} = 2{,}2369\cdot 10^{-4}\ \text{K/W}$.*
    pide: La potencia, la longitud y el reparto de las cuatro resistencias.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado da la temperatura de la superficie exterior, 110,7 °C.
          ¿Para qué sirve ese dato?
        opciones:
          - texto: >-
              Para calcular la resistencia de convección exterior por
              diferencia, sin necesidad de ninguna correlación
            correcta: true
            mensaje: |
              Exacto, y es el regalo del enunciado. Conocidos el calor y las
              dos temperaturas que hay a los lados de esa resistencia, sale
              dividiendo; sin ese dato habría que aplicar Churchill y Chu,
              que la propia resolución oficial dice que no es aconsejable en
              un examen.
          - texto: >-
              Para comprobar que el aislamiento aguanta la temperatura
            mensaje: |
              Sería una comprobación de materiales, no un dato del cálculo. En
              un problema de transmisión de calor, una temperatura de
              superficie que aparece «de más» casi siempre está ahí para
              ahorrarte una correlación.
          - texto: >-
              No sirve para nada: es un dato redundante que se puede deducir
              del resto
            mensaje: |
              Deducirla exigiría conocer el coeficiente de convección exterior,
              que es justo lo que no se sabe. El dato es el que cierra el
              circuito por el lado de fuera.

      - tipo: calcular
        titulo: La potencia térmica
        pregunta: |
          ¿Cuánto calor pierde el agua al enfriarse de 250 a 150 °C?
        respuesta:
          tipo: magnitud
          valor: '135000 W'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '135 W'
            mensaje: |
              Un factor mil: el $c_p$ del enunciado viene en J/(kg·K), no en
              kJ. Con 4.500 J/(kg·K), el producto sale directamente en vatios.
          - valor: '337500 W'
            mensaje: |
              Has usado un salto de 250 grados en vez de 100. El agua se
              enfría **de** 250 **a** 150: el salto es la diferencia entre las
              dos, no la temperatura de entrada.
        pista: |
          $\dot Q = \dot m\,c_p\,(\theta_{in} - \theta_{out})$.
        desarrollo: |
          $$
          \dot Q = 0{,}3\cdot 4.500\cdot(250 - 150) = 135.000\ \text{W}
          $$

      - tipo: calcular
        titulo: La resistencia de convección exterior
        pregunta: |
          Con la superficie exterior a 110,7 °C y el aire a 10 °C, ¿cuánto
          vale $R_{ce}$?
        respuesta:
          tipo: magnitud
          valor: '7.459e-4 K/W'
          tolerancia: 0.02
          formato: una resistencia térmica, con su unidad
        distractores:
          - valor: '1.341e3 K/W'
            mensaje: |
              Has dividido al revés, el calor entre el salto de temperatura.
              La analogía es la ley de Ohm: la resistencia es la diferencia de
              potencial **partida por** la intensidad, no al contrario.
          - valor: '1.7778e-3 K/W'
            mensaje: |
              Has usado el salto entre el agua y el aire, 250 menos 10. Esta
              resistencia es solo la de la película exterior: los dos extremos
              que la limitan son la superficie del tubo y el aire, 110,7 y 10.
        pista: |
          $R = \Delta\theta/\dot Q$, con la diferencia entre superficie
          exterior y aire.
        desarrollo: |
          $$
          R_{ce} = \frac{\theta_3 - \theta_{f,ext}}{\dot Q}
          = \frac{110{,}7 - 10}{135.000}
          = 7{,}459\cdot 10^{-4}\ \frac{\text{K}}{\text{W}}
          $$

      - tipo: calcular
        titulo: El porcentaje de la resistencia dominante
        pregunta: |
          Las cuatro resistencias suman
          $1{,}40741\cdot 10^{-3}\ \text{K/W}$. ¿Qué porcentaje del total
          representa la de convección exterior?
        respuesta:
          tipo: numero
          valor: '53.0'
          tolerancia: 0.5
          formato: un porcentaje, sin el símbolo
        distractores:
          - valor: '30.8'
            mensaje: |
              Ese es el del aislante, $4{,}34\cdot 10^{-4}$, que es la segunda
              en importancia. La exterior es mayor: $7{,}46\cdot 10^{-4}$.
          - valor: '0.26'
            mensaje: |
              Ese es el de la chapa de acero, y es la lección del apartado: con
              una conductividad de 52 frente a 0,75, el acero no pinta nada en
              el circuito. Podrías quitarlo del cálculo y el resultado
              cambiaría en la tercera cifra.
        pista: |
          Divide $7{,}459\cdot 10^{-4}$ entre el total y multiplica por cien.
        desarrollo: |
          $$
          \frac{R_{ce}}{R_{TOTAL}} = \frac{7{,}459\cdot 10^{-4}}
          {1{,}40741\cdot 10^{-3}} = 53{,}0\ \%
          $$

          Con el reparto completo: convección interior 15,9 %, acero 0,26 %,
          aislante 30,8 % y convección exterior 53,0 %.

      - tipo: justificar
        pregunta: Ordena la conclusión de ingeniería. Una pieza es falsa.
        piezas:
          - texto: >-
              Más de la mitad de la resistencia del conjunto está en la
              película de aire exterior, en reposo.
          - texto: >-
              El aislante aporta el 31 % y la chapa de acero, el 0,26 %: entre
              los dos metales y aislantes, manda con diferencia el aislante.
          - texto: >-
              Luego, para reducir pérdidas, actuar sobre el aire exterior
              rinde más que engordar el aislamiento.
          - texto: >-
              Y por eso conviene poner un ventilador que mueva el aire
              alrededor de la tubería.
            trampa: true
            mensaje: |
              Ventilar sube el coeficiente de convección, así que **baja** esa
              resistencia y el tubo pierde **más** calor. Aquí la resistencia
              exterior es una aliada: si lo que quieres es conservar el calor
              del agua, el aire quieto te conviene. La lección es que la
              resistencia dominante es donde más se nota cualquier cambio,
              para bien o para mal.
    resolucion: |
      **Antes del a), la potencia**, que el examen no pide y sin la cual no
      hay longitud. Balance de energía sobre el agua, con el modelo
      incompresible:

      $$
      \dot Q = \dot m\,c_p\,\Delta\theta = 0{,}3\cdot 4.500\cdot 100
      = 135.000\ \text{W}
      $$

      **a) La longitud.** El circuito de dentro hacia afuera —convección
      interior, acero, aislante— tiene todas sus resistencias inversamente
      proporcionales a $L$, así que la longitud sale despejando:

      $$
      \dot Q = \frac{\theta_{f,int} - \theta_3}{(R_{ci}+R_1+R_2)}
      \;\Longrightarrow\;
      L = \frac{135.000}{1.421{,}7} \approx 95\ \text{m}
      $$

      **b) La resistencia dominante y el reparto.** Con la resistencia exterior sacada por diferencia:

      | resistencia | K/W | % |
      |---|---|---|
      | convección interior | $2{,}24\cdot 10^{-4}$ | 15,9 |
      | acero | $3{,}65\cdot 10^{-6}$ | 0,26 |
      | aislante | $4{,}34\cdot 10^{-4}$ | 30,8 |
      | **convección exterior** | $7{,}46\cdot 10^{-4}$ | **53,0** |

      **Lo que hay que llevarse.** La resistencia dominante es la película de
      aire exterior, y la del acero es despreciable: 0,26 %. Identificar cuál
      manda **antes** de decidir dónde invertir es todo el oficio de este
      tema, y aquí la respuesta es incómoda —lo que más pesa no es el material
      que has elegido, sino el aire que hay fuera—.
  - id: exter2526-ord-3-el-agua-que-corre-por-dentro-de-la-tuberia
    titulo: La convección de dentro, y por qué apenas pesa
    fuente: >-
      Parte del ejercicio 3 de la convocatoria ordinaria de enero de 2026 ·
      Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen publica su resolución oficial, y el desarrollo está contrastado
      contra ella.
    nivel: examen
    enunciado: |
      Por una tubería de 0,5 m de diámetro interior fluye un gasto de
      0,3 kg/s de agua. La tubería consta de dos capas, una de 3 cm de espesor
      y conductividad de 52 W/mK y otra, la exterior, de 6 cm de espesor y
      0,75 W/mK de conductividad. El agua entra a la tubería a 250 °C,
      mientras que el aire exterior a la tubería se encuentra en reposo y a
      una temperatura de 10 °C. La superficie exterior de la tubería en
      contacto con el aire se encuentra a 110,7 °C. Calcúlese:

      a) Al cabo de cuántos metros de longitud de tubería habrá descendido la
      temperatura del agua que circula por la tubería hasta los 150 °C.

      b) Cuál es la resistencia térmica dominante y cuál es el porcentaje que
      cada una de las resistencias térmicas que forman el circuito
      termoeléctrico equivalente representa, respecto a la resistencia térmica
      total.

      *Esta pieza no resuelve un apartado del examen: calcula por dentro lo
      que los dos necesitan y el enunciado no da —la velocidad del agua, su
      número de Reynolds y el coeficiente de película interior—, que es de
      donde sale la resistencia de convección interior que la pieza anterior
      usa. Va aparte porque es convección y aquella es conducción, y son dos
      temas distintos del temario.*

      *Propiedades del agua a la temperatura característica:
      $\rho = 864{,}3\ \text{kg/m}^{3}$, $k = 0{,}663\ \text{W/(m·K)}$,
      $\text{Pr} = 0{,}91$,
      $\nu = 1{,}55039\cdot 10^{-7}\ \text{m}^{2}/\text{s}$.*
    pide: La velocidad, el Reynolds y el coeficiente de película interior.
    pasos:
      - tipo: reconocer
        pregunta: |
          El agua entra a 250 °C y sale a 150 °C. ¿A qué temperatura se leen
          las propiedades, y qué exponente de Prandtl toca?
        opciones:
          - texto: >-
              A 200 °C, la media del fluido, y con exponente 0,3 porque el
              agua se enfría
            correcta: true
            mensaje: |
              Los dos aciertos van juntos y salen del mismo dato: el agua
              entra más caliente de lo que sale, así que se enfría, y en flujo
              interior las propiedades van a la temperatura del fluido.
          - texto: >-
              A 200 °C, y con exponente 0,4 porque el fluido intercambia calor
            mensaje: |
              La temperatura es correcta pero el exponente no. El 0,4 es del
              fluido que **se calienta**; aquí el agua pierde 100 grados por
              el camino, así que se enfría y el exponente es 0,3.
          - texto: >-
              A la temperatura de película, y con exponente 0,3
            mensaje: |
              El exponente es correcto pero la temperatura no. Dittus-Boelter
              es, con la esfera, la excepción del tema: propiedades a la
              temperatura del fluido, no a la de película. La de película es
              la de la convección **exterior** sobre el tubo, que en este
              mismo ejercicio se evalúa a 60,35 °C.

      - tipo: calcular
        titulo: La velocidad del agua
        pregunta: |
          ¿A qué velocidad circula el agua por el tubo?
        respuesta:
          tipo: magnitud
          valor: '0.00177 m/s'
          tolerancia: 0.02
          formato: una velocidad, con su unidad
        distractores:
          - valor: '0.00708 m/s'
            mensaje: |
              Has usado el radio en vez del diámetro al calcular el área. La
              sección es $\pi D^{2}/4$ con $D = 0{,}5$, y sale 0,196 m²: casi
              un quinto de metro cuadrado, que es mucho tubo para 0,3 kg/s.
          - valor: '1.77 m/s'
            mensaje: |
              Un factor mil, probablemente de la densidad. El agua a 200 °C
              tiene 864,3 kg/m³, no 0,8643.
        pista: |
          $c = \dot m/(\rho A)$, con $A = \pi D_1^{2}/4 = 0{,}196\ \text{m}^2$.
        desarrollo: |
          $$
          A_{int} = \frac{\pi\cdot 0{,}5^{2}}{4} = 0{,}196\ \text{m}^{2}
          \qquad
          c = \frac{0{,}3}{864{,}3\cdot 0{,}196}
          = 0{,}00177\ \frac{\text{m}}{\text{s}}
          $$

          Menos de dos milímetros por segundo. Es lentísimo, y es lo que hace
          interesante el apartado siguiente.

      - tipo: calcular
        titulo: El Reynolds
        pregunta: |
          ¿Cuánto vale el número de Reynolds, y basta para aplicar
          Dittus-Boelter?
        respuesta:
          tipo: numero
          valor: '5704'
          # Absoluta, como toda respuesta `numero`. Decía 0.02, que era pedir el
          # Reynolds a la centésima: la cuenta exacta da 5701 y la página la
          # rechazaba. Cincuenta es un 0,9 %, y los dos distractores quedan a
          # la mitad y al cuádruple.
          tolerancia: 50
          formato: un número, sin unidades
        distractores:
          - valor: '2851'
            mensaje: |
              Has usado el radio como longitud característica. En flujo
              interior es el **diámetro** entero, 0,5 m. Y fíjate en lo que el
              error te habría hecho concluir: 2.851 sigue estando por encima
              de 2.100, así que Dittus-Boelter parecería aplicable igual y
              nada te habría avisado.
          - valor: '22804'
            mensaje: |
              Has usado el radio al calcular la **sección**, así que la
              velocidad te ha salido cuatro veces mayor de lo que es. La
              sección de un tubo es $\pi D^{2}/4$, y con medio metro de
              diámetro son 0,196 m², no 0,049.
        pista: |
          $\text{Re} = c\,D_1/\nu$, con la velocidad del paso anterior.
        desarrollo: |
          $$
          \text{Re} = \frac{0{,}00177\cdot 0{,}5}{1{,}55039\cdot 10^{-7}}
          = 5.704
          $$

          Está por debajo de los 10.000 que Dittus-Boelter pide como condición
          cómoda, pero **por encima de 2.100**, que es el umbral de flujo
          turbulento y el límite que la propia asignatura admite. La
          resolución oficial lo comprueba explícitamente antes de seguir.

      - tipo: calcular
        titulo: El coeficiente de película interior
        pregunta: |
          Con $n = 0{,}3$, ¿cuánto vale $h_{int}$?
        respuesta:
          tipo: magnitud
          valor: '29.98 W/m2 K'
          tolerancia: 0.02
          formato: un coeficiente de película, con su unidad
        distractores:
          - valor: '22.61 W/m2 K'
            mensaje: |
              Ese es el número de Nusselt, que es adimensional. Falta
              multiplicarlo por $k/D$ para convertirlo en coeficiente de
              película.
          - valor: '14.99 W/m2 K'
            mensaje: |
              Has multiplicado el Nusselt por $k$ pero te has dejado el
              dividir por el diámetro. Es $h = \text{Nu}\,k/D$, y aquí $D$
              vale 0,5, así que dividir por él **duplica** el resultado.

              Y un aviso de paso sobre el exponente: cambiarlo de 0,3 a 0,4
              aquí apenas mueve nada, porque el Prandtl del agua a 200 °C es
              0,91, y 0,91 elevado a casi cualquier cosa sigue siendo casi 1.
              La elección del exponente importa cuando el Prandtl se aleja de
              la unidad, como en el ejercicio 9.2 de la colección, donde vale
              4,5 y la diferencia es del 14 %.
        pista: |
          $\text{Nu} = 0{,}023\,\text{Re}^{0{,}8}\text{Pr}^{0{,}3}$ y
          $h = \text{Nu}\,k/D_1$.
        desarrollo: |
          $$
          \text{Nu} = 0{,}023\cdot 5.704^{0{,}8}\cdot 0{,}91^{0{,}3} = 22{,}61
          $$

          $$
          h_{int} = \frac{22{,}61\cdot 0{,}663}{0{,}5}
          = 29{,}98\ \frac{\text{W}}{\text{m}^{2}\text{K}}
          $$

      - tipo: justificar
        pregunta: Ordena la lectura del resultado. Una pieza es falsa.
        piezas:
          - texto: >-
              El agua circula a 1,8 mm/s, que para un tubo de medio metro de
              diámetro es un caudal minúsculo.
          - texto: >-
              Por eso el Reynolds se queda en 5.704, apenas turbulento, y el
              coeficiente de película sale de solo 30 W/(m²·K).
          - texto: >-
              Con ese valor tan bajo, la resistencia de convección interior
              pesa un 15,9 % del circuito, más de sesenta veces lo que pesa la
              pared de acero.
          - texto: >-
              Y como el agua va tan despacio, la convección interior es la
              resistencia dominante del problema.
            trampa: true
            mensaje: |
              Es la segunda por la cola, no la dominante. Con el 15,9 % queda
              por detrás del aislante —30,8 %— y de la convección exterior
              —53 %—, que es la que manda. Que un valor sea sorprendentemente
              bajo no lo convierte en el que decide: eso lo dice el reparto
              completo, no la intuición.
    resolucion: |
      **La temperatura característica y el exponente.** Flujo interior, así que
      las propiedades van a la temperatura del fluido, $(250+150)/2 = 200$ °C.
      Y el agua se enfría, así que en Dittus-Boelter $n = 0{,}3$.

      **a) Velocidad y Reynolds.**

      $$
      A_{int} = \frac{\pi\cdot 0{,}5^{2}}{4} = 0{,}196\ \text{m}^{2}
      \qquad
      c = \frac{0{,}3}{864{,}3\cdot 0{,}196} = 0{,}00177\ \frac{\text{m}}{\text{s}}
      $$
      $$
      \text{Re} = \frac{0{,}00177\cdot 0{,}5}{1{,}55039\cdot 10^{-7}} = 5.704 > 2.100
      $$

      **b) El coeficiente de película.**

      $$
      \text{Nu} = 0{,}023\cdot 5.704^{0{,}8}\cdot 0{,}91^{0{,}3} = 22{,}61
      \qquad
      h_{int} = \frac{22{,}61\cdot 0{,}663}{0{,}5} = 29{,}98\ \frac{\text{W}}{\text{m}^{2}\text{K}}
      $$

      **Lo que hay que llevarse.** Treinta W/(m²·K) para agua es un valor
      pobrísimo: en el ejercicio 9.2 de la colección, con agua a 1,5 m/s en un
      tubo de 5 cm, salían 5.733. La diferencia son casi doscientas veces, y
      toda viene de la velocidad: aquí el agua va a menos de dos milímetros
      por segundo porque el tubo es enorme para el caudal que lleva. Un buen
      recordatorio de que $h$ no es una propiedad del fluido, sino de lo que
      el fluido está haciendo.

