asignatura: ingenieria-termica
curso: '2025-2026'
convocatoria: ordinaria
fecha: enero de 2026
# La primera convocatoria de Ingeniería Térmica que entra en el sitio como
# página, y la más cercana a quien curse la asignatura en 2027.
#
# Tres cosas de este cuadernillo, dichas antes de que nadie las deduzca:
#
# 1. **TRAE LA RESOLUCIÓN OFICIAL COMPLETA**, no solo el resultado. Eso lo hace
#    lo contrario de los cuadernillos de Fluidos: aquí cada desarrollo nuestro
#    se puede contrastar línea a línea contra el del profesor, y así se ha
#    hecho. Es también lo que obligó a esperar una decisión antes de publicar
#    el PDF, porque publicar un enunciado y publicar la resolución de otro no
#    son la misma cosa. Ionan decidió publicarlo todo el 10 de septiembre de
#    2026.
#
# 2. **SON TRES EJERCICIOS Y SIETE RESOLUCIONES**, y las dos cifras son
#    verdad. Cada ejercicio del examen trae cinco apartados que cruzan temas
#    distintos —el 1 va de politrópicos, de entropía generada y de exergía del
#    universo— y eso no se puede enseñar de una vez. Se parte en piezas
#    guiadas, cada una con su `n` diciendo de qué ejercicio del cuadernillo
#    sale, para que la página pueda decir las dos cosas sin mentir en ninguna.
#
# 3. **NO PUBLICA REPARTO POR COMPETENCIA.** El cuadernillo no dice cuánto
#    vale cada apartado, así que los ejercicios van sin el campo `puntos`, que
#    el esquema deja opcional. No se estima lo que no se imprime (§10).
pdf: 2025-2026-ord.pdf
pdfEs: resolucion

ejercicios:
  # Ejercicio 1 · un cilindro-pistón que se expande de forma reversible
  # cediendo 240 kJ al ambiente. Cinco apartados, tres temas.
  - id: exter2526-ord-1-el-exponente-que-sale-del-calor
    tema: t03-sustancias-puras
    n: 1
  - id: exter2526-ord-1-la-entropia-que-genera-el-universo
    tema: t06-entropia
    n: 1
  - id: exter2526-ord-1-la-exergia-que-el-universo-destruye
    tema: t07-analisis-exergetico
    n: 1

  # Ejercicio 2 · un condensador con su bomba.
  - id: exter2526-ord-2-cuanta-agua-para-condensar-un-kilo
    tema: t04-volumen-de-control
    n: 2
  - id: exter2526-ord-2-la-bomba-que-consume-seis-kilovatios
    tema: t04-volumen-de-control
    n: 2

  # Ejercicio 3 · la tubería con dos aislantes, que es el hueco de transmisión
  # de calor que cae en dieciséis de las diecisiete convocatorias leídas.
  - id: exter2526-ord-3-que-resistencia-manda-en-la-tuberia
    tema: t08-conduccion
    n: 3
  - id: exter2526-ord-3-el-agua-que-corre-por-dentro-de-la-tuberia
    tema: t09-conveccion
    n: 3

# Los apartados que este examen pide y el sitio todavía no resuelve.
#
# Contados el 14 de septiembre de 2026 contra el PDF, apartado por apartado:
# el examen pide TRECE en sus tres ejercicios y aquí hay SIETE. Hasta hoy
# `fuera` estaba vacío, así que la página decía «Los 3 ejercicios … resueltos
# enteros» y la portada contaba esta convocatoria entre las completas.
#
# No lo vio ninguna de las dos auditorías del 13 de septiembre: las dos
# miraron si el enunciado publicado era el del examen —lo era a medias, y eso
# también se ha arreglado— y ninguna contó los apartados. El hueco de grano
# fino necesitaba un campo que no existía; ahora `fuera` acepta `apartados`.
fuera:
  - n: 1
    apartados: e
    motivo: >-
      El **rendimiento exergético del proceso en el universo**. Los cuatro
      apartados anteriores están resueltos y este sale de ellos en dos líneas,
      así que no falta material ni datos: falta escribirlo. La resolución
      oficial lo trae en el PDF de esta misma convocatoria.
  - n: 2
    apartados: b, c, d, e y f
    motivo: >-
      De los seis apartados que pide este ejercicio, aquí están resueltos el
      **a)** —el gasto de agua de refrigeración— y la entalpía a la salida de
      la bomba, que es el primer paso del **d)**. Faltan la exergía destruida
      y el rendimiento exergético del condensador, el rendimiento interno de la
      bomba, y la exergía destruida y el rendimiento exergético de la bomba.
      Tampoco aquí falta material: los cinco están desarrollados en el PDF de
      la escuela. Es trabajo pendiente, y estuvo sin declarar desde que se
      montó la convocatoria el 10 de septiembre de 2026.
