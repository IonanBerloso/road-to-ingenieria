asignatura: ingenieria-termica
convocatoria: extraordinaria
curso: '2023-2024'
fecha: 30 de enero de 2024
# Bilingüe, con el castellano en la primera página y el euskera en la segunda.
# Da **2,5 horas**.
#
# **La fecha no es un descuido nuestro y conviene explicarla.** Es la segunda
# convocatoria del curso —la que la escuela llama «de febrero», y así se llama
# el fichero que reparte— pero el examen está fechado el **30 de enero de
# 2024** en sus dos versiones: «Examen de 30 enero de 2024» en la castellana y
# «2024eko urtarrilak 30eko azterketa» en la vasca. Que las dos coincidan
# descarta la errata de cabecera. Se publica lo que dice el documento; cómo
# encaja eso en el calendario oficial no lo sabemos y no se inventa.
#
# **Y de aquí sale la corrección de una nota vieja de este repositorio.**
# Decía que dos de los tres ejercicios de 2023-2024 eran copias de 2020 y
# 2021. El 10 de septiembre de 2026 se comprobó contra la **ordinaria** y se
# dio por falsa; horas después, al abrir esta, resultó ser cierta **sobre esta
# convocatoria**. Su ejercicio 3 lleva los mismos datos que el ejercicio 1 de
# enero de 2021, dígito a dígito. La nota no estaba mal: estaba mal atribuida,
# y comprobarla contra la convocatoria equivocada la enterró en vez de
# encontrarla.
#
# Lo que sí es falso es «copia literal», que es como quedó escrito el primer
# día: **los datos son idénticos y lo que se pide no**. Enero de 2021 pedía dos
# números —las dos temperaturas superficiales— en prosa corrida; esta los pide
# como apartados a) y b) y **añade dos más**, los coeficientes de convección de
# las dos caras del tubo interior. Uno de los dos ya lo calcula el ejercicio
# montado de 2021 por el camino; el otro, el del anillo entre los dos tubos,
# no lo calcula nadie en todo el corpus.
pdf: 2023-2024-ext.pdf

fuera:
  - n: 3
    motivo: >-
      Los dos tubos concéntricos de 9,5 m con aceite de motor y agua. **Sus
      datos son los del ejercicio 1 de enero de 2021, idénticos dígito a
      dígito** —los mismos 0,9 kg/s, los mismos 106 y 96 °C, la misma tabla de
      propiedades—, y ese está transcrito: es el aceite que se lleva setenta
      grados. Lo que esta convocatoria añade son **dos apartados nuevos**, los
      coeficientes de convección de las dos caras del tubo interior. El de
      dentro, 378,88 W/m²K, ya sale en la resolución de 2021 porque hace falta
      para llegar a las temperaturas. El de fuera, 2220,77 W/m²K, **no**: es
      convección en el anillo entre los dos tubos, y eso pide el diámetro
      hidráulico, que el tema 9 presenta y **ningún ejercicio del corpus
      usa**. Por eso este no se transcribe como repetición sino que queda
      apuntado por lo único que trae de nuevo.

ejercicios:
  # Ejercicio 1 · la misma expansión dos veces, con calor y sin él. Escrito el
  # 12 de septiembre de 2026 contrastando contra las respuestas del margen de
  # este cuadernillo y contra la resolución completa de junio de 2017, que trae
  # el mismo ejercicio con los mismos datos.
  - id: exter2324-ext-1-la-misma-expansion-con-calor-y-sin-el
    tema: t03-sustancias-puras
    n: 1

  # Ejercicio 2 · el separador mal aislado, con la mejor lección de los tres:
  # un rendimiento exergético del 97,4 % en un equipo que el propio enunciado
  # llama «mal aislado».
  #
  # Al montar enero de 2020 —el 11 de septiembre de 2026— resultó que **este
  # enunciado también cayó allí, palabra por palabra**: mismos gastos, misma
  # referencia, misma superficie a 126 °C. Lo único que cambia es que aquella
  # convocatoria no pide la entropía generada. Así que esta resolución cubre
  # las dos, y la de 2020 la enlaza desde su `fuera`. Se dice aquí también
  # porque quien prepara el examen se merece saber que este enunciado ha caído
  # dos veces.
  - id: exter2324-ext-2-el-separador-mal-aislado-y-el-noventa-y-siete-por-ciento
    tema: t07-analisis-exergetico
    n: 2
