ejercicios:
  - id: exter2324-ext-2-el-separador-mal-aislado-y-el-noventa-y-siete-por-ciento
    titulo: El separador mal aislado, y el noventa y siete por ciento que engaña
    fuente: Ejercicio 2 de la convocatoria extraordinaria de 2023-2024, celebrada el 30 de enero de 2024 · Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El cuadernillo trae las respuestas anotadas al margen y la resolución oficial detrás; el desarrollo está contrastado contra las dos.
    nivel: examen
    enunciado: |
      En un separador térmicamente mal aislado, entran $0{,}5\ \text{kg/s}$ de
      vapor a $2\ \text{bar}$ y $250\ ^\circ\text{C}$, y salen dos corrientes,
      una de $0{,}1\ \text{kg/s}$ de líquido saturado y otra de vapor saturado
      seco. Tómese como estado de referencia $1\ \text{bar}$ y
      $19\ ^\circ\text{C}$, y como temperatura media de la superficie del
      separador, $126\ ^\circ\text{C}$. Calcúlese:

      a) Represéntese el proceso en los diagramas más apropiados.

      b) La entropía generada en el proceso.

      c) La exergía destruida en el proceso mediante el balance de exergía.

      d) El rendimiento exergético del separador.
    pide: La entropía generada, la exergía destruida y el rendimiento exergético.
    pasos:
      - tipo: reconocer
        pregunta: |
          El separador está «térmicamente mal aislado». ¿Qué añade eso al
          balance?
        opciones:
          - texto: Un término de calor que sale, y con él entropía por la superficie a 126 °C
            correcta: true
            mensaje: |
              Eso es, y por eso el enunciado da la temperatura de la superficie:
              hace falta para poder escribir $\dot{Q}/T$. Sin ese término la
              entropía generada saldría negativa, que es imposible.
          - texto: Nada, porque el calor perdido no lleva entropía
            mensaje: |
              Todo calor lleva entropía consigo: $\delta Q/T$. Y aquí el calor
              perdido es enorme —352 kW— porque al condensar el 20 % del vapor
              se libera muchísimo.
          - texto: Que hay que suponer un rendimiento de aislamiento
            mensaje: |
              No hay nada que suponer: el calor perdido sale del balance de
              energía, comparando lo que entra con lo que sale. Da 352 kW.
          - texto: Que el proceso deja de ser estacionario
            mensaje: |
              Sigue siendo estacionario: entra y sale lo mismo todo el rato. Mal
              aislado no quiere decir que cambie con el tiempo.

      - tipo: calcular
        titulo: El calor perdido
        pregunta: |
          Con $h_1 = 2971{,}0$, $h' = 504{,}7$ y $h'' = 2706{,}7\ \text{kJ/kg}$,
          ¿cuánto calor pierde el separador?
        respuesta:
          tipo: magnitud
          valor: '352.35 kW'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '1012.95 kW'
            mensaje: |
              Has repartido el gasto al revés: son 0,1 kg/s de líquido y 0,4 de
              vapor, no al contrario. Fíjate en lo lejos que cae el resultado:
              casi tres veces más.
          - valor: '1485.5 kW'
            mensaje: |
              Esa es la entalpía que entra, $0{,}5 \cdot 2971$. El calor
              perdido es la **diferencia** entre lo que entra y lo que sale.
        pista: |
          $\dot{Q} = \dot{m}_L h' + \dot{m}_V h'' - \dot{m}_1 h_1$.
        desarrollo: |
          $$
          \dot{Q} = 0{,}1 \cdot 504{,}7 + 0{,}4 \cdot 2706{,}7 - 0{,}5 \cdot 2971{,}0
          = -352{,}35\ \text{kW}
          $$

      - tipo: calcular
        titulo: La entropía generada
        pregunta: |
          Con $s_1 = 7{,}7086$, $s' = 1{,}5301$ y $s'' = 7{,}1271$, y la
          superficie a $126\ ^\circ\text{C}$, ¿cuánta entropía se genera?
        respuesta:
          tipo: magnitud
          valor: '0.0326 kW/K'
          tolerancia: 0.03
          formato: una entropía por unidad de tiempo, con su unidad
        distractores:
          - valor: '-0.8504 kW/K'
            mensaje: |
              Te has dejado el término del calor perdido. Sin él sale negativa,
              y una entropía generada negativa es la señal más clara de que
              falta un sumando: el segundo principio lo prohíbe.
          - valor: '0.3522 kW/K'
            mensaje: |
              Has dividido el calor entre la temperatura de referencia, 292 K,
              en vez de entre la de la superficie por la que sale, 399 K. Diez
              veces la respuesta buena: el término del calor es tan grande que
              equivocar su temperatura se lo come todo.
        pista: |
          $\dot{S}_G = \dot{m}_L s' + \dot{m}_V s'' - \dot{m}_1 s_1 - \dfrac{\dot{Q}}{T_{sup}}$.
        desarrollo: |
          $$
          \dot{S}_G = 3{,}00385 - 3{,}85430 + \frac{352{,}35}{399}
          = 0{,}0326\ \text{kW/K}
          $$

      - tipo: calcular
        titulo: La exergía destruida
        pregunta: |
          Con la referencia a $19\ ^\circ\text{C}$, ¿cuánta exergía se
          destruye?
        respuesta:
          tipo: magnitud
          valor: '9.53 kW'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '94.49 kW'
            mensaje: |
              Esa es la exergía que **sale con el calor perdido**, que es otra
              cosa: no se destruye dentro del separador, se marcha por la
              pared. Distinguir las dos es el corazón de este ejercicio.
          - valor: '352.35 kW'
            mensaje: |
              Esos son los kilovatios de **calor** que se pierden. Solo una
              parte de ellos era exergía, y solo una parte de esa se destruye.
        pista: |
          $\dot{B}_D = T_0 \dot{S}_G$.
        desarrollo: |
          $$
          \dot{B}_D = 292 \cdot 0{,}032633 = 9{,}53\ \text{kW}
          $$

      - tipo: justificar
        pregunta: Ordena la lectura del rendimiento. Una pieza es falsa.
        piezas:
          - texto: 'El rendimiento sale $1 - \dot{B}_D/\dot{B}_{entra} = 1 - 9{,}53/361{,}3 = 0{,}9736$, o sea un 97,36 %.'
          - texto: 'Pero de los 361,3 kW de exergía que entran, solo 257,3 salen en las dos corrientes útiles: los otros 94,5 se van con el calor perdido.'
          - texto: 'Un 97,4 % quiere decir que el separador está bien aislado y aprovecha casi todo.'
            trampa: true
            mensaje: |
              Justo al revés, y es lo que este ejercicio existe para enseñar. El
              enunciado dice «mal aislado» y pierde **352 kW de calor**. El
              97,4 % sale alto porque esa definición cuenta la exergía que se
              marcha por la pared como si fuera una salida. Mirando solo lo
              útil, el rendimiento es del **71 %**. Un rendimiento exergético
              alto no dice que un equipo sea bueno: dice qué se ha metido en el
              numerador.
    resolucion: |
      **Lo que añade estar mal aislado.** Un separador ideal sería adiabático y
      su único trabajo sería repartir el caudal. Este pierde calor, y el
      enunciado da la temperatura de su superficie precisamente porque hace
      falta para escribir $\dot{Q}/T$ en el balance de entropía.

      **El calor perdido, que es enorme.** Sale del balance de energía:

      $$
      \dot{Q} = 0{,}1 \cdot 504{,}7 + 0{,}4 \cdot 2706{,}7 - 0{,}5 \cdot 2971{,}0
      = -352{,}35\ \text{kW}
      $$

      Son 352 kW de una corriente de medio kilo por segundo, y no es un error:
      condensar el 20 % del vapor libera muchísimo calor latente.

      **b) La entropía generada.**

      $$
      \dot{S}_G = (0{,}1 \cdot 1{,}5301 + 0{,}4 \cdot 7{,}1271) - 0{,}5 \cdot 7{,}7086
      + \frac{352{,}35}{399} = 0{,}0326\ \text{kW/K}
      $$

      Conviene mirar los tamaños: los dos primeros sumandos rondan 3,9 y el
      resultado es **cien veces menor**. Redondear pronto se come la respuesta.

      **c) La exergía destruida.**

      $$
      \dot{B}_D = T_0\dot{S}_G = 292 \cdot 0{,}032633 = 9{,}53\ \text{kW}
      $$

      **d) Y el rendimiento, que es donde está la trampa.**

      $$
      \eta_B = 1 - \frac{\dot{B}_D}{\dot{B}_{entra}} = 1 - \frac{9{,}53}{361{,}3}
      = 0{,}9736
      $$

      Un **97,36 %**, y suena estupendo. Pero mira dónde va la exergía que entra: de los
      **361,3 kW**, salen **257,3** en las dos corrientes útiles, **94,5** se
      marchan por la pared con el calor perdido, y **9,5** se destruyen dentro.

      Esa definición cuenta los 94,5 kW que se escapan como si fueran una
      salida, porque técnicamente lo son: cruzan la frontera. Pero nadie los
      aprovecha. Mirando solo lo útil, el rendimiento del separador es del
      **71 %**.

      **La lección, y vale para cualquier rendimiento exergético que te
      encuentres:** un número alto no dice que el equipo sea bueno. Dice qué se
      ha puesto en el numerador. Aquí el enunciado avisa en su primera línea
      —«térmicamente mal aislado»— y el 97,4 % parece contradecirlo. No lo
      contradice: los dos son verdad a la vez, y saber por qué es lo que el
      examen está puntuando.

  - id: exter2324-ext-1-la-misma-expansion-con-calor-y-sin-el
    titulo: La misma expansión dos veces, con calor y sin él
    fuente: Ejercicio 1 de la convocatoria extraordinaria de 2023-2024, celebrada el 30 de enero de 2024 · Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El cuadernillo trae las respuestas anotadas al margen, y la resolución completa sale de junio de 2017, que trae el mismo ejercicio con los mismos datos; el desarrollo se hizo a ciegas y se contrastó contra las dos.
    nivel: examen
    enunciado: |
      Se expanden $0{,}25\ \text{kg}$ de aire contenidos en un dispositivo
      cilindro-pistón, pasando de $0{,}9\ \text{m}^{3}/\text{kg}$ a
      $1{,}5\ \text{m}^{3}/\text{kg}$ según un proceso ideal. Inicialmente, el
      aire se encuentra a $1\ \text{bar}$ y al final del proceso la temperatura
      es de $5\ ^\circ\text{C}$.

      a) Represéntese el proceso en los diagramas más apropiados (10%).

      b) El exponente politrópico del proceso (10%).

      c) El calor intercambiado durante el proceso (10%).

      d) El trabajo realizado (10%).

      e) La variación de entropía del aire (15%).

      f) Los apartados "a", "c", "d" y "e" anteriores si el proceso se realiza
      de forma adiabática, desde el mismo estado inicial hasta el mismo volumen
      final que en el caso anterior (45%).

      *Para el aire como gas ideal, la resolución toma
      $c_p = 1{,}0045$, $c_v = 0{,}718$ y
      $R' = 0{,}287\ \text{kJ/kg}\cdot\text{K}$.*
    pide: El exponente, el calor, el trabajo y la entropía, y lo mismo sin calor.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado dice «según un proceso **ideal**» y no da ningún
          exponente. ¿Qué se puede sacar de eso?
        opciones:
          - texto: Que es reversible, así que es politrópico y su exponente sale de los dos estados
            correcta: true
            mensaje: |
              Eso es. Un proceso ideal de un gas ideal es una politrópica, y
              para saber cuál basta con dos estados. Del inicial se tiene $P$ y
              $v$; del final, $v$ y $T$, y la presión que falta sale de la
              ecuación de estado.
          - texto: Que es adiabático, así que el exponente es γ = 1,4
            mensaje: |
              «Ideal» no quiere decir adiabático, y el enunciado lo deja claro:
              el caso adiabático es el apartado f), **otro** proceso distinto.
              Si este fuera adiabático, el aire acabaría a 255,6 K y no a los
              278 que dice el enunciado.
          - texto: Que es isotermo, porque «ideal» quiere decir sin cambio de temperatura
            mensaje: |
              La temperatura cambia: empieza en 313,6 K —sale de $Pv/R'$— y
              termina en 278. Un isotermo es una politrópica concreta, la de
              $n = 1$, y esta no lo es.
          - texto: Que hace falta conocer el calor para poder sacar el exponente
            mensaje: |
              Con el calor también se puede —es el camino de otro examen—,
              pero aquí no hace falta: dos estados completos fijan la
              politrópica. El calor es una de las cosas que se piden, no un
              dato.

      - tipo: calcular
        titulo: El exponente politrópico
        pregunta: |
          La presión final sale de la ecuación de estado:
          $P_2 = 287 \cdot 278/1{,}5 = 53.189\ \text{Pa}$. ¿Cuánto vale $n$?
        respuesta:
          tipo: numero
          valor: '1.2359'
          tolerancia: 0.005
          formato: un número, sin unidad
        distractores:
          - valor: '0.809'
            mensaje: |
              Has invertido el cociente de logaritmos. De $Pv^{n} = \text{cte}$
              sale $n = \ln(P_1/P_2)/\ln(v_2/v_1)$: el de las **presiones**
              arriba.
          - valor: '1.4'
            mensaje: |
              Eso es suponer el proceso adiabático, que es el apartado f) y no
              este. Con $n = 1{,}4$ el aire acabaría a 255,6 K, y el enunciado
              dice 278.
        pista: |
          $n = \dfrac{\ln(P_1/P_2)}{\ln(v_2/v_1)}$.
        desarrollo: |
          $$
          n = \frac{\ln(1/0{,}53189)}{\ln(1{,}5/0{,}9)} = 1{,}2359
          $$

      - tipo: calcular
        titulo: El calor intercambiado
        pregunta: |
          La energía interna baja $6{,}39\ \text{kJ}$ y el aire hace
          $10{,}83\ \text{kJ}$ de trabajo. ¿Cuánto calor intercambia?
        respuesta:
          tipo: magnitud
          valor: '4.44 kJ'
          tolerancia: 0.02
          formato: un calor, con su unidad y con su signo
        distractores:
          - valor: '-6.39 kJ'
            mensaje: |
              Esa es la variación de **energía interna**. Coincidiría con el
              calor si no hubiera trabajo, y aquí el aire hace 10,83 kJ.
          - valor: '10.83 kJ'
            mensaje: |
              Ese es el **trabajo**. El calor es lo que falta para cuadrar el
              primer principio: $Q = \Delta U + W$.
        pista: |
          $Q = \Delta U + W$, con $\Delta U = m\,c_v\,(T_2-T_1)$.
        desarrollo: |
          $$
          Q = -6{,}39 + 10{,}83 = 4{,}44\ \text{kJ}
          $$

          **Entra calor y la temperatura baja**, que es lo que pasa siempre
          que $1 < n < \gamma$: el gas hace más trabajo del que recibe en
          calor, y la diferencia la paga su energía interna.

      - tipo: calcular
        titulo: El trabajo de la expansión
        pregunta: |
          Con ese exponente y la temperatura bajando de $313{,}59$ a
          $278\ \text{K}$, ¿cuánto trabajo hace el aire?
        respuesta:
          tipo: magnitud
          valor: '10.83 kJ'
          tolerancia: 0.02
          formato: un trabajo, con su unidad y con su signo
        distractores:
          - valor: '43.3 kJ'
            mensaje: |
              Eso es el trabajo por **kilogramo**. Hay 0,25 kg de aire.
          - valor: '-10.83 kJ'
            mensaje: |
              El módulo está bien y el signo no. El volumen **crece**: el aire
              empuja el pistón y hace trabajo, que en el convenio de esta
              asignatura es positivo.
        pista: |
          $W = m\,\dfrac{R'\,(T_1-T_2)}{n-1}$.
        desarrollo: |
          $$
          W = 0{,}25 \cdot \frac{0{,}287\,(313{,}59-278)}{1{,}2359-1} = 10{,}83\ \text{kJ}
          $$

      - tipo: calcular
        titulo: El trabajo si fuera adiabático
        pregunta: |
          Ahora el apartado f): desde el mismo estado hasta el mismo volumen
          final, pero sin calor. ¿Cuánto trabajo hace?
        respuesta:
          tipo: magnitud
          valor: '10.4 kJ'
          tolerancia: 0.02
          formato: un trabajo, con su unidad y con su signo
        distractores:
          - valor: '10.83 kJ'
            mensaje: |
              Ese es el del proceso **con** calor. Se parecen, y la diferencia
              es precisamente lo que el ejercicio quiere que veas: sin calor el
              aire hace menos trabajo.
          - valor: '0 kJ'
            mensaje: |
              Adiabático quiere decir sin **calor**, no sin trabajo. Todo el
              trabajo sale ahora de la energía interna del aire, que por eso se
              enfría más.
        pista: |
          Sin calor, $W = -\Delta U = m\,c_v\,(T_1-T_3)$, con
          $T_3 = T_1\,(v_1/v_3)^{\gamma-1}$.
        desarrollo: |
          $$
          T_3 = 313{,}59 \cdot (0{,}9/1{,}5)^{0{,}4} = 255{,}6\ \text{K}
          $$

          $$
          W = 0{,}25 \cdot 0{,}718 \cdot (313{,}59-255{,}63) = 10{,}4\ \text{kJ}
          $$

      - tipo: justificar
        pregunta: Ordena la comparación entre las dos expansiones. Una pieza es falsa.
        piezas:
          - texto: 'Con calor, el aire hace 10,83 kJ de trabajo y su energía interna baja solo 6,39: los 4,44 kJ de calor pagan la diferencia.'
          - texto: 'Sin calor, todo el trabajo sale de su energía interna: hace 10,4 kJ y se enfría hasta 255,6 K en vez de 278.'
          - texto: 'Como el adiabático no intercambia calor, no pierde nada, y por eso es el que más trabajo hace.'
            trampa: true
            mensaje: |
              Al revés: el adiabático hace **menos** trabajo, 10,4 frente a
              10,83. No recibe energía de fuera, así que todo lo que entrega
              sale de su propia energía interna, y se enfría más. El calor que
              entra en el otro proceso es precisamente lo que le deja hacer más
              trabajo enfriándose menos.
    resolucion: |
      **Un proceso ideal de un gas ideal es una politrópica**, y el exponente
      sale de dos estados. El inicial da $T_1 = P_1 v_1/R' = 313{,}59\ \text{K}$;
      el final da la presión por la ecuación de estado:

      $$
      P_2 = \frac{287\cdot 278}{1{,}5} = 53.189\ \text{Pa}
      \qquad
      n = \frac{\ln(1/0{,}53189)}{\ln(1{,}5/0{,}9)} = 1{,}2359
      $$

      **a) Los diagramas.** En el P-v, una curva que baja desde $v = 0{,}9$
      hasta $1{,}5$; en el T-s, una que baja hacia la **derecha**, porque la
      entropía crece aunque la temperatura caiga. La adiabática del apartado f)
      sale del mismo punto más empinada en el P-v —su exponente es mayor— y
      **vertical** en el T-s.

      **c) y d) El calor y el trabajo**, por el primer principio:

      $$
      W = 0{,}25 \cdot \frac{0{,}287\,(313{,}59-278)}{1{,}2359-1} = 10{,}83\ \text{kJ}
      $$

      $$
      \Delta U = 0{,}25\cdot 0{,}718\cdot(278-313{,}59) = -6{,}39\ \text{kJ}
      \;\Longrightarrow\; Q = 4{,}44\ \text{kJ}
      $$

      Por el calor específico politrópico sale lo mismo:
      $c_n = 0{,}718\,\dfrac{1{,}4-1{,}2359}{1-1{,}2359} = -0{,}4995$, y
      $Q = 0{,}25\cdot(-0{,}4995)\cdot(278-313{,}59) = 4{,}44\ \text{kJ}$.

      **$c_n$ negativo: entra calor y la temperatura baja.** Pasa siempre que el
      exponente está entre 1 y $\gamma$, y es de las cosas que más desconciertan
      del tema: el gas recibe calor, pero hace más trabajo del que recibe, y la
      diferencia sale de su energía interna.

      **e) La entropía.**

      $$
      \Delta S = 0{,}25\left(1{,}0045\ln\frac{278}{313{,}59} + 0{,}287\ln\frac{1}{0{,}53189}\right)
      = 0{,}015\ \text{kJ/K}
      $$

      **f) La misma expansión, sin calor.** Con $n = \gamma = 1{,}4$:
      $T_3 = 313{,}59\,(0{,}9/1{,}5)^{0{,}4} = 255{,}6\ \text{K}$, $Q = 0$,
      $W = -\Delta U = 10{,}4\ \text{kJ}$ y $\Delta S = 0$.

      **Las dos columnas juntas, que es para lo que el examen las pide:**

      | | con calor | sin calor |
      |---|---|---|
      | exponente | 1,2359 | 1,4 |
      | calor | 4,44 kJ | 0 |
      | trabajo | 10,83 kJ | 10,4 kJ |
      | temperatura final | 278 K | 255,6 K |
      | variación de entropía | 0,015 kJ/K | 0 |

      Con calor el aire hace **más** trabajo y se enfría **menos**. El calor que
      entra no se «pierde» en ninguna parte: es lo que le permite entregar más
      sin gastar tanto de lo suyo.

      > **Y un aviso sobre redondear el exponente, que la resolución oficial
      > deja caer sin explicar.** Con $n = 1{,}235$ el calor específico
      > politrópico sale $-0{,}504$ y el calor, 4,49 kJ; con $n = 1{,}2359$,
      > $-0{,}4995$ y 4,44. Una diferencia del 1 % por la **cuarta** cifra de un
      > exponente, porque $c_n$ lleva $n-\gamma$ y $n-1$ dividiéndose, y los
      > dos son números pequeños. La resolución escribe 4,45 por un camino y
      > 4,44 por el otro, y lo atribuye al redondeo: es exactamente esto.
