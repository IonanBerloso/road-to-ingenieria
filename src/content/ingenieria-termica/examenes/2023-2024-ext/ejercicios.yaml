ejercicios:
  - id: exter2324-ext-2-el-separador-mal-aislado-y-el-noventa-y-siete-por-ciento
    titulo: El separador mal aislado, y el noventa y siete por ciento que engaña
    fuente: Ejercicio 2 de la convocatoria extraordinaria de 2023-2024, celebrada el 30 de enero de 2024 · Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El cuadernillo trae las respuestas anotadas al margen y la resolución oficial detrás; el desarrollo está contrastado contra las dos.
    nivel: examen
    enunciado: |
      En un separador térmicamente mal aislado, entran $0{,}5\ \text{kg/s}$ de
      vapor a $2\ \text{bar}$ y $250\ ^\circ\text{C}$, y salen dos corrientes,
      una de $0{,}1\ \text{kg/s}$ de líquido saturado y otra de vapor saturado
      seco. Tómese como estado de referencia $1\ \text{bar}$ y
      $19\ ^\circ\text{C}$, y como temperatura media de la superficie del
      separador, $126\ ^\circ\text{C}$. Calcúlese:

      a) Represéntese el proceso en los diagramas más apropiados.

      b) La entropía generada en el proceso.

      c) La exergía destruida en el proceso mediante el balance de exergía.

      d) El rendimiento exergético del separador.
    pide: La entropía generada, la exergía destruida y el rendimiento exergético.
    pasos:
      - tipo: reconocer
        pregunta: |
          El separador está «térmicamente mal aislado». ¿Qué añade eso al
          balance?
        opciones:
          - texto: Un término de calor que sale, y con él entropía por la superficie a 126 °C
            correcta: true
            mensaje: |
              Eso es, y por eso el enunciado da la temperatura de la superficie:
              hace falta para poder escribir $\dot{Q}/T$. Sin ese término la
              entropía generada saldría negativa, que es imposible.
          - texto: Nada, porque el calor perdido no lleva entropía
            mensaje: |
              Todo calor lleva entropía consigo: $\delta Q/T$. Y aquí el calor
              perdido es enorme —352 kW— porque al condensar el 20 % del vapor
              se libera muchísimo.
          - texto: Que hay que suponer un rendimiento de aislamiento
            mensaje: |
              No hay nada que suponer: el calor perdido sale del balance de
              energía, comparando lo que entra con lo que sale. Da 352 kW.
          - texto: Que el proceso deja de ser estacionario
            mensaje: |
              Sigue siendo estacionario: entra y sale lo mismo todo el rato. Mal
              aislado no quiere decir que cambie con el tiempo.

      - tipo: calcular
        titulo: El calor perdido
        pregunta: |
          Con $h_1 = 2971{,}0$, $h' = 504{,}7$ y $h'' = 2706{,}7\ \text{kJ/kg}$,
          ¿cuánto calor pierde el separador?
        respuesta:
          tipo: magnitud
          valor: '352.35 kW'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '1012.95 kW'
            mensaje: |
              Has repartido el gasto al revés: son 0,1 kg/s de líquido y 0,4 de
              vapor, no al contrario. Fíjate en lo lejos que cae el resultado:
              casi tres veces más.
          - valor: '1485.5 kW'
            mensaje: |
              Esa es la entalpía que entra, $0{,}5 \cdot 2971$. El calor
              perdido es la **diferencia** entre lo que entra y lo que sale.
        pista: |
          $\dot{Q} = \dot{m}_L h' + \dot{m}_V h'' - \dot{m}_1 h_1$.
        desarrollo: |
          $$
          \dot{Q} = 0{,}1 \cdot 504{,}7 + 0{,}4 \cdot 2706{,}7 - 0{,}5 \cdot 2971{,}0
          = -352{,}35\ \text{kW}
          $$

      - tipo: calcular
        titulo: La entropía generada
        pregunta: |
          Con $s_1 = 7{,}7086$, $s' = 1{,}5301$ y $s'' = 7{,}1271$, y la
          superficie a $126\ ^\circ\text{C}$, ¿cuánta entropía se genera?
        respuesta:
          tipo: magnitud
          valor: '0.0326 kW/K'
          tolerancia: 0.03
          formato: una entropía por unidad de tiempo, con su unidad
        distractores:
          - valor: '-0.8504 kW/K'
            mensaje: |
              Te has dejado el término del calor perdido. Sin él sale negativa,
              y una entropía generada negativa es la señal más clara de que
              falta un sumando: el segundo principio lo prohíbe.
          - valor: '0.3522 kW/K'
            mensaje: |
              Has dividido el calor entre la temperatura de referencia, 292 K,
              en vez de entre la de la superficie por la que sale, 399 K. Diez
              veces la respuesta buena: el término del calor es tan grande que
              equivocar su temperatura se lo come todo.
        pista: |
          $\dot{S}_G = \dot{m}_L s' + \dot{m}_V s'' - \dot{m}_1 s_1 - \dfrac{\dot{Q}}{T_{sup}}$.
        desarrollo: |
          $$
          \dot{S}_G = 3{,}00385 - 3{,}85430 + \frac{352{,}35}{399}
          = 0{,}0326\ \text{kW/K}
          $$

      - tipo: calcular
        titulo: La exergía destruida
        pregunta: |
          Con la referencia a $19\ ^\circ\text{C}$, ¿cuánta exergía se
          destruye?
        respuesta:
          tipo: magnitud
          valor: '9.53 kW'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '94.49 kW'
            mensaje: |
              Esa es la exergía que **sale con el calor perdido**, que es otra
              cosa: no se destruye dentro del separador, se marcha por la
              pared. Distinguir las dos es el corazón de este ejercicio.
          - valor: '352.35 kW'
            mensaje: |
              Esos son los kilovatios de **calor** que se pierden. Solo una
              parte de ellos era exergía, y solo una parte de esa se destruye.
        pista: |
          $\dot{B}_D = T_0 \dot{S}_G$.
        desarrollo: |
          $$
          \dot{B}_D = 292 \cdot 0{,}032633 = 9{,}53\ \text{kW}
          $$

      - tipo: justificar
        pregunta: Ordena la lectura del rendimiento. Una pieza es falsa.
        piezas:
          - texto: 'El rendimiento sale $1 - \dot{B}_D/\dot{B}_{entra} = 1 - 9{,}53/361{,}3 = 0{,}9736$, o sea un 97,36 %.'
          - texto: 'Pero de los 361,3 kW de exergía que entran, solo 257,3 salen en las dos corrientes útiles: los otros 94,5 se van con el calor perdido.'
          - texto: 'Un 97,4 % quiere decir que el separador está bien aislado y aprovecha casi todo.'
            trampa: true
            mensaje: |
              Justo al revés, y es lo que este ejercicio existe para enseñar. El
              enunciado dice «mal aislado» y pierde **352 kW de calor**. El
              97,4 % sale alto porque esa definición cuenta la exergía que se
              marcha por la pared como si fuera una salida. Mirando solo lo
              útil, el rendimiento es del **71 %**. Un rendimiento exergético
              alto no dice que un equipo sea bueno: dice qué se ha metido en el
              numerador.
    resolucion: |
      **Lo que añade estar mal aislado.** Un separador ideal sería adiabático y
      su único trabajo sería repartir el caudal. Este pierde calor, y el
      enunciado da la temperatura de su superficie precisamente porque hace
      falta para escribir $\dot{Q}/T$ en el balance de entropía.

      **El calor perdido, que es enorme.** Sale del balance de energía:

      $$
      \dot{Q} = 0{,}1 \cdot 504{,}7 + 0{,}4 \cdot 2706{,}7 - 0{,}5 \cdot 2971{,}0
      = -352{,}35\ \text{kW}
      $$

      Son 352 kW de una corriente de medio kilo por segundo, y no es un error:
      condensar el 20 % del vapor libera muchísimo calor latente.

      **b) La entropía generada.**

      $$
      \dot{S}_G = (0{,}1 \cdot 1{,}5301 + 0{,}4 \cdot 7{,}1271) - 0{,}5 \cdot 7{,}7086
      + \frac{352{,}35}{399} = 0{,}0326\ \text{kW/K}
      $$

      Conviene mirar los tamaños: los dos primeros sumandos rondan 3,9 y el
      resultado es **cien veces menor**. Redondear pronto se come la respuesta.

      **c) La exergía destruida.**

      $$
      \dot{B}_D = T_0\dot{S}_G = 292 \cdot 0{,}032633 = 9{,}53\ \text{kW}
      $$

      **d) Y el rendimiento, que es donde está la trampa.**

      $$
      \eta_B = 1 - \frac{\dot{B}_D}{\dot{B}_{entra}} = 1 - \frac{9{,}53}{361{,}3}
      = 0{,}9736
      $$

      Un **97,36 %**, y suena estupendo. Pero mira dónde va la exergía que entra: de los
      **361,3 kW**, salen **257,3** en las dos corrientes útiles, **94,5** se
      marchan por la pared con el calor perdido, y **9,5** se destruyen dentro.

      Esa definición cuenta los 94,5 kW que se escapan como si fueran una
      salida, porque técnicamente lo son: cruzan la frontera. Pero nadie los
      aprovecha. Mirando solo lo útil, el rendimiento del separador es del
      **71 %**.

      **La lección, y vale para cualquier rendimiento exergético que te
      encuentres:** un número alto no dice que el equipo sea bueno. Dice qué se
      ha puesto en el numerador. Aquí el enunciado avisa en su primera línea
      —«térmicamente mal aislado»— y el 97,4 % parece contradecirlo. No lo
      contradice: los dos son verdad a la vez, y saber por qué es lo que el
      examen está puntuando.
