ejercicios:
  - id: exter1718-ord-1-la-camara-de-mezcla-y-la-definicion-que-decide
    titulo: La cámara de mezcla, y la definición de rendimiento que lo decide todo
    fuente: Ejercicio 1 de la convocatoria ordinaria de enero de 2017-2018 · Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica su resolución oficial manuscrita, contra la que está contrastado el desarrollo.
    nivel: examen
    enunciado: |
      Se desea obtener vapor húmedo a $10\ \text{bar}$ y título del $80\ \%$ a
      partir de mezclar $2\ \text{kg/s}$ vapor sobrecalentado a
      $10\ \text{bar}$ y $200\ ^\circ\text{C}$ con agua a la misma presión y
      $20\ ^\circ\text{C}$. Tómese como estado de referencia
      $18\ ^\circ\text{C}$ y $1\ \text{bar}$.

      Determínese:

      a) La exergía destruida por unidad de tiempo en la cámara de mezcla.

      b) El rendimiento exergético de la cámara de mezcla.
    pide: La exergía destruida y el rendimiento exergético.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado no da el gasto de agua fría. ¿De dónde sale?
        opciones:
          - texto: Del balance de energía, porque el estado de salida está fijado
            correcta: true
            mensaje: |
              Eso es. La cámara es adiabática y no tiene trabajo, así que
              $\dot{m}_1h_1 + \dot{m}_2h_2 = (\dot{m}_1+\dot{m}_2)h_3$, y el
              estado 3 está completamente definido —10 bar y título 0,8—. Una
              ecuación, una incógnita.
          - texto: Del balance de entropía, igualando la generada a cero
            mensaje: |
              Eso sería suponer el proceso reversible, y una mezcla nunca lo
              es. De hecho el apartado a) pide justamente la entropía que se
              genera; si fuese cero no habría ejercicio.
          - texto: Hay que suponerlo, el enunciado está incompleto
            mensaje: |
              No falta nada: el enunciado fija la salida —10 bar, título 0,8—
              y eso es exactamente el dato que cierra el balance de energía.
          - texto: De la conservación de la masa, que da la proporción
            mensaje: |
              La conservación de masa dice $\dot{m}_3 = \dot{m}_1 + \dot{m}_2$,
              con dos incógnitas. Hace falta la energía para separarlas.

      - tipo: calcular
        titulo: El gasto de agua fría
        pregunta: |
          Con $h_1 = 2827{,}9$, $h_3 = 2375$ y
          $h_2 = 83{,}72\ \text{kJ/kg}$, ¿cuánta agua a 20 °C hay que meter?
        respuesta:
          tipo: magnitud
          valor: '0.395 kg/s'
          tolerancia: 0.02
          formato: un gasto másico, con su unidad
        distractores:
          - valor: '0.32 kg/s'
            mensaje: |
              Te has dejado el $h_2$ del denominador. El agua fría no entra con
              entalpía nula: entra con 83,72 kJ/kg, y eso resta.
          - valor: '2.395 kg/s'
            mensaje: |
              Ese es el gasto total de salida, $\dot{m}_1+\dot{m}_2$. La
              pregunta es cuánta agua **fría** se añade.
        pista: |
          $\dot{m}_2 = \dot{m}_1\dfrac{h_1-h_3}{h_3-h_2}$.
        desarrollo: |
          $$
          \dot{m}_2 = 2 \cdot \frac{2827{,}9-2375}{2375-83{,}72} = 0{,}395\ \text{kg/s}
          $$

      - tipo: calcular
        titulo: La exergía destruida
        pregunta: |
          Con $s_1 = 6{,}694$, $s_3 = 5{,}697$ y
          $s_2 = 0{,}2955\ \text{kJ/(kg}\cdot\text{K)}$, y la referencia a
          $18\ ^\circ\text{C}$, ¿cuánta exergía se destruye por segundo?
        respuesta:
          tipo: magnitud
          valor: '41 kW'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '0.141 kW'
            mensaje: |
              Esa es la entropía generada, en kW/K. Falta multiplicarla por la
              temperatura de referencia, 291 K.
          - valor: '719.5 kW'
            mensaje: |
              Ese es el salto de exergía específica de la corriente fría, en
              kJ/kg — un número intermedio, y además por kilo.
        pista: |
          $\dot{B}_D = T_0\left[(\dot{m}_1+\dot{m}_2)s_3 - \dot{m}_1s_1 - \dot{m}_2s_2\right]$.
        desarrollo: |
          $$
          \dot{S}_G = 2{,}395 \cdot 5{,}697 - 2 \cdot 6{,}694 - 0{,}395 \cdot 0{,}2955
          = 0{,}141\ \text{kW/K}
          $$

          $$
          \dot{B}_D = 291 \cdot 0{,}141 = 41{,}0\ \text{kW}
          $$

      - tipo: calcular
        titulo: El rendimiento exergético
        pregunta: |
          Midiendo cada corriente contra el estado muerto —$h_0 = 75{,}34$,
          $s_0 = 0{,}2673$—, sale $a_{f1}-a_{f0} = 882{,}4$,
          $a_{f2}-a_{f0} = 0{,}16$ y $a_{f3}-a_{f0} = 719{,}65\ \text{kJ/kg}$.
          ¿Cuál es el rendimiento exergético?
        respuesta:
          tipo: numero
          valor: '0.977'
          tolerancia: 0.005
          formato: una fracción entre 0 y 1
        distractores:
          - valor: '0.874'
            mensaje: |
              Ese sale de la **otra** definición: exergía ganada por la
              corriente fría partida por la cedida por la caliente. No es la
              que pide este examen, y la diferencia son diez puntos.
          - valor: '0.023'
            mensaje: |
              Esa es la fracción destruida, no la aprovechada. El rendimiento
              es lo que sale partido de lo que entra.
        pista: |
          $\eta_B = \dfrac{(\dot{m}_1+\dot{m}_2)(a_{f3}-a_{f0})}{\dot{m}_1(a_{f1}-a_{f0}) + \dot{m}_2(a_{f2}-a_{f0})}$.
        desarrollo: |
          $$
          \eta_B = \frac{2{,}395 \cdot 719{,}65}{2 \cdot 882{,}4 + 0{,}395 \cdot 0{,}16}
          = 0{,}977
          $$

      - tipo: justificar
        pregunta: Ordena la lectura del rendimiento. Una pieza es falsa.
        piezas:
          - texto: 'Se mide toda la exergía que sale contra toda la que entra, cada corriente referida al estado muerto: 1.723,8 frente a 1.764,8 kW.'
          - texto: 'La diferencia, 41 kW, es exactamente la exergía destruida del apartado anterior, así que las dos respuestas se comprueban entre sí.'
          - texto: 'Un 97,7 % es un rendimiento altísimo, así que la cámara de mezcla es un aparato casi reversible.'
            trampa: true
            mensaje: |
              El número es alto porque el **denominador** es enorme: el vapor
              trae 882 kJ/kg de exergía contra el ambiente y de eso solo se
              estropean 41 kW. Con la otra definición al uso —lo que gana la
              corriente fría entre lo que pierde la caliente— el mismo aparato
              da **87,4 %**. Mezclar nunca es casi reversible; lo que pasa es
              que el rendimiento exergético mide cosas distintas según cómo se
              defina, y hay que usar la que pida el enunciado.
    resolucion: |
      **a) El gasto que falta, y después la destrucción.** La cámara es
      adiabática y sin trabajo, así que el balance de energía cierra solo:

      $$
      \dot{m}_2 = \dot{m}_1\frac{h_1-h_3}{h_3-h_2}
      = 2\,\frac{2827{,}9-2375}{2375-83{,}72} = 0{,}395\ \text{kg/s}
      $$

      con $h_3 = 0{,}8 \cdot 2778{,}1 + 0{,}2 \cdot 762{,}81 = 2375$ y el agua
      a 20 °C tratada como incompresible, $h_2 = c\,\theta_2 = 83{,}72$.

      Con eso, la entropía generada y Guy-Stodola:

      $$
      \dot{S}_G = 2{,}395 \cdot 5{,}697 - 2 \cdot 6{,}694 - 0{,}395 \cdot 0{,}2955
      = 0{,}141\ \text{kW/K}
      \;\Longrightarrow\;
      \dot{B}_D = 291 \cdot 0{,}141 = 41{,}0\ \text{kW}
      $$

      **La resolución oficial lo hace por el balance de exergía y publica
      41,36 kW.** No son dos resultados distintos: son el mismo, y se puede
      demostrar que los dos caminos coinciden siempre en una cámara adiabática
      —el balance de energía hace que los términos de entalpía se cancelen y
      solo queden los de entropía—. Rehaciendo las cuentas sin redondear los
      pasos intermedios los dos dan **41,02**. La diferencia sale de escribir
      el gasto como 0,395 y la entalpía como 2375: cuarenta kilovatios
      obtenidos restando dos números de trescientos se mueven con muy poco.

      **b) El rendimiento, y aquí está el ejercicio de verdad.** Hay dos
      definiciones en circulación y **dan cosas muy distintas**. La que pide
      este examen mide toda la exergía que sale contra toda la que entra,
      referida cada corriente al estado muerto:

      $$
      \eta_B = \frac{(\dot{m}_1+\dot{m}_2)(a_{f3}-a_{f0})}
      {\dot{m}_1(a_{f1}-a_{f0}) + \dot{m}_2(a_{f2}-a_{f0})}
      = \frac{1723{,}8}{1764{,}8} = 0{,}977
      $$

      La otra —lo que gana la corriente fría entre lo que pierde la caliente—
      da **87,4 %** sobre exactamente los mismos datos. Diez puntos de
      diferencia, y ninguna de las dos está mal: miden cosas distintas.

      **Cómo saber cuál toca.** La del examen tiene un denominador enorme
      —el vapor trae 882 kJ/kg de exergía respecto del ambiente— así que el
      cociente sale alto casi haga lo que haga el aparato. Es la definición de
      «cuánta exergía sobrevive al proceso». La otra pregunta «de lo que se ha
      sacrificado, cuánto se ha aprovechado», y es la que distingue una
      instalación buena de una mala. **Un 97,7 % no dice que mezclar sea casi
      reversible** — dice que la mezcla estropea poco de mucho.

      Y la comprobación que ata los dos apartados: entra menos sale,
      $1764{,}8 - 1723{,}8 = 41{,}0$ kW, que es exactamente la exergía
      destruida del apartado a). Si no cuadra, uno de los dos está mal.
  - id: exter1718-ord-2-dos-gases-y-un-piston-que-se-mueve-solo
    titulo: Dos gases, un pistón que se mueve solo, y una irreversibilidad que está fuera
    fuente: Ejercicio 2 de la convocatoria ordinaria de enero de 2017-2018 · Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El examen publica su resolución oficial manuscrita, contra la que está contrastado el desarrollo. Su figura no se reproduce —es del cuadernillo— y se describe con palabras en el enunciado, porque la geometría queda determinada del todo.
    nivel: examen
    enunciado: |
      En el dispositivo mostrado en la figura, la parte en contacto con el foco
      de calor contiene $2\ \text{kg}$ de aire, y está separada del
      compartimento que contiene $0{,}85\ \text{kg}$ de Helio por una pared
      adiabática que puede moverse libremente y sin rozamiento. En el estado
      inicial ambos gases se encuentran a $22\ ^\circ\text{C}$ y
      $1\ \text{bar}$. Todas las paredes del dispositivo son adiabáticas
      excepto la que está en contacto con el foco de calor, que se encuentra a
      $400\ ^\circ\text{C}$. La presión final es la misma en ambos lados e
      igual a $1{,}3\ \text{bar}$. Calcúlese la entropía generada en el
      universo durante el proceso.

      *La figura del cuadernillo es un cilindro vertical con el helio arriba y
      el aire abajo, separados por el pistón adiabático, y el foco térmico
      debajo del todo, tocando el compartimento del aire. Las paredes
      exteriores están rayadas: son rígidas.*
    pide: La entropía generada en el universo.
    pasos:
      - tipo: reconocer
        pregunta: |
          El helio está encerrado por paredes adiabáticas y un pistón sin
          rozamiento que se mueve despacio. ¿Qué le pasa a su entropía?
        opciones:
          - texto: 'No cambia: adiabático, cuasiestático y sin rozamiento es isentrópico'
            correcta: true
            mensaje: |
              Eso es, y es la llave del problema. El helio no recibe calor y no
              genera entropía por su cuenta, así que $\Delta S_B = 0$ y su
              estado final se puede sacar solo con la relación isentrópica y
              la presión final que da el enunciado. Sin eso no habría por dónde
              empezar.
          - texto: Aumenta, porque el helio se comprime
            mensaje: |
              Comprimirse no genera entropía si se hace despacio y sin
              rozamiento. Lo que sube es su temperatura y su presión, no su
              entropía.
          - texto: Disminuye, porque cede trabajo
            mensaje: |
              Es al revés: el helio **recibe** trabajo del aire, que es quien
              empuja. Y en cualquier caso el trabajo no lleva entropía consigo.
          - texto: No se puede saber sin conocer su temperatura final
            mensaje: |
              Se puede, y en el orden contrario: **primero** se dice que es
              isentrópica y **de ahí** sale la temperatura final. Es el único
              camino, porque el enunciado no da ninguna temperatura del estado
              2.

      - tipo: calcular
        titulo: La temperatura final del helio
        pregunta: |
          Con $\gamma_{He} = 1{,}667$, ¿a qué temperatura acaba el helio al
          pasar de $1$ a $1{,}3\ \text{bar}$ de forma isentrópica?
        respuesta:
          tipo: magnitud
          valor: '327.65 K'
          tolerancia: 0.005
          formato: una temperatura, con su unidad
        distractores:
          - valor: '295 K'
            mensaje: |
              Esa es la inicial. El helio se comprime de 1 a 1,3 bar, y una
              compresión isentrópica siempre calienta.
          - valor: '318.5 K'
            mensaje: |
              Has usado el $\gamma = 1{,}4$ del aire. El helio es monoatómico:
              su $\gamma$ vale 1,667, y con él calienta más.
        pista: |
          $T_{B2} = T_{B1}\left(\dfrac{P_2}{P_1}\right)^{(\gamma-1)/\gamma}$.
        desarrollo: |
          $$
          T_{B2} = 295 \cdot 1{,}3^{\frac{0{,}667}{1{,}667}} = 327{,}65\ \text{K}
          $$

      - tipo: calcular
        titulo: La temperatura final del aire
        pregunta: |
          Las paredes **exteriores** son rígidas, así que el volumen total no
          cambia. Con $V_{total} = 6{,}9014\ \text{m}^{3}$ y
          $V_{B2} = 4{,}4496\ \text{m}^{3}$, ¿a qué temperatura acaba el aire?
        respuesta:
          tipo: magnitud
          valor: '555.27 K'
          tolerancia: 0.005
          formato: una temperatura, con su unidad
        distractores:
          - valor: '383.5 K'
            mensaje: |
              Has supuesto que el aire también mantiene su volumen. No lo
              mantiene: el pistón se mueve, y lo que se conserva es la **suma**
              de los dos.
          - valor: '673 K'
            mensaje: |
              Esa es la del foco. El aire no llega a ella: el proceso se para
              cuando la presión iguala 1,3 bar, no cuando se igualan las
              temperaturas.
        pista: |
          $V_{A2} = V_{total} - V_{B2}$, y después
          $T_{A2} = \dfrac{P_2 V_{A2}}{m_A R'_{aire}}$.
        desarrollo: |
          $$
          V_{A2} = 6{,}9014 - 4{,}4496 = 2{,}4517\ \text{m}^{3}
          $$

          $$
          T_{A2} = \frac{130 \cdot 2{,}4517}{2 \cdot 0{,}287} = 555{,}27\ \text{K}
          $$

      - tipo: calcular
        titulo: La entropía generada en el universo
        pregunta: |
          Con $\Delta S_{aire} = 1{,}121\ \text{kJ/K}$ y
          $Q = 460{,}23\ \text{kJ}$ tomados del foco a
          $400\ ^\circ\text{C}$, ¿cuánta entropía se genera?
        respuesta:
          tipo: magnitud
          valor: '0.437 kJ/K'
          tolerancia: 0.02
          formato: una entropía, con su unidad
        distractores:
          - valor: '1.121 kJ/K'
            mensaje: |
              Esa es solo la del aire. Falta el foco, que **pierde** entropía
              al ceder calor y entra en la suma con signo negativo.
          - valor: '1.805 kJ/K'
            mensaje: |
              Has sumado la del foco en vez de restarla. El calor sale del
              foco, así que su variación es negativa.
        pista: |
          $S_G = \Delta S_{aire} + \Delta S_{He} - \dfrac{Q}{T_{foco}}$, y la
          del helio es cero.
        desarrollo: |
          $$
          S_G = 1{,}121 + 0 - \frac{460{,}23}{673} = 1{,}121 - 0{,}684
          = 0{,}437\ \text{kJ/K}
          $$

      - tipo: justificar
        pregunta: Ordena la explicación de dónde está la irreversibilidad. Una pieza es falsa.
        piezas:
          - texto: 'Los dos gases evolucionan cuasiestáticamente y sin rozamiento, así que ninguno de los dos genera entropía por dentro.'
          - texto: 'Y sin embargo el universo genera 0,437 kJ/K, luego la causa tiene que estar en la frontera: el calor entra desde un foco a 400 °C a un aire que está muy por debajo.'
          - texto: 'Como los procesos internos son reversibles, el conjunto también lo es y los 0,437 kJ/K deben salir de un error de cuentas.'
            trampa: true
            mensaje: |
              Es exactamente la trampa que este ejercicio tiende. Que cada
              subsistema evolucione reversiblemente **no hace reversible al
              universo**: falta mirar cómo entra el calor. Cruzar un salto de
              temperatura finito es irreversible siempre, y aquí el salto es
              enorme —de 400 °C al aire, que arranca a 22—. La
              irreversibilidad es **externa**, y es la única que hay.
    resolucion: |
      **Por dónde se entra, que no es evidente.** El enunciado no da ninguna
      temperatura final, solo la presión. Lo que abre el problema es el helio:
      está en un compartimento adiabático, con un pistón sin rozamiento que se
      mueve despacio, así que su proceso es **isentrópico** y su estado final
      queda fijado solo con la presión:

      $$
      T_{B2} = 295 \cdot 1{,}3^{\frac{\gamma_{He}-1}{\gamma_{He}}} = 327{,}65\ \text{K}
      $$

      **La segunda llave: qué pared es rígida.** La que separa los dos gases se
      mueve; las de fuera no. Así que lo que se conserva es el **volumen
      total**, no el de cada compartimento:

      $$
      V_{B2} = \frac{0{,}85 \cdot 2{,}077 \cdot 327{,}65}{130} = 4{,}4496
      \qquad
      V_{A2} = 6{,}9014 - 4{,}4496 = 2{,}4517\ \text{m}^{3}
      $$

      $$
      T_{A2} = \frac{130 \cdot 2{,}4517}{2 \cdot 0{,}287} = 555{,}27\ \text{K}
      = 282{,}3\ ^\circ\text{C}
      $$

      **El calor y la entropía.** El aire sube su energía interna y además hace
      trabajo comprimiendo al helio, y ese trabajo es exactamente lo que el
      helio gana:

      $$
      Q = m_A c_v (T_{A2}-T_{A1}) + m_B c_{v,He}(T_{B2}-T_{B1})
      = 373{,}8 + 86{,}4 = 460{,}23\ \text{kJ}
      $$

      $$
      \Delta S_{aire} = 2\left[1{,}005\ln\frac{555{,}27}{295} - 0{,}287\ln 1{,}3\right]
      = 1{,}121\ \text{kJ/K}
      $$

      $$
      S_G = 1{,}121 + 0 - \frac{460{,}23}{673} = 0{,}437\ \text{kJ/K}
      $$

      **Y la pregunta que hay que saber contestar, que es la que puntúa.** Los
      dos gases evolucionan sin rozamiento y cuasiestáticamente: ninguno genera
      entropía por dentro. ¿De dónde salen entonces 0,437 kJ/K?

      De **fuera**. El calor entra desde un foco a 400 °C a un aire que arranca
      a 22 y acaba a 282, y cruzar un salto de temperatura finito es
      irreversible siempre. Es la única irreversibilidad del problema, y por
      eso el ejercicio está bien construido: quita todas las demás para dejarla
      sola y ver si la reconoces.

      **La lección general**, que vale para todo el tema: que cada parte de un
      sistema evolucione reversiblemente **no hace reversible al conjunto**.
      Hay que mirar siempre cómo cruzan las fronteras el calor y el trabajo, y
      el calor cruzando un salto de temperatura es la irreversibilidad más
      común y la más fácil de pasar por alto.
  - id: exter1718-ord-3-la-emisividad-que-sale-de-lo-que-sobra
    titulo: La emisividad que sale de lo que sobra
    fuente: >-
      Ejercicio 3 de la convocatoria ordinaria de enero de 2017-2018 ·
      Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen publica su resolución oficial manuscrita, y los trece valores de
      la cadena están rehechos y contrastados contra ella, del Reynolds a la
      emisividad.
    nivel: examen
    enunciado: |
      Por el interior de una tubería de $18\ \text{m}$ de longitud circula
      agua a $0{,}3\ \text{m/s}$. El agua entra a $97\ \text{°C}$ y sale a
      $93\ \text{°C}$. El diámetro interior es de $3\ \text{cm}$ y el espesor
      de $1\ \text{cm}$; la conductividad de la tubería, $55\ \text{W/(m·K)}$.

      La tubería discurre por una nave que se encuentra a $15\ \text{°C}$, y
      puede considerarse que el aire dentro de la nave **está en reposo**.

      Calcúlese la emisividad de la superficie exterior de la tubería,
      supuesto régimen estacionario.

      Propiedades del agua a 95 °C: $\rho = 961{,}4\ \text{kg/m}^{3}$,
      $c_p = 4.212\ \text{J/(kg·K)}$, $k = 0{,}677\ \text{W/(m·K)}$,
      $\text{Pr} = 1{,}85$,
      $\nu = 3{,}0889\cdot 10^{-7}\ \text{m}^{2}/\text{s}$.

      Propiedades del aire a 54,42 °C: $k = 0{,}02767\ \text{W/(m·K)}$,
      $\text{Pr} = 0{,}7217$,
      $\nu = 1{,}84\cdot 10^{-5}\ \text{m}^{2}/\text{s}$.
    pide: La emisividad de la superficie exterior de la tubería.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado no da ningún dato de radiación, y la incógnita es la
          emisividad. ¿Cómo se llega a ella?
        opciones:
          - texto: >-
              Por diferencia: el calor total que pierde el agua menos el que se
              va por convección exterior es el que se va por radiación, y de
              ahí se despeja la emisividad
            correcta: true
            mensaje: |
              Exacto, y es la estructura entera del ejercicio. Todo lo demás
              —Reynolds, resistencias, Rayleigh— está al servicio de esa resta.
              Fíjate en que la radiación es la única que no se puede calcular
              directamente, y por eso es la que se despeja.
          - texto: >-
              De la ley de Stefan-Boltzmann, con la temperatura de la
              superficie exterior
            mensaje: |
              Stefan-Boltzmann da el calor radiado **si conoces la
              emisividad**, que es justo lo que falta. La ecuación tiene dos
              incógnitas —el calor radiado y la emisividad— y hace falta otra
              vía para una de las dos.
          - texto: >-
              De una tabla de emisividades, según el material de la tubería
            mensaje: |
              El enunciado no dice de qué material es la tubería, solo su
              conductividad. Y aunque lo dijera, el ejercicio pide calcularla,
              no consultarla: es un problema inverso.

      - tipo: calcular
        titulo: El calor que pierde el agua
        pregunta: |
          ¿Cuánto calor pierde el agua a lo largo de los 18 metros?
        respuesta:
          tipo: magnitud
          valor: '3435 W'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '3.435 W'
            mensaje: |
              Un factor mil: has metido el calor específico en kJ/(kg·K) donde
              el enunciado lo da en julios. Y el resultado debería haberte
              parado: tres vatios y medio no enfrían cuatro grados a doscientos
              gramos de agua por segundo.
          - valor: '85883 W'
            mensaje: |
              Has usado un salto de 100 grados en vez de 4. El agua entra a 97
              y sale a 93: pierde cuatro grados en los dieciocho metros, no
              cien.
        pista: |
          Primero el gasto, $\dot m = \rho\,A\,c$ con
          $A = \pi D_1^{2}/4$, y luego $\dot Q = \dot m\,c_p\,\Delta\theta$.
        desarrollo: |
          $$
          \dot m = \rho\,\frac{\pi D_1^{2}}{4}\,c
          = 961{,}4\cdot 7{,}069\cdot 10^{-4}\cdot 0{,}3
          = 0{,}2039\ \frac{\text{kg}}{\text{s}}
          $$

          $$
          \dot Q = 0{,}2039\cdot 4.212\cdot 4 = 3.435\ \text{W}
          $$

      - tipo: calcular
        titulo: La temperatura de la superficie exterior
        pregunta: |
          Con la convección interior y la conducción de la pared, ¿a qué
          temperatura está la cara exterior del tubo?
        respuesta:
          tipo: magnitud
          valor: '93.85 C'
          tolerancia: 0.002
          formato: una temperatura, con su unidad
        distractores:
          - valor: '95 C'
            mensaje: |
              Esa es la temperatura media del **agua**, que es el otro extremo
              del circuito. Entre ella y la superficie exterior hay dos
              resistencias, y su caída es lo que hay que restar: 1,15 grados.
          - valor: '15 C'
            mensaje: |
              Esa es la de la nave. Si la superficie estuviera a 15 °C no
              habría salto de temperatura hacia el aire y no saldría calor por
              ninguna parte, cuando sabemos que salen 3.435 W.
        pista: |
          $\theta_2 = \theta_{agua} - \dot Q\,(R_1 + R_2)$, con
          $R_1 = 1/(h_1\pi D_1 L)$ y
          $R_2 = \ln(r_2/r_1)/(2\pi k L)$. El coeficiente interior sale de
          Dittus-Boelter, y el agua **se enfría**.
        desarrollo: |
          La convección interior es forzada y turbulenta:

          $$
          \text{Re} = \frac{0{,}3\cdot 0{,}03}{3{,}0889\cdot 10^{-7}} = 29.137
          > 2.100
          $$

          $$
          \text{Nu} = 0{,}023\cdot 29.137^{0{,}8}\cdot 1{,}85^{0{,}3} = 103{,}14
          \qquad
          h_1 = \frac{103{,}14\cdot 0{,}677}{0{,}03} = 2.327{,}5
          $$

          Y las dos resistencias:

          $$
          R_1 = \frac{1}{2.327{,}5\cdot\pi\cdot 0{,}03\cdot 18}
          = 2{,}53\cdot 10^{-4}
          \qquad
          R_2 = \frac{\ln(0{,}025/0{,}015)}{2\pi\cdot 55\cdot 18}
          = 8{,}21\cdot 10^{-5}
          $$

          $$
          \theta_2 = 95 - 3.435\,(2{,}53\cdot 10^{-4} + 8{,}21\cdot 10^{-5})
          = 93{,}85\ \text{°C}
          $$

          Poco más de un grado de caída en todo el tubo: el agua va deprisa y
          el acero conduce bien, así que la pared está prácticamente a la
          temperatura del agua. Toda la resistencia del problema está fuera.

      - tipo: calcular
        titulo: El calor que se va por convección natural
        pregunta: |
          Con el aire en reposo, la correlación laminar
          $\text{Nu} = 0{,}53\,\text{Ra}^{0{,}25}$ da
          $h_2 = 8{,}26\ \text{W/(m}^{2}\text{K)}$. ¿Cuánto calor se lleva la
          convección exterior?
        respuesta:
          tipo: magnitud
          valor: '1842 W'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '3435 W'
            mensaje: |
              Ese es el calor **total**. Si toda la pérdida fuese por
              convección no habría radiación, y entonces la emisividad saldría
              cero: el ejercicio no tendría respuesta.
          - valor: '1105 W'
            mensaje: |
              Has usado el diámetro interior, 0,03 m, para el área exterior. La
              superficie que ve el aire es la de fuera: $D_1 + 2e = 0{,}05$ m.
        pista: |
          $\dot Q_{conv} = h_2\,(\pi D_3 L)\,(\theta_2 - \theta_{f,ext})$, con
          $D_3 = 0{,}05\ \text{m}$.
        desarrollo: |
          $$
          A_2 = \pi\cdot 0{,}05\cdot 18 = 2{,}827\ \text{m}^{2}
          $$

          $$
          \dot Q_{conv} = 8{,}26\cdot 2{,}827\cdot(93{,}85 - 15)
          = 1.842\ \text{W}
          $$

          De dónde sale ese 8,26: la temperatura característica es la media
          entre superficie y fluido, $(93{,}85+15)/2 = 54{,}42\ \text{°C}$, y
          con las propiedades del aire a esa temperatura sale
          $\text{Gr} = 8{,}72\cdot 10^{5}$ y
          $\text{Ra} = 6{,}29\cdot 10^{5}$. Por debajo de $10^{9}$, así que la
          correlación laminar es aplicable y no hace falta Churchill-Chu.

      - tipo: calcular
        titulo: La emisividad
        pregunta: |
          Los watios que faltan se van por radiación. ¿Cuál es la emisividad
          de la superficie exterior?
        respuesta:
          tipo: numero
          valor: '0.885'
          tolerancia: 0.01
          formato: un número entre 0 y 1
        distractores:
          - valor: '0.5486'
            mensaje: |
              Has olvidado restar lo que la nave le devuelve al tubo: has
              dividido entre $\sigma T_2^{4}$ en vez de entre
              $\sigma\,(T_2^{4}-T_{nave}^{4})$. El intercambio es **neto**, y
              la nave, aunque esté a 15 °C, también radia.
          - valor: '1.908'
            mensaje: |
              Has usado el calor total, 3.435 W, en vez del que queda para la
              radiación. Y el resultado debería haberte parado: una emisividad
              mayor que uno es imposible, porque el cuerpo negro es el que más
              emite y su emisividad vale exactamente 1.
        pista: |
          El tubo es un cuerpo pequeño dentro de un recinto grande, así que
          $\dot Q_{rad} = \varepsilon_2 A_2\,\sigma\,(T_2^{4}-T_{nave}^{4})$,
          con $\sigma = 5{,}67\cdot 10^{-8}$ y las temperaturas en kelvin.
        desarrollo: |
          $$
          \dot Q_{rad} = 3.435 - 1.842 = 1.593\ \text{W}
          $$

          El tubo es una superficie pequeña dentro de una nave enorme, así que
          $F_{2\text{-}nave} \approx 1$ y $A_2 \ll A_{nave}$: la resistencia
          superficial de la nave es despreciable y el circuito se reduce al
          caso de memoria.

          $$
          \varepsilon_2 = \frac{\dot Q_{rad}}{A_2\,\sigma\,(T_2^{4}-T_{nave}^{4})}
          = \frac{1.593}{2{,}827\cdot 5{,}67\cdot 10^{-8}
          \left(366{,}85^{4} - 288^{4}\right)}
          = 0{,}885
          $$

      - tipo: justificar
        pregunta: Ordena la estructura del ejercicio. Una pieza es falsa.
        piezas:
          - texto: >-
              El calor total sale del balance del agua: 3.435 W en dieciocho
              metros.
          - texto: >-
              La temperatura de la cara exterior sale de restarle a los 95 °C
              del agua la caída de las dos resistencias interiores: 93,85 °C.
          - texto: >-
              Con ella se calcula la convección natural exterior, 1.842 W, y
              lo que sobra hasta el total —1.593 W— se va por radiación.
          - texto: >-
              Y la emisividad sale de Stefan-Boltzmann; si diera mayor que uno
              habría que redondearla a uno.
            trampa: true
            mensaje: |
              Si diera mayor que uno, el resultado estaría **mal** y habría
              que buscar el error, no redondear. La emisividad de un cuerpo
              negro es exactamente 1 y ningún cuerpo real emite más: pasar de
              uno significa que el calor radiado que has calculado es mayor
              que el máximo físicamente posible, y eso solo puede venir de una
              cuenta anterior equivocada.
    resolucion: |
      **La estructura, primero.** La radiación es lo único que no se puede
      calcular directamente, así que se despeja por diferencia: todo lo demás
      del ejercicio existe para llegar a esa resta.

      $$
      \dot Q_{rad} = |\dot Q| - \dot Q_{conv,ext}
      $$

      **1 · El calor total**, del balance del agua:

      $$
      \dot m = 961{,}4\cdot\frac{\pi\cdot 0{,}03^{2}}{4}\cdot 0{,}3 = 0{,}2039
      \qquad
      \dot Q = 0{,}2039\cdot 4.212\cdot 4 = 3.435\ \text{W}
      $$

      **2 · La temperatura exterior**, con Dittus-Boelter dentro y la
      resistencia cilíndrica de la pared:

      $$
      \text{Re} = 29.137
      \quad
      \text{Nu} = 103{,}14
      \quad
      h_1 = 2.327{,}5
      \quad
      R_1 = 2{,}53\cdot 10^{-4}
      \quad
      R_2 = 8{,}21\cdot 10^{-5}
      $$
      $$
      \theta_2 = 95 - 3.435\cdot 3{,}35\cdot 10^{-4} = 93{,}85\ \text{°C}
      $$

      **3 · La convección natural exterior**, a la temperatura característica
      de 54,42 °C:

      $$
      \text{Ra} = 6{,}29\cdot 10^{5} < 10^{9}
      \quad
      \text{Nu} = 0{,}53\,\text{Ra}^{0{,}25} = 14{,}93
      \quad
      h_2 = 8{,}26
      $$
      $$
      \dot Q_{conv} = 8{,}26\cdot 2{,}827\cdot 78{,}85 = 1.842\ \text{W}
      $$

      **4 · Y la emisividad**, con el tubo como cuerpo pequeño en un recinto
      grande:

      $$
      \dot Q_{rad} = 3.435 - 1.842 = 1.593\ \text{W}
      \qquad
      \varepsilon_2 = \frac{1.593}{2{,}827\cdot 5{,}67\cdot 10^{-8}
      \left(366{,}85^{4}-288^{4}\right)} = 0{,}885
      $$

      **Por qué este ejercicio vale por los tres temas.** Es el único del
      material que junta los tres mecanismos en un solo circuito: conducción
      en la pared, convección forzada dentro, convección natural fuera y
      radiación en paralelo con esta última. Y trae la lectura que resume el
      bloque entero: de los 3.435 W que pierde el agua, **1.593 se van por
      radiación**, casi la mitad. A 94 °C la radiación ya no es despreciable,
      y un cálculo que solo mirara la convección se quedaría corto por un
      factor de casi dos.
