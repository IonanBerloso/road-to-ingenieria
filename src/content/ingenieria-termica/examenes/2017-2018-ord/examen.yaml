asignatura: ingenieria-termica
curso: '2017-2018'
convocatoria: ordinaria
fecha: 15 de enero de 2018
# La convocatoria más antigua de Térmica con el temario de ahora, y por eso
# vale la pena tenerla: enseña qué es lo que **no** ha cambiado en ocho años.
# Los tres huecos son los de siempre —una cámara de mezcla, un sistema cerrado
# con entropía generada y un problema de transmisión de calor— y el reparto
# también: «cada ejercicio vale un tercio del valor total del examen».
#
# Lo que sí ha cambiado es la duración: este da **3,5 horas**, y desde
# 2019-2020 la mayoría son 2,5. La ruta lo tiene contado convocatoria por
# convocatoria.
#
# Está escrito **solo en castellano**, mientras que enero de 2023 y enero de
# 2025 son bilingües y las dos convocatorias de 2014-2015 salen solo en
# euskera. Conviene saberlo antes de sentarse: los tres formatos existen y no
# se elige.
pdf: 2017-2018-ord.pdf

fuera:
  - n: 2
    motivo: >-
      Un cilindro con 2 kg de aire y 0,85 kg de helio separados por una pared
      adiabática que puede moverse sin rozamiento, con la parte del aire
      apoyada en un foco a 400 °C, y pide la entropía generada en el universo.
      **Sin transcribir todavía**, y no por falta de material: el PDF trae su
      resolución oficial. Es el único ejercicio del corpus con **dos gases
      distintos a los dos lados de un pistón interno que se mueve**, así que
      cuando se escriba conviene que sea entero — la pared es adiabática y
      móvil, de modo que los dos gases acaban a la misma presión pero **no a
      la misma temperatura**, y ahí está toda la gracia.

ejercicios:
