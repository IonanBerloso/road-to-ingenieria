asignatura: ingenieria-termica
curso: '2017-2018'
convocatoria: ordinaria
fecha: 15 de enero de 2018
# La convocatoria más antigua de Térmica con el temario de ahora, y por eso
# vale la pena tenerla: enseña qué es lo que **no** ha cambiado en ocho años.
# Los tres huecos son los de siempre —una cámara de mezcla, un sistema cerrado
# con entropía generada y un problema de transmisión de calor— y el reparto
# también: «cada ejercicio vale un tercio del valor total del examen».
#
# Lo que sí ha cambiado es la duración: este da **3,5 horas**, y desde
# 2019-2020 la mayoría son 2,5. La ruta lo tiene contado convocatoria por
# convocatoria.
#
# Está escrito solo en castellano, al contrario que enero de 2025 —que sale
# solo en euskera— y que enero de 2023, que es bilingüe. Conviene saberlo antes
# de sentarse: los tres formatos existen.
pdf: 2017-2018-ord.pdf

fuera:
  - n: 1
    motivo: >-
      Una cámara de mezcla que produce vapor húmedo a 10 bar y título 0,80
      juntando 2 kg/s de vapor sobrecalentado a 10 bar y 200 °C con agua a la
      misma presión y 20 °C, y pide la exergía destruida y el rendimiento
      exergético. **Sin transcribir todavía**: no falta material —el PDF trae
      su resolución oficial— sino el trabajo de escribirlo como ejercicio
      guiado.
  - n: 2
    motivo: >-
      Un cilindro con 2 kg de aire y 0,85 kg de helio separados por una pared
      adiabática que puede moverse sin rozamiento, con la parte del aire
      apoyada en un foco a 400 °C, y pide la entropía generada en el universo.
      **Sin transcribir todavía**, por lo mismo que el 1. Es además el único
      ejercicio del corpus con **dos gases distintos a los dos lados de un
      pistón interno**, así que cuando se escriba conviene que sea entero.

ejercicios:
  - id: exter1718-ord-3-la-emisividad-que-sale-de-lo-que-sobra
    tema: t10-radiacion
    n: 3
