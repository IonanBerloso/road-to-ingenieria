# Bilingüe, con el castellano en la primera página y el euskera en la segunda.
# Da **3 horas** y cada ejercicio vale un tercio.
#
# **Este PDF tiene capa de texto y no sirve para nada.** `pdftotext` devuelve
# ruido —«!  "# $% & ' !( )%»— porque el documento se compuso con una fuente
# cuyos códigos no corresponden a los caracteres. Es la única convocatoria de
# Térmica así: las demás o traen texto legible o son escaneos sin capa
# ninguna. Se transcribió mirando las páginas renderizadas, como los escaneos.
#
# **Tercera repetición literal encontrada entre convocatorias.** Su ejercicio 2
# es el ejercicio 1 de la extraordinaria de 2023-2024, palabra por palabra:
# los mismos 0,25 kg de aire de 0,9 a 1,5 m³/kg, el mismo 1 bar inicial, los
# mismos 5 °C finales y el mismo apartado adiabático al final. Van tres
# repeticiones y las tres con cuatro o más años de separación — es un patrón
# que quien prepara el examen debería conocer, y por eso se dice en las dos
# convocatorias implicadas y no en una nota interna.
pdf: 2016-2017-ext.pdf

fuera:
  - n: 2
    motivo: >-
      Los 0,25 kg de aire que se expanden de 0,9 a 1,5 m³/kg por un proceso
      ideal, con los cuatro apartados repetidos después en versión adiabática.
      **No se transcribe aquí porque es el mismo enunciado que el ejercicio 1
      de la extraordinaria de 2023-2024**, dígito a dígito. Aquel está también
      sin transcribir, así que el trabajo pendiente es uno solo y no dos: se
      escribirá allí, que es donde el cuadernillo trae además las respuestas
      anotadas al margen —10,83 kJ de trabajo contra 10,4 en el caso
      adiabático, y 0,015 kJ/K de entropía contra cero—.

ejercicios:
  # Ejercicio 1 · el compresor de nitrógeno, que es el peldaño de examen del
  # escalón del rendimiento exergético. Escrito el 12 de septiembre de 2026.
  - id: exter1617-ext-1-el-compresor-que-rinde-mas-exergetico-que-isentropico
    tema: t07-analisis-exergetico
    n: 1

  # Ejercicio 3 · la pantalla de radiación que hay que diseñar. El problema
  # inverso: el intercambio es dato y lo que se busca es la emisividad.
  - id: exter1617-ext-3-la-pantalla-que-hay-que-disenar
    tema: t10-radiacion
