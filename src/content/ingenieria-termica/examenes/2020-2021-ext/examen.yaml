# Bilingüe, con el castellano en la primera página y el euskera en la segunda.
# Las otras veintiocho son la resolución del profesor. Da **2,5 horas** y cada
# ejercicio vale un tercio.
#
# **Es la convocatoria hermana de la de enero de 2021, y no se parecen en
# nada.** La de enero era el único examen encadenado del corpus, con los tres
# ejercicios colgando unos de otros; esta tiene tres independientes y de tres
# bloques distintos —sustancia pura, volumen de control con exergía, y
# convección—. Conviene tenerlo presente al preparar: dos convocatorias del
# mismo curso no comparten forma.
#
# Su ejercicio 2 es el que entra, y su gracia está en un detalle del enunciado
# que se lee sin verlo: **el aire entra a 20 °C y la referencia para la exergía
# es 20 °C**, así que el aire entra en el estado muerto. Con eso el rendimiento
# exergético sale del 26,74 % en un aparato que no pierde ni un julio de
# energía.
pdf: 2020-2021-ext.pdf

