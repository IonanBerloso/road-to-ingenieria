asignatura: ingenieria-termica
convocatoria: extraordinaria
curso: '2020-2021'
fecha: febrero de 2021
# Bilingüe, con el castellano en la primera página y el euskera en la segunda.
# Las otras veintiocho son la resolución del profesor. Da **2,5 horas** y cada
# ejercicio vale un tercio.
#
# **Es la convocatoria hermana de la de enero de 2021, y no se parecen en
# nada.** La de enero era el único examen encadenado del corpus, con los tres
# ejercicios colgando unos de otros; esta tiene tres independientes y de tres
# bloques distintos —sustancia pura, volumen de control con exergía, y
# convección—. Conviene tenerlo presente al preparar: dos convocatorias del
# mismo curso no comparten forma.
#
# Su ejercicio 2 es el que entra, y su gracia está en un detalle del enunciado
# que se lee sin verlo: **el aire entra a 20 °C y la referencia para la exergía
# es 20 °C**, así que el aire entra en el estado muerto. Con eso el rendimiento
# exergético sale del 26,74 % en un aparato que no pierde ni un julio de
# energía.
pdf: 2020-2021-ext.pdf

fuera:
  - n: 1
    motivo: >-
      Un recipiente rígido con 2 kg de agua a 2 bar y título 0,2, al que se
      aporta calor desde una fuente a 300 °C **hasta triplicar su presión**.
      Pide el calor aportado, la temperatura final y la entropía generada en el
      universo. **Sin transcribir todavía**: no falta material —el PDF trae su
      resolución oficial, con el diagrama T-v dibujado— sino el trabajo de
      escribirlo. Es el molde del depósito rígido con título, el mismo que ya
      tiene escalón propio, y aquí con la vuelta de tuerca de que el estado
      final se da **por la presión** y no por la temperatura: hay que entrar en
      la tabla de 6 bar con el volumen específico de la de 2.
  - n: 3
    motivo: >-
      Una esfera de acero de 4 cm con la superficie a 60 °C, sumergida en una
      corriente de agua a 15 °C que fluye a 2 m/s, y el flujo de calor que
      disipa. **Sin transcribir todavía**, por lo mismo. Cuando se escriba,
      conviene hacerlo **al lado del de los cascos de ciclismo** de febrero de
      2026, que es la otra aparición de esta familia en el corpus: aquel es una
      hemiesfera en aire y este una esfera entera en agua, así que entre los
      dos se ve qué parte de la correlación depende de la forma y qué parte del
      fluido. Es además el enunciado más corto de toda la asignatura — tres
      líneas — y esa brevedad engaña: casi todo el trabajo es elegir a qué
      temperatura se evalúa cada propiedad.

ejercicios:
  # Ejercicio 2 · el intercambiador cuyo fluido frío entra en el estado muerto.
  - id: exter2021-ext-2-el-aire-que-entra-en-el-estado-muerto
    tema: t07-analisis-exergetico
    n: 2
