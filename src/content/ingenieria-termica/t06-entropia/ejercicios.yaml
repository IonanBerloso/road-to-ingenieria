ejercicios:
  - id: ejter-la-entropia-que-genera-el-universo
    titulo: Un proceso reversible que genera entropía
    fuente: >-
      Apartados b) y c) del ejercicio 1 de la convocatoria ordinaria de enero
      de 2026 · Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU). El examen publica su resolución oficial, y el desarrollo está
      contrastado contra ella.
    nivel: examen
    enunciado: |
      En un cilindro-pistón se expanden $m = 3\ \text{kg}$ de aire desde
      $557{,}5\ \text{K}$ y $600\ \text{kPa}$ hasta $27\ \text{°C}$ y
      $134{,}144\ \text{kPa}$, según un **proceso reversible** durante el cual
      se ceden 240 kJ de calor al medio circundante, que está a
      $20\ \text{°C}$. El exponente politrópico del proceso es
      $n = 1{,}705$ y su calor específico
      $c_n = 0{,}3107\ \text{kJ/(kg·K)}$.

      Datos del aire: $c_v = 0{,}7175$, $c_p = 1{,}0045$,
      $R' = 0{,}287\ \text{kJ/(kg·K)}$.

      a) La entropía generada en el proceso que ocurre en el cilindro-pistón.

      b) La entropía generada en el universo.
    pide: Las dos entropías generadas, la del sistema y la del universo.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado dice que el proceso es reversible. ¿Qué se puede
          anticipar de la entropía generada **en el cilindro**?
        opciones:
          - texto: >-
              Que vale cero: la generación de entropía es exactamente la
              medida de la irreversibilidad, y aquí no la hay dentro del
              sistema
            correcta: true
            mensaje: |
              Exacto. Y aun así hay que calcularla, porque el apartado la pide
              y porque el cero es la **comprobación** de que has evaluado bien
              los dos términos del balance.
          - texto: >-
              Que vale lo mismo que la del universo, porque el sistema está
              dentro del universo
            mensaje: |
              El universo incluye además el medio circundante, y ahí es donde
              va a aparecer la irreversibilidad: el calor cruza con una
              diferencia finita de temperaturas. Las dos cifras van a salir
              distintas, y esa diferencia es todo el ejercicio.
          - texto: >-
              Que es negativa, porque el sistema cede calor
            mensaje: |
              Ceder calor hace bajar la **entropía** del sistema, no su
              entropía **generada**. La generada nunca es negativa: es el
              término que el segundo principio obliga a ser mayor o igual que
              cero.

      - tipo: calcular
        titulo: La variación de entropía del aire
        pregunta: |
          ¿Cuánto vale $m\,(s_2 - s_1)$?
        respuesta:
          tipo: magnitud
          valor: '-0.5776 kJ/K'
          tolerancia: 0.02
          formato: una entropía, con su unidad
        distractores:
          - valor: '-1.8683 kJ/K'
            mensaje: |
              Has usado $c_v$ con el cociente de presiones, o $c_p$ con el de
              volúmenes: las dos formas de la fórmula tienen que ir emparejadas.
              O bien $c_v\ln(T_2/T_1) + R'\ln(V_2/V_1)$, o bien
              $c_p\ln(T_2/T_1) - R'\ln(P_2/P_1)$, y el signo del segundo
              término cambia con ellas.
          - valor: '0.5776 kJ/K'
            mensaje: |
              El signo. El aire se enfría de 557,5 K a 300 K cediendo calor,
              así que su entropía **baja**. Que baje no tiene nada de raro: lo
              que no puede bajar es la del universo.
        pista: |
          $m(s_2-s_1) = m\left[c_p\ln\frac{T_2}{T_1} - R'\ln\frac{P_2}{P_1}\right]$,
          con las temperaturas en kelvin.
        desarrollo: |
          $$
          m\,(s_2-s_1) = 3\left[1{,}0045\ln\!\frac{300}{557{,}5}
          - 0{,}287\ln\!\frac{134{,}144}{600}\right]
          $$
          $$
          = 3\,[-0{,}6227 + 0{,}4298] = -0{,}5776\ \frac{\text{kJ}}{\text{K}}
          $$

          Los dos términos tiran en sentidos contrarios: enfriarse baja la
          entropía y expandirse la sube. Gana el enfriamiento.

      - tipo: calcular
        titulo: La entropía que se va con el calor
        pregunta: |
          ¿Cuánto vale $\int_1^2 \delta Q/T$ **para el sistema**?
        respuesta:
          tipo: magnitud
          valor: '-0.5776 kJ/K'
          tolerancia: 0.02
          formato: una entropía, con su unidad
        distractores:
          - valor: '-0.8191 kJ/K'
            mensaje: |
              Has dividido los 240 kJ por la temperatura del **medio
              circundante**, 293 K. Esa es la cuenta del medio, no la del
              sistema: la frontera del cilindro está a la temperatura del gas,
              que va cambiando durante el proceso, y por eso aquí hay que
              integrar.
          - valor: '-0.4303 kJ/K'
            mensaje: |
              Has dividido los 240 kJ por la temperatura inicial, 557,5 K,
              como si la frontera se mantuviera ahí. El gas se enfría durante
              el proceso, así que la temperatura del denominador va cambiando:
              esa es la razón de que el término sea una integral.
        pista: |
          En un proceso politrópico, $\delta Q = m\,c_n\,dT$, así que la
          integral vale $m\,c_n\ln(T_2/T_1)$.
        desarrollo: |
          $$
          \int_1^2 \frac{\delta Q}{T} = \int_1^2 \frac{m\,c_n\,dT}{T}
          = m\,c_n \ln\!\frac{T_2}{T_1}
          $$
          $$
          = 3\cdot 0{,}3107\cdot \ln\!\frac{300}{557{,}5}
          = -0{,}5776\ \frac{\text{kJ}}{\text{K}}
          $$

          El mismo número que el paso anterior, y no por casualidad: es lo que
          significa que el proceso sea internamente reversible.

      - tipo: calcular
        titulo: La entropía generada en el universo
        pregunta: |
          El medio circundante recibe los 240 kJ a temperatura constante de
          20 °C. ¿Cuánta entropía se genera en el universo?
        respuesta:
          tipo: magnitud
          valor: '0.2415 kJ/K'
          tolerancia: 0.02
          formato: una entropía, con su unidad
        distractores:
          - valor: '0 kJ/K'
            mensaje: |
              Ese es el resultado del sistema, no el del universo. Que el
              proceso sea reversible **dentro** del cilindro no impide que la
              transferencia de calor al ambiente sea irreversible: cruza una
              diferencia finita de temperaturas, y eso genera entropía.
          - valor: '1.3967 kJ/K'
            mensaje: |
              Has sumado los dos valores absolutos en vez de sumarlos con su
              signo. La entropía del sistema **baja** 0,5776 y la del medio
              **sube** 0,8191: se restan, y lo que queda es lo que se ha
              creado.
        pista: |
          $\Delta S_{MC} = Q/T_{MC}$ con $Q = +240$ para el medio, y luego
          suma las dos variaciones.
        desarrollo: |
          $$
          \Delta S_{MC} = \frac{Q}{T_{MC}} = \frac{240}{293}
          = 0{,}8191\ \frac{\text{kJ}}{\text{K}}
          $$

          El universo es un sistema aislado, así que toda su variación de
          entropía es entropía generada:

          $$
          S_{G,univ} = \Delta S_{sist} + \Delta S_{MC}
          = -0{,}5776 + 0{,}8191 = 0{,}2415\ \frac{\text{kJ}}{\text{K}}
          $$

      - tipo: justificar
        pregunta: Ordena por qué genera entropía un proceso reversible. Una pieza es falsa.
        piezas:
          - texto: >-
              Dentro del cilindro no hay irreversibilidad: la entropía que
              pierde el gas es exactamente la que se lleva el calor, y
              $S_G = 0$.
          - texto: >-
              Pero esos 240 kJ salen de un gas que está entre 284 y 27 °C y
              entran en un ambiente que está a 20 °C.
          - texto: >-
              Transferir calor con una diferencia finita de temperaturas es
              irreversible —es la tercera condición del tema 5—, y ahí es
              donde se generan los 0,2415 kJ/K.
          - texto: >-
              Luego el enunciado se contradice: un proceso no puede ser
              reversible y generar entropía a la vez.
            trampa: true
            mensaje: |
              No hay contradicción porque no se habla del mismo sistema.
              «Reversible» califica al proceso **dentro** del cilindro; la
              entropía generada que sale distinta de cero es la del
              **universo**, que incluye la frontera y el ambiente. La
              distinción entre irreversibilidad interna y externa existe
              justamente para poder decir esto sin contradecirse.
    resolucion: |
      **a) En el cilindro-pistón.** El balance de entropía del sistema es

      $$
      S_G = m\,(s_2-s_1) - \int_1^2\frac{\delta Q}{T}
      $$

      El primer término, con la fórmula del gas ideal:

      $$
      m\,(s_2-s_1) = 3\left[1{,}0045\ln\!\frac{300}{557{,}5}
      - 0{,}287\ln\!\frac{134{,}144}{600}\right] = -0{,}5776\ \frac{\text{kJ}}{\text{K}}
      $$

      El segundo, integrando sobre el proceso politrópico:

      $$
      \int_1^2\frac{\delta Q}{T} = m\,c_n\ln\!\frac{T_2}{T_1}
      = 3\cdot 0{,}3107\cdot\ln\!\frac{300}{557{,}5} = -0{,}5776\ \frac{\text{kJ}}{\text{K}}
      $$

      $$
      S_{G,sist} = -0{,}5776 - (-0{,}5776) = 0
      $$

      Coherente con que el enunciado declare el proceso reversible.

      **b) En el universo.** El medio circundante recibe los 240 kJ a
      temperatura constante, porque es lo bastante grande como para no
      calentarse:

      $$
      \Delta S_{MC} = \frac{240}{293} = 0{,}8191\ \frac{\text{kJ}}{\text{K}}
      $$

      $$
      S_{G,univ} = -0{,}5776 + 0{,}8191 = 0{,}2415\ \frac{\text{kJ}}{\text{K}}
      $$

      **Lo que hay que llevarse.** Los mismos 240 kJ valen −0,5776 kJ/K de
      entropía saliendo del gas y +0,8191 kJ/K entrando en el ambiente. La
      diferencia no es un error de redondeo: es lo que se pierde al dejar que
      el calor caiga por un desnivel de temperatura en vez de aprovecharlo.
      Cuánto vale eso en trabajo es la pregunta del tema 7.

  - id: ejter-la-mezcla-adiabatica-de-dos-corrientes
    titulo: Dos corrientes de aire que se mezclan
    fuente: >-
      Ejercicio 5.8 de la colección de problemas de los temas 5 y 6 ·
      Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      material no publica sus resultados, así que el desarrollo es nuestro y
      está comprobado por dos vías independientes: la temperatura tiene que
      caer entre las dos de partida y ponderada por las masas, y la entropía
      generada tiene que salir positiva.
    nivel: practica
    enunciado: |
      Se mezclan adiabáticamente, a la presión de $1\ \text{bar}$,
      $100\ \text{m}^{3}/\text{s}$ de aire a $20\ \text{°C}$ con
      $50\ \text{m}^{3}/\text{s}$ de aire a $90\ \text{°C}$.

      Datos del aire: $R' = 0{,}287$, $c_p = 1{,}0045\ \text{kJ/(kg·K)}$.

      a) La temperatura de la corriente resultante.

      b) La entropía generada en el proceso.
    pide: La temperatura de la mezcla y la entropía generada por unidad de tiempo.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado da caudales **volumétricos**, y las dos corrientes
          están a temperaturas distintas. ¿Se pueden sumar directamente?
        opciones:
          - texto: >-
              No: lo que se conserva es la masa, y el mismo volumen de aire
              caliente pesa menos que el de aire frío
            correcta: true
            mensaje: |
              Exacto. A 1 bar, un metro cúbico de aire a 20 °C tiene 1,19 kg y
              a 90 °C solo 0,96. Hay que pasar los dos caudales a másicos con
              la ecuación de estado antes de hacer ningún balance.
          - texto: >-
              Sí: el volumen también se conserva en régimen estacionario
            mensaje: |
              El volumen no se conserva, y aquí se ve bien: la mezcla resulta
              a una temperatura intermedia, así que su densidad es intermedia
              y su caudal volumétrico **no** es la suma de los dos. Lo que se
              conserva es la masa.
          - texto: >-
              Sí, porque los dos están a la misma presión
            mensaje: |
              La presión igual hace que se puedan mezclar sin trabajo, pero no
              iguala las densidades: en la ecuación de estado también está la
              temperatura, y son 70 grados de diferencia.

      - tipo: calcular
        titulo: El gasto de la corriente fría
        pregunta: |
          ¿Cuántos kilogramos por segundo trae la corriente de 20 °C?
        respuesta:
          tipo: magnitud
          valor: '118.9 kg/s'
          tolerancia: 0.02
          formato: un caudal másico, con su unidad
        distractores:
          - valor: '1.189 kg/s'
            mensaje: |
              Un factor cien: has metido la presión en bar donde la constante
              está en kJ. Con $R'$ en kJ/(kg·K), la presión va en kPa, y
              1 bar son 100 kPa.
          - valor: '95.9 kg/s'
            mensaje: |
              Has usado la temperatura de la corriente caliente. Cada corriente
              se convierte con **su** temperatura, y ese es justamente el
              motivo de que los volúmenes no se puedan sumar.
        pista: |
          De $P\dot V = \dot m R' T$, despeja el gasto con $T = 293{,}15$ K.
        desarrollo: |
          $$
          \dot m_1 = \frac{P\,\dot V_1}{R'\,T_1}
          = \frac{100\cdot 100}{0{,}287\cdot 293{,}15}
          = 118{,}9\ \frac{\text{kg}}{\text{s}}
          $$

          Y con la misma cuenta a 363,15 K, la corriente caliente trae
          $\dot m_2 = 48{,}0\ \text{kg/s}$: la mitad de volumen, pero solo un
          40 % de la masa.

      - tipo: calcular
        titulo: La temperatura de la mezcla
        pregunta: |
          Con $\dot m_1 = 118{,}9$ y $\dot m_2 = 48{,}0\ \text{kg/s}$, ¿a qué
          temperatura sale la corriente resultante?
        respuesta:
          tipo: magnitud
          valor: '40.1 C'
          tolerancia: 0.005
          formato: una temperatura, con su unidad
        distractores:
          - valor: '55 C'
            mensaje: |
              Esa es la media aritmética de 20 y 90, que sería la respuesta si
              las dos corrientes trajeran la misma masa. Traen 118,9 y 48,0
              kg/s, así que la fría manda más del doble y la mezcla sale mucho
              más cerca de ella.
          - valor: '43.3 C'
            mensaje: |
              Has ponderado con los caudales **volumétricos**, 100 y 50. La
              ponderación va con las masas, que es lo que se conserva.
        pista: |
          Balance de energía adiabático:
          $\dot m_1 h_1 + \dot m_2 h_2 = (\dot m_1 + \dot m_2)h_3$, y con
          $c_p$ constante la entalpía es proporcional a la temperatura.
        desarrollo: |
          El volumen de control es adiabático y no intercambia trabajo, así
          que la entalpía que entra es la que sale. Con $c_p$ constante y la
          misma sustancia, la ecuación se queda en las temperaturas:

          $$
          T_3 = \frac{\dot m_1 T_1 + \dot m_2 T_2}{\dot m_1 + \dot m_2}
          = \frac{118{,}9\cdot 293{,}15 + 48{,}0\cdot 363{,}15}{166{,}9}
          $$
          $$
          = 313{,}3\ \text{K} = 40{,}1\ \text{°C}
          $$

          Veinte grados por encima de la corriente fría y cincuenta por debajo
          de la caliente, que es lo que corresponde a una mezcla donde la fría
          pesa dos veces y media más.

      - tipo: calcular
        titulo: La entropía generada
        pregunta: |
          ¿Cuánta entropía se genera por segundo en la mezcla?
        respuesta:
          tipo: magnitud
          valor: '0.810 kW/K'
          tolerancia: 0.03
          formato: una entropía por unidad de tiempo, con su unidad
        distractores:
          - valor: '0 kW/K'
            mensaje: |
              Que el proceso sea adiabático anula el término del calor, no la
              generación. Mezclar dos corrientes a temperaturas distintas es
              irreversible por definición —nadie ha visto separarse solo el
              aire caliente del frío—, así que $S_G$ tiene que salir positiva.
          - valor: '15.05 kW/K'
            mensaje: |
              Has sumado los dos términos en valor absoluto. El de la corriente
              fría es positivo, porque se calienta, y el de la caliente es
              negativo, porque se enfría: se restan, y lo que queda es un
              número mucho menor que cualquiera de los dos.
        pista: |
          Adiabático, así que $\dot S_G = \sum \dot m_i (s_3 - s_i)$, y a
          presión constante $s_3 - s_i = c_p\ln(T_3/T_i)$.
        desarrollo: |
          El proceso es adiabático, así que el término del calor desaparece y
          toda la variación de entropía es generación. Las dos corrientes están
          a la misma presión que la mezcla, así que el término de presiones se
          va también:

          $$
          \dot S_G = \dot m_1 c_p \ln\!\frac{T_3}{T_1}
          + \dot m_2 c_p \ln\!\frac{T_3}{T_2}
          $$
          $$
          = 119{,}4\cdot\ln\!\frac{313{,}3}{293{,}15}
          + 48{,}2\cdot\ln\!\frac{313{,}3}{363{,}15}
          $$
          $$
          = 7{,}93 - 7{,}12 = 0{,}81\ \frac{\text{kW}}{\text{K}}
          $$

          Positiva, como tenía que ser. Y fíjate en el tamaño: los dos términos
          rondan los 7,9 y los 7,1, y lo que sobrevive es menos de una décima
          parte. Por eso en estos ejercicios no se puede redondear a mitad de
          camino: el resultado es la diferencia de dos números casi iguales.

      - tipo: justificar
        pregunta: Ordena la comprobación del resultado. Una pieza es falsa.
        piezas:
          - texto: >-
              La temperatura de la mezcla, 40,1 °C, cae entre las dos de
              partida y más cerca de la fría, que aporta dos veces y media más
              masa.
          - texto: >-
              La entropía generada sale positiva, que es lo que el segundo
              principio exige de un proceso adiabático real.
          - texto: >-
              Y sale de restar dos términos parecidos, así que conviene
              arrastrar decimales hasta el final.
          - texto: >-
              Si las dos corrientes estuvieran a la misma temperatura, la
              entropía generada seguiría siendo positiva, porque mezclar
              siempre es irreversible.
            trampa: true
            mensaje: |
              Mezclar dos corrientes **idénticas** —misma sustancia, misma
              presión, misma temperatura— no genera nada: los dos logaritmos
              valdrían $\ln 1 = 0$. La irreversibilidad de este proceso no
              está en mezclar: está en mezclar cosas **distintas**, y aquí lo
              distinto es la temperatura.
    resolucion: |
      **Los gastos, primero.** Los caudales volumétricos no se pueden sumar
      porque las densidades son distintas. Con la ecuación de estado, a 1 bar:

      $$
      \dot m_1 = \frac{100\cdot 100}{0{,}287\cdot 293{,}15} = 118{,}9
      \qquad
      \dot m_2 = \frac{100\cdot 50}{0{,}287\cdot 363{,}15} = 48{,}0\ \frac{\text{kg}}{\text{s}}
      $$

      **a) La temperatura.** El volumen de control es adiabático y sin trabajo,
      así que la entalpía se conserva, y con $c_p$ constante eso es una media
      ponderada por las masas:

      $$
      T_3 = \frac{118{,}9\cdot 293{,}15 + 48{,}0\cdot 363{,}15}{166{,}9}
      = 313{,}3\ \text{K} = 40{,}1\ \text{°C}
      $$

      **b) La entropía generada.** Sin calor que cruce la frontera, toda la
      variación es generación, y a presión constante solo queda el término de
      temperaturas:

      $$
      \dot S_G = 118{,}9\cdot 1{,}0045\ln\!\frac{313{,}3}{293{,}15}
      + 48{,}0\cdot 1{,}0045\ln\!\frac{313{,}3}{363{,}15}
      = 0{,}81\ \frac{\text{kW}}{\text{K}}
      $$

      **Las dos comprobaciones.** Este ejercicio no trae resultados
      publicados, así que hay que verificarlo por otro lado, y hay dos maneras
      independientes de hacerlo: la temperatura tiene que caer **entre** las
      dos de partida y del lado de la que trae más masa —40,1 está a 20 grados
      de la fría y a 50 de la caliente, con una relación de masas de 2,5, y
      $50/20 = 2{,}5$—, y la entropía generada tiene que salir **positiva**,
      porque el proceso es adiabático y evidentemente irreversible. Las dos
      cuadran.
