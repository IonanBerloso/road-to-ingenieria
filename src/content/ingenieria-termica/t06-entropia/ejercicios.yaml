ejercicios:
  - id: ejter-dos-terminos-que-tiran-en-sentidos-contrarios
    titulo: Dos términos que tiran en sentidos contrarios
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería, sobre la variación de
      entropía de un gas ideal del Tema 6 de la asignatura. No es de examen ni
      de la colección.
    nivel: ejemplo
    enunciado: |
      Se comprime aire desde $300\ \text{K}$ y $1\ \text{bar}$ hasta
      $500\ \text{K}$ y $4\ \text{bar}$.

      a) ¿Cuánto vale la variación de entropía específica?

      b) ¿Cuánto aporta cada uno de los dos términos, y qué significa que
      tengan signos distintos?

      Datos del aire: $c_p = 1{,}0045$, $R' = 0{,}287\ \text{kJ/(kg·K)}$.
    pide: La variación de entropía y el reparto entre sus dos términos.
    pasos:
      - tipo: reconocer
        pregunta: |
          El aire se calienta **y** se comprime. ¿Qué le hace cada cosa a su
          entropía?
        opciones:
          - texto: >-
              Calentarse la sube y comprimirse la baja, así que los dos
              términos tienen signos contrarios y hay que ver cuál gana
            correcta: true
            mensaje: |
              Exacto. Calentar desordena y comprimir ordena, y la fórmula lo
              dice con dos logaritmos de signo opuesto. Ninguno de los dos
              decide solo: hay que sumarlos.
          - texto: >-
              Las dos la suben, porque a más energía más entropía
            mensaje: |
              La entropía no es energía. Comprimir un gas mete energía y **baja**
              su entropía: las moléculas quedan confinadas en menos volumen,
              que es un estado más ordenado.
          - texto: >-
              Depende del proceso que siga entre los dos estados
            mensaje: |
              La entropía es función de estado, así que su variación depende
              solo de los extremos. Esa es justamente la razón de que se pueda
              calcular con esta fórmula sin saber por dónde ha ido el gas.

      - tipo: calcular
        titulo: El término de la temperatura
        pregunta: |
          ¿Cuánto aporta $c_p\ln(T_2/T_1)$?
        respuesta:
          tipo: magnitud
          valor: '0.5131 kJ/(kg K)'
          tolerancia: 0.02
          formato: un calor específico, con su unidad
        distractores:
          - valor: '0.3666 kJ/(kg K)'
            mensaje: |
              Has usado $c_v$. En la forma de la fórmula que lleva el cociente
              de **presiones**, el calor específico que acompaña es $c_p$; la
              que lleva volúmenes va con $c_v$. Las dos formas están
              emparejadas y no se mezclan.
          - valor: '-0.5131 kJ/(kg K)'
            mensaje: |
              El signo. El aire se **calienta** de 300 a 500 K, así que el
              logaritmo del cociente es positivo y este término sube la
              entropía.
        pista: |
          $c_p\ln(500/300)$, con las temperaturas ya en kelvin.
        desarrollo: |
          $$
          c_p\ln\frac{T_2}{T_1} = 1{,}0045\cdot\ln\frac{500}{300}
          = 1{,}0045\cdot 0{,}5108 = 0{,}5131
          $$

      - tipo: calcular
        titulo: El término de la presión
        pregunta: |
          ¿Y cuánto aporta $-R'\ln(P_2/P_1)$?
        respuesta:
          tipo: magnitud
          valor: '-0.3979 kJ/(kg K)'
          tolerancia: 0.02
          formato: un calor específico, con su unidad
        distractores:
          - valor: '0.3979 kJ/(kg K)'
            mensaje: |
              Te has dejado el signo menos de la fórmula. La presión sube, así
              que su logaritmo es positivo, y el término entra restando: la
              compresión **baja** la entropía.
          - valor: '-1.3932 kJ/(kg K)'
            mensaje: |
              Has usado $c_p$ en vez de $R'$. El término de la presión va con
              la constante del gas, no con el calor específico.
        pista: |
          $-0{,}287\cdot\ln 4$.
        desarrollo: |
          $$
          -R'\ln\frac{P_2}{P_1} = -0{,}287\cdot\ln 4
          = -0{,}287\cdot 1{,}3863 = -0{,}3979
          $$

      - tipo: calcular
        titulo: La variación total
        pregunta: |
          ¿Cuánto vale $\Delta s$?
        respuesta:
          tipo: magnitud
          valor: '0.1153 kJ/(kg K)'
          tolerancia: 0.02
          formato: un calor específico, con su unidad
        distractores:
          - valor: '0.9110 kJ/(kg K)'
            mensaje: |
              Has sumado los dos términos en valor absoluto. El de la presión
              es negativo: se resta, y por eso el total sale mucho menor que
              cualquiera de los dos.
          - valor: '-0.0313 kJ/(kg K)'
            mensaje: |
              Has usado $c_v$ en el primer término y el cociente de presiones
              en el segundo, mezclando las dos formas de la fórmula. Fíjate en
              que hasta el **signo** del resultado cambia: aquí la mezcla no
              es un error pequeño.
        pista: |
          Suma los dos con su signo.
        desarrollo: |
          $$
          \Delta s = 0{,}5131 - 0{,}3979 = 0{,}1153
          \ \frac{\text{kJ}}{\text{kg}\cdot\text{K}}
          $$

          Una décima, de dos términos que valen medio y cuatro décimas. **El
          resultado es la diferencia de dos números parecidos**, y esa es la
          razón de que en estos cálculos no se pueda redondear a mitad de
          camino: un error del 5 % en cualquiera de los dos se convierte en un
          20 % del total.

      - tipo: justificar
        pregunta: Ordena la lectura física del resultado. Una pieza es falsa.
        piezas:
          - texto: >-
              Calentar de 300 a 500 K sube la entropía en 0,5131 kJ/(kg·K):
              más temperatura es más desorden.
          - texto: >-
              Comprimir de 1 a 4 bar la baja en 0,3979: menos volumen
              disponible es más orden.
          - texto: >-
              Gana el calentamiento, así que la entropía del aire sube, pero
              solo 0,1153: las dos cosas casi se compensan.
          - texto: >-
              Y como la entropía sube, el proceso es necesariamente
              irreversible.
            trampa: true
            mensaje: |
              Que la entropía de un sistema suba no dice nada sobre la
              reversibilidad: puede subir sencillamente porque le han metido
              calor. Lo que mide la irreversibilidad es la entropía
              **generada**, que es esta variación menos la que ha entrado con
              el calor, y para calcularla haría falta saber cómo se ha hecho el
              proceso.
    resolucion: |
      **a) La variación de entropía.**

      $$
      \Delta s = c_p\ln\frac{T_2}{T_1} - R'\ln\frac{P_2}{P_1}
      = 1{,}0045\ln\frac{500}{300} - 0{,}287\ln 4
      $$
      $$
      = 0{,}5131 - 0{,}3979 = 0{,}1153\ \frac{\text{kJ}}{\text{kg}\cdot\text{K}}
      $$

      **b) El reparto.** Calentar sube la entropía —0,5131— y comprimir la
      baja —0,3979—. Gana el calentamiento, pero por poco: el total no llega
      a un tercio del menor de los dos sumandos.

      **Lo que hay que llevarse.** Dos cosas. La primera es física: la entropía
      no va con la energía, va con el desorden, y comprimir ordena aunque
      cueste trabajo. La segunda es de método: cuando un resultado es la
      diferencia de dos números parecidos, arrastrar decimales deja de ser una
      manía y pasa a ser el ejercicio.
  - id: ejter-la-mezcla-adiabatica-de-dos-corrientes
    titulo: Dos corrientes de aire que se mezclan
    fuente: >-
      Ejercicio 5.8 de la colección de problemas de los temas 5 y 6 ·
      Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      material no publica sus resultados, así que el desarrollo es nuestro y
      está comprobado por dos vías independientes: la temperatura tiene que
      caer entre las dos de partida y ponderada por las masas, y la entropía
      generada tiene que salir positiva.
    nivel: practica
    enunciado: |
      Se mezclan adiabáticamente, a la presión de $1\ \text{bar}$,
      $100\ \text{m}^{3}/\text{s}$ de aire a $20\ \text{°C}$ con
      $50\ \text{m}^{3}/\text{s}$ de aire a $90\ \text{°C}$.

      Datos del aire: $R' = 0{,}287$, $c_p = 1{,}0045\ \text{kJ/(kg·K)}$.

      a) La temperatura de la corriente resultante.

      b) La entropía generada en el proceso.
    pide: La temperatura de la mezcla y la entropía generada por unidad de tiempo.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado da caudales **volumétricos**, y las dos corrientes
          están a temperaturas distintas. ¿Se pueden sumar directamente?
        opciones:
          - texto: >-
              No: lo que se conserva es la masa, y el mismo volumen de aire
              caliente pesa menos que el de aire frío
            correcta: true
            mensaje: |
              Exacto. A 1 bar, un metro cúbico de aire a 20 °C tiene 1,19 kg y
              a 90 °C solo 0,96. Hay que pasar los dos caudales a másicos con
              la ecuación de estado antes de hacer ningún balance.
          - texto: >-
              Sí: el volumen también se conserva en régimen estacionario
            mensaje: |
              El volumen no se conserva, y aquí se ve bien: la mezcla resulta
              a una temperatura intermedia, así que su densidad es intermedia
              y su caudal volumétrico **no** es la suma de los dos. Lo que se
              conserva es la masa.
          - texto: >-
              Sí, porque los dos están a la misma presión
            mensaje: |
              La presión igual hace que se puedan mezclar sin trabajo, pero no
              iguala las densidades: en la ecuación de estado también está la
              temperatura, y son 70 grados de diferencia.

      - tipo: calcular
        titulo: El gasto de la corriente fría
        pregunta: |
          ¿Cuántos kilogramos por segundo trae la corriente de 20 °C?
        respuesta:
          tipo: magnitud
          valor: '118.9 kg/s'
          tolerancia: 0.02
          formato: un caudal másico, con su unidad
        distractores:
          - valor: '1.189 kg/s'
            mensaje: |
              Un factor cien: has metido la presión en bar donde la constante
              está en kJ. Con $R'$ en kJ/(kg·K), la presión va en kPa, y
              1 bar son 100 kPa.
          - valor: '95.9 kg/s'
            mensaje: |
              Has usado la temperatura de la corriente caliente. Cada corriente
              se convierte con **su** temperatura, y ese es justamente el
              motivo de que los volúmenes no se puedan sumar.
        pista: |
          De $P\dot V = \dot m R' T$, despeja el gasto con $T = 293{,}15$ K.
        desarrollo: |
          $$
          \dot m_1 = \frac{P\,\dot V_1}{R'\,T_1}
          = \frac{100\cdot 100}{0{,}287\cdot 293{,}15}
          = 118{,}9\ \frac{\text{kg}}{\text{s}}
          $$

          Y con la misma cuenta a 363,15 K, la corriente caliente trae
          $\dot m_2 = 48{,}0\ \text{kg/s}$: la mitad de volumen, pero solo un
          40 % de la masa.

      - tipo: calcular
        titulo: La temperatura de la mezcla
        pregunta: |
          Con $\dot m_1 = 118{,}9$ y $\dot m_2 = 48{,}0\ \text{kg/s}$, ¿a qué
          temperatura sale la corriente resultante?
        respuesta:
          tipo: magnitud
          valor: '40.1 C'
          tolerancia: 0.005
          formato: una temperatura, con su unidad
        distractores:
          - valor: '55 C'
            mensaje: |
              Esa es la media aritmética de 20 y 90, que sería la respuesta si
              las dos corrientes trajeran la misma masa. Traen 118,9 y 48,0
              kg/s, así que la fría manda más del doble y la mezcla sale mucho
              más cerca de ella.
          - valor: '43.3 C'
            mensaje: |
              Has ponderado con los caudales **volumétricos**, 100 y 50. La
              ponderación va con las masas, que es lo que se conserva.
        pista: |
          Balance de energía adiabático:
          $\dot m_1 h_1 + \dot m_2 h_2 = (\dot m_1 + \dot m_2)h_3$, y con
          $c_p$ constante la entalpía es proporcional a la temperatura.
        desarrollo: |
          El volumen de control es adiabático y no intercambia trabajo, así
          que la entalpía que entra es la que sale. Con $c_p$ constante y la
          misma sustancia, la ecuación se queda en las temperaturas:

          $$
          T_3 = \frac{\dot m_1 T_1 + \dot m_2 T_2}{\dot m_1 + \dot m_2}
          = \frac{118{,}9\cdot 293{,}15 + 48{,}0\cdot 363{,}15}{166{,}9}
          $$
          $$
          = 313{,}3\ \text{K} = 40{,}1\ \text{°C}
          $$

          Veinte grados por encima de la corriente fría y cincuenta por debajo
          de la caliente, que es lo que corresponde a una mezcla donde la fría
          pesa dos veces y media más.

      - tipo: calcular
        titulo: La entropía generada
        pregunta: |
          ¿Cuánta entropía se genera por segundo en la mezcla?
        respuesta:
          tipo: magnitud
          valor: '0.810 kW/K'
          tolerancia: 0.03
          formato: una entropía por unidad de tiempo, con su unidad
        distractores:
          - valor: '0 kW/K'
            mensaje: |
              Que el proceso sea adiabático anula el término del calor, no la
              generación. Mezclar dos corrientes a temperaturas distintas es
              irreversible por definición —nadie ha visto separarse solo el
              aire caliente del frío—, así que $S_G$ tiene que salir positiva.
          - valor: '15.05 kW/K'
            mensaje: |
              Has sumado los dos términos en valor absoluto. El de la corriente
              fría es positivo, porque se calienta, y el de la caliente es
              negativo, porque se enfría: se restan, y lo que queda es un
              número mucho menor que cualquiera de los dos.
        pista: |
          Adiabático, así que $\dot S_G = \sum \dot m_i (s_3 - s_i)$, y a
          presión constante $s_3 - s_i = c_p\ln(T_3/T_i)$.
        desarrollo: |
          El proceso es adiabático, así que el término del calor desaparece y
          toda la variación de entropía es generación. Las dos corrientes están
          a la misma presión que la mezcla, así que el término de presiones se
          va también:

          $$
          \dot S_G = \dot m_1 c_p \ln\!\frac{T_3}{T_1}
          + \dot m_2 c_p \ln\!\frac{T_3}{T_2}
          $$
          $$
          = 119{,}4\cdot\ln\!\frac{313{,}3}{293{,}15}
          + 48{,}2\cdot\ln\!\frac{313{,}3}{363{,}15}
          $$
          $$
          = 7{,}93 - 7{,}12 = 0{,}81\ \frac{\text{kW}}{\text{K}}
          $$

          Positiva, como tenía que ser. Y fíjate en el tamaño: los dos términos
          rondan los 7,9 y los 7,1, y lo que sobrevive es menos de una décima
          parte. Por eso en estos ejercicios no se puede redondear a mitad de
          camino: el resultado es la diferencia de dos números casi iguales.

      - tipo: justificar
        pregunta: Ordena la comprobación del resultado. Una pieza es falsa.
        piezas:
          - texto: >-
              La temperatura de la mezcla, 40,1 °C, cae entre las dos de
              partida y más cerca de la fría, que aporta dos veces y media más
              masa.
          - texto: >-
              La entropía generada sale positiva, que es lo que el segundo
              principio exige de un proceso adiabático real.
          - texto: >-
              Y sale de restar dos términos parecidos, así que conviene
              arrastrar decimales hasta el final.
          - texto: >-
              Si las dos corrientes estuvieran a la misma temperatura, la
              entropía generada seguiría siendo positiva, porque mezclar
              siempre es irreversible.
            trampa: true
            mensaje: |
              Mezclar dos corrientes **idénticas** —misma sustancia, misma
              presión, misma temperatura— no genera nada: los dos logaritmos
              valdrían $\ln 1 = 0$. La irreversibilidad de este proceso no
              está en mezclar: está en mezclar cosas **distintas**, y aquí lo
              distinto es la temperatura.
    resolucion: |
      **Los gastos, primero.** Los caudales volumétricos no se pueden sumar
      porque las densidades son distintas. Con la ecuación de estado, a 1 bar:

      $$
      \dot m_1 = \frac{100\cdot 100}{0{,}287\cdot 293{,}15} = 118{,}9
      \qquad
      \dot m_2 = \frac{100\cdot 50}{0{,}287\cdot 363{,}15} = 48{,}0\ \frac{\text{kg}}{\text{s}}
      $$

      **a) La temperatura.** El volumen de control es adiabático y sin trabajo,
      así que la entalpía se conserva, y con $c_p$ constante eso es una media
      ponderada por las masas:

      $$
      T_3 = \frac{118{,}9\cdot 293{,}15 + 48{,}0\cdot 363{,}15}{166{,}9}
      = 313{,}3\ \text{K} = 40{,}1\ \text{°C}
      $$

      **b) La entropía generada.** Sin calor que cruce la frontera, toda la
      variación es generación, y a presión constante solo queda el término de
      temperaturas:

      $$
      \dot S_G = 118{,}9\cdot 1{,}0045\ln\!\frac{313{,}3}{293{,}15}
      + 48{,}0\cdot 1{,}0045\ln\!\frac{313{,}3}{363{,}15}
      = 0{,}81\ \frac{\text{kW}}{\text{K}}
      $$

      **Las dos comprobaciones.** Este ejercicio no trae resultados
      publicados, así que hay que verificarlo por otro lado, y hay dos maneras
      independientes de hacerlo: la temperatura tiene que caer **entre** las
      dos de partida y del lado de la que trae más masa —40,1 está a 20 grados
      de la fría y a 50 de la caliente, con una relación de masas de 2,5, y
      $50/20 = 2{,}5$—, y la entropía generada tiene que salir **positiva**,
      porque el proceso es adiabático y evidentemente irreversible. Las dos
      cuadran.

  - id: ejter-la-turbina-que-es-mala-y-hay-que-decirlo
    titulo: La turbina que es mala, y hay que decir por qué
    fuente: >-
      Ejercicio 2 de la convocatoria ordinaria de enero de 2022-2023 ·
      Ingeniería Térmica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen publica su resolución oficial manuscrita, y los nueve valores del
      desarrollo están rehechos y contrastados contra ella.
    nivel: examen
    enunciado: |
      En una turbina de vapor se desarrollan $200\ \text{kW}$ de potencia. El
      vapor sale de la turbina a $0{,}1\ \text{bar}$ y $80\ \text{°C}$. El
      gasto de vapor es de $0{,}5\ \text{kg/s}$ y entra a la turbina a
      $20\ \text{bar}$. La turbina es adiabática.

      a) ¿A qué temperatura entra el vapor en la turbina?

      b) ¿Cuál es el rendimiento interno de la turbina? Razónese si, desde el
      punto de vista de las irreversibilidades, la turbina es buena o mala.

      c) ¿Cuánta exergía se destruye en la turbina?

      d) ¿Cuál es el rendimiento exergético de la turbina?

      Tómese como temperatura de referencia $15\ \text{°C}$.

      Datos de las tablas de vapor sobrecalentado. **A 80 °C**, entre 0,06 y
      0,35 bar: $h = 2650{,}1$ y $2645{,}6\ \text{kJ/kg}$; $s = 8{,}5804$ y
      $7{,}7564\ \text{kJ/(kg·K)}$. **A 20 bar**, entre 280 y 320 °C:
      $h = 2976{,}4$ y $3069{,}5$; $s = 6{,}6828$ y $6{,}8452$. **Saturación a
      0,1 bar**: $h' = 191{,}83$, $h'' = 2584{,}7$; $s' = 0{,}6493$,
      $s'' = 8{,}1502$.
    pide: La temperatura de entrada, los dos rendimientos y la exergía destruida.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado da la presión de entrada pero no la temperatura. ¿Por
          dónde se empieza?
        opciones:
          - texto: >-
              Por el balance de energía: con la potencia y el gasto sale la
              entalpía de entrada, y con ella y la presión ya hay dos
              propiedades para entrar en la tabla
            correcta: true
            mensaje: |
              Exacto. El postulado de estado pide dos propiedades
              independientes, y aquí la segunda no viene dada: **se calcula**.
              Es el orden que hay que aprender: primero el balance, luego la
              tabla.
          - texto: >-
              Por la tabla de vapor sobrecalentado a 20 bar, buscando la
              temperatura que corresponda
            mensaje: |
              ¿Buscando con qué? Con una sola propiedad —la presión— la tabla
              tiene una fila entera de candidatos. Falta la segunda, y la
              segunda sale del balance de energía.
          - texto: >-
              Por el rendimiento isentrópico, suponiendo un valor típico
            mensaje: |
              El rendimiento es lo que el apartado b) pide **calcular**, así
              que suponerlo sería dar por sabido el resultado. Y además saldría
              44,8 %, que no es ningún valor típico: es el motivo de que el
              enunciado pregunte si la turbina es buena o mala.

      - tipo: calcular
        titulo: Dónde cae 0,1 bar entre las dos filas
        pregunta: |
          Para interpolar en la tabla de 80 °C hay que situar los 0,1 bar
          entre los 0,06 y los 0,35 tabulados. ¿Qué fracción del intervalo
          recorre?

          *(Se pregunta la fracción y no la entalpía porque las dos filas de la
          tabla se diferencian en 4,5 kJ/kg sobre 2.650: cualquier error de
          interpolación se pierde dentro del redondeo del resultado, y en
          cambio se ve entero aquí.)*
        respuesta:
          tipo: numero
          valor: '0.1379'
          tolerancia: 0.005
          formato: un número entre 0 y 1
        distractores:
          - valor: '0.5'
            mensaje: |
              Has interpolado a la mitad. La interpolación lineal pondera por
              la **distancia**, y 0,1 está mucho más cerca de 0,06 que de
              0,35: a un 13,8 % del recorrido, no a la mitad.
          - valor: '0.862'
            mensaje: |
              Has medido la distancia desde el otro extremo,
              $(0{,}35-0{,}1)/(0{,}35-0{,}06)$. Es la fracción complementaria:
              la que hay que usar si el valor de referencia es el de arriba,
              no el de abajo. Elige un extremo y mantenlo en el numerador y en
              el resultado.
        pista: |
          $(0{,}1-0{,}06)/(0{,}35-0{,}06)$.
        desarrollo: |
          $$
          f = \frac{0{,}1-0{,}06}{0{,}35-0{,}06} = 0{,}1379
          $$

          Y con ella, la entalpía de salida:

          $$
          h_2 = 2650{,}1 + 0{,}1379\,(2645{,}6 - 2650{,}1)
          = 2649{,}5\ \frac{\text{kJ}}{\text{kg}}
          $$

          Ojo a que la entalpía **baja** al subir la presión en esta zona de la
          tabla, así que el segundo paréntesis es negativo. Copiar el signo sin
          mirar es el error habitual de la interpolación. Y fíjate en lo poco
          que cambia el resultado —seis décimas sobre 2.650—: esta
          interpolación casi no importa, y la del apartado siguiente, con las
          entropías, sí.

      - tipo: calcular
        titulo: La temperatura de entrada
        pregunta: |
          Con el balance de energía y la tabla a 20 bar, ¿a qué temperatura
          entra el vapor?
        respuesta:
          tipo: magnitud
          valor: '311.4 C'
          tolerancia: 0.005
          formato: una temperatura, con su unidad
        distractores:
          - valor: '280 C'
            mensaje: |
              Ese es el extremo inferior de la tabla. La entalpía calculada,
              3049,5, cae entre las dos tabuladas —2976,4 y 3069,5— y bastante
              cerca de la de arriba: a un 78 % del recorrido.
          - valor: '300 C'
            mensaje: |
              Has interpolado a la mitad otra vez. Aquí la fracción es 0,785,
              no 0,5: la entalpía de entrada está mucho más cerca de la de
              320 °C que de la de 280.
        pista: |
          Primero $h_1 = \dot W/\dot m + h_2$, y luego se interpola esa
          entalpía entre las dos filas de 20 bar.
        desarrollo: |
          El balance de una turbina adiabática, despreciando cinética y
          potencial:

          $$
          h_1 = \frac{\dot W}{\dot m} + h_2 = \frac{200}{0{,}5} + 2649{,}5
          = 3049{,}5\ \frac{\text{kJ}}{\text{kg}}
          $$

          Y con esa entalpía y los 20 bar, el estado ya está fijado:

          $$
          \frac{3049{,}5 - 2976{,}4}{3069{,}5 - 2976{,}4} = 0{,}785
          \;\Longrightarrow\;
          \theta_1 = 280 + 0{,}785\cdot 40 = 311{,}4\ \text{°C}
          $$

      - tipo: calcular
        titulo: El rendimiento interno
        pregunta: |
          ¿Cuál es el rendimiento isentrópico de la turbina?
        respuesta:
          tipo: numero
          valor: '0.448'
          tolerancia: 0.005
          formato: un número entre 0 y 1
        distractores:
          - valor: '2.231'
            mensaje: |
              Has puesto el estado 2 real en el denominador y el ideal en el
              numerador. El rendimiento pone arriba lo que se obtiene —el
              salto **real**— y abajo lo que se podría haber obtenido, que es
              el salto isentrópico y siempre es mayor.
          - valor: '0.821'
            mensaje: |
              Ese es el título del estado isentrópico, $x_{2'} = 0{,}8214$, que
              es un paso intermedio. El rendimiento es un cociente de saltos de
              entalpía, no una fracción de vapor.
        pista: |
          $\eta_{ST} = (h_1-h_2)/(h_1-h_{2'})$, con $s_{2'} = s_1$. El estado
          2 prima cae dentro de la campana a 0,1 bar, así que hay que sacar su
          título primero.
        desarrollo: |
          La entropía de entrada, interpolando con la misma fracción de antes:

          $$
          s_1 = 6{,}6828 + 0{,}785\,(6{,}8452-6{,}6828) = 6{,}8103
          \ \frac{\text{kJ}}{\text{kg}\cdot\text{K}}
          $$

          El estado isentrópico tiene esa misma entropía a 0,1 bar, y cae
          dentro de la campana, así que tiene título:

          $$
          x_{2'} = \frac{6{,}8103 - 0{,}6493}{8{,}1502 - 0{,}6493} = 0{,}8214
          \qquad
          h_{2'} = 191{,}83 + 0{,}8214\,(2584{,}7-191{,}83) = 2157{,}25
          $$

          $$
          \eta_{ST} = \frac{3049{,}5 - 2649{,}5}{3049{,}5 - 2157{,}25}
          = \frac{400}{892{,}25} = 0{,}448
          $$

          **Un 44,8 %**, y ahí está contestada la segunda mitad del apartado:
          una turbina que funciona bien anda por encima del 80 %, así que
          desde el punto de vista de las irreversibilidades esta es **mala**.
          Está desperdiciando más de la mitad del salto que tenía disponible.

      - tipo: calcular
        titulo: La exergía destruida
        pregunta: |
          Con $s_2 = 8{,}4667\ \text{kJ/(kg·K)}$, ¿cuánta exergía destruye la
          turbina?
        respuesta:
          tipo: magnitud
          valor: '238.5 kW'
          tolerancia: 0.02
          formato: una potencia, con su unidad
        distractores:
          - valor: '0.828 kW'
            mensaje: |
              Eso es la entropía generada, en kW/K. Guy-Stodola la convierte en
              exergía destruida multiplicando por la temperatura de referencia
              en kelvin, 288.
          - valor: '18.2 kW'
            mensaje: |
              Has multiplicado por 22, la temperatura de referencia en grados
              Celsius. La $T_0$ de Guy-Stodola es absoluta: 15 °C son 288 K.
        pista: |
          La turbina es adiabática, así que
          $\dot S_G = \dot m\,(s_2 - s_1)$, y luego $Ex_D = T_0\,\dot S_G$.
        desarrollo: |
          Adiabática, así que el término del calor desaparece del balance de
          entropía y todo lo que hay es generación:

          $$
          \dot S_G = 0{,}5\,(8{,}4667 - 6{,}8103) = 0{,}828\ \frac{\text{kW}}{\text{K}}
          $$

          $$
          \dot{Ex}_D = T_0\,\dot S_G = 288\cdot 0{,}828 = 238{,}5\ \text{kW}
          $$

          Compáralo con los 200 kW que la turbina produce: **destruye más
          exergía de la que entrega**. Eso es lo que significa un rendimiento
          interno del 45 % dicho en kilovatios.

      - tipo: calcular
        titulo: El rendimiento exergético
        pregunta: |
          ¿Cuál es el rendimiento exergético de la turbina?
        respuesta:
          tipo: numero
          valor: '0.456'
          tolerancia: 0.005
          formato: un número entre 0 y 1
        distractores:
          - valor: '0.448'
            mensaje: |
              Ese es el rendimiento **isentrópico**. Se parecen —44,8 y
              45,6 %— y no son lo mismo: uno compara con el proceso ideal
              entre las mismas presiones, y el otro con toda la exergía que la
              corriente traía. Aquí salen próximos, pero no tienen por qué.
          - valor: '2.193'
            mensaje: |
              Has invertido la fracción. Un rendimiento mayor que uno debería
              haberte parado: significaría que la turbina entrega más trabajo
              del que la corriente puede dar.
        pista: |
          $\eta_{ex} = \dot W / [\dot m\,(a_{f1} - a_{f2})]$, con
          $a_f = h - T_0 s$.
        desarrollo: |
          $$
          a_{f1} = 3049{,}5 - 288\cdot 6{,}8103 = 1088{,}1
          \qquad
          a_{f2} = 2649{,}5 - 288\cdot 8{,}4667 = 211{,}1\ \frac{\text{kJ}}{\text{kg}}
          $$

          $$
          \eta_{ex} = \frac{200}{0{,}5\,(1088{,}1 - 211{,}1)}
          = \frac{200}{438{,}5} = 0{,}456
          $$

      - tipo: justificar
        pregunta: Ordena la comprobación que cierra el ejercicio. Una pieza es falsa.
        piezas:
          - texto: >-
              La corriente de vapor entrega 438,5 kW de exergía al atravesar la
              turbina, que es $\dot m\,(a_{f1}-a_{f2})$.
          - texto: >-
              De esos, 200 kW salen como trabajo y 238,5 se destruyen: la suma
              da exactamente 438,5.
          - texto: >-
              Y el cociente entre lo que sale y lo que entraba, 200 entre
              438,5, es el rendimiento exergético: 45,6 %.
          - texto: >-
              Que la suma cuadre demuestra que la turbina es reversible,
              porque la exergía se conserva.
            trampa: true
            mensaje: |
              Demuestra lo contrario. La exergía **no** se conserva, y por eso
              el balance necesita el término de destrucción para cuadrar: si la
              turbina fuese reversible, ese término sería cero y los 438,5 kW
              saldrían enteros como trabajo. Que haga falta un sumando de
              238,5 es la medida de lo irreversible que es.
    resolucion: |
      **a) La temperatura de entrada.** No viene dada: se calcula. Primero la
      entalpía de salida, interpolando a 80 °C entre 0,06 y 0,35 bar:

      $$
      h_2 = 2650{,}1 + 0{,}1379\,(2645{,}6-2650{,}1) = 2649{,}5\ \frac{\text{kJ}}{\text{kg}}
      $$

      Y con el balance de la turbina adiabática, la de entrada:

      $$
      h_1 = \frac{200}{0{,}5} + 2649{,}5 = 3049{,}5
      \;\Longrightarrow\;
      \theta_1 = 280 + 0{,}785\cdot 40 = 311{,}4\ \text{°C}
      $$

      **b) El rendimiento interno, 44,8 %, y la turbina es mala.** Con
      $s_1 = 6{,}8103$ y $s_{2'} = s_1$ a 0,1 bar sale $x_{2'} = 0{,}8214$ y
      $h_{2'} = 2157{,}25$:

      $$
      \eta_{ST} = \frac{400}{892{,}25} = 44{,}8\ \%
      $$

      Una turbina que funciona correctamente pasa del 80 %, así que esta
      desperdicia más de la mitad del salto disponible. Eso es lo que el
      enunciado pide razonar, y la palabra que espera es «mala».

      **c) La exergía destruida.** Adiabática, así que toda la variación de
      entropía es generación:

      $$
      \dot S_G = 0{,}5\,(8{,}4667-6{,}8103) = 0{,}828\ \frac{\text{kW}}{\text{K}}
      \qquad
      \dot{Ex}_D = 288\cdot 0{,}828 = 238{,}5\ \text{kW}
      $$

      **d) El rendimiento exergético.**

      $$
      \eta_{ex} = \frac{\dot W}{\dot m\,(a_{f1}-a_{f2})} = \frac{200}{438{,}5}
      = 45{,}6\ \%
      $$

      **La comprobación que hay que hacer siempre en este tema.** Los 438,5 kW
      de exergía que entrega el vapor se reparten en dos: 200 de trabajo y
      238,5 destruidos. La suma cuadra al decimal, y son dos caminos que no
      comparten ecuación —uno sale de las entalpías y las entropías de los dos
      estados, el otro de Guy-Stodola—. Cuando los dos coinciden, el ejercicio
      está bien; cuando no, el error casi siempre está en una interpolación.
