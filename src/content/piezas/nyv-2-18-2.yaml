# La pieza 2 de NyV 2.18: un balancín. Dos casquillos taladrados de ejes
# paralelos, unidos por un alma que es tangente a los dos por arriba, y el
# casquillo alto, sostenido por la misma alma sobre una pletina de extremos
# redondos con un taladro en cada extremo.
#
# Ejes: x a la derecha, y hacia el fondo, z hacia arriba; mm. El origen: x
# en el canto izquierdo de la pletina, y en su punta de delante, z en su
# cara de abajo. Todo es simétrico respecto del plano y = 30,9. Medidas
# sobre la clave (p. 21) a 400 ppp, con la página a su tamaño: 1 mm de la
# pieza es 1 mm de la página impresa.
#
# El alma es un polígono con los puntos de tangencia calculados (no
# medidos): la tangente de arriba a los dos casquillos, de radio 8,6 y
# centros (−31,2, 13,2) y (13,2, 32,1), los toca en (−34,5683, 21,1129) y
# (9,8317, 40,0129); el canto de la derecha baja desde el punto de
# tangencia (21,6661, 33,6117) hasta la esquina de la pletina, (26,4, 7,1).
# Sus otros vértices caen dentro de los casquillos, donde no se ven.
codigo: NyV-2.18-2
fuente: Normalización y vistas (NyV), p. 19 (2.18), pieza 2 de «Dibujar las vistas necesarias para definir estas piezas»; su clave, en la p. 21 (2.19).
cotas: proporcionales
suma:
  - { nombre: pletina, caja: [0, 26.4, 13.2, 48.6, 0, 7.1] }
  - { nombre: extremo delantero de la pletina, cilindro: { eje: z, centro: [13.2, 13.2], r: 13.2, desde: 0, hasta: 7.1 } }
  - { nombre: extremo trasero de la pletina, cilindro: { eje: z, centro: [13.2, 48.6], r: 13.2, desde: 0, hasta: 7.1 } }
  - nombre: alma
    prisma:
      plano: xz
      poligono: [[-31.2, 13.2], [-34.5683, 21.1129], [9.8317, 40.0129], [13.2, 32.1], [21.6661, 33.6117], [26.4, 7.1], [0, 7.1], [0, 10.55], [-31.2, 10.55]]
      desde: 27.4
      hasta: 34.4
  - { nombre: casquillo alto, cilindro: { eje: y, centro: [13.2, 32.1], r: 8.6, desde: 16.8, hasta: 45 } }
  - { nombre: casquillo bajo, cilindro: { eje: y, centro: [-31.2, 13.2], r: 8.6, desde: 20.35, hasta: 41.45 } }
resta:
  - { nombre: taladro delantero de la pletina, cilindro: { eje: z, centro: [13.2, 13.2], r: 7, desde: -1, hasta: 8 } }
  - { nombre: taladro trasero de la pletina, cilindro: { eje: z, centro: [13.2, 48.6], r: 7, desde: -1, hasta: 8 } }
  - { nombre: taladro del casquillo alto, cilindro: { eje: y, centro: [13.2, 32.1], r: 4.45 } }
  - { nombre: taladro del casquillo bajo, cilindro: { eje: y, centro: [-31.2, 13.2], r: 4.45 } }
noSeCorta: []
simetria:
  - { plano: y, en: 30.9 }
ocultas: todas
revision:
  fecha: '2026-10-09'
  notas:
    - Medida sobre la clave de la p. 21 a 400 ppp. El alzado pone el casquillo alto 0,4 mm a la derecha del eje de la pletina y la planta lo pone encima; se escribe encima, con los taladros de la pletina en el mismo eje. La tangente de arriba no es exacta en el escaneo (se aparta 0,5 mm del casquillo bajo) y se escribe tangente.
    - 'Cotejada encima de la p. 21 con «node scripts/pieza-sobre-pdf.mjs nyv-2-18-2 --pdf Normalizacin_y_Vistas.pdf --pagina 21 --escala 2.8346 --alzado 272.5,567.38 --planta 271.08,778.5». En el primer cotejo los taladros de la pletina eran pasantes y mordían el casquillo alto: dos líneas en el alzado que la clave no tiene; ahora acaban en z = 8.'
    - Queda una diferencia con la clave, escrita en tests/vistas/claves.test.ts; en la planta, la clave dibuja seguidos por debajo del alma el canto de la pletina y el del casquillo bajo, que el alma tapa.
