# La pieza 4 de NyV 2.18: un bloque de perfil escalonado —un chaflán, una
# ranura y una rampa— que acaba en una pletina con un agujero rasgado y las
# dos esquinas redondeadas, y dos orejetas taladradas encima, en el extremo
# alto.
#
# Ejes: x a la derecha, y hacia el fondo, z hacia arriba; mm. El origen, en
# la esquina de abajo, delante y a la izquierda (el lado de las orejetas).
# El alzado es el de la clave: el perfil escalonado. La clave dibuja a su
# izquierda el perfil DERECHO, que el motor saca girando la pieza media
# vuelta (`lib/vistas/gira.ts`).
#
# Las medidas salen de la clave (p. 22) a 400 ppp, con la página a su
# tamaño: 1 mm de la pieza es 1 mm de la página impresa. El chaflán y la
# rampa salen paralelos en la clave (pendiente 1,256 y 1,25 en x por z), y
# así quedan: 8,42 en x por 6,7 en z, y 13 por 10,35.
codigo: NyV-2.18-4
fuente: Normalización y vistas (NyV), p. 19 (2.18), pieza 4 de «Dibujar las vistas necesarias para definir estas piezas»; su clave, en la p. 22 (2.20).
cotas: proporcionales
suma:
  - nombre: cuerpo
    prisma:
      plano: xz
      poligono: [[0, 0], [53.35, 0], [53.35, 9.15], [44.85, 9.15], [31.85, 19.5], [31.85, 15.9], [24.97, 15.9], [24.97, 25], [16.55, 31.7], [0, 31.7]]
      desde: 0
      hasta: 40.2
  - { nombre: pletina, caja: [53.35, 61.1, 7.75, 32.45, 0, 9.15] }
  - { nombre: redondeo delantero, cilindro: { eje: z, centro: [53.35, 7.75], r: 7.75, desde: 0, hasta: 9.15 } }
  - { nombre: redondeo trasero, cilindro: { eje: z, centro: [53.35, 32.45], r: 7.75, desde: 0, hasta: 9.15 } }
  - { nombre: orejeta delantera, caja: [0, 8, 5.45, 14.69, 31.7, 43.7] }
  - { nombre: cabeza delantera, cilindro: { eje: x, centro: [10.07, 43.7], r: 4.62, desde: 0, hasta: 8 } }
  - { nombre: orejeta trasera, caja: [0, 8, 25.51, 34.75, 31.7, 43.7] }
  - { nombre: cabeza trasera, cilindro: { eje: x, centro: [30.13, 43.7], r: 4.62, desde: 0, hasta: 8 } }
resta:
  - { nombre: agujero rasgado, caja: [50.03, 56.15, 8.43, 31.77, -1, 10] }
  - { nombre: extremo delantero del rasgado, cilindro: { eje: z, centro: [53.09, 8.43], r: 3.06 } }
  - { nombre: extremo trasero del rasgado, cilindro: { eje: z, centro: [53.09, 31.77], r: 3.06 } }
  - { nombre: taladro delantero, cilindro: { eje: x, centro: [10.07, 43.7], r: 2.15 } }
  - { nombre: taladro trasero, cilindro: { eje: x, centro: [30.13, 43.7], r: 2.15 } }
noSeCorta: []
simetria:
  - { plano: y, en: 20.1 }
ocultas: todas
revision:
  fecha: '2026-10-09'
  notas:
    - Medida sobre la clave de la p. 22 a 400 ppp; la profundidad sale 39,9 mm en la planta y 40,5 mm en el perfil derecho, y se toma 40,2 con la pieza simétrica respecto de y = 20,1.
    - 'Cotejada encima de la p. 22 con «node scripts/pieza-sobre-pdf.mjs nyv-2-18-4 --pdf Normalizacin_y_Vistas.pdf --pagina 22 --escala 2.8346 --alzado 281.84,629.57 --planta 281.30,783.33 --derecho 118.61,629.91»: cada línea del motor tiene tinta a menos de 1 mm y la clave no tiene ninguna que el motor no saque. El rasgado queda 0,5 mm más corto que en el perfil derecho de la clave, por la profundidad promediada.'
