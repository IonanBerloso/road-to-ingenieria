# La pieza 3 de NyV 2.18: un soporte con una base de dos esquinas
# redondeadas y dos taladros, una torre que sube tangente a un buje
# taladrado y un nervio delante de la torre.
#
# Ejes: x a la derecha, y hacia el fondo, z hacia arriba; mm. El origen, en
# la esquina de abajo, delante y a la izquierda de la base. Las medidas
# salen de la clave (p. 22), medidas sobre el escaneo a 400 ppp con la
# página a su tamaño: 1 mm de la pieza es 1 mm de la página impresa.
#
# La torre es un trapecio cuyos lados suben desde las esquinas de arriba de
# la base hasta los puntos de tangencia con el buje, calculados (no
# medidos): desde (0, 8) a la circunferencia de centro (24,5, 39) y radio
# 9,6, el punto de tangencia es (15,7477, 42,9442). El nervio sube por
# dentro del buje hasta su eje, y su rampa va del borde de delante de la
# base a lo más bajo del frente del buje, (y, z) = (19,5, 29,4), que es
# donde la acaba el perfil de la clave (medida: 29,36).
codigo: NyV-2.18-3
fuente: Normalización y vistas (NyV), p. 19 (2.18), pieza 3 de «Dibujar las vistas necesarias para definir estas piezas»; su clave, en la p. 22 (2.20).
cotas: proporcionales
suma:
  - { nombre: base, caja: [0, 49, 7.6, 32.5, 0, 8] }
  - { nombre: base delante, caja: [7.6, 41.4, 0, 7.6, 0, 8] }
  - { nombre: redondeo izquierdo, cilindro: { eje: z, centro: [7.6, 7.6], r: 7.6, desde: 0, hasta: 8 } }
  - { nombre: redondeo derecho, cilindro: { eje: z, centro: [41.4, 7.6], r: 7.6, desde: 0, hasta: 8 } }
  - nombre: torre
    prisma:
      plano: xz
      poligono: [[0, 8], [49, 8], [33.2523, 42.9442], [15.7477, 42.9442]]
      desde: 26
      hasta: 32.5
  - { nombre: buje, cilindro: { eje: y, centro: [24.5, 39], r: 9.6, desde: 19.5, hasta: 32.5 } }
  - nombre: nervio
    prisma:
      plano: yz
      poligono: [[26, 8], [0, 8], [19.5, 29.4], [19.5, 39], [26, 39]]
      desde: 21.25
      hasta: 27.75
resta:
  - { nombre: taladro izquierdo, cilindro: { eje: z, centro: [8.1, 8.1], r: 4.1 } }
  - { nombre: taladro derecho, cilindro: { eje: z, centro: [40.9, 8.1], r: 4.1 } }
  - { nombre: taladro del buje, cilindro: { eje: y, centro: [24.5, 39], r: 5.5 } }
noSeCorta: [nervio]
simetria:
  - { plano: x, en: 24.5 }
ocultas: todas
revision:
  fecha: '2026-10-09'
  notas:
    - Medida sobre la clave de la p. 22 a 400 ppp, con histogramas de filas y columnas y circunferencias ajustadas; donde dos vistas dan dos medidas (la profundidad, 32,4 y 32,7 mm) se toma la media, y la pieza se hace simétrica respecto de x = 24,5.
    - 'Cotejada encima de la p. 22 con «node scripts/pieza-sobre-pdf.mjs nyv-2-18-3 --pdf Normalizacin_y_Vistas.pdf --pagina 22 --escala 2.8346 --alzado 165.6,276.75 --planta 165.6,412.2 --perfil 457.0,276.17»: cada línea del motor tiene tinta a menos de 1 mm (a menos de 0,15 mm casi todas) y la clave no tiene ninguna que el motor no saque.'
    - La primera rampa del nervio acababa en z = 29,97, donde sus caras cortan el buje; el perfil de la clave la acaba en 29,36, lo más bajo del buje, y se bajó a 29,4. Queda una diferencia con la clave, escrita en tests/vistas/claves.test.ts, la circunferencia del buje en el alzado.
