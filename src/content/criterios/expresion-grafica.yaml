# Los criterios de corrección de Expresión Gráfica como datos (fase K,
# unidad k-crit, 1 de octubre de 2026).
#
# Transcritos de la única página de «Criterios para la corrección de
# ejercicios y exámenes», que es toda imagen: se leyó renderizada a 300 ppp,
# por tiras, y se cotejó palabra por palabra. La página no lleva título,
# fecha ni nombres; el título es el del fichero que reparte la asignatura.
#
# Cómo se lee cada campo:
#   - `texto` es la línea impresa, entera y tal cual: con sus signos «-»
#     (la hoja imprime un guion corto, no el signo menos), con «p.e.», «ésta»
#     y «por revolución», y sin el punto final donde la hoja no lo pone.
#     La hoja pone en cursiva la primera «M» y «mm»; aquí van sin marca,
#     porque el texto se pinta tal cual y un asterisco se publicaría (§17).
#     El diámetro se escribe «Ø», el carácter que usa el resto del sitio.
#   - `precio`, `por`, `tope` y `topeEn` repiten en datos lo que dice el
#     texto, para que una página pueda contar. `por` solo cuando la hoja lo
#     imprime; donde no lo imprime, no se pone.
#   - `donde` es el tema del sitio que explica el criterio. El apartado
#     concreto lo pondrá la unidad que escriba ese tema.
#
# Por qué cada `donde`, y qué ejercicio futuro entrena cada criterio:
# mapa.md de la unidad.

fuente: «Criterios para la corrección de ejercicios y exámenes» · Expresión Gráfica, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). Una página sin título ni fecha, transcrita entera; el título es el del fichero que reparte la asignatura.

entradilla: Para aprobar un ejercicio, el alumnado debe cumplir unos mínimos. Debe desarrollar estrategias para la resolución de problemas gráficos y demostrar la capacidad de utilizar e interpretar la comunicación gráfica en la ingeniería industrial.

# Decisión: las cuatro frases que encabezan y cierran las listas también van,
# literales. No están en los campos del §3.1 del plan, pero son texto
# impreso, y «Si se cumplen estos mínimos, se corregirá el ejercicio» es la
# regla misma de los mínimos: una página que la parafrasee la estaría
# escribiendo otra vez (LEEME, «Lo que añado al esquema»).
rotulos:
  minimos: 'Mínimos para comenzar a corregir el ejercicio:'
  siSeCumplen: Si se cumplen estos mínimos, se corregirá el ejercicio.
  muyGraves: 'Además, se considerarán errores muy graves y se penalizarán con -2 puntos los siguientes aspectos:'
  tipicos: 'Errores típicos que serán severamente corregidos:'

minimos:
  - id: una-vista-bien-colocada
    bloque: vistas
    texto: Dibujar y colocar correctamente al menos una vista.
    donde: t08-vistas-y-perspectivas

  # Decisión: t07, que enseña los tipos de línea y su uso (LIBRO, tema II,
  # 2.1, grupos de líneas, que k-t07 usa). El eje es una línea de trazo y
  # punto; t08 lo dibujará en sus vistas, pero no es donde se explica.
  - id: eje-de-simetria-y-de-agujero
    bloque: vistas
    texto: Identificar al menos un eje de simetría y un eje de agujero (si lo tiene).
    donde: t07-normalizacion

  - id: una-rosca-bien-dibujada
    bloque: vistas
    texto: Dibujar bien, al menos, una rosca (3/4 en la vista frontal, diferenciar el tipo de línea, en caso de tratarse de un corte que esté bien representada).
    donde: t11-sistemas-de-union

  - id: vistas-necesarias
    bloque: vistas
    texto: Indicar las vistas necesarias, no menos (la geometría debe quedar bien definida).
    donde: t08-vistas-y-perspectivas

  # Decisión: t11. La acotación de roscas la explican LIBRO, tema V, 5.10
  # (pág. 154), y Tema_6._Uniones.pdf, 6.4 (págs. 8-9), los dos en el
  # material de uniones; k-t11 enlaza este mínimo desde su prosa. k-t10 lo
  # repite como ErrorTipico.
  - id: rosca-con-m
    bloque: acotacion
    texto: Al acotar una rosca, utilizar el símbolo M y no el símbolo de diámetro Ø (puede que el valor de cota no sea válido, pero al menos se utiliza el símbolo M).
    donde: t11-sistemas-de-union

  - id: numero-de-cota
    bloque: acotacion
    texto: Colocar correctamente el número de cota en la mayoría de los casos (80% o más).
    donde: t10-acotacion

  # La hoja no pone punto final en esta línea, y aquí tampoco.
  - id: simbolos-de-diametro-y-radio
    bloque: acotacion
    texto: Indicar los símbolos de diámetro y radio en la mayoría de los casos (80% o más)
    donde: t10-acotacion

  - id: despiece-en-mm
    bloque: acotacion
    texto: En los planos de despiece acotar en mm, NO utilizar otras unidades.
    donde: t10-acotacion

  - id: una-tolerancia-dimensional
    bloque: tolerancias
    texto: Colocar correctamente y con sentido mecánico una de las tolerancias dimensionales requeridas.
    donde: t12-acabados-y-tolerancias

  - id: un-acabado-superficial
    bloque: tolerancias
    texto: Indicar correctamente y con sentido mecánico alguno de los acabados superficiales requeridos.
    donde: t12-acabados-y-tolerancias

muyGraves:
  - id: escala-en-el-cajetin
    texto: No indicar la escala en el cajetín.
    precio: -2
    donde: t07-normalizacion

  - id: acotar-rayas-discontinuas
    texto: Acotar rayas discontinuas.
    precio: -2
    donde: t10-acotacion

  # Decisión: t12. Tema_7._Tolerancias_dimensionales.pdf, pág. 14, define
  # el ajuste como «Montaje entre un eje y un agujero con la misma cota
  # nominal», y su pág. 18 usa D10 como tolerancia de agujero (D10/h9,
  # «Mayúscula → Agujero»). t11 lo repite al hablar de designaciones: M10
  # con M12 no casa. «D10» no se interpreta en el texto: la hoja no lo
  # explica.
  - id: montaje-imposible
    texto: Definir un montaje mecánico imposible (p.e. agujero M10 y eje M12 o un agujero D10 y dentro un eje M10).
    precio: -2
    donde: t12-acabados-y-tolerancias

  - id: eje-cortado-a-lo-largo
    texto: Cortar y/o rayar un eje longitudinalmente.
    precio: -2
    donde: t09-cortes-y-secciones

  # Este y el siguiente se solapan: «dibujar sin tener en cuenta la escala»
  # está en los dos, y solo el segundo dice «por pieza». No se funden: la
  # hoja los imprime como dos líneas (LEEME, «El solapamiento de la escala»).
  - id: acotar-o-dibujar-sin-escala
    texto: Acotar y/o dibujar sin tener en cuenta la escala.
    precio: -2
    donde: t07-normalizacion

  - id: dibujar-sin-escala-por-pieza
    texto: Dibujar sin tener en cuenta la escala (-2 por pieza).
    precio: -2
    por: pieza
    donde: t07-normalizacion

tipicos:
  # Decisión: t10. Acotacin.pdf define las cotas funcionales y las no
  # funcionales en su pág. 4 («1ª manera de clasificar las cotas (por su
  # importancia)») y dice cómo se colocan en su pág. 7. LIBRO lo retoma en
  # el tema VII (pág. 227).
  - id: faltan-cotas-funcionales
    texto: 'Faltan cotas funcionales: -0,5 por cada una (máximo -1,5 por pieza).'
    precio: -0.5
    por: cada-una
    tope: -1.5
    topeEn: pieza
    donde: t10-acotacion

  - id: faltan-cotas-no-funcionales
    texto: 'Faltan cotas no funcionales: -0,25 por cada una (máximo -1 por pieza).'
    precio: -0.25
    por: cada-una
    tope: -1
    topeEn: pieza
    donde: t10-acotacion

  # Decisión: `por: cada`. La hoja imprime «por cada» sin sustantivo. No es
  # «por cada caso» ni «por cada una», y ponerle cualquiera de los dos sería
  # escribir una palabra que la hoja no trae; dejarlo sin `por` diría que se
  # cobra una vez, y entonces el tope de -2,5 no tendría sentido. El esquema
  # del §3.1 no tiene ese valor: lo añado (LEEME).
  - id: ejes-en-agujeros-y-cilindros
    texto: 'No indicar ejes en agujeros/cilindros: -0,5 por cada (máximo -2,5 en todo el plano).'
    precio: -0.5
    por: cada
    tope: -2.5
    topeEn: plano
    donde: t07-normalizacion

  - id: rayado-en-agujero-roscado
    texto: 'Rayadura mal indicada en un agujero roscado: -0,5 por cada caso.'
    precio: -0.5
    por: caso
    donde: t11-sistemas-de-union

  - id: longitud-de-rosca
    texto: 'No acotar la longitud/profundidad de la rosca: -0,5 por cada caso.'
    precio: -0.5
    por: caso
    donde: t11-sistemas-de-union

  - id: escala-general-mal-identificada
    texto: 'Identificar incorrectamente la escala general/principal en el cajetín: -1.'
    precio: -1
    donde: t07-normalizacion

  # El precio compuesto: medio punto si falta en la pieza y medio si falta
  # en el cajetín, con un tope de -2 «aunque se produzca en más piezas».
  # Supuesto, sin confirmar: la hoja no dice si el medio punto del cajetín
  # se repite por pieza o se cobra una vez. El plan (§3.3) lo lee una vez, y
  # entonces dos piezas son -1,5; si se repite, son -2 (LEEME, «El precio
  # compuesto: lo que la hoja no dice»). Los datos no lo deciden.
  # Decisión: `topeEn: total`. La hoja no dice «por pieza» ni «en todo el
  # plano»: el tope es sobre la suma, y eso es `total`. Lo mismo en el de
  # las marcas, «hasta -2».
  # Decisión: t07. LIBRO, tema I, 1.10, «Inscripción» (pág. 30), dice dónde
  # va cada escala. Ojo, que el libro y la hoja no dicen lo mismo: el libro
  # pone en el cajetín solo la escala principal y las demás junto a la marca
  # de la pieza; la hoja quita medio punto si la de la pieza falta en el
  # cajetín (LEEME y mapa.md, para k-t07).
  - id: escala-de-una-pieza
    texto: 'No indicar la escala concreta de una pieza, si ésta es diferente de la escala general del plano: [si falta en la pieza -0,5] + [si falta en el cajetín -0,5], como máximo -2 aunque se produzca en más piezas.'
    precio:
      - precio: -0.5
        donde: pieza
      - precio: -0.5
        donde: cajetin
    tope: -2
    topeEn: total
    donde: t07-normalizacion

  - id: marcas-de-las-piezas
    texto: 'No indicar las marcas en un plano de despiece o en un plano de conjunto (en los casos que se requiera): -0,5 por cada caso, hasta -2.'
    precio: -0.5
    por: caso
    tope: -2
    topeEn: total
    donde: t13-conjunto-y-despiece

  - id: vista-extra-en-pieza-de-revolucion
    texto: 'En una pieza por revolución no normalizada, indicar otra vista además de la vista principal (quizás se necesiten detalles, cortes o secciones): -1 por cada vista principal extra.'
    precio: -1
    por: vista
    donde: t08-vistas-y-perspectivas
