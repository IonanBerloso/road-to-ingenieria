      <figcaption>

      El cilindro y su eje, sin el bastidor. Los cojinetes lo sujetan en A y en B.

      </figcaption>
      </figure>

      - **En A y en B**, las reacciones de los cojinetes perpendiculares al
        eje, $A_x$, $A_z$, $B_x$ y $B_z$, y a lo largo del eje, $A_y$.
      - **En G**, el peso, $Mg = 20 \cdot 9{,}81 = 196{,}2\ \text{N}$.

      **2. Incógnitas.** Las cinco componentes de las reacciones. Las que
      pide el enunciado son las verticales, $A_z$ y $B_z$, separadas en su
      parte estática y su parte dinámica.

      **3. Ecuaciones.** G está en el cruce de los dos ejes de giro y no se
      mueve: $\vec{a}_G = \vec{0}$. En unos ejes que acompañan al bastidor,
      $\vec{e}_1$, $\vec{e}_2$ y $\vec{e}_3$ según X, Y y Z, con
      $\vec{\Omega} = \omega_{z}\vec{e}_3$, la velocidad angular del
      cilindro es $\vec{\omega} = \omega_{y}\vec{e}_2 + \omega_{z}\vec{e}_3$.
      El cilindro es de revolución alrededor de $\vec{e}_2$: en esos ejes su
      tensor de inercia no cambia aunque el cilindro gire dentro de ellos, y
      el momento angular tiene componentes constantes. Su derivada es solo el
      término del giro de los ejes:

      $$
      \vec{H}_G = I_{Gy}\,\omega_{y}\,\vec{e}_2 + I_{Gz}\,\omega_{z}\,\vec{e}_3,
      \qquad
      \frac{d\vec{H}_G}{dt} = \omega_{z}\vec{e}_3\times\vec{H}_G = -I_{Gy}\,\omega_{y}\,\omega_{z}\,\vec{e}_1
      $$

      Con A en $-d\,\vec{e}_2$ y B en $+d\,\vec{e}_2$ respecto de G, y
      $d = 0{,}25\ \text{m}$, las fuerzas y los momentos respecto de G:

      $$
      A_x + B_x = 0,
      \qquad
      A_y = 0,
      \qquad
      A_z + B_z - Mg = 0
      $$

      $$
      d\,(B_z - A_z) = -I_{Gy}\,\omega_{y}\,\omega_{z},
      \qquad
      d\,(A_x - B_x) = 0
      $$

      **4. Resultados.** Las horizontales y la axial son nulas,
      $A_x = B_x = A_y = 0$, y las verticales:

      $$
      A_z = \frac{Mg}{2} + \frac{I_{Gy}\,\omega_{y}\,\omega_{z}}{2d},
      \qquad
      B_z = \frac{Mg}{2} - \frac{I_{Gy}\,\omega_{y}\,\omega_{z}}{2d}
      $$

      - **La estática**, en cada apoyo:
        $Mg/2 = 196{,}2/2 = 98{,}1\ \text{N}$.
      - **La dinámica**, con
        $I_{Gy}\,\omega_{y}\,\omega_{z} = 0{,}0625 \cdot 75 \cdot 25 = 117{,}19\ \text{N}\cdot\text{m}$:
        $117{,}19/(2 \cdot 0{,}25) = 234{,}4\ \text{N}$, hacia arriba en A y
        hacia abajo en B.
      - **Las totales:** $A_z = 98{,}1 + 234{,}4 = 332{,}5\ \text{N}$ y
        $B_z = 98{,}1 - 234{,}4 = -136{,}3\ \text{N}$.

      Las tres cifras coinciden con las que publica la colección. $B_z$ sale
      negativa: el cojinete de B tiene que tirar del eje hacia abajo.

      <figure class="figura-examen">
      <svg viewBox="52 96 326 146" role="img" width="489" height="219" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">El momento angular del cilindro, su derivada y las fuerzas dinámicas</title>
        <desc id="dsl-d">El eje del cilindro, de A a B, y por G el eje vertical, a trazos. En G, las dos partes del momento angular: la del giro propio, a lo largo del eje del cilindro, hacia B, y la del giro del bastidor, vertical. La derivada del momento angular, horizontal y perpendicular al eje del cilindro, hacia atrás. En A, la parte dinámica de la reacción, vertical hacia arriba; en B, la misma, hacia abajo.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M107 143 L323 187" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M215 225 V99" fill="none" stroke="var(--ink)" stroke-width="1" stroke-dasharray="4 3"/>
        <line x1="107" y1="187" x2="107" y2="147" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="101" y="183" font-size="10" text-anchor="end" fill="var(--d2-tinta)">234,4 N</text>
        <line x1="323" y1="183" x2="323" y2="143" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="329" y="153" font-size="10" text-anchor="start" fill="var(--d2-tinta)">234,4 N</text>
        <line x1="215" y1="165" x2="275.8" y2="177.4" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="271.8" y="193.4" font-size="10" text-anchor="middle" fill="var(--ink)" font-style="italic">I<tspan font-size="7.5" dy="2.5">Gy</tspan><tspan dy="-2.5"> ω<tspan font-size="7.5" dy="2.5">y</tspan><tspan dy="-2.5"></tspan></tspan></text>
        <line x1="215" y1="165" x2="215" y2="113" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="209" y="121" font-size="10" text-anchor="end" fill="var(--ink)" font-style="italic">I<tspan font-size="7.5" dy="2.5">Gz</tspan><tspan dy="-2.5"> ω<tspan font-size="7.5" dy="2.5">z</tspan><tspan dy="-2.5"></tspan></tspan></text>
        <line x1="215" y1="165" x2="259.9" y2="131.5" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="264.9" y="129.5" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">dH<tspan font-size="7.5" dy="2.5">G</tspan><tspan dy="-2.5">/dt</tspan></text>
        <circle cx="107" cy="143" r="2.4" fill="var(--ink)"/>
        <text x="101" y="137" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">A</text>
        <circle cx="323" cy="187" r="2.4" fill="var(--ink)"/>
        <text x="329" y="201" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">B</text>
        <circle cx="215" cy="165" r="2.4" fill="var(--ink)"/>
        <text x="209" y="179" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">G</text>
      </svg>
      <figcaption>

      El momento angular tiene una parte a lo largo del eje del cilindro y otra vertical. Al girar el bastidor solo cambia la primera, y su derivada, horizontal, la dan dos fuerzas verticales opuestas en A y en B.

      </figcaption>
      </figure>

      **5. Comprobación.** Por momentos respecto de A y de B, sin la ecuación
      de fuerzas verticales, y con ella después como prueba. Como
      $\vec{a}_G = \vec{0}$, el momento de las fuerzas es
      $d\vec{H}_G/dt$ respecto de cualquier punto. Según $\vec{e}_1$:

      $$
      \text{en B:}\ \ -2d\,A_z + d\,Mg = -I_{Gy}\,\omega_{y}\,\omega_{z},
      \qquad
      \text{en A:}\ \ 2d\,B_z - d\,Mg = -I_{Gy}\,\omega_{y}\,\omega_{z}
      $$

      $$
      0{,}5\,A_z = 0{,}25 \cdot 196{,}2 + 117{,}19 = 166{,}24,
      \qquad
      0{,}5\,B_z = 0{,}25 \cdot 196{,}2 - 117{,}19 = -68{,}14
      $$

      Así, $A_z = 332{,}48\ \text{N}$ y $B_z = -136{,}28\ \text{N}$, y su
      suma, $332{,}48 - 136{,}28 = 196{,}2\ \text{N}$, es el peso: la ecuación
      que no se ha usado se cumple.

      **Lo que dice el resultado.** La parte dinámica, 234,4 N, es 2,4 veces
      la estática de cada apoyo y 1,2 veces el peso entero del cilindro, y
      sale de dos giros perfectamente uniformes. Por eso a un rotor que
      además gira alrededor de otro eje no se le dimensionan los cojinetes
      con la estática: es el término $\vec{\Omega}\times\vec{H}_G$ el que los
      carga. Y $I_{Gz} = 0{,}1595$ no se usa en ningún sitio: el enunciado lo
      da, pero su componente de $\vec{H}_G$ es paralela a $\vec{\Omega}$ y
      desaparece en el producto vectorial.

  - id: ejma10-col105-la-velocidad-maxima-del-eje-ab
    titulo: La velocidad angular máxima para no pasarse de reacción dinámica
    fuente: >-
      Ejercicio 10.5 · Tema 10, «Dinámica del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo, y también se ha usado la
      resolución oficial del curso para comprobarlo. En la figura, los dos
      giros van en el sentido de la del curso.
    nivel: practica
    antes:
      idea: |
        La resultante de las fuerzas es la masa por la aceleración del centro
        de masas, y el momento respecto de él, la derivada del momento
        angular. En ejes principales, cada componente del momento angular es
        el momento de inercia de ese eje por la componente de la velocidad
        angular. Si esos ejes giran, la derivada tiene dos partes: la de las
        componentes y la del giro de los propios ejes.
      formula: |
        $$
        \sum\vec{F} = M\vec{a}_G,
        \qquad
        \sum\vec{M}_G = \frac{d\vec{H}_G}{dt},
        \qquad
        \frac{d\vec{H}_G}{dt} = \left(\frac{d\vec{H}_G}{dt}\right)_{\text{ejes}} + \vec{\Omega}\times\vec{H}_G
        $$

        Para un disco de masa m y radio r: $\tfrac12 mr^{2}$ respecto de su
        eje y $\tfrac14 mr^{2}$ respecto de un diámetro.
      reconocer: |
        Antes de calcular se mira cómo se mueve el disco: su centro y sus dos
        giros.
    enunciado: |
      Un disco de masa 0,285 kg gira con velocidad angular constante
      $\omega_{1} = 750\ \text{rpm}$. La velocidad angular del eje AB es
      constante $\omega_{2}$.

      Calcular la velocidad angular máxima $\omega_{2}$ para que las reacciones
      dinámicas en $A$ y $B$ sean inferiores a 1,1 N. El apoyo $B$ no soporta
      esfuerzo en la dirección $X$.

