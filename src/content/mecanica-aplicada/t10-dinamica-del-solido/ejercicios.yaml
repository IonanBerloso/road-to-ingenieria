      <figcaption>

      La barra sin el apoyo de O. La reacción del apoyo es una fuerza y un momento, el de doble punta, y el peso cae en el mismo O.

      </figcaption>
      </figure>

      - **En O**, la reacción del apoyo: una fuerza, $\vec{R}_O$, y un
        momento, $\vec{M}_O$, el que pide el apartado b).
      - **En O también**, el peso, Mg: O es el centro de la barra.

      El peso y $\vec{R}_O$ pasan por O y no tienen momento respecto de él:
      el teorema del momento cinético en O deja solo $\vec{M}_O$. Y como O no
      se mueve, la fuerza sale sin cuentas, $\vec{R}_O = -M\vec{g}$.

      **2. Incógnitas.** El momento angular $\vec{H}_O$ y el momento de las
      reacciones $\vec{M}_O$, en función de M, L, θ, ψ y sus derivadas.

      **3. Ecuaciones.** Se toman ejes unidos a la barra con el origen en O:
      $\vec{e}_3$ a lo largo de la barra, hacia A, $\vec{e}_1$ perpendicular
      al plano π y $\vec{e}_2$ en el plano, perpendicular a la barra. La
      barra gira con el plano, alrededor de la vertical, y dentro de él,
      según $\vec{e}_1$; la vertical forma θ con la barra y se reparte entre
      $\vec{e}_3$ y $\vec{e}_2$:

