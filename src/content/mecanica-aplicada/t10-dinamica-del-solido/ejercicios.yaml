    pide: El valor de la velocidad angular que mantiene la placa a 40 grados y el intervalo que la mantiene vertical.
    pasos:
      - tipo: reconocer
        pregunta: |
          Los ejes de la placa son sus ejes de simetría. ¿Cuánto valen sus
          momentos de inercia en el centro de gravedad?
        opciones:
          - texto: ma²/12 en los dos ejes del plano de la placa y ma²/6 en el perpendicular
            correcta: true
            mensaje: |
              Eso es. La diferencia entre ellos da el par de inercia,
              $(I_{Gx} - I_{Gy})\,\omega^{2}\operatorname{sen}\beta\cos\beta = -\tfrac{1}{12}ma^{2}\omega^{2}\operatorname{sen}\beta\cos\beta$,
              que ayuda a levantar la placa junto con la aceleración de $G$.
          - texto: ma²/6 en los dos del plano y ma²/12 en el perpendicular
            mensaje: |
              Están cambiados. El perpendicular al plano es siempre la suma de
              los otros dos, por el teorema de los ejes perpendiculares:
              $ma^{2}/12 + ma^{2}/12 = ma^{2}/6$.
          - texto: Los tres valen ma²/12, porque la placa es homogénea
            mensaje: |
              Con los tres iguales el tensor sería esférico y $\vec{H}$ iría
              siempre con $\vec{\omega}$. Pero no pueden serlo: el
              perpendicular al plano es la suma de los otros dos, por el
              teorema de los ejes perpendiculares.
          - texto: ma²/3 en los dos del plano, como una barra por su extremo
            mensaje: |
              $ma^{2}/3$ es respecto de un borde, no del centro de gravedad.
              Aquí los ejes pasan por $G$, y Steiner descuenta
              $m(a/2)^{2}$.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **la placa sola, sin el pasador,
          con todas las acciones que actúan sobre ella**. Sin escala.
        comprueba:
          - punto: |
              **En A y en B, las reacciones de las bisagras perpendiculares a
              la charnela: una en el plano de la placa y otra normal a ella.**
            porque: |
              Una bisagra sujeta la placa en las dos direcciones
              perpendiculares a su eje.
          - punto: |
              **A lo largo de la charnela, una sola componente, en una de las
              dos bisagras.**
            porque: |
              Con una basta para impedir que la placa se deslice a lo largo de
              la charnela.
          - punto: |
              **El peso, mg, vertical, en G, el centro de la placa.**
            porque: |
              La placa es homogénea y cuadrada.
          - punto: |
              **Ningún par en las bisagras alrededor de la charnela.**
            porque: |
              La placa está articulada: puede girar libremente alrededor de
              AB, y por eso el ángulo β no lo impone nadie.
