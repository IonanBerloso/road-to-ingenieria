            <text x="137" y="151" font-size="9" text-anchor="end" fill="var(--faint)">A</text>
            <text x="294" y="125" font-size="9" text-anchor="start" fill="var(--faint)">B</text>
          </svg>

      - tipo: calcular
        titulo: La velocidad angular que mantiene los 40 grados
        pregunta: |
          Con $a = 0{,}45\ \text{m}$ y $g = 9{,}81\ \text{m/s}^{2}$, ¿cuánto
          vale $\omega$ para que $\beta = 40^{\circ}$ se mantenga constante, en
          rad/s?
        respuesta:
          tipo: numero
          valor: '7.13'
          tolerancia: 0.03
          formato: un número, en rad/s
        distractores:
          - valor: '10.09'
            mensaje: |
              Has cambiado de sitio los momentos de inercia de la placa: con
              $I_{Gx}$ y $I_{Gy}$ intercambiados el coeficiente pasa de
              $\tfrac32$ a 3 dentro de la raíz.
          - valor: '14.27'
            mensaje: |
              Te has dejado la aceleración del centro de gravedad. $G$ no está
              en el eje de giro: describe una circunferencia de radio
              $\tfrac{a}{2}\cos\beta$, y su fuerza centrífuga da las tres
              cuartas partes de lo que levanta la placa.
          - valor: '5.72'
            mensaje: |
              Has puesto $\operatorname{sen}\beta = 1$, que es el caso
              $\beta = 90^{\circ}$ del segundo apartado. Con
              $\beta = 40^{\circ}$, $\operatorname{sen}\beta = 0{,}643$ y hace
              falta girar más deprisa.
        pista: |
          De las ecuaciones sale
          $\omega^{2} = \dfrac{3g}{2a\operatorname{sen}\beta}$. La nota de la
          colección precisa además que la placa no gira respecto del pasador,
          $\alpha_{1} = \omega_{2} = 0$, así que $\beta$ es constante de verdad.
        desarrollo: |
          $$
          \omega = \sqrt{\frac{3}{2\operatorname{sen}\beta}\cdot\frac{g}{a}}
          = 1{,}5276\sqrt{\frac{g}{a}} = 1{,}5276\cdot 4{,}669 = 7{,}13\ \text{rad/s}
          $$

      - tipo: calcular
        titulo: El límite para que la placa siga vertical
        pregunta: |
          ¿Por debajo de qué valor de $\omega$ se queda la placa vertical, en
          rad/s?
        respuesta:
          tipo: numero
          valor: '5.72'
          tolerancia: 0.03
          formato: un número, en rad/s
        distractores:
          - valor: '7.13'
            mensaje: |
              Ese es el del primer apartado, con
              $\operatorname{sen}40^{\circ}$. Para la posición vertical
              $\operatorname{sen}\beta = 1$, que es el mayor valor posible del
              seno y por tanto el que da el $\omega$ más pequeño.
          - valor: '4.67'
            mensaje: |
              Ese es $\sqrt{g/a}$ pelado. Falta el factor $\tfrac32$ de dentro
              de la raíz, que sale del reparto entre el par de inercia y la
              fuerza centrífuga.
          - valor: '0'
            mensaje: |
              La placa vertical no necesita que el pasador esté parado: aguanta
              vertical mientras el giro no sea capaz de levantarla, y eso da un
              intervalo, no un punto.
        pista: |
          La misma fórmula pide $\operatorname{sen}\beta = 3g/(2a\omega^{2})$, y
          un seno no puede pasar de 1.
        desarrollo: |
          $$
          \operatorname{sen}\beta = \frac{3g}{2a\omega^{2}} \le 1
          \;\Longrightarrow\;
          \omega < \sqrt{\frac{3g}{2a}} = 1{,}2247\sqrt{\frac{g}{a}} = 5{,}72\ \text{rad/s}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: 'La velocidad angular de la placa es $\vec{\omega}_p = -\omega\operatorname{sen}\beta\,\vec{e}_1 + \omega\cos\beta\,\vec{e}_2$, la vertical descompuesta en sus ejes principales.'
          - texto: 'Con β constante, las componentes de $\vec{H}_G$ no cambian, y $d\vec{H}_G/dt$ es solo $\vec{\Omega}\times\vec{H}_G = (I_{Gx}-I_{Gy})\,\omega^{2}\operatorname{sen}\beta\cos\beta\,\vec{e}_3$.'
          - texto: 'Tomando momentos en el punto fijo $O$ y proyectando sobre el eje de la charnela, las reacciones de $A$ y $B$ no aparecen y queda $\omega^{2} = 3g/(2a\operatorname{sen}\beta)$.'
          - texto: 'Cuanto más deprisa gire el pasador, más vertical se pone la placa, porque la fuerza centrífuga la aprieta contra el eje.'
            trampa: true
            mensaje: |
              Es justo al revés, y es lo que hace bonito el problema: la fuerza
              centrífuga tira de la placa hacia **fuera**, así que cuanto más
              deprisa gira, más se levanta y menor es $\beta$. La placa aguanta
              vertical solo mientras $\omega$ sea pequeña, por debajo de
              5,72 rad/s.
    resolucion: |
      **1. Sólidos libres.** Es un problema de dinámica de un sólido que gira
      con el pasador: el dibujo lleva la placa sola, sin el pasador, en la
      perspectiva del enunciado, con los ejes de la placa: x de O hacia C, y
      normal a ella y z a lo largo de la charnela, de B hacia A.

      <figure class="figura-examen">
