    pide: El valor máximo de la velocidad angular del eje AB para que la reacción dinámica no llegue a 1,1 N.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿De dónde salen las reacciones dinámicas que hay que limitar?
        opciones:
          - texto: Del par giroscópico ω2 × H_G, perpendicular a los dos ejes de giro
            correcta: true
            mensaje: |
              Eso es. $C$ no se mueve, así que no hay fuerza de inercia: la
              única exigencia dinámica es el par
              $\vec{\Omega}\times\vec{H}_G$, que vale
              $I_{Gz}\omega_{1}\omega_{2}$ y lo tienen que equilibrar $A$ y $B$
              con una pareja de fuerzas.
          - texto: De la fuerza centrífuga del disco al girar el eje
            mensaje: |
              El centro de gravedad del disco está sobre el propio eje AB, así
              que no describe ninguna circunferencia: $\vec{a}_G = \vec{0}$ y
              no hay fuerza centrífuga que repartir.
          - texto: Del peso del disco, que es lo único que cargan los apoyos
            mensaje: |
              El peso da las reacciones **estáticas**, las que hay con todo
              parado. Las dinámicas son las que aparecen por el movimiento, y
              aquí vienen de un par, no de una fuerza.
          - texto: De la aceleración angular del disco, que no es nula
            mensaje: |
              La aceleración angular existe, sí, pero lo que carga los apoyos
              se calcula con $d\vec{H}_G/dt$, y en un sólido de revolución con
              dos giros constantes ese término es el producto vectorial de
              Boure, no $\mathbf{I}\vec{\alpha}$.

      - tipo: calcular
        titulo: El momento de inercia del disco
        pregunta: |
          ¿Cuánto vale el momento de inercia del disco respecto de su eje de
          giro propio, en kg·m²?
        respuesta:
          tipo: numero
          valor: '0.00035625'
          tolerancia: 0.000005
          formato: un número, en kg·m2
        distractores:
          - valor: '0.000178125'
            mensaje: |
              Ese es el diametral, $\tfrac14 m r^{2}$. El eje de giro propio del
              disco es el perpendicular a su plano, y ahí vale
              $\tfrac12 m r^{2}$.
          - valor: '0.0007125'
            mensaje: |
              Ese es $m r^{2}$, el de un aro. El disco es macizo y su axial es
              la mitad.
          - valor: '356.25'
            mensaje: |
              Has metido el radio en milímetros. En el SI el radio son
              0,05 m, y al ir al cuadrado el factor es un millón.
        pista: |
          Disco macizo, eje perpendicular a su plano:
          $I_{Gz} = \tfrac12 m r^{2}$, con $r = 0{,}05\ \text{m}$.
        desarrollo: |
          $$
          I_{Gz} = \tfrac12 \cdot 0{,}285 \cdot 0{,}05^{2} = 3{,}5625\cdot 10^{-4}\ \text{kg}\cdot\text{m}^{2}
          $$

      - tipo: calcular
        titulo: La velocidad angular máxima del eje
        pregunta: |
          ¿Cuál es el mayor valor de $\omega_{2}$, en rad/s, con el que la
          reacción dinámica no llega a 1,1 N?
        respuesta:
          tipo: numero
          valor: '7.86'
          tolerancia: 0.02
          formato: un número, en rad/s
        distractores:
          - valor: '3.93'
            mensaje: |
              Te falta el factor 2 de la distancia entre apoyos. El par lo
              equilibra una pareja de fuerzas separadas $2d = 0{,}2\ \text{m}$,
              no $d$.
          - valor: '15.73'
            mensaje: |
              Has usado el momento de inercia diametral, $\tfrac14 m r^{2}$. El
              que entra en el par giroscópico es el del giro propio,
              $\tfrac12 m r^{2}$, que es el doble.
          - valor: '0.823'
            mensaje: |
              Has tomado $\omega_{1} = 750\ \text{rad/s}$. Son 750 rpm, o sea
              $750\cdot 2\pi/60 = 78{,}54\ \text{rad/s}$.
        pista: |
          $A_z = \dfrac{I_{Gz}\,\omega_{1}\,\omega_{2}}{2d} \le 1{,}1\ \text{N}$,
          con $d = 0{,}1\ \text{m}$ y
          $\omega_{1} = 750\cdot 2\pi/60\ \text{rad/s}$.
        desarrollo: |
          $$
          \omega_{2} \le \frac{2{,}2\,d}{I_{Gz}\,\omega_{1}} = \frac{2{,}2\cdot 0{,}1}{3{,}5625\cdot 10^{-4}\cdot 78{,}54} = 7{,}86\ \text{rad/s}
          $$

      - tipo: calcular
        titulo: El mismo resultado en revoluciones por minuto
        pregunta: |
          ¿Cuánto es esa velocidad angular en rpm?
        respuesta:
          tipo: numero
          valor: '75.1'
          tolerancia: 0.3
          formato: un número, en rpm
        distractores:
          - valor: '471.7'
            mensaje: |
              Has multiplicado por 60 sin dividir entre $2\pi$. Una revolución
              son $2\pi$ radianes, así que
              $\text{rpm} = \omega\cdot 60/(2\pi)$.
          - valor: '1.31'
            mensaje: |
              Has dividido entre 60 en lugar de multiplicar. Pasar de rad/s a
              rpm da un número mayor, porque un minuto tiene sesenta segundos.
          - valor: '0.823'
            mensaje: |
              Ese número es el que sale si además tomas $\omega_{1}$ en rad/s
              en vez de en rpm. Aquí solo se pide cambiar de unidades el
              resultado anterior.
        pista: |
          $\text{rpm} = \omega\,\dfrac{60}{2\pi}$.
        desarrollo: |
          $$
          \omega_{2} = 7{,}86\cdot\frac{60}{2\pi} = 75{,}1\ \text{rpm}
          $$

          que es el valor redondeado a 75 rpm que publica la colección.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: 'El centro del disco está sobre el eje AB y no se mueve, así que $\vec{a}_G = \vec{0}$ y las reacciones dinámicas no vienen de ninguna fuerza de inercia.'
          - texto: 'Con los dos giros constantes, $d\vec{H}_G/dt = \vec{\Omega}\times\vec{H}_G$ tiene módulo $I_{Gz}\omega_{1}\omega_{2}$ y es perpendicular a los dos ejes.'
          - texto: 'Ese par lo equilibran dos fuerzas iguales y opuestas en $A$ y $B$, separadas $2d$, así que cada una vale $I_{Gz}\omega_{1}\omega_{2}/(2d)$.'

          - texto: 'Como la reacción estática ya vale $mg/2 = 1{,}40$ N y pasa de 1,1 N, el problema no tiene solución.'
            trampa: true
            mensaje: |
              El enunciado limita las reacciones **dinámicas**, que son las que
              añade el movimiento, no la carga total. La estática del peso está
              siempre ahí y se estudia aparte: las dos se superponen y cada una
              tiene su criterio.
    resolucion: |
      **Qué se pide exactamente.** El enunciado no limita lo que cargan los
      apoyos, sino la parte **dinámica**: la que aparece por el movimiento y
      desaparecería con todo parado. Conviene separarlas desde el principio,
      porque la estática del peso, $mg/2 = 1{,}40\ \text{N}$, ya sería mayor que
      el tope de 1,1 N y no viene al caso.

      **La dinámica.** El centro del disco está sobre el eje AB, así que no se
      mueve: $\vec{a}_G = \vec{0}$ y no hay ninguna fuerza de inercia que
      repartir. Lo único que exige el movimiento es un par. En ejes ligados al
      disco, con $\vec{e}_1$ a lo largo de AB y $\vec{e}_3$ perpendicular al
      disco,

      $$
      \vec{H}_G = I_{Gx}\,\omega_{2}\,\vec{e}_1 - I_{Gz}\,\omega_{1}\,\vec{e}_3
      \qquad
      \frac{d\vec{H}_G}{dt} = \vec{\Omega}\times\vec{H}_G = I_{Gz}\,\omega_{1}\,\omega_{2}\,\vec{e}_2
      $$

      **El reparto.** Ese par lo equilibra una pareja de fuerzas en $A$ y $B$,
      separadas $2d = 0{,}2\ \text{m}$:

      $$
      A_z = \frac{I_{Gz}\,\omega_{1}\,\omega_{2}}{2d} = -B_z
      $$

      **La condición.** Con $I_{Gz} = \tfrac12 m r^{2} = 3{,}5625\cdot 10^{-4}\ \text{kg}\cdot\text{m}^{2}$
      y $\omega_{1} = 78{,}54\ \text{rad/s}$:

      $$
      \omega_{2} \le \frac{2{,}2\,d}{I_{Gz}\,\omega_{1}} = 7{,}86\ \text{rad/s} = 75\ \text{rpm}
      $$

      **La comprobación.** El momento de inercia se ha recalculado sumando
      masa a masa sobre el disco discretizado, $3{,}5620\cdot 10^{-4}$, y el
      valor de la colección, 7,86 rad/s, sale de la desigualdad con cuatro
      cifras: 7,8628 rad/s, o 75,08 rpm.

      **Lo que enseña el número.** Un disco de menos de trescientos gramos
      girando a 750 rpm obliga a limitar el segundo giro a **75 rpm**, diez
      veces menos, si no se quiere cargar los cojinetes con más de un newton.
      Esa es la magnitud del efecto giroscópico.
  - id: ejma10-col106-la-placa-cuadrada-del-pasador-en-t
    titulo: La placa cuadrada que se levanta al girar el pasador en T
    fuente: >-
      Ejercicio 10.6 · Tema 10, «Dinámica del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo, y también se ha usado la
      resolución oficial del curso para comprobarlo. Los valores numéricos de
      las casillas usan el lado que da la figura, 450 mm, y se declaran en cada
      pregunta.
    nivel: practica
    enunciado: |
      Una placa cuadrada de lado $a$ y masa $m$ está articulada a un pasador
      con forma de T que gira alrededor del eje $OY$ con velocidad angular
      $\omega_{1} = \omega$ constante.

      Calcular:

      El valor de $\omega$ para el cual se mantiene el valor
      $\beta = 40^{\circ}$ constante.

      El intervalo de valores de $\omega$ para el cual la placa permanece
      vertical $\beta = 90^{\circ}$.

      <figure>
      <svg viewBox="0 0 420 300" role="img" width="420" height="300" aria-labelledby="ejma10-col106-t ejma10-col106-d">
