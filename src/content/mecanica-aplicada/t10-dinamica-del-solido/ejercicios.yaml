      <figcaption>

      La placa sin el pasador. A lo largo de la charnela basta con una componente, en B.

      </figcaption>
      </figure>

      - **En A**, $A_x$ y $A_y$; **en B**, $B_x$, $B_y$ y, a lo largo de la
        charnela, $B_z$. La resolución oficial pone una componente axial en
        cada bisagra; de ellas solo se puede conocer la suma, que sale nula.
      - **En G**, el peso, mg.
      - **Ningún par alrededor de la charnela**: la placa está articulada.

      **2. Incógnitas.** Las cinco componentes de las reacciones y la
      velocidad angular ω con la que β se mantiene; en el segundo apartado,
      los valores de ω con los que la placa no sale de la vertical.

      **3. Ecuaciones.** Con β constante, la placa gira con el pasador, y los
      ejes de la placa giran con ella, $\vec{\Omega} = \vec{\omega}_p$: la
      vertical descompuesta en ellos,

      $$
      \vec{\omega}_p = -\omega\operatorname{sen}\beta\,\vec{e}_1 + \omega\cos\beta\,\vec{e}_2
      $$

      Con $I_{Gx} = I_{Gz} = ma^{2}/12$ e $I_{Gy} = ma^{2}/6$, las
      componentes del momento angular son constantes, y su derivada es solo
      el término del giro de los ejes, a lo largo de la charnela:

      $$
      \vec{H}_G = -I_{Gx}\,\omega\operatorname{sen}\beta\,\vec{e}_1 + I_{Gy}\,\omega\cos\beta\,\vec{e}_2,
      \qquad
      \frac{d\vec{H}_G}{dt} = \vec{\omega}_p\times\vec{H}_G
      = \left(I_{Gx}-I_{Gy}\right)\omega^{2}\operatorname{sen}\beta\cos\beta\,\vec{e}_3
      = -\tfrac{1}{12}\,ma^{2}\omega^{2}\operatorname{sen}\beta\cos\beta\,\vec{e}_3
      $$

      G no está en el eje: describe una circunferencia horizontal de radio
      $\tfrac{a}{2}\cos\beta$, y el peso, en los ejes de la placa, tiene dos
      componentes:

      $$
      \vec{a}_G = -\omega^{2}\,\tfrac{a}{2}\cos\beta\left(\cos\beta\,\vec{e}_1 + \operatorname{sen}\beta\,\vec{e}_2\right),
      \qquad
      m\vec{g} = mg\operatorname{sen}\beta\,\vec{e}_1 - mg\cos\beta\,\vec{e}_2
      $$

      Con A en $-\tfrac{a}{2}\vec{e}_1 + \tfrac{a}{2}\vec{e}_3$ y B en
      $-\tfrac{a}{2}\vec{e}_1 - \tfrac{a}{2}\vec{e}_3$ respecto de G, las
      fuerzas y los momentos respecto de G:

      $$
      A_x + B_x + mg\operatorname{sen}\beta = -m\omega^{2}\tfrac{a}{2}\cos^{2}\beta,
      \qquad
      A_y + B_y - mg\cos\beta = -m\omega^{2}\tfrac{a}{2}\operatorname{sen}\beta\cos\beta,
      \qquad
      B_z = 0
      $$

      $$
      \tfrac{a}{2}\,(B_y - A_y) = 0,
      \qquad
      \tfrac{a}{2}\,(A_x - B_x + B_z) = 0,
      \qquad
      -\tfrac{a}{2}\,(A_y + B_y) = -\tfrac{1}{12}\,ma^{2}\omega^{2}\operatorname{sen}\beta\cos\beta
      $$

      **4. Resultados.** La tercera de momentos da
      $A_y + B_y = \tfrac16\,ma\,\omega^{2}\operatorname{sen}\beta\cos\beta$,
      y llevada a la segunda de fuerzas:

      $$
      \cos\beta\left(\tfrac23\,a\,\omega^{2}\operatorname{sen}\beta - g\right) = 0
      $$

      Hay dos maneras de cumplirla: con $\cos\beta = 0$, la placa vertical,
      sea cual sea ω; o con
      $\operatorname{sen}\beta = \dfrac{3g}{2a\omega^{2}}$.

      - **a) β = 40°:**
        $\omega^{2} = 3 \cdot 9{,}81/(2 \cdot 0{,}45 \cdot 0{,}6428) = 29{,}43/0{,}57852 = 50{,}87$,
        y $\omega = 7{,}13\ \text{rad/s}$.
      - **b) La placa vertical:** la segunda solución pide un seno que no
        pase de 1, $\omega^{2} \ge 3g/(2a) = 29{,}43/0{,}9 = 32{,}7$. Por
        debajo, la vertical es la única posición posible:
        $\omega < 5{,}72\ \text{rad/s}$.

      Son los resultados de la colección,
      $1{,}5276\sqrt{g/a}$ y $1{,}2247\sqrt{g/a}$, con
      $\sqrt{g/a} = 4{,}669$: $1{,}5276 \cdot 4{,}669 = 7{,}132$ y
      $1{,}2247 \cdot 4{,}669 = 5{,}718$. Además $B_z = 0$, $A_x = B_x$ y
      $A_y = B_y$.

      **5. Comprobación.** Sin tensor de inercia y sin reacciones: de canto,
      con las fuerzas de inercia en los ejes que giran con el pasador. Con β
      constante, en esos ejes la placa está quieta, y basta con la fuerza
      centrífuga de cada franja. Las reacciones de las bisagras cortan a la
      charnela y no tienen momento respecto de ella: solo quedan la
      centrífuga y el peso. Una franja a una distancia s de O, de masa
      $m\,ds/a$, está a $s\cos\beta$ del eje y $s\operatorname{sen}\beta$
      por debajo de la charnela:

