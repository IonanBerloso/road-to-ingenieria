        <text x="125" y="81" font-size="9" text-anchor="end" fill="var(--faint)">A</text>
        <text x="287" y="227" font-size="9" text-anchor="start" fill="var(--faint)">B</text>
        <text x="219" y="156" font-size="9" text-anchor="start" fill="var(--faint)">O</text>
