      - tipo: calcular
        titulo: La energía potencial del sistema
        pregunta: |
          Con los valores de prueba $M = 1\ \text{kg}$, $L = 1\ \text{m}$,
          $g = 9{,}81\ \text{m/s}^{2}$ y $\phi = 30^{\circ}$, ¿cuánto vale la
          energía potencial total, en julios, tomando el suelo como referencia?
        respuesta:
          tipo: numero
          valor: '73.27'
          tolerancia: 0.05
          formato: un número, en J
        distractores:
          - valor: '58.56'
            mensaje: |
              Te has dejado el muelle. Aunque no se vea moverse, está
              comprimido $2L\cos\phi$ y guarda
              $\tfrac12\frac{Mg}{L}(2L\cos\phi)^{2} = 2MgL\cos^{2}\phi$, que
              aquí son casi 15 J.
          - valor: '66.44'
            mensaje: |
              Has metido en $\tfrac12 k\delta^{2}$ la longitud del muelle
              $3L-2L\cos\phi$ en lugar de su deformación $2L\cos\phi$.
          - valor: '69.02'
            mensaje: |
              Has puesto la barra AB a la altura de $A$. Su centro de gravedad
              está en el punto medio entre $A$ y $C$, o sea a
              $3L - \tfrac32 L\cos\phi$ del suelo.
        pista: |
          Alturas: $h_C = 3L - L\cos\phi$ para la barra larga y
          $h_E = 3L - \tfrac32 L\cos\phi$ para la corta. El muelle guarda
          $\tfrac12\frac{Mg}{L}(2L\cos\phi)^{2}$.
        desarrollo: |
          $$
          V = 2MgL\left(3 - \cos\phi\right) + MgL\left(3 - \tfrac32\cos\phi\right) + 2MgL\cos^{2}\phi
          $$

          $$
          V = 9MgL - \tfrac72 MgL\cos\phi + 2MgL\cos^{2}\phi = 88{,}290 - 29{,}735 + 14{,}715 = 73{,}270\ \text{J}
          $$

      - tipo: calcular
        titulo: La energía cinética de la barra CD
        pregunta: |
          Con $M = 1$, $L = 1$, $\omega = 3\ \text{rad/s}$,
          $\dot{\phi} = 2\ \text{rad/s}$ y $\phi = 30^{\circ}$, ¿cuánto vale
          $T_{CD}$, en julios?
        respuesta:
          tipo: numero
          valor: '8.333'
          tolerancia: 0.02
          formato: un número, en J
        distractores:
          - valor: '5.333'
            mensaje: |
              Te has quedado solo con $\dot{\phi}$. La barra también es
              arrastrada por el eje: de $\vec{\omega}$ cuenta la componente
              perpendicular a la barra, $\omega\sin\phi$, porque a lo largo de
              la barra el momento de inercia es nulo.
          - valor: '17.33'
            mensaje: |
              Has metido $\omega$ entera. Solo su componente perpendicular a la
              barra, $\omega\sin\phi$, da energía de rotación; la componente a
              lo largo de la barra encuentra un momento de inercia nulo.
          - valor: '2.083'
            mensaje: |
              Esa es solo la rotación alrededor de $G$, con $I_G$. Si trabajas
              con $I_G$ te falta $\tfrac12 (2M) v_G^{2}$; si trabajas con
              $I_D$, el punto $D$ es fijo y ya está todo dentro.
        pista: |
          $D$ es un punto fijo, así que $T = \tfrac12\vec{\omega}\cdot\mathbf{I}_D\,\vec{\omega}$
          con $I_{Dy} = I_{Dz} = \tfrac13 (2M)(2L)^{2} = \tfrac83 ML^{2}$ y
          $I_{Dx} = 0$ a lo largo de la barra.
        desarrollo: |
          $$
          \vec{\omega}_{CD} = -\omega\cos\phi\,\vec{e}_1 + \omega\sin\phi\,\vec{e}_2 + \dot{\phi}\,\vec{e}_3
          $$

          $$
          T_{CD} = \tfrac12\cdot\tfrac83 ML^{2}\left(\omega^{2}\sin^{2}\phi + \dot{\phi}^{2}\right)
          = \tfrac43 ML^{2}\left(\omega^{2}\sin^{2}\phi + \dot{\phi}^{2}\right) = 8{,}333\ \text{J}
          $$

      - tipo: calcular
        titulo: La energía cinética de la barra AB
        pregunta: |
          Con los mismos valores, ¿cuánto vale $T_{AB}$, en julios?
        respuesta:
          tipo: numero
          valor: '2.042'
          tolerancia: 0.01
          formato: un número, en J
        distractores:
          - valor: '1.619'
            mensaje: |
              Ese es el valor que da el resultado impreso en la colección, con
              $\dot{\phi}^{2}(1+\operatorname{sen}2\phi)$. De los datos sale
              $\dot{\phi}^{2}(1+6\operatorname{sen}^{2}\phi)$, comprobado
              derivando la posición del centro de gravedad; el desarrollo lo
              explica.
          - valor: '0.2604'
            mensaje: |
              Esa es solo la parte de rotación,
              $\tfrac12\vec{\omega}\cdot\mathbf{I}_G\vec{\omega}$. Aquí ningún
              punto de la barra AB está fijo, así que hace falta también
              $\tfrac12 M v_G^{2}$, que es la parte grande.
          - valor: '1.781'
            mensaje: |
              Esa es solo $\tfrac12 M v_G^{2}$. Falta la rotación alrededor de
              $G$, que con $I_G = ML^{2}/12$ añade otro cuarto de julio.
        pista: |
          Ningún punto de AB está fijo: hace falta König. El centro de gravedad
          está a media barra entre $A$ y $C$, y su velocidad al cuadrado sale
          $v_G^{2} = \tfrac14\omega^{2}L^{2}\operatorname{sen}^{2}\phi + \dot{\phi}^{2}L^{2}\left(\tfrac14 + 2\operatorname{sen}^{2}\phi\right)$.
        desarrollo: |
          $$
          \tfrac12 M v_G^{2} = \tfrac18 M\omega^{2}L^{2}\operatorname{sen}^{2}\phi + \tfrac18 M\dot{\phi}^{2}L^{2} + M\dot{\phi}^{2}L^{2}\operatorname{sen}^{2}\phi
          $$

          $$
          \tfrac12\vec{\omega}\cdot\mathbf{I}_G\vec{\omega} = \tfrac{1}{24}ML^{2}\left(\omega^{2}\operatorname{sen}^{2}\phi + \dot{\phi}^{2}\right)
          $$

          $$
          T_{AB} = \tfrac16 ML^{2}\left[\omega^{2}\operatorname{sen}^{2}\phi + \dot{\phi}^{2}\left(1 + 6\operatorname{sen}^{2}\phi\right)\right] = 2{,}042\ \text{J}
          $$

      - tipo: justificar
        pregunta: Ordena el cálculo de las dos energías cinéticas. Una pieza es falsa.
        piezas:
          - texto: 'En la barra CD el punto $D$ es fijo, así que vale $T = \tfrac12\vec{\omega}\cdot\mathbf{I}_D\vec{\omega}$ con $I_D = \tfrac83 ML^{2}$.'
          - texto: 'De $\vec{\omega}$ solo cuenta lo perpendicular a la barra, porque el momento de inercia a lo largo de una barra delgada es nulo.'
          - texto: 'La barra AB no tiene ningún punto fijo, así que hay que sumar $\tfrac12 M v_G^{2}$ y $\tfrac12\vec{\omega}\cdot\mathbf{I}_G\vec{\omega}$.'
          - texto: 'La deslizadera $A$ recorre el eje sin rozamiento, así que es un punto fijo y $T_{AB} = \tfrac12\vec{\omega}\cdot\mathbf{I}_A\vec{\omega}$.'
            trampa: true
            mensaje: |
              $A$ se mueve: sube y baja por el eje según cambia $\phi$, y
              además el eje gira. Sin rozamiento quiere decir que no disipa
              energía, no que esté quieta. Tomar $A$ como punto fijo se deja
              fuera toda la energía de la traslación.
    resolucion: |
      **1. Posiciones.** Es un problema de energías de dos barras que giran
      con el eje y se abren con el ángulo φ: el dibujo lleva el mecanismo en
      la posición genérica, con sus alturas. Los nombres son los de la figura
      del enunciado: la barra larga va de D a B, con su punto medio en C, y la
      corta, de A a C; el texto las llama CD y AB.

