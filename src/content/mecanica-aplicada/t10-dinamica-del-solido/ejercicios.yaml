    pide: La aceleración angular del disco, la velocidad y la aceleración de E, y las reacciones estáticas y dinámicas en A y B.
    pasos:
      - tipo: reconocer
        pregunta: |
          Las dos velocidades angulares son constantes. ¿Cuánto vale entonces
          la aceleración angular del disco?
        opciones:
          - texto: No es nula, porque el vector ω1 cambia de dirección al girar el conjunto
            correcta: true
            mensaje: |
              Eso es. $\vec{\omega}_d = \omega_{2}\vec{e}_1 + \omega_{1}\vec{e}_3$
              tiene módulo constante, pero $\vec{e}_3$ da vueltas con el
              conjunto. Por Boure,
              $\vec{\alpha} = \vec{\Omega}\times\vec{\omega}_d$.
          - texto: Es nula, porque los dos módulos son constantes
            mensaje: |
              Un vector puede tener módulo constante y derivada no nula: basta
              con que gire. Aquí el eje del disco, $DE$, cambia de dirección
              mientras el conjunto gira con $\omega_{2}$.
          - texto: Es nula, porque el disco es un sólido de revolución
            mensaje: |
              La simetría del disco sirve para que el tensor de inercia no
              cambie en los ejes móviles, no para anular la aceleración
              angular. Son dos cosas distintas.
          - texto: Vale ω1 más ω2, sumadas como escalares
            mensaje: |
              Eso sería una velocidad angular, no una aceleración: las
              unidades ya no cuadran. La aceleración angular sale de derivar
              el vector, y aquí eso es un producto vectorial.

      - tipo: calcular
        titulo: La aceleración angular del disco
        pregunta: |
          Con los valores de prueba $\omega_{1} = 20\ \text{rad/s}$ y
          $\omega_{2} = 5\ \text{rad/s}$, ¿cuánto vale el módulo de
          $\vec{\alpha}_d$, en rad/s²?
        respuesta:
          tipo: numero
          valor: '100'
          tolerancia: 0.5
          formato: un número, en rad/s²
        distractores:
          - valor: '0'
            mensaje: |
              Con $\vec{\omega}$ de módulo constante la derivada en los ejes
              móviles sí es nula, pero falta el término
              $\vec{\Omega}\times\vec{\omega}_d$ de la fórmula de Boure, que
              aquí no se anula porque los dos giros no son paralelos.
          - valor: '25'
            mensaje: |
              Eso es $\omega_{2}^{2}$. La aceleración angular es el producto
              vectorial de las dos velocidades angulares, no el cuadrado de
              una de ellas.
          - valor: '400'
            mensaje: |
              Eso es $\omega_{1}^{2}$. En
              $\vec{\Omega}\times\vec{\omega}_d$ entran las dos velocidades
              una vez cada una, y como son perpendiculares el módulo es su
              producto.
        pista: |
          $\vec{\alpha}_d = \vec{\Omega}\times\vec{\omega}_d$ con
          $\vec{\Omega} = \omega_{2}\vec{e}_1$ y
          $\vec{\omega}_d = \omega_{2}\vec{e}_1 + \omega_{1}\vec{e}_3$.
        desarrollo: |
          $$
          \vec{\alpha}_d = \omega_{2}\vec{e}_1 \times \left(\omega_{2}\vec{e}_1 + \omega_{1}\vec{e}_3\right)
          = -\omega_{1}\omega_{2}\,\vec{e}_2 = -100\ \text{rad/s}^{2}\,\vec{e}_2
          $$

      - tipo: calcular
        titulo: La aceleración del punto E
        pregunta: |
          Con $\omega_{2} = 5\ \text{rad/s}$ y $L = 0{,}4\ \text{m}$, ¿cuánto
          vale el módulo de la aceleración de $E$, en m/s²?
        respuesta:
          tipo: numero
          valor: '14.14'
          tolerancia: 0.05
          formato: un número, en m/s²
        distractores:
          - valor: '10'
            mensaje: |
              Has usado una distancia $L$ al eje. $E$ está separado del eje AB
              en dos direcciones a la vez —$L$ en horizontal y $L$ en
              vertical—, así que su radio de giro es $L\sqrt{2}$.
          - valor: '0'
            mensaje: |
              $E$ describe una circunferencia alrededor del eje AB, y eso ya
              exige aceleración centrípeta aunque $\omega_{2}$ sea constante.
              Solo la componente tangencial es nula.
          - valor: '28.28'
            mensaje: |
              Has multiplicado por dos el radio de giro. La distancia de $E$ al
              eje AB es la hipotenusa $L\sqrt{2}$, no $2L$.
        pista: |
          $\vec{a}_E = \vec{\omega}_{CDE}\times(\vec{\omega}_{CDE}\times\overrightarrow{CE})$,
          con $\overrightarrow{CE} = -L\vec{e}_2 + L\vec{e}_3$. Es centrípeta
          pura y apunta al eje.
        desarrollo: |
          $$
          \vec{a}_E = \omega_{2}^{2}L\,\vec{e}_2 - \omega_{2}^{2}L\,\vec{e}_3
          \qquad
          |\vec{a}_E| = \omega_{2}^{2}L\sqrt{2} = 25\cdot 0{,}4\cdot 1{,}4142 = 14{,}14\ \text{m/s}^{2}
          $$

      - tipo: calcular
        titulo: La reacción horizontal perpendicular al eje
        pregunta: |
          Con $M = 3\ \text{kg}$, $L = 0{,}4\ \text{m}$ y
          $\omega_{2} = 5\ \text{rad/s}$, ¿cuánto vale la componente de la
          reacción en $A$ horizontal y perpendicular al eje AB, en newtons?
        respuesta:
          tipo: numero
          valor: '15'
          tolerancia: 0.05
          formato: un número, en N
        distractores:
          - valor: '30'
            mensaje: |
              Ese es el total que tienen que dar los dos apoyos entre los dos.
              Por simetría se reparte a partes iguales, así que a cada uno le
              toca la mitad.
          - valor: '21.21'
            mensaje: |
              Has usado el módulo entero de $\vec{a}_E$. Esta ecuación es la de
              la dirección horizontal perpendicular al eje, y ahí la
              aceleración vale $\omega_{2}^{2}L$, no $\omega_{2}^{2}L\sqrt{2}$.
          - valor: '0'
            mensaje: |
              No es nula: el centro de gravedad del disco describe una
              circunferencia, y alguien tiene que hacerle la fuerza centrípeta
              horizontal. Solo los apoyos pueden.
        pista: |
          En la dirección horizontal perpendicular al eje,
          $A_y + B_y = M\,a_{Ey} = M\omega_{2}^{2}L$, y la simetría reparte por
          igual.
        desarrollo: |
          $$
          A_y = B_y = \frac{M\omega_{2}^{2}L}{2} = \frac{3\cdot 25\cdot 0{,}4}{2} = 15\ \text{N}
          $$

      - tipo: calcular
        titulo: El término giroscópico de la reacción vertical
        pregunta: |
          Con $M = 3\ \text{kg}$, $R = 0{,}2\ \text{m}$, $L = 0{,}4\ \text{m}$,
          $\omega_{1} = 20$ y $\omega_{2} = 5\ \text{rad/s}$, ¿cuánto vale el
          término $MR^{2}\omega_{1}\omega_{2}/(4L)$ que suma en un apoyo y
          resta en el otro, en newtons?
        respuesta:
          tipo: numero
          valor: '7.5'
          tolerancia: 0.02
          formato: un número, en N
        distractores:
          - valor: '15'
            mensaje: |
              Ese es el par giroscópico dividido por la distancia entre apoyos
              una sola vez. El par $\tfrac12 MR^{2}\omega_{1}\omega_{2}$ lo
              equilibra una pareja de fuerzas separadas $2L$, así que cada una
              vale el par dividido entre $2L$.
          - valor: '3.75'
            mensaje: |
              Has usado $\tfrac14 MR^{2}$, que es el momento de inercia
              diametral del disco. El que entra aquí es el del eje de giro
              propio, $\tfrac12 MR^{2}$.
          - valor: '1.2'
            mensaje: |
              Ese es el número que sale de la expresión impresa en la
              colección, con $L$ multiplicando en vez de dividiendo. Esa forma
              no puede ser correcta: sus unidades no son newtons.
        pista: |
          El par que hay que equilibrar es
          $|d\vec{H}_G/dt| = \tfrac12 MR^{2}\omega_{1}\omega_{2}$, y los dos
          apoyos están separados $2L$.
        desarrollo: |
          $$
          \frac{d\vec{H}_G}{dt} = -\tfrac12 MR^{2}\omega_{1}\omega_{2}\,\vec{e}_2
          \qquad
          \frac{MR^{2}\omega_{1}\omega_{2}}{4L} = \frac{3\cdot 0{,}04\cdot 20\cdot 5}{4\cdot 0{,}4} = 7{,}5\ \text{N}
          $$

      - tipo: justificar
        pregunta: Ordena el análisis dinámico. Una pieza es falsa.
        piezas:
          - texto: 'El disco gira sobre sí mismo, pero es de revolución, así que su tensor de inercia no cambia en unos ejes que solo acompañen al conjunto.'
          - texto: 'Con $\vec{\omega}_d$ de componentes constantes en esos ejes, $d\vec{H}_G/dt$ se reduce al término $\vec{\Omega}\times\vec{H}_G$ de Boure.'
          - texto: 'Ese par, $\tfrac12 MR^{2}\omega_{1}\omega_{2}$, lo equilibran las reacciones verticales de A y B, que están separadas $2L$.'
          - texto: 'Como $\omega_{1}$ y $\omega_{2}$ son constantes, $d\vec{H}_G/dt$ es nulo y en A y B solo aparecen las reacciones del peso.'
            trampa: true
            mensaje: |
              Es el error central del tema. Que las componentes de
              $\vec{H}_G$ no cambien no significa que $\vec{H}_G$ no cambie:
              está escrito en unos ejes que giran, y hay que añadir
              $\vec{\Omega}\times\vec{H}_G$. Ese término es justo el que
              carga los cojinetes.
    resolucion: |
      **a) La aceleración angular.** En ejes que acompañan al conjunto, con
      $\vec{e}_1$ a lo largo de AB y $\vec{e}_3$ a lo largo de $DE$, la
      velocidad angular del disco es
      $\vec{\omega}_d = \omega_{2}\vec{e}_1 + \omega_{1}\vec{e}_3$, de
      componentes constantes. Derivando con Boure, con
      $\vec{\Omega} = \omega_{2}\vec{e}_1$:

      $$
      \vec{\alpha}_d = \vec{\Omega}\times\vec{\omega}_d = -\omega_{1}\omega_{2}\,\vec{e}_2
      $$

      **b) El punto E.** $\overrightarrow{CE} = -L\vec{e}_2 + L\vec{e}_3$ y el
      conjunto gira alrededor de AB con $\omega_{2}$ constante:

      $$
      \vec{v}_E = -\omega_{2}L\,\vec{e}_2 - \omega_{2}L\,\vec{e}_3
      \qquad
      \vec{a}_E = \omega_{2}^{2}L\,\vec{e}_2 - \omega_{2}^{2}L\,\vec{e}_3
      $$

      La aceleración es centrípeta pura y apunta al eje AB, del que $E$ dista
      $L\sqrt{2}$.

      **c) Las reacciones.** El momento angular en $G = E$ vale
      $\vec{H}_G = \tfrac14 MR^{2}\omega_{2}\vec{e}_1 + \tfrac12 MR^{2}\omega_{1}\vec{e}_3$,
      y su derivada es puro término de Boure:

      $$
      \frac{d\vec{H}_G}{dt} = \vec{\Omega}\times\vec{H}_G = -\tfrac12 MR^{2}\omega_{1}\omega_{2}\,\vec{e}_2
      $$

      Con $\vec{F} = M\vec{a}_G$ en las dos direcciones y el momento en $G$:

      $$
      A_y = B_y = \frac{M\omega_{2}^{2}L}{2}
      $$

      $$
      A_z = \frac{Mg}{2} - \frac{M\omega_{2}^{2}L}{2} + \frac{MR^{2}\omega_{1}\omega_{2}}{4L}
      \qquad
      B_z = \frac{Mg}{2} - \frac{M\omega_{2}^{2}L}{2} - \frac{MR^{2}\omega_{1}\omega_{2}}{4L}
      $$

      Las **estáticas** son las que quedan parando todo: $A_z = B_z = Mg/2$. Las
      **dinámicas** son los otros dos sumandos, y el interesante es el último:
      no existiría si el disco no girase sobre sí mismo.

      **Con los valores de prueba** $M = 3\ \text{kg}$, $R = 0{,}2$,
      $L = 0{,}4$, $\omega_{1} = 20$ y $\omega_{2} = 5$: la parte estática vale
      14,72 N, la centrífuga 15 N y la giroscópica 7,5 N, de manera que
      $A_z = 7{,}22\ \text{N}$ y $B_z = -7{,}79\ \text{N}$; la horizontal es
      $A_y = B_y = 15\ \text{N}$. Todo comprobado por otro camino, sumando
      $m_i\,\vec{r}_i\times\vec{v}_i$ sobre el disco discretizado y derivando
      numéricamente.

      **Dos avisos sobre lo impreso.** El resultado del apartado c) que publica
      la colección escribe $MR^{2}\omega_{1}\omega_{2}L/4$, con $L$
      multiplicando, cuando de las ecuaciones sale
      $MR^{2}\omega_{1}\omega_{2}/(4L)$ —con $L$ multiplicando no serían
      newtons—, y llama $A_y = B_y = Mg/2$ a las estáticas cuando el peso es
      vertical y le toca a $A_z = B_z$. La resolución oficial del curso trae
      las dos cosas bien.

      Y una fina, que conviene ver: si se plantean las seis ecuaciones con solo
      seis incógnitas de reacción, la del momento alrededor del propio eje AB
      no se cumple, y lo que sobra vale exactamente $MgL$. No es un error del
      planteamiento: es el **par motor** que hace falta para que $\omega_{2}$
      se mantenga constante con el disco colgando a un lado del eje. Los
      apoyos $A$ y $B$ no pueden darlo, porque están sobre el propio eje.
  - id: ejma10-col104-las-reacciones-del-cilindro
    titulo: Las reacciones estáticas y dinámicas de un cilindro con dos giros
    fuente: >-
