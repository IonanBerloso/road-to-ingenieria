        <circle cx="225" cy="140" r="2.4" fill="var(--ink)"/>
        <text x="219" y="134" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">C</text>
        <text x="68" y="192" font-size="9" text-anchor="end" fill="var(--faint)">A</text>
        <text x="358" y="96" font-size="9" text-anchor="end" fill="var(--faint)">B</text>
