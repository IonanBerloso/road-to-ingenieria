        <path d="M33 91.1 H47 V103.1 H33 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M40 6 V130" fill="none" stroke="var(--ink)" stroke-width="1" stroke-dasharray="4 3"/>
        <circle cx="40" cy="20" r="3.4" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
        <circle cx="86" cy="58.6" r="3.4" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
        <circle cx="40" cy="97.1" r="3.4" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
        <line x1="131.9" y1="97.1" x2="40" y2="97.1" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="131.9" y1="97.1" x2="63" y2="77.9" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="40" y1="97.1" x2="40" y2="55.8" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="34" y="76.5" font-size="10" text-anchor="end" fill="var(--ink)" font-style="italic">v<tspan font-size="7.5" dy="2.5">A</tspan><tspan dy="-2.5"></tspan></text>
        <line x1="86" y1="58.6" x2="103.3" y2="37.9" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="107.3" y="37.9" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">v<tspan font-size="7.5" dy="2.5">C</tspan><tspan dy="-2.5"></tspan></text>
        <line x1="63" y1="77.9" x2="71.7" y2="46.8" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="61" y="63.9" font-size="10" text-anchor="end" fill="var(--ink)" font-style="italic">v<tspan font-size="7.5" dy="2.5">E</tspan><tspan dy="-2.5"></tspan></text>
        <circle cx="40" cy="20" r="2.4" fill="var(--ink)"/>
        <text x="47" y="17" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">D</text>
        <circle cx="131.9" cy="97.1" r="2.4" fill="var(--ink)"/>
        <text x="137.9" y="101.1" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">B</text>
        <circle cx="63" cy="77.9" r="2.4" fill="var(--ink)"/>
        <text x="65" y="90.9" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">E</text>
        <text x="96" y="70.6" font-size="9" text-anchor="start" fill="var(--faint)">C</text>
        <text x="30" y="101.1" font-size="9" text-anchor="end" fill="var(--faint)">A</text>
      </svg>
      <figcaption>

      Solo con φ punto, en el plano que gira. La barra corta gira alrededor de B, el extremo de la larga: A sube y E se mueve perpendicular a BE.

      </figcaption>
      </figure>

      La barra corta gira ahí alrededor de B con $\dot{\phi}$, y E está a
      $BE^{2} = L^{2}\left(\tfrac94\operatorname{sen}^{2}\phi + \tfrac14\cos^{2}\phi\right) = L^{2}\left(\tfrac14 + 2\operatorname{sen}^{2}\phi\right)$
      de B: es justo el término en $\dot{\phi}^{2}$ de $v_E^{2}$. El del eje,
      perpendicular al plano, es su distancia al eje por ω. Con los valores
      de prueba, $v_E^{2} = 0{,}5625 + 4 \cdot 0{,}75 = 3{,}5625$, y

      $$
      T_{AB} = \tfrac12 \cdot 3{,}5625 + \tfrac{1}{24}\,(2{,}25 + 4) = 1{,}7813 + 0{,}2604 = 2{,}042\ \text{J}
      $$

      Lo mismo.

      **Lo que dice el resultado.** El muelle siempre está comprimido, aunque
      las barras cuelguen: con φ = 0 lo está 2L, y guarda 2MgL. En la barra
      larga, de ω solo cuenta lo que cae perpendicular a ella,
      $\omega\operatorname{sen}\phi$; con las barras verticales el giro del
      eje no le da energía. Y en la corta pesa más la traslación que el giro:
      1,78 de los 2,04 J, porque E sube y baja con φ más deprisa de lo que la
      barra gira.

  - id: ejma10-col103-el-disco-sobre-la-barra-cde
    titulo: El disco sobre la barra acodada, aceleraciones y reacciones en los apoyos
    fuente: >-
      Ejercicio 10.3 · Tema 10, «Dinámica del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo, y también se ha usado la
      resolución oficial del curso para comprobarlo. El resultado impreso del
      apartado c) tiene erratas de imprenta que el desarrollo señala. Los
      valores numéricos de las casillas son nuestros y se declaran en cada
      pregunta. La figura sigue la del curso, con e₁ de C hacia A.
    nivel: practica
    antes:
      idea: |
        La aceleración angular es la derivada del vector velocidad angular.
        La derivada de un vector escrito en unos ejes que giran tiene dos
        partes: la de sus componentes en esos ejes y la del giro de los
        propios ejes. El momento de las fuerzas respecto del centro de masas
        es la derivada del momento angular, y la resultante, la masa por la
        aceleración del centro de masas.
      formula: |
        Con $\vec{\Omega}$ la velocidad angular de los ejes:

        $$
        \frac{d\vec{u}}{dt} = \left(\frac{d\vec{u}}{dt}\right)_{\text{ejes}} + \vec{\Omega}\times\vec{u},
        \qquad
        \sum\vec{F} = M\vec{a}_G,
        \qquad
        \sum\vec{M}_G = \frac{d\vec{H}_G}{dt}
        $$

        Para un disco de masa M y radio R: $\tfrac12 MR^{2}$ respecto de su
        eje y $\tfrac14 MR^{2}$ respecto de un diámetro.
      reconocer: |
        Antes de calcular se mira qué giros tiene el disco.
    enunciado: |
      Un disco de masa $M$ y radio $R$ gira con una velocidad angular
      $\omega_{1}$ constante respecto de la barra CDE mientras que el conjunto
      gira con una velocidad angular constante $\omega_{2}$ respecto al eje AB.
      Distancias: $AC = BC = CD = ED = L$.

      Calcular:

      a) Aceleración angular del disco.

      b) Velocidad y aceleración del punto $E$.

      c) Reacciones estáticas y dinámicas en $A$ y $B$.

