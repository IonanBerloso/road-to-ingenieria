        <line x1="110" y1="262" x2="110" y2="34" stroke="var(--ink)" stroke-width="1.2" marker-end="url(#ejma10-col101-fi)"/>
        <text x="98" y="40" font-size="10" fill="var(--ink)">Y = y</text>
