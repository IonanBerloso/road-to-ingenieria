    pide: La energía potencial del sistema y la energía cinética de cada una de las dos barras, en función de M, L, g, ω, el ángulo y su derivada.
    pasos:
      - tipo: reconocer
        pregunta: |
          El muelle tiene longitud natural $3L$ y une el suelo con la
          deslizadera $A$. ¿Cuánto se ha deformado en la posición del ángulo
          $\phi$?
        opciones:
          - texto: 2L cos φ, y está comprimido
            correcta: true
            mensaje: |
              Eso es. El triángulo $DAC$ es isósceles, así que $A$ está
              $2L\cos\phi$ por debajo de $D$: la longitud del muelle es
              $3L - 2L\cos\phi$ y la deformación, la diferencia con la natural.
          - texto: 3L − 2L cos φ, que es lo que mide el muelle
            mensaje: |
              Eso es su **longitud**, no su deformación. En la energía elástica
              $\tfrac12 k\delta^{2}$ entra lo que se ha estirado o comprimido
              respecto de la longitud natural, no lo que mide.
          - texto: 2L(1 − cos φ), medido desde la posición vertical
            mensaje: |
              Esa es la variación de longitud entre $\phi = 0$ y $\phi$, no la
              deformación respecto de la natural. Con $\phi = 0$ el muelle ya
              está comprimido $2L$, y esa fórmula daría cero.
          - texto: L cos φ, la bajada del punto medio de la barra corta
            mensaje: |
              Ese es el descenso del centro de gravedad de la barra AB, que
              hace falta para la energía potencial gravitatoria, pero el muelle
              se agarra a $A$, no a su punto medio.

      - tipo: calcular
        titulo: La energía potencial del sistema
        pregunta: |
          Con los valores de prueba $M = 1\ \text{kg}$, $L = 1\ \text{m}$,
          $g = 9{,}81\ \text{m/s}^{2}$ y $\phi = 30^{\circ}$, ¿cuánto vale la
          energía potencial total, en julios, tomando el suelo como referencia?
        respuesta:
          tipo: numero
          valor: '73.27'
          tolerancia: 0.05
          formato: un número, en J
        distractores:
          - valor: '58.56'
            mensaje: |
              Te has dejado el muelle. Aunque no se vea moverse, está
              comprimido $2L\cos\phi$ y guarda
              $\tfrac12\frac{Mg}{L}(2L\cos\phi)^{2} = 2MgL\cos^{2}\phi$, que
              aquí son casi 15 J.
          - valor: '66.44'
            mensaje: |
              Has metido en $\tfrac12 k\delta^{2}$ la longitud del muelle
              $3L-2L\cos\phi$ en lugar de su deformación $2L\cos\phi$.
          - valor: '69.02'
            mensaje: |
              Has puesto la barra AB a la altura de $A$. Su centro de gravedad
              está en el punto medio entre $A$ y $C$, o sea a
              $3L - \tfrac32 L\cos\phi$ del suelo.
        pista: |
          Alturas: $h_C = 3L - L\cos\phi$ para la barra larga y
          $h_E = 3L - \tfrac32 L\cos\phi$ para la corta. El muelle guarda
          $\tfrac12\frac{Mg}{L}(2L\cos\phi)^{2}$.
        desarrollo: |
          $$
          V = 2MgL\left(3 - \cos\phi\right) + MgL\left(3 - \tfrac32\cos\phi\right) + 2MgL\cos^{2}\phi
          $$

          $$
          V = 9MgL - \tfrac72 MgL\cos\phi + 2MgL\cos^{2}\phi = 88{,}290 - 29{,}735 + 14{,}715 = 73{,}270\ \text{J}
          $$

      - tipo: calcular
        titulo: La energía cinética de la barra CD
        pregunta: |
          Con $M = 1$, $L = 1$, $\omega = 3\ \text{rad/s}$,
          $\dot{\phi} = 2\ \text{rad/s}$ y $\phi = 30^{\circ}$, ¿cuánto vale
          $T_{CD}$, en julios?
        respuesta:
          tipo: numero
          valor: '8.333'
          tolerancia: 0.02
          formato: un número, en J
        distractores:
          - valor: '5.333'
            mensaje: |
              Te has quedado solo con $\dot{\phi}$. La barra también es
              arrastrada por el eje: de $\vec{\omega}$ cuenta la componente
              perpendicular a la barra, $\omega\sin\phi$, porque a lo largo de
              la barra el momento de inercia es nulo.
          - valor: '17.33'
            mensaje: |
              Has metido $\omega$ entera. Solo su componente perpendicular a la
              barra, $\omega\sin\phi$, da energía de rotación; la componente a
              lo largo de la barra encuentra un momento de inercia nulo.
          - valor: '2.083'
            mensaje: |
              Esa es solo la rotación alrededor de $G$, con $I_G$. Si trabajas
              con $I_G$ te falta $\tfrac12 (2M) v_G^{2}$; si trabajas con
              $I_D$, el punto $D$ es fijo y ya está todo dentro.
        pista: |
          $D$ es un punto fijo, así que $T = \tfrac12\vec{\omega}\cdot\mathbf{I}_D\,\vec{\omega}$
          con $I_{Dy} = I_{Dz} = \tfrac13 (2M)(2L)^{2} = \tfrac83 ML^{2}$ y
          $I_{Dx} = 0$ a lo largo de la barra.
        desarrollo: |
          $$
          \vec{\omega}_{CD} = -\omega\cos\phi\,\vec{e}_1 + \omega\sin\phi\,\vec{e}_2 + \dot{\phi}\,\vec{e}_3
          $$

          $$
          T_{CD} = \tfrac12\cdot\tfrac83 ML^{2}\left(\omega^{2}\sin^{2}\phi + \dot{\phi}^{2}\right)
          = \tfrac43 ML^{2}\left(\omega^{2}\sin^{2}\phi + \dot{\phi}^{2}\right) = 8{,}333\ \text{J}
          $$

      - tipo: calcular
        titulo: La energía cinética de la barra AB
        pregunta: |
          Con los mismos valores, ¿cuánto vale $T_{AB}$, en julios?
        respuesta:
          tipo: numero
          valor: '2.042'
          tolerancia: 0.01
          formato: un número, en J
        distractores:
          - valor: '1.619'
            mensaje: |
              Ese es el valor que da el resultado impreso en la colección, con
              $\dot{\phi}^{2}(1+\operatorname{sen}2\phi)$. De los datos sale
              $\dot{\phi}^{2}(1+6\operatorname{sen}^{2}\phi)$, comprobado
              derivando la posición del centro de gravedad; el desarrollo lo
              explica.
          - valor: '0.2604'
            mensaje: |
              Esa es solo la parte de rotación,
              $\tfrac12\vec{\omega}\cdot\mathbf{I}_G\vec{\omega}$. Aquí ningún
              punto de la barra AB está fijo, así que hace falta también
              $\tfrac12 M v_G^{2}$, que es la parte grande.
          - valor: '1.781'
            mensaje: |
              Esa es solo $\tfrac12 M v_G^{2}$. Falta la rotación alrededor de
              $G$, que con $I_G = ML^{2}/12$ añade otro cuarto de julio.
        pista: |
          Ningún punto de AB está fijo: hace falta König. El centro de gravedad
          está a media barra entre $A$ y $C$, y su velocidad al cuadrado sale
          $v_G^{2} = \tfrac14\omega^{2}L^{2}\operatorname{sen}^{2}\phi + \dot{\phi}^{2}L^{2}\left(\tfrac14 + 2\operatorname{sen}^{2}\phi\right)$.
        desarrollo: |
          $$
          \tfrac12 M v_G^{2} = \tfrac18 M\omega^{2}L^{2}\operatorname{sen}^{2}\phi + \tfrac18 M\dot{\phi}^{2}L^{2} + M\dot{\phi}^{2}L^{2}\operatorname{sen}^{2}\phi
          $$

          $$
          \tfrac12\vec{\omega}\cdot\mathbf{I}_G\vec{\omega} = \tfrac{1}{24}ML^{2}\left(\omega^{2}\operatorname{sen}^{2}\phi + \dot{\phi}^{2}\right)
          $$

          $$
          T_{AB} = \tfrac16 ML^{2}\left[\omega^{2}\operatorname{sen}^{2}\phi + \dot{\phi}^{2}\left(1 + 6\operatorname{sen}^{2}\phi\right)\right] = 2{,}042\ \text{J}
          $$

      - tipo: justificar
        pregunta: Ordena el cálculo de las dos energías cinéticas. Una pieza es falsa.
        piezas:
          - texto: 'En la barra CD el punto $D$ es fijo, así que vale $T = \tfrac12\vec{\omega}\cdot\mathbf{I}_D\vec{\omega}$ con $I_D = \tfrac83 ML^{2}$.'
          - texto: 'De $\vec{\omega}$ solo cuenta lo perpendicular a la barra, porque el momento de inercia a lo largo de una barra delgada es nulo.'
          - texto: 'La barra AB no tiene ningún punto fijo, así que hay que sumar $\tfrac12 M v_G^{2}$ y $\tfrac12\vec{\omega}\cdot\mathbf{I}_G\vec{\omega}$.'
          - texto: 'La deslizadera $A$ recorre el eje sin rozamiento, así que es un punto fijo y $T_{AB} = \tfrac12\vec{\omega}\cdot\mathbf{I}_A\vec{\omega}$.'
            trampa: true
            mensaje: |
              $A$ se mueve: sube y baja por el eje según cambia $\phi$, y
              además el eje gira. Sin rozamiento quiere decir que no disipa
              energía, no que esté quieta. Tomar $A$ como punto fijo se deja
              fuera toda la energía de la traslación.
    resolucion: |
      **La geometría.** El triángulo $DAC$ es isósceles —$DC = CA = L$— así que
      la deslizadera $A$ está $2L\cos\phi$ por debajo de $D$, y el muelle, de
      longitud natural $3L$, queda comprimido justo $\delta = 2L\cos\phi$. Las
      alturas de los centros de gravedad sobre el suelo son
      $h_C = 3L - L\cos\phi$ y $h_E = 3L - \tfrac32 L\cos\phi$.

      **a) La energía potencial.**

      $$
      V = 2MgL(3-\cos\phi) + MgL\left(3-\tfrac32\cos\phi\right) + \tfrac12\frac{Mg}{L}\left(2L\cos\phi\right)^{2}
      $$

      $$
      V = 9MgL - \tfrac72 MgL\cos\phi + 2MgL\cos^{2}\phi
      $$

      **b) La barra CD.** $D$ es punto fijo, así que toda su energía es de
      rotación alrededor de $D$. En ejes ligados a la barra, con $e_1$ a lo
      largo de ella, $I_{Dx} = 0$ e $I_{Dy} = I_{Dz} = \tfrac13(2M)(2L)^{2} = \tfrac83 ML^{2}$,
      y la velocidad angular es
      $\vec{\omega}_{CD} = -\omega\cos\phi\,\vec{e}_1 + \omega\operatorname{sen}\phi\,\vec{e}_2 + \dot{\phi}\,\vec{e}_3$:

      $$
      T_{CD} = \tfrac43 ML^{2}\left(\omega^{2}\operatorname{sen}^{2}\phi + \dot{\phi}^{2}\right)
      $$

      **c) La barra AB.** Aquí no hay punto fijo y hace falta König. Componiendo
      velocidades desde $D$ se llega a

      $$
      v_G^{2} = \tfrac14\omega^{2}L^{2}\operatorname{sen}^{2}\phi + \dot{\phi}^{2}L^{2}\left(\tfrac14 + 2\operatorname{sen}^{2}\phi\right)
      $$

      y sumando la rotación con $I_G = ML^{2}/12$ en las dos direcciones
      transversales:

      $$
      T_{AB} = \tfrac16 ML^{2}\left[\omega^{2}\operatorname{sen}^{2}\phi + \dot{\phi}^{2}\left(1 + 6\operatorname{sen}^{2}\phi\right)\right]
      $$

      **La comprobación, y una diferencia con lo impreso.** Los tres resultados
      se han recalculado por otro camino: discretizando cada barra en masas
      puntuales, derivando numéricamente su posición y sumando
      $\tfrac12 m_i v_i^{2}$. Con $M = L = 1$, $\phi = 30^{\circ}$,
      $\dot{\phi} = 2$ y $\omega = 3$ salen $V = 73{,}27\ \text{J}$,
      $T_{CD} = 8{,}333\ \text{J}$ y $T_{AB} = 2{,}042\ \text{J}$, que son
      exactamente los de las fórmulas de arriba.

      El apartado c) impreso en la colección dice
      $\dot{\phi}^{2}(1 + \operatorname{sen}2\phi)$ donde de los datos sale
      $\dot{\phi}^{2}(1 + 6\operatorname{sen}^{2}\phi)$; con esos valores daría
      1,619 J en vez de 2,042 J. La propia resolución oficial escribe en su
      penúltima línea los tres sumandos correctos y solo al encuadrarlos pierde
      un $\operatorname{sen}^{2}\phi$, así que lo que falla es el paso a limpio,
      no el planteamiento.
  - id: ejma10-col103-el-disco-sobre-la-barra-cde
    titulo: El disco sobre la barra acodada, aceleraciones y reacciones en los apoyos
    fuente: >-
      Ejercicio 10.3 · Tema 10, «Dinámica del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo, y también se ha usado la
      resolución oficial del curso para comprobarlo. El resultado impreso del
      apartado c) tiene erratas de imprenta que el desarrollo señala. Los
      valores numéricos de las casillas son nuestros y se declaran en cada
      pregunta.
    nivel: practica
    enunciado: |
      Un disco de masa $M$ y radio $R$ gira con una velocidad angular
      $\omega_{1}$ constante respecto de la barra CDE mientras que el conjunto
      gira con una velocidad angular constante $\omega_{2}$ respecto al eje AB.
      Distancias: $AC = BC = CD = ED = L$.

      Calcular:

      a) Aceleración angular del disco.

      b) Velocidad y aceleración del punto $E$.

      c) Reacciones estáticas y dinámicas en $A$ y $B$.

