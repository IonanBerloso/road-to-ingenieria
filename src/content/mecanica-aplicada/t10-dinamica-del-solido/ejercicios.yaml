# De cinco en cinco y no de diez: con el sólido libre, las flechas de vector y la
# comprobación, el bloque de nueve pesaba 2,98 MiB, a un paso
# de los 3 MB (lib/ejercicios.ts).
porPagina: 5
ejercicios:
  - id: ejma10-la-energia-del-disco-que-rueda
    titulo: La energía cinética de un disco que rueda
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    antes:
      idea: |
        La energía cinética de un sólido es la suma de la de todas sus
        partículas, cada una con su velocidad. En un sólido rígido esas
        velocidades no son libres: todas salen de la de un punto y de la
        velocidad angular. Rodar sin deslizar quiere decir que el punto de
        contacto con el suelo no resbala: su velocidad es nula.
      formula: |
        $$
        T = \tfrac12\int v^{2}\,dm,
        \qquad
        \vec{v}_P = \vec{v}_G + \vec{\omega}\times\overrightarrow{GP}
        $$

        Para un disco macizo y homogéneo de radio R, respecto de su eje:
        $I_G = \tfrac12 M R^{2}$.
      reconocer: |
        Antes de calcular se mira cómo se mueve el disco.
    enunciado: |
      Un disco macizo y homogéneo de masa 4 kg rueda sin deslizar por un suelo
      horizontal, con su centro avanzando a 2 m/s. Calcular su energía
      cinética.
    pide: La energía cinética total del disco.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿De qué se compone la energía cinética del disco?
        opciones:
          - texto: De la traslación con el centro y la rotación alrededor de él
            correcta: true
            mensaje: |
              Eso es: $T = \tfrac12 M v_G^{2} + \tfrac12 I_G\,\omega^{2}$. El disco
              avanza y gira a la vez, y las dos partes cuentan.
          - texto: Solo de la traslación, porque el centro es el que se mueve
            mensaje: |
              El disco también gira, y la energía de ese giro es parte de su
              energía cinética. Quedarse con la traslación la deja corta.
          - texto: Solo de la rotación, porque rueda
            mensaje: |
              Rodar es avanzar girando. Contando solo el giro alrededor del
              centro falta la traslación, que aquí es la parte mayor.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el disco en un instante, con la
          velocidad de su centro, su velocidad angular y la velocidad de los
          puntos de su diámetro vertical**. Sin escala.
        comprueba:
          - punto: |
              **La velocidad del centro, $v_G = 2$ m/s, horizontal y hacia
              delante.**
            porque: |
              Es el dato del enunciado, y el centro va en línea recta.
          - punto: |
              **El punto de contacto, C, con velocidad nula.**
            porque: |
              Rodar sin deslizar es eso: en C el disco no resbala sobre el
              suelo.
          - punto: |
              **La velocidad angular ω, en el sentido en que rueda: horario si
              avanza hacia la derecha.**
            porque: |
              Con C quieto y G avanzando, el disco gira alrededor de C hacia
              delante.
          - punto: |
              **Las velocidades del diámetro vertical, creciendo desde cero en
              C: la de lo alto, P, el doble que la del centro.**
            porque: |
              En ese instante el disco gira alrededor de C, y cada punto va
              en proporción a su distancia a C.
        figura: |
          <svg viewBox="6 28 214 124" role="img" width="214" height="124" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">Esquema de velocidades del disco que rueda sin deslizar</title>
            <desc id="dsl-d">El disco sobre el suelo horizontal, con su centro G y el punto de contacto C. La velocidad del centro, horizontal y hacia la derecha; la velocidad angular, en sentido horario. A lo largo del diámetro vertical, la velocidad crece desde cero en C: en lo alto del disco, en P, es el doble que en el centro. Una recta tenue une C con las puntas de las dos flechas.</desc>
            <defs>
              <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
              </marker>
              <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
              </marker>
              <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
              </marker>
            </defs>
            <path d="M150 90 A40 40 0 1 0 70 90 A40 40 0 1 0 150 90 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M14 130 H214" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <line x1="110" y1="130" x2="196" y2="50" stroke="var(--faint)" stroke-width="0.7"/>
            <path d="M91.2 96.8 A20 20 0 0 1 103.2 71.2" fill="none" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
            <text x="84" y="70" font-size="10" text-anchor="end" fill="var(--ink)" font-style="italic">ω</text>
            <line x1="110" y1="90" x2="153" y2="90" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
            <text x="156" y="100" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">v<tspan font-size="7.5" dy="2.5">G</tspan><tspan dy="-2.5"></tspan></text>
            <line x1="110" y1="50" x2="196" y2="50" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
            <text x="196" y="42" font-size="10" text-anchor="middle" fill="var(--ink)" font-style="italic">v<tspan font-size="7.5" dy="2.5">P</tspan><tspan dy="-2.5"></tspan></text>
            <circle cx="110" cy="90" r="2.4" fill="var(--ink)"/>
            <text x="104" y="104" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">G</text>
            <circle cx="110" cy="130" r="2.4" fill="var(--ink)"/>
            <text x="104" y="144" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">C</text>
            <circle cx="110" cy="50" r="2.4" fill="var(--ink)"/>
            <text x="104" y="44" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">P</text>
          </svg>

      - tipo: calcular
        titulo: La energía cinética total
        pregunta: |
          ¿Cuánto vale la energía cinética del disco, en julios?
        respuesta:
          tipo: numero
          valor: '12'
          tolerancia: 0.05
          formato: un número, en J
        distractores:
          - valor: '8'
            mensaje: |
              Esa es solo la de traslación, $\tfrac12 \cdot 4 \cdot 2^{2}$. Falta la
              de rotación.
          - valor: '4'
            mensaje: |
              Esa es solo la de rotación. Falta la de traslación, que es el
              doble.
          - valor: '16'
            mensaje: |
              Has usado $I = MR^{2}$, el momento de inercia de un anillo. El
              disco macizo tiene $MR^{2}/2$.
        pista: |
          $I_G = MR^{2}/2$ y, al rodar sin deslizar, $\omega = v_G/R$: la rotación
          da $\tfrac12 \cdot \tfrac{MR^{2}}{2} \cdot \tfrac{v_G^{2}}{R^{2}} = \tfrac14 M v_G^{2}$.
        desarrollo: |
          $$
          T = \tfrac12 M v_G^{2} + \tfrac14 M v_G^{2} = \tfrac34 M v_G^{2} = \tfrac34 \cdot 4 \cdot 2^{2} = 12\ \text{J}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: La energía de traslación es $\tfrac12 M v_G^{2} = \tfrac12 \cdot 4 \cdot 4 = 8$ J.
          - texto: 'Rodando sin deslizar, $\omega = v_G/R$, y la de rotación es $\tfrac12 \cdot \tfrac{MR^{2}}{2}\,\omega^{2} = 4$ J.'
          - texto: La total es 12 J, y el radio no hace falta porque se simplifica.
          - texto: Sin saber el radio no se puede calcular, porque la energía de rotación depende de él.
            trampa: true
            mensaje: |
              El radio aparece en $I_G$ y en $\omega$, y se cancela:
              $\tfrac12 \cdot \tfrac{MR^{2}}{2} \cdot \tfrac{v^{2}}{R^{2}} = \tfrac14 M v^{2}$.
    resolucion: |
      **1. Esquema de velocidades.** Es un problema de energía cinética de un
      sólido que avanza y gira a la vez: el dibujo lleva el disco con la
      velocidad de su centro, su velocidad angular y su punto de contacto.

      <figure class="figura-examen">
      <svg viewBox="6 28 214 124" role="img" width="321" height="186" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">Esquema de velocidades del disco que rueda sin deslizar</title>
        <desc id="dsl-d">El disco sobre el suelo horizontal, con su centro G y el punto de contacto C. La velocidad del centro, horizontal y hacia la derecha; la velocidad angular, en sentido horario. A lo largo del diámetro vertical, la velocidad crece desde cero en C: en lo alto del disco, en P, es el doble que en el centro. Una recta tenue une C con las puntas de las dos flechas.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M150 90 A40 40 0 1 0 70 90 A40 40 0 1 0 150 90 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M14 130 H214" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <line x1="110" y1="130" x2="196" y2="50" stroke="var(--faint)" stroke-width="0.7"/>
        <path d="M91.2 96.8 A20 20 0 0 1 103.2 71.2" fill="none" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="84" y="70" font-size="10" text-anchor="end" fill="var(--ink)" font-style="italic">ω</text>
        <line x1="110" y1="90" x2="153" y2="90" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="156" y="100" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">v<tspan font-size="7.5" dy="2.5">G</tspan><tspan dy="-2.5"></tspan></text>
        <line x1="110" y1="50" x2="196" y2="50" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="196" y="42" font-size="10" text-anchor="middle" fill="var(--ink)" font-style="italic">v<tspan font-size="7.5" dy="2.5">P</tspan><tspan dy="-2.5"></tspan></text>
        <circle cx="110" cy="90" r="2.4" fill="var(--ink)"/>
        <text x="104" y="104" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">G</text>
        <circle cx="110" cy="130" r="2.4" fill="var(--ink)"/>
        <text x="104" y="144" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">C</text>
        <circle cx="110" cy="50" r="2.4" fill="var(--ink)"/>
        <text x="104" y="44" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">P</text>
      </svg>
      <figcaption>

      El disco que rueda, en un instante. El punto de contacto está quieto, y cada punto del diámetro vertical va más deprisa cuanto más lejos está de él.

      </figcaption>
      </figure>

      - **El centro G** avanza a $v_G = 2$ m/s.
      - **El punto de contacto C** no resbala: su velocidad es nula.
      - **La velocidad angular**, horaria, es $\omega = v_G/R$: de C a G hay
        un radio, y G va a $v_G$.

      **2. Incógnitas.** La energía cinética T, con el radio R sin dar.

      **3. Ecuaciones.** Sumando las partículas con
      $\vec{v}_P = \vec{v}_G + \vec{\omega}\times\overrightarrow{GP}$, la
      energía cinética se separa en la del centro de masas, con toda la masa,
      y la del giro alrededor de él (teorema de König):

      $$
      T = \tfrac12 M v_G^{2} + \tfrac12 I_G\,\omega^{2},
      \qquad
      I_G = \tfrac12 M R^{2},
      \qquad
      \omega = \frac{v_G}{R}
      $$

      **4. Resultados.** La traslación, $\tfrac12 \cdot 4 \cdot 2^{2} = 8$ J.
      La rotación, con el radio, que se va:

      $$
      \tfrac12 \cdot \frac{MR^{2}}{2} \cdot \frac{v_G^{2}}{R^{2}} = \tfrac14 M v_G^{2} = \tfrac14 \cdot 4 \cdot 2^{2} = 4\ \text{J}
      $$

      $$
      T = 8 + 4 = 12\ \text{J}
      $$

      **La energía cinética del disco es 12 J.**

      **5. Comprobación.** Por el centro instantáneo de rotación, sin separar
      en dos partes. En este instante el disco gira alrededor de C, y con
      Steiner, $I_C = I_G + MR^{2} = \tfrac32 MR^{2}$:

      $$
      T = \tfrac12 I_C\,\omega^{2} = \tfrac12 \cdot \tfrac32 MR^{2} \cdot \frac{v_G^{2}}{R^{2}} = \tfrac34 M v_G^{2} = \tfrac34 \cdot 4 \cdot 2^{2} = 12\ \text{J}
      $$

      Lo mismo.

      **Lo que dice el resultado.** La rotación es un tercio del total en
      cualquier disco macizo que ruede, sea cual sea su radio o su velocidad:
      $\tfrac14$ frente a $\tfrac34$ de $M v_G^{2}$. Un aro, con
      $I_G = MR^{2}$, la repartiría mitad y mitad, y a 2 m/s llevaría 16 J. Y
      el disco rodando guarda un 50 % más de energía que si deslizara sin
      girar a la misma velocidad.

  - id: ejma10-la-barra-que-gira-inclinada
    titulo: El momento que pide una barra que gira inclinada
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    antes:
      idea: |
        El momento de las fuerzas respecto del centro de masas es lo que
        cambia el momento angular del sólido. El momento angular se calcula
        con el tensor de inercia; en ejes principales, cada componente de la
        velocidad angular va con su momento de inercia. Un vector que gira
        cambia aunque su módulo no cambie.
      formula: |
        Con $\vec{H}_G$ escrito en unos ejes que giran con velocidad angular
        $\vec{\Omega}$:

        $$
        \sum\vec{M}_G = \frac{d\vec{H}_G}{dt}
        = \left(\frac{d\vec{H}_G}{dt}\right)_{\text{ejes}} + \vec{\Omega}\times\vec{H}_G,
        \qquad
        \vec{H}_G = I_1\,\omega_1\,\vec{e}_1 + I_2\,\omega_2\,\vec{e}_2 + I_3\,\omega_3\,\vec{e}_3
        $$

        Para una barra delgada de longitud L, respecto de un eje
        perpendicular a ella por su centro: $I = \tfrac{1}{12} M L^{2}$; a lo
        largo de ella, $I \approx 0$.
      reconocer: |
        Antes de calcular se mira cómo está la velocidad angular respecto de
        la barra.
    enunciado: |
      Una barra delgada y homogénea de 1 m y 2 kg gira con velocidad angular
      constante $\omega = 5\ \text{rad/s}$ alrededor de un eje vertical que pasa
      por su centro $G$, formando un ángulo constante de 30° con la horizontal.
      Calcular el momento que hay que aplicarle para mantener ese movimiento.
    pide: El momento necesario para que la barra siga girando así.
    pasos:
      - tipo: reconocer
        pregunta: |
          La velocidad angular es constante. ¿Hace falta algún momento?
        opciones:
          - texto: Sí, porque el momento angular no es vertical y su dirección gira con la barra
            correcta: true
            mensaje: |
              Eso es. $\vec{\omega}$ no va por una dirección principal de la
              barra, así que $\vec{H}_G$ no es paralelo a él. Su parte horizontal
              gira, y un vector que cambia de dirección tiene derivada:
              $\vec{\omega} \times \vec{H}_G$.
          - texto: No, porque con velocidad angular constante el momento angular no cambia
            mensaje: |
              El módulo no cambia, pero la dirección sí. $\vec{H}_G$ no es vertical,
              y al girar la barra su parte horizontal apunta cada vez a otro
              lado.
          - texto: Sí, el peso de la barra por su brazo
            mensaje: |
              El peso está aplicado en $G$, que está en el eje: no da momento
              respecto de $G$. El momento necesario es puramente dinámico.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **la barra sola, en el instante
          en que está en el plano del papel, con todas las acciones que
          actúan sobre ella y con su velocidad angular**. Sin escala.
        comprueba:
          - punto: |
              **El peso, Mg, vertical y hacia abajo, en G.**
            porque: |
              La barra es homogénea: su centro de masas es el centro.
          - punto: |
              **La fuerza del eje sobre la barra, en G.**
            porque: |
              El eje la sujeta por su centro, y G no se mueve.
          - punto: |
              **Un par del eje sobre la barra, M, de valor por calcular.**
            porque: |
              La barra va unida al eje en G, y una unión así puede transmitir
              una fuerza y un par.
          - punto: |
              **La velocidad angular ω, vertical, a lo largo del eje.**
            porque: |
              La barra gira alrededor del eje vertical, a 5 rad/s fijos.
        figura: |
          <svg viewBox="54 4 126 146" role="img" width="126" height="146" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">Sólido libre de la barra que gira inclinada alrededor de un eje vertical</title>
            <desc id="dsl-d">La barra, inclinada 30 grados sobre la horizontal, en el instante en que está en el plano del papel. Por su centro G pasa el eje vertical, a trazos, con la velocidad angular hacia arriba. Sobre la barra, su peso, vertical hacia abajo en G; la fuerza del eje en G, vertical hacia arriba; y el par del eje, M, de valor desconocido, dibujado como un giro alrededor de G.</desc>
            <defs>
              <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
              </marker>
              <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
              </marker>
              <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
              </marker>
            </defs>
            <path d="M66.5 114.6 L156.5 62.6 L153.5 57.4 L63.5 109.4 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M110 22 V150" fill="none" stroke="var(--ink)" stroke-width="1" stroke-dasharray="4 3"/>
            <line x1="110" y1="86" x2="172" y2="86" stroke="var(--faint)" stroke-width="0.7"/>
            <path d="M144 86 A34 34 0 0 0 139.4 69" fill="none" stroke="var(--ink)" stroke-width="0.9"/>
            <text x="150" y="80" font-size="10" fill="var(--ink)">30°</text>
            <path d="M99 66.9 A22 22 0 0 0 88.7 91.7" fill="none" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
            <text x="78" y="70" font-size="10" text-anchor="end" fill="var(--d2-tinta)">M</text>
            <line x1="110" y1="86" x2="110" y2="120" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
            <text x="116" y="124" font-size="10" text-anchor="start" fill="var(--flag)">Mg</text>
            <line x1="110" y1="86" x2="110" y2="52" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
            <text x="104" y="56" font-size="10" text-anchor="end" fill="var(--d2-tinta)">R</text>
            <line x1="110" y1="34" x2="110" y2="12" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
            <text x="116" y="22" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">ω</text>
            <circle cx="110" cy="86" r="2.4" fill="var(--ink)"/>
            <text x="116" y="98" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">G</text>
          </svg>

      - tipo: calcular
        titulo: El momento necesario
        pregunta: |
          ¿Cuánto vale el momento necesario, en N·m?
        respuesta:
          tipo: numero
          valor: '1.804'
          tolerancia: 0.01
          formato: un número, en N·m
        distractores:
          - valor: '0'
            mensaje: |
              Con $\vec{\omega}$ constante la derivada en ejes móviles es nula,
              pero falta el término $\vec{\omega} \times \vec{H}_G$ de la fórmula de
              Boure, que aquí no se anula.
          - valor: '3.608'
            mensaje: |
              Has multiplicado $\omega$ por el momento angular entero, 0,722. En
              $\vec{\omega} \times \vec{H}_G$ solo cuenta la parte de $\vec{H}_G$
              perpendicular a $\vec{\omega}$, la horizontal: 0,361.
        pista: |
          A lo largo de la barra $I \approx 0$; perpendicular a ella,
          $I = ML^{2}/12$. $\vec{H}_G$ es perpendicular a la barra y forma 30° con la
          vertical.
        desarrollo: |
          $$
          I_\perp = \frac{2 \cdot 1^{2}}{12} = 0{,}1667
          \qquad
          H_G = I_\perp\,\omega \sin 60° = 0{,}1667 \cdot 5 \cdot 0{,}866 = 0{,}722
          $$

          $$
          M = \omega \cdot H_G \sin 30° = 5 \cdot 0{,}361 = 1{,}804\ \text{N}\cdot\text{m}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: En ejes principales de la barra, a lo largo de ella $I \approx 0$ y perpendicular $I = ML^{2}/12 = 0{,}167$ kg·m².
          - texto: Solo la componente de $\vec{\omega}$ perpendicular a la barra da momento angular, así que $\vec{H}_G$ es perpendicular a la barra.
          - texto: 'Con $\omega$ constante, $d\vec{H}_G/dt = \vec{\omega} \times \vec{H}_G$, de módulo $5 \cdot 0{,}361 = 1{,}80$ N·m.'
          - texto: Como la velocidad angular es constante, no hace falta ningún momento.
            trampa: true
            mensaje: |
              La constancia de $\vec{\omega}$ no basta. $\vec{H}_G$ no es paralelo a
              $\vec{\omega}$, y su dirección gira: eso exige un momento, que es el
              que acaban haciendo los cojinetes.
    resolucion: |
      **1. Sólidos libres.** Es un problema de dinámica de un sólido que gira
      alrededor de un eje fijo: el dibujo lleva la barra sola, en el instante
      en que está en el plano del papel.

      <figure class="figura-examen">
      <svg viewBox="54 4 126 146" role="img" width="189" height="219" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">Sólido libre de la barra que gira inclinada alrededor de un eje vertical</title>
        <desc id="dsl-d">La barra, inclinada 30 grados sobre la horizontal, en el instante en que está en el plano del papel. Por su centro G pasa el eje vertical, a trazos, con la velocidad angular hacia arriba. Sobre la barra, su peso, vertical hacia abajo en G; la fuerza del eje en G, vertical hacia arriba; y el par del eje, M, de valor desconocido, dibujado como un giro alrededor de G.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M66.5 114.6 L156.5 62.6 L153.5 57.4 L63.5 109.4 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M110 22 V150" fill="none" stroke="var(--ink)" stroke-width="1" stroke-dasharray="4 3"/>
        <line x1="110" y1="86" x2="172" y2="86" stroke="var(--faint)" stroke-width="0.7"/>
        <path d="M144 86 A34 34 0 0 0 139.4 69" fill="none" stroke="var(--ink)" stroke-width="0.9"/>
        <text x="150" y="80" font-size="10" fill="var(--ink)">30°</text>
        <path d="M99 66.9 A22 22 0 0 0 88.7 91.7" fill="none" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="78" y="70" font-size="10" text-anchor="end" fill="var(--d2-tinta)">M</text>
        <line x1="110" y1="86" x2="110" y2="120" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
        <text x="116" y="124" font-size="10" text-anchor="start" fill="var(--flag)">Mg</text>
        <line x1="110" y1="86" x2="110" y2="52" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="104" y="56" font-size="10" text-anchor="end" fill="var(--d2-tinta)">R</text>
        <line x1="110" y1="34" x2="110" y2="12" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="116" y="22" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">ω</text>
        <circle cx="110" cy="86" r="2.4" fill="var(--ink)"/>
        <text x="116" y="98" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">G</text>
      </svg>
      <figcaption>

      La barra en el instante en que está en el papel. El eje la sujeta por G con una fuerza y un par.

      </figcaption>
      </figure>

      - **El peso**, Mg, en G, y **la fuerza del eje**, R, también en G. G no
        se mueve, así que $R = Mg$, y ninguna de las dos da momento respecto
        de G.
      - **El par del eje**, M, es lo único que puede cambiar el momento
        angular respecto de G.

      **2. Incógnitas.** El momento angular $\vec{H}_G$ y el par M.

      **3. Ecuaciones.** En ejes principales de la barra, a lo largo de ella
      $I \approx 0$ y perpendicular a ella
      $I_\perp = ML^{2}/12 = 0{,}1667\ \text{kg}\cdot\text{m}^{2}$. La
      velocidad angular, vertical, forma 60° con la barra, y solo su
      componente perpendicular a la barra da momento angular:

      $$
      H_G = I_\perp\,\omega\,\sin 60°
      $$

      $\vec{H}_G$ va perpendicular a la barra, en el plano del papel: forma
      30° con la vertical. Con ω constante y los ejes girando con la barra,
      $\vec{H}_G$ no cambia en ellos, y su derivada es solo el término del
      giro:

      $$
      M = \left|\vec{\omega}\times\vec{H}_G\right| = \omega\,H_G\,\sin 30°
      $$

      **4. Resultados.**

      $$
      H_G = 0{,}16667 \cdot 5 \cdot 0{,}86603 = 0{,}7217\ \text{kg}\cdot\text{m}^{2}/\text{s}
      $$

      $$
      M = 5 \cdot 0{,}7217 \cdot 0{,}5 = 1{,}804\ \text{N}\cdot\text{m}
      $$

      **El eje tiene que hacer sobre la barra un par de 1,804 N·m**,
      perpendicular al plano de la barra y del eje: en el dibujo, en sentido
      antihorario, hacia levantar la barra.

      **5. Comprobación.** Por las partículas, sin el momento angular. Un
      trozo dm a una distancia s de G, a lo largo de la barra, gira en un
      círculo horizontal de radio $s\cos 30°$, y para eso necesita una fuerza
      $dm\,\omega^{2}\,s\cos 30°$ hacia el eje. Su brazo respecto de G es la
      altura del trozo, $s\sin 30°$, y sumando los dos lados:

      $$
      M = \omega^{2}\sin 30°\cos 30°\int s^{2}\,dm = \omega^{2}\sin 30°\cos 30°\,\frac{ML^{2}}{12}
      $$

      $$
      M = 25 \cdot 0{,}5 \cdot 0{,}86603 \cdot 0{,}16667 = 1{,}804\ \text{N}\cdot\text{m}
      $$

      Lo mismo.

      **Lo que dice el resultado.** Sin ese par, las fuerzas centrífugas de
      las dos mitades tumbarían la barra hacia la horizontal, donde ya no
      haría falta ninguno. El par crece con $\omega^{2}$ y con
      $\sin 2\theta$: es máximo con la barra a 45°, y nulo con la barra
      horizontal o vertical, que son direcciones principales. Ese par lo
      hacen los apoyos del eje, y es la clase de reacción dinámica que el
      tema 11 aprende a calcular y a eliminar equilibrando el rotor.

  - id: ejma10-col101-el-disco-de-la-horquilla
    titulo: El disco de la horquilla, su energía cinética y su momento angular en O
    fuente: >-
      Ejercicio 10.1 · Tema 10, «Dinámica del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo, y también se ha usado la
      resolución oficial del curso para comprobarlo. Los valores numéricos de
      las casillas son nuestros y se declaran en cada pregunta.
    nivel: practica
    antes:
      idea: |
        Cuando un sólido gira sobre otro que a su vez gira, su velocidad
        angular es la suma de todos los giros. La energía cinética y el
        momento angular de un sólido salen de su masa, de la velocidad de su
        centro de masas y de su tensor de inercia en el centro de masas, que
        en unos ejes principales es diagonal.
      formula: |
        Con $\mathbf{I}_G$ el tensor de inercia en G:

        $$
        \vec{\omega} = \sum\vec{\omega}_i,
        \qquad
        T = \tfrac12 m v_G^{2} + \tfrac12\,\vec{\omega}\cdot\mathbf{I}_G\,\vec{\omega},
        \qquad
        \vec{H}_O = \mathbf{I}_G\,\vec{\omega} + \overrightarrow{OG}\times m\vec{v}_G
        $$
      reconocer: |
        Antes de calcular se mira qué ejes del disco son de simetría.
    enunciado: |
      La figura muestra un disco (d) de masa $m$ y radio $r$, que gira con
      respecto a una horquilla (h) con velocidad angular $p$. Esta horquilla
      conecta con un eje vertical y posee dos movimientos angulares
      $\omega_{1}$ y $\omega_{2}$, con los sentidos mostrados. Calcular en el
      instante representado, donde el plano del disco $xy$ coincide con el
      plano $XY$:

      a) La energía cinética $T$ del disco.

      b) Momento angular del disco respecto del punto $O$.

