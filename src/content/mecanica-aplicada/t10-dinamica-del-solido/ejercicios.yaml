      - **En A y en B**, las reacciones de los cojinetes perpendiculares al
        eje, $A_y$, $A_z$, $B_y$ y $B_z$, y a lo largo del eje, $A_x$.
      - **En E**, el peso del disco, Mg; la barra y el eje se toman sin masa.
      - **Alrededor del eje**, el par del motor, $M_m$, que mantiene
        $\omega_2$ constante.

      **2. Incógnitas.** La aceleración angular del disco, la velocidad y la
      aceleración de E, las cinco componentes de las reacciones y el par del
      motor.

      **3. Ecuaciones.** En unos ejes que acompañan al conjunto, con
      $\vec{\Omega} = \omega_{2}\vec{e}_1$, la velocidad angular del disco
      tiene componentes constantes, y E gira con el conjunto alrededor del
      eje, con $\overrightarrow{CE} = -L\vec{e}_2 + L\vec{e}_3$:

      $$
      \vec{\omega}_d = \omega_{2}\vec{e}_1 + \omega_{1}\vec{e}_3,
      \qquad
      \vec{\alpha}_d = \vec{\Omega}\times\vec{\omega}_d,
      \qquad
      \vec{v}_E = \vec{\Omega}\times\overrightarrow{CE},
      \qquad
      \vec{a}_E = \vec{\Omega}\times\vec{v}_E
      $$

      El disco es de revolución alrededor de DE, así que en esos ejes su
      tensor de inercia no cambia, con $I_1 = I_2 = \tfrac14 MR^{2}$ e
      $I_3 = \tfrac12 MR^{2}$. El momento angular en $G = E$ tiene componentes
      constantes, y su derivada es solo el término del giro de los ejes:

      $$
      \vec{H}_G = \tfrac14 MR^{2}\omega_{2}\vec{e}_1 + \tfrac12 MR^{2}\omega_{1}\vec{e}_3,
      \qquad
      \frac{d\vec{H}_G}{dt} = \vec{\Omega}\times\vec{H}_G
      $$

      $$
      \sum\vec{F} = M\vec{a}_E,
      \qquad
      \sum\vec{M}_G = \frac{d\vec{H}_G}{dt}
      $$

      **4. Resultados.** a) La aceleración angular:

      $$
      \vec{\alpha}_d = \omega_{2}\vec{e}_1\times\left(\omega_{2}\vec{e}_1 + \omega_{1}\vec{e}_3\right) = -\omega_{1}\omega_{2}\,\vec{e}_2
      $$

      b) El punto E:

      $$
      \vec{v}_E = -\omega_{2}L\,\vec{e}_2 - \omega_{2}L\,\vec{e}_3,
      \qquad
      \vec{a}_E = \omega_{2}^{2}L\,\vec{e}_2 - \omega_{2}^{2}L\,\vec{e}_3
      $$

      La aceleración es centrípeta pura y apunta al eje AB, del que E dista
      $L\sqrt{2}$:

