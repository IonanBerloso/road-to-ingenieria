      $$
      \vec{\omega} = \dot{\theta}\,\vec{e}_1 + \dot{\psi}\operatorname{sen}\theta\,\vec{e}_2 + \dot{\psi}\cos\theta\,\vec{e}_3
      $$

      Para una barra delgada, $I_{O1} = I_{O2} = ML^{2}/12$ e $I_{O3} = 0$.
      Los ejes giran con la barra, $\vec{\Omega} = \vec{\omega}$, así que

      $$
      \vec{M}_O = \frac{d\vec{H}_O}{dt} = \left(\frac{d\vec{H}_O}{dt}\right)_{\text{ejes}} + \vec{\omega}\times\vec{H}_O
      $$

      **4. Resultados.** a) La tercera componente de $\vec{\omega}$ no
      aporta nada, porque a lo largo de la barra el momento de inercia es
      nulo:

      $$
      \vec{H}_O = \frac{ML^{2}}{12}\,\dot{\theta}\,\vec{e}_1 + \frac{ML^{2}}{12}\,\dot{\psi}\operatorname{sen}\theta\,\vec{e}_2
      $$

      b) La parte de las componentes y la del giro de los ejes:

      $$
      \left(\frac{d\vec{H}_O}{dt}\right)_{\text{ejes}} = \frac{ML^{2}}{12}\left[\ddot{\theta}\,\vec{e}_1 + \left(\ddot{\psi}\operatorname{sen}\theta + \dot{\psi}\dot{\theta}\cos\theta\right)\vec{e}_2\right],
      \qquad
      \vec{\omega}\times\vec{H}_O = \frac{ML^{2}}{12}\left(-\dot{\psi}^{2}\operatorname{sen}\theta\cos\theta\,\vec{e}_1 + \dot{\psi}\dot{\theta}\cos\theta\,\vec{e}_2\right)
      $$

      $$
      \vec{M}_O = \frac{ML^{2}}{12}\left(\ddot{\theta} - \dot{\psi}^{2}\operatorname{sen}\theta\cos\theta\right)\vec{e}_1 + \frac{ML^{2}}{12}\left(\ddot{\psi}\operatorname{sen}\theta + 2\dot{\psi}\dot{\theta}\cos\theta\right)\vec{e}_2
      $$

      Son los resultados de la colección. Con los valores de prueba,
      $M = 2\ \text{kg}$, $L = 1{,}2\ \text{m}$, $\theta = 60^{\circ}$,
      $\dot{\theta} = 2$, $\ddot{\theta} = 0$, $\dot{\psi} = 3$ y
      $\ddot{\psi} = 1$, con $ML^{2}/12 = 0{,}24$:
      $H_{O1} = 0{,}24 \cdot 2 = 0{,}48$ y
      $H_{O2} = 0{,}24 \cdot 3 \cdot 0{,}8660 = 0{,}6235\ \text{kg}\cdot\text{m}^{2}/\text{s}$;
      $M_{O1} = 0{,}24 \cdot (0 - 9 \cdot 0{,}8660 \cdot 0{,}5) = -0{,}9353$ y
      $M_{O2} = 0{,}24 \cdot (0{,}8660 + 6) = 1{,}6478\ \text{N}\cdot\text{m}$.

      **5. Comprobación.** Con otros ejes: los del plano π, que solo giran
      con él, $\vec{\Omega} = \dot{\psi}\,\vec{k}$. Son $\vec{e}_1$, el mismo,
      la vertical $\vec{k}$ y la horizontal del plano hacia el lado de A,
      $\vec{u}$, con $\vec{e}_2 = \operatorname{sen}\theta\,\vec{k} - \cos\theta\,\vec{u}$.
      En ellos las componentes de $\vec{H}_O$ cambian también con θ:

      $$
      \vec{H}_O = \frac{ML^{2}}{12}\left(\dot{\theta}\,\vec{e}_1 + \dot{\psi}\operatorname{sen}^{2}\theta\,\vec{k} - \dot{\psi}\operatorname{sen}\theta\cos\theta\,\vec{u}\right)
      $$

      Derivando las componentes y sumando
      $\dot{\psi}\,\vec{k}\times\vec{H}_O$, con
      $\vec{k}\times\vec{e}_1 = -\vec{u}$ y $\vec{k}\times\vec{u} = \vec{e}_1$:

      $$
      \vec{M}_O = \frac{ML^{2}}{12}\left[\left(\ddot{\theta} - \dot{\psi}^{2}\operatorname{sen}\theta\cos\theta\right)\vec{e}_1 + \left(\ddot{\psi}\operatorname{sen}^{2}\theta + 2\dot{\psi}\dot{\theta}\operatorname{sen}\theta\cos\theta\right)\vec{k} - \left(\ddot{\psi}\operatorname{sen}\theta\cos\theta + 2\dot{\psi}\dot{\theta}\cos^{2}\theta\right)\vec{u}\right]
      $$

      La de $\vec{e}_1$ es la misma. Con los valores de prueba, la vertical,
      $0{,}24 \cdot (0{,}75 + 5{,}1962) = 1{,}4271$, y la horizontal,
      $-0{,}24 \cdot (0{,}4330 + 3) = -0{,}8239$. Llevadas a $\vec{e}_2$:
      $1{,}4271 \cdot 0{,}8660 + 0{,}8239 \cdot 0{,}5 = 1{,}6478\ \text{N}\cdot\text{m}$,
      y a lo largo de la barra no queda nada. Lo mismo.

      **Lo que dice el resultado.** Todo $\vec{M}_O$ lo hacen las reacciones:
      el peso está aplicado en O. El 2 de $\vec{e}_2$ sale de dos caminos
      distintos, derivar la componente y el giro de los ejes, que dan el
      mismo término; quien solo derive las componentes se deja la mitad. Y la
      componente vertical de la comprobación es
      $\tfrac{d}{dt}\left(\tfrac{ML^{2}}{12}\,\dot{\psi}\operatorname{sen}^{2}\theta\right)$,
      la derivada del momento angular alrededor de la vertical. Si el plano
      no tuviera masa ni motor y la barra girase libre en él, nada daría
      momento según $\vec{e}_1$ ni alrededor de la vertical:
      $\ddot{\theta} = \dot{\psi}^{2}\operatorname{sen}\theta\cos\theta$, y
      $\dot{\psi}\operatorname{sen}^{2}\theta$ se conservaría. Al acercarse la
      barra a la vertical, el plano giraría más deprisa.
