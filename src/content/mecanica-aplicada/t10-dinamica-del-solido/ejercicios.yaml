      <figcaption>

      El disco y el eje AB, sin los apoyos. A lo largo del eje solo sujeta A.

      </figcaption>
      </figure>

      - **En A**, las tres componentes de la reacción, $A_x$, $A_y$ y $A_z$.
      - **En B**, solo $B_y$ y $B_z$: B no soporta esfuerzo según X.
      - **En C**, el peso, $mg = 0{,}285 \cdot 9{,}81 = 2{,}796\ \text{N}$; el
        eje se toma sin masa.

      **2. Incógnitas.** Las cinco componentes de las reacciones, separadas
      en su parte estática, la que queda con todo parado, y su parte
      dinámica, la que añade el movimiento; y el valor máximo de $\omega_{2}$
      con el que la dinámica no llega a 1,1 N.

      **3. Ecuaciones.** C está sobre el eje AB y no se mueve:
      $\vec{a}_G = \vec{0}$. Se toman unos ejes que giran con el eje AB, con
      $\vec{\Omega} = \omega_{2}\vec{e}_1$: $\vec{e}_1$ a lo largo de AB,
      hacia B, $\vec{e}_3$ perpendicular al disco y $\vec{e}_2$ en su plano,
      perpendicular al eje; en el instante del dibujo coinciden con X, Y y Z.
      El disco es de revolución alrededor de $\vec{e}_3$: en esos ejes su
      tensor de inercia no cambia aunque el disco gire dentro de ellos. Visto
      de frente gira en el sentido de las agujas del reloj, así que su
      velocidad angular es $\vec{\omega}_d = \omega_{2}\vec{e}_1 - \omega_{1}\vec{e}_3$,
      y el momento angular tiene componentes constantes:

      $$
      \vec{H}_G = I_{Gx}\,\omega_{2}\,\vec{e}_1 - I_{Gz}\,\omega_{1}\,\vec{e}_3,
      \qquad
      \frac{d\vec{H}_G}{dt} = \omega_{2}\vec{e}_1\times\vec{H}_G = I_{Gz}\,\omega_{1}\,\omega_{2}\,\vec{e}_2
      $$

      Con A en $-d\,\vec{e}_1$ y B en $+d\,\vec{e}_1$ respecto de C, y
      $d = 0{,}1\ \text{m}$, las fuerzas y los momentos respecto de C en el
      instante del dibujo:

      $$
      A_x = 0,
      \qquad
      A_y + B_y - mg = 0,
      \qquad
      A_z + B_z = 0
      $$

      $$
      d\,(A_z - B_z) = I_{Gz}\,\omega_{1}\,\omega_{2},
      \qquad
      d\,(B_y - A_y) = 0
      $$

      **4. Resultados.** Las estáticas, $A_y = B_y = mg/2 = 1{,}398\ \text{N}$,
      verticales siempre. Las dinámicas, perpendiculares al disco y girando
      con él:

      $$
      A_z = -B_z = \frac{I_{Gz}\,\omega_{1}\,\omega_{2}}{2d} \le 1{,}1\ \text{N}
      \quad\Longrightarrow\quad
      \omega_{2} \le \frac{2{,}2\,d}{I_{Gz}\,\omega_{1}}
      $$

      - **El momento de inercia del giro propio:**
        $I_{Gz} = 0{,}5 \cdot 0{,}285 \cdot 0{,}0025 = 0{,}00035625\ \text{kg}\cdot\text{m}^{2}$.
      - **El giro propio en rad/s:**
        $\omega_{1} = 750 \cdot 6{,}2832/60 = 78{,}54\ \text{rad/s}$.
      - **La condición:**
        $\omega_{2} \le 0{,}22/0{,}0279799 = 7{,}8628\ \text{rad/s}$, o
        $7{,}8628 \cdot 60/6{,}2832 = 75{,}08\ \text{rpm}$.

      Es el resultado que publica la colección, 7,86 rad/s = 75 rpm.

      **5. Comprobación.** Sin el momento angular: partícula a partícula. En
      los ejes que giran con AB, una partícula del disco en $(x, y)$ sobre su
      plano tiene la velocidad del giro propio,
      $\vec{v}_r = \omega_{1}\,(y\,\vec{e}_1 - x\,\vec{e}_2)$, y el giro de
      los ejes le añade la aceleración de Coriolis:

      $$
      \vec{a}_{cor} = 2\,\omega_{2}\vec{e}_1\times\vec{v}_r = -2\,\omega_{1}\,\omega_{2}\,x\,\vec{e}_3
      $$

      Las demás partes de su aceleración están en el plano del disco y van
      hacia C o hacia el eje AB; por simetría, sus momentos se anulan entre
      sí. La de Coriolis es perpendicular al disco, hacia dentro del lado de
      B y hacia fuera del lado de A:

