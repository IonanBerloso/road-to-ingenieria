      <figcaption>

      La posición del ángulo φ. Las dos barras miden L de D a C y de C a A: el triángulo DCA es isósceles.

      </figcaption>
      </figure>

      - **El triángulo DCA es isósceles**, con DC = CA = L: la deslizadera A
        queda $2L\cos\phi$ por debajo de D, a $3L - 2L\cos\phi$ del suelo.
      - **El muelle**, de longitud natural 3L, mide eso: está comprimido
        $\delta = 2L\cos\phi$.
      - **Los centros de masas**, C para la barra larga y E, a media altura
        entre A y C, para la corta: $h_C = 3L - L\cos\phi$ y
        $h_E = 3L - \tfrac32 L\cos\phi$.

      **2. Incógnitas.** La energía potencial V del sistema y las energías
      cinéticas $T_{CD}$ y $T_{AB}$ de las dos barras, en función de φ,
      $\dot{\phi}$ y ω.

      **3. Ecuaciones.** La energía potencial, con el suelo como referencia:

      $$
      V = 2M\,g\,h_C + M\,g\,h_E + \tfrac12\,\frac{Mg}{L}\,\delta^{2}
      $$

      La barra larga tiene un punto fijo, D, y su energía es toda de giro
      alrededor de él. En ejes ligados a ella, con $\vec{e}_1$ a lo largo de
      la barra, $\vec{e}_3$ perpendicular al plano del eje y $\vec{e}_2$ en ese
      plano, la velocidad angular suma el giro del eje y el de φ:

      $$
      \vec{\omega}_{CD} = -\omega\cos\phi\,\vec{e}_1 + \omega\operatorname{sen}\phi\,\vec{e}_2 + \dot{\phi}\,\vec{e}_3,
      \qquad
      I_{D2} = I_{D3} = \tfrac13\,(2M)(2L)^{2} = \tfrac83 ML^{2}
      $$

      La barra corta no tiene ningún punto fijo: A sube y baja por el eje, y
      el eje gira. Su energía es la de su centro de masas E más la del giro
      alrededor de él, con $I_E = ML^{2}/12$ en las dos direcciones
      perpendiculares a la barra. E está a $\tfrac12 L\operatorname{sen}\phi$
      del eje, y en el plano del eje sus coordenadas cambian con φ:

      $$
      v_E^{2} = \left(\tfrac12 L\operatorname{sen}\phi\;\omega\right)^{2} + \left(\tfrac12 L\cos\phi\;\dot{\phi}\right)^{2} + \left(\tfrac32 L\operatorname{sen}\phi\;\dot{\phi}\right)^{2}
      $$

      **4. Resultados.** a) La energía potencial:

      $$
      V = 2MgL(3-\cos\phi) + MgL\left(3-\tfrac32\cos\phi\right) + 2MgL\cos^{2}\phi
      = 9MgL - \tfrac72 MgL\cos\phi + 2MgL\cos^{2}\phi
      $$

      b) La barra larga, sin la componente a lo largo de ella, que encuentra
      un momento de inercia nulo:

      $$
      T_{CD} = \tfrac12 \cdot \tfrac83 ML^{2}\left(\omega^{2}\operatorname{sen}^{2}\phi + \dot{\phi}^{2}\right)
      = \tfrac43 ML^{2}\left(\omega^{2}\operatorname{sen}^{2}\phi + \dot{\phi}^{2}\right)
      $$

      c) La barra corta. Su velocidad angular tiene, perpendicular a ella,
      $\omega\operatorname{sen}\phi$ y $\dot{\phi}$, y
      $v_E^{2} = \tfrac14\omega^{2}L^{2}\operatorname{sen}^{2}\phi + \dot{\phi}^{2}L^{2}\left(\tfrac14 + 2\operatorname{sen}^{2}\phi\right)$:

      $$
      T_{AB} = \tfrac12 M v_E^{2} + \tfrac{1}{24}ML^{2}\left(\omega^{2}\operatorname{sen}^{2}\phi + \dot{\phi}^{2}\right)
      = \tfrac16 ML^{2}\left[\omega^{2}\operatorname{sen}^{2}\phi + \dot{\phi}^{2}\left(1 + 6\operatorname{sen}^{2}\phi\right)\right]
      $$

      **a) y b) coinciden con los publicados; c) no.** Con los valores de
      prueba, $M = L = 1$, $\phi = 30^{\circ}$, $\dot{\phi} = 2$ y
      $\omega = 3$ rad/s: $V = 88{,}290 - 29{,}735 + 14{,}715 = 73{,}270$ J,
      $T_{CD} = 8{,}333$ J y $T_{AB} = 2{,}042$ J.

      El apartado c) impreso en la colección dice
      $\dot{\phi}^{2}(1 + \operatorname{sen}2\phi)$ donde de los datos sale
      $\dot{\phi}^{2}(1 + 6\operatorname{sen}^{2}\phi)$; con esos valores daría
      1,619 J en vez de 2,042 J. La propia resolución oficial escribe en su
      penúltima línea los tres sumandos correctos y solo al encuadrarlos pierde
      un $\operatorname{sen}^{2}\phi$, así que lo que falla es el paso a limpio,
      no el planteamiento.

      **5. Comprobación.** b) por König, sin el punto fijo: el centro C de la
      barra larga va a $L\dot{\phi}$ en el plano del eje y a
      $\omega L\operatorname{sen}\phi$ perpendicular a él, y su momento de
      inercia por C es $\tfrac{1}{12}(2M)(2L)^{2} = \tfrac23 ML^{2}$. Con los
      valores de prueba, $v_C^{2} = 4 + 9 \cdot 0{,}25 = 6{,}25$:

      $$
      T_{CD} = \tfrac12 \cdot 2 \cdot 6{,}25 + \tfrac12 \cdot \tfrac23 \cdot 6{,}25 = 6{,}25 + 2{,}0833 = 8{,}333\ \text{J}
      $$

      c) con la velocidad de E por el centro instantáneo, sin derivar su
      posición. En el plano del eje, con solo $\dot{\phi}$, A sube por el eje
      y C se mueve perpendicular a DC: las perpendiculares a las dos
      velocidades se cortan en B, el extremo de la barra larga, que está a la
      altura de A.

      <figure class="figura-examen">
      <svg viewBox="-4 4 170 130" role="img" width="255" height="195" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">Velocidades en el plano de las barras, con su centro instantáneo</title>
        <desc id="dsl-d">Las dos barras en el plano que gira con el eje, con solo la velocidad que da el cambio del ángulo φ. La deslizadera A sube por el eje; C se mueve perpendicular a DC. Las perpendiculares a las dos velocidades se cortan en B, el extremo de la barra larga, que es el centro instantáneo de la barra corta: E, su punto medio, se mueve perpendicular a la recta BE. A trazos tenues, las rectas de B a A, a C y a E.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
