    pide: Las reacciones estáticas y las dinámicas en los dos cojinetes, en newtons.
    pasos:
      - tipo: reconocer
        pregunta: |
          De los tres momentos de inercia que dan los datos, ¿cuál entra en el
          par que tienen que soportar los cojinetes?
        opciones:
          - texto: Solo I_Gy, el del eje de giro propio del cilindro
            correcta: true
            mensaje: |
              Eso es. $\vec{H}_G = I_{Gy}\omega_{y}\vec{e}_2 + I_{Gz}\omega_{z}\vec{e}_3$,
              y al hacer $\vec{\Omega}\times\vec{H}_G$ con
              $\vec{\Omega} = \omega_{z}\vec{e}_3$ el término de $\vec{e}_3$ se
              anula por ser paralelo. Solo sobrevive el de $I_{Gy}$.
          - texto: Solo I_Gz, el del eje vertical alrededor del que gira el bastidor
            mensaje: |
              Esa componente de $\vec{H}_G$ va justo en la dirección de
              $\vec{\Omega}$, así que su producto vectorial es nulo y no
              aparece en $d\vec{H}_G/dt$. El dato de $I_{Gz}$ sobra en este
              problema.
          - texto: Los tres, porque el tensor entero multiplica a la velocidad angular
            mensaje: |
              El tensor entero se usa para calcular $\vec{H}_G$, sí, pero
              $I_{Gx}$ no entra porque $\omega_{x} = 0$, e $I_{Gz}$ desaparece
              al hacer el producto vectorial. Solo queda $I_{Gy}$.
          - texto: Ninguno, porque con velocidades angulares constantes no hay par
            mensaje: |
              Las componentes de $\vec{H}_G$ son constantes, pero están escritas
              en unos ejes que giran. La fórmula de Boure añade
              $\vec{\Omega}\times\vec{H}_G$, que aquí no se anula.

      - tipo: calcular
        titulo: La reacción estática
        pregunta: |
          Con el conjunto parado, ¿cuánto vale la reacción vertical en cada
          apoyo, en newtons?
        respuesta:
          tipo: numero
          valor: '98.1'
          tolerancia: 0.1
          formato: un número, en N
        distractores:
          - valor: '196.2'
            mensaje: |
              Ese es el peso entero del cilindro. Lo aguantan dos apoyos
              colocados simétricamente respecto de $G$, así que cada uno se
              lleva la mitad.
          - valor: '20'
            mensaje: |
              Esos son los kilogramos, no los newtons. Una reacción es una
              fuerza: hay que multiplicar la masa por $g$.
          - valor: '49.05'
            mensaje: |
              Has repartido el peso entre cuatro. Los apoyos son dos, $A$ y
              $B$, y por simetría se llevan la mitad cada uno.
        pista: |
          Parado no hay más fuerzas que el peso y las dos reacciones, y $G$
          está justo en el medio.
        desarrollo: |
          $$
          A_z = B_z = \frac{Mg}{2} = \frac{20 \cdot 9{,}81}{2} = 98{,}1\ \text{N}
          $$

      - tipo: calcular
        titulo: La reacción dinámica
        pregunta: |
          ¿Cuánto vale la parte dinámica de la reacción vertical en cada apoyo,
          en newtons?
        respuesta:
          tipo: numero
          valor: '234.4'
          tolerancia: 0.5
          formato: un número, en N
        distractores:
          - valor: '468.75'
            mensaje: |
              Ese es el par giroscópico dividido entre la distancia de un apoyo
              a $G$, $d$. Las dos fuerzas forman una pareja separada $2d$, así
              que hay que dividir entre $2d$.
          - valor: '117.19'
            mensaje: |
              Has tomado $d = 0{,}5\ \text{m}$, que es la distancia entre los
              dos apoyos. La cota de la figura, 250 mm, es la que va de cada
              apoyo a $G$.
          - valor: '598.1'
            mensaje: |
              Has usado $I_{Gx} = I_{Gz} = 0{,}1595$. El momento de inercia que
              entra es el del eje de giro propio, $I_{Gy} = 0{,}0625$.
        pista: |
          $\left|d\vec{H}_G/dt\right| = I_{Gy}\,\omega_{y}\,\omega_{z}$, y ese
          par lo equilibra una pareja de fuerzas verticales separadas $2d$, con
          $d = 0{,}25\ \text{m}$.
        desarrollo: |
          $$
          \frac{d\vec{H}_G}{dt} = -I_{Gy}\,\omega_{y}\,\omega_{z}\,\vec{e}_1 = -117{,}19\ \text{N}\cdot\text{m}\ \vec{e}_1
          $$

          $$
          \frac{I_{Gy}\,\omega_{y}\,\omega_{z}}{2d} = \frac{0{,}0625 \cdot 75 \cdot 25}{2 \cdot 0{,}25} = 234{,}4\ \text{N}
          $$

      - tipo: calcular
        titulo: La reacción total en A
        pregunta: |
          Sumando las dos, ¿cuánto vale la reacción vertical total en el apoyo
          $A$, aquel en el que la parte dinámica suma, en newtons?
        respuesta:
          tipo: numero
          valor: '332.5'
          tolerancia: 0.5
          formato: un número, en N
        distractores:
          - valor: '-136.3'
            mensaje: |
              Ese es el valor en el otro apoyo, donde la parte dinámica resta:
              sale negativa, es decir, que $B$ tiene que tirar del eje hacia
              abajo en vez de empujarlo hacia arriba.
          - valor: '136.3'
            mensaje: |
              Has restado la parte dinámica en $A$ en lugar de sumarla, y
              además has perdido el signo. En $A$ las dos se suman.
          - valor: '430.6'
            mensaje: |
              Has sumado el peso entero, 196,2 N, en vez de la mitad que le
              toca a cada apoyo.
        pista: |
          Las dos partes se superponen: la estática, $Mg/2$, y la dinámica,
          $I_{Gy}\omega_{y}\omega_{z}/(2d)$.
        desarrollo: |
          $$
          A_z = \frac{Mg}{2} + \frac{I_{Gy}\omega_{y}\omega_{z}}{2d} = 98{,}1 + 234{,}4 = 332{,}5\ \text{N}
          $$

          $$
          B_z = \frac{Mg}{2} - \frac{I_{Gy}\omega_{y}\omega_{z}}{2d} = 98{,}1 - 234{,}4 = -136{,}3\ \text{N}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: '$G$ está sobre el eje vertical y no se mueve, así que $\vec{a}_G = \vec{0}$ y las tres ecuaciones de fuerzas solo hablan del peso.'
          - texto: 'En ejes principales del cilindro, $\vec{H}_G = I_{Gy}\omega_{y}\vec{e}_2 + I_{Gz}\omega_{z}\vec{e}_3$, con las dos componentes constantes.'
          - texto: 'Su derivada es solo $\vec{\Omega}\times\vec{H}_G = -I_{Gy}\omega_{y}\omega_{z}\vec{e}_1$, perpendicular a los dos ejes de giro.'
          - texto: 'Ese par va según $\vec{e}_2$, la dirección del eje del cilindro, así que lo equilibran fuerzas a lo largo del propio eje.'
            trampa: true
            mensaje: |
              El producto vectorial $\vec{\Omega}\times\vec{H}_G$ es
              perpendicular a los dos vectores, así que va según $\vec{e}_1$,
              no según $\vec{e}_2$. Y un par según $\vec{e}_1$ lo equilibran
              fuerzas **verticales** en $A$ y $B$, que es por lo que las
              reacciones dinámicas salen verticales.
    resolucion: |
      **El sólido.** El centro de gravedad $G$ está en el cruce de los dos ejes
      de giro y no se mueve: es punto fijo, $\vec{a}_G = \vec{0}$, y las
      ecuaciones de fuerzas se reducen a repartir el peso. Toda la gracia está
      en el momento.

      **El momento angular y su derivada.** La velocidad angular del cilindro es
      $\vec{\omega} = \omega_{y}\vec{e}_2 + \omega_{z}\vec{e}_3$, y en ejes
      principales

      $$
      \vec{H}_G = I_{Gy}\,\omega_{y}\,\vec{e}_2 + I_{Gz}\,\omega_{z}\,\vec{e}_3
      $$

      Como el cilindro es de revolución, basta con que los ejes acompañen al
      bastidor —$\vec{\Omega} = \omega_{z}\vec{e}_3$— para que el tensor no
      cambie. Las dos componentes son constantes, así que la derivada es solo
      el término de Boure:

      $$
      \frac{d\vec{H}_G}{dt} = \vec{\Omega}\times\vec{H}_G = -I_{Gy}\,\omega_{y}\,\omega_{z}\,\vec{e}_1
      = -117{,}19\ \text{N}\cdot\text{m}\,\vec{e}_1
      $$

      **Las reacciones.** Ese par lo equilibra una pareja de fuerzas verticales
      en $A$ y $B$, separadas $2d = 0{,}5\ \text{m}$:

      $$
      A_z = \frac{Mg}{2} + \frac{I_{Gy}\omega_{y}\omega_{z}}{2d}
      \qquad
      B_z = \frac{Mg}{2} - \frac{I_{Gy}\omega_{y}\omega_{z}}{2d}
      $$

      Con los datos: estáticas $A_z = B_z = 98{,}1\ \text{N}$; dinámicas
      $\pm 234{,}4\ \text{N}$; totales $A_z = 332{,}5\ \text{N}$ y
      $B_z = -136{,}3\ \text{N}$. Las tres cifras coinciden con las que publica
      la colección.

      **Lo que hay que llevarse.** La parte dinámica es aquí **2,4 veces** el
      peso entero del cilindro, y sale de un giro perfectamente uniforme. Por
      eso a un rotor que además cabecea no se le dimensionan los cojinetes con
      la estática: es el término $\vec{\Omega}\times\vec{H}_G$ el que los
      rompe. Y fíjate en que $I_{Gz} = 0{,}1595$ no se usa en ningún sitio: el
      enunciado lo da, pero su componente de $\vec{H}_G$ es paralela a
      $\vec{\Omega}$ y desaparece en el producto vectorial.
  - id: ejma10-col105-la-velocidad-maxima-del-eje-ab
    titulo: La velocidad angular máxima para no pasarse de reacción dinámica
    fuente: >-
      Ejercicio 10.5 · Tema 10, «Dinámica del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo, y también se ha usado la
      resolución oficial del curso para comprobarlo.
    nivel: practica
    enunciado: |
      Un disco de masa 0,285 kg gira con velocidad angular constante
      $\omega_{1} = 750\ \text{rpm}$. La velocidad angular del eje AB es
      constante $\omega_{2}$.

      Calcular la velocidad angular máxima $\omega_{2}$ para que las reacciones
      dinámicas en $A$ y $B$ sean inferiores a 1,1 N. El apoyo $B$ no soporta
      esfuerzo en la dirección $X$.

