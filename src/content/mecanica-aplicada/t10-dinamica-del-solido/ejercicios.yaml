    pide: El valor de la velocidad angular que mantiene la placa a 40 grados y el intervalo que la mantiene vertical.
    pasos:
      - tipo: reconocer
        pregunta: |
          Los ejes de la placa son sus ejes de simetría. ¿Cuánto valen sus
          momentos de inercia en el centro de gravedad?
        opciones:
          - texto: ma²/12 en los dos ejes del plano de la placa y ma²/6 en el perpendicular
            correcta: true
            mensaje: |
              Eso es, y la diferencia entre ellos es la clave del problema: el
              par que endereza la placa sale de
              $(I_{Gx} - I_{Gy})\,\omega^{2}\operatorname{sen}\beta\cos\beta$, que
              vale $-\tfrac{1}{12}ma^{2}\omega^{2}\operatorname{sen}\beta\cos\beta$.
              Si los tres fueran iguales, la placa no se movería.
          - texto: ma²/6 en los dos del plano y ma²/12 en el perpendicular
            mensaje: |
              Están cambiados. El perpendicular al plano es siempre la suma de
              los otros dos, por el teorema de los ejes perpendiculares:
              $ma^{2}/12 + ma^{2}/12 = ma^{2}/6$.
          - texto: Los tres valen ma²/12, porque la placa es homogénea
            mensaje: |
              Con los tres iguales el tensor sería esférico, $\vec{H}$ iría
              siempre con $\vec{\omega}$ y no habría par que levantase la
              placa. La diferencia entre ellos es justo lo que produce el
              efecto.
          - texto: ma²/3 en los dos del plano, como una barra por su extremo
            mensaje: |
              $ma^{2}/3$ es respecto de un borde, no del centro de gravedad.
              Aquí los ejes pasan por $G$, y Steiner descuenta
              $m(a/2)^{2}$.

      - tipo: calcular
        titulo: La velocidad angular que mantiene los 40 grados
        pregunta: |
          Con $a = 0{,}45\ \text{m}$ y $g = 9{,}81\ \text{m/s}^{2}$, ¿cuánto
          vale $\omega$ para que $\beta = 40^{\circ}$ se mantenga constante, en
          rad/s?
        respuesta:
          tipo: numero
          valor: '7.13'
          tolerancia: 0.03
          formato: un número, en rad/s
        distractores:
          - valor: '10.09'
            mensaje: |
              Has cambiado de sitio los momentos de inercia de la placa: con
              $I_{Gx}$ y $I_{Gy}$ intercambiados el coeficiente pasa de
              $\tfrac32$ a 3 dentro de la raíz.
          - valor: '14.27'
            mensaje: |
              Te has dejado la aceleración del centro de gravedad. $G$ no está
              en el eje de giro: describe una circunferencia de radio
              $\tfrac{a}{2}\cos\beta$, y esa fuerza centrífuga es la mitad del
              efecto que levanta la placa.
          - valor: '5.72'
            mensaje: |
              Has puesto $\operatorname{sen}\beta = 1$, que es el caso
              $\beta = 90^{\circ}$ del segundo apartado. Con
              $\beta = 40^{\circ}$, $\operatorname{sen}\beta = 0{,}643$ y hace
              falta girar más deprisa.
        pista: |
          De las ecuaciones sale
          $\omega^{2} = \dfrac{3g}{2a\operatorname{sen}\beta}$. La nota de la
          colección precisa además que la placa no gira respecto del pasador,
          $\alpha_{1} = \omega_{2} = 0$, así que $\beta$ es constante de verdad.
        desarrollo: |
          $$
          \omega = \sqrt{\frac{3}{2\operatorname{sen}\beta}\cdot\frac{g}{a}}
          = 1{,}5276\sqrt{\frac{g}{a}} = 1{,}5276\cdot 4{,}669 = 7{,}13\ \text{rad/s}
          $$

      - tipo: calcular
        titulo: El límite para que la placa siga vertical
        pregunta: |
          ¿Por debajo de qué valor de $\omega$ se queda la placa vertical, en
          rad/s?
        respuesta:
          tipo: numero
          valor: '5.72'
          tolerancia: 0.03
          formato: un número, en rad/s
        distractores:
          - valor: '7.13'
            mensaje: |
              Ese es el del primer apartado, con
              $\operatorname{sen}40^{\circ}$. Para la posición vertical
              $\operatorname{sen}\beta = 1$, que es el mayor valor posible del
              seno y por tanto el que da el $\omega$ más pequeño.
          - valor: '4.67'
            mensaje: |
              Ese es $\sqrt{g/a}$ pelado. Falta el factor $\tfrac32$ de dentro
              de la raíz, que sale del reparto entre el par de inercia y la
              fuerza centrífuga.
          - valor: '0'
            mensaje: |
              La placa vertical no necesita que el pasador esté parado: aguanta
              vertical mientras el giro no sea capaz de levantarla, y eso da un
              intervalo, no un punto.
        pista: |
          La misma fórmula pide $\operatorname{sen}\beta = 3g/(2a\omega^{2})$, y
          un seno no puede pasar de 1.
        desarrollo: |
          $$
          \operatorname{sen}\beta = \frac{3g}{2a\omega^{2}} \le 1
          \;\Longrightarrow\;
          \omega < \sqrt{\frac{3g}{2a}} = 1{,}2247\sqrt{\frac{g}{a}} = 5{,}72\ \text{rad/s}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: 'La velocidad angular de la placa es $\vec{\omega}_p = -\omega\operatorname{sen}\beta\,\vec{e}_1 + \omega\cos\beta\,\vec{e}_2$, la vertical descompuesta en sus ejes principales.'
          - texto: 'Con $\vec{\omega}$ constante en módulo, $d\vec{H}_G/dt$ es solo $\vec{\Omega}\times\vec{H}_G = (I_{Gx}-I_{Gy})\,\omega^{2}\operatorname{sen}\beta\cos\beta\,\vec{e}_2$.'
          - texto: 'Tomando momentos en el punto fijo $O$ y proyectando sobre el eje de la charnela, las reacciones de $A$ y $B$ no aparecen y queda $\omega^{2} = 3g/(2a\operatorname{sen}\beta)$.'
          - texto: 'Cuanto más deprisa gire el pasador, más vertical se pone la placa, porque la fuerza centrífuga la aprieta contra el eje.'
            trampa: true
            mensaje: |
              Es justo al revés, y es lo que hace bonito el problema: la fuerza
              centrífuga tira de la placa hacia **fuera**, así que cuanto más
              deprisa gira, más se levanta y menor es $\beta$. La placa aguanta
              vertical solo mientras $\omega$ sea pequeña, por debajo de
              5,72 rad/s.
    resolucion: |
      **El planteamiento.** La placa está unida al pasador por la charnela
      $AB$, y el pasador gira alrededor de la vertical con $\omega$ constante.
      Si $\beta$ se mantiene, la placa está rígidamente unida al pasador y su
      velocidad angular es la vertical descompuesta en los ejes principales de
      la placa:

      $$
      \vec{\omega}_p = -\omega\operatorname{sen}\beta\,\vec{e}_1 + \omega\cos\beta\,\vec{e}_2
      $$

      con $I_{Gx} = I_{Gz} = ma^{2}/12$ e $I_{Gy} = ma^{2}/6$.

      **El par que la levanta.** Las componentes de $\vec{H}_G$ son constantes,
      así que su derivada es puro término de Boure:

      $$
      \frac{d\vec{H}_G}{dt} = \vec{\Omega}\times\vec{H}_G
      = \left(I_{Gx}-I_{Gy}\right)\omega^{2}\operatorname{sen}\beta\cos\beta\,\vec{e}_2
      = -\tfrac{1}{12}ma^{2}\omega^{2}\operatorname{sen}\beta\cos\beta\,\vec{e}_2
      $$

      Además $G$ no está en el eje: describe una circunferencia de radio
      $\tfrac{a}{2}\cos\beta$, y su aceleración centrípeta entra en las
      ecuaciones de fuerzas.

      **La ecuación que queda.** Escribiendo momentos en $O$, que es punto
      fijo, y proyectando sobre el eje de la charnela, las reacciones de $A$ y
      $B$ desaparecen —están sobre ese eje— y queda una sola ecuación:

      $$
      \tfrac23\,a\,\omega^{2}\operatorname{sen}\beta = g
      \qquad\Longrightarrow\qquad
      \omega = \sqrt{\frac{3g}{2a\operatorname{sen}\beta}}
      $$

      **Los dos apartados.** Con $a = 0{,}45\ \text{m}$:

      $$
      \beta = 40^{\circ}:\quad \omega = 1{,}5276\sqrt{\frac{g}{a}} = 7{,}13\ \text{rad/s}
      $$

      $$
      \beta = 90^{\circ}:\quad \operatorname{sen}\beta = \frac{3g}{2a\omega^{2}} \le 1
      \;\Longrightarrow\; \omega < 1{,}2247\sqrt{\frac{g}{a}} = 5{,}72\ \text{rad/s}
      $$

      El segundo apartado es una desigualdad y no un valor, y ese es el
      resultado que hay que entender: la posición vertical siempre es una
      solución de equilibrio, pero deja de ser la única en cuanto
      $3g/(2a\omega^{2})$ baja de 1. A partir de ahí la placa se levanta y se
      queda en el $\beta$ que cumple la igualdad.

      **La comprobación.** El equilibrio se ha vuelto a comprobar por otro
      camino, sin tensor de inercia: discretizando la placa en masas puntuales,
      calculando $\vec{H}_O$ como
      $\sum m_i\,\vec{r}_i\times\vec{v}_i$ y derivando numéricamente. Con la
      $\omega$ de la fórmula, el momento del peso alrededor del eje de la
      charnela y la derivada del momento angular coinciden a la cuarta cifra
      para $\beta = 40^{\circ}$ y $\beta = 60^{\circ}$, y los dos se anulan a la
      vez en $\beta = 90^{\circ}$, que es por lo que ahí el resultado es un
      intervalo.
  - id: ejma10-col107-la-barra-en-el-plano-que-gira
    titulo: La barra que gira dentro de un plano que a su vez gira
    fuente: >-
      Ejercicio 10.7 · Tema 10, «Dinámica del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo, y también se ha usado la
      resolución oficial del curso para comprobarlo. Como el resultado es
      simbólico, las casillas piden su valor con unos datos de prueba que se
      declaran en cada pregunta.
    nivel: practica
    enunciado: |
      Se considera una barra rígida homogénea de masa $M$ y longitud $L$
      contenida en un plano vertical $\pi$ y cuyo centro está fijo en $O$. El
      plano gira alrededor de un eje vertical fijo que pasa por $O$ según la
      variación de un parámetro angular $\psi$ mientras que la barra gira sobre
      el plano según otro parámetro $\theta$. El sistema se lanza con
      determinadas velocidades angulares iniciales en una posición inicial sin
      estar sometido a otras acciones aplicadas que no sean las gravitatorias.
      Calcular:

      a) El momento angular respecto al centro de gravedad de la barra $O$.

      b) Los momentos generados por las reacciones alrededor del punto $O$.

