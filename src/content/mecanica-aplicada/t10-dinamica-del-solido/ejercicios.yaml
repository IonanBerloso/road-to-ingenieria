    pide: El momento angular de la barra respecto de su centro O y el momento que hay que aplicarle en O, en función de M, L y los dos ángulos con sus derivadas.
    pasos:
      - tipo: reconocer
        pregunta: |
          La velocidad angular de la barra tiene una componente a lo largo de
          la propia barra, $\dot{\psi}\cos\theta$. ¿Qué momento angular aporta?
        opciones:
          - texto: Ninguno, porque el momento de inercia de una barra delgada respecto de su propio eje es nulo
            correcta: true
            mensaje: |
              Eso es, y por eso $\vec{H}_O$ no tiene componente según la barra
              aunque $\vec{\omega}$ sí la tenga. Es el ejemplo más limpio de que
              $\vec{H}$ y $\vec{\omega}$ no son paralelos.
          - texto: Aporta ML²/12 por esa componente, como las otras dos
            mensaje: |
              $ML^{2}/12$ es el momento de inercia respecto de un eje
              **perpendicular** a la barra por su centro. A lo largo de la
              barra toda la masa está sobre el eje y el momento de inercia es
              nulo.
          - texto: Aporta ML²/3, porque el giro es respecto de un extremo
            mensaje: |
              $ML^{2}/3$ es respecto de un eje perpendicular por un extremo, y
              aquí el punto fijo es el centro. Además la componente de la que
              hablamos va a lo largo de la barra, no perpendicular.
          - texto: No existe esa componente, porque la barra gira dentro del plano
            mensaje: |
              Sí existe: el eje vertical no es perpendicular a la barra, así
              que al proyectar $\dot{\psi}$ sobre los ejes de la barra aparecen
              $\dot{\psi}\operatorname{sen}\theta$ y
              $\dot{\psi}\cos\theta$. Lo que pasa es que la segunda no da
              momento angular.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **la barra sola, sin el plano ni
          el apoyo de O, con todas las acciones que actúan sobre ella**. Sin
          escala.
        comprueba:
          - punto: |
              **En O, la fuerza del apoyo, en una dirección cualquiera.**
            porque: |
              O está fijo: el apoyo le impide moverse en ninguna dirección.
          - punto: |
              **En O también, un momento del apoyo, en una dirección
              cualquiera.**
            porque: |
              El apoyo obliga a la barra a seguir al plano, y eso lo hace con
              un momento: es el que pide el apartado b).
          - punto: |
              **El peso, Mg, vertical, en O.**
            porque: |
              O es el centro de la barra, que es homogénea.
          - punto: |
              **Ninguna otra acción.**
            porque: |
              El enunciado dice que, aparte de las reacciones, solo actúa la
              gravedad.
