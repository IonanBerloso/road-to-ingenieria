        <path d="M202.4 114.4 L209.6 121.6 M202.4 121.6 L209.6 114.4" stroke="var(--ink)" stroke-width="1.3"/>
        <text x="0" y="0" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic"></text>
        <circle cx="50" cy="90" r="5.5" fill="var(--paper)" stroke="var(--d2)" stroke-width="1.3"/>
        <circle cx="50" cy="90" r="1.7" fill="var(--d2)"/>
        <text x="50" y="78" font-size="10" text-anchor="middle" fill="var(--d2-tinta)">A<tspan font-size="7.5" dy="2.5">z</tspan><tspan dy="-2.5"></tspan></text>
        <circle cx="290" cy="90" r="5.5" fill="var(--paper)" stroke="var(--d2)" stroke-width="1.3"/>
        <path d="M286.4 86.4 L293.6 93.6 M286.4 93.6 L293.6 86.4" stroke="var(--d2)" stroke-width="1.3"/>
        <text x="290" y="78" font-size="10" text-anchor="middle" fill="var(--d2-tinta)">B<tspan font-size="7.5" dy="2.5">z</tspan><tspan dy="-2.5"></tspan></text>
        <circle cx="170" cy="90" r="2.4" fill="var(--ink)"/>
        <text x="176" y="104" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">C</text>
        <text x="50" y="110" font-size="9" text-anchor="middle" fill="var(--faint)">A</text>
        <text x="290" y="110" font-size="9" text-anchor="middle" fill="var(--faint)">B</text>
        <text x="136" y="30" font-size="9" text-anchor="middle" fill="var(--faint)">x &lt; 0</text>
        <text x="204" y="30" font-size="9" text-anchor="middle" fill="var(--faint)">x &gt; 0</text>
      </svg>
      <figcaption>

      Visto de frente, desde z. Cada partícula necesita una aceleración perpendicular al disco, proporcional a su distancia a la vertical por C: hacia fuera del lado de A y hacia dentro del lado de B. El par de esas fuerzas lo dan las reacciones dinámicas.

      </figcaption>
      </figure>

      El momento que hace falta para darles esa aceleración, con
      $\int x^{2}\,dm = \tfrac14 mr^{2}$, la mitad de $\int \rho^{2}\,dm$:

      $$
      \int \vec{r}\times\vec{a}_{cor}\,dm = 2\,\omega_{1}\,\omega_{2}\left(\int x^{2}\,dm\right)\vec{e}_2 = 2\,\omega_{1}\,\omega_{2}\cdot\tfrac14 mr^{2}\,\vec{e}_2
      $$

      Con $\omega_{2} = 7{,}8628$ rad/s:
      $2 \cdot 78{,}54 \cdot 7{,}8628 \cdot 0{,}000178125 = 0{,}2200\ \text{N}\cdot\text{m}$,
      que es justo el par de dos fuerzas de 1,1 N separadas 0,2 m. Lo mismo:
      el par giroscópico es el momento de las fuerzas de Coriolis, y el ½ de
      $I_{Gz}$ sale de 2 por ¼.

      **Lo que dice el resultado.** Un disco de menos de trescientos gramos a
      750 rpm limita el giro del eje a 75 rpm, diez veces menos, para que los
      apoyos no lleven más de 1,1 N de carga dinámica. La estática, 1,40 N por
      apoyo, ya pasa de ese tope, pero es otra cosa: es vertical y fija, y la
      dinámica gira con el eje, perpendicular al disco: en cada vuelta, cada
      apoyo la recibe en todas las direcciones. El par no depende de la separación
      de los apoyos, pero las fuerzas sí: con el doble de separación, el eje
      podría girar el doble de deprisa.

  - id: ejma10-col106-la-placa-cuadrada-del-pasador-en-t
    titulo: La placa cuadrada que se levanta al girar el pasador en T
    fuente: >-
      Ejercicio 10.6 · Tema 10, «Dinámica del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo, y también se ha usado la
      resolución oficial del curso para comprobarlo. Los valores numéricos de
      las casillas usan el lado que da la figura, 450 mm, y se declaran en cada
      pregunta.
    nivel: practica
    antes:
      idea: |
        La resultante de las fuerzas es la masa por la aceleración del centro
        de masas, y el momento respecto de él, la derivada del momento
        angular. En ejes principales, cada componente del momento angular es
        el momento de inercia de ese eje por la componente de la velocidad
        angular. Si esos ejes giran, la derivada tiene dos partes: la de las
        componentes y la del giro de los propios ejes.
      formula: |
        $$
        \sum\vec{F} = m\vec{a}_G,
        \qquad
        \sum\vec{M}_G = \frac{d\vec{H}_G}{dt},
        \qquad
        \frac{d\vec{H}_G}{dt} = \left(\frac{d\vec{H}_G}{dt}\right)_{\text{ejes}} + \vec{\Omega}\times\vec{H}_G
        $$

        $$
        \vec{H}_G = I_{G1}\,\omega_{1}\,\vec{e}_1 + I_{G2}\,\omega_{2}\,\vec{e}_2 + I_{G3}\,\omega_{3}\,\vec{e}_3
        \quad\text{en ejes principales}
        $$
      reconocer: |
        Antes de calcular se miran los ejes de simetría de la placa y cómo se
        reparte su masa alrededor de cada uno.
    enunciado: |
      Una placa cuadrada de lado $a$ y masa $m$ está articulada a un pasador
      con forma de T que gira alrededor del eje $OY$ con velocidad angular
      $\omega_{1} = \omega$ constante.

      Calcular:

      El valor de $\omega$ para el cual se mantiene el valor
      $\beta = 40^{\circ}$ constante.

      El intervalo de valores de $\omega$ para el cual la placa permanece
      vertical $\beta = 90^{\circ}$.

