    pide: La energía cinética del disco y su momento angular respecto de O, en función de m, r, b y las tres velocidades angulares.
    pasos:
      - tipo: reconocer
        pregunta: |
          En los ejes $xyz$ del dibujo, ligados al disco, ¿qué momentos de
          inercia hay que meter en el tensor?
        opciones:
          - texto: Los dos diametrales valen mr²/4 y el del eje del disco, mr²/2
            correcta: true
            mensaje: |
              Eso es. El eje $z$ es perpendicular al disco, así que
              $I_{Gz} = \tfrac12 m r^{2}$, y los dos que están en el plano del
              disco valen la mitad, $\tfrac14 m r^{2}$. Los productos de
              inercia son nulos porque $xyz$ son ejes de simetría.
          - texto: Los dos diametrales valen mr²/2 y el del eje del disco, mr²/4
            mensaje: |
              Están cambiados. El momento de inercia mayor es siempre el del
              eje perpendicular al disco, que es el que reparte toda la masa
              lejos: $\tfrac12 m r^{2}$ frente a $\tfrac14 m r^{2}$.
          - texto: Los tres valen mr²/2, porque el disco es homogéneo
            mensaje: |
              Un disco no es una esfera. Solo el eje perpendicular al plano
              vale $\tfrac12 m r^{2}$; en los diametrales la masa está más
              cerca del eje y sale la mitad.
          - texto: Los tres valen mr², como el de un aro
            mensaje: |
              $m r^{2}$ es el de un aro, con toda la masa en el borde. En un
              disco macizo la masa se reparte hasta el centro y el axial baja
              a $\tfrac12 m r^{2}$.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el disco en el instante del
          enunciado, visto de frente, con sus velocidades angulares y la
          velocidad de su centro**. Sin escala.
        comprueba:
          - punto: |
              **Las tres velocidades angulares, cada una por su eje: $\omega_2$
              por el eje vertical, $\omega_1$ por el brazo y p por el eje del
              disco, perpendicular al papel.**
            porque: |
              Cada giro va montado sobre el anterior: el brazo gira con el eje
              vertical, la horquilla con el brazo y el disco con la horquilla.
          - punto: |
              **Sus sentidos, los de la figura del enunciado: $\omega_2$ hacia
              arriba, $\omega_1$ hacia $-X$ y p hacia el lector.**
            porque: |
              Cada giro se pasa a vector con la regla de la mano derecha.
          - punto: |
              **La velocidad de G, perpendicular al papel, hacia dentro.**
            porque: |
              G está en el brazo, a distancia b del eje vertical. $\omega_1$
              gira el brazo sobre sí mismo y p gira el disco alrededor de G:
              ninguno de los dos mueve G. Solo $\omega_2$ lo lleva en círculo.
          - punto: |
              **Los ejes del disco, x a lo largo del brazo, y vertical y z
              perpendicular al disco, que en ese instante coinciden con X, Y,
              Z.**
            porque: |
              Son los del enunciado, y van con el disco.
        figura: |
          <svg viewBox="-6 4 302 180" role="img" width="302" height="180" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">Esquema de velocidades del disco de la horquilla, visto de frente</title>
            <desc id="dsl-d">El instante del enunciado, visto de frente: el disco está en el plano del papel, que es el plano XY, y el eje Z sale hacia el lector. El eje vertical Y, con su velocidad angular omega dos hacia arriba. El brazo horizontal, a lo largo del eje X, de O al centro G del disco, a distancia b, con su velocidad angular omega uno hacia la izquierda, hacia menos X. En G, la velocidad angular p del disco respecto de la horquilla, perpendicular al papel y hacia fuera, y la velocidad de G, perpendicular al papel y hacia dentro.</desc>
