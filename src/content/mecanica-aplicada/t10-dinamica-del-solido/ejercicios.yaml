        <path d="M361 100 H379 V120 H361 Z" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
        <line x1="44.7" y1="177.3" x2="74.1" y2="171.2" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="42.7" y="171.3" font-size="10" text-anchor="middle" fill="var(--d2-tinta)">A<tspan font-size="7.5" dy="2.5">x</tspan></text>
        <line x1="80" y1="210" x2="80" y2="175" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="86" y="208" font-size="10" text-anchor="start" fill="var(--d2-tinta)">A<tspan font-size="7.5" dy="2.5">y</tspan></text>
        <line x1="100.8" y1="140.6" x2="83.5" y2="165.1" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="104.8" y="142.6" font-size="10" text-anchor="start" fill="var(--d2-tinta)">A<tspan font-size="7.5" dy="2.5">z</tspan></text>
        <line x1="370" y1="150" x2="370" y2="115" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="376" y="148" font-size="10" text-anchor="start" fill="var(--d2-tinta)">B<tspan font-size="7.5" dy="2.5">y</tspan></text>
        <line x1="390.8" y1="80.6" x2="373.5" y2="105.1" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="394.8" y="82.6" font-size="10" text-anchor="start" fill="var(--d2-tinta)">B<tspan font-size="7.5" dy="2.5">z</tspan></text>
