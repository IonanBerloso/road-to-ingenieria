        <desc id="ejma10-col102-d">Un eje vertical gira con velocidad angular omega. En el punto D, a una altura de tres L sobre el suelo, se articula la barra larga de longitud dos L y masa dos M, que baja hacia la derecha formando un ángulo fi con el eje. Su punto medio C se articula con la barra corta, de longitud L y masa M, que vuelve al eje y termina en la deslizadera A. Como el triángulo D A C es isósceles, la deslizadera queda a dos L por el coseno de fi por debajo de D. De A cuelga un muelle de longitud natural tres L y constante M g partido por L, anclado al punto fijo O del suelo, que por tanto está comprimido dos L por el coseno de fi. El dibujo está a escala para fi igual a treinta y cinco grados.</desc>
