      - tipo: calcular
        titulo: El momento de inercia del disco
        pregunta: |
          ¿Cuánto vale el momento de inercia del disco respecto de su eje de
          giro propio, en kg·m²?
        respuesta:
          tipo: numero
          valor: '0.00035625'
          tolerancia: 0.000005
          formato: un número, en kg·m2
        distractores:
          - valor: '0.000178125'
            mensaje: |
              Ese es el diametral, $\tfrac14 m r^{2}$. El eje de giro propio del
              disco es el perpendicular a su plano, y ahí vale
              $\tfrac12 m r^{2}$.
          - valor: '0.0007125'
            mensaje: |
              Ese es $m r^{2}$, el de un aro. El disco es macizo y su axial es
              la mitad.
          - valor: '356.25'
            mensaje: |
              Has metido el radio en milímetros. En el SI el radio son
              0,05 m, y al ir al cuadrado el factor es un millón.
        pista: |
          Disco macizo, eje perpendicular a su plano:
          $I_{Gz} = \tfrac12 m r^{2}$, con $r = 0{,}05\ \text{m}$.
        desarrollo: |
          $$
          I_{Gz} = \tfrac12 \cdot 0{,}285 \cdot 0{,}05^{2} = 3{,}5625\cdot 10^{-4}\ \text{kg}\cdot\text{m}^{2}
          $$

      - tipo: calcular
        titulo: La velocidad angular máxima del eje
        pregunta: |
          ¿Cuál es el mayor valor de $\omega_{2}$, en rad/s, con el que la
          reacción dinámica no llega a 1,1 N?
        respuesta:
          tipo: numero
          valor: '7.86'
          tolerancia: 0.02
          formato: un número, en rad/s
        distractores:
          - valor: '3.93'
            mensaje: |
              Te falta el factor 2 de la distancia entre apoyos. El par lo
              equilibra una pareja de fuerzas separadas $2d = 0{,}2\ \text{m}$,
              no $d$.
          - valor: '15.73'
            mensaje: |
              Has usado el momento de inercia diametral, $\tfrac14 m r^{2}$. El
              que entra en el par giroscópico es el del giro propio,
              $\tfrac12 m r^{2}$, que es el doble.
          - valor: '0.823'
            mensaje: |
              Has tomado $\omega_{1} = 750\ \text{rad/s}$. Son 750 rpm, o sea
              $750\cdot 2\pi/60 = 78{,}54\ \text{rad/s}$.
        pista: |
          $A_z = \dfrac{I_{Gz}\,\omega_{1}\,\omega_{2}}{2d} \le 1{,}1\ \text{N}$,
          con $d = 0{,}1\ \text{m}$ y
          $\omega_{1} = 750\cdot 2\pi/60\ \text{rad/s}$.
        desarrollo: |
          $$
          \omega_{2} \le \frac{2{,}2\,d}{I_{Gz}\,\omega_{1}} = \frac{2{,}2\cdot 0{,}1}{3{,}5625\cdot 10^{-4}\cdot 78{,}54} = 7{,}86\ \text{rad/s}
          $$

      - tipo: calcular
        titulo: El mismo resultado en revoluciones por minuto
        pregunta: |
          ¿Cuánto es esa velocidad angular en rpm?
        respuesta:
          tipo: numero
          valor: '75.1'
          tolerancia: 0.3
          formato: un número, en rpm
        distractores:
          - valor: '471.7'
            mensaje: |
              Has multiplicado por 60 sin dividir entre $2\pi$. Una revolución
              son $2\pi$ radianes, así que
              $\text{rpm} = \omega\cdot 60/(2\pi)$.
          - valor: '0.131'
            mensaje: |
              Has dividido entre 60 en lugar de multiplicar, y te has dejado el
              $2\pi$. Pasar de rad/s a rpm da un número mayor, porque un
              minuto tiene sesenta segundos.
          - valor: '0.823'
            mensaje: |
              Has hecho la conversión al revés, multiplicando por $2\pi/60$:
              esa es la que pasa de rpm a rad/s. De rad/s a rpm se multiplica
              por $60/(2\pi)$, y el número tiene que salir mayor.
        pista: |
          $\text{rpm} = \omega\,\dfrac{60}{2\pi}$.
        desarrollo: |
          $$
          \omega_{2} = 7{,}86\cdot\frac{60}{2\pi} = 75{,}1\ \text{rpm}
          $$

          que es el valor redondeado a 75 rpm que publica la colección.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: 'El centro del disco está sobre el eje AB y no se mueve, así que $\vec{a}_G = \vec{0}$ y las reacciones dinámicas no vienen de ninguna fuerza de inercia.'
          - texto: 'Con los dos giros constantes, $d\vec{H}_G/dt = \vec{\Omega}\times\vec{H}_G$ tiene módulo $I_{Gz}\omega_{1}\omega_{2}$ y es perpendicular a los dos ejes.'
          - texto: 'Ese par lo equilibran dos fuerzas iguales y opuestas en $A$ y $B$, separadas $2d$, así que cada una vale $I_{Gz}\omega_{1}\omega_{2}/(2d)$.'

          - texto: 'Como la reacción estática ya vale $mg/2 = 1{,}40$ N y pasa de 1,1 N, el problema no tiene solución.'
            trampa: true
            mensaje: |
              El enunciado limita las reacciones **dinámicas**, que son las que
              añade el movimiento, no la carga total. La estática del peso está
              siempre ahí y se estudia aparte: las dos se superponen y cada una
              tiene su criterio.
    resolucion: |
      **1. Sólidos libres.** Es un problema de dinámica de un sólido con dos
      giros a la vez: el dibujo lleva el disco con el eje AB, sin los apoyos,
      en la perspectiva del enunciado.

