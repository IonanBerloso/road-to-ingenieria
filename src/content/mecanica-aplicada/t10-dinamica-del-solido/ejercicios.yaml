      $$
      \int_0^{a}\frac{m}{a}\,\omega^{2}s^{2}\operatorname{sen}\beta\cos\beta\,ds
      = \int_0^{a}\frac{m}{a}\,g\,s\cos\beta\,ds
      \quad\Longrightarrow\quad
      \tfrac13\,ma^{2}\omega^{2}\operatorname{sen}\beta\cos\beta = \tfrac12\,mga\cos\beta
      $$

      Es la misma ecuación. Por kilogramo, con β = 40° y $\omega^{2} = 50{,}87$:
      la centrífuga, $50{,}87 \cdot 0{,}0675 \cdot 0{,}6428 \cdot 0{,}766 = 1{,}691$,
      y el peso, $9{,}81 \cdot 0{,}225 \cdot 0{,}766 = 1{,}691$ N·m. Lo
      mismo. El $\tfrac13$ es el momento de inercia de la placa respecto de
      la charnela, $\tfrac{1}{12} + \tfrac14$ por Steiner: el término de
      $d\vec{H}_G/dt$ y el de la aceleración de G.

      **Lo que dice el resultado.** La vertical siempre es una posición de
      equilibrio: ahí toda la placa está en el plano del eje, y la
      centrífuga de cada franja va a lo largo de la charnela, sin momento.
      Pero deja de ser la única en cuanto ω pasa de 5,72 rad/s: a partir de
      ahí la placa se levanta, y cuanto más deprisa gira, menor es β, hasta
      acercarse a la horizontal. De lo que la levanta, las tres cuartas
      partes son la centrífuga de G, el $\tfrac14$, y una cuarta parte el
      término de $d\vec{H}_G/dt$, el $\tfrac{1}{12}$.

  - id: ejma10-col107-la-barra-en-el-plano-que-gira
    titulo: La barra que gira dentro de un plano que a su vez gira
    fuente: >-
      Ejercicio 10.7 · Tema 10, «Dinámica del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo, y también se ha usado la
      resolución oficial del curso para comprobarlo. Como el resultado es
      simbólico, las casillas piden su valor con unos datos de prueba que se
      declaran en cada pregunta.
    nivel: practica
    antes:
      idea: |
        Con un punto fijo O, el momento respecto de él de las fuerzas
        exteriores es la derivada del momento angular respecto de O. En ejes
        principales, cada componente del momento angular es el momento de
        inercia de ese eje por la componente de la velocidad angular. Un
        sólido que gira a la vez de dos maneras tiene por velocidad angular la
        suma de los dos giros.
      formula: |
        Con $\vec{\Omega}$ la velocidad angular de los ejes:

        $$
        \sum\vec{M}_O = \frac{d\vec{H}_O}{dt},
        \qquad
        \vec{H}_O = I_{O1}\,\omega_{1}\,\vec{e}_1 + I_{O2}\,\omega_{2}\,\vec{e}_2 + I_{O3}\,\omega_{3}\,\vec{e}_3,
        \qquad
        \frac{d\vec{H}_O}{dt} = \left(\frac{d\vec{H}_O}{dt}\right)_{\text{ejes}} + \vec{\Omega}\times\vec{H}_O
        $$
      reconocer: |
        Antes de calcular se mira qué componentes tiene la velocidad angular
        en los ejes de la barra y cómo se reparte su masa alrededor de cada
        uno.
    enunciado: |
      Se considera una barra rígida homogénea de masa $M$ y longitud $L$
      contenida en un plano vertical $\pi$ y cuyo centro está fijo en $O$. El
      plano gira alrededor de un eje vertical fijo que pasa por $O$ según la
      variación de un parámetro angular $\psi$ mientras que la barra gira sobre
      el plano según otro parámetro $\theta$. El sistema se lanza con
      determinadas velocidades angulares iniciales en una posición inicial sin
      estar sometido a otras acciones aplicadas que no sean las gravitatorias.
      Calcular:

      a) El momento angular respecto al centro de gravedad de la barra $O$.

      b) Los momentos generados por las reacciones alrededor del punto $O$.

