        <text x="160" y="204" font-size="10" fill="var(--d1)">ω₁</text>
        <path d="M240 212 A 40 24 0 0 0 296 202" fill="none" stroke="var(--d3)" stroke-width="1.6" marker-end="url(#ejma10-col101-f3)"/>
        <text x="238" y="228" font-size="10" fill="var(--d3)">p</text>
      </svg>
      </figure>
    pide: La energía cinética del disco y su momento angular respecto de O, en función de m, r, b y las tres velocidades angulares.
    pasos:
      - tipo: reconocer
        pregunta: |
          En los ejes $xyz$ del dibujo, ligados al disco, ¿qué momentos de
          inercia hay que meter en el tensor?
        opciones:
          - texto: Los dos diametrales valen mr²/4 y el del eje del disco, mr²/2
            correcta: true
            mensaje: |
              Eso es. El eje $z$ es perpendicular al disco, así que
              $I_{Gz} = \tfrac12 m r^{2}$, y los dos que están en el plano del
              disco valen la mitad, $\tfrac14 m r^{2}$. Los productos de
              inercia son nulos porque $xyz$ son ejes de simetría.
          - texto: Los dos diametrales valen mr²/2 y el del eje del disco, mr²/4
            mensaje: |
              Están cambiados. El momento de inercia mayor es siempre el del
              eje perpendicular al disco, que es el que reparte toda la masa
              lejos: $\tfrac12 m r^{2}$ frente a $\tfrac14 m r^{2}$.
          - texto: Los tres valen mr²/2, porque el disco es homogéneo
            mensaje: |
              Un disco no es una esfera. Solo el eje perpendicular al plano
              vale $\tfrac12 m r^{2}$; en los diametrales la masa está más
              cerca del eje y sale la mitad.
          - texto: Los tres valen mr², como el de un aro
            mensaje: |
              $m r^{2}$ es el de un aro, con toda la masa en el borde. En un
              disco macizo la masa se reparte hasta el centro y el axial baja
              a $\tfrac12 m r^{2}$.

      - tipo: calcular
        titulo: La energía cinética del disco
        pregunta: |
          Con los valores de prueba $m = 2\ \text{kg}$, $r = 0{,}2\ \text{m}$,
          $b = 0{,}3\ \text{m}$, $\omega_{1} = 3$, $\omega_{2} = 4$ y
          $p = 10\ \text{rad/s}$, ¿cuánto vale $T$, en julios?
        respuesta:
          tipo: numero
          valor: '3.69'
          tolerancia: 0.02
          formato: un número, en J
        distractores:
          - valor: '2.25'
            mensaje: |
              Esa es solo la parte de rotación,
              $\tfrac12\,\vec{\omega}\cdot\mathbf{I}_G\,\vec{\omega}$. Falta la de
              traslación: $G$ describe una circunferencia de radio $b$ y lleva
              velocidad $\omega_{2}b$.
          - valor: '1.44'
            mensaje: |
              Esa es solo $\tfrac12 m v_G^{2}$. El disco además gira, y el
              teorema de König pide sumar las dos energías, no elegir una.
          - valor: '2.94'
            mensaje: |
              Has cambiado los momentos de inercia: has puesto
              $\tfrac12 m r^{2}$ en los diametrales y $\tfrac14 m r^{2}$ en el
              eje del disco. Es al revés, y como $p$ es la mayor de las tres
              velocidades el error se nota mucho.
        pista: |
          $v_G = \omega_{2}b$, y en ejes principales la parte de rotación es
          $\tfrac12\left(I_{Gx}\omega_{1}^{2} + I_{Gy}\omega_{2}^{2} + I_{Gz}p^{2}\right)$.
        desarrollo: |
          $$
          T = \tfrac12 m \omega_{2}^{2} b^{2} + \tfrac12\left(\tfrac{mr^{2}}{4}\omega_{1}^{2} + \tfrac{mr^{2}}{4}\omega_{2}^{2} + \tfrac{mr^{2}}{2}p^{2}\right)
          = \frac{mr^{2}}{8}\left[\omega_{1}^{2} + \left(1+\frac{4b^{2}}{r^{2}}\right)\omega_{2}^{2} + 2p^{2}\right]
          $$

          $$
          T = 1{,}44 + 2{,}25 = 3{,}69\ \text{J}
          $$

      - tipo: calcular
        titulo: La componente vertical del momento angular en O
        pregunta: |
          Con los mismos valores, ¿cuánto vale la componente según
          $\vec{\jmath}$ (la vertical $y$) de $\vec{H}_O$, en kg·m²/s?
        respuesta:
          tipo: numero
          valor: '0.8'
          tolerancia: 0.005
          formato: un número, en kg·m²/s
        distractores:
          - valor: '0.08'
            mensaje: |
              Eso es $I_{Gy}\omega_{2}$ a secas, el momento angular respecto de
              $G$. Al pasar a $O$ falta el término de transporte
              $\overrightarrow{OG} \times m\vec{v}_G$, que aquí vale
              $m b^{2}\omega_{2}$ y es la parte mayor.
          - valor: '-0.64'
            mensaje: |
              Has restado el término de transporte en vez de sumarlo: es el
              error de escribir $\overrightarrow{GO}$ donde va
              $\overrightarrow{OG}$. Que el disco orbite alrededor del eje
              vertical solo puede **añadir** momento angular vertical.
        pista: |
          $\vec{H}_O = \vec{H}_G + \overrightarrow{OG} \times m\vec{v}_G$, con
          $\overrightarrow{OG} = b\,\vec{\imath}$ y
          $\vec{v}_G = -\omega_{2}b\,\vec{k}$.
        desarrollo: |
          $$
          H_{Oy} = \tfrac14 m r^{2}\omega_{2} + m b^{2}\omega_{2}
          = \tfrac14 m r^{2}\left(1+\frac{4b^{2}}{r^{2}}\right)\omega_{2}
          $$

          $$
          H_{Oy} = 0{,}08 + 0{,}72 = 0{,}80\ \text{kg}\cdot\text{m}^{2}/\text{s}
          $$

      - tipo: justificar
        pregunta: Ordena el cálculo del momento angular en O. Una pieza es falsa.
        piezas:
          - texto: 'En ejes principales del disco, $\vec{H}_G = -\tfrac14 mr^{2}\omega_{1}\vec{\imath} + \tfrac14 mr^{2}\omega_{2}\vec{\jmath} + \tfrac12 mr^{2}p\,\vec{k}$.'
          - texto: 'El centro $G$ gira alrededor del eje vertical con $\omega_{2}$ a distancia $b$, así que $\vec{v}_G = -\omega_{2}b\,\vec{k}$.'
          - texto: 'El cambio de punto añade $\overrightarrow{OG} \times m\vec{v}_G = +m\omega_{2}b^{2}\,\vec{\jmath}$, que suma a la componente vertical.'
          - texto: 'Como los ejes son principales, $\vec{H}_G$ es paralelo a $\vec{\omega}_d$ y basta multiplicar por un número.'
            trampa: true
            mensaje: |
              Que los ejes sean principales solo quiere decir que la matriz es
              diagonal. $\vec{H}_G$ sería paralelo a $\vec{\omega}$ si los tres
              momentos de inercia fueran iguales o si $\vec{\omega}$ fuera por
              una dirección principal, y aquí no pasa ninguna de las dos cosas:
              $I_{Gz}$ es el doble que los otros dos.
    resolucion: |
      **El sólido y sus ejes.** El disco tiene tres movimientos a la vez, y lo
      primero es sumarlos en una sola velocidad angular. En los ejes $xyz$ del
      dibujo, que son principales de inercia:

      $$
      \vec{\omega}_d = -\omega_{1}\vec{\imath} + \omega_{2}\vec{\jmath} + p\,\vec{k}
      \qquad
      I_{Gx} = I_{Gy} = \tfrac14 m r^{2}, \quad I_{Gz} = \tfrac12 m r^{2}
      $$

      **a) La energía cinética.** König: la traslación del centro más la
      rotación alrededor de él. El centro $G$ describe una circunferencia de
      radio $b$ alrededor del eje vertical, así que $v_G = \omega_{2}b$:

      $$
      T = \tfrac12 m \omega_{2}^{2}b^{2} + \tfrac12\left(\tfrac{mr^{2}}{4}\omega_{1}^{2} + \tfrac{mr^{2}}{4}\omega_{2}^{2} + \tfrac{mr^{2}}{2}p^{2}\right)
      $$

      $$
      T = \frac{mr^{2}}{8}\left[\omega_{1}^{2} + \left(1+\frac{4b^{2}}{r^{2}}\right)\omega_{2}^{2} + 2p^{2}\right]
      $$

      **b) El momento angular en O.** Primero en $G$, con el tensor:

      $$
      \vec{H}_G = -\tfrac14 mr^{2}\omega_{1}\vec{\imath} + \tfrac14 mr^{2}\omega_{2}\vec{\jmath} + \tfrac12 mr^{2}p\,\vec{k}
      $$

      y después se cambia de punto con
      $\vec{H}_O = \vec{H}_G + \overrightarrow{OG} \times m\vec{v}_G$. Con
      $\overrightarrow{OG} = b\,\vec{\imath}$ y
      $\vec{v}_G = -\omega_{2}b\,\vec{k}$, ese producto vale
      $+m\omega_{2}b^{2}\vec{\jmath}$:

      $$
      \vec{H}_O = \frac{mr^{2}}{4}\left[-\omega_{1}\vec{\imath} + \left(1+\frac{4b^{2}}{r^{2}}\right)\omega_{2}\vec{\jmath} + 2p\,\vec{k}\right]
      $$

      **La comprobación.** Con los valores de prueba del paso 2,
      $T = 3{,}69\ \text{J}$ y
      $H_{Oy} = 0{,}80\ \text{kg}\cdot\text{m}^{2}/\text{s}$. Los dos salen
      igual sumando masa a masa sobre el disco discretizado, sin usar el
      tensor.

      **Un aviso sobre el signo.** La resolución oficial del curso escribe en
      este apartado $\overrightarrow{GO}$ donde va $\overrightarrow{OG}$ y le
      sale un signo menos en la componente vertical. El resultado impreso en
      la colección lleva el signo más, que es el correcto: la vuelta que da el
      disco alrededor del eje vertical suma momento angular vertical, no lo
      resta.
  - id: ejma10-col102-las-dos-barras-y-el-muelle
    titulo: Las dos barras articuladas y el muelle, energía potencial y cinética
    fuente: >-
      Ejercicio 10.2 · Tema 10, «Dinámica del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo, y también se ha usado la
      resolución oficial del curso para comprobarlo. En el apartado c) el
      resultado impreso no sale de los datos y se explica en el desarrollo. Los
      valores numéricos de las casillas son nuestros y se declaran en cada
      pregunta.
    nivel: practica
    enunciado: |
      La barra CD de masa $2M$ y longitud $2L$ está articulada en el punto $D$
      a un eje vertical que gira con velocidad angular constante $\omega$. En
      su punto medio, está articulada a la barra AB, de masa $M$ y longitud
      $L$, en cuyo extremo $A$ se encuentra una deslizadera que recorre el eje
      vertical sin rozamiento. Dicha deslizadera se encuentra unida al punto
      fijo $O$ mediante un resorte de longitud natural $3L$ y de constante
      elástica $Mg/L$. En la posición genérica definida por el ángulo $\phi$,
      calcular:

      a) Energía potencial del sistema.

      b) Energía cinética de la barra CD.

      c) Energía cinética de la barra AB.

