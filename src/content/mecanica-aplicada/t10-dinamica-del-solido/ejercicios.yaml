        <desc id="ejma10-col107-d">Un plano vertical pi gira alrededor de un eje vertical fijo con velocidad angular psi punto. Dentro de ese plano, una barra homogénea de masa M y longitud L, con su centro fijo en el punto O del eje, gira según el ángulo theta, medido desde la vertical hasta la barra. Los ejes móviles dibujados en O son e uno perpendicular al plano, e tres a lo largo de la barra y e dos en el plano y perpendicular a la barra. El momento de inercia de la barra a lo largo de e tres es nulo.</desc>
