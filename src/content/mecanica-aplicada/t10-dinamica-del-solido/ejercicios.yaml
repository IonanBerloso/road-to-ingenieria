      <figcaption>

      El disco en el instante del enunciado, visto de frente: X a la derecha, Y hacia arriba y Z hacia el lector. En G, p sale del papel y la velocidad de G entra en él.

      </figcaption>
      </figure>

      - **La velocidad angular del disco** es la suma de los tres giros, cada
        uno montado sobre el anterior; en ese instante, los ejes xyz del disco
        coinciden con los XYZ.
      - **El centro G** solo lo mueve $\omega_2$, que lo lleva por una
        circunferencia de radio b alrededor del eje vertical.

      $$
      \vec{\omega}_d = -\omega_{1}\vec{\imath} + \omega_{2}\vec{\jmath} + p\,\vec{k},
      \qquad
      \vec{v}_G = \omega_{2}\vec{\jmath}\times b\,\vec{\imath} = -\omega_{2}b\,\vec{k}
      $$

      **2. Incógnitas.** La energía cinética T y el momento angular
      $\vec{H}_O$, en función de m, r, b, $\omega_1$, $\omega_2$ y p.

      **3. Ecuaciones.** Los ejes xyz son de simetría del disco, y por tanto
      principales de inercia:

      $$
      I_{Gx} = I_{Gy} = \tfrac14 m r^{2},
      \qquad
      I_{Gz} = \tfrac12 m r^{2}
      $$

      La energía cinética, por König, y el momento angular, en G con el
      tensor y después cambiando de punto:

      $$
      T = \tfrac12 m v_G^{2} + \tfrac12\left(I_{Gx}\,\omega_x^{2} + I_{Gy}\,\omega_y^{2} + I_{Gz}\,\omega_z^{2}\right),
      \qquad
      \vec{H}_O = \vec{H}_G + \overrightarrow{OG}\times m\vec{v}_G
      $$

      con $\vec{H}_G = I_{Gx}\,\omega_x\vec{\imath} + I_{Gy}\,\omega_y\vec{\jmath} + I_{Gz}\,\omega_z\vec{k}$.

      **4. Resultados.** a) Con $v_G = \omega_2 b$:

      $$
      T = \tfrac12 m \omega_{2}^{2}b^{2} + \tfrac12\left(\tfrac{mr^{2}}{4}\omega_{1}^{2} + \tfrac{mr^{2}}{4}\omega_{2}^{2} + \tfrac{mr^{2}}{2}p^{2}\right)
      = \frac{mr^{2}}{8}\left[\omega_{1}^{2} + \left(1+\frac{4b^{2}}{r^{2}}\right)\omega_{2}^{2} + 2p^{2}\right]
      $$

      b) Primero en G:

      $$
      \vec{H}_G = -\tfrac14 mr^{2}\omega_{1}\vec{\imath} + \tfrac14 mr^{2}\omega_{2}\vec{\jmath} + \tfrac12 mr^{2}p\,\vec{k}
      $$

      y el cambio de punto, con $\overrightarrow{OG} = b\,\vec{\imath}$, vale
      $b\,\vec{\imath}\times\left(-m\omega_{2}b\,\vec{k}\right) = +m\omega_{2}b^{2}\vec{\jmath}$:

      $$
      \vec{H}_O = \frac{mr^{2}}{4}\left[-\omega_{1}\vec{\imath} + \left(1+\frac{4b^{2}}{r^{2}}\right)\omega_{2}\vec{\jmath} + 2p\,\vec{k}\right]
      $$

      **Son las dos expresiones publicadas.** Con los valores de prueba,
      $m = 2$ kg, $r = 0{,}2$ m, $b = 0{,}3$ m, $\omega_1 = 3$, $\omega_2 = 4$
      y $p = 10$ rad/s: $T = 1{,}44 + 2{,}25 = 3{,}69$ J y
      $H_{Oy} = 0{,}08 + 0{,}72 = 0{,}80$ kg·m²/s.

      **5. Comprobación.** Con otro reparto, sin König: el giro $\omega_2$
      alrededor del eje vertical fijo, que lleva el disco como un sólido con
      eje fijo, y los otros dos, $\omega_1$ y p, que lo giran alrededor de G.
      Para el primero, con Steiner, el momento de inercia respecto del eje
      vertical es $I_Y = 0{,}02 + 0{,}18 = 0{,}20$ kg·m², con los valores de
      prueba. Los términos cruzados entre los dos giros se anulan, porque G
      es el centro de masas y los productos de inercia del disco son nulos:

      $$
      T = \tfrac12 I_Y\,\omega_2^{2} + \tfrac12\left(I_{Gx}\,\omega_1^{2} + I_{Gz}\,p^{2}\right)
      $$

      $$
      T = \tfrac12 \cdot 0{,}20 \cdot 16 + \tfrac12\,(0{,}02 \cdot 9 + 0{,}04 \cdot 100) = 1{,}6 + 2{,}09 = 3{,}69\ \text{J}
      $$

      Y la componente vertical del momento angular solo la da el giro
      alrededor del eje vertical, $H_{Oy} = I_Y\,\omega_2 = 0{,}20 \cdot 4 = 0{,}80$
      kg·m²/s: $\omega_1$ y p giran el disco alrededor de ejes principales
      que pasan por G, y no mueven G. Lo mismo.

      **Lo que dice el resultado.** El giro propio p, el más rápido, se lleva
      más de la mitad de la energía: 2 de los 3,69 J. En el momento angular
      vertical manda en cambio el transporte, $m b^{2}\omega_2$: el disco,
      lejos del eje, aporta como una masa puntual, nueve veces más que su
      propio giro $\tfrac14 m r^{2}\omega_2$. Y $\vec{H}_O$ no es paralelo a
      $\vec{\omega}_d$: con los valores de prueba, $(-0{,}06;\ 0{,}80;\ 0{,}40)$
      frente a $(-3;\ 4;\ 10)$.

      **Un aviso sobre el signo.** La resolución oficial del curso escribe en
      este apartado $\overrightarrow{GO}$ donde va $\overrightarrow{OG}$ y le
      sale un signo menos en la componente vertical. El resultado impreso en
      la colección lleva el signo más, que es el correcto: la vuelta que da el
      disco alrededor del eje vertical suma momento angular vertical, no lo
      resta.

  - id: ejma10-col102-las-dos-barras-y-el-muelle
    titulo: Las dos barras articuladas y el muelle, energía potencial y cinética
    fuente: >-
      Ejercicio 10.2 · Tema 10, «Dinámica del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo, y también se ha usado la
      resolución oficial del curso para comprobarlo. En el apartado c) el
      resultado impreso no sale de los datos y se explica en el desarrollo. Los
      valores numéricos de las casillas son nuestros y se declaran en cada
      pregunta.
    nivel: practica
    antes:
      idea: |
        La energía potencial de un sistema es la suma de la del peso de cada
        sólido, con la altura de su centro de masas, y la de cada muelle, con
        su deformación respecto de la longitud natural. La energía cinética de
        un sólido se calcula alrededor de un punto fijo, si lo tiene, o
        separando la de su centro de masas y la del giro alrededor de él.
      formula: |
        $$
        V = \sum m_i\,g\,h_{G_i} + \tfrac12 k\,\delta^{2}
        $$

        $$
        T = \tfrac12\,\vec{\omega}\cdot\mathbf{I}_O\,\vec{\omega}\ \ \text{con O fijo},
        \qquad
        T = \tfrac12 m v_G^{2} + \tfrac12\,\vec{\omega}\cdot\mathbf{I}_G\,\vec{\omega}
        $$

        Para una barra delgada de masa m y longitud ℓ, perpendicular a ella:
        $I_G = \tfrac{1}{12} m\ell^{2}$ por su centro e
        $I = \tfrac13 m\ell^{2}$ por un extremo; a lo largo de ella,
        $I \approx 0$.
      reconocer: |
        Antes de calcular se mira dónde queda la deslizadera A en la
        posición del ángulo φ.
    enunciado: |
      La barra CD de masa $2M$ y longitud $2L$ está articulada en el punto $D$
      a un eje vertical que gira con velocidad angular constante $\omega$. En
      su punto medio, está articulada a la barra AB, de masa $M$ y longitud
      $L$, en cuyo extremo $A$ se encuentra una deslizadera que recorre el eje
      vertical sin rozamiento. Dicha deslizadera se encuentra unida al punto
      fijo $O$ mediante un resorte de longitud natural $3L$ y de constante
      elástica $Mg/L$. En la posición genérica definida por el ángulo $\phi$,
      calcular:

      a) Energía potencial del sistema.

      b) Energía cinética de la barra CD.

      c) Energía cinética de la barra AB.

      <figure>
      <svg viewBox="0 0 320 262" role="img" width="320" height="262" aria-labelledby="ejma10-col102-t ejma10-col102-d">
