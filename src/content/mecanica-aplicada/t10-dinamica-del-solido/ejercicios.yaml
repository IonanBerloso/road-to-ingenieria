      c) La derivada del momento angular es
      $d\vec{H}_G/dt = -\tfrac12 MR^{2}\omega_{1}\omega_{2}\,\vec{e}_2$. Las
      fuerzas dan $A_y + B_y = M\omega_{2}^{2}L$ y
      $A_z + B_z = Mg - M\omega_{2}^{2}L$, y $A_x = 0$. Los momentos en G,
      con A a $+L\vec{e}_1$ de C y B a $-L\vec{e}_1$, dan $A_y = B_y$ según
      $\vec{e}_3$ y $L\,(B_z - A_z) = -\tfrac12 MR^{2}\omega_{1}\omega_{2}$
      según $\vec{e}_2$:

      $$
      A_y = B_y = \frac{M\omega_{2}^{2}L}{2}
      $$

      $$
      A_z = \frac{Mg}{2} - \frac{M\omega_{2}^{2}L}{2} + \frac{MR^{2}\omega_{1}\omega_{2}}{4L},
      \qquad
      B_z = \frac{Mg}{2} - \frac{M\omega_{2}^{2}L}{2} - \frac{MR^{2}\omega_{1}\omega_{2}}{4L}
      $$

      Según $\vec{e}_1$, alrededor del propio eje, los cojinetes no dan
      momento, y lo que queda es el par del motor: $M_m = MgL$, contra el
      momento del peso del disco, colgado a L del eje.

      Las **estáticas** son las que quedan parando todo, $A_z = B_z = Mg/2$;
      las **dinámicas**, los otros dos sumandos.

      **Son los resultados publicados, con las erratas de c) que se señalan
      abajo.** Con los valores de prueba, $M = 3$ kg, $R = 0{,}2$ m,
      $L = 0{,}4$ m, $\omega_1 = 20$ y $\omega_2 = 5$ rad/s:
      $|\vec{\alpha}_d| = 100$ rad/s²,
      $|\vec{a}_E| = 25 \cdot 0{,}4 \cdot 1{,}4142 = 14{,}14$ m/s² y
      $A_y = B_y = 15$ N. Con 14,715 N de parte estática, 15 N de centrífuga y
      7,5 N de giroscópica:

      $$
      A_z = 14{,}715 - 15 + 7{,}5 = 7{,}215\ \text{N},
      \qquad
      B_z = 14{,}715 - 15 - 7{,}5 = -7{,}785\ \text{N}
      $$

      **5. Comprobación.** Tomando momentos en A, que es un punto fijo, en vez
      de en G: $\sum\vec{M}_A = d\vec{H}_G/dt + \overrightarrow{AG}\times M\vec{a}_G$.
      Con $\overrightarrow{AG} = -L\vec{e}_1 - L\vec{e}_2 + L\vec{e}_3$ y
      $\overrightarrow{AB} = -2L\vec{e}_1$, en la componente según
      $\vec{e}_2$ solo entran $B_z$ y el peso:

      $$
      2L\,B_z - MgL = -\tfrac12 MR^{2}\omega_{1}\omega_{2} - M\omega_{2}^{2}L^{2}
      $$

      $$
      0{,}8\,B_z = 3 \cdot 9{,}81 \cdot 0{,}4 - 6 - 3 \cdot 25 \cdot 0{,}16 = -6{,}228
      $$

      y $B_z = -7{,}785$ N. Con la suma de fuerzas verticales,
      $A_z = 3\,(9{,}81 - 10) + 7{,}785 = 7{,}215$ N. Lo mismo.

      **Lo que dice el resultado.** El término giroscópico, 7,5 N, es la
      mitad de la parte estática, y con la centrífuga deja a B tirando hacia
      abajo: el cojinete tiene que sujetar el eje para que no se levante. Si
      el disco no girase sobre sí mismo, ese término no existiría, y A y B
      cargarían lo mismo. El par del motor, en cambio, no tiene nada de
      giroscópico: es el del peso del disco, colgado a L del eje.

      **Dos avisos sobre lo impreso.** El resultado del apartado c) que
      publica la colección escribe $MR^{2}\omega_{1}\omega_{2}L/4$, con L
      multiplicando, cuando de las ecuaciones sale
      $MR^{2}\omega_{1}\omega_{2}/(4L)$ —con L multiplicando no serían
      newtons—, y llama $A_y = B_y = Mg/2$ a las estáticas cuando el peso es
      vertical y le toca a $A_z = B_z$. La resolución oficial del curso trae
      las dos cosas bien.

  - id: ejma10-col104-las-reacciones-del-cilindro
    titulo: Las reacciones estáticas y dinámicas de un cilindro con dos giros
    fuente: >-
      Ejercicio 10.4 · Tema 10, «Dinámica del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo, y también se ha usado la
      resolución oficial del curso para comprobarlo.
    nivel: practica
    antes:
      idea: |
        La resultante de las fuerzas es la masa por la aceleración del centro
        de masas, y el momento respecto de él, la derivada del momento
        angular. En ejes principales, cada componente del momento angular es
        el momento de inercia de ese eje por la componente de la velocidad
        angular. Si esos ejes giran, la derivada tiene dos partes: la de las
        componentes y la del giro de los propios ejes.
      formula: |
        $$
        \sum\vec{F} = M\vec{a}_G,
        \qquad
        \sum\vec{M}_G = \frac{d\vec{H}_G}{dt}
        $$

        $$
        \vec{H}_G = I_{G1}\,\omega_{1}\,\vec{e}_1 + I_{G2}\,\omega_{2}\,\vec{e}_2 + I_{G3}\,\omega_{3}\,\vec{e}_3,
        \qquad
        \frac{d\vec{H}_G}{dt} = \left(\frac{d\vec{H}_G}{dt}\right)_{\text{ejes}} + \vec{\Omega}\times\vec{H}_G
        $$

        Con $\vec{\Omega}$ la velocidad angular de los ejes, que no tiene por
        qué ser la del sólido: en un sólido de revolución, los ejes pueden
        seguir a su eje de simetría sin girar con él.
      reconocer: |
        Antes de calcular se mira qué componentes tiene la velocidad angular
        del cilindro y cómo giran los ejes.
    enunciado: |
      Calcular las reacciones estáticas y dinámicas en los apoyos $A$ y $B$.

      **Datos:** $M = 20\ \text{kg}$;
      $I_{Gx} = I_{Gz} = 0{,}1595\ \text{kg}\cdot\text{m}^{2}$;
      $I_{Gy} = 0{,}0625\ \text{kg}\cdot\text{m}^{2}$;
      $\omega_{y} = 75\ \text{rad/s}$ (constante);
      $\omega_{z} = 25\ \text{rad/s}$ (constante).

