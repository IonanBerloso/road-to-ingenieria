    pide: El momento angular de la barra respecto de su centro O y el momento que hay que aplicarle en O, en función de M, L y los dos ángulos con sus derivadas.
    pasos:
      - tipo: reconocer
        pregunta: |
          La velocidad angular de la barra tiene una componente a lo largo de
          la propia barra, $\dot{\psi}\cos\theta$. ¿Qué momento angular aporta?
        opciones:
          - texto: Ninguno, porque el momento de inercia de una barra delgada respecto de su propio eje es nulo
            correcta: true
            mensaje: |
              Eso es, y por eso $\vec{H}_O$ no tiene componente según la barra
              aunque $\vec{\omega}$ sí la tenga. Es el ejemplo más limpio de que
              $\vec{H}$ y $\vec{\omega}$ no son paralelos.
          - texto: Aporta ML²/12 por esa componente, como las otras dos
            mensaje: |
              $ML^{2}/12$ es el momento de inercia respecto de un eje
              **perpendicular** a la barra por su centro. A lo largo de la
              barra toda la masa está sobre el eje y el momento de inercia es
              nulo.
          - texto: Aporta ML²/3, porque el giro es respecto de un extremo
            mensaje: |
              $ML^{2}/3$ es respecto de un eje perpendicular por un extremo, y
              aquí el punto fijo es el centro. Además la componente de la que
              hablamos va a lo largo de la barra, no perpendicular.
          - texto: No existe esa componente, porque la barra gira dentro del plano
            mensaje: |
              Sí existe: el eje vertical no es perpendicular a la barra, así
              que al proyectar $\dot{\psi}$ sobre los ejes de la barra aparecen
              $\dot{\psi}\operatorname{sen}\theta$ y
              $\dot{\psi}\cos\theta$. Lo que pasa es que la segunda no da
              momento angular.

      - tipo: calcular
        titulo: La componente del momento angular perpendicular a la barra
        pregunta: |
          Con los valores de prueba $M = 2\ \text{kg}$, $L = 1{,}2\ \text{m}$,
          $\theta = 60^{\circ}$, $\dot{\theta} = 2\ \text{rad/s}$ y
          $\dot{\psi} = 3\ \text{rad/s}$, ¿cuánto vale la componente de
          $\vec{H}_O$ según $\vec{e}_2$, en kg·m²/s?
        respuesta:
          tipo: numero
          valor: '0.6235'
          tolerancia: 0.003
          formato: un número, en kg·m2/s
        distractores:
          - valor: '0.72'
            mensaje: |
              Has metido $\dot{\psi}$ entera. De la rotación del plano solo
              cuenta lo que queda perpendicular a la barra,
              $\dot{\psi}\operatorname{sen}\theta$.
          - valor: '0.36'
            mensaje: |
              Has proyectado con el coseno. $\dot{\psi}\cos\theta$ es la
              componente **a lo largo** de la barra, que no da momento angular;
              la que cuenta aquí es la del seno.
          - valor: '0.48'
            mensaje: |
              Esa es la componente según $\vec{e}_1$, la de $\dot{\theta}$, el
              giro de la barra dentro del plano. La pregunta es por la otra.
        pista: |
          $H_{O2} = I_{Gy}\,\dot{\psi}\operatorname{sen}\theta$ con
          $I_{Gy} = ML^{2}/12$.
        desarrollo: |
          $$
          \frac{ML^{2}}{12} = \frac{2\cdot 1{,}2^{2}}{12} = 0{,}24\ \text{kg}\cdot\text{m}^{2}
          $$

          $$
          H_{O2} = 0{,}24 \cdot 3 \cdot \operatorname{sen}60^{\circ} = 0{,}6235\ \text{kg}\cdot\text{m}^{2}/\text{s}
          $$

      - tipo: calcular
        titulo: El momento según el eje perpendicular al plano
        pregunta: |
          Con los mismos valores y además $\ddot{\theta} = 0$, ¿cuánto vale la
          componente de $\vec{M}_O$ según $\vec{e}_1$, en N·m?
        respuesta:
          tipo: numero
          valor: '-0.9353'
          tolerancia: 0.005
          formato: un número, en N·m
        distractores:
          - valor: '0'
            mensaje: |
              Con $\ddot{\theta} = 0$ se anula la derivada de la componente,
              pero no el término $\vec{\Omega}\times\vec{H}_O$ de la fórmula de
              Boure, que aquí aporta
              $-\dot{\psi}^{2}\operatorname{sen}\theta\cos\theta$.
          - valor: '0.9353'
            mensaje: |
              El signo. El término de Boure entra restando:
              $\ddot{\theta} - \dot{\psi}^{2}\operatorname{sen}\theta\cos\theta$,
              y con $\ddot{\theta} = 0$ el resultado es negativo.
          - valor: '-1.8706'
            mensaje: |
              Has usado $\operatorname{sen}2\theta$ donde va
              $\operatorname{sen}\theta\cos\theta$, que es su mitad.
        pista: |
          $M_{O1} = \dfrac{ML^{2}}{12}\left(\ddot{\theta} - \dot{\psi}^{2}\operatorname{sen}\theta\cos\theta\right)$.
        desarrollo: |
          $$
          M_{O1} = 0{,}24\left(0 - 9\cdot 0{,}8660\cdot 0{,}5\right) = -0{,}9353\ \text{N}\cdot\text{m}
          $$

      - tipo: calcular
        titulo: El momento según el eje del plano perpendicular a la barra
        pregunta: |
          Con los mismos valores y $\ddot{\psi} = 1\ \text{rad/s}^{2}$, ¿cuánto
          vale la componente de $\vec{M}_O$ según $\vec{e}_2$, en N·m?
        respuesta:
          tipo: numero
          valor: '1.6478'
          tolerancia: 0.005
          formato: un número, en N·m
        distractores:
          - valor: '0.2078'
            mensaje: |
              Solo has derivado la componente:
              $\ddot{\psi}\operatorname{sen}\theta$. Falta todo el término de
              Boure, que aquí es el sumando grande.
          - valor: '1.44'
            mensaje: |
              Te has quedado con el término de Boure y has perdido la parte de
              $\ddot{\psi}$, que existe porque el giro del plano se está
              acelerando.
          - valor: '0.9278'
            mensaje: |
              Te falta el 2 del término
              $2\dot{\psi}\dot{\theta}\cos\theta$. Aparecen dos sumandos
              iguales: uno de derivar
              $\dot{\psi}\operatorname{sen}\theta$ y otro del producto
              vectorial.
        pista: |
          $M_{O2} = \dfrac{ML^{2}}{12}\left(\ddot{\psi}\operatorname{sen}\theta + 2\dot{\psi}\dot{\theta}\cos\theta\right)$.
        desarrollo: |
          $$
          M_{O2} = 0{,}24\left(1\cdot 0{,}8660 + 2\cdot 3\cdot 2\cdot 0{,}5\right) = 0{,}24\cdot 6{,}866 = 1{,}6478\ \text{N}\cdot\text{m}
          $$

      - tipo: justificar
        pregunta: Ordena el cálculo del momento en O. Una pieza es falsa.
        piezas:
          - texto: 'La velocidad angular de la barra es $\vec{\omega} = \dot{\theta}\,\vec{e}_1 + \dot{\psi}\operatorname{sen}\theta\,\vec{e}_2 + \dot{\psi}\cos\theta\,\vec{e}_3$.'
          - texto: 'Como $I_{Gz} = 0$ a lo largo de la barra, $\vec{H}_O = \tfrac{ML^{2}}{12}\dot{\theta}\,\vec{e}_1 + \tfrac{ML^{2}}{12}\dot{\psi}\operatorname{sen}\theta\,\vec{e}_2$, sin componente según la barra.'
          - texto: 'Los ejes están unidos a la barra, así que $\vec{M}_O = \left(d\vec{H}_O/dt\right)_{\text{rel}} + \vec{\omega}\times\vec{H}_O$, y hay que sumar los dos trozos.'
          - texto: 'Como $O$ es un punto fijo y los ejes son principales, basta con derivar las dos componentes de $\vec{H}_O$ respecto del tiempo.'
            trampa: true
            mensaje: |
              Eso da solo la primera mitad. Las componentes están escritas en
              unos ejes que giran con la barra, así que la derivada verdadera
              lleva además $\vec{\omega}\times\vec{H}_O$. De hecho el término
              $-\dot{\psi}^{2}\operatorname{sen}\theta\cos\theta$ y uno de los
              dos $\dot{\psi}\dot{\theta}\cos\theta$ salen justo de ahí.
    resolucion: |
      **Los ejes y la velocidad angular.** Se toman ejes unidos a la barra con
      el origen en $O$, que es punto fijo: $\vec{e}_3$ a lo largo de la barra,
      $\vec{e}_1$ perpendicular al plano $\pi$ y $\vec{e}_2$ en el plano,
      perpendicular a la barra. El giro del plano es vertical y la vertical
      forma $\theta$ con la barra, así que

      $$
      \vec{\omega} = \dot{\theta}\,\vec{e}_1 + \dot{\psi}\operatorname{sen}\theta\,\vec{e}_2 + \dot{\psi}\cos\theta\,\vec{e}_3
      $$

      **a) El momento angular.** Para una barra delgada
      $I_{Gx} = I_{Gy} = ML^{2}/12$ y $I_{Gz} = 0$, así que la tercera
      componente de $\vec{\omega}$ no aporta nada:

      $$
      \vec{H}_O = \frac{ML^{2}}{12}\,\dot{\theta}\,\vec{e}_1 + \frac{ML^{2}}{12}\,\dot{\psi}\operatorname{sen}\theta\,\vec{e}_2
      $$

      **b) Los momentos en O.** Los ejes giran con la barra, con
      $\vec{\Omega} = \vec{\omega}$, así que hay que derivar con Boure. La parte
      relativa es

      $$
      \left(\frac{d\vec{H}_O}{dt}\right)_{\text{rel}} = \frac{ML^{2}}{12}\ddot{\theta}\,\vec{e}_1 + \frac{ML^{2}}{12}\left(\ddot{\psi}\operatorname{sen}\theta + \dot{\psi}\dot{\theta}\cos\theta\right)\vec{e}_2
      $$

      y el producto vectorial añade

      $$
      \vec{\omega}\times\vec{H}_O = \frac{ML^{2}}{12}\left(-\dot{\psi}^{2}\operatorname{sen}\theta\cos\theta\,\vec{e}_1 + \dot{\psi}\dot{\theta}\cos\theta\,\vec{e}_2\right)
      $$

      Sumando los dos:

      $$
      \vec{M}_O = \frac{ML^{2}}{12}\left(\ddot{\theta} - \dot{\psi}^{2}\operatorname{sen}\theta\cos\theta\right)\vec{e}_1 + \frac{ML^{2}}{12}\left(\ddot{\psi}\operatorname{sen}\theta + 2\dot{\psi}\dot{\theta}\cos\theta\right)\vec{e}_2
      $$

      **Qué significa.** El peso está aplicado en $O$, que es el centro de
      gravedad, así que no da momento: todo esto lo hacen las reacciones del
      apoyo. Fíjate en el segundo sumando de $\vec{e}_2$: el 2 aparece porque
      dos caminos distintos —derivar la componente y el producto vectorial—
      dan el mismo término. Quien solo derive las componentes se deja la mitad.

      **La comprobación.** Con $M = 2\ \text{kg}$, $L = 1{,}2\ \text{m}$,
      $\theta = 60^{\circ}$, $\dot{\theta} = 2$, $\ddot{\theta} = 0$,
      $\dot{\psi} = 3$ y $\ddot{\psi} = 1$ salen
      $H_{O1} = 0{,}480$ y $H_{O2} = 0{,}6235\ \text{kg}\cdot\text{m}^{2}/\text{s}$,
      $M_{O1} = -0{,}9353$ y $M_{O2} = 1{,}6478\ \text{N}\cdot\text{m}$. Las
      cuatro cifras se han obtenido también por otro camino: discretizando la
      barra en masas puntuales, calculando
      $\sum m_i\,\vec{r}_i\times\vec{v}_i$ en ejes fijos y derivando
      numéricamente, sin usar el tensor de inercia ni la fórmula de Boure.
