      - tipo: calcular
        titulo: La componente del momento angular perpendicular a la barra
        pregunta: |
          Con los valores de prueba $M = 2\ \text{kg}$, $L = 1{,}2\ \text{m}$,
          $\theta = 60^{\circ}$, $\dot{\theta} = 2\ \text{rad/s}$ y
          $\dot{\psi} = 3\ \text{rad/s}$, ¿cuánto vale la componente de
          $\vec{H}_O$ según $\vec{e}_2$, en kg·m²/s?
        respuesta:
          tipo: numero
          valor: '0.6235'
          tolerancia: 0.003
          formato: un número, en kg·m2/s
        distractores:
          - valor: '0.72'
            mensaje: |
              Has metido $\dot{\psi}$ entera. De la rotación del plano solo
              cuenta lo que queda perpendicular a la barra,
              $\dot{\psi}\operatorname{sen}\theta$.
          - valor: '0.36'
            mensaje: |
              Has proyectado con el coseno. $\dot{\psi}\cos\theta$ es la
              componente **a lo largo** de la barra, que no da momento angular;
              la que cuenta aquí es la del seno.
          - valor: '0.48'
            mensaje: |
              Esa es la componente según $\vec{e}_1$, la de $\dot{\theta}$, el
              giro de la barra dentro del plano. La pregunta es por la otra.
        pista: |
          $H_{O2} = I_{Gy}\,\dot{\psi}\operatorname{sen}\theta$ con
          $I_{Gy} = ML^{2}/12$.
        desarrollo: |
          $$
          \frac{ML^{2}}{12} = \frac{2\cdot 1{,}2^{2}}{12} = 0{,}24\ \text{kg}\cdot\text{m}^{2}
          $$

          $$
          H_{O2} = 0{,}24 \cdot 3 \cdot \operatorname{sen}60^{\circ} = 0{,}6235\ \text{kg}\cdot\text{m}^{2}/\text{s}
          $$

      - tipo: calcular
        titulo: El momento según el eje perpendicular al plano
        pregunta: |
          Con los mismos valores y además $\ddot{\theta} = 0$, ¿cuánto vale la
          componente de $\vec{M}_O$ según $\vec{e}_1$, en N·m?
        respuesta:
          tipo: numero
          valor: '-0.9353'
          tolerancia: 0.005
          formato: un número, en N·m
        distractores:
          - valor: '0'
            mensaje: |
              Con $\ddot{\theta} = 0$ se anula la derivada de la componente,
              pero no el término $\vec{\Omega}\times\vec{H}_O$ de la fórmula de
              Boure, que aquí aporta
              $-\dot{\psi}^{2}\operatorname{sen}\theta\cos\theta$.
          - valor: '0.9353'
            mensaje: |
              El signo. El término de Boure entra restando:
              $\ddot{\theta} - \dot{\psi}^{2}\operatorname{sen}\theta\cos\theta$,
              y con $\ddot{\theta} = 0$ el resultado es negativo.
          - valor: '-1.8706'
            mensaje: |
              Has usado $\operatorname{sen}2\theta$ donde va
              $\operatorname{sen}\theta\cos\theta$, que es su mitad.
        pista: |
          $M_{O1} = \dfrac{ML^{2}}{12}\left(\ddot{\theta} - \dot{\psi}^{2}\operatorname{sen}\theta\cos\theta\right)$.
        desarrollo: |
          $$
          M_{O1} = 0{,}24\left(0 - 9\cdot 0{,}8660\cdot 0{,}5\right) = -0{,}9353\ \text{N}\cdot\text{m}
          $$

      - tipo: calcular
        titulo: El momento según el eje del plano perpendicular a la barra
        pregunta: |
          Con los mismos valores y $\ddot{\psi} = 1\ \text{rad/s}^{2}$, ¿cuánto
          vale la componente de $\vec{M}_O$ según $\vec{e}_2$, en N·m?
        respuesta:
          tipo: numero
          valor: '1.6478'
          tolerancia: 0.005
          formato: un número, en N·m
        distractores:
          - valor: '0.2078'
            mensaje: |
              Te has quedado con $\ddot{\psi}\operatorname{sen}\theta$. Al
              derivar $\dot{\psi}\operatorname{sen}\theta$ falta el
              $\dot{\psi}\dot{\theta}\cos\theta$ del seno, y falta otro igual
              del término de Boure: entre los dos son el sumando grande.
          - valor: '1.44'
            mensaje: |
              Te has quedado con los dos sumandos de
              $2\dot{\psi}\dot{\theta}\cos\theta$ y has perdido el de
              $\ddot{\psi}$, que existe porque el giro del plano se está
              acelerando.
          - valor: '0.9278'
            mensaje: |
              Te falta el 2 del término
              $2\dot{\psi}\dot{\theta}\cos\theta$. Aparecen dos sumandos
              iguales: uno de derivar
              $\dot{\psi}\operatorname{sen}\theta$ y otro del producto
              vectorial.
        pista: |
          $M_{O2} = \dfrac{ML^{2}}{12}\left(\ddot{\psi}\operatorname{sen}\theta + 2\dot{\psi}\dot{\theta}\cos\theta\right)$.
        desarrollo: |
          $$
          M_{O2} = 0{,}24\left(1\cdot 0{,}8660 + 2\cdot 3\cdot 2\cdot 0{,}5\right) = 0{,}24\cdot 6{,}866 = 1{,}6478\ \text{N}\cdot\text{m}
          $$

      - tipo: justificar
        pregunta: Ordena el cálculo del momento en O. Una pieza es falsa.
        piezas:
          - texto: 'La velocidad angular de la barra es $\vec{\omega} = \dot{\theta}\,\vec{e}_1 + \dot{\psi}\operatorname{sen}\theta\,\vec{e}_2 + \dot{\psi}\cos\theta\,\vec{e}_3$.'
          - texto: 'Como $I_{Gz} = 0$ a lo largo de la barra, $\vec{H}_O = \tfrac{ML^{2}}{12}\dot{\theta}\,\vec{e}_1 + \tfrac{ML^{2}}{12}\dot{\psi}\operatorname{sen}\theta\,\vec{e}_2$, sin componente según la barra.'
          - texto: 'Los ejes están unidos a la barra, así que $\vec{M}_O = \left(d\vec{H}_O/dt\right)_{\text{rel}} + \vec{\omega}\times\vec{H}_O$, y hay que sumar los dos trozos.'
          - texto: 'Como $O$ es un punto fijo y los ejes son principales, basta con derivar las dos componentes de $\vec{H}_O$ respecto del tiempo.'
            trampa: true
            mensaje: |
              Eso da solo la primera mitad. Las componentes están escritas en
              unos ejes que giran con la barra, así que la derivada verdadera
              lleva además $\vec{\omega}\times\vec{H}_O$. De hecho el término
              $-\dot{\psi}^{2}\operatorname{sen}\theta\cos\theta$ y uno de los
              dos $\dot{\psi}\dot{\theta}\cos\theta$ salen justo de ahí.
    resolucion: |
      **1. Sólidos libres.** Es un problema de dinámica de un sólido con un
      punto fijo: el dibujo lleva la barra sola, sin el plano ni el apoyo de
      O, en la perspectiva del enunciado.

