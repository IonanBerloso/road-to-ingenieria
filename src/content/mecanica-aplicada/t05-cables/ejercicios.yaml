      <figcaption>

      El tramo **GH** cuelga libre, así que su peso es la tensión del cable en
      **G**. El cable sale horizontal de **D**, que es por tanto su punto más
      bajo.

      </figcaption>
      </figure>
    pide: La carga P y los esfuerzos en las barras BD y CD.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué se sabe de la tensión del cable en $G$?
        opciones:
          - texto: >-
              Que vale el peso del tramo GH que cuelga libre, 200 N, porque el
              cable pasa por G sin rozamiento
            correcta: true
            mensaje: |
              Eso es. El trozo $GH$ cuelga vertical con su extremo libre, así
              que su tensión arriba es su propio peso, $20 \cdot 10 = 200$ N.
              Y como el cable solo pasa por $G$, esa es también la tensión del
              lado de la catenaria.
          - texto: Que vale T0, la tensión horizontal, porque es la misma en todo el cable
            mensaje: |
              Lo que se conserva es la **componente horizontal**, no la
              tensión total. En $G$ el cable está inclinado 30 grados, así que
              su tensión es mayor que $T_0$.
          - texto: Que vale el peso de todo el cable, del tramo DG más el GH
            mensaje: |
              El peso del tramo $DG$ lo aguantan entre $G$ y el amarre $D$, no
              solo $G$. Lo que fija la tensión en $G$ es el trozo que cuelga
              libre por el otro lado, $GH$.

      - tipo: calcular
        titulo: La tensión horizontal del cable
        pregunta: |
          ¿Cuánto vale $T_0$?
        respuesta:
          tipo: magnitud
          valor: '173.2 N'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '200 N'
            mensaje: |
              Esa es la tensión en $G$, que es la máxima del tramo. $T_0$ es su
              **proyección horizontal**, y en $G$ el cable está a 30 grados:
              $T_0 = 200\cos 30^{\circ}$.
          - valor: '100 N'
            mensaje: |
              Has proyectado con el seno. La componente horizontal lleva el
              coseno del ángulo con la horizontal; con el seno sale la
              vertical, que es el peso del tramo $DG$.
        pista: |
          $T_G = 20 \cdot 10 = 200$ N, y $T_0 = T_G\cos 30^{\circ}$.
        desarrollo: |
          $$
          T_G = w \cdot GH = 20 \cdot 10 = 200\ \text{N}
          \qquad
          T_0 = T_G\cos 30^{\circ} = 100\sqrt{3} = 173{,}2\ \text{N}
          $$

          De paso, $c = T_0/w = 8{,}66$ m y $y_G = T_G/w = 10$ m: el extremo
          libre $H$ queda justo sobre la directriz de la catenaria.

      - tipo: calcular
        titulo: La carga P
        pregunta: |
          Tomando momentos en $A$ sobre la estructura entera, ¿cuánto vale $P$?
        respuesta:
          tipo: magnitud
          valor: '75 N'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '86.6 N'
            mensaje: |
              Arrastras $T_0 = 200$ N, la tensión en $G$ en vez de su
              componente horizontal. El cable tira de $D$ en horizontal, y esa
              horizontal vale $200\cos 30^{\circ}$.
          - valor: '43.3 N'
            mensaje: |
              Arrastras $T_0 = 100$ N, de proyectar con el seno. Con
              $T_0 = 173{,}2$ N y los brazos de la figura sale el doble
              largo.
        pista: |
          El cable tira de $D$ en horizontal con $T_0$, y $D$ está a
          $L\sqrt{3}/2$ por debajo de $A$. La carga $P$ cuelga de $F$, a $2L$
          de $A$ en horizontal.
        desarrollo: |
          $$
          T_0 \cdot \frac{\sqrt{3}}{2}L = P \cdot 2L
          \;\Longrightarrow\;
          P = \frac{\sqrt{3}}{4}\,T_0 = \frac{\sqrt{3}}{4}\cdot 100\sqrt{3}
          = 75\ \text{N}
          $$

          El lado $L$ se va, que es lo que tenía que pasar: no lo da el
          enunciado.

      - tipo: calcular
        titulo: El esfuerzo en la barra BD
        pregunta: |
          ¿Cuánto vale el esfuerzo en $BD$?
        respuesta:
          tipo: magnitud
          valor: '129.9 N'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '75 N'
            mensaje: |
              Esa es la carga $P$. La barra $BD$ está inclinada 60 grados, así
              que para dar el momento que hace falta en $C$ tiene que valer
              $\sqrt{3}P$, no $P$.
          - valor: '43.3 N'
            mensaje: |
              Ese es el esfuerzo de $CE$, que trabaja a compresión con
              $P/\sqrt{3}$. La barra $BD$ es la que cierra el momento respecto
              de $C$ y sale bastante mayor.
        pista: |
          Corta por $BD$, $CD$ y $CE$ y toma momentos en $C$ del trozo de la
          derecha: el cable pasa por la línea de $C$ y $D$ y no da momento.
        desarrollo: |
          $$
          \frac{\sqrt{3}}{2}L\,N_{BD} = \frac{3L}{2}\,P
          \;\Longrightarrow\;
          N_{BD} = \sqrt{3}\,P = 75\sqrt{3} = 129{,}9\ \text{N}\ \text{(tracción)}
          $$

          Y con el equilibrio horizontal de ese mismo trozo,
          $N_{CD} = 75\sqrt{3} = 129{,}9$ N, también a tracción.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'El tramo GH cuelga libre: la tensión del cable en G es su peso, 200 N.'
          - texto: Como el cable solo pasa por $G$, esa es la tensión de la catenaria allí, y $T_0 = 200\cos 30^{\circ} = 173{,}2$ N.
          - texto: 'El cable tira de D en horizontal con $T_0$: momentos en $A$ dan $T_0(\sqrt{3}/2)L = 2LP$, o sea $P = 75$ N.'
          - texto: Cortando por $BD$, $CD$ y $CE$ y tomando momentos en $C$ sale $N_{BD} = \sqrt{3}P$, y con las fuerzas horizontales, $N_{CD} = \sqrt{3}P$.
          - texto: La tensión del cable en D vale también 200 N, porque la tensión es la misma en todo el cable.
            trampa: true
            mensaje: |
              En $D$ la tangente es horizontal, así que $D$ es el punto más
              bajo y su tensión es la **mínima**, $T_0 = 173{,}2$ N. Los 200 N
              son la tensión en $G$, donde el cable está inclinado y carga
              además con el peso del tramo $DG$.
    resolucion: |
      **El cable.** El tramo $GH$ cuelga libre, así que la tensión del cable en
      $G$ es su peso:

      $$
      T_G = 20 \cdot 10 = 200\ \text{N}
      $$

      En $G$ el cable forma 30 grados con la horizontal, y en $D$ es
      horizontal, o sea que $D$ es el punto más bajo:

      $$
      T_0 = T_G\cos 30^{\circ} = 100\sqrt{3} = 173{,}2\ \text{N}
      \qquad
      c = \frac{T_0}{w} = 8{,}66\ \text{m}
      $$

      Como comprobación, $y_G = T_G/w = 10$ m y $c/\cos 30^{\circ} = 10$ m:
      cuadran.

      **La carga P.** El cable tira de la estructura en $D$, en horizontal.
      Momentos en $A$ de la estructura entera, con $D$ a $\sqrt{3}L/2$ por
      debajo de $A$ y $F$ a $2L$ en horizontal:

      $$
      T_0\,\frac{\sqrt{3}}{2}L = 2LP
      \;\Longrightarrow\;
      P = \frac{\sqrt{3}}{4}T_0 = 75\ \text{N}
      $$

      **Las barras.** Con una sección que corte $BD$, $CD$ y $CE$, y momentos
      en $C$ del trozo de la derecha:

      $$
      N_{BD} = \sqrt{3}\,P = 129{,}9\ \text{N}\ \text{(t)}
      \qquad
      N_{CD} = \sqrt{3}\,P = 129{,}9\ \text{N}\ \text{(t)}
      $$

      **Comprobación.** Resolviendo la celosía nudo a nudo con las nueve barras
      salen las mismas dos, y el resto queda equilibrado: $CE$ y $EF$ a
      compresión con $P/\sqrt{3} = 43{,}3$ N y $DF$ a tracción con
      $2P/\sqrt{3} = 86{,}6$ N.

  - id: ejma5-col58-el-disco-y-el-bloque-unidos-por-el-cable
    titulo: Un disco a punto de deslizar que tira de un bloque
    fuente: >-
      Ejercicio 5.8 · Tema 5, «Cables» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección lo incluye en el bloque que marca como de nivel
      de examen, y publica el resultado, contra el que está contrastado el
      desarrollo.
    nivel: practica
    enunciado: |
      Un disco de masa $M$ y radio $R$ está unido por su punto superior $B$ a
      un bloque $A$ de masa $4M$ y dimensiones despreciables mediante un cable
      de peso por unidad de longitud $q$ (desconocido). Bloque y disco están
      apoyados sobre un suelo rugoso de forma que en el contacto entre disco y
      suelo el coeficiente de rozamiento es $f = 3/5$. Sobre el disco se aplica
      una fuerza horizontal $F$ de forma que, cuando $F = 6Mg$, el disco se
      encuentra a punto de deslizar. Si el cable presenta una pendiente
      horizontal en el punto $A$, calcular:

      a. Tensión en el cable en el punto $B$.

      b. Parámetro de catenaria.

      c. Valor de $q$.

      d. Longitud del cable.

      e. Mínimo coeficiente de rozamiento entre suelo-bloque para que el bloque
      se mantenga en equilibrio.

      <figure>
      <svg viewBox="0 0 300 220" role="img" width="300" height="220" aria-labelledby="ejma5-col58-t ejma5-col58-d">
        <title id="ejma5-col58-t">Cable con peso propio entre un bloque en el suelo y el punto alto de un disco</title>
        <desc id="ejma5-col58-d">Un bloque pequeño A apoyado en el suelo, a la izquierda, y un disco de radio R apoyado en el mismo suelo, a la derecha. Un cable con peso propio va de A, donde sale horizontal, hasta B, el punto más alto del disco, a dos radios de altura. Sobre el centro C del disco actúa una fuerza horizontal F hacia la derecha, y D es el punto de contacto del disco con el suelo. La catenaria está dibujada con su ecuación, con parámetro tres veces el radio.</desc>
        <defs>
          <marker id="ejma5-col58-f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
        </defs>
        <line x1="26" y1="190" x2="288" y2="190" stroke="var(--ink)" stroke-width="1.3"/>
        <path d="M30 190 L24 198 M46 190 L40 198 M62 190 L56 198 M78 190 L72 198 M94 190 L88 198 M110 190 L104 198 M126 190 L120 198 M142 190 L136 198 M158 190 L152 198 M174 190 L168 198 M190 190 L184 198 M206 190 L200 198 M222 190 L216 198 M238 190 L232 198 M254 190 L248 198 M270 190 L264 198 M286 190 L280 198" fill="none" stroke="var(--faint)" stroke-width="0.9"/>

        <circle cx="198.4" cy="148" r="42" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.3"/>
        <rect x="34" y="178" width="26" height="12" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/>
        <text x="28" y="188" font-size="10" text-anchor="end" fill="var(--ink)">A</text>

        <path d="M60 190 L67.7 189.8 L75.4 189.1 L83.1 187.9 L90.8 186.2 L98.5 184.1 L106.1 181.5 L113.8 178.3 L121.5 174.7 L129.2 170.5 L136.9 165.8 L144.6 160.5 L152.3 154.7 L160 148.2 L167.7 141.1 L175.4 133.4 L183 125 L190.7 115.9 L198.4 106" fill="none" stroke="var(--d1)" stroke-width="2.2"/>
        <text x="112" y="152" font-size="10" text-anchor="middle" fill="var(--d1)">q?</text>

        <circle cx="60" cy="190" r="3" fill="var(--ink)"/>
        <circle cx="198.4" cy="106" r="3" fill="var(--ink)"/>
        <circle cx="198.4" cy="148" r="2.4" fill="var(--ink)"/>
        <text x="206" y="102" font-size="10" fill="var(--ink)">B</text>
        <text x="190" y="144" font-size="10" text-anchor="end" fill="var(--ink)">C</text>
        <text x="206" y="186" font-size="10" fill="var(--ink)">D</text>

        <line x1="198.4" y1="148" x2="252" y2="148" stroke="var(--flag)" stroke-width="1.8" marker-end="url(#ejma5-col58-f)"/>
        <text x="258" y="152" font-size="10" fill="var(--flag)">F</text>
        <line x1="240" y1="148" x2="240" y2="190" stroke="var(--faint)" stroke-width="0.8"/>
        <path d="M236 148 L244 148 M236 190 L244 190" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="246" y="172" font-size="9" fill="var(--faint)">R</text>
      </svg>
      <figcaption>

      El cable sale horizontal de **A**, que es por tanto su punto más bajo, y
      llega al punto más alto del disco, **B**, a **2R** del suelo. La
      directriz de la catenaria queda **3R** por debajo de **A**.

      </figcaption>
      </figure>
    pide: La tensión en B, el parámetro de catenaria, q, la longitud del cable y el coeficiente mínimo bajo el bloque.
    pasos:
      - tipo: reconocer
        pregunta: |
          Para usar $T = q\,y$ en el punto $B$, ¿desde dónde se mide esa $y$?
        opciones:
          - texto: >-
              Desde la directriz, que está a una distancia c por debajo de A,
              así que la altura de B sobre la directriz es c más 2R
            correcta: true
            mensaje: |
              Eso es. El origen de las fórmulas de la catenaria está $c$ por
              debajo del punto más bajo, y el punto más bajo es $A$, en el
              suelo. Como $B$ está $2R$ más arriba, $y_B = c + 2R$.
          - texto: Desde A, que es el punto más bajo del cable, así que la y de B es 2R
            mensaje: |
              Ese es el error clásico del tema. Con ese origen, $T = qy$
              dejaría de valer: la fórmula cuenta desde la directriz, y en el
              punto más bajo $y$ no es cero sino $c$.
          - texto: Desde el centro del disco, que es donde se aplica la fuerza F
            mensaje: |
              El centro del disco no pinta nada en la geometría del cable. El
              eje de la catenaria lo fija el propio cable: una distancia $c$
              por debajo de su punto más bajo.

      - tipo: calcular
        titulo: La tensión en B
        pregunta: |
          Con el equilibrio del disco, ¿cuánto vale $T_B$ en unidades de $Mg$?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.02
          formato: un número, T_B dividido por Mg
        distractores:
          - valor: '3'
            mensaje: |
              Esa es solo la componente horizontal, que sale de los momentos en
              el punto de contacto. Falta la vertical, que sale de la condición
              de deslizamiento inminente, y las dos se combinan con Pitágoras.
          - valor: '7'
            mensaje: |
              Has sumado las dos componentes, $3Mg$ y $4Mg$, como si fueran
              paralelas. Son perpendiculares: $\sqrt{3^{2}+4^{2}} = 5$.
        pista: |
          Momentos en el punto de contacto $D$ dan la horizontal; luego
          $F_r = f\,N$ con $N = Mg + T_{By}$ da la vertical.
        desarrollo: |
          Momentos en $D$: $T_{Bx}\cdot 2R = F\cdot R = 6MgR$, o sea
          $T_{Bx} = 3Mg$. Equilibrio horizontal: $F_r = F - T_{Bx} = 3Mg$. Con
          deslizamiento inminente,

          $$
          3Mg = \frac{3}{5}\,(Mg + T_{By})
          \;\Longrightarrow\;
          T_{By} = 4Mg
          $$

          $$
          T_B = \sqrt{(3Mg)^{2}+(4Mg)^{2}} = 5Mg
          $$

      - tipo: calcular
        titulo: El parámetro de catenaria
        pregunta: |
          ¿Cuánto vale $c$ en unidades de $R$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.02
          formato: un número, c dividido por R
        distractores:
          - valor: '1.2'
            mensaje: |
              Sale de medir la $y$ desde $A$: con $5Mg = q\cdot 2R$ se obtiene
              $q = 2{,}5Mg/R$ y $c = 3Mg/q = 1{,}2R$. La $y$ se mide desde la
              directriz, y por eso $y_B = c + 2R$.
          - valor: '5'
            mensaje: |
              Ese es $y_B/R$, la altura de $B$ sobre la directriz. El parámetro
              es la altura del **punto más bajo**, que es $2R$ menos: $c = 3R$.
        pista: |
          $T_{Bx} = qc$ y $T_B = q\,y_B$ con $y_B = c + 2R$. Divide una entre
          otra y desaparece la $q$.
        desarrollo: |
          $$
          \frac{T_B}{T_{Bx}} = \frac{y_B}{c} = \frac{c+2R}{c} = \frac{5}{3}
          \;\Longrightarrow\;
          c = 3R
          $$

      - tipo: calcular
        titulo: El peso por unidad de longitud
        pregunta: |
          ¿Cuánto vale $q$ en unidades de $Mg/R$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.02
          formato: un número, q dividido por Mg entre R
        distractores:
          - valor: '2.5'
            mensaje: |
              Sale de medir la altura de $B$ desde $A$, $5Mg = q\cdot 2R$. Hay
              que contar desde la directriz, donde $y_B = 5R$.
          - valor: '2'
            mensaje: |
              Has usado la componente vertical, $4Mg = q\cdot 2R$. La relación
              $T = qy$ es con la tensión **total** y la altura sobre la
              directriz, no con la componente vertical.
        pista: |
          $q = T_{Bx}/c$, con $T_{Bx} = 3Mg$ y $c = 3R$.
        desarrollo: |
          $$
          q = \frac{T_{Bx}}{c} = \frac{3Mg}{3R} = \frac{Mg}{R}
          $$

          Comprobación con la otra fórmula: $T_B = q\,y_B = (Mg/R)(5R) = 5Mg$.

      - tipo: calcular
        titulo: El coeficiente mínimo bajo el bloque
        pregunta: |
          ¿Cuál es el coeficiente de rozamiento mínimo entre el bloque y el
          suelo?
        respuesta:
          tipo: numero
          valor: '0.75'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '0.6'
            mensaje: |
              Ese es el coeficiente del contacto disco-suelo, un dato del
              enunciado. El del bloque hay que calcularlo: el bloque pesa $4Mg$
              y el cable tira de él en horizontal con $3Mg$.
          - valor: '0.375'
            mensaje: |
              Has puesto $8Mg$ de normal, sumándole al peso del bloque la
              vertical del cable. En $A$ el cable es **horizontal**: no tiene
              componente vertical y no aprieta el bloque contra el suelo.
        pista: |
          En $A$ el cable tira en horizontal con $T_0 = qc = 3Mg$, y la normal
          bajo el bloque es solo su peso, $4Mg$.
        desarrollo: |
          $$
          \mu_{\min} = \frac{T_0}{4Mg} = \frac{3Mg}{4Mg} = \frac{3}{4} = 0{,}75
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: Momentos en el contacto del disco dan $T_{Bx} = 3Mg$, y el deslizamiento inminente, $T_{By} = 4Mg$, o sea $T_B = 5Mg$.
          - texto: 'Con la directriz a $c$ bajo $A$: $T_{Bx} = qc$ y $T_B = q(c+2R)$, y dividiendo sale $c = 3R$ y $q = Mg/R$.'
          - texto: La longitud es $s = T_{By}/q = 4R$, y cuadra con $y^{2} = c^{2}+s^{2}$, porque $25 = 9 + 16$.
          - texto: En $A$ el cable tira en horizontal con $3Mg$ y el bloque pesa $4Mg$, así que $\mu_{\min} = 3/4$.
          - texto: Como el cable tira del bloque hacia arriba, su normal es 4Mg más la vertical del cable.
            trampa: true
            mensaje: |
              El enunciado dice que en $A$ la pendiente del cable es
              horizontal: allí la tensión no tiene componente vertical, así que
              no descarga ni aprieta el bloque. La normal es exactamente su
              peso, $4Mg$.
    resolucion: |
      **El disco.** Tomando momentos en el punto de contacto con el suelo, la
      fuerza $F$ aplicada en el centro y la tensión del cable en $B$, a $2R$ de
      altura, se equilibran:

      $$
      T_{Bx}\cdot 2R = 6Mg\cdot R
      \;\Longrightarrow\;
      T_{Bx} = 3Mg
      $$

      El equilibrio horizontal da $F_r = 6Mg - 3Mg = 3Mg$, y como el disco está
      a punto de deslizar, $F_r = \frac{3}{5}N$ con $N = Mg + T_{By}$:

      $$
      T_{By} = 4Mg
      \qquad
      T_B = \sqrt{(3Mg)^{2}+(4Mg)^{2}} = 5Mg
      $$

      **La catenaria.** El cable sale horizontal de $A$, que es su punto más
      bajo, y la directriz está $c$ por debajo. Con $T_{Bx} = qc$ y
      $T_B = q\,y_B$, siendo $y_B = c + 2R$:

      $$
      \frac{c+2R}{c} = \frac{5}{3}
      \;\Longrightarrow\;
      c = 3R
      \qquad
      q = \frac{3Mg}{3R} = \frac{Mg}{R}
      $$

      **La longitud.**

      $$
      s = \frac{T_{By}}{q} = \frac{4Mg}{Mg/R} = 4R
      $$

      y se comprueba con $y^{2} = c^{2}+s^{2}$: $(5R)^{2} = (3R)^{2}+(4R)^{2}$.

      **El bloque.** En $A$ el cable es horizontal, así que tira de él con
      $T_0 = qc = 3Mg$ y no le añade ninguna carga vertical:

      $$
      \mu_{\min} = \frac{3Mg}{4Mg} = 0{,}75
      $$
  - id: ejma5-col59-la-barra-el-cable-y-el-disco
    titulo: Un cable entre una barra empotrada y un disco
    fuente: >-
      Ejercicio 5.9 · Tema 5, «Cables» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección lo incluye en el bloque que marca como de nivel
      de examen. Publica los apartados a, b, c y d, contra los que está
      contrastado el desarrollo; el apartado e, las reacciones en D, no lo
      imprime y esa parte es nuestra.
    nivel: practica
    enunciado: |
      El sistema plano de la figura consta de una barra vertical $BD$ de masa
      $M$ y longitud $L$ empotrada en el suelo, un resorte ideal de constante
      elástica $k = \dfrac{Mg}{L}$, un cable $CEF$ de peso por unidad de
      longitud $q = \dfrac{Mg}{L}$ y longitud
      $s_{CEF} = (3 + 2\sqrt{3})L/4$ y un disco de masa $M$ y radio $L/4$ unido
      en $F$ al cable. Sabiendo que el conjunto está en equilibrio por la
      acción del par $P$ y que la tensión en $C$ es horizontal, hallar:

      a. Fuerza interna del cable en $C$.

      b. Fuerza interna del cable en $F$.

      c. Valor del par $P$.

      d. Fuerza de rozamiento disco-suelo (en $G$).

      e. Reacciones en $D$.

      <figure>
