      El cable **AB** llega horizontal a **B**, así que ahí está su punto más
      bajo y también el de la catenaria **CD**. La polea **D** conserva el
      módulo de la tensión, no su componente horizontal: **CD** y **DE** son
      dos catenarias con parámetros distintos.

      </figcaption>
