ejercicios:
  - id: ejma5-la-parabola-del-puente
    titulo: El cable de un puente colgante, y dónde tira más
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      El cable principal de un puente colgante tiene sus dos amarres a la
      misma altura, separados 40 m, y su punto más bajo, en el centro, está
      5 m por debajo de ellos. Soporta una carga uniforme por unidad de
      abscisa $q_0 = 2\ \text{kN/m}$ y su peso propio se desprecia. Calcular la
      tensión en el punto más bajo y la tensión máxima.
    pide: La tensión mínima, en el centro, y la máxima, en los amarres.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué forma tiene el cable, y por qué?
        opciones:
          - texto: Una parábola, porque la carga es uniforme por unidad de longitud horizontal
            correcta: true
            mensaje: |
              Eso es. Con $q$ constante en horizontal, $y'' = q_0/T_0$ es
              constante y el cable sale $y = q_0 x^{2}/(2T_0)$ desde el punto
              más bajo.
          - texto: Una catenaria, porque es un cable colgado de dos puntos
            mensaje: |
              La catenaria es la forma de un cable que cuelga con su propio
              peso, repartido a lo largo del cable. Aquí el peso propio se
              desprecia y la carga va repartida en horizontal: eso da una
              parábola.
          - texto: Dos tramos rectos, porque está sujeto en dos puntos
            mensaje: |
              Los tramos rectos salen con cargas concentradas. Una carga
              repartida a lo largo de toda la luz curva el cable en cada
              punto.

      - tipo: calcular
        titulo: La tensión en el punto más bajo
        pregunta: |
          ¿Cuánto vale $T_0$?
        respuesta:
          tipo: magnitud
          valor: '80 kN'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '160 kN'
            mensaje: |
              Te has dejado el 2 del denominador: la parábola es
              $y = q_0 x^{2}/(2T_0)$. Al despejar,
              $T_0 = q_0 x^{2}/(2y)$.
          - valor: '320 kN'
            mensaje: |
              Has usado la luz entera, 40 m, como $x$. La $x$ se mide desde el
              punto más bajo, que está en el centro: el amarre está en
              $x = 20\ \text{m}$.
        pista: |
          En el amarre, $x = 20\ \text{m}$ e $y = 5\ \text{m}$. Despeja $T_0$ de
          $y = q_0 x^{2}/(2T_0)$.
        desarrollo: |
          $$
          T_0 = \frac{q_0\,x^{2}}{2y} = \frac{2 \cdot 20^{2}}{2 \cdot 5} = 80\ \text{kN}
          $$

      - tipo: calcular
        titulo: La tensión máxima
        pregunta: |
          ¿Cuánto vale la tensión en los amarres?
        respuesta:
          tipo: magnitud
          valor: '89.44 kN'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '120 kN'
            mensaje: |
              Has sumado $T_0$ y la carga del medio cable como si fueran
              paralelas. Una es horizontal y la otra vertical: se combinan
              con Pitágoras.
          - valor: '80 kN'
            mensaje: |
              Esa es la tensión mínima, en el centro. En el amarre el cable está
              inclinado, y a la componente horizontal $T_0$ se le suma en
              cuadratura la vertical, que es la carga de medio cable.
        pista: |
          En el amarre, la componente vertical es la carga del medio cable,
          $q_0 \cdot 20 = 40\ \text{kN}$, y la horizontal sigue siendo $T_0$.
        desarrollo: |
          $$
          T_{\max} = \sqrt{T_0^{2} + (q_0 x)^{2}} = \sqrt{80^{2} + 40^{2}} = \sqrt{8000} = 89{,}44\ \text{kN}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Carga uniforme en horizontal: el cable es la parábola $y = q_0 x^{2}/(2T_0)$, con el origen en el punto más bajo.'
          - texto: En el amarre, $x = 20$ e $y = 5$, así que $T_0 = 2 \cdot 400/10 = 80$ kN.
          - texto: La componente vertical en el amarre es la carga de medio cable, 40 kN, y $T_{\max} = \sqrt{80^{2} + 40^{2}} = 89{,}4$ kN.
          - texto: La tensión es la misma en todo el cable, 80 kN, porque el cable es continuo.
            trampa: true
            mensaje: |
              Lo que es igual en todo el cable es la componente **horizontal**
              de la tensión. La tensión total crece hacia los amarres, donde el
              cable se inclina y aparece una componente vertical.
    resolucion: |
      **La forma.** Con la carga repartida uniforme en horizontal, el cable es
      una parábola. Con el origen en el punto más bajo:

      $$
      y = \frac{q_0}{2T_0}\,x^{2}
      $$

      **La tensión mínima.** En el amarre, $x = 20\ \text{m}$ e $y = 5\ \text{m}$:

      $$
      T_0 = \frac{q_0\,x^{2}}{2y} = \frac{2 \cdot 400}{10} = 80\ \text{kN}
      $$

      **La tensión máxima.** Es la del amarre. Su componente horizontal es
      $T_0$ y la vertical, la carga del medio cable, $2 \cdot 20 = 40\ \text{kN}$:

      $$
      T_{\max} = \sqrt{80^{2} + 40^{2}} = 89{,}44\ \text{kN}
      $$

      Solo un 12 % más que en el centro: un cable tan poco combado trabaja
      casi en horizontal.

  - id: ejma5-la-catenaria-en-un-punto
    titulo: La longitud y la tensión de una catenaria en un punto
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Un cable de peso $w = 10\ \text{N/m}$ cuelga de dos amarres y su tensión
      en el punto más bajo $O$ es de 20 N. Calcular el parámetro de la
      catenaria, la longitud de cable entre $O$ y el punto $P$ situado a 3 m de
      $O$ en horizontal, y la tensión en $P$.
    pide: El parámetro c, la longitud de arco de O a P y la tensión en P.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Desde dónde se mide la $y$ en las fórmulas de la catenaria?
        opciones:
          - texto: Desde un eje situado a una distancia c por debajo del punto más bajo
            correcta: true
            mensaje: |
              Eso es. Con ese origen, en el punto más bajo $y = c$, y las tres
              fórmulas quedan limpias: $y = c\cosh(x/c)$, $s = c\sinh(x/c)$ y
              $T = wy$.
          - texto: Desde el punto más bajo del cable
            mensaje: |
              Con el origen en el punto más bajo la curva sería
              $y = c\cosh(x/c) - c$, y $T = wy$ dejaría de valer. Las fórmulas
              del curso ponen el eje $c$ por debajo.
          - texto: Desde la recta que une los dos amarres
            mensaje: |
              Esa recta depende de cómo estén los amarres, y no aparece en
              ninguna de las fórmulas. El eje de la catenaria lo fija el propio
              cable: $c$ por debajo de su punto más bajo.

      - tipo: calcular
        titulo: El parámetro de la catenaria
        pregunta: |
          ¿Cuánto vale $c$?
        respuesta:
          tipo: magnitud
          valor: '2 m'
          formato: una longitud, con su unidad
        distractores:
          - valor: '0.5 m'
            mensaje: |
              Has dividido al revés, $w/T_0$. El parámetro es la tensión en el
              punto más bajo entre el peso por metro: $c = T_0/w$.
        pista: |
          $c = T_0/w$.
        desarrollo: |
          $$
          c = \frac{T_0}{w} = \frac{20}{10} = 2\ \text{m}
          $$

      - tipo: calcular
        titulo: La longitud de cable de O a P
        pregunta: |
          ¿Cuánto cable hay entre $O$ y $P$?
        respuesta:
          tipo: magnitud
          valor: '4.259 m'
          formato: una longitud, con su unidad
        distractores:
          - valor: '3 m'
            mensaje: |
              Esa es la distancia en horizontal. El cable no va recto: sube en
              curva, y su longitud es mayor.
          - valor: '4.705 m'
            mensaje: |
              Esa es la altura de $P$ sobre el eje, $y = c\cosh(x/c)$. La
              longitud de arco lleva el seno hiperbólico: $s = c\sinh(x/c)$.
        pista: |
          $s = c\sinh(x/c)$, con $x/c = 1{,}5$.
        desarrollo: |
          $$
          s = c\,\sinh\frac{x}{c} = 2\,\sinh(1{,}5) = 2 \cdot 2{,}1293 = 4{,}259\ \text{m}
          $$

      - tipo: calcular
        titulo: La tensión en P
        pregunta: |
          ¿Cuánto vale la tensión en $P$?
        respuesta:
          tipo: magnitud
          valor: '47.05 N'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '42.59 N'
            mensaje: |
              Has calculado $w\,s$, que es solo la componente **vertical** de
              la tensión. La total es $w\sqrt{c^{2} + s^{2}} = w\,y$.
          - valor: '20 N'
            mensaje: |
              Esa es la tensión en el punto más bajo, y también la componente
              horizontal en cualquier punto. En $P$ el cable está inclinado y
              la tensión es mayor.
        pista: |
          $T = w\,y$, con $y = c\cosh(x/c)$.
        desarrollo: |
          $$
          T = w\,c\,\cosh\frac{x}{c} = 10 \cdot 2 \cdot 2{,}3524 = 47{,}05\ \text{N}
          $$

          Comprobación: $w\sqrt{c^{2} + s^{2}} = 10\sqrt{4 + 18{,}136} = 47{,}05\ \text{N}$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: $c = T_0/w = 2$ m, y el eje $x$ está 2 m por debajo del punto más bajo.
          - texto: $s = c\sinh(x/c) = 2\sinh(1{,}5) = 4{,}259$ m.
          - texto: $T = w\,y = w\,c\cosh(x/c) = 47{,}05$ N, que es también $w\sqrt{c^{2} + s^{2}}$.
          - texto: La tensión en $P$ es el peso del cable entre $O$ y $P$, $w\,s = 42{,}6$ N.
            trampa: true
            mensaje: |
              El peso del tramo $OP$ es solo la componente vertical de la
              tensión en $P$. A esa se le suma en cuadratura la horizontal,
              $T_0 = 20$ N, y queda $w\,y = 47{,}05$ N.
    resolucion: |
      **El parámetro.** $c = T_0/w = 20/10 = 2\ \text{m}$. Es también la distancia
      del punto más bajo al eje $x$ de las fórmulas.

      **La longitud de arco.** Desde el punto más bajo,

      $$
      s = c\,\sinh\frac{x}{c} = 2\,\sinh(1{,}5) = 4{,}259\ \text{m}
      $$

      **La tensión.** Es el peso de un trozo de cable tan largo como la altura
      de $P$ sobre el eje:

      $$
      y = c\,\cosh\frac{x}{c} = 2 \cdot 2{,}3524 = 4{,}705\ \text{m}
      \qquad
      T = w\,y = 47{,}05\ \text{N}
      $$

      Las tres cuadran entre sí: $y^{2} = 22{,}14$ y $c^{2} + s^{2} = 4 + 18{,}14 = 22{,}14$.

  - id: ejma5-col51-el-tiro-horizontal-que-equilibra
    titulo: Dos cargas colgadas y un tiro horizontal que equilibra
    fuente: >-
      Ejercicio 5.1 · Tema 5, «Cables» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección publica el resultado, contra el que está
      contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Si se sabe que $P_B = 70\ \text{N}$ y $P_C = 25\ \text{N}$, determinar el
      valor de $P$ necesario para el equilibrio.

      <figure>
      <svg viewBox="0 0 440 252" role="img" width="440" height="252" aria-labelledby="ejma5-col51-t ejma5-col51-d">
        <title id="ejma5-col51-t">Cable ABCD con dos cargas verticales y una fuerza horizontal en B</title>
        <desc id="ejma5-col51-d">Cable amarrado en A y en D, que están a la misma altura y separados 14 metros. Desde A baja hasta B, que está 4 metros a la derecha y 5 metros por debajo; de B sigue 6 metros a la derecha hasta C, que queda 3 metros por debajo del nivel de A y D; de C sube 4 metros hasta D. En B cuelga una carga vertical PB de 70 newtons y actúa una fuerza horizontal P hacia la izquierda; en C cuelga una carga vertical PC de 25 newtons.</desc>
        <defs>
          <marker id="ejma5-col51-f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
        </defs>
        <line x1="70" y1="40" x2="378" y2="40" stroke="var(--faint)" stroke-width="0.8"/>
        <path d="M70 36 L70 44 M158 36 L158 44 M290 36 L290 44 M378 36 L378 44" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="114" y="33" font-size="9" text-anchor="middle" fill="var(--faint)">4 m</text>
        <text x="224" y="33" font-size="9" text-anchor="middle" fill="var(--faint)">6 m</text>
        <text x="334" y="33" font-size="9" text-anchor="middle" fill="var(--faint)">4 m</text>
        <line x1="158" y1="44" x2="158" y2="184" stroke="var(--faint)" stroke-width="0.7" stroke-dasharray="3 3"/>
        <line x1="290" y1="44" x2="290" y2="140" stroke="var(--faint)" stroke-width="0.7" stroke-dasharray="3 3"/>

        <path d="M70 80 L58 62 L82 62 z" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.1"/>
        <path d="M54 62 L86 62 M56 62 L50 56 M64 62 L58 56 M72 62 L66 56 M80 62 L74 56" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <path d="M378 80 L366 62 L390 62 z" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.1"/>
        <path d="M362 62 L394 62 M364 62 L358 56 M372 62 L366 56 M380 62 L374 56 M388 62 L382 56" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <line x1="70" y1="80" x2="378" y2="80" stroke="var(--faint)" stroke-width="0.8" stroke-dasharray="3 3"/>

        <path d="M70 80 L158 190 L290 146 L378 80" fill="none" stroke="var(--d1)" stroke-width="2.2"/>
        <circle cx="70" cy="80" r="3" fill="var(--ink)"/>
        <circle cx="158" cy="190" r="3" fill="var(--ink)"/>
        <circle cx="290" cy="146" r="3" fill="var(--ink)"/>
        <circle cx="378" cy="80" r="3" fill="var(--ink)"/>
        <text x="62" y="76" font-size="10" text-anchor="end" fill="var(--ink)">A</text>
        <text x="150" y="184" font-size="10" text-anchor="end" fill="var(--ink)">B</text>
        <text x="286" y="138" font-size="10" text-anchor="end" fill="var(--ink)">C</text>
        <text x="386" y="76" font-size="10" fill="var(--ink)">D</text>

        <line x1="158" y1="196" x2="158" y2="230" stroke="var(--flag)" stroke-width="1.6" marker-end="url(#ejma5-col51-f)"/>
        <text x="158" y="246" font-size="9.5" text-anchor="middle" fill="var(--flag)">PB = 70 N</text>
        <line x1="290" y1="152" x2="290" y2="192" stroke="var(--flag)" stroke-width="1.6" marker-end="url(#ejma5-col51-f)"/>
        <text x="298" y="188" font-size="9.5" fill="var(--flag)">PC = 25 N</text>
        <line x1="150" y1="190" x2="106" y2="190" stroke="var(--d2)" stroke-width="1.8" marker-end="url(#ejma5-col51-f)"/>
        <text x="100" y="186" font-size="10" text-anchor="end" fill="var(--d2-tinta)">P</text>

        <line x1="44" y1="80" x2="44" y2="190" stroke="var(--faint)" stroke-width="0.8"/>
        <path d="M40 80 L48 80 M40 190 L48 190" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="38" y="138" font-size="9" text-anchor="end" fill="var(--faint)">5 m</text>
        <line x1="404" y1="80" x2="404" y2="146" stroke="var(--faint)" stroke-width="0.8"/>
        <path d="M400 80 L408 80 M400 146 L408 146" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="410" y="116" font-size="9" fill="var(--faint)">3 m</text>
      </svg>
      <figcaption>

      Cable de cuatro puntos con los amarres **A** y **D** a la misma altura.
      **B** está 5 m por debajo de ese nivel y **C**, 3 m. En **B** actúan la
      carga vertical **PB** y la fuerza horizontal **P**.

      </figcaption>
      </figure>
    pide: El valor de la fuerza horizontal P aplicada en B.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Vale aquí que la componente horizontal de la tensión sea la misma en
          todo el cable?
        opciones:
          - texto: >-
              No en todo el cable, porque en B hay una fuerza horizontal. Entre
              B y D sí es la misma, y esa es la que se calcula primero
            correcta: true
            mensaje: |
              Eso es. La componente horizontal solo se conserva al cruzar una
              carga **vertical**. En $C$ la carga es vertical, así que los
              tramos $BC$ y $CD$ comparten su $T_0$; en $B$, la fuerza $P$ la
              cambia, y esa diferencia **es** la respuesta.
          - texto: Sí, la componente horizontal es siempre la misma en todos los puntos de un cable
            mensaje: |
              Es la idea del tema, pero tiene una condición: que todas las
              cargas sean verticales. Aquí $P$ es horizontal, y si la
              componente horizontal no cambiara al pasar por $B$, la fuerza
              $P$ tendría que ser cero.
          - texto: No, y tampoco entre B y D, porque cada tramo recto tiene su propia tensión
            mensaje: |
              Cada tramo tiene su propia tensión **total**, sí, pero no su
              propia componente horizontal. En $C$ solo cuelga una carga
              vertical, así que la proyección horizontal del equilibrio de ese
              nudo dice que $T_0$ es la misma a los dos lados.

      - tipo: calcular
        titulo: La componente horizontal del tramo BCD
        pregunta: |
          Con el equilibrio del nudo $C$, ¿cuánto vale la componente horizontal
          de la tensión en los tramos $BC$ y $CD$?
        respuesta:
          tipo: magnitud
          valor: '60 N'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '33.33 N'
            mensaje: |
              Has cargado los 25 N solo sobre el tramo $CD$. En $C$ tiran los
              dos tramos: el $CD$ sube con pendiente $3/4$ y el $CB$ **baja**
              hacia $B$ con pendiente $1/3$, y la carga es la diferencia de
              las dos componentes verticales.
          - valor: '23.08 N'
            mensaje: |
              Has sumado las dos pendientes en vez de restarlas. Desde $C$, el
              cable sube hacia $D$ y también sube hacia $B$ visto desde $C$
              no: $B$ está **por debajo** de $C$, así que su componente
              vertical tira hacia abajo y se resta.
        pista: |
          Las pendientes son $3/4$ en $CD$ (sube 3 m en 4 m) y $1/3$ en $CB$
          (baja 2 m en 6 m). Con la misma componente horizontal $H$ en los dos,
          la vertical neta hacia arriba es $H(3/4 - 1/3)$.
        desarrollo: |
          $$
          H\left(\frac{3}{4} - \frac{1}{3}\right) = 25
          \;\Longrightarrow\;
          H \cdot \frac{5}{12} = 25
          \;\Longrightarrow\;
          H = 60\ \text{N}
          $$

      - tipo: calcular
        titulo: La fuerza P
        pregunta: |
          Con el equilibrio del nudo $B$, ¿cuánto vale $P$?
        respuesta:
          tipo: magnitud
          valor: '20 N'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '100 N'
            mensaje: |
              Has sumado las dos componentes horizontales en lugar de
              restarlas. En $B$ el tramo $BA$ tira hacia la izquierda y el
              $BC$ hacia la derecha: $P$ cierra la diferencia, no la suma.
          - valor: '4 N'
            mensaje: |
              Has repartido los 70 N por la dirección de $AB$ como si $AB$
              aguantara toda la carga. El tramo $BC$ también tira hacia arriba
              en $B$, así que a $AB$ le toca menos vertical y menos horizontal.
        pista: |
          En $B$, el tramo $BC$ aporta 60 N horizontales y $60/3 = 20$ N
          verticales. La vertical que falta hasta 70 N la da $BA$, cuya
          pendiente es $5/4$.
        desarrollo: |
          $$
          H_{AB}\cdot\frac{5}{4} + 20 = 70
          \;\Longrightarrow\;
          H_{AB} = 40\ \text{N}
          $$

          $$
          P = H_{BC} - H_{AB} = 60 - 40 = 20\ \text{N}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'En C solo cuelga una carga vertical: los tramos CB y CD comparten la componente horizontal H.'
          - texto: $H(3/4 - 1/3) = 25$, y de ahí $H = 60$ N en los tramos $BC$ y $CD$.
          - texto: En $B$, la vertical de $BC$ vale $60/3 = 20$ N, así que $BA$ aporta 50 N y su horizontal es 40 N.
          - texto: $P = 60 - 40 = 20$ N, la diferencia entre las dos componentes horizontales.
          - texto: La componente horizontal es la misma en los tres tramos, así que P tiene que ser nula.
            trampa: true
            mensaje: |
              Esa conservación vale cuando todas las cargas son verticales.
              Aquí la única fuerza horizontal del problema es $P$, y es
              exactamente la que hace que $T_0$ cambie al pasar por $B$: 40 N
              a la izquierda de $B$ y 60 N a la derecha.
    resolucion: |
      **La geometría.** Con $A$ y $D$ a la misma altura, $B$ está 5 m por
      debajo de ese nivel y $C$, 3 m. Las pendientes de los tres tramos salen
      de las cotas: $5/4$ en $AB$, $2/6 = 1/3$ en $BC$ y $3/4$ en $CD$.

      **El nudo C.** La carga de 25 N es vertical, así que la componente
      horizontal no cambia al pasar por $C$: los tramos $BC$ y $CD$ tienen la
      misma $H$. El equilibrio vertical del nudo da

      $$
      H\left(\frac{3}{4} - \frac{1}{3}\right) = 25
      \;\Longrightarrow\;
      H = 60\ \text{N}
      $$

      **El nudo B.** El tramo $BC$ tira de $B$ hacia $C$ con 60 N horizontales
      y 20 N verticales hacia arriba. Para equilibrar los 70 N que cuelgan, el
      tramo $BA$ tiene que aportar 50 N verticales, y con pendiente $5/4$ eso
      son 40 N horizontales:

      $$
      P = 60 - 40 = 20\ \text{N}
      $$

      **Comprobación.** Las tensiones quedan $T_{AB} = 40\sqrt{1+(5/4)^{2}} =
      64{,}0$ N, $T_{BC} = 63{,}2$ N y $T_{CD} = 75$ N: la mayor está en $CD$,
      el tramo más inclinado, que es lo que tiene que pasar.

  - id: ejma5-col52-el-cable-ae-con-tres-cargas
    titulo: El cable AE con tres cargas y una cota conocida
    fuente: >-
      Ejercicio 5.2 · Tema 5, «Cables» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección publica el resultado; su apartado a rotula como
      y_C la elevación que el enunciado pide para D, y el desarrollo está
      contrastado contra los dos valores.
    nivel: practica
    enunciado: |
      El cable $AE$ soporta tres cargas verticales en los puntos indicados. Si
      el punto $C$ está a $5\ \text{m}$ por debajo del apoyo izquierdo
      determinar:

      a. La elevación de los puntos $B$ y $D$.

      b. La pendiente máxima y la tensión máxima en el cable.

      <figure>
      <svg viewBox="0 0 430 245" role="img" width="430" height="245" aria-labelledby="ejma5-col52-t ejma5-col52-d">
        <title id="ejma5-col52-t">Cable AE con tres cargas verticales colgadas en B, C y D</title>
        <desc id="ejma5-col52-d">Cable amarrado en A, a la izquierda, y en E, 60 metros a la derecha y 20 metros más alto. Los puntos de carga están a 20, 30 y 45 metros de A. En B cuelgan 6 kilonewtons, en C 12 kilonewtons y en D 4 kilonewtons. El punto C está 5 metros por debajo del nivel de A. El cable, dibujado a escala, baja de A a B, sigue casi horizontal hasta C y luego sube hasta E.</desc>
