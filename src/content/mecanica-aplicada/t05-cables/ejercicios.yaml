        <text x="150" y="168" font-size="9.5" text-anchor="middle" fill="var(--ink)">M, 2R</text>

        <circle cx="330" cy="150" r="90" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.3"/>
        <circle cx="330" cy="150" r="2.6" fill="var(--ink)"/>
