      <figcaption>

      La anilla **B** desliza sin rozamiento por la guía, así que solo puede
      recibir fuerza vertical de ella: las componentes horizontales de los dos
      cables tienen que ser iguales.

      </figcaption>
      </figure>
    pide: La tensión en C, la fuerza de la polea sobre el cable, la distancia AB y la ecuación del cable AB.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué aporta al problema que la anilla $B$ sea lisa y sin masa?
        opciones:
          - texto: >-
              Que la guía solo puede hacerle fuerza vertical, así que las
              componentes horizontales de los dos cables se igualan en B
            correcta: true
            mensaje: |
              Eso es. Una guía lisa solo empuja perpendicularmente a sí misma,
              y aquí es horizontal: la única ecuación horizontal disponible en
              $B$ iguala las dos $T_0$. Es la bisagra entre los dos cables.
          - texto: Que las tensiones totales de los dos cables son iguales en B
            mensaje: |
              Eso valdría si en $B$ no hubiera guía, o si el cable simplemente
              pasara por una polea. Aquí la guía aporta una fuerza vertical,
              así que las verticales no tienen por qué coincidir: solo las
              horizontales.
          - texto: Que la anilla no transmite ninguna fuerza entre los dos cables
            mensaje: |
              Si no transmitiera nada, cada cable estaría suelto y no habría
              equilibrio. Lo que no puede la anilla es aguantar fuerza
              horizontal por su cuenta: por eso las pasa íntegras de un cable
              al otro.

      - tipo: calcular
        titulo: El parámetro del cable pesado
        pregunta: |
          ¿Cuánto vale el parámetro de catenaria $c$ del cable $BCD$?
        respuesta:
          tipo: magnitud
          valor: '5 m'
          formato: una longitud, con su unidad
        distractores:
          - valor: '13 m'
            mensaje: |
              Esos 13 m son $y_C$, la altura de $C$ sobre la directriz, que
              sale de $T_C = w\,y_C$ con la tensión del tramo colgante. El
              parámetro es el cateto que falta en $y^{2} = c^{2}+s^{2}$.
          - valor: '12 m'
            mensaje: |
              Esos 12 m son la mitad del arco $BC$, o sea $s$ medido desde el
              punto más bajo. Con $y = 13$ y $s = 12$ el parámetro es
              $\sqrt{169-144} = 5$.
        pista: |
          El tramo $CD$ cuelga libre, así que $T_C = 10\cdot 13 = 130$ N e
          $y_C = 13$ m. Como $B$ y $C$ están a la misma altura, el punto más
          bajo está en el medio y $s = 24/2 = 12$ m.
        desarrollo: |
          $$
          s_{BC} = 37 - 13 = 24\ \text{m}
          \qquad
          s = 12\ \text{m}
          \qquad
          y_C = \frac{T_C}{w} = 13\ \text{m}
          $$

          $$
          c = \sqrt{y_C^{2}-s^{2}} = \sqrt{169-144} = 5\ \text{m}
          $$

      - tipo: calcular
        titulo: La componente horizontal en C
        pregunta: |
          ¿Cuánto vale la componente horizontal de la tensión en $C$?
        respuesta:
          tipo: magnitud
          valor: '50 N'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '130 N'
            mensaje: |
              Ese es el módulo de la tensión en $C$, que el resultado escribe
              como el vector $50\hat{i}+120\hat{j}$. Su componente horizontal
              es $w\,c$.
          - valor: '120 N'
            mensaje: |
              Esa es la componente **vertical**, el peso de medio arco,
              $w\,s = 10\cdot 12$. La horizontal vale $w\,c$.
        pista: |
          $T_0 = w\,c$, con $c = 5$ m.
        desarrollo: |
          $$
          T_{Cx} = w\,c = 50\ \text{N}
          \qquad
          T_{Cy} = w\,s = 120\ \text{N}
          $$

          o sea $\vec{T}_C = 50\hat{i}+120\hat{j}$ N, de módulo 130 N, que es
          justo el peso de los 13 m que cuelgan.

      - tipo: calcular
        titulo: La fuerza de la polea sobre el cable
        pregunta: |
          ¿Cuánto vale el módulo de la fuerza que la polea $C$ hace sobre el
          cable?
        respuesta:
          tipo: magnitud
          valor: '254.9 N'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '260 N'
            mensaje: |
              Has sumado los dos tiros de 130 N como si fueran paralelos. El
              del lado de la catenaria llega a 45 grados largos y el del tramo
              vertical va a plomo: hay que sumarlos como vectores.
          - valor: '130 N'
            mensaje: |
              Ese es cada uno de los dos tiros por separado. La polea tiene que
              equilibrar los dos a la vez, así que su fuerza es la suma
              vectorial cambiada de signo.
        pista: |
          El cable tira de la polea hacia $B$ con $(-50, -120)$ y hacia $D$ con
          $(0,-130)$. La polea devuelve la suma cambiada de signo.
        desarrollo: |
          $$
          \vec{C} = 50\hat{i} + 250\hat{j}\ \text{N}
          \qquad
          \left|\vec{C}\right| = \sqrt{50^{2}+250^{2}} = 254{,}95\ \text{N}
          $$

      - tipo: calcular
        titulo: La distancia AB
        pregunta: |
          ¿Cuánto vale la distancia entre $A$ y $B$?
        respuesta:
          tipo: magnitud
          valor: '15 m'
          formato: una longitud, con su unidad
        distractores:
          - valor: '20 m'
            mensaje: |
              Has puesto la resultante de la carga triangular en el centro del
              vano. El centro de gravedad de un triángulo está a un tercio de
              su base desde el lado mayor, o sea a $2d/3$ de $A$.
          - valor: '39 m'
            mensaje: |
              Has usado 130 N como componente horizontal en $B$. La horizontal
              es 50 N; los 130 N son el módulo de la tensión al otro lado de la
              anilla.
        pista: |
          En $B$ la tensión de $AB$ está a 45 grados, así que su vertical es
          también 50 N. Toma momentos en $A$ con la resultante de la carga
          triangular, $5d$, aplicada a $2d/3$ de $A$.
        desarrollo: |
          $$
          V_B\,d = \frac{10\,d}{2}\cdot\frac{2d}{3}
          \;\Longrightarrow\;
          50 = \frac{10\,d}{3}
          \;\Longrightarrow\;
          d = 15\ \text{m}
          $$

      - tipo: calcular
        titulo: La curva del cable AB
        pregunta: |
          La ecuación queda $y = \dfrac{x^{3}}{k} - \dfrac{x}{2}$. ¿Cuánto vale
          $k$?
        respuesta:
          tipo: numero
          valor: '450'
          tolerancia: 2
          formato: un número
        distractores:
          - valor: '225'
            mensaje: |
              Has integrado una sola vez. De $y'' = x/75$ salen
              $y' = x^{2}/150 + C_1$ e $y = x^{3}/450 + C_1x$: cada integración
              divide por el nuevo exponente.
          - valor: '900'
            mensaje: |
              Has dividido por 3 y luego por 4. Al integrar $x^{2}/150$ el
              exponente que aparece es el 3, así que el denominador es
              $150\cdot 3 = 450$.
        pista: |
          $q(x) = 10x/15$ y $T_0 = 50$ N, así que $y'' = x/75$. Integra dos
          veces e impón $y(0) = 0$ e $y(15) = 0$.
        desarrollo: |
          $$
          y'' = \frac{q(x)}{T_0} = \frac{10x/15}{50} = \frac{x}{75}
          \qquad
          y = \frac{x^{3}}{450} + C_1x
          $$

          Con $y(15) = 0$ sale $C_1 = -1/2$:

          $$
          y = \frac{x^{3}}{450} - \frac{x}{2}
          $$

          Comprobación: $y'(15) = 1$, o sea 45 grados en $B$, y $y'(0) = -0{,}5$,
          que da 25 N de vertical en $A$; con los 50 N de $B$ suman los 75 N de
          la carga total.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'El tramo CD cuelga libre: su peso, 130 N, es la tensión en C, y como T = wy, la altura de C sobre la directriz es 13 m.'
          - texto: 'B y C están a la misma altura: el arco BC mide 24 m, su mitad es 12 m, y $c = \sqrt{169-144} = 5$ m.'
          - texto: La anilla es lisa, así que la horizontal pasa entera al cable $AB$, donde a 45 grados da $V_B = 50$ N.
          - texto: Momentos en $A$ con la carga triangular dan $d = 15$ m, e integrando $y'' = x/75$ sale $y = x^{3}/450 - x/2$.
          - texto: La tensión del cable AB en B vale 130 N, la misma que la del cable pesado al otro lado de la anilla.
            trampa: true
            mensaje: |
              Lo que pasa entera por la anilla es la componente **horizontal**,
              50 N. La tensión total de $AB$ en $B$ es $50\sqrt{2} = 70{,}7$ N,
              y la del cable pesado, 130 N: la diferencia vertical la aguanta
              la guía.
    resolucion: |
      **El cable pesado.** El tramo $CD$ cuelga libre, así que su tensión en
      $C$ es su peso, $10\cdot 13 = 130$ N, y como $T = w\,y$, la altura de $C$
      sobre la directriz es $y_C = 13$ m. El arco $BC$ mide $37-13 = 24$ m y,
      con $B$ y $C$ a la misma altura, su punto más bajo está en el medio:
      $s = 12$ m. Entonces

      $$
      c = \sqrt{y_C^{2}-s^{2}} = 5\ \text{m}
      \qquad
      \vec{T}_C = 50\hat{i}+120\hat{j}\ \text{N}
      $$

      **La polea.** Suma vectorial de los dos tiros, cambiada de signo:

      $$
      \vec{C} = 50\hat{i}+250\hat{j}\ \text{N}
      \qquad
      \left|\vec{C}\right| = 254{,}95\ \text{N}
      $$

      **La distancia AB.** La anilla es lisa: la componente horizontal, 50 N,
      pasa entera al cable $AB$, y como allí la tensión está a 45 grados, su
      componente vertical vale también 50 N. Con la carga triangular de
      resultante $10d/2$ aplicada a $2d/3$ de $A$, momentos en $A$:

      $$
      50\,d = \frac{10d}{2}\cdot\frac{2d}{3}
      \;\Longrightarrow\;
      d = 15\ \text{m}
      $$

      **La curva.** Con $q(x) = 10x/15$ y $T_0 = 50$ N:

      $$
      y'' = \frac{x}{75}
      \qquad
      y = \frac{x^{3}}{450} - \frac{x}{2}
      $$

      **Comprobación.** La pendiente en $B$ vale 1, o sea los 45 grados del
      enunciado, y el punto más bajo del cable $AB$ cae en
      $x = \sqrt{75} = 8{,}66$ m, con $y = -2{,}89$ m.
  - id: ejma5-col511-los-dos-cables-y-el-suelo-rugoso
    titulo: Dos cables, una polea y un tramo apoyado en el suelo
    fuente: >-
      Ejercicio 5.11 · Tema 5, «Cables» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección lo incluye en el bloque que marca como de nivel
      de examen, y publica el resultado, contra el que está contrastado el
      desarrollo.
    nivel: practica
    enunciado: |
      La figura muestra el sistema en equilibrio formado por dos cables $AB$ y
      $CDEF$, a punto de deslizar. El cable $AB$ sin masa soporta una carga
      distribuida de $800\ \text{N}$ con reparto triangular. Está atado a la
      articulación fija $A$ y en $C$ a otro cable $CDEF$ de peso
      $100\ \text{N/m}$. El cable $CDEF$ se arrolla por una polea $D$, de radio
      y rozamiento despreciables y situada a la misma altura que $A$, y tiene
      otra parte apoyada sobre un suelo horizontal rugoso. La longitud del
      cable $CDEF$ es $21,5\ \text{m}$. Calcular:

      a. Tensión (fuerza interna) en los puntos $B$ y $C$.

      b. Fuerza interna del cable $CDEF$ en $D$.

      c. Coeficiente de rozamiento mínimo entre cable y suelo.

      d. Fuerza de enlace sobre la polea $D$.

