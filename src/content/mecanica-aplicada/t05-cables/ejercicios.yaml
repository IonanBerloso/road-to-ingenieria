      <figcaption>

      El cable sale horizontal de **A**, así que **A** es el punto más bajo del
      tramo **AF**. La deslizadera de **G** corre por un mástil vertical sin
      rozamiento: solo puede recibir fuerza horizontal, de modo que **G** es a
      su vez el punto más bajo del tramo **FG**.

      </figcaption>
      </figure>
    pide: Los dos parámetros de catenaria, la longitud del cable, la fuerza sobre la polea y las fuerzas en CE y CD.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué aporta que la deslizadera de $G$ corra sin rozamiento por un
          mástil vertical?
        opciones:
          - texto: >-
              Que el mástil solo puede empujarla en horizontal, así que la
              tensión del cable en G es horizontal y G es el punto más bajo de
              su tramo
            correcta: true
            mensaje: |
              Eso es. Una guía lisa solo hace fuerza perpendicular a sí misma;
              si el mástil es vertical, esa fuerza es horizontal, y la
              deslizadera no puede aguantar nada vertical. La tensión del cable
              allí tiene que ser horizontal.
          - texto: Que la tensión en G es vertical, porque la deslizadera se mueve a lo largo del mástil
            mensaje: |
              Es al revés. La deslizadera puede moverse en vertical, así que en
              esa dirección no puede recibir fuerza del mástil; y como no
              tiene masa, tampoco puede recibirla del cable.
          - texto: Que la tensión en G vale lo mismo que en A, porque los dos son puntos más bajos
            mensaje: |
              Los dos son puntos más bajos de su tramo, pero de tramos
              distintos y con parámetros distintos: $T_A = qc$ y
              $T_G = qc'$, y aquí $c = 2L$ mientras que $c' = 3L$.

      - tipo: calcular
        titulo: El parámetro del tramo AF
        pregunta: |
          ¿Cuánto vale $c$ en unidades de $L$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.02
          formato: un número, c dividido por L
        distractores:
          - valor: '4'
            mensaje: |
              Has usado un brazo de $L/2$ para el tiro del cable, o de $2L$
              para la reacción en $D$. El cable tira en $A$, a una altura $L$
              sobre $C$, y $D$ está a una distancia $L$ de $C$.
          - valor: '1'
            mensaje: |
              Sale de igualar $T_0$ a la propia reacción, $2qL$, dividiendo
              luego mal. Momentos en $C$ dan $T_0\cdot L = 2qL\cdot L$, o sea
              $T_0 = 2qL$ y $c = T_0/q = 2L$.
        pista: |
          Momentos en $C$ de la estructura: el cable tira de $A$ en horizontal,
          con brazo $L$, y la reacción en $D$ es vertical, con brazo $L$.
        desarrollo: |
          $$
          T_0\,L = 2qL\cdot L
          \;\Longrightarrow\;
          T_0 = 2qL
          \qquad
          c = \frac{T_0}{q} = 2L
          $$

      - tipo: calcular
        titulo: El parámetro del tramo FG
        pregunta: |
          ¿Cuánto vale $c'$ en unidades de $L$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.02
          formato: un número, c prima dividido por L
        distractores:
          - valor: '2'
            mensaje: |
              Es suponer que la polea conserva la componente horizontal. Lo que
              conserva es el módulo: $T_F$ es la misma por los dos lados, y
              como $T = q\,y$, la **altura sobre la directriz** de $F$ es la
              misma, no el parámetro.
          - valor: '1'
            mensaje: |
              Has restado la altura en el sentido contrario. $F$ está $2L$ por
              encima de $A$ y solo $L$ por encima de $G$, así que la directriz
              del segundo tramo queda más abajo y $c'$ es mayor, no menor.
        pista: |
          En la polea se conserva el módulo, así que $y_F$ es la misma vista
          desde los dos lados: $c + 2L = c' + L$.
        desarrollo: |
          $$
          y_F = c + 2L = 4L
          \qquad
          y_F = c' + L
          \;\Longrightarrow\;
          c' = 3L
          $$

      - tipo: calcular
        titulo: La longitud del cable
        pregunta: |
          ¿Cuánto vale $s_{AFG}$ en unidades de $L$?
        respuesta:
          tipo: numero
          valor: '6.11'
          tolerancia: 0.03
          formato: un número, s_AFG dividido por L
        distractores:
          - valor: '5.7'
            mensaje: |
              Arrastras $c' = 2L$ en el segundo tramo. Con el parámetro
              correcto, $c' = 3L$, el arco $FG$ sale $\sqrt{7}L$ y no
              $\sqrt{5}L$.
          - valor: '3.46'
            mensaje: |
              Ese es solo el tramo $AF$, $2\sqrt{3}L$. Falta el tramo $FG$, que
              aporta $\sqrt{7}L$ más.
        pista: |
          En cada tramo, $s = \sqrt{y^{2}-c^{2}}$ con la $y$ del punto alto,
          que es $F$ en los dos.
        desarrollo: |
          $$
          s_{AF} = \sqrt{(4L)^{2}-(2L)^{2}} = 2\sqrt{3}\,L
          \qquad
          s_{FG} = \sqrt{(4L)^{2}-(3L)^{2}} = \sqrt{7}\,L
          $$

          $$
          s_{AFG} = \left(2\sqrt{3}+\sqrt{7}\right)L = 6{,}11\,L
          $$

      - tipo: calcular
        titulo: La barra CE
        pregunta: |
          ¿Cuánto vale la fuerza en la barra $CE$, en unidades de $qL$?
        respuesta:
          tipo: numero
          valor: '2.828'
          tolerancia: 0.02
          formato: un número, la fuerza dividida por q por L
        distractores:
          - valor: '2'
            mensaje: |
              Te falta el $\sqrt{2}$ de la diagonal. En el nudo $A$ solo
              concurren la barra vertical $AD$, la diagonal $AE$ y el tiro
              horizontal del cable: la diagonal está a 45 grados, así que su
              proyección horizontal es su fuerza dividida por $\sqrt{2}$.
          - valor: '0'
            mensaje: |
              Cero es la fuerza en $CD$, no en $CE$. La diagonal $CEA$ es la
              que recoge el tiro horizontal del cable y lo lleva hasta la
              articulación $C$.
        pista: |
          Equilibrio del nudo $A$: allí llegan la barra vertical $AD$, la
          diagonal hacia $E$ y el cable, que tira en horizontal con
          $T_0 = 2qL$.
        desarrollo: |
          En el nudo $A$, con la diagonal a 45 grados:

          $$
          \frac{N_{AE}}{\sqrt{2}} = T_0 = 2qL
          \;\Longrightarrow\;
          N_{AE} = 2\sqrt{2}\,qL
          $$

          y por el nudo $E$ esa fuerza pasa entera a $CE$:
          $N_{CE} = 2\sqrt{2}\,qL = 2{,}83\,qL$ a tracción. En el nudo $D$, el
          equilibrio horizontal deja $N_{CD} = 0$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'La tensión en A es horizontal: A es el punto más bajo del tramo AF, y momentos en C dan T0 = 2qL, o sea c = 2L.'
          - texto: 'La deslizadera de G solo recibe fuerza horizontal: G es el punto más bajo del tramo FG.'
          - texto: En la polea se conserva el módulo, así que la altura de $F$ sobre la directriz es la misma por los dos lados, y de ahí sale el segundo parámetro, $3L$.
          - texto: $s_{AF} = 2\sqrt{3}L$ y $s_{FG} = \sqrt{7}L$, y del nudo $A$ sale $N_{CE} = 2\sqrt{2}qL$ con $N_{CD} = 0$.
          - texto: Como la polea es lisa, la componente horizontal del cable es la misma a los dos lados y c vale 2L en los dos tramos.
            trampa: true
            mensaje: |
              En una polea lisa se conserva el **módulo** de la tensión, no su
              proyección horizontal: la dirección cambia. Aquí eso se traduce
              en que $y_F$ es la misma por los dos lados, y como las alturas
              sobre $F$ son distintas —$2L$ y $L$—, los parámetros salen
              distintos.
    resolucion: |
      **Los dos parámetros.** La tensión en $A$ es horizontal, así que $A$ es
      el punto más bajo del tramo $AF$. Momentos en $C$ de la estructura, con
      el tiro del cable a una altura $L$ y la reacción de $D$ a una distancia
      $L$:

      $$
      T_0\,L = 2qL\cdot L
      \;\Longrightarrow\;
      T_0 = 2qL
      \qquad
      c = 2L
      $$

      La deslizadera de $G$ corre sin rozamiento por un mástil vertical, así
      que solo recibe fuerza horizontal y $G$ es el punto más bajo del tramo
      $FG$. En la polea se conserva el módulo de la tensión, o sea la altura de
      $F$ sobre la directriz:

      $$
      y_F = c + 2L = 4L = c' + L
      \;\Longrightarrow\;
      c' = 3L
      $$

      **La longitud.**

      $$
      s_{AF} = \sqrt{16L^{2}-4L^{2}} = 2\sqrt{3}L
      \qquad
      s_{FG} = \sqrt{16L^{2}-9L^{2}} = \sqrt{7}L
      $$

      $$
      s_{AFG} = \left(2\sqrt{3}+\sqrt{7}\right)L = 6{,}11\,L
      $$

      **La polea.** El cable tira de $F$ hacia $A$ con $(-2qL,\ -2\sqrt{3}qL)$
      y hacia $G$ con $(3qL,\ -\sqrt{7}qL)$, así que

      $$
      \vec{R}_F = -qL\,\hat{i} + \left(2\sqrt{3}+\sqrt{7}\right)qL\,\hat{j}
      $$

      **Las barras.** En el nudo $A$ concurren la vertical $AD$, la diagonal
      hacia $E$ y el cable:

      $$
      N_{CE} = N_{AE} = 2\sqrt{2}\,qL\ \text{(tracción)}
      \qquad
      N_{CD} = 0
      $$

      **Comprobación.** La vertical en $A$ da $N_{AD} = -2qL$, o sea $2qL$ a
      compresión, que es exactamente la reacción vertical del apoyo $D$ que
      daba el enunciado.
  - id: ejma5-col515-el-cable-tumbado-y-la-masa-colgada
    titulo: Un cable en equilibrio estricto con una masa colgada
    fuente: >-
      Ejercicio 5.15 · Tema 5, «Cables» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección lo incluye en el bloque que marca como de nivel
      de examen, y publica el resultado, contra el que está contrastado el
      desarrollo.
    nivel: practica
    enunciado: |
      El cable $ABCD$ de peso por unidad de longitud $q = \dfrac{Mg}{L}$ y
      longitud total $s_{ABCD} = 7L$ está en equilibrio estricto. Se sabe que
      el coeficiente de fricción entre cable y suelo es $f = 0{,}5$. En $C$,
      está apoyado en una polea de dimensiones despreciables y sin rozamiento,
      con una masa de valor $2M$ colgando en su extremo $D$ y siendo
      $s_{CD} = L$. En $B$, la tangente al cable es horizontal. Calcular:

      a. Tensión en $C$.

      b. Longitud del cable $s_{BC}$.

      c. Parámetro de catenaria c.

      d. Altura $h$ de la masa con respecto al suelo.

      <figure>
      <svg viewBox="0 0 440 248" role="img" width="440" height="248" aria-labelledby="ejma5-col515-t ejma5-col515-d">
        <title id="ejma5-col515-t">Cable tumbado en el suelo que sube hasta una polea y sostiene una masa</title>
        <desc id="ejma5-col515-d">Un cable con peso propio: el tramo AB está tumbado sobre un suelo rugoso de coeficiente un medio, con A en su extremo izquierdo. En B, donde acaba el suelo, la tangente es horizontal y arranca la catenaria BC, que sube hasta la polea C. De C cuelga un tramo vertical de longitud L con una masa 2M en su extremo D, que queda a una altura h sobre el suelo. Todo está dibujado a escala con los valores resueltos.</desc>
        <line x1="10" y1="215" x2="252" y2="215" stroke="var(--ink)" stroke-width="1.3"/>
        <path d="M16 215 L10 223 M32 215 L26 223 M48 215 L42 223 M64 215 L58 223 M80 215 L74 223 M96 215 L90 223 M112 215 L106 223 M128 215 L122 223 M144 215 L138 223 M160 215 L154 223 M176 215 L170 223 M192 215 L186 223 M208 215 L202 223 M224 215 L218 223 M240 215 L234 223" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <line x1="16.8" y1="215" x2="240" y2="215" stroke="var(--d2)" stroke-width="2.6"/>
        <text x="120" y="207" font-size="9.5" text-anchor="middle" fill="var(--ink)">f = 1/2</text>

        <path d="M240 215 L248.8 214.7 L257.5 213.6 L266.3 211.9 L275 209.5 L283.8 206.3 L292.5 202.4 L301.3 197.7 L310.1 192.3 L318.8 186 L327.6 178.8 L336.3 170.8 L345.1 161.8 L353.8 151.7 L362.6 140.6" fill="none" stroke="var(--d2)" stroke-width="2.4"/>
        <text x="300" y="128" font-size="9.5" text-anchor="middle" fill="var(--d2-tinta)">q = Mg/L</text>

        <circle cx="362.6" cy="140.6" r="5" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/>
        <circle cx="362.6" cy="140.6" r="1.6" fill="var(--ink)"/>
