        <path d="M72 113 L66 105 M86 113 L80 105 M100 113 L94 105 M114 113 L108 105 M124 113 L118 105" fill="none" stroke="var(--faint)" stroke-width="0.9"/>

        <path d="M60 150 L62.1 147.8 L64.2 145.5 L66.3 143 L68.4 140.4 L70.5 137.6 L72.7 134.7 L74.8 131.5 L76.9 128.2 L79 124.7 L81.1 121 L83.2 117.1 L85.3 113" fill="none" stroke="var(--d1)" stroke-width="2.4"/>
        <text x="96" y="136" font-size="9.5" fill="var(--d1)">q = Mg/R</text>

