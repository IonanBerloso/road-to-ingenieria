      <figcaption>

      El punto más bajo del cable no está en el centro del vano: queda a
      **0,44 L** de **B** y a **0,56 L** de **A**, porque el cable llega a
      **B** con 45 grados y a **A** más inclinado.

      </figcaption>
      </figure>
    pide: El parámetro de catenaria y la tensión mínima, las componentes en A y la fuerza F con la normal y el rozamiento.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué fija la tensión del cable en $B$?
        opciones:
          - texto: >-
              El muelle, que tira con k por su deformación, raíz de dos por Mg,
              en la dirección del propio muelle, a 45 grados
            correcta: true
            mensaje: |
              Eso es. $B$ es un punto sin masa entre el muelle y el cable: las
              dos fuerzas son iguales y opuestas. Y como el muelle está a 45
              grados, la componente horizontal, que es $T_0$, vale $Mg$.
          - texto: El peso del cable, porque en B empieza la catenaria
            mensaje: |
              El peso del cable determina cómo **crece** la tensión de un punto
              a otro, no cuánto vale en un extremo. El valor lo fija la
              condición de contorno, y aquí es el muelle.
          - texto: La fuerza F, que se transmite por el disco hasta el cable
            mensaje: |
              $F$ es la incógnita del apartado c y sale al final, del
              equilibrio del disco. El cable se resuelve entero antes, con el
              dato del muelle.

      - tipo: calcular
        titulo: El parámetro y la tensión mínima
        pregunta: |
          ¿Cuánto vale $c$ en unidades de $L$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.005
          formato: un número, c dividido por L
        distractores:
          - valor: '0.707'
            mensaje: |
              Has dividido entre $w$ el módulo de la fuerza del muelle,
              $\sqrt{2}Mg$. El parámetro se calcula con la componente
              **horizontal** de la tensión, que a 45 grados es $Mg$.
          - valor: '1'
            mensaje: |
              Has dividido entre $Mg/L$ en vez de entre
              $w = 2Mg/L$. El peso por unidad de longitud de este cable es el
              doble.
        pista: |
          $k\Delta x = \sqrt{2}Mg$ a 45 grados, así que $T_0 = Mg$; y
          $c = T_0/w$.
        desarrollo: |
          $$
          k\,\Delta x = \frac{2\sqrt{2}Mg}{L}\cdot\frac{L}{2} = \sqrt{2}\,Mg
          \qquad
          T_0 = \sqrt{2}Mg\cos 45^{\circ} = Mg
          $$

          $$
          c = \frac{T_0}{w} = \frac{Mg}{2Mg/L} = \frac{L}{2}
          $$

      - tipo: calcular
        titulo: La componente vertical en A
        pregunta: |
          ¿Cuánto vale $T_{Ay}$ en unidades de $Mg$?
        respuesta:
          tipo: numero
          valor: '1.367'
          tolerancia: 0.01
          formato: un número, T_Ay dividido por Mg
        distractores:
          - valor: '3.627'
            mensaje: |
              Has tomado $B$ como punto más bajo y medido la $x$ de $A$ desde
              él, $x = L$. En $B$ la pendiente es 1, no cero: el punto más bajo
              está a $0{,}44L$ a la derecha de $B$.
          - valor: '1'
            mensaje: |
              Ese es el valor en $B$, donde la tensión está a 45 grados y sus
              dos componentes valen $Mg$. En $A$ el cable está más inclinado,
              así que su componente vertical es mayor.
        pista: |
          En $B$ la pendiente vale 1, así que $x_B = c\,\text{argsinh}(1) =
          0{,}441L$ a la izquierda del punto más bajo. Entonces $A$ está a
          $L - 0{,}441L$ del punto más bajo, y $T_{Ay} = w\,c\sinh(x_A/c)$.
        desarrollo: |
          $$
          x_B = c\,\text{argsinh}(1) = 0{,}4407\,L
          \qquad
          x_A = L - 0{,}4407L = 0{,}5593\,L
          $$

          $$
          T_{Ay} = w\,c\,\sinh\frac{x_A}{c} = Mg\sinh(1{,}1186) = 1{,}367\,Mg
          $$

          La colección lo imprime redondeado, $1{,}37\,Mg$. La componente
          horizontal sigue siendo $T_{Ax} = T_0 = Mg$.

      - tipo: calcular
        titulo: La fuerza F
        pregunta: |
          ¿Cuánto vale $F$ en unidades de $Mg$?
        respuesta:
          tipo: numero
          valor: '2.367'
          tolerancia: 0.01
          formato: un número, F dividido por Mg
        distractores:
          - valor: '1'
            mensaje: |
              Solo has equilibrado el tirón horizontal del cable. Falta el
              rozamiento: el cable tira de $A$, que está a un radio del centro,
              y su momento obliga al suelo a responder con una fuerza de
              rozamiento que $F$ también tiene que vencer.
          - valor: '1.367'
            mensaje: |
              Esa es la fuerza de rozamiento, que sale del momento de la
              tensión respecto del centro. $F$ tiene que equilibrar además la
              componente horizontal del cable, $Mg$.
        pista: |
          Momentos en el centro del disco dan el rozamiento; luego el
          equilibrio horizontal del disco da $F$.
        desarrollo: |
          El cable tira de $A$, el punto izquierdo del disco, con
          $(-Mg,\ -1{,}367Mg)$. Momentos en el centro:

          $$
          F_r\,R = T_{Ay}\,R
          \;\Longrightarrow\;
          F_r = 1{,}367\,Mg
          $$

          $$
          N = Mg + T_{Ay} = 2{,}367\,Mg
          \qquad
          F = T_{Ax} + F_r = Mg + 1{,}367Mg = 2{,}367\,Mg
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'B no tiene masa: la tensión del cable allí es la del muelle, raíz de dos por Mg a 45 grados, así que T0 = Mg y c = L/2.'
          - texto: En $B$ la pendiente vale 1, así que el punto más bajo está a $c\,\text{argsinh}(1) = 0{,}441L$ a su derecha.
          - texto: $A$ queda a $0{,}559L$ del punto más bajo, y ahí $T_{Ay} = w\,c\sinh(x_A/c) = 1{,}367Mg$, con $T_{Ax} = Mg$.
          - texto: Momentos en el centro del disco dan $F_r = 1{,}367Mg$, y el equilibrio horizontal, $F = 2{,}367Mg$.
          - texto: Como la distancia horizontal entre A y B es L, el punto más bajo está en el centro, a L/2 de cada uno.
            trampa: true
            mensaje: |
              El punto más bajo está en el centro solo si el cable llega a los
              dos extremos con la misma inclinación. Aquí llega a $B$ con 45
              grados y a $A$ con más, así que se desplaza hacia $B$: queda a
              $0{,}441L$ de $B$ y a $0{,}559L$ de $A$.
    resolucion: |
      **El muelle y el parámetro.** $B$ es un punto sin masa entre el muelle y
      el cable, así que la tensión del cable allí es la fuerza del muelle:

      $$
      k\,\Delta x = \frac{2\sqrt{2}Mg}{L}\cdot\frac{L}{2} = \sqrt{2}\,Mg
      $$

      A 45 grados, sus componentes valen $Mg$ y $Mg$, de modo que

      $$
      T_0 = Mg
      \qquad
      c = \frac{T_0}{w} = \frac{L}{2}
      $$

      **Dónde está el punto más bajo.** En $B$ la pendiente es 1, y como
      $\tan\theta = \sinh(x/c)$:

      $$
      x_B = c\,\text{argsinh}(1) = 0{,}4407\,L
      \qquad
      x_A = L - x_B = 0{,}5593\,L
      $$

      **La fuerza en A.**

      $$
      T_{Ax} = T_0 = Mg
      \qquad
      T_{Ay} = w\,c\,\sinh\frac{x_A}{c} = Mg\,\sinh(1{,}1186) = 1{,}367\,Mg
      $$

      **El disco.** El cable tira de su punto izquierdo $A$, a un radio del
      centro y a la altura del centro. Momentos en el centro, equilibrio
      vertical y equilibrio horizontal:

      $$
      F_r = T_{Ay} = 1{,}367\,Mg
      \qquad
      N = Mg + T_{Ay} = 2{,}367\,Mg
      \qquad
      F = Mg + F_r = 2{,}367\,Mg
      $$

      **Comprobación.** El coeficiente de rozamiento que hace falta es
      $F_r/N = 1{,}367/2{,}367 = 0{,}577$, y como el enunciado dice que el
      disco está a punto de deslizar, ese es justamente el coeficiente del
      contacto.
