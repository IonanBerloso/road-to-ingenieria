      <figcaption>

      El tramo **AB** está tumbado en el suelo y es el que aguanta, por
      rozamiento, el tirón horizontal de la catenaria. En **B** la tangente es
      horizontal, así que ahí está el punto más bajo.

      </figcaption>
      </figure>
    pide: La tensión en C, la longitud del tramo BC, el parámetro de catenaria y la altura h de la masa.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué significa aquí que el cable esté en «equilibrio estricto»?
        opciones:
          - texto: >-
              Que el tramo tumbado está a punto de deslizar, así que el tirón
              horizontal en B es exactamente f por el peso de ese tramo
            correcta: true
            mensaje: |
              Eso es. Sin esa condición el problema tendría una incógnita de
              más: la longitud apoyada no se podría determinar. El equilibrio
              estricto la fija.
          - texto: Que la tensión en B es cero, porque el cable está apoyado
            mensaje: |
              Si la tensión en $B$ fuera cero, la catenaria no tendría
              parámetro: $c = T_0/q$ se anularía. El tramo del suelo sí tira, y
              lo hace justo con el máximo que le permite el rozamiento.
          - texto: Que el rozamiento vale f por el peso de los 7L de cable
            mensaje: |
              Solo aprieta el suelo la parte tumbada. Los tramos $BC$ y $CD$
              están en el aire: su peso lo aguantan la catenaria y la polea, no
              el suelo.

      - tipo: calcular
        titulo: La tensión en C
        pregunta: |
          ¿Cuánto vale $T_C$ en unidades de $Mg$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.02
          formato: un número, T_C dividido por Mg
        distractores:
          - valor: '2'
            mensaje: |
              Es solo el peso de la masa colgada. El tramo $CD$ también pesa:
              mide $L$ y su peso es $qL = Mg$, y la polea lo transmite entero.
          - valor: '1'
            mensaje: |
              Ese es solo el peso del tramo $CD$. Falta la masa de $2M$ que
              cuelga de su extremo.
        pista: |
          Del lado de $D$ cuelgan la masa $2M$ y el propio tramo $CD$, de
          longitud $L$.
        desarrollo: |
          $$
          T_C = 2Mg + q\,L = 2Mg + Mg = 3Mg
          $$

          Y como la polea es lisa, esa es también la tensión de la catenaria en
          $C$, así que $y_C = T_C/q = 3L$.

      - tipo: calcular
        titulo: La longitud del tramo BC
        pregunta: |
          ¿Cuánto vale $s_{BC}$ en unidades de $L$?
        respuesta:
          tipo: numero
          valor: '2.4'
          tolerancia: 0.02
          formato: un número, s_BC dividido por L
        distractores:
          - valor: '3'
            mensaje: |
              Ese es $y_C/L$, la altura de $C$ sobre la directriz. El arco es el
              otro cateto de $y^{2} = c^{2}+s^{2}$, y sale menor.
          - valor: '1.8'
            mensaje: |
              Ese es el parámetro $c$, no la longitud del arco. Los dos salen
              del mismo sistema, pero $s$ es el cateto que acompaña a $c$ en
              $y_C^{2} = c^{2}+s^{2}$.
        pista: |
          Llama $s$ a $s_{BC}$. Lo apoyado mide $7L - L - s$, y el equilibrio
          estricto da $c = f(6L - s)$. Métela en $y_C^{2} = c^{2}+s^{2}$ con
          $y_C = 3L$.
        desarrollo: |
          $$
          c = \frac{1}{2}\left(6L - s\right)
          \qquad
          (3L)^{2} = c^{2} + s^{2}
          $$

          $$
          \left(3L - \frac{s}{2}\right)^{2} + s^{2} = 9L^{2}
          \;\Longrightarrow\;
          \frac{5}{4}s^{2} = 3Ls
          \;\Longrightarrow\;
          s = \frac{12L}{5} = 2{,}4\,L
          $$

      - tipo: calcular
        titulo: El parámetro de catenaria
        pregunta: |
          ¿Cuánto vale $c$ en unidades de $L$?
        respuesta:
          tipo: numero
          valor: '1.8'
          tolerancia: 0.02
          formato: un número, c dividido por L
        distractores:
          - valor: '3'
            mensaje: |
              Ese es $y_C/L$. El parámetro es la altura del **punto más bajo**
              sobre la directriz, no la del punto alto.
          - valor: '1.2'
            mensaje: |
              Esa es la altura de $C$ sobre el suelo, $y_C - c$. El parámetro
              se mide desde la directriz, que está $c$ por debajo de $B$.
        pista: |
          Con $s = 12L/5$, el tramo apoyado mide $6L - s$ y
          $c = f\,(6L - s)$.
        desarrollo: |
          $$
          s_{AB} = 7L - L - \frac{12L}{5} = \frac{18L}{5}
          \qquad
          c = \frac{1}{2}\cdot\frac{18L}{5} = \frac{9L}{5} = 1{,}8\,L
          $$

          Comprobación: $c^{2}+s^{2} = 3{,}24L^{2}+5{,}76L^{2} = 9L^{2} =
          y_C^{2}$.

      - tipo: calcular
        titulo: La altura de la masa
        pregunta: |
          ¿Cuánto vale $h$ en unidades de $L$?
        respuesta:
          tipo: numero
          valor: '0.2'
          tolerancia: 0.005
          formato: un número, h dividido por L
        distractores:
          - valor: '1.2'
            mensaje: |
              Esa es la altura de la polea $C$ sobre el suelo. La masa cuelga
              $L$ por debajo de $C$, así que hay que restar esa $L$.
          - valor: '2'
            mensaje: |
              Sale de medir la altura de $C$ desde la directriz, $3L$, en vez
              de desde el suelo. El suelo está a la altura de $B$, que está $c$
              por encima de la directriz.
        pista: |
          $C$ está $y_C - c$ por encima de $B$, y $B$ está en el suelo. La masa
          cuelga $L$ por debajo de $C$.
        desarrollo: |
          $$
          h = (y_C - c) - L = (3L - 1{,}8L) - L = 0{,}2\,L = \frac{L}{5}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Del lado de D cuelgan la masa 2M y el tramo CD, que pesa Mg: la tensión en C es 3Mg y la altura de C sobre la directriz, 3L.'
          - texto: 'Equilibrio estricto: el tirón horizontal es $f$ por el peso apoyado, o sea $c = (6L-s)/2$.'
          - texto: Metiendo eso en $y_C^{2} = c^{2}+s^{2}$ sale $s_{BC} = 12L/5$ y $c = 9L/5$.
          - texto: $C$ está $y_C - c = 6L/5$ sobre el suelo, y la masa cuelga $L$ por debajo, así que $h = L/5$.
          - texto: La tensión en C es 2Mg, el peso de la masa, porque el cable del tramo CD no pesa.
            trampa: true
            mensaje: |
              El cable pesa en todos sus tramos, también en el vertical: $CD$
              mide $L$ y aporta $qL = Mg$. Con $2Mg$ en lugar de $3Mg$ el
              sistema de la catenaria ni siquiera tiene solución.
    resolucion: |
      **La tensión en C.** Del lado de $D$ cuelgan la masa y el propio tramo
      vertical:

      $$
      T_C = 2Mg + qL = 3Mg
      \qquad
      y_C = \frac{T_C}{q} = 3L
      $$

      **El equilibrio estricto.** En $B$ la tangente es horizontal, así que $B$
      es el punto más bajo y el tirón que la catenaria hace sobre el tramo
      apoyado vale $T_0 = qc$. Ese tramo mide $7L - L - s_{BC}$ y está a punto
      de deslizar:

      $$
      qc = f\,q\left(6L - s_{BC}\right)
      \;\Longrightarrow\;
      c = \frac{6L-s_{BC}}{2}
      $$

      **La catenaria.** Con $y_C^{2} = c^{2}+s_{BC}^{2}$:

      $$
      \left(3L-\frac{s_{BC}}{2}\right)^{2}+s_{BC}^{2} = 9L^{2}
      \;\Longrightarrow\;
      s_{BC} = \frac{12L}{5}
      \qquad
      c = \frac{9L}{5}
      $$

      **La altura de la masa.** $C$ está $y_C - c = 6L/5$ por encima de $B$, o
      sea del suelo, y la masa cuelga $L$ por debajo:

      $$
      h = \frac{6L}{5} - L = \frac{L}{5}
      $$

      **Comprobación.** El tramo apoyado mide $18L/5 = 3{,}6L$ y pesa $3{,}6Mg$;
      la mitad de eso, $1{,}8Mg$, es justo $qc = T_0$.

  - id: ejma5-col516-la-catenaria-el-muelle-y-el-disco
    titulo: Una catenaria entre un muelle y un disco a punto de deslizar
    fuente: >-
      Ejercicio 5.16 · Tema 5, «Cables» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección lo incluye en el bloque que marca como de nivel
      de examen, y publica el resultado, contra el que está contrastado el
      desarrollo.
    nivel: practica
    enunciado: |
      La estructura de la figura está en equilibrio con el disco a punto de
      deslizar. Está formada por un cable de peso por unidad de cable
      $w = \dfrac{2Mg}{L}$, el cual está unido en $B$ a un muelle ideal cuya
      deformación $\Delta x = \dfrac{L}{2}$ y constante
      $k = \dfrac{2\sqrt{2}Mg}{L}$ son conocidas. Este muelle está atado a un
      punto fijo y forma 45° con el cable en $B$. Por otro lado, el cable está
      atado a un disco de masa $M$ y radio $R$ en el punto $A$. La distancia
      horizontal entre los puntos $A$ y $B$ es de valor $L$. Finalmente, el
      sistema está en equilibrio debido a una fuerza $F$ desconocida aplicada
      sobre el centro del disco. Calcular:

      a. Parámetro de catenaria y tensión mínima del cable.

      b. Componentes horizontal y vertical de la fuerza del cable en el punto
      $A$.

      c. Fuerza $F$, y fuerzas normal y de rozamiento necesarias para mantener
      el sistema en equilibrio.

      <figure>
      <svg viewBox="0 0 470 250" role="img" width="470" height="250" aria-labelledby="ejma5-col516-t ejma5-col516-d">
        <title id="ejma5-col516-t">Catenaria entre un muelle inclinado y un disco a punto de deslizar</title>
        <desc id="ejma5-col516-d">Un cable con peso propio cuelga entre B, a la izquierda, y A, a la derecha, separados una distancia horizontal L. En B se ata un muelle inclinado 45 grados que sube hasta el punto fijo O. En A el cable se ata al punto izquierdo de un disco de masa M y radio R apoyado en el suelo, sobre cuyo centro actúa una fuerza horizontal F. La catenaria está dibujada con su ecuación, con parámetro L medios: su punto más bajo no está en el centro, sino más cerca de B, y A queda más alto que B.</desc>
        <defs>
          <marker id="ejma5-col516-f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
        </defs>
        <line x1="28.5" y1="115.6" x2="53.9" y2="90.2" stroke="var(--ink)" stroke-width="1.3"/>
        <path d="M31 110 L23 108 M37 104 L29 102 M43 98 L35 96 M49 92 L41 90" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <polyline points="41.2,102.9 48.3,110 50.4,120.6 65.2,118.5 63.1,133.3 78,131.2 75.8,146 90.7,143.9 88.6,158.8 103.4,156.6 111.9,173.6" fill="none" stroke="var(--d2)" stroke-width="1.6"/>
        <text x="30" y="96" font-size="10" text-anchor="end" fill="var(--ink)">O</text>
        <text x="120" y="112" font-size="9.5" fill="var(--d2-tinta)">Δx = OB = L/2</text>

