        <desc id="ejma5-col59-d">Una barra vertical BD de longitud L empotrada en el suelo. De su extremo superior B sale un muelle horizontal hasta la pared, a una distancia L. En el punto C de la barra, a media altura, se ata un cable con peso propio cuya tangente allí es horizontal; el cable sube hasta la polea E, situada a la altura de B, y de E baja vertical hasta F, el punto izquierdo de un disco de radio L cuartos apoyado en el suelo en G. Sobre el disco actúa un par P en sentido antihorario. La catenaria está dibujada con su ecuación, con parámetro L medios.</desc>
        <defs>
          <marker id="ejma5-col59-f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
