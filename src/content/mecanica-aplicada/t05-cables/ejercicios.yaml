    pide: Las tensiones en B, C y D, el coeficiente de rozamiento mínimo y la fuerza sobre la polea.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Con qué tensión horizontal se calcula el rozamiento del tramo
          apoyado en el suelo?
        opciones:
          - texto: >-
              Con la del tramo DE, que es otra catenaria con su propio
              parámetro, porque la polea conserva el módulo de la tensión pero
              no su componente horizontal
            correcta: true
            mensaje: |
              Eso es. A los dos lados de una polea lisa el **módulo** es el
              mismo, pero la dirección cambia, así que cada lado tiene su
              propio $T_0$ y su propio $c$. El que tira del tramo tumbado es el
              de $DE$.
          - texto: Con la misma T0 del tramo CD, porque la componente horizontal es igual en todo el cable
            mensaje: |
              La componente horizontal se conserva a lo largo de un cable
              continuo cargado en vertical, no al cruzar una polea: ahí es el
              módulo lo que pasa igual. Con esa confusión sale un coeficiente
              mayor que 1.
          - texto: Con la tensión en D, 1000 N, porque es el punto donde el cable cambia de dirección
            mensaje: |
              Los 1000 N son la tensión en $D$, que está inclinada. Lo que tira
              del tramo del suelo es la componente **horizontal** en $E$, donde
              el cable llega tumbado, y esa vale $T_0$ del tramo $DE$.

      - tipo: calcular
        titulo: La tensión en B y en C
        pregunta: |
          ¿Cuánto vale la tensión en el empalme $B$ y $C$?
        respuesta:
          tipo: magnitud
          valor: '800 N'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '1600 N'
            mensaje: |
              Has puesto la resultante de la carga triangular a 4 m de $A$, o
              sea con el lado mayor del triángulo en $B$. En la figura la carga
              es máxima en $A$, así que su resultante está a 2 m de $A$.
          - valor: '1200 N'
            mensaje: |
              Has puesto la resultante en el centro del vano, a 3 m. Eso
              valdría para un reparto uniforme; en uno triangular el centro de
              gravedad está a un tercio de la base desde el lado mayor.
        pista: |
          En $B$ el cable llega horizontal, así que la tensión allí es $T_0$ y
          su momento respecto de $A$ tiene brazo 2 m, el desnivel. La carga de
          800 N actúa a 2 m de $A$.
        desarrollo: |
          $$
          T_0 \cdot 2 = 800 \cdot 2
          \;\Longrightarrow\;
          T_B = T_C = 800\ \text{N}
          $$

      - tipo: calcular
        titulo: La tensión en D
        pregunta: |
          ¿Cuánto vale la tensión del cable en $D$?
        respuesta:
          tipo: magnitud
          valor: '1000 N'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '800 N'
            mensaje: |
              Esa es la tensión en $C$, el punto más bajo de la catenaria. En
              $D$, 2 m más arriba, la tensión ha crecido justo el peso de esos
              2 m de altura: $T = w\,y$.
          - valor: '1400 N'
            mensaje: |
              Has sumado los 800 N horizontales y los 600 N verticales como si
              fueran paralelos. Se combinan con Pitágoras, y da lo mismo que
              $w\,y_D$.
        pista: |
          $c = T_C/w = 8$ m, y $D$ está 2 m por encima de $C$, que es el punto
          más bajo. Usa $T = w\,y$.
        desarrollo: |
          $$
          c = \frac{800}{100} = 8\ \text{m}
          \qquad
          y_D = c + 2 = 10\ \text{m}
          \qquad
          T_D = w\,y_D = 1000\ \text{N}
          $$

          y el arco $CD$ mide $s = \sqrt{10^{2}-8^{2}} = 6$ m.

      - tipo: calcular
        titulo: El coeficiente de rozamiento mínimo
        pregunta: |
          ¿Cuál es el coeficiente de rozamiento mínimo entre el cable y el
          suelo?
        respuesta:
          tipo: numero
          valor: '0.8'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '1.067'
            mensaje: |
              Has usado los 800 N del tramo $CD$ como tiro horizontal. Tras la
              polea el parámetro cambia: el tramo $DE$ tiene $c' = 6$ m y su
              tirón horizontal es 600 N.
          - valor: '0.279'
            mensaje: |
              Has puesto el peso de los 21,5 m de cable como normal. En el
              suelo solo se apoyan 7,5 m; el resto está colgando y no aprieta.
        pista: |
          El tramo $DE$ es otra catenaria: en $D$ su tensión es también 1000 N
          y en $E$ llega horizontal, 4 m por debajo. De ahí salen $c'$ y la
          longitud apoyada.
        desarrollo: |
          $$
          c' = y_D - 4 = 6\ \text{m}
          \qquad
          s_{DE} = \sqrt{10^{2}-6^{2}} = 8\ \text{m}
          \qquad
          s_{EF} = 21{,}5 - 6 - 8 = 7{,}5\ \text{m}
          $$

          $$
          f = \frac{w\,c'}{w\,s_{EF}} = \frac{600}{750} = 0{,}8
          $$

      - tipo: calcular
        titulo: La fuerza sobre la polea
        pregunta: |
          ¿Cuánto vale el módulo de la fuerza de enlace sobre la polea $D$?
        respuesta:
          tipo: magnitud
          valor: '1414.2 N'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '2000 N'
            mensaje: |
              Has sumado los dos tiros de 1000 N como si fueran paralelos. Uno
              llega desde $C$ y el otro sale hacia $E$: entre ellos hay un
              ángulo, y la suma vectorial es menor.
          - valor: '1000 N'
            mensaje: |
              Ese es el módulo de cada uno de los dos tiros. La polea equilibra
              los dos a la vez.
        pista: |
          El cable tira de la polea hacia $C$ con $(-800,-600)$ y hacia $E$ con
          $(600,-800)$. Suma y cambia de signo.
        desarrollo: |
          $$
          \vec{R}_D = (800-600)\,\hat{i} + (600+800)\,\hat{j}
          = 200\,\hat{i}+1400\,\hat{j}\ \text{N}
          $$

          $$
          \left|\vec{R}_D\right| = \sqrt{200^{2}+1400^{2}} = 1414{,}2\ \text{N}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'El cable AB llega horizontal a B: momentos en A con la carga triangular a 2 m dan T = 800 N.'
          - texto: 'La catenaria $CD$ tiene $c = 8$ m, y $D$ está 2 m más arriba: $T_D = w(c+2) = 1000$ N y $s_{CD} = 6$ m.'
          - texto: Tras la polea, $DE$ tiene $c' = y_D - 4 = 6$ m y $s_{DE} = 8$ m, así que en el suelo quedan 7,5 m.
          - texto: $f = 600/750 = 0{,}8$, y la fuerza sobre la polea es la suma vectorial de los dos tiros, 1414,2 N.
          - texto: Al pasar por la polea D la componente horizontal no cambia, así que el tramo DE tiene también c igual a 8 m.
            trampa: true
            mensaje: |
              En una polea lisa lo que se conserva es el **módulo** de la
              tensión, no su proyección. Si el tramo $DE$ tuviera $c = 8$ m, su
              tirón horizontal sería 800 N contra 750 N de peso apoyado, y
              haría falta un coeficiente mayor que 1.
    resolucion: |
      **El cable sin masa.** Llega horizontal a $B$, así que allí está su punto
      más bajo y su tensión es $T_0$. La carga triangular de 800 N tiene el
      lado mayor en $A$, o sea que su resultante está a 2 m de $A$; tomando
      momentos en $A$, con el desnivel de 2 m como brazo de $T_0$:

      $$
      T_0\cdot 2 = 800\cdot 2
      \;\Longrightarrow\;
      T_B = T_C = 800\ \text{N}
      $$

      **La catenaria CD.**

      $$
      c = \frac{800}{100} = 8\ \text{m}
      \qquad
      y_D = 10\ \text{m}
      \qquad
      T_D = 1000\ \text{N}
      \qquad
      s_{CD} = 6\ \text{m}
      $$

      **La catenaria DE.** La polea es lisa, así que en $D$ la tensión del otro
      lado vale también 1000 N. En $E$ el cable llega tumbado, 4 m por debajo
      de $D$, así que $E$ es el punto más bajo de ese tramo:

      $$
      c' = 10 - 4 = 6\ \text{m}
      \qquad
      s_{DE} = \sqrt{10^{2}-6^{2}} = 8\ \text{m}
      $$

      **El rozamiento.** En el suelo quedan $21{,}5 - 6 - 8 = 7{,}5$ m, que
      pesan 750 N, y el tirón horizontal en $E$ es $w\,c' = 600$ N:

      $$
      f_{\min} = \frac{600}{750} = 0{,}8
      $$

      **La polea.**

      $$
      \vec{R}_D = 200\,\hat{i}+1400\,\hat{j}\ \text{N}
      \qquad
      \left|\vec{R}_D\right| = 1414{,}2\ \text{N}
      $$

  - id: ejma5-col512-la-barra-apoyada-y-el-cable-por-la-polea
    titulo: Una barra apoyada en el suelo y un cable que pasa por una polea
    fuente: >-
      Ejercicio 5.12 · Tema 5, «Cables» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección lo incluye en el bloque que marca como de nivel
      de examen, y publica el resultado, contra el que está contrastado el
      desarrollo.
    nivel: practica
    enunciado: |
      El extremo $A$ de la barra $AB$ de masa $M$ y longitud $L$ está apoyado
      en una superficie rugosa con coeficiente de rozamiento al deslizamiento
      de valor $f = 2/3$. El otro extremo $B$ está amarrado a un cable $BCD$ de
      peso propio $q = Mg/L$ que pasa por una polea $C$ de radio despreciable y
      tiene su extremo $D$ atado a un punto fijo. La tangente al cable en $B$
      es horizontal y la tensión en $D$ forma con la horizontal
      $\varphi = \text{arctg}(4/3)$. Calcular:

      a. Fuerza de rozamiento en $A$.

      b. Tensión (fuerza interna) en $B$.

      c. Longitud del tramo del cable $BC$.

      d. Expresión vectorial de la tensión (fuerza interna) del cable en $D$.

      e. Fuerza de enlace sobre la polea $C$.

      f. Longitud del cable $BCD$.

      <figure>
      <svg viewBox="0 0 340 292" role="img" width="340" height="292" aria-labelledby="ejma5-col512-t ejma5-col512-d">
        <title id="ejma5-col512-t">Barra apoyada en el suelo con un cable que pasa por una polea y se ata a un punto fijo</title>
        <desc id="ejma5-col512-d">Una barra AB de longitud L apoyada en el suelo rugoso por su extremo A, formando 45 grados con la horizontal, y con su extremo B arriba a la izquierda. En B se amarra un cable con peso propio cuya tangente allí es horizontal; el cable sube hasta la polea C, situada L octavos por encima de B, y desde C cuelga hasta el punto fijo D, que está a la misma altura que C. En D la tensión forma con la horizontal un ángulo de arcotangente cuatro tercios. La figura está dibujada a escala con los parámetros resueltos.</desc>
        <path d="M60 120 L65.8 119.8 L71.6 119.3 L77.3 118.5 L83.1 117.3 L88.9 115.8 L94.7 113.9 L100.4 111.7 L106.2 109.1 L112 106.2 L117.8 102.8 L123.5 99.1 L129.3 95" fill="none" stroke="var(--d1)" stroke-width="2.2"/>
        <path d="M129.3 95 L139.6 107.6 L149.9 118.1 L160.2 126.6 L170.5 133.4 L180.8 138.5 L191.1 142.2 L201.4 144.3 L211.7 145 L222 144.3 L232.3 142.2 L242.6 138.5 L252.9 133.4 L263.2 126.6 L273.5 118.1 L283.8 107.6 L294.1 95" fill="none" stroke="var(--d2)" stroke-width="2.2"/>
        <circle cx="129.3" cy="95" r="5" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/>
        <circle cx="129.3" cy="95" r="1.6" fill="var(--ink)"/>

        <path d="M282 82 L310 82 M284 82 L278 76 M292 82 L286 76 M300 82 L294 76 M308 82 L302 76" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <line x1="282" y1="82" x2="310" y2="82" stroke="var(--ink)" stroke-width="1.2"/>
        <line x1="294.1" y1="82" x2="294.1" y2="95" stroke="var(--ink)" stroke-width="1"/>

        <line x1="60" y1="120" x2="201.4" y2="261.4" stroke="var(--ink)" stroke-width="3.4"/>
        <circle cx="60" cy="120" r="3.6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
        <circle cx="201.4" cy="261.4" r="3" fill="var(--ink)"/>
        <circle cx="294.1" cy="95" r="3" fill="var(--ink)"/>

        <line x1="120" y1="261.4" x2="300" y2="261.4" stroke="var(--ink)" stroke-width="1.3"/>
        <path d="M126 261.4 L120 269.4 M142 261.4 L136 269.4 M158 261.4 L152 269.4 M174 261.4 L168 269.4 M190 261.4 L184 269.4 M206 261.4 L200 269.4 M222 261.4 L216 269.4 M238 261.4 L232 269.4 M254 261.4 L248 269.4 M270 261.4 L264 269.4 M286 261.4 L280 269.4" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
