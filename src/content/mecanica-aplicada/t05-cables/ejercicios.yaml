        <path d="M358 69 L389 69 M360 69 L354 63 M368 69 L362 63 M376 69 L370 63 M384 69 L378 63" fill="none" stroke="var(--faint)" stroke-width="0.9"/>

        <path d="M85.3 129 L97.3 133.6 L109.3 137.5 L121.3 141 L133.3 143.8 L145.3 146.2 L157.3 148 L169.3 149.2 L181.3 149.9 L193.3 150 L205.3 149.6 L217.3 148.6 L229.3 147.1 L241.3 145 L253.3 142.4 L265.3 139.2 L277.3 135.5 L289.3 131.2 L301.3 126.4 L313.3 121 L325.3 115 L337.3 108.6 L349.3 101.5 L361.3 94 L373.3 85.8" fill="none" stroke="var(--d1)" stroke-width="2.2"/>
