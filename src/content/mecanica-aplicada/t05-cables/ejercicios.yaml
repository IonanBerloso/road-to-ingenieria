ejercicios:
  - id: ejma5-la-parabola-del-puente
    titulo: El cable de un puente colgante, y dónde tira más
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      El cable principal de un puente colgante tiene sus dos amarres a la
      misma altura, separados 40 m, y su punto más bajo, en el centro, está
      5 m por debajo de ellos. Soporta una carga uniforme por unidad de
      abscisa $q_0 = 2\ \text{kN/m}$ y su peso propio se desprecia. Calcular la
      tensión en el punto más bajo y la tensión máxima.
    pide: La tensión mínima, en el centro, y la máxima, en los amarres.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué forma tiene el cable, y por qué?
        opciones:
          - texto: Una parábola, porque la carga es uniforme por unidad de longitud horizontal
            correcta: true
            mensaje: |
              Eso es. Con $q$ constante en horizontal, $y'' = q_0/T_0$ es
              constante y el cable sale $y = q_0 x^{2}/(2T_0)$ desde el punto
              más bajo.
          - texto: Una catenaria, porque es un cable colgado de dos puntos
            mensaje: |
              La catenaria es la forma de un cable que cuelga con su propio
              peso, repartido a lo largo del cable. Aquí el peso propio se
              desprecia y la carga va repartida en horizontal: eso da una
              parábola.
          - texto: Dos tramos rectos, porque está sujeto en dos puntos
            mensaje: |
              Los tramos rectos salen con cargas concentradas. Una carga
              repartida a lo largo de toda la luz curva el cable en cada
              punto.

      - tipo: calcular
        titulo: La tensión en el punto más bajo
        pregunta: |
          ¿Cuánto vale $T_0$?
        respuesta:
          tipo: magnitud
          valor: '80 kN'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '160 kN'
            mensaje: |
              Te has dejado el 2 del denominador: la parábola es
              $y = q_0 x^{2}/(2T_0)$. Al despejar,
              $T_0 = q_0 x^{2}/(2y)$.
          - valor: '320 kN'
            mensaje: |
              Has usado la luz entera, 40 m, como $x$. La $x$ se mide desde el
              punto más bajo, que está en el centro: el amarre está en
              $x = 20\ \text{m}$.
        pista: |
          En el amarre, $x = 20\ \text{m}$ e $y = 5\ \text{m}$. Despeja $T_0$ de
          $y = q_0 x^{2}/(2T_0)$.
        desarrollo: |
          $$
          T_0 = \frac{q_0\,x^{2}}{2y} = \frac{2 \cdot 20^{2}}{2 \cdot 5} = 80\ \text{kN}
          $$

      - tipo: calcular
        titulo: La tensión máxima
        pregunta: |
          ¿Cuánto vale la tensión en los amarres?
        respuesta:
          tipo: magnitud
          valor: '89.44 kN'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '120 kN'
            mensaje: |
              Has sumado $T_0$ y la carga del medio cable como si fueran
              paralelas. Una es horizontal y la otra vertical: se combinan
              con Pitágoras.
          - valor: '80 kN'
            mensaje: |
              Esa es la tensión mínima, en el centro. En el amarre el cable está
              inclinado, y a la componente horizontal $T_0$ se le suma en
              cuadratura la vertical, que es la carga de medio cable.
        pista: |
          En el amarre, la componente vertical es la carga del medio cable,
          $q_0 \cdot 20 = 40\ \text{kN}$, y la horizontal sigue siendo $T_0$.
        desarrollo: |
          $$
          T_{\max} = \sqrt{T_0^{2} + (q_0 x)^{2}} = \sqrt{80^{2} + 40^{2}} = \sqrt{8000} = 89{,}44\ \text{kN}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Carga uniforme en horizontal: el cable es la parábola $y = q_0 x^{2}/(2T_0)$, con el origen en el punto más bajo.'
          - texto: En el amarre, $x = 20$ e $y = 5$, así que $T_0 = 2 \cdot 400/10 = 80$ kN.
          - texto: La componente vertical en el amarre es la carga de medio cable, 40 kN, y $T_{\max} = \sqrt{80^{2} + 40^{2}} = 89{,}4$ kN.
          - texto: La tensión es la misma en todo el cable, 80 kN, porque el cable es continuo.
            trampa: true
            mensaje: |
              Lo que es igual en todo el cable es la componente **horizontal**
              de la tensión. La tensión total crece hacia los amarres, donde el
              cable se inclina y aparece una componente vertical.
    resolucion: |
      **La forma.** Con la carga repartida uniforme en horizontal, el cable es
      una parábola. Con el origen en el punto más bajo:

      $$
      y = \frac{q_0}{2T_0}\,x^{2}
      $$

      **La tensión mínima.** En el amarre, $x = 20\ \text{m}$ e $y = 5\ \text{m}$:

      $$
      T_0 = \frac{q_0\,x^{2}}{2y} = \frac{2 \cdot 400}{10} = 80\ \text{kN}
      $$

      **La tensión máxima.** Es la del amarre. Su componente horizontal es
      $T_0$ y la vertical, la carga del medio cable, $2 \cdot 20 = 40\ \text{kN}$:

      $$
      T_{\max} = \sqrt{80^{2} + 40^{2}} = 89{,}44\ \text{kN}
      $$

      Solo un 12 % más que en el centro: un cable tan poco combado trabaja
      casi en horizontal.

  - id: ejma5-la-catenaria-en-un-punto
    titulo: La longitud y la tensión de una catenaria en un punto
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Un cable de peso $w = 10\ \text{N/m}$ cuelga de dos amarres y su tensión
      en el punto más bajo $O$ es de 20 N. Calcular el parámetro de la
      catenaria, la longitud de cable entre $O$ y el punto $P$ situado a 3 m de
      $O$ en horizontal, y la tensión en $P$.
    pide: El parámetro c, la longitud de arco de O a P y la tensión en P.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Desde dónde se mide la $y$ en las fórmulas de la catenaria?
        opciones:
          - texto: Desde un eje situado a una distancia c por debajo del punto más bajo
            correcta: true
            mensaje: |
              Eso es. Con ese origen, en el punto más bajo $y = c$, y las tres
              fórmulas quedan limpias: $y = c\cosh(x/c)$, $s = c\sinh(x/c)$ y
              $T = wy$.
          - texto: Desde el punto más bajo del cable
            mensaje: |
              Con el origen en el punto más bajo la curva sería
              $y = c\cosh(x/c) - c$, y $T = wy$ dejaría de valer. Las fórmulas
              del curso ponen el eje $c$ por debajo.
          - texto: Desde la recta que une los dos amarres
            mensaje: |
              Esa recta depende de cómo estén los amarres, y no aparece en
              ninguna de las fórmulas. El eje de la catenaria lo fija el propio
              cable: $c$ por debajo de su punto más bajo.

      - tipo: calcular
        titulo: El parámetro de la catenaria
        pregunta: |
          ¿Cuánto vale $c$?
        respuesta:
          tipo: magnitud
          valor: '2 m'
          formato: una longitud, con su unidad
        distractores:
          - valor: '0.5 m'
            mensaje: |
              Has dividido al revés, $w/T_0$. El parámetro es la tensión en el
              punto más bajo entre el peso por metro: $c = T_0/w$.
        pista: |
          $c = T_0/w$.
        desarrollo: |
          $$
          c = \frac{T_0}{w} = \frac{20}{10} = 2\ \text{m}
          $$

      - tipo: calcular
        titulo: La longitud de cable de O a P
        pregunta: |
          ¿Cuánto cable hay entre $O$ y $P$?
        respuesta:
          tipo: magnitud
          valor: '4.259 m'
          formato: una longitud, con su unidad
        distractores:
          - valor: '3 m'
            mensaje: |
              Esa es la distancia en horizontal. El cable no va recto: sube en
              curva, y su longitud es mayor.
          - valor: '4.705 m'
            mensaje: |
              Esa es la altura de $P$ sobre el eje, $y = c\cosh(x/c)$. La
              longitud de arco lleva el seno hiperbólico: $s = c\sinh(x/c)$.
        pista: |
          $s = c\sinh(x/c)$, con $x/c = 1{,}5$.
        desarrollo: |
          $$
          s = c\,\sinh\frac{x}{c} = 2\,\sinh(1{,}5) = 2 \cdot 2{,}1293 = 4{,}259\ \text{m}
          $$

      - tipo: calcular
        titulo: La tensión en P
        pregunta: |
          ¿Cuánto vale la tensión en $P$?
        respuesta:
          tipo: magnitud
          valor: '47.05 N'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '42.59 N'
            mensaje: |
              Has calculado $w\,s$, que es solo la componente **vertical** de
              la tensión. La total es $w\sqrt{c^{2} + s^{2}} = w\,y$.
          - valor: '20 N'
            mensaje: |
              Esa es la tensión en el punto más bajo, y también la componente
              horizontal en cualquier punto. En $P$ el cable está inclinado y
              la tensión es mayor.
        pista: |
          $T = w\,y$, con $y = c\cosh(x/c)$.
        desarrollo: |
          $$
          T = w\,c\,\cosh\frac{x}{c} = 10 \cdot 2 \cdot 2{,}3524 = 47{,}05\ \text{N}
          $$

          Comprobación: $w\sqrt{c^{2} + s^{2}} = 10\sqrt{4 + 18{,}136} = 47{,}05\ \text{N}$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: $c = T_0/w = 2$ m, y el eje $x$ está 2 m por debajo del punto más bajo.
          - texto: $s = c\sinh(x/c) = 2\sinh(1{,}5) = 4{,}259$ m.
          - texto: $T = w\,y = w\,c\cosh(x/c) = 47{,}05$ N, que es también $w\sqrt{c^{2} + s^{2}}$.
          - texto: La tensión en $P$ es el peso del cable entre $O$ y $P$, $w\,s = 42{,}6$ N.
            trampa: true
            mensaje: |
              El peso del tramo $OP$ es solo la componente vertical de la
              tensión en $P$. A esa se le suma en cuadratura la horizontal,
              $T_0 = 20$ N, y queda $w\,y = 47{,}05$ N.
    resolucion: |
      **El parámetro.** $c = T_0/w = 20/10 = 2\ \text{m}$. Es también la distancia
      del punto más bajo al eje $x$ de las fórmulas.

      **La longitud de arco.** Desde el punto más bajo,

      $$
      s = c\,\sinh\frac{x}{c} = 2\,\sinh(1{,}5) = 4{,}259\ \text{m}
      $$

      **La tensión.** Es el peso de un trozo de cable tan largo como la altura
      de $P$ sobre el eje:

      $$
      y = c\,\cosh\frac{x}{c} = 2 \cdot 2{,}3524 = 4{,}705\ \text{m}
      \qquad
      T = w\,y = 47{,}05\ \text{N}
      $$

      Las tres cuadran entre sí: $y^{2} = 22{,}14$ y $c^{2} + s^{2} = 4 + 18{,}14 = 22{,}14$.
