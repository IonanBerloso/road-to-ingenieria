        <line x1="324" y1="100" x2="324" y2="230" stroke="var(--faint)" stroke-width="0.8"/>
        <path d="M320 100 L328 100 M320 230 L328 230" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="330" y="168" font-size="9" fill="var(--faint)">L</text>
        <line x1="20" y1="256" x2="150" y2="256" stroke="var(--faint)" stroke-width="0.8"/>
        <path d="M20 252 L20 260 M150 252 L150 260" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="85" y="250" font-size="9" text-anchor="middle" fill="var(--faint)">L</text>
      </svg>
      <figcaption>

      La tangente del cable en **C** es horizontal, así que **C** es el punto
      más bajo de la catenaria. El tramo **EF** es vertical y mide **3L/4**,
      desde la altura **L** hasta el punto izquierdo del disco, a **L/4** del
      suelo.

      </figcaption>
      </figure>
    pide: Las fuerzas del cable en C y en F, el par P, el rozamiento en G y las reacciones en D.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado da la longitud total $s_{CEF}$. ¿Cuánto mide la parte
          que forma catenaria?
        opciones:
          - texto: >-
              Mide raíz de tres por L medios, porque al total hay que quitarle
              el tramo vertical EF, que baja de la altura L a la altura L/4
            correcta: true
            mensaje: |
              Eso es. $EF = L - L/4 = 3L/4$, y
              $s_{CE} = (3+2\sqrt{3})L/4 - 3L/4 = \sqrt{3}L/2$. Solo ese trozo
              cuelga como catenaria; el vertical es una recta.
          - texto: Mide la longitud entera que da el enunciado, porque todo el cable pesa igual
            mensaje: |
              Todo el cable pesa igual, sí, pero el tramo $EF$ es **recto y
              vertical**: no es catenaria. Las fórmulas $y = c\cosh(x/c)$ y
              $s = c\sinh(x/c)$ solo valen del punto más bajo hasta $E$.
          - texto: Mide la longitud total menos L, porque EF baja desde E hasta el suelo
            mensaje: |
              $F$ no está en el suelo: es el punto izquierdo del disco, a la
              altura de su centro, $L/4$. El tramo vertical mide $3L/4$, no
              $L$.

      - tipo: calcular
        titulo: El parámetro de catenaria
        pregunta: |
          ¿Cuánto vale $c$ en unidades de $L$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.005
          formato: un número, c dividido por L
        distractores:
          - valor: '1.9'
            mensaje: |
              Has metido en la catenaria la longitud entera del cable,
              $(3+2\sqrt{3})L/4$. El tramo vertical $EF$ no es catenaria: hay
              que descontarlo antes.
          - valor: '0.866'
            mensaje: |
              Ese es $s_{CE}$, la longitud del arco, no el parámetro. Los dos
              son longitudes, pero $c$ sale de combinarlo con el desnivel:
              $y^{2} = c^{2}+s^{2}$.
        pista: |
          $C$ es el punto más bajo, así que $y_C = c$ y $y_E = c + L/2$.
          Aplica $y_E^{2} = c^{2} + s_{CE}^{2}$.
        desarrollo: |
          $$
          \left(c+\frac{L}{2}\right)^{2} = c^{2} + \left(\frac{\sqrt{3}}{2}L\right)^{2}
          \;\Longrightarrow\;
          cL + \frac{L^{2}}{4} = \frac{3L^{2}}{4}
          \;\Longrightarrow\;
          c = \frac{L}{2}
          $$

      - tipo: calcular
        titulo: La fuerza del cable en C
        pregunta: |
          ¿Cuánto vale $T_C$ en unidades de $Mg$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.005
          formato: un número, T_C dividido por Mg
        distractores:
          - valor: '1'
            mensaje: |
              Esa es la tensión en $E$, donde el cable ya está inclinado y
              carga con el peso del tramo $CE$. En $C$ la tangente es
              horizontal y la tensión es la mínima, $T_0 = qc$.
          - valor: '0.866'
            mensaje: |
              Ese es el peso del tramo $CE$, $q\,s_{CE}$, que es la componente
              **vertical** de la tensión en $E$. La de $C$ es horizontal y vale
              $qc$.
        pista: |
          En el punto más bajo la tensión es $T_0 = q\,c$.
        desarrollo: |
          $$
          T_C = q\,c = \frac{Mg}{L}\cdot\frac{L}{2} = \frac{Mg}{2}
          $$

      - tipo: calcular
        titulo: La fuerza del cable en F
        pregunta: |
          ¿Cuánto vale $T_F$ en unidades de $Mg$?
        respuesta:
          tipo: numero
          valor: '0.25'
          tolerancia: 0.005
          formato: un número, T_F dividido por Mg
        distractores:
          - valor: '1'
            mensaje: |
              Esa es la tensión en $E$. Bajando de $E$ a $F$ el cable se
              descarga de su propio peso: el tramo vertical pesa
              $q\cdot 3L/4 = 3Mg/4$, y eso es lo que hay que restar.
          - valor: '0'
            mensaje: |
              Sale de suponer que el tramo vertical mide $L$, o sea que $F$
              está en el suelo. $F$ es el punto izquierdo del disco, a $L/4$ de
              altura, así que el tramo mide $3L/4$.
        pista: |
          $T_E = q\,y_E = q(c + L/2) = Mg$, y de $E$ a $F$ el cable pierde el
          peso del tramo vertical.
        desarrollo: |
          $$
          T_E = q\left(c+\frac{L}{2}\right) = Mg
          \qquad
          T_F = T_E - q\cdot\frac{3L}{4} = Mg - \frac{3Mg}{4} = \frac{Mg}{4}
          $$

      - tipo: calcular
        titulo: El par P
        pregunta: |
          ¿Cuánto vale $P$ en unidades de $MgL$?
        respuesta:
          tipo: numero
          valor: '0.0625'
          tolerancia: 0.002
          formato: un número, P dividido por Mg por L
        distractores:
          - valor: '0.25'
            mensaje: |
              Has usado $L$ como brazo. El cable tira de $F$, que está a un
              radio del centro: el brazo es $L/4$, no $L$.
          - valor: '0.125'
            mensaje: |
              Has usado el diámetro, $L/2$, como brazo. El momento respecto del
              centro se toma con la distancia del centro al punto de
              aplicación, que es el radio $L/4$.
        pista: |
          Momentos en el centro del disco: la única fuerza con brazo es la del
          cable en $F$, vertical y a un radio del centro.
        desarrollo: |
          $$
          P = T_F\cdot\frac{L}{4} = \frac{Mg}{4}\cdot\frac{L}{4}
          = \frac{MgL}{16} = 0{,}0625\,MgL
          $$

      - tipo: calcular
        titulo: El rozamiento en G
        pregunta: |
          ¿Cuánto vale la fuerza de rozamiento entre el disco y el suelo, en
          unidades de $Mg$?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.005
          formato: un número, la fuerza de rozamiento dividida por Mg
        distractores:
          - valor: '0.25'
            mensaje: |
              Esa es la fuerza que el cable hace en $F$, pero es **vertical**:
              el tramo $EF$ cuelga a plomo. Sin ninguna fuerza horizontal
              aplicada al disco, el rozamiento no tiene nada que equilibrar.
          - valor: '0.75'
            mensaje: |
              Ese es el valor de la normal, $N = Mg - Mg/4$. El rozamiento es
              horizontal y sale del equilibrio horizontal del disco, que no
              tiene ningún otro término.
        pista: |
          Escribe el equilibrio **horizontal** del disco y mira qué fuerzas
          tienen componente horizontal.
        desarrollo: |
          Sobre el disco actúan su peso, la normal, el par $P$, el rozamiento y
          la tensión del cable en $F$, que es vertical porque el tramo $EF$ es
          vertical. El equilibrio horizontal queda

          $$
          F_r = 0
          $$

          El par $P$ lo equilibra el momento de la tensión en $F$ respecto del
          centro, no el rozamiento.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'El tramo EF es vertical y mide 3L/4, así que la catenaria CE mide raíz de tres por L medios.'
          - texto: Con $C$ como punto más bajo, $(c+L/2)^{2} = c^{2}+s_{CE}^{2}$ da $c = L/2$, y $T_C = qc = Mg/2$.
          - texto: $T_E = q(c+L/2) = Mg$ y, descontando el peso del tramo vertical, $T_F = Mg/4$.
          - texto: Momentos en el centro del disco dan $P = T_F\,L/4 = MgL/16$, y el equilibrio horizontal, $F_r = 0$.
          - texto: La tensión en F vale lo mismo que en E, porque entre los dos puntos el cable es recto.
            trampa: true
            mensaje: |
              Que sea recto no quiere decir que la tensión no cambie: el tramo
              **pesa**. En un trozo vertical la tensión crece hacia arriba
              justo el peso de lo que cuelga por debajo, aquí
              $q\cdot 3L/4 = 3Mg/4$.
    resolucion: |
      **La catenaria.** El tramo $EF$ es vertical y va de la altura $L$ a la
      altura $L/4$, así que mide $3L/4$ y el arco de catenaria es

      $$
      s_{CE} = \frac{(3+2\sqrt{3})L}{4} - \frac{3L}{4} = \frac{\sqrt{3}}{2}L
      $$

      En $C$ la tangente es horizontal: $C$ es el punto más bajo, $y_C = c$ e
      $y_E = c + L/2$. Con $y^{2} = c^{2}+s^{2}$:

      $$
      \left(c+\frac{L}{2}\right)^{2} = c^{2}+\frac{3L^{2}}{4}
      \;\Longrightarrow\;
      c = \frac{L}{2}
      $$

      **Las fuerzas del cable.**

      $$
      T_C = qc = \frac{Mg}{2}
      \qquad
      T_E = q\left(c+\frac{L}{2}\right) = Mg
      \qquad
      T_F = T_E - q\,\frac{3L}{4} = \frac{Mg}{4}
      $$

      **El disco.** La tensión en $F$ es vertical y está a un radio del centro:

      $$
      P = \frac{Mg}{4}\cdot\frac{L}{4} = \frac{MgL}{16}
      \qquad
      F_r = 0
      \qquad
      N = Mg - \frac{Mg}{4} = \frac{3Mg}{4}
      $$

      **Las reacciones en D, que la colección no imprime.** Aquí hay que
      declarar un supuesto: se toma el «resorte ideal» con longitud natural
      nula, que es como lo usa la propia colección en el ejercicio 5.16, donde
      su figura escribe que la deformación del muelle es toda su longitud
      $\Delta x = \overline{OB}$. Con ese supuesto el muelle tira de $B$ hacia
      la pared con $kL = Mg$, y el empotramiento equilibra eso, el peso de la
      barra y el tiro horizontal del cable en $C$:

      $$
      D_x = Mg - \frac{Mg}{2} = \frac{Mg}{2}
      \qquad
      D_y = Mg
      \qquad
      M_D = Mg\,L - \frac{Mg}{2}\cdot\frac{L}{2} = \frac{3MgL}{4}
      $$

      Si el muelle tuviera otra longitud natural, $D_x$ y $M_D$ cambiarían; los
      cuatro apartados que la colección sí publica no dependen del supuesto.

  - id: ejma5-col510-la-anilla-entre-dos-cables
    titulo: Una anilla lisa entre un cable con carga triangular y otro con peso
    fuente: >-
      Ejercicio 5.10 · Tema 5, «Cables» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección lo incluye en el bloque que marca como de nivel
      de examen, y publica el resultado, contra el que está contrastado el
      desarrollo.
    nivel: practica
    enunciado: |
      Un cable de masa despreciable está suspendido entre el punto fijo $A$ y
      una anilla sin masa $B$ que puede deslizar sin rozamiento a lo largo de
      una guía horizontal. La tensión de $AB$ en $B$ forma 45° con la
      horizontal y la carga que soporta es de forma triangular continua por
      unidad de abscisa $(x)$, de valor nulo en $A$ y $10\ \text{N/m}$ en $B$.
      Otro cable pesado $BCD$ de $37\ \text{m}$ de longitud y
      $10\ \text{N/m}$ de peso por unidad de longitud está atado a la anilla
      $B$ y pasa por una polea $C$ de radio despreciable, de forma que el tramo
      vertical $CD$ mide $13\ \text{m}$. Sabiendo que $A$, $B$ y $C$ están a la
      misma altura, calcular:

      a. Tensión (fuerza interna) en $C$ del cable $BCD$.

      b. Fuerza de enlace de la polea $C$ sobre el cable.

      c. Distancia entre $A$ y $B$.

      d. Ecuación de la curva del cable $AB$ en los ejes de la figura.

      <figure>
      <svg viewBox="0 0 460 252" role="img" width="460" height="252" aria-labelledby="ejma5-col510-t ejma5-col510-d">
        <title id="ejma5-col510-t">Cable con carga triangular y cable con peso propio unidos por una anilla</title>
        <desc id="ejma5-col510-d">Ejes con el origen en el punto fijo A, x hacia la derecha e y hacia arriba. De A parte un cable sin peso que soporta una carga triangular, nula en A y de 10 newtons por metro en B, y llega a la anilla B, que desliza por una guía horizontal a la misma altura que A. En B la tensión forma 45 grados con la horizontal. De B parte un cable pesado que cuelga como catenaria hasta la polea C, a la misma altura, y de C baja un tramo vertical de 13 metros hasta el extremo D. Todo está dibujado a escala: A y B distan 15 metros y la catenaria BC tiene 8 metros de flecha.</desc>
        <defs>
          <marker id="ejma5-col510-f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <line x1="55" y1="70" x2="112" y2="70" stroke="var(--ink)" stroke-width="1" marker-end="url(#ejma5-col510-f)"/>
        <text x="116" y="74" font-size="10" fill="var(--ink)">x</text>
        <line x1="55" y1="70" x2="55" y2="34" stroke="var(--ink)" stroke-width="1" marker-end="url(#ejma5-col510-f)"/>
        <text x="48" y="38" font-size="10" text-anchor="end" fill="var(--ink)">y</text>

        <line x1="170" y1="70" x2="272" y2="70" stroke="var(--ink)" stroke-width="1.2"/>
