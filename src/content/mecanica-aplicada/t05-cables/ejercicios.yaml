        <text x="146" y="186" font-size="10" text-anchor="end" fill="var(--ink)">B</text>
        <text x="198" y="182" font-size="10" text-anchor="end" fill="var(--ink)">C</text>
        <text x="274" y="110" font-size="10" text-anchor="end" fill="var(--ink)">D</text>
        <text x="366" y="36" font-size="10" fill="var(--ink)">E</text>

        <line x1="152" y1="178" x2="152" y2="208" stroke="var(--flag)" stroke-width="1.6" marker-end="url(#ejma5-col52-f)"/>
        <text x="152" y="222" font-size="9.5" text-anchor="middle" fill="var(--flag)">6 kN</text>
        <line x1="204" y1="176" x2="204" y2="228" stroke="var(--flag)" stroke-width="1.6" marker-end="url(#ejma5-col52-f)"/>
        <text x="204" y="242" font-size="9.5" text-anchor="middle" fill="var(--flag)">12 kN</text>
        <line x1="282" y1="120" x2="282" y2="152" stroke="var(--flag)" stroke-width="1.6" marker-end="url(#ejma5-col52-f)"/>
        <text x="290" y="150" font-size="9.5" fill="var(--flag)">4 kN</text>

