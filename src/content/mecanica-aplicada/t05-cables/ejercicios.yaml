      </figcaption>
      </figure>
    pide: La ecuación de la curva, la flecha máxima y el valor de la carga p.
    pasos:
      - tipo: reconocer
        pregunta: |
          En $B$ solo se atan el muelle y el cable. ¿Qué se saca de ahí?
        opciones:
          - texto: >-
              Que la tensión del cable en B tiene la dirección del muelle, 45
              grados, y su módulo es el del muelle, k por el alargamiento
            correcta: true
            mensaje: |
              Eso es. $B$ es un punto sin masa con dos fuerzas: tienen que ser
              iguales y opuestas. El alargamiento es
              $2\sqrt{2} - \sqrt{2} = \sqrt{2}$, así que el muelle tira con
              $10\sqrt{2}$ N a 45 grados.
          - texto: Que la fuerza del muelle es k por su longitud, 10 por 2 raíz de dos
            mensaje: |
              Un muelle no responde a su longitud sino a lo que se ha
              **estirado**: $F = k(L - L_0)$. Aquí se ha estirado de
              $\sqrt{2}$ a $2\sqrt{2}$, o sea $\sqrt{2}$ metros.
          - texto: Que el cable llega a B horizontal, porque B es el extremo bajo del cable
            mensaje: |
              Si el cable llegara horizontal a $B$, no podría tirar del muelle
              hacia abajo y el muelle no estaría estirado. De hecho el punto
              más bajo del cable no es $B$: está a la derecha, dentro del vano.

      - tipo: calcular
        titulo: La tensión horizontal
        pregunta: |
          ¿Cuánto vale $T_0$, la componente horizontal de la tensión del cable?
        respuesta:
          tipo: magnitud
          valor: '10 N'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '14.14 N'
            mensaje: |
              Ese es el módulo de la fuerza del muelle, $10\sqrt{2}$ N. Como
              está a 45 grados, su componente horizontal, que es la que vale
              $T_0$, es ese módulo por $\cos 45^{\circ}$.
          - valor: '20 N'
            mensaje: |
              Has usado la longitud del muelle, $2\sqrt{2}$, en lugar de su
              alargamiento, $\sqrt{2}$. La fuerza es $k$ por lo que se ha
              estirado.
        pista: |
          El muelle tira con $k(2\sqrt{2}-\sqrt{2}) = 10\sqrt{2}$ N a 45
          grados. Su componente horizontal es la $T_0$ del cable.
        desarrollo: |
          $$
          F = k\,(2\sqrt{2}-\sqrt{2}) = 10\sqrt{2}\ \text{N}
          \qquad
          T_0 = F\cos 45^{\circ} = 10\ \text{N}
          $$

          La componente vertical vale también 10 N, y es la carga que aguanta
          el cable por el lado de $B$.

      - tipo: calcular
        titulo: El coeficiente de la parábola
        pregunta: |
          Con los ejes de la figura, la curva es $y = a\,x^{2} + b\,x$. ¿Cuánto
          vale $a$?
        respuesta:
          tipo: numero
          valor: '0.5556'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '1.111'
            mensaje: |
              Te has dejado el 2 del denominador: la curvatura es
              $y'' = p/T_0$, y el coeficiente de $x^{2}$ es la mitad de eso,
              $p/(2T_0)$.
          - valor: '0.2778'
            mensaje: |
              Has dividido una vez de más entre 2. De $y'' = p/T_0$ salen
              $y' = px/T_0 + b$ y $y = px^{2}/(2T_0) + bx$: un solo 2.
        pista: |
          Impón que la curva pase por $B(-3, -2)$ y que su pendiente allí sea
          $-1$, que es la del muelle.
        desarrollo: |
          $$
          9a - 3b = -2
          \qquad
          -6a + b = -1
          $$

          $$
          a = \frac{5}{9} = 0{,}556
          \qquad
          b = \frac{7}{3}
          \qquad
          y = \frac{5}{9}x^{2} + \frac{7}{3}x
          $$

      - tipo: calcular
        titulo: La carga p
        pregunta: |
          ¿Cuánto vale la carga repartida $p$?
        respuesta:
          tipo: magnitud
          valor: '11.11 N/m'
          formato: una carga por unidad de longitud, con su unidad
        distractores:
          - valor: '22.22 N/m'
            mensaje: |
              Arrastras un $T_0$ de 20 N, que sale de usar la longitud del
              muelle en vez de su alargamiento. Con $T_0 = 10$ N,
              $p = 2aT_0 = 100/9$.
          - valor: '15.71 N/m'
            mensaje: |
              Arrastras $T_0 = 10\sqrt{2}$ N, el módulo de la fuerza del
              muelle. La $T_0$ del cable es solo su componente **horizontal**,
              10 N.
        pista: |
          $a = p/(2T_0)$, así que $p = 2aT_0$ con $a = 5/9$ y $T_0 = 10$ N.
        desarrollo: |
          $$
          p = 2aT_0 = 2 \cdot \frac{5}{9} \cdot 10 = \frac{100}{9}
          = 11{,}11\ \text{N/m}
          $$

          Comprobación: la carga total es $p \cdot 3 = 33{,}3$ N, y las
          verticales de los dos amarres son $bT_0 = 23{,}3$ N en $A$ y 10 N en
          $B$, que suman lo mismo.

      - tipo: calcular
        titulo: La flecha máxima
        pregunta: |
          ¿A qué profundidad por debajo de $A$ queda el punto más bajo del
          cable?
        respuesta:
          tipo: magnitud
          valor: '2.45 m'
          formato: una longitud, con su unidad
        distractores:
          - valor: '2 m'
            mensaje: |
              Esa es la profundidad de $B$. El punto más bajo no es $B$: como
              el cable llega a $B$ bajando hacia la izquierda visto desde $A$,
              la curva sigue bajando un poco más a la derecha de $B$.
          - valor: '0.45 m'
            mensaje: |
              Esa es la profundidad del punto más bajo **por debajo de B**. La
              flecha del resultado se mide desde $A$, que es el origen de los
              ejes de la figura.
        pista: |
          El mínimo de $y = ax^{2}+bx$ está en $x = -b/(2a)$. Sustituye ahí.
        desarrollo: |
          $$
          x = -\frac{b}{2a} = -\frac{7/3}{10/9} = -2{,}1\ \text{m}
          \qquad
          y = -2{,}45\ \text{m}
          $$

          El resultado de la colección lo escribe como el punto
          $\min(-2{,}1;\ -2{,}45)$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'B no tiene masa y solo recibe dos fuerzas: la tensión del cable tiene la dirección del muelle y su módulo.'
          - texto: $F = k(2\sqrt{2}-\sqrt{2}) = 10\sqrt{2}$ N, y sus componentes son 10 N en horizontal y 10 N en vertical.
          - texto: 'Con $y = ax^{2}+bx$, el paso por $B(-3,-2)$ y la pendiente $-1$ allí dan $a = 5/9$ y $b = 7/3$.'
          - texto: $p = 2aT_0 = 100/9$ N/m, y el mínimo de la curva cae en $x = -2{,}1$ m con $y = -2{,}45$ m.
          - texto: El punto más bajo del cable es B, porque es el extremo que está más abajo.
            trampa: true
            mensaje: |
              $B$ es el extremo más bajo, pero no el punto más bajo de la
              curva: en $B$ la tangente vale $-1$, no cero. La curva sigue
              bajando hasta $x = -2{,}1$ m, que es donde la pendiente se anula.
    resolucion: |
      **Lo que aporta el muelle.** $B$ es un punto sin masa con dos fuerzas, la
      del muelle y la del cable: son iguales y opuestas. El muelle se ha
      estirado de $\sqrt{2}$ a $2\sqrt{2}$, así que tira con

      $$
      F = k\,(2\sqrt{2}-\sqrt{2}) = 10\sqrt{2}\ \text{N}
      $$

      y, a 45 grados, sus componentes son 10 N en horizontal y 10 N en
      vertical. La horizontal es la $T_0$ del cable; la vertical dice que la
      pendiente del cable en $B$ vale $-1$.

      **La curva.** Con los ejes de la figura, origen en $A$, la parábola es
      $y = ax^{2}+bx$ (pasa por el origen). Imponiendo $y(-3) = -2$ e
      $y'(-3) = -1$:

      $$
      a = \frac{5}{9}
      \qquad
      b = \frac{7}{3}
      \qquad
      y = \frac{5}{9}x^{2} + \frac{7}{3}x
      $$

      **La carga y la flecha.** El coeficiente de $x^{2}$ es $p/(2T_0)$:

      $$
      p = 2aT_0 = \frac{100}{9} = 11{,}11\ \text{N/m}
      \qquad
      x_{\min} = -\frac{b}{2a} = -2{,}1\ \text{m},\quad y_{\min} = -2{,}45\ \text{m}
      $$

      **Comprobación.** La carga total sobre el cable es $11{,}11 \cdot 3 =
      33{,}3$ N, y las componentes verticales de los amarres, $23{,}3$ N en $A$
      y 10 N en $B$, suman exactamente eso.

  - id: ejma5-col56-la-carga-que-crece-con-el-cuadrado
    titulo: Una carga que crece con el cuadrado de la abscisa
    fuente: >-
      Ejercicio 5.6 · Tema 5, «Cables» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección publica el resultado, contra el que está
      contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Un cable ligero está amarrado a dos puntos de una misma horizontal
      separados una distancia $L$. Si la carga por unidad de longitud $L$,
      según la dirección horizontal que soporta el cable varía desde $p_0$ en
      el centro hasta $p_1$ en los extremos ($p = a + bx^{2}$), deducir el
      valor de la flecha $h$ del cable en función de la tensión $T_0$
      correspondiente al punto medio de la luz.

      <figure>
      <svg viewBox="0 0 350 205" role="img" width="350" height="205" aria-labelledby="ejma5-col56-t ejma5-col56-d">
        <title id="ejma5-col56-t">Cable con una carga repartida que crece del centro hacia los extremos</title>
        <desc id="ejma5-col56-d">Cable amarrado en B, a la izquierda, y en A, a la derecha, los dos a la misma altura y separados una distancia L. Los ejes tienen su origen en el punto más bajo, en el centro de la luz. Debajo, una banda representa la carga por unidad de abscisa: vale p0 en el centro y crece hacia los extremos hasta p1, con forma parabólica. La flecha del cable se marca a la derecha como y máxima.</desc>
        <defs>
          <marker id="ejma5-col56-f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M40 80 L28 64 L52 64 z" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.1"/>
        <path d="M24 64 L56 64 M26 64 L20 58 M34 64 L28 58 M42 64 L36 58 M50 64 L44 58" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <path d="M300 80 L288 64 L312 64 z" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.1"/>
        <path d="M284 64 L316 64 M286 64 L280 58 M294 64 L288 58 M302 64 L296 58 M310 64 L304 58" fill="none" stroke="var(--faint)" stroke-width="0.9"/>

        <path d="M40 80 L50.8 88.8 L61.7 96.6 L72.5 103.3 L83.3 109.2 L94.2 114.2 L105 118.4 L115.8 121.8 L126.7 124.6 L137.5 126.7 L148.3 128.2 L159.2 129.1 L170 129.4 L180.8 129.1 L191.7 128.2 L202.5 126.7 L213.3 124.6 L224.2 121.8 L235 118.4 L245.8 114.2 L256.7 109.2 L267.5 103.3 L278.3 96.6 L289.2 88.8 L300 80" fill="none" stroke="var(--d1)" stroke-width="2.2"/>
        <circle cx="40" cy="80" r="3" fill="var(--ink)"/>
        <circle cx="300" cy="80" r="3" fill="var(--ink)"/>
        <text x="32" y="76" font-size="10" text-anchor="end" fill="var(--ink)">B</text>
        <text x="308" y="76" font-size="10" fill="var(--ink)">A</text>

        <line x1="170" y1="129.4" x2="170" y2="64" stroke="var(--ink)" stroke-width="0.9" marker-end="url(#ejma5-col56-f)"/>
        <text x="162" y="68" font-size="10" text-anchor="end" fill="var(--ink)">y</text>
        <line x1="170" y1="129.4" x2="216" y2="129.4" stroke="var(--ink)" stroke-width="0.9" marker-end="url(#ejma5-col56-f)"/>
        <text x="220" y="133" font-size="10" fill="var(--ink)">x</text>

        <path d="M40 160 L300 160 L300 184 L289.2 181.9 L278.3 180 L267.5 178.3 L256.7 176.8 L245.8 175.4 L235 174.3 L224.2 173.3 L213.3 172.4 L202.5 171.8 L191.7 171.4 L180.8 171.1 L170 171 L159.2 171.1 L148.3 171.4 L137.5 171.8 L126.7 172.4 L115.8 173.3 L105 174.3 L94.2 175.4 L83.3 176.8 L72.5 178.3 L61.7 180 L50.8 181.9 L40 184 z" fill="var(--d1)" fill-opacity="0.22" stroke="var(--ink)" stroke-width="1"/>
        <text x="170" y="168" font-size="9.5" text-anchor="middle" fill="var(--ink)">p0</text>
        <text x="292" y="196" font-size="9.5" text-anchor="middle" fill="var(--ink)">p1</text>

        <line x1="300" y1="80" x2="332" y2="80" stroke="var(--faint)" stroke-width="0.7" stroke-dasharray="3 3"/>
        <line x1="170" y1="129.4" x2="332" y2="129.4" stroke="var(--faint)" stroke-width="0.7" stroke-dasharray="3 3"/>
        <line x1="326" y1="80" x2="326" y2="129.4" stroke="var(--faint)" stroke-width="0.8"/>
        <path d="M322 80 L330 80 M322 129.4 L330 129.4" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="320" y="108" font-size="9" text-anchor="end" fill="var(--faint)">ymax</text>
      </svg>
      <figcaption>

      La carga vale **p0** en el centro y **p1** en los extremos, con variación
      cuadrática. Los ejes tienen el origen en el punto más bajo, donde la
      tensión es **T0**.

      </figcaption>
      </figure>
    pide: La flecha h en función de L, T0, p0 y p1.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿De qué grado sale la curva de equilibrio del cable?
        opciones:
          - texto: De grado 4, porque la carga es de grado 2 y hay que integrarla dos veces
            correcta: true
            mensaje: |
              Eso es, y es lo que avisa la nota de la colección. La ecuación
              del cable es $y'' = p(x)/T_0$: si $p$ es cuadrática, $y$ sale de
              grado cuatro.
          - texto: De grado 2, una parábola, como siempre que la carga va por unidad de abscisa
            mensaje: |
              La parábola sale cuando la carga por unidad de abscisa es
              **constante**. Aquí varía con $x^{2}$, así que la curvatura
              cambia de punto a punto y el resultado no es una parábola.
          - texto: De grado 3, porque al integrar una vez la carga ya aparece el cubo
            mensaje: |
              Una sola integración da la pendiente, no la curva. De
              $y'' = (p_0+bx^{2})/T_0$ salen $y'$ de grado 3 e $y$ de grado 4.

      - tipo: calcular
        titulo: El coeficiente de p0
        pregunta: |
          El resultado tiene la forma
          $h = \dfrac{L^{2}}{48T_0}\left(\alpha\,p_0 + p_1\right)$. ¿Cuánto vale
          $\alpha$?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.02
          formato: un número
        distractores:
          - valor: '6'
            mensaje: |
              Sale de tomar $b = 4p_1/L^{2}$, olvidando que la carga en el
              centro ya vale $p_0$. De $p(L/2) = p_1$ se despeja
              $b = 4(p_1-p_0)/L^{2}$, y ese $-p_0$ es justo lo que baja el
              coeficiente de 6 a 5.
          - valor: '3'
            mensaje: |
              Sale de integrar $x^{2}$ dos veces como $x^{4}/4$ en lugar de
              $x^{4}/12$. Cada integración divide por el nuevo exponente:
              $x^{2} \to x^{3}/3 \to x^{4}/12$.
        pista: |
          Con $a = p_0$ y $b = 4(p_1-p_0)/L^{2}$, integra
          $y'' = (p_0 + bx^{2})/T_0$ dos veces desde el punto más bajo y
          evalúa en $x = L/2$.
        desarrollo: |
          $$
          y = \frac{1}{T_0}\left(\frac{p_0x^{2}}{2} + \frac{b\,x^{4}}{12}\right)
          \qquad
          b = \frac{4(p_1-p_0)}{L^{2}}
          $$

          $$
          h = y\!\left(\frac{L}{2}\right)
          = \frac{L^{2}}{T_0}\left(\frac{p_0}{8} + \frac{p_1-p_0}{48}\right)
          = \frac{L^{2}}{48T_0}\,(5p_0 + p_1)
          $$

      - tipo: calcular
        titulo: El caso de carga uniforme, como comprobación
        pregunta: |
          Si $p_1 = p_0$ la carga es uniforme. ¿Cuánto vale entonces
          $h\,T_0/(p_0L^{2})$?
        respuesta:
          tipo: numero
          valor: '0.125'
          tolerancia: 0.002
          formato: un número
        distractores:
          - valor: '0.1458'
            mensaje: |
              Es $7/48$, lo que da la fórmula con $\alpha = 6$. La prueba de
              que ese 6 sobra es justo esta: con carga uniforme tiene que salir
              la parábola de siempre, $1/8$.
          - valor: '0.5'
            mensaje: |
              Has usado la luz entera como $x$ en la parábola. La $x$ se mide
              desde el punto más bajo, que está en el centro: al amarre le
              corresponde $L/2$, y el cuadrado divide por cuatro.
        pista: |
          Con $p_1 = p_0$ la fórmula da $6p_0L^{2}/(48T_0)$, y tiene que
          coincidir con la parábola $y = p_0x^{2}/(2T_0)$ evaluada en $L/2$.
        desarrollo: |
          $$
          h = \frac{L^{2}(5p_0+p_0)}{48T_0} = \frac{p_0L^{2}}{8T_0}
          $$

          que es exactamente la flecha de la parábola con carga uniforme,
          $p_0(L/2)^{2}/(2T_0)$. La fórmula pasa el caso conocido.

      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: 'La carga es $p = p_0 + bx^{2}$ con el origen en el centro, y en el extremo vale $p_1$: $b = 4(p_1-p_0)/L^{2}$.'
          - texto: La ecuación del cable es $y'' = p(x)/T_0$, y hay que integrarla dos veces desde el punto más bajo.
          - texto: Las dos constantes de integración son cero, porque en el punto más bajo se anulan a la vez la altura y la pendiente.
          - texto: Evaluando en $x = L/2$ queda $h = L^{2}(5p_0+p_1)/(48T_0)$, que con $p_1 = p_0$ recupera la parábola.
          - texto: Como la carga máxima es p1, la flecha se calcula con p1 constante en toda la luz.
            trampa: true
            mensaje: |
              Eso daría $p_1L^{2}/(8T_0)$, o sea $6p_1L^{2}/(48T_0)$, y sobreestima
              la flecha: la carga solo vale $p_1$ en los extremos, y en el resto
              de la luz es menor. La integral reparte los pesos como
              $5p_0 + p_1$.
    resolucion: |
      **La carga.** Con el origen en el centro de la luz, $p = a + bx^{2}$ con
      $p(0) = p_0$ y $p(L/2) = p_1$:

      $$
      a = p_0
      \qquad
      b = \frac{4(p_1-p_0)}{L^{2}}
      $$

      **Las dos integraciones.** La ecuación del cable es $y'' = p(x)/T_0$. En
      el punto más bajo $y = 0$ e $y' = 0$, así que las dos constantes se
      anulan:

      $$
      y' = \frac{1}{T_0}\left(p_0x + \frac{bx^{3}}{3}\right)
      \qquad
      y = \frac{1}{T_0}\left(\frac{p_0x^{2}}{2} + \frac{bx^{4}}{12}\right)
      $$

      **La flecha.** En el amarre, $x = L/2$:

      $$
      h = \frac{L^{2}}{T_0}\left(\frac{p_0}{8} + \frac{p_1-p_0}{48}\right)
      = \frac{L^{2}}{48T_0}\left(5p_0 + p_1\right)
      $$

      **Comprobación.** Con $p_1 = p_0$ la carga es uniforme y la fórmula da
      $p_0L^{2}/(8T_0)$, la flecha de la parábola de toda la vida. Y con
      $p_1 > p_0$ sale algo mayor, como tiene que ser: hay más carga cerca de
      los amarres.

  - id: ejma5-col57-la-celosia-tirada-por-un-cable
    titulo: Una celosía tirada por un cable con peso propio
    fuente: >-
      Ejercicio 5.7 · Tema 5, «Cables» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección lo incluye en el bloque que marca como de nivel
      de examen, y publica el resultado, contra el que está contrastado el
      desarrollo.
    nivel: practica
    enunciado: |
      Una estructura reticular $ABCDEF$ formada por triángulos equiláteros de
      lado $L$ y situada en un plano vertical, está articulada en $A$ a la
      pared y en equilibrio. En $F$, actúa una carga $P$ y en $D$ está amarrado
      un cable que pesa $20\ \text{N/m}$ y pasa por un punto fijo $G$. La
      tangente al cable en $D$ es horizontal y la tangente en $G$ forma 30° con
      la horizontal. La longitud $GH$ es de $10\ \text{m}$. Hallar el valor de
      la carga $P$ así como de los esfuerzos en las barras $BD$ y $CD$.

      <figure>
      <svg viewBox="0 0 300 240" role="img" width="300" height="240" aria-labelledby="ejma5-col57-t ejma5-col57-d">
        <title id="ejma5-col57-t">Celosía de triángulos equiláteros con un cable amarrado en D</title>
        <desc id="ejma5-col57-d">Estructura de triángulos equiláteros de lado L articulada a una pared en A, arriba a la izquierda. Los nudos son A y B arriba, C y D en la fila intermedia, y E y F abajo. En F cuelga la carga P. En D se amarra un cable con peso propio que sale horizontal, sube hacia la derecha hasta el punto fijo G, donde su tangente forma 30 grados con la horizontal, y desde G cae vertical 10 metros hasta su extremo libre H.</desc>
        <defs>
          <marker id="ejma5-col57-f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
        </defs>
        <line x1="52" y1="36" x2="52" y2="92" stroke="var(--ink)" stroke-width="1.3"/>
        <path d="M52 40 L44 32 M52 52 L44 44 M52 64 L44 56 M52 76 L44 68 M52 88 L44 80" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
