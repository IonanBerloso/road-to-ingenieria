        <text x="321" y="18" font-size="9" text-anchor="middle" fill="var(--faint)">15 m</text>
        <line x1="152" y1="29" x2="152" y2="167" stroke="var(--faint)" stroke-width="0.7" stroke-dasharray="3 3"/>
        <line x1="204" y1="29" x2="204" y2="164" stroke="var(--faint)" stroke-width="0.7" stroke-dasharray="3 3"/>
        <line x1="282" y1="29" x2="282" y2="108" stroke="var(--faint)" stroke-width="0.7" stroke-dasharray="3 3"/>

        <line x1="48" y1="144" x2="400" y2="144" stroke="var(--faint)" stroke-width="0.8" stroke-dasharray="3 3"/>
        <path d="M48 144 L38 160 L58 160 z" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.1"/>
