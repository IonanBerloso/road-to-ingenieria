      <figcaption>

      El punto marcado es el más bajo del cable, y **no** está en el centro del
      vano: queda a 4,36 m de **A** y a 7,64 m de **B**. La distancia vertical
      **a** se mide desde **A** hasta él.

      </figcaption>
      </figure>
    pide: La fuerza máxima en el cable y la distancia vertical a.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Dónde está el punto más bajo del cable?
        opciones:
          - texto: >-
              En un punto que hay que localizar, más cerca de A que de B,
              porque los dos amarres no están a la misma altura
            correcta: true
            mensaje: |
              Eso es. La parábola se mide desde el punto más bajo, y con los
              amarres a distinta altura ese punto se desplaza hacia el amarre
              bajo. Localizarlo es el primer paso.
          - texto: En el centro del vano, a 6 m de cada amarre
            mensaje: |
              Eso solo pasa cuando los dos amarres están a la misma altura.
              Aquí $B$ está 1,8 m más alto que $A$, y el cable llega a $B$ más
              inclinado que a $A$.
          - texto: En A, porque A es el amarre que está más abajo
            mensaje: |
              Si estuviera en $A$, la distancia vertical $a$ que pide el
              apartado b sería cero y no habría nada que calcular. En $A$ el
              cable todavía baja.

      - tipo: calcular
        titulo: La distancia del punto más bajo a B
        pregunta: |
          ¿A qué distancia horizontal de $B$ está el punto más bajo?
        respuesta:
          tipo: magnitud
          valor: '7.636 m'
          formato: una longitud, con su unidad
        distractores:
          - valor: '4.364 m'
            mensaje: |
              Esa es la distancia al **otro** amarre, a $A$. Las dos suman los
              12 m del vano, y la mayor le toca al amarre alto, que es $B$.
          - valor: '6 m'
            mensaje: |
              Es el centro del vano, que valdría si los dos amarres estuvieran
              a la misma altura. Con 1,8 m de desnivel el punto más bajo se
              corre hacia $A$.
        pista: |
          Con la parábola medida desde el punto más bajo,
          $y_B - y_A = 1{,}8$ m y $\tan 35^{\circ} = q_0x_B/T_0$. Elimina $T_0$
          entre las dos y queda una ecuación en $x_B$.
        desarrollo: |
          $$
          \frac{\tan 35^{\circ}}{2x_B}\left(x_B^{2} - (12-x_B)^{2}\right) = 1{,}8
          \;\Longrightarrow\;
          12 - \frac{72}{x_B} = \frac{1{,}8}{\tan 35^{\circ}}
          $$

          $$
          x_B = 7{,}64\ \text{m}
          \qquad
          x_A = 12 - 7{,}64 = 4{,}36\ \text{m}
          $$

      - tipo: calcular
        titulo: La fuerza máxima
        pregunta: |
          ¿Cuánto vale la fuerza máxima en el cable?
        respuesta:
          tipo: magnitud
          valor: '5991 N'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '4907 N'
            mensaje: |
              Esa es $T_0$, la tensión en el punto más bajo, que es la
              **mínima**. La máxima está en el amarre más inclinado, $B$, y
              vale $T_0/\cos 35^{\circ}$.
          - valor: '8343 N'
            mensaje: |
              Has sumado $T_0$ y la carga del tramo como si fueran paralelas.
              Una es horizontal y la otra vertical: se combinan con Pitágoras.
          - valor: '5286 N'
            mensaje: |
              Esa es la tensión en $A$, el otro amarre. Como $A$ está más cerca
              del punto más bajo, el cable llega ahí menos inclinado y la
              tensión es menor: la máxima es la de $B$.
        pista: |
          $T_0 = q_0x_B/\tan 35^{\circ}$, y en $B$ la tensión es
          $T_0/\cos 35^{\circ}$.
        desarrollo: |
          $$
          T_0 = \frac{450 \cdot 7{,}64}{\tan 35^{\circ}} = 4907\ \text{N}
          \qquad
          T_B = \frac{T_0}{\cos 35^{\circ}} = 5991\ \text{N}
          $$

          Y en el otro amarre, $T_A = \sqrt{T_0^{2} + (q_0x_A)^{2}} = 5286$ N,
          que la colección imprime como 5288 N.

      - tipo: calcular
        titulo: La distancia vertical a
        pregunta: |
          ¿Cuánto vale $a$, la distancia vertical de $A$ al punto más bajo?
        respuesta:
          tipo: magnitud
          valor: '0.873 m'
          formato: una longitud, con su unidad
        distractores:
          - valor: '2.673 m'
            mensaje: |
              Esa es la flecha por el lado de $B$, la distancia vertical del
              punto más bajo a $B$. Las dos se diferencian justo en los 1,8 m
              de desnivel entre los amarres.
          - valor: '1.8 m'
            mensaje: |
              Ese es el desnivel entre los dos amarres, un dato de la figura.
              La distancia $a$ se mide desde $A$ hasta el punto más bajo, que
              está por debajo de $A$.
        pista: |
          $a = q_0x_A^{2}/(2T_0)$, con $x_A = 4{,}36$ m.
        desarrollo: |
          $$
          a = \frac{q_0\,x_A^{2}}{2T_0} = \frac{450 \cdot 4{,}36^{2}}{2 \cdot 4907}
          = 0{,}873\ \text{m}
          $$

          Comprobación: por el lado de $B$, $450 \cdot 7{,}64^{2}/(2 \cdot 4907)
          = 2{,}673$ m, y $2{,}673 - 0{,}873 = 1{,}8$ m, el desnivel.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'La parábola se mide desde el punto más bajo, que aquí no está en el centro: hay que localizarlo.'
          - texto: Con $y_B - y_A = 1{,}8$ m y $\tan 35^{\circ} = q_0x_B/T_0$ sale $x_B = 7{,}64$ m y $x_A = 4{,}36$ m.
          - texto: $T_0 = q_0x_B/\tan 35^{\circ} = 4907$ N, y la máxima es la del amarre alto, $T_B = T_0/\cos 35^{\circ} = 5991$ N.
          - texto: $a = q_0x_A^{2}/(2T_0) = 0{,}873$ m, y la diferencia con la flecha del otro lado son los 1,8 m de desnivel.
          - texto: La fuerza máxima está en el punto más bajo, porque es donde se acumula toda la carga del cable.
            trampa: true
            mensaje: |
              En el punto más bajo la tensión es **mínima**: allí el cable es
              horizontal y su tensión es solo $T_0$. Hacia los amarres se le
              suma en cuadratura la carga acumulada, y la máxima cae en el
              amarre más inclinado.
    resolucion: |
      **Dónde está el punto más bajo.** La parábola $y = q_0x^{2}/(2T_0)$ se
      mide desde el punto más bajo, y con los amarres a distinta altura ese
      punto no está en el centro. Llamando $x_B$ y $x_A$ a las distancias
      horizontales desde él a cada amarre, con $x_A + x_B = 12$ m:

      $$
      y_B - y_A = \frac{q_0}{2T_0}\left(x_B^{2} - x_A^{2}\right) = 1{,}8\ \text{m}
      \qquad
      \tan 35^{\circ} = \frac{q_0\,x_B}{T_0}
      $$

      Eliminando $T_0$ entre las dos:

      $$
      12 - \frac{72}{x_B} = \frac{1{,}8}{\tan 35^{\circ}}
      \;\Longrightarrow\;
      x_B = 7{,}64\ \text{m},\quad x_A = 4{,}36\ \text{m}
      $$

      **Las fuerzas.** La tensión horizontal y la máxima, en el amarre alto:

      $$
      T_0 = \frac{q_0x_B}{\tan 35^{\circ}} = 4907\ \text{N}
      \qquad
      T_B = \frac{T_0}{\cos 35^{\circ}} = 5991\ \text{N}
      $$

      En el otro amarre, $T_A = \sqrt{T_0^{2}+(q_0x_A)^{2}} = 5286$ N.

      **La distancia vertical.**

      $$
      a = \frac{q_0x_A^{2}}{2T_0} = 0{,}873\ \text{m}
      $$

      **Comprobación.** La flecha por el lado de $B$ vale 2,673 m, y su
      diferencia con $a$ son exactamente los 1,8 m de desnivel del enunciado.
  - id: ejma5-col55-el-cable-atado-a-un-muelle
    titulo: Un cable parabólico atado a un muelle inclinado
    fuente: >-
      Ejercicio 5.5 · Tema 5, «Cables» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección publica el resultado, contra el que está
      contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Un muelle de constante elástica $k = 10\ \text{N/m}$ y longitud sin
      tensión $L_0 = \sqrt{2}$ está atado a un punto fijo $C$. Al otro extremo
      $B$ se ata un cable $AB$ sin peso. Se carga este cable con un peso
      vertical, distribuido y constante de valor
      $p\ \text{N/unidad de abscisa}$. Sabiendo que la distancia entre apoyos
      es $L = 5\ \text{m}$, que $A$ y $C$ están a la misma altura y que el
      muelle se inclina 45°, calcular:

      a. Ecuación de la curva del cable.

      b. Flecha máxima.

      c. Valor de la carga $p$.

