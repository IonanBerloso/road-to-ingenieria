        <text x="16" y="207" font-size="10" text-anchor="middle" fill="var(--ink)">A</text>
        <text x="240" y="206" font-size="10" text-anchor="middle" fill="var(--ink)">B</text>
        <text x="356" y="134" font-size="10" text-anchor="end" fill="var(--ink)">C</text>
        <text x="379" y="200" font-size="10" fill="var(--ink)">D</text>

        <line x1="368" y1="140.6" x2="404" y2="140.6" stroke="var(--faint)" stroke-width="0.6" stroke-dasharray="3 3"/>
        <line x1="376" y1="202.6" x2="404" y2="202.6" stroke="var(--faint)" stroke-width="0.6" stroke-dasharray="3 3"/>
        <line x1="252" y1="215" x2="404" y2="215" stroke="var(--faint)" stroke-width="0.6" stroke-dasharray="3 3"/>
        <line x1="398" y1="140.6" x2="398" y2="202.6" stroke="var(--faint)" stroke-width="0.8"/>
        <path d="M394 140.6 L402 140.6 M394 202.6 L402 202.6" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="404" y="174" font-size="9" fill="var(--faint)">L</text>
        <line x1="398" y1="202.6" x2="398" y2="215" stroke="var(--faint)" stroke-width="0.8"/>
        <path d="M394 215 L402 215" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="406" y="214" font-size="9" fill="var(--faint)">h</text>
