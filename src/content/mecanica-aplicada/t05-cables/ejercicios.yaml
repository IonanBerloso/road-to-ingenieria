        <text x="398" y="95" font-size="9" fill="var(--faint)">20 m</text>
        <line x1="392" y1="144" x2="392" y2="170" stroke="var(--faint)" stroke-width="0.8"/>
        <path d="M388 170 L396 170" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="398" y="163" font-size="9" fill="var(--faint)">5 m</text>
      </svg>
      <figcaption>

      El cable, dibujado a escala con las cotas ya resueltas. La cota conocida
      es la de **C**, 5 m por debajo de **A**; **E** está 20 m por encima de
      **A**. Las elevaciones de **B** y **D** son lo que se pide.

      </figcaption>
      </figure>
    pide: Las elevaciones de B y D, y la pendiente y la tensión máximas.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué dos ecuaciones dan las dos incógnitas del cable, la componente
          horizontal $H$ y la reacción vertical en $A$?
        opciones:
          - texto: >-
              Momentos en E del cable entero, y momentos en C del trozo AC, que
              es donde el enunciado da la cota
            correcta: true
            mensaje: |
              Eso es. El cable entero da una relación entre $H$ y $A_y$, y el
              trozo $AC$ la otra, porque de $C$ se conoce la cota. Sin ese dato
              extra la forma no está determinada.
          - texto: Las dos ecuaciones de fuerzas, horizontal y vertical, del cable entero
            mensaje: |
              La horizontal solo dice que las dos reacciones horizontales son
              iguales, y la vertical, que las verticales suman 22 kN. Ninguna
              de las dos contiene la cota de $C$, que es lo que fija la forma.
          - texto: Basta con momentos en E del cable entero, porque las cargas ya fijan la forma
            mensaje: |
              Las cargas no fijan la forma: el mismo cable con las mismas
              cargas cuelga más tenso o más flojo. Hace falta **un dato de
              geometría**, y aquí es la cota de $C$.

      - tipo: calcular
        titulo: La componente horizontal
        pregunta: |
          ¿Cuánto vale la componente horizontal $H$ de la tensión?
        respuesta:
          tipo: magnitud
          valor: '18 kN'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '54 kN'
            mensaje: |
              Has medido los 5 m desde la cuerda $AE$ y no desde $A$. El
              enunciado dice «por debajo del apoyo izquierdo»: la cota de $C$
              se mide desde $A$, no desde la recta que une los dos amarres.
          - valor: '6 kN'
            mensaje: |
              En la ecuación del cable entero falta el momento de los 12 kN de
              $C$, que con brazo 30 m es el término más grande de los tres.
        pista: |
          Momentos en $E$ del cable entero: $60A_y + 20H = 40\cdot 6 + 30\cdot
          12 + 15\cdot 4$. Momentos en $C$ del trozo $AC$: $30A_y = 5H +
          10\cdot 6$.
        desarrollo: |
          $$
          3A_y + H = 33
          \qquad
          6A_y - H = 12
          $$

          Sumando las dos, $9A_y = 45$, o sea $A_y = 5\ \text{kN}$ y
          $H = 18\ \text{kN}$.

      - tipo: calcular
        titulo: La elevación de B
        pregunta: |
          ¿Cuánto está $B$ por debajo de $A$?
        respuesta:
          tipo: magnitud
          valor: '5.556 m'
          formato: una longitud, con su unidad
        distractores:
          - valor: '5.83 m'
            mensaje: |
              Esa es la elevación de $D$, y además es el valor que la colección
              imprime con el rótulo $y_C$. La de $B$ sale de los momentos en
              $B$ del trozo $AB$, donde solo interviene la reacción en $A$.
          - valor: '5 m'
            mensaje: |
              Esa es la cota de $C$, el dato del enunciado. $B$ está más abajo
              que $C$: entre los dos el cable sube, porque en $B$ cuelgan 6 kN
              que lo obligan a formar un vértice.
        pista: |
          Momentos en $B$ del trozo $AB$: la única fuerza aparte de la tensión
          en $B$ es la reacción en $A$, de componentes 18 kN y 5 kN.
        desarrollo: |
          $$
          20A_y = H\,y_B
          \;\Longrightarrow\;
          y_B = \frac{20 \cdot 5}{18} = 5{,}56\ \text{m}
          $$

          por debajo de $A$. Con el mismo método en $D$, tomando momentos del
          trozo $AD$, sale $y_D = 105/18 = 5{,}83$ m **por encima** de $A$.

      - tipo: calcular
        titulo: La pendiente máxima
        pregunta: |
          ¿Cuántos grados forma con la horizontal el tramo más inclinado?
        respuesta:
          tipo: numero
          valor: '43.36'
          tolerancia: 0.1
          formato: en grados
        distractores:
          - valor: '46.64'
            mensaje: |
              Es el ángulo complementario: has tomado el que forma el tramo con
              la **vertical**. La pendiente se mide desde la horizontal, y su
              tangente es $14{,}17/15$.
          - valor: '15.52'
            mensaje: |
              Es el ángulo del tramo $AB$, que baja 5,56 m en 20 m. El tramo
              más inclinado es $DE$, el último: sube 14,17 m en 15 m.
        pista: |
          El tramo más inclinado es el que va de $D$ a $E$: sube de $+5{,}83$ m
          a $+20$ m mientras avanza 15 m.
        desarrollo: |
          $$
          \tan\theta = \frac{20 - 5{,}83}{15} = 0{,}9444
          \;\Longrightarrow\;
          \theta = 43{,}36^{\circ}
          $$

      - tipo: calcular
        titulo: La tensión máxima
        pregunta: |
          ¿Cuánto vale la tensión en ese tramo?
        respuesta:
          tipo: magnitud
          valor: '24.76 kN'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '35 kN'
            mensaje: |
              Has sumado la componente horizontal y la vertical como si fueran
              paralelas. Son perpendiculares: se combinan con Pitágoras,
              $\sqrt{18^{2}+17^{2}}$.
          - valor: '18 kN'
            mensaje: |
              Esa es solo la componente horizontal, que es la misma en todo el
              cable. En $E$ el cable está inclinado 43,4 grados, así que la
              tensión total es mayor.
        pista: |
          La componente horizontal vale 18 kN en todos los puntos, y la
          vertical en $E$ es $18\tan\theta$.
        desarrollo: |
          $$
          T_{\max} = \frac{H}{\cos\theta} = \sqrt{18^{2} + 17^{2}}
          = 24{,}76\ \text{kN}
          $$

          La colección imprime 24,761 kN.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Momentos en E del cable entero y en C del trozo AC: dos ecuaciones para H y para la reacción vertical en A.'
          - texto: Resolviendo, $A_y = 5$ kN y $H = 18$ kN.
          - texto: Momentos en $B$ del trozo $AB$ dan $y_B = 5{,}56$ m por debajo de $A$; en $D$, $y_D = 5{,}83$ m por encima.
          - texto: El tramo más inclinado es $DE$, con $\tan\theta = 0{,}944$, y ahí $T_{\max} = 18/\cos\theta = 24{,}76$ kN.
          - texto: La tensión máxima está en C, porque es el punto más bajo y aguanta toda la carga.
            trampa: true
            mensaje: |
              Al revés: en el punto más bajo la tensión es **mínima**, porque
              ahí el cable es casi horizontal y no tiene componente vertical.
              La máxima está siempre en el amarre más inclinado, aquí $E$.
    resolucion: |
      **Las dos ecuaciones.** El cable tiene dos incógnitas de equilibrio, la
      componente horizontal $H$ y la reacción vertical $A_y$. Momentos en $E$
      del cable entero y momentos en $C$ del trozo $AC$, que es donde se conoce
      la cota:

      $$
      3A_y + H = 33
      \qquad
      6A_y - H = 12
      \;\Longrightarrow\;
      A_y = 5\ \text{kN},\quad H = 18\ \text{kN}
      $$

      **Las elevaciones.** Tomando momentos en cada punto con el trozo que
      queda a su izquierda:

      $$
      y_B = \frac{20 \cdot 5}{18} = 5{,}56\ \text{m}\ \text{bajo } A
      \qquad
      y_D = \frac{-45 \cdot 5 + 25 \cdot 6 + 15 \cdot 12}{18} = 5{,}83\ \text{m}\ \text{sobre } A
      $$

      **La pendiente y la tensión máximas.** Comparando los cuatro tramos, el
      más inclinado es $DE$:

      $$
      \tan\theta = \frac{14{,}17}{15} = 0{,}944
      \qquad
      \theta = 43{,}36^{\circ}
      \qquad
      T_{\max} = \sqrt{18^{2}+17^{2}} = 24{,}76\ \text{kN}
      $$

      **Comprobación.** La vertical en $E$ es $18 \cdot 0{,}944 = 17$ kN, y
      $5 + 17 = 22$ kN, que es justo la suma de las tres cargas.

  - id: ejma5-col53-las-dos-cargas-repartidas
    titulo: Un cable sin peso con dos cargas repartidas distintas
    fuente: >-
      Ejercicio 5.3 · Tema 5, «Cables» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección publica el resultado, contra el que está
      contrastado el desarrollo.
    nivel: practica
    enunciado: |
      La figura representa un cable sin peso sometido a dos cargas
      distribuidas. La carga $p$ es conocida de valor $p\ (\text{N/m})$ y la
      distancia entre los apoyos $A$ y $B$ es $L$. Sabiendo que $C$ es el punto
      más bajo y su tensión igual a la carga total soportada, calcular:

      a. Valor de $q$.

      b. Tensión en $C$.

      c. Flecha del cable (en $C$).

      d. Ecuaciones de los tramos $AC$ y $CB$, expresadas en los ejes dados.

      <figure>
      <svg viewBox="0 0 400 238" role="img" width="400" height="238" aria-labelledby="ejma5-col53-t ejma5-col53-d">
        <title id="ejma5-col53-t">Cable con dos cargas repartidas de distinta intensidad</title>
        <desc id="ejma5-col53-d">Cable amarrado en A y en B, a la misma altura y separados una distancia L. Una carga repartida p actúa sobre los dos tercios izquierdos de la luz y otra carga repartida q, cuatro veces mayor, sobre el tercio derecho. El punto más bajo C está en la frontera de las dos cargas, a dos tercios de L desde A, y la flecha dibujada es L partido por nueve.</desc>
        <path d="M60 70 L48 52 L72 52 z" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.1"/>
        <path d="M44 52 L76 52 M46 52 L40 46 M54 52 L48 46 M62 52 L56 46 M70 52 L64 46" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <path d="M330 70 L318 52 L342 52 z" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.1"/>
        <path d="M314 52 L346 52 M316 52 L310 46 M324 52 L318 46 M332 52 L326 46 M340 52 L334 46" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <line x1="60" y1="70" x2="330" y2="70" stroke="var(--faint)" stroke-width="0.8" stroke-dasharray="3 3"/>

        <path d="M60 70 L75 74.8 L90 79.2 L105 83.1 L120 86.7 L135 89.8 L150 92.5 L165 94.8 L180 96.7 L195 98.1 L210 99.2 L225 99.8 L240 100" fill="none" stroke="var(--d1)" stroke-width="2.2"/>
        <path d="M240 100 L251.2 99.5 L262.5 98.1 L273.8 95.8 L285 92.5 L296.3 88.3 L307.5 83.1 L318.8 77 L330 70" fill="none" stroke="var(--d2)" stroke-width="2.2"/>
        <circle cx="60" cy="70" r="3" fill="var(--ink)"/>
        <circle cx="240" cy="100" r="3" fill="var(--ink)"/>
        <circle cx="330" cy="70" r="3" fill="var(--ink)"/>
        <text x="52" y="66" font-size="10" text-anchor="end" fill="var(--ink)">A</text>
        <text x="338" y="66" font-size="10" fill="var(--ink)">B</text>
        <text x="240" y="115" font-size="10" text-anchor="middle" fill="var(--ink)">C</text>

        <rect x="60" y="130" width="180" height="14" fill="var(--d1)" fill-opacity="0.25" stroke="var(--ink)" stroke-width="1"/>
        <rect x="240" y="130" width="90" height="56" fill="var(--d2)" fill-opacity="0.25" stroke="var(--ink)" stroke-width="1"/>
        <text x="52" y="142" font-size="10" text-anchor="end" fill="var(--d1)">p</text>
        <text x="338" y="162" font-size="10" fill="var(--d2-tinta)">q</text>

        <line x1="60" y1="200" x2="240" y2="200" stroke="var(--faint)" stroke-width="0.8"/>
        <path d="M60 196 L60 204 M240 196 L240 204" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="150" y="194" font-size="9" text-anchor="middle" fill="var(--faint)">2L/3</text>
        <line x1="60" y1="222" x2="330" y2="222" stroke="var(--faint)" stroke-width="0.8"/>
        <path d="M60 218 L60 226 M330 218 L330 226" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="195" y="234" font-size="9" text-anchor="middle" fill="var(--faint)">L</text>
      </svg>
      <figcaption>

      Los dos tramos son parábolas con la misma tensión horizontal. La carga
      **q** del tercio derecho es cuatro veces **p**, que es justo lo que hace
      que **C**, la frontera entre las dos, sea el punto más bajo.

      </figcaption>
      </figure>
    pide: El valor de q, la tensión en C, la flecha y las ecuaciones de los dos tramos.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué condición traduce que $C$ sea el punto más bajo del cable?
        opciones:
          - texto: >-
              Que el cable es horizontal en C, así que los dos tramos son
              parábolas medidas desde C y las dos suben la misma flecha hasta
              A y hasta B
            correcta: true
            mensaje: |
              Eso es. En $C$ la tangente es horizontal, así que cada tramo es
              $y = q_i x^{2}/(2T_0)$ con la $x$ medida desde $C$. Como $A$ y
              $B$ están a la misma altura, las dos flechas coinciden, y eso da
              $q$.
          - texto: Que las dos cargas repartidas son iguales, porque si no el cable se descolgaría hacia un lado
            mensaje: |
              Justo lo contrario. El tramo corto necesita **más** carga para
              bajar lo mismo que el largo en menos distancia: la flecha crece
              con el cuadrado de la longitud, y por eso $q = 4p$.
          - texto: Que la carga total a la izquierda de C es igual a la carga total a la derecha
            mensaje: |
              Eso daría $q = 2p$, y con esa carga el punto más bajo no caería
              en $C$. Lo que tiene que coincidir es la **flecha** de los dos
              tramos, no su carga.

      - tipo: calcular
        titulo: El valor de q
        pregunta: |
          El resultado tiene la forma $q = k\,p$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.02
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              Sale de igualar las cargas totales de los dos lados,
              $p\,(2L/3) = q\,(L/3)$. Lo que hay que igualar son las flechas, y
              la flecha va con el **cuadrado** de la distancia.
          - valor: '1'
            mensaje: |
              Con $q = p$ la carga sería uniforme en toda la luz y el punto más
              bajo caería en el centro, a $L/2$ de $A$, no en $C$, que está a
              $2L/3$.
        pista: |
          Con el origen en $C$, la flecha del tramo izquierdo es
          $p(2L/3)^{2}/(2T_0)$ y la del derecho, $q(L/3)^{2}/(2T_0)$. Iguala.
        desarrollo: |
          $$
          \frac{p\,(2L/3)^{2}}{2T_0} = \frac{q\,(L/3)^{2}}{2T_0}
          \;\Longrightarrow\;
          q = p\,\frac{(2L/3)^{2}}{(L/3)^{2}} = 4p
          $$

      - tipo: calcular
        titulo: La tensión en C
        pregunta: |
          El enunciado dice que la tensión en $C$ es igual a la carga total
          soportada. Con la forma $T_C = k\,pL$, ¿cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.02
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              Es la carga total si $q$ fuera igual a $p$: $p\,(2L/3) +
              p\,(L/3) = pL$. Con $q = 4p$ el tercio derecho aporta $4pL/3$, no
              $pL/3$.
          - valor: '1.333'
            mensaje: |
              Es la carga total con $q = 2p$, el valor que sale de igualar
              cargas en vez de flechas: $2pL/3 + 2pL/3$.
        pista: |
          La carga total es $p\,(2L/3) + q\,(L/3)$, con $q = 4p$.
        desarrollo: |
          $$
          T_C = p\,\frac{2L}{3} + 4p\,\frac{L}{3} = \frac{2pL + 4pL}{3} = 2pL
          $$

      - tipo: calcular
        titulo: La flecha
        pregunta: |
          Con la forma $h = k\,L$, ¿cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '0.1111'
          tolerancia: 0.002
          formato: un número
        distractores:
          - valor: '0.2222'
            mensaje: |
              Te has dejado el 2 del denominador de la parábola. La ecuación es
              $y = q_0x^{2}/(2T_0)$, y ese 2 sale de integrar dos veces.
          - valor: '0.1667'
            mensaje: |
              Es lo que sale arrastrando $q = 2p$, que da $T_C = 4pL/3$. Con la
              condición correcta, $q = 4p$ y $T_C = 2pL$.
        pista: |
          $h = p(2L/3)^{2}/(2T_C)$, con $T_C = 2pL$.
        desarrollo: |
          $$
          h = \frac{p\,(2L/3)^{2}}{2 \cdot 2pL} = \frac{4pL^{2}/9}{4pL}
          = \frac{L}{9}
          $$

      - tipo: calcular
        titulo: El tramo AC
        pregunta: |
          En los ejes del resultado, con el origen en $A$ y el eje $y$ hacia
          arriba, el tramo $AC$ es $y_{AC} = k\,x^{2}/L - x/3$. ¿Cuánto vale
          $k$?
        respuesta:
          tipo: numero
          valor: '0.25'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '0.5'
            mensaje: |
              Ese es el valor de $y''$, la curvatura $p/T_0 = 1/(2L)$. Al
              integrar dos veces aparece un $x^{2}/2$ más, así que el
              coeficiente de $x^{2}$ es la mitad.
          - valor: '1'
            mensaje: |
              Ese es el coeficiente del tramo $CB$, donde la carga es $q = 4p$
              y la curvatura, cuatro veces mayor. El tramo $AC$ es el de la
              carga pequeña.
        pista: |
          $y'' = p/T_C = 1/(2L)$, e integrando dos veces el coeficiente de
          $x^{2}$ es la mitad de eso.
        desarrollo: |
          $$
          y'' = \frac{p}{T_C} = \frac{1}{2L}
          \;\Longrightarrow\;
          y_{AC} = \frac{x^{2}}{4L} - \frac{x}{3}
          $$

          La constante $-x/3$ sale de imponer que la tangente sea horizontal en
          $x = 2L/3$. Se comprueba: $y_{AC}(0) = 0$ en $A$ y
          $y_{AC}(2L/3) = -L/9$ en $C$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'C es el punto más bajo: los dos tramos son parábolas desde C con la misma tensión horizontal.'
          - texto: Igualando las dos flechas, $p(2L/3)^{2} = q(L/3)^{2}$, sale $q = 4p$.
          - texto: La carga total es $2pL/3 + 4pL/3 = 2pL$, que es la tensión en $C$ que da el enunciado.
          - texto: $h = p(2L/3)^{2}/(2 \cdot 2pL) = L/9$, y las ecuaciones salen de integrar $y'' = q_i/T_0$ en cada tramo.
          - texto: Como la carga q es mayor, la tensión horizontal del tramo CB es mayor que la del tramo AC.
            trampa: true
            mensaje: |
              La componente horizontal es la misma en todo el cable, valga lo
              que valga la carga de cada tramo: es la propia definición de
              $T_0$. Lo que cambia con la carga es la **curvatura**, y por eso
              el tramo derecho se dobla cuatro veces más deprisa.
    resolucion: |
      **La condición del punto más bajo.** En $C$ la tangente es horizontal, así
      que cada tramo es una parábola medida desde $C$ con la misma tensión
      horizontal $T_0$. Como $A$ y $B$ están a la misma altura, las dos flechas
      son iguales:

      $$
      \frac{p\,(2L/3)^{2}}{2T_0} = \frac{q\,(L/3)^{2}}{2T_0}
      \;\Longrightarrow\;
      q = 4p
      $$

      **La tensión y la flecha.** El enunciado dice que $T_C$ es la carga total:

      $$
      T_C = p\,\frac{2L}{3} + 4p\,\frac{L}{3} = 2pL
      \qquad
      h = \frac{p\,(2L/3)^{2}}{2T_C} = \frac{L}{9}
      $$

      **Las ecuaciones.** Con el origen en $A$, el eje $x$ hacia $B$ y el eje
      $y$ hacia arriba, se integra $y'' = q_i/T_C$ en cada tramo y se imponen
      la tangente horizontal en $C$ y el paso por los amarres:

      $$
      y_{AC} = \frac{x^{2}}{4L} - \frac{x}{3}
      \qquad
      y_{CB} = \frac{x^{2}}{L} - \frac{4x}{3} + \frac{L}{3}
      $$

      **Comprobación.** Las dos valen $-L/9$ en $x = 2L/3$ y tienen ahí
      pendiente nula; $y_{AC}(0) = 0$ e $y_{CB}(L) = 0$, o sea que los dos
      amarres quedan a la misma altura.

  - id: ejma5-col54-la-parabola-con-amarres-a-distinta-altura
    titulo: Una parábola con los amarres a distinta altura
    fuente: >-
      Ejercicio 5.4 · Tema 5, «Cables» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección publica el resultado, contra el que está
      contrastado el desarrollo.
    nivel: practica
    enunciado: |
      El cable $AB$ soporta una carga distribuida por unidad de abscisa
      $q_0 = 450\ \text{N/m}$ si $\theta_B = 35^{\circ}$, determinar:

      a. La fuerza máxima en el cable.

      b. La distancia vertical a desde $A$ hasta el punto más bajo del cable.

      <figure>
      <svg viewBox="0 0 440 210" role="img" width="440" height="210" aria-labelledby="ejma5-col54-t ejma5-col54-d">
        <title id="ejma5-col54-t">Cable parabólico de 12 metros de luz con los amarres a distinta altura</title>
        <desc id="ejma5-col54-d">Cable amarrado en A, a la izquierda, y en B, 12 metros a la derecha y 1,8 metros más alto. Soporta una carga repartida por unidad de abscisa dibujada como una banda con colgantes bajo todo el vano. La curva está dibujada a escala con su ecuación: el punto más bajo queda a 4,36 metros de A y a 7,64 metros de B, y en B la tangente forma 35 grados con la horizontal.</desc>
