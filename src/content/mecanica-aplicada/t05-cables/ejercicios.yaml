        <circle cx="268.1" cy="197.5" r="2.2" fill="var(--ink)"/>
        <circle cx="150" cy="165" r="3.4" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/>
        <circle cx="235.6" cy="197.5" r="3" fill="var(--ink)"/>

        <path d="M303.8 184.5 A38 38 0 0 0 232.4 184.5" fill="none" stroke="var(--d2)" stroke-width="1.5" marker-end="url(#ejma5-col59-f)"/>
        <text x="268" y="150" font-size="10" text-anchor="middle" fill="var(--d2-tinta)">P</text>

        <text x="14" y="96" font-size="10" text-anchor="end" fill="var(--ink)">A</text>
        <text x="156" y="96" font-size="10" fill="var(--ink)">B</text>
        <text x="142" y="169" font-size="10" text-anchor="end" fill="var(--ink)">C</text>
        <text x="142" y="226" font-size="10" text-anchor="end" fill="var(--ink)">D</text>
        <text x="228" y="94" font-size="10" text-anchor="end" fill="var(--ink)">E</text>
        <text x="228" y="196" font-size="10" text-anchor="end" fill="var(--ink)">F</text>
        <text x="268" y="245" font-size="10" text-anchor="middle" fill="var(--ink)">G</text>

