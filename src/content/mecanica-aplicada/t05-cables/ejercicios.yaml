        <desc id="ejma5-col513-d">Un disco de radio R apoyado en el suelo, a la derecha. De su punto izquierdo C, a la altura del centro O, sale hacia la izquierda una barra horizontal BC de longitud dos R. Del extremo B sube un cable corto con peso propio hasta A, amarrado al techo. A está por encima y ligeramente a la derecha de B, a una altura de raíz de cinco menos raíz de dos, dividido entre dos, por R. El cable está dibujado con su ecuación: su pendiente en B es de 45 grados, o sea que B no es el punto más bajo.</desc>
