        <text x="52" y="126" font-size="10" text-anchor="end" fill="var(--ink)">B</text>
        <text x="124" y="88" font-size="10" text-anchor="end" fill="var(--ink)">C</text>
        <text x="300" y="92" font-size="10" fill="var(--ink)">D</text>
        <text x="207" y="272" font-size="10" fill="var(--ink)">A</text>

        <line x1="36" y1="95" x2="36" y2="120" stroke="var(--faint)" stroke-width="0.8"/>
        <path d="M32 95 L40 95 M32 120 L40 120" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="36" y1="95" x2="124" y2="95" stroke="var(--faint)" stroke-width="0.6" stroke-dasharray="3 3"/>
        <line x1="36" y1="120" x2="60" y2="120" stroke="var(--faint)" stroke-width="0.6" stroke-dasharray="3 3"/>
        <text x="30" y="112" font-size="9" text-anchor="end" fill="var(--faint)">L/8</text>
      </svg>
      <figcaption>

      La tangente en **B** es horizontal, así que **B** es el punto más bajo
      del tramo **BC**. Al otro lado de la polea, el tramo **CD** cuelga entre
      dos puntos a la misma altura y tiene su propio parámetro.

      </figcaption>
      </figure>
    pide: El rozamiento en A, la tensión en B, las longitudes BC y BCD, la tensión en D y la fuerza sobre la polea.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Se puede escribir directamente $F_r = f\,N$ en el apoyo $A$?
        opciones:
          - texto: >-
              No, porque el enunciado no dice que el deslizamiento sea
              inminente: el rozamiento sale del equilibrio, y luego se comprueba
              que no pasa de fN
            correcta: true
            mensaje: |
              Eso es, y la nota de la colección lo avisa expresamente: el
              sistema está en equilibrio, pero el deslizamiento no es
              inminente. Aquí sale $F_r = Mg/2$ y el máximo disponible es
              $2Mg/3$, así que hay margen.
          - texto: Sí, siempre que haya rozamiento la fuerza vale f por la normal
            mensaje: |
              $f\,N$ es el **máximo** que puede dar el contacto, no lo que da
              siempre. Mientras no haya deslizamiento inminente, el rozamiento
              vale lo que haga falta para equilibrar, y es menor.
          - texto: Sí, porque un sistema en equilibrio con rozamiento está siempre en equilibrio estricto
            mensaje: |
              Equilibrio estricto es un caso particular, el del límite. En este
              problema no lo es: con $F_r = 2Mg/3$ las ecuaciones de la barra
              no se cumplirían.

      - tipo: calcular
        titulo: La tensión en B
        pregunta: |
          ¿Cuánto vale $T_B$ en unidades de $Mg$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.005
          formato: un número, T_B dividido por Mg
        distractores:
          - valor: '0.667'
            mensaje: |
              Sale de suponer deslizamiento inminente y escribir
              $F_r = \frac{2}{3}N$. El enunciado no lo dice, y la nota de la
              colección avisa justo de lo contrario.
          - valor: '1'
            mensaje: |
              Has puesto el peso de la barra con brazo entero en vez de con el
              brazo de su centro. El peso actúa en el punto medio, así que su
              momento respecto de $A$ es la mitad.
        pista: |
          Momentos en $A$ de la barra: el peso, en el punto medio, y la tensión
          en $B$, horizontal, a la altura de $B$.
        desarrollo: |
          $$
          T_B\,\frac{L}{\sqrt{2}} = Mg\,\frac{L}{2\sqrt{2}}
          \;\Longrightarrow\;
          T_B = \frac{Mg}{2}
          $$

          Y el equilibrio horizontal de la barra da $F_r = T_B = Mg/2$, con
          $N = Mg$: hace falta $f = 0{,}5$ y hay $2/3$, así que se sostiene.

      - tipo: calcular
        titulo: La longitud del tramo BC
        pregunta: |
          ¿Cuánto vale $s_{BC}$ en unidades de $L$?
        respuesta:
          tipo: numero
          valor: '0.375'
          tolerancia: 0.005
          formato: un número, s_BC dividido por L
        distractores:
          - valor: '0.625'
            mensaje: |
              Ese es $y_C/L$, la altura de $C$ sobre la directriz. La longitud
              del arco es el otro cateto: $s^{2} = y^{2}-c^{2}$.
          - valor: '0.125'
            mensaje: |
              Ese es el desnivel $L/8$ entre $B$ y $C$. El cable no va recto: su
              longitud es mayor que la subida.
        pista: |
          $c = T_B/q = L/2$, y $C$ está $L/8$ por encima de $B$, que es el
          punto más bajo. Usa $y^{2} = c^{2}+s^{2}$.
        desarrollo: |
          $$
          c = \frac{L}{2}
          \qquad
          y_C = c + \frac{L}{8} = \frac{5L}{8}
          $$

          $$
          s_{BC} = \sqrt{\left(\frac{5L}{8}\right)^{2}-\left(\frac{L}{2}\right)^{2}}
          = \frac{3L}{8}
          $$

      - tipo: calcular
        titulo: La componente vertical en D
        pregunta: |
          ¿Cuánto vale la componente vertical de la tensión en $D$, en unidades
          de $Mg$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.005
          formato: un número, la componente vertical dividida por Mg
        distractores:
          - valor: '0.667'
            mensaje: |
              Sale de suponer que la polea conserva la componente **horizontal**
              y no el módulo. Lo que pasa igual de un lado al otro es
              $\left|T\right| = 5Mg/8$; con el ángulo de $D$, su vertical es
              $\frac{4}{5}$ de eso.
          - valor: '0.375'
            mensaje: |
              Esa es la componente **horizontal** en $D$, $\frac{3}{5}$ del
              módulo. La vertical lleva el 4/5, porque la tangente del ángulo
              es 4/3.
        pista: |
          En la polea se conserva el módulo: $T_D = T_C = q\,y_C = 5Mg/8$. Con
          $\tan\varphi = 4/3$, las componentes van como 3 y 4 sobre 5.
        desarrollo: |
          $$
          T_D = T_C = q\,y_C = \frac{5Mg}{8}
          $$

          $$
          \vec{T}_D = \frac{Mg}{8}\left(3\hat{i}+4\hat{j}\right)
          \;\Longrightarrow\;
          T_{Dy} = \frac{Mg}{2}
          $$

      - tipo: calcular
        titulo: La longitud del cable entero
        pregunta: |
          ¿Cuánto vale $s_{BCD}$ en unidades de $L$?
        respuesta:
          tipo: numero
          valor: '1.375'
          tolerancia: 0.005
          formato: un número, s_BCD dividido por L
        distractores:
          - valor: '0.375'
            mensaje: |
              Ese es solo el tramo $BC$. Falta el tramo $CD$, que cuelga entre
              dos puntos a la misma altura y mide $L$.
          - valor: '1'
            mensaje: |
              Ese es solo el tramo $CD$. El cable entero incluye también el
              tramo $BC$, de $3L/8$.
        pista: |
          $CD$ cuelga entre dos puntos a la misma altura, así que su punto más
          bajo está en el medio y cada mitad mide $T_{Dy}/q$.
        desarrollo: |
          $$
          c' = \frac{T_{Dx}}{q} = \frac{3L}{8}
          \qquad
          s_{CD} = 2\,\frac{T_{Dy}}{q} = 2\cdot\frac{L}{2} = L
          $$

          $$
          s_{BCD} = \frac{3L}{8} + L = \frac{11L}{8} = 1{,}375\,L
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Momentos en A de la barra dan T = Mg/2, y el equilibrio horizontal, un rozamiento de Mg/2 con N = Mg.'
          - texto: 'B es el punto más bajo: $c = T_B/q = L/2$, $y_C = 5L/8$ y $s_{BC} = 3L/8$.'
          - texto: 'La polea conserva el módulo: $T_D = q\,y_C = 5Mg/8$, y con $\tan\varphi = 4/3$ queda $\vec{T}_D = \frac{Mg}{8}(3\hat{i}+4\hat{j})$.'
          - texto: El tramo $CD$ cuelga entre dos puntos a la misma altura y mide $L$, así que $s_{BCD} = 11L/8$.
          - texto: Como hay rozamiento y el sistema está en equilibrio, la fuerza en A vale f por la normal, o sea 2Mg/3.
            trampa: true
            mensaje: |
              La nota de la colección avisa de que el deslizamiento **no** es
              inminente. El rozamiento vale lo que pide el equilibrio, $Mg/2$,
              y queda por debajo del máximo disponible, $2Mg/3$: si valiera
              $2Mg/3$ la barra no estaría equilibrada.
    resolucion: |
      **La barra.** Tomando momentos en $A$, con el peso en el punto medio y la
      tensión horizontal en $B$:

      $$
      T_B\,\frac{L}{\sqrt{2}} = Mg\,\frac{L}{2\sqrt{2}}
      \;\Longrightarrow\;
      T_B = \frac{Mg}{2}
      \qquad
      F_r = \frac{Mg}{2}
      \qquad
      N = Mg
      $$

      El coeficiente necesario es 0,5 y el disponible, $2/3$: el sistema se
      sostiene sin deslizamiento inminente, que es lo que avisa la nota de la
      colección.

      **El tramo BC.** En $B$ la tangente es horizontal, así que es el punto
      más bajo:

      $$
      c = \frac{T_B}{q} = \frac{L}{2}
      \qquad
      y_C = c+\frac{L}{8} = \frac{5L}{8}
      \qquad
      s_{BC} = \frac{3L}{8}
      $$

      **La polea y el tramo CD.** En una polea lisa se conserva el módulo:

      $$
      T_D = T_C = q\,y_C = \frac{5Mg}{8}
      \qquad
      \vec{T}_D = \frac{Mg}{8}\left(3\hat{i}+4\hat{j}\right)
      $$

      El tramo $CD$ une dos puntos a la misma altura, así que su punto más bajo
      está en el medio, su parámetro es $c' = T_{Dx}/q = 3L/8$ y su longitud,
      $s_{CD} = 2T_{Dy}/q = L$. En total, $s_{BCD} = 11L/8$.

      **La fuerza sobre la polea.** El cable tira de $C$ hacia $B$ con
      $\frac{Mg}{8}(-4,-3)$ y hacia $D$ con $\frac{Mg}{8}(3,-4)$, así que la
      polea responde con

      $$
      \vec{C} = \frac{Mg}{8}\left(\hat{i}+7\hat{j}\right)
      $$

      **Comprobación.** Los dos tiros tienen el mismo módulo, $5Mg/8$, como
      exige una polea sin rozamiento.
  - id: ejma5-col513-el-cable-que-no-sale-horizontal
    titulo: Un cable que no sale horizontal, con barra y disco
    fuente: >-
      Ejercicio 5.13 · Tema 5, «Cables» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección lo incluye en el bloque que marca como de nivel
      de examen, y publica el resultado, contra el que está contrastado el
      desarrollo.
    nivel: practica
    enunciado: |
      El sistema plano de la figura consta de un cable $AB$ de peso por unidad
      de longitud $q = Mg/R$, una barra $BC$ de masa $M$ y longitud $2R$ y un
      disco de masa $M$ y radio $R$. La barra tiene el extremo $B$ unido al
      cable y el $C$ está articulado al disco. Sabiendo que el sistema está en
      reposo en la posición indicada ($BC$ horizontal y $C$ a la misma altura
      que $O$), calcular:

      a. Diagramas de sólido libre en cable, barra y disco.

      b. Coeficiente de rozamiento mínimo para que se de rodadura entre suelo y
      disco.

      c. Parámetro de catenaria $c$.

      d. Longitud del cable $AB$.

      <figure>
      <svg viewBox="0 0 470 268" role="img" width="470" height="268" aria-labelledby="ejma5-col513-t ejma5-col513-d">
