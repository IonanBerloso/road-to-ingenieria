        <rect x="352" y="196" width="21" height="15" fill="var(--faint)" fill-opacity="0.35" stroke="var(--ink)" stroke-width="1.1"/>
        <text x="362" y="232" font-size="9.5" text-anchor="middle" fill="var(--ink)">2M</text>

        <circle cx="240" cy="215" r="3" fill="var(--ink)"/>
