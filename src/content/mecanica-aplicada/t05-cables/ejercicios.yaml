      </svg>
      <figcaption>

      El cable llega a **B** con pendiente 45 grados, no horizontal: el punto
      más bajo de su catenaria queda fuera del tramo dibujado, a la izquierda
      de **B**. Por eso la longitud **AB** es la diferencia de dos arcos.

      </figcaption>
      </figure>
    pide: El coeficiente de rozamiento mínimo, el parámetro de catenaria y la longitud del cable AB.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Puede el cable salir horizontal de $B$?
        opciones:
          - texto: >-
              No, porque en B el cable tiene que sostener media barra: su
              tensión tiene componente vertical, y el punto más bajo queda
              fuera del tramo, a la izquierda de B
            correcta: true
            mensaje: |
              Eso es, y es lo que avisa la nota de la colección. La barra
              cuelga de $B$ y se apoya en $C$: en $B$ hace falta $Mg/2$ hacia
              arriba, así que la tangente allí no es horizontal.
          - texto: Sí, porque B es el extremo inferior del cable y ahí la tensión siempre es mínima
            mensaje: |
              El extremo inferior de un tramo de cable no tiene por qué ser el
              punto más bajo de su catenaria. Lo es solo si allí la tangente es
              horizontal, y aquí no puede serlo: el cable sostiene media barra.
          - texto: Da igual, porque el parámetro c no depende de la pendiente en B
            mensaje: |
              $c = T_0/q$ depende de la componente **horizontal**, y esa sí es
              la misma en todo el cable; pero la longitud del arco sí depende
              de dónde esté el punto más bajo, y ahí es donde cambia todo.

      - tipo: calcular
        titulo: El coeficiente de rozamiento mínimo
        pregunta: |
          ¿Cuál es el coeficiente de rozamiento mínimo entre el disco y el
          suelo?
        respuesta:
          tipo: numero
          valor: '0.3333'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '0.5'
            mensaje: |
              Has puesto $N = Mg$, solo el peso del disco. La barra descarga en
              $C$ la mitad de su peso, así que el disco aprieta el suelo con
              $3Mg/2$.
          - valor: '0.25'
            mensaje: |
              Has puesto $N = 2Mg$, sumándole al disco el peso entero de la
              barra. La barra se reparte entre sus dos extremos: la mitad va al
              cable y la otra mitad, al disco.
        pista: |
          Momentos en el centro del disco: la fuerza que la barra le hace en
          $C$ está a un radio, y el rozamiento en el contacto también. Luego
          $N$ sale del equilibrio vertical del disco.
        desarrollo: |
          La barra apoya en $C$ con $Mg/2$ hacia abajo. En el disco, momentos
          en $O$:

          $$
          F_r\,R = \frac{Mg}{2}\,R
          \;\Longrightarrow\;
          F_r = \frac{Mg}{2}
          \qquad
          N = Mg + \frac{Mg}{2} = \frac{3Mg}{2}
          $$

          $$
          f_{\min} = \frac{Mg/2}{3Mg/2} = \frac{1}{3}
          $$

      - tipo: calcular
        titulo: El parámetro de catenaria
        pregunta: |
          ¿Cuánto vale $c$ en unidades de $R$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.005
          formato: un número, c dividido por R
        distractores:
          - valor: '0.707'
            mensaje: |
              Has dividido entre $q$ el **módulo** de la tensión en $B$,
              $Mg/\sqrt{2}$. El parámetro se calcula con la componente
              horizontal, $T_0 = Mg/2$.
          - valor: '1'
            mensaje: |
              Has usado $Mg$ como tensión horizontal. La barra pesa $Mg$, pero
              en $B$ el cable solo carga con la mitad, y además esa mitad es la
              componente **vertical**.
        pista: |
          El equilibrio horizontal de la barra dice que la tensión del cable en
          $B$ tiene la misma horizontal que la fuerza del disco en $C$, y de
          los momentos sale que ambas valen $Mg/2$.
        desarrollo: |
          Momentos en $B$ de la barra dan la vertical del disco en $C$,
          $Mg/2$, y de los momentos del disco sale que su componente horizontal
          también es $Mg/2$. Por el equilibrio de la barra, la tensión en $B$
          es $(Mg/2,\ Mg/2)$:

          $$
          c = \frac{T_0}{q} = \frac{Mg/2}{Mg/R} = \frac{R}{2}
          $$

      - tipo: calcular
        titulo: La longitud del cable AB
        pregunta: |
          ¿Cuánto vale $s_{AB}$ en unidades de $R$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.005
          formato: un número, s_AB dividido por R
        distractores:
          - valor: '1'
            mensaje: |
              Ese es el arco medido desde el punto más bajo hasta $A$. Como el
              punto más bajo no es $B$, hay que restarle el arco que va del
              punto más bajo hasta $B$, que vale $R/2$.
          - valor: '0.411'
            mensaje: |
              Ese es el desnivel entre $B$ y $A$, el dato de la figura. El
              cable es más largo que su subida, y además aquí hay que
              combinarlo con la geometría de la catenaria.
        pista: |
          Con $T_{By} = Mg/2$, el arco desde el punto más bajo hasta $B$ vale
          $s_B = T_{By}/q = R/2$. Súmale el desnivel a $y_B$ para tener $y_A$ y
          usa $y^{2} = c^{2}+s^{2}$ otra vez.
        desarrollo: |
          $$
          s_B = \frac{R}{2}
          \qquad
          y_B = \sqrt{c^{2}+s_B^{2}} = \frac{R}{\sqrt{2}}
          $$

          $$
          y_A = y_B + \frac{\sqrt{5}-\sqrt{2}}{2}R = \frac{\sqrt{5}}{2}R
          \qquad
          s_A = \sqrt{y_A^{2}-c^{2}} = R
          $$

          $$
          s_{AB} = s_A - s_B = R - \frac{R}{2} = \frac{R}{2}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'La barra se reparte entre sus extremos: el cable sostiene Mg/2 en B y el disco recibe Mg/2 en C.'
          - texto: Momentos en el centro del disco dan $F_r = Mg/2$, y con $N = 3Mg/2$ sale $f_{\min} = 1/3$.
          - texto: La tensión en $B$ es $(Mg/2,\ Mg/2)$, así que $c = T_0/q = R/2$ y el arco hasta $B$ vale $s_B = R/2$.
          - texto: Con $y_A = \sqrt{5}R/2$ sale $s_A = R$, y la longitud del cable es la diferencia, $s_{AB} = R/2$.
          - texto: En B el cable es horizontal, así que su tensión ahí es T0 y el arco AB se mide directamente desde B.
            trampa: true
            mensaje: |
              Si en $B$ fuera horizontal, el cable no podría sostener media
              barra. La pendiente en $B$ vale 1, o sea 45 grados, y el punto
              más bajo queda a la izquierda de $B$, fuera del tramo: por eso la
              longitud es una **diferencia** de arcos.
    resolucion: |
      **La barra.** $BC$ es horizontal, de masa $M$ y longitud $2R$, unida al
      cable en $B$ y articulada al disco en $C$. Momentos en $B$:

      $$
      2R\,C_y = Mg\,R
      \;\Longrightarrow\;
      C_y = \frac{Mg}{2}
      $$

      así que el disco recibe $Mg/2$ hacia abajo en $C$ y el cable sostiene la
      otra mitad en $B$.

      **El disco.** Momentos en su centro, con la fuerza en $C$ a un radio y el
      rozamiento en el contacto a otro:

      $$
      F_r = \frac{Mg}{2}
      \qquad
      N = \frac{3Mg}{2}
      \qquad
      f_{\min} = \frac{1}{3}
      $$

      El equilibrio horizontal de la barra dice que la tensión del cable en $B$
      tiene componente horizontal $Mg/2$, así que

      $$
      c = \frac{T_0}{q} = \frac{R}{2}
      $$

      **El cable.** La componente vertical en $B$ es $Mg/2$, luego el arco
      desde el punto más bajo hasta $B$ mide $s_B = T_{By}/q = R/2$ y

      $$
      y_B = \sqrt{c^{2}+s_B^{2}} = \frac{R}{\sqrt{2}}
      \qquad
      y_A = y_B + \frac{\sqrt{5}-\sqrt{2}}{2}R = \frac{\sqrt{5}}{2}R
      $$

      $$
      s_A = \sqrt{y_A^{2}-c^{2}} = R
      \qquad
      s_{AB} = s_A - s_B = \frac{R}{2}
      $$

      **Comprobación.** La pendiente en $B$ es $s_B/c = 1$, o sea 45 grados, y
      en $A$, $s_A/c = 2$: el cable se empina hacia arriba, como se ve en la
      figura.

  - id: ejma5-col514-la-celosia-el-cable-y-la-deslizadera
    titulo: Una celosía, un cable por una polea y una deslizadera
    fuente: >-
      Ejercicio 5.14 · Tema 5, «Cables» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección lo incluye en el bloque que marca como de nivel
      de examen, y publica el resultado, contra el que está contrastado el
      desarrollo.
    nivel: practica
    enunciado: |
      El sistema mecánico de la figura consta de 1) una estructura formada por
      barras biarticuladas que en $C$ está articulada en un punto fijo y en $D$
      tiene un apoyo simple sobre el plano horizontal sin rozamiento; 2) un
      cable de peso por unidad de longitud conocido $q\ [\text{N/m}]$ que se
      articula en $A$ a la estructura, pasa por una polea de dimensiones
      despreciables en $F$, y se articula en $G$ a una deslizadera que se mueve
      sin rozamiento por un mástil fijo $OZ$. Las dimensiones necesarias se
      indican en la figura, y se conoce además que la tensión en $A$ sobre el
      cable es horizontal, y que la reacción vertical en $D$ es
      $2qL\ [\text{N}]$. Calcular:

      a. Parámetros de la catenaria.

      b. Longitud del cable $s_{AFG}$.

      c. Fuerza de enlace en la polea $F$.

      d. Fuerzas en las barras $CE$ y $CD$.

      <figure>
