      - **El peso**, $m\,g$, vertical. La masa no se da: las tensiones salen
        en múltiplos de $m\,g$.
      - **La tensión**, a lo largo de la cuerda, hacia el centro de giro: O
        justo antes, y A justo después, que está en la misma recta. Es
        perpendicular a la velocidad, y no trabaja.
      - **Sin rozamiento**, no hay nada más.

      **2. Incógnitas.** La tensión justo antes y justo después de tocar el
      clavo, y la velocidad con la cuerda vertical, $v_3$.

      **3. Ecuaciones.** Solo trabaja el peso, y en cualquier posición
      $v^{2} = 2\,g\,h$, con h lo que ha bajado la partícula desde la salida:

