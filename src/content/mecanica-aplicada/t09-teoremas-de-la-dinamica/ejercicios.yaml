        <text x="100" y="113" font-size="10" text-anchor="middle" fill="var(--ink)" font-style="italic">a<tspan font-size="7.5" dy="2.5">n</tspan></text>
        <circle cx="140" cy="100" r="2.4" fill="var(--ink)"/>
        <text x="152" y="92" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">C</text>
      </svg>
      <figcaption>

      Las dos tensiones son la misma T: el anillo desliza sin rozamiento por el alambre. La aceleración, en tinta fina, no es una fuerza: es la normal de la circunferencia que describe C, v²/R hacia el eje. Peso con g = 9,81 m/s².

      </figcaption>
      </figure>

      - **El peso**, $m\,g = 5 \cdot 9{,}81 = 49{,}05$ N, vertical.
      - **Las dos tensiones**, iguales, porque el anillo desliza sin
        rozamiento por el alambre: la del tramo AC, a 30° del eje, y la del
        BC, a 45°. Los dos anclajes están sobre el eje, por encima de C: las
        dos tiran hacia arriba y hacia el eje.
      - **La aceleración.** C recorre una circunferencia horizontal de radio
        $R = 1{,}6$ m con v constante: solo tiene la normal, $v^{2}/R$,
        horizontal y hacia el eje.

      **2. Incógnitas.** La tensión T y la velocidad v.

      **3. Ecuaciones.** La segunda ley, en vertical, donde no hay
      aceleración, y en horizontal, hacia el eje:

      $$
      T\cos 30^{\circ} + T\cos 45^{\circ} - m\,g = 0,
      \qquad
      T\operatorname{sen}30^{\circ} + T\operatorname{sen}45^{\circ} = \frac{m\,v^{2}}{R}
      $$

      **4. Resultados.**

      $$
      T = \frac{5 \cdot 9{,}81}{0{,}8660 + 0{,}7071} = 31{,}18\ \text{N}
      $$

      $$
      v = \sqrt{\frac{R\,T\,(\operatorname{sen}30^{\circ} + \operatorname{sen}45^{\circ})}{m}}
      = \sqrt{\frac{1{,}6 \cdot 31{,}18 \cdot 1{,}2071}{5}} = 3{,}470\ \text{m/s}
      $$

      **La esferita gira a 3,47 m/s, con 31,18 N en el hilo.** Coincide con
      el resultado publicado, $v = 3{,}47\ \text{m}\cdot\text{s}^{-1}$.

      **5. Comprobación.** Por la geometría de las dos tensiones, sin
      descomponerlas. Dos vectores iguales suman sobre su bisectriz: la
      resultante de las dos tensiones va a $(30^{\circ} + 45^{\circ})/2 = 37{,}5^{\circ}$
      del eje y vale $2\,T\cos 7{,}5^{\circ}$, con 7,5° la mitad de los 15°
      que forman entre sí.
      La esferita es entonces un péndulo cónico de un solo hilo a 37,5°:

      $$
      v = \sqrt{g\,R\tan 37{,}5^{\circ}} = \sqrt{9{,}81 \cdot 1{,}6 \cdot 0{,}7673} = 3{,}470\ \text{m/s}
      $$

      $$
      2\,T\cos 7{,}5^{\circ}\cos 37{,}5^{\circ} = m\,g
      \;\Longrightarrow\;
      T = \frac{49{,}05}{2 \cdot 0{,}9914 \cdot 0{,}7934} = 31{,}18\ \text{N}
      $$

      Lo mismo.

      **Lo que dice el resultado.** Los dos tramos juntos equivalen a un solo
      hilo por la bisectriz, a 37,5° del eje: por eso v queda entre la de un
      péndulo cónico a 30°, 3,01 m/s, y la de uno a 45°, 3,96 m/s. Y aunque
      la tensión es la misma en los dos tramos, no sostienen lo mismo: el de
      30°, más vertical, sostiene 27,00 N del peso, y el de 45°, 22,05 N.

  - id: ejma9-col92-tres-particulas-y-sus-magnitudes
    titulo: Las magnitudes de un sistema de tres partículas
    fuente: >-
      Ejercicio 9.2 · Tema 9, «Magnitudes y teoremas fundamentales de la
      dinámica» · Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección
      publica los seis resultados y el curso publica su resolución; contra los
      dos está contrastado este desarrollo. Las coordenadas de las tres
      partículas se leen de la figura, y son las únicas que reproducen a la vez
      los seis valores publicados.
    nivel: practica
    antes:
      idea: |
        Las magnitudes de un sistema de partículas son sumas, partícula a
        partícula, de las de cada una: su masa por su posición, por su
        velocidad, el momento de su cantidad de movimiento respecto de un
        punto, su energía cinética y su energía potencial.
      formula: |
        Con $M = \sum m_i$, $\vec{r}_i$ la posición de cada partícula desde O
        y la energía potencial nula a la altura $y = 0$:

        $$
        \overrightarrow{OG} = \frac{\sum m_i\,\vec{r}_i}{M},
        \qquad
        \vec{L} = \sum m_i\,\vec{v}_i,
        \qquad
        \vec{H}_O = \sum \vec{r}_i\times m_i\,\vec{v}_i
        $$

        $$
        T = \sum \tfrac12\,m_i\,v_i^{2},
        \qquad
        V_g = \sum m_i\,g\,y_i
        $$

        El momento cinético respecto de G, $\vec{H}_G$, es la misma suma con
        las posiciones medidas desde G.
      reconocer: |
        Antes de calcular se leen de la figura las posiciones de las tres
        partículas.
    enunciado: |
      Las masas y velocidades de las partículas $A$, $B$ y $C$ de la figura son
      las siguientes:

      $$
      \vec{v}_A = 3\vec{i} - 2\vec{j} + 4\vec{k} \qquad m_A = 1\ \text{kg}
      $$

      $$
      \vec{v}_B = 4\vec{i} + 3\vec{j} \qquad m_B = 2\ \text{kg}
      $$

      $$
      \vec{v}_C = 2\vec{i} + 5\vec{j} - 3\vec{k} \qquad m_C = 3\ \text{kg}
      $$

      Calcular:

      a) El vector de posición del centro de gravedad

      b) El momento lineal del sistema

      c) El momento angular del sistema respecto el punto $O$

      d) El momentu angular del sistema respecto del centro de gravedad

      e) La energía cinética del sistema

      f) La energía potencial gravitatoria, considerando que el potencial es
      nulo a altura $y = 0$.

