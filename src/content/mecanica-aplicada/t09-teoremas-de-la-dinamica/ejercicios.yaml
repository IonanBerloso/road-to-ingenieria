        <path d="M166 30 V90 M162 30 H170 M162 90 H170" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="170" y="63" font-size="9" text-anchor="start" fill="var(--faint)">0,4 m</text>
        <path d="M204 30 V120 M200 30 H208 M200 120 H208" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="208" y="78" font-size="9" text-anchor="start" fill="var(--faint)">0,6 m</text>
        <circle cx="30" cy="30" r="2.4" fill="var(--ink)"/>
        <text x="24" y="26" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">O</text>
        <circle cx="82" cy="60" r="2.4" fill="var(--ink)"/>
        <text x="88" y="58" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">A</text>
      </svg>
      <figcaption>

      A trazos, el recorrido: radio 0,8 m alrededor de O hasta tocar el clavo, y 0,4 m alrededor de A hasta la vertical. Las cotas, lo que baja desde la salida.

      </figcaption>
      </figure>

      Con $R = 0{,}8$ m y el clavo a 0,4 m de O, sobre una recta a 30° por
      debajo de la horizontal: al tocar el clavo la partícula ha bajado
      $R\operatorname{sen}30^{\circ} = 0{,}4$ m; el clavo está
      $0{,}5\,R\operatorname{sen}30^{\circ} = 0{,}2$ m por debajo de O, y
      colgando de él la partícula queda $0{,}2 + 0{,}4 = 0{,}6$ m por debajo
      de la salida.

      A lo largo de la cuerda, hacia el centro de giro, con $\rho = R$ antes
      del clavo y $\rho = R/2$ después; el peso proyecta
      $m\,g\operatorname{sen}30^{\circ}$ hacia fuera:

      $$
      T - m\,g\operatorname{sen}30^{\circ} = \frac{m\,v^{2}}{\rho}
      $$

      **4. Resultados.** a) Justo antes, con
      $v_1^{2} = 2\,g\,R\operatorname{sen}30^{\circ} = g\,R$ y $\rho = R$:

      $$
      T = m\,g\operatorname{sen}30^{\circ} + \frac{m\,g\,R}{R}
      = m\,g\,(0{,}5 + 1) = 1{,}5\,m\,g
      $$

      b) Justo después. El clavo no cambia la velocidad: la fuerza que hace en
      ese instante es perpendicular a ella. Solo el radio pasa a R/2:

      $$
      T = m\,g\operatorname{sen}30^{\circ} + \frac{m\,g\,R}{R/2}
      = m\,g\,(0{,}5 + 2) = 2{,}5\,m\,g
      $$

      c) Con la cuerda vertical, $h = 0{,}6$ m:

      $$
      v_3 = \sqrt{2 \cdot 9{,}81 \cdot 0{,}6} = \sqrt{11{,}772} = 3{,}431\ \text{m/s}
      $$

      **Los tres coinciden con lo publicado:** $1{,}5\,m\,g$, $2{,}5\,m\,g$ y
      $3{,}43\ \text{m}\cdot\text{s}^{-1}$.

      **5. Comprobación.** Por el teorema del momento cinético, sin la
      energía. Alrededor de O, con $\varphi$ el ángulo de la cuerda por debajo
      de la horizontal, $H_O = m\,R^{2}\dot{\varphi}$; la tensión pasa por O y
      no da momento, y el del peso es $m\,g\,R\cos\varphi$:

      $$
      m\,R^{2}\ddot{\varphi} = m\,g\,R\cos\varphi
      \;\Longrightarrow\;
      \tfrac12\,\dot{\varphi}^{2} = \frac{g}{R}\operatorname{sen}\varphi
      $$

      Con $v = R\dot{\varphi}$, a 30°:
      $v_1^{2} = 2 \cdot 9{,}81 \cdot 0{,}8 \cdot 0{,}5 = 7{,}848$. Alrededor de
      A, lo mismo con radio 0,4 m y el ángulo de AB por debajo de la
      horizontal, de 30° a 90°:

      $$
      v_3^{2} = v_1^{2} + 2\,g \cdot 0{,}4\,(\operatorname{sen}90^{\circ} - \operatorname{sen}30^{\circ})
      $$

      $$
      v_3^{2} = 7{,}848 + 2 \cdot 9{,}81 \cdot 0{,}4 \cdot 0{,}5 = 11{,}772
      $$

      $v_3 = 3{,}431$ m/s; y como $v_1^{2} = 7{,}848$ es $g\,R$, las dos
      tensiones salen como antes. Lo mismo.

      **Lo que dice el resultado.** La tensión salta de $1{,}5\,m\,g$ a
      $2{,}5\,m\,g$ sin que cambie la velocidad: el clavo, al partir el radio
      por la mitad, dobla el término centrípeto, de $m\,g$ a $2\,m\,g$. Y
      sigue subiendo: con la cuerda vertical,
      $T = m\,g + m\,v_3^{2}/0{,}4 = 4\,m\,g$, una $m\,g$ más que en un
      péndulo de 0,8 m sin clavo soltado desde la horizontal, que en el punto
      más bajo pide $3\,m\,g$.

  - id: ejma9-col910-los-dos-bloques-y-la-fuerza-f
    titulo: Dos bloques apilados en un plano inclinado con rozamiento
    fuente: >-
      Ejercicio 9.10 · Tema 9, «Magnitudes y teoremas fundamentales de la
      dinámica» · Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección
      publica los tres resultados y el curso publica su resolución; contra los
      dos está contrastado este desarrollo.
    nivel: practica
    antes:
      idea: |
        Cada bloque se aísla y se le aplica la segunda ley, a lo largo del
        plano y perpendicular a él. En cada cara de contacto actúan una normal
        y un rozamiento, iguales y contrarios sobre los dos cuerpos que se
        tocan.
      formula: |
        La segunda ley, y el rozamiento seco cuando una cara desliza sobre
        otra, contra el deslizamiento:

        $$
        \sum\vec{F} = m\,\vec{a},
        \qquad
        R = \mu\,N
        $$

        Desde el reposo y con aceleración constante, $x = \tfrac12\,a\,t^{2}$.
      reconocer: |
        Antes de calcular se aísla cada bloque y se mira con qué está en
        contacto.
    enunciado: |
      En el instante $t = 0$ los bloques $A$ y $B$ están en reposo. Calcular:

      a. Las aceleraciones de $A$ y $B$ en cualquier instante.

      b. Distancia recorrida por el bloque $A$ sobre el bloque $B$, después de
      que el bloque $A$ haya recorrido 0,2 m sobre el plano inclinado.

      Datos: $m_A = 20\ \text{kg}$, $m_B = 30\ \text{kg}$, $F = 500\ \text{N}$,
      $\mu_{A-B} = 0{,}4$, $\mu_{B-plano} = 0{,}1$.

      <figure>
      <svg viewBox="0 0 340 190" role="img" width="340" height="190" aria-labelledby="ejma9-col910-t ejma9-col910-d">
        <title id="ejma9-col910-t">Los bloques A y B apilados sobre el plano inclinado 10 grados, con la fuerza F sobre A</title>
        <desc id="ejma9-col910-d">Un plano inclinado 10 grados que sube hacia la derecha. Sobre él descansa el bloque B, y encima de B, más a la derecha, el bloque A. Una flecha marcada F empuja al bloque A paralelamente al plano y hacia abajo de la pendiente. Dibujo a escala.</desc>
