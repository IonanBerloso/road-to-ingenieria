      $$
      N_A = m_A g\cos\beta,
      \qquad
      N_B = m_B g\operatorname{sen}\beta
      $$

      A lo largo de cada cara, con A subiendo y B bajando:

      $$
      T - \mu_k N_A - m_A g\operatorname{sen}\beta = m_A a_A
      $$

      $$
      m_B g\cos\beta - \mu_k N_B - 2T = m_B a_B
      $$

      **4. Resultados.** Primero, si arranca. Con los bloques quietos manda
      $\mu_s = 0{,}25$, y A aguanta como mucho

      $$
      T = \mu_s m_A g\cos\beta + m_A g\operatorname{sen}\beta = 230{,}46 + 335{,}52 = 565{,}98\ \text{N}
      $$

      mientras que B, para quedarse quieto, pediría

      $$
      2T = m_B g\cos\beta - \mu_s m_B g\operatorname{sen}\beta = 1382{,}76 - 125{,}82 = 1256{,}94\ \text{N}
      $$

      es decir, $T = 628{,}47$ N. Pide más de lo que A aguanta: el sistema
      arranca, y desde ahí el rozamiento es el dinámico, $\mu_k = 0{,}20$.

      Con $N_A = 921{,}84$ N y $N_B = 503{,}28$ N, y $a_A = 2a_B$, se
      multiplica por 2 la ecuación de A y se suma a la de B, con lo que la
      tensión se va:

      $$
      a_B = \frac{m_B g\left(\cos\beta - \mu_k\operatorname{sen}\beta\right) - 2m_A g\left(\operatorname{sen}\beta + \mu_k\cos\beta\right)}{4m_A + m_B}
      $$

      $$
      a_B = \frac{1382{,}76 - 100{,}66 - 2\,(335{,}52 + 184{,}37)}{550} = \frac{242{,}32}{550} = 0{,}4406\ \text{m/s}^{2}
      $$

      Con ella, $a_A = 0{,}8812$ m/s², y de la ecuación de A:

      $$
      T = m_A a_A + m_A g\left(\mu_k\cos\beta + \operatorname{sen}\beta\right) = 88{,}12 + 519{,}89 = 608{,}0\ \text{N}
      $$

      **B baja por su cara a 0,4406 m/s², A sube por la suya a 0,8812 m/s², y
      la soga tira con 608,0 N.** La colección publica $T = 608{,}0$ N y
      $a_B = 0{,}4405$ m/s², cortando las cifras de 0,44058.

      **5. Comprobación.** Por energía, sin la tensión: en una soga ideal, lo
      que trabaja T sobre A lo pierde sobre B. Mientras B baja 1 m por su
      cara, A sube 2 m por la suya, y el trabajo de las demás fuerzas es

      $$
      W = (1382{,}76 - 100{,}66) \cdot 1 - (335{,}52 + 184{,}37) \cdot 2 = 242{,}32\ \text{J}
      $$

      Desde el reposo, con $v_B^{2} = 2a_B \cdot 1$ y $v_A = 2v_B$, la energía
      cinética es $\tfrac12(m_B + 4m_A)\,v_B^{2} = 550\,a_B$; igualándola al
      trabajo, $a_B = 242{,}32/550 = 0{,}4406$ m/s². Y la tensión, desde B en
      vez de desde A:

      $$
      2T = 1382{,}76 - 100{,}66 - 150 \cdot 0{,}44058 = 1216{,}01\ \text{N}
      $$

      con $T = 608{,}0$ N. Lo mismo.

      **Lo que dice el resultado.** La polea móvil da a B el doble de fuerza,
      2T, pero le obliga a arrastrar a A el doble de lejos: por eso en el
      denominador están $4m_A + m_B = 550$ kg y no los 250 kg de los dos
      bloques, y A cuenta cuatro veces. De los 1382,76 N que tiran de B a lo
      largo de su cara, el peso de A a lo largo de la suya se lleva
      $2 \cdot 335{,}52 = 671{,}04$ N, y los rozamientos,
      $100{,}66 + 2 \cdot 184{,}37 = 469{,}40$ N: quedan 242,32 N para
      acelerar. Con la soga atada directamente a B, sin la polea móvil, el
      conjunto aceleraría 3,049 m/s², casi siete veces más.

      Y B, en la cara empinada, apenas aprieta: su normal, 503,28 N, es poco
      más de la mitad que la de A, 921,84 N, con más masa.
