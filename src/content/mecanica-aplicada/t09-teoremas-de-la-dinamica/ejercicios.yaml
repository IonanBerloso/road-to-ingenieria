      <figcaption>

      Las coordenadas, en metros, leídas de la figura del enunciado. G cae más cerca de C, la partícula más pesada.

      </figcaption>
      </figure>

      - **A** $= (0;\ 3;\ 1)$, de 1 kg; **B** $= (3;\ 0;\ 2{,}5)$, de 2 kg; y
        **C** $= (4;\ 2;\ 1)$, de 3 kg. En metros.
      - **La masa total**, $M = 6$ kg.

      **2. Incógnitas.** $\overrightarrow{OG}$, $\vec{L}$, $\vec{H}_O$,
      $\vec{H}_G$, T y $V_g$.

      **3. Ecuaciones.** Las definiciones, y el cambio de punto del momento
      cinético, porque $\vec{H}$ es un campo de momentos con resultante
      $\vec{L}$:

      $$
      \overrightarrow{OG} = \frac{\sum m_i\,\vec{r}_i}{M},
      \qquad
      \vec{L} = \sum m_i\,\vec{v}_i,
      \qquad
      \vec{H}_O = \sum \vec{r}_i\times m_i\,\vec{v}_i
      $$

      $$
      \vec{H}_G = \vec{H}_O - \overrightarrow{OG}\times\vec{L},
      \qquad
      T = \sum \tfrac12\,m_i\,v_i^{2},
      \qquad
      V_g = g\sum m_i\,y_i
      $$

      **4. Resultados.** a) El centro de gravedad:

      $$
      \overrightarrow{OG} = \frac{1\,(0;\ 3;\ 1) + 2\,(3;\ 0;\ 2{,}5) + 3\,(4;\ 2;\ 1)}{6}
      = 3\,\vec{i} + 1{,}5\,\vec{j} + 1{,}5\,\vec{k}\ \ \text{m}
      $$

      b) El momento lineal:

      $$
      \vec{L} = 1\,(3;\ -2;\ 4) + 2\,(4;\ 3;\ 0) + 3\,(2;\ 5;\ -3)
      = 17\,\vec{i} + 19\,\vec{j} - 5\,\vec{k}\ \ \text{kg}\cdot\text{m/s}
      $$

      c) El momento cinético en O, con un sumando por partícula:

      $$
      \vec{H}_O = (14;\ 3;\ -9) + (-15;\ 20;\ 18) + (-33;\ 42;\ 48)
      = -34\,\vec{i} + 65\,\vec{j} + 57\,\vec{k}\ \ \text{kg}\cdot\text{m}^{2}/\text{s}
      $$

      d) El momento cinético en G, con
      $\overrightarrow{OG}\times\vec{L} = (-36;\ 40{,}5;\ 31{,}5)$:

      $$
      \vec{H}_G = (-34;\ 65;\ 57) - (-36;\ 40{,}5;\ 31{,}5)
      = 2\,\vec{i} + 24{,}5\,\vec{j} + 25{,}5\,\vec{k}\ \ \text{kg}\cdot\text{m}^{2}/\text{s}
      $$

      e) La energía cinética, con $v_A^{2} = 29$, $v_B^{2} = 25$ y
      $v_C^{2} = 38$:

      $$
      T = \tfrac12\,(1 \cdot 29 + 2 \cdot 25 + 3 \cdot 38) = 96{,}5\ \text{J}
      $$

      f) La energía potencial:

      $$
      V_g = 9{,}81\,(1 \cdot 3 + 2 \cdot 0 + 3 \cdot 2) = 88{,}29\ \text{J}
      $$

      **Los seis coinciden con los que publica la colección.**

      **5. Comprobación.** $\vec{H}_G$ directamente, sin el cambio de punto,
      con las posiciones desde G: $(-3;\ 1{,}5;\ -0{,}5)$, $(0;\ -1{,}5;\ 1)$
      y $(1;\ 0{,}5;\ -0{,}5)$. Los tres productos por $m_i\,\vec{v}_i$:

      $$
      \vec{H}_G = (5;\ 10{,}5;\ 1{,}5) + (-6;\ 8;\ 12) + (3;\ 6;\ 12) = (2;\ 24{,}5;\ 25{,}5)
      $$

      La energía cinética, por el teorema de König: la de G, con
      $\vec{v}_G = \vec{L}/M$, más la del movimiento respecto de G. Con las
      velocidades relativas multiplicadas por 6, $(1;\ -31;\ 29)$,
      $(7;\ -1;\ 5)$ y $(-5;\ 11;\ -13)$, de cuadrados 1803, 75 y 315:

      $$
      \tfrac12\,M\,v_G^{2} = \frac{17^{2} + 19^{2} + 5^{2}}{12} = 56{,}25\ \text{J},
      \qquad
      T' = \frac{1 \cdot 1803 + 2 \cdot 75 + 3 \cdot 315}{72} = 40{,}25\ \text{J}
      $$

      $56{,}25 + 40{,}25 = 96{,}5$ J. Y la potencial, con G:
      $M\,g\,y_G = 6 \cdot 9{,}81 \cdot 1{,}5 = 88{,}29$ J. Lo mismo.

      **Lo que dice el resultado.** $\vec{H}_O$ junta dos cosas: el momento
      del avance de G, $\overrightarrow{OG}\times\vec{L}$, de módulo 62,7, y
      el giro de las partículas alrededor de G, $\vec{H}_G$, de módulo 35,4.
      Con la energía pasa lo mismo: 56,25 de los 96,5 J son el avance de G. La
      potencial, en cambio, no tiene parte relativa: $\sum m_i\,y_i$ es, por
      definición, $M\,y_G$.

  - id: ejma9-col93-la-grua-que-frena-de-golpe
    titulo: La carga de la grúa que se detiene de golpe
    fuente: >-
      Ejercicio 9.3 · Tema 9, «Magnitudes y teoremas fundamentales de la
      dinámica» · Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección
      publica el resultado y el curso publica su resolución; contra los dos
      está contrastado este desarrollo. Con una gravedad de 9,81 salen 2,837 m
      y con 9,8, los 2,838 m impresos.
    nivel: practica
    antes:
      idea: |
        Los teoremas de la dinámica del punto relacionan las fuerzas con el
        movimiento: el de la cantidad de movimiento, con la aceleración; el de
        la energía, con la velocidad en cada posición; y el del momento
        cinético, con los giros alrededor de un punto. Antes de aplicar
        ninguno se aísla el cuerpo y se dibujan todas las fuerzas que actúan
        sobre él.
      formula: |
        Los tres teoremas, con $T = \tfrac12 m v^{2}$ y $W$ el trabajo de
        todas las fuerzas:

        $$
        m\,\vec{a} = \sum\vec{F},
        \qquad
        T_2 - T_1 = W_{12},
        \qquad
        \dot{\vec{H}}_O = \sum\vec{M}_O
        $$

        Si todas las fuerzas que trabajan son conservativas, se conserva
        $T + V$, con $V = m\,g\,h$ la energía potencial del peso.
      reconocer: |
        Antes de calcular se mira qué le pasa a la carga en cuanto se para el
        carro.
    enunciado: |
      La grúa de la figura se mueve con una velocidad horizontal de
      $v = 3\ \text{m/s}$, pero de repente se detiene. Se desea conocer la
      distancia horizontal máxima que recorrerá la carga que lleva la grúa
      después de pararse.

      <figure>
      <svg viewBox="0 0 320 250" role="img" width="320" height="250" aria-labelledby="ejma9-col93-t ejma9-col93-d">
        <title id="ejma9-col93-t">La carga de la grúa colgada de un cable de 9 metros</title>
        <desc id="ejma9-col93-d">Un carro rueda por un carril horizontal rayado en el techo. De él cuelga un cable vertical de 9 metros con un gancho en el extremo. Una flecha horizontal hacia la derecha marca la velocidad de 3 metros por segundo del carro. Dibujo a escala.</desc>
        <defs>
          <marker id="ejma9-col93-f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
