        <text x="206" y="212" font-size="10" text-anchor="end" fill="var(--d2-tinta)">N<tspan font-size="7.5" dy="2.5">BP</tspan><tspan dy="-2.5"></tspan></text>
        <line x1="269.8" y1="182" x2="303.3" y2="176.1" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="296" y="192" font-size="10" text-anchor="middle" fill="var(--d2-tinta)">R<tspan font-size="7.5" dy="2.5">BP</tspan><tspan dy="-2.5"></tspan></text>
        <text x="52" y="70" font-size="9" text-anchor="end" fill="var(--faint)">A</text>
        <text x="182" y="152" font-size="9" text-anchor="end" fill="var(--faint)">B</text>
      </svg>
      <figcaption>

      A, a la izquierda, y B, a la derecha, con el plano a 10°. Las R son los rozamientos, μ por la normal de cada cara; entre A y B, iguales y contrarios sobre los dos bloques.

      </figcaption>
      </figure>

      - **Sobre A**: F, 500 N, y la componente de su peso,
        $m_A\,g\operatorname{sen}10^{\circ} = 34{,}07$ N, hacia abajo del
        plano; la normal de B, $N_{AB}$, y el rozamiento de B,
        $R_{AB} = \mu_{AB}N_{AB}$, hacia arriba, contra el deslizamiento de A
        sobre B.
      - **Sobre B**: en su cara de arriba, lo mismo cambiado de sentido; la
        componente de su peso, $m_B\,g\operatorname{sen}10^{\circ} = 51{,}10$
        N, hacia abajo del plano; y en su cara de abajo, la normal del plano,
        $N_{BP}$, y su rozamiento, $R_{BP} = \mu_{BP}N_{BP}$, hacia arriba.
      - **Se supone** que A desliza sobre B y B sobre el plano, los dos hacia
        abajo. Las cuentas lo confirman si sale $a_A > a_B > 0$.

      **2. Incógnitas.** Las dos normales, las aceleraciones $a_A$ y $a_B$, y
      lo que A avanza sobre B, $x_{A/B}$.

      **3. Ecuaciones.** Ninguno de los dos bloques se despega:
      perpendicularmente al plano no hay aceleración, y la normal de abajo
      soporta también lo que carga la de arriba:

      $$
      N_{AB} = m_A\,g\cos 10^{\circ},
      \qquad
      N_{BP} = N_{AB} + m_B\,g\cos 10^{\circ}
      $$

      A lo largo del plano, hacia abajo:

      $$
      F + m_A\,g\operatorname{sen}10^{\circ} - \mu_{AB}N_{AB} = m_A\,a_A
      $$

      $$
      m_B\,g\operatorname{sen}10^{\circ} + \mu_{AB}N_{AB} - \mu_{BP}N_{BP} = m_B\,a_B
      $$

      Y como los dos parten del reposo con aceleración constante,
      $x = \tfrac12\,a\,t^{2}$, y en el mismo tiempo $x_B = x_A\,a_B/a_A$.

      **4. Resultados.** Las normales:

      $$
      N_{AB} = 20 \cdot 9{,}81 \cdot 0{,}98481 = 193{,}22\ \text{N},
      \qquad
      N_{BP} = 193{,}22 + 30 \cdot 9{,}81 \cdot 0{,}98481 = 483{,}05\ \text{N}
      $$

      Los rozamientos, $R_{AB} = 0{,}4 \cdot 193{,}22 = 77{,}29$ N y
      $R_{BP} = 48{,}30$ N. Las aceleraciones:

      $$
      a_A = \frac{500 + 34{,}07 - 77{,}29}{20} = 22{,}84\ \text{m/s}^{2},
      \qquad
      a_B = \frac{51{,}10 + 77{,}29 - 48{,}30}{30} = 2{,}670\ \text{m/s}^{2}
      $$

      Las dos son constantes, lo que responde al «en cualquier instante» del
      enunciado, y $a_A > a_B > 0$: lo supuesto se cumple. Lo que A avanza
      sobre B:

      $$
      x_{A/B} = x_A\left(1 - \frac{a_B}{a_A}\right)
      = 0{,}2\left(1 - \frac{2{,}670}{22{,}84}\right) = 0{,}1766\ \text{m}
      $$

      **A acelera a 22,84 m/s², B a 2,670 m/s², y cuando A ha recorrido 0,2
      m, ha avanzado 0,1766 m sobre B.** Los resultados publicados son
      $a_A = 22{,}8\ \text{m/s}^{2}$, $a_B = 2{,}67\ \text{m/s}^{2}$ y
      $x_{A/B} = 0{,}177$ m.

      **5. Comprobación.** Los dos bloques juntos, sin separarlos: entre ellos
      la normal y el rozamiento se anulan, y a lo largo del plano solo quedan
      F, los dos pesos y el rozamiento del plano, con
      $(m_A + m_B)\,g\operatorname{sen}10^{\circ} = 85{,}17$ N:

      $$
      500 + 85{,}17 - 48{,}30 = 536{,}87\ \text{N},
      \qquad
      20 \cdot 22{,}84 + 30 \cdot 2{,}670 = 536{,}9\ \text{N}
      $$

      Y el apartado b, por el tiempo: A recorre los 0,2 m en
      $t = \sqrt{2 \cdot 0{,}2/22{,}84} = 0{,}1323$ s, y en ese tiempo B
      avanza $\tfrac12 \cdot 2{,}670 \cdot 0{,}1323^{2} = 0{,}02337$ m, así que
      $x_{A/B} = 0{,}2 - 0{,}02337 = 0{,}1766$ m. Lo mismo.

      **Lo que dice el resultado.** A sale disparado, a más de dos g: 500 N
      son mucho para 20 kg, y el rozamiento con B solo le quita
      $77{,}29/20 = 3{,}86\ \text{m/s}^{2}$. B, en cambio, apenas se mueve: lo
      arrastra ese mismo rozamiento y el plano le quita 48,3 N. Por eso casi
      todo lo que avanza A es sobre B: a los 0,13 s, A ya va a 3,02 m/s y B a
      0,35.

  - id: ejma9-col911-la-soga-doblada-que-se-suelta
    titulo: La soga doblada cuyo extremo libre se suelta
    fuente: >-
      Ejercicio 9.11 · Tema 9, «Magnitudes y teoremas fundamentales de la
      dinámica» · Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección
      publica la fórmula del resultado y el curso publica su resolución; contra
      los dos está contrastado este desarrollo. Como la respuesta es simbólica,
      las casillas piden el valor numérico con los datos de prueba que se
      declaran en cada pregunta, y un coeficiente adimensional.
    nivel: practica
    antes:
      idea: |
        La soga es un sistema de partículas: cada trozo tiene su velocidad, y
        la energía cinética del sistema es la suma de la de cada trozo. Si
        solo trabaja el peso, la energía mecánica se conserva, y la energía
        potencial de cada trozo es la de su masa concentrada en su centro de
        gravedad.
      formula: |
        Con $\lambda$ la masa por unidad de longitud, para un trozo de
        longitud $\ell$ con su centro de gravedad a la altura h:

        $$
        T + V = \text{cte},
        \qquad
        V = \lambda\,\ell\,g\,h,
        \qquad
        T = \tfrac12\,\lambda\,\ell\,v^{2}
        $$

        La última, si todo el trozo se mueve a la misma velocidad v.
      reconocer: |
        Antes de calcular se dibuja la soga en la situación b), con sus dos
        ramales.
    enunciado: |
      El extremo libre de una soga se suelta del reposo en la situación a).
      Determinar la velocidad $v$ del trozo de soga móvil en función de $y$ en
      la situación b). ¿Qué sucede en la situación c) cuando $y = L$?

      <figure>
      <svg viewBox="0 0 380 215" role="img" width="380" height="215" aria-labelledby="ejma9-col911-t ejma9-col911-d">
