        <text x="106" y="134" font-size="11" text-anchor="end" fill="var(--faint)">9 m</text>
        <line x1="182" y1="120" x2="228" y2="120" stroke="var(--flag)" stroke-width="1.8" marker-end="url(#ejma9-col93-f)"/>
        <text x="234" y="124" font-size="10" fill="var(--flag)">v = 3 m/s</text>
      </svg>
