      - tipo: calcular
        titulo: La aceleración de B
        pregunta: |
          ¿Cuánto vale la aceleración de $B$ a lo largo de su superficie?
        respuesta:
          tipo: magnitud
          valor: '0.4406 m/s^2'
          formato: una aceleración, con su unidad
        distractores:
          - valor: '3.049 m/s^2'
            mensaje: |
              Has ignorado la polea móvil, tomando $a_A = a_B$ y una sola
              tensión sobre $B$. La ventaja mecánica de dos frena mucho el
              conjunto.
          - valor: '1.294 m/s^2'
            mensaje: |
              Te has dejado los dos rozamientos. Con $\mu_k = 0{,}2$ se pierden
              100,7 N en $B$ y 184,4 N en $A$, que son la mayor parte de lo
              que sobra.
          - valor: '0.1208 m/s^2'
            mensaje: |
              Has calculado la normal de $B$ con el coseno. Su superficie es
              perpendicular a la de $A$, así que lo que la aprieta es
              $m_B g\operatorname{sen}\beta$, no $m_B g\cos\beta$.
        pista: |
          $N_A = m_A g\cos\beta$ y $N_B = m_B g\operatorname{sen}\beta$. Con
          $a_A = 2a_B$, sumando las dos ecuaciones queda
          $a_B = \dfrac{m_B g(\cos\beta - \mu\operatorname{sen}\beta) - 2m_A g(\operatorname{sen}\beta + \mu\cos\beta)}{4m_A + m_B}$.
        desarrollo: |
          $$
          a_B = \frac{1382{,}76 - 100{,}66 - 2\,(335{,}52 + 184{,}37)}{550}
          = \frac{242{,}32}{550} = 0{,}4406\ \text{m/s}^{2}
          $$

          y $a_A = 2a_B = 0{,}881\ \text{m/s}^{2}$.
      - tipo: calcular
        titulo: La fuerza de la soga
        pregunta: |
          ¿Cuánto vale la tensión $T$ de la soga?
        respuesta:
          tipo: magnitud
          valor: '608.0 N'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '691.4 N'
            mensaje: |
              Has puesto a $B$ en equilibrio sin rozamiento,
              $2T = m_B g\cos\beta$. $B$ acelera y además su superficie roza.
          - valor: '519.9 N'
            mensaje: |
              Te has dejado el término $m_A a_A$. La soga no solo sostiene a
              $A$ contra el peso y el rozamiento: además lo acelera a
              $0{,}881\ \text{m/s}^{2}$.
          - valor: '824.8 N'
            mensaje: |
              Es lo que sale sin la polea móvil, con $a_A = a_B = 3{,}05\ \text{m/s}^{2}$.
              Con la ventaja mecánica de dos el sistema acelera mucho menos y
              la soga va menos cargada.
        pista: |
          De la ecuación de $A$,
          $T = m_A a_A + m_A g\left(\mu\cos\beta + \operatorname{sen}\beta\right)$.
        desarrollo: |
          $$
          T = 100 \cdot 0{,}8812 + 981\,(0{,}2 \cdot 0{,}93969 + 0{,}34202)
          = 88{,}12 + 519{,}89 = 608{,}0\ \text{N}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Se comprueba primero que arranca: con $\mu_s = 0{,}25$, B pediría $T = 628{,}5$ N y A solo aguanta $566{,}0$ N, así que el sistema se mueve y a partir de ahí manda $\mu_k$.'
          - texto: 'Las normales salen del equilibrio perpendicular: $N_A = m_A g\cos\beta = 921{,}8$ N y $N_B = m_B g\operatorname{sen}\beta = 503{,}3$ N.'
          - texto: 'Con $a_A = 2a_B$ y $2T$ sobre B, las dos ecuaciones dan $a_B = 0{,}4406\ \text{m/s}^{2}$, $a_A = 0{,}881\ \text{m/s}^{2}$ y $T = 608$ N.'
          - texto: 'Como las dos superficies son perpendiculares, la normal de B vale $m_B g\cos\beta$, igual que la de A pero con su masa.'
            trampa: true
            mensaje: |
              Precisamente porque son perpendiculares, lo que en una es coseno
              en la otra es seno: $N_A = m_A g\cos\beta$ pero
              $N_B = m_B g\operatorname{sen}\beta$. Confundirlas casi triplica
              el rozamiento de $B$ y deja $a_B$ en $0{,}12\ \text{m/s}^{2}$.
    resolucion: |
      **1. Sólidos libres.** Es un problema de dinámica de dos bloques unidos
      por una soga con una polea móvil: el dibujo lleva cada bloque por
      separado, A solo y B con su polea.

      <figure class="figura-examen">
      <svg viewBox="0 4 256 180" role="img" width="384" height="270" aria-labelledby="dsl-t dsl-d">
