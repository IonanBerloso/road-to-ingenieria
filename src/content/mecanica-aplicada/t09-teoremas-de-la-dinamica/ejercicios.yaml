    pide: Las aceleraciones de los dos bloques y la fuerza de la soga.
    pasos:
      - tipo: reconocer
        pregunta: |
          $B$ cuelga de una polea móvil por la que pasa la soga que viene de
          $A$. ¿Qué relación hay entre las dos aceleraciones y qué tensión
          soporta $B$?
        opciones:
          - texto: '$a_A = 2a_B$, y sobre B tiran dos ramales, o sea $2T$'
            correcta: true
            mensaje: |
              Eso es. La polea móvil reparte la soga en dos ramales: $B$
              recibe $2T$ y avanza la mitad que $A$, así que su aceleración es
              la mitad.
          - texto: '$a_A = a_B$, y sobre B tira un solo ramal con la tensión T'
            mensaje: |
              Eso sería con la soga atada directamente a $B$. Con la polea
              móvil hay dos ramales y la ventaja mecánica es de dos: doble
              fuerza, mitad de recorrido.
          - texto: '$a_B = 2a_A$, porque B es el que baja y arrastra a A'
            mensaje: |
              Está al revés. El extremo de la soga que va a $A$ se mueve el
              doble que la polea móvil, así que es $A$ el que tiene la
              aceleración grande.
      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **cada bloque por separado, A
          solo y B con su polea móvil, con todas las fuerzas que actúan sobre
          él**. Sin escala.
        comprueba:
          - punto: |
              **Sobre A, una sola tensión T, a lo largo de su cara y hacia la
              esquina.**
            porque: |
              A está atado a un extremo de la soga, que tira de él hacia la
              polea fija.
          - punto: |
              **Sobre B, dos tensiones T, a lo largo de su cara y hacia
              arriba.**
            porque: |
              Al cortar la soga alrededor de la polea móvil se cortan los dos
              ramales que la sostienen, y cada uno tira con T.
          - punto: |
              **En cada bloque, la normal, perpendicular a su cara, y el
              rozamiento, a lo largo de ella: hacia abajo en A y hacia arriba
              en B.**
            porque: |
              A sube por su cara y B baja por la suya; el rozamiento se opone
              en cada uno a su deslizamiento.
          - punto: |
              **Los dos pesos, verticales.**
            porque: |
              La gravedad tira de cada bloque hacia abajo, esté en la cara que
              esté.
