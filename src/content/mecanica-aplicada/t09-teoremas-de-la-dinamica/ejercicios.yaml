            porque: |
              El hilo solo tira a lo largo de sí mismo. El anillo desliza sin
              rozamiento por el alambre, así que la tensión es la misma en los
              dos tramos. Y A y B están sobre el eje, por encima de C.
          - punto: |
              **La aceleración, horizontal y hacia el eje.**
            porque: |
              C describe una circunferencia horizontal alrededor del eje con el
              módulo de la velocidad constante: no hay tangencial, solo la
              normal, hacia el centro.
        figura: |
