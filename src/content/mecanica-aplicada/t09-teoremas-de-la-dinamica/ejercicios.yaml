        <desc id="ejma9-col99-d">Del techo cuelga el punto fijo O. De él sale una cuerda horizontal de 0,8 metros hasta la partícula B. El clavo A está a 0,4 metros de O, en una recta que baja 30 grados por debajo de la horizontal. Una línea de puntos sigue la trayectoria de la partícula, primero un arco alrededor de O y después, desde que la cuerda apoya en A, un arco de radio mitad alrededor de A hasta quedar colgando en vertical, posición en la que el ángulo theta vale 90 grados. Dibujo a escala.</desc>
