        <path d="M30 50 L144 97.5" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
        <line x1="122" y1="100" x2="144" y2="100" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="156" y1="100" x2="184" y2="100" stroke="var(--faint)" stroke-width="0.7"/>
        <path d="M126 90 A26 26 0 0 0 124 100" fill="none" stroke="var(--ink)" stroke-width="0.9"/>
        <text x="114" y="99" font-size="10" fill="var(--ink)">θ</text>
        <line x1="150" y1="100" x2="109.4" y2="83.1" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="126" y="80" font-size="10" text-anchor="middle" fill="var(--d2-tinta)">F</text>
        <line x1="150" y1="105" x2="150" y2="141" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
        <text x="155" y="137" font-size="10" text-anchor="start" fill="var(--flag)">mg</text>
        <line x1="150" y1="95" x2="150" y2="61" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="143" y="72" font-size="10" text-anchor="end" fill="var(--d2-tinta)">N</text>
        <line x1="168" y1="96" x2="168" y2="70" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="173" y="82" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">a<tspan font-size="7.5" dy="2.5">n</tspan></text>
        <circle cx="150" cy="50" r="2.4" fill="var(--ink)"/>
        <text x="156" y="47" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">O</text>
        <circle cx="30" cy="50" r="2.4" fill="var(--ink)"/>
        <text x="26" y="47" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">D</text>
        <circle cx="150" cy="100" r="2.4" fill="var(--ink)"/>
        <text x="140" y="116" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">B</text>
        <text x="186" y="103" font-size="9" text-anchor="start" fill="var(--faint)">t</text>
        <text x="152" y="58" font-size="9" text-anchor="start" fill="var(--faint)">n</text>
      </svg>
      <figcaption>

      La deslizadera en B, con la varilla y el muelle quitados. En el punto más bajo, la tangente t es horizontal y la normal n apunta a O.

      </figcaption>
      </figure>

      - **El peso**, $m\,g = 0{,}5 \cdot 9{,}81 = 4{,}905$ N, vertical.
      - **El muelle**, a lo largo de BD y hacia D, con $F = k\,(d - L_0)$.
      - **La varilla**, N, perpendicular a ella: en B, vertical. Sin
        rozamiento, no tiene componente tangencial.

      La geometría: D está sobre la horizontal de O, a $175 + 125 = 300$ mm a
      su izquierda, y B, 125 mm por debajo de O:

      $$
      d = \sqrt{300^{2} + 125^{2}} = 325\ \text{mm},
      \qquad
      \cos\theta = \frac{300}{325} = 0{,}92308,
      \qquad
      \operatorname{sen}\theta = \frac{125}{325} = 0{,}38462
      $$

      **2. Incógnitas.** La aceleración tangencial, $a_t$, y la fuerza de la
      varilla, N.

      **3. Ecuaciones.** En B, el punto más bajo, la tangente es horizontal y
      la normal apunta a O, hacia arriba. El peso no tiene componente
      tangencial; el muelle, estirado $325 - 150 = 175$ mm, se reparte con el
      coseno en la tangente y con el seno en la normal:

      $$
      F\cos\theta = m\,a_t,
      \qquad
      N + F\operatorname{sen}\theta - m\,g = \frac{m\,v^{2}}{R}
      $$

      **4. Resultados.** Con $F = 200 \cdot 0{,}175 = 35$ N:

      $$
      a_t = \frac{35 \cdot 0{,}92308}{0{,}5} = 64{,}62\ \text{m/s}^{2}
      $$

      hacia la izquierda, el lado de D. Y la fuerza de la varilla:

      $$
      N = \frac{0{,}5 \cdot 9}{0{,}125} + 0{,}5 \cdot 9{,}81 - 35 \cdot 0{,}38462
      $$

      $$
      N = 36 + 4{,}905 - 13{,}462 = 27{,}44\ \text{N}
      $$

      vertical y hacia O. **La deslizadera acelera tangencialmente a 64,62
      m/s², hacia el lado de D, y la varilla la empuja con 27,44 N hacia el
      centro.** La aceleración coincide con la publicada.

      **Sobre el resultado impreso.** La hoja publica $N = 23$ N. Ese número no
      es el del plano vertical: es el del plano **horizontal**, donde el peso
      no entra y queda $N = 36 - 13{,}462 = 22{,}54$ N. La propia resolución
      del curso da los dos, 27,4 N en el plano vertical y 22,5 N en el
      horizontal, y el enunciado dice vertical, así que el valor correcto es
      $27{,}44$ N.

      **5. Comprobación.** Por la energía, sin proyectar fuerzas. La varilla
      no trabaja, y $\tfrac12 m v^{2} + V$ se conserva, con V la energía del
      muelle y del peso; derivando respecto del arco s recorrido sobre la
      varilla, $m\,a_t = -dV/ds$. Si la deslizadera se aparta de B un ángulo
      $\varphi$ hacia A, su distancia a D cumple

      $$
      d^{2} = (0{,}3 + R\operatorname{sen}\varphi)^{2} + (R\cos\varphi)^{2}
      = 0{,}105625 + 0{,}075\operatorname{sen}\varphi
      $$

      y con $ds = R\,d\varphi$, en B, donde $\varphi = 0$:

      $$
      \frac{dd}{ds} = \frac{0{,}075}{2 \cdot 0{,}325 \cdot 0{,}125} = 0{,}92308
      $$

      En el punto más bajo la altura no cambia, y el peso no entra:

      $$
      m\,a_t = -k\,(d - L_0)\,\frac{dd}{ds} = -35 \cdot 0{,}92308 = -32{,}31\ \text{N}
      $$

      $a_t = -64{,}62\ \text{m/s}^{2}$: hacia C, el lado de D. Y la fuerza de
      la varilla, como la que falta: con la aceleración $(-64{,}62;\ 72)$
      m/s², hace falta una fuerza total $(-32{,}31;\ 36)$ N, y el muelle y el
      peso dan $(-32{,}31;\ 13{,}462 - 4{,}905)$, es decir
      $(-32{,}31;\ 8{,}557)$ N. La diferencia, $(0;\ 27{,}44)$ N, es vertical,
      como tiene que ser la fuerza de una varilla lisa en B. Lo mismo.

      **Lo que dice el resultado.** La aceleración tangencial, más de seis
      veces g, la pone solo el muelle: en el punto más bajo el peso no tiene
      componente tangencial. Si la deslizadera va hacia A, se frena a ese
      ritmo; si va hacia C, se acelera; el módulo es el mismo, y el enunciado
      no dice hacia dónde va. Y la varilla carga con casi todo el giro: de los
      36 N que hacen falta para curvar la trayectoria, el muelle aporta 13,46
      hacia arriba y el peso quita 4,9; la varilla pone el resto.

  - id: ejma9-col99-la-cuerda-que-tropieza-con-un-clavo
    titulo: La partícula cuya cuerda tropieza con un clavo a mitad de camino
    fuente: >-
      Ejercicio 9.9 · Tema 9, «Magnitudes y teoremas fundamentales de la
      dinámica» · Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección
      publica los tres resultados y el curso publica su resolución; contra los
      dos está contrastado este desarrollo. La figura de la colección no rotula
      el ángulo de OA con la horizontal; la resolución del curso lo fija en 30
      grados, que es lo que exigen los tres resultados publicados, y así se ha
      redibujado.
    nivel: practica
    antes:
      idea: |
        La partícula, colgada de una cuerda, recorre arcos de circunferencia
        alrededor del punto en que gira la cuerda. La segunda ley a lo largo de
        la cuerda relaciona la tensión con la aceleración normal, y el teorema
        de la energía da la velocidad en cada posición.
      formula: |
        Con $\rho$ el radio de giro y $W_{12}$ el trabajo de todas las fuerzas
        entre dos posiciones:

        $$
        \sum F_n = m\,\frac{v^{2}}{\rho},
        \qquad
        \tfrac12\,m\,v_2^{2} - \tfrac12\,m\,v_1^{2} = W_{12}
        $$

        El peso de una partícula que baja una altura h trabaja $m\,g\,h$.
      reconocer: |
        Antes de calcular se mira alrededor de qué punto gira la partícula en
        cada tramo.
    enunciado: |
      La partícula $B$ de masa $m$ se suelta desde el reposo cuando la cuerda
      $OB$ está en la posición horizontal. Inicialmente, $B$ gira en torno a
      $O$ y posteriormente en torno a $A$. Determinar:

      a. Fuerza en la cuerda justo antes de tocar $A$

      b. Fuerza en la cuerda inmediatamente después de tocar $A$.

      c. Velocidad de la partícula cuando $\theta = 90^{\circ}$.

      <figure>
      <svg viewBox="0 -12 320 277" role="img" width="320" height="277" aria-labelledby="ejma9-col99-t ejma9-col99-d">
