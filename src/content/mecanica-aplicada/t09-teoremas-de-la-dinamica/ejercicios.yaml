        </defs>
        <rect x="60" y="18" width="200" height="10" fill="var(--faint)" fill-opacity="0.3" stroke="var(--faint)" stroke-width="0.8"/>
        <rect x="60" y="46" width="200" height="10" fill="var(--faint)" fill-opacity="0.3" stroke="var(--faint)" stroke-width="0.8"/>
        <rect x="146" y="30" width="42" height="14" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/>
        <circle cx="152" cy="30" r="3.6" fill="none" stroke="var(--ink)" stroke-width="1"/>
        <circle cx="167" cy="30" r="3.6" fill="none" stroke="var(--ink)" stroke-width="1"/>
        <circle cx="182" cy="30" r="3.6" fill="none" stroke="var(--ink)" stroke-width="1"/>
        <circle cx="158" cy="44" r="3.6" fill="none" stroke="var(--ink)" stroke-width="1"/>
        <circle cx="176" cy="44" r="3.6" fill="none" stroke="var(--ink)" stroke-width="1"/>
        <line x1="167" y1="56" x2="167" y2="206" stroke="var(--ink)" stroke-width="1.4"/>
