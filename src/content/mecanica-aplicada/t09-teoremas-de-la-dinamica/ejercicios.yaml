            <text x="196" y="62" font-size="9" text-anchor="start" fill="var(--faint)">(0; 1)</text>
            <text x="266" y="104" font-size="9" text-anchor="start" fill="var(--faint)">(3; 2,5)</text>
            <text x="290" y="62" font-size="9" text-anchor="start" fill="var(--faint)">(4; 1)</text>
