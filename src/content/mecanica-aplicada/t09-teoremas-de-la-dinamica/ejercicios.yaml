    pide: El centro de gravedad, el momento lineal, los dos momentos angulares, la energía cinética y la energía potencial.
    pasos:
      - tipo: reconocer
        pregunta: |
          Ya tienes $\vec{H}_O$. ¿Cuál es la forma más corta de sacar
          $\vec{H}_G$ sin repetir los tres productos vectoriales?
        opciones:
          - texto: Con el cambio de punto, restando a $\vec{H}_O$ el momento de $\vec{L}$ aplicado en $G$
            correcta: true
            mensaje: |
              Eso es. El momento angular es un campo de momentos, así que
              $\vec{H}_O = \vec{H}_G + \overrightarrow{OG}\times\vec{L}$, y
              basta despejar $\vec{H}_G$.
          - texto: Son iguales, porque el momento angular no depende del punto
            mensaje: |
              Sí depende. Solo coinciden cuando $\vec{L}$ es nulo o cuando
              $\overrightarrow{OG}$ es paralelo a $\vec{L}$, y aquí no pasa
              ninguna de las dos cosas.
          - texto: Dividiendo $\vec{H}_O$ entre la masa total del sistema
            mensaje: |
              Eso no tiene ni las unidades correctas. Cambiar de punto un
              momento es restar un producto vectorial, no dividir por una
              masa.
      - tipo: calcular
        titulo: La energía cinética del sistema
        pregunta: |
          ¿Cuánto vale la energía cinética total $T$ del sistema?
        respuesta:
          tipo: magnitud
          valor: '96.5 J'
          formato: una energía, con su unidad
        distractores:
          - valor: '193 J'
            mensaje: |
              Te has dejado el $\tfrac12$. La energía cinética de cada
              partícula es $\tfrac12 m_i v_i^{2}$, no $m_i v_i^{2}$.
          - valor: '48.25 J'
            mensaje: |
              Has dividido entre dos de más, seguramente aplicando el $\tfrac12$
              dos veces. Suma $\tfrac12 m_i v_i^{2}$ partícula a partícula.
          - valor: '30.5 J'
            mensaje: |
              Eso es $\tfrac12 M v_G^{2}$ con $v_G = \vec{L}/M$, o sea solo el
              término de arrastre del teorema de König. Falta la energía del
              movimiento relativo a $G$.
        pista: |
          $T = \sum \tfrac12 m_i\,\vec{v}_i\cdot\vec{v}_i$, con
          $v_A^{2}=29$, $v_B^{2}=25$ y $v_C^{2}=38$.
        desarrollo: |
          $$
          T = \tfrac12\left(1 \cdot 29 + 2 \cdot 25 + 3 \cdot 38\right)
          = \tfrac12\left(29 + 50 + 114\right) = 96{,}5\ \text{J}
          $$
      - tipo: calcular
        titulo: La componente y del momento angular en G
        pregunta: |
          Usando el cambio de punto, ¿cuánto vale la componente $y$ de
          $\vec{H}_G$, en kg·m²/s?
        respuesta:
          tipo: numero
          valor: '24.5'
          tolerancia: 0.2
          formato: un número, en kg·m²/s
        distractores:
          - valor: '65'
            mensaje: |
              Esa es la componente $y$ de $\vec{H}_O$. Falta restarle la del
              producto $\overrightarrow{OG}\times\vec{L}$, que vale $40{,}5$.
          - valor: '105.5'
            mensaje: |
              Has sumado el producto en vez de restarlo. La relación es
              $\vec{H}_O = \vec{H}_G + \overrightarrow{OG}\times\vec{L}$, así
              que $\vec{H}_G = \vec{H}_O - \overrightarrow{OG}\times\vec{L}$.
        pista: |
          $\overrightarrow{OG} = (3;\ 1{,}5;\ 1{,}5)$ y
          $\vec{L} = (17;\ 19;\ -5)$; el producto vectorial da
          $(-36;\ 40{,}5;\ 31{,}5)$.
        desarrollo: |
          $$
          \vec{H}_G = \vec{H}_O - \overrightarrow{OG}\times\vec{L}
          = (-34;\ 65;\ 57) - (-36;\ 40{,}5;\ 31{,}5)
          $$

          $$
          \vec{H}_G = 2\vec{i} + 24{,}5\vec{j} + 25{,}5\vec{k}\ \ \text{kg}\cdot\text{m}^{2}/\text{s}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: '$M = 6$ kg y $\overrightarrow{OG} = \sum m_i\vec{r}_i / M = (3;\ 1{,}5;\ 1{,}5)$ m.'
          - texto: '$\vec{L} = \sum m_i\vec{v}_i = (17;\ 19;\ -5)$ kg·m/s, y de ahí $\vec{v}_G = \vec{L}/M$.'
          - texto: '$\vec{H}_O = \sum \overrightarrow{OA_i}\times m_i\vec{v}_i = (-34;\ 65;\ 57)$, y $\vec{H}_G$ sale del cambio de punto.'
          - texto: 'La energía potencial se calcula con la altura de cada partícula sobre el suelo: $V_g = M\,g\,y_G$ solo vale si todas están a la misma altura.'
            trampa: true
            mensaje: |
              Al revés: $V_g = \sum m_i g\,y_i = M\,g\,y_G$ vale **siempre**,
              porque la suma de $m_i y_i$ es por definición $M\,y_G$. Aquí
              $6 \cdot 9{,}81 \cdot 1{,}5 = 88{,}29$ J, el mismo número que
              sumando partícula a partícula.
    resolucion: |
      **Las posiciones.** De la figura, $A = (0;\ 3;\ 1)$, $B = (3;\ 0;\ 2{,}5)$
      y $C = (4;\ 2;\ 1)$, en metros. La masa total es $M = 6$ kg.

      **a) Centro de gravedad.**

      $$
      \overrightarrow{OG} = \frac{1(0;3;1) + 2(3;0;2{,}5) + 3(4;2;1)}{6}
      = 3\vec{i} + 1{,}5\vec{j} + 1{,}5\vec{k}\ \ \text{m}
      $$

      **b) Momento lineal.**

      $$
      \vec{L} = 1(3;-2;4) + 2(4;3;0) + 3(2;5;-3) = 17\vec{i} + 19\vec{j} - 5\vec{k}\ \ \text{kg}\cdot\text{m/s}
      $$

      **c) Momento angular en O.** Cada sumando es
      $\overrightarrow{OA_i}\times m_i\vec{v}_i$:

      $$
      (12;\ 0;\ -9) + (-18;\ 24;\ 18) + (-33;\ 42;\ 48)
      = -34\vec{i} + 65\vec{j} + 57\vec{k}
      $$

      **d) Momento angular en G.** Con el cambio de punto,
      $\overrightarrow{OG}\times\vec{L} = (-36;\ 40{,}5;\ 31{,}5)$:

      $$
      \vec{H}_G = (-34;\ 65;\ 57) - (-36;\ 40{,}5;\ 31{,}5) = 2\vec{i} + 24{,}5\vec{j} + 25{,}5\vec{k}
      $$

      **e) Energía cinética.**
      $T = \tfrac12(1 \cdot 29 + 2 \cdot 25 + 3 \cdot 38) = 96{,}5$ J.

      **f) Energía potencial.**
      $V_g = g\sum m_i y_i = 9{,}81(1 \cdot 3 + 2 \cdot 0 + 3 \cdot 2) = 88{,}29$ J,
      que es también $M\,g\,y_G = 6 \cdot 9{,}81 \cdot 1{,}5$.

  - id: ejma9-col93-la-grua-que-frena-de-golpe
    titulo: La carga de la grúa que se detiene de golpe
    fuente: >-
      Ejercicio 9.3 · Tema 9, «Magnitudes y teoremas fundamentales de la
      dinámica» · Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección
      publica el resultado y el curso publica su resolución; contra los dos
      está contrastado este desarrollo. Con una gravedad de 9,81 salen 2,837 m
      y con 9,8, los 2,838 m impresos.
    nivel: practica
    enunciado: |
      La grúa de la figura se mueve con una velocidad horizontal de
      $v = 3\ \text{m/s}$, pero de repente se detiene. Se desea conocer la
      distancia horizontal máxima que recorrerá la carga que lleva la grúa
      después de pararse.

      <figure>
      <svg viewBox="0 0 320 250" role="img" width="320" height="250" aria-labelledby="ejma9-col93-t ejma9-col93-d">
        <title id="ejma9-col93-t">La carga de la grúa colgada de un cable de 9 metros</title>
        <desc id="ejma9-col93-d">Un carro rueda por un carril horizontal rayado en el techo. De él cuelga un cable vertical de 9 metros con un gancho en el extremo. Una flecha horizontal hacia la derecha marca la velocidad de 3 metros por segundo del carro. Dibujo a escala.</desc>
        <defs>
          <marker id="ejma9-col93-f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
