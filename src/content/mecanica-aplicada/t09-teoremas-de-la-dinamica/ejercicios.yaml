          <marker id="ejma9-col94-c2" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M8 0 L0 4 L8 8 z" fill="var(--faint)"/>
          </marker>
        </defs>
        <line x1="130" y1="52" x2="250" y2="52" stroke="var(--faint)" stroke-width="0.9" marker-end="url(#ejma9-col94-f)" marker-start="url(#ejma9-col94-c2)"/>
        <text x="190" y="45" font-size="11" text-anchor="middle" fill="var(--faint)">600</text>
        <path d="M130 56 L130 92 M250 56 L250 102" fill="none" stroke="var(--faint)" stroke-width="0.8" stroke-dasharray="3 2"/>
        <line x1="62" y1="80" x2="112" y2="80" stroke="var(--flag)" stroke-width="1.8" marker-end="url(#ejma9-col94-f)"/>
        <text x="60" y="72" font-size="10" fill="var(--flag)">v = 2,5 m/s</text>
        <rect x="60" y="95" width="70" height="55" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.4"/>
        <line x1="40" y1="150" x2="340" y2="150" stroke="var(--ink)" stroke-width="1.4"/>
        <path d="M46 150 L38 160 M62 150 L54 160 M78 150 L70 160 M94 150 L86 160 M110 150 L102 160 M126 150 L118 160 M142 150 L134 160 M158 150 L150 160 M174 150 L166 160 M190 150 L182 160 M206 150 L198 160 M222 150 L214 160 M238 150 L230 160 M254 150 L246 160 M270 150 L262 160 M286 150 L278 160 M302 150 L294 160 M318 150 L310 160 M334 150 L326 160" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <line x1="250" y1="102" x2="250" y2="148" stroke="var(--ink)" stroke-width="2"/>
        <path d="M250 125 L258 113 L268 137 L278 113 L288 137 L298 113 L308 137 L316 125 L322 125" fill="none" stroke="var(--ink)" stroke-width="1.4"/>
        <rect x="322" y="92" width="12" height="58" fill="var(--faint)" fill-opacity="0.3" stroke="var(--ink)" stroke-width="1.2"/>
        <path d="M334 96 L342 88 M334 110 L342 102 M334 124 L342 116 M334 138 L342 130 M334 150 L342 142" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
      </svg>
      </figure>
    pide: El coeficiente de rozamiento y la velocidad de vuelta por la posición de la figura.
    pasos:
      - tipo: reconocer
        pregunta: |
          El muelle ya está comprimido 120 mm antes de que llegue el fardo.
          ¿Qué energía elástica hay que usar en el balance?
        opciones:
          - texto: La diferencia entre $\tfrac12 k (0{,}16)^{2}$ y $\tfrac12 k (0{,}12)^{2}$, porque el muelle pasa de una compresión a otra
            correcta: true
            mensaje: |
              Eso es. La energía elástica depende de la deformación total, no
              de lo que se comprime de más, y lo que entra en el balance es su
              incremento entre las dos posiciones.
          - texto: Solo $\tfrac12 k (0{,}04)^{2}$, que es la compresión adicional
            mensaje: |
              La energía de un muelle no es lineal en la deformación, así que
              no se puede contar solo el tramo nuevo. Con 120 mm ya cargados,
              esos 40 mm cuestan mucho más que si partiera de cero.
          - texto: El trabajo $k\,x$ con $x = 0{,}04$ m, que es la fuerza por la distancia
            mensaje: |
              $k\,x$ es la **fuerza** del muelle, no su energía. Como la
              fuerza crece con la deformación, hay que integrar, y sale
              $\tfrac12 k x^{2}$.
      - tipo: calcular
        titulo: El coeficiente de rozamiento
        pregunta: |
          Aplicando el teorema de la energía entre la posición de la figura y
          la parada, ¿cuánto vale $\mu_k$?
        respuesta:
          tipo: numero
          valor: '0.2004'
          tolerancia: 0.005
          formato: un número, sin unidades
        distractores:
          - valor: '0.3188'
            mensaje: |
              Has contado el rozamiento solo en los 600 mm. El fardo sigue
              rozando mientras comprime el muelle, así que el recorrido es
              $0{,}6 + 0{,}04 = 0{,}64$ m.
          - valor: '0.4557'
            mensaje: |
              Has usado $\tfrac12 k(0{,}16)^{2}$ entera como energía absorbida,
              sin restar los $\tfrac12 k(0{,}12)^{2}$ que el muelle ya tenía
              guardados antes de que llegara el fardo.
          - valor: '0.0424'
            mensaje: |
              Has tomado $\tfrac12 k (0{,}04)^{2}$ como energía del muelle.
              Esa sería la energía si partiera sin comprimir; aquí el muelle
              va de 120 a 160 mm.
        pista: |
          $\tfrac12 m v_1^{2} + \tfrac12 k\delta^{2} = \tfrac12 k(\delta+\delta_0)^{2} + \mu_k\,m\,g\,(\Delta+\delta_0)$
          con $\Delta = 0{,}6$ m y $\delta_0 = 0{,}04$ m.
        desarrollo: |
          $$
          187{,}5 + 144 = 256 + \mu_k \cdot 60 \cdot 9{,}81 \cdot 0{,}64
          $$

          $$
          \mu_k = \frac{75{,}5}{376{,}70} = 0{,}2004
          $$
      - tipo: calcular
        titulo: La velocidad de vuelta
        pregunta: |
          El muelle devuelve la energía y empuja el fardo hacia atrás. ¿Con qué
          velocidad pasa otra vez por la posición de la figura?
        respuesta:
          tipo: magnitud
          valor: '1.103 m/s'
          formato: una velocidad, con su unidad
        distractores:
          - valor: '2.5 m/s'
            mensaje: |
              Esa es la velocidad de ida. El rozamiento se lleva energía en
              los dos sentidos, así que la de vuelta tiene que ser menor.
          - valor: '2.049 m/s'
            mensaje: |
              Has olvidado el rozamiento en el camino de vuelta. Vuelve a
              recorrer $0{,}64$ m rozando, y eso son otros $75{,}3$ J que se
              pierden.
          - valor: '1.564 m/s'
            mensaje: |
              Has contado el rozamiento solo en los 600 mm de la vuelta, o has
              usado la energía elástica sin restar la que el muelle conserva
              al quedarse retenido en los 120 mm.
        pista: |
          Del punto de parada al de la figura, el muelle entrega
          $\tfrac12 k(0{,}16)^{2} - \tfrac12 k(0{,}12)^{2} = 112$ J, y el
          rozamiento se lleva $75{,}3$ J.
        desarrollo: |
          $$
          \tfrac12 m v_3^{2} = 256 - 144 - 0{,}2004 \cdot 60 \cdot 9{,}81 \cdot 0{,}64 = 36{,}50\ \text{J}
          $$

          $$
          v_3 = \sqrt{\frac{2 \cdot 36{,}50}{60}} = 1{,}103\ \text{m/s}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'De la figura a la parada el fardo recorre $0{,}64$ m rozando, y el muelle pasa de 120 a 160 mm de compresión.'
          - texto: '$187{,}5 + 144 = 256 + \mu_k\,m\,g\,(0{,}64)$ da $\mu_k = 0{,}2$.'
          - texto: 'A la vuelta el muelle devuelve 112 J, el rozamiento se lleva otros $75{,}3$ J y quedan $36{,}5$ J de energía cinética: $v = 1{,}10$ m/s.'
          - texto: Como el rozamiento es una fuerza constante, su trabajo se anula en el viaje de ida y vuelta.
            trampa: true
            mensaje: |
              El rozamiento cambia de sentido con la velocidad, así que su
              trabajo es negativo en los dos tramos y se suma, no se cancela.
              Solo se anula el trabajo de las fuerzas **conservativas** en un
              camino cerrado.
    resolucion: |
      **Las fuerzas que trabajan.** El peso no trabaja, porque el movimiento es
      horizontal; la normal tampoco. Trabajan el muelle, conservativo, y el
      rozamiento, que no lo es. El teorema queda
      $T_1 + V_{e1} = T_2 + V_{e2} + W_{roz}$.

      **a) Coeficiente de rozamiento.** De la posición de la figura a la
      parada, el fardo recorre $0{,}6 + 0{,}04 = 0{,}64$ m y el muelle pasa de
      $\delta = 0{,}12$ m a $\delta+\delta_0 = 0{,}16$ m:

      $$
      \tfrac12 \cdot 60 \cdot 2{,}5^{2} + \tfrac12 \cdot 20000 \cdot 0{,}12^{2}
      = \tfrac12 \cdot 20000 \cdot 0{,}16^{2} + \mu_k \cdot 60 \cdot 9{,}81 \cdot 0{,}64
      $$

      $$
      187{,}5 + 144 = 256 + 376{,}70\,\mu_k \;\Longrightarrow\; \mu_k = 0{,}2004
      $$

      **b) Velocidad de vuelta.** El muelle empuja hasta que el cable lo
      retiene otra vez en los 120 mm, y el fardo sigue rozando los mismos
      $0{,}64$ m:

      $$
      256 = \tfrac12 \cdot 60\,v_3^{2} + 144 + 75{,}50
      \;\Longrightarrow\;
      v_3 = 1{,}103\ \text{m/s}
      $$

      Comprobación: integrando el tramo de empuje con la fuerza real del
      muelle, $k(\delta+\delta_0-x)$, y el rozamiento constante, y dejando
      luego correr los 600 mm, sale la misma velocidad, $1{,}103$ m/s. Los
      resultados publicados son $\mu_k = 0{,}2$ y $v = 1{,}10\ \text{m}\cdot\text{s}^{-1}$.

  - id: ejma9-col95-el-martillo-de-pilotes
    titulo: El martillo de pilotes que penetra 80 mm en el suelo
    fuente: >-
      Ejercicio 9.5 · Tema 9, «Magnitudes y teoremas fundamentales de la
      dinámica» · Mecánica Aplicada, UPV/EHU, curso 2025-2026. Ojo con las
      unidades de la ley del suelo: leyendo la fuerza en newton salen 3,41 J de
      trabajo resistente y el conjunto se acelera hasta 3,25 metros por
      segundo, mientras que el resultado publicado, 1,39, y la resolución del
      profesor corresponden a leerla en kilonewton. Se publica el valor de la
      colección porque es el que reproduce su desarrollo, y la discrepancia se
      explica en la resolución.
    nivel: practica
    enunciado: |
      La masa de pilotes de 650 kg de un martillo de caída libre cae sobre un
      pilote de 140 kg. Después del impacto, el martillo y el pilote quedan
      unidos y tienen una velocidad de $3\ \text{m/s}$. La fuerza vertical
      aplicada sobre el pilote por el suelo después del impacto está dada por
      $F = 0{,}02\cdot x^{2}$, donde $x$ y $F$ están expresados en mm y N,
      respectivamente. Determinar la velocidad del sistema después de haber
      penetrado 80 mm el suelo.

      <figure>
      <svg viewBox="0 0 300 270" role="img" width="300" height="270" aria-labelledby="ejma9-col95-t ejma9-col95-d">
        <title id="ejma9-col95-t">El martillo de 650 kg sobre el pilote de 140 kg clavado en el suelo</title>
        <desc id="ejma9-col95-d">Un martillo de 650 kilogramos baja entre dos guías verticales y golpea la cabeza de un pilote de 140 kilogramos. El pilote atraviesa la línea del terreno y termina en punta. A los lados de la parte enterrada, unas flechas hacia arriba representan la resistencia que el suelo opone al hincado.</desc>
        <defs>
          <marker id="ejma9-col95-f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--faint)"/>
          </marker>
        </defs>
        <line x1="116" y1="18" x2="116" y2="122" stroke="var(--ink)" stroke-width="1.6"/>
        <line x1="184" y1="18" x2="184" y2="122" stroke="var(--ink)" stroke-width="1.6"/>
        <rect x="126" y="42" width="48" height="56" fill="var(--faint)" fill-opacity="0.25" stroke="var(--ink)" stroke-width="1.5"/>
        <circle cx="150" cy="34" r="6" fill="none" stroke="var(--ink)" stroke-width="1.2"/>
        <path d="M92 46 L124 60" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="3 2"/>
        <text x="88" y="44" font-size="11" text-anchor="end" fill="var(--ink)">650 kg</text>
        <polygon points="140,100 160,100 160,214 150,232 140,214" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.5"/>
        <line x1="40" y1="150" x2="260" y2="150" stroke="var(--ink)" stroke-width="1.2"/>
        <text x="170" y="168" font-size="11" fill="var(--ink)">140 kg</text>
        <line x1="98" y1="208" x2="130" y2="182" stroke="var(--faint)" stroke-width="1.1" marker-end="url(#ejma9-col95-f)"/>
        <line x1="98" y1="234" x2="130" y2="208" stroke="var(--faint)" stroke-width="1.1" marker-end="url(#ejma9-col95-f)"/>
        <line x1="202" y1="208" x2="170" y2="182" stroke="var(--faint)" stroke-width="1.1" marker-end="url(#ejma9-col95-f)"/>
        <line x1="202" y1="234" x2="170" y2="208" stroke="var(--faint)" stroke-width="1.1" marker-end="url(#ejma9-col95-f)"/>
        <line x1="150" y1="256" x2="150" y2="238" stroke="var(--faint)" stroke-width="1.1" marker-end="url(#ejma9-col95-f)"/>
      </svg>
      </figure>
    pide: La velocidad del conjunto martillo más pilote tras penetrar 80 mm.
    pasos:
      - tipo: reconocer
        pregunta: |
          Durante los 80 mm de hincado, ¿qué se conserva y qué no?
        opciones:
          - texto: Ni el momento lineal ni la energía mecánica, porque el suelo hace una fuerza externa que además no es conservativa
            correcta: true
            mensaje: |
              Eso es. El suelo empuja hacia arriba con una fuerza que depende
              de la penetración y disipa energía. Hay que usar el teorema de
              la energía con el trabajo de esa fuerza, no una conservación.
          - texto: El momento lineal, porque el martillo y el pilote van unidos
            mensaje: |
              Ir unidos convierte el impacto en plástico, pero eso vale para
              el choque, no para lo que viene después. Durante el hincado
              actúan el peso y el suelo, que son fuerzas externas.
          - texto: La energía mecánica, porque el pilote baja y gana energía cinética
            mensaje: |
              El suelo se lleva energía en forma de deformación y calor. Si la
              energía mecánica se conservara, el pilote no se pararía nunca al
              hincar.
      - tipo: calcular
        titulo: El trabajo que hace el suelo
        pregunta: |
          Con la ley del enunciado y una penetración de 80 mm, ¿cuánto vale en
          valor absoluto el trabajo de la fuerza del suelo, contado como lo
          cuenta la colección?
        respuesta:
          tipo: magnitud
          valor: '3413 J'
          formato: una energía, con su unidad
        distractores:
          - valor: '10240 J'
            mensaje: |
              Te has dejado el 3 del denominador. La integral de $x^{2}$ es
              $x^{3}/3$, no $x^{3}$.
          - valor: '3.413 J'
            mensaje: |
              Ese es el trabajo leyendo la fuerza literalmente en newton, con
              $x$ pasado a metros. Da 3,41 J, una resistencia ridícula para un
              pilote, y con ella el conjunto se aceleraría en lugar de
              frenarse; la colección integra la ley en milímetros y obtiene
              julios, que equivale a leer la fuerza en kilonewton.
          - valor: '128 J'
            mensaje: |
              Eso es el valor de la fuerza al final del recorrido,
              $0{,}02 \cdot 80^{2} = 128$, no su trabajo. La fuerza crece con
              la penetración, así que hay que integrar.
        pista: |
          $W = \int_0^{80} 0{,}02\,x^{2}\,dx = 0{,}02\,\dfrac{80^{3}}{3}$.
        desarrollo: |
          $$
          W = \int_0^{80} 0{,}02\,x^{2}\,dx = \frac{0{,}02 \cdot 512000}{3} = 3413{,}3\ \text{J}
          $$
      - tipo: calcular
        titulo: La velocidad tras 80 mm
        pregunta: |
          Aplicando el teorema de la energía al tramo de hincado, ¿qué
          velocidad lleva el conjunto?
        respuesta:
          tipo: magnitud
          valor: '1.389 m/s'
          formato: una velocidad, con su unidad
        distractores:
          - valor: '3.25 m/s'
            mensaje: |
              Es lo que sale leyendo la fuerza literalmente en newton, con un
              trabajo resistente de 3,41 J. El peso gana entonces al suelo y
              el pilote acelera, que es justo lo contrario de lo que hace un
              pilote al hincarse.
          - valor: '1.239 m/s'
            mensaje: |
              Te has dejado el trabajo del peso. El conjunto baja 80 mm
              mientras el suelo lo frena, y el peso aporta
              $790 \cdot 9{,}81 \cdot 0{,}08 = 620$ J a favor del movimiento.
          - valor: '2.4 m/s'
            mensaje: |
              Has restado el trabajo del suelo sin el factor 2 al despejar la
              velocidad. De $\tfrac12 M v^{2}$ sale $v = \sqrt{2E/M}$.
        pista: |
          $\tfrac12 M v_1^{2} + M\,g\,d = \tfrac12 M v_2^{2} + W$, con
          $M = 790$ kg y $d = 0{,}08$ m.
        desarrollo: |
          $$
          v_2^{2} = v_1^{2} + 2g\,d - \frac{2W}{M}
          = 9 + 1{,}5696 - \frac{6826{,}7}{790} = 1{,}928
          $$

          $$
          v_2 = 1{,}389\ \text{m/s}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Tras el impacto el conjunto pesa $M = 790$ kg y baja con 3 m/s; en los 80 mm siguientes trabajan el peso y la fuerza del suelo.'
          - texto: 'El suelo se opone con $F = 0{,}02x^{2}$, y su trabajo en los 80 mm es $0{,}02 \cdot 80^{3}/3 = 3413$ J.'
          - texto: '$\tfrac12 M v_1^{2} + M g d - W = \tfrac12 M v_2^{2}$, de donde $v_2 = 1{,}39$ m/s.'
          - texto: 'Como la fuerza del suelo depende de la posición, es conservativa y su trabajo se puede escribir como una energía potencial que se recupera.'
            trampa: true
            mensaje: |
              Depender solo de la posición no basta para ser conservativa: la
              resistencia del suelo se opone **siempre** al movimiento, así
              que al sacar el pilote volvería a hacer trabajo negativo. Esa
              energía no se recupera, se disipa.
    resolucion: |
      **El punto de partida.** El impacto ya ha ocurrido, y su resultado es un
      dato: martillo y pilote quedan unidos, con $M = 650 + 140 = 790$ kg y
      $v_1 = 3\ \text{m/s}$ hacia abajo. Lo que se pide es lo que pasa en los
      80 mm siguientes.

      **Qué trabaja.** El peso, a favor del movimiento, y la fuerza del suelo,
      en contra. Esa fuerza no es conservativa: siempre se opone al
      movimiento.

      **El trabajo del suelo.**

      $$
      W = \int_0^{80} 0{,}02\,x^{2}\,dx = \frac{0{,}02 \cdot 80^{3}}{3} = 3413{,}3\ \text{J}
      $$

      **El teorema de la energía.**

      $$
      \tfrac12 \cdot 790 \cdot 3^{2} + 790 \cdot 9{,}81 \cdot 0{,}08
      = \tfrac12 \cdot 790\,v_2^{2} + 3413{,}3
      $$

      $$
      3555 + 620{,}0 - 3413{,}3 = 761{,}7\ \text{J} \;\Longrightarrow\; v_2 = 1{,}389\ \text{m/s}
      $$

      **Una advertencia sobre las unidades, que aquí no es un detalle.** El
      enunciado dice que $x$ va en mm y $F$ en N. Con esa lectura estricta el
      trabajo es $3{,}41$ J —mil veces menor— y el conjunto no se frena: sale
      $v_2 = 3{,}25\ \text{m/s}$, más rápido que al empezar. La colección y la
      resolución del curso integran la ley en milímetros y leen el resultado
      en julios, que es lo mismo que tomar la fuerza en **kilonewton**, y así
      obtienen los $1{,}39\ \text{m}\cdot\text{s}^{-1}$ publicados. Aquí se
      publica ese valor, que es el que corresponde al problema que se quería
      plantear, con la salvedad dicha.

      Comprobación: integrando $M\ddot{x} = M g - 0{,}02\,(1000x)^{2}\cdot 10^{3}$
      desde $v = 3$ hasta $x = 0{,}08$ m sale $v = 1{,}3886\ \text{m/s}$.

  - id: ejma9-col96-el-tren-en-la-pendiente
    titulo: La potencia que pide un tren subiendo una pendiente del 1,5 por ciento
    fuente: >-
      Ejercicio 9.6 · Tema 9, «Magnitudes y teoremas fundamentales de la
      dinámica» · Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección
      publica el resultado y el curso publica su resolución; contra los dos
      está contrastado este desarrollo.
    nivel: practica
    enunciado: |
      Un tren de masa total de 500 Tn parte del reposo y acelera uniformemente
      hasta 90 km/h en 50 s, subiendo una pendiente del 1,5 %. Después de
      alcanzar esta velocidad, el tren viaja con velocidad constante. La
      resistencia al rodamiento produce una fuerza total de 15 kN en dirección
      contraria a la del movimiento. Determinar la potencia requerida después
      de pasar 50 segundos.

      Dato: $\operatorname{sen}\alpha = 0{,}015$

      <figure>
      <svg viewBox="0 0 340 170" role="img" width="340" height="170" aria-labelledby="ejma9-col96-t ejma9-col96-d">
        <title id="ejma9-col96-t">El tren subiendo la rampa de pendiente 1,5 por ciento</title>
        <desc id="ejma9-col96-d">Una rampa triangular con un vagón sobre ella subiendo hacia la derecha. El ángulo de la base se llama alfa y su seno vale 0,015. A la derecha se acota la altura h ganada por la rampa. La inclinación del dibujo está exagerada: la real, del 1,5 por ciento, sería casi invisible.</desc>
        <defs>
          <marker id="ejma9-col96-c" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--faint)"/>
          </marker>
          <marker id="ejma9-col96-c2" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M8 0 L0 4 L8 8 z" fill="var(--faint)"/>
          </marker>
        </defs>
        <polygon points="30,140 290,140 290,88" fill="var(--faint)" fill-opacity="0.15" stroke="var(--ink)" stroke-width="1.3"/>
        <polygon points="139.9,108.6 198.7,96.9 203.0,75.3 144.2,87.0" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.4"/>
        <circle cx="153.6" cy="110.6" r="5" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/>
        <circle cx="183" cy="104.7" r="5" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/>
        <path d="M70 140 A 40 40 0 0 0 69.2 132.2" fill="none" stroke="var(--faint)" stroke-width="1" stroke-dasharray="3 2"/>
        <text x="54" y="136" font-size="11" fill="var(--ink)">α</text>
        <text x="215" y="126" font-size="11" fill="var(--ink)">senα = 0,015</text>
        <line x1="312" y1="88" x2="312" y2="140" stroke="var(--faint)" stroke-width="0.9" marker-end="url(#ejma9-col96-c)" marker-start="url(#ejma9-col96-c2)"/>
        <path d="M290 88 L318 88 M290 140 L318 140" fill="none" stroke="var(--faint)" stroke-width="0.8" stroke-dasharray="3 2"/>
        <text x="322" y="118" font-size="11" fill="var(--faint)">h</text>
      </svg>
      </figure>
    pide: La potencia requerida cuando el tren ya circula a velocidad constante.
    pasos:
      - tipo: reconocer
        pregunta: |
          Pasados los 50 s el tren va a 90 km/h constantes. ¿Qué cambia en el
          planteamiento respecto del tramo de aceleración?
        opciones:
          - texto: Que la aceleración es nula, así que la fuerza de tracción solo tiene que igualar al peso proyectado y a la resistencia
            correcta: true
            mensaje: |
              Eso es. Con $\vec{a}_G = \vec{0}$, el teorema del momento lineal
              se reduce al equilibrio, y la tracción vale
              $F_r + M g \operatorname{sen}\alpha$.
          - texto: Nada, la potencia es la misma que durante la aceleración
            mensaje: |
              Durante los 50 s la tracción incluye además $M a$, que con
              $a = 0{,}5\ \text{m/s}^{2}$ y 500 toneladas son 250 kN, mucho
              más que todo lo demás junto. La potencia no es la misma.
          - texto: Que ya no hay que contar el peso, porque el tren no gana altura
            mensaje: |
              Sí la gana: sube por la pendiente a velocidad constante, así que
              gana altura todo el rato. Lo que aporta el peso es
              $M g \operatorname{sen}\alpha$, y no depende de la aceleración.
      - tipo: calcular
        titulo: La fuerza de tracción
        pregunta: |
          ¿Cuánto vale la fuerza de tracción una vez alcanzada la velocidad de
          régimen?
        respuesta:
          tipo: magnitud
          valor: '88.58 kN'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '73.58 kN'
            mensaje: |
              Te has dejado la resistencia al rodamiento de 15 kN, que sigue
              actuando aunque la velocidad sea constante.
          - valor: '338.6 kN'
            mensaje: |
              Has dejado el término $M a$ con $a = 0{,}5\ \text{m/s}^{2}$. Ese
              es el tramo de los primeros 50 s; después la aceleración es
              nula.
          - valor: '15 kN'
            mensaje: |
              Solo has contado la resistencia al rodamiento. Subiendo una
              pendiente hay que vencer también la componente del peso,
              $M g \operatorname{sen}\alpha = 73{,}6$ kN, que aquí es lo
              gordo.
        pista: |
          $F_t = F_r + M\,g\operatorname{sen}\alpha$, con $M = 5\cdot 10^{5}$ kg.
        desarrollo: |
          $$
          F_t = 15000 + 5 \cdot 10^{5} \cdot 9{,}81 \cdot 0{,}015 = 15000 + 73575 = 88575\ \text{N}
          $$
      - tipo: calcular
        titulo: La potencia
        pregunta: |
          Con esa tracción y 90 km/h, ¿qué potencia se necesita?
        respuesta:
          tipo: magnitud
          valor: '2.214 MW'
          formato: una potencia, con su unidad
        distractores:
          - valor: '7.972 MW'
            mensaje: |
              Has multiplicado por 90 en lugar de por 25. La velocidad hay que
              pasarla a metros por segundo antes de multiplicar por la fuerza.
          - valor: '1.839 MW'
            mensaje: |
              Has usado solo la componente del peso, sin la resistencia al
              rodamiento. Los 15 kN aportan otros 375 kW.
        pista: |
          $P = F_t\,v$ con $v = 90/3{,}6 = 25\ \text{m/s}$.
        desarrollo: |
          $$
          P = 88575 \cdot 25 = 2{,}214 \cdot 10^{6}\ \text{W} = 2{,}214\ \text{MW}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Pasados los 50 s la velocidad es constante, $v = 25$ m/s, y la aceleración del centro de gravedad es nula.'
          - texto: '$\sum F = M a_G = 0$ a lo largo de la vía da $F_t = F_r + M g \operatorname{sen}\alpha = 88{,}58$ kN.'
          - texto: '$P = F_t\,v = 88575 \cdot 25 = 2{,}21$ MW.'
          - texto: 'A velocidad constante la potencia es nula, porque no cambia la energía cinética.'
            trampa: true
            mensaje: |
              Lo que no cambia es la energía **cinética**. La potencia de la
              tracción se va en subir —aumenta la potencial— y en vencer la
              resistencia al rodamiento, que disipa. La suma de todas las
              potencias es cero; la de la tracción, no.
    resolucion: |
      **En qué régimen estamos.** El enunciado pregunta por la potencia
      *después* de los 50 s, es decir cuando el tren ya circula a
      $v = 90/3{,}6 = 25\ \text{m/s}$ constantes. La aceleración del centro de
      gravedad es nula, así que el teorema del momento lineal,
      $\sum \vec{F} = M\vec{a}_G$, se queda en un equilibrio.

      **Las fuerzas a lo largo de la vía.** La tracción $F_t$ hacia delante; la
      resistencia al rodamiento, $F_r = 15$ kN, hacia atrás; y la componente
      del peso, $M g \operatorname{sen}\alpha$, también hacia atrás:

      $$
      F_t = F_r + M\,g\operatorname{sen}\alpha = 15000 + 5\cdot 10^{5} \cdot 9{,}81 \cdot 0{,}015 = 88575\ \text{N}
      $$

      **La potencia.**

      $$
      P = F_t\,v = 88575 \cdot 25 = 2{,}214\ \text{MW}
      $$

      Los datos de los primeros 50 s —arrancar del reposo, acelerar
      uniformemente— sirven solo para fijar la velocidad de régimen; la
      aceleración de ese tramo, $0{,}5\ \text{m/s}^{2}$, no entra en esta
      cuenta. El resultado publicado es $P = 2{,}21$ MW.
  - id: ejma9-col97-el-collarin-con-la-rampa-soldada
    titulo: El collarín con una rampa soldada y el bloque que sube por ella
    fuente: >-
      Ejercicio 9.7 · Tema 9, «Magnitudes y teoremas fundamentales de la
      dinámica» · Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección
      publica el resultado y el curso publica su resolución; contra los dos
      está contrastado este desarrollo. El texto castellano llama F a la fuerza
      vertical de 5 N y la figura la rotula P.
    nivel: practica
    enunciado: |
      Un collarín $A$ tiene una rampa soldada y una fuerza $F = 5\ \text{N}$
      aplicada tal y como se muestra. El collarín $A$ y la rampa pesan 3 N, y
      el bloque $B$ 0,8 N. Ignorando la fricción, calcular la fuerza del cable.

      <figure>
      <svg viewBox="0 0 300 320" role="img" width="300" height="320" aria-labelledby="ejma9-col97-t ejma9-col97-d">
        <title id="ejma9-col97-t">El collarín A sobre la guía vertical, con la rampa soldada y el bloque B</title>
        <desc id="ejma9-col97-d">Una guía vertical va del techo al suelo, los dos rayados. Por ella desliza el collarín A, empujado hacia arriba por la fuerza P de 5 newton. Del collarín sale una rampa soldada que baja hacia la derecha formando 50 grados con la vertical, y sobre ella corre el bloque B. Un cable baja del techo, pasa por una polea montada en el collarín, sigue por la rampa hasta una polea móvil en B y vuelve a anclarse junto al collarín.</desc>
        <defs>
          <marker id="ejma9-col97-f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
