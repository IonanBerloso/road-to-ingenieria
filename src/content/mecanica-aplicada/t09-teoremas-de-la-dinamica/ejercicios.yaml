      - tipo: calcular
        titulo: La aceleración del collarín
        pregunta: |
          Resolviendo el sistema de las cuatro ecuaciones con $g = 9{,}81$ m/s², ¿cuánto vale la
          aceleración $a_A$ del collarín, hacia arriba?
        respuesta:
          tipo: magnitud
          valor: '4.101 m/s^2'
          formato: una aceleración, con su unidad
        distractores:
          - valor: '6.54 m/s^2'
            mensaje: |
              Has olvidado el bloque. Con solo el collarín,
              $a = (5-3)g/3 = 6{,}54\ \text{m/s}^{2}$; $B$ pesa poco pero su
              inercia y el cable frenan el conjunto.
          - valor: '3.098 m/s^2'
            mensaje: |
              Has tratado collarín y bloque como un único cuerpo de 3,8 N que
              sube en bloque. $B$ no acompaña a $A$: se desliza por la rampa,
              así que su aceleración no es la de $A$.
        pista: |
          Con $\theta = 50^{\circ}$ desde la vertical,
          $\vec{a}_B = (0{,}5a_A\operatorname{sen}\theta;\ a_A(1-0{,}5\cos\theta))$,
          y sobre $B$ tiran $2T$ hacia arriba de la rampa.
        desarrollo: |
          Con $m_A = 3/g$, $m_B = 0{,}8/g$ y las cuatro ecuaciones de fuerzas,
          la eliminación de $N_B$ y $T$ deja

          $$
          0{,}355328\,a_A = 1{,}457115 \;\Longrightarrow\; a_A = 4{,}101\ \text{m/s}^{2}
          $$
      - tipo: calcular
        titulo: La fuerza del cable
        pregunta: |
          ¿Cuánto vale la tensión $T$ del cable?
        respuesta:
          tipo: magnitud
          valor: '0.281 N'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '0.8 N'
            mensaje: |
              Ese es el peso de $B$. El cable no lo sostiene en reposo: el
              conjunto acelera, y además la rampa aporta su normal.
          - valor: '0.257 N'
            mensaje: |
              Has puesto a $B$ en equilibrio sobre la rampa,
              $2T = m_B g\cos 50^{\circ}$. $B$ acelera, así que hay que
              escribir $\sum F = m_B \vec{a}_B$ con la aceleración compuesta.
          - valor: '0.562 N'
            mensaje: |
              Has contado un solo ramal de cable sobre $B$, y lo que sale es la
              fuerza total del cable sobre el bloque, $2T$. La polea de $B$ es
              móvil: sobre ella tiran **dos** ramales, y la tensión es la mitad.
        pista: |
          Sumando la ecuación vertical de $A$ y la vertical de $B$
          desaparecen $N_B$ y casi todo, y queda
          $T = 0{,}361150\,a_A - 1{,}2$.
        desarrollo: |
          $$
          T = 0{,}361150 \cdot 4{,}101 - 1{,}2 = 0{,}281\ \text{N}
          $$

          Con ella, $N_B = 0{,}869$ N y la guía hace sobre el collarín una
          fuerza horizontal de $0{,}128$ N.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'La ligadura del cable da $a_{B/A} = a_A/2$ a lo largo de la rampa, así que $\vec{a}_B = (0{,}5a_A\operatorname{sen}\theta;\ a_A(1-0{,}5\cos\theta))$.'
          - texto: 'Sobre B actúan su peso, la normal de la rampa y $2T$ hacia arriba de la rampa; sobre A, P, su peso, la normal de la guía, la reacción de B y las fuerzas del cable en la polea y en el anclaje.'
          - texto: 'Las cuatro ecuaciones dan $a_A = 4{,}10\ \text{m/s}^{2}$, $T = 0{,}281$ N, $N_B = 0{,}869$ N y $N_A = 0{,}128$ N.'
          - texto: 'Como el rozamiento es despreciable, el bloque B no ejerce ninguna fuerza sobre la rampa y se puede resolver A por separado.'
            trampa: true
            mensaje: |
              Sin rozamiento desaparece la fuerza **tangencial**, no la
              normal. $B$ sigue apretando la rampa con $N_B = 0{,}869$ N, y
              esa reacción entra en las ecuaciones del collarín.
    resolucion: |
      **1. Sólidos libres.** Es un problema de dinámica de dos cuerpos unidos
      por un cable: el dibujo lleva el collarín, con la rampa y la polea, y el
      bloque, cada uno por separado. Con x horizontal, hacia la rampa, y y
      vertical, hacia arriba, y $\theta = 50^{\circ}$ desde la vertical:

