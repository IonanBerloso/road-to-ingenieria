    pide: La fuerza que soporta el cable.
    pasos:
      - tipo: reconocer
        pregunta: |
          El cable baja del techo, pasa por la polea del collarín, recorre la
          rampa hasta la polea de $B$ y vuelve a anclarse en el collarín. Si
          $A$ sube una distancia $u$, ¿cuánto se aleja $B$ de $A$ a lo largo de
          la rampa?
        opciones:
          - texto: $u/2$, porque el cable liberado se reparte entre los dos ramales que sujetan a B
            correcta: true
            mensaje: |
              Eso es. La longitud total es constante; al subir $A$, el tramo
              del techo se acorta $u$, y ese cable pasa a los dos ramales de la
              rampa, que crecen $u/2$ cada uno. De ahí
              $a_{B/A} = a_A/2$.
          - texto: $u$, porque el cable es inextensible y todo lo que sube A baja B
            mensaje: |
              Eso sería con un solo ramal. La polea de $B$ es móvil y lleva
              dos ramales, así que se mueve la mitad que el extremo del cable.
          - texto: Nada, porque B va soldado a la rampa
            mensaje: |
              Lo que va soldado al collarín es la rampa, no el bloque. $B$
              corre sobre ella, y por eso su aceleración es la de $A$ más la
              relativa a lo largo de la rampa.
      - tipo: calcular
        titulo: La aceleración del collarín
        pregunta: |
          Resolviendo el sistema de las cuatro ecuaciones, ¿cuánto vale la
          aceleración $a_A$ del collarín, hacia arriba?
        respuesta:
          tipo: magnitud
          valor: '4.101 m/s^2'
          formato: una aceleración, con su unidad
        distractores:
          - valor: '6.54 m/s^2'
            mensaje: |
              Has olvidado el bloque. Con solo el collarín,
              $a = (5-3)g/3 = 6{,}54\ \text{m/s}^{2}$; $B$ pesa poco pero su
              inercia y el cable frenan el conjunto.
          - valor: '3.098 m/s^2'
            mensaje: |
              Has tratado collarín y bloque como un único cuerpo de 3,8 N que
              sube en bloque. $B$ no acompaña a $A$: se desliza por la rampa,
              así que su aceleración no es la de $A$.
        pista: |
          Con $\theta = 50^{\circ}$ desde la vertical,
          $\vec{a}_B = (0{,}5a_A\operatorname{sen}\theta;\ a_A(1-0{,}5\cos\theta))$,
          y sobre $B$ tiran $2T$ hacia arriba de la rampa.
        desarrollo: |
          Con $m_A = 3/g$, $m_B = 0{,}8/g$ y las cuatro ecuaciones de fuerzas,
          la eliminación de $N_B$ y $T$ deja

          $$
          0{,}355328\,a_A = 1{,}457119 \;\Longrightarrow\; a_A = 4{,}101\ \text{m/s}^{2}
          $$
      - tipo: calcular
        titulo: La fuerza del cable
        pregunta: |
          ¿Cuánto vale la tensión $T$ del cable?
        respuesta:
          tipo: magnitud
          valor: '0.281 N'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '0.8 N'
            mensaje: |
              Ese es el peso de $B$. El cable no lo sostiene en reposo: el
              conjunto acelera, y además la rampa aporta su normal.
          - valor: '0.257 N'
            mensaje: |
              Has puesto a $B$ en equilibrio sobre la rampa,
              $2T = m_B g\cos 50^{\circ}$. $B$ acelera, así que hay que
              escribir $\sum F = m_B \vec{a}_B$ con la aceleración compuesta.
          - valor: '0.514 N'
            mensaje: |
              Has contado un solo ramal de cable sobre $B$. La polea de $B$ es
              móvil: sobre ella tiran **dos** ramales, y por eso aparece $2T$.
        pista: |
          Sumando la ecuación vertical de $A$ y la de la rampa de $B$
          desaparecen $N_B$ y casi todo, y queda
          $T = 0{,}361150\,a_A - 1{,}2$.
        desarrollo: |
          $$
          T = 0{,}361150 \cdot 4{,}101 - 1{,}2 = 0{,}281\ \text{N}
          $$

          Con ella, $N_B = 0{,}869$ N y la guía hace sobre el collarín una
          fuerza horizontal de $0{,}128$ N.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'La ligadura del cable da $a_{B/A} = a_A/2$ a lo largo de la rampa, así que $\vec{a}_B = (0{,}5a_A\operatorname{sen}\theta;\ a_A(1-0{,}5\cos\theta))$.'
          - texto: 'Sobre B actúan su peso, la normal de la rampa y $2T$ hacia arriba de la rampa; sobre A, P, su peso, la normal de la guía, la reacción de B y las fuerzas del cable en la polea y en el anclaje.'
          - texto: 'Las cuatro ecuaciones dan $a_A = 4{,}10\ \text{m/s}^{2}$, $T = 0{,}281$ N, $N_B = 0{,}869$ N y $N_A = 0{,}128$ N.'
          - texto: 'Como el rozamiento es despreciable, el bloque B no ejerce ninguna fuerza sobre la rampa y se puede resolver A por separado.'
            trampa: true
            mensaje: |
              Sin rozamiento desaparece la fuerza **tangencial**, no la
              normal. $B$ sigue apretando la rampa con $N_B = 0{,}869$ N, y
              esa reacción entra en las ecuaciones del collarín.
    resolucion: |
      **La ligadura.** El cable sale del techo, pasa por la polea del collarín,
      baja por la rampa hasta la polea móvil de $B$ y vuelve a anclarse en el
      collarín. Al subir $A$ una distancia $u$, el tramo del techo se acorta
      $u$ y los dos ramales de la rampa crecen $u/2$ cada uno, así que $B$ se
      aleja de $A$ por la rampa esa mitad:

      $$
      \vec{a}_B = \vec{a}_A + \vec{a}_{B/A}
      = \left(\tfrac12 a_A\operatorname{sen}\theta;\ a_A\left(1 - \tfrac12\cos\theta\right)\right)
      \qquad \theta = 50^{\circ}
      $$

      **Diagrama de B.** Peso $m_B g$, normal $N_B$ perpendicular a la rampa y
      $2T$ hacia arriba de la rampa, porque su polea es móvil:

      $$
      -2T\operatorname{sen}\theta + N_B\cos\theta = m_B\,\tfrac12 a_A\operatorname{sen}\theta
      $$

      $$
      2T\cos\theta + N_B\operatorname{sen}\theta - m_B g = m_B\,a_A\left(1-\tfrac12\cos\theta\right)
      $$

      **Diagrama de A, con la rampa soldada.** Sobre la polea el cable tira con
      $T$ hacia el techo y con $T$ hacia abajo de la rampa; el anclaje añade
      otro $T$ hacia abajo de la rampa. En total el cable aporta
      $T(2\operatorname{sen}\theta;\ 1-2\cos\theta)$. Con la reacción de $B$:

      $$
      P - m_A g + T\left(1-2\cos\theta\right) - N_B\operatorname{sen}\theta = m_A\,a_A
      $$

      **Resolviendo.** Con $m_A = 3/9{,}81 = 0{,}30581$ kg y
      $m_B = 0{,}8/9{,}81 = 0{,}081549$ kg:

      $$
      a_A = 4{,}101\ \text{m/s}^{2}
      \qquad
      T = 0{,}281\ \text{N}
      \qquad
      N_B = 0{,}869\ \text{N}
      $$

      y la guía hace sobre el collarín $N_A = 0{,}128$ N en horizontal. La
      colección publica $T = 0{,}28$ N y la resolución del curso,
      $T = 0{,}281$ N con $a_A = 4{,}1\ \text{m/s}^{2}$ y $N_B = 0{,}869$ N,
      que es exactamente lo que sale aquí.

  - id: ejma9-col98-la-deslizadera-en-la-varilla-circular
    titulo: La deslizadera del muelle en una varilla circular
    fuente: >-
      Ejercicio 9.8 · Tema 9, «Magnitudes y teoremas fundamentales de la
      dinámica» · Mecánica Aplicada, UPV/EHU, curso 2025-2026. Discrepancia
      declarada: el enunciado dice plano vertical y con él salen 27,4 N, que es
      lo que también obtiene la resolución del curso; los 23 N impresos en la
      hoja de resultados son el caso del plano horizontal, que esa misma
      resolución cifra en 22,5 N. Se publica el valor que dan los datos y el
      impreso queda como distractor. La aceleración tangencial, 64,6 metros por
      segundo al cuadrado, coincide con la publicada.
    nivel: practica
    enunciado: |
      Una deslizadera de 0,5 kg está unida a un resorte y se desliza sin
      fricción a lo largo de una varilla circular en un plano vertical. El
      resorte tiene una longitud no deformada de 150 mm y una constante
      $K = 200\ \text{N/m}$. Sabiendo que la deslizadera tiene una velocidad de
      $3\ \text{m/s}$ al pasar por el punto $B$, determine en este instante la
      aceleración tangencial de la deslizadera y la fuerza de la varilla sobre
      la deslizadera.

      <figure>
      <svg viewBox="0 0 370 250" role="img" width="370" height="250" aria-labelledby="ejma9-col98-t ejma9-col98-d">
        <title id="ejma9-col98-t">La varilla circular de 125 milímetros de radio con la deslizadera en B y el muelle anclado en D</title>
        <desc id="ejma9-col98-d">Una varilla circular de 125 milímetros de radio, con centro O, en un plano vertical. A es el extremo derecho del diámetro horizontal, C el izquierdo y B el punto más bajo. Un muelle une la deslizadera con el punto fijo D de la pared, situado 175 milímetros a la izquierda de C sobre la horizontal de O. En la figura la deslizadera está dibujada en B. Dibujo a escala.</desc>
