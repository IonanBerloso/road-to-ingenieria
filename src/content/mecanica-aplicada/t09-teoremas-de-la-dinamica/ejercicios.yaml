    pide: Las aceleraciones de los dos bloques y la fuerza de la soga.
    pasos:
      - tipo: reconocer
        pregunta: |
          $B$ cuelga de una polea móvil por la que pasa la soga que viene de
          $A$. ¿Qué relación hay entre las dos aceleraciones y qué tensión
          soporta $B$?
        opciones:
          - texto: '$a_A = 2a_B$, y sobre B tiran dos ramales, o sea $2T$'
            correcta: true
            mensaje: |
              Eso es. La polea móvil reparte la soga en dos ramales: $B$
              recibe $2T$ y avanza la mitad que $A$, así que su aceleración es
              la mitad.
          - texto: '$a_A = a_B$, y sobre B tira un solo ramal con la tensión T'
            mensaje: |
              Eso sería con la soga atada directamente a $B$. Con la polea
              móvil hay dos ramales y la ventaja mecánica es de dos: doble
              fuerza, mitad de recorrido.
          - texto: '$a_B = 2a_A$, porque B es el que baja y arrastra a A'
            mensaje: |
              Está al revés. El extremo de la soga que va a $A$ se mueve el
              doble que la polea móvil, así que es $A$ el que tiene la
              aceleración grande.
      - tipo: calcular
        titulo: La aceleración de B
        pregunta: |
          ¿Cuánto vale la aceleración de $B$ a lo largo de su superficie?
        respuesta:
          tipo: magnitud
          valor: '0.4406 m/s^2'
          formato: una aceleración, con su unidad
        distractores:
          - valor: '3.049 m/s^2'
            mensaje: |
              Has ignorado la polea móvil, tomando $a_A = a_B$ y una sola
              tensión sobre $B$. La ventaja mecánica de dos frena mucho el
              conjunto.
          - valor: '1.294 m/s^2'
            mensaje: |
              Te has dejado los dos rozamientos. Con $\mu_k = 0{,}2$ se pierden
              100,7 N en $B$ y 184,4 N en $A$, que son la mayor parte de lo
              que sobra.
          - valor: '0.1208 m/s^2'
            mensaje: |
              Has calculado la normal de $B$ con el coseno. Su superficie es
              perpendicular a la de $A$, así que lo que la aprieta es
              $m_B g\operatorname{sen}\beta$, no $m_B g\cos\beta$.
        pista: |
          $N_A = m_A g\cos\beta$ y $N_B = m_B g\operatorname{sen}\beta$. Con
          $a_A = 2a_B$, sumando las dos ecuaciones queda
          $a_B = \dfrac{m_B g(\cos\beta - \mu\operatorname{sen}\beta) - 2m_A g(\operatorname{sen}\beta + \mu\cos\beta)}{4m_A + m_B}$.
        desarrollo: |
          $$
          a_B = \frac{1382{,}75 - 100{,}66 - 2\,(335{,}52 + 184{,}37)}{550}
          = \frac{242{,}31}{550} = 0{,}4406\ \text{m/s}^{2}
          $$

          y $a_A = 2a_B = 0{,}881\ \text{m/s}^{2}$.
      - tipo: calcular
        titulo: La fuerza de la soga
        pregunta: |
          ¿Cuánto vale la tensión $T$ de la soga?
        respuesta:
          tipo: magnitud
          valor: '608.0 N'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '691.4 N'
            mensaje: |
              Has puesto a $B$ en equilibrio sin rozamiento,
              $2T = m_B g\cos\beta$. $B$ acelera y además su superficie roza.
          - valor: '519.9 N'
            mensaje: |
              Te has dejado el término $m_A a_A$. La soga no solo sostiene a
              $A$ contra el peso y el rozamiento: además lo acelera a
              $0{,}881\ \text{m/s}^{2}$.
          - valor: '824.8 N'
            mensaje: |
              Es lo que sale sin la polea móvil, con $a_A = a_B = 3{,}05\ \text{m/s}^{2}$.
              Con la ventaja mecánica de dos el sistema acelera mucho menos y
              la soga va menos cargada.
        pista: |
          De la ecuación de $A$,
          $T = m_A a_A + m_A g\left(\mu\cos\beta + \operatorname{sen}\beta\right)$.
        desarrollo: |
          $$
          T = 100 \cdot 0{,}8812 + 981\,(0{,}2 \cdot 0{,}93969 + 0{,}34202)
          = 88{,}12 + 519{,}89 = 608{,}0\ \text{N}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Se comprueba primero que arranca: con $\mu_s = 0{,}25$, B pediría $T = 628{,}5$ N y A solo aguanta $566{,}0$ N, así que el sistema se mueve y a partir de ahí manda $\mu_k$.'
          - texto: 'Las normales salen del equilibrio perpendicular: $N_A = m_A g\cos\beta = 921{,}8$ N y $N_B = m_B g\operatorname{sen}\beta = 503{,}3$ N.'
          - texto: 'Con $a_A = 2a_B$ y $2T$ sobre B, las dos ecuaciones dan $a_B = 0{,}4405\ \text{m/s}^{2}$, $a_A = 0{,}881\ \text{m/s}^{2}$ y $T = 608$ N.'
          - texto: 'Como las dos superficies son perpendiculares, la normal de B vale $m_B g\cos\beta$, igual que la de A pero con su masa.'
            trampa: true
            mensaje: |
              Precisamente porque son perpendiculares, lo que en una es coseno
              en la otra es seno: $N_A = m_A g\cos\beta$ pero
              $N_B = m_B g\operatorname{sen}\beta$. Confundirlas casi cuadruplica
              el rozamiento de $B$ y deja $a_B$ en $0{,}12\ \text{m/s}^{2}$.
    resolucion: |
      **Primero, ¿se mueve?** Con los bloques en reposo manda $\mu_s = 0{,}25$.
      Si el sistema aguantara, $A$ podría resistir como mucho
      $T = \mu_s m_A g\cos\beta + m_A g\operatorname{sen}\beta = 566{,}0$ N,
      mientras que $B$ exigiría
      $2T = m_B g\cos\beta - \mu_s m_B g\operatorname{sen}\beta$, o sea
      $T = 628{,}5$ N. Como se pide más de lo que se aguanta, el sistema
      arranca y a partir de ahí el rozamiento es el dinámico, $\mu_k = 0{,}20$.

      **La ligadura.** La soga pasa por la polea fija de la esquina, rodea la
      polea móvil de $B$ y se ancla en la segunda cara. $B$ recibe dos ramales,
      $2T$, y se desplaza la mitad que $A$:

      $$
      x_A = 2x_B \;\Longrightarrow\; a_A = 2a_B
      $$

      **Las normales.** Las dos caras son perpendiculares, así que lo que en
      una es coseno en la otra es seno:

      $$
      N_A = m_A g\cos\beta = 921{,}84\ \text{N}
      \qquad
      N_B = m_B g\operatorname{sen}\beta = 503{,}28\ \text{N}
      $$

      **Las ecuaciones.** $A$ sube por su plano tirado por la soga; $B$ baja
      por el suyo:

      $$
      T - \mu_k N_A - m_A g\operatorname{sen}\beta = m_A a_A = 2 m_A a_B
      $$

      $$
      m_B g\cos\beta - \mu_k N_B - 2T = m_B a_B
      $$

      Eliminando $T$:

      $$
      a_B = \frac{m_B g\left(\cos\beta - \mu_k\operatorname{sen}\beta\right) - 2m_A g\left(\operatorname{sen}\beta + \mu_k\cos\beta\right)}{4m_A + m_B}
      = \frac{242{,}31}{550} = 0{,}4406\ \text{m/s}^{2}
      $$

      $$
      a_A = 0{,}8812\ \text{m/s}^{2}
      \qquad
      T = m_A a_A + m_A g\left(\mu_k\cos\beta + \operatorname{sen}\beta\right) = 608{,}0\ \text{N}
      $$

      Los resultados publicados son $T = 608{,}0$ N y
      $a_B = 0{,}4405\ \text{m/s}^{2}$ con $a_A = 2a_B$.
