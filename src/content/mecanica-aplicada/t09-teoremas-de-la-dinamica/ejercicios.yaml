    pide: La tensión antes y después de tocar el clavo, y la velocidad con la cuerda vertical.
    pasos:
      - tipo: reconocer
        pregunta: |
          En el instante en que la cuerda apoya en el clavo $A$, ¿qué cambia y
          qué no?
        opciones:
          - texto: La velocidad no cambia, pero el radio de giro se reduce a la mitad, así que la aceleración normal se duplica
            correcta: true
            mensaje: |
              Eso es. El clavo no hace trabajo ni cambia la velocidad en ese
              instante; solo acorta el radio. Con $v$ igual y $R$ la mitad,
              $v^{2}/R$ se duplica y la tensión salta de golpe.
          - texto: La velocidad se reduce a la mitad, porque el radio se reduce a la mitad
            mensaje: |
              Eso sería si se conservara el momento angular respecto de un
              punto fijo común, y aquí el centro de giro **cambia** de $O$ a
              $A$. Lo que no cambia es la velocidad, porque el impulso es
              instantáneo y perpendicular.
          - texto: La tensión no cambia, porque la masa y el ángulo son los mismos
            mensaje: |
              La tensión no depende solo del ángulo: también del radio, a
              través de $m v^{2}/R$. Al mitad de radio, ese término se dobla y
              la tensión pasa de $1{,}5mg$ a $2{,}5mg$.
      - tipo: calcular
        titulo: La tensión justo antes de tocar el clavo
        pregunta: |
          Justo antes de que la cuerda toque $A$, ¿cuánto vale la tensión, en
          múltiplos de $m\,g$?
        respuesta:
          tipo: numero
          valor: '1.5'
          tolerancia: 0.02
          formato: un número, en múltiplos de mg
        distractores:
          - valor: '0.5'
            mensaje: |
              Has puesto la cuerda en equilibrio,
              $T = m g\operatorname{sen}30^{\circ}$. La partícula gira, así
              que hace falta además la fuerza centrípeta $m v^{2}/R$.
          - valor: '1'
            mensaje: |
              Ese es solo el término centrípeto, $m v^{2}/R = 2mg\operatorname{sen}30^{\circ}$.
              Falta la componente del peso a lo largo de la cuerda.
          - valor: '3'
            mensaje: |
              Has tomado la caída como $R$ entera. Cuando la cuerda llega a la
              recta $OA$ la partícula ha bajado solo
              $R\operatorname{sen}30^{\circ} = 0{,}4$ m, no $0{,}8$ m.
        pista: |
          Energía: $v_1^{2} = 2gR\operatorname{sen}30^{\circ}$. Después,
          $T - m g\operatorname{sen}30^{\circ} = m v_1^{2}/R$.
        desarrollo: |
          $$
          T = m g\operatorname{sen}30^{\circ} + \frac{m \cdot 2gR\operatorname{sen}30^{\circ}}{R}
          = m g\left(0{,}5 + 1\right) = 1{,}5\,m\,g
          $$
      - tipo: calcular
        titulo: La tensión justo después
        pregunta: |
          Inmediatamente después de que la cuerda apoye en $A$, ¿cuánto vale la
          tensión, en múltiplos de $m\,g$?
        respuesta:
          tipo: numero
          valor: '2.5'
          tolerancia: 0.02
          formato: un número, en múltiplos de mg
        distractores:
          - valor: '1.5'
            mensaje: |
              Ese es el valor de antes. El radio ha pasado de $R$ a $R/2$, así
              que el término centrípeto se duplica y la tensión sube.
          - valor: '2'
            mensaje: |
              Ese es solo el término centrípeto con el radio nuevo,
              $m v^{2}/(R/2) = 2mg$. Falta sumar la componente del peso,
              $m g\operatorname{sen}30^{\circ}$.
          - valor: '3.5'
            mensaje: |
              Has duplicado también la componente del peso. El peso no cambia
              al tocar el clavo, y sigue proyectando
              $m g\operatorname{sen}30^{\circ}$ sobre la cuerda.
        pista: |
          La velocidad es la misma; el radio es ahora $R/2 = 0{,}4$ m.
        desarrollo: |
          $$
          T = m g\operatorname{sen}30^{\circ} + \frac{m v_1^{2}}{R/2}
          = m g\left(0{,}5 + 2\right) = 2{,}5\,m\,g
          $$
      - tipo: calcular
        titulo: La velocidad con la cuerda vertical
        pregunta: |
          Cuando $\theta = 90^{\circ}$, es decir con el tramo $AB$ vertical,
          ¿cuál es la velocidad de la partícula?
        respuesta:
          tipo: magnitud
          valor: '3.431 m/s'
          formato: una velocidad, con su unidad
        distractores:
          - valor: '3.962 m/s'
            mensaje: |
              Has tomado la caída total como $R = 0{,}8$ m. La partícula queda
              $0{,}5R$ por debajo de $A$, y $A$ está $0{,}5R\operatorname{sen}30^{\circ}$
              por debajo de $O$: en total $0{,}6$ m.
          - valor: '2.801 m/s'
            mensaje: |
              Has contado solo los $0{,}4$ m que baja colgando de $A$, sin la
              bajada previa hasta la altura del clavo.
          - valor: '2.426 m/s'
            mensaje: |
              Esa es la velocidad justo antes de tocar el clavo, con
              $v^{2} = 2gR\operatorname{sen}30^{\circ}$. Después la partícula
              sigue bajando otros $0{,}2$ m.
        pista: |
          Desde la salida, la partícula baja
          $h = 0{,}5R + 0{,}5R\operatorname{sen}30^{\circ} = 0{,}6$ m, y
          $v = \sqrt{2gh}$.
        desarrollo: |
          $$
          h = 0{,}5 \cdot 0{,}8 + 0{,}5 \cdot 0{,}8 \cdot 0{,}5 = 0{,}6\ \text{m}
          $$

          $$
          v = \sqrt{2 \cdot 9{,}81 \cdot 0{,}6} = \sqrt{11{,}772} = 3{,}431\ \text{m/s}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'La cuerda no trabaja y no hay rozamiento, así que $v^{2} = 2gh$ en cualquier posición, con $h$ la bajada desde la horizontal.'
          - texto: 'Al llegar a la recta OA la partícula ha bajado $R\operatorname{sen}30^{\circ}$, y $T = mg\operatorname{sen}30^{\circ} + mv^{2}/R = 1{,}5mg$.'
          - texto: 'El clavo no cambia la velocidad pero reduce el radio a $R/2$, así que $T$ pasa a $mg\operatorname{sen}30^{\circ} + mv^{2}/(R/2) = 2{,}5mg$.'
          - texto: 'Como la cuerda pasa siempre por O, el momento angular respecto de O se conserva y $v$ se puede sacar de $m r v$ constante.'
            trampa: true
            mensaje: |
              La tensión sí pasa por $O$ mientras gira alrededor de $O$, pero
              el **peso** no: su momento respecto de $O$ no es nulo, y es
              justamente lo que acelera la partícula. El momento angular no se
              conserva aquí.
    resolucion: |
      **El planteamiento.** La cuerda no trabaja —es perpendicular a la
      velocidad— y no hay rozamiento, así que en cualquier posición
      $v^{2} = 2gh$, con $h$ lo que la partícula ha bajado desde la horizontal
      de salida. Con $R = 0{,}8$ m y el clavo $A$ a $0{,}4$ m de $O$ sobre una
      recta a $30^{\circ}$ por debajo de la horizontal.

      **a) Justo antes de tocar A.** La cuerda está alineada con $OA$, así que
      la partícula ha bajado $h_1 = R\operatorname{sen}30^{\circ} = 0{,}4$ m y
      $v_1^{2} = 2gR\operatorname{sen}30^{\circ}$. En la dirección de la
      cuerda:

      $$
      T - m g\operatorname{sen}30^{\circ} = \frac{m v_1^{2}}{R}
      \;\Longrightarrow\;
      T = m g\left(\operatorname{sen}30^{\circ} + 2\operatorname{sen}30^{\circ}\right) = 1{,}5\,m\,g
      $$

      **b) Inmediatamente después.** La velocidad no ha cambiado, pero el radio
      de giro es ahora $R/2 = 0{,}4$ m:

      $$
      T = m g\operatorname{sen}30^{\circ} + \frac{m v_1^{2}}{R/2}
      = m g\left(0{,}5 + 4 \cdot 0{,}5\right) = 2{,}5\,m\,g
      $$

      **c) Con la cuerda vertical.** El clavo está
      $0{,}5R\operatorname{sen}30^{\circ} = 0{,}2$ m por debajo de $O$, y la
      partícula cuelga $0{,}5R = 0{,}4$ m por debajo del clavo:

      $$
      h_3 = 0{,}2 + 0{,}4 = 0{,}6\ \text{m}
      \qquad
      v_3 = \sqrt{2 \cdot 9{,}81 \cdot 0{,}6} = 3{,}431\ \text{m/s}
      $$

      Los tres coinciden con lo publicado: $1{,}5mg$, $2{,}5mg$ y
      $3{,}43\ \text{m}\cdot\text{s}^{-1}$.
  - id: ejma9-col910-los-dos-bloques-y-la-fuerza-f
    titulo: Dos bloques apilados en un plano inclinado con rozamiento
    fuente: >-
      Ejercicio 9.10 · Tema 9, «Magnitudes y teoremas fundamentales de la
      dinámica» · Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección
      publica los tres resultados y el curso publica su resolución; contra los
      dos está contrastado este desarrollo.
    nivel: practica
    enunciado: |
      En el instante $t = 0$ los bloques $A$ y $B$ están en reposo. Calcular:

      a. Las aceleraciones de $A$ y $B$ en cualquier instante.

      b. Distancia recorrida por el bloque $A$ sobre el bloque $B$, después de
      que el bloque $A$ haya recorrido 0,2 m sobre el plano inclinado.

      Datos: $m_A = 20\ \text{kg}$, $m_B = 30\ \text{kg}$, $F = 500\ \text{N}$,
      $\mu_{A-B} = 0{,}4$, $\mu_{B-plano} = 0{,}1$.

      <figure>
      <svg viewBox="0 0 340 190" role="img" width="340" height="190" aria-labelledby="ejma9-col910-t ejma9-col910-d">
        <title id="ejma9-col910-t">Los bloques A y B apilados sobre el plano inclinado 10 grados, con la fuerza F sobre A</title>
        <desc id="ejma9-col910-d">Un plano inclinado 10 grados que sube hacia la derecha. Sobre él descansa el bloque B, y encima de B, más a la derecha, el bloque A. Una flecha marcada F empuja al bloque A paralelamente al plano y hacia abajo de la pendiente. Dibujo a escala.</desc>
        <defs>
          <marker id="ejma9-col910-f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
        </defs>
        <polygon points="30,160 300,160 300,112.4" fill="var(--faint)" fill-opacity="0.15" stroke="var(--ink)" stroke-width="1.3"/>
        <polygon points="89.1,149.6 217.1,127.0 221.6,101.4 93.6,124.0" fill="var(--faint)" fill-opacity="0.2" stroke="var(--ink)" stroke-width="1.4"/>
        <polygon points="162.5,111.8 231.5,99.7 236.7,69.9 167.7,82.0" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.4"/>
        <text x="155" y="120" font-size="12" text-anchor="middle" fill="var(--ink)">B</text>
        <text x="199" y="93" font-size="12" text-anchor="middle" fill="var(--ink)">A</text>
        <line x1="292" y1="58" x2="244" y2="66.5" stroke="var(--flag)" stroke-width="1.8" marker-end="url(#ejma9-col910-f)"/>
        <text x="298" y="54" font-size="12" fill="var(--flag)">F</text>
        <path d="M80 160 A 50 50 0 0 0 79.2 151.3" fill="none" stroke="var(--faint)" stroke-width="1" stroke-dasharray="3 2"/>
        <text x="86" y="156" font-size="11" fill="var(--ink)">10º</text>
      </svg>
      </figure>
    pide: Las aceleraciones de A y de B y el desplazamiento de A sobre B.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuánto vale la normal entre $A$ y $B$, y cuánto la de $B$ contra el
          plano?
        opciones:
          - texto: 'La primera, $m_A g\cos 10^{\circ}$; la segunda, esa más $m_B g\cos 10^{\circ}$, porque B soporta también el peso de A'
            correcta: true
            mensaje: |
              Eso es. Ninguno de los dos despega del plano, así que en la
              dirección perpendicular no hay aceleración y las normales salen
              del equilibrio, acumulándose de arriba abajo.
          - texto: Las dos valen lo mismo, porque los bloques se mueven juntos
            mensaje: |
              No se mueven juntos —$A$ desliza sobre $B$— y, aunque lo
              hicieran, la normal del suelo tendría que soportar los dos
              pesos, no solo el de $B$.
          - texto: 'La primera, $m_A g$; la segunda, $(m_A+m_B) g$, porque la normal equilibra el peso'
            mensaje: |
              La normal equilibra solo la **componente perpendicular** del
              peso. En un plano a $10^{\circ}$ eso es $m g\cos 10^{\circ}$, y
              la componente que queda a lo largo del plano es la que empuja.
      - tipo: calcular
        titulo: La aceleración del bloque A
        pregunta: |
          ¿Cuánto vale la aceleración de $A$ a lo largo del plano?
        respuesta:
          tipo: magnitud
          valor: '22.84 m/s^2'
          formato: una aceleración, con su unidad
        distractores:
          - valor: '25 m/s^2'
            mensaje: |
              Has usado solo $F/m_A$. Sobre $A$ actúan además la componente de
              su peso, a favor, y el rozamiento con $B$, en contra.
          - valor: '26.71 m/s^2'
            mensaje: |
              Te has dejado el rozamiento entre $A$ y $B$, que con
              $\mu = 0{,}4$ y $N_{AB} = 193{,}3$ N son 77,3 N en contra, casi
              cuatro metros por segundo al cuadrado.
          - valor: '10 m/s^2'
            mensaje: |
              Has repartido la fuerza entre las dos masas,
              $F/(m_A+m_B)$. Los bloques no se mueven juntos: $A$ desliza
              sobre $B$ y cada uno tiene su ecuación.
        pista: |
          $F + m_A g\operatorname{sen}10^{\circ} - \mu_{AB} N_{AB} = m_A a_A$
          con $N_{AB} = m_A g\cos 10^{\circ} = 193{,}3$ N.
        desarrollo: |
          $$
          a_A = \frac{500 + 34{,}07 - 77{,}31}{20} = \frac{456{,}76}{20} = 22{,}84\ \text{m/s}^{2}
          $$
      - tipo: calcular
        titulo: La aceleración del bloque B
        pregunta: |
          ¿Y la de $B$?
        respuesta:
          tipo: magnitud
          valor: '2.670 m/s^2'
          formato: una aceleración, con su unidad
        distractores:
          - valor: '22.84 m/s^2'
            mensaje: |
              Esa es la de $A$. $B$ no recibe la fuerza $F$; solo lo arrastra
              el rozamiento que $A$ le hace encima, y lo frena el del plano.
          - valor: '4.28 m/s^2'
            mensaje: |
              Te has dejado el rozamiento de $B$ contra el plano. Con
              $N_{BP} = 483{,}2$ N y $\mu = 0{,}1$ son 48,3 N en contra.
          - valor: '1.094 m/s^2'
            mensaje: |
              Has olvidado que el rozamiento de $A$ sobre $B$ **arrastra** a
              $B$ hacia abajo del plano. $A$ desliza hacia abajo respecto de
              $B$, así que le hace un rozamiento hacia abajo de 77,3 N.
        pista: |
          $m_B g\operatorname{sen}10^{\circ} + \mu_{AB}N_{AB} - \mu_{BP}N_{BP} = m_B a_B$,
          con $N_{BP} = N_{AB} + m_B g\cos 10^{\circ} = 483{,}2$ N.
        desarrollo: |
          $$
          a_B = \frac{51{,}10 + 77{,}31 - 48{,}32}{30} = \frac{80{,}10}{30} = 2{,}670\ \text{m/s}^{2}
          $$
      - tipo: calcular
        titulo: Lo que A avanza sobre B
        pregunta: |
          Cuando $A$ ha recorrido 0,2 m sobre el plano, ¿cuánto ha recorrido
          sobre $B$?
        respuesta:
          tipo: magnitud
          valor: '0.1766 m'
          formato: una longitud, con su unidad
        distractores:
          - valor: '0.2 m'
            mensaje: |
              Eso sería si $B$ estuviera quieto, y $B$ también acelera:
              $2{,}67\ \text{m/s}^{2}$. Hay que restar lo que $B$ ha avanzado
              en ese mismo tiempo.
          - valor: '0.0234 m'
            mensaje: |
              Eso es lo que recorre $B$, no lo que $A$ recorre **sobre** $B$.
              El desplazamiento relativo es la diferencia,
              $0{,}2 - 0{,}0234$.
        pista: |
          Las dos aceleraciones son constantes, así que en el mismo tiempo
          $x_B/x_A = a_B/a_A$ y $x_{A/B} = x_A\left(1 - a_B/a_A\right)$.
        desarrollo: |
          $$
          x_{A/B} = x_A\left(1 - \frac{a_B}{a_A}\right)
          = 0{,}2\left(1 - \frac{2{,}670}{22{,}84}\right) = 0{,}2 \cdot 0{,}8831 = 0{,}1766\ \text{m}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Perpendicularmente al plano no hay aceleración: $N_{AB} = m_A g\cos 10^{\circ} = 193{,}3$ N y $N_{BP} = N_{AB} + m_B g\cos 10^{\circ} = 483{,}2$ N.'
          - texto: 'Para A, $F + m_A g\operatorname{sen}10^{\circ} - \mu_{AB}N_{AB} = m_A a_A$, y sale $a_A = 22{,}84\ \text{m/s}^{2}$.'
          - texto: 'Para B, el rozamiento de A lo arrastra y el del plano lo frena, y sale $a_B = 2{,}67\ \text{m/s}^{2}$; como las dos son constantes, $x_{A/B} = x_A(1-a_B/a_A) = 0{,}177$ m.'
          - texto: 'Como A y B están en contacto y ninguno se despega, tienen la misma aceleración y se pueden tratar como un solo cuerpo de 50 kg.'
            trampa: true
            mensaje: |
              Estar en contacto no obliga a moverse igual: entre $A$ y $B$ hay
              deslizamiento, y por eso el enunciado pregunta justo cuánto se
              desplaza uno sobre el otro. Tratarlos como uno daría
              $10\ \text{m/s}^{2}$ para los dos y el apartado b no tendría
              respuesta.
    resolucion: |
      **Las normales.** Ninguno de los dos bloques se despega, así que en la
      dirección perpendicular al plano la aceleración es nula:

      $$
      N_{AB} = m_A\,g\cos 10^{\circ} = 193{,}28\ \text{N}
      \qquad
      N_{BP} = N_{AB} + m_B\,g\cos 10^{\circ} = 483{,}20\ \text{N}
      $$

      **a) Aceleración de A.** La fuerza $F$ empuja hacia abajo del plano, la
      componente del peso también, y el rozamiento con $B$ se opone:

      $$
      a_A = \frac{F + m_A g\operatorname{sen}10^{\circ} - \mu_{AB}N_{AB}}{m_A}
      = \frac{500 + 34{,}07 - 77{,}31}{20} = 22{,}84\ \text{m/s}^{2}
      $$

      **Aceleración de B.** $A$ desliza hacia abajo respecto de $B$, así que le
      hace un rozamiento hacia abajo del plano; el suelo lo frena:

      $$
      a_B = \frac{m_B g\operatorname{sen}10^{\circ} + \mu_{AB}N_{AB} - \mu_{BP}N_{BP}}{m_B}
      = \frac{51{,}10 + 77{,}31 - 48{,}32}{30} = 2{,}670\ \text{m/s}^{2}
      $$

      Las dos son constantes, lo que responde al «en cualquier instante» del
      enunciado.

      **b) Desplazamiento relativo.** Partiendo los dos del reposo y con
      aceleración constante, $x = \tfrac12 a t^{2}$, así que
      $x_B = x_A\,a_B/a_A$:

      $$
      x_{A/B} = x_A - x_B = x_A\left(1 - \frac{a_B}{a_A}\right) = 0{,}2 \cdot 0{,}8831 = 0{,}1766\ \text{m}
      $$

      Los resultados publicados son $a_A = 22{,}8\ \text{m/s}^{2}$,
      $a_B = 2{,}67\ \text{m/s}^{2}$ y $x_{A/B} = 0{,}177$ m.

  - id: ejma9-col911-la-soga-doblada-que-se-suelta
    titulo: La soga doblada cuyo extremo libre se suelta
    fuente: >-
      Ejercicio 9.11 · Tema 9, «Magnitudes y teoremas fundamentales de la
      dinámica» · Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección
      publica la fórmula del resultado y el curso publica su resolución; contra
      los dos está contrastado este desarrollo. Como la respuesta es simbólica,
      las casillas piden el valor numérico con los datos de prueba que se
      declaran en cada pregunta, y un coeficiente adimensional.
    nivel: practica
    enunciado: |
      El extremo libre de una soga se suelta del reposo en la situación a).
      Determinar la velocidad $v$ del trozo de soga móvil en función de $y$ en
      la situación b). ¿Qué sucede en la situación c) cuando $y = L$?

      <figure>
      <svg viewBox="0 0 380 215" role="img" width="380" height="215" aria-labelledby="ejma9-col911-t ejma9-col911-d">
        <title id="ejma9-col911-t">Las tres situaciones de la soga doblada colgada de un soporte</title>
        <desc id="ejma9-col911-d">Tres dibujos. En a) la soga cuelga doblada por la mitad de un soporte fijo, con los dos ramales de longitud L partido por dos. En b) el extremo libre ha caído una distancia y, de modo que el ramal móvil es más corto y el fijo, más largo. En c) el extremo libre ha caído toda la longitud L y la soga queda en un solo ramal recto de longitud L. Dibujo a escala, con y igual a cuatro décimas de L en el caso b.</desc>
        <defs>
          <marker id="ejma9-col911-c" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--faint)"/>
          </marker>
          <marker id="ejma9-col911-c2" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M8 0 L0 4 L8 8 z" fill="var(--faint)"/>
          </marker>
        </defs>
        <rect x="38" y="22" width="52" height="10" fill="var(--faint)" fill-opacity="0.3" stroke="var(--faint)" stroke-width="0.8"/>
        <path d="M44 22 L36 14 M58 22 L50 14 M72 22 L64 14 M86 22 L78 14" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <polygon points="52,32 76,32 64,44" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/>
        <path d="M57 40 L57 108 A 7 7 0 0 0 71 108 L71 40" fill="none" stroke="var(--ink)" stroke-width="1.6"/>
        <line x1="92" y1="40" x2="92" y2="110" stroke="var(--faint)" stroke-width="0.9" marker-end="url(#ejma9-col911-c)" marker-start="url(#ejma9-col911-c2)"/>
        <text x="98" y="79" font-size="11" fill="var(--faint)">L/2</text>
        <text x="42" y="16" font-size="11" fill="var(--ink)">a)</text>

        <rect x="164" y="22" width="52" height="10" fill="var(--faint)" fill-opacity="0.3" stroke="var(--faint)" stroke-width="0.8"/>
        <path d="M170 22 L162 14 M184 22 L176 14 M198 22 L190 14 M212 22 L204 14" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <polygon points="178,32 202,32 190,44" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/>
        <path d="M197 40 L197 136 A 7 7 0 0 1 183 136 L183 96" fill="none" stroke="var(--ink)" stroke-width="1.6"/>
        <line x1="160" y1="40" x2="160" y2="96" stroke="var(--faint)" stroke-width="0.9" marker-end="url(#ejma9-col911-c)" marker-start="url(#ejma9-col911-c2)"/>
        <text x="150" y="72" font-size="11" text-anchor="end" fill="var(--faint)">y</text>
        <text x="168" y="16" font-size="11" fill="var(--ink)">b)</text>

        <rect x="284" y="22" width="52" height="10" fill="var(--faint)" fill-opacity="0.3" stroke="var(--faint)" stroke-width="0.8"/>
        <path d="M290 22 L282 14 M304 22 L296 14 M318 22 L310 14 M332 22 L324 14" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <polygon points="298,32 322,32 310,44" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/>
        <line x1="310" y1="40" x2="310" y2="180" stroke="var(--ink)" stroke-width="1.6"/>
        <line x1="336" y1="40" x2="336" y2="180" stroke="var(--faint)" stroke-width="0.9" marker-end="url(#ejma9-col911-c)" marker-start="url(#ejma9-col911-c2)"/>
        <text x="342" y="114" font-size="11" fill="var(--faint)">L</text>
        <text x="288" y="16" font-size="11" fill="var(--ink)">c)</text>
      </svg>
      </figure>
    pide: La velocidad del trozo móvil en función de y, y qué ocurre cuando y vale L.
    pasos:
      - tipo: reconocer
        pregunta: |
          En la situación b), ¿qué parte de la soga se mueve y qué longitud
          tiene?
        opciones:
          - texto: 'El ramal del extremo libre, de longitud $(L-y)/2$: el otro cuelga del punto fijo y está en reposo'
            correcta: true
            mensaje: |
              Eso es. El extremo libre ha bajado $y$, así que el pliegue ha
              bajado $y/2$: el ramal libre mide $(L-y)/2$ y se mueve entero
              con velocidad $v$, y el otro, $(L+y)/2$, está quieto.
          - texto: Toda la soga, porque es un solo cuerpo
            mensaje: |
              El ramal que cuelga del punto fijo no se mueve: la soga se va
              transfiriendo de un ramal al otro a través del pliegue. Solo el
              ramal libre lleva velocidad.
          - texto: 'El ramal del extremo libre, de longitud $(L+y)/2$, que es el que crece'
            mensaje: |
              Has cambiado los dos. El que crece es el fijo; el libre se
              acorta a medida que la soga pasa por el pliegue, y por eso al
              final, con $y = L$, ya no queda nada moviéndose.
      - tipo: calcular
        titulo: La velocidad con unos valores de prueba
        pregunta: |
          Con los valores de prueba $L = 2\ \text{m}$, $y = 1\ \text{m}$ y
          $g = 9{,}81\ \text{m/s}^{2}$, ¿cuánto vale $v$?
        respuesta:
          tipo: magnitud
          valor: '5.425 m/s'
          formato: una velocidad, con su unidad
        distractores:
          - valor: '4.429 m/s'
            mensaje: |
              Has usado $v = \sqrt{2gy}$, la caída libre. La soga no cae
              libre: parte de ella se queda quieta y el reparto de masas
              cambia con $y$, lo que añade el factor
              $(L-0{,}5y)/(L-y)$.
          - valor: '3.132 m/s'
            mensaje: |
              Has tomado el descenso del centro de gravedad como $y/2$ sin
              corregir por la masa que se mueve. La energía liberada se la
              lleva **solo** el ramal móvil, que pesa menos que la soga
              entera.
          - valor: '7.673 m/s'
            mensaje: |
              Has invertido la fracción, usando $(L-y)/(L-0{,}5y)$. El
              denominador es la longitud del tramo móvil, y ese es el que
              lleva $L-y$.
        pista: |
          $v = \sqrt{2gy\,\dfrac{L-0{,}5y}{L-y}}$. Con $L=2$ e $y=1$, la
          fracción vale $1{,}5$.
        desarrollo: |
          $$
          v = \sqrt{2 \cdot 9{,}81 \cdot 1 \cdot \frac{2 - 0{,}5}{2 - 1}}
          = \sqrt{29{,}43} = 5{,}425\ \text{m/s}
          $$
      - tipo: calcular
        titulo: El coeficiente en la mitad del recorrido
        pregunta: |
          Escribiendo la velocidad en $y = L/2$ como $v = k\sqrt{g\,L}$,
          ¿cuánto vale el coeficiente $k$?
        respuesta:
          tipo: numero
          valor: '1.2247'
          tolerancia: 0.005
          formato: un número, sin unidades
        distractores:
          - valor: '1'
            mensaje: |
              Has tomado $v^{2} = gL$, que es lo que saldría de caída libre
              con $y = L/2$. El factor $(L-0{,}5y)/(L-y)$ vale aquí $1{,}5$,
              no 1.
          - valor: '1.5'
            mensaje: |
              Ese es $v^{2}/(gL)$, no $v/\sqrt{gL}$. Falta la raíz cuadrada.
          - valor: '0.7071'
            mensaje: |
              Has dejado $v^{2} = gL/2$, olvidando el factor 2 de
              $2gy$ o el $(L-0{,}5y)/(L-y)$.
        pista: |
          Sustituye $y = L/2$ en $v^{2} = 2gy(L-0{,}5y)/(L-y)$ y verás que
          todas las $L$ se simplifican menos una.
        desarrollo: |
          $$
          v^{2} = 2g\,\frac{L}{2}\cdot\frac{L - L/4}{L - L/2} = g\,L\,\frac{3/4}{1/2} = 1{,}5\,g\,L
          $$

          $$
          k = \sqrt{1{,}5} = 1{,}2247
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Con densidad lineal $\lambda = m/L$, el ramal móvil mide $(L-y)/2$ y el fijo, $(L+y)/2$.'
          - texto: 'Sumando las energías potenciales de los dos ramales, la energía liberada al pasar de $y=0$ a $y$ vale $\lambda g\,\dfrac{y}{2}\left(L-\dfrac{y}{2}\right)$.'
          - texto: 'Toda esa energía se la lleva el ramal móvil, $\tfrac12\lambda\dfrac{L-y}{2}v^{2}$, y despejando sale $v = \sqrt{2gy\,\dfrac{L-0{,}5y}{L-y}}$.'
          - texto: 'Cuando $y = L$ la fórmula da infinito, lo que significa que la soga alcanza la velocidad de la luz.'
            trampa: true
            mensaje: |
              Lo que dice la fórmula es que la masa que queda moviéndose tiende
              a cero mientras la energía liberada es finita. Es el límite del
              modelo —soga ideal, perfectamente flexible e inextensible—, no
              una predicción física: en $y=L$ no queda ningún trozo móvil.
    resolucion: |
      **Las dos partes.** Llamando $\lambda = m/L$ a la densidad lineal y $y$ a
      lo que ha bajado el extremo libre, el pliegue ha bajado $y/2$, así que

      $$
      L_1 = \frac{L-y}{2} \quad \text{(móvil)}
      \qquad
      L_2 = \frac{L+y}{2} \quad \text{(en reposo)}
      $$

      **Las alturas de los centros de gravedad**, medidas desde el nivel
      situado a profundidad $L$ bajo el soporte:

      $$
      h_1 = \frac{3}{4}(L-y)
      \qquad
      h_2 = \frac{3L-y}{4}
      $$

      **La energía potencial total.**

      $$
      V_g = \lambda g\,\frac{3L^{2} - 2Ly + y^{2}}{4}
      \;\Longrightarrow\;
      V_g(0) - V_g(y) = \lambda g\,\frac{y}{2}\left(L - \frac{y}{2}\right)
      $$

      **El teorema de la energía.** Solo el ramal móvil tiene energía cinética,
      y todo él se mueve con la velocidad $v$ del extremo libre:

      $$
      \tfrac12\,\lambda\,\frac{L-y}{2}\,v^{2} = \lambda g\,\frac{y}{2}\left(L-\frac{y}{2}\right)
      $$

      $$
      v = \sqrt{2\,g\,y\,\frac{L - 0{,}5y}{L - y}}
      $$

      que es la expresión publicada.

      **Y en c), con $y = L$.** El ramal móvil mide $L_1 = 0$: no queda nada
      moviéndose, toda la soga está en el ramal fijo y en reposo. La fórmula
      diverge porque la masa en movimiento tiende a cero mientras la energía
      liberada es finita; es el límite del modelo de soga ideal, y en la
      práctica es donde el último trozo da el latigazo.

      Comprobación: recalculando la energía potencial completa desde cero para
      $(L,y)$ iguales a $(2;1)$, $(1;0{,}5)$ y $(3;2)$, la velocidad coincide
      con la fórmula en las tres hasta la novena cifra.

  - id: ejma9-col912-el-avion-que-despega
    titulo: La pista y el tiempo que necesita un avión con resistencia cuadrática
    fuente: >-
      Ejercicio 9.12 · Tema 9, «Magnitudes y teoremas fundamentales de la
      dinámica» · Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección
      publica los dos resultados y el curso publica su resolución; contra los
      dos está contrastado este desarrollo.
    nivel: practica
    enunciado: |
      Los motores de un avión de masa $25\cdot 10^{3}$ kg le provocan una
      empuje de 40 kN. La fuerza de resistencia del aire tiene un módulo
      $D = 2{,}25v^{2}$, siendo $v$ (m/s) y $D$ (N). Si el avión empieza el
      vuelo con 240 km/h:

      a. ¿Qué longitud de la pista de aterrizaje será necesaria?

      b. ¿Cuánto tiempo necesitará para despegar?
    pide: La longitud de pista y el tiempo hasta alcanzar los 240 km/h.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué no vale aquí la fórmula $v^{2} = 2\,a\,x$ del movimiento
          uniformemente acelerado?
        opciones:
          - texto: Porque la resistencia crece con la velocidad, así que la aceleración no es constante y hay que integrar
            correcta: true
            mensaje: |
              Eso es. Con $D = 2{,}25v^{2}$ la fuerza neta va cambiando, de
              40 kN al arrancar a 30 kN al final, y con ella la aceleración.
              Hay que separar variables.
          - texto: Porque el avión no parte del reposo
            mensaje: |
              Sí parte del reposo: los 240 km/h son la velocidad de despegue,
              la que alcanza al final de la pista. Lo que impide usar la
              fórmula es que la aceleración cambia.
          - texto: Porque hay que usar la conservación de la energía en su lugar
            mensaje: |
              La resistencia del aire no es conservativa, así que no hay
              energía mecánica que conservar. Lo que sí vale es el teorema de
              la energía con el trabajo de la resistencia, que es justo la
              integral que hay que hacer.
      - tipo: calcular
        titulo: La longitud de pista
        pregunta: |
          ¿Qué longitud de pista necesita el avión para alcanzar los 240 km/h?
        respuesta:
          tipo: magnitud
          valor: '1598 m'
          formato: una longitud, con su unidad
        distractores:
          - valor: '1389 m'
            mensaje: |
              Has ignorado la resistencia del aire y usado $a = F/m = 1{,}6$
              m/s² constante. Sale una pista más corta, porque en realidad la
              resistencia va comiéndose el empuje.
          - valor: '1852 m'
            mensaje: |
              Has tomado la resistencia constante e igual a la del final,
              $2{,}25 \cdot 66{,}67^{2} = 10$ kN. Al principio la resistencia
              es nula, así que esa hipótesis alarga la pista de más.
        pista: |
          $F - K v^{2} = m\,v\,\dfrac{dv}{dx}$, y separando variables sale
          $x = \dfrac{m}{2K}\ln\dfrac{1}{1 - Kv^{2}/F}$.
        desarrollo: |
          Con $v = 240/3{,}6 = 66{,}667$ m/s, $Kv^{2}/F = 0{,}25$:

          $$
          x = \frac{25000}{2 \cdot 2{,}25}\,\ln\frac{1}{1-0{,}25}
          = 5555{,}6 \cdot 0{,}28768 = 1598{,}2\ \text{m}
          $$
      - tipo: calcular
        titulo: El tiempo de carrera
        pregunta: |
          ¿Cuánto tiempo tarda en alcanzar esa velocidad?
        respuesta:
          tipo: magnitud
          valor: '45.78 s'
          formato: un tiempo, con su unidad
        distractores:
          - valor: '41.67 s'
            mensaje: |
              Es $v/a$ con $a = F/m = 1{,}6$ m/s², o sea ignorando la
              resistencia. Con ella el avión tarda más.
          - valor: '55.56 s'
            mensaje: |
              Has usado la resistencia del final como si fuera constante,
              $a = (40-10)/25 = 1{,}2$ m/s². Esa hipótesis penaliza de más el
              arranque, donde la resistencia es casi nula.
          - valor: '47.95 s'
            mensaje: |
              Has dividido la distancia entre la velocidad media aritmética,
              $1598/33{,}3$. Con aceleración variable la velocidad media no es
              la mitad de la final.
        pista: |
          $F - K v^{2} = m\,\dfrac{dv}{dt}$ y la integral es la de la
          arcotangente hiperbólica: con $v_{\lim} = \sqrt{F/K} = 133{,}33$
          m/s, $t = \dfrac{m}{2\sqrt{FK}}\ln\dfrac{v_{\lim}+v}{v_{\lim}-v}$.
        desarrollo: |
          $$
          t = \frac{25000}{2\sqrt{40000 \cdot 2{,}25}}\,\ln\frac{133{,}33+66{,}67}{133{,}33-66{,}67}
          = \frac{25000}{600}\,\ln 3 = 45{,}78\ \text{s}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'La fuerza neta es $F - Kv^{2}$ con $K = 2{,}25$, así que la aceleración no es constante y hay que integrar.'
          - texto: 'Para la distancia se escribe $a = v\,dv/dx$, y la integral da $x = \dfrac{m}{2K}\ln\dfrac{1}{1-Kv^{2}/F} = 1598$ m.'
          - texto: 'Para el tiempo se escribe $a = dv/dt$, y la integral da $t = 45{,}8$ s.'
          - texto: 'Como ya se conoce la distancia y la velocidad final, el tiempo es $t = 2x/v = 47{,}9$ s.'
            trampa: true
            mensaje: |
              $t = 2x/v$ supone velocidad media igual a la mitad de la final,
              que solo vale con aceleración **constante**. Aquí el avión
              acelera más al principio, así que gana velocidad antes y el
              tiempo real es menor, 45,8 s.
    resolucion: |
      **Por qué hay que integrar.** La fuerza neta a lo largo de la pista es
      $F - K v^{2}$, con $F = 40$ kN y $K = 2{,}25$. Cambia con la velocidad,
      así que la aceleración no es constante y no valen las fórmulas del
      movimiento uniformemente acelerado. La velocidad de despegue es
      $v = 240/3{,}6 = 66{,}667$ m/s.

      **a) La distancia.** Con $a = v\,dv/dx$:

      $$
      m\,v\,\frac{dv}{dx} = F - K v^{2}
      \;\Longrightarrow\;
      x = \frac{m}{2K}\ln\frac{F}{F-Kv^{2}}
      $$

      $$
      x = \frac{25000}{4{,}5}\,\ln\frac{40000}{30000} = 5555{,}6 \cdot 0{,}28768 = 1598{,}2\ \text{m}
      $$

      **b) El tiempo.** Con $a = dv/dt$ y
      $v_{\lim} = \sqrt{F/K} = 133{,}33$ m/s:

      $$
      m\,\frac{dv}{dt} = F - Kv^{2}
      \;\Longrightarrow\;
      t = \frac{m}{2\sqrt{FK}}\,\ln\frac{v_{\lim}+v}{v_{\lim}-v}
      = \frac{25000}{600}\,\ln 3 = 45{,}78\ \text{s}
      $$

      Comprobación: integrando numéricamente $m\dot{v} = F - Kv^{2}$ desde el
      reposo, el avión alcanza los 66,667 m/s en 45,776 s tras recorrer
      1598,2 m. Los resultados publicados son 1598 m y 45,8 s.
  - id: ejma9-col913-los-banistas-que-saltan-de-la-barca
    titulo: Los dos bañistas que saltan de la popa de una barca
    fuente: >-
      Ejercicio 9.13 · Tema 9, «Magnitudes y teoremas fundamentales de la
      dinámica» · Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección
      publica los cinco resultados y contra ellos está contrastado este
      desarrollo; los tres casos salen exactos. En la resolución del curso el
      caso a aparece como 1,5 metros por segundo, que no reproduce ningún
      reparto de masas del enunciado, y la hoja de resultados rotula el tercer
      caso como b en lugar de c.
    nivel: practica
    enunciado: |
      Los bañistas $A$ y $B$ tienen unas masas de 75 kg y 50 kg
      respectivamente. Realizan un salto desde la popa de la barca con una
      velocidad relativa respecto de la barca de valor 3 m/s en dirección
      horizontal. Si la barca está en reposo, se pide determinar la velocidad
      final de la barca en los siguientes tres casos:

      a. Los dos bañistas saltan a la vez

      b. Primero salta $A$ y después $B$.

      c. Primero salta $B$ y después $A$
    pide: La velocidad final de la barca en los tres casos, en metros por segundo.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué se conserva durante cada salto, y qué significa que la velocidad
          sea relativa a la barca?
        opciones:
          - texto: El momento lineal horizontal del conjunto, y que la velocidad del bañista respecto del suelo es la de la barca más los 3 m/s
            correcta: true
            mensaje: |
              Eso es. En horizontal no hay fuerzas exteriores —el agua se
              desprecia—, así que $\vec{L}$ se conserva, y hay que escribir
              todas las velocidades respecto del suelo antes de sumarlas.
          - texto: La energía mecánica, porque no hay rozamiento con el agua
            mensaje: |
              Un salto es un impulso hecho con los músculos: se aporta energía
              nueva, que no estaba antes. Lo que no cambia es el momento
              lineal total, porque las fuerzas del salto son internas.
          - texto: El momento lineal, y la velocidad del bañista respecto del suelo es directamente 3 m/s
            mensaje: |
              Los 3 m/s son relativos a la barca, que ya se está moviendo
              hacia el otro lado. Respecto del suelo el bañista va a
              $v_{barca} + 3$, y confundirlos cambia el resultado.
      - tipo: calcular
        titulo: Los dos a la vez
        pregunta: |
          Si los dos bañistas saltan a la vez, ¿qué velocidad final coge la
          barca?
        respuesta:
          tipo: magnitud
          valor: '1.154 m/s'
          formato: una velocidad, con su unidad
        distractores:
          - valor: '1.5 m/s'
            mensaje: |
              Ese valor sale de dividir $(m_A+m_B)v_r$ entre $m_B+m_C = 250$
              kg, y es el que imprime por error la resolución del curso. En el
              denominador va la masa **total** del sistema, 325 kg.
          - valor: '1.875 m/s'
            mensaje: |
              Has dividido entre la masa de la barca sola, 200 kg. Al plantear
              la conservación, los bañistas también llevan cantidad de
              movimiento y su masa entra en el reparto.
          - valor: '3 m/s'
            mensaje: |
              Esa es la velocidad relativa de los bañistas, no la de la barca.
              La barca es mucho más pesada que ellos y retrocede bastante
              menos.
        pista: |
          $0 = (m_A+m_B)(v_C+v_r) + m_C v_C$, con $v_r = 3$ m/s en el sentido
          del salto.
        desarrollo: |
          $$
          v_C = \frac{(m_A+m_B)\,v_r}{m_A+m_B+m_C} = \frac{125 \cdot 3}{325} = 1{,}154\ \text{m/s}
          $$

          en sentido contrario al salto.
      - tipo: calcular
        titulo: Primero A y después B
        pregunta: |
          Si salta primero $A$ y después $B$, ¿con qué velocidad se queda
          finalmente la barca?
        respuesta:
          tipo: magnitud
          valor: '1.292 m/s'
          formato: una velocidad, con su unidad
        distractores:
          - valor: '1.154 m/s'
            mensaje: |
              Has usado la masa inicial, 325 kg, también en el segundo salto.
              Cuando salta $B$, $A$ ya no está a bordo: el sistema pesa 250 kg
              y por eso el segundo salto es más eficaz.
          - valor: '0.692 m/s'
            mensaje: |
              Esa es la velocidad de la barca después del **primer** salto,
              solo con $A$ fuera. Falta aplicar la conservación otra vez para
              el salto de $B$.
          - valor: '1.615 m/s'
            mensaje: |
              Has tomado los 3 m/s de $B$ respecto del suelo en el segundo
              salto. Son relativos a la barca, que ya se mueve a 0,692 m/s en
              sentido contrario.
        pista: |
          Primero $0 = m_A(v_{C1}+v_r) + (m_B+m_C)v_{C1}$; después,
          $(m_B+m_C)v_{C1} = m_B(v_{C2}+v_r) + m_C v_{C2}$.
        desarrollo: |
          $$
          v_{C1} = \frac{75 \cdot 3}{325} = 0{,}692\ \text{m/s}
          \qquad
          v_{C2} = v_{C1} + \frac{50 \cdot 3}{250} = 0{,}692 + 0{,}600
          $$

          $$
          v_{C2} = 1{,}292\ \text{m/s}
          $$
      - tipo: calcular
        titulo: Primero B y después A
        pregunta: |
          Y si salta primero $B$ y después $A$, ¿cuál es la velocidad final de
          la barca?
        respuesta:
          tipo: magnitud
          valor: '1.280 m/s'
          formato: una velocidad, con su unidad
        distractores:
          - valor: '1.154 m/s'
            mensaje: |
              Otra vez la masa inicial en los dos saltos. Al saltar $A$ en
              segundo lugar, a bordo quedan 275 kg y no 325.
          - valor: '0.818 m/s'
            mensaje: |
              Has calculado solo el efecto del salto de $A$ sobre 275 kg,
              olvidando que la barca ya llevaba 0,4615 m/s del salto de $B$.
              Los dos impulsos se suman.
          - valor: '0.461 m/s'
            mensaje: |
              Esa es la velocidad tras el primer salto, el de $B$. Falta el
              segundo.
        pista: |
          $v_{C1} = m_B v_r/(m_A+m_B+m_C)$ y luego
          $v_{C2} = v_{C1} + m_A v_r/(m_A+m_C)$.
        desarrollo: |
          $$
          v_{C1} = \frac{50 \cdot 3}{325} = 0{,}4615\ \text{m/s}
          \qquad
          v_{C2} = 0{,}4615 + \frac{75 \cdot 3}{275} = 0{,}4615 + 0{,}8182
          $$

          $$
          v_{C2} = 1{,}280\ \text{m/s}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'En horizontal no hay fuerzas exteriores, así que en cada salto se conserva el momento lineal del conjunto; las velocidades hay que escribirlas respecto del suelo.'
          - texto: 'Saltando a la vez, $0 = (m_A+m_B)(v_C+v_r) + m_C v_C$ y la barca queda a $1{,}154$ m/s.'
          - texto: 'Por separado la barca queda más rápida —$1{,}292$ m/s si va primero A y $1{,}280$ si va primero B—, porque en el segundo salto la masa que queda a bordo es menor.'
          - texto: 'Como el momento lineal se conserva, la velocidad final de la barca es la misma en los tres casos.'
            trampa: true
            mensaje: |
              Se conserva en **cada** salto, pero el sistema no es el mismo en
              los tres casos: al saltar por separado, el segundo bañista
              empuja una barca más ligera y le saca más velocidad. Por eso
              1,154 frente a 1,292 y 1,280.
    resolucion: |
      **Qué se conserva.** El agua no opone fuerza horizontal apreciable, así
      que en cada salto el momento lineal horizontal del sistema se conserva.
      Con $m_A = 75$, $m_B = 50$, $m_C = 200$ kg y $v_r = 3$ m/s, y tomando
      positivo el sentido del salto.

      **a) Los dos a la vez.**

      $$
      0 = m_A(v_C+v_r) + m_B(v_C+v_r) + m_C v_C
      \;\Longrightarrow\;
      v_C = -\frac{125 \cdot 3}{325} = -1{,}154\ \text{m/s}
      $$

      **b) Primero A, después B.** En el primero el sistema es todo; en el
      segundo, lo que queda a bordo, $m_B+m_C = 250$ kg:

      $$
      v_{C1} = -\frac{75 \cdot 3}{325} = -0{,}692\ \text{m/s}
      \qquad
      v_{C2} = v_{C1} - \frac{50 \cdot 3}{250} = -1{,}292\ \text{m/s}
      $$

      **c) Primero B, después A.** Ahora en el segundo salto quedan
      $m_A+m_C = 275$ kg:

      $$
      v_{C1} = -\frac{50 \cdot 3}{325} = -0{,}4615\ \text{m/s}
      \qquad
      v_{C2} = v_{C1} - \frac{75 \cdot 3}{275} = -1{,}280\ \text{m/s}
      $$

      **Lo que enseña la comparación.** Saltar por separado deja la barca más
      rápida que saltar a la vez, porque el segundo bañista empuja una barca
      aligerada. Y entre los dos órdenes hay apenas un 1 %: sale algo mejor que
      salte primero el pesado, porque así el segundo empujón se reparte entre
      menos masa. Los cinco valores coinciden con los publicados.

  - id: ejma9-col914-el-barco-y-los-dos-remolcadores
    titulo: El barco remolcado y la potencia de los remolcadores
    fuente: >-
      Ejercicio 9.14 · Tema 9, «Magnitudes y teoremas fundamentales de la
      dinámica» · Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección
      publica los dos resultados y el curso publica su resolución; contra los
      dos está contrastado este desarrollo.
    nivel: practica
    enunciado: |
      La fuerza de rozamiento entre un barco y el agua viene dada por la
      siguiente expresión $F = K\cdot v^{1,75}$, donde $k$ es una constante y
      $v$ la velocidad del barco. Un único remolcador puede llemar el barco a
      una velociad de 4,5 km/h, haciendo una fuerza constante de 300 kN.

      Determinar:

      a. Potencia desarrollada por el remolcador

      b. La velocidad del barco, si se unen dos remolcadores de la potencia
      calculada en a).
    pide: La potencia del remolcador y la velocidad con dos remolcadores iguales.
    pasos:
      - tipo: reconocer
        pregunta: |
          Con dos remolcadores de la misma potencia, ¿qué es lo que se duplica
          y qué no?
        opciones:
          - texto: Se duplica la potencia, no la fuerza; la fuerza depende de la nueva velocidad a través de la ley de rozamiento
            correcta: true
            mensaje: |
              Eso es. El dato del apartado b es la **potencia**, así que la
              ecuación a resolver es $2P = K v^{2{,}75}$; la fuerza sale
              después y no es el doble de 300 kN.
          - texto: Se duplica la fuerza, así que la velocidad sale de $2F = Kv^{1,75}$
            mensaje: |
              El enunciado dice «dos remolcadores de la potencia calculada en
              a)», no de la fuerza. A mayor velocidad, un motor de potencia
              dada entrega menos fuerza, y por eso el resultado es menor.
          - texto: Se duplica la velocidad, porque hay el doble de tirón
            mensaje: |
              La resistencia crece con $v^{1{,}75}$, así que doblar la
              velocidad multiplicaría la potencia necesaria por
              $2^{2{,}75} \approx 6{,}7$. Con solo el doble de potencia se
              gana mucho menos.
      - tipo: calcular
        titulo: La potencia del remolcador
        pregunta: |
          ¿Qué potencia desarrolla el único remolcador?
        respuesta:
          tipo: magnitud
          valor: '375 kW'
          formato: una potencia, con su unidad
        distractores:
          - valor: '1350 kW'
            mensaje: |
              Has multiplicado por 4,5 sin pasar a metros por segundo.
              $4{,}5\ \text{km/h} = 1{,}25\ \text{m/s}$.
          - valor: '240 kW'
            mensaje: |
              Has dividido la fuerza entre la velocidad en vez de
              multiplicarlas. La potencia de una fuerza es $P = F\,v$.
        pista: |
          $P = F\,v$ con la velocidad en m/s.
        desarrollo: |
          $$
          v = \frac{4{,}5}{3{,}6} = 1{,}25\ \text{m/s}
          \qquad
          P = 300000 \cdot 1{,}25 = 375\ \text{kW}
          $$
      - tipo: calcular
        titulo: La velocidad con dos remolcadores
        pregunta: |
          Con dos remolcadores de esa misma potencia, ¿a qué velocidad se
          mueve el barco?
        respuesta:
          tipo: magnitud
          valor: '5.790 km/h'
          formato: una velocidad, con su unidad
        distractores:
          - valor: '9 km/h'
            mensaje: |
              Has doblado la velocidad. Con la resistencia creciendo como
              $v^{1{,}75}$, la potencia necesaria crece como $v^{2{,}75}$, y
              doblar la velocidad pediría casi siete veces la potencia.
          - valor: '6.688 km/h'
            mensaje: |
              Has doblado la **fuerza** en lugar de la potencia, resolviendo
              $2F = Kv^{1{,}75}$. El enunciado da la potencia de cada
              remolcador, no su tiro.
          - valor: '4.5 km/h'
            mensaje: |
              Esa es la velocidad con un solo remolcador. Con el doble de
              potencia el barco va más rápido, aunque bastante menos del
              doble.
        pista: |
          A velocidad constante $2P = F\,v = K v^{1{,}75}\,v = K v^{2{,}75}$,
          con $K = F/v_1^{1{,}75} = 203015$.
        desarrollo: |
          $$
          K = \frac{300000}{1{,}25^{1{,}75}} = \frac{300000}{1{,}47773} = 203015
          $$

          $$
          v = \left(\frac{2P}{K}\right)^{1/2{,}75} = \left(\frac{750000}{203015}\right)^{0{,}36364}
          = 1{,}6084\ \text{m/s} = 5{,}790\ \text{km/h}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'A velocidad constante la aceleración es nula, así que el tiro del remolcador iguala a la resistencia del agua.'
          - texto: '$P = F v = 300 \cdot 1{,}25 = 375$ kW, y de $F = K v^{1{,}75}$ sale $K = 203015$.'
          - texto: 'Con dos remolcadores, $2P = K v^{2{,}75}$ y $v = 1{,}608$ m/s, o sea $5{,}79$ km/h.'
          - texto: 'Como la potencia se dobla y la potencia es fuerza por velocidad, la velocidad se dobla también.'
            trampa: true
            mensaje: |
              Eso valdría si la fuerza fuera constante, y aquí crece con la
              velocidad. Sustituyendo $F = Kv^{1{,}75}$ queda
              $P = Kv^{2{,}75}$, así que la velocidad va con la potencia
              elevada a $1/2{,}75$: doblar $P$ la multiplica por 1,29.
    resolucion: |
      **a) La potencia.** El barco va a velocidad constante, así que la
      aceleración del centro de gravedad es nula y el tiro iguala a la
      resistencia. Con $v_1 = 4{,}5/3{,}6 = 1{,}25$ m/s:

      $$
      P = F\,v_1 = 300000 \cdot 1{,}25 = 375\ \text{kW}
      $$

      De paso queda determinada la constante de la ley de rozamiento:

      $$
      K = \frac{F}{v_1^{1{,}75}} = \frac{300000}{1{,}47773} = 203015
      $$

      **b) Con dos remolcadores.** Lo que se duplica es la potencia, no la
      fuerza. En régimen estacionario:

      $$
      2P = F\,v = K\,v^{1{,}75}\cdot v = K\,v^{2{,}75}
      $$

      $$
      v = \left(\frac{750000}{203015}\right)^{1/2{,}75} = 1{,}6084\ \text{m/s} = 5{,}790\ \text{km/h}
      $$

      Es decir, doblar la potencia sube la velocidad solo un 29 %: el factor es
      $2^{1/2{,}75} = 1{,}287$. Los dos resultados coinciden con los
      publicados, 375 kW y 5,790 km/h.

  - id: ejma9-col915-dos-bloques-en-superficies-perpendiculares
    titulo: Dos bloques en superficies perpendiculares unidos por una polea móvil
    fuente: >-
      Ejercicio 9.15 · Tema 9, «Magnitudes y teoremas fundamentales de la
      dinámica» · Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección
      publica los dos resultados y el curso publica su resolución; contra los
      dos está contrastado este desarrollo. En la resolución del curso, la
      ecuación de la normal de B lleva escrito por error la masa de A, aunque
      su fórmula final y su resultado usan la de B, que es lo correcto.
    nivel: practica
    enunciado: |
      Los bloques $A$ y $B$ están sobre dos superficies que forman entre sí
      $90^{\circ}$.

      Determinar la aceleración de los bloques y la fuerza de la soga, estando
      los bloques al inicio en reposo.

      Datos: $\mu_s = 0{,}25$; $\mu_k = 0{,}20$;
      $g = 9{,}81\ \text{m/s}^{2}$; $m_A = 100\ \text{kg}$;
      $m_B = 150\ \text{kg}$; $\beta = 20^{\circ}$.

      <figure>
