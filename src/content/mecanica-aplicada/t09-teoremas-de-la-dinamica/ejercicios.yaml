      </figure>
    pide: La aceleración tangencial en B y la fuerza que la varilla hace sobre la deslizadera.
    pasos:
      - tipo: reconocer
        pregunta: |
          En $B$, el punto más bajo, ¿cómo son las direcciones tangencial y
          normal, y qué proyecta cada fuerza sobre ellas?
        opciones:
          - texto: La tangente es horizontal y la normal apunta hacia arriba, hacia O; el peso solo entra en la normal y el muelle en las dos
            correcta: true
            mensaje: |
              Eso es. En el punto más bajo la tangente es horizontal y el
              centro queda justo encima, así que el peso es puramente normal y
              lo único que acelera tangencialmente es la componente horizontal
              del muelle.
          - texto: La tangente es vertical, así que el peso da toda la aceleración tangencial
            mensaje: |
              En el punto más bajo de una circunferencia la tangente es
              horizontal, no vertical. Si el peso fuera tangencial, la
              deslizadera aceleraría al caer, y ahí ya está abajo del todo.
          - texto: El muelle tira en la dirección de la tangente, porque está estirado
            mensaje: |
              El muelle tira hacia $D$, y $D$ no está en la tangente: está
              arriba y a la izquierda. Por eso hay que descomponer su fuerza
              en las dos direcciones, con $\cos\theta$ y $\operatorname{sen}\theta$.
      - tipo: calcular
        titulo: La aceleración tangencial en B
        pregunta: |
          ¿Cuánto vale la aceleración tangencial de la deslizadera al pasar por
          $B$?
        respuesta:
          tipo: magnitud
          valor: '64.62 m/s^2'
          formato: una aceleración, con su unidad
        distractores:
          - valor: '70 m/s^2'
            mensaje: |
              Has usado la fuerza del muelle entera, 35 N, sin proyectarla. La
              recta $DB$ está inclinada, y su componente tangencial es
              $F\cos\theta$ con $\cos\theta = 300/325$.
          - valor: '26.92 m/s^2'
            mensaje: |
              Has intercambiado el seno y el coseno. El ángulo se mide con la
              horizontal, así que la componente tangencial lleva el coseno.
          - valor: '9.81 m/s^2'
            mensaje: |
              Ese es el valor de $g$. En el punto más bajo el peso es
              perpendicular a la trayectoria y no acelera tangencialmente
              nada.
        pista: |
          $d = \sqrt{300^{2}+125^{2}} = 325$ mm, la fuerza del muelle es
          $k(d-L_0) = 35$ N y $\cos\theta = 300/325$.
        desarrollo: |
          $$
          a_t = \frac{k\,(d-L_0)\cos\theta}{m} = \frac{200 \cdot 0{,}175 \cdot 0{,}92308}{0{,}5} = 64{,}62\ \text{m/s}^{2}
          $$
      - tipo: calcular
        titulo: La fuerza de la varilla
        pregunta: |
          En el plano vertical que dice el enunciado, ¿cuánto vale la fuerza
          que la varilla hace sobre la deslizadera?
        respuesta:
          tipo: magnitud
          valor: '27.44 N'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '23 N'
            mensaje: |
              Es el valor que imprime la hoja de resultados, y corresponde al
              plano **horizontal**, donde el peso no entra: 22,5 N redondeado.
              El enunciado dice plano vertical, así que hay que sumar
              $m\,g = 4{,}91$ N.
          - valor: '54.37 N'
            mensaje: |
              Has sumado la componente vertical del muelle en vez de restarla.
              El muelle tira hacia $D$, que está **por encima** de $B$, así
              que ayuda a la varilla a curvar la trayectoria.
          - valor: '36 N'
            mensaje: |
              Ese es solo el término centrípeto, $m v^{2}/R$. Falta cerrar la
              ecuación normal con el peso y con la componente vertical del
              muelle.
        pista: |
          En la dirección normal, hacia $O$,
          $N + F\operatorname{sen}\theta - m g = m v^{2}/R$, con
          $\operatorname{sen}\theta = 125/325$ y $R = 0{,}125$ m.
        desarrollo: |
          $$
          N = \frac{m v^{2}}{R} + m g - k(d-L_0)\operatorname{sen}\theta
          = 36 + 4{,}905 - 13{,}46 = 27{,}44\ \text{N}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'La distancia $DB$ vale $\sqrt{300^{2}+125^{2}} = 325$ mm, así que el muelle está estirado 175 mm y tira con 35 N.'
          - texto: 'En la tangente, horizontal, $F\cos\theta = m\,a_t$ da $a_t = 64{,}6\ \text{m/s}^{2}$.'
          - texto: 'En la normal, hacia arriba, $N + F\operatorname{sen}\theta - m g = m v^{2}/R$ da $N = 27{,}44$ N.'
          - texto: 'Como la deslizadera va a 3 m/s, la velocidad es constante y la aceleración tangencial tiene que ser nula.'
            trampa: true
            mensaje: |
              Los 3 m/s son el valor **en ese instante**, no un dato de
              velocidad constante. De hecho el muelle tira hacia la izquierda
              y el módulo de la velocidad está cambiando a razón de
              $64{,}6\ \text{m/s}^{2}$.
    resolucion: |
      **La geometría.** $D$ está sobre la horizontal de $O$, a
      $175 + 125 = 300$ mm a su izquierda. Con la deslizadera en $B$, el punto
      más bajo:

      $$
      d = \sqrt{300^{2} + 125^{2}} = 325\ \text{mm}
      \qquad
      \cos\theta = \frac{300}{325} = 0{,}92308
      \qquad
      \operatorname{sen}\theta = \frac{125}{325} = 0{,}38462
      $$

      **La fuerza del muelle.** Estirado $325-150 = 175$ mm:

      $$
      F = k\,(d - L_0) = 200 \cdot 0{,}175 = 35\ \text{N}
      $$

      dirigida de $B$ hacia $D$, o sea hacia la izquierda y hacia arriba.

      **Dirección tangencial.** En $B$ es horizontal, y el peso no tiene
      componente en ella:

      $$
      a_t = \frac{F\cos\theta}{m} = \frac{32{,}31}{0{,}5} = 64{,}62\ \text{m/s}^{2}
      $$

      **Dirección normal.** Apunta hacia $O$, o sea hacia arriba:

      $$
      N + F\operatorname{sen}\theta - m\,g = \frac{m v^{2}}{R}
      \;\Longrightarrow\;
      N = \frac{0{,}5 \cdot 9}{0{,}125} + 0{,}5 \cdot 9{,}81 - 13{,}46
      $$

      $$
      N = 36 + 4{,}905 - 13{,}46 = 27{,}44\ \text{N}
      $$

      **Sobre el resultado impreso.** La hoja publica $N = 23$ N. Ese número no
      es el del plano vertical: es el del plano **horizontal**, donde el peso
      no entra y queda $N = 36 - 13{,}46 = 22{,}54$ N. La propia resolución del
      curso da los dos, 27,4 N en el plano vertical y 22,5 N en el horizontal,
      y el enunciado dice vertical, así que el valor correcto es
      $27{,}44$ N.

  - id: ejma9-col99-la-cuerda-que-tropieza-con-un-clavo
    titulo: La partícula cuya cuerda tropieza con un clavo a mitad de camino
    fuente: >-
      Ejercicio 9.9 · Tema 9, «Magnitudes y teoremas fundamentales de la
      dinámica» · Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección
      publica los tres resultados y el curso publica su resolución; contra los
      dos está contrastado este desarrollo. La figura de la colección no rotula
      el ángulo de OA con la horizontal; la resolución del curso lo fija en 30
      grados, que es lo que exigen los tres resultados publicados, y así se ha
      redibujado.
    nivel: practica
    enunciado: |
      La partícula $B$ de masa $m$ se suelta desde el reposo cuando la cuerda
      $OB$ está en la posición horizontal. Inicialmente, $B$ gira en torno a
      $O$ y posteriormente en torno a $A$. Determinar:

      a. Fuerza en la cuerda justo antes de tocar $A$

      b. Fuerza en la cuerda inmediatamente después de tocar $A$.

      c. Velocidad de la partícula cuando $\theta = 90^{\circ}$.

      <figure>
