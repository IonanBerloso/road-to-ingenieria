    pide: La distancia horizontal máxima L que recorre la carga tras la parada.
    pasos:
      - tipo: reconocer
        pregunta: |
          La grúa se para en seco y la carga sigue con 3 m/s. ¿Qué hace la
          carga y qué teorema conviene?
        opciones:
          - texto: Se convierte en un péndulo de 9 m que sube hasta pararse, y eso se resuelve con la conservación de la energía
            correcta: true
            mensaje: |
              Eso es. El cable no trabaja, porque es perpendicular a la
              velocidad, y no hay rozamiento; se conserva $T+V$ y la carga
              sube hasta que su velocidad se anula.
          - texto: Sigue recto con velocidad constante, porque ya no hay fuerzas horizontales
            mensaje: |
              El cable se inclina en cuanto la carga se adelanta, y entonces
              su tensión sí tiene componente horizontal. La carga describe un
              arco, no una recta.
          - texto: Se para a la vez que la grúa, porque el cable es inextensible
            mensaje: |
              Inextensible impide que la carga se aleje del carro más de 9 m,
              no que gire alrededor de él. La carga conserva su velocidad en
              el instante de la parada y se va hacia delante.
      - tipo: calcular
        titulo: La altura que sube la carga
        pregunta: |
          ¿Cuánto sube la carga sobre su posición inicial antes de pararse?
        respuesta:
          tipo: magnitud
          valor: '0.4587 m'
          formato: una longitud, con su unidad
        distractores:
          - valor: '0.9174 m'
            mensaje: |
              Te has dejado el $\tfrac12$ de la energía cinética. La igualdad
              es $\tfrac12 m v^{2} = m\,g\,h$, así que $h = v^{2}/(2g)$.
          - valor: '0.3058 m'
            mensaje: |
              Has usado $h = v^{2}/(3g)$ o algo parecido. El balance es
              $\tfrac12 v^{2} = g\,h$ y no hay ningún tres en él, aunque la
              velocidad valga 3.
        pista: |
          $\tfrac12 m v^{2} = m\,g\,h$. La masa se va, y $h = v^{2}/(2g)$.
        desarrollo: |
          $$
          h = \frac{v^{2}}{2g} = \frac{3^{2}}{2 \cdot 9{,}81} = 0{,}4587\ \text{m}
          $$
      - tipo: calcular
        titulo: El avance horizontal
        pregunta: |
          Con esa altura, ¿cuánto avanza la carga en horizontal?
        respuesta:
          tipo: magnitud
          valor: '2.837 m'
          formato: una longitud, con su unidad
        distractores:
          - valor: '0.4587 m'
            mensaje: |
              Eso es la altura que sube, no el avance horizontal. El cable
              gira un ángulo $\theta$ con $R(1-\cos\theta) = h$, y lo que se
              pide es $R\operatorname{sen}\theta$.
          - valor: '4.128 m'
            mensaje: |
              Has tomado $L = R\,\theta$, la longitud del arco recorrido, con
              $\theta$ en radianes. La distancia **horizontal** es la
              proyección, $R\operatorname{sen}\theta$.
        pista: |
          $R(1-\cos\theta) = h$ da $\cos\theta = 0{,}94903$, y el avance es
          $L = R\operatorname{sen}\theta$.
        desarrollo: |
          $$
          \cos\theta = 1 - \frac{h}{R} = 1 - \frac{0{,}4587}{9} = 0{,}94903
          \qquad
          \operatorname{sen}\theta = 0{,}31518
          $$

          $$
          L = R\operatorname{sen}\theta = 9 \cdot 0{,}31518 = 2{,}837\ \text{m}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: Al pararse el carro, la carga conserva su velocidad de 3 m/s y queda colgando de un cable de 9 m que puede girar.
          - texto: 'El cable no trabaja y no hay rozamiento: se conserva la energía mecánica, y la carga sube $h = v^{2}/2g = 0{,}4587$ m.'
          - texto: 'De $R(1-\cos\theta)=h$ sale $\theta = 18{,}37^{\circ}$, y el avance horizontal es $L = R\operatorname{sen}\theta = 2{,}837$ m.'
          - texto: Como el cable tira de la carga hacia el carro, su tensión frena la carga y hay que restar su trabajo.
            trampa: true
            mensaje: |
              La tensión es perpendicular a la velocidad en todo momento, así
              que su trabajo es **nulo**. Quien frena la carga es la
              componente del peso a lo largo de la trayectoria, y ese trabajo
              ya está contado como energía potencial.
    resolucion: |
      **Qué pasa al frenar.** El carro se detiene, pero la carga sigue con
      $v = 3\ \text{m/s}$ en horizontal. A partir de ese instante es un péndulo
      de longitud $R = 9$ m colgado de un punto fijo.

      **El teorema de la energía.** La tensión del cable es perpendicular a la
      velocidad y no trabaja; no hay rozamiento. Se conserva $T+V$, y la carga
      sube hasta pararse:

      $$
      \tfrac12 m v^{2} = m\,g\,h \;\Longrightarrow\; h = \frac{v^{2}}{2g} = \frac{9}{19{,}62} = 0{,}4587\ \text{m}
      $$

      **De la altura al avance horizontal.** Con el cable girado un ángulo
      $\theta$, la carga ha subido $h = R(1-\cos\theta)$ y ha avanzado
      $L = R\operatorname{sen}\theta$:

      $$
      \cos\theta = 1 - \frac{v^{2}}{2gR} = 0{,}94903
      \;\Longrightarrow\;
      L = R\operatorname{sen}\theta = \frac{v\sqrt{4gR-v^{2}}}{2g} = 2{,}837\ \text{m}
      $$

      Comprobación: integrando numéricamente la ecuación del péndulo,
      $\ddot{\theta} = -(g/R)\operatorname{sen}\theta$, desde
      $\dot{\theta}_0 = v/R$, la velocidad angular se anula en
      $\theta = 18{,}37^{\circ}$ y $R\operatorname{sen}\theta = 2{,}8366$ m. El
      resultado publicado, $2{,}838$ m, es el mismo cálculo con
      $g = 9{,}8\ \text{m/s}^{2}$.
  - id: ejma9-col94-el-fardo-y-el-muelle-precomprimido
    titulo: El fardo que comprime un muelle ya precomprimido
    fuente: >-
      Ejercicio 9.4 · Tema 9, «Magnitudes y teoremas fundamentales de la
      dinámica» · Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección
      publica los dos resultados y el curso publica su resolución; contra los
      dos está contrastado este desarrollo.
    nivel: practica
    enunciado: |
      Se emplea un muelle de constante $k = 20\ \text{kN/m}$ para detener un
      fardo de 60 kg que desliza. El muelle está sostenido mediante un cable,
      estando inicialmente comprimido 120 mm. El fardo tiene una velocidad de
      $2{,}5\ \text{m/s}$ en la posición que se muestra en la figura y si la
      compresión adicional del muelle es de 40 mm, calcular:

      a. Coeficiente de rozamiento entre el fardo y la superficie

      b. Velocidad del fardo cuando pasa de nuevo por la posición de la figura

      <figure>
      <svg viewBox="0 0 360 200" role="img" width="360" height="200" aria-labelledby="ejma9-col94-t ejma9-col94-d">
        <title id="ejma9-col94-t">El fardo deslizando hacia el muelle sostenido contra la pared</title>
        <desc id="ejma9-col94-d">Un fardo apoyado en un suelo horizontal rayado avanza hacia la derecha con 2,5 metros por segundo. A 600 milímetros de su cara delantera hay la placa de un muelle que se apoya en una pared de la derecha; el muelle está ya comprimido 120 milímetros y lo sujeta un cable. Dibujo a escala, con 600 milímetros medidos entre la cara del fardo y la placa.</desc>
