          En papel, antes de ninguna cuenta: **las tres partículas y su centro
          de masas en dos vistas, de frente, en el plano xy, y desde arriba, en
          el plano xz, con sus coordenadas**.
        comprueba:
          - punto: |
              **$A = (0;\ 3;\ 1)$, $B = (3;\ 0;\ 2{,}5)$ y $C = (4;\ 2;\ 1)$, en
              metros.**
            porque: |
              Se leen de las cotas de la figura: A, sobre el plano yz, a 3 m de
              altura y a 1 m en z; C, a 4 m en x, 2 m de altura y 1 m en z; B,
              en el suelo, a 3 m en x y 1,5 m más allá que C en z.
          - punto: |
              **G, más cerca de C que de A y de B.**
            porque: |
              C es la partícula más pesada: 3 de los 6 kg.
          - punto: |
              **La altura de G, 1,5 m.**
            porque: |
              Es la media de las alturas, 3, 0 y 2 m, pesada con las masas, 1,
              2 y 3 kg: $(3 + 0 + 6)/6$.
