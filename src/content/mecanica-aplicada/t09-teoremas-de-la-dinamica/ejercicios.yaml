      <figcaption>

      El collarín con la rampa y la polea, a la izquierda, y el bloque con su polea, a la derecha. La reacción del bloque sobre la rampa es igual y contraria a la normal que la rampa hace sobre el bloque.

      </figcaption>
      </figure>

      - **Sobre B**: su peso, 0,8 N; la normal de la rampa, $N_B$,
        perpendicular a ella; y $2T$ hacia arriba de la rampa, porque tiran de
        su polea los dos ramales.
      - **Sobre A, con la rampa soldada**: P, 5 N hacia arriba; su peso, 3 N;
        la normal de la guía, $N_A$, horizontal; el cable, que tira con T
        hacia el techo y con dos T hacia B, en total
        $T\,(2\operatorname{sen}\theta;\ 1 - 2\cos\theta)$; y la reacción del
        bloque, $N_B$, perpendicular a la rampa y hacia ella.
      - **Las masas**, $m_A = 3/9{,}81 = 0{,}30581$ kg y
        $m_B = 0{,}8/9{,}81 = 0{,}081549$ kg.

      **2. Incógnitas.** La aceleración del collarín, $a_A$, la tensión T y
      las dos normales, $N_B$ y $N_A$.

      **3. Ecuaciones.** La ligadura del cable: al subir A una distancia u, el
      tramo del techo se acorta u, y ese cable pasa a los dos ramales de la
      rampa, que crecen u/2 cada uno. B se aleja de A por la rampa la mitad de
      lo que sube A, y como el collarín se traslada sin girar:

      <figure class="figura-examen">
      <svg viewBox="12 40 86 100" role="img" width="129" height="150" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">La aceleración del bloque como suma de la del collarín y la relativa</title>
        <desc id="dsl-d">Desde un punto, la aceleración del collarín, a A, vertical hacia arriba; a continuación, la aceleración del bloque respecto del collarín, de valor a A medios, a lo largo de la rampa y hacia abajo, formando theta con la vertical. La aceleración del bloque, a B, cierra el triángulo.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M40 62 A12 12 0 0 0 49.2 57.7" fill="none" stroke="var(--ink)" stroke-width="0.9"/>
        <text x="43" y="74" font-size="10" fill="var(--ink)">θ</text>
        <line x1="40" y1="130" x2="40" y2="50" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="34" y="94" font-size="10" text-anchor="end" fill="var(--ink)" font-style="italic">a<tspan font-size="7.5" dy="2.5">A</tspan></text>
        <line x1="40" y1="50" x2="70.6" y2="75.7" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="58" y="56" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">½ a<tspan font-size="7.5" dy="2.5">A</tspan></text>
        <line x1="40" y1="130" x2="70.6" y2="75.7" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="60" y="110" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">a<tspan font-size="7.5" dy="2.5">B</tspan></text>
      </svg>
      <figcaption>

      La aceleración de B es la del collarín más la relativa a lo largo de la rampa, de la mitad de valor. θ = 50°.

      </figcaption>
      </figure>

      $$
      \vec{a}_B = \vec{a}_A + \vec{a}_{B/A}
      = \left(\tfrac12 a_A\operatorname{sen}\theta;\ a_A\left(1 - \tfrac12\cos\theta\right)\right)
      $$

      La segunda ley para B, en horizontal y en vertical:

      $$
      -2T\operatorname{sen}\theta + N_B\cos\theta = m_B\,\tfrac12 a_A\operatorname{sen}\theta
      $$

      $$
      2T\cos\theta + N_B\operatorname{sen}\theta - m_B\,g = m_B\,a_A\left(1-\tfrac12\cos\theta\right)
      $$

      Y para A, en vertical y en horizontal:

      $$
      P - m_A\,g + T\left(1-2\cos\theta\right) - N_B\operatorname{sen}\theta = m_A\,a_A
      $$

      $$
      N_A + 2T\operatorname{sen}\theta - N_B\cos\theta = 0
      $$

      **4. Resultados.** Sumando las dos verticales, la de A y la de B, se van
      $N_B$ y los $2T\cos\theta$, y con $P - m_A g - m_B g = 1{,}2$ N:

      $$
      T = \left[m_A + m_B\left(1 - \tfrac12\cos\theta\right)\right] a_A - 1{,}2
      = 0{,}361150\,a_A - 1{,}2
      $$

      Las dos de B, combinadas a lo largo de la rampa, eliminan $N_B$:

      $$
      2T = m_B\,g\cos\theta + m_B\,a_A\left(\cos\theta - \tfrac12\right)
      = 0{,}514230 + 0{,}011644\,a_A
      $$

      Con las dos, $0{,}710656\,a_A = 2{,}914230$:

      $$
      a_A = 4{,}101\ \text{m/s}^{2},
      \qquad
      T = 0{,}361150 \cdot 4{,}101 - 1{,}2 = 0{,}281\ \text{N}
      $$

      Y de la horizontal de B, $N_B = 0{,}869$ N; de la de A,
      $N_A = N_B\cos\theta - 2T\operatorname{sen}\theta = 0{,}128$ N, hacia la
      rampa.

      **El cable soporta 0,281 N.** La colección publica $T = 0{,}28$ N, y la
      resolución del curso, $T = 0{,}281$ N con $a_A = 4{,}1\ \text{m/s}^{2}$
      y $N_B = 0{,}869$ N.

      **5. Comprobación.** Por la potencia, sin cortar el cable. Del collarín,
      el bloque y el cable juntos solo trabajan P y los pesos: la guía empuja
      en horizontal y A sube en vertical; el techo no se mueve; la normal
      entre B y la rampa no trabaja, porque B desliza a lo largo de la rampa;
      y el cable no se estira. Con
      $v_B^{2} = v_A^{2}\left(\tfrac14\operatorname{sen}^{2}\theta + \left(1 - \tfrac12\cos\theta\right)^{2}\right) = v_A^{2}\,(1{,}25 - \cos\theta)$,
      la potencia de esas fuerzas es lo que crece la energía cinética:

      $$
      \left[m_A + m_B\,(1{,}25 - \cos\theta)\right] a_A
      = P - m_A\,g - m_B\,g\left(1 - \tfrac12\cos\theta\right)
      $$

      $$
      a_A = \frac{1{,}457115}{0{,}355328} = 4{,}101\ \text{m/s}^{2}
      $$

      Con ella, la ecuación de B perpendicular a la rampa da
      $N_B = m_B\operatorname{sen}\theta\,(g + a_A) = 0{,}081549 \cdot 0{,}7660 \cdot (9{,}81 + 4{,}101) = 0{,}869$
      N, y la vertical de A sola, la tensión:

      $$
      T = \frac{0{,}30581 \cdot 4{,}101 - 2 + 0{,}869 \cdot 0{,}7660}{1 - 2 \cdot 0{,}6428} = 0{,}281\ \text{N}
      $$

      Lo mismo.

      **Lo que dice el resultado.** El cable apenas trabaja: 0,281 N, un
      tercio del peso de B. Si todo estuviera parado, los dos ramales
      sostendrían a B sobre la rampa con $2T = m_B\,g\cos\theta$, y T sería
      0,257 N; la aceleración la sube un 9 %. Y la guía empuja solo 0,128 N,
      que es justo lo que hace falta para acelerar B en horizontal:
      $\tfrac12 \cdot 0{,}081549 \cdot 4{,}101 \cdot 0{,}7660 = 0{,}128$ N. Es
      la única fuerza horizontal sobre el conjunto.

  - id: ejma9-col98-la-deslizadera-en-la-varilla-circular
    titulo: La deslizadera del muelle en una varilla circular
    fuente: >-
      Ejercicio 9.8 · Tema 9, «Magnitudes y teoremas fundamentales de la
      dinámica» · Mecánica Aplicada, UPV/EHU, curso 2025-2026. Discrepancia
      declarada: el enunciado dice plano vertical y con él salen 27,4 N, que es
      lo que también obtiene la resolución del curso; los 23 N impresos en la
      hoja de resultados son el caso del plano horizontal, que esa misma
      resolución cifra en 22,5 N. Se publica el valor que dan los datos y el
      impreso queda como distractor. La aceleración tangencial, 64,6 metros por
      segundo al cuadrado, coincide con la publicada.
    nivel: practica
    antes:
      idea: |
        La deslizadera es una partícula que recorre una trayectoria conocida,
        la varilla. Conviene escribir la segunda ley en componentes
        intrínsecas: a lo largo de la tangente, donde la fuerza cambia el
        módulo de la velocidad, y a lo largo de la normal, hacia el centro de
        curvatura, donde cambia su dirección.
      formula: |
        Con $\rho$ el radio de curvatura de la trayectoria:

        $$
        \sum F_t = m\,a_t = m\,\dot{v},
        \qquad
        \sum F_n = m\,a_n = m\,\frac{v^{2}}{\rho}
        $$

        Un muelle de constante k y longitud natural $L_0$, estirado hasta una
        longitud d, tira hacia su anclaje con $F = k\,(d - L_0)$.
      reconocer: |
        Antes de calcular se mira dónde está la deslizadera y hacia dónde tira
        cada fuerza.
    enunciado: |
      Una deslizadera de 0,5 kg está unida a un resorte y se desliza sin
      fricción a lo largo de una varilla circular en un plano vertical. El
      resorte tiene una longitud no deformada de 150 mm y una constante
      $K = 200\ \text{N/m}$. Sabiendo que la deslizadera tiene una velocidad de
      $3\ \text{m/s}$ al pasar por el punto $B$, determine en este instante la
      aceleración tangencial de la deslizadera y la fuerza de la varilla sobre
      la deslizadera.

      <figure>
      <svg viewBox="0 0 370 250" role="img" width="370" height="250" aria-labelledby="ejma9-col98-t ejma9-col98-d">
