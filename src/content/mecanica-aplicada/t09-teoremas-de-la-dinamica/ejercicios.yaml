        <rect x="8" y="96" width="12" height="48" fill="var(--faint)" fill-opacity="0.3" stroke="var(--ink)" stroke-width="1.1"/>
        <path d="M8 100 L0 92 M8 114 L0 106 M8 128 L0 120 M8 142 L0 134" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <circle cx="24" cy="120" r="5" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
        <path d="M30 120 L57.5 132 L73.4 145.5 L96.5 142.6 L110.0 161.6 L133.2 158.6 L146.7 177.6 L169.8 174.6 L183.3 193.6 L204.0 196.2 L216 202" fill="none" stroke="var(--ink)" stroke-width="1.3"/>
        <rect x="216" y="199" width="28" height="17" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.4"/>
        <text x="24" y="106" font-size="11" text-anchor="middle" fill="var(--ink)">D</text>
