      - tipo: calcular
        titulo: La tensión justo antes de tocar el clavo
        pregunta: |
          Justo antes de que la cuerda toque $A$, ¿cuánto vale la tensión, en
          múltiplos de $m\,g$?
        respuesta:
          tipo: numero
          valor: '1.5'
          tolerancia: 0.02
          formato: un número, en múltiplos de mg
        distractores:
          - valor: '0.5'
            mensaje: |
              Has puesto la cuerda en equilibrio,
              $T = m g\operatorname{sen}30^{\circ}$. La partícula gira, así
              que hace falta además la fuerza centrípeta $m v^{2}/R$.
          - valor: '1'
            mensaje: |
              Ese es solo el término centrípeto, $m v^{2}/R = 2mg\operatorname{sen}30^{\circ}$.
              Falta la componente del peso a lo largo de la cuerda.
          - valor: '3'
            mensaje: |
              Ese es el péndulo en su punto más bajo, $T = m g + 2 m g$: con la
              caída entera, R, y el peso entero a lo largo de la cuerda. Cuando
              la cuerda llega a la recta $OA$ la partícula ha bajado solo
              $R\operatorname{sen}30^{\circ} = 0{,}4$ m, y el peso proyecta
              sobre ella $m g\operatorname{sen}30^{\circ}$.
        pista: |
          Energía: $v_1^{2} = 2gR\operatorname{sen}30^{\circ}$. Después,
          $T - m g\operatorname{sen}30^{\circ} = m v_1^{2}/R$.
        desarrollo: |
          $$
          T = m g\operatorname{sen}30^{\circ} + \frac{m \cdot 2gR\operatorname{sen}30^{\circ}}{R}
          = m g\left(0{,}5 + 1\right) = 1{,}5\,m\,g
          $$
      - tipo: calcular
        titulo: La tensión justo después
        pregunta: |
          Inmediatamente después de que la cuerda apoye en $A$, ¿cuánto vale la
          tensión, en múltiplos de $m\,g$?
        respuesta:
          tipo: numero
          valor: '2.5'
          tolerancia: 0.02
          formato: un número, en múltiplos de mg
        distractores:
          - valor: '1.5'
            mensaje: |
              Ese es el valor de antes. El radio ha pasado de $R$ a $R/2$, así
              que el término centrípeto se duplica y la tensión sube.
          - valor: '2'
            mensaje: |
              Ese es solo el término centrípeto con el radio nuevo,
              $m v^{2}/(R/2) = 2mg$. Falta sumar la componente del peso,
              $m g\operatorname{sen}30^{\circ}$.
          - valor: '3'
            mensaje: |
              Has duplicado también la componente del peso. El peso no cambia
              al tocar el clavo, y sigue proyectando
              $m g\operatorname{sen}30^{\circ}$ sobre la cuerda.
        pista: |
          La velocidad es la misma; el radio es ahora $R/2 = 0{,}4$ m.
        desarrollo: |
          $$
          T = m g\operatorname{sen}30^{\circ} + \frac{m v_1^{2}}{R/2}
          = m g\left(0{,}5 + 2\right) = 2{,}5\,m\,g
          $$
      - tipo: calcular
        titulo: La velocidad con la cuerda vertical
        pregunta: |
          Cuando $\theta = 90^{\circ}$, es decir con el tramo $AB$ vertical,
          ¿cuál es la velocidad de la partícula?
        respuesta:
          tipo: magnitud
          valor: '3.431 m/s'
          formato: una velocidad, con su unidad
        distractores:
          - valor: '3.962 m/s'
            mensaje: |
              Has tomado la caída total como $R = 0{,}8$ m. La partícula queda
              $0{,}5R$ por debajo de $A$, y $A$ está $0{,}5R\operatorname{sen}30^{\circ}$
              por debajo de $O$: en total $0{,}6$ m.
          - valor: '2.801 m/s'
            mensaje: |
              Has contado solo los $0{,}4$ m que baja colgando de $A$, sin la
              bajada previa hasta la altura del clavo. Es también la velocidad
              al tocar el clavo: después la partícula sigue bajando otros
              $0{,}2$ m.
          - valor: '2.426 m/s'
            mensaje: |
              Te has dejado el 2: de $\tfrac12 m v^{2} = m g h$ sale
              $v = \sqrt{2gh}$, no $\sqrt{gh}$.
        pista: |
          Desde la salida, la partícula baja
          $h = 0{,}5R + 0{,}5R\operatorname{sen}30^{\circ} = 0{,}6$ m, y
          $v = \sqrt{2gh}$.
        desarrollo: |
          $$
          h = 0{,}5 \cdot 0{,}8 + 0{,}5 \cdot 0{,}8 \cdot 0{,}5 = 0{,}6\ \text{m}
          $$

          $$
          v = \sqrt{2 \cdot 9{,}81 \cdot 0{,}6} = \sqrt{11{,}772} = 3{,}431\ \text{m/s}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'La cuerda no trabaja y no hay rozamiento, así que $v^{2} = 2gh$ en cualquier posición, con $h$ la bajada desde la horizontal.'
          - texto: 'Al llegar a la recta OA la partícula ha bajado $R\operatorname{sen}30^{\circ}$, y $T = mg\operatorname{sen}30^{\circ} + mv^{2}/R = 1{,}5mg$.'
          - texto: 'El clavo no cambia la velocidad pero reduce el radio a $R/2$, así que $T$ pasa a $mg\operatorname{sen}30^{\circ} + mv^{2}/(R/2) = 2{,}5mg$.'
          - texto: 'Como la cuerda pasa siempre por O, el momento angular respecto de O se conserva y $v$ se puede sacar de $m r v$ constante.'
            trampa: true
            mensaje: |
              La tensión sí pasa por $O$ mientras gira alrededor de $O$, pero
              el **peso** no: su momento respecto de $O$ no es nulo, y es
              justamente lo que acelera la partícula. El momento angular no se
              conserva aquí.
    resolucion: |
      **1. Sólidos libres.** Es un problema de dinámica de una partícula que
      recorre dos arcos de circunferencia: el dibujo lleva la partícula sola,
      en el instante en que la cuerda toca el clavo.

