ejercicios:
  - id: ejma9-el-bloque-y-el-muelle
    titulo: Un bloque que baja por un plano y comprime un muelle
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    antes:
      idea: |
        Los teoremas de la dinámica del punto relacionan las fuerzas con el
        movimiento: el de la cantidad de movimiento, con la aceleración; el de
        la energía, con la velocidad en cada posición; y el del momento
        cinético, con los giros alrededor de un punto. Antes de aplicar
        ninguno se aísla el cuerpo y se dibujan todas las fuerzas que actúan
        sobre él.
      formula: |
        Los tres teoremas, con $T = \tfrac12 m v^{2}$ y $W$ el trabajo de
        todas las fuerzas:

        $$
        m\,\vec{a} = \sum\vec{F},
        \qquad
        T_2 - T_1 = W_{12},
        \qquad
        \dot{\vec{H}}_O = \sum\vec{M}_O
        $$

        Si todas las fuerzas que trabajan son conservativas, se conserva
        $T + V$, con la energía potencial del peso y la de un muelle de
        constante $k$ deformado $\delta$:

        $$
        V = m\,g\,h + \tfrac12 k\,\delta^{2}
        $$
      reconocer: |
        Antes de calcular se mira qué se pide y qué fuerzas actúan.
    enunciado: |
      Un bloque de 2 kg se suelta desde el reposo en un plano inclinado 30°
      sin rozamiento. Después de recorrer 1 m a lo largo del plano, toca un
      muelle de constante $k = 400\ \text{N/m}$, paralelo al plano, y lo
      comprime hasta pararse. Tomando $g = 9{,}8\ \text{m/s}^{2}$, calcular la
      velocidad con la que toca el muelle y la compresión máxima.
    pide: La velocidad al tocar el muelle y la compresión máxima.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué teorema conviene usar, y por qué?
        opciones:
          - texto: El de la energía, porque se piden velocidades y posiciones y todas las fuerzas que trabajan son conservativas
            correcta: true
            mensaje: |
              Eso es. El peso y el muelle son conservativos, y la normal no
              trabaja porque es perpendicular al movimiento. La energía mecánica
              se conserva, y no hace falta saber nada de lo que pasa entre medias.
          - texto: El del momento lineal, porque hay una fuerza resultante
            mensaje: |
              Se puede, pero con el muelle la fuerza cambia con la posición y
              habría que integrar una ecuación diferencial. La energía llega al
              mismo resultado sin integrar.
          - texto: El del momento angular, porque el bloque baja girando
            mensaje: |
              El bloque no gira: se traslada a lo largo del plano. El momento
              angular no aporta nada aquí.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el bloque solo, mientras
          comprime el muelle, con todas las fuerzas que actúan sobre él**.
          Sin escala.
        comprueba:
          - punto: |
              **El peso, $m\,g = 19{,}6$ N, vertical y hacia abajo, en el
              centro del bloque.**
            porque: |
              Con $m = 2$ kg y $g = 9{,}8\ \text{m/s}^{2}$.
          - punto: |
              **La normal, perpendicular al plano, desde él.**
            porque: |
              Sin rozamiento, el plano solo puede empujar perpendicular a sí
              mismo.
          - punto: |
              **La fuerza del muelle, paralela al plano y hacia arriba de él, de
              valor $k\,x$.**
            porque: |
              El muelle, paralelo al plano, está comprimido x por el bloque, que
              se le echa encima, y lo empuja hacia atrás. Antes de tocarlo, esta
              fuerza no está.
        figura: |
          <svg viewBox="30 56 178 94" role="img" width="178" height="94" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">Sólido libre del bloque mientras comprime el muelle</title>
            <desc id="dsl-d">El bloque solo, sobre el plano inclinado 30 grados, que baja hacia la derecha, quitado y a trazos. Su peso, de 19,6 N, vertical hacia abajo; la normal N, perpendicular al plano, desde él; y la fuerza del muelle, k por x, paralela al plano y hacia arriba de él, en la cara delantera del bloque.</desc>
            <defs>
              <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
              </marker>
              <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
              </marker>
              <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
              </marker>
            </defs>
            <path d="M86.2 91.3 L120.8 111.3 L133.8 88.7 L99.2 68.7 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M43 66 L182 146" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
            <line x1="155.5" y1="131.3" x2="196" y2="131.3" stroke="var(--faint)" stroke-width="0.7"/>
            <path d="M174.6 142.3 A22 22 0 0 0 177.5 131.3" fill="none" stroke="var(--ink)" stroke-width="0.9"/>
            <text x="182" y="145" font-size="10" fill="var(--ink)">30°</text>
            <line x1="110" y1="90" x2="110" y2="130" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
            <text x="116" y="140" font-size="10" text-anchor="start" fill="var(--flag)">19,6 N</text>
            <line x1="85.5" y1="132.4" x2="103.5" y2="101.3" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
            <text x="80" y="138" font-size="10" text-anchor="end" fill="var(--d2-tinta)">N</text>
            <line x1="158.5" y1="118" x2="127.3" y2="100" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
            <text x="162" y="112" font-size="10" text-anchor="start" fill="var(--d2-tinta)">kx</text>
            <circle cx="110" cy="90" r="2.4" fill="var(--ink)"/>
          </svg>

      - tipo: calcular
        titulo: La velocidad al tocar el muelle
        pregunta: |
          ¿A qué velocidad toca el muelle, en m/s?
        respuesta:
          tipo: numero
          valor: '3.13'
          tolerancia: 0.01
          formato: un número, en m/s
        distractores:
          - valor: '4.427'
            mensaje: |
              Has usado 1 m como altura bajada. Es lo que recorre a lo largo del
              plano; la altura es $1 \cdot \sin 30° = 0{,}5\ \text{m}$.
        pista: |
          $\tfrac12 m v^{2} = m\,g\,h$ con $h = 1 \cdot \sin 30°$.
        desarrollo: |
          $$
          v = \sqrt{2\,g\,h} = \sqrt{2 \cdot 9{,}8 \cdot 0{,}5} = \sqrt{9{,}8} = 3{,}130\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La compresión máxima
        pregunta: |
          ¿Cuánto comprime el muelle, en metros?
        respuesta:
          tipo: numero
          valor: '0.2472'
          tolerancia: 0.002
          formato: un número, en m
        distractores:
          - valor: '0.2214'
            mensaje: |
              Has igualado la energía del muelle a la cinética con la que llega,
              9,8 J, y te has dejado que el bloque **sigue bajando** mientras
              comprime: el peso aporta también $m\,g\,x\sin 30°$ en ese tramo.
          - valor: '0.1565'
            mensaje: |
              Has igualado $k\,x^{2}$, sin el $\tfrac12$, a la cinética con la
              que llega, 9,8 J. Son dos errores a la vez: la energía de un
              muelle es $\tfrac12 k x^{2}$, y el peso sigue trabajando mientras
              comprime.
        pista: |
          Desde la salida hasta el punto de parada el bloque baja
          $(1 + x)\sin 30°$: $m\,g\,(1 + x)\sin 30° = \tfrac12 k x^{2}$.
        desarrollo: |
          $$
          2 \cdot 9{,}8 \cdot (1 + x) \cdot 0{,}5 = \tfrac12 \cdot 400\,x^{2}
          \;\Longrightarrow\;
          200\,x^{2} - 9{,}8\,x - 9{,}8 = 0
          $$

          $$
          x = \frac{9{,}8 + \sqrt{9{,}8^{2} + 4 \cdot 200 \cdot 9{,}8}}{400} = 0{,}2472\ \text{m}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: Solo trabajan el peso y el muelle, los dos conservativos; la normal no trabaja. La energía mecánica se conserva.
          - texto: 'Hasta el muelle baja $0{,}5$ m: $v = \sqrt{2 \cdot 9{,}8 \cdot 0{,}5} = 3{,}13$ m/s.'
          - texto: 'Hasta pararse baja $(1 + x)\sin 30°$: $9{,}8\,(1 + x) = 200\,x^{2}$ y $x = 0{,}247$ m.'
          - texto: Toda la energía cinética con la que llega, 9,8 J, se queda en el muelle, así que $\tfrac12 k x^{2} = 9{,}8$.
            trampa: true
            mensaje: |
              Mientras comprime, el bloque sigue bajando y el peso sigue
              trabajando. El muelle se lleva la cinética **más** la potencial de
              ese último tramo, y por eso la compresión es mayor.
    resolucion: |
      **1. Sólidos libres.** Es un problema de energía: el dibujo lleva el
      bloque solo, con las fuerzas que actúan sobre él mientras comprime el
      muelle.

      <figure class="figura-examen">
      <svg viewBox="30 56 178 94" role="img" width="267" height="141" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">Sólido libre del bloque mientras comprime el muelle</title>
        <desc id="dsl-d">El bloque solo, sobre el plano inclinado 30 grados, que baja hacia la derecha, quitado y a trazos. Su peso, de 19,6 N, vertical hacia abajo; la normal N, perpendicular al plano, desde él; y la fuerza del muelle, k por x, paralela al plano y hacia arriba de él, en la cara delantera del bloque.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M86.2 91.3 L120.8 111.3 L133.8 88.7 L99.2 68.7 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M43 66 L182 146" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
        <line x1="155.5" y1="131.3" x2="196" y2="131.3" stroke="var(--faint)" stroke-width="0.7"/>
        <path d="M174.6 142.3 A22 22 0 0 0 177.5 131.3" fill="none" stroke="var(--ink)" stroke-width="0.9"/>
        <text x="182" y="145" font-size="10" fill="var(--ink)">30°</text>
        <line x1="110" y1="90" x2="110" y2="130" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
        <text x="116" y="140" font-size="10" text-anchor="start" fill="var(--flag)">19,6 N</text>
        <line x1="85.5" y1="132.4" x2="103.5" y2="101.3" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="80" y="138" font-size="10" text-anchor="end" fill="var(--d2-tinta)">N</text>
        <line x1="158.5" y1="118" x2="127.3" y2="100" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="162" y="112" font-size="10" text-anchor="start" fill="var(--d2-tinta)">kx</text>
        <circle cx="110" cy="90" r="2.4" fill="var(--ink)"/>
      </svg>
      <figcaption>

      Mientras baja hasta el muelle, solo el peso y la normal; desde que lo toca, también la fuerza del muelle, kx, con x lo que lleva comprimido. Peso con g = 9,8 m/s².

      </figcaption>
      </figure>

      - **El peso**, $m\,g = 19{,}6$ N, vertical. Trabaja: el bloque baja.
      - **La normal**, perpendicular al plano y al movimiento: no trabaja.
      - **El muelle**, desde que lo toca: paralelo al plano, hacia arriba de
        él, de valor $k\,x$, con x lo que lleva comprimido. Es conservativo,
        como el peso.

      **2. Incógnitas.** La velocidad al tocar el muelle, v, y la compresión
      máxima, x.

      **3. Ecuaciones.** Solo trabajan fuerzas conservativas, y se conserva
      $T + V$. Desde la salida, en reposo, hasta el muelle, el bloque baja
      $1 \cdot \sin 30^\circ$; y hasta pararse, $(1 + x)\sin 30^\circ$, con el
      muelle comprimido x y $T = 0$:

      $$
      \tfrac12\,m\,v^{2} = m\,g \cdot 1 \cdot \sin 30^\circ,
      \qquad
      m\,g\,(1 + x)\sin 30^\circ = \tfrac12\,k\,x^{2}
      $$

      **4. Resultados.**

      $$
      v = \sqrt{2 \cdot 9{,}8 \cdot 0{,}5} = \sqrt{9{,}8} = 3{,}130\ \text{m/s}
      $$

      $$
      9{,}8\,(1 + x) = 200\,x^{2}
      \;\Longrightarrow\;
      x = \frac{9{,}8 + \sqrt{9{,}8^{2} + 4 \cdot 200 \cdot 9{,}8}}{400} = 0{,}2472\ \text{m}
      $$

      **Toca el muelle a 3,13 m/s y lo comprime 24,7 cm.**

      **5. Comprobación.** Por la segunda ley de Newton, sin energía. Hasta el
      muelle, a lo largo del plano, $m\,a = m\,g\sin 30^\circ$: $a = 4{,}9$
      m/s², y $v^{2} = 2 \cdot 4{,}9 \cdot 1 = 9{,}8$, $v = 3{,}130$ m/s. Con el
      muelle, $m\,\ddot{x} = m\,g\sin 30^\circ - k\,x$: un movimiento armónico
      de pulsación $\Omega = \sqrt{k/m} = \sqrt{200} = 14{,}14$ rad/s alrededor
      de la posición de equilibrio,
      $x_e = m\,g\sin 30^\circ/k = 9{,}8/400 = 0{,}0245$ m. Empieza en $x = 0$
      con $\dot{x} = v$, así que su amplitud es

      $$
      A = \sqrt{x_e^{2} + \frac{v^{2}}{\Omega^{2}}} = \sqrt{0{,}0245^{2} + \frac{9{,}8}{200}} = 0{,}2227\ \text{m}
      $$

      y la compresión máxima, $x_e + A = 0{,}0245 + 0{,}2227 = 0{,}2472$ m.
      Lo mismo.

      **Lo que dice el resultado.** El muelle se lleva más energía que la
      cinética con la que llega el bloque:
      $\tfrac12 \cdot 400 \cdot 0{,}2472^{2} = 12{,}22$ J, frente a 9,8 J,
      porque mientras comprime el bloque sigue bajando y el peso sigue
      trabajando. Y la compresión máxima no es la de equilibrio: a 2,45 cm el
      bloque quedaría quieto si llegara despacio; llega a 3,13 m/s y
      comprime diez veces más.

  - id: ejma9-la-fuerza-central
    titulo: Una partícula que gira atada a un hilo que se recoge
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    antes:
      idea: |
        Los teoremas de la dinámica del punto relacionan las fuerzas con el
        movimiento: el de la cantidad de movimiento, con la aceleración; el de
        la energía, con la velocidad en cada posición; y el del momento
        cinético, con los giros alrededor de un punto. Cada uno da una
        magnitud que se conserva cuando lo que la cambia es nulo.
      formula: |
        Los tres teoremas, con $T = \tfrac12 m v^{2}$, $W$ el trabajo de todas
        las fuerzas y $\vec{H}_O = \overrightarrow{OP}\times m\,\vec{v}$ el
        momento cinético respecto de un punto fijo O:

        $$
        m\,\vec{a} = \sum\vec{F},
        \qquad
        T_2 - T_1 = W_{12},
        \qquad
        \dot{\vec{H}}_O = \sum\vec{M}_O
        $$

        Si la resultante es nula, se conserva $m\,\vec{v}$; si no trabaja
        ninguna fuerza, T; y si el momento respecto de O es nulo,
        $\vec{H}_O$.
      reconocer: |
        Antes de calcular se mira qué fuerzas actúan y por dónde pasan.
    enunciado: |
      Una partícula gira sobre una mesa horizontal sin rozamiento, atada a un
      hilo que pasa por un agujero de la mesa. Cuando el radio es de 0,5 m, su
      velocidad es de 2 m/s. Se tira del hilo desde abajo hasta que el radio es
      de 0,25 m. Calcular la nueva velocidad.
    pide: La velocidad de la partícula con el radio reducido a la mitad.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué magnitud se conserva mientras se recoge el hilo?
        opciones:
          - texto: El momento angular respecto del agujero, porque la tensión pasa siempre por él
            correcta: true
            mensaje: |
              Eso es. La tensión es una fuerza central: su momento respecto del
              agujero es nulo, y por el teorema del momento angular en ese punto
              fijo, $\vec{H}_O$ no cambia.
          - texto: La energía cinética, porque la mesa no tiene rozamiento
            mensaje: |
              Sin rozamiento, pero la tensión sí trabaja: al tirar del hilo, la
              partícula se acerca al agujero en la dirección de la tensión. Ese
              trabajo aumenta la energía cinética.
          - texto: El momento lineal, porque no hay fuerzas horizontales
            mensaje: |
              La tensión es horizontal: es la que obliga a la partícula a girar.
              El momento lineal cambia de dirección todo el tiempo.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **la partícula sola, vista desde
          arriba, con todas las fuerzas horizontales que actúan sobre ella y
          con su velocidad**. Sin escala.
        comprueba:
          - punto: |
              **La tensión, a lo largo del hilo, hacia el agujero.**
            porque: |
              Un hilo solo puede tirar, y tira en su propia dirección, que pasa
              siempre por el agujero.
          - punto: |
              **Ninguna otra fuerza horizontal.**
            porque: |
              La mesa no tiene rozamiento. El peso y la normal son verticales y
              se anulan entre sí.
          - punto: |
              **La velocidad, perpendicular al hilo.**
            porque: |
              La partícula gira alrededor del agujero. Si el hilo se recoge
              despacio, apenas tiene componente a lo largo de él.
        figura: |
          <svg viewBox="36 0 140 128" role="img" width="140" height="128" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">Sólido libre de la partícula que gira atada al hilo, vista desde arriba</title>
            <desc id="dsl-d">Vista desde arriba. El agujero O, el hilo que sale de él hacia la derecha y la partícula en su extremo, a una distancia r. Sobre la partícula, la tensión T, a lo largo del hilo, hacia O; y su velocidad v, perpendicular al hilo, hacia arriba. En tenue y a trazos, un arco de su camino alrededor de O.</desc>
            <defs>
              <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
              </marker>
              <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
              </marker>
              <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
              </marker>
            </defs>
            <path d="M157 70 A7 7 0 1 0 143 70 A7 7 0 1 0 157 70 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M60 70 H143" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M133.7 121.6 A90 90 0 0 0 123.6 6.4" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
            <path d="M60 96 H150 M60 92 V100 M150 92 V100" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
            <text x="105" y="110" font-size="9" text-anchor="middle" fill="var(--faint)">r</text>
            <line x1="143" y1="70" x2="100" y2="70" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
            <text x="118" y="62" font-size="10" text-anchor="middle" fill="var(--d2-tinta)">T</text>
            <line x1="150" y1="63" x2="150" y2="24" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
            <text x="156" y="36" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">v</text>
            <circle cx="60" cy="70" r="2.4" fill="var(--ink)"/>
            <text x="52" y="64" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">O</text>
          </svg>

      - tipo: calcular
        titulo: La nueva velocidad
        pregunta: |
          ¿Cuál es la velocidad con el radio de 0,25 m, en m/s?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.02
          formato: un número, en m/s
        distractores:
          - valor: '2'
            mensaje: |
              La velocidad no se conserva: la tensión trabaja al recoger el
              hilo. Lo que se conserva es $m\,r\,v$.
          - valor: '8'
            mensaje: |
              Has hecho la velocidad inversamente proporcional a $r^{2}$. Con el
              momento angular $m\,r\,v$ constante, es inversamente proporcional a
              $r$.
          - valor: '2.828'
            mensaje: |
              Has hecho la velocidad inversamente proporcional a $\sqrt{r}$. El
              momento angular es $m\,r\,v$, y la $r$ va sin raíz.
        pista: |
          $m\,r_1\,v_1 = m\,r_2\,v_2$.
        desarrollo: |
          $$
          v_2 = v_1\,\frac{r_1}{r_2} = 2 \cdot \frac{0{,}5}{0{,}25} = 4\ \text{m/s}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: La tensión pasa siempre por el agujero, un punto fijo, así que su momento respecto de él es nulo.
          - texto: 'Por el teorema del momento angular, $H_O = m\,r\,v$ se conserva: $0{,}5 \cdot 2 = 0{,}25\,v_2$.'
          - texto: $v_2 = 4$ m/s, y la energía cinética se multiplica por cuatro, gracias al trabajo de quien tira del hilo.
          - texto: Como la mesa no tiene rozamiento, la energía cinética se conserva y la velocidad sigue siendo 2 m/s.
            trampa: true
            mensaje: |
              La tensión trabaja: al recoger el hilo, la partícula avanza en su
              dirección. Por eso la energía cinética crece. Lo que se conserva es
              el momento angular respecto del agujero.
    resolucion: |
      **1. Sólidos libres.** Es un problema de momento cinético: el dibujo
      lleva la partícula sola, vista desde arriba, con las fuerzas
      horizontales y su velocidad.

      <figure class="figura-examen">
      <svg viewBox="36 0 140 128" role="img" width="210" height="192" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">Sólido libre de la partícula que gira atada al hilo, vista desde arriba</title>
        <desc id="dsl-d">Vista desde arriba. El agujero O, el hilo que sale de él hacia la derecha y la partícula en su extremo, a una distancia r. Sobre la partícula, la tensión T, a lo largo del hilo, hacia O; y su velocidad v, perpendicular al hilo, hacia arriba. En tenue y a trazos, un arco de su camino alrededor de O.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M157 70 A7 7 0 1 0 143 70 A7 7 0 1 0 157 70 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M60 70 H143" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M133.7 121.6 A90 90 0 0 0 123.6 6.4" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
        <path d="M60 96 H150 M60 92 V100 M150 92 V100" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="105" y="110" font-size="9" text-anchor="middle" fill="var(--faint)">r</text>
        <line x1="143" y1="70" x2="100" y2="70" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="118" y="62" font-size="10" text-anchor="middle" fill="var(--d2-tinta)">T</text>
        <line x1="150" y1="63" x2="150" y2="24" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="156" y="36" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">v</text>
        <circle cx="60" cy="70" r="2.4" fill="var(--ink)"/>
        <text x="52" y="64" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">O</text>
      </svg>
      <figcaption>

      Vista desde arriba. Sobre la mesa, la partícula solo tiene una fuerza horizontal, la tensión, que pasa siempre por el agujero O; el peso y la normal son verticales y se anulan entre sí. En tenue, por dónde va.

      </figcaption>
      </figure>

      - **La tensión**, a lo largo del hilo, hacia el agujero O: pasa siempre
        por él, y O es un punto fijo.
      - **El peso y la normal**, verticales: se anulan entre sí.
      - **Sin rozamiento**, no hay ninguna otra fuerza horizontal.

      **2. Incógnitas.** La velocidad con el radio de 0,25 m, $v_2$.

      **3. Ecuaciones.** El momento de la tensión respecto de O es nulo,
      porque pasa por él, y los del peso y la normal se anulan entre sí. Por
      el teorema del momento cinético en el punto fijo O, $\vec{H}_O$ se
      conserva. Su valor es $m\,r\,v_\theta$, con $v_\theta$ la componente de
      la velocidad perpendicular al hilo; si el hilo se recoge despacio, la
      velocidad es prácticamente perpendicular a él, y $v_\theta = v$:

      $$
      m\,r_1\,v_1 = m\,r_2\,v_2
      $$

      **4. Resultados.**

      $$
      v_2 = v_1\,\frac{r_1}{r_2} = 2 \cdot \frac{0{,}5}{0{,}25} = 4\ \text{m/s}
      $$

      **Con el radio a la mitad, la partícula va al doble de deprisa: a 4
      m/s.**

      **5. Comprobación.** Por la energía y la segunda ley a lo largo del
      hilo, sin el momento cinético. Si se recoge despacio, la tensión es la
      que mantiene el giro: $T = m\,v^{2}/r$. Al acercarse la partícula al
      agujero, la tensión, que tira hacia él, trabaja $-T\,dr$, y por el
      teorema de la energía:

      $$
      m\,v\,dv = -\frac{m\,v^{2}}{r}\,dr
      \;\Longrightarrow\;
      \frac{dv}{v} = -\frac{dr}{r}
      \;\Longrightarrow\;
      v\,r = \text{cte}
      $$

      De 0,5 a 0,25 m, v pasa de 2 a 4 m/s. Lo mismo.

      **Lo que dice el resultado.** La energía cinética no se conserva: pasa
      de $\tfrac12 m \cdot 4$ a $\tfrac12 m \cdot 16$, el cuádruple. No es
      una contradicción: quien tira del hilo trabaja, y la tensión pasa ese
      trabajo a la partícula. Es lo que hace un patinador que gira y recoge
      los brazos: gira más deprisa, y le cuesta esfuerzo.

  - id: ejma9-col91-la-esferita-y-los-dos-hilos
    titulo: La esferita que gira colgada de dos hilos con la misma tensión
    fuente: >-
      Ejercicio 9.1 · Tema 9, «Magnitudes y teoremas fundamentales de la
      dinámica» · Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección
      publica el resultado y el curso publica su resolución; contra los dos
      está contrastado este desarrollo.
    nivel: practica
    antes:
      idea: |
        La esferita es una partícula: la segunda ley relaciona la resultante
        de las fuerzas que actúan sobre ella con su aceleración, componente a
        componente. Un hilo solo puede tirar, y tira a lo largo de sí mismo.
      formula: |
        La segunda ley, y la aceleración en componentes intrínsecas, con
        $\rho$ el radio de curvatura de la trayectoria y la normal dirigida
        al centro de curvatura:

        $$
        \sum\vec{F} = m\,\vec{a},
        \qquad
        a_t = \dot{v},
        \qquad
        a_n = \frac{v^{2}}{\rho}
        $$
      reconocer: |
        Antes de calcular se mira cómo se mueve la esferita y qué fuerzas
        actúan sobre ella.
    enunciado: |
      El hilo de alambre $ACB$ pasa por un anillo que está unido a una esfera
      pequeña en el punto $C$. La esferita se mueve girando a velocidad $v$
      constante a la distancia que aparece en la figura. Sabiendo que la fuerza
      en los dos extremos del hilo es idéntica, calcular la velocidad $v$.

