ejercicios:
  - id: ejma9-el-bloque-y-el-muelle
    titulo: Un bloque que baja por un plano y comprime un muelle
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Un bloque de 2 kg se suelta desde el reposo en un plano inclinado 30°
      sin rozamiento. Después de recorrer 1 m a lo largo del plano, toca un
      muelle de constante $k = 400\ \text{N/m}$, paralelo al plano, y lo
      comprime hasta pararse. Tomando $g = 9{,}8\ \text{m/s}^{2}$, calcular la
      velocidad con la que toca el muelle y la compresión máxima.
    pide: La velocidad al tocar el muelle y la compresión máxima.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué teorema conviene usar, y por qué?
        opciones:
          - texto: El de la energía, porque se piden velocidades y posiciones y todas las fuerzas que trabajan son conservativas
            correcta: true
            mensaje: |
              Eso es. El peso y el muelle son conservativos, y la normal no
              trabaja porque es perpendicular al movimiento. La energía mecánica
              se conserva, y no hace falta saber nada de lo que pasa entre medias.
          - texto: El del momento lineal, porque hay una fuerza resultante
            mensaje: |
              Se puede, pero con el muelle la fuerza cambia con la posición y
              habría que integrar una ecuación diferencial. La energía llega al
              mismo resultado sin integrar.
          - texto: El del momento angular, porque el bloque baja girando
            mensaje: |
              El bloque no gira: se traslada a lo largo del plano. El momento
              angular no aporta nada aquí.

      - tipo: calcular
        titulo: La velocidad al tocar el muelle
        pregunta: |
          ¿A qué velocidad toca el muelle, en m/s?
        respuesta:
          tipo: numero
          valor: '3.13'
          tolerancia: 0.01
          formato: un número, en m/s
        distractores:
          - valor: '4.427'
            mensaje: |
              Has usado 1 m como altura bajada. Es lo que recorre a lo largo del
              plano; la altura es $1 \cdot \sin 30° = 0{,}5\ \text{m}$.
        pista: |
          $\tfrac12 m v^{2} = m\,g\,h$ con $h = 1 \cdot \sin 30°$.
        desarrollo: |
          $$
          v = \sqrt{2\,g\,h} = \sqrt{2 \cdot 9{,}8 \cdot 0{,}5} = \sqrt{9{,}8} = 3{,}130\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La compresión máxima
        pregunta: |
          ¿Cuánto comprime el muelle, en metros?
        respuesta:
          tipo: numero
          valor: '0.2472'
          tolerancia: 0.002
          formato: un número, en m
        distractores:
          - valor: '0.2214'
            mensaje: |
              Has igualado la energía del muelle a la cinética con la que llega,
              9,8 J, y te has dejado que el bloque **sigue bajando** mientras
              comprime: el peso aporta también $m\,g\,x\sin 30°$ en ese tramo.
          - valor: '0.1565'
            mensaje: |
              Has igualado $k\,x^{2}$, sin el $\tfrac12$, a la cinética con la
              que llega, 9,8 J. Son dos errores a la vez: la energía de un
              muelle es $\tfrac12 k x^{2}$, y el peso sigue trabajando mientras
              comprime.
        pista: |
          Desde la salida hasta el punto de parada el bloque baja
          $(1 + x)\sin 30°$: $m\,g\,(1 + x)\sin 30° = \tfrac12 k x^{2}$.
        desarrollo: |
          $$
          2 \cdot 9{,}8 \cdot (1 + x) \cdot 0{,}5 = \tfrac12 \cdot 400\,x^{2}
          \;\Longrightarrow\;
          200\,x^{2} - 9{,}8\,x - 9{,}8 = 0
          $$

          $$
          x = \frac{9{,}8 + \sqrt{9{,}8^{2} + 4 \cdot 200 \cdot 9{,}8}}{400} = 0{,}2472\ \text{m}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: Solo trabajan el peso y el muelle, los dos conservativos; la normal no trabaja. La energía mecánica se conserva.
          - texto: 'Hasta el muelle baja $0{,}5$ m: $v = \sqrt{2 \cdot 9{,}8 \cdot 0{,}5} = 3{,}13$ m/s.'
          - texto: 'Hasta pararse baja $(1 + x)\sin 30°$: $9{,}8\,(1 + x) = 200\,x^{2}$ y $x = 0{,}247$ m.'
          - texto: Toda la energía cinética con la que llega, 9,8 J, se queda en el muelle, así que $\tfrac12 k x^{2} = 9{,}8$.
            trampa: true
            mensaje: |
              Mientras comprime, el bloque sigue bajando y el peso sigue
              trabajando. El muelle se lleva la cinética **más** la potencial de
              ese último tramo, y por eso la compresión es mayor.
    resolucion: |
      **El teorema.** Trabajan el peso y el muelle, conservativos; la normal es
      perpendicular al movimiento y no trabaja. Se conserva $T + V$.

      **Hasta tocar el muelle.** Recorre 1 m y baja $1 \cdot \sin 30° = 0{,}5$ m:

      $$
      \tfrac12 \cdot 2\,v^{2} = 2 \cdot 9{,}8 \cdot 0{,}5 \;\Longrightarrow\; v = 3{,}130\ \text{m/s}
      $$

      **Hasta pararse.** Desde la salida baja $(1 + x)\sin 30°$, y toda esa
      energía acaba en el muelle:

      $$
      9{,}8\,(1 + x) = 200\,x^{2} \;\Longrightarrow\; x = 0{,}2472\ \text{m}
      $$

      Comprobación: $\tfrac12 \cdot 400 \cdot 0{,}2472^{2} = 12{,}22$ J, y
      $2 \cdot 9{,}8 \cdot 1{,}2472 \cdot 0{,}5 = 12{,}22$ J.

  - id: ejma9-la-fuerza-central
    titulo: Una partícula que gira atada a un hilo que se recoge
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Una partícula gira sobre una mesa horizontal sin rozamiento, atada a un
      hilo que pasa por un agujero de la mesa. Cuando el radio es de 0,5 m, su
      velocidad es de 2 m/s. Se tira del hilo desde abajo hasta que el radio es
      de 0,25 m. Calcular la nueva velocidad.
    pide: La velocidad de la partícula con el radio reducido a la mitad.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué magnitud se conserva mientras se recoge el hilo?
        opciones:
          - texto: El momento angular respecto del agujero, porque la tensión pasa siempre por él
            correcta: true
            mensaje: |
              Eso es. La tensión es una fuerza central: su momento respecto del
              agujero es nulo, y por el teorema del momento angular en ese punto
              fijo, $\vec{H}_O$ no cambia.
          - texto: La energía cinética, porque la mesa no tiene rozamiento
            mensaje: |
              Sin rozamiento, pero la tensión sí trabaja: al tirar del hilo, la
              partícula se acerca al agujero en la dirección de la tensión. Ese
              trabajo aumenta la energía cinética.
          - texto: El momento lineal, porque no hay fuerzas horizontales
            mensaje: |
              La tensión es horizontal: es la que obliga a la partícula a girar.
              El momento lineal cambia de dirección todo el tiempo.

      - tipo: calcular
        titulo: La nueva velocidad
        pregunta: |
          ¿Cuál es la velocidad con el radio de 0,25 m, en m/s?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.02
          formato: un número, en m/s
        distractores:
          - valor: '2'
            mensaje: |
              La velocidad no se conserva: la tensión trabaja al recoger el
              hilo. Lo que se conserva es $m\,r\,v$.
          - valor: '8'
            mensaje: |
              Has hecho la velocidad inversamente proporcional a $r^{2}$. Con el
              momento angular $m\,r\,v$ constante, es inversamente proporcional a
              $r$.
          - valor: '2.828'
            mensaje: |
              Has hecho la velocidad inversamente proporcional a $\sqrt{r}$. El
              momento angular es $m\,r\,v$, y la $r$ va sin raíz.
        pista: |
          $m\,r_1\,v_1 = m\,r_2\,v_2$.
        desarrollo: |
          $$
          v_2 = v_1\,\frac{r_1}{r_2} = 2 \cdot \frac{0{,}5}{0{,}25} = 4\ \text{m/s}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: La tensión pasa siempre por el agujero, un punto fijo, así que su momento respecto de él es nulo.
          - texto: 'Por el teorema del momento angular, $H_O = m\,r\,v$ se conserva: $0{,}5 \cdot 2 = 0{,}25\,v_2$.'
          - texto: $v_2 = 4$ m/s, y la energía cinética se multiplica por cuatro, gracias al trabajo de quien tira del hilo.
          - texto: Como la mesa no tiene rozamiento, la energía cinética se conserva y la velocidad sigue siendo 2 m/s.
            trampa: true
            mensaje: |
              La tensión trabaja: al recoger el hilo, la partícula avanza en su
              dirección. Por eso la energía cinética crece. Lo que se conserva es
              el momento angular respecto del agujero.
    resolucion: |
      **Qué se conserva.** La única fuerza horizontal es la tensión, que pasa
      siempre por el agujero $O$, un punto fijo. Su momento respecto de $O$ es
      nulo, y por el teorema del momento angular, $\vec{H}_O$ se conserva. Con la
      velocidad perpendicular al hilo, $H_O = m\,r\,v$:

      $$
      m \cdot 0{,}5 \cdot 2 = m \cdot 0{,}25 \cdot v_2 \;\Longrightarrow\; v_2 = 4\ \text{m/s}
      $$

      **Y la energía.** Pasa de $\tfrac12 m \cdot 4$ a $\tfrac12 m \cdot 16$: se
      multiplica por cuatro. No es una contradicción: la tensión trabaja cuando se
      recoge el hilo, y ese trabajo es justo lo que gana la partícula.

  - id: ejma9-col91-la-esferita-y-los-dos-hilos
    titulo: La esferita que gira colgada de dos hilos con la misma tensión
    fuente: >-
      Ejercicio 9.1 · Tema 9, «Magnitudes y teoremas fundamentales de la
      dinámica» · Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección
      publica el resultado y el curso publica su resolución; contra los dos
      está contrastado este desarrollo.
    nivel: practica
    enunciado: |
      El hilo de alambre $ACB$ pasa por un anillo que está unido a una esfera
      pequeña en el punto $C$. La esferita se mueve girando a velocidad $v$
      constante a la distancia que aparece en la figura. Sabiendo que la fuerza
      en los dos extremos del hilo es idéntica, calcular la velocidad $v$.

      <figure>
      <svg viewBox="0 0 400 300" role="img" width="400" height="300" aria-labelledby="ejma9-col91-t ejma9-col91-d">
        <title id="ejma9-col91-t">La esferita C girando en un plano horizontal colgada del hilo ACB</title>
        <desc id="ejma9-col91-d">Un eje vertical con dos puntos fijos, A arriba y B más abajo. De cada uno sale un tramo de hilo hasta la esferita C, de 5 kilogramos, que describe una circunferencia horizontal de 1,6 metros de radio alrededor del eje. El tramo AC forma 30 grados con el eje y el tramo BC forma 45 grados. Dibujo a escala.</desc>
        <defs>
          <marker id="ejma9-col91-f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <polygon points="60,262 300,262 350,296 110,296" fill="var(--faint)" fill-opacity="0.15" stroke="var(--faint)" stroke-width="0.8"/>
        <ellipse cx="200" cy="230" rx="88" ry="22" fill="none" stroke="var(--faint)" stroke-width="1" stroke-dasharray="5 4"/>
        <line x1="200" y1="262" x2="200" y2="58" stroke="var(--ink)" stroke-width="1.2" marker-end="url(#ejma9-col91-f)"/>
        <line x1="200" y1="78" x2="288" y2="230" stroke="var(--ink)" stroke-width="1.6"/>
        <line x1="200" y1="142" x2="288" y2="230" stroke="var(--ink)" stroke-width="1.6"/>
        <path d="M200 108 A 30 30 0 0 0 215 104" fill="none" stroke="var(--faint)" stroke-width="1" stroke-dasharray="3 2"/>
        <path d="M200 176 A 34 34 0 0 0 224 166" fill="none" stroke="var(--faint)" stroke-width="1" stroke-dasharray="3 2"/>
        <text x="219" y="115" font-size="10" fill="var(--ink)">30º</text>
        <text x="229" y="184" font-size="10" fill="var(--ink)">45º</text>
        <circle cx="200" cy="78" r="3.4" fill="var(--ink)"/>
        <circle cx="200" cy="142" r="3.4" fill="var(--ink)"/>
        <circle cx="288" cy="230" r="8" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.4"/>
        <text x="188" y="74" font-size="11" text-anchor="end" fill="var(--ink)">A</text>
        <text x="188" y="146" font-size="11" text-anchor="end" fill="var(--ink)">B</text>
        <text x="302" y="226" font-size="11" fill="var(--ink)">C</text>
        <line x1="200" y1="230" x2="278" y2="230" stroke="var(--faint)" stroke-width="1" stroke-dasharray="3 2"/>
        <text x="236" y="224" font-size="10" text-anchor="middle" fill="var(--faint)">1,6 m</text>
        <text x="300" y="252" font-size="10" fill="var(--ink)">m = 5 kg</text>
      </svg>
      </figure>
    pide: La velocidad v con la que gira la esferita, en metros por segundo.
    pasos:
      - tipo: reconocer
        pregunta: |
          La esferita da vueltas con $v$ constante. ¿Cómo es su aceleración?
        opciones:
          - texto: 'Horizontal, dirigida al eje y de módulo $v^{2}/R$: solo hay componente normal'
            correcta: true
            mensaje: |
              Eso es. Con el módulo de la velocidad constante la componente
              tangencial es nula, y solo queda la normal, que en una
              circunferencia apunta al centro y vale $v^{2}/R$.
          - texto: Nula, porque la velocidad es constante
            mensaje: |
              La velocidad es un vector y aquí cambia de dirección todo el
              rato. Lo constante es su módulo, no el vector, así que hay
              aceleración normal.
          - texto: Vertical y hacia abajo, igual a la de la gravedad
            mensaje: |
              La esferita no cae: se mantiene a la misma altura. En la
              dirección vertical la resultante de las fuerzas es nula, y por
              eso los hilos sostienen el peso.
      - tipo: calcular
        titulo: La tensión del hilo
        pregunta: |
          Escribiendo el equilibrio vertical, ¿cuánto vale la tensión $T$,
          igual en los dos tramos?
        respuesta:
          tipo: magnitud
          valor: '31.18 N'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '24.53 N'
            mensaje: |
              Has repartido el peso a medias entre los dos tramos sin
              proyectar. Los hilos están inclinados, así que solo su
              componente vertical sostiene el peso.
          - valor: '40.63 N'
            mensaje: |
              Has usado los senos donde van los cosenos. El ángulo se mide
              con el eje **vertical**, así que la componente vertical de cada
              tensión es $T\cos\alpha$.
        pista: |
          Los dos tramos tiran hacia arriba y hacia el eje. En vertical,
          $T\cos 30^{\circ} + T\cos 45^{\circ} = m\,g$.
        desarrollo: |
          $$
          T = \frac{m\,g}{\cos 30^{\circ} + \cos 45^{\circ}}
          = \frac{5 \cdot 9{,}81}{0{,}8660 + 0{,}7071} = 31{,}18\ \text{N}
          $$
      - tipo: calcular
        titulo: La velocidad de giro
        pregunta: |
          Con esa tensión, ¿cuál es la velocidad $v$ de la esferita?
        respuesta:
          tipo: magnitud
          valor: '3.47 m/s'
          formato: una velocidad, con su unidad
        distractores:
          - valor: '1.437 m/s'
            mensaje: |
              Has restado las componentes horizontales. Los dos puntos de
              anclaje están del mismo lado del eje, por encima de $C$, así que
              las dos componentes horizontales apuntan al eje y se suman.
          - valor: '3.962 m/s'
            mensaje: |
              Eso es un péndulo cónico de un solo hilo a $45^{\circ}$,
              $v=\sqrt{g\,R\tan 45^{\circ}}$. Aquí tiran dos tramos con
              ángulos distintos y hay que sumar sus dos componentes.
        pista: |
          En horizontal, $T\operatorname{sen}30^{\circ} + T\operatorname{sen}45^{\circ} = m\,v^{2}/R$
          con $R = 1{,}6$ m.
        desarrollo: |
          $$
          v = \sqrt{g\,R\,\frac{\operatorname{sen}30^{\circ}+\operatorname{sen}45^{\circ}}{\cos 30^{\circ}+\cos 45^{\circ}}}
          = \sqrt{9{,}81 \cdot 1{,}6 \cdot \frac{1{,}2071}{1{,}5731}}
          $$

          $$
          v = \sqrt{12{,}044} = 3{,}470\ \text{m/s}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Con $v$ constante solo hay aceleración normal: horizontal, hacia el eje y de módulo $v^{2}/R$.'
          - texto: En vertical no hay aceleración, así que $T\cos 30^{\circ} + T\cos 45^{\circ} = m\,g$ y $T = 31{,}18$ N.
          - texto: En horizontal, $T\operatorname{sen}30^{\circ} + T\operatorname{sen}45^{\circ} = m\,v^{2}/R$, de donde $v = 3{,}47$ m/s.
          - texto: Como los dos tramos tienen la misma tensión, cada uno sostiene la mitad del peso y $T = m\,g/2$.
            trampa: true
            mensaje: |
              Que la tensión sea la misma no reparte el peso a medias: los dos
              tramos están inclinados **ángulos distintos**, así que sus
              componentes verticales, $T\cos 30^{\circ}$ y $T\cos 45^{\circ}$,
              no son iguales.
    resolucion: |
      **Qué tipo de movimiento es.** La esferita describe una circunferencia
      horizontal de radio $R = 1{,}6$ m con el módulo de la velocidad
      constante. La aceleración tangencial es nula y solo queda la normal,
      horizontal y dirigida al eje, de módulo $v^{2}/R$.

      **Las fuerzas.** El peso, $m\,g$, y los dos tramos del hilo, con la misma
      tensión $T$ porque el anillo desliza sin rozamiento sobre el alambre. El
      tramo $AC$ forma $30^{\circ}$ con el eje y el tramo $BC$, $45^{\circ}$.
      Los dos anclajes están sobre el eje y por encima de $C$, así que los dos
      tiran hacia arriba y hacia el eje.

      **Vertical.** No hay aceleración vertical:

      $$
      T\cos 30^{\circ} + T\cos 45^{\circ} - m\,g = 0
      \;\Longrightarrow\;
      T = \frac{5 \cdot 9{,}81}{1{,}5731} = 31{,}18\ \text{N}
      $$

      **Horizontal.** La resultante es la fuerza centrípeta:

      $$
      T\operatorname{sen}30^{\circ} + T\operatorname{sen}45^{\circ} = \frac{m\,v^{2}}{R}
      \;\Longrightarrow\;
      31{,}18 \cdot 1{,}2071 = \frac{5\,v^{2}}{1{,}6}
      $$

      $$
      v = \sqrt{12{,}044} = 3{,}470\ \text{m/s}
      $$

      Comprobación: la resultante horizontal vale $37{,}64$ N, y
      $m\,v^{2}/R = 5 \cdot 12{,}044/1{,}6 = 37{,}64$ N. Coincide con el
      resultado publicado, $v = 3{,}47\ \text{m}\cdot\text{s}^{-1}$.

  - id: ejma9-col92-tres-particulas-y-sus-magnitudes
    titulo: Las magnitudes de un sistema de tres partículas
    fuente: >-
      Ejercicio 9.2 · Tema 9, «Magnitudes y teoremas fundamentales de la
      dinámica» · Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección
      publica los seis resultados y el curso publica su resolución; contra los
      dos está contrastado este desarrollo. Las coordenadas de las tres
      partículas se leen de la figura, y son las únicas que reproducen a la vez
      los seis valores publicados.
    nivel: practica
    enunciado: |
      Las masas y velocidades de las partículas $A$, $B$ y $C$ de la figura son
      las siguientes:

      $$
      \vec{v}_A = 3\vec{i} - 2\vec{j} + 4\vec{k} \qquad m_A = 1\ \text{kg}
      $$

      $$
      \vec{v}_B = 4\vec{i} + 3\vec{j} \qquad m_B = 2\ \text{kg}
      $$

      $$
      \vec{v}_C = 2\vec{i} + 5\vec{j} - 3\vec{k} \qquad m_C = 3\ \text{kg}
      $$

      Calcular:

      a) El vector de posición del centro de gravedad

      b) El momento lineal del sistema

      c) El momento angular del sistema respecto el punto $O$

      d) El momentu angular del sistema respecto del centro de gravedad

      e) La energía cinética del sistema

      f) La energía potencial gravitatoria, considerando que el potencial es
      nulo a altura $y = 0$.

      <figure>
      <svg viewBox="0 0 370 300" role="img" width="370" height="300" aria-labelledby="ejma9-col92-t ejma9-col92-d">
        <title id="ejma9-col92-t">Las tres partículas A, B y C en los ejes x, y, z, con sus velocidades acotadas</title>
        <desc id="ejma9-col92-d">Perspectiva de los ejes con x hacia la derecha, y hacia arriba y z hacia el observador, dibujado en diagonal hacia abajo y a la izquierda. La partícula A está a 3 metros de altura sobre el plano xz y a 1 metro del plano xy en la dirección z. La partícula C está a 4 metros del eje y en la dirección x, a 2 metros de altura y a 1 metro en la dirección z. La partícula B está en el plano del suelo, a 3 metros del eje z en la dirección x y 1,5 metros más lejos que C en la dirección z. De cada partícula sale una flecha con su velocidad.</desc>
        <defs>
          <marker id="ejma9-col92-f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
          <marker id="ejma9-col92-v" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d1)"/>
          </marker>
        </defs>
        <line x1="130" y1="200" x2="320" y2="200" stroke="var(--ink)" stroke-width="1.2" marker-end="url(#ejma9-col92-f)"/>
        <line x1="130" y1="200" x2="130" y2="67" stroke="var(--ink)" stroke-width="1.2" marker-end="url(#ejma9-col92-f)"/>
        <line x1="130" y1="200" x2="65" y2="265" stroke="var(--ink)" stroke-width="1.2" marker-end="url(#ejma9-col92-f)"/>
        <text x="326" y="196" font-size="11" fill="var(--ink)">x</text>
        <text x="136" y="72" font-size="11" fill="var(--ink)">y</text>
        <text x="66" y="277" font-size="11" fill="var(--ink)">z</text>
        <text x="122" y="196" font-size="11" text-anchor="end" fill="var(--ink)">O</text>

        <path d="M111 117 L130 98 M111 117 L111 219 M111 219 L88 219 M111 117 L88 117" fill="none" stroke="var(--faint)" stroke-width="0.8" stroke-dasharray="3 2"/>
