    pide: La fuerza que soporta el cable.
    pasos:
      - tipo: reconocer
        pregunta: |
          El cable baja del techo, pasa por la polea del collarín, recorre la
          rampa hasta la polea de $B$ y vuelve a anclarse en el collarín. Si
          $A$ sube una distancia $u$, ¿cuánto se aleja $B$ de $A$ a lo largo de
          la rampa?
        opciones:
          - texto: $u/2$, porque el cable liberado se reparte entre los dos ramales que sujetan a B
            correcta: true
            mensaje: |
              Eso es. La longitud total es constante; al subir $A$, el tramo
              del techo se acorta $u$, y ese cable pasa a los dos ramales de la
              rampa, que crecen $u/2$ cada uno. De ahí
              $a_{B/A} = a_A/2$.
          - texto: $u$, porque el cable es inextensible y todo lo que sube A baja B
            mensaje: |
              Eso sería con un solo ramal. La polea de $B$ es móvil y lleva
              dos ramales, así que se mueve la mitad que el extremo del cable.
          - texto: Nada, porque B va soldado a la rampa
            mensaje: |
              Lo que va soldado al collarín es la rampa, no el bloque. $B$
              corre sobre ella, y por eso su aceleración es la de $A$ más la
              relativa a lo largo de la rampa.
      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el collarín con la rampa y su
          polea, por un lado, y el bloque B, por otro, cada uno con todas las
          fuerzas que actúan sobre él**. Sin escala.
        comprueba:
          - punto: |
              **Sobre B, dos tensiones T a lo largo de la rampa, hacia A.**
            porque: |
              B lleva una polea por la que pasa el cable: tiran de ella los
              dos ramales, el que viene de la polea del collarín y el que va
              al anclaje.
          - punto: |
              **Sobre B, su peso, 0,8 N, y la normal de la rampa,
              perpendicular a ella.**
            porque: |
              La rampa sostiene el bloque: sin rozamiento, empuja
              perpendicular a sí misma.
          - punto: |
              **Sobre el collarín, tres tensiones: una T vertical hacia el
              techo y dos T a lo largo de la rampa, hacia B, en la polea y en
              el anclaje.**
            porque: |
              Cada tramo de cable que se corta tira a lo largo de sí mismo: el
              del techo, en la polea; el que baja a B, también en la polea; y
              el que vuelve, en el anclaje.
          - punto: |
              **Sobre el collarín, P = 5 N hacia arriba, su peso, 3 N, y la
              normal de la guía, horizontal.**
            porque: |
              La guía es vertical y lisa: solo empuja en horizontal. Su
              sentido sale de las cuentas.
