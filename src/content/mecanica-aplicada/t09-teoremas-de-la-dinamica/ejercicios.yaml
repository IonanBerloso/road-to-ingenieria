    pide: La velocidad del trozo móvil en función de y, y qué ocurre cuando y vale L.
    pasos:
      - tipo: reconocer
        pregunta: |
          En la situación b), ¿qué parte de la soga se mueve y qué longitud
          tiene?
        opciones:
          - texto: 'El ramal del extremo libre, de longitud $(L-y)/2$: el otro cuelga del punto fijo y está en reposo'
            correcta: true
            mensaje: |
              Eso es. El extremo libre ha bajado $y$, así que el pliegue ha
              bajado $y/2$: el ramal libre mide $(L-y)/2$ y se mueve entero
              con velocidad $v$, y el otro, $(L+y)/2$, está quieto.
          - texto: Toda la soga, porque es un solo cuerpo
            mensaje: |
              El ramal que cuelga del punto fijo no se mueve: la soga se va
              transfiriendo de un ramal al otro a través del pliegue. Solo el
              ramal libre lleva velocidad.
          - texto: 'El ramal del extremo libre, de longitud $(L+y)/2$, que es el que crece'
            mensaje: |
              Has cambiado los dos. El que crece es el fijo; el libre se
              acorta a medida que la soga pasa por el pliegue, y por eso al
              final, con $y = L$, ya no queda nada moviéndose.
      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **la soga en la situación b), con
          la longitud de cada ramal, dónde está su centro de gravedad y cómo se
          mueve cada uno**. Sin escala.
        comprueba:
          - punto: |
              **El ramal fijo, del soporte al pliegue, de longitud
              $(L+y)/2$, quieto.**
            porque: |
              Cuelga del punto fijo. La soga va pasando a él por el pliegue,
              pero la que ya está en él no se mueve.
          - punto: |
              **El ramal libre, del pliegue al extremo, de longitud
              $(L-y)/2$, bajando entero a la velocidad v.**
            porque: |
              El extremo ha bajado y; la soga que ha soltado se reparte entre
              los dos ramales, y el pliegue baja y/2.
          - punto: |
              **El extremo libre, a una profundidad y bajo el soporte, y el
              pliegue, a $(L+y)/2$.**
            porque: |
              El pliegue está al final del ramal fijo.
          - punto: |
              **Cada centro de gravedad, en la mitad de su ramal.**
            porque: |
              La soga es uniforme, de masa $\lambda = m/L$ por unidad de
              longitud.
        figura: |
          <svg viewBox="16 6 170 172" role="img" width="170" height="172" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">La soga en la situación b, con sus dos ramales</title>
            <desc id="dsl-d">La soga cuelga del soporte. El ramal fijo baja desde el soporte hasta el pliegue, con longitud L más y, partido por dos, y su centro de gravedad G2 en la mitad. Desde el pliegue sube el ramal libre, de longitud L menos y, partido por dos, con su centro de gravedad G1 en la mitad y el extremo libre a una profundidad y bajo el soporte. El ramal libre baja con velocidad v.</desc>
            <defs>
              <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
              </marker>
              <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
              </marker>
              <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
              </marker>
            </defs>
            <path d="M70 20 H130" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M76 20 L70 14 M88 20 L82 14 M100 20 L94 14 M112 20 L106 14 M124 20 L118 14" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M90 20 V160 A10 10 0 0 0 110 160 V100" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M66 20 V160 M62 20 H70 M62 160 H70" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
            <text x="62" y="94" font-size="9" text-anchor="end" fill="var(--faint)">(L+y)/2</text>
            <path d="M140 20 V100 M136 20 H144 M136 100 H144" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
            <text x="144" y="64" font-size="9" text-anchor="start" fill="var(--faint)">y</text>
            <path d="M140 100 V160 M136 100 H144 M136 160 H144" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
            <text x="144" y="134" font-size="9" text-anchor="start" fill="var(--faint)">(L−y)/2</text>
            <line x1="124" y1="104" x2="124" y2="136" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
            <text x="124" y="150" font-size="10" text-anchor="middle" fill="var(--ink)" font-style="italic">v</text>
            <circle cx="90" cy="90" r="2.4" fill="var(--ink)"/>
            <text x="84" y="94" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">G<tspan font-size="7.5" dy="2.5">2</tspan></text>
            <circle cx="110" cy="130" r="2.4" fill="var(--ink)"/>
            <text x="106" y="126" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">G<tspan font-size="7.5" dy="2.5">1</tspan></text>
          </svg>

      - tipo: calcular
        titulo: La velocidad con unos valores de prueba
        pregunta: |
          Con los valores de prueba $L = 2\ \text{m}$, $y = 1\ \text{m}$ y
          $g = 9{,}81\ \text{m/s}^{2}$, ¿cuánto vale $v$?
        respuesta:
          tipo: magnitud
          valor: '5.425 m/s'
          formato: una velocidad, con su unidad
        distractores:
          - valor: '4.429 m/s'
            mensaje: |
              Has usado $v = \sqrt{2gy}$, la caída libre. La soga no cae
              libre: parte de ella se queda quieta y el reparto de masas
              cambia con $y$, lo que añade el factor
              $(L-0{,}5y)/(L-y)$.
          - valor: '3.132 m/s'
            mensaje: |
              Has tomado el descenso del centro de gravedad como $y/2$ sin
              corregir por la masa que se mueve. La energía liberada se la
              lleva **solo** el ramal móvil, que pesa menos que la soga
              entera.
          - valor: '3.617 m/s'
            mensaje: |
              Has invertido la fracción, usando $(L-y)/(L-0{,}5y)$. El
              denominador es la longitud del tramo móvil, y ese es el que
              lleva $L-y$.
        pista: |
          $v = \sqrt{2gy\,\dfrac{L-0{,}5y}{L-y}}$. Con $L=2$ e $y=1$, la
          fracción vale $1{,}5$.
        desarrollo: |
          $$
          v = \sqrt{2 \cdot 9{,}81 \cdot 1 \cdot \frac{2 - 0{,}5}{2 - 1}}
          = \sqrt{29{,}43} = 5{,}425\ \text{m/s}
          $$
      - tipo: calcular
        titulo: El coeficiente en la mitad del recorrido
        pregunta: |
          Escribiendo la velocidad en $y = L/2$ como $v = k\sqrt{g\,L}$,
          ¿cuánto vale el coeficiente $k$?
        respuesta:
          tipo: numero
          valor: '1.2247'
          tolerancia: 0.005
          formato: un número, sin unidades
        distractores:
          - valor: '1'
            mensaje: |
              Has tomado $v^{2} = gL$, que es lo que saldría de caída libre
              con $y = L/2$. El factor $(L-0{,}5y)/(L-y)$ vale aquí $1{,}5$,
              no 1.
          - valor: '1.5'
            mensaje: |
              Ese es $v^{2}/(gL)$, no $v/\sqrt{gL}$. Falta la raíz cuadrada.
          - valor: '0.7071'
            mensaje: |
              Has dejado $v^{2} = gL/2$: sin el factor 2 de $2gy$ y sin el
              $(L-0{,}5y)/(L-y)$.
        pista: |
          Sustituye $y = L/2$ en $v^{2} = 2gy(L-0{,}5y)/(L-y)$ y verás que
          todas las $L$ se simplifican menos una.
        desarrollo: |
          $$
          v^{2} = 2g\,\frac{L}{2}\cdot\frac{L - L/4}{L - L/2} = g\,L\,\frac{3/4}{1/2} = 1{,}5\,g\,L
          $$

          $$
          k = \sqrt{1{,}5} = 1{,}2247
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Con densidad lineal $\lambda = m/L$, el ramal móvil mide $(L-y)/2$ y el fijo, $(L+y)/2$.'
          - texto: 'Sumando las energías potenciales de los dos ramales, la energía liberada al pasar de $y=0$ a $y$ vale $\lambda g\,\dfrac{y}{2}\left(L-\dfrac{y}{2}\right)$.'
          - texto: 'Toda esa energía se la lleva el ramal móvil, $\tfrac12\lambda\dfrac{L-y}{2}v^{2}$, y despejando sale $v = \sqrt{2gy\,\dfrac{L-0{,}5y}{L-y}}$.'
          - texto: 'Cuando $y = L$ la fórmula da infinito, lo que significa que la soga alcanza la velocidad de la luz.'
            trampa: true
            mensaje: |
              Lo que dice la fórmula es que la masa que queda moviéndose tiende
              a cero mientras la energía liberada es finita. Es el límite del
              modelo —soga ideal, perfectamente flexible e inextensible—, no
              una predicción física: en $y=L$ no queda ningún trozo móvil.
    resolucion: |
      **1. Posiciones.** Es un problema de energía de un sistema que cambia
      de forma: el dibujo lleva la soga en la situación b), con sus dos
      ramales.

      <figure class="figura-examen">
      <svg viewBox="16 6 170 172" role="img" width="255" height="258" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">La soga en la situación b, con sus dos ramales</title>
        <desc id="dsl-d">La soga cuelga del soporte. El ramal fijo baja desde el soporte hasta el pliegue, con longitud L más y, partido por dos, y su centro de gravedad G2 en la mitad. Desde el pliegue sube el ramal libre, de longitud L menos y, partido por dos, con su centro de gravedad G1 en la mitad y el extremo libre a una profundidad y bajo el soporte. El ramal libre baja con velocidad v.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M70 20 H130" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M76 20 L70 14 M88 20 L82 14 M100 20 L94 14 M112 20 L106 14 M124 20 L118 14" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M90 20 V160 A10 10 0 0 0 110 160 V100" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M66 20 V160 M62 20 H70 M62 160 H70" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="62" y="94" font-size="9" text-anchor="end" fill="var(--faint)">(L+y)/2</text>
        <path d="M140 20 V100 M136 20 H144 M136 100 H144" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="144" y="64" font-size="9" text-anchor="start" fill="var(--faint)">y</text>
        <path d="M140 100 V160 M136 100 H144 M136 160 H144" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="144" y="134" font-size="9" text-anchor="start" fill="var(--faint)">(L−y)/2</text>
        <line x1="124" y1="104" x2="124" y2="136" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="124" y="150" font-size="10" text-anchor="middle" fill="var(--ink)" font-style="italic">v</text>
        <circle cx="90" cy="90" r="2.4" fill="var(--ink)"/>
        <text x="84" y="94" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">G<tspan font-size="7.5" dy="2.5">2</tspan></text>
        <circle cx="110" cy="130" r="2.4" fill="var(--ink)"/>
        <text x="106" y="126" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">G<tspan font-size="7.5" dy="2.5">1</tspan></text>
      </svg>
      <figcaption>

      La soga en b), con y = 0,4 L. El ramal fijo está quieto; el libre baja entero a la velocidad v de su extremo.

      </figcaption>
      </figure>

      - **El extremo libre** ha bajado y, y la soga que ha soltado se reparte
        entre los dos ramales: el pliegue baja y/2.
      - **El ramal fijo**, del soporte al pliegue, mide $(L+y)/2$ y está
        quieto; su centro de gravedad está a $(L+y)/4$ por debajo del
        soporte.
      - **El ramal libre**, del pliegue al extremo, mide $(L-y)/2$ y baja
        entero a la velocidad v; su centro de gravedad, entre las
        profundidades y y $(L+y)/2$, está a $(L+3y)/4$.

      **2. Incógnitas.** La velocidad v, en función de y.

      **3. Ecuaciones.** Solo trabaja el peso: el soporte no se mueve, y se
      supone, como la colección, que la soga es ideal y no pierde energía al
      doblarse en el pliegue. Con $\lambda = m/L$ y las profundidades medidas
      desde el soporte, la energía potencial es

      $$
      V(y) = -\lambda g\left[\frac{L+y}{2}\cdot\frac{L+y}{4} + \frac{L-y}{2}\cdot\frac{L+3y}{4}\right]
      = -\lambda g\,\frac{L^{2} + 2Ly - y^{2}}{4}
      $$

      y la cinética, solo la del ramal libre:

      $$
      T = \tfrac12\,\lambda\,\frac{L-y}{2}\,v^{2},
      \qquad
      T(y) + V(y) = V(0)
      $$

      **4. Resultados.** La energía que se libera de a) a b):

      $$
      V(0) - V(y) = \lambda g\,\frac{2Ly - y^{2}}{4} = \lambda g\,\frac{y}{2}\left(L - \frac{y}{2}\right)
      $$

      $$
      \tfrac12\,\lambda\,\frac{L-y}{2}\,v^{2} = \lambda g\,\frac{y}{2}\left(L-\frac{y}{2}\right)
      \;\Longrightarrow\;
      v = \sqrt{2\,g\,y\,\frac{L - 0{,}5y}{L - y}}
      $$

      **Es la expresión publicada.** Con los valores de prueba, $L = 2$ m e
      $y = 1$ m, $v = \sqrt{2 \cdot 9{,}81 \cdot 1 \cdot 1{,}5} = 5{,}425$ m/s;
      y en la mitad del recorrido, $v^{2} = 1{,}5\,g\,L$.

      **Y en c), con $y = L$.** El ramal libre mide $(L-y)/2 = 0$: no queda
      nada moviéndose, y toda la soga cuelga recta del soporte. La fórmula
      diverge porque la energía liberada, $\lambda g L^{2}/4$, que es finita,
      se concentra en una masa que tiende a cero:

      <figure class="figura-examen">
      <svg viewBox="10 4 270 162" role="img" width="405" height="243" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">La velocidad del ramal libre frente a lo que ha bajado su extremo</title>
        <desc id="dsl-d">Una gráfica de la velocidad, en unidades de raíz de g por L, frente a y partido por L, de 0 a 1. La curva de la soga sale de cero, va casi pegada a la de caída libre al principio, pasa por 1,22 en la mitad del recorrido y se dispara hacia infinito al acercarse a y igual a L. La de caída libre, a trazos, sube despacio hasta 1,41.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M40 150 H250" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M40 150 V14" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M40 150 L44 144.8 L50 141.7 L60 138.1 L80 132.6 L100 127.8 L120 123.1 L140 118.2 L160 112.3 L180 104.7 L200 93 L210 83.6 L220 68.2 L226 52 L230 33.9 L232 20.1" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M40 150 L44 144.8 L50 141.8 L60 138.4 L80 133.6 L100 129.9 L120 126.8 L140 124 L160 121.5 L180 119.3 L200 117.1 L220 115.2 L240 113.2" fill="none" stroke="var(--ink)" stroke-width="1" stroke-dasharray="4 3"/>
        <line x1="240" y1="150" x2="240" y2="14" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="140" y1="150" x2="140" y2="118.2" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="40" y1="118.2" x2="140" y2="118.2" stroke="var(--faint)" stroke-width="0.7"/>
        <circle cx="140" cy="118.2" r="2.4" fill="var(--ink)"/>
        <text x="40" y="162" font-size="9" text-anchor="middle" fill="var(--faint)">0</text>
        <text x="140" y="162" font-size="9" text-anchor="middle" fill="var(--faint)">0,5</text>
        <text x="240" y="162" font-size="9" text-anchor="middle" fill="var(--faint)">1</text>
        <text x="256" y="154" font-size="9" text-anchor="start" fill="var(--faint)">y/L</text>
        <text x="36" y="121" font-size="9" text-anchor="end" fill="var(--faint)">1,22</text>
        <text x="44" y="12" font-size="9" text-anchor="start" fill="var(--faint)">v/√(gL)</text>
        <text x="214" y="70" font-size="9" text-anchor="end" fill="var(--faint)">soga</text>
        <text x="204" y="128" font-size="9" text-anchor="start" fill="var(--faint)">caída libre</text>
      </svg>
      <figcaption>

      La soga, en continuo, y la caída libre, a trazos. Las dos empiezan igual, pero la soga se dispara al final: la energía que se libera se concentra en un ramal cada vez más corto.

      </figcaption>
      </figure>

      Es el límite del modelo de soga ideal; en la práctica, el último trozo
      da un latigazo.

      **5. Comprobación.** Por el centro de gravedad de la soga entera, con
      las alturas medidas desde abajo, a la profundidad L. Con $L = 2$ m e
      $y = 1$ m, el centro de gravedad está al principio a $3L/4 = 1{,}5$ m, y
      en b), a

      $$
      h_G = \frac{3L^{2} - 2Ly + y^{2}}{4L} = \frac{3 \cdot 4 - 2 \cdot 2 \cdot 1 + 1}{4 \cdot 2} = 1{,}125\ \text{m}
      $$

      Ha bajado 0,375 m, y la energía liberada, por unidad de $\lambda$, es
      $2 \cdot 9{,}81 \cdot 0{,}375 = 7{,}3575$. El ramal libre, de 0,5 m, se
      la lleva entera: $\tfrac12 \cdot 0{,}5\,v^{2} = 7{,}3575$, y
      $v = \sqrt{4 \cdot 7{,}3575} = 5{,}425$ m/s. Lo mismo.

      **Lo que dice el resultado.** Al principio la soga cae casi como un
      cuerpo libre: con y pequeño, el factor $(L - 0{,}5y)/(L - y)$ vale casi
      1. Pero va siempre algo más deprisa, y cada vez más: en la mitad del
      recorrido, $1{,}22\sqrt{g\,L}$ frente al $\sqrt{g\,L}$ de la caída
      libre, y al final se dispara. La energía que se libera no se queda en
      el ramal fijo, que está quieto: pasa entera a un ramal libre cada vez
      más corto. Por eso restalla el extremo de una soga que se suelta así.

  - id: ejma9-col912-el-avion-que-despega
    titulo: La pista y el tiempo que necesita un avión con resistencia cuadrática
    fuente: >-
      Ejercicio 9.12 · Tema 9, «Magnitudes y teoremas fundamentales de la
      dinámica» · Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección
      publica los dos resultados y el curso publica su resolución; contra los
      dos está contrastado este desarrollo.
    nivel: practica
    antes:
      idea: |
        La segunda ley relaciona la fuerza neta con la aceleración en cada
        instante. La aceleración se puede escribir como derivada de la
        velocidad respecto del tiempo o, con la regla de la cadena, respecto
        de la posición.
      formula: |
        $$
        m\,a = \sum F,
        \qquad
        a = \frac{dv}{dt} = v\,\frac{dv}{dx}
        $$

        Con 1 km/h $= 1/3{,}6$ m/s.
      reconocer: |
        Antes de calcular se mira qué fuerzas actúan sobre el avión a lo largo
        de la pista.
    enunciado: |
      Los motores de un avión de masa $25\cdot 10^{3}$ kg le provocan una
      empuje de 40 kN. La fuerza de resistencia del aire tiene un módulo
      $D = 2{,}25v^{2}$, siendo $v$ (m/s) y $D$ (N). Si el avión empieza el
      vuelo con 240 km/h:

      a. ¿Qué longitud de la pista de aterrizaje será necesaria?

      b. ¿Cuánto tiempo necesitará para despegar?
    pide: La longitud de pista y el tiempo hasta alcanzar los 240 km/h.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué no vale aquí la fórmula $v^{2} = 2\,a\,x$ del movimiento
          uniformemente acelerado?
        opciones:
          - texto: Porque la resistencia crece con la velocidad, así que la aceleración no es constante y hay que integrar
            correcta: true
            mensaje: |
              Eso es. Con $D = 2{,}25v^{2}$ la fuerza neta va cambiando, de
              40 kN al arrancar a 30 kN al final, y con ella la aceleración.
              Hay que separar variables.
          - texto: Porque el avión no parte del reposo
            mensaje: |
              Sí parte del reposo: los 240 km/h son la velocidad de despegue,
              la que alcanza al final de la pista. Lo que impide usar la
              fórmula es que la aceleración cambia.
          - texto: Porque hay que usar la conservación de la energía en su lugar
            mensaje: |
              La resistencia del aire no es conservativa, así que no hay
              energía mecánica que conservar. Lo que sí vale es el teorema de
              la energía con el trabajo de la resistencia, que es justo la
              integral que hay que hacer.
      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el avión solo, en un instante de
          la carrera de despegue, con todas las fuerzas que actúan sobre él y
          con su velocidad**. Sin escala.
        comprueba:
          - punto: |
              **El empuje, F = 40 kN, hacia delante.**
            porque: |
              Lo dan los motores, y no cambia en toda la carrera.
          - punto: |
              **La resistencia del aire, $D = 2{,}25\,v^{2}$, hacia atrás.**
            porque: |
              Se opone al movimiento y crece con la velocidad: es nula al
              arrancar.
          - punto: |
              **El peso y las reacciones de la pista, verticales.**
            porque: |
              El avión rueda sin subir ni bajar, así que se anulan; el
              enunciado no da rozamiento de rodadura.
          - punto: |
              **La velocidad, hacia delante, de 0 a 240 km/h.**
            porque: |
              Parte del reposo, y los 240 km/h son los de despegue, al final
              de la pista.
        figura: |
          <svg viewBox="0 28 222 100" role="img" width="222" height="100" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">Sólido libre del avión durante la carrera de despegue</title>
            <desc id="dsl-d">El avión sobre la pista, quitada y a trazos. Hacia delante, el empuje F de los motores; hacia atrás, la resistencia del aire D; su peso Mg, vertical hacia abajo; y las reacciones de la pista en las ruedas, N1 y N2, hacia arriba. Encima, la velocidad v, hacia delante.</desc>
            <defs>
              <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
              </marker>
              <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
              </marker>
              <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
              </marker>
            </defs>
            <path d="M40 60 H150 Q170 60 172 70 Q170 80 150 80 H40 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M40 60 L30 38 H44 L58 60 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M66 86 A6 6 0 1 0 54 86 A6 6 0 1 0 66 86 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M146 86 A6 6 0 1 0 134 86 A6 6 0 1 0 146 86 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M8 92 H214" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
            <line x1="174" y1="70" x2="214" y2="70" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
            <text x="194" y="64" font-size="10" text-anchor="middle" fill="var(--d2-tinta)">F</text>
            <line x1="38" y1="70" x2="6" y2="70" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
            <text x="20" y="64" font-size="10" text-anchor="middle" fill="var(--d2-tinta)">D</text>
            <line x1="100" y1="70" x2="100" y2="110" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
            <text x="105" y="108" font-size="10" text-anchor="start" fill="var(--flag)">Mg</text>
            <line x1="60" y1="122" x2="60" y2="92.5" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
            <text x="55" y="118" font-size="10" text-anchor="end" fill="var(--d2-tinta)">N<tspan font-size="7.5" dy="2.5">1</tspan></text>
            <line x1="140" y1="122" x2="140" y2="92.5" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
            <text x="145" y="118" font-size="10" text-anchor="start" fill="var(--d2-tinta)">N<tspan font-size="7.5" dy="2.5">2</tspan></text>
            <line x1="80" y1="46" x2="130" y2="46" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
            <text x="105" y="40" font-size="10" text-anchor="middle" fill="var(--ink)" font-style="italic">v</text>
            <circle cx="100" cy="70" r="2.4" fill="var(--ink)"/>
            <text x="106" y="67" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">G</text>
          </svg>

      - tipo: calcular
        titulo: La longitud de pista
        pregunta: |
          ¿Qué longitud de pista necesita el avión para alcanzar los 240 km/h?
        respuesta:
          tipo: magnitud
          valor: '1598 m'
          formato: una longitud, con su unidad
        distractores:
          - valor: '1389 m'
            mensaje: |
              Has ignorado la resistencia del aire y usado $a = F/m = 1{,}6$
              m/s² constante. Sale una pista más corta, porque en realidad la
              resistencia va comiéndose el empuje.
          - valor: '1852 m'
            mensaje: |
              Has tomado la resistencia constante e igual a la del final,
              $2{,}25 \cdot 66{,}67^{2} = 10$ kN. Al principio la resistencia
              es nula, así que esa hipótesis alarga la pista de más.
        pista: |
          $F - K v^{2} = m\,v\,\dfrac{dv}{dx}$, y separando variables sale
          $x = \dfrac{m}{2K}\ln\dfrac{1}{1 - Kv^{2}/F}$.
        desarrollo: |
          Con $v = 240/3{,}6 = 66{,}667$ m/s, $Kv^{2}/F = 0{,}25$:

          $$
          x = \frac{25000}{2 \cdot 2{,}25}\,\ln\frac{1}{1-0{,}25}
          = 5555{,}6 \cdot 0{,}28768 = 1598{,}2\ \text{m}
          $$
      - tipo: calcular
        titulo: El tiempo de carrera
        pregunta: |
          ¿Cuánto tiempo tarda en alcanzar esa velocidad?
        respuesta:
          tipo: magnitud
          valor: '45.78 s'
          formato: un tiempo, con su unidad
        distractores:
          - valor: '41.67 s'
            mensaje: |
              Es $v/a$ con $a = F/m = 1{,}6$ m/s², o sea ignorando la
              resistencia. Con ella el avión tarda más.
          - valor: '55.56 s'
            mensaje: |
              Has usado la resistencia del final como si fuera constante,
              $a = (40-10)/25 = 1{,}2$ m/s². Esa hipótesis penaliza de más el
              arranque, donde la resistencia es casi nula.
          - valor: '47.95 s'
            mensaje: |
              Has dividido la distancia entre la velocidad media aritmética,
              $1598/33{,}3$. Con aceleración variable la velocidad media no es
              la mitad de la final.
        pista: |
          $F - K v^{2} = m\,\dfrac{dv}{dt}$ y la integral es la de la
          arcotangente hiperbólica: con $v_{\lim} = \sqrt{F/K} = 133{,}33$
          m/s, $t = \dfrac{m}{2\sqrt{FK}}\ln\dfrac{v_{\lim}+v}{v_{\lim}-v}$.
        desarrollo: |
          $$
          t = \frac{25000}{2\sqrt{40000 \cdot 2{,}25}}\,\ln\frac{133{,}33+66{,}67}{133{,}33-66{,}67}
          = \frac{25000}{600}\,\ln 3 = 45{,}78\ \text{s}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'La fuerza neta es $F - Kv^{2}$ con $K = 2{,}25$, así que la aceleración no es constante y hay que integrar.'
          - texto: 'Para la distancia se escribe $a = v\,dv/dx$, y la integral da $x = \dfrac{m}{2K}\ln\dfrac{1}{1-Kv^{2}/F} = 1598$ m.'
          - texto: 'Para el tiempo se escribe $a = dv/dt$, y la integral da $t = 45{,}8$ s.'
          - texto: 'Como ya se conoce la distancia y la velocidad final, el tiempo es $t = 2x/v = 47{,}9$ s.'
            trampa: true
            mensaje: |
              $t = 2x/v$ supone velocidad media igual a la mitad de la final,
              que solo vale con aceleración **constante**. Aquí el avión
              acelera más al principio, así que gana velocidad antes y el
              tiempo real es menor, 45,8 s.
    resolucion: |
      **1. Sólidos libres.** Es un problema de dinámica de una partícula con
      una fuerza que depende de la velocidad: el dibujo lleva el avión solo,
      en un instante de la carrera.

      <figure class="figura-examen">
      <svg viewBox="0 28 222 100" role="img" width="333" height="150" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">Sólido libre del avión durante la carrera de despegue</title>
        <desc id="dsl-d">El avión sobre la pista, quitada y a trazos. Hacia delante, el empuje F de los motores; hacia atrás, la resistencia del aire D; su peso Mg, vertical hacia abajo; y las reacciones de la pista en las ruedas, N1 y N2, hacia arriba. Encima, la velocidad v, hacia delante.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M40 60 H150 Q170 60 172 70 Q170 80 150 80 H40 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M40 60 L30 38 H44 L58 60 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M66 86 A6 6 0 1 0 54 86 A6 6 0 1 0 66 86 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M146 86 A6 6 0 1 0 134 86 A6 6 0 1 0 146 86 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M8 92 H214" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
        <line x1="174" y1="70" x2="214" y2="70" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="194" y="64" font-size="10" text-anchor="middle" fill="var(--d2-tinta)">F</text>
        <line x1="38" y1="70" x2="6" y2="70" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="20" y="64" font-size="10" text-anchor="middle" fill="var(--d2-tinta)">D</text>
        <line x1="100" y1="70" x2="100" y2="110" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
        <text x="105" y="108" font-size="10" text-anchor="start" fill="var(--flag)">Mg</text>
        <line x1="60" y1="122" x2="60" y2="92.5" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="55" y="118" font-size="10" text-anchor="end" fill="var(--d2-tinta)">N<tspan font-size="7.5" dy="2.5">1</tspan></text>
        <line x1="140" y1="122" x2="140" y2="92.5" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="145" y="118" font-size="10" text-anchor="start" fill="var(--d2-tinta)">N<tspan font-size="7.5" dy="2.5">2</tspan></text>
        <line x1="80" y1="46" x2="130" y2="46" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="105" y="40" font-size="10" text-anchor="middle" fill="var(--ink)" font-style="italic">v</text>
        <circle cx="100" cy="70" r="2.4" fill="var(--ink)"/>
        <text x="106" y="67" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">G</text>
      </svg>
      <figcaption>

      El avión en un instante de la carrera. D crece con la velocidad: es nula al arrancar.

      </figcaption>
      </figure>

      - **El empuje**, $F = 40$ kN, hacia delante y constante.
      - **La resistencia del aire**, $D = K\,v^{2}$ con $K = 2{,}25$, hacia
        atrás: nula al arrancar y de 10 kN al despegar.
      - **El peso y las reacciones de la pista**, verticales, se anulan: no
        entran a lo largo de la pista.

      **2. Incógnitas.** La longitud de pista, x, y el tiempo, t, hasta
      $v = 240/3{,}6 = 66{,}667$ m/s.

      **3. Ecuaciones.** La segunda ley a lo largo de la pista. La fuerza neta,
      $F - K\,v^{2}$, cambia con la velocidad, así que la aceleración no es
      constante y no valen las fórmulas del movimiento uniformemente
      acelerado. Se separan variables, con $a = v\,dv/dx$ para la distancia y
      $a = dv/dt$ para el tiempo:

      $$
      m\,v\,\frac{dv}{dx} = F - K\,v^{2},
      \qquad
      m\,\frac{dv}{dt} = F - K\,v^{2}
      $$

      **4. Resultados.** a) Integrando la primera desde el reposo:

      $$
      x = \frac{m}{2K}\ln\frac{F}{F-Kv^{2}}
      $$

      $$
      x = \frac{25000}{4{,}5}\,\ln\frac{40000}{30000} = 5555{,}6 \cdot 0{,}28768 = 1598{,}2\ \text{m}
      $$

      b) Integrando la segunda, con la velocidad límite, a la que el empuje y
      la resistencia se igualan, $v_{\lim} = \sqrt{F/K} = 133{,}33$ m/s:

      $$
      t = \frac{m}{2\sqrt{FK}}\,\ln\frac{v_{\lim}+v}{v_{\lim}-v}
      = \frac{25000}{600}\,\ln 3 = 45{,}78\ \text{s}
      $$

      **El avión necesita 1598,2 m de pista y 45,78 s.** Los resultados
      publicados son 1598 m y 45,8 s.

      **5. Comprobación.** Por la velocidad en función del tiempo, sin la
      integral de la distancia. La segunda ecuación da
      $v = v_{\lim}\tanh(t/\tau)$, con $\tau = m/\sqrt{FK} = 83{,}333$ s. El
      avión llega a 66,667 m/s cuando $\tanh(t/\tau) = 0{,}5$, es decir
      $t/\tau = 0{,}54931$, y $t = 83{,}333 \cdot 0{,}54931 = 45{,}78$ s. La
      distancia es el área bajo esa curva,
      $x = v_{\lim}\,\tau\ln\cosh(t/\tau)$, con
      $\cosh 0{,}54931 = 1{,}1547$ y $\ln 1{,}1547 = 0{,}14384$:

      $$
      x = 133{,}33 \cdot 83{,}333 \cdot 0{,}14384 = 1598{,}2\ \text{m}
      $$

      Lo mismo.

      **Lo que dice el resultado.** La resistencia, nula al arrancar, se come
      al final la cuarta parte del empuje, 10 de los 40 kN: el avión pasa de
      acelerar 1,6 m/s² a acelerar 1,2, y la pista sale un 15 % más larga que
      sin resistencia, 1389 m. Y como acelera más al principio, su curva de
      velocidad queda por encima de la recta de aceleración constante que
      llega al mismo punto:

      <figure class="figura-examen">
      <svg viewBox="6 2 276 166" role="img" width="414" height="249" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">La velocidad del avión frente al tiempo, y la de aceleración constante</title>
        <desc id="dsl-d">Una gráfica de la velocidad, en metros por segundo, frente al tiempo, en segundos. La curva del avión sale del origen, algo más empinada al principio, y llega a 66,67 metros por segundo a los 45,78 segundos. A trazos, la recta que une el origen con ese mismo punto, la de aceleración constante: queda por debajo de la curva.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M40 150 H246" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M40 150 V8" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M40 150 L60 134 L80 118.2 L100 102.5 L120 87.2 L140 72.3 L160 57.9 L180 44.2 L200 31 L223.1 16.7" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M40 150 L223.1 16.7" fill="none" stroke="var(--ink)" stroke-width="1" stroke-dasharray="4 3"/>
        <line x1="223.1" y1="150" x2="223.1" y2="16.7" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="40" y1="16.7" x2="223.1" y2="16.7" stroke="var(--faint)" stroke-width="0.7"/>
        <text x="40" y="162" font-size="9" text-anchor="middle" fill="var(--faint)">0</text>
        <text x="223.1" y="162" font-size="9" text-anchor="middle" fill="var(--faint)">45,78</text>
        <text x="250" y="154" font-size="9" text-anchor="start" fill="var(--faint)">t (s)</text>
        <text x="36" y="153" font-size="9" text-anchor="end" fill="var(--faint)">0</text>
        <text x="36" y="20" font-size="9" text-anchor="end" fill="var(--faint)">66,67</text>
        <text x="44" y="10" font-size="9" text-anchor="start" fill="var(--faint)">v (m/s)</text>
      </svg>
      <figcaption>

      La curva del avión y, a trazos, la recta de aceleración constante con el mismo final. La distancia es el área bajo cada una: la de la curva, 1598 m, es mayor.

      </figcaption>
      </figure>

      Su velocidad media, $1598{,}2/45{,}78 = 34{,}91$ m/s, es algo más que la
      mitad de la final, 33,33. La velocidad límite, 133,33 m/s, son 480
      km/h: el doble de la de despegue.

  - id: ejma9-col913-los-banistas-que-saltan-de-la-barca
    titulo: Los dos bañistas que saltan de la popa de una barca
    fuente: >-
      Ejercicio 9.13 · Tema 9, «Magnitudes y teoremas fundamentales de la
      dinámica» · Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección
      publica los cinco resultados y contra ellos está contrastado este
      desarrollo; los tres casos salen exactos. En la resolución del curso el
      caso a aparece como 1,5 metros por segundo, que no reproduce ningún
      reparto de masas del enunciado, y la hoja de resultados rotula el tercer
      caso como b en lugar de c. El texto castellano no da la masa de la
      barca; el de euskera sí, 200 kg, y se añade al final del enunciado.
    nivel: practica
    antes:
      idea: |
        El teorema de la cantidad de movimiento: la resultante de las fuerzas
        exteriores sobre un sistema es lo que cambia su momento lineal. Las
        fuerzas entre las partes del sistema se anulan dos a dos y no lo
        cambian.
      formula: |
        Con $\vec{L}$ el momento lineal del sistema, suma del de cada parte:

        $$
        \sum\vec{F}_{\text{ext}} = \frac{d\vec{L}}{dt},
        \qquad
        \vec{L} = \sum m_i\,\vec{v}_i
        $$
      reconocer: |
        Antes de calcular se mira qué fuerzas actúan en horizontal sobre la
        barca y los bañistas.
    enunciado: |
      Los bañistas $A$ y $B$ tienen unas masas de 75 kg y 50 kg
      respectivamente. Realizan un salto desde la popa de la barca con una
      velocidad relativa respecto de la barca de valor 3 m/s en dirección
      horizontal. Si la barca está en reposo, se pide determinar la velocidad
      final de la barca en los siguientes tres casos:

      a. Los dos bañistas saltan a la vez

      b. Primero salta $A$ y después $B$.

      c. Primero salta $B$ y después $A$

      *Dato del texto en euskera, que el castellano omite: la barca tiene
      una masa de 200 kg.*
    pide: La velocidad final de la barca en los tres casos, en metros por segundo.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué se conserva durante cada salto, y qué significa que la velocidad
          sea relativa a la barca?
        opciones:
          - texto: El momento lineal horizontal del conjunto, y que la velocidad del bañista respecto del suelo es la de la barca más los 3 m/s
            correcta: true
            mensaje: |
              Eso es. En horizontal no hay fuerzas exteriores —el agua se
              desprecia—, así que $\vec{L}$ se conserva, y hay que escribir
              todas las velocidades respecto del suelo antes de sumarlas.
          - texto: La energía mecánica, porque no hay rozamiento con el agua
            mensaje: |
              Un salto es un impulso hecho con los músculos: se aporta energía
              nueva, que no estaba antes. Lo que no cambia es el momento
              lineal total, porque las fuerzas del salto son internas.
          - texto: El momento lineal, y la velocidad del bañista respecto del suelo es directamente 3 m/s
            mensaje: |
              Los 3 m/s son relativos a la barca, que ya se está moviendo
              hacia el otro lado. Respecto del suelo el bañista va a
              $v_{barca} + 3$, y confundirlos cambia el resultado.
      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **la barca con los dos bañistas a
          bordo, como un solo sistema, con las fuerzas exteriores que actúan
          sobre él**. Sin escala.
        comprueba:
          - punto: |
              **El peso del conjunto, $M\,g$, vertical y hacia abajo, con
              $M = 325$ kg.**
            porque: |
              Los dos bañistas, 75 y 50 kg, y la barca, 200 kg.
          - punto: |
              **El empuje del agua, vertical y hacia arriba.**
            porque: |
              El agua sostiene el sistema: equilibra el peso.
          - punto: |
              **Ninguna fuerza exterior horizontal.**
            porque: |
              Se desprecia la resistencia del agua. Las fuerzas del salto, con
              las que los bañistas y la barca se empujan, son interiores al
              sistema.
        figura: |
          <svg viewBox="4 27 196 107" role="img" width="196" height="107" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">Sólido libre de la barca con los dos bañistas a bordo</title>
            <desc id="dsl-d">La barca con los dos bañistas de pie en la popa, como un solo sistema, con el agua quitada y a trazos. Sobre el sistema, el peso del conjunto, vertical hacia abajo, y el empuje del agua, vertical hacia arriba. Ninguna fuerza horizontal.</desc>
            <defs>
              <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
              </marker>
              <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
              </marker>
              <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
              </marker>
            </defs>
            <path d="M30 70 H170 L155 92 H45 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M128 40 H142 V70 H128 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M148 47 H158 V70 H148 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M8 84 H192" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
            <line x1="100" y1="72" x2="100" y2="112" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
            <text x="105" y="110" font-size="10" text-anchor="start" fill="var(--flag)">Mg</text>
            <line x1="70" y1="128" x2="70" y2="92.5" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
            <text x="64" y="122" font-size="10" text-anchor="end" fill="var(--d2-tinta)">E</text>
            <circle cx="100" cy="72" r="2.4" fill="var(--ink)"/>
            <text x="94" y="68" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">G</text>
            <text x="135" y="36" font-size="9" text-anchor="middle" fill="var(--faint)">A</text>
            <text x="153" y="43" font-size="9" text-anchor="middle" fill="var(--faint)">B</text>
          </svg>

      - tipo: calcular
        titulo: Los dos a la vez
        pregunta: |
          Si los dos bañistas saltan a la vez, ¿qué velocidad final coge la
          barca?
        respuesta:
          tipo: magnitud
          valor: '1.154 m/s'
          formato: una velocidad, con su unidad
        distractores:
          - valor: '1.5 m/s'
            mensaje: |
              Ese valor sale de dividir $(m_A+m_B)v_r$ entre $m_B+m_C = 250$
              kg, y es el que imprime por error la resolución del curso. En el
              denominador va la masa **total** del sistema, 325 kg.
          - valor: '1.875 m/s'
            mensaje: |
              Has dividido entre la masa de la barca sola, 200 kg. Al plantear
              la conservación, los bañistas también llevan cantidad de
              movimiento y su masa entra en el reparto.
          - valor: '3 m/s'
            mensaje: |
              Esa es la velocidad relativa de los bañistas, no la de la barca.
              La barca es mucho más pesada que ellos y retrocede bastante
              menos.
        pista: |
          $0 = (m_A+m_B)(v_C+v_r) + m_C v_C$, con $v_r = 3$ m/s en el sentido
          del salto.
        desarrollo: |
          $$
          v_C = \frac{(m_A+m_B)\,v_r}{m_A+m_B+m_C} = \frac{125 \cdot 3}{325} = 1{,}154\ \text{m/s}
          $$

          en sentido contrario al salto.
      - tipo: calcular
        titulo: Primero A y después B
        pregunta: |
          Si salta primero $A$ y después $B$, ¿con qué velocidad se queda
          finalmente la barca?
        respuesta:
          tipo: magnitud
          valor: '1.292 m/s'
          formato: una velocidad, con su unidad
        distractores:
          - valor: '1.154 m/s'
            mensaje: |
              Has usado la masa inicial, 325 kg, también en el segundo salto.
              Cuando salta $B$, $A$ ya no está a bordo: el sistema pesa 250 kg
              y por eso el segundo salto es más eficaz.
          - valor: '0.692 m/s'
            mensaje: |
              Esa es la velocidad de la barca después del **primer** salto,
              solo con $A$ fuera. Falta aplicar la conservación otra vez para
              el salto de $B$.
          - valor: '1.615 m/s'
            mensaje: |
              Has tomado los 3 m/s de $B$ respecto del suelo en el segundo
              salto. Son relativos a la barca, que ya se mueve a 0,692 m/s en
              sentido contrario.
        pista: |
          Primero $0 = m_A(v_{C1}+v_r) + (m_B+m_C)v_{C1}$; después,
          $(m_B+m_C)v_{C1} = m_B(v_{C2}+v_r) + m_C v_{C2}$.
        desarrollo: |
          $$
          v_{C1} = \frac{75 \cdot 3}{325} = 0{,}692\ \text{m/s}
          \qquad
          v_{C2} = v_{C1} + \frac{50 \cdot 3}{250} = 0{,}692 + 0{,}600
          $$

          $$
          v_{C2} = 1{,}292\ \text{m/s}
          $$
      - tipo: calcular
        titulo: Primero B y después A
        pregunta: |
          Y si salta primero $B$ y después $A$, ¿cuál es la velocidad final de
          la barca?
        respuesta:
          tipo: magnitud
          valor: '1.280 m/s'
          formato: una velocidad, con su unidad
        distractores:
          - valor: '1.154 m/s'
            mensaje: |
              Otra vez la masa inicial en los dos saltos. Al saltar $A$ en
              segundo lugar, a bordo quedan 275 kg y no 325.
          - valor: '0.818 m/s'
            mensaje: |
              Has calculado solo el efecto del salto de $A$ sobre 275 kg,
              olvidando que la barca ya llevaba 0,4615 m/s del salto de $B$.
              Los dos impulsos se suman.
          - valor: '0.461 m/s'
            mensaje: |
              Esa es la velocidad tras el primer salto, el de $B$. Falta el
              segundo.
        pista: |
          $v_{C1} = m_B v_r/(m_A+m_B+m_C)$ y luego
          $v_{C2} = v_{C1} + m_A v_r/(m_A+m_C)$.
        desarrollo: |
          $$
          v_{C1} = \frac{50 \cdot 3}{325} = 0{,}4615\ \text{m/s}
          \qquad
          v_{C2} = 0{,}4615 + \frac{75 \cdot 3}{275} = 0{,}4615 + 0{,}8182
          $$

          $$
          v_{C2} = 1{,}280\ \text{m/s}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'En horizontal no hay fuerzas exteriores, así que en cada salto se conserva el momento lineal del conjunto; las velocidades hay que escribirlas respecto del suelo.'
          - texto: 'Saltando a la vez, $0 = (m_A+m_B)(v_C+v_r) + m_C v_C$ y la barca queda a $1{,}154$ m/s.'
          - texto: 'Por separado la barca queda más rápida —$1{,}292$ m/s si va primero A y $1{,}280$ si va primero B—, porque en el segundo salto la masa que queda a bordo es menor.'
          - texto: 'Como el momento lineal se conserva, la velocidad final de la barca es la misma en los tres casos.'
            trampa: true
            mensaje: |
              Se conserva en **cada** salto, pero el sistema no es el mismo en
              los tres casos: al saltar por separado, el segundo bañista
              empuja una barca más ligera y le saca más velocidad. Por eso
              1,154 frente a 1,292 y 1,280.
    resolucion: |
      **1. Sólidos libres.** Es un problema de conservación del momento
      lineal: el dibujo lleva la barca con los dos bañistas, como un solo
      sistema.

      <figure class="figura-examen">
      <svg viewBox="4 27 196 107" role="img" width="294" height="161" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">Sólido libre de la barca con los dos bañistas a bordo</title>
        <desc id="dsl-d">La barca con los dos bañistas de pie en la popa, como un solo sistema, con el agua quitada y a trazos. Sobre el sistema, el peso del conjunto, vertical hacia abajo, y el empuje del agua, vertical hacia arriba. Ninguna fuerza horizontal.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M30 70 H170 L155 92 H45 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M128 40 H142 V70 H128 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M148 47 H158 V70 H148 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M8 84 H192" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
        <line x1="100" y1="72" x2="100" y2="112" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
        <text x="105" y="110" font-size="10" text-anchor="start" fill="var(--flag)">Mg</text>
        <line x1="70" y1="128" x2="70" y2="92.5" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="64" y="122" font-size="10" text-anchor="end" fill="var(--d2-tinta)">E</text>
        <circle cx="100" cy="72" r="2.4" fill="var(--ink)"/>
        <text x="94" y="68" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">G</text>
        <text x="135" y="36" font-size="9" text-anchor="middle" fill="var(--faint)">A</text>
        <text x="153" y="43" font-size="9" text-anchor="middle" fill="var(--faint)">B</text>
      </svg>
      <figcaption>

      La barca con A y B a bordo, M = 325 kg. Solo actúan fuerzas verticales: en horizontal, nada.

      </figcaption>
      </figure>

      - **El peso** del conjunto, con $M = 75 + 50 + 200 = 325$ kg, y **el
        empuje del agua**, los dos verticales.
      - **El salto**: los bañistas empujan la barca y la barca a ellos. Son
        fuerzas interiores, y se anulan dos a dos.
      - **En horizontal no hay fuerzas exteriores**, con la resistencia del
        agua despreciada: el momento lineal horizontal se conserva en cada
        salto.

      **2. Incógnitas.** La velocidad final de la barca en los tres casos.

      **3. Ecuaciones.** Con positivo el sentido del salto: si la barca sale de
      un salto a $v_C$, el bañista sale a $v_C + v_r$ respecto del suelo, con
      $v_r = 3$ m/s.

      <figure class="figura-examen">
      <svg viewBox="20 28 236 76" role="img" width="354" height="114" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">Las velocidades respecto del suelo justo después de un salto</title>
        <desc id="dsl-d">La barca, que retrocede hacia la izquierda con velocidad v C, y el bañista, ya en el aire a la derecha de la popa, que avanza hacia la derecha con v C más v r respecto del suelo, donde v r son los 3 metros por segundo relativos a la barca.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M30 70 H150 L137 90 H43 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M172 40 H184 V66 H172 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M24 84 H250" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
        <line x1="110" y1="58" x2="66" y2="58" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="88" y="52" font-size="10" text-anchor="middle" fill="var(--ink)" font-style="italic">v<tspan font-size="7.5" dy="2.5">C</tspan></text>
        <line x1="190" y1="50" x2="236" y2="50" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="213" y="44" font-size="10" text-anchor="middle" fill="var(--ink)" font-style="italic">v<tspan font-size="7.5" dy="2.5">C</tspan><tspan dy="-2.5"> + v<tspan font-size="7.5" dy="2.5">r</tspan><tspan dy="-2.5"></tspan></tspan></text>
      </svg>
      <figcaption>

      Positivo, el sentido del salto. La barca retrocede, y el bañista avanza respecto del suelo con la velocidad de la barca más los 3 m/s relativos.

      </figcaption>
      </figure>

      En cada salto, el sistema es lo que hay a bordo justo antes. Si salta
      una masa m, a bordo quedan M′, y la barca iba a $v_0$:

      $$
      (m + M')\,v_0 = m\,(v_C + v_r) + M'\,v_C
      \;\Longrightarrow\;
      v_C = v_0 - \frac{m\,v_r}{m + M'}
      $$

      Cada salto le quita a la barca $m\,v_r$ repartido entre toda la masa que
      había a bordo antes de saltar.

      **4. Resultados.** Con $m_A = 75$, $m_B = 50$ y $m_C = 200$ kg:

      a) Los dos a la vez, desde el reposo:

      $$
      v_C = -\frac{125 \cdot 3}{325} = -1{,}154\ \text{m/s}
      $$

      b) Primero A, con todo a bordo, y después B, con 250 kg a bordo:

      $$
      v_{C1} = -\frac{75 \cdot 3}{325} = -0{,}6923\ \text{m/s},
      \qquad
      v_{C2} = -0{,}6923 - \frac{50 \cdot 3}{250} = -1{,}292\ \text{m/s}
      $$

      c) Primero B, y después A, con 275 kg a bordo:

      $$
      v_{C1} = -\frac{50 \cdot 3}{325} = -0{,}4615\ \text{m/s},
      \qquad
      v_{C2} = -0{,}4615 - \frac{75 \cdot 3}{275} = -1{,}280\ \text{m/s}
      $$

      **La barca retrocede a 1,154 m/s si saltan a la vez, a 1,292 si salta
      primero A y a 1,280 si salta primero B.** La colección publica 1,154,
      1,292 y 1,279; el último, cortando las cifras de 1,2797.

      **5. Comprobación.** Por el momento lineal total al final, con los tres
      cuerpos ya separados: tiene que seguir siendo nulo, como al principio.
      En a), los dos bañistas van a $3 - 1{,}15385 = 1{,}84615$ m/s, y
      $125 \cdot 1{,}84615 = 230{,}77$, lo mismo que la barca hacia atrás,
      $200 \cdot 1{,}15385 = 230{,}77$. En b), A se fue a
      $3 - 0{,}6923 = 2{,}3077$ m/s y B a $3 - 1{,}2923 = 1{,}7077$:

      $$
      75 \cdot 2{,}3077 + 50 \cdot 1{,}7077 = 258{,}46,
      \qquad
      200 \cdot 1{,}2923 = 258{,}46
      $$

      Lo mismo.

      **Lo que dice el resultado.** Saltar por separado deja la barca más
      rápida que saltar a la vez: el segundo bañista empuja una barca
      aligerada, y su $m\,v_r$ se reparte entre menos masa. Y entre los dos
      órdenes hay apenas un 1 %: sale algo mejor que salte primero el pesado,
      porque así el segundo salto, el de B, se reparte entre 250 kg y no entre
      275.

  - id: ejma9-col914-el-barco-y-los-dos-remolcadores
    titulo: El barco remolcado y la potencia de los remolcadores
    fuente: >-
      Ejercicio 9.14 · Tema 9, «Magnitudes y teoremas fundamentales de la
      dinámica» · Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección
      publica los dos resultados y el curso publica su resolución; contra los
      dos está contrastado este desarrollo.
    nivel: practica
    antes:
      idea: |
        A velocidad constante la aceleración es nula, y la segunda ley se
        queda en un equilibrio de fuerzas. La potencia de una fuerza mide lo
        deprisa que trabaja.
      formula: |
        Para una fuerza en la dirección de la velocidad:

        $$
        \sum\vec{F} = m\,\vec{a},
        \qquad
        P = F\,v
        $$

        Con 1 km/h $= 1/3{,}6$ m/s.
      reconocer: |
        Antes de calcular se mira qué fuerzas actúan sobre el barco a lo largo
        de su marcha.
    enunciado: |
      La fuerza de rozamiento entre un barco y el agua viene dada por la
      siguiente expresión $F = K\cdot v^{1,75}$, donde $k$ es una constante y
      $v$ la velocidad del barco. Un único remolcador puede llemar el barco a
      una velociad de 4,5 km/h, haciendo una fuerza constante de 300 kN.

      Determinar:

      a. Potencia desarrollada por el remolcador

      b. La velocidad del barco, si se unen dos remolcadores de la potencia
      calculada en a).
    pide: La potencia del remolcador y la velocidad con dos remolcadores iguales.
    pasos:
      - tipo: reconocer
        pregunta: |
          Con dos remolcadores de la misma potencia, ¿qué es lo que se duplica
          y qué no?
        opciones:
          - texto: Se duplica la potencia, no la fuerza; la fuerza depende de la nueva velocidad a través de la ley de rozamiento
            correcta: true
            mensaje: |
              Eso es. El dato del apartado b es la **potencia**, así que la
              ecuación a resolver es $2P = K v^{2{,}75}$; la fuerza sale
              después y no es el doble de 300 kN.
          - texto: Se duplica la fuerza, así que la velocidad sale de $2F = Kv^{1,75}$
            mensaje: |
              El enunciado dice «dos remolcadores de la potencia calculada en
              a)», no de la fuerza. A mayor velocidad, un motor de potencia
              dada entrega menos fuerza, y por eso el resultado es menor.
          - texto: Se duplica la velocidad, porque hay el doble de tirón
            mensaje: |
              La resistencia crece con $v^{1{,}75}$, así que doblar la
              velocidad multiplicaría la potencia necesaria por
              $2^{2{,}75} \approx 6{,}7$. Con solo el doble de potencia se
              gana mucho menos.
      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el barco solo, mientras lo
          remolcan, con todas las fuerzas que actúan sobre él y con su
          velocidad**. Sin escala.
        comprueba:
          - punto: |
              **El tiro del remolcador, T, hacia delante, a lo largo del
              cable.**
            porque: |
              El remolcador tira del barco por el cable; con uno solo, 300 kN.
          - punto: |
              **La resistencia del agua, $K\,v^{1{,}75}$, hacia atrás.**
            porque: |
              Se opone a la marcha, con la ley del enunciado.
          - punto: |
              **El peso y el empuje del agua, verticales.**
            porque: |
              El barco flota sin subir ni bajar: se anulan.
          - punto: |
              **La velocidad, hacia delante y constante.**
            porque: |
              El remolcador lo lleva a 4,5 km/h fijos: la aceleración es nula.
        figura: |
          <svg viewBox="8 13 250 121" role="img" width="250" height="121" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">Sólido libre del barco remolcado a velocidad constante</title>
            <desc id="dsl-d">El barco, con el agua quitada y a trazos. Hacia delante, el tiro T del cable del remolcador; hacia atrás, la resistencia del agua R; su peso Mg, vertical hacia abajo; y el empuje del agua E, vertical hacia arriba. Encima, la velocidad v, hacia delante.</desc>
            <defs>
              <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
              </marker>
              <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
              </marker>
              <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
              </marker>
            </defs>
            <path d="M50 60 H190 L208 64 L185 90 H60 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M80 44 H120 V60 H80 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M10 80 H250" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
            <line x1="210" y1="64" x2="250" y2="64" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
            <text x="230" y="58" font-size="10" text-anchor="middle" fill="var(--d2-tinta)">T</text>
            <line x1="53" y1="72" x2="15" y2="72" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
            <text x="34" y="66" font-size="10" text-anchor="middle" fill="var(--d2-tinta)">R</text>
            <line x1="130" y1="72" x2="130" y2="112" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
            <text x="135" y="110" font-size="10" text-anchor="start" fill="var(--flag)">Mg</text>
            <line x1="96" y1="128" x2="96" y2="90.5" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
            <text x="90" y="122" font-size="10" text-anchor="end" fill="var(--d2-tinta)">E</text>
            <line x1="130" y1="30" x2="180" y2="30" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
            <text x="155" y="24" font-size="10" text-anchor="middle" fill="var(--ink)" font-style="italic">v</text>
            <circle cx="130" cy="72" r="2.4" fill="var(--ink)"/>
            <text x="136" y="69" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">G</text>
          </svg>

      - tipo: calcular
        titulo: La potencia del remolcador
        pregunta: |
          ¿Qué potencia desarrolla el único remolcador?
        respuesta:
          tipo: magnitud
          valor: '375 kW'
          formato: una potencia, con su unidad
        distractores:
          - valor: '1350 kW'
            mensaje: |
              Has multiplicado por 4,5 sin pasar a metros por segundo.
              $4{,}5\ \text{km/h} = 1{,}25\ \text{m/s}$.
          - valor: '240 kW'
            mensaje: |
              Has dividido la fuerza entre la velocidad en vez de
              multiplicarlas. La potencia de una fuerza es $P = F\,v$.
        pista: |
          $P = F\,v$ con la velocidad en m/s.
        desarrollo: |
          $$
          v = \frac{4{,}5}{3{,}6} = 1{,}25\ \text{m/s}
          \qquad
          P = 300000 \cdot 1{,}25 = 375\ \text{kW}
          $$
      - tipo: calcular
        titulo: La velocidad con dos remolcadores
        pregunta: |
          Con dos remolcadores de esa misma potencia, ¿a qué velocidad se
          mueve el barco?
        respuesta:
          tipo: magnitud
          valor: '5.790 km/h'
          formato: una velocidad, con su unidad
        distractores:
          - valor: '9 km/h'
            mensaje: |
              Has doblado la velocidad. Con la resistencia creciendo como
              $v^{1{,}75}$, la potencia necesaria crece como $v^{2{,}75}$, y
              doblar la velocidad pediría casi siete veces la potencia.
          - valor: '6.687 km/h'
            mensaje: |
              Has doblado la **fuerza** en lugar de la potencia, resolviendo
              $2F = Kv^{1{,}75}$. El enunciado da la potencia de cada
              remolcador, no su tiro.
          - valor: '4.5 km/h'
            mensaje: |
              Esa es la velocidad con un solo remolcador. Con el doble de
              potencia el barco va más rápido, aunque bastante menos del
              doble.
        pista: |
          A velocidad constante $2P = F\,v = K v^{1{,}75}\,v = K v^{2{,}75}$,
          con $K = F/v_1^{1{,}75} = 203015$.
        desarrollo: |
          $$
          K = \frac{300000}{1{,}25^{1{,}75}} = \frac{300000}{1{,}47773} = 203015
          $$

          $$
          v = \left(\frac{2P}{K}\right)^{1/2{,}75} = \left(\frac{750000}{203015}\right)^{0{,}36364}
          = 1{,}6083\ \text{m/s} = 5{,}790\ \text{km/h}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'A velocidad constante la aceleración es nula, así que el tiro del remolcador iguala a la resistencia del agua.'
          - texto: '$P = F v = 300 \cdot 1{,}25 = 375$ kW, y de $F = K v^{1{,}75}$ sale $K = 203015$.'
          - texto: 'Con dos remolcadores, $2P = K v^{2{,}75}$ y $v = 1{,}608$ m/s, o sea $5{,}79$ km/h.'
          - texto: 'Como la potencia se dobla y la potencia es fuerza por velocidad, la velocidad se dobla también.'
            trampa: true
            mensaje: |
              Eso valdría si la fuerza fuera constante, y aquí crece con la
              velocidad. Sustituyendo $F = Kv^{1{,}75}$ queda
              $P = Kv^{2{,}75}$, así que la velocidad va con la potencia
              elevada a $1/2{,}75$: doblar $P$ la multiplica por 1,29.
    resolucion: |
      **1. Sólidos libres.** Es un problema de dinámica a velocidad constante:
      el dibujo lleva el barco solo, mientras lo remolcan.

      <figure class="figura-examen">
      <svg viewBox="8 13 250 121" role="img" width="375" height="182" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">Sólido libre del barco remolcado a velocidad constante</title>
        <desc id="dsl-d">El barco, con el agua quitada y a trazos. Hacia delante, el tiro T del cable del remolcador; hacia atrás, la resistencia del agua R; su peso Mg, vertical hacia abajo; y el empuje del agua E, vertical hacia arriba. Encima, la velocidad v, hacia delante.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M50 60 H190 L208 64 L185 90 H60 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M80 44 H120 V60 H80 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M10 80 H250" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
        <line x1="210" y1="64" x2="250" y2="64" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="230" y="58" font-size="10" text-anchor="middle" fill="var(--d2-tinta)">T</text>
        <line x1="53" y1="72" x2="15" y2="72" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="34" y="66" font-size="10" text-anchor="middle" fill="var(--d2-tinta)">R</text>
        <line x1="130" y1="72" x2="130" y2="112" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
        <text x="135" y="110" font-size="10" text-anchor="start" fill="var(--flag)">Mg</text>
        <line x1="96" y1="128" x2="96" y2="90.5" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="90" y="122" font-size="10" text-anchor="end" fill="var(--d2-tinta)">E</text>
        <line x1="130" y1="30" x2="180" y2="30" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="155" y="24" font-size="10" text-anchor="middle" fill="var(--ink)" font-style="italic">v</text>
        <circle cx="130" cy="72" r="2.4" fill="var(--ink)"/>
        <text x="136" y="69" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">G</text>
      </svg>
      <figcaption>

      El barco remolcado. A velocidad constante, el tiro iguala a la resistencia, y el empuje al peso.

      </figcaption>
      </figure>

      - **El tiro**, T, hacia delante, a lo largo del cable.
      - **La resistencia del agua**, $R = K\,v^{1{,}75}$, hacia atrás.
      - **El peso y el empuje**, verticales, se anulan: no entran a lo largo
        de la marcha.

      **2. Incógnitas.** La potencia de un remolcador, P, la constante K de la
      ley de rozamiento y la velocidad con dos remolcadores, $v_2$.

      **3. Ecuaciones.** A velocidad constante no hay aceleración, y el tiro
      iguala a la resistencia. La potencia del tiro, que va en la dirección de
      la velocidad:

      $$
      T = K\,v^{1{,}75},
      \qquad
      P = T\,v = K\,v^{2{,}75}
      $$

      Con un remolcador, $T = 300$ kN a $v_1 = 4{,}5/3{,}6 = 1{,}25$ m/s. Con
      dos de la misma potencia, lo que se dobla es la potencia, no el tiro:
      $2P = K\,v_2^{2{,}75}$.

      **4. Resultados.** a) La potencia, y de paso la constante:

      $$
      P = F\,v_1 = 300000 \cdot 1{,}25 = 375\ \text{kW}
      $$

      $$
      K = \frac{300000}{1{,}25^{1{,}75}} = \frac{300000}{1{,}47773} = 203015
      $$

      b) Con dos remolcadores:

      $$
      v_2 = \left(\frac{750000}{203015}\right)^{1/2{,}75} = 1{,}6083\ \text{m/s} = 5{,}790\ \text{km/h}
      $$

      **El remolcador desarrolla 375 kW, y con dos el barco va a 5,790
      km/h.** Los dos coinciden con los publicados.

      **5. Comprobación.** Sin la constante K. Como la potencia va con
      $v^{2{,}75}$, al doblarla la velocidad se multiplica por
      $2^{1/2{,}75} = 1{,}28666$, y $1{,}25 \cdot 1{,}28666 = 1{,}6083$ m/s.
      Y al revés, desde la fuerza: a esa velocidad la resistencia es
      $K\,v_2^{1{,}75} = 466{,}32$ kN, y su potencia,
      $466{,}32 \cdot 1{,}6083 = 750{,}0$ kW, la de los dos remolcadores. Lo
      mismo.

      **Lo que dice el resultado.** Doblar la potencia solo sube la velocidad
      un 29 %: la resistencia crece con $v^{1{,}75}$, y la potencia que pide,
      con $v^{2{,}75}$.

