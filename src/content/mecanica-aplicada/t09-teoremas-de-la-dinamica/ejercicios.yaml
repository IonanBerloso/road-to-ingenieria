        <line x1="310" y1="40" x2="310" y2="180" stroke="var(--ink)" stroke-width="1.6"/>
        <line x1="336" y1="40" x2="336" y2="180" stroke="var(--faint)" stroke-width="0.9" marker-end="url(#ejma9-col911-c)" marker-start="url(#ejma9-col911-c2)"/>
        <text x="342" y="114" font-size="11" fill="var(--faint)">L</text>
