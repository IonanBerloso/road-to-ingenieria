    pide: La tensión antes y después de tocar el clavo, y la velocidad con la cuerda vertical.
    pasos:
      - tipo: reconocer
        pregunta: |
          En el instante en que la cuerda apoya en el clavo $A$, ¿qué cambia y
          qué no?
        opciones:
          - texto: La velocidad no cambia, pero el radio de giro se reduce a la mitad, así que la aceleración normal se duplica
            correcta: true
            mensaje: |
              Eso es. El clavo no hace trabajo ni cambia la velocidad en ese
              instante; solo acorta el radio. Con $v$ igual y $R$ la mitad,
              $v^{2}/R$ se duplica y la tensión salta de golpe.
          - texto: La velocidad se reduce a la mitad, porque el radio se reduce a la mitad
            mensaje: |
              Eso sería si se conservara el momento angular respecto de un
              punto fijo común, y aquí el centro de giro **cambia** de $O$ a
              $A$. Lo que no cambia es la velocidad, porque el impulso es
              instantáneo y perpendicular.
          - texto: La tensión no cambia, porque la masa y el ángulo son los mismos
            mensaje: |
              La tensión no depende solo del ángulo: también del radio, a
              través de $m v^{2}/R$. Con la mitad de radio, ese término se dobla y
              la tensión pasa de $1{,}5mg$ a $2{,}5mg$.
      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **la partícula sola, en el instante
          en que la cuerda llega al clavo, con todas las fuerzas que actúan
          sobre ella y con su aceleración normal**. Sin escala.
        comprueba:
          - punto: |
              **El peso, $m\,g$, vertical y hacia abajo.**
            porque: |
              La masa no se da: los resultados saldrán en múltiplos de $m\,g$.
          - punto: |
              **La tensión, a lo largo de la cuerda, hacia O: 30° por encima
              de la horizontal.**
            porque: |
              La cuerda está alineada con OA, que baja 30° desde O; vista desde
              la partícula, sube 30° hacia O.
          - punto: |
              **La aceleración normal, a lo largo de la cuerda, hacia el centro
              de giro.**
            porque: |
              La partícula recorre un arco de circunferencia, y su velocidad es
              perpendicular a la cuerda.
          - punto: |
              **Ninguna fuerza más.**
            porque: |
              La partícula cuelga en el aire y no hay rozamiento: solo la toca
              la cuerda.
