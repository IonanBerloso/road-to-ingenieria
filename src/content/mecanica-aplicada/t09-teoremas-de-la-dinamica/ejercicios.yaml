        <text x="83" y="186" font-size="11" text-anchor="middle" fill="var(--faint)">175</text>
        <line x1="230" y1="120" x2="168.1" y2="181.9" stroke="var(--faint)" stroke-width="0.9" marker-end="url(#ejma9-col98-c)"/>
        <text x="208" y="158" font-size="11" fill="var(--faint)">125</text>
