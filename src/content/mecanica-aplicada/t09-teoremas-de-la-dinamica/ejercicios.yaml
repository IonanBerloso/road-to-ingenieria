      - tipo: calcular
        titulo: La tensión del hilo
        pregunta: |
          Escribiendo el equilibrio vertical con $g = 9{,}81$ m/s², ¿cuánto vale la tensión $T$,
          igual en los dos tramos?
        respuesta:
          tipo: magnitud
          valor: '31.18 N'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '24.53 N'
            mensaje: |
              Has repartido el peso a medias entre los dos tramos sin
              proyectar. Los hilos están inclinados, así que solo su
              componente vertical sostiene el peso.
          - valor: '40.63 N'
            mensaje: |
              Has usado los senos donde van los cosenos. El ángulo se mide
              con el eje **vertical**, así que la componente vertical de cada
              tensión es $T\cos\alpha$.
        pista: |
          Los dos tramos tiran hacia arriba y hacia el eje. En vertical,
          $T\cos 30^{\circ} + T\cos 45^{\circ} = m\,g$.
        desarrollo: |
          $$
          T = \frac{m\,g}{\cos 30^{\circ} + \cos 45^{\circ}}
          = \frac{5 \cdot 9{,}81}{0{,}8660 + 0{,}7071} = 31{,}18\ \text{N}
          $$
      - tipo: calcular
        titulo: La velocidad de giro
        pregunta: |
          Con esa tensión, ¿cuál es la velocidad $v$ de la esferita?
        respuesta:
          tipo: magnitud
          valor: '3.47 m/s'
          formato: una velocidad, con su unidad
        distractores:
          - valor: '1.437 m/s'
            mensaje: |
              Has restado las componentes horizontales. Los dos puntos de
              anclaje están del mismo lado del eje, por encima de $C$, así que
              las dos componentes horizontales apuntan al eje y se suman.
          - valor: '3.962 m/s'
            mensaje: |
              Eso es un péndulo cónico de un solo hilo a $45^{\circ}$,
              $v=\sqrt{g\,R\tan 45^{\circ}}$. Aquí tiran dos tramos con
              ángulos distintos y hay que sumar sus dos componentes.
        pista: |
          En horizontal, $T\operatorname{sen}30^{\circ} + T\operatorname{sen}45^{\circ} = m\,v^{2}/R$
          con $R = 1{,}6$ m.
        desarrollo: |
          $$
          v = \sqrt{g\,R\,\frac{\operatorname{sen}30^{\circ}+\operatorname{sen}45^{\circ}}{\cos 30^{\circ}+\cos 45^{\circ}}}
          = \sqrt{9{,}81 \cdot 1{,}6 \cdot \frac{1{,}2071}{1{,}5731}}
          $$

          $$
          v = \sqrt{12{,}044} = 3{,}470\ \text{m/s}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Con $v$ constante solo hay aceleración normal: horizontal, hacia el eje y de módulo $v^{2}/R$.'
          - texto: En vertical no hay aceleración, así que $T\cos 30^{\circ} + T\cos 45^{\circ} = m\,g$ y $T = 31{,}18$ N.
          - texto: En horizontal, $T\operatorname{sen}30^{\circ} + T\operatorname{sen}45^{\circ} = m\,v^{2}/R$, de donde $v = 3{,}47$ m/s.
          - texto: Como los dos tramos tienen la misma tensión, cada uno sostiene la mitad del peso y $T = m\,g/2$.
            trampa: true
            mensaje: |
              Que la tensión sea la misma no reparte el peso a medias: los dos
              tramos están inclinados **ángulos distintos**, así que sus
              componentes verticales, $T\cos 30^{\circ}$ y $T\cos 45^{\circ}$,
              no son iguales.
    resolucion: |
