        <line x1="292" y1="58" x2="244" y2="66.5" stroke="var(--flag)" stroke-width="1.8" marker-end="url(#ejma9-col910-f)"/>
        <text x="298" y="54" font-size="12" fill="var(--flag)">F</text>
        <path d="M80 160 A 50 50 0 0 0 79.2 151.3" fill="none" stroke="var(--faint)" stroke-width="1" stroke-dasharray="3 2"/>
        <text x="86" y="156" font-size="11" fill="var(--ink)">10º</text>
      </svg>
      </figure>
    pide: Las aceleraciones de A y de B y el desplazamiento de A sobre B.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuánto vale la normal entre $A$ y $B$, y cuánto la de $B$ contra el
          plano?
        opciones:
          - texto: 'La primera, $m_A g\cos 10^{\circ}$; la segunda, esa más $m_B g\cos 10^{\circ}$, porque B soporta también el peso de A'
            correcta: true
            mensaje: |
              Eso es. Ninguno de los dos despega del plano, así que en la
              dirección perpendicular no hay aceleración y las normales salen
              del equilibrio, acumulándose de arriba abajo.
          - texto: Las dos valen lo mismo, porque los bloques se mueven juntos
            mensaje: |
              No se mueven juntos —$A$ desliza sobre $B$— y, aunque lo
              hicieran, la normal del suelo tendría que soportar los dos
              pesos, no solo el de $B$.
          - texto: 'La primera, $m_A g$; la segunda, $(m_A+m_B) g$, porque la normal equilibra el peso'
            mensaje: |
              La normal equilibra solo la **componente perpendicular** del
              peso. En un plano a $10^{\circ}$ eso es $m g\cos 10^{\circ}$, y
              la componente que queda a lo largo del plano es la que empuja.
      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el bloque A y el bloque B, cada
          uno por separado, con todas las fuerzas que actúan sobre él**. Sin
          escala.
        comprueba:
          - punto: |
              **Sobre A: F, a lo largo del plano y hacia abajo; su peso,
              $m_A\,g = 196{,}2$ N; y, en su cara de abajo, la normal de B y el
              rozamiento de B.**
            porque: |
              Además de F, lo único que toca A es B.
          - punto: |
              **El rozamiento de B sobre A, hacia arriba del plano.**
            porque: |
              Se supone que A, empujado por F, desliza hacia abajo sobre B; el
              rozamiento se opone a ese deslizamiento. Las cuentas lo
              confirmarán si A sale con más aceleración que B.
          - punto: |
              **Sobre B, en su cara de arriba, las mismas dos fuerzas cambiadas
              de sentido: la normal hacia el plano y el rozamiento hacia
              abajo.**
            porque: |
              Acción y reacción: lo que B hace sobre A, A lo hace sobre B al
              revés.
          - punto: |
              **Sobre B, su peso, $m_B\,g = 294{,}3$ N, y en su cara de abajo
              la normal del plano y el rozamiento del plano, hacia arriba.**
            porque: |
              Se supone que B también desliza hacia abajo, y el plano se opone.
