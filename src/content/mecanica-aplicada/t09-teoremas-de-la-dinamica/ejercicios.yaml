      - tipo: calcular
        titulo: La aceleración del bloque A
        pregunta: |
          ¿Cuánto vale la aceleración de $A$ a lo largo del plano?
        respuesta:
          tipo: magnitud
          valor: '22.84 m/s^2'
          formato: una aceleración, con su unidad
        distractores:
          - valor: '25 m/s^2'
            mensaje: |
              Has usado solo $F/m_A$. Sobre $A$ actúan además la componente de
              su peso, a favor, y el rozamiento con $B$, en contra.
          - valor: '26.70 m/s^2'
            mensaje: |
              Te has dejado el rozamiento entre $A$ y $B$, que con
              $\mu = 0{,}4$ y $N_{AB} = 193{,}2$ N son 77,3 N en contra, casi
              cuatro metros por segundo al cuadrado.
          - valor: '10 m/s^2'
            mensaje: |
              Has repartido la fuerza entre las dos masas,
              $F/(m_A+m_B)$. Los bloques no se mueven juntos: $A$ desliza
              sobre $B$ y cada uno tiene su ecuación.
        pista: |
          $F + m_A g\operatorname{sen}10^{\circ} - \mu_{AB} N_{AB} = m_A a_A$
          con $N_{AB} = m_A g\cos 10^{\circ} = 193{,}2$ N.
        desarrollo: |
          $$
          a_A = \frac{500 + 34{,}07 - 77{,}29}{20} = \frac{456{,}78}{20} = 22{,}84\ \text{m/s}^{2}
          $$
      - tipo: calcular
        titulo: La aceleración del bloque B
        pregunta: |
          ¿Y la de $B$?
        respuesta:
          tipo: magnitud
          valor: '2.670 m/s^2'
          formato: una aceleración, con su unidad
        distractores:
          - valor: '22.84 m/s^2'
            mensaje: |
              Esa es la de $A$. $B$ no recibe la fuerza $F$; solo lo arrastra
              el rozamiento que $A$ le hace encima, y lo frena el del plano.
          - valor: '4.28 m/s^2'
            mensaje: |
              Te has dejado el rozamiento de $B$ contra el plano. Con
              $N_{BP} = 483{,}0$ N y $\mu = 0{,}1$ son 48,3 N en contra.
          - valor: '0.0933 m/s^2'
            mensaje: |
              Has olvidado que el rozamiento de $A$ sobre $B$ **arrastra** a
              $B$ hacia abajo del plano. $A$ desliza hacia abajo respecto de
              $B$, así que le hace un rozamiento hacia abajo de 77,3 N.
        pista: |
          $m_B g\operatorname{sen}10^{\circ} + \mu_{AB}N_{AB} - \mu_{BP}N_{BP} = m_B a_B$,
          con $N_{BP} = N_{AB} + m_B g\cos 10^{\circ} = 483{,}0$ N.
        desarrollo: |
          $$
          a_B = \frac{51{,}10 + 77{,}29 - 48{,}30}{30} = \frac{80{,}09}{30} = 2{,}670\ \text{m/s}^{2}
          $$
      - tipo: calcular
        titulo: Lo que A avanza sobre B
        pregunta: |
          Cuando $A$ ha recorrido 0,2 m sobre el plano, ¿cuánto ha recorrido
          sobre $B$?
        respuesta:
          tipo: magnitud
          valor: '0.1766 m'
          formato: una longitud, con su unidad
        distractores:
          - valor: '0.2 m'
            mensaje: |
              Eso sería si $B$ estuviera quieto, y $B$ también acelera:
              $2{,}67\ \text{m/s}^{2}$. Hay que restar lo que $B$ ha avanzado
              en ese mismo tiempo.
          - valor: '0.0234 m'
            mensaje: |
              Eso es lo que recorre $B$, no lo que $A$ recorre **sobre** $B$.
              El desplazamiento relativo es la diferencia,
              $0{,}2 - 0{,}0234$.
        pista: |
          Las dos aceleraciones son constantes, así que en el mismo tiempo
          $x_B/x_A = a_B/a_A$ y $x_{A/B} = x_A\left(1 - a_B/a_A\right)$.
        desarrollo: |
          $$
          x_{A/B} = x_A\left(1 - \frac{a_B}{a_A}\right)
          = 0{,}2\left(1 - \frac{2{,}670}{22{,}84}\right) = 0{,}2 \cdot 0{,}8831 = 0{,}1766\ \text{m}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Perpendicularmente al plano no hay aceleración: $N_{AB} = m_A g\cos 10^{\circ} = 193{,}2$ N y $N_{BP} = N_{AB} + m_B g\cos 10^{\circ} = 483{,}0$ N.'
          - texto: 'Para A, $F + m_A g\operatorname{sen}10^{\circ} - \mu_{AB}N_{AB} = m_A a_A$, y sale $a_A = 22{,}84\ \text{m/s}^{2}$.'
          - texto: 'Para B, el rozamiento de A lo arrastra y el del plano lo frena, y sale $a_B = 2{,}67\ \text{m/s}^{2}$; como las dos son constantes, $x_{A/B} = x_A(1-a_B/a_A) = 0{,}177$ m.'
          - texto: 'Como A y B están en contacto y ninguno se despega, tienen la misma aceleración y se pueden tratar como un solo cuerpo de 50 kg.'
            trampa: true
            mensaje: |
              Estar en contacto no obliga a moverse igual: entre $A$ y $B$ hay
              deslizamiento, y por eso el enunciado pregunta justo cuánto se
              desplaza uno sobre el otro. Tratarlos como uno daría
              $10{,}74\ \text{m/s}^{2}$ para los dos y el apartado b no tendría
              respuesta.
    resolucion: |
      **1. Sólidos libres.** Es un problema de dinámica de dos cuerpos con
      rozamiento: el dibujo lleva cada bloque por separado, con el plano a
      10°.

      <figure class="figura-examen">
      <svg viewBox="30 52 304 168" role="img" width="456" height="252" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">Sólidos libres de los dos bloques apilados en el plano inclinado</title>
        <desc id="dsl-d">A la izquierda, el bloque A solo, con la cara de B en que apoya quitada y a trazos: la fuerza F, a lo largo del plano y hacia abajo; su peso; la normal de B, perpendicular al plano; y el rozamiento de B, a lo largo del plano y hacia arriba. A la derecha, el bloque B solo, con el plano quitado y a trazos: en su cara de arriba, la normal de A, hacia el plano, y el rozamiento de A, hacia abajo del plano; su peso; y en su cara de abajo, la normal del plano y el rozamiento del plano, hacia arriba.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
