        <line x1="95" y1="30" x2="95" y2="290" stroke="var(--ink)" stroke-width="1.2"/>
        <line x1="110" y1="30" x2="110" y2="290" stroke="var(--ink)" stroke-width="1.2"/>
        <line x1="120" y1="172" x2="254" y2="285" stroke="var(--ink)" stroke-width="5" stroke-opacity="0.35"/>
