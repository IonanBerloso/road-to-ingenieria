            <text x="92" y="140" font-size="9" text-anchor="middle" fill="var(--faint)">de frente: plano xy</text>
            <text x="248" y="140" font-size="9" text-anchor="middle" fill="var(--faint)">desde arriba: plano xz</text>
          </svg>

      - tipo: calcular
        titulo: La energía cinética del sistema
        pregunta: |
          ¿Cuánto vale la energía cinética total $T$ del sistema?
        respuesta:
          tipo: magnitud
          valor: '96.5 J'
          formato: una energía, con su unidad
        distractores:
          - valor: '193 J'
            mensaje: |
              Te has dejado el $\tfrac12$. La energía cinética de cada
              partícula es $\tfrac12 m_i v_i^{2}$, no $m_i v_i^{2}$.
          - valor: '48.25 J'
            mensaje: |
              Has dividido entre dos de más, seguramente aplicando el $\tfrac12$
              dos veces. Suma $\tfrac12 m_i v_i^{2}$ partícula a partícula.
          - valor: '56.25 J'
            mensaje: |
              Eso es $\tfrac12 M v_G^{2}$ con $v_G = \vec{L}/M$, o sea solo el
              término de arrastre del teorema de König. Falta la energía del
              movimiento relativo a $G$.
        pista: |
          $T = \sum \tfrac12 m_i\,\vec{v}_i\cdot\vec{v}_i$, con
          $v_A^{2}=29$, $v_B^{2}=25$ y $v_C^{2}=38$.
        desarrollo: |
          $$
          T = \tfrac12\left(1 \cdot 29 + 2 \cdot 25 + 3 \cdot 38\right)
          = \tfrac12\left(29 + 50 + 114\right) = 96{,}5\ \text{J}
          $$
      - tipo: calcular
        titulo: La componente y del momento angular en G
        pregunta: |
          Usando el cambio de punto, ¿cuánto vale la componente $y$ de
          $\vec{H}_G$, en kg·m²/s?
        respuesta:
          tipo: numero
          valor: '24.5'
          tolerancia: 0.2
          formato: un número, en kg·m²/s
        distractores:
          - valor: '65'
            mensaje: |
              Esa es la componente $y$ de $\vec{H}_O$. Falta restarle la del
              producto $\overrightarrow{OG}\times\vec{L}$, que vale $40{,}5$.
          - valor: '105.5'
            mensaje: |
              Has sumado el producto en vez de restarlo. La relación es
              $\vec{H}_O = \vec{H}_G + \overrightarrow{OG}\times\vec{L}$, así
              que $\vec{H}_G = \vec{H}_O - \overrightarrow{OG}\times\vec{L}$.
        pista: |
          $\overrightarrow{OG} = (3;\ 1{,}5;\ 1{,}5)$ y
          $\vec{L} = (17;\ 19;\ -5)$; el producto vectorial da
          $(-36;\ 40{,}5;\ 31{,}5)$.
        desarrollo: |
          $$
          \vec{H}_G = \vec{H}_O - \overrightarrow{OG}\times\vec{L}
          = (-34;\ 65;\ 57) - (-36;\ 40{,}5;\ 31{,}5)
          $$

          $$
          \vec{H}_G = 2\vec{i} + 24{,}5\vec{j} + 25{,}5\vec{k}\ \ \text{kg}\cdot\text{m}^{2}/\text{s}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: '$M = 6$ kg y $\overrightarrow{OG} = \sum m_i\vec{r}_i / M = (3;\ 1{,}5;\ 1{,}5)$ m.'
          - texto: '$\vec{L} = \sum m_i\vec{v}_i = (17;\ 19;\ -5)$ kg·m/s, y de ahí $\vec{v}_G = \vec{L}/M$.'
          - texto: '$\vec{H}_O = \sum \overrightarrow{OA_i}\times m_i\vec{v}_i = (-34;\ 65;\ 57)$, y $\vec{H}_G$ sale del cambio de punto.'
          - texto: 'La energía potencial se calcula con la altura de cada partícula sobre el suelo: $V_g = M\,g\,y_G$ solo vale si todas están a la misma altura.'
            trampa: true
            mensaje: |
              Al revés: $V_g = \sum m_i g\,y_i = M\,g\,y_G$ vale **siempre**,
              porque la suma de $m_i y_i$ es por definición $M\,y_G$. Aquí
              $6 \cdot 9{,}81 \cdot 1{,}5 = 88{,}29$ J, el mismo número que
              sumando partícula a partícula.
    resolucion: |
      **1. Posiciones.** Es un problema de magnitudes de un sistema de
      partículas: el dibujo lleva las tres partículas y su centro de masas en
