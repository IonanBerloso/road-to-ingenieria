          <marker id="ejma9-col98-c" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--faint)"/>
          </marker>
          <marker id="ejma9-col98-c2" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M8 0 L0 4 L8 8 z" fill="var(--faint)"/>
          </marker>
        </defs>
        <path d="M10 120 L350 120" fill="none" stroke="var(--faint)" stroke-width="0.8" stroke-dasharray="10 3 2 3"/>
        <path d="M230 20 L230 222" fill="none" stroke="var(--faint)" stroke-width="0.8" stroke-dasharray="10 3 2 3"/>
        <circle cx="230" cy="120" r="87.5" fill="none" stroke="var(--ink)" stroke-width="1.5"/>
        <circle cx="230" cy="120" r="81" fill="none" stroke="var(--ink)" stroke-width="1.5"/>
        <rect x="8" y="96" width="12" height="48" fill="var(--faint)" fill-opacity="0.3" stroke="var(--ink)" stroke-width="1.1"/>
        <path d="M8 100 L0 92 M8 114 L0 106 M8 128 L0 120 M8 142 L0 134" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <circle cx="24" cy="120" r="5" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
