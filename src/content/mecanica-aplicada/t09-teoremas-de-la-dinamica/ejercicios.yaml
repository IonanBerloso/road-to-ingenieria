ejercicios:
  - id: ejma9-el-bloque-y-el-muelle
    titulo: Un bloque que baja por un plano y comprime un muelle
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Un bloque de 2 kg se suelta desde el reposo en un plano inclinado 30°
      sin rozamiento. Después de recorrer 1 m a lo largo del plano, toca un
      muelle de constante $k = 400\ \text{N/m}$, paralelo al plano, y lo
      comprime hasta pararse. Tomando $g = 9{,}8\ \text{m/s}^{2}$, calcular la
      velocidad con la que toca el muelle y la compresión máxima.
    pide: La velocidad al tocar el muelle y la compresión máxima.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué teorema conviene usar, y por qué?
        opciones:
          - texto: El de la energía, porque se piden velocidades y posiciones y todas las fuerzas que trabajan son conservativas
            correcta: true
            mensaje: |
              Eso es. El peso y el muelle son conservativos, y la normal no
              trabaja porque es perpendicular al movimiento. La energía mecánica
              se conserva, y no hace falta saber nada de lo que pasa entre medias.
          - texto: El del momento lineal, porque hay una fuerza resultante
            mensaje: |
              Se puede, pero con el muelle la fuerza cambia con la posición y
              habría que integrar una ecuación diferencial. La energía llega al
              mismo resultado sin integrar.
          - texto: El del momento angular, porque el bloque baja girando
            mensaje: |
              El bloque no gira: se traslada a lo largo del plano. El momento
              angular no aporta nada aquí.

      - tipo: calcular
        titulo: La velocidad al tocar el muelle
        pregunta: |
          ¿A qué velocidad toca el muelle, en m/s?
        respuesta:
          tipo: numero
          valor: '3.13'
          tolerancia: 0.01
          formato: un número, en m/s
        distractores:
          - valor: '4.427'
            mensaje: |
              Has usado 1 m como altura bajada. Es lo que recorre a lo largo del
              plano; la altura es $1 \cdot \sin 30° = 0{,}5\ \text{m}$.
        pista: |
          $\tfrac12 m v^{2} = m\,g\,h$ con $h = 1 \cdot \sin 30°$.
        desarrollo: |
          $$
          v = \sqrt{2\,g\,h} = \sqrt{2 \cdot 9{,}8 \cdot 0{,}5} = \sqrt{9{,}8} = 3{,}130\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La compresión máxima
        pregunta: |
          ¿Cuánto comprime el muelle, en metros?
        respuesta:
          tipo: numero
          valor: '0.2472'
          tolerancia: 0.002
          formato: un número, en m
        distractores:
          - valor: '0.2214'
            mensaje: |
              Has igualado la energía del muelle a la cinética con la que llega,
              9,8 J, y te has dejado que el bloque **sigue bajando** mientras
              comprime: el peso aporta también $m\,g\,x\sin 30°$ en ese tramo.
          - valor: '0.1565'
            mensaje: |
              Has igualado $k\,x^{2}$, sin el $\tfrac12$, a la cinética con la
              que llega, 9,8 J. Son dos errores a la vez: la energía de un
              muelle es $\tfrac12 k x^{2}$, y el peso sigue trabajando mientras
              comprime.
        pista: |
          Desde la salida hasta el punto de parada el bloque baja
          $(1 + x)\sin 30°$: $m\,g\,(1 + x)\sin 30° = \tfrac12 k x^{2}$.
        desarrollo: |
          $$
          2 \cdot 9{,}8 \cdot (1 + x) \cdot 0{,}5 = \tfrac12 \cdot 400\,x^{2}
          \;\Longrightarrow\;
          200\,x^{2} - 9{,}8\,x - 9{,}8 = 0
          $$

          $$
          x = \frac{9{,}8 + \sqrt{9{,}8^{2} + 4 \cdot 200 \cdot 9{,}8}}{400} = 0{,}2472\ \text{m}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: Solo trabajan el peso y el muelle, los dos conservativos; la normal no trabaja. La energía mecánica se conserva.
          - texto: 'Hasta el muelle baja $0{,}5$ m: $v = \sqrt{2 \cdot 9{,}8 \cdot 0{,}5} = 3{,}13$ m/s.'
          - texto: 'Hasta pararse baja $(1 + x)\sin 30°$: $9{,}8\,(1 + x) = 200\,x^{2}$ y $x = 0{,}247$ m.'
          - texto: Toda la energía cinética con la que llega, 9,8 J, se queda en el muelle, así que $\tfrac12 k x^{2} = 9{,}8$.
            trampa: true
            mensaje: |
              Mientras comprime, el bloque sigue bajando y el peso sigue
              trabajando. El muelle se lleva la cinética **más** la potencial de
              ese último tramo, y por eso la compresión es mayor.
    resolucion: |
      **El teorema.** Trabajan el peso y el muelle, conservativos; la normal es
      perpendicular al movimiento y no trabaja. Se conserva $T + V$.

      **Hasta tocar el muelle.** Recorre 1 m y baja $1 \cdot \sin 30° = 0{,}5$ m:

      $$
      \tfrac12 \cdot 2\,v^{2} = 2 \cdot 9{,}8 \cdot 0{,}5 \;\Longrightarrow\; v = 3{,}130\ \text{m/s}
      $$

      **Hasta pararse.** Desde la salida baja $(1 + x)\sin 30°$, y toda esa
      energía acaba en el muelle:

      $$
      9{,}8\,(1 + x) = 200\,x^{2} \;\Longrightarrow\; x = 0{,}2472\ \text{m}
      $$

      Comprobación: $\tfrac12 \cdot 400 \cdot 0{,}2472^{2} = 12{,}22$ J, y
      $2 \cdot 9{,}8 \cdot 1{,}2472 \cdot 0{,}5 = 12{,}22$ J.

  - id: ejma9-la-fuerza-central
    titulo: Una partícula que gira atada a un hilo que se recoge
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Una partícula gira sobre una mesa horizontal sin rozamiento, atada a un
      hilo que pasa por un agujero de la mesa. Cuando el radio es de 0,5 m, su
      velocidad es de 2 m/s. Se tira del hilo desde abajo hasta que el radio es
      de 0,25 m. Calcular la nueva velocidad.
    pide: La velocidad de la partícula con el radio reducido a la mitad.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué magnitud se conserva mientras se recoge el hilo?
        opciones:
          - texto: El momento angular respecto del agujero, porque la tensión pasa siempre por él
            correcta: true
            mensaje: |
              Eso es. La tensión es una fuerza central: su momento respecto del
              agujero es nulo, y por el teorema del momento angular en ese punto
              fijo, $\vec{H}_O$ no cambia.
          - texto: La energía cinética, porque la mesa no tiene rozamiento
            mensaje: |
              Sin rozamiento, pero la tensión sí trabaja: al tirar del hilo, la
              partícula se acerca al agujero en la dirección de la tensión. Ese
              trabajo aumenta la energía cinética.
          - texto: El momento lineal, porque no hay fuerzas horizontales
            mensaje: |
              La tensión es horizontal: es la que obliga a la partícula a girar.
              El momento lineal cambia de dirección todo el tiempo.

      - tipo: calcular
        titulo: La nueva velocidad
        pregunta: |
          ¿Cuál es la velocidad con el radio de 0,25 m, en m/s?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.02
          formato: un número, en m/s
        distractores:
          - valor: '2'
            mensaje: |
              La velocidad no se conserva: la tensión trabaja al recoger el
              hilo. Lo que se conserva es $m\,r\,v$.
          - valor: '8'
            mensaje: |
              Has hecho la velocidad inversamente proporcional a $r^{2}$. Con el
              momento angular $m\,r\,v$ constante, es inversamente proporcional a
              $r$.
          - valor: '2.828'
            mensaje: |
              Has hecho la velocidad inversamente proporcional a $\sqrt{r}$. El
              momento angular es $m\,r\,v$, y la $r$ va sin raíz.
        pista: |
          $m\,r_1\,v_1 = m\,r_2\,v_2$.
        desarrollo: |
          $$
          v_2 = v_1\,\frac{r_1}{r_2} = 2 \cdot \frac{0{,}5}{0{,}25} = 4\ \text{m/s}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: La tensión pasa siempre por el agujero, un punto fijo, así que su momento respecto de él es nulo.
          - texto: 'Por el teorema del momento angular, $H_O = m\,r\,v$ se conserva: $0{,}5 \cdot 2 = 0{,}25\,v_2$.'
          - texto: $v_2 = 4$ m/s, y la energía cinética se multiplica por cuatro, gracias al trabajo de quien tira del hilo.
          - texto: Como la mesa no tiene rozamiento, la energía cinética se conserva y la velocidad sigue siendo 2 m/s.
            trampa: true
            mensaje: |
              La tensión trabaja: al recoger el hilo, la partícula avanza en su
              dirección. Por eso la energía cinética crece. Lo que se conserva es
              el momento angular respecto del agujero.
    resolucion: |
      **Qué se conserva.** La única fuerza horizontal es la tensión, que pasa
      siempre por el agujero $O$, un punto fijo. Su momento respecto de $O$ es
      nulo, y por el teorema del momento angular, $\vec{H}_O$ se conserva. Con la
      velocidad perpendicular al hilo, $H_O = m\,r\,v$:

      $$
      m \cdot 0{,}5 \cdot 2 = m \cdot 0{,}25 \cdot v_2 \;\Longrightarrow\; v_2 = 4\ \text{m/s}
      $$

      **Y la energía.** Pasa de $\tfrac12 m \cdot 4$ a $\tfrac12 m \cdot 16$: se
      multiplica por cuatro. No es una contradicción: la tensión trabaja cuando se
      recoge el hilo, y ese trabajo es justo lo que gana la partícula.
