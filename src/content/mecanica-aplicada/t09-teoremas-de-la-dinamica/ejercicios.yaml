        <desc id="ejma9-col98-d">Una varilla circular de 125 milímetros de radio, con centro O, en un plano vertical. A es el extremo derecho del diámetro horizontal, C el izquierdo y B el punto más bajo. Un muelle une la deslizadera con el punto fijo D de la pared, situado 175 milímetros a la izquierda de C sobre la horizontal de O. En la figura la deslizadera está dibujada en B. Dibujo a escala.</desc>
