    pide: La distancia horizontal máxima L que recorre la carga tras la parada.
    pasos:
      - tipo: reconocer
        pregunta: |
          La grúa se para en seco y la carga sigue con 3 m/s. ¿Qué hace la
          carga y qué teorema conviene?
        opciones:
          - texto: Se convierte en un péndulo de 9 m que sube hasta pararse, y eso se resuelve con la conservación de la energía
            correcta: true
            mensaje: |
              Eso es. El cable no trabaja, porque es perpendicular a la
              velocidad, y no hay rozamiento; se conserva $T+V$ y la carga
              sube hasta que su velocidad se anula.
          - texto: Sigue recto con velocidad constante, porque ya no hay fuerzas horizontales
            mensaje: |
              El cable se inclina en cuanto la carga se adelanta, y entonces
              su tensión sí tiene componente horizontal. La carga describe un
              arco, no una recta.
          - texto: Se para a la vez que la grúa, porque el cable es inextensible
            mensaje: |
              Inextensible impide que la carga se aleje del carro más de 9 m,
              no que gire alrededor de él. La carga conserva su velocidad en
              el instante de la parada y se va hacia delante.
      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **la carga sola, en un instante
          cualquiera de su subida, con las fuerzas que actúan sobre ella**. Sin
          escala.
        comprueba:
          - punto: |
              **El peso, $m\,g$, vertical y hacia abajo.**
            porque: |
              La masa no se da, y no hace falta: se irá de las cuentas.
          - punto: |
              **La tensión, a lo largo del cable, hacia el carro.**
            porque: |
              El cable solo tira, y a lo largo de sí mismo. El carro, ya
              parado, es un punto fijo.
          - punto: |
              **Ninguna fuerza más.**
            porque: |
              La carga cuelga en el aire: no toca nada más que el cable, y no
              hay rozamiento.
        figura: |
          <svg viewBox="30 4 120 182" role="img" width="120" height="182" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">Sólido libre de la carga mientras sube colgada del carro parado</title>
            <desc id="dsl-d">La carga sola, en un instante de su subida, con el cable, quitado y a trazos, girado un ángulo theta respecto de la vertical por el carro O. Sobre ella, la tensión T, a lo largo del cable, hacia O, y su peso mg, vertical hacia abajo.</desc>
            <defs>
              <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
              </marker>
              <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
              </marker>
              <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
              </marker>
            </defs>
            <path d="M118.7 128.8 A8 8 0 1 0 102.7 128.8 A8 8 0 1 0 118.7 128.8 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M60 20 L107.3 121.6" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
            <line x1="60" y1="20" x2="60" y2="120" stroke="var(--faint)" stroke-width="0.7"/>
            <path d="M60 50 A30 30 0 0 0 72.7 47.2" fill="none" stroke="var(--ink)" stroke-width="0.9"/>
            <text x="64" y="66" font-size="10" fill="var(--ink)">θ</text>
            <line x1="107.3" y1="121.6" x2="86.2" y2="76.2" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
            <text x="80" y="84" font-size="10" text-anchor="end" fill="var(--d2-tinta)">T</text>
            <line x1="110.7" y1="136.8" x2="110.7" y2="176.8" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
            <text x="116" y="172" font-size="10" text-anchor="start" fill="var(--flag)">mg</text>
            <circle cx="60" cy="20" r="2.4" fill="var(--ink)"/>
            <text x="52" y="16" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">O</text>
          </svg>

      - tipo: calcular
        titulo: La altura que sube la carga
        pregunta: |
          Con $g = 9{,}81$ m/s², ¿cuánto sube la carga sobre su posición inicial antes de pararse?
        respuesta:
          tipo: magnitud
          valor: '0.4587 m'
          formato: una longitud, con su unidad
        distractores:
          - valor: '0.9174 m'
            mensaje: |
              Te has dejado el $\tfrac12$ de la energía cinética. La igualdad
              es $\tfrac12 m v^{2} = m\,g\,h$, así que $h = v^{2}/(2g)$.
          - valor: '0.3058 m'
            mensaje: |
              Has usado $h = v^{2}/(3g)$ o algo parecido. El balance es
              $\tfrac12 v^{2} = g\,h$ y no hay ningún tres en él, aunque la
              velocidad valga 3.
        pista: |
          $\tfrac12 m v^{2} = m\,g\,h$. La masa se va, y $h = v^{2}/(2g)$.
        desarrollo: |
          $$
          h = \frac{v^{2}}{2g} = \frac{3^{2}}{2 \cdot 9{,}81} = 0{,}4587\ \text{m}
          $$
      - tipo: calcular
        titulo: El avance horizontal
        pregunta: |
          Con esa altura, ¿cuánto avanza la carga en horizontal?
        respuesta:
          tipo: magnitud
          valor: '2.837 m'
          formato: una longitud, con su unidad
        distractores:
          - valor: '0.4587 m'
            mensaje: |
              Eso es la altura que sube, no el avance horizontal. El cable
              gira un ángulo $\theta$ con $R(1-\cos\theta) = h$, y lo que se
              pide es $R\operatorname{sen}\theta$.
          - valor: '8.541 m'
            mensaje: |
              Has tomado el coseno donde va el seno: $R\cos\theta = 8{,}541$ m
              es lo que queda la carga por debajo del carro, no lo que avanza.
              El avance horizontal es $R\operatorname{sen}\theta$.
        pista: |
          $R(1-\cos\theta) = h$ da $\cos\theta = 0{,}94903$, y el avance es
          $L = R\operatorname{sen}\theta$.
        desarrollo: |
          $$
          \cos\theta = 1 - \frac{h}{R} = 1 - \frac{0{,}4587}{9} = 0{,}94903
          \qquad
          \operatorname{sen}\theta = 0{,}31518
          $$

          $$
          L = R\operatorname{sen}\theta = 9 \cdot 0{,}31518 = 2{,}837\ \text{m}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: Al pararse el carro, la carga conserva su velocidad de 3 m/s y queda colgando de un cable de 9 m que puede girar.
          - texto: 'El cable no trabaja y no hay rozamiento: se conserva la energía mecánica, y la carga sube $h = v^{2}/2g = 0{,}4587$ m.'
          - texto: 'De $R(1-\cos\theta)=h$ sale $\theta = 18{,}37^{\circ}$, y el avance horizontal es $L = R\operatorname{sen}\theta = 2{,}837$ m.'
          - texto: Como el cable tira de la carga hacia el carro, su tensión frena la carga y hay que restar su trabajo.
            trampa: true
            mensaje: |
              La tensión es perpendicular a la velocidad en todo momento, así
              que su trabajo es **nulo**. Quien frena la carga es la
              componente del peso a lo largo de la trayectoria, y ese trabajo
              ya está contado como energía potencial.
    resolucion: |
      **1. Sólidos libres.** Es un problema de energía: el dibujo lleva la
      carga sola, en un instante de su subida.

      <figure class="figura-examen">
      <svg viewBox="30 4 120 182" role="img" width="180" height="273" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">Sólido libre de la carga mientras sube colgada del carro parado</title>
        <desc id="dsl-d">La carga sola, en un instante de su subida, con el cable, quitado y a trazos, girado un ángulo theta respecto de la vertical por el carro O. Sobre ella, la tensión T, a lo largo del cable, hacia O, y su peso mg, vertical hacia abajo.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M118.7 128.8 A8 8 0 1 0 102.7 128.8 A8 8 0 1 0 118.7 128.8 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M60 20 L107.3 121.6" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
        <line x1="60" y1="20" x2="60" y2="120" stroke="var(--faint)" stroke-width="0.7"/>
        <path d="M60 50 A30 30 0 0 0 72.7 47.2" fill="none" stroke="var(--ink)" stroke-width="0.9"/>
        <text x="64" y="66" font-size="10" fill="var(--ink)">θ</text>
        <line x1="107.3" y1="121.6" x2="86.2" y2="76.2" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="80" y="84" font-size="10" text-anchor="end" fill="var(--d2-tinta)">T</text>
        <line x1="110.7" y1="136.8" x2="110.7" y2="176.8" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
        <text x="116" y="172" font-size="10" text-anchor="start" fill="var(--flag)">mg</text>
        <circle cx="60" cy="20" r="2.4" fill="var(--ink)"/>
        <text x="52" y="16" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">O</text>
      </svg>
      <figcaption>

      La carga en un instante de la subida, con el cable girado θ respecto de la vertical. El carro, ya parado, es el punto fijo O.

      </figcaption>
      </figure>

      - **El peso**, $m\,g$, vertical: trabaja, porque la carga sube.
      - **La tensión**, a lo largo del cable, hacia el carro. El carro se ha
        parado y es un punto fijo: la carga, a 9 m de él, recorre un arco de
        circunferencia, y su velocidad es tangente al arco, perpendicular al
        cable. La tensión no trabaja.
      - **Sin rozamiento**, no hay nada más: la carga es un péndulo de
        $R = 9$ m que sale de la vertical a 3 m/s.

      **2. Incógnitas.** La altura que sube, h; el ángulo que gira el cable,
      $\theta$; y el avance horizontal, L.

      **3. Ecuaciones.** Solo trabaja el peso, y se conserva $T + V$ desde la
      parada, a 3 m/s, hasta que la carga se para arriba:

      $$
      \tfrac12\,m\,v^{2} = m\,g\,h
      $$

      Y la geometría del arco, con el cable girado $\theta$:

      <figure class="figura-examen">
      <svg viewBox="20 4 150 172" role="img" width="225" height="258" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">La subida de la carga: de la vertical al punto en que se para</title>
        <desc id="dsl-d">El carro O, parado. El cable vertical, de 9 m, con la carga abajo, que sale hacia la derecha a 3 m/s; y el cable girado un ángulo theta, con la carga en el punto en que se para. A trazos, el arco que recorre entre los dos. La altura que sube, h, acotada a la izquierda, y lo que avanza en horizontal, L, acotado abajo.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M66 140 A6 6 0 1 0 54 140 A6 6 0 1 0 66 140 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M134.8 118.3 A6 6 0 1 0 122.8 118.3 A6 6 0 1 0 134.8 118.3 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M60 20 V134" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M60 20 L125.4 113.4" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M60 140 A120 120 0 0 0 128.8 118.3" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
        <line x1="54" y1="140" x2="34" y2="140" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="122.8" y1="118.3" x2="34" y2="118.3" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="128.8" y1="124.3" x2="128.8" y2="164" stroke="var(--faint)" stroke-width="0.7"/>
        <path d="M60 160 H128.8 M60 156 V164 M128.8 156 V164" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="94.4" y="172" font-size="9" text-anchor="middle" fill="var(--faint)">L</text>
        <path d="M40 118.3 V140 M36 118.3 H44 M36 140 H44" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="34" y="133" font-size="9" text-anchor="end" fill="var(--faint)">h</text>
        <path d="M60 46 A26 26 0 0 0 74.9 41.3" fill="none" stroke="var(--ink)" stroke-width="0.9"/>
        <text x="64" y="60" font-size="10" fill="var(--ink)">θ</text>
        <line x1="66" y1="140" x2="100" y2="140" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="83" y="154" font-size="10" text-anchor="middle" fill="var(--ink)" font-style="italic">v = 3 m/s</text>
        <circle cx="60" cy="20" r="2.4" fill="var(--ink)"/>
        <text x="52" y="16" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">O</text>
        <text x="100" y="64" font-size="9" text-anchor="start" fill="var(--faint)">R = 9 m</text>
      </svg>
      <figcaption>

      Sin escala: el ángulo, exagerado. Al pararse el carro, la carga sale a 3 m/s y sube por el arco hasta pararse, h por encima de donde empezó y L más allá en horizontal.

      </figcaption>
      </figure>

      $$
      h = R\,(1 - \cos\theta),
      \qquad
      L = R\operatorname{sen}\theta
      $$

      **4. Resultados.**

      $$
      h = \frac{v^{2}}{2g} = \frac{3^{2}}{2 \cdot 9{,}81} = 0{,}4587\ \text{m}
      $$

      $$
      \cos\theta = 1 - \frac{0{,}4587}{9} = 0{,}94903,
      \qquad
      \theta = 18{,}37^{\circ},
      \qquad
      L = 9 \cdot 0{,}31518 = 2{,}837\ \text{m}
      $$

      **La carga avanza 2,837 m después de pararse la grúa.** La colección
      publica 2,838 m: es el mismo cálculo con $g = 9{,}8\ \text{m/s}^{2}$.

      **5. Comprobación.** Por la segunda ley, sin la energía: integrando paso
      a paso la ecuación del péndulo a lo largo del arco,
      $R\,\ddot{\theta} = -g\operatorname{sen}\theta$, desde $\theta = 0$ con
      $\dot{\theta} = 3/9 = 0{,}3333$ rad/s, la velocidad angular se anula a
      los 1,514 s, con $\theta = 18{,}37^{\circ}$, y
      $R\operatorname{sen}\theta = 2{,}837$ m. Lo mismo.

      **Lo que dice el resultado.** La carga sube menos de medio metro, pero
      avanza seis veces más: al principio el arco es casi horizontal. Una
      parada a solo 3 m/s lanza la carga casi 3 m hacia delante, con el cable
      a más de 18°, que es lo que tiene que prever quien maneja la grúa. Y
      tarda 1,514 s, casi el cuarto de periodo de un péndulo de 9 m con
      oscilaciones pequeñas, $\tfrac{\pi}{2}\sqrt{9/9{,}81} = 1{,}505$ s.

  - id: ejma9-col94-el-fardo-y-el-muelle-precomprimido
    titulo: El fardo que comprime un muelle ya precomprimido
    fuente: >-
      Ejercicio 9.4 · Tema 9, «Magnitudes y teoremas fundamentales de la
      dinámica» · Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección
      publica los dos resultados y el curso publica su resolución; contra los
      dos está contrastado este desarrollo.
    nivel: practica
    antes:
      idea: |
        El teorema de la energía separa las fuerzas que trabajan en
        conservativas, que se cuentan como energía potencial, y no
        conservativas, como el rozamiento, cuyo trabajo es energía que se
        pierde. Las fuerzas que no trabajan no entran en el balance.
      formula: |
        Entre dos posiciones 1 y 2, con $W_{r}$ la energía que se lleva el
        rozamiento, y la energía potencial de un muelle de constante $k$
        deformado $\delta$:

        $$
        T_1 + V_1 = T_2 + V_2 + W_{r},
        \qquad
        V_e = \tfrac12\,k\,\delta^{2}
        $$

        El rozamiento al deslizar vale $\mu_k\,N$.
      reconocer: |
        Antes de calcular se mira qué fuerzas trabajan y cómo está el muelle
        en cada posición.
    enunciado: |
      Se emplea un muelle de constante $k = 20\ \text{kN/m}$ para detener un
      fardo de 60 kg que desliza. El muelle está sostenido mediante un cable,
      estando inicialmente comprimido 120 mm. El fardo tiene una velocidad de
      $2{,}5\ \text{m/s}$ en la posición que se muestra en la figura y si la
      compresión adicional del muelle es de 40 mm, calcular:

      a. Coeficiente de rozamiento entre el fardo y la superficie

      b. Velocidad del fardo cuando pasa de nuevo por la posición de la figura

      <figure>
      <svg viewBox="0 0 360 200" role="img" width="360" height="200" aria-labelledby="ejma9-col94-t ejma9-col94-d">
        <title id="ejma9-col94-t">El fardo deslizando hacia el muelle sostenido contra la pared</title>
        <desc id="ejma9-col94-d">Un fardo apoyado en un suelo horizontal rayado avanza hacia la derecha con 2,5 metros por segundo. A 600 milímetros de su cara delantera hay la placa de un muelle que se apoya en una pared de la derecha; el muelle está ya comprimido 120 milímetros y lo sujeta un cable. Dibujo a escala, con 600 milímetros medidos entre la cara del fardo y la placa.</desc>
        <defs>
          <marker id="ejma9-col94-f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="ejma9-col94-c" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--faint)"/>
          </marker>
          <marker id="ejma9-col94-c2" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M8 0 L0 4 L8 8 z" fill="var(--faint)"/>
          </marker>
        </defs>
        <line x1="130" y1="52" x2="250" y2="52" stroke="var(--faint)" stroke-width="0.9" marker-end="url(#ejma9-col94-f)" marker-start="url(#ejma9-col94-c2)"/>
        <text x="190" y="45" font-size="11" text-anchor="middle" fill="var(--faint)">600</text>
        <path d="M130 56 L130 92 M250 56 L250 102" fill="none" stroke="var(--faint)" stroke-width="0.8" stroke-dasharray="3 2"/>
        <line x1="62" y1="80" x2="112" y2="80" stroke="var(--flag)" stroke-width="1.8" marker-end="url(#ejma9-col94-f)"/>
        <text x="60" y="72" font-size="10" fill="var(--flag)">v = 2,5 m/s</text>
        <rect x="60" y="95" width="70" height="55" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.4"/>
        <line x1="40" y1="150" x2="340" y2="150" stroke="var(--ink)" stroke-width="1.4"/>
        <path d="M46 150 L38 160 M62 150 L54 160 M78 150 L70 160 M94 150 L86 160 M110 150 L102 160 M126 150 L118 160 M142 150 L134 160 M158 150 L150 160 M174 150 L166 160 M190 150 L182 160 M206 150 L198 160 M222 150 L214 160 M238 150 L230 160 M254 150 L246 160 M270 150 L262 160 M286 150 L278 160 M302 150 L294 160 M318 150 L310 160 M334 150 L326 160" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <line x1="250" y1="102" x2="250" y2="148" stroke="var(--ink)" stroke-width="2"/>
        <path d="M250 125 L258 113 L268 137 L278 113 L288 137 L298 113 L308 137 L316 125 L322 125" fill="none" stroke="var(--ink)" stroke-width="1.4"/>
        <rect x="322" y="92" width="12" height="58" fill="var(--faint)" fill-opacity="0.3" stroke="var(--ink)" stroke-width="1.2"/>
        <path d="M334 96 L342 88 M334 110 L342 102 M334 124 L342 116 M334 138 L342 130 M334 150 L342 142" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
      </svg>
      </figure>
    pide: El coeficiente de rozamiento y la velocidad de vuelta por la posición de la figura.
    pasos:
      - tipo: reconocer
        pregunta: |
          El muelle ya está comprimido 120 mm antes de que llegue el fardo.
          ¿Qué energía elástica hay que usar en el balance?
        opciones:
          - texto: La diferencia entre $\tfrac12 k (0{,}16)^{2}$ y $\tfrac12 k (0{,}12)^{2}$, porque el muelle pasa de una compresión a otra
            correcta: true
            mensaje: |
              Eso es. La energía elástica depende de la deformación total, no
              de lo que se comprime de más, y lo que entra en el balance es su
              incremento entre las dos posiciones.
          - texto: Solo $\tfrac12 k (0{,}04)^{2}$, que es la compresión adicional
            mensaje: |
              La energía de un muelle no es lineal en la deformación, así que
              no se puede contar solo el tramo nuevo. Con 120 mm ya cargados,
              esos 40 mm cuestan mucho más que si partiera de cero.
          - texto: El trabajo $k\,x$ con $x = 0{,}04$ m, que es la fuerza por la distancia
            mensaje: |
              $k\,x$ es la **fuerza** del muelle, no su energía. Como la
              fuerza crece con la deformación, hay que integrar, y sale
              $\tfrac12 k x^{2}$.
      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el fardo solo, mientras
          comprime el muelle, con todas las fuerzas que actúan sobre él**. Sin
          escala.
        comprueba:
          - punto: |
              **El peso, $m\,g = 588{,}6$ N, y la normal, verticales.**
            porque: |
              El suelo es horizontal y el fardo no sube ni baja: la normal
              equilibra el peso.
          - punto: |
              **El rozamiento, $\mu_k\,N$, en la cara de abajo, hacia la
              izquierda.**
            porque: |
              El fardo desliza hacia la derecha, hacia el muelle, y el suelo
              se opone a ese deslizamiento.
          - punto: |
              **La fuerza del muelle, en la cara delantera, hacia la izquierda,
              de valor $k\,\delta$, con $\delta$ entre 120 y 160 mm.**
            porque: |
              El muelle, comprimido, empuja hacia atrás al fardo que se le
              echa encima. Antes de tocarlo, esta fuerza no está.
        figura: |
          <svg viewBox="26 30 150 104" role="img" width="150" height="104" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">Sólido libre del fardo mientras comprime el muelle</title>
            <desc id="dsl-d">El fardo solo, sobre el suelo horizontal, quitado y a trazos, mientras avanza hacia la derecha comprimiendo el muelle. Su peso, de 588,6 N, vertical hacia abajo; la normal N, vertical hacia arriba, desde el suelo; el rozamiento, en la cara de abajo, hacia la izquierda; y la fuerza del muelle, k por delta, en la cara delantera, hacia la izquierda.</desc>
            <defs>
              <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
              </marker>
              <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
              </marker>
              <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
              </marker>
            </defs>
            <path d="M60 40 H120 V90 H60 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M30 90 H170" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
            <line x1="90" y1="65" x2="90" y2="110" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
            <text x="96" y="124" font-size="10" text-anchor="start" fill="var(--flag)">588,6 N</text>
            <line x1="70" y1="128" x2="70" y2="92" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
            <text x="64" y="124" font-size="10" text-anchor="end" fill="var(--d2-tinta)">N</text>
            <line x1="118" y1="96" x2="98" y2="96" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
            <text x="124" y="100" font-size="10" text-anchor="start" fill="var(--d2-tinta)">F<tspan font-size="7.5" dy="2.5">r</tspan></text>
            <line x1="156" y1="65" x2="122" y2="65" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
            <text x="140" y="58" font-size="10" text-anchor="middle" fill="var(--d2-tinta)">kδ</text>
            <circle cx="90" cy="65" r="2.4" fill="var(--ink)"/>
          </svg>

      - tipo: calcular
        titulo: El coeficiente de rozamiento
        pregunta: |
          Aplicando el teorema de la energía entre la posición de la figura y
          la parada, ¿cuánto vale $\mu_k$?
        respuesta:
          tipo: numero
          valor: '0.2004'
          tolerancia: 0.005
          formato: un número, sin unidades
        distractores:
          - valor: '0.2138'
            mensaje: |
              Has contado el rozamiento solo en los 600 mm. El fardo sigue
              rozando mientras comprime el muelle, así que el recorrido es
              $0{,}6 + 0{,}04 = 0{,}64$ m.
          - valor: '0.4553'
            mensaje: |
              Has tomado $\tfrac12 k (0{,}04)^{2}$ como energía del muelle.
              Esa sería la energía si partiera sin comprimir; aquí el muelle
              va de 120 a 160 mm, y lo que absorbe es
              $\tfrac12 k\,(0{,}16^{2} - 0{,}12^{2}) = 112$ J.
          - valor: '0.4128'
            mensaje: |
              Has contado el muelle como fuerza por distancia,
              $k\,x \cdot x = 32$ J con $x = 0{,}04$ m. La fuerza del muelle
              crece con la deformación, y además ya estaba comprimido: lo que
              absorbe es $\tfrac12 k\,(0{,}16^{2} - 0{,}12^{2}) = 112$ J.
        pista: |
          $\tfrac12 m v_1^{2} + \tfrac12 k\delta^{2} = \tfrac12 k(\delta+\delta_0)^{2} + \mu_k\,m\,g\,(\Delta+\delta_0)$
          con $\Delta = 0{,}6$ m y $\delta_0 = 0{,}04$ m.
        desarrollo: |
          $$
          187{,}5 + 144 = 256 + \mu_k \cdot 60 \cdot 9{,}81 \cdot 0{,}64
          $$

          $$
          \mu_k = \frac{75{,}5}{376{,}70} = 0{,}2004
          $$
      - tipo: calcular
        titulo: La velocidad de vuelta
        pregunta: |
          El muelle devuelve la energía y empuja el fardo hacia atrás. ¿Con qué
          velocidad pasa otra vez por la posición de la figura?
        respuesta:
          tipo: magnitud
          valor: '1.103 m/s'
          formato: una velocidad, con su unidad
        distractores:
          - valor: '2.5 m/s'
            mensaje: |
              Esa es la velocidad de ida, o casi: $2{,}45$ m/s sale si das por
              devueltos los 256 J del muelle. El rozamiento se lleva energía en
              los dos sentidos, y el muelle no devuelve los 256 J: el cable lo
              retiene otra vez a 120 mm, y los 144 J de esa compresión se quedan
              en él. Solo devuelve 112 J.
          - valor: '1.932 m/s'
            mensaje: |
              Has olvidado el rozamiento en el camino de vuelta. Vuelve a
              recorrer $0{,}64$ m rozando, y eso son otros $75{,}5$ J que se
              pierden.
          - valor: '1.172 m/s'
            mensaje: |
              Has contado el rozamiento de la vuelta solo en los 600 mm.
              Mientras el muelle empuja, en los primeros 40 mm, el fardo
              también roza: son $0{,}64$ m.
        pista: |
          Del punto de parada al de la figura, el muelle entrega
          $\tfrac12 k(0{,}16)^{2} - \tfrac12 k(0{,}12)^{2} = 112$ J, y el
          rozamiento se lleva $75{,}5$ J.
        desarrollo: |
          $$
          \tfrac12 m v_3^{2} = 256 - 144 - 0{,}2004 \cdot 60 \cdot 9{,}81 \cdot 0{,}64 = 36{,}50\ \text{J}
          $$

          $$
          v_3 = \sqrt{\frac{2 \cdot 36{,}50}{60}} = 1{,}103\ \text{m/s}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'De la figura a la parada el fardo recorre $0{,}64$ m rozando, y el muelle pasa de 120 a 160 mm de compresión.'
          - texto: '$187{,}5 + 144 = 256 + \mu_k\,m\,g\,(0{,}64)$ da $\mu_k = 0{,}2$.'
          - texto: 'A la vuelta el muelle devuelve 112 J, el rozamiento se lleva otros $75{,}5$ J y quedan $36{,}5$ J de energía cinética: $v = 1{,}10$ m/s.'
          - texto: Como el rozamiento es una fuerza constante, su trabajo se anula en el viaje de ida y vuelta.
            trampa: true
            mensaje: |
              El rozamiento cambia de sentido con la velocidad, así que su
              trabajo es negativo en los dos tramos y se suma, no se cancela.
              Solo se anula el trabajo de las fuerzas **conservativas** en un
              camino cerrado.
    resolucion: |
      **1. Sólidos libres.** Es un problema de energía con rozamiento: el
      dibujo lleva el fardo solo, mientras comprime el muelle.

      <figure class="figura-examen">
      <svg viewBox="26 30 150 104" role="img" width="225" height="156" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">Sólido libre del fardo mientras comprime el muelle</title>
        <desc id="dsl-d">El fardo solo, sobre el suelo horizontal, quitado y a trazos, mientras avanza hacia la derecha comprimiendo el muelle. Su peso, de 588,6 N, vertical hacia abajo; la normal N, vertical hacia arriba, desde el suelo; el rozamiento, en la cara de abajo, hacia la izquierda; y la fuerza del muelle, k por delta, en la cara delantera, hacia la izquierda.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M60 40 H120 V90 H60 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M30 90 H170" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
        <line x1="90" y1="65" x2="90" y2="110" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
        <text x="96" y="124" font-size="10" text-anchor="start" fill="var(--flag)">588,6 N</text>
        <line x1="70" y1="128" x2="70" y2="92" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="64" y="124" font-size="10" text-anchor="end" fill="var(--d2-tinta)">N</text>
        <line x1="118" y1="96" x2="98" y2="96" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="124" y="100" font-size="10" text-anchor="start" fill="var(--d2-tinta)">F<tspan font-size="7.5" dy="2.5">r</tspan></text>
        <line x1="156" y1="65" x2="122" y2="65" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="140" y="58" font-size="10" text-anchor="middle" fill="var(--d2-tinta)">kδ</text>
        <circle cx="90" cy="65" r="2.4" fill="var(--ink)"/>
      </svg>
      <figcaption>

      El fardo mientras comprime el muelle, con δ entre 120 y 160 mm. Antes de tocarlo, la misma figura sin kδ. Peso con g = 9,81 m/s².

      </figcaption>
      </figure>

      - **El peso y la normal**, verticales e iguales, $N = 588{,}6$ N: el
        movimiento es horizontal y no trabajan.
      - **El rozamiento**, $\mu_k\,N$, contra el deslizamiento: no es
        conservativo, y se lleva energía.
      - **El muelle**, $k\,\delta$, conservativo: su energía depende de la
        compresión total, $\delta$, que va de 0,12 a 0,16 m.

      **2. Incógnitas.** El coeficiente de rozamiento, $\mu_k$, y la
      velocidad de vuelta, $v_3$.

      **3. Ecuaciones.** El teorema de la energía a la ida, de la posición de
      la figura, a 2,5 m/s y con el muelle a 0,12 m, a la parada, con el
      muelle a 0,16 m; y a la vuelta, de la parada otra vez a la posición de
      la figura, con el cable reteniendo el muelle a 0,12 m. En cada tramo el
      fardo roza $0{,}6 + 0{,}04 = 0{,}64$ m:

      <figure class="figura-examen">
      <svg viewBox="26 4 210 150" role="img" width="315" height="225" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">El fardo a la ida y a la vuelta, con el rozamiento en cada sentido</title>
        <desc id="dsl-d">Dos filas. Arriba, la ida: el fardo en la posición de la figura, con su velocidad hacia la derecha y el rozamiento hacia la izquierda, y a trazos donde se para, 0,64 m más allá. Abajo, la vuelta: el fardo sale de la parada hacia la izquierda, con el rozamiento hacia la derecha, y a trazos donde vuelve a la posición de la figura, otros 0,64 m.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M40 30 H80 V54 H40 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M168 100 H208 V124 H168 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M30 54 H232" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M30 124 H232" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M168 30 H208 V54 H168 Z" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
        <path d="M40 100 H80 V124 H40 Z" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
        <path d="M80 70 H208 M80 66 V74 M208 66 V74" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="144" y="64" font-size="9" text-anchor="middle" fill="var(--faint)">0,64 m</text>
        <path d="M80 140 H208 M80 136 V144 M208 136 V144" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="144" y="134" font-size="9" text-anchor="middle" fill="var(--faint)">0,64 m</text>
        <line x1="76" y1="58" x2="46" y2="58" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="84" y="64" font-size="10" text-anchor="start" fill="var(--d2-tinta)">F<tspan font-size="7.5" dy="2.5">r</tspan></text>
        <line x1="172" y1="128" x2="202" y2="128" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="208" y="132" font-size="10" text-anchor="start" fill="var(--d2-tinta)">F<tspan font-size="7.5" dy="2.5">r</tspan></text>
        <line x1="50" y1="22" x2="86" y2="22" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="92" y="25" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">v₁ = 2,5 m/s</text>
        <line x1="198" y1="92" x2="162" y2="92" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="156" y="95" font-size="10" text-anchor="end" fill="var(--ink)" font-style="italic">v₃</text>
        <text x="188" y="45" font-size="9" text-anchor="middle" fill="var(--faint)">parada</text>
        <text x="60" y="115" font-size="9" text-anchor="middle" fill="var(--faint)">figura</text>
        <text x="30" y="14" font-size="9" text-anchor="start" fill="var(--faint)">ida</text>
        <text x="30" y="84" font-size="9" text-anchor="start" fill="var(--faint)">vuelta</text>
      </svg>
      <figcaption>

      Sin escala. En cada tramo el fardo recorre 0,6 m hasta la placa y 0,04 m comprimiendo el muelle. El rozamiento va siempre contra el deslizamiento: hacia la izquierda a la ida y hacia la derecha a la vuelta.

      </figcaption>
      </figure>

      $$
      \tfrac12\,m\,v_1^{2} + \tfrac12\,k\,(0{,}12)^{2} = \tfrac12\,k\,(0{,}16)^{2} + \mu_k\,m\,g \cdot 0{,}64
      $$

      $$
      \tfrac12\,k\,(0{,}16)^{2} = \tfrac12\,m\,v_3^{2} + \tfrac12\,k\,(0{,}12)^{2} + \mu_k\,m\,g \cdot 0{,}64
      $$

      **4. Resultados.** Con $\tfrac12 \cdot 60 \cdot 2{,}5^{2} = 187{,}5$ J,
      $\tfrac12 \cdot 20000 \cdot 0{,}12^{2} = 144$ J y
      $\tfrac12 \cdot 20000 \cdot 0{,}16^{2} = 256$ J:

      $$
      187{,}5 + 144 = 256 + 376{,}70\,\mu_k
      \;\Longrightarrow\;
      \mu_k = \frac{75{,}5}{376{,}70} = 0{,}2004
      $$

      $$
      \tfrac12 \cdot 60\,v_3^{2} = 256 - 144 - 75{,}5 = 36{,}5\ \text{J}
      \;\Longrightarrow\;
      v_3 = \sqrt{\frac{2 \cdot 36{,}5}{60}} = 1{,}103\ \text{m/s}
      $$

      **El coeficiente de rozamiento vale 0,2, y el fardo vuelve a pasar por
      la posición de la figura a 1,103 m/s.** Los resultados publicados son
      $\mu_k = 0{,}2$ y $v = 1{,}10\ \text{m}\cdot\text{s}^{-1}$.

      **5. Comprobación.** Por la segunda ley, sin el teorema de la energía.
      Sin muelle, el rozamiento frena el fardo a
      $\mu_k\,g = 1{,}966\ \text{m/s}^{2}$: llega a la placa con
      $v^{2} = 2{,}5^{2} - 2 \cdot 1{,}966 \cdot 0{,}6 = 3{,}891$, a 1,972 m/s.
      Con el muelle, y x lo que avanza desde la placa,
      $m\,\ddot{x} = -k\,(0{,}12 + x) - \mu_k\,m\,g$: un movimiento armónico
      de pulsación $\sqrt{20000/60} = 18{,}26$ rad/s alrededor de
      $x_e = -0{,}12 - 117{,}97/20000 = -0{,}1259$ m, con amplitud

      $$
      A = \sqrt{0{,}1259^{2} + (1{,}972/18{,}26)^{2}} = 0{,}1659\ \text{m}
      $$

      Se para en $x_e + A = 0{,}0400$ m: los 40 mm del enunciado. A la
      vuelta el rozamiento cambia de sentido, y el centro pasa a
      $-0{,}12 + 0{,}0059 = -0{,}1141$ m; el fardo sale del reposo en 0,04 m,
      con amplitud 0,1541 m, y cuando el cable retiene la placa, en
      $x = 0$, va a
      $v^{2} = \tfrac{20000}{60}\,(0{,}1541^{2} - 0{,}1141^{2}) = 3{,}576$.
      Con los 0,6 m de frenado,
      $v_3^{2} = 3{,}576 - 2 \cdot 1{,}966 \cdot 0{,}6 = 1{,}217$, y
      $v_3 = 1{,}103$ m/s. Lo mismo.

      **Lo que dice el resultado.** El fardo llega con 187,5 J y vuelve con
      36,5: el rozamiento se lleva 75,5 J a la ida y otros 75,5 a la vuelta,
      porque cambia de sentido con el deslizamiento y trabaja en contra en los
      dos tramos. El muelle, en cambio, devuelve los 112 J que tomó. Y los 144
      J de la precompresión no entran nunca: estaban antes y siguen después.

  - id: ejma9-col95-el-martillo-de-pilotes
    titulo: El martillo de pilotes que penetra 80 mm en el suelo
    fuente: >-
      Ejercicio 9.5 · Tema 9, «Magnitudes y teoremas fundamentales de la
      dinámica» · Mecánica Aplicada, UPV/EHU, curso 2025-2026. Ojo con las
      unidades de la ley del suelo: leyendo la fuerza en newton salen 3,41 J de
      trabajo resistente y el conjunto se acelera hasta 3,25 metros por
      segundo, mientras que el resultado publicado, 1,39, y la resolución del
      profesor corresponden a leerla en kilonewton. Se publica el valor de la
      colección porque es el que reproduce su desarrollo, y la discrepancia se
      explica en la resolución.
    nivel: practica
    antes:
      idea: |
        El teorema de la energía relaciona el cambio de la energía cinética de
        un cuerpo con el trabajo de todas las fuerzas que actúan sobre él.
        Cuando una fuerza cambia a lo largo del recorrido, su trabajo es una
        integral: el área bajo la curva de la fuerza frente al desplazamiento.
      formula: |
        Entre dos posiciones 1 y 2, con F la componente de cada fuerza en la
        dirección del movimiento:

        $$
        T_2 - T_1 = W_{12},
        \qquad
        W_{12} = \int_{x_1}^{x_2} F\,dx,
        \qquad
        T = \tfrac12\,m\,v^{2}
        $$

        El peso de un cuerpo que baja una altura d trabaja $m\,g\,d$.
      reconocer: |
        Antes de calcular se mira qué fuerzas actúan sobre el conjunto
        mientras se hinca.
    enunciado: |
      La masa de pilotes de 650 kg de un martillo de caída libre cae sobre un
      pilote de 140 kg. Después del impacto, el martillo y el pilote quedan
      unidos y tienen una velocidad de $3\ \text{m/s}$. La fuerza vertical
      aplicada sobre el pilote por el suelo después del impacto está dada por
      $F = 0{,}02\cdot x^{2}$, donde $x$ y $F$ están expresados en mm y N,
      respectivamente. Determinar la velocidad del sistema después de haber
      penetrado 80 mm el suelo.

      <figure>
      <svg viewBox="0 0 300 270" role="img" width="300" height="270" aria-labelledby="ejma9-col95-t ejma9-col95-d">
        <title id="ejma9-col95-t">El martillo de 650 kg sobre el pilote de 140 kg clavado en el suelo</title>
        <desc id="ejma9-col95-d">Un martillo de 650 kilogramos baja entre dos guías verticales y golpea la cabeza de un pilote de 140 kilogramos. El pilote atraviesa la línea del terreno y termina en punta. A los lados de la parte enterrada, unas flechas hacia arriba representan la resistencia que el suelo opone al hincado.</desc>
        <defs>
          <marker id="ejma9-col95-f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--faint)"/>
          </marker>
        </defs>
        <line x1="116" y1="18" x2="116" y2="122" stroke="var(--ink)" stroke-width="1.6"/>
        <line x1="184" y1="18" x2="184" y2="122" stroke="var(--ink)" stroke-width="1.6"/>
        <rect x="126" y="42" width="48" height="56" fill="var(--faint)" fill-opacity="0.25" stroke="var(--ink)" stroke-width="1.5"/>
        <circle cx="150" cy="34" r="6" fill="none" stroke="var(--ink)" stroke-width="1.2"/>
        <path d="M92 46 L124 60" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="3 2"/>
        <text x="88" y="44" font-size="11" text-anchor="end" fill="var(--ink)">650 kg</text>
        <polygon points="140,100 160,100 160,214 150,232 140,214" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.5"/>
        <line x1="40" y1="150" x2="260" y2="150" stroke="var(--ink)" stroke-width="1.2"/>
        <text x="170" y="168" font-size="11" fill="var(--ink)">140 kg</text>
        <line x1="98" y1="208" x2="130" y2="182" stroke="var(--faint)" stroke-width="1.1" marker-end="url(#ejma9-col95-f)"/>
        <line x1="98" y1="234" x2="130" y2="208" stroke="var(--faint)" stroke-width="1.1" marker-end="url(#ejma9-col95-f)"/>
        <line x1="202" y1="208" x2="170" y2="182" stroke="var(--faint)" stroke-width="1.1" marker-end="url(#ejma9-col95-f)"/>
        <line x1="202" y1="234" x2="170" y2="208" stroke="var(--faint)" stroke-width="1.1" marker-end="url(#ejma9-col95-f)"/>
        <line x1="150" y1="256" x2="150" y2="238" stroke="var(--faint)" stroke-width="1.1" marker-end="url(#ejma9-col95-f)"/>
      </svg>
      </figure>
    pide: La velocidad del conjunto martillo más pilote tras penetrar 80 mm.
    pasos:
      - tipo: reconocer
        pregunta: |
          Durante los 80 mm de hincado, ¿qué se conserva y qué no?
        opciones:
          - texto: Ni el momento lineal ni la energía mecánica, porque el suelo hace una fuerza externa que además no es conservativa
            correcta: true
            mensaje: |
              Eso es. El suelo empuja hacia arriba con una fuerza que depende
              de la penetración y disipa energía. Hay que usar el teorema de
              la energía con el trabajo de esa fuerza, no una conservación.
          - texto: El momento lineal, porque el martillo y el pilote van unidos
            mensaje: |
              Ir unidos convierte el impacto en plástico, pero eso vale para
              el choque, no para lo que viene después. Durante el hincado
              actúan el peso y el suelo, que son fuerzas externas.
          - texto: La energía mecánica, porque el pilote baja y gana energía cinética
            mensaje: |
              El suelo se lleva energía en forma de deformación y calor. Si la
              energía mecánica se conservara, el pilote no se pararía nunca al
              hincar.
      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el martillo y el pilote, unidos,
          mientras se hincan, con todas las fuerzas que actúan sobre el
          conjunto y con su velocidad**. Sin escala.
        comprueba:
          - punto: |
              **Un solo cuerpo, de $M = 790$ kg.**
            porque: |
              Tras el impacto, el martillo y el pilote quedan unidos y bajan
              juntos: $650 + 140$ kg.
          - punto: |
              **El peso, $M\,g$, vertical y hacia abajo, desde el centro de
              masas.**
            porque: |
              Con $g = 9{,}81\ \text{m/s}^{2}$, $790 \cdot 9{,}81 = 7750$ N.
          - punto: |
              **La fuerza del suelo, $F = 0{,}02\,x^{2}$, vertical y hacia
              arriba.**
            porque: |
              El suelo se opone a que el pilote penetre. Es nula justo después
              del impacto y crece con la penetración.
          - punto: |
              **La velocidad, vertical y hacia abajo: 3 m/s al empezar.**
            porque: |
              Es la del conjunto justo después del impacto, el dato del
              enunciado.
        figura: |
          <svg viewBox="20 8 130 230" role="img" width="130" height="230" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">Sólido libre del martillo y el pilote, unidos, mientras se hincan</title>
            <desc id="dsl-d">El martillo y el pilote, unidos tras el impacto, como un solo cuerpo de 790 kilogramos que baja con velocidad v. A trazos, la línea del suelo, quitado. Sobre el conjunto, su peso Mg, vertical hacia abajo desde el centro de masas G, y la fuerza del suelo F, vertical hacia arriba en la punta del pilote.</desc>
            <defs>
              <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
              </marker>
              <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
              </marker>
              <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
              </marker>
            </defs>
            <path d="M40 16 H110 V56 H86 V176 L75 190 L64 176 V56 H40 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M24 110 H146" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
            <line x1="75" y1="51" x2="75" y2="91" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
            <text x="90" y="88" font-size="10" text-anchor="start" fill="var(--flag)">Mg</text>
            <line x1="75" y1="232" x2="75" y2="193" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
            <text x="81" y="224" font-size="10" text-anchor="start" fill="var(--d2-tinta)">F</text>
            <line x1="126" y1="24" x2="126" y2="56" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
            <text x="131" y="44" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">v</text>
            <circle cx="75" cy="51" r="2.4" fill="var(--ink)"/>
            <text x="80" y="46" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">G</text>
            <text x="144" y="104" font-size="9" text-anchor="end" fill="var(--faint)">suelo</text>
          </svg>

      - tipo: calcular
        titulo: El trabajo que hace el suelo
        pregunta: |
          Con la ley del enunciado y una penetración de 80 mm, ¿cuánto vale en
          valor absoluto el trabajo de la fuerza del suelo, contado como lo
          cuenta la colección?
        respuesta:
          tipo: magnitud
          valor: '3413 J'
          formato: una energía, con su unidad
        distractores:
          - valor: '10240 J'
            mensaje: |
              Te has dejado el 3 del denominador. La integral de $x^{2}$ es
              $x^{3}/3$, no $x^{3}$.
          - valor: '3.413 J'
            mensaje: |
              Ese es el trabajo leyendo la fuerza literalmente en newton, con
              $x$ pasado a metros. Da 3,41 J, una resistencia ridícula para un
              pilote, y con ella el conjunto se aceleraría en lugar de
              frenarse; la colección integra la ley en milímetros y obtiene
              julios, que equivale a leer la fuerza en kilonewton.
          - valor: '128 J'
            mensaje: |
              Eso es el valor de la fuerza al final del recorrido,
              $0{,}02 \cdot 80^{2} = 128$, no su trabajo. La fuerza crece con
              la penetración, así que hay que integrar.
        pista: |
          $W = \int_0^{80} 0{,}02\,x^{2}\,dx = 0{,}02\,\dfrac{80^{3}}{3}$.
        desarrollo: |
          $$
          W = \int_0^{80} 0{,}02\,x^{2}\,dx = \frac{0{,}02 \cdot 512000}{3} = 3413{,}3\ \text{J}
          $$
      - tipo: calcular
        titulo: La velocidad tras 80 mm
        pregunta: |
          Aplicando el teorema de la energía al tramo de hincado, ¿qué
          velocidad lleva el conjunto?
        respuesta:
          tipo: magnitud
          valor: '1.389 m/s'
          formato: una velocidad, con su unidad
        distractores:
          - valor: '3.25 m/s'
            mensaje: |
              Es lo que sale leyendo la fuerza literalmente en newton, con un
              trabajo resistente de 3,41 J. El peso gana entonces al suelo y
              el pilote acelera, que es justo lo contrario de lo que hace un
              pilote al hincarse.
          - valor: '0.599 m/s'
            mensaje: |
              Te has dejado el trabajo del peso. El conjunto baja 80 mm
              mientras el suelo lo frena, y el peso aporta
              $790 \cdot 9{,}81 \cdot 0{,}08 = 620$ J a favor del movimiento.
          - valor: '2.5 m/s'
            mensaje: |
              Al despejar $v_2^{2}$ has dividido el trabajo del suelo entre
              $M$, sin el 2: igual que el peso entra como $2g\,d$, el suelo
              entra como $2W/M$.
        pista: |
          $\tfrac12 M v_1^{2} + M\,g\,d = \tfrac12 M v_2^{2} + W$, con
          $M = 790$ kg y $d = 0{,}08$ m.
        desarrollo: |
          $$
          v_2^{2} = v_1^{2} + 2g\,d - \frac{2W}{M}
          = 9 + 1{,}5696 - \frac{6826{,}7}{790} = 1{,}928
          $$

          $$
          v_2 = 1{,}389\ \text{m/s}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Tras el impacto el conjunto pesa $M = 790$ kg y baja con 3 m/s; en los 80 mm siguientes trabajan el peso y la fuerza del suelo.'
          - texto: 'El suelo se opone con $F = 0{,}02x^{2}$, y su trabajo en los 80 mm es $0{,}02 \cdot 80^{3}/3 = 3413$ J.'
          - texto: '$\tfrac12 M v_1^{2} + M g d - W = \tfrac12 M v_2^{2}$, de donde $v_2 = 1{,}39$ m/s.'
          - texto: 'Como la fuerza del suelo depende de la posición, es conservativa y su trabajo se puede escribir como una energía potencial que se recupera.'
            trampa: true
            mensaje: |
              Depender solo de la posición no basta para ser conservativa: la
              resistencia del suelo se opone **siempre** al movimiento, así
              que al sacar el pilote volvería a hacer trabajo negativo. Esa
              energía no se recupera, se disipa.
    resolucion: |
      **1. Sólidos libres.** Es un problema de energía con una fuerza que
      cambia a lo largo del recorrido: el dibujo lleva el martillo y el
      pilote, unidos, mientras se hincan.

      <figure class="figura-examen">
      <svg viewBox="20 8 130 230" role="img" width="195" height="345" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">Sólido libre del martillo y el pilote, unidos, mientras se hincan</title>
        <desc id="dsl-d">El martillo y el pilote, unidos tras el impacto, como un solo cuerpo de 790 kilogramos que baja con velocidad v. A trazos, la línea del suelo, quitado. Sobre el conjunto, su peso Mg, vertical hacia abajo desde el centro de masas G, y la fuerza del suelo F, vertical hacia arriba en la punta del pilote.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M40 16 H110 V56 H86 V176 L75 190 L64 176 V56 H40 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M24 110 H146" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
        <line x1="75" y1="51" x2="75" y2="91" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
        <text x="90" y="88" font-size="10" text-anchor="start" fill="var(--flag)">Mg</text>
        <line x1="75" y1="232" x2="75" y2="193" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="81" y="224" font-size="10" text-anchor="start" fill="var(--d2-tinta)">F</text>
        <line x1="126" y1="24" x2="126" y2="56" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="131" y="44" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">v</text>
        <circle cx="75" cy="51" r="2.4" fill="var(--ink)"/>
        <text x="80" y="46" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">G</text>
        <text x="144" y="104" font-size="9" text-anchor="end" fill="var(--faint)">suelo</text>
      </svg>
      <figcaption>

      El conjunto, de 790 kg, mientras se hinca. F es lo que hace el suelo, y crece con la penetración x contada desde el impacto.

      </figcaption>
      </figure>

      - **Un solo cuerpo**, de $M = 650 + 140 = 790$ kg, que sale del impacto a
        $v_1 = 3$ m/s hacia abajo. El impacto ya ha ocurrido, y su resultado
        es un dato.
      - **El peso**, $790 \cdot 9{,}81 = 7750$ N, a favor del movimiento:
        trabaja a favor.
      - **La fuerza del suelo**, F, hacia arriba, en contra: trabaja en
        contra, y crece con la penetración. No es conservativa: se opone
        siempre al movimiento, y lo que se lleva no se recupera.

      **2. Incógnitas.** El trabajo del suelo en los 80 mm, W, y la velocidad
      al final, $v_2$.

      **3. Ecuaciones.** El trabajo del suelo es el área bajo la curva de la
      fuerza frente a la penetración:

      <figure class="figura-examen">
      <svg viewBox="14 2 242 172" role="img" width="363" height="258" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">La fuerza del suelo frente a la penetración, y su trabajo como área</title>
        <desc id="dsl-d">Una gráfica de la fuerza del suelo, en kilonewton, frente a la penetración, en milímetros: una parábola que sale de cero y llega a 128 kilonewton a los 80 milímetros. El área sombreada bajo ella, hasta los 80 milímetros, es el trabajo del suelo, 3413 julios.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M40 150 Q120 150 200 22 V150 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M40 150 H212" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M40 150 V14" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <line x1="40" y1="22" x2="200" y2="22" stroke="var(--faint)" stroke-width="0.7"/>
        <text x="200" y="162" font-size="9" text-anchor="middle" fill="var(--faint)">80</text>
        <text x="214" y="162" font-size="9" text-anchor="start" fill="var(--faint)">x (mm)</text>
        <text x="36" y="25" font-size="9" text-anchor="end" fill="var(--faint)">128</text>
        <text x="36" y="153" font-size="9" text-anchor="end" fill="var(--faint)">0</text>
        <text x="44" y="14" font-size="9" text-anchor="start" fill="var(--faint)">F (kN)</text>
        <text x="150" y="60" font-size="9" text-anchor="end" fill="var(--faint)">F = 0,02 x²</text>
        <text x="150" y="138" font-size="9" text-anchor="middle" fill="var(--faint)">W = 3413 J</text>
      </svg>
      <figcaption>

      La ley del suelo leída como la lee la colección, con la fuerza en kN. El trabajo es el área bajo la curva: un tercio del rectángulo de 80 mm por 128 kN.

      </figcaption>
      </figure>

      $$
      W = \int_0^{80} 0{,}02\,x^{2}\,dx
      $$

      Y el teorema de la energía, del impacto a los 80 mm, con
      $d = 0{,}08$ m:

      $$
      \tfrac12\,M\,v_1^{2} + M\,g\,d - W = \tfrac12\,M\,v_2^{2}
      $$

      **4. Resultados.**

      $$
      W = \frac{0{,}02 \cdot 80^{3}}{3} = 3413{,}3\ \text{J}
      $$

      Con $\tfrac12 \cdot 790 \cdot 3^{2} = 3555$ J y
      $790 \cdot 9{,}81 \cdot 0{,}08 = 620{,}0$ J:

      $$
      \tfrac12\,M\,v_2^{2} = 3555 + 620{,}0 - 3413{,}3 = 761{,}7\ \text{J}
      $$

      $$
      v_2 = \sqrt{\frac{2 \cdot 761{,}7}{790}} = 1{,}389\ \text{m/s}
      $$

      **Tras hincarse 80 mm, el conjunto baja a 1,389 m/s.** Es el resultado
      publicado, $1{,}39\ \text{m}\cdot\text{s}^{-1}$.

      **Una advertencia sobre las unidades, que aquí no es un detalle.** El
      enunciado dice que $x$ va en mm y $F$ en N. Con esa lectura estricta el
      trabajo es $3{,}41$ J, mil veces menor, y el conjunto no se frena: sale
      $v_2 = 3{,}25\ \text{m/s}$, más deprisa que al empezar. La colección y la
      resolución del curso integran la ley en milímetros y leen el resultado
      en julios, que es lo mismo que tomar la fuerza en **kilonewton**, y así
      obtienen los $1{,}39\ \text{m}\cdot\text{s}^{-1}$ publicados. Aquí se
      publica ese valor, que es el que corresponde al problema que se quería
      plantear, con la salvedad dicha.

      **5. Comprobación.** Por la segunda ley, sin el teorema de la energía.
      Con la ley de la colección pasada al SI, x en metros y F en newton,
      $F = 2 \cdot 10^{7}\,x^{2}$; integrando paso a paso en el tiempo
      $M\,\ddot{x} = M\,g - 2 \cdot 10^{7}\,x^{2}$ desde $x = 0$ con
      $\dot{x} = 3$ m/s, el conjunto llega a los 80 mm a los 0,0303 s, a
      1,389 m/s. Y el trabajo, por la geometría de la figura: bajo una
      parábola que sale del origen, el área es un tercio del rectángulo que la
      encierra, $80 \cdot 128/3 = 3413$ J. Lo mismo.

      **Lo que dice el resultado.** El conjunto tiene 4175 J para gastar, los
      3555 del impacto y los 620 que aporta el peso; el suelo se lleva 3413, y
      quedan 761,7. Pero no frena desde el principio: hasta que
      $0{,}02\,x^{2}$ no llega a los 7,75 kN del peso, en
      $x = \sqrt{7{,}75/0{,}02} = 19{,}7$ mm, el conjunto todavía acelera, hasta
      3,04 m/s. A partir de ahí frena, y se para a los 85,9 mm, 0,0385 s
      después del impacto. A los 80 mm el suelo ya empuja con 128 kN, dieciséis
      veces y media el peso.

  - id: ejma9-col96-el-tren-en-la-pendiente
    titulo: La potencia que pide un tren subiendo una pendiente del 1,5 por ciento
    fuente: >-
      Ejercicio 9.6 · Tema 9, «Magnitudes y teoremas fundamentales de la
      dinámica» · Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección
      publica el resultado y el curso publica su resolución; contra los dos
      está contrastado este desarrollo.
    nivel: practica
    antes:
      idea: |
        Un tren que circula por la vía es un sólido en traslación: la
        resultante de las fuerzas exteriores que actúan sobre él da la
        aceleración de su centro de gravedad. La potencia de una fuerza mide
        lo deprisa que trabaja.
      formula: |
        La segunda ley para el centro de gravedad, y la potencia de una fuerza
        aplicada en un punto que se mueve a velocidad $\vec{v}$:

        $$
        \sum\vec{F} = M\,\vec{a}_G,
        \qquad
        P = \vec{F}\cdot\vec{v}
        $$
      reconocer: |
        Antes de calcular se mira en qué tramo del movimiento se pide la
        potencia.
    enunciado: |
      Un tren de masa total de 500 Tn parte del reposo y acelera uniformemente
      hasta 90 km/h en 50 s, subiendo una pendiente del 1,5 %. Después de
      alcanzar esta velocidad, el tren viaja con velocidad constante. La
      resistencia al rodamiento produce una fuerza total de 15 kN en dirección
      contraria a la del movimiento. Determinar la potencia requerida después
      de pasar 50 segundos.

      Dato: $\operatorname{sen}\alpha = 0{,}015$

      <figure>
      <svg viewBox="0 0 340 170" role="img" width="340" height="170" aria-labelledby="ejma9-col96-t ejma9-col96-d">
        <title id="ejma9-col96-t">El tren subiendo la rampa de pendiente 1,5 por ciento</title>
        <desc id="ejma9-col96-d">Una rampa triangular con un vagón sobre ella subiendo hacia la derecha. El ángulo de la base se llama alfa y su seno vale 0,015. A la derecha se acota la altura h ganada por la rampa. La inclinación del dibujo está exagerada: la real, del 1,5 por ciento, sería casi invisible.</desc>
        <defs>
          <marker id="ejma9-col96-c" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--faint)"/>
          </marker>
          <marker id="ejma9-col96-c2" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M8 0 L0 4 L8 8 z" fill="var(--faint)"/>
          </marker>
        </defs>
        <polygon points="30,140 290,140 290,88" fill="var(--faint)" fill-opacity="0.15" stroke="var(--ink)" stroke-width="1.3"/>
        <polygon points="139.9,108.6 198.7,96.9 203.0,75.3 144.2,87.0" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.4"/>
        <circle cx="153.6" cy="110.6" r="5" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/>
        <circle cx="183" cy="104.7" r="5" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/>
        <path d="M70 140 A 40 40 0 0 0 69.2 132.2" fill="none" stroke="var(--faint)" stroke-width="1" stroke-dasharray="3 2"/>
        <text x="54" y="136" font-size="11" fill="var(--ink)">α</text>
        <text x="215" y="126" font-size="11" fill="var(--ink)">senα = 0,015</text>
        <line x1="312" y1="88" x2="312" y2="140" stroke="var(--faint)" stroke-width="0.9" marker-end="url(#ejma9-col96-c)" marker-start="url(#ejma9-col96-c2)"/>
        <path d="M290 88 L318 88 M290 140 L318 140" fill="none" stroke="var(--faint)" stroke-width="0.8" stroke-dasharray="3 2"/>
        <text x="322" y="118" font-size="11" fill="var(--faint)">h</text>
      </svg>
      </figure>
    pide: La potencia requerida cuando el tren ya circula a velocidad constante.
    pasos:
      - tipo: reconocer
        pregunta: |
          Pasados los 50 s el tren va a 90 km/h constantes. ¿Qué cambia en el
          planteamiento respecto del tramo de aceleración?
        opciones:
          - texto: Que la aceleración es nula, así que la fuerza de tracción solo tiene que igualar al peso proyectado y a la resistencia
            correcta: true
            mensaje: |
              Eso es. Con $\vec{a}_G = \vec{0}$, el teorema del momento lineal
              se reduce al equilibrio, y la tracción vale
              $F_r + M g \operatorname{sen}\alpha$.
          - texto: Nada, la potencia es la misma que durante la aceleración
            mensaje: |
              Durante los 50 s la tracción incluye además $M a$, que con
              $a = 0{,}5\ \text{m/s}^{2}$ y 500 toneladas son 250 kN, mucho
              más que todo lo demás junto. La potencia no es la misma.
          - texto: Que ya no hay que contar el peso, porque el tren no gana altura
            mensaje: |
              Sí la gana: sube por la pendiente a velocidad constante, así que
              gana altura todo el rato. Lo que aporta el peso es
              $M g \operatorname{sen}\alpha$, y no depende de la aceleración.
      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el tren solo, sobre la vía
          inclinada, con todas las fuerzas que actúan sobre él y con su
          velocidad**. La inclinación, exagerada; sin escala.
        comprueba:
          - punto: |
              **El peso, $M\,g$, vertical y hacia abajo, desde el centro de
              gravedad.**
            porque: |
              Con 500 t, $5 \cdot 10^{5} \cdot 9{,}81 = 4905000$ N. A lo largo
              de la vía, su componente es $M\,g\operatorname{sen}\alpha$,
              cuesta abajo.
          - punto: |
              **La normal, N, perpendicular a la vía.**
            porque: |
              La vía sostiene el tren sin dejarlo hundirse: equilibra la
              componente del peso perpendicular a ella.
          - punto: |
              **La resistencia al rodamiento, $F_r = 15$ kN, a lo largo de la
              vía y hacia atrás.**
            porque: |
              Se opone al movimiento, y el tren sube.
          - punto: |
              **La tracción, $F_t$, a lo largo de la vía y hacia delante.**
            porque: |
              Es la fuerza que hace la vía sobre las ruedas motrices: la única
              fuerza exterior que empuja al tren cuesta arriba.
        figura: |
          <svg viewBox="10 66 262 126" role="img" width="262" height="126" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">Sólido libre del tren subiendo la pendiente</title>
            <desc id="dsl-d">El tren, como un bloque sobre la vía inclinada un ángulo alfa, con la vía quitada y a trazos y la inclinación exagerada. Sobre él, el peso Mg, vertical; la normal N, perpendicular a la vía; la resistencia al rodamiento Fr, a lo largo de la vía y hacia atrás; y la tracción Ft, a lo largo de la vía y hacia delante. Encima, la velocidad v, cuesta arriba.</desc>
            <defs>
              <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
              </marker>
              <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
              </marker>
              <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
              </marker>
            </defs>
            <path d="M108 151.3 L186.3 134.7 L178 95.5 L99.7 112.2 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M20 170 L264.5 118 V170 Z" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
            <path d="M60 170 A40 40 0 0 0 59.1 161.7" fill="none" stroke="var(--ink)" stroke-width="0.9"/>
            <text x="64" y="166" font-size="10" fill="var(--ink)">α</text>
            <line x1="143" y1="123.4" x2="143" y2="167.4" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
            <text x="150" y="160" font-size="10" text-anchor="start" fill="var(--flag)">Mg</text>
            <line x1="182" y1="172.4" x2="174.5" y2="137.2" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
            <text x="188" y="170" font-size="10" text-anchor="start" fill="var(--d2-tinta)">N</text>
            <line x1="106.4" y1="143.5" x2="67.2" y2="151.8" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
            <text x="86" y="140" font-size="10" text-anchor="middle" fill="var(--flag)">F<tspan font-size="7.5" dy="2.5">r</tspan></text>
            <line x1="184.6" y1="126.8" x2="228.6" y2="117.5" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
            <text x="210" y="112" font-size="10" text-anchor="middle" fill="var(--d2-tinta)">F<tspan font-size="7.5" dy="2.5">t</tspan></text>
            <line x1="116" y1="92.4" x2="155.1" y2="84" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
            <text x="136" y="80" font-size="10" text-anchor="middle" fill="var(--ink)" font-style="italic">v</text>
            <circle cx="143" cy="123.4" r="2.4" fill="var(--ink)"/>
            <text x="149" y="120" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">G</text>
          </svg>

      - tipo: calcular
        titulo: La fuerza de tracción
        pregunta: |
          ¿Cuánto vale la fuerza de tracción una vez alcanzada la velocidad de
          régimen?
        respuesta:
          tipo: magnitud
          valor: '88.58 kN'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '73.58 kN'
            mensaje: |
              Te has dejado la resistencia al rodamiento de 15 kN, que sigue
              actuando aunque la velocidad sea constante.
          - valor: '338.6 kN'
            mensaje: |
              Has dejado el término $M a$ con $a = 0{,}5\ \text{m/s}^{2}$. Ese
              es el tramo de los primeros 50 s; después la aceleración es
              nula.
          - valor: '15 kN'
            mensaje: |
              Solo has contado la resistencia al rodamiento. Subiendo una
              pendiente hay que vencer también la componente del peso,
              $M g \operatorname{sen}\alpha = 73{,}6$ kN, que aquí es lo
              gordo.
        pista: |
          $F_t = F_r + M\,g\operatorname{sen}\alpha$, con $M = 5\cdot 10^{5}$ kg.
        desarrollo: |
          $$
          F_t = 15000 + 5 \cdot 10^{5} \cdot 9{,}81 \cdot 0{,}015 = 15000 + 73575 = 88575\ \text{N}
          $$
      - tipo: calcular
        titulo: La potencia
        pregunta: |
          Con esa tracción y 90 km/h, ¿qué potencia se necesita?
        respuesta:
          tipo: magnitud
          valor: '2.214 MW'
          formato: una potencia, con su unidad
        distractores:
          - valor: '7.972 MW'
            mensaje: |
              Has multiplicado por 90 en lugar de por 25. La velocidad hay que
              pasarla a metros por segundo antes de multiplicar por la fuerza.
          - valor: '1.839 MW'
            mensaje: |
              Has usado solo la componente del peso, sin la resistencia al
              rodamiento. Los 15 kN aportan otros 375 kW.
        pista: |
          $P = F_t\,v$ con $v = 90/3{,}6 = 25\ \text{m/s}$.
        desarrollo: |
          $$
          P = 88575 \cdot 25 = 2{,}214 \cdot 10^{6}\ \text{W} = 2{,}214\ \text{MW}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Pasados los 50 s la velocidad es constante, $v = 25$ m/s, y la aceleración del centro de gravedad es nula.'
          - texto: '$\sum F = M a_G = 0$ a lo largo de la vía da $F_t = F_r + M g \operatorname{sen}\alpha = 88{,}58$ kN.'
          - texto: '$P = F_t\,v = 88575 \cdot 25 = 2{,}21$ MW.'
          - texto: 'A velocidad constante la potencia es nula, porque no cambia la energía cinética.'
            trampa: true
            mensaje: |
              Lo que no cambia es la energía **cinética**. La potencia de la
              tracción se va en subir —aumenta la potencial— y en vencer la
              resistencia al rodamiento, que disipa. La suma de todas las
              potencias es cero; la de la tracción, no.
    resolucion: |
      **1. Sólidos libres.** Es un problema de dinámica de un sólido en
      traslación: el dibujo lleva el tren solo, sobre la vía inclinada, con la
      inclinación exagerada.

      <figure class="figura-examen">
      <svg viewBox="10 66 262 126" role="img" width="393" height="189" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">Sólido libre del tren subiendo la pendiente</title>
        <desc id="dsl-d">El tren, como un bloque sobre la vía inclinada un ángulo alfa, con la vía quitada y a trazos y la inclinación exagerada. Sobre él, el peso Mg, vertical; la normal N, perpendicular a la vía; la resistencia al rodamiento Fr, a lo largo de la vía y hacia atrás; y la tracción Ft, a lo largo de la vía y hacia delante. Encima, la velocidad v, cuesta arriba.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M108 151.3 L186.3 134.7 L178 95.5 L99.7 112.2 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M20 170 L264.5 118 V170 Z" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
        <path d="M60 170 A40 40 0 0 0 59.1 161.7" fill="none" stroke="var(--ink)" stroke-width="0.9"/>
        <text x="64" y="166" font-size="10" fill="var(--ink)">α</text>
        <line x1="143" y1="123.4" x2="143" y2="167.4" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
        <text x="150" y="160" font-size="10" text-anchor="start" fill="var(--flag)">Mg</text>
        <line x1="182" y1="172.4" x2="174.5" y2="137.2" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="188" y="170" font-size="10" text-anchor="start" fill="var(--d2-tinta)">N</text>
        <line x1="106.4" y1="143.5" x2="67.2" y2="151.8" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
        <text x="86" y="140" font-size="10" text-anchor="middle" fill="var(--flag)">F<tspan font-size="7.5" dy="2.5">r</tspan></text>
        <line x1="184.6" y1="126.8" x2="228.6" y2="117.5" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="210" y="112" font-size="10" text-anchor="middle" fill="var(--d2-tinta)">F<tspan font-size="7.5" dy="2.5">t</tspan></text>
        <line x1="116" y1="92.4" x2="155.1" y2="84" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="136" y="80" font-size="10" text-anchor="middle" fill="var(--ink)" font-style="italic">v</text>
        <circle cx="143" cy="123.4" r="2.4" fill="var(--ink)"/>
        <text x="149" y="120" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">G</text>
      </svg>
      <figcaption>

      El tren pasados los 50 s, con la inclinación exagerada: la real, del 1,5 %, apenas se vería.

      </figcaption>
      </figure>

      - **El peso**, $M\,g = 5 \cdot 10^{5} \cdot 9{,}81 = 4905000$ N,
        vertical. A lo largo de la vía, su componente
        $M\,g\operatorname{sen}\alpha$ va cuesta abajo.
      - **La normal**, N, perpendicular a la vía: no trabaja.
      - **La resistencia al rodamiento**, $F_r = 15$ kN, y **la tracción**,
        $F_t$, a lo largo de la vía: la primera hacia atrás y la segunda hacia
        delante.

      **2. Incógnitas.** La tracción, $F_t$, y su potencia, P.

      **3. Ecuaciones.** Pasados los 50 s, el tren va a
      $v = 90/3{,}6 = 25\ \text{m/s}$ constantes, y la aceleración de su
      centro de gravedad es nula. La segunda ley a lo largo de la vía, y la
      potencia de la tracción, que va en la dirección de la velocidad:

      $$
      F_t - F_r - M\,g\operatorname{sen}\alpha = M\,a_G = 0,
      \qquad
      P = F_t\,v
      $$

      **4. Resultados.**

      $$
      F_t = 15000 + 5\cdot 10^{5} \cdot 9{,}81 \cdot 0{,}015 = 88575\ \text{N}
      $$

      $$
      P = F_t\,v = 88575 \cdot 25 = 2{,}214\ \text{MW}
      $$

      **Pasados los 50 s, el tren pide 2,214 MW.** El resultado publicado es
      $P = 2{,}21$ MW. Los datos de los primeros 50 s, arrancar del reposo y
      acelerar uniformemente, sirven solo para fijar la velocidad de
      régimen; la aceleración de ese tramo, $0{,}5\ \text{m/s}^{2}$, no entra
      en esta cuenta.

      **5. Comprobación.** Por la energía, sin la segunda ley. A 25 m/s el
      tren sube $25 \cdot 0{,}015 = 0{,}375$ m cada segundo, y su energía
      cinética no cambia: la tracción tiene que dar, cada segundo, la energía
      potencial que gana el tren y la que se lleva la resistencia.

      $$
      5 \cdot 10^{5} \cdot 9{,}81 \cdot 0{,}375 = 1839375\ \text{W},
      \qquad
      15000 \cdot 25 = 375000\ \text{W}
      $$

      $1{,}839 + 0{,}375 = 2{,}214$ MW. Lo mismo.

      **Lo que dice el resultado.** El 83 % de la potencia, 1,839 de los 2,214
      MW, se va en subir: una pendiente del 1,5 %, que a la vista es casi
      llana, pesa en un tren de 500 t casi cinco veces más que toda la
      resistencia al rodamiento. Y mientras aceleraba, la tracción tenía que
      sumar además $M\,a = 250$ kN: justo antes de llegar a 90 km/h, la
      potencia era $338{,}6 \cdot 25 = 8465$ kW, casi cuatro veces la de
      régimen.

  - id: ejma9-col97-el-collarin-con-la-rampa-soldada
    titulo: El collarín con una rampa soldada y el bloque que sube por ella
    fuente: >-
      Ejercicio 9.7 · Tema 9, «Magnitudes y teoremas fundamentales de la
      dinámica» · Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección
      publica el resultado y el curso publica su resolución; contra los dos
      está contrastado este desarrollo. El texto castellano llama F a la fuerza
      vertical de 5 N y la figura la rotula P.
    nivel: practica
    antes:
      idea: |
        Con varios cuerpos unidos por cables y apoyos, se aísla cada uno y se
        le aplica la segunda ley. Sus aceleraciones no son independientes: las
        relacionan las ligaduras, como un cable inextensible, cuya longitud
        total no cambia.
      formula: |
        Para cada cuerpo, con su masa sacada del peso, $m = W/g$; y para un
        cuerpo B que desliza sobre otro, A, que se traslada sin girar, con
        $\vec{a}_{B/A}$ la aceleración de B vista desde A:

        $$
        \sum\vec{F} = m\,\vec{a},
        \qquad
        \vec{a}_B = \vec{a}_A + \vec{a}_{B/A}
        $$

        Un cable inextensible: la suma de las longitudes de sus tramos es
        constante.
      reconocer: |
        Antes de calcular se mira por dónde pasa el cable y qué tramos cambian
        de longitud.
    enunciado: |
      Un collarín $A$ tiene una rampa soldada y una fuerza $F = 5\ \text{N}$
      aplicada tal y como se muestra. El collarín $A$ y la rampa pesan 3 N, y
      el bloque $B$ 0,8 N. Ignorando la fricción, calcular la fuerza del cable.

