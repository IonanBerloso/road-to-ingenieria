        <text x="116" y="158" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">C</text>
        <circle cx="211.1" cy="38.3" r="2.4" fill="var(--ink)"/>
        <text x="204" y="30" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">D</text>
        <circle cx="231.1" cy="38.3" r="2.4" fill="var(--ink)"/>
        <text x="226" y="58" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">B</text>
        <circle cx="90" cy="170.4" r="2.4" fill="var(--ink)"/>
        <text x="82" y="182" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">I<tspan font-size="7.5" dy="2.5">1</tspan><tspan dy="-2.5"></tspan></text>
        <circle cx="166.3" cy="38.3" r="2.4" fill="var(--ink)"/>
        <text x="173" y="57" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">I<tspan font-size="7.5" dy="2.5">2</tspan><tspan dy="-2.5"></tspan></text>
        <circle cx="251.1" cy="38.3" r="2.4" fill="var(--ink)"/>
        <text x="262" y="50" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">I<tspan font-size="7.5" dy="2.5">3</tspan><tspan dy="-2.5"></tspan></text>
        <text x="160" y="96" font-size="9" text-anchor="start" fill="var(--faint)">2</text>
      </svg>
      <figcaption>

      Sin escala: los discos, más grandes y la barra, más corta; los ángulos, los de la figura. I1 e I3, los contactos, son los CIR del disco y de la rueda; I2, el de la barra, está donde se cortan la perpendicular a la velocidad de C y la de la velocidad de D. Ejes: x hacia la derecha, y hacia arriba; giros positivos en sentido antihorario.

      </figcaption>
      </figure>

      - **La rueda dentada** rueda sobre la cremallera fija: su CIR es el
        contacto, $I_3$. B, a su izquierda, baja a 0,2 m/s constantes: la
        rueda gira en sentido antihorario, y D, al doble de distancia de
        $I_3$, baja al doble.
      - **El disco 1** rueda sobre el plano fijo: su CIR es el contacto,
        $I_1$, y su centro C se mueve paralelo al plano, siempre a $R_1$ de
        él.
      - **La barra CD** tiene su CIR, $I_2$, donde se cortan la recta $I_1C$,
        perpendicular a $\vec{v}_C$, y la horizontal por D. D, a la derecha
        de $I_2$, baja: la barra gira en sentido horario, y C sube por el
        plano. El disco, con C subiendo e $I_1$ debajo, gira en sentido
        antihorario.

      Se resuelve con la figura, que articula la rueda a la barra en D. Con C
      en el origen, x hacia la derecha e y hacia arriba, en metros:
      $D = 5\,(\cos 45^\circ;\ \sin 45^\circ) = (3{,}5355;\ 3{,}5355)$ y
      $B = (3{,}7355;\ 3{,}5355)$. El unitario del plano, hacia abajo,
      $\vec{t} = (\cos 30^\circ;\ -\sin 30^\circ)$, y el normal hacia el
      disco, $\vec{n} = (\sin 30^\circ;\ \cos 30^\circ)$, con
      $\overrightarrow{I_1C} = R_1\vec{n}$.

      **2. Incógnitas.** $\omega_3$, $\vec{v}_D$, $\omega_1$, $\omega_2$,
      $\vec{v}_C$, $\alpha_1$ y $\alpha_2$.

      **3. Ecuaciones.** La rueda, alrededor de su contacto. B baja a
      velocidad constante, así que $\omega_3$ es constante y B no acelera:

      $$
      \vec{v}_B = \omega_3\vec{k}\times\overrightarrow{I_3B},
      \qquad
      \vec{v}_D = \omega_3\vec{k}\times\overrightarrow{I_3D},
      \qquad
      \vec{a}_D = -\omega_3^{2}\,\overrightarrow{BD}
      $$

      El disco, alrededor de su contacto. C va en línea recta, paralela al
      plano, y su aceleración también es paralela al plano:

      $$
      \vec{v}_C = \omega_1\vec{k}\times R_1\vec{n} = -\omega_1 R_1\,\vec{t},
      \qquad
      \vec{a}_C = -\alpha_1 R_1\,\vec{t}
      $$

      Y la barra, de C a D:

      $$
      \vec{v}_D = \vec{v}_C + \omega_2\vec{k}\times\overrightarrow{CD},
      \qquad
      \vec{a}_D = \vec{a}_C + \alpha_2\vec{k}\times\overrightarrow{CD} - \omega_2^{2}\,\overrightarrow{CD}
      $$

      **4. Resultados.** La rueda, con $\overrightarrow{I_3B} = (-0{,}2;\ 0)$,
      $\overrightarrow{I_3D} = (-0{,}4;\ 0)$ y
      $\overrightarrow{BD} = (-0{,}2;\ 0)$: $-0{,}2\,\vec{j} = -0{,}2\,\omega_3\,\vec{j}$.

      $$
      \vec{\omega}_3 = \vec{k}\ \text{rad/s},
      \qquad
      \vec{v}_D = -0{,}4\,\vec{j}\ \text{m/s},
      \qquad
      \vec{a}_D = 0{,}2\,\vec{i}\ \text{m/s}^{2}
      $$

      La barra, en velocidades, con $-R_1\vec{t} = (-0{,}2598;\ 0{,}15)$ y
      $\vec{k}\times\overrightarrow{CD} = (-3{,}5355;\ 3{,}5355)$:

      $$
      (0;\ -0{,}4) = \left(-0{,}2598\,\omega_1 - 3{,}5355\,\omega_2;\ 0{,}15\,\omega_1 + 3{,}5355\,\omega_2\right)
      $$

      Sumando las dos componentes, $-0{,}4 = -0{,}1098\,\omega_1$, y la
      primera da $\omega_2$:

      $$
      \vec{\omega}_1 = 3{,}643\,\vec{k}\ \text{rad/s},
      \qquad
      \vec{\omega}_2 = -0{,}2677\,\vec{k}\ \text{rad/s},
      \qquad
      \vec{v}_C = -0{,}9464\,\vec{i} + 0{,}5464\,\vec{j}\ \text{m/s}
      $$

      En aceleraciones, con
      $\omega_2^{2}\,\overrightarrow{CD} = (0{,}2533;\ 0{,}2533)$:

      $$
      (0{,}2;\ 0) = \left(-0{,}2598\,\alpha_1 - 3{,}5355\,\alpha_2 - 0{,}2533;\ 0{,}15\,\alpha_1 + 3{,}5355\,\alpha_2 - 0{,}2533\right)
      $$

      Sumando, $0{,}2 = -0{,}1098\,\alpha_1 - 0{,}5067$:

      $$
      \vec{\alpha}_1 = -6{,}436\,\vec{k}\ \text{rad/s}^{2},
      \qquad
      \vec{\alpha}_2 = 0{,}3447\,\vec{k}\ \text{rad/s}^{2},
      \qquad
      \vec{a}_C = 1{,}672\,\vec{i} - 0{,}9654\,\vec{j}\ \text{m/s}^{2}
      $$

      **D baja a 0,4 m/s. El disco gira a 3,643 rad/s, antihorario, y la
      barra a 0,2677 rad/s, horaria; C sube por el plano a 1,093 m/s. Y el
      disco tiene una aceleración angular de 6,436 rad/s², horaria: frena.**
      Coinciden con los que publica la colección, que da
      $\omega_2 = 0{,}267$ rad/s: es 0,2677 cortado; redondeado, 0,268.

      **5. Comprobación.** Las velocidades, por el CIR de la barra, que no se
      ha usado. La recta $I_1C$ sube desde C según $\vec{n}$ y llega a la
      altura de D, 3,5355 m, a $3{,}5355/\cos 30^\circ = 4{,}0825$ m de C:
      $I_2 = (2{,}0412;\ 3{,}5355)$, con $I_2C = 4{,}0825$ m e
      $I_2D = 3{,}5355 - 2{,}0412 = 1{,}4943$ m.

      $$
      \omega_2 = \frac{v_D}{I_2D} = \frac{0{,}4}{1{,}4943} = 0{,}2677\ \text{rad/s},
      \qquad
      v_C = 0{,}2677\cdot 4{,}0825 = 1{,}093\ \text{m/s},
      \qquad
      \omega_1 = \frac{v_C}{R_1} = 3{,}643\ \text{rad/s}
      $$

      La aceleración, derivando la condición de que CD no cambie de
      longitud, sin pasar por $\alpha_2$. El vector
      $\vec{w} = \overrightarrow{CD}$ tiene longitud fija, así que
      $\vec{w}\cdot\ddot{\vec{w}} + |\dot{\vec{w}}|^{2} = 0$, con
      $\dot{\vec{w}} = \vec{v}_D - \vec{v}_C = (0{,}9464;\ -0{,}9464)$, de
      cuadrado 1,7914, y
      $\ddot{\vec{w}} = \vec{a}_D - \vec{a}_C = (0{,}2;\ 0) + 0{,}3\,\alpha_1\,(0{,}866;\ -0{,}5)$:

      $$
      3{,}5355\,(0{,}2 + 0{,}1098\,\alpha_1) + 1{,}7914 = 0
      \;\Longrightarrow\;
      \alpha_1 = -6{,}436\ \text{rad/s}^{2}
      $$

      Lo mismo.

      **Lo que dice el resultado.** C va casi tres veces más deprisa que D,
      1,093 frente a 0,4 m/s: las dos velocidades tienen la misma proyección
      sobre la barra, y la de C, que forma 75° con ella, solo deja pasar una
      cuarta parte. Aunque B baje a velocidad constante, el disco frena: la
      barra cambia de ángulo, y con él el reparto. Y la normal de la barra,
      $\omega_2^{2}\,CD = 0{,}358$ m/s², pesa más que la de la rueda, 0,2
      m/s², aunque la barra gire despacio: mide 5 metros.

  - id: ejma8-col88-el-compresor-de-yugo-escoces
    titulo: La velocidad máxima del émbolo de un compresor
    fuente: >-
      Ejercicio 8.8 · Tema 8, «Análisis del movimiento plano» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado y el
      profesor su resolución, contra los que está contrastado el desarrollo.
    nivel: practica
    antes:
      idea: |
        El pasador A pertenece a la pieza giratoria y, a la vez, corre por la
        ranura de la corredera. Su velocidad se escribe de dos formas: como
        punto de la pieza que gira alrededor de O, o como la de la corredera
        más la de su deslizamiento por la ranura. Las dos tienen que
        coincidir.
      formula: |
        La velocidad de un punto de un sólido que gira alrededor de un punto
        fijo O, y la composición de movimientos para un punto que corre por un
        sólido que se traslada sin girar:

        $$
        \vec{v}_A = \vec{\omega}\times\overrightarrow{OA},
        \qquad
        \vec{v}_A = \vec{v}_2 + \vec{v}_{rel}
        $$

        con $\vec{v}_2$ la velocidad del sólido que se traslada, la misma en
        todos sus puntos, y $\vec{v}_{rel}$ la del punto respecto de él.
      reconocer: |
        Antes de calcular se mira la dirección de la ranura y por dónde puede
        moverse la corredera.
    enunciado: |
      El mecanismo que se observa en la figura se emplea para comprimir aire. Si
      la pieza giratoria de 30 cm de longitud gira a una velocidad angular
      constante de 15 rpm, determinar cuándo se da la velocidad máxima del
      émbolo y su valor en ese instante. Se recomienda tomar como origen
      temporal la posición con $x = 0$.

