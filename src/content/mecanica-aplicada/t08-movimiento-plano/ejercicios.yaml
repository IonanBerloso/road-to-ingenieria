      - tipo: calcular
        titulo: La velocidad del punto D
        pregunta: |
          ¿Cuánto vale $v_D$, en m/s?
        respuesta:
          tipo: numero
          valor: '0.4'
          tolerancia: 0.005
          formato: un número, en m/s
        distractores:
          - valor: '0.2'
            mensaje: |
              Esa es la de su centro $B$. La rueda gira además de trasladarse, y
              $D$ está al otro lado del contacto: a doble distancia del CIR,
              doble velocidad.
        pista: |
          $\omega_3 = v_B/R_3$, y $D$ está a $2R_3$ del punto de contacto.
        desarrollo: |
          $$
          \omega_3 = \frac{0{,}2}{0{,}2} = 1\ \text{rad/s}
          \qquad
          v_D = \omega_3 \cdot 2R_3 = 0{,}4\ \text{m/s}
          $$

          Vertical y hacia abajo, como $v_B$.

      - tipo: calcular
        titulo: La velocidad angular del disco 1
        pregunta: |
          ¿Cuánto vale $\omega_1$, en rad/s?
        respuesta:
          tipo: numero
          valor: '3.643'
          tolerancia: 0.02
          formato: un número, en rad/s
        distractores:
          - valor: '0.976'
            mensaje: |
              Ese número sale si el plano sube hacia la derecha. En la figura
              **baja**, así que entre $\vec{v}_C$ y la barra hay $75^{\circ}$ y
              no $15^{\circ}$: el factor es
              $\cos 30^{\circ} - \operatorname{sen}30^{\circ}$, no la suma.
          - valor: '1.333'
            mensaje: |
              Has hecho $v_D/R_1$, como si $C$ llevara la velocidad de $D$. La
              barra $CD$ gira, así que las velocidades de sus dos extremos son
              distintas.
        pista: |
          Proyecta sobre la barra: $\vec{v}_C \cdot \hat{u} = \vec{v}_D \cdot \hat{u}$,
          con $\hat{u}$ el unitario de $CD$. $\vec{v}_C$ es paralela al plano y
          vale $\omega_1 R_1$.
        desarrollo: |
          Con el plano bajando a $30^{\circ}$ y la barra subiendo a
          $45^{\circ}$, la proyección da

          $$
          \omega_1 R_1(\cos 30^{\circ} - \operatorname{sen}30^{\circ}) = v_D
          \;\Longrightarrow\;
          \omega_1 = \frac{0{,}4}{0{,}3 \cdot 0{,}36603} = 3{,}643\ \text{rad/s}
          $$

          Y entonces $v_C = \omega_1 R_1 = 1{,}093$ m/s y
          $\omega_2 = 0{,}268$ rad/s.

      - tipo: calcular
        titulo: La aceleración angular del disco 1
        pregunta: |
          ¿Cuánto vale $\alpha_1$, en rad/s²?
        respuesta:
          tipo: numero
          valor: '6.436'
          tolerancia: 0.02
          formato: un número, en rad/s²
        distractores:
          - valor: '1.821'
            mensaje: |
              Te has dejado la normal de la barra,
              $\omega_2^{2}\,CD = 0{,}358$ m/s². Con 5 metros de barra ese
              término pesa más que el del engranaje aunque $\omega_2$ sea
              pequeña.
          - valor: '0'
            mensaje: |
              Que $v_B$ sea constante hace $\alpha_3 = 0$, no $\alpha_1 = 0$. La
              relación entre las velocidades depende del ángulo de la barra, que
              está cambiando.
        pista: |
          $\vec{a}_D$ es solo la normal del engranaje, $\omega_3^{2}R_3$
          horizontal. Y ojo con $\vec{a}_C$: el disco rueda sobre una **recta**,
          así que su centro va en línea recta y $\vec{a}_C$ es paralela al plano.
        desarrollo: |
          $$
          \alpha_1 = \frac{\omega_3^{2}R_3 + 2\,\omega_2^{2}\,CD\cos 45^{\circ}}
          {R_1(\cos 30^{\circ} - \operatorname{sen}30^{\circ})}
          = \frac{0{,}2 + 0{,}507}{0{,}1098} = 6{,}436\ \text{rad/s}^{2}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La rueda 3 rueda sobre una cremallera fija, así que
              $\omega_3 = v_B/R_3 = 1$ rad/s y $v_D = 2R_3\omega_3 = 0{,}4$ m/s,
              vertical.
          - texto: >-
              $\vec{v}_C$ es paralela al plano y vale $\omega_1 R_1$; igualando
              las proyecciones sobre la barra salen
              $\omega_1 = 3{,}64$ rad/s, $v_C = 1{,}093$ m/s y
              $\omega_2 = 0{,}268$ rad/s.
          - texto: >-
              En aceleraciones, $\vec{a}_C$ es paralela al plano y vale
              $\alpha_1 R_1$, y con la normal de la barra sale
              $\alpha_1 = 6{,}44$ rad/s².
          - texto: >-
              Como el punto de contacto del disco 1 es su CIR, la aceleración
              de $C$ tiene una componente normal $\omega_1^{2}R_1$ dirigida
              hacia él.
            trampa: true
            mensaje: |
              El CIR **no es un punto fijo**, así que no sirve de centro de giro
              para las aceleraciones. Aquí $C$ recorre una recta paralela al
              plano, de modo que $\vec{a}_C$ es puramente tangencial y vale
              $\alpha_1 R_1$: si le añades una normal, $\alpha_1$ sale
              disparada.
