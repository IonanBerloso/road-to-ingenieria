        <text x="196" y="156" font-size="9" text-anchor="middle" fill="var(--faint)">360</text>
        <line x1="215" y1="135" x2="272" y2="135" stroke="var(--faint)" stroke-width="0.7" stroke-dasharray="3 3"/>
        <text x="228" y="130" font-size="9" fill="var(--faint)">30°</text>
