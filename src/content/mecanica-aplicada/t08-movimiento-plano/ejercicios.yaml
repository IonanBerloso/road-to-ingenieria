        <line x1="40" y1="155" x2="74" y2="155" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="60" y="170" font-size="10" text-anchor="middle" fill="var(--ink)" font-style="italic">v<tspan font-size="7.5" dy="2.5">B</tspan></text>
