        <desc id="ejma8-col816-d">Del punto fijo O1 sale la barra 1, de longitud raíz de dos por R, subiendo a 45 grados hasta A. A es una corredera que recorre el contorno de un aro rígido de radio R y centro C. El aro puede girar alrededor del punto fijo O2, que está en su propio contorno, en la misma horizontal que O1 y justo debajo de C. En este instante A y C están a la misma altura. La figura está dibujada a escala.</desc>
