        <text x="110" y="124" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">C</text>
        <circle cx="120" cy="170" r="2.4" fill="var(--ink)"/>
        <text x="112" y="186" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">A</text>
        <circle cx="200" cy="170" r="2.4" fill="var(--ink)"/>
        <text x="212" y="186" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">O<tspan font-size="7.5" dy="2.5">1</tspan><tspan dy="-2.5"></tspan></text>
        <circle cx="40" cy="50" r="2.4" fill="var(--ink)"/>
        <text x="48" y="50" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">I<tspan font-size="7.5" dy="2.5">BC</tspan><tspan dy="-2.5"></tspan></text>
        <circle cx="160" cy="170" r="2.4" fill="var(--ink)"/>
        <text x="162" y="186" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">I<tspan font-size="7.5" dy="2.5">d</tspan><tspan dy="-2.5"></tspan></text>
      </svg>
      <figcaption>

      Sin escala. El CIR de BC está donde se cortan la vertical por B y la perpendicular a la velocidad de C; el del disco, donde esa perpendicular corta la horizontal por A. Ninguno es el contacto A. Ejes: x hacia la derecha, y hacia arriba; giros positivos en sentido antihorario.

      </figcaption>
      </figure>

      En aceleraciones, por BC, con $\vec{a}_B = (0;\ -4\omega^{2}R)$:

      $$
      \vec{a}_C = (0;\ -4\omega^{2}R) + \alpha_{BC}\,(0;\ 2R) - \omega^{2}\,(2R;\ 0)
      = (-2\omega^{2}R;\ -4\omega^{2}R + 2R\,\alpha_{BC})
      $$

      Desde la barra 4, con $\overrightarrow{O_1C} = (-2R;\ R)$: el punto de
      la barra que coincide con C va a
      $-\omega\vec{k}\times\overrightarrow{O_1C} = (\omega R;\ 2\omega R)$,
      así que $\vec{v}_{C/4} = (\omega R;\ 0)$, horizontal, como tenía que
      ser, y el Coriolis vale
      $-2\omega\vec{k}\times\omega R\,\vec{i} = (0;\ -2\omega^{2}R)$:

      $$
      \vec{a}_C = (2\omega^{2}R;\ -\omega^{2}R) + (a_{C/4};\ 0) + (0;\ -2\omega^{2}R)
      = (2\omega^{2}R + a_{C/4};\ -3\omega^{2}R)
      $$

      La vertical da $2R\,\alpha_{BC} = \omega^{2}R$, y la horizontal,
      $a_{C/4} = -4\omega^{2}R$: $\vec{a}_C = (-2\omega^{2}R;\ -3\omega^{2}R)$.
      En el contacto, con $\overrightarrow{CA} = (0;\ -R)$,
      $\alpha_d\vec{k}\times\overrightarrow{CA} = (R\,\alpha_d;\ 0)$, y el
      punto A de la barra, $-\omega^{2}\,\overrightarrow{O_1A} = (2\omega^{2}R;\ 0)$:

      $$
      -2\omega^{2}R + R\,\alpha_d = 2\omega^{2}R
      $$

      $$
      \vec{\alpha}_{BC} = \frac{\omega^{2}}{2}\,\vec{k},
      \qquad
      \vec{\alpha}_d = 4\,\omega^{2}\,\vec{k}
      $$

      **El disco gira a $2\omega$, en sentido horario, y BC a $\omega$, en
      sentido antihorario; el CIR del disco está a R a la derecha de A, y el
      de BC, 2R por encima de B; las aceleraciones angulares valen
      $4\,\omega^{2}$ y $\omega^{2}/2$, las dos antihorarias.** Coinciden con
      los que publica la colección.

      **5. Comprobación.** Por la geometría, sin campos ni composición. Con
      $\theta_1$, $\varphi$ y $\theta_4$ los ángulos de $O_2B$, de BC y de la
      barra 4 con la horizontal: $\dot{\theta}_1 = -2\omega$ y
      $\dot{\theta}_4 = -\omega$, sin aceleraciones angulares, y en el
      instante $\theta_1 = 90^\circ$ y $\varphi = \theta_4 = 0$. Las
      componentes de $\overrightarrow{O_1C}$ son

      $$
      X = R\cos\theta_1 + 2R\cos\varphi - 4R,
      \qquad
      Y = R\sin\theta_1 + 2R\sin\varphi
      $$

      y en el instante $X = -2R$, $Y = R$, $\dot{X} = 2\omega R$,
      $\dot{Y} = 2R\,\dot{\varphi}$, $\ddot{X} = -2R\,\dot{\varphi}^{2}$ e
      $\ddot{Y} = -4\omega^{2}R + 2R\,\ddot{\varphi}$.

      El disco toca la barra mientras C esté a R de su recta:
      $Y\cos\theta_4 - X\sin\theta_4 = R$. Derivando una y dos veces, en el
      instante:

      $$
      \dot{Y} - X\,\dot{\theta}_4 = 0,
      \qquad
      \ddot{Y} - 2\dot{X}\,\dot{\theta}_4 - Y\,\dot{\theta}_4^{2} = 0
      $$

      La primera da $2R\,\dot{\varphi} - 2\omega R = 0$, y
      $\dot{\varphi} = \omega$; la segunda,
      $2R\,\ddot{\varphi} - 4\omega^{2}R + 4\omega^{2}R - \omega^{2}R = 0$, y
      $\ddot{\varphi} = \omega^{2}/2$.

      Y rueda sin deslizar mientras C avance a lo largo de la barra lo que le
      da su giro respecto de ella. Con el disco encima, un giro relativo
      horario lo lleva hacia la derecha: con
      $s = X\cos\theta_4 + Y\sin\theta_4$, $\dot{s} = -R\,(\omega_d - \dot{\theta}_4)$.
      Derivando, en el instante:

      $$
      \dot{s} = \dot{X} + Y\,\dot{\theta}_4 = \omega R,
      \qquad
      \ddot{s} = \ddot{X} - X\,\dot{\theta}_4^{2} + 2\dot{Y}\,\dot{\theta}_4 = -4\omega^{2}R
      $$

      así que $-R\,(\omega_d + \omega) = \omega R$ y
      $-R\,\alpha_d = -4\omega^{2}R$: $\omega_d = -2\omega$ y
      $\alpha_d = 4\,\omega^{2}$. Lo mismo.

      **Lo que dice el resultado.** El punto de contacto no es el CIR del
      disco: la barra sobre la que rueda se mueve, y A sube a $2\omega R$. El
      CIR cae a R de A, sobre la recta de la barra. Lo que sí es como rodar
      sobre una superficie fija es el giro del disco respecto de la barra,
      $\omega_d - \omega_4 = -\omega$, que lo hace avanzar por ella a
      $\omega R$. Y aunque las dos barras motrices giren a velocidad
      constante, el disco y BC tienen aceleración angular, porque la
      geometría cambia: el giro del disco, horario, se frena, y el de BC,
      antihorario, se acelera.

  - id: ejma8-col816-la-corredera-sobre-el-aro
    titulo: Una corredera que recorre el contorno de un aro giratorio
    fuente: >-
      Ejercicio 8.16 · Tema 8, «Análisis del movimiento plano» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado y el
      profesor su resolución, contra los que está contrastado el desarrollo. El
      resultado es simbólico, así que las casillas piden el coeficiente que
      multiplica a la expresión indicada en cada pregunta.
    nivel: practica
    antes:
      idea: |
        La barra y el aro son dos sólidos que giran alrededor de sus puntos
        fijos. Un punto que se mueve por un sólido que gira tiene, visto desde
        él, el movimiento del punto del sólido con el que coincide, el
        arrastre, más el suyo respecto del sólido, el relativo; en las
        aceleraciones aparece además el término de Coriolis.
      formula: |
        Un sólido 2 que gira alrededor de un punto fijo $O_2$, y la
        composición de movimientos respecto de él:

        $$
        \vec{v}_{P \in 2} = \vec{\omega}_2\times\overrightarrow{O_2P},
        \qquad
        \vec{a}_{P \in 2} = \vec{\alpha}_2\times\overrightarrow{O_2P} - \omega_2^{2}\,\overrightarrow{O_2P}
        $$

        $$
        \vec{v}_P = \vec{v}_{P \in 2} + \vec{v}_{P/2},
        \qquad
        \vec{a}_P = \vec{a}_{P \in 2} + \vec{a}_{P/2} + 2\,\vec{\omega}_2\times\vec{v}_{P/2}
        $$
      reconocer: |
        Antes de calcular se mira qué condición impone cada apoyo y cada
        unión.
    enunciado: |
      Una barra rígida $O_1A$, de longitud $R\sqrt{2}$, gira alrededor del punto
      fijo $O_1$ con una velocidad angular $\omega$ de sentido horario, y con
      una aceleración angular $\alpha = \omega^{2}$ de sentido antihorario. El
      extremo de esta barra articula con una corredera $A$ que discurre por el
      contorno de un aro rígido de radio $R$, que puede girar alrededor del
      punto fijo $O_2$. Los puntos fijos $O_1$ y $O_2$ se encuentran sobre la
      misma horizontal y en el instante considerado la barra $O_1A$ forma con la
      horizontal un ángulo de 45º, y el punto $A$ y el centro del aro están
      alineados en la misma horizontal, tal y como se muestra en la figura. Para
      este instante, calcular:

      a) Velocidad angular del aro.

      b) Aceleración angular del aro.

