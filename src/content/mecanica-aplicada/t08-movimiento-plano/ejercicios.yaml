        <circle cx="140" cy="180" r="2.4" fill="var(--ink)"/>
        <text x="147" y="197" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">A</text>
        <circle cx="205.8" cy="165.8" r="2.4" fill="var(--ink)"/>
        <text x="212" y="174" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">C</text>
      </svg>
      <figcaption>

      Solo las direcciones, sin escala: los módulos salen de las ecuaciones. La deslizadera obliga a O a moverse en vertical y la ranura obliga a A a moverse en horizontal; las perpendiculares a esas dos velocidades se cortan en I1, el centro instantáneo de la barra OA. La barra BC gira alrededor de B, así que su punto E se mueve en perpendicular a BC. ω1 es dato, antihoraria; ω2 y ω3 van dibujadas en sentido antihorario, el positivo: si salen negativas, giran al revés.

      </figcaption>
      </figure>

      - **La barra OA (1).** O corre por la deslizadera, en vertical, y A, por
        la ranura, en horizontal. Su centro instantáneo, $I_1$, está donde se
        cortan las perpendiculares: la horizontal por O y la vertical por A.
      - **El disco (2).** Su centro A es el extremo de la barra OA, y gira con
        $\omega_2$.
      - **La barra BC (3).** Gira alrededor de B, así que su punto E se mueve en
        perpendicular a BC, según AE.
      - **El contacto E.** Hay rodadura: el punto E del disco y el punto E de la
        barra llevan la misma velocidad.

      **2. Incógnitas.** $v_O$ y $v_A$; $\omega_2$ y $\omega_3$; y
      $\vec{v}_{A/BC}$.

      **3. Ecuaciones.** La geometría, con R = 0,1 m y O en el origen:
      $A = (2R;\ R)$ y $B = (0;\ 3R)$, así que $BA = 2\sqrt{2}\,R$. La barra BC
      es tangente al disco en E, de modo que $AE \perp BC$ y
      $BE = \sqrt{BA^{2} - R^{2}} = \sqrt{7}\,R$, que es la cota de la figura.
      El ángulo β que forma AE con la vertical es el mismo que forma la barra
      con la horizontal, y sale de $\cos(45^{\circ} + \beta) = R/BA = \sqrt{2}/4$:

      $$
      \beta \approx 24{,}3^{\circ},
      \qquad
      \cos\beta = \frac{1 + \sqrt{7}}{4} \approx 0{,}9114,
      \qquad
      \operatorname{sen}\beta = \frac{\sqrt{7} - 1}{4} \approx 0{,}4114
      $$

      La barra OA gira alrededor de $I_1 = (2R;\ 0)$, que está a $2R$ de O y a
      $R$ de A:

      $$
      v_O = \omega_1\cdot 2R, \qquad v_A = \omega_1\,R
      $$

      En E, la velocidad del punto de la barra es
      $\vec{\omega}_3\times\overrightarrow{BE}$, según AE; la del punto del
      disco es $\vec{v}_A + \vec{\omega}_2\times\overrightarrow{AE}$, cuyo
      segundo término va según BC. Con $\vec{v}_A = -v_A\,\vec{\imath}$, las
      ω positivas en sentido antihorario y las dos velocidades proyectadas
      sobre BC, de B hacia C, y sobre AE, de A hacia E:

      $$
      \text{según BC:}\quad -v_A\cos\beta - \omega_2\,R = 0,
      \qquad
      \text{según AE:}\quad -v_A\operatorname{sen}\beta = \omega_3\,\sqrt{7}\,R
      $$

      Y la velocidad de A respecto de la barra, con el punto de la barra
      —prolongada como sólido rígido— que en este instante coincide con A:

      $$
      \vec{v}_{A/BC} = \vec{v}_A - \vec{v}_{A \in BC},
      \qquad
      \vec{v}_{A \in BC} = \vec{\omega}_3\times\overrightarrow{BA}
      $$

      **4. Resultados.** a) Con $\omega_1 = 10$ rad/s antihoraria:

      $$
      v_A = 10\cdot 0{,}1 = 1\ \text{m/s},
      \qquad
      v_O = 10\cdot 0{,}2 = 2\ \text{m/s},
      \qquad
      \vec{v}_A = -1\,\vec{\imath}\ \text{m/s},
      \qquad
      \vec{v}_O = -2\,\vec{\jmath}\ \text{m/s}
      $$

      A va hacia la izquierda y O baja.

      b) Las velocidades angulares:

      $$
      \omega_2 = -\frac{v_A\cos\beta}{R} = -\frac{1 + \sqrt{7}}{4}\cdot 10 \approx -9{,}114\ \text{rad/s},
      \qquad
      \omega_3 = -\frac{v_A\operatorname{sen}\beta}{\sqrt{7}\,R} = -\frac{\sqrt{7} - 1}{4\,\sqrt{7}}\cdot 10 \approx -1{,}555\ \text{rad/s}
      $$

      Las dos salen negativas: $\vec{\omega}_2 \approx -9{,}114\,\vec{k}$ rad/s
      y $\vec{\omega}_3 \approx -1{,}555\,\vec{k}$ rad/s, horarias, al revés de
      como se dibujaron.

      c) La velocidad de A respecto de la barra:

      $$
      \vec{v}_{A \in BC} = -1{,}555\,\vec{k}\times(0{,}2;\ -0{,}2;\ 0) = (-0{,}311;\ -0{,}311)\ \text{m/s}
      $$

      $$
      \vec{v}_{A/BC} = (-1;\ 0) - (-0{,}311;\ -0{,}311) = (-0{,}689;\ 0{,}311)\ \text{m/s},
      \qquad
      \left|\vec{v}_{A/BC}\right| \approx 0{,}756\ \text{m/s}
      $$

      Paralela a BC, apuntando de C hacia B: hacia arriba y a la izquierda,
      que es el dibujo que pide el apartado. Coincide con el
      $(-0{,}688;\ 0{,}312)$ m/s que publica la colección, y con la
      resolución del profesor, que da 0,756 m/s, 9,11 y 1,56 rad/s.

      **5. Comprobación.** El movimiento del disco visto desde la barra, que
      no se ha usado. Respecto de la barra, el disco rueda sin deslizar sobre
      ella: gira con $\omega_2 - \omega_3$ y su centro instantáneo es E, el
      punto de contacto. Su centro A se mueve entonces en perpendicular a AE,
      o sea paralelo a BC, a

      $$
      R\left|\omega_2 - \omega_3\right| = 0{,}1\cdot\left|-9{,}114 + 1{,}555\right| = 0{,}756\ \text{m/s} = \frac{2}{\sqrt{7}}\ \text{m/s}
      $$

      el mismo módulo y la misma dirección que en c), y con los dos giros de
      b).

      **Lo que dice el resultado.** Rodadura no quiere decir que el punto de
      contacto esté quieto: aquí E se mueve, a
      $\left|\omega_3\right|\cdot BE \approx 0{,}411$ m/s según AE, porque la
      barra en la que se apoya gira. Lo que la rodadura impone es que los dos
      puntos en contacto vayan juntos. El disco gira seis veces más deprisa
      que la barra, y respecto de ella su centro avanza paralelo a BC, hacia
      B, sin acercarse ni alejarse: el disco sigue apoyado.

  - id: ejma8-col810-la-placa-triangular-que-se-traslada
    titulo: La placa triangular colgada de dos barras iguales
    fuente: >-
      Ejercicio 8.10 · Tema 8, «Análisis del movimiento plano» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    antes:
      idea: |
        La placa es un sólido rígido, sujeto por dos articulaciones: su
        velocidad angular sale de comparar las velocidades de esos dos puntos.
        Cada barra gira alrededor de su punto fijo, y la velocidad de su
        extremo es perpendicular a ella.
      formula: |
        Los campos de velocidades y de aceleraciones del sólido rígido en el
        plano, con A un punto conocido:

        $$
        \vec{v}_P = \vec{v}_A + \vec{\omega}\times\overrightarrow{AP},
        \qquad
        \vec{a}_P = \vec{a}_A + \vec{\alpha}\times\overrightarrow{AP} - \omega^{2}\,\overrightarrow{AP}
        $$

        Para una barra que gira alrededor de un punto fijo, A es ese punto,
        con $\vec{v}_A = \vec{a}_A = \vec{0}$.
      reconocer: |
        Antes de calcular se miran las longitudes y las direcciones de las dos
        barras.
    enunciado: |
      En el sistema de la figura las barras $AB$ y $CD$ tienen la misma longitud
      y sostienen una placa triangular a través de las articulaciones $B$ y $D$.
      Sabiendo que la barra $CD$ tiene en este instante una velocidad angular
      $\omega_{CD} = 4$ rad/s y una aceleración angular
      $\alpha_{CD} = 2$ rad/s² calcule la velocidad angular y la aceleración
      angular de la placa.

      <figure>
      <svg viewBox="0 0 310 255" role="img" width="310" height="255" aria-labelledby="ejma8-col810-t ejma8-col810-d">
        <title id="ejma8-col810-t">Placa triangular BDE colgada del techo por dos barras iguales AB y CD</title>
        <desc id="ejma8-col810-d">Del techo cuelgan dos barras iguales de 60 centímetros, AB y CD, las dos formando 60 grados con el techo e inclinadas hacia la derecha. Sus extremos inferiores B y D sostienen una placa triangular cuyo tercer vértice E queda por debajo, a 50 centímetros en horizontal de cada uno de ellos. El centro de gravedad G de la placa está 25 centímetros por debajo del lado BD. La figura está dibujada a escala.</desc>
