    pide: La aceleración de D, la aceleración angular de la barra BDE y la aceleración de E.
    pasos:
      - tipo: reconocer
        pregunta: |
          $B$, $D$ y $E$ están alineados y las barras $AB$ y $CD$ son las dos
          verticales y del mismo lado. ¿Qué sale al plantear las velocidades?
        opciones:
          - texto: Que la barra BDE se traslada en este instante, con ω igual a cero
            correcta: true
            mensaje: |
              Eso es. $v_B$ y $v_D$ son las dos horizontales —perpendiculares a
              sus barras verticales— y $BD$ no lo es, así que la única forma de
              que las dos sean horizontales es que $\omega_{BDE} = 0$ y las dos
              velocidades sean iguales.
          - texto: Que el CIR de BDE está en el corte de AB con CD, o sea en el infinito
            mensaje: |
              Bien visto lo de las perpendiculares, pero fíjate en cuáles son:
              las perpendiculares a $v_B$ y a $v_D$ son las propias barras $AB$
              y $CD$, que son **paralelas**. Se cortan en el infinito, que es
              justo la traslación.
          - texto: Que ω de BDE vale 6 rad/s, la misma que la de AB
            mensaje: |
              Cada sólido tiene su velocidad angular. $B$ pertenece a $AB$ y a
              $BDE$, así que comparten la **velocidad de B**, no la velocidad
              angular.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **las tres barras con el giro de
          AB, la dirección de las velocidades de B y de D y el sentido de giro
          de CD**. Solo las direcciones, sin escala.
        comprueba:
          - punto: |
              **$\vec{v}_B$ horizontal, hacia la derecha.**
            porque: |
              B gira alrededor del punto fijo A en sentido horario, con AB
              vertical y B por encima de A: se mueve en perpendicular a AB,
              hacia la derecha.
          - punto: |
              **$\vec{v}_D$ horizontal, y la barra BDE sin giro.**
            porque: |
              D gira alrededor de C con CD vertical: su velocidad es
              horizontal. Con las dos velocidades horizontales y BD
              inclinada, un giro de BDE le daría a D una velocidad respecto
              de B perpendicular a BD, con parte vertical, que D no tiene.
          - punto: |
              **$\omega_{CD}$, horaria.**
            porque: |
              D va hacia la derecha, como B, y está por encima de C: para
              llevarlo hacia la derecha, CD tiene que girar en sentido
              horario.
        figura: |
          <svg viewBox="0 50 292 186" role="img" width="292" height="186" aria-labelledby="dsl-t dsl-d">
