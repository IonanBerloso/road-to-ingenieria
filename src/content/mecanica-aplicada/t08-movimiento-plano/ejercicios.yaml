      - tipo: calcular
        titulo: La velocidad angular del aro
        pregunta: |
          Escribiendo $\vec{\omega}_{\text{aro}} = k\,\omega\vec{k}$, ¿cuánto
          vale $k$?
        respuesta:
          tipo: numero
          valor: '-1'
          tolerancia: 0.01
          formato: un número con su signo, el coeficiente que multiplica a omega
        distractores:
          - valor: '1.414'
            mensaje: |
              Has usado la longitud de la barra, $\sqrt{2}R$, como brazo del aro.
              El aro gira alrededor de $O_2$, y lo que cuenta es
              $\overrightarrow{O_2A}$, que también mide $\sqrt{2}R$ pero tiene
              otra dirección: hay que proyectar.
          - valor: '-0.5'
            mensaje: |
              Falta un factor dos. La componente horizontal de $\vec{v}_A$ es
              $\omega R$, y la del punto del aro sale de multiplicar $\omega_2$
              por la altura de $A$ sobre $O_2$, que vale $R$: el cociente es
              exactamente $\omega$.
        pista: |
          $\vec{v}_A = \vec{\omega}_1 \times \overrightarrow{O_1A} = (\omega R;\ -\omega R)$.
          Y $\vec{v}_{A/2}$ es tangente al aro en $A$, o sea **vertical**, porque
          el radio $CA$ es horizontal.
        desarrollo: |
          Con $O_1 = (0;\ 0)$, $A = (R;\ R)$, $C = (2R;\ R)$ y $O_2 = (2R;\ 0)$:

          $$
          \vec{v}_A = (\omega R;\ -\omega R)
          \qquad
          \vec{v}_{A \in 2} = \omega_2\,\vec{k}\times(-R;\ R) = \omega_2(-R;\ -R)
          $$

          La componente horizontal no la toca el deslizamiento, que es vertical:

          $$
          \omega R = -R\,\omega_2 \;\Longrightarrow\; \omega_2 = -\omega
          $$

      - tipo: calcular
        titulo: La velocidad de la corredera respecto del aro
        pregunta: |
          Escribiendo $|\vec{v}_{A/2}| = k\,\omega R$, ¿cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número, el coeficiente que multiplica a omega por R
        distractores:
          - valor: '1.414'
            mensaje: |
              Ese es el módulo de $\vec{v}_A$, $\sqrt{2}\,\omega R$. La relativa
              se obtiene restando $\vec{v}_{A \in 2}$, y como las dos verticales
              van en sentidos contrarios, la diferencia es mayor que cada una.
          - valor: '1'
            mensaje: |
              Esa es la componente vertical de $\vec{v}_A$ sola,
              $\omega R$. Falta restarle la del punto del aro, que vale
              $+\omega R$, y la resta da $-2\omega R$.
        pista: |
          $\vec{v}_{A/2} = \vec{v}_A - \vec{v}_{A \in 2}$, y solo tiene
          componente vertical.
        desarrollo: |
          $$
          \vec{v}_{A/2} = (\omega R;\ -\omega R) - (\omega R;\ \omega R)
          = (0;\ -2\omega R)
          $$

          Tangente al aro, como tenía que ser.

      - tipo: calcular
        titulo: La aceleración angular del aro
        pregunta: |
          Escribiendo $\vec{\alpha}_{\text{aro}} = k\,\omega^{2}\vec{k}$,
          ¿cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.02
          formato: un número, el coeficiente que multiplica a omega cuadrado
        distractores:
          - valor: '7'
            mensaje: |
              Te has dejado el término de Coriolis,
              $2\,\omega_2 v_{A/2} = 4\omega^{2}R$. Con una corredera sobre un
              sólido que gira siempre aparece, y aquí cancela exactamente la
              normal relativa.
          - valor: '-1'
            mensaje: |
              Te has dejado la normal del movimiento relativo,
              $v_{A/2}^{2}/R = 4\omega^{2}R$. Respecto del aro, $A$ recorre una
              circunferencia de radio $R$, no una recta.
        pista: |
          Proyecta sobre la horizontal. Intervienen la normal y la tangencial de
          la barra, la normal y la tangencial del aro, la normal relativa
          $v_{A/2}^{2}/R$ y el Coriolis $2\,\vec{\omega}_2 \times \vec{v}_{A/2}$.
        desarrollo: |
          Con $\vec{a}_A = (-2\omega^{2}R;\ 0)$, la normal relativa
          $(4\omega^{2}R;\ 0)$ y el Coriolis $(-4\omega^{2}R;\ 0)$, la
          componente horizontal deja

          $$
          -2\omega^{2}R = -R\,\alpha_2 + \omega^{2}R
          \;\Longrightarrow\;
          \alpha_2 = 3\,\omega^{2}
          $$

          Los dos términos relativos se cancelan entre sí, lo que hace que
          olvidarse de **los dos** dé por casualidad el resultado correcto, y
          olvidarse de uno solo, no.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $\vec{v}_A = (\omega R;\ -\omega R)$, y como el radio $CA$ es
              horizontal, el deslizamiento por el aro es vertical.
          - texto: >-
              Igualando las componentes horizontales sale
              $\vec{\omega}_{\text{aro}} = -\omega\vec{k}$, y restando,
              $v_{A/2} = 2\omega R$.
          - texto: >-
              En aceleraciones hay que añadir la normal relativa
              $v_{A/2}^{2}/R$ y el Coriolis, y la proyección horizontal da
              $\alpha_{\text{aro}} = 3\omega^{2}$.
          - texto: >-
              Como $A$ está articulada al extremo de la barra, es un punto del
              aro y su aceleración es la del aro en ese punto.
            trampa: true
            mensaje: |
              $A$ está articulada a la **barra**, no al aro: por el aro
              **resbala**. Entre $\vec{a}_A$ y $\vec{a}_{A \in 2}$ hay tres
              términos de diferencia —la tangencial relativa, la normal relativa
              y el Coriolis—, y sin ellos $\alpha$ sale mal.
    resolucion: |
      **1. Esquema de velocidades.** Es un problema de movimiento relativo,
      con una corredera que resbala por un sólido que gira: el dibujo lleva la
      velocidad de A, la del punto del aro que coincide con A y la del
      deslizamiento, sin escala.

