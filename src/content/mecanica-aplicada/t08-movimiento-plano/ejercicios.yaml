        <text x="262" y="66" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">ω<tspan font-size="7.5" dy="2.5">b</tspan><tspan dy="-2.5"></tspan></text>
        <path d="M34.5 55 A16 16 0 0 0 51.3 51.3" fill="none" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="30" y="70" font-size="10" text-anchor="end" fill="var(--ink)" font-style="italic">ω<tspan font-size="7.5" dy="2.5">a</tspan><tspan dy="-2.5"></tspan></text>
        <line x1="240" y1="155.5" x2="295.4" y2="155.5" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="300" y="152" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">v<tspan font-size="7.5" dy="2.5">D</tspan></text>
        <line x1="240" y1="155.5" x2="253.9" y2="131.5" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="258" y="124" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">v<tspan font-size="7.5" dy="2.5">D∈2</tspan><tspan dy="-2.5"></tspan></text>
        <line x1="240" y1="155.5" x2="281.6" y2="179.5" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="274" y="190" font-size="10" text-anchor="end" fill="var(--ink)" font-style="italic">v<tspan font-size="7.5" dy="2.5">D/2</tspan><tspan dy="-2.5"></tspan></text>
        <circle cx="40" cy="40" r="2.4" fill="var(--ink)"/>
        <text x="40" y="30" font-size="10" text-anchor="middle" font-weight="700" fill="var(--ink)">A</text>
        <circle cx="240" cy="40" r="2.4" fill="var(--ink)"/>
        <text x="240" y="30" font-size="10" text-anchor="middle" font-weight="700" fill="var(--ink)">B</text>
        <circle cx="240" cy="155.5" r="2.4" fill="var(--ink)"/>
        <text x="230" y="172" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">D</text>
        <text x="246" y="100" font-size="9" text-anchor="start" fill="var(--faint)">1</text>
        <text x="140" y="88" font-size="9" text-anchor="start" fill="var(--faint)">2</text>
      </svg>
      <figcaption>

      Solo las direcciones. La velocidad de D, que da la varilla 1, es la suma de la del punto de la varilla 2 que coincide con D, perpendicular a AD, y de la relativa, a lo largo de AD. Ejes: x hacia la derecha, y hacia arriba; giros positivos en sentido antihorario.

      </figcaption>
      </figure>

      - **La varilla 1** gira alrededor de B a 6 rad/s, constante, en
        sentido antihorario: D, su extremo, va hacia la derecha.
      - **La varilla 2** gira alrededor de A, y D corre por ella: la
        velocidad de D es la del punto de la varilla 2 que coincide con D,
        perpendicular a AD, más la relativa, a lo largo de AD.
      - **Las dos componentes**, alejándose de A y hacia arriba y a la
        derecha: la varilla 2 gira en sentido antihorario.

      Con A en el origen, x hacia la derecha e y hacia arriba:
      $B = (0{,}4;\ 0)$ y $D = (0{,}4;\ -0{,}4\tan 30^\circ) = (0{,}4;\ -0{,}2309)$
      m, con $BD = 0{,}2309$ m y $AD = 0{,}4619$ m. El unitario de A hacia D,
      $\vec{e} = (\cos 30^\circ;\ -\sin 30^\circ)$, y su perpendicular,
      $\vec{n} = \vec{k}\times\vec{e} = (\sin 30^\circ;\ \cos 30^\circ)$.

      **2. Incógnitas.** $\omega_a$, $\alpha_a$, y la velocidad y la
      aceleración de D respecto de la varilla 2, $v_{D/2}$ y $a_{D/2}$.

      **3. Ecuaciones.** D, desde la varilla 1, que gira alrededor de B con
      $\omega_b$ constante:

      $$
      \vec{v}_D = \omega_b\vec{k}\times\overrightarrow{BD},
      \qquad
      \vec{a}_D = -\omega_b^{2}\,\overrightarrow{BD}
      $$

      Y desde la varilla 2, por composición, con
      $\vec{v}_{D/2} = v_{D/2}\,\vec{e}$ y $\vec{a}_{D/2} = a_{D/2}\,\vec{e}$:

      $$
      \vec{v}_D = \omega_a AD\,\vec{n} + v_{D/2}\,\vec{e},
      \qquad
      \vec{a}_D = \alpha_a AD\,\vec{n} - \omega_a^{2}AD\,\vec{e}
      + a_{D/2}\,\vec{e} + 2\,\omega_a v_{D/2}\,\vec{n}
      $$

      Cada igualdad se proyecta sobre $\vec{n}$ y sobre $\vec{e}$.

      **4. Resultados.** $\vec{v}_D = 6\cdot 0{,}2309\,\vec{i} = 1{,}386\,\vec{i}$
      m/s, y $\vec{i}\cdot\vec{n} = \sin 30^\circ$,
      $\vec{i}\cdot\vec{e} = \cos 30^\circ$:

      $$
      \omega_a = \frac{1{,}386\sin 30^\circ}{0{,}4619} = 1{,}5\ \text{rad/s},
      \qquad
      v_{D/2} = 1{,}386\cos 30^\circ = 1{,}2\ \text{m/s}
      $$

      $\vec{a}_D = 36\cdot 0{,}2309\,\vec{j} = 8{,}314\,\vec{j}$ m/s², hacia
      B, y $\vec{j}\cdot\vec{n} = \cos 30^\circ$,
      $\vec{j}\cdot\vec{e} = -\sin 30^\circ$:

      $$
      \alpha_a = \frac{8{,}314\cos 30^\circ - 2\cdot 1{,}5\cdot 1{,}2}{0{,}4619}
      = \frac{7{,}2 - 3{,}6}{0{,}4619} = 7{,}794\ \text{rad/s}^{2},
      \qquad
      a_{D/2} = -8{,}314\sin 30^\circ + 1{,}5^{2}\cdot 0{,}4619 = -3{,}118\ \text{m/s}^{2}
      $$

      $$
      \vec{\omega}_a = 1{,}5\,\vec{k}\ \text{rad/s},
      \qquad
      \vec{\alpha}_a = 7{,}794\,\vec{k}\ \text{rad/s}^{2}
      $$

      **La varilla articulada en A gira a 1,5 rad/s y acelera a 7,794
      rad/s², las dos en sentido antihorario.** D corre por ella a 1,2 m/s,
      alejándose de A, y frenando a 3,118 m/s². Los dos resultados pedidos
      coinciden con los que publica la colección.

      **5. Comprobación.** Por la geometría, sin composición de
      movimientos. Con $\varphi$ el giro de la varilla 1, D está en
      $(0{,}4 + r\sin\varphi;\ -r\cos\varphi)$, con $r = BD$, y el ángulo
      $\theta$ que la varilla 2 baja desde la horizontal cumple

      $$
      \tan\theta = \frac{r\cos\varphi}{0{,}4 + r\sin\varphi}
      $$

      En $\varphi = 0$, con $r = 0{,}4\tan 30^\circ$, las derivadas del
      segundo miembro respecto de $\varphi$ valen $-1/3$ y
      $-1/(3\sqrt{3})$, y $1 + \tan^{2}\theta = 4/3$. Derivando dos veces
      respecto del tiempo, con $\dot\varphi = 6$ rad/s y
      $\ddot\varphi = 0$:

      $$
      \tfrac{4}{3}\,\dot\theta = -\tfrac{1}{3}\cdot 6
      \;\Longrightarrow\;
      \dot\theta = -1{,}5\ \text{rad/s}
      $$

      $$
      \tfrac{4}{3}\,\ddot\theta + 2\cdot\tfrac{4}{3}\tan 30^\circ\,\dot\theta^{2}
      = -\frac{36}{3\sqrt{3}}
      \;\Longrightarrow\;
      \ddot\theta = -7{,}794\ \text{rad/s}^{2}
      $$

      Como $\theta$ se mide hacia abajo, los signos negativos son giros
      antihorarios: 1,5 rad/s y 7,794 rad/s², lo mismo.

      **Lo que dice el resultado.** La varilla 2 gira cuatro veces más
      despacio que la 1: de la velocidad de D, solo la parte perpendicular a
      AD la hace girar, y además D está lejos de A; el resto es
      deslizamiento. En la aceleración, Coriolis, $2\,\omega_a v_{D/2} = 3{,}6$
      m/s², se lleva la mitad de lo que la varilla 1 empuja en esa
      dirección: sin él, saldría el doble.

  - id: ejma8-col87-el-disco-en-el-plano-y-el-engranaje
    titulo: Un disco en un plano inclinado unido a un engranaje
    fuente: >-
      Ejercicio 8.7 · Tema 8, «Análisis del movimiento plano» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado y el
      profesor su resolución, contra los que está contrastado el desarrollo. El
      enunciado dice que el engranaje está articulado a la barra en el punto C
      cuando la figura lo articula en D; se reproduce tal cual y se resuelve con
      la figura.
    nivel: practica
    antes:
      idea: |
        Cada sólido del mecanismo, el disco, la barra y la rueda, tiene su
        propio giro. En cada instante, cada uno tiene un punto del plano, unido
        a él, con velocidad nula: su centro instantáneo de rotación, alrededor
        del cual gira en ese instante. Las aceleraciones de dos puntos de un
        sólido se relacionan con su velocidad angular y su aceleración angular.
      formula: |
        Los campos de velocidades y de aceleraciones del sólido rígido en el
        plano, con A un punto conocido e I el centro instantáneo de
        rotación:

        $$
        \vec{v}_P = \vec{v}_A + \vec{\omega}\times\overrightarrow{AP},
        \qquad
        \vec{v}_P = \vec{\omega}\times\overrightarrow{IP}
        $$

        $$
        \vec{a}_P = \vec{a}_A + \vec{\alpha}\times\overrightarrow{AP} - \omega^{2}\,\overrightarrow{AP}
        $$
      reconocer: |
        Antes de calcular se mira cómo se mueve cada sólido respecto de lo que
        está fijo: el plano y la cremallera.
    enunciado: |
      En la figura mostrada, el disco 1 se apoya sin deslizar en un plano
      inclinado y está articulado a la barra $CD$ (2) en su centro. Por otro
      lado, la rueda dentada 3 rueda sobre una cremallera vertical (fija) y
      está articulada a la barra en el punto $C$. Calcular:

      a) Velocidad del punto $D$.

      b) Velocidad angular del disco (1), de la barra $CD$ (2) y velocidad de
      punto $C$.

      c) Aceleración angular del disco (1).

      Datos: $R_1 = 0{,}3\ \text{m}$; $R_3 = 0{,}2\ \text{m}$;
      $CD = 5\ \text{m}$; $v_B = 0{,}2\ \text{m/s}$ (constante)

