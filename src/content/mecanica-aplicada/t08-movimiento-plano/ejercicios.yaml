        <desc id="ejma8-col84-d">La barra 1 es recta, mide 500 milímetros y va de A, sobre una pared vertical, hasta B, sobre el suelo horizontal; el pasador D es su punto medio. A está 400 milímetros por encima del suelo y B, 300 a la derecha de la pared. De D arranca la barra 2, DE, también de 500 milímetros, hasta E, que corre por una guía horizontal situada 500 milímetros por encima del suelo. B avanza hacia la izquierda a 360 milímetros por segundo constantes. La figura está dibujada a escala.</desc>
        <defs>
