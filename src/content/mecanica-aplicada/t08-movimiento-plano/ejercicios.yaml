      - tipo: calcular
        titulo: La velocidad de la deslizadera A
        pregunta: |
          Escribiendo $v_A = k\,\omega R$, ¿cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número, el coeficiente que multiplica a omega por R
        distractores:
          - valor: '1'
            mensaje: |
              Ese es el coeficiente de $v_O$, la velocidad del centro. $B$ está
              al otro lado del contacto, a $2R$ de él, así que va al doble; y
              como la barra no gira, $A$ lleva lo mismo que $B$.
          - valor: '2.828'
            mensaje: |
              Has usado la longitud de la barra, $2\sqrt{2}R$, como si fuera un
              brazo de giro. La barra no gira en este instante: se traslada, y
              $v_A = v_B$.
        pista: |
          El CIR del disco es el punto de contacto y $B$ está a $2R$ de él, así
          que $v_B = 2\omega R$, paralela al plano. Después mira qué le pasa a la
          barra.
        desarrollo: |
          $$
          v_B = \omega\,(2R) = 2\omega R \quad \text{paralela al plano}
          $$

          Y como $\vec{v}_A$ también es paralela al plano —$A$ es una deslizadera
          sobre él— y $\overrightarrow{AB}$ no lo es, la barra solo puede
          trasladarse:

          $$
          \omega_{AB} = 0
          \qquad
          v_A = v_B = 2\,\omega R
          $$

      - tipo: calcular
        titulo: La aceleración angular de la barra AB
        pregunta: |
          Escribiendo $\vec{\alpha}_{AB} = k\,\omega^{2}\vec{k}$, ¿cuánto vale
          $k$?
        respuesta:
          tipo: numero
          valor: '-0.5'
          tolerancia: 0.01
          formato: un número con su signo, el coeficiente que multiplica a omega cuadrado
        distractores:
          - valor: '0'
            mensaje: |
              La barra no gira **en este instante**, pero eso no obliga a que su
              aceleración angular sea nula: un instante después $A$ y $B$ dejan
              de ir a la misma velocidad.
          - valor: '-0.354'
            mensaje: |
              Parece que has usado la longitud entera de la barra,
              $2\sqrt{2}R$, donde va su componente a lo largo del plano, que
              vale $2R$.
        pista: |
          $\vec{a}_B = \omega^{2}R$ apuntando de $B$ hacia $O$, o sea
          perpendicular al plano. Y $\vec{a}_A$ es paralela al plano: eso basta.
        desarrollo: |
          En ejes del plano, con $\vec{a}_B = (0;\ -\omega^{2}R)$ y
          $\overrightarrow{BA} = (-2R;\ -2R)$, anulando la componente
          perpendicular de $\vec{a}_A$:

          $$
          -\omega^{2}R - 2R\,\alpha_{AB} = 0
          \;\Longrightarrow\;
          \alpha_{AB} = -\frac{\omega^{2}}{2}
          $$

      - tipo: calcular
        titulo: La aceleración de la deslizadera A
        pregunta: |
          Escribiendo $a_A = k\,\omega^{2}R$ sobre el eje que apunta plano
          arriba, ¿cuánto vale $k$ con su signo?
        respuesta:
          tipo: numero
          valor: '-1'
          tolerancia: 0.01
          formato: un número con su signo, el coeficiente que multiplica a omega cuadrado por R
        distractores:
          - valor: '0'
            mensaje: |
              Sería cero si $A$ fuera a velocidad constante, y no lo es: la barra
              tiene $\alpha_{AB} = -\omega^{2}/2$, que frena a $A$ aunque el disco
              suba a velocidad constante.
          - valor: '1'
            mensaje: |
              El módulo está bien y el signo no. La aceleración de $A$ apunta
              plano **abajo**: la deslizadera está frenando aunque el disco suba
              uniformemente.
        pista: |
          Con $\alpha_{AB}$ ya conocida, la componente paralela al plano de
          $\vec{a}_A = \vec{a}_B + \vec{\alpha}_{AB} \times \overrightarrow{BA}$.
        desarrollo: |
          $$
          a_A = 2R\,\alpha_{AB} = 2R\left(-\frac{\omega^{2}}{2}\right)
          = -\omega^{2}R
          $$

          Es decir, $\omega^{2}R$ dirigida hacia abajo por el plano.

      - tipo: calcular
        titulo: El polo de aceleraciones de la barra
        pregunta: |
          El polo de aceleraciones de $AB$ está sobre la perpendicular al plano
          trazada por $A$. ¿A qué distancia de $A$, en unidades de $R$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número, la distancia en unidades de R
        distractores:
          - valor: '0'
            mensaje: |
              Eso sería decir que $\vec{a}_A = 0$, y no lo es: vale
              $\omega^{2}R$ plano abajo. El polo es el punto donde la
              aceleración se anula, y aquí no es ninguno de los dos extremos.
          - valor: '2.828'
            mensaje: |
              Esa es la longitud de la barra, $2\sqrt{2}R$. El polo no tiene por
              qué estar sobre la barra: aquí queda fuera de ella.
        pista: |
          Impón $\vec{a}_P = \vec{a}_A + \vec{\alpha}_{AB}\times\overrightarrow{AP} = 0$,
          con $\omega_{AB} = 0$.
        desarrollo: |
          $$
          0 = (-\omega^{2}R;\ 0) + \left(-\frac{\omega^{2}}{2}\right)\vec{k}\times(p;\ q)
          \;\Longrightarrow\;
          p = 0,\quad q = 2R
          $$

          O sea $x_P = x_A$ e $y_P = y_A + 2R$ en ejes del plano: el polo está a
          $2R$ de $A$, separándose del plano, y no coincide ni con $A$, ni con
          $B$, ni con el CIR.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El disco rueda sobre un plano fijo, así que su CIR es el contacto y
              $v_B = 2\omega R$, paralela al plano.
          - texto: >-
              Como $\vec{v}_A$ también es paralela al plano y la barra no lo es,
              $\omega_{AB} = 0$ y $v_A = v_B = 2\omega R$.
          - texto: >-
              Con $\vec{a}_O = 0$, $\vec{a}_B = \omega^{2}R$ hacia $O$, y de ahí
              $\alpha_{AB} = -\omega^{2}/2$, $a_A = \omega^{2}R$ plano abajo y el
              polo a $2R$ de $A$.
          - texto: >-
              El polo de aceleraciones de la barra coincide con su centro
              instantáneo de rotación.
            trampa: true
            mensaje: |
              Son dos puntos distintos, y este ejercicio lo enseña de la forma
              más clara posible: la barra **no gira**, así que su CIR está en el
              infinito, mientras que su polo de aceleraciones está aquí al lado,
              a $2R$ de $A$.
    resolucion: |
      **1. Esquema de velocidades.** Es un problema de rodadura sobre un plano
      fijo, con una barra y una deslizadera: el dibujo lleva las velocidades de
      O, B y A y las perpendiculares a las de A y B, sin escala.

