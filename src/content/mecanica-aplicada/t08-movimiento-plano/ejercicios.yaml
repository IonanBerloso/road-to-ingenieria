      Sin escala. El CIR del disco está en A, 2R por encima de C. La velocidad de C es horizontal; la del punto de la barra que coincide con C, perpendicular a OC; la de D, perpendicular a la barra, que pasa por A. Ejes: x hacia la derecha, y hacia arriba; giros positivos en sentido antihorario.

      </figcaption>
      </figure>

      - **El disco** gira alrededor de A, su CIR, en sentido horario: C, 2R
        por debajo de A, va hacia la izquierda, y D, sobre la barra, en
        perpendicular a ella.
      - **La barra** gira alrededor de O en sentido antihorario: el punto de
        la barra que coincide con C va en perpendicular a OC.
      - **El contacto D.** La barra es tangente al disco en D, y C está
        siempre a R de ella: visto desde la barra, C corre paralelo a la
        barra.

      Con O en el origen, x hacia la derecha e y hacia arriba, y
      $\vec{u} = (\cos 60^\circ;\ \sin 60^\circ)$ el unitario de la barra:
      $A = 2\sqrt{3}R\,\vec{u} = (\sqrt{3}R;\ 3R)$, $D = \sqrt{3}R\,\vec{u}$,
      su punto medio, y $C = (\sqrt{3}R;\ R)$, a R del suelo y 2R por debajo
      de A, con $OC = 2R$. $\overrightarrow{CD} = (-\sqrt{3}R/2;\ R/2)$ mide
      R y es perpendicular a la barra: la barra es tangente al disco en D.
      Los giros, $\vec{\omega}_1 = \frac{v}{2R}\vec{k}$ y
      $\vec{\omega}_2 = -\frac{v}{2R}\vec{k}$.

      **2. Incógnitas.** $\vec{v}_{C/1}$, $\vec{v}_{D/1}$, $\alpha_1$,
      $\alpha_2$ y $\vec{a}_{D/1}$.

      **3. Ecuaciones.** Las velocidades, desde el CIR del disco, y respecto
      de la barra, restando la del punto de la barra que coincide:

      $$
      \vec{v}_P = \vec{\omega}_2\times\overrightarrow{AP},
      \qquad
      \vec{v}_{P/1} = \vec{v}_P - \vec{\omega}_1\times\overrightarrow{OP}
      $$

      C va en línea recta a velocidad constante: su aceleración es nula. Y
      respecto de la barra corre en línea recta, paralelo a ella, así que
      $\vec{a}_{C/1} = a_r\,\vec{u}$:

      $$
      \vec{0} = \alpha_1\vec{k}\times\overrightarrow{OC} - \omega_1^{2}\,\overrightarrow{OC}
      + a_r\,\vec{u} + 2\,\vec{\omega}_1\times\vec{v}_{C/1}
      $$

      En D, el disco rueda sobre la barra sin deslizar: en este instante lo
      dice $\vec{v}_{D/1} = \vec{0}$, y se supone que sigue así, que es lo
      que hace falta para la aceleración angular del disco. Visto desde la
      barra, el disco rueda sobre una recta con su centro a R:
      $\vec{v}_{C/1} = \omega_r R\,\vec{u}$ en todo instante, y derivando,
      $a_r = \alpha_r R$. La aceleración relativa de D, con el campo del
      disco visto desde la barra:

      $$
      \vec{a}_{D/1} = \vec{a}_{C/1} + \alpha_r\vec{k}\times\overrightarrow{CD} - \omega_r^{2}\,\overrightarrow{CD}
      $$

      **4. Resultados.** $\vec{v}_C = -\frac{v}{2R}\vec{k}\times(0;\ -2R) = (-v;\ 0)$,
      que es el dato, y
      $\vec{\omega}_1\times\overrightarrow{OC} = \frac{v}{2R}\vec{k}\times(\sqrt{3}R;\ R) = \left(-\frac{v}{2};\ \frac{\sqrt{3}}{2}v\right)$:

      $$
      \vec{v}_{C/1} = \left(-\frac{v}{2};\ -\frac{\sqrt{3}}{2}v\right) = -v\,\vec{u},
      \qquad
      \vec{v}_{D/1} = \vec{0}
      $$

      La segunda, porque $\vec{\omega}_2\times\overrightarrow{AD}$ y
      $\vec{\omega}_1\times\overrightarrow{OD}$ son iguales:
      $\overrightarrow{AD} = -\overrightarrow{OD}$ y
      $\omega_2 = -\omega_1$. Con ellas, $\omega_r = -v/R$.

      En aceleraciones, el Coriolis vale
      $2\,\vec{\omega}_1\times\vec{v}_{C/1} = -\frac{v^{2}}{R}\,\vec{n}$, con
      $\vec{n} = \vec{k}\times\vec{u} = (-\tfrac{\sqrt{3}}{2};\ \tfrac{1}{2})$,
      perpendicular a la barra. Proyectando sobre $\vec{n}$ y sobre
      $\vec{u}$, con $\overrightarrow{OC}\cdot\vec{u} = \sqrt{3}R$ y
      $\overrightarrow{OC}\cdot\vec{n} = -R$:

      $$
      \sqrt{3}R\,\alpha_1 + \frac{v^{2}}{4R} - \frac{v^{2}}{R} = 0,
      \qquad
      R\,\alpha_1 - \frac{\sqrt{3}\,v^{2}}{4R} + a_r = 0
      $$

      $$
      \vec{\alpha}_1 = \frac{\sqrt{3}}{4}\,\frac{v^{2}}{R^{2}}\,\vec{k},
      \qquad
      a_r = 0
      $$

      Con $a_r = 0$, $\alpha_r = 0$ y el disco tiene la misma aceleración
      angular que la barra. Y en D, con $\vec{a}_{C/1} = \vec{0}$:

      $$
      \vec{\alpha}_2 = \frac{\sqrt{3}}{4}\,\frac{v^{2}}{R^{2}}\,\vec{k},
      \qquad
      \vec{a}_{D/1} = -\frac{v^{2}}{R^{2}}\left(-\frac{\sqrt{3}}{2}R;\ \frac{R}{2}\right)
      = \frac{v^{2}}{2R}\left(\sqrt{3};\ -1\right)
      $$

      **C se mueve respecto de la barra a v, a lo largo de ella y hacia O, y
      D no se mueve respecto de ella; D tiene respecto de la barra una
      aceleración de módulo $v^{2}/R$, hacia C; y la barra y el disco tienen
      la misma aceleración angular, $\frac{\sqrt{3}}{4}\,v^{2}/R^{2}$,
      antihoraria.** Coinciden con los que publica la colección.

      **5. Comprobación.** Por la geometría, sin composición de movimientos.
      Con $\theta$ el ángulo de la barra y $x_C$ la abscisa de C, con
      $\dot{x}_C = -v$ y $\ddot{x}_C = 0$, la barra es tangente al disco
      mientras la distancia de C a ella valga R:

      $$
      x_C\sin\theta - R\cos\theta = R
      $$

      Derivando dos veces, en $\theta = 60^\circ$ y $x_C = \sqrt{3}R$:

      $$
      -\frac{\sqrt{3}}{2}\,v + \sqrt{3}R\,\dot{\theta} = 0
      \;\Longrightarrow\;
      \dot{\theta} = \frac{v}{2R}
      $$

      $$
      -\frac{v^{2}}{2R} - \frac{3v^{2}}{8R} + \frac{v^{2}}{8R} + \sqrt{3}R\,\ddot{\theta} = 0
      \;\Longrightarrow\;
      \ddot{\theta} = \frac{\sqrt{3}}{4}\,\frac{v^{2}}{R^{2}}
      $$

      El $\omega_1$ del enunciado y la misma $\alpha_1$. El disco: el contacto
      con la barra está a $s = x_C\cos\theta + R\sin\theta$ de O, y al rodar
      sin deslizar sobre ella, el disco gira respecto de la barra con
      $\omega_r = \dot{s}/R$. Derivando:

      $$
      \dot{s} = -\frac{v}{2} - \frac{3v}{4} + \frac{v}{4} = -v,
      \qquad
      \ddot{s} = \frac{\sqrt{3}\,v^{2}}{2R} - \frac{\sqrt{3}\,v^{2}}{4R} - R\,\ddot{\theta} = 0
      $$

      $\omega_r = -v/R$ y $\alpha_r = 0$: $\alpha_2 = \alpha_1$, lo mismo. Y
      la aceleración relativa de D, por la fórmula del punto de contacto de
      una rodadura, $\vec{a}_{D/1} = \vec{v}_s\times\vec{\omega}_r$, con
      $\vec{v}_s = \dot{s}\,\vec{u} = -v\,\vec{u}$ la velocidad con que el
      contacto recorre la barra:

      $$
      \vec{a}_{D/1} = (-v\,\vec{u})\times\left(-\frac{v}{R}\,\vec{k}\right)
      = \frac{v^{2}}{R}\left(\frac{\sqrt{3}}{2};\ -\frac{1}{2}\right)
      $$

      Lo mismo.

      **Lo que dice el resultado.** El disco desliza sobre el suelo, porque
      su CIR está en A y no en el contacto con el suelo, pero rueda sobre la
      barra: en D, $\vec{v}_{D/1} = \vec{0}$. Visto desde la barra, C corre a
      lo largo de ella a v sin acelerar, y por eso el disco no cambia su giro
      respecto de la barra: las dos aceleraciones angulares son iguales. La
      aceleración relativa de D no es nula aunque D no deslice: es la normal
      del giro relativo, $\omega_r^{2}R = v^{2}/R$, hacia C.

  - id: ejma8-col812-la-barra-por-dos-puntos-del-disco
    titulo: Una barra que pasa por dos puntos opuestos de un disco que rueda
    fuente: >-
      Ejercicio 8.12 · Tema 8, «Análisis del movimiento plano» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado y el
      profesor su resolución, contra los que está contrastado el desarrollo. El
      resultado es simbólico, así que las casillas piden el coeficiente que
      multiplica a la expresión indicada en cada pregunta.
    nivel: practica
    antes:
      idea: |
        La barra y el disco son dos sólidos. Un punto del disco, visto desde
        la barra, tiene el movimiento del punto de la barra con el que
        coincide, el arrastre, más el suyo respecto de la barra, el relativo;
        en las aceleraciones aparece además el término de Coriolis.
      formula: |
        La composición de movimientos, con A un punto de la barra y
        $\vec{\omega}_2$ y $\vec{\alpha}_2$ su giro y su aceleración angular:

        $$
        \vec{v}_P = \vec{v}_A + \vec{\omega}_2\times\overrightarrow{AP} + \vec{v}_{P/2}
        $$

        $$
        \vec{a}_P = \vec{a}_A + \vec{\alpha}_2\times\overrightarrow{AP} - \omega_2^{2}\,\overrightarrow{AP}
        + \vec{a}_{P/2} + 2\,\vec{\omega}_2\times\vec{v}_{P/2}
        $$
      reconocer: |
        Antes de calcular se mira qué condición impone cada apoyo y cada
        unión.
    enunciado: |
      Una barra $AB$ pasa permanentemente por 2 puntos $C$ y $D$,
      diametralmente opuestos de una circunferencia de radio $R$, y su extremo
      $A$ recorre una línea recta horizontal. El disco rueda sin deslizar sobre
      la recta con velocidad angular conocida saliente $\omega$ al plano y una
      aceleración angular con el mismo sentido $2\sqrt{3}\,\omega^{2}$. En el
      instante mostrado en la figura, calcular:

      a) Velocidad del punto $A$.

      b) Aceleración del punto $A$.

