    pide: El instante en que el émbolo alcanza su velocidad máxima y el valor de esa velocidad.
    pasos:
      - tipo: reconocer
        pregunta: |
          Con el origen de tiempos en $x = 0$, ¿cómo se mueve el émbolo?
        opciones:
          - texto: >-
              Con un movimiento armónico simple, x igual a b por el seno de
              omega t
            correcta: true
            mensaje: |
              Eso es. La ranura es vertical, así que la corredera copia
              exactamente la **abscisa** del pasador $A$:
              $x = b\operatorname{sen}(\omega t)$. Es el yugo escocés, y por eso
              el émbolo describe un armónico puro.
          - texto: Con velocidad uniforme, porque la pieza giratoria gira a velocidad constante
            mensaje: |
              El giro es uniforme, pero lo que el émbolo copia es la proyección
              del giro sobre el eje $X$, y una proyección de algo uniforme no es
              uniforme: va de $+\omega b$ a $-\omega b$.
          - texto: Con la misma velocidad que el punto A del extremo de la pieza giratoria
            mensaje: |
              $A$ lleva $\omega b$ siempre, pero perpendicular a la manivela. El
              émbolo solo recoge su componente horizontal; la vertical se la
              come el deslizamiento por la ranura.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el mecanismo en una posición
          cualquiera, con el ángulo $\theta = \omega t$ de la pieza giratoria
          desde la vertical de O, la velocidad de A y sus dos componentes: la
          de la corredera y la del pasador por la ranura**. Solo las
          direcciones, sin escala.
        comprueba:
          - punto: |
              **$\vec{v}_A$ perpendicular a OA; con A arriba y a la derecha de
              O, hacia abajo y a la derecha.**
            porque: |
              A es un punto de la pieza giratoria, que gira alrededor del punto
              fijo O en sentido horario.
          - punto: |
              **$\vec{v}_2$, la de la corredera, horizontal.**
            porque: |
              La corredera va unida al émbolo, que solo puede ir y venir dentro
              del cilindro: se traslada en horizontal, sin girar, y todos sus
              puntos llevan la misma velocidad.
          - punto: |
              **$\vec{v}_{rel}$, vertical, a lo largo de la ranura, y
              $\vec{v}_A$ como suma de $\vec{v}_2$ y $\vec{v}_{rel}$.**
            porque: |
              El pasador es a la vez un punto de la pieza giratoria y un punto
              que corre por la ranura: su velocidad es la del punto de la
              corredera con el que coincide más la de su deslizamiento, que
              solo puede ir a lo largo de la ranura.
        figura: |
