        <line x1="70" y1="132" x2="140" y2="62" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="86" y="76" font-size="9" fill="var(--faint)">√2 R</text>
        <line x1="125" y1="105" x2="195" y2="105" stroke="var(--faint)" stroke-width="0.8" stroke-dasharray="3 3"/>
        <text x="160" y="100" font-size="9" text-anchor="middle" fill="var(--faint)">R</text>
        <line x1="212" y1="105" x2="212" y2="175" stroke="var(--faint)" stroke-width="0.8"/>
