    pide: La velocidad angular de las dos barras y la velocidad del punto E.
    pasos:
      - tipo: reconocer
        pregunta: |
          La barra 1 tiene $A$ sobre una pared vertical y $B$ sobre el suelo.
          ¿Dónde está su centro instantáneo de rotación?
        opciones:
          - texto: Donde se cortan la horizontal por A y la vertical por B
            correcta: true
            mensaje: |
              Eso es. $v_A$ es vertical, así que su perpendicular es horizontal;
              $v_B$ es horizontal y su perpendicular, vertical. Se cortan en
              $(300;\ 400)$ mm, que forma con $A$ y $B$ el rectángulo de la
              escalera.
          - texto: En D, porque es el pasador que une las dos barras
            mensaje: |
              $D$ es un punto material que se mueve —de hecho su velocidad es
              225 mm/s—. El CIR es un punto de velocidad nula, y aquí cae fuera
              de la barra.
          - texto: En el punto donde la pared se junta con el suelo
            mensaje: |
              Ese es el vértice, y no tiene nada que ver: no es un punto de la
              barra ni el corte de las dos perpendiculares. Con él saldría una
              velocidad angular que no cumple ninguna de las dos condiciones.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **las dos barras con la dirección
          de las velocidades de A, B, D y E y el CIR de la barra 1**. Solo las
          direcciones, sin escala.
        comprueba:
          - punto: |
              **$\vec{v}_A$ vertical y $\vec{v}_B$ horizontal, hacia la
              izquierda; el CIR, I, donde se cortan la horizontal por A y la
              vertical por B.**
            porque: |
              A no puede separarse de la pared ni B del suelo. El CIR está en
              la perpendicular a cada velocidad conocida.
          - punto: |
              **La barra 1 gira en sentido horario, y A sube.**
            porque: |
              B está debajo de I y va hacia la izquierda: alrededor de I, eso
              es un giro horario. Con ese giro, A, a la izquierda de I, sube.
          - punto: |
              **$\vec{v}_D$ perpendicular a ID, hacia arriba y a la izquierda; y
              $\vec{v}_E$, horizontal, a lo largo de la guía.**
            porque: |
              D es un punto de la barra 1 y gira alrededor de I con ella. E no
              puede salirse de su guía: se dibuja hacia la izquierda y el
              cálculo dirá su sentido.
