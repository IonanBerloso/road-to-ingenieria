      - tipo: calcular
        titulo: La velocidad angular de la chapa
        pregunta: |
          Escribiendo $\omega_3 = k\,\omega$, ¿cuánto vale $k$ en valor
          absoluto?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.01
          formato: un número, el coeficiente que multiplica a omega
        distractores:
          - valor: '1'
            mensaje: |
              Esa es la del disco 1. La chapa gira alrededor de $O$, que está a
              $\sqrt{5}\,R$ de $C$, mientras que el disco gira alrededor de $G$,
              a $\sqrt{2}\,R$ de $C$: las dos velocidades angulares no tienen por
              qué coincidir.
          - valor: '2'
            mensaje: |
              Esa es la del disco 2, que sale al final. La de la chapa se obtiene
              del contacto en $C$, igualando la componente **vertical** de las
              dos velocidades.
        pista: |
          $\vec{v}_C$ del disco 1 vale $\omega\,|GC| = \sqrt{2}\,\omega R$. Iguala
          su componente vertical con la del punto $C$ de la chapa, que gira
          alrededor de $O$ con $\overrightarrow{OC} = (-2R;\ -R)$.
        desarrollo: |
          Con $G = (0;\ -R)$, $C = (R;\ 0)$ y $O = (3R;\ R)$:

          $$
          \vec{v}_{C,1} = \omega\,\vec{k}\times(R;\ R) = \omega(-R;\ R)
          \qquad
          \vec{v}_{C \in 3} = \omega_3\,\vec{k}\times(-2R;\ -R) = \omega_3(R;\ -2R)
          $$

          Igualando la componente vertical, $\omega R = -2R\omega_3$, o sea
          $\omega_3 = -\omega/2$.

      - tipo: calcular
        titulo: La velocidad angular del disco 2
        pregunta: |
          Escribiendo $\vec{\omega}_2 = k\,\omega\,\vec{k}$, ¿cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número, el coeficiente que multiplica a omega
        distractores:
          - valor: '1'
            mensaje: |
              Los dos discos son iguales, pero no giran igual: el disco 1 pivota
              sobre un punto de su **periferia** y el 2 sobre un punto interior,
              a $R/2$ de su centro. Esa diferencia geométrica cambia la relación.
          - valor: '0.5'
            mensaje: |
              Esa es la de la chapa. La del disco 2 sale de igualar la componente
              vertical en el contacto $D$, donde el brazo que cuenta es la
              componente horizontal de $\overrightarrow{HD}$, que vale $R/2$.
        pista: |
          En $D$, la componente vertical de
          $\vec{\omega}_2 \times \overrightarrow{HD}$ tiene que igualar la del
          punto $D$ de la chapa, que ya conoces.
        desarrollo: |
          Con $H = (5{,}5R;\ -R)$ y $D = (5R;\ 0)$,
          $\overrightarrow{HD} = (-0{,}5R;\ R)$:

          $$
          \vec{v}_{D \in 3} = \omega_3\,\vec{k}\times(2R;\ -R) = (-0{,}5\omega R;\ -\omega R)
          $$

          $$
          -0{,}5R\,\omega_2 = -\omega R \;\Longrightarrow\; \omega_2 = 2\omega
          $$

      - tipo: calcular
        titulo: La velocidad de deslizamiento en D
        pregunta: |
          Escribiendo $|\vec{v}_d| = k\,\omega R$, ¿cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '1.5'
          tolerancia: 0.01
          formato: un número, el coeficiente que multiplica a omega por R
        distractores:
          - valor: '0.5'
            mensaje: |
              Ese es el deslizamiento en el **otro** contacto, el de $C$. En $D$
              la diferencia tangencial es tres veces mayor.
          - valor: '0'
            mensaje: |
              Sería cero si hubiera rodadura, pero el propio enunciado pregunta
              por la velocidad de deslizamiento: aquí los dos sólidos resbalan
              uno sobre otro.
        pista: |
          $\vec{v}_d = \vec{v}_{D,2} - \vec{v}_{D \in 3}$, y las componentes
          verticales ya se han igualado, así que solo queda la horizontal.
        desarrollo: |
          $$
          \vec{v}_{D,2} = 2\omega\,\vec{k}\times(-0{,}5R;\ R) = (-2\omega R;\ -\omega R)
          $$

          $$
          \vec{v}_d = (-2\omega R;\ -\omega R) - (-0{,}5\omega R;\ -\omega R)
          = -1{,}5\,\omega R\,\vec{\imath}
          $$

      - tipo: calcular
        titulo: La aceleración angular del disco 2
        pregunta: |
          Escribiendo $\vec{\alpha}_2 = k\,\omega^{2}\vec{k}$, ¿cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número, el coeficiente que multiplica a omega cuadrado
        distractores:
          - valor: '0'
            mensaje: |
              $\omega$ es constante para el disco **1**. La relación entre los
              tres sólidos depende de la posición, que está cambiando, así que
              ni la chapa ni el disco 2 giran uniformemente.
          - valor: '0.25'
            mensaje: |
              Ese es el valor de $\alpha_3$, la de la chapa, que sale por el
              camino. La del disco 2 se obtiene después, con el contacto en $F$.
        pista: |
          Los centros $E$ y $F$ guardan distancia constante $R$ a la recta $AB$
          de la chapa, así que sus aceleraciones **relativas** a la chapa son
          paralelas a esa recta. Con eso sale primero $\alpha_3$ y luego
          $\alpha_2$.
        desarrollo: |
          Del contacto del disco 1, escribiendo el campo de $E$ visto desde la
          chapa —con su término de Coriolis—, la componente vertical da
          $\alpha_3 = -\omega^{2}/4$. Repitiendo con $F$ y el disco 2,

          $$
          \alpha_2 = 2\,\omega^{2}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              En $C$ las componentes verticales de las velocidades del disco 1 y
              de la chapa coinciden, y de ahí $\omega_3 = \omega/2$.
          - texto: >-
              Repitiendo en $D$ con el disco 2, que pivota en $H$ a $R/2$ de su
              centro, sale $\omega_2 = 2\omega$ y un deslizamiento de
              $1{,}5\,\omega R$.
          - texto: >-
              Los centros $E$ y $F$ se mueven respecto de la chapa por una
              paralela a $AB$, y con esa condición y el Coriolis salen
              $\alpha_3 = \omega^{2}/4$ y $\alpha_2 = 2\omega^{2}$.
          - texto: >-
              Como los dos discos giran alrededor de puntos fijos, sus centros
              $E$ y $F$ están quietos.
            trampa: true
            mensaje: |
              Los puntos fijos son $G$ y $H$, no $E$ y $F$. $G$ está en la
              periferia del disco 1 y $H$ a $R/2$ del centro del 2, así que los
              dos centros describen circunferencias: $v_E = \omega R$ y
              $v_F = \omega_2 R/2 = \omega R$.
    resolucion: |
      **1. Esquema de velocidades.** Es un problema de contactos con
      deslizamiento: el dibujo lleva, en C y en D, las velocidades de los dos
      puntos que se tocan, sin escala.

