    pide: La velocidad de D, las velocidades angulares del disco y de la barra, la velocidad de C y la aceleración angular del disco.
    pasos:
      - tipo: reconocer
        pregunta: |
          La rueda dentada 3 rueda sobre una cremallera **fija**. ¿Cuál es su
          centro instantáneo de rotación, y qué velocidad tiene $D$?
        opciones:
          - texto: >-
              El punto de contacto con la cremallera; D está diametralmente
              enfrente, así que va al doble que el centro
            correcta: true
            mensaje: |
              Eso es. Con el contacto como CIR, la velocidad crece con la
              distancia a él: el centro está a $R_3$ y $D$ a $2R_3$, así que
              $v_D = 2v_B = 0{,}4$ m/s.
          - texto: Su centro B, porque es el punto que se traslada
            mensaje: |
              $B$ se mueve a 0,2 m/s: no puede ser el CIR, que es un punto de
              velocidad nula. El que está quieto en este instante es el diente
              apoyado en la cremallera.
          - texto: El punto D, porque es donde se articula la barra
            mensaje: |
              $D$ es justo el punto **más rápido** de la rueda: está a $2R_3$
              del contacto. Una articulación no obliga a que el punto esté
              quieto.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el mecanismo con la dirección
          de las velocidades de B, D y C, el CIR de cada sólido y su sentido
          de giro**. Solo las direcciones, sin escala.
        comprueba:
          - punto: |
              **El CIR de la rueda, $I_3$, en el contacto con la cremallera;
              $\vec{v}_D$ hacia abajo, el doble de larga que $\vec{v}_B$; la
              rueda gira en sentido antihorario.**
            porque: |
              La cremallera está fija y la rueda no desliza sobre ella. B, a la
              izquierda de $I_3$, baja: alrededor de $I_3$, eso es un giro
              antihorario. D está en la misma recta, al doble de distancia.
          - punto: |
              **$\vec{v}_C$ paralela al plano, y el CIR del disco, $I_1$, en su
              contacto con el plano.**
            porque: |
              El disco rueda sin deslizar sobre el plano fijo, y su centro se
              mantiene siempre a la misma distancia de él.
          - punto: |
              **El CIR de la barra, $I_2$, donde se cortan la recta $I_1C$ y la
              horizontal por D; la barra gira en sentido horario, C sube por
              el plano y el disco gira en sentido antihorario.**
            porque: |
              $I_2$ está en la perpendicular a cada velocidad: la de C es
              paralela al plano, y su perpendicular por C pasa por $I_1$; la
              de D es vertical. D, a la derecha de $I_2$, baja: alrededor de
              $I_2$ eso es un giro horario, que lleva a C, debajo de $I_2$ y a
              su izquierda, hacia arriba y a la izquierda. Y C, subiendo con
              $I_1$ debajo, hace girar el disco en sentido antihorario.
