        <text x="82" y="58" font-size="10" text-anchor="end" fill="var(--ink)">A</text>
        <text x="158" y="70" font-size="9.5" fill="var(--ink)">1</text>
        <text x="200" y="118" font-size="9.5" fill="var(--ink)">2</text>
        <text x="240" y="140" font-size="9.5" fill="var(--ink)">3</text>
        <line x1="131" y1="30" x2="131" y2="97" stroke="var(--faint)" stroke-width="0.8"/>
