    pide: La velocidad angular y la aceleración angular de la varilla articulada en A.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué tipo de unión hay en $D$ entre las dos varillas, y qué obliga a
          añadir en las ecuaciones?
        opciones:
          - texto: >-
              Una deslizadera: hay velocidad relativa a lo largo de la varilla 2,
              y en aceleraciones aparece el término de Coriolis
            correcta: true
            mensaje: |
              Eso es. $D$ es un punto de la varilla 1, pero se desliza sobre la
              2, así que
              $\vec{v}_D = \vec{v}_{D \in 2} + \vec{v}_{\text{rel}}$ y, al
              derivar, sale además
              $2\,\vec{\omega}_2 \times \vec{v}_{\text{rel}}$.
          - texto: 'Una articulación: los dos sólidos comparten en D velocidad y aceleración'
            mensaje: |
              Si fuera una articulación, $D$ sería un punto fijo de las dos
              varillas y la distancia $AD$ no podría cambiar. Pero cambia: la
              varilla 1 gira y arrastra a $D$ a lo largo de la 2.
          - texto: Una rodadura, con velocidad de deslizamiento nula
            mensaje: |
              En una rodadura los puntos de contacto tienen la misma velocidad,
              y aquí no la tienen: precisamente $v_{D/2} = 1{,}2$ m/s es la
              velocidad con la que $D$ recorre la varilla 2.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **las dos varillas con la
          velocidad de D y sus dos componentes, a lo largo de la varilla 2 y
          perpendicular a ella**. Solo las direcciones.
        comprueba:
          - punto: |
              **$\vec{v}_D$ horizontal, hacia la derecha.**
            porque: |
              D es el extremo de la varilla 1, que gira alrededor de B en
              sentido antihorario: D, debajo de B, se mueve en perpendicular a
              BD, y en la parte de abajo el giro antihorario lleva hacia la
              derecha.
          - punto: |
              **Una componente a lo largo de AD, alejándose de A, y otra
              perpendicular a AD, hacia arriba y a la derecha.**
            porque: |
              Vista desde la varilla 2, D se mueve con el punto de la varilla 2
              que coincide con él, en perpendicular a AD, y además corre por
              ella. La velocidad horizontal hacia la derecha tiene parte en
              las dos direcciones, y con esos sentidos.
          - punto: |
              **La varilla 2 gira en sentido antihorario.**
            porque: |
              El punto de la varilla 2 que coincide con D va hacia arriba y a
              la derecha, en perpendicular a AD: alrededor de A, eso es un giro
              antihorario.
        figura: |
          <svg viewBox="10 18 306 179" role="img" width="306" height="179" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">Esquema de velocidades de las dos varillas unidas por la deslizadera D</title>
            <desc id="dsl-d">Dos puntos fijos en el techo, A a la izquierda y B a la derecha. De B cuelga la varilla 1, vertical, hasta D, con su giro antihorario. De A baja la varilla 2 a 30 grados hacia la derecha y pasa por D, donde hay una deslizadera que corre por ella. En D, su velocidad, horizontal hacia la derecha, y sus dos componentes: a lo largo de la varilla 2, alejándose de A, la velocidad relativa; y perpendicular a la varilla 2, hacia arriba y a la derecha, la del punto de la varilla 2 que coincide con D. A trazos, el paralelogramo que forman. Alrededor de A, el giro de la varilla 2, antihorario.</desc>
