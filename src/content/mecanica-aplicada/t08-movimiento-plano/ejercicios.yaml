ejercicios:
  - id: ejma8-la-biela-a-cuarenta-y-cinco-grados
    titulo: La velocidad de la deslizadera de una biela-manivela
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      En un mecanismo biela-manivela, la manivela $OA$ mide 0,1 m y gira
      alrededor de $O$ a 10 rad/s en sentido antihorario. La biela $AB$ mide
      0,3 m, y su extremo $B$ desliza por una guía horizontal que pasa por $O$.
      En el instante en que la manivela forma 45° con la horizontal, calcular la
      velocidad angular de la biela y la velocidad de $B$.
    pide: La velocidad angular de la biela y la velocidad de la deslizadera.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Dónde está el centro instantáneo de rotación de la biela?
        opciones:
          - texto: Donde se cortan la prolongación de OA y la vertical por B
            correcta: true
            mensaje: |
              Eso es. La velocidad de $A$ es perpendicular a $OA$, así que la
              perpendicular a ella es la propia recta $OA$; la de $B$ es
              horizontal, y su perpendicular, la vertical por $B$.
          - texto: En O, porque es el punto fijo del mecanismo
            mensaje: |
              $O$ es el CIR de la **manivela**, que gira alrededor de él. La
              biela es otro sólido, con otro movimiento, y su CIR es otro punto.
          - texto: En B, porque la deslizadera va más despacio
            mensaje: |
              $B$ se mueve: tiene velocidad horizontal. El CIR es un punto de
              velocidad nula, y no está en la biela sino fuera de ella.

      - tipo: calcular
        titulo: La velocidad angular de la biela
        pregunta: |
          El CIR queda en $I = (0{,}362;\ 0{,}362)$ m, a 0,412 m de $A$. ¿Cuánto
          vale la velocidad angular de la biela, en rad/s?
        respuesta:
          tipo: numero
          valor: '2.425'
          tolerancia: 0.02
          formato: un número, en rad/s
        distractores:
          - valor: '3.333'
            mensaje: |
              Has dividido la velocidad de $A$ entre la longitud de la biela,
              0,3 m. La biela gira alrededor de su CIR, no de su otro extremo:
              la distancia que manda es la de $A$ al CIR, 0,412 m.
          - valor: '10'
            mensaje: |
              Esa es la de la manivela. Cada sólido del mecanismo tiene su
              propia velocidad angular.
        pista: |
          $v_A = \omega_{OA} \cdot OA = 1\ \text{m/s}$, y $\omega_{AB} = v_A / IA$.
        desarrollo: |
          $B$ está en $x_B = 0{,}0707 + \sqrt{0{,}3^{2} - 0{,}0707^{2}} = 0{,}362$ m,
          y el CIR, en la recta $y = x$ sobre la vertical de $B$.

          $$
          IA = \sqrt{2}\,(0{,}362 - 0{,}0707) = 0{,}412\ \text{m}
          \qquad
          \omega_{AB} = \frac{1}{0{,}412} = 2{,}425\ \text{rad/s}
          $$

          En sentido horario.

      - tipo: calcular
        titulo: La velocidad de B
        pregunta: |
          ¿A qué velocidad va la deslizadera, en m/s?
        respuesta:
          tipo: numero
          valor: '0.879'
          tolerancia: 0.01
          formato: un número, en m/s
        distractores:
          - valor: '1'
            mensaje: |
              Has supuesto que $B$ va a la misma velocidad que $A$, como si la
              biela se trasladara. Solo pasa cuando las dos velocidades son
              paralelas, con la manivela vertical; a 45°, la biela gira.
          - valor: '1.2'
            mensaje: |
              Has multiplicado la velocidad angular de la biela por su
              longitud. $B$ está a 0,362 m del CIR, no a 0,3.
        pista: |
          $v_B = \omega_{AB} \cdot IB$, con $IB = 0{,}362$ m.
        desarrollo: |
          $$
          v_B = \omega_{AB} \cdot IB = 2{,}425 \cdot 0{,}362 = 0{,}879\ \text{m/s}
          $$

          Hacia la izquierda.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: $v_A = 10 \cdot 0{,}1 = 1$ m/s, perpendicular a la manivela; $v_B$ es horizontal.
          - texto: El CIR de la biela está donde se cortan la recta $OA$ y la vertical por $B$, a 0,412 m de $A$ y 0,362 m de $B$.
          - texto: $\omega_{AB} = 1/0{,}412 = 2{,}43$ rad/s y $v_B = 2{,}43 \cdot 0{,}362 = 0{,}879$ m/s.
          - texto: La biela gira alrededor de O, igual que la manivela, a 10 rad/s.
            trampa: true
            mensaje: |
              $O$ es el CIR de la manivela. La biela tiene su propio CIR y su
              propia velocidad angular, que aquí es 2,43 rad/s.
    resolucion: |
      **Las posiciones.** Con la manivela a 45°, $A = (0{,}0707;\ 0{,}0707)$ m.
      $B$ está en la guía, a 0,3 m de $A$:
      $x_B = 0{,}0707 + \sqrt{0{,}09 - 0{,}005} = 0{,}362$ m.

      **El CIR de la biela.** La velocidad de $A$ es perpendicular a $OA$, y la de
      $B$, horizontal. Sus perpendiculares son la recta $OA$, $y = x$, y la
      vertical $x = 0{,}362$: se cortan en $I = (0{,}362;\ 0{,}362)$.

      **Las velocidades.** $IA = 0{,}412$ m e $IB = 0{,}362$ m:

      $$
      \omega_{AB} = \frac{v_A}{IA} = \frac{1}{0{,}412} = 2{,}425\ \text{rad/s}
      \qquad
      v_B = \omega_{AB} \cdot IB = 0{,}879\ \text{m/s}
      $$

      Con el campo de velocidades sale lo mismo: imponiendo que $v_B$ no tenga
      componente vertical, $\omega_{AB} = -2{,}425$ rad/s —horaria— y
      $v_B = -0{,}879$ m/s, hacia la izquierda.

  - id: ejma8-la-aceleracion-del-punto-de-contacto
    titulo: El punto de contacto de un disco que rueda, quieto pero acelerado
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Un disco de radio $R = 0{,}3\ \text{m}$ rueda sin deslizar sobre un suelo
      horizontal con velocidad angular constante $\omega = 10\ \text{rad/s}$.
      Calcular la aceleración de su centro y la del punto del disco que en ese
      instante toca el suelo.
    pide: La aceleración del centro y la del punto de contacto.
    pasos:
      - tipo: reconocer
        pregunta: |
          El punto de contacto tiene velocidad nula en ese instante. ¿Y su
          aceleración?
        opciones:
          - texto: No es nula, apunta hacia el centro del disco
            correcta: true
            mensaje: |
              Eso es. Un instante después el punto se levanta del suelo: su
              velocidad cambia, y lo hace hacia arriba. Es la aceleración del
              CIR, $\vec{v}_s \times \vec{\omega}$.
          - texto: Es nula, porque el punto está quieto
            mensaje: |
              Está quieto **solo en ese instante**. Una velocidad que vale cero
              en un instante y no en el siguiente tiene aceleración.
          - texto: Es horizontal, en el sentido del avance
            mensaje: |
              El centro va a velocidad constante, así que no hay nada que
              acelere en horizontal. Lo que queda es la centrípeta de un punto
              que gira alrededor del centro, y apunta hacia él.

      - tipo: calcular
        titulo: La aceleración del centro
        pregunta: |
          ¿Cuánto vale la aceleración del centro, en m/s²?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.01
          formato: un número, en m/s²
        distractores:
          - valor: '30'
            mensaje: |
              Esa es la centrípeta de un punto de la periferia. El centro va en
              línea recta a $\omega R = 3\ \text{m/s}$ constante: su aceleración
              es nula.
        pista: |
          El centro avanza en línea recta a $\omega R$, y $\omega$ es constante.
        desarrollo: |
          $v_O = \omega R = 3\ \text{m/s}$, constante y en línea recta, así que
          $a_O = 0$.

      - tipo: calcular
        titulo: La aceleración del punto de contacto
        pregunta: |
          ¿Cuánto vale la aceleración del punto de contacto, en m/s²?
        respuesta:
          tipo: numero
          valor: '30'
          tolerancia: 0.1
          formato: un número, en m/s²
        distractores:
          - valor: '0'
            mensaje: |
              Es el error de tomar el CIR por un punto fijo. Su velocidad es
              cero en ese instante, pero su aceleración, no.
          - valor: '3'
            mensaje: |
              Has calculado $\omega R$, que es una velocidad. La aceleración
              centrípeta es $\omega^{2} R$.
        pista: |
          $\vec{a}_P = \vec{a}_O + \vec{\alpha} \times \overrightarrow{OP} - \omega^{2}\,\overrightarrow{OP}$,
          con $a_O = 0$ y $\alpha = 0$.
        desarrollo: |
          $$
          a_I = \omega^{2} R = 100 \cdot 0{,}3 = 30\ \text{m/s}^{2}
          $$

          Vertical, hacia arriba, hacia el centro del disco.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: El centro va en línea recta a velocidad constante, así que $a_O = 0$.
          - texto: 'Con $\alpha = 0$, cada punto tiene solo la aceleración normal respecto del centro: $\omega^{2}$ por su distancia, hacia él.'
          - texto: El punto de contacto está a $R$ del centro, así que acelera $\omega^{2}R = 30$ m/s² hacia arriba.
          - texto: El punto de contacto es el CIR, así que su aceleración es nula.
            trampa: true
            mensaje: |
              El CIR tiene velocidad nula, no aceleración nula. Su aceleración es
              $\vec{v}_s \times \vec{\omega}$, que aquí vale $\omega^{2} R$.
    resolucion: |
      **El centro.** Avanza en línea recta a $v_O = \omega R = 3\ \text{m/s}$, y
      como $\omega$ es constante, esa velocidad no cambia: $a_O = 0$.

      **Cualquier punto.** Con $a_O = 0$ y $\alpha = 0$, el campo de
      aceleraciones deja solo la normal respecto del centro:

      $$
      \vec{a}_P = -\omega^{2}\,\overrightarrow{OP}
      $$

      Todos los puntos de la periferia aceleran $\omega^{2} R = 30\ \text{m/s}^{2}$
      hacia el centro, incluido el que toca el suelo, que tiene velocidad nula.
      Por eso el CIR sirve para las velocidades y no para las aceleraciones: aquí
      el punto de aceleración nula, el polo de aceleraciones, es el centro, no el
      punto de contacto.

  - id: ejma8-col81-el-disco-y-las-dos-barras
    titulo: Las dos barras que cuelgan de un disco que gira
    fuente: >-
      Ejercicio 8.1 · Tema 8, «Análisis del movimiento plano» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado y el
      profesor su resolución, contra los que está contrastado el desarrollo. El
      resultado es simbólico, así que las casillas piden el coeficiente que
      multiplica a la expresión indicada en cada pregunta.
    nivel: practica
    enunciado: |
      En el mecanismo de la figura, el disco gira con una velocidad angular
      $\omega_0$ constante. Calcular:

      a) Velocidad angular de barras (1) y (2).

      b) Aceleración angular de barras (1) y (2).

      c) Aceleración de los centros de gravedad de barras (1) y (2).

      <figure>
      <svg viewBox="0 0 330 215" role="img" width="330" height="215" aria-labelledby="ejma8-col81-t ejma8-col81-d">
        <title id="ejma8-col81-t">Disco que gira alrededor de O, con la barra AB colgando de su borde y la barra BC articulada en el punto fijo C</title>
        <desc id="ejma8-col81-d">Un disco de radio R gira con velocidad angular omega cero constante alrededor de su centro fijo O. En el punto A de su periferia, situado a la derecha de O y a su misma altura, se articula la barra 1, AB, vertical y de longitud R. En su extremo inferior B se articula la barra 2, BC, horizontal y de longitud dos R, cuyo otro extremo C es un punto fijo. G1 y G2 son los centros de gravedad de las dos barras, cada uno en el punto medio de la suya. La figura está dibujada a escala.</desc>
        <defs>
          <marker id="ejma8-col81-fl" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
        </defs>
        <circle cx="75" cy="95" r="60" fill="var(--faint)" fill-opacity="0.12" stroke="var(--ink)" stroke-width="1.3"/>
        <path d="M38 62 A 47 47 0 0 1 104 56" fill="none" stroke="var(--flag)" stroke-width="1.6" marker-end="url(#ejma8-col81-fl)"/>
        <text x="52" y="44" font-size="10" fill="var(--flag)">ω0 cte</text>
        <line x1="75" y1="95" x2="135" y2="95" stroke="var(--faint)" stroke-width="1" stroke-dasharray="4 3"/>
        <line x1="135" y1="95" x2="135" y2="155" stroke="var(--ink)" stroke-width="3.2"/>
        <line x1="135" y1="155" x2="255" y2="155" stroke="var(--ink)" stroke-width="3.2"/>
        <circle cx="75" cy="95" r="3.4" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
        <path d="M75 95 L67 106 L83 106 z" fill="none" stroke="var(--ink)" stroke-width="1.1"/>
        <path d="M66 110 L60 117 M74 110 L68 117 M82 110 L76 117" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <circle cx="135" cy="95" r="3.2" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
        <circle cx="135" cy="155" r="3.2" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
        <circle cx="255" cy="155" r="3.4" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
        <path d="M255 155 L247 166 L263 166 z" fill="none" stroke="var(--ink)" stroke-width="1.1"/>
        <path d="M246 170 L240 177 M254 170 L248 177 M262 170 L256 177" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <circle cx="135" cy="125" r="2.6" fill="var(--d1)"/>
        <circle cx="195" cy="155" r="2.6" fill="var(--d1)"/>
        <text x="68" y="90" font-size="10" text-anchor="end" fill="var(--ink)">O</text>
        <text x="141" y="90" font-size="10" fill="var(--ink)">A</text>
        <text x="127" y="170" font-size="10" text-anchor="end" fill="var(--ink)">B</text>
        <text x="263" y="150" font-size="10" fill="var(--ink)">C</text>
        <text x="144" y="123" font-size="9.5" fill="var(--d1)">G1</text>
        <text x="190" y="147" font-size="9.5" fill="var(--d1)">G2</text>
        <text x="149" y="128" font-size="9.5" fill="var(--ink)">1</text>
        <text x="212" y="170" font-size="9.5" fill="var(--ink)">2</text>
        <text x="99" y="88" font-size="9" text-anchor="middle" fill="var(--faint)">R</text>
        <line x1="152" y1="95" x2="152" y2="155" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="158" y="128" font-size="9" fill="var(--faint)">R</text>
        <line x1="135" y1="188" x2="255" y2="188" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="195" y="200" font-size="9" text-anchor="middle" fill="var(--faint)">2R</text>
      </svg>
      </figure>
    pide: Las dos velocidades angulares, las dos aceleraciones angulares y las aceleraciones de G1 y G2, en función de omega cero y R.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de calcular nada, mira las direcciones. ¿Qué le pasa a la barra
          (1), $AB$, en este instante?
        opciones:
          - texto: Se traslada, porque las velocidades de A y de B son verticales y AB también lo es
            correcta: true
            mensaje: |
              Eso es. $A$ está en el disco y $OA$ es horizontal, así que $v_A$
              es vertical; $B$ gira alrededor de $C$ y $CB$ es horizontal, así
              que $v_B$ también. Dos velocidades paralelas a la propia barra
              solo son compatibles con $\omega_1 = 0$.
          - texto: Gira alrededor de B, que es donde se une a la barra 2
            mensaje: |
              $B$ se mueve: pertenece a la barra 2, que gira alrededor de $C$.
              Un punto que se mueve no puede ser centro de giro, y el CIR de la
              barra 1 no está en la barra.
          - texto: Gira con la misma velocidad angular que el disco, porque A pertenece a los dos
            mensaje: |
              $A$ es de los dos sólidos y por eso su **velocidad** es la misma
              vista desde cualquiera de ellos, pero la velocidad angular es de
              cada sólido. Es el error de dar a la biela la $\omega$ de la
              manivela.

      - tipo: calcular
        titulo: La velocidad angular de la barra 2
        pregunta: |
          Escribiendo $\vec{\omega}_2 = k\,\omega_0\vec{k}$, ¿cuánto vale el
          coeficiente $k$, en valor absoluto?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.01
          formato: un número, el coeficiente que multiplica a omega cero
        distractores:
          - valor: '1'
            mensaje: |
              Has supuesto que todo el mecanismo gira a la velocidad del disco.
              La barra 2 gira alrededor de $C$, y $B$ está a $2R$ de $C$
              mientras que $A$ está a $R$ de $O$: la misma velocidad repartida
              sobre el doble de brazo da la mitad de $\omega$.
          - valor: '0.3333'
            mensaje: |
              Parece que has dividido entre $3R$, la distancia de $C$ hasta
              $A$. El punto de la barra 2 cuya velocidad conoces es $B$, y está
              a $2R$ de $C$.
        pista: |
          $v_A = \omega_0 R$, y como la barra 1 se traslada, $v_B = v_A$. La
          barra 2 gira alrededor del punto fijo $C$, con $CB = 2R$.
        desarrollo: |
          $$
          v_B = v_A = \omega_0 R
          \qquad
          \omega_2 = \frac{v_B}{CB} = \frac{\omega_0 R}{2R} = \frac{\omega_0}{2}
          $$

          En sentido contrario al del disco: si $\omega_0$ es antihoraria,
          $\vec{\omega}_2 = -\tfrac{1}{2}\omega_0\vec{k}$.

      - tipo: calcular
        titulo: La aceleración angular de la barra 1
        pregunta: |
          Escribiendo $\vec{\alpha}_1 = k\,\omega_0^{2}\vec{k}$, ¿cuánto vale
          $k$?
        respuesta:
          tipo: numero
          valor: '1.5'
          tolerancia: 0.02
          formato: un número, el coeficiente que multiplica a omega cero al cuadrado
        distractores:
          - valor: '1'
            mensaje: |
              Te has dejado la aceleración normal de la barra 2. $B$ gira
              alrededor de $C$, así que además de la tangencial tiene
              $\omega_2^{2}\,CB = 0{,}5\,\omega_0^{2}R$ apuntando hacia $C$.
          - valor: '3'
            mensaje: |
              Has usado $\omega_2 = \omega_0$ en el término normal. La barra 2
              gira a la mitad, y en el término normal esa mitad va al cuadrado.
        pista: |
          Proyecta $\vec{a}_B = \vec{a}_A + \vec{\alpha}_1 \times \overrightarrow{AB}$
          sobre la horizontal, sabiendo que $a_A = \omega_0^{2}R$ hacia $O$ y que
          $\vec{a}_B$ solo tiene la normal hacia $C$ más la tangencial vertical.
        desarrollo: |
          Con $\omega_1 = 0$, la horizontal de $\vec{a}_B$ vista desde la barra
          1 es $-\omega_0^{2}R + \alpha_1 R$, y vista desde la barra 2 es la
          normal hacia $C$, que vale $\omega_2^{2}\,2R$:

          $$
          -\omega_0^{2}R + \alpha_1 R = \frac{\omega_0^{2}}{4}\,2R
          \;\Longrightarrow\;
          \alpha_1 = \frac{3}{2}\,\omega_0^{2}
          $$

          Y la vertical da $\alpha_2 = 0$.

      - tipo: calcular
        titulo: La aceleración del centro de gravedad de la barra 1
        pregunta: |
          Escribiendo $a_{G1} = k\,\omega_0^{2}R$, ¿cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '0.25'
          tolerancia: 0.005
          formato: un número, el coeficiente que multiplica a omega cero al cuadrado por R
        distractores:
          - valor: '1'
            mensaje: |
              Ese es el módulo de $\vec{a}_A$. $G_1$ no es $A$: está $R/2$ más
              abajo, y el giro de la barra 1 le añade $\alpha_1 R/2$ en
              horizontal.
          - valor: '0.5'
            mensaje: |
              Has usado la longitud entera de la barra, $R$, en vez de la
              distancia de $A$ a su punto medio, que es $R/2$.
        pista: |
          $\vec{a}_{G1} = \vec{a}_A + \vec{\alpha}_1 \times \overrightarrow{AG_1}$,
          con $AG_1 = R/2$ y $\omega_1 = 0$.
        desarrollo: |
          $$
          a_{G1} = -\omega_0^{2}R + \frac{3}{2}\,\omega_0^{2}\cdot\frac{R}{2}
          = -\frac{1}{4}\,\omega_0^{2}R
          $$

          Y por el otro lado, con $\alpha_2 = 0$, el punto medio de la barra 2
          solo tiene normal hacia $C$:
          $a_{G2} = \omega_2^{2}\,R = \tfrac{1}{4}\omega_0^{2}R$. Los dos módulos
          coinciden.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $v_A$ es vertical porque $OA$ es horizontal, y $v_B$ también
              porque $CB$ lo es; con $AB$ vertical, la barra 1 se traslada y
              $\omega_1 = 0$.
          - texto: >-
              De $v_B = \omega_0 R$ y $CB = 2R$ sale
              $\omega_2 = \omega_0/2$, en sentido contrario al del disco.
          - texto: >-
              Proyectando el campo de aceleraciones sobre la horizontal,
              $\alpha_1 = \tfrac{3}{2}\omega_0^{2}$; sobre la vertical,
              $\alpha_2 = 0$.
          - texto: >-
              La barra 1 no gira, así que su aceleración angular también es
              nula.
            trampa: true
            mensaje: |
              $\omega_1 = 0$ **en este instante**, y eso no dice nada de
              $\alpha_1$. Un instante después las dos velocidades dejan de ser
              paralelas y la barra empieza a girar: de hecho
              $\alpha_1 = 1{,}5\,\omega_0^{2}$, la mayor de las dos.
    resolucion: |
      **Las direcciones, antes que los números.** $A$ pertenece al disco y
      $OA$ es horizontal, así que $\vec{v}_A$ es vertical y vale $\omega_0 R$.
      $B$ pertenece a la barra 2, que gira alrededor del punto fijo $C$ con
      $CB$ horizontal, así que $\vec{v}_B$ también es vertical.

      **La barra 1 se traslada.** Sus dos extremos llevan velocidades
      verticales y la barra es vertical, de modo que
      $\vec{\omega}_1 \times \overrightarrow{AB}$, que sería horizontal, tiene
      que anularse:

      $$
      \omega_1 = 0
      \qquad
      v_B = v_A = \omega_0 R
      \qquad
      \omega_2 = \frac{\omega_0 R}{2R} = \frac{\omega_0}{2}
      $$

      **Las aceleraciones.** Con $\omega_0$ constante, $\vec{a}_A$ es solo
      normal: $\omega_0^{2}R$ hacia $O$. Escribiendo
      $\vec{a}_B = \vec{a}_A + \vec{\alpha}_1 \times \overrightarrow{AB}$ e
      igualándolo a lo que da la barra 2,
      $\vec{a}_B = \vec{\alpha}_2 \times \overrightarrow{CB} - \omega_2^{2}\overrightarrow{CB}$:

      $$
      -\omega_0^{2}R + \alpha_1 R = \frac{\omega_0^{2}}{4}\,2R
      \;\Longrightarrow\;
      \alpha_1 = \frac{3}{2}\,\omega_0^{2}
      \qquad
      \alpha_2 = 0
      $$

      **Los centros de gravedad.** Cada uno en el punto medio de su barra:

      $$
      a_{G1} = \left|-\omega_0^{2}R + \frac{3}{2}\omega_0^{2}\frac{R}{2}\right|
      = \frac{1}{4}\,\omega_0^{2}R
      \qquad
      a_{G2} = \omega_2^{2}R = \frac{1}{4}\,\omega_0^{2}R
      $$

      **Comprobación.** Resolviendo el mecanismo por posiciones —imponiendo
      $AB = R$ y $CB = 2R$ y derivando dos veces numéricamente el ángulo de
      cada barra— salen los mismos $\omega_1 = 0$, $\omega_2 = \omega_0/2$ y
      $\alpha_1 = 1{,}5\,\omega_0^{2}$.

  - id: ejma8-col82-la-aceleracion-de-d-y-de-e
    titulo: La aceleración de dos puntos de una escuadra articulada
    fuente: >-
      Ejercicio 8.2 · Tema 8, «Análisis del movimiento plano» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado y el
      profesor su resolución, contra los que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      El instante mostrado en la figura la barra $AB$ tiene una velocidad
      angular constante de 6 rad/s en el sentido de las agujas del reloj.
      Determinar:

      a) Aceleración del punto $D$.

      b) Aceleración angular de la barra $BDE$.

      c) Aceleración del punto $E$.

      <figure>
