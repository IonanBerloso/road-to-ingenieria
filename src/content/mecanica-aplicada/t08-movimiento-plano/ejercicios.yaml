    pide: La velocidad angular y la aceleración angular de la barra CD.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado dice que $AB$ **se traslada**. ¿Qué se saca de ahí?
        opciones:
          - texto: >-
              Que A y B llevan los dos la misma velocidad v, horizontal, y la
              misma aceleración, que además es nula
            correcta: true
            mensaje: |
              Eso es. Trasladarse significa velocidad angular nula, así que todos
              sus puntos comparten velocidad; y como esa velocidad es constante,
              $\vec{a}_A = \vec{a}_B = 0$. Es el dato que arranca el problema.
          - texto: Que AB no tiene aceleración angular, pero sus puntos sí giran
            mensaje: |
              Si se traslada, sus puntos no giran: describen trayectorias
              idénticas trasladadas. Y como se traslada **siempre**, no solo en
              este instante, también $\alpha_{AB} = 0$.
          - texto: Que B está articulado a la barra CD y comparten velocidad
            mensaje: |
              $B$ es una **deslizadera** sobre $CD$, no una articulación: recorre
              la barra mientras esta gira. De hecho $v_{B/3} = v$.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el mecanismo con la velocidad
          de A y de B, la dirección de la de C y el CIR de la barra CA y el de
          la barra CD**. Solo las direcciones, sin escala.
        comprueba:
          - punto: |
              **$\vec{v}_A$ y $\vec{v}_B$, horizontales, hacia la derecha e
              iguales.**
            porque: |
              AB se traslada: no gira, y todos sus puntos llevan la misma
              velocidad.
          - punto: |
              **$\vec{v}_C$ vertical; el CIR de CA donde se cortan la horizontal
              por C y la vertical por A, que en este instante cae en B; CA gira
              en sentido horario, y C sube.**
            porque: |
              C solo puede subir o bajar por su guía. A, encima de ese CIR, va
              hacia la derecha: alrededor de él, eso es un giro horario, que a
              C, a su izquierda, lo sube.
          - punto: |
              **El punto de CD que coincide con B, quieto: es el CIR de CD, que
              gira en sentido horario.**
            porque: |
              Ese punto se mueve como C, en vertical, más el giro de CD
              alrededor de C, también vertical porque CD es horizontal. Y junto
              con el deslizamiento de B a lo largo de CD, horizontal, tiene que
              dar la velocidad de B, horizontal: su parte vertical es nula. C,
              a la izquierda de ese punto, sube: giro horario.
