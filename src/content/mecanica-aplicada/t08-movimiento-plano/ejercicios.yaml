    pide: Las velocidades angulares del disco y de BC, sus centros instantáneos de rotación y sus aceleraciones angulares.
    pasos:
      - tipo: reconocer
        pregunta: |
          El disco contacta **sin deslizamiento** con la barra $O_1A$, que a su
          vez gira. ¿Qué impone eso en el punto $A$?
        opciones:
          - texto: >-
              Que el punto A del disco y el punto A de la barra lleven la misma
              velocidad, que no es nula
            correcta: true
            mensaje: |
              Eso es. Rodadura significa velocidades iguales en el contacto. Y
              como la barra gira alrededor de $O_1$ con $AO_1 = 2R$, esa
              velocidad común vale $2\omega R$, hacia arriba.
          - texto: Que el punto de contacto A esté quieto, por ser el CIR del disco
            mensaje: |
              Eso valdría si la barra estuviera fija. Aquí la barra gira, así que
              $A$ se mueve a $2\omega R$ y el CIR del disco está en otro sitio:
              a $R$ a la derecha de $A$.
          - texto: Que el disco y la barra giren con la misma velocidad angular
            mensaje: |
              La rodadura iguala **velocidades de un punto**, no velocidades
              angulares. Aquí el disco gira a $2\omega$ y la barra a $\omega$, en
              sentidos contrarios.

      - tipo: calcular
        titulo: La velocidad angular del disco
        pregunta: |
          Escribiendo $\vec{\omega}_d = k\,\omega\vec{k}$, ¿cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '-2'
          tolerancia: 0.01
          formato: un número con su signo, el coeficiente que multiplica a omega
        distractores:
          - valor: '2'
            mensaje: |
              El módulo está bien pero el sentido no. Con $\vec{v}_A$ hacia
              arriba y el centro $C$ por encima de $A$, el disco gira en sentido
              horario, o sea con $\vec{k}$ negativo.
          - valor: '-1'
            mensaje: |
              Parece que has usado $AO_1 = R$. La barra mide $2R$ de $A$ a
              $O_1$, así que $v_A = 2\omega R$ y el disco gira al doble de lo que
              saldría con $R$.
        pista: |
          $v_A = \omega\,AO_1 = 2\omega R$ hacia arriba, y $\vec{v}_C$ es
          horizontal porque $C$ está unido a $B$ por la barra $BC$ y $B$ solo
          puede moverse en horizontal en este instante.
        desarrollo: |
          $$
          \vec{v}_A = (0;\ 2\omega R)
          \qquad
          \vec{v}_C = \vec{v}_A + \vec{\omega}_d \times \overrightarrow{AC}
          = (-R\,\omega_d;\ 2\omega R)
          $$

          Y por la barra $BC$, $\vec{v}_C = (2\omega R;\ 2R\,\omega_2)$. Igualando
          la componente horizontal, $\omega_d = -2\omega$.

      - tipo: calcular
        titulo: El centro instantáneo de rotación del disco
        pregunta: |
          ¿A qué distancia de $A$ está el CIR del disco, medida en unidades de
          $R$ sobre la recta de la barra $O_1A$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número, la distancia en unidades de R
        distractores:
          - valor: '0'
            mensaje: |
              Ese es el error de tomar el punto de contacto como CIR. Solo vale
              cuando la superficie sobre la que se rueda está **fija**, y aquí la
              barra $O_1A$ gira: $A$ se mueve a $2\omega R$.
          - valor: '2'
            mensaje: |
              Has usado $AO_1 = 2R$. El CIR sale de dividir la velocidad de $A$
              entre la velocidad angular del disco:
              $2\omega R / 2\omega = R$.
        pista: |
          El CIR cumple $\vec{v}_A = \vec{\omega}_d \times \overrightarrow{IA}$.
          Con $v_A = 2\omega R$ y $\omega_d = 2\omega$, la distancia es el
          cociente.
        desarrollo: |
          $$
          |IA| = \frac{v_A}{|\omega_d|} = \frac{2\omega R}{2\omega} = R
          $$

          y queda a la derecha de $A$, sobre la propia barra. El de la barra
          $BC$, por el mismo procedimiento, está $2R$ por encima de $B$.

      - tipo: calcular
        titulo: La aceleración angular del disco
        pregunta: |
          Escribiendo $\vec{\alpha}_d = k\,\omega^{2}\vec{k}$, ¿cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.02
          formato: un número, el coeficiente que multiplica a omega cuadrado
        distractores:
          - valor: '2'
            mensaje: |
              Ese es el coeficiente de la aceleración de $A$ como punto de la
              barra, $\omega^{2}AO_1 = 2\omega^{2}R$. Hay que igualarlo con la
              componente tangencial de $\vec{a}_A$ vista desde el disco, que
              lleva además $-2\omega^{2}R$ de la barra $BC$.
          - valor: '0.5'
            mensaje: |
              Ese es el coeficiente de $\alpha_{BC}$, que sale por el camino. El
              del disco es ocho veces mayor.
        pista: |
          En una rodadura, lo que se conserva en el contacto son las componentes
          **tangenciales** de las dos aceleraciones. Aquí la tangente es la
          propia barra, o sea la horizontal.
        desarrollo: |
          Con $\vec{a}_{A,4} = (2\omega^{2}R;\ 0)$ y

          $$
          \vec{a}_{A,3} = \vec{a}_C + \vec{\alpha}_d \times \overrightarrow{CA}
          - \omega_d^{2}\,\overrightarrow{CA}
          $$

          la igualdad de componentes horizontales da

          $$
          -2\omega^{2}R + R\,\alpha_d = 2\omega^{2}R
          \;\Longrightarrow\;
          \alpha_d = 4\,\omega^{2}
          $$

          y de la barra $BC$ sale $\alpha_{BC} = 0{,}5\,\omega^{2}$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $\vec{v}_B = 2\omega R$ horizontal y $\vec{v}_A = 2\omega R$
              vertical; igualando las dos expresiones de $\vec{v}_C$ salen
              $\omega_d = -2\omega$ y $\omega_{BC} = \omega$.
          - texto: >-
              Los CIR salen de $v = \omega\,d$: el del disco a $R$ de $A$ sobre
              la barra, y el de $BC$ a $2R$ por encima de $B$.
          - texto: >-
              En aceleraciones, la rodadura iguala las componentes tangenciales
              en $A$ y $C$ desliza respecto de la barra 4, y salen
              $\alpha_d = 4\omega^{2}$ y $\alpha_{BC} = 0{,}5\,\omega^{2}$.
          - texto: >-
              Como el disco rueda sin deslizar sobre la barra, el punto de
              contacto $A$ es su centro instantáneo de rotación.
            trampa: true
            mensaje: |
              Solo si la barra estuviera quieta. La regla «el CIR es el punto de
              contacto» vale para rodadura sobre una superficie **fija**; aquí la
              barra $O_1A$ gira y arrastra a $A$ a $2\omega R$, así que el CIR
              del disco está a $R$ de distancia.
    resolucion: |
      **La geometría, con $R$ como unidad.** Con $O_2$ en el origen:
      $B = (0;\ R)$, $C = (2R;\ R)$, $A = (2R;\ 0)$ y $O_1 = (4R;\ 0)$. El disco
      tiene centro $C$ y radio $R$, así que toca la barra $O_1A$ justo en $A$.

      **Velocidades.**

      $$
      \vec{v}_B = -2\omega\,\vec{k}\times(0;\ R) = (2\omega R;\ 0)
      \qquad
      \vec{v}_A = -\omega\,\vec{k}\times(-2R;\ 0) = (0;\ 2\omega R)
      $$

      La rodadura en $A$ hace que el punto $A$ del disco lleve esa misma
      velocidad. Escribiendo $\vec{v}_C$ por el disco y por la barra $BC$ e
      igualando:

      $$
      \vec{\omega}_d = -2\omega\,\vec{k}
      \qquad
      \vec{\omega}_{BC} = \omega\,\vec{k}
      $$

      **Los centros instantáneos.** De $v = \omega d$:

      $$
      |I_dA| = \frac{2\omega R}{2\omega} = R
      \qquad
      |I_{BC}B| = \frac{2\omega R}{\omega} = 2R
      $$

      El del disco cae sobre la barra $O_1A$, a $R$ a la derecha de $A$; el de
      $BC$, $2R$ por encima de $B$. Ninguno de los dos es el punto de contacto.

      **Aceleraciones.** $C$ mantiene distancia $R$ a la recta de la barra 4, así
      que su aceleración relativa a esa barra es paralela a ella; con eso y el
      término de Coriolis sale $\alpha_{BC} = 0{,}5\,\omega^{2}$. Y la rodadura,
      que iguala las componentes tangenciales de $\vec{a}_A$ en los dos sólidos,
      da

      $$
      \alpha_d = 4\,\omega^{2}
      $$

      Los dos coinciden con lo que publica la colección.

  - id: ejma8-col816-la-corredera-sobre-el-aro
    titulo: Una corredera que recorre el contorno de un aro giratorio
    fuente: >-
      Ejercicio 8.16 · Tema 8, «Análisis del movimiento plano» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado y el
      profesor su resolución, contra los que está contrastado el desarrollo. El
      resultado es simbólico, así que las casillas piden el coeficiente que
      multiplica a la expresión indicada en cada pregunta.
    nivel: practica
    enunciado: |
      Una barra rígida $O_1A$, de longitud $R\sqrt{2}$, gira alrededor del punto
      fijo $O_1$ con una velocidad angular $\omega$ de sentido horario, y con
      una aceleración angular $\alpha = \omega^{2}$ de sentido antihorario. El
      extremo de esta barra articula con una corredera $A$ que discurre por el
      contorno de un aro rígido de radio $R$, que puede girar alrededor del
      punto fijo $O_2$. Los puntos fijos $O_1$ y $O_2$ se encuentran sobre la
      misma horizontal y en el instante considerado la barra $O_1A$ forma con la
      horizontal un ángulo de 45º, y el punto $A$ y el centro del aro están
      alineados en la misma horizontal, tal y como se muestra en la figura. Para
      este instante, calcular:

      a) Velocidad angular del aro.

      b) Aceleración angular del aro.

      <figure>
      <svg viewBox="0 0 325 235" role="img" width="325" height="235" aria-labelledby="ejma8-col816-t ejma8-col816-d">
        <title id="ejma8-col816-t">Barra O1A a 45 grados cuyo extremo es una corredera que recorre un aro que gira alrededor de O2</title>
        <desc id="ejma8-col816-d">Del punto fijo O1 sale la barra 1, de longitud raíz de dos por R, subiendo a 45 grados hasta A. A es una corredera que recorre el contorno de un aro rígido de radio R y centro C. El aro puede girar alrededor del punto fijo O2, que está en su propio contorno, en la misma horizontal que O1 y justo debajo de C. En este instante A y C están a la misma altura. La figura está dibujada a escala.</desc>
