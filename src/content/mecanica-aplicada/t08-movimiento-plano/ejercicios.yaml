        <text x="126" y="136" font-size="10" text-anchor="end" fill="var(--ink)" font-style="italic">v<tspan font-size="7.5" dy="2.5">D,2</tspan><tspan dy="-2.5"></tspan></text>
        <circle cx="40" cy="130" r="2.4" fill="var(--ink)"/>
        <text x="32" y="128" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">G</text>
        <circle cx="70" cy="130" r="2.4" fill="var(--ink)"/>
        <text x="76" y="128" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">E</text>
        <circle cx="70" cy="100" r="2.4" fill="var(--ink)"/>
        <text x="76" y="114" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">C</text>
        <circle cx="130" cy="70" r="2.4" fill="var(--ink)"/>
        <text x="142" y="72" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">O</text>
        <circle cx="25" cy="100" r="2.4" fill="var(--ink)"/>
        <text x="20" y="98" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">A</text>
        <circle cx="235" cy="100" r="2.4" fill="var(--ink)"/>
        <text x="240" y="98" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">B</text>
        <circle cx="190" cy="100" r="2.4" fill="var(--ink)"/>
        <text x="196" y="114" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">D</text>
        <circle cx="190" cy="130" r="2.4" fill="var(--ink)"/>
        <text x="194" y="124" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">F</text>
        <circle cx="205" cy="130" r="2.4" fill="var(--ink)"/>
        <text x="212" y="128" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">H</text>
      </svg>
      <figcaption>

      Sin escala. Cada sólido gira alrededor de su punto fijo, G, O y H, y la velocidad de cada punto es perpendicular a la recta que lo une con él. En C y en D la normal común es vertical: las dos velocidades de cada contacto tienen la misma componente vertical, y la diferencia horizontal es el deslizamiento. Ejes: x hacia la derecha, y hacia arriba; giros positivos en sentido antihorario.

      </figcaption>
      </figure>

      - **Los tres sólidos** giran alrededor de sus puntos fijos: el disco 1
        alrededor de G, la chapa alrededor de O y el disco 2 alrededor de H.
        Cada velocidad es perpendicular a la recta que une el punto con el
        suyo.
      - **En C y en D** la chapa apoya con su base horizontal, y la normal
        común es vertical. Los sólidos no se separan ni se penetran: las dos
        velocidades de cada contacto tienen la misma componente vertical, y
        la diferencia horizontal es el deslizamiento.
      - **Los giros.** El disco 1 sube C; la chapa, para subir C, que está a
        la izquierda de O, gira en sentido horario, y baja D; el disco 2,
        para bajar D, que está a la izquierda de H, gira en sentido
        antihorario.

      Con la base de la chapa en $y = 0$ y G en $x = 0$: $G = (0;\ -R)$,
      $E = (R;\ -R)$, $C = (R;\ 0)$, $O = (3R;\ R)$, $D = (5R;\ 0)$,
      $F = (5R;\ -R)$ y $H = (5{,}5R;\ -R)$.

      **2. Incógnitas.** $\omega_3$, $\omega_2$, el deslizamiento en D,
      $\alpha_3$ y $\alpha_2$.

      **3. Ecuaciones.** En cada contacto, las componentes verticales de las
      dos velocidades son iguales:

      $$
      \left(\vec{\omega}\times\overrightarrow{GC}\right)\cdot\vec{j} = \left(\vec{\omega}_3\times\overrightarrow{OC}\right)\cdot\vec{j},
      \qquad
      \left(\vec{\omega}_2\times\overrightarrow{HD}\right)\cdot\vec{j} = \left(\vec{\omega}_3\times\overrightarrow{OD}\right)\cdot\vec{j}
      $$

      Y el deslizamiento en D es la diferencia de las dos:
      $\vec{v}_d = \vec{\omega}_2\times\overrightarrow{HD} - \vec{\omega}_3\times\overrightarrow{OD}$.

      Para las aceleraciones: los centros E y F están siempre a R de la base
      de la chapa, así que, vistos desde la chapa, se mueven por rectas
      paralelas a la base, y su velocidad y su aceleración relativas son
      horizontales. Por composición, para E y para F:

      $$
      \vec{a}_P = \vec{\alpha}_3\times\overrightarrow{OP} - \omega_3^{2}\,\overrightarrow{OP}
      + a_{P/3}\,\vec{i} + 2\,\vec{\omega}_3\times\vec{v}_{P/3}
      $$

      con $\vec{a}_E = -\omega^{2}\,\overrightarrow{GE}$, porque el disco 1
      gira a $\omega$ constante, y
      $\vec{a}_F = \vec{\alpha}_2\times\overrightarrow{HF} - \omega_2^{2}\,\overrightarrow{HF}$.

      **4. Resultados.** Con $\overrightarrow{GC} = (R;\ R)$,
      $\overrightarrow{OC} = (-2R;\ -R)$,
      $\overrightarrow{HD} = (-0{,}5R;\ R)$ y
      $\overrightarrow{OD} = (2R;\ -R)$, las dos condiciones quedan

      $$
      \omega R = -2R\,\omega_3,
      \qquad
      -0{,}5R\,\omega_2 = 2R\,\omega_3
      $$

      $$
      \vec{\omega}_3 = -\frac{\omega}{2}\,\vec{k},
      \qquad
      \vec{\omega}_2 = 2\omega\,\vec{k},
      \qquad
      \vec{v}_d = (-2\,\omega R;\ -\omega R) - (-0{,}5\,\omega R;\ -\omega R) = -1{,}5\,\omega R\,\vec{i}
      $$

      En aceleraciones, E: $\overrightarrow{OE} = (-2R;\ -2R)$,
      $\vec{v}_E = (0;\ \omega R)$ y
      $\vec{\omega}_3\times\overrightarrow{OE} = (-\omega R;\ \omega R)$, así
      que $\vec{v}_{E/3} = (\omega R;\ 0)$, horizontal, y el Coriolis vale
      $(0;\ -\omega^{2}R)$:

      $$
      (-\omega^{2}R;\ 0) = \alpha_3\,(2R;\ -2R) - \frac{\omega^{2}}{4}\,(-2R;\ -2R) + (a_{E/3};\ 0) + (0;\ -\omega^{2}R)
      $$

      La vertical da $0 = -2R\,\alpha_3 + \tfrac{1}{2}\omega^{2}R - \omega^{2}R$.
      F: $\overrightarrow{OF} = (2R;\ -2R)$ y
      $\overrightarrow{HF} = (-0{,}5R;\ 0)$; $\vec{v}_F = (0;\ -\omega R)$ y
      $\vec{\omega}_3\times\overrightarrow{OF} = (-\omega R;\ -\omega R)$,
      así que $\vec{v}_{F/3} = (\omega R;\ 0)$, y el Coriolis vuelve a valer
      $(0;\ -\omega^{2}R)$. Con
      $\vec{\alpha}_3\times\overrightarrow{OF} - \omega_3^{2}\,\overrightarrow{OF} = (-\omega^{2}R;\ 0)$:

      $$
      (2\,\omega^{2}R;\ -0{,}5R\,\alpha_2) = (-\omega^{2}R;\ 0) + (a_{F/3};\ 0) + (0;\ -\omega^{2}R)
      $$

      $$
      \vec{\alpha}_3 = -\frac{\omega^{2}}{4}\,\vec{k},
      \qquad
      \vec{\alpha}_2 = 2\,\omega^{2}\,\vec{k}
      $$

      **El disco 2 gira a $2\omega$ y acelera a $2\omega^{2}$, las dos en
      sentido antihorario; en D resbala respecto de la chapa a
      $1{,}5\,\omega R$, hacia la izquierda.** Coinciden con los que publica
      la colección.

      **5. Comprobación.** Por la geometría, sin composición de movimientos.
      Con $\varphi$ el giro de la chapa y $\vec{m} = (-\sin\varphi;\ \cos\varphi)$
      su normal hacia arriba, cada disco toca la chapa mientras su centro
      esté 2R por debajo de O medido según $\vec{m}$:
      $\overrightarrow{OE}\cdot\vec{m} = \overrightarrow{OF}\cdot\vec{m} = -2R$.
      Con $\psi$ el giro del disco 1, $\dot{\psi} = \omega$ y
      $\ddot{\psi} = 0$, $\overrightarrow{OE} = (-3R + R\cos\psi;\ -2R + R\sin\psi)$;
      derivando dos veces y evaluando en el instante, con $\varphi = \psi = 0$:

      $$
      2R\,\dot{\varphi} + R\,\omega = 0,
      \qquad
      2R\,\ddot{\varphi} + 2R\,\dot{\varphi}^{2} = 0
      $$

      $\dot{\varphi} = -\omega/2$ y $\ddot{\varphi} = -\omega^{2}/4$. Con
      $\chi$ el giro del disco 2,
      $\overrightarrow{OF} = (2{,}5R + \tfrac{R}{2}\cos\chi;\ -2R + \tfrac{R}{2}\sin\chi)$,
      y en el instante $\chi = 180^\circ$:

      $$
      -2R\,\dot{\varphi} - \frac{R}{2}\,\dot{\chi} = 0,
      \qquad
      -2R\,\ddot{\varphi} + 2R\,\dot{\varphi}^{2} - \frac{R}{2}\,\ddot{\chi} = 0
      $$

      $\dot{\chi} = 2\omega$ y $\ddot{\chi} = 2\omega^{2}$. Y el
      deslizamiento, desde F, con su velocidad relativa y el giro relativo:
      $\vec{v}_d = \vec{v}_{F/3} + (\omega_2 - \omega_3)\,\vec{k}\times\overrightarrow{FD} = (\omega R;\ 0) + 2{,}5\,\omega\,\vec{k}\times(0;\ R) = -1{,}5\,\omega R\,\vec{i}$.
      Lo mismo.

      **Lo que dice el resultado.** Los dos discos son iguales y la chapa los
      toca a la misma distancia de la vertical de O, pero el disco 2 gira el
      doble de deprisa: pivota en H, a R/2 de su centro, y el brazo con el
      que mueve D en vertical es solo R/2, frente a la R del disco 1. Aunque
      el disco 1 gire uniformemente, la chapa y el disco 2 aceleran, porque
      la geometría cambia. Y los centros E y F no están quietos: los puntos
      fijos son G y H, y cada centro describe una circunferencia.

  - id: ejma8-col814-la-barra-vertical-que-se-traslada
    titulo: Una barra vertical que se traslada entre dos deslizaderas
    fuente: >-
      Ejercicio 8.14 · Tema 8, «Análisis del movimiento plano» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado y el
      profesor su resolución, contra los que está contrastado el desarrollo. El
      resultado es simbólico, así que las casillas piden el coeficiente que
      multiplica a la expresión indicada en cada pregunta.
    nivel: practica
    antes:
      idea: |
        Cada barra es un sólido rígido con su velocidad angular y su
        aceleración angular, y una articulación es un punto común a las dos
        barras que une. Un punto que corre por una barra que gira tiene,
        visto desde ella, el arrastre y el relativo y, en las aceleraciones,
        además el término de Coriolis.
      formula: |
        Los campos de velocidades y de aceleraciones del sólido rígido en el
        plano, con Q un punto conocido:

        $$
        \vec{v}_P = \vec{v}_Q + \vec{\omega}\times\overrightarrow{QP},
        \qquad
        \vec{a}_P = \vec{a}_Q + \vec{\alpha}\times\overrightarrow{QP} - \omega^{2}\,\overrightarrow{QP}
        $$

        Y la composición de aceleraciones respecto de una barra 3 que gira:

        $$
        \vec{a}_P = \vec{a}_{P \in 3} + \vec{a}_{P/3} + 2\,\vec{\omega}_3\times\vec{v}_{P/3}
        $$
      reconocer: |
        Antes de calcular se mira qué dice el enunciado del movimiento de cada
        pieza.
    enunciado: |
      La barra vertical $AB$ de longitud $L$ se traslada con velocidad $v$
      constante hacia la derecha. Está articulada en sus extremos a 2
      deslizaderas. La deslizadera en $A$ se mueve por la horizontal y la
      deslizadera en $B$ se mueve sobre la barra $CD$ que está articulada en $C$
      a una deslizadera vertical. Calcular:

      a) Velocidad angular de la barra $CD$ (3).

      b) Aceleración angular de la barra $CD$ (3).

