        <text x="50" y="110" font-size="10" text-anchor="end" fill="var(--ink)" font-style="italic">ω<tspan font-size="7.5" dy="2.5">2</tspan><tspan dy="-2.5"></tspan></text>
        <path d="M157.7 156.2 A11 11 0 0 1 178.3 156.2" fill="none" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="168" y="142" font-size="10" text-anchor="middle" fill="var(--ink)" font-style="italic">ω<tspan font-size="7.5" dy="2.5">3</tspan><tspan dy="-2.5"></tspan></text>
        <line x1="92" y1="115" x2="152" y2="115" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="122" y="108" font-size="10" text-anchor="middle" fill="var(--ink)" font-style="italic">v<tspan font-size="7.5" dy="2.5">A</tspan><tspan dy="-2.5"> = v<tspan font-size="7.5" dy="2.5">B</tspan><tspan dy="-2.5"></tspan></tspan></text>
        <line x1="40" y1="160" x2="40" y2="125.4" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="24" y="134" font-size="10" text-anchor="end" fill="var(--ink)" font-style="italic">v<tspan font-size="7.5" dy="2.5">C</tspan></text>
