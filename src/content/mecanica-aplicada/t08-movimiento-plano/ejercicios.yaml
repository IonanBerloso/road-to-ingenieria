      - tipo: calcular
        titulo: La velocidad angular de la varilla articulada en A
        pregunta: |
          ¿Cuánto vale $\omega_a$, en rad/s?
        respuesta:
          tipo: numero
          valor: '1.5'
          tolerancia: 0.01
          formato: un número, en rad/s
        distractores:
          - valor: '3'
            mensaje: |
              Te has dejado el $\operatorname{sen}30^{\circ}$. De la velocidad
              de $D$ solo la componente perpendicular a $AD$ hace girar a la
              varilla 2; la paralela se la come el deslizamiento.
          - valor: '6'
            mensaje: |
              Esa es la de la varilla articulada en $B$. Las dos varillas no
              giran a la vez: entre ellas hay una deslizadera que absorbe la
              diferencia.
        pista: |
          $BD = d\tan 30^{\circ}$ y $AD = d/\cos 30^{\circ}$. Proyecta
          $\vec{v}_D$ sobre la perpendicular a $AD$:
          $\omega_a\,AD = \omega_b\,BD\operatorname{sen}30^{\circ}$.
        desarrollo: |
          Con $d = 0{,}4$ m, $BD = 0{,}2309$ m y $AD = 0{,}4619$ m:

          $$
          \omega_a = \frac{BD\operatorname{sen}30^{\circ}}{AD}\,\omega_b
          = \frac{0{,}2309 \cdot 0{,}5}{0{,}4619}\cdot 6 = 1{,}5\ \text{rad/s}
          $$

          Y la componente paralela es el deslizamiento:
          $v_{D/2} = \omega_b\,BD\cos 30^{\circ} = 1{,}2$ m/s.

      - tipo: calcular
        titulo: La aceleración angular de la varilla articulada en A
        pregunta: |
          ¿Cuánto vale $\alpha_a$, en rad/s²?
        respuesta:
          tipo: numero
          valor: '7.794'
          tolerancia: 0.02
          formato: un número, en rad/s²
        distractores:
          - valor: '15.59'
            mensaje: |
              Te has dejado el término de Coriolis,
              $2\,\omega_a v_{D/2} = 3{,}6$ m/s². Con una deslizadera sobre un
              sólido que gira, ese término nunca falta y aquí vale la mitad del
              otro.
          - valor: '0'
            mensaje: |
              $\omega_b$ es constante, pero $\omega_a$ no tiene por qué serlo:
              la relación entre las dos depende del ángulo, que está cambiando.
        pista: |
          Proyectando sobre la perpendicular a $AD$:
          $\alpha_a\,AD + 2\,\omega_a v_{D/2} = \omega_b^{2}\,BD\cos 30^{\circ}$.
        desarrollo: |
          $$
          \alpha_a = \frac{\omega_b^{2}\,BD\cos 30^{\circ} - 2\,\omega_a v_{D/2}}{AD}
          = \frac{7{,}2 - 3{,}6}{0{,}4619} = 7{,}794\ \text{rad/s}^{2}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $D$ pertenece a la varilla 1, así que
              $\vec{v}_D = \vec{\omega}_b \times \overrightarrow{BD}$, de módulo
              $6 \cdot 0{,}2309 = 1{,}386$ m/s y horizontal.
          - texto: >-
              Descomponiendo $\vec{v}_D$ según $AD$ y su perpendicular salen
              $\omega_a = 1{,}5$ rad/s y un deslizamiento
              $v_{D/2} = 1{,}2$ m/s.
          - texto: >-
              En aceleraciones hay que añadir Coriolis,
              $2\,\omega_a v_{D/2}$, y queda
              $\alpha_a = 7{,}79$ rad/s².
          - texto: >-
              Como $D$ pertenece a las dos varillas, su aceleración es la misma
              vista desde cualquiera de ellas.
            trampa: true
            mensaje: |
              Eso solo vale en una articulación. Aquí $D$ **desliza** sobre la
              varilla 2, así que entre $\vec{a}_D$ y $\vec{a}_{D \in 2}$ hay dos
              términos más: la aceleración relativa a lo largo de la varilla y
              la de Coriolis.
    resolucion: |
      **1. Esquema de velocidades.** Es un problema de cinemática con una
      deslizadera: el dibujo lleva la velocidad de D y sus dos componentes
      respecto de la varilla 2.

      <figure class="figura-examen">
      <svg viewBox="10 18 306 179" role="img" width="459" height="269" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">Esquema de velocidades de las dos varillas unidas por la deslizadera D</title>
        <desc id="dsl-d">Dos puntos fijos en el techo, A a la izquierda y B a la derecha. De B cuelga la varilla 1, vertical, hasta D, con su giro antihorario. De A baja la varilla 2 a 30 grados hacia la derecha y pasa por D, donde hay una deslizadera que corre por ella. En D, su velocidad, horizontal hacia la derecha, y sus dos componentes: a lo largo de la varilla 2, alejándose de A, la velocidad relativa; y perpendicular a la varilla 2, hacia arriba y a la derecha, la del punto de la varilla 2 que coincide con D. A trazos, el paralelogramo que forman. Alrededor de A, el giro de la varilla 2, antihorario.</desc>
        <defs>
