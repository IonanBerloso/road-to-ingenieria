            <line x1="92" y1="115" x2="152" y2="115" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
            <text x="122" y="108" font-size="10" text-anchor="middle" fill="var(--ink)" font-style="italic">v<tspan font-size="7.5" dy="2.5">A</tspan><tspan dy="-2.5"> = v<tspan font-size="7.5" dy="2.5">B</tspan><tspan dy="-2.5"></tspan></tspan></text>
            <line x1="40" y1="160" x2="40" y2="125.4" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
            <text x="24" y="134" font-size="10" text-anchor="end" fill="var(--ink)" font-style="italic">v<tspan font-size="7.5" dy="2.5">C</tspan></text>
            <circle cx="40" cy="160" r="2.4" fill="var(--ink)"/>
            <text x="30" y="178" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">C</text>
            <circle cx="92" cy="70" r="2.4" fill="var(--ink)"/>
            <text x="104" y="86" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">A</text>
            <circle cx="92" cy="160" r="2.4" fill="var(--ink)"/>
            <text x="104" y="178" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">B</text>
            <circle cx="200" cy="160" r="2.4" fill="var(--ink)"/>
            <text x="206" y="164" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">D</text>
            <text x="112" y="188" font-size="9" text-anchor="start" fill="var(--faint)">CIR de CA y de CD</text>
          </svg>

      - tipo: calcular
        titulo: La velocidad angular de la barra CD
        pregunta: |
          Escribiendo $\omega_3 = k\,\dfrac{v}{L}$, ¿cuánto vale $k$ en valor
          absoluto?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número, el coeficiente que multiplica a v partido por L
        distractores:
          - valor: '0.577'
            mensaje: |
              Ese es el coeficiente de $v_C$, la velocidad de la deslizadera
              vertical, no la velocidad angular. Para pasar de una a otra hay que
              dividir entre $CB$, que vale $\tfrac{\sqrt{3}}{3}L$.
          - valor: '1.732'
            mensaje: |
              Has multiplicado por $\sqrt{3}$ donde había que dividir. Comprueba
              las longitudes: $CB = L/\sqrt{3}$ y $CA = 2L/\sqrt{3}$.
        pista: |
          Primero $\vec{v}_C$ con la barra 2, que une $C$ y $A$; después, en la
          barra 3, la componente vertical de $\vec{v}_B$ es nula y eso fija
          $\omega_3$.
        desarrollo: |
          Con $C$ en el origen, $B = (L/\sqrt{3};\ 0)$ y $A = (L/\sqrt{3};\ L)$.
          De la barra 2, imponiendo que $\vec{v}_C$ sea vertical:

          $$
          \omega_2 = -\frac{v}{L}
          \qquad
          v_C = \frac{\sqrt{3}}{3}\,v
          $$

          Y en la barra 3, la componente vertical de $\vec{v}_B$ tiene que ser
          nula:

          $$
          \frac{\sqrt{3}}{3}v + \frac{\sqrt{3}}{3}L\,\omega_3 = 0
          \;\Longrightarrow\;
          \omega_3 = -\frac{v}{L}
          $$

      - tipo: calcular
        titulo: La aceleración de la deslizadera C
        pregunta: |
          Escribiendo $a_C = k\,\dfrac{v^{2}}{L}$, ¿cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '1.3333'
          tolerancia: 0.01
          formato: un número, el coeficiente que multiplica a v cuadrado partido por L
        distractores:
          - valor: '1'
            mensaje: |
              Te falta un tercio. Sale de la combinación de la normal
              $\omega_2^{2}\,CA$ con la tangencial $\alpha_2\,CA$ al proyectar
              sobre la vertical; no basta con uno de los dos términos.
          - valor: '0.577'
            mensaje: |
              Ese es el coeficiente de la **velocidad** $v_C$, no el de la
              aceleración. Fíjate en las unidades: aquí la respuesta va con
              $v^{2}/L$.
        pista: |
          $\vec{a}_A = 0$, así que
          $0 = \vec{a}_C + \vec{\alpha}_2 \times \overrightarrow{CA} - \omega_2^{2}\overrightarrow{CA}$,
          con $\vec{a}_C$ vertical.
        desarrollo: |
          La componente horizontal da
          $\alpha_2 = -\dfrac{\sqrt{3}}{3}\dfrac{v^{2}}{L^{2}}$, y con ella la
          vertical:

          $$
          a_C = \frac{4}{3}\,\frac{v^{2}}{L}
          $$

      - tipo: calcular
        titulo: La aceleración angular de la barra CD
        pregunta: |
          Escribiendo $\alpha_3 = k\,\dfrac{v^{2}}{L^{2}}$, ¿cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '1.1547'
          tolerancia: 0.01
          formato: un número, el coeficiente que multiplica a v cuadrado partido por L cuadrado
        distractores:
          - valor: '0.577'
            mensaje: |
              Ese es $\alpha_2$, el de la barra que une $C$ con $A$. El de $CD$
              es justo el doble, y sale de la ecuación de $B$ como deslizadera.
          - valor: '2'
            mensaje: |
              Te has dejado por el camino el reparto entre $a_C$ y el término de
              Coriolis. La combinación correcta es
              $\alpha_3\,CB + a_C = 2\,\omega_3 v_{B/3}$.
        pista: |
          $B$ desliza sobre $CD$ con $v_{B/3} = v$, así que en la vertical
          aparece Coriolis:
          $\alpha_3\,CB + a_C = 2\,\omega_3\,v_{B/3}$.
        desarrollo: |
          $$
          \alpha_3\,\frac{L}{\sqrt{3}} + \frac{4}{3}\frac{v^{2}}{L}
          = 2\,\frac{v}{L}\,v
          \;\Longrightarrow\;
          \alpha_3 = \frac{2\sqrt{3}}{3}\,\frac{v^{2}}{L^{2}} = 1{,}155\,\frac{v^{2}}{L^{2}}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $AB$ se traslada, así que $\vec{v}_A = \vec{v}_B = v\,\vec{\imath}$
              y $\vec{a}_A = \vec{a}_B = 0$.
          - texto: >-
              De la barra $CA$, imponiendo que $C$ solo pueda subir o bajar,
              salen $\omega_2 = v/L$ y $v_C = \tfrac{\sqrt{3}}{3}v$.
          - texto: >-
              En la barra $CD$, con $B$ deslizando y $v_{B/3} = v$, salen
              $\omega_3 = v/L$ y, con el Coriolis,
              $\alpha_3 = \tfrac{2\sqrt{3}}{3}\,v^{2}/L^{2}$.
          - texto: >-
              Como $AB$ se traslada con velocidad constante, todo el mecanismo se
              mueve uniformemente y las aceleraciones angulares son nulas.
            trampa: true
            mensaje: |
              Solo $AB$ va uniformemente. Las otras dos barras cambian de
              orientación, y la relación entre sus ángulos y la posición de $AB$
              no es lineal: de hecho $\alpha_3 = 1{,}155\,v^{2}/L^{2}$, que no es
              pequeño.
    resolucion: |
      **1. Esquema de velocidades.** Es un problema de cinemática con una
      deslizadera sobre una barra que gira: el dibujo lleva las velocidades
      de A, B y C y los CIR de las barras CA y CD, sin escala.

      <figure class="figura-examen">
      <svg viewBox="8 42 222 150" role="img" width="333" height="225" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">Esquema de velocidades de la barra vertical que se traslada y de las barras CA y CD</title>
        <desc id="dsl-d">La barra AB, vertical, con A en una deslizadera que corre bajo una guía horizontal y B en una deslizadera que corre por la barra CD, horizontal en este instante. CD está articulada en C a una deslizadera que sube y baja por una guía vertical. La barra CA une C con A, a 60 grados. A mitad de AB, su velocidad, horizontal, hacia la derecha, la misma para A y para B. En C, su velocidad, vertical, hacia arriba. En B, el centro instantáneo de rotación de CA y el de CD. Los giros de CA y de CD, horarios.</desc>
