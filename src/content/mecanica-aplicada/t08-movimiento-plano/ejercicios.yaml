    pide: Las velocidades de O y A, las velocidades angulares del disco y de la barra BC, y la velocidad de A respecto de BC.
    pasos:
      - tipo: reconocer
        pregunta: |
          $O$ corre por una guía vertical y $A$ por una ranura horizontal.
          ¿Dónde está el CIR de la barra $OA$?
        opciones:
          - texto: Donde se cortan la horizontal por O y la vertical por A
            correcta: true
            mensaje: |
              Eso es. $\vec{v}_O$ es vertical y $\vec{v}_A$ horizontal, así que
              sus perpendiculares son la horizontal por $O$ y la vertical por
              $A$: se cortan a $2R$ de $O$ y a $R$ de $A$.
          - texto: En A, porque es el centro del disco
            mensaje: |
              Ser el centro de un disco no da velocidad nula. De hecho $A$ se
              mueve a $\omega_1 R = 1$ m/s por su ranura, y el CIR queda
              justo debajo de él.
          - texto: En el punto E, porque allí hay rodadura
            mensaje: |
              En $E$ ruedan el **disco** y la **barra BC**, y eso significa que
              sus dos puntos de contacto llevan la misma velocidad, no que esa
              velocidad sea nula. $E$ no es el CIR de nadie aquí.

      - tipo: calcular
        titulo: La velocidad del punto A
        pregunta: |
          ¿Cuánto vale $v_A$, en m/s?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número, en m/s
        distractores:
          - valor: '2'
            mensaje: |
              Esa es la de $O$, que está a $2R$ del CIR. $A$ está solo a $R$, y
              en un giro la velocidad es proporcional a la distancia al centro
              instantáneo.
          - valor: '2.236'
            mensaje: |
              Has usado la longitud entera de la barra,
              $|OA| = \sqrt{5}\,R$. Lo que manda es la distancia de $A$ al CIR,
              que vale $R$.
        pista: |
          El CIR está a $R$ por debajo de $A$, así que $v_A = \omega_1 R$.
        desarrollo: |
          $$
          v_A = \omega_1 R = 10 \cdot 0{,}1 = 1\ \text{m/s}
          \qquad
          v_O = \omega_1 \cdot 2R = 2\ \text{m/s}
          $$

          $\vec{v}_A = -1\,\vec{\imath}$ m/s y $\vec{v}_O = -2\,\vec{\jmath}$ m/s.

      - tipo: calcular
        titulo: La velocidad angular del disco
        pregunta: |
          ¿Cuánto vale $\omega_2$, en rad/s y en valor absoluto?
        respuesta:
          tipo: numero
          valor: '9.114'
          tolerancia: 0.02
          formato: un número, en rad/s
        distractores:
          - valor: '10'
            mensaje: |
              Ese número sale de suponer que $E$ está quieto, es decir de tomar
              $E$ como CIR del disco. Pero $E$ es el contacto con una barra que
              **también se mueve**, y lo único que impone la rodadura es que los
              dos puntos lleven la misma velocidad.
          - valor: '4.115'
            mensaje: |
              Has usado $\operatorname{sen}\beta$ donde va $\cos\beta$. La
              componente de $\vec{v}_A$ que hace girar al disco es la
              perpendicular a $AE$, y esa lleva el coseno.
        pista: |
          De $\cos(45^{\circ}+\beta) = \sqrt{2}/4$ sale $\beta = 24{,}3^{\circ}$.
          Proyectando en $E$, $\omega_2 R = v_A\cos\beta$.
        desarrollo: |
          $$
          \beta = 24{,}3^{\circ}
          \qquad
          \omega_2 = \frac{v_A\cos\beta}{R} = \cos\beta\cdot\omega_1 = 9{,}11\ \text{rad/s}
          $$

          Horaria: $\vec{\omega}_2 = -9{,}11\,\vec{k}$ rad/s.

      - tipo: calcular
        titulo: La velocidad angular de la barra BC
        pregunta: |
          ¿Cuánto vale $\omega_3$, en rad/s y en valor absoluto?
        respuesta:
          tipo: numero
          valor: '1.555'
          tolerancia: 0.01
          formato: un número, en rad/s
        distractores:
          - valor: '9.114'
            mensaje: |
              Esa es la del disco. En una rodadura los dos sólidos comparten la
              velocidad del punto de contacto, no la velocidad angular: cada uno
              gira alrededor de un sitio distinto.
          - valor: '0.588'
            mensaje: |
              Parece que has dividido entre $7R$ en vez de entre $\sqrt{7}\,R$.
              La distancia de $B$ a $E$ es $\sqrt{7}\,R = 0{,}2646$ m.
        pista: |
          $\omega_3 \, BE = v_A \operatorname{sen}\beta$, con
          $BE = \sqrt{7}\,R$.
        desarrollo: |
          $$
          \omega_3 = \frac{v_A\operatorname{sen}\beta}{\sqrt{7}\,R}
          = \frac{\operatorname{sen}\beta}{\sqrt{7}}\,\omega_1 = 1{,}555\ \text{rad/s}
          $$

          También horaria: $\vec{\omega}_3 = -1{,}56\,\vec{k}$ rad/s.

      - tipo: calcular
        titulo: La velocidad de A respecto de la barra BC
        pregunta: |
          ¿Cuánto vale el módulo de $\vec{v}_{A/BC}$, en m/s?
        respuesta:
          tipo: numero
          valor: '0.756'
          tolerancia: 0.008
          formato: un número, en m/s
        distractores:
          - valor: '1'
            mensaje: |
              Ese es el módulo de $\vec{v}_A$ a secas. La velocidad **relativa**
              se obtiene restando la del punto de la barra $BC$ que en este
              instante coincide con $A$, que no es nula.
          - valor: '0.44'
            mensaje: |
              Ese es el módulo de $\vec{v}_{A \in BC} = \omega_3\,BA$, el
              sustraendo. Falta restarlo de $\vec{v}_A$, y como los dos vectores
              no son paralelos hay que hacerlo en componentes.
        pista: |
          $\vec{v}_{A/BC} = \vec{v}_A - \vec{\omega}_3 \times \overrightarrow{BA}$,
          con $\overrightarrow{BA} = (0{,}2;\ -0{,}2)$ m.
        desarrollo: |
          $$
          \vec{v}_{A \in BC} = -1{,}555\,\vec{k} \times (0{,}2;\ -0{,}2;\ 0)
          = (-0{,}311;\ -0{,}311)\ \text{m/s}
          $$

          $$
          \vec{v}_{A/BC} = (-1;\ 0) - (-0{,}311;\ -0{,}311)
          = (-0{,}689;\ 0{,}311)\ \text{m/s}
          $$

          De módulo 0,756 m/s, y dirigido hacia arriba y a la izquierda, a lo
          largo de la barra $BC$ —que es lo que tenía que salir, porque $A$ solo
          puede desplazarse respecto de $BC$ manteniendo la tangencia—.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El CIR de la barra $OA$ está a $2R$ de $O$ y a $R$ de $A$, así que
              $v_O = 2$ m/s hacia abajo y $v_A = 1$ m/s hacia la izquierda.
          - texto: >-
              De $\cos(45^{\circ}+\beta) = \sqrt{2}/4$ sale
              $\beta = 24{,}3^{\circ}$, y descomponiendo $\vec{v}_A$ en $E$,
              $\omega_2 = 9{,}11$ rad/s y $\omega_3 = 1{,}56$ rad/s.
          - texto: >-
              Restando a $\vec{v}_A$ la velocidad del punto de $BC$ que coincide
              con $A$, queda
              $\vec{v}_{A/BC} = (-0{,}689;\ 0{,}311)$ m/s.
          - texto: >-
              Como en $E$ hay rodadura, el punto $E$ tiene velocidad nula y sirve
              de CIR para el disco.
            trampa: true
            mensaje: |
              Rodadura entre dos sólidos significa que sus **dos** puntos de
              contacto llevan la misma velocidad, no que esa velocidad sea cero.
              Eso solo pasa cuando uno de los dos está fijo, y aquí la barra
              $BC$ gira alrededor de $B$.
    resolucion: |
      **La geometría, con $R = 0{,}1$ m.** Tomando $O$ en el origen,
      $A = (2R;\ R)$ y $B = (0;\ 3R)$, así que $BA = 2\sqrt{2}\,R$. La barra
      $BC$ es tangente al disco en $E$, de modo que $AE \perp BC$ y

      $$
      BE = \sqrt{BA^{2} - R^{2}} = \sqrt{8R^{2}-R^{2}} = \sqrt{7}\,R
      $$

      El ángulo de la barra bajo la horizontal cumple
      $\cos(45^{\circ}+\beta) = \sqrt{2}/4$, o sea $\beta = 24{,}3^{\circ}$.

      **Velocidades de O y A.** $\vec{v}_O$ es vertical y $\vec{v}_A$
      horizontal, así que el CIR de la barra 1 está en $(2R;\ 0)$:

      $$
      v_A = \omega_1 R = 1\ \text{m/s}
      \qquad
      v_O = \omega_1\,2R = 2\ \text{m/s}
      $$

      **Rodadura en E.** El punto $E$ del disco y el punto $E$ de la barra
      llevan la misma velocidad. Descomponiendo $\vec{v}_A$ según $AE$ y su
      perpendicular:

      $$
      \omega_2 = \cos\beta\,\omega_1 = 9{,}11\ \text{rad/s}
      \qquad
      \omega_3 = \frac{\operatorname{sen}\beta}{\sqrt{7}}\,\omega_1 = 1{,}56\ \text{rad/s}
      $$

      **La velocidad relativa.**

      $$
      \vec{v}_{A/BC} = \vec{v}_A - \vec{\omega}_3\times\overrightarrow{BA}
      = (-0{,}689;\ 0{,}311)\ \text{m/s}
      $$

      de módulo 0,756 m/s y paralela a $BC$, apuntando de $C$ hacia $B$.
      Coincide con el $(-0{,}688;\ 0{,}312)$ que publica la colección.

  - id: ejma8-col810-la-placa-triangular-que-se-traslada
    titulo: La placa triangular colgada de dos barras iguales
    fuente: >-
      Ejercicio 8.10 · Tema 8, «Análisis del movimiento plano» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      En el sistema de la figura las barras $AB$ y $CD$ tienen la misma longitud
      y sostienen una placa triangular a través de las articulaciones $B$ y $D$.
      Sabiendo que la barra $CD$ tiene en este instante una velocidad angular
      $\omega_{CD} = 4$ rad/s y una aceleración angular
      $\alpha_{CD} = 2$ rad/s² calcule la velocidad angular y la aceleración
      angular de la placa.

