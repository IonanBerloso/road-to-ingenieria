        <desc id="ejma8-col812-d">Un disco de radio R rueda sin deslizar sobre una recta horizontal; su centro es O y su punto de contacto queda justo debajo. Una barra AB atraviesa el disco pasando por C y D, dos puntos diametralmente opuestos, de modo que la barra contiene siempre un diámetro y pasa por O. La barra baja hacia la derecha formando 30 grados con la horizontal y su extremo A es una deslizadera que recorre la recta, a dos R del centro medidos a lo largo de la barra. La figura está dibujada a escala.</desc>
        <defs>
          <marker id="ejma8-col812-fl" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
        </defs>
        <line x1="20" y1="240" x2="330" y2="240" stroke="var(--ink)" stroke-width="1.4"/>
        <path d="M30 240 L24 248 M50 240 L44 248 M70 240 L64 248 M90 240 L84 248 M110 240 L104 248 M130 240 L124 248 M150 240 L144 248 M170 240 L164 248 M190 240 L184 248 M210 240 L204 248 M230 240 L224 248 M250 240 L244 248 M270 240 L264 248 M290 240 L284 248 M310 240 L304 248 M330 240 L324 248" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <circle cx="170" cy="170" r="70" fill="var(--faint)" fill-opacity="0.12" stroke="var(--ink)" stroke-width="1.5"/>
        <line x1="24.5" y1="86" x2="291.2" y2="240" stroke="var(--ink)" stroke-width="3.2"/>
        <rect x="280" y="228" width="22" height="18" fill="var(--faint)" fill-opacity="0.3" stroke="var(--ink)" stroke-width="1.2"/>
        <circle cx="170" cy="170" r="2.8" fill="var(--ink)"/>
        <circle cx="109.4" cy="135" r="2.8" fill="var(--ink)"/>
        <circle cx="230.6" cy="205" r="2.8" fill="var(--ink)"/>
        <circle cx="291.2" cy="240" r="3.2" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
        <circle cx="170" cy="240" r="2.6" fill="var(--flag)"/>
        <path d="M132 138 A 48 48 0 0 1 196 128" fill="none" stroke="var(--flag)" stroke-width="1.5" marker-end="url(#ejma8-col812-fl)"/>
        <text x="150" y="112" font-size="9.5" fill="var(--flag)">ω</text>
        <text x="196" y="112" font-size="9" fill="var(--flag)">α = 2√3 ω²</text>
        <text x="176" y="166" font-size="10" fill="var(--ink)">O</text>
        <text x="102" y="130" font-size="10" text-anchor="end" fill="var(--ink)">C</text>
        <text x="236" y="200" font-size="10" fill="var(--ink)">D</text>
        <text x="296" y="230" font-size="10" fill="var(--ink)">A</text>
        <text x="18" y="82" font-size="10" text-anchor="end" fill="var(--ink)">B</text>
        <text x="130" y="200" font-size="9.5" fill="var(--ink)">1</text>
        <text x="60" y="118" font-size="9.5" fill="var(--ink)">2</text>
        <line x1="230" y1="240" x2="290" y2="240" stroke="var(--faint)" stroke-width="0.7" stroke-dasharray="3 3"/>
        <text x="256" y="226" font-size="9" fill="var(--faint)">30°</text>
        <line x1="188" y1="170" x2="188" y2="240" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="194" y="208" font-size="9" fill="var(--faint)">R</text>
        <text x="176" y="262" font-size="9" fill="var(--flag)">contacto</text>
      </svg>
      </figure>
    pide: La velocidad y la aceleración del punto A, en función de omega y R.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué la barra gira con la misma velocidad angular que el disco?
        opciones:
          - texto: >-
              Porque C y D son puntos materiales del disco, así que la barra
              lleva siempre la dirección de ese diámetro
            correcta: true
            mensaje: |
              Eso es. La barra está obligada a contener un diámetro que gira con
              el disco, así que su orientación es la de ese diámetro y
              $\omega_2 = \omega$. Lo que sí cambia es **por dónde** de la barra
              pasa el disco: hay deslizamiento a lo largo de ella.
          - texto: Porque la barra pasa por el centro O, y todo lo que pasa por O gira con el disco
            mensaje: |
              Pasar por el centro no basta: una recta puede pasar por $O$ y girar
              a otro ritmo, o no girar. Lo que fija la orientación es que los dos
              puntos por los que pasa sean **materiales** del disco.
          - texto: No giran igual, porque la barra desliza respecto del disco
            mensaje: |
              Hay deslizamiento, sí, pero **a lo largo** de la barra: el disco se
              desplaza sobre ella sin cambiar su orientación relativa. Los dos
              sólidos comparten velocidad angular y difieren en una traslación.

      - tipo: calcular
        titulo: La velocidad del punto A
        pregunta: |
          Escribiendo $v_A = k\,\omega R$, ¿cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.02
          formato: un número, el coeficiente que multiplica a omega por R
        distractores:
          - valor: '1'
            mensaje: |
              Ese es el módulo de $\vec{v}_O$, la velocidad del centro del disco.
              $A$ está en la barra, a $2R$ de $O$, y además la barra gira: su
              velocidad es tres veces mayor.
          - valor: '2'
            mensaje: |
              Parece que has hecho $\omega \cdot 2R$ con $AO = 2R$, tratando a
              $A$ como si girara alrededor de $O$ estando $O$ quieto. Pero $O$
              se mueve a $\omega R$, y hay que componer las dos cosas.
        pista: |
          Escribe $\vec{v}_O$ del disco que rueda, y luego $\vec{v}_O$ como punto
          de la barra más el deslizamiento a lo largo de ella; impón que
          $\vec{v}_A$ sea horizontal.
        desarrollo: |
          Con el contacto como CIR del disco, $\vec{v}_O = (-\omega R;\ 0)$.
          Visto desde la barra, $O$ desliza a lo largo de ella, así que
          $\vec{v}_O - \vec{v}_{O \in 2}$ tiene que ser paralelo a la barra.
          Imponiéndolo:

          $$
          v_A = 3\,\omega R
          \qquad
          |\vec{v}_{O/2}| = 2\sqrt{3}\,\omega R
          $$

      - tipo: calcular
        titulo: El deslizamiento del disco a lo largo de la barra
        pregunta: |
          Escribiendo $|\vec{v}_{O/2}| = k\,\omega R$, ¿cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '3.464'
          tolerancia: 0.02
          formato: un número, el coeficiente que multiplica a omega por R
        distractores:
          - valor: '3'
            mensaje: |
              Ese es el coeficiente de $v_A$, no el del deslizamiento. El vector
              relativo es $(-3;\ \sqrt{3})\,\omega R$, y su módulo es
              $\sqrt{9+3} = 2\sqrt{3}$.
          - valor: '1.732'
            mensaje: |
              Te has quedado con la componente $\sqrt{3}\,\omega R$. Falta
              componerla con la horizontal, que vale $3\,\omega R$.
        pista: |
          $\vec{v}_{O/2} = \vec{v}_O - \vec{v}_{O \in 2}$, y una vez conocido
          $v_A = 3\omega R$ los dos vectores están determinados.
        desarrollo: |
          $$
          \vec{v}_{O/2} = (-\omega R;\ 0) - \left(3\omega R - \omega R;\ -\sqrt{3}\omega R\right)
          = (-3\omega R;\ \sqrt{3}\,\omega R)
          $$

          de módulo $2\sqrt{3}\,\omega R = 3{,}464\,\omega R$, dirigido a lo
          largo de la barra.

      - tipo: calcular
        titulo: La aceleración del punto A
        pregunta: |
          Escribiendo $a_A = k\,\omega^{2}R$, ¿cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '24.249'
          tolerancia: 0.05
          formato: un número, el coeficiente que multiplica a omega cuadrado por R
        distractores:
          - valor: '3.464'
            mensaje: |
              Ese es $\alpha R = 2\sqrt{3}\,\omega^{2}R$, la aceleración del
              centro del disco. La de $A$ es siete veces mayor, porque se le
              suman la normal de la barra y, sobre todo, el término de Coriolis.
          - valor: '12.124'
            mensaje: |
              Te has quedado con la mitad, $7\sqrt{3}$. Repasa el reparto: el
              Coriolis vale $2\omega\,v_{O/2} = 4\sqrt{3}\,\omega^{2}R$ y entra
              con su signo en la proyección.
        pista: |
          $\vec{a}_O = -\alpha R\,\vec{\imath}$, porque el centro va en línea
          recta. Y en el campo relativo hay Coriolis:
          $2\,\vec{\omega}_2 \times \vec{v}_{O/2}$.
        desarrollo: |
          Proyectando sobre la perpendicular a la barra y despejando,

          $$
          a_A = 14\sqrt{3}\,\omega^{2}R = 24{,}25\,\omega^{2}R
          $$

          dirigida hacia la derecha, a lo largo de la recta.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $C$ y $D$ son materiales del disco, así que la barra contiene
              siempre ese diámetro y $\omega_2 = \omega$,
              $\alpha_2 = 2\sqrt{3}\,\omega^{2}$.
          - texto: >-
              El disco rueda sin deslizar, así que su CIR es el contacto y
              $v_O = \omega R$; imponiendo que $\vec{v}_A$ sea horizontal sale
              $v_A = 3\,\omega R$.
          - texto: >-
              En aceleraciones, $\vec{a}_O = \alpha R$ a lo largo de la recta, y
              con el término de Coriolis queda
              $a_A = 14\sqrt{3}\,\omega^{2}R$.
          - texto: >-
              El punto de contacto del disco con la recta tiene aceleración nula,
              porque es el centro instantáneo de rotación.
            trampa: true
            mensaje: |
              Tiene velocidad nula, no aceleración nula. La aceleración del CIR
              de un disco que rueda sobre una recta vale $\omega^{2}R$ y apunta
              **hacia el centro**: es la trampa clásica del tema, y por eso
              $\vec{a}_O$ se calcula derivando $v_O$, no con el CIR.
    resolucion: |
      **La barra gira con el disco.** $C$ y $D$ son dos puntos materiales
      diametralmente opuestos, así que la barra contiene siempre ese diámetro:

      $$
      \omega_2 = \omega
      \qquad
      \alpha_2 = 2\sqrt{3}\,\omega^{2}
      $$

      Lo que no comparten es la traslación: el disco desliza a lo largo de la
      barra.

      **La geometría.** El centro está a altura $R$ y la barra baja a
      $30^{\circ}$, así que desde $O$ hasta la recta hay
      $R/\operatorname{sen}30^{\circ} = 2R$ de barra: $AO = 2R$.

      **Velocidades.** El disco rueda sin deslizar, luego su CIR es el punto de
      contacto y $\vec{v}_O = (-\omega R;\ 0)$. Como $O$ desliza a lo largo de
      la barra, $\vec{v}_O - \vec{v}_{O \in 2}$ tiene que ser paralelo a ella, y
      eso fija

      $$
      v_A = 3\,\omega R
      \qquad
      |\vec{v}_{O/2}| = 2\sqrt{3}\,\omega R
      $$

      **Aceleraciones.** El centro recorre una recta, así que
      $\vec{a}_O = -\alpha R\,\vec{\imath} = -2\sqrt{3}\,\omega^{2}R\,\vec{\imath}$
      —sin componente normal—. Escribiendo $O$ como deslizadera sobre la barra,
      con sus cuatro términos —normal, tangencial, relativo y Coriolis—, la
      proyección perpendicular da

      $$
      2\,\omega\,v_{O/2} + \alpha\,AO - \alpha R\operatorname{sen}30^{\circ}
      - a_A\operatorname{sen}30^{\circ} = 0
      $$

      $$
      4\sqrt{3}\,\omega^{2}R + 4\sqrt{3}\,\omega^{2}R - \sqrt{3}\,\omega^{2}R
      = \frac{a_A}{2}
      \;\Longrightarrow\;
      a_A = 14\sqrt{3}\,\omega^{2}R
      $$

      que es el resultado que publica la colección.
  - id: ejma8-col813-los-dos-discos-y-la-chapa
    titulo: Dos discos en contacto con una chapa que bascula
    fuente: >-
      Ejercicio 8.13 · Tema 8, «Análisis del movimiento plano» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado y el
      profesor su resolución, contra los que está contrastado el desarrollo. El
      resultado es simbólico, así que las casillas piden el coeficiente que
      multiplica a la expresión indicada en cada pregunta.
    nivel: practica
    enunciado: |
      El mecanismo de la figura consta de un disco (1) de centro $E$ y radio $R$
      que gira alrededor del punto fijo $G$ con velocidad angular constante
      $\omega$ en sentido antihorario. Otro disco 2 igual gira alrededor del
      punto fijo $H$. Finalmente una chapa $OAB$ (3) gira alrededor de otro
      punto fijo $O$ siempre en contacto con ambos discos. Calcular:

      a) Velocidad angular del disco (2).

      b) Velocidad de deslizamiento en el contacto entre disco (2) y chapa (3).

      c) Aceleración angular del disco (2).

