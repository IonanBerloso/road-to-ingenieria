            <text x="155" y="84" font-size="10" text-anchor="middle" fill="var(--ink)" font-style="italic">v<tspan font-size="7.5" dy="2.5">2</tspan><tspan dy="-2.5"></tspan></text>
            <line x1="166.4" y1="90.5" x2="166.4" y2="117.4" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
            <text x="172" y="104" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">v<tspan font-size="7.5" dy="2.5">rel</tspan><tspan dy="-2.5"></tspan></text>
            <circle cx="90" cy="140" r="2.4" fill="var(--ink)"/>
            <text x="100" y="147" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">O</text>
            <circle cx="139.5" cy="90.5" r="2.4" fill="var(--ink)"/>
            <text x="126" y="86" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">A</text>
            <text x="121" y="126" font-size="9" text-anchor="start" fill="var(--faint)">1</text>
            <text x="200" y="132" font-size="9" text-anchor="start" fill="var(--faint)">2</text>
          </svg>

      - tipo: calcular
        titulo: La velocidad angular en unidades del SI
        pregunta: |
          ¿A cuántos rad/s equivalen 15 rpm?
        respuesta:
          tipo: numero
          valor: '1.5708'
          tolerancia: 0.002
          formato: un número, en rad/s (vale la forma exacta pi/2)
        distractores:
          - valor: '15'
            mensaje: |
              Eso son revoluciones por minuto, no radianes por segundo. Hay que
              multiplicar por $2\pi$ radianes por vuelta y dividir entre 60
              segundos por minuto.
          - valor: '94.25'
            mensaje: |
              Has multiplicado por $2\pi$ pero se te ha olvidado dividir entre
              los 60 segundos del minuto.
        pista: |
          $\omega = 15 \cdot \dfrac{2\pi}{60}$ rad/s.
        desarrollo: |
          $$
          \omega = \frac{15 \cdot 2\pi}{60} = \frac{\pi}{2} = 1{,}5708\ \text{rad/s}
          $$

          El periodo es $T = 2\pi/\omega = 4$ s.

      - tipo: calcular
        titulo: La velocidad máxima del émbolo
        pregunta: |
          ¿Cuánto vale la velocidad máxima del émbolo, en mm/s?
        respuesta:
          tipo: numero
          valor: '471.2'
          tolerancia: 0.5
          formato: un número, en mm/s
        distractores:
          - valor: '4500'
            mensaje: |
              Has usado $\omega = 15$ sin pasar de rpm a rad/s. El factor entre
              las dos es $2\pi/60 \approx 0{,}105$, y aquí cambia el resultado
              casi por diez.
          - valor: '235.6'
            mensaje: |
              Has usado 150 mm en vez de 300. El enunciado da la **longitud** de
              la pieza giratoria, que es el radio del giro de $A$, no un
              diámetro.
        pista: |
          $v(t) = \omega b\cos(\omega t)$, y el coseno vale como mucho 1.
        desarrollo: |
          $$
          v_{\max} = \omega b = \frac{\pi}{2}\cdot 300 = 471{,}2\ \text{mm/s}
          $$

      - tipo: calcular
        titulo: El instante en que se alcanza
        pregunta: |
          La colección responde con el primer instante **posterior** al origen
          de tiempos en que el émbolo vuelve a ir a la velocidad máxima.
          ¿Cuál es, en segundos?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.02
          formato: un número, en segundos
        distractores:
          - valor: '4'
            mensaje: |
              Ese es el periodo entero, cuando $A$ ha dado una vuelta completa.
              El émbolo pasa por $x = 0$ **dos** veces por vuelta, y en las dos
              va a la velocidad máxima.
          - valor: '1'
            mensaje: |
              Ese es un cuarto de vuelta, y ahí $x = b$ es máximo pero la
              velocidad es **nula**: es el punto muerto en el que el émbolo se
              para para volver.
        pista: |
          $\dfrac{dv}{dt} = -\omega^{2}b\operatorname{sen}(\omega t) = 0$ cuando
          $\omega t = \pi$.
        desarrollo: |
          $$
          -\omega^{2}b\operatorname{sen}(\omega t) = 0
          \;\Longrightarrow\;
          \omega t = \pi
          \;\Longrightarrow\;
          t = \frac{\pi}{\omega} = 2\ \text{s}
          $$

          En $t = 2$ s el émbolo pasa otra vez por $x = 0$, ahora hacia la
          izquierda, con $v = -471{,}2$ mm/s. En módulo es la misma velocidad
          que tenía en $t = 0$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La ranura vertical hace que el émbolo copie la abscisa del
              pasador: $x(t) = b\operatorname{sen}(\omega t)$, con
              $\omega = \pi/2$ rad/s.
          - texto: >-
              Derivando, $v(t) = \omega b\cos(\omega t)$, cuyo máximo en módulo
              es $\omega b = 471{,}2$ mm/s.
          - texto: >-
              Se alcanza cuando $\cos(\omega t) = \pm 1$, o sea al pasar por
              $x = 0$: en $t = 0$ y otra vez en $t = 2$ s.
          - texto: >-
              La velocidad del émbolo es máxima donde su desplazamiento $x$ es
              máximo, es decir en el extremo de la carrera.
            trampa: true
            mensaje: |
              Es justo al revés. En el extremo de la carrera el émbolo se para
              para invertir el sentido: ahí $v = 0$ y la aceleración es máxima.
              La velocidad máxima está en el centro, al pasar por $x = 0$.
    resolucion: |
      **1. Esquema de velocidades.** Es un problema de cinemática con una
      corredera: el dibujo lleva el mecanismo en una posición cualquiera, con
      la velocidad de A y sus dos componentes.

      <figure class="figura-examen">
