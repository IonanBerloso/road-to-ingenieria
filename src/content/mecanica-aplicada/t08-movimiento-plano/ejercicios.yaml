        de centro C y radio R. Su velocidad relativa es tangente al aro,
        vertical, porque el radio CA es horizontal.

      Con $O_1$ en el origen, x hacia la derecha e y hacia arriba:
      $A = (R;\ R)$, $C = (2R;\ R)$ y $O_2 = (2R;\ 0)$, con
      $\overrightarrow{O_1A} = (R;\ R)$ y $\overrightarrow{O_2A} = (-R;\ R)$.

      **2. Incógnitas.** $\omega_2$ y $v_{A/2}$; $\alpha_2$ y la tangencial
      relativa, $a_t$.

      **3. Ecuaciones.** A con la barra y, por composición, con el aro:

      $$
      \vec{v}_A = \vec{\omega}_1\times\overrightarrow{O_1A}
      = \omega_2\vec{k}\times\overrightarrow{O_2A} + v_{A/2}\,\vec{j}
      $$

      $$
      \vec{\alpha}_1\times\overrightarrow{O_1A} - \omega^{2}\,\overrightarrow{O_1A}
      = \alpha_2\vec{k}\times\overrightarrow{O_2A} - \omega_2^{2}\,\overrightarrow{O_2A}
      + a_t\,\vec{j} + \frac{v_{A/2}^{2}}{R}\,\vec{i} + 2\,\omega_2\vec{k}\times v_{A/2}\,\vec{j}
      $$

      con $\vec{\omega}_1 = -\omega\,\vec{k}$ y
      $\vec{\alpha}_1 = \omega^{2}\,\vec{k}$. La aceleración relativa tiene dos
      partes, porque respecto del aro A recorre una circunferencia: la
      tangencial, vertical, y la normal, $v_{A/2}^{2}/R$, hacia C, que aquí es
      $\vec{i}$.

      **4. Resultados.** Con
      $\vec{v}_A = -\omega\vec{k}\times(R;\ R) = (\omega R;\ -\omega R)$ y
      $\omega_2\vec{k}\times\overrightarrow{O_2A} = \omega_2\,(-R;\ -R)$:

      $$
      (\omega R;\ -\omega R) = (-R\,\omega_2;\ -R\,\omega_2 + v_{A/2})
      $$

      La horizontal da $\omega_2$, y la vertical, $v_{A/2}$:

      $$
      \vec{\omega}_2 = -\omega\,\vec{k},
      \qquad
      \vec{v}_{A/2} = -2\omega R\,\vec{j}
      $$

      En aceleraciones:
      $\vec{a}_A = \omega^{2}(-R;\ R) - \omega^{2}(R;\ R) = (-2\omega^{2}R;\ 0)$;
      el arrastre,
      $\alpha_2\,(-R;\ -R) - \omega^{2}(-R;\ R) = (-R\,\alpha_2 + \omega^{2}R;\ -R\,\alpha_2 - \omega^{2}R)$;
      la normal relativa, $4\omega^{2}R\,\vec{i}$; y el Coriolis,
      $-2\omega\vec{k}\times(-2\omega R\,\vec{j}) = -4\omega^{2}R\,\vec{i}$:

      $$
      (-2\omega^{2}R;\ 0) = (-R\,\alpha_2 + \omega^{2}R + 4\omega^{2}R - 4\omega^{2}R;\ -R\,\alpha_2 - \omega^{2}R + a_t)
      $$

      $$
      \vec{\alpha}_2 = 3\,\omega^{2}\,\vec{k},
      \qquad
      a_t = 4\omega^{2}R
      $$

      <figure class="figura-examen">
      <svg viewBox="6 40 226 154" role="img" width="339" height="231" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">Los términos relativos de la aceleración de la corredera</title>
        <desc id="dsl-d">El mismo aro, con la corredera A en su punto más a la izquierda. En A, los tres términos relativos de su aceleración, iguales: la normal relativa, horizontal, hacia el centro C; el término de Coriolis, horizontal, hacia la izquierda; y la tangencial relativa, vertical, hacia arriba. El aro gira en sentido horario.</desc>
