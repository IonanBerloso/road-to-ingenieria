        <line x1="281.8" y1="8" x2="281.8" y2="72" stroke="var(--ink)" stroke-width="1.5"/>
        <path d="M284 14 L291 8 M284 30 L291 24 M284 46 L291 40 M284 62 L291 56" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <circle cx="85" cy="215" r="2.8" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/>
        <circle cx="261.8" cy="38.2" r="2.8" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/>
        <circle cx="271.8" cy="38.2" r="2.2" fill="var(--ink)"/>
        <line x1="271.8" y1="52" x2="271.8" y2="84" stroke="var(--d2)" stroke-width="2" marker-end="url(#ejma8-col87-fl)"/>
        <text x="277" y="80" font-size="9" fill="var(--d2-tinta)">vB = 0,2 m/s cte</text>
        <text x="72" y="212" font-size="10" text-anchor="end" fill="var(--ink)">C</text>
        <text x="252" y="34" font-size="10" text-anchor="end" fill="var(--ink)">D</text>
        <text x="276" y="34" font-size="10" fill="var(--ink)">B</text>
        <text x="60" y="238" font-size="9.5" fill="var(--ink)">1</text>
        <text x="182" y="130" font-size="9.5" fill="var(--ink)">2</text>
        <text x="266" y="20" font-size="9.5" fill="var(--ink)">3</text>
        <line x1="85" y1="215" x2="155" y2="215" stroke="var(--faint)" stroke-width="0.7" stroke-dasharray="3 3"/>
        <text x="110" y="208" font-size="9" fill="var(--faint)">45°</text>
        <line x1="60" y1="230" x2="130" y2="230" stroke="var(--faint)" stroke-width="0.7" stroke-dasharray="3 3"/>
        <text x="98" y="245" font-size="9" fill="var(--faint)">30°</text>
        <line x1="66" y1="196" x2="242" y2="20" stroke="var(--faint)" stroke-width="0.8" stroke-dasharray="4 3"/>
        <text x="140" y="98" font-size="9" text-anchor="middle" fill="var(--faint)">5 m</text>
        <text x="26" y="253" font-size="9" fill="var(--faint)">R1 = 0,3 m</text>
        <text x="286" y="100" font-size="9" fill="var(--faint)">R3 = 0,2 m</text>
