      <figcaption>

      Sin escala. La barra contiene el diámetro CD y gira con el disco. O se mueve en horizontal, y respecto de la barra solo puede correr a lo largo de ella; A, por la recta. Los sentidos de la velocidad de A y del deslizamiento los dirá el cálculo. Ejes: x hacia la derecha, y hacia arriba; giros positivos en sentido antihorario.

      </figcaption>
      </figure>

      - **El disco** rueda sin deslizar sobre la recta, en sentido
        antihorario: O va hacia la izquierda, a $\omega R$.
      - **La barra** contiene siempre el diámetro CD, que gira con el disco:
        gira con él, con $\omega_2 = \omega$ y
        $\alpha_2 = \alpha = 2\sqrt{3}\,\omega^{2}$, antihorarias.
      - **O**, visto desde la barra, solo puede correr a lo largo de ella; y
        **A**, la deslizadera, solo por la recta.

      Con el contacto en el origen, x hacia la derecha e y hacia arriba:
      $O = (0;\ R)$; la barra baja a 30° desde O y llega a la recta a
      $R/\sin 30^\circ = 2R$, en $A = (\sqrt{3}R;\ 0)$, con
      $\overrightarrow{AO} = (-\sqrt{3}R;\ R)$. El unitario de la barra, de O
      hacia A, $\vec{e} = (\cos 30^\circ;\ -\sin 30^\circ)$.

      **2. Incógnitas.** $v_A$ y $a_A$, y el deslizamiento de O sobre la
      barra, $\vec{v}_{O/2} = \lambda\,\vec{e}$ y
      $\vec{a}_{O/2} = \mu\,\vec{e}$.

      **3. Ecuaciones.** El disco rueda sin deslizar sobre la recta y su
      centro va en línea recta:

      $$
      \vec{v}_O = -\omega R\,\vec{i},
      \qquad
      \vec{a}_O = -\alpha R\,\vec{i}
      $$

      Y O desde la barra, por composición, con A como punto de la barra:

      $$
      \vec{v}_O = v_A\,\vec{i} + \omega\vec{k}\times\overrightarrow{AO} + \lambda\,\vec{e}
      $$

      $$
      \vec{a}_O = a_A\,\vec{i} + \alpha\vec{k}\times\overrightarrow{AO} - \omega^{2}\,\overrightarrow{AO}
      + \mu\,\vec{e} + 2\,\omega\vec{k}\times\lambda\,\vec{e}
      $$

      **4. Resultados.** Con $\vec{k}\times\overrightarrow{AO} = (-R;\ -\sqrt{3}R)$:

      $$
      (-\omega R;\ 0) = \left(v_A - \omega R + \tfrac{\sqrt{3}}{2}\lambda;\ -\sqrt{3}\,\omega R - \tfrac{1}{2}\lambda\right)
      $$

      La vertical da $\lambda = -2\sqrt{3}\,\omega R$, y la horizontal,
      $v_A$:

      $$
      \vec{v}_A = 3\,\omega R\,\vec{i},
      \qquad
      \vec{v}_{O/2} = -2\sqrt{3}\,\omega R\,\vec{e} = (-3\,\omega R;\ \sqrt{3}\,\omega R)
      $$

      En aceleraciones, con $\alpha = 2\sqrt{3}\,\omega^{2}$:
      $\alpha\vec{k}\times\overrightarrow{AO} = (-2\sqrt{3};\ -6)\,\omega^{2}R$,
      $-\omega^{2}\,\overrightarrow{AO} = (\sqrt{3};\ -1)\,\omega^{2}R$ y el
      Coriolis,
      $2\,\omega\lambda\,\vec{k}\times\vec{e} = -4\sqrt{3}\,\omega^{2}R\,(\tfrac{1}{2};\ \tfrac{\sqrt{3}}{2}) = (-2\sqrt{3};\ -6)\,\omega^{2}R$:

      $$
      (-2\sqrt{3};\ 0)\,\omega^{2}R
      = \left(a_A - 3\sqrt{3}\,\omega^{2}R + \tfrac{\sqrt{3}}{2}\mu;\ -13\,\omega^{2}R - \tfrac{1}{2}\mu\right)
      $$

      La vertical da $\mu = -26\,\omega^{2}R$, y la horizontal, $a_A$:

      $$
      \vec{a}_A = 14\sqrt{3}\,\omega^{2}R\,\vec{i} = 24{,}25\,\omega^{2}R\,\vec{i},
      \qquad
      \vec{a}_{O/2} = -26\,\omega^{2}R\,\vec{e}
      $$

      **A va hacia la derecha a $3\,\omega R$ y acelera
      $14\sqrt{3}\,\omega^{2}R \approx 24{,}25\,\omega^{2}R$, también hacia
      la derecha.** Los dos coinciden con los que publica la colección.

      **5. Comprobación.** Por la geometría, sin composición de movimientos.
      Con $\theta$ el ángulo de la barra bajo la horizontal, A está en la
      recta, a $R\cot\theta$ de la vertical de O:
      $x_A = x_O + R\cot\theta$. La barra gira con el disco en sentido
      antihorario, que la acerca a la horizontal: $\dot{\theta} = -\omega$ y
      $\ddot{\theta} = -\alpha$; y $\dot{x}_O = -\omega R$,
      $\ddot{x}_O = -\alpha R$. Derivando dos veces, en $\theta = 30^\circ$,
      con $1/\sin^{2}\theta = 4$ y $\cot\theta = \sqrt{3}$:

      $$
      \dot{x}_A = \dot{x}_O - \frac{R\,\dot{\theta}}{\sin^{2}\theta} = -\omega R + 4\,\omega R = 3\,\omega R
      $$

      $$
      \ddot{x}_A = \ddot{x}_O + \frac{2R\cos\theta}{\sin^{3}\theta}\,\dot{\theta}^{2} - \frac{R\,\ddot{\theta}}{\sin^{2}\theta}
      = -\alpha R + 8\sqrt{3}\,\omega^{2}R + 4\alpha R = 14\sqrt{3}\,\omega^{2}R
      $$

      Lo mismo.

      **Lo que dice el resultado.** A va hacia la derecha aunque el disco
      avance hacia la izquierda: al rodar, el disco endereza la barra, y el
      punto donde la barra corta la recta se aleja deprisa. Su aceleración es
      siete veces la del centro del disco: además de la aceleración angular
      cuentan la normal de la barra y, sobre todo, el Coriolis del
      deslizamiento. Y el contacto del disco con la recta, que es su CIR, no
      tiene aceleración nula: por eso $\vec{a}_O$ se toma de que O va en
      línea recta, y no del CIR.

  - id: ejma8-col813-los-dos-discos-y-la-chapa
    titulo: Dos discos en contacto con una chapa que bascula
    fuente: >-
      Ejercicio 8.13 · Tema 8, «Análisis del movimiento plano» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado y el
      profesor su resolución, contra los que está contrastado el desarrollo. El
      resultado es simbólico, así que las casillas piden el coeficiente que
      multiplica a la expresión indicada en cada pregunta.
    nivel: practica
    antes:
      idea: |
        Cada sólido gira alrededor de un punto fijo: la velocidad de cada uno
        de sus puntos es perpendicular a la recta que lo une con ese punto
        fijo, y proporcional a su distancia. Para las aceleraciones, un punto
        visto desde un sólido que gira tiene el arrastre, el relativo y el
        término de Coriolis.
      formula: |
        Un sólido que gira alrededor de un punto fijo Q:

        $$
        \vec{v}_P = \vec{\omega}\times\overrightarrow{QP},
        \qquad
        \vec{a}_P = \vec{\alpha}\times\overrightarrow{QP} - \omega^{2}\,\overrightarrow{QP}
        $$

        Y la composición de aceleraciones respecto de un sólido 3 que gira:

        $$
        \vec{a}_P = \vec{a}_{P \in 3} + \vec{a}_{P/3} + 2\,\vec{\omega}_3\times\vec{v}_{P/3}
        $$
      reconocer: |
        Antes de calcular se mira cómo se mueve cada uno de los tres sólidos.
    enunciado: |
      El mecanismo de la figura consta de un disco (1) de centro $E$ y radio $R$
      que gira alrededor del punto fijo $G$ con velocidad angular constante
      $\omega$ en sentido antihorario. Otro disco 2 igual gira alrededor del
      punto fijo $H$. Finalmente una chapa $OAB$ (3) gira alrededor de otro
      punto fijo $O$ siempre en contacto con ambos discos. Calcular:

      a) Velocidad angular del disco (2).

      b) Velocidad de deslizamiento en el contacto entre disco (2) y chapa (3).

      c) Aceleración angular del disco (2).

