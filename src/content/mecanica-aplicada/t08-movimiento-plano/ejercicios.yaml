      </svg>
      <figcaption>

      Solo las direcciones, sin escala. La velocidad de A, dibujada junto a A para que no la tape la barra 1, es perpendicular a OA; la de B, perpendicular a CB. Las dos perpendiculares, la recta OA y la barra 2, son paralelas. Ejes: x hacia la derecha, y hacia arriba; giros positivos en sentido antihorario.

      </figcaption>
      </figure>

      - **El disco** gira alrededor de O a $\omega_0$, constante, en sentido
        horario, como en la figura del enunciado.
      - **A**, del disco, con OA horizontal: su velocidad es vertical, hacia
        abajo, y vale $\omega_0 R$.
      - **B** gira con la barra 2 alrededor del punto fijo C, con CB
        horizontal: su velocidad también es vertical.
      - **La barra 1** es vertical y sus dos extremos van en vertical: no
        gira en este instante, se traslada. Las perpendiculares a las dos
        velocidades, la recta OA y la barra 2, son paralelas: el CIR de la
        barra 1 está en el infinito.

      Con O en el origen, x hacia la derecha e y hacia arriba:
      $A = (R;\ 0)$, $B = (R;\ -R)$, $C = (3R;\ -R)$,
      $\overrightarrow{OA} = R\,\vec{i}$, $\overrightarrow{AB} = -R\,\vec{j}$ y
      $\overrightarrow{CB} = -2R\,\vec{i}$. El disco, $-\omega_0\,\vec{k}$.

      **2. Incógnitas.** $\omega_1$, $\omega_2$, $\alpha_1$, $\alpha_2$,
      $\vec{a}_{G1}$ y $\vec{a}_{G2}$.

      **3. Ecuaciones.** La velocidad de B, desde la barra 1 y desde la barra
      2:

      $$
      \vec{v}_A + \omega_1\vec{k}\times\overrightarrow{AB}
      = \omega_2\vec{k}\times\overrightarrow{CB},
      \qquad
      \vec{v}_A = -\omega_0\vec{k}\times\overrightarrow{OA} = -\omega_0 R\,\vec{j}
      $$

      Y la aceleración de B, igual; la de A es solo normal, porque
      $\omega_0$ es constante:

      $$
      \vec{a}_A + \alpha_1\vec{k}\times\overrightarrow{AB} - \omega_1^{2}\,\overrightarrow{AB}
      = \alpha_2\vec{k}\times\overrightarrow{CB} - \omega_2^{2}\,\overrightarrow{CB},
      \qquad
      \vec{a}_A = -\omega_0^{2}\,\overrightarrow{OA}
      $$

      Los centros de gravedad, cada uno en el punto medio de su barra:

      $$
      \vec{a}_{G1} = \vec{a}_A + \alpha_1\vec{k}\times\frac{\overrightarrow{AB}}{2} - \omega_1^{2}\,\frac{\overrightarrow{AB}}{2},
      \qquad
      \vec{a}_{G2} = \alpha_2\vec{k}\times\frac{\overrightarrow{CB}}{2} - \omega_2^{2}\,\frac{\overrightarrow{CB}}{2}
      $$

      **4. Resultados.** En velocidades,
      $-\omega_0 R\,\vec{j} + \omega_1 R\,\vec{i} = -2R\omega_2\,\vec{j}$:

      $$
      \vec{\omega}_1 = \vec{0},
      \qquad
      \vec{\omega}_2 = \frac{\omega_0}{2}\,\vec{k}
      $$

      En aceleraciones,
      $-\omega_0^{2}R\,\vec{i} + \alpha_1 R\,\vec{i} = -2R\alpha_2\,\vec{j} + \tfrac{1}{2}\omega_0^{2}R\,\vec{i}$:

      $$
      \vec{\alpha}_1 = \frac{3}{2}\,\omega_0^{2}\,\vec{k},
      \qquad
      \vec{\alpha}_2 = \vec{0}
      $$

      $$
      \vec{a}_{G1} = -\omega_0^{2}R\,\vec{i} + \frac{3}{4}\,\omega_0^{2}R\,\vec{i} = -\frac{1}{4}\,\omega_0^{2}R\,\vec{i},
      \qquad
      \vec{a}_{G2} = \frac{1}{4}\,\omega_0^{2}R\,\vec{i}
      $$

      **La barra 2 gira a la mitad que el disco y en sentido contrario; la
      barra 1 no gira, pero tiene $\alpha_1 = 1{,}5\,\omega_0^{2}$,
      antihoraria; y los dos centros de gravedad aceleran
      $\tfrac{1}{4}\,\omega_0^{2}R$**, G1 hacia la izquierda y G2 hacia la
      derecha.

      **5. Comprobación.** Derivando las posiciones, sin los campos. Con
      $\theta$ el ángulo de OA, $\dot\theta = -\omega_0$, y $\psi$ el que
      sube B por su circunferencia alrededor de C,
      $A = R\,(\cos\theta;\ \sin\theta)$ y
      $B = C + 2R\,(-\cos\psi;\ \sin\psi)$. El vector
      $\overrightarrow{AB} = B - A$ tiene longitud fija, R, así que es
      perpendicular a su derivada. En el instante, con $\theta = \psi = 0$:

      $$
      \frac{d\overrightarrow{AB}}{dt} = \left(0;\ 2R\dot\psi + R\omega_0\right)
      \perp (0;\ -R)
      \;\Longrightarrow\;
      \dot\psi = -\frac{\omega_0}{2},
      \qquad
      \frac{d\overrightarrow{AB}}{dt} = \vec{0}
      $$

      La barra 1 no gira, y la 2 gira a $-\dot\psi = \omega_0/2$,
      antihoraria. Derivando otra vez, con $\ddot\theta = 0$:

      $$
      \frac{d^{2}\overrightarrow{AB}}{dt^{2}} = \left(2R\dot\psi^{2} + R\omega_0^{2};\ 2R\ddot\psi\right)
      = \left(\tfrac{3}{2}\,\omega_0^{2}R;\ 2R\ddot\psi\right)
      $$

      Con la derivada primera nula, la segunda también es perpendicular a
      $\overrightarrow{AB}$: $\ddot\psi = 0$, y la barra 2 no tiene
      aceleración angular. Lo que queda,
      $\tfrac{3}{2}\,\omega_0^{2}R\,\vec{i}$, es el giro que empieza la barra
      1, $\alpha_1\vec{k}\times(-R\,\vec{j}) = \alpha_1 R\,\vec{i}$:
      $\alpha_1 = \tfrac{3}{2}\,\omega_0^{2}$. Y G1, en
      $A + \tfrac{1}{2}\overrightarrow{AB}$, acelera
      $-\omega_0^{2}R\,\vec{i} + \tfrac{3}{4}\,\omega_0^{2}R\,\vec{i}$. Lo mismo.

      **Lo que dice el resultado.** Que una barra no gire en un instante no
      quiere decir que no vaya a girar: la barra 1 se traslada ahora, pero
      su aceleración angular es la mayor del mecanismo. Un instante después,
      A y B dejan de ir en paralelo y la barra empieza a girar. Los dos
      centros de gravedad aceleran lo mismo, en sentidos opuestos.

  - id: ejma8-col82-la-aceleracion-de-d-y-de-e
    titulo: La aceleración de dos puntos de una escuadra articulada
    fuente: >-
      Ejercicio 8.2 · Tema 8, «Análisis del movimiento plano» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado y el
      profesor su resolución, contra los que está contrastado el desarrollo.
    nivel: practica
    antes:
      idea: |
        Cada barra del mecanismo es un sólido rígido con su velocidad angular
        y su aceleración angular. Una articulación pertenece a las dos barras
        que une: su velocidad y su aceleración son las mismas calculadas
        desde cualquiera de ellas. Una barra que gira alrededor de un punto
        fijo da directamente la velocidad y la aceleración de su otro
        extremo.
      formula: |
        Los campos de velocidades y de aceleraciones del sólido rígido en el
        plano, con A un punto conocido:

        $$
        \vec{v}_P = \vec{v}_A + \vec{\omega}\times\overrightarrow{AP},
        \qquad
        \vec{a}_P = \vec{a}_A + \vec{\alpha}\times\overrightarrow{AP} - \omega^{2}\,\overrightarrow{AP}
        $$
      reconocer: |
        Antes de calcular se mira la dirección de la velocidad de cada
        articulación y la de la barra que las une.
    enunciado: |
      El instante mostrado en la figura la barra $AB$ tiene una velocidad
      angular constante de 6 rad/s en el sentido de las agujas del reloj.
      Determinar:

      a) Aceleración del punto $D$.

      b) Aceleración angular de la barra $BDE$.

      c) Aceleración del punto $E$.

