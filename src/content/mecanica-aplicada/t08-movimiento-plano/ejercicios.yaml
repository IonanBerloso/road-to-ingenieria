        <text x="30" y="200" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">A</text>
        <circle cx="40" cy="155" r="2.4" fill="var(--ink)"/>
        <text x="30" y="152" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">B</text>
        <circle cx="152.5" cy="200" r="2.4" fill="var(--ink)"/>
        <text x="140" y="200" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">C</text>
        <circle cx="152.5" cy="110" r="2.4" fill="var(--ink)"/>
        <text x="146" y="104" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">D</text>
        <circle cx="265" cy="65" r="2.4" fill="var(--ink)"/>
        <text x="272" y="64" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">E</text>
      </svg>
      <figcaption>

      Solo las direcciones, sin escala. Las perpendiculares a las velocidades de B y de D son las propias barras AB y CD, prolongadas a trazos: son paralelas y no se cortan. Ejes: x hacia la derecha, y hacia arriba; giros positivos en sentido antihorario.

      </figcaption>
      </figure>

      - **AB** gira alrededor de A a 6 rad/s, constante, en sentido horario:
        B, por encima de A, va hacia la derecha, a $6\cdot 0{,}09 = 0{,}54$
        m/s.
      - **CD** gira alrededor del punto fijo C, con CD vertical: D va en
        horizontal.
      - **BDE** tiene sus dos articulaciones con velocidad horizontal y BD
        inclinada: no gira en este instante, se traslada. Las
        perpendiculares a las dos velocidades, las barras AB y CD, son
        paralelas: su CIR está en el infinito.

      Con A en el origen, x hacia la derecha e y hacia arriba, en metros:
      $B = (0;\ 0{,}09)$, $C = (0{,}225;\ 0)$, $D = (0{,}225;\ 0{,}18)$ y
      $E = (0{,}45;\ 0{,}27)$; $\overrightarrow{BD} = (0{,}225;\ 0{,}09)$,
      $\overrightarrow{BE} = 2\,\overrightarrow{BD}$ y
      $\overrightarrow{CD} = 0{,}18\,\vec{j}$. El giro de AB,
      $-6\,\vec{k}$ rad/s.

      **2. Incógnitas.** $\omega_{BDE}$, $\omega_{CD}$, $\alpha_{BDE}$,
      $\alpha_{CD}$, $\vec{a}_D$ y $\vec{a}_E$.

      **3. Ecuaciones.** La velocidad de D, desde B y desde C:

      $$
      \vec{v}_B + \omega_{BDE}\vec{k}\times\overrightarrow{BD}
      = \omega_{CD}\vec{k}\times\overrightarrow{CD},
      \qquad
      \vec{v}_B = -6\vec{k}\times\overrightarrow{AB} = 0{,}54\,\vec{i}\ \text{m/s}
      $$

      La aceleración de D, igual; la de B es solo normal, porque AB gira a
      velocidad constante:

      $$
      \vec{a}_B + \alpha_{BDE}\vec{k}\times\overrightarrow{BD} - \omega_{BDE}^{2}\,\overrightarrow{BD}
      = \alpha_{CD}\vec{k}\times\overrightarrow{CD} - \omega_{CD}^{2}\,\overrightarrow{CD},
      \qquad
      \vec{a}_B = -6^{2}\,\overrightarrow{AB} = -3{,}24\,\vec{j}\ \text{m/s}^{2}
      $$

      Y la de E, desde B:
      $\vec{a}_E = \vec{a}_B + \alpha_{BDE}\vec{k}\times\overrightarrow{BE} - \omega_{BDE}^{2}\,\overrightarrow{BE}$.

      **4. Resultados.** En velocidades,
      $0{,}54\,\vec{i} + \omega_{BDE}\,(-0{,}09\,\vec{i} + 0{,}225\,\vec{j}) = -0{,}18\,\omega_{CD}\,\vec{i}$:
      la vertical da $\omega_{BDE} = 0$ y la horizontal,
      $\omega_{CD} = -3$ rad/s.

      $$
      \vec{\omega}_{BDE} = \vec{0},
      \qquad
      \vec{\omega}_{CD} = -3\,\vec{k}\ \text{rad/s}
      $$

      En aceleraciones, con
      $\omega_{CD}^{2}\,\overrightarrow{CD} = 1{,}62\,\vec{j}$:
      $-3{,}24\,\vec{j} + \alpha_{BDE}\,(-0{,}09\,\vec{i} + 0{,}225\,\vec{j}) = -0{,}18\,\alpha_{CD}\,\vec{i} - 1{,}62\,\vec{j}$.
      La vertical da $0{,}225\,\alpha_{BDE} = 1{,}62$ y la horizontal,
      $0{,}09\,\alpha_{BDE} = 0{,}18\,\alpha_{CD}$:

      $$
      \vec{\alpha}_{BDE} = 7{,}2\,\vec{k}\ \text{rad/s}^{2},
      \qquad
      \vec{\alpha}_{CD} = 3{,}6\,\vec{k}\ \text{rad/s}^{2}
      $$

      $$
      \vec{a}_D = -0{,}648\,\vec{i} - 1{,}62\,\vec{j}\ \text{m/s}^{2},
      \qquad
      \vec{a}_E = -3{,}24\,\vec{j} + 7{,}2\,(-0{,}18\,\vec{i} + 0{,}45\,\vec{j})
      = -1{,}296\,\vec{i}\ \text{m/s}^{2}
      $$

      **$a_D = 1{,}74$ m/s², $\alpha_{BDE} = 7{,}2$ rad/s² antihoraria y
      $a_E = 1{,}296$ m/s², horizontal y hacia la izquierda.** Los tres
      coinciden con los que publica la colección.

      **5. Comprobación.** Derivando las posiciones, sin los campos. Con
      $\theta_1$ el ángulo de AB con la vertical y $\theta_3$ el de CD,
      los dos medidos en sentido horario, $\dot\theta_1 = 6$ rad/s y
      $\ddot\theta_1 = 0$:
      $B = 0{,}09\,(\sin\theta_1;\ \cos\theta_1)$ y
      $D = C + 0{,}18\,(\sin\theta_3;\ \cos\theta_3)$. El vector
      $\overrightarrow{BD}$ tiene longitud fija, así que es perpendicular a
      su derivada; en el instante, con $\theta_1 = \theta_3 = 0$:

      $$
      \frac{d\overrightarrow{BD}}{dt} = \left(0{,}18\,\dot\theta_3 - 0{,}54;\ 0\right)
      \perp (0{,}225;\ 0{,}09)
      \;\Longrightarrow\;
      \dot\theta_3 = 3\ \text{rad/s},
      \qquad
      \frac{d\overrightarrow{BD}}{dt} = \vec{0}
      $$

      CD gira a 3 rad/s en sentido horario y BDE no gira. Derivando otra
      vez:

      $$
      \frac{d^{2}\overrightarrow{BD}}{dt^{2}}
      = \left(0{,}18\,\ddot\theta_3;\ -0{,}18\,\dot\theta_3^{2} + 0{,}09\,\dot\theta_1^{2}\right)
      = \left(0{,}18\,\ddot\theta_3;\ 1{,}62\right)
      $$

      Con la derivada primera nula, la segunda también es perpendicular a
      $\overrightarrow{BD}$: $0{,}225\cdot 0{,}18\,\ddot\theta_3 + 0{,}09\cdot 1{,}62 = 0$,
      $\ddot\theta_3 = -3{,}6$ rad/s², que en sentido horario es
      $\alpha_{CD} = 3{,}6$ rad/s² antihoraria. Queda
      $(-0{,}648;\ 1{,}62)$, que es el giro que empieza BDE,
      $\alpha_{BDE}\vec{k}\times\overrightarrow{BD} = \alpha_{BDE}\,(-0{,}09;\ 0{,}225)$:
      $\alpha_{BDE} = 7{,}2$ rad/s² por las dos componentes. Y E, en
      $B + 2\,\overrightarrow{BD}$, acelera
      $(0;\ -3{,}24) + 2\,(-0{,}648;\ 1{,}62) = (-1{,}296;\ 0)$. Lo mismo.

      **Lo que dice el resultado.** BDE se traslada en este instante, pero
      sus puntos no aceleran igual: D y E van a la misma velocidad, 0,54
      m/s, y aceleran 1,74 y 1,296 m/s². En E, el giro que empieza BDE
      cancela justo la aceleración vertical de B, y queda solo horizontal.

  - id: ejma8-col83-las-angulares-de-bc-y-de-cd
    titulo: Velocidad y aceleración angular de dos barras en cadena
    fuente: >-
      Ejercicio 8.3 · Tema 8, «Análisis del movimiento plano» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      pero su valor de la aceleración angular de BC no sale de los datos de la
      figura: el desarrollo publica el que sí sale, 123,73 rad/s², que es
      además el que da la resolución del profesor.
    nivel: practica
    antes:
      idea: |
        Cada barra del mecanismo es un sólido rígido con su propia velocidad
        angular y su propia aceleración angular. En cada barra, conocidos la
        velocidad y la aceleración de un punto, y su giro, salen las de
        cualquier otro punto de la misma barra.
      formula: |
        Los campos de velocidades y de aceleraciones del sólido rígido en el
        plano, con A un punto conocido:

        $$
        \vec{v}_P = \vec{v}_A + \vec{\omega}\times\overrightarrow{AP},
        \qquad
        \vec{a}_P = \vec{a}_A + \vec{\alpha}\times\overrightarrow{AP} - \omega^{2}\,\overrightarrow{AP}
        $$

        Para una barra que gira alrededor de un punto fijo, A es ese punto,
        con $\vec{v}_A = \vec{a}_A = \vec{0}$.
      reconocer: |
        Antes de calcular se mira qué se sabe del movimiento de cada
        articulación.
    enunciado: |
      Sabiendo que en el instante representado la barra $AB$ tiene velocidad
      angular constante en sentido horario de 4 rad/s, hallar la velocidad
      angular y la aceleración angular:

      a) De la barra $BC$.

      b) De la barra $CD$.

