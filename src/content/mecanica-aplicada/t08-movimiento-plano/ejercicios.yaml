        <desc id="ejma8-col87-d">Un plano inclinado fijo que desciende hacia la derecha formando 30 grados con la horizontal. Sobre él rueda sin deslizar el disco 1, de radio 0,3 metros, cuyo centro es C. De C arranca la barra 2, de 5 metros, que sube hacia la derecha formando 45 grados con la horizontal hasta el punto D. D es un punto de la rueda dentada 3, de radio 0,2 metros, que rueda sobre una cremallera vertical fija situada a su derecha; el centro de esa rueda es B y baja a 0,2 metros por segundo constantes. La figura está dibujada a escala, y por eso los dos discos salen pequeños al lado de una barra de 5 metros.</desc>
