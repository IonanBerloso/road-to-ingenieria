    pide: Las velocidades relativas de C y de D respecto de la barra, la aceleración relativa de D y las dos aceleraciones angulares.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado dice que el CIR del disco está en $A$. ¿Qué significa eso
          exactamente?
        opciones:
          - texto: >-
              Que la velocidad de cada punto del disco vale omega dos por su
              distancia a A, y en particular que vC vale v
            correcta: true
            mensaje: |
              Eso es. $C$ está a $2R$ de $A$, así que
              $v_C = \frac{v}{2R}\cdot 2R = v$, horizontal, que es justo el dato
              del enunciado. El CIR es la llave que hace consistente todo lo
              demás.
          - texto: Que A es un punto fijo del plano y no se mueve nunca
            mensaje: |
              El CIR tiene velocidad nula **en este instante**, y además va
              cambiando de sitio. $A$ es el extremo de una barra que gira
              alrededor de $O$: dentro de un instante estará en otro punto.
          - texto: Que el disco rueda sin deslizar sobre el suelo
            mensaje: |
              Justo lo contrario. Si rodara sin deslizar, el CIR sería el punto
              de contacto con el suelo; como está en $A$, que queda arriba, el
              disco **desliza** sobre el suelo.

      - tipo: calcular
        titulo: La velocidad de C respecto de la barra
        pregunta: |
          Escribiendo $|\vec{v}_{C/1}| = k\,v$, ¿cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número, el coeficiente que multiplica a v
        distractores:
          - valor: '0.5'
            mensaje: |
              Esa es solo la componente horizontal,
              $-\tfrac{v}{2}$. La vertical vale
              $-\tfrac{\sqrt{3}}{2}v$, y el módulo es la raíz de la suma de los
              cuadrados.
          - valor: '0.866'
            mensaje: |
              Esa es solo la componente vertical. Falta componer con la
              horizontal, y $\sqrt{0{,}5^{2}+0{,}866^{2}} = 1$ exactamente.
        pista: |
          $\vec{v}_{C/1} = \vec{v}_C - \vec{\omega}_1 \times \overrightarrow{OC}$,
          con $|OC| = 2R$ y $\vec{v}_C = (-v;\ 0)$.
        desarrollo: |
          $$
          \vec{v}_{C \in 1} = \frac{v}{2R}\,\vec{k}\times(\sqrt{3}R;\ R;\ 0)
          = \left(-\frac{v}{2};\ \frac{\sqrt{3}}{2}v\right)
          $$

          $$
          \vec{v}_{C/1} = (-v;\ 0) - \left(-\frac{v}{2};\ \frac{\sqrt{3}}{2}v\right)
          = \left(-\frac{v}{2};\ -\frac{\sqrt{3}}{2}v\right)
          $$

          de módulo exactamente $v$, y dirigida a lo largo de la barra, de $A$
          hacia $O$. Para $D$, en cambio, sale $\vec{v}_{D/1} = 0$.

      - tipo: calcular
        titulo: La aceleración angular de la barra
        pregunta: |
          Escribiendo $\alpha_1 = k\,\dfrac{v^{2}}{R^{2}}$, ¿cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '0.4330'
          tolerancia: 0.004
          formato: un número, el coeficiente que multiplica a v cuadrado partido por R cuadrado
        distractores:
          - valor: '0.866'
            mensaje: |
              Te has quedado con $\sqrt{3}/2$ en lugar de $\sqrt{3}/4$. Revisa
              el reparto entre el término de Coriolis, $2\omega_1 v_{C/1}$, y el
              normal, $\omega_1^{2}\,OC\cos 60^{\circ}$.
          - valor: '0.25'
            mensaje: |
              Ese es $\omega_1^{2}R^{2}/v^{2}$, o sea el cuadrado de la
              velocidad angular, no la aceleración angular. Falta dividir la
              combinación entera entre $OC\operatorname{sen}60^{\circ}$.
        pista: |
          $C$ desliza sobre la barra, así que $\vec{a}_C = 0$ se reparte entre
          los términos normal, tangencial, relativo y de Coriolis. Proyecta
          sobre la perpendicular a la barra.
        desarrollo: |
          Como $C$ va en línea recta a velocidad constante, $\vec{a}_C = 0$.
          Proyectando el campo de $C$ visto desde la barra:

          $$
          \alpha_1 = \frac{2\,\omega_1 v_{C/1} - \omega_1^{2}\,OC\cos 60^{\circ}}
          {OC\operatorname{sen}60^{\circ}}
          = \frac{\dfrac{v^{2}}{R} - \dfrac{v^{2}}{4R}}{\sqrt{3}R}
          = \frac{\sqrt{3}}{4}\,\frac{v^{2}}{R^{2}}
          $$

      - tipo: calcular
        titulo: La aceleración de D respecto de la barra
        pregunta: |
          Escribiendo $|\vec{a}_{D/1}| = k\,\dfrac{v^{2}}{R}$, ¿cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número, el coeficiente que multiplica a v cuadrado partido por R
        distractores:
          - valor: '0.5'
            mensaje: |
              Te has quedado a mitad de camino: el vector es
              $\frac{v^{2}}{2R}(\sqrt{3};\ -1)$, y su módulo es
              $\frac{v^{2}}{2R}\cdot 2 = \frac{v^{2}}{R}$.
          - valor: '1.732'
            mensaje: |
              Te has quedado solo con la componente según $\sqrt{3}$. Hay que
              componer las dos y el módulo del vector $(\sqrt{3};\ -1)$ es 2, no
              $\sqrt{3}$.
        pista: |
          Como $\vec{v}_{D/1} = 0$, la aceleración relativa se reduce a
          $\vec{a}_{D/1} = \vec{v}_s \times \vec{\omega}_r$, con
          $\vec{\omega}_r = \vec{\omega}_2 - \vec{\omega}_1$.
        desarrollo: |
          $$
          \vec{\omega}_r = \vec{\omega}_2 - \vec{\omega}_1 = -\frac{v}{R}\,\vec{k}
          \qquad
          \vec{v}_s = v\,\vec{u}_{DO}
          $$

          $$
          \vec{a}_{D/1} = \vec{v}_s \times \vec{\omega}_r
          = \frac{v^{2}}{R}\,\vec{u}_{DC}
          = \frac{v^{2}}{2R}\left(\sqrt{3}\,\vec{\imath} - \vec{\jmath}\right)
          $$

          de módulo $v^{2}/R$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Con el CIR del disco en $A$ y $|AC| = 2R$, sale
              $v_C = \omega_2\,2R = v$, horizontal, que es el dato del enunciado.
          - texto: >-
              Restando la velocidad del punto de la barra que coincide con cada
              uno, $\vec{v}_{C/1}$ tiene módulo $v$ y $\vec{v}_{D/1} = 0$.
          - texto: >-
              Con $\vec{a}_C = 0$ y el término de Coriolis, la proyección
              perpendicular a la barra da
              $\alpha_1 = \tfrac{\sqrt{3}}{4}\,v^{2}/R^{2}$.
          - texto: >-
              Como el disco se apoya en el suelo, su punto de contacto tiene
              velocidad nula y es su CIR.
            trampa: true
            mensaje: |
              El enunciado dice que el CIR está en $A$, y el CIR es único: si
              estuviera además en el suelo, el disco no podría girar. Lo que
              pasa aquí es que el disco **desliza** sobre el suelo, y su punto
              de contacto se mueve.
    resolucion: |
      **La geometría.** Con $O$ en el origen y la barra a $60^{\circ}$,
      $A = (\sqrt{3}R;\ 3R)$ y $D = (\sqrt{3}R/2;\ 1{,}5R)$, el punto medio. El
      disco tiene radio $R$ y se apoya en el suelo, así que su centro está a
      altura $R$; para que su CIR sea $A$, tiene que estar justo debajo:
      $C = (\sqrt{3}R;\ R)$, con $|AC| = 2R$ y $|OC| = 2R$. Además $|CD| = R$:
      $D$ está en el borde del disco.

      **Velocidades relativas.** Restando a la velocidad de cada punto la del
      punto de la barra que coincide con él,

      $$
      \vec{v}_{C/1} = \left(-\frac{v}{2};\ -\frac{\sqrt{3}}{2}v\right)
      \qquad
      \vec{v}_{D/1} = 0
      $$

      La segunda no es casualidad: $D$ es el punto donde el disco y la barra se
      tocan, y allí no hay deslizamiento.

      **Aceleración angular de la barra.** $C$ va en línea recta a velocidad
      constante, así que $\vec{a}_C = 0$. Visto desde la barra, $C$ es una
      deslizadera, y la proyección perpendicular deja

      $$
      \alpha_1 = \frac{2\omega_1 v_{C/1} - \omega_1^{2}OC\cos 60^{\circ}}
      {OC\operatorname{sen}60^{\circ}} = \frac{\sqrt{3}}{4}\,\frac{v^{2}}{R^{2}}
      $$

      **Aceleración relativa de D y del disco.** Con $\vec{v}_{D/1} = 0$, la
      aceleración relativa se reduce al producto
      $\vec{v}_s \times \vec{\omega}_r$:

      $$
      \vec{a}_{D/1} = \frac{v^{2}}{2R}\left(\sqrt{3}\,\vec{\imath} - \vec{\jmath}\right)
      \qquad
      \alpha_2 = \frac{OD}{R}\,\omega_1^{2} = \frac{\sqrt{3}}{4}\,\frac{v^{2}}{R^{2}}
      $$

      Las dos aceleraciones angulares coinciden, y las cuatro respuestas son las
      que publica la colección.

  - id: ejma8-col812-la-barra-por-dos-puntos-del-disco
    titulo: Una barra que pasa por dos puntos opuestos de un disco que rueda
    fuente: >-
      Ejercicio 8.12 · Tema 8, «Análisis del movimiento plano» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado y el
      profesor su resolución, contra los que está contrastado el desarrollo. El
      resultado es simbólico, así que las casillas piden el coeficiente que
      multiplica a la expresión indicada en cada pregunta.
    nivel: practica
    enunciado: |
      Una barra $AB$ pasa permanentemente por 2 puntos $C$ y $D$,
      diametralmente opuestos de una circunferencia de radio $R$, y su extremo
      $A$ recorre una línea recta horizontal. El disco rueda sin deslizar sobre
      la recta con velocidad angular conocida saliente $\omega$ al plano y una
      aceleración angular con el mismo sentido $2\sqrt{3}\,\omega^{2}$. En el
      instante mostrado en la figura, calcular:

      a) Velocidad del punto $A$.

      b) Aceleración del punto $A$.

      <figure>
      <svg viewBox="0 0 350 290" role="img" width="350" height="290" aria-labelledby="ejma8-col812-t ejma8-col812-d">
