      <figcaption>

      Sin escala. El disco rueda sin deslizar sobre un plano fijo y gira alrededor del contacto I: O y B, en la perpendicular al plano por I, van paralelos al plano. A corre por el plano. A trazos, las perpendiculares a las velocidades de A y de B: paralelas. Ejes del plano: x hacia arriba a lo largo de él, y hacia fuera; giros positivos en sentido antihorario.

      </figcaption>
      </figure>

      - **El disco** rueda sin deslizar sobre un plano fijo: su CIR es el
        contacto I, y gira alrededor de él en sentido horario. O y B, en la
        perpendicular al plano por I, a R y a 2R, van paralelos al plano,
        plano arriba.
      - **A** corre por el plano: su velocidad es paralela a él.
      - **La barra AB.** Las perpendiculares a $\vec{v}_A$ y a $\vec{v}_B$
        son perpendiculares al plano, y no son la misma: no se cortan. La
        barra no tiene CIR a distancia finita, y se traslada.

      En ejes del plano, con el origen en I, x hacia arriba a lo largo del
      plano e y perpendicular a él, hacia fuera: $O = (0;\ R)$,
      $B = (0;\ 2R)$ y, como la barra forma 45° con el plano y mide
      $2\sqrt{2}R$, $A = (-2R;\ 0)$, con $\overrightarrow{BA} = (-2R;\ -2R)$.
      En el dibujo la barra sale vertical: la figura del enunciado está en la
      posición que se pide, aunque la de la colección, como avisa una nota,
      no lo está. El disco gira con $\vec{\omega}_d = -\omega\,\vec{k}$.

      **2. Incógnitas.** $\omega_{AB}$ y $v_A$; $\alpha_{AB}$ y $a_A$; y el
      polo de aceleraciones de AB, P.

      **3. Ecuaciones.** El disco, desde el contacto, que tiene velocidad
      nula, y desde O, que va en línea recta a velocidad constante y no
      acelera; con $\omega$ constante, el disco no tiene aceleración angular:

      $$
      \vec{v}_B = -\omega\vec{k}\times\overrightarrow{IB},
      \qquad
      \vec{a}_B = -\omega^{2}\,\overrightarrow{OB}
      $$

      La barra, de B a A, con $\vec{v}_A = v_A\,\vec{i}$ y
      $\vec{a}_A = a_A\,\vec{i}$:

      $$
      \vec{v}_A = \vec{v}_B + \omega_{AB}\vec{k}\times\overrightarrow{BA},
      \qquad
      \vec{a}_A = \vec{a}_B + \alpha_{AB}\vec{k}\times\overrightarrow{BA} - \omega_{AB}^{2}\,\overrightarrow{BA}
      $$

      Y el polo, el punto P en el que la aceleración de la barra se anula:

      $$
      \vec{0} = \vec{a}_A + \alpha_{AB}\vec{k}\times\overrightarrow{AP} - \omega_{AB}^{2}\,\overrightarrow{AP}
      $$

      **4. Resultados.** Con
      $\vec{v}_B = -\omega\vec{k}\times(0;\ 2R) = (2\omega R;\ 0)$ y
      $\vec{k}\times\overrightarrow{BA} = (2R;\ -2R)$:

      $$
      (v_A;\ 0) = (2\omega R + 2R\,\omega_{AB};\ -2R\,\omega_{AB})
      $$

      $$
      \omega_{AB} = 0,
      \qquad
      \vec{v}_A = 2\omega R\,\vec{i}
      $$

      En aceleraciones, con $\vec{a}_B = -\omega^{2}(0;\ R) = (0;\ -\omega^{2}R)$:

      $$
      (a_A;\ 0) = (2R\,\alpha_{AB};\ -\omega^{2}R - 2R\,\alpha_{AB})
      $$

      $$
      \vec{\alpha}_{AB} = -\frac{\omega^{2}}{2}\,\vec{k},
      \qquad
      \vec{a}_A = -\omega^{2}R\,\vec{i}
      $$

      El polo, con $\overrightarrow{AP} = (p;\ q)$ y
      $\alpha_{AB}\vec{k}\times\overrightarrow{AP} = -\frac{\omega^{2}}{2}\,(-q;\ p)$:

      $$
      (0;\ 0) = \left(-\omega^{2}R + \frac{\omega^{2}}{2}\,q;\ -\frac{\omega^{2}}{2}\,p\right)
      \;\Longrightarrow\;
      p = 0,
      \quad
      q = 2R
      $$

      $$
      P = A + (0;\ 2R) = (-2R;\ 2R)
      $$

