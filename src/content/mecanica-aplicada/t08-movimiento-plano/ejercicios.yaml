    pide: La velocidad y la aceleración del punto A, en función de omega y R.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué la barra gira con la misma velocidad angular que el disco?
        opciones:
          - texto: >-
              Porque C y D son puntos materiales del disco, así que la barra
              lleva siempre la dirección de ese diámetro
            correcta: true
            mensaje: |
              Eso es. La barra está obligada a contener un diámetro que gira con
              el disco, así que su orientación es la de ese diámetro y
              $\omega_2 = \omega$. Lo que sí cambia es **por dónde** de la barra
              pasa el disco: hay deslizamiento a lo largo de ella.
          - texto: Porque la barra pasa por el centro O, y todo lo que pasa por O gira con el disco
            mensaje: |
              Pasar por el centro no basta: una recta puede pasar por $O$ y girar
              a otro ritmo, o no girar. Lo que fija la orientación es que los dos
              puntos por los que pasa sean **materiales** del disco.
          - texto: No giran igual, porque la barra desliza respecto del disco
            mensaje: |
              Hay deslizamiento, sí, pero **a lo largo** de la barra: el disco se
              desplaza sobre ella sin cambiar su orientación relativa. Los dos
              sólidos comparten velocidad angular y difieren en una traslación.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el disco y la barra, con el giro
          de los dos, la velocidad de O, la dirección de la de A y la del
          deslizamiento de O a lo largo de la barra**. Solo las direcciones,
          sin escala.
        comprueba:
          - punto: |
              **$\vec{v}_O$ horizontal, hacia la izquierda.**
            porque: |
              El disco rueda sin deslizar sobre la recta y gira en sentido
              antihorario: alrededor del contacto, que está debajo de O, eso
              lleva a O hacia la izquierda.
          - punto: |
              **$\vec{v}_A$ horizontal, a lo largo de la recta.**
            porque: |
              A es una deslizadera que no puede salirse de la recta. Su sentido
              no se ve sin calcular: se dibuja hacia la derecha, y el cálculo
              dirá su sentido.
          - punto: |
              **La barra, girando con el disco en sentido antihorario, y el
              deslizamiento de O, $\vec{v}_{O/2}$, a lo largo de la barra.**
            porque: |
              La barra contiene siempre el diámetro CD, que gira con el disco:
              lo único que el disco puede hacer respecto de ella es correr a lo
              largo. El sentido de ese deslizamiento, el cálculo lo dirá.
