      - tipo: calcular
        titulo: La velocidad angular de la barra CD
        pregunta: |
          ¿Cuánto vale $\omega_{CD}$, en rad/s y en valor absoluto?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.02
          formato: un número, en rad/s
        distractores:
          - valor: '6'
            mensaje: |
              Esa es la de $AB$. Las dos barras llevan el mismo punto a la misma
              velocidad, pero $AB$ mide 90 mm y $CD$ mide 180: al doble de
              brazo, la mitad de velocidad angular.
          - valor: '12'
            mensaje: |
              Has multiplicado por dos en vez de dividir. $v_D = v_B = 0{,}54$
              m/s y $CD = 0{,}18$ m, así que $\omega_{CD} = 0{,}54/0{,}18$.
        pista: |
          $v_B = \omega\,AB = 6 \cdot 0{,}09$ m/s, y como $BDE$ se traslada,
          $v_D = v_B$. Luego $\omega_{CD} = v_D / CD$.
        desarrollo: |
          $$
          v_B = 6 \cdot 0{,}09 = 0{,}54\ \text{m/s}
          \qquad
          \omega_{CD} = \frac{0{,}54}{0{,}18} = 3\ \text{rad/s}
          $$

          Horaria, como la de $AB$.

      - tipo: calcular
        titulo: La aceleración angular de la barra BDE
        pregunta: |
          ¿Cuánto vale $\alpha_{BDE}$, en rad/s²?
        respuesta:
          tipo: numero
          valor: '7.2'
          tolerancia: 0.05
          formato: un número, en rad/s²
        distractores:
          - valor: '0'
            mensaje: |
              La barra no gira en este instante, pero eso no obliga a que su
              aceleración angular sea nula: un instante después $v_B$ y $v_D$
              dejan de ser iguales. Es la misma trampa que el CIR con
              aceleración no nula.
          - valor: '18'
            mensaje: |
              Parece que has repartido la diferencia de normales entre la
              componente horizontal de $BD$, 0,225 m, en lugar de entre la
              vertical, 0,09 m. Solo la componente vertical de
              $\vec{\alpha}\times\overrightarrow{BD}$ es horizontal.
        pista: |
          Proyecta $\vec{a}_D = \vec{a}_B + \vec{\alpha}_2 \times \overrightarrow{BD}$
          sobre la vertical: $a_{By} = -\omega^{2}AB$, $a_{Dy} = -\omega_{CD}^{2}CD$
          y de $\vec{\alpha}_2 \times \overrightarrow{BD}$ solo entra $0{,}225\,\alpha_2$.
        desarrollo: |
          $$
          -\omega^{2}AB + 0{,}225\,\alpha_2 = -\omega_{CD}^{2}\,CD
          $$

          $$
          -36 \cdot 0{,}09 + 0{,}225\,\alpha_2 = -9 \cdot 0{,}18
          \;\Longrightarrow\;
          \alpha_2 = \frac{1{,}62}{0{,}225} = 7{,}2\ \text{rad/s}^{2}
          $$

      - tipo: calcular
        titulo: La aceleración de E
        pregunta: |
          ¿Cuánto vale $a_E$, en m/s²?
        respuesta:
          tipo: numero
          valor: '1.296'
          tolerancia: 0.01
          formato: un número, en m/s²
        distractores:
          - valor: '1.744'
            mensaje: |
              Ese es el módulo de $\vec{a}_D$. $E$ está el doble de lejos de $B$
              que $D$, y con $\omega_2 = 0$ su aceleración no es la de $D$.
          - valor: '2.592'
            mensaje: |
              Has multiplicado $\alpha_2$ por la componente horizontal de
              $\overrightarrow{BE}$, 0,45 m. La que da aceleración horizontal
              es la vertical, 0,18 m.
        pista: |
          Con $\omega_2 = 0$, $\vec{a}_E = \vec{a}_B + \vec{\alpha}_2 \times \overrightarrow{BE}$,
          y $\overrightarrow{BE} = (0{,}45;\ 0{,}18)$ m.
        desarrollo: |
          $$
          \vec{a}_E = (0;\ -3{,}24) + 7{,}2\,(-0{,}18;\ 0{,}45)
          = (-1{,}296;\ 0)\ \text{m/s}^{2}
          $$

          La vertical se cancela exactamente, y queda
          $a_E = 1{,}296\ \text{m/s}^{2}$, horizontal.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $v_B$ y $v_D$ son horizontales, y como $BD$ no lo es, la barra
              $BDE$ se traslada: $\omega_{BDE} = 0$ y $v_D = v_B = 0{,}54$ m/s.
          - texto: >-
              $\omega_{CD} = 0{,}54/0{,}18 = 3$ rad/s, y las aceleraciones de
              $B$ y de $D$ son las normales $\omega^{2}AB$ y
              $\omega_{CD}^{2}CD$ más la tangencial de $CD$.
          - texto: >-
              Proyectando sobre la vertical sale $\alpha_{BDE} = 7{,}2$
              rad/s², y con ella $a_D = 1{,}74$ m/s² y $a_E = 1{,}296$ m/s².
          - texto: >-
              Como la barra $BDE$ se traslada, todos sus puntos tienen la misma
              aceleración y $a_E = a_D$.
            trampa: true
            mensaje: |
              Se traslada **en este instante**, que es una afirmación sobre
              velocidades. Con $\alpha_{BDE} = 7{,}2$ rad/s² las aceleraciones
              de sus puntos son distintas: 1,74 m/s² en $D$ y 1,296 m/s² en $E$.
    resolucion: |
      **1. Esquema de velocidades.** Es un problema de cinemática: el dibujo
      lleva el giro de AB, la dirección de las velocidades de B y de D y el
      giro de CD, sin escala.

      <figure class="figura-examen">
      <svg viewBox="0 50 292 186" role="img" width="438" height="279" aria-labelledby="dsl-t dsl-d">
