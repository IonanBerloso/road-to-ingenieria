    pide: La velocidad angular y la aceleración angular de la barra BC y de la barra CD.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se plantea este mecanismo sin dibujar polígonos de velocidades?
        opciones:
          - texto: >-
              Escribiendo el campo de velocidades de B a C y exigiendo que C
              también gire alrededor de D
            correcta: true
            mensaje: |
              Eso es. $\vec{v}_C = \vec{v}_B + \vec{\omega}_{BC}\times\overrightarrow{BC}$
              por un lado y $\vec{v}_C = \vec{\omega}_{CD}\times\overrightarrow{DC}$
              por el otro: dos ecuaciones escalares y dos incógnitas.
          - texto: Buscando el CIR de BC en el corte de AB con CD
            mensaje: |
              Para las velocidades sirve: las perpendiculares a $v_B$ y a
              $v_C$ son las rectas $AB$ y $DC$, que se cortan justo en $A$, y
              $BC$ gira en ese instante alrededor de $A$. Pero el CIR no da
              las aceleraciones, que también se piden; el campo, planteado
              desde el principio, da las dos cosas.
          - texto: Suponiendo que las tres barras giran a la misma velocidad angular
            mensaje: |
              Solo pasa en un paralelogramo articulado. Aquí las tres
              longitudes y direcciones son distintas y cada barra tiene su
              propia velocidad angular.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el cuadrilátero con el giro de
          AB, la dirección de las velocidades de B y de C y el CIR de BC**.
          Solo las direcciones, sin escala.
        comprueba:
          - punto: |
              **$\vec{v}_B$ vertical, hacia abajo.**
            porque: |
              B gira alrededor del punto fijo A en sentido horario, con AB
              horizontal y B a la derecha de A: se mueve en perpendicular a
              AB, hacia abajo.
          - punto: |
              **$\vec{v}_C$ perpendicular a DC, hacia abajo y a la
              izquierda.**
            porque: |
              C gira alrededor del punto fijo D. Y su componente vertical es
              la de B: BC es vertical, y un giro de BC solo le añade a C una
              velocidad horizontal.
          - punto: |
              **El CIR de BC, en A.**
            porque: |
              Está donde se cortan las perpendiculares a $\vec{v}_B$ y a
              $\vec{v}_C$, que son la recta AB y la recta DC; y la recta DC,
              prolongada más allá de C, pasa justo por A.
        figura: |
          <svg viewBox="4 28 300 168" role="img" width="300" height="168" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">Esquema de velocidades del cuadrilátero articulado</title>
            <desc id="dsl-d">La barra AB, horizontal, gira alrededor del punto fijo A, a la izquierda, en sentido horario. De B baja la barra BC, vertical; de C sale la barra CD, hacia abajo y a la derecha, hasta el punto fijo D. Junto a B, su velocidad, vertical hacia abajo. En C, su velocidad, perpendicular a DC, hacia abajo y a la izquierda. A trazos, la recta DC prolongada más allá de C, que llega justo a A. Alrededor de D, el giro de CD, antihorario.</desc>
            <defs>
              <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
              </marker>
              <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
