    pide: La velocidad angular y la aceleración angular del aro.
    pasos:
      - tipo: reconocer
        pregunta: |
          $A$ es una corredera que **recorre** el contorno del aro. ¿Qué añade
          eso respecto de una articulación?
        opciones:
          - texto: >-
              Que hay velocidad relativa tangente al aro, y en aceleraciones
              aparecen el Coriolis y una normal relativa de valor v relativa al
              cuadrado partido por R
            correcta: true
            mensaje: |
              Eso es, y el segundo término se olvida con facilidad: respecto del
              aro, $A$ describe una **circunferencia** de radio $R$, así que su
              aceleración relativa tiene componente normal
              $v_{A/2}^{2}/R$ apuntando al centro $C$.
          - texto: Que A es un punto material del aro y comparte con él velocidad y aceleración
            mensaje: |
              Si lo fuera, la distancia de $A$ a $O_2$ no podría cambiar, y
              cambia: $A$ va recorriendo el contorno mientras el aro gira.
          - texto: Que el aro rueda sobre la barra sin deslizar
            mensaje: |
              No hay rodadura por ningún lado: la corredera **resbala** por el
              contorno. De hecho $v_{A/2} = 2\omega R$, que no es poco.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **la barra y el aro, con la
          velocidad de A, la del punto del aro que coincide con A y la del
          deslizamiento, y el sentido en que gira el aro**. Solo las
          direcciones, sin escala.
        comprueba:
          - punto: |
              **$\vec{v}_A$ perpendicular a $O_1A$, hacia abajo y a la
              derecha.**
            porque: |
              A va con la barra, que gira en sentido horario alrededor de
              $O_1$: con A arriba y a la derecha de $O_1$, eso la lleva hacia
              abajo y a la derecha.
          - punto: |
              **El aro gira en sentido horario, y el punto del aro que coincide
              con A va perpendicular a $O_2A$, hacia arriba y a la derecha.**
            porque: |
              El deslizamiento es tangente al aro, y en A el radio CA es
              horizontal: el deslizamiento es vertical. Así que la componente
              horizontal de $\vec{v}_A$, hacia la derecha, es entera la del
              punto del aro; y A, que está más alta que $O_2$, va hacia la
              derecha si el aro gira en sentido horario.
          - punto: |
              **El deslizamiento, $\vec{v}_{A/2}$, vertical y hacia abajo.**
            porque: |
              Es la diferencia entre $\vec{v}_A$ y la velocidad del punto del
              aro: la primera baja y la segunda sube, y las dos van igual de
              deprisa en horizontal. Lo que queda es vertical, hacia abajo.
