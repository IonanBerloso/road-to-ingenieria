    pide: La velocidad angular y la aceleración angular del aro.
    pasos:
      - tipo: reconocer
        pregunta: |
          $A$ es una corredera que **recorre** el contorno del aro. ¿Qué añade
          eso respecto de una articulación?
        opciones:
          - texto: >-
              Que hay velocidad relativa tangente al aro, y en aceleraciones
              aparecen el Coriolis y una normal relativa de valor v relativa al
              cuadrado partido por R
            correcta: true
            mensaje: |
              Eso es, y el segundo término se olvida con facilidad: respecto del
              aro, $A$ describe una **circunferencia** de radio $R$, así que su
              aceleración relativa tiene componente normal
              $v_{A/2}^{2}/R$ apuntando al centro $C$.
          - texto: Que A es un punto material del aro y comparte con él velocidad y aceleración
            mensaje: |
              Si lo fuera, la distancia de $A$ a $O_2$ no podría cambiar, y
              cambia: $A$ va recorriendo el contorno mientras el aro gira.
          - texto: Que el aro rueda sobre la barra sin deslizar
            mensaje: |
              No hay rodadura por ningún lado: la corredera **resbala** por el
              contorno. De hecho $v_{A/2} = 2\omega R$, que no es poco.

      - tipo: calcular
        titulo: La velocidad angular del aro
        pregunta: |
          Escribiendo $\vec{\omega}_{\text{aro}} = k\,\omega\vec{k}$, ¿cuánto
          vale $k$?
        respuesta:
          tipo: numero
          valor: '-1'
          tolerancia: 0.01
          formato: un número con su signo, el coeficiente que multiplica a omega
        distractores:
          - valor: '1.414'
            mensaje: |
              Has usado la longitud de la barra, $\sqrt{2}R$, como brazo del aro.
              El aro gira alrededor de $O_2$, y lo que cuenta es
              $\overrightarrow{O_2A}$, que también mide $\sqrt{2}R$ pero tiene
              otra dirección: hay que proyectar.
          - valor: '-0.5'
            mensaje: |
              Falta un factor dos. La componente horizontal de $\vec{v}_A$ es
              $\omega R$ y el brazo horizontal de $\overrightarrow{O_2A}$ vale
              $R$, así que el cociente es exactamente $\omega$.
        pista: |
          $\vec{v}_A = \vec{\omega}_1 \times \overrightarrow{O_1A} = (\omega R;\ -\omega R)$.
          Y $\vec{v}_{A/2}$ es tangente al aro en $A$, o sea **vertical**, porque
          el radio $CA$ es horizontal.
        desarrollo: |
          Con $O_1 = (0;\ 0)$, $A = (R;\ R)$, $C = (2R;\ R)$ y $O_2 = (2R;\ 0)$:

          $$
          \vec{v}_A = (\omega R;\ -\omega R)
          \qquad
          \vec{v}_{A \in 2} = \omega_2\,\vec{k}\times(-R;\ R) = \omega_2(-R;\ -R)
          $$

          La componente horizontal no la toca el deslizamiento, que es vertical:

          $$
          \omega R = -R\,\omega_2 \;\Longrightarrow\; \omega_2 = -\omega
          $$

      - tipo: calcular
        titulo: La velocidad de la corredera respecto del aro
        pregunta: |
          Escribiendo $|\vec{v}_{A/2}| = k\,\omega R$, ¿cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número, el coeficiente que multiplica a omega por R
        distractores:
          - valor: '1.414'
            mensaje: |
              Ese es el módulo de $\vec{v}_A$, $\sqrt{2}\,\omega R$. La relativa
              se obtiene restando $\vec{v}_{A \in 2}$, y como las dos verticales
              van en el mismo sentido, la diferencia es mayor que cada una.
          - valor: '1'
            mensaje: |
              Esa es la componente vertical de $\vec{v}_A$ sola,
              $\omega R$. Falta restarle la del punto del aro, que vale
              $+\omega R$, y la resta da $-2\omega R$.
        pista: |
          $\vec{v}_{A/2} = \vec{v}_A - \vec{v}_{A \in 2}$, y solo tiene
          componente vertical.
        desarrollo: |
          $$
          \vec{v}_{A/2} = (\omega R;\ -\omega R) - (\omega R;\ \omega R)
          = (0;\ -2\omega R)
          $$

          Tangente al aro, como tenía que ser.

      - tipo: calcular
        titulo: La aceleración angular del aro
        pregunta: |
          Escribiendo $\vec{\alpha}_{\text{aro}} = k\,\omega^{2}\vec{k}$,
          ¿cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.02
          formato: un número, el coeficiente que multiplica a omega cuadrado
        distractores:
          - valor: '7'
            mensaje: |
              Te has dejado el término de Coriolis,
              $2\,\omega_2 v_{A/2} = 4\omega^{2}R$. Con una corredera sobre un
              sólido que gira siempre aparece, y aquí cancela exactamente la
              normal relativa.
          - valor: '1'
            mensaje: |
              Te has dejado la normal del movimiento relativo,
              $v_{A/2}^{2}/R = 4\omega^{2}R$. Respecto del aro, $A$ recorre una
              circunferencia de radio $R$, no una recta.
        pista: |
          Proyecta sobre la horizontal. Intervienen la normal y la tangencial de
          la barra, la normal y la tangencial del aro, la normal relativa
          $v_{A/2}^{2}/R$ y el Coriolis $2\,\vec{\omega}_2 \times \vec{v}_{A/2}$.
        desarrollo: |
          Con $\vec{a}_A = (-2\omega^{2}R;\ 0)$, la normal relativa
          $(4\omega^{2}R;\ 0)$ y el Coriolis $(-4\omega^{2}R;\ 0)$, la
          componente horizontal deja

          $$
          -2\omega^{2}R = -R\,\alpha_2 + \omega^{2}R
          \;\Longrightarrow\;
          \alpha_2 = 3\,\omega^{2}
          $$

          Los dos términos relativos se cancelan entre sí, lo que hace que
          olvidarse de **los dos** dé por casualidad el resultado correcto, y
          olvidarse de uno solo, no.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $\vec{v}_A = (\omega R;\ -\omega R)$, y como el radio $CA$ es
              horizontal, el deslizamiento por el aro es vertical.
          - texto: >-
              Igualando las componentes horizontales sale
              $\vec{\omega}_{\text{aro}} = -\omega\vec{k}$, y restando,
              $v_{A/2} = 2\omega R$.
          - texto: >-
              En aceleraciones hay que añadir la normal relativa
              $v_{A/2}^{2}/R$ y el Coriolis, y la proyección horizontal da
              $\alpha_{\text{aro}} = 3\omega^{2}$.
          - texto: >-
              Como $A$ está articulada al extremo de la barra, es un punto del
              aro y su aceleración es la del aro en ese punto.
            trampa: true
            mensaje: |
              $A$ está articulada a la **barra**, no al aro: por el aro
              **resbala**. Entre $\vec{a}_A$ y $\vec{a}_{A \in 2}$ hay tres
              términos de diferencia —la tangencial relativa, la normal relativa
              y el Coriolis—, y sin ellos $\alpha$ sale mal.
    resolucion: |
      **La geometría.** Con $O_1$ en el origen y la barra a $45^{\circ}$,
      $A = (R;\ R)$. El centro del aro está en la misma horizontal que $A$ y a
      distancia $R$, así que $C = (2R;\ R)$; y $O_2$, en la horizontal de $O_1$
      y sobre el propio aro, es $O_2 = (2R;\ 0)$, justo debajo de $C$.

      **Velocidades.** La barra gira en sentido horario:

      $$
      \vec{v}_A = -\omega\,\vec{k}\times(R;\ R) = (\omega R;\ -\omega R)
      $$

      Como el radio $CA$ es horizontal, la tangente al aro en $A$ es vertical y
      el deslizamiento solo puede ser vertical. La componente horizontal da
      entonces

      $$
      \vec{\omega}_{\text{aro}} = -\omega\,\vec{k}
      \qquad
      \vec{v}_{A/2} = (0;\ -2\omega R)
      $$

      **Aceleraciones.** La barra aporta
      $\vec{a}_A = \vec{\alpha}\times\overrightarrow{O_1A} - \omega^{2}\overrightarrow{O_1A}
      = (-2\omega^{2}R;\ 0)$. Y en el campo relativo hay dos términos que se
      suelen olvidar: la **normal relativa**, $v_{A/2}^{2}/R = 4\omega^{2}R$
      hacia $C$, y el **Coriolis**, $2\,\vec{\omega}_2\times\vec{v}_{A/2}$, que
      vale $4\omega^{2}R$ en sentido contrario. Proyectando sobre la horizontal,

      $$
      \alpha_{\text{aro}} = 3\,\omega^{2}
      $$

      **Un aviso.** Aquí los dos términos relativos se cancelan, así que quien
      se olvide de los dos acierta por casualidad y quien se olvide de uno falla
      por $4\omega^{2}$. Conviene escribirlos siempre.

  - id: ejma8-col817-el-disco-que-sube-el-plano-y-su-barra
    titulo: Un disco que sube un plano inclinado arrastrando una barra
    fuente: >-
      Ejercicio 8.17 · Tema 8, «Análisis del movimiento plano» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado y el
      profesor su resolución, contra los que está contrastado el desarrollo. El
      resultado es simbólico, así que las casillas piden el coeficiente que
      multiplica a la expresión indicada; los ejes son los del plano, con el eje
      x hacia arriba a lo largo de él.
    nivel: practica
    enunciado: |
      Un disco de radio $R$ asciende con velocidad angular constante $\omega$
      por un plano inclinado $\pi$ (fijo) que forma 45° con la horizontal. No
      hay deslizamiento entre plano y disco. En el punto $B$ del disco, está
      articulada una barra de longitud $2R\sqrt{2}$ cuyo otro extremo recorre el
      plano mediante una deslizadera en el punto $A$. En el instante en que la
      barra $AB$ forma 45° con el plano $\pi$, calcular:

      a) Velocidad angular de la barra $AB$.

      b) Velocidad de la deslizadera en $A$.

      c) Aceleración angular de la barra $AB$.

      d) Aceleración de la deslizadera en $A$.

      e) Polo de aceleraciones de $AB$.

      <figure>
      <svg viewBox="0 0 305 290" role="img" width="305" height="290" aria-labelledby="ejma8-col817-t ejma8-col817-d">
        <title id="ejma8-col817-t">Disco que sube un plano inclinado a 45 grados con una barra articulada en su punto más alto y una deslizadera en el plano</title>
        <desc id="ejma8-col817-d">Un plano fijo inclinado 45 grados que sube hacia la derecha. Sobre él rueda sin deslizar un disco de radio R y centro O, que asciende con velocidad angular omega constante. En B, el punto del disco diametralmente opuesto al de contacto, se articula una barra de longitud dos raíz de dos por R que baja hasta la deslizadera A, situada sobre el plano. La barra forma 45 grados con el plano y resulta vertical en el dibujo. Esta figura está en la posición que pide el enunciado, no en la de la figura original de la colección. La figura está dibujada a escala.</desc>
        <defs>
          <marker id="ejma8-col817-fl" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
        </defs>
        <line x1="65.1" y1="234.9" x2="234.9" y2="65.1" stroke="var(--ink)" stroke-width="1.5"/>
        <path d="M80 250 L88 242 M100 270 L108 262 M120 250 L128 242 M140 230 L148 222 M160 210 L168 202 M180 190 L188 182 M200 170 L208 162 M220 150 L228 142" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <line x1="65.1" y1="234.9" x2="120" y2="290" stroke="var(--faint)" stroke-width="0.9"/>
