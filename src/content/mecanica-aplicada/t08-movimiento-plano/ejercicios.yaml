      </figcaption>
      </figure>

      **La barra no gira, y A sube a $2\omega R$; pero AB tiene una
      aceleración angular de $\omega^{2}/2$, horaria, A frena a
      $\omega^{2}R$, plano abajo, y el polo de aceleraciones está a 2R de A,
      en la perpendicular al plano.** Los cinco coinciden con los que publica
      la colección.

      **5. Comprobación.** Por la geometría, sin campos. Con $s$ la abscisa
      de A, $x_O$ la de O, con $\dot{x}_O = \omega R$ y $\ddot{x}_O = 0$, y
      $\psi$ el giro de B alrededor de O, horario, con $\dot{\psi} = \omega$:
      $B = (x_O + R\sin\psi;\ R + R\cos\psi)$, y en el instante $\psi = 0$,
      $\dot{B} = (2\omega R;\ 0)$ y $\ddot{B} = (0;\ -\omega^{2}R)$. La barra
      mide siempre $2\sqrt{2}R$: con $\vec{d} = \overrightarrow{AB} = (2R;\ 2R)$,
      $\vec{d}\cdot\dot{\vec{d}} = 0$ y
      $\vec{d}\cdot\ddot{\vec{d}} + |\dot{\vec{d}}|^{2} = 0$.

      $$
      \dot{\vec{d}} = (2\omega R - \dot{s};\ 0),
      \qquad
      2R\,(2\omega R - \dot{s}) = 0
      \;\Longrightarrow\;
      \dot{s} = 2\omega R,
      \quad
      \dot{\vec{d}} = \vec{0}
      $$

      $$
      \ddot{\vec{d}} = (-\ddot{s};\ -\omega^{2}R),
      \qquad
      2R\,(-\ddot{s}) + 2R\,(-\omega^{2}R) = 0
      \;\Longrightarrow\;
      \ddot{s} = -\omega^{2}R
      $$

      El ángulo de la barra, $\beta$, con $\tan\beta = d_y/d_x$: como
      $\dot{\vec{d}} = \vec{0}$,
      $\dot{\beta} = (d_x\dot{d}_y - d_y\dot{d}_x)/|\vec{d}|^{2} = 0$ y

      $$
      \ddot{\beta} = \frac{d_x\ddot{d}_y - d_y\ddot{d}_x}{|\vec{d}|^{2}}
      = \frac{2R\,(-\omega^{2}R) - 2R\,(\omega^{2}R)}{8R^{2}} = -\frac{\omega^{2}}{2}
      $$

      Y el polo, desde B, que no se ha usado para hallarlo: con
      $\overrightarrow{BP} = (-2R;\ 0)$,
      $\vec{a}_P = (0;\ -\omega^{2}R) - \frac{\omega^{2}}{2}\vec{k}\times(-2R;\ 0) = (0;\ -\omega^{2}R) + (0;\ \omega^{2}R) = \vec{0}$.
      Lo mismo.

      **Lo que dice el resultado.** El CIR y el polo de aceleraciones son
      puntos distintos: la barra no gira, así que su CIR está en el infinito,
      y su polo está aquí al lado, a 2R de A. Y el CIR del disco, el
      contacto, no tiene velocidad, pero sí aceleración: $\omega^{2}R$, hacia
      O. Aunque el disco suba uniformemente, A frena: B, en lo alto del
      disco, acelera hacia el plano, y la barra, que no puede acortarse,
      empieza a girar y deja atrás a A.
