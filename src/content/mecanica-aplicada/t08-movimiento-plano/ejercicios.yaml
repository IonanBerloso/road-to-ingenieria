            <text x="124" y="76" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">v<tspan font-size="7.5" dy="2.5">B</tspan></text>
            <line x1="94" y1="214" x2="116" y2="192" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
