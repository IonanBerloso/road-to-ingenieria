    pide: El instante en que el émbolo alcanza su velocidad máxima y el valor de esa velocidad.
    pasos:
      - tipo: reconocer
        pregunta: |
          Con el origen de tiempos en $x = 0$, ¿cómo se mueve el émbolo?
        opciones:
          - texto: >-
              Con un movimiento armónico simple, x igual a b por el seno de
              omega t
            correcta: true
            mensaje: |
              Eso es. La ranura es vertical, así que la corredera copia
              exactamente la **abscisa** del pasador $A$:
              $x = b\operatorname{sen}(\omega t)$. Es el yugo escocés, y por eso
              el émbolo describe un armónico puro.
          - texto: Con velocidad uniforme, porque la pieza giratoria gira a velocidad constante
            mensaje: |
              El giro es uniforme, pero lo que el émbolo copia es la proyección
              del giro sobre el eje $X$, y una proyección de algo uniforme no es
              uniforme: va de $+\omega b$ a $-\omega b$.
          - texto: Con la misma velocidad que el punto A del extremo de la pieza giratoria
            mensaje: |
              $A$ lleva $\omega b$ siempre, pero perpendicular a la manivela. El
              émbolo solo recoge su componente horizontal; la vertical se la
              come el deslizamiento por la ranura.

      - tipo: calcular
        titulo: La velocidad angular en unidades del SI
        pregunta: |
          ¿A cuántos rad/s equivalen 15 rpm?
        respuesta:
          tipo: numero
          valor: '1.5708'
          tolerancia: 0.002
          formato: un número, en rad/s (vale la forma exacta pi/2)
        distractores:
          - valor: '15'
            mensaje: |
              Eso son revoluciones por minuto, no radianes por segundo. Hay que
              multiplicar por $2\pi$ radianes por vuelta y dividir entre 60
              segundos por minuto.
          - valor: '94.25'
            mensaje: |
              Has multiplicado por $2\pi$ pero se te ha olvidado dividir entre
              los 60 segundos del minuto.
        pista: |
          $\omega = 15 \cdot \dfrac{2\pi}{60}$ rad/s.
        desarrollo: |
          $$
          \omega = \frac{15 \cdot 2\pi}{60} = \frac{\pi}{2} = 1{,}5708\ \text{rad/s}
          $$

          El periodo es $T = 2\pi/\omega = 4$ s.

      - tipo: calcular
        titulo: La velocidad máxima del émbolo
        pregunta: |
          ¿Cuánto vale la velocidad máxima del émbolo, en mm/s?
        respuesta:
          tipo: numero
          valor: '471.2'
          tolerancia: 0.5
          formato: un número, en mm/s
        distractores:
          - valor: '4500'
            mensaje: |
              Has usado $\omega = 15$ sin pasar de rpm a rad/s. El factor entre
              las dos es $2\pi/60 \approx 0{,}105$, y aquí cambia el resultado
              casi por diez.
          - valor: '235.6'
            mensaje: |
              Has usado 150 mm en vez de 300. El enunciado da la **longitud** de
              la pieza giratoria, que es el radio del giro de $A$, no un
              diámetro.
        pista: |
          $v(t) = \omega b\cos(\omega t)$, y el coseno vale como mucho 1.
        desarrollo: |
          $$
          v_{\max} = \omega b = \frac{\pi}{2}\cdot 300 = 471{,}2\ \text{mm/s}
          $$

      - tipo: calcular
        titulo: El instante en que se alcanza
        pregunta: |
          La colección responde con el primer instante **posterior** al origen
          de tiempos en que el émbolo vuelve a ir a la velocidad máxima.
          ¿Cuál es, en segundos?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.02
          formato: un número, en segundos
        distractores:
          - valor: '4'
            mensaje: |
              Ese es el periodo entero, cuando $A$ ha dado una vuelta completa.
              El émbolo pasa por $x = 0$ **dos** veces por vuelta, y en las dos
              va a la velocidad máxima.
          - valor: '1'
            mensaje: |
              Ese es un cuarto de vuelta, y ahí $x = b$ es máximo pero la
              velocidad es **nula**: es el punto muerto en el que el émbolo se
              para para volver.
        pista: |
          $\dfrac{dv}{dt} = -\omega^{2}b\operatorname{sen}(\omega t) = 0$ cuando
          $\omega t = \pi$.
        desarrollo: |
          $$
          -\omega^{2}b\operatorname{sen}(\omega t) = 0
          \;\Longrightarrow\;
          \omega t = \pi
          \;\Longrightarrow\;
          t = \frac{\pi}{\omega} = 2\ \text{s}
          $$

          En $t = 2$ s el émbolo pasa otra vez por $x = 0$, ahora hacia la
          izquierda, con $v = -471{,}2$ mm/s. En módulo es la misma velocidad
          que tenía en $t = 0$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La ranura vertical hace que el émbolo copie la abscisa del
              pasador: $x(t) = b\operatorname{sen}(\omega t)$, con
              $\omega = \pi/2$ rad/s.
          - texto: >-
              Derivando, $v(t) = \omega b\cos(\omega t)$, cuyo máximo en módulo
              es $\omega b = 471{,}2$ mm/s.
          - texto: >-
              Se alcanza cuando $\cos(\omega t) = \pm 1$, o sea al pasar por
              $x = 0$: en $t = 0$ y otra vez en $t = 2$ s.
          - texto: >-
              La velocidad del émbolo es máxima donde su desplazamiento $x$ es
              máximo, es decir en el extremo de la carrera.
            trampa: true
            mensaje: |
              Es justo al revés. En el extremo de la carrera el émbolo se para
              para invertir el sentido: ahí $v = 0$ y la aceleración es máxima.
              La velocidad máxima está en el centro, al pasar por $x = 0$.
    resolucion: |
      **El mecanismo es un yugo escocés.** La ranura de la corredera es
      vertical, así que la corredera —y con ella el émbolo— tiene en cada
      instante la misma abscisa que el pasador $A$:

      $$
      x(t) = b\operatorname{sen}(\omega t)
      \qquad
      b = 300\ \text{mm}
      \qquad
      \omega = \frac{15 \cdot 2\pi}{60} = \frac{\pi}{2}\ \text{rad/s}
      $$

      **La velocidad.** Derivando,

      $$
      v(t) = \omega b\cos(\omega t)
      \qquad
      v_{\max} = \omega b = \frac{\pi}{2}\cdot 300 = 471{,}2\ \text{mm/s}
      $$

      **Cuándo.** El máximo de $|v|$ está donde $\dfrac{dv}{dt} = 0$, es decir
      donde $\operatorname{sen}(\omega t) = 0$: en $\omega t = 0,\ \pi,\ 2\pi\ldots$
      Con el origen de tiempos en $x = 0$, el primer instante posterior es

      $$
      t = \frac{\pi}{\omega} = 2\ \text{s}
      $$

      que es medio periodo, ya que $T = 4$ s.

      **Un matiz que conviene ver.** En $t = 0$ el émbolo ya va a 471,2 mm/s: el
      máximo de la **rapidez** se da cada vez que pasa por $x = 0$, dos veces
      por vuelta. Lo que distingue a $t = 2$ s es que entonces va en sentido
      contrario, $v = -471{,}2$ mm/s. La colección publica ese instante.
  - id: ejma8-col89-el-disco-y-la-barra-bc-con-rodadura
    titulo: Un disco que rueda sobre una barra apoyada en él
    fuente: >-
      Ejercicio 8.9 · Tema 8, «Análisis del movimiento plano» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado y el
      profesor su resolución, contra los que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      En el sistema de la figura, la barra $OA$ (1) gira con velocidad angular
      $\omega_1 = 10$ rad/s en sentido antihorario y está articulada a una
      deslizadera vertical (punto $O$) y al disco (2) de radio $R$. El punto $A$
      puede moverse a lo largo de una ranura horizontal. La barra $BC$ (3) está
      apoyada sobre el disco (2) existiendo rodadura en el punto de contacto
      $E$. Calcular:

      a) Velocidades de los puntos $O$ y $A$.

      b) Velocidades angulares del disco y de la barra $BC$.

      c) Velocidad del centro $A$ del disco con respecto a la barra $BC$.
      Dibujar dirección y sentido del vector.

      <figure>
      <svg viewBox="0 0 310 250" role="img" width="310" height="250" aria-labelledby="ejma8-col89-t ejma8-col89-d">
        <title id="ejma8-col89-t">Barra OA con O en una guía vertical y A en una ranura horizontal, disco de centro A y barra BC apoyada en el disco</title>
        <desc id="ejma8-col89-d">Una guía vertical a la izquierda por la que corre la deslizadera O. De O sale la barra 1 hasta A, que corre por una ranura horizontal situada a una distancia R por encima de O y dos R a su derecha. En A está el centro del disco 2, de radio R. La barra 3 arranca del punto fijo B, situado tres R por encima de O en la misma vertical, y baja hacia la derecha apoyándose en el disco en el punto E, donde hay rodadura, hasta terminar en C. La distancia de B a E es raíz de siete por R. La figura está dibujada a escala, con R igual a 0,1 metros.</desc>
