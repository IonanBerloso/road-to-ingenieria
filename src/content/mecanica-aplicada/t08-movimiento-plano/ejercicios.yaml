        <line x1="50" y1="186" x2="160" y2="186" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="160" y1="186" x2="270" y2="186" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="105" y="198" font-size="9" text-anchor="middle" fill="var(--faint)">2R</text>
        <text x="215" y="198" font-size="9" text-anchor="middle" fill="var(--faint)">2R</text>
