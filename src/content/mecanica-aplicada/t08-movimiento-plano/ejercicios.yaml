    pide: La velocidad de D, las velocidades angulares del disco y de la barra, la velocidad de C y la aceleración angular del disco.
    pasos:
      - tipo: reconocer
        pregunta: |
          La rueda dentada 3 rueda sobre una cremallera **fija**. ¿Cuál es su
          centro instantáneo de rotación, y qué velocidad tiene $D$?
        opciones:
          - texto: >-
              El punto de contacto con la cremallera; D está diametralmente
              enfrente, así que va al doble que el centro
            correcta: true
            mensaje: |
              Eso es. Con el contacto como CIR, la velocidad crece con la
              distancia a él: el centro está a $R_3$ y $D$ a $2R_3$, así que
              $v_D = 2v_B = 0{,}4$ m/s.
          - texto: Su centro B, porque es el punto que se traslada
            mensaje: |
              $B$ se mueve a 0,2 m/s: no puede ser el CIR, que es un punto de
              velocidad nula. El que está quieto en este instante es el diente
              apoyado en la cremallera.
          - texto: El punto D, porque es donde se articula la barra
            mensaje: |
              $D$ es justo el punto **más rápido** de la rueda: está a $2R_3$
              del contacto. Una articulación no obliga a que el punto esté
              quieto.

      - tipo: calcular
        titulo: La velocidad del punto D
        pregunta: |
          ¿Cuánto vale $v_D$, en m/s?
        respuesta:
          tipo: numero
          valor: '0.4'
          tolerancia: 0.005
          formato: un número, en m/s
        distractores:
          - valor: '0.2'
            mensaje: |
              Esa es la de su centro $B$. La rueda gira además de trasladarse, y
              $D$ está al otro lado del contacto: a doble distancia del CIR,
              doble velocidad.
        pista: |
          $\omega_3 = v_B/R_3$, y $D$ está a $2R_3$ del punto de contacto.
        desarrollo: |
          $$
          \omega_3 = \frac{0{,}2}{0{,}2} = 1\ \text{rad/s}
          \qquad
          v_D = \omega_3 \cdot 2R_3 = 0{,}4\ \text{m/s}
          $$

          Vertical y hacia abajo, como $v_B$.

      - tipo: calcular
        titulo: La velocidad angular del disco 1
        pregunta: |
          ¿Cuánto vale $\omega_1$, en rad/s?
        respuesta:
          tipo: numero
          valor: '3.643'
          tolerancia: 0.02
          formato: un número, en rad/s
        distractores:
          - valor: '0.976'
            mensaje: |
              Ese número sale si el plano sube hacia la derecha. En la figura
              **baja**, así que entre $\vec{v}_C$ y la barra hay $75^{\circ}$ y
              no $15^{\circ}$: el factor es
              $\cos 30^{\circ} - \operatorname{sen}30^{\circ}$, no la suma.
          - valor: '1.333'
            mensaje: |
              Has hecho $v_D/R_1$, como si $C$ llevara la velocidad de $D$. La
              barra $CD$ gira, así que las velocidades de sus dos extremos son
              distintas.
        pista: |
          Proyecta sobre la barra: $\vec{v}_C \cdot \hat{u} = \vec{v}_D \cdot \hat{u}$,
          con $\hat{u}$ el unitario de $CD$. $\vec{v}_C$ es paralela al plano y
          vale $\omega_1 R_1$.
        desarrollo: |
          Con el plano bajando a $30^{\circ}$ y la barra subiendo a
          $45^{\circ}$, la proyección da

          $$
          \omega_1 R_1(\cos 30^{\circ} - \operatorname{sen}30^{\circ}) = v_D
          \;\Longrightarrow\;
          \omega_1 = \frac{0{,}4}{0{,}3 \cdot 0{,}36603} = 3{,}643\ \text{rad/s}
          $$

          Y entonces $v_C = \omega_1 R_1 = 1{,}093$ m/s y
          $\omega_2 = 0{,}267$ rad/s.

      - tipo: calcular
        titulo: La aceleración angular del disco 1
        pregunta: |
          ¿Cuánto vale $\alpha_1$, en rad/s²?
        respuesta:
          tipo: numero
          valor: '6.436'
          tolerancia: 0.02
          formato: un número, en rad/s²
        distractores:
          - valor: '1.821'
            mensaje: |
              Te has dejado la normal de la barra,
              $\omega_2^{2}\,CD = 0{,}358$ m/s². Con 5 metros de barra ese
              término pesa más que el del engranaje aunque $\omega_2$ sea
              pequeña.
          - valor: '0'
            mensaje: |
              Que $v_B$ sea constante hace $\alpha_3 = 0$, no $\alpha_1 = 0$. La
              relación entre las velocidades depende del ángulo de la barra, que
              está cambiando.
        pista: |
          $\vec{a}_D$ es solo la normal del engranaje, $\omega_3^{2}R_3$
          horizontal. Y ojo con $\vec{a}_C$: el disco rueda sobre una **recta**,
          así que su centro va en línea recta y $\vec{a}_C$ es paralela al plano.
        desarrollo: |
          $$
          \alpha_1 = \frac{\omega_3^{2}R_3 + 2\,\omega_2^{2}\,CD\cos 45^{\circ}}
          {R_1(\cos 30^{\circ} - \operatorname{sen}30^{\circ})}
          = \frac{0{,}2 + 0{,}507}{0{,}1098} = 6{,}436\ \text{rad/s}^{2}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La rueda 3 rueda sobre una cremallera fija, así que
              $\omega_3 = v_B/R_3 = 1$ rad/s y $v_D = 2R_3\omega_3 = 0{,}4$ m/s,
              vertical.
          - texto: >-
              $\vec{v}_C$ es paralela al plano y vale $\omega_1 R_1$; igualando
              las proyecciones sobre la barra salen
              $\omega_1 = 3{,}64$ rad/s, $v_C = 1{,}093$ m/s y
              $\omega_2 = 0{,}267$ rad/s.
          - texto: >-
              En aceleraciones, $\vec{a}_C$ es paralela al plano y vale
              $\alpha_1 R_1$, y con la normal de la barra sale
              $\alpha_1 = 6{,}44$ rad/s².
          - texto: >-
              Como el punto de contacto del disco 1 es su CIR, la aceleración
              de $C$ tiene una componente normal $\omega_1^{2}R_1$ dirigida
              hacia él.
            trampa: true
            mensaje: |
              El CIR **no es un punto fijo**, así que no sirve de centro de giro
              para las aceleraciones. Aquí $C$ recorre una recta paralela al
              plano, de modo que $\vec{a}_C$ es puramente tangencial y vale
              $\alpha_1 R_1$: si le añades una normal, $\alpha_1$ sale
              disparada.
    resolucion: |
      **El engranaje.** Rueda sobre una cremallera fija, así que su CIR es el
      punto de contacto:

      $$
      \omega_3 = \frac{v_B}{R_3} = 1\ \text{rad/s}
      \qquad
      v_D = \omega_3\,(2R_3) = 0{,}4\ \text{m/s}\ \text{hacia abajo}
      $$

      **La barra.** El plano baja hacia la derecha a $30^{\circ}$ y la barra
      sube a $45^{\circ}$, así que entre $\vec{v}_C$ —paralela al plano— y la
      barra hay $75^{\circ}$. Igualando las proyecciones de $\vec{v}_C$ y
      $\vec{v}_D$ sobre la barra:

      $$
      \omega_1 R_1(\cos 30^{\circ} - \operatorname{sen}30^{\circ}) = v_D
      \;\Longrightarrow\;
      \omega_1 = 3{,}64\ \text{rad/s}
      $$

      $$
      v_C = \omega_1 R_1 = 1{,}093\ \text{m/s}
      \qquad
      \omega_2 = \frac{\omega_1 R_1\cos 30^{\circ}}{CD\cos 45^{\circ}} = 0{,}267\ \text{rad/s}
      $$

      **Aceleraciones.** $B$ baja a velocidad constante, así que $a_B = 0$ y
      $\alpha_3 = 0$: a $D$ solo le queda la normal respecto de $B$,
      $\omega_3^{2}R_3 = 0{,}2$ m/s², horizontal. Y $C$, centro de un disco que
      rueda sobre una recta, describe una recta paralela al plano: su
      aceleración es tangencial y vale $\alpha_1 R_1$. Con eso,

      $$
      \alpha_1 = \frac{\omega_3^{2}R_3 + 2\,\omega_2^{2}CD\cos 45^{\circ}}
      {R_1(\cos 30^{\circ} - \operatorname{sen}30^{\circ})} = 6{,}44\ \text{rad/s}^{2}
      $$

      **Sobre la geometría.** El resultado depende de que el plano **baje**
      hacia la derecha, como está dibujado: si subiera, entre $\vec{v}_C$ y la
      barra habría $15^{\circ}$ y saldría $\omega_1 = 0{,}98$ rad/s en vez de
      3,64.

  - id: ejma8-col88-el-compresor-de-yugo-escoces
    titulo: La velocidad máxima del émbolo de un compresor
    fuente: >-
      Ejercicio 8.8 · Tema 8, «Análisis del movimiento plano» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado y el
      profesor su resolución, contra los que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      El mecanismo que se observa en la figura se emplea para comprimir aire. Si
      la pieza giratoria de 30 cm de longitud gira a una velocidad angular
      constante de 15 rpm, determinar cuándo se da la velocidad máxima del
      émbolo y su valor en ese instante. Se recomienda tomar como origen
      temporal la posición con $x = 0$.

      <figure>
      <svg viewBox="0 0 390 250" role="img" width="390" height="250" aria-labelledby="ejma8-col88-t ejma8-col88-d">
        <title id="ejma8-col88-t">Yugo escocés: manivela que arrastra una corredera vertical ranurada unida al vástago del émbolo</title>
        <desc id="ejma8-col88-d">Una pieza giratoria 1 de 30 centímetros gira a 15 revoluciones por minuto constantes alrededor del punto fijo O. Su extremo A es un pasador que corre por la ranura vertical de la pieza 2, una corredera que solo puede moverse en horizontal. De la corredera sale el vástago del émbolo hacia la derecha, hasta el pistón que se mueve dentro del cilindro. La distancia x se mide desde la vertical de O hasta la corredera. La figura está dibujada a escala.</desc>
