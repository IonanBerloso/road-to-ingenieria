        <path d="M50 150 L42 161 L58 161 z" fill="none" stroke="var(--ink)" stroke-width="1.1"/>
        <path d="M41 165 L35 172 M49 165 L43 172 M57 165 L51 172" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
