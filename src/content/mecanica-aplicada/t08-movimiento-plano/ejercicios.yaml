        <path d="M82 103 L222 103 L152 208 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M20 30 H250" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M28 30 l-6 -8 M48 30 l-6 -8 M68 30 l-6 -8 M88 30 l-6 -8 M108 30 l-6 -8 M128 30 l-6 -8 M148 30 l-6 -8 M168 30 l-6 -8 M188 30 l-6 -8 M208 30 l-6 -8 M228 30 l-6 -8 M248 30 l-6 -8" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <line x1="40" y1="30" x2="82" y2="103" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
        <line x1="180" y1="30" x2="222" y2="103" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
        <circle cx="40" cy="30" r="3.4" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
        <circle cx="180" cy="30" r="3.4" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
        <circle cx="82" cy="103" r="3.4" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
        <circle cx="222" cy="103" r="3.4" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
        <path d="M65.9 32.3 A26 26 0 0 1 56.7 49.9" fill="none" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="72" y="62" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">ω<tspan font-size="7.5" dy="2.5">AB</tspan><tspan dy="-2.5"></tspan></text>
        <path d="M205.9 32.3 A26 26 0 0 1 196.7 49.9" fill="none" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="212" y="62" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">ω<tspan font-size="7.5" dy="2.5">CD</tspan><tspan dy="-2.5"></tspan></text>
        <line x1="82" y1="103" x2="47.4" y2="123" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="44" y="134" font-size="10" text-anchor="end" fill="var(--ink)" font-style="italic">v<tspan font-size="7.5" dy="2.5">B</tspan></text>
        <line x1="222" y1="103" x2="187.4" y2="123" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="184" y="136" font-size="10" text-anchor="end" fill="var(--ink)" font-style="italic">v<tspan font-size="7.5" dy="2.5">D</tspan></text>
        <circle cx="40" cy="30" r="2.4" fill="var(--ink)"/>
        <text x="33" y="24" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">A</text>
        <circle cx="180" cy="30" r="2.4" fill="var(--ink)"/>
        <text x="173" y="24" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">C</text>
        <circle cx="82" cy="103" r="2.4" fill="var(--ink)"/>
        <text x="90" y="96" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">B</text>
        <circle cx="222" cy="103" r="2.4" fill="var(--ink)"/>
        <text x="230" y="98" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">D</text>
        <circle cx="152" cy="208" r="2.4" fill="var(--ink)"/>
        <text x="160" y="214" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">E</text>
      </svg>
      <figcaption>

      Sin escala. Las velocidades de B y de D son perpendiculares a las barras, y las perpendiculares a ellas son las rectas de las barras mismas: dos rectas paralelas, que no se cortan. ω_AB se dibuja en el sentido de ω_CD, y el cálculo dirá su sentido. Ejes: x hacia la derecha, y hacia arriba; giros positivos en sentido antihorario.

      </figcaption>
      </figure>

      - **Las barras AB y CD** giran alrededor de sus puntos fijos, A y C:
        las velocidades de B y de D son perpendiculares a ellas. CD gira en
        sentido horario, y D va hacia abajo y a la izquierda.
      - **La placa** une B y D. Su CIR estaría donde se cortan las
        perpendiculares a $\vec{v}_B$ y a $\vec{v}_D$, que son las rectas AB y
        CD; pero son paralelas, y no se cortan.

      Con A en el origen, x hacia la derecha e y hacia arriba, en metros:
      $\overrightarrow{AB} = \overrightarrow{CD} = 0{,}6\,(\cos 60^\circ;\ -\sin 60^\circ) = (0{,}3;\ -0{,}5196)$
      y $\overrightarrow{BD} = (1;\ 0)$, los 50 + 50 cm de la figura. El giro
      de CD, $-4\,\vec{k}$ rad/s. El sentido de $\alpha_{CD}$ no lo da la
      figura; se toma horario, como el de $\omega_{CD}$: $-2\,\vec{k}$
      rad/s². Con el otro cambia la dirección de la aceleración de la placa,
      pero no su módulo ni nada de lo que se pide.

      **2. Incógnitas.** $\omega_{AB}$, $\omega_{BDE}$, $\alpha_{AB}$ y
      $\alpha_{BDE}$; y la velocidad y la aceleración de la placa.

      **3. Ecuaciones.** La velocidad y la aceleración de D, desde C y desde
      B:

      $$
      \omega_{CD}\vec{k}\times\overrightarrow{CD}
      = \omega_{AB}\vec{k}\times\overrightarrow{AB} + \omega_{BDE}\vec{k}\times\overrightarrow{BD}
      $$

      $$
      \alpha_{CD}\vec{k}\times\overrightarrow{CD} - \omega_{CD}^{2}\,\overrightarrow{CD}
      = \alpha_{AB}\vec{k}\times\overrightarrow{AB} - \omega_{AB}^{2}\,\overrightarrow{AB}
      + \alpha_{BDE}\vec{k}\times\overrightarrow{BD} - \omega_{BDE}^{2}\,\overrightarrow{BD}
      $$

      **4. Resultados.** Con $\overrightarrow{CD} = \overrightarrow{AB}$,
      $\vec{k}\times\overrightarrow{AB} = (0{,}5196;\ 0{,}3)$ y
      $\vec{k}\times\overrightarrow{BD} = (0;\ 1)$, la primera queda

      $$
      (\omega_{CD} - \omega_{AB})\,(0{,}5196;\ 0{,}3) = \omega_{BDE}\,(0;\ 1)
      $$

      La componente x da $\omega_{AB} = \omega_{CD}$, y con ella la y da
      $\omega_{BDE} = 0$. En la segunda, los términos en $\omega^{2}$ se
      van, porque las dos barras giran igual y la placa no gira, y queda lo
      mismo con las aceleraciones angulares:

      $$
      (\alpha_{CD} - \alpha_{AB})\,(0{,}5196;\ 0{,}3) = \alpha_{BDE}\,(0;\ 1)
      $$

      $$
      \vec{\omega}_{BDE} = \vec{0},
      \qquad
      \vec{\alpha}_{BDE} = \vec{0},
      \qquad
      \vec{\omega}_{AB} = -4\,\vec{k}\ \text{rad/s},
      \qquad
      \vec{\alpha}_{AB} = -2\,\vec{k}\ \text{rad/s}^{2}
      $$

      La placa se traslada: todos sus puntos llevan la velocidad y la
      aceleración de B.

      $$
      \vec{v} = -4\,(0{,}5196;\ 0{,}3) = (-2{,}078;\ -1{,}2)\ \text{m/s},
      \qquad
      v = 2{,}4\ \text{m/s}
      $$

      $$
      \vec{a} = -2\,(0{,}5196;\ 0{,}3) - 16\,(0{,}3;\ -0{,}5196) = (-5{,}839;\ 7{,}714)\ \text{m/s}^{2},
      \qquad
      a = 9{,}675\ \text{m/s}^{2}
      $$

      **La placa no gira ni empieza a girar: $\omega_{BDE} = 0$ y
      $\alpha_{BDE} = 0$.** Sus puntos van a 2,4 m/s y aceleran 9,675 m/s².
      Coincide con lo que publica la colección, los dos ceros.

      **5. Comprobación.** La velocidad angular, por el CIR, que no se ha
      usado: las perpendiculares a $\vec{v}_B$ y a $\vec{v}_D$ son las rectas
      AB y CD, paralelas y distintas. No se cortan: la placa no tiene CIR a
      distancia finita, y se traslada.

      La aceleración angular, por la geometría a lo largo del tiempo. El
      cuadrilátero ABDC tiene siempre sus lados opuestos iguales: las dos
      barras, de 60 cm, y BD y AC, de 1 m, fijos por la placa y por el techo.
      Es siempre un paralelogramo, y BD se mantiene paralelo a AC: la
      orientación de la placa no cambia nunca, y sus dos derivadas,
      $\omega_{BDE}$ y $\alpha_{BDE}$, son nulas en todo instante.

      Y el módulo de la aceleración, por sus componentes intrínsecas: B
      recorre una circunferencia de 0,6 m de radio alrededor de A, con
      normal $\omega^{2}L$ y tangencial $\alpha L$, perpendiculares entre sí:

      $$
      a = \sqrt{(16\cdot 0{,}6)^{2} + (2\cdot 0{,}6)^{2}} = \sqrt{9{,}6^{2} + 1{,}2^{2}} = 9{,}675\ \text{m/s}^{2}
      $$

      Lo mismo.

      **Lo que dice el resultado.** No girar no es estar quieto: la placa se
      traslada, y cada uno de sus puntos describe un arco de 60 cm de radio,
      como la cabina de una noria, que no vuelca mientras la rueda gira. Las
      cotas del triángulo, los 50 y los 25 cm, no intervienen: el resultado
      no depende de la forma de la placa, solo de que cuelgue de dos barras
      iguales y paralelas.

  - id: ejma8-col811-el-disco-y-la-barra-con-el-cir-en-a
    titulo: Un disco cuyo centro instantáneo está en el extremo de la barra
    fuente: >-
      Ejercicio 8.11 · Tema 8, «Análisis del movimiento plano» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado y el
      profesor su resolución, contra los que está contrastado el desarrollo. El
      resultado es simbólico, así que las casillas piden el coeficiente que
      multiplica a la expresión indicada en cada pregunta.
    nivel: practica
    antes:
      idea: |
        Un punto del disco, visto desde la barra, que gira, tiene dos
        movimientos a la vez: el del punto de la barra con el que coincide en
        ese instante, el arrastre, y el suyo respecto de la barra, el
        relativo. Las velocidades se suman; en las aceleraciones aparece
        además el término de Coriolis. Visto desde la barra, el disco es un
        sólido que gira con la diferencia de las dos velocidades angulares.
      formula: |
        La composición de movimientos, con $\vec{\omega}_1$ y $\vec{\alpha}_1$
        el giro y la aceleración angular de la barra y O su punto fijo:

        $$
        \vec{v}_P = \vec{\omega}_1\times\overrightarrow{OP} + \vec{v}_{P/1}
        $$

        $$
        \vec{a}_P = \vec{\alpha}_1\times\overrightarrow{OP} - \omega_1^{2}\,\overrightarrow{OP}
        + \vec{a}_{P/1} + 2\,\vec{\omega}_1\times\vec{v}_{P/1}
        $$

        Y el movimiento del disco respecto de la barra:
        $\omega_r = \omega_2 - \omega_1$ y $\alpha_r = \alpha_2 - \alpha_1$.
      reconocer: |
        Antes de calcular se mira qué da el enunciado de cada sólido y para
        qué instante lo da.
    enunciado: |
      En el sistema de la figura, el centro $C$ del disco de radio $R$ se mueve
      con velocidad $v$ constante. En el sistema representado, el CIR del disco
      se encuentra en la posición del punto $A$, cumpliéndose que
      $\omega_1 = v/(2R)$ y $\omega_2 = -v/(2R)$. Calcular para ese instante:

      a) Velocidad relativa de los puntos $C$ y $D$ del disco respecto a la
      barra.

      b) Aceleración relativa del punto $D$ del disco respecto a la barra.

      c) Aceleración angular de la barra (1).

      d) Aceleración angular del disco (2).

      <figure>
      <svg viewBox="0 0 340 270" role="img" width="340" height="270" aria-labelledby="ejma8-col811-t ejma8-col811-d">
        <title id="ejma8-col811-t">Barra OA inclinada 60 grados sobre el suelo y disco de centro C apoyado en el suelo, con D sobre la barra</title>
        <desc id="ejma8-col811-d">Del punto fijo O, en el suelo, sale la barra 1 hacia arriba y a la derecha formando 60 grados con la horizontal; su extremo A está a dos raíz de tres por R de O. El disco 2, de radio R y centro C, se apoya en el suelo justo debajo de A, y su borde pasa por D, el punto medio de la barra. En el instante representado el centro instantáneo de rotación del disco está en A. La figura está dibujada a escala.</desc>
        <defs>
          <marker id="ejma8-col811-fl" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
        </defs>
