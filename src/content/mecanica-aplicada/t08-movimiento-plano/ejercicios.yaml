    pide: La velocidad angular y la aceleración angular de la placa triangular.
    pasos:
      - tipo: reconocer
        pregunta: |
          $AB$ y $CD$ son iguales y paralelas, y la placa las une por $B$ y $D$.
          ¿Cómo se mueve la placa?
        opciones:
          - texto: >-
              Se traslada, porque ABDC es un paralelogramo articulado y BD se
              mantiene siempre paralelo a AC
            correcta: true
            mensaje: |
              Eso es. Con los dos lados opuestos iguales y paralelos, $BD$ no
              puede cambiar de orientación: la placa se mueve sin girar y todos
              sus puntos describen circunferencias iguales de radio 60 cm.
          - texto: Gira alrededor de E, que es el vértice libre de la placa
            mensaje: |
              $E$ no está sujeto a nada: es un punto más de la placa y se mueve
              como los demás. Nada obliga a que su velocidad sea nula.
          - texto: Gira con la velocidad angular de las barras, 4 rad/s, porque va unida a ellas
            mensaje: |
              Ir unida a un sólido que gira no obliga a girar con él. Es la misma
              idea que la plataforma de una noria, que se mantiene horizontal
              mientras la rueda da vueltas.

      - tipo: calcular
        titulo: La velocidad angular de la placa
        pregunta: |
          ¿Cuánto vale $\omega_{BDE}$, en rad/s?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.01
          formato: un número, en rad/s
        distractores:
          - valor: '4'
            mensaje: |
              Esa es la de las barras. La placa está articulada a ellas, pero en
              un paralelogramo la barra gira y la biela opuesta se traslada: son
              movimientos distintos.
          - valor: '2'
            mensaje: |
              Ese es el valor de $\alpha_{CD}$, que además es una aceleración
              angular. La velocidad angular de la placa sale de comparar
              $\vec{v}_B$ y $\vec{v}_D$, y son iguales.
        pista: |
          Calcula $\vec{v}_B$ y $\vec{v}_D$ por separado y compáralos: si son
          iguales, $\vec{\omega}\times\overrightarrow{BD} = 0$ y, con $BD$ no
          nulo, $\omega = 0$.
        desarrollo: |
          Las dos barras giran igual —lo impone el paralelogramo—, así que

          $$
          \vec{v}_B = \vec{\omega}_{CD}\times\overrightarrow{AB}
          \qquad
          \vec{v}_D = \vec{\omega}_{CD}\times\overrightarrow{CD}
          $$

          y como $\overrightarrow{AB} = \overrightarrow{CD}$, los dos vectores
          coinciden. Entonces
          $\vec{\omega}_{BDE}\times\overrightarrow{BD} = 0$ y
          $\omega_{BDE} = 0$.

      - tipo: calcular
        titulo: La velocidad de cualquier punto de la placa
        pregunta: |
          Si la placa se traslada, todos sus puntos van igual. ¿A qué velocidad,
          en m/s?
        respuesta:
          tipo: numero
          valor: '2.4'
          tolerancia: 0.02
          formato: un número, en m/s
        distractores:
          - valor: '4'
            mensaje: |
              Eso son rad/s, la velocidad angular de las barras. Para pasar a
              m/s hay que multiplicar por la longitud de la barra, 0,60 m.
          - valor: '1.2'
            mensaje: |
              Has usado 30 cm, que es la proyección horizontal de la barra, en
              lugar de su longitud real de 60 cm.
        pista: |
          Todos los puntos llevan la velocidad de $B$, y $B$ gira alrededor de
          $A$ con $AB = 0{,}60$ m.
        desarrollo: |
          $$
          v = \omega_{CD}\,AB = 4 \cdot 0{,}60 = 2{,}4\ \text{m/s}
          $$

          perpendicular a las barras.

      - tipo: calcular
        titulo: La aceleración de cualquier punto de la placa
        pregunta: |
          ¿Y cuánto vale la aceleración de cualquier punto de la placa, en
          m/s²?
        respuesta:
          tipo: numero
          valor: '9.675'
          tolerancia: 0.03
          formato: un número, en m/s²
        distractores:
          - valor: '9.6'
            mensaje: |
              Esa es solo la componente normal, $\omega^{2}\,AB$. Como hay
              aceleración angular, falta la tangencial $\alpha\,AB = 1{,}2$
              m/s², perpendicular a la anterior.
          - valor: '1.2'
            mensaje: |
              Esa es solo la tangencial, $\alpha\,AB$. La normal
              $\omega^{2}AB = 9{,}6$ m/s² es aquí ocho veces mayor, y las dos se
              componen en cuadratura.
        pista: |
          La placa se traslada, así que su aceleración es la de $B$, y $B$ gira
          alrededor de $A$: normal $\omega^{2}AB$ más tangencial $\alpha\,AB$,
          perpendiculares entre sí.
        desarrollo: |
          $$
          a = AB\sqrt{\alpha^{2} + \omega^{4}} = 0{,}60\sqrt{4 + 256}
          = 0{,}60 \cdot 16{,}125 = 9{,}675\ \text{m/s}^{2}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $AB$ y $CD$ son iguales y paralelas, así que $ABDC$ es un
              paralelogramo articulado y las dos barras giran igual.
          - texto: >-
              Entonces $\vec{v}_B = \vec{v}_D$ y
              $\vec{\omega}_{BDE}\times\overrightarrow{BD} = 0$, de donde
              $\omega_{BDE} = 0$.
          - texto: >-
              Repitiendo el argumento con aceleraciones,
              $\vec{a}_B = \vec{a}_D$ y también $\alpha_{BDE} = 0$.
          - texto: >-
              Como la placa no gira, todos sus puntos están en reposo y su
              aceleración es nula.
            trampa: true
            mensaje: |
              No girar no es estar quieto. La placa se **traslada**, y sus
              puntos van a 2,4 m/s con una aceleración de 9,675 m/s²
              —describiendo cada uno un arco de 60 cm de radio—. Lo que vale
              cero es la velocidad angular, no la velocidad.
    resolucion: |
      **Un paralelogramo articulado.** $AB$ y $CD$ miden lo mismo y están
      dibujadas paralelas, así que $ABDC$ es un paralelogramo: las dos barras
      giran con la misma velocidad y la misma aceleración angular, y el
      segmento $BD$ se mantiene siempre paralelo a $AC$.

      **La placa se traslada.** Con
      $\overrightarrow{AB} = \overrightarrow{CD}$,

      $$
      \vec{v}_B = \vec{\omega}_{CD}\times\overrightarrow{AB}
      = \vec{\omega}_{CD}\times\overrightarrow{CD} = \vec{v}_D
      $$

      y de $\vec{v}_D = \vec{v}_B + \vec{\omega}_{BDE}\times\overrightarrow{BD}$
      sale $\vec{\omega}_{BDE}\times\overrightarrow{BD} = 0$. Como
      $\overrightarrow{BD}$ no es nulo,

      $$
      \omega_{BDE} = 0
      $$

      **Y lo mismo con las aceleraciones.** El mismo razonamiento con
      $\vec{a}_B$ y $\vec{a}_D$ —que también coinciden, porque las dos barras
      comparten $\omega$ y $\alpha$— da

      $$
      \alpha_{BDE} = 0
      $$

      **Lo que sí se mueve.** Cada punto de la placa describe un arco de 60 cm
      de radio, con

      $$
      v = 4 \cdot 0{,}60 = 2{,}4\ \text{m/s}
      \qquad
      a = 0{,}60\sqrt{2^{2}+4^{4}} = 9{,}675\ \text{m/s}^{2}
      $$

      Las cotas del triángulo —los 50 cm y los 25 cm— no intervienen: el
      resultado no depende de la forma de la placa, solo de que sus dos
      articulaciones cuelguen de barras iguales y paralelas.

  - id: ejma8-col811-el-disco-y-la-barra-con-el-cir-en-a
    titulo: Un disco cuyo centro instantáneo está en el extremo de la barra
    fuente: >-
      Ejercicio 8.11 · Tema 8, «Análisis del movimiento plano» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado y el
      profesor su resolución, contra los que está contrastado el desarrollo. El
      resultado es simbólico, así que las casillas piden el coeficiente que
      multiplica a la expresión indicada en cada pregunta.
    nivel: practica
    enunciado: |
      En el sistema de la figura, el centro $C$ del disco de radio $R$ se mueve
      con velocidad $v$ constante. En el sistema representado, el CIR del disco
      se encuentra en la posición del punto $A$, cumpliéndose que
      $\omega_1 = v/(2R)$ y $\omega_2 = -v/(2R)$. Calcular para ese instante:

      a) Velocidad relativa de los puntos $C$ y $D$ del disco respecto a la
      barra.

      b) Aceleración relativa del punto $D$ del disco respecto a la barra.

      c) Aceleración angular de la barra (1).

      d) Aceleración angular del disco (2).

      <figure>
      <svg viewBox="0 0 340 270" role="img" width="340" height="270" aria-labelledby="ejma8-col811-t ejma8-col811-d">
