    pide: La velocidad angular del disco 2, la velocidad de deslizamiento en su contacto con la chapa y su aceleración angular.
    pasos:
      - tipo: reconocer
        pregunta: |
          En $C$ y en $D$ los discos tocan la chapa, pero hay deslizamiento.
          ¿Qué condición se puede imponer entonces en cada contacto?
        opciones:
          - texto: >-
              Que las componentes normales de las dos velocidades coincidan; la
              diferencia tangencial es la velocidad de deslizamiento
            correcta: true
            mensaje: |
              Eso es. Los sólidos no se separan ni se penetran, así que la
              componente perpendicular al plano tangente es común; lo que puede
              diferir es la componente a lo largo del contacto, y esa diferencia
              es justo lo que el enunciado llama velocidad de deslizamiento.
          - texto: Que las dos velocidades sean iguales, como en una rodadura
            mensaje: |
              Eso sería rodadura sin deslizamiento, y aquí el propio enunciado
              pide la velocidad de deslizamiento, que sale $1{,}5\,\omega R$.
              Si fueran iguales, esa velocidad sería cero.
          - texto: Que el punto de contacto tenga velocidad nula por ser el CIR
            mensaje: |
              El punto de contacto solo es CIR cuando un sólido rueda sobre otro
              que está **fijo**. Aquí los dos se mueven: el disco gira alrededor
              de $G$ y la chapa alrededor de $O$.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **los tres sólidos, cada uno con
          su punto fijo, y en C y en D las velocidades de los dos puntos que se
          tocan**. Solo las direcciones, sin escala.
        comprueba:
          - punto: |
              **En C, la velocidad del disco 1, perpendicular a GC, hacia
              arriba y a la izquierda.**
            porque: |
              El disco 1 gira en sentido antihorario alrededor de G, que está
              en su periferia, a la izquierda: C, arriba y a la derecha de G,
              va hacia arriba y a la izquierda.
          - punto: |
              **La chapa gira en sentido horario: en C, su velocidad es
              perpendicular a OC, hacia arriba y a la izquierda; en D,
              perpendicular a OD, hacia abajo y a la izquierda.**
            porque: |
              La base de la chapa es horizontal, y en C la normal común es
              vertical: la chapa no puede separarse del disco ni penetrarlo, y
              tiene que subir con él. C está a la izquierda de O: para subirlo,
              la chapa gira en sentido horario, y ese giro baja D, que está a
              la derecha de O.
          - punto: |
              **El disco 2 gira en sentido antihorario: en D, su velocidad es
              perpendicular a HD, hacia abajo y a la izquierda.**
            porque: |
              En D la normal común también es vertical, y el disco tiene que
              bajar con la chapa. D está a la izquierda de H, su punto fijo:
              para bajarlo, el disco 2 gira en sentido antihorario.
