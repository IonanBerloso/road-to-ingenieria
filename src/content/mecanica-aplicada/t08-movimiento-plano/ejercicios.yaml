    pide: La velocidad angular y la aceleración angular de AB, la velocidad y la aceleración de A, y el polo de aceleraciones de AB.
    pasos:
      - tipo: reconocer
        pregunta: |
          El disco sube rodando con $\omega$ **constante**. ¿Cuánto valen la
          aceleración de su centro $O$ y la de su punto de contacto con el plano?
        opciones:
          - texto: >-
              La del centro es nula y la del contacto vale omega al cuadrado por
              R, dirigida hacia el centro
            correcta: true
            mensaje: |
              Eso es. $O$ recorre una recta paralela al plano a velocidad
              constante $\omega R$, así que $\vec{a}_O = 0$; y el punto de
              contacto, que tiene velocidad nula, se despega un instante después
              con $\vec{a} = \omega^{2}R$ hacia $O$.
          - texto: Las dos son nulas, porque la velocidad angular es constante
            mensaje: |
              La del centro sí, pero la del contacto no. Su velocidad vale cero
              **en este instante** y deja de valerlo enseguida: una velocidad que
              cambia es una aceleración.
          - texto: La del centro vale omega al cuadrado por R hacia el contacto, y la del contacto es nula
            mensaje: |
              Justo al revés, y es la confusión más cara del tema. El punto de
              contacto es el CIR, y el CIR sirve de centro de giro para las
              **velocidades**, nunca para las aceleraciones.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el disco, la barra y el plano,
          con las velocidades de O y de B, la dirección de la de A y las
          perpendiculares a las de A y de B**. Solo las direcciones, sin
          escala.
        comprueba:
          - punto: |
              **$\vec{v}_O$ y $\vec{v}_B$, paralelas al plano, plano arriba.**
            porque: |
              El disco rueda sin deslizar sobre un plano fijo: gira alrededor
              del contacto, en sentido horario para subir, y O y B están en la
              perpendicular al plano por el contacto.
          - punto: |
              **$\vec{v}_A$, paralela al plano.**
            porque: |
              A es una deslizadera que corre por el plano. Su sentido no se ve
              todavía: se dibuja plano arriba, y el cálculo dirá su sentido.
          - punto: |
              **Las perpendiculares a $\vec{v}_A$ y a $\vec{v}_B$, las dos
              perpendiculares al plano: paralelas, sin punto de corte.**
            porque: |
              Las dos velocidades son paralelas al plano, así que sus
              perpendiculares son paralelas entre sí. Y no coinciden: la barra
              está inclinada respecto del plano, y A y B no están en la misma
              perpendicular.
