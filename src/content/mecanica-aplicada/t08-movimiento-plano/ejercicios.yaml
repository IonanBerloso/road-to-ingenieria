        <text x="114" y="156" font-size="10" text-anchor="end" fill="var(--ink)" font-style="italic">v<tspan font-size="7.5" dy="2.5">A</tspan></text>
        <line x1="120" y1="130" x2="150" y2="100" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="154" y="100" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">v<tspan font-size="7.5" dy="2.5">C</tspan></text>
        <circle cx="40" cy="170" r="2.4" fill="var(--ink)"/>
        <text x="28" y="176" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">O<tspan font-size="7.5" dy="2.5">2</tspan><tspan dy="-2.5"></tspan></text>
        <circle cx="40" cy="130" r="2.4" fill="var(--ink)"/>
        <text x="32" y="126" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">B</text>
        <circle cx="120" cy="130" r="2.4" fill="var(--ink)"/>
        <text x="110" y="124" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">C</text>
        <circle cx="120" cy="170" r="2.4" fill="var(--ink)"/>
        <text x="112" y="186" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">A</text>
        <circle cx="200" cy="170" r="2.4" fill="var(--ink)"/>
        <text x="212" y="186" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">O<tspan font-size="7.5" dy="2.5">1</tspan><tspan dy="-2.5"></tspan></text>
      </svg>
      <figcaption>

      Sin escala. La velocidad de C tiene la componente horizontal de la de B, porque BC es horizontal, y la vertical de la de A, porque AC es vertical: las dos valen 2ωR, y la de C va a 45°. Ejes: x hacia la derecha, y hacia arriba; giros positivos en sentido antihorario.

      </figcaption>
      </figure>

      - **$O_2B$ y $O_1A$** giran alrededor de sus puntos fijos, las dos en
        sentido horario: B va hacia la derecha a $2\omega R$, y A, como punto
        de la barra 4, hacia arriba a $\omega \cdot 2R = 2\omega R$.
      - **El disco** rueda sin deslizar sobre la barra 4: su punto A lleva la
        velocidad del punto A de la barra. La barra se mueve, y ese punto no
        está quieto.
      - **C** es común al disco y a BC: lleva la componente horizontal de
        $\vec{v}_B$, porque BC es horizontal, y la vertical de $\vec{v}_A$,
        porque CA es vertical. Va a 45°, hacia arriba y a la derecha.

      Con $O_2$ en el origen, x hacia la derecha e y hacia arriba:
      $B = (0;\ R)$, $C = (2R;\ R)$, $A = (2R;\ 0)$ y $O_1 = (4R;\ 0)$.

      **2. Incógnitas.** $\omega_d$ y $\omega_{BC}$; los dos CIR;
      $\alpha_d$ y $\alpha_{BC}$.

      **3. Ecuaciones.** C, desde B por la barra BC y desde A por el disco:

      $$
      \vec{v}_C = \vec{v}_B + \omega_{BC}\vec{k}\times\overrightarrow{BC}
      = \vec{v}_A + \omega_d\vec{k}\times\overrightarrow{AC}
      $$

      con $\vec{v}_B = -2\omega\vec{k}\times\overrightarrow{O_2B}$ y
      $\vec{v}_A = -\omega\vec{k}\times\overrightarrow{O_1A}$. Cada CIR, en la
      perpendicular a la velocidad de uno de sus puntos, a la distancia
      $v/|\omega|$.

      En aceleraciones, C desde B por la barra BC, y C visto desde la barra 4.
      El disco la toca siempre, así que C se mantiene a R de ella: visto
      desde la barra, corre paralelo a ella, y su aceleración relativa es
      horizontal.

      $$
      \vec{a}_C = \vec{a}_B + \alpha_{BC}\vec{k}\times\overrightarrow{BC} - \omega_{BC}^{2}\,\overrightarrow{BC}
      $$

      $$
      \vec{a}_C = -\omega^{2}\,\overrightarrow{O_1C} + a_{C/4}\,\vec{i} + 2\,(-\omega\vec{k})\times\vec{v}_{C/4}
      $$

      con $\vec{a}_B = -4\omega^{2}\,\overrightarrow{O_2B}$, porque $O_2B$ y la
      barra 4 giran a velocidad constante. Y en el contacto, la rodadura
      iguala las componentes tangenciales, aquí horizontales, de las
      aceleraciones del punto A del disco y del punto A de la barra:

      $$
      \left(\vec{a}_C + \alpha_d\vec{k}\times\overrightarrow{CA} - \omega_d^{2}\,\overrightarrow{CA}\right)\cdot\vec{i}
      = \left(-\omega^{2}\,\overrightarrow{O_1A}\right)\cdot\vec{i}
      $$

      **4. Resultados.** Con $\vec{v}_B = (2\omega R;\ 0)$ y
      $\vec{v}_A = (0;\ 2\omega R)$:

      $$
      (2\omega R;\ 2R\,\omega_{BC}) = (-R\,\omega_d;\ 2\omega R)
      $$

      $$
      \vec{\omega}_d = -2\omega\,\vec{k},
      \qquad
      \vec{\omega}_{BC} = \omega\,\vec{k},
      \qquad
      \vec{v}_C = (2\omega R;\ 2\omega R)
      $$

      Los CIR. El del disco, en la horizontal por A, a
      $2\omega R/2\omega = R$, a su derecha: el disco gira en sentido horario
      y A sube. El de BC, en la vertical por B, a $2\omega R/\omega = 2R$,
      por encima: BC gira en sentido antihorario y B va hacia la derecha.

      $$
      I_d = (3R;\ 0),
      \qquad
      I_{BC} = (0;\ 3R)
      $$

      <figure class="figura-examen">
      <svg viewBox="2 40 228 158" role="img" width="342" height="237" aria-labelledby="dsl-t dsl-d">
