      - tipo: calcular
        titulo: La velocidad angular de la barra 2
        pregunta: |
          Escribiendo $\vec{\omega}_2 = k\,\omega_0\vec{k}$, ¿cuánto vale el
          coeficiente $k$, en valor absoluto?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.01
          formato: un número, el coeficiente que multiplica a omega cero
        distractores:
          - valor: '1'
            mensaje: |
              Has supuesto que todo el mecanismo gira a la velocidad del disco.
              La barra 2 gira alrededor de $C$, y $B$ está a $2R$ de $C$
              mientras que $A$ está a $R$ de $O$: la misma velocidad repartida
              sobre el doble de brazo da la mitad de $\omega$.
          - valor: '0.3333'
            mensaje: |
              Parece que has dividido entre $3R$, la distancia de $C$ hasta
              $A$. El punto de la barra 2 cuya velocidad conoces es $B$, y está
              a $2R$ de $C$.
        pista: |
          $v_A = \omega_0 R$, y como la barra 1 se traslada, $v_B = v_A$. La
          barra 2 gira alrededor del punto fijo $C$, con $CB = 2R$.
        desarrollo: |
          $$
          v_B = v_A = \omega_0 R
          \qquad
          \omega_2 = \frac{v_B}{CB} = \frac{\omega_0 R}{2R} = \frac{\omega_0}{2}
          $$

          En sentido contrario al del disco: si $\omega_0$ es antihoraria,
          $\vec{\omega}_2 = -\tfrac{1}{2}\omega_0\vec{k}$.

      - tipo: calcular
        titulo: La aceleración angular de la barra 1
        pregunta: |
          Escribiendo $\vec{\alpha}_1 = k\,\omega_0^{2}\vec{k}$, ¿cuánto vale
          $k$?
        respuesta:
          tipo: numero
          valor: '1.5'
          tolerancia: 0.02
          formato: un número, el coeficiente que multiplica a omega cero al cuadrado
        distractores:
          - valor: '1'
            mensaje: |
              Te has dejado la aceleración normal de la barra 2. $B$ gira
              alrededor de $C$, así que además de la tangencial tiene
              $\omega_2^{2}\,CB = 0{,}5\,\omega_0^{2}R$ apuntando hacia $C$.
          - valor: '3'
            mensaje: |
              Has usado $\omega_2 = \omega_0$ en el término normal. La barra 2
              gira a la mitad, y en el término normal esa mitad va al cuadrado.
        pista: |
          Proyecta $\vec{a}_B = \vec{a}_A + \vec{\alpha}_1 \times \overrightarrow{AB}$
          sobre la horizontal, sabiendo que $a_A = \omega_0^{2}R$ hacia $O$ y que
          $\vec{a}_B$ solo tiene la normal hacia $C$ más la tangencial vertical.
        desarrollo: |
          Con $\omega_1 = 0$, la horizontal de $\vec{a}_B$ vista desde la barra
          1 es $-\omega_0^{2}R + \alpha_1 R$, y vista desde la barra 2 es la
          normal hacia $C$, que vale $\omega_2^{2}\,2R$:

          $$
          -\omega_0^{2}R + \alpha_1 R = \frac{\omega_0^{2}}{4}\,2R
          \;\Longrightarrow\;
          \alpha_1 = \frac{3}{2}\,\omega_0^{2}
          $$

          Y la vertical da $\alpha_2 = 0$.

      - tipo: calcular
        titulo: La aceleración del centro de gravedad de la barra 1
        pregunta: |
          Escribiendo $a_{G1} = k\,\omega_0^{2}R$, ¿cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '0.25'
          tolerancia: 0.005
          formato: un número, el coeficiente que multiplica a omega cero al cuadrado por R
        distractores:
          - valor: '1'
            mensaje: |
              Ese es el módulo de $\vec{a}_A$. $G_1$ no es $A$: está $R/2$ más
              abajo, y el giro de la barra 1 le añade $\alpha_1 R/2$ en
              horizontal.
          - valor: '0.5'
            mensaje: |
              Has usado la longitud entera de la barra, $R$, en vez de la
              distancia de $A$ a su punto medio, que es $R/2$.
        pista: |
          $\vec{a}_{G1} = \vec{a}_A + \vec{\alpha}_1 \times \overrightarrow{AG_1}$,
          con $AG_1 = R/2$ y $\omega_1 = 0$.
        desarrollo: |
          $$
          a_{G1} = -\omega_0^{2}R + \frac{3}{2}\,\omega_0^{2}\cdot\frac{R}{2}
          = -\frac{1}{4}\,\omega_0^{2}R
          $$

          Y por el otro lado, con $\alpha_2 = 0$, el punto medio de la barra 2
          solo tiene normal hacia $C$:
          $a_{G2} = \omega_2^{2}\,R = \tfrac{1}{4}\omega_0^{2}R$. Los dos módulos
          coinciden.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $v_A$ es vertical porque $OA$ es horizontal, y $v_B$ también
              porque $CB$ lo es; con $AB$ vertical, la barra 1 se traslada y
              $\omega_1 = 0$.
          - texto: >-
              De $v_B = \omega_0 R$ y $CB = 2R$ sale
              $\omega_2 = \omega_0/2$, en sentido contrario al del disco.
          - texto: >-
              Proyectando el campo de aceleraciones sobre la horizontal,
              $\alpha_1 = \tfrac{3}{2}\omega_0^{2}$; sobre la vertical,
              $\alpha_2 = 0$.
          - texto: >-
              La barra 1 no gira, así que su aceleración angular también es
              nula.
            trampa: true
            mensaje: |
              $\omega_1 = 0$ **en este instante**, y eso no dice nada de
              $\alpha_1$. Un instante después las dos velocidades dejan de ser
              paralelas y la barra empieza a girar: de hecho
              $\alpha_1 = 1{,}5\,\omega_0^{2}$, la mayor de las dos.
