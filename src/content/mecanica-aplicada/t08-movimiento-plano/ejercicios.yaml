            <text x="120" y="66" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">ω<tspan font-size="7.5" dy="2.5">BC</tspan><tspan dy="-2.5"></tspan></text>
            <path d="M88 226 A12 12 0 0 0 106 236.4" fill="none" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
            <text x="84" y="252" font-size="10" text-anchor="end" fill="var(--ink)" font-style="italic">ω<tspan font-size="7.5" dy="2.5">AD</tspan><tspan dy="-2.5"></tspan></text>
            <line x1="100" y1="136" x2="68" y2="136" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
            <text x="80" y="152" font-size="10" text-anchor="middle" fill="var(--ink)" font-style="italic">v<tspan font-size="7.5" dy="2.5">B</tspan></text>
            <line x1="255.9" y1="212" x2="255.9" y2="182" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
            <text x="248" y="194" font-size="10" text-anchor="end" fill="var(--ink)" font-style="italic">v<tspan font-size="7.5" dy="2.5">D</tspan></text>
            <circle cx="100" cy="40" r="2.4" fill="var(--ink)"/>
            <text x="92" y="56" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">C</text>
            <circle cx="100" cy="136" r="2.4" fill="var(--ink)"/>
            <text x="108" y="128" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">B</text>
            <circle cx="255.9" cy="226" r="2.4" fill="var(--ink)"/>
            <text x="276" y="244" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">D</text>
            <circle cx="13.4" cy="86" r="2.4" fill="var(--ink)"/>
            <text x="13.4" y="76" font-size="10" text-anchor="middle" font-weight="700" fill="var(--ink)">A</text>
            <circle cx="100" cy="226" r="2.4" fill="var(--ink)"/>
            <text x="92" y="222" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">I</text>
          </svg>

      - tipo: calcular
        titulo: La velocidad angular de la barra AD
        pregunta: |
          ¿Cuánto vale $\omega_{AD}$, en rad/s?
        respuesta:
          tipo: numero
          valor: '4.267'
          tolerancia: 0.02
          formato: un número, en rad/s
        distractores:
          - valor: '2.133'
            mensaje: |
              Has dividido $v_B$ entre los 360 mm de $BD$. Lo que iguala a $v_B$
              no es $\omega\,BD$ entero, sino su componente horizontal, que
              lleva el $\operatorname{sen} 30^{\circ}$.
          - valor: '4'
            mensaje: |
              Esa es la de la manivela. $B$ pertenece a los dos sólidos y por
              eso comparten su velocidad, pero no su velocidad angular.
        pista: |
          $v_B = 4 \cdot 0{,}192 = 0{,}768$ m/s, horizontal. La componente
          horizontal de $\vec{\omega}_{AD}\times\overrightarrow{BD}$ vale
          $\omega_{AD}\,BD\operatorname{sen}30^{\circ}$.
        desarrollo: |
          Como $\vec{v}_D$ es vertical, la horizontal de $\vec{v}_B$ la tiene
          que cancelar el giro de la barra:

          $$
          \omega_{AD}\,BD\operatorname{sen}30^{\circ} = \omega\,CB
          \;\Longrightarrow\;
          \omega_{AD} = \frac{4 \cdot 0{,}192}{0{,}36 \cdot 0{,}5} = 4{,}267\ \text{rad/s}
          $$

      - tipo: calcular
        titulo: La velocidad de la deslizadera
        pregunta: |
          ¿Cuánto vale $v_D$, en m/s?
        respuesta:
          tipo: numero
          valor: '1.330'
          tolerancia: 0.01
          formato: un número, en m/s
        distractores:
          - valor: '1.536'
            mensaje: |
              Has multiplicado $\omega_{AD}$ por los 360 mm enteros. Solo la
              componente vertical de $\vec{\omega}_{AD}\times\overrightarrow{BD}$
              sobrevive, y lleva el $\cos 30^{\circ}$.
          - valor: '0.768'
            mensaje: |
              Esa es la velocidad de $B$, que es horizontal. $D$ se mueve en
              vertical, y su velocidad no tiene por qué coincidir en módulo con
              la de $B$.
        pista: |
          $v_D = \omega_{AD}\,BD\cos 30^{\circ}$.
        desarrollo: |
          $$
          v_D = 4{,}267 \cdot 0{,}36 \cdot \cos 30^{\circ} = 1{,}330\ \text{m/s}
          $$

          Hacia arriba, por la guía.

      - tipo: calcular
        titulo: La aceleración de la deslizadera
        pregunta: |
          ¿Cuánto vale $a_D$, en m/s²?
        respuesta:
          tipo: numero
          valor: '16.18'
          tolerancia: 0.05
          formato: un número, en m/s²
        distractores:
          - valor: '3.072'
            mensaje: |
              Ese es solo $\omega^{2}CB$, la aceleración de $B$. Falta todo lo
              que aporta el giro de la barra $AD$: su normal
              $\omega_{AD}^{2}BD$ y su tangencial $\alpha_{AD}BD$.
          - valor: '9.83'
            mensaje: |
              Ese es solo el término tangencial
              $\alpha_{AD}\,BD\cos 30^{\circ}$. Hay que sumarle la aceleración
              de $B$ y la normal de la barra, que también son verticales.
        pista: |
          Primero $\alpha_{AD}$, anulando la horizontal:
          $\alpha_{AD}\,BD\operatorname{sen}30^{\circ} = \omega_{AD}^{2}BD\cos 30^{\circ}$.
          Después suma las tres contribuciones verticales.
        desarrollo: |
          $$
          \alpha_{AD} = \sqrt{3}\,\omega_{AD}^{2} = 31{,}53\ \text{rad/s}^{2}
          $$

          $$
          a_D = \omega^{2}CB + \omega_{AD}^{2}BD\operatorname{sen}30^{\circ}
          + \alpha_{AD}BD\cos 30^{\circ}
          = 3{,}072 + 3{,}277 + 9{,}830 = 16{,}18\ \text{m/s}^{2}
          $$

          La colección redondea a 16,16 m/s²; la resolución del profesor da
          16,18, que es lo que sale de los datos.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $v_B = 0{,}768$ m/s es horizontal y $v_D$ es vertical, así que el
              CIR de $AD$ está donde se cortan la vertical por $B$ y la
              horizontal por $D$.
          - texto: >-
              Anulando la componente horizontal sale
              $\omega_{AD} = 4{,}27$ rad/s, y con ella
              $v_D = 1{,}33$ m/s.
          - texto: >-
              La misma proyección con aceleraciones da
              $\alpha_{AD} = 31{,}53$ rad/s² y, sumando las tres verticales,
              $a_D = 16{,}18$ m/s².
          - texto: >-
              Como la manivela gira a velocidad angular constante, la
              deslizadera sube a velocidad constante y su aceleración es nula.
            trampa: true
            mensaje: |
              La transmisión no es lineal: el ángulo de la barra cambia y con él
              la relación entre $\omega$ y $v_D$. La deslizadera acelera a 16,18
              m/s², que es más de vez y media la gravedad.
    resolucion: |
      **1. Esquema de velocidades.** Es un problema de cinemática: el dibujo
      lleva el giro de la manivela, la dirección de las velocidades de B y
      de D y el CIR de la barra, sin escala.

      <figure class="figura-examen">
      <svg viewBox="0 24 292 236" role="img" width="438" height="354" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">Esquema de velocidades de la manivela CB y la barra AD con la deslizadera</title>
        <desc id="dsl-d">La manivela CB cuelga del punto fijo C, en el techo, vertical, con su giro horario. En B se articula la barra AD, que baja hacia la derecha a 30 grados hasta la deslizadera D, en una guía vertical; A queda arriba a la izquierda de B. En B, su velocidad, horizontal hacia la izquierda. Encima de D, su velocidad, vertical hacia arriba. A trazos, la vertical por B y la horizontal por D, que se cortan en I, debajo de B; alrededor de I, el giro de la barra, antihorario.</desc>
