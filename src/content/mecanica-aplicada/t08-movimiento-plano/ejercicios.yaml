      - tipo: calcular
        titulo: La velocidad angular del disco
        pregunta: |
          Escribiendo $\vec{\omega}_d = k\,\omega\vec{k}$, ¿cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '-2'
          tolerancia: 0.01
          formato: un número con su signo, el coeficiente que multiplica a omega
        distractores:
          - valor: '2'
            mensaje: |
              El módulo está bien pero el sentido no. El centro $C$, por encima
              de $A$, va hacia la derecha respecto de él: el disco gira en
              sentido horario, o sea con $\vec{k}$ negativo.
          - valor: '-1'
            mensaje: |
              Parece que has usado $AO_1 = R$. La barra mide $2R$ de $A$ a
              $O_1$, así que $v_A = 2\omega R$ y el disco gira al doble de lo que
              saldría con $R$.
        pista: |
          $v_A = \omega\,AO_1 = 2\omega R$ hacia arriba, y la componente
          horizontal de $\vec{v}_C$ es la de $\vec{v}_B$, porque $C$ está unido
          a $B$ por la barra $BC$, que es horizontal.
        desarrollo: |
          $$
          \vec{v}_A = (0;\ 2\omega R)
          \qquad
          \vec{v}_C = \vec{v}_A + \vec{\omega}_d \times \overrightarrow{AC}
          = (-R\,\omega_d;\ 2\omega R)
          $$

          Y por la barra $BC$, $\vec{v}_C = (2\omega R;\ 2R\,\omega_2)$. Igualando
          la componente horizontal, $\omega_d = -2\omega$.

      - tipo: calcular
        titulo: El centro instantáneo de rotación del disco
        pregunta: |
          ¿A qué distancia de $A$ está el CIR del disco, medida en unidades de
          $R$ sobre la recta de la barra $O_1A$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número, la distancia en unidades de R
        distractores:
          - valor: '0'
            mensaje: |
              Ese es el error de tomar el punto de contacto como CIR. Solo vale
              cuando la superficie sobre la que se rueda está **fija**, y aquí la
              barra $O_1A$ gira: $A$ se mueve a $2\omega R$.
          - valor: '2'
            mensaje: |
              Has usado $AO_1 = 2R$. El CIR sale de dividir la velocidad de $A$
              entre la velocidad angular del disco:
              $2\omega R / 2\omega = R$.
        pista: |
          El CIR cumple $\vec{v}_A = \vec{\omega}_d \times \overrightarrow{IA}$.
          Con $v_A = 2\omega R$ y $\omega_d = 2\omega$, la distancia es el
          cociente.
        desarrollo: |
          $$
          |IA| = \frac{v_A}{|\omega_d|} = \frac{2\omega R}{2\omega} = R
          $$

          y queda a la derecha de $A$, sobre la propia barra. El de la barra
          $BC$, por el mismo procedimiento, está $2R$ por encima de $B$.

      - tipo: calcular
        titulo: La aceleración angular del disco
        pregunta: |
          Escribiendo $\vec{\alpha}_d = k\,\omega^{2}\vec{k}$, ¿cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.02
          formato: un número, el coeficiente que multiplica a omega cuadrado
        distractores:
          - valor: '2'
            mensaje: |
              Ese es el coeficiente de la aceleración de $A$ como punto de la
              barra, $\omega^{2}AO_1 = 2\omega^{2}R$. Hay que igualarlo con la
              componente tangencial de $\vec{a}_A$ vista desde el disco, que
              lleva además $-2\omega^{2}R$ de la barra $BC$.
          - valor: '0.5'
            mensaje: |
              Ese es el coeficiente de $\alpha_{BC}$, que sale por el camino. El
              del disco es ocho veces mayor.
        pista: |
          En una rodadura, lo que se conserva en el contacto son las componentes
          **tangenciales** de las dos aceleraciones. Aquí la tangente es la
          propia barra, o sea la horizontal.
        desarrollo: |
          Con $\vec{a}_{A,4} = (2\omega^{2}R;\ 0)$ y

          $$
          \vec{a}_{A,3} = \vec{a}_C + \vec{\alpha}_d \times \overrightarrow{CA}
          - \omega_d^{2}\,\overrightarrow{CA}
          $$

          la igualdad de componentes horizontales da

          $$
          -2\omega^{2}R + R\,\alpha_d = 2\omega^{2}R
          \;\Longrightarrow\;
          \alpha_d = 4\,\omega^{2}
          $$

          y de la barra $BC$ sale $\alpha_{BC} = 0{,}5\,\omega^{2}$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $\vec{v}_B = 2\omega R$ horizontal y $\vec{v}_A = 2\omega R$
              vertical; igualando las dos expresiones de $\vec{v}_C$ salen
              $\omega_d = -2\omega$ y $\omega_{BC} = \omega$.
          - texto: >-
              Los CIR salen de $v = \omega\,d$: el del disco a $R$ de $A$ sobre
              la barra, y el de $BC$ a $2R$ por encima de $B$.
          - texto: >-
              En aceleraciones, la rodadura iguala las componentes tangenciales
              en $A$ y $C$ desliza respecto de la barra 4, y salen
              $\alpha_d = 4\omega^{2}$ y $\alpha_{BC} = 0{,}5\,\omega^{2}$.
          - texto: >-
              Como el disco rueda sin deslizar sobre la barra, el punto de
              contacto $A$ es su centro instantáneo de rotación.
            trampa: true
            mensaje: |
              Solo si la barra estuviera quieta. La regla «el CIR es el punto de
              contacto» vale para rodadura sobre una superficie **fija**; aquí la
              barra $O_1A$ gira y arrastra a $A$ a $2\omega R$, así que el CIR
              del disco está a $R$ de distancia.
