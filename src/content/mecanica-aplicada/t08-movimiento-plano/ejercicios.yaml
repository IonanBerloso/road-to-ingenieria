    pide: La velocidad angular y la aceleración angular de la placa triangular.
    pasos:
      - tipo: reconocer
        pregunta: |
          $AB$ y $CD$ son iguales y paralelas, y la placa las une por $B$ y $D$.
          ¿Cómo se mueve la placa?
        opciones:
          - texto: >-
              Se traslada, porque ABDC es un paralelogramo articulado y BD se
              mantiene siempre paralelo a AC
            correcta: true
            mensaje: |
              Eso es. Con los dos lados opuestos iguales y paralelos, $BD$ no
              puede cambiar de orientación: la placa se mueve sin girar y todos
              sus puntos describen circunferencias iguales de radio 60 cm.
          - texto: Gira alrededor de E, que es el vértice libre de la placa
            mensaje: |
              $E$ no está sujeto a nada: es un punto más de la placa y se mueve
              como los demás. Nada obliga a que su velocidad sea nula.
          - texto: Gira con la velocidad angular de las barras, 4 rad/s, porque va unida a ellas
            mensaje: |
              Ir unida a un sólido que gira no obliga a girar con él. Es la misma
              idea que la plataforma de una noria, que se mantiene horizontal
              mientras la rueda da vueltas.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **las dos barras y la placa, con
          la dirección de las velocidades de B y de D y las perpendiculares a
          ellas**. Solo las direcciones, sin escala.
        comprueba:
          - punto: |
              **$\vec{v}_D$ perpendicular a CD, hacia abajo y a la izquierda.**
            porque: |
              D gira alrededor del punto fijo C, y CD gira en sentido horario:
              con CD bajando hacia la derecha, eso lleva a D hacia abajo y a la
              izquierda.
          - punto: |
              **$\vec{v}_B$ perpendicular a AB.**
            porque: |
              B gira alrededor del punto fijo A. El giro de AB no es dato: se
              dibuja en el sentido del de CD, y el cálculo dirá su sentido.
          - punto: |
              **Las perpendiculares a las dos velocidades son las rectas AB y
              CD: paralelas, sin punto de corte.**
            porque: |
              La velocidad del extremo de una barra que gira alrededor de un
              punto fijo es perpendicular a la barra, así que su perpendicular
              es la barra misma. Y AB y CD son paralelas.
        figura: |
          <svg viewBox="8 10 266 214" role="img" width="266" height="214" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">Esquema de velocidades de la placa colgada de dos barras iguales</title>
            <desc id="dsl-d">Del techo cuelgan las barras AB y CD, iguales y paralelas, bajando hacia la derecha a 60 grados; sus extremos B y D sostienen la placa triangular BDE. En B y en D, sus velocidades, perpendiculares a las barras, hacia abajo y a la izquierda. Las perpendiculares a esas velocidades son las rectas de las propias barras: dos rectas paralelas. Los giros de las dos barras, horarios.</desc>
            <defs>
              <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
              </marker>
              <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
              </marker>
