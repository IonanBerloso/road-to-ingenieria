        <circle cx="180" cy="92" r="3.2" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
        <circle cx="315" cy="38" r="3.2" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
        <text x="38" y="212" font-size="10" text-anchor="end" fill="var(--ink)">A</text>
        <text x="36" y="143" font-size="10" text-anchor="end" fill="var(--ink)">B</text>
        <text x="186" y="212" font-size="10" fill="var(--ink)">C</text>
        <text x="172" y="86" font-size="10" text-anchor="end" fill="var(--ink)">D</text>
        <text x="321" y="34" font-size="10" fill="var(--ink)">E</text>
        <text x="55" y="176" font-size="9.5" fill="var(--ink)">1</text>
        <text x="112" y="112" font-size="9.5" fill="var(--ink)">2</text>
        <text x="190" y="150" font-size="9.5" fill="var(--ink)">3</text>
        <text x="60" y="128" font-size="9" fill="var(--flag)">ω = 6 rad/s cte</text>
        <line x1="26" y1="200" x2="26" y2="146" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="22" y="176" font-size="9" text-anchor="end" fill="var(--faint)">90</text>
        <line x1="161" y1="200" x2="161" y2="92" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="157" y="150" font-size="9" text-anchor="end" fill="var(--faint)">180</text>
        <line x1="45" y1="232" x2="180" y2="232" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="112" y="244" font-size="9" text-anchor="middle" fill="var(--faint)">225</text>
        <line x1="180" y1="232" x2="315" y2="232" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="247" y="244" font-size="9" text-anchor="middle" fill="var(--faint)">225</text>
        <text x="290" y="60" font-size="9" fill="var(--faint)">cotas en mm</text>
