        <rect x="143" y="40" width="23" height="185" rx="11" fill="none" stroke="var(--ink)" stroke-width="1.6"/>
        <rect x="148.5" y="46" width="12" height="173" rx="6" fill="var(--faint)" fill-opacity="0.25" stroke="var(--ink)" stroke-width="1"/>
        <line x1="166" y1="130" x2="298" y2="130" stroke="var(--ink)" stroke-width="2.6"/>
