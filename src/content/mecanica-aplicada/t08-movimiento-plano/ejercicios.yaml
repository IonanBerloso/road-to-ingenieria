    pide: La velocidad angular y la aceleración angular de la barra CD.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado dice que $AB$ **se traslada**. ¿Qué se saca de ahí?
        opciones:
          - texto: >-
              Que A y B llevan los dos la misma velocidad v, horizontal, y la
              misma aceleración, que además es nula
            correcta: true
            mensaje: |
              Eso es. Trasladarse significa velocidad angular nula, así que todos
              sus puntos comparten velocidad; y como esa velocidad es constante,
              $\vec{a}_A = \vec{a}_B = 0$. Es el dato que arranca el problema.
          - texto: Que AB no tiene aceleración angular, pero sus puntos sí giran
            mensaje: |
              Si se traslada, sus puntos no giran: describen trayectorias
              idénticas trasladadas. Y como se traslada **siempre**, no solo en
              este instante, también $\alpha_{AB} = 0$.
          - texto: Que B está articulado a la barra CD y comparten velocidad
            mensaje: |
              $B$ es una **deslizadera** sobre $CD$, no una articulación: recorre
              la barra mientras esta gira. De hecho $v_{B/3} = v$.

      - tipo: calcular
        titulo: La velocidad angular de la barra CD
        pregunta: |
          Escribiendo $\omega_3 = k\,\dfrac{v}{L}$, ¿cuánto vale $k$ en valor
          absoluto?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número, el coeficiente que multiplica a v partido por L
        distractores:
          - valor: '0.577'
            mensaje: |
              Ese es el coeficiente de $v_C$, la velocidad de la deslizadera
              vertical, no la velocidad angular. Para pasar de una a otra hay que
              dividir entre $CB$, que vale $\tfrac{\sqrt{3}}{3}L$.
          - valor: '1.732'
            mensaje: |
              Has multiplicado por $\sqrt{3}$ donde había que dividir. Comprueba
              las longitudes: $CB = L/\sqrt{3}$ y $CA = 2L/\sqrt{3}$.
        pista: |
          Primero $\vec{v}_C$ con la barra 2, que une $C$ y $A$; después, en la
          barra 3, la componente vertical de $\vec{v}_B$ es nula y eso fija
          $\omega_3$.
        desarrollo: |
          Con $C$ en el origen, $B = (L/\sqrt{3};\ 0)$ y $A = (L/\sqrt{3};\ L)$.
          De la barra 2, imponiendo que $\vec{v}_C$ sea vertical:

          $$
          \omega_2 = -\frac{v}{L}
          \qquad
          v_C = \frac{\sqrt{3}}{3}\,v
          $$

          Y en la barra 3, la componente vertical de $\vec{v}_B$ tiene que ser
          nula:

          $$
          \frac{\sqrt{3}}{3}v + \frac{\sqrt{3}}{3}L\,\omega_3 = 0
          \;\Longrightarrow\;
          \omega_3 = -\frac{v}{L}
          $$

      - tipo: calcular
        titulo: La aceleración de la deslizadera C
        pregunta: |
          Escribiendo $a_C = k\,\dfrac{v^{2}}{L}$, ¿cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '1.3333'
          tolerancia: 0.01
          formato: un número, el coeficiente que multiplica a v cuadrado partido por L
        distractores:
          - valor: '1'
            mensaje: |
              Te falta un tercio. Sale de la combinación de la normal
              $\omega_2^{2}\,CA$ con la tangencial $\alpha_2\,CA$ al proyectar
              sobre la vertical; no basta con uno de los dos términos.
          - valor: '0.577'
            mensaje: |
              Ese es el coeficiente de la **velocidad** $v_C$, no el de la
              aceleración. Fíjate en las unidades: aquí la respuesta va con
              $v^{2}/L$.
        pista: |
          $\vec{a}_A = 0$, así que
          $0 = \vec{a}_C + \vec{\alpha}_2 \times \overrightarrow{CA} - \omega_2^{2}\overrightarrow{CA}$,
          con $\vec{a}_C$ vertical.
        desarrollo: |
          La componente horizontal da
          $\alpha_2 = -\dfrac{\sqrt{3}}{3}\dfrac{v^{2}}{L^{2}}$, y con ella la
          vertical:

          $$
          a_C = \frac{4}{3}\,\frac{v^{2}}{L}
          $$

      - tipo: calcular
        titulo: La aceleración angular de la barra CD
        pregunta: |
          Escribiendo $\alpha_3 = k\,\dfrac{v^{2}}{L^{2}}$, ¿cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '1.1547'
          tolerancia: 0.01
          formato: un número, el coeficiente que multiplica a v cuadrado partido por L cuadrado
        distractores:
          - valor: '0.577'
            mensaje: |
              Ese es $\alpha_2$, el de la barra que une $C$ con $A$. El de $CD$
              es justo el doble, y sale de la ecuación de $B$ como deslizadera.
          - valor: '2'
            mensaje: |
              Te has dejado por el camino el reparto entre $a_C$ y el término de
              Coriolis. La combinación correcta es
              $\alpha_3\,CB + a_C = 2\,\omega_3 v_{B/3}$.
        pista: |
          $B$ desliza sobre $CD$ con $v_{B/3} = v$, así que en la vertical
          aparece Coriolis:
          $\alpha_3\,CB + a_C = 2\,\omega_3\,v_{B/3}$.
        desarrollo: |
          $$
          \alpha_3\,\frac{L}{\sqrt{3}} + \frac{4}{3}\frac{v^{2}}{L}
          = 2\,\frac{v}{L}\,v
          \;\Longrightarrow\;
          \alpha_3 = \frac{2\sqrt{3}}{3}\,\frac{v^{2}}{L^{2}} = 1{,}155\,\frac{v^{2}}{L^{2}}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $AB$ se traslada, así que $\vec{v}_A = \vec{v}_B = v\,\vec{\imath}$
              y $\vec{a}_A = \vec{a}_B = 0$.
          - texto: >-
              De la barra $CA$, imponiendo que $C$ solo pueda subir o bajar,
              salen $\omega_2 = v/L$ y $v_C = \tfrac{\sqrt{3}}{3}v$.
          - texto: >-
              En la barra $CD$, con $B$ deslizando y $v_{B/3} = v$, salen
              $\omega_3 = v/L$ y, con el Coriolis,
              $\alpha_3 = \tfrac{2\sqrt{3}}{3}\,v^{2}/L^{2}$.
          - texto: >-
              Como $AB$ se traslada con velocidad constante, todo el mecanismo se
              mueve uniformemente y las aceleraciones angulares son nulas.
            trampa: true
            mensaje: |
              Solo $AB$ va uniformemente. Las otras dos barras cambian de
              orientación, y la relación entre sus ángulos y la posición de $AB$
              no es lineal: de hecho $\alpha_3 = 1{,}155\,v^{2}/L^{2}$, que no es
              pequeño.
    resolucion: |
      **La geometría.** Con $C$ en el origen y $CD$ horizontal, la barra 2 forma
      $60^{\circ}$, así que $B = \left(\tfrac{L}{\sqrt{3}};\ 0\right)$ y
      $A = \left(\tfrac{L}{\sqrt{3}};\ L\right)$. Por tanto
      $CB = \tfrac{\sqrt{3}}{3}L$ y $CA = \tfrac{2\sqrt{3}}{3}L$.

      **Velocidades.** $AB$ se traslada, así que
      $\vec{v}_A = \vec{v}_B = v\,\vec{\imath}$. En la barra 2, $\vec{v}_C$ es
      vertical:

      $$
      \omega_2 = -\frac{v}{L}
      \qquad
      v_C = \frac{\sqrt{3}}{3}\,v
      $$

      En la barra 3, $B$ es una deslizadera y la componente vertical de su
      velocidad es nula:

      $$
      \omega_3 = -\frac{v}{L}
      \qquad
      v_{B/3} = v
      $$

      **Aceleraciones.** Con $\vec{a}_A = 0$, la barra 2 da
      $\alpha_2 = -\tfrac{\sqrt{3}}{3}v^{2}/L^{2}$ y
      $a_C = \tfrac{4}{3}v^{2}/L$. Y en la barra 3, con $\vec{a}_B = 0$ y el
      término de Coriolis $2\,\omega_3 v_{B/3}$:

      $$
      \alpha_3\,CB + a_C = 2\,\omega_3 v_{B/3}
      \;\Longrightarrow\;
      \alpha_3 = \frac{2\sqrt{3}}{3}\,\frac{v^{2}}{L^{2}}
      $$

      que es lo que publica la colección.

  - id: ejma8-col815-el-disco-sobre-la-barra-que-gira
    titulo: Un disco que rueda sobre una barra que a su vez gira
    fuente: >-
      Ejercicio 8.15 · Tema 8, «Análisis del movimiento plano» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado y el
      profesor su resolución, contra los que está contrastado el desarrollo. El
      resultado es simbólico, así que las casillas piden el coeficiente que
      multiplica a la expresión indicada en cada pregunta.
    nivel: practica
    enunciado: |
      Una barra rígida $O_1A$ gira alrededor del punto fijo $O_1$ con una
      velocidad angular $\omega$ constante y con sentido horario. Sobre esta
      barra contacta sin deslizamiento un disco de radio $R$. Este disco articula
      en su centro $C$ con la barra rígida $BC$, de longitud $2R$, que a su vez
      articula en $B$ con la barra $O_2B$, con punto fijo en $O_2$, de longitud
      $R$, y con velocidad angular $2\omega$ constante y con sentido horario. En
      el instante representado, las barras $O_1A$ y $BC$ pasan por la
      horizontal, y la barra $O_2B$ pasa por la vertical. Para este instante,
      calcular:

      a) Velocidad angular del disco y de la barra $BC$.

      b) Centro instantáneo de rotación del disco y de la barra $BC$.

      c) Aceleración angular del disco y de la barra $BC$.

      <figure>
      <svg viewBox="0 0 335 210" role="img" width="335" height="210" aria-labelledby="ejma8-col815-t ejma8-col815-d">
        <title id="ejma8-col815-t">Barra O2B vertical, barra BC horizontal, disco de centro C apoyado sobre la barra O1A horizontal</title>
        <desc id="ejma8-col815-d">A la izquierda, el punto fijo O2, del que sale hacia arriba la barra 1, de longitud R, hasta B. De B parte hacia la derecha la barra 2, BC, horizontal y de longitud dos R. En C está el centro del disco 3, de radio R, que se apoya sin deslizar sobre la barra 4, O1A, horizontal. A es el punto de contacto y O1 es el punto fijo de esa barra, a dos R de A. La barra O2B gira a dos omega en sentido horario y la barra O1A a omega, también horario. La figura está dibujada a escala.</desc>
