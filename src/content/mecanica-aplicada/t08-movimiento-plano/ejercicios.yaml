    pide: Las velocidades de O y A, las velocidades angulares del disco y de la barra BC, y la velocidad de A respecto de BC.
    pasos:
      - tipo: reconocer
        pregunta: |
          $O$ corre por una guía vertical y $A$ por una ranura horizontal.
          ¿Dónde está el CIR de la barra $OA$?
        opciones:
          - texto: Donde se cortan la horizontal por O y la vertical por A
            correcta: true
            mensaje: |
              Eso es. $\vec{v}_O$ es vertical y $\vec{v}_A$ horizontal, así que
              sus perpendiculares son la horizontal por $O$ y la vertical por
              $A$: se cortan a $2R$ de $O$ y a $R$ de $A$.
          - texto: En A, porque es el centro del disco
            mensaje: |
              Ser el centro de un disco no da velocidad nula. De hecho $A$ se
              mueve a $\omega_1 R = 1$ m/s por su ranura, y el CIR queda
              justo debajo de él.
          - texto: En el punto E, porque allí hay rodadura
            mensaje: |
              En $E$ ruedan el **disco** y la **barra BC**, y eso significa que
              sus dos puntos de contacto llevan la misma velocidad, no que esa
              velocidad sea nula. $E$ no es el CIR de nadie aquí.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna ecuación: **el mecanismo con la dirección de
          cada velocidad que se conoce** y **el centro instantáneo de la barra
          OA**.
        comprueba:
          - punto: |
              **$\vec{v}_O$ vertical y $\vec{v}_A$ horizontal.**
            porque: |
              O corre por la deslizadera de la pared, y A, por la ranura.
          - punto: |
              **$I_1$, donde se cortan la horizontal por O y la vertical por A.**
            porque: |
              Cada punto de la barra se mueve en perpendicular a la recta que lo
              une con el centro instantáneo, y ese centro está en las dos
              perpendiculares a la vez.
          - punto: |
              **En E, la velocidad del punto de la barra BC, perpendicular a BC.**
            porque: |
              La barra BC gira alrededor de B, que está fijo.
          - punto: |
              **$\omega_2$ y $\omega_3$, en un sentido supuesto.**
            porque: |
              No se sabe hacia dónde giran: si alguna sale negativa, gira al
              revés.
        figura: |
