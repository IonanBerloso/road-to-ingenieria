    pide: La velocidad angular y la aceleración angular de AB, la velocidad y la aceleración de A, y el polo de aceleraciones de AB.
    pasos:
      - tipo: reconocer
        pregunta: |
          El disco sube rodando con $\omega$ **constante**. ¿Cuánto valen la
          aceleración de su centro $O$ y la de su punto de contacto con el plano?
        opciones:
          - texto: >-
              La del centro es nula y la del contacto vale omega al cuadrado por
              R, dirigida hacia el centro
            correcta: true
            mensaje: |
              Eso es. $O$ recorre una recta paralela al plano a velocidad
              constante $\omega R$, así que $\vec{a}_O = 0$; y el punto de
              contacto, que tiene velocidad nula, se despega un instante después
              con $\vec{a} = \omega^{2}R$ hacia $O$.
          - texto: Las dos son nulas, porque la velocidad angular es constante
            mensaje: |
              La del centro sí, pero la del contacto no. Su velocidad vale cero
              **en este instante** y deja de valerlo enseguida: una velocidad que
              cambia es una aceleración.
          - texto: La del centro vale omega al cuadrado por R hacia el contacto, y la del contacto es nula
            mensaje: |
              Justo al revés, y es la confusión más cara del tema. El punto de
              contacto es el CIR, y el CIR sirve de centro de giro para las
              **velocidades**, nunca para las aceleraciones.

      - tipo: calcular
        titulo: La velocidad de la deslizadera A
        pregunta: |
          Escribiendo $v_A = k\,\omega R$, ¿cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número, el coeficiente que multiplica a omega por R
        distractores:
          - valor: '1'
            mensaje: |
              Ese es el coeficiente de $v_O$, la velocidad del centro. $B$ está
              al otro lado del contacto, a $2R$ de él, así que va al doble; y
              como la barra no gira, $A$ lleva lo mismo que $B$.
          - valor: '2.828'
            mensaje: |
              Has usado la longitud de la barra, $2\sqrt{2}R$, como si fuera un
              brazo de giro. La barra no gira en este instante: se traslada, y
              $v_A = v_B$.
        pista: |
          El CIR del disco es el punto de contacto y $B$ está a $2R$ de él, así
          que $v_B = 2\omega R$, paralela al plano. Después mira qué le pasa a la
          barra.
        desarrollo: |
          $$
          v_B = \omega\,(2R) = 2\omega R \quad \text{paralela al plano}
          $$

          Y como $\vec{v}_A$ también es paralela al plano —$A$ es una deslizadera
          sobre él— y $\overrightarrow{AB}$ no lo es, la barra solo puede
          trasladarse:

          $$
          \omega_{AB} = 0
          \qquad
          v_A = v_B = 2\,\omega R
          $$

      - tipo: calcular
        titulo: La aceleración angular de la barra AB
        pregunta: |
          Escribiendo $\vec{\alpha}_{AB} = k\,\omega^{2}\vec{k}$, ¿cuánto vale
          $k$?
        respuesta:
          tipo: numero
          valor: '-0.5'
          tolerancia: 0.01
          formato: un número con su signo, el coeficiente que multiplica a omega cuadrado
        distractores:
          - valor: '0'
            mensaje: |
              La barra no gira **en este instante**, pero eso no obliga a que su
              aceleración angular sea nula: un instante después $A$ y $B$ dejan
              de ir a la misma velocidad.
          - valor: '-0.25'
            mensaje: |
              Parece que has usado la longitud entera de la barra donde va su
              componente perpendicular al plano, que vale $2R$.
        pista: |
          $\vec{a}_B = \omega^{2}R$ apuntando de $B$ hacia $O$, o sea
          perpendicular al plano. Y $\vec{a}_A$ es paralela al plano: eso basta.
        desarrollo: |
          En ejes del plano, con $\vec{a}_B = (0;\ -\omega^{2}R)$ y
          $\overrightarrow{BA} = (-2R;\ -2R)$, anulando la componente
          perpendicular de $\vec{a}_A$:

          $$
          -\omega^{2}R - 2R\,\alpha_{AB} = 0
          \;\Longrightarrow\;
          \alpha_{AB} = -\frac{\omega^{2}}{2}
          $$

      - tipo: calcular
        titulo: La aceleración de la deslizadera A
        pregunta: |
          Escribiendo $a_A = k\,\omega^{2}R$ sobre el eje que apunta plano
          arriba, ¿cuánto vale $k$ con su signo?
        respuesta:
          tipo: numero
          valor: '-1'
          tolerancia: 0.01
          formato: un número con su signo, el coeficiente que multiplica a omega cuadrado por R
        distractores:
          - valor: '0'
            mensaje: |
              Sería cero si $A$ fuera a velocidad constante, y no lo es: la barra
              tiene $\alpha_{AB} = -\omega^{2}/2$, que frena a $A$ mientras $B$
              sigue subiendo a velocidad constante.
          - valor: '1'
            mensaje: |
              El módulo está bien y el signo no. La aceleración de $A$ apunta
              plano **abajo**: la deslizadera está frenando aunque el disco suba
              uniformemente.
        pista: |
          Con $\alpha_{AB}$ ya conocida, la componente paralela al plano de
          $\vec{a}_A = \vec{a}_B + \vec{\alpha}_{AB} \times \overrightarrow{BA}$.
        desarrollo: |
          $$
          a_A = 2R\,\alpha_{AB} = 2R\left(-\frac{\omega^{2}}{2}\right)
          = -\omega^{2}R
          $$

          Es decir, $\omega^{2}R$ dirigida hacia abajo por el plano.

      - tipo: calcular
        titulo: El polo de aceleraciones de la barra
        pregunta: |
          El polo de aceleraciones de $AB$ está sobre la perpendicular al plano
          trazada por $A$. ¿A qué distancia de $A$, en unidades de $R$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número, la distancia en unidades de R
        distractores:
          - valor: '0'
            mensaje: |
              Eso sería decir que $\vec{a}_A = 0$, y no lo es: vale
              $\omega^{2}R$ plano abajo. El polo es el punto donde la
              aceleración se anula, y aquí no es ninguno de los dos extremos.
          - valor: '2.828'
            mensaje: |
              Esa es la longitud de la barra, $2\sqrt{2}R$. El polo no tiene por
              qué estar sobre la barra: aquí queda fuera de ella.
        pista: |
          Impón $\vec{a}_P = \vec{a}_A + \vec{\alpha}_{AB}\times\overrightarrow{AP} = 0$,
          con $\omega_{AB} = 0$.
        desarrollo: |
          $$
          0 = (-\omega^{2}R;\ 0) + \left(-\frac{\omega^{2}}{2}\right)\vec{k}\times(p;\ q)
          \;\Longrightarrow\;
          p = 0,\quad q = 2R
          $$

          O sea $x_C = x_A$ e $y_C = y_A + 2R$ en ejes del plano: el polo está a
          $2R$ de $A$, separándose del plano, y no coincide ni con $A$, ni con
          $B$, ni con el CIR.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El disco rueda sobre un plano fijo, así que su CIR es el contacto y
              $v_B = 2\omega R$, paralela al plano.
          - texto: >-
              Como $\vec{v}_A$ también es paralela al plano y la barra no lo es,
              $\omega_{AB} = 0$ y $v_A = v_B = 2\omega R$.
          - texto: >-
              Con $\vec{a}_O = 0$, $\vec{a}_B = \omega^{2}R$ hacia $O$, y de ahí
              $\alpha_{AB} = -\omega^{2}/2$, $a_A = \omega^{2}R$ plano abajo y el
              polo a $2R$ de $A$.
          - texto: >-
              El polo de aceleraciones de la barra coincide con su centro
              instantáneo de rotación.
            trampa: true
            mensaje: |
              Son dos puntos distintos, y este ejercicio lo enseña de la forma
              más clara posible: la barra **no gira**, así que su CIR está en el
              infinito, mientras que su polo de aceleraciones está aquí al lado,
              a $2R$ de $A$.
    resolucion: |
      **Ejes del plano.** Con el eje $x$ hacia arriba a lo largo del plano, el
      eje $y$ perpendicular y el origen en el punto de contacto:
      $O = (0;\ R)$, $B = (0;\ 2R)$ y, como la barra forma $45^{\circ}$ con el
      plano y mide $2\sqrt{2}R$, $A = (-2R;\ 0)$. En el dibujo eso hace que la
      barra salga vertical, que es una buena comprobación de la geometría.

      **Velocidades.** El disco rueda sin deslizar sobre un plano **fijo**, así
      que su CIR es el punto de contacto:

      $$
      v_O = \omega R
      \qquad
      v_B = \omega\,(2R) = 2\omega R
      $$

      las dos paralelas al plano. Como $\vec{v}_A$ también lo es y
      $\overrightarrow{AB}$ no, la barra se traslada:

      $$
      \omega_{AB} = 0
      \qquad
      \vec{v}_A = 2\omega R\,\vec{\imath}
      $$

      **Aceleraciones.** $O$ va en línea recta a velocidad constante, así que
      $\vec{a}_O = 0$; y con $\alpha_{\text{disco}} = 0$, todo punto del disco
      tiene solo la normal hacia $O$. En particular el punto de contacto acelera
      $\omega^{2}R$ hacia $O$ —el CIR no tiene aceleración nula— y

      $$
      \vec{a}_B = (0;\ -\omega^{2}R)
      $$

      Anulando la componente perpendicular de $\vec{a}_A$:

      $$
      \alpha_{AB} = -\frac{\omega^{2}}{2}
      \qquad
      \vec{a}_A = -\omega^{2}R\,\vec{\imath}
      $$

      **El polo de aceleraciones.** Es el punto $C$ con $\vec{a}_C = 0$:

      $$
      x_C = x_A
      \qquad
      y_C = y_A + 2R
      $$

      Los cinco resultados coinciden con los que publica la colección.

      **Sobre la figura.** La colección avisa con una nota de que su dibujo no
      está en la posición que pide el enunciado; el de aquí sí lo está, con la
      barra a $45^{\circ}$ del plano.
