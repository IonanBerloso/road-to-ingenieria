# De siete en siete y no de diez: con el sólido libre, las flechas de vector
# y la comprobación, el bloque de diez más pesado pasaba de 3 MB
# (lib/ejercicios.ts).
porPagina: 7
ejercicios:
  - id: ejma8-la-biela-a-cuarenta-y-cinco-grados
    titulo: La velocidad de la deslizadera de una biela-manivela
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    antes:
      idea: |
        En un mecanismo, cada pieza es un sólido rígido, y las velocidades de
        sus puntos no son independientes: conocida la de un punto y la
        velocidad angular, sale la de cualquier otro. En cada instante hay un
        punto del plano, unido a la pieza, con velocidad nula: el centro
        instantáneo de rotación, alrededor del cual gira la pieza en ese
        instante.
      formula: |
        El campo de velocidades del sólido rígido en el plano, con A un punto
        conocido e I el centro instantáneo de rotación:

        $$
        \vec{v}_P = \vec{v}_A + \vec{\omega}\times\overrightarrow{AP},
        \qquad
        \vec{v}_P = \vec{\omega}\times\overrightarrow{IP},
        \qquad
        |\vec{v}_P| = |\omega|\;IP
        $$
      reconocer: |
        Antes de calcular se mira, en cada pieza, qué se sabe de la velocidad
        de sus extremos sin hacer cuentas.
    enunciado: |
      En un mecanismo biela-manivela, la manivela $OA$ mide 0,1 m y gira
      alrededor de $O$ a 10 rad/s en sentido antihorario. La biela $AB$ mide
      0,3 m, y su extremo $B$ desliza por una guía horizontal que pasa por $O$.
      En el instante en que la manivela forma 45° con la horizontal, calcular la
      velocidad angular de la biela y la velocidad de $B$.
    pide: La velocidad angular de la biela y la velocidad de la deslizadera.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Dónde está el centro instantáneo de rotación de la biela?
        opciones:
          - texto: Donde se cortan la prolongación de OA y la vertical por B
            correcta: true
            mensaje: |
              Eso es. La velocidad de $A$ es perpendicular a $OA$, así que la
              perpendicular a ella es la propia recta $OA$; la de $B$ es
              horizontal, y su perpendicular, la vertical por $B$.
          - texto: En O, porque es el punto fijo del mecanismo
            mensaje: |
              $O$ es el CIR de la **manivela**, que gira alrededor de él. La
              biela es otro sólido, con otro movimiento, y su CIR es otro punto.
          - texto: En B, porque la deslizadera va más despacio
            mensaje: |
              $B$ se mueve: tiene velocidad horizontal. El CIR es un punto de
              velocidad nula, y no está en la biela sino fuera de ella.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el mecanismo a 45°, con la
          dirección de las velocidades de A y de B y el CIR de la biela**.
          Solo las direcciones, sin escala.
        comprueba:
          - punto: |
              **$\vec{v}_A$ perpendicular a la manivela, hacia arriba y a la
              izquierda.**
            porque: |
              A es un punto de la manivela, que gira alrededor de O en sentido
              antihorario: se mueve en perpendicular a OA, hacia donde la lleva
              el giro.
          - punto: |
              **$\vec{v}_B$ horizontal, a lo largo de la guía.**
            porque: |
              La deslizadera no puede salirse de la guía: su velocidad solo
              puede ir en la dirección de la guía.
          - punto: |
              **El CIR de la biela, I, donde se cortan la prolongación de OA y
              la vertical por B.**
            porque: |
              Cada punto se mueve en perpendicular a la recta que lo une con
              el CIR, así que el CIR está en la perpendicular a cada velocidad
              conocida: por A, la recta OA; por B, la vertical.
        figura: |
          <svg viewBox="6 34 262 222" role="img" width="262" height="222" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">Esquema de velocidades de la biela-manivela a 45 grados</title>
            <desc id="dsl-d">La manivela OA sube desde O, a la izquierda, a 45 grados, con su giro antihorario alrededor de O. La biela AB baja desde A hasta la deslizadera B, que corre por una guía horizontal a la altura de O. En A, su velocidad, perpendicular a la manivela, hacia arriba y a la izquierda. En B, su velocidad, horizontal, hacia la izquierda. A trazos, la prolongación de OA más allá de A y la vertical por B, que se cortan arriba a la derecha, en I, el centro instantáneo de rotación de la biela; alrededor de I, el giro de la biela, en sentido horario.</desc>
