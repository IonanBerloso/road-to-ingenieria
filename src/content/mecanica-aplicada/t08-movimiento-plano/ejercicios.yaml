        <circle cx="13.4" cy="86" r="2.4" fill="var(--ink)"/>
        <text x="13.4" y="76" font-size="10" text-anchor="middle" font-weight="700" fill="var(--ink)">A</text>
        <circle cx="100" cy="226" r="2.4" fill="var(--ink)"/>
        <text x="92" y="222" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">I</text>
      </svg>
      <figcaption>

      Solo las direcciones, sin escala. La velocidad de D, dibujada encima de la deslizadera. El CIR de la barra, I, está donde se cortan las perpendiculares a las velocidades de B y de D. Ejes: x hacia la derecha, y hacia arriba; giros positivos en sentido antihorario.

      </figcaption>
      </figure>

      - **La manivela** gira alrededor de C a 4 rad/s, constante, en sentido
        horario: B, debajo de C, va hacia la izquierda, a
        $4\cdot 0{,}192 = 0{,}768$ m/s.
      - **La deslizadera D** solo puede moverse por la guía, en vertical.
      - **La barra AD** tiene su CIR, I, donde se cortan la vertical por B y
        la horizontal por D. Gira alrededor de I en sentido antihorario, y D
        sube.

      Con C en el origen, x hacia la derecha e y hacia arriba, en metros:
      $B = (0;\ -0{,}192)$ y
      $D = B + 0{,}36\,(\cos 30^\circ;\ -\sin 30^\circ) = (0{,}3118;\ -0{,}372)$;
      $\overrightarrow{BD} = (0{,}3118;\ -0{,}18)$. El giro de la manivela,
      $-4\,\vec{k}$ rad/s.

      **2. Incógnitas.** $\omega_{AD}$, $v_D$, $\alpha_{AD}$ y $a_D$.

      **3. Ecuaciones.** La velocidad y la aceleración de D, desde B, con
      la condición de la guía: sus componentes horizontales son nulas.

      $$
      \vec{v}_D = \vec{v}_B + \omega_{AD}\vec{k}\times\overrightarrow{BD},
      \qquad
      \vec{v}_B = -4\vec{k}\times\overrightarrow{CB} = -0{,}768\,\vec{i}\ \text{m/s}
      $$

      $$
      \vec{a}_D = \vec{a}_B + \alpha_{AD}\vec{k}\times\overrightarrow{BD} - \omega_{AD}^{2}\,\overrightarrow{BD},
      \qquad
      \vec{a}_B = -4^{2}\,\overrightarrow{CB} = 3{,}072\,\vec{j}\ \text{m/s}^{2}
      $$

      **4. Resultados.** En velocidades,
      $\vec{v}_D = (-0{,}768 + 0{,}18\,\omega_{AD};\ 0{,}3118\,\omega_{AD})$, y
      la horizontal se anula:

      $$
      \vec{\omega}_{AD} = \frac{0{,}768}{0{,}18}\,\vec{k} = 4{,}267\,\vec{k}\ \text{rad/s},
      \qquad
      \vec{v}_D = 4{,}267\cdot 0{,}3118\,\vec{j} = 1{,}330\,\vec{j}\ \text{m/s}
      $$

      En aceleraciones, con $\omega_{AD}^{2} = 18{,}20$ rad²/s²:
      $\vec{a}_D = (0{,}18\,\alpha_{AD} - 5{,}676;\ 3{,}072 + 0{,}3118\,\alpha_{AD} + 3{,}277)$,
      y la horizontal se anula:

      $$
      \vec{\alpha}_{AD} = 31{,}53\,\vec{k}\ \text{rad/s}^{2},
      \qquad
      \vec{a}_D = (3{,}072 + 9{,}830 + 3{,}277)\,\vec{j} = 16{,}18\,\vec{j}\ \text{m/s}^{2}
      $$

      **La barra gira a 4,267 rad/s, antihoraria, y la deslizadera sube a
      1,330 m/s y acelera 16,18 m/s² hacia arriba.** La colección publica
      16,16 m/s²: es la misma cuenta redondeada por el camino; partiendo de
      los datos salen 16,18, que es lo que obtiene también la resolución del
      profesor.

      **5. Comprobación.** Las velocidades, por el CIR, que no se ha usado:
      $I = (0;\ -0{,}372)$, con $IB = 0{,}18$ m e $ID = 0{,}3118$ m.

      $$
      \omega_{AD} = \frac{v_B}{IB} = \frac{0{,}768}{0{,}18} = 4{,}267\ \text{rad/s},
      \qquad
      v_D = \omega_{AD}\,ID = 1{,}330\ \text{m/s}
      $$

      La aceleración, derivando la altura de D, sin el campo de
      aceleraciones. Con $\varphi$ el ángulo de la manivela desde la vertical,
      $\dot\varphi = -4$ rad/s, y $s = 0{,}3118 - 0{,}192\sin\varphi$ la
      distancia horizontal de B a la guía, D está en
      $y_D = -0{,}192\cos\varphi - h$, con $h = \sqrt{0{,}36^{2} - s^{2}}$.
      En el instante, $\varphi = 0$, $s = 0{,}3118$ m, $h = 0{,}18$ m y
      $\dot s = 0{,}768$ m/s; derivando dos veces, con $\ddot s = 0$:

      $$
      \dot y_D = \frac{s\,\dot s}{h} = 1{,}330\ \text{m/s},
      \qquad
      \ddot y_D = 0{,}192\,\dot\varphi^{2} + \frac{\dot s^{2}}{h} + \frac{s^{2}\dot s^{2}}{h^{3}}
      = 3{,}072 + 3{,}277 + 9{,}830 = 16{,}18\ \text{m/s}^{2}
      $$

      Lo mismo, y término a término: la aceleración de B, la normal de la
      barra y la tangencial.

      **Lo que dice el resultado.** La deslizadera va más deprisa que B,
      1,330 frente a 0,768 m/s, porque está más lejos del CIR. Y aunque la
      manivela gire uniformemente, la deslizadera acelera 16,18 m/s², más de
      vez y media la gravedad: la relación entre el giro y su velocidad
      cambia con la inclinación de la barra.

  - id: ejma8-col86-la-varilla-articulada-en-a
    titulo: Una varilla movida por otra a través de una deslizadera
    fuente: >-
      Ejercicio 8.6 · Tema 8, «Análisis del movimiento plano» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado y el
      profesor su resolución, contra los que está contrastado el desarrollo.
    nivel: practica
    antes:
      idea: |
        Un punto que se mueve sobre un sólido que gira tiene dos movimientos a
        la vez: el del punto del sólido con el que coincide en ese instante,
        el arrastre, y el suyo respecto del sólido, el relativo. Las
        velocidades se suman; en las aceleraciones aparece además un tercer
        término, el de Coriolis.
      formula: |
        La composición de movimientos, con $\vec{\omega}$ y $\vec{\alpha}$ el
        giro y la aceleración angular del sólido que arrastra y A un punto
        fijo de él:

        $$
        \vec{v} = \vec{\omega}\times\overrightarrow{AP} + \vec{v}_{rel}
        $$

        $$
        \vec{a} = \vec{\alpha}\times\overrightarrow{AP} - \omega^{2}\,\overrightarrow{AP}
        + \vec{a}_{rel} + 2\,\vec{\omega}\times\vec{v}_{rel}
        $$
      reconocer: |
        Antes de calcular se mira cómo están unidas las dos varillas en D.
    enunciado: |
      Sabiendo que en el instante representado la varilla articulada en $B$,
      gira con una velocidad angular constante $\omega_b = 6$ rad/s en sentido
      anti horario, hallar la velocidad y aceleración angular de la varilla
      articulada en $A$.

      <figure>
      <svg viewBox="0 0 300 200" role="img" width="300" height="200" aria-labelledby="ejma8-col86-t ejma8-col86-d">
        <title id="ejma8-col86-t">Varilla vertical articulada en B y varilla inclinada articulada en A, unidas por una deslizadera en D</title>
        <desc id="ejma8-col86-d">Dos puntos fijos del techo, A a la izquierda y B a su derecha, separados 0,4 metros. De B cuelga la varilla 1, vertical, que gira a 6 radianes por segundo en sentido antihorario y termina en D. De A sale la varilla 2, que baja hacia la derecha formando 30 grados con la horizontal y pasa por D. En D hay una deslizadera, la pieza 3, que une las dos varillas y permite que D corra a lo largo de la varilla 2. La figura está dibujada a escala.</desc>
        <defs>
          <marker id="ejma8-col86-fl" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
