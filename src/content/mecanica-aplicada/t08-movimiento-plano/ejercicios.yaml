    pide: La velocidad angular del disco 2, la velocidad de deslizamiento en su contacto con la chapa y su aceleración angular.
    pasos:
      - tipo: reconocer
        pregunta: |
          En $C$ y en $D$ los discos tocan la chapa, pero hay deslizamiento.
          ¿Qué condición se puede imponer entonces en cada contacto?
        opciones:
          - texto: >-
              Que las componentes normales de las dos velocidades coincidan; la
              diferencia tangencial es la velocidad de deslizamiento
            correcta: true
            mensaje: |
              Eso es. Los sólidos no se separan ni se penetran, así que la
              componente perpendicular al plano tangente es común; lo que puede
              diferir es la componente a lo largo del contacto, y esa diferencia
              es justo lo que el enunciado llama velocidad de deslizamiento.
          - texto: Que las dos velocidades sean iguales, como en una rodadura
            mensaje: |
              Eso sería rodadura sin deslizamiento, y aquí el propio enunciado
              pide la velocidad de deslizamiento, que sale $1{,}5\,\omega R$.
              Si fueran iguales, esa velocidad sería cero.
          - texto: Que el punto de contacto tenga velocidad nula por ser el CIR
            mensaje: |
              El punto de contacto solo es CIR cuando un sólido rueda sobre otro
              que está **fijo**. Aquí los dos se mueven: el disco gira alrededor
              de $G$ y la chapa alrededor de $O$.

      - tipo: calcular
        titulo: La velocidad angular de la chapa
        pregunta: |
          Escribiendo $\omega_3 = k\,\omega$, ¿cuánto vale $k$ en valor
          absoluto?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.01
          formato: un número, el coeficiente que multiplica a omega
        distractores:
          - valor: '1'
            mensaje: |
              Esa es la del disco 1. La chapa gira alrededor de $O$, que está a
              $\sqrt{5}\,R$ de $C$, mientras que el disco gira alrededor de $G$,
              a $\sqrt{2}\,R$ de $C$: las dos velocidades angulares no tienen por
              qué coincidir.
          - valor: '2'
            mensaje: |
              Esa es la del disco 2, que sale al final. La de la chapa se obtiene
              del contacto en $C$, igualando la componente **vertical** de las
              dos velocidades.
        pista: |
          $\vec{v}_C$ del disco 1 vale $\omega\,|GC| = \sqrt{2}\,\omega R$. Iguala
          su componente vertical con la del punto $C$ de la chapa, que gira
          alrededor de $O$ con $\overrightarrow{OC} = (-2R;\ -R)$.
        desarrollo: |
          Con $G = (0;\ -R)$, $C = (R;\ 0)$ y $O = (3R;\ R)$:

          $$
          \vec{v}_{C,1} = \omega\,\vec{k}\times(R;\ R) = \omega(-R;\ R)
          \qquad
          \vec{v}_{C \in 3} = \omega_3\,\vec{k}\times(-2R;\ -R) = \omega_3(R;\ -2R)
          $$

          Igualando la componente vertical, $\omega R = -2R\omega_3$, o sea
          $\omega_3 = -\omega/2$.

      - tipo: calcular
        titulo: La velocidad angular del disco 2
        pregunta: |
          Escribiendo $\vec{\omega}_2 = k\,\omega\,\vec{k}$, ¿cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número, el coeficiente que multiplica a omega
        distractores:
          - valor: '1'
            mensaje: |
              Los dos discos son iguales, pero no giran igual: el disco 1 pivota
              sobre un punto de su **periferia** y el 2 sobre un punto interior,
              a $R/2$ de su centro. Esa diferencia geométrica cambia la relación.
          - valor: '0.5'
            mensaje: |
              Esa es la de la chapa. La del disco 2 sale de igualar la componente
              vertical en el contacto $D$, donde el brazo que cuenta es la
              componente horizontal de $\overrightarrow{HD}$, que vale $R/2$.
        pista: |
          En $D$, la componente vertical de
          $\vec{\omega}_2 \times \overrightarrow{HD}$ tiene que igualar la del
          punto $D$ de la chapa, que ya conoces.
        desarrollo: |
          Con $H = (5{,}5R;\ -R)$ y $D = (5R;\ 0)$,
          $\overrightarrow{HD} = (-0{,}5R;\ R)$:

          $$
          \vec{v}_{D \in 3} = \omega_3\,\vec{k}\times(2R;\ -R) = (-0{,}5\omega R;\ -\omega R)
          $$

          $$
          -0{,}5R\,\omega_2 = -\omega R \;\Longrightarrow\; \omega_2 = 2\omega
          $$

      - tipo: calcular
        titulo: La velocidad de deslizamiento en D
        pregunta: |
          Escribiendo $|\vec{v}_d| = k\,\omega R$, ¿cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '1.5'
          tolerancia: 0.01
          formato: un número, el coeficiente que multiplica a omega por R
        distractores:
          - valor: '0.5'
            mensaje: |
              Ese es el deslizamiento en el **otro** contacto, el de $C$. En $D$
              la diferencia tangencial es tres veces mayor.
          - valor: '0'
            mensaje: |
              Sería cero si hubiera rodadura, pero el propio enunciado pregunta
              por la velocidad de deslizamiento: aquí los dos sólidos resbalan
              uno sobre otro.
        pista: |
          $\vec{v}_d = \vec{v}_{D,2} - \vec{v}_{D \in 3}$, y las componentes
          verticales ya se han igualado, así que solo queda la horizontal.
        desarrollo: |
          $$
          \vec{v}_{D,2} = 2\omega\,\vec{k}\times(-0{,}5R;\ R) = (-2\omega R;\ -\omega R)
          $$

          $$
          \vec{v}_d = (-2\omega R;\ -\omega R) - (-0{,}5\omega R;\ -\omega R)
          = -1{,}5\,\omega R\,\vec{\imath}
          $$

      - tipo: calcular
        titulo: La aceleración angular del disco 2
        pregunta: |
          Escribiendo $\vec{\alpha}_2 = k\,\omega^{2}\vec{k}$, ¿cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número, el coeficiente que multiplica a omega cuadrado
        distractores:
          - valor: '0'
            mensaje: |
              $\omega$ es constante para el disco **1**. La relación entre los
              tres sólidos depende de la posición, que está cambiando, así que
              ni la chapa ni el disco 2 giran uniformemente.
          - valor: '0.25'
            mensaje: |
              Ese es el valor de $\alpha_3$, la de la chapa, que sale por el
              camino. La del disco 2 se obtiene después, con el contacto en $F$.
        pista: |
          Los centros $E$ y $F$ guardan distancia constante $R$ a la recta $AB$
          de la chapa, así que sus aceleraciones **relativas** a la chapa son
          paralelas a esa recta. Con eso sale primero $\alpha_3$ y luego
          $\alpha_2$.
        desarrollo: |
          Del contacto del disco 1, escribiendo el campo de $E$ visto desde la
          chapa —con su término de Coriolis—, la componente vertical da
          $\alpha_3 = -\omega^{2}/4$. Repitiendo con $F$ y el disco 2,

          $$
          \alpha_2 = 2\,\omega^{2}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              En $C$ las componentes verticales de las velocidades del disco 1 y
              de la chapa coinciden, y de ahí $\omega_3 = \omega/2$.
          - texto: >-
              Repitiendo en $D$ con el disco 2, que pivota en $H$ a $R/2$ de su
              centro, sale $\omega_2 = 2\omega$ y un deslizamiento de
              $1{,}5\,\omega R$.
          - texto: >-
              Los centros $E$ y $F$ se mueven respecto de la chapa por una
              paralela a $AB$, y con esa condición y el Coriolis salen
              $\alpha_3 = \omega^{2}/4$ y $\alpha_2 = 2\omega^{2}$.
          - texto: >-
              Como los dos discos giran alrededor de puntos fijos, sus centros
              $E$ y $F$ están quietos.
            trampa: true
            mensaje: |
              Los puntos fijos son $G$ y $H$, no $E$ y $F$. $G$ está en la
              periferia del disco 1 y $H$ a $R/2$ del centro del 2, así que los
              dos centros describen circunferencias: $v_E = \omega R$ y
              $v_F = \omega_2 R/2 = \omega R$.
    resolucion: |
      **La geometría, con $R$ como unidad.** Tomando el contacto $C$ como origen
      de abscisas sobre la recta $AB$ y esa recta como $y = 0$:
      $G = (0;\ -R)$, $E = (R;\ -R)$, $C = (R;\ 0)$, $O = (3R;\ R)$,
      $D = (5R;\ 0)$, $F = (5R;\ -R)$ y $H = (5{,}5R;\ -R)$. Entonces
      $|OC| = |OD| = \sqrt{5}\,R$ y $|HD| = \tfrac{\sqrt{5}}{2}R$.

      **Velocidades.** En cada contacto se conserva la componente normal —aquí
      la vertical, porque la chapa apoya con su borde horizontal—. En $C$:

      $$
      \omega R = -2R\,\omega_3 \;\Longrightarrow\; \omega_3 = -\frac{\omega}{2}
      $$

      y en $D$, con $\overrightarrow{HD} = (-0{,}5R;\ R)$:

      $$
      -0{,}5R\,\omega_2 = -\omega R \;\Longrightarrow\; \omega_2 = 2\omega
      $$

      **El deslizamiento.** Restando las dos velocidades del punto $D$:

      $$
      \vec{v}_d = -\frac{3}{2}\,\omega R\,\vec{\imath}
      $$

      En el contacto $C$ el deslizamiento es $0{,}5\,\omega R$, tres veces menor.

      **Aceleraciones.** La clave es que $E$ y $F$ mantienen distancia $R$ a la
      recta $AB$, así que su movimiento **relativo a la chapa** es una
      traslación paralela a esa recta y su aceleración relativa no tiene
      componente normal. Escribiendo para cada uno
      $\vec{a} = \vec{a}_{\text{arrastre}} + \vec{a}_{\text{rel}} + 2\vec{\omega}_3\times\vec{v}_{\text{rel}}$
      y proyectando sobre la vertical:

      $$
      \alpha_3 = -\frac{\omega^{2}}{4}
      \qquad
      \alpha_2 = 2\,\omega^{2}
      $$

      Los tres resultados coinciden con los que publica la colección.

  - id: ejma8-col814-la-barra-vertical-que-se-traslada
    titulo: Una barra vertical que se traslada entre dos deslizaderas
    fuente: >-
      Ejercicio 8.14 · Tema 8, «Análisis del movimiento plano» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado y el
      profesor su resolución, contra los que está contrastado el desarrollo. El
      resultado es simbólico, así que las casillas piden el coeficiente que
      multiplica a la expresión indicada en cada pregunta.
    nivel: practica
    enunciado: |
      La barra vertical $AB$ de longitud $L$ se traslada con velocidad $v$
      constante hacia la derecha. Está articulada en sus extremos a 2
      deslizaderas. La deslizadera en $A$ se mueve por la horizontal y la
      deslizadera en $B$ se mueve sobre la barra $CD$ que está articulada en $C$
      a una deslizadera vertical. Calcular:

      a) Velocidad angular de la barra $CD$ (3).

      b) Aceleración angular de la barra $CD$ (3).

