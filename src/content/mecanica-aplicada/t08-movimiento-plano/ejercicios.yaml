        <text x="104" y="186" font-size="10" text-anchor="middle" fill="var(--ink)" font-style="italic">v<tspan font-size="7.5" dy="2.5">B</tspan></text>
        <line x1="85" y1="140" x2="56.2" y2="118.4" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="52" y="114" font-size="10" text-anchor="end" fill="var(--ink)" font-style="italic">v<tspan font-size="7.5" dy="2.5">D</tspan></text>
        <line x1="195" y1="50" x2="168" y2="50" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="172" y="42" font-size="10" text-anchor="middle" fill="var(--ink)" font-style="italic">v<tspan font-size="7.5" dy="2.5">E</tspan></text>
        <circle cx="40" cy="80" r="2.4" fill="var(--ink)"/>
        <text x="30" y="84" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">A</text>
        <circle cx="130" cy="200" r="2.4" fill="var(--ink)"/>
        <text x="138" y="214" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">B</text>
        <circle cx="85" cy="140" r="2.4" fill="var(--ink)"/>
        <text x="96" y="150" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">D</text>
        <circle cx="205" cy="50" r="2.4" fill="var(--ink)"/>
        <text x="222" y="40" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">E</text>
        <circle cx="130" cy="80" r="2.4" fill="var(--ink)"/>
        <text x="124" y="72" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">I</text>
        <text x="120" y="172" font-size="9" text-anchor="start" fill="var(--faint)">1</text>
        <text x="150" y="104" font-size="9" text-anchor="start" fill="var(--faint)">2</text>
      </svg>
      <figcaption>

      Solo las direcciones, sin escala. Las velocidades de A y de B, dibujadas junto a cada punto para que no las tapen la pared y el suelo. El CIR de la barra 1, I, está donde se cortan las perpendiculares a las velocidades de A y de B; la de D es perpendicular a ID. La de E, a lo largo de la guía, se dibuja hacia la izquierda y el cálculo dirá su sentido. Ejes: x hacia la derecha, y hacia arriba; giros positivos en sentido antihorario.

      </figcaption>
      </figure>

      - **B** corre por el suelo hacia la izquierda, a 360 mm/s constantes;
        **A** solo puede moverse por la pared, en vertical.
      - **La barra 1** tiene su CIR, I, donde se cortan la horizontal por A
        y la vertical por B. Alrededor de I gira en sentido horario, y A
        sube.
      - **D**, el punto medio de la barra 1, gira alrededor de I con ella:
        su velocidad es perpendicular a ID.
      - **E** corre por la guía horizontal: su velocidad es horizontal.

      Con la esquina de la pared y el suelo en el origen, en milímetros:
      $A = (0;\ 400)$, $B = (300;\ 0)$, $D = (150;\ 200)$,
      $E = (550;\ 500)$ e $I = (300;\ 400)$;
      $\overrightarrow{DE} = (400;\ 300)$.

      **2. Incógnitas.** $\omega_1$, $\vec{v}_D$, $\omega_2$ y $\vec{v}_E$.

      **3. Ecuaciones.** La barra 1, alrededor de su CIR:

      $$
      \vec{v}_B = \omega_1\vec{k}\times\overrightarrow{IB},
      \qquad
      \vec{v}_D = \omega_1\vec{k}\times\overrightarrow{ID}
      $$

      con $\overrightarrow{IB} = (0;\ -400)$ y
      $\overrightarrow{ID} = (-150;\ -200)$. La barra 2, desde D, con la
      condición de la guía, $v_{Ey} = 0$:

      $$
      \vec{v}_E = \vec{v}_D + \omega_2\vec{k}\times\overrightarrow{DE}
      $$

      **4. Resultados.** $-360\,\vec{i} = 400\,\omega_1\,\vec{i}$, y con él
      $\vec{v}_D = \omega_1\,(200;\ -150)$:

      $$
      \vec{\omega}_1 = -0{,}9\,\vec{k}\ \text{rad/s},
      \qquad
      \vec{v}_D = -180\,\vec{i} + 135\,\vec{j}\ \text{mm/s},
      \qquad
      v_D = 225\ \text{mm/s}
      $$

      La barra 2: $\vec{v}_E = (-180 - 300\,\omega_2;\ 135 + 400\,\omega_2)$,
      y la vertical se anula:

      $$
      \vec{\omega}_2 = -0{,}3375\,\vec{k}\ \text{rad/s},
      \qquad
      \vec{v}_E = (-180 + 101{,}25)\,\vec{i} = -78{,}75\,\vec{i}\ \text{mm/s}
      $$

      **La barra 1 gira a 0,9 rad/s y la 2 a 0,3375 rad/s, las dos en
      sentido horario, y E va hacia la izquierda a 78,75 mm/s.** Los tres
      coinciden con los que publica la colección.

      **5. Comprobación.** Por otros caminos. D es el punto medio de la
      barra 1, y el campo de velocidades es lineal en la posición: su
      velocidad es la media, como vectores, de las de A y B. A sube a
      $0{,}9\cdot IA = 0{,}9\cdot 300 = 270$ mm/s:

      $$
      \vec{v}_D = \frac{(0;\ 270) + (-360;\ 0)}{2} = (-180;\ 135)\ \text{mm/s}
      $$

      Y la barra 2, por su propio CIR, $I_2$, donde se cortan la recta ID,
      perpendicular a $\vec{v}_D$, y la vertical por E: la recta ID sube
      4/3 por cada unidad hacia la derecha, y en $x = 550$ llega a
      $I_2 = (550;\ 733{,}3)$ mm. Con $I_2D = 666{,}7$ mm e
      $I_2E = 233{,}3$ mm:

      $$
      |\omega_2| = \frac{v_D}{I_2D} = \frac{225}{666{,}7} = 0{,}3375\ \text{rad/s},
      \qquad
      v_E = 0{,}3375\cdot 233{,}3 = 78{,}75\ \text{mm/s}
      $$

      Lo mismo, y E, debajo de $I_2$, va hacia la izquierda con el giro
      horario.

      **Lo que dice el resultado.** E va unas cuatro veces y media más despacio que
      B. La velocidad de D es la media de las de A y B como vectores, no
      como módulos: 225 mm/s, y no la media de 270 y 360. Y el CIR de la
      barra 2 queda muy por encima de E, así que la barra 2 gira despacio.

  - id: ejma8-col85-la-deslizadera-d-de-la-barra-ad
    titulo: La deslizadera de una barra movida por una manivela
    fuente: >-
      Ejercicio 8.5 · Tema 8, «Análisis del movimiento plano» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado y el
      profesor su resolución, contra los que está contrastado el desarrollo.
    nivel: practica
    antes:
      idea: |
        Cada barra es un sólido rígido. En cada instante hay un punto del
        plano, unido a la barra, con velocidad nula: el centro instantáneo de
        rotación, alrededor del cual gira la barra en ese instante. Las
        aceleraciones de dos puntos de la barra se relacionan con su
        velocidad angular y su aceleración angular.
      formula: |
        Los campos de velocidades y de aceleraciones del sólido rígido en el
        plano, con A un punto conocido e I el centro instantáneo de
        rotación:

        $$
        \vec{v}_P = \vec{v}_A + \vec{\omega}\times\overrightarrow{AP},
        \qquad
        \vec{v}_P = \vec{\omega}\times\overrightarrow{IP}
        $$

        $$
        \vec{a}_P = \vec{a}_A + \vec{\alpha}\times\overrightarrow{AP} - \omega^{2}\,\overrightarrow{AP}
        $$
      reconocer: |
        Antes de calcular se mira qué se sabe, sin hacer cuentas, de la
        velocidad de B y de la de D.
    enunciado: |
      En el mecanismo de la figura la barra $BC$ tiene una velocidad angular de
      4 rad/s constante y en el sentido de las agujas del reloj. En el momento
      considerado en la figura, calcular:

      a) Velocidad angular de la barra $AD$.

      b) Velocidad y aceleración de la deslizadera $D$.

