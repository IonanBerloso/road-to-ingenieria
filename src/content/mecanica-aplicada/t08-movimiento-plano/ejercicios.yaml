        <text x="61" y="212" font-size="9" text-anchor="middle" fill="var(--faint)">150</text>
        <line x1="82" y1="200" x2="124" y2="200" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="103" y="212" font-size="9" text-anchor="middle" fill="var(--faint)">150</text>
        <line x1="124" y1="200" x2="194" y2="200" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="159" y="212" font-size="9" text-anchor="middle" fill="var(--faint)">250</text>
        <line x1="212" y1="35" x2="212" y2="175" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="217" y="108" font-size="9" fill="var(--faint)">500</text>
