        <path d="M97 130 L89 141 L105 141 z" fill="none" stroke="var(--ink)" stroke-width="1.1"/>
        <path d="M88 145 L82 152 M96 145 L90 152 M104 145 L98 152" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <circle cx="154.5" cy="80.5" r="3.4" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.4"/>
        <path d="M62 104 A 50 50 0 0 1 84 76" fill="none" stroke="var(--flag)" stroke-width="1.5" marker-end="url(#ejma8-col88-fl)"/>
