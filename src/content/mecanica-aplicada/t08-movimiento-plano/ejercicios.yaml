        <path d="M20 195 L11 200 M40 206 L31 211 M60 218 L51 223 M80 230 L71 235 M100 241 L91 246 M120 253 L111 258 M140 264 L131 269" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
