        <text x="30" y="178" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">C</text>
        <circle cx="92" cy="70" r="2.4" fill="var(--ink)"/>
        <text x="104" y="86" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">A</text>
        <circle cx="92" cy="160" r="2.4" fill="var(--ink)"/>
        <text x="104" y="178" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">B</text>
        <circle cx="200" cy="160" r="2.4" fill="var(--ink)"/>
        <text x="206" y="164" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">D</text>
