    pide: Las velocidades angulares del disco y de BC, sus centros instantáneos de rotación y sus aceleraciones angulares.
    pasos:
      - tipo: reconocer
        pregunta: |
          El disco contacta **sin deslizamiento** con la barra $O_1A$, que a su
          vez gira. ¿Qué impone eso en el punto $A$?
        opciones:
          - texto: >-
              Que el punto A del disco y el punto A de la barra lleven la misma
              velocidad, que no es nula
            correcta: true
            mensaje: |
              Eso es. Rodadura significa velocidades iguales en el contacto. Y
              como la barra gira alrededor de $O_1$ con $AO_1 = 2R$, esa
              velocidad común vale $2\omega R$, hacia arriba.
          - texto: Que el punto de contacto A esté quieto, por ser el CIR del disco
            mensaje: |
              Eso valdría si la barra estuviera fija. Aquí la barra gira, así que
              $A$ se mueve a $2\omega R$ y el CIR del disco está en otro sitio:
              a $R$ a la derecha de $A$.
          - texto: Que el disco y la barra giren con la misma velocidad angular
            mensaje: |
              La rodadura iguala **velocidades de un punto**, no velocidades
              angulares. Aquí el disco gira a $2\omega$ y la barra a $\omega$, en
              sentidos contrarios.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el mecanismo con las velocidades
          de B y de A, la dirección de la de C y el sentido en que giran BC y
          el disco**. Solo las direcciones, sin escala.
        comprueba:
          - punto: |
              **$\vec{v}_B$ horizontal, hacia la derecha, y $\vec{v}_A$
              vertical, hacia arriba.**
            porque: |
              $O_2B$ gira en sentido horario, y B está encima de $O_2$: va hacia
              la derecha. La barra 4 también gira en sentido horario, y A está
              a la izquierda de $O_1$: sube.
          - punto: |
              **$\vec{v}_C$ a 45°, hacia arriba y a la derecha.**
            porque: |
              C es un punto de BC, que es horizontal: la componente horizontal
              de su velocidad es la de B. Y es un punto del disco, con CA
              vertical: su componente vertical es la de A. Las dos valen lo
              mismo, $2\omega$ por $R$ y $\omega$ por $2R$.
          - punto: |
              **BC gira en sentido antihorario, y el disco en sentido horario.**
            porque: |
              Respecto de B, C sube, y está a su derecha: alrededor de B, eso
              es un giro antihorario. Respecto de A, C va hacia la derecha, y
              está encima: alrededor de A, eso es un giro horario.
