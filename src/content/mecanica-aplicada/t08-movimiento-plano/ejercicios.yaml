        <line x1="45" y1="200" x2="45" y2="146" stroke="var(--ink)" stroke-width="3.2"/>
        <line x1="45" y1="146" x2="180" y2="92" stroke="var(--ink)" stroke-width="3.2"/>
        <line x1="180" y1="92" x2="315" y2="38" stroke="var(--ink)" stroke-width="3.2"/>
        <line x1="180" y1="200" x2="180" y2="92" stroke="var(--ink)" stroke-width="3.2"/>
