        <line x1="209" y1="230" x2="174" y2="230" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="168" y="234" font-size="10" text-anchor="end" fill="var(--ink)" font-style="italic">v<tspan font-size="7.5" dy="2.5">B</tspan></text>
        <circle cx="40" cy="230" r="2.4" fill="var(--ink)"/>
        <text x="54" y="242" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">O</text>
        <circle cx="75.4" cy="194.6" r="2.4" fill="var(--ink)"/>
        <text x="82" y="186" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">A</text>
        <circle cx="221" cy="230" r="2.4" fill="var(--ink)"/>
        <text x="238" y="228" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">B</text>
        <circle cx="221" cy="49" r="2.4" fill="var(--ink)"/>
        <text x="210" y="46" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">I</text>
      </svg>
      <figcaption>

      Solo las direcciones, sin escala. El CIR de la biela, I, está donde se cortan las perpendiculares a las velocidades de A y de B: la prolongación de la manivela y la vertical por B. Ejes: x hacia la derecha, y hacia arriba; giros positivos en sentido antihorario.

      </figcaption>
      </figure>

      - **La manivela** gira alrededor de O a 10 rad/s, antihoraria: A se
        mueve en perpendicular a OA, a $v_A = 10\cdot 0{,}1 = 1$ m/s.
      - **La deslizadera B** solo puede moverse por la guía: $\vec{v}_B$ es
        horizontal.
      - **La biela** tiene su CIR, I, donde se cortan las perpendiculares a
        las dos velocidades: la recta OA y la vertical por B. Alrededor de I,
        A va hacia arriba y a la izquierda, así que la biela gira en sentido
        horario y B va hacia la izquierda.

      **2. Incógnitas.** $\omega_{AB}$ y $v_B$.

      **3. Ecuaciones.** Con O en el origen, x hacia la derecha e y hacia
      arriba, $A = (0{,}0707;\ 0{,}0707)$ m, y B, en la guía a 0,3 m de A:

      $$
      x_B = 0{,}0707 + \sqrt{0{,}3^{2} - 0{,}0707^{2}} = 0{,}362\ \text{m}
      $$

      El CIR, en la recta $y = x$ sobre la vertical de B,
      $I = (0{,}362;\ 0{,}362)$ m. Cada punto de la biela gira alrededor de I:

      $$
      v_A = |\omega_{AB}|\;IA,
      \qquad
      v_B = |\omega_{AB}|\;IB
      $$

      con $IA = \sqrt{2}\,(0{,}362 - 0{,}0707) = 0{,}412$ m e $IB = 0{,}362$ m.

      **4. Resultados.**

      $$
      |\omega_{AB}| = \frac{1}{0{,}412} = 2{,}425\ \text{rad/s},
      \qquad
      v_B = 2{,}425\cdot 0{,}362 = 0{,}879\ \text{m/s}
      $$

      Con los sentidos del esquema:

      $$
      \vec{\omega}_{AB} = -2{,}425\,\vec{k}\ \text{rad/s},
      \qquad
      \vec{v}_B = -0{,}879\,\vec{i}\ \text{m/s}
      $$

      **5. Comprobación.** Derivando la posición de B, sin CIR ni campo de
      velocidades. Con $\theta$ el ángulo de la manivela, $r = 0{,}1$ m y
      $L = 0{,}3$ m, B está en
      $x_B = r\cos\theta + \sqrt{L^{2} - r^{2}\sin^{2}\theta}$, y derivando
      con $\dot\theta = 10$ rad/s:

      $$
      \dot x_B = -r\dot\theta\sin\theta - \frac{r^{2}\dot\theta\sin\theta\cos\theta}{\sqrt{L^{2} - r^{2}\sin^{2}\theta}}
      = -0{,}707 - \frac{0{,}05}{0{,}2915} = -0{,}879\ \text{m/s}
      $$

      La biela forma con la guía un ángulo $\varphi$ con
      $L\sin\varphi = r\sin\theta$; derivando,
      $L\cos\varphi\,\dot\varphi = r\cos\theta\,\dot\theta$, y con
      $L\cos\varphi = 0{,}2915$ m, $\dot\varphi = 0{,}707/0{,}2915 = 2{,}425$
      rad/s, el ángulo que la biela forma con la guía crece: la biela gira
      en sentido horario. Lo mismo.

      **Lo que dice el resultado.** La biela gira unas cuatro veces más despacio
      que la manivela: es más larga y su CIR queda lejos, por encima de B. Y
      B va más despacio que A, a 0,879 m/s frente a 1: está más cerca del
      CIR. En el punto muerto, con la manivela horizontal, B se pararía; y
      con la manivela vertical, la biela se trasladaría, sin girar.

  - id: ejma8-la-aceleracion-del-punto-de-contacto
    titulo: El punto de contacto de un disco que rueda, quieto pero acelerado
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    antes:
      idea: |
        Las aceleraciones de los puntos de un sólido rígido tampoco son
        independientes: conocida la de un punto, la velocidad angular y la
        aceleración angular, sale la de cualquier otro. A la aceleración del
        punto conocido se le suman dos términos: el tangencial, perpendicular
        a la recta que los une, y el normal, a lo largo de ella y hacia el
        punto conocido.
      formula: |
        El campo de aceleraciones del sólido rígido en el plano, con A el
        punto conocido:

        $$
        \vec{a}_P = \vec{a}_A + \vec{\alpha}\times\overrightarrow{AP} - \omega^{2}\,\overrightarrow{AP}
        $$

        El término tangencial mide $|\alpha|\,AP$ y el normal,
        $\omega^{2}\,AP$.
      reconocer: |
        Antes de calcular se mira qué se sabe del movimiento del centro.
    enunciado: |
      Un disco de radio $R = 0{,}3\ \text{m}$ rueda sin deslizar sobre un suelo
      horizontal con velocidad angular constante $\omega = 10\ \text{rad/s}$.
      Calcular la aceleración de su centro y la del punto del disco que en ese
      instante toca el suelo.
    pide: La aceleración del centro y la del punto de contacto.
    pasos:
      - tipo: reconocer
        pregunta: |
          El punto de contacto tiene velocidad nula en ese instante. ¿Y su
          aceleración?
        opciones:
          - texto: No es nula, apunta hacia el centro del disco
            correcta: true
            mensaje: |
              Eso es. Un instante después el punto se levanta del suelo: su
              velocidad cambia, y lo hace hacia arriba. Es la aceleración del
              CIR, $\vec{v}_s \times \vec{\omega}$.
          - texto: Es nula, porque el punto está quieto
            mensaje: |
              Está quieto **solo en ese instante**. Una velocidad que vale cero
              en un instante y no en el siguiente tiene aceleración.
          - texto: Es horizontal, en el sentido del avance
            mensaje: |
              El centro va a velocidad constante, así que no hay nada que
              acelere en horizontal. Lo que queda es la centrípeta de un punto
              que gira alrededor del centro, y apunta hacia él.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el disco con su giro, la
          velocidad del centro y el punto de contacto**. Solo las direcciones,
          sin escala.
        comprueba:
          - punto: |
              **En el punto de contacto, ninguna flecha de velocidad.**
            porque: |
              Rueda sin deslizar: en ese instante, el punto de contacto no se
              mueve respecto del suelo.
          - punto: |
              **$\omega$ en sentido horario, y $\vec{v}_O$ horizontal, hacia
              la derecha.**
            porque: |
              Un disco que gira en sentido horario sobre el suelo avanza hacia
              la derecha.
          - punto: |
              **La trayectoria del centro, una recta horizontal a la altura
              R.**
            porque: |
              El disco no se separa del suelo ni se hunde en él: su centro
              está siempre a la distancia R del suelo.
        figura: |
          <svg viewBox="0 24 240 186" role="img" width="240" height="186" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">Esquema de velocidades del disco que rueda sin deslizar</title>
            <desc id="dsl-d">El disco de centro O, apoyado en el suelo en I, con el suelo rayado debajo. Alrededor de O, el giro omega en sentido horario. En O, la velocidad del centro, horizontal hacia la derecha. En I, ninguna flecha: su velocidad es nula.</desc>
            <defs>
              <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
              </marker>
              <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
              </marker>
              <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
              </marker>
            </defs>
            <path d="M160 95 A50 50 0 1 0 60 95 A50 50 0 1 0 160 95 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M30 145 H200" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M42 145 l-7 7 M62 145 l-7 7 M82 145 l-7 7 M102 145 l-7 7 M122 145 l-7 7 M142 145 l-7 7 M162 145 l-7 7 M182 145 l-7 7 M202 145 l-7 7" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M93.1 88.8 A18 18 0 0 1 124.7 84.7" fill="none" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
            <text x="134" y="74" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">ω</text>
            <line x1="112" y1="95" x2="140" y2="95" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
            <text x="128" y="106" font-size="10" text-anchor="middle" fill="var(--ink)" font-style="italic">v<tspan font-size="7.5" dy="2.5">O</tspan></text>
            <circle cx="110" cy="95" r="2.4" fill="var(--ink)"/>
            <text x="104" y="108" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">O</text>
            <circle cx="110" cy="145" r="2.4" fill="var(--ink)"/>
            <text x="104" y="160" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">I</text>
            <text x="118" y="162" font-size="9" text-anchor="start" fill="var(--faint)">v<tspan font-size="7" dy="2">I</tspan><tspan dy="-2"> = 0</tspan></text>
            <line x1="158" y1="198" x2="188" y2="198" stroke="var(--ink)" stroke-width="1" marker-end="url(#dsl-fe)"/>
            <line x1="158" y1="198" x2="158" y2="168" stroke="var(--ink)" stroke-width="1" marker-end="url(#dsl-fe)"/>
            <text x="192" y="201" font-size="9.5" font-style="italic" fill="var(--ink)">x</text>
            <text x="154" y="170" font-size="9.5" font-style="italic" text-anchor="end" fill="var(--ink)">y</text>
            <path d="M225.5 189.5 A11 11 0 1 0 205.7 187.8" fill="none" stroke="var(--ink)" stroke-width="1" marker-end="url(#dsl-fe)"/>
            <text x="231" y="176" font-size="10" fill="var(--ink)">+</text>
          </svg>

      - tipo: calcular
        titulo: La aceleración del centro
        pregunta: |
          ¿Cuánto vale la aceleración del centro, en m/s²?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.01
          formato: un número, en m/s²
        distractores:
          - valor: '30'
            mensaje: |
              Esa es la centrípeta de un punto de la periferia. El centro va en
              línea recta a $\omega R = 3\ \text{m/s}$ constante: su aceleración
              es nula.
        pista: |
          El centro avanza en línea recta a $\omega R$, y $\omega$ es constante.
        desarrollo: |
          $v_O = \omega R = 3\ \text{m/s}$, constante y en línea recta, así que
          $a_O = 0$.

      - tipo: calcular
        titulo: La aceleración del punto de contacto
        pregunta: |
          ¿Cuánto vale la aceleración del punto de contacto, en m/s²?
        respuesta:
          tipo: numero
          valor: '30'
          tolerancia: 0.1
          formato: un número, en m/s²
        distractores:
          - valor: '0'
            mensaje: |
              Es el error de tomar el CIR por un punto fijo. Su velocidad es
              cero en ese instante, pero su aceleración, no.
          - valor: '3'
            mensaje: |
              Has calculado $\omega R$, que es una velocidad. La aceleración
              centrípeta es $\omega^{2} R$.
        pista: |
          $\vec{a}_P = \vec{a}_O + \vec{\alpha} \times \overrightarrow{OP} - \omega^{2}\,\overrightarrow{OP}$,
          con $a_O = 0$ y $\alpha = 0$.
        desarrollo: |
          $$
          a_I = \omega^{2} R = 100 \cdot 0{,}3 = 30\ \text{m/s}^{2}
          $$

          Vertical, hacia arriba, hacia el centro del disco.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: El centro va en línea recta a velocidad constante, así que $a_O = 0$.
          - texto: 'Con $\alpha = 0$, cada punto tiene solo la aceleración normal respecto del centro: $\omega^{2}$ por su distancia, hacia él.'
          - texto: El punto de contacto está a $R$ del centro, así que acelera $\omega^{2}R = 30$ m/s² hacia arriba.
          - texto: El punto de contacto es el CIR, así que su aceleración es nula.
            trampa: true
            mensaje: |
              El CIR tiene velocidad nula, no aceleración nula. Su aceleración es
              $\vec{v}_s \times \vec{\omega}$, que aquí vale $\omega^{2} R$.
    resolucion: |
      **1. Esquema de velocidades.** Es un problema de cinemática: el dibujo
      lleva el giro y la velocidad del centro, sin escala.

      <figure class="figura-examen">
      <svg viewBox="0 24 240 186" role="img" width="360" height="279" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">Esquema de velocidades del disco que rueda sin deslizar</title>
        <desc id="dsl-d">El disco de centro O, apoyado en el suelo en I, con el suelo rayado debajo. Alrededor de O, el giro omega en sentido horario. En O, la velocidad del centro, horizontal hacia la derecha. En I, ninguna flecha: su velocidad es nula.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M160 95 A50 50 0 1 0 60 95 A50 50 0 1 0 160 95 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M30 145 H200" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M42 145 l-7 7 M62 145 l-7 7 M82 145 l-7 7 M102 145 l-7 7 M122 145 l-7 7 M142 145 l-7 7 M162 145 l-7 7 M182 145 l-7 7 M202 145 l-7 7" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M93.1 88.8 A18 18 0 0 1 124.7 84.7" fill="none" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="134" y="74" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">ω</text>
        <line x1="112" y1="95" x2="140" y2="95" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="128" y="106" font-size="10" text-anchor="middle" fill="var(--ink)" font-style="italic">v<tspan font-size="7.5" dy="2.5">O</tspan></text>
        <circle cx="110" cy="95" r="2.4" fill="var(--ink)"/>
        <text x="104" y="108" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">O</text>
        <circle cx="110" cy="145" r="2.4" fill="var(--ink)"/>
        <text x="104" y="160" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">I</text>
        <text x="118" y="162" font-size="9" text-anchor="start" fill="var(--faint)">v<tspan font-size="7" dy="2">I</tspan><tspan dy="-2"> = 0</tspan></text>
        <line x1="158" y1="198" x2="188" y2="198" stroke="var(--ink)" stroke-width="1" marker-end="url(#dsl-fe)"/>
        <line x1="158" y1="198" x2="158" y2="168" stroke="var(--ink)" stroke-width="1" marker-end="url(#dsl-fe)"/>
        <text x="192" y="201" font-size="9.5" font-style="italic" fill="var(--ink)">x</text>
        <text x="154" y="170" font-size="9.5" font-style="italic" text-anchor="end" fill="var(--ink)">y</text>
        <path d="M225.5 189.5 A11 11 0 1 0 205.7 187.8" fill="none" stroke="var(--ink)" stroke-width="1" marker-end="url(#dsl-fe)"/>
        <text x="231" y="176" font-size="10" fill="var(--ink)">+</text>
      </svg>
      <figcaption>

      Solo las direcciones, sin escala. I, el punto del disco que toca el suelo, no se mueve en ese instante; el centro, siempre a la altura R, se mueve en horizontal. Ejes: x hacia la derecha, y hacia arriba; giros positivos en sentido antihorario.

      </figcaption>
      </figure>

      - **I, el punto de contacto.** Rodar sin deslizar quiere decir que, en
        ese instante, no se mueve respecto del suelo: $\vec{v}_I = \vec{0}$.
      - **El giro**, $\omega = 10\ \text{rad/s}$ en sentido horario,
        constante: $\alpha = 0$.
      - **O, el centro**, siempre a la altura R: se mueve en una recta
        horizontal, a $v_O = \omega R = 3$ m/s.

      **2. Incógnitas.** $\vec{a}_O$ y $\vec{a}_I$.

      **3. Ecuaciones.** Ejes x hacia la derecha e y hacia arriba. El centro
      va en línea recta, con $v_O = \omega R$ y $\omega$ constante:

      $$
      \vec{v}_O = \omega R\,\vec{i},
      \qquad
      \vec{a}_O = \frac{d\vec{v}_O}{dt} = \dot\omega R\,\vec{i}
      $$

      El campo de aceleraciones desde O, con $\overrightarrow{OI} = -R\,\vec{j}$:

      $$
      \vec{a}_I = \vec{a}_O + \vec{\alpha}\times\overrightarrow{OI} - \omega^{2}\,\overrightarrow{OI}
      $$

      **4. Resultados.** Con $\dot\omega = \alpha = 0$:

      $$
      \vec{a}_O = \vec{0},
      \qquad
      \vec{a}_I = \omega^{2}R\,\vec{j} = 100\cdot 0{,}3\,\vec{j} = 30\,\vec{j}\ \text{m/s}^{2}
      $$

      **El centro no acelera, y el punto de contacto acelera 30 m/s² hacia
      arriba**, hacia el centro. Lo mismo vale para cualquier punto de la
      periferia: con $\vec{a}_O = \vec{0}$ y $\alpha = 0$, queda
      $\vec{a}_P = -\omega^{2}\,\overrightarrow{OP}$, 30 m/s² hacia el centro.

      <figure class="figura-examen">
      <svg viewBox="0 24 240 186" role="img" width="360" height="279" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">Aceleraciones de tres puntos de la periferia del disco que rueda</title>
        <desc id="dsl-d">El disco de centro O, apoyado en el suelo en I. En I, su aceleración, vertical hacia arriba, hacia O. En A, el punto más alto, la suya, vertical hacia abajo, hacia O. En D, el punto delantero, la suya, horizontal hacia la izquierda, hacia O. Las tres flechas, iguales. En O, ninguna flecha: su aceleración es nula.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M160 95 A50 50 0 1 0 60 95 A50 50 0 1 0 160 95 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M30 145 H200" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M42 145 l-7 7 M62 145 l-7 7 M82 145 l-7 7 M102 145 l-7 7 M122 145 l-7 7 M142 145 l-7 7 M162 145 l-7 7 M182 145 l-7 7 M202 145 l-7 7" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <line x1="110" y1="145" x2="110" y2="117" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="116" y="126" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">a<tspan font-size="7.5" dy="2.5">I</tspan></text>
        <line x1="110" y1="45" x2="110" y2="73" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="116" y="66" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">a<tspan font-size="7.5" dy="2.5">A</tspan></text>
        <line x1="160" y1="95" x2="132" y2="95" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="146" y="88" font-size="10" text-anchor="middle" fill="var(--ink)" font-style="italic">a<tspan font-size="7.5" dy="2.5">D</tspan></text>
        <circle cx="110" cy="95" r="2.4" fill="var(--ink)"/>
        <text x="104" y="108" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">O</text>
        <circle cx="110" cy="145" r="2.4" fill="var(--ink)"/>
        <text x="104" y="160" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">I</text>
        <circle cx="110" cy="45" r="2.4" fill="var(--ink)"/>
        <text x="104" y="40" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">A</text>
        <circle cx="160" cy="95" r="2.4" fill="var(--ink)"/>
        <text x="166" y="88" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">D</text>
        <text x="98" y="88" font-size="9" text-anchor="end" fill="var(--faint)">a<tspan font-size="7" dy="2">O</tspan><tspan dy="-2"> = 0</tspan></text>
        <line x1="158" y1="198" x2="188" y2="198" stroke="var(--ink)" stroke-width="1" marker-end="url(#dsl-fe)"/>
        <line x1="158" y1="198" x2="158" y2="168" stroke="var(--ink)" stroke-width="1" marker-end="url(#dsl-fe)"/>
        <text x="192" y="201" font-size="9.5" font-style="italic" fill="var(--ink)">x</text>
        <text x="154" y="170" font-size="9.5" font-style="italic" text-anchor="end" fill="var(--ink)">y</text>
        <path d="M225.5 189.5 A11 11 0 1 0 205.7 187.8" fill="none" stroke="var(--ink)" stroke-width="1" marker-end="url(#dsl-fe)"/>
        <text x="231" y="176" font-size="10" fill="var(--ink)">+</text>
      </svg>
      <figcaption>

      Las tres flechas miden lo mismo, omega al cuadrado por R, y apuntan al centro, que no acelera. El punto de contacto no se mueve, pero acelera hacia arriba: un instante después se levanta del suelo. Ejes: x hacia la derecha, y hacia arriba; giros positivos en sentido antihorario.

      </figcaption>
      </figure>

      **5. Comprobación.** Siguiendo al punto material, sin el campo de
      aceleraciones. Si en $t = 0$ toca el suelo en el origen, en el instante
      $t$ el centro está en $(\omega R t;\ R)$ y el punto, girado
      $\omega t$ en sentido horario alrededor de él, en la cicloide

      $$
      x = R\,(\omega t - \sin\omega t),
      \qquad
      y = R\,(1 - \cos\omega t)
      $$

      Derivando dos veces:
      $\ddot x = R\omega^{2}\sin\omega t$ e $\ddot y = R\omega^{2}\cos\omega t$.
      En $t = 0$, $(0;\ R\omega^{2}) = (0;\ 30)$ m/s²: lo mismo. Y la primera
      derivada, $\dot x = R\omega\,(1 - \cos\omega t)$ e
      $\dot y = R\omega\sin\omega t$, es nula en $t = 0$: el punto está
      quieto, pero acelerado.

      **Lo que dice el resultado.** El CIR sirve para las velocidades y no
      para las aceleraciones: el punto de contacto tiene velocidad nula, pero
      un instante después se levanta del suelo, y esa velocidad que aparece
      hacia arriba es su aceleración. Aquí el punto de aceleración nula es el
      centro, no el punto de contacto.

  - id: ejma8-col81-el-disco-y-las-dos-barras
    titulo: Las dos barras que cuelgan de un disco que gira
    fuente: >-
      Ejercicio 8.1 · Tema 8, «Análisis del movimiento plano» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado y el
      profesor su resolución, contra los que está contrastado el desarrollo. El
      resultado es simbólico, así que las casillas piden el coeficiente que
      multiplica a la expresión indicada en cada pregunta.
    nivel: practica
    antes:
      idea: |
        Cada pieza del mecanismo es un sólido rígido con su propia velocidad
        angular y su propia aceleración angular. Una articulación pertenece a
        las dos piezas que une: su velocidad y su aceleración son las mismas
        calculadas desde cualquiera de ellas, y esa igualdad da las
        ecuaciones.
      formula: |
        Los campos de velocidades y de aceleraciones del sólido rígido en el
        plano, con A un punto conocido:

        $$
        \vec{v}_P = \vec{v}_A + \vec{\omega}\times\overrightarrow{AP},
        \qquad
        \vec{a}_P = \vec{a}_A + \vec{\alpha}\times\overrightarrow{AP} - \omega^{2}\,\overrightarrow{AP}
        $$

        Para una pieza que gira alrededor de un punto fijo, A es ese punto,
        con $\vec{v}_A = \vec{a}_A = \vec{0}$.
      reconocer: |
        Antes de calcular se mira la dirección de la velocidad de cada
        articulación.
    enunciado: |
      En el mecanismo de la figura, el disco gira con una velocidad angular
      $\omega_0$ constante. Calcular:

      a) Velocidad angular de barras (1) y (2).

      b) Aceleración angular de barras (1) y (2).

      c) Aceleración de los centros de gravedad de barras (1) y (2).

      <figure>
      <svg viewBox="0 0 330 215" role="img" width="330" height="215" aria-labelledby="ejma8-col81-t ejma8-col81-d">
        <title id="ejma8-col81-t">Disco que gira alrededor de O, con la barra AB colgando de su borde y la barra BC articulada en el punto fijo C</title>
        <desc id="ejma8-col81-d">Un disco de radio R gira con velocidad angular omega cero constante alrededor de su centro fijo O. En el punto A de su periferia, situado a la derecha de O y a su misma altura, se articula la barra 1, AB, vertical y de longitud R. En su extremo inferior B se articula la barra 2, BC, horizontal y de longitud dos R, cuyo otro extremo C es un punto fijo. G1 y G2 son los centros de gravedad de las dos barras, cada uno en el punto medio de la suya. La figura está dibujada a escala.</desc>
        <defs>
          <marker id="ejma8-col81-fl" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
        </defs>
