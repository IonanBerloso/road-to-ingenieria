      - tipo: calcular
        titulo: La velocidad angular de la placa
        pregunta: |
          ¿Cuánto vale $\omega_{BDE}$, en rad/s?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.01
          formato: un número, en rad/s
        distractores:
          - valor: '4'
            mensaje: |
              Esa es la de las barras. La placa está articulada a ellas, pero en
              un paralelogramo la barra gira y la biela opuesta se traslada: son
              movimientos distintos.
          - valor: '2'
            mensaje: |
              Ese es el valor de $\alpha_{CD}$, que además es una aceleración
              angular. La velocidad angular de la placa sale de comparar
              $\vec{v}_B$ y $\vec{v}_D$, y son iguales.
        pista: |
          Calcula $\vec{v}_B$ y $\vec{v}_D$ por separado y compáralos: si son
          iguales, $\vec{\omega}\times\overrightarrow{BD} = 0$ y, con $BD$ no
          nulo, $\omega = 0$.
        desarrollo: |
          Las dos barras giran igual —lo impone el paralelogramo—, así que

          $$
          \vec{v}_B = \vec{\omega}_{CD}\times\overrightarrow{AB}
          \qquad
          \vec{v}_D = \vec{\omega}_{CD}\times\overrightarrow{CD}
          $$

          y como $\overrightarrow{AB} = \overrightarrow{CD}$, los dos vectores
          coinciden. Entonces
          $\vec{\omega}_{BDE}\times\overrightarrow{BD} = 0$ y
          $\omega_{BDE} = 0$.

      - tipo: calcular
        titulo: La velocidad de cualquier punto de la placa
        pregunta: |
          Si la placa se traslada, todos sus puntos van igual. ¿A qué velocidad,
          en m/s?
        respuesta:
          tipo: numero
          valor: '2.4'
          tolerancia: 0.02
          formato: un número, en m/s
        distractores:
          - valor: '4'
            mensaje: |
              Eso son rad/s, la velocidad angular de las barras. Para pasar a
              m/s hay que multiplicar por la longitud de la barra, 0,60 m.
          - valor: '1.2'
            mensaje: |
              Has usado 30 cm, que es la proyección horizontal de la barra, en
              lugar de su longitud real de 60 cm.
        pista: |
          Todos los puntos llevan la velocidad de $B$, y $B$ gira alrededor de
          $A$ con $AB = 0{,}60$ m.
        desarrollo: |
          $$
          v = \omega_{CD}\,AB = 4 \cdot 0{,}60 = 2{,}4\ \text{m/s}
          $$

          perpendicular a las barras.

      - tipo: calcular
        titulo: La aceleración de cualquier punto de la placa
        pregunta: |
          ¿Y cuánto vale la aceleración de cualquier punto de la placa, en
          m/s²?
        respuesta:
          tipo: numero
          valor: '9.675'
          tolerancia: 0.03
          formato: un número, en m/s²
        distractores:
          - valor: '9.6'
            mensaje: |
              Esa es solo la componente normal, $\omega^{2}\,AB$. Como hay
              aceleración angular, falta la tangencial $\alpha\,AB = 1{,}2$
              m/s², perpendicular a la anterior.
          - valor: '1.2'
            mensaje: |
              Esa es solo la tangencial, $\alpha\,AB$. La normal
              $\omega^{2}AB = 9{,}6$ m/s² es aquí ocho veces mayor, y las dos se
              componen en cuadratura.
        pista: |
          La placa se traslada, así que su aceleración es la de $B$, y $B$ gira
          alrededor de $A$: normal $\omega^{2}AB$ más tangencial $\alpha\,AB$,
          perpendiculares entre sí.
        desarrollo: |
          $$
          a = AB\sqrt{\alpha^{2} + \omega^{4}} = 0{,}60\sqrt{4 + 256}
          = 0{,}60 \cdot 16{,}125 = 9{,}675\ \text{m/s}^{2}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $AB$ y $CD$ son iguales y paralelas, así que $ABDC$ es un
              paralelogramo articulado y las dos barras giran igual.
          - texto: >-
              Entonces $\vec{v}_B = \vec{v}_D$ y
              $\vec{\omega}_{BDE}\times\overrightarrow{BD} = 0$, de donde
              $\omega_{BDE} = 0$.
          - texto: >-
              Repitiendo el argumento con aceleraciones,
              $\vec{a}_B = \vec{a}_D$ y también $\alpha_{BDE} = 0$.
          - texto: >-
              Como la placa no gira, todos sus puntos están en reposo y su
              aceleración es nula.
            trampa: true
            mensaje: |
              No girar no es estar quieto. La placa se **traslada**, y sus
              puntos van a 2,4 m/s con una aceleración de 9,675 m/s²
              —describiendo cada uno un arco de 60 cm de radio—. Lo que vale
              cero es la velocidad angular, no la velocidad.
    resolucion: |
      **1. Esquema de velocidades.** Es un problema de cinemática: el dibujo
      lleva la dirección de las velocidades de B y de D y sus
      perpendiculares, sin escala.

      <figure class="figura-examen">
      <svg viewBox="8 10 266 214" role="img" width="399" height="321" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">Esquema de velocidades de la placa colgada de dos barras iguales</title>
        <desc id="dsl-d">Del techo cuelgan las barras AB y CD, iguales y paralelas, bajando hacia la derecha a 60 grados; sus extremos B y D sostienen la placa triangular BDE. En B y en D, sus velocidades, perpendiculares a las barras, hacia abajo y a la izquierda. Las perpendiculares a esas velocidades son las rectas de las propias barras: dos rectas paralelas. Los giros de las dos barras, horarios.</desc>
