      </svg>
      <figcaption>

      Sin escala. AB se traslada: A y B van a la misma velocidad. C solo sube o baja. El CIR de CA está donde se cortan la horizontal por C y la vertical por A, que en este instante pasa por B; y el punto de CD que coincide con B está quieto, así que CD gira alrededor de él. Ejes: x hacia la derecha, y hacia arriba; giros positivos en sentido antihorario.

      </figcaption>
      </figure>

      - **AB** se traslada: A y B van a v, hacia la derecha, y sin
        aceleración, porque v es constante.
      - **La barra CA.** C solo puede subir o bajar. Su CIR está donde se
        cortan la horizontal por C y la vertical por A, que en este instante
        cae en B. Gira en sentido horario, y C sube.
      - **La barra CD.** B corre por ella. El punto de CD que coincide con B
        está quieto en este instante: CD gira alrededor de él, en sentido
        horario.

      Con C en el origen, x hacia la derecha e y hacia arriba:
      $B = (L/\sqrt{3};\ 0)$ y $A = (L/\sqrt{3};\ L)$, con
      $CB = L/\sqrt{3}$ y $CA = 2L/\sqrt{3}$.

      **2. Incógnitas.** $\omega_2$, $v_C$, $\omega_3$ y $v_{B/3}$;
      $\alpha_2$, $a_C$, $\alpha_3$ y $a_{B/3}$.

      **3. Ecuaciones.** La barra CA, de A a C, con $\vec{v}_C$ y
      $\vec{a}_C$ verticales:

      $$
      \vec{v}_C = \vec{v}_A + \omega_2\vec{k}\times\overrightarrow{AC},
      \qquad
      \vec{a}_C = \vec{a}_A + \alpha_2\vec{k}\times\overrightarrow{AC} - \omega_2^{2}\,\overrightarrow{AC}
      $$

      Y B, como deslizadera sobre CD, con $\vec{v}_{B/3}$ y $\vec{a}_{B/3}$ a
      lo largo de CD:

      $$
      \vec{v}_B = \vec{v}_C + \omega_3\vec{k}\times\overrightarrow{CB} + \vec{v}_{B/3}
      $$

      $$
      \vec{a}_B = \vec{a}_C + \alpha_3\vec{k}\times\overrightarrow{CB} - \omega_3^{2}\,\overrightarrow{CB}
      + \vec{a}_{B/3} + 2\,\omega_3\vec{k}\times\vec{v}_{B/3}
      $$

      con $\vec{v}_A = \vec{v}_B = v\,\vec{i}$ y
      $\vec{a}_A = \vec{a}_B = \vec{0}$.

      **4. Resultados.** Con
      $\vec{k}\times\overrightarrow{AC} = (L;\ -L/\sqrt{3})$:

      $$
      v_C\,\vec{j} = \left(v + \omega_2 L;\ -\frac{\omega_2 L}{\sqrt{3}}\right)
      \;\Longrightarrow\;
      \omega_2 = -\frac{v}{L},
      \qquad
      v_C = \frac{v}{\sqrt{3}}
      $$

      Con $\vec{k}\times\overrightarrow{CB} = (0;\ L/\sqrt{3})$:

      $$
      (v;\ 0) = \left(v_{B/3};\ \frac{v}{\sqrt{3}} + \frac{L}{\sqrt{3}}\,\omega_3\right)
      \;\Longrightarrow\;
      \vec{\omega}_3 = -\frac{v}{L}\,\vec{k},
      \qquad
      v_{B/3} = v
      $$

      En aceleraciones, la barra CA, con
      $-\omega_2^{2}\,\overrightarrow{AC} = \left(\frac{v^{2}}{\sqrt{3}L};\ \frac{v^{2}}{L}\right)$:

      $$
      a_C\,\vec{j} = \left(\alpha_2 L + \frac{v^{2}}{\sqrt{3}L};\ -\frac{\alpha_2 L}{\sqrt{3}} + \frac{v^{2}}{L}\right)
      \;\Longrightarrow\;
      \alpha_2 = -\frac{v^{2}}{\sqrt{3}L^{2}},
      \qquad
      a_C = \frac{4}{3}\,\frac{v^{2}}{L}
      $$

      Y B, con el Coriolis,
      $2\,\omega_3\vec{k}\times v\,\vec{i} = -\frac{2v^{2}}{L}\,\vec{j}$, y
      $-\omega_3^{2}\,\overrightarrow{CB} = -\frac{v^{2}}{\sqrt{3}L}\,\vec{i}$:

      $$
      (0;\ 0) = \left(a_{B/3} - \frac{v^{2}}{\sqrt{3}L};\ \frac{4v^{2}}{3L} + \frac{L}{\sqrt{3}}\,\alpha_3 - \frac{2v^{2}}{L}\right)
      $$

      $$
      \vec{\alpha}_3 = \frac{2\sqrt{3}}{3}\,\frac{v^{2}}{L^{2}}\,\vec{k} = 1{,}155\,\frac{v^{2}}{L^{2}}\,\vec{k}
      $$

      **CD gira a $v/L$, en sentido horario, y tiene una aceleración angular
      de $\frac{2\sqrt{3}}{3}\,v^{2}/L^{2} \approx 1{,}155\,v^{2}/L^{2}$,
      antihoraria: su giro se frena.** Coinciden con los que publica la
      colección.

      **5. Comprobación.** Por la geometría, sin campos ni composición. Con
      x la distancia de AB a la guía de C, $\dot{x} = v$ y $\ddot{x} = 0$: C
      está $s = \sqrt{CA^{2} - x^{2}}$ por debajo de A, y B, L por debajo de
      A, así que la pendiente de CD es

      $$
      \tan\theta_3 = g(x) = \frac{s - L}{x}
      $$

      En el instante, $x = L/\sqrt{3}$, $s = L$ y la pendiente es nula, así
      que $\dot{\theta}_3 = g'\,v$ y $\ddot{\theta}_3 = g''\,v^{2}$. Con
      $s' = -x/s = -1/\sqrt{3}$ y $s'' = -CA^{2}/s^{3} = -4/(3L)$:

      $$
      g' = \frac{s'}{x} - \frac{s - L}{x^{2}} = -\frac{1}{L},
      \qquad
      g'' = \frac{s''}{x} - \frac{2s'}{x^{2}} = \frac{2\sqrt{3}}{3L^{2}}
      $$

      $\dot{\theta}_3 = -v/L$ y $\ddot{\theta}_3 = \frac{2\sqrt{3}}{3}\,v^{2}/L^{2}$.
      Lo mismo.

      **Lo que dice el resultado.** AB va uniformemente, pero CD no: su giro
      se frena a $1{,}155\,v^{2}/L^{2}$. Las barras CA y CD giran en este
      instante a la misma velocidad, $v/L$, y sus CIR caen en el mismo sitio,
      B; pero sus aceleraciones angulares no son iguales: la de CD es el
      doble que la de CA, y de sentido contrario, porque B corre por CD y
      aparece el Coriolis.

  - id: ejma8-col815-el-disco-sobre-la-barra-que-gira
    titulo: Un disco que rueda sobre una barra que a su vez gira
    fuente: >-
      Ejercicio 8.15 · Tema 8, «Análisis del movimiento plano» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado y el
      profesor su resolución, contra los que está contrastado el desarrollo. El
      resultado es simbólico, así que las casillas piden el coeficiente que
      multiplica a la expresión indicada en cada pregunta.
    nivel: practica
    antes:
      idea: |
        Las barras y el disco son sólidos rígidos, cada uno con su velocidad
        angular y su aceleración angular, y una articulación es un punto común
        a los dos sólidos que une. El CIR de un sólido es su punto de velocidad
        nula: está en la perpendicular a la velocidad de cada uno de sus
        puntos, a la distancia $v/|\omega|$. Y un punto visto desde una barra
        que gira tiene el arrastre, el relativo y, en las aceleraciones,
        además el término de Coriolis.
      formula: |
        Los campos de velocidades y de aceleraciones del sólido rígido en el
        plano, con Q un punto conocido:

        $$
        \vec{v}_P = \vec{v}_Q + \vec{\omega}\times\overrightarrow{QP},
        \qquad
        \vec{a}_P = \vec{a}_Q + \vec{\alpha}\times\overrightarrow{QP} - \omega^{2}\,\overrightarrow{QP}
        $$

        Y la composición de aceleraciones respecto de una barra 4 que gira:

        $$
        \vec{a}_P = \vec{a}_{P \in 4} + \vec{a}_{P/4} + 2\,\vec{\omega}_4\times\vec{v}_{P/4}
        $$
      reconocer: |
        Antes de calcular se mira qué condición impone cada apoyo y cada
        unión.
    enunciado: |
      Una barra rígida $O_1A$ gira alrededor del punto fijo $O_1$ con una
      velocidad angular $\omega$ constante y con sentido horario. Sobre esta
      barra contacta sin deslizamiento un disco de radio $R$. Este disco articula
      en su centro $C$ con la barra rígida $BC$, de longitud $2R$, que a su vez
      articula en $B$ con la barra $O_2B$, con punto fijo en $O_2$, de longitud
      $R$, y con velocidad angular $2\omega$ constante y con sentido horario. En
      el instante representado, las barras $O_1A$ y $BC$ pasan por la
      horizontal, y la barra $O_2B$ pasa por la vertical. Para este instante,
      calcular:

      a) Velocidad angular del disco y de la barra $BC$.

      b) Centro instantáneo de rotación del disco y de la barra $BC$.

      c) Aceleración angular del disco y de la barra $BC$.

      <figure>
      <svg viewBox="0 0 335 210" role="img" width="335" height="210" aria-labelledby="ejma8-col815-t ejma8-col815-d">
        <title id="ejma8-col815-t">Barra O2B vertical, barra BC horizontal, disco de centro C apoyado sobre la barra O1A horizontal</title>
        <desc id="ejma8-col815-d">A la izquierda, el punto fijo O2, del que sale hacia arriba la barra 1, de longitud R, hasta B. De B parte hacia la derecha la barra 2, BC, horizontal y de longitud dos R. En C está el centro del disco 3, de radio R, que se apoya sin deslizar sobre la barra 4, O1A, horizontal. A es el punto de contacto y O1 es el punto fijo de esa barra, a dos R de A. La barra O2B gira a dos omega en sentido horario y la barra O1A a omega, también horario. La figura está dibujada a escala.</desc>
        <defs>
          <marker id="ejma8-col815-fl" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
