        <text x="22" y="46" font-size="10" text-anchor="end" fill="var(--ink)" font-style="italic">ω<tspan font-size="7.5" dy="2.5">AB</tspan><tspan dy="-2.5"></tspan></text>
        <path d="M293.8 153.6 A14 14 0 0 0 273 143.9" fill="none" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="266" y="134" font-size="10" text-anchor="end" fill="var(--ink)" font-style="italic">ω<tspan font-size="7.5" dy="2.5">CD</tspan><tspan dy="-2.5"></tspan></text>
        <line x1="198" y1="62" x2="198" y2="94" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="204" y="76" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">v<tspan font-size="7.5" dy="2.5">B</tspan></text>
        <line x1="190" y1="120" x2="177.8" y2="150.6" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="172" y="152" font-size="10" text-anchor="end" fill="var(--ink)" font-style="italic">v<tspan font-size="7.5" dy="2.5">C</tspan></text>
        <circle cx="40" cy="60" r="2.4" fill="var(--ink)"/>
        <text x="52" y="52" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">A</text>
        <circle cx="190" cy="60" r="2.4" fill="var(--ink)"/>
        <text x="190" y="52" font-size="10" text-anchor="middle" font-weight="700" fill="var(--ink)">B</text>
        <circle cx="190" cy="120" r="2.4" fill="var(--ink)"/>
        <text x="182" y="116" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">C</text>
        <circle cx="280" cy="156" r="2.4" fill="var(--ink)"/>
        <text x="292" y="158" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">D</text>
      </svg>
      <figcaption>

      Solo las direcciones, sin escala. La velocidad de B, dibujada junto a B para que no la tape la barra BC, es perpendicular a AB; la de C, perpendicular a DC. Sus perpendiculares, AB y la recta DC, se cortan en A: el CIR de BC está en A. Ejes: x hacia la derecha, y hacia arriba; giros positivos en sentido antihorario.

      </figcaption>
      </figure>

      - **AB** gira alrededor de A a 4 rad/s, constante, en sentido horario:
        B va hacia abajo, a $4\cdot 0{,}25 = 1$ m/s.
      - **CD** gira alrededor del punto fijo D: $\vec{v}_C$ es perpendicular
        a DC.
      - **BC** tiene su CIR en A, donde se cortan la recta AB y la recta DC
        prolongada: en ese instante gira alrededor de A, como AB, en
        sentido horario. C va hacia abajo y a la izquierda, y CD gira en
        sentido antihorario.

      Con A en el origen, x hacia la derecha e y hacia arriba, en metros:
      $B = (0{,}25;\ 0)$, $C = (0{,}25;\ -0{,}10)$ y
      $D = (0{,}40;\ -0{,}16)$; $\overrightarrow{BC} = (0;\ -0{,}1)$ y
      $\overrightarrow{DC} = (-0{,}15;\ 0{,}06)$. El giro de AB,
      $-4\,\vec{k}$ rad/s.

      **2. Incógnitas.** $\omega_{BC}$, $\omega_{CD}$, $\alpha_{BC}$ y
      $\alpha_{CD}$.

      **3. Ecuaciones.** La velocidad de C, desde B y desde D:

      $$
      \vec{v}_B + \omega_{BC}\vec{k}\times\overrightarrow{BC}
      = \omega_{CD}\vec{k}\times\overrightarrow{DC},
      \qquad
      \vec{v}_B = -4\vec{k}\times\overrightarrow{AB} = -\vec{j}\ \text{m/s}
      $$

      Y la aceleración de C, igual; la de B es solo normal, porque AB gira a
      velocidad constante:

      $$
      \vec{a}_B + \alpha_{BC}\vec{k}\times\overrightarrow{BC} - \omega_{BC}^{2}\,\overrightarrow{BC}
      = \alpha_{CD}\vec{k}\times\overrightarrow{DC} - \omega_{CD}^{2}\,\overrightarrow{DC},
      \qquad
      \vec{a}_B = -4^{2}\,\overrightarrow{AB} = -4\,\vec{i}\ \text{m/s}^{2}
      $$

      **4. Resultados.** En velocidades,
      $-\vec{j} + 0{,}1\,\omega_{BC}\,\vec{i} = \omega_{CD}\,(-0{,}06\,\vec{i} - 0{,}15\,\vec{j})$:
      la vertical da $\omega_{CD} = 20/3$ y la horizontal,
      $\omega_{BC} = -4$.

      $$
      \vec{\omega}_{BC} = -4\,\vec{k}\ \text{rad/s},
      \qquad
      \vec{\omega}_{CD} = \frac{20}{3}\,\vec{k} = 6{,}667\,\vec{k}\ \text{rad/s}
      $$

      En aceleraciones, con $\omega_{BC}^{2}\,\overrightarrow{BC} = -1{,}6\,\vec{j}$
      y $\omega_{CD}^{2}\,\overrightarrow{DC} = -6{,}667\,\vec{i} + 2{,}667\,\vec{j}$:

      $$
      \left(-4 + 0{,}1\,\alpha_{BC};\ 1{,}6\right)
      = \left(-0{,}06\,\alpha_{CD} + 6{,}667;\ -0{,}15\,\alpha_{CD} - 2{,}667\right)
      $$

      La vertical da $\alpha_{CD}$, y con ella la horizontal da
      $\alpha_{BC}$:

      $$
      \vec{\alpha}_{CD} = -28{,}44\,\vec{k}\ \text{rad/s}^{2},
      \qquad
      \vec{\alpha}_{BC} = 123{,}73\,\vec{k}\ \text{rad/s}^{2}
      $$

      **BC gira a 4 rad/s, horaria, y CD a 6,667 rad/s, antihoraria; CD
      frena a 28,44 rad/s² y BC tiene 123,73 rad/s², antihoraria.** La
      colección publica $\alpha_{BC} = 124{,}13$ rad/s², que con los datos
      de la figura no se reproduce por ningún camino: la resolución del
      propio profesor obtiene 123,7 rad/s². Aquí se publica 123,73.

      **5. Comprobación.** Las velocidades, por el CIR de BC, que está en A:
      BC gira alrededor de A como si estuviera clavada allí, así que
      $|\omega_{BC}| = v_B/AB = 1/0{,}25 = 4$ rad/s, y C va a
      $4\cdot AC = 4\cdot 0{,}2693 = 1{,}077$ m/s;
      $|\omega_{CD}| = 1{,}077/DC = 1{,}077/0{,}1616 = 6{,}667$ rad/s. Las
      aceleraciones, derivando la condición de que CD no cambie de
      longitud, sin el campo de CD. Con $\theta_1$ el ángulo de AB y
      $\theta_2$ el de BC, $\dot\theta_1 = -4$ rad/s y $\ddot\theta_1 = 0$, el
      vector $\vec{u} = \overrightarrow{DC} = A + 0{,}25\,(\cos\theta_1;\ \sin\theta_1) + 0{,}1\,(\cos\theta_2;\ \sin\theta_2) - D$
      tiene longitud fija. En el instante, con $\theta_1 = 0$ y
      $\theta_2 = -90^\circ$:

      $$
      \dot{\vec{u}} = \left(0{,}1\,\dot\theta_2;\ -1\right),
      \qquad
      \vec{u}\cdot\dot{\vec{u}} = 0
      \;\Longrightarrow\;
      \dot\theta_2 = -4\ \text{rad/s}
      $$

      $$
      \ddot{\vec{u}} = \left(-4 + 0{,}1\,\ddot\theta_2;\ 1{,}6\right),
      \qquad
      \vec{u}\cdot\ddot{\vec{u}} + |\dot{\vec{u}}|^{2} = 0
      \;\Longrightarrow\;
      0{,}6 - 0{,}015\,\ddot\theta_2 + 0{,}096 + 1{,}16 = 0
      $$

      $\ddot\theta_2 = 123{,}73$ rad/s²: la misma $\alpha_{BC}$, sin pasar
      por $\alpha_{CD}$.

      **Lo que dice el resultado.** En este instante BC gira alrededor de
      A, igual que AB, y a la misma velocidad: el CIR de BC coincide con el
      punto fijo A. Pero su aceleración angular es enorme, 123,73 rad/s²,
      aunque AB gire uniformemente: en un cuadrilátero que no es un
      paralelogramo, una entrada uniforme no da salidas uniformes.

  - id: ejma8-col84-las-dos-barras-de-quinientos
    titulo: Dos barras de 500 mm unidas por un pasador
    fuente: >-
      Ejercicio 8.4 · Tema 8, «Análisis del movimiento plano» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado y el
      profesor su resolución, contra los que está contrastado el desarrollo.
    nivel: practica
    antes:
      idea: |
        Cada barra es un sólido rígido. En cada instante hay un punto del
        plano, unido a la barra, con velocidad nula: el centro instantáneo de
        rotación, alrededor del cual gira la barra en ese instante. Conocida
        la velocidad de un punto y la velocidad angular, sale la de cualquier
        otro.
      formula: |
        El campo de velocidades del sólido rígido en el plano, con A un punto
        conocido e I el centro instantáneo de rotación:

        $$
        \vec{v}_P = \vec{v}_A + \vec{\omega}\times\overrightarrow{AP},
        \qquad
        \vec{v}_P = \vec{\omega}\times\overrightarrow{IP},
        \qquad
        |\vec{v}_P| = |\omega|\;IP
        $$
      reconocer: |
        Antes de calcular se mira qué se sabe, sin hacer cuentas, de la
        velocidad de cada extremo de cada barra.
    enunciado: |
      Dos barras de 500 mm, están articuladas por medio de un pasador $D$ como
      se muestra en la figura. Si $B$ se mueve a la izquierda con una velocidad
      constante de 360 mm/s, calcular en el instante mostrado:

      a) Velocidad angular de las barras (1) y (2).

      b) Velocidad de $E$.

      <figure>
      <svg viewBox="0 0 280 235" role="img" width="280" height="235" aria-labelledby="ejma8-col84-t ejma8-col84-d">
