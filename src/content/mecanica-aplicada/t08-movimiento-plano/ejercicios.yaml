        <rect x="272" y="158" width="96" height="16" fill="var(--faint)" fill-opacity="0.4" stroke="var(--ink)" stroke-width="1.2"/>
        <rect x="296" y="102" width="13" height="56" fill="var(--faint)" fill-opacity="0.3" stroke="var(--ink)" stroke-width="1.3"/>
