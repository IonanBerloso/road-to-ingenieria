    pide: Las velocidades relativas de C y de D respecto de la barra, la aceleración relativa de D y las dos aceleraciones angulares.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado dice que el CIR del disco está en $A$. ¿Qué significa eso
          exactamente?
        opciones:
          - texto: >-
              Que la velocidad de cada punto del disco vale omega dos por su
              distancia a A, y en particular que vC vale v
            correcta: true
            mensaje: |
              Eso es. $C$ está a $2R$ de $A$, así que
              $v_C = \frac{v}{2R}\cdot 2R = v$, horizontal, que es justo el dato
              del enunciado. El CIR es la llave que hace consistente todo lo
              demás.
          - texto: Que A es un punto fijo del plano y no se mueve nunca
            mensaje: |
              El CIR tiene velocidad nula **en este instante**, y además va
              cambiando de sitio. $A$ es el extremo de una barra que gira
              alrededor de $O$: dentro de un instante estará en otro punto.
          - texto: Que el disco rueda sin deslizar sobre el suelo
            mensaje: |
              Justo lo contrario. Si rodara sin deslizar, el CIR sería el punto
              de contacto con el suelo; como está en $A$, que queda arriba, el
              disco **desliza** sobre el suelo.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **la barra y el disco, con el CIR
          del disco en A, la velocidad de C, la del punto de la barra que
          coincide con C y la de D**. Solo las direcciones, sin escala.
        comprueba:
          - punto: |
              **$\vec{v}_C$ horizontal, hacia la izquierda.**
            porque: |
              C está 2R por debajo de A, el CIR del disco, y el disco gira en
              sentido horario: alrededor de A, eso lleva a C hacia la
              izquierda.
          - punto: |
              **$\vec{v}_{C \in 1}$ perpendicular a OC, hacia arriba y a la
              izquierda.**
            porque: |
              Es la velocidad del punto de la barra, prolongada como sólido
              rígido, que coincide con C. La barra gira alrededor del punto
              fijo O en sentido antihorario.
          - punto: |
              **$\vec{v}_D$ perpendicular a la barra, hacia arriba y a la
              izquierda.**
            porque: |
              D está en la barra, igual que A: la recta AD es la barra. El
              disco gira alrededor de A en sentido horario, y a D, que está por
              debajo de A, lo mueve en perpendicular a AD.
