        <text x="112" y="88" font-size="9" text-anchor="end" fill="var(--faint)">b = 30 cm</text>
        <line x1="105" y1="130" x2="105" y2="232" stroke="var(--faint)" stroke-width="0.7" stroke-dasharray="3 3"/>
        <line x1="154.5" y1="225" x2="154.5" y2="232" stroke="var(--faint)" stroke-width="0.7" stroke-dasharray="3 3"/>
        <line x1="105" y1="228" x2="154.5" y2="228" stroke="var(--faint)" stroke-width="0.8"/>
