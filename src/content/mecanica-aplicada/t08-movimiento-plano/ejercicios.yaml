        <desc id="ejma8-col811-d">Del punto fijo O, en el suelo, sale la barra 1 hacia arriba y a la derecha formando 60 grados con la horizontal; su extremo A está a dos raíz de tres por R de O. El disco 2, de radio R y centro C, se apoya en el suelo justo debajo de A, y su borde pasa por D, el punto medio de la barra. En el instante representado el centro instantáneo de rotación del disco está en A. La figura está dibujada a escala.</desc>
        <defs>
          <marker id="ejma8-col811-fl" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
        </defs>
        <line x1="30" y1="220" x2="310" y2="220" stroke="var(--ink)" stroke-width="1.4"/>
        <path d="M40 220 L34 228 M60 220 L54 228 M80 220 L74 228 M100 220 L94 228 M120 220 L114 228 M140 220 L134 228 M160 220 L154 228 M180 220 L174 228 M200 220 L194 228 M220 220 L214 228 M240 220 L234 228 M260 220 L254 228 M280 220 L274 228 M300 220 L294 228" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <circle cx="165.3" cy="165" r="55" fill="var(--faint)" fill-opacity="0.12" stroke="var(--ink)" stroke-width="1.4"/>
        <line x1="70" y1="220" x2="165.3" y2="55" stroke="var(--ink)" stroke-width="3.2"/>
        <circle cx="70" cy="220" r="3.4" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
        <circle cx="165.3" cy="55" r="3.4" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
        <circle cx="117.6" cy="137.5" r="2.8" fill="var(--ink)"/>
        <circle cx="165.3" cy="165" r="2.8" fill="var(--ink)"/>
        <line x1="165.3" y1="165" x2="120" y2="165" stroke="var(--d2)" stroke-width="2" marker-end="url(#ejma8-col811-fl)"/>
        <text x="118" y="159" font-size="9.5" text-anchor="end" fill="var(--d2-tinta)">vC = v</text>
        <line x1="70" y1="220" x2="150" y2="220" stroke="var(--faint)" stroke-width="0.7" stroke-dasharray="3 3"/>
        <line x1="70" y1="220" x2="165.3" y2="165" stroke="var(--faint)" stroke-width="0.7" stroke-dasharray="3 3"/>
        <text x="96" y="214" font-size="9" fill="var(--faint)">30°</text>
        <text x="104" y="196" font-size="9" fill="var(--faint)">30°</text>
        <text x="171" y="50" font-size="10" fill="var(--ink)">A</text>
        <text x="186" y="50" font-size="9" fill="var(--faint)">= CIR del disco</text>
        <text x="110" y="132" font-size="10" text-anchor="end" fill="var(--ink)">D</text>
        <text x="171" y="180" font-size="10" fill="var(--ink)">C</text>
        <text x="62" y="234" font-size="10" text-anchor="end" fill="var(--ink)">O</text>
        <text x="84" y="150" font-size="9.5" fill="var(--ink)">1</text>
        <text x="212" y="120" font-size="9.5" fill="var(--ink)">2</text>
        <line x1="82" y1="196" x2="130" y2="113" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="76" y="176" font-size="9" text-anchor="end" fill="var(--faint)">√3 R</text>
        <line x1="130" y1="113" x2="178" y2="31" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="130" y="90" font-size="9" text-anchor="end" fill="var(--faint)">√3 R</text>
        <line x1="182" y1="165" x2="182" y2="220" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="188" y="196" font-size="9" fill="var(--faint)">R</text>
        <text x="228" y="196" font-size="9" fill="var(--faint)">ω2 = −v/(2R)</text>
        <text x="30" y="120" font-size="9" fill="var(--faint)">ω1 = v/(2R)</text>
      </svg>
