      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El CIR de la barra $OA$ está a $2R$ de $O$ y a $R$ de $A$, así que
              $v_O = 2$ m/s hacia abajo y $v_A = 1$ m/s hacia la izquierda.
          - texto: >-
              De $\cos(45^{\circ}+\beta) = \sqrt{2}/4$ sale
              $\beta = 24{,}3^{\circ}$, y descomponiendo $\vec{v}_A$ en $E$,
              $\omega_2 = 9{,}11$ rad/s y $\omega_3 = 1{,}56$ rad/s.
          - texto: >-
              Restando a $\vec{v}_A$ la velocidad del punto de $BC$ que coincide
              con $A$, queda
              $\vec{v}_{A/BC} = (-0{,}689;\ 0{,}311)$ m/s.
          - texto: >-
              Como en $E$ hay rodadura, el punto $E$ tiene velocidad nula y sirve
              de CIR para el disco.
            trampa: true
            mensaje: |
              Rodadura entre dos sólidos significa que sus **dos** puntos de
              contacto llevan la misma velocidad, no que esa velocidad sea cero.
              Eso solo pasa cuando uno de los dos está fijo, y aquí la barra
              $BC$ gira alrededor de $B$.
    resolucion: |
      **1. Esquema de velocidades.** Es un problema de cinemática: en lugar de
      fuerzas, el dibujo lleva la dirección de cada velocidad que se conoce y
      el centro instantáneo de la barra OA.

      <figure class="figura-examen">
      <svg viewBox="24 62 240 214" role="img" width="360" height="321" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">Esquema de velocidades del mecanismo: la barra OA, el disco y la barra BC</title>
        <desc id="dsl-d">La pared a la izquierda, con la deslizadera O abajo y la articulación fija B tres R más arriba. La barra OA va de O al centro A del disco, que corre por una ranura horizontal. La barra BC sale de B y se apoya en el disco en E. La velocidad de O, vertical, hacia abajo; la de A, horizontal, hacia la izquierda; las dos rectas perpendiculares a ellas, a trazos, se cortan en I1, el centro instantáneo de la barra OA, en el punto más bajo del disco. En E, la velocidad del punto de la barra, perpendicular a BC, en un sentido supuesto. Las velocidades angulares: omega 1 de la barra OA, antihoraria; omega 2 del disco y omega 3 de la barra BC, dibujadas en sentido antihorario.</desc>
        <defs>
