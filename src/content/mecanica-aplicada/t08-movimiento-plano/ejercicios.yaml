          <marker id="ejma8-col89-fl" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
        </defs>
        <line x1="60" y1="55" x2="60" y2="205" stroke="var(--faint)" stroke-width="1.3"/>
        <path d="M52 62 L46 55 M52 82 L46 75 M52 102 L46 95 M52 172 L46 165 M52 192 L46 185" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <line x1="110" y1="150" x2="255" y2="150" stroke="var(--faint)" stroke-width="1.3" stroke-dasharray="7 4"/>
