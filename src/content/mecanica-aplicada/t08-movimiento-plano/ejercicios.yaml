      <figcaption>

      Las tres miden 4ω²R. La normal relativa apunta a C, porque respecto del aro A recorre una circunferencia; el Coriolis, con el aro girando en sentido horario y la corredera bajando por él, apunta hacia la izquierda: se anulan. La tangencial relativa, hacia arriba, frena el deslizamiento, que va hacia abajo. Ejes: x hacia la derecha, y hacia arriba; giros positivos en sentido antihorario.

      </figcaption>
      </figure>

      **El aro gira a $\omega$ en sentido horario, como la barra, y su
      aceleración angular vale $3\,\omega^{2}$, antihoraria.** Los dos
      coinciden con los que publica la colección.

      **5. Comprobación.** Por la geometría, sin composición de movimientos.
      A está siempre a R del centro del aro: con $\vec{d} = \overrightarrow{CA}$,
      $\vec{d}\cdot\vec{d} = R^{2}$, y derivando,
      $\vec{d}\cdot\dot{\vec{d}} = 0$ y
      $\vec{d}\cdot\ddot{\vec{d}} + |\dot{\vec{d}}|^{2} = 0$. C gira con el
      aro alrededor de $O_2$, con $\overrightarrow{O_2C} = (0;\ R)$:

      $$
      \vec{v}_C = \omega_2\vec{k}\times\overrightarrow{O_2C} = (-R\,\omega_2;\ 0),
      \qquad
      \vec{a}_C = \alpha_2\vec{k}\times\overrightarrow{O_2C} - \omega_2^{2}\,\overrightarrow{O_2C} = (-R\,\alpha_2;\ -\omega_2^{2}R)
      $$

      Con $\vec{d} = (-R;\ 0)$ y
      $\dot{\vec{d}} = \vec{v}_A - \vec{v}_C = (\omega R + R\,\omega_2;\ -\omega R)$,
      la primera condición da $-R\,(\omega R + R\,\omega_2) = 0$:
      $\omega_2 = -\omega$, y $\dot{\vec{d}} = (0;\ -\omega R)$. Con
      $\ddot{\vec{d}} = \vec{a}_A - \vec{a}_C = (-2\omega^{2}R + R\,\alpha_2;\ \omega^{2}R)$,
      la segunda:

      $$
      -R\,(-2\omega^{2}R + R\,\alpha_2) + \omega^{2}R^{2} = 0
      \;\Longrightarrow\;
      \alpha_2 = 3\,\omega^{2}
      $$

      Lo mismo, sin normal relativa ni Coriolis.

      **Lo que dice el resultado.** El aro gira como la barra, a $\omega$ en
      sentido horario, pero la corredera resbala por él a $2\omega R$, más
      deprisa de lo que se mueve ella misma, $\sqrt{2}\,\omega R$: el punto
      del aro sube mientras A baja. De los tres términos relativos, la normal
      relativa y el Coriolis miden lo mismo, $4\omega^{2}R$, y se anulan en la
      horizontal, que es la que da $\alpha_2$: quien se olvide de los dos
      acierta por casualidad, y quien se olvide de uno falla por
      $4\omega^{2}$. La comprobación por la geometría no necesita ninguno de
      los dos.

  - id: ejma8-col817-el-disco-que-sube-el-plano-y-su-barra
    titulo: Un disco que sube un plano inclinado arrastrando una barra
    fuente: >-
      Ejercicio 8.17 · Tema 8, «Análisis del movimiento plano» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado y el
      profesor su resolución, contra los que está contrastado el desarrollo. El
      resultado es simbólico, así que las casillas piden el coeficiente que
      multiplica a la expresión indicada; los ejes son los del plano, con el eje
      x hacia arriba a lo largo de él.
    nivel: practica
    antes:
      idea: |
        El disco y la barra son sólidos rígidos, cada uno con su velocidad
        angular y su aceleración angular. Un disco que rueda sin deslizar sobre
        un plano fijo tiene velocidad nula en el punto de contacto. Y el polo de
        aceleraciones de un sólido es el punto en el que su aceleración es
        nula.
      formula: |
        Los campos de velocidades y de aceleraciones del sólido rígido en el
        plano, con Q un punto conocido:

        $$
        \vec{v}_P = \vec{v}_Q + \vec{\omega}\times\overrightarrow{QP},
        \qquad
        \vec{a}_P = \vec{a}_Q + \vec{\alpha}\times\overrightarrow{QP} - \omega^{2}\,\overrightarrow{QP}
        $$

        El polo de aceleraciones es el punto P con $\vec{a}_P = \vec{0}$.
      reconocer: |
        Antes de calcular se mira qué condición impone cada apoyo y cada
        unión.
    enunciado: |
      Un disco de radio $R$ asciende con velocidad angular constante $\omega$
      por un plano inclinado $\pi$ (fijo) que forma 45° con la horizontal. No
      hay deslizamiento entre plano y disco. En el punto $B$ del disco, está
      articulada una barra de longitud $2R\sqrt{2}$ cuyo otro extremo recorre el
      plano mediante una deslizadera en el punto $A$. En el instante en que la
      barra $AB$ forma 45° con el plano $\pi$, calcular:

      a) Velocidad angular de la barra $AB$.

      b) Velocidad de la deslizadera en $A$.

      c) Aceleración angular de la barra $AB$.

      d) Aceleración de la deslizadera en $A$.

      e) Polo de aceleraciones de $AB$.

