    pide: La velocidad angular de la barra AD, y la velocidad y la aceleración de la deslizadera D.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Dónde está el centro instantáneo de rotación de la barra $AD$?
        opciones:
          - texto: Donde se cortan la vertical por B y la horizontal por D
            correcta: true
            mensaje: |
              Eso es. $B$ gira alrededor de $C$ con $CB$ vertical, así que $v_B$
              es horizontal y su perpendicular es vertical; $D$ corre por una
              guía vertical, así que $v_D$ es vertical y su perpendicular,
              horizontal.
          - texto: En B, porque es donde la manivela empuja a la barra
            mensaje: |
              $B$ se mueve a $\omega\,CB = 0{,}768$ m/s. El CIR es un punto de
              velocidad nula, y aquí queda fuera de la barra, a la izquierda y
              por debajo.
          - texto: En C, que es el único punto fijo del mecanismo
            mensaje: |
              $C$ es el CIR de la **manivela**, no el de la barra $AD$. Cada
              sólido tiene el suyo, y el de $AD$ cambia de sitio a cada
              instante.

      - tipo: calcular
        titulo: La velocidad angular de la barra AD
        pregunta: |
          ¿Cuánto vale $\omega_{AD}$, en rad/s?
        respuesta:
          tipo: numero
          valor: '4.267'
          tolerancia: 0.02
          formato: un número, en rad/s
        distractores:
          - valor: '2.133'
            mensaje: |
              Has dividido $v_B$ entre los 360 mm de $BD$. Lo que iguala a $v_B$
              no es $\omega\,BD$ entero, sino su componente horizontal, que
              lleva el $\operatorname{sen} 30^{\circ}$.
          - valor: '4'
            mensaje: |
              Esa es la de la manivela. $B$ pertenece a los dos sólidos y por
              eso comparten su velocidad, pero no su velocidad angular.
        pista: |
          $v_B = 4 \cdot 0{,}192 = 0{,}768$ m/s, horizontal. La componente
          horizontal de $\vec{\omega}_{AD}\times\overrightarrow{BD}$ vale
          $\omega_{AD}\,BD\operatorname{sen}30^{\circ}$.
        desarrollo: |
          Como $\vec{v}_D$ es vertical, la horizontal de $\vec{v}_B$ la tiene
          que cancelar el giro de la barra:

          $$
          \omega_{AD}\,BD\operatorname{sen}30^{\circ} = \omega\,CB
          \;\Longrightarrow\;
          \omega_{AD} = \frac{4 \cdot 0{,}192}{0{,}36 \cdot 0{,}5} = 4{,}267\ \text{rad/s}
          $$

      - tipo: calcular
        titulo: La velocidad de la deslizadera
        pregunta: |
          ¿Cuánto vale $v_D$, en m/s?
        respuesta:
          tipo: numero
          valor: '1.330'
          tolerancia: 0.01
          formato: un número, en m/s
        distractores:
          - valor: '1.536'
            mensaje: |
              Has multiplicado $\omega_{AD}$ por los 360 mm enteros. Solo la
              componente vertical de $\vec{\omega}_{AD}\times\overrightarrow{BD}$
              sobrevive, y lleva el $\cos 30^{\circ}$.
          - valor: '0.768'
            mensaje: |
              Esa es la velocidad de $B$, que es horizontal. $D$ se mueve en
              vertical, y su velocidad no tiene por qué coincidir en módulo con
              la de $B$.
        pista: |
          $v_D = \omega_{AD}\,BD\cos 30^{\circ}$.
        desarrollo: |
          $$
          v_D = 4{,}267 \cdot 0{,}36 \cdot \cos 30^{\circ} = 1{,}330\ \text{m/s}
          $$

          Hacia abajo, por la guía.

      - tipo: calcular
        titulo: La aceleración de la deslizadera
        pregunta: |
          ¿Cuánto vale $a_D$, en m/s²?
        respuesta:
          tipo: numero
          valor: '16.18'
          tolerancia: 0.05
          formato: un número, en m/s²
        distractores:
          - valor: '3.072'
            mensaje: |
              Ese es solo $\omega^{2}CB$, la aceleración de $B$. Falta todo lo
              que aporta el giro de la barra $AD$: su normal
              $\omega_{AD}^{2}BD$ y su tangencial $\alpha_{AD}BD$.
          - valor: '9.83'
            mensaje: |
              Ese es solo el término tangencial
              $\alpha_{AD}\,BD\cos 30^{\circ}$. Hay que sumarle la aceleración
              de $B$ y la normal de la barra, que también son verticales.
        pista: |
          Primero $\alpha_{AD}$, anulando la horizontal:
          $\alpha_{AD}\,BD\operatorname{sen}30^{\circ} = \omega_{AD}^{2}BD\cos 30^{\circ}$.
          Después suma las tres contribuciones verticales.
        desarrollo: |
          $$
          \alpha_{AD} = \sqrt{3}\,\omega_{AD}^{2} = 31{,}53\ \text{rad/s}^{2}
          $$

          $$
          a_D = \omega^{2}CB + \omega_{AD}^{2}BD\operatorname{sen}30^{\circ}
          + \alpha_{AD}BD\cos 30^{\circ}
          = 3{,}072 + 3{,}277 + 9{,}830 = 16{,}18\ \text{m/s}^{2}
          $$

          La colección redondea a 16,16 m/s²; la resolución del profesor da
          16,18, que es lo que sale de los datos.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $v_B = 0{,}768$ m/s es horizontal y $v_D$ es vertical, así que el
              CIR de $AD$ está donde se cortan la vertical por $B$ y la
              horizontal por $D$.
          - texto: >-
              Anulando la componente horizontal sale
              $\omega_{AD} = 4{,}27$ rad/s, y con ella
              $v_D = 1{,}33$ m/s.
          - texto: >-
              La misma proyección con aceleraciones da
              $\alpha_{AD} = 31{,}53$ rad/s² y, sumando las tres verticales,
              $a_D = 16{,}18$ m/s².
          - texto: >-
              Como la manivela gira a velocidad angular constante, la
              deslizadera baja a velocidad constante y su aceleración es nula.
            trampa: true
            mensaje: |
              La transmisión no es lineal: el ángulo de la barra cambia y con él
              la relación entre $\omega$ y $v_D$. La deslizadera acelera a 16,18
              m/s², que es más de vez y media la gravedad.
    resolucion: |
      **La geometría, en metros.** Con $C$ en el origen, $B = (0;\ -0{,}192)$ y
      $D = B + 0{,}36\,(\cos(-30^{\circ});\ \operatorname{sen}(-30^{\circ}))
      = (0{,}3118;\ -0{,}372)$.

      **Velocidades.** $\vec{v}_B$ es perpendicular a $CB$, o sea horizontal, y
      vale $4 \cdot 0{,}192 = 0{,}768$ m/s. $\vec{v}_D$ es vertical. Anulando la
      componente horizontal de
      $\vec{v}_D = \vec{v}_B + \vec{\omega}_{AD}\times\overrightarrow{BD}$:

      $$
      \omega_{AD} = \frac{0{,}768}{0{,}36\operatorname{sen}30^{\circ}} = 4{,}267\ \text{rad/s}
      \qquad
      v_D = \omega_{AD}\,BD\cos 30^{\circ} = 1{,}330\ \text{m/s}
      $$

      **Aceleraciones.** Con $\omega$ constante, $\vec{a}_B$ es solo normal:
      $\omega^{2}CB = 3{,}072$ m/s², hacia $C$. Anulando otra vez la horizontal:

      $$
      \alpha_{AD}\,BD\operatorname{sen}30^{\circ} = \omega_{AD}^{2}\,BD\cos 30^{\circ}
      \;\Longrightarrow\;
      \alpha_{AD} = 31{,}53\ \text{rad/s}^{2}
      $$

      y sumando las tres contribuciones verticales,
      $a_D = 16{,}18\ \text{m/s}^{2}$.

      **Sobre el resultado impreso.** La colección publica 16,16 m/s². Es la
      misma cuenta redondeada por el camino: partiendo de los datos exactos
      salen 16,18, que es lo que obtiene también la resolución del profesor.

  - id: ejma8-col86-la-varilla-articulada-en-a
    titulo: Una varilla movida por otra a través de una deslizadera
    fuente: >-
      Ejercicio 8.6 · Tema 8, «Análisis del movimiento plano» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado y el
      profesor su resolución, contra los que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Sabiendo que en el instante representado la varilla articulada en $B$,
      gira con una velocidad angular constante $\omega_b = 6$ rad/s en sentido
      anti horario, hallar la velocidad y aceleración angular de la varilla
      articulada en $A$.

      <figure>
      <svg viewBox="0 0 300 200" role="img" width="300" height="200" aria-labelledby="ejma8-col86-t ejma8-col86-d">
        <title id="ejma8-col86-t">Varilla vertical articulada en B y varilla inclinada articulada en A, unidas por una deslizadera en D</title>
        <desc id="ejma8-col86-d">Dos puntos fijos del techo, A a la izquierda y B a su derecha, separados 0,4 metros. De B cuelga la varilla 1, vertical, que gira a 6 radianes por segundo en sentido antihorario y termina en D. De A sale la varilla 2, que baja hacia la derecha formando 30 grados con la horizontal y pasa por D. En D hay una deslizadera, la pieza 3, que une las dos varillas y permite que D corra a lo largo de la varilla 2. La figura está dibujada a escala.</desc>
        <defs>
          <marker id="ejma8-col86-fl" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
        </defs>
        <line x1="25" y1="40" x2="225" y2="40" stroke="var(--ink)" stroke-width="1.4"/>
        <path d="M33 40 L27 32 M53 40 L47 32 M73 40 L67 32 M93 40 L87 32 M113 40 L107 32 M133 40 L127 32 M153 40 L147 32 M173 40 L167 32 M193 40 L187 32 M213 40 L207 32" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <line x1="205" y1="40" x2="205" y2="132" stroke="var(--ink)" stroke-width="3.2"/>
        <line x1="45" y1="40" x2="246" y2="156" stroke="var(--ink)" stroke-width="3.2"/>
        <rect x="192" y="118" width="26" height="20" transform="rotate(30 205 128)" fill="var(--faint)" fill-opacity="0.3" stroke="var(--ink)" stroke-width="1.2"/>
        <circle cx="45" cy="40" r="3.4" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
        <circle cx="205" cy="40" r="3.4" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
        <circle cx="205" cy="132" r="3.2" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
        <path d="M226 54 A 24 24 0 0 0 220 76" fill="none" stroke="var(--flag)" stroke-width="1.5" marker-end="url(#ejma8-col86-fl)"/>
        <text x="230" y="72" font-size="9" fill="var(--flag)">ωb = 6 rad/s cte</text>
        <text x="38" y="54" font-size="10" text-anchor="end" fill="var(--ink)">A</text>
        <text x="196" y="54" font-size="10" text-anchor="end" fill="var(--ink)">B</text>
        <text x="196" y="148" font-size="10" text-anchor="end" fill="var(--ink)">D</text>
        <text x="192" y="88" font-size="9.5" fill="var(--ink)">1</text>
        <text x="112" y="82" font-size="9.5" fill="var(--ink)">2</text>
        <text x="228" y="140" font-size="9.5" fill="var(--ink)">3</text>
        <line x1="45" y1="22" x2="205" y2="22" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="125" y="18" font-size="9" text-anchor="middle" fill="var(--faint)">d = 0,4 m</text>
        <line x1="45" y1="40" x2="115" y2="40" stroke="var(--faint)" stroke-width="0.7" stroke-dasharray="3 3"/>
        <text x="66" y="56" font-size="9" fill="var(--faint)">30°</text>
      </svg>
      </figure>
    pide: La velocidad angular y la aceleración angular de la varilla articulada en A.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué tipo de unión hay en $D$ entre las dos varillas, y qué obliga a
          añadir en las ecuaciones?
        opciones:
          - texto: >-
              Una deslizadera: hay velocidad relativa a lo largo de la varilla 2,
              y en aceleraciones aparece el término de Coriolis
            correcta: true
            mensaje: |
              Eso es. $D$ es un punto de la varilla 1, pero se desliza sobre la
              2, así que
              $\vec{v}_D = \vec{v}_{D \in 2} + \vec{v}_{\text{rel}}$ y, al
              derivar, sale además
              $2\,\vec{\omega}_2 \times \vec{v}_{\text{rel}}$.
          - texto: 'Una articulación: los dos sólidos comparten en D velocidad y aceleración'
            mensaje: |
              Si fuera una articulación, $D$ sería un punto fijo de las dos
              varillas y la distancia $AD$ no podría cambiar. Pero cambia: la
              varilla 1 gira y arrastra a $D$ a lo largo de la 2.
          - texto: Una rodadura, con velocidad de deslizamiento nula
            mensaje: |
              En una rodadura los puntos de contacto tienen la misma velocidad,
              y aquí no la tienen: precisamente $v_{D/2} = 1{,}2$ m/s es la
              velocidad con la que $D$ recorre la varilla 2.

      - tipo: calcular
        titulo: La velocidad angular de la varilla articulada en A
        pregunta: |
          ¿Cuánto vale $\omega_a$, en rad/s?
        respuesta:
          tipo: numero
          valor: '1.5'
          tolerancia: 0.01
          formato: un número, en rad/s
        distractores:
          - valor: '3'
            mensaje: |
              Te has dejado el $\operatorname{sen}30^{\circ}$. De la velocidad
              de $D$ solo la componente perpendicular a $AD$ hace girar a la
              varilla 2; la paralela se la come el deslizamiento.
          - valor: '6'
            mensaje: |
              Esa es la de la varilla articulada en $B$. Las dos varillas no
              giran a la vez: entre ellas hay una deslizadera que absorbe la
              diferencia.
        pista: |
          $BD = d\tan 30^{\circ}$ y $AD = d/\cos 30^{\circ}$. Proyecta
          $\vec{v}_D$ sobre la perpendicular a $AD$:
          $\omega_a\,AD = \omega_b\,BD\operatorname{sen}30^{\circ}$.
        desarrollo: |
          Con $d = 0{,}4$ m, $BD = 0{,}2309$ m y $AD = 0{,}4619$ m:

          $$
          \omega_a = \frac{BD\operatorname{sen}30^{\circ}}{AD}\,\omega_b
          = \frac{0{,}2309 \cdot 0{,}5}{0{,}4619}\cdot 6 = 1{,}5\ \text{rad/s}
          $$

          Y la componente paralela es el deslizamiento:
          $v_{D/2} = \omega_b\,BD\cos 30^{\circ} = 1{,}2$ m/s.

      - tipo: calcular
        titulo: La aceleración angular de la varilla articulada en A
        pregunta: |
          ¿Cuánto vale $\alpha_a$, en rad/s²?
        respuesta:
          tipo: numero
          valor: '7.794'
          tolerancia: 0.02
          formato: un número, en rad/s²
        distractores:
          - valor: '15.59'
            mensaje: |
              Te has dejado el término de Coriolis,
              $2\,\omega_a v_{D/2} = 3{,}6$ m/s². Con una deslizadera sobre un
              sólido que gira, ese término nunca falta y aquí vale la mitad del
              otro.
          - valor: '0'
            mensaje: |
              $\omega_b$ es constante, pero $\omega_a$ no tiene por qué serlo:
              la relación entre las dos depende del ángulo, que está cambiando.
        pista: |
          Proyectando sobre la perpendicular a $AD$:
          $\alpha_a\,AD + 2\,\omega_a v_{D/2} = \omega_b^{2}\,BD\cos 30^{\circ}$.
        desarrollo: |
          $$
          \alpha_a = \frac{\omega_b^{2}\,BD\cos 30^{\circ} - 2\,\omega_a v_{D/2}}{AD}
          = \frac{7{,}2 - 3{,}6}{0{,}4619} = 7{,}794\ \text{rad/s}^{2}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $D$ pertenece a la varilla 1, así que
              $\vec{v}_D = \vec{\omega}_b \times \overrightarrow{BD}$, de módulo
              $6 \cdot 0{,}2309 = 1{,}386$ m/s y horizontal.
          - texto: >-
              Descomponiendo $\vec{v}_D$ según $AD$ y su perpendicular salen
              $\omega_a = 1{,}5$ rad/s y un deslizamiento
              $v_{D/2} = 1{,}2$ m/s.
          - texto: >-
              En aceleraciones hay que añadir Coriolis,
              $2\,\omega_a v_{D/2}$, y queda
              $\alpha_a = 7{,}79$ rad/s².
          - texto: >-
              Como $D$ pertenece a las dos varillas, su aceleración es la misma
              vista desde cualquiera de ellas.
            trampa: true
            mensaje: |
              Eso solo vale en una articulación. Aquí $D$ **desliza** sobre la
              varilla 2, así que entre $\vec{a}_D$ y $\vec{a}_{D \in 2}$ hay dos
              términos más: la aceleración relativa a lo largo de la varilla y
              la de Coriolis.
    resolucion: |
      **La geometría.** Con $A$ en el origen y $B = (0{,}4;\ 0)$, la varilla 2
      baja a $30^{\circ}$, así que
      $D = (0{,}4;\ -0{,}4\tan 30^{\circ}) = (0{,}4;\ -0{,}2309)$ m. Entonces
      $BD = 0{,}2309$ m y $AD = 0{,}4619$ m.

      **Velocidades.** $D$ es un punto de la varilla 1, que gira alrededor de
      $B$:

      $$
      \vec{v}_D = \vec{\omega}_b \times \overrightarrow{BD}
      \qquad
      v_D = 6 \cdot 0{,}2309 = 1{,}386\ \text{m/s},\ \text{horizontal}
      $$

      Visto desde la varilla 2, $D$ es una deslizadera:
      $\vec{v}_D = \vec{\omega}_a \times \overrightarrow{AD} + \vec{v}_{D/2}$,
      con $\vec{v}_{D/2}$ a lo largo de $AD$. Descomponiendo:

      $$
      \omega_a = \frac{BD\operatorname{sen}30^{\circ}}{AD}\,\omega_b = 1{,}5\ \text{rad/s}
      \qquad
      v_{D/2} = \omega_b BD\cos 30^{\circ} = 1{,}2\ \text{m/s}
      $$

      **Aceleraciones.** $\vec{a}_D = -\omega_b^{2}\overrightarrow{BD}$, de
      módulo $36 \cdot 0{,}2309 = 8{,}31$ m/s² y vertical hacia $B$. Y por el
      lado de la varilla 2 hay cuatro términos: normal, tangencial, relativa y
      Coriolis. La proyección perpendicular a $AD$ deja

      $$
      \alpha_a\,AD + 2\,\omega_a v_{D/2} = \omega_b^{2}BD\cos 30^{\circ}
      \;\Longrightarrow\;
      \alpha_a = \frac{7{,}2 - 3{,}6}{0{,}4619} = 7{,}79\ \text{rad/s}^{2}
      $$

      **Comprobación.** Resuelto en componentes con el vector completo
      —normal, tangencial, relativa y Coriolis— sale el mismo 7,794 rad/s².

  - id: ejma8-col87-el-disco-en-el-plano-y-el-engranaje
    titulo: Un disco en un plano inclinado unido a un engranaje
    fuente: >-
      Ejercicio 8.7 · Tema 8, «Análisis del movimiento plano» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado y el
      profesor su resolución, contra los que está contrastado el desarrollo. El
      enunciado dice que el engranaje está articulado a la barra en el punto C
      cuando la figura lo articula en D; se reproduce tal cual y se resuelve con
      la figura.
    nivel: practica
    enunciado: |
      En la figura mostrada, el disco 1 se apoya sin deslizar en un plano
      inclinado y está articulado a la barra $CD$ (2) en su centro. Por otro
      lado, la rueda dentada 3 rueda sobre una cremallera vertical (fija) y
      está articulada a la barra en el punto $C$. Calcular:

      a) Velocidad del punto $D$.

      b) Velocidad angular del disco (1), de la barra $CD$ (2) y velocidad de
      punto $C$.

      c) Aceleración angular del disco (1).

      Datos: $R_1 = 0{,}3\ \text{m}$; $R_3 = 0{,}2\ \text{m}$;
      $CD = 5\ \text{m}$; $v_B = 0{,}2\ \text{m/s}$ (constante)

      <figure>
