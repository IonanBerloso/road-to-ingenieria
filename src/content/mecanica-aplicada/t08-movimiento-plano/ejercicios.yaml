        <text x="200" y="132" font-size="9" text-anchor="start" fill="var(--faint)">2</text>
      </svg>
      <figcaption>

      Sin escala. A, en una posición cualquiera, a un ángulo θ = ωt de la vertical de O. Su velocidad, perpendicular a OA, es la suma de la de la corredera 2, horizontal, y la del pasador por la ranura, vertical. Ejes: x hacia la derecha, y hacia arriba; giros positivos en sentido antihorario.

      </figcaption>
      </figure>

      - **La pieza giratoria** gira alrededor de O en sentido horario, a
        velocidad angular constante: A recorre una circunferencia de radio b,
        con $\vec{v}_A$ perpendicular a OA y de módulo $\omega b$, siempre el
        mismo.
      - **La corredera**, con el émbolo, solo se traslada en horizontal:
        $\vec{v}_2$ es horizontal.
      - **El pasador** corre además por la ranura, que es vertical:
        $\vec{v}_A$ es la suma de $\vec{v}_2$, horizontal, y
        $\vec{v}_{rel}$, vertical. La corredera se queda con la componente
        horizontal de $\vec{v}_A$.

      Con O en el origen, x hacia la derecha e y hacia arriba, y
      $\theta = \omega t$ el ángulo de OA desde la vertical, en sentido
      horario, con $t = 0$ en $x = 0$ y A encima de O:
      $\overrightarrow{OA} = b\,(\sin\theta;\ \cos\theta)$, con $b = 300$ mm.

      **2. Incógnitas.** $\omega$ en rad/s, la velocidad del émbolo,
      $v_2(t)$, el instante en que es máxima y su valor, $v_{\max}$.

      **3. Ecuaciones.** El paso de rpm a rad/s, y la velocidad de A por
      composición de movimientos, con el giro horario, $-\omega\vec{k}$:

      $$
      \omega = n\,\frac{2\pi}{60},
      \qquad
      -\omega\vec{k}\times\overrightarrow{OA} = v_2\,\vec{i} + v_{rel}\,\vec{j}
      $$

      El máximo de $v_2(t)$, donde su derivada se anula.

      **4. Resultados.** $\omega = 15\cdot 2\pi/60 = \pi/2 = 1{,}5708$
      rad/s, con periodo $T = 2\pi/\omega = 4$ s. Con
      $-\vec{k}\times(\sin\theta;\ \cos\theta) = (\cos\theta;\ -\sin\theta)$:

      $$
      v_2 = \omega b\cos\omega t,
      \qquad
      v_{rel} = -\omega b\sin\omega t
      $$

      $$
      \frac{dv_2}{dt} = -\omega^{2}b\sin\omega t = 0
      \;\Longrightarrow\;
      \omega t = 0,\ \pi,\ 2\pi\ldots
      $$

      $$
      v_{\max} = \omega b = \frac{\pi}{2}\cdot 300 = 471{,}2\ \text{mm/s},
      \qquad
      t = \frac{\pi}{\omega} = 2\ \text{s}
      $$

      **El émbolo alcanza su velocidad máxima, 471,2 mm/s, al pasar por
      $x = 0$: en $t = 0$, hacia la derecha, y otra vez en $t = 2$ s, hacia
      la izquierda.** La colección publica $t = 2$ s, el primer instante
      posterior al origen, y 471 mm/s.

      **5. Comprobación.** La velocidad, por la posición, sin composición de
      movimientos: la ranura es vertical, así que la corredera está siempre
      en la abscisa de A, $x = b\sin\omega t$, y derivando,
      $\dot{x} = \omega b\cos\omega t$. Lo mismo.

      El instante, por las aceleraciones. La corredera no gira, así que la
      composición no tiene término de Coriolis, y la aceleración de A, que
      es solo normal porque $\omega$ es constante, $-\omega^{2}\,\overrightarrow{OA}$,
      se reparte igual: la corredera se lleva la componente horizontal,

      $$
      a_2 = -\omega^{2}b\sin\omega t = -\omega^{2}x
      $$

      que solo se anula en $x = 0$. Ahí la velocidad del émbolo deja de
      crecer, y es máxima; en los extremos de la carrera, $x = \pm b$, la
      aceleración es máxima y la velocidad, nula.

      **Lo que dice el resultado.** El émbolo hace un movimiento armónico
      simple: $a_2 = -\omega^{2}x$ es justo su ecuación. Aunque la pieza
      gire uniformemente, el émbolo va más deprisa en el centro de la
      carrera y se para en los extremos, porque solo recoge la componente
      horizontal de $\vec{v}_A$, que cambia con el ángulo. Y como pasa por el
      centro dos veces por vuelta, la velocidad máxima se repite cada medio
      periodo, cada 2 s, cambiando de sentido.

  - id: ejma8-col89-el-disco-y-la-barra-bc-con-rodadura
    titulo: Un disco que rueda sobre una barra apoyada en él
    fuente: >-
      Ejercicio 8.9 · Tema 8, «Análisis del movimiento plano» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado y el
      profesor su resolución, contra los que está contrastado el desarrollo.
    nivel: practica
    antes:
      idea: |
        En un mecanismo plano, la velocidad de cualquier punto de un sólido sale
        de la de otro punto del mismo sólido y de su velocidad angular. Las
        guías, las articulaciones y los apoyos imponen condiciones a algunas de
        esas velocidades, y de ellas salen las incógnitas.
      formula: |
        El campo de velocidades del sólido rígido:

        $$
        \vec{v}_P = \vec{v}_Q + \vec{\omega}\times\overrightarrow{QP}
        $$

        Y la velocidad de un punto respecto de un sólido que se mueve, con
        $P \in S$ el punto de ese sólido que coincide con P en ese instante:

        $$
        \vec{v}_{P/S} = \vec{v}_P - \vec{v}_{P \in S}
        $$
      reconocer: |
        Antes de calcular se mira qué dirección tiene la velocidad de cada
        punto que va guiado.
    enunciado: |
      En el sistema de la figura, la barra $OA$ (1) gira con velocidad angular
      $\omega_1 = 10$ rad/s en sentido antihorario y está articulada a una
      deslizadera vertical (punto $O$) y al disco (2) de radio $R$. El punto $A$
      puede moverse a lo largo de una ranura horizontal. La barra $BC$ (3) está
      apoyada sobre el disco (2) existiendo rodadura en el punto de contacto
      $E$. Calcular:

      a) Velocidades de los puntos $O$ y $A$.

      b) Velocidades angulares del disco y de la barra $BC$.

      c) Velocidad del centro $A$ del disco con respecto a la barra $BC$.
      Dibujar dirección y sentido del vector.

