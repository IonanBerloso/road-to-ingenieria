      - tipo: calcular
        titulo: La velocidad del punto A
        pregunta: |
          ¿Cuánto vale $v_A$, en m/s?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número, en m/s
        distractores:
          - valor: '2'
            mensaje: |
              Esa es la de $O$, que está a $2R$ del CIR. $A$ está solo a $R$, y
              en un giro la velocidad es proporcional a la distancia al centro
              instantáneo.
          - valor: '2.236'
            mensaje: |
              Has usado la longitud entera de la barra,
              $|OA| = \sqrt{5}\,R$. Lo que manda es la distancia de $A$ al CIR,
              que vale $R$.
        pista: |
          El CIR está a $R$ por debajo de $A$, así que $v_A = \omega_1 R$.
        desarrollo: |
          $$
          v_A = \omega_1 R = 10 \cdot 0{,}1 = 1\ \text{m/s}
          \qquad
          v_O = \omega_1 \cdot 2R = 2\ \text{m/s}
          $$

          $\vec{v}_A = -1\,\vec{\imath}$ m/s y $\vec{v}_O = -2\,\vec{\jmath}$ m/s.

      - tipo: calcular
        titulo: La velocidad angular del disco
        pregunta: |
          ¿Cuánto vale $\omega_2$, en rad/s y en valor absoluto?
        respuesta:
          tipo: numero
          valor: '9.114'
          tolerancia: 0.02
          formato: un número, en rad/s
        distractores:
          - valor: '10'
            mensaje: |
              Ese número sale de suponer que $E$ está quieto, es decir de tomar
              $E$ como CIR del disco. Pero $E$ es el contacto con una barra que
              **también se mueve**, y lo único que impone la rodadura es que los
              dos puntos lleven la misma velocidad.
          - valor: '4.115'
            mensaje: |
              Has usado $\operatorname{sen}\beta$ donde va $\cos\beta$. La
              componente de $\vec{v}_A$ que hace girar al disco es la
              perpendicular a $AE$, y esa lleva el coseno.
        pista: |
          De $\cos(45^{\circ}+\beta) = \sqrt{2}/4$ sale $\beta = 24{,}3^{\circ}$.
          Proyectando en $E$, $\omega_2 R = v_A\cos\beta$.
        desarrollo: |
          $$
          \beta = 24{,}3^{\circ}
          \qquad
          \omega_2 = \frac{v_A\cos\beta}{R} = \cos\beta\cdot\omega_1 = 9{,}11\ \text{rad/s}
          $$

          Horaria: $\vec{\omega}_2 = -9{,}11\,\vec{k}$ rad/s.

      - tipo: calcular
        titulo: La velocidad angular de la barra BC
        pregunta: |
          ¿Cuánto vale $\omega_3$, en rad/s y en valor absoluto?
        respuesta:
          tipo: numero
          valor: '1.555'
          tolerancia: 0.01
          formato: un número, en rad/s
        distractores:
          - valor: '9.114'
            mensaje: |
              Esa es la del disco. En una rodadura los dos sólidos comparten la
              velocidad del punto de contacto, no la velocidad angular: cada uno
              gira alrededor de un sitio distinto.
          - valor: '0.588'
            mensaje: |
              Parece que has dividido entre $7R$ en vez de entre $\sqrt{7}\,R$.
              La distancia de $B$ a $E$ es $\sqrt{7}\,R = 0{,}2646$ m.
        pista: |
          $\omega_3 \, BE = v_A \operatorname{sen}\beta$, con
          $BE = \sqrt{7}\,R$.
        desarrollo: |
          $$
          \omega_3 = \frac{v_A\operatorname{sen}\beta}{\sqrt{7}\,R}
          = \frac{\operatorname{sen}\beta}{\sqrt{7}}\,\omega_1 = 1{,}555\ \text{rad/s}
          $$

          También horaria: $\vec{\omega}_3 = -1{,}56\,\vec{k}$ rad/s.

      - tipo: calcular
        titulo: La velocidad de A respecto de la barra BC
        pregunta: |
          ¿Cuánto vale el módulo de $\vec{v}_{A/BC}$, en m/s?
        respuesta:
          tipo: numero
          valor: '0.756'
          tolerancia: 0.008
          formato: un número, en m/s
        distractores:
          - valor: '1'
            mensaje: |
              Ese es el módulo de $\vec{v}_A$ a secas. La velocidad **relativa**
              se obtiene restando la del punto de la barra $BC$ que en este
              instante coincide con $A$, que no es nula.
          - valor: '0.44'
            mensaje: |
              Ese es el módulo de $\vec{v}_{A \in BC} = \omega_3\,BA$, el
              sustraendo. Falta restarlo de $\vec{v}_A$, y como los dos vectores
              no son paralelos hay que hacerlo en componentes.
        pista: |
          $\vec{v}_{A/BC} = \vec{v}_A - \vec{\omega}_3 \times \overrightarrow{BA}$,
          con $\overrightarrow{BA} = (0{,}2;\ -0{,}2)$ m.
        desarrollo: |
          $$
          \vec{v}_{A \in BC} = -1{,}555\,\vec{k} \times (0{,}2;\ -0{,}2;\ 0)
          = (-0{,}311;\ -0{,}311)\ \text{m/s}
          $$

          $$
          \vec{v}_{A/BC} = (-1;\ 0) - (-0{,}311;\ -0{,}311)
          = (-0{,}689;\ 0{,}311)\ \text{m/s}
          $$

          De módulo 0,756 m/s, y dirigido hacia arriba y a la izquierda, a lo
          largo de la barra $BC$ —que es lo que tenía que salir, porque $A$ solo
          puede desplazarse respecto de $BC$ manteniendo la tangencia—.

      - tipo: dibujar
        consigna: |
          El apartado c) pide dibujar la dirección y el sentido de
          $\vec{v}_{A/BC}$. Dibújalo en la figura, aplicado en A, y al lado el
          triángulo de velocidades del que sale.
        comprueba:
          - punto: |
              **Paralelo a la barra BC.**
            porque: |
              Respecto de la barra, A se mueve sin acercarse ni alejarse de BC
              —el disco sigue apoyado en ella, con A siempre a una distancia R—,
              así que su velocidad relativa no tiene componente perpendicular a
              BC.
          - punto: |
              **Hacia B**: hacia arriba y a la izquierda, de C a B.
            porque: |
              Es lo que dicen los signos de $(-0{,}689;\ 0{,}311)$ m/s. El disco
              va hacia la pared, y respecto de la barra su centro avanza hacia
              B.
          - punto: |
              **El triángulo**: $\vec{v}_A = \vec{v}_{A \in BC} + \vec{v}_{A/BC}$,
              con $\vec{v}_{A \in BC}$ perpendicular a BA.
            porque: |
              Es la composición de velocidades del movimiento relativo. Quien
              dibuja $\vec{v}_A$ como si fuera la relativa se deja la de
              arrastre, que aquí vale 0,44 m/s.
          - punto: |
              **Su módulo, 0,756 m/s**, rotulado junto al vector.
            porque: |
              La dirección y el sentido son lo que pide el dibujo, pero sin el
              módulo el vector no se puede comprobar contra el apartado c).
        figura: |
