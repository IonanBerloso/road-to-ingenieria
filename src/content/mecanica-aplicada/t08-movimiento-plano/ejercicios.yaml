    pide: La velocidad angular y la aceleración angular de la barra BC y de la barra CD.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se plantea este mecanismo sin dibujar polígonos de velocidades?
        opciones:
          - texto: >-
              Escribiendo el campo de velocidades de B a C y exigiendo que C
              también gire alrededor de D
            correcta: true
            mensaje: |
              Eso es. $\vec{v}_C = \vec{v}_B + \vec{\omega}_{BC}\times\overrightarrow{BC}$
              por un lado y $\vec{v}_C = \vec{\omega}_{CD}\times\overrightarrow{DC}$
              por el otro: dos ecuaciones escalares y dos incógnitas.
          - texto: Buscando el CIR de BC en el corte de AB con CD
            mensaje: |
              Casi: el CIR de $BC$ está donde se cortan las **perpendiculares** a
              $v_B$ y a $v_C$, que son las rectas $AB$ y $DC$ prolongadas, no
              las velocidades. Aquí el planteo vectorial es más corto.
          - texto: Suponiendo que las tres barras giran a la misma velocidad angular
            mensaje: |
              Solo pasa en un paralelogramo articulado. Aquí las tres
              longitudes y direcciones son distintas y cada barra tiene su
              propia velocidad angular.

      - tipo: calcular
        titulo: La velocidad angular de CD
        pregunta: |
          ¿Cuánto vale $\omega_{CD}$, en rad/s y en valor absoluto?
        respuesta:
          tipo: numero
          valor: '6.667'
          tolerancia: 0.02
          formato: un número, en rad/s
        distractores:
          - valor: '4'
            mensaje: |
              Esa es la de $AB$, y además resulta ser la de $BC$. La de $CD$
              sale de dividir $v_C$ entre la componente correcta de
              $\overrightarrow{DC}$, y da otro número.
          - valor: '10'
            mensaje: |
              Parece que has dividido $v_B = 1$ m/s entre 0,1 m, la longitud de
              $BC$. Quien gira alrededor de $D$ es $C$, y lo que manda es la
              componente horizontal de $\overrightarrow{DC}$, 0,15 m.
        pista: |
          $v_B = 4 \cdot 0{,}25 = 1$ m/s, vertical. La componente vertical de
          $\vec{\omega}_{BC}\times\overrightarrow{BC}$ es nula, así que
          $v_{Cy} = -1$ m/s, y eso fija $\omega_{CD}$.
        desarrollo: |
          Con $\overrightarrow{DC} = (-0{,}15;\ 0{,}06)$ m,

          $$
          v_{Cy} = \omega_{CD}\,(-0{,}15) = -1
          \;\Longrightarrow\;
          \omega_{CD} = \frac{20}{3} = 6{,}667\ \text{rad/s}
          $$

      - tipo: calcular
        titulo: La aceleración angular de CD
        pregunta: |
          ¿Cuánto vale $\alpha_{CD}$, en rad/s² y en valor absoluto?
        respuesta:
          tipo: numero
          valor: '28.44'
          tolerancia: 0.06
          formato: un número, en rad/s²
        distractores:
          - valor: '0'
            mensaje: |
              $\omega_{AB}$ es constante, no $\omega_{CD}$. Que la entrada gire
              a velocidad uniforme no hace uniformes a las demás: la geometría
              del cuadrilátero cambia a cada instante.
          - valor: '17.78'
            mensaje: |
              Te has dejado la normal de $CD$, que vale
              $\omega_{CD}^{2}\,DC$ y apunta de $C$ hacia $D$. Con
              $\omega_{CD} = 6{,}67$ rad/s ese término no es pequeño.
        pista: |
          Proyecta sobre la vertical:
          $a_{Cy} = -\omega_{AB}^{2}\,AB\cdot 0 - \omega_{BC}^{2}\,BC_y + \ldots$
          Lo más corto es escribir las dos expresiones de $\vec{a}_C$ y
          quedarse con la componente $y$.
        desarrollo: |
          Con $\vec{a}_B = (-4;\ 0)$ m/s² y
          $\overrightarrow{BC} = (0;\ -0{,}1)$ m,

          $$
          \vec{a}_C = \vec{a}_B + \vec{\alpha}_{BC}\times\overrightarrow{BC}
          - \omega_{BC}^{2}\,\overrightarrow{BC}
          = \vec{\alpha}_{CD}\times\overrightarrow{DC} - \omega_{CD}^{2}\,\overrightarrow{DC}
          $$

          La componente vertical no lleva $\alpha_{BC}$:

          $$
          1{,}6 = -0{,}15\,\alpha_{CD} - 2{,}667
          \;\Longrightarrow\;
          \alpha_{CD} = -28{,}44\ \text{rad/s}^{2}
          $$

      - tipo: calcular
        titulo: La aceleración angular de BC
        pregunta: |
          ¿Cuánto vale $\alpha_{BC}$, en rad/s² y en valor absoluto?
        respuesta:
          tipo: numero
          valor: '123.73'
          tolerancia: 0.15
          formato: un número, en rad/s²
        distractores:
          - valor: '124.13'
            mensaje: |
              Ese es el valor que imprime la colección, y de los datos de la
              figura no sale: con $\omega_{CD} = 20/3$ y
              $\alpha_{CD} = 28{,}44$ la cuenta da 123,73, que es también lo que
              obtiene la resolución del profesor. Publicamos 123,73.
          - valor: '40'
            mensaje: |
              Ese es solo el primer sumando, $\omega_{AB}^{2}\,AB/BC$. Faltan la
              normal de $CD$ y su tangencial, que aportan otros 83,7
              rad/s² entre las dos.
        pista: |
          Ahora la componente horizontal:
          $-4 + 0{,}1\,\alpha_{BC} = -0{,}06\,\alpha_{CD} + \omega_{CD}^{2}\cdot 0{,}15$.
        desarrollo: |
          $$
          -4 + 0{,}1\,\alpha_{BC} = 1{,}70667 + 6{,}66667
          \;\Longrightarrow\;
          \alpha_{BC} = 123{,}73\ \text{rad/s}^{2}
          $$

          Escrito con los símbolos de la resolución oficial,

          $$
          \alpha_{BC} = \omega_{AB}^{2}\frac{AB}{BC}
          + \omega_{CD}^{2}\frac{DC\cos\theta}{BC}
          + \alpha_{CD}\frac{DC\operatorname{sen}\theta}{BC}
          = 40 + 66{,}67 + 17{,}07
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $\vec{v}_B = (0;\ -1)$ m/s, y de las dos expresiones de
              $\vec{v}_C$ salen $\omega_{BC} = 4$ rad/s y
              $\omega_{CD} = 6{,}67$ rad/s.
          - texto: >-
              Con $\omega_{AB}$ constante, $\vec{a}_B$ es solo normal y vale
              $\omega_{AB}^{2}AB = 4$ m/s² apuntando de $B$ hacia $A$.
          - texto: >-
              La vertical del campo de aceleraciones da
              $\alpha_{CD} = 28{,}44$ rad/s² y la horizontal,
              $\alpha_{BC} = 123{,}73$ rad/s².
          - texto: >-
              Como $\omega_{AB}$ es constante, las otras dos barras también
              giran a velocidad angular constante.
            trampa: true
            mensaje: |
              El cuadrilátero no es un paralelogramo: la relación entre los
              ángulos cambia con la posición, así que una entrada uniforme
              produce salidas que no lo son. De hecho $\alpha_{BC}$ pasa de 120
              rad/s².
    resolucion: |
      **La geometría, en metros.** $A = (0;\ 0)$, $B = (0{,}25;\ 0)$,
      $C = (0{,}25;\ -0{,}10)$ y $D = (0{,}40;\ -0{,}16)$. La barra $CD$ mide
      $\sqrt{0{,}15^{2}+0{,}06^{2}} = 0{,}1616$ m y forma
      $\theta = 21{,}8^{\circ}$ con la horizontal.

      **Velocidades.** $\vec{v}_B = \vec{\omega}_{AB}\times\overrightarrow{AB} = (0;\ -1)$ m/s.
      Igualando las dos expresiones de $\vec{v}_C$:

      $$
      \vec{v}_B + \vec{\omega}_{BC}\times\overrightarrow{BC}
      = \vec{\omega}_{CD}\times\overrightarrow{DC}
      \;\Longrightarrow\;
      \omega_{BC} = 4\ \text{rad/s}
      \quad
      \omega_{CD} = 6{,}67\ \text{rad/s}
      $$

      **Aceleraciones.** Con $\alpha_{AB} = 0$, $\vec{a}_B = (-4;\ 0)$ m/s². La
      misma igualdad, ahora con aceleraciones:

      $$
      \vec{a}_B + \vec{\alpha}_{BC}\times\overrightarrow{BC} - \omega_{BC}^{2}\overrightarrow{BC}
      = \vec{\alpha}_{CD}\times\overrightarrow{DC} - \omega_{CD}^{2}\overrightarrow{DC}
      $$

      La vertical da $\alpha_{CD} = 28{,}44\ \text{rad/s}^{2}$ y la horizontal,
      $\alpha_{BC} = 123{,}73\ \text{rad/s}^{2}$.

      **Sobre el resultado impreso.** La colección publica
      $\alpha_{BC} = 124{,}13\ \text{rad/s}^{2}$, y con los datos de la figura
      no se reproduce por ningún camino: la resolución del propio profesor
      obtiene 123,7 rad/s². Aquí se publica 123,73, que es lo que dan los datos.

  - id: ejma8-col84-las-dos-barras-de-quinientos
    titulo: Dos barras de 500 mm unidas por un pasador
    fuente: >-
      Ejercicio 8.4 · Tema 8, «Análisis del movimiento plano» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado y el
      profesor su resolución, contra los que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Dos barras de 500 mm, están articuladas por medio de un pasador $D$ como
      se muestra en la figura. Si $B$ se mueve a la izquierda con una velocidad
      constante de 360 mm/s, calcular en el instante mostrado:

      a) Velocidad angular de las barras (1) y (2).

      b) Velocidad de $E$.

      <figure>
