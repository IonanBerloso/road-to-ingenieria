    pide: La velocidad angular de las dos barras y la velocidad del punto E.
    pasos:
      - tipo: reconocer
        pregunta: |
          La barra 1 tiene $A$ sobre una pared vertical y $B$ sobre el suelo.
          ¿Dónde está su centro instantáneo de rotación?
        opciones:
          - texto: Donde se cortan la horizontal por A y la vertical por B
            correcta: true
            mensaje: |
              Eso es. $v_A$ es vertical, así que su perpendicular es horizontal;
              $v_B$ es horizontal y su perpendicular, vertical. Se cortan en
              $(300;\ 400)$ mm, que forma con $A$ y $B$ el rectángulo de la
              escalera.
          - texto: En D, porque es el pasador que une las dos barras
            mensaje: |
              $D$ es un punto material que se mueve —de hecho su velocidad es
              225 mm/s—. El CIR es un punto de velocidad nula, y aquí cae fuera
              de la barra.
          - texto: En el punto donde la pared se junta con el suelo
            mensaje: |
              Ese es el vértice, y no tiene nada que ver: no es un punto de la
              barra ni el corte de las dos perpendiculares. Con él saldría una
              velocidad angular que no cumple ninguna de las dos condiciones.

      - tipo: calcular
        titulo: La velocidad angular de la barra 1
        pregunta: |
          ¿Cuánto vale $\omega_1$, en rad/s y en valor absoluto?
        respuesta:
          tipo: numero
          valor: '0.9'
          tolerancia: 0.005
          formato: un número, en rad/s
        distractores:
          - valor: '0.72'
            mensaje: |
              Has dividido entre 500 mm, la longitud de la barra. Lo que manda
              es la distancia de $B$ al CIR, que es la altura del rectángulo,
              400 mm.
          - valor: '1.2'
            mensaje: |
              Has dividido entre 300 mm, la distancia horizontal de la pared a
              $B$. Esa es la distancia del CIR a $A$, no a $B$.
        pista: |
          El CIR está en $I = (300;\ 400)$ mm, así que $IB = 400$ mm y
          $\omega_1 = v_B / IB$.
        desarrollo: |
          $$
          \omega_1 = \frac{360}{400} = 0{,}9\ \text{rad/s}
          \qquad
          v_A = \omega_1 \cdot IA = 0{,}9 \cdot 300 = 270\ \text{mm/s}
          $$

          Y $ID = 250$ mm, así que $v_D = 0{,}9 \cdot 250 = 225$ mm/s,
          perpendicular a $ID$.

      - tipo: calcular
        titulo: La velocidad angular de la barra 2
        pregunta: |
          ¿Cuánto vale $\omega_2$, en rad/s y en valor absoluto?
        respuesta:
          tipo: numero
          valor: '0.3375'
          tolerancia: 0.002
          formato: un número, en rad/s
        distractores:
          - valor: '0.9'
            mensaje: |
              Esa es la de la barra 1. Las dos comparten el punto $D$ y por
              tanto su velocidad, pero cada una tiene su propia velocidad
              angular.
          - valor: '0.45'
            mensaje: |
              Parece que has dividido $v_D = 225$ mm/s entre los 500 mm de la
              barra 2. Lo que hay que anular es la componente vertical de
              $\vec{v}_E$, y ahí entra solo la componente horizontal de
              $\overrightarrow{DE}$, 400 mm.
        pista: |
          $\vec{v}_D = (-180;\ 135)$ mm/s. Como $E$ corre por una guía
          horizontal, la componente vertical de
          $\vec{v}_E = \vec{v}_D + \vec{\omega}_2\times\overrightarrow{DE}$ es nula.
        desarrollo: |
          Con $\overrightarrow{DE} = (400;\ 300)$ mm,

          $$
          135 + 400\,\omega_2 = 0
          \;\Longrightarrow\;
          \omega_2 = -0{,}3375\ \text{rad/s}
          $$

      - tipo: calcular
        titulo: La velocidad de E
        pregunta: |
          ¿Cuánto vale $v_E$, en mm/s?
        respuesta:
          tipo: numero
          valor: '78.75'
          tolerancia: 0.3
          formato: un número, en mm/s
        distractores:
          - valor: '225'
            mensaje: |
              Ese es el módulo de $\vec{v}_D$. La barra 2 gira, así que $E$ no
              lleva la velocidad de $D$: el giro le resta 101,25 mm/s en
              horizontal.
          - valor: '281.25'
            mensaje: |
              Has sumado el término de giro en vez de restarlo. Con
              $\omega_2$ horaria, $\vec{\omega}_2\times\overrightarrow{DE}$
              apunta hacia la derecha y frena a $E$.
        pista: |
          $v_{Ex} = v_{Dx} - 300\,\omega_2$, con $v_{Dx} = -180$ mm/s y
          $\omega_2 = -0{,}3375$ rad/s.
        desarrollo: |
          $$
          v_{Ex} = -180 - 300\,(-0{,}3375) = -180 + 101{,}25 = -78{,}75\ \text{mm/s}
          $$

          Hacia la izquierda, y con componente vertical nula por estar $E$ en la
          guía.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La barra 1 es una escalera: $A$ sube por la pared y $B$ corre por
              el suelo, así que su CIR está en $I = (300;\ 400)$ mm.
          - texto: >-
              $\omega_1 = 360/400 = 0{,}9$ rad/s, y con $ID = 250$ mm sale
              $v_D = 225$ mm/s.
          - texto: >-
              Imponiendo que $\vec{v}_E$ sea horizontal salen
              $\omega_2 = 0{,}3375$ rad/s y $v_E = 78{,}75$ mm/s.
          - texto: >-
              Como $D$ es el punto medio de la barra 1, su velocidad es la
              media de las de $A$ y $B$, o sea 315 mm/s.
            trampa: true
            mensaje: |
              El campo de velocidades es lineal en el **vector** de posición, no
              en los módulos. $\vec{v}_D$ sí es la media de $\vec{v}_A$ y
              $\vec{v}_B$ como vectores —$(-180;\ 135)$—, pero su módulo es 225
              mm/s, no la media de 270 y 360.
    resolucion: |
      **La geometría, en milímetros.** Con la esquina pared-suelo en el origen,
      $A = (0;\ 400)$, $D = (150;\ 200)$ y $B = (300;\ 0)$: los tres alineados,
      con $AD = DB = 250$ mm. Y $E = (550;\ 500)$, con $DE = 500$ mm.

      **La barra 1 es una escalera.** $v_A$ es vertical y $v_B$ horizontal, así
      que su CIR está en $I = (300;\ 400)$:

      $$
      \omega_1 = \frac{v_B}{IB} = \frac{360}{400} = 0{,}9\ \text{rad/s}
      \qquad
      v_A = 0{,}9 \cdot 300 = 270\ \text{mm/s}
      $$

      Y para el pasador, $\vec{v}_D = (-180;\ 135)$ mm/s, de módulo 225 mm/s.

      **La barra 2.** $E$ corre por una guía horizontal, así que su velocidad no
      tiene componente vertical:

      $$
      135 + 400\,\omega_2 = 0 \;\Longrightarrow\; \omega_2 = 0{,}3375\ \text{rad/s}
      $$

      $$
      v_E = |-180 + 101{,}25| = 78{,}75\ \text{mm/s}
      $$

      **Comprobación.** Los tres valores coinciden con los que publica la
      colección, y el planteamiento vectorial reproduce también el
      $v_D = 225$ mm/s intermedio de la resolución del profesor.
  - id: ejma8-col85-la-deslizadera-d-de-la-barra-ad
    titulo: La deslizadera de una barra movida por una manivela
    fuente: >-
      Ejercicio 8.5 · Tema 8, «Análisis del movimiento plano» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado y el
      profesor su resolución, contra los que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      En el mecanismo de la figura la barra $BC$ tiene una velocidad angular de
      4 rad/s constante y en el sentido de las agujas del reloj. En el momento
      considerado en la figura, calcular:

      a) Velocidad angular de la barra $AD$.

      b) Velocidad y aceleración de la deslizadera $D$.

