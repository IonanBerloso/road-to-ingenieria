        <path d="M36 215 L30 222 M44 215 L38 222 M52 215 L46 222" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <circle cx="180" cy="200" r="3.4" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
