    pide: La velocidad angular de la barra AD, y la velocidad y la aceleración de la deslizadera D.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Dónde está el centro instantáneo de rotación de la barra $AD$?
        opciones:
          - texto: Donde se cortan la vertical por B y la horizontal por D
            correcta: true
            mensaje: |
              Eso es. $B$ gira alrededor de $C$ con $CB$ vertical, así que $v_B$
              es horizontal y su perpendicular es vertical; $D$ corre por una
              guía vertical, así que $v_D$ es vertical y su perpendicular,
              horizontal.
          - texto: En B, porque es donde la manivela empuja a la barra
            mensaje: |
              $B$ se mueve a $\omega\,CB = 0{,}768$ m/s. El CIR es un punto de
              velocidad nula, y aquí queda fuera de la barra, a la izquierda y
              por debajo.
          - texto: En C, que es el único punto fijo del mecanismo
            mensaje: |
              $C$ es el CIR de la **manivela**, no el de la barra $AD$. Cada
              sólido tiene el suyo, y el de $AD$ cambia de sitio a cada
              instante.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el mecanismo con el giro de la
          manivela, la dirección de las velocidades de B y de D y el CIR de
          la barra AD**. Solo las direcciones, sin escala.
        comprueba:
          - punto: |
              **$\vec{v}_B$ horizontal, hacia la izquierda.**
            porque: |
              B gira alrededor de C en sentido horario, con CB vertical y B
              debajo de C: se mueve en perpendicular a CB, y en la parte de
              abajo el giro horario lleva hacia la izquierda.
          - punto: |
              **$\vec{v}_D$ vertical, a lo largo de la guía.**
            porque: |
              La deslizadera no puede salirse de su guía.
          - punto: |
              **El CIR de AD, I, debajo de B y a la altura de D; la barra gira
              en sentido antihorario y D sube.**
            porque: |
              I está donde se cortan la vertical por B y la horizontal por D.
              B, encima de I, va hacia la izquierda: alrededor de I, eso es un
              giro antihorario, que a D, a la derecha de I, lo lleva hacia
              arriba.
        figura: |
          <svg viewBox="0 24 292 236" role="img" width="292" height="236" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">Esquema de velocidades de la manivela CB y la barra AD con la deslizadera</title>
            <desc id="dsl-d">La manivela CB cuelga del punto fijo C, en el techo, vertical, con su giro horario. En B se articula la barra AD, que baja hacia la derecha a 30 grados hasta la deslizadera D, en una guía vertical; A queda arriba a la izquierda de B. En B, su velocidad, horizontal hacia la izquierda. Encima de D, su velocidad, vertical hacia arriba. A trazos, la vertical por B y la horizontal por D, que se cortan en I, debajo de B; alrededor de I, el giro de la barra, antihorario.</desc>
            <defs>
              <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
              </marker>
              <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
              </marker>
              <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
              </marker>
            </defs>
            <path d="M246.9 214 h18 v24 h-18 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M70 40 H130" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M78 40 l-6 -6 M90 40 l-6 -6 M102 40 l-6 -6 M114 40 l-6 -6 M126 40 l-6 -6" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M264.9 180 V262" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M264.9 188 l6 -6 M264.9 204 l6 -6 M264.9 220 l6 -6 M264.9 236 l6 -6 M264.9 252 l6 -6" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <line x1="100" y1="40" x2="100" y2="136" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
            <line x1="13.4" y1="86" x2="255.9" y2="226" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
            <path d="M100 136 V226 H246.9" fill="none" stroke="var(--ink)" stroke-width="1" stroke-dasharray="4 3"/>
            <circle cx="100" cy="40" r="3.4" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
            <circle cx="100" cy="136" r="3.4" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
            <circle cx="255.9" cy="226" r="3.4" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
