        punto más alto del disco, A, sale un cable que baja hacia la derecha
        hasta su punto más bajo, O, y sube después hasta una polea B sujeta al
        techo, a la derecha y dos R más alta que A. Tras la polea el cable cae
        en vertical una longitud de cinco R y termina libre, por debajo del
        nivel del suelo. Del punto más a la izquierda del disco cuelga en
        vertical un hilo con el bloque de peso P, que queda por debajo del
        suelo. Dos cotas marcan los dos R entre A y B y los cinco R del tramo
        vertical.</desc>
