        <g fill="none" stroke="var(--d2)" stroke-width="1.2">
          <path d="M60 150 L60 172" marker-end="url(#fma2425e2q)"/>
          <path d="M90 150 L90 172" marker-end="url(#fma2425e2q)"/>
          <path d="M120 150 L120 172" marker-end="url(#fma2425e2q)"/>
