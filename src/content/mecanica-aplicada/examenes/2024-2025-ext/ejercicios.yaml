    pide: >-
      Apartado b): el peso $P$ del bloque y el coeficiente de rozamiento mínimo
      con el suelo, en función de $w$ y $R$. Del apartado a) se usan
      $c = \tfrac{\sqrt{11}}{2}R \approx 1{,}658R$ y $s_{OA} = 2{,}5R$.

    pasos:
      - tipo: reconocer
        pregunta: |
          El disco no tiene masa. ¿Respecto de qué punto conviene tomar momentos
          para sacar $P$ sin conocer el rozamiento?
        opciones:
          - texto: >-
              Del punto de contacto con el suelo, porque ahí la normal y el
              rozamiento no dan momento
            correcta: true
            mensaje: |
              Eso es. Desde el contacto tampoco da momento la componente
              vertical del cable en $A$, que está en la misma vertical, y queda
              una ecuación con una sola incógnita: $P$.
          - texto: >-
              Del centro del disco, sin contar el rozamiento porque es una
              reacción
            mensaje: |
              Una reacción es una fuerza como cualquier otra. El rozamiento
              actúa en el suelo, a distancia $R$ del centro, y su momento no es
              cero: olvidarlo da $P = T_0$, la mitad de lo que es.
          - texto: De $A$, porque ahí está aplicado el cable
            mensaje: |
              Se puede, pero entonces entran la normal y el rozamiento y $P$
              queda ligado a ellos: hay que resolver el sistema entero. Desde el
              contacto sale en una línea.
          - texto: De ninguno, porque $P$ sale del equilibrio vertical
            mensaje: |
              El equilibrio vertical tiene dos incógnitas, $N$ y $P$. Sin la
              ecuación de momentos no se separan.

      - tipo: calcular
        titulo: El peso del bloque
        pregunta: |
          ¿Cuánto vale $P$, en unidades de $wR$?
        respuesta:
          tipo: numero
          valor: '3.3166248'
          tolerancia: 0.005
          formato: un número, el cociente P/(wR)
        distractores:
          - valor: '1.6583124'
            mensaje: |
              Has tomado momentos en el centro olvidando el rozamiento. Su
              momento respecto del centro vale lo mismo que el del cable, y
              se suma: $P\,R = T_0\,R + F\,R = 2T_0\,R$.
          - valor: '6'
            mensaje: |
              Has usado la tensión entera, $T_A = 3wR$, con brazo $2R$, como si
              tirara en horizontal. Solo la componente horizontal, $T_0 = wc$,
              tiene ese brazo; la vertical pasa por el contacto.
          - valor: '8.6602540'
            mensaje: |
              Es $2c$ con el $c = 4{,}33R$ que sale de tomar $y_A = 5R$. El
              planteamiento del disco está bien; el fallo viene del apartado a).
        pista: |
          En $A$ el cable tira con $T_0 = w\,c$ en horizontal y $w\,s_{OA}$
          hacia abajo. Respecto del contacto, la horizontal tiene brazo $2R$ y
          el peso del bloque, brazo $R$.
        desarrollo: |
          $$
          P\cdot R = T_0\cdot 2R
          \;\Longrightarrow\; P = 2\,w\,c = \sqrt{11}\;wR \approx 3{,}317\,wR
          $$

      - tipo: calcular
        titulo: El rozamiento mínimo
        pregunta: |
          ¿Cuál es el coeficiente de rozamiento mínimo para que el disco no
          deslice?
        respuesta:
          tipo: numero
          valor: '0.2850990'
          tolerancia: 0.002
          formato: un número, con tres decimales
        distractores:
          - valor: '0.6633250'
            mensaje: |
              Te has dejado el bloque en la normal. El suelo sostiene la
              vertical del cable **y** el peso $P$, que cuelga del disco.
          - valor: '0.5'
            mensaje: |
              Te has dejado la componente vertical del cable en la normal: en
              $A$ el cable tira hacia $O$, que está más abajo, y carga
              $2{,}5wR$ sobre el suelo.
          - valor: '2.0306887'
            mensaje: |
              Has puesto la vertical del cable hacia arriba. En $A$ el cable
              baja hacia $O$: tira del disco hacia abajo, y la normal es
              $2{,}5wR + P$, no $P - 2{,}5wR$.
        pista: |
          El rozamiento equilibra la horizontal del cable, $T_0$. La normal
          soporta la vertical del cable **y** el bloque.
        desarrollo: |
          $$
          F = T_0 = 1{,}658\,wR \qquad
          N = w\,s_{OA} + P = (2{,}5 + \sqrt{11})\,wR = 5{,}817\,wR
          $$

          $$
          \mu_{\min} = \frac{F}{N} = \frac{1{,}658}{5{,}817} = 0{,}285
          $$

      - tipo: justificar
        pregunta: Ordena la resolución del apartado b). Una pieza es falsa.
        piezas:
          - texto: >-
              En $A$ el cable tira del disco hacia $O$, con $T_0 = w\,c$ en
              horizontal y $w\,s_{OA} = 2{,}5wR$ hacia abajo.
          - texto: >-
              El bloque cuelga del punto más a la izquierda del disco, a
              distancia $R$ de la vertical del contacto.
          - texto: >-
              Momentos respecto del contacto: $P\,R = T_0\cdot 2R$, luego
              $P = 2wc = \sqrt{11}\,wR$.
          - texto: >-
              En horizontal el rozamiento vale $T_0$ hacia la izquierda; en
              vertical, $N = 2{,}5wR + P$.
          - texto: >-
              Para que no deslice, $F \le \mu N$, y el mínimo es
              $\mu = T_0/N \approx 0{,}285$.
          - texto: >-
              Como el disco no tiene masa, la normal del suelo es nula.
            trampa: true
            mensaje: |
              Sin masa no hay peso propio, pero el suelo sigue sosteniendo lo
              que el disco carga: la vertical del cable y el bloque. La normal
              vale $5{,}817\,wR$, y sin ella no habría rozamiento posible.
    resolucion: |
      **Las fuerzas sobre el disco.** El disco no tiene masa, así que solo
      recibe tres acciones: el cable en $A$, el bloque en el punto más a la
      izquierda de su periferia y el suelo en el contacto $I$, con una normal
      $N$ y un rozamiento $F$. En $A$ el cable tira hacia $O$, que está a la
      derecha y más abajo:

      $$
      T_0 = w\,c = 1{,}658\,wR \ \text{(horizontal)}, \qquad
      w\,s_{OA} = 2{,}5\,wR \ \text{(hacia abajo)}
      $$

      Su módulo es $\sqrt{1{,}658^{2} + 2{,}5^{2}}\;wR = 3\,wR = w\,y_A$, que
      es lo que tiene que dar.

      **El peso del bloque.** Se toman momentos en $I$, donde $N$ y $F$ no
      cuentan. $A$ está $2R$ por encima de $I$ y en su misma vertical: la
      componente vertical del cable no da momento y la horizontal tiene brazo
      $2R$. El bloque tira hacia abajo a distancia $R$ a la izquierda.

      $$
      P\,R - T_0\,2R = 0
      \;\Longrightarrow\; P = 2\,w\,c = \sqrt{11}\;wR \approx 3{,}317\,wR
      $$

      **El rozamiento.** En horizontal el rozamiento equilibra al cable, y en
      vertical la normal sostiene el cable y el bloque:

      $$
      F = T_0 = 1{,}658\,wR, \qquad
      N = w\,s_{OA} + P = (2{,}5 + \sqrt{11})\,wR = 5{,}817\,wR
      $$

      Para que no deslice hace falta $F \le \mu N$:

      $$
      \mu_{\min} = \frac{T_0}{N} = \frac{\sqrt{11}/2}{2{,}5 + \sqrt{11}} = 0{,}285
      $$

      **Comprobación.** Tomando momentos en el centro, que es otro punto y
      otra cuenta: el cable da $T_0\,R$ y el rozamiento, hacia la izquierda en
      el suelo, otro $F\,R$ en el mismo sentido; el bloque los equilibra con
      $P\,R$. Sale $P = T_0 + F = 2T_0$, lo mismo.
