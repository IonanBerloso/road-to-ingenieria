      Redibujada **a escala** con la catenaria que sale de la resolución; la
      figura original no lo está. El punto **O**, el más bajo del cable, se ha
      rotulado aquí porque el enunciado lo nombra. El cable pasa por delante
      del disco, como en el original: está unido a su cara en **A**. La polea
      se trata como un punto.

