    pide: >-
      Apartado a): el parámetro $c$ de la catenaria, el ángulo que forma el
      cable con la horizontal en $A$ y la longitud total del cable, todo en
      función de $R$.

    pasos:
      - tipo: reconocer
        pregunta: |
          En una catenaria la tensión vale $T = w\,y$, con $y$ medida desde la
          directriz. ¿Qué te da el tramo vertical de $5R$?
        opciones:
          - texto: >-
              La ordenada de $B$, $y_B = 5R$, porque en la polea la tensión es
              el peso del tramo que cuelga
            correcta: true
            mensaje: |
              Eso es. Una polea sin rozamiento no cambia la tensión, y al otro
              lado cuelgan $5R$ de cable: $T_B = 5wR = w\,y_B$. El extremo libre
              del tramo vertical queda justo a la altura de la directriz.
          - texto: La ordenada de $A$, $y_A = 5R$
            mensaje: |
              El tramo vertical cuelga de $B$, no de $A$. Lo que sostiene es la
              tensión en la polea; $A$ está $2R$ más abajo y ahí la tensión es
              menor.
          - texto: El arco de cable entre $O$ y $B$, $s_{OB} = 5R$
            mensaje: |
              Eso confunde longitud con ordenada. En la catenaria
              $y^{2} = c^{2} + s^{2}$: la ordenada de $B$ es $5R$ y su arco
              desde el vértice es menor.
          - texto: Nada, porque el tramo vertical no es parte de la catenaria
            mensaje: |
              No es parte de la curva, pero es el único dato de fuerza del
              problema: su peso es la tensión en $B$, y la tensión fija la
              ordenada.

      - tipo: calcular
        titulo: El parámetro de la catenaria
        pregunta: |
          Con $y_B = 5R$, ¿cuánto vale el parámetro $c$, en unidades de $R$?
        respuesta:
          tipo: numero
          valor: '1.6583124'
          tolerancia: 0.005
          formato: un número, el cociente c/R
        distractores:
          - valor: '4.3301270'
            mensaje: |
              Has puesto $y_A = 5R$. El tramo vertical fija la ordenada de $B$;
              la de $A$ es $2R$ menos, $y_A = 3R$.
          - valor: '3.9051248'
            mensaje: |
              Has sumado donde había que restar: la relación es
              $y^{2} = c^{2} + s^{2}$, así que $c^{2} = y_A^{2} - s_{OA}^{2}$.
          - valor: '6.5383484'
            mensaje: |
              Has puesto $y_A = 7R$, sumando los $2R$ en vez de restarlos. $A$
              está por **debajo** de $B$.
        pista: |
          $A$ está $2R$ por debajo de $B$, así que $y_A = 3R$. Y en cualquier
          punto de la catenaria $y^{2} = c^{2} + s^{2}$, con $s$ el arco desde
          el vértice.
        desarrollo: |
          $$
          c^{2} = y_A^{2} - s_{OA}^{2} = 9R^{2} - 6{,}25R^{2} = 2{,}75R^{2}
          \;\Longrightarrow\; c = \frac{\sqrt{11}}{2}\,R \approx 1{,}658\,R
          $$

      - tipo: calcular
        titulo: El ángulo en A
        pregunta: |
          ¿Qué ángulo forma el cable con la horizontal en $A$, en grados?
        respuesta:
          tipo: numero
          valor: '56.44269'
          tolerancia: 0.1
          formato: un ángulo en grados, sin el símbolo
        distractores:
          - valor: '33.55731'
            mensaje: |
              Ese es el ángulo con la **vertical**. Con la horizontal, que es el
              que da la pendiente de la catenaria, es el complementario.
          - valor: '30'
            mensaje: |
              Sale de arrastrar $y_A = 5R$, que da $c = 4{,}33R$. Con $y_A = 3R$
              el parámetro es $1{,}658R$ y el cable baja mucho más empinado.
        pista: |
          La pendiente de la catenaria en un punto es $\tan\theta = s/c$.
        desarrollo: |
          $$
          \tan\theta_A = \frac{s_{OA}}{c} = \frac{2{,}5}{1{,}6583} = 1{,}5076
          \;\Longrightarrow\; \theta_A = 56{,}44^{\circ}
          $$

          Y se comprueba por otro lado: $\cos\theta_A = c/y_A = 0{,}5528$, que
          da el mismo ángulo.

      - tipo: calcular
        titulo: La longitud total del cable
        pregunta: |
          ¿Cuánto mide el cable entero, de $A$ al extremo libre, en unidades de
          $R$?
        respuesta:
          tipo: numero
          valor: '12.216991'
          tolerancia: 0.01
          formato: un número, el cociente L/R
        distractores:
          - valor: '7.216991'
            mensaje: |
              Te has dejado el tramo vertical. El enunciado pide la longitud
              total del cable, y los $5R$ que cuelgan de la polea también son
              cable.
          - valor: '10.841688'
            mensaje: |
              Has tomado el arco de $O$ a $B$ como $y_B - c$, que es la altura
              de $B$ sobre el vértice. El arco sale de
              $y_B^{2} = c^{2} + s_{OB}^{2}$ y es más largo.
          - valor: '12.5'
            mensaje: |
              Has tomado $s_{OB} = y_B = 5R$. La ordenada no es el arco: el arco
              es $\sqrt{y_B^{2} - c^{2}} = 4{,}717R$.
        pista: |
          Son tres tramos: $s_{OA}$, el arco $s_{OB}$, que sale de
          $y_B^{2} = c^{2} + s_{OB}^{2}$, y los $5R$ verticales.
        desarrollo: |
          $$
          s_{OB} = \sqrt{25 - 2{,}75}\;R = \frac{\sqrt{89}}{2}\,R = 4{,}717\,R
          $$

          $$
          L = 2{,}5R + 4{,}717R + 5R = 12{,}217\,R
          $$

      - tipo: justificar
        pregunta: Ordena la resolución del apartado a). Una pieza es falsa.
        piezas:
          - texto: >-
              Una polea ideal no cambia la tensión, así que en $B$ vale el peso
              del tramo vertical, $5wR$.
          - texto: >-
              Como en la catenaria $T = w\,y$, eso pone $B$ en $y_B = 5R$ y $A$
              en $y_A = 3R$.
          - texto: >-
              De $y_A^{2} = c^{2} + s_{OA}^{2}$ sale
              $c = \tfrac{\sqrt{11}}{2}R \approx 1{,}658R$.
          - texto: >-
              En $A$, $\tan\theta_A = s_{OA}/c$, y el cable forma
              $56{,}4^{\circ}$ con la horizontal.
          - texto: >-
              El arco de $O$ a $B$ mide $4{,}717R$, y con el tramo vertical el
              cable mide $12{,}217R$.
          - texto: >-
              El vértice $O$ está sobre la directriz, así que $y_O = 0$.
            trampa: true
            mensaje: |
              El vértice está a una distancia $c$ **por encima** de la
              directriz: $y_O = c$. Con $y_O = 0$ la tensión en el punto más
              bajo sería nula, y es la mínima pero no cero: $T_0 = w\,c$.
    resolucion: |
      **Dónde está la directriz.** En una catenaria la tensión vale $T = w\,y$,
      con $y$ la ordenada medida desde la directriz. La polea es ideal y no
      cambia la tensión, así que en $B$ el cable tira con el peso del tramo que
      cuelga al otro lado:

      $$
      T_B = w\cdot 5R = w\,y_B \;\Longrightarrow\; y_B = 5R
      $$

      El extremo libre del tramo vertical cae, por tanto, justo sobre la
      directriz. $A$ está $2R$ por debajo de $B$: $y_A = 3R$.

      **El parámetro.** En cualquier punto $y^{2} = c^{2} + s^{2}$, con $s$ el
      arco desde el vértice. En $A$:

      $$
      c^{2} = y_A^{2} - s_{OA}^{2} = 9R^{2} - 6{,}25R^{2} = 2{,}75R^{2}
      \;\Longrightarrow\; c = \frac{\sqrt{11}}{2}\,R \approx 1{,}658\,R
      $$

      **El ángulo en A.** La pendiente es $\tan\theta = s/c$:

      $$
      \tan\theta_A = \frac{2{,}5}{1{,}6583} = 1{,}5076
      \;\Longrightarrow\; \theta_A = 56{,}44^{\circ}
      $$

      medido con la horizontal, con el cable bajando de $A$ hacia $O$. Por
      otro camino, $\cos\theta_A = c/y_A = 0{,}5528$: el mismo ángulo.

      **La longitud total.** El arco de $O$ a $B$ sale igual que el de $A$:

      $$
      s_{OB} = \sqrt{y_B^{2} - c^{2}} = \sqrt{25 - 2{,}75}\;R
      = \frac{\sqrt{89}}{2}\,R = 4{,}717\,R
      $$

      y el cable entero son los dos arcos más el tramo vertical, tomando la
      polea como un punto, como la dibuja el enunciado:

      $$
      L = s_{OA} + s_{OB} + 5R = 2{,}5R + 4{,}717R + 5R = 12{,}217\,R
      $$

      **Comprobación.** Con estos números la geometría cierra: $A$ queda a
      $1{,}988R$ a la izquierda del vértice y $B$ a $2{,}932R$ a la derecha; el
      vértice está a $y = c = 1{,}658R$, y el suelo a $y_A - 2R = R$, así que el
      cable pasa $0{,}658R$ por encima del suelo y no lo toca. La figura está
      dibujada con esas coordenadas.

