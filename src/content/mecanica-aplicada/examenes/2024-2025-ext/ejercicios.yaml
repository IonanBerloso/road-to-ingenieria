  - id: exma2425-ext-3-la-catenaria-entre-el-disco-y-la-polea
    titulo: La catenaria entre el disco y la polea
    fuente: >-
      Ejercicio 1, apartado a) · Mecánica Aplicada, examen del 1.er
      cuatrimestre (Estática), convocatoria extraordinaria del 27 de junio de
      2025 · Escuela de Ingeniería de Gipuzkoa, UPV/EHU
    nivel: examen
    enunciado: |
      Un cable cuyo peso propio por unidad de longitud es w, se encuentra
      conectado a la periferia de un disco de masa despreciable y radio $R$, en
      el punto A, y pasa por una polea B. La longitud del cable entre el punto
      más bajo O y el punto A es $S_{OA} = 2{,}5R$. La longitud del tramo
      vertical del cable es $5R$. Además, la diferencia en cota vertical entre
      los puntos A y B es $2R$.

      El contacto del disco con el suelo tiene el suficiente rozamiento como
      para impedir el deslizamiento, y el punto A se encuentra en la vertical
      del centro del disco.

      Teniendo en cuenta que el peso P del bloque que se suspende en la
      periferia del disco, mantiene el conjunto en equilibrio en la posición
      descrita. En función de w y de R, se pide:

      a) (1,5p) Parámetro c de la catenaria, ángulo que forma en el punto A y
      longitud total del cable.

      b) (1,5p) Calcular el peso P del bloque y coeficiente de rozamiento
      mínimo para que se cumplan las condiciones del problema.

