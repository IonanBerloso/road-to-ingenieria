        </g>
        <text x="44" y="166" text-anchor="end" font-size="12" fill="var(--d2)">q</text>
      </svg>
      <figcaption>

      Redibujada **a escala**: la curva es la del enunciado entre los dos
      cortes con el eje x, y la flecha que se ve es la de verdad, un
      dieciseisavo de la luz. El enunciado no imprime la luz; el original
      dibuja **B** sobre el eje x y el punto más bajo a mitad de camino, que es
      lo que da la ecuación con B en x = 1 m.

      </figcaption>
      </figure>
    pide: >-
      La razón $q/T_0$ y la longitud del cable entre $A$ y $B$. El enunciado no
      trae ninguna fuerza, así que $q$ y $T_0$ **por separado** no se pueden
      calcular, y el ejercicio lo dice en vez de inventar un dato. Tampoco
      imprime la luz: se toma $B$ sobre el eje $x$, como lo dibuja la figura.

    pasos:
      - tipo: reconocer
        pregunta: |
          Un cable sin peso propio con carga constante por unidad de **abscisa**:
          ¿qué relación liga su forma con la carga?
        opciones:
          - texto: >-
              $T_0\,y'' = q$: la curva es una parábola y su curvatura da el
              cociente $q/T_0$
            correcta: true
            mensaje: |
              Eso es. La componente horizontal de la tensión es la misma en todo
              el cable, $T_0$, y el equilibrio vertical de un trozo $dx$ da
              $T_0\,dy' = q\,dx$.
          - texto: Una catenaria, $y = c\cosh(x/c)$
            mensaje: |
              La catenaria sale cuando la carga va por unidad de **longitud de
              cable**, como el peso propio. Aquí el cable no pesa y la carga va
              por unidad de abscisa: eso da la parábola.
          - texto: $T_0\,y' = q$, la pendiente proporcional a la carga
            mensaje: |
              Falta una derivada. Integrando $T_0\,y'' = q$ una vez sale
              $T_0\,y' = q\,x + C$: la pendiente crece con $x$.

      - tipo: calcular
        titulo: La razón entre la carga y la tensión mínima
        pregunta: |
          De la ecuación de la curva, ¿cuánto vale $q/T_0$, en $\text{m}^{-1}$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.001
          formato: un número, en 1/m
        distractores:
          - valor: '0.25'
            mensaje: |
              Has leído el coeficiente de $x^{2}$ como $q/T_0$. La parábola es
              $y = \frac{q}{2T_0}x^{2} + \dots$: el coeficiente es la **mitad**
              de $q/T_0$.
          - valor: '2'
            mensaje: |
              Ese es $T_0/q$, el cociente al revés. De $T_0\,y'' = q$ sale
              $q/T_0 = y''$.
        pista: |
          Deriva dos veces: $y' = \frac{x}{2} - \frac{1}{4}$ y $y''$ es constante.
        desarrollo: |
          $$
          y'' = \frac{1}{2}\ \text{m}^{-1} = \frac{q}{T_0}
          \;\Longrightarrow\; q = \frac{T_0}{2}
          $$

      - tipo: reconocer
        pregunta: |
          Con la ecuación de la curva y nada más, ¿se pueden dar $q$ y $T_0$ por
          separado, como pide el enunciado?
        opciones:
          - texto: >-
              No. La forma solo fija el cociente $q/T_0$; para separarlos hace
              falta un dato de fuerza, y el enunciado no trae ninguno
            correcta: true
            mensaje: |
              Eso es. Si multiplicas la carga y la tensión por el mismo número,
              la curva no cambia. Una tensión en un apoyo, la tensión máxima o
              el propio valor de $q$ bastarían, y el enunciado impreso no da
              ninguno de los tres.
          - texto: >-
              Sí: $T_0$ es la tensión en el vértice y sale de la flecha, que
              vale $1/16$ m
            mensaje: |
              La flecha es geometría, en metros. Una tensión va en newtons, y
              con solo metros no se construye un newton: cualquier $T_0$ con
              $q = T_0/2$ da exactamente la misma curva.
          - texto: >-
              Sí: como el cable no pesa, $q = 0$ y $T_0$ sale de la ecuación
            mensaje: |
              El cable no pesa, pero la carga $q$ existe: es la que dibujan las
              flechas. Con $q = 0$ el cable sería una recta, no una parábola.

      - tipo: calcular
        titulo: La longitud entre A y B
        pregunta: |
          Con $A$ en el origen y $B$ en el otro corte de la curva con el eje $x$,
          ¿cuánto mide el cable entre $A$ y $B$?
        respuesta:
          tipo: magnitud
          valor: '1.0103 m'
          tolerancia: 0.001
          formato: una longitud, con su unidad
        distractores:
          - valor: '1 m'
            mensaje: |
              Esa es la luz, la distancia horizontal entre los apoyos. El cable
              cuelga, así que mide algo más: hay que integrar
              $\sqrt{1 + y'^{2}}$ a lo largo de $x$.
          - valor: '1.0402 m'
            mensaje: |
              Has tomado $y' = x/2$ y te has dejado el $-\tfrac{1}{4}$ que viene
              del término en $x$. La pendiente es $y' = (2x - 1)/4$, que se
              anula en el vértice.
          - valor: '0.5052 m'
            mensaje: |
              Esa es la mitad del cable, del vértice a un apoyo. La curva es
              simétrica respecto de $x = 1/2$ m: la longitud de $A$ a $B$ es el
              doble.
        pista: |
          $B$ está donde $y$ vuelve a ser cero: $x_B = 1$ m. La longitud es
          $\int_0^1 \sqrt{1 + y'^{2}}\,dx$ con $y' = (2x - 1)/4$; el cambio
          $u = (2x - 1)/4$ la deja en una integral conocida.
        desarrollo: |
          $$
          L = \int_0^1 \sqrt{1 + \left(\frac{2x-1}{4}\right)^{2}}\,dx
          = 2\int_{-1/4}^{1/4} \sqrt{1+u^{2}}\,du
          $$

          $$
          L = 2\left[u\sqrt{1+u^{2}} + \operatorname{argsh} u\right]_0^{1/4}
          = 2\,(0{,}25769 + 0{,}24747) = 1{,}0103\ \text{m}
          $$

      - tipo: justificar
        pregunta: Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: >-
              Cable sin peso y carga constante por unidad de abscisa: la curva
              es una parábola que cumple $T_0\,y'' = q$.
          - texto: >-
              De $y = x^{2}/4 - x/4$ sale $y'' = 1/2\ \text{m}^{-1}$, así que
              $q = T_0/2$.
          - texto: >-
              El enunciado no trae ninguna fuerza, así que ni $q$ ni $T_0$ tienen
              valor propio: solo se puede dar su cociente.
          - texto: >-
              La curva corta el eje en $x = 0$ y $x = 1$ m, con el vértice en
              $x = 1/2$ m, a $1/16$ m por debajo de los apoyos.
          - texto: >-
              La longitud es $\int_0^1\sqrt{1+y'^{2}}\,dx = 1{,}0103$ m, un 1 %
              más que la luz.
          - texto: >-
              Como el cable no pesa, $T_0$ es la tensión en todo el cable y vale
              lo mismo en los apoyos que en el vértice.
            trampa: true
            mensaje: |
              Lo constante es la componente **horizontal** de la tensión. En los
              apoyos el cable está inclinado, $|y'| = 1/4$, y su tensión es
              $T_0\sqrt{1 + 1/16} = 1{,}031\,T_0$, algo mayor que en el vértice.
    resolucion: |
      **Qué curva es.** Sin peso propio y con carga constante por unidad de
      abscisa, el equilibrio vertical de un trozo $dx$ da

      $$
      T_0\,y'' = q
      $$

      donde $T_0$ es la componente horizontal de la tensión: la misma en todo
      el cable, e igual a la tensión en el punto más bajo, donde el cable es
      horizontal. La curva es una parábola, que es lo que da el enunciado.

      **El cociente.** Derivando dos veces la ecuación:

      $$
      y' = \frac{x}{2} - \frac{1}{4}, \qquad
      y'' = \frac{1}{2}\ \text{m}^{-1}
      \;\Longrightarrow\; \frac{q}{T_0} = 0{,}5\ \text{m}^{-1}
      $$

      **Lo que el enunciado no deja calcular.** Pide $q$ y $T_0$ por
      separado, y con la curva sola no se puede: si la carga y la tensión se
      multiplican por el mismo número, la forma no cambia. Hace falta una
      fuerza —la tensión en un apoyo, la tensión máxima o el propio $q$— y el
      enunciado impreso no trae ninguna. Lo honrado es dar la relación,
      $q = T_0/2$ (con $q$ en N/m y $T_0$ en N), y decir qué falta. Con
      cualquiera de esos datos el resto sale en una línea; por ejemplo, la
      tensión en los apoyos es $T_0\sqrt{1 + 1/16} = 1{,}031\,T_0$.

      **La luz.** $A$ está en el origen, porque $y(0) = 0$. La luz no está
      impresa, pero la figura dibuja $B$ sobre el eje $x$, y la curva vuelve a
      cortarlo en

      $$
      \frac{x(x-1)}{4} = 0 \;\Longrightarrow\; x_B = 1\ \text{m}
      $$

      El vértice cae en $x = 1/2$ m, con $y = -1/16$ m: a mitad de luz, que es
      justo donde lo pinta la figura original. Las dos lecturas casan.

      **La longitud.** Con $u = (2x - 1)/4$, que va de $-1/4$ a $1/4$ y da
      $dx = 2\,du$:

      $$
      L = \int_0^1 \sqrt{1 + y'^{2}}\,dx
      = 2\int_{-1/4}^{1/4} \sqrt{1+u^{2}}\,du
      = 2\left[u\sqrt{1+u^{2}} + \operatorname{argsh} u\right]_0^{1/4}
      $$

      $$
      L = 2\,(0{,}25769 + 0{,}24747) = 1{,}0103\ \text{m}
      $$

      **Comprobación.** Para un cable tan tendido vale la aproximación
      $L \approx \ell\left(1 + \tfrac{8}{3}(f/\ell)^{2}\right)$, con luz
      $\ell = 1$ m y flecha $f = 1/16$ m: sale $1{,}0104$ m, a una décima de
      milímetro de la integral.

