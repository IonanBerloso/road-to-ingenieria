ejercicios:
  # ── Teoría, cuestión 1 · Pappus-Guldin con un hueco ─────────────────────
  # Figura redibujada a escala con el resultado: b = sqrt(2/3)·a = 0,816·a,
  # a = 90 px. El original dibuja el hueco con b ≈ a/2 y no está a escala.
  - id: exma2425-ext-1-el-hueco-cuadrado-que-fija-el-volumen
    titulo: El hueco cuadrado que fija el volumen de revolución
    fuente: >-
      Teoría, cuestión 1 · Mecánica Aplicada, examen del 1.er cuatrimestre
      (Estática), convocatoria extraordinaria del 27 de junio de 2025 · Escuela
      de Ingeniería de Gipuzkoa, UPV/EHU
    nivel: examen
    enunciado: |
      (1p) Sabiendo que el volumen generado por la superficie sombreada al
      girar alrededor del eje $x$ es $V = 2\pi a^{3}$, calcular el valor de la
      longitud $b$ en función de $a$. (El centro de gravedad del cuadrado se
      encuentra a altura a/2).

      <figure class="figura-examen">
      <svg viewBox="0 48 410 184" role="img" width="410" height="184"
           aria-labelledby="fma2425e1t fma2425e1d">
        <title id="fma2425e1t">Un trapecio sombreado con un hueco cuadrado, junto al eje x</title>
        <desc id="fma2425e1d">Un trapecio sombreado apoyado sobre el eje x, con
        su lado izquierdo sobre el eje y. La base inferior mide dos a, desde el
        origen; la superior mide tres a, dividida en un tramo de dos a y otro de
        a; la altura es a. El lado derecho es inclinado y va del punto de
        abscisa dos a en el eje hasta el extremo superior derecho. Dentro de la
        parte rectangular hay un hueco cuadrado de lado b, sin sombrear, con su
        lado derecho en la abscisa dos a y su centro a media altura.</desc>
        <defs>
          <marker id="fma2425e1f" viewBox="0 0 9 9" refX="7" refY="4.5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L9 4.5 L0 9 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <polygon points="60,200 240,200 330,110 60,110" fill="var(--live)" fill-opacity=".16" stroke="var(--ink)" stroke-width="2"/>
        <rect x="166.5" y="118.3" width="73.5" height="73.5" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.6"/>
        <path d="M60 200 L398 200" fill="none" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#fma2425e1f)"/>
        <path d="M60 200 L60 58" fill="none" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#fma2425e1f)"/>
        <text x="394" y="218" font-size="12" fill="var(--ink)">x</text>
        <text x="68" y="66" font-size="12" fill="var(--ink)">y</text>
        <g fill="none" stroke="var(--faint)" stroke-width="1">
