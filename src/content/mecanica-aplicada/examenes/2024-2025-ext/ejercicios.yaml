          <path d="M34 200 L56 200"/>
        </g>
        <text x="150" y="87" text-anchor="middle" font-size="12" fill="var(--faint)">2a</text>
        <text x="285" y="87" text-anchor="middle" font-size="12" fill="var(--faint)">a</text>
        <text x="30" y="159" text-anchor="end" font-size="12" fill="var(--faint)">a</text>
        <text x="203.3" y="133" text-anchor="middle" font-size="11" fill="var(--ink)">b</text>
        <text x="172" y="159" font-size="11" fill="var(--ink)">b</text>
      </svg>
      <figcaption>

      Redibujada **a escala** con el lado que sale de la resolución; la figura
      original no lo está y pinta el hueco más pequeño. El lado inclinado va
      de la abscisa **2a** en el eje hasta el vértice superior derecho, y el
      hueco se ha dejado donde lo pone el original, con su lado derecho en
      **2a**.

      </figcaption>
      </figure>
    pide: El lado $b$ del hueco cuadrado, en función de $a$.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué dice el teorema de Pappus-Guldin sobre el volumen que genera esta
          superficie, con su hueco, al girar alrededor del eje $x$?
        opciones:
          - texto: >-
              $V = 2\pi\sum A_i\,\overline{y}_i$, y el hueco entra con área negativa
              en su propio centro de gravedad
            correcta: true
            mensaje: |
              Eso es. El volumen es el área por la circunferencia que recorre
              su centro de gravedad, y el momento estático se suma por piezas:
              el cuadrado es un agujero, así que resta.
          - texto: $V = \pi\sum A_i\,\overline{y}_i^{2}$, como si cada pieza fuera un disco
            mensaje: |
              Eso mezcla Pappus con el disco macizo. Cada elemento $dA$ describe
              un anillo de longitud $2\pi y$, así que el volumen es
              $2\pi\int y\,dA$: lineal en $y$, no cuadrático.
          - texto: $V = 2\pi\,\overline{x}\,A$, con la abscisa del centro de gravedad
            mensaje: |
              Esa es la vuelta alrededor del eje $y$. Girando alrededor de $x$,
              el radio de la circunferencia es la distancia a ese eje, que es
              $\overline{y}$.
          - texto: El hueco también barre volumen, así que se suma a la superficie
            mensaje: |
              Barre un volumen, pero es volumen que **falta**: el cuadrado no
              está sombreado. Si lo sumas, el volumen crece con $b$ y la
              ecuación no tiene solución.

      - tipo: calcular
        titulo: El momento estático sin el hueco
        pregunta: |
          Sin contar el hueco, ¿cuánto vale $\sum A_i\,\overline{y}_i$ del trapecio,
          en unidades de $a^{3}$?
        respuesta:
          tipo: numero
          valor: '1.3333333'
          tolerancia: 0.002
          formato: un número, el coeficiente de a³
        distractores:
          - valor: '1.25'
            mensaje: |
              Has tomado el trapecio entero con su centro de gravedad a media
              altura, $\overline{y} = a/2$. Eso solo vale para un rectángulo: el
              triángulo de la derecha tiene más área arriba que abajo.
          - valor: '1.1666667'
            mensaje: |
              Has puesto el centro de gravedad del triángulo a $a/3$ del eje.
              El tercio se mide desde su **lado horizontal**, que aquí está
              arriba, en $y = a$: el centro queda a $2a/3$.
          - valor: '1.6666667'
            mensaje: |
              Has tomado el área del triángulo como $a^{2}$. Es un triángulo
              rectángulo de catetos $a$ y $a$: su área es $a^{2}/2$.
        pista: |
          Parte el trapecio en un rectángulo $2a\times a$ y el triángulo de la
          derecha, de vértices $(2a,0)$, $(3a,a)$ y $(2a,a)$. Mira dónde está su
          lado horizontal antes de colocar su centro de gravedad.
        desarrollo: |
          $$
          \sum A_i\overline{y}_i = 2a^{2}\cdot\frac{a}{2} + \frac{a^{2}}{2}\cdot\frac{2a}{3}
          = a^{3} + \frac{a^{3}}{3} = \frac{4}{3}\,a^{3}
          $$

      - tipo: calcular
        titulo: El lado del hueco
        pregunta: |
          Con $V = 2\pi a^{3}$, ¿cuánto vale $b$, en unidades de $a$?
        respuesta:
          tipo: numero
          valor: '0.8164966'
          tolerancia: 0.002
          formato: un número, el cociente b/a
        distractores:
          - valor: '0.5773503'
            mensaje: |
              Viene de colocar el centro del triángulo a $a/3$ del eje. Con
              $2a/3$, que es lo correcto, el momento del trapecio es
              $\tfrac{4}{3}a^{3}$ y no $\tfrac{7}{6}a^{3}$.
          - valor: '0.7071068'
            mensaje: |
              Viene de dar al trapecio entero $\overline{y} = a/2$. Hay que partirlo:
              el triángulo de la derecha aporta $a^{3}/3$, no $a^{3}/4$.
          - valor: '1.1547005'
            mensaje: |
              Viene de tomar el triángulo con área $a^{2}$. Fíjate además en
              que $b > a$: un hueco más alto que la propia figura no cabe, y
              eso ya avisa de que algo está mal.
          - valor: '0.6666667'
            mensaje: |
              Ese es $b^{2}/a^{2}$. Te falta la raíz: $b = \sqrt{2/3}\,a$.
        pista: |
          Iguala $2\pi\left(\tfrac{4}{3}a^{3} - b^{2}\cdot\tfrac{a}{2}\right)$ a
          $2\pi a^{3}$ y despeja $b^{2}$.
        desarrollo: |
          $$
          \frac{4}{3}a^{3} - \frac{a\,b^{2}}{2} = a^{3}
          \;\Longrightarrow\; b^{2} = \frac{2}{3}\,a^{2}
          \;\Longrightarrow\; b = \sqrt{\tfrac{2}{3}}\;a \approx 0{,}816\,a
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El volumen de revolución alrededor de $x$ es $2\pi$ por el
              momento estático de la superficie respecto de ese eje.
          - texto: >-
              El momento estático se suma por piezas: rectángulo, triángulo y,
              con signo menos, el hueco cuadrado.
          - texto: >-
              El triángulo tiene su lado horizontal arriba, así que su centro de
              gravedad está a $2a/3$ del eje.
          - texto: >-
              Igualando a $2\pi a^{3}$ queda $b^{2} = 2a^{2}/3$, y
              $b \approx 0{,}816\,a$ cabe dentro de la altura $a$.
          - texto: >-
              La abscisa del hueco cambia el volumen, así que hay que conocerla
              para despejar $b$.
            trampa: true
            mensaje: |
              Al girar alrededor de $x$ solo cuenta la distancia al eje, $\overline{y}$.
              El hueco puede estar en cualquier abscisa y el volumen es el
              mismo; por eso el enunciado solo da la altura de su centro.
    resolucion: |
      **La idea.** Al girar alrededor del eje $x$, cada trozo de superficie
      recorre una circunferencia de radio igual a su distancia al eje. El
      segundo teorema de Pappus-Guldin lo junta todo en una línea:

      $$
      V = 2\pi\,\overline{y}\,A = 2\pi\sum A_i\,\overline{y}_i
      $$

      La superficie es un trapecio con un agujero, así que se parte en tres
      piezas y el agujero entra con área negativa.

      **Las piezas.** El trapecio tiene sus vértices en $(0,0)$, $(2a,0)$,
      $(3a,a)$ y $(0,a)$: un rectángulo de $2a\times a$ y, a su derecha, un
      triángulo de catetos $a$ y $a$ cuyo lado horizontal está **arriba**.

      | pieza | área | $\overline{y}$ | $A\,\overline{y}$ |
      |---|---|---|---|
      | rectángulo | $2a^{2}$ | $a/2$ | $a^{3}$ |
      | triángulo | $a^{2}/2$ | $2a/3$ | $a^{3}/3$ |
      | hueco | $-b^{2}$ | $a/2$ | $-a\,b^{2}/2$ |

      El centro de gravedad de un triángulo está a un tercio de la altura
      medido desde el lado opuesto al vértice; aquí ese lado es el de arriba,
      así que el centro queda a $a - a/3 = 2a/3$ del eje. Ponerlo a $a/3$ es
      el error de esta cuestión.

      **La ecuación.**

      $$
      2\pi\left(a^{3} + \frac{a^{3}}{3} - \frac{a\,b^{2}}{2}\right) = 2\pi a^{3}
      \;\Longrightarrow\; \frac{a\,b^{2}}{2} = \frac{a^{3}}{3}
      \;\Longrightarrow\; b^{2} = \frac{2}{3}\,a^{2}
      $$

      **Resultado.**

      $$
      b = \sqrt{\frac{2}{3}}\;a \approx 0{,}816\,a
      $$

      **Comprobación.** $b < a$, así que el hueco cabe: con su centro a $a/2$
      le sobran $0{,}092\,a$ por arriba y por abajo. Y la abscisa del hueco no
      interviene en ninguna cuenta, que es por lo que el enunciado solo da su
      altura. La figura está dibujada con este valor.

  # ── Teoría, la cuestión sin número · el cable parabólico ────────────────
  # Le falta un dato de fuerza: q y T0 por separado no se pueden dar. La luz
  # no está impresa y se lee en la figura (B sobre el eje x → x_B = 1 m).
  # Figura a escala: 1 m = 360 px, flecha 1/16 m = 22,5 px.
  - id: exma2425-ext-2-el-cable-parabolico-al-que-le-falta-una-fuerza
    titulo: El cable parabólico al que le falta una fuerza
    fuente: >-
      Teoría, la cuestión sin número que sigue a la 1 · Mecánica Aplicada,
      examen del 1.er cuatrimestre (Estática), convocatoria extraordinaria del
      27 de junio de 2025 · Escuela de Ingeniería de Gipuzkoa, UPV/EHU
    nivel: examen
    enunciado: |
      El cable $AB$, sin peso propio, está sometido a la carga distribuida por
      unidad de abcisa q constante. Sabiendo que la ecuación, en el sistema de
      referencia de la figura, de la curva que forma es:

      $$
      y = \frac{x^{2}}{4} - \frac{x}{4} \quad \text{(metros)}
      $$

      Se pide el valor de la carga $q$, la tensión en el punto más bajo de la
      curva $T_0$ y la longitud entre $A$ y $B$.

      <figure class="figura-examen">
      <svg viewBox="16 28 474 164" role="img" width="474" height="164"
           aria-labelledby="fma2425e2t fma2425e2d">
        <title id="fma2425e2t">El cable AB con carga uniforme por unidad de abscisa</title>
        <desc id="fma2425e2d">Un cable sujeto en dos apoyos, A a la izquierda y
        B a la derecha, a la misma altura. El origen de coordenadas está en A,
        con el eje y hacia arriba y el eje x hacia la derecha pasando por B. El
        cable cuelga entre los dos formando una curva poco profunda, con su
        punto más bajo a mitad de camino. Debajo, una fila de flechas verticales
        iguales hacia abajo representa la carga q, repartida a lo largo de la
        horizontal.</desc>
        <defs>
          <marker id="fma2425e2f" viewBox="0 0 9 9" refX="7" refY="4.5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L9 4.5 L0 9 z" fill="var(--ink)"/>
          </marker>
          <marker id="fma2425e2q" viewBox="0 0 9 9" refX="7" refY="4.5" markerWidth="5" markerHeight="5" orient="auto">
            <path d="M0 0 L9 4.5 L0 9 z" fill="var(--d2)"/>
          </marker>
        </defs>
