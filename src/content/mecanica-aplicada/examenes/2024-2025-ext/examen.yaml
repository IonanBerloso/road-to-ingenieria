asignatura: mecanica-aplicada
curso: '2024-2025'
convocatoria: extraordinaria
fecha: 27 de junio de 2025
# La extraordinaria del bloque 1 —Estática, «1er Cuatrimestre» en la cabecera—
# de 2024-2025. Es el cuadernillo más raro de los tres del bloque, y conviene
# decir lo raro antes de que nadie lo deduzca:
#
# 1. **LA COLUMNA EN EUSKERA ESTÁ VACÍA.** Solo trae las cabeceras («1 Ariketa:
#    3 puntu» y una «a)» suelta en la página 3). Todo se transcribe de la
#    columna castellana, que es la única con texto.
#
# 2. **FALTA EL EJERCICIO 2 ENTERO.** La página 5 trae su cabecera
#    —«Ejercicio 2: 3 puntos»— y nada debajo. Va en `fuera`. La página 2 está
#    en blanco y la 4 es una hoja de EJERCICIOS vacía que lleva la fecha de la
#    ordinaria, «6 de junio de 2025»: un resto de la plantilla, no un examen.
#    Las dos se han renderizado y mirado para confirmarlo.
#
# 3. **LA TEORÍA ESTÁ INCOMPLETA.** Solo trae dos cuestiones: la 1, numerada
#    y con su «(1p)», y una segunda **sin número y sin puntos** —el cable
#    parabólico—. Las otras dos convocatorias del bloque, enero de 2024 y la
#    ordinaria de 2025, traen cuatro cuestiones cada una.
#
# 4. **LOS PUNTOS NO SUMAN 10.** Impresos hay 1 (teoría 1) + 3 (ejercicio 1)
#    + 3 (ejercicio 2) = 7. Los tres que faltan casarían con tres cuestiones de
#    teoría de un punto que no se imprimieron, pero eso es una deducción, no un
#    dato. Por eso ningún ejercicio lleva el campo `puntos`: el cuadernillo no
#    reparte por competencia, y lo que no se imprime no se estima (§10).
#
# 5. **A LA CUESTIÓN DEL CABLE LE FALTA UN DATO.** Pide «el valor de la carga
#    q» y «la tensión en el punto más bajo T0», y el enunciado no trae una sola
#    fuerza: la curva fija el cociente, q/T0 = 1/2 m⁻¹, y nada más. Tampoco
#    imprime la luz; se lee en la figura, donde B está dibujado sobre el eje x
#    (x = 1 m). Se transcribe igual, y su resolución lo dice en voz alta en vez
#    de inventar una fuerza.
#
# CÓMO SE NUMERA `n`. La teoría y los ejercicios empiezan los dos en 1, y una
# cuestión de teoría y el «Ejercicio 1» no pueden compartir número: la página
# cuenta los `n` distintos para decir cuántos ejercicios trae el examen, y
# publicaría «Falta el ejercicio 2 de los 3» sin decir de cuál de los dos 2
# habla. Así que `n` sigue **el orden de aparición en el cuadernillo**:
#   1 = teoría, cuestión 1 (Pappus-Guldin)
#   2 = teoría, la cuestión sin número (cable parabólico)
#   3 = «Ejercicio 1» (catenaria y disco), partido en dos piezas
#   4 = «Ejercicio 2», que no está impreso → `fuera`
# Cada `fuente` y cada motivo dicen además el nombre impreso, para que nadie
# tenga que traducir el número.
pdf: 2024-2025-ext.pdf

ejercicios:
  # Teoría, cuestión 1 · el volumen de revolución de un trapecio con un hueco
  # cuadrado. Pappus-Guldin con una pieza que resta.
  - id: exma2425-ext-1-el-hueco-cuadrado-que-fija-el-volumen
    tema: t02-geometria-de-masas
    n: 1

  # Teoría, la cuestión sin número · cable sin peso con carga por unidad de
  # abscisa. Solo se puede dar q/T0 y la longitud: falta una fuerza.
  - id: exma2425-ext-2-el-cable-parabolico-al-que-le-falta-una-fuerza
    tema: t05-cables
    n: 2

  # «Ejercicio 1: 3 puntos» · un cable pesado entre un disco y una polea. El
  # apartado a) es catenaria pura; el b) es el equilibrio del disco con su
  # rozamiento, y por eso va al tema 4.
  - id: exma2425-ext-3-la-catenaria-entre-el-disco-y-la-polea
    tema: t05-cables
    n: 3
  - id: exma2425-ext-3-el-bloque-que-sujeta-el-disco
    tema: t04-rozamiento
    n: 3

fuera:
  - n: 4
    motivo: >-
      Es el «Ejercicio 2: 3 puntos» del cuadernillo, y **no está impreso**: la
      página 5 del PDF trae su cabecera, en castellano y en euskera, y debajo
      nada — ni enunciado, ni figura, ni apartados. No hay nada que transcribir
      ni que resolver, y escribir un enunciado para ese hueco sería inventarlo.
      Si aparece otra copia del examen con el ejercicio completo, entra aquí.
