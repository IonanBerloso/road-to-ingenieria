        <path d="M82 266 L90 258 M92 266 L100 258 M102 266 L110 258 M112 266 L120 258"
              fill="none" stroke="var(--faint)" stroke-width="1"/>
        <circle cx="100" cy="250" r="7" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.4"/>
        <circle cx="100" cy="250" r="2.4" fill="var(--ink)"/>
        <path d="M76 222 A28 28 0 0 1 124 222" fill="none" stroke="var(--d4)" stroke-width="1.5" marker-end="url(#ma18192cx4f)"/>
        <text x="132" y="230" font-size="13" font-style="italic" fill="var(--d4)">M₀</text>
        <text x="86" y="242" text-anchor="end" font-size="13" font-weight="bold" fill="var(--ink)">A</text>
        <text x="88" y="142" text-anchor="end" font-size="13" font-weight="bold" fill="var(--ink)">B</text>
        <text x="196" y="136" text-anchor="end" font-size="13" font-weight="bold" fill="var(--ink)">C</text>
      </svg>
      </figure>
    pide: >-
      El par constante que hace que AB gire con velocidad angular ω cuando C
      llega a la altura de A, partiendo del reposo en la posición de la figura.
    pasos:
      - tipo: reconocer
        pregunta: |
          Se conoce la velocidad en la posición final y se pide un par
          constante. ¿Qué camino lleva de una cosa a la otra sin calcular
          reacciones ni lo que pasa entre medias?
        opciones:
          - texto: >-
              El teorema de la energía entre la posición de la figura, en
              reposo, y la final: el trabajo del par y de los pesos es la
              energía cinética final
            correcta: true
            mensaje: |
              Eso es. Relaciona una velocidad con dos posiciones, y como el par
              es constante su trabajo es $M_0$ por el ángulo girado. Las
              reacciones no aparecen, porque no trabajan.
          - texto: >-
              Las ecuaciones de Newton-Euler de las dos barras en la posición
              final
            mensaje: |
              Esas ecuaciones relacionan las fuerzas con las **aceleraciones**
              de un instante, y meten las reacciones de A, B y C como
              incógnitas. La velocidad final es el resultado de todo el
              recorrido, y eso lo cuenta el trabajo.
          - texto: >-
              La conservación de la energía mecánica, con la energía potencial
              de los pesos
            mensaje: |
              Falta el par, que aporta energía durante todo el camino:
              $M_0\,\Delta\theta$. Sin él, la energía cinética final sería solo
              la que dan los pesos al bajar, y no se podría pedir cualquier
              $\omega$.
          - texto: El teorema del impulso entre las dos posiciones
            mensaje: |
              El impulso necesita el tiempo que se tarda y las fuerzas de los
              enlaces a lo largo de él, y no se conoce ninguna de las dos
              cosas. El trabajo solo necesita el camino.

      - tipo: calcular
        titulo: El trabajo del par
        pregunta: |
          Primero la geometría: cuando C llega a la altura de A, ¿cuánto ha
          girado AB? Da el trabajo del par entre las dos posiciones, en unidades
          de $M_0$.
        respuesta:
          tipo: numero
          valor: '0.5236'
          tolerancia: 0.001
          formato: un número, en unidades de M₀; vale la forma exacta, como pi/6
        distractores:
          - valor: '30'
            mensaje: |
              Has multiplicado el par por el ángulo en grados. El trabajo de un
              par es $M_0\,\Delta\theta$ con el ángulo en **radianes**:
              $30° = \pi/6$.
          - valor: '0.7854'
            mensaje: |
              Es $\pi/4$: has supuesto que AB acaba a 45°. Con AB, BC y la
              distancia de A a la pista iguales a L, el triángulo ABC es
              equilátero y AB acaba a 60° de la horizontal, o sea a 30° de la
              vertical.
          - valor: '1.0472'
            mensaje: |
              Es $\pi/3$, el ángulo que AB forma al final con la horizontal. Lo
              que cuenta es lo que ha **girado** desde la vertical, donde
              empezaba: 30°.
        pista: |
          C va por la pista, a L de A en horizontal. Con A y C a la misma
          altura, el triángulo ABC tiene los tres lados iguales.
        desarrollo: |
          A, B y C forman un triángulo equilátero de lado L: AB ha pasado de
          vertical a formar 60° con AC, que es horizontal, así que ha girado
          30°, en el sentido del par.

          $$
          W_{M_0} = M_0\,\Delta\theta = \frac{\pi}{6}\,M_0
          $$

          con $\pi/6 \approx 0{,}5236$.

      - tipo: calcular
        titulo: La energía cinética final
        pregunta: |
          En la posición final, ¿cuánto vale la energía cinética del sistema, en
          unidades de $mL^{2}\omega^{2}$?
        respuesta:
          tipo: numero
          valor: '0.5833'
          tolerancia: 0.001
          formato: un número, en unidades de mL²ω²; vale la forma exacta, como 7/12
        distractores:
          - valor: '0.3333'
            mensaje: |
              Has tratado BC como si girara alrededor de B, igual que AB
              alrededor de A. B se mueve: el centro instantáneo de BC está en A,
              y su centro de gravedad va a $\tfrac{\sqrt{3}}{2}\,\omega L$.
          - valor: '0.2083'
            mensaje: |
              Te has dejado la traslación de BC: solo has contado su giro,
              $\tfrac12\,\tfrac{mL^{2}}{12}\,\omega^{2}$. Su centro de gravedad
              se mueve, y $\tfrac12 m v_G^{2}$ es la parte grande.
          - valor: '0.5417'
            mensaje: |
              Te has dejado el giro de BC alrededor de su centro,
              $\tfrac12\,\tfrac{mL^{2}}{12}\,\omega^{2}$. BC gira con la misma
              $\omega$ que AB, y esa energía se suma a la de su traslación.
        pista: |
          El centro instantáneo de BC está donde se cortan la perpendicular a
          $\vec{v}_B$ —la recta AB— y la perpendicular a $\vec{v}_C$ —la
          horizontal por C—: en A.
        desarrollo: |
          Con el CIR de BC en A, BC gira con la misma $\omega$ que AB, y su
          centro, a $\tfrac{\sqrt{3}}{2}L$ de A, va a $\tfrac{\sqrt{3}}{2}\,\omega L$:

          $$
          T = \frac12\,\frac{mL^{2}}{3}\,\omega^{2} + \frac12\,m\left(\frac{\sqrt{3}}{2}\,\omega L\right)^{2} + \frac12\,\frac{mL^{2}}{12}\,\omega^{2}
          = \frac{7}{12}\,mL^{2}\omega^{2}
          $$

          con $7/12 \approx 0{,}5833$.

      - tipo: calcular
        titulo: El trabajo de los pesos
        pregunta: |
          ¿Cuánto trabajo hacen los pesos entre las dos posiciones, en unidades
          de $mgL$?
        respuesta:
          tipo: numero
          valor: '0.634'
          tolerancia: 0.001
          formato: un número, en unidades de mgL; vale la forma exacta
        distractores:
          - valor: '0.567'
            mensaje: |
              Te has dejado el peso de AB. Su centro baja poco,
              $\left(\tfrac12 - \tfrac{\sqrt{3}}{4}\right)L \approx 0{,}067L$,
              pero baja, y su peso trabaja.
          - valor: '1.067'
            mensaje: |
              Has hecho bajar el centro de BC lo que baja C, una L entera. El
              centro de BC está entre B y C, y B apenas baja: el centro acaba a
              $\tfrac{\sqrt{3}}{4}L$ de altura, no a cero.
        pista: |
          El centro de AB pasa de $L/2$ a $\tfrac{\sqrt{3}}{4}L$ de altura; el de
          BC, de $L$ a $\tfrac{\sqrt{3}}{4}L$.
        desarrollo: |
          $$
          W_g = mg\left(\frac{L}{2} - \frac{\sqrt{3}}{4}L\right) + mg\left(L - \frac{\sqrt{3}}{4}L\right)
          = \frac{3 - \sqrt{3}}{2}\,mgL
          $$

          con $\tfrac{3 - \sqrt{3}}{2} \approx 0{,}634$. Es positivo: los dos
          centros bajan.

      - tipo: calcular
        titulo: El par con valores nuestros
        pregunta: |
          Comprobación con valores nuestros: $m = 2$ kg, $L = 1$ m,
          $\omega = 4$ rad/s y $g = 9{,}81$ m/s². ¿Cuánto vale $M_0$?
        respuesta:
          tipo: magnitud
          valor: '11.89 N*m'
          tolerancia: 0.01
          formato: con su unidad, en N·m
        distractores:
          - valor: '35.65 N*m'
            mensaje: |
              Te has dejado el trabajo de los pesos. Las dos barras bajan, y el
              peso pone 12,44 J de los 18,67 que hacen falta: el par solo tiene
              que poner el resto.
          - valor: '59.41 N*m'
            mensaje: |
              Has sumado el trabajo de los pesos a la energía cinética en vez de
              restarlo, como si las barras subieran. Bajan, y el peso ayuda al
              par.
          - valor: '5.947 N*m'
            mensaje: |
              Has dividido entre $\pi/3$: el ángulo que AB forma al final con la
              horizontal. AB ha girado 30° desde la vertical, $\pi/6$.
        pista: |
          $M_0\,\dfrac{\pi}{6} = \dfrac{7}{12}\,mL^{2}\omega^{2} - \dfrac{3 - \sqrt{3}}{2}\,mgL$.
        desarrollo: |
          $$
          T = \frac{7}{12}\cdot 2\cdot 1^{2}\cdot 4^{2} \approx 18{,}667\ \text{J},
          \qquad
          W_g = \frac{3 - \sqrt{3}}{2}\cdot 2\cdot 9{,}81\cdot 1 \approx 12{,}439\ \text{J}
          $$

          $$
          M_0 = \frac{6\left(18{,}667 - 12{,}439\right)}{\pi} \approx 11{,}89\ \text{N·m}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Cuando C llega a la altura de A, ABC es un triángulo equilátero de
              lado L: AB ha girado 30°, y el par ha hecho $M_0\,\pi/6$.
          - texto: >-
              Los dos centros de gravedad bajan: los pesos hacen
              $\tfrac{3 - \sqrt{3}}{2}\,mgL$, y las reacciones no trabajan.
          - texto: >-
              En la posición final el CIR de BC está en A: BC gira con $\omega$
              y su centro va a $\tfrac{\sqrt{3}}{2}\,\omega L$.
          - texto: >-
              $T = \tfrac{7}{12}\,mL^{2}\omega^{2}$, y el teorema de la energía
              da $M_0 = \tfrac{7mL^{2}\omega^{2}}{2\pi} - \tfrac{3(3 - \sqrt{3})\,mgL}{\pi}$.
          - texto: >-
              Como A es un punto fijo, el par aplicado en AB no trabaja.
            trampa: true
            mensaje: |
              Un par trabaja al girar el sólido sobre el que actúa, esté donde
              esté: $dW = M_0\,d\theta$. Que A no se mueva quita el trabajo de la
              **reacción** en A, no el del par. Sin ese trabajo, la energía final
              saldría solo de los pesos y no se podría elegir $\omega$.
    resolucion: |
      **La geometría.** En la posición de la figura AB es vertical y BC
      horizontal, así que la pista está a L de A en horizontal y C empieza a una
      altura L. Cuando C baja hasta la altura de A, los tres puntos A, B y C
      están a una distancia L entre sí —AB y BC son barras de L, y AC es la
      distancia de A a la pista—: el triángulo es **equilátero**. AB ha pasado
      de vertical a formar 60° con la horizontal, así que ha girado
      $\Delta\theta = 30° = \pi/6$ en sentido horario, el del par.

      **El teorema de la energía.** El sistema parte del reposo, y las
      reacciones no trabajan: la de A actúa en un punto fijo, la de B es interna
      y la de la pista, sin rozamiento, es perpendicular al movimiento de C.
      Trabajan el par y los pesos:

      $$
      M_0\,\frac{\pi}{6} + W_g = T_{\text{final}}
      $$

      **El trabajo de los pesos.** Los dos centros de gravedad bajan. El de AB,
      de $L/2$ a $\tfrac{L}{2}\cos 30° = \tfrac{\sqrt{3}}{4}L$; el de BC, de L al
      punto medio de B y C, a $\tfrac{\sqrt{3}}{4}L$ de altura:

      $$
      W_g = mg\left(\frac{L}{2} - \frac{\sqrt{3}}{4}L\right) + mg\left(L - \frac{\sqrt{3}}{4}L\right) = \frac{3 - \sqrt{3}}{2}\,mgL
      $$

      **Las velocidades en la posición final.** $\vec{v}_B$ es perpendicular a
      AB y mide $\omega L$; $\vec{v}_C$ es vertical, porque C va por la pista. El
      centro instantáneo de BC está donde se cortan las perpendiculares a las
      dos: la recta AB y la horizontal por C, que se cortan **en A**. Así que en
      ese instante BC gira alrededor de A con $v_B/AB$, la misma $\omega$ que
      AB; C baja a $\omega\cdot AC = \omega L$, y el centro de BC, a
      $\tfrac{\sqrt{3}}{2}L$ de A, va a $\tfrac{\sqrt{3}}{2}\,\omega L$.

