      La posición final, dibujada a escala sobre la de partida. A, B y C forman
      un triángulo equilátero, y las perpendiculares a las velocidades de B y
      de C se cortan en A: BC gira alrededor de A con la misma velocidad
      angular que AB, y C baja tan deprisa como se mueve B.

      </figcaption>
