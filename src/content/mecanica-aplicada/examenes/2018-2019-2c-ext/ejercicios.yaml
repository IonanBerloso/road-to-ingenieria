        <path d="M224 50 L232 42 M224 62 L232 54 M224 74 L232 66 M224 86 L232 78 M224 98 L232 90
                 M224 110 L232 102 M224 122 L232 114 M224 186 L232 178 M224 198 L232 190
                 M224 210 L232 202 M224 222 L232 214 M224 234 L232 226 M224 246 L232 238
                 M224 258 L232 250 M224 270 L232 262 M224 282 L232 274"
              fill="none" stroke="var(--faint)" stroke-width="1"/>
        <line x1="100" y1="250" x2="100" y2="150" stroke="var(--ink)" stroke-width="2.2"/>
        <line x1="100" y1="150" x2="200" y2="150" stroke="var(--ink)" stroke-width="2.2"/>
        <rect x="208" y="136" width="10" height="28" fill="var(--faint)" fill-opacity=".25" stroke="var(--ink)" stroke-width="1.3"/>
        <line x1="204.5" y1="150" x2="208" y2="150" stroke="var(--ink)" stroke-width="1.4"/>
        <circle cx="100" cy="150" r="4.5" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.4"/>
