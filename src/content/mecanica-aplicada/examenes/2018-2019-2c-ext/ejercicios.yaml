ejercicios:
  # ── Cuestión 1 de teoría (n 1) · las componentes tangencial y normal de la
  #    aceleración. El enunciado solo nombra el tema; se resuelve como una
  #    deducción, y las cuentas de comprobación usan valores nuestros, dichos
  #    en la pregunta.
  - id: exma1819-2cext-1-las-componentes-intrinsecas-de-la-aceleracion
    titulo: Las componentes intrínsecas de la aceleración, deducidas
    fuente: >-
      Cuestión 1 de teoría · Convocatoria extraordinaria de junio de 2019,
      Dinámica · Mecánica Aplicada, Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU). Transcrita de la columna en castellano, que en el PDF va como
      imagen; la cuestión no lleva verbo y se resuelve como una deducción. El
      examen no publica resolución; el desarrollo y la figura son nuestros.
    nivel: examen
    enunciado: |
      **1. (1,5 puntos)** Componentes intrínsecas de la aceleración de una
      partícula.
    pide: >-
      La deducción de las dos componentes intrínsecas de la aceleración, la
      tangencial y la normal, y lo que mide cada una.
    pasos:
      - tipo: reconocer
        pregunta: |
          La aceleración de una partícula se descompone en dos componentes
          «intrínsecas». ¿Según qué direcciones, y por qué se llaman así?
        opciones:
          - texto: >-
              Según la tangente y la normal a la trayectoria en el punto: no
              dependen de los ejes que elijas, sino de la propia trayectoria
            correcta: true
            mensaje: |
              Eso es. La tangente la marca la velocidad y la normal apunta al
              centro de curvatura. Se llaman intrínsecas porque son de la
              curva: cambias de ejes y siguen siendo las mismas.
          - texto: >-
              Según los ejes X, Y y Z: son las derivadas segundas de las tres
              coordenadas
            mensaje: |
              Esas son las componentes **cartesianas**, y dependen de cómo
              orientes los ejes: gíralos y cambian. Las intrínsecas se miden
              sobre la trayectoria, en su tangente y en su normal.
          - texto: >-
              Según la dirección que une el origen con la partícula y su
              perpendicular
            mensaje: |
              Esas son las componentes **polares**, que dependen de dónde pongas
              el origen. La normal intrínseca no apunta al origen: apunta al
              centro de curvatura, que cambia de un punto a otro de la
              trayectoria.

      - tipo: redactar
        consigna: |
          La cuestión en papel: la trayectoria con el punto P, los unitarios
          $\vec{e}_t$ y $\vec{e}_n$, el centro de curvatura y el radio $\rho$; la
          derivada de la velocidad y la del vector tangente, y las dos
          componentes con lo que mide cada una. Media cara y un dibujo.
        rubrica:
          - punto: |
              **La velocidad, tangente.** $\vec{v} = \dot{s}\,\vec{e}_t = v\,\vec{e}_t$,
              con $s$ el arco recorrido y $\vec{e}_t$ el unitario tangente en P.
            porque: |
              Es el punto de partida y el que fija la dirección tangente. Sin él
              no hay nada que derivar, y quien empieza por
              $\vec{a} = a_t\vec{e}_t + a_n\vec{e}_n$ está recitando el
              resultado.
          - punto: |
              **Derivar el producto.** $\vec{a} = \dot{v}\,\vec{e}_t + v\,\dot{\vec{e}}_t$:
              la velocidad cambia de módulo y cambia de dirección.
            porque: |
              Es el paso que separa las dos componentes. Quien deriva solo el
              módulo pierde la normal entera, que es la mitad de la cuestión.
          - punto: |
              **La derivada del vector tangente.** Con
              $\vec{e}_t = \cos\varphi\,\vec{I} + \sin\varphi\,\vec{J}$ sale
              $\dot{\vec{e}}_t = \dot{\varphi}\,\vec{e}_n$, con
              $\vec{e}_n = -\sin\varphi\,\vec{I} + \cos\varphi\,\vec{J}$,
              perpendicular a $\vec{e}_t$ y hacia el centro de curvatura.
            porque: |
              Aquí está la idea: un vector unitario tiene módulo constante, no
              dirección constante. Su derivada es perpendicular a él, y eso es
              lo que da la componente normal.
          - punto: |
              **El giro de la tangente con el arco.** $ds = \rho\,d\varphi$, así
              que $\dot{\varphi} = \dfrac{d\varphi}{ds}\,\dfrac{ds}{dt} = \dfrac{v}{\rho}$
              y $v\,\dot{\vec{e}}_t = \dfrac{v^{2}}{\rho}\,\vec{e}_n$.
            porque: |
              Es la regla de la cadena que mete el radio de curvatura. Sin ella
              la normal se queda en $v\,\dot{\varphi}$, que es correcta pero no
              dice de qué depende.
          - punto: |
              **El resultado y su lectura.**
              $\vec{a} = \dot{v}\,\vec{e}_t + \dfrac{v^{2}}{\rho}\,\vec{e}_n$: la
              tangencial mide el cambio del módulo de la velocidad y la normal,
              el de su dirección. En una recta $a_n = 0$; en una curva recorrida
              a celeridad constante, $a_t = 0$ y $a_n$ no.
            porque: |
              La lectura es lo que se usa después en la cinemática del sólido
              —un punto que gira tiene su parte tangencial y su parte normal— y
              demuestra que se entiende lo deducido.

      - tipo: calcular
        titulo: La componente tangencial
        pregunta: |
          Comprobación con valores nuestros: una partícula recorre una
          circunferencia de 2 m de radio con $s = t^{3}$ (s en metros y t en
          segundos). En $t = 1$ s, ¿cuánto vale la componente tangencial de su
          aceleración?
        respuesta:
          tipo: magnitud
          valor: '6 m/s^2'
          tolerancia: 0.01
          formato: con su unidad, en m/s²
        distractores:
          - valor: '3 m/s^2'
            mensaje: |
              Eso es la celeridad, $\dot{s} = 3t^{2} = 3$ m/s, no su derivada.
              La tangencial mide cómo cambia el módulo de la velocidad:
              $\ddot{s} = 6t$.
          - valor: '7.5 m/s^2'
            mensaje: |
              Eso es el módulo de la aceleración entera,
              $\sqrt{6^{2} + 4{,}5^{2}}$. La tangencial es solo la parte que
              cambia el módulo de la velocidad; el resto curva la trayectoria.
        pista: |
          $a_t = \dot{v} = \ddot{s}$.
        desarrollo: |
          $$
          v = \dot{s} = 3t^{2},
          \qquad
          a_t = \dot{v} = 6t
          $$

          En $t = 1$ s, $v = 3$ m/s y $a_t = 6$ m/s².

      - tipo: calcular
        titulo: La componente normal
        pregunta: |
          Y en ese mismo instante, ¿cuánto vale la componente normal?
        respuesta:
          tipo: magnitud
          valor: '4.5 m/s^2'
          tolerancia: 0.01
          formato: con su unidad, en m/s²
        distractores:
          - valor: '1.5 m/s^2'
            mensaje: |
              Has dividido $v$ entre $\rho$ sin elevarla al cuadrado. Eso es
              $\dot{\varphi} = v/\rho$, lo que gira la tangente por segundo; la
              normal es $v\,\dot{\varphi} = v^{2}/\rho$.
          - valor: '18 m/s^2'
            mensaje: |
              Has multiplicado por el radio en vez de dividir. Cuanto más
              cerrada es la curva —radio más pequeño—, mayor es la normal:
              $a_n = v^{2}/\rho$.
        pista: |
          $a_n = v^{2}/\rho$, con $v = 3$ m/s y, en una circunferencia, el radio
          de curvatura igual a su radio.
        desarrollo: |
          $$
          a_n = \frac{v^{2}}{\rho} = \frac{3^{2}}{2} = 4{,}5\ \text{m/s}^{2}
          $$

          Y el módulo de la aceleración es $\sqrt{6^{2} + 4{,}5^{2}} = 7{,}5$
          m/s².

      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              La velocidad es tangente a la trayectoria: $\vec{v} = v\,\vec{e}_t$,
              con $v = \dot{s}$.
          - texto: >-
              Derivando el producto, $\vec{a} = \dot{v}\,\vec{e}_t + v\,\dot{\vec{e}}_t$.
          - texto: >-
              $\vec{e}_t$ gira con la tangente: $\dot{\vec{e}}_t = \dot{\varphi}\,\vec{e}_n$,
              perpendicular a él y hacia el centro de curvatura.
          - texto: >-
              Con $ds = \rho\,d\varphi$, $\dot{\varphi} = v/\rho$, y queda
              $\vec{a} = \dot{v}\,\vec{e}_t + \dfrac{v^{2}}{\rho}\,\vec{e}_n$.
          - texto: >-
              Como $\vec{e}_t$ es unitario, su derivada es nula y
              $\vec{a} = \dot{v}\,\vec{e}_t$.
            trampa: true
            mensaje: |
              Unitario quiere decir de módulo constante, no constante: su
              dirección gira con la tangente, y esa derivada es justo la
              componente normal. Si fuera nula, un coche que toma una curva a
              velocidad constante no tendría aceleración, y la tiene: $v^{2}/\rho$
              hacia el centro.
    resolucion: |
      **La velocidad.** Sea $s$ la longitud de arco recorrida sobre la
      trayectoria y $\vec{e}_t$ el vector unitario tangente en el punto P. El
      desplazamiento elemental $d\vec{r}$ va según la tangente y mide $ds$, así
      que

      $$
      \vec{v} = \frac{d\vec{r}}{dt} = \dot{s}\,\vec{e}_t = v\,\vec{e}_t
      $$

      **La aceleración.** Se deriva el producto, porque la velocidad cambia de
      módulo y cambia de dirección:

      $$
      \vec{a} = \frac{d\vec{v}}{dt} = \dot{v}\,\vec{e}_t + v\,\dot{\vec{e}}_t
      $$

      **La derivada del vector tangente.** Si $\varphi$ es el ángulo que forma
      la tangente con el eje X,

      $$
      \vec{e}_t = \cos\varphi\,\vec{I} + \sin\varphi\,\vec{J}
      \quad\Longrightarrow\quad
      \dot{\vec{e}}_t = \dot{\varphi}\left(-\sin\varphi\,\vec{I} + \cos\varphi\,\vec{J}\right) = \dot{\varphi}\,\vec{e}_n
      $$

      donde $\vec{e}_n$ es el unitario normal: perpendicular a $\vec{e}_t$ y
      dirigido hacia el centro de curvatura C. Un vector unitario tiene módulo
      constante, pero no dirección constante, y su derivada es perpendicular a
      él.

      **El radio de curvatura.** El arco y el giro de la tangente se relacionan
      con el radio de curvatura, $ds = \rho\,d\varphi$. Por la regla de la
      cadena:

      $$
      \dot{\varphi} = \frac{d\varphi}{ds}\,\frac{ds}{dt} = \frac{v}{\rho}
      \quad\Longrightarrow\quad
      v\,\dot{\vec{e}}_t = \frac{v^{2}}{\rho}\,\vec{e}_n
      $$

      **Las componentes intrínsecas.**

      $$
      \vec{a} = a_t\,\vec{e}_t + a_n\,\vec{e}_n,
      \qquad
      a_t = \dot{v} = \ddot{s},
      \qquad
      a_n = \frac{v^{2}}{\rho}
      $$

