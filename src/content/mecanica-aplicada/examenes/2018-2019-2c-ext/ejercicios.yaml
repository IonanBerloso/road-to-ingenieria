      <figcaption>

      La circunferencia de trazos es la que mejor se ajusta a la trayectoria en
      P: su centro es el centro de curvatura C y su radio, ρ. La componente
      tangencial va a lo largo de la curva y la normal apunta siempre hacia C,
      del lado hacia el que se curva. Las flechas están a escala con los
      números de la comprobación: 6 y 4,5 m/s².

      </figcaption>
