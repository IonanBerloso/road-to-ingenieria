      **La energía cinética final.**

      $$
      T = \underbrace{\frac12\,\frac{mL^{2}}{3}\,\omega^{2}}_{\text{AB}} + \underbrace{\frac12\,m\left(\frac{\sqrt{3}}{2}\,\omega L\right)^{2} + \frac12\,\frac{mL^{2}}{12}\,\omega^{2}}_{\text{BC}}
      = \left(\frac{1}{6} + \frac{3}{8} + \frac{1}{24}\right)mL^{2}\omega^{2} = \frac{7}{12}\,mL^{2}\omega^{2}
      $$

      **El par.** Del teorema de la energía:

      $$
      M_0 = \frac{6}{\pi}\left(\frac{7}{12}\,mL^{2}\omega^{2} - \frac{3 - \sqrt{3}}{2}\,mgL\right)
      = \frac{7\,mL^{2}\omega^{2}}{2\pi} - \frac{3\left(3 - \sqrt{3}\right)mgL}{\pi}
      $$

      con $7/(2\,\pi) \approx 1{,}114$ y $3(3 - \sqrt{3})/\pi \approx 1{,}211$.

      **Lectura.** El par tiene dos partes: la que da la energía cinética, que
      crece con $\omega^{2}$, y la que ahorra el peso, que resta, porque las dos
      barras bajan. Si $\omega^{2} < 6(3 - \sqrt{3})\,g/(7L)$, el par sale
      negativo: el peso solo ya daría más velocidad, y el par tendría que
      frenar.

      **Con valores nuestros.** Con $m = 2$ kg, $L = 1$ m, $\omega = 4$ rad/s y
      $g = 9{,}81$ m/s²: $T \approx 18{,}667$ J, $W_g \approx 12{,}439$ J y
      $M_0 = 6\left(18{,}667 - 12{,}439\right)/\pi \approx 11{,}89$ N·m.

      **Comprobación independiente.** Integrando en el tiempo la ecuación del
      movimiento desde el reposo con ese par —con el ángulo de BC como
      coordenada, porque en la posición de partida BC es perpendicular a la
      pista y el ángulo de AB no sirve: al arrancar, C baja sin que AB gire—,
      C llega a la altura de A a los 0,39 s con AB girando a 4 rad/s. Y el giro
      de AB, la energía cinética final y el trabajo de los pesos, sacados de
      posiciones calculadas numéricamente, dan los mismos números.
