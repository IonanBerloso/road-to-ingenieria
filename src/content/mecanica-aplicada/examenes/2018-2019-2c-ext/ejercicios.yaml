        <desc id="ma18192cx4d">Una articulación fija A en el suelo. De A sube la
        barra AB, vertical, hasta B. De B sale la barra BC, horizontal, hasta C,
        a la derecha. En C, la barra está articulada a una deslizadera que corre
        por una pista vertical, una pared rayada a la derecha. Las dos barras
        miden lo mismo, L. Junto a AB, una flecha curva en sentido horario marca
        el par M0.</desc>
        <defs>
          <marker id="ma18192cx4f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d4)"/>
          </marker>
