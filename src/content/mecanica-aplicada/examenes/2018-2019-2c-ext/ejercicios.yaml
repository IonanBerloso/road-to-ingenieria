    pide: >-
      Las velocidades y las aceleraciones angulares de BC y de CD en el instante
      de la figura, y las reacciones estáticas y dinámicas en las
      articulaciones B y C.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuánto vale la velocidad angular de BC en el instante de la figura?
        opciones:
          - texto: >-
              Cero: B y C se mueven los dos en horizontal y BC no es vertical,
              así que la barra se traslada
            correcta: true
            mensaje: |
              Eso es. AB y CD son verticales, así que $\vec{v}_B$ y $\vec{v}_C$
              son horizontales. En BC,
              $\vec{v}_C - \vec{v}_B = \vec{\omega}_{BC}\times\overrightarrow{BC}$,
              y con BC a 45° ese término tendría componente vertical si
              $\omega_{BC}$ no fuera nula. El centro instantáneo de BC, en el
              cruce de AB y CD, está en el infinito: se traslada.
          - texto: $\omega_1$, la misma que AB, porque están articuladas en B
            mensaje: |
              La articulación obliga a que las dos barras compartan la
              **velocidad del punto B**, no el giro. Cada barra gira lo suyo, y
              aquí BC no gira.
          - texto: $\omega_1/2$, la misma que CD
            mensaje: |
              Ese es el valor de $\omega_{CD}$, que sale de que C va igual de
              deprisa que B y está a $2L$ de D. BC es otra cosa: sus dos
              extremos van a la misma velocidad y en la misma dirección, así que
              no gira.
          - texto: No se puede saber sin $\alpha_1$
            mensaje: |
              Las velocidades de un instante solo dependen de la posición y de
              $\omega_1$. La aceleración angular entra en las aceleraciones, en
              el apartado b.

      - tipo: calcular
        titulo: La velocidad angular de CD
        pregunta: |
          ¿Cuánto vale la velocidad angular de CD, en unidades de $\omega_1$?
          (Es horaria, como la de AB.)
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.001
          formato: un número, en unidades de ω₁; vale la forma exacta, como 1/2
        distractores:
          - valor: '1'
            mensaje: |
              Has tomado CD de longitud L. La cota de la derecha son dos tramos
              de L, de D a la altura de B y de ahí a C: CD mide $2L$, y con la
              misma velocidad en C gira la mitad de deprisa que AB.
          - valor: '0.7071'
            mensaje: |
              Has dividido la velocidad de C entre BC, que mide $\sqrt{2}L$. La
              velocidad angular de CD es la de C entre la distancia de C a D,
              $2L$.
          - valor: '0.3536'
            mensaje: |
              Has proyectado $\vec{v}_B$ sobre BC y lo has tomado como la
              velocidad de C. La equiproyectividad iguala las **proyecciones**:
              $v_C\cos 45° = v_B\cos 45°$, así que $v_C = v_B$.
        pista: |
          B y C tienen la misma velocidad, $\omega_1 L$ hacia la derecha, y C
          gira alrededor de D a una distancia $2L$.
        desarrollo: |
          $$
          v_C = v_B = \omega_1 L
          \quad\Longrightarrow\quad
          \omega_{CD} = \frac{v_C}{DC} = \frac{\omega_1 L}{2L} = \frac{\omega_1}{2}
          $$

          en sentido horario.

      - tipo: calcular
        titulo: La aceleración angular de BC
        pregunta: |
          BC no gira en este instante, pero puede empezar a girar. ¿Cuánto vale
          su aceleración angular, en unidades de $\omega_1^{2}$? (Es
          antihoraria.)
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.001
          formato: un número, en unidades de ω₁²; vale la forma exacta, como 1/2
        distractores:
          - valor: '0'
            mensaje: |
              Que $\omega_{BC}$ sea nula en un instante no dice nada de su
              derivada, igual que una pelota lanzada hacia arriba tiene
              velocidad nula arriba del todo y sigue acelerando. La normal de C
              es la mitad que la de B, y esa diferencia la absorbe un giro de BC
              que empieza.
          - valor: '1'
            mensaje: |
              Te has dejado la aceleración normal de C. C gira alrededor de D,
              así que tiene $\omega_{CD}^{2}\cdot 2L = \omega_1^{2}L/2$ hacia D,
              hacia abajo, y eso entra en la componente vertical.
          - valor: '1.5'
            mensaje: |
              Has puesto la aceleración normal de B hacia arriba. La normal
              apunta siempre hacia el centro de giro, y el de B es A, que está
              debajo: $-\omega_1^{2}L$ en vertical.
        pista: |
          $\vec{a}_C = \vec{a}_B + \vec{\alpha}_{BC}\times\overrightarrow{BC}$,
          sin término normal porque $\omega_{BC} = 0$. Mira la componente
          vertical: la de C es su normal, $\omega_{CD}^{2}\cdot 2L$ hacia D.
        desarrollo: |
          Con antihorario positivo, $\vec{a}_B = (\alpha_1 L,\ -\omega_1^{2}L)$ y
          $\vec{\alpha}_{BC}\times\overrightarrow{BC} = \alpha_{BC}\,(-L,\ L)$.
          En vertical:

          $$
          -\omega_{CD}^{2}\cdot 2L = -\frac{\omega_1^{2}L}{2} = -\omega_1^{2}L + \alpha_{BC}L
          \quad\Longrightarrow\quad
          \alpha_{BC} = \frac{\omega_1^{2}}{2}
          $$

          positiva, así que antihoraria. Fíjate en que no depende de $\alpha_1$.

      - tipo: calcular
        titulo: La aceleración angular de CD
        pregunta: |
          Comprobación con valores nuestros, que valen también para los pasos
          que siguen: $\omega_1 = 2$ rad/s y $\alpha_1 = 6$ rad/s², los dos
          horarios como en la figura, y $L = 1$ m. ¿Cuánto vale la aceleración
          angular de CD, en valor absoluto? (Es horaria.)
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número, en rad/s²
        distractores:
          - valor: '3'
            mensaje: |
              Es $\alpha_1/2$: has tomado $\alpha_{BC} = 0$ porque BC no gira.
              Su aceleración angular, $\omega_1^{2}/2 = 2$ rad/s², le quita a C
              parte de la aceleración horizontal de B.
          - valor: '1'
            mensaje: |
              Has usado $\alpha_{BC} = \omega_1^{2}$, que es lo que sale sin la
              aceleración normal de C. Con ella, $\alpha_{BC} = \omega_1^{2}/2$.
          - valor: '4'
            mensaje: |
              Has sumado el término de $\alpha_{BC}$ en vez de restarlo. Un giro
              antihorario de BC mueve C hacia la izquierda respecto de B:
              $\vec{\alpha}_{BC}\times\overrightarrow{BC} = \alpha_{BC}(-L,\ L)$.
        pista: |
          La componente horizontal: $a_{Cx} = \alpha_1 L - \alpha_{BC}L$, y para C,
          que gira alrededor de D, $a_{Cx} = 2L\,\alpha_{CD}$ con $\alpha_{CD}$
          horaria.
        desarrollo: |
          $$
          \alpha_{CD} = \frac{\alpha_1 - \alpha_{BC}}{2} = \frac{\alpha_1}{2} - \frac{\omega_1^{2}}{4}
          = 3 - 1 = 2\ \text{rad/s}^{2}
          $$

          horaria. Con $\alpha_1 < \omega_1^{2}/2$ saldría antihoraria: el
          sentido no se sabe sin mirar los números.

      - tipo: calcular
        titulo: La reacción estática en C
        pregunta: |
          Las reacciones estáticas son las que habría con el mecanismo quieto en
          esta posición, cargado solo con el peso de BC. ¿Cuánto vale la de C,
          en unidades de $mg$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.001
          formato: un número, en unidades de mg; vale la forma exacta, como 1/2
        distractores:
          - valor: '1'
            mensaje: |
              Has cargado todo el peso en C. El centro de BC está a medio
              camino entre B y C en horizontal, así que el peso se reparte a
              medias.
          - valor: '0.3536'
            mensaje: |
              Has usado la longitud de BC, $\sqrt{2}L$, como brazo de la fuerza
              en C. El brazo de una fuerza vertical respecto de B es la
              distancia **horizontal**, L; el del peso, $L/2$.
          - valor: '0'
            mensaje: |
              Estáticas no quiere decir nulas: son las que sostienen el peso de
              BC cuando nada se mueve. Las que aparecen solo por el movimiento
              son las dinámicas.
        pista: |
          CD no tiene masa ni cargas: la fuerza en C va a lo largo de CD,
          vertical. Momentos de BC respecto de B.
        desarrollo: |
          $$
          C\cdot L = mg\,\frac{L}{2}
          \quad\Longrightarrow\quad
          C = \frac{mg}{2}
          $$

          hacia arriba sobre BC. En B queda la otra mitad, vertical, y el par
          estático es nulo: AB y CD, verticales, llevan el peso sin momento
          respecto de A ni de D.

      - tipo: calcular
        titulo: La reacción dinámica horizontal en B
        pregunta: |
          Las dinámicas son las que añade el movimiento. Con los valores de
          antes y $m = 6$ kg, ¿cuánto vale la componente horizontal de la
          reacción dinámica en B? (Sobre BC empuja hacia la derecha.)
        respuesta:
          tipo: magnitud
          valor: '30 N'
          tolerancia: 0.01
          formato: con su unidad, en N
        distractores:
          - valor: '36 N'
            mensaje: |
              Has usado la aceleración de B, $\alpha_1 L = 6$ m/s², en vez de la
              del centro de BC. G está a medio camino de C, que acelera menos
              en horizontal: $a_{Gx} = 5$ m/s².
          - valor: '24 N'
            mensaje: |
              Has calculado $\vec{a}_G$ con $\alpha_{BC} = \omega_1^{2}$, la que
              sale sin la aceleración normal de C. Con $\alpha_{BC} = 2$ rad/s²,
              $a_{Gx} = 6 - 1 = 5$ m/s².
        pista: |
          En C la fuerza es vertical, así que en horizontal solo está B:
          $B_x = m\,a_{Gx}$, con
          $\vec{a}_G = \vec{a}_B + \vec{\alpha}_{BC}\times\overrightarrow{BG}$.
        desarrollo: |
          $$
          a_{Gx} = \alpha_1 L - \alpha_{BC}\,\frac{L}{2} = 6 - 1 = 5\ \text{m/s}^{2},
          \qquad
          B_x = m\,a_{Gx} = 6\cdot 5 = 30\ \text{N}
          $$

      - tipo: calcular
        titulo: La reacción dinámica vertical en C
        pregunta: |
          ¿Y la parte dinámica de la reacción vertical en C, en valor absoluto?
          (Sobre BC tira hacia abajo.)
        respuesta:
          tipo: magnitud
          valor: '22 N'
          tolerancia: 0.01
          formato: con su unidad, en N
        distractores:
          - valor: '24 N'
            mensaje: |
              Te has dejado el término $I_G\,\alpha_{BC}$ en la ecuación de
              momentos. BC no gira, pero acelera su giro, y eso pide 2 N·m.
          - valor: '2 N'
            mensaje: |
              Has tomado momentos en B con solo $I_G\,\alpha_{BC}$ en el segundo
              miembro. B no es ni G ni un punto fijo: falta el momento de
              $m\,\vec{a}_G$ respecto de B, que vale $-24$ N·m.
          - valor: '23 N'
            mensaje: |
              Has calculado $I_G$ con la longitud L. BC mide $\sqrt{2}L$, así
              que $I_G = m(\sqrt{2}L)^{2}/12 = mL^{2}/6$, el doble.
        pista: |
          Momentos respecto de B:
          $C_y L = I_G\,\alpha_{BC} + \left(\overrightarrow{BG}\times m\vec{a}_G\right)_z$,
          con $I_G = m(\sqrt{2}L)^{2}/12 = mL^{2}/6$ y $\vec{a}_G = (5,\ -3)$ m/s².
        desarrollo: |
          Con $\overrightarrow{BG} = (0{,}5;\ 0{,}5)$ m y $m\vec{a}_G = (30;\ -18)$ N:

          $$
          C_y\cdot 1 = 1\cdot 2 + \left(0{,}5\cdot(-18) - 0{,}5\cdot 30\right) = 2 - 24 = -22\ \text{N}
          $$

          Hacia abajo sobre BC: la parte dinámica le quita a C casi todo lo que
          le daba el peso.

      - tipo: calcular
        titulo: La reacción dinámica vertical en B
        pregunta: |
          ¿Y la parte dinámica de la vertical en B, en valor absoluto? (Sobre BC
          empuja hacia arriba.)
        respuesta:
          tipo: magnitud
          valor: '4 N'
          tolerancia: 0.01
          formato: con su unidad, en N
        distractores:
          - valor: '6 N'
            mensaje: |
              Es lo que sale sin el término $I_G\,\alpha_{BC}$, con 24 N en C.
              Con él, C tira 22 N hacia abajo y B se queda con 4.
          - valor: '20 N'
            mensaje: |
              Sale de haber tomado momentos en B sin el momento de
              $m\,\vec{a}_G$, con 2 N hacia arriba en C. Arregla antes la
              reacción en C.
          - valor: '9 N'
            mensaje: |
              Has repartido la inercia vertical, $m\,a_{Gy} = -18$ N, a partes
              iguales entre B y C, como el peso. El peso se reparte a medias
              porque nada más da momento respecto de G. Aquí sí: los 30 N
              horizontales de B no están a la altura de G, y BC acelera su
              giro. La ecuación de momentos descompensa el reparto.
        pista: |
          Vertical de BC: $B_y + C_y = m\,a_{Gy}$, con $a_{Gy} = -3$ m/s².
        desarrollo: |
          $$
          B_y = m\,a_{Gy} - C_y = -18 + 22 = 4\ \text{N}
          $$

      - tipo: calcular
        titulo: El par que exigen esos datos
        pregunta: |
          El enunciado da $M_0$ como dato, pero AB no tiene masa: su equilibrio
          de momentos respecto de A lo ata a todo lo demás. Con los valores de
          antes, ¿cuánto tiene que valer $M_0$ para que el instante sea ese?
          (Es horario.)
        respuesta:
          tipo: magnitud
          valor: '30 N*m'
          tolerancia: 0.01
          formato: con su unidad, en N·m
        distractores:
          - valor: '0 N*m'
            mensaje: |
              Que AB no tenga masa no quiere decir que no haga falta par: AB
              tiene que empujar a BC, que sí la tiene. Sin masa, AB está en
              equilibrio y su par equilibra el momento de esa fuerza respecto
              de A.
          - valor: '36 N*m'
            mensaje: |
              Sale de la $B_x$ de 36 N, calculada con la aceleración de B en vez
              de la del centro de BC. Con $a_{Gx} = 5$ m/s², $B_x = 30$ N.
        pista: |
          Sobre AB actúan el par, la reacción en A y la fuerza que le hace BC en
          B, $-B_x$ en horizontal, a una altura L sobre A.
        desarrollo: |
          $$
          M_0 = L\,B_x = mL^{2}\left(\alpha_1 - \frac{\omega_1^{2}}{4}\right)
          = 1\cdot 30 = 30\ \text{N·m}
          $$

          Es decir: $\omega_1$, $\alpha_1$ y $M_0$ no son tres datos
          independientes. Dados dos, el tercero sale.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              AB y CD son verticales: B y C se mueven en horizontal, BC se
              traslada ($\omega_{BC} = 0$) y $\omega_{CD} = \omega_1/2$, horaria.
          - texto: >-
              La normal de C, $\omega_{CD}^{2}\cdot 2L = \omega_1^{2}L/2$, es la
              mitad de la de B, y esa diferencia da
              $\alpha_{BC} = \omega_1^{2}/2$, antihoraria.
          - texto: >-
              La componente horizontal da
              $\alpha_{CD} = \alpha_1/2 - \omega_1^{2}/4$, horaria si sale
              positiva.
          - texto: >-
              CD es una biela: la fuerza en C es vertical. Sin movimiento, el
              peso de BC se reparte a medias: $mg/2$ en B y en C.
          - texto: >-
              Las tres ecuaciones de BC, con $\vec{a}_G$ e $I_G = mL^{2}/6$, dan
              las dinámicas, y el equilibrio de AB da $M_0 = L\,B_x$.
          - texto: >-
              Como $\omega_{BC} = 0$, también $\alpha_{BC} = 0$, y BC se traslada
              con la aceleración de B.
            trampa: true
            mensaje: |
              Una velocidad angular nula en un instante no dice nada de su
              derivada. La normal de C es la mitad que la de B, y esa diferencia
              vertical entre los extremos solo la puede absorber un giro de BC
              que empieza: $\alpha_{BC} = \omega_1^{2}/2$. Con $\alpha_{BC} = 0$
              salen mal $\alpha_{CD}$, $\vec{a}_G$ y todas las reacciones
              dinámicas.
    resolucion: |
      **La geometría.** Con A en el origen y el eje x hacia D: $B = (0,\ L)$,
      $C = (L,\ 2L)$ y $D = (L,\ 0)$. AB mide L y es vertical, CD mide $2L$ y
      también es vertical, y BC va a 45° y mide $\sqrt{2}\,L$. Sentido
      antihorario positivo; $\omega_1$ y $\alpha_1$ son horarios, como en la
      figura.

      **a) Velocidades.** B gira alrededor de A: $\vec{v}_B = \omega_1 L$ hacia
      la derecha. C gira alrededor de D, así que $\vec{v}_C$ es perpendicular a
      CD: también horizontal. En BC,
      $\vec{v}_C - \vec{v}_B = \vec{\omega}_{BC}\times\overrightarrow{BC}$, y con
      BC a 45° ese término solo es horizontal si $\omega_{BC}$ es nula: el
      centro instantáneo de BC, en el cruce de AB y CD, que son paralelas, está
      en el infinito. BC se traslada:

      $$
      \omega_{BC} = 0,
      \qquad
      v_C = v_B = \omega_1 L,
      \qquad
      \omega_{CD} = \frac{v_C}{2L} = \frac{\omega_1}{2}\ \text{(horaria)}
      $$

      **b) Aceleraciones.** Con $\omega_{BC} = 0$ la ecuación de BC no tiene
      término normal:

      $$
      \vec{a}_C = \vec{a}_B + \vec{\alpha}_{BC}\times\overrightarrow{BC}
      $$

      con $\vec{a}_B = (\alpha_1 L,\ -\omega_1^{2}L)$ —la tangencial hacia la
      derecha y la normal hacia A— y, para C, que gira alrededor de D,
      $\vec{a}_C = (2L\,\alpha_{CD},\ -\omega_{CD}^{2}\,2L)$ con $\alpha_{CD}$
      horaria. Como $\vec{\alpha}_{BC}\times\overrightarrow{BC} = \alpha_{BC}\,(-L,\ L)$,
      componente a componente:

      $$
      -\frac{\omega_1^{2}L}{2} = -\omega_1^{2}L + \alpha_{BC}L
      \quad\Longrightarrow\quad
      \alpha_{BC} = \frac{\omega_1^{2}}{2}\ \text{(antihoraria)}
      $$

      $$
      2L\,\alpha_{CD} = \alpha_1 L - \alpha_{BC}L
      \quad\Longrightarrow\quad
      \alpha_{CD} = \frac{\alpha_1}{2} - \frac{\omega_1^{2}}{4}\ \text{(horaria si sale positiva)}
      $$

      BC no gira en este instante, pero su aceleración angular no es nula: la
      normal de C es la mitad que la de B, y esa diferencia vertical entre los
      dos extremos solo la puede absorber un giro que empieza.

      **c) Las reacciones.** CD no tiene masa ni cargas en su longitud: es una
      biela, y la fuerza en C va según CD, **vertical**. AB tampoco tiene masa,
      pero lleva el par: no es una biela, y su equilibrio de momentos respecto
      de A da $M_0 = L\,B_x$, con $B_x$ la componente horizontal de la fuerza en
      B. Toda la dinámica está en BC, con $I_G = m(\sqrt{2}L)^{2}/12 = mL^{2}/6$
      y la aceleración de su centro:

      $$
      \vec{a}_G = \vec{a}_B + \vec{\alpha}_{BC}\times\overrightarrow{BG}
      = \left(\alpha_1 L - \frac{\omega_1^{2}L}{4},\ -\frac{3\,\omega_1^{2}L}{4}\right)
      $$

      Con las fuerzas **sobre BC** —$(B_x,\ B_y)$ en B y $C_y$ en C—, las tres
      ecuaciones del movimiento plano, la de momentos respecto de G:

      $$
      B_x = m\,a_{Gx},
      \qquad
      B_y + C_y - mg = m\,a_{Gy},
      \qquad
      \frac{L}{2}\left(B_x - B_y + C_y\right) = I_G\,\alpha_{BC}
      $$

      **Las estáticas** son las de $\omega_1 = \alpha_1 = 0$: $B_x = 0$ y
      $B_y = C_y = mg/2$, las dos hacia arriba. El par estático es nulo: AB y
      CD, verticales, llevan el peso sin momento.

      **Las dinámicas** son lo que añade el movimiento:

      $$
      B_x = mL\left(\alpha_1 - \frac{\omega_1^{2}}{4}\right),
      \qquad
      B_y = mL\left(\frac{\alpha_1}{2} - \frac{7\,\omega_1^{2}}{12}\right),
      \qquad
      C_y = -mL\left(\frac{\alpha_1}{2} + \frac{\omega_1^{2}}{6}\right)
      $$

      Sobre AB y sobre CD actúan las mismas fuerzas cambiadas de signo.

      **El par, que no es un dato libre.** El equilibrio de AB da
      $M_0 = L\,B_x = mL^{2}\left(\alpha_1 - \omega_1^{2}/4\right)$. El enunciado
      da los tres, $\omega_1$, $\alpha_1$ y $M_0$, y solo son compatibles si
      cumplen esa relación: dados $\omega_1$ y $M_0$, la aceleración $\alpha_1$
      ya no es libre. Por eso las reacciones se han escrito con $\omega_1$ y
      $\alpha_1$; $B_x$ también se puede escribir como $M_0/L$.

      **Con valores nuestros.** Con $\omega_1 = 2$ rad/s, $\alpha_1 = 6$ rad/s²,
      $L = 1$ m, $m = 6$ kg y $g = 9{,}81$ m/s²: $\omega_{CD} = 1$ rad/s,
      $\alpha_{BC} = 2$ rad/s² antihoraria, $\alpha_{CD} = 2$ rad/s² horaria y
      $\vec{a}_G = (5,\ -3)$ m/s². Las estáticas,
      $6\cdot 9{,}81/2 = 29{,}43$ N en B y en C; las dinámicas, $B_x = 30$ N,
      $B_y = 4$ N y $C_y = -22$ N. En total, sobre BC: en B, 30 N hacia la
      derecha y $29{,}43 + 4 = 33{,}43$ N hacia arriba; en C,
      $29{,}43 - 22 = 7{,}43$ N hacia arriba. Y el par, $M_0 = 30$ N·m,
      horario.

      **Comprobación independiente.** Resolviendo la posición del mecanismo
      para cada ángulo de AB y derivando numéricamente los ángulos de BC y de
      CD salen las mismas velocidades y aceleraciones angulares. Y planteando
      las nueve ecuaciones de las tres barras como un sistema lineal —con las
      reacciones en A y en D y el par como incógnitas, sin dar por hecho que CD
      sea una biela— salen las mismas reacciones, el mismo par y, en C, una
      componente horizontal nula.

  # ── Ejercicio 2 (n 4) · dos barras de masa m y longitud L, A fija, C en una
  #    deslizadera de pista vertical; parte del reposo con AB vertical y BC
  #    horizontal, y un par constante la lleva hasta que A y C están a la
  #    misma altura. Teorema de la energía.
  - id: exma1819-2cext-4-las-dos-barras-y-la-deslizadera
    titulo: Las dos barras con deslizadera, y el par que les da una velocidad dada
    fuente: >-
      Ejercicio 2 · Convocatoria extraordinaria de junio de 2019, Dinámica ·
      Mecánica Aplicada, Escuela de Ingeniería de Gipuzkoa (UPV/EHU).
      Transcrito de la columna en castellano; la figura está redibujada. El
      texto no dice que A sea una articulación fija, ni que se parta de la
      posición dibujada, ni sobre qué barra actúa el par: las tres cosas se
      leen en la figura. La pista es vertical, así que se cuenta el peso de las
      dos barras, y se toma sin rozamiento. El examen no publica resolución; el
      desarrollo es nuestro.
    nivel: examen
    enunciado: |
      **2. (3,5 puntos)** Sobre el sistema que parte del reposo se aplica un par
      $M_0$ constante. Dicho sistema está compuesto por dos barras de masa $m$ y
      longitud $L$ articuladas entre sí. En C, la barra BC está articulada a una
      deslizadera que recorre una pista vertical.

      Calcular el par $M_0$ en función del resto de datos si cuando A y C están
      a la misma altura, la velocidad angular de la barra AB es $\omega$
      conocida.

      <figure class="figura-examen">
      <svg viewBox="0 0 290 290" role="img" width="290" height="290"
           aria-labelledby="ma18192cx4t ma18192cx4d">
