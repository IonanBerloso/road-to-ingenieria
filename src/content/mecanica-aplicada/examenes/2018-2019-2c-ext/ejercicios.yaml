      **Lectura.** La tangencial mide cómo cambia el **módulo** de la velocidad,
      y la normal cómo cambia su **dirección**. En una trayectoria recta la
      normal es nula, porque $\rho$ es infinito; en una curva recorrida a
      celeridad constante la tangencial es nula y la normal no. La deducción se
      ha hecho en el plano, y vale igual en el espacio, con $\vec{e}_n$ según la
      normal principal, la que apunta al centro de curvatura.

      **Comprobación con números.** Sobre una circunferencia de 2 m de radio con
      $s = t^{3}$, en $t = 1$ s: $v = 3$ m/s, $a_t = 6$ m/s² y
      $a_n = 3^{2}/2 = 4{,}5$ m/s², con un módulo de
      $\sqrt{6^{2} + 4{,}5^{2}} = 7{,}5$ m/s².

      **Comprobación independiente.** Escribiendo la posición en cartesianas,
      $x = 2\cos(t^{3}/2)$ e $y = 2\sin(t^{3}/2)$, derivándola dos veces y
      proyectando la aceleración sobre la velocidad y sobre su perpendicular,
      salen los mismos 6 y 4,5 m/s².

  # ── Cuestión 2 de teoría (n 2) · la energía cinética de un sólido rígido en
  #    el caso general. Deducción; las cuentas de comprobación usan una varilla
  #    nuestra, dicha en la pregunta, en unos ejes que no son principales.
  - id: exma1819-2cext-2-la-energia-cinetica-de-un-solido-rigido
    titulo: La energía cinética de un sólido rígido en el caso general
    fuente: >-
      Cuestión 2 de teoría · Convocatoria extraordinaria de junio de 2019,
      Dinámica · Mecánica Aplicada, Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU). Transcrita de la columna en castellano, que en el PDF va como
      imagen. El examen no publica resolución; la rúbrica y la comprobación
      son nuestras.
    nivel: examen
    enunciado: |
      **2. (1,5 puntos)** Obtener de forma razonada la energía cinética para un
      sólido rígido (caso general).
    pide: >-
      La expresión de la energía cinética de un sólido rígido con un movimiento
      cualquiera, deducida: la del centro de gravedad más la de rotación, con
      el tensor de inercia.
    pasos:
      - tipo: reconocer
        pregunta: |
          Se parte la velocidad de cada punto en la del centro de gravedad más la
          relativa a él, $\vec{v}_i = \vec{v}_G + \vec{v}_{ir}$. Al elevar al
          cuadrado aparece un término cruzado,
          $\vec{v}_G\cdot\sum m_i\,\vec{v}_{ir}$. ¿Por qué se anula?
        opciones:
          - texto: >-
              Porque $\sum m_i\,\vec{r}'_i = \vec{0}$ por definición de centro
              de gravedad, y al derivar, $\sum m_i\,\vec{v}_{ir} = \vec{0}$
            correcta: true
            mensaje: |
              Eso es. Medidas desde G, las posiciones de las masas se compensan
              —es lo que define a G—, y al derivar se compensan también sus
              velocidades relativas. Vale para cualquier sistema de partículas,
              rígido o no: es el teorema de König.
          - texto: >-
              Porque la velocidad relativa de cada punto es perpendicular a
              $\vec{v}_G$
            mensaje: |
              No en general: un punto que gira alrededor de G tiene velocidad
              relativa en cualquier dirección respecto de $\vec{v}_G$. Lo que se
              anula no es cada producto, sino la **suma** de las
              $m_i\,\vec{v}_{ir}$.
          - texto: >-
              Porque el sólido es rígido y las distancias entre sus puntos no
              cambian
            mensaje: |
              La rigidez se usa después, para escribir
              $\vec{v}_{ir} = \vec{\omega}\times\vec{r}'_i$. El término cruzado
              se anula en cualquier sistema de partículas, deformable o no,
              porque G es su centro de masas.

      - tipo: redactar
        consigna: |
          La cuestión en papel: de la energía de un sistema de partículas a la
          del sólido, con el teorema de König, el campo de velocidades del
          sólido y las integrales que dan el tensor de inercia. Termina en la
          forma general y en sus casos particulares. Una cara.
        rubrica:
          - punto: |
              **König.** Con $\vec{v}_i = \vec{v}_G + \vec{v}_{ir}$,
              $T = \tfrac12 M v_G^{2} + \vec{v}_G\cdot\sum m_i\vec{v}_{ir} + \tfrac12\sum m_i v_{ir}^{2}$,
              y el término del medio es nulo porque $\sum m_i\vec{r}'_i = \vec{0}$.
            porque: |
              Es la mitad de la cuestión. Hay que decir **por qué** se anula el
              término cruzado —G es el centro de masas—; escribir directamente
              la suma de las dos energías es recitar.
          - punto: |
              **El sólido.** La suma pasa a integral y la velocidad relativa es
              la de un giro alrededor de G, $\vec{v}_r = \vec{\omega}\times\vec{r}'$,
              así que $T_r = \tfrac12\int_V \left(\vec{\omega}\times\vec{r}'\right)^{2}\rho\,dV$.
            porque: |
              Aquí entra la rigidez, y solo aquí. Es lo que convierte una suma
              sobre partículas en algo que depende de un solo vector,
              $\vec{\omega}$.
          - punto: |
              **Desarrollar el cuadrado.** Con $\vec{r}' = (x',\,y',\,z')$, en
              $\left(\vec{\omega}\times\vec{r}'\right)^{2}$ salen
              $\omega_x^{2}(y'^{2} + z'^{2})$ y sus dos parejas, y los términos
              cruzados $-2\omega_x\omega_y\,x'y'$, $-2\omega_y\omega_z\,y'z'$ y
              $-2\omega_z\omega_x\,z'x'$.
            porque: |
              Es la cuenta que hace aparecer los momentos y los productos de
              inercia. Los términos cruzados son los que se olvidan, y son los
              que distinguen el caso general del de ejes principales.
          - punto: |
              **Identificar las integrales.**
              $T_r = \tfrac12\left(I_{Gx}\omega_x^{2} + I_{Gy}\omega_y^{2} + I_{Gz}\omega_z^{2} - 2I_{Gxy}\omega_x\omega_y - 2I_{Gyz}\omega_y\omega_z - 2I_{Gzx}\omega_z\omega_x\right)$,
              que es $\tfrac12\{\omega\}^{T}[I_G]\{\omega\} = \tfrac12\,\vec{H}_G\cdot\vec{\omega}$.
            porque: |
              Es el resultado del caso general, y la forma con el tensor es la
              que se recuerda. Decir que es $\tfrac12\,\vec{H}_G\cdot\vec{\omega}$
              enlaza con el momento angular del mismo tema.
          - punto: |
              **El total y los casos particulares.**
              $T = \tfrac12 M v_G^{2} + \tfrac12\{\omega\}^{T}[I_G]\{\omega\}$;
              en ejes principales se van los productos de inercia, y con un
              punto fijo O, $T = \tfrac12\{\omega\}^{T}[I_O]\{\omega\}$.
            porque: |
              El enunciado pide el caso general, pero los particulares son los
              que se usan en los problemas. Nombrarlos demuestra que se sabe
              cuándo se simplifica y cuándo no.

      - tipo: calcular
        titulo: La energía de rotación
        pregunta: |
          Comprobación con valores nuestros: una varilla delgada de 3 kg y 2 m,
          centrada en G y tendida en el plano xy a 45° entre los ejes x e y,
          tiene $I_{Gx} = I_{Gy} = 0{,}5$ kg·m², $I_{Gz} = 1$ kg·m² e
          $I_{Gxy} = 0{,}5$ kg·m². Si gira con $\vec{\omega} = (3,\,1,\,0)$ rad/s,
          ¿cuánto vale su energía cinética de rotación alrededor de G?
        respuesta:
          tipo: magnitud
          valor: '1 J'
          tolerancia: 0.01
          formato: con su unidad, en J
        distractores:
          - valor: '2.5 J'
            mensaje: |
              Te has dejado el término del producto de inercia,
              $-2I_{Gxy}\,\omega_x\omega_y$, que resta 3. En unos ejes que no son
              principales ese término está, y aquí es el más grande.
          - valor: '4 J'
            mensaje: |
              Has sumado el término del producto de inercia en vez de restarlo.
              En la forma general va con signo menos, igual que en el tensor,
              donde los productos aparecen cambiados de signo.
          - valor: '5 J'
            mensaje: |
              Es $\tfrac12 I_{Gz}\,\omega^{2}$: la fórmula del giro plano, con el
              momento de inercia de un eje que no es el del giro. $\vec{\omega}$
              no va según z, así que hace falta el tensor entero.
        pista: |
          $T_r = \tfrac12\left(I_{Gx}\omega_x^{2} + I_{Gy}\omega_y^{2} + I_{Gz}\omega_z^{2} - 2I_{Gxy}\omega_x\omega_y\right)$,
          con $\omega_z = 0$.
        desarrollo: |
          $$
          T_r = \frac{1}{2}\left(0{,}5\cdot 3^{2} + 0{,}5\cdot 1^{2} - 2\cdot 0{,}5\cdot 3\cdot 1\right) = 1\ \text{J}
          $$

          Tiene sentido: la parte de $\vec{\omega}$ a lo largo de la varilla no
          mueve ninguna masa, y solo cuenta la perpendicular, con
          $\omega_\perp^{2} = 10 - 8 = 2$ (rad/s)² y
          $\tfrac12\cdot 1\cdot 2 = 1$ J.

      - tipo: calcular
        titulo: La energía cinética total
        pregunta: |
          Si además su centro de gravedad avanza a 2 m/s, ¿cuánto vale su
          energía cinética total?
        respuesta:
          tipo: magnitud
          valor: '7 J'
          tolerancia: 0.01
          formato: con su unidad, en J
        distractores:
          - valor: '6 J'
            mensaje: |
              Eso es solo la energía de traslación, $\tfrac12 M v_G^{2}$. La
              varilla también gira alrededor de G, y esa energía se suma: es el
              teorema de König.
          - valor: '8.5 J'
            mensaje: |
              Has sumado a la traslación la rotación sin el producto de inercia,
              2,5 J. En estos ejes la varilla no está en una dirección principal
              y el producto cuenta.
          - valor: '13 J'
            mensaje: |
              Has tomado la traslación como $M v_G^{2}$, sin el medio: 12 J. Las
              dos energías llevan su $\tfrac12$.
        pista: |
          $T = \tfrac12 M v_G^{2} + T_r$.
        desarrollo: |
          $$
          T = \frac{1}{2}\cdot 3\cdot 2^{2} + 1 = 7\ \text{J}
          $$

      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              Se parte $\vec{v}_i = \vec{v}_G + \vec{v}_{ir}$, y el término
              cruzado se anula porque $\sum m_i\vec{r}'_i = \vec{0}$:
              $T = \tfrac12 M v_G^{2} + \tfrac12\sum m_i v_{ir}^{2}$.
          - texto: >-
              En el sólido rígido, $\vec{v}_r = \vec{\omega}\times\vec{r}'$ y la
              suma pasa a integral sobre el volumen.
          - texto: >-
              Desarrollando $\left(\vec{\omega}\times\vec{r}'\right)^{2}$
              aparecen los momentos y los productos de inercia respecto de G.
          - texto: >-
              Queda $T = \tfrac12 M v_G^{2} + \tfrac12\{\omega\}^{T}[I_G]\{\omega\}$,
              que en ejes principales pierde los productos de inercia.
          - texto: >-
              La energía de rotación es siempre $\tfrac12 I\omega^{2}$, con I el
              momento de inercia respecto del eje z.
            trampa: true
            mensaje: |
              Eso solo vale si $\vec{\omega}$ va según un eje principal, como en
              el movimiento plano de un cuerpo con plano de simetría. En el caso
              general $\vec{\omega}$ tiene tres componentes y la energía lleva el
              tensor entero, productos de inercia incluidos.
    resolucion: |
      **La energía de un sistema de partículas.** Para N partículas,
      $T = \tfrac12\sum m_i v_i^{2}$. Con G el centro de gravedad y
      $\vec{r}'_i$ la posición de cada partícula respecto de G, la velocidad se
      parte en la de G más la relativa, $\vec{v}_i = \vec{v}_G + \vec{v}_{ir}$,
      con $\vec{v}_{ir} = \dot{\vec{r}}'_i$:

      $$
      T = \frac12\sum m_i\left(\vec{v}_G + \vec{v}_{ir}\right)^{2}
      = \frac12 M v_G^{2} + \vec{v}_G\cdot\sum m_i\,\vec{v}_{ir} + \frac12\sum m_i v_{ir}^{2}
      $$

      El término del medio es nulo: por definición de centro de gravedad,
      $\sum m_i\vec{r}'_i = \vec{0}$, y derivando, $\sum m_i\vec{v}_{ir} = \vec{0}$.
      Queda el **teorema de König**:

      $$
      T = \frac12 M v_G^{2} + T_r,
      \qquad
      T_r = \frac12\sum m_i v_{ir}^{2}
      $$

      la energía de toda la masa concentrada en G más la del movimiento relativo
      a G.

      **El sólido rígido.** La suma pasa a integral sobre el volumen, y como el
      sólido es rígido, el movimiento relativo a G es un giro:
      $\vec{v}_r = \vec{\omega}\times\vec{r}'$. Con $\vec{r}' = (x',\,y',\,z')$,

      $$
      \vec{\omega}\times\vec{r}' = \left(\omega_y z' - \omega_z y'\right)\vec{I} + \left(\omega_z x' - \omega_x z'\right)\vec{J} + \left(\omega_x y' - \omega_y x'\right)\vec{K}
      $$

      y su cuadrado es

      $$
      v_r^{2} = \omega_x^{2}\left(y'^{2} + z'^{2}\right) + \omega_y^{2}\left(x'^{2} + z'^{2}\right) + \omega_z^{2}\left(x'^{2} + y'^{2}\right) - 2\omega_x\omega_y\,x'y' - 2\omega_y\omega_z\,y'z' - 2\omega_z\omega_x\,z'x'
      $$

      **Las integrales son las de inercia.** Integrando con $dm = \rho\,dV$, y con
      $I_{Gx} = \int (y'^{2} + z'^{2})\,dm$, $I_{Gxy} = \int x'y'\,dm$ y las demás
      igual:

      $$
      T_r = \frac12\left(I_{Gx}\,\omega_x^{2} + I_{Gy}\,\omega_y^{2} + I_{Gz}\,\omega_z^{2} - 2I_{Gxy}\,\omega_x\omega_y - 2I_{Gyz}\,\omega_y\omega_z - 2I_{Gzx}\,\omega_z\omega_x\right)
      $$

      que es la forma cuadrática del tensor de inercia, y también la mitad del
      producto del momento angular por la velocidad angular:

      $$
      T_r = \frac12\,\{\omega\}^{T}[I_G]\{\omega\} = \frac12\,\vec{H}_G\cdot\vec{\omega}
      $$

      **El resultado.**

      $$
      T = \frac12 M v_G^{2} + \frac12\,\{\omega\}^{T}[I_G]\{\omega\}
      $$

      **Los casos particulares.** En los ejes principales de G los productos de
      inercia se anulan y
      $T_r = \tfrac12\left(I_{Gx}\omega_x^{2} + I_{Gy}\omega_y^{2} + I_{Gz}\omega_z^{2}\right)$.
      Si el sólido tiene un punto fijo O, la velocidad de cada punto es de giro
      alrededor de él, $\vec{v} = \vec{\omega}\times\vec{r}$, y la misma cuenta da
      $T = \tfrac12\{\omega\}^{T}[I_O]\{\omega\}$. Y en el movimiento plano de un
      cuerpo con plano de simetría, $T = \tfrac12 M v_G^{2} + \tfrac12 I_G\,\omega^{2}$.

      **Comprobación con números.** Para la varilla de 3 kg y 2 m a 45° entre x
      e y, con $\vec{\omega} = (3,\,1,\,0)$ rad/s,
      $T_r = \frac{1}{2}\left(4{,}5 + 0{,}5 - 3\right) = 1$ J, y con
      $v_G = 2$ m/s, $T = 6 + 1 = 7$ J. Sin el producto de inercia saldrían
      2,5 J de rotación: más del doble.

      **Comprobación independiente.** Partiendo la varilla en muchas masas
      iguales y sumando $\tfrac12 m_i v_i^{2}$ con
      $\vec{v}_i = \vec{v}_G + \vec{\omega}\times\vec{r}'_i$, sin tensor y sin
      König, salen los mismos 1 J de rotación y 7 J en total.

  # ── Ejercicio 1 (n 3) · el cuadrilátero articulado ABCD con AB y CD sin masa
  #    y BC de masa m. A y D a L en horizontal, AB vertical de L, C a 2L sobre
  #    D: BC va a 45° y mide √2·L. ω₁, α₁ y M₀ horarios, como en la figura.
  - id: exma1819-2cext-3-el-cuadrilatero-articulado-y-sus-reacciones
    titulo: El cuadrilátero articulado, sus giros y las reacciones en B y C
    fuente: >-
      Ejercicio 1 · Convocatoria extraordinaria de junio de 2019, Dinámica ·
      Mecánica Aplicada, Escuela de Ingeniería de Gipuzkoa (UPV/EHU).
      Transcrito de la columna en castellano, con su «Se conoce» en singular;
      la figura está redibujada a escala con sus cotas. ω₁, α₁ y M₀ van en
      sentido horario, como los dibuja la figura, y el mecanismo se toma en un
      plano vertical con el peso de BC hacia abajo, que es lo único que puede
      dar reacciones estáticas. El examen no publica resolución; el desarrollo
      es nuestro, y las comprobaciones usan valores nuestros.
    nivel: examen
    enunciado: |
      **1. (3,5 puntos)** En el sistema de la figura las barras AB (1) y CD (3)
      no tienen masa mientras que la barra BC (2) posee una masa $m$. Se conoce
      la velocidad angular $\omega_1$, la aceleración angular $\alpha_1$ y el
      par $M_0$ aplicado sobre la barra AB. Calcular:

      **a.** (1 punto) Velocidad angular de las barras BC y CD.

      **b.** (1 punto) Aceleración angular de las barras BC y CD.

      **c.** (1,5 puntos) Reacciones estáticas y dinámicas generadas en las
      articulaciones B y C.

