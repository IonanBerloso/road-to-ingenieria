asignatura: mecanica-aplicada
curso: '2018-2019'
convocatoria: extraordinaria-segundo-cuatrimestre
fecha: 26 de junio de 2019
# La extraordinaria de junio de 2019 de Mecánica Aplicada, **su parte de
# Dinámica** (el bloque 2; la cabecera dice solo «Dinámica»). Es un PDF de
# tres páginas: la de teoría y una por ejercicio. La parte del bloque 1 del
# mismo día, la Estática, es otro PDF y otra convocatoria de este sitio,
# `2018-2019-ext`.
#
# Bilingüe, con el castellano a la derecha **como imágenes de palabra**, igual
# que las otras convocatorias de 2018-2019: el volcado de texto solo saca la
# columna de euskera. Se transcribe solo la columna en castellano, mirando las
# páginas renderizadas, y nada se traduce del euskera (CLAUDE.md §17, «El
# volcado no es la página»). Las dos columnas traen las mismas cuestiones y
# los mismos apartados, así que no hay `fuera`.
#
# Cuatro cosas de ese texto, dichas antes de que nadie las deduzca:
#
# 1. **LOS PUNTOS SUMAN 10**: 1,5 + 1,5 en la teoría y 3,5 + 3,5 en los
#    ejercicios.
#
# 2. **LO QUE EL TEXTO DICE RARO O NO DICE, CONSERVADO**: la cuestión 1 no
#    lleva verbo —nombra el tema, «Componentes intrínsecas de la aceleración
#    de una partícula.»— y se resuelve como una deducción; el ejercicio 1
#    escribe «Se conoce» en singular con tres sujetos; el ejercicio 2 no dice
#    que A sea una articulación fija, ni que se parta de la posición dibujada,
#    ni sobre qué barra actúa el par: las tres cosas se leen en la figura.
#    Ninguno de los dos ejercicios nombra el peso. El 1 pide reacciones
#    «estáticas», que solo puede dar el peso de BC, y el 2 tiene una pista
#    vertical, así que en los dos se toma el mecanismo en un plano vertical y
#    se cuenta el peso. Las resoluciones lo dicen.
#
# 3. **EL EJERCICIO 1 DA UN DATO DE MÁS.** Con AB sin masa, su equilibrio de
#    momentos ata el par a la cinemática: M₀ = m·L²·(α₁ − ω₁²/4). Los tres
#    datos, ω₁, α₁ y M₀, solo son compatibles si cumplen esa relación. La
#    resolución lo dice en voz alta y lo convierte en un paso, en vez de
#    elegir en silencio cuál de los tres usar.
#
# 4. **DOS NUMERACIONES**, como en las otras de 2018-2019: la teoría son las
#    cuestiones 1 y 2 y los ejercicios vuelven a empezar en 1. Aquí las
#    cuestiones son **n 1 y 2** y los ejercicios **n 3 (Ejercicio 1) y n 4
#    (Ejercicio 2)**; la `fuente` de cada pieza dice el nombre impreso.
#
# Los cuatro enunciados son simbólicos, así que las comprobaciones de cada
# paso van en forma adimensional —«en unidades de mgL»— o con valores
# nuestros, que la propia pregunta declara.
#
# El examen no publica resolución ni resultados, y ninguno de sus dos
# ejercicios está en la colección de la asignatura: los desarrollos son
# nuestros, y cada respuesta se recalcula aparte, por otro camino, en
# `tests/verificacion/mecanica-1819-2c-ext.test.ts`.
pdf: 2018-2019-2c-ext.pdf

ejercicios:
  # Teoría · cuestión 1 · las componentes tangencial y normal de la
  # aceleración, deducidas. Va al tema 7, donde el curso las deduce (apuntes
  # del tema 7, apartado de cinemática de la partícula) y donde está el
  # ejercicio 7.1, que las usa.
  - id: exma1819-2cext-1-las-componentes-intrinsecas-de-la-aceleracion
    tema: t07-cinematica
    n: 1
  # Teoría · cuestión 2 · la energía cinética de un sólido rígido en el caso
  # general: König, el campo de velocidades y el tensor de inercia.
  - id: exma1819-2cext-2-la-energia-cinetica-de-un-solido-rigido
    tema: t10-dinamica-del-solido
    n: 2

  # Ejercicio 1 · el cuadrilátero articulado con AB y CD sin masa: velocidades
  # y aceleraciones angulares, y las reacciones en B y C. Va al tema 12 entero
  # —la cinemática es su primera mitad—, como el entramado de tres barras de
  # la colección (12.10), que tiene la misma estructura.
  - id: exma1819-2cext-3-el-cuadrilatero-articulado-y-sus-reacciones
    tema: t12-dinamica-plana
    n: 3

  # Ejercicio 2 · las dos barras con deslizadera y el par constante: teorema
  # de la energía con el centro instantáneo de rotación.
  - id: exma1819-2cext-4-las-dos-barras-y-la-deslizadera
    tema: t12-dinamica-plana
    n: 4
