ejercicios:
  # ── Cuestión 1 de teoría (n 1) · el sistema equivalente de la carga
  #    q(x) = −k(x² − 2Lx) sobre una viga de longitud L.
  - id: exma1819-ext-1-la-carga-parabolica-y-su-resultante
    titulo: La carga parabólica y la fuerza que la sustituye
    fuente: >-
      Cuestión 1 de teoría · Convocatoria extraordinaria de junio de 2019,
      Estática · Mecánica Aplicada, Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU). Transcrita de la columna en castellano, que en el PDF va como
      imagen; la figura está redibujada. El examen no publica resolución; el
      desarrollo es nuestro.
    nivel: examen
    enunciado: |
      **1. (1,5 puntos)** Obtener para el sistema de la figura el sistema
      equivalente a la distribución continua de fuerza por unidad de longitud
      sobre la viga de longitud L.

      <figure class="figura-examen">
      <svg viewBox="0 0 330 200" role="img" width="330" height="200"
           aria-labelledby="ma1819x1t ma1819x1d">
        <title id="ma1819x1t">La carga q(x) sobre la viga de longitud L</title>
        <desc id="ma1819x1d">Una viga horizontal sobre el eje X, de longitud L,
        con el origen en su extremo izquierdo. Encima, la carga repartida
        q(x) = −k(x² − 2L·x): nula en el origen, crece cada vez más despacio y
        llega a su máximo en el extremo derecho, en x = L.</desc>
        <path d="M40 150 L64 129.1 L88 110.4 L112 93.9 L136 79.6 L160 67.5 L184 57.6
                 L208 49.9 L232 44.4 L256 41.1 L280 40 L280 150 Z"
              fill="var(--d2)" fill-opacity=".18" stroke="var(--d2)" stroke-width="1.6"/>
        <path d="M64 129.1 L64 150 M88 110.4 L88 150 M112 93.9 L112 150 M136 79.6 L136 150
                 M160 67.5 L160 150 M184 57.6 L184 150 M208 49.9 L208 150 M232 44.4 L232 150
                 M256 41.1 L256 150" fill="none" stroke="var(--d2)" stroke-width=".8"/>
        <rect x="40" y="150" width="240" height="6" fill="var(--faint)" fill-opacity=".45"
              stroke="var(--ink)" stroke-width="1.2"/>
        <line x1="40" y1="160" x2="40" y2="20" stroke="var(--ink)" stroke-width="1.2"/>
        <polygon points="40,12 35.5,22 44.5,22" fill="var(--ink)"/>
        <text x="28" y="22" text-anchor="end" font-size="13" font-style="italic" fill="var(--ink)">Y</text>
        <line x1="40" y1="150" x2="302" y2="150" stroke="var(--ink)" stroke-width="1.2"/>
        <polygon points="310,150 300,145.5 300,154.5" fill="var(--ink)"/>
        <text x="312" y="172" text-anchor="end" font-size="13" font-style="italic" fill="var(--ink)">X</text>
        <text x="62" y="30" font-size="13" font-style="italic" fill="var(--d2-tinta)">q(x) = −k(x² − 2L·x)</text>
        <line x1="40" y1="178" x2="280" y2="178" stroke="var(--faint)" stroke-width="1"/>
        <path d="M40 173 L40 183 M280 173 L280 183" fill="none" stroke="var(--faint)" stroke-width="1"/>
        <text x="160" y="194" text-anchor="middle" font-size="12" font-style="italic" fill="var(--faint)">L</text>
      </svg>
      </figure>
    pide: La fuerza que sustituye a la carga repartida, con su valor y su punto de aplicación.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué sistema es equivalente a una carga repartida sobre una viga?
        opciones:
          - texto: >-
              Una sola fuerza igual al área del diagrama de carga, aplicada en
              la abscisa de su centro de gravedad
            correcta: true
            mensaje: |
              Eso es. La resultante es $\int q\,dx$ y tiene que dar el mismo
              momento que la carga respecto de cualquier punto: por eso se
              aplica en $\overline{x} = \int x\,q\,dx \big/ \int q\,dx$, el centro de
              gravedad del área.
          - texto: >-
              Una fuerza igual a la carga máxima por la longitud, aplicada en el
              centro de la viga
            mensaje: |
              Eso vale para una carga **uniforme**, cuyo diagrama es un
              rectángulo. Esta crece desde cero, así que su área es menor que
              la del rectángulo y su centro está desplazado hacia la derecha,
              donde hay más carga.
          - texto: >-
              Una fuerza igual al área del diagrama, aplicada a dos tercios de
              la longitud
            mensaje: |
              Los dos tercios son el centro de gravedad de un **triángulo**. El
              diagrama de esta carga no es un triángulo: es una parábola que
              crece deprisa al principio, y su centro queda algo más cerca del
              origen.

      - tipo: calcular
        titulo: La resultante
        pregunta: |
          ¿Cuánto vale la resultante de la carga, en unidades de $kL^{3}$?
        respuesta:
          tipo: numero
          valor: '0.6667'
          tolerancia: 0.001
          formato: un número, en unidades de kL³; vale la forma exacta, como 2/3
        distractores:
          - valor: '1'
            mensaje: |
              Eso es la carga máxima, $q(L) = kL^{2}$, por la longitud: el área
              del rectángulo que envuelve al diagrama. La parábola deja fuera
              un tercio de ese rectángulo.
          - valor: '0.5'
            mensaje: |
              Eso es el área de un triángulo de altura $kL^{2}$. La parábola
              crece más deprisa que la recta y queda por encima: su área es
              mayor.
        pista: |
          $R = \int_0^{L} k\,(2Lx - x^{2})\,dx$.
        desarrollo: |
          $$
          R = k\left[Lx^{2} - \frac{x^{3}}{3}\right]_0^{L} = k\left(L^{3} - \frac{L^{3}}{3}\right) = \frac{2}{3}\,kL^{3}
          $$

      - tipo: calcular
        titulo: El punto de aplicación
        pregunta: |
          ¿A qué distancia del origen está la línea de acción de la resultante,
          en unidades de $L$?
        respuesta:
          tipo: numero
          valor: '0.625'
          tolerancia: 0.001
          formato: un número, en unidades de L; vale la forma exacta, como 5/8
        distractores:
          - valor: '0.6667'
            mensaje: |
              Son los dos tercios del triángulo. La parábola tiene más carga
              que un triángulo en la primera mitad de la viga, y eso acerca su
              centro al origen: $5/8 < 2/3$.
          - valor: '0.375'
            mensaje: |
              Es la distancia medida desde el **otro** extremo, $L - 5L/8$. La
              carga es mayor a la derecha, así que su centro está en la mitad
              derecha de la viga.
        pista: |
          $\overline{x} = \dfrac{\int_0^{L} x\,q\,dx}{R}$, con $\int_0^{L} k\,(2Lx^{2} - x^{3})\,dx$ arriba.
        desarrollo: |
          $$
          \int_0^{L} x\,q\,dx = k\left(\frac{2L^{4}}{3} - \frac{L^{4}}{4}\right) = \frac{5}{12}\,kL^{4},
          \qquad
          \overline{x} = \frac{5kL^{4}/12}{2kL^{3}/3} = \frac{5}{8}\,L
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El sistema equivalente es una sola fuerza vertical, del sentido
              de la carga, igual al área del diagrama.
          - texto: >-
              $R = \int_0^{L} k\,(2Lx - x^{2})\,dx = \tfrac{2}{3}\,kL^{3}$.
          - texto: >-
              Para que dé el mismo momento que la carga, se aplica en
              $\overline{x} = \int x\,q\,dx \big/ R = 5L/8$.
          - texto: >-
              Como la carga es máxima en x = L, la resultante se aplica en el
              extremo derecho.
            trampa: true
            mensaje: |
              La resultante se aplica donde da el mismo momento que la carga
              entera, que es el centro de gravedad del diagrama, no donde la
              carga es máxima. Aplicada en $x = L$ daría un momento de
              $\tfrac{2}{3}kL^{4}$ respecto del origen, y la carga da
              $\tfrac{5}{12}kL^{4}$.
    resolucion: |
      **La resultante.** La carga es
      $q(x) = -k\,(x^{2} - 2Lx) = k\,(2Lx - x^{2})$: nula en el origen y
      máxima en $x = L$, donde vale $kL^{2}$. El sistema equivalente es una
      fuerza vertical, del sentido de la carga, igual al área del diagrama:

      $$
      R = \int_0^{L} k\,(2Lx - x^{2})\,dx = k\left(L^{3} - \frac{L^{3}}{3}\right) = \frac{2}{3}\,kL^{3}
      $$

      **El punto de aplicación.** Tiene que dar el mismo momento que la carga
      respecto del origen:

      $$
      M_O = \int_0^{L} x\,q\,dx = k\left(\frac{2L^{4}}{3} - \frac{L^{4}}{4}\right) = \frac{5}{12}\,kL^{4}
      \qquad\Longrightarrow\qquad
      \overline{x} = \frac{M_O}{R} = \frac{5}{8}\,L
      $$

      El sistema equivalente es la fuerza $\tfrac{2}{3}kL^{3}$ aplicada a
      $5L/8$ del origen, o, lo que es lo mismo, esa fuerza en el origen más un
      par de $\tfrac{5}{12}kL^{4}$.

      **Comprobación.** Integrando numéricamente la carga y su momento con
      k = L = 1 salen 0,6667 y 0,4167, y su cociente, 0,625.

  # ── Cuestión 2 de teoría (n 2) · el equilibrio de la rebanada con cargas
  #    horizontal y vertical. Es una deducción; las cuentas de comprobación
  #    usan valores nuestros, dichos en la pregunta.
  - id: exma1819-ext-2-la-rebanada-con-carga-en-las-dos-direcciones
    titulo: La rebanada con carga horizontal y vertical, y sus tres relaciones
    fuente: >-
      Cuestión 2 de teoría · Convocatoria extraordinaria de junio de 2019,
      Estática · Mecánica Aplicada, Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU). Transcrita de la columna en castellano. El examen no publica
      resolución; la rúbrica y la comprobación son nuestras.
    nivel: examen
    enunciado: |
      **2. (1,5 puntos)** Equilibrio de un elemento diferencial de viga
      sometida a cargas distribuidas en dirección horizontal $q_x$ y vertical
      $q_y$. Obtener las relaciones entre carga, esfuerzo cortante y momento
      flector.
    pide: >-
      Las relaciones diferenciales entre las cargas, el axil, el cortante y el
      flector, deducidas del equilibrio de una rebanada.
    pasos:
      - tipo: reconocer
        pregunta: |
          De las tres ecuaciones de equilibrio de la rebanada, ¿cuál da la
          relación con la carga **horizontal** $q_x$?
        opciones:
          - texto: >-
              El equilibrio horizontal, que la relaciona con el axil:
              $dN/dx = -q_x$
            correcta: true
            mensaje: |
              Eso es. La carga horizontal va a lo largo de la viga: la
              equilibra la diferencia de axil entre las dos caras. El cortante
              y el flector no se enteran de ella, que actúa en el eje.
          - texto: El de momentos, porque la carga horizontal también da momento
            mensaje: |
              Actuando sobre el eje de la viga, $q_x\,dx$ no tiene brazo
              respecto de un punto de ese eje, y no da momento. Aparece en el
              equilibrio horizontal, con el axil.
          - texto: El vertical, sumada a $q_y$
            mensaje: |
              Una carga horizontal no tiene componente vertical: no puede
              entrar en el equilibrio vertical, que es el que relaciona $q_y$
              con el cortante.

      - tipo: redactar
        consigna: |
          La cuestión en papel: la rebanada de longitud $dx$ con sus dos cargas,
          el axil, el cortante y el flector en las dos caras, el convenio de
          signos, los tres equilibrios y las tres relaciones. Media página y
          un dibujo.
        rubrica:
          - punto: |
              **El dibujo de la rebanada** con $q_x\,dx$ y $q_y\,dx$, y en las
              caras $N$, $V$, $M$ y $N + dN$, $V + dV$, $M + dM$, con sus
              sentidos.
            porque: |
              Los signos de las relaciones dependen del convenio, y el convenio
              solo se puede comprobar en el dibujo. Dos convenios distintos dan
              signos distintos, y los dos están bien si el dibujo lo dice.
          - punto: |
              **El convenio declarado**: por ejemplo, $q_x$ positiva hacia la
              derecha, $q_y$ hacia abajo, axil de tracción, cortante que sube en
              la cara izquierda y flector que tracciona abajo.
            porque: |
              Sin él, una relación con el signo cambiado no se sabe si es un
              error o otro convenio.
          - punto: |
              **Equilibrio horizontal:** $-N + q_x\,dx + (N + dN) = 0$, así que
              $dN/dx = -q_x$.
            porque: |
              Es la relación que la carga horizontal añade respecto de la de
              siempre, y la que diferencia esta cuestión de la de solo carga
              vertical.
          - punto: |
              **Equilibrio vertical:** $V - q_y\,dx - (V + dV) = 0$, así que
              $dV/dx = -q_y$.
            porque: |
              Es la relación entre la carga y el cortante: la pendiente del
              diagrama de cortantes es la carga cambiada de signo.
          - punto: |
              **Momentos y el término de segundo orden:** tomando momentos en la
              cara derecha, el término $q_y\,dx\cdot dx/2$ se desprecia, y queda
              $dM/dx = V$.
            porque: |
              Hay que decir por qué desaparece ese término —es de segundo orden
              en $dx$— y que $q_x$ no da momento porque actúa en el eje.

      - tipo: calcular
        titulo: El flector a dos metros
        pregunta: |
          Comprobación con valores nuestros: en un tramo con $q_y = 2$ kN/m hacia
          abajo y $q_x = 1$ kN/m hacia la derecha, en $x = 0$ valen $N = 3$ kN,
          $V = 5$ kN y $M = 0$. ¿Cuánto vale el flector en $x = 2$ m?
        respuesta:
          tipo: magnitud
          valor: '6 kN*m'
          tolerancia: 0.01
          formato: con su unidad, en kN·m
        distractores:
          - valor: '10 kN*m'
            mensaje: |
              Has tomado el cortante constante, 5 kN. La carga vertical lo hace
              bajar: $V = 5 - 2x$, y el flector es su integral,
              $5x - x^{2}$.
          - valor: '2 kN*m'
            mensaje: |
              Has multiplicado el cortante en $x = 2$, 1 kN, por la longitud. El
              flector acumula el cortante de todo el tramo: $\int_0^{2}(5 - 2x)\,dx$.
        pista: |
          $dV/dx = -q_y$ da $V = 5 - 2x$, y $dM/dx = V$ da $M = 5x - x^{2}$.
        desarrollo: |
          $$
          V = 5 - 2x, \qquad M = \int_0^{x} V\,dx = 5x - x^{2}
          \quad\Longrightarrow\quad M(2) = 6\ \text{kN·m}
          $$

      - tipo: calcular
        titulo: El axil a dos metros
        pregunta: |
          Y en ese mismo tramo, ¿cuánto vale el axil en $x = 2$ m?
        respuesta:
          tipo: magnitud
          valor: '1 kN'
          tolerancia: 0.01
          formato: con su unidad, en kN
        distractores:
          - valor: '5 kN'
            mensaje: |
              Has sumado la carga horizontal. Con el convenio de tracción
              positiva y $q_x$ hacia la derecha, $dN/dx = -q_x$: el axil baja
              1 kN por metro.
          - valor: '3 kN'
            mensaje: |
              Has dejado el axil constante. La carga horizontal es la que lo
              cambia a lo largo de la viga, igual que la vertical cambia el
              cortante.
        pista: |
          $dN/dx = -q_x$.
        desarrollo: |
          $$
          N = 3 - x \quad\Longrightarrow\quad N(2) = 1\ \text{kN}
          $$

      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              Se aísla una rebanada de longitud $dx$ con $q_x\,dx$, $q_y\,dx$ y
              los esfuerzos de sus dos caras, y se declara el convenio.
          - texto: >-
              El equilibrio horizontal da $dN/dx = -q_x$.
          - texto: >-
              El equilibrio vertical da $dV/dx = -q_y$.
          - texto: >-
              En momentos, $q_y\,dx\cdot dx/2$ es de segundo orden y se
              desprecia: $dM/dx = V$.
          - texto: >-
              La carga horizontal también entra en la ecuación de momentos, y
              queda $dM/dx = V - q_x$.
            trampa: true
            mensaje: |
              $q_x$ actúa sobre el eje de la viga, y un punto de ese eje es el
              que se toma para los momentos: no tiene brazo. La relación de
              momentos es la misma que sin carga horizontal, $dM/dx = V$.
    resolucion: |
      **La rebanada.** Se aísla un trozo de viga de longitud $dx$ con las dos
      cargas repartidas, $q_x\,dx$ a lo largo del eje y $q_y\,dx$ en vertical,
      y los esfuerzos de sus caras: $N$, $V$ y $M$ en la izquierda y
      $N + dN$, $V + dV$ y $M + dM$ en la derecha. Convenio: $q_x$ positiva
      hacia la derecha, $q_y$ positiva hacia abajo, axil positivo de tracción,
      cortante positivo si sube en la cara izquierda y flector positivo si
      tracciona abajo.

      **Equilibrio horizontal.**

      $$
      -N + q_x\,dx + (N + dN) = 0 \quad\Longrightarrow\quad \frac{dN}{dx} = -q_x
      $$

      **Equilibrio vertical.**

      $$
      V - q_y\,dx - (V + dV) = 0 \quad\Longrightarrow\quad \frac{dV}{dx} = -q_y
      $$

      **Momentos**, respecto del punto del eje en la cara derecha:

      $$
      -M - V\,dx + q_y\,dx\cdot\frac{dx}{2} + (M + dM) = 0
      \quad\Longrightarrow\quad \frac{dM}{dx} = V
      $$

      donde el término $q_y\,dx^{2}/2$ se ha despreciado por ser de segundo
      orden. La carga horizontal no aparece: actúa en el eje y no tiene brazo.
      Juntando las dos últimas, $d^{2}M/dx^{2} = -q_y$.

      **Comprobación con números.** Con $q_y = 2$ kN/m, $q_x = 1$ kN/m y, en el
      origen, $N = 3$ kN, $V = 5$ kN y $M = 0$: $V = 5 - 2x$, $M = 5x - x^{2}$ y
      $N = 3 - x$, así que en $x = 2$ m el flector vale 6 kN·m y el axil 1 kN.

  # ── Ejercicio 1 (n 3) · la placa ABCDE con el medio disco recortado,
  #    articulada en A y sujeta por un cable en D. R = 30 cm y 10 kN de peso.
  - id: exma1819-ext-3-la-placa-recortada-colgada-de-un-cable
    titulo: La placa recortada, colgada de un cable
    fuente: >-
      Ejercicio 1 · Convocatoria extraordinaria de junio de 2019, Estática ·
      Mecánica Aplicada, Escuela de Ingeniería de Gipuzkoa (UPV/EHU).
      Transcrito de la columna en castellano; la figura está redibujada con sus
      cotas. El momento de inercia se da como momento de inercia de masa, con
      g = 9,81 m/s². El examen no publica resolución; el desarrollo es nuestro.
    nivel: examen
    enunciado: |
      **1. (4 puntos)** La placa delgada homogénea ABCDE está articulada en el
      punto A y unida mediante un cable a una pared en el punto D. Sabiendo
      que la placa tiene un peso de 10 kN y que R = 30 cm, calcular:

      **a.** La posición del centro de gravedad de la placa respecto a los
      ejes XY representados en la figura.

      **b.** Fuerza del cable y reacciones en la articulación A.

      **c.** Momento de inercia de la placa respecto al eje X de la figura.

      <figure class="figura-examen">
