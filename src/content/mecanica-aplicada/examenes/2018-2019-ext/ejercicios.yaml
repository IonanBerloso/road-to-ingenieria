      **5. Comprobación.** Las reacciones por el otro camino: nudo a nudo,
      siguiendo las bielas, sin la ecuación de momentos del pórtico. En D, la
      viga empuja el nudo con 10 kN hacia la derecha y 9 kN hacia abajo; la
      diagonal, con una tracción $T_{AD}$, tira hacia A, y BD, con una
      compresión $F_{BD}$, empuja hacia arriba:

      $$
      10 - \frac{T_{AD}}{2} = 0 \;\Longrightarrow\; T_{AD} = 20\ \text{kN},
      \qquad
      -9 - 20\,\frac{\sqrt{3}}{2} + F_{BD} = 0 \;\Longrightarrow\; F_{BD} \approx 26{,}32\ \text{kN}
      $$

      BD es vertical y baja esos 26,32 kN a B: es $B_y$. En A, AC empuja hacia
      abajo con los 9 kN que recoge en C, y la diagonal tira con 20 kN hacia D:
      $A_x + 10 = 0$ y $A_y + 17{,}32 - 9 = 0$, o sea $A_x = -10$ kN y
      $A_y \approx -8{,}32$ kN, las mismas. Por otro camino, fuera del alcance
      del examen —el equilibrio de los cuatro nudos como un sistema lineal,
      con la viga CD sustituida por sus fuerzas de extremo—, sale lo mismo, y
      la barra AB sin esfuerzo.

      **Lo que dice el resultado.** La P está a 5,2 m de altura, y su momento
      respecto de A, 52 kN·m, es casi el doble del de la carga repartida: el
      pórtico tiende a volcar sobre B, que carga 26,32 kN, más que toda la
      carga vertical, mientras A tira hacia abajo. Y la P tiene un camino
      fijo: entra en C, recorre la viga comprimida hasta D y baja a A por la
      diagonal, traccionada con 20 kN. La viga CD solo se dobla por su carga,
      como una biapoyada; la P le añade axil, nada más.
