        se ha recortado un medio disco de radio R centrado a una distancia R de
        B. En A hay una articulación a una pared. Desde D sale un cable hacia
        arriba y a la derecha hasta la pared, a R en horizontal y a raíz de tres
        por R en vertical.</desc>
