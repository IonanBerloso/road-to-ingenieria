            <text x="154" y="194" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">E</text>
            <circle cx="110" cy="154" r="2.4" fill="var(--ink)"/>
            <text x="104" y="150" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">G</text>
            <line x1="196" y1="236" x2="226" y2="236" stroke="var(--ink)" stroke-width="1" marker-end="url(#dsl-fe)"/>
            <line x1="196" y1="236" x2="196" y2="206" stroke="var(--ink)" stroke-width="1" marker-end="url(#dsl-fe)"/>
            <text x="230" y="239" font-size="9.5" font-style="italic" fill="var(--ink)">x</text>
            <text x="192" y="208" font-size="9.5" font-style="italic" text-anchor="end" fill="var(--ink)">y</text>
            <path d="M263.5 227.5 A11 11 0 1 0 243.7 225.8" fill="none" stroke="var(--ink)" stroke-width="1" marker-end="url(#dsl-fe)"/>
            <text x="269" y="214" font-size="10" fill="var(--ink)">+</text>
          </svg>

      - tipo: calcular
        titulo: La abscisa del centro de gravedad
        pregunta: |
          ¿Cuánto vale $x_G$, en cm?
        respuesta:
          tipo: magnitud
          valor: '47.26 cm'
          tolerancia: 0.005
          formato: con su unidad, en cm
        distractores:
          - valor: '45 cm'
            mensaje: |
              Es el centro del rectángulo, $1{,}5R$. Al quitar el medio disco,
              que está a la izquierda, el centro de gravedad se va a la derecha.
          - valor: '43.26 cm'
            mensaje: |
              Has **sumado** el medio disco en vez de restarlo: el centro se ha
              ido hacia él. Es un hueco, y su momento estático se resta.
        pista: |
          Rectángulo: área $12R^{2}$, centro en $x = 1{,}5R$. Medio disco: área
          $\pi R^{2}/2$, centro en $x = R$.
        desarrollo: |
          $$
          x_G = \frac{12R^{2}\cdot 1{,}5R - \frac{\pi R^{2}}{2}\cdot R}{12R^{2} - \frac{\pi R^{2}}{2}}
          = \frac{18 - \pi/2}{12 - \pi/2}\,R \approx 1{,}5753\,R \approx 47{,}26\ \text{cm}
          $$

      - tipo: calcular
        titulo: La ordenada del centro de gravedad
        pregunta: |
          ¿Cuánto vale $y_G$, en cm?
        respuesta:
          tipo: magnitud
          valor: '52.88 cm'
          tolerancia: 0.005
          formato: con su unidad, en cm
        distractores:
          - valor: '60 cm'
            mensaje: |
              Es el centro del rectángulo, $2R$. El hueco está arriba: al
              quitarlo, el centro de gravedad baja.
          - valor: '50.96 cm'
            mensaje: |
              Has puesto el centro del medio disco en el borde superior, a
              $4R$. Está por debajo, a $4R/3\pi$ del diámetro: en
              $y = 4R - 4R/3\pi$.
        pista: |
          El centro del medio disco está en $y = 4R - \dfrac{4R}{3\pi}$.
        desarrollo: |
          $$
          y_G = \frac{12R^{2}\cdot 2R - \frac{\pi R^{2}}{2}\left(4R - \frac{4R}{3\pi}\right)}{12R^{2} - \frac{\pi R^{2}}{2}}
          \approx 1{,}7627\,R \approx 52{,}88\ \text{cm}
          $$

      - tipo: calcular
        titulo: La fuerza del cable
        pregunta: |
          ¿Cuánto vale la tensión del cable, en kN?
        respuesta:
          tipo: magnitud
          valor: '26.34 kN'
          tolerancia: 0.005
          formato: con su unidad, en kN
        distractores:
          - valor: '6.06 kN'
            mensaje: |
              Has tomado solo el momento de la componente vertical del cable.
              La horizontal, $T/2$, está aplicada a $4R$ de altura y también da
              momento respecto de A, y en sentido contrario: el brazo neto es
              pequeño, y la tensión, grande.
          - valor: '5.25 kN'
            mensaje: |
              Has tomado el cable vertical. Va a 60° de la horizontal —R en
              horizontal y $\sqrt{3}R$ en vertical—, y sus dos componentes dan
              momento respecto de A.
        pista: |
          Momentos en A: el peso, 10 kN en $x_G$; el cable, $(T/2,\ T\sqrt{3}/2)$
          aplicado en D $= (3R,\ 4R)$.
        desarrollo: |
          $$
          T\,R\left(3\cdot\frac{\sqrt{3}}{2} - 4\cdot\frac{1}{2}\right) = 10\cdot 1{,}5753\,R
          \quad\Longrightarrow\quad
          T = \frac{15{,}753}{0{,}5981} \approx 26{,}34\ \text{kN}
          $$

      - tipo: calcular
        titulo: La reacción horizontal en A
        pregunta: |
          ¿Cuánto vale la componente horizontal de la reacción en A, en valor
          absoluto y en kN? (Va hacia la izquierda.)
        respuesta:
          tipo: magnitud
          valor: '13.17 kN'
          tolerancia: 0.005
          formato: con su unidad, en kN
        distractores:
          - valor: '22.81 kN'
            mensaje: |
              Es la componente **vertical** del cable, $T\sqrt{3}/2$. En
              horizontal el cable tira con $T\cos 60° = T/2$.
          - valor: '0 kN'
            mensaje: |
              El peso es vertical, pero el cable no: tira hacia la derecha con
              $T/2$, y eso lo tiene que equilibrar la articulación.
        pista: |
          Equilibrio horizontal: $A_x + T/2 = 0$.
        desarrollo: |
          $$
          A_x = -\frac{T}{2} \approx -13{,}17\ \text{kN}
          $$

          Es decir, 13,17 kN hacia la izquierda.

      - tipo: calcular
        titulo: La reacción vertical en A
        pregunta: |
          ¿Cuánto vale la componente vertical de la reacción en A, en valor
          absoluto y en kN? (Va hacia abajo.)
        respuesta:
          tipo: magnitud
          valor: '12.81 kN'
          tolerancia: 0.005
          formato: con su unidad, en kN
        distractores:
          - valor: '10 kN'
            mensaje: |
              Es el peso. La articulación no lo soporta sola: el cable tira
              hacia arriba con $T\sqrt{3}/2 \approx 22{,}81$ kN, más que el peso,
              y A tiene que tirar hacia **abajo** con la diferencia.
          - valor: '32.81 kN'
            mensaje: |
              Has sumado la componente vertical del cable al peso. El cable tira
              hacia **arriba**: $A_y = 10 - 22{,}81$.
        pista: |
          Equilibrio vertical: $A_y + T\sqrt{3}/2 - 10 = 0$.
        desarrollo: |
          $$
          A_y = 10 - \frac{\sqrt{3}}{2}\cdot 26{,}34 \approx -12{,}81\ \text{kN}
          $$

          Es decir, 12,81 kN hacia abajo.

      - tipo: calcular
        titulo: El momento de inercia respecto del eje X
        pregunta: |
          ¿Cuánto vale el momento de inercia de la placa respecto del eje X, en
          kg·m²? Toma g = 9,81 m/s².
        respuesta:
          tipo: magnitud
          valor: '385.4 kg*m^2'
          tolerancia: 0.01
          formato: con su unidad, en kg·m²
        distractores:
          - valor: '489.3 kg*m^2'
            mensaje: |
              Es el de la placa sin recorte, con la misma masa. El hueco quita
              material de lo más alto, que es lo que más aporta respecto de la
              base: el momento baja bastante más que la masa.
          - valor: '559.5 kg*m^2'
            mensaje: |
              Has restado el momento del medio disco respecto de **su propio
              diámetro**, $\pi R^{4}/8$. El diámetro está a $4R$ del eje X: hay
              que trasladarlo con Steiner, y lo que se resta es mucho más.
        pista: |
          Momentos de área respecto de X: rectángulo $b\,h^{3}/3 = 64R^{4}$;
          medio disco, $\pi R^{4}/8 - A\,d^{2}$ por su centro y luego
          $+ A\,y_c^{2}$. Después, por la masa entre el área.
        desarrollo: |
          $$
          I_{\text{hueco}} = \left(\frac{\pi R^{4}}{8} - \frac{\pi R^{2}}{2}\,d^{2}\right) + \frac{\pi R^{2}}{2}\,y_c^{2} \approx 20{,}19\,R^{4},
          \quad d = \frac{4R}{3\pi},\ y_c = 4R - d
          $$

          $$
          I_{\text{área}} = 64R^{4} - 20{,}19R^{4} \approx 43{,}81R^{4} \approx 0{,}3548\ \text{m}^{4},
          \qquad
          A = \left(12 - \frac{\pi}{2}\right)R^{2} \approx 0{,}9386\ \text{m}^{2}
          $$

          $$
          I_X = \frac{10\,000/9{,}81}{0{,}9386}\cdot 0{,}3548 \approx 385{,}4\ \text{kg·m}^{2}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La placa es el rectángulo de $3R\times 4R$ menos el medio disco de
              radio R, y su centro de gravedad sale de restar momentos
              estáticos: $(47{,}26;\ 52{,}88)$ cm.
          - texto: >-
              Momentos en A: el cable, a 60°, tiene un brazo neto de
              $(3\sqrt{3}/2 - 2)R$, y equilibra el peso aplicado en $x_G$:
              $T \approx 26{,}34$ kN.
          - texto: >-
              Las reacciones en A: 13,17 kN hacia la izquierda y 12,81 kN hacia
              abajo, porque el cable tira hacia arriba más que el peso.
          - texto: >-
              El momento de inercia de área se resta igual, con el hueco
              trasladado por Steiner, y se pasa a masa: $I_X \approx 385{,}4$ kg·m².
          - texto: >-
              Como la placa pesa 10 kN, la articulación A soporta hacia arriba
              esos 10 kN.
            trampa: true
            mensaje: |
              El peso no lo reparte A sola: el cable tira hacia arriba con
              $T\sqrt{3}/2 \approx 22{,}81$ kN, más que el peso, y la
              articulación tiene que tirar hacia **abajo** con 12,81 kN.
    resolucion: |
      **1. Sólido libre.** La placa sin la articulación A ni el cable.

