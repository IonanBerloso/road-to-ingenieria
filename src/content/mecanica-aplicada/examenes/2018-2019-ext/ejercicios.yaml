    pide: >-
      Las reacciones en A y B, y los diagramas de axiles, cortantes y
      flectores de la viga CD.
    pasos:
      - tipo: reconocer
        pregunta: |
          AC, BD, AD y AB son barras articuladas en sus dos extremos y sin carga
          en su longitud. ¿Qué fuerza transmite cada una?
        opciones:
          - texto: >-
              Solo una fuerza a lo largo de su eje, de tracción o de
              compresión: son bielas
            correcta: true
            mensaje: |
              Eso es. Una barra con dos articulaciones y sin carga entre ellas
              solo puede estar en equilibrio con dos fuerzas iguales y opuestas
              en su eje. De ahí sale que la P del nudo C, que AC no puede tomar
              porque es vertical, entra entera en la viga CD como axil.
          - texto: >-
              Una fuerza cualquiera, con cortante y flector, como una viga
            mensaje: |
              Sin carga entre sus dos articulaciones, un momento en la barra
              no tendría nada que lo equilibrara. Solo la viga CD, que tiene la
              carga repartida encima, trabaja a flexión.
          - texto: >-
              Nada, porque las articulaciones no transmiten esfuerzos
            mensaje: |
              Las articulaciones no transmiten **momento**, pero sí fuerza. La
              diagonal AD, por ejemplo, es la que lleva la P al apoyo A.

      - tipo: calcular
        titulo: La reacción en B
        pregunta: |
          ¿Cuánto vale la reacción en B, en kN?
        respuesta:
          tipo: magnitud
          valor: '26.32 kN'
          tolerancia: 0.005
          formato: con su unidad, en kN
        distractores:
          - valor: '9 kN'
            mensaje: |
              Es la mitad de la carga repartida. Falta el momento de P respecto
              de A: está aplicada a la altura de C, $3\tan 60° \approx 5{,}20$ m,
              y empuja el pórtico a volcar sobre B.
          - valor: '19 kN'
            mensaje: |
              Has tomado el pórtico cuadrado, de 3 m de alto. La diagonal va a
              60°: la altura es $3\tan 60° = 3\sqrt{3} \approx 5{,}20$ m.
        pista: |
          Momentos respecto de A: $3B_y - 18\cdot 1{,}5 - 10\,h = 0$, con
          $h = 3\tan 60°$.
        desarrollo: |
          $$
          h = 3\tan 60° = 3\sqrt{3} \approx 5{,}196\ \text{m},
          \qquad
          B_y = \frac{27 + 10\cdot 5{,}196}{3} \approx 26{,}32\ \text{kN}
          $$

          hacia arriba.

      - tipo: calcular
        titulo: La reacción vertical en A
        pregunta: |
          ¿Cuánto vale la componente vertical de la reacción en A, en valor
          absoluto y en kN? (Va hacia abajo.)
        respuesta:
          tipo: magnitud
          valor: '8.32 kN'
          tolerancia: 0.005
          formato: con su unidad, en kN
        distractores:
          - valor: '9 kN'
            mensaje: |
              Es la mitad de la carga repartida, lo que tocaría a A sin la P. La
              P hace volcar el pórtico sobre B: B carga más de lo que cae encima
              y A tiene que tirar hacia **abajo**.
          - valor: '26.32 kN'
            mensaje: |
              Esa es la reacción en B. En A, el equilibrio vertical da
              $A_y = 18 - 26{,}32$.
        pista: |
          Equilibrio vertical: $A_y + B_y - 18 = 0$.
        desarrollo: |
          $$
          A_y = 18 - 26{,}32 \approx -8{,}32\ \text{kN}
          $$

          Es decir, 8,32 kN hacia abajo.

      - tipo: calcular
        titulo: La reacción horizontal en A
        pregunta: |
          ¿Cuánto vale la componente horizontal de la reacción en A, en valor
          absoluto y en kN? (Va hacia la izquierda.)
        respuesta:
          tipo: magnitud
          valor: '10 kN'
          tolerancia: 0.005
          formato: con su unidad, en kN
        distractores:
          - valor: '0 kN'
            mensaje: |
              B es un apoyo móvil y no da fuerza horizontal, así que toda la P
              la tiene que equilibrar A.
          - valor: '5 kN'
            mensaje: |
              Has repartido la P entre los dos apoyos. B es móvil: solo da
              fuerza vertical, y A se queda con los 10 kN.
        pista: |
          B es un apoyo móvil: solo reacción vertical.
        desarrollo: |
          $$
          A_x + 10 = 0 \quad\Longrightarrow\quad A_x = -10\ \text{kN}
          $$

      - tipo: calcular
        titulo: El axil de la viga CD
        pregunta: |
          ¿Cuánto vale el axil de la viga CD, en valor absoluto y en kN? (Es de
          compresión.)
        respuesta:
          tipo: magnitud
          valor: '10 kN'
          tolerancia: 0.005
          formato: con su unidad, en kN
        distractores:
          - valor: '0 kN'
            mensaje: |
              La P está en el nudo C, y en ese nudo solo llegan AC, que es
              vertical, y CD. Una biela vertical no toma fuerza horizontal: la
              P entra entera en CD, que la lleva hasta D.
          - valor: '20 kN'
            mensaje: |
              Es la fuerza de la diagonal AD, que toma en D los 10 kN
              horizontales de CD: $10/\cos 60° = 20$ kN. La viga lleva los 10.
        pista: |
          Equilibrio horizontal del nudo C: AC es vertical.
        desarrollo: |
          En el nudo C, la P de 10 kN hacia la derecha solo la puede equilibrar
          CD, así que la viga empuja el nudo hacia la izquierda y el nudo la
          empuja a ella hacia la derecha: en D pasa lo contrario. Axil de
          **compresión**, $N = -10$ kN, constante.

      - tipo: calcular
        titulo: El flector máximo de CD
        pregunta: |
          ¿Cuánto vale el momento flector máximo de la viga CD, en kN·m?
        respuesta:
          tipo: magnitud
          valor: '6.75 kN*m'
          tolerancia: 0.005
          formato: con su unidad, en kN·m
        distractores:
          - valor: '13.5 kN*m'
            mensaje: |
              Es $9\cdot 1{,}5$: el cortante de un extremo por media luz, sin
              restar la carga que hay entre el extremo y el centro. Es
              $qL^{2}/8 = 6\cdot 9/8$.
          - valor: '27 kN*m'
            mensaje: |
              Es la carga total por media luz, $18\cdot 1{,}5$. En una viga
              biapoyada con carga uniforme el flector máximo es $qL^{2}/8$.
        pista: |
          CD es una biapoyada de 3 m con carga uniforme: el máximo está en el
          centro y vale $qL^{2}/8$.
        desarrollo: |
          $$
          M_{\max} = \frac{6\cdot 3^{2}}{8} = 6{,}75\ \text{kN·m}
          $$

          en el centro de CD, a 1,5 m de C.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Momentos en A con $h = 3\sqrt{3}$ m: $B_y \approx 26{,}32$ kN, y
              después $A_y \approx -8{,}32$ kN y $A_x = -10$ kN.
          - texto: >-
              AC, BD, AD y AB son bielas: solo fuerza a lo largo de su eje.
          - texto: >-
              En el nudo C la P solo la puede tomar CD: la viga está comprimida
              con 10 kN.
          - texto: >-
              CD es una biapoyada de 3 m con 6 kN/m: cortante de +9 a −9 kN y
              flector parabólico con máximo de 6,75 kN·m en el centro.
          - texto: >-
              Como los nudos son articulaciones, la viga CD no tiene axil.
            trampa: true
            mensaje: |
              Las articulaciones no transmiten momento, pero sí fuerza, también
              a lo largo de la viga. La P del nudo C no tiene otro camino que
              CD, porque AC es vertical, y la viga trabaja comprimida con
              10 kN.
    resolucion: |
      **a) Reacciones.** La altura del pórtico sale de la diagonal:
      $h = 3\tan 60° = 3\sqrt{3} \approx 5{,}196$ m. Cargas exteriores: la
      repartida, $6\cdot 3 = 18$ kN en el centro de CD, y P = 10 kN hacia la
      derecha en C. A es un apoyo fijo ($A_x$, $A_y$) y B un apoyo móvil
      ($B_y$). Momentos respecto de A, antihorario positivo:

      $$
      3B_y - 18\cdot 1{,}5 - 10\cdot h = 0
      \quad\Longrightarrow\quad
      B_y = \frac{27 + 51{,}96}{3} \approx 26{,}32\ \text{kN}\ \uparrow
      $$

      $$
      A_y = 18 - 26{,}32 \approx -8{,}32\ \text{kN}\ (\downarrow),
      \qquad
      A_x = -10\ \text{kN}\ (\leftarrow)
      $$

      **Cómo trabaja cada barra.** AC, BD, AD y AB están articuladas en sus
      extremos y sin carga en su longitud: son bielas. En el nudo C llegan AC,
      vertical, y CD, así que la P entra entera en CD, que la lleva a D; allí
      la toma la diagonal, con $10/\cos 60° = 20$ kN de tracción, que la baja
      hasta A. En B, la barra AB no trabaja: el apoyo móvil y BD son verticales.

      **b) Diagramas de CD.** La viga CD es una biapoyada de 3 m con la carga
      repartida y los extremos articulados, y lleva además la P como axil.
      Con $x$ desde C, en metros:

      $$
      N = -10\ \text{kN},
      \qquad
      V = 9 - 6x\ \text{kN},
      \qquad
      M = 9x - 3x^{2}\ \text{kN·m}
      $$

      El cortante va de +9 kN en C a −9 kN en D y se anula en el centro, donde
      el flector es máximo: $M_{\max} = qL^{2}/8 = 6{,}75$ kN·m. En C y en D el
      flector es nulo, porque son articulaciones.

