        <text x="206" y="252" font-size="12" font-weight="bold" fill="var(--ink)">E</text>
        <line x1="50" y1="100" x2="50" y2="260" stroke="var(--faint)" stroke-width="1"/>
        <path d="M45 100 L55 100 M45 260 L55 260" fill="none" stroke="var(--faint)" stroke-width="1"/>
