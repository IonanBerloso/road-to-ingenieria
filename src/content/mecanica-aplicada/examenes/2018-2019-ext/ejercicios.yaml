      <figcaption>

      a) El pórtico entero, sin los apoyos: A es fijo y B móvil, que solo empuja en vertical. Las fuerzas entre las barras son internas y no se dibujan. b) La viga CD sola: cada extremo es una articulación con un nudo, que le hace una fuerza de dirección desconocida. Las componentes horizontales van dibujadas hacia dentro de la viga, y las verticales, hacia arriba. Ejes: x hacia la derecha, y hacia arriba; momentos positivos en sentido antihorario.

      </figcaption>
      </figure>

      - **El pórtico.** A es un apoyo fijo, con $A_x$ y $A_y$, y B un apoyo
        móvil, con $B_y$. Las cargas: P = 10 kN hacia la derecha en C y la
        repartida, $6\cdot 3 = 18$ kN en el centro de CD. La altura sale de la
        diagonal: $h = 3\tan 60° = 3\sqrt{3} \approx 5{,}196$ m.
      - **Cómo trabaja cada barra.** AC, BD, AD y AB están articuladas en sus
        extremos y sin carga en su longitud: son bielas, con una fuerza a lo
        largo de su eje. Solo la viga CD, con la carga encima, trabaja a
        flexión.
      - **La viga CD.** La carga y, en cada extremo, lo que le hace el nudo:
        $C_x$ y $C_y$ en C, $D_x$ y $D_y$ en D.

      **2. Incógnitas.** $A_x$, $A_y$ y $B_y$; $C_x$, $C_y$, $D_x$ y $D_y$; y
      el axil, el cortante y el flector a lo largo de CD.

      **3. Ecuaciones.** El pórtico entero, con momentos respecto de A,
      antihorario positivo:

      $$
      A_x + 10 = 0,
      \qquad
      A_y + B_y - 18 = 0,
      \qquad
      3B_y - 18\cdot 1{,}5 - 10\,h = 0
      $$

      El nudo C en horizontal: AC es una biela vertical y no toma fuerza
      horizontal, así que la P solo la puede equilibrar la viga, que empuja el
      nudo con $-C_x$:

      $$
      10 - C_x = 0
      $$

      La viga CD, con momentos respecto de C:

      $$
      C_x - D_x = 0,
      \qquad
      C_y + D_y - 18 = 0,
      \qquad
      3D_y - 18\cdot 1{,}5 = 0
      $$

      Y, con x desde C en metros, el trozo de viga a la izquierda de cada
      sección: $N + C_x = 0$, $V = C_y - 6x$ y $M = C_y\,x - 3x^{2}$.

      **4. Resultados.** a) Las reacciones:

      $$
      B_y = \frac{27 + 10\cdot 5{,}196}{3} \approx 26{,}32\ \text{kN},
      \qquad
      A_y = 18 - 26{,}32 \approx -8{,}32\ \text{kN},
      \qquad
      A_x = -10\ \text{kN}
      $$

      $$
      \vec{F}_A \approx -10\,\vec{\imath} - 8{,}32\,\vec{\jmath}\ \text{kN},
      \qquad
      \vec{F}_B \approx 26{,}32\,\vec{\jmath}\ \text{kN}
      $$

      A tira hacia la izquierda y hacia **abajo**.

      b) La viga: $C_x = D_x = 10$ kN, hacia dentro de la viga, y
      $C_y = D_y = 9$ kN. Es una biapoyada de 3 m con la carga repartida, y
      lleva además la P como axil:

      $$
      N = -10\ \text{kN},
      \qquad
      V = 9 - 6x\ \text{kN},
      \qquad
      M = 9x - 3x^{2}\ \text{kN·m}
      $$

      El cortante va de +9 kN en C a −9 kN en D y se anula en el centro, donde
      el flector es máximo: $M_{\max} = qL^{2}/8 = 6{,}75$ kN·m. En C y en D el
      flector es nulo, porque son articulaciones.

