    pide: La fuerza que sustituye a la carga repartida, con su valor y su punto de aplicación.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué sistema es equivalente a una carga repartida sobre una viga?
        opciones:
          - texto: >-
              Una sola fuerza igual al área del diagrama de carga, aplicada en
              la abscisa de su centro de gravedad
            correcta: true
            mensaje: |
              Eso es. La resultante es $\int q\,dx$ y tiene que dar el mismo
              momento que la carga respecto de cualquier punto: por eso se
              aplica en $\overline{x} = \int x\,q\,dx \big/ \int q\,dx$, el centro de
              gravedad del área.
          - texto: >-
              Una fuerza igual a la carga máxima por la longitud, aplicada en el
              centro de la viga
            mensaje: |
              Eso vale para una carga **uniforme**, cuyo diagrama es un
              rectángulo. Esta crece desde cero, así que su área es menor que
              la del rectángulo y su centro está desplazado hacia la derecha,
              donde hay más carga.
          - texto: >-
              Una fuerza igual al área del diagrama, aplicada a dos tercios de
              la longitud
            mensaje: |
              Los dos tercios son el centro de gravedad de un **triángulo**. El
              diagrama de esta carga no es un triángulo: es una parábola que
              crece deprisa al principio, y su centro queda algo más cerca del
              origen.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna integral: **el diagrama de la carga sobre
          la viga**, con su valor en los dos extremos, y al lado **la fuerza
          que la sustituye**.
        comprueba:
          - punto: |
              **La carga, nula en el origen y máxima en x = L, donde vale
              $kL^{2}$ y su tangente es horizontal.**
            porque: |
              $q(x) = k\,(2Lx - x^{2})$ se anula en x = 0, y su derivada,
              $k\,(2L - 2x)$, se anula en x = L.
          - punto: |
              **Una sola fuerza R, vertical y del sentido de la carga.**
            porque: |
              Todas las fuerzas de la carga son paralelas, y su resultante
              también.
          - punto: |
              **R a una distancia $\overline{x}$ del origen, sin valor todavía.**
            porque: |
              Es la distancia que da el mismo momento que la carga; cuánto vale
              lo dice la cuenta.
        figura: |
          <svg viewBox="16 40 416 120" role="img" width="416" height="120" aria-labelledby="dsl-t dsl-d">
