      <figcaption>

      a) La carga, nula en el origen y máxima en x = L, donde vale kL² y su tangente es horizontal. b) La fuerza que la sustituye: una sola, paralela a las de la carga, a una distancia x̄ del origen que tiene que dar el mismo momento; x̄, sin escala. La carga se dibuja hacia abajo, como es habitual.

      </figcaption>
      </figure>

      - **La carga** es $q(x) = -k\,(x^{2} - 2Lx) = k\,(2Lx - x^{2})$: nula en
        el origen y máxima en $x = L$, donde vale $kL^{2}$ y su tangente es
        horizontal.
      - **Su equivalente** tiene que dar la misma resultante y el mismo
        momento respecto de cualquier punto. Como las fuerzas de la carga son
        paralelas, basta una sola fuerza R, paralela a ellas, puesta en el
        sitio justo.

      **2. Incógnitas.** El valor de R y la distancia $\overline{x}$ del origen
      a su línea de acción.

      **3. Ecuaciones.** La misma resultante y el mismo momento respecto del
      origen:

      $$
      R = \int_0^{L} q\,dx,
      \qquad
      R\,\overline{x} = \int_0^{L} x\,q\,dx
      $$

      **4. Resultados.** La resultante es el área del diagrama:

      $$
      R = \int_0^{L} k\,(2Lx - x^{2})\,dx = k\left(L^{3} - \frac{L^{3}}{3}\right) = \frac{2}{3}\,kL^{3}
      $$

      Y su momento respecto del origen:

      $$
      M_O = \int_0^{L} x\,q\,dx = k\left(\frac{2L^{4}}{3} - \frac{L^{4}}{4}\right) = \frac{5}{12}\,kL^{4}
      \qquad\Longrightarrow\qquad
      \overline{x} = \frac{M_O}{R} = \frac{5}{8}\,L
      $$

      El sistema equivalente es la fuerza $\tfrac{2}{3}kL^{3}$ aplicada a
      $5L/8$ del origen, o, lo que es lo mismo, esa fuerza en el origen más un
      par de $\tfrac{5}{12}kL^{4}$. Con la carga hacia abajo, como se dibuja
      habitualmente, $\vec{R} = -\tfrac{2}{3}\,kL^{3}\,\vec{\jmath}$ aplicada
      en $(5L/8,\ 0)$.

      **5. Comprobación.** Por las tablas, sin integrar. La carga es una
      semiparábola con el vértice en $x = L$: su área es dos tercios del
      rectángulo que la envuelve, $\tfrac23\cdot kL^{2}\cdot L = \tfrac23\,kL^{3}$,
      y su centro de gravedad está a $3/8$ de la base desde el vértice, en
      $x = L - \tfrac38 L = \tfrac58 L$. Lo mismo. Integrando numéricamente la
      carga y su momento con k = L = 1 salen 0,6667 y 0,4167, y su cociente,
      0,625.

      **Lo que dice el resultado.** $5L/8$ queda entre $L/2$, la de una carga
      uniforme, y $2L/3$, la de un triángulo: la parábola crece deprisa al
      principio y tiene más carga cerca del origen que un triángulo. Y la
      fuerza equivalente sirve para el equilibrio de la viga entera, para sus
      reacciones; no para lo que pasa dentro: el cortante y el momento de una
      sección dependen de cómo está repartida la carga a cada lado, y ahí hay
      que volver a la carga de verdad.

  # ── Cuestión 2 de teoría (n 2) · el equilibrio de la rebanada con cargas
  #    horizontal y vertical. Es una deducción; las cuentas de comprobación
  #    usan valores nuestros, dichos en la pregunta.
  - id: exma1819-ext-2-la-rebanada-con-carga-en-las-dos-direcciones
    titulo: La rebanada con carga horizontal y vertical, y sus tres relaciones
    fuente: >-
      Cuestión 2 de teoría · Convocatoria extraordinaria de junio de 2019,
      Estática · Mecánica Aplicada, Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU). Transcrita de la columna en castellano. El examen no publica
      resolución; la rúbrica y la comprobación son nuestras.
    nivel: examen
    enunciado: |
      **2. (1,5 puntos)** Equilibrio de un elemento diferencial de viga
      sometida a cargas distribuidas en dirección horizontal $q_x$ y vertical
      $q_y$. Obtener las relaciones entre carga, esfuerzo cortante y momento
      flector.
    pide: >-
      Las relaciones diferenciales entre las cargas, el axil, el cortante y el
      flector, deducidas del equilibrio de una rebanada.
    pasos:
      - tipo: reconocer
        pregunta: |
          De las tres ecuaciones de equilibrio de la rebanada, ¿cuál da la
          relación con la carga **horizontal** $q_x$?
        opciones:
          - texto: >-
              El equilibrio horizontal, que la relaciona con el axil:
              $dN/dx = -q_x$
            correcta: true
            mensaje: |
              Eso es. La carga horizontal va a lo largo de la viga: la
              equilibra la diferencia de axil entre las dos caras. El cortante
              y el flector no se enteran de ella, que actúa en el eje.
          - texto: El de momentos, porque la carga horizontal también da momento
            mensaje: |
              Actuando sobre el eje de la viga, $q_x\,dx$ no tiene brazo
              respecto de un punto de ese eje, y no da momento. Aparece en el
              equilibrio horizontal, con el axil.
          - texto: El vertical, sumada a $q_y$
            mensaje: |
              Una carga horizontal no tiene componente vertical: no puede
              entrar en el equilibrio vertical, que es el que relaciona $q_y$
              con el cortante.

      - tipo: redactar
        que: deduccion
        consigna: |
          La cuestión en papel: la rebanada de longitud $dx$ con sus dos cargas,
          el axil, el cortante y el flector en las dos caras, el convenio de
          signos, los tres equilibrios y las tres relaciones. Media página y
          un dibujo.
        rubrica:
          - punto: |
              **El dibujo de la rebanada** con $q_x\,dx$ y $q_y\,dx$, y en las
              caras $N$, $V$, $M$ y $N + dN$, $V + dV$, $M + dM$, con sus
              sentidos.
            porque: |
              Los signos de las relaciones dependen del convenio, y el convenio
              solo se puede comprobar en el dibujo. Dos convenios distintos dan
              signos distintos, y los dos están bien si el dibujo lo dice.
          - punto: |
              **El convenio declarado**: por ejemplo, $q_x$ positiva hacia la
              derecha, $q_y$ hacia abajo, axil de tracción, cortante que sube en
              la cara izquierda y flector que tracciona abajo.
            porque: |
              Sin él, una relación con el signo cambiado no se sabe si es un
              error o otro convenio.
          - punto: |
              **Equilibrio horizontal:** $-N + q_x\,dx + (N + dN) = 0$, así que
              $dN/dx = -q_x$.
            porque: |
              Es la relación que la carga horizontal añade respecto de la de
              siempre, y la que diferencia esta cuestión de la de solo carga
              vertical.
          - punto: |
              **Equilibrio vertical:** $V - q_y\,dx - (V + dV) = 0$, así que
              $dV/dx = -q_y$.
            porque: |
              Es la relación entre la carga y el cortante: la pendiente del
              diagrama de cortantes es la carga cambiada de signo.
          - punto: |
              **Momentos y el término de segundo orden:** tomando momentos en la
              cara derecha, el término $q_y\,dx\cdot dx/2$ se desprecia, y queda
              $dM/dx = V$.
            porque: |
              Hay que decir por qué desaparece ese término —es de segundo orden
              en $dx$— y que $q_x$ no da momento porque actúa en el eje.

      - tipo: calcular
        titulo: El flector a dos metros
        pregunta: |
          Comprobación con valores nuestros: en un tramo con $q_y = 2$ kN/m hacia
          abajo y $q_x = 1$ kN/m hacia la derecha, en $x = 0$ valen $N = 3$ kN,
          $V = 5$ kN y $M = 0$. ¿Cuánto vale el flector en $x = 2$ m?
        respuesta:
          tipo: magnitud
          valor: '6 kN*m'
          tolerancia: 0.01
          formato: con su unidad, en kN·m
        distractores:
          - valor: '10 kN*m'
            mensaje: |
              Has tomado el cortante constante, 5 kN. La carga vertical lo hace
              bajar: $V = 5 - 2x$, y el flector es su integral,
              $5x - x^{2}$.
          - valor: '2 kN*m'
            mensaje: |
              Has multiplicado el cortante en $x = 2$, 1 kN, por la longitud. El
              flector acumula el cortante de todo el tramo: $\int_0^{2}(5 - 2x)\,dx$.
        pista: |
          $dV/dx = -q_y$ da $V = 5 - 2x$, y $dM/dx = V$ da $M = 5x - x^{2}$.
        desarrollo: |
          $$
          V = 5 - 2x, \qquad M = \int_0^{x} V\,dx = 5x - x^{2}
          \quad\Longrightarrow\quad M(2) = 6\ \text{kN·m}
          $$

      - tipo: calcular
        titulo: El axil a dos metros
        pregunta: |
          Y en ese mismo tramo, ¿cuánto vale el axil en $x = 2$ m?
        respuesta:
          tipo: magnitud
          valor: '1 kN'
          tolerancia: 0.01
          formato: con su unidad, en kN
        distractores:
          - valor: '5 kN'
            mensaje: |
              Has sumado la carga horizontal. Con el convenio de tracción
              positiva y $q_x$ hacia la derecha, $dN/dx = -q_x$: el axil baja
              1 kN por metro.
          - valor: '3 kN'
            mensaje: |
              Has dejado el axil constante. La carga horizontal es la que lo
              cambia a lo largo de la viga, igual que la vertical cambia el
              cortante.
        pista: |
          $dN/dx = -q_x$.
        desarrollo: |
          $$
          N = 3 - x \quad\Longrightarrow\quad N(2) = 1\ \text{kN}
          $$

      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              Se aísla una rebanada de longitud $dx$ con $q_x\,dx$, $q_y\,dx$ y
              los esfuerzos de sus dos caras, y se declara el convenio.
          - texto: >-
              El equilibrio horizontal da $dN/dx = -q_x$.
          - texto: >-
              El equilibrio vertical da $dV/dx = -q_y$.
          - texto: >-
              En momentos, $q_y\,dx\cdot dx/2$ es de segundo orden y se
              desprecia: $dM/dx = V$.
          - texto: >-
              La carga horizontal también entra en la ecuación de momentos, y
              queda $dM/dx = V - q_x$.
            trampa: true
            mensaje: |
              $q_x$ actúa sobre el eje de la viga, y un punto de ese eje es el
              que se toma para los momentos: no tiene brazo. La relación de
              momentos es la misma que sin carga horizontal, $dM/dx = V$.
    resolucion: |
      **La rebanada.** Se aísla un trozo de viga de longitud $dx$ con las dos
      cargas repartidas, $q_x\,dx$ a lo largo del eje y $q_y\,dx$ en vertical,
      y los esfuerzos de sus caras: $N$, $V$ y $M$ en la izquierda y
      $N + dN$, $V + dV$ y $M + dM$ en la derecha. Convenio: $q_x$ positiva
      hacia la derecha, $q_y$ positiva hacia abajo, axil positivo de tracción,
      cortante positivo si sube en la cara izquierda y flector positivo si
      tracciona abajo.

      **Equilibrio horizontal.**

      $$
      -N + q_x\,dx + (N + dN) = 0 \quad\Longrightarrow\quad \frac{dN}{dx} = -q_x
      $$

      **Equilibrio vertical.**

      $$
      V - q_y\,dx - (V + dV) = 0 \quad\Longrightarrow\quad \frac{dV}{dx} = -q_y
      $$

      **Momentos**, respecto del punto del eje en la cara derecha:

      $$
      -M - V\,dx + q_y\,dx\cdot\frac{dx}{2} + (M + dM) = 0
      \quad\Longrightarrow\quad \frac{dM}{dx} = V
      $$

      donde el término $q_y\,dx^{2}/2$ se ha despreciado por ser de segundo
      orden. La carga horizontal no aparece: actúa en el eje y no tiene brazo.
      Juntando las dos últimas, $d^{2}M/dx^{2} = -q_y$.

      **Comprobación con números.** Con $q_y = 2$ kN/m, $q_x = 1$ kN/m y, en el
      origen, $N = 3$ kN, $V = 5$ kN y $M = 0$: $V = 5 - 2x$, $M = 5x - x^{2}$ y
      $N = 3 - x$, así que en $x = 2$ m el flector vale 6 kN·m y el axil 1 kN.

  # ── Ejercicio 1 (n 3) · la placa ABCDE con el medio disco recortado,
  #    articulada en A y sujeta por un cable en D. R = 30 cm y 10 kN de peso.
  - id: exma1819-ext-3-la-placa-recortada-colgada-de-un-cable
    titulo: La placa recortada, colgada de un cable
    fuente: >-
      Ejercicio 1 · Convocatoria extraordinaria de junio de 2019, Estática ·
      Mecánica Aplicada, Escuela de Ingeniería de Gipuzkoa (UPV/EHU).
      Transcrito de la columna en castellano; la figura está redibujada con sus
      cotas. El momento de inercia se da como momento de inercia de masa, con
      g = 9,81 m/s². El examen no publica resolución; el desarrollo es nuestro.
    nivel: examen
    antes:
      idea: |
        Una figura plana complicada se descompone en figuras sencillas, cada
        una con su área, su centro de gravedad y su momento de inercia
        conocidos. Y un sólido en reposo cumple las ecuaciones de la
        estática con todas las fuerzas que actúan sobre él, el peso en su centro
        de gravedad.
      formula: |
        El centro de gravedad de una figura compuesta, con $A_i$ las áreas de
        las partes y $(x_i,\ y_i)$ sus centros:

        $$
        x_G = \frac{\sum A_i\,x_i}{\sum A_i}
        \qquad
        y_G = \frac{\sum A_i\,y_i}{\sum A_i}
        $$

        Steiner, de un eje por el centro de gravedad a otro paralelo a una
        distancia d, y el equilibrio en el plano:

        $$
        I = I_G + A\,d^{2}
        \qquad
        \sum F_x = 0 \quad \sum F_y = 0 \quad \sum M = 0
        $$

        El medio disco de radio R tiene su centro a $4R/3\pi$ del diámetro, y
        un momento de inercia $\pi R^{4}/8$ respecto de él. Una placa
        homogénea tiene el momento de inercia de masa igual al de área por
        $m/A$.
      reconocer: |
        Antes de calcular se mira de qué figuras sencillas está hecha la placa.
    enunciado: |
      **1. (4 puntos)** La placa delgada homogénea ABCDE está articulada en el
      punto A y unida mediante un cable a una pared en el punto D. Sabiendo
      que la placa tiene un peso de 10 kN y que R = 30 cm, calcular:

      **a.** La posición del centro de gravedad de la placa respecto a los
      ejes XY representados en la figura.

      **b.** Fuerza del cable y reacciones en la articulación A.

      **c.** Momento de inercia de la placa respecto al eje X de la figura.

