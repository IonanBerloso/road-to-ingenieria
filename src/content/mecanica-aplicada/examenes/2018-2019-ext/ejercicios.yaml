      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Momentos en A con $h = 3\sqrt{3}$ m: $B_y \approx 26{,}32$ kN, y
              después $A_y \approx -8{,}32$ kN y $A_x = -10$ kN.
          - texto: >-
              AC, BD, AD y AB son bielas: solo fuerza a lo largo de su eje.
          - texto: >-
              En el nudo C la P solo la puede tomar CD: la viga está comprimida
              con 10 kN.
          - texto: >-
              CD es una biapoyada de 3 m con 6 kN/m: cortante de +9 a −9 kN y
              flector parabólico con máximo de 6,75 kN·m en el centro.
          - texto: >-
              Como los nudos son articulaciones, la viga CD no tiene axil.
            trampa: true
            mensaje: |
              Las articulaciones no transmiten momento, pero sí fuerza, también
              a lo largo de la viga. La P del nudo C no tiene otro camino que
              CD, porque AC es vertical, y la viga trabaja comprimida con
              10 kN.
