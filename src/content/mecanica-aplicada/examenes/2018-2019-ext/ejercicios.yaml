ejercicios:
  # ── Cuestión 1 de teoría (n 1) · el sistema equivalente de la carga
  #    q(x) = −k(x² − 2Lx) sobre una viga de longitud L.
  - id: exma1819-ext-1-la-carga-parabolica-y-su-resultante
    titulo: La carga parabólica y la fuerza que la sustituye
    fuente: >-
      Cuestión 1 de teoría · Convocatoria extraordinaria de junio de 2019,
      Estática · Mecánica Aplicada, Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU). Transcrita de la columna en castellano, que en el PDF va como
      imagen; la figura está redibujada. El examen no publica resolución; el
      desarrollo es nuestro.
    nivel: examen
    antes:
      idea: |
        Para el equilibrio de un sólido, un sistema de fuerzas se puede
        sustituir por otro más sencillo que tenga la misma resultante y el
        mismo momento respecto de un punto. Una carga repartida es un sistema
        de infinitas fuerzas pequeñas, y se trata igual.
      formula: |
        La resultante de una carga $q(x)$ por unidad de longitud a lo largo de
        una viga, y su momento respecto de un punto O de la viga, con x medida
        desde O:

        $$
        R = \int q\,dx
        \qquad
        M_O = \int x\,q\,dx
        $$
      reconocer: |
        Antes de calcular se mira qué tiene que conservar el sistema que
        sustituye a la carga.
    enunciado: |
      **1. (1,5 puntos)** Obtener para el sistema de la figura el sistema
      equivalente a la distribución continua de fuerza por unidad de longitud
      sobre la viga de longitud L.

