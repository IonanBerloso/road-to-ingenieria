      - tipo: calcular
        titulo: La reacción en B
        pregunta: |
          ¿Cuánto vale la reacción en B, en kN?
        respuesta:
          tipo: magnitud
          valor: '26.32 kN'
          tolerancia: 0.005
          formato: con su unidad, en kN
        distractores:
          - valor: '9 kN'
            mensaje: |
              Es la mitad de la carga repartida. Falta el momento de P respecto
              de A: está aplicada a la altura de C, $3\tan 60° \approx 5{,}20$ m,
              y empuja el pórtico a volcar sobre B.
          - valor: '19 kN'
            mensaje: |
              Has tomado el pórtico cuadrado, de 3 m de alto. La diagonal va a
              60°: la altura es $3\tan 60° = 3\sqrt{3} \approx 5{,}20$ m.
        pista: |
          Momentos respecto de A: $3B_y - 18\cdot 1{,}5 - 10\,h = 0$, con
          $h = 3\tan 60°$.
        desarrollo: |
          $$
          h = 3\tan 60° = 3\sqrt{3} \approx 5{,}196\ \text{m},
          \qquad
          B_y = \frac{27 + 10\cdot 5{,}196}{3} \approx 26{,}32\ \text{kN}
          $$

          hacia arriba.

      - tipo: calcular
        titulo: La reacción vertical en A
        pregunta: |
          ¿Cuánto vale la componente vertical de la reacción en A, en valor
          absoluto y en kN? (Va hacia abajo.)
        respuesta:
          tipo: magnitud
          valor: '8.32 kN'
          tolerancia: 0.005
          formato: con su unidad, en kN
        distractores:
          - valor: '9 kN'
            mensaje: |
              Es la mitad de la carga repartida, lo que tocaría a A sin la P. La
              P hace volcar el pórtico sobre B: B carga más de lo que cae encima
              y A tiene que tirar hacia **abajo**.
          - valor: '26.32 kN'
            mensaje: |
              Esa es la reacción en B. En A, el equilibrio vertical da
              $A_y = 18 - 26{,}32$.
        pista: |
          Equilibrio vertical: $A_y + B_y - 18 = 0$.
        desarrollo: |
          $$
          A_y = 18 - 26{,}32 \approx -8{,}32\ \text{kN}
          $$

          Es decir, 8,32 kN hacia abajo.

      - tipo: calcular
        titulo: La reacción horizontal en A
        pregunta: |
          ¿Cuánto vale la componente horizontal de la reacción en A, en valor
          absoluto y en kN? (Va hacia la izquierda.)
        respuesta:
          tipo: magnitud
          valor: '10 kN'
          tolerancia: 0.005
          formato: con su unidad, en kN
        distractores:
          - valor: '0 kN'
            mensaje: |
              B es un apoyo móvil y no da fuerza horizontal, así que toda la P
              la tiene que equilibrar A.
          - valor: '5 kN'
            mensaje: |
              Has repartido la P entre los dos apoyos. B es móvil: solo da
              fuerza vertical, y A se queda con los 10 kN.
        pista: |
          B es un apoyo móvil: solo reacción vertical.
        desarrollo: |
          $$
          A_x + 10 = 0 \quad\Longrightarrow\quad A_x = -10\ \text{kN}
          $$

      - tipo: calcular
        titulo: El axil de la viga CD
        pregunta: |
          ¿Cuánto vale el axil de la viga CD, en valor absoluto y en kN? (Es de
          compresión.)
        respuesta:
          tipo: magnitud
          valor: '10 kN'
          tolerancia: 0.005
          formato: con su unidad, en kN
        distractores:
          - valor: '0 kN'
            mensaje: |
              La P está en el nudo C, y en ese nudo solo llegan AC, que es
              vertical, y CD. Una biela vertical no toma fuerza horizontal: la
              P entra entera en CD, que la lleva hasta D.
          - valor: '20 kN'
            mensaje: |
              Es la fuerza de la diagonal AD, que toma en D los 10 kN
              horizontales de CD: $10/\cos 60° = 20$ kN. La viga lleva los 10.
        pista: |
          Equilibrio horizontal del nudo C: AC es vertical.
        desarrollo: |
          En el nudo C, la P de 10 kN hacia la derecha solo la puede equilibrar
          CD, así que la viga empuja el nudo hacia la izquierda y el nudo la
          empuja a ella hacia la derecha: en D pasa lo contrario. Axil de
          **compresión**, $N = -10$ kN, constante.

      - tipo: calcular
        titulo: El flector máximo de CD
        pregunta: |
          ¿Cuánto vale el momento flector máximo de la viga CD, en kN·m?
        respuesta:
          tipo: magnitud
          valor: '6.75 kN*m'
          tolerancia: 0.005
          formato: con su unidad, en kN·m
        distractores:
          - valor: '13.5 kN*m'
            mensaje: |
              Es $9\cdot 1{,}5$: el cortante de un extremo por media luz, sin
              restar la carga que hay entre el extremo y el centro. Es
              $qL^{2}/8 = 6\cdot 9/8$.
          - valor: '27 kN*m'
            mensaje: |
              Es la carga total por media luz, $18\cdot 1{,}5$. En una viga
              biapoyada con carga uniforme el flector máximo es $qL^{2}/8$.
        pista: |
          CD es una biapoyada de 3 m con carga uniforme: el máximo está en el
          centro y vale $qL^{2}/8$.
        desarrollo: |
          $$
          M_{\max} = \frac{6\cdot 3^{2}}{8} = 6{,}75\ \text{kN·m}
          $$

          en el centro de CD, a 1,5 m de C.

      - tipo: dibujar
        consigna: |
          En papel: **los diagramas de axiles, cortantes y flectores de la
          viga CD**, alineados bajo ella y con sus valores extremos.
        comprueba:
          - punto: |
              **Axil constante de −10 kN**: compresión en toda la viga.
            porque: |
              La P de 10 kN entra en C y no tiene otro camino que la viga
              hasta D, donde la toma la diagonal. Negativo, porque comprime.
          - punto: |
              **Cortante en recta, de +9 kN en C a −9 kN en D**, con el cero
              en el centro.
            porque: |
              Es una biapoyada de 3 m con 6 kN/m: cada extremo recoge la mitad
              de los 18 kN, y la carga uniforme baja la cortante con pendiente
              −6.
          - punto: |
              **Flector parabólico, nulo en C y en D, con el máximo de 6,75
              kN·m en el centro**.
            porque: |
              Los extremos son articulaciones y no toman momento. El máximo
              está donde se anula la cortante y vale $qL^{2}/8$, con 6 kN/m y
              3 m.
        figura: |
          <svg viewBox="0 0 360 290" role="img" width="360" height="290"
               aria-labelledby="ma1819x4rt ma1819x4rd">
