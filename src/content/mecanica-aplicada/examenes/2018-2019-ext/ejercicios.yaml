    pide: >-
      El centro de gravedad de la placa, la fuerza del cable, las reacciones en
      A y el momento de inercia respecto del eje X.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se trata la placa para sacar su centro de gravedad y su momento
          de inercia?
        opciones:
          - texto: >-
              Como el rectángulo entero menos el medio disco recortado: áreas,
              momentos estáticos y momentos de inercia se restan
            correcta: true
            mensaje: |
              Eso es. Con la placa homogénea, todo es proporcional al área: el
              rectángulo de $3R \times 4R$ menos el medio disco de radio R, con
              su centro de gravedad a $4R/3\pi$ por debajo del borde.
          - texto: >-
              Como el rectángulo, porque el recorte es pequeño
            mensaje: |
              El recorte quita $\pi R^{2}/2 \approx 1{,}57\,R^{2}$ de $12R^{2}$,
              el 13 % del área, y todo de arriba a la izquierda: mueve el centro
              de gravedad y cambia bastante el momento de inercia respecto de la
              base, donde los puntos altos pesan más.
          - texto: >-
              Como la suma del rectángulo y el medio disco
            mensaje: |
              El medio disco no está: es un hueco. Hay que **restarlo**, con su
              área, su momento estático y su momento de inercia.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna ecuación: **la placa sin la articulación
          A ni el cable**, con todo lo que actúa sobre ella.
        comprueba:
          - punto: |
              **En A, $A_x$ y $A_y$.**
            porque: |
              Es una articulación: sujeta en las dos direcciones, y no se sabe
              de antemano hacia dónde.
          - punto: |
              **En D, la tensión T a lo largo del cable, a 60°, tirando de la
              placa hacia la pared.**
            porque: |
              Un cable solo tira, y a lo largo de sí mismo. R en horizontal y
              $\sqrt{3}R$ en vertical dan los 60°.
          - punto: |
              **El peso, 10 kN, en G, el centro de gravedad de la placa
              recortada.**
            porque: |
              Es el punto que pide el apartado a, y no es el centro del
              rectángulo: el hueco lo mueve.
