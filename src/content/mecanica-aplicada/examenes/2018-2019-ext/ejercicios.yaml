      **Comprobación independiente.** Resolviendo el equilibrio de los cuatro
      nudos como un sistema lineal, con la viga CD sustituida por sus fuerzas
      de extremo, salen las mismas reacciones, 20 kN de tracción en AD, 26,32
      kN de compresión en BD y 9 kN en AC, y la barra AB sin esfuerzo.
