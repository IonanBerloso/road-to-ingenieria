      La placa es el rectángulo de 3R × 4R menos el medio disco de radio R. Con la placa homogénea, todo es proporcional al área: las áreas, los momentos estáticos y los momentos de inercia del hueco se restan de los del rectángulo. El centro del medio disco está a 4R/3π por debajo del diámetro.

      </figcaption>
      </figure>

      **2. Incógnitas.** $x_G$ e $y_G$; T, $A_x$ y $A_y$; e $I_X$.

      **3. Ecuaciones.** Con A en el origen y $R = 30$ cm. El rectángulo de
      $3R \times 4R$ tiene área $12R^{2}$ y centro en $(1{,}5R,\ 2R)$; el
      medio disco, área $\pi R^{2}/2$, centrado en $x = R$ y con su centro de
      gravedad en $y_c = 4R - 4R/3\pi$. El centro de gravedad de la placa:

      $$
      x_G = \frac{12R^{2}\cdot 1{,}5R - \frac{\pi R^{2}}{2}\cdot R}{12R^{2} - \frac{\pi R^{2}}{2}},
      \qquad
      y_G = \frac{12R^{2}\cdot 2R - \frac{\pi R^{2}}{2}\,y_c}{12R^{2} - \frac{\pi R^{2}}{2}}
      $$

      El equilibrio, con momentos respecto de A, antihorario positivo y D en
      $(3R,\ 4R)$:

      $$
      A_x + \frac{T}{2} = 0,
      \qquad
      A_y + \frac{\sqrt{3}}{2}\,T - 10 = 0,
      \qquad
      3R\cdot\frac{\sqrt{3}}{2}\,T - 4R\cdot\frac{T}{2} - 10\,x_G = 0
      $$

      Y el momento de inercia de área respecto de X: el del rectángulo
      respecto de su base, $3R\,(4R)^{3}/3 = 64R^{4}$, menos el del medio
      disco, llevado de su diámetro a su centro de gravedad y de ahí al eje X:

      $$
      I_{\text{hueco}} = \frac{\pi R^{4}}{8} - \frac{\pi R^{2}}{2}\left(\frac{4R}{3\pi}\right)^{2}
      + \frac{\pi R^{2}}{2}\,y_c^{2},
      \qquad
      I_X = \frac{m}{A}\left(64R^{4} - I_{\text{hueco}}\right)
      $$

      **4. Resultados.** a) El área y el centro de gravedad:

      $$
      A = \left(12 - \frac{\pi}{2}\right)R^{2} \approx 10{,}429\,R^{2},
      \qquad
      x_G = \frac{18 - \pi/2}{12 - \pi/2}\,R \approx 1{,}5753\,R \approx 47{,}26\ \text{cm},
      \qquad
      y_G \approx 1{,}7627\,R \approx 52{,}88\ \text{cm}
      $$

      b) La tensión, de la ecuación de momentos, y las reacciones:

      $$
      T = \frac{10\cdot 1{,}5753}{3\sqrt{3}/2 - 2} \approx 26{,}34\ \text{kN},
      \qquad
      A_x = -\frac{T}{2} \approx -13{,}17\ \text{kN},
      \qquad
      A_y = 10 - \frac{\sqrt{3}}{2}\,T \approx -12{,}81\ \text{kN}
      $$

      $$
      \vec{T} \approx 13{,}17\,\vec{\imath} + 22{,}81\,\vec{\jmath}\ \text{kN},
      \qquad
      \vec{F}_A \approx -13{,}17\,\vec{\imath} - 12{,}81\,\vec{\jmath}\ \text{kN}
      $$

      A tira de la placa hacia la izquierda y hacia **abajo**: el cable tira
      hacia arriba con más que el peso.

      c) El momento de inercia. El del hueco, $I_{\text{hueco}} \approx 20{,}19\,R^{4}$,
      y el de área de la placa:

      $$
      I_{\text{área}} \approx 64R^{4} - 20{,}19R^{4} = 43{,}81R^{4} \approx 0{,}3548\ \text{m}^{4}
      $$

      Con $m = 10\,000/9{,}81 \approx 1019$ kg y
      $A \approx 10{,}429\cdot 0{,}09 = 0{,}9386$ m²:

      $$
      I_X = \frac{m}{A}\,I_{\text{área}} \approx 385{,}4\ \text{kg·m}^{2}
      $$

      Con g = 9,8 saldría 385,8: la diferencia no llega al 0,1 %.

      **5. Comprobación.** Los momentos respecto de D, que no se han usado.
      El cable pasa por D y no da momento; A está a $(-3R,\ -4R)$ de D, y G, a
      $x_G - 3R$ en horizontal. En kN·R, antihorario positivo:

      $$
      -3\,A_y + 4\,A_x + 10\left(3 - 1{,}5753\right)
      = 38{,}43 - 52{,}68 + 14{,}25 = 0{,}00
      $$

      Por otro camino, fuera del alcance del examen —la placa recortada
      integrada numéricamente por franjas—, salen el mismo centro de gravedad y
      el mismo momento de área.

      **Lo que dice el resultado.** La tensión es más del doble del peso
      porque el cable pasa muy cerca de A. La recta AD forma con la horizontal
      un ángulo de $\arctan(4/3) \approx 53{,}1°$, y el cable va a 60°: solo
      6,9° fuera de ella, así que su brazo respecto de A es pequeño,
      $5R\,\sin 6{,}9° \approx 0{,}598R$. Si el cable fuera a lo largo de AD,
      no daría ningún momento y no podría sostener la placa; cuanto más se
      acerca a esa recta, más tiene que tirar, y más tiene que tirar hacia
      abajo la articulación.

  # ── Ejercicio 2 (n 4) · el pórtico articulado ABDC con la diagonal AD a 60°,
  #    la carga repartida en CD y la puntual P en el nudo C.
  - id: exma1819-ext-4-el-portico-articulado-y-su-viga
    titulo: El pórtico articulado y los diagramas de su viga
    fuente: >-
      Ejercicio 2 · Convocatoria extraordinaria de junio de 2019, Estática ·
      Mecánica Aplicada, Escuela de Ingeniería de Gipuzkoa (UPV/EHU).
      Transcrito de la columna en castellano; la figura está redibujada con sus
      cotas. P va hacia la derecha, como la dibuja la figura. El examen no
      publica resolución; el desarrollo es nuestro.
    nivel: examen
    antes:
      idea: |
        Las reacciones de una estructura salen de su equilibrio como un todo;
        lo que lleva cada pieza, de aislarla a ella o a los nudos que la unen
        con las demás. Y en una viga, el axil, el cortante y el flector de cada
        sección salen del equilibrio del trozo que queda a un lado del corte.
      formula: |
        El equilibrio en el plano:

        $$
        \sum F_x = 0 \qquad \sum F_y = 0 \qquad \sum M = 0
        $$

        En una viga con una carga repartida q hacia abajo, con V la suma de las
        fuerzas verticales a la izquierda del corte y M positivo si la viga se
        curva con la concavidad hacia arriba:

        $$
        \frac{dV}{dx} = -q
        \qquad
        \frac{dM}{dx} = V
        $$
      reconocer: |
        Antes de plantear se mira cómo está unida cada barra y qué carga lleva.
    enunciado: |
      **2. (3 puntos)** En la estructura de la figura todos los nudos están
      articulados. Sabiendo que la viga CD soporta una carga distribuida
      q=6 kN/m y que en el nudo C se aplica una carga puntual P=10 kN,
      calcular:

      **a.** Las reacciones en los nudos A y B.

      **b.** Diagramas de esfuerzo axial (N), cortante (V) y momento flector
      (M) en el elemento CD.

