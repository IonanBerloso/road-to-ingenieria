asignatura: mecanica-aplicada
curso: '2018-2019'
convocatoria: extraordinaria
fecha: 26 de junio de 2019
# La extraordinaria de junio de 2019 de Mecánica Aplicada, **su parte de
# Estática** (el bloque 1; la cabecera dice solo «Estática»). Es un PDF de
# tres páginas: la de teoría y una por ejercicio. La parte del bloque 2 del
# mismo día es otro PDF y otra convocatoria de este sitio, `2018-2019-2c-ext`.
#
# Bilingüe, con el castellano a la derecha **como imágenes de palabra**, igual
# que la ordinaria de mayo: se transcribe solo la columna en castellano,
# mirando la página renderizada, y nada se traduce del euskera (CLAUDE.md
# §17, «El volcado no es la página»).
#
# Tres cosas de ese texto:
#
# 1. **LOS PUNTOS SUMAN 10**: 1,5 + 1,5 en la teoría y 4 + 3 en los ejercicios.
#
# 2. **LA FECHA SE ESCRIBE DISTINTO EN CADA PÁGINA**: «26 deJUNIO de 2019», sin
#    espacio, en la de teoría, y «26 de JUNIO de 2019» en las otras dos. Es la
#    misma convocatoria.
#
# 3. **DOS NUMERACIONES**, como en mayo: la teoría son las cuestiones 1 y 2 y
#    los ejercicios vuelven a empezar en 1. Aquí las cuestiones son **n 1 y
#    2** y los ejercicios **n 3 (Ejercicio 1) y n 4 (Ejercicio 2)**; la
#    `fuente` de cada pieza dice el nombre impreso.
#
# El examen no publica resolución ni resultados: los desarrollos son nuestros,
# y cada respuesta se recalcula aparte en
# `tests/verificacion/mecanica-1819-ext.test.ts`.
pdf: 2018-2019-ext.pdf

ejercicios:
  # Teoría · cuestión 1 · el sistema equivalente de una carga parabólica.
  - id: exma1819-ext-1-la-carga-parabolica-y-su-resultante
    tema: t03-estatica
    n: 1
  # Teoría · cuestión 2 · el equilibrio de la rebanada con carga horizontal y
  # vertical.
  - id: exma1819-ext-2-la-rebanada-con-carga-en-las-dos-direcciones
    tema: t06-resistencia-de-materiales
    n: 2

  # Ejercicio 1 · la placa con un medio disco recortado, articulada en A y
  # colgada de un cable en D.
  - id: exma1819-ext-3-la-placa-recortada-colgada-de-un-cable
    tema: t02-geometria-de-masas
    n: 3

  # Ejercicio 2 · el pórtico articulado con la diagonal y la viga CD cargada.
  - id: exma1819-ext-4-el-portico-articulado-y-su-viga
    tema: t06-resistencia-de-materiales
    n: 4
