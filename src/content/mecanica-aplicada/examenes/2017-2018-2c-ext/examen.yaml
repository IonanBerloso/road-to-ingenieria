# La extraordinaria de junio de 2018 de Mecánica Aplicada, **su parte del
# bloque 2** («2. bloque: Dinámica» en la cabecera de la primera página). Es
# un PDF de dos páginas: la primera trae las dos cuestiones de teoría y el
# ejercicio 1, y la segunda, el ejercicio 2.
#
# Bilingüe, con el castellano a la derecha **como imágenes de palabra**: el
# volcado de texto solo saca la columna de euskera. Se transcribe solo la
# columna en castellano, mirando la página renderizada, y nada se traduce del
# euskera (CLAUDE.md §17, «El volcado no es la página»). Los apartados de las
# dos columnas son los mismos, así que no hay nada `fuera`.
#
# Cuatro cosas de ese texto, dichas antes de que nadie las deduzca:
#
# 1. **LOS PUNTOS SUMAN 10**: 1,5 + 1,5 en la teoría y 3 + 4 en los
#    ejercicios.
#
# 2. **LA SEGUNDA PÁGINA DICE «1. bloque: Cinemática y Dinámica»** en su
#    cabecera en castellano, y lo mismo la de euskera. Es una errata del
#    original: la fecha es la misma, el ejercicio es de dinámica y su número,
#    el 2, sigue al ejercicio 1 de la primera página. Se conserva y se declara
#    en la `fuente` del ejercicio 2.
#
# 3. **ERRATAS DEL TEXTO, CONSERVADAS**: las dos cuestiones ponen
#    «(1.5 punto)», con punto decimal y en singular; la 1 escribe «w» donde va
#    ω; la 2 lleva un espacio doble en «de  la», que al publicar no se ve. En
#    el ejercicio 1, el apartado a) va sin punto final y el c) escribe «BC .»,
#    con un espacio antes del punto; la figura rotula «R = 0.1 m», con punto
#    decimal. En el ejercicio 2, «constante ω .» lleva un espacio antes del
#    punto, los tres apartados van sin punto final, la figura de la derecha
#    rotula el radio con una «r» minúscula cuando los datos lo llaman R, y la
#    línea de datos escribe «R y L ,», con un espacio antes de la coma.
#    Ninguna cambia lo que se pide.
#
# 4. **LA LÍNEA DE DATOS DEL EJERCICIO 2 ES BILINGÜE EN UN SOLO RENGLÓN**:
#    empieza por «Datuak:» y una frase en euskera, sigue con «Masa, radio y
#    longitud del cilindro son M, R y L ,», intercala «Inertzi momentuak,» y
#    acaba en «momentos de inercia». Se transcriben solo los dos trozos en
#    castellano, que no llevan ningún «Datos:» delante.
#
# Y DOS NUMERACIONES, como en las de 2019: la teoría son las cuestiones 1 y 2
# y los ejercicios vuelven a empezar en 1. Aquí las cuestiones son **n 1 y 2**
# y los ejercicios **n 3 (Ejercicio 1) y n 4 (Ejercicio 2)**; la `fuente` de
# cada pieza dice el nombre impreso.
#
# El ejercicio 1 es **el mismo enunciado que el 8.9 de la colección del
# tema 8** (`ejma8-col89-el-disco-y-la-barra-bc-con-rodadura`): los mismos
# datos, la misma figura con su cuadrícula de R —la colección llama β al
# ángulo que aquí es α, y añade las marcas de 45° y la cota BA = 2√2R— y los
# mismos tres apartados; solo cambia que el examen parte en dos la primera
# frase. Su resolución se reutiliza, adaptada a los apartados y los puntos
# del examen.
#
# El examen no publica resolución ni resultados: los desarrollos son nuestros,
# y cada respuesta se recalcula aparte en
# `tests/verificacion/mecanica-1718-2c-ext.test.ts`.
pdf: 2017-2018-2c-ext.pdf

