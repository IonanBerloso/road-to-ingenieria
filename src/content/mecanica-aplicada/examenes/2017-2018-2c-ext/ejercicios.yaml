      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El CIR de la barra OA está a $2R$ de O y a $R$ de A, así que
              $v_O = 2$ m/s hacia abajo y $v_A = 1$ m/s hacia la izquierda.
          - texto: >-
              De $\cos(45^{\circ}+\alpha) = \sqrt{2}/4$ sale
              $\alpha \approx 24{,}3^{\circ}$, y descomponiendo $\vec{v}_A$ según
              BC y según AE, $\omega_2 \approx 9{,}11$ rad/s y
              $\omega_3 \approx 1{,}56$ rad/s, las dos horarias.
          - texto: >-
              Restando a $\vec{v}_A$ la velocidad del punto de BC que coincide
              con A, queda $\vec{v}_{A/BC} = (-0{,}689;\ 0{,}311)$ m/s, paralela a
              BC y hacia B.
          - texto: >-
              Como en E hay rodadura, el punto E tiene velocidad nula y sirve de
              CIR para el disco.
            trampa: true
            mensaje: |
              Rodadura entre dos sólidos significa que sus **dos** puntos de
              contacto llevan la misma velocidad, no que esa velocidad sea cero.
              Eso solo pasa cuando uno de los dos está fijo, y aquí la barra BC
              gira alrededor de B.
    resolucion: |
      **La geometría, con R = 0,1 m.** Tomando O en el origen, $A = (2R;\ R)$ y
      $B = (0;\ 3R)$, así que $BA = 2\sqrt{2}\,R$. La barra BC es tangente al
      disco en E, de modo que $AE \perp BC$ y

      $$
      BE = \sqrt{BA^{2} - R^{2}} = \sqrt{8R^{2} - R^{2}} = \sqrt{7}\,R
      $$

      que es la cota que da la figura. El ángulo α que forma AE con la vertical
      es el mismo que forma la barra con la horizontal, y sale de
      $\cos(45^{\circ} + \alpha) = R/BA = \sqrt{2}/4$:

      $$
      \alpha \approx 24{,}3^{\circ},
      \qquad
      \cos\alpha = \frac{1 + \sqrt{7}}{4} \approx 0{,}9114,
      \qquad
      \operatorname{sen}\alpha = \frac{\sqrt{7} - 1}{4} \approx 0{,}4114
      $$

      **a) Velocidades de O y A.** $\vec{v}_O$ es vertical, porque O corre por
      la deslizadera, y $\vec{v}_A$ horizontal, por la ranura. El CIR de la
      barra 1 está donde se cortan la horizontal por O y la vertical por A, en
      $I_1 = (2R;\ 0)$: a $2R$ de O y a $R$ de A. Con $\omega_1 = 10$ rad/s
      antihoraria:

      $$
      v_A = \omega_1 R = 10\cdot 0{,}1 = 1\ \text{m/s},
      \qquad
      v_O = \omega_1\cdot 2R = 10\cdot 0{,}2 = 2\ \text{m/s}
      $$

      es decir, $\vec{v}_A = -1\,\vec{\imath}$ m/s y
      $\vec{v}_O = -2\,\vec{\jmath}$ m/s: A va hacia la izquierda y O baja.

      **b) Velocidades angulares.** En E hay rodadura: el punto E del disco y el
      punto E de la barra llevan la **misma** velocidad, que no es nula porque
      la barra gira alrededor de B. La del punto de la barra es perpendicular a
      BC, o sea que va según AE; la del disco es
      $\vec{v}_A + \vec{\omega}_2\times\overrightarrow{AE}$. Proyectando las dos
      sobre BC y sobre AE:

      - sobre BC la barra no da nada, así que el giro del disco anula la componente de $\vec{v}_A$ según BC: $\omega_2 R = v_A\cos\alpha$;
      - sobre AE el giro del disco no da nada, así que la componente de $\vec{v}_A$ según AE es la velocidad del punto E de la barra: $\omega_3\,BE = v_A\operatorname{sen}\alpha$.

      $$
      \omega_2 = \frac{v_A\cos\alpha}{R} = \frac{1 + \sqrt{7}}{4}\cdot 10 \approx 9{,}114\ \text{rad/s},
      \qquad
      \omega_3 = \frac{v_A\operatorname{sen}\alpha}{\sqrt{7}\,R} = \frac{\sqrt{7} - 1}{4\,\sqrt{7}}\cdot 10 \approx 1{,}555\ \text{rad/s}
      $$

      Las dos horarias: $\vec{\omega}_2 \approx -9{,}114\,\vec{k}$ rad/s y
      $\vec{\omega}_3 \approx -1{,}555\,\vec{k}$ rad/s.

      **c) Velocidad de A respecto de BC.** A $\vec{v}_A$ se le resta la
      velocidad del punto de la barra BC —prolongada como sólido rígido— que en
      este instante coincide con A:

      $$
      \vec{v}_{A \in BC} = \vec{\omega}_3\times\overrightarrow{BA} = -1{,}555\,\vec{k}\times(0{,}2;\ -0{,}2;\ 0) = (-0{,}311;\ -0{,}311)\ \text{m/s}
      $$

      $$
      \vec{v}_{A/BC} = \vec{v}_A - \vec{v}_{A \in BC} = (-1;\ 0) - (-0{,}311;\ -0{,}311) = (-0{,}689;\ 0{,}311)\ \text{m/s}
      $$

      De módulo

      $$
      \left|\vec{v}_{A/BC}\right| = \sqrt{0{,}689^{2} + 0{,}311^{2}} \approx 0{,}756\ \text{m/s}
      $$

      y paralela a BC, apuntando de C hacia B: hacia arriba y a la izquierda,
      que es el dibujo que pide el apartado. Tenía que salir paralela: respecto de la
      barra, A se mueve sin acercarse a ella, porque el disco sigue apoyado. Y
      hay una forma exacta: respecto de la barra, el disco rueda sin deslizar
      sobre ella con velocidad angular $\omega_2 - \omega_3$ y el centro
      instantáneo en E, así que su centro va a $R\,|\omega_2 - \omega_3|$, que
      son 2/√7 m/s.

      Coincide con el $(-0{,}688;\ 0{,}312)$ m/s que publica la colección para
      su ejercicio 8.9, que es este mismo enunciado, y con la resolución del
      profesor, que da 0,756 m/s, 9,11 y 1,56 rad/s.

      **Comprobación independiente.** Moviendo el mecanismo en el tiempo —la
      barra OA girando a 10 rad/s, la barra BC siempre tangente al disco y el
      disco rodando sobre ella— y derivando numéricamente las posiciones salen
      las mismas velocidades de O y de A, los mismos giros del disco y de la
      barra y la misma velocidad de A respecto de BC, con sus sentidos.

  # ── Ejercicio 2 (n 4) · el cilindro de masa M, radio R y longitud L,
