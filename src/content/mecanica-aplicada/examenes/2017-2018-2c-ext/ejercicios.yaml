      <figcaption>

      El giro relativo se parte en dos: el **pivotamiento**, según la normal
      al plano tangente, y la **rodadura**, contenida en él. La velocidad de
      deslizamiento también está en el plano tangente: si tuviera componente
      normal, los sólidos se separarían o se atravesarían.

      </figcaption>
      </figure>

      **Los tres movimientos puros.**

      - Deslizamiento puro: $\vec{v}_{rel} \neq \vec{0}$ y $\vec{\omega}_r = \vec{0}$.
      - Pivotamiento puro: $\vec{\omega}_{piv} \neq \vec{0}$, $\vec{\omega}_{rod} = \vec{0}$ y $\vec{v}_{rel} = \vec{0}$.
      - Rodadura pura: $\vec{\omega}_{rod} \neq \vec{0}$, $\vec{\omega}_{piv} = \vec{0}$ y $\vec{v}_{rel} = \vec{0}$.

      En general hay de los tres a la vez. **Rodar sin deslizar** es
      $\vec{v}_{rel} = \vec{0}$: los dos puntos de contacto llevan la misma
      velocidad, que solo es nula si S₁ está quieto, y el eje instantáneo del
      movimiento relativo pasa por el punto de contacto.

      **Comprobación con números.** Con la normal $\hat{n} = (0;\ 0{,}8;\ 0{,}6)$,
      $\vec{\omega}_1 = (0,\,0,\,1)$ rad/s y $\vec{\omega}_2 = (2,\,1,\,4)$ rad/s,
      el giro relativo es $\vec{\omega}_r = (2,\,1,\,3)$ rad/s: su pivotamiento
      vale 2,6 rad/s y su rodadura, $\sqrt{7{,}24} \approx 2{,}691$ rad/s.
      Girando los ejes con una matriz de rotación hasta que la normal es el eje
      z, la tercera componente y el módulo de las otras dos dan las mismas dos
      cifras.

  # ── Cuestión 2 de teoría (n 2) · el trabajo de una fuerza sobre una
  #    partícula y su energía cinética. Deducción con `redactar`; la cuenta de
  #    comprobación usa una fuerza y una trayectoria nuestras.
  - id: exma1718-2cext-2-el-trabajo-de-una-fuerza-y-la-energia-cinetica
    titulo: El trabajo de una fuerza sobre una partícula, y su energía cinética
    fuente: >-
      Cuestión 2 de teoría · Convocatoria extraordinaria de junio de 2018,
      bloque 2 (Dinámica) · Mecánica Aplicada, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Transcrita de la columna en castellano, que en el PDF
      va como imagen; «(1.5 punto)» es del original, y también un espacio
      doble entre «de» y «la» que al publicar no se ve. El examen no publica
      resolución; el desarrollo y la comprobación son nuestros.
    nivel: examen
    enunciado: |
      **2. (1.5 punto)** En el caso de una partícula, determinar la expresión
      del trabajo realizado por una fuerza externa. Obtener la expresión de  la
      energía cinética de una partícula.
    pide: >-
      La expresión del trabajo de una fuerza sobre una partícula y la de su
      energía cinética, deducida del trabajo.
    pasos:
      - tipo: reconocer
        pregunta: |
          Una fuerza $\vec{F}$ actúa sobre una partícula que se desplaza
          $d\vec{r}$ por su trayectoria. ¿Cuál es el trabajo elemental?
        opciones:
          - texto: >-
              $dW = \vec{F}\cdot d\vec{r}$, un escalar: solo trabaja la
              componente de la fuerza tangente a la trayectoria
            correcta: true
            mensaje: |
              Eso es. El producto escalar se queda con la componente de
              $\vec{F}$ según el desplazamiento; la perpendicular a la
              trayectoria no trabaja, como la normal de una guía lisa.
          - texto: $dW = \vec{F}\times d\vec{r}$
            mensaje: |
              El producto vectorial da un vector perpendicular a los dos, y el
              trabajo es un escalar. Además, con él una fuerza en la dirección
              del movimiento no trabajaría nada, que es justo al revés.
          - texto: $dW = F\,ds$, el módulo de la fuerza por el arco recorrido
            mensaje: |
              Eso solo vale si la fuerza va a lo largo de la trayectoria. En
              general trabaja su componente tangente, $F_t\,ds$, que es lo que
              da el producto escalar.
          - texto: $dW = \vec{F}\,dt$
            mensaje: |
              Eso es el **impulso** elemental, que es un vector y lleva el
              tiempo. El trabajo lleva el desplazamiento, y es un escalar.

      - tipo: redactar
        que: deduccion
        consigna: |
          En papel, como lo entregarías: **el trabajo de una fuerza sobre una
          partícula**, elemental y entre dos posiciones, y **la energía cinética
          deducida de él** con la segunda ley de Newton. Media cara.
        rubrica:
          - punto: |
              **El trabajo elemental.** $dW = \vec{F}\cdot d\vec{r} = F_t\,ds$,
              con $F_t$ la componente tangente a la trayectoria y $ds$ el arco.
            porque: |
              Es la definición que pide la primera frase. Decir que solo trabaja
              la componente tangente es lo que la separa de «fuerza por
              distancia», que solo vale en un caso particular.
          - punto: |
              **El trabajo entre dos posiciones.**
              $W_{AB} = \int_A^B \vec{F}\cdot d\vec{r}$, a lo largo de la
              trayectoria; y la potencia, $P = dW/dt = \vec{F}\cdot\vec{v}$.
            porque: |
              La integral es sobre el camino que sigue la partícula y en general
              depende de él. Solo si la fuerza es conservativa queda
              $W_{AB} = V_A - V_B$, y hay que decirlo como caso particular.
          - punto: |
              **La segunda ley dentro del trabajo.** Con $\vec{F}$ la resultante,
              $\vec{F} = m\,d\vec{v}/dt$ y $d\vec{r} = \vec{v}\,dt$:
              $dW = m\,\vec{v}\cdot d\vec{v} = d\!\left(\tfrac{1}{2}mv^{2}\right)$.
            porque: |
              Es el paso central de la deducción: $\vec{v}\cdot d\vec{v}$ es
              $\tfrac{1}{2}d(v^{2})$. Y tiene que ser la **resultante**: con una
              fuerza cualquiera de las que actúan no sale la energía cinética.
          - punto: |
              **Integrar y nombrar.**
              $W_{AB} = \tfrac{1}{2}mv_B^{2} - \tfrac{1}{2}mv_A^{2}$, así que la
              energía cinética es $T = \tfrac{1}{2}mv^{2}$, y el resultado es el
              teorema de la energía cinética.
            porque: |
              La cuestión pide «obtener» la energía cinética, no recitarla: sale
              como la magnitud cuyo incremento es el trabajo de la resultante.
              Un escalar, nunca negativo, que no depende de la dirección de la
              velocidad.

      - tipo: calcular
        titulo: El trabajo de la fuerza
        pregunta: |
          Comprobación con valores nuestros: una partícula de 2 kg, sobre la que
          solo actúa la fuerza constante $\vec{F} = (6,\,-2)$ N, pasa por
          $A = (0,\,0)$ m con una velocidad de 3 m/s y más tarde por
          $B = (6,\,4)$ m. ¿Cuánto trabajo hace $\vec{F}$ entre A y B?
        respuesta:
          tipo: magnitud
          valor: '28 J'
          tolerancia: 0.005
          formato: con su unidad, en J
        distractores:
          - valor: '45.61 J'
            mensaje: |
              Es el módulo de la fuerza por el del desplazamiento,
              $\sqrt{40}\cdot\sqrt{52}$. Eso solo vale si la fuerza va en la
              dirección del desplazamiento; aquí forman un ángulo, y el trabajo
              es el producto escalar.
          - valor: '44 J'
            mensaje: |
              Has sumado $6\cdot 6 + 2\cdot 4$. La componente y de la fuerza es
              $-2$ N y la partícula sube 4 m: esa componente trabaja en contra,
              $(-2)\cdot 4 = -8$ J.
        pista: |
          Con la fuerza constante, $\int_A^B \vec{F}\cdot d\vec{r} = \vec{F}\cdot\overrightarrow{AB}$,
          sea cual sea la trayectoria.
        desarrollo: |
          $$
          W = \vec{F}\cdot\overrightarrow{AB} = 6\cdot 6 + (-2)\cdot 4 = 28\ \text{J}
          $$

          No hace falta saber por dónde va la partícula: una fuerza constante
          da el mismo trabajo por cualquier camino entre A y B.

      - tipo: calcular
        titulo: La velocidad en B
        pregunta: |
          ¿Con qué velocidad pasa la partícula por B?
        respuesta:
          tipo: magnitud
          valor: '6.083 m/s'
          tolerancia: 0.005
          formato: con su unidad, en m/s
        distractores:
          - valor: '5.292 m/s'
            mensaje: |
              Es $\sqrt{2W/m}$: supone que la partícula parte del reposo. El
              trabajo da el **incremento** de energía cinética, y en A ya
              llevaba 9 J.
          - valor: '8.292 m/s'
            mensaje: |
              Has sumado la velocidad de A y la que da el trabajo desde el
              reposo, $3 + 5{,}292$. Se suman energías, no velocidades.
          - valor: '4.796 m/s'
            mensaje: |
              Te has dejado el $\tfrac{1}{2}$ de la energía cinética: con
              $W = m\,(v_B^{2} - v_A^{2})$ sale $v_B = \sqrt{23}$. Es
              $T = \tfrac{1}{2}mv^{2}$.
        pista: |
          $W = \tfrac{1}{2}m\,v_B^{2} - \tfrac{1}{2}m\,v_A^{2}$, porque $\vec{F}$
          es la única fuerza.
        desarrollo: |
          $$
          v_B = \sqrt{v_A^{2} + \frac{2W}{m}} = \sqrt{3^{2} + 28} = \sqrt{37} \approx 6{,}083\ \text{m/s}
          $$

      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              El trabajo elemental es $dW = \vec{F}\cdot d\vec{r}$, y entre A y B,
              $W_{AB} = \int_A^B \vec{F}\cdot d\vec{r}$ a lo largo de la
              trayectoria.
          - texto: >-
              Si $\vec{F}$ es la resultante, $\vec{F} = m\,d\vec{v}/dt$, y con
              $d\vec{r} = \vec{v}\,dt$ queda
              $dW = m\,\vec{v}\cdot d\vec{v} = d\!\left(\tfrac{1}{2}mv^{2}\right)$.
          - texto: >-
              Integrando, $W_{AB} = \tfrac{1}{2}mv_B^{2} - \tfrac{1}{2}mv_A^{2}$:
              la energía cinética es $T = \tfrac{1}{2}mv^{2}$.
          - texto: >-
              El trabajo de cualquier fuerza entre A y B depende solo de A y de
              B, no del camino.
            trampa: true
            mensaje: |
              Eso solo lo cumplen las fuerzas **conservativas**, las que derivan
              de un potencial: el peso, un muelle. El trabajo del rozamiento, por
              ejemplo, crece en valor absoluto con la longitud del camino. En
              general el trabajo es la integral a lo largo de la trayectoria.
    resolucion: |
      **El trabajo de una fuerza.** Una fuerza $\vec{F}$ actúa sobre una
      partícula que recorre su trayectoria. En un desplazamiento elemental
      $d\vec{r}$, el trabajo elemental es el producto escalar

      $$
      dW = \vec{F}\cdot d\vec{r} = F_t\,ds
      $$

      donde $F_t$ es la componente de la fuerza tangente a la trayectoria y
      $ds$ el arco recorrido: la componente normal no trabaja. Entre dos
      posiciones A y B,

      $$
      W_{AB} = \int_A^B \vec{F}\cdot d\vec{r}
      $$

      a lo largo de la trayectoria, que en general depende del camino. Si la
      fuerza es conservativa, $\vec{F} = -\nabla V$, depende solo de los
      extremos: $W_{AB} = V_A - V_B$. El trabajo por unidad de tiempo es la
      potencia, $P = \vec{F}\cdot\vec{v}$.

      **La energía cinética.** Si $\vec{F}$ es la resultante de las fuerzas que
      actúan sobre la partícula, la segunda ley de Newton dice
      $\vec{F} = m\,d\vec{v}/dt$, y con $d\vec{r} = \vec{v}\,dt$:

      $$
      dW = m\,\frac{d\vec{v}}{dt}\cdot\vec{v}\,dt = m\,\vec{v}\cdot d\vec{v} = d\!\left(\frac{1}{2}\,m\,v^{2}\right)
      $$

      porque $\vec{v}\cdot d\vec{v} = \tfrac{1}{2}\,d\left(\vec{v}\cdot\vec{v}\right)$.
      Integrando entre A y B:

      $$
      W_{AB} = \frac{1}{2}\,m\,v_B^{2} - \frac{1}{2}\,m\,v_A^{2}
      $$

      La magnitud que aparece es la **energía cinética** de la partícula,
      $T = \tfrac{1}{2}mv^{2}$: un escalar, nunca negativo, que no depende de la
      dirección de la velocidad. Y la igualdad es el **teorema de la energía
      cinética**: el trabajo de la resultante es el incremento de $T$.

      **Comprobación con números.** Una partícula de 2 kg, con la fuerza
      constante $\vec{F} = (6,\,-2)$ N como única fuerza, pasa por
      $A = (0,\,0)$ m a 3 m/s y después por $B = (6,\,4)$ m. El trabajo es
      $6\cdot 6 + (-2)\cdot 4 = 28$ J, y la velocidad en B,
      $\sqrt{3^{2} + 28} = \sqrt{37} \approx 6{,}083$ m/s. Integrando
      $\vec{F}\cdot d\vec{r}$ sobre la parábola que recorre de verdad la
      partícula, y sacando la velocidad en B de sus ecuaciones del movimiento,
      salen los mismos dos números.

  # ── Ejercicio 1 (n 3) · la barra OA con O en una deslizadera vertical y A en
  #    una ranura horizontal, el disco de centro A y la barra BC que rueda
  #    sobre él. Es el 8.9 de la colección, con α donde la colección pone β.
  - id: exma1718-2cext-3-el-disco-que-rueda-sobre-la-barra-bc
    titulo: El disco que rueda sobre la barra BC apoyada en él
    fuente: >-
      Ejercicio 1 · Convocatoria extraordinaria de junio de 2018, bloque 2
      (Dinámica) · Mecánica Aplicada, Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU). Transcrito de la columna en castellano, que en el PDF va como
      imagen; la figura está redibujada a escala con su cuadrícula de R. Son
      del original el «R = 0.1 m» de la figura, con punto decimal, el apartado
      a) sin punto final y el espacio antes del punto en «BC .». Es el mismo
      enunciado que el ejercicio 8.9 de la colección del tema 8, con los mismos
      datos, la misma figura y los mismos tres apartados, aunque la colección
      llama β al ángulo que la figura del examen llama α; la resolución
      reutiliza la de ese ejercicio, contrastada con el resultado que publica
      la colección y con la resolución del profesor. El examen no publica
      resolución.
    nivel: examen
    enunciado: |
      **1. (3 puntos)** En el sistema de la figura, la barra OA (1) gira con
      velocidad angular $\omega_1$=10 rad/s en sentido antihorario. La barra OA
      está articulada a una deslizadera vertical (punto O) y al disco (2) de
      radio R. El punto A puede moverse a lo largo de una ranura horizontal. La
      barra BC (3) está apoyada sobre el disco (2) existiendo rodadura en el
      punto de contacto E. Calcular:

      **a)** (0,5 puntos) Velocidades de los puntos O y A

      **b)** (1,5 puntos) Velocidades angulares del disco y de la barra BC.

      **c)** (1 punto) Velocidad del centro A del disco con respecto a la barra
      BC . Dibujar dirección y sentido del vector.

