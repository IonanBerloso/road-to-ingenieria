    pide: >-
      Las velocidades de O y A, las velocidades angulares del disco y de la
      barra BC, y la velocidad de A respecto de BC con su dirección y su
      sentido.
    pasos:
      - tipo: reconocer
        pregunta: |
          O corre por una guía vertical y A por una ranura horizontal. ¿Dónde
          está el CIR de la barra OA?
        opciones:
          - texto: Donde se cortan la horizontal por O y la vertical por A
            correcta: true
            mensaje: |
              Eso es. $\vec{v}_O$ es vertical y $\vec{v}_A$ horizontal, así que
              sus perpendiculares son la horizontal por O y la vertical por A:
              se cortan a $2R$ de O y a $R$ de A.
          - texto: En A, porque es el centro del disco
            mensaje: |
              Ser el centro de un disco no da velocidad nula. De hecho A se
              mueve a $\omega_1 R = 1$ m/s por su ranura, y el CIR queda justo
              debajo de él.
          - texto: En el punto E, porque allí hay rodadura
            mensaje: |
              En E ruedan el **disco** y la **barra BC**, y eso significa que sus
              dos puntos de contacto llevan la misma velocidad, no que esa
              velocidad sea nula. E no es el CIR de nadie aquí.

      - tipo: calcular
        titulo: La velocidad del punto O
        pregunta: |
          ¿Cuánto vale la velocidad de O, en m/s? (Va hacia abajo.)
        respuesta:
          tipo: magnitud
          valor: '2 m/s'
          tolerancia: 0.01
          formato: con su unidad, en m/s
        distractores:
          - valor: '1 m/s'
            mensaje: |
              Esa es la de A, que está a $R$ del CIR. O está a $2R$, y en un
              giro la velocidad es proporcional a la distancia al centro
              instantáneo.
          - valor: '2.236 m/s'
            mensaje: |
              Has usado la longitud entera de la barra, $|OA| = \sqrt{5}\,R$.
              Lo que manda es la distancia de O al CIR, que vale $2R$.
        pista: |
          El CIR está a $2R$ de O, en su misma horizontal.
        desarrollo: |
          $$
          v_O = \omega_1\cdot 2R = 10\cdot 0{,}2 = 2\ \text{m/s}
          $$

          Hacia abajo: $\vec{v}_O = -2\,\vec{\jmath}$ m/s.

      - tipo: calcular
        titulo: La velocidad del punto A
        pregunta: |
          ¿Cuánto vale la velocidad de A, en m/s? (Va hacia la izquierda.)
        respuesta:
          tipo: magnitud
          valor: '1 m/s'
          tolerancia: 0.01
          formato: con su unidad, en m/s
        distractores:
          - valor: '2 m/s'
            mensaje: |
              Esa es la de O, que está a $2R$ del CIR. A está solo a $R$, justo
              encima de él.
          - valor: '2.236 m/s'
            mensaje: |
              Has usado $|OA| = \sqrt{5}\,R$ como brazo. El brazo es la distancia
              de A al CIR, que vale $R$.
        pista: |
          El CIR está a $R$ por debajo de A, así que $v_A = \omega_1 R$.
        desarrollo: |
          $$
          v_A = \omega_1 R = 10\cdot 0{,}1 = 1\ \text{m/s}
          $$

          Hacia la izquierda: $\vec{v}_A = -1\,\vec{\imath}$ m/s.

      - tipo: calcular
        titulo: La velocidad angular del disco
        pregunta: |
          ¿Cuánto vale $\omega_2$, en rad/s y en valor absoluto? (Es horaria.)
        respuesta:
          tipo: numero
          valor: '9.114'
          tolerancia: 0.02
          formato: un número, en rad/s
        distractores:
          - valor: '10'
            mensaje: |
              Ese número sale de suponer que E está quieto, es decir de tomar E
              como CIR del disco. Pero E es el contacto con una barra que
              **también se mueve**, y lo único que impone la rodadura es que los
              dos puntos lleven la misma velocidad.
          - valor: '4.114'
            mensaje: |
              Has usado $\operatorname{sen}\alpha$ donde va $\cos\alpha$. La
              componente de $\vec{v}_A$ que hace girar al disco es la paralela a
              BC, perpendicular a AE, y esa lleva el coseno.
        pista: |
          De $\cos(45^{\circ}+\alpha) = \sqrt{2}/4$ sale $\alpha \approx 24{,}3^{\circ}$.
          Proyectando sobre BC, $\omega_2 R = v_A\cos\alpha$.
        desarrollo: |
          $$
          \omega_2 = \frac{v_A}{R}\cos\alpha = 10\cdot 0{,}9114 \approx 9{,}114\ \text{rad/s}
          $$

          Horaria: $\vec{\omega}_2 \approx -9{,}114\,\vec{k}$ rad/s.

      - tipo: calcular
        titulo: La velocidad angular de la barra BC
        pregunta: |
          ¿Cuánto vale $\omega_3$, en rad/s y en valor absoluto? (También es
          horaria.)
        respuesta:
          tipo: numero
          valor: '1.555'
          tolerancia: 0.01
          formato: un número, en rad/s
        distractores:
          - valor: '9.114'
            mensaje: |
              Esa es la del disco. En una rodadura los dos sólidos comparten la
              velocidad del punto de contacto, no la velocidad angular: cada uno
              gira alrededor de un sitio distinto.
          - valor: '0.588'
            mensaje: |
              Parece que has dividido entre $7R$ en vez de entre $\sqrt{7}\,R$.
              La distancia de B a E es $\sqrt{7}\,R \approx 0{,}2646$ m.
        pista: |
          Proyectando sobre AE, $\omega_3\,BE = v_A\operatorname{sen}\alpha$, con
          $BE = \sqrt{7}\,R$.
        desarrollo: |
          $$
          \omega_3 = \frac{v_A\operatorname{sen}\alpha}{\sqrt{7}\,R} = \frac{1\cdot 0{,}4114}{0{,}2646} \approx 1{,}555\ \text{rad/s}
          $$

          Horaria: $\vec{\omega}_3 \approx -1{,}555\,\vec{k}$ rad/s.

      - tipo: calcular
        titulo: La velocidad de A respecto de la barra BC
        pregunta: |
          ¿Cuánto vale el módulo de $\vec{v}_{A/BC}$, en m/s?
        respuesta:
          tipo: magnitud
          valor: '0.756 m/s'
          tolerancia: 0.01
          formato: con su unidad, en m/s
        distractores:
          - valor: '1 m/s'
            mensaje: |
              Ese es el módulo de $\vec{v}_A$ a secas. La velocidad **relativa**
              se obtiene restando la del punto de la barra BC que en este
              instante coincide con A, que no es nula.
          - valor: '0.44 m/s'
            mensaje: |
              Ese es el módulo de $\vec{v}_{A \in BC} = \omega_3\,BA$, el
              sustraendo. Falta restarlo de $\vec{v}_A$, y como los dos vectores
              no son paralelos hay que hacerlo en componentes.
        pista: |
          $\vec{v}_{A/BC} = \vec{v}_A - \vec{\omega}_3 \times \overrightarrow{BA}$,
          con $\overrightarrow{BA} = (0{,}2;\ -0{,}2)$ m.
        desarrollo: |
          $$
          \vec{v}_{A \in BC} = -1{,}555\,\vec{k} \times (0{,}2;\ -0{,}2;\ 0) = (-0{,}311;\ -0{,}311)\ \text{m/s}
          $$

          $$
          \vec{v}_{A/BC} = (-1;\ 0) - (-0{,}311;\ -0{,}311) = (-0{,}689;\ 0{,}311)\ \text{m/s}
          $$

          $$
          \left|\vec{v}_{A/BC}\right| = \sqrt{0{,}689^{2} + 0{,}311^{2}} \approx 0{,}756\ \text{m/s}
          $$

      - tipo: dibujar
        consigna: |
          El apartado c) pide dibujar la dirección y el sentido de
          $\vec{v}_{A/BC}$. Dibújalo en la figura, aplicado en A, y al lado el
          triángulo de velocidades del que sale.
        comprueba:
          - punto: |
              **Paralelo a la barra BC.**
            porque: |
              Respecto de la barra, A se mueve sin acercarse ni alejarse de BC
              —el disco sigue apoyado en ella, con A siempre a una distancia R—,
              así que su velocidad relativa no tiene componente perpendicular a
              BC.
          - punto: |
              **Hacia B**: hacia arriba y a la izquierda, de C a B.
            porque: |
              Es lo que dicen los signos de $(-0{,}689;\ 0{,}311)$ m/s. El disco
              va hacia la pared, y respecto de la barra su centro avanza hacia
              B.
          - punto: |
              **El triángulo**: $\vec{v}_A = \vec{v}_{A \in BC} + \vec{v}_{A/BC}$,
              con $\vec{v}_{A \in BC}$ perpendicular a BA.
            porque: |
              Es la composición de velocidades del movimiento relativo. Quien
              dibuja $\vec{v}_A$ como si fuera la relativa se deja la de
              arrastre, que aquí vale 0,44 m/s.
          - punto: |
              **Su módulo, 0,756 m/s**, rotulado junto al vector.
            porque: |
              La dirección y el sentido son lo que pide el dibujo, pero sin el
              módulo el vector no se puede comprobar contra el apartado c).
        figura: |
          <svg viewBox="0 0 400 285" role="img" width="400" height="285"
               aria-labelledby="ma17182cx3dt ma17182cx3dd">
            <title id="ma17182cx3dt">La velocidad de A respecto de la barra BC, dibujada sobre el mecanismo</title>
            <desc id="ma17182cx3dd">El mismo mecanismo del enunciado. En A, el
            centro del disco, sale la velocidad de A respecto de la barra BC:
            paralela a la barra, hacia arriba y a la izquierda, apuntando a B, de
            0,756 metros por segundo. Al lado, el triángulo de velocidades: la
