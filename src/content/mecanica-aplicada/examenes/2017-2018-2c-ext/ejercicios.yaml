ejercicios:
  # ── Cuestión 1 de teoría (n 1) · el movimiento relativo de dos sólidos en
  #    contacto. Es una deducción: se escribe con `redactar`, y las cuentas de
  #    comprobación usan una normal y dos velocidades angulares nuestras,
  #    dichas en la pregunta.
  - id: exma1718-2cext-1-rodadura-y-pivotamiento-en-el-contacto
    titulo: Rodadura y pivotamiento, el movimiento relativo de dos sólidos en contacto
    fuente: >-
      Cuestión 1 de teoría · Convocatoria extraordinaria de junio de 2018,
      bloque 2 (Dinámica) · Mecánica Aplicada, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Transcrita de la columna en castellano, que en el PDF
      va como imagen; «(1.5 punto)», con punto decimal y en singular, y la «w»
      escrita donde va ω son del original. El examen no publica resolución; el
      desarrollo y la comprobación son nuestros.
    nivel: examen
    enunciado: |
      **1. (1.5 punto)** Explicar el movimiento relativo de dos sólidos rígidos
      en contacto, determinando las componentes de velocidad angular w
      rodadura y w pivotamiento.
    pide: >-
      Qué es el movimiento relativo de dos sólidos en contacto: la velocidad de
      deslizamiento y las componentes de rodadura y de pivotamiento de la
      velocidad angular relativa.
    pasos:
      - tipo: reconocer
        pregunta: |
          Dos sólidos se tocan en un punto. ¿Qué componente de la velocidad
          angular relativa $\vec{\omega}_r$ es la de **pivotamiento**?
        opciones:
          - texto: >-
              La proyección de $\vec{\omega}_r$ sobre la normal al plano
              tangente del contacto
            correcta: true
            mensaje: |
              Eso es. Pivotar es girar alrededor de la normal, sobre el propio
              punto de contacto, como una peonza sobre la mesa. Lo que queda de
              $\vec{\omega}_r$, contenido en el plano tangente, es la rodadura.
          - texto: La componente de $\vec{\omega}_r$ contenida en el plano tangente
            mensaje: |
              Esa es la de **rodadura**: un eje de giro tumbado en el plano
              tangente es el de una rueda que avanza por el suelo. El
              pivotamiento va según la normal.
          - texto: >-
              La velocidad relativa de los dos puntos de contacto,
              $\vec{v}_B - \vec{v}_A$
            mensaje: |
              Eso es una velocidad, no una velocidad angular: es la velocidad
              de **deslizamiento**, y está en el plano tangente. La cuestión
              pide las dos componentes de $\vec{\omega}_r$.
          - texto: >-
              La velocidad angular del sólido de arriba, $\vec{\omega}_2$,
              proyectada sobre la normal
            mensaje: |
              Falta restar la del otro sólido. El pivotamiento es del movimiento
              **relativo**, con $\vec{\omega}_r = \vec{\omega}_2 - \vec{\omega}_1$;
              solo coinciden si el sólido de abajo está quieto.

      - tipo: redactar
        que: deduccion
        consigna: |
          La cuestión en papel, como la entregarías: los dos sólidos en contacto
          con el plano tangente y la normal, la velocidad de deslizamiento y por
          qué está en el plano tangente, la descomposición de la velocidad
          angular relativa en rodadura y pivotamiento, y los tres movimientos
          puros. Media cara y un dibujo.
        rubrica:
          - punto: |
              **El planteamiento.** S₁ y S₂ se tocan en un punto: A es el de S₁
              y B el de S₂, π el plano tangente común y $\hat{n}$ su normal. El
              movimiento de S₂ respecto de S₁ tiene velocidad angular
              $\vec{\omega}_r = \vec{\omega}_2 - \vec{\omega}_1$, y en el
              contacto, $\vec{v}_{rel} = \vec{v}_B - \vec{v}_A$.
            porque: |
              Todo lo demás se define respecto de π y de $\hat{n}$: sin el plano
              tangente no se puede decir qué es rodar y qué es pivotar. Y la
              velocidad angular es la relativa, la diferencia; la de S₂ sola
              solo vale si S₁ está quieto.
          - punto: |
              **La velocidad de deslizamiento está en π.** A no puede penetrar
              en S₂ ni B en S₁, y mientras se tocan tampoco se separan, así que
              $\vec{v}_{rel}\cdot\hat{n} = 0$.
            porque: |
              Es la condición de que el contacto se mantiene, y lo que convierte
              $\vec{v}_{rel}$ en una velocidad de **deslizamiento**. Hay que
              decir el porqué, no solo afirmarlo.
          - punto: |
              **Las dos componentes.** $\vec{\omega}_{piv} = (\vec{\omega}_r\cdot\hat{n})\,\hat{n}$,
              normal a π, y $\vec{\omega}_{rod} = \vec{\omega}_r - \vec{\omega}_{piv}$,
              contenida en π.
            porque: |
              Es lo que la cuestión pide con nombre propio. Pivotar es girar
              alrededor de la normal —una peonza— y rodar, alrededor de un eje
              del plano tangente —una rueda—.
          - punto: |
              **Los tres movimientos puros.** Deslizamiento puro:
              $\vec{v}_{rel} \neq \vec{0}$ y $\vec{\omega}_r = \vec{0}$.
              Pivotamiento puro: $\vec{\omega}_{piv} \neq \vec{0}$,
              $\vec{\omega}_{rod} = \vec{0}$ y $\vec{v}_{rel} = \vec{0}$.
              Rodadura pura: $\vec{\omega}_{rod} \neq \vec{0}$,
              $\vec{\omega}_{piv} = \vec{0}$ y $\vec{v}_{rel} = \vec{0}$.
            porque: |
              Son los tres casos que nombra el tema; en general hay de los tres
              a la vez. Cada uno se define por lo que hay y por lo que no hay:
              quien dice solo «hay giro según la normal» no distingue el
              pivotamiento puro de un pivotamiento con deslizamiento.
          - punto: |
              **Rodar sin deslizar no es tener velocidad nula.** Con
              $\vec{v}_{rel} = \vec{0}$ los dos puntos de contacto llevan la
              misma velocidad, que solo es cero si S₁ está fijo.
            porque: |
              Es el error que tumba el ejercicio 1 de este mismo examen: allí la
              barra BC sobre la que rueda el disco también se mueve, y tomar el
              contacto E como un punto quieto da un giro del disco equivocado.

      - tipo: calcular
        titulo: La componente de pivotamiento
        pregunta: |
          Comprobación con valores nuestros: en el contacto, la normal común es
          $\hat{n} = (0;\ 0{,}8;\ 0{,}6)$, el sólido S₁ gira con
          $\vec{\omega}_1 = (0,\,0,\,1)$ rad/s y el S₂ con
          $\vec{\omega}_2 = (2,\,1,\,4)$ rad/s. ¿Cuánto vale la componente de
          pivotamiento, $\vec{\omega}_r\cdot\hat{n}$, en rad/s?
        respuesta:
          tipo: numero
          valor: '2.6'
          tolerancia: 0.01
          formato: un número, en rad/s
        distractores:
          - valor: '3'
            mensaje: |
              Es la componente z de $\vec{\omega}_r = (2,\,1,\,3)$: supone que la
              normal es el eje z. La normal es $\hat{n} = (0;\ 0{,}8;\ 0{,}6)$, y
              hay que proyectar sobre ella.
          - valor: '3.2'
            mensaje: |
              Es $\vec{\omega}_2\cdot\hat{n}$: no has restado $\vec{\omega}_1$. El
              pivotamiento es del giro **relativo**, y S₁ también gira.
        pista: |
          Primero $\vec{\omega}_r = \vec{\omega}_2 - \vec{\omega}_1$; después, el
          producto escalar con $\hat{n}$.
        desarrollo: |
          $$
          \vec{\omega}_r = (2,\,1,\,4) - (0,\,0,\,1) = (2,\,1,\,3)\ \text{rad/s}
          $$

          $$
          \omega_{piv} = \vec{\omega}_r\cdot\hat{n} = 2\cdot 0 + 1\cdot 0{,}8 + 3\cdot 0{,}6 = 2{,}6\ \text{rad/s}
          $$

      - tipo: calcular
        titulo: La componente de rodadura
        pregunta: |
          Y con los mismos valores, ¿cuánto vale el módulo de la componente de
          rodadura, en rad/s?
        respuesta:
          tipo: numero
          valor: '2.691'
          tolerancia: 0.01
          formato: un número, en rad/s
        distractores:
          - valor: '3.742'
            mensaje: |
              Es el módulo de $\vec{\omega}_r$ entero, $\sqrt{14}$. Falta quitarle
              la parte normal: la rodadura es lo que queda en el plano tangente.
          - valor: '2.236'
            mensaje: |
              Es $\sqrt{2^{2} + 1^{2}}$, las componentes x e y de
              $\vec{\omega}_r$: supone que el plano tangente es el xy. Aquí es el
              perpendicular a $\hat{n} = (0;\ 0{,}8;\ 0{,}6)$.
          - valor: '3.28'
            mensaje: |
              Has descompuesto $\vec{\omega}_2$ en lugar de $\vec{\omega}_r$. La
              rodadura también es del giro relativo: resta antes
              $\vec{\omega}_1$.
        pista: |
          $\vec{\omega}_{rod} = \vec{\omega}_r - \omega_{piv}\,\hat{n}$, con
          $\omega_{piv} = 2{,}6$ rad/s.
        desarrollo: |
          $$
          \vec{\omega}_{rod} = (2,\,1,\,3) - 2{,}6\,(0;\ 0{,}8;\ 0{,}6) = (2;\ -1{,}08;\ 1{,}44)\ \text{rad/s}
          $$

          $$
          \omega_{rod} = \sqrt{2^{2} + 1{,}08^{2} + 1{,}44^{2}} = \sqrt{7{,}24} \approx 2{,}691\ \text{rad/s}
          $$

          Y cuadra con el total: $2{,}6^{2} + 2{,}691^{2} \approx 14$, que es
          $|\vec{\omega}_r|^{2}$.

      - tipo: justificar
        pregunta: Ordena la explicación. Una pieza es falsa.
        piezas:
          - texto: >-
              Se estudia el movimiento de S₂ respecto de S₁: velocidad angular
              $\vec{\omega}_r = \vec{\omega}_2 - \vec{\omega}_1$ y, en el
              contacto, $\vec{v}_{rel} = \vec{v}_B - \vec{v}_A$.
          - texto: >-
              Como A y B no pueden separarse ni penetrar, $\vec{v}_{rel}$ no
              tiene componente normal: está en el plano tangente π y es la
              velocidad de deslizamiento.
          - texto: >-
              $\vec{\omega}_r$ se descompone en $\vec{\omega}_{piv}$, según la
              normal, y $\vec{\omega}_{rod}$, contenida en π.
          - texto: >-
              Deslizamiento puro es $\vec{v}_{rel} \neq \vec{0}$ sin giro
              relativo; en el pivotamiento y la rodadura puros
              $\vec{v}_{rel} = \vec{0}$ y solo hay una de las dos componentes.
          - texto: >-
              Si hay rodadura, el punto de contacto B del sólido S₂ tiene
              velocidad nula.
            trampa: true
            mensaje: |
              Lo que se anula es $\vec{v}_{rel} = \vec{v}_B - \vec{v}_A$: los
              dos puntos llevan la misma velocidad. Que sea cero solo pasa si S₁
              está quieto, como el suelo bajo una rueda. En el ejercicio 1 de
              este examen la barra BC gira, y el punto de contacto del disco no
              está quieto.
    resolucion: |
      **El planteamiento.** Dos sólidos S₁ y S₂ se tocan en un punto. En cada
      instante, A es el punto de S₁ y B el de S₂ que coinciden allí; π es el
      plano tangente común y $\hat{n}$ su normal. El movimiento de S₂ visto
      desde S₁ es también el de un sólido rígido, con velocidad angular
      relativa

      $$
      \vec{\omega}_r = \vec{\omega}_2 - \vec{\omega}_1
      $$

      **La velocidad de deslizamiento.** La velocidad de B respecto de S₁ es

      $$
      \vec{v}_{rel} = \vec{v}_B - \vec{v}_A
      $$

      Mientras dura el contacto, A no puede penetrar en S₂ ni B en S₁, y
      tampoco pueden separarse: $\vec{v}_{rel}$ no tiene componente según
      $\hat{n}$, así que está contenida en π. Es la **velocidad de
      deslizamiento** del contacto.

      **Rodadura y pivotamiento.** La velocidad angular relativa se descompone
      en una componente normal a π y otra contenida en π:

      $$
      \vec{\omega}_{piv} = \left(\vec{\omega}_r\cdot\hat{n}\right)\hat{n},
      \qquad
      \vec{\omega}_{rod} = \vec{\omega}_r - \vec{\omega}_{piv}
      $$

      La primera es la de **pivotamiento**: S₂ gira sobre el punto de contacto
      alrededor de la normal, como una peonza sobre la mesa. La segunda es la
      de **rodadura**: un giro alrededor de un eje tumbado en el plano
      tangente, como el de una rueda que avanza.

