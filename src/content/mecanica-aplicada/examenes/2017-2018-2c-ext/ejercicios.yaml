      Masa, radio y longitud del cilindro son M, R y L , momentos de inercia

      $$
      I_x = I_y = \frac{M}{12}\left(3R^{2} + L^{2}\right) \qquad I_z = \frac{M}{2}R^{2}
      $$
    pide: >-
      El momento angular respecto de G, su derivada y las reacciones estáticas
      y dinámicas en los cojinetes A y B.
    pasos:
      - tipo: reconocer
        pregunta: |
          $\vec{\omega}$ va según el eje AB. ¿En qué dirección va $\vec{H}_G$?
        opciones:
          - texto: >-
              Fuera del eje AB, en el plano que forman AB y el eje del
              cilindro, porque los momentos de inercia $I_x$ e $I_z$ son
              distintos
            correcta: true
            mensaje: |
              Eso es. En ejes del cilindro, $\vec{\omega}$ tiene una componente
              según Z y otra perpendicular, y se multiplican por $I_z$ y por
              $I_x$, que no son iguales: el resultado ya no es paralelo a
              $\vec{\omega}$. Esa desviación, al girar, es la que pide un par a
              los cojinetes.
          - texto: Según el eje AB, porque $\vec{\omega}$ va según él
            mensaje: |
              El momento angular solo es paralelo a $\vec{\omega}$ si el eje de
              giro es **principal**. AB está inclinado β respecto del eje de
              simetría del cilindro y no lo es: con un tensor de inercia, el
              momento angular no tiene por qué ir en la dirección del giro.
          - texto: Según el eje del cilindro, porque es su eje de simetría
            mensaje: |
              Eso pasaría si el cilindro girara alrededor de su propio eje.
              Gira alrededor de AB, y la componente de $\vec{\omega}$
              perpendicular al eje del cilindro también da momento angular, con
              $I_x$.
          - texto: Perpendicular al plano que forman AB y el eje del cilindro
            mensaje: |
              Esa es la dirección de su **derivada**,
              $\vec{\omega}\times\vec{H}_G$. El propio $\vec{H}_G$ está en ese
              plano, porque en él están $\vec{\omega}$ y el eje del cilindro.

      - tipo: calcular
        titulo: La componente transversal del momento angular
        pregunta: |
          Toma los ejes de la figura de la derecha con Y en el plano de AB y del
          eje del cilindro. Con valores nuestros, $M = 12$ kg, $R = 0{,}1$ m,
          $L = 0{,}6$ m, $\beta = 30^{\circ}$ y $\omega = 20$ rad/s, ¿cuánto vale
          la componente de $\vec{H}_G$ según Y, la perpendicular al eje del
          cilindro?
        respuesta:
          tipo: magnitud
          valor: '3.9 kg*m^2/s'
          tolerancia: 0.005
          formato: con su unidad, en kg·m²/s
        distractores:
          - valor: '7.8 kg*m^2/s'
            mensaje: |
              Es $I_x\,\omega$: has puesto la velocidad angular entera sobre el
              eje Y. A ese eje solo le toca su proyección,
              $\omega\operatorname{sen}\beta$.
          - valor: '0.6 kg*m^2/s'
            mensaje: |
              Has usado $I_z$, el momento respecto del eje del cilindro. La
              componente según Y va con el momento de inercia respecto de Y,
              $I_y = I_x$.
          - valor: '6.755 kg*m^2/s'
            mensaje: |
              Has proyectado con el coseno. β es el ángulo entre AB y el eje del
              cilindro, así que a Z le toca $\omega\cos\beta$ y a Y,
              $\omega\operatorname{sen}\beta$.
        pista: |
          $\vec{\omega} = \omega\operatorname{sen}\beta\,\hat{\jmath} + \omega\cos\beta\,\hat{k}$,
          y en ejes principales $H_Y = I_y\,\omega_Y$.
        desarrollo: |
          $$
          I_x = I_y = \frac{12}{12}\left(3\cdot 0{,}1^{2} + 0{,}6^{2}\right) = 0{,}39\ \text{kg·m}^{2}
          $$

          $$
          H_Y = I_y\,\omega\operatorname{sen}\beta = 0{,}39\cdot 20\cdot\frac{1}{2} = 3{,}9\ \text{kg·m}^{2}\text{/s}
          $$

      - tipo: calcular
        titulo: La componente del momento angular según el eje del cilindro
        pregunta: |
          Y con los mismos valores, ¿cuánto vale la componente de $\vec{H}_G$
          según Z, el eje del cilindro?
        respuesta:
          tipo: magnitud
          valor: '1.039 kg*m^2/s'
          tolerancia: 0.005
          formato: con su unidad, en kg·m²/s
        distractores:
          - valor: '1.2 kg*m^2/s'
            mensaje: |
              Es $I_z\,\omega$ sin proyectar. Al eje del cilindro solo le toca
              $\omega\cos\beta$ de la velocidad angular.
          - valor: '0.6 kg*m^2/s'
            mensaje: |
              Has proyectado con el seno. El eje del cilindro forma el ángulo β
              con AB, así que la componente de $\vec{\omega}$ según Z es
              $\omega\cos\beta$.
          - valor: '6.755 kg*m^2/s'
            mensaje: |
              Has multiplicado por $I_x$. Según Z manda el momento de inercia
              respecto del eje del cilindro, $I_z = MR^{2}/2$, que es mucho
              menor en un cilindro largo.
        pista: |
          $I_z = \tfrac{1}{2}MR^{2}$ y $H_Z = I_z\,\omega\cos\beta$.
        desarrollo: |
          $$
          I_z = \frac{12}{2}\cdot 0{,}1^{2} = 0{,}06\ \text{kg·m}^{2}
          $$

          $$
          H_Z = I_z\,\omega\cos\beta = 0{,}06\cdot 20\cdot\frac{\sqrt{3}}{2} \approx 1{,}039\ \text{kg·m}^{2}\text{/s}
          $$

          Así que $\vec{H}_G = 3{,}9\,\hat{\jmath} + 1{,}039\,\hat{k}$ kg·m²/s, que
          no es paralelo a $\vec{\omega}$: forma unos 45° con el eje AB, y hacia
          el lado contrario al del eje del cilindro, que forma 30°.

      - tipo: calcular
        titulo: La derivada del momento angular
        pregunta: |
          Con los mismos valores, ¿cuánto vale el módulo de
          $\dot{\vec{H}}_G$?
        respuesta:
          tipo: magnitud
          valor: '57.16 N*m'
          tolerancia: 0.005
          formato: con su unidad, en N·m
        distractores:
          - valor: '10.39 N*m'
            mensaje: |
              Has usado solo $I_z$. En $\vec{\omega}\times\vec{H}_G$ aparece la
              **diferencia** $I_x - I_z$: si los dos momentos fueran iguales, el
              momento angular iría según $\vec{\omega}$ y no habría par.
          - valor: '67.55 N*m'
            mensaje: |
              Has usado solo $I_x$. Las dos componentes de $\vec{H}_G$ contribuyen
              al producto vectorial con signos contrarios, y queda la
              diferencia $I_x - I_z$.
          - valor: '114.3 N*m'
            mensaje: |
              Has escrito $\operatorname{sen}2\beta$ donde va
              $\operatorname{sen}\beta\cos\beta$, que es la mitad:
              $\operatorname{sen}\beta\cos\beta = \tfrac{1}{2}\operatorname{sen}2\beta$.
        pista: |
          Con $\omega$ constante y ejes del cilindro,
          $\dot{\vec{H}}_G = \vec{\omega}\times\vec{H}_G$.
        desarrollo: |
          $$
          \dot{\vec{H}}_G = \vec{\omega}\times\vec{H}_G = \left(I_z - I_x\right)\omega^{2}\operatorname{sen}\beta\cos\beta\;\hat{\imath}
          $$

          $$
          I_x - I_z = 0{,}39 - 0{,}06 = 0{,}33\ \text{kg·m}^{2},
          \qquad
          \left|\dot{\vec{H}}_G\right| = 0{,}33\cdot 20^{2}\cdot\frac{1}{2}\cdot\frac{\sqrt{3}}{2} \approx 57{,}16\ \text{N·m}
          $$

          Va según $-\hat{\imath}$, perpendicular al plano de AB y del eje del
          cilindro, porque en este cilindro $I_x > I_z$.

      - tipo: calcular
        titulo: La reacción estática en B
        pregunta: |
          Con el cilindro quieto y $g = 9{,}8$ m/s², ¿cuánto vale la reacción de
          B según el eje?
        respuesta:
          tipo: magnitud
          valor: '117.6 N'
          tolerancia: 0.005
          formato: con su unidad, en N
        distractores:
          - valor: '58.8 N'
            mensaje: |
              Has repartido el peso entre los dos cojinetes. A es un cojinete
              radial y no toma fuerza axial: el peso entero lo sostiene B, que
              está encajado en el suelo.
          - valor: '101.8 N'
            mensaje: |
              Es $Mg\cos\beta$, el peso proyectado sobre el eje del cilindro. La
              reacción de B va según el eje AB, que es vertical como el peso: no
              hay nada que proyectar.
        pista: |
          El peso está en G, sobre el eje AB, y es vertical como él.
        desarrollo: |
          $$
          B_z = Mg = 12\cdot 9{,}8 = 117{,}6\ \text{N}
          $$

          Las radiales estáticas de A y de B son nulas: la recta de acción del
          peso es el propio eje, así que no tiene componente radial ni da
          momento respecto de ningún punto de él.

      - tipo: calcular
        titulo: La reacción dinámica en cada cojinete
        pregunta: |
          Con $h = 0{,}8$ m, ¿cuánto vale la reacción dinámica radial en cada
          cojinete? (Las de A y B son iguales y opuestas.)
        respuesta:
          tipo: magnitud
          valor: '71.45 N'
          tolerancia: 0.005
          formato: con su unidad, en N
        distractores:
          - valor: '142.9 N'
            mensaje: |
              Has dividido el par entre $h/2$. Las dos fuerzas son iguales y
              opuestas y están separadas la distancia entera entre cojinetes,
              $h$: su par es la fuerza por $h$.
          - valor: '35.72 N'
            mensaje: |
              Has repartido el par entre los dos cojinetes y además lo has
              dividido entre $h$. Cada fuerza ya es el par entre el brazo:
              $|\dot{\vec{H}}_G|/h$.
        pista: |
          G está en el eje: $\vec{A}_{din} = -\vec{B}_{din}$, y su par, de brazo
          $h$, vale $|\dot{\vec{H}}_G|$.
        desarrollo: |
          $$
          \left|\vec{A}_{din}\right| = \left|\vec{B}_{din}\right| = \frac{\left|\dot{\vec{H}}_G\right|}{h} = \frac{57{,}16}{0{,}8} = 71{,}45\ \text{N}
          $$

          Van en el plano de AB y del eje del cilindro y giran con él: la de A
          empuja el eje hacia el lado del extremo bajo del cilindro, y la de B,
          hacia el del extremo alto.

      - tipo: calcular
        titulo: La longitud que anula las reacciones dinámicas
        pregunta: |
          Con el mismo radio, ¿para qué cociente $L/R$ desaparecen las
          reacciones dinámicas, sea cual sea la inclinación?
        respuesta:
          tipo: numero
          valor: '1.732'
          tolerancia: 0.002
          formato: un número; vale la forma exacta, como √3
        distractores:
          - valor: '2'
            mensaje: |
              Un cilindro tan largo como ancho, $L = 2R$, parece el más
              «redondo», pero no es el que anula el par: hace falta que los dos
              momentos de inercia sean iguales, y con $L = 2R$ sale
              $I_x = \tfrac{7}{12}MR^{2}$, mayor que $I_z$.
          - valor: '3'
            mensaje: |
              La condición es $L^{2} = 3R^{2}$, con el cuadrado: $L = \sqrt{3}\,R$,
              no $3R$.
          - valor: '2.236'
            mensaje: |
              Es $\sqrt{5}$: sale de escribir $I_x = \tfrac{M}{12}(R^{2} + L^{2})$,
              sin el 3 que lleva $R^{2}$ en la fórmula del enunciado.
        pista: |
          El par es proporcional a $I_x - I_z$. Iguala las dos expresiones del
          enunciado.
        desarrollo: |
          $$
          \frac{M}{12}\left(3R^{2} + L^{2}\right) = \frac{M}{2}R^{2}
          \;\Longrightarrow\;
          L^{2} = 3R^{2}
          \;\Longrightarrow\;
          \frac{L}{R} = \sqrt{3} \approx 1{,}732
          $$

          Con esa proporción los tres momentos de inercia en G son iguales,
          cualquier eje por G es principal y el cilindro no carga los cojinetes
          aunque esté inclinado.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Con los ejes del cilindro en G, Z en su eje e Y en el plano de AB,
              la velocidad angular es
              $\vec{\omega} = \omega\operatorname{sen}\beta\,\hat{\jmath} + \omega\cos\beta\,\hat{k}$.
          - texto: >-
              Son ejes principales, así que
              $\vec{H}_G = I_x\,\omega\operatorname{sen}\beta\,\hat{\jmath} + I_z\,\omega\cos\beta\,\hat{k}$,
              que no va según AB.
          - texto: >-
              Con $\omega$ constante,
              $\dot{\vec{H}}_G = \vec{\omega}\times\vec{H}_G = \tfrac{M}{12}\left(3R^{2} - L^{2}\right)\omega^{2}\operatorname{sen}\beta\cos\beta\;\hat{\imath}$.
          - texto: >-
              G está en el eje: el peso lo sostiene la axial de B,
              $B_z = Mg$, y las radiales de A y de B son iguales y opuestas.
          - texto: >-
              Su par, de brazo h, iguala a $\dot{\vec{H}}_G$, y cada una vale
              $\tfrac{M\left|L^{2} - 3R^{2}\right|\omega^{2}\operatorname{sen}2\beta}{24h}$,
              girando con el cilindro.
          - texto: >-
              Como el cilindro está inclinado, el peso da reacciones estáticas
              horizontales en A y en B.
            trampa: true
            mensaje: |
              El peso está aplicado en G, que está sobre el eje AB, y es vertical
              como el eje: su recta de acción es el propio eje, así que no tiene
              componente radial ni da momento respecto de ningún punto de él. Con
              el cilindro quieto solo hay la reacción axial de B; la inclinación
              se nota únicamente al girar.
    resolucion: |
      **Los ejes.** Se toman en G los ejes del cilindro de la figura de la
      derecha: Z a lo largo de su eje, Y en el plano que forman el eje AB y el
      eje del cilindro —el plano del dibujo de la izquierda— y X perpendicular a
      él. Son ejes principales, con los momentos de inercia del enunciado,
      $I_x = I_y$ e $I_z$. El eje AB forma el ángulo β con Z, así que

      $$
      \vec{\omega} = \omega\operatorname{sen}\beta\,\hat{\jmath} + \omega\cos\beta\,\hat{k}
      $$

      **a) El momento angular.** En ejes principales se multiplica componente a
      componente:

      $$
      \vec{H}_G = I_x\,\omega\operatorname{sen}\beta\,\hat{\jmath} + I_z\,\omega\cos\beta\,\hat{k}
      = \frac{M}{12}\left(3R^{2} + L^{2}\right)\omega\operatorname{sen}\beta\,\hat{\jmath} + \frac{M}{2}R^{2}\,\omega\cos\beta\,\hat{k}
      $$

      No va según el eje AB: como $I_x \neq I_z$, las dos componentes de
      $\vec{\omega}$ se multiplican por números distintos. Visto desde el eje de
      giro, $\vec{H}_G$ tiene una componente según AB,
      $\omega\left(I_x\operatorname{sen}^{2}\beta + I_z\cos^{2}\beta\right)$, y
      otra perpendicular, $\omega\left(I_x - I_z\right)\operatorname{sen}\beta\cos\beta$,
      en el plano del eje y del cilindro, que da vueltas con él.

      **b) Su derivada.** Los ejes van unidos al cilindro y ω es constante, así
      que las componentes de $\vec{H}_G$ no cambian y solo queda el término del
      arrastre:

      $$
      \dot{\vec{H}}_G = \vec{\omega}\times\vec{H}_G = \left(I_z - I_x\right)\omega^{2}\operatorname{sen}\beta\cos\beta\;\hat{\imath}
      = \frac{M}{12}\left(3R^{2} - L^{2}\right)\omega^{2}\operatorname{sen}\beta\cos\beta\;\hat{\imath}
      $$

      perpendicular al plano del eje y del cilindro. En un cilindro largo,
      $L > \sqrt{3}\,R$, va según $-\hat{\imath}$.

      **c) Las reacciones.** A es un cojinete radial, y B, encajado en el suelo,
      toma además la fuerza axial. G está en el eje, así que no se mueve y
      $\vec{F} = M\vec{a}_G = \vec{0}$.

      - **Estáticas**, las que habría con el cilindro quieto: el peso está aplicado en G, que está en el eje, y es vertical como él, así que su recta de acción es el propio eje AB: no tiene componente radial ni da momento respecto de ningún punto del eje. Lo sostiene entero la reacción axial de B, $B_z = Mg$, y las radiales estáticas de A y de B son nulas.
      - **Dinámicas**: las radiales de A y de B son iguales y opuestas, porque la resultante es nula, y forman un par de brazo $h$ que tiene que valer $\dot{\vec{H}}_G$. Van en el plano del eje y del cilindro, perpendiculares al eje, y valen

      $$
      \left|\vec{A}_{din}\right| = \left|\vec{B}_{din}\right| = \frac{\left|\dot{\vec{H}}_G\right|}{h} = \frac{M\left|L^{2} - 3R^{2}\right|\omega^{2}\operatorname{sen}2\beta}{24\,h}
      $$

      Con $L > \sqrt{3}\,R$, la de A empuja el eje hacia el lado del extremo bajo
      del cilindro y la de B hacia el del extremo alto: se oponen al par de
      inercia, que tiende a tumbar el cilindro hacia el plano perpendicular al
      eje. Y como van fijas al cilindro, **giran con él**: el cojinete las nota
      como una fuerza que da vueltas, es decir, como una vibración.

