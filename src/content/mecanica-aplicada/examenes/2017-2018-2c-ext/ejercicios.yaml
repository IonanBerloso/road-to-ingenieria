  - id: exma1718-2cext-4-el-cilindro-inclinado-sobre-un-eje-vertical
    titulo: El cilindro inclinado sobre un eje vertical, y las reacciones en sus cojinetes
    fuente: >-
      Ejercicio 2 · Convocatoria extraordinaria de junio de 2018, bloque 2
      (Dinámica) · Mecánica Aplicada, Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU). Transcrito de la columna en castellano, que en el PDF va como
      imagen; la figura está redibujada. La cabecera de esta página dice «1.
      bloque: Cinemática y Dinámica», una errata del original: es la misma
      convocatoria del bloque 2. De la línea de datos, bilingüe en un solo
      renglón, se transcribe solo la mitad en castellano. Son del original el
      espacio antes del punto en «ω .», los apartados sin punto final, el
      espacio antes de la coma en «L ,» y la «r» minúscula con que la figura
      rotula el radio que los datos llaman R. B se toma como el cojinete que
      absorbe la fuerza axial, porque la figura lo dibuja encajado en el suelo.
      El resultado es simbólico, así que las casillas usan valores de prueba
      nuestros, declarados en cada pregunta: masa 12 kg, radio 0,1 m, longitud
      0,6 m, inclinación 30 grados, velocidad angular 20 rad/s, distancia entre
      cojinetes 0,8 m y gravedad 9,8 m/s². El examen no publica resolución; el
      desarrollo es nuestro.
