      **Lectura.** Las dinámicas desaparecen si $\operatorname{sen}2\beta = 0$
      —el cilindro montado según el eje o perpendicular a él, dos montajes
      principales— o si $L = \sqrt{3}\,R$, cuando $I_x = I_z$ y cualquier eje
      por G es principal.

      **Comprobación con valores nuestros.** Con $M = 12$ kg, $R = 0{,}1$ m,
      $L = 0{,}6$ m, $\beta = 30^{\circ}$, $\omega = 20$ rad/s, $h = 0{,}8$ m y
      $g = 9{,}8$ m/s²: $I_x = 0{,}39$ kg·m² e $I_z = 0{,}06$ kg·m²,
      $\vec{H}_G = 3{,}9\,\hat{\jmath} + 1{,}039\,\hat{k}$ kg·m²/s, su derivada
      vale 57,16 N·m, la reacción estática de B es de 117,6 N y cada dinámica,
      de 71,45 N.

      **Comprobación independiente.** Construyendo el tensor de inercia en ejes
      del eje de giro con una matriz de rotación, derivando numéricamente el
      momento angular mientras el cilindro gira y resolviendo las seis
      ecuaciones de Newton-Euler como un sistema lineal, salen los mismos
      números, y el cociente L/R que anula las dinámicas, buscado por
      bisección, es √3.
