curso: '2024-2025'
convocatoria: ordinaria
fecha: 6 de junio de 2025
# La ordinaria de junio de 2025 de Mecánica Aplicada, **solo su parte del
# bloque 1** (Estática, «1er Cuatrimestre» en la cabecera). El PDF no trae el
# examen del bloque 2 (Cinemática y Dinámica): son cuatro páginas, la 1 de
# teoría, la 2 en blanco y la 3 y la 4 con un ejercicio cada una. Lo que aquí
# falta del bloque 2 no está «fuera»: no está en el documento.
#
# El cuadernillo es bilingüe, euskera a la izquierda y castellano a la
# derecha, y se transcribe **solo la columna en castellano**, tal cual. Cinco
# cosas de ese texto, dichas antes de que nadie las deduzca:
#
# 1. **LA TEORÍA SUMA DISTINTO EN CADA IDIOMA.** La columna en castellano
#    puntúa las cuatro cuestiones 1,5 + 1,5 + 1 + 1 = 5 puntos, que con los
#    6 de los dos ejercicios dan **11**. La de euskera las puntúa 1 + 1 + 1 +
#    1 = 4, y esa es la que da 10. Se transcribe la castellana con sus puntos
#    impresos y no se corrige: no hay forma de saber desde aquí cuál aplicó el
#    tribunal (§13 caso 5). Lo dice también la `fuente` de las cuestiones 1 y
#    2, que son las afectadas. Los ejercicios no llevan el campo `puntos`,
#    que es un reparto por competencia y el examen no lo imprime.
#
# 2. **LA PÁGINA DEL EJERCICIO 2 DICE «Dinámica»** en la cabecera castellana,
#    mientras la de euskera dice «Estatika» y el ejercicio es de estática y
#    resistencia de materiales. Es una errata de la cabecera, no un examen del
#    bloque 2: misma fecha, misma numeración de ejercicios, mismo cuadernillo.
#
# 3. **ERRATAS DEL TEXTO, CONSERVADAS**: «pole,a» por «polea» en el apartado
#    b) del ejercicio 1; «siquientes» por «siguientes» y «nomales» por
#    «normales» en el ejercicio 2; los apartados de la cuestión 1 rotulados
#    «c)» y «d)» —en euskera son a) y b)—; y la cuestión 4 numerada «4 (1)»
#    sin punto ni «p». Ninguna cambia lo que se pide.
#
# 4. **DOS NUMERACIONES EN UN CUADERNILLO.** La teoría va de la 1 a la 4 y los
#    ejercicios vuelven a empezar en 1. Como `n` es un único número por
#    examen, aquí las cuestiones de teoría son **n 1 a 4** y los ejercicios
#    son **n 5 (Ejercicio 1) y n 6 (Ejercicio 2)**. La `fuente` de cada
#    ejercicio guiado dice el nombre impreso —«Cuestión 3», «Ejercicio 2»—
#    para que nadie busque un «ejercicio 5» en el PDF.
#
# 5. **LOS DOS EJERCICIOS SE PARTEN**, como en Térmica, porque cruzan temas:
#    el 1 es de cables en a) y b) y de estática en c); el 2 es de estática en
#    a) y de resistencia de materiales en b) y c). Seis piezas para cuatro
#    cuestiones y dos ejercicios, con su `n` diciendo de dónde sale cada una.
#
# El examen no publica resolución ni resultados: todos los desarrollos son
# nuestros, comprobados por un segundo camino independiente (ver notas.md).
pdf: 2024-2025-ord.pdf

