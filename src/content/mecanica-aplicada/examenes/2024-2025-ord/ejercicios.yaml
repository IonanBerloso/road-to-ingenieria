        <title id="ma2425o6rt">Diagramas de axiles, cortantes y flectores de la viga ABCDE</title>
        <desc id="ma2425o6rd">Tres diagramas alineados sobre la viga, a escala.
        Axiles: menos dos Mg de A a C, cero de C a E. Cortantes: recta de siete
        Mg en A a menos Mg en C, que corta el cero a siete cuartos de L; menos
        Mg constante de C a E. Flectores, positivos hacia arriba: parábola de
        cero en A a seis MgL en C con el máximo de cuarenta y nueve octavos de
        MgL a siete cuartos de L; recta hasta cinco MgL en D; salto a MgL; y
        recta hasta cero en E.</desc>
