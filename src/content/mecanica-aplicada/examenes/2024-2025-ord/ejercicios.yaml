      <figcaption>

      El bloque solo. En C, el cable tira a lo largo de su tangente, hacia B; en E, el muelle, estirado, tira hacia la pared; en D, la articulación da dos componentes y ningún par; y el peso, en el centro. D va en un punto cualquiera de la cara inferior: h, sin escala. Ejes: x hacia la derecha, y hacia arriba; momentos positivos en sentido antihorario.

      </figcaption>
      </figure>

      - **El peso**, $Mg$, en el centro.
      - **El muelle en E**: estirado $L$ desde longitud natural nula, tira
        hacia la pared con $F_k = kL = Mg/2$.
      - **El cable en C**: la tensión de la catenaria en C,
        $T_C = w\,y_C = Mg$ (apartado a), dirigida hacia B a 30° sobre la
        horizontal.
      - **La articulación D**, con $D_x$ y $D_y$.

      **2. Incógnitas.** $D_x$, $D_y$ y la distancia h.

      **3. Ecuaciones.** Con el origen en la esquina inferior izquierda del
      bloque, D en $(h,\,0)$, C en $(0,\,L)$, E en $(L,\,L)$ y el centro en
      $(L/2,\,L/2)$. El cable tira de C con
      $\left(-\tfrac{\sqrt{3}}{2}Mg,\ \tfrac{1}{2}Mg\right)$. Las dos
      ecuaciones de fuerzas y la de momentos respecto de D, antihorario
      positivo:

      $$
      D_x + \frac{Mg}{2} - \frac{\sqrt{3}}{2}Mg = 0,
      \qquad
      D_y - Mg + \frac{Mg}{2} = 0
      $$

      $$
      -Mg\left(\frac{L}{2} - h\right) - \frac{Mg}{2}\,L
      + \frac{\sqrt{3}}{2}Mg\,L - \frac{Mg}{2}\,h = 0
      $$

      **4. Resultados.**

      $$
      D_x = \frac{\sqrt{3}-1}{2}\,Mg \approx 0{,}366\,Mg,
      \qquad
      D_y = \frac{Mg}{2},
      \qquad
      h = (2 - \sqrt{3})\,L \approx 0{,}268\,L
      $$

      Las dos componentes salen positivas: la reacción apunta hacia la
      derecha y hacia arriba.

      $$
      \vec{R}_D = 0{,}366\,Mg\,\vec{\imath} + 0{,}5\,Mg\,\vec{\jmath}
      $$

      **5. Comprobación.** Los momentos respecto de la esquina inferior
      izquierda, que no se han usado; ahora la reacción entra, con $D_y$ a
      distancia h. En $MgL$:

      $$
      \underbrace{-\tfrac{1}{2}}_{Mg}
      \underbrace{-\tfrac{1}{2}}_{F_k}
      + \underbrace{\tfrac{\sqrt{3}}{2}}_{T_C}
      + \underbrace{\tfrac{1}{2}\,(2 - \sqrt{3})}_{D_y}
      = -1 + \tfrac{\sqrt{3}}{2} + 1 - \tfrac{\sqrt{3}}{2} = 0
      $$

      Y h queda entre 0 y L: la articulación está en la cara inferior, como
      en la figura.

      **Lo que dice el resultado.** La articulación no transmite par, y por
      eso la ecuación de momentos respecto de D es la única sin incógnitas de
      reacción: es la que fija h. El cable sostiene la mitad del peso del
      bloque con su componente vertical, $Mg/2$, y la articulación, la otra
      mitad. Y D queda cerca de la esquina izquierda, a $0{,}268\,L$ de
      ella: es donde los momentos del peso y del muelle, horarios, se igualan
      con el del cable.

  # ── Ejercicio 2 · a) · el sólido libre de la viga. Tres incógnitas —las dos
  #    de A y la fuerza del muelle— y tres ecuaciones: isostática, y la k sale
  #    al final dividiendo por el alargamiento.
  - id: exma2425-ord-6-el-muelle-que-sostiene-la-viga
    titulo: El muelle que sostiene la viga, y su constante
    fuente: >-
      Ejercicio 2, apartado a) · Convocatoria ordinaria de junio de 2025,
      bloque 1 (Estática) · Mecánica Aplicada, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). La cabecera castellana de esta página dice
      «Dinámica» (la de euskera, «Estatika»), y el texto trae las erratas
      «siquientes» y «nomales», que se conservan. El examen no publica
      resolución; el desarrollo es nuestro.
    nivel: examen
    antes:
      idea: |
        Un sólido libre lleva todo lo que actúa sobre el cuerpo: las cargas y,
        en cada unión, lo que esa unión puede hacer. Una articulación fija
        sujeta en las dos direcciones y deja girar; un muelle actúa a lo largo
        de su eje, con una fuerza que depende de cuánto se ha deformado.
      formula: |
        La fuerza de un muelle de constante k, longitud ℓ y longitud natural
        $L_0$; la resultante de una carga uniforme q sobre un tramo de
        longitud a, aplicada en su centro; y el equilibrio en el plano:

        $$
        F_k = k\,(\ell - L_0)
        \qquad
        R = q\,a
        \qquad
        \sum F_x = 0 \quad \sum F_y = 0 \quad \sum M = 0
        $$
      reconocer: |
        Antes de plantear se mira qué hace cada unión: la articulación y el
        muelle.
    enunciado: |
      La viga ABCDE de sección transversal en T soporta las siquientes
      fuerzas:

      - Carga uniformemente distribuida de valor $q_0 = 4Mg/L$.
      - Carga concentrada horizontal de valor $2Mg$ en la sección C.
      - Momento de valor $4MgL$ aplicado en la sección D.

      La viga tiene una articulación fija en A y en E está unida a un muelle
      de longitud no deformada nula, de constante $k$ a determinar. Se pide:

      **a)** (0,75p) Diagrama del sólido libre de la viga resuelto, indicando
      las reacciones que actúan sobre ella, la fuerza del muelle y su
      constante $k$.

      **b)** (1,5p) Diagramas de fuerzas axiales y cortantes y de momentos
      flectores en la viga. Determinar el momento máximo e indicar en qué
      sección ocurre.

      **c)** (0,75p) Tensiones nomales máxima y mínima en función de $M, g, L$
      y $b$.

