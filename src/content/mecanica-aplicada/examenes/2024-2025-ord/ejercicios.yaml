    pide: Las dos componentes de la reacción en D y la distancia h.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de escribir ecuaciones, ¿qué fuerzas actúan sobre el bloque?
        opciones:
          - texto: >-
              El peso $Mg$ en el centro, el muelle $Mg/2$ hacia la pared en E, el
              cable $Mg$ a 30° hacia B en C, y la reacción de D
            correcta: true
            mensaje: |
              Eso es. El muelle está estirado $L$ desde una longitud natural
              nula, así que tira de E con $kL = Mg/2$; y el cable tira de C con
              la tensión de la catenaria en C, $T_C = Mg$, a lo largo de su
              tangente.
          - texto: >-
              El peso, el muelle y la reacción; el cable no, porque su peso ya
              está en $w$
            mensaje: |
              $w$ es el peso del cable, que carga al propio cable. Lo que el
              cable hace sobre el **bloque** es tirar de C con su tensión, y esa
              fuerza entra en el equilibrio del bloque como cualquier otra.
          - texto: >-
              El muelle empuja E hacia la izquierda, porque tiene longitud $L$
            mensaje: |
              Su longitud natural es cero y mide $L$: está **estirado**, así
              que tira de E hacia la pared, a la derecha. Empujaría si su
              longitud fuera menor que la natural.
          - texto: >-
              En C el cable tira con $T_0$, en horizontal
            mensaje: |
              $T_0$ es solo la componente horizontal de la tensión. En C el
              cable va inclinado 30°, y tira con $T_C = T_0/\cos 30^{\circ} = Mg$,
              que también tiene componente vertical, $Mg/2$.
      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna ecuación: **el bloque solo**, sin la
          articulación, el muelle ni el cable.
        comprueba:
          - punto: |
              **En D, $D_x$ y $D_y$, y ningún par.**
            porque: |
              Una articulación impide que el punto se mueva en las dos
              direcciones, pero deja girar.
          - punto: |
              **En E, la fuerza del muelle, horizontal y hacia la pared.**
            porque: |
              Su longitud natural es nula y mide L: está estirado, y tira de E.
          - punto: |
              **En C, la tensión del cable, tangente a él y hacia B: a 30° sobre
              la horizontal, hacia la izquierda.**
            porque: |
              Un cable tira a lo largo de sí mismo, y en C sube hacia la polea.
          - punto: |
              **El peso Mg en el centro del bloque.**
            porque: |
              El bloque es homogéneo: su peso actúa en el centro, y su brazo
              respecto de D depende de h.
