      a) El tramo que cuelga de la polea: solo lo sostiene la tensión de arriba. b) El tramo de catenaria entre C y B: en cada extremo, una fuerza a lo largo del cable, y su peso, por unidad de longitud de cable. El punto más bajo de esta catenaria queda fuera del tramo, más allá de C. Ejes: x hacia la derecha, y hacia arriba; momentos positivos en sentido antihorario.

      </figcaption>
      </figure>

      - **El tramo que cuelga** va de B a su extremo libre A, a la altura de
        D: mide $2L/5 + L = 7L/5$, y lo sostiene la tensión en B.
      - **La polea** es ideal y conserva el módulo de la tensión: la de B es
        la misma a un lado y a otro.
      - **El tramo CB**: en C, el bloque tira a lo largo del cable, a 30° de
        la horizontal; en B, la polea; y su peso, el de su longitud de cable.
        Su vértice queda fuera del tramo, más allá de C.

      **2. Incógnitas.** La tensión mínima $T_0$, el parámetro c, el ángulo en
      B y la longitud de BC.

      **3. Ecuaciones.** El tramo que cuelga da la tensión en B, y la
      catenaria, $T = w\,y$, la convierte en ordenada:

      $$
      T_B = w\cdot\frac{7}{5}L = w\,y_B
      $$

      La componente horizontal de la tensión es la misma en todo el cable, y
      es la mínima, $T_0$:

      $$
      T_0 = T_C\cos 30^{\circ} = T_B\cos\theta_B,
      \qquad
      c = \frac{T_0}{w},
      \qquad
      s^{2} = y^{2} - c^{2}
      $$

      **4. Resultados.** De $T_B = w\,y_B$ sale $y_B = 7L/5$: B está a esa
      altura sobre la directriz, y A, $7L/5$ por debajo de B, está en ella.
      **La directriz es la horizontal de A**, que es también la de D. C está a
      $L$ sobre ella:

      $$
      T_C = w\,y_C = Mg,
      \qquad
      T_0 = \frac{\sqrt{3}}{2}\,Mg \approx 0{,}866\,Mg,
      \qquad
      c = \frac{\sqrt{3}}{2}\,L \approx 0{,}866\,L
      $$

      $$
      \cos\theta_B = \frac{\sqrt{3}/2}{7/5} = 0{,}6186
      \;\Longrightarrow\;
      \theta_B \approx 51{,}79^{\circ}
      $$

      $$
      s_B = \sqrt{1{,}96 - 0{,}75}\,L = 1{,}1\,L,
      \qquad
      s_C = \sqrt{1 - 0{,}75}\,L = 0{,}5\,L,
      \qquad
      \overline{BC} = 0{,}6\,L
      $$

      C y B están del mismo lado del vértice —el cable sube de C a B
      empinándose—, así que los arcos se restan. Sobre el tramo CB, la fuerza
      del bloque en C y la de la polea en B:

      $$
      \vec{T}_C = 0{,}866\,Mg\,\vec{\imath} - 0{,}5\,Mg\,\vec{\jmath},
      \qquad
      \vec{T}_B = -0{,}866\,Mg\,\vec{\imath} + 1{,}1\,Mg\,\vec{\jmath}
      $$

      **5. Comprobación.** El arco CB tiene que ser algo más largo que su
      cuerda. La distancia horizontal entre C y B no se ha usado: sale de
      $x = c\,\operatorname{arcsinh}(s/c)$,

      $$
      \Delta x = c\left[\operatorname{arcsinh}\frac{s_B}{c} - \operatorname{arcsinh}\frac{s_C}{c}\right]
      = 0{,}866\,(1{,}0601 - 0{,}5493)\,L = 0{,}442\,L
      $$

      y la vertical es $y_B - y_C = 0{,}4\,L$. La cuerda mide
      $\sqrt{0{,}442^{2} + 0{,}4^{2}}\,L = 0{,}596\,L$, apenas menos que el
      arco, $0{,}6\,L$: un tramo poco curvado. Un arco más corto que su
      cuerda delataría un error.

      **Lo que dice el resultado.** El tramo que cuelga es la llave: su
      extremo libre cae siempre en la directriz, porque su peso, w por su
      longitud, tiene que ser $w\,y_B$. Con eso cada tensión sale de una
      altura, sin resolver ninguna ecuación trascendente. Y el ángulo no se
      conserva: de 30° en C pasa a casi 52° en B, porque la componente
      horizontal es la misma y la tensión crece con la altura.

  # ── Ejercicio 1 · c) · el bloque. Con la tensión en C ya conocida, tres
  #    ecuaciones de equilibrio y tres incógnitas: las dos de D y la h.
  - id: exma2425-ord-5-el-bloque-articulado-en-d
    titulo: El bloque articulado en D, y dónde tiene que estar la articulación
    fuente: >-
      Ejercicio 1, apartado c) · Convocatoria ordinaria de junio de 2025,
      bloque 1 (Estática) · Mecánica Aplicada, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). El apartado b) trae la errata «pole,a», que se
      conserva. El examen no publica resolución; el desarrollo es nuestro.
    nivel: examen
    antes:
      idea: |
        Un sólido libre lleva todo lo que actúa sobre el cuerpo: las cargas y,
        en cada unión, lo que esa unión puede hacer. Una articulación sujeta en
        las dos direcciones y deja girar; un muelle actúa a lo largo de su eje;
        un cable tira a lo largo de su tangente.
      formula: |
        La fuerza de un muelle de constante k, longitud ℓ y longitud natural
        $L_0$, y el equilibrio en el plano:

        $$
        F_k = k\,(\ell - L_0)
        \qquad
        \sum F_x = 0 \quad \sum F_y = 0 \quad \sum M = 0
        $$
      reconocer: |
        Antes de plantear se mira qué hace cada unión: la articulación, el
        muelle y el cable.
    enunciado: |
      Un bloque cuadrado de masa $M$ y lado $L$ se encuentra articulado en un
      punto fijo D. El bloque está unido en el punto E a un muelle ideal de
      constante elástica $k = \frac{Mg}{2L}$, deformado $L$. En el punto C
      está sujeto a un cable de peso por unidad de longitud
      $w = \frac{Mg}{L}$ que se arrolla sobre la polea B de dimensiones
      despreciables y cuelga por el otro lado de la polea. El punto A está en
      la misma horizontal que D. El ángulo del cable en C con la horizontal
      es de 30º. Se pide:

      **a)** (1p) Fuerza mínima del cable $T_0$ y parámetro de la catenaria $c$.

      **b)** (1p) Ángulo del cable con la horizontal en B, en el lado derecho
      de la pole,a y longitud del cable BC

      **c)** (1p) Componentes de la reacción en D y distancia $h$.

