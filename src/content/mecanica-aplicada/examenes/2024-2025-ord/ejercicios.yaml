    pide: La tensión mínima y el parámetro de la catenaria, el ángulo en B y la longitud del tramo BC.
    pasos:
      - tipo: reconocer
        pregunta: |
          Del otro lado de la polea el cable cuelga libre hasta A, que está a la
          altura de D. ¿Qué te da ese tramo?
        opciones:
          - texto: >-
              La tensión en B, igual al peso del tramo que cuelga,
              $w\cdot 7L/5$; y como en la catenaria $T = w\,y$, A está en la
              directriz
            correcta: true
            mensaje: |
              Eso es. Una polea ideal conserva el módulo de la tensión, y en un
              tramo vertical la tensión es el peso de lo que cuelga por debajo.
              En la catenaria $T = w\,y$ con $y$ medida desde la directriz, así
              que la directriz es la horizontal del extremo libre: la de A y D.
          - texto: >-
              La tensión en B vale $T_0$, porque la polea solo cambia la
              dirección
            mensaje: |
              La polea conserva el **módulo** de la tensión, y el módulo en B no
              es $T_0$: $T_0$ es la componente horizontal, que en B es solo una
              parte de la tensión, porque ahí el cable sube inclinado.
          - texto: >-
              Nada: la catenaria de C a B se resuelve solo con el ángulo en C
            mensaje: |
              El ángulo en C da la dirección de la tensión, no su tamaño. Hace
              falta una ecuación de módulo, y es justo la del tramo colgante.
              Sin él tendrías una catenaria por dos puntos sin su longitud, y
              eso no se resuelve a mano.
          - texto: El vértice de la catenaria está en C
            mensaje: |
              En el vértice la tangente es horizontal y la tensión es mínima.
              En C el cable forma 30° con la horizontal, así que C no es el
              vértice: el vértice queda más allá de C, fuera del tramo real.
      - tipo: calcular
        titulo: La fuerza mínima del cable
        pregunta: |
          ¿Cuánto vale $T_0$, en unidades de $Mg$?
        respuesta:
          tipo: numero
          valor: '0.86603'
          tolerancia: 0.001
          formato: un número, en unidades de Mg; en forma exacta (√3/2) o con cuatro decimales
        distractores:
          - valor: '1'
            mensaje: |
              Eso es $T_C = w\,y_C = Mg$, la tensión **en C**. La fuerza mínima
              es la del vértice, que coincide con la componente horizontal de
              la tensión en cualquier punto: $T_C\cos 30°$.
          - valor: '1.2124'
            mensaje: |
              Has proyectado la tensión de B, $7Mg/5$, con el ángulo de C. Cada
              tensión va con su propio ángulo: en C la tensión es $Mg$ y es la
              que forma 30°.
          - valor: '0.5'
            mensaje: |
              Has tomado la componente vertical, $T_C\sin 30°$. La tensión
              mínima es la del vértice, donde el cable es horizontal: es la
              componente horizontal, con el coseno.
        pista: |
          Con la directriz en la horizontal de A, $y_C = L$ y $T_C = w\,y_C$.
          La componente horizontal es la misma en todo el cable.
        desarrollo: |
          $$
          T_C = w\,y_C = \frac{Mg}{L}\,L = Mg,
          \qquad
          T_0 = T_C\cos 30^{\circ} = \frac{\sqrt{3}}{2}\,Mg \approx 0{,}866\,Mg
          $$
      - tipo: calcular
        titulo: El parámetro de la catenaria
        pregunta: |
          ¿Cuánto vale $c$, en unidades de $L$?
        respuesta:
          tipo: numero
          valor: '0.86603'
          tolerancia: 0.001
          formato: un número, en unidades de L; en forma exacta (√3/2) o con cuatro decimales
        distractores:
          - valor: '1'
            mensaje: |
              Has tomado $c = y_C$, como si C fuera el vértice. $y_C = c\cosh(x_C/c)$
              solo vale $c$ en el vértice, y en C el cable ya va inclinado 30°.
          - valor: '1.4'
            mensaje: |
              Has tomado $c = y_B = 7L/5$. Esa es la altura de B sobre la
              directriz, no el parámetro: $c$ es la altura del vértice, la menor
              de todas, $T_0/w$.
        pista: |
          $c = T_0/w$.
        desarrollo: |
          $$
          c = \frac{T_0}{w} = \frac{\sqrt{3}}{2}\,L \approx 0{,}866\,L
          $$

          Comprobación: $y_C = c\cosh(x_C/c)$ con
          $\sinh(x_C/c) = \tan 30^{\circ}$ da
          $c\sqrt{1 + \tan^{2}30^{\circ}} = c/\cos 30^{\circ} = L$.
      - tipo: calcular
        titulo: El ángulo en B
        pregunta: |
          ¿Qué ángulo forma el cable con la horizontal en B, del lado derecho de
          la polea? En grados.
        respuesta:
          tipo: numero
          valor: '51.79'
          tolerancia: 0.1
          formato: un número, en grados
        distractores:
          - valor: '30'
            mensaje: |
              Has supuesto que el cable forma en B el mismo ángulo que en C. Lo
              que se mantiene es la componente horizontal de la tensión, no el
              ángulo: al subir, la tensión crece y el cable se empina.
          - valor: '38.21'
            mensaje: |
              Es el ángulo con la **vertical**, $90^{\circ} - 51{,}79^{\circ}$.
              La pregunta lo pide con la horizontal, que es el que da
              $\cos\theta_B = T_0/T_B$.
        pista: |
          $T_B = w\,y_B = 7Mg/5$, y la componente horizontal sigue siendo $T_0$:
          $\cos\theta_B = T_0/T_B$.
        desarrollo: |
          $$
          \cos\theta_B = \frac{T_0}{T_B} = \frac{\sqrt{3}/2}{7/5} = 0{,}6186
          \;\Longrightarrow\;
          \theta_B \approx 51{,}79^{\circ}
          $$
      - tipo: calcular
        titulo: La longitud del tramo BC
        pregunta: |
          ¿Cuánto mide el cable entre C y B, en unidades de $L$?
        respuesta:
          tipo: numero
          valor: '0.6'
          tolerancia: 0.005
          formato: un número, en unidades de L
        distractores:
          - valor: '1.1'
            mensaje: |
              Eso es el arco desde el **vértice** hasta B, $\sqrt{y_B^{2} - c^{2}}$.
              El tramo real empieza en C, así que hay que restarle el arco del
              vértice a C.
          - valor: '1.6'
            mensaje: |
              Has sumado los dos arcos, como si C y B estuvieran a lados
              opuestos del vértice. Los dos están del mismo lado —el cable sube
              desde C hacia B sin pasar por el mínimo— y los arcos se restan.
          - valor: '0.4'
            mensaje: |
              Es el desnivel entre B y C, $2L/5$. El cable sube inclinado y
              curvo, así que es más largo que el desnivel.
        pista: |
          En la catenaria $s^{2} = y^{2} - c^{2}$, con el arco $s$ medido desde el
          vértice. Calcula $s_B$ y $s_C$.
        desarrollo: |
          $$
          s_B = \sqrt{\left(\tfrac{7}{5}\right)^{2} - \tfrac{3}{4}}\,L = 1{,}1\,L,
          \qquad
          s_C = \sqrt{1 - \tfrac{3}{4}}\,L = 0{,}5\,L
          $$

          $$
          \overline{BC} = s_B - s_C = 0{,}6\,L
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              En la catenaria $T = w\,y$, con $y$ desde la directriz; en el tramo
              que cuelga, $T$ es el peso de lo que cuelga por debajo.
          - texto: >-
              La polea ideal conserva la tensión: $T_B = w\cdot 7L/5$, luego
              $y_B = 7L/5$ y la directriz pasa por A.
          - texto: >-
              En C, $y_C = L$: $T_C = Mg$, $T_0 = T_C\cos 30^{\circ} =
              (\sqrt{3}/2)\,Mg$ y $c = (\sqrt{3}/2)\,L$.
          - texto: >-
              $\cos\theta_B = T_0/T_B$ da $\theta_B \approx 51{,}8^{\circ}$, y
              $s = \sqrt{y^{2} - c^{2}}$ da $\overline{BC} = 1{,}1L - 0{,}5L = 0{,}6L$.
          - texto: >-
              El cable forma en B el mismo ángulo que en C, porque la tensión
              horizontal es la misma en todo el cable.
            trampa: true
            mensaje: |
              Constante es la componente horizontal, no el ángulo. Como
              $\tan\theta = s/c$, el ángulo crece con el arco: de 30° en C a casi
              52° en B.
    resolucion: |
      **La idea que lo resuelve todo.** En una catenaria la tensión vale
      $T = w\,y$, con $y$ medida desde la directriz. Del otro lado de la polea
      el cable cuelga en vertical hasta su extremo libre A, y ahí la tensión en
      B es el peso de lo que cuelga: $T_B = w\cdot\tfrac{7}{5}L$, porque B está
      $2L/5 + L$ por encima de A. La polea es ideal y conserva el módulo de la
      tensión, así que en el lado de la catenaria también $T_B = w\,y_B$ con
      $y_B = 7L/5$: **la directriz es la horizontal de A**, que es también la
      de D.

      **a) Tensión mínima y parámetro.** C está a altura $L$ sobre la
      directriz:

      $$
      T_C = w\,y_C = Mg,
      \qquad
      T_0 = T_C\cos 30^{\circ} = \frac{\sqrt{3}}{2}\,Mg \approx 0{,}866\,Mg,
      \qquad
      c = \frac{T_0}{w} = \frac{\sqrt{3}}{2}\,L \approx 0{,}866\,L
      $$

      **b) El ángulo en B.** La componente horizontal es $T_0$ en todo el
      cable:

      $$
      \cos\theta_B = \frac{T_0}{T_B} = \frac{\sqrt{3}/2}{7/5} = 0{,}6186
      \;\Longrightarrow\;
      \theta_B \approx 51{,}79^{\circ}
      $$

      **b) La longitud BC.** El arco desde el vértice cumple $s^{2} = y^{2} - c^{2}$:

      $$
      s_B = \sqrt{1{,}96 - 0{,}75}\,L = 1{,}1\,L,
      \qquad
      s_C = \sqrt{1 - 0{,}75}\,L = 0{,}5\,L,
      \qquad
      \overline{BC} = 0{,}6\,L
      $$

      C y B están del mismo lado del vértice —el cable sube de C a B
      empinándose—, así que los arcos se restan.

      **Comprobación independiente.** Integrando el cable paso a paso desde C,
      con $T_0$ como incógnita y la condición de que la tensión a la altura de
      B valga $7Mg/5$, sale $T_0 = 0{,}8660\,Mg$, la directriz a la altura de
      A, $\theta_B = 51{,}79^{\circ}$ y $\overline{BC} = 0{,}6000\,L$. La
      polea queda $0{,}442\,L$ a la izquierda de C, que es como está en la
      figura redibujada.

