      <figcaption>

      El trozo de la izquierda de un corte entre A y C. En A, la reacción del apartado a); encima, la carga. En el corte, N, V y M con sus sentidos positivos sobre la cara derecha de un trozo izquierdo: N de tracción, V la suma de las fuerzas verticales a la izquierda, hacia abajo, y M, el que tracciona la fibra inferior, antihorario. Ejes: x hacia la derecha, y hacia arriba; momentos positivos en sentido antihorario.

      </figcaption>
      </figure>

      - **En el corte**, N, V y M con sus sentidos positivos: axil de
        tracción, V la suma de las fuerzas verticales a la izquierda, y M
        positivo si tracciona abajo. Con ese convenio, $dV/dx = -q$ y
        $dM/dx = V$ (cuestión 4 de este mismo examen).
      - **Más allá de C**, el trozo recoge también la carga horizontal de C,
        la resultante entera de la repartida y, pasado D, el par.

      **2. Incógnitas.** El axil, el cortante y el flector a lo largo de la
      viga; el flector máximo y su sección; el centro de gravedad y la inercia
      de la T; y las tensiones normales extremas.

      **3. Ecuaciones.** El trozo de la figura, con x desde A, y momentos
      respecto del corte:

      $$
      2Mg + N = 0,
      \qquad
      7Mg - \frac{4Mg}{L}\,x - V = 0,
      \qquad
      M - 7Mg\,x + \frac{2Mg}{L}\,x^{2} = 0
      $$

      Más allá de C, lo mismo con las cargas que se van sumando. La sección:
      ala de $5b\times b$ arriba y alma de $b\times 5b$ debajo, con sus centros
      a $5{,}5b$ y $2{,}5b$ de la base. Y la tensión,
      $\sigma = N/A - M\,y/I$.

      **4. Resultados.** **Axiles.** Entre A y C, $N = -2Mg$: la articulación
      empuja hacia la derecha y la carga de C empuja hacia la izquierda, y el
      tramo queda comprimido. De C a E, $N = 0$.

      **Cortantes.** En AC, $V = 7Mg - 4Mg\,x/L$: vale $7Mg$ en A, $3Mg$ en B
      y $-Mg$ en C, y se anula en $x = 7L/4$. De C a E, $V = -Mg$, que en E
      compensa el muelle.

      **Flectores.**

      $$
      0 \le x \le 2L:\quad M = 7Mg\,x - \frac{2Mg}{L}x^{2}
      $$

      $$
      2L \le x < 3L:\quad M = Mg\,(8L - x),
      \qquad
      3L < x \le 4L:\quad M = Mg\,(4L - x)
      $$

      Valores: $M(A) = 0$, $M(B) = 5MgL$, $M(C) = 6MgL$, $5MgL$ justo antes
      de D, $MgL$ justo después —el par antihorario lo hace bajar $4MgL$— y
      $M(E) = 0$. **El máximo es $49MgL/8 \approx 6{,}125\,MgL$, en la sección
      a $7L/4$ de A**, entre B y C, donde se anula el cortante.

