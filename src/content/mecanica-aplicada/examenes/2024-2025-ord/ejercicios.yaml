        <text x="92" y="84" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">O</text>
        <circle cx="100" cy="140" r="2.4" fill="var(--ink)"/>
        <text x="94" y="154" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">I</text>
