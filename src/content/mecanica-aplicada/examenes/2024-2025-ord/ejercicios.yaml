      <figcaption>

      Los tres diagramas a escala, con el flector positivo hacia arriba. El
      máximo del flector no cae en ningún punto con letra: está a **7L/4** de
      A, donde el cortante cruza el cero.

      </figcaption>
      </figure>

      **La sección.** Ala de $5b\times b$ arriba y alma de $b\times 5b$ debajo,
      las dos de área $5b^{2}$: $A = 10b^{2}$, centro de gravedad a
      $\overline{y} = 4b$ de la base (a $2b$ de la fibra superior) y

      $$
      I = \frac{5b\cdot b^{3}}{12} + 5b^{2}(1{,}5b)^{2} + \frac{b\,(5b)^{3}}{12}
      + 5b^{2}(1{,}5b)^{2} = \frac{100}{3}\,b^{4}
      $$

      **Tensiones** en la sección del máximo, con tracción positiva y $y$
      hacia arriba desde el centro de gravedad,
      $\sigma = N/A - M\,y/I$, $N = -2Mg$ y $M = 49MgL/8$:

      $$
      \sigma_{\max} = \sigma_{\text{inf}} = \frac{147}{200}\frac{MgL}{b^{3}} - \frac{Mg}{5b^{2}}
      \approx 0{,}735\,\frac{MgL}{b^{3}} - 0{,}2\,\frac{Mg}{b^{2}}
      $$

      $$
      \sigma_{\min} = \sigma_{\text{sup}} = -\frac{147}{400}\frac{MgL}{b^{3}} - \frac{Mg}{5b^{2}}
      \approx -0{,}3675\,\frac{MgL}{b^{3}} - 0{,}2\,\frac{Mg}{b^{2}}
      $$

      **Un matiz que el enunciado no resuelve.** La compresión máxima está
      seguro en esa sección: ahí coinciden el mayor flector y el axil de
      compresión. La tracción máxima, no del todo: justo a la derecha de C el
      flector vale $6MgL$ y el axil ya es nulo, y la fibra inferior da
      $0{,}72\,MgL/b^{3}$. Gana la sección de $7L/4$ solo si
      $0{,}015\,L/b > 0{,}2$, es decir, si $L > 40b/3$, que es lo esperable en
      una viga pero el enunciado no lo dice. La resolución de examen da la
      sección del máximo, y conviene dejar escrita la comprobación.

      **Comprobación independiente.** Integrando la carga numéricamente a lo
      largo de la viga, con el salto del par en D, sale $M_{\max} = 6{,}125\,MgL$
      en $x = 1{,}75L$ y $M(E) = 0$; y la sección integrada por franjas da
      $\overline{y} = 4b$ e $I = 33{,}33\,b^{4}$.

