      </figure>

      **5. Comprobación.** Los momentos respecto de E, que no se han usado y
      en los que no entra $F_m$: $-A_y\cdot 4L + 8Mg\cdot 3L + 4MgL = 0$, que
      da $A_y = 7Mg$ otra vez.

      **Lo que dice el resultado.** La articulación se lleva casi toda la
      carga, $7Mg$ de los $8Mg$, porque la carga está entera en la mitad de A.
      El par de D, antihorario, le quita al muelle la mitad del trabajo: sin
      él, el muelle tendría que tirar con $2Mg$. Y la carga horizontal de C
      solo la puede tomar A, porque el muelle es vertical.

  # ── Ejercicio 2 · b) y c) · los diagramas y las tensiones. El máximo del
  #    flector no está en ningún punto con letra, y la T no es simétrica
  #    respecto de su eje de flexión: las dos cosas que el ejercicio mide.
  - id: exma2425-ord-6-los-diagramas-y-las-tensiones-de-la-viga-en-t
    titulo: Los diagramas de la viga y las tensiones de su sección en T
    fuente: >-
      Ejercicio 2, apartados b) y c) · Convocatoria ordinaria de junio de
      2025, bloque 1 (Estática) · Mecánica Aplicada, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). La cabecera castellana de esta página dice
      «Dinámica» (la de euskera, «Estatika»), y el texto trae las erratas
      «siquientes» y «nomales», que se conservan. El examen no publica
      resolución; el desarrollo es nuestro.
    nivel: examen
    antes:
      idea: |
        Los esfuerzos de cada sección —axil, cortante y flector— salen del
        equilibrio del trozo que queda a un lado del corte. La tensión normal
        de la sección suma dos partes: la del axil, igual en toda ella, y la de
        flexión, que crece con la distancia al eje que pasa por el centro de
        gravedad.
      formula: |
        Con V la suma de las fuerzas verticales a la izquierda del corte, M
        positivo si tracciona la fibra inferior y q la carga repartida hacia
        abajo:

        $$
        \frac{dV}{dx} = -q
        \qquad
        \frac{dM}{dx} = V
        $$

        La tensión normal, con tracción positiva e y hacia arriba desde el
        centro de gravedad; y la sección, hecha de rectángulos, con $y_i$ la
        altura del centro de cada uno y $d_i$ su distancia al centro de
        gravedad:

        $$
        \sigma = \frac{N}{A} - \frac{M\,y}{I}
        \qquad
        \overline{y} = \frac{\sum A_i\,y_i}{\sum A_i}
        \qquad
        I = \sum\left(I_i + A_i\,d_i^{2}\right)
        $$
      reconocer: |
        Antes de calcular se recorre la viga tramo a tramo.
    enunciado: |
      La viga ABCDE de sección transversal en T soporta las siquientes
      fuerzas:

      - Carga uniformemente distribuida de valor $q_0 = 4Mg/L$.
      - Carga concentrada horizontal de valor $2Mg$ en la sección C.
      - Momento de valor $4MgL$ aplicado en la sección D.

      La viga tiene una articulación fija en A y en E está unida a un muelle
      de longitud no deformada nula, de constante $k$ a determinar. Se pide:

      **a)** (0,75p) Diagrama del sólido libre de la viga resuelto, indicando
      las reacciones que actúan sobre ella, la fuerza del muelle y su
      constante $k$.

      **b)** (1,5p) Diagramas de fuerzas axiales y cortantes y de momentos
      flectores en la viga. Determinar el momento máximo e indicar en qué
      sección ocurre.

      **c)** (0,75p) Tensiones nomales máxima y mínima en función de $M, g, L$
      y $b$.

