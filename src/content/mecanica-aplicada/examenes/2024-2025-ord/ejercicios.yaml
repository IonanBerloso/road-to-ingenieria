    pide: Los diagramas de axiles, cortantes y flectores, el flector máximo con su sección, y las tensiones normales extremas.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Dónde hay que buscar el momento flector máximo?
        opciones:
          - texto: >-
              Donde el cortante se anula, y en los extremos de cada tramo
              —donde hay una carga concentrada, un par o un cambio de carga—
            correcta: true
            mensaje: |
              Eso es. Como $dM/dx = V$, el flector es extremo donde $V = 0$
              dentro de un tramo, o en un borde de tramo, donde el diagrama
              cambia de ley o salta. Aquí $V$ se anula en $x = 7L/4$, entre B
              y C, y ese es el máximo.
          - texto: Donde el cortante es máximo, en A
            mensaje: |
              En A el cortante vale $7Mg$ y el flector es **cero**: la
              articulación no transmite momento. El cortante máximo da la
              pendiente máxima del flector, no su máximo.
          - texto: En D, donde está aplicado el par
            mensaje: |
              El par hace **saltar** el flector, y aquí lo hace bajar: de
              $5MgL$ justo antes de D a $MgL$ justo después. Un salto es un
              candidato, pero no garantiza el máximo.
          - texto: En C, el centro de la viga, que es donde acaba la carga
            mensaje: |
              $M(2L) = 6MgL$ es un candidato, pero no el máximo: el cortante
              cambia de signo antes de llegar a C, en $x = 7L/4$, y ahí el
              flector vale $49MgL/8 \approx 6{,}125\,MgL$.
      - tipo: calcular
        titulo: El flector máximo
        pregunta: |
          ¿Cuánto vale el momento flector máximo, en unidades de $MgL$?
        respuesta:
          tipo: numero
          valor: '6.125'
          tolerancia: 0.005
          formato: un número, en unidades de MgL; vale la forma exacta, como 49/8
        distractores:
          - valor: '6'
            mensaje: |
              Es el flector en C, donde acaba la carga. El máximo está un poco
              antes: el cortante se anula en $x = 7L/4$ y el flector allí es
              $7\cdot\tfrac{7}{4} - 2\left(\tfrac{7}{4}\right)^{2} = \tfrac{49}{8}$.
          - valor: '3.125'
            mensaje: |
              Es lo que sale con el par de D horario: el muelle haría $3Mg$,
              $A_y = 5Mg$ y el cortante se anularía en $x = 5L/4$. El par es
              antihorario, y $A_y = 7Mg$.
        pista: |
          En AC, $V = 7Mg - 4Mg\,x/L$ y $M = 7Mg\,x - 2Mg\,x^{2}/L$. Iguala el
          cortante a cero.
        desarrollo: |
          $$
          V = 0 \;\Longrightarrow\; x = \frac{7L}{4},
          \qquad
          M_{\max} = 7Mg\cdot\frac{7L}{4} - \frac{2Mg}{L}\left(\frac{7L}{4}\right)^{2}
          = \frac{49}{8}\,MgL \approx 6{,}125\,MgL
          $$

          Ocurre en la sección a $7L/4$ de A, entre B y C, a $3L/4$ de B.
      - tipo: calcular
        titulo: El centro de gravedad de la T
        pregunta: |
          ¿A qué altura sobre la base del alma está el centro de gravedad de la
          sección, en unidades de $b$?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.001
          formato: un número, en unidades de b
        distractores:
          - valor: '3'
            mensaje: |
              Es la mitad de la altura total, $6b/2$. Eso solo vale con una
              sección simétrica respecto de un eje horizontal, y la T no lo es:
              el ala, arriba, tiene tanta área como el alma entera.
          - valor: '2'
            mensaje: |
              Es la distancia del centro de gravedad a la fibra **superior**. La
              pregunta la mide desde la base del alma: $6b - 2b = 4b$.
        pista: |
          Ala: área $5b^{2}$ con su centro a $5{,}5b$ de la base. Alma: área
          $5b^{2}$ con su centro a $2{,}5b$.
        desarrollo: |
          $$
          \overline{y} = \frac{5b^{2}\cdot 5{,}5b + 5b^{2}\cdot 2{,}5b}{10b^{2}} = 4b
          $$

          Las dos áreas son iguales, así que el centro queda en el punto medio
          de sus dos centros.
      - tipo: calcular
        titulo: El momento de inercia de la T
        pregunta: |
          ¿Cuánto vale el momento de inercia de la sección respecto de su eje
          horizontal por el centro de gravedad, en unidades de $b^{4}$?
        respuesta:
          tipo: numero
          valor: '33.3333'
          tolerancia: 0.01
          formato: un número, en unidades de b⁴; vale la forma exacta, como 100/3
        distractores:
          - valor: '10.8333'
            mensaje: |
              Has sumado los momentos de inercia propios del ala y del alma,
              $5/12 + 125/12$, sin Steiner. Cada rectángulo tiene su centro a
              $1{,}5b$ del centro de la T, y eso suma $2\cdot 5b^{2}\cdot(1{,}5b)^{2}$.
          - valor: '193.333'
            mensaje: |
              Es el momento respecto de la **base** del alma. Para la flexión
              hace falta el del eje que pasa por el centro de gravedad:
              $I_G = I_{\text{base}} - A\,\overline{y}^{2} = 193{,}3 - 160$.
        pista: |
          Steiner en cada rectángulo: $I = \dfrac{\text{ancho}\cdot\text{alto}^{3}}{12} + A\,d^{2}$,
          con $d = 1{,}5b$ en los dos.
        desarrollo: |
          $$
          I_{\text{ala}} = \frac{5b\cdot b^{3}}{12} + 5b^{2}(1{,}5b)^{2} = \frac{35}{3}\,b^{4},
          \qquad
          I_{\text{alma}} = \frac{b\,(5b)^{3}}{12} + 5b^{2}(1{,}5b)^{2} = \frac{65}{3}\,b^{4}
          $$

          $$
          I = \frac{100}{3}\,b^{4} \approx 33{,}33\,b^{4}
          $$
      - tipo: calcular
        titulo: La parte del axil
        pregunta: |
          En la sección del flector máximo, la tensión normal tiene una parte
          uniforme, $N/A$. Escrita como $\alpha\,Mg/b^{2}$, ¿cuánto vale
          $\alpha$? Con signo: tracción positiva.
        respuesta:
          tipo: numero
          valor: '-0.2'
          tolerancia: 0.001
          formato: un número, en unidades de Mg/b²
        distractores:
          - valor: '0'
            mensaje: |
              Has dejado fuera el axil. Entre A y C la viga está comprimida:
              la articulación tira hacia la derecha con $2Mg$ y la carga de C
              empuja hacia la izquierda con $2Mg$. La sección del máximo, a
              $7L/4$, está en ese tramo.
          - valor: '0.2'
            mensaje: |
              El valor está bien y el signo no. Las dos fuerzas horizontales
              aprietan el tramo AC desde sus extremos: el axil es de
              **compresión**, $N = -2Mg$.
          - valor: '-0.4'
            mensaje: |
              Has dividido solo por el área del alma, $5b^{2}$. El axil se
              reparte por toda la sección: $A = 5b^{2} + 5b^{2} = 10b^{2}$.
        pista: |
          En AC, $N = -2Mg$. El área de la T es $10b^{2}$.
        desarrollo: |
          $$
          \frac{N}{A} = \frac{-2Mg}{10b^{2}} = -\frac{Mg}{5b^{2}}
          $$
      - tipo: calcular
        titulo: La fibra superior
        pregunta: |
          En la fibra superior de esa sección, la parte de flexión se escribe
          $\beta\,MgL/b^{3}$. ¿Cuánto vale $\beta$? Con signo: tracción
          positiva.
        respuesta:
          tipo: numero
          valor: '-0.3675'
          tolerancia: 0.001
          formato: un número, en unidades de MgL/b³; vale la forma exacta, como -147/400
        distractores:
          - valor: '-0.735'
            mensaje: |
              Has usado la distancia de la fibra **inferior**, $4b$. La fibra
              superior está a $2b$ del centro de gravedad: la mitad de lejos,
              la mitad de tensión.
          - valor: '-0.36'
            mensaje: |
              Has usado el flector de C, $6MgL$. La sección más cargada es la
              del máximo, $49MgL/8$, un poco antes de C.
        pista: |
          $\sigma = -\dfrac{M\,y}{I}$ con $y = +2b$ y $M = \tfrac{49}{8}MgL$.
          Un flector positivo comprime arriba.
        desarrollo: |
          $$
          -\frac{M\,y_{\text{sup}}}{I}
          = -\frac{\tfrac{49}{8}MgL\cdot 2b}{\tfrac{100}{3}b^{4}}
          = -\frac{147}{400}\,\frac{MgL}{b^{3}} \approx -0{,}3675\,\frac{MgL}{b^{3}}
          $$
      - tipo: calcular
        titulo: La fibra inferior
        pregunta: |
          Y en la fibra inferior de la misma sección, ¿cuánto vale el
          coeficiente de $MgL/b^{3}$ de la parte de flexión? Con signo.
        respuesta:
          tipo: numero
          valor: '0.735'
          tolerancia: 0.001
          formato: un número, en unidades de MgL/b³; vale la forma exacta, como 147/200
        distractores:
          - valor: '0.3675'
            mensaje: |
              Es la de la fibra superior con el signo cambiado. La inferior está
              a $4b$ del centro de gravedad, el doble que la superior: su
              tensión de flexión es el doble.
          - valor: '0.72'
            mensaje: |
              Has usado el flector de C, $6MgL$. En la sección del máximo el
              flector es $49MgL/8$. Ojo: si la viga es corta, justo a la derecha
              de C —sin axil— la tracción puede ganar; lo explica la resolución.
        pista: |
          $\sigma = -\dfrac{M\,y}{I}$ con $y = -4b$.
        desarrollo: |
          $$
          -\frac{M\,y_{\text{inf}}}{I}
          = \frac{\tfrac{49}{8}MgL\cdot 4b}{\tfrac{100}{3}b^{4}}
          = \frac{147}{200}\,\frac{MgL}{b^{3}} \approx 0{,}735\,\frac{MgL}{b^{3}}
          $$

          Juntando con el axil, en $x = 7L/4$:

          $$
          \sigma_{\max} = \frac{147}{200}\frac{MgL}{b^{3}} - \frac{Mg}{5b^{2}},
          \qquad
          \sigma_{\min} = -\frac{147}{400}\frac{MgL}{b^{3}} - \frac{Mg}{5b^{2}}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución de b) y c). Una pieza es falsa.
        piezas:
          - texto: >-
              En AC el axil es $-2Mg$, de compresión, y en CE es nulo.
          - texto: >-
              El cortante baja de $7Mg$ en A a $-Mg$ en C y se anula en
              $x = 7L/4$; de C a E vale $-Mg$.
          - texto: >-
              El flector máximo es $49MgL/8$ en $x = 7L/4$; en D salta de
              $5MgL$ a $MgL$ por el par, y en E vale cero.
          - texto: >-
              Con $\overline{y} = 4b$ e $I = 100b^{4}/3$, la fibra inferior de esa
              sección da la tracción máxima y la superior la compresión máxima.
          - texto: >-
              La T es simétrica respecto de su eje vertical, así que la tensión
              máxima y la mínima valen lo mismo con el signo cambiado.
            trampa: true
            mensaje: |
              La simetría que importa es respecto del eje de **flexión**, el
              horizontal, y la T no la tiene: su centro de gravedad está a $2b$
              del borde superior y a $4b$ del inferior. La tracción de flexión
              abajo es el doble que la compresión arriba, y encima el axil las
              desplaza a las dos.
    resolucion: |
      **Reacciones** (apartado a): $A_x = 2Mg$ hacia la derecha,
      $A_y = 7Mg$ hacia arriba y el muelle $Mg$ hacia arriba en E. Convenio:
      axil positivo de tracción, cortante positivo si sube en la cara
      izquierda y flector positivo si tracciona abajo; con él,
      $dV/dx = -q$ y $dM/dx = V$ (cuestión 4 de este mismo examen).

      **Axiles.** Entre A y C, $N = -2Mg$: la articulación tira hacia la
      derecha y la carga de C empuja hacia la izquierda, y el tramo queda
      comprimido. De C a E, $N = 0$.

      **Cortantes.** En AC, $V = 7Mg - 4Mg\,x/L$: vale $7Mg$ en A, $3Mg$ en B
      y $-Mg$ en C, y se anula en $x = 7L/4$. De C a E, $V = -Mg$, que en E
      compensa el muelle.

      **Flectores.**

      $$
      0 \le x \le 2L:\quad M = 7Mg\,x - \frac{2Mg}{L}x^{2}
      $$

      $$
      2L \le x < 3L:\quad M = Mg\,(8L - x),
      \qquad
      3L < x \le 4L:\quad M = Mg\,(4L - x)
      $$

      Valores: $M(A) = 0$, $M(B) = 5MgL$, $M(C) = 6MgL$, $5MgL$ justo antes
      de D, $MgL$ justo después —el par antihorario lo hace bajar $4MgL$— y
      $M(E) = 0$. **El máximo es $49MgL/8 \approx 6{,}125\,MgL$, en la sección
      a $7L/4$ de A**, entre B y C, donde se anula el cortante.

      <figure class="figura-examen">
      <svg viewBox="20 12 440 296" role="img" width="440" height="296"
