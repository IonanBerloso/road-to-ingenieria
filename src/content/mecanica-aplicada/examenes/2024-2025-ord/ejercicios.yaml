    pide: La tensión mínima y el parámetro de la catenaria, el ángulo en B y la longitud del tramo BC.
    pasos:
      - tipo: reconocer
        pregunta: |
          Del otro lado de la polea el cable cuelga libre hasta A, que está a la
          altura de D. ¿Qué te da ese tramo?
        opciones:
          - texto: >-
              La tensión en B, igual al peso del tramo que cuelga,
              $w\cdot 7L/5$; y como en la catenaria $T = w\,y$, A está en la
              directriz
            correcta: true
            mensaje: |
              Eso es. Una polea ideal conserva el módulo de la tensión, y en un
              tramo vertical la tensión es el peso de lo que cuelga por debajo.
              En la catenaria $T = w\,y$ con $y$ medida desde la directriz, así
              que la directriz es la horizontal del extremo libre: la de A y D.
          - texto: >-
              La tensión en B vale $T_0$, porque la polea solo cambia la
              dirección
            mensaje: |
              La polea conserva el **módulo** de la tensión, y el módulo en B no
              es $T_0$: $T_0$ es la componente horizontal, que en B es solo una
              parte de la tensión, porque ahí el cable sube inclinado.
          - texto: >-
              Nada: la catenaria de C a B se resuelve solo con el ángulo en C
            mensaje: |
              El ángulo en C da la dirección de la tensión, no su tamaño. Hace
              falta una ecuación de módulo, y es justo la del tramo colgante.
              Sin él tendrías una catenaria por dos puntos sin su longitud, y
              eso no se resuelve a mano.
          - texto: El vértice de la catenaria está en C
            mensaje: |
              En el vértice la tangente es horizontal y la tensión es mínima.
              En C el cable forma 30° con la horizontal, así que C no es el
              vértice: el vértice queda más allá de C, fuera del tramo real.
      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna ecuación: **el tramo que cuelga de la
          polea, solo**, y **el tramo de catenaria entre C y B, solo**.
        comprueba:
          - punto: |
              **El tramo que cuelga: arriba, la tensión en B, hacia arriba;
              abajo, su peso, $w\cdot 7L/5$.**
            porque: |
              Es un trozo de cable colgado de la polea hasta su extremo libre:
              solo lo sostiene la tensión de arriba.
          - punto: |
              **El tramo CB: en C, $T_C$, tangente al cable, hacia el bloque, a
              30° de la horizontal; en B, $T_B$, tangente, hacia la polea.**
            porque: |
              Un cable solo tira, y a lo largo de sí mismo: en C tira el
              bloque, y en B, la polea.
          - punto: |
              **El peso del tramo CB, repartido a lo largo del cable.**
            porque: |
              El peso va por unidad de longitud de cable, no por unidad de
              horizontal.
