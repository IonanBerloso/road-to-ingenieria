ejercicios:
  # ── Teoría · cuestión 1 · el eje central que pasa por E. Todo sale de una
  #    sola ecuación vectorial: el momento en E, trasladado desde O, es R.
  - id: exma2425-ord-1-el-eje-central-que-pasa-por-e
    titulo: El eje central que pasa por E, con la resultante igual al momento mínimo
    fuente: >-
      Cuestión 1 de teoría · Convocatoria ordinaria de junio de 2025, bloque 1
      (Estática) · Mecánica Aplicada, Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU). En la columna en castellano vale 1,5 puntos y sus apartados
      van rotulados c) y d); en la de euskera vale 1 punto y son a) y b). El
      examen no publica resolución; el desarrollo es nuestro.
    nivel: examen
    enunciado: |
      (1,5p) En un sistema de vectores deslizantes, el momento resultante
      respecto al origen es $\vec{M}_O = 2\hat{k}$. El eje central pasa por el
      punto E(0; 1; 0). La resultante y el momento mínimo son iguales,
      $\vec{R} = \vec{M}_{\min}$. El sistema está formado por los vectores
      $\vec{v}_1 = a\hat{\imath} + a\hat{\jmath} + a\hat{k}$ y
      $\vec{v}_2 = b\hat{\jmath} + c\hat{k}$. Determinar:

      **c)** La resultante $\vec{R}$ y el invariante escalar $\tau$.

      **d)** Los parámetros $a, b, c$.
    pide: La resultante, el invariante escalar y los tres parámetros de los dos vectores.
    pasos:
      - tipo: reconocer
        pregunta: |
          E está en el eje central. ¿Qué afirma eso sobre el momento del
          sistema en E?
        opciones:
          - texto: >-
              Que es el momento mínimo, paralelo a la resultante; y como aquí
              el mínimo es igual a la resultante, $\vec{M}_E = \vec{R}$
            correcta: true
            mensaje: |
              Eso es. El eje central es el lugar de los puntos cuyo momento es
              paralelo a $\vec{R}$, y ahí el momento vale lo mínimo posible. El
              dato $\vec{R} = \vec{M}_{\min}$ convierte esa idea en una
              igualdad de vectores con la que ya se puede calcular.
          - texto: Que el momento en E es nulo
            mensaje: |
              Solo si el invariante escalar fuera cero. En el eje central el
              momento es el **mínimo**, no el nulo, y aquí el mínimo vale
              $\vec{R}$, que no es cero.
          - texto: Que $\vec{M}_O$ ya es el momento mínimo, porque va según un eje
            mensaje: |
              $\vec{M}_O$ solo sería el mínimo si O estuviera en el eje
              central, y el enunciado dice que el eje pasa por E. Ir según
              $\hat{k}$ no lo hace paralelo a $\vec{R}$.
          - texto: Que E es el punto donde están aplicados los dos vectores
            mensaje: |
              Los vectores deslizantes no tienen un punto fijo: se pueden
              mover a lo largo de su recta. El eje central es del **sistema**,
              no de cada vector.
      - tipo: calcular
        titulo: La resultante
        pregunta: |
          Traslada el momento de O a E e iguálalo a $\vec{R}$. ¿Cuánto vale
          $\vec{R}$?
        respuesta:
          tipo: vector
          valor: '(-1, 0, 1)'
          tolerancia: 0.001
          formato: las tres componentes en orden, por ejemplo (2, 0, -3)
        distractores:
          - valor: '(1, 0, 1)'
            mensaje: |
              Has trasladado con el producto al revés, $\vec{OE}\times\vec{R}$.
              La fórmula es $\vec{M}_E = \vec{M}_O + \vec{EO}\times\vec{R}$,
              que es lo mismo que $\vec{M}_O + \vec{R}\times\vec{OE}$. El
              producto vectorial no conmuta y el signo decide el resultado.
          - valor: '(0, 0, 2)'
            mensaje: |
              Has tomado $\vec{M}_O$ como el momento mínimo y lo has igualado
              a $\vec{R}$. Eso pondría el eje central por el origen, y el
              enunciado lo hace pasar por E: hay que trasladar primero.
        pista: |
          $\vec{M}_E = \vec{M}_O + \vec{R}\times\vec{OE}$, con
          $\vec{OE} = \hat{\jmath}$. Escribe $\vec{R} = (R_x, R_y, R_z)$ e
          iguala componente a componente.
        desarrollo: |
          $$
          \vec{R}\times\hat{\jmath} = (-R_z,\ 0,\ R_x)
          \;\Longrightarrow\;
          \vec{M}_E = (-R_z,\ 0,\ 2 + R_x)
          $$

          Igualando a $(R_x, R_y, R_z)$: $R_x = -R_z$, $R_y = 0$ y
          $R_z = 2 + R_x$. De ahí $R_z = 1$, $R_x = -1$:

          $$
          \vec{R} = -\hat{\imath} + \hat{k}
          $$
      - tipo: calcular
        titulo: El invariante escalar
        pregunta: |
          Tomando el invariante escalar como el producto
          $\tau = \vec{R}\cdot\vec{M}_O$, ¿cuánto vale?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2.8284'
            mensaje: |
              Has multiplicado los módulos, $|\vec{R}|\,|\vec{M}_O| = 2\sqrt{2}$.
              El producto escalar lleva el coseno del ángulo que forman, y
              aquí $\vec{R}$ y $\vec{M}_O$ forman 45°.
          - valor: '1.4142'
            mensaje: |
              Eso es $|\vec{M}_{\min}| = \tau/|\vec{R}|$, la proyección del
              momento sobre la resultante. Aquí coincide con $|\vec{R}|$ por el
              dato del enunciado, pero la pregunta pide el producto escalar
              sin dividir.
        pista: |
          $\vec{R}\cdot\vec{M}_O = (-1)(0) + (0)(0) + (1)(2)$. Y el invariante
          vale lo mismo en cualquier punto: prueba con $\vec{M}_E = \vec{R}$.
        desarrollo: |
          $$
          \tau = \vec{R}\cdot\vec{M}_O = 2
          $$

          Comprobación del dato: $\vec{M}_{\min} = \dfrac{\tau}{R^{2}}\vec{R}
          = \dfrac{2}{2}\vec{R} = \vec{R}$. Y en E, donde el momento es
          $\vec{R}$, sale $\vec{R}\cdot\vec{R} = 2$ otra vez, como tiene que
          pasar con un invariante.
      - tipo: calcular
        titulo: Los tres parámetros
        pregunta: |
          La resultante es la suma de los dos vectores. ¿Cuánto valen
          $(a, b, c)$?
        respuesta:
          tipo: vector
          valor: '(-1, 1, 2)'
          tolerancia: 0.001
          formato: los tres parámetros en el orden (a, b, c)
        distractores:
          - valor: '(1, -1, 0)'
            mensaje: |
              Son los parámetros que salen de $\vec{R} = (1, 0, 1)$, la
              resultante del traslado con el producto vectorial al revés. El
              paso de la suma está bien; revisa el signo del traslado.
          - valor: '(-1, 0, 1)'
            mensaje: |
              Has copiado las componentes de $\vec{R}$ como si fueran $a$, $b$
              y $c$. Pero $\vec{v}_1$ también tiene componentes en
              $\hat{\jmath}$ y $\hat{k}$: $\vec{R} = (a,\ a+b,\ a+c)$.
        pista: |
          $\vec{v}_1 + \vec{v}_2 = (a,\ a+b,\ a+c) = (-1,\ 0,\ 1)$.
        desarrollo: |
          $$
          a = -1,\qquad a + b = 0 \Rightarrow b = 1,\qquad
          a + c = 1 \Rightarrow c = 2
          $$

          Los vectores son $\vec{v}_1 = -\hat{\imath}-\hat{\jmath}-\hat{k}$ y
          $\vec{v}_2 = \hat{\jmath} + 2\hat{k}$, y suman $-\hat{\imath}+\hat{k}$.
      - tipo: justificar
        pregunta: Ordena la respuesta de examen. Una pieza es falsa.
        piezas:
          - texto: >-
              El momento en E se obtiene trasladando el de O,
              $\vec{M}_E = \vec{M}_O + \vec{R}\times\vec{OE}$.
          - texto: >-
              Como E está en el eje central y $\vec{R} = \vec{M}_{\min}$, el
              momento en E es $\vec{R}$, y de ahí $\vec{R} = -\hat{\imath} + \hat{k}$.
          - texto: >-
              El invariante es $\tau = \vec{R}\cdot\vec{M}_O = 2$, y
              $\vec{M}_{\min} = (\tau/R^{2})\,\vec{R} = \vec{R}$ confirma el dato.
          - texto: >-
              Con $\vec{R} = (a,\ a+b,\ a+c)$ salen $a = -1$, $b = 1$ y $c = 2$.
          - texto: >-
              Como el eje central pasa por E, el momento en E es nulo y basta
              con $\vec{M}_O = \vec{OE}\times\vec{R}$.
            trampa: true
            mensaje: |
              El momento solo es nulo en el eje central si el invariante lo
              es. Aquí $\tau = 2$: en el eje el momento es el mínimo, y el
              enunciado dice que ese mínimo es $\vec{R}$, no cero.
    resolucion: |
      **Qué dice el eje central.** Es el lugar de los puntos donde el momento
      del sistema es paralelo a la resultante, y ese momento es el mínimo. El
      enunciado da además $\vec{R} = \vec{M}_{\min}$, así que en E, que está
      en el eje, el momento es exactamente $\vec{R}$.

      **La resultante.** Se traslada el momento de O a E:

      $$
      \vec{M}_E = \vec{M}_O + \vec{R}\times\vec{OE}
      = (0, 0, 2) + (R_x, R_y, R_z)\times(0, 1, 0)
      = (-R_z,\ 0,\ 2 + R_x)
      $$

      Igualando a $\vec{R}$ componente a componente, $R_x = -R_z$, $R_y = 0$ y
      $R_z = 2 + R_x$, de donde

      $$
      \vec{R} = -\hat{\imath} + \hat{k}
      $$

      **El invariante escalar.** Tomado como el producto escalar de la
      resultante por el momento en cualquier punto:

      $$
      \tau = \vec{R}\cdot\vec{M}_O = 2
      $$

      Se comprueba con el dato: $\vec{M}_{\min} = (\tau/R^{2})\,\vec{R} =
      (2/2)\,\vec{R} = \vec{R}$. Su módulo, $\sqrt{2}$, es la proyección
      $\tau/|\vec{R}|$; si tu libro llama invariante a esa proyección, la
      cifra es esa, y conviene decir en el examen cuál de las dos das.

      **Los parámetros.** La resultante es la suma de los dos vectores:

      $$
      \vec{v}_1 + \vec{v}_2 = (a,\ a+b,\ a+c) = (-1,\ 0,\ 1)
      \;\Longrightarrow\; a = -1,\quad b = 1,\quad c = 2
      $$

      Los vectores no dicen por dónde pasan, y no hace falta: el momento
      $\vec{M}_O$ ya viene dado, y la resultante no depende del punto.

  # ── Teoría · cuestión 2 · la rueda con par motor. El rozamiento sale hacia
  #    delante, y es justo lo que el enunciado quiere que se diga.
  - id: exma2425-ord-2-el-rozamiento-que-empuja-la-rueda
    titulo: La rueda con par motor, y el rozamiento que empuja hacia delante
    fuente: >-
      Cuestión 2 de teoría · Convocatoria ordinaria de junio de 2025, bloque 1
      (Estática) · Mecánica Aplicada, Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU). En la columna en castellano vale 1,5 puntos y en la de
      euskera 1. El examen no publica resolución; el desarrollo es nuestro.
    nivel: examen
    enunciado: |
      (1,5p) La rueda de radio $R$ de la figura. En su centro están aplicadas
      la fuerza conocida F, el momento $5FR$ y la fuerza horizontal
      desconocida $H$. Sabiendo que rueda hacia la derecha a velocidad
      constante y que el coeficiente de resistencia a la rodadura es
      $\mu_r = 0{,}05R$, determinar la fuerza de rozamiento en función de
      $F$, indicando su sentido.

      <figure class="figura-examen">
      <svg viewBox="30 14 200 206" role="img" width="260" height="268"
           aria-labelledby="ma2425o2t ma2425o2d">
        <title id="ma2425o2t">La rueda con la fuerza F, el momento 5FR y la fuerza H en el centro</title>
        <desc id="ma2425o2d">Una rueda de radio R apoyada en un suelo
        horizontal. En su centro actúan tres cargas: una fuerza F vertical
        hacia abajo, un momento de valor 5FR en sentido horario y una fuerza
        horizontal H, desconocida, dibujada hacia la derecha. La rueda avanza
        hacia la derecha a velocidad constante.</desc>
        <circle cx="130" cy="110" r="80" fill="var(--faint)" fill-opacity=".10"
                stroke="var(--ink)" stroke-width="1.6"/>
        <line x1="40" y1="190" x2="220" y2="190" stroke="var(--ink)" stroke-width="2.4"/>
        <path d="M48 192 L40 204 M64 192 L56 204 M80 192 L72 204 M96 192 L88 204
                 M112 192 L104 204 M128 192 L120 204 M144 192 L136 204 M160 192 L152 204
                 M176 192 L168 204 M192 192 L184 204 M208 192 L200 204 M220 196 L215 204"
              fill="none" stroke="var(--faint)" stroke-width="1"/>
        <circle cx="130" cy="110" r="4" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.4"/>
        <line x1="130" y1="114" x2="130" y2="150" stroke="var(--ink)" stroke-width="1.8"/>
        <polygon points="130,158 125.5,148 134.5,148" fill="var(--ink)"/>
        <text x="137" y="160" font-size="13" font-style="italic" fill="var(--ink)">F</text>
        <line x1="134" y1="110" x2="170" y2="110" stroke="var(--faint)" stroke-width="1.8"/>
        <polygon points="178,110 168,105.5 168,114.5" fill="var(--faint)"/>
        <text x="166" y="101" font-size="13" font-style="italic" fill="var(--faint)">H</text>
        <path d="M115 136 A30 30 0 0 1 140.3 81.8" fill="none" stroke="var(--ink)" stroke-width="1.8"/>
        <polygon points="145.9,83.9 138.2,84.8 140.6,78.2" fill="var(--ink)"/>
        <text x="84" y="80" font-size="13" font-style="italic" fill="var(--ink)">5FR</text>
        <line x1="186" y1="42" x2="214" y2="42" stroke="var(--live)" stroke-width="1.6"/>
        <polygon points="220,42 212,38 212,46" fill="var(--live)"/>
        <text x="184" y="33" font-size="10" fill="var(--live)">avance</text>
      </svg>
      <figcaption>

      Redibujada del enunciado, con la rueda a escala. La **H** va en gris,
      como en el original, porque es la incógnita: su sentido dibujado no
      está garantizado. La flecha de **avance** es nuestra.

      </figcaption>
      </figure>
    pide: El valor de la fuerza de rozamiento en función de F, y hacia dónde apunta.
    pasos:
      - tipo: reconocer
        pregunta: |
          El coeficiente $\mu_r = 0{,}05R$ tiene unidades de longitud. ¿Qué
          hace en el equilibrio de la rueda?
        opciones:
          - texto: >-
              Adelanta la normal $0{,}05R$ en el sentido del avance, y así
              aparece un par $0{,}05R\,N$ que se opone al giro
            correcta: true
            mensaje: |
              Eso es. Rueda y suelo se deforman un poco y la presión de
              contacto se carga hacia delante: la normal deja de pasar por el
              centro y su brazo, $\mu_r$, es el que da el par resistente.
          - texto: >-
              Es un coeficiente de rozamiento, así que la fuerza de rozamiento
              vale $\mu_r N$
            mensaje: |
              Un coeficiente de Coulomb es adimensional, y este lleva $R$
              dentro: es una longitud. Multiplicado por $N$ da un **par**, no
              una fuerza. Y el rozamiento de una rueda que no desliza no vale
              $\mu N$: vale lo que pida el equilibrio.
          - texto: >-
              Retrasa la normal $0{,}05R$, hacia atrás del centro
            mensaje: |
              Con la normal detrás del centro su par **ayudaría** a girar en el
              sentido del avance, y la rodadura no costaría nada. La
              resistencia existe porque la normal se adelanta.
          - texto: >-
              Nada: como la rueda no desliza, no hay rozamiento y no hay más
              que calcular
            mensaje: |
              Sin deslizamiento hay rozamiento **estático**, y es el que
              impide que la rueda patine. Lo que no se sabe de antemano es su
              valor ni su sentido, y eso es lo que pide la cuestión.
      - tipo: calcular
        titulo: La fuerza de rozamiento
        pregunta: |
          Toma momentos respecto del centro de la rueda. ¿Cuánto vale la
          fuerza de rozamiento, en unidades de $F$? Con signo: positiva si
          apunta hacia la derecha.
        respuesta:
          tipo: numero
          valor: '4.95'
          tolerancia: 0.005
          formato: un número, en unidades de F; positivo hacia la derecha
        distractores:
          - valor: '5'
            mensaje: |
              Has olvidado la resistencia a la rodadura: con la normal pasando
              por el centro, el rozamiento equilibraría él solo el par $5FR$.
              La normal va adelantada $0{,}05R$ y se lleva $0{,}05FR$ del par.
          - valor: '-4.95'
            mensaje: |
              El valor está bien y el sentido no. Has supuesto que el
              rozamiento se opone al avance, y eso vale para una rueda
              arrastrada. Esta lleva un par motor de $5FR$: el suelo tiene
              que empujarla hacia delante para que no patine.
          - valor: '0.05'
            mensaje: |
              Has usado $\mu_r$ como un coeficiente de Coulomb, $F_r = \mu_r N$.
              Eso no es una fuerza: $\mu_r N = 0{,}05FR$ es el par de
              resistencia a la rodadura, que entra en la ecuación de momentos.
        pista: |
          Normal $N = F$, adelantada $0{,}05R$. Respecto del centro: el par
          aplicado es horario, y el rozamiento (a distancia $R$ por debajo) y
          la normal adelantada dan momentos antihorarios.
        desarrollo: |
          $$
          5FR = F_r\,R + 0{,}05R\,N,\qquad N = F
          $$

          $$
          F_r = 5F - 0{,}05F = 4{,}95\,F
          $$

          Sale positiva: el rozamiento apunta **hacia la derecha**, en el
          sentido del avance.
      - tipo: calcular
        titulo: La fuerza H
        pregunta: |
          Con el rozamiento ya calculado, ¿cuánto vale $H$, en unidades de $F$?
          Positiva si apunta hacia la derecha, como en la figura.
        respuesta:
          tipo: numero
          valor: '-4.95'
          tolerancia: 0.005
          formato: un número, en unidades de F; positivo hacia la derecha
        distractores:
          - valor: '4.95'
            mensaje: |
              Has dejado $H$ con el sentido del dibujo. El equilibrio
              horizontal es $H + F_r = 0$, y con $F_r$ hacia la derecha, $H$
              tiene que ir hacia la izquierda: frena la rueda para que el par
              no la acelere.
          - valor: '-5.05'
            mensaje: |
              Has puesto el par de resistencia a la rodadura a favor del giro,
              $F_r = 5F + 0{,}05F$. La normal se adelanta y su par se opone al
              avance: resta, no suma.
        pista: |
          Equilibrio horizontal de la rueda: $H + F_r = 0$.
        desarrollo: |
          $$
          H = -F_r = -4{,}95\,F
          $$

          Es decir, $4{,}95F$ hacia la **izquierda**: el dibujo la pinta al
          revés, y por eso va en gris. Por momentos respecto del punto de
          contacto sale lo mismo sin pasar por el rozamiento:
          $5FR + H R = 0{,}05R\,F$.
      - tipo: justificar
        pregunta: Ordena la respuesta de examen. Una pieza es falsa.
        piezas:
          - texto: >-
              A velocidad constante la rueda está en equilibrio: fuerzas y
              momentos suman cero.
          - texto: >-
              En vertical, $N = F$. La normal va adelantada $0{,}05R$ y su
              par, $0{,}05FR$, se opone al giro horario.
          - texto: >-
              Momentos respecto del centro, $5FR = F_r R + 0{,}05FR$, luego
              $F_r = 4{,}95F$.
          - texto: >-
              Sale positiva: el rozamiento apunta hacia la derecha, y
              $H = -4{,}95F$ apunta hacia la izquierda.
          - texto: >-
              El rozamiento siempre se opone al movimiento, así que apunta
              hacia la izquierda.
            trampa: true
            mensaje: |
              Se opone al **deslizamiento** que habría sin él, no al avance. Con
              un par motor el punto de contacto tendería a patinar hacia atrás,
              y el suelo lo impide empujando hacia delante. Es lo que hace el
              suelo con la rueda motriz de un coche.
    resolucion: |
      **Hipótesis.** A velocidad constante la rueda está en equilibrio. El
      enunciado no da su peso, así que se toma incluido en $F$ o despreciable:
      la única carga vertical es $F$.

      **La resistencia a la rodadura.** $\mu_r = 0{,}05R$ es una longitud: es
      lo que la normal se adelanta respecto de la vertical del centro, en el
      sentido del avance. Con la normal ahí, su par respecto del centro se
      opone al giro.

      **Equilibrio.** En vertical, $N = F$. Momentos respecto del centro, con
      el par aplicado horario y el rozamiento $F_r$ supuesto hacia la derecha
      (a distancia $R$ por debajo del centro):

      $$
      5FR = F_r\,R + 0{,}05R\,F
      \;\Longrightarrow\;
      F_r = 4{,}95\,F
      $$

      Sale positiva, así que el supuesto era bueno: **la fuerza de rozamiento
      vale 4,95F y apunta hacia la derecha**, en el sentido del avance. En
      horizontal, $H + F_r = 0$ da $H = -4{,}95F$: la fuerza desconocida va
      hacia la izquierda, al revés que en el dibujo.

      **Comprobación por otro camino.** Momentos respecto del punto de
      contacto, donde el rozamiento no da momento: el par $5FR$ y la $H$ a
      altura $R$ contra el par de la normal adelantada,
      $-5FR - H R + 0{,}05R\,F = 0$, que da otra vez $H = -4{,}95F$.

      **Por qué el rozamiento empuja.** Es una rueda motriz. Sin rozamiento el
      par la haría girar en el sitio, patinando hacia atrás en el contacto; el
      suelo lo impide empujando hacia delante, y la $H$ es lo que la retiene
      para que no acelere.

  # ── Teoría · cuestión 3 · deducir la resultante de una carga distribuida.
  #    Es una deducción: se escribe en papel contra la rúbrica, y la cuenta
  #    de la carga triangular comprueba que la fórmula está bien escrita.
  - id: exma2425-ord-3-la-resultante-de-una-carga-distribuida
    titulo: La resultante de una carga distribuida y dónde se coloca
    fuente: >-
      Cuestión 3 de teoría · Convocatoria ordinaria de junio de 2025, bloque 1
      (Estática) · Mecánica Aplicada, Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU). Vale 1 punto en las dos columnas. El examen no publica
      resolución; la rúbrica y la comprobación con la carga triangular son
      nuestras.
    nivel: examen
    enunciado: |
      (1p) Para una fuerza distribuida en la longitud $q(x)$, deducir la
      resultante y la localización de la misma.
    pide: La expresión de la resultante y la de su posición, deducidas.
    pasos:
      - tipo: reconocer
        pregunta: |
          La resultante ya es la integral de $q$. ¿Qué condición la coloca en
          su sitio?
        opciones:
          - texto: >-
              Que su momento respecto de un punto sea igual al de la carga
              distribuida respecto del mismo punto
            correcta: true
            mensaje: |
              Eso es. Sustituir la carga por una sola fuerza exige un sistema
              **equivalente**: misma resultante y mismo momento. La primera
              condición da el valor; la segunda, la posición.
          - texto: Que vaya en el punto medio del tramo cargado
            mensaje: |
              Solo si $q$ es constante. Con una carga triangular el punto
              medio da la mitad de la longitud y la respuesta buena son dos
              tercios: la resultante se va hacia donde hay más carga.
          - texto: Que vaya donde la carga es máxima
            mensaje: |
              Tampoco. Toda la carga cuenta, pesada por su brazo. En una
              triangular el máximo está en el extremo y la resultante a un
              tercio de él.
          - texto: >-
              Ninguna: la resultante vale $q$ por la longitud, y eso ya la
              coloca
            mensaje: |
              $q\,L$ es la resultante de una carga **uniforme**. Con $q(x)$
              variable la resultante es la integral, y su posición necesita una
              segunda ecuación, la de momentos.
      - tipo: redactar
        consigna: |
          La cuestión en papel, entera: la resultante de $q(x)$ sobre un tramo
          $a \le x \le b$ y la abscisa donde se coloca, deducidas y no solo
          escritas. Media página basta.
        rubrica:
          - punto: |
              **El elemento diferencial**: un trozo $dx$ soporta la fuerza
              $dF = q(x)\,dx$, y todas esas fuerzas son paralelas.
            porque: |
              Es lo que convierte una carga continua en una suma, y lo que
              permite tratarla como un sistema de vectores paralelos. Quien
              escribe la integral sin este paso la está recordando, no
              deduciendo, que es lo que la cuestión puntúa.
          - punto: |
              **La resultante** como suma de las elementales,
              $R = \int_a^b q(x)\,dx$, y su lectura: el área bajo la curva de
              carga.
            porque: |
              La lectura geométrica es la que se usa luego en cada problema
              —un rectángulo, un triángulo— y es la que detecta un error de
              cuenta a simple vista.
          - punto: |
              **La equivalencia de momentos** respecto de un punto, escrita:
              $R\,\overline{x} = \int_a^b x\,q(x)\,dx$.
            porque: |
              Es la mitad de la cuestión y la que más se salta. Sin decir que
              el sistema de una sola fuerza tiene que dar el **mismo momento**,
              la fórmula de $\overline{x}$ aparece sin justificar.
          - punto: |
              **La posición**, $\overline{x} = \int x\,q\,dx \big/ \int q\,dx$, y
              que es la abscisa del centroide del área de carga.
            porque: |
              Enlaza con la geometría de masas del tema 2 y da la regla que se
              aplica sin integrar: la resultante pasa por el centro de gravedad
              del diagrama de carga.
          - punto: |
              El caso límite: si $\int q\,dx = 0$ con cargas de los dos
              signos, no hay una fuerza equivalente sino un **par**.
            porque: |
              Es lo que distingue a quien entiende la reducción de un sistema
              de vectores de quien aplica la fórmula: con $R = 0$ el cociente
              no existe, y el sistema se reduce a su momento.
      - tipo: calcular
        titulo: La resultante de una carga triangular
        pregunta: |
          Comprueba la fórmula con $q(x) = q_0\,x/L$ en $0 \le x \le L$. ¿Cuánto
          vale la resultante, en unidades de $q_0 L$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.005
          formato: un número, en unidades de q0·L
        distractores:
          - valor: '1'
            mensaje: |
              Has multiplicado el valor máximo por la longitud, como si la
              carga fuera uniforme e igual a $q_0$. El área del triángulo es la
              mitad de la del rectángulo.
          - valor: '0.3333'
            mensaje: |
              Has integrado $x\,q(x)$: eso es el **momento** respecto del
              origen, $q_0 L^{2}/3$, no la resultante. Te hará falta en el paso
              siguiente, pero dividido.
        pista: |
          $R = \int_0^L q_0\,\dfrac{x}{L}\,dx$. O, sin integrar, el área de un
          triángulo de base $L$ y altura $q_0$.
        desarrollo: |
          $$
          R = \frac{q_0}{L}\int_0^L x\,dx = \frac{q_0}{L}\cdot\frac{L^{2}}{2}
          = \frac{q_0 L}{2}
          $$
      - tipo: calcular
        titulo: Dónde se coloca
        pregunta: |
          Con la misma carga triangular, ¿a qué distancia del origen queda la
          resultante, en unidades de $L$?
        respuesta:
          tipo: numero
          valor: '0.66667'
          tolerancia: 0.005
          formato: un número, en unidades de L; vale la forma exacta, como 2/3
        distractores:
          - valor: '0.5'
            mensaje: |
              Es el punto medio del tramo, que es el sitio de la resultante
              solo si la carga es uniforme. Aquí crece hacia $x = L$ y la
              resultante se desplaza hacia allí.
          - valor: '0.3333'
            mensaje: |
              Es un tercio medido desde el origen, donde la carga vale cero. El
              centroide del triángulo está a un tercio del lado **cargado**, o
              sea a dos tercios del vértice.
        pista: |
          $\overline{x} = \dfrac{\int_0^L x\,q\,dx}{\int_0^L q\,dx}
          = \dfrac{q_0 L^{2}/3}{q_0 L/2}$.
        desarrollo: |
          $$
          \overline{x} = \frac{\dfrac{q_0}{L}\displaystyle\int_0^L x^{2}\,dx}{q_0 L/2}
          = \frac{q_0 L^{2}/3}{q_0 L/2} = \frac{2L}{3}
          $$

          Es el centroide del triángulo de carga, a un tercio de su lado alto.
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              Un trozo $dx$ soporta la fuerza elemental $q(x)\,dx$, y todas son
              paralelas entre sí.
          - texto: >-
              La resultante es la suma de todas, $R = \int q\,dx$: el área bajo
              la curva de carga.
          - texto: >-
              Se coloca en $\overline{x}$ tal que $R\,\overline{x} = \int x\,q\,dx$, para
              que dé el mismo momento que la carga.
          - texto: >-
              $\overline{x}$ es la abscisa del centroide del área de carga.
          - texto: >-
              La resultante se aplica siempre en el centro del tramo cargado,
              porque la carga está repartida en toda su longitud.
            trampa: true
            mensaje: |
              «Repartida» no quiere decir «repartida por igual». El centro del
              tramo solo es el sitio si $q$ es constante; en general hay que
              igualar momentos, y con la carga triangular sale dos tercios.
    resolucion: |
      **El elemento.** Se corta un trozo de longitud $dx$ en la abscisa $x$.
      Sobre él actúa la fuerza elemental $dF = q(x)\,dx$, y todas las fuerzas
      elementales son paralelas: la carga es un sistema de vectores paralelos.

      **La resultante.** Es la suma de todas:

      $$
      R = \int_a^b q(x)\,dx
      $$

      que es el **área** bajo la curva de carga.

      **La localización.** Para que una única fuerza $R$ sea equivalente a la
      carga tiene que dar el mismo momento respecto de cualquier punto; se
      toma el origen:

      $$
      R\,\overline{x} = \int_a^b x\,q(x)\,dx
      \;\Longrightarrow\;
      \overline{x} = \frac{\displaystyle\int_a^b x\,q(x)\,dx}{\displaystyle\int_a^b q(x)\,dx}
      $$

      Es la abscisa del **centroide** del área de carga, así que la
      resultante pasa por el centro de gravedad del diagrama de carga. Si la
      integral de $q$ fuera nula —cargas de los dos signos que se compensan—
      no habría fuerza equivalente sino un par.

      **Comprobación con una carga triangular**, $q = q_0 x/L$ en
      $0 \le x \le L$: $R = q_0 L/2$, el área del triángulo, y
      $\overline{x} = (q_0 L^{2}/3)/(q_0 L/2) = 2L/3$, a un tercio del lado alto,
      que es donde está su centroide.

  # ── Teoría · cuestión 4 · las ecuaciones de la rebanada. El mismo formato:
  #    la deducción en papel, y una viga biapoyada para comprobar que las
  #    relaciones dan el momento máximo conocido.
  - id: exma2425-ord-4-el-equilibrio-de-la-rebanada
    titulo: El equilibrio de la rebanada, entre la carga, el cortante y el flector
    fuente: >-
      Cuestión 4 de teoría · Convocatoria ordinaria de junio de 2025, bloque 1
      (Estática) · Mecánica Aplicada, Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU). Vale 1 punto en las dos columnas; en la de castellano va
      numerada «4 (1)», sin punto ni «p». El examen no publica resolución; la
      rúbrica y la comprobación son nuestras.
    nivel: examen
    enunciado: |
      (1) Deducir las ecuaciones de equilibrio de un elemento diferencial de
      una pieza prismática, relacionando $q$, $V$ y $M$.
    pide: Las dos relaciones diferenciales entre la carga, el cortante y el flector, deducidas.
    pasos:
      - tipo: reconocer
        pregunta: |
          Al tomar momentos en la rebanada aparece el término
          $q\,dx\cdot\dfrac{dx}{2}$. ¿Qué se hace con él?
        opciones:
          - texto: >-
              Se desprecia: es de segundo orden en $dx$ y desaparece al
              dividir por $dx$ y hacer $dx \to 0$
            correcta: true
            mensaje: |
              Eso es. Dividido por $dx$ queda $q\,dx/2$, que tiende a cero, y
              lo que sobrevive es $dM/dx = V$. Decirlo en voz alta es parte de
              la deducción.
          - texto: >-
              Se conserva, y la relación queda $dM/dx = V - q/2$
            mensaje: |
              Al dividir por $dx$ el término queda $q\,dx/2$, no $q/2$: sigue
              llevando un $dx$ y se anula en el límite. Una relación con $q/2$
              no sería homogénea en dimensiones.
          - texto: >-
              Se anula porque la fuerza $q\,dx$ pasa por el punto de momentos
            mensaje: |
              No pasa: la resultante de la carga de la rebanada está en su
              centro, a $dx/2$ de la cara donde se toman momentos. No se anula,
              se desprecia por ser de segundo orden.
          - texto: >-
              Es el término que da la relación $dV/dx = -q$
            mensaje: |
              Esa relación sale del equilibrio **vertical**, no del de
              momentos. En la ecuación de momentos, este término es el que se
              desprecia.
      - tipo: redactar
        consigna: |
          La cuestión en papel: la rebanada de longitud $dx$ con todas sus
          fuerzas dibujadas, el convenio de signos, los dos equilibrios y las
          dos relaciones que salen. Media página y un dibujo.
        rubrica:
          - punto: |
              **El dibujo de la rebanada** con la carga $q\,dx$, el cortante y
              el flector en las dos caras: $V$ y $M$ en una, $V+dV$ y $M+dM$ en
              la otra, con sus sentidos.
            porque: |
              Sin el dibujo los signos no se pueden comprobar, y el signo es
              exactamente lo que esta cuestión evalúa. Dos alumnos con
              convenios distintos llegan a relaciones con signos distintos, y
              los dos están bien si su dibujo lo dice.
          - punto: |
              **El convenio declarado** en palabras: por ejemplo, $q$ positiva
              hacia abajo, cortante positivo si sube en la cara izquierda y
              flector positivo si tracciona la fibra inferior.
            porque: |
              Es el punto que más se pierde: se escribe $dV/dx = -q$ de memoria
              con un dibujo que corresponde al otro convenio, y el corrector ve
              una contradicción donde quizás solo había un descuido.
          - punto: |
              **El equilibrio vertical**, $V - q\,dx - (V + dV) = 0$, y de ahí
              $dV/dx = -q$.
            porque: |
              Es la primera relación, y dice algo que se usa en cada diagrama:
              la pendiente del cortante es la carga, así que con $q$ constante
              el cortante es una recta.
          - punto: |
              **El equilibrio de momentos** respecto de una cara, con el
              término $q\,dx^{2}/2$ **despreciado explícitamente** por ser de
              segundo orden, y de ahí $dM/dx = V$.
            porque: |
              Tachar ese término sin decir por qué es la diferencia entre
              deducir y copiar. Y la relación que sale es la que más rinde:
              el flector es extremo donde el cortante se anula.
          - punto: |
              **Las consecuencias**: $d^{2}M/dx^{2} = -q$, el máximo de $M$
              donde $V = 0$, y los saltos que dan una carga o un par
              concentrados, donde las derivadas no existen.
            porque: |
              Es lo que se hace con las ecuaciones en el ejercicio de la viga
              del mismo examen, y lo que demuestra que se entienden: cerca de
              un par aplicado, $dM/dx = V$ no vale y el diagrama salta.
      - tipo: calcular
        titulo: El flector máximo de una viga biapoyada
        pregunta: |
          Comprueba las relaciones en una viga biapoyada de luz $L$ con carga
          uniforme $q$: el cortante vale $qL/2$ en el apoyo izquierdo. ¿Cuánto
          vale el momento máximo, en unidades de $qL^{2}$?
        respuesta:
          tipo: numero
          valor: '0.125'
          tolerancia: 0.001
          formato: un número, en unidades de q·L²; vale la forma exacta, como 1/8
        distractores:
          - valor: '0.5'
            mensaje: |
              $qL^{2}/2$ es el flector en el empotramiento de un **voladizo** de
              luz $L$. En la biapoyada el cortante se anula en el centro y el
              área del triángulo de cortantes hasta ahí es $qL^{2}/8$.
          - valor: '0.25'
            mensaje: |
              Has concentrado toda la carga, $qL$, en el centro y has usado
              $PL/4$. La carga repartida carga menos el centro que la misma
              fuerza puesta de golpe en él: el área bajo $V$ es la mitad.
        pista: |
          $dV/dx = -q$ da $V = qL/2 - qx$, que se anula en $x = L/2$. El
          momento allí es el área bajo $V$ de $0$ a $L/2$.
        desarrollo: |
          $$
          M_{\max} = \int_0^{L/2}\left(\frac{qL}{2} - qx\right)dx
          = \frac{qL^{2}}{4} - \frac{qL^{2}}{8} = \frac{qL^{2}}{8}
          $$
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              En la rebanada actúan $q\,dx$, el cortante $V$ y $V + dV$ en las
              caras, y los flectores $M$ y $M + dM$.
          - texto: >-
              Equilibrio vertical, $V - q\,dx - (V + dV) = 0$: $dV/dx = -q$.
          - texto: >-
              Momentos respecto de una cara, despreciando $q\,dx^{2}/2$ por ser
              de segundo orden: $dM/dx = V$.
          - texto: >-
              Así $d^{2}M/dx^{2} = -q$, y el flector es extremo donde se anula
              el cortante.
          - texto: >-
              Como el cortante es la derivada del flector, el flector máximo
              está donde el cortante es máximo, en los apoyos.
            trampa: true
            mensaje: |
              Al revés: una derivada máxima no da un máximo de la función, lo
              da una derivada **nula**. En la biapoyada el cortante es máximo
              en los apoyos, donde el flector es cero, y se anula en el centro,
              donde el flector es máximo.
    resolucion: |
      **Convenio.** Carga $q$ positiva hacia abajo. En una sección, el cortante
      $V$ es positivo si sobre la cara izquierda de la rebanada actúa hacia
      arriba, y el flector $M$ es positivo si tracciona la fibra inferior. Es
      el convenio con el que se dibujan los diagramas del ejercicio 2 de este
      mismo examen.

      **La rebanada.** Un trozo de longitud $dx$ con la carga $q\,dx$ en su
      centro. En la cara izquierda, $V$ hacia arriba y $M$; en la derecha,
      $V + dV$ hacia abajo y $M + dM$.

      **Equilibrio vertical.**

      $$
      V - q\,dx - (V + dV) = 0
      \;\Longrightarrow\;
      \frac{dV}{dx} = -q
      $$

      **Equilibrio de momentos** respecto de la cara derecha:

      $$
      M + V\,dx - q\,dx\,\frac{dx}{2} - (M + dM) = 0
      $$

      El término $q\,dx^{2}/2$ es de segundo orden: al dividir por $dx$ y
      pasar al límite desaparece, y queda

      $$
      \frac{dM}{dx} = V
      \qquad\Longrightarrow\qquad
      \frac{d^{2}M}{dx^{2}} = -q
      $$

      **Qué se hace con ellas.** El cortante es la pendiente del flector, así
      que el flector es extremo donde el cortante se anula; y la carga es la
      pendiente del cortante, cambiada de signo. Donde hay una fuerza
      concentrada el cortante salta, y donde hay un par concentrado salta el
      flector: ahí las derivadas no existen y las relaciones valen a cada
      lado. Si además hubiera una carga axial repartida $p$, el equilibrio
      horizontal daría $dN/dx = -p$.

      **Comprobación.** En una viga biapoyada de luz $L$ con carga uniforme,
      $V = qL/2 - qx$ se anula en el centro y el área bajo $V$ hasta ahí da
      $M_{\max} = qL^{2}/8$, el valor conocido.

  # ── Ejercicio 1 · a) y b) · la catenaria de C a B. La clave es el tramo que
  #    cuelga: su extremo libre está en la directriz, y eso da la tensión en
  #    cualquier punto sin resolver ninguna ecuación trascendente.
  - id: exma2425-ord-5-la-catenaria-que-cuelga-de-la-polea
    titulo: La catenaria que cuelga de la polea, con el extremo libre en la directriz
    fuente: >-
      Ejercicio 1, apartados a) y b) · Convocatoria ordinaria de junio de 2025,
      bloque 1 (Estática) · Mecánica Aplicada, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). El apartado b) trae la errata «pole,a», que se
      conserva. El examen no publica resolución; el desarrollo es nuestro.
    nivel: examen
    enunciado: |
      Un bloque cuadrado de masa $M$ y lado $L$ se encuentra articulado en un
      punto fijo D. El bloque está unido en el punto E a un muelle ideal de
      constante elástica $k = \frac{Mg}{2L}$, deformado $L$. En el punto C
      está sujeto a un cable de peso por unidad de longitud
      $w = \frac{Mg}{L}$ que se arrolla sobre la polea B de dimensiones
      despreciables y cuelga por el otro lado de la polea. El punto A está en
      la misma horizontal que D. El ángulo del cable en C con la horizontal
      es de 30º. Se pide:

      **a)** (1p) Fuerza mínima del cable $T_0$ y parámetro de la catenaria $c$.

      **b)** (1p) Ángulo del cable con la horizontal en B, en el lado derecho
      de la pole,a y longitud del cable BC

      **c)** (1p) Componentes de la reacción en D y distancia $h$.

