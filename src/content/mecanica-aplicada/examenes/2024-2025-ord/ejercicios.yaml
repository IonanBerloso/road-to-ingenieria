      <figcaption>

      La viga sola: las cargas del enunciado, la articulación de A con dos componentes y el muelle de E, que está estirado y tira hacia el techo. Tres incógnitas, Ax, Ay y Fm, y tres ecuaciones. Ejes: x hacia la derecha, y hacia arriba; momentos positivos en sentido antihorario.

      </figcaption>
      </figure>

      - **Las cargas**: la uniforme de A a C, con resultante
        $q_0\cdot 2L = 8Mg$ hacia abajo en B; la horizontal $2Mg$ hacia la
        izquierda en C, que se toma sobre la directriz de la viga, como la
        dibuja el enunciado; y el par antihorario $4MgL$ en D.
      - **La articulación A**, con $A_x$ y $A_y$.
      - **El muelle en E**: mide L y su longitud natural es nula, así que
        está estirado y tira hacia arriba con $F_m$.

      **2. Incógnitas.** $A_x$, $A_y$ y $F_m$; y la constante k. Tres
      incógnitas y tres ecuaciones: la viga es isostática.

      **3. Ecuaciones.** Momentos respecto de A, antihorario positivo. La
      carga de C va por la directriz de la viga, que pasa por A: su brazo es
      nulo.

      $$
      A_x - 2Mg = 0,
      \qquad
      A_y + F_m - 8Mg = 0,
      \qquad
      -8Mg\cdot L + 4MgL + F_m\cdot 4L = 0
      $$

      Y la constante, del alargamiento: $k = F_m/(L - L_0)$.

      **4. Resultados.**

      $$
      A_x = 2Mg,
      \qquad
      F_m = Mg,
      \qquad
      A_y = 7Mg,
      \qquad
      k = \frac{Mg}{L}
      $$

      $$
      \vec{R}_A = 2Mg\,\vec{\imath} + 7Mg\,\vec{\jmath},
      \qquad
      \vec{F}_m = Mg\,\vec{\jmath}
      $$

