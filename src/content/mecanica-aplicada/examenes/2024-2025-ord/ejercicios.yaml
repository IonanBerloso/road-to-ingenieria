    pide: Las reacciones en A, la fuerza del muelle y su constante k.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hace el muelle de E sobre la viga?
        opciones:
          - texto: >-
              Tira de E hacia arriba con $kL$: mide $L$ y su longitud natural
              es nula, así que está estirado $L$
            correcta: true
            mensaje: |
              Eso es. La fuerza del muelle es su constante por su alargamiento,
              y el alargamiento es la longitud actual menos la natural,
              $L - 0$. Como $k$ no se conoce, la incógnita es la fuerza, y $k$
              sale al final.
          - texto: Empuja E hacia abajo
            mensaje: |
              Un muelle empuja cuando está más corto que su longitud natural.
              Este mide $L$ y su longitud natural es cero: está estirado y tira
              de E hacia el techo.
          - texto: >-
              Nada que se pueda calcular: con $k$ desconocida la viga es
              hiperestática
            mensaje: |
              La incógnita del muelle es una sola, su fuerza, y con las dos de
              la articulación A son tres, las mismas que ecuaciones: la viga es
              isostática. La $k$ se despeja después, dividiendo por $L$.
          - texto: >-
              Su fuerza es $k\,L_0 = 0$, porque la longitud natural es nula
            mensaje: |
              $L_0$ es la longitud natural, no el alargamiento. La fuerza es
              $k(L - L_0) = kL$: que la longitud natural sea nula hace que el
              alargamiento sea toda la longitud.
      - tipo: calcular
        titulo: La constante del muelle
        pregunta: |
          Toma momentos respecto de A. ¿Cuánto vale $k$, en unidades de $Mg/L$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número, en unidades de Mg/L
        distractores:
          - valor: '3'
            mensaje: |
              Has tomado el par de D en sentido horario. En la figura es
              antihorario, y respecto de A **ayuda** al muelle: la ecuación es
              $-8MgL + 4MgL + 4L\,F_m = 0$.
          - valor: '7'
            mensaje: |
              Has repartido la carga en toda la viga, $16Mg$ en el centro. La
              carga uniforme va solo de A a C: $8Mg$, con su resultante en B, a
              distancia $L$ de A.
        pista: |
          La resultante de la carga es $q_0\cdot 2L = 8Mg$, a distancia $L$ de A.
          El muelle actúa a $4L$. La carga de C es horizontal y va por la
          directriz de la viga, que pasa por A.
        desarrollo: |
          $$
          -8Mg\cdot L + 4MgL + F_m\cdot 4L = 0
          \;\Longrightarrow\;
          F_m = Mg
          $$

          $$
          k = \frac{F_m}{L - L_0} = \frac{Mg}{L}
          $$
      - tipo: calcular
        titulo: La reacción vertical en A
        pregunta: |
          ¿Cuánto vale la componente vertical de la reacción en A, en unidades
          de $Mg$? Positiva hacia arriba.
        respuesta:
          tipo: numero
          valor: '7'
          tolerancia: 0.001
          formato: un número, en unidades de Mg
        distractores:
          - valor: '5'
            mensaje: |
              Es lo que sale con el par de D horario, que da un muelle de $3Mg$.
              El par es antihorario y el muelle hace $Mg$: $A_y = 8Mg - Mg$.
          - valor: '9'
            mensaje: |
              Es lo que sale con la carga en toda la viga, $16Mg - 7Mg$. La
              carga va de A a C y suma $8Mg$.
        pista: |
          $\sum F_y = 0$: $A_y + F_m - 8Mg = 0$.
        desarrollo: |
          $$
          A_y = 8Mg - Mg = 7Mg,
          \qquad
          A_x = 2Mg \ \text{hacia la derecha}
          $$

          $A_x$ sale de $\sum F_x = 0$ con la carga de C, que va hacia la
          izquierda.
      - tipo: justificar
        pregunta: Ordena el sólido libre resuelto. Una pieza es falsa.
        piezas:
          - texto: >-
              $\sum F_x = 0$: $A_x = 2Mg$, hacia la derecha, porque la carga de C
              va hacia la izquierda.
          - texto: >-
              $\sum M_A = 0$: $-8Mg\cdot L + 4MgL + F_m\cdot 4L = 0$, luego
              $F_m = Mg$, hacia arriba.
          - texto: >-
              El muelle está estirado $L$ desde longitud natural nula:
              $k = F_m/L = Mg/L$.
          - texto: >-
              $\sum F_y = 0$: $A_y = 8Mg - Mg = 7Mg$, hacia arriba.
          - texto: >-
              La carga horizontal de C da momento respecto de A,
              $2Mg\cdot 2L$, y hay que meterlo en la ecuación de momentos.
            trampa: true
            mensaje: |
              Actúa sobre la directriz de la viga, que pasa por A: su brazo
              respecto de A es nulo. La distancia $2L$ es horizontal, en la
              misma dirección que la fuerza, y el brazo es la distancia
              **perpendicular**.
    resolucion: |
      **El sólido libre.** Sobre la viga actúan la carga uniforme de A a C,
      con resultante $q_0\cdot 2L = 8Mg$ hacia abajo en B; la carga
      horizontal $2Mg$ hacia la izquierda en C, que se toma sobre la
      directriz de la viga como la dibuja el enunciado; el par antihorario
      $4MgL$ en D; la reacción de la articulación A, $(A_x,\ A_y)$; y la
      fuerza del muelle en E, $F_m$, vertical. El muelle mide $L$ y su
      longitud natural es nula, así que está estirado y tira hacia arriba.

      Tres incógnitas y tres ecuaciones: la viga es isostática.

      **Ecuaciones.**

      $$
      \sum F_x = 0:\quad A_x - 2Mg = 0 \;\Longrightarrow\; A_x = 2Mg
      $$

      $$
      \sum M_A = 0:\quad -8Mg\cdot L + 4MgL + F_m\cdot 4L = 0
      \;\Longrightarrow\; F_m = Mg
      $$

      $$
      \sum F_y = 0:\quad A_y + F_m - 8Mg = 0 \;\Longrightarrow\; A_y = 7Mg
      $$

      **La constante.** $k = F_m/(L - L_0) = Mg/L$.

      **Comprobación** por momentos respecto de E, que no usa $F_m$:
      $-A_y\cdot 4L + 8Mg\cdot 3L + 4MgL = 0$ da $A_y = 7Mg$ otra vez.

      Resultado: en A, $2Mg$ hacia la derecha y $7Mg$ hacia arriba; en E, el
      muelle tira hacia arriba con $Mg$, y su constante es $k = Mg/L$.

  # ── Ejercicio 2 · b) y c) · los diagramas y las tensiones. El máximo del
  #    flector no está en ningún punto con letra, y la T no es simétrica
  #    respecto de su eje de flexión: las dos cosas que el ejercicio mide.
  - id: exma2425-ord-6-los-diagramas-y-las-tensiones-de-la-viga-en-t
    titulo: Los diagramas de la viga y las tensiones de su sección en T
    fuente: >-
      Ejercicio 2, apartados b) y c) · Convocatoria ordinaria de junio de
      2025, bloque 1 (Estática) · Mecánica Aplicada, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). La cabecera castellana de esta página dice
      «Dinámica» (la de euskera, «Estatika»), y el texto trae las erratas
      «siquientes» y «nomales», que se conservan. El examen no publica
      resolución; el desarrollo es nuestro.
    nivel: examen
    enunciado: |
      La viga ABCDE de sección transversal en T soporta las siquientes
      fuerzas:

      - Carga uniformemente distribuida de valor $q_0 = 4Mg/L$.
      - Carga concentrada horizontal de valor $2Mg$ en la sección C.
      - Momento de valor $4MgL$ aplicado en la sección D.

      La viga tiene una articulación fija en A y en E está unida a un muelle
      de longitud no deformada nula, de constante $k$ a determinar. Se pide:

      **a)** (0,75p) Diagrama del sólido libre de la viga resuelto, indicando
      las reacciones que actúan sobre ella, la fuerza del muelle y su
      constante $k$.

      **b)** (1,5p) Diagramas de fuerzas axiales y cortantes y de momentos
      flectores en la viga. Determinar el momento máximo e indicar en qué
      sección ocurre.

      **c)** (0,75p) Tensiones nomales máxima y mínima en función de $M, g, L$
      y $b$.

