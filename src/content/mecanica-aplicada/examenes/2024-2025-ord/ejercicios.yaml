    pide: Los diagramas de axiles, cortantes y flectores, el flector máximo con su sección, y las tensiones normales extremas.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Dónde hay que buscar el momento flector máximo?
        opciones:
          - texto: >-
              Donde el cortante se anula, y en los extremos de cada tramo
              —donde hay una carga concentrada, un par o un cambio de carga—
            correcta: true
            mensaje: |
              Eso es. Como $dM/dx = V$, el flector es extremo donde $V = 0$
              dentro de un tramo, o en un borde de tramo, donde el diagrama
              cambia de ley o salta. Aquí hay que buscar dónde se anula $V$
              dentro del tramo cargado.
          - texto: Donde el cortante es máximo, en A
            mensaje: |
              En A el cortante vale $7Mg$ y el flector es **cero**: la
              articulación no transmite momento. El cortante máximo da la
              pendiente máxima del flector, no su máximo.
          - texto: En D, donde está aplicado el par
            mensaje: |
              El par hace **saltar** el flector, y aquí lo hace bajar. Un
              salto es un candidato, pero no garantiza el máximo.
          - texto: En C, el centro de la viga, que es donde acaba la carga
            mensaje: |
              El flector en C es un candidato, pero no el máximo: el
              cortante cambia de signo antes de llegar a C, dentro del tramo
              cargado, y ahí el flector es mayor.
      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna ecuación: **el trozo de viga entre A y un
          corte cualquiera del tramo AC**, con los esfuerzos del corte.
        comprueba:
          - punto: |
              **En A, $A_x$ y $A_y$, las del apartado a).**
            porque: |
              El trozo lleva todo lo que actúa a la izquierda del corte, y en A
              eso es la reacción ya calculada.
          - punto: |
              **La carga $q_0$ sobre todo el trozo, de A al corte.**
            porque: |
              El corte está entre A y C, dentro del tramo cargado.
          - punto: |
              **En el corte, N hacia fuera, V hacia abajo y M antihorario.**
            porque: |
              Son sus sentidos positivos en la cara derecha de un trozo
              izquierdo: N de tracción, V la suma de las fuerzas verticales a la
              izquierda y M el que tracciona la fibra inferior. Los signos que
              salgan dirán hacia dónde van de verdad.
