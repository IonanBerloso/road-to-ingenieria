      **Un matiz que el enunciado no resuelve.** La compresión máxima está
      seguro en esa sección: ahí coinciden el mayor flector y el axil de
      compresión. La tracción máxima, no del todo: justo a la derecha de C el
      flector vale $6MgL$ y el axil ya es nulo, y la fibra inferior da
      $0{,}72\,MgL/b^{3}$. Gana la sección de $7L/4$ solo si
      $0{,}015\,L/b > 0{,}2$, es decir, si $L > 40b/3$, que es lo esperable en
      una viga pero el enunciado no lo dice. La resolución de examen da la
      sección del máximo, y conviene dejar escrita la comprobación.

      **5. Comprobación.** El flector máximo desde el trozo de la derecha, que
      no se ha usado. Pasado $x = 7L/4$ quedan el muelle, $Mg$ hacia arriba a
      $9L/4$; el par de D, $4MgL$ antihorario; y la carga que falta hasta C,
      $q_0\cdot L/4 = Mg$ hacia abajo, a $L/8$. Los momentos respecto del
      corte dan el flector:

      $$
      M = Mg\cdot\frac{9L}{4} + 4MgL - Mg\cdot\frac{L}{8} = \frac{49}{8}\,MgL
      $$

      lo mismo. Y la inercia respecto de la base,
      $I_{\text{base}} = \tfrac{125}{3}b^{4} + \tfrac{5}{12}b^{4} +
      5b^{2}(5{,}5b)^{2} = 193{,}3\,b^{4}$, con Steiner da
      $193{,}3 - 10\cdot 4^{2} = 33{,}3\,b^{4}$. Por otro camino, fuera del
      alcance del examen —integrando la carga numéricamente con el salto del
      par en D—, sale el mismo máximo en $x = 1{,}75L$ y $M(E) = 0$.

      **Lo que dice el resultado.** El flector máximo no cae en ningún punto
      con letra: está donde el cortante cruza el cero, a $7L/4$. La T no es
      simétrica respecto de su eje de flexión: la fibra inferior, a $4b$ de G,
      lleva el doble de tensión de flexión que la superior, a $2b$. Y el axil
      de compresión las desplaza a las dos: alivia la tracción de abajo y
      suma a la compresión de arriba.
