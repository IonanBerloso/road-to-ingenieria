    pide: Las dos componentes de la reacción en D y la distancia h.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de escribir ecuaciones, ¿qué fuerzas actúan sobre el bloque?
        opciones:
          - texto: >-
              El peso $Mg$ en el centro, el muelle $Mg/2$ hacia la pared en E, el
              cable $Mg$ a 30° hacia B en C, y la reacción de D
            correcta: true
            mensaje: |
              Eso es. El muelle está estirado $L$ desde una longitud natural
              nula, así que tira de E con $kL = Mg/2$; y el cable tira de C con
              la tensión de la catenaria en C, $T_C = Mg$, a lo largo de su
              tangente.
          - texto: >-
              El peso, el muelle y la reacción; el cable no, porque su peso ya
              está en $w$
            mensaje: |
              $w$ es el peso del cable, que carga al propio cable. Lo que el
              cable hace sobre el **bloque** es tirar de C con su tensión, y esa
              fuerza entra en el equilibrio del bloque como cualquier otra.
          - texto: >-
              El muelle empuja E hacia la izquierda, porque tiene longitud $L$
            mensaje: |
              Su longitud natural es cero y mide $L$: está **estirado**, así
              que tira de E hacia la pared, a la derecha. Empujaría si su
              longitud fuera menor que la natural.
          - texto: >-
              En C el cable tira con $T_0$, en horizontal
            mensaje: |
              $T_0$ es solo la componente horizontal de la tensión. En C el
              cable va inclinado 30°, y tira con $T_C = T_0/\cos 30^{\circ} = Mg$,
              que también tiene componente vertical, $Mg/2$.
      - tipo: calcular
        titulo: La componente horizontal de la reacción
        pregunta: |
          ¿Cuánto vale la componente horizontal de la reacción en D, en unidades
          de $Mg$? Positiva hacia la derecha.
        respuesta:
          tipo: numero
          valor: '0.36603'
          tolerancia: 0.001
          formato: un número, en unidades de Mg; en forma exacta (√3/2 - 1/2) o con cuatro decimales
        distractores:
          - valor: '1.36603'
            mensaje: |
              Has puesto el muelle empujando hacia la izquierda. Está estirado
              —longitud $L$, longitud natural nula— y tira de E hacia la pared,
              a la derecha.
          - valor: '0.71244'
            mensaje: |
              Has usado en C la tensión de B, $7Mg/5$. La tensión de la
              catenaria cambia con la altura: en C vale $w\,y_C = Mg$.
        pista: |
          $\sum F_x = 0$: $D_x + \dfrac{Mg}{2} - Mg\cos 30^{\circ} = 0$.
        desarrollo: |
          $$
          D_x = Mg\cos 30^{\circ} - \frac{Mg}{2} = \frac{\sqrt{3} - 1}{2}\,Mg
          \approx 0{,}366\,Mg
          $$

          Positiva: hacia la derecha.
      - tipo: calcular
        titulo: La componente vertical de la reacción
        pregunta: |
          ¿Cuánto vale la componente vertical de la reacción en D, en unidades
          de $Mg$? Positiva hacia arriba.
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.001
          formato: un número, en unidades de Mg
        distractores:
          - valor: '1.5'
            mensaje: |
              Has puesto la componente vertical del cable hacia abajo. El cable
              sube de C hacia B, así que tira de C hacia **arriba** y descarga a
              la articulación de la mitad del peso.
          - valor: '0.3'
            mensaje: |
              Has usado en C la tensión de B, $7Mg/5$, cuya componente vertical
              con 30° da $0{,}7Mg$. En C la tensión vale $Mg$.
        pista: |
          $\sum F_y = 0$: $D_y - Mg + Mg\sin 30^{\circ} = 0$.
        desarrollo: |
          $$
          D_y = Mg - \frac{Mg}{2} = \frac{Mg}{2}
          $$
      - tipo: calcular
        titulo: La distancia h
        pregunta: |
          Toma momentos respecto de D. ¿Cuánto vale $h$, en unidades de $L$?
        respuesta:
          tipo: numero
          valor: '0.26795'
          tolerancia: 0.001
          formato: un número, en unidades de L; en forma exacta (2 - √3) o con cuatro decimales
        distractores:
          - valor: '2'
            mensaje: |
              Has olvidado el momento de la componente horizontal del cable,
              que actúa a altura $L$ sobre D. Un $h$ mayor que el lado del
              bloque ya avisa: la articulación quedaría fuera de la cara.
          - valor: '-1.732'
            mensaje: |
              Has puesto el muelle empujando. Tira de E hacia la pared, y su
              momento respecto de D es horario, como el del peso.
        pista: |
          Con D a distancia $h$ de la esquina izquierda: el peso tiene brazo
          $L/2 - h$, el muelle $L$, la componente horizontal del cable $L$ y la
          vertical $h$.
        desarrollo: |
          Momentos respecto de D, antihorario positivo:

          $$
          -Mg\left(\frac{L}{2} - h\right) - \frac{Mg}{2}L
          + \frac{\sqrt{3}}{2}Mg\,L - \frac{Mg}{2}\,h = 0
          $$

          $$
          \frac{h}{2} = L - \frac{\sqrt{3}}{2}L
          \;\Longrightarrow\;
          h = (2 - \sqrt{3})\,L \approx 0{,}268\,L
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La tensión en C es la de la catenaria en ese punto,
              $T_C = w\,y_C = Mg$, a 30° hacia B.
          - texto: >-
              $\sum F_x = 0$: $D_x = Mg\cos 30^{\circ} - Mg/2 \approx 0{,}366\,Mg$,
              hacia la derecha.
          - texto: >-
              $\sum F_y = 0$: $D_y = Mg - Mg\sin 30^{\circ} = Mg/2$, hacia arriba.
          - texto: >-
              Momentos respecto de D con el peso, el muelle y las dos
              componentes del cable: $h = (2 - \sqrt{3})\,L \approx 0{,}268\,L$.
          - texto: >-
              D es una articulación, así que el momento respecto de D no da
              ninguna ecuación y $h$ queda indeterminada.
            trampa: true
            mensaje: |
              Al revés: como la articulación no transmite momento, la ecuación
              de momentos respecto de D es la única **sin** incógnitas de
              reacción, y es la que fija $h$. Una articulación quita un grado
              de libertad de giro al apoyo, no una ecuación al sólido.
    resolucion: |
      **Las fuerzas sobre el bloque.** Se toma el origen en la esquina
      inferior izquierda del bloque, con D en $(h, 0)$.

      - Peso: $Mg$ hacia abajo en el centro, $(L/2,\ L/2)$.
      - Muelle en E, $(L,\ L)$: estirado $L$ desde longitud natural nula, tira
        hacia la pared con $kL = Mg/2$.
      - Cable en C, $(0,\ L)$: la tensión de la catenaria en C, $T_C = w\,y_C = Mg$
        (apartado a), dirigida hacia B a 30° sobre la horizontal:
        $\left(-\tfrac{\sqrt{3}}{2}Mg,\ \tfrac{1}{2}Mg\right)$.
      - Reacción en D: $(D_x,\ D_y)$.

      **Fuerzas.**

      $$
      D_x = \frac{\sqrt{3}}{2}Mg - \frac{Mg}{2} = \frac{\sqrt{3}-1}{2}\,Mg \approx 0{,}366\,Mg,
      \qquad
      D_y = Mg - \frac{Mg}{2} = \frac{Mg}{2}
      $$

      Las dos positivas: la reacción apunta hacia la derecha y hacia arriba.

      **Momentos respecto de D**, antihorario positivo:

      $$
      -Mg\left(\frac{L}{2} - h\right) - \frac{Mg}{2}\,L
      + \frac{\sqrt{3}}{2}Mg\,L - \frac{Mg}{2}\,h = 0
      \;\Longrightarrow\;
      h = (2 - \sqrt{3})\,L \approx 0{,}268\,L
      $$

      **Comprobación.** Con estos valores, los momentos respecto de la esquina
      inferior izquierda —ahora con la reacción dentro— suman
      $-\tfrac{1}{2} - \tfrac{1}{2} + \tfrac{\sqrt{3}}{2} + h\,D_y/(MgL) = 0$,
      que da el mismo $h$. Y $h$ queda entre $0$ y $L$: la articulación está
      en la cara inferior, como en la figura.

  # ── Ejercicio 2 · a) · el sólido libre de la viga. Tres incógnitas —las dos
