        <text x="120" y="156" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">I′</text>
        <text x="168" y="28" font-size="9" text-anchor="middle" fill="var(--faint)">avance</text>
        <line x1="156" y1="196" x2="186" y2="196" stroke="var(--ink)" stroke-width="1" marker-end="url(#dsl-fe)"/>
        <line x1="156" y1="196" x2="156" y2="166" stroke="var(--ink)" stroke-width="1" marker-end="url(#dsl-fe)"/>
