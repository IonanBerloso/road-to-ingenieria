fecha: 30 de mayo de 2019
# La ordinaria de mayo de 2019 de Mecánica Aplicada, **su parte del bloque 2**
# («2. bloque: Cinemática y dinámica» en la cabecera). Es un PDF de tres
# páginas: la de teoría y una por ejercicio. La parte del bloque 1 del mismo
# día, la Estática, es otro PDF y otra convocatoria de este sitio,
# `2018-2019-ord`.
#
# El cuadernillo es bilingüe, euskera a la izquierda y castellano a la
# derecha, y **el castellano va metido como imágenes de palabra**: el volcado
# de texto solo saca la columna de euskera (CLAUDE.md §17, «El volcado no es
# la página»). Se transcribe **solo la columna en castellano**, mirando las
# páginas renderizadas, y nada se traduce del euskera. No hay ningún apartado
# que esté solo en euskera, así que no hay `fuera`.
#
# Cuatro cosas de ese texto, dichas antes de que nadie las deduzca:
#
# 1. **LOS PUNTOS SUMAN 10**: 1,5 + 1 + 1,5 en la teoría y 3 + 3 en los
#    ejercicios.
#
# 2. **ERRATAS DEL TEXTO, CONSERVADAS**: en el ejercicio 1, «L√ 2» con un
#    espacio (la figura escribe L√2), «velocidad angular 2 ,» sin la ω —es
#    2ω, como dice la colección— y con un espacio antes de la coma, y los dos
#    «(0,5 punto)» en singular; en el ejercicio 2, «SI el eje» con la I
#    mayúscula y «(1 puntos)» en plural. Ninguna cambia lo que se pide.
#
# 3. **LA CUESTIÓN 3 Y SU «RESPECTIVAMENTE»**: el texto dice que los discos
#    giran «respectivamente» con Ω y ω, que en el orden de la frase daría Ω al
#    disco de radio r; la figura los rotula al revés, ω y α en el pequeño y
#    Ω y A en el grande. La resolución sigue la figura, que es la que el
#    propio enunciado cita para los sentidos, y lo dice.
#
# 4. **DOS NUMERACIONES EN UN CUADERNILLO**, como en la parte del bloque 1:
#    la teoría va de la 1 a la 3 y los ejercicios vuelven a empezar en 1.
#    Aquí las cuestiones son **n 1 a 3** y los ejercicios **n 4 (Ejercicio 1)
#    y n 5 (Ejercicio 2)**; la `fuente` de cada pieza dice el nombre impreso.
#
# Los dos ejercicios están en la colección de la asignatura. El 2 es palabra
# por palabra el 11.6; el 1 es el 7.13 con una frase distinta —la del giro de
# las barras— y otro reparto de apartados. Sus resoluciones reutilizan las de
# la colección, adaptadas a los apartados de aquí, y cada `fuente` dice qué
# cambia.
#
# El examen no publica resolución ni resultados: los desarrollos son nuestros,
# y cada respuesta se recalcula aparte en
# `tests/verificacion/mecanica-1819-2c.test.ts`.
pdf: 2018-2019-2c.pdf

