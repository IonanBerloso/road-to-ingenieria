    pide: >-
      Las reacciones estáticas y dinámicas en A y B en la posición de la
      figura, y dónde van las dos masas de equilibrado.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado pide las reacciones «estáticas y dinámicas». ¿Cómo se
          combinan aquí las dos partes?
        opciones:
          - texto: >-
              La parte dinámica resta, porque la aceleración de G apunta hacia
              el eje, o sea hacia abajo
            correcta: true
            mensaje: |
              Eso es. G está por encima del eje, así que su aceleración
              normal, $\omega^{2}y_G$, va hacia abajo: los apoyos tienen que
              sostener **menos** de lo que pesa la placa en esta posición.
          - texto: Se suman siempre, porque las dos cargas van en el mismo sentido
            mensaje: |
              Depende de dónde esté G. Aquí está arriba y la aceleración
              apunta hacia abajo, así que los dos efectos se restan; media
              vuelta después, con G abajo, se sumarían. Por eso un rotor
              desequilibrado vibra.
          - texto: No hay parte dinámica, porque la velocidad angular es constante
            mensaje: |
              Constante en módulo, pero G no está en el eje: describe una
              circunferencia de 150 mm y necesita aceleración normal. Con
              5 rad/s eso ya son 7,5 N sobre una placa de 2 kg.
          - texto: La dinámica solo afecta al apoyo más cercano a la placa
            mensaje: |
              Las dos partes se reparten entre los dos apoyos con las mismas
              ecuaciones de momentos: la geometría no distingue de dónde viene
              la carga, y los dos apoyos cargan con las dos.

      - tipo: calcular
        titulo: La reacción en A
        pregunta: |
          Con $g = 9{,}8$ m/s², ¿cuánto vale la reacción vertical en A,
          estática más dinámica, en la posición de la figura?
        respuesta:
          tipo: magnitud
          valor: '22.69 N'
          tolerancia: 0.005
          formato: con su unidad, en N
        distractores:
          - valor: '36.75 N'
            mensaje: |
              Esa es solo la parte estática, $\tfrac{15}{8}Mg$: la que habría
              con el eje parado. Falta la dinámica,
              $-\tfrac{45}{16}M\omega^{2}a = -14{,}06$ N.
          - valor: '50.81 N'
            mensaje: |
              Has sumado la parte dinámica en vez de restarla. La aceleración
              de G apunta hacia el eje, o sea hacia abajo, así que en esta
              posición descarga los apoyos.
          - valor: '10.59 N'
            mensaje: |
              Ese es el módulo de la reacción en B. El apoyo más lejano de la
              placa es el que tira hacia abajo; el más cercano, A, es el que
              empuja hacia arriba y carga con más.
        pista: |
          $A_y + B_y - Mg = -M\omega^{2}y_G$, y los momentos en G dan
          $7A_y + 15B_y = 0$, con las distancias en unidades de $a = 100$ mm.
        desarrollo: |
          $$
          A_y + B_y = Mg - M\omega^{2}y_G = 19{,}6 - 7{,}5 = 12{,}1\ \text{N}
          $$

          Momentos respecto de G, con $GA = 3{,}5a$, $GB = 7{,}5a$ y
          $\dot{\vec{H}}_G = \vec{0}$:

          $$
          \frac{7}{2}a\,A_y + \frac{15}{2}a\,B_y = 0 \quad\Longrightarrow\quad B_y = -\frac{7}{15}A_y
          $$

          $$
          A_y = \frac{15}{8}Mg - \frac{45}{16}M\omega^{2}a = 36{,}75 - 14{,}06 = 22{,}69\ \text{N}
          $$

          hacia arriba: 36,75 N de parte estática menos 14,06 N de dinámica.

      - tipo: calcular
        titulo: La reacción en B
        pregunta: |
          ¿Y la reacción vertical en B, en valor absoluto? Va hacia abajo.
        respuesta:
          tipo: magnitud
          valor: '10.59 N'
          tolerancia: 0.005
          formato: con su unidad, en N
        distractores:
          - valor: '17.15 N'
            mensaje: |
              Esa es solo la parte estática, $\tfrac{7}{8}Mg$ hacia abajo. La
              dinámica empuja hacia arriba, $\tfrac{21}{16}M\omega^{2}a = 6{,}56$
              N, y la deja en 10,59 N.
          - valor: '23.71 N'
            mensaje: |
              Has sumado la parte dinámica con el sentido cambiado. En B la
              dinámica va al revés que la estática: $-17{,}15 + 6{,}56$, no
              $-17{,}15 - 6{,}56$.
          - valor: '22.69 N'
            mensaje: |
              Esa es la reacción en A. Con la placa en voladizo, B tira hacia
              abajo y con menos fuerza: $B_y = 12{,}1 - 22{,}69$ N.
        pista: |
          Ya tienes $A_y + B_y = 12{,}1$ N y $A_y = 22{,}69$ N.
        desarrollo: |
          $$
          B_y = -\frac{7}{8}Mg + \frac{21}{16}M\omega^{2}a = -17{,}15 + 6{,}56 = -10{,}59\ \text{N}
          $$

          El signo menos no es un error: con la placa fuera de los dos apoyos,
          B tiene que tirar del eje hacia abajo para que no vuelque sobre A.
          Las horizontales son nulas, $A_x = B_x = 0$, y el par también,
          $P = 0$.

      - tipo: calcular
        titulo: La masa del plano Z = 100 mm
        pregunta: |
          Para equilibrar se ponen las dos masas de 1 kg en los planos
          $Z = 100$ mm y $Z = 300$ mm. ¿A qué distancia del eje va la del plano
          $Z = 100$ mm? Va del mismo lado que la placa.
        respuesta:
          tipo: magnitud
          valor: '675 mm'
          tolerancia: 0.005
          formato: con su unidad, en mm
        distractores:
          - valor: '450 mm'
            mensaje: |
              Es lo que sale si solo se anula $m_1y_1z_1 + m_2y_2z_2$, olvidando
              que la placa aporta su propio producto de inercia,
              $My_Gz_G = 0{,}225$ kg·m². Es el valor que imprime la colección, y
              no equilibra: con él el conjunto sigue con 0,225 kg·m².
          - valor: '975 mm'
            mensaje: |
              Esa es la distancia de la otra masa, la del plano $Z = 300$ mm,
              que va al otro lado del eje.
          - valor: '375 mm'
            mensaje: |
              Has medido las $z$ desde A sin su signo. Se pueden medir desde
              cualquier punto del eje, pero con signo: los planos de las masas
              quedan a $-300$ y $-100$ mm de A, del lado de B.
        pista: |
          Dos condiciones: $My_G + m_1y_1 + m_2y_2 = 0$ y
          $My_Gz_G + m_1y_1z_1 + m_2y_2z_2 = 0$, con las $z$ desde B.
        desarrollo: |
          En metros, con $My_G = 0{,}3$ kg·m y $My_Gz_G = 0{,}225$ kg·m²:

          $$
          0{,}3 + y_1 + y_2 = 0
          \qquad
          0{,}225 + 0{,}1\,y_1 + 0{,}3\,y_2 = 0
          $$

          Restando a la segunda la primera por 0,1, $0{,}195 + 0{,}2\,y_2 = 0$:
          $y_2 = -0{,}975$ m e $y_1 = 0{,}675$ m, del mismo lado que la placa.

      - tipo: calcular
        titulo: La masa del plano Z = 300 mm
        pregunta: |
          ¿Y a qué distancia del eje va la del plano $Z = 300$ mm? Va al otro
          lado del eje.
        respuesta:
          tipo: magnitud
          valor: '975 mm'
          tolerancia: 0.005
          formato: con su unidad, en mm
        distractores:
          - valor: '150 mm'
            mensaje: |
              Es el otro valor que imprime la colección, y sale del mismo
              descuido: no contar el producto de inercia de la placa. Cumple la
              condición estática, pero el rotor sigue desequilibrado
              dinámicamente.
          - valor: '675 mm'
            mensaje: |
              Esa es la de la masa del plano $Z = 100$ mm. La del plano
              $Z = 300$ mm, más cerca de la placa, va al otro lado y más
              lejos.
        pista: |
          Con $y_1 = 0{,}675$ m, la condición estática da $y_2 = -0{,}3 - y_1$.
        desarrollo: |
          $$
          y_2 = -0{,}3 - 0{,}675 = -0{,}975\ \text{m}
          $$

          Comprobación: $0{,}225 + 0{,}1\cdot 0{,}675 + 0{,}3\cdot(-0{,}975) = 0$,
          así que el producto de inercia del conjunto se anula.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Con $\omega$ constante y la placa simétrica respecto de sus ejes
              por G, $\dot{\vec{H}}_G = \vec{0}$: el par es nulo y los momentos
              en G solo llevan reacciones.
          - texto: >-
              La resultante vertical es $Mg - M\omega^{2}y_G = 12{,}1$ N y los
              momentos en G dan $7A_y + 15B_y = 0$, de donde
              $A_y = 22{,}69$ N y $B_y = -10{,}59$ N.
          - texto: >-
              Con el eje parado serían 36,75 N en A y 17,15 N hacia abajo en B;
              el giro los descarga porque G está arriba.
          - texto: >-
              Para equilibrar hay que anular a la vez $\sum m_iy_i$ y el
              producto de inercia del conjunto, que incluye el de la placa,
              $My_Gz_G = 0{,}225$ kg·m².
          - texto: >-
              Como las dos masas de equilibrado van en planos distintos, basta
              con que entre ellas dos se anule la suma de sus $m_iy_iz_i$.
            trampa: true
            mensaje: |
              Lo que hay que anular es el producto de inercia del **conjunto**,
              y la placa aporta el suyo, $My_Gz_G = 0{,}225$ kg·m². Si se
              olvida, salen $-450$ mm y $150$ mm —lo que imprime la colección—
              y el rotor sigue desequilibrado dinámicamente.
    resolucion: |
      **La geometría.** Midiendo desde B a lo largo del eje, la placa va de
      600 a 900 mm, así que $z_G = 750$ mm, e $y_G = 150$ mm. El apoyo A está
      a 400 mm de B. Con $a = 100$ mm, G queda a $3{,}5a$ de A y a $7{,}5a$ de
      B, los dos del mismo lado: la placa está en voladizo.

      **La dinámica.** La placa es simétrica respecto de sus dos ejes
      centrales, así que en ejes por G sus productos de inercia son nulos y
      $\vec{H}_G = I_{Gz}\,\omega\,\vec{k}$ es constante:
      $\dot{\vec{H}}_G = \vec{0}$, y el par P es nulo. Con $\omega$ constante,
      G solo tiene la aceleración normal, hacia el eje:

      $$
      a_G = \omega^{2}y_G = 25\cdot 0{,}15 = 3{,}75\ \text{m/s}^{2}\ \text{hacia abajo}
      $$

      **a) Las ecuaciones**, con A sin reacción axial y B tomando la axial, que
      es nula:

      $$
      A_x + B_x = 0
      \qquad
      A_y + B_y - Mg = -M\omega^{2}y_G
      \qquad
      \tfrac{7}{2}a\,A_y + \tfrac{15}{2}a\,B_y = 0
      $$

      La tercera es la de momentos respecto de G según $x$; la de momentos
      según $y$ da $A_x = B_x = 0$. Resolviendo:

      $$
      A_y = \frac{15}{8}Mg - \frac{45}{16}M\omega^{2}a = 36{,}75 - 14{,}06 = 22{,}69\ \text{N}
      $$

      $$
      B_y = -\frac{7}{8}Mg + \frac{21}{16}M\omega^{2}a = -17{,}15 + 6{,}56 = -10{,}59\ \text{N}
      $$

      **Las reacciones estáticas** son las que habría con el eje parado:
      36,75 N en A hacia arriba y 17,15 N en B hacia abajo. **Las dinámicas**,
      las que añade el giro: 14,06 N en A hacia abajo y 6,56 N en B hacia
      arriba. El signo de B no es un error: con la placa fuera de los dos
      apoyos, B tiene que tirar hacia abajo. Y la parte dinámica **descarga**
      los dos apoyos en esta posición porque G está arriba; media vuelta
      después los cargaría.

      **b) El equilibrado.** Hay que anular a la vez el momento estático del
      conjunto, $\sum m_iy_i$, y su producto de inercia, $\sum m_iy_iz_i$,
      con las $z$ desde B. La placa aporta $My_G = 0{,}3$ kg·m y
      $My_Gz_G = 2\cdot 0{,}15\cdot 0{,}75 = 0{,}225$ kg·m². Con las dos masas
      de 1 kg y las distancias en metros:

      $$
      0{,}3 + y_1 + y_2 = 0
      \qquad
      0{,}225 + 0{,}1\,y_1 + 0{,}3\,y_2 = 0
      $$

      $$
      M_1\left(0,\ 675,\ 100\right)\ \text{mm}
      \qquad
      M_2\left(0,\ -975,\ 300\right)\ \text{mm}
      $$

      La del plano $Z = 100$ mm va del mismo lado que la placa, a 675 mm del
      eje, y la del plano $Z = 300$ mm al otro lado, a 975 mm. Comprobación:
      $0{,}3 + 0{,}675 - 0{,}975 = 0$ y
      $0{,}225 + 0{,}0675 - 0{,}2925 = 0$.

      **Contraste con la colección.** El ejercicio 11.6 publica
      $A_x = B_x = 0$, $P = 0$, $A_y = 22{,}67$ N y $B_y = -10{,}59$ N; con
      $g = 9{,}8$ m/s², el valor exacto de $A_y$ es 22,6875 N. En el
      apartado b imprime $(0,\ -450,\ 100)$ y $(0,\ 150,\ 300)$, que cumplen
      la condición estática pero dejan el producto de inercia del conjunto en
      0,225 kg·m², sin equilibrar: son las posiciones que salen si se olvida
      el término de la placa. La resolución oficial del profesor da 675 y
      $-975$ mm, como aquí.

      **Comprobación independiente.** Partiendo la placa en una malla de
      masas puntuales y planteando las ecuaciones de la dinámica respecto de
      B —con $\sum\vec{r}_i\times m_i\vec{a}_i$ sumado masa a masa, sin
      productos de inercia— salen las mismas reacciones. Y con las dos masas
      añadidas en esas posiciones, la parte dinámica de las reacciones se
      anula y quedan solo las estáticas del conjunto.
