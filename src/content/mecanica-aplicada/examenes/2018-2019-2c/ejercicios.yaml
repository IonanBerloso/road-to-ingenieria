        <text x="82" y="136" text-anchor="end" font-size="12" fill="var(--ink)">Q</text>
        <text x="82" y="98" text-anchor="end" font-size="12" fill="var(--ink)">P</text>
        <text x="82" y="204" text-anchor="end" font-size="12" fill="var(--flag)">I</text>
