ejercicios:
  # ── Cuestión 1 de teoría (n 1) · el momento angular de un sólido respecto
  #    de G, caso general. Es una definición que se deduce: se escribe con
  #    `redactar`, y las cuentas de comprobación usan un sólido nuestro, dicho
  #    en la pregunta.
  - id: exma1819-2c-1-el-momento-angular-respecto-de-g
    titulo: El momento angular de un sólido respecto de su centro de gravedad
    fuente: >-
      Cuestión 1 de teoría · Convocatoria ordinaria de mayo de 2019, bloque 2
      (Cinemática y dinámica) · Mecánica Aplicada, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Transcrita de la columna en castellano, que en el PDF
      va como imagen. El examen no publica resolución; el desarrollo es
      nuestro.
    nivel: examen
    enunciado: |
      **1. (1,5 puntos)** Definir el momento angular de un sólido rígido
      respecto de su centro de gravedad (caso general).
    pide: >-
      La definición del momento angular respecto del centro de gravedad y su
      expresión, en el caso general, con el tensor de inercia.
    pasos:
      - tipo: reconocer
        pregunta: |
          En el caso general, ¿qué relación hay entre el momento angular
          $\vec{H}_G$ y la velocidad angular $\vec{\omega}$ del sólido?
        opciones:
          - texto: >-
              $\vec{H}_G = \mathbf{I}_G\,\vec{\omega}$, con el tensor de
              inercia en G, y en general no es paralelo a $\vec{\omega}$
            correcta: true
            mensaje: |
              Eso es, y es lo que pide «caso general». El tensor mezcla las
              componentes de $\vec{\omega}$ a través de los productos de
              inercia, así que $\vec{H}_G$ solo sale paralelo a $\vec{\omega}$
              cuando $\vec{\omega}$ va según una dirección principal.
          - texto: >-
              $\vec{H}_G = I\,\vec{\omega}$, con el momento de inercia respecto
              del eje de giro
            mensaje: |
              Ese es el caso particular: vale cuando $\vec{\omega}$ va según un
              eje principal de inercia, como en una placa simétrica que gira en
              su plano. En general los productos de inercia añaden una
              componente perpendicular a $\vec{\omega}$.
          - texto: $\vec{H}_G = M\,\vec{r}_G\times\vec{v}_G$
            mensaje: |
              Ese es el momento de la cantidad de movimiento concentrada en G,
              el término que se suma para pasar de $\vec{H}_G$ al momento
              respecto de otro punto. Respecto del propio G su brazo es nulo, y
              no dice nada del giro.

      - tipo: redactar
        que: definicion
        consigna: |
          En papel, como lo entregarías: **define el momento angular respecto
          de G y llega a su expresión para un sólido rígido**, con sus tres
          componentes en unos ejes cualesquiera por G. Media cara.
        rubrica:
          - punto: |
              **La definición.** $\vec{H}_G = \int\vec{\rho}\times\vec{v}\;dm$,
              con $\vec{\rho}$ la posición de cada elemento respecto de G.
            porque: |
              Es lo primero que pide la cuestión, y hay que decir qué es
              $\vec{\rho}$: el vector desde G, no desde el origen. Sin esa frase
              la definición vale para cualquier punto y no es la que se pide.
          - punto: |
              **Da igual la velocidad absoluta que la relativa a G**, porque
              $\int\vec{\rho}\times\vec{v}_G\,dm = \left(\int\vec{\rho}\,dm\right)\times\vec{v}_G = \vec{0}$:
              en el centro de gravedad $\int\vec{\rho}\,dm = \vec{0}$.
            porque: |
              Es la propiedad que hace especial a G y la que permite quedarse
              solo con el giro. Respecto de un punto que se mueve y no es G no
              pasa, y el corrector busca que se diga por qué.
          - punto: |
              **El campo de velocidades del sólido.**
              $\vec{v} = \vec{v}_G + \vec{\omega}\times\vec{\rho}$, así que
              $\vec{H}_G = \int\vec{\rho}\times(\vec{\omega}\times\vec{\rho})\,dm$.
            porque: |
              Es el paso que convierte una definición que vale para cualquier
              sistema de partículas en la de un sólido rígido. Aquí, y solo
              aquí, entra la rigidez.
          - punto: |
              **Las componentes.** Desarrollando el doble producto vectorial,
              $H_{Gx} = I_{Gx}\,\omega_x - I_{Gxy}\,\omega_y - I_{Gzx}\,\omega_z$
              y sus dos análogas, con $I_{Gx} = \int(y^{2} + z^{2})\,dm$ y
              $I_{Gxy} = \int xy\,dm$.
            porque: |
              Es el «caso general»: aparecen los productos de inercia, con signo
              menos. Escribir solo $I\omega$ es dar el caso particular, y el
              signo de los productos es el error de transcripción más
              frecuente.
          - punto: |
              **La forma matricial y su lectura.**
              $\vec{H}_G = \mathbf{I}_G\,\vec{\omega}$, que en general no es
              paralelo a $\vec{\omega}$; lo es solo si $\vec{\omega}$ va según
              una dirección principal, y en ejes principales
              $\vec{H}_G = I_{Gx}\omega_x\hat{\imath} + I_{Gy}\omega_y\hat{\jmath} + I_{Gz}\omega_z\hat{k}$.
            porque: |
              Es la consecuencia que usan los temas 10 y 11: la parte de
              $\vec{H}_G$ perpendicular a $\vec{\omega}$ gira con el sólido, y
              hacerla girar exige un momento aunque $\omega$ sea constante.

      - tipo: calcular
        titulo: La componente según el giro
        pregunta: |
          Comprobación con un sólido nuestro, que no es del enunciado: dos
          masas puntuales de 1 kg en los extremos de una varilla sin masa de
          2 m, con G en el centro. La varilla está en el plano vertical $xz$,
          inclinada 30° sobre la horizontal, y el conjunto gira con
          $\omega = 5$ rad/s alrededor del eje vertical $z$ que pasa por G.
          ¿Cuánto vale la componente de $\vec{H}_G$ según $\vec{\omega}$?
        respuesta:
          tipo: magnitud
          valor: '7.5 kg*m^2/s'
          tolerancia: 0.01
          formato: con su unidad, en kg·m²/s
        distractores:
          - valor: '10 kg*m^2/s'
            mensaje: |
              Has tomado como brazo la distancia de cada masa a G, 1 m, como si
              la varilla fuera perpendicular al eje. Lo que cuenta para
              $I_{Gz}$ es la distancia al eje $z$, que es la horizontal:
              $\cos 30^{\circ}$ m.
          - valor: '2.5 kg*m^2/s'
            mensaje: |
              Eso es $I_{Gx}\,\omega$: has medido la distancia al eje con la
              altura de las masas, $\sin 30^{\circ}$, que es su distancia al
              eje $x$. Respecto del eje de giro la distancia es la horizontal.
          - valor: '8.66 kg*m^2/s'
            mensaje: |
              Eso es el módulo de $\vec{H}_G$. Según $\vec{\omega}$ solo va una
              parte, $I_{Gz}\,\omega$; la otra es perpendicular y sale del
              producto de inercia.
        pista: |
          $H_{Gz} = I_{Gz}\,\omega$, con $I_{Gz} = \sum m\,(x^{2} + y^{2})$.
        desarrollo: |
          $$
          I_{Gz} = 2\cdot 1\cdot\cos^{2}30^{\circ} = 1{,}5\ \text{kg·m}^{2}
          \qquad
          H_{Gz} = 1{,}5\cdot 5 = 7{,}5\ \text{kg·m}^{2}/\text{s}
          $$

      - tipo: calcular
        titulo: La componente perpendicular al giro
        pregunta: |
          ¿Y la componente de $\vec{H}_G$ perpendicular a $\vec{\omega}$, en
          valor absoluto? Es horizontal y apunta hacia el lado contrario al de
          la masa de arriba.
        respuesta:
          tipo: magnitud
          valor: '4.33 kg*m^2/s'
          tolerancia: 0.01
          formato: con su unidad, en kg·m²/s
        distractores:
          - valor: '0 kg*m^2/s'
            mensaje: |
              Eso es suponer $\vec{H}_G$ paralelo a $\vec{\omega}$, que es el
              caso particular. Aquí el eje de giro no es principal: el producto
              de inercia $I_{Gzx} = \sum m\,zx$ no se anula y da una componente
              horizontal.
          - valor: '2.165 kg*m^2/s'
            mensaje: |
              Has contado una sola masa. Las dos aportan lo mismo al producto de
              inercia: en las dos $zx = \sin 30^{\circ}\cos 30^{\circ}$ m²,
              porque $z$ y $x$ cambian de signo a la vez.
        pista: |
          $H_{Gx} = -I_{Gzx}\,\omega$, con $I_{Gzx} = \sum m\,zx$.
        desarrollo: |
          $$
          I_{Gzx} = 2\cdot 1\cdot\sin 30^{\circ}\cos 30^{\circ} = 0{,}866\ \text{kg·m}^{2}
          \qquad
          |H_{Gx}| = 0{,}866\cdot 5 \approx 4{,}33\ \text{kg·m}^{2}/\text{s}
          $$

          El módulo es $\sqrt{7{,}5^{2} + 4{,}33^{2}} \approx 8{,}66$ kg·m²/s y
          forma 30° con $\vec{\omega}$: $\vec{H}_G$ va perpendicular a la
          varilla, no según el eje de giro.

      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              $\vec{H}_G = \int\vec{\rho}\times\vec{v}\;dm$, con $\vec{\rho}$
              la posición de cada elemento respecto de G.
          - texto: >-
              Como $\int\vec{\rho}\,dm = \vec{0}$ en G, la parte de
              $\vec{v}_G$ no aporta, y en un sólido queda
              $\vec{H}_G = \int\vec{\rho}\times(\vec{\omega}\times\vec{\rho})\,dm$.
          - texto: >-
              Desarrollando, $H_{Gx} = I_{Gx}\,\omega_x - I_{Gxy}\,\omega_y - I_{Gzx}\,\omega_z$
              y sus análogas: $\vec{H}_G = \mathbf{I}_G\,\vec{\omega}$.
          - texto: >-
              $\vec{H}_G$ solo es paralelo a $\vec{\omega}$ si $\vec{\omega}$ va
              según una dirección principal de inercia.
          - texto: >-
              Como el sólido es rígido, todos sus puntos giran con la misma
              $\vec{\omega}$, y $\vec{H}_G$ tiene siempre su dirección.
            trampa: true
            mensaje: |
              Que todos los puntos giren con la misma $\vec{\omega}$ no hace
              paralelo a $\vec{H}_G$: cada elemento aporta
              $\vec{\rho}\times(\vec{\omega}\times\vec{\rho})$, que no va según
              $\vec{\omega}$ si $\vec{\rho}$ no le es perpendicular. Lo paralelo
              es la excepción, la de los ejes principales.
    resolucion: |
      **La definición.** El momento angular de un sólido respecto de su centro
      de gravedad G es la suma de los momentos de las cantidades de movimiento
      de sus elementos:

      $$
      \vec{H}_G = \int\vec{\rho}\times\vec{v}\;dm
      $$

      con $\vec{\rho}$ la posición de cada elemento $dm$ respecto de G.

      **Absolutas o relativas a G, da igual.** Escribiendo
      $\vec{v} = \vec{v}_G + \vec{v}\,'$, el término de $\vec{v}_G$ se anula,
      porque en el centro de gravedad $\int\vec{\rho}\,dm = \vec{0}$:

      $$
      \int\vec{\rho}\times\vec{v}_G\;dm = \left(\int\vec{\rho}\;dm\right)\times\vec{v}_G = \vec{0}
      $$

      Es la propiedad que hace especial a G: respecto de él, el momento
      angular es el mismo con las velocidades absolutas que con las relativas
      a G.

      **El sólido rígido.** En un sólido, $\vec{v}\,' = \vec{\omega}\times\vec{\rho}$,
      así que

      $$
      \vec{H}_G = \int\vec{\rho}\times\left(\vec{\omega}\times\vec{\rho}\right)dm
      = \int\left[\rho^{2}\,\vec{\omega} - \left(\vec{\rho}\cdot\vec{\omega}\right)\vec{\rho}\right]dm
      $$

      Proyectando sobre unos ejes $x$, $y$, $z$ con origen en G:

      $$
      \begin{aligned}
      H_{Gx} &= I_{Gx}\,\omega_x - I_{Gxy}\,\omega_y - I_{Gzx}\,\omega_z \\
      H_{Gy} &= I_{Gy}\,\omega_y - I_{Gxy}\,\omega_x - I_{Gyz}\,\omega_z \\
      H_{Gz} &= I_{Gz}\,\omega_z - I_{Gzx}\,\omega_x - I_{Gyz}\,\omega_y
      \end{aligned}
      $$

      con los momentos de inercia $I_{Gx} = \int(y^{2} + z^{2})\,dm$,
      $I_{Gy} = \int(z^{2} + x^{2})\,dm$, $I_{Gz} = \int(x^{2} + y^{2})\,dm$,
      y los productos de inercia $I_{Gxy} = \int xy\,dm$,
      $I_{Gyz} = \int yz\,dm$, $I_{Gzx} = \int zx\,dm$. En forma matricial,
      $\vec{H}_G = \mathbf{I}_G\,\vec{\omega}$:

      $$
      \begin{pmatrix} H_{Gx} \\ H_{Gy} \\ H_{Gz} \end{pmatrix}
      =
      \begin{pmatrix} I_{Gx} & -I_{Gxy} & -I_{Gzx} \\ -I_{Gxy} & I_{Gy} & -I_{Gyz} \\ -I_{Gzx} & -I_{Gyz} & I_{Gz} \end{pmatrix}
      \begin{pmatrix} \omega_x \\ \omega_y \\ \omega_z \end{pmatrix}
      $$

      **Lectura.** Una matriz no conserva en general la dirección de un
      vector, así que $\vec{H}_G$ **no tiene por qué ser paralelo** a
      $\vec{\omega}$. Lo es solo si $\vec{\omega}$ va según una dirección
      principal de inercia. En ejes principales los productos se anulan y

      $$
      \vec{H}_G = I_{Gx}\,\omega_x\,\hat{\imath} + I_{Gy}\,\omega_y\,\hat{\jmath} + I_{Gz}\,\omega_z\,\hat{k}
      $$

      La parte de $\vec{H}_G$ perpendicular a $\vec{\omega}$ gira con el
      sólido, y hacerla girar exige un momento aunque $\omega$ sea constante:
      de ahí salen las reacciones dinámicas del tema 11.

      **Comprobación con un sólido nuestro.** Dos masas de 1 kg en los
      extremos de una varilla sin masa de 2 m, con G en el centro, inclinada
      30° sobre la horizontal en el plano $xz$ y girando a 5 rad/s alrededor
      del eje vertical $z$ por G. Con esos ejes,
      $I_{Gz} = 2\cos^{2}30^{\circ} = 1{,}5$ kg·m²,
      $I_{Gzx} = 2\sin 30^{\circ}\cos 30^{\circ} = 0{,}866$ kg·m², y los
      otros dos productos son nulos:

      $$
      \vec{H}_G = \left(-I_{Gzx}\,\omega,\ 0,\ I_{Gz}\,\omega\right)
      = \left(-4{,}33,\ 0,\ 7{,}5\right)\ \text{kg·m}^{2}/\text{s}
      $$

      de módulo $\sqrt{4{,}33^{2} + 7{,}5^{2}} \approx 8{,}66$ kg·m²/s y
      perpendicular a la varilla: forma 30° con $\vec{\omega}$ en vez de ir
      según ella.

      **Comprobación independiente.** Sumando $m\,\vec{\rho}\times\vec{v}$
      masa a masa, con las velocidades sacadas derivando numéricamente las
      posiciones de las dos masas mientras giran, sale el mismo vector sin
      pasar por el tensor.

  # ── Cuestión 2 de teoría (n 2) · la velocidad de sucesión del CIR, con la
  #    figura de la base y la ruleta. Deducción: `redactar`, y dos cuentas de
  #    comprobación con un disco nuestro que rueda sobre un aro fijo.
  - id: exma1819-2c-2-la-velocidad-de-sucesion-del-cir
    titulo: La velocidad de sucesión del CIR, deducida con la base y la ruleta
    fuente: >-
      Cuestión 2 de teoría · Convocatoria ordinaria de mayo de 2019, bloque 2
      (Cinemática y dinámica) · Mecánica Aplicada, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Transcrita de la columna en castellano, que en el PDF
      va como imagen. El examen no publica resolución; el desarrollo y la
      figura de la resolución son nuestros.
    nivel: examen
    enunciado: |
      **2. (1 punto)** Obtener de forma razonada (mediante figura) la
      velocidad de sucesión del CIR.
    pide: >-
      La expresión de la velocidad de sucesión del CIR, deducida con una
      figura de la base y la ruleta.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué es la velocidad de sucesión del CIR?
        opciones:
          - texto: >-
              La velocidad con que avanza por la base el punto geométrico que
              en cada instante es el CIR
            correcta: true
            mensaje: |
              Eso es. El CIR no es siempre el mismo punto: cambia de sitio en
              el plano fijo, dibujando la base, y en el sólido, dibujando la
              ruleta. Lo que avanza es el punto de contacto entre las dos, y su
              velocidad es $v_s$.
          - texto: La velocidad del punto del sólido que está en el CIR
            mensaje: |
              Esa es nula, por definición de CIR. La de sucesión es la del
              punto **geométrico** de contacto, que a cada instante es un punto
              material distinto; por eso puede ser grande aunque la del punto
              del sólido sea cero.
          - texto: La velocidad del centro de gravedad del sólido
            mensaje: |
              Solo coinciden en casos particulares, como un disco que rueda
              sobre una recta, donde el CIR avanza con el centro. En general
              no: $v_s$ depende de las curvaturas de la base y de la ruleta.

      - tipo: redactar
        que: deduccion
        consigna: |
          En papel, como lo entregarías: **dibuja la base y la ruleta en el CIR
          y deduce la velocidad de sucesión** a partir de la rodadura de una
          sobre otra. Media cara, con la figura.
        rubrica:
          - punto: |
              **La figura.** La base y la ruleta tangentes en el CIR, I, con
              sus centros de curvatura $C_f$ y $C_m$ sobre la normal común y
              sus radios $R_f$ y $R_m$.
            porque: |
              El enunciado la pide expresamente, «mediante figura». Sin los dos
              centros de curvatura no hay forma de relacionar los ángulos, y el
              resto de la deducción queda en el aire.
          - punto: |
              **La ruleta rueda sin deslizar sobre la base**, porque su punto
              de contacto es el CIR, de velocidad nula; así que en un $dt$ el
              CIR recorre el mismo arco en las dos:
              $ds = R_f\,d\theta_f = R_m\,d\theta_m$.
            porque: |
              Es el hecho físico que sostiene todo. Hay que decir **por qué**
              los arcos son iguales —rodadura, y rodadura porque el CIR tiene
              velocidad nula—, no darlo por visto en el dibujo.
          - punto: |
              **El giro del sólido.** Para que el punto $I_m$ de la ruleta
              llegue a tocar la base en $I_f$, el radio $C_mI_m$ tiene que
              ponerse según la normal $C_fI_f$: el sólido gira
              $d\theta = d\theta_f - d\theta_m$.
            porque: |
              Es el paso de la figura, el que se razona con el triángulo de los
              dos centros. El signo menos sale de que los dos centros estén del
              mismo lado; decirlo evita el error de sumar los ángulos.
          - punto: |
              **Despejar y dividir por $dt$.**
              $d\theta = ds\left(\dfrac{1}{R_f} - \dfrac{1}{R_m}\right)$, y con
              $\omega = d\theta/dt$ y $v_s = ds/dt$ queda
              $v_s = \dfrac{\omega}{1/R_f - 1/R_m}$.
            porque: |
              Es el resultado que se pide, y hay que rematarlo con el convenio
              de signos: radios positivos si el centro está del lado de la
              figura, $\omega$ positiva en sentido antihorario.
          - punto: |
              **Un caso conocido.** Un disco de radio $r$ que rueda sobre una
              recta: $R_f \to \infty$ y $R_m = r$, y sale $|v_s| = \omega r$,
              lo que avanza el centro y con él el punto de contacto.
            porque: |
              Comprobar la fórmula en un caso que se sabe de memoria es la
              forma más rápida de cazar en el examen un signo cambiado en el
              convenio.

      - tipo: calcular
        titulo: Rodando por fuera de un aro fijo
        pregunta: |
          Comprobación con valores nuestros, que no son del enunciado: un disco
          de radio $r = 0{,}1$ m rueda sin deslizar **por fuera** de un aro
          fijo de radio $R = 0{,}3$ m, con $\omega = 4$ rad/s. ¿Cuánto vale la
          velocidad de sucesión de su CIR, en valor absoluto? El CIR avanza
          hacia el mismo lado que el centro del disco.
        respuesta:
          tipo: magnitud
          valor: '0.3 m/s'
          tolerancia: 0.01
          formato: con su unidad, en m/s
        distractores:
          - valor: '0.4 m/s'
            mensaje: |
              Eso es $\omega r$, lo que sale sobre un suelo plano, y aquí es la
              velocidad del centro del disco. Sobre una base curva el CIR no
              avanza como el centro: el centro va por una circunferencia de
              radio $R + r$ y el CIR por la del aro, de radio $R$.
          - valor: '0.6 m/s'
            mensaje: |
              Has puesto $R_f = +R$, como si el disco rodara por dentro del
              aro. Por fuera, el centro de curvatura de la base queda al otro
              lado del CIR y su radio entra con signo menos:
              $1/R_f - 1/R_m = -1/R - 1/r$.
          - valor: '1.2 m/s'
            mensaje: |
              Eso es $\omega R$, que mezcla la velocidad angular del disco con
              el radio del aro. El CIR avanza por el aro con la velocidad
              angular de la recta que une los centros, no con la del disco.
        pista: |
          El centro de curvatura de la base está al otro lado del CIR, así que
          $R_f = -0{,}3$ m, y $R_m = 0{,}1$ m.
        desarrollo: |
          $$
          |v_s| = \frac{\omega}{\dfrac{1}{R} + \dfrac{1}{r}} = \frac{\omega R r}{R + r}
          = \frac{4\cdot 0{,}3\cdot 0{,}1}{0{,}4} = 0{,}3\ \text{m/s}
          $$

          Por otro camino: el centro va a $\omega r = 0{,}4$ m/s por una
          circunferencia de radio 0,4 m, así que la recta de los centros gira a
          1 rad/s, y el CIR, que está sobre el aro de 0,3 m, avanza a
          0,3 m/s.

      - tipo: calcular
        titulo: Rodando por dentro del aro
        pregunta: |
          ¿Y si el mismo disco rueda **por dentro** del aro, con la misma
          $\omega$? En valor absoluto; el CIR sigue avanzando hacia el lado
          del centro.
        respuesta:
          tipo: magnitud
          valor: '0.6 m/s'
          tolerancia: 0.01
          formato: con su unidad, en m/s
        distractores:
          - valor: '0.3 m/s'
            mensaje: |
              Es el resultado de rodar por fuera. Por dentro, el centro de
              curvatura del aro queda del mismo lado que el del disco y su
              radio entra con signo más: $1/R - 1/r$, más pequeño en valor
              absoluto, y $v_s$ sale mayor.
          - valor: '0.4 m/s'
            mensaje: |
              Eso es otra vez $\omega r$, la velocidad del centro. Por dentro,
              el centro recorre una circunferencia de radio $R - r = 0{,}2$ m:
              la recta de los centros gira a 2 rad/s y el CIR va por el aro de
              0,3 m.
        pista: |
          Ahora los dos centros de curvatura están del mismo lado:
          $R_f = 0{,}3$ m y $R_m = 0{,}1$ m.
        desarrollo: |
          $$
          |v_s| = \frac{\omega}{\dfrac{1}{r} - \dfrac{1}{R}} = \frac{\omega R r}{R - r}
          = \frac{4\cdot 0{,}3\cdot 0{,}1}{0{,}2} = 0{,}6\ \text{m/s}
          $$

      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              La ruleta rueda sin deslizar sobre la base, porque su punto de
              contacto es el CIR y tiene velocidad nula.
          - texto: >-
              En un $dt$ el CIR recorre el mismo arco en las dos curvas,
              $ds = R_f\,d\theta_f = R_m\,d\theta_m$.
          - texto: >-
              Para que el nuevo punto de la ruleta toque la base, el sólido
              gira $d\theta = d\theta_f - d\theta_m$.
          - texto: >-
              Dividiendo por $dt$,
              $v_s = \omega\big/\left(1/R_f - 1/R_m\right)$.
          - texto: >-
              Como el CIR tiene velocidad nula, su velocidad de sucesión también
              es nula.
            trampa: true
            mensaje: |
              La velocidad nula es la del punto **del sólido** que ocupa el
              CIR. La de sucesión es la del punto geométrico de contacto, que a
              cada instante es un punto material distinto: en un disco que
              rueda por el suelo el CIR avanza con el centro.
    resolucion: |
      **Qué es.** El CIR de un movimiento plano cambia con el tiempo. Sus
      posiciones en el plano fijo dibujan la **base** o polar fija, y sus
      posiciones en el sólido, la **ruleta** o polar móvil. En cada instante
      se tocan en el CIR, y como el punto del sólido que está en el CIR tiene
      velocidad nula, **la ruleta rueda sin deslizar sobre la base**. La
      velocidad de sucesión $v_s$ es la del punto de contacto al avanzar por
      la base: no es la de ningún punto del sólido.

      <figure class="figura-examen">
      <svg viewBox="0 0 330 250" role="img" width="330" height="250"
           aria-labelledby="ma18192c2rt ma18192c2rd">
        <title id="ma18192c2rt">La base y la ruleta tangentes en el CIR</title>
        <desc id="ma18192c2rd">Dos arcos tangentes en el punto I, el CIR,
        los dos con la concavidad hacia arriba. El más cerrado es la base, de
        centro de curvatura Cf; el más abierto es la ruleta, de centro Cm, más
        arriba en la misma vertical. A la derecha de I, un punto If sobre la
        base y un punto Im sobre la ruleta, a la misma distancia de I medida a
        lo largo de cada curva. Los radios que llegan a ellos forman los ángulos
        d theta f y d theta m con la vertical. En I, una flecha horizontal
        hacia la derecha: la velocidad de sucesión.</desc>
        <path d="M80.5 160 A110 110 0 0 0 259.5 160" fill="none" stroke="var(--ink)" stroke-width="1.6"/>
        <path d="M68.4 174.6 A180 180 0 0 0 271.6 174.6" fill="none" stroke="var(--d1)" stroke-width="1.6"/>
        <line x1="170" y1="26" x2="170" y2="206" stroke="var(--faint)" stroke-width="1" stroke-dasharray="4 3"/>
        <line x1="170" y1="96" x2="227.5" y2="189.8" stroke="var(--faint)" stroke-width="1" stroke-dasharray="4 3"/>
        <line x1="170" y1="26" x2="229.4" y2="195.9" stroke="var(--d1)" stroke-width="1" stroke-dasharray="4 3"/>
        <path d="M170 126 A30 30 0 0 0 185.7 121.6" fill="none" stroke="var(--ink)" stroke-width="1"/>
        <path d="M170 72 A46 46 0 0 0 185.2 69.4" fill="none" stroke="var(--d1)" stroke-width="1"/>
        <circle cx="170" cy="96" r="3" fill="var(--ink)"/>
        <circle cx="170" cy="26" r="3" fill="var(--d1)"/>
        <circle cx="170" cy="206" r="3.5" fill="var(--flag)"/>
        <circle cx="227.5" cy="189.8" r="2.6" fill="var(--ink)"/>
        <circle cx="229.4" cy="195.9" r="2.6" fill="var(--d1)"/>
        <line x1="170" y1="206" x2="207" y2="206" stroke="var(--d3)" stroke-width="2"/>
        <polygon points="214,206 206,210 206,202" fill="var(--d3)"/>
        <text x="162" y="100" text-anchor="end" font-size="12" fill="var(--ink)">C<tspan font-size="9" dy="3">f</tspan></text>
        <text x="162" y="30" text-anchor="end" font-size="12" fill="var(--d1)">C<tspan font-size="9" dy="3">m</tspan></text>
        <text x="162" y="224" text-anchor="end" font-size="12" fill="var(--ink)">I</text>
        <text x="244" y="172" font-size="12" fill="var(--ink)">I<tspan font-size="9" dy="3">f</tspan></text>
        <text x="236" y="214" font-size="12" fill="var(--d1)">I<tspan font-size="9" dy="3">m</tspan></text>
        <text x="186" y="224" font-size="12" font-style="italic" fill="var(--d3)">v<tspan font-size="9" dy="3">s</tspan></text>
        <text x="174" y="146" font-size="11" fill="var(--ink)">dθ<tspan font-size="8" dy="3">f</tspan></text>
        <text x="195" y="82" font-size="11" fill="var(--d1)">dθ<tspan font-size="8" dy="3">m</tspan></text>
        <text x="264" y="158" font-size="11" fill="var(--ink)">base</text>
        <text x="276" y="180" font-size="11" fill="var(--d1)">ruleta</text>
      </svg>
      <figcaption>

      La base y la ruleta, tangentes en el CIR **I**, con sus centros de
      curvatura en la misma vertical. Al rodar una sobre otra, el CIR recorre
      el mismo arco en las dos: llega a un punto de la base y a uno de la
      ruleta que acabarán tocándose. Los ángulos están exagerados para que se
      vean.

      </figcaption>
      </figure>

      **Arcos iguales.** Como la ruleta rueda sin deslizar, en un $dt$ el
      punto de contacto recorre el mismo arco $ds$ en las dos curvas. Con los
      radios de curvatura $R_f$ de la base y $R_m$ de la ruleta en I, esos
      arcos se ven desde sus centros bajo los ángulos $d\theta_f$ y
      $d\theta_m$:

      $$
      ds = R_f\,d\theta_f = R_m\,d\theta_m
      $$

      **El giro del sólido.** El punto $I_m$ de la ruleta es el que va a tocar
      la base en $I_f$. Para eso el radio $C_mI_m$, que ahora forma
      $d\theta_m$ con la vertical, tiene que quedar según la normal a la base
      en $I_f$, que forma $d\theta_f$: la ruleta, y con ella el sólido, gira

      $$
      d\theta = d\theta_f - d\theta_m
      $$

      que es la relación de ángulos del triángulo que forman los dos centros
      con el corte de los dos radios.

      **El resultado.** Sustituyendo los ángulos y dividiendo por $dt$, con
      $\omega = d\theta/dt$ y $v_s = ds/dt$:

      $$
      d\theta = ds\left(\frac{1}{R_f} - \frac{1}{R_m}\right)
      \qquad\Longrightarrow\qquad
      v_s = \frac{\omega}{\dfrac{1}{R_f} - \dfrac{1}{R_m}}
      $$

      con el convenio de la figura: $v_s$ positiva hacia la derecha, los
      radios positivos si su centro está por encima de I y $\omega$ positiva
      en sentido antihorario.

      **Casos.** Un disco de radio $r$ que rueda sobre una recta tiene
      $R_f \to \infty$ y $R_m = r$: $v_s = -\omega r$, es decir, el CIR
      avanza con el centro, a $\omega r$. Con valores nuestros, un disco de
      $r = 0{,}1$ m que gira a 4 rad/s sobre un aro fijo de $R = 0{,}3$ m:
      por fuera, $R_f = -0{,}3$ m y $|v_s| = \omega Rr/(R + r) = 0{,}3$ m/s;
      por dentro, $R_f = 0{,}3$ m y $|v_s| = \omega Rr/(R - r) = 0{,}6$ m/s.

      **Comprobación independiente.** La posición del CIR también sale del
      campo de velocidades: es el punto donde se cortan las perpendiculares a
      las velocidades de dos puntos del sólido. Simulando el disco que rueda
      sobre el aro y derivando numéricamente esa posición salen los mismos
      0,3 y 0,6 m/s. Y encaja con la aceleración del CIR del tema,
      $\vec{a}_I = \vec{v}_s\times\vec{\omega}$: por fuera da
      $0{,}3\cdot 4 = 1{,}2$ m/s², que es lo que vale
      $\omega^{2}rR/(R + r)$ para un disco que rueda sobre una
      circunferencia fija.

  # ── Cuestión 3 de teoría (n 3) · un disco que rueda sobre otro que gira
  #    alrededor de su centro fijo. El enunciado es simbólico; las cuentas de
  #    comprobación usan valores nuestros, declarados en la pregunta.
  - id: exma1819-2c-3-el-disco-que-rueda-sobre-otro-que-gira
    titulo: Un disco que rueda sobre otro que gira, su punto de contacto y su CIR
    fuente: >-
      Cuestión 3 de teoría · Convocatoria ordinaria de mayo de 2019, bloque 2
      (Cinemática y dinámica) · Mecánica Aplicada, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Transcrita de la columna en castellano, que en el PDF
      va como imagen; la figura está redibujada. El texto dice que los discos
      giran «respectivamente» con Ω y ω, que en el orden de la frase daría Ω al
      disco de radio r, y la figura los rotula al revés, ω y α en el disco
      pequeño y Ω y A en el grande; aquí se sigue la figura, que es la que el
      enunciado cita para los sentidos. El examen no publica resolución; el
      desarrollo es nuestro.
    nivel: examen
    antes:
      idea: |
        Cada disco es un sólido rígido: conocidos la velocidad y la aceleración
        de uno de sus puntos y su giro, se conocen las de todos los demás. Lo
        que une a los dos discos es lo que ocurre en el punto donde se tocan.
      formula: |
        Los campos de velocidades y de aceleraciones del sólido rígido en el
        plano:

        $$
        \vec{v}_B = \vec{v}_A + \vec{\omega}\times\overrightarrow{AB}
        \qquad
        \vec{a}_B = \vec{a}_A + \vec{\alpha}\times\overrightarrow{AB} - \omega^{2}\,\overrightarrow{AB}
        $$

        Un punto que recorre una circunferencia de radio ρ tiene una
        aceleración tangencial $dv/dt$ y una normal $v^{2}/\rho$, hacia el
        centro.
      reconocer: |
        Antes de calcular se mira qué punto de cada disco se mueve de una forma
        conocida.
    enunciado: |
      **3. (1,5 puntos)** La figura muestra la rodadura de un disco de radio r
      sobre un disco de radio R con punto fijo O. Ambos giran respectivamente
      con velocidad angular Ω y ω y con aceleración angular A y α (sentidos
      mostrados en la figura).

      Obtener la velocidad y aceleración en el punto de contacto Q entre los
      dos discos y el CIR del disco de radio r.

      <figure class="figura-examen">
      <svg viewBox="0 0 300 335" role="img" width="300" height="335"
           aria-labelledby="ma18192c3t ma18192c3d">
        <title id="ma18192c3t">Un disco de radio r que rueda sobre un disco de radio R con punto fijo O</title>
        <desc id="ma18192c3d">Un disco grande, de radio R, con su centro O
        fijo, marcado con el símbolo de articulación. Encima, apoyado en él, un
        disco pequeño de radio r y centro P, que lo toca en el punto Q, justo
        encima de O. Cada disco lleva una flecha curva en sentido horario: la
        del pequeño está rotulada ω, α y la del grande Ω, A.</desc>
        <circle cx="150" cy="225" r="100" fill="var(--faint)" fill-opacity=".14" stroke="var(--ink)" stroke-width="1.6"/>
        <circle cx="150" cy="75" r="50" fill="var(--faint)" fill-opacity=".32" stroke="var(--ink)" stroke-width="1.6"/>
        <path d="M128 61.2 A26 26 0 0 1 172 61.2" fill="none" stroke="var(--ink)" stroke-width="1.6"/>
        <polygon points="174.7,65.5 167.1,60.8 173.9,56.6" fill="var(--ink)"/>
        <path d="M121.2 207 A34 34 0 0 1 178.8 207" fill="none" stroke="var(--ink)" stroke-width="1.6"/>
        <polygon points="181.5,211.2 173.9,206.6 180.6,202.3" fill="var(--ink)"/>
        <circle cx="150" cy="75" r="3.5" fill="var(--ink)"/>
        <text x="138" y="82" text-anchor="end" font-size="13" fill="var(--ink)">P</text>
        <circle cx="150" cy="125" r="3.5" fill="var(--ink)"/>
        <text x="140" y="145" text-anchor="end" font-size="13" fill="var(--ink)">Q</text>
        <rect x="141" y="216" width="18" height="18" rx="3" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.8"/>
        <circle cx="150" cy="225" r="4.5" fill="var(--ink)"/>
        <text x="136" y="254" text-anchor="end" font-size="13" fill="var(--ink)">O</text>
        <text x="202" y="36" font-size="15" font-style="italic" fill="var(--ink)">ω, α</text>
        <text x="112" y="182" text-anchor="middle" font-size="15" font-style="italic" fill="var(--ink)">Ω, A</text>
      </svg>
      </figure>
    pide: >-
      La velocidad y la aceleración del punto de contacto Q y la posición del
      CIR del disco de radio r.
    pasos:
      - tipo: reconocer
        pregunta: |
          El disco pequeño rueda sin deslizar sobre el grande, que gira
          alrededor de O. ¿Qué impone la rodadura en Q?
        opciones:
          - texto: >-
              Que los dos puntos en contacto tienen la misma velocidad,
              $\Omega R$, que no es nula porque el disco grande gira
            correcta: true
            mensaje: |
              Eso es. Rodar sin deslizar es velocidad **relativa** nula en el
              contacto, no velocidad nula. Aquí la base se mueve, así que el
              punto Q del disco pequeño va a $\Omega R$, igual que el del
              grande.
          - texto: Que la velocidad de Q es nula, porque Q es el CIR del disco pequeño
            mensaje: |
              Eso vale cuando se rueda sobre algo **fijo**. El disco grande gira
              alrededor de O y su punto Q va a $\Omega R$; el pequeño, que no
              desliza, tiene en Q esa misma velocidad, así que su CIR está en
              otro sitio.
          - texto: Que las aceleraciones de los dos puntos en contacto son iguales
            mensaje: |
              Solo lo son sus componentes tangenciales. Las normales no: los dos
              puntos se separan de la tangente común con curvaturas distintas.
              Es el error que más se comete en esta cuestión.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna ecuación: **los dos discos con la dirección
          de la velocidad de Q y de la de P**, y la recta en la que tiene que
          estar el centro instantáneo del disco pequeño.
        comprueba:
          - punto: |
              **$\vec{v}_Q$, horizontal, hacia la derecha.**
            porque: |
              Como punto del disco grande, Q gira alrededor de O, que está fijo,
              en sentido horario.
          - punto: |
              **$\vec{v}_P$, horizontal.**
            porque: |
              P está siempre a $R + r$ de O: recorre una circunferencia
              alrededor de O, y su velocidad es perpendicular a OP.
          - punto: |
              **El centro instantáneo del disco pequeño, sobre la recta OP.**
            porque: |
              Es la perpendicular a $\vec{v}_P$ por P. Dónde cae en esa recta lo
              dicen las ecuaciones.
        figura: |
          <svg viewBox="10 60 200 236" role="img" width="200" height="236" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">Esquema de velocidades de los dos discos</title>
            <desc id="dsl-d">El disco grande, de radio R, con su centro O fijo, y encima el pequeño, de radio r y centro P, que lo toca en Q, justo encima de O. La recta OP, a trazos, pasa por los tres puntos. La velocidad de Q como punto del disco grande, horizontal, hacia la derecha; la de P, también horizontal. Los dos discos giran en sentido horario: el grande con omega mayúscula y A, el pequeño con omega y alfa.</desc>
            <defs>
              <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
              </marker>
              <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
              </marker>
              <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
              </marker>
            </defs>
            <path d="M185 205 A75 75 0 1 0 35 205 A75 75 0 1 0 185 205 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M135 105 A25 25 0 1 0 85 105 A25 25 0 1 0 135 105 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M110 66 V290" fill="none" stroke="var(--ink)" stroke-width="1" stroke-dasharray="4 3"/>
            <circle cx="110" cy="205" r="3.4" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
            <path d="M141.9 216.6 A34 34 0 0 1 78.1 216.6" fill="none" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
            <text x="146" y="250" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">Ω, A</text>
            <path d="M96.8 100.2 A14 14 0 0 1 123.2 100.2" fill="none" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
            <text x="130" y="82" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">ω, α</text>
            <line x1="110" y1="130" x2="152" y2="130" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
            <text x="156" y="140" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">v<tspan font-size="7.5" dy="2.5">Q</tspan></text>
            <line x1="110" y1="105" x2="152" y2="105" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
            <text x="156" y="102" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">v<tspan font-size="7.5" dy="2.5">P</tspan></text>
            <circle cx="110" cy="205" r="2.4" fill="var(--ink)"/>
            <text x="100" y="200" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">O</text>
            <circle cx="110" cy="130" r="2.4" fill="var(--ink)"/>
            <text x="100" y="146" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">Q</text>
            <circle cx="110" cy="105" r="2.4" fill="var(--ink)"/>
            <text x="102" y="120" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">P</text>
          </svg>

      - tipo: calcular
        titulo: La velocidad del punto de contacto
        pregunta: |
          Comprobación con valores nuestros, que no son del enunciado:
          $R = 0{,}3$ m, $r = 0{,}1$ m, $\Omega = 2$ rad/s, $\omega = 5$ rad/s,
          $A = 1$ rad/s² y $\alpha = 4$ rad/s², todos en los sentidos de la
          figura. ¿Cuánto vale la velocidad de Q?
        respuesta:
          tipo: magnitud
          valor: '0.6 m/s'
          tolerancia: 0.01
          formato: con su unidad, en m/s
        distractores:
          - valor: '0 m/s'
            mensaje: |
              Eso sería si Q fuera el CIR del disco pequeño, que solo pasa
              cuando rueda sobre algo quieto. Aquí el disco grande gira y su
              punto Q va a $\Omega R$; la rodadura obliga al del pequeño a ir
              igual.
          - valor: '1.1 m/s'
            mensaje: |
              Esa es la velocidad del centro P, $\Omega R + \omega r$. Q está
              un radio más abajo, y el giro horario del disco pequeño le quita
              $\omega r$.
          - valor: '0.5 m/s'
            mensaje: |
              Eso es $\omega r$, la velocidad de Q respecto de P. Le falta la
              del propio P: sumando las dos, con su sentido, sale $\Omega R$.
          - valor: '0.825 m/s'
            mensaje: |
              Esa es la velocidad del punto **geométrico** de contacto, el que
              va recorriendo el borde del disco grande con la recta OP. La que
              se pide es la del punto material de los discos que está en Q.
        pista: |
          Q es un punto del disco grande, que gira alrededor de O fijo.
        desarrollo: |
          $$
          v_Q = \Omega R = 2\cdot 0{,}3 = 0{,}6\ \text{m/s}
          $$

          tangente a los dos discos, hacia la derecha en la figura. Como punto
          del disco pequeño da lo mismo: $v_P - \omega r = 1{,}1 - 0{,}5 = 0{,}6$
          m/s, con $v_P = \Omega R + \omega r$.

      - tipo: calcular
        titulo: La aceleración tangencial de Q
        pregunta: |
          Con los mismos valores, ¿cuánto vale la componente tangencial de la
          aceleración de Q, la horizontal en la figura?
        respuesta:
          tipo: magnitud
          valor: '0.3 m/s^2'
          tolerancia: 0.01
          formato: con su unidad, en m/s²
        distractores:
          - valor: '0.4 m/s^2'
            mensaje: |
              Eso es $\alpha r$. La tangencial en el contacto es la misma en los
              dos discos y la fija el grande, que gira alrededor de un punto
              fijo: $AR$. La $\alpha$ del pequeño entra en la aceleración de P
              y vuelve a salir en la de Q respecto de P.
          - valor: '0.7 m/s^2'
            mensaje: |
              Esa es la tangencial de P, $AR + \alpha r$. A Q hay que sumarle
              la tangencial relativa, $\alpha r$ hacia atrás, y queda $AR$.
        pista: |
          Como punto del disco grande, la tangencial de Q es $A R$; como punto
          del pequeño tiene que salir lo mismo.
        desarrollo: |
          $$
          a_{Q,t} = A R = 1\cdot 0{,}3 = 0{,}3\ \text{m/s}^{2}
          $$

          Por el disco pequeño: $(AR + \alpha r) - \alpha r = 0{,}7 - 0{,}4 = 0{,}3$
          m/s². Es lo que exige la rodadura: las tangenciales coinciden.

      - tipo: calcular
        titulo: La aceleración normal de Q en el disco pequeño
        pregunta: |
          ¿Y la componente normal, la de la recta OP, de Q **como punto del
          disco de radio r**? En valor absoluto; con estos valores apunta hacia
          O.
        respuesta:
          tipo: magnitud
          valor: '0.525 m/s^2'
          tolerancia: 0.01
          formato: con su unidad, en m/s²
        distractores:
          - valor: '2.5 m/s^2'
            mensaje: |
              Eso es $\omega^{2}r$, la de Q respecto de P, como si P estuviera
              quieto. P recorre una circunferencia alrededor de O y tiene su
              propia aceleración normal, $v_P^{2}/(R + r)$, hacia O.
          - valor: '1.2 m/s^2'
            mensaje: |
              Esa es $\Omega^{2}R$, la de Q como punto del disco **grande**. En
              la rodadura las normales de los dos puntos en contacto no
              coinciden; la del pequeño se calcula desde su centro P.
          - valor: '5.525 m/s^2'
            mensaje: |
              Has sumado las dos partes. La de P apunta hacia O y la de Q
              respecto de P apunta hacia P, al revés: se restan,
              $\omega^{2}r - v_P^{2}/(R + r)$.
          - valor: '3.025 m/s^2'
            mensaje: |
              Esa es solo la normal de P, $v_P^{2}/(R + r)$. Falta la de Q
              respecto de P, $\omega^{2}r$ hacia P, que la reduce.
        pista: |
          Parte de P: su normal es $v_P^{2}/(R + r)$ hacia O, y la de Q
          respecto de P es $\omega^{2}r$ hacia P.
        desarrollo: |
          $$
          a_{Q,n} = \omega^{2}r - \frac{(\Omega R + \omega r)^{2}}{R + r}
          = 25\cdot 0{,}1 - \frac{1{,}1^{2}}{0{,}4} = 2{,}5 - 3{,}025 = -0{,}525\ \text{m/s}^{2}
          $$

          medida hacia P, así que son 0,525 m/s² hacia O. Con otros valores
          puede salir hacia P: el signo depende de cuál de los dos términos
          gane.

      - tipo: calcular
        titulo: La distancia del CIR a Q
        pregunta: |
          ¿A qué distancia de Q está el CIR del disco de radio r? Está sobre la
          recta OP, entre Q y O.
        respuesta:
          tipo: magnitud
          valor: '0.12 m'
          tolerancia: 0.01
          formato: con su unidad, en m
        distractores:
          - valor: '0 m'
            mensaje: |
              Es poner el CIR en el contacto, que vale al rodar sobre algo
              fijo. Aquí Q va a $\Omega R$, así que el punto de velocidad nula
              del disco pequeño está más abajo.
          - valor: '0.22 m'
            mensaje: |
              Esa es la distancia desde P, $v_P/\omega$. Desde Q hay un radio
              menos: $0{,}22 - 0{,}1$.
          - valor: '0.3 m'
            mensaje: |
              Eso es poner el CIR en O, como si el disco pequeño girara pegado
              al grande. Solo pasa si $\Omega = \omega$; aquí el pequeño gira
              más deprisa y su CIR queda entre Q y O.
        pista: |
          El CIR está sobre la recta OP, a la distancia $v_P/\omega$ de P.
        desarrollo: |
          $$
          \overline{PI} = \frac{v_P}{\omega} = \frac{1{,}1}{5} = 0{,}22\ \text{m}
          \qquad
          \overline{QI} = 0{,}22 - 0{,}1 = 0{,}12\ \text{m}
          $$

          que es $R\,\Omega/\omega$: por debajo de Q, entre Q y O.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Rodadura: los puntos en contacto tienen la misma velocidad,
              $v_Q = \Omega R$, así que el centro del pequeño va a
              $v_P = \Omega R + \omega r$.
          - texto: >-
              P recorre una circunferencia de radio $R + r$: su aceleración
              tiene una tangencial $AR + \alpha r$ y una normal
              $v_P^{2}/(R + r)$ hacia O.
          - texto: >-
              Desde P, la tangencial de Q queda en $AR$ y la normal en
              $\omega^{2}r - v_P^{2}/(R + r)$, positiva hacia P.
          - texto: >-
              El CIR del disco pequeño está sobre OP a $v_P/\omega$ de P, o sea
              a $R\Omega/\omega$ de Q hacia O.
          - texto: >-
              Como el disco pequeño rueda sin deslizar, su CIR es el punto de
              contacto Q.
            trampa: true
            mensaje: |
              Eso vale si la superficie sobre la que rueda está quieta. Aquí el
              disco grande gira y Q va a $\Omega R$: el CIR queda a
              $R\Omega/\omega$ de Q hacia O, y solo cae en Q si $\Omega = 0$.
    resolucion: |
      **1. Esquema de velocidades.** Es un problema de cinemática: el dibujo
      lleva la dirección de las velocidades que se conocen.

