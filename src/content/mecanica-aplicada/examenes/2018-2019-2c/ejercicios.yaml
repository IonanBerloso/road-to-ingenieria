      <figcaption>

      Solo las direcciones, sin escala. Q, como punto del disco grande, gira alrededor de O: su velocidad es perpendicular a OQ. P se mueve en una circunferencia alrededor de O: su velocidad es perpendicular a OP. Los dos giros son datos, horarios, como en la figura del enunciado.

      </figcaption>
      </figure>

      - **Qué gira con qué.** El texto dice que los discos giran
        «respectivamente» con Ω y ω, pero la figura pone ω y α en el disco de
        radio r y Ω y A en el de radio R, y es la figura la que el enunciado
        cita para los sentidos. Se sigue la figura: el disco grande gira
        alrededor de O fijo con $\Omega$ y $A$, y el pequeño con $\omega$ y
        $\alpha$, su velocidad angular absoluta; **todos en sentido horario**.
      - **Q**, como punto del disco grande, gira alrededor de O: su velocidad
        es horizontal, hacia la derecha.
      - **P** está siempre a $R + r$ de O: su velocidad es perpendicular a OP,
        horizontal, y el centro instantáneo del disco pequeño está sobre la
        recta OP.

      **2. Incógnitas.** $\vec{v}_Q$ y $\vec{a}_Q$; $\vec{v}_P$ y $\vec{a}_P$,
      para llegar a ellas; y la posición del centro instantáneo, I.

      **3. Ecuaciones.** Con los giros horarios y P encima de Q, y Q encima de
      O. La rodadura sin deslizamiento iguala la velocidad del punto Q de los
      dos discos:

      $$
      v_Q = \Omega R,
      \qquad
      v_Q = v_P - \omega r
      $$

      P recorre una circunferencia de radio $R + r$ alrededor de O:

      $$
      a_{P,t} = \frac{dv_P}{dt},
      \qquad
      a_{P,n} = \frac{v_P^{2}}{R + r}\ \text{hacia O}
      $$

      Q como punto del disco pequeño, desde P, con $\overrightarrow{PQ}$ de
      longitud $r$ hacia O:

      $$
      \vec{a}_Q = \vec{a}_P + \vec{\alpha}\times\overrightarrow{PQ} - \omega^{2}\,\overrightarrow{PQ}
      $$

      Y el centro instantáneo, sobre OP, a $v_P/\omega$ de P.

      **4. Resultados.** La velocidad de Q y la de P:

      $$
      v_Q = \Omega R,
      \qquad
      v_P = \Omega R + \omega r,
      \qquad
      \vec{v}_Q = \Omega R\,\vec{\imath},
      \qquad
      \vec{v}_P = \left(\Omega R + \omega r\right)\vec{\imath}
      $$

      La aceleración de P, tangencial y normal:

      $$
      a_{P,t} = A R + \alpha r,
      \qquad
      a_{P,n} = \frac{(\Omega R + \omega r)^{2}}{R + r}
      $$

      Y la de Q como punto del disco pequeño: el término de $\vec{\alpha}$ vale
      $\alpha r$ hacia la izquierda y el centrípeto, $\omega^{2}r$ hacia P.

      $$
      a_{Q,t} = A R,
      \qquad
      a_{Q,n} = \omega^{2}r - \frac{(\Omega R + \omega r)^{2}}{R + r}\ \text{positiva hacia P}
      $$

      El centro instantáneo del disco pequeño, del lado de Q, que es donde el
      giro horario da velocidades hacia la izquierda que compensan la de P:

      $$
      \overline{PI} = \frac{\Omega R + \omega r}{\omega} = r + \frac{R\,\Omega}{\omega}
      \qquad\Longrightarrow\qquad
      \overline{QI} = \frac{R\,\Omega}{\omega}\ \text{hacia O}
      $$

      Con valores nuestros, $R = 0{,}3$ m, $r = 0{,}1$ m, $\Omega = 2$ rad/s,
      $\omega = 5$ rad/s, $A = 1$ rad/s² y $\alpha = 4$ rad/s²:
      $v_Q = 0{,}6$ m/s, $v_P = 1{,}1$ m/s, $a_{Q,t} = 0{,}3$ m/s²,
      $a_{Q,n} = 2{,}5 - 3{,}025 = -0{,}525$ m/s² —es decir, 0,525 m/s² hacia
      O— y el centro instantáneo a $0{,}3\cdot 2/5 = 0{,}12$ m por debajo de Q.

