    pide: >-
      Las velocidades angulares de las dos barras, las velocidades de A, B y
      C, la velocidad de C vista desde el plano y las aceleraciones angulares
      de las dos barras.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué condición determina la velocidad angular de la barra 2?
        opciones:
          - texto: >-
              Que C solo pueda moverse a lo largo de la guía horizontal, dentro
              del plano
            correcta: true
            mensaje: |
              Eso es. La deslizadera obliga a que la velocidad de C no tenga
              componente vertical, y esa única ecuación fija el giro de la
              barra 2 respecto del plano, $\vec{\omega}_{2/\pi}$.
          - texto: >-
              Que la barra 2 gire a la misma velocidad que la 1, por ser de la
              misma longitud
            mensaje: |
              La longitud no impone eso. De hecho salen iguales en módulo pero
              **opuestas** en sentido respecto del plano, y eso es un resultado
              del cálculo, no una hipótesis.
          - texto: Que la velocidad de B sea nula
            mensaje: |
              B se mueve: es el extremo de la barra 1, que gira alrededor de A
              a 2ω dentro del plano. Que B esté sobre el eje de giro solo le
              quita la velocidad de arrastre, no la relativa.

      - tipo: calcular
        titulo: La velocidad angular de la barra 1
        pregunta: |
          Con valores nuestros, que no son del enunciado: $\omega = 2$ rad/s y
          $L = 0{,}5$ m, y la barra 1 girando respecto del plano a $2\omega$.
          ¿Cuánto vale el módulo de la velocidad angular absoluta de la barra
          1?
        respuesta:
          tipo: numero
          valor: '4.4721'
          tolerancia: 0.01
          formato: un número, en rad/s (vale la forma exacta, como 2*sqrt(5))
        distractores:
          - valor: '4'
            mensaje: |
              Eso es solo el giro relativo al plano, $2\omega$. La velocidad
              angular absoluta suma también la del plano, $-\omega\,\vec{k}$,
              que es perpendicular al giro relativo.
          - valor: '6'
            mensaje: |
              Has sumado los módulos, $2\omega + \omega$. Los dos giros son
              vectores perpendiculares —uno según la normal al plano y otro
              según $z$—, y se componen con Pitágoras.
          - valor: '2'
            mensaje: |
              Eso es la velocidad angular del plano. La barra gira además
              dentro de él a $2\omega$, y ese giro es el mayor de los dos.
        pista: |
          $\vec{\omega}_1 = \vec{\omega}_\pi + \vec{\omega}_{1/\pi}$, con
          $\vec{\omega}_\pi = -\omega\,\vec{k}$ y
          $\vec{\omega}_{1/\pi} = 2\omega\,\vec{i}$.
        desarrollo: |
          $$
          \vec{\omega}_1 = 2\omega\,\vec{i} - \omega\,\vec{k}
          \qquad
          |\vec{\omega}_1| = \sqrt{5}\,\omega = \sqrt{5}\cdot 2 \approx 4{,}472\ \text{rad/s}
          $$

          La barra 2 tiene $\vec{\omega}_2 = -2\omega\,\vec{i} - \omega\,\vec{k}$,
          del mismo módulo.

      - tipo: calcular
        titulo: La velocidad de B
        pregunta: |
          Con los mismos valores, ¿cuánto vale el módulo de la velocidad de B?
        respuesta:
          tipo: magnitud
          valor: '2.828 m/s'
          tolerancia: 0.01
          formato: con su unidad, en m/s
        distractores:
          - valor: '3 m/s'
            mensaje: |
              Le has sumado a B un arrastre de $\omega L$, como a A. Pero B está
              sobre el eje $z$, y el giro del plano no mueve los puntos del
              eje: toda su velocidad es la relativa.
          - valor: '2 m/s'
            mensaje: |
              Es una sola de las dos componentes de $\vec{v}_B$,
              $2\omega L\,\vec{j}$ o $-2\omega L\,\vec{k}$. B se mueve en
              diagonal, perpendicular a la barra: el módulo lleva $\sqrt{2}$.
          - valor: '1.414 m/s'
            mensaje: |
              Has hecho girar la barra a $\omega$ en vez de a $2\omega$ dentro
              del plano: $\omega\cdot L\sqrt{2}$. El giro relativo del
              enunciado es el doble.
        pista: |
          $\vec{v}_B = \vec{v}_A + \vec{\omega}_1\times\overrightarrow{AB}$,
          con $\vec{v}_A = \omega L\,\vec{i}$ y
          $\overrightarrow{AB} = (0,\,-L,\,-L)$.
        desarrollo: |
          $$
          \vec{v}_B = \omega L\,\vec{i} + \left(-\omega L\,\vec{i} + 2\omega L\,\vec{j} - 2\omega L\,\vec{k}\right)
          = 2\omega L\,(\vec{j} - \vec{k})
          $$

          $$
          |\vec{v}_B| = 2\sqrt{2}\,\omega L = 2\sqrt{2}\cdot 1 \approx 2{,}828\ \text{m/s}
          $$

          Y A, que es un punto del plano a la distancia L del eje, va a
          $\omega L = 1$ m/s según $\vec{i}$.

      - tipo: calcular
        titulo: La velocidad de C
        pregunta: |
          ¿Cuánto vale el módulo de la velocidad absoluta de C?
        respuesta:
          tipo: magnitud
          valor: '4.123 m/s'
          tolerancia: 0.01
          formato: con su unidad, en m/s
        distractores:
          - valor: '4 m/s'
            mensaje: |
              Esa es la velocidad de C vista desde el plano, a lo largo de la
              guía. La absoluta suma el arrastre: C está a L del eje y el plano
              la lleva a $\omega L$ según $-\vec{i}$.
          - valor: '5 m/s'
            mensaje: |
              Has sumado los módulos del arrastre y de la relativa,
              $\omega L + 4\omega L$. Son perpendiculares: una va según
              $\vec{i}$ y la otra según $\vec{j}$.
        pista: |
          $\vec{v}_C = \vec{v}_B + \vec{\omega}_2\times\overrightarrow{BC}$,
          con $\vec{\omega}_2 = \omega_{2/\pi}\,\vec{i} - \omega\,\vec{k}$ y la
          condición de que $\vec{v}_C$ no tenga componente vertical.
        desarrollo: |
          $$
          \vec{\omega}_{2/\pi} = -2\omega\,\vec{i}
          \qquad
          \vec{v}_C = -\omega L\,\vec{i} + 4\omega L\,\vec{j}
          $$

          $$
          |\vec{v}_C| = \sqrt{17}\,\omega L = \sqrt{17}\cdot 1 \approx 4{,}123\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La velocidad de C vista desde el plano
        pregunta: |
          ¿Cuánto vale la velocidad de C para un observador situado en el
          plano π?
        respuesta:
          tipo: magnitud
          valor: '4 m/s'
          tolerancia: 0.01
          formato: con su unidad, en m/s
        distractores:
          - valor: '2 m/s'
            mensaje: |
              Esa es la componente horizontal de la velocidad relativa de B,
              $2\omega L$. C se mueve el doble: la barra 2 aporta otro tanto en
              horizontal y anula la vertical.
          - valor: '4.123 m/s'
            mensaje: |
              Esa es la absoluta. El observador del plano gira con él y no ve
              el arrastre: hay que restar la velocidad del punto del plano que
              coincide con C, $\omega L$ según $-\vec{i}$.
          - valor: '1 m/s'
            mensaje: |
              Ese es el arrastre, $\omega L$: lo que movería a C si estuviera
              quieta en el plano. El observador del plano ve justo lo
              contrario, lo que no es arrastre.
        pista: |
          $\vec{v}_{C/\pi} = \vec{v}_C - \vec{\omega}_\pi\times\overrightarrow{OC}$.
        desarrollo: |
          $$
          \vec{v}_{C/\pi} = \left(-\omega L\,\vec{i} + 4\omega L\,\vec{j}\right) - \left(-\omega L\,\vec{i}\right)
          = 4\omega L\,\vec{j}
          $$

          O sea 4 m/s, horizontal y a lo largo de la guía, como tiene que ser.

      - tipo: calcular
        titulo: La aceleración angular de la barra 1
        pregunta: |
          ¿Cuánto vale el módulo de la aceleración angular de la barra 1?
        respuesta:
          tipo: numero
          valor: '8'
          tolerancia: 0.01
          formato: un número, en rad/s²
        distractores:
          - valor: '0'
            mensaje: |
              Es pensar que, como los dos giros son constantes, no hay
              aceleración angular. El relativo es constante en módulo, pero va
              según la normal al plano, y el plano la hace girar: su derivada
              es $\vec{\omega}_\pi\times\vec{\omega}_{1/\pi}$.
          - valor: '4'
            mensaje: |
              Eso es $\omega^{2}$: te has dejado el 2 del giro relativo. La
              derivada es $\vec{\omega}_\pi\times 2\omega\,\vec{i}$, de módulo
              $2\omega^{2}$.
        pista: |
          Con $\vec{\omega}_\pi$ constante,
          $\vec{\alpha}_1 = \vec{\omega}_\pi\times\vec{\omega}_{1/\pi}$.
        desarrollo: |
          $$
          \vec{\alpha}_1 = \left(-\omega\,\vec{k}\right)\times\left(2\omega\,\vec{i}\right) = -2\omega^{2}\,\vec{j}
          \qquad
          |\vec{\alpha}_1| = 2\cdot 2^{2} = 8\ \text{rad/s}^{2}
          $$

          Y la barra 2, con el giro relativo al revés,
          $\vec{\alpha}_2 = 2\omega^{2}\,\vec{j}$, del mismo módulo.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Con $A = (0;\ L;\ 0)$, $B = (0;\ 0;\ -L)$ y $C = (0;\ -L;\ 0)$,
              el plano gira a $-\omega\,\vec{k}$ y la barra 1 a
              $2\omega\,\vec{i}$ respecto del plano.
          - texto: >-
              $\vec{\omega}_1 = 2\omega\,\vec{i} - \omega\,\vec{k}$, y desde
              $\vec{v}_A = \omega L\,\vec{i}$ sale
              $\vec{v}_B = 2\omega L\,(\vec{j} - \vec{k})$.
          - texto: >-
              La guía obliga a que C no tenga velocidad vertical, así que
              $\vec{\omega}_{2/\pi} = -2\omega\,\vec{i}$,
              $\vec{v}_C = -\omega L\,\vec{i} + 4\omega L\,\vec{j}$ y
              $\vec{v}_{C/\pi} = 4\omega L\,\vec{j}$.
          - texto: >-
              El plano arrastra la dirección de los giros relativos, así que
              $\vec{\alpha}_1 = -2\omega^{2}\,\vec{j}$ y
              $\vec{\alpha}_2 = 2\omega^{2}\,\vec{j}$.
          - texto: >-
              Como el giro del plano y los de las barras respecto de él son
              constantes, las barras no tienen aceleración angular.
            trampa: true
            mensaje: |
              Constantes en módulo, sí; en dirección, no. El giro relativo va
              según la normal al plano, $\vec{i}$, y esa normal gira con el
              plano: su derivada es
              $\vec{\omega}_\pi\times 2\omega\,\vec{i} = -2\omega^{2}\,\vec{j}$.
              Es todo el apartado d.
    resolucion: |
      **El enunciado y el sentido de las barras.** Este examen dice que las
      barras «giran con velocidad angular 2 ,» dentro del plano: falta la ω y
      no dice el sentido. La colección, que trae el mismo problema como
      ejercicio 7.13, lo precisa: la barra 1 gira respecto del plano a
      $2\omega$, constante y en sentido antihorario visto de frente. Se toma
      ese sentido. Los módulos que se piden no dependen de él; los vectores
      cambiarían el signo de su parte relativa.

      **Los ejes.** Con el plano π conteniendo los ejes $y$ y $z$ en el
      instante de la figura: $A = (0;\ L;\ 0)$, $B = (0;\ 0;\ -L)$ y
      $C = (0;\ -L;\ 0)$. La flecha de la figura hace girar el plano en
      sentido horario visto desde arriba, $\vec{\omega}_\pi = -\omega\,\vec{k}$,
      y la barra 1 gira respecto del plano con
      $\vec{\omega}_{1/\pi} = 2\omega\,\vec{i}$.

      **a) Velocidades angulares.** Se suman el giro del plano y el
      relativo:

      $$
      \vec{\omega}_1 = 2\omega\,\vec{i} - \omega\,\vec{k}
      \qquad
      \vec{\omega}_2 = -2\omega\,\vec{i} - \omega\,\vec{k}
      $$

      El giro de la barra 2 respecto del plano, $-2\omega\,\vec{i}$, sale de
      la guía en el apartado b; y no es casual: el triángulo ABC es isósceles
      con la base AC horizontal, así que la barra 2 gira siempre al revés que
      la 1. Las dos tienen módulo $\sqrt{5}\,\omega$.

      **b) Velocidades de A, B y C.** A es un punto del plano, a la
      distancia L del eje:

      $$
      \vec{v}_A = \vec{\omega}_\pi\times\overrightarrow{OA} = \omega L\,\vec{i}
      $$

      B, desde A con el campo de velocidades de la barra 1:

      $$
      \vec{v}_B = \vec{v}_A + \vec{\omega}_1\times\overrightarrow{AB} = 2\omega L\,\vec{j} - 2\omega L\,\vec{k}
      $$

      Y C, desde B con el de la barra 2, imponiendo que la deslizadera no
      tenga velocidad vertical, que es lo que fija $\vec{\omega}_{2/\pi}$:

      $$
      \vec{v}_C = \vec{v}_B + \vec{\omega}_2\times\overrightarrow{BC} = -\omega L\,\vec{i} + 4\omega L\,\vec{j}
      $$

      Sus módulos son $\omega L$, $2\sqrt{2}\,\omega L$ y
      $\sqrt{17}\,\omega L$.

      **c) La velocidad de C vista desde el plano.** Se resta el arrastre, la
      velocidad del punto del plano que coincide con C:

      $$
      \vec{v}_{C/\pi} = \vec{v}_C - \vec{\omega}_\pi\times\overrightarrow{OC} = 4\omega L\,\vec{j}
      $$

      horizontal, a lo largo de la guía, como tiene que ser.

      **d) Aceleraciones angulares.** Los giros relativos son constantes en
      módulo, pero van según la normal al plano, $\vec{i}$, y el plano la hace
      girar. Con $\vec{\omega}_\pi$ constante:

      $$
      \vec{\alpha}_1 = \vec{\omega}_\pi\times\vec{\omega}_{1/\pi} = -2\omega^{2}\,\vec{j}
      \qquad
      \vec{\alpha}_2 = \vec{\omega}_\pi\times\vec{\omega}_{2/\pi} = 2\omega^{2}\,\vec{j}
      $$

      de módulo $2\omega^{2}$ las dos.

      **Contraste con la colección.** El ejercicio 7.13 publica
      $\vec{v}_A = \omega L\,\vec{i}$,
      $\vec{\omega}_2 = -2\omega\,\vec{i} - \omega\,\vec{k}$,
      $\vec{v}_C = -\omega L\,\vec{i} + 4\omega L\,\vec{j}$,
      $\vec{v}_{C/\pi} = 4\omega L\,\vec{j}$,
      $\vec{\alpha}_1 = -2\omega^{2}\,\vec{j}$ y
      $\vec{\alpha}_2 = 2\omega^{2}\,\vec{j}$: lo mismo que aquí.

      **Comprobación independiente.** Con $\omega = 2$ rad/s y $L = 0{,}5$ m,
      simulando el mecanismo —el plano girando, la barra 1 girando dentro de
      él y C obligada a quedarse en la horizontal de A— y derivando
      numéricamente las posiciones de los puntos y los ejes de la barra 1,
      salen 4,472 rad/s, 2,828 m/s, 4,123 m/s, 4 m/s y 8 rad/s², los valores
      de las casillas.

  # ── Ejercicio 2 (n 5) · la placa cuadrada soldada al eje. Palabra por
  #    palabra el 11.6 de la colección; la resolución se reutiliza, adaptada a
  #    los dos apartados de aquí.
  - id: exma1819-2c-5-la-placa-cuadrada-en-voladizo
    titulo: La placa cuadrada en voladizo, sus reacciones y su equilibrado
    fuente: >-
      Ejercicio 2 · Convocatoria ordinaria de mayo de 2019, bloque 2
      (Cinemática y dinámica) · Mecánica Aplicada, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Transcrito de la columna en castellano; «SI el eje»
      y «(1 puntos)» son del original, y la figura está redibujada con sus
      cotas. Es palabra por palabra el ejercicio 11.6 de la colección del tema
      11, y la resolución reutiliza la de allí, contrastada con su resultado
      publicado y con la resolución oficial del profesor; en el apartado b se
      publica lo que dan las cuentas y la resolución oficial, 675 mm y
      menos 975 mm, no lo que imprime la colección. El examen no publica
      resolución.
    nivel: examen
    enunciado: |
      **2. (3 puntos)** La figura muestra una placa cuadrada de 2 kg de masa
      soldada sobre un eje horizontal. SI el eje gira con velocidad angular
      positiva constante ω = 5 rad/s:

      **a)** Calcular las reacciones estáticas y dinámicas en los apoyos A y B
      para la posición mostrada. (2 puntos)

      **b)** Calcular las posiciones de dos masas M=1kg colocadas sobre los
      planos verticales Z=100 mm y Z=300 mm para conseguir el equilibrado del
      sistema. (1 puntos)

