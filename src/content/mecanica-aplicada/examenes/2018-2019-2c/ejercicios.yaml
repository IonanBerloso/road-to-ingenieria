      <figcaption>

      a) El eje con la placa, sin los cojinetes. Cada cojinete sujeta el eje en las dos direcciones perpendiculares a él: las y en el papel y las x saliendo de él. La axial la toma B. P es el par motor, incógnita, dibujado en el sentido de ω. b) Lo que tienen que dar: con ω constante, G solo tiene la aceleración normal, hacia el eje; y la placa es simétrica respecto de sus ejes por G, así que su momento angular respecto de G va según el eje de giro y no cambia. Ejes: z a lo largo del eje, hacia la placa; y hacia arriba; x saliendo del papel. Cotas en mm.

      </figcaption>
      </figure>

      - **La geometría.** Midiendo desde B a lo largo del eje, la placa va de
        600 a 900 mm: $z_G = 750$ mm e $y_G = 150$ mm. A está a 400 mm de B,
        así que G queda a 350 mm de A y a 750 mm de B, los dos del mismo lado:
        la placa está en voladizo.
      - **Las fuerzas.** En A, $A_x$ y $A_y$; en B, $B_x$, $B_y$ y la axial
        $B_z$; el peso $Mg$ en G; y el par motor P, según el eje.
      - **Lo que tienen que dar.** Con ω constante, G solo tiene la
        aceleración normal, $\omega^{2}y_G$ hacia el eje: en esta posición,
        hacia abajo. La placa es simétrica respecto de sus dos ejes centrales:
        en ejes por G sus productos de inercia son nulos,
        $\vec{H}_G = I_{Gz}\,\omega\,\vec{k}$ es constante y
        $\dot{\vec{H}}_G = \vec{0}$.

      **2. Incógnitas.** $A_x$, $A_y$, $B_x$, $B_y$, $B_z$ y P; y, para el
      equilibrado, la distancia al eje de cada masa, $y_1$ e $y_2$.

      **3. Ecuaciones.** Con los ejes del enunciado —z a lo largo del eje,
      hacia la placa; y hacia arriba; x saliendo del papel— y $a = 100$ mm. La
      resultante:

      $$
      A_x + B_x = 0,
      \qquad
      A_y + B_y - Mg = -M\omega^{2}y_G,
      \qquad
      B_z = 0
      $$

      Los momentos respecto de G, según x, y y z, con A a $3{,}5a$ de G y B a
      $7{,}5a$, del mismo lado:

      $$
      \tfrac{7}{2}a\,A_y + \tfrac{15}{2}a\,B_y - y_G\,B_z = 0,
      \qquad
      -\tfrac{7}{2}a\,A_x - \tfrac{15}{2}a\,B_x = 0,
      \qquad
      y_G\left(A_x + B_x\right) + P = 0
      $$

      Para el equilibrado, con las masas $m_1 = m_2 = 1$ kg en los planos
      $z_1 = 100$ mm y $z_2 = 300$ mm, el centro de masas del conjunto en el
      eje y su producto de inercia $I_{yz}$ nulo, con el de la placa respecto
      de los ejes por B, $My_Gz_G$:

      $$
      My_G + m_1y_1 + m_2y_2 = 0,
      \qquad
      My_Gz_G + m_1y_1z_1 + m_2y_2z_2 = 0
      $$

      Las de x se cumplen con las dos masas en el plano de la placa, $x = 0$.

      **4. Resultados.** a) Con $A_x + B_x = 0$, la de momentos según y da
      $A_x = B_x = 0$, y la de z, $P = 0$. Las verticales, con $B_z = 0$:

      $$
      A_y = \frac{15}{8}Mg - \frac{45}{16}M\omega^{2}a = 36{,}75 - 14{,}06 = 22{,}69\ \text{N}
      $$

      $$
      B_y = -\frac{7}{8}Mg + \frac{21}{16}M\omega^{2}a = -17{,}15 + 6{,}56 = -10{,}59\ \text{N}
      $$

      $$
      \vec{F}_A = 22{,}69\,\vec{\jmath}\ \text{N},
      \qquad
      \vec{F}_B = -10{,}59\,\vec{\jmath}\ \text{N},
      \qquad
      P = 0
      $$

      **Las reacciones estáticas** son las que habría con el eje parado:
      36,75 N en A hacia arriba y 17,15 N en B hacia abajo. **Las dinámicas**,
      las que añade el giro: 14,06 N en A hacia abajo y 6,56 N en B hacia
      arriba. El signo de B no es un error: con la placa fuera de los dos
      apoyos, B tiene que tirar hacia abajo para que no vuelque sobre A.

      b) La placa aporta $My_G = 0{,}3$ kg·m y
      $My_Gz_G = 2\cdot 0{,}15\cdot 0{,}75 = 0{,}225$ kg·m². En metros:

      $$
      0{,}3 + y_1 + y_2 = 0,
      \qquad
      0{,}225 + 0{,}1\,y_1 + 0{,}3\,y_2 = 0
      $$

      Restando a la segunda la primera por 0,1, $0{,}195 + 0{,}2\,y_2 = 0$:

      $$
      y_2 = -0{,}975\ \text{m},
      \qquad
      y_1 = 0{,}675\ \text{m},
      \qquad
      M_1\left(0,\ 675,\ 100\right)\ \text{mm},
      \qquad
      M_2\left(0,\ -975,\ 300\right)\ \text{mm}
      $$

