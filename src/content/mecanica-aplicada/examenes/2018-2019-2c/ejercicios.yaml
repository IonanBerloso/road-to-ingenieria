      **5. Comprobación.** a) Los momentos respecto de B según x, que no se
      han usado. Respecto de un punto que no es G, a $\dot{\vec{H}}_G$ se le
      suma el momento de $M\vec{a}_G$, aquí $z_G\,M\omega^{2}y_G$:

      $$
      -400\,A_y + 750\,Mg = 750\,M\omega^{2}y_G
      $$

      en N·mm. A la izquierda, $-9075 + 14\,700 = 5625$; a la derecha,
      $750\cdot 2\cdot 25\cdot 0{,}15 = 5625$. b) Con las masas puestas, la
      parte dinámica de las reacciones tiene que anularse. Cada masa a una
      distancia $z$ de B y a $y$ del eje pide, por la misma ecuación,
      $-\tfrac{z}{400}\,m\omega^{2}y$ en A y el resto de $-m\omega^{2}y$ en B.
      En A, $-14{,}0625 - 4{,}21875 + 18{,}28125 = 0$ N; en B,
      $6{,}5625 - 12{,}65625 + 6{,}09375 = 0$ N.

      Por otro camino, fuera del alcance del examen —la placa partida en una
      malla de masas puntuales y las ecuaciones de la dinámica respecto de B
      sumadas masa a masa, sin productos de inercia—, salen las mismas
      reacciones, y con las dos masas añadidas la parte dinámica se anula. Es
      también el ejercicio 11.6 de la colección, que publica
      $A_x = B_x = 0$, $P = 0$, $A_y = 22{,}67$ N y $B_y = -10{,}59$ N; con
      $g = 9{,}8$ m/s², el valor exacto de $A_y$ es 22,6875 N. En el apartado
      b imprime $(0,\ -450,\ 100)$ y $(0,\ 150,\ 300)$, que cumplen la
      condición estática pero dejan el producto de inercia del conjunto en
      0,225 kg·m², sin equilibrar: son las posiciones que salen si se olvida
      el término de la placa. La resolución oficial del profesor da 675 y
      $-975$ mm, como aquí.

      **Lo que dice el resultado.** La parte dinámica **descarga** los dos
      apoyos en esta posición porque G está arriba; media vuelta después los
      cargaría. Las reacciones oscilan con cada vuelta, y eso es la
      vibración de un rotor desequilibrado. Para quitarla no basta con llevar
      el centro de masas al eje: hace falta anular también el producto de
      inercia, y por eso hacen falta dos masas en dos planos. Como esos
      planos están cerca el uno del otro y lejos de la placa, las masas
      tienen que ir muy lejos del eje, a 675 y 975 mm, más que el tamaño de
      la propia placa.
