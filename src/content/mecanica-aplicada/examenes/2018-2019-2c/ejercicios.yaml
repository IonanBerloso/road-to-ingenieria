      </svg>
      <figcaption>

      Con los valores de comprobación, a escala. Las velocidades del disco
      pequeño a lo largo de OP crecen en línea recta desde su CIR, **I**, a
      0,12 m por debajo de **Q**; las del disco grande, desde **O**. Las dos
      rectas se cruzan en **Q**, donde la rodadura iguala las velocidades.

      </figcaption>
      </figure>

      **5. Comprobación.** La aceleración de Q como punto del disco **grande**,
      que no se ha usado: $AR$ de tangencial y $\Omega^{2}R$ hacia O. La
      tangencial es la misma, como exige la rodadura. Las dos normales pueden
      ser distintas, porque los dos puntos solo coinciden en este instante, y
      su diferencia, medida hacia P, tiene que salir positiva o nula:

      $$
      \omega^{2}r - \frac{(\Omega R + \omega r)^{2}}{R + r} + \Omega^{2}R
      = \frac{R\,r}{R + r}\,(\omega - \Omega)^{2}
      $$

      Con los valores de prueba, $-0{,}525 + 1{,}2 = 0{,}675$ m/s², y
      $\tfrac{0{,}03}{0{,}4}\cdot 3^{2} = 0{,}675$ m/s². Por otro camino, fuera
      del alcance del examen —los discos simulados y la posición del punto
      material que pasa por Q derivada numéricamente—, salen la misma
      velocidad, las mismas dos componentes y el centro instantáneo a 0,12 m
      de Q. Es también el ejemplo 3 del apartado 8.3.5 de los apuntes del tema
      8, con R₁, R₂, ω₁ y ω₂ en lugar de R, r, Ω y ω: las expresiones
      coinciden.

      **Lo que dice el resultado.** Rodar sin deslizar iguala las velocidades
      de los dos puntos en contacto, no las anula: el punto de contacto solo
      es el centro instantáneo si la superficie sobre la que se rueda está
      quieta. Si $\Omega = 0$, el centro instantáneo cae en Q; si
      $\Omega = \omega$, cae en O, porque los dos discos giran juntos como un
      solo sólido y la diferencia de las normales se anula.

  # ── Ejercicio 1 (n 4) · el plano vertical que gira con las dos barras. Es
  #    el 7.13 de la colección con otra frase para el giro de las barras y
  #    otro reparto de apartados; la resolución se reutiliza, adaptada.
  - id: exma1819-2c-4-las-dos-barras-en-el-plano-que-gira
    titulo: Las dos barras dentro de un plano vertical que gira
    fuente: >-
      Ejercicio 1 · Convocatoria ordinaria de mayo de 2019, bloque 2
      (Cinemática y dinámica) · Mecánica Aplicada, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Transcrito de la columna en castellano; «L√ 2» con
      un espacio, la ω que falta en «velocidad angular 2 ,», el espacio antes
      de esa coma y los dos «(0,5 punto)» en singular son del original, y las
      dos figuras están redibujadas. La resolución reutiliza la del ejercicio
      7.13 de la colección del tema 7, que tiene el mismo enunciado salvo esa
      frase —la colección dice «La velocidad angular de la barra 1 relativa al
      plano π es 2ω constante y de sentido antihorario (ver figura)»— y el
      reparto de apartados, y está contrastada con su resultado publicado. El
      examen no publica resolución.
    nivel: examen
    antes:
      idea: |
        Cuando un sólido se mueve dentro de otro que también se mueve, su
        movimiento se compone: el del sólido que lo lleva, el arrastre, más el
        que tiene respecto de él. Las velocidades angulares se suman como
        vectores, y con ellas cada barra cumple el campo de velocidades del
        sólido rígido.
      formula: |
        La composición de velocidades angulares, con π el sólido que arrastra
        y $\vec{\omega}_{\text{rel}}$ el giro respecto de él:

        $$
        \vec{\omega} = \vec{\omega}_\pi + \vec{\omega}_{\text{rel}}
        $$

        El campo de velocidades del sólido rígido, y la velocidad de un punto
        P respecto de π, con O un punto fijo del eje de π:

        $$
        \vec{v}_B = \vec{v}_A + \vec{\omega}\times\overrightarrow{AB}
        \qquad
        \vec{v}_{P/\pi} = \vec{v}_P - \vec{\omega}_\pi\times\overrightarrow{OP}
        $$

        Y la aceleración angular es la derivada de la velocidad angular,
        $\vec{\alpha} = d\vec{\omega}/dt$.
      reconocer: |
        Antes de calcular se mira qué sabe cada punto de cómo se mueve.
    enunciado: |
      **1. (3 puntos)** El plano π vertical gira alrededor del eje vertical z
      con velocidad angular ω constante y sentido de giro dado en la figura.
      Dos barras 1 (AB) y 2 (BC) de longitud L√ 2 permanecen siempre en el
      plano π sobre el cual giran con velocidad angular 2 , también constante.
      La barra 1 está articulada en A, punto solidario al plano, y en B a la
      barra 2. Por su parte, la barra 2 está articulada a una deslizadera C
      que se mueve siempre sobre una guía horizontal a la altura de A.

      En la posición de la figura, determinar:

      **a)** Velocidades angulares de las barras 1 y 2. (0,5 punto)

      **b)** Velocidades lineales de los puntos A, B y C. (1 punto)

      **c)** Velocidad del punto C para un observador situado en el plano π.
      (0,5 punto)

      **d)** Aceleraciones angulares de las barras 1 y 2. (1 punto)

