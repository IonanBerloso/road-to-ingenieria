      <figcaption>

      Solo las direcciones, sin escala. El plano visto de frente, con x saliendo del papel. A es un punto del plano: solo tiene la velocidad de arrastre, perpendicular al plano. B está en el eje: no tiene arrastre, y su velocidad es la de girar alrededor de A dentro del plano, perpendicular a AB. Respecto del plano, cada barra gira en perpendicular a él, según x: la 1 con 2ω, dato; la 2, dibujada en el sentido positivo. Y C, en la guía, respecto del plano solo puede moverse en horizontal; su velocidad relativa se dibuja en el sentido de y. Los dos sentidos los dirá el cálculo.

      </figcaption>
      </figure>

      - **El enunciado y el sentido de las barras.** Este examen dice que las
        barras «giran con velocidad angular 2 ,» dentro del plano: falta la ω
        y no dice el sentido. La colección, que trae el mismo problema como
        ejercicio 7.13, lo precisa: la barra 1 gira respecto del plano a
        $2\omega$, constante y en sentido antihorario visto de frente. Se toma
        ese sentido. Los módulos que se piden no dependen de él; los vectores
        cambiarían el signo de su parte relativa.
      - **El plano** gira alrededor de z en sentido horario visto desde
        arriba, el de la flecha de la figura. **A**, un punto del plano a L
        del eje, solo tiene el arrastre: perpendicular al plano, saliendo del
        papel.
      - **Las barras** se quedan en el plano: respecto de él giran alrededor
        de su normal, x. La 1, a $2\omega$, dato; la 2, a $\omega_{2/\pi}$,
        dibujada en el sentido positivo; el
        cálculo dirá su sentido.
      - **B** está sobre el eje z: no tiene arrastre, y su velocidad es la de
        girar alrededor de A dentro del plano, perpendicular a AB.
      - **C**, respecto del plano, solo puede correr por la guía: en
        horizontal.

      **2. Incógnitas.** $\omega_{2/\pi}$, y con él $\vec{\omega}_1$ y
      $\vec{\omega}_2$; $\vec{v}_A$, $\vec{v}_B$, $\vec{v}_C$ y
      $\vec{v}_{C/\pi}$; y $\vec{\alpha}_1$ y $\vec{\alpha}_2$.

      **3. Ecuaciones.** Con el plano π conteniendo los ejes $y$ y $z$ en el
      instante de la figura: $A = (0;\ L;\ 0)$, $B = (0;\ 0;\ -L)$ y
      $C = (0;\ -L;\ 0)$, con O en el origen. El giro del plano es
      $\vec{\omega}_\pi = -\omega\,\vec{k}$, y los relativos,
      $\vec{\omega}_{1/\pi} = 2\omega\,\vec{i}$ y
      $\vec{\omega}_{2/\pi} = \omega_{2/\pi}\,\vec{i}$. Las velocidades
      angulares:

      $$
      \vec{\omega}_1 = \vec{\omega}_\pi + \vec{\omega}_{1/\pi},
      \qquad
      \vec{\omega}_2 = \vec{\omega}_\pi + \vec{\omega}_{2/\pi}
      $$

      Las velocidades, de A a B por la barra 1 y de B a C por la 2, con la
      condición de la guía: C no tiene velocidad vertical.

      $$
      \vec{v}_A = \vec{\omega}_\pi\times\overrightarrow{OA},
      \qquad
      \vec{v}_B = \vec{v}_A + \vec{\omega}_1\times\overrightarrow{AB},
      \qquad
      \vec{v}_C = \vec{v}_B + \vec{\omega}_2\times\overrightarrow{BC},
      \qquad
      \vec{v}_C\cdot\vec{k} = 0
      $$

      La de C vista desde el plano, restando el arrastre:

      $$
      \vec{v}_{C/\pi} = \vec{v}_C - \vec{\omega}_\pi\times\overrightarrow{OC}
      $$

      Y las aceleraciones angulares, derivando $\vec{\omega}_1$ y
      $\vec{\omega}_2$. $\vec{\omega}_\pi$ es constante. Los giros relativos
      son constantes en módulo —el de la 2 también: AB y BC miden lo mismo y
      A y C están siempre a la misma altura, así que la 2 gira siempre al
      revés que la 1—, pero van según $\vec{i}$, la normal al plano, y el
      plano la hace girar: $d\vec{i}/dt = \vec{\omega}_\pi\times\vec{i}$.

      $$
      \vec{\alpha}_1 = \vec{\omega}_\pi\times\vec{\omega}_{1/\pi},
      \qquad
      \vec{\alpha}_2 = \vec{\omega}_\pi\times\vec{\omega}_{2/\pi}
      $$

      **4. Resultados.** La velocidad de A y la de B:

      $$
      \vec{v}_A = \omega L\,\vec{i},
      \qquad
      \vec{v}_B = \omega L\,\vec{i} + \left(-\omega L\,\vec{i} + 2\omega L\,\vec{j} - 2\omega L\,\vec{k}\right)
      = 2\omega L\,\vec{j} - 2\omega L\,\vec{k}
      $$

      Desde B, con $\overrightarrow{BC} = (0;\ -L;\ L)$:

      $$
      \vec{v}_C = -\omega L\,\vec{i} + \left(2\omega L - \omega_{2/\pi}L\right)\vec{j} - \left(2\omega L + \omega_{2/\pi}L\right)\vec{k}
      $$

      La guía anula la componente vertical, y de ahí todo lo demás:

      $$
      \omega_{2/\pi} = -2\omega,
      \qquad
      \vec{\omega}_1 = 2\omega\,\vec{i} - \omega\,\vec{k},
      \qquad
      \vec{\omega}_2 = -2\omega\,\vec{i} - \omega\,\vec{k}
      $$

      $$
      \vec{v}_C = -\omega L\,\vec{i} + 4\omega L\,\vec{j},
      \qquad
      \vec{v}_{C/\pi} = \vec{v}_C - \left(-\omega L\,\vec{i}\right) = 4\omega L\,\vec{j}
      $$

      $$
      \vec{\alpha}_1 = -\omega\,\vec{k}\times 2\omega\,\vec{i} = -2\omega^{2}\,\vec{j},
      \qquad
      \vec{\alpha}_2 = -\omega\,\vec{k}\times\left(-2\omega\,\vec{i}\right) = 2\omega^{2}\,\vec{j}
      $$

      La barra 2 gira respecto del plano a $2\omega$ como la 1, pero en
      sentido horario. Los módulos: $\sqrt{5}\,\omega$ las dos velocidades
      angulares; $\omega L$, $2\sqrt{2}\,\omega L$ y $\sqrt{17}\,\omega L$ las
      velocidades de A, B y C; $4\omega L$ la de C vista desde el plano; y
      $2\omega^{2}$ las dos aceleraciones angulares.

      Con valores nuestros, $\omega = 2$ rad/s y $L = 0{,}5$ m:

      $$
      \vec{\omega}_1 = (4;\ 0;\ -2)\ \text{rad/s},
      \qquad
      \vec{v}_A = (1;\ 0;\ 0),
      \qquad
      \vec{v}_B = (0;\ 2;\ -2),
      \qquad
      \vec{v}_C = (-1;\ 4;\ 0)\ \text{m/s}
      $$

      $$
      \vec{v}_{C/\pi} = (0;\ 4;\ 0)\ \text{m/s},
      \qquad
      \vec{\alpha}_1 = (0;\ -8;\ 0),
      \qquad
      \vec{\alpha}_2 = (0;\ 8;\ 0)\ \text{rad/s}^{2}
      $$

      de módulos 4,472 rad/s, 1, 2,828 y 4,123 m/s, 4 m/s y 8 rad/s².

      **5. Comprobación.** La velocidad de C por composición de movimientos,
      que no se ha usado: primero todo dentro del plano, como si estuviera
      quieto, y después el arrastre. Respecto del plano, A está fija y la
      barra 1 gira a $2\omega\,\vec{i}$:

      $$
      \vec{v}_{B/\pi} = 2\omega\,\vec{i}\times(0;\ -L;\ -L) = 2\omega L\,\vec{j} - 2\omega L\,\vec{k}
      $$

      $$
      \vec{v}_{C/\pi} = \vec{v}_{B/\pi} + \omega_{2/\pi}\,\vec{i}\times(0;\ -L;\ L)
      = \left(2\omega L - \omega_{2/\pi}L\right)\vec{j} - \left(2\omega L + \omega_{2/\pi}L\right)\vec{k}
      $$

      La guía anula otra vez la vertical, $\omega_{2/\pi} = -2\omega$, y
      $\vec{v}_{C/\pi} = 4\omega L\,\vec{j}$. Con el arrastre de C,
      $-\omega\,\vec{k}\times(-L\,\vec{j}) = -\omega L\,\vec{i}$:

      $$
      \vec{v}_C = -\omega L\,\vec{i} + 4\omega L\,\vec{j}
      $$

      lo mismo que por el campo de velocidades. Por otro camino, fuera del
      alcance del examen —el mecanismo simulado, con el plano girando, la
      barra 1 girando dentro de él y C obligada a quedarse en la horizontal
      de A, y las posiciones y los ejes de la barra 1 derivados
      numéricamente—, salen 4,472 rad/s, 2,828 m/s, 4,123 m/s, 4 m/s y
      8 rad/s². Es también el ejercicio 7.13 de la colección, que publica
      $\vec{v}_A = \omega L\,\vec{i}$,
      $\vec{\omega}_2 = -2\omega\,\vec{i} - \omega\,\vec{k}$,
      $\vec{v}_C = -\omega L\,\vec{i} + 4\omega L\,\vec{j}$,
      $\vec{v}_{C/\pi} = 4\omega L\,\vec{j}$,
      $\vec{\alpha}_1 = -2\omega^{2}\,\vec{j}$ y
      $\vec{\alpha}_2 = 2\omega^{2}\,\vec{j}$: lo mismo.

      **Lo que dice el resultado.** Cada punto tiene una mezcla distinta: A
      solo arrastre, B solo movimiento relativo, porque está en el eje, y C
      las dos cosas. Y que todos los giros sean constantes no deja a las
      barras sin aceleración angular: el plano arrastra la dirección de los
      giros relativos, y las aceleraciones angulares salen horizontales, según
      $\vec{j}$, perpendiculares a la vez a $\vec{\omega}_\pi$ y a los giros
      relativos.

  # ── Ejercicio 2 (n 5) · la placa cuadrada soldada al eje. Palabra por
  #    palabra el 11.6 de la colección; la resolución se reutiliza, adaptada a
  #    los dos apartados de aquí.
  - id: exma1819-2c-5-la-placa-cuadrada-en-voladizo
    titulo: La placa cuadrada en voladizo, sus reacciones y su equilibrado
    fuente: >-
      Ejercicio 2 · Convocatoria ordinaria de mayo de 2019, bloque 2
      (Cinemática y dinámica) · Mecánica Aplicada, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Transcrito de la columna en castellano; «SI el eje»
      y «(1 puntos)» son del original, y la figura está redibujada con sus
      cotas. Es palabra por palabra el ejercicio 11.6 de la colección del tema
      11, y la resolución reutiliza la de allí, contrastada con su resultado
      publicado y con la resolución oficial del profesor; en el apartado b se
      publica lo que dan las cuentas y la resolución oficial, 675 mm y
      menos 975 mm, no lo que imprime la colección. El examen no publica
      resolución.
    nivel: examen
    antes:
      idea: |
        Un sólido que gira alrededor de un eje fijo carga sus apoyos con dos
        cosas: lo que haría falta con el eje parado, las reacciones estáticas,
        y lo que hace falta para que su centro de masas y su momento angular
        cambien como cambian, las dinámicas. Equilibrar es añadir masas para
        que la parte dinámica desaparezca.
      formula: |
        Las ecuaciones del movimiento de un sólido:

        $$
        \sum\vec{F} = m\,\vec{a}_G
        \qquad
        \sum\vec{M}_G = \dot{\vec{H}}_G
        $$

        Un punto que gira con ω constante a la distancia r del eje tiene una
        aceleración $\omega^{2}r$ hacia el eje. Y un rotor que gira alrededor
        del eje z está equilibrado cuando el centro de masas del conjunto está
        en el eje y los productos de inercia del conjunto con z son nulos:

        $$
        x_G = y_G = 0
        \qquad
        I_{xz} = I_{yz} = 0
        $$
      reconocer: |
        Antes de plantear se separa lo que haría falta con el eje parado de lo
        que añade el giro.
    enunciado: |
      **2. (3 puntos)** La figura muestra una placa cuadrada de 2 kg de masa
      soldada sobre un eje horizontal. SI el eje gira con velocidad angular
      positiva constante ω = 5 rad/s:

      **a)** Calcular las reacciones estáticas y dinámicas en los apoyos A y B
      para la posición mostrada. (2 puntos)

      **b)** Calcular las posiciones de dos masas M=1kg colocadas sobre los
      planos verticales Z=100 mm y Z=300 mm para conseguir el equilibrado del
      sistema. (1 puntos)

