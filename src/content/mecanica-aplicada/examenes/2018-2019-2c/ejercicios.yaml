        <text x="206" y="106" font-size="11" fill="var(--d1)">1,1 m/s</text>
        <text x="156" y="152" font-size="11" fill="var(--d1)">0,6 m/s</text>
        <text x="224" y="90" font-size="11" fill="var(--d1)">disco r</text>
