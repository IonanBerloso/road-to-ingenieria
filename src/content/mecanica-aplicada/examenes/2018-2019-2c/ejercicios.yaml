    pide: >-
      Las velocidades angulares de las dos barras, las velocidades de A, B y
      C, la velocidad de C vista desde el plano y las aceleraciones angulares
      de las dos barras.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué condición determina la velocidad angular de la barra 2?
        opciones:
          - texto: >-
              Que C solo pueda moverse a lo largo de la guía horizontal, dentro
              del plano
            correcta: true
            mensaje: |
              Eso es. La deslizadera obliga a que la velocidad de C no tenga
              componente vertical, y esa única ecuación fija el giro de la
              barra 2 respecto del plano, $\vec{\omega}_{2/\pi}$.
          - texto: >-
              Que la barra 2 gire a la misma velocidad que la 1, por ser de la
              misma longitud
            mensaje: |
              La longitud no impone eso. De hecho salen iguales en módulo pero
              **opuestas** en sentido respecto del plano, y eso es un resultado
              del cálculo, no una hipótesis.
          - texto: Que la velocidad de B sea nula
            mensaje: |
              B se mueve: es el extremo de la barra 1, que gira alrededor de A
              a 2ω dentro del plano. Que B esté sobre el eje de giro solo le
              quita la velocidad de arrastre, no la relativa.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna ecuación: **el plano visto de frente**, con
          las dos barras, **la dirección de las velocidades que se conocen** y
          **los giros de las barras respecto del plano**.
        comprueba:
          - punto: |
              **$\vec{v}_A$, perpendicular al plano: saliendo del papel.**
            porque: |
              A es un punto del plano, a L del eje: solo tiene el arrastre, y
              el plano gira alrededor de z en sentido horario visto desde
              arriba.
          - punto: |
              **Los giros de las barras respecto del plano, perpendiculares a
              él: $2\omega$ en la 1, antihorario, y $\omega_{2/\pi}$ en la 2,
              dibujado antihorario.**
            porque: |
              Las barras se quedan siempre en el plano: respecto de él solo
              pueden girar alrededor de su normal, x. El de la 2 es incógnita:
              se dibuja en el sentido positivo, y el cálculo dirá su sentido.
          - punto: |
              **$\vec{v}_B$, en el plano y perpendicular a AB.**
            porque: |
              B está sobre el eje z, y el giro del plano no lo mueve. Toda su
              velocidad es la de girar alrededor de A dentro del plano.
          - punto: |
              **$\vec{v}_{C/\pi}$, horizontal, a lo largo de la guía.**
            porque: |
              Respecto del plano, la deslizadera solo puede correr por la guía.
        figura: |
