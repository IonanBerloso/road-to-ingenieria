    pide: La distancia máxima x entre las medias esferas de abajo para que el conjunto esté en equilibrio.
    pasos:
      - tipo: reconocer
        pregunta: |
          Entre dos superficies esféricas lisas, ¿qué dirección tiene la fuerza
          de contacto?
        opciones:
          - texto: >-
              La de la recta que une los dos centros, porque es la normal común
              a las dos esferas en el punto de contacto
            correcta: true
            mensaje: |
              Eso es. Sin rozamiento solo hay fuerza normal, y la normal a una
              esfera pasa por su centro. Las dos líneas de trazos de la figura
              son justo esas direcciones, a un ángulo α de la vertical.
          - texto: La vertical, porque la esfera de arriba solo pesa
            mensaje: |
              Si la fuerza fuera vertical, las esferas de abajo no tendrían
              nada que las empujara hacia fuera y el rozamiento no haría falta.
              La fuerza va por la normal común, inclinada α, y tiene una
              componente horizontal que las separa.
          - texto: La horizontal, porque las esferas se empujan de lado
            mensaje: |
              Una fuerza horizontal no podría sostener el peso de la esfera de
              arriba. La normal común está inclinada: su componente vertical
              sostiene y la horizontal separa.

      - tipo: calcular
        titulo: El ángulo límite
        pregunta: |
          En el límite del deslizamiento, ¿cuánto vale $\tan\alpha$?
        respuesta:
          tipo: numero
          valor: '1.7333'
          tolerancia: 0.002
          formato: un número con cuatro decimales; vale la forma exacta, como 26/15
        distractores:
          - valor: '1.3333'
            mensaje: |
              Has tomado como normal del suelo solo el peso de la media esfera
              de abajo, 50 kg. La de arriba carga sobre ella la componente
              vertical de la fuerza de contacto, 15 kg: el suelo soporta 65 kg,
              y el rozamiento disponible es $0{,}4\cdot 65 = 26$.
          - valor: '0.4'
            mensaje: |
              Eso es el coeficiente de rozamiento. Sería la tangente del ángulo
              límite si la fuerza de contacto fuera la única que apretara contra
              el suelo; aquí el peso propio, 50 kg, también da rozamiento.
        pista: |
          Arriba: $2N\cos\alpha = 30g$. Abajo, en el límite:
          $N\sin\alpha = 0{,}4\,(50g + N\cos\alpha)$.
        desarrollo: |
          $$
          N\cos\alpha = 15g, \qquad 15g\tan\alpha = 0{,}4\,(50g + 15g) = 26g
          \quad\Longrightarrow\quad \tan\alpha = \frac{26}{15} \approx 1{,}7333
          $$

      - tipo: calcular
        titulo: La distancia máxima
        pregunta: |
          ¿Cuánto vale la distancia máxima x, en cm?
        respuesta:
          tipo: magnitud
          valor: '22.37 cm'
          tolerancia: 0.005
          formato: con su unidad, en cm
        distractores:
          - valor: '62.37 cm'
            mensaje: |
              Es la distancia entre los **centros** de las medias esferas de
              abajo, $2\cdot 36\sin\alpha$. La x de la figura es la separación
              entre sus bordes: hay que restarle los dos radios de 20 cm.
          - valor: '17.6 cm'
            mensaje: |
              Es la x que sale con $\tan\alpha = 4/3$, dejando fuera los 15 kg
              que la esfera de arriba carga sobre cada una de las de abajo. Con
              esa carga el suelo agarra más y la x máxima es mayor.
        pista: |
          La distancia entre los centros de arriba y de abajo es la suma de los
          radios, 36 cm. Los centros de abajo están a $2\cdot 36\sin\alpha$, y x
          es eso menos $2\cdot 20$.
        desarrollo: |
          $$
          \sin\alpha = \frac{26}{\sqrt{26^{2} + 15^{2}}} \approx 0{,}8662,
          \qquad
          x = 72\sin\alpha - 40 \approx 22{,}37\ \text{cm}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Sin rozamiento entre esferas, la fuerza de contacto va por la recta
              de los centros, a un ángulo α de la vertical.
          - texto: >-
              Equilibrio de la de arriba: $2N\cos\alpha = 30g$, así que cada
              contacto carga 15g en vertical.
          - texto: >-
              Cada una de abajo, en el límite: $N\sin\alpha = 0{,}4\,(50g + 15g)$,
              y $\tan\alpha = 26/15$.
          - texto: >-
              Los centros distan 36 cm, así que $x = 72\sin\alpha - 40 \approx 22{,}4$ cm.
          - texto: >-
              La media esfera de abajo también puede volcar, y eso limita x
              antes que el deslizamiento.
            trampa: true
            mensaje: |
              No puede volcar: la fuerza de contacto pasa por su centro, que está
              en el suelo, en el centro de su cara plana, y su peso también. Ni
              una ni otro dan momento respecto de ese punto, así que la reacción
              del suelo queda centrada. Lo que limita x es el deslizamiento.
    resolucion: |
      **La fuerza de contacto.** Entre las medias esferas no hay rozamiento, así
      que la fuerza que se hacen es normal a las dos superficies en el punto de
      contacto: va por la recta que une sus centros. El centro de la de arriba
      está en su cara plana y los de abajo en el suelo, y esas rectas forman un
      ángulo α con la vertical. Su longitud es la suma de los radios,
      $20 + 16 = 36$ cm.

      **La media esfera de arriba** (30 kg) se apoya en las dos de abajo con la
      misma fuerza N, por simetría:

      $$
      2N\cos\alpha = 30g \quad\Longrightarrow\quad N\cos\alpha = 15g
      $$

      **Cada media esfera de abajo** (50 kg) recibe N por la recta de los
      centros, empujándola hacia fuera y hacia abajo. La normal del suelo es
      $50g + N\cos\alpha = 65g$, y el rozamiento tiene que equilibrar
      $N\sin\alpha = 15g\tan\alpha$. En el límite del deslizamiento:

      $$
      15g\tan\alpha = 0{,}4\cdot 65g = 26g
      \quad\Longrightarrow\quad
      \tan\alpha = \frac{26}{15},\quad \sin\alpha \approx 0{,}8662
      $$

      No hay vuelco: la fuerza de contacto pasa por el centro de la media
      esfera de abajo, que está en el suelo en el centro de su cara plana, y su
      peso también. La reacción del suelo queda centrada y lo único que limita
      es el deslizamiento.

      **La distancia.** Los centros de abajo están separados
      $2\cdot 36\sin\alpha$, y la x de la figura es la separación entre los
      bordes, dos radios menos:

      $$
      x_{\max} = 72\sin\alpha - 40 \approx 62{,}37 - 40 = 22{,}37\ \text{cm}
      $$

      **Comprobación de la figura.** En esa posición el centro de la de arriba
      está a $36\cos\alpha \approx 18{,}0$ cm del suelo, y su punto más bajo, a
      unos 2 cm: no toca el suelo, así que no hay una cuarta fuerza que añadir.
      Y resolviendo el equilibrio de las tres piezas numéricamente para esa x,
      el rozamiento pedido es justo el 40 % de la normal.
