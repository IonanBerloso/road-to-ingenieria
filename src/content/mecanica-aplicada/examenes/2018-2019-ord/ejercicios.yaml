    pide: >-
      Las reacciones en A y C, los diagramas de cortantes y flectores, y las
      tensiones normal y tangencial máximas con su sección y su punto.
    pasos:
      - tipo: reconocer
        pregunta: |
          La viga está empotrada en A y apoyada en C: son cuatro reacciones
          (dos fuerzas verticales, una horizontal y el momento del
          empotramiento) y solo tres ecuaciones de equilibrio. ¿De dónde sale la
          que falta?
        opciones:
          - texto: >-
              De la rótula: el momento flector en B es nulo, así que el tramo
              BCD por separado tiene que estar en equilibrio de momentos
              respecto de B
            correcta: true
            mensaje: |
              Eso es. La rótula no transmite momento, y eso es una ecuación
              más. Tomando momentos en B sobre BCD sale $R_C$ sin saber nada de
              A, y el resto viene detrás.
          - texto: >-
              De la carga repartida, que se sustituye por su resultante en el
              centro de CD
            mensaje: |
              Sustituir la repartida por su resultante sirve para el
              equilibrio, pero no añade ninguna ecuación: sigue habiendo cuatro
              incógnitas. La que falta la da la rótula.
          - texto: >-
              De ninguna parte: la viga es hiperestática y hacen falta las
              deformaciones
            mensaje: |
              Sin la rótula lo sería. La rótula libera el momento en B y deja
              la viga isostática: cuatro incógnitas y cuatro ecuaciones.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna ecuación: **la viga entera sin los
          apoyos** y, al lado, **la misma viga partida por la rótula**.
        comprueba:
          - punto: |
              **En A, $A_x$, $A_y$ y el momento $M_A$; en C, $R_C$.**
            porque: |
              A es un empotramiento: impide moverse y girar. C es un apoyo
              móvil, que solo empuja en vertical.
          - punto: |
              **Partida por B: en cada trozo, $B_x$ y $B_y$, contrarios en uno y
              otro, y ningún par.**
            porque: |
              Es una rótula: lo que un trozo le hace al otro es una fuerza, sin
              momento.
          - punto: |
              **La carga repartida, solo sobre CD.**
            porque: |
              Es el voladizo del enunciado: entre A y C no hay carga.
