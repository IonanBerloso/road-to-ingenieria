        <text x="444" y="143" font-size="9.5" font-style="italic" fill="var(--ink)">x</text>
        <text x="406" y="112" font-size="9.5" font-style="italic" text-anchor="end" fill="var(--ink)">y</text>
        <path d="M477.5 131.5 A11 11 0 1 0 457.7 129.8" fill="none" stroke="var(--ink)" stroke-width="1" marker-end="url(#dsl-fe)"/>
        <text x="483" y="118" font-size="10" fill="var(--ink)">+</text>
      </svg>
      <figcaption>

      a) La viga entera: cuatro incógnitas, Ax, Ay, MA y RC, y tres ecuaciones. b) Partida por la rótula, que transmite fuerza pero no momento: en B, dos componentes y ningún par, con sentidos contrarios en cada trozo. Cada trozo da sus tres ecuaciones. Ejes: x hacia la derecha, y hacia arriba; momentos positivos en sentido antihorario.

      </figcaption>
      </figure>

      - **La viga entera** tiene cuatro incógnitas, $A_x$, $A_y$, $M_A$ y
        $R_C$, y solo tres ecuaciones.
      - **La rótula** da la que falta. No transmite momento: partida por B,
        cada trozo está en equilibrio con una fuerza en B y ningún par. En
        particular, los momentos del tramo BCD respecto de B tienen que sumar
        cero, y en esa ecuación no entra nada de A.

      **2. Incógnitas.** $A_x$, $A_y$, $M_A$ y $R_C$, y la fuerza de la
      rótula, $B_x$ y $B_y$; el cortante y el flector a lo largo de la viga; y
      las tensiones máximas.

      **3. Ecuaciones.** El tramo BCD, con $B_x$ hacia la derecha y $B_y$ hacia
      abajo, como en la figura, y la resultante de la repartida,
      $40\cdot 1 = 40$ kN, a 1,5 m de B:

      $$
      B_x = 0,
      \qquad
      -B_y + R_C - 40 = 0,
      \qquad
      R_C\cdot 1 - 40\cdot 1{,}5 = 0
      $$

      El tramo AB, con lo contrario en B y momentos respecto de A:

      $$
      A_x - B_x = 0,
      \qquad
      A_y + B_y = 0,
      \qquad
      M_A + B_y\cdot 1 = 0
      $$

      Los esfuerzos, con x desde A en metros, salen del trozo a la izquierda
      de cada sección, con $dV/dx = -q$ y $dM/dx = V$. Y las tensiones, con la
      sección de $b = 60$ mm por $h = 100$ mm: $A = 6000$ mm²,
      $W = b\,h^{2}/6 = 10^{5}$ mm³, $\sigma_{\max} = |M|_{\max}/W$ y
      $\tau_{\max} = \tfrac{3}{2}\,|V|_{\max}/A$.

      **4. Resultados.** a) Las reacciones:

      $$
      R_C = 60\ \text{kN},
      \qquad
      B_y = 20\ \text{kN},
      \qquad
      A_y = -20\ \text{kN},
      \qquad
      M_A = -20\ \text{kN·m},
      \qquad
      A_x = B_x = 0
      $$

      $$
      \vec{F}_A = -20\,\vec{\jmath}\ \text{kN},
      \qquad
      \vec{M}_A = -20\,\vec{k}\ \text{kN·m},
      \qquad
      \vec{F}_C = 60\,\vec{\jmath}\ \text{kN}
      $$

      La rótula tira de BCD hacia abajo con 20 kN y empuja AB hacia arriba con
      otros tantos. En A, 20 kN hacia abajo y 20 kN·m en sentido horario.

      b) Los diagramas:

      - $0 \le x < 2$: $V = -20$ kN y $M = 20 - 20x$ kN·m: vale +20 en A, 0 en
        B —la rótula— y −20 en C.
      - $2 < x \le 3$: $V = 40 - 40(x - 2)$ kN, de +40 a la derecha de C a 0 en
        D, y $M = -20\,(3 - x)^{2}$ kN·m, de −20 en C a 0 en D.

      <figure class="figura-examen">
      <svg viewBox="0 0 440 250" role="img" width="440" height="250"
