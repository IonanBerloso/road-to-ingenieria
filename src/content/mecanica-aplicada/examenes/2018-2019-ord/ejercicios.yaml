  # ── Ejercicio 2 (n 5) · tres medias esferas: la de arriba, lisa, apoyada
  #    en las dos de abajo, que rozan con el suelo.
  - id: exma1819-ord-5-las-medias-esferas-que-no-deben-resbalar
    titulo: Las medias esferas que no deben resbalar
    fuente: >-
      Ejercicio 2 · Convocatoria ordinaria de mayo de 2019, bloque 1
      (Estática) · Mecánica Aplicada, Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU). Transcrito de la columna en castellano; «Cual» sin tilde es
      del original, y la figura está redibujada con sus cotas. x es la
      separación entre los bordes de las dos medias esferas de abajo, como la
      acota la figura. El examen no publica resolución; el desarrollo es
      nuestro.
    nivel: examen
    enunciado: |
      **2. (2,5 puntos)** Las medias esferas de la figura tienen un
      coeficiente de rozamiento estático μs=0,4 respecto del plano horizontal.
      En el contacto entre las medias esferas no hay rozamiento (μs=0). Cual
      es la distancia x máxima para mantener el equilibrio de la figura?

