ejercicios:
  # ── Cuestión 1 de teoría (n 1) · la catenaria desde y'' = q/T₀. Es una
  #    deducción: se escribe con `redactar`, y las cuentas de comprobación
  #    usan x = c, valor nuestro y dicho en la pregunta.
  - id: exma1819-ord-1-la-catenaria-desde-su-ecuacion-diferencial
    titulo: La catenaria y su tensión, desde la ecuación diferencial del cable
    fuente: >-
      Cuestión 1 de teoría · Convocatoria ordinaria de mayo de 2019, bloque 1
      (Estática) · Mecánica Aplicada, Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU). Transcrita de la columna en castellano, que en el PDF va como
      imagen; la coma final es del original. El examen no publica resolución;
      el desarrollo es nuestro.
    nivel: examen
    enunciado: |
      **1. (2 puntos)** Obtener de forma razonada la ecuación del cable
      sometido a su propio peso (catenaria) y la expresión de la fuerza del
      cable T en cualquier punto, sabiendo que la ecuación diferencial del
      cable es

      $$
      \frac{d^{2}y}{dx^{2}} = \frac{q(x)}{T_0}
      $$

      siendo q(x) la carga distribuida por unidad de abscisa y T₀ la tensión
      en el punto más bajo del cable,
    pide: >-
      La ecuación de la catenaria y la tensión del cable en un punto
      cualquiera, deducidas desde la ecuación diferencial.
    pasos:
      - tipo: reconocer
        pregunta: |
          El peso propio va por unidad de longitud de **cable**, $w$. ¿Qué es
          entonces $q(x)$, la carga por unidad de **abscisa**?
        opciones:
          - texto: >-
              $q = w\,\dfrac{ds}{dx} = w\sqrt{1 + y'^{2}}$: el peso de un trozo
              de cable repartido sobre lo que ocupa en horizontal
            correcta: true
            mensaje: |
              Eso es, y es todo el truco de la cuestión: un trozo de cable de
              longitud $ds$ pesa $w\,ds$ y ocupa $dx$ en horizontal. Con eso la
              ecuación queda $y'' = \tfrac{w}{T_0}\sqrt{1 + y'^{2}}$, que se
              integra separando variables.
          - texto: $q = w$, porque el cable pesa lo mismo en todas partes
            mensaje: |
              Con $q = w$ la ecuación da $y = \tfrac{w}{2T_0}x^{2}$: una
              **parábola**, que es el cable que soporta una carga uniforme por
              unidad de abscisa, como un puente colgante. El peso propio va por
              unidad de longitud de cable, y donde el cable se inclina hay más
              cable por cada metro de abscisa.
          - texto: $q = w\cos\theta$, la componente del peso perpendicular al cable
            mensaje: |
              La ecuación $y'' = q/T_0$ ya está escrita con la carga **vertical**
              por unidad de abscisa: no hay que descomponer el peso. Lo que
              cambia es cuánto cable cabe en cada $dx$.

      - tipo: redactar
        que: deduccion
        consigna: |
          En papel, como lo entregarías: **integra la ecuación diferencial
          hasta la ecuación de la catenaria y deduce la tensión en un punto
          cualquiera**, terminando en $T$ en función de $y$. Media cara.
        rubrica:
          - punto: |
              **La carga por unidad de abscisa.** $q = w\,ds/dx = w\sqrt{1 + y'^{2}}$,
              y con ella $y'' = \dfrac{1}{c}\sqrt{1 + y'^{2}}$, donde
              $c = T_0/w$.
            porque: |
              Es el paso que convierte el enunciado en el problema de la
              catenaria. Quien pone $q = w$ resuelve otro cable, el de la
              parábola, y todo lo que sigue sale bien hecho y equivocado.
          - punto: |
              **Separar variables con $p = y'$.** $\dfrac{dp}{\sqrt{1 + p^{2}}} = \dfrac{dx}{c}$,
              e integrar desde el punto más bajo, donde $p = 0$:
              $\operatorname{argsh} p = x/c$, es decir, $y' = \sinh(x/c)$.
            porque: |
              La constante de integración no se pone por costumbre: sale de que
              en el punto más bajo el cable es horizontal. Decirlo es la
              diferencia entre integrar y recordar.
          - punto: |
              **Integrar otra vez y elegir el origen.**
              $y = c\cosh(x/c)$, tomando el eje de abscisas a una distancia $c$
              por debajo del punto más bajo (la directriz).
            porque: |
              La segunda constante es una traslación vertical, y elegirla así
              es lo que deja la tensión en la forma limpia $T = wy$. Hay que
              decir qué origen se ha tomado.
          - punto: |
              **La tensión.** La componente horizontal es $T_0$ en todo el cable,
              así que $T = T_0/\cos\theta = T_0\sqrt{1 + y'^{2}} = T_0\cosh(x/c) = wy$.
            porque: |
              Es la segunda mitad de la pregunta, y la que más cae en los
              ejercicios: la tensión crece con la altura, mínima abajo y
              máxima en el amarre más alto.

      - tipo: calcular
        titulo: La pendiente a una distancia c del punto más bajo
        pregunta: |
          Comprobación con números: en el punto de abscisa $x = c$, ¿cuánto
          vale la pendiente $y'$ del cable?
        respuesta:
          tipo: numero
          valor: '1.1752'
          tolerancia: 0.002
          formato: un número con cuatro decimales
        distractores:
          - valor: '1'
            mensaje: |
              Eso es $x/c$, la pendiente de la **parábola** $y = x^{2}/(2c)$: lo
              que sale con $q = w$. La catenaria se levanta más deprisa, porque
              cuanto más inclinada, más cable carga cada metro de abscisa.
          - valor: '1.5431'
            mensaje: |
              Eso es $\cosh 1$, la ordenada $y/c$ del punto y también $T/T_0$.
              La pendiente es la derivada de $c\cosh(x/c)$, que es el seno
              hiperbólico.
        pista: |
          De la primera integración, $y' = \sinh(x/c)$.
        desarrollo: |
          $$
          y'(c) = \sinh 1 = \frac{e - e^{-1}}{2} \approx 1{,}1752
          $$

      - tipo: calcular
        titulo: La tensión en ese mismo punto
        pregunta: |
          Y en $x = c$, ¿cuánto vale la tensión en unidades de $T_0$?
        respuesta:
          tipo: numero
          valor: '1.5431'
          tolerancia: 0.002
          formato: un número con cuatro decimales
        distractores:
          - valor: '1'
            mensaje: |
              Eso es la tensión del punto más bajo. En $x = c$ la componente
              horizontal sigue siendo $T_0$, pero el cable está inclinado y la
              tensión, que va a lo largo del cable, es mayor.
          - valor: '1.1752'
            mensaje: |
              Eso es la componente **vertical** partida por $T_0$, que vale lo
              mismo que la pendiente. La tensión compone las dos:
              $\sqrt{1 + \sinh^{2}1} = \cosh 1$.
        pista: |
          $T = T_0\sqrt{1 + y'^{2}} = T_0\cosh(x/c)$.
        desarrollo: |
          $$
          \frac{T}{T_0} = \sqrt{1 + \sinh^{2}1} = \cosh 1 \approx 1{,}5431
          $$

          Y coincide con $y/c$ en ese punto, que es la forma $T = wy$.

      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              El peso va por unidad de longitud de cable, así que
              $q = w\sqrt{1 + y'^{2}}$ y la ecuación queda
              $y'' = \tfrac{1}{c}\sqrt{1 + y'^{2}}$, con $c = T_0/w$.
          - texto: >-
              Con $p = y'$ se separan variables, y como el cable es horizontal
              en el punto más bajo, $y' = \sinh(x/c)$.
          - texto: >-
              Integrando otra vez, con el origen en la directriz,
              $y = c\cosh(x/c)$.
          - texto: >-
              La componente horizontal de la tensión es $T_0$ en todo el cable,
              así que $T = T_0\cosh(x/c) = wy$.
          - texto: >-
              Como el cable pesa $w$ por metro, $q = w$ y la curva es
              $y = x^{2}/(2c)$.
            trampa: true
            mensaje: |
              Esa es la curva de un cable con carga uniforme **por unidad de
              abscisa**, la parábola. El peso propio va por metro de cable, y
              en un tramo inclinado hay más de un metro de cable por cada metro
              de abscisa: $q = w\,ds/dx$.
    resolucion: |
      **La carga por unidad de abscisa.** El cable pesa $w$ por unidad de
      longitud de cable. Un trozo de longitud $ds$ pesa $w\,ds$ y ocupa $dx$ en
      horizontal, así que

      $$
      q(x) = w\,\frac{ds}{dx} = w\sqrt{1 + y'^{2}}
      \qquad\Longrightarrow\qquad
      y'' = \frac{1}{c}\sqrt{1 + y'^{2}}, \quad c = \frac{T_0}{w}
      $$

      **Primera integración.** Con $p = y'$:

      $$
      \frac{dp}{\sqrt{1 + p^{2}}} = \frac{dx}{c}
      \quad\Longrightarrow\quad
      \operatorname{argsh} p = \frac{x}{c}
      $$

      donde la constante es nula porque en el punto más bajo, $x = 0$, el
      cable es horizontal. Así que $y' = \sinh(x/c)$.

      **Segunda integración.**

      $$
      y = c\cosh\left(\frac{x}{c}\right)
      $$

      tomando el eje de abscisas a una distancia $c$ por debajo del punto más
      bajo, que es la directriz de la catenaria.

      **La tensión.** Aislando un tramo desde el punto más bajo, la componente
      horizontal de la tensión es $T_0$ en todo el cable, porque sobre el tramo
      solo actúan fuerzas verticales además de las dos tensiones de sus
      extremos. La tensión va a lo largo del cable, y su componente horizontal
      es $T\cos\theta$, con $\tan\theta = y'$:

      $$
      T = \frac{T_0}{\cos\theta} = T_0\sqrt{1 + y'^{2}}
      = T_0\cosh\left(\frac{x}{c}\right) = w\,y
      $$

      **Lectura.** La tensión es proporcional a la ordenada medida desde la
      directriz: mínima en el punto más bajo, $T_0$, y máxima en el amarre más
      alto.

      **Comprobación con números.** En $x = c$, la pendiente es
      $\sinh 1 \approx 1{,}1752$ y la tensión $\cosh 1 \approx 1{,}5431$ veces
      $T_0$; integrando numéricamente la ecuación diferencial desde el punto
      más bajo sale lo mismo.

  # ── Cuestión 2 de teoría (n 2) · el virial. El enunciado solo pide la
  #    definición; la cuenta de comprobación usa un vector nuestro, dicho en
  #    la pregunta.
  - id: exma1819-ord-2-el-virial-de-un-vector
    titulo: El virial de un vector ligado
    fuente: >-
      Cuestión 2 de teoría · Convocatoria ordinaria de mayo de 2019, bloque 1
      (Estática) · Mecánica Aplicada, Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU). Transcrita de la columna en castellano; la minúscula inicial y
      el «que» sin tilde son del original. El examen no publica resolución; el
      desarrollo es nuestro.
    nivel: examen
    enunciado: |
      **2. (0,5 puntos)** definir brevemente que es el virial de un vector
      $\vec{v}_i$ respecto al punto O.
    pide: La definición del virial de un vector respecto de un punto.
    pasos:
      - tipo: reconocer
        pregunta: |
          El virial de un vector ligado $\vec{v}_i$, aplicado en un punto
          $P_i$, respecto de O, ¿qué es?
        opciones:
          - texto: >-
              El producto escalar $\overrightarrow{OP_i}\cdot\vec{v}_i$: un
              número
            correcta: true
            mensaje: |
              Eso es. Depende del punto de aplicación, por eso solo tiene
              sentido para vectores ligados, y del punto O que se elija. Para
              un sistema de vectores, el virial es la suma de los de cada uno.
          - texto: >-
              El producto vectorial $\overrightarrow{OP_i}\times\vec{v}_i$
            mensaje: |
              Eso es el **momento** de $\vec{v}_i$ respecto de O, que es un
              vector. El virial es su pariente escalar: el mismo
              $\overrightarrow{OP_i}$, pero multiplicado escalarmente.
          - texto: >-
              La proyección de $\vec{v}_i$ sobre la recta OP$_i$
            mensaje: |
              Casi: esa proyección, multiplicada por la distancia OP$_i$, es el
              virial. Sola es un número con unidades de $\vec{v}_i$, y el virial
              lleva además las de longitud.

      - tipo: redactar
        que: definicion
        consigna: |
          En papel, como lo entregarías: **define el virial de un vector
          respecto de un punto** en tres o cuatro líneas, con su fórmula y lo
          que lo separa del momento.
        rubrica:
          - punto: |
              **La fórmula, con su punto de aplicación.**
              $Q_O = \overrightarrow{OP_i}\cdot\vec{v}_i$, con $P_i$ el punto
              donde está aplicado $\vec{v}_i$.
            porque: |
              Sin el punto de aplicación la definición no se sostiene: el
              virial solo existe para vectores ligados, y decir de dónde sale
              el vector de posición es decir por qué.
          - punto: |
              **Que es un escalar.** El producto es escalar, no vectorial.
            porque: |
              Es la confusión que la pregunta busca: el mismo
              $\overrightarrow{OP_i}$ multiplicado vectorialmente da el momento,
              que es un vector y es otra magnitud.
          - punto: |
              **Que depende del punto O, y que se suma.** Cambiar de punto
              cambia el virial, y el de un sistema de vectores es la suma de
              los de cada uno.
            porque: |
              Con eso la definición queda entera: el virial es de un vector y
              de un punto, igual que el momento, y para un sistema se suma.

      - tipo: calcular
        titulo: Un virial con números
        pregunta: |
          Comprobación con valores nuestros: el vector
          $\vec{v} = (2,\,-1,\,3)$ está aplicado en $P = (1,\,2,\,1)$. ¿Cuánto
          vale su virial respecto del origen?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '8.66'
            mensaje: |
              Eso es el módulo de $\overrightarrow{OP}\times\vec{v} = (7,\,-1,\,-5)$,
              el momento. El virial es el producto **escalar**, y es un número
              con signo.
          - valor: '-3'
            mensaje: |
              Has tomado el vector de P a O. El virial respecto de O se hace con
              $\overrightarrow{OP}$, el que va de O al punto de aplicación.
        pista: |
          $\overrightarrow{OP}\cdot\vec{v} = x\,v_x + y\,v_y + z\,v_z$.
        desarrollo: |
          $$
          \overrightarrow{OP}\cdot\vec{v} = 1\cdot 2 + 2\cdot(-1) + 1\cdot 3 = 3
          $$

      - tipo: justificar
        pregunta: Ordena lo que hay que decir del virial. Una pieza es falsa.
        piezas:
          - texto: >-
              El virial de $\vec{v}_i$ respecto de O es
              $\overrightarrow{OP_i}\cdot\vec{v}_i$, con $P_i$ su punto de
              aplicación.
          - texto: >-
              Es un escalar, y depende del punto de aplicación y del punto O
              elegido.
          - texto: >-
              Para un sistema de vectores ligados, el virial es la suma de los
              viriales de cada uno.
          - texto: >-
              Es el momento de $\vec{v}_i$ respecto de O, escrito como número.
            trampa: true
            mensaje: |
              El momento es $\overrightarrow{OP_i}\times\vec{v}_i$, un vector,
              y no se convierte en el virial tomando su módulo: el virial es
              el producto escalar, que puede ser negativo o nulo aunque el
              momento no lo sea.
    resolucion: |
      **El virial** de un vector ligado $\vec{v}_i$, aplicado en el punto
      $P_i$, respecto de un punto O es el producto escalar

      $$
      Q_O = \overrightarrow{OP_i}\cdot\vec{v}_i
      $$

      Es un **escalar**, y depende del punto de aplicación —por eso solo tiene
      sentido para vectores ligados— y del punto O. Para un sistema de
      vectores ligados, el virial respecto de O es la suma de los viriales de
      cada uno. No hay que confundirlo con el momento,
      $\overrightarrow{OP_i}\times\vec{v}_i$, que es un vector.

      **Con números.** Para $\vec{v} = (2,\,-1,\,3)$ aplicado en
      $P = (1,\,2,\,1)$, el virial respecto del origen es
      $1\cdot 2 + 2\cdot(-1) + 1\cdot 3 = 3$.

  # ── Cuestión 3 de teoría (n 3) · el momento de inercia del medio disco,
  #    respecto de su diámetro y respecto del eje paralelo por G.
  - id: exma1819-ord-3-el-momento-de-inercia-del-medio-disco
    titulo: El momento de inercia del medio disco, por integración y con Steiner
    fuente: >-
      Cuestión 3 de teoría · Convocatoria ordinaria de mayo de 2019, bloque 1
      (Estática) · Mecánica Aplicada, Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU). Transcrita de la columna en castellano. El examen no publica
      resolución; el desarrollo es nuestro.
    nivel: examen
    enunciado: |
      **3. (1,5 puntos)** Calcular el momento de inercia de medio disco de
      masa M y radio R, sabiendo que su densidad y su espesor son homogéneos,
      en los siguientes casos:

      **a)** Respecto del eje X de la figura, por integración directa.

      **b)** Respecto del eje X′ que pasa por su centro de gravedad G situado
      a una distancia $y_G = 4R/3\pi$ y que es paralelo a X.

      <figure class="figura-examen">
      <svg viewBox="0 0 300 150" role="img" width="300" height="150"
           aria-labelledby="ma1819o3t ma1819o3d">
        <title id="ma1819o3t">El medio disco con los ejes X y X′</title>
        <desc id="ma1819o3d">Un medio disco rayado, con el diámetro sobre el
        eje X, horizontal. Un poco por encima, el eje X′, paralelo a X, pasa por
        el centro de gravedad G del medio disco.</desc>
        <path d="M40 120 A70 70 0 0 1 180 120 Z" fill="var(--faint)" fill-opacity=".18"
              stroke="var(--ink)" stroke-width="1.6"/>
        <path d="M58 120 L92 58 M76 120 L118 50 M94 120 L140 52 M112 120 L156 64 M130 120 L168 84 M148 120 L176 104"
              fill="none" stroke="var(--faint)" stroke-width="1"/>
        <line x1="30" y1="120" x2="260" y2="120" stroke="var(--ink)" stroke-width="1.4"/>
        <polygon points="268,120 258,115.5 258,124.5" fill="var(--ink)"/>
        <text x="270" y="138" text-anchor="end" font-size="13" font-style="italic" fill="var(--ink)">X</text>
        <line x1="30" y1="90.3" x2="260" y2="90.3" stroke="var(--d2)" stroke-width="1.2" stroke-dasharray="5 3"/>
        <polygon points="268,90.3 258,85.8 258,94.8" fill="var(--d2)"/>
        <text x="270" y="82" text-anchor="end" font-size="13" font-style="italic" fill="var(--d2-tinta)">X′</text>
        <circle cx="110" cy="90.3" r="3" fill="var(--ink)"/>
        <text x="116" y="84" font-size="13" font-weight="bold" fill="var(--ink)">G</text>
      </svg>
      </figure>
    pide: >-
      El momento de inercia respecto del diámetro, por integración, y el
      momento respecto del eje paralelo por el centro de gravedad.
    pasos:
      - tipo: reconocer
        pregunta: |
          Para integrar $I_X = \int y^{2}\,dm$ sobre el medio disco, ¿qué
          elemento de masa conviene?
        opciones:
          - texto: >-
              Coordenadas polares: $dm = \sigma\,r\,dr\,d\theta$ con
              $y = r\sin\theta$, $r$ de 0 a R y $\theta$ de 0 a $\pi$
            correcta: true
            mensaje: |
              Eso es: con polares los límites son constantes y la integral se
              separa en dos factores, $\int_0^{R} r^{3}dr$ y
              $\int_0^{\pi}\sin^{2}\theta\,d\theta$. La densidad superficial es
              la masa entre el área, $\sigma = 2M/(\pi R^{2})$.
          - texto: >-
              Anillos concéntricos, $dm = \sigma\,\pi r\,dr$, cada uno con
              $y = r$
            mensaje: |
              Un medio anillo no tiene todos sus puntos a la misma distancia
              del eje X: su punto más alto está a $r$ y sus extremos, sobre el
              propio eje. Los anillos sirven para el momento **polar**, respecto
              del eje perpendicular por el centro, no para este.
          - texto: >-
              Tiras verticales de anchura $dx$, cada una con su masa a la altura
              de G
            mensaje: |
              Una tira vertical va del eje X hasta el borde: sus puntos están a
              todas las alturas entre 0 y $\sqrt{R^{2} - x^{2}}$. Se puede hacer
              con tiras, pero cada una aporta $\sigma\,dx\,h^{3}/3$, no su masa
              por una altura fija.

      - tipo: redactar
        que: deduccion
        consigna: |
          En papel, como lo entregarías: **integra el momento de inercia del
          medio disco respecto de su diámetro y bájalo después al eje paralelo
          por G**, diciendo en cada paso de dónde sale. Media cara.
        rubrica:
          - punto: |
              **La densidad superficial.**
              $\sigma = M/(\pi R^{2}/2) = 2M/(\pi R^{2})$, con el área del medio
              disco y no la del disco entero.
            porque: |
              Es donde se pierde el factor 2: con $\sigma = M/(\pi R^{2})$ todo
              lo que sigue sale bien integrado y vale la mitad de lo que es.
          - punto: |
              **El elemento y su distancia al eje, en polares.**
              $dm = \sigma\,r\,dr\,d\theta$ e $y = r\sin\theta$, con $r$ de 0 a
              R y $\theta$ de 0 a $\pi$.
            porque: |
              El factor $r$ del elemento de área es el que convierte $r^{2}$ en
              $r^{3}$ en la integral radial, y los límites de $\theta$ son los
              que dicen que es medio disco. Los dos se escriben, no se suponen.
          - punto: |
              **La integral, separada en dos.**
              $I_X = \sigma\int_0^{\pi}\sin^{2}\theta\,d\theta\int_0^{R} r^{3}\,dr = MR^{2}/4$.
            porque: |
              Separar la angular de la radial deja la cuenta a la vista, y el
              resultado se contrasta con el del disco entero respecto de un
              diámetro, que es el mismo por unidad de masa.
          - punto: |
              **Steiner, restando.** $I_{X'} = I_X - M\,y_G^{2}$, con
              $y_G = 4R/(3\pi)$, porque es $X'$ el eje que pasa por G.
            porque: |
              Steiner suma al alejarse de G. Aquí se va hacia G, así que se
              resta; sumar da un eje por G con más momento que el diámetro, y
              eso es imposible porque el de G es el mínimo de todos los
              paralelos.

      - tipo: calcular
        titulo: El momento respecto del eje X
        pregunta: |
          ¿Cuánto vale $I_X$, en unidades de $MR^{2}$?
        respuesta:
          tipo: numero
          valor: '0.25'
          tolerancia: 0.001
          formato: un número, en unidades de MR²; vale la forma exacta, como 1/4
        distractores:
          - valor: '0.5'
            mensaje: |
              Eso es el momento **polar**, respecto del eje perpendicular al
              disco por el centro. Respecto de un diámetro es la mitad: por el
              teorema de los ejes perpendiculares, $I_X + I_Y = I_O$, y por
              simetría $I_X = I_Y$.
          - valor: '0.125'
            mensaje: |
              Has partido entre dos el del disco entero, $MR^{2}/4$. Pero la M
              del enunciado ya es la masa del **medio** disco: con la misma
              densidad, medio disco tiene la mitad de masa y la mitad de
              momento, y $I_X/(MR^{2})$ sigue valiendo 1/4.
        pista: |
          $I_X = \sigma\int_0^{\pi}\!\int_0^{R} r^{2}\sin^{2}\theta\; r\,dr\,d\theta$,
          con $\sigma = 2M/(\pi R^{2})$.
        desarrollo: |
          $$
          I_X = \frac{2M}{\pi R^{2}}\cdot\frac{R^{4}}{4}\cdot\frac{\pi}{2} = \frac{MR^{2}}{4}
          $$

      - tipo: calcular
        titulo: El momento respecto del eje X′
        pregunta: |
          ¿Cuánto vale $I_{X'}$, en unidades de $MR^{2}$?
        respuesta:
          tipo: numero
          valor: '0.0699'
          tolerancia: 0.0005
          formato: un número con cuatro decimales, en unidades de MR²
        distractores:
          - valor: '0.4301'
            mensaje: |
              Has **sumado** el término de Steiner. El eje por el centro de
              gravedad es el de momento mínimo de todos los paralelos: para ir
              de X a X′ se resta, $I_{X'} = I_X - M\,y_G^{2}$.
          - valor: '0.25'
            mensaje: |
              Eso es $I_X$. El eje X′ está a $y_G = 4R/3\pi$ de X, y el momento
              cambia al trasladar el eje: el teorema de Steiner.
        pista: |
          $I_{X'} = I_X - M\,y_G^{2}$, con $y_G = 4R/(3\pi)$.
        desarrollo: |
          $$
          I_{X'} = \frac{MR^{2}}{4} - M\left(\frac{4R}{3\pi}\right)^{2}
          = MR^{2}\left(\frac{1}{4} - \frac{16}{9\pi^{2}}\right) \approx 0{,}0699\,MR^{2}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Con densidad superficial $\sigma = 2M/(\pi R^{2})$ y polares,
              $I_X = \sigma\int_0^{\pi}\!\int_0^{R} r^{3}\sin^{2}\theta\,dr\,d\theta$.
          - texto: >-
              La integral se separa: $R^{4}/4$ por $\pi/2$, y queda
              $I_X = MR^{2}/4$.
          - texto: >-
              X′ pasa por G, así que por Steiner
              $I_{X'} = I_X - M\,y_G^{2}$.
          - texto: >-
              Con $y_G = 4R/3\pi$, $I_{X'} = MR^{2}(1/4 - 16/9\pi^{2})$.
          - texto: >-
              Por Steiner, al pasar de X a X′ se suma $M\,y_G^{2}$, porque X′
              está más lejos de la base.
            trampa: true
            mensaje: |
              Steiner se escribe desde el eje por el centro de gravedad:
              $I_X = I_{X'} + M\,y_G^{2}$. El eje por G es el de momento mínimo,
              así que para llegar a él desde X hay que **restar**.
    resolucion: |
      **a) Respecto del eje X, por integración.** Con densidad y espesor
      homogéneos, la densidad superficial es la masa entre el área:
      $\sigma = M/(\pi R^{2}/2) = 2M/(\pi R^{2})$. En coordenadas polares con
      el origen en el centro del diámetro, $dm = \sigma\,r\,dr\,d\theta$ e
      $y = r\sin\theta$, con $r$ entre 0 y R y $\theta$ entre 0 y $\pi$:

      $$
      I_X = \int y^{2}\,dm
      = \sigma\int_0^{\pi}\sin^{2}\theta\,d\theta\int_0^{R} r^{3}\,dr
      = \frac{2M}{\pi R^{2}}\cdot\frac{\pi}{2}\cdot\frac{R^{4}}{4}
      = \frac{MR^{2}}{4}
      $$

      Es lo mismo que el disco entero respecto de un diámetro, por unidad de
      masa: cada mitad aporta la mitad del momento y tiene la mitad de masa.

      **b) Respecto del eje X′ por G.** El teorema de Steiner relaciona un eje
      con el paralelo que pasa por el centro de gravedad,
      $I_X = I_{X'} + M\,y_G^{2}$, así que

      $$
      I_{X'} = \frac{MR^{2}}{4} - M\left(\frac{4R}{3\pi}\right)^{2}
      = MR^{2}\left(\frac{1}{4} - \frac{16}{9\pi^{2}}\right)
      \approx 0{,}0699\,MR^{2}
      $$

      **Comprobación.** Integrando numéricamente $y^{2}$ sobre el medio disco
      sale $0{,}2500\,MR^{2}$, y el centro de gravedad a $0{,}4244\,R$, que es
      $4/(3\pi)$.

  # ── Ejercicio 1 (n 4) · la viga empotrada en A con una rótula en B, apoyada
  #    en C y con la carga repartida en el voladizo CD.
  - id: exma1819-ord-4-la-viga-con-una-rotula
    titulo: La viga con una rótula, sus diagramas y sus tensiones máximas
    fuente: >-
      Ejercicio 1 · Convocatoria ordinaria de mayo de 2019, bloque 1
      (Estática) · Mecánica Aplicada, Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU). Transcrito de la columna en castellano; la figura está
      redibujada con las cotas del original. El examen no publica resolución;
      el desarrollo es nuestro.
    nivel: examen
    antes:
      idea: |
        En una viga, las reacciones salen del equilibrio; el cortante y el
        flector de cada sección, del equilibrio del trozo que queda a un lado
        del corte; y las tensiones, de esos esfuerzos y de la forma de la
        sección.
      formula: |
        Con V la suma de las fuerzas verticales a la izquierda del corte, M
        positivo si tracciona la fibra inferior y q la carga repartida hacia
        abajo:

        $$
        \frac{dV}{dx} = -q
        \qquad
        \frac{dM}{dx} = V
        $$

        La tensión normal de flexión, máxima en las fibras extremas, y la
        tangencial, con Q el momento estático de la parte de sección que queda
        por encima de la fibra y b su ancho:

        $$
        \sigma_{\max} = \frac{|M|}{W}
        \qquad
        \tau = \frac{V\,Q}{b\,I}
        $$

        Para un rectángulo de ancho b y canto h, $W = b\,h^{2}/6$, y la
        tangencial es máxima en la fibra neutra, $\tfrac{3}{2}\,V/A$.
      reconocer: |
        Antes de plantear se cuentan las incógnitas y las ecuaciones.
    enunciado: |
      **1. (3,5 puntos)** En la estructura de la figura, el punto B es una
      rótula o articulación plana. Teniendo en cuenta la carga q=40 kN/m
      aplicada en el voladizo CD, calcular:

      **a.** Las reacciones en los puntos A y C.

      **b.** Diagramas de esfuerzo cortante (V) y momento flector (M).

      **c.** Si la sección de la viga es la que aparece en la figura, las
      tensiones normal y tangencial máximas, localizando la(s) seccion(es), y
      en que parte de la sección se producen.

