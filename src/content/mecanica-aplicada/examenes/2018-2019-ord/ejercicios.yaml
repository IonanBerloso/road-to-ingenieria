    pide: >-
      Las reacciones en A y C, los diagramas de cortantes y flectores, y las
      tensiones normal y tangencial máximas con su sección y su punto.
    pasos:
      - tipo: reconocer
        pregunta: |
          La viga está empotrada en A y apoyada en C: son cuatro reacciones
          (dos fuerzas verticales, una horizontal y el momento del
          empotramiento) y solo tres ecuaciones de equilibrio. ¿De dónde sale la
          que falta?
        opciones:
          - texto: >-
              De la rótula: el momento flector en B es nulo, así que el tramo
              BCD por separado tiene que estar en equilibrio de momentos
              respecto de B
            correcta: true
            mensaje: |
              Eso es. La rótula no transmite momento, y eso es una ecuación
              más. Tomando momentos en B sobre BCD sale $R_C$ sin saber nada de
              A, y el resto viene detrás.
          - texto: >-
              De la carga repartida, que se sustituye por su resultante en el
              centro de CD
            mensaje: |
              Sustituir la repartida por su resultante sirve para el
              equilibrio, pero no añade ninguna ecuación: sigue habiendo cuatro
              incógnitas. La que falta la da la rótula.
          - texto: >-
              De ninguna parte: la viga es hiperestática y hacen falta las
              deformaciones
            mensaje: |
              Sin la rótula lo sería. La rótula libera el momento en B y deja
              la viga isostática: cuatro incógnitas y cuatro ecuaciones.

      - tipo: calcular
        titulo: La reacción en C
        pregunta: |
          ¿Cuánto vale la reacción en C, en kN?
        respuesta:
          tipo: magnitud
          valor: '60 kN'
          tolerancia: 0.01
          formato: con su unidad, en kN
        distractores:
          - valor: '40 kN'
            mensaje: |
              Es la resultante de la repartida. El apoyo C no la soporta sola:
              está en el borde del voladizo, y la resultante, a 0,5 m a su
              derecha, hace girar BCD respecto de la rótula. Momentos en B:
              $R_C\cdot 1 = 40\cdot 1{,}5$.
          - valor: '20 kN'
            mensaje: |
              Eso es lo que transmite la rótula, la fuerza que empuja hacia
              arriba el tramo AB. En C hace falta más que la carga: 60 kN,
              para compensar además el tirón hacia abajo de la rótula.
        pista: |
          Momentos respecto de B sobre el tramo BCD: la resultante, 40 kN, está
          a 1,5 m de B, y C a 1 m.
        desarrollo: |
          $$
          R_C\cdot 1 - 40\cdot 1{,}5 = 0 \quad\Longrightarrow\quad R_C = 60\ \text{kN}
          $$

          hacia arriba. En BCD, la rótula tira entonces hacia abajo con
          $60 - 40 = 20$ kN, y sobre AB empuja hacia arriba con esos 20 kN.

      - tipo: calcular
        titulo: El momento del empotramiento
        pregunta: |
          ¿Cuánto vale el momento de reacción del empotramiento en A, en valor
          absoluto y en kN·m?
        respuesta:
          tipo: magnitud
          valor: '20 kN*m'
          tolerancia: 0.01
          formato: con su unidad, en kN·m
        distractores:
          - valor: '40 kN*m'
            mensaje: |
              Es lo que saldría con los 20 kN de la rótula a 2 m de A. La
              rótula está en B, a **1 m** del empotramiento: el tramo AB es un
              voladizo de un metro con 20 kN hacia arriba en su punta.
          - valor: '100 kN*m'
            mensaje: |
              Es el momento de la carga repartida respecto de A, 40 kN a 2,5 m.
              Pero sobre la viga entera actúa también $R_C$, que da 120 kN·m al
              otro lado: el empotramiento solo pone la diferencia, 20 kN·m.
        pista: |
          Aísla AB: en B, la rótula empuja hacia arriba con 20 kN, a 1 m de A.
        desarrollo: |
          $$
          M_A + 20\cdot 1 = 0 \quad\Longrightarrow\quad |M_A| = 20\ \text{kN·m}
          $$

          en sentido horario, y la fuerza vertical en A es de 20 kN **hacia
          abajo**. Comprobación con la viga entera: $-20 + 60 - 40 = 0$, y en
          momentos respecto de A, $-20 + 60\cdot 2 - 40\cdot 2{,}5 = 0$.

      - tipo: calcular
        titulo: La tensión normal máxima
        pregunta: |
          ¿Cuánto vale la tensión normal máxima, en MPa?
        respuesta:
          tipo: magnitud
          valor: '200 MPa'
          tolerancia: 0.01
          formato: con su unidad, en MPa
        distractores:
          - valor: '120 MPa'
            mensaje: |
              Has usado el módulo resistente con la sección tumbada,
              $W = 100\cdot 60^{2}/6$. La viga trabaja con los 100 mm en
              vertical: $W = b\,h^{2}/6 = 60\cdot 100^{2}/6 = 10^{5}$ mm³.
          - valor: '400 MPa'
            mensaje: |
              Has tomado $|M| = 40$ kN·m. El flector máximo es 20 kN·m, y lo
              alcanza en dos secciones: el empotramiento A y el apoyo C.
        pista: |
          $|M|_{\max} = 20$ kN·m, en A y en C. $\sigma = |M|/W$ con
          $W = b\,h^{2}/6$.
        desarrollo: |
          $$
          W = \frac{60\cdot 100^{2}}{6} = 10^{5}\ \text{mm}^{3},
          \qquad
          \sigma_{\max} = \frac{20\cdot 10^{6}\ \text{N·mm}}{10^{5}\ \text{mm}^{3}} = 200\ \text{MPa}
          $$

          En A, tracción en la fibra inferior y compresión en la superior; en
          C, al revés.

      - tipo: calcular
        titulo: La tensión tangencial máxima
        pregunta: |
          ¿Cuánto vale la tensión tangencial máxima, en MPa?
        respuesta:
          tipo: magnitud
          valor: '10 MPa'
          tolerancia: 0.01
          formato: con su unidad, en MPa
        distractores:
          - valor: '6.67 MPa'
            mensaje: |
              Has repartido el cortante por igual en toda la sección, $V/A$.
              En una sección rectangular la tensión tangencial es parabólica, y
              en la fibra neutra es 1,5 veces la media.
          - valor: '5 MPa'
            mensaje: |
              Has usado el cortante de 20 kN del tramo AC. El máximo es 40 kN,
              justo a la derecha del apoyo C, donde empieza el voladizo.
        pista: |
          $|V|_{\max} = 40$ kN, a la derecha de C. En un rectángulo,
          $\tau_{\max} = \dfrac{3}{2}\dfrac{V}{A}$, en la fibra neutra.
        desarrollo: |
          $$
          \tau_{\max} = \frac{3}{2}\cdot\frac{40\,000\ \text{N}}{60\cdot 100\ \text{mm}^{2}} = 10\ \text{MPa}
          $$

          en la fibra neutra de la sección justo a la derecha de C.

      - tipo: dibujar
        consigna: |
          En papel, debajo de un croquis de la viga ABCD a escala: **los
          diagramas de cortantes y de flectores**, con el valor en cada punto
          singular y el flector positivo si tracciona la fibra inferior.
        comprueba:
          - punto: |
              **Cortante constante de A a C, −20 kN**, sin salto en la rótula
              B.
            porque: |
              Entre A y C no hay carga, así que la cortante no cambia. La
              rótula transmite la fuerza vertical: no hace saltar la cortante,
              lo que anula es el flector.
          - punto: |
              **Salto de 60 kN en C**, de −20 a +40 kN, y recta hasta cero en
              D.
            porque: |
              La reacción de C empuja hacia arriba y hace saltar la cortante
              lo que vale; en el voladizo, la carga de 40 kN/m la baja con
              pendiente −40 hasta el extremo libre, donde ya no queda nada.
          - punto: |
              **Flector nulo en B**, +20 kN·m en A y −20 kN·m en C, unidos por
              una recta.
            porque: |
              La rótula no transmite momento, y esa es la ecuación que
              faltaba. Con la cortante constante, el flector es una recta de
              pendiente −20.
          - punto: |
              **Parábola de −20 kN·m en C a cero en D**, con tangente
              horizontal en D.
            porque: |
              Con carga uniforme el flector es de segundo grado, y en el
              extremo libre la cortante es nula: la pendiente del flector
              también.
        figura: |
          <svg viewBox="0 0 440 250" role="img" width="440" height="250"
               aria-labelledby="ma1819o4rt ma1819o4rd">
            <title id="ma1819o4rt">Diagramas de cortantes y flectores de la viga ABCD</title>
            <desc id="ma1819o4rd">Dos diagramas alineados sobre la viga, a escala.
            Cortantes: menos veinte kN constante de A a C; en C salta a más cuarenta
            y baja en recta hasta cero en D. Flectores, positivos hacia arriba:
            recta de más veinte kN·m en A a cero en B y menos veinte en C; parábola
            de menos veinte en C a cero en D.</desc>
            <path d="M150 16 L150 232 M270 16 L270 232" fill="none"
                  stroke="var(--faint)" stroke-width=".8" stroke-dasharray="3 3"/>
            <line x1="30" y1="70" x2="390" y2="70" stroke="var(--ink)" stroke-width="1"/>
            <path d="M30 70 L30 90 L270 90 L270 30 L390 70 Z" fill="var(--d1)" fill-opacity=".15"
                  stroke="var(--d1)" stroke-width="1.6"/>
            <text x="16" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--ink)">V</text>
            <text x="150" y="106" text-anchor="middle" font-size="11" fill="var(--d1)">−20 kN</text>
            <text x="278" y="30" font-size="11" fill="var(--d1)">+40 kN</text>
            <line x1="30" y1="170" x2="390" y2="170" stroke="var(--ink)" stroke-width="1"/>
            <path d="M30 170 L30 140 L270 200 L285 192.97 L300 186.88 L315 181.72 L330 177.5 L345 174.22 L360 171.88 L375 170.47 L390 170 Z"
                  fill="var(--d3)" fill-opacity=".15" stroke="var(--d3)" stroke-width="1.6"/>
            <text x="16" y="174" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--ink)">M</text>
            <text x="38" y="136" font-size="11" fill="var(--d3)">+20 kN·m</text>
            <text x="262" y="216" text-anchor="end" font-size="11" fill="var(--d3)">−20 kN·m</text>
            <text x="30" y="246" text-anchor="middle" font-size="11" font-weight="bold" fill="var(--ink)">A</text>
            <text x="150" y="246" text-anchor="middle" font-size="11" font-weight="bold" fill="var(--ink)">B</text>
            <text x="270" y="246" text-anchor="middle" font-size="11" font-weight="bold" fill="var(--ink)">C</text>
            <text x="390" y="246" text-anchor="middle" font-size="11" font-weight="bold" fill="var(--ink)">D</text>
          </svg>

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Momentos en la rótula sobre BCD: $R_C = 60$ kN, y la rótula
              transmite 20 kN.
          - texto: >-
              En A, 20 kN hacia abajo y un momento de 20 kN·m horario, que
              equilibran el tramo AB.
          - texto: >-
              El cortante vale −20 kN de A a C y salta a +40 kN en C; el
              flector va de +20 kN·m en A a −20 kN·m en C, pasando por cero en
              B.
          - texto: >-
              Con $|M| = 20$ kN·m y $W = 10^{5}$ mm³, $\sigma_{\max} = 200$ MPa
              en A y en C; con $|V| = 40$ kN, $\tau_{\max} = 10$ MPa en la fibra
              neutra a la derecha de C.
          - texto: >-
              Como B es una rótula, el cortante también es nulo en B.
            trampa: true
            mensaje: |
              La rótula libera el **momento**, no la fuerza: por B pasan los 20
              kN que el tramo BCD transmite al AB. El cortante en B vale
              −20 kN, igual que en todo el tramo AC.
    resolucion: |
      **a) Reacciones.** La rótula anula el flector en B, y eso da la ecuación
      que falta. Momentos respecto de B sobre el tramo BCD, con la resultante
      de la repartida, $40\cdot 1 = 40$ kN, a 1,5 m de B:

      $$
      R_C\cdot 1 - 40\cdot 1{,}5 = 0 \quad\Longrightarrow\quad R_C = 60\ \text{kN}\ \uparrow
      $$

      En BCD, la vertical da la fuerza de la rótula: $F_B + 60 - 40 = 0$, así
      que sobre BCD actúan 20 kN hacia abajo y, por acción y reacción, sobre AB
      20 kN hacia arriba. El tramo AB es un voladizo de 1 m con esa fuerza en su
      punta: en A,

      $$
      A_y = 20\ \text{kN}\ \downarrow, \qquad M_A = 20\ \text{kN·m, horario}
      $$

      y no hay reacción horizontal, porque ninguna carga la tiene.
      Comprobación con la viga entera: $-20 + 60 - 40 = 0$, y en momentos
      respecto de A, $-20 + 60\cdot 2 - 40\cdot 2{,}5 = 0$.

      **b) Diagramas.** Convenio: cortante positivo si sube en la cara
      izquierda y flector positivo si tracciona abajo, con $dM/dx = V$.

      - $0 \le x < 2$: $V = -20$ kN y $M = 20 - 20x$ kN·m: vale +20 en A, 0 en
        B —la rótula— y −20 en C.
