      <figcaption>

      a) La de arriba: su peso y una N en cada contacto, iguales por simetría. Sin rozamiento entre las esferas, cada N va por la recta de los centros. b) La de abajo a la derecha; la de la izquierda es simétrica. La N contraria la empuja hacia fuera y hacia abajo; el suelo la sostiene y el rozamiento la sujeta, hacia dentro. Dibujadas con un α cualquiera: el del límite es lo que se pide.

      </figcaption>
      </figure>

      - **La fuerza de contacto.** Entre las medias esferas no hay
        rozamiento, así que la fuerza es normal a las dos superficies en el
        punto de contacto: va por la recta que une sus centros. El centro de
        la de arriba está en su cara plana, y los de abajo, en el suelo. Esas
        rectas miden la suma de los radios, $20 + 16 = 36$ cm, y forman un
        ángulo α con la vertical.
      - **Arriba**, 30 kg: su peso y una N en cada contacto, iguales por
        simetría.
      - **Abajo**, 50 kg: la N contraria, hacia fuera y hacia abajo, su peso,
        la normal del suelo, $N_s$, y el rozamiento, $F_r$, hacia dentro.

      **2. Incógnitas.** N, $N_s$ y $F_r$; el ángulo α del límite; y la x
      que le corresponde.

      **3. Ecuaciones.** Arriba, en vertical; en horizontal las dos N se
      anulan por simetría:

      $$
      2N\cos\alpha - 30g = 0
      $$

      La de abajo a la derecha:

      $$
      N_s - 50g - N\cos\alpha = 0,
      \qquad
      N\sin\alpha - F_r = 0
      $$

      Sus momentos respecto del centro de su cara plana: la N pasa por él, el
      rozamiento va por el suelo, que también, y el peso está en la vertical
      del centro. Así que la normal del suelo queda centrada, sin vuelco
      posible. En el límite del deslizamiento, $F_r = \mu_s\,N_s$. Y la
      geometría: los centros de abajo están a $2\cdot 36\sin\alpha$, y x es la
      separación entre los bordes, dos radios menos:

      $$
      x = 72\sin\alpha - 40\ \text{cm}
      $$

      **4. Resultados.** $N\cos\alpha = 15g$ y $N_s = 65g$. En el límite:

      $$
      15g\tan\alpha = 0{,}4\cdot 65g = 26g
      \quad\Longrightarrow\quad
      \tan\alpha = \frac{26}{15} \approx 1{,}7333,
      \qquad
      \sin\alpha = \frac{26}{\sqrt{901}} \approx 0{,}8662
      $$

      $$
      x_{\max} = 72\sin\alpha - 40 \approx 62{,}37 - 40 = 22{,}37\ \text{cm}
      $$

      Con $g = 9{,}81$ m/s², sobre la de abajo a la derecha:

      $$
      \vec{N} \approx 255{,}1\,\vec{\imath} - 147{,}2\,\vec{\jmath}\ \text{N},
      \qquad
      \vec{N}_s \approx 637{,}7\,\vec{\jmath}\ \text{N},
      \qquad
      \vec{F}_r \approx -255{,}1\,\vec{\imath}\ \text{N}
      $$

      con $|\vec{N}| \approx 294{,}5$ N. El resultado no depende de g: todo
      es proporcional a los pesos.

      **5. Comprobación.** El conjunto de las tres medias esferas, que no se
      ha usado. En vertical, las dos normales del suelo sostienen todo:
      $2N_s = (30 + 50 + 50)\,g = 130g$, así que $N_s = 65g$, lo mismo. En
      horizontal, los dos rozamientos son iguales y contrarios. Y la figura
      es posible: el centro de la de arriba queda a $36\cos\alpha \approx 18{,}0$
      cm del suelo, y su punto más bajo, a unos 2 cm, así que no toca el suelo
      y no hay una cuarta fuerza. Por otro camino, fuera del alcance del
      examen —el equilibrio de las tres piezas resuelto numéricamente para esa
      x—, el rozamiento pedido es justo el 40 % de la normal.

      **Lo que dice el resultado.** La carga de arriba hace dos cosas a la vez:
      empuja la media esfera de abajo hacia fuera, con $N\sin\alpha$, y la
      aprieta contra el suelo, con $N\cos\alpha$, que da más rozamiento. Pero
      sola no basta. Si las de abajo no pesaran, el límite sería
      $\tan\alpha = \mu_s = 0{,}4$, con α ≈ 21,8°, y x saldría negativa,
      $72\sin 21{,}8° - 40 \approx -13$ cm: no habría posición posible. Es
      su propio peso, 50 kg, lo que les da agarre.
