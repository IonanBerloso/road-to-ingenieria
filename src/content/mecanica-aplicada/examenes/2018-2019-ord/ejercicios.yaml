        <polygon points="140,208 135.5,198 144.5,198" fill="var(--d4)"/>
        <text x="148" y="206" font-size="11" fill="var(--d4)">50 kg</text>
        <line x1="380" y1="170" x2="380" y2="200" stroke="var(--d4)" stroke-width="1.6"/>
        <polygon points="380,208 375.5,198 384.5,198" fill="var(--d4)"/>
        <text x="388" y="206" font-size="11" fill="var(--d4)">50 kg</text>
        <line x1="220" y1="186" x2="300" y2="186" stroke="var(--faint)" stroke-width="1"/>
        <path d="M220 180 L220 192 M300 180 L300 192" fill="none" stroke="var(--faint)" stroke-width="1"/>
        <text x="260" y="182" text-anchor="middle" font-size="12" font-style="italic" fill="var(--faint)">x</text>
      </svg>
      </figure>
    pide: La distancia máxima x entre las medias esferas de abajo para que el conjunto esté en equilibrio.
    pasos:
      - tipo: reconocer
        pregunta: |
          Entre dos superficies esféricas lisas, ¿qué dirección tiene la fuerza
          de contacto?
        opciones:
          - texto: >-
              La de la recta que une los dos centros, porque es la normal común
              a las dos esferas en el punto de contacto
            correcta: true
            mensaje: |
              Eso es. Sin rozamiento solo hay fuerza normal, y la normal a una
              esfera pasa por su centro. Las dos líneas de trazos de la figura
              son justo esas direcciones, a un ángulo α de la vertical.
          - texto: La vertical, porque la esfera de arriba solo pesa
            mensaje: |
              Si la fuerza fuera vertical, las esferas de abajo no tendrían
              nada que las empujara hacia fuera y el rozamiento no haría falta.
              La fuerza va por la normal común, inclinada α, y tiene una
              componente horizontal que las separa.
          - texto: La horizontal, porque las esferas se empujan de lado
            mensaje: |
              Una fuerza horizontal no podría sostener el peso de la esfera de
              arriba. La normal común está inclinada: su componente vertical
              sostiene y la horizontal separa.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna ecuación: **la media esfera de arriba
          sola** y **una de las de abajo sola**, con todo lo que actúa sobre
          cada una.
        comprueba:
          - punto: |
              **Arriba: el peso, 30g, y una fuerza N en cada contacto, por la
              recta de los centros, hacia arriba y hacia dentro.**
            porque: |
              El contacto entre las esferas es liso: la fuerza es normal a las
              dos superficies, y la normal a una esfera pasa por su centro. Por
              simetría, las dos valen lo mismo.
          - punto: |
              **Abajo: la N contraria, hacia abajo y hacia fuera, el peso, 50g,
              la normal del suelo y el rozamiento, horizontal y hacia dentro.**
            porque: |
              La N empuja a la media esfera a separarse; el rozamiento es lo que
              la sujeta, en contra de ese deslizamiento.
          - punto: |
              **El ángulo α de la recta de los centros con la vertical, el mismo
              en los dos dibujos.**
            porque: |
              Es el mismo contacto visto desde cada lado, y lo fija la
              geometría: los centros están a la suma de los radios.
        figura: |
          <svg viewBox="26 34 356 150" role="img" width="356" height="150" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">Sólidos libres de la media esfera de arriba y de una de las de abajo</title>
            <desc id="dsl-d">a) La media esfera de arriba, boca arriba, con su cara plana horizontal arriba y su centro en ella. Su peso, 30 g, hacia abajo, y en cada contacto con las de abajo una fuerza N, por la recta que une los centros, hacia arriba y hacia dentro. Las dos rectas, a trazos, pasan por su centro y forman un ángulo alfa con la vertical. b) La media esfera de abajo a la derecha, apoyada en el suelo por su cara plana, con el suelo quitado y a trazos. La fuerza N contraria, hacia abajo y hacia fuera, por la recta que pasa por su centro, en el suelo. Su peso, 50 g. La normal del suelo, Ns, hacia arriba, y el rozamiento, Fr, horizontal, hacia dentro.</desc>
