      </svg>
      <figcaption>

      Los dos diagramas a escala, con el flector positivo hacia arriba. El
      flector pasa por **cero en la rótula**, y es máximo en valor absoluto en
      A y en C, con 20 kN·m cada uno.

      </figcaption>
      </figure>

      c) Las tensiones máximas. **Normal**: $|M|_{\max} = 20$ kN·m, en A y en
      C, así que $\sigma_{\max} = 20\cdot 10^{6}/10^{5} = 200$ MPa. En A el
      flector es positivo —tracción en la fibra inferior, compresión en la
      superior— y en C negativo, al revés. **Tangencial**: $|V|_{\max} = 40$
