      La normal en A, con la tracción hacia la derecha, en MPa: compresión arriba y tracción abajo, porque el flector es positivo; en C, con el flector negativo, es al revés. La tangencial justo a la derecha de C, en MPa: parabólica, nula en los bordes y máxima en el eje neutro, 1,5 veces la media.

      </figcaption>
      </figure>

      **5. Comprobación.** La viga entera, que no se ha usado. En vertical,
      $-20 + 60 - 40 = 0$; en momentos respecto de A,
      $-20 + 60\cdot 2 - 40\cdot 2{,}5 = 0$. Y el flector en C por el otro
      lado: desde D, el voladizo de 1 m con 40 kN a 0,5 m da
      $M_C = -40\cdot 0{,}5 = -20$ kN·m, lo mismo que desde A,
      $20 - 20\cdot 2$. Por otro camino, fuera del alcance del examen
      —integrando numéricamente la carga desde el extremo libre D—, el cortante
      y el flector llegan a C con 40 kN y −20 kN·m, y el flector se anula en B
      con estas reacciones.

      **Lo que dice el resultado.** La carga está a la derecha, y aun así A
      tira hacia **abajo**: el voladizo hace girar BCD alrededor de C y levanta
      B, y la rótula empuja hacia arriba la punta de AB. Por eso C carga 60 kN,
      más que toda la carga. Hay dos secciones críticas, A y C, con el mismo
      flector y la tracción en caras opuestas; una sección rectangular, que
      resiste igual por arriba que por abajo, no distingue entre ellas. Y la
      tangencial máxima es veinte veces menor que la normal: en una viga
      esbelta manda la flexión.

  # ── Ejercicio 2 (n 5) · tres medias esferas: la de arriba, lisa, apoyada
  #    en las dos de abajo, que rozan con el suelo.
  - id: exma1819-ord-5-las-medias-esferas-que-no-deben-resbalar
    titulo: Las medias esferas que no deben resbalar
    fuente: >-
      Ejercicio 2 · Convocatoria ordinaria de mayo de 2019, bloque 1
      (Estática) · Mecánica Aplicada, Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU). Transcrito de la columna en castellano; «Cual» sin tilde es
      del original, y la figura está redibujada con sus cotas. x es la
      separación entre los bordes de las dos medias esferas de abajo, como la
      acota la figura. El examen no publica resolución; el desarrollo es
      nuestro.
    nivel: examen
    antes:
      idea: |
        Cuando varios cuerpos se apoyan unos en otros, se aísla cada uno: cada
        fuerza de contacto aparece en uno y, contraria, en el otro. El
        rozamiento de un apoyo toma el valor que haga falta, hasta un límite;
        el equilibrio límite es el que lo agota.
      formula: |
        El rozamiento estático, con N la normal del apoyo, y el equilibrio en
        el plano:

        $$
        |F_r| \le \mu_s\,N
        \qquad
        \sum F_x = 0 \quad \sum F_y = 0 \quad \sum M = 0
        $$
      reconocer: |
        Antes de plantear se mira cómo es cada contacto.
    enunciado: |
      **2. (2,5 puntos)** Las medias esferas de la figura tienen un
      coeficiente de rozamiento estático μs=0,4 respecto del plano horizontal.
      En el contacto entre las medias esferas no hay rozamiento (μs=0). Cual
      es la distancia x máxima para mantener el equilibrio de la figura?

      <figure class="figura-examen">
      <svg viewBox="0 0 520 220" role="img" width="520" height="220"
           aria-labelledby="ma1819o5t ma1819o5d">
        <title id="ma1819o5t">Tres medias esferas: dos apoyadas en el suelo y una encima</title>
        <desc id="ma1819o5d">Dos medias esferas de 20 cm de radio y 50 kg
        descansan sobre el suelo por su cara plana, separadas una distancia x
        entre sus bordes. Encima, entre las dos, una media esfera de 16 cm de
        radio y 30 kg, boca arriba, con la cara plana hacia arriba, se apoya en
        las dos. Las líneas de trazos unen el centro de la de arriba con los
        centros de las de abajo, y alfa es el ángulo de esas líneas con la
        vertical.</desc>
        <line x1="20" y1="170" x2="500" y2="170" stroke="var(--ink)" stroke-width="1.8"/>
        <path d="M24 178 L32 170 M40 178 L48 170 M56 178 L64 170 M456 178 L464 170 M472 178 L480 170 M488 178 L496 170"
              fill="none" stroke="var(--faint)" stroke-width="1"/>
        <path d="M60 170 A80 80 0 0 1 220 170" fill="var(--faint)" fill-opacity=".12"
              stroke="var(--ink)" stroke-width="1.6"/>
        <path d="M300 170 A80 80 0 0 1 460 170" fill="var(--faint)" fill-opacity=".12"
              stroke="var(--ink)" stroke-width="1.6"/>
        <path d="M196 90.4 A64 64 0 0 0 324 90.4 Z" fill="var(--faint)" fill-opacity=".12"
              stroke="var(--ink)" stroke-width="1.6"/>
        <line x1="140" y1="170" x2="260" y2="90.4" stroke="var(--faint)" stroke-width="1" stroke-dasharray="4 3"/>
        <line x1="380" y1="170" x2="260" y2="90.4" stroke="var(--faint)" stroke-width="1" stroke-dasharray="4 3"/>
        <line x1="260" y1="90.4" x2="260" y2="150" stroke="var(--faint)" stroke-width="1" stroke-dasharray="4 3"/>
        <path d="M246.67 99.24 A16 16 0 0 0 260 106.4" fill="none" stroke="var(--d2)" stroke-width="1.2"/>
        <text x="244" y="120" text-anchor="end" font-size="12" font-style="italic" fill="var(--d2-tinta)">α</text>
        <line x1="260" y1="90.4" x2="196" y2="90.4" stroke="var(--d1)" stroke-width="1"/>
        <text x="228" y="84" text-anchor="middle" font-size="11" fill="var(--d1)">16 cm</text>
