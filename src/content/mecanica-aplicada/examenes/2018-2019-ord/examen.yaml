asignatura: mecanica-aplicada
curso: '2018-2019'
convocatoria: ordinaria
fecha: 30 de mayo de 2019
# La ordinaria de mayo de 2019 de Mecánica Aplicada, **su parte del bloque 1**
# (Estática, «1. bloque: Estática» en la cabecera). Es un PDF de dos páginas,
# la de teoría y la de ejercicios; la parte del bloque 2 del mismo día es otro
# PDF y otra convocatoria de este sitio, `2018-2019-2c`.
#
# El cuadernillo es bilingüe, euskera a la izquierda y castellano a la
# derecha, y **el castellano va metido como imágenes de palabra**: el volcado
# de texto solo saca la columna de euskera, y por eso este examen pasó por
# «solo en euskera» hasta la auditoría del 27 de septiembre de 2026 (CLAUDE.md
# §17, «El volcado no es la página»). Se transcribe **solo la columna en
# castellano**, mirando la página renderizada, y nada se traduce del euskera.
#
# Tres cosas de ese texto, dichas antes de que nadie las deduzca:
#
# 1. **LOS PUNTOS SUMAN 10**: 2 + 0,5 + 1,5 en la teoría y 3,5 + 2,5 en los
#    ejercicios, y en las dos columnas igual (en la ordinaria de 2025 no
#    pasaba).
#
# 2. **ERRATAS DEL TEXTO, CONSERVADAS**: la cuestión 1 acaba en coma; la 2
#    empieza en minúscula, «definir», y escribe «que» sin tilde; el ejercicio 2
#    escribe «Cual» sin tilde. Ninguna cambia lo que se pide.
#
# 3. **DOS NUMERACIONES EN UN CUADERNILLO**, como en 2025: la teoría va de la
#    1 a la 3 y los ejercicios vuelven a empezar en 1. Aquí las cuestiones son
#    **n 1 a 3** y los ejercicios **n 4 (Ejercicio 1) y n 5 (Ejercicio 2)**;
#    la `fuente` de cada pieza dice el nombre impreso.
#
# El examen no publica resolución ni resultados: todos los desarrollos son
# nuestros, y cada respuesta se recalcula aparte en
# `tests/verificacion/mecanica-1819-ord.test.ts`.
pdf: 2018-2019-ord.pdf

ejercicios:
  # Teoría · cuestión 1 · la catenaria desde su ecuación diferencial.
  - id: exma1819-ord-1-la-catenaria-desde-su-ecuacion-diferencial
    tema: t05-cables
    n: 1
  # Teoría · cuestión 2 · el virial de un vector.
  - id: exma1819-ord-2-el-virial-de-un-vector
    tema: t01-calculo-vectorial
    n: 2
  # Teoría · cuestión 3 · el momento de inercia del medio disco.
  - id: exma1819-ord-3-el-momento-de-inercia-del-medio-disco
    tema: t02-geometria-de-masas
    n: 3

  # Ejercicio 1 · la viga con una rótula en B: reacciones, diagramas y
  # tensiones.
  - id: exma1819-ord-4-la-viga-con-una-rotula
    tema: t06-resistencia-de-materiales
    n: 4

  # Ejercicio 2 · las tres medias esferas y el rozamiento con el suelo.
  - id: exma1819-ord-5-las-medias-esferas-que-no-deben-resbalar
    tema: t04-rozamiento
    n: 5
