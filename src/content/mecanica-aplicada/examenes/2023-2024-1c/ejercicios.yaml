      <figcaption>

      a) El cable entero, sin la barra ni el amarre: en cada extremo, una fuerza a lo largo del cable, y su peso repartido. b) El tramo entre el punto más bajo, V, y B. En V el cable es horizontal, y el resto del cable tira de él con la tensión mínima. Lo vertical de TB solo lo equilibra el peso del tramo, el de su longitud sB. Dibujados con la catenaria que sale de la resolución.

      </figcaption>
      </figure>

      - **El cable entero**: en B, la fuerza de la barra, y en D, la del
        amarre, las dos a lo largo del cable; y su peso, repartido.
      - **El tramo VB**: en V, el resto del cable tira en horizontal con la
        tensión mínima, $T_O$; en B, la barra tira con $T_B$; y su peso es el
        de su longitud de cable, $q\,s_B$.

      **2. Incógnitas.** El parámetro c, la longitud $s_B$, la tensión en B y
      la tensión en D, con su dirección.

      **3. Ecuaciones.** El parámetro, con la fuerza mínima, que es la del
      punto más bajo:

      $$
      c = \frac{T_O}{q}
      $$

      El tramo VB: en horizontal, la componente de $T_B$ es $T_O$, la misma
      que en el apartado a); en vertical, la de $T_B$ es el peso del tramo.
      Del apartado a), $V_B = Mg/3$:

      $$
      V_B = q\,s_B,
      \qquad
      T_B = \sqrt{T_O^{2} + V_B^{2}}
      $$

      Y como $T = qy$, con y medida desde la directriz, entre dos puntos la
      tensión cambia en q por su diferencia de cotas. D está a la altura de C,
      $0{,}6L$, y B a $0{,}45L$:

      $$
      T_D = T_B + q\,(0{,}6L - 0{,}45L),
      \qquad
      V_D = \sqrt{T_D^{2} - T_O^{2}}
      $$

      **4. Resultados.**

      $$
      c = \frac{\frac{4}{3}Mg}{\frac{2}{3}Mg/L} = 2L,
      \qquad
      s_B = \frac{V_B}{q} = \frac{L}{2},
      \qquad
      T_B = \frac{\sqrt{17}}{3}\,Mg = 1{,}3744\,Mg
      $$

      $$
      T_D = \frac{\sqrt{17}}{3}Mg + \frac{2}{3}\cdot 0{,}15\,Mg = 1{,}4744\,Mg,
      \qquad
      V_D = 0{,}6293\,Mg
      $$

      El cable llega a D formando $\arctan(0{,}6293/1{,}3333) = 25{,}3^{\circ}$
      con la horizontal. Sobre el amarre tira hacia abajo y hacia la
      izquierda, hacia el cable:

      $$
      \vec{F}_D \approx -1{,}3333\,Mg\,\vec{\imath} - 0{,}6293\,Mg\,\vec{\jmath},
      \qquad
      |\vec{F}_D| = 1{,}4744\,Mg
      $$

      Con $s = c\sinh(x/c)$, B está a $0{,}495L$ en horizontal a la izquierda
      del punto más bajo y $c\,(\cosh - 1) = 0{,}0616L$ por encima: el cable
      cuelga muy poco.

      **5. Comprobación.** Por otro modelo, que no se ha usado: el cable
      cuelga poco, y la parábola $y = x^{2}/(2c)$, con x desde el punto más
      bajo, tiene que dar casi lo mismo. En B la pendiente es
      $V_B/T_O = 1/4 = x_B/c$, así que $x_B = 0{,}5L$ e
      $y_B = 0{,}0625L$; D está $0{,}15L$ más arriba, en
      $y_D = 0{,}2125L$, con $x_D = \sqrt{2c\,y_D} = 0{,}922L$ y pendiente
      $x_D/c = 0{,}461$:

      $$
      V_D \approx 0{,}461\,T_O = 0{,}615\,Mg,
      \qquad
      T_D \approx T_O\sqrt{1 + 0{,}461^{2}} = 1{,}468\,Mg
      $$

      a un 2 % y a menos de un 1 % de lo exacto, como corresponde a un cable
      tan poco combado; la parábola se queda corta porque reparte el peso por
      metro de horizontal y no de cable.

      **Lo que dice el resultado.** La tensión apenas cambia a lo largo del
      cable, de $1{,}33\,Mg$ en el punto más bajo a $1{,}47\,Mg$ en D, porque
      cuelga muy poco: su parámetro, $2L$, es grande frente a lo que mide. La
      mayor está en el punto más alto, D, y lo que la separa de la de B,
      $0{,}1\,Mg$, es solo q por los $0{,}15L$ de desnivel: con D a la altura
      de B, las dos serían iguales.

  # ── Ejercicio 2 de la hoja de ejercicios (n 6) · la barra apoyada en el
  #    suelo y articulada al centro de un disco, con deslizamiento inminente en
  #    A. Tema 4.
  - id: exma2324-1c-6-la-barra-apoyada-en-el-disco
    titulo: La barra articulada a un disco, a punto de deslizar en A
    fuente: >-
      Ejercicio 2 · Examen de enero de 2024 del bloque 1 (Estática) · Mecánica
      Aplicada, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). La hoja de
      ejercicios del original lleva impresa la fecha 18 de enero de 2023,
      aunque va en el mismo PDF que la teoría del 17 de enero de 2024. El
      examen no publica resolución; el desarrollo es nuestro.
    nivel: examen
    antes:
      idea: |
        Cuando dos cuerpos están unidos por una articulación, se aísla cada
        uno: la articulación le da a cada cuerpo una fuerza, con sus dos
        componentes y sin par, contraria en el otro. Un apoyo con rozamiento
        da una normal y una fuerza a lo largo del suelo; si está a punto de
        deslizar, el rozamiento llega a su máximo y se opone al movimiento que
        va a haber.
      formula: |
        El rozamiento estático, con f el coeficiente y N la normal del apoyo, y
        el equilibrio de cada sólido en el plano:

        $$
        |F_r| \le f\,N
        \qquad
        \sum F_x = 0 \quad \sum F_y = 0 \quad \sum M = 0
        $$

        Un par aplicado entra solo en la ecuación de momentos del sólido que
        lo recibe.
      reconocer: |
        Antes de plantear se mira qué apoyo está a punto de deslizar, y hacia
        dónde.
    enunciado: |
      Una barra AB de masa $M$ y longitud $2R$ está articulada en su extremo B
      al centro de un disco de radio $R$ y masa $M$, sometido a un momento
      $P$. El sistema se apoya en el suelo en A y C, siendo el coeficiente de
      rozamiento en A $f = \frac{\sqrt{3}}{2}$. Si el deslizamiento en A es
      inminente, determinar:

      **a)** (0,5p) Diagramas del sólido libre del disco y de la barra.

      **b)** (0,5p) Fuerza normal y de rozamiento en el punto A.

      **c)** (0,5p) Momento $P$ aplicado al disco.

      **d)** (0,5p) Fuerza normal y de rozamiento en C.

