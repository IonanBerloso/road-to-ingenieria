      La misma figura del apartado a), a escala. D está a la altura de C, es
      decir, **0,15·L por encima de B**: esa diferencia de cotas es la que
      decide la respuesta.

      </figcaption>
      </figure>
    pide: >-
      La tensión del cable en su amarre D, con su dirección.
    pasos:
      - tipo: reconocer
        pregunta: |
          Del apartado a) sale la componente vertical en B, $V_B = Mg/3$. ¿Qué
          dice ese número del cable?
        opciones:
          - texto: >-
              La longitud de cable entre B y el punto más bajo: la vertical de
              la tensión es el peso de ese tramo, $V_B = q\,s_B$
            correcta: true
            mensaje: |
              Eso es. Aislando el tramo entre el punto más bajo y B, la
              componente vertical equilibra su peso. De ahí $s_B$, y con $s_B$
              la catenaria entera queda situada respecto de B.
          - texto: La altura de B sobre el punto más bajo, $V_B = q\,h_B$
            mensaje: |
              El peso va por longitud de **cable**, no de altura. Lo que es
              proporcional a la altura es la tensión total, $T = qy$, medida
              desde la directriz y no desde el punto más bajo.
          - texto: >-
              Nada: la vertical en B no tiene que ver con el tramo BD
            mensaje: |
              Es exactamente lo que une los dos apartados. El cable es uno
              solo: sabiendo cuánto tira en vertical en B se sabe dónde está
              su punto más bajo y, con él, la tensión en cualquier otro punto.

      - tipo: calcular
        titulo: El parámetro de la catenaria
        pregunta: |
          ¿Cuánto vale el parámetro $c = T_O/q$, en unidades de $L$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '0.5'
            mensaje: |
              Has invertido el cociente, $q/T_O$. El parámetro es una
              longitud: fuerza entre fuerza por unidad de longitud,
              $c = T_O/q$.
          - valor: '0.8889'
            mensaje: |
              Has multiplicado $T_O$ por $q$ en vez de dividir. Mira las
              unidades: $T_O\,q$ sería fuerza al cuadrado por unidad de
              longitud, y $c$ tiene que salir en metros.
        pista: |
          $c = \dfrac{\frac{4}{3}Mg}{\frac{2}{3}Mg/L}$.
        desarrollo: |
          $$
          c = \frac{T_O}{q} = \frac{4/3}{2/3}\,L = 2L
          $$

      - tipo: calcular
        titulo: La longitud de cable hasta el punto más bajo
        pregunta: |
          Con $V_B = q\,s_B$, ¿cuánto vale $s_B$, en unidades de $L$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '0.2222'
            mensaje: |
              Has multiplicado $V_B$ por $q$. La longitud sale de dividir la
              fuerza entre el peso por unidad de longitud:
              $s_B = V_B/q$.
          - valor: '2'
            mensaje: |
              Ese es $c = T_O/q$, el parámetro de la catenaria, que usa la
              componente horizontal. La longitud del tramo sale de la
              **vertical**, $V_B = Mg/3$.
        pista: |
          $s_B = V_B/q = \dfrac{Mg/3}{\frac{2}{3}Mg/L}$.
        desarrollo: |
          $$
          s_B = \frac{V_B}{q} = \frac{1/3}{2/3}\,L = \frac{L}{2}
          $$

          Y con $s = c\sinh(x/c)$, B queda a una abscisa
          $2L\,\mathrm{arcsinh}(0{,}25) = 0{,}495\,L$ a la izquierda del punto
          más bajo.

      - tipo: calcular
        titulo: La fuerza en D
        pregunta: |
          ¿Cuánto vale la tensión del cable en D, en unidades de $Mg$?
        respuesta:
          tipo: numero
          valor: '1.4744'
          tolerancia: 0.005
          formato: un número con cuatro decimales
        distractores:
          - valor: '1.3744'
            mensaje: |
              Esa es la tensión en **B**, $\sqrt{17}/3\,Mg$. D no está a la
              altura de B sino a la de C, $0{,}15L$ más arriba, y la tensión
              crece con la altura: $T_D = T_B + q\cdot 0{,}15L$.
          - valor: '1.3333'
            mensaje: |
              Eso es $T_O$, la fuerza **mínima**, que se da en el punto más
              bajo del cable. En un amarre la tensión es mayor: a la
              horizontal $T_O$ se le suma la vertical.
          - valor: '1.2744'
            mensaje: |
              Has restado la diferencia de alturas. D está **por encima** de B
              —a la altura de C—, y como $T = qy$, subir aumenta la tensión.
        pista: |
          $T = q\,y$ con $y$ medida desde la directriz, así que
          $T_D - T_B = q\,(y_D - y_B) = q\cdot 0{,}15L$. Y
          $T_B = \sqrt{T_O^{2} + V_B^{2}}$.
        desarrollo: |
          $$
          T_B = \sqrt{\left(\tfrac{4}{3}\right)^{2} + \left(\tfrac{1}{3}\right)^{2}}\,Mg
          = \frac{\sqrt{17}}{3}\,Mg = 1{,}3744\,Mg
          $$

          $$
          T_D = T_B + q\,(0{,}6L - 0{,}45L)
          = 1{,}3744\,Mg + \frac{2}{3}\cdot 0{,}15\,Mg = 1{,}4744\,Mg
          $$

      - tipo: justificar
        pregunta: Ordena la resolución del apartado b). Una pieza es falsa.
        piezas:
          - texto: >-
              El parámetro de la catenaria es $c = T_O/q = 2L$.
          - texto: >-
              En B la componente vertical es el peso del cable hasta el punto
              más bajo: $s_B = V_B/q = L/2$.
          - texto: >-
              La tensión es $T = qy$, con $y$ desde la directriz, así que entre
              dos puntos cambia en $q$ por su diferencia de cotas.
          - texto: >-
              D está a la altura de C, $0{,}15L$ por encima de B:
              $T_D = \frac{\sqrt{17}}{3}Mg + \frac{2}{3}\cdot 0{,}15\,Mg = 1{,}474\,Mg$.
          - texto: >-
              El cable soporta una fuerza mínima de $\frac{4}{3}Mg$, así que esa
              es la fuerza que hace en D.
            trampa: true
            mensaje: |
              La fuerza mínima es la del punto más bajo, donde el cable es
              horizontal. En los amarres la tensión es **máxima**: en D vale
              $1{,}474\,Mg$, y de ella solo la componente horizontal es
              $\frac{4}{3}Mg$.
    resolucion: |
      **El parámetro.** Con el peso por unidad de longitud de cable y la
      fuerza mínima, que es la del punto más bajo:

      $$
      c = \frac{T_O}{q} = \frac{\frac{4}{3}Mg}{\frac{2}{3}Mg/L} = 2L
      $$

      **Dónde está B en la catenaria.** Del apartado a), la componente
      vertical en B es $V_B = Mg/3$, y es el peso del tramo de cable entre el
      punto más bajo y B:

      $$
      s_B = \frac{V_B}{q} = \frac{L}{2}
      \qquad
      T_B = \sqrt{T_O^{2} + V_B^{2}} = \frac{\sqrt{17}}{3}\,Mg = 1{,}3744\,Mg
      $$

      Con $s = c\sinh(x/c)$, B está a $0{,}495L$ en horizontal del punto más
      bajo y $c\,(\cosh - 1) = 0{,}0616L$ por encima de él: el cable cuelga
      muy poco.

      **La tensión en D.** La tensión de la catenaria es $T = qy$, con $y$
      medida desde la directriz, así que entre dos puntos cualesquiera
      $T_2 - T_1 = q\,(y_2 - y_1)$. D está a la altura de C, $0{,}6L$, y B a
      $0{,}45L$:

      $$
      T_D = T_B + q\cdot 0{,}15L = \frac{\sqrt{17}}{3}Mg + \frac{1}{10}Mg
      = 1{,}4744\,Mg
      $$

      **Su dirección.** La horizontal es $T_O = \frac{4}{3}Mg$ y la vertical
      $\sqrt{T_D^{2} - T_O^{2}} = 0{,}6293\,Mg$, así que el cable llega a D
      formando $25{,}3^{\circ}$ con la horizontal. Sobre el amarre, la fuerza
      tira hacia abajo y hacia la izquierda, hacia el cable.

      **Comprobación.** Por la otra vía, $s_D = 0{,}6293Mg/q = 0{,}944L$ da
      una abscisa de $0{,}912L$ a la derecha del punto más bajo, y la
      catenaria $y = c\cosh(x/c)$ evaluada en B y en D devuelve exactamente
      los $0{,}15L$ de desnivel. D queda a $2{,}007L$ de la vertical de A, que
      es donde está dibujado.

  # ── Ejercicio 2 de la hoja de ejercicios (n 6) · la barra apoyada en el
  #    suelo y articulada al centro de un disco, con deslizamiento inminente en
  #    A. Tema 4.
  - id: exma2324-1c-6-la-barra-apoyada-en-el-disco
    titulo: La barra articulada a un disco, a punto de deslizar en A
    fuente: >-
      Ejercicio 2 · Examen de enero de 2024 del bloque 1 (Estática) · Mecánica
      Aplicada, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). La hoja de
      ejercicios del original lleva impresa la fecha 18 de enero de 2023,
      aunque va en el mismo PDF que la teoría del 17 de enero de 2024. El
      examen no publica resolución; el desarrollo es nuestro.
    nivel: examen
    enunciado: |
      Una barra AB de masa $M$ y longitud $2R$ está articulada en su extremo B
      al centro de un disco de radio $R$ y masa $M$, sometido a un momento
      $P$. El sistema se apoya en el suelo en A y C, siendo el coeficiente de
      rozamiento en A $f = \frac{\sqrt{3}}{2}$. Si el deslizamiento en A es
      inminente, determinar:

      **a)** (0,5p) Diagramas del sólido libre del disco y de la barra.

      **b)** (0,5p) Fuerza normal y de rozamiento en el punto A.

      **c)** (0,5p) Momento $P$ aplicado al disco.

      **d)** (0,5p) Fuerza normal y de rozamiento en C.

