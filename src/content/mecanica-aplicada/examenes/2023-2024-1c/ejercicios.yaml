        <desc id="ma2324e6d">Un disco de radio R apoyado en el suelo en C. Su
        centro B está articulado al extremo de una barra de longitud dos R,
        cuyo otro extremo A se apoya en el suelo a la izquierda, formando la
        barra 30 grados con el suelo. Sobre el disco actúa un momento P en
        sentido horario. Dos pesos Mg: uno en el centro del disco y otro en el
        punto medio de la barra, que cae justo sobre el borde del disco.</desc>

