      a) La viga entera, con la carga en toda su longitud: tres incógnitas, Bx, By y RC, y tres ecuaciones. b) El voladizo AB cortado justo antes de B. En el corte, V y M con sus sentidos positivos sobre la cara derecha de un trozo izquierdo: V, la suma de las fuerzas verticales a la izquierda, hacia abajo; M, el que tracciona la fibra inferior, antihorario. Los signos dirán si lo son. Ejes: x hacia la derecha, y hacia arriba; momentos positivos en sentido antihorario.

      </figcaption>
      </figure>

      - **La viga entera**: en B, una articulación fija, $B_x$ y $B_y$; en C,
        un apoyo móvil, $R_C$; y la carga $q_0$ en sus $4L$, con resultante
        $4q_0L$ en el centro, a $2L$ de A.
      - **Un trozo cortado** da el cortante y el flector de la sección, con V
        y M en sus sentidos positivos. El voladizo AB da el flector sobre B sin
        necesitar ninguna reacción.

      **2. Incógnitas.** $B_x$, $B_y$ y $R_C$; el cortante y el flector a lo
      largo de la viga; el centro de gravedad y la inercia de la sección; la
      tensión normal máxima; y la dimensión e.

      **3. Ecuaciones.** La viga entera, con momentos respecto de B,
      antihorario positivo:

      $$
      B_x = 0,
      \qquad
      B_y + R_C - 4q_0L = 0,
      \qquad
      R_C\cdot 2L - 4q_0L\cdot L = 0
      $$

      Los esfuerzos, con x desde A, del trozo a la izquierda de cada sección,
      con $dV/dx = -q_0$ y $dM/dx = V$. La sección: el ala, $5e\times 2e$,
      abajo, con su centro a $e$ de la base, y el alma, $e\times 3e$, encima,
      con su centro a $3{,}5e$:

      $$
      y_G = \frac{10e^{2}\cdot e + 3e^{2}\cdot 3{,}5e}{13e^{2}},
      \qquad
      I = \frac{5e\,(2e)^{3}}{12} + 10e^{2}\,(y_G - e)^{2}
      + \frac{e\,(3e)^{3}}{12} + 3e^{2}\,(3{,}5e - y_G)^{2}
      $$

      Y la tensión, con el peso propio por unidad de longitud,
      $q_0 = \gamma A = 18000\cdot 13e^{2}$ N/m, e y la distancia de la fibra
      al eje neutro:

      $$
      |\sigma| = \frac{|M|\,y}{I} \le \sigma_0
      $$

      **4. Resultados.** Las reacciones, iguales, como pide la simetría:

      $$
      R_C = 2q_0L,
      \qquad
      B_y = 2q_0L,
      \qquad
      B_x = 0,
      \qquad
      \vec{R}_B = \vec{R}_C = 2q_0L\,\vec{\jmath}
      $$

      a) Los diagramas:

      | tramo | cortante $V(x)$ | flector $M(x)$ |
      |---|---|---|
      | AB, $0 < x < L$ | $-q_0x$ | $-q_0x^{2}/2$ |
      | BC, $L < x < 3L$ | $q_0\,(2L - x)$ | $-q_0x^{2}/2 + 2q_0L\,(x - L)$ |
      | CD, $3L < x < 4L$ | $q_0\,(4L - x)$ | $-q_0\,(4L - x)^{2}/2$ |

      El cortante salta de $-q_0L$ a $+q_0L$ en cada apoyo y se anula en el
      centro del vano. El flector vale $-q_0L^{2}/2$ en B y en C y **cero** en
      el centro del vano y en los extremos: toda la viga trabaja con flector
      negativo o nulo.

