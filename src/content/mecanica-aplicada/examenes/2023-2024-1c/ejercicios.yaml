      <figcaption>

      Redibujada a escala: la viga con L = 105 px y la sección con e = 14 px.
      La sección es una **T invertida**, con el ala abajo: el centro de
      gravedad queda cerca del ala y lejos de la punta del alma.

      </figcaption>
      </figure>
    pide: >-
      Los diagramas de cortantes y flectores, la tensión normal máxima con su
      signo y su sección, y la dimensión e que agota los 200 MPa.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de calcular: ¿dónde está el momento flector de mayor valor
          absoluto en esta viga?
        opciones:
          - texto: >-
              En los apoyos B y C, donde los voladizos cuelgan: el centro del
              vano queda descargado
            correcta: true
            mensaje: |
              Eso es. Cada voladizo da en su apoyo $-q_0L^{2}/2$, y en el vano
              la carga sube el flector exactamente eso: en el centro queda
              cero. Es la gracia de esta proporción, L-2L-L.
          - texto: >-
              En el centro del vano, $q_0(2L)^{2}/8$, como en una viga
              biapoyada
            mensaje: |
              Esa fórmula es de la biapoyada **sin** voladizos. Aquí los dos
              voladizos meten un flector negativo en los apoyos que se
              superpone: $q_0L^{2}/2 - q_0L^{2}/2 = 0$ en el centro.
          - texto: En los extremos A y D, que están más lejos de los apoyos
            mensaje: |
              Un extremo libre sin carga puntual tiene flector nulo: no hay
              nada a su lado que haga momento. El flector de un voladizo es
              máximo en el empotramiento, que aquí es el apoyo.

      - tipo: calcular
        titulo: La reacción en B
        pregunta: |
          ¿Cuánto vale la reacción en B, en unidades de $q_0L$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              Has repartido solo la carga del vano entre apoyos,
              $q_0\cdot 2L$. Los voladizos también cargan: la viga entera
              pesa $4q_0L$ y, por simetría, cada apoyo lleva la mitad.
          - valor: '4'
            mensaje: |
              Esa es la carga total. Hay dos apoyos y la viga es simétrica
              respecto del centro, así que cada uno lleva la mitad.
        pista: |
          Carga total $4q_0L$, centrada; los dos apoyos son simétricos.
        desarrollo: |
          $$
          R_B = R_C = \frac{q_0\cdot 4L}{2} = 2\,q_0L
          $$

      - tipo: calcular
        titulo: El flector en el apoyo
        pregunta: |
          Con el convenio del tema 6 —flector positivo el que comprime la fibra
          superior—, ¿cuánto vale el flector en B, en unidades de $q_0L^{2}$?
        respuesta:
          tipo: numero
          valor: '-0.5'
          tolerancia: 0.005
          formato: un número, con su signo
        distractores:
          - valor: '0.5'
            mensaje: |
              El valor es ese, pero el signo no. Un voladizo cargado cuelga:
              tracciona la fibra de **arriba**, y con el convenio del tema
              eso es flector negativo. El signo decide luego qué fibra manda.
          - valor: '-1'
            mensaje: |
              Te falta el medio. La carga del voladizo, $q_0L$, actúa en su
              centro, a $L/2$ de B: su momento es $q_0L\cdot L/2$.
        pista: |
          Solo el voladizo AB está a la izquierda de B: $M_B = -q_0L\cdot L/2$.
        desarrollo: |
          $$
          M_B = -q_0L\cdot\frac{L}{2} = -\frac{q_0L^{2}}{2}
          $$

          Y lo mismo en C, por simetría.

      - tipo: calcular
        titulo: El flector en el centro del vano
        pregunta: |
          ¿Y en el centro del vano, a $2L$ de A, en unidades de $q_0L^{2}$?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.005
          formato: un número, con su signo
        distractores:
          - valor: '0.5'
            mensaje: |
              Es $q_0(2L)^{2}/8$, la viga biapoyada de luz $2L$ sin voladizos.
              Los voladizos restan $q_0L^{2}/2$ en todo el vano, y lo que queda
              en el centro es cero.
          - valor: '-1'
            mensaje: |
              Sale así con una reacción de $q_0L$: es el error de repartir
              solo la carga del vano. Con $R_B = 2q_0L$:
              $-2q_0L^{2} + 2q_0L\cdot L = 0$.
        pista: |
          A la izquierda del centro hay una carga $2q_0L$ con brazo $L$ y la
          reacción $2q_0L$ con brazo $L$.
        desarrollo: |
          $$
          M(2L) = -q_0\,\frac{(2L)^{2}}{2} + 2q_0L\cdot L = 0
          $$

      - tipo: calcular
        titulo: El centro de gravedad de la T
        pregunta: |
          Medido desde la base del ala, ¿a qué altura está el centro de
          gravedad de la sección, en unidades de $e$?
        respuesta:
          tipo: numero
          valor: '1.5769'
          tolerancia: 0.005
          formato: un número, vale la forma exacta
        distractores:
          - valor: '2.5'
            mensaje: |
              Es la mitad del canto, $5e/2$, que solo vale para una sección
              simétrica. Aquí el ala ancha, $10e^{2}$ de los $13e^{2}$, tira
              del centro de gravedad hacia abajo.
          - valor: '3.4231'
            mensaje: |
              Es la distancia desde la **punta del alma**, $5e - 1{,}577e$. La
              pregunta mide desde la base del ala; las dos distancias hacen
              falta, pero no son la misma.
        pista: |
          Ala: $10e^{2}$ con centro a $e$. Alma: $3e^{2}$ con centro a $3{,}5e$.
        desarrollo: |
          $$
          y_G = \frac{10e^{2}\cdot e + 3e^{2}\cdot 3{,}5e}{13e^{2}}
          = \frac{20{,}5}{13}\,e = 1{,}577\,e
          $$

          La punta del alma queda a $5e - 1{,}577e = 3{,}423e$ del eje neutro.

      - tipo: calcular
        titulo: El momento de inercia
        pregunta: |
          ¿Cuánto vale el momento de inercia de la sección respecto de su eje
          neutro, en unidades de $e^{4}$?
        respuesta:
          tipo: numero
          valor: '20.006'
          tolerancia: 0.05
          formato: un número con tres decimales
        distractores:
          - valor: '5.583'
            mensaje: |
              Has sumado los momentos propios de los dos rectángulos,
              $10/3 + 9/4$, sin Steiner. Cada rectángulo tiene su centro lejos
              del eje neutro y hay que sumar su área por esa distancia al
              cuadrado: es la mayor parte de la inercia.
          - valor: '52.333'
            mensaje: |
              Ese es el momento de inercia respecto de la **base** del ala. La
              flexión se calcula respecto del eje neutro, que pasa por el
              centro de gravedad: $I_G = I_{\text{base}} - A\,y_G^{2}$.
        pista: |
          Steiner en cada rectángulo:

          $$
          I = \frac{5\cdot 2^{3}}{12} + 10\,(1{,}577 - 1)^{2}
          \;+\; \frac{1\cdot 3^{3}}{12} + 3\,(3{,}5 - 1{,}577)^{2}
          $$
        desarrollo: |
          $$
          I = \frac{10}{3} + 10\left(\frac{15}{26}\right)^{2} +
          \frac{9}{4} + 3\left(\frac{50}{26}\right)^{2}
          = 20{,}006\,e^{4}
          $$

          Integrando numéricamente $b(y)\,(y - y_G)^{2}$ en el canto sale lo
          mismo.

      - tipo: calcular
        titulo: La tensión máxima para un e concreto
        pregunta: |
          Con $q_0 = 18000\cdot 13e^{2}$ y $L = 2$ m, la tensión máxima va como
          $1/e$. Como comprobación: ¿cuánto valdría si $e = 1$ mm?
        respuesta:
          tipo: magnitud
          valor: '80.07 MPa'
          tolerancia: 0.01
          formato: una tensión, con su unidad
        distractores:
          - valor: '36.89 MPa'
            mensaje: |
              Es la tensión de la fibra **inferior**, a $1{,}577e$ del eje
              neutro. Con flector negativo esa fibra está comprimida, pero la
              punta del alma, arriba, está más lejos —$3{,}423e$— y tracciona
              más.
          - valor: '286.9 MPa'
            mensaje: |
              Es lo que sale con la inercia sin Steiner, $5{,}583e^{4}$. Esa
              inercia es casi cuatro veces menor que la buena, y la tensión
              sale casi cuatro veces mayor.
        pista: |
          $\sigma_{\max} = \dfrac{|M|_{\max}\,y_{\text{sup}}}{I}$ con
          $|M|_{\max} = q_0L^{2}/2$, $y_{\text{sup}} = 3{,}423e$ e
          $I = 20{,}006e^{4}$, todo en metros.
        desarrollo: |
          $$
          \sigma_{\max} = \frac{\frac{1}{2}\,18000\cdot 13e^{2}\cdot 2^{2}\cdot 3{,}423e}
          {20{,}006\,e^{4}}
          = \frac{80\,074\ \text{Pa}\cdot\text{m}}{e}
          $$

          Con $e = 10^{-3}$ m: $80{,}07$ MPa, de tracción.

      - tipo: calcular
        titulo: La dimensión e
        pregunta: |
          ¿Qué valor de $e$ agota la tensión admisible, $\sigma_0 = 200$ MPa?
        respuesta:
          tipo: magnitud
          valor: '0.4004 mm'
          tolerancia: 0.01
          formato: una longitud, con su unidad
        distractores:
          - valor: '0.1844 mm'
            mensaje: |
              Has dimensionado con la fibra inferior. La que manda es la de
              mayor distancia al eje neutro, la punta del alma, a $3{,}423e$:
              ahí la tensión es 2,17 veces mayor.
          - valor: '1.435 mm'
            mensaje: |
              Es el error de la inercia sin Steiner: con una inercia casi
              cuatro veces menor, la sección parece necesitar ser más gruesa
              de lo que es.
          - valor: '0.8007 mm'
            mensaje: |
              El doble: has tomado $|M|_{\max} = q_0L^{2}$, sin el medio. El
              peso del voladizo, $q_0L$, actúa a $L/2$ del apoyo.
        pista: |
          $\sigma_{\max} = 80\,074/e$ (Pa, con $e$ en metros). Iguálalo a
          $200\cdot 10^{6}$ Pa.
        desarrollo: |
          $$
          e = \frac{80\,074}{200\cdot 10^{6}} = 4{,}004\cdot 10^{-4}\ \text{m}
          = 0{,}400\ \text{mm}
          $$

          Con ese $e$, la tensión en la fibra inferior es de 92,1 MPa de
          compresión, lejos del límite.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Por simetría, $R_B = R_C = 2q_0L$.
          - texto: >-
              Cada voladizo da en su apoyo $M = -q_0L^{2}/2$, y en el centro del
              vano el flector vuelve a cero: el máximo en valor absoluto está
              en B y en C.
          - texto: >-
              Con flector negativo la fibra superior tracciona; la punta del
              alma está a $3{,}423e$ del eje neutro, más lejos que la base del
              ala, así que la tensión máxima es de tracción, arriba, en B y C.
          - texto: >-
              Como $q_0 = \gamma\cdot 13e^{2}$, la tensión máxima vale
              $80{,}07/e$ MPa con $e$ en mm, y agotar 200 MPa da $e = 0{,}400$ mm.
          - texto: >-
              El flector máximo está en el centro del vano y vale
              $q_0(2L)^{2}/8$, como en una viga biapoyada.
            trampa: true
            mensaje: |
              Los voladizos cambian la viga. Superponiendo, el vano recibe
              $+q_0L^{2}/2$ de su propia carga y $-q_0L^{2}/2$ de los
              voladizos, y en el centro queda **cero**. El máximo en valor
              absoluto está en los apoyos, y es negativo.
    resolucion: |
      **Reacciones.** La carga total es $4q_0L$ y la viga es simétrica:
      $R_B = R_C = 2q_0L$.

      **a) Diagramas.** Con $x$ desde A, $dM/dx = V$ y el convenio del tema 6
      (flector positivo el que comprime la fibra superior):

      | tramo | cortante $V(x)$ | flector $M(x)$ |
      |---|---|---|
      | AB, $0 < x < L$ | $-q_0x$ | $-q_0x^{2}/2$ |
      | BC, $L < x < 3L$ | $q_0\,(2L - x)$ | $-q_0x^{2}/2 + 2q_0L\,(x - L)$ |
      | CD, $3L < x < 4L$ | $q_0\,(4L - x)$ | $-q_0\,(4L - x)^{2}/2$ |

      El cortante salta de $-q_0L$ a $+q_0L$ en cada apoyo y se anula en el
      centro del vano. El flector vale $-q_0L^{2}/2$ en B y en C y **cero** en
      el centro del vano y en los extremos: toda la viga trabaja con flector
      negativo o nulo.

