      <figcaption>

      La barra sola. La articulación A da dos componentes y ningún par. El resorte tira de C a lo largo de su eje, en horizontal, hacia E. El cable tira de B a lo largo de su tangente: hacia la derecha y hacia abajo, porque desde B baja hacia su punto más bajo. Ejes: x hacia la derecha, y hacia arriba; momentos positivos en sentido antihorario.

      </figcaption>
      </figure>

      - **La articulación A**, con $A_x$ y $A_y$.
      - **El peso** $Mg$, vertical, en el centro G.
      - **El resorte en C**, horizontal y hacia E.
      - **El cable en B**, tangente al cable y hacia él: una componente
        horizontal $H_B$, hacia la derecha, y una vertical $V_B$, hacia abajo.

      **2. Incógnitas.** $A_x$, $A_y$, la fuerza del resorte $F_k$ y las dos
      componentes del cable en B.

      **3. Ecuaciones.** Con A en el origen, $\cos\alpha = 0{,}8$ y
      $\sin\alpha = 0{,}6$, el ángulo del triángulo 3-4-5:

      $$
      C = (0{,}8L,\;0{,}6L)
      \qquad
      B = (0{,}6L,\;0{,}45L)
      \qquad
      G = (0{,}4L,\;0{,}3L)
      $$

      E está en la vertical de A y a la altura de C: el resorte es horizontal
      y mide $\overline{EC} = 0{,}8L$. Con longitud en reposo nula, todo él es
      alargamiento:

      $$
      F_k = k\,(0{,}8L - L_0)
      $$

      En un cable con peso, la componente horizontal de la tensión es la
      misma en todos sus puntos, y es la del punto más bajo, la mínima:
      $H_B = T_O$. El equilibrio de la barra, con momentos respecto de A,
      antihorario positivo:

      $$
      A_x - F_k + T_O = 0,
      \qquad
      A_y - Mg - V_B = 0,
      \qquad
      F_k\cdot 0{,}6L - Mg\cdot 0{,}4L - T_O\cdot 0{,}45L - V_B\cdot 0{,}6L = 0
      $$

      **4. Resultados.** El resorte y la componente vertical del cable:

      $$
      F_k = \frac{5}{2}\frac{Mg}{L}\cdot 0{,}8L = 2\,Mg,
      \qquad
      1{,}2 - 0{,}4 - 0{,}6 = 0{,}6\,\frac{V_B}{Mg}
      \quad\Longrightarrow\quad
      V_B = \frac{Mg}{3}
      $$

      Sale positiva: el cable tira de B hacia abajo, como se había dibujado.
      Y la reacción en A:

      $$
      A_x = 2Mg - \frac{4}{3}Mg = \frac{2}{3}Mg,
      \qquad
      A_y = Mg + \frac{Mg}{3} = \frac{4}{3}Mg
      $$

      $$
      \vec{F}_B = \frac{4}{3}Mg\,\vec{\imath} - \frac{1}{3}Mg\,\vec{\jmath},
      \qquad
      \vec{F}_C = -2Mg\,\vec{\imath},
      \qquad
      \vec{F}_A = \frac{2}{3}Mg\,\vec{\imath} + \frac{4}{3}Mg\,\vec{\jmath}
      $$

      **5. Comprobación.** Los momentos respecto de B, que no se han usado. A
      está a $(-0{,}6L,\ -0{,}45L)$ de B; G, a $(-0{,}2L,\ -0{,}15L)$; y C, a
      $(0{,}2L,\ 0{,}15L)$. El cable pasa por B. En $MgL$:

      $$
      \underbrace{-0{,}6\cdot\tfrac{4}{3} + 0{,}45\cdot\tfrac{2}{3}}_{A}
      + \underbrace{0{,}2}_{Mg}
      + \underbrace{0{,}15\cdot 2}_{F_k}
      = -0{,}5 + 0{,}2 + 0{,}3 = 0
      $$

      **Lo que dice el resultado.** El resorte, que parece lo de menos, es la
      fuerza mayor: con longitud en reposo nula tira con $2Mg$, el doble del
      peso, y es lo que sostiene la barra levantada. El cable tira casi en
      horizontal: en B su pendiente es $V_B/T_O = 1/4$, unos 14°, y lo hace
      hacia abajo porque su punto más bajo queda a la derecha de B.

  # ── Ejercicio 1 de la hoja de ejercicios (n 5), apartado b) · la fuerza del
  #    cable en D. Tema 5.
  - id: exma2324-1c-5-la-fuerza-del-cable-en-d
    titulo: La fuerza del cable en su amarre D
    fuente: >-
      Apartado b) del ejercicio 1 · Examen de enero de 2024 del bloque 1
      (Estática) · Mecánica Aplicada, Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU). La hoja de ejercicios del original lleva impresa la fecha 18
      de enero de 2023, aunque va en el mismo PDF que la teoría del 17 de
      enero de 2024. El examen no publica resolución; el desarrollo es
      nuestro.
    nivel: examen
    antes:
      idea: |
        Un cable que cuelga por su propio peso toma la forma de una catenaria.
        Toda ella queda fijada por su parámetro y por dónde está su punto más
        bajo; sabido eso, se conoce la tensión en cualquier punto.
      formula: |
        Con q el peso por unidad de longitud de cable, $T_O$ la tensión en el
        punto más bajo, x medida desde él, y desde la directriz y s la
        longitud de cable desde el punto más bajo:

        $$
        c = \frac{T_O}{q}
        \qquad
        y = c\cosh\frac{x}{c}
        \qquad
        s = c\sinh\frac{x}{c}
        \qquad
        T = q\,y
        $$
      reconocer: |
        Antes de calcular se mira qué une los dos apartados.
    enunciado: |
      El sistema plano de la figura consta de la barra AC, de masa $M$ y
      longitud $L$, unida al suelo con una articulación fija en A y a la
      pared, en su punto C, a través de un resorte de constante
      $k = \frac{5}{2}\frac{Mg}{L}$ y longitud en reposo $L_0 = 0$. En el punto
      B, situado a distancia $3L/4$ de A, se une un cable BD, de peso por
      unidad de longitud $q = \frac{2}{3}\frac{Mg}{L}$ y que soporta una fuerza
      mínima $T_O = \frac{4}{3}Mg$ Los puntos E, C y D están en la misma
      horizontal mientras que E y A se encuentran en la misma vertical. El
      valor del ángulo es $\alpha = 36{,}87^{\circ}$.

      Determinar:

      **b)** (1p) Fuerza del cable en el punto D.

