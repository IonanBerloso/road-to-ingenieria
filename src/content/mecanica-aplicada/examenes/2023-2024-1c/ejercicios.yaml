      A escala, con los negativos hacia abajo. El flector es negativo en toda
      la viga salvo en tres puntos donde vale cero: los dos extremos y el
      centro del vano.

      </figcaption>
      </figure>

      **La sección.** Ala $5e\times 2e$ abajo y alma $e\times 3e$ encima:

      $$
      A = 13e^{2}
      \qquad
      y_G = \frac{10e^{2}\cdot e + 3e^{2}\cdot 3{,}5e}{13e^{2}} = 1{,}577\,e
      $$

      $$
      I = \frac{5e\,(2e)^{3}}{12} + 10e^{2}\,(0{,}577e)^{2} +
      \frac{e\,(3e)^{3}}{12} + 3e^{2}\,(1{,}923e)^{2} = 20{,}006\,e^{4}
      $$

      La punta del alma está a $5e - 1{,}577e = 3{,}423e$ del eje neutro, y la
      base del ala a $1{,}577e$.

      **b1) Tensión normal máxima.** El flector de mayor valor absoluto es
      $-q_0L^{2}/2$, en B y en C. Al ser negativo tracciona la fibra superior,
      que además es la más alejada del eje neutro. Con
      $q_0 = 18000\cdot 13e^{2}$ N/m y $L = 2$ m:

      $$
      \sigma_{\max} = \frac{q_0L^{2}}{2}\cdot\frac{3{,}423e}{20{,}006e^{4}}
      = \frac{18000\cdot 13\cdot 2\cdot 3{,}423}{20{,}006}\cdot\frac{1}{e}
      = \frac{80\,074}{e}\ \text{Pa}
      $$

      con $e$ en metros: es **de tracción**, en la fibra superior —la punta
      del alma— de las secciones de los apoyos **B y C**. La fibra inferior de
      esas mismas secciones está comprimida, con $36\,888/e$ Pa.

      **b2) La dimensión e.** Igualando a la admisible:

      $$
      \frac{80\,074}{e} = 200\cdot 10^{6}
      \quad\Rightarrow\quad
      e = 4{,}004\cdot 10^{-4}\ \text{m} = 0{,}400\ \text{mm}
      $$

      **Comprobación.** Con $e = 0{,}4004$ mm, $q_0 = 0{,}0375$ N/m,
      $|M|_{\max} = 0{,}0750$ N·m e $I = 5{,}13\cdot 10^{-13}$ m⁴, y la fibra
      superior da exactamente 200 MPa. El resultado es pequeño porque la viga
      solo soporta su propio peso: la tensión va como $1/e$, así que una viga
      más gruesa trabaja **menos**, no más.
