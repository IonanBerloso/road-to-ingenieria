              **En A, $A_x$ y $A_y$, y ningún par.**
            porque: |
              Una articulación impide que el punto se mueva en las dos
              direcciones, pero deja girar.
          - punto: |
              **El peso $Mg$ en el centro G.**
            porque: |
              La barra es homogénea: su peso actúa en la mitad, y su brazo
              respecto de A entra en la ecuación de momentos.
          - punto: |
              **En C, la fuerza del resorte, horizontal y hacia E.**
            porque: |
              Un resorte tira a lo largo de su eje, y E está a la altura de C.
          - punto: |
              **En B, la fuerza del cable, tangente a él: una componente
              horizontal hacia la derecha y una vertical hacia abajo.**
            porque: |
              Un cable tira a lo largo de sí mismo, y desde B sale hacia la
              derecha y baja hacia su punto más bajo.
