      </figcaption>
      </figure>
    pide: >-
      El diagrama de sólido libre de la barra y la componente vertical de la
      fuerza que el cable ejerce en B.
    pasos:
      - tipo: reconocer
        pregunta: |
          El resorte tiene longitud en reposo $L_0 = 0$. ¿Qué fuerza hace sobre
          la barra en C?
        opciones:
          - texto: >-
              $k$ por su longitud entera, $k\cdot\overline{EC}$, horizontal y
              tirando de C hacia la pared
            correcta: true
            mensaje: |
              Eso es. Con longitud natural nula, **todo** el resorte está
              estirado: su alargamiento es su longitud, que aquí es la
              distancia horizontal de E a C, $L\cos\alpha = 0{,}8L$.
          - texto: Ninguna, porque la longitud en reposo es cero
            mensaje: |
              Al revés: $L_0 = 0$ significa que el resorte querría encogerse
              hasta un punto, así que cualquier longitud que tenga es
              alargamiento. Es el caso en que el resorte tira **más**, no
              menos.
          - texto: $k\cdot L$, porque la barra mide $L$
            mensaje: |
              La longitud del resorte no es la de la barra. El resorte va de E
              a C en horizontal, y E está en la vertical de A: mide
              $L\cos\alpha$, la proyección horizontal de la barra.

      - tipo: calcular
        titulo: La fuerza del resorte
        pregunta: |
          Con $\cos\alpha = 0{,}8$, ¿cuánto vale la fuerza del resorte, en
          unidades de $Mg$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '2.5'
            mensaje: |
              Has tomado como longitud del resorte la de la barra, $L$. El
              resorte es horizontal y va de la vertical de A hasta C: mide
              $0{,}8L$.
          - valor: '1.5'
            mensaje: |
              Has usado $L\sin\alpha = 0{,}6L$, la altura de C. Esa es la
              distancia de A a E, no la de E a C, que es la horizontal.
        pista: |
          $F_k = k\,(\overline{EC} - L_0) = \frac{5}{2}\frac{Mg}{L}\cdot 0{,}8L$.
        desarrollo: |
          $$
          F_k = k\,L\cos\alpha = \frac{5}{2}\frac{Mg}{L}\cdot 0{,}8\,L = 2\,Mg
          $$

          Horizontal, tirando de C hacia la pared.

      - tipo: reconocer
        pregunta: |
          ¿Qué se sabe de la fuerza que el cable hace en B antes de calcular
          nada?
        opciones:
          - texto: >-
              Su componente horizontal: vale la fuerza mínima,
              $T_O = \frac{4}{3}Mg$, y apunta hacia el cable, a la derecha
            correcta: true
            mensaje: |
              Eso es. En un cable con peso la componente horizontal de la
              tensión es la misma en todos sus puntos, y es la tensión del
              punto más bajo, que es la mínima. La vertical es la incógnita.
          - texto: Su módulo, $\frac{4}{3}Mg$, porque es la fuerza del cable
            mensaje: |
              $T_O$ es la fuerza **mínima**, la del punto más bajo. En B el
              cable está inclinado y la tensión es mayor: solo su componente
              horizontal coincide con $T_O$.
          - texto: Que es vertical, porque el cable cuelga
            mensaje: |
              El cable cuelga, pero no es vertical en B: sale inclinado hacia
              su punto más bajo. Una tensión vertical en B exigiría que no
              hubiera componente horizontal, y entonces $T_O$ sería cero.

      - tipo: calcular
        titulo: La componente vertical en B
        pregunta: |
          Tomando momentos respecto de A, ¿cuánto vale la componente vertical
          de la fuerza del cable sobre la barra en B, en unidades de $Mg$? Da
          el módulo; el sentido se discute en el paso siguiente.
        respuesta:
          tipo: numero
          valor: '0.3333'
          tolerancia: 0.005
          formato: un número, vale la forma exacta
        distractores:
          - valor: '1.3333'
            mensaje: |
              Te has olvidado del momento de la componente horizontal del
              cable. Actúa en B, a una altura $0{,}45L$ sobre A, y da
              $\frac{4}{3}Mg\cdot 0{,}45L = 0{,}6\,MgL$: no se puede tratar el
              cable como si tirara solo en vertical.
          - valor: '0.8333'
            mensaje: |
              Es el error del resorte arrastrado: con la longitud del resorte
              igual a $L$ sale una fuerza de $2{,}5Mg$ y su momento cambia.
              Revisa la fuerza del paso anterior.
          - valor: '0.5'
            mensaje: |
              El brazo del peso. El peso es vertical y actúa en el centro de
              la barra, así que su brazo respecto de A es la distancia
              **horizontal**, $\frac{L}{2}\cos\alpha = 0{,}4L$, no la altura.
        pista: |
          Con A en el origen, $C = (0{,}8L,\,0{,}6L)$, $G = (0{,}4L,\,0{,}3L)$ y
          $B = (0{,}6L,\,0{,}45L)$. El resorte y la componente horizontal del
          cable dan momento por su brazo vertical; el peso y la componente
          vertical, por el horizontal.
        desarrollo: |
          Con el sentido antihorario positivo y $V_B$ hacia abajo:

          $$
          \sum M_A = 2Mg\cdot 0{,}6L - Mg\cdot 0{,}4L -
          \frac{4}{3}Mg\cdot 0{,}45L - V_B\cdot 0{,}6L = 0
          $$

          $$
          1{,}2 - 0{,}4 - 0{,}6 = 0{,}6\,\frac{V_B}{Mg}
          \quad\Rightarrow\quad
          V_B = \frac{Mg}{3}
          $$

          Sale positivo: el cable tira de B **hacia abajo**, como debe ser en
          un cable que sale de B descendiendo hacia su punto más bajo.

      - tipo: justificar
        pregunta: Ordena la resolución del apartado a). Una pieza es falsa.
        piezas:
          - texto: >-
              En el sólido libre entran la reacción en A, con dos componentes;
              el peso $Mg$ en el centro; el resorte en C, y el cable en B,
              tangente al cable.
          - texto: >-
              El resorte tiene longitud natural nula, así que su fuerza es $k$
              por su longitud, $0{,}8L$: vale $2Mg$ y tira de C hacia E.
          - texto: >-
              La componente horizontal del cable en B es la fuerza mínima,
              $\frac{4}{3}Mg$, hacia la derecha.
          - texto: >-
              Momentos respecto de A: $V_B = Mg/3$, hacia abajo. Y de las
              fuerzas, $A_x = \frac{2}{3}Mg$ y $A_y = \frac{4}{3}Mg$.
          - texto: >-
              Como la longitud en reposo es cero, el resorte no ejerce fuerza
              y la barra solo la sujetan A y el cable.
            trampa: true
            mensaje: |
              $L_0 = 0$ quiere decir que todo el resorte es alargamiento: su
              fuerza es $k$ por su longitud entera, $2Mg$, la mayor de todas las
              que actúan sobre la barra. Sin ella el equilibrio de momentos no
              cierra con ningún $V_B$ positivo.
    resolucion: |
      **Geometría.** Con A en el origen, $\cos\alpha = 0{,}8$ y
      $\sin\alpha = 0{,}6$ (es el ángulo del triángulo 3-4-5):

      $$
      C = (0{,}8L,\;0{,}6L)
      \qquad
      B = (0{,}6L,\;0{,}45L)
      \qquad
      G = (0{,}4L,\;0{,}3L)
      $$

      E está en la vertical de A y a la altura de C, así que el resorte es
      horizontal y mide $\overline{EC} = 0{,}8L$.

      **Sólido libre de la barra.** Cuatro acciones:

      - la articulación A, con componentes $A_x$ y $A_y$;
      - el peso $Mg$, vertical, en el centro G;
      - el resorte en C, horizontal y hacia E, de valor
        $F_k = k\,(0{,}8L - L_0) = \frac{5}{2}\frac{Mg}{L}\cdot 0{,}8L = 2Mg$;
      - el cable en B, tangente al cable y hacia él: su componente
        horizontal es la fuerza mínima, $T_O = \frac{4}{3}Mg$, hacia la
        derecha, y la vertical, $V_B$, es la incógnita.

      **Momentos respecto de A**, antihorario positivo y $V_B$ supuesta hacia
      abajo:

      $$
      2Mg\cdot 0{,}6L - Mg\cdot 0{,}4L - \frac{4}{3}Mg\cdot 0{,}45L -
      V_B\cdot 0{,}6L = 0
      \quad\Rightarrow\quad
      V_B = \frac{Mg}{3}
      $$

      El signo confirma el sentido: el cable tira de la barra hacia abajo.

      **La reacción en A**, que completa el diagrama:

      $$
      A_x = 2Mg - \frac{4}{3}Mg = \frac{2}{3}Mg
      \qquad
      A_y = Mg + \frac{Mg}{3} = \frac{4}{3}Mg
      $$

      **Comprobación.** Con estos valores, la suma de momentos respecto de B
      también es nula.

  # ── Ejercicio 1 de la hoja de ejercicios (n 5), apartado b) · la fuerza del
  #    cable en D. Tema 5.
  - id: exma2324-1c-5-la-fuerza-del-cable-en-d
    titulo: La fuerza del cable en su amarre D
    fuente: >-
      Apartado b) del ejercicio 1 · Examen de enero de 2024 del bloque 1
      (Estática) · Mecánica Aplicada, Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU). La hoja de ejercicios del original lleva impresa la fecha 18
      de enero de 2023, aunque va en el mismo PDF que la teoría del 17 de
      enero de 2024. El examen no publica resolución; el desarrollo es
      nuestro.
    nivel: examen
    enunciado: |
      El sistema plano de la figura consta de la barra AC, de masa $M$ y
      longitud $L$, unida al suelo con una articulación fija en A y a la
      pared, en su punto C, a través de un resorte de constante
      $k = \frac{5}{2}\frac{Mg}{L}$ y longitud en reposo $L_0 = 0$. En el punto
      B, situado a distancia $3L/4$ de A, se une un cable BD, de peso por
      unidad de longitud $q = \frac{2}{3}\frac{Mg}{L}$ y que soporta una fuerza
      mínima $T_O = \frac{4}{3}Mg$ Los puntos E, C y D están en la misma
      horizontal mientras que E y A se encuentran en la misma vertical. El
      valor del ángulo es $\alpha = 36{,}87^{\circ}$.

      Determinar:

      **b)** (1p) Fuerza del cable en el punto D.

      <figure class="figura-examen">
      <svg viewBox="20 40 660 262" role="img" width="660" height="262"
           aria-labelledby="ma2324e5bt ma2324e5bd">
