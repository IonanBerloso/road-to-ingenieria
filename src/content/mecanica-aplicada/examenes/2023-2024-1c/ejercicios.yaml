ejercicios:
  # ── Cuestión 1 de teoría (n 1) · el momento en O de tres vectores
  #    deslizantes, sabiendo el invariante escalar y un punto del eje central.
  - id: exma2324-1c-1-el-momento-en-el-origen
    titulo: El momento en el origen sabiendo por dónde pasa el eje central
    fuente: >-
      Cuestión 1 de teoría · Examen de enero de 2024 del bloque 1 (Estática) ·
      Mecánica Aplicada, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen no publica resolución; el desarrollo es nuestro.
    nivel: examen
    enunciado: |
      Sea el sistema vectorial formado por tres vectores deslizantes:

      $$
      \begin{aligned}
      \vec{v}_1 &= 3\hat{\imath} - 2\hat{\jmath}\\
      \vec{v}_2 &= -\hat{\imath} - \hat{\jmath} - \hat{k}\\
      \vec{v}_3 &= 2\hat{\imath} + 3\hat{\jmath} - 2\hat{k}
      \end{aligned}
      $$

      Se sabe que el invariante escalar del sistema es 25 y que el eje central
      pasa por el punto P(3;2;5). Calcular el momento que producen los
      vectores respecto al origen O(0;0;0).
    pide: El momento resultante del sistema respecto del origen.
    pasos:
      - tipo: reconocer
        pregunta: |
          P está en el eje central y el invariante escalar vale 25. ¿Qué
          momento tiene el sistema en P?
        opciones:
          - texto: >-
              El momento mínimo, paralelo a la resultante:
              $\vec{M}_P = \dfrac{\mathcal{W}}{R^{2}}\,\vec{R}$
            correcta: true
            mensaje: |
              Eso es. El eje central es el lugar de los puntos de momento
              mínimo, y ese momento tiene la dirección de $\vec{R}$ y por
              módulo la proyección $\mathcal{W}/R$. Conocido en P, se lleva a O
              con la ecuación del campo de momentos.
          - texto: Cero, porque P está en el eje central
            mensaje: |
              Eso es el teorema de Varignon, y solo vale cuando el invariante
              escalar es **nulo**. Aquí $\mathcal{W} = 25$: el sistema no se
              reduce a una resultante sola, sino a la resultante más un
              momento mínimo que no se anula en ningún punto.
          - texto: >-
              Un vector de módulo 25, porque el invariante escalar es el
              módulo del momento en el eje central
            mensaje: |
              El invariante es $\mathcal{W} = \vec{M}\cdot\vec{R}$, un producto
              escalar, no un módulo. El módulo del momento mínimo es
              $\mathcal{W}/R$, y aquí $R = 5$: sale 5, no 25.

      - tipo: calcular
        titulo: El módulo del momento mínimo
        pregunta: |
          Con la resultante $\vec{R} = \vec{v}_1 + \vec{v}_2 + \vec{v}_3$,
          ¿cuánto vale el módulo del momento en el eje central?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '25'
            mensaje: |
              Has tomado el invariante como si fuera el módulo. El invariante
              es $\vec{M}\cdot\vec{R}$, que es módulo por módulo: hay que
              dividir entre $R = 5$ para quedarte con la proyección.
          - valor: '1'
            mensaje: |
              Eso es $\mathcal{W}/R^{2}$, el factor que multiplica al vector
              $\vec{R}$, no el módulo del momento. Multiplicado por
              $|\vec{R}| = 5$ da el módulo.
        pista: |
          $\vec{R} = (4,\,0,\,-3)$, así que $R = 5$. El módulo del momento
          mínimo es $\mathcal{W}/R$.
        desarrollo: |
          $$
          \vec{R} = (3 - 1 + 2,\; -2 - 1 + 3,\; 0 - 1 - 2) = (4,\,0,\,-3)
          \qquad R = 5
          $$

          $$
          |\vec{M}_{\min}| = \frac{\mathcal{W}}{R} = \frac{25}{5} = 5
          \qquad
          \vec{M}_{\min} = \frac{\mathcal{W}}{R^{2}}\,\vec{R} = (4,\,0,\,-3)
          $$

      - tipo: calcular
        titulo: El momento en el origen
        pregunta: |
          Con $\vec{M}_O = \vec{M}_P + \overrightarrow{OP}\times\vec{R}$,
          ¿cuánto vale $\vec{M}_O$?
        respuesta:
          tipo: vector
          valor: '(-2, 29, -11)'
          tolerancia: 0.01
          formato: tres coordenadas entre paréntesis, separadas por comas
        distractores:
          - valor: '(10, -29, 5)'
            mensaje: |
              El signo del término de traslado. La ecuación del campo es
              $\vec{M}_{O'} = \vec{M}_O + \overrightarrow{O'O}\times\vec{R}$:
              para ir de P a O el vector es $\overrightarrow{OP}$, del punto
              nuevo al viejo. Fíjate en que este resultado **también** cumple
              $\vec{M}\cdot\vec{R} = 25$, así que la comprobación del
              invariante no lo caza.
          - valor: '(-6, 29, -8)'
            mensaje: |
              Te has quedado solo con $\overrightarrow{OP}\times\vec{R}$, como
              si el momento en P fuera nulo. Eso es Varignon, y aquí no vale:
              con $\mathcal{W} \ne 0$ el momento en el eje central es el
              mínimo, $(4, 0, -3)$. Compruébalo: tu vector da
              $\vec{M}\cdot\vec{R} = 0$, no 25.
          - valor: '(14, 29, -23)'
            mensaje: |
              Has escrito el momento mínimo como $(\mathcal{W}/R)\,\vec{R}$, y
              $\vec{R}$ no es unitario. O se usa $(\mathcal{W}/R)\,\vec{u}_R$ o
              $(\mathcal{W}/R^{2})\,\vec{R}$: las dos dan $(4, 0, -3)$.
        pista: |
          $\overrightarrow{OP}\times\vec{R} = (3, 2, 5)\times(4, 0, -3)$, y a
          eso se le suma $(4, 0, -3)$.
        desarrollo: |
          $$
          \overrightarrow{OP}\times\vec{R} =
          \begin{vmatrix}
          \hat{\imath} & \hat{\jmath} & \hat{k}\\
          3 & 2 & 5\\
          4 & 0 & -3
          \end{vmatrix}
          = (-6,\;29,\;-8)
          $$

          $$
          \vec{M}_O = (4,\,0,\,-3) + (-6,\,29,\,-8) = (-2,\;29,\;-11)
          $$

          Comprobación: $\vec{M}_O\cdot\vec{R} = -8 + 0 + 33 = 25$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La resultante es la suma de los tres vectores,
              $\vec{R} = (4, 0, -3)$, con módulo 5.
          - texto: >-
              En el eje central el momento es el mínimo y va en la dirección
              de la resultante:
              $\vec{M}_P = (\mathcal{W}/R^{2})\,\vec{R} = (4, 0, -3)$.
          - texto: >-
              Se lleva a O con el campo de momentos,
              $\vec{M}_O = \vec{M}_P + \overrightarrow{OP}\times\vec{R}$, y sale
              $(-2, 29, -11)$.
          - texto: >-
              Y se comprueba con el invariante: $\vec{M}_O\cdot\vec{R} = 25$.
          - texto: >-
              Como P está en el eje central, el momento en P es nulo y
              $\vec{M}_O = \overrightarrow{OP}\times\vec{R}$.
            trampa: true
            mensaje: |
              Eso solo pasa si el invariante escalar es cero (Varignon). Con
              $\mathcal{W} = 25$ el momento en cualquier punto del eje central
              es el momento mínimo, $(4, 0, -3)$, y olvidarlo da un
              $\vec{M}_O$ perpendicular a $\vec{R}$ que viola el propio dato
              del enunciado.
    resolucion: |
      **La resultante.** Es el invariante vectorial, la suma de los tres
      vectores libres equipolentes:

      $$
      \vec{R} = \vec{v}_1 + \vec{v}_2 + \vec{v}_3 = (4,\,0,\,-3)
      \qquad R = 5
      $$

      **El momento en el eje central.** El eje central es el lugar de los
      puntos de momento mínimo, y ese momento es paralelo a la resultante y
      tiene por módulo la proyección $\mathcal{W}/R$:

      $$
      \vec{M}_P = \vec{M}_{\min} = \frac{\mathcal{W}}{R^{2}}\,\vec{R}
      = \frac{25}{25}\,(4,\,0,\,-3) = (4,\,0,\,-3)
      $$

      **El traslado a O.** Con la ecuación del campo de momentos,
      $\vec{M}_{O'} = \vec{M}_O + \overrightarrow{O'O}\times\vec{R}$, tomando
      O como punto nuevo y P como viejo:

      $$
      \overrightarrow{OP}\times\vec{R} = (3,\,2,\,5)\times(4,\,0,\,-3)
      = (-6,\;29,\;-8)
      $$

      $$
      \vec{M}_O = (4,\,0,\,-3) + (-6,\,29,\,-8)
      = -2\,\hat{\imath} + 29\,\hat{\jmath} - 11\,\hat{k}
      $$

      **Comprobación.** $\vec{M}_O\cdot\vec{R} = -8 + 0 + 33 = 25$, que es el
      invariante escalar del enunciado. Y a la vuelta, llevando $\vec{M}_O$ de
      nuevo a P, se recupera $(4, 0, -3)$, paralelo a $\vec{R}$, como debe
      ser en un punto del eje central.

      **El error que el invariante no caza.** Si se equivoca el signo del
      término de traslado sale $(10, -29, 5)$, que también cumple
      $\vec{M}\cdot\vec{R} = 25$: el producto vectorial es perpendicular a
      $\vec{R}$ y no cambia la proyección. La comprobación que sí lo
      distingue es la de volver a P.

  # ── Cuestión 2 de teoría (n 2) · deducir s y T de la catenaria.
  - id: exma2324-1c-2-la-longitud-y-la-tension-de-la-catenaria
    titulo: La longitud de arco y la tensión de la catenaria, deducidas
    fuente: >-
      Cuestión 2 de teoría · Examen de enero de 2024 del bloque 1 (Estática) ·
      Mecánica Aplicada, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen no publica resolución; el desarrollo es nuestro.
    nivel: examen
    enunciado: |
      Para un cable que pesa $w$ por unidad de longitud de cable, deducir la
      longitud $s$ respecto del punto más bajo y la tensión $T$ para un punto
      P cualquiera del cable, a partir de las siguientes relaciones:

      $$
      y = c\cosh\left(\frac{x}{c}\right)
      \qquad
      \cosh^{2}\left(\frac{x}{c}\right) - \sinh^{2}\left(\frac{x}{c}\right) = 1
      $$
    pide: >-
      La expresión de la longitud de arco desde el punto más bajo y la de la
      tensión en un punto cualquiera.
    pasos:
      - tipo: reconocer
        pregunta: |
          Para sacar $s$ de la curva $y(x)$, ¿de qué se parte?
        opciones:
          - texto: >-
              Del elemento de arco,
              $ds = \sqrt{1 + (dy/dx)^{2}}\;dx$, integrado desde el punto más
              bajo
            correcta: true
            mensaje: |
              Eso es, y es donde entra la identidad del enunciado: con
              $y' = \sinh(x/c)$, la raíz $\sqrt{1 + \sinh^{2}}$ es
              exactamente $\cosh$ y la integral se hace sola.
          - texto: >-
              De $s = y - c$, la altura del punto sobre el vértice
            mensaje: |
              Eso es la flecha del punto P, no la longitud del cable hasta él.
              Un tramo de cable casi horizontal es largo y apenas sube: las
              dos cosas no pueden coincidir.
          - texto: De $s = x$, porque el cable se reparte a lo largo de la abscisa
            mensaje: |
              Eso es justo lo que **no** hace una catenaria: el peso va por
              unidad de longitud de cable, no de abscisa. Si fuera por abscisa
              la curva sería una parábola, que es el otro caso del tema.

      - tipo: redactar
        que: deduccion
        consigna: |
          En papel, como lo entregarías: **deduce $s(x)$ y $T(x)$ a partir de
          las dos relaciones del enunciado**, y termina escribiendo $T$ en
          función de $y$. Media cara.
        rubrica:
          - punto: |
              **El elemento de arco y la derivada.** Escribir
              $ds = \sqrt{1 + y'^{2}}\,dx$ y derivar la curva:
              $y' = \sinh(x/c)$.
            porque: |
              Es el arranque obligado. Sin escribir $ds$ no hay nada que
              integrar, y quien pone directamente $s = c\sinh(x/c)$ está
              recitando el resultado, que es lo que la cuestión no pide.
          - punto: |
              **Usar la identidad del enunciado para la raíz.**
              $\sqrt{1 + \sinh^{2}(x/c)} = \cosh(x/c)$, y de ahí
              $s = \int_0^{x}\cosh(x/c)\,dx = c\sinh(x/c)$.
            porque: |
              El enunciado da la identidad **precisamente** para este paso.
              Si no aparece en tu desarrollo, el corrector entiende que no has
              visto dónde se usa. Y los límites importan: se integra desde el
              punto más bajo, que es el origen de $s$.
          - punto: |
              **Las dos componentes de la tensión.** La horizontal es
              constante e igual a la del punto más bajo, $T_0 = wc$; la
              vertical equilibra el peso del tramo OP, $ws$.
            porque: |
              Es el único paso de estática del ejercicio, y se razona aislando
              el tramo OP. Decir de dónde sale $T_0 = wc$ —de la definición del
              parámetro, $c = T_0/w$— es lo que separa una deducción de una
              lista de fórmulas.
          - punto: |
              **Componer y simplificar.**
              $T = \sqrt{T_0^{2} + w^{2}s^{2}} = w\sqrt{c^{2} + s^{2}}
              = wc\cosh(x/c) = wy$.
            porque: |
              La identidad se usa **una segunda vez**, ahora al revés:
              $1 + \sinh^{2} = \cosh^{2}$. Y el final $T = wy$ es el resultado
              que se usa en los problemas, así que no hay que dejarlo a medias
              en función de $x$.
          - punto: |
              **Una frase de lectura.** La tensión crece con la altura: es
              mínima en el punto más bajo ($T_0$) y máxima en el amarre más
              alto.
            porque: |
              Es la consecuencia que cae en los ejercicios —el cable BD del
              ejercicio 1 de este mismo examen se resuelve con ella— y demuestra
              que se entiende lo deducido.

      - tipo: calcular
        titulo: La longitud a una distancia c del vértice
        pregunta: |
          Comprobación con números: en el punto de abscisa $x = c$, ¿cuánto
          vale $s/c$?
        respuesta:
          tipo: numero
          valor: '1.1752'
          tolerancia: 0.002
          formato: un número con cuatro decimales
        distractores:
          - valor: '1.5431'
            mensaje: |
              Eso es $y/c = \cosh 1$, la ordenada del punto, no la longitud del
              arco. La longitud va con el seno hiperbólico, que es la primitiva
              del coseno.
          - valor: '0.5431'
            mensaje: |
              Eso es $(y - c)/c$, lo que sube el cable desde el vértice. La
              longitud del arco es siempre mayor que lo que sube, porque el
              cable también avanza en horizontal.
        pista: |
          $s = c\sinh(x/c)$, así que en $x = c$ queda $\sinh 1$.
        desarrollo: |
          $$
          \frac{s}{c} = \sinh 1 = \frac{e - e^{-1}}{2} = 1{,}1752
          $$

          Integrando numéricamente $\sqrt{1 + \sinh^{2}(x/c)}$ entre 0 y $c$
          sale lo mismo, 1,1752.

      - tipo: calcular
        titulo: La tensión en ese mismo punto
        pregunta: |
          Y en $x = c$, ¿cuánto vale $T$ en unidades de $wc$?
        respuesta:
          tipo: numero
          valor: '1.5431'
          tolerancia: 0.002
          formato: un número con cuatro decimales
        distractores:
          - valor: '1.1752'
            mensaje: |
              Eso es $ws/(wc)$, solo la componente vertical: el peso del tramo
              OP. Falta la horizontal, $T_0 = wc$, que es la misma en todo el
              cable.
          - valor: '1'
            mensaje: |
              Eso es $T_0/(wc)$, la tensión del punto más bajo. En P la
              componente horizontal es la misma, pero se le suma la vertical,
              y la tensión crece.
        pista: |
          $T = \sqrt{T_0^{2} + w^{2}s^{2}}$, con $T_0 = wc$ y $s = c\sinh 1$.
        desarrollo: |
          $$
          \frac{T}{wc} = \sqrt{1 + \sinh^{2}1} = \cosh 1 = 1{,}5431
          $$

          Y coincide con $y/c$ en ese punto, que es la forma $T = wy$.

      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              El elemento de arco es $ds = \sqrt{1 + y'^{2}}\,dx$, y derivando
              la curva, $y' = \sinh(x/c)$.
          - texto: >-
              Con la identidad, $\sqrt{1 + \sinh^{2}(x/c)} = \cosh(x/c)$, e
              integrando desde el punto más bajo, $s = c\sinh(x/c)$.
          - texto: >-
              Aislando el tramo OP, la componente horizontal de la tensión es
              $T_0 = wc$ y la vertical es el peso del tramo, $ws$.
          - texto: >-
              Así que $T = \sqrt{T_0^{2} + w^{2}s^{2}} = wc\cosh(x/c) = wy$.
          - texto: >-
              Como el cable pesa $w$ por unidad de longitud, la tensión en P es
              el peso del tramo OP, $T = ws$.
            trampa: true
            mensaje: |
              $ws$ es solo la componente **vertical** de la tensión en P. La
              horizontal, $T_0 = wc$, está en todo el cable —en el punto más
              bajo es la tensión entera—, y hay que componer las dos.
    resolucion: |
      **La longitud.** El elemento de arco de una curva $y(x)$ es
      $ds = \sqrt{1 + y'^{2}}\,dx$. De la curva del enunciado:

      $$
      y' = \frac{dy}{dx} = \sinh\left(\frac{x}{c}\right)
      \quad\Rightarrow\quad
      \sqrt{1 + y'^{2}} = \sqrt{1 + \sinh^{2}\left(\frac{x}{c}\right)}
      = \cosh\left(\frac{x}{c}\right)
      $$

      donde se ha usado la identidad $\cosh^{2} - \sinh^{2} = 1$. Integrando
      desde el punto más bajo, que está en $x = 0$:

      $$
      s = \int_0^{x}\cosh\left(\frac{x}{c}\right)dx
      = c\,\sinh\left(\frac{x}{c}\right)
      $$

      **La tensión.** Aislando el tramo OP, la componente horizontal de la
      tensión es la misma que en el punto más bajo, $T_0$, y por la definición
      del parámetro de la catenaria, $c = T_0/w$, vale $T_0 = wc$. La
      componente vertical equilibra el peso del tramo, $ws$. Componiendo:

      $$
      T = \sqrt{T_0^{2} + w^{2}s^{2}} = w\sqrt{c^{2} + s^{2}}
      = wc\sqrt{1 + \sinh^{2}\left(\frac{x}{c}\right)}
      = wc\,\cosh\left(\frac{x}{c}\right)
      $$

      y como $y = c\cosh(x/c)$:

      $$
      T = w\,y
      $$

      **Lectura.** La tensión es proporcional a la ordenada medida desde la
      directriz, así que es mínima en el punto más bajo —$T_0 = wc$— y máxima
      en el amarre más alto. Entre dos puntos cualesquiera,
      $T_2 - T_1 = w\,(y_2 - y_1)$: es la forma que resuelve el apartado b)
      del ejercicio 1 de este mismo examen.

      **Comprobación con números.** En $x = c$: $s/c = \sinh 1 = 1{,}1752$ y
      $T/(wc) = \cosh 1 = 1{,}5431$, y una integración numérica del elemento
      de arco da la misma longitud.

  # ── Cuestión 3 de teoría (n 3) · el disco con resistencia a la rodadura en
  #    un plano inclinado. El enunciado es simbólico; las cuentas de
  #    comprobación usan valores nuestros, declarados en la pregunta.
  - id: exma2324-1c-3-el-disco-que-no-debe-rodar-cuesta-abajo
    titulo: La fuerza mínima para que un disco no ruede cuesta abajo
    fuente: >-
      Cuestión 3 de teoría · Examen de enero de 2024 del bloque 1 (Estática) ·
      Mecánica Aplicada, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen no publica resolución; el desarrollo es nuestro.
    nivel: examen
    antes:
      idea: |
        Un disco real no toca el plano en un punto: los dos se deforman un poco
        y la reacción se reparte en una zona pequeña. Su resultante no tiene
        por qué pasar por el punto de contacto geométrico; puede desplazarse,
        como mucho, una distancia $\mu_r$, la resistencia a la rodadura, que es
        una longitud.
      formula: |
        El rozamiento estático y el equilibrio en el plano:

        $$
        |F_r| \le \mu_s\,N
        \qquad
        \sum F_x = 0 \quad \sum F_y = 0 \quad \sum M = 0
        $$

        Rodar sin deslizar exige que el rozamiento necesario no pase de
        $\mu_s N$.
      reconocer: |
        Antes de plantear se mira hacia dónde tiende a moverse el disco.
    enunciado: |
      Un disco de masa $M$ y radio $R$ y resistencia a la rodadura $\mu_r$
      está colocado encima de un plano inclinado que forma un ángulo $\beta$
      con la horizontal. En el centro del disco, se aplica una fuerza $F$
      paralela al plano, para que el disco no comience a rodar hacia abajo.
      Determinar el **valor mínimo de $F$** y el coeficiente de rozamiento
      $\mu_s$ mínimo para asegurar la rodadura.
    pide: >-
      La fuerza mínima paralela al plano y el coeficiente de rozamiento
      mínimo para que el disco ruede sin deslizar.
    pasos:
      - tipo: reconocer
        pregunta: |
          Con el disco a punto de rodar hacia abajo, ¿dónde actúa la
          resultante de la reacción del plano?
        opciones:
          - texto: >-
              Desplazada una distancia $\mu_r$ hacia abajo del plano, hacia
              donde tiende a rodar el disco
            correcta: true
            mensaje: |
              Eso es. El contacto no es un punto: la presión se reparte y su
              resultante avanza hacia el lado del movimiento inminente, hasta
              un máximo de $\mu_r$. Por eso $\mu_r$ es una longitud, y el
              cociente $\mu_r/R$ hace de coeficiente de rozamiento
              equivalente.
          - texto: En el punto de contacto geométrico, bajo el centro
            mensaje: |
              Eso es el disco rígido ideal, sin resistencia a la rodadura. Con
              ese modelo cualquier desequilibrio lo haría rodar, y el dato
              $\mu_r$ del enunciado no entraría en ninguna ecuación.
          - texto: Desplazada $\mu_r$ hacia arriba del plano
            mensaje: |
              Ese es el caso contrario: el disco a punto de rodar **hacia
              arriba**, que es el que da la fuerza máxima. La resultante se
              desplaza siempre hacia donde tiende a ir el disco.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna ecuación: **el disco sin el plano**, a
          punto de rodar hacia abajo, con todo lo que actúa sobre él.
        comprueba:
          - punto: |
              **El peso $Mg$ y la fuerza F en el centro, F paralela al plano y
              hacia arriba.**
            porque: |
              El peso es lo que lo hace rodar; F, lo que lo sujeta.
          - punto: |
              **La normal N, perpendicular al plano, desplazada $\mu_r$ hacia
              abajo del contacto geométrico.**
            porque: |
              A punto de rodar hacia abajo, la reacción se adelanta hacia donde
              tiende a ir el disco, hasta su máximo.
          - punto: |
              **El rozamiento $F_r$ en ese mismo punto, a lo largo del plano.**
            porque: |
              Es lo que impide que el disco deslice. Su sentido lo da el
              equilibrio a lo largo del plano.
        figura: |
          <svg viewBox="10 42 262 168" role="img" width="262" height="168" aria-labelledby="dsl-t dsl-d">
