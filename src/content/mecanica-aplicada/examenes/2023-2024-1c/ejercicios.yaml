      b2) La dimensión e. Igualando a la admisible:

      $$
      \frac{80\,074}{e} = 200\cdot 10^{6}
      \quad\Longrightarrow\quad
      e = 4{,}004\cdot 10^{-4}\ \text{m} = 0{,}400\ \text{mm}
      $$

      **5. Comprobación.** Lo que no se ha usado. Los momentos de la viga
      entera respecto de C: $-B_y\cdot 2L + 4q_0L\cdot L = 0$, así que
      $B_y = 2q_0L$, lo mismo. El flector en C desde el otro lado: el voladizo
      CD, con $q_0L$ a $L/2$, da $-q_0L^{2}/2$, y la fórmula del tramo BC en
      $x = 3L$, $-\tfrac{9}{2}q_0L^{2} + 4q_0L^{2}$, lo mismo. Y la inercia por
      otro camino: respecto de la base,

      $$
      I_{\text{base}} = \frac{5e\,(2e)^{3}}{3} + \frac{e\,(3e)^{3}}{12}
      + 3e^{2}\,(3{,}5e)^{2} = 52{,}333\,e^{4},
      \qquad
      I = I_{\text{base}} - 13e^{2}\,y_G^{2} = 52{,}333 - 32{,}327 = 20{,}006\,e^{4}
      $$

      Con $e = 0{,}4004$ mm, $q_0 = 0{,}0375$ N/m, $|M|_{\max} = 0{,}0750$ N·m
      e $I = 5{,}14\cdot 10^{-13}$ m⁴, y la fibra superior da los 200 MPa.

      **Lo que dice el resultado.** Los voladizos descargan el vano: cada uno
      mete $-q_0L^{2}/2$ sobre su apoyo, justo lo que la carga del vano sube,
      y en el centro queda cero. Sin voladizos, una viga de luz $2L$ tendría
      su máximo, $q_0L^{2}/2$, en el centro; con ellos, el mismo valor pasa a
      los apoyos y cambia de signo, y con él la fibra que tracciona. El
      resultado es pequeño porque la viga solo soporta su propio peso: la
      tensión va como $1/e$, así que una viga más gruesa trabaja **menos**, no
      más. Y la T está puesta con el ala abajo: con flector negativo, la punta
      del alma tracciona. En un material que resista peor a tracción, la T
      iría al revés, con el ala arriba, y la tracción máxima bajaría al 46 %.
