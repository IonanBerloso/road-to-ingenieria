      <figcaption>

      Los dos sólidos por separado. En B, lo que el disco le hace a la barra y lo contrario sobre el disco. En A, el rozamiento hacia fuera, en contra del arrastre del disco, en su límite. En C, la normal y el rozamiento del suelo. El par P solo actúa sobre el disco. Ejes: x hacia la derecha, y hacia arriba; momentos positivos en sentido antihorario.

      </figcaption>
      </figure>

      - **La geometría.** Con C en el origen, B está en $(0,\,R)$. La barra
        mide $2R$ y B está a una altura $R$, así que forma $30^{\circ}$ con el
        suelo y A está en $(-\sqrt{3}R,\,0)$. Su centro G, en
        $(-\frac{\sqrt{3}}{2}R,\,\frac{R}{2})$, queda a una distancia $R$ de B:
        justo sobre el borde del disco.
      - **La barra**: en A, la normal $N_A$ y el rozamiento $F_A$; su peso
        $Mg$ en G; en B, la fuerza del disco, $B_x$ y $B_y$.
      - **El disco**: su peso $Mg$ y la fuerza de la barra, contraria, los dos
        en B; el par $P$; y en C, la normal $N_C$ y el rozamiento $F_C$.
      - **El sentido en A.** Con $P$ horario, como en la figura, el disco
        tiende a rodar hacia la derecha y arrastra la barra: A tiende a
        deslizar hacia C, y el rozamiento en A apunta hacia la izquierda, con
        $F_A = f\,N_A$.

      **2. Incógnitas.** $N_A$, $F_A$, $B_x$, $B_y$, $N_C$, $F_C$ y $P$: siete.
      Hay tres ecuaciones por sólido y la del rozamiento en su límite, siete
      también.

      **3. Ecuaciones.** La barra, con momentos respecto de B, antihorario
      positivo. Respecto de B, A está en $(-\sqrt{3}R,\,-R)$ y G en
      $(-\frac{\sqrt{3}}{2}R,\,-\frac{R}{2})$:

      $$
      -F_A + B_x = 0,
      \qquad
      N_A - Mg + B_y = 0,
      \qquad
      -\sqrt{3}R\,N_A - R\,F_A + \frac{\sqrt{3}}{2}R\,Mg = 0,
      \qquad
      F_A = \frac{\sqrt{3}}{2}\,N_A
      $$

      El disco, con lo contrario en B y momentos respecto de B, donde solo dan
      momento el rozamiento en C, a una distancia R, y el par:

      $$
      -B_x + F_C = 0,
      \qquad
      N_C - Mg - B_y = 0,
      \qquad
      F_C\,R - P = 0
      $$

      **4. Resultados.** La barra:

      $$
      -\sqrt{3}\,N_A - \frac{\sqrt{3}}{2}\,N_A + \frac{\sqrt{3}}{2}\,Mg = 0
      \quad\Longrightarrow\quad
      N_A = \frac{Mg}{3},
      \qquad
      F_A = \frac{\sqrt{3}}{6}\,Mg \approx 0{,}289\,Mg
      $$

      $$
      B_x = \frac{\sqrt{3}}{6}\,Mg,
      \qquad
      B_y = \frac{2}{3}\,Mg
      $$

      El disco:

      $$
      F_C = \frac{\sqrt{3}}{6}\,Mg,
      \qquad
      N_C = Mg + \frac{2}{3}Mg = \frac{5}{3}\,Mg,
      \qquad
      P = F_C\,R = \frac{\sqrt{3}}{6}\,MgR \approx 0{,}289\,MgR
      $$

      Todas salen positivas: los sentidos supuestos eran los buenos, y el par,
      horario, es el de la figura. Las reacciones enteras, R: la del suelo en
      A y la del disco en B, sobre la barra; la del suelo en C, sobre el
      disco:

      $$
      \vec{R}_A = -\frac{\sqrt{3}}{6}Mg\,\vec{\imath} + \frac{1}{3}Mg\,\vec{\jmath},
      \qquad
      \vec{R}_B = \frac{\sqrt{3}}{6}Mg\,\vec{\imath} + \frac{2}{3}Mg\,\vec{\jmath}
      $$

      $$
      \vec{R}_C = \frac{\sqrt{3}}{6}Mg\,\vec{\imath} + \frac{5}{3}Mg\,\vec{\jmath},
      \qquad
      \vec{P} = -\frac{\sqrt{3}}{6}\,MgR\,\vec{k}
      $$

      **5. Comprobación.** El conjunto de la barra y el disco, que no se ha
      usado: la fuerza de B es interior y se va. En vertical,
      $N_A + N_C = \frac{1}{3}Mg + \frac{5}{3}Mg = 2Mg$, los dos pesos. En
      horizontal, $F_C - F_A = 0$. Y en momentos respecto de C, en $MgR$:

      $$
      \underbrace{-\sqrt{3}\cdot\tfrac{1}{3}}_{N_A}
      + \underbrace{\tfrac{\sqrt{3}}{2}}_{Mg\ \text{barra}}
      - \underbrace{\tfrac{\sqrt{3}}{6}}_{P}
      = \sqrt{3}\left(-\tfrac{2}{6} + \tfrac{3}{6} - \tfrac{1}{6}\right) = 0
      $$

      El rozamiento en A va por el suelo, y el peso del disco, por la
      vertical de C: ninguno da momento.

      **Lo que dice el resultado.** El rozamiento en C no es cero aunque el
      enunciado no dé su coeficiente: es lo único que equilibra el par. Y no
      está en su límite, porque $F_C/N_C = \sqrt{3}/10 \approx 0{,}17$: con
      cualquier coeficiente mayor, el disco no desliza en C. La barra apenas
      carga en A, $Mg/3$: el rozamiento, aplicado por debajo de B, también la
      sostiene, y la articulación se lleva los otros $\frac{2}{3}Mg$.

      Si el par fuera antihorario, la barra sería empujada, A tendería a
      alejarse de C y el rozamiento en A cambiaría de sentido: saldría
      $N_A = Mg$, $F_A = \frac{\sqrt{3}}{2}Mg$, $P = \frac{\sqrt{3}}{2}MgR$,
      $N_C = Mg$ y $F_C = \frac{\sqrt{3}}{2}Mg$. Empujar la barra cuesta un par
      tres veces mayor que arrastrarla, porque el rozamiento en A la aprieta
      contra el suelo en lugar de levantarla. El enunciado no nombra el
      sentido; lo dibuja, y aquí se sigue el dibujo.

  # ── Ejercicio 3 de la hoja de ejercicios (n 7) · la viga con dos voladizos
  #    y la sección en T. Tema 6.
  - id: exma2324-1c-7-la-viga-con-dos-voladizos-y-la-seccion-en-t
    titulo: La viga con dos voladizos y el espesor de su sección en T
    fuente: >-
      Ejercicio 3 · Examen de enero de 2024 del bloque 1 (Estática) · Mecánica
      Aplicada, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). La hoja de
      ejercicios del original lleva impresa la fecha 18 de enero de 2023,
      aunque va en el mismo PDF que la teoría del 17 de enero de 2024. El
      examen no publica resolución; el desarrollo es nuestro.
    nivel: examen
    antes:
      idea: |
        En una viga, las reacciones salen del equilibrio de la viga entera; el
        cortante y el flector de cada sección, del equilibrio del trozo que
        queda a un lado del corte. Y la tensión normal de flexión crece con la
        distancia al eje neutro, que pasa por el centro de gravedad de la
        sección: la fibra más alejada es la que manda.
      formula: |
        Con V la suma de las fuerzas verticales a la izquierda del corte, M
        positivo si tracciona la fibra inferior y q la carga repartida hacia
        abajo:

        $$
        \frac{dV}{dx} = -q
        \qquad
        \frac{dM}{dx} = V
        $$

        El flector tiene sus extremos donde el cortante se anula o cambia de
        signo. Para una sección hecha de rectángulos, con $y_i$ la altura del
        centro de cada uno y $d_i$ su distancia al centro de gravedad, y con y
        la distancia de una fibra al eje neutro:

        $$
        y_G = \frac{\sum A_i\,y_i}{\sum A_i}
        \qquad
        I = \sum\left(I_i + A_i\,d_i^{2}\right)
        \qquad
        |\sigma| = \frac{|M|\,y}{I}
        $$
      reconocer: |
        Antes de calcular se mira cómo está apoyada la viga y dónde está la
        carga.
    enunciado: |
      Para la viga de la figura, determinar:

      **a)** (1p) Diagramas de esfuerzos cortantes y momentos flectores en
      función de $q_0$ y $L$.

      **b)** (1p) Si $q_0$ es el peso propio por unidad de longitud de la viga
      y siendo el peso específico del material $18000\ \text{N/m}^{3}$ y
      $L = 2$ m:

      **b1)** (0,5p) Tensión normal máxima (decir si es de tracción o
      compresión y la sección donde tiene lugar).

      **b2)** (0,5p) Dimensión $e$ de la figura (en mm), siendo la tensión
      admisible por el material $\sigma_0 = 200$ MPa.

