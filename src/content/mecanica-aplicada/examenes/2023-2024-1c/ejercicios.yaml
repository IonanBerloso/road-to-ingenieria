    pide: >-
      Los diagramas de cortantes y flectores, la tensión normal máxima con su
      signo y su sección, y la dimensión e que agota los 200 MPa.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de calcular: ¿dónde está el momento flector de mayor valor
          absoluto en esta viga?
        opciones:
          - texto: >-
              En los apoyos B y C, donde los voladizos cuelgan: el centro del
              vano queda descargado
            correcta: true
            mensaje: |
              Eso es. Cada voladizo da en su apoyo $-q_0L^{2}/2$, y en el vano
              la carga sube el flector exactamente eso: en el centro queda
              cero. Es la gracia de esta proporción, L-2L-L.
          - texto: >-
              En el centro del vano, $q_0(2L)^{2}/8$, como en una viga
              biapoyada
            mensaje: |
              Esa fórmula es de la biapoyada **sin** voladizos. Aquí los dos
              voladizos meten un flector negativo en los apoyos que se
              superpone: $q_0L^{2}/2 - q_0L^{2}/2 = 0$ en el centro.
          - texto: En los extremos A y D, que están más lejos de los apoyos
            mensaje: |
              Un extremo libre sin carga puntual tiene flector nulo: no hay
              nada a su lado que haga momento. El flector de un voladizo es
              máximo en el empotramiento, que aquí es el apoyo.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna ecuación: **la viga entera sin los
          apoyos** y, al lado, **el voladizo AB cortado justo antes de B**.
        comprueba:
          - punto: |
              **En B, $B_x$ y $B_y$; en C, solo $R_C$, vertical.**
            porque: |
              B es una articulación fija: impide que el punto se mueva en las
              dos direcciones. C es un apoyo móvil: solo empuja en vertical.
          - punto: |
              **La carga $q_0$ en toda la viga, de A a D, también sobre los
              voladizos.**
            porque: |
              Es el peso propio, y la viga pesa entera: los voladizos cargan
              igual que el vano.
          - punto: |
              **En el voladizo cortado, la resultante de su carga, $q_0L$, en el
              centro del tramo.**
            porque: |
              Para el equilibrio, una carga uniforme equivale a su resultante
              aplicada en el centro del tramo donde actúa.
          - punto: |
              **En el corte, V hacia abajo y M en sentido antihorario.**
            porque: |
              Son sus sentidos positivos en la cara derecha de un trozo
              izquierdo: V es la suma de las fuerzas verticales a la izquierda,
              y M positivo tracciona la fibra inferior. El signo que salga dirá
              hacia dónde van de verdad.
        figura: |
          <svg viewBox="0 36 524 112" role="img" width="524" height="112" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">Sólidos libres de la viga con dos voladizos: entera y el voladizo AB cortado</title>
            <desc id="dsl-d">a) La viga ABCD entera, sin la articulación de B ni el apoyo móvil de C, que quedan en tenue y a trazos, con la carga q cero repartida en toda su longitud. En B, Bx a lo largo de la viga y By hacia arriba. En C, RC hacia arriba. Cotas L, 2L y L. b) El voladizo AB solo, cortado justo a la izquierda de B, con su carga repartida y su resultante, q cero L, a trazos en el centro del tramo. En el corte, el cortante V hacia abajo y el flector M en sentido antihorario.</desc>
            <defs>
              <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
