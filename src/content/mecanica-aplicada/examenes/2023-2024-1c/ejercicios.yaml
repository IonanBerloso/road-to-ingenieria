ejercicios:
  # ── Cuestión 1 de teoría (n 1) · el momento en O de tres vectores
  #    deslizantes, sabiendo el invariante escalar y un punto del eje central.
  - id: exma2324-1c-1-el-momento-en-el-origen
    titulo: El momento en el origen sabiendo por dónde pasa el eje central
    fuente: >-
      Cuestión 1 de teoría · Examen de enero de 2024 del bloque 1 (Estática) ·
      Mecánica Aplicada, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen no publica resolución; el desarrollo es nuestro.
    nivel: examen
    enunciado: |
      Sea el sistema vectorial formado por tres vectores deslizantes:

      $$
      \begin{aligned}
      \vec{v}_1 &= 3\hat{\imath} - 2\hat{\jmath}\\
      \vec{v}_2 &= -\hat{\imath} - \hat{\jmath} - \hat{k}\\
      \vec{v}_3 &= 2\hat{\imath} + 3\hat{\jmath} - 2\hat{k}
      \end{aligned}
      $$

      Se sabe que el invariante escalar del sistema es 25 y que el eje central
      pasa por el punto P(3;2;5). Calcular el momento que producen los
      vectores respecto al origen O(0;0;0).
    pide: El momento resultante del sistema respecto del origen.
    pasos:
      - tipo: reconocer
        pregunta: |
          P está en el eje central y el invariante escalar vale 25. ¿Qué
          momento tiene el sistema en P?
        opciones:
          - texto: >-
              El momento mínimo, paralelo a la resultante:
              $\vec{M}_P = \dfrac{\mathcal{W}}{R^{2}}\,\vec{R}$
            correcta: true
            mensaje: |
              Eso es. El eje central es el lugar de los puntos de momento
              mínimo, y ese momento tiene la dirección de $\vec{R}$ y por
              módulo la proyección $\mathcal{W}/R$. Conocido en P, se lleva a O
              con la ecuación del campo de momentos.
          - texto: Cero, porque P está en el eje central
            mensaje: |
              Eso es el teorema de Varignon, y solo vale cuando el invariante
              escalar es **nulo**. Aquí $\mathcal{W} = 25$: el sistema no se
              reduce a una resultante sola, sino a la resultante más un
              momento mínimo que no se anula en ningún punto.
          - texto: >-
              Un vector de módulo 25, porque el invariante escalar es el
              módulo del momento en el eje central
            mensaje: |
              El invariante es $\mathcal{W} = \vec{M}\cdot\vec{R}$, un producto
              escalar, no un módulo. El módulo del momento mínimo es
              $\mathcal{W}/R$, y aquí $R = 5$: sale 5, no 25.

      - tipo: calcular
        titulo: El módulo del momento mínimo
        pregunta: |
          Con la resultante $\vec{R} = \vec{v}_1 + \vec{v}_2 + \vec{v}_3$,
          ¿cuánto vale el módulo del momento en el eje central?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '25'
            mensaje: |
              Has tomado el invariante como si fuera el módulo. El invariante
              es $\vec{M}\cdot\vec{R}$, que es módulo por módulo: hay que
              dividir entre $R = 5$ para quedarte con la proyección.
          - valor: '1'
            mensaje: |
              Eso es $\mathcal{W}/R^{2}$, el factor que multiplica al vector
              $\vec{R}$, no el módulo del momento. Multiplicado por
              $|\vec{R}| = 5$ da el módulo.
        pista: |
          $\vec{R} = (4,\,0,\,-3)$, así que $R = 5$. El módulo del momento
          mínimo es $\mathcal{W}/R$.
        desarrollo: |
          $$
          \vec{R} = (3 - 1 + 2,\; -2 - 1 + 3,\; 0 - 1 - 2) = (4,\,0,\,-3)
          \qquad R = 5
          $$

          $$
          |\vec{M}_{\min}| = \frac{\mathcal{W}}{R} = \frac{25}{5} = 5
          \qquad
          \vec{M}_{\min} = \frac{\mathcal{W}}{R^{2}}\,\vec{R} = (4,\,0,\,-3)
          $$

      - tipo: calcular
        titulo: El momento en el origen
        pregunta: |
          Con $\vec{M}_O = \vec{M}_P + \overrightarrow{OP}\times\vec{R}$,
          ¿cuánto vale $\vec{M}_O$?
        respuesta:
          tipo: vector
          valor: '(-2, 29, -11)'
          tolerancia: 0.01
          formato: tres coordenadas entre paréntesis, separadas por comas
        distractores:
          - valor: '(10, -29, 5)'
            mensaje: |
              El signo del término de traslado. La ecuación del campo es
              $\vec{M}_{O'} = \vec{M}_O + \overrightarrow{O'O}\times\vec{R}$:
              para ir de P a O el vector es $\overrightarrow{OP}$, del punto
              nuevo al viejo. Fíjate en que este resultado **también** cumple
              $\vec{M}\cdot\vec{R} = 25$, así que la comprobación del
              invariante no lo caza.
          - valor: '(-6, 29, -8)'
            mensaje: |
              Te has quedado solo con $\overrightarrow{OP}\times\vec{R}$, como
              si el momento en P fuera nulo. Eso es Varignon, y aquí no vale:
              con $\mathcal{W} \ne 0$ el momento en el eje central es el
              mínimo, $(4, 0, -3)$. Compruébalo: tu vector da
              $\vec{M}\cdot\vec{R} = 0$, no 25.
          - valor: '(14, 29, -23)'
            mensaje: |
              Has escrito el momento mínimo como $(\mathcal{W}/R)\,\vec{R}$, y
              $\vec{R}$ no es unitario. O se usa $(\mathcal{W}/R)\,\vec{u}_R$ o
              $(\mathcal{W}/R^{2})\,\vec{R}$: las dos dan $(4, 0, -3)$.
        pista: |
          $\overrightarrow{OP}\times\vec{R} = (3, 2, 5)\times(4, 0, -3)$, y a
          eso se le suma $(4, 0, -3)$.
        desarrollo: |
          $$
          \overrightarrow{OP}\times\vec{R} =
          \begin{vmatrix}
          \hat{\imath} & \hat{\jmath} & \hat{k}\\
          3 & 2 & 5\\
          4 & 0 & -3
          \end{vmatrix}
          = (-6,\;29,\;-8)
          $$

          $$
          \vec{M}_O = (4,\,0,\,-3) + (-6,\,29,\,-8) = (-2,\;29,\;-11)
          $$

          Comprobación: $\vec{M}_O\cdot\vec{R} = -8 + 0 + 33 = 25$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La resultante es la suma de los tres vectores,
              $\vec{R} = (4, 0, -3)$, con módulo 5.
          - texto: >-
              En el eje central el momento es el mínimo y va en la dirección
              de la resultante:
              $\vec{M}_P = (\mathcal{W}/R^{2})\,\vec{R} = (4, 0, -3)$.
          - texto: >-
              Se lleva a O con el campo de momentos,
              $\vec{M}_O = \vec{M}_P + \overrightarrow{OP}\times\vec{R}$, y sale
              $(-2, 29, -11)$.
          - texto: >-
              Y se comprueba con el invariante: $\vec{M}_O\cdot\vec{R} = 25$.
          - texto: >-
              Como P está en el eje central, el momento en P es nulo y
              $\vec{M}_O = \overrightarrow{OP}\times\vec{R}$.
            trampa: true
            mensaje: |
              Eso solo pasa si el invariante escalar es cero (Varignon). Con
              $\mathcal{W} = 25$ el momento en cualquier punto del eje central
              es el momento mínimo, $(4, 0, -3)$, y olvidarlo da un
              $\vec{M}_O$ perpendicular a $\vec{R}$ que viola el propio dato
              del enunciado.
    resolucion: |
      **La resultante.** Es el invariante vectorial, la suma de los tres
      vectores libres equipolentes:

      $$
      \vec{R} = \vec{v}_1 + \vec{v}_2 + \vec{v}_3 = (4,\,0,\,-3)
      \qquad R = 5
      $$

      **El momento en el eje central.** El eje central es el lugar de los
      puntos de momento mínimo, y ese momento es paralelo a la resultante y
      tiene por módulo la proyección $\mathcal{W}/R$:

      $$
      \vec{M}_P = \vec{M}_{\min} = \frac{\mathcal{W}}{R^{2}}\,\vec{R}
      = \frac{25}{25}\,(4,\,0,\,-3) = (4,\,0,\,-3)
      $$

      **El traslado a O.** Con la ecuación del campo de momentos,
      $\vec{M}_{O'} = \vec{M}_O + \overrightarrow{O'O}\times\vec{R}$, tomando
      O como punto nuevo y P como viejo:

      $$
      \overrightarrow{OP}\times\vec{R} = (3,\,2,\,5)\times(4,\,0,\,-3)
      = (-6,\;29,\;-8)
      $$

      $$
      \vec{M}_O = (4,\,0,\,-3) + (-6,\,29,\,-8)
      = -2\,\hat{\imath} + 29\,\hat{\jmath} - 11\,\hat{k}
      $$

      **Comprobación.** $\vec{M}_O\cdot\vec{R} = -8 + 0 + 33 = 25$, que es el
      invariante escalar del enunciado. Y a la vuelta, llevando $\vec{M}_O$ de
      nuevo a P, se recupera $(4, 0, -3)$, paralelo a $\vec{R}$, como debe
      ser en un punto del eje central.

      **El error que el invariante no caza.** Si se equivoca el signo del
      término de traslado sale $(10, -29, 5)$, que también cumple
      $\vec{M}\cdot\vec{R} = 25$: el producto vectorial es perpendicular a
      $\vec{R}$ y no cambia la proyección. La comprobación que sí lo
      distingue es la de volver a P.

  # ── Cuestión 2 de teoría (n 2) · deducir s y T de la catenaria.
  - id: exma2324-1c-2-la-longitud-y-la-tension-de-la-catenaria
    titulo: La longitud de arco y la tensión de la catenaria, deducidas
    fuente: >-
      Cuestión 2 de teoría · Examen de enero de 2024 del bloque 1 (Estática) ·
      Mecánica Aplicada, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen no publica resolución; el desarrollo es nuestro.
    nivel: examen
    enunciado: |
      Para un cable que pesa $w$ por unidad de longitud de cable, deducir la
      longitud $s$ respecto del punto más bajo y la tensión $T$ para un punto
      P cualquiera del cable, a partir de las siguientes relaciones:

      $$
      y = c\cosh\left(\frac{x}{c}\right)
      \qquad
      \cosh^{2}\left(\frac{x}{c}\right) - \sinh^{2}\left(\frac{x}{c}\right) = 1
      $$
    pide: >-
      La expresión de la longitud de arco desde el punto más bajo y la de la
      tensión en un punto cualquiera.
    pasos:
      - tipo: reconocer
        pregunta: |
          Para sacar $s$ de la curva $y(x)$, ¿de qué se parte?
        opciones:
          - texto: >-
              Del elemento de arco,
              $ds = \sqrt{1 + (dy/dx)^{2}}\;dx$, integrado desde el punto más
              bajo
            correcta: true
            mensaje: |
              Eso es, y es donde entra la identidad del enunciado: con
              $y' = \sinh(x/c)$, la raíz $\sqrt{1 + \sinh^{2}}$ es
              exactamente $\cosh$ y la integral se hace sola.
          - texto: >-
              De $s = y - c$, la altura del punto sobre el vértice
            mensaje: |
              Eso es la flecha del punto P, no la longitud del cable hasta él.
              Un tramo de cable casi horizontal es largo y apenas sube: las
              dos cosas no pueden coincidir.
          - texto: De $s = x$, porque el cable se reparte a lo largo de la abscisa
            mensaje: |
              Eso es justo lo que **no** hace una catenaria: el peso va por
              unidad de longitud de cable, no de abscisa. Si fuera por abscisa
              la curva sería una parábola, que es el otro caso del tema.

      - tipo: redactar
        consigna: |
          En papel, como lo entregarías: **deduce $s(x)$ y $T(x)$ a partir de
          las dos relaciones del enunciado**, y termina escribiendo $T$ en
          función de $y$. Media cara.
        rubrica:
          - punto: |
              **El elemento de arco y la derivada.** Escribir
              $ds = \sqrt{1 + y'^{2}}\,dx$ y derivar la curva:
              $y' = \sinh(x/c)$.
            porque: |
              Es el arranque obligado. Sin escribir $ds$ no hay nada que
              integrar, y quien pone directamente $s = c\sinh(x/c)$ está
              recitando el resultado, que es lo que la cuestión no pide.
          - punto: |
              **Usar la identidad del enunciado para la raíz.**
              $\sqrt{1 + \sinh^{2}(x/c)} = \cosh(x/c)$, y de ahí
              $s = \int_0^{x}\cosh(x/c)\,dx = c\sinh(x/c)$.
            porque: |
              El enunciado da la identidad **precisamente** para este paso.
              Si no aparece en tu desarrollo, el corrector entiende que no has
              visto dónde se usa. Y los límites importan: se integra desde el
              punto más bajo, que es el origen de $s$.
          - punto: |
              **Las dos componentes de la tensión.** La horizontal es
              constante e igual a la del punto más bajo, $T_0 = wc$; la
              vertical equilibra el peso del tramo OP, $ws$.
            porque: |
              Es el único paso de estática del ejercicio, y se razona aislando
              el tramo OP. Decir de dónde sale $T_0 = wc$ —de la definición del
              parámetro, $c = T_0/w$— es lo que separa una deducción de una
              lista de fórmulas.
          - punto: |
              **Componer y simplificar.**
              $T = \sqrt{T_0^{2} + w^{2}s^{2}} = w\sqrt{c^{2} + s^{2}}
              = wc\cosh(x/c) = wy$.
            porque: |
              La identidad se usa **una segunda vez**, ahora al revés:
              $1 + \sinh^{2} = \cosh^{2}$. Y el final $T = wy$ es el resultado
              que se usa en los problemas, así que no hay que dejarlo a medias
              en función de $x$.
          - punto: |
              **Una frase de lectura.** La tensión crece con la altura: es
              mínima en el punto más bajo ($T_0$) y máxima en el amarre más
              alto.
            porque: |
              Es la consecuencia que cae en los ejercicios —el cable BD del
              ejercicio 1 de este mismo examen se resuelve con ella— y demuestra
              que se entiende lo deducido.

      - tipo: calcular
        titulo: La longitud a una distancia c del vértice
        pregunta: |
          Comprobación con números: en el punto de abscisa $x = c$, ¿cuánto
          vale $s/c$?
        respuesta:
          tipo: numero
          valor: '1.1752'
          tolerancia: 0.002
          formato: un número con cuatro decimales
        distractores:
          - valor: '1.5431'
            mensaje: |
              Eso es $y/c = \cosh 1$, la ordenada del punto, no la longitud del
              arco. La longitud va con el seno hiperbólico, que es la primitiva
              del coseno.
          - valor: '0.5431'
            mensaje: |
              Eso es $(y - c)/c$, lo que sube el cable desde el vértice. La
              longitud del arco es siempre mayor que lo que sube, porque el
              cable también avanza en horizontal.
        pista: |
          $s = c\sinh(x/c)$, así que en $x = c$ queda $\sinh 1$.
        desarrollo: |
          $$
          \frac{s}{c} = \sinh 1 = \frac{e - e^{-1}}{2} = 1{,}1752
          $$

          Integrando numéricamente $\sqrt{1 + \sinh^{2}(x/c)}$ entre 0 y $c$
          sale lo mismo, 1,1752.

      - tipo: calcular
        titulo: La tensión en ese mismo punto
        pregunta: |
          Y en $x = c$, ¿cuánto vale $T$ en unidades de $wc$?
        respuesta:
          tipo: numero
          valor: '1.5431'
          tolerancia: 0.002
          formato: un número con cuatro decimales
        distractores:
          - valor: '1.1752'
            mensaje: |
              Eso es $ws/(wc)$, solo la componente vertical: el peso del tramo
              OP. Falta la horizontal, $T_0 = wc$, que es la misma en todo el
              cable.
          - valor: '1'
            mensaje: |
              Eso es $T_0/(wc)$, la tensión del punto más bajo. En P la
              componente horizontal es la misma, pero se le suma la vertical,
              y la tensión crece.
        pista: |
          $T = \sqrt{T_0^{2} + w^{2}s^{2}}$, con $T_0 = wc$ y $s = c\sinh 1$.
        desarrollo: |
          $$
          \frac{T}{wc} = \sqrt{1 + \sinh^{2}1} = \cosh 1 = 1{,}5431
          $$

          Y coincide con $y/c$ en ese punto, que es la forma $T = wy$.

      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              El elemento de arco es $ds = \sqrt{1 + y'^{2}}\,dx$, y derivando
              la curva, $y' = \sinh(x/c)$.
          - texto: >-
              Con la identidad, $\sqrt{1 + \sinh^{2}(x/c)} = \cosh(x/c)$, e
              integrando desde el punto más bajo, $s = c\sinh(x/c)$.
          - texto: >-
              Aislando el tramo OP, la componente horizontal de la tensión es
              $T_0 = wc$ y la vertical es el peso del tramo, $ws$.
          - texto: >-
              Así que $T = \sqrt{T_0^{2} + w^{2}s^{2}} = wc\cosh(x/c) = wy$.
          - texto: >-
              Como el cable pesa $w$ por unidad de longitud, la tensión en P es
              el peso del tramo OP, $T = ws$.
            trampa: true
            mensaje: |
              $ws$ es solo la componente **vertical** de la tensión en P. La
              horizontal, $T_0 = wc$, está en todo el cable —en el punto más
              bajo es la tensión entera—, y hay que componer las dos.
    resolucion: |
      **La longitud.** El elemento de arco de una curva $y(x)$ es
      $ds = \sqrt{1 + y'^{2}}\,dx$. De la curva del enunciado:

      $$
      y' = \frac{dy}{dx} = \sinh\left(\frac{x}{c}\right)
      \quad\Rightarrow\quad
      \sqrt{1 + y'^{2}} = \sqrt{1 + \sinh^{2}\left(\frac{x}{c}\right)}
      = \cosh\left(\frac{x}{c}\right)
      $$

      donde se ha usado la identidad $\cosh^{2} - \sinh^{2} = 1$. Integrando
      desde el punto más bajo, que está en $x = 0$:

      $$
      s = \int_0^{x}\cosh\left(\frac{x}{c}\right)dx
      = c\,\sinh\left(\frac{x}{c}\right)
      $$

      **La tensión.** Aislando el tramo OP, la componente horizontal de la
      tensión es la misma que en el punto más bajo, $T_0$, y por la definición
      del parámetro de la catenaria, $c = T_0/w$, vale $T_0 = wc$. La
      componente vertical equilibra el peso del tramo, $ws$. Componiendo:

      $$
      T = \sqrt{T_0^{2} + w^{2}s^{2}} = w\sqrt{c^{2} + s^{2}}
      = wc\sqrt{1 + \sinh^{2}\left(\frac{x}{c}\right)}
      = wc\,\cosh\left(\frac{x}{c}\right)
      $$

      y como $y = c\cosh(x/c)$:

      $$
      T = w\,y
      $$

      **Lectura.** La tensión es proporcional a la ordenada medida desde la
      directriz, así que es mínima en el punto más bajo —$T_0 = wc$— y máxima
      en el amarre más alto. Entre dos puntos cualesquiera,
      $T_2 - T_1 = w\,(y_2 - y_1)$: es la forma que resuelve el apartado b)
      del ejercicio 1 de este mismo examen.

      **Comprobación con números.** En $x = c$: $s/c = \sinh 1 = 1{,}1752$ y
      $T/(wc) = \cosh 1 = 1{,}5431$, y una integración numérica del elemento
      de arco da la misma longitud.

  # ── Cuestión 3 de teoría (n 3) · el disco con resistencia a la rodadura en
  #    un plano inclinado. El enunciado es simbólico; las cuentas de
  #    comprobación usan valores nuestros, declarados en la pregunta.
  - id: exma2324-1c-3-el-disco-que-no-debe-rodar-cuesta-abajo
    titulo: La fuerza mínima para que un disco no ruede cuesta abajo
    fuente: >-
      Cuestión 3 de teoría · Examen de enero de 2024 del bloque 1 (Estática) ·
      Mecánica Aplicada, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen no publica resolución; el desarrollo es nuestro.
    nivel: examen
    enunciado: |
      Un disco de masa $M$ y radio $R$ y resistencia a la rodadura $\mu_r$
      está colocado encima de un plano inclinado que forma un ángulo $\beta$
      con la horizontal. En el centro del disco, se aplica una fuerza $F$
      paralela al plano, para que el disco no comience a rodar hacia abajo.
      Determinar el **valor mínimo de $F$** y el coeficiente de rozamiento
      $\mu_s$ mínimo para asegurar la rodadura.
    pide: >-
      La fuerza mínima paralela al plano y el coeficiente de rozamiento
      mínimo para que el disco ruede sin deslizar.
    pasos:
      - tipo: reconocer
        pregunta: |
          Con el disco a punto de rodar hacia abajo, ¿dónde actúa la
          resultante de la reacción del plano?
        opciones:
          - texto: >-
              Desplazada una distancia $\mu_r$ hacia abajo del plano, hacia
              donde tiende a rodar el disco
            correcta: true
            mensaje: |
              Eso es. El contacto no es un punto: la presión se reparte y su
              resultante avanza hacia el lado del movimiento inminente, hasta
              un máximo de $\mu_r$. Por eso $\mu_r$ es una longitud, y el
              cociente $\mu_r/R$ hace de coeficiente de rozamiento
              equivalente.
          - texto: En el punto de contacto geométrico, bajo el centro
            mensaje: |
              Eso es el disco rígido ideal, sin resistencia a la rodadura. Con
              ese modelo cualquier desequilibrio lo haría rodar, y el dato
              $\mu_r$ del enunciado no entraría en ninguna ecuación.
          - texto: Desplazada $\mu_r$ hacia arriba del plano
            mensaje: |
              Ese es el caso contrario: el disco a punto de rodar **hacia
              arriba**, que es el que da la fuerza máxima. La resultante se
              desplaza siempre hacia donde tiende a ir el disco.

      - tipo: calcular
        titulo: La fuerza mínima, con números
        pregunta: |
          Para comprobar la expresión con números —no son del enunciado—,
          toma $\beta = 30^{\circ}$ y $\mu_r = 0{,}05\,R$. ¿Cuánto vale
          $F_{\min}$ en unidades de $Mg$?
        respuesta:
          tipo: numero
          valor: '0.4567'
          tolerancia: 0.002
          formato: un número con cuatro decimales
        distractores:
          - valor: '0.5'
            mensaje: |
              Eso es $\sin\beta$: equilibrar solo la componente del peso a lo
              largo del plano, sin resistencia a la rodadura. La resistencia
              **ayuda** a sujetar el disco, así que la fuerza necesaria es algo
              menor.
          - valor: '0.5433'
            mensaje: |
              Has desplazado la reacción hacia arriba del plano, que es el
              caso del disco a punto de subir. Esa es la fuerza **máxima**, la
              que lo haría rodar cuesta arriba; la mínima resta el término de
              la resistencia.
        pista: |
          Momentos respecto del punto donde actúa la reacción:
          $F R + Mg\cos\beta\,\mu_r = Mg\sin\beta\,R$.
        desarrollo: |
          $$
          F_{\min} = Mg\left(\sin\beta - \frac{\mu_r}{R}\cos\beta\right)
          = Mg\,(0{,}5 - 0{,}05\cdot 0{,}8660) = 0{,}4567\,Mg
          $$

      - tipo: calcular
        titulo: El rozamiento mínimo
        pregunta: |
          Con los mismos valores, ¿cuánto vale el coeficiente $\mu_s$ mínimo
          para que ruede sin deslizar?
        respuesta:
          tipo: numero
          valor: '0.05'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0.5774'
            mensaje: |
              Eso es $\tan\beta$, la condición de deslizamiento de un bloque
              que se sujeta solo por rozamiento. Aquí la fuerza $F$ ya
              equilibra casi todo el peso: el rozamiento solo tiene que
              aportar la pequeña parte que corresponde a la resistencia a la
              rodadura.
          - valor: '0.0433'
            mensaje: |
              Eso es $F_r/(Mg)$, la fuerza de rozamiento en unidades del peso.
              El coeficiente se compara con la **normal**,
              $N = Mg\cos\beta$: divide entre $\cos\beta$ y sale $\mu_r/R$.
        pista: |
          A lo largo del plano, $F_r = Mg\sin\beta - F_{\min}$, y rodar sin
          deslizar exige $F_r \le \mu_s N$.
        desarrollo: |
          $$
          F_r = Mg\sin\beta - F_{\min} = \frac{\mu_r}{R}\,Mg\cos\beta
          \qquad
          \mu_s \ge \frac{F_r}{N} = \frac{\mu_r}{R} = 0{,}05
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              A punto de rodar hacia abajo, la reacción del plano actúa a una
              distancia $\mu_r$ por debajo del punto de contacto geométrico.
          - texto: >-
              Normal al plano, $N = Mg\cos\beta$; y tomando momentos respecto
              del punto donde actúa la reacción,
              $F R + N\mu_r = Mg\sin\beta\,R$.
          - texto: >-
              De ahí, $F_{\min} = Mg\,(\sin\beta - (\mu_r/R)\cos\beta)$.
          - texto: >-
              A lo largo del plano, el rozamiento vale
              $F_r = Mg\sin\beta - F = (\mu_r/R)\,Mg\cos\beta$, y rodar sin
              deslizar exige $F_r \le \mu_s N$, así que $\mu_{s,\min} = \mu_r/R$.
          - texto: >-
              La fuerza mínima es $F = Mg\sin\beta$, porque tiene que
              equilibrar la componente del peso a lo largo del plano.
            trampa: true
            mensaje: |
              Eso ignora la resistencia a la rodadura, que es el dato del
              problema: el par de la normal desplazada, $N\mu_r$, frena el
              giro y rebaja la fuerza necesaria. Con $F = Mg\sin\beta$ el
              rozamiento saldría cero y la segunda pregunta no tendría
              respuesta.
    resolucion: |
      **Hipótesis.** El disco está a punto de rodar hacia abajo. Por la
      resistencia a la rodadura, la resultante de la reacción del plano —la
      normal $N$ y el rozamiento $F_r$— actúa en un punto I' situado una
      distancia $\mu_r$ por debajo del punto de contacto geométrico, del lado
      hacia el que tiende a moverse el disco. $F$ va hacia arriba del plano.

      **Normal.** Perpendicular al plano, $N = Mg\cos\beta$.

      **Momentos respecto de I'.** La normal y el rozamiento no dan momento.
      La componente del peso paralela al plano, $Mg\sin\beta$, y la fuerza
      $F$ actúan en el centro, a una altura $R$; la componente normal,
      $Mg\cos\beta$, pasa a una distancia $\mu_r$ de I':

      $$
      F\,R + Mg\cos\beta\;\mu_r = Mg\sin\beta\;R
      \quad\Rightarrow\quad
      F_{\min} = Mg\left(\sin\beta - \frac{\mu_r}{R}\cos\beta\right)
      $$

      Si $\tan\beta \le \mu_r/R$ la expresión sale negativa: el disco se
      sostiene solo y no hace falta ninguna fuerza.

      **Rozamiento.** Equilibrio a lo largo del plano:

      $$
      F_r = Mg\sin\beta - F_{\min} = \frac{\mu_r}{R}\,Mg\cos\beta
      $$

      y como rodar sin deslizar exige $F_r \le \mu_s N$:

      $$
      \mu_{s,\min} = \frac{F_r}{N} = \frac{\mu_r}{R}
      $$

      **Comprobación con números nuestros**, $\beta = 30^{\circ}$ y
      $\mu_r = 0{,}05\,R$: $F_{\min} = 0{,}4567\,Mg$ y $\mu_{s,\min} = 0{,}05$.
      Los momentos tomados respecto del contacto geométrico, con la normal
      desplazada, dan la misma fuerza.

      **Nota sobre $\mu_r$.** En los apuntes del tema 4 la resistencia a la
      rodadura es una **longitud** —el desplazamiento máximo de la
      resultante—, y $\mu_r/R$ es el coeficiente equivalente. Si alguien lo
      leyera como adimensional, las fórmulas no cuadrarían en unidades.

  # ── Cuestión 4 de teoría (n 4) · torsión en sección circular.
  - id: exma2324-1c-4-la-torsion-en-una-seccion-circular
    titulo: La tensión cortante y el momento torsor en una sección circular
    fuente: >-
      Cuestión 4 de teoría · Examen de enero de 2024 del bloque 1 (Estática) ·
      Mecánica Aplicada, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). El
      examen no publica resolución; el desarrollo es nuestro.
    nivel: examen
    enunciado: |
      Torsión en una sección circular: deducir la relación entre las
      tensiones cortantes y el momento torsor.
    pide: >-
      La relación entre la tensión cortante en un punto de la sección y el
      momento torsor, deducida.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hipótesis de deformación sostiene toda la deducción?
        opciones:
          - texto: >-
              Las secciones siguen planas y sus radios siguen rectos: cada
              sección gira como un sólido rígido respecto de la vecina
            correcta: true
            mensaje: |
              Eso es: la hipótesis de Bernoulli aplicada a la torsión, que en
              la sección circular se comprueba experimentalmente. De ella sale
              que la distorsión crece con el radio, $\gamma = r\,\theta'$, y
              todo lo demás es Hooke e integrar.
          - texto: La tensión cortante es la misma en toda la sección
            mensaje: |
              Eso es lo que se supone en un cortante directo, un remache o un
              perno, y no en torsión. Aquí el giro relativo de dos secciones
              desplaza más los puntos alejados del eje, y la tensión crece
              con el radio.
          - texto: El material es rígido y la sección no se deforma
            mensaje: |
              Sin deformación no hay tensión que calcular: la ley de Hooke
              necesita una distorsión $\gamma$. Lo que se supone rígido es
              cada **radio**, no la pieza.

      - tipo: redactar
        consigna: |
          En papel, como lo entregarías: **deduce $\tau(r)$ en función del
          momento torsor $M_t$** para una sección circular llena de diámetro
          $D$, y termina con la tensión máxima. Con un croquis del elemento
          de longitud $dx$.
        rubrica:
          - punto: |
              **La hipótesis, dicha.** Secciones planas y radios rectos: un
              elemento de longitud $dx$ gira $d\varphi$ respecto del
              anterior, como un sólido rígido.
            porque: |
              Es la premisa, y la que solo vale en la sección circular. Una
              deducción que no la enuncia vale igual para una sección
              cuadrada, donde el resultado es falso: las secciones no
              circulares se alabean.
          - punto: |
              **La distorsión.** Un punto a distancia $r$ se desplaza
              $r\,d\varphi$, así que la generatriz se inclina
              $\gamma = r\,d\varphi/dx = r\,\theta'$.
            porque: |
              Aquí aparece la dependencia lineal con el radio, que es el
              resultado entero de la cuestión. Sin el croquis del elemento, el
              corrector no puede ver de dónde sale.
          - punto: |
              **Hooke en cortadura.** $\tau = G\gamma = G\,r\,\theta'$, con
              dirección tangencial, perpendicular al radio.
            porque: |
              La dirección cuenta: una tensión radial no daría momento
              respecto del centro, y es la componente tangencial la que
              equilibra el torsor.
          - punto: |
              **El momento de las tensiones.**
              $M_t = \int_A \tau\,r\,dA = G\theta'\int_A r^{2}\,dA = G\,I_p\,\theta'$,
              nombrando $I_p$ como momento de inercia polar.
            porque: |
              Es el paso de equilibrio: el torsor es la resultante de momentos
              de las tensiones. Llamar $I_p$ a la integral —y no $I_z$— es
              donde se decide si luego sale $\pi D^{4}/32$ o la mitad.
          - punto: |
              **Eliminar $\theta'$ y dar el máximo.** $\tau = M_t\,r/I_p$ y, con
              $I_p = \pi D^{4}/32$, $\tau_{\max} = 16\,M_t/(\pi D^{3})$ en el
              contorno.
            porque: |
              Es la relación que pide el enunciado, y la tensión máxima es la
              que se usa para dimensionar. Decir que el centro está descargado
              y el contorno trabaja al máximo es la lectura que se espera.

      - tipo: calcular
        titulo: La tensión máxima de un eje concreto
        pregunta: |
          Para comprobar la fórmula con números —no son del enunciado—: un eje
          macizo de $D = 40$ mm transmite $M_t = 500$ N·m. ¿Cuánto vale
          $\tau_{\max}$?
        respuesta:
          tipo: magnitud
          valor: '39.79 MPa'
          tolerancia: 0.01
          formato: una tensión, con su unidad
        distractores:
          - valor: '79.58 MPa'
            mensaje: |
              El doble: has usado el momento de inercia **axial**,
              $\pi D^{4}/64$, en vez del polar, o has puesto el diámetro donde
              va el radio. En torsión la integral es de $r^{2}$, el polar, que
              es la suma de los dos axiales.
          - valor: '29.84 MPa'
            mensaje: |
              Has supuesto la tensión uniforme en toda la sección,
              $M_t = \tau\int r\,dA$. En torsión la tensión crece con el radio:
              el centro trabaja poco y el contorno mucho, y el máximo sale
              mayor que el de un reparto uniforme.
        pista: |
          $\tau_{\max} = 16\,M_t/(\pi D^{3})$, con $D$ en metros para que salga
          en pascales.
        desarrollo: |
          $$
          \tau_{\max} = \frac{16\,M_t}{\pi D^{3}}
          = \frac{16\cdot 500}{\pi\cdot 0{,}04^{3}}
          = 3{,}979\cdot 10^{7}\ \text{Pa} = 39{,}79\ \text{MPa}
          $$

          Integrando numéricamente $\tau(r)\,r\,dA$ con esa ley lineal se
          recuperan los 500 N·m.

      - tipo: calcular
        titulo: A mitad de radio
        pregunta: |
          En ese eje, ¿qué fracción de $\tau_{\max}$ soporta un punto situado a
          $r = D/4$, a mitad de camino entre el centro y el contorno?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '0.25'
            mensaje: |
              Has tomado la tensión proporcional a $r^{2}$. Eso es lo que
              aparece dentro de la integral del momento; la tensión va con
              $r$ a secas.
          - valor: '1'
            mensaje: |
              Eso sería un reparto uniforme. La tensión es lineal en el
              radio: a mitad de radio, mitad de tensión.
        pista: |
          $\tau = M_t\,r/I_p$ es lineal en $r$.
        desarrollo: |
          $$
          \frac{\tau(D/4)}{\tau(D/2)} = \frac{D/4}{D/2} = 0{,}5
          $$

      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              Las secciones permanecen planas y sus radios rectos: una rebanada
              de espesor $dx$ gira $d\varphi$ como un sólido rígido.
          - texto: >-
              Un punto a distancia $r$ se desplaza $r\,d\varphi$, así que la
              distorsión es $\gamma = r\,\theta'$.
          - texto: >-
              Por Hooke, $\tau = G\,r\,\theta'$, tangencial y lineal en el
              radio.
          - texto: >-
              El torsor es el momento de esas tensiones,
              $M_t = G\theta'\int r^{2}dA = G I_p\theta'$, y dividiendo,
              $\tau = M_t\,r/I_p$.
          - texto: >-
              Como en un cortante directo, la tensión se reparte por igual en
              toda la sección y es máxima en el centro.
            trampa: true
            mensaje: |
              Las dos mitades de la frase son falsas en torsión. La tensión no
              es uniforme —crece con el radio— y en el centro es **nula**: el
              máximo está en el contorno, $\tau_{\max} = 16M_t/(\pi D^{3})$.
    resolucion: |
      **Hipótesis.** En la sección circular se comprueba experimentalmente la
      hipótesis de Bernoulli: las secciones permanecen planas y paralelas, y
      sus radios giran como sólidos rígidos. Una rebanada de longitud $dx$ gira
      un ángulo $d\varphi$ respecto de la anterior.

      **Deformación.** Un punto B a distancia $r$ del centro pasa a B', con
      $BB' = r\,d\varphi$. La generatriz AB, que era perpendicular a la
      sección, se inclina:

      $$
      \gamma \simeq \tan\gamma = \frac{r\,d\varphi}{dx} = r\,\theta'
      $$

      siendo $\theta' = d\varphi/dx$ el ángulo de torsión por unidad de
      longitud.

      **Tensión.** Por la ley de Hooke en cortadura, con dirección
      tangencial:

      $$
      \tau = G\,\gamma = G\,r\,\theta'
      $$

      **Equilibrio.** El momento torsor es el momento resultante de esas
      tensiones respecto del centro:

      $$
      M_t = \int_A \tau\,r\,dA = G\,\theta'\int_A r^{2}\,dA = G\,I_p\,\theta'
      $$

      con $I_p$ el momento de inercia polar. Dividiendo las dos últimas:

      $$
      \tau = \frac{M_t\,r}{I_p}
      $$

      **Lectura.** La tensión es lineal en el radio: nula en el centro y
      máxima en el contorno. Con $I_p = \pi D^{4}/32$ para la sección llena:

      $$
      \tau_{\max} = \frac{M_t\,D}{2\,I_p} = \frac{16\,M_t}{\pi D^{3}}
      $$

      **Comprobación con números nuestros.** $D = 40$ mm y $M_t = 500$ N·m dan
      $\tau_{\max} = 39{,}79$ MPa, y la integral numérica de $\tau\,r\,dA$
      devuelve los 500 N·m.

  # ── Ejercicio 1 de la hoja de ejercicios (n 5), apartado a) · el sólido
  #    libre de la barra y la componente vertical de la fuerza en B. Tema 3.
  - id: exma2324-1c-5-la-barra-el-resorte-y-el-cable
    titulo: La barra sujeta por un resorte y un cable, en sólido libre
    fuente: >-
      Apartado a) del ejercicio 1 · Examen de enero de 2024 del bloque 1
      (Estática) · Mecánica Aplicada, Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU). La hoja de ejercicios del original lleva impresa la fecha 18
      de enero de 2023, aunque va en el mismo PDF que la teoría del 17 de
      enero de 2024. El examen no publica resolución; el desarrollo es
      nuestro.
    nivel: examen
    enunciado: |
      El sistema plano de la figura consta de la barra AC, de masa $M$ y
      longitud $L$, unida al suelo con una articulación fija en A y a la
      pared, en su punto C, a través de un resorte de constante
      $k = \frac{5}{2}\frac{Mg}{L}$ y longitud en reposo $L_0 = 0$. En el punto
      B, situado a distancia $3L/4$ de A, se une un cable BD, de peso por
      unidad de longitud $q = \frac{2}{3}\frac{Mg}{L}$ y que soporta una fuerza
      mínima $T_O = \frac{4}{3}Mg$ Los puntos E, C y D están en la misma
      horizontal mientras que E y A se encuentran en la misma vertical. El
      valor del ángulo es $\alpha = 36{,}87^{\circ}$.

      Determinar:

      **a)** (1p) Diagrama de sólido libre de la barra y componente vertical
      de la fuerza en B.

      <figure class="figura-examen">
      <svg viewBox="20 40 660 262" role="img" width="660" height="262"
