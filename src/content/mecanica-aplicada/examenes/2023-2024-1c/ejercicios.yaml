      - tipo: calcular
        titulo: La fuerza del resorte
        pregunta: |
          Con $\cos\alpha = 0{,}8$, ¿cuánto vale la fuerza del resorte, en
          unidades de $Mg$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '2.5'
            mensaje: |
              Has tomado como longitud del resorte la de la barra, $L$. El
              resorte es horizontal y va de la vertical de A hasta C: mide
              $0{,}8L$.
          - valor: '1.5'
            mensaje: |
              Has usado $L\sin\alpha = 0{,}6L$, la altura de C. Esa es la
              distancia de A a E, no la de E a C, que es la horizontal.
        pista: |
          $F_k = k\,(\overline{EC} - L_0) = \frac{5}{2}\frac{Mg}{L}\cdot 0{,}8L$.
        desarrollo: |
          $$
          F_k = k\,L\cos\alpha = \frac{5}{2}\frac{Mg}{L}\cdot 0{,}8\,L = 2\,Mg
          $$

          Horizontal, tirando de C hacia la pared.

      - tipo: reconocer
        pregunta: |
          ¿Qué se sabe de la fuerza que el cable hace en B antes de calcular
          nada?
        opciones:
          - texto: >-
              Su componente horizontal: vale la fuerza mínima,
              $T_O = \frac{4}{3}Mg$, y apunta hacia el cable, a la derecha
            correcta: true
            mensaje: |
              Eso es. En un cable con peso la componente horizontal de la
              tensión es la misma en todos sus puntos, y es la tensión del
              punto más bajo, que es la mínima. La vertical es la incógnita.
          - texto: Su módulo, $\frac{4}{3}Mg$, porque es la fuerza del cable
            mensaje: |
              $T_O$ es la fuerza **mínima**, la del punto más bajo. En B el
              cable está inclinado y la tensión es mayor: solo su componente
              horizontal coincide con $T_O$.
          - texto: Que es vertical, porque el cable cuelga
            mensaje: |
              El cable cuelga, pero no es vertical en B: sale inclinado hacia
              su punto más bajo. Una tensión vertical en B exigiría que no
              hubiera componente horizontal, y entonces $T_O$ sería cero.

      - tipo: calcular
        titulo: La componente vertical en B
        pregunta: |
          Tomando momentos respecto de A, ¿cuánto vale la componente vertical
          de la fuerza del cable sobre la barra en B, en unidades de $Mg$? Da
          el módulo; el sentido se discute en el desarrollo.
        respuesta:
          tipo: numero
          valor: '0.3333'
          tolerancia: 0.005
          formato: un número, vale la forma exacta
        distractores:
          - valor: '1.3333'
            mensaje: |
              Te has olvidado del momento de la componente horizontal del
              cable. Actúa en B, a una altura $0{,}45L$ sobre A, y da
              $\frac{4}{3}Mg\cdot 0{,}45L = 0{,}6\,MgL$: no se puede tratar el
              cable como si tirara solo en vertical.
          - valor: '0.8333'
            mensaje: |
              Es el error del resorte arrastrado: con la longitud del resorte
              igual a $L$ sale una fuerza de $2{,}5Mg$ y su momento cambia.
              Revisa la fuerza del paso anterior.
          - valor: '0.5'
            mensaje: |
              El brazo del peso. El peso es vertical y actúa en el centro de
              la barra, así que su brazo respecto de A es la distancia
              **horizontal**, $\frac{L}{2}\cos\alpha = 0{,}4L$, no la altura.
        pista: |
          Con A en el origen, $C = (0{,}8L,\,0{,}6L)$, $G = (0{,}4L,\,0{,}3L)$ y
          $B = (0{,}6L,\,0{,}45L)$. El resorte y la componente horizontal del
          cable dan momento por su brazo vertical; el peso y la componente
          vertical, por el horizontal.
        desarrollo: |
          Con el sentido antihorario positivo y $V_B$ hacia abajo:

          $$
          \sum M_A = 2Mg\cdot 0{,}6L - Mg\cdot 0{,}4L -
          \frac{4}{3}Mg\cdot 0{,}45L - V_B\cdot 0{,}6L = 0
          $$

          $$
          1{,}2 - 0{,}4 - 0{,}6 = 0{,}6\,\frac{V_B}{Mg}
          \quad\Rightarrow\quad
          V_B = \frac{Mg}{3}
          $$

          Sale positivo: el cable tira de B **hacia abajo**, como debe ser en
          un cable que sale de B descendiendo hacia su punto más bajo.

      - tipo: justificar
        pregunta: Ordena la resolución del apartado a). Una pieza es falsa.
        piezas:
          - texto: >-
              En el sólido libre entran la reacción en A, con dos componentes;
              el peso $Mg$ en el centro; el resorte en C, y el cable en B,
              tangente al cable.
          - texto: >-
              El resorte tiene longitud natural nula, así que su fuerza es $k$
              por su longitud, $0{,}8L$: vale $2Mg$ y tira de C hacia E.
          - texto: >-
              La componente horizontal del cable en B es la fuerza mínima,
              $\frac{4}{3}Mg$, hacia la derecha.
          - texto: >-
              Momentos respecto de A: $V_B = Mg/3$, hacia abajo. Y de las
              fuerzas, $A_x = \frac{2}{3}Mg$ y $A_y = \frac{4}{3}Mg$.
          - texto: >-
              Como la longitud en reposo es cero, el resorte no ejerce fuerza
              y la barra solo la sujetan A y el cable.
            trampa: true
            mensaje: |
              $L_0 = 0$ quiere decir que todo el resorte es alargamiento: su
              fuerza es $k$ por su longitud entera, $2Mg$, la mayor de todas las
              que actúan sobre la barra. Sin ella el equilibrio de momentos no
              cierra con ningún $V_B$ positivo.
    resolucion: |
      **1. Sólido libre.** La barra AC sola.

      <figure class="figura-examen">
      <svg viewBox="0 58 276 188" role="img" width="414" height="282" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">Sólido libre de la barra AC sujeta por el resorte y el cable</title>
        <desc id="dsl-d">La barra AC, que sube desde A formando un ángulo alfa con la horizontal, sola. El resorte y el cable quitados, en tenue y a trazos. En A, Ax hacia la derecha y Ay hacia arriba. En el centro G, el peso M g. En C, la fuerza del resorte, Fk, horizontal y hacia la izquierda, hacia E. En B, a tres cuartos de la barra, la fuerza del cable con sus dos componentes: HB hacia la derecha y VB hacia abajo.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
