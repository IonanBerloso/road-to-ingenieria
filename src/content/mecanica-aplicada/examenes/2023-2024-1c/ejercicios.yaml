    pide: >-
      Las fuerzas normal y de rozamiento en A y en C y el momento P, con el
      deslizamiento en A inminente.
    pasos:
      - tipo: reconocer
        pregunta: |
          Con $P$ en sentido horario, como en la figura, ¿hacia dónde tiende a
          deslizar el extremo A?
        opciones:
          - texto: >-
              Hacia C: el disco tiende a rodar a la derecha y arrastra la barra
              por B, así que el rozamiento en A apunta hacia la izquierda
            correcta: true
            mensaje: |
              Eso es. Un par horario hace rodar el disco hacia la derecha, y la
              barra, articulada a su centro, va detrás. El rozamiento en A se
              opone y vale $f\,N_A$ porque el deslizamiento es inminente.
          - texto: Alejándose de C, así que el rozamiento en A apunta hacia C
            mensaje: |
              Ese es el otro estado límite, el de un par **antihorario** que
              empuja la barra. Es un equilibrio posible, pero con $P$ del
              sentido contrario al dibujado: sale $N_A = Mg$ y
              $P = \frac{\sqrt{3}}{2}MgR$ antihorario.
          - texto: >-
              No se puede saber, así que se toma el rozamiento en A igual a
              cero
            mensaje: |
              «Deslizamiento inminente» dice justo lo contrario: el rozamiento
              en A está en su máximo, $f\,N_A$. Lo que hay que decidir es el
              sentido, y lo decide el sentido del par.

      - tipo: calcular
        titulo: La normal en A
        pregunta: |
          Tomando momentos respecto de B en la barra, ¿cuánto vale $N_A$, en
          unidades de $Mg$?
        respuesta:
          tipo: numero
          valor: '0.3333'
          tolerancia: 0.005
          formato: un número, vale la forma exacta
        distractores:
          - valor: '1'
            mensaje: |
              Has puesto el rozamiento en A hacia C, que es el caso de la barra
              empujada por un par antihorario. Con el par horario de la figura
              la barra es arrastrada hacia C y el rozamiento en A apunta hacia
              fuera.
          - valor: '0.5'
            mensaje: |
              Te has dejado el momento del rozamiento. La fuerza de rozamiento
              actúa en A, que está a una altura $R$ por debajo de B, y su
              momento, $F_A R$, entra en la ecuación con el mismo peso que el
              de la normal.
        pista: |
          Respecto de B, A está en $(-\sqrt{3}R,\,-R)$ y el centro de la barra
          en $(-\frac{\sqrt{3}}{2}R,\,-\frac{R}{2})$. Con $F_A = f N_A$ hacia la
          izquierda:
          $-\sqrt{3}R\,N_A - R\,F_A + \frac{\sqrt{3}}{2}R\,Mg = 0$.
        desarrollo: |
          $$
          -\sqrt{3}\,N_A - \frac{\sqrt{3}}{2}\,N_A + \frac{\sqrt{3}}{2}\,Mg = 0
          \quad\Rightarrow\quad
          N_A = \frac{Mg}{3}
          $$

      - tipo: calcular
        titulo: El rozamiento en A
        pregunta: |
          ¿Cuánto vale la fuerza de rozamiento en A, en unidades de $Mg$?
        respuesta:
          tipo: numero
          valor: '0.2887'
          tolerancia: 0.005
          formato: un número, vale la forma exacta
        distractores:
          - valor: '0.866'
            mensaje: |
              Es $f\cdot Mg$: el rozamiento se calcula con la normal de **A**,
              $N_A = Mg/3$, no con el peso de la barra. O es el caso del par
              antihorario, en el que $N_A = Mg$; con el de la figura no.
          - valor: '0.433'
            mensaje: |
              Es $f$ por una normal de $Mg/2$, la que sale si se olvida el
              momento del rozamiento. Con la normal buena, $Mg/3$, el
              rozamiento es un tercio menor.
        pista: |
          $F_A = f\,N_A = \frac{\sqrt{3}}{2}\cdot\frac{Mg}{3}$.
        desarrollo: |
          $$
          F_A = f\,N_A = \frac{\sqrt{3}}{2}\cdot\frac{Mg}{3}
          = \frac{\sqrt{3}}{6}\,Mg \approx 0{,}289\,Mg
          $$

          Hacia la izquierda, alejándose de C.

      - tipo: calcular
        titulo: El momento P
        pregunta: |
          Del equilibrio del disco, ¿cuánto vale $P$, en unidades de $MgR$?
        respuesta:
          tipo: numero
          valor: '0.2887'
          tolerancia: 0.005
          formato: un número, vale la forma exacta
        distractores:
          - valor: '0.866'
            mensaje: |
              Es el par del otro estado límite, el antihorario, con la barra
              empujada. La figura dibuja $P$ horario, y entonces la barra se
              arrastra y todo sale tres veces menor.
          - valor: '0.5774'
            mensaje: |
              Has tomado el brazo del rozamiento en C como el diámetro, $2R$.
              Tomando momentos respecto del centro B, el rozamiento en C tiene
              brazo $R$, y la fuerza de la barra, aplicada en B, no da
              momento.
        pista: |
          Horizontal en el disco: $F_C$ equilibra la fuerza de la barra en B,
          $\frac{\sqrt{3}}{6}Mg$. Momentos respecto de B: $P = F_C\,R$.
        desarrollo: |
          $$
          F_C = \frac{\sqrt{3}}{6}\,Mg
          \qquad
          P = F_C\,R = \frac{\sqrt{3}}{6}\,MgR \approx 0{,}289\,MgR
          $$

          En sentido horario, el de la figura.

      - tipo: calcular
        titulo: La normal en C
        pregunta: |
          ¿Cuánto vale $N_C$, en unidades de $Mg$?
        respuesta:
          tipo: numero
          valor: '1.6667'
          tolerancia: 0.005
          formato: un número, vale la forma exacta
        distractores:
          - valor: '2'
            mensaje: |
              Has cargado todo el peso del sistema sobre C. La barra se apoya
              también en A, que se lleva $Mg/3$: en C queda $2Mg - Mg/3$.
          - valor: '1'
            mensaje: |
              Solo el peso del disco. La barra, articulada en su centro, le
              transmite en B una fuerza vertical de $\frac{2}{3}Mg$ hacia
              abajo, que también baja por el disco hasta C.
        pista: |
          Vertical en la barra: la fuerza del disco en B es
          $Mg - N_A = \frac{2}{3}Mg$ hacia arriba, y sobre el disco, la misma
          hacia abajo.
        desarrollo: |
          $$
          N_C = Mg + \frac{2}{3}Mg = \frac{5}{3}\,Mg
          $$

          Comprobación global: $N_A + N_C = \frac{1}{3}Mg + \frac{5}{3}Mg = 2Mg$.

      - tipo: calcular
        titulo: El rozamiento en C
        pregunta: |
          ¿Cuánto vale la fuerza de rozamiento en C, en unidades de $Mg$?
        respuesta:
          tipo: numero
          valor: '0.2887'
          tolerancia: 0.005
          formato: un número, vale la forma exacta
        distractores:
          - valor: '0'
            mensaje: |
              Que el enunciado no dé coeficiente en C no quiere decir que no
              haya rozamiento: quiere decir que **no está en su límite** y su
              valor sale del equilibrio. Sin él, el disco no equilibraría ni
              las fuerzas horizontales ni el par.
          - valor: '0.866'
            mensaje: |
              Es el rozamiento del otro estado límite, el del par antihorario.
              Con el de la figura, las dos fuerzas horizontales del sistema,
              en A y en C, valen $\frac{\sqrt{3}}{6}Mg$.
        pista: |
          Horizontal en el sistema entero: $F_A + F_C = 0$.
        desarrollo: |
          $$
          F_C = \frac{\sqrt{3}}{6}\,Mg
          $$

          Hacia la derecha: iguala en módulo al de A y va en sentido
          contrario, porque son las dos únicas fuerzas horizontales
          exteriores.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El par horario hace tender el disco a rodar hacia la derecha, y
              arrastra la barra: el rozamiento en A va hacia la izquierda y
              vale $f\,N_A$.
          - texto: >-
              Momentos en la barra respecto de B: $N_A = Mg/3$ y
              $F_A = \frac{\sqrt{3}}{6}Mg$; la articulación sostiene
              $\frac{2}{3}Mg$ de la barra.
          - texto: >-
              En el disco, el rozamiento en C equilibra la fuerza horizontal de
              la barra y da el par: $P = F_C R = \frac{\sqrt{3}}{6}MgR$.
          - texto: >-
              Y la normal en C recoge el disco y lo que le pasa la barra:
              $N_C = \frac{5}{3}Mg$, que con $N_A$ suma el peso total, $2Mg$.
          - texto: >-
              En C no hay rozamiento, porque el enunciado solo da el
              coeficiente en A.
            trampa: true
            mensaje: |
              No dar el coeficiente en C significa que ahí el rozamiento no
              está en su límite, no que sea cero. Su valor sale del
              equilibrio, $\frac{\sqrt{3}}{6}Mg$, y es el que sostiene el par
              $P$: sin él, el disco giraría.
    resolucion: |
      **Geometría.** Con C en el origen, B está en $(0,\,R)$. La barra mide
      $2R$ y B está a una altura $R$, así que forma $30^{\circ}$ con el suelo y
      A está en $(-\sqrt{3}R,\,0)$. Su centro G, en
      $(-\frac{\sqrt{3}}{2}R,\,\frac{R}{2})$, queda a una distancia $R$ de B:
      justo sobre el borde del disco.

      **a) Sólidos libres.**

      - Barra: en A, la normal $N_A$ hacia arriba y el rozamiento $F_A$
        horizontal; su peso $Mg$ en G; en B, la fuerza del disco, con dos
        componentes $B_x$ y $B_y$.
      - Disco: su peso $Mg$ en B; la fuerza de la barra en B, igual y
        contraria; el par $P$; y en C, la normal $N_C$ y el rozamiento $F_C$.

      **El sentido del deslizamiento.** Con $P$ horario, como en la figura, el
      disco tiende a rodar hacia la derecha y arrastra la barra: A tiende a
      deslizar hacia C, y el rozamiento en A apunta hacia la izquierda, con
      $F_A = f\,N_A$.

      **b) En A.** Momentos en la barra respecto de B, antihorario positivo:

      $$
      -\sqrt{3}R\,N_A - R\,F_A + \frac{\sqrt{3}}{2}R\,Mg = 0
      \qquad F_A = \frac{\sqrt{3}}{2}N_A
      $$

      $$
      N_A = \frac{Mg}{3}
      \qquad
      F_A = \frac{\sqrt{3}}{6}\,Mg \approx 0{,}289\,Mg
      $$

      Y de las fuerzas en la barra, la articulación le da
      $B_x = \frac{\sqrt{3}}{6}Mg$ hacia la derecha y $B_y = \frac{2}{3}Mg$
      hacia arriba.

      **c) El par.** En el disco, la barra tira de B con
      $\frac{\sqrt{3}}{6}Mg$ hacia la izquierda y empuja con $\frac{2}{3}Mg$
      hacia abajo. Equilibrio horizontal: $F_C = \frac{\sqrt{3}}{6}Mg$ hacia
      la derecha. Momentos respecto de B, donde solo dan momento el
      rozamiento en C y el par:

      $$
      P = F_C\,R = \frac{\sqrt{3}}{6}\,MgR \approx 0{,}289\,MgR
      \quad\text{(horario)}
      $$

      **d) En C.**

      $$
      N_C = Mg + \frac{2}{3}Mg = \frac{5}{3}\,Mg
      \qquad
      F_C = \frac{\sqrt{3}}{6}\,Mg
      $$

      **Comprobación del conjunto.** Vertical: $N_A + N_C = 2Mg$. Horizontal:
      $F_A + F_C = 0$. Momentos respecto de C:
      $-\sqrt{3}R\cdot\frac{Mg}{3} + \frac{\sqrt{3}}{2}R\,Mg - \frac{\sqrt{3}}{6}MgR = 0$.

      **El otro estado límite.** Si el par fuera antihorario, la barra sería
      empujada, A tendería a alejarse de C y saldría $N_A = Mg$,
      $F_A = \frac{\sqrt{3}}{2}Mg$, $P = \frac{\sqrt{3}}{2}MgR$, $N_C = Mg$ y
      $F_C = \frac{\sqrt{3}}{2}Mg$. El enunciado no nombra el sentido; lo
      dibuja, y aquí se sigue el dibujo.

  # ── Ejercicio 3 de la hoja de ejercicios (n 7) · la viga con dos voladizos
  #    y la sección en T. Tema 6.
  - id: exma2324-1c-7-la-viga-con-dos-voladizos-y-la-seccion-en-t
    titulo: La viga con dos voladizos y el espesor de su sección en T
    fuente: >-
      Ejercicio 3 · Examen de enero de 2024 del bloque 1 (Estática) · Mecánica
      Aplicada, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). La hoja de
      ejercicios del original lleva impresa la fecha 18 de enero de 2023,
      aunque va en el mismo PDF que la teoría del 17 de enero de 2024. El
      examen no publica resolución; el desarrollo es nuestro.
    nivel: examen
    enunciado: |
      Para la viga de la figura, determinar:

      **a)** (1p) Diagramas de esfuerzos cortantes y momentos flectores en
      función de $q_0$ y $L$.

      **b)** (1p) Si $q_0$ es el peso propio por unidad de longitud de la viga
      y siendo el peso específico del material $18000\ \text{N/m}^{3}$ y
      $L = 2$ m:

      **b1)** (0,5p) Tensión normal máxima (decir si es de tracción o
      compresión y la sección donde tiene lugar).

      **b2)** (0,5p) Dimensión $e$ de la figura (en mm), siendo la tensión
      admisible por el material $\sigma_0 = 200$ MPa.

