    pide: >-
      Las fuerzas normal y de rozamiento en A y en C y el momento P, con el
      deslizamiento en A inminente.
    pasos:
      - tipo: reconocer
        pregunta: |
          Con $P$ en sentido horario, como en la figura, ¿hacia dónde tiende a
          deslizar el extremo A?
        opciones:
          - texto: >-
              Hacia C: el disco tiende a rodar a la derecha y arrastra la barra
              por B, así que el rozamiento en A apunta hacia la izquierda
            correcta: true
            mensaje: |
              Eso es. Un par horario hace rodar el disco hacia la derecha, y la
              barra, articulada a su centro, va detrás. El rozamiento en A se
              opone y vale $f\,N_A$ porque el deslizamiento es inminente.
          - texto: Alejándose de C, así que el rozamiento en A apunta hacia C
            mensaje: |
              Ese es el otro estado límite, el de un par **antihorario** que
              empuja la barra. Es un equilibrio posible, pero con $P$ del
              sentido contrario al dibujado: sale $N_A = Mg$ y
              $P = \frac{\sqrt{3}}{2}MgR$ antihorario.
          - texto: >-
              No se puede saber, así que se toma el rozamiento en A igual a
              cero
            mensaje: |
              «Deslizamiento inminente» dice justo lo contrario: el rozamiento
              en A está en su máximo, $f\,N_A$. Lo que hay que decidir es el
              sentido, y lo decide el sentido del par.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna ecuación: **la barra sola y el disco
          solo**, por separado, con la fuerza de la articulación B en los dos.
        comprueba:
          - punto: |
              **En B, $B_x$ y $B_y$ sobre la barra, y las mismas, contrarias,
              sobre el disco; ningún par.**
            porque: |
              Acción y reacción: lo que el disco le hace a la barra, la barra se
              lo hace al disco con el signo cambiado. Y una articulación deja
              girar, así que no transmite par.
          - punto: |
              **En A, la normal hacia arriba y el rozamiento hacia la
              izquierda, con $F_A = f\,N_A$.**
            porque: |
              El deslizamiento en A es inminente: el rozamiento está en su
              máximo y va en contra del movimiento que va a haber.
          - punto: |
              **En C, la normal $N_C$ y el rozamiento $F_C$, cada uno con un
              sentido supuesto.**
            porque: |
              El suelo puede empujar el disco y rozar con él. Lo que valga cada
              fuerza, y su signo, saldrá del equilibrio.
          - punto: |
              **El par P solo en el disco, y los dos pesos: el del disco en B y
              el de la barra en su centro G.**
            porque: |
              El par actúa sobre el disco y no tiene punto de aplicación: entra
              en sus momentos y en ninguna ecuación de fuerzas.
