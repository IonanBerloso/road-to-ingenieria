      La sección:

      $$
      A = 13e^{2},
      \qquad
      y_G = \frac{20{,}5}{13}\,e = 1{,}577\,e,
      \qquad
      I = \frac{10}{3} + 10\cdot 0{,}577^{2} + \frac{9}{4} + 3\cdot 1{,}923^{2}
      = 20{,}006\,e^{4}
      $$

      La punta del alma está a $5e - 1{,}577e = 3{,}423e$ del eje neutro, y la
      base del ala, a $1{,}577e$.

      b1) La tensión normal máxima. El flector de mayor valor absoluto es
      $-q_0L^{2}/2$, en B y en C. Al ser negativo tracciona la fibra superior,
      que además es la más alejada del eje neutro. Con $L = 2$ m:

      $$
      \sigma_{\max} = \frac{q_0L^{2}}{2}\cdot\frac{3{,}423e}{20{,}006e^{4}}
      = \frac{18000\cdot 13\cdot 2\cdot 3{,}423}{20{,}006}\cdot\frac{1}{e}
      = \frac{80\,074}{e}\ \text{Pa}
      $$

      con e en metros: es **de tracción**, en la fibra superior —la punta del
      alma— de las secciones de los apoyos **B y C**. La fibra inferior de esas
      mismas secciones está comprimida, con $36\,888/e$ Pa.

