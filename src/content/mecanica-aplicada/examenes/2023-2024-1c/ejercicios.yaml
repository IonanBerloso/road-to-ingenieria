      - tipo: calcular
        titulo: El parámetro de la catenaria
        pregunta: |
          ¿Cuánto vale el parámetro $c = T_O/q$, en unidades de $L$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '0.5'
            mensaje: |
              Has invertido el cociente, $q/T_O$. El parámetro es una
              longitud: fuerza entre fuerza por unidad de longitud,
              $c = T_O/q$.
          - valor: '0.8889'
            mensaje: |
              Has multiplicado $T_O$ por $q$ en vez de dividir. Mira las
              unidades: $T_O\,q$ sería fuerza al cuadrado por unidad de
              longitud, y $c$ tiene que salir en metros.
        pista: |
          $c = \dfrac{\frac{4}{3}Mg}{\frac{2}{3}Mg/L}$.
        desarrollo: |
          $$
          c = \frac{T_O}{q} = \frac{4/3}{2/3}\,L = 2L
          $$

      - tipo: calcular
        titulo: La longitud de cable hasta el punto más bajo
        pregunta: |
          Con $V_B = q\,s_B$, ¿cuánto vale $s_B$, en unidades de $L$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '0.2222'
            mensaje: |
              Has multiplicado $V_B$ por $q$. La longitud sale de dividir la
              fuerza entre el peso por unidad de longitud:
              $s_B = V_B/q$.
          - valor: '2'
            mensaje: |
              Ese es $c = T_O/q$, el parámetro de la catenaria, que usa la
              componente horizontal. La longitud del tramo sale de la
              **vertical**, $V_B = Mg/3$.
        pista: |
          $s_B = V_B/q = \dfrac{Mg/3}{\frac{2}{3}Mg/L}$.
        desarrollo: |
          $$
          s_B = \frac{V_B}{q} = \frac{1/3}{2/3}\,L = \frac{L}{2}
          $$

          Y con $s = c\sinh(x/c)$, B queda a una abscisa
          $2L\,\mathrm{arcsinh}(0{,}25) = 0{,}495\,L$ a la izquierda del punto
          más bajo.

      - tipo: calcular
        titulo: La fuerza en D
        pregunta: |
          ¿Cuánto vale la tensión del cable en D, en unidades de $Mg$?
        respuesta:
          tipo: numero
          valor: '1.4744'
          tolerancia: 0.005
          formato: un número con cuatro decimales
        distractores:
          - valor: '1.3744'
            mensaje: |
              Esa es la tensión en **B**, $\sqrt{17}/3\,Mg$. D no está a la
              altura de B sino a la de C, $0{,}15L$ más arriba, y la tensión
              crece con la altura: $T_D = T_B + q\cdot 0{,}15L$.
          - valor: '1.3333'
            mensaje: |
              Eso es $T_O$, la fuerza **mínima**, que se da en el punto más
              bajo del cable. En un amarre la tensión es mayor: a la
              horizontal $T_O$ se le suma la vertical.
          - valor: '1.2744'
            mensaje: |
              Has restado la diferencia de alturas. D está **por encima** de B
              —a la altura de C—, y como $T = qy$, subir aumenta la tensión.
        pista: |
          $T = q\,y$ con $y$ medida desde la directriz, así que
          $T_D - T_B = q\,(y_D - y_B) = q\cdot 0{,}15L$. Y
          $T_B = \sqrt{T_O^{2} + V_B^{2}}$.
        desarrollo: |
          $$
          T_B = \sqrt{\left(\tfrac{4}{3}\right)^{2} + \left(\tfrac{1}{3}\right)^{2}}\,Mg
          = \frac{\sqrt{17}}{3}\,Mg = 1{,}3744\,Mg
          $$

          $$
          T_D = T_B + q\,(0{,}6L - 0{,}45L)
          = 1{,}3744\,Mg + \frac{2}{3}\cdot 0{,}15\,Mg = 1{,}4744\,Mg
          $$

      - tipo: justificar
        pregunta: Ordena la resolución del apartado b). Una pieza es falsa.
        piezas:
          - texto: >-
              El parámetro de la catenaria es $c = T_O/q = 2L$.
          - texto: >-
              En B la componente vertical es el peso del cable hasta el punto
              más bajo: $s_B = V_B/q = L/2$.
          - texto: >-
              La tensión es $T = qy$, con $y$ desde la directriz, así que entre
              dos puntos cambia en $q$ por su diferencia de cotas.
          - texto: >-
              D está a la altura de C, $0{,}15L$ por encima de B:
              $T_D = \frac{\sqrt{17}}{3}Mg + \frac{2}{3}\cdot 0{,}15\,Mg = 1{,}474\,Mg$.
          - texto: >-
              El cable soporta una fuerza mínima de $\frac{4}{3}Mg$, así que esa
              es la fuerza que hace en D.
            trampa: true
            mensaje: |
              La fuerza mínima es la del punto más bajo, donde el cable es
              horizontal. En los amarres la tensión es **máxima**: en D vale
              $1{,}474\,Mg$, y de ella solo la componente horizontal es
              $\frac{4}{3}Mg$.
    resolucion: |
      **1. Sólidos libres.** El cable entero y el tramo entre su punto más
      bajo, V, y B.

