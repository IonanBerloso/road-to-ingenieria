asignatura: mecanica-aplicada
curso: '2023-2024'
convocatoria: primer-cuatrimestre
fecha: 17 de enero de 2024
# El examen de enero de 2024 del bloque 1 de Mecánica Aplicada, Estática, que
# según la guía docente se puede aprobar en enero. Por eso entra como
# `primer-cuatrimestre` y no como ordinaria.
#
# Tres cosas de este cuadernillo, dichas antes de que nadie las deduzca:
#
# 1. **LAS DOS FECHAS NO CASAN, Y NO LO RESOLVEMOS.** El PDF es uno solo,
#    `2324_ENERO_EST.pdf`, con cuatro páginas: la de TEORÍA dice «17 de enero
#    de 2024» en las dos columnas, la 2 está en blanco, y las dos de
#    EJERCICIOS dicen «18 de enero de 2023» —«2023ko urtarrilak 18» en la
#    columna en euskera— también en las dos columnas. Se publica como el
#    examen de enero de 2024 porque así se llama el fichero y así fecha su
#    primera página, y la `fecha` de arriba es la que imprime esa página. No
#    sabemos si los ejercicios son de la convocatoria de 2023 reutilizados o
#    si la cabecera se quedó sin actualizar. La `fuente` de cada ejercicio de
#    la hoja de ejercicios lo dice, para que nadie lo tome por un error
#    nuestro.
#
# 2. **LA NUMERACIÓN `n` ES NUESTRA.** El cuadernillo numera por separado las
#    cuatro cuestiones de teoría (1 a 4, 1 punto cada una) y los tres
#    ejercicios (1 a 3, 2 puntos cada uno): hay dos «1», dos «2» y dos «3».
#    Para que la página cuente bien, aquí la teoría va de n 1 a 4 y los
#    ejercicios de n 5 a 7, en el orden del cuadernillo: n 5 es el ejercicio
#    1, n 6 el 2 y n 7 el 3. Los ids siguen el mismo número. El ejercicio 1 se
#    parte en dos piezas porque sus apartados son de temas distintos —el a) de
#    estática del sólido, el b) de cables—, así que la página dice 7
#    ejercicios y 8 resoluciones, y las dos cifras son verdad.
#
# 3. **NO PUBLICA REPARTO POR COMPETENCIA.** El cuadernillo da puntos por
#    pregunta y por apartado (1p cada cuestión, 2p cada ejercicio, total 10),
#    pero no por competencia, así que los ejercicios van sin el campo
#    `puntos`. No se estima lo que no se imprime (§10). Tampoco trae
#    resolución: todos los desarrollos son nuestros.
#
# Se usa solo la columna en castellano. No queda nada fuera.
pdf: 2023-2024-1c.pdf

