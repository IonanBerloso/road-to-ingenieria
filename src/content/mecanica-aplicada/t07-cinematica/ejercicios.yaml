    pide: La velocidad angular de la esfera, sus componentes de pivotamiento y rodadura sobre el cono móvil, la velocidad de G y la aceleración angular.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuáles son aquí los dos puntos de velocidad nula de la esfera?
        opciones:
          - texto: El contacto con el plano fijo y el contacto con el cono fijo
            correcta: true
            mensaje: |
              Eso es. Son las dos superficies que no se mueven, y como la
              esfera no desliza en ellas, esos dos puntos tienen velocidad
              nula: el EIRD es la recta que los une.
          - texto: El contacto con el cono móvil y el centro de la esfera
            mensaje: |
              El cono móvil gira, así que su punto de contacto **no** está
              parado; y el centro de la esfera se mueve, describiendo una
              circunferencia alrededor del eje.
          - texto: El vértice O del cono móvil y el centro de la esfera
            mensaje: |
              O no es un punto de la esfera. Los puntos parados de la esfera
              son los que tocan superficies fijas.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el corte por el plano XZ, con
          la esfera, sus tres contactos y la velocidad del cono móvil en M**.
          Solo las direcciones, sin escala.
        comprueba:
          - punto: |
              **T encima de G, y M en el cono móvil y P en la pista, los dos
              30° por debajo de la horizontal de G.**
            porque: |
              Cada contacto está sobre la normal común a la esfera y a lo que
              toca; las paredes de los dos conos forman 30° con la vertical, y
              sus normales, 30° con la horizontal.
          - punto: |
              **En M, la velocidad del cono móvil, perpendicular al papel,
              hacia dentro.**
            porque: |
              El cono gira alrededor de Z en sentido positivo: su punto M, a
              la derecha del eje, se mueve según +y, que entra en el papel.
          - punto: |
              **T y P, sin velocidad.**
            porque: |
              El plano y la pista están quietos, y la esfera no desliza sobre
              ellos.
        figura: |
          <svg viewBox="34 0 248 224" role="img" width="248" height="224" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">Esquema de los contactos de la esfera entre los dos conos y el plano</title>
            <desc id="dsl-d">El corte por el plano XZ: arriba, el plano horizontal fijo; colgando de él, con el vértice O en el plano, el cono móvil, con su giro omega sobre el eje vertical, hacia arriba; alrededor, la pista cónica fija, con el vértice abajo. Entre los dos conos y debajo del plano, la esfera de centro G, que toca el plano en T, encima de G, el cono móvil en M y la pista en P, los dos 30 grados por debajo de la horizontal de G. Desde G, líneas tenues a los tres contactos. En M, la velocidad del cono móvil, entrando en el papel.</desc>
            <defs>
