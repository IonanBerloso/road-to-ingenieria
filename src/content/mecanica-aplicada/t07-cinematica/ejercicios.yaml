    pide: La velocidad y la aceleración del punto B.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hace falta antes de aplicar el campo de velocidades?
        opciones:
          - texto: Escribir $\vec{\omega}$ como 75 por el vector unitario de D hacia A
            correcta: true
            mensaje: |
              Eso es. La velocidad angular es un vector: módulo 75 rad/s y
              dirección la del eje de giro, con el sentido que dice el
              enunciado.
          - texto: Descomponer 75 rad/s en tres giros de 25 rad/s, uno por eje
            mensaje: |
              El giro es uno solo, alrededor de AD. Repartirlo a partes
              iguales entre los ejes daría otra dirección: hay que proyectar
              con los cosenos directores de AD.
          - texto: Nada, basta con multiplicar 75 por la longitud AB
            mensaje: |
              Eso daría el módulo solo si AB fuera perpendicular al eje, y no
              lo es. Con el producto vectorial sale bien sin tener que
              pensarlo.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el cuadro con su eje de giro,
          la velocidad angular y la dirección de la velocidad de B**. Solo las
          direcciones, sin escala.
        comprueba:
          - punto: |
              **El eje, la recta AD, y $\vec{\omega}$ sobre él, apuntando de D
              hacia A.**
            porque: |
              A y D no se mueven, así que el cuadro gira alrededor de la recta
              que los une; el sentido es el que da el enunciado.
          - punto: |
              **La distancia d de B al eje, medida en perpendicular a AD.**
            porque: |
              Es el brazo con que B gira alrededor del eje: el que cuenta para
              su velocidad, no la longitud de AB.
          - punto: |
              **$\vec{v}_B$ perpendicular al plano que forman el eje y B.**
            porque: |
              Al girar alrededor del eje, B se mueve en perpendicular al eje y
              a su brazo d; el sentido sale de la regla de la mano derecha con
              $\vec{\omega}$.
        figura: |
