        <path d="M187.4 110 A18 18 0 0 0 189.8 119" fill="none" stroke="var(--ink)" stroke-width="0.9"/>
        <text x="176" y="104" font-size="10" fill="var(--ink)">30°</text>
        <line x1="300" y1="44" x2="300" y2="14" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="306" y="24" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">ω</text>
        <circle cx="245.4" cy="110" r="5.5" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
        <circle cx="245.4" cy="110" r="1.7" fill="var(--ink)"/>
        <text x="252" y="128" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">v<tspan font-size="7.5" dy="2.5">C</tspan></text>
        <circle cx="205.4" cy="110" r="2.4" fill="var(--ink)"/>
        <text x="212" y="104" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">G</text>
        <circle cx="205.4" cy="150" r="2.4" fill="var(--ink)"/>
        <text x="212" y="164" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">B</text>
        <circle cx="170.7" cy="130" r="2.4" fill="var(--ink)"/>
        <text x="164" y="140" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">A</text>
        <circle cx="245.4" cy="110" r="2.4" fill="var(--ink)"/>
        <text x="239" y="98" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">C</text>
        <text x="306" y="12" font-size="9" text-anchor="start" fill="var(--faint)">Z</text>
        <text x="374" y="154" font-size="9" text-anchor="start" fill="var(--faint)">Y</text>
      </svg>
      <figcaption>

      Solo las direcciones, sin escala para los vectores. El corte por el plano YZ, con x saliendo del papel. Cada contacto está sobre la normal común: B debajo de G, C a su altura y A a 30° por debajo de la horizontal, porque la pared del cono forma 30° con la vertical. En C, el cilindro, que gira alrededor de Z, lleva su velocidad perpendicular al corte, saliendo del papel.

      </figcaption>
      </figure>

      - **El cilindro** gira a $\omega$, constante, alrededor de Z, según +k,
        el sentido de la figura.
      - **La esfera** toca el plano en B, debajo de G; el cilindro en C, a la
        altura de G; y la pared del cono en A, sobre la normal a la pared, 30°
        por debajo de la horizontal, porque la pared forma 30° con la
        vertical.
      - **A y B** no tienen velocidad: el plano y el cono están quietos y la
        esfera no desliza. **En C**, la esfera lleva la velocidad del
        cilindro, perpendicular al corte.

      Con O en el eje, a la altura del plano, Y a la derecha y x saliendo del
      papel: $G = \left(0;\ -\tfrac{3+\sqrt{3}}{2}R;\ R\right)$, B debajo,
      $C = \left(0;\ -\tfrac{1+\sqrt{3}}{2}R;\ R\right)$, sobre el cilindro, y
      $\overrightarrow{GA} = R\left(0;\ -\tfrac{\sqrt{3}}{2};\ -\tfrac12\right)$.

      **2. Incógnitas.** $\vec{\omega}_e$ y el EIRD; la rodadura y el
      pivotamiento contra el cilindro, el plano y el cono; $\vec{v}_G$ y
      $\vec{a}_G$; y $\vec{\alpha}_e$.

      **3. Ecuaciones.** A y B tienen velocidad nula, así que la esfera gira
      sin deslizar alrededor de la recta AB, que es el EIRD:
      $\vec{\omega}_e = \lambda\,\overrightarrow{AB}/|\overrightarrow{AB}|$,
      con $\overrightarrow{AB}$ según $(0;\ \sqrt{3};\ -1)$. En C, la esfera y
      el cilindro llevan la misma velocidad:

      $$
      \vec{\omega}_e = \lambda\,(0;\ \sqrt{3};\ -1),
      \qquad
      \vec{\omega}_e\times\overrightarrow{BC} = \omega\,\vec{k}\times\overrightarrow{OC}
      $$

      En cada contacto, el giro relativo y su descomposición, con
      $\vec{n}$ la normal común: $\vec{k}$ en el plano,
      $(0;\ \sqrt{3}/2;\ 1/2)$ en el cono y $\vec{j}$ en el cilindro:

      $$
      \vec{\omega}_{rel} = \vec{\omega}_e - \vec{\omega}_{\text{otro}},
      \qquad
      \vec{\omega}_{piv} = \left(\vec{\omega}_{rel}\cdot\vec{n}\right)\vec{n},
      \qquad
      \vec{\omega}_{rod} = \vec{\omega}_{rel} - \vec{\omega}_{piv}
      $$

      El centro, desde B; y como toda la figura gira alrededor de Z con G,
      a $\Omega$, G recorre una circunferencia de radio
      $d = (3+\sqrt{3})R/2$ y $\vec{\omega}_e$ tiene componentes fijas en
      unos ejes que giran con él:

      $$
      \vec{v}_G = \vec{\omega}_e\times\overrightarrow{BG},
      \qquad
      \Omega = \frac{v_G}{d},
      \qquad
      a_G = \Omega^{2}d,
      \qquad
      \vec{\alpha}_e = \Omega\,\vec{k}\times\vec{\omega}_e
      $$

      **4. Resultados.** Con $\overrightarrow{BC} = (0;\ R;\ R)$, la esfera
      lleva en C $\lambda\,(1+\sqrt{3})R\,\vec{i}$ y el cilindro
      $\omega\,(1+\sqrt{3})R/2\,\vec{i}$: $\lambda = \omega/2$.

      $$
      \vec{\omega}_e = \frac{\sqrt{3}}{2}\,\omega\,\vec{j} - \frac{\omega}{2}\,\vec{k},
      \qquad
      |\vec{\omega}_e| = \omega
      $$

      El EIRD es la recta AB, en el plano $x = 0$:
      $y + \sqrt{3}\,z + (3+\sqrt{3})R/2 = 0$.

      <figure class="figura-examen">
      <svg viewBox="128 4 252 176" role="img" width="378" height="264" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">El EIRD de la esfera y la velocidad de su centro</title>
        <desc id="dsl-d">El mismo corte por el plano YZ: el cilindro a la derecha, la esfera de centro G, el plano y la pared del cono. A trazos, la recta que pasa por los dos contactos fijos, A y B, y se prolonga a los dos lados: el EIRD. Sobre ella, más allá de B, la velocidad angular de la esfera, omega e, hacia abajo y hacia el cilindro. En G, la velocidad del centro, saliendo del papel.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M245.4 50 H354.6 V150 H245.4 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M245.4 110 A40 40 0 1 0 165.4 110 A40 40 0 1 0 245.4 110 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M150 150 H245.4" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M182.3 150 L146.7 88.4" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M153.4 120 L250 175.8" fill="none" stroke="var(--ink)" stroke-width="1" stroke-dasharray="4 3"/>
        <line x1="300" y1="172" x2="300" y2="6" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="300" y1="150" x2="372" y2="150" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="215.8" y1="156" x2="241.8" y2="171" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="236" y="160" font-size="10" text-anchor="end" fill="var(--ink)" font-style="italic">ω<tspan font-size="7.5" dy="2.5">e</tspan></text>
        <circle cx="205.4" cy="110" r="5.5" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
        <circle cx="205.4" cy="110" r="1.7" fill="var(--ink)"/>
        <text x="212" y="100" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">v<tspan font-size="7.5" dy="2.5">G</tspan></text>
        <circle cx="205.4" cy="110" r="2.4" fill="var(--ink)"/>
        <text x="198" y="104" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">G</text>
        <circle cx="205.4" cy="150" r="2.4" fill="var(--ink)"/>
        <text x="198" y="164" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">B</text>
        <circle cx="170.7" cy="130" r="2.4" fill="var(--ink)"/>
        <text x="164" y="140" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">A</text>
        <circle cx="245.4" cy="110" r="2.4" fill="var(--ink)"/>
        <text x="239" y="98" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">C</text>
        <text x="306" y="12" font-size="9" text-anchor="start" fill="var(--faint)">Z</text>
        <text x="374" y="154" font-size="9" text-anchor="start" fill="var(--faint)">Y</text>
        <text x="130" y="116" font-size="9" text-anchor="start" fill="var(--faint)">EIRD</text>
      </svg>
      <figcaption>

      El EIRD es la recta AB, la de los dos contactos fijos: la esfera gira alrededor de ella con ωe, de dirección (0; √3; −1), 30° por debajo de la horizontal, sin deslizar. El centro G está a √3 R/2 de esa recta y se mueve perpendicular al corte, saliendo del papel.

      </figcaption>
      </figure>

      Rodadura y pivotamiento:

      - **Contra el plano**, quieto: pivotamiento $-(\omega/2)\,\vec{k}$ y
        rodadura $(\sqrt{3}/2)\,\omega\,\vec{j}$.
      - **Contra el cono**, quieto:
        $\vec{\omega}_e\cdot\vec{n} = \omega/2$, así que el pivotamiento es
        $(\omega/2)\,\vec{n} = (\sqrt{3}/4)\,\omega\,\vec{j} + (1/4)\,\omega\,\vec{k}$
        y la rodadura, el resto,
        $(\sqrt{3}/4)\,\omega\,\vec{j} - (3/4)\,\omega\,\vec{k}$.
      - **Contra el cilindro**, que gira:
        $\vec{\omega}_{rel} = (\sqrt{3}/2)\,\omega\,\vec{j} - (3/2)\,\omega\,\vec{k}$,
        pivotamiento $(\sqrt{3}/2)\,\omega\,\vec{j}$ y rodadura
        $-(3/2)\,\omega\,\vec{k}$.

      El centro y la aceleración angular:

      $$
      \vec{v}_G = \vec{\omega}_e\times R\,\vec{k} = \frac{\sqrt{3}}{2}\,\omega R\,\vec{i},
      \qquad
      \Omega = \frac{\sqrt{3}\,\omega}{3+\sqrt{3}} = \frac{(\sqrt{3}-1)\,\omega}{2}
      $$

      $$
      \vec{a}_G = (3-\sqrt{3})\,\frac{\omega^{2}R}{4}\,\vec{j},
      \qquad
      \vec{\alpha}_e = \frac{(\sqrt{3}-1)\,\omega}{2}\,\vec{k}\times\vec{\omega}_e
      = -(3-\sqrt{3})\,\frac{\omega^{2}}{4}\,\vec{i}
      $$

      con $\vec{a}_G$ hacia el eje del cilindro. Con los valores de prueba
      de las casillas, $\omega = 4$ rad/s y $R = 0{,}5$ m:
      $v_G = 1{,}732$ m/s y $a_G = 2{,}536$ m/s².

      **5. Comprobación.** En unos ejes que giran alrededor de Z con G, a
      una $\Omega$ por determinar, sin pasar por $\vec{v}_G$. En ellos G
      está quieto, la esfera gira a
      $\vec{\omega}' = \vec{\omega}_e - \Omega\,\vec{k} = (a;\ b;\ c)$, el
      plano y el cono giran a $-\Omega$ y el cilindro a $\omega - \Omega$.
      Sin deslizar, en cada contacto la esfera lleva la velocidad de lo que
      toca, todas según x; con $d = (3+\sqrt{3})R/2$, la distancia de G al
      eje, y $\rho = (1+\sqrt{3})R/2$, el radio del cilindro:

      $$
      \text{B:}\ \ bR = \Omega d,\ \ a = 0;
      \qquad
      \text{C:}\ \ -cR = (\omega - \Omega)\,\rho;
      \qquad
      \text{A:}\ \ \frac{\sqrt{3}\,c - b}{2}\,R = -\Omega\,\frac{3+2\sqrt{3}}{2}\,R
      $$

      Llevando b y c de las dos primeras a la tercera,
      $(3+\sqrt{3})\,\omega = (6+4\sqrt{3})\,\Omega$:

      $$
      \Omega = \frac{3+\sqrt{3}}{6+4\sqrt{3}}\,\omega = \frac{(\sqrt{3}-1)\,\omega}{2},
      \qquad
      b = \frac{\sqrt{3}}{2}\,\omega,
      \qquad
      c = -\frac{\sqrt{3}}{2}\,\omega
      $$

      y $\vec{\omega}_e = \vec{\omega}' + \Omega\,\vec{k} = \frac{\sqrt{3}}{2}\,\omega\,\vec{j} - \frac{\omega}{2}\,\vec{k}$:
      la misma, y la misma $\Omega$, que ahora no sale de $v_G/d$. En estos
      ejes $\vec{\omega}_e$ no cambia, y su derivada es la de arrastrarla,
      $\Omega\,\vec{k}\times\vec{\omega}_e$: la $\vec{\alpha}_e$ de arriba.

      **Lo que dice el resultado.** La esfera gira tan deprisa como el
      cilindro, $|\vec{\omega}_e| = \omega$, alrededor de la recta AB, 30°
      por debajo de la horizontal; y esa recta da la vuelta al eje con G a
      $\Omega = 0{,}366\,\omega$, casi tres veces más despacio que el
      cilindro. Como dice el enunciado, rueda y pivota en los tres
      contactos: el pivotamiento vale $\omega/2$ contra el plano y contra el
      cono, y $(\sqrt{3}/2)\,\omega$ contra el cilindro.

  - id: ejma7-col716-la-esfera-entre-dos-conos
    titulo: La esfera entre dos conos de 30 grados y un plano que la tapa
    fuente: >-
      Ejercicio 7.16 · Tema 7, «Cinemática del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo. Los apartados de
      pivotamiento y rodadura salen exactamente como los imprime la colección;
      en la velocidad angular la colección escribe j donde, con esos mismos
      ejes, corresponde i. Las casillas piden el número con los valores de
      prueba que se declaran en cada pregunta.
    nivel: practica
    antes:
      idea: |
        Rodar sin deslizar sobre otra superficie es que, en el contacto, los
        dos sólidos tengan la misma velocidad. La velocidad angular de un
        sólido respecto de otro se descompone en cada contacto en dos partes:
        según la normal común, el pivotamiento, y en el plano tangente, la
        rodadura.
      formula: |
        El campo de velocidades, el giro relativo a otro sólido y su
        descomposición con $\vec{n}$ la normal común en el contacto:

        $$
        \vec{v}_P = \vec{v}_Q + \vec{\omega}\times\overrightarrow{QP},
        \qquad
        \vec{\omega}_{rel} = \vec{\omega} - \vec{\omega}_{\text{otro}}
        $$

        $$
        \vec{\omega}_{piv} = \left(\vec{\omega}_{rel}\cdot\vec{n}\right)\vec{n},
        \qquad
        \vec{\omega}_{rod} = \vec{\omega}_{rel} - \vec{\omega}_{piv}
        $$

        Y si la velocidad angular tiene componentes fijas en unos ejes que
        giran a $\vec{\Omega}$, su derivada es
        $\vec{\alpha} = \vec{\Omega}\times\vec{\omega}$.
      reconocer: |
        Antes de calcular se mira qué toca la esfera y cómo se mueve cada
        cosa que toca.
    enunciado: |
      El sistema mostrado se compone de una pista cónica fija de eje vertical
      y semi-ángulo en el vértice de 30°. Con el mismo eje, se tiene un cono
      de revolución del mismo semi-ángulo que gira con velocidad angular de
      módulo constante (positivo). Entre ambos conos, se dispone una esfera de
      radio R/(2√3). El conjunto se tapa con un plano fijo horizontal.
      Sabiendo que la esfera no desliza en ninguno de sus contactos, calcular:

      a) Velocidad angular de la esfera.

      b) Componentes de pivotamiento y rodadura en el movimiento de la esfera
      relativo al cono móvil. Dibujar los vectores sobre la figura.

      c) Velocidad del punto G y aceleración angular de la esfera.

