    pide: La velocidad angular y la aceleración angular del disco A, y la aceleración del punto D.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué condición fija la velocidad de giro propio del disco A?
        opciones:
          - texto: Que su punto de contacto D tenga velocidad nula
            correcta: true
            mensaje: |
              Eso es rodar sin deslizar. Esa única ecuación relaciona el giro
              propio con el del eje: $\omega_{\text{propio}} = \omega_1 R/r$.
          - texto: Que el centro A esté quieto
            mensaje: |
              A no está quieto: describe una circunferencia de radio R
              alrededor del eje vertical, a velocidad $\omega_1 R$.
          - texto: Que los dos discos giren a la misma velocidad y en el mismo sentido
            mensaje: |
              Están a la misma distancia del centro, así que sus giros propios
              tienen el mismo módulo, pero eso no lo fija: lo fija el no
              deslizamiento en cada contacto.

      - tipo: calcular
        titulo: El giro propio del disco
        pregunta: |
          Con $\omega_1 = 2\ \text{rad/s}$, $R = 0{,}3\ \text{m}$ y radio de
          disco $r = 0{,}2\ \text{m}$, ¿cuánto vale la componente $x$ de
          $\vec{\omega}_A$, en rad/s?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.02
          formato: un número, en rad/s
        distractores:
          - valor: '1.3333'
            mensaje: |
              Has invertido la fracción: es $\omega_1 R/r$, no
              $\omega_1 r/R$. El disco da más vueltas cuanto mayor es el
              círculo que recorre y menor su radio.
          - valor: '2'
            mensaje: |
              Ese es $\omega_1$, la componente vertical. El giro propio
              alrededor del eje AB es otro sumando, y aquí vale
              $\omega_1 R/r = 3$ rad/s.
        pista: |
          $\vec{v}_D = \vec{v}_A + \vec{\omega}_A\times\overrightarrow{AD}
          = \vec{0}$, con $\vec{v}_A = \omega_1 R$ y
          $\overrightarrow{AD} = -r\,\vec{j}$.
        desarrollo: |
          $$
          \vec{\omega}_A = \frac{\omega_1 R}{r}\,\vec{i} + \omega_1\,\vec{j}
          = 3\,\vec{i} + 2\,\vec{j}\ \text{rad/s}
          $$

      - tipo: calcular
        titulo: La aceleración del punto de contacto
        pregunta: |
          Con los mismos valores, ¿cuánto vale la componente $y$ de
          $\vec{a}_D$, en m/s²?
        respuesta:
          tipo: numero
          valor: '1.8'
          tolerancia: 0.02
          formato: un número, en m/s², con su signo
        distractores:
          - valor: '0'
            mensaje: |
              El error clásico del tema: el punto de contacto tiene velocidad
              nula, pero **no** aceleración nula. Un instante después ya no
              toca el suelo, y su aceleración apunta hacia el centro del
              disco.
          - valor: '-1.2'
            mensaje: |
              Esa es la componente $x$, la centrípeta del giro del eje
              alrededor de la vertical. La componente $y$ es la que empuja D
              hacia el centro del disco.
        pista: |
          $\vec{a}_D = \vec{a}_A + \vec{\alpha}\times\overrightarrow{AD} +
          \vec{\omega}_A\times(\vec{\omega}_A\times\overrightarrow{AD})$, con
          $\vec{a}_A = \omega_1^{2}R$ hacia el eje.
        desarrollo: |
          $$
          \vec{a}_D = -\omega_1^{2}R\,\vec{i} + \frac{\omega_1^{2}R^{2}}{r}\,\vec{j}
          = -1{,}2\,\vec{i} + 1{,}8\,\vec{j}\ \text{m/s}^{2}
          $$

          La componente $y$, hacia arriba, es la centrípeta del giro propio:
          $(\omega_1 R/r)^{2}\,r = \omega_1^{2}R^{2}/r$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: C está fijo, así que $\vec{v}_A = \vec{\omega}_1\times\overrightarrow{CA}$, de módulo $\omega_1 R$.
          - texto: 'Rodadura: $\vec{v}_D = \vec{0}$ da el giro propio $\omega_1 R/r$, y $\vec{\omega}_A = (\omega_1 R/r)\vec{i} + \omega_1\vec{j}$.'
          - texto: $\vec{\alpha} = \vec{\omega}_1\times(\omega_1R/r)\vec{i} = -(\omega_1^{2}R/r)\vec{k}$, y de ahí sale $\vec{a}_D$.
          - texto: Como D no desliza, su aceleración también es nula y el EIRD pasa por él con velocidad y aceleración nulas.
            trampa: true
            mensaje: |
              El EIRD sí pasa por D —la recta que une los dos contactos con el
              punto fijo C—, pero eso solo dice que la **velocidad** es nula.
              La aceleración de D vale
              $-\omega_1^{2}R\vec{i} + (\omega_1^{2}R^{2}/r)\vec{j}$.
    resolucion: |
      **El planteamiento.** El centro C del eje está fijo, así que todo el
      conjunto gira alrededor de él. El disco A tiene dos giros: el del eje,
      $\omega_1$ alrededor de la vertical, y el propio, alrededor de AB.

      **a) Velocidad angular.** La velocidad de A es
      $\omega_1 R$ y la condición de rodadura, $\vec{v}_D = \vec{0}$, da el
      giro propio:

      $$
      \vec{\omega}_A = \frac{\omega_1 R}{r}\,\vec{i} + \omega_1\,\vec{j}
      $$

      **b) Aceleración angular.** El giro propio cambia de dirección
      arrastrado por el del eje:

      $$
      \vec{\alpha} = \vec{\omega}_1 \times \frac{\omega_1 R}{r}\vec{i}
      = -\frac{\omega_1^{2}R}{r}\,\vec{k}
      $$

      **c) Aceleración de D.** Con
      $\vec{a}_A = \omega_1^{2}R\,\vec{i}$ —centrípeta hacia el eje— y
      $\overrightarrow{AD} = -r\vec{j}$:

      $$
      \vec{a}_D = -\omega_1^{2}R\,\vec{i} + \frac{\omega_1^{2}R^{2}}{r}\,\vec{j}
      $$

      **d) El EIRD** es la recta que pasa por C y por los dos puntos de
      contacto: todos tienen velocidad nula. El axoide fijo es el cono que
      esa recta barre en el suelo —de vértice C y base la circunferencia que
      recorren los contactos—, y el axoide móvil, el cono que barre dentro
      del propio disco.

      Con $\omega_1 = 2\ \text{rad/s}$, $R = 0{,}3$ m y $r = 0{,}2$ m:
      $\vec{\omega}_A = 3\vec{i}+2\vec{j}$ rad/s,
      $\vec{\alpha} = -6\vec{k}$ rad/s² y
      $\vec{a}_D = -1{,}2\vec{i}+1{,}8\vec{j}$ m/s².
  - id: ejma7-col77-el-brazo-abc-y-el-disco-de-seis-metros
    titulo: El disco del brazo ABC, con dos giros perpendiculares
    fuente: >-
      Ejercicio 7.7 · Tema 7, «Cinemática del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Un disco de 6 m de radio de giro a una velocidad angular constante
      ω₂ = 4 rad/s con respecto al brazo ABC, que a su vez gira a una
      velocidad constante ω₁ = 3 rad/s con respecto al eje Y. Determinar:

      a) Aceleración angular del disco.

