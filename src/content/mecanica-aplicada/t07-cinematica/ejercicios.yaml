    pide: La velocidad angular del cono y las componentes de pivotamiento y rodadura de su movimiento relativo al disco.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué condición traduce que el cono ruede sin deslizar sobre el
          disco?
        opciones:
          - texto: Que en cada punto de la generatriz de contacto, cono y disco tengan la misma velocidad
            correcta: true
            mensaje: |
              Eso es. El contacto es una recta entera —la generatriz—, y en
              toda ella las dos velocidades han de coincidir. Basta imponerlo
              en un punto: como las dos son lineales en la distancia a O, se
              cumple en todos.
          - texto: Que el vértice O tenga velocidad nula
            mensaje: |
              O tiene velocidad nula, sí, pero eso pasa por estar en el eje de
              giro: no dice nada del deslizamiento. La condición que fija
              $\omega$ es la igualdad de velocidades en la generatriz.
          - texto: Que el centro B de la base esté quieto
            mensaje: |
              B recorre una circunferencia a 2ω: precisamente el dato del
              enunciado. No está quieto.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el disco y el cono cortados
          por el plano YZ, con los giros como vectores y, en un punto P de la
          generatriz de contacto, la velocidad del disco**. Solo las
          direcciones, sin escala.
        comprueba:
          - punto: |
              **El giro del disco, $\omega$, y la precesión, $2\omega$, los
              dos sobre el eje vertical OO'; el giro propio, $\omega_s$, sobre
              el eje del cono, OB.**
            porque: |
              B recorre una circunferencia alrededor de OO' a $2\omega$: ese
              es el giro del plano que contiene al eje del cono. El giro
              propio va a lo largo de OB, con el sentido aún por saber.
          - punto: |
              **El eje OB a 30° de la generatriz apoyada, OC, que va según
              y.**
            porque: |
              El ángulo medio del cono es el que forma su eje con cualquier
              generatriz, también con la que toca el disco.
          - punto: |
              **En P, la velocidad del disco, perpendicular al papel.**
            porque: |
              El disco gira alrededor de OO': sus puntos sobre el eje y se
              mueven según x, a $\omega$ por su distancia a O.
        figura: |
          <svg viewBox="4 6 272 178" role="img" width="272" height="178" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">Esquema de los giros del cono que rueda sobre el disco</title>
            <desc id="dsl-d">El disco y el cono cortados por el plano YZ: el disco horizontal, con su eje vertical OO′; el cono, con el vértice O en el centro del disco, apoyado en él a lo largo de la generatriz OC, según y, y con su eje OB a 30 grados de ella. Sobre el eje vertical, por encima de O, la precesión dos omega, hacia arriba; por debajo del disco, el giro omega del disco, hacia arriba. Sobre la prolongación del eje OB, más allá de B, el giro propio omega s, hacia fuera del vértice. En un punto P de la generatriz de contacto, la velocidad del disco, perpendicular al papel y hacia dentro.</desc>
