      - **El eje vertical** gira a $\omega_1 = 3$ rad/s alrededor de Y, que
        es fijo, con $\alpha_1 = 2$ rad/s², y se lleva el eje AB.
      - **La placa** gira respecto de AB a $\omega_2 = 4$ rad/s, constante,
        alrededor de AB, según z. Los dos sentidos, +j y +k, son los que toma
        la colección.
      - **AB** es parte del eje: su dirección gira alrededor de Y.
      - **O**, el punto medio de AB, está en los dos ejes: ninguno de los
        dos giros lo mueve, y es punto fijo de la placa. **C**, en el centro
        del lado opuesto, está a 450 mm de AB medidos sobre la placa, que
        forma 20° con la horizontal.

      **2. Incógnitas.** $\vec{\alpha}$ de la placa, $\vec{v}_C$ y
      $\vec{a}_C$.

      **3. Ecuaciones.** Los giros y la aceleración angular, con $\omega_2$
      constante y $d\vec{k}/dt = \vec{\omega}_1\times\vec{k}$ porque AB gira
      con el eje vertical:

      $$
      \vec{\omega} = \omega_1\,\vec{j} + \omega_2\,\vec{k},
      \qquad
      \vec{\alpha} = \alpha_1\,\vec{j} + \omega_2\,\frac{d\vec{k}}{dt}
      = \alpha_1\,\vec{j} + \vec{\omega}_1\times\vec{\omega}_2
      $$

      Y los dos campos desde O, que está quieto, con
      $\overrightarrow{OC} = 0{,}45\,(\cos 20^\circ;\ -\sin 20^\circ;\ 0)$ m:

      $$
      \vec{v}_C = \vec{\omega}\times\overrightarrow{OC},
      \qquad
      \vec{a}_C = \vec{\alpha}\times\overrightarrow{OC}
      + \vec{\omega}\times\vec{v}_C
      $$

      **4. Resultados.**

      $$
      \vec{\omega} = 3\,\vec{j} + 4\,\vec{k}\ \text{rad/s},
      \qquad
      \vec{\alpha} = 2\,\vec{j} + 3\,\vec{j}\times 4\,\vec{k}
      = 12\,\vec{i} + 2\,\vec{j}\ \text{rad/s}^{2}
      $$

      Con $\overrightarrow{OC} = (0{,}4229;\ -0{,}1539;\ 0)$ m:

      $$
      \vec{v}_C = (0;\ 3;\ 4)\times(0{,}4229;\ -0{,}1539;\ 0)
      = 0{,}616\,\vec{i} + 1{,}691\,\vec{j} - 1{,}269\,\vec{k}\ \text{m/s},
      \qquad
      |\vec{v}_C| = 2{,}20\ \text{m/s}
      $$

      Con $\vec{\alpha}\times\overrightarrow{OC} = -2{,}693\,\vec{k}$ y
      $\vec{\omega}\times\vec{v}_C = (-10{,}572;\ 2{,}463;\ -1{,}847)$:

      $$
      \vec{a}_C = -10{,}57\,\vec{i} + 2{,}46\,\vec{j} - 4{,}54\,\vec{k}\ \text{m/s}^{2},
      \qquad
      |\vec{a}_C| = 11{,}77\ \text{m/s}^{2}
      $$

      **5. Comprobación.** Por la composición de movimientos, que no se ha
      usado: el eje vertical con AB arrastra, y la placa gira respecto de él
      alrededor de AB, que en ese sistema es un eje fijo. En velocidades,
      arrastre $\vec{\omega}_1\times\overrightarrow{OC} = -1{,}269\,\vec{k}$
      y relativa
      $\vec{v}_{\text{rel}} = \vec{\omega}_2\times\overrightarrow{OC} = (0{,}616;\ 1{,}691;\ 0)$:
      la suma es la de arriba. En aceleraciones, el arrastre es el de un
      punto que gira alrededor de Y,
      $\vec{\alpha}_1\times\overrightarrow{OC} + \vec{\omega}_1\times(\vec{\omega}_1\times\overrightarrow{OC}) = (-3{,}806;\ 0;\ -0{,}846)$;
      la relativa, la centrípeta del giro uniforme alrededor de AB,
      $-\omega_2^{2}\,\overrightarrow{OC} = (-6{,}766;\ 2{,}463;\ 0)$; y
      Coriolis:

      $$
      2\,\vec{\omega}_1\times\vec{v}_{\text{rel}} = 2\cdot 3\,\vec{j}\times(0{,}616;\ 1{,}691;\ 0) = -3{,}694\,\vec{k}
      $$

      La suma, $(-10{,}572;\ 2{,}463;\ -4{,}540)$ m/s², es la misma.

      **Lo que dice el resultado.** En x, las dos centrípetas, la del eje
      vertical y la del giro alrededor de AB, apuntan hacia los ejes y se
      suman: $-(\omega_1^{2}+\omega_2^{2})\,x_C = -25\cdot 0{,}423$. La
      componente y existe solo porque la placa está inclinada: es la
      centrípeta del giro alrededor de AB sobre la altura de C,
      $-\omega_2^{2}\,y_C = 2{,}46$ m/s². Y en z se juntan $\alpha_1$, que
      aporta $-\alpha_1\,x_C = -0{,}85$, y el acoplamiento de los dos giros,
      $-3{,}69$, que en la resolución sale mitad de
      $\vec{\alpha}\times\overrightarrow{OC}$ y mitad del producto doble, y
      en la comprobación, entero, de Coriolis.

  - id: ejma7-col710-el-brazo-cd-que-gira-sobre-la-barra-bc
    titulo: El brazo CD sobre una barra que gira, con el ángulo en el plano XY
    fuente: >-
      Ejercicio 7.10 · Tema 7, «Cinemática del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo. Las cotas de la figura
      están en milímetros, así que las velocidades salen en mm/s y las
      aceleraciones en mm/s².
    nivel: practica
    antes:
      idea: |
        El brazo CD tiene dos giros: el de la barra BC alrededor de Y, que lo
        arrastra, y el suyo propio alrededor de C respecto de la barra. Su
        velocidad angular es la suma vectorial de los dos, su aceleración
        angular es la derivada de esa suma, y los campos dan las de D desde
        C, que es un punto de la barra.
      formula: |
        La composición de los giros, la aceleración angular y los dos campos
        del brazo, desde C:

        $$
        \vec{\omega} = \vec{\omega}_1 + \vec{\omega}_2,
        \qquad
        \vec{\alpha} = \frac{d\vec{\omega}}{dt}
        $$

        $$
        \vec{v}_D = \vec{v}_C + \vec{\omega}\times\overrightarrow{CD},
        \qquad
        \vec{a}_D = \vec{a}_C + \vec{\alpha}\times\overrightarrow{CD}
        + \vec{\omega}\times\left(\vec{\omega}\times\overrightarrow{CD}\right)
        $$
      reconocer: |
        Antes de calcular se mira cómo se mueve cada parte: el sólido AB con
        la barra BC, y el brazo CD respecto de ella.
    enunciado: |
      El sólido AB y la barra BC giran a una velocidad constante ω₁ = 0.6
      rad/s alrededor de Y. Simultáneamente el brazo CD gira a velocidad
      constante ω₂ = 0.45 rad/s. Sabiendo que β = 120º, calcular:

      a) Aceleración angular del brazo CD.

      b) Velocidad de D.

      c) Aceleración de D.

      <figure>
      <svg viewBox="0 0 300 200" role="img" width="300" height="200" aria-labelledby="ma7c10-t ma7c10-d">
