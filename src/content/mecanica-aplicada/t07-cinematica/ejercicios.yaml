    pide: Las velocidades y aceleraciones angulares del eje AB y de la barra CD, y la aceleración absoluta de M.
    pasos:
      - tipo: reconocer
        pregunta: |
          En el instante ωt = π/2 la barra CD ha girado 90° desde la vertical,
          así que queda horizontal. ¿Cuánto vale entonces la velocidad de M
          respecto del plano π?
        opciones:
          - texto: Cero, porque la deslizadera avanza $v$ y la masa retrocede $v$ sobre la barra
            correcta: true
            mensaje: |
              Eso es, y es la clave del problema. Con la barra ya horizontal,
              las dos velocidades relativas son opuestas y se cancelan: no hay
              Coriolis con el giro del plano.
          - texto: $2v$, porque las dos velocidades relativas se suman
            mensaje: |
              Se sumarían si M se alejara de C. La flecha de la figura apunta
              de D hacia C: M se acerca a la deslizadera, y con la barra
              horizontal las dos velocidades son opuestas.
          - texto: $v$, la de la masa sobre la barra
            mensaje: |
              Falta el arrastre de la propia deslizadera, que también se mueve
              respecto del plano. Hay que componer los dos movimientos.

      - tipo: calcular
        titulo: La aceleración angular de la barra CD
        pregunta: |
          Con el valor de prueba $\omega = 3\ \text{rad/s}$, ¿cuánto vale la
          componente $y$ de $\vec{\alpha}_{CD}$, en rad/s²?
        respuesta:
          tipo: numero
          valor: '9'
          tolerancia: 0.05
          formato: un número, en rad/s², con su signo
        distractores:
          - valor: '0'
            mensaje: |
              Los dos giros son de módulo constante, pero el eje del giro
              relativo de CD —perpendicular al plano— gira con el plano:
              $\vec{\alpha}_{CD} = \vec{\omega}\times\vec{\omega}_{CD/\pi}$.
          - valor: '3'
            mensaje: |
              Has puesto $\omega$ en lugar de $\omega^{2}$. La aceleración
              angular sale de un producto de dos velocidades angulares, así
              que va en rad/s² y vale $\omega^{2}$.
        pista: |
          En ese instante $\vec{\omega}_{CD/\pi} = \omega\vec{i}$ y el plano
          gira con $\omega\vec{k}$.
        desarrollo: |
          $$
          \vec{\omega}_{CD} = \omega\,\vec{i} + \omega\,\vec{k}
          \qquad
          \vec{\alpha}_{CD} = \omega\vec{k}\times\omega\vec{i} = \omega^{2}\,\vec{j}
          $$

      - tipo: calcular
        titulo: La aceleración de la masa
        pregunta: |
          Con $\omega = 3\ \text{rad/s}$, $v = 2\ \text{m/s}$ y
          $L = 1\ \text{m}$, ¿cuánto vale la componente $z$ de $\vec{a}_M$, en
          m/s²?
        respuesta:
          tipo: numero
          valor: '-12'
          tolerancia: 0.1
          formato: un número, en m/s², con su signo
        distractores:
          - valor: '12'
            mensaje: |
              El módulo está bien y el signo no. La masa se acerca a C sobre
              una barra que gira, y ese término $-2\omega v$ apunta hacia
              abajo.
          - valor: '-9'
            mensaje: |
              Eso es $-\omega^{2}L$, la componente $y$: la centrípeta del
              arrastre. La componente $z$ viene del giro de la barra sobre la
              velocidad relativa de la masa.
        pista: |
          Como la velocidad de M respecto del plano es nula, no hay Coriolis
          con el plano; lo que queda es el arrastre, $-\omega^{2}L\vec{j}$, y
          el término de la barra girando bajo la masa.
        desarrollo: |
          $$
          \vec{a}_M = -\omega^{2}L\,\vec{j} - 2\omega v\,\vec{k}
          = -9\,\vec{j} - 12\,\vec{k}\ \text{m/s}^{2}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'AB está soldado al eje vertical: $\vec{\omega}_{AB} = \omega\vec{k}$ y $\vec{\alpha}_{AB} = \vec{0}$.'
          - texto: 'CD gira además dentro del plano: $\vec{\omega}_{CD} = \omega\vec{i}+\omega\vec{k}$ y $\vec{\alpha}_{CD} = \omega^{2}\vec{j}$.'
          - texto: 'En ese instante la barra está horizontal y M se acerca a C: la velocidad de M respecto del plano es nula.'
          - texto: Como M coincide con C, su aceleración es la de la deslizadera C.
            trampa: true
            mensaje: |
              Coinciden en posición, no en movimiento: M recorre la barra que
              gira, y por eso aparece el término $-2\omega v\vec{k}$ que C no
              tiene. Coincidir en un punto no es ser el mismo punto material.
    resolucion: |
      **Los giros.** El eje AB está soldado al eje vertical, así que
      $\vec{\omega}_{AB} = \omega\,\vec{k}$ y, al ser $\omega$ constante y el
      eje fijo, $\vec{\alpha}_{AB} = \vec{0}$.

      La barra CD gira además dentro del plano, alrededor de un eje
      perpendicular a él, que en el instante $\omega t = \pi/2$ es el eje $x$:

      $$
      \vec{\omega}_{CD} = \omega\,\vec{i} + \omega\,\vec{k}
      \qquad
      \vec{\alpha}_{CD} = \vec{\omega}\times\vec{\omega}_{CD/\pi} = \omega^{2}\,\vec{j}
      $$

      **La masa.** En ese instante la barra ha girado 90° y está horizontal,
      apuntando en el sentido en que avanza la deslizadera. Como C avanza a
      $v$ y M retrocede a $v$ sobre la barra, la velocidad de M **respecto del
      plano** es nula: no hay aceleración complementaria con el giro del
      plano. Quedan la centrípeta del arrastre y el término que produce la
      barra girando bajo la masa:

      $$
      \vec{a}_M = -\omega^{2}L\,\vec{j} - 2\omega v\,\vec{k}
      $$

      La derivación numérica de la posición de M confirma este resultado, y
      además muestra lo sensible que es al sentido de las velocidades
      relativas: si M se alejara de C en vez de acercarse, aparecería una
      componente $-4\omega v\,\vec{i}$ perpendicular al plano.

  - id: ejma7-col719-el-cono-que-rueda-sobre-otro-cono
    titulo: El cono que rueda sin deslizar sobre otro cono que gira
    fuente: >-
      Ejercicio 7.19 · Tema 7, «Cinemática del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo. Las casillas piden el
      número con los valores de prueba que se declaran en cada pregunta.
    nivel: practica
    enunciado: |
      El cono (1) gira alrededor de su eje fijo OZ con velocidad angular
      constante y positiva 3ω. Otro cono (2) rueda sin deslizar sobre el
      anterior de forma que su eje OY gira con velocidad angular constante,
      también positiva, 2ω y también alrededor del eje OZ. Calcular:

      a) Velocidad angular del cono (2).

      b) Componentes de rodadura y pivotamiento en el movimiento del cono (2)
      sobre (1).

      c) Aceleración angular absoluta del cono (2).

      d) Aceleración absoluta del punto A (0; R; R).

      e) Aceleración del punto A del cono 2 respecto al cono (1).

      <figure>
      <svg viewBox="0 0 300 200" role="img" width="300" height="200" aria-labelledby="ma7c19-t ma7c19-d">
        <title id="ma7c19-t">Los dos conos de 45 grados que se tocan a lo largo de una generatriz</title>
        <desc id="ma7c19-d">Corte por el plano YZ. El cono 1 tiene el vértice en O, el eje vertical OZ hacia abajo y semiángulo de 45 grados. El cono 2, del mismo vértice, tiene el eje OY horizontal y el mismo semiángulo. Los dos se tocan a lo largo de la generatriz que baja a 45 grados hacia la derecha. El punto A, de coordenadas cero, R y R, está en la generatriz superior del cono 2.</desc>
        <line x1="120" y1="180" x2="120" y2="20" stroke="var(--ink)" stroke-width="1"/>
        <text x="114" y="17" font-size="10" fill="var(--ink)">Z</text>
        <line x1="120" y1="110" x2="262" y2="110" stroke="var(--ink)" stroke-width="1"/>
        <text x="266" y="113" font-size="10" fill="var(--ink)">Y</text>
        <text x="108" y="106" font-size="10" fill="var(--ink)">O</text>
        <path d="M120 110 L180 50 L180 170 Z" fill="var(--faint)" fill-opacity="0.35" stroke="var(--ink)" stroke-width="1.2"/>
        <path d="M120 110 L180 170 L60 170 Z" fill="var(--d2)" fill-opacity="0.35" stroke="var(--ink)" stroke-width="1.2"/>
        <line x1="120" y1="110" x2="180" y2="170" stroke="var(--flag)" stroke-width="2.4"/>
        <circle cx="180" cy="50" r="3.6" fill="var(--d1)"/>
