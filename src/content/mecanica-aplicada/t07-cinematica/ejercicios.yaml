        <text x="105" y="112" font-size="9" text-anchor="middle" fill="var(--faint)">15 m</text>
        <text x="152" y="104" font-size="9" text-anchor="end" fill="var(--faint)">9 m</text>
        <text x="212" y="82" font-size="9" fill="var(--faint)">r = 6 m</text>
        <path d="M48 138 A 14 14 0 0 0 72 141" fill="none" stroke="var(--ink)" stroke-width="1.1"/>
        <text x="74" y="144" font-size="10" fill="var(--ink)">ω₁</text>
        <path d="M158 88 A 20 20 0 0 1 178 82" fill="none" stroke="var(--ink)" stroke-width="1.1"/>
