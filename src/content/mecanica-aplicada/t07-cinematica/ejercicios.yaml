ejercicios:
  - id: ejma7-el-disco-que-rueda
    titulo: Las velocidades de un disco que rueda sin deslizar
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Un disco de radio $R = 0{,}3\ \text{m}$ rueda sin deslizar sobre un suelo
      horizontal, girando con velocidad angular $\omega = 10\ \text{rad/s}$ en
      sentido horario, de modo que avanza hacia la derecha. Calcular la
      velocidad de su centro, la del punto más alto y la del punto delantero,
      en el extremo del radio horizontal.
    pide: Las velocidades del centro, del punto más alto y del punto delantero.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué punto del disco conviene usar como punto conocido del campo de
          velocidades?
        opciones:
          - texto: El punto de contacto con el suelo, porque al rodar sin deslizar su velocidad es nula
            correcta: true
            mensaje: |
              Eso es. En ese instante el punto de contacto no desliza, así que
              su velocidad es cero y el disco gira alrededor de él. Cualquier
              velocidad es $\omega$ por la distancia a ese punto.
          - texto: El centro, porque es el único punto que no se mueve
            mensaje: |
              El centro se mueve: avanza con el disco, a $\omega R$. Si lo usas
              como punto conocido, primero hay que saber su velocidad, y esa
              sale del punto de contacto.
          - texto: El punto más alto, porque es el que más rápido va
            mensaje: |
              Va el más rápido, pero no se conoce su velocidad de antemano. El
              único punto con velocidad conocida sin calcular nada es el de
              contacto.

      - tipo: calcular
        titulo: La velocidad del centro
        pregunta: |
          ¿A qué velocidad va el centro del disco?
        respuesta:
          tipo: magnitud
          valor: '3 m/s'
          formato: una velocidad, con su unidad
        distractores:
          - valor: '6 m/s'
            mensaje: |
              Has usado el diámetro, 0,6 m. El centro está a un **radio** del
              punto de contacto: $v_O = \omega R = 10 \cdot 0{,}3$.
          - valor: '0 m/s'
            mensaje: |
              El centro no está quieto: el disco avanza. El punto sin velocidad
              es el de contacto, a una distancia $R$ del centro.
        pista: |
          El centro está a una distancia $R$ del punto de contacto, que está
          quieto en ese instante.
        desarrollo: |
          $$
          v_O = \omega\,R = 10 \cdot 0{,}3 = 3\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La velocidad del punto más alto
        pregunta: |
          ¿A qué velocidad va el punto más alto del disco?
        respuesta:
          tipo: magnitud
          valor: '6 m/s'
          formato: una velocidad, con su unidad
        distractores:
          - valor: '3 m/s'
            mensaje: |
              Esa es la del centro. El punto más alto va a la velocidad del
              centro **más** la de su giro alrededor de él, que va en el mismo
              sentido: está a $2R$ del punto de contacto.
        pista: |
          El punto más alto está a $2R$ del punto de contacto.
        desarrollo: |
          $$
          v_{\text{arriba}} = \omega \cdot 2R = 10 \cdot 0{,}6 = 6\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La velocidad del punto delantero
        pregunta: |
          ¿Y el punto delantero, en el extremo del radio horizontal?
        respuesta:
          tipo: magnitud
          valor: '4.243 m/s'
          formato: una velocidad, con su unidad
        distractores:
          - valor: '6 m/s'
            mensaje: |
              Has sumado las dos componentes como si fueran paralelas. El
              avance del centro es horizontal y el giro alrededor del centro,
              en ese punto, vertical: se componen con Pitágoras.
          - valor: '3 m/s'
            mensaje: |
              Solo has puesto una de las dos componentes. A la velocidad del
              centro, horizontal, hay que sumarle la del giro alrededor de él,
              que en el punto delantero es vertical y hacia abajo.
        pista: |
          Está a $R\sqrt{2}$ del punto de contacto. O bien: la velocidad del
          centro, 3 m/s en horizontal, más $\omega R = 3\ \text{m/s}$ en vertical.
        desarrollo: |
          $$
          v = \omega\,R\sqrt{2} = 10 \cdot 0{,}3 \cdot 1{,}4142 = 4{,}243\ \text{m/s}
          $$

          A 45° por debajo de la horizontal: perpendicular a la recta que lo une
          con el punto de contacto.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: Al rodar sin deslizar, el punto de contacto tiene velocidad nula y el disco gira alrededor de él.
          - texto: 'El centro, a distancia $R$: $v_O = 3$ m/s. El punto más alto, a $2R$: 6 m/s.'
          - texto: El punto delantero, a $R\sqrt{2}$ del contacto, va a 4,243 m/s, perpendicular a esa distancia.
          - texto: Todos los puntos del disco van a la misma velocidad que el centro, porque el disco es rígido.
            trampa: true
            mensaje: |
              Solo sería así en una traslación, sin giro. El disco gira, y cada
              punto suma a la velocidad del centro la de su giro alrededor de
              él: el contacto va a 0 y el punto más alto al doble.
    resolucion: |
      **El punto de referencia.** Rodar sin deslizar significa que el punto de
      contacto tiene velocidad nula en ese instante. El disco gira alrededor de
      él, y cada punto va a $\omega$ por su distancia al contacto, perpendicular
      a esa distancia.

      **Los tres puntos.**

      $$
      v_O = \omega R = 3\ \text{m/s}
      \qquad
      v_{\text{arriba}} = \omega \cdot 2R = 6\ \text{m/s}
      \qquad
      v_{\text{delante}} = \omega R\sqrt{2} = 4{,}243\ \text{m/s}
      $$

      Lo mismo sale con el campo de velocidades desde el centro:
      $\vec{v}_P = \vec{v}_O + \vec{\omega} \times \overrightarrow{OP}$. En el punto de
      arriba, las dos van hacia delante y se suman; en el delantero, una es
      horizontal y la otra vertical.

  - id: ejma7-la-deslizadera-y-coriolis
    titulo: Una deslizadera en una varilla que gira, y la aceleración de Coriolis
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Una varilla gira en un plano horizontal alrededor de su extremo fijo $O$
      con velocidad angular constante $\omega = 2\ \text{rad/s}$. Por ella corre
      una deslizadera que se aleja de $O$ a velocidad constante de 1 m/s
      respecto de la varilla. En el instante en que está a 0,5 m de $O$,
      calcular la aceleración de Coriolis y el módulo de la aceleración
      absoluta de la deslizadera.
    pide: La aceleración de Coriolis y el módulo de la aceleración absoluta.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuántos términos tiene la aceleración absoluta de la deslizadera en
          ese instante?
        opciones:
          - texto: Dos no nulos, el arrastre centrípeto y Coriolis; la relativa es nula
            correcta: true
            mensaje: |
              Eso es. El giro es uniforme, así que el arrastre es solo la
              centrípeta; la deslizadera va a velocidad relativa constante, así
              que la relativa es nula; y Coriolis existe porque hay giro y
              velocidad relativa a la vez.
          - texto: Solo la centrípeta, porque todo va a velocidad constante
            mensaje: |
              Velocidades constantes en un sistema que gira no dan
              aceleración nula. Falta Coriolis, $2\vec{\omega} \times \vec{v}_r$, que
              aquí es el término mayor.
          - texto: Ninguno, porque la deslizadera va a velocidad constante
            mensaje: |
              Va a velocidad constante **respecto de la varilla**. Vista desde
              fuera, cambia de dirección y de módulo a la vez: la trayectoria
              absoluta es una espiral.

      - tipo: calcular
        titulo: La aceleración de Coriolis
        pregunta: |
          ¿Cuánto vale la aceleración de Coriolis, en m/s²?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.02
          formato: un número, en m/s²
        distractores:
          - valor: '2'
            mensaje: |
              Te has dejado el 2 de la fórmula: $a_c = 2\,\omega\,v_r$. Son dos
              efectos iguales que se suman, no uno.
          - valor: '1'
            mensaje: |
              Has multiplicado $\omega$ por la distancia en lugar de por la
              velocidad relativa, y sin el 2. Coriolis es $2\,\omega\,v_r$.
        pista: |
          $\vec{\omega}$ es perpendicular a la varilla, así que el módulo del
          producto vectorial es el producto de los módulos.
        desarrollo: |
          $$
          a_c = 2\,\omega\,v_r = 2 \cdot 2 \cdot 1 = 4\ \text{m/s}^{2}
          $$

          Perpendicular a la varilla, en el sentido del giro.

      - tipo: calcular
        titulo: La aceleración absoluta
        pregunta: |
          ¿Cuánto vale el módulo de la aceleración absoluta, en m/s²?
        respuesta:
          tipo: numero
          valor: '4.472'
          tolerancia: 0.01
          formato: un número, en m/s²
        distractores:
          - valor: '6'
            mensaje: |
              Has sumado los módulos, $2 + 4$. La centrípeta va a lo largo de la
              varilla, hacia $O$, y Coriolis perpendicular a ella: se componen
              con Pitágoras.
          - valor: '2'
            mensaje: |
              Esa es solo la centrípeta. Falta Coriolis, que en este instante es
              el doble de grande.
        pista: |
          Centrípeta, $\omega^{2} r = 2\ \text{m/s}^{2}$, a lo largo de la varilla;
          Coriolis, 4, perpendicular.
        desarrollo: |
          $$
          a = \sqrt{2^{2} + 4^{2}} = \sqrt{20} = 4{,}472\ \text{m/s}^{2}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'El arrastre es el de un punto pegado a la varilla: centrípeta, $\omega^{2} r = 2$ m/s², hacia $O$.'
          - texto: La relativa es nula, porque la deslizadera se aleja a velocidad constante respecto de la varilla.
          - texto: Coriolis vale $2\,\omega\,v_r = 4$ m/s², perpendicular a la varilla, y el total es $\sqrt{20} = 4{,}47$ m/s².
          - texto: Como la deslizadera va a velocidad constante respecto de la varilla, Coriolis es nulo.
            trampa: true
            mensaje: |
              Coriolis no depende de que la velocidad relativa cambie, sino de
              que exista mientras el sistema gira. Es $2\vec{\omega} \times \vec{v}_r$,
              y aquí vale 4 m/s².
    resolucion: |
      **Los tres términos.** La aceleración absoluta es la de arrastre, más la
      relativa, más la de Coriolis.

      - **Arrastre:** la de un punto de la varilla a 0,5 m, que gira uniforme:
        centrípeta, $\omega^{2} r = 4 \cdot 0{,}5 = 2\ \text{m/s}^{2}$, hacia $O$.
      - **Relativa:** nula, porque la velocidad relativa es constante y la
        trayectoria relativa, recta.
      - **Coriolis:** $2\,\omega\,v_r = 2 \cdot 2 \cdot 1 = 4\ \text{m/s}^{2}$,
        perpendicular a la varilla.

      **El total.** Dos componentes perpendiculares:

      $$
      a = \sqrt{2^{2} + 4^{2}} = 4{,}472\ \text{m/s}^{2}
      $$

      Coriolis domina: una deslizadera que se aleja rápido de un eje que gira
      despacio nota más el giro por Coriolis que por la centrípeta.

  - id: ejma7-col71-la-trayectoria-y-sus-componentes-intrinsecas
    titulo: Velocidad, componentes intrinsecas y radio de curvatura de una trayectoria
    fuente: >-
      Ejercicio 7.1 · Tema 7, «Cinemática del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo. En el radio de curvatura
      publica 35,5 m y las dos comprobaciones nuestras dan 35,05 m, así que se
      publica 35,05 y se explica la diferencia.
    nivel: practica
    enunciado: |
      Un cuerpo se mueve sobre una trayectoria cuyo vector de posición es
      $\vec{r} = t^{2}\vec{i} + t\vec{j} + \vec{k}$, siendo sus unidades
      metros. Calcular velocidad y aceleración con las dos componentes
      intrínsecas y el radio de curvatura de la trayectoria a los 2 segundos
      de iniciar el movimiento.
    pide: La velocidad, las componentes tangencial y normal de la aceleración y el radio de curvatura en t = 2 s.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se obtiene la componente tangencial de la aceleración?
        opciones:
          - texto: Derivando el módulo de la velocidad respecto del tiempo
            correcta: true
            mensaje: |
              Eso es. La tangencial mide cómo cambia la **rapidez**,
              $a_t = \mathrm{d}|\vec{v}|/\mathrm{d}t$; la normal mide cómo
              cambia la dirección.
          - texto: Tomando el módulo del vector aceleración
            mensaje: |
              Ese es el módulo total, que reparte entre las dos componentes:
              $|\vec{a}|^{2} = a_t^{2} + a_n^{2}$. Aquí vale 2 y la tangencial
              es menor.
          - texto: Proyectando la aceleración sobre el vector de posición
            mensaje: |
              La referencia intrínseca la marca la **velocidad**, no la
              posición. El vector de posición depende de dónde pongas el
              origen; la tangente a la trayectoria, no.

      - tipo: calcular
        titulo: La componente tangencial
        pregunta: |
          ¿Cuánto vale $a_t$ en $t = 2\ \text{s}$, en m/s²?
        respuesta:
          tipo: numero
          valor: '1.9403'
          tolerancia: 0.01
          formato: un número, en m/s²
        distractores:
          - valor: '2'
            mensaje: |
              Has puesto el módulo de la aceleración entera,
              $|\vec{a}| = 2\ \text{m/s}^{2}$. Solo una parte de ella acelera
              el módulo de la velocidad; el resto curva la trayectoria.
          - valor: '0.4851'
            mensaje: |
              Ese es el valor de la componente **normal**. La tangencial es la
              proyección de $\vec{a}$ sobre $\vec{v}$, y aquí es la mayor de
              las dos.
        pista: |
          $|\vec{v}| = \sqrt{4t^{2}+1}$, así que
          $a_t = 4t/\sqrt{4t^{2}+1}$.
        desarrollo: |
          $$
          \vec{v} = 2t\,\vec{i} + \vec{j}
          \qquad
          |\vec{v}| = \sqrt{4t^{2}+1} = \sqrt{17}
          \qquad
          a_t = \frac{8}{\sqrt{17}} = 1{,}940\ \text{m/s}^{2}
          $$

      - tipo: calcular
        titulo: El radio de curvatura
        pregunta: |
          ¿Cuánto vale el radio de curvatura en ese instante, en metros?
        respuesta:
          tipo: numero
          valor: '35.05'
          tolerancia: 0.06
          formato: un número, en m
        distractores:
          - valor: '35.5'
            mensaje: |
              Es el valor que imprime la colección. Las dos comprobaciones
              nuestras —$|\vec{v}|^{2}/a_n$ y
              $|\vec{v}|^{3}/|\vec{v}\times\vec{a}|$— dan 35,05 m, así que
              parece una errata de transcripción por 35,05.
          - valor: '8.5'
            mensaje: |
              Has dividido entre el módulo total de la aceleración. Quien
              curva la trayectoria es solo la componente **normal**, 0,485
              m/s², bastante menor: el radio sale mucho mayor.
        pista: |
          $\rho = |\vec{v}|^{2}/a_n$, con $a_n = \sqrt{|\vec{a}|^{2}-a_t^{2}}$.
        desarrollo: |
          $$
          a_n = \sqrt{2^{2}-1{,}940^{2}} = 0{,}4851\ \text{m/s}^{2}
          \qquad
          \rho = \frac{|\vec{v}|^{2}}{a_n} = \frac{17}{0{,}4851} = 35{,}05\ \text{m}
          $$

          Y por el otro camino, $\vec{v}\times\vec{a} = -2\vec{k}$, con lo que
          $\rho = |\vec{v}|^{3}/|\vec{v}\times\vec{a}| = 17\sqrt{17}/2$, el
          mismo número.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Derivando dos veces: $\vec{v} = 2t\vec{i}+\vec{j}$ y $\vec{a} = 2\vec{i}$, constante.'
          - texto: 'En $t=2$: $|\vec{v}| = \sqrt{17}$ y $a_t = \mathrm{d}|\vec{v}|/\mathrm{d}t = 8/\sqrt{17} = 1{,}94$ m/s².'
          - texto: $a_n = \sqrt{|\vec{a}|^{2}-a_t^{2}} = 0{,}485$ m/s² y $\rho = |\vec{v}|^{2}/a_n = 35{,}05$ m.
          - texto: Como la aceleración es constante, la trayectoria es una recta y el radio de curvatura es infinito.
            trampa: true
            mensaje: |
              Aceleración constante no implica recta: es el caso del tiro
              parabólico. La trayectoria es recta solo si $\vec{a}$ es
              paralela a $\vec{v}$, y aquí no lo es —el producto vectorial no
              se anula—.
    resolucion: |
      **La velocidad y la aceleración.** Derivando el vector de posición,
      $\vec{v} = 2t\,\vec{i} + \vec{j}$ y $\vec{a} = 2\,\vec{i}$. En
      $t = 2\ \text{s}$, $\vec{v} = 4\vec{i}+\vec{j}$, de módulo
      $\sqrt{17} = 4{,}123$ m/s.

      **Las componentes intrínsecas.** La tangencial es la derivada del
      módulo de la velocidad:

      $$
      a_t = \frac{\mathrm{d}}{\mathrm{d}t}\sqrt{4t^{2}+1} = \frac{4t}{\sqrt{4t^{2}+1}}
      = \frac{8}{\sqrt{17}} = 1{,}940\ \text{m/s}^{2}
      $$

      y la normal, lo que queda:
      $a_n = \sqrt{2^{2}-1{,}940^{2}} = 0{,}485\ \text{m/s}^{2}$.

      **El radio de curvatura.**

      $$
      \rho = \frac{|\vec{v}|^{2}}{a_n} = \frac{17}{0{,}485} = 35{,}05\ \text{m}
      $$

      La colección imprime 35,5 m. Comprobado por el otro camino,
      $\rho = |\vec{v}|^{3}/|\vec{v}\times\vec{a}| = 17\sqrt{17}/2 = 35{,}05$ m,
      así que el valor bueno es 35,05 y el impreso parece una errata.

  - id: ejma7-col72-el-radio-de-curvatura-de-una-parabola-en-el-espacio
    titulo: El radio de curvatura de una trayectoria dada por sus tres coordenadas
    fuente: >-
      Ejercicio 7.2 · Tema 7, «Cinemática del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo. La colección imprime
      49,95 m y el cálculo exacto da 50,06 m; la diferencia es de redondeo y
      la casilla admite las dos.
    nivel: practica
    enunciado: |
      Una partícula móvil sigue la trayectoria determinada por los siguientes
      coeficientes en metros: $x = 3t - 1$; $y = 5t^{2} - 8t - 4$;
      $z = 15t - 6t^{2} + 1$. Calcular el radio de curvatura de la trayectoria
      a los 2 segundos de iniciar el movimiento.
    pide: El radio de curvatura de la trayectoria en t = 2 s.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué fórmula del radio de curvatura conviene aquí, con la
          trayectoria dada en coordenadas?
        opciones:
          - texto: La del producto vectorial, $\rho = |\vec{v}|^{3}/|\vec{v}\times\vec{a}|$
            correcta: true
            mensaje: |
              Es la más directa: se derivan las tres coordenadas dos veces y
              se hace un producto vectorial. Equivale a
              $\rho = |\vec{v}|^{2}/a_n$, pero sin tener que separar antes las
              componentes intrínsecas.
          - texto: La de la segunda derivada de $y$ respecto de $x$
            mensaje: |
              Esa vale para una curva plana escrita como $y(x)$. Aquí la
              trayectoria es alabeada —tres coordenadas del tiempo— y hay que
              trabajar con los vectores.
          - texto: El radio de curvatura es la distancia al origen en ese instante
            mensaje: |
              El radio de curvatura no mide dónde está el punto, sino cuánto
              se dobla la trayectoria: es el radio de la circunferencia que
              mejor se le ajusta ahí.

      - tipo: calcular
        titulo: El módulo de la velocidad
        pregunta: |
          ¿Cuánto vale $|\vec{v}|$ en $t = 2\ \text{s}$, en m/s?
        respuesta:
          tipo: numero
          valor: '15.297'
          tolerancia: 0.02
          formato: un número, en m/s
        distractores:
          - valor: '15.62'
            mensaje: |
              Ese es el módulo de la **aceleración**,
              $\vec{a} = 10\vec{j}-12\vec{k}$. La velocidad en $t=2$ es
              $(3,\ 12,\ -9)$.
          - valor: '6'
            mensaje: |
              Has sumado mal o has usado solo una coordenada. Con
              $\vec{v} = 3\vec{i}+12\vec{j}-9\vec{k}$,
              $|\vec{v}| = \sqrt{9+144+81}$.
        pista: |
          $\vec{v} = 3\vec{i} + (10t-8)\vec{j} + (15-12t)\vec{k}$.
        desarrollo: |
          $$
          \vec{v}(2) = 3\vec{i} + 12\vec{j} - 9\vec{k}
          \qquad
          |\vec{v}| = \sqrt{234} = 15{,}297\ \text{m/s}
          $$

      - tipo: calcular
        titulo: El radio de curvatura
        pregunta: |
          ¿Cuánto vale el radio de curvatura en ese instante, en metros?
        respuesta:
          tipo: numero
          valor: '50.06'
          tolerancia: 0.15
          formato: un número, en m
        distractores:
          - valor: '3.27'
            mensaje: |
              Te has dejado un $|\vec{v}|$: la fórmula lleva el módulo de la
              velocidad **al cubo**, no al cuadrado. Con el cubo salen unos
              50 m.
          - valor: '14.98'
            mensaje: |
              Has dividido entre el módulo total de la aceleración en vez de
              entre la componente normal, que es bastante menor
              (4,67 frente a 15,62 m/s²).
        pista: |
          $\vec{v}\times\vec{a} = (-54,\ 36,\ 30)$, de módulo
          $\sqrt{5112} = 71{,}50$.
        desarrollo: |
          $$
          \rho = \frac{|\vec{v}|^{3}}{|\vec{v}\times\vec{a}|}
          = \frac{234\sqrt{234}}{\sqrt{5112}} = 50{,}06\ \text{m}
          $$

          La colección imprime 49,95 m: la misma cuenta redondeando la
          aceleración tangencial por el camino.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Derivando: $\vec{v} = (3,\ 10t-8,\ 15-12t)$ y $\vec{a} = (0,\ 10,\ -12)$.'
          - texto: 'En $t=2$: $\vec{v} = (3,\ 12,\ -9)$ con $|\vec{v}| = \sqrt{234}$, y $\vec{v}\times\vec{a} = (-54,\ 36,\ 30)$.'
          - texto: $\rho = |\vec{v}|^{3}/|\vec{v}\times\vec{a}| = 50{,}06$ m.
          - texto: Como $z$ tiene un término en $t^{2}$ con signo negativo, el radio de curvatura sale negativo.
            trampa: true
            mensaje: |
              El radio de curvatura es una distancia y nunca es negativo: se
              calcula con **módulos**. El signo de un coeficiente cambia hacia
              dónde se dobla la curva, no cuánto.
    resolucion: |
      **Velocidad y aceleración.** Derivando las tres coordenadas,
      $\vec{v} = (3,\ 10t-8,\ 15-12t)$ y $\vec{a} = (0,\ 10,\ -12)$, esta
      última constante.

      **En $t = 2\ \text{s}$.** $\vec{v} = (3,\ 12,\ -9)$, de módulo
      $\sqrt{234} = 15{,}30$ m/s.

      **El radio de curvatura.** Con el producto vectorial,

      $$
      \vec{v}\times\vec{a} = (-54,\ 36,\ 30)
      \qquad
      \rho = \frac{|\vec{v}|^{3}}{|\vec{v}\times\vec{a}|}
      = \frac{234\sqrt{234}}{71{,}50} = 50{,}06\ \text{m}
      $$

      Comprobado por el otro camino: $a_t = (\vec{v}\cdot\vec{a})/|\vec{v}| =
      14{,}90$ m/s², $a_n = \sqrt{244-222{,}15} = 4{,}674$ m/s² y
      $\rho = |\vec{v}|^{2}/a_n = 50{,}06$ m. La colección publica 49,95 m,
      que es el mismo resultado redondeando por el camino.
  - id: ejma7-col73-la-deslizadera-sobre-la-varilla-que-acelera
    titulo: La deslizadera de una varilla con giro acelerado, en polares
    fuente: >-
      Ejercicio 7.3 · Tema 7, «Cinemática del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado
      —60 y 160 m/s, y −640 y 640 m/s²—, que sale de tomar
      $\dot{\theta} = 4$ rad/s; con la ley $\theta = 2\pi t^{2}$ del enunciado
      es $\dot{\theta} = 4\pi$, así que aquí se publican los valores con $\pi$
      y los impresos aparecen como distractores.
    nivel: practica
    enunciado: |
      El movimiento de la varilla se rige a través de la siguiente ley:
      $\theta = 2\pi t^{2}$, con el ángulo en radianes si el tiempo está en
      segundos. Por otro lado, la ecuación del movimiento de la deslizadera
      relativo a la varilla está gobernado por: $r = 60t^{2} - 20t^{3}$, con
      r en metros y t en segundos. Cuando t = 1 s, calcular:

      a) Velocidad de la deslizadera.

      b) Aceleración de la deslizadera.

      c) Aceleración respecto de la deslizadera.

      <figure>
      <svg viewBox="0 0 300 180" role="img" width="300" height="180" aria-labelledby="ma7c3-t ma7c3-d">
        <title id="ma7c3-t">Varilla articulada en O con una deslizadera A a distancia r</title>
        <desc id="ma7c3-d">Una varilla recta articulada en el punto O sobre el suelo forma un ángulo theta con la horizontal. Sobre ella corre una deslizadera A, situada a una distancia r del punto O medida a lo largo de la varilla.</desc>
        <path d="M30 152 H110 M34 152 l-8 8 M50 152 l-8 8 M66 152 l-8 8 M82 152 l-8 8 M98 152 l-8 8" fill="none" stroke="var(--faint)" stroke-width="1"/>
        <line x1="30" y1="152" x2="110" y2="152" stroke="var(--ink)" stroke-width="1.2"/>
        <line x1="60" y1="140" x2="253" y2="29" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
        <circle cx="60" cy="140" r="4" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.4"/>
        <text x="48" y="152" font-size="11" fill="var(--ink)">O</text>
        <line x1="60" y1="140" x2="180" y2="140" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="4 3"/>
        <path d="M96 140 A 36 36 0 0 0 91 121" fill="none" stroke="var(--ink)" stroke-width="1"/>
        <text x="100" y="132" font-size="11" fill="var(--ink)">θ</text>
        <rect x="176" y="63" width="26" height="15" rx="2" fill="var(--faint)" fill-opacity="0.45" stroke="var(--ink)" stroke-width="1.2" transform="rotate(-30 189 70)"/>
        <text x="196" y="86" font-size="11" fill="var(--ink)">A</text>
        <line x1="52" y1="126" x2="181" y2="52" stroke="var(--d1)" stroke-width="1" stroke-dasharray="4 3"/>
        <text x="104" y="82" font-size="11" fill="var(--d1)">r</text>
      </svg>
      </figure>
    pide: La velocidad y la aceleración absolutas de la deslizadera en t = 1 s, y su aceleración relativa a la varilla.
    pasos:
      - tipo: reconocer
        pregunta: |
          En $t = 1\ \text{s}$ la varilla ha dado una vuelta entera
          ($\theta = 2\pi$). ¿Qué dirección tiene entonces la componente
          radial de la velocidad?
        opciones:
          - texto: La del eje x, porque la varilla vuelve a estar en su posición inicial
            correcta: true
            mensaje: |
              Eso es: $\theta = 2\pi$ es una vuelta completa, así que la
              varilla apunta otra vez según $x$ y las componentes polares
              coinciden con las cartesianas.
          - texto: La del eje y, porque el ángulo vale $2\pi$ radianes y eso son 90°
            mensaje: |
              $2\pi$ radianes son 360°, no 90°. Los 90° son $\pi/2$. Cuidado
              con esa conversión, que aquí decide qué eje es cuál.
          - texto: Ninguna fija, porque la varilla gira y no se puede saber
            mensaje: |
              Sí se puede: la ley $\theta(t)$ da el ángulo exacto en cada
              instante. En $t=1$ vale $2\pi$, una vuelta justa.

      - tipo: calcular
        titulo: La velocidad radial
        pregunta: |
          ¿Cuánto vale $\dot{r}$ en $t = 1\ \text{s}$, en m/s?
        respuesta:
          tipo: numero
          valor: '60'
          tolerancia: 0.5
          formato: un número, en m/s
        distractores:
          - valor: '40'
            mensaje: |
              Eso es $r(1) = 60-20$, la **posición**, no su derivada.
              $\dot{r} = 120t - 60t^{2}$.
          - valor: '120'
            mensaje: |
              Te has dejado el término cúbico al derivar:
              $\dot{r} = 120t - 60t^{2}$, y en $t=1$ los dos cuentan.
        pista: |
          Deriva $r = 60t^{2}-20t^{3}$ y evalúa en $t=1$.
        desarrollo: |
          $$
          \dot{r} = 120t - 60t^{2} = 60\ \text{m/s}
          \qquad
          r(1) = 40\ \text{m}
          \qquad
          \ddot{r} = 120 - 120t = 0
          $$

      - tipo: calcular
        titulo: La velocidad transversal
        pregunta: |
          ¿Cuánto vale $r\dot{\theta}$ en $t = 1\ \text{s}$, en m/s?
        respuesta:
          tipo: numero
          valor: '502.65'
          tolerancia: 0.5
          formato: un número, en m/s
        distractores:
          - valor: '160'
            mensaje: |
              Es el valor que imprime la colección, y sale de tomar
              $\dot{\theta} = 4$ rad/s. Con la ley del enunciado,
              $\theta = 2\pi t^{2}$, la derivada es $\dot{\theta} = 4\pi t$, y
              en $t=1$ vale $4\pi = 12{,}57$ rad/s.
          - valor: '251.33'
            mensaje: |
              Te has dejado un factor 2 al derivar: la derivada de
              $2\pi t^{2}$ es $4\pi t$, no $2\pi t$.
        pista: |
          $\dot{\theta} = 4\pi t$, y la componente transversal es
          $r\dot{\theta}$ con $r = 40$ m.
        desarrollo: |
          $$
          \dot{\theta} = 4\pi t = 4\pi\ \text{rad/s}
          \qquad
          r\dot{\theta} = 40 \cdot 4\pi = 160\pi = 502{,}65\ \text{m/s}
          $$

          Como la varilla está según $x$, $v_x = 60$ m/s y
          $v_y = 502{,}65$ m/s.

      - tipo: calcular
        titulo: La aceleración radial
        pregunta: |
          ¿Cuánto vale la componente radial de la aceleración,
          $\ddot{r}-r\dot{\theta}^{2}$, en m/s²?
        respuesta:
          tipo: numero
          valor: '-6316.5'
          tolerancia: 5
          formato: un número, en m/s², con su signo
        distractores:
          - valor: '-640'
            mensaje: |
              Es el valor impreso en la colección, otra vez con
              $\dot{\theta} = 4$ rad/s en lugar de $4\pi$. El cuadrado
              multiplica el error por $\pi^{2}$, casi diez.
          - valor: '0'
            mensaje: |
              Ese es solo $\ddot{r}$, que en $t=1$ se anula. Falta el término
              centrípeto $-r\dot{\theta}^{2}$, que aquí es enorme.
        pista: |
          $\ddot{r} = 0$ en $t=1$, así que queda $-r\dot{\theta}^{2}$ con
          $\dot{\theta} = 4\pi$.
        desarrollo: |
          $$
          a_r = \ddot{r} - r\dot{\theta}^{2} = 0 - 40\,(4\pi)^{2}
          = -640\pi^{2} = -6316{,}5\ \text{m/s}^{2}
          $$

          Y la transversal,
          $a_\theta = r\ddot{\theta} + 2\dot{r}\dot{\theta} = 40\cdot 4\pi +
          2\cdot 60\cdot 4\pi = 640\pi = 2010{,}6\ \text{m/s}^{2}$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'En $t=1$: $r = 40$ m, $\dot{r} = 60$ m/s, $\ddot{r} = 0$, $\dot{\theta} = 4\pi$ rad/s y $\ddot{\theta} = 4\pi$ rad/s².'
          - texto: 'Velocidad: radial $\dot{r} = 60$ m/s y transversal $r\dot{\theta} = 160\pi$ m/s.'
          - texto: 'Aceleración: $a_r = -r\dot{\theta}^{2} = -640\pi^{2}$ y $a_\theta = r\ddot{\theta}+2\dot{r}\dot{\theta} = 640\pi$, en m/s².'
          - texto: La aceleración de la deslizadera respecto de la varilla es $-r\dot{\theta}^{2}$, la centrípeta.
            trampa: true
            mensaje: |
              La centrípeta es de **arrastre**: la nota el punto de la varilla,
              no el observador montado en ella. Para ese observador la
              deslizadera solo recorre una recta, y su aceleración relativa es
              $\ddot{r}$, que en $t=1$ vale 0.
    resolucion: |
      **Coordenadas polares.** La deslizadera se mueve sobre una varilla que
      gira: es el caso de libro del movimiento relativo de un punto.

      $$
      \vec{v} = \dot{r}\,\vec{u}_r + r\dot{\theta}\,\vec{u}_\theta
      \qquad
      \vec{a} = (\ddot{r}-r\dot{\theta}^{2})\,\vec{u}_r
      + (r\ddot{\theta}+2\dot{r}\dot{\theta})\,\vec{u}_\theta
      $$

      **Los datos en $t = 1\ \text{s}$.** De $r = 60t^{2}-20t^{3}$ salen
      $r = 40$ m, $\dot{r} = 60$ m/s y $\ddot{r} = 0$. De
      $\theta = 2\pi t^{2}$ salen $\theta = 2\pi$ —una vuelta entera, la
      varilla está según $x$—, $\dot{\theta} = 4\pi$ rad/s y
      $\ddot{\theta} = 4\pi$ rad/s².

      **Los resultados.**

      $$
      v_x = 60\ \text{m/s}
      \qquad
      v_y = 160\pi = 502{,}7\ \text{m/s}
      $$

      $$
      a_x = -640\pi^{2} = -6316{,}5\ \text{m/s}^{2}
      \qquad
      a_y = 640\pi = 2010{,}6\ \text{m/s}^{2}
      $$

      **La aceleración relativa** —el apartado c— es $\ddot{r} = 0$: para un
      observador montado en la varilla, la deslizadera va en línea recta y en
      ese instante sin acelerar.

      La colección imprime 60, 160, −640 y 640, que es esta misma cuenta con
      $\dot{\theta} = 4$ rad/s en vez de $4\pi$; con la ley del enunciado los
      tres últimos llevan $\pi$.

  - id: ejma7-col74-el-cuadro-de-barras-que-gira-alrededor-de-ad
    titulo: Velocidad y aceleración de B en un cuadro de barras que gira sobre AD
    fuente: >-
      Ejercicio 7.4 · Tema 7, «Cinemática del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Las barras AB, BC y CD unen rígidamente los puntos A y D. El sistema
      gira respecto al eje AD con una velocidad constante ω = 75 rad/s, siendo
      el sentido de rotación desde D hacia A. Determinar la velocidad y
      aceleración de B.

      <figure>
      <svg viewBox="0 0 300 200" role="img" width="300" height="200" aria-labelledby="ma7c4-t ma7c4-d">
        <title id="ma7c4-t">Cuadro de barras AB, BC y CD entre los puntos A y D</title>
        <desc id="ma7c4-d">Triedro con el eje x hacia la derecha, el eje y hacia arriba y el eje z hacia el observador. El punto A está a 120 milímetros de altura y a 90 milímetros sobre el eje z. La barra AB mide 200 milímetros en la dirección x, la barra BC baja 120 milímetros y la barra CD avanza 90 milímetros hasta D, que queda sobre el eje x. La diagonal AD, de 250 milímetros, es el eje de giro.</desc>
        <line x1="120" y1="140" x2="248" y2="140" stroke="var(--ink)" stroke-width="1"/>
        <line x1="120" y1="140" x2="120" y2="38" stroke="var(--ink)" stroke-width="1"/>
        <line x1="120" y1="140" x2="82" y2="168" stroke="var(--ink)" stroke-width="1"/>
        <text x="252" y="144" font-size="10" fill="var(--ink)">x</text>
        <text x="116" y="34" font-size="10" fill="var(--ink)">y</text>
        <text x="74" y="176" font-size="10" fill="var(--ink)">z</text>
        <text x="124" y="152" font-size="10" fill="var(--ink)">O</text>
        <line x1="102" y1="93.5" x2="202" y2="93.5" stroke="var(--ink)" stroke-width="3"/>
        <line x1="202" y1="93.5" x2="202" y2="153.5" stroke="var(--ink)" stroke-width="3"/>
        <line x1="202" y1="153.5" x2="220" y2="140" stroke="var(--ink)" stroke-width="3"/>
        <line x1="102" y1="93.5" x2="220" y2="140" stroke="var(--d1)" stroke-width="1.4" stroke-dasharray="5 3"/>
        <circle cx="102" cy="93.5" r="3.2" fill="var(--ink)"/>
        <circle cx="202" cy="93.5" r="3.2" fill="var(--ink)"/>
        <circle cx="202" cy="153.5" r="3.2" fill="var(--ink)"/>
        <circle cx="220" cy="140" r="3.2" fill="var(--ink)"/>
        <text x="90" y="90" font-size="10" fill="var(--ink)">A</text>
        <text x="204" y="88" font-size="10" fill="var(--ink)">B</text>
        <text x="206" y="166" font-size="10" fill="var(--ink)">C</text>
        <text x="226" y="134" font-size="10" fill="var(--ink)">D</text>
        <text x="132" y="86" font-size="9" text-anchor="middle" fill="var(--faint)">200 mm</text>
        <text x="228" y="122" font-size="9" fill="var(--faint)">120 mm</text>
        <text x="196" y="176" font-size="9" text-anchor="middle" fill="var(--faint)">90 mm</text>
        <text x="152" y="130" font-size="9" fill="var(--d1)">AD = 250 mm</text>
      </svg>
      </figure>
    pide: La velocidad y la aceleración del punto B.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hace falta antes de aplicar el campo de velocidades?
        opciones:
          - texto: Escribir $\vec{\omega}$ como 75 por el vector unitario de D hacia A
            correcta: true
            mensaje: |
              Eso es. La velocidad angular es un vector: módulo 75 rad/s y
              dirección la del eje de giro, con el sentido que dice el
              enunciado.
          - texto: Descomponer 75 rad/s en tres giros de 25 rad/s, uno por eje
            mensaje: |
              El giro es uno solo, alrededor de AD. Repartirlo a partes
              iguales entre los ejes daría otra dirección: hay que proyectar
              con los cosenos directores de AD.
          - texto: Nada, basta con multiplicar 75 por la longitud AB
            mensaje: |
              Eso daría el módulo solo si AB fuera perpendicular al eje, y no
              lo es. Con el producto vectorial sale bien sin tener que
              pensarlo.

      - tipo: calcular
        titulo: La componente y de la velocidad de B
        pregunta: |
          Tomando $A$ como punto del eje, ¿cuánto vale la componente $y$ de
          $\vec{v}_B$, en m/s?
        respuesta:
          tipo: numero
          valor: '5.4'
          tolerancia: 0.02
          formato: un número, en m/s, con su signo
        distractores:
          - valor: '-7.2'
            mensaje: |
              Esa es la componente $z$. Cuidado con el orden de las filas al
              desarrollar el determinante del producto vectorial.
          - valor: '5400'
            mensaje: |
              Has dejado los milímetros sin pasar a metros. AB son 0,2 m, no
              200: el resultado sale mil veces mayor.
        pista: |
          $\overrightarrow{AD} = (200,\ -120,\ -90)$ mm y $|AD| = 250$ mm, así
          que el unitario de D hacia A es $(-0{,}8;\ 0{,}48;\ 0{,}36)$.
        desarrollo: |
          $$
          \vec{\omega} = 75\,(-0{,}8;\ 0{,}48;\ 0{,}36)
          = (-60;\ 36;\ 27)\ \text{rad/s}
          $$

          $$
          \vec{v}_B = \vec{\omega} \times \overrightarrow{AB}
          = (-60;\ 36;\ 27) \times (0{,}2;\ 0;\ 0)
          = 5{,}4\,\vec{j} - 7{,}2\,\vec{k}\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La componente x de la aceleración de B
        pregunta: |
          ¿Cuánto vale la componente $x$ de $\vec{a}_B$, en m/s²?
        respuesta:
          tipo: numero
          valor: '-405'
          tolerancia: 1
          formato: un número, en m/s², con su signo
        distractores:
          - valor: '0'
            mensaje: |
              Que $\vec{\omega}$ sea constante anula la componente tangencial
              $\vec{\alpha}\times\overrightarrow{AB}$, pero no la normal:
              $\vec{\omega}\times\vec{v}_B$ sigue existiendo mientras haya
              giro.
          - valor: '405'
            mensaje: |
              El módulo está bien y el signo no. La aceleración normal apunta
              **hacia** el eje: aquí, hacia las $x$ negativas.
        pista: |
          Con $\vec{\alpha} = \vec{0}$, la aceleración se reduce a
          $\vec{a}_B = \vec{\omega}\times\vec{v}_B$.
        desarrollo: |
          $$
          \vec{a}_B = \vec{\omega}\times\vec{v}_B
          = (-60;\ 36;\ 27)\times(0;\ 5{,}4;\ -7{,}2)
          = -405\,\vec{i} - 432\,\vec{j} - 324\,\vec{k}\ \text{m/s}^{2}
          $$

          De módulo 675 m/s², que es $\omega\,|\vec{v}_B| = 75 \cdot 9$: la
          comprobación rápida de que es una aceleración puramente centrípeta.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'A y D están fijos, así que el sólido gira alrededor del eje AD: $\vec{v}_A = \vec{0}$.'
          - texto: $\vec{\omega} = 75\,\overrightarrow{DA}/|DA| = -60\vec{i}+36\vec{j}+27\vec{k}$ rad/s.
          - texto: $\vec{v}_B = \vec{\omega}\times\overrightarrow{AB} = 5{,}4\vec{j}-7{,}2\vec{k}$ y $\vec{a}_B = \vec{\omega}\times\vec{v}_B$.
          - texto: Como la velocidad angular es constante, la aceleración de B es nula.
            trampa: true
            mensaje: |
              Constante en módulo **y** en dirección, sí: la aceleración
              angular es nula. Pero B describe una circunferencia alrededor
              del eje, y eso pide aceleración centrípeta: 675 m/s².
    resolucion: |
      **El eje de giro.** A y D quedan fijos, así que el conjunto rota
      alrededor de la recta AD. Con
      $\overrightarrow{AD} = (200;\ -120;\ -90)\ \text{mm}$ y
      $|\overrightarrow{AD}| = 250\ \text{mm}$, el unitario en el sentido que
      pide el enunciado —de D hacia A— es $(-0{,}8;\ 0{,}48;\ 0{,}36)$:

      $$
      \vec{\omega} = -60\,\vec{i} + 36\,\vec{j} + 27\,\vec{k}\ \text{rad/s}
      $$

      **La velocidad.** Con $\vec{v}_A = \vec{0}$ y
      $\overrightarrow{AB} = 0{,}2\,\vec{i}$ m:

      $$
      \vec{v}_B = \vec{\omega}\times\overrightarrow{AB}
      = 5{,}4\,\vec{j} - 7{,}2\,\vec{k}\ \text{m/s}
      $$

      de módulo 9 m/s.

      **La aceleración.** El giro es uniforme y el eje no cambia de
      dirección, así que $\vec{\alpha} = \vec{0}$ y solo queda la componente
      normal:

      $$
      \vec{a}_B = \vec{\omega}\times(\vec{\omega}\times\overrightarrow{AB})
      = \vec{\omega}\times\vec{v}_B
      = -405\,\vec{i} - 432\,\vec{j} - 324\,\vec{k}\ \text{m/s}^{2}
      $$

      Su módulo, 675 m/s², coincide con $\omega\,|\vec{v}_B|$, como tiene que
      pasar cuando la aceleración es puramente centrípeta.
  - id: ejma7-col75-el-disco-en-horquilla-con-dos-giros
    titulo: El disco de una horquilla que gira, y su aceleración angular
    fuente: >-
      Ejercicio 7.5 · Tema 7, «Cinemática del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado
      simbólico, contra el que está contrastado el desarrollo. Las casillas
      piden el número con los valores de prueba que se declaran en cada
      pregunta.
    nivel: practica
    enunciado: |
      Un disco de radio r gira a una velocidad angular constante ω₂ en torno a
      un eje horizontal Z. La barra vertical en horquilla unida a él tiene una
      velocidad de rotación constante ω₁, respecto al eje Y. Hallar:

      a) Aceleración angular del disco.

      b) Aceleración del punto P cuando θ = 0º.

      c) Aceleración del punto P cuando θ = 90º.

      <figure>
      <svg viewBox="0 0 300 210" role="img" width="300" height="210" aria-labelledby="ma7c5-t ma7c5-d">
        <title id="ma7c5-t">Disco montado en una horquilla vertical, con dos giros</title>
        <desc id="ma7c5-d">Un disco vertical de radio r gira con velocidad angular omega dos alrededor del eje Z, que sale hacia el observador. El disco está montado en una horquilla unida a una barra vertical que gira con velocidad angular omega uno alrededor del eje Y. El punto P está en el borde del disco, formando un ángulo theta con el eje X.</desc>
