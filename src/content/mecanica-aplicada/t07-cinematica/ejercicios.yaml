      - tipo: calcular
        titulo: La velocidad angular del cono 2
        pregunta: |
          Con el valor de prueba $\omega = 5\ \text{rad/s}$, ¿cuánto vale la
          componente $y$ de $\vec{\omega}_2$, en rad/s?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.05
          formato: un número, en rad/s, con su signo
        distractores:
          - valor: '15'
            mensaje: |
              Ese es $3\omega$, la velocidad angular del cono 1. El giro
              propio del cono 2 sale de imponer que en la generatriz de
              contacto los dos lleven la misma velocidad, y da $\omega$.
          - valor: '-5'
            mensaje: |
              El módulo está bien y el signo no. Habrás impuesto la rodadura
              en la generatriz superior $(0;\ 1;\ 1)$ en vez de en la de
              contacto, $(0;\ 1;\ -1)$: el signo se da la vuelta.
        pista: |
          $\vec{\omega}_2 = 2\omega\vec{k} + \sigma\vec{j}$, y en un punto de
          la generatriz de contacto $(0;\ y;\ -y)$ las velocidades de los dos
          conos han de coincidir.
        desarrollo: |
          $$
          \vec{\omega}_2 = \omega\,\vec{j} + 2\omega\,\vec{k}
          = 5\,\vec{j} + 10\,\vec{k}\ \text{rad/s}
          $$

          con $\omega = 5$ rad/s.

      - tipo: calcular
        titulo: La aceleración del punto A
        pregunta: |
          Con $\omega = 5\ \text{rad/s}$ y $R = 0{,}2\ \text{m}$, ¿cuánto vale
          la componente $z$ de $\vec{a}_A$, en m/s²?
        respuesta:
          tipo: numero
          valor: '-5'
          tolerancia: 0.05
          formato: un número, en m/s², con su signo
        distractores:
          - valor: '5'
            mensaje: |
              El módulo está bien y el signo no. La parte tangencial
              $\vec{\alpha}_2\times\overrightarrow{OA}$ y la normal se
              cancelan en $y$ y dejan $-\omega^{2}R$ en $z$.
          - valor: '-10'
            mensaje: |
              Esa es solo la parte tangencial,
              $\vec{\alpha}_2\times\overrightarrow{OA}$, que en $z$ vale
              $-2\omega^{2}R$. Falta la normal,
              $\vec{\omega}_2\times(\vec{\omega}_2\times\overrightarrow{OA})$,
              que aporta $+\omega^{2}R$; en $y$ las dos se anulan.
        pista: |
          O es punto fijo del cono 2, así que basta con el campo de
          aceleraciones desde él: el término tangencial con
          $\vec{\alpha}_2$ y el normal con $\vec{\omega}_2$ dos veces.
        desarrollo: |
          $$
          \vec{\alpha}_2 = 2\omega\vec{k}\times\omega\vec{j} = -2\omega^{2}\,\vec{i}
          \qquad
          \vec{a}_A = -\omega^{2}R\,\vec{k} = -5\,\vec{k}\ \text{m/s}^{2}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Rodadura en la generatriz $(0;\ 1;\ -1)$: el giro propio sale $\omega$ y $\vec{\omega}_2 = \omega\vec{j}+2\omega\vec{k}$.'
          - texto: '$\vec{\omega}_{rel} = \vec{\omega}_2-\vec{\omega}_1 = \omega\vec{j}-\omega\vec{k}$, que va a lo largo de la generatriz de contacto: todo es rodadura y el pivotamiento es nulo.'
          - texto: $\vec{\alpha}_2 = 2\omega\vec{k}\times\omega\vec{j} = -2\omega^{2}\vec{i}$, y con O fijo, $\vec{a}_A = -\omega^{2}R\vec{k}$.
          - texto: Al restar el movimiento del cono 1 para obtener la aceleración relativa de A basta con restar las dos aceleraciones absolutas.
            trampa: true
            mensaje: |
              No: la aceleración relativa a un sólido que gira lleva además
              los términos de arrastre y de Coriolis. Aquí
              $\vec{a}_{A,rel} = \vec{a}_A - \vec{a}_{arr} - 2\vec{\omega}_1\times\vec{v}_{rel}
              = -\omega^{2}R(3\vec{j}+\vec{k})$.
    resolucion: |
      **1. Esquema de velocidades.** Es un giro compuesto con un contacto a
      lo largo de una recta: el dibujo lleva el corte por el plano YZ, los
      giros, la generatriz de contacto y la velocidad del cono 1 en P, sin
      escala.

