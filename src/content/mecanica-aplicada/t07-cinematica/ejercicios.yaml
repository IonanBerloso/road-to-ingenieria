      <figcaption>

      Solo las direcciones, sin escala. El giro propio del disco, 2ω, va sobre AB, según y, el sentido de la figura; se dibuja más allá del disco. El de la barra, ωb, va sobre el eje vertical; se dibuja hacia arriba y el cálculo dirá su sentido. M, a la altura R, pasa por A, y su velocidad v, vertical, se dibuja a su lado.

      </figcaption>
      </figure>

      - **La barra AB** gira alrededor de OZ, que es fijo, a una velocidad
        $\omega_b$ que aún no se sabe: dibujada según +k.
      - **El disco** gira respecto de la barra a $2\omega$, constante,
        alrededor de AB, según +j, el sentido de la figura.
      - **AB** es parte de la barra: su dirección gira alrededor de OZ.
      - **A**, donde AB corta a OZ, está en los dos ejes: ninguno de los dos
        giros lo mueve. **C**, el contacto con el plano, está debajo de B.
        **M** sube por OZ a $v$ constante y, a la altura R, pasa por A.

      Con O en el suelo, sobre el eje: $A = (0;\ 0;\ R)$,
      $B = (0;\ 2R;\ R)$ y $C = (0;\ 2R;\ 0)$.

      **2. Incógnitas.** $\omega_b$, y con él $\vec{\omega}_D$ y
      $\vec{\alpha}_D$; $\vec{v}_{M/D}$ y $\vec{a}_{M/D}$; y el EIRD.

      **3. Ecuaciones.** Los giros, con $2\omega$ constante y
      $d\vec{j}/dt = \omega_b\,\vec{k}\times\vec{j}$ porque AB gira con la
      barra:

      $$
      \vec{\omega}_D = 2\omega\,\vec{j} + \omega_b\,\vec{k},
      \qquad
      \vec{\alpha}_D = 2\omega\,\frac{d\vec{j}}{dt} = \omega_b\,\vec{k}\times 2\omega\,\vec{j}
      $$

      B gira con la barra alrededor de OZ, y C, desde B por el campo del
      disco, no desliza:

      $$
      \vec{v}_B = \omega_b\,\vec{k}\times\overrightarrow{OB},
      \qquad
      \vec{v}_C = \vec{v}_B + \vec{\omega}_D\times\overrightarrow{BC} = \vec{0}
      $$

      M lleva $\vec{v}_M = v\,\vec{k}$ y $\vec{a}_M = \vec{0}$. Por
      composición con el disco, el arrastre es el del punto del disco que
      pasa por A, desde B por los campos:

      $$
      \vec{v}_M = \vec{v}_{\text{arr}} + \vec{v}_{M/D},
      \qquad
      \vec{a}_M = \vec{a}_{\text{arr}} + \vec{a}_{M/D} + 2\,\vec{\omega}_D\times\vec{v}_{M/D}
      $$

      $$
      \vec{v}_{\text{arr}} = \vec{v}_B + \vec{\omega}_D\times\overrightarrow{BA},
      \qquad
      \vec{a}_{\text{arr}} = \vec{a}_B + \vec{\alpha}_D\times\overrightarrow{BA}
      + \vec{\omega}_D\times\left(\vec{\omega}_D\times\overrightarrow{BA}\right)
      $$

      Y el EIRD, por C, que tiene velocidad nula, con la dirección de
      $\vec{\omega}_D$.

      **4. Resultados.** $\vec{v}_B = -2R\,\omega_b\,\vec{i}$ y
      $\vec{\omega}_D\times\overrightarrow{BC} = -2\omega R\,\vec{i}$, así
      que $\vec{v}_C = -2R\,(\omega_b + \omega)\,\vec{i} = \vec{0}$ y
      $\omega_b = -\omega$:

      $$
      \vec{\omega}_D = 2\omega\,\vec{j} - \omega\,\vec{k},
      \qquad
      |\vec{\omega}_D| = \sqrt{5}\,\omega,
      \qquad
      \vec{\alpha}_D = -\omega\,\vec{k}\times 2\omega\,\vec{j} = 2\omega^{2}\,\vec{i}
      $$

      En A, el disco tiene $\vec{v}_{\text{arr}} = 2\omega R\,\vec{i} - 2\omega R\,\vec{i} = \vec{0}$
      y, con $\vec{a}_B = -2\omega^{2}R\,\vec{j}$,
      $\vec{\alpha}_D\times\overrightarrow{BA} = -4\omega^{2}R\,\vec{k}$ y
      $\vec{\omega}_D\times(\vec{\omega}_D\times\overrightarrow{BA}) = 2\omega^{2}R\,\vec{j} + 4\omega^{2}R\,\vec{k}$,
      $\vec{a}_{\text{arr}} = \vec{0}$. Por tanto:

      $$
      \vec{v}_{M/D} = v\,\vec{k},
      \qquad
      \vec{a}_{M/D} = -2\,\vec{\omega}_D\times v\,\vec{k} = -4\omega v\,\vec{i}
      $$

      La colección imprime $+4\omega v\,\vec{i}$; el signo que dan los datos
      es el negativo, y así lo confirman la comprobación de abajo y una
      derivación numérica de la posición de M en ejes del disco. Con los
      valores de prueba de las casillas, $\omega = 3$ rad/s, $v = 2$ m/s y
      $R = 1$ m: $\vec{\omega}_D = 6\,\vec{j} - 3\,\vec{k}$ rad/s y
      $\vec{a}_{M/D} = -24\,\vec{i}$ m/s².

      El EIRD, por $C = (0;\ 2R;\ 0)$ con la dirección $(0;\ 2;\ -1)$:

      $$
      x = 0,
      \qquad
      y + 2z - 2R = 0
      $$

      **5. Comprobación.** El giro, por geometría y sin el campo de
      velocidades: A y C tienen velocidad nula, A por estar en los dos ejes
      y C por no deslizar, así que el eje de giro del disco es la recta AC, y
      $\vec{\omega}_D$ va según $\overrightarrow{AC} = (0;\ 2R;\ -R)$. Con su
      componente según $\vec{j}$, que es el giro propio $2\omega$, la otra
      sale $-\omega$: $\vec{\omega}_D = 2\omega\,\vec{j} - \omega\,\vec{k}$.

      La aceleración relativa, derivando la velocidad relativa en vez de
      componer aceleraciones. Como A es un punto fijo del disco, en
      cualquier instante
      $\vec{v}_{M/D} = v\,\vec{k} - \vec{\omega}_D\times\overrightarrow{AM}$.
      Su derivada en ejes fijos, cuando M pasa por A
      ($\overrightarrow{AM} = \vec{0}$ y su derivada, $v\,\vec{k}$), es
      $-\vec{\omega}_D\times v\,\vec{k} = -2\omega v\,\vec{i}$; vista desde el
      disco, que gira con $\vec{\omega}_D$, se le resta
      $\vec{\omega}_D\times\vec{v}_{M/D} = 2\omega v\,\vec{i}$:

      $$
      \vec{a}_{M/D} = -2\omega v\,\vec{i} - 2\omega v\,\vec{i} = -4\omega v\,\vec{i}
      $$

      lo mismo.

      **Lo que dice el resultado.** El disco se mueve como un cono de
      vértice A que rueda sobre el plano: su eje de giro, el EIRD, es la
      recta AC, y por eso el punto del disco que coincide con M en A está
      quieto, sin velocidad ni aceleración. Aun así, M tiene aceleración
      relativa: para el observador fijo va en línea recta a velocidad
      constante, pero el que gira con el disco la ve curvarse, y esa
      curvatura, $-4\omega v\,\vec{i}$, es entera de Coriolis.

  - id: ejma7-col715-la-esfera-entre-el-cilindro-el-plano-y-el-cono
    titulo: La esfera que rueda entre un cilindro que gira, un plano y un cono
    fuente: >-
      Ejercicio 7.15 · Tema 7, «Cinemática del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo. Con los ejes de la figura
      —X hacia el observador, Y a la derecha, Z vertical— la velocidad angular
      y la aceleración del centro salen según j, mientras que la colección las
      imprime según i; los módulos coinciden con los nuestros. Las casillas
      piden el número con los valores de prueba que se declaran en cada
      pregunta.
    nivel: practica
    antes:
      idea: |
        Rodar sin deslizar sobre otra superficie es que, en el contacto, los
        dos sólidos tengan la misma velocidad. La velocidad angular de un
        sólido respecto de otro se descompone en cada contacto en dos partes:
        según la normal común, el pivotamiento, y en el plano tangente, la
        rodadura.
      formula: |
        El campo de velocidades, el giro relativo a otro sólido y su
        descomposición con $\vec{n}$ la normal común en el contacto:

        $$
        \vec{v}_P = \vec{v}_Q + \vec{\omega}\times\overrightarrow{QP},
        \qquad
        \vec{\omega}_{rel} = \vec{\omega} - \vec{\omega}_{\text{otro}}
        $$

        $$
        \vec{\omega}_{piv} = \left(\vec{\omega}_{rel}\cdot\vec{n}\right)\vec{n},
        \qquad
        \vec{\omega}_{rod} = \vec{\omega}_{rel} - \vec{\omega}_{piv}
        $$

        Y si la velocidad angular tiene componentes fijas en unos ejes que
        giran a $\vec{\Omega}$, su derivada es
        $\vec{\alpha} = \vec{\Omega}\times\vec{\omega}$.
      reconocer: |
        Antes de calcular se mira qué toca la esfera y cómo se mueve cada
        cosa que toca.
    enunciado: |
      El sistema de la figura consta de un cilindro de revolución de radio
      (1+√3)R/2, una esfera de radio R, un plano horizontal y la superficie
      interior de un cono de semiángulo 30º y eje coincidente con el del
      cilindro. El cilindro gira alrededor de su eje con rotación constante ω,
      el plano y el cono están fijos, y la esfera rueda y pivota sobre ellos.
      Calcular:

      a) Velocidad angular de la esfera.

      b) Eje instantáneo de rotación y deslizamiento de la esfera.

      c) Velocidades angulares de rodadura y pivotamiento de la esfera
      relativas al cilindro, al plano y al cono.

      d) Velocidad y aceleración del centro de la esfera.

      e) Aceleración angular de la esfera.

