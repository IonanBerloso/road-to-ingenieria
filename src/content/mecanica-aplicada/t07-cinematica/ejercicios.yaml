    pide: La velocidad y la aceleración de la esfera A.
    pasos:
      - tipo: reconocer
        pregunta: |
          Los dos ejes de giro se cortan en E. ¿Qué permite eso?
        opciones:
          - texto: Tomar E como punto fijo del brazo HKG y aplicar el campo desde él
            correcta: true
            mensaje: |
              Eso es. Un punto que está en los dos ejes tiene velocidad nula
              para el conjunto, así que
              $\vec{v}_A = \vec{\omega}\times\overrightarrow{EA}$ sin más
              términos.
          - texto: Sumar los dos giros como escalares, 0,2 + 0,4 = 0,6 rad/s
            mensaje: |
              Los ejes son perpendiculares entre sí, no paralelos: los giros
              se suman como **vectores**, y el módulo sale
              $\sqrt{0{,}2^{2}+0{,}4^{2}}$.
          - texto: Ignorar α₂, porque el brazo HKG gira alrededor de un eje fijo
            mensaje: |
              El eje EH no es fijo: gira con el eje vertical. Y aunque lo
              fuera, α₂ es un dato del enunciado y entra en el campo de
              aceleraciones.

      - tipo: calcular
        titulo: La velocidad de la esfera
        pregunta: |
          ¿Cuánto vale la componente $z$ de $\vec{v}_A$, en m/s?
        respuesta:
          tipo: numero
          valor: '-0.18'
          tolerancia: 0.002
          formato: un número, en m/s, con su signo
        distractores:
          - valor: '-0.14'
            mensaje: |
              Solo has contado el giro del eje vertical,
              $\omega_1 \cdot 0{,}7$. Falta el del brazo HKG alrededor de EH,
              que también empuja la esfera en $z$.
          - valor: '-0.04'
            mensaje: |
              Solo has contado el giro del brazo HKG. El eje vertical arrastra
              además toda la esfera: $\omega_1$ por su distancia al eje.
        pista: |
          $\vec{\omega} = 0{,}4\vec{i} + 0{,}2\vec{j}$ y
          $\overrightarrow{EA} = (0{,}7;\ -0{,}1;\ 0)$ m.
        desarrollo: |
          $$
          \vec{v}_A = \vec{\omega}\times\overrightarrow{EA}
          = (0{,}4;\ 0{,}2;\ 0)\times(0{,}7;\ -0{,}1;\ 0)
          = -0{,}18\,\vec{k}\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La aceleración de la esfera
        pregunta: |
          ¿Cuánto vale la componente $x$ de $\vec{a}_A$, en m/s²?
        respuesta:
          tipo: numero
          valor: '-0.044'
          tolerancia: 0.0015
          formato: un número, en m/s², con su signo
        distractores:
          - valor: '-0.008'
            mensaje: |
              Esa es solo la parte tangencial,
              $\vec{\alpha}\times\overrightarrow{EA}$. Falta el término normal
              $\vec{\omega}\times(\vec{\omega}\times\overrightarrow{EA})$, que
              aporta −0,036.
          - valor: '-0.036'
            mensaje: |
              Esa es solo la parte normal. Falta la tangencial, donde entran
              α₁, α₂ y el término $\vec{\omega}_1\times\vec{\omega}_2$.
        pista: |
          $\vec{\alpha} = \alpha_2\vec{i} + \alpha_1\vec{j} +
          \vec{\omega}_1\times\vec{\omega}_2 = (0{,}3;\ 0{,}1;\ -0{,}08)$
          rad/s².
        desarrollo: |
          $$
          \vec{a}_A = \vec{\alpha}\times\overrightarrow{EA}
          + \vec{\omega}\times\vec{v}_A
          = -0{,}044\,\vec{i} + 0{,}016\,\vec{j} - 0{,}1\,\vec{k}\ \text{m/s}^{2}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Los dos ejes se cortan en E, que es punto fijo: $\vec{\omega} = 0{,}4\vec{i}+0{,}2\vec{j}$ rad/s.'
          - texto: $\vec{\alpha} = 0{,}3\vec{i}+0{,}1\vec{j}+\vec{\omega}_1\times\vec{\omega}_2 = (0{,}3;\ 0{,}1;\ -0{,}08)$ rad/s².
          - texto: $\vec{v}_A = \vec{\omega}\times\overrightarrow{EA} = -0{,}18\vec{k}$ m/s y $\vec{a}_A = \vec{\alpha}\times\overrightarrow{EA}+\vec{\omega}\times\vec{v}_A$.
          - texto: La aceleración angular total es la suma de las dos dadas, $0{,}3\vec{i}+0{,}1\vec{j}$, sin más.
            trampa: true
            mensaje: |
              Falta $\vec{\omega}_1\times\vec{\omega}_2 = -0{,}08\vec{k}$: el
              eje vertical arrastra al vector $\vec{\omega}_2$ y le cambia la
              dirección. Sin ese término, la componente $z$ de la aceleración
              de A sale mal.
    resolucion: |
      **El punto fijo.** El eje vertical (Y) y el eje EH (X) se cortan en E,
      así que E es punto fijo del brazo HKG y la esfera cuelga de un sólido
      con punto fijo.

      **Velocidad angular y aceleración angular.**

      $$
      \vec{\omega} = \omega_2\,\vec{i} + \omega_1\,\vec{j} = (0{,}4;\ 0{,}2;\ 0)\ \text{rad/s}
      $$

      $$
      \vec{\alpha} = \alpha_2\,\vec{i} + \alpha_1\,\vec{j}
      + \vec{\omega}_1\times\vec{\omega}_2 = (0{,}3;\ 0{,}1;\ -0{,}08)\ \text{rad/s}^{2}
      $$

      El tercer sumando es el término de Resal: $\vec{\omega}_2$ tiene módulo
      creciente **y** dirección cambiante, porque el eje vertical lo arrastra.

      **La esfera.** Con $\overrightarrow{EA} = (0{,}7;\ -0{,}1;\ 0)$ m:

      $$
      \vec{v}_A = \vec{\omega}\times\overrightarrow{EA} = -0{,}18\,\vec{k}\ \text{m/s}
      $$

      $$
      \vec{a}_A = \vec{\alpha}\times\overrightarrow{EA} + \vec{\omega}\times\vec{v}_A
      = -0{,}044\,\vec{i} + 0{,}016\,\vec{j} - 0{,}1\,\vec{k}\ \text{m/s}^{2}
      $$
  - id: ejma7-col79-la-placa-articulada-en-ab
    titulo: La placa cuadrada articulada en AB, con giro acelerado del eje
    fuente: >-
      Ejercicio 7.9 · Tema 7, «Cinemática del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Una placa cuadrada de 450 mm de lado está articulada en los puntos A y
      B. La placa gira a velocidad angular constante ω₂ = 4 rad/s respecto al
      eje AB y éste tiene una velocidad angular ω₁ = 3 rad/s y una aceleración
      angular α₁ = 2 rad/s² respecto al eje Y. En el instante mostrado,
      calcular:

      a) Aceleración angular de la placa.

      b) Velocidad y aceleración del punto C.

