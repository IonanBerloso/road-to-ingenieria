    pide: Las velocidades y aceleraciones angulares del eje AB y de la barra CD, y la aceleración absoluta de M.
    pasos:
      - tipo: reconocer
        pregunta: |
          En el instante ωt = π/2 la barra CD ha girado 90° desde la vertical,
          así que queda horizontal. ¿Cuánto vale entonces la velocidad de M
          respecto del plano π?
        opciones:
          - texto: Cero, porque la deslizadera avanza $v$ y la masa retrocede $v$ sobre la barra
            correcta: true
            mensaje: |
              Eso es, y es la clave del problema. Con la barra ya horizontal,
              las dos velocidades relativas son opuestas y se cancelan: no hay
              Coriolis con el giro del plano.
          - texto: $2v$, porque las dos velocidades relativas se suman
            mensaje: |
              Se sumarían si M se alejara de C. La flecha de la figura apunta
              de D hacia C: M se acerca a la deslizadera, y con la barra
              horizontal las dos velocidades son opuestas.
          - texto: $v$, la de la masa sobre la barra
            mensaje: |
              Falta el arrastre de la propia deslizadera, que también se mueve
              respecto del plano. Hay que componer los dos movimientos.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el plano de frente en el
          instante pedido, con los dos giros, las dos velocidades relativas y
          el arrastre del plano en C**. Solo las direcciones, sin escala.
        comprueba:
          - punto: |
              **El giro del plano, $\omega$, sobre Z, y el de la barra respecto
              del plano, $\omega$, en C, perpendicular al plano.**
            porque: |
              El plano gira alrededor del eje fijo; la barra se mueve dentro
              de él, y su giro relativo va según la normal al plano, que en ese
              instante es el eje x.
          - punto: |
              **Respecto del plano, C avanza por AB alejándose de A, y M
              recorre la barra hacia C.**
            porque: |
              Son los dos movimientos relativos que da el enunciado, cada uno a
              $v$ constante; en este instante la barra está horizontal.
          - punto: |
              **En C, el arrastre del plano, perpendicular al papel.**
            porque: |
              El punto del plano que coincide con C está a L del eje y gira con
              él: se mueve en horizontal, perpendicular al plano, y con x
              saliendo del papel, entra en él.
