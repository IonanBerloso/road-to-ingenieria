              </marker>
            </defs>
            <path d="M195 90 A75 26 0 1 0 45 90 A75 26 0 1 0 195 90 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <line x1="120" y1="150" x2="120" y2="90" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
            <line x1="120" y1="150" x2="86" y2="170" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
            <line x1="120" y1="150" x2="262" y2="150" stroke="var(--faint)" stroke-width="0.7"/>
            <line x1="120" y1="150" x2="120" y2="14" stroke="var(--faint)" stroke-width="0.7"/>
            <line x1="120" y1="150" x2="44" y2="195" stroke="var(--faint)" stroke-width="0.7"/>
            <line x1="120" y1="150" x2="195" y2="90" stroke="var(--faint)" stroke-width="0.7"/>
