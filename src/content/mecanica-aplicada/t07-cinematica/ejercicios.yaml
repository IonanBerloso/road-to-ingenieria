      <figcaption>

      Solo las direcciones, sin escala, y visto desde arriba. La velocidad relativa es la que se ve desde la varilla: a lo largo de ella. La de arrastre es la del punto de la varilla que coincide con la deslizadera: perpendicular a la varilla, en el sentido del giro. El enunciado no da el sentido del giro; se dibuja antihorario. Ejes: x hacia la derecha, y hacia arriba; giros positivos en sentido antihorario.

      </figcaption>
      </figure>

      - **La varilla** gira alrededor de O en un plano horizontal. El
        enunciado no da el sentido; se dibuja antihorario visto desde arriba.
      - **La velocidad relativa**, la que se ve desde la varilla: a lo largo
        de ella y alejándose de O, $v_{\text{rel}} = 1\ \text{m/s}$, constante.
      - **La de arrastre**, la del punto de la varilla que coincide con P:
        perpendicular a la varilla, en el sentido del giro.

      **2. Incógnitas.** Las tres partes de la aceleración de P —arrastre,
      relativa y Coriolis— y el módulo de la absoluta.

      **3. Ecuaciones.** Ejes con el origen en O: x a lo largo de la varilla
      en ese instante, y perpendicular a ella en el plano del giro y z
      vertical. Entonces $\vec{\omega} = \omega\,\vec{k}$, constante, así que
      $\vec{\alpha} = \vec{0}$; $\vec{r} = r\,\vec{i}$ con
      $r = 0{,}5\ \text{m}$; y $\vec{v}_{\text{rel}} = v_{\text{rel}}\,\vec{i}$.

      $$
      \vec{a}_{\text{arr}} = \vec{\alpha}\times\vec{r} + \vec{\omega}\times\left(\vec{\omega}\times\vec{r}\right),
      \qquad
      \vec{a}_{\text{cor}} = 2\,\vec{\omega}\times\vec{v}_{\text{rel}}
      $$

      Y la relativa es la que se ve desde la varilla: la de un punto que
      recorre una recta con velocidad constante.

      **4. Resultados.**

      $$
      \vec{a}_{\text{arr}} = -\omega^{2} r\,\vec{i} = -2\,\vec{i}\ \text{m/s}^{2},
      \qquad
      \vec{a}_{\text{rel}} = \vec{0},
      \qquad
      \vec{a}_{\text{cor}} = 2\omega v_{\text{rel}}\,\vec{j} = 4\,\vec{j}\ \text{m/s}^{2}
      $$

      **La aceleración de Coriolis vale 4 m/s²**, perpendicular a la varilla y
      en el sentido del giro, y la absoluta es

      $$
      \vec{a} = -2\,\vec{i} + 4\,\vec{j}\ \text{m/s}^{2},
      \qquad
      |\vec{a}| = \sqrt{2^{2} + 4^{2}} = \sqrt{20} = 4{,}472\ \text{m/s}^{2}
      $$

