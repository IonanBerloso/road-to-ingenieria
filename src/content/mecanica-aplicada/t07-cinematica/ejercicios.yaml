        <text x="174" y="58" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">B</text>
        <circle cx="210" cy="105" r="2.4" fill="var(--ink)"/>
        <text x="214" y="120" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">C</text>
        <circle cx="168" cy="105" r="2.4" fill="var(--ink)"/>
        <text x="178" y="99" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">P</text>
        <text x="266" y="108" font-size="9" text-anchor="start" fill="var(--faint)">Y</text>
        <text x="104" y="16" font-size="9" text-anchor="end" fill="var(--faint)">Z</text>
        <text x="104" y="158" font-size="9" text-anchor="end" fill="var(--faint)">O'</text>
      </svg>
      <figcaption>

      Solo las direcciones, sin escala. El giro del disco, ω, y la precesión, 2ω, van los dos sobre el eje vertical; se dibujan uno por debajo del disco y otro por encima. El giro propio, ωs, va sobre el eje del cono; se dibuja hacia fuera del vértice, y el cálculo dirá su sentido. En P, la velocidad del disco entra en el papel: el eje x sale de él.

      </figcaption>
      </figure>

      - **El disco** gira a $\omega$, constante, alrededor de OO', según +k.
      - **B** recorre una circunferencia alrededor de OO' a $2\omega$: el
        plano que contiene al eje del cono gira a $2\omega\,\vec{k}$, la
        precesión.
      - **El cono** gira además alrededor de su eje OB, de dirección
        $\vec{u} = (0;\ \cos 30^\circ;\ \sin 30^\circ)$: el giro propio
        $\omega_s$, dibujado según $+\vec{u}$; el cálculo dirá su sentido.
      - **O** está en el eje del disco y en el del cono: ninguno de los giros
        lo mueve. **P**, en la generatriz de contacto, está en
        $(0;\ y;\ 0)$, y el disco lo lleva a
        $\omega\,\vec{k}\times y\,\vec{j} = -\omega y\,\vec{i}$: hacia dentro
        del papel.

      **2. Incógnitas.** El giro propio $\omega_s$, y con él
      $\vec{\omega}_c$; después, $\vec{\omega}_{rel}$, el pivotamiento y la
      rodadura.

      **3. Ecuaciones.** El giro del cono y la condición de rodadura: en P,
      el cono y el disco tienen la misma velocidad, y los dos la tienen
      nula en O.

      $$
      \vec{\omega}_c = 2\omega\,\vec{k} + \omega_s\,\vec{u},
      \qquad
      \vec{\omega}_c\times\overrightarrow{OP} = \omega\,\vec{k}\times\overrightarrow{OP}
      $$

      Y el movimiento relativo, con $\vec{n} = \vec{k}$, la normal del
      disco:

      $$
      \vec{\omega}_{rel} = \vec{\omega}_c - \omega\,\vec{k},
      \qquad
      \vec{\omega}_{piv} = \left(\vec{\omega}_{rel}\cdot\vec{k}\right)\vec{k},
      \qquad
      \vec{\omega}_{rod} = \vec{\omega}_{rel} - \vec{\omega}_{piv}
      $$

      **4. Resultados.** En P, el cono lleva
      $-\left(2\omega + \tfrac12\,\omega_s\right) y\,\vec{i}$ y el disco
      $-\omega y\,\vec{i}$: igualando, $\omega_s = -2\omega$.

      $$
      \vec{\omega}_c = -\sqrt{3}\,\omega\,\vec{j} + \omega\,\vec{k},
      \qquad
      |\vec{\omega}_c| = 2\omega
      $$

      $$
      \vec{\omega}_{rel} = -\sqrt{3}\,\omega\,\vec{j},
      \qquad
      \vec{\omega}_{piv} = \vec{0},
      \qquad
      \vec{\omega}_{rod} = -\sqrt{3}\,\omega\,\vec{j}
      $$

      Con el valor de prueba $\omega = 2$ rad/s:
      $\vec{\omega}_c = -3{,}464\,\vec{j} + 2\,\vec{k}$ rad/s y
      $\vec{\omega}_{rod} = -3{,}464\,\vec{j}$ rad/s.

      **5. Comprobación.** Desde el disco, sin el giro propio ni la
      igualdad en P. Para un observador que gira con el disco, el disco está
      quieto y el cono rueda sobre él con el vértice O fijo: su eje
      instantáneo es la generatriz de contacto, así que
      $\vec{\omega}_{rel} = \lambda\,\vec{j}$. B gira alrededor de OO' a
      $2\omega - \omega = \omega$ respecto del disco, y está en
      $\overrightarrow{OB} = R\cos 30^\circ\,\vec{u} = R\,(0;\ 0{,}75;\ 0{,}433)$:

      $$
      \lambda\,\vec{j}\times\overrightarrow{OB} = 0{,}433\,\lambda R\,\vec{i}
      = \omega\,\vec{k}\times\overrightarrow{OB} = -0{,}75\,\omega R\,\vec{i}
      $$

      y $\lambda = -\sqrt{3}\,\omega$: la misma rodadura. Sumándole el giro
      del disco vuelve a salir
      $\vec{\omega}_c = -\sqrt{3}\,\omega\,\vec{j} + \omega\,\vec{k}$.

      **Lo que dice el resultado.** El giro propio sale negativo,
      $-2\omega$: el cono gira alrededor de su eje al revés de como se
      dibujó. Su velocidad angular absoluta, de módulo $2\omega$, tiene
      la misma componente vertical que el disco, $\omega$; por eso, al
      restar la del disco, solo queda la parte a lo largo de la generatriz
      de contacto. Respecto del disco, el cono rueda como sobre un plano
      quieto, sin pivotar.

  - id: ejma7-col713-las-dos-barras-en-el-plano-que-gira
    titulo: Dos barras articuladas dentro de un plano vertical que gira
    fuente: >-
      Ejercicio 7.13 · Tema 7, «Cinemática del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo. En el apartado e la
      colección imprime la aceleración de B —que aquí se reproduce y se
      comprueba— cuando el enunciado pide las de A y C; las de A y C son
      nuestras, contrastadas con una derivación numérica del mecanismo. Las
      casillas piden el número con los valores de prueba que se declaran en
      cada pregunta.
    nivel: practica
    antes:
      idea: |
        Cuando un sólido se mueve dentro de otro que también se mueve, su
        movimiento se compone: el del sólido que lo lleva, el arrastre, más el
        que tiene respecto de él. Las velocidades angulares se suman como
        vectores, y con ellas cada barra cumple los campos del sólido rígido.
        En la aceleración de un punto aparece además un término que mezcla el
        giro del arrastre con la velocidad relativa: el de Coriolis.
      formula: |
        La composición de velocidades angulares, con π el sólido que arrastra
        y $\vec{\omega}_{\text{rel}}$ el giro respecto de él, y el campo de
        velocidades del sólido rígido:

        $$
        \vec{\omega} = \vec{\omega}_\pi + \vec{\omega}_{\text{rel}},
        \qquad
        \vec{v}_B = \vec{v}_A + \vec{\omega}\times\overrightarrow{AB}
        $$

        La composición de velocidades y de aceleraciones de un punto P, con O
        un punto fijo del eje de π:

        $$
        \vec{v}_P = \vec{\omega}_\pi\times\overrightarrow{OP} + \vec{v}_{P/\pi},
        \qquad
        \vec{a}_P = \vec{a}_{\text{arr}} + \vec{a}_{P/\pi} + 2\,\vec{\omega}_\pi\times\vec{v}_{P/\pi}
        $$

        Y la aceleración angular es la derivada de la velocidad angular,
        $\vec{\alpha} = d\vec{\omega}/dt$.
      reconocer: |
        Antes de calcular se mira qué sabe cada punto de cómo se mueve.
    enunciado: |
      El plano π vertical gira alrededor del eje vertical z con velocidad
      angular ω constante y sentido de giro dado en la figura. Dos barras 1
      (AB) y 2 (BC) de longitud L√2 permanecen siempre en el plano π. La
      velocidad angular de la barra 1 relativa al plano π es 2ω constante y de
      sentido antihorario (ver figura). La barra 1 está articulada en A, punto
      solidario al plano, y en B a la barra 2. Por su parte, la barra 2 está
      articulada a una deslizadera C que se mueve siempre sobre una guía
      horizontal a la altura de A. En la posición de la figura, determinar:

      a) Velocidad angular de la barra 1.

      b) Velocidades lineales de los puntos A y B.

      c) Velocidad angular de la barra 2, velocidad del punto C para un
      observador situado en el plano π y velocidad lineal (absoluta) del
      punto C.

      d) Aceleraciones angulares de las barras 1 y 2.

      e) Aceleraciones lineales de los puntos A y C.

      <figure>
      <svg viewBox="0 0 300 200" role="img" width="300" height="200" aria-labelledby="ma7c13-t ma7c13-d">
        <title id="ma7c13-t">Las dos barras dentro del plano vertical, vistas de frente</title>
        <desc id="ma7c13-d">El plano vertical pi contiene el eje z y gira alrededor de él. Visto de frente, A está a la derecha sobre la horizontal que pasa por el origen, B queda abajo en el eje vertical y C a la izquierda, sobre la misma horizontal que A, dentro de una guía. Las barras AB y BC, de longitud L raíz de dos, forman 45 grados con la horizontal.</desc>
