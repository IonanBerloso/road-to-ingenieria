      - tipo: calcular
        titulo: La aceleración angular del brazo
        pregunta: |
          ¿Cuánto vale la componente $x$ de $\vec{\alpha}$, en rad/s²?
        respuesta:
          tipo: numero
          valor: '-0.27'
          tolerancia: 0.003
          formato: un número, en rad/s², con su signo
        distractores:
          - valor: '0'
            mensaje: |
              Los dos giros son de módulo constante, pero el eje de ω₂ es
              arrastrado por ω₁: la aceleración angular es
              $\vec{\omega}_1\times\vec{\omega}_2$.
          - valor: '0.27'
            mensaje: |
              El módulo está bien y el signo no. Con
              $\vec{\omega}_2 = -0{,}45\vec{k}$ —el sentido que marca la
              figura—, el producto $\vec{\omega}_1\times\vec{\omega}_2$ sale
              hacia las $x$ negativas.
        pista: |
          $\vec{\omega}_1 = 0{,}6\,\vec{j}$ y
          $\vec{\omega}_2 = -0{,}45\,\vec{k}$.
        desarrollo: |
          $$
          \vec{\alpha} = \vec{\omega}_1\times\vec{\omega}_2
          = 0{,}6\vec{j}\times(-0{,}45\vec{k}) = -0{,}27\,\vec{i}\ \text{rad/s}^{2}
          $$

      - tipo: calcular
        titulo: La velocidad de D
        pregunta: |
          ¿Cuánto vale la componente $z$ de $\vec{v}_D$, en mm/s?
        respuesta:
          tipo: numero
          valor: '-16.8'
          tolerancia: 0.05
          formato: un número, en mm/s, con su signo
        distractores:
          - valor: '-12'
            mensaje: |
              Esa es solo la velocidad de C, $\omega_1 \cdot 20$. Falta lo que
              añade el giro del brazo CD, que en la dirección $z$ aporta otros
              −4,8 mm/s.
          - valor: '-4.8'
            mensaje: |
              Esa es solo la parte del giro del brazo alrededor de C. Falta el
              arrastre: C ya se mueve a 12 mm/s por el giro de la barra
              alrededor de Y.
        pista: |
          $\vec{v}_D = \vec{v}_C + \vec{\omega}\times\overrightarrow{CD}$, con
          $\overrightarrow{CD} = 16(\cos 60^\circ;\ \sin 60^\circ;\ 0)$ mm.
        desarrollo: |
          $$
          \vec{v}_C = \vec{\omega}_1\times\overrightarrow{AC} = -12\,\vec{k}
          \qquad
          \overrightarrow{CD} = (8;\ 13{,}86;\ 0)\ \text{mm}
          $$

          $$
          \vec{v}_D = 6{,}23\,\vec{i} - 3{,}6\,\vec{j} - 16{,}8\,\vec{k}\ \text{mm/s}
          $$

      - tipo: calcular
        titulo: La aceleración de D
        pregunta: |
          ¿Cuánto vale la componente $x$ de $\vec{a}_D$, en mm/s²?
        respuesta:
          tipo: numero
          valor: '-11.7'
          tolerancia: 0.05
          formato: un número, en mm/s², con su signo
        distractores:
          - valor: '-7.2'
            mensaje: |
              Esa es la aceleración de C, $-\omega_1^{2}\cdot 20$. Faltan los
              términos del giro del brazo alrededor de C, que aportan otros
              −4,5 mm/s² en $x$.
          - valor: '-4.5'
            mensaje: |
              Esa es solo la parte del giro del brazo. Falta la centrípeta de
              C alrededor del eje vertical, que vale −7,2 mm/s².
        pista: |
          $\vec{a}_C = -\omega_1^{2}\,(20;\ 0;\ 0)$ y luego el campo de
          aceleraciones desde C, con sus tres sumandos.
        desarrollo: |
          $$
          \vec{a}_D = -11{,}7\,\vec{i} - 2{,}81\,\vec{j} - 7{,}48\,\vec{k}\ \text{mm/s}^{2}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Con β = 120° medido desde CB: $\overrightarrow{CD} = 16(\cos 60^\circ;\ \sin 60^\circ;\ 0)$ mm.'
          - texto: $\vec{\omega} = 0{,}6\vec{j}-0{,}45\vec{k}$ rad/s y $\vec{\alpha} = \vec{\omega}_1\times\vec{\omega}_2 = -0{,}27\vec{i}$ rad/s².
          - texto: 'C gira alrededor de Y a 20 mm del eje: $\vec{v}_C = -12\vec{k}$ mm/s y $\vec{a}_C = -7{,}2\vec{i}$ mm/s².'
          - texto: Como los dos giros son constantes, la aceleración de D es solo la centrípeta de C.
            trampa: true
            mensaje: |
              Aparte de que hay aceleración angular —el término
              $\vec{\omega}_1\times\vec{\omega}_2$—, D gira además alrededor
              de C: su distancia a C, 16 mm, añade −4,5 mm/s² en $x$ y da
              entera la componente $y$ y la $z$, que con la centrípeta de C
              sola serían nulas.
    resolucion: |
      **1. Esquema de velocidades.** Es un giro compuesto: el dibujo lleva
      el conjunto en su posición, los dos giros como vectores y los puntos C
      y D, sin escala para los vectores.

      <figure class="figura-examen">
      <svg viewBox="16 6 246 180" role="img" width="369" height="270" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">Esquema de los dos giros del brazo CD</title>
        <desc id="dsl-d">El conjunto en la perspectiva del enunciado: el sólido AB sube por el eje Y desde A hasta B; de B sale la barra BC según x, y en C se articula el brazo CD, que forma el ángulo beta con CB dentro del plano XY, con D arriba y a la derecha. Sobre el eje Y, por encima de B, la velocidad angular omega uno, hacia arriba. En C, sobre la recta de la articulación, que va según z, la velocidad angular omega dos del brazo respecto de la barra, apuntando según menos z.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <line x1="70" y1="152" x2="70" y2="112" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
        <line x1="70" y1="112" x2="150" y2="112" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
        <line x1="150" y1="112" x2="182" y2="56.6" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
        <line x1="70" y1="152" x2="70" y2="14" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="70" y1="152" x2="250" y2="152" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="70" y1="152" x2="34" y2="174" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="124.4" y1="127.6" x2="150" y2="112" stroke="var(--faint)" stroke-width="0.7"/>
