      <figcaption>

      El EIRD es la recta TP, de dirección (1; 0; −√3), paralela a la generatriz del cono móvil que pasa por M. Respecto del cono móvil, la esfera pivota con ω/2 según la normal en M, hacia dentro del cono, y rueda con 5ω/(2√3) a lo largo de esa generatriz; las dos flechas guardan esa proporción. G se mueve perpendicular al corte, entrando en el papel.

      </figcaption>
      </figure>

      El centro y la aceleración angular, con
      $\overrightarrow{TG} = -r\,\vec{k}$:

      $$
      \vec{v}_G = \frac{\omega R}{12}\,\vec{j},
      \qquad
      \Omega = \frac{\omega}{6},
      \qquad
      \vec{\alpha}_e = \frac{\omega}{6}\,\vec{k}\times\vec{\omega}_e
      = \frac{\sqrt{3}\,\omega^{2}}{36}\,\vec{j}
      $$

      Con el valor de prueba de las casillas, $\omega = 6$ rad/s:
      $\vec{\omega}_e = 1{,}732\,\vec{i} - 3\,\vec{k}$ rad/s, pivotamiento de
      3 rad/s y rodadura de 8,66 rad/s.

      **5. Comprobación.** En unos ejes que giran alrededor de Z con G, a
      una $\Omega$ por determinar, sin pasar por $\vec{v}_G$. En ellos G
      está quieto, la esfera gira a
      $\vec{\omega}' = \vec{\omega}_e - \Omega\,\vec{k} = (a;\ b;\ c)$, el
      plano y la pista giran a $-\Omega$ y el cono móvil a $\omega - \Omega$.
      Sin deslizar, en cada contacto la esfera lleva la velocidad de lo que
      toca, todas según y; con $\overrightarrow{GT} = r\,\vec{k}$,
      $\overrightarrow{GP} = (R/4;\ 0;\ -\sqrt{3}R/12)$ y
      $\overrightarrow{GM} = (-R/4;\ 0;\ -\sqrt{3}R/12)$:

      $$
      \text{T:}\ \ b = 0,\ \ a\,r = \Omega\,\frac{R}{2};
      \qquad
      \text{P:}\ \ \frac{c}{4} + \frac{\sqrt{3}\,a}{12} = -\frac{3\Omega}{4};
      \qquad
      \text{M:}\ \ -\frac{c}{4} + \frac{\sqrt{3}\,a}{12} = \frac{\omega - \Omega}{4}
      $$

      De T, $a = \sqrt{3}\,\Omega$; sumando las otras dos,
      $2\Omega = \omega - 4\Omega$:

      $$
      \Omega = \frac{\omega}{6},
      \qquad
      a = \frac{\sqrt{3}\,\omega}{6},
      \qquad
      c = -4\Omega = -\frac{2\omega}{3}
      $$

      y $\vec{\omega}_e = \vec{\omega}' + \Omega\,\vec{k} = \frac{\sqrt{3}\,\omega}{6}\,\vec{i} - \frac{\omega}{2}\,\vec{k}$:
      la misma, y la misma $\Omega$, que ahora no sale de $v_G/(R/2)$. En
      estos ejes $\vec{\omega}_e$ no cambia, y su derivada es la de
      arrastrarla, $\Omega\,\vec{k}\times\vec{\omega}_e$: la
      $\vec{\alpha}_e$ de arriba.

      **Lo que dice el resultado.** La esfera gira más despacio que el cono,
      a $\omega/\sqrt{3}$, alrededor de la recta TP, que es paralela a la
      generatriz del cono móvil que pasa por M; y su centro da la vuelta al
      eje seis veces más despacio que el cono. Respecto del cono móvil no
      desliza, pero pivota, $\omega/2$ según la normal; la rodadura, casi
      tres veces mayor, va a lo largo de esa generatriz.

  - id: ejma7-col717-el-satelite-con-barra-y-masa-deslizante
    titulo: El satélite con una barra articulada y una masa que desliza por ella
    fuente: >-
      Ejercicio 7.17 · Tema 7, «Cinemática del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo. La colección solo imprime
      la aceleración relativa al satélite; nuestra comprobación muestra que la
      absoluta coincide con ella, y las dos se publican. Las casillas piden el
      número con los valores de prueba que se declaran en cada pregunta.
    nivel: practica
    antes:
      idea: |
        La barra se mueve dentro de un sólido que gira, y la masa, a lo largo
        de la barra: dos composiciones de movimiento encadenadas. Las
        velocidades angulares se suman como vectores y la aceleración angular
        es la derivada de esa suma; para un punto que se mueve sobre un
        sólido, en la aceleración aparece además el término de Coriolis.
      formula: |
        La composición de los giros y de los movimientos de un punto, con
        $\vec{\omega}$ el giro del sólido que arrastra:

        $$
        \vec{\omega} = \vec{\omega}_{\text{arr}} + \vec{\omega}_{\text{rel}},
        \qquad
        \vec{\alpha} = \frac{d\vec{\omega}}{dt}
        $$

        $$
        \vec{v} = \vec{v}_{\text{arr}} + \vec{v}_{\text{rel}},
        \qquad
        \vec{a} = \vec{a}_{\text{arr}} + \vec{a}_{\text{rel}} + 2\,\vec{\omega}\times\vec{v}_{\text{rel}}
        $$

        Y los campos del sólido rígido dan el arrastre:
        $\vec{v}_P = \vec{v}_A + \vec{\omega}\times\overrightarrow{AP}$ y
        $\vec{a}_P = \vec{a}_A + \vec{\alpha}\times\overrightarrow{AP} + \vec{\omega}\times(\vec{\omega}\times\overrightarrow{AP})$.
      reconocer: |
        Antes de calcular se mira cómo se mueve cada parte: el cilindro, la
        barra respecto de él y la masa sobre la barra.
    enunciado: |
      La figura muestra un esquema similar al usado por un satélite de
      comunicaciones. Un cilindro de radio R, gira con velocidad angular
      constante ω alrededor de su eje de revolución. Una barra AB, está
      articulada en la periferia del cilindro (punto A) y se mueve
      relativamente a éste en un plano perpendicular OXZ con velocidad angular
      relativa constante ω. Finalmente, una masa M se desplaza a lo largo de
      AB con velocidad relativa a la barra constante de valor
      $v_M = \omega R\sqrt{2}$. Cuando AB forma 45º con la superficie superior
      del cilindro, la distancia AM es R√2. Calcular en ese instante:

      a) Velocidad angular absoluta de la barra AB.

      b) Velocidad absoluta de la masa M.

      c) Aceleración angular absoluta de la barra AB.

      d) Aceleración absoluta de la masa M.

      e) Aceleración de la masa M relativa al satélite.

