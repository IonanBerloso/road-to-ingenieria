        <circle cx="60" cy="117" r="2.4" fill="var(--ink)"/>
        <text x="52" y="114" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">A</text>
        <circle cx="150" cy="117" r="2.4" fill="var(--ink)"/>
        <text x="146" y="133" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">B</text>
        <circle cx="174" cy="98" r="2.4" fill="var(--ink)"/>
        <text x="180" y="114" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">C</text>
        <circle cx="174" cy="62" r="2.4" fill="var(--ink)"/>
        <text x="166" y="56" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">D</text>
        <text x="236" y="168" font-size="9" text-anchor="start" fill="var(--faint)">X</text>
        <text x="56" y="34" font-size="9" text-anchor="end" fill="var(--faint)">Y</text>
        <text x="22" y="192" font-size="9" text-anchor="end" fill="var(--faint)">Z</text>
      </svg>
      <figcaption>

      Solo las direcciones, sin escala, en la perspectiva del enunciado. La velocidad angular del brazo, ω₁, va sobre Y; la del disco respecto del brazo, ω₂, sobre BC, que va según z: se dibuja según +z, como la toma la colección, y como vector libre, más allá de C, para que no la tape el brazo. BC es parte del brazo y gira con él alrededor de Y.

      </figcaption>
      </figure>

      - **El brazo** gira a $\omega_1 = 3$ rad/s alrededor de Y, que es fijo.
      - **El disco** gira respecto del brazo a $\omega_2 = 4$ rad/s alrededor
        de BC, que va según z. El enunciado no da el sentido; se toma +z, como
        en el resultado de la colección.
      - **BC** es parte del brazo: su dirección gira alrededor de Y.
      - **C**, sobre el eje del disco, solo tiene el movimiento del brazo: una
        circunferencia horizontal alrededor de Y. **D**, el punto más alto, a
        6 m por encima de C.

      **2. Incógnitas.** $\vec{\alpha}$ del disco, $\vec{a}_C$ y
      $\vec{a}_D$.

      **3. Ecuaciones.** Con el brazo en la posición de la figura, en metros:
      $A = (0;\ 8;\ 0)$, $B = (15;\ 8;\ 0)$, $C = (15;\ 8;\ -9)$ y
      $\overrightarrow{CD} = 6\,\vec{j}$. Los giros y la aceleración angular,
      con $d\vec{k}/dt = \vec{\omega}_1\times\vec{k}$ porque el eje del disco
      gira con el brazo:

      $$
      \vec{\omega} = \omega_1\,\vec{j} + \omega_2\,\vec{k},
      \qquad
      \vec{\alpha} = \omega_2\,\frac{d\vec{k}}{dt} = \vec{\omega}_1\times\vec{\omega}_2
      $$

      C es un punto del brazo, que gira uniforme alrededor de Y, con O en el
      eje; y D, desde C, por el campo de aceleraciones del disco:

      $$
      \vec{a}_C = \vec{\omega}_1\times\left(\vec{\omega}_1\times\overrightarrow{OC}\right),
      \qquad
      \vec{a}_D = \vec{a}_C + \vec{\alpha}\times\overrightarrow{CD}
      + \vec{\omega}\times\left(\vec{\omega}\times\overrightarrow{CD}\right)
      $$

      **4. Resultados.**

      $$
      \vec{\omega} = 3\,\vec{j} + 4\,\vec{k}\ \text{rad/s},
      \qquad
      \vec{\alpha} = 3\,\vec{j}\times 4\,\vec{k} = 12\,\vec{i}\ \text{rad/s}^{2}
      $$

      $$
      \vec{a}_C = -\omega_1^{2}\,(15;\ 0;\ -9) = -135\,\vec{i} + 81\,\vec{k}\ \text{m/s}^{2}
      $$

      hacia el eje Y, del que C está a $\sqrt{15^{2}+9^{2}} = 17{,}5$ m. Con
      $\vec{\alpha}\times\overrightarrow{CD} = 72\,\vec{k}$ y
      $\vec{\omega}\times(\vec{\omega}\times\overrightarrow{CD}) = -96\,\vec{j} + 72\,\vec{k}$:

      $$
      \vec{a}_D = -135\,\vec{i} - 96\,\vec{j} + 225\,\vec{k}\ \text{m/s}^{2},
      \qquad
      |\vec{a}_D| = 279{,}4\ \text{m/s}^{2}
      $$

      **5. Comprobación.** Por la composición de movimientos, que no se ha
      usado: el brazo arrastra y el disco gira respecto de él. El punto del
      brazo que coincide con D está a la misma distancia de Y que C:
      arrastre $(-135;\ 0;\ 81)$. Respecto del brazo, D gira alrededor de C a
      $\omega_2$: relativa $-\omega_2^{2}\,\overrightarrow{CD} = -96\,\vec{j}$,
      con $\vec{v}_{\text{rel}} = 4\,\vec{k}\times 6\,\vec{j} = -24\,\vec{i}$.
      Y Coriolis:

      $$
      2\,\vec{\omega}_1\times\vec{v}_{\text{rel}} = 2\cdot 3\,\vec{j}\times\left(-24\,\vec{i}\right) = 144\,\vec{k}
      $$

      La suma, $(-135;\ -96;\ 81 + 144) = (-135;\ -96;\ 225)$ m/s², es la
      misma.

      **Lo que dice el resultado.** La aceleración de D se parece poco a la
      de C: el giro propio del disco le añade su centrípeta, $-96\,\vec{j}$,
      hacia C, y 144 m/s² según z, que en un cálculo sale como
      $\vec{\alpha}\times\overrightarrow{CD}$ más una parte del producto
      doble, y en el otro como Coriolis. Los 72 de
      $\vec{\alpha}\times\overrightarrow{CD}$ son los que se pierden si se da
      por hecho que dos giros constantes no producen aceleración angular.

  - id: ejma7-col78-el-brazo-de-robot-y-la-esfera-a
    titulo: El brazo de robot de dos giros con aceleración angular propia
    fuente: >-
      Ejercicio 7.8 · Tema 7, «Cinemática del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    antes:
      idea: |
        El brazo HKG tiene dos giros: el del eje vertical, que se lleva el
        brazo EH soldado a él, y el suyo propio alrededor de EH. Su velocidad
        angular es la suma vectorial de los dos, su aceleración angular es la
        derivada de esa suma, y los campos de velocidades y de aceleraciones
        dan las de A desde otro punto del mismo sólido.
      formula: |
        La composición de los giros, la aceleración angular y los dos campos,
        con P y A dos puntos del brazo HKG:

        $$
        \vec{\omega} = \vec{\omega}_1 + \vec{\omega}_2,
        \qquad
        \vec{\alpha} = \frac{d\vec{\omega}}{dt}
        $$

        $$
        \vec{v}_A = \vec{v}_P + \vec{\omega}\times\overrightarrow{PA},
        \qquad
        \vec{a}_A = \vec{a}_P + \vec{\alpha}\times\overrightarrow{PA}
        + \vec{\omega}\times\left(\vec{\omega}\times\overrightarrow{PA}\right)
        $$
      reconocer: |
        Antes de calcular se mira cómo se mueve cada parte: el eje vertical,
        el brazo EH y el brazo HKG.
    enunciado: |
      El brazo de robot de la figura mueve la esfera A a través de dos brazos.
      El brazo EH está soldado al eje vertical. El brazo HKG gira alrededor
      del eje EH. Calcular la velocidad y aceleración de A.

      Datos: ω₁ = 0,2 rad/s; α₁ = 0,1 rad/s²; ω₂ = 0,4 rad/s;
      α₂ = 0,3 rad/s².

      <figure>
