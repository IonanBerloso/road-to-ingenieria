              **El giro del cilindro sobre Z, y el de la barra respecto del
              cilindro, en A, perpendicular al plano OXZ.**
            porque: |
              El cilindro gira alrededor de su eje; la barra se mueve dentro
              del plano OXZ, que gira con el cilindro, y su giro relativo va
              según la normal a ese plano, y.
          - punto: |
              **$\vec{v}_A$ perpendicular al papel, saliendo de él.**
            porque: |
              A es un punto del borde del cilindro, a R del eje: solo tiene el
              giro del cilindro, y se mueve según y, que con x hacia la
              izquierda sale del papel.
          - punto: |
              **M sobre el eje, a la altura R, con su velocidad relativa a lo
              largo de la barra, hacia B.**
            porque: |
              M recorre la barra alejándose de A; con AM = R√2 y la barra a
              45°, ha avanzado R hacia el eje y ha subido R.
