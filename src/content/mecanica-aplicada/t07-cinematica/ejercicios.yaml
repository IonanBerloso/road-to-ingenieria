        <text x="106" y="44" font-size="10" fill="var(--ink)">ω₁, α₁</text>
        <path d="M44 88 A 14 14 0 0 1 58 82" fill="none" stroke="var(--ink)" stroke-width="1.1"/>
        <text x="30" y="88" font-size="10" fill="var(--ink)">ω₂</text>
        <text x="120" y="150" font-size="9" fill="var(--faint)">450 mm de lado</text>
        <text x="212" y="140" font-size="9" fill="var(--faint)">225 + 225 mm</text>
      </svg>
      </figure>
    pide: La aceleración angular de la placa y la velocidad y aceleración del punto C.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué dos sumandos tiene aquí la aceleración angular de la placa?
        opciones:
          - texto: La α₁ del eje y el término $\vec{\omega}_1\times\vec{\omega}_2$ del arrastre
            correcta: true
            mensaje: |
              Eso es. ω₂ es constante en módulo pero su eje gira, y eso aporta
              $\vec{\omega}_1\times\vec{\omega}_2$; α₁ es el otro sumando.
          - texto: Solo α₁, porque ω₂ es constante
            mensaje: |
              Constante en módulo, pero no en dirección: el eje AB gira
              arrastrado por el eje vertical. Sin ese término la componente
              $x$ de $\vec{\alpha}$ se pierde entera.
          - texto: Solo $\vec{\omega}_1\times\vec{\omega}_2$, porque α₁ es del eje y no de la placa
            mensaje: |
              La placa está montada sobre el eje: todo lo que acelera el eje
              acelera también a la placa. Los dos sumandos cuentan.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **la placa en su posición, con
          los dos giros como vectores sobre sus ejes, el punto O y el punto
          C**. Solo las direcciones, sin escala.
        comprueba:
          - punto: |
              **$\vec{\omega}_1$ sobre el eje Y y $\vec{\omega}_2$ sobre AB,
              según z.**
            porque: |
              Cada giro va a lo largo de su eje: el eje vertical gira
              alrededor de Y, y la placa, respecto del eje, alrededor de AB,
              que va en la dirección z.
          - punto: |
              **O, donde AB corta al eje Y.**
            porque: |
              O está en los dos ejes y ninguno de los dos giros lo mueve: es
              el punto desde el que se aplican los campos.
          - punto: |
              **C en el centro del lado opuesto a AB, en el plano de la placa,
              que forma 20° con la horizontal.**
            porque: |
              La posición de C respecto de O la fija el instante dibujado, y
              es la que entra en los campos.
        figura: |
          <svg viewBox="14 -2 250 150" role="img" width="250" height="150" aria-labelledby="dsl-t dsl-d">
