    pide: La velocidad y aceleración angular del disco, la velocidad y aceleración de M relativas al disco, y el EIRD.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué fija la velocidad de giro de la barra AB alrededor del eje
          vertical?
        opciones:
          - texto: La condición de rodadura, que anula la velocidad del punto de contacto C
            correcta: true
            mensaje: |
              Eso es. Con el giro propio 2ω dado, imponer $\vec{v}_C = \vec{0}$
              deja una sola incógnita: el giro de la barra, que sale $-\omega$.
          - texto: Nada, la barra puede girar a cualquier velocidad
            mensaje: |
              No: si girase a otra velocidad, el punto de contacto tendría
              velocidad y el disco patinaría. Rodar sin deslizar amarra las
              dos rotaciones.
          - texto: Que la velocidad del centro B sea nula
            mensaje: |
              B recorre una circunferencia de radio 2R alrededor del eje
              vertical, así que no está quieto. El que tiene velocidad nula es
              el contacto.

      - tipo: calcular
        titulo: El giro de la barra
        pregunta: |
          Con el valor de prueba $\omega = 3\ \text{rad/s}$, ¿cuánto vale la
          componente $z$ de $\vec{\omega}_D$, en rad/s?
        respuesta:
          tipo: numero
          valor: '-3'
          tolerancia: 0.02
          formato: un número, en rad/s, con su signo
        distractores:
          - valor: '-6'
            mensaje: |
              Ese es el giro propio, 2ω, que va según el eje de la barra —la
              dirección $y$—, no según la vertical. El de la vertical sale
              $-\omega$ de la condición de rodadura.
          - valor: '3'
            mensaje: |
              El módulo está bien y el signo no. Para que el contacto no
              deslice, el giro alrededor de la vertical tiene que oponerse al
              avance que produce el giro propio.
        pista: |
          $\vec{v}_C = \vec{v}_B + \vec{\omega}_D\times\overrightarrow{BC}
          = \vec{0}$, con $\vec{v}_B$ dada por el giro de la barra.
        desarrollo: |
          $$
          \vec{\omega}_D = 2\omega\,\vec{j} - \omega\,\vec{k}
          \qquad
          \vec{\alpha}_D = 2\omega^{2}\,\vec{i}
          $$

          Con $\omega = 3$: $\vec{\omega}_D = 6\vec{j}-3\vec{k}$ rad/s.

      - tipo: calcular
        titulo: La aceleración de M vista desde el disco
        pregunta: |
          Con $\omega = 3\ \text{rad/s}$, $v = 2\ \text{m/s}$ y
          $R = 1\ \text{m}$, ¿cuánto vale la componente $x$ de la aceleración
          de M **relativa al disco**, en m/s²?
        respuesta:
          tipo: numero
          valor: '-24'
          tolerancia: 0.2
          formato: un número, en m/s², con su signo
        distractores:
          - valor: '24'
            mensaje: |
              Es el valor que imprime la colección, con el signo cambiado. La
              relación es
              $\vec{a}_{rel} = \vec{a}_{abs}-\vec{a}_{arr}-2\vec{\omega}\times
              \vec{v}_{rel}$: la complementaria entra **restando**.
          - valor: '0'
            mensaje: |
              M va en línea recta y a velocidad constante, así que su
              aceleración **absoluta** es nula; pero el observador del disco
              gira, y para él la trayectoria de M se curva. Ahí está la
              aceleración relativa.
        pista: |
          El punto del disco que coincide con M tiene aceleración nula en ese
          instante, así que
          $\vec{a}_{rel} = -2\,\vec{\omega}_D\times\vec{v}_{rel}$ con
          $\vec{v}_{rel} = v\,\vec{k}$.
        desarrollo: |
          $$
          \vec{a}_{M/D} = -2\,\vec{\omega}_D\times v\,\vec{k}
          = -4\omega v\,\vec{i} = -24\,\vec{i}\ \text{m/s}^{2}
          $$

          Con $\omega = 3$ y $v = 2$. La colección imprime $+4\omega v\vec{i}$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Rodadura: $\vec{v}_C = \vec{0}$ da $\vec{\omega}_D = 2\omega\vec{j}-\omega\vec{k}$, y por Resal $\vec{\alpha}_D = 2\omega^{2}\vec{i}$.'
          - texto: 'En la altura R, M coincide con A, que está sobre el EIRD: el punto del disco que pasa por ahí tiene velocidad nula.'
          - texto: 'El EIRD pasa por C con la dirección de $\vec{\omega}_D$: $x = 0$, $y+2z-2R = 0$.'
          - texto: Como el punto del disco que coincide con M tiene velocidad y aceleración nulas, la aceleración de M relativa al disco también es nula.
            trampa: true
            mensaje: |
              Que el arrastre se anule no anula la relativa: queda la
              aceleración complementaria. Como
              $\vec{a}_{abs} = \vec{0}$ y $\vec{a}_{arr} = \vec{0}$, resulta
              $\vec{a}_{rel} = -2\vec{\omega}_D\times\vec{v}_{rel} =
              -4\omega v\,\vec{i}$.
    resolucion: |
      **a) El movimiento del disco.** El disco gira a $2\omega$ alrededor de
      la barra AB —dirección $y$— y la barra gira alrededor de la vertical a
      una velocidad que fija la rodadura. Imponiendo $\vec{v}_C = \vec{0}$ en
      el contacto sale $-\omega$:

      $$
      \vec{\omega}_D = 2\omega\,\vec{j} - \omega\,\vec{k}
      \qquad
      \vec{\alpha}_D = (-\omega\vec{k})\times(2\omega\vec{j}) = 2\omega^{2}\,\vec{i}
      $$

      **b) El punto M.** A la altura R, M coincide con A. El punto del disco
      que pasa por ahí tiene velocidad nula —está sobre el EIRD— y también
      aceleración nula, como se comprueba sumando los tres términos del campo
      de aceleraciones desde B. Por tanto

      $$
      \vec{v}_{M/D} = v\,\vec{k}
      \qquad
      \vec{a}_{M/D} = \vec{a}_M - \vec{a}_{arr} - 2\vec{\omega}_D\times\vec{v}_{rel}
      = -4\omega v\,\vec{i}
      $$

      porque la aceleración absoluta de M es nula. La colección imprime
      $+4\omega v\,\vec{i}$; el signo que dan los datos es el negativo, y así
      lo confirma la derivación numérica de la posición de M en ejes del
      disco.

      **c) El EIRD.** Pasa por el contacto C, donde la velocidad es nula, con
      la dirección de $\vec{\omega}_D$:

      $$
      x = 0
      \qquad
      y + 2z - 2R = 0
      $$

      Es la recta que une el contacto con el punto A del eje vertical: por eso
      el punto del disco que coincide con M tiene velocidad nula.
  - id: ejma7-col715-la-esfera-entre-el-cilindro-el-plano-y-el-cono
    titulo: La esfera que rueda entre un cilindro que gira, un plano y un cono
    fuente: >-
      Ejercicio 7.15 · Tema 7, «Cinemática del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo. Con los ejes de la figura
      —X hacia el observador, Y a la derecha, Z vertical— la velocidad angular
      y la aceleración del centro salen según j, mientras que la colección las
      imprime según i; los módulos coinciden con los nuestros. Las casillas
      piden el número con los valores de prueba que se declaran en cada
      pregunta.
    nivel: practica
    enunciado: |
      El sistema de la figura consta de un cilindro de revolución de radio
      (1+√3)R/2, una esfera de radio R, un plano horizontal y la superficie
      interior de un cono de semiángulo 30º y eje coincidente con el del
      cilindro. El cilindro gira alrededor de su eje con rotación constante ω,
      el plano y el cono están fijos, y la esfera rueda y pivota sobre ellos.
      Calcular:

      a) Velocidad angular de la esfera.

      b) Eje instantáneo de rotación y deslizamiento de la esfera.

      c) Velocidades angulares de rodadura y pivotamiento de la esfera
      relativas al cilindro, al plano y al cono.

      d) Velocidad y aceleración del centro de la esfera.

      e) Aceleración angular de la esfera.

      <figure>
      <svg viewBox="0 0 300 250" role="img" width="300" height="250" aria-labelledby="ma7c15-t ma7c15-d">
        <title id="ma7c15-t">Sección vertical del cilindro, la esfera, el plano y el cono</title>
        <desc id="ma7c15-d">Corte por el plano que contiene el eje vertical Z y el eje Y. El cilindro, de radio uno más raíz de tres partido por dos veces R, gira alrededor del eje vertical. A su izquierda, la esfera de radio R toca el cilindro en C, el plano horizontal fijo en B y la superficie interior del cono fijo, de semiángulo 30 grados, en A. Todo está dibujado a escala.</desc>
