            <line x1="150" y1="22" x2="150" y2="-2" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
            <text x="157" y="4" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">ω<tspan font-size="7.5" dy="2.5">1</tspan><tspan dy="-2.5"></tspan></text>
            <line x1="104" y1="107.4" x2="80" y2="121.6" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
            <text x="84" y="110" font-size="10" text-anchor="end" fill="var(--ink)" font-style="italic">ω<tspan font-size="7.5" dy="2.5">2</tspan><tspan dy="-2.5"></tspan></text>
            <circle cx="150" cy="80" r="2.4" fill="var(--ink)"/>
            <text x="160" y="92" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">O</text>
            <circle cx="150" cy="28" r="2.4" fill="var(--ink)"/>
            <text x="140" y="40" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">P</text>
            <circle cx="202" cy="80" r="2.4" fill="var(--ink)"/>
            <text x="208" y="96" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">P</text>
            <text x="140" y="50" font-size="9" text-anchor="end" fill="var(--faint)">θ = 90°</text>
            <text x="208" y="106" font-size="9" text-anchor="start" fill="var(--faint)">θ = 0</text>
            <text x="244" y="84" font-size="9" text-anchor="start" fill="var(--faint)">X</text>
            <text x="143" y="16" font-size="9" text-anchor="end" fill="var(--faint)">Y</text>
            <text x="66" y="132" font-size="9" text-anchor="end" fill="var(--faint)">Z</text>
          </svg>

      - tipo: calcular
        titulo: La aceleración angular del disco
        pregunta: |
          Con los valores de prueba $\omega_1 = 3\ \text{rad/s}$ y
          $\omega_2 = 4\ \text{rad/s}$, ¿cuánto vale el módulo de
          $\vec{\alpha}$, en rad/s²?
        respuesta:
          tipo: numero
          valor: '12'
          tolerancia: 0.05
          formato: un número, en rad/s²
        distractores:
          - valor: '0'
            mensaje: |
              Los dos módulos son constantes, pero la **dirección** de ω₂ no:
              gira arrastrada por la horquilla. Ahí está la aceleración
              angular, $\vec{\omega}_1\times\vec{\omega}_2$.
          - valor: '7'
            mensaje: |
              Has sumado los módulos. La aceleración angular es un producto
              **vectorial**, y como los dos ejes son perpendiculares su módulo
              es el producto de los módulos.
        pista: |
          $\vec{\alpha} = \vec{\omega}_1 \times \vec{\omega}_2$, con
          $\vec{\omega}_1 = \omega_1\vec{j}$ y
          $\vec{\omega}_2 = \omega_2\vec{k}$.
        desarrollo: |
          $$
          \vec{\alpha} = \omega_1\vec{j} \times \omega_2\vec{k}
          = \omega_1\omega_2\,\vec{i} = 12\,\vec{i}\ \text{rad/s}^{2}
          $$

      - tipo: calcular
        titulo: La aceleración de P con θ = 90°
        pregunta: |
          Con $\omega_1 = 3$, $\omega_2 = 4\ \text{rad/s}$ y
          $r = 0{,}5\ \text{m}$, ¿cuánto vale la componente $z$ de
          $\vec{a}_P$ en $\theta = 90^\circ$, en m/s²?
        respuesta:
          tipo: numero
          valor: '12'
          tolerancia: 0.05
          formato: un número, en m/s², con su signo
        distractores:
          - valor: '6'
            mensaje: |
              Te falta la mitad. Hay dos aportaciones iguales a esa
              componente: la tangencial
              $\vec{\alpha}\times\overrightarrow{OP}$ y una parte del término
              centrípeto. Cada una vale $r\omega_1\omega_2 = 6$.
          - valor: '-8'
            mensaje: |
              Esa es la componente $y$, $-r\omega_2^{2}$: la centrípeta que
              tira de P hacia el centro del disco.
        pista: |
          $\vec{a}_P = \vec{\alpha}\times\overrightarrow{OP} +
          \vec{\omega}\times(\vec{\omega}\times\overrightarrow{OP})$ con
          $\overrightarrow{OP} = r\vec{j}$ y
          $\vec{\omega} = \omega_1\vec{j}+\omega_2\vec{k}$.
        desarrollo: |
          $$
          \vec{a}_P = -r\,\omega_2^{2}\,\vec{j} + 2r\,\omega_1\omega_2\,\vec{k}
          = -8\,\vec{j} + 12\,\vec{k}\ \text{m/s}^{2}
          $$

          Que es la forma impresa en la colección,
          $-r(\omega_2^{2}\vec{j} - 2\omega_1\omega_2\vec{k})$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: $\vec{\omega} = \omega_1\vec{j}+\omega_2\vec{k}$ y $\vec{\alpha} = \vec{\omega}_1\times\vec{\omega}_2 = \omega_1\omega_2\vec{i}$.
          - texto: 'Con $\theta = 0$, $\overrightarrow{OP} = r\vec{i}$: la tangencial se anula y queda $\vec{a}_P = -r(\omega_1^{2}+\omega_2^{2})\vec{i}$.'
          - texto: 'Con $\theta = 90^\circ$, $\overrightarrow{OP} = r\vec{j}$: $\vec{a}_P = -r\omega_2^{2}\vec{j} + 2r\omega_1\omega_2\vec{k}$.'
          - texto: Como el centro del disco está fijo, la aceleración de P es solo la centrípeta hacia ese centro.
            trampa: true
            mensaje: |
              El centro está fijo, sí, pero el sólido tiene aceleración
              angular, y eso añade el término
              $\vec{\alpha}\times\overrightarrow{OP}$. En $\theta = 90^\circ$
              ese término es la mitad de la componente $z$.
    resolucion: |
      **1. Esquema de velocidades.** Es un giro compuesto: el dibujo lleva los
      dos giros como vectores sobre sus ejes y el punto P en las dos
      posiciones que se piden, sin escala.

      <figure class="figura-examen">
      <svg viewBox="54 -10 204 206" role="img" width="306" height="309" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">Esquema de los dos giros del disco de la horquilla</title>
        <desc id="dsl-d">El disco, vertical, en el plano de los ejes X e Y, con su centro O fijo, y la barra de la horquilla bajando desde O. El eje Y, vertical; el eje X, horizontal hacia la derecha; el eje Z, el del disco, en perspectiva hacia abajo a la izquierda, hacia el observador. Sobre Y, por encima del disco, la velocidad angular omega uno de la horquilla. Sobre Z, la velocidad angular omega dos del disco. Junto a la punta de omega dos, una flecha fina curva hacia la derecha: el eje Z, arrastrado por la horquilla, gira alrededor de Y. En el borde del disco, el punto P en sus dos posiciones: sobre X, con theta igual a cero, y arriba, sobre Y, con theta igual a 90 grados.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M145 80 H155 V188 H145 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M202 80 A52 52 0 1 0 98 80 A52 52 0 1 0 202 80 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <line x1="150" y1="80" x2="150" y2="14" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="150" y1="80" x2="240" y2="80" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="150" y1="80" x2="70" y2="127.4" stroke="var(--faint)" stroke-width="0.7"/>
        <path d="M76 130 Q88 137 102 133" fill="none" stroke="var(--ink)" stroke-width="1.3" marker-end="url(#dsl-fe)"/>
        <line x1="150" y1="22" x2="150" y2="-2" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="157" y="4" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">ω<tspan font-size="7.5" dy="2.5">1</tspan><tspan dy="-2.5"></tspan></text>
        <line x1="104" y1="107.4" x2="80" y2="121.6" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="84" y="110" font-size="10" text-anchor="end" fill="var(--ink)" font-style="italic">ω<tspan font-size="7.5" dy="2.5">2</tspan><tspan dy="-2.5"></tspan></text>
        <circle cx="150" cy="80" r="2.4" fill="var(--ink)"/>
        <text x="160" y="92" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">O</text>
        <circle cx="150" cy="28" r="2.4" fill="var(--ink)"/>
        <text x="140" y="40" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">P</text>
        <circle cx="202" cy="80" r="2.4" fill="var(--ink)"/>
        <text x="208" y="96" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">P</text>
        <text x="140" y="50" font-size="9" text-anchor="end" fill="var(--faint)">θ = 90°</text>
        <text x="208" y="106" font-size="9" text-anchor="start" fill="var(--faint)">θ = 0</text>
        <text x="244" y="84" font-size="9" text-anchor="start" fill="var(--faint)">X</text>
        <text x="143" y="16" font-size="9" text-anchor="end" fill="var(--faint)">Y</text>
        <text x="66" y="132" font-size="9" text-anchor="end" fill="var(--faint)">Z</text>
      </svg>
      <figcaption>

      Solo las direcciones, sin escala, en la perspectiva del enunciado. Cada velocidad angular va sobre su eje: la de la horquilla sobre Y, fijo; la del disco sobre Z, que va montado en la horquilla y gira con ella alrededor de Y, como indica la flecha fina. O no se mueve. P, en el borde, en sus dos posiciones.

      </figcaption>
      </figure>

      - **La horquilla** gira a $\omega_1$ alrededor de Y, que es fijo.
      - **El disco** gira respecto de ella a $\omega_2$ alrededor de Z. Ese
        eje va montado en la horquilla y gira con ella alrededor de Y.
      - **O**, sobre los dos ejes, no se mueve. **P**, en el borde, sobre X
        con θ = 0 y sobre Y con θ = 90°.

      **2. Incógnitas.** $\vec{\alpha}$ del disco, y $\vec{a}_P$ con θ = 0 y
      con θ = 90°.

      **3. Ecuaciones.** En el instante del dibujo, con los ejes del
      enunciado:

      $$
      \vec{\omega} = \omega_1\,\vec{j} + \omega_2\,\vec{k},
      \qquad
      \vec{\alpha} = \frac{d\vec{\omega}}{dt},
      \qquad
      \vec{a}_P = \vec{a}_O + \vec{\alpha}\times\overrightarrow{OP}
      + \vec{\omega}\times\left(\vec{\omega}\times\overrightarrow{OP}\right)
      $$

      con $\vec{a}_O = \vec{0}$. Al derivar, $\omega_1\vec{j}$ no cambia: Y es
      fijo y el módulo es constante. $\omega_2$ tampoco cambia, pero
      $\vec{k}$, el eje del disco, gira con la horquilla:
      $d\vec{k}/dt = \vec{\omega}_1\times\vec{k}$. Y
      $\overrightarrow{OP} = r\,\vec{i}$ con θ = 0, y $r\,\vec{j}$ con
      θ = 90°.

      **4. Resultados.** **a)** La aceleración angular:

      $$
      \vec{\alpha} = \omega_2\,\frac{d\vec{k}}{dt} = \vec{\omega}_1\times\vec{\omega}_2 = \omega_1\omega_2\,\vec{i}
      $$

      **b)** Con θ = 0, $\vec{\alpha}\times r\vec{i} = \vec{0}$, porque son
      paralelos, y $\vec{\omega}\times r\vec{i} = r\omega_2\,\vec{j} - r\omega_1\,\vec{k}$:

      $$
      \vec{a}_P = \vec{\omega}\times\left(r\omega_2\,\vec{j} - r\omega_1\,\vec{k}\right) = -r\left(\omega_1^{2} + \omega_2^{2}\right)\vec{i}
      $$

      **c)** Con θ = 90°, $\vec{\alpha}\times r\vec{j} = r\omega_1\omega_2\,\vec{k}$
      y $\vec{\omega}\times r\vec{j} = -r\omega_2\,\vec{i}$:

      $$
      \vec{a}_P = r\omega_1\omega_2\,\vec{k} + \vec{\omega}\times\left(-r\omega_2\,\vec{i}\right) = -r\,\omega_2^{2}\,\vec{j} + 2r\,\omega_1\omega_2\,\vec{k}
      $$

      Con los valores de prueba $\omega_1 = 3$ rad/s, $\omega_2 = 4$ rad/s y
      $r = 0{,}5$ m: $\vec{\alpha} = 12\,\vec{i}$ rad/s²,
      $\vec{a}_P = -12{,}5\,\vec{i}$ m/s² con θ = 0 y
      $\vec{a}_P = -8\,\vec{j} + 12\,\vec{k}$ m/s² con θ = 90°.

      **5. Comprobación.** Por la composición de movimientos, que no se ha
      usado: la horquilla arrastra y el disco gira respecto de ella. Con
      θ = 90°, P está sobre Y: el punto de la horquilla que coincide con él
      está en el eje y no tiene aceleración de arrastre. Respecto de la
      horquilla, P gira en una circunferencia de radio r a $\omega_2$:
      $\vec{a}_{\text{rel}} = -r\omega_2^{2}\,\vec{j}$, con
      $\vec{v}_{\text{rel}} = -r\omega_2\,\vec{i}$. Y Coriolis:

      $$
      \vec{a}_{\text{cor}} = 2\,\omega_1\vec{j}\times\left(-r\omega_2\,\vec{i}\right) = 2r\,\omega_1\omega_2\,\vec{k}
      $$

      La suma, $-r\omega_2^{2}\,\vec{j} + 2r\omega_1\omega_2\,\vec{k}$, es lo
      mismo. Con θ = 0, P está sobre X: arrastre
      $-r\omega_1^{2}\,\vec{i}$, relativa $-r\omega_2^{2}\,\vec{i}$ y
      Coriolis nula, porque $\vec{v}_{\text{rel}} = r\omega_2\,\vec{j}$ es
      paralela a $\vec{\omega}_1$. Sale otra vez
      $-r(\omega_1^{2} + \omega_2^{2})\,\vec{i}$.

      **Lo que dice el resultado.** Los dos giros son constantes y, aun así,
      el disco tiene aceleración angular: la horquilla le hace girar el eje.
      En θ = 90°, la mitad de la componente z sale de ese
      $\vec{\alpha}\times\overrightarrow{OP}$, o, mirado desde la horquilla,
      es la Coriolis de un punto que corre por el disco mientras ella gira.
      En θ = 0, en cambio, P siente los dos giros como dos centrípetas que se
      suman, las dos hacia O.

  - id: ejma7-col76-los-dos-discos-del-eje-que-ruedan
    titulo: Los dos discos de un eje que rueda describiendo un círculo
    fuente: >-
      Ejercicio 7.6 · Tema 7, «Cinemática del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado
      simbólico, contra el que está contrastado el desarrollo. Ojo: el
      enunciado llama R al radio de los discos y el resultado impreso lo llama
      r, reservando R para el semieje; aquí se mantiene la notación del
      resultado y las casillas dan los dos datos por separado.
    nivel: practica
    antes:
      idea: |
        El disco tiene dos giros: el que le da el eje al girar alrededor de la
        vertical y el suyo propio alrededor del eje. Su velocidad angular es la
        suma vectorial de los dos, y su aceleración angular, la derivada de esa
        suma. Con ellas, los campos de velocidades y de aceleraciones dan la de
        cualquier punto del disco.
      formula: |
        Con $\vec{\omega}_p$ el giro propio y A un punto del disco:

        $$
        \vec{\omega} = \vec{\omega}_1 + \vec{\omega}_p,
        \qquad
        \vec{v}_P = \vec{v}_A + \vec{\omega}\times\overrightarrow{AP},
        \qquad
        \vec{a}_P = \vec{a}_A + \vec{\alpha}\times\overrightarrow{AP}
        + \vec{\omega}\times\left(\vec{\omega}\times\overrightarrow{AP}\right)
        $$
      reconocer: |
        Antes de calcular se mira qué ata el giro propio del disco al giro del
        eje.
    enunciado: |
      Dos discos de radio R (A) y (B) están montados sobre un eje AB de
      longitud 2R y ruedan sin deslizar sobre un plano horizontal. Si el eje
      gira con velocidad angular constante ω₁, determinar:

      a) Velocidad angular del disco (A).

      b) Aceleración angular del disco (A).

      c) Aceleración del punto D.

      d) Representar el EIRD indicando el axoide fijo y el axoide móvil.

