          En papel, antes de ninguna cuenta: **el corte por el plano YZ, con
          la esfera, sus tres contactos y la velocidad del cilindro en C**.
          Solo las direcciones, sin escala.
        comprueba:
          - punto: |
              **B debajo de G, C a la altura de G y A en la pared del cono, a
              30° por debajo de la horizontal de G.**
            porque: |
              Cada contacto está sobre la normal común a la esfera y a lo que
              toca; la normal a la pared del cono forma 30° con la horizontal
              porque la pared forma 30° con la vertical.
          - punto: |
              **En C, la velocidad del cilindro, perpendicular al papel,
              saliendo de él.**
            porque: |
              El cilindro gira alrededor de Z: su punto C se mueve en
              horizontal, perpendicular al plano del corte, y con el giro de la
              figura sale del papel.
          - punto: |
              **A y B, sin velocidad.**
            porque: |
              El plano y el cono están quietos, y la esfera no desliza sobre
              ellos.
