        <desc id="ma7c6-d">Un eje horizontal AB de longitud dos R, con su centro C sobre el eje vertical Y, lleva un disco en cada extremo. Los discos, de radio r, ruedan sin deslizar sobre el plano horizontal; el de la izquierda toca el suelo en el punto D y el de la derecha en el punto E. El eje gira con velocidad angular omega uno alrededor de la vertical.</desc>
