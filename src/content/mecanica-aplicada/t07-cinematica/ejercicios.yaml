            <text x="74" y="199" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">ω<tspan font-size="7.5" dy="2.5">1</tspan><tspan dy="-2.5"></tspan></text>
            <line x1="120" y1="60" x2="120" y2="30" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
            <text x="126" y="40" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">ω<tspan font-size="7.5" dy="2.5">2</tspan><tspan dy="-2.5"></tspan></text>
            <circle cx="120" cy="150" r="2.4" fill="var(--ink)"/>
