        <desc id="ma7c18-d">El plano vertical pi gira alrededor del eje OZ formando un ángulo omega por t con el eje X. Dentro del plano, el eje horizontal AB está soldado al eje vertical a la altura L. La deslizadera C recorre AB alejándose de A con velocidad relativa v. De C cuelga la barra CD, que forma el ángulo omega por t con la vertical descendente, y por ella se mueve la masa M con velocidad relativa v dirigida hacia C.</desc>
