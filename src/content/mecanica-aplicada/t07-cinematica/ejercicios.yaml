          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M195 90 A75 26 0 1 0 45 90 A75 26 0 1 0 195 90 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <line x1="120" y1="150" x2="120" y2="90" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
        <line x1="120" y1="150" x2="86" y2="170" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
        <line x1="120" y1="150" x2="262" y2="150" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="120" y1="150" x2="120" y2="14" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="120" y1="150" x2="44" y2="195" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="120" y1="150" x2="195" y2="90" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="80" y1="173.5" x2="58" y2="186.5" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="74" y="199" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">ω<tspan font-size="7.5" dy="2.5">1</tspan><tspan dy="-2.5"></tspan></text>
        <line x1="120" y1="60" x2="120" y2="30" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="126" y="40" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">ω<tspan font-size="7.5" dy="2.5">2</tspan><tspan dy="-2.5"></tspan></text>
        <circle cx="120" cy="150" r="2.4" fill="var(--ink)"/>
        <text x="128" y="164" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">C</text>
        <circle cx="120" cy="90" r="2.4" fill="var(--ink)"/>
        <text x="112" y="86" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">B</text>
        <circle cx="86" cy="170" r="2.4" fill="var(--ink)"/>
        <text x="80" y="164" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">D</text>
        <circle cx="195" cy="90" r="2.4" fill="var(--ink)"/>
        <text x="200" y="86" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">A</text>
        <text x="266" y="153" font-size="9" text-anchor="start" fill="var(--faint)">X</text>
        <text x="116" y="20" font-size="9" text-anchor="end" fill="var(--faint)">Y</text>
        <text x="40" y="196" font-size="9" text-anchor="end" fill="var(--faint)">Z</text>
      </svg>
      <figcaption>

      Solo las direcciones, sin escala para los vectores. La velocidad angular del brazo, ω₁, va sobre Z, por donde va su tramo CD; la del disco respecto del brazo, ω₂, sobre CB, vertical: se dibuja por encima del disco para que no lo tape. Los dos sentidos, +k y +j, son los que toma la colección. CB es parte del brazo y gira con él alrededor de Z; la línea tenue va de C a A.

      </figcaption>
      </figure>

      - **El brazo BCD** gira a $\omega_1 = 5$ rad/s, constante, alrededor de
        Z, que es fijo y por el que va su tramo CD.
      - **El disco** gira respecto del brazo a $\omega_2 = 4$ rad/s,
        constante, alrededor de CB, que es vertical. Los dos sentidos, +k y
        +j, son los que toma la colección.
      - **CB** es parte del brazo: su dirección gira alrededor de Z.
      - **C** está en los dos ejes: ninguno de los dos giros lo mueve, y es
        punto fijo del disco. **A**, en el borde y según x, está en
        $\overrightarrow{CA} = (0{,}15;\ 0{,}12;\ 0)$ m.

      **2. Incógnitas.** $\vec{\alpha}$ del disco, $\vec{v}_A$ y
      $\vec{a}_A$.

      **3. Ecuaciones.** Los giros y la aceleración angular: los dos módulos
      son constantes, y $d\vec{j}/dt = \vec{\omega}_1\times\vec{j}$ porque CB
      gira con el brazo:

      $$
      \vec{\omega} = \omega_2\,\vec{j} + \omega_1\,\vec{k},
      \qquad
      \vec{\alpha} = \omega_2\,\frac{d\vec{j}}{dt} = \vec{\omega}_1\times\vec{\omega}_2
      $$

      Y los dos campos desde C, que está quieto:

      $$
      \vec{v}_A = \vec{\omega}\times\overrightarrow{CA},
      \qquad
      \vec{a}_A = \vec{\alpha}\times\overrightarrow{CA}
      + \vec{\omega}\times\vec{v}_A
      $$

      **4. Resultados.**

      $$
      \vec{\omega} = 4\,\vec{j} + 5\,\vec{k}\ \text{rad/s},
      \qquad
      \vec{\alpha} = 5\,\vec{k}\times 4\,\vec{j} = -20\,\vec{i}\ \text{rad/s}^{2}
      $$

      $$
      \vec{v}_A = (0;\ 4;\ 5)\times(0{,}15;\ 0{,}12;\ 0)
      = -0{,}6\,\vec{i} + 0{,}75\,\vec{j} - 0{,}6\,\vec{k}\ \text{m/s},
      \qquad
      |\vec{v}_A| = 1{,}133\ \text{m/s}
      $$

      Con $\vec{\alpha}\times\overrightarrow{CA} = -2{,}4\,\vec{k}$ y
      $\vec{\omega}\times\vec{v}_A = (-6{,}15;\ -3;\ 2{,}4)$:

      $$
      \vec{a}_A = -6{,}15\,\vec{i} - 3\,\vec{j}\ \text{m/s}^{2},
      \qquad
      |\vec{a}_A| = 6{,}84\ \text{m/s}^{2}
      $$

      **5. Comprobación.** Por la composición de movimientos, que no se ha
      usado: el brazo arrastra y el disco gira respecto de él alrededor de
      CB, que en el brazo es un eje fijo. En velocidades, arrastre
      $\vec{\omega}_1\times\overrightarrow{CA} = (-0{,}6;\ 0{,}75;\ 0)$ y
      relativa $\vec{v}_{\text{rel}} = \vec{\omega}_2\times\overrightarrow{CA} = -0{,}6\,\vec{k}$:
      suman lo de arriba. En aceleraciones, el arrastre es la centrípeta de
      un punto que gira alrededor de Z a 0,15 m en x y 0,12 m en y,
      $-\omega_1^{2}\,(0{,}15;\ 0{,}12;\ 0) = (-3{,}75;\ -3;\ 0)$; la
      relativa, la centrípeta del giro alrededor de CB,
      $-\omega_2^{2}\cdot 0{,}15\,\vec{i} = -2{,}4\,\vec{i}$; y Coriolis:

      $$
      2\,\vec{\omega}_1\times\vec{v}_{\text{rel}} = 2\cdot 5\,\vec{k}\times\left(-0{,}6\,\vec{k}\right) = \vec{0}
      $$

      La suma, $(-6{,}15;\ -3;\ 0)$ m/s², es la misma.

      **Lo que dice el resultado.** En x, las dos centrípetas, la del brazo
      alrededor de Z y la del disco alrededor de CB, apuntan hacia sus ejes
      y se suman: $-(\omega_1^{2}+\omega_2^{2})\cdot 0{,}15 = -6{,}15$. En y
      solo cuenta la del brazo, porque A está 0,12 m por encima de C:
      $-\omega_1^{2}\cdot 0{,}12 = -3$. La componente z, la del acoplamiento
      de los dos giros, se anula: en la resolución, los −2,4 de
      $\vec{\alpha}\times\overrightarrow{CA}$ se cancelan con los +2,4 del
      producto doble, y en la comprobación Coriolis es nulo porque la
      velocidad relativa de A, según z, es paralela a $\vec{\omega}_1$.

  - id: ejma7-col712-el-cono-que-rueda-sobre-el-disco
    titulo: El cono que rueda sin deslizar sobre un disco que gira
    fuente: >-
      Ejercicio 7.12 · Tema 7, «Cinemática del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo. Las casillas piden el
      número con los valores de prueba que se declaran en cada pregunta.
    nivel: practica
    antes:
      idea: |
        El cono tiene dos giros: la precesión de su eje alrededor del eje
        vertical, que es la que lleva su centro B, y el giro propio alrededor
        de ese eje. Su velocidad angular es la suma vectorial de los dos. El
        movimiento relativo al disco se descompone, en el contacto, en una
        parte normal al plano tangente, el pivotamiento, y otra contenida en
        él, la rodadura.
      formula: |
        La composición de los giros, con $\vec{u}$ el unitario del eje del
        cono, y la descomposición del giro relativo con $\vec{n}$ la normal
        al plano tangente:

        $$
        \vec{\omega}_c = \vec{\omega}_{\text{prec}} + \omega_s\,\vec{u},
        \qquad
        \vec{\omega}_{rel} = \vec{\omega}_c - \vec{\omega}_{\text{disco}}
        $$

        $$
        \vec{\omega}_{piv} = \left(\vec{\omega}_{rel}\cdot\vec{n}\right)\vec{n},
        \qquad
        \vec{\omega}_{rod} = \vec{\omega}_{rel} - \vec{\omega}_{piv}
        $$
      reconocer: |
        Antes de calcular se mira cómo se mueve cada sólido: el disco, el
        centro B del cono y el cono alrededor de su eje.
    enunciado: |
      El disco de radio R de la figura gira respecto al eje OO' con velocidad
      angular constante ω, siendo el sentido de giro positivo en el eje Z. A
      su vez el cono de vértice O se mueve sobre dicho disco sin deslizar de
      manera que el punto B, centro de su base, sigue una trayectoria circular
      respecto del eje OO' y con velocidad angular constante 2ω, siendo
      también el sentido de giro positivo en el eje Z. Si el ángulo medio del
      cono es 30º y su generatriz mide R, calcular:

      a) La velocidad angular del cono.

      b) Las componentes de pivotamiento y rodadura del movimiento relativo
      del cono sobre el disco.

      <figure>
      <svg viewBox="0 0 300 190" role="img" width="300" height="190" aria-labelledby="ma7c12-t ma7c12-d">
        <title id="ma7c12-t">Cono apoyado sobre un disco que gira alrededor del eje vertical</title>
        <desc id="ma7c12-d">Un disco horizontal de radio R gira alrededor del eje vertical OO'. Sobre él se apoya un cono de vértice O y ángulo medio de 30 grados, cuya generatriz de contacto descansa sobre el disco a lo largo del eje Y. B es el centro de la base del cono y C, el punto de la base que toca el disco.</desc>
