        <text x="150" y="86" font-size="10" fill="var(--ink)">2</text>
        <text x="104" y="160" font-size="10" fill="var(--ink)">1</text>
        <line x1="180" y1="50" x2="180" y2="110" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="186" y="84" font-size="9" fill="var(--faint)">R</text>
        <line x1="120" y1="124" x2="180" y2="124" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="150" y="136" font-size="9" text-anchor="middle" fill="var(--faint)">R</text>
        <path d="M156 110 A 36 36 0 0 0 145 84" fill="none" stroke="var(--ink)" stroke-width="1"/>
        <text x="150" y="104" font-size="9" fill="var(--ink)">45°</text>
        <path d="M120 146 A 36 36 0 0 0 146 136" fill="none" stroke="var(--ink)" stroke-width="1"/>
        <text x="124" y="158" font-size="9" fill="var(--ink)">45°</text>
        <text x="196" y="176" font-size="9" fill="var(--flag)">generatriz de contacto</text>
      </svg>
      </figure>
    pide: La velocidad y aceleración angulares del cono 2, sus componentes de rodadura y pivotamiento, y la aceleración de A absoluta y relativa al cono 1.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿A lo largo de qué recta se tocan los dos conos?
        opciones:
          - texto: De la generatriz que baja a 45°, la que comparten los dos conos
            correcta: true
            mensaje: |
              Eso es. Los dos tienen el vértice en O y semiángulo 45°, así que
              comparten la generatriz $(0;\ 1;\ -1)$, y el contacto es esa
              recta entera.
          - texto: De la generatriz que pasa por A, $(0;\ 1;\ 1)$
            mensaje: |
              Esa es la generatriz **superior** del cono 2, donde está A. El
              cono 1 abre hacia abajo, así que la común es la de bajada.
          - texto: Solo en el vértice O
            mensaje: |
              En el vértice coinciden, pero el contacto no es puntual: dos
              conos coaxiales de igual semiángulo se tocan a lo largo de toda
              una generatriz.

      - tipo: calcular
        titulo: La velocidad angular del cono 2
        pregunta: |
          Con el valor de prueba $\omega = 5\ \text{rad/s}$, ¿cuánto vale la
          componente $y$ de $\vec{\omega}_2$, en rad/s?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.05
          formato: un número, en rad/s, con su signo
        distractores:
          - valor: '15'
            mensaje: |
              Ese es $3\omega$, la velocidad angular del cono 1. El giro
              propio del cono 2 sale de imponer que en la generatriz de
              contacto los dos lleven la misma velocidad, y da $\omega$.
          - valor: '-5'
            mensaje: |
              El módulo está bien y el signo no. Habrás impuesto la rodadura
              en la generatriz superior $(0;\ 1;\ 1)$ en vez de en la de
              contacto, $(0;\ 1;\ -1)$: el signo se da la vuelta.
        pista: |
          $\vec{\omega}_2 = 2\omega\vec{k} + \sigma\vec{j}$, y en un punto de
          la generatriz de contacto $(0;\ y;\ -y)$ las velocidades de los dos
          conos han de coincidir.
        desarrollo: |
          $$
          \vec{\omega}_2 = \omega\,\vec{j} + 2\omega\,\vec{k}
          = 5\,\vec{j} + 10\,\vec{k}\ \text{rad/s}
          $$

          con $\omega = 5$ rad/s.

      - tipo: calcular
        titulo: La aceleración del punto A
        pregunta: |
          Con $\omega = 5\ \text{rad/s}$ y $R = 0{,}2\ \text{m}$, ¿cuánto vale
          la componente $z$ de $\vec{a}_A$, en m/s²?
        respuesta:
          tipo: numero
          valor: '-5'
          tolerancia: 0.05
          formato: un número, en m/s², con su signo
        distractores:
          - valor: '5'
            mensaje: |
              El módulo está bien y el signo no. La parte tangencial
              $\vec{\alpha}_2\times\overrightarrow{OA}$ y la normal se
              cancelan en $y$ y dejan $-\omega^{2}R$ en $z$.
          - valor: '-10'
            mensaje: |
              Has contado dos veces el mismo término. El resultado neto es
              $-\omega^{2}R\vec{k}$: los dos sumandos aportan $2\omega^{2}R$ y
              $-2\omega^{2}R$ en $y$ y se anulan.
        pista: |
          O es punto fijo del cono 2, así que basta con el campo de
          aceleraciones desde él: el término tangencial con
          $\vec{\alpha}_2$ y el normal con $\vec{\omega}_2$ dos veces.
        desarrollo: |
          $$
          \vec{\alpha}_2 = 2\omega\vec{k}\times\omega\vec{j} = -2\omega^{2}\,\vec{i}
          \qquad
          \vec{a}_A = -\omega^{2}R\,\vec{k} = -5\,\vec{k}\ \text{m/s}^{2}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Rodadura en la generatriz $(0;\ 1;\ -1)$: el giro propio sale $\omega$ y $\vec{\omega}_2 = \omega\vec{j}+2\omega\vec{k}$.'
          - texto: '$\vec{\omega}_{rel} = \vec{\omega}_2-\vec{\omega}_1 = \omega\vec{j}-\omega\vec{k}$, que va a lo largo de la generatriz de contacto: todo es rodadura y el pivotamiento es nulo.'
          - texto: $\vec{\alpha}_2 = 2\omega\vec{k}\times\omega\vec{j} = -2\omega^{2}\vec{i}$, y con O fijo, $\vec{a}_A = -\omega^{2}R\vec{k}$.
          - texto: Al restar el movimiento del cono 1 para obtener la aceleración relativa de A basta con restar las dos aceleraciones absolutas.
            trampa: true
            mensaje: |
              No: la aceleración relativa a un sólido que gira lleva además
              los términos de arrastre y de Coriolis. Aquí
              $\vec{a}_{A,rel} = \vec{a}_A - \vec{a}_{arr} - 2\vec{\omega}_1\times\vec{v}_{rel}
              = -\omega^{2}R(3\vec{j}+\vec{k})$.
    resolucion: |
      **a) La velocidad angular del cono 2.** Tiene la precesión $2\omega$
      alrededor de $Z$ más su giro propio alrededor de $OY$. Imponiendo que en
      la generatriz de contacto —la que baja a 45°, $(0;\ 1;\ -1)$— los dos
      conos lleven la misma velocidad, el giro propio sale $\omega$:

      $$
      \vec{\omega}_2 = \omega\,\vec{j} + 2\omega\,\vec{k}
      $$

      **b) Rodadura y pivotamiento.**

      $$
      \vec{\omega}_{rel} = \vec{\omega}_2 - 3\omega\vec{k} = \omega\,\vec{j} - \omega\,\vec{k}
      $$

      que es paralela a la generatriz de contacto: está contenida en el plano
      tangente, así que **todo es rodadura** y el pivotamiento es nulo. Es lo
      que tiene que pasar en una rodadura de cono sobre cono.

      **c) La aceleración angular.**

      $$
      \vec{\alpha}_2 = 2\omega\vec{k}\times\omega\vec{j} = -2\omega^{2}\,\vec{i}
      $$

      **d) El punto A.** O es punto fijo del cono 2:

      $$
      \vec{a}_A = \vec{\alpha}_2\times\overrightarrow{OA}
      + \vec{\omega}_2\times(\vec{\omega}_2\times\overrightarrow{OA})
      = -\omega^{2}R\,\vec{k}
      $$

      **e) Relativa al cono 1.** Con el cono 1 como sólido de referencia,
      $\vec{v}_{rel} = \vec{v}_A - \vec{v}_1(A) = 2\omega R\,\vec{i}$,
      $\vec{a}_{arr} = -9\omega^{2}R\,\vec{j}$ y
      $\vec{a}_{cor} = 12\omega^{2}R\,\vec{j}$, de donde

      $$
      \vec{a}_{A,rel} = \vec{a}_A - \vec{a}_{arr} - \vec{a}_{cor}
      = -\omega^{2}R\,(3\vec{j} + \vec{k})
      $$
