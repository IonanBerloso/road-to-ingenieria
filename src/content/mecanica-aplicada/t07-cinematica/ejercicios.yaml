        <line x1="205.4" y1="110" x2="170.7" y2="130" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="205.4" y1="110" x2="205.4" y2="150" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="205.4" y1="110" x2="245.4" y2="110" stroke="var(--faint)" stroke-width="0.7"/>
