      </svg>
      <figcaption>

      Solo las direcciones, sin escala. El plano OXZ de frente, con x hacia la izquierda, como en el enunciado, y por tanto y saliendo del papel. El cilindro gira con ω alrededor de Z; la barra, respecto de él, con ω alrededor de la normal al plano, y, antihoraria. A, en el borde del cilindro, se mueve según y, saliendo del papel. M, sobre el eje a la altura R, recorre la barra hacia B.

      </figcaption>
      </figure>

      - **El cilindro** gira a $\omega$, constante, alrededor de Z, según +k.
      - **La barra** gira respecto del cilindro a $\omega$, constante, dentro
        del plano OXZ, que gira con el cilindro: su giro relativo va según la
        normal, +j, antihorario en el dibujo.
      - **A**, en el borde del cilindro, solo tiene el giro del cilindro: su
        velocidad va según +j, saliendo del papel.
      - **M**, con AM = R√2 y la barra a 45°, está sobre el eje, a la altura
        R, y recorre la barra hacia B a $\omega R\sqrt{2}$, constante.

      Con O en el centro de la cara de arriba: $A = (R;\ 0;\ 0)$,
      $M = (0;\ 0;\ R)$, $\overrightarrow{AM} = (-R;\ 0;\ R)$ y
      $\vec{v}_{rel} = \omega R\,(-1;\ 0;\ 1)$.

      **2. Incógnitas.** $\vec{\omega}_{AB}$ y $\vec{\alpha}_{AB}$;
      $\vec{v}_M$ y $\vec{a}_M$; y la aceleración de M respecto del
      satélite.

      **3. Ecuaciones.** Los giros de la barra; la normal $\vec{j}$ gira con
      el cilindro, $d\vec{j}/dt = \omega\,\vec{k}\times\vec{j}$:

      $$
      \vec{\omega}_{AB} = \omega\,\vec{j} + \omega\,\vec{k},
      \qquad
      \vec{\alpha}_{AB} = \omega\,\frac{d\vec{j}}{dt} = \omega\,\vec{k}\times\omega\,\vec{j}
      $$

      M por composición con la barra: el arrastre es el del punto de la
      barra que coincide con M, desde A por los campos; la relativa a la
      barra es nula, porque M va a velocidad constante por una recta.

      $$
      \vec{v}_M = \vec{v}_A + \vec{\omega}_{AB}\times\overrightarrow{AM} + \vec{v}_{rel},
      \qquad
      \vec{v}_A = \omega\,\vec{k}\times\overrightarrow{OA}
      $$

      $$
      \vec{a}_M = \vec{a}_A + \vec{\alpha}_{AB}\times\overrightarrow{AM}
      + \vec{\omega}_{AB}\times\left(\vec{\omega}_{AB}\times\overrightarrow{AM}\right)
      + 2\,\vec{\omega}_{AB}\times\vec{v}_{rel},
      \qquad
      \vec{a}_A = \omega\,\vec{k}\times\vec{v}_A
      $$

      Y respecto del satélite, restando lo que pone el cilindro:

      $$
      \vec{a}_{M/\text{sat}} = \vec{a}_M - \omega\,\vec{k}\times\left(\omega\,\vec{k}\times\overrightarrow{OM}\right)
      - 2\,\omega\,\vec{k}\times\vec{v}_{M/\text{sat}},
      \qquad
      \vec{v}_{M/\text{sat}} = \vec{v}_M - \omega\,\vec{k}\times\overrightarrow{OM}
      $$

      **4. Resultados.**

      $$
      \vec{\omega}_{AB} = \omega\,\vec{j} + \omega\,\vec{k},
      \qquad
      |\vec{\omega}_{AB}| = \sqrt{2}\,\omega,
      \qquad
      \vec{\alpha}_{AB} = -\omega^{2}\,\vec{i}
      $$

      Con $\vec{v}_A = \omega R\,\vec{j}$ y
      $\vec{\omega}_{AB}\times\overrightarrow{AM} = \omega R\,(1;\ -1;\ 1)$, el
      arrastre es $\omega R\,(1;\ 0;\ 1)$, y con la relativa:

      $$
      \vec{v}_M = \omega R\,(1;\ 0;\ 1) + \omega R\,(-1;\ 0;\ 1) = 2\omega R\,\vec{k}
      $$

      Con $\vec{a}_A = -\omega^{2}R\,\vec{i}$,
      $\vec{\alpha}_{AB}\times\overrightarrow{AM} = \omega^{2}R\,\vec{j}$ y
      $\vec{\omega}_{AB}\times(\vec{\omega}_{AB}\times\overrightarrow{AM}) = \omega^{2}R\,(2;\ 1;\ -1)$,
      el arrastre es $\omega^{2}R\,(1;\ 2;\ -1)$; Coriolis,
      $2\omega^{2}R\,(1;\ -1;\ 1)$:

      $$
      \vec{a}_M = 3\omega^{2}R\,\vec{i} + \omega^{2}R\,\vec{k},
      \qquad
      |\vec{a}_M| = \sqrt{10}\,\omega^{2}R
      $$

      M está en el eje: el cilindro no le da arrastre, ni en velocidad ni en
      aceleración, y su velocidad respecto del satélite, $2\omega R\,\vec{k}$,
      es paralela al giro, así que Coriolis también es nulo:
      $\vec{a}_{M/\text{sat}} = 3\omega^{2}R\,\vec{i} + \omega^{2}R\,\vec{k}$,
      la misma, que es el resultado impreso. Con los valores de prueba de las
      casillas, $\omega = 2$ rad/s y $R = 0{,}5$ m:
      $\vec{v}_M = 2\,\vec{k}$ m/s y $\vec{a}_M = (6;\ 0;\ 2)$ m/s².

      **5. Comprobación.** Desde el satélite y en polares alrededor de A,
      sin la barra como sólido de arrastre. Para el satélite, A está quieta,
      la barra gira a $\dot\theta = \omega$ constante y M está a
      $s = R\sqrt{2}$, con $\dot s = \omega R\sqrt{2}$ y $\ddot s = 0$. Con
      $\vec{e}_r = (-1;\ 0;\ 1)/\sqrt{2}$, de A hacia M, y
      $\vec{e}_\theta = \vec{j}\times\vec{e}_r = (1;\ 0;\ 1)/\sqrt{2}$:

      $$
      a_r = \ddot s - s\,\dot\theta^{2} = -\sqrt{2}\,\omega^{2}R,
      \qquad
      a_\theta = 2\,\dot s\,\dot\theta + s\,\ddot\theta = 2\sqrt{2}\,\omega^{2}R
      $$

      $$
      \vec{a}_{M/\text{sat}} = -\omega^{2}R\,(-1;\ 0;\ 1) + 2\omega^{2}R\,(1;\ 0;\ 1)
      = 3\omega^{2}R\,\vec{i} + \omega^{2}R\,\vec{k}
      $$

      La misma, y con ella la absoluta, que coincide. En velocidades,
      $\dot s\,\vec{e}_r + s\dot\theta\,\vec{e}_\theta = \omega R\,(-1;\ 0;\ 1) + \omega R\,(1;\ 0;\ 1) = 2\omega R\,\vec{k}$:
      también la misma.

      **Lo que dice el resultado.** M sube en vertical, a $2\omega R$, justo
      por el eje del satélite, y por eso el giro del cilindro no cambia nada
      en ese instante: su aceleración absoluta y la relativa al satélite son
      iguales. Y no es nula aunque las tres velocidades sean constantes: es
      la centrípeta de girar alrededor de A, $\sqrt{2}\,\omega^{2}R$ hacia A,
      más el Coriolis de alejarse por una barra que gira,
      $2\sqrt{2}\,\omega^{2}R$; juntas, $\sqrt{10}\,\omega^{2}R$.

  - id: ejma7-col718-el-plano-que-gira-con-eje-barra-y-masa
    titulo: El plano giratorio con el eje AB, la barra CD y una masa que desliza
    fuente: >-
      Ejercicio 7.18 · Tema 7, «Cinemática del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo, incluida una derivación
      numérica de la posición de M. Las casillas piden el número con los
      valores de prueba que se declaran en cada pregunta.
    nivel: practica
    antes:
      idea: |
        Todo el sistema está dentro de un plano que gira, y lo que pasa en el
        plano se compone con su giro. La barra CD tiene dos giros, el del
        plano y el suyo propio dentro de él. La masa tiene dos movimientos
        relativos encadenados, el de la deslizadera sobre AB y el suyo sobre
        la barra; en su aceleración aparece el término de Coriolis con el
        giro del plano.
      formula: |
        La composición de los giros y de los movimientos de un punto, con
        $\vec{\omega}_\pi$ el giro del plano:

        $$
        \vec{\omega} = \vec{\omega}_\pi + \vec{\omega}_{\text{rel}},
        \qquad
        \vec{\alpha} = \frac{d\vec{\omega}}{dt},
        \qquad
        \vec{a} = \vec{a}_{\text{arr}} + \vec{a}_{\text{rel}} + 2\,\vec{\omega}_\pi\times\vec{v}_{\text{rel}}
        $$

        Y, dentro del plano, la aceleración de un punto en polares alrededor
        de otro, con $r$ la distancia y $\theta$ el ángulo:

        $$
        a_r = \ddot r - r\,\dot\theta^{2},
        \qquad
        a_\theta = 2\,\dot r\,\dot\theta + r\,\ddot\theta
        $$
      reconocer: |
        Antes de calcular se mira cómo se mueve cada parte respecto del plano:
        la deslizadera C sobre AB, la barra alrededor de C y la masa sobre la
        barra.
    enunciado: |
      Un plano π gira alrededor del eje fijo OZ con velocidad angular
      constante ω. En ese plano, se encuentra definido el sistema siguiente:

      - Un eje horizontal AB soldado al eje vertical a una altura L.

      - Una barra CD cuyo extremo C desliza con velocidad relativa constante v
      (respecto de AB). La barra gira al mismo tiempo alrededor de C con
      velocidad angular ω.

      - Una masa puntual M que desliza a lo largo de CD con velocidad relativa
      constante v.

      En el instante ωt = π/2, la masa M se sitúa en el extremo C de la barra
      y la distancia AC = L. Para ese instante, calcular:

      a) Velocidad angular absoluta del eje AB.

      b) Aceleración angular absoluta de la barra AB.

      c) Velocidad angular absoluta de la barra CD.

      d) Aceleración angular absoluta de la barra CD.

      e) Aceleración absoluta de la masa puntual M.

