      - tipo: calcular
        titulo: El giro propio del cono
        pregunta: |
          Con el valor de prueba $\omega = 2\ \text{rad/s}$, ¿cuánto vale la
          componente $y$ de $\vec{\omega}_c$, en rad/s?
        respuesta:
          tipo: numero
          valor: '-3.464'
          tolerancia: 0.01
          formato: un número, en rad/s, con su signo
        distractores:
          - valor: '-2'
            mensaje: |
              Has proyectado el giro propio con el seno:
              $-2\omega\sin 30^\circ = -\omega$ es su componente $z$. La $y$ es
              $-2\omega\cos 30^\circ = -\sqrt{3}\,\omega$: el eje del cono forma
              30° con la generatriz de contacto, que va según y.
          - valor: '3.464'
            mensaje: |
              El módulo está bien y el signo no. El giro propio va en el
              sentido de las $y$ negativas: es lo que hace que el punto de
              contacto tenga la misma velocidad que el disco.
        pista: |
          Escribe $\vec{\omega}_c = 2\omega\vec{k} + \omega_s\,\vec{u}$ con
          $\vec{u} = (0;\ \cos 30^\circ;\ \sin 30^\circ)$ y obliga a que la
          velocidad en la generatriz coincida con la del disco.
        desarrollo: |
          $$
          \vec{\omega}_c = -\sqrt{3}\,\omega\,\vec{j} + \omega\,\vec{k}
          = -3{,}464\,\vec{j} + 2\,\vec{k}\ \text{rad/s}
          $$

          El giro propio sale $\omega_s = -2\omega$, y sus proyecciones son
          $-2\omega\cos 30^\circ = -\sqrt{3}\omega$ en $y$ y
          $-2\omega\sin 30^\circ = -\omega$ en $z$, que con el $2\omega$ de la
          precesión deja $\omega$.

      - tipo: calcular
        titulo: El pivotamiento
        pregunta: |
          Con $\omega = 2\ \text{rad/s}$, ¿cuánto vale la componente de
          pivotamiento del movimiento relativo del cono sobre el disco, en
          rad/s?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.02
          formato: un número, en rad/s
        distractores:
          - valor: '2'
            mensaje: |
              Esa es la componente $z$ de la velocidad angular **absoluta** del
              cono. El pivotamiento se calcula con la velocidad angular
              **relativa** al disco, y al restar $\omega\vec{k}$ la componente
              normal desaparece.
          - valor: '3.464'
            mensaje: |
              Ese es el módulo de la rodadura, que va en el plano de contacto.
              El pivotamiento es la componente perpendicular a ese plano, y
              aquí es nula.
        pista: |
          $\vec{\omega}_{rel} = \vec{\omega}_c - \omega\vec{k}$, y el plano
          tangente en el contacto es el propio disco, de normal $\vec{k}$.
        desarrollo: |
          $$
          \vec{\omega}_{rel} = -\sqrt{3}\,\omega\,\vec{j}
          \qquad
          \vec{\omega}_{piv} = \vec{0}
          \qquad
          \vec{\omega}_{rod} = -\sqrt{3}\,\omega\,\vec{j}
          $$

          Todo el movimiento relativo es de rodadura, que es lo que tiene que
          pasar cuando un cono rueda sobre un plano sin deslizar: su velocidad
          angular relativa va **a lo largo** de la generatriz de contacto.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'El eje del cono forma 30° con la generatriz apoyada: $\vec{u} = (0;\ \cos 30^\circ;\ \sin 30^\circ)$.'
          - texto: $\vec{\omega}_c = 2\omega\vec{k}+\omega_s\vec{u}$, y la igualdad de velocidades en la generatriz da $\omega_s = -2\omega$.
          - texto: $\vec{\omega}_c = -\sqrt{3}\omega\vec{j}+\omega\vec{k}$ y $\vec{\omega}_{rel} = \vec{\omega}_c-\omega\vec{k} = -\sqrt{3}\omega\vec{j}$.
          - texto: Como el cono rueda sin deslizar, su velocidad angular absoluta va a lo largo de la generatriz de contacto.
            trampa: true
            mensaje: |
              Lo que va a lo largo de la generatriz es la velocidad angular
              **relativa** al disco. La absoluta,
              $-\sqrt{3}\omega\vec{j}+\omega\vec{k}$, tiene componente
              vertical, porque el disco de debajo también gira.
    resolucion: |
      **1. Esquema de velocidades.** Es un giro compuesto: el dibujo lleva
      el disco y el cono cortados por el plano YZ, los giros como vectores y
      la velocidad del disco en un punto P del contacto, sin escala.

      <figure class="figura-examen">
      <svg viewBox="4 6 272 178" role="img" width="408" height="267" aria-labelledby="dsl-t dsl-d">
