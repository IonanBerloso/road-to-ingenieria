        <text x="197" y="98" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">B</text>
        <circle cx="190" cy="150" r="2.4" fill="var(--ink)"/>
        <text x="198" y="163" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">C</text>
        <text x="96" y="18" font-size="9" text-anchor="end" fill="var(--faint)">Z</text>
        <text x="266" y="153" font-size="9" text-anchor="start" fill="var(--faint)">Y</text>
