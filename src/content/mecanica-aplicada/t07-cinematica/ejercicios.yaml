    pide: La velocidad y aceleración angular del disco, la velocidad y aceleración de M relativas al disco, y el EIRD.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué fija la velocidad de giro de la barra AB alrededor del eje
          vertical?
        opciones:
          - texto: La condición de rodadura, que anula la velocidad del punto de contacto C
            correcta: true
            mensaje: |
              Eso es. Con el giro propio 2ω dado, imponer $\vec{v}_C = \vec{0}$
              deja una sola incógnita: el giro de la barra, que sale $-\omega$.
          - texto: Nada, la barra puede girar a cualquier velocidad
            mensaje: |
              No: si girase a otra velocidad, el punto de contacto tendría
              velocidad y el disco patinaría. Rodar sin deslizar amarra las
              dos rotaciones.
          - texto: Que la velocidad del centro B sea nula
            mensaje: |
              B recorre una circunferencia de radio 2R alrededor del eje
              vertical, así que no está quieto. El que tiene velocidad nula es
              el contacto.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **la barra y el disco, con los
          dos giros como vectores sobre sus ejes, los puntos A y C, y M con su
          velocidad**. Solo las direcciones, sin escala.
        comprueba:
          - punto: |
              **El giro propio, $2\omega$, sobre AB, según y; el de la barra,
              sobre el eje vertical, dibujado hacia arriba.**
            porque: |
              El disco gira respecto de la barra alrededor de AB, su eje; la
              barra gira alrededor de OZ. El sentido de este segundo giro es
              incógnita.
          - punto: |
              **A, donde AB corta a OZ, y C, el contacto, debajo de B.**
            porque: |
              A está en los dos ejes de giro y ninguno de los dos lo mueve; C
              es el punto del disco que toca el plano.
          - punto: |
              **M en A, con su velocidad $v$ según +z.**
            porque: |
              M sube por OZ a velocidad constante y, a la altura R, pasa por
              A.
