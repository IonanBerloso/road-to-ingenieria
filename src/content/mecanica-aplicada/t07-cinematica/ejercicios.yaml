    pide: La aceleración angular del brazo CD y la velocidad y aceleración del punto D.
    pasos:
      - tipo: reconocer
        pregunta: |
          El ángulo β está contenido en el plano XY. ¿Qué dirección tiene
          entonces $\vec{\omega}_2$?
        opciones:
          - texto: La del eje z, perpendicular al plano en el que gira el brazo
            correcta: true
            mensaje: |
              Eso es. El brazo CD se mueve dentro del plano XY, así que su
              velocidad angular relativa es perpendicular a ese plano: va
              según $z$.
          - texto: La del propio brazo CD, porque gira alrededor de sí mismo
            mensaje: |
              El brazo no gira sobre su eje: gira **en** el plano XY alrededor
              del punto C. El vector velocidad angular es perpendicular al
              plano del movimiento.
          - texto: La del eje y, la misma que ω₁
            mensaje: |
              Si fueran paralelas, los dos giros se sumarían como escalares,
              no habría aceleración angular y D solo tendría velocidad según
              $z$. Aquí son perpendiculares: el brazo se mueve en el plano XY.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el conjunto en su posición,
          con los dos giros como vectores, el punto C y el punto D**. Solo las
          direcciones, sin escala.
        comprueba:
          - punto: |
              **$\vec{\omega}_1$ sobre el eje Y y $\vec{\omega}_2$ en C,
              según −z.**
            porque: |
              La barra gira alrededor de Y; el brazo, respecto de ella, se
              mueve dentro del plano XY, y su giro va según la normal a ese
              plano. El sentido, −z, es el que marca la flecha del enunciado.
          - punto: |
              **C a 20 mm del eje Y y 10 mm por encima de A.**
            porque: |
              C es un punto de la barra: solo tiene el movimiento de la barra
              alrededor de Y, y es el punto desde el que se aplican los
              campos del brazo.
          - punto: |
              **D, con CD a 120° de CB dentro del plano XY.**
            porque: |
              β se mide desde CB, no desde el eje x: con CB hacia las x
              negativas, CD forma 60° con el eje x.
        figura: |
          <svg viewBox="16 6 246 180" role="img" width="246" height="180" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">Esquema de los dos giros del brazo CD</title>
