      - tipo: calcular
        titulo: La aceleración angular de la barra CD
        pregunta: |
          Con el valor de prueba $\omega = 3\ \text{rad/s}$, ¿cuánto vale la
          componente $y$ de $\vec{\alpha}_{CD}$, en rad/s²?
        respuesta:
          tipo: numero
          valor: '9'
          tolerancia: 0.05
          formato: un número, en rad/s², con su signo
        distractores:
          - valor: '0'
            mensaje: |
              Los dos giros son de módulo constante, pero el eje del giro
              relativo de CD —perpendicular al plano— gira con el plano:
              $\vec{\alpha}_{CD} = \vec{\omega}\times\vec{\omega}_{CD/\pi}$.
          - valor: '3'
            mensaje: |
              Has puesto $\omega$ en lugar de $\omega^{2}$. La aceleración
              angular sale de un producto de dos velocidades angulares, así
              que va en rad/s² y vale $\omega^{2}$.
        pista: |
          En ese instante $\vec{\omega}_{CD/\pi} = \omega\vec{i}$ y el plano
          gira con $\omega\vec{k}$.
        desarrollo: |
          $$
          \vec{\omega}_{CD} = \omega\,\vec{i} + \omega\,\vec{k}
          \qquad
          \vec{\alpha}_{CD} = \omega\vec{k}\times\omega\vec{i} = \omega^{2}\,\vec{j}
          $$

      - tipo: calcular
        titulo: La aceleración de la masa
        pregunta: |
          Con $\omega = 3\ \text{rad/s}$, $v = 2\ \text{m/s}$ y
          $L = 1\ \text{m}$, ¿cuánto vale la componente $z$ de $\vec{a}_M$, en
          m/s²?
        respuesta:
          tipo: numero
          valor: '-12'
          tolerancia: 0.1
          formato: un número, en m/s², con su signo
        distractores:
          - valor: '12'
            mensaje: |
              El módulo está bien y el signo no. La masa se acerca a C sobre
              una barra que gira, y ese término $-2\omega v$ apunta hacia
              abajo.
          - valor: '-9'
            mensaje: |
              Eso es $-\omega^{2}L$, la componente $y$: la centrípeta del
              arrastre. La componente $z$ viene del giro de la barra sobre la
              velocidad relativa de la masa.
        pista: |
          Como la velocidad de M respecto del plano es nula, no hay Coriolis
          con el plano; lo que queda es el arrastre, $-\omega^{2}L\vec{j}$, y
          el término de la barra girando bajo la masa.
        desarrollo: |
          $$
          \vec{a}_M = -\omega^{2}L\,\vec{j} - 2\omega v\,\vec{k}
          = -9\,\vec{j} - 12\,\vec{k}\ \text{m/s}^{2}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'AB está soldado al eje vertical: $\vec{\omega}_{AB} = \omega\vec{k}$ y $\vec{\alpha}_{AB} = \vec{0}$.'
          - texto: 'CD gira además dentro del plano: $\vec{\omega}_{CD} = \omega\vec{i}+\omega\vec{k}$ y $\vec{\alpha}_{CD} = \omega^{2}\vec{j}$.'
          - texto: 'En ese instante la barra está horizontal y M se acerca a C: la velocidad de M respecto del plano es nula.'
          - texto: Como M coincide con C, su aceleración es la de la deslizadera C.
            trampa: true
            mensaje: |
              Coinciden en posición, no en movimiento. C lleva
              $-2\omega v\,\vec{i}$, el Coriolis de deslizar por AB en un
              plano que gira, que M no tiene, porque respecto del plano está
              quieta; y M lleva $-2\omega v\,\vec{k}$, de recorrer una barra
              que gira, que C no tiene. Coincidir en un punto no es ser el
              mismo punto material.
    resolucion: |
      **1. Esquema de velocidades.** Todo pasa dentro de un plano que gira:
      el dibujo lleva el plano de frente en $\omega t = \pi/2$, los dos giros,
      las dos velocidades relativas y el arrastre en C, sin escala.

      <figure class="figura-examen">
      <svg viewBox="56 0 216 190" role="img" width="324" height="285" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">Esquema de los movimientos en el plano que gira, en el instante pedido</title>
