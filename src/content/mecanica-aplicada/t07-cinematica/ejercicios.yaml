      Solo las direcciones, sin escala para los vectores. La velocidad angular del eje, ω₁, va sobre Y; la de la placa respecto de AB, ω₂, sobre AB, según z: se dibuja más allá de A para que no la tape la placa. Los dos sentidos, +j y +k, son los que toma la colección. O está en los dos ejes; la línea tenue va de O a C.

