            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <line x1="102" y1="93.5" x2="202" y2="93.5" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
        <line x1="202" y1="93.5" x2="202" y2="153.5" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
        <line x1="202" y1="153.5" x2="220" y2="140" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
        <path d="M102 93.5 L220 140" fill="none" stroke="var(--ink)" stroke-width="1" stroke-dasharray="4 3"/>
        <circle cx="102" cy="93.5" r="3.4" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
        <circle cx="220" cy="140" r="3.4" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
        <line x1="202" y1="93.5" x2="177.5" y2="123.3" stroke="var(--faint)" stroke-width="0.7"/>
        <path d="M40 176 H64" fill="none" stroke="var(--ink)" stroke-width="1.3" marker-end="url(#dsl-fe)"/>
        <path d="M40 176 V152" fill="none" stroke="var(--ink)" stroke-width="1.3" marker-end="url(#dsl-fe)"/>
