# De seis en seis y no de diez: cada ejercicio de cinemática en el espacio
# lleva unas doscientas flechas de vector, y el bloque de diez más pesado
# pasaba de 3 MB (lib/ejercicios.ts).
porPagina: 6
ejercicios:
  - id: ejma7-el-disco-que-rueda
    titulo: Las velocidades de un disco que rueda sin deslizar
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    antes:
      idea: |
        En un sólido rígido que se mueve en el plano, las velocidades de sus
        puntos no son independientes: conocida la de un punto y la velocidad
        angular, sale la de cualquier otro. A la velocidad del punto conocido
        se le suma la de girar alrededor de él, perpendicular a la recta que
        los une.
      formula: |
        El campo de velocidades del sólido rígido, con A el punto conocido:

        $$
        \vec{v}_P = \vec{v}_A + \vec{\omega}\times\overrightarrow{AP}
        $$

        En el plano, $\vec{\omega}$ es perpendicular al papel, y el término del
        giro mide $\omega\,|AP|$ y es perpendicular a AP.
      reconocer: |
        Antes de calcular se busca un punto del disco cuya velocidad se sepa
        sin hacer cuentas.
    enunciado: |
      Un disco de radio $R = 0{,}3\ \text{m}$ rueda sin deslizar sobre un suelo
      horizontal, girando con velocidad angular $\omega = 10\ \text{rad/s}$ en
      sentido horario, de modo que avanza hacia la derecha. Calcular la
      velocidad de su centro, la del punto más alto y la del punto delantero,
      en el extremo del radio horizontal.
    pide: Las velocidades del centro, del punto más alto y del punto delantero.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué punto del disco conviene usar como punto conocido del campo de
          velocidades?
        opciones:
          - texto: El punto de contacto con el suelo, porque al rodar sin deslizar su velocidad es nula
            correcta: true
            mensaje: |
              Eso es. En ese instante el punto de contacto no desliza, así que
              su velocidad es cero y el disco gira alrededor de él. Cualquier
              velocidad es $\omega$ por la distancia a ese punto.
          - texto: El centro, porque es el único punto que no se mueve
            mensaje: |
              El centro se mueve: avanza con el disco, a $\omega R$. Si lo usas
              como punto conocido, primero hay que saber su velocidad, y esa
              sale del punto de contacto.
          - texto: El punto más alto, porque es el que más rápido va
            mensaje: |
              Va el más rápido, pero no se conoce su velocidad de antemano. El
              único punto con velocidad conocida sin calcular nada es el de
              contacto.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el disco con su giro y la
          dirección de la velocidad del centro, del punto más alto y del
          delantero**. Solo las direcciones, sin escala.
        comprueba:
          - punto: |
              **En el punto de contacto, ninguna flecha.**
            porque: |
              Rueda sin deslizar: en ese instante, el punto de contacto no se
              mueve respecto del suelo.
          - punto: |
              **$\omega$ en sentido horario, y $\vec{v}_O$ horizontal, hacia
              la derecha.**
            porque: |
              El centro se queda siempre a la altura R del suelo, así que solo
              puede moverse en horizontal; y un disco que gira en sentido
              horario sobre el suelo avanza hacia la derecha.
          - punto: |
              **En el punto más alto y en el delantero, cada velocidad
              perpendicular a la recta que lo une con el punto de contacto.**
            porque: |
              Con el contacto quieto, en ese instante el disco gira alrededor
              de él, como si estuviera clavado allí: cada punto se mueve en
              perpendicular a su recta hasta el contacto.
        figura: |
          <svg viewBox="0 24 240 186" role="img" width="240" height="186" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">Esquema de velocidades del disco que rueda sin deslizar</title>
            <desc id="dsl-d">El disco de centro O, apoyado en el suelo en I, con el suelo rayado debajo. Alrededor de O, el giro omega en sentido horario. En O, la velocidad del centro, horizontal hacia la derecha. En A, el punto más alto, su velocidad, horizontal hacia la derecha. En D, el punto delantero, su velocidad hacia la derecha y hacia abajo, perpendicular a la recta fina que lo une con I. Otra recta fina une I con A. En I, ninguna flecha: su velocidad es nula.</desc>
            <defs>
              <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
              </marker>
              <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
              </marker>
              <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
              </marker>
            </defs>
            <path d="M160 95 A50 50 0 1 0 60 95 A50 50 0 1 0 160 95 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M30 145 H200" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M42 145 l-7 7 M62 145 l-7 7 M82 145 l-7 7 M102 145 l-7 7 M122 145 l-7 7 M142 145 l-7 7 M162 145 l-7 7 M182 145 l-7 7 M202 145 l-7 7" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <line x1="110" y1="145" x2="110" y2="45" stroke="var(--faint)" stroke-width="0.7"/>
            <line x1="110" y1="145" x2="160" y2="95" stroke="var(--faint)" stroke-width="0.7"/>
            <path d="M93.1 88.8 A18 18 0 0 1 124.7 84.7" fill="none" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
            <text x="134" y="74" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">ω</text>
            <line x1="112" y1="95" x2="140" y2="95" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
            <text x="128" y="106" font-size="10" text-anchor="middle" fill="var(--ink)" font-style="italic">v<tspan font-size="7.5" dy="2.5">O</tspan></text>
            <line x1="110" y1="45" x2="146" y2="45" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
            <text x="150" y="49" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">v<tspan font-size="7.5" dy="2.5">A</tspan></text>
            <line x1="160" y1="95" x2="182" y2="117" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
            <text x="186" y="122" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">v<tspan font-size="7.5" dy="2.5">D</tspan></text>
            <circle cx="110" cy="95" r="2.4" fill="var(--ink)"/>
            <text x="104" y="108" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">O</text>
            <circle cx="110" cy="145" r="2.4" fill="var(--ink)"/>
            <text x="104" y="160" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">I</text>
            <circle cx="110" cy="45" r="2.4" fill="var(--ink)"/>
            <text x="104" y="40" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">A</text>
            <circle cx="160" cy="95" r="2.4" fill="var(--ink)"/>
            <text x="166" y="88" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">D</text>
            <text x="118" y="162" font-size="9" text-anchor="start" fill="var(--faint)">v<tspan font-size="7" dy="2">I</tspan><tspan dy="-2"> = 0</tspan></text>
            <line x1="158" y1="198" x2="188" y2="198" stroke="var(--ink)" stroke-width="1" marker-end="url(#dsl-fe)"/>
            <line x1="158" y1="198" x2="158" y2="168" stroke="var(--ink)" stroke-width="1" marker-end="url(#dsl-fe)"/>
            <text x="192" y="201" font-size="9.5" font-style="italic" fill="var(--ink)">x</text>
            <text x="154" y="170" font-size="9.5" font-style="italic" text-anchor="end" fill="var(--ink)">y</text>
            <path d="M225.5 189.5 A11 11 0 1 0 205.7 187.8" fill="none" stroke="var(--ink)" stroke-width="1" marker-end="url(#dsl-fe)"/>
            <text x="231" y="176" font-size="10" fill="var(--ink)">+</text>
          </svg>

      - tipo: calcular
        titulo: La velocidad del centro
        pregunta: |
          ¿A qué velocidad va el centro del disco?
        respuesta:
          tipo: magnitud
          valor: '3 m/s'
          formato: una velocidad, con su unidad
        distractores:
          - valor: '6 m/s'
            mensaje: |
              Has usado el diámetro, 0,6 m. El centro está a un **radio** del
              punto de contacto: $v_O = \omega R = 10 \cdot 0{,}3$.
          - valor: '0 m/s'
            mensaje: |
              El centro no está quieto: el disco avanza. El punto sin velocidad
              es el de contacto, a una distancia $R$ del centro.
        pista: |
          El centro está a una distancia $R$ del punto de contacto, que está
          quieto en ese instante.
        desarrollo: |
          $$
          v_O = \omega\,R = 10 \cdot 0{,}3 = 3\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La velocidad del punto más alto
        pregunta: |
          ¿A qué velocidad va el punto más alto del disco?
        respuesta:
          tipo: magnitud
          valor: '6 m/s'
          formato: una velocidad, con su unidad
        distractores:
          - valor: '3 m/s'
            mensaje: |
              Esa es la del centro. El punto más alto va a la velocidad del
              centro **más** la de su giro alrededor de él, que va en el mismo
              sentido: está a $2R$ del punto de contacto.
        pista: |
          El punto más alto está a $2R$ del punto de contacto.
        desarrollo: |
          $$
          v_{\text{arriba}} = \omega \cdot 2R = 10 \cdot 0{,}6 = 6\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La velocidad del punto delantero
        pregunta: |
          ¿Y el punto delantero, en el extremo del radio horizontal?
        respuesta:
          tipo: magnitud
          valor: '4.243 m/s'
          formato: una velocidad, con su unidad
        distractores:
          - valor: '6 m/s'
            mensaje: |
              Has sumado las dos componentes como si fueran paralelas. El
              avance del centro es horizontal y el giro alrededor del centro,
              en ese punto, vertical: se componen con Pitágoras.
          - valor: '3 m/s'
            mensaje: |
              Solo has puesto una de las dos componentes. A la velocidad del
              centro, horizontal, hay que sumarle la del giro alrededor de él,
              que en el punto delantero es vertical y hacia abajo.
        pista: |
          Está a $R\sqrt{2}$ del punto de contacto. O bien: la velocidad del
          centro, 3 m/s en horizontal, más $\omega R = 3\ \text{m/s}$ en vertical.
        desarrollo: |
          $$
          v = \omega\,R\sqrt{2} = 10 \cdot 0{,}3 \cdot 1{,}4142 = 4{,}243\ \text{m/s}
          $$

          A 45° por debajo de la horizontal: perpendicular a la recta que lo une
          con el punto de contacto.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: Al rodar sin deslizar, el punto de contacto tiene velocidad nula y el disco gira alrededor de él.
          - texto: 'El centro, a distancia $R$: $v_O = 3$ m/s. El punto más alto, a $2R$: 6 m/s.'
          - texto: El punto delantero, a $R\sqrt{2}$ del contacto, va a 4,243 m/s, perpendicular a esa distancia.
          - texto: Todos los puntos del disco van a la misma velocidad que el centro, porque el disco es rígido.
            trampa: true
            mensaje: |
              Solo sería así en una traslación, sin giro. El disco gira, y cada
              punto suma a la velocidad del centro la de su giro alrededor de
              él: el contacto va a 0 y el punto más alto al doble.
    resolucion: |
      **1. Esquema de velocidades.** Es un problema de cinemática: el dibujo
      lleva el giro y la dirección de las velocidades, sin escala. A es el
      punto más alto y D, el delantero.

      <figure class="figura-examen">
      <svg viewBox="0 24 240 186" role="img" width="360" height="279" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">Esquema de velocidades del disco que rueda sin deslizar</title>
        <desc id="dsl-d">El disco de centro O, apoyado en el suelo en I, con el suelo rayado debajo. Alrededor de O, el giro omega en sentido horario. En O, la velocidad del centro, horizontal hacia la derecha. En A, el punto más alto, su velocidad, horizontal hacia la derecha. En D, el punto delantero, su velocidad hacia la derecha y hacia abajo, perpendicular a la recta fina que lo une con I. Otra recta fina une I con A. En I, ninguna flecha: su velocidad es nula.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M160 95 A50 50 0 1 0 60 95 A50 50 0 1 0 160 95 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M30 145 H200" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M42 145 l-7 7 M62 145 l-7 7 M82 145 l-7 7 M102 145 l-7 7 M122 145 l-7 7 M142 145 l-7 7 M162 145 l-7 7 M182 145 l-7 7 M202 145 l-7 7" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <line x1="110" y1="145" x2="110" y2="45" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="110" y1="145" x2="160" y2="95" stroke="var(--faint)" stroke-width="0.7"/>
        <path d="M93.1 88.8 A18 18 0 0 1 124.7 84.7" fill="none" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="134" y="74" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">ω</text>
        <line x1="112" y1="95" x2="140" y2="95" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="128" y="106" font-size="10" text-anchor="middle" fill="var(--ink)" font-style="italic">v<tspan font-size="7.5" dy="2.5">O</tspan></text>
        <line x1="110" y1="45" x2="146" y2="45" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="150" y="49" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">v<tspan font-size="7.5" dy="2.5">A</tspan></text>
        <line x1="160" y1="95" x2="182" y2="117" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="186" y="122" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">v<tspan font-size="7.5" dy="2.5">D</tspan></text>
        <circle cx="110" cy="95" r="2.4" fill="var(--ink)"/>
        <text x="104" y="108" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">O</text>
        <circle cx="110" cy="145" r="2.4" fill="var(--ink)"/>
        <text x="104" y="160" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">I</text>
        <circle cx="110" cy="45" r="2.4" fill="var(--ink)"/>
        <text x="104" y="40" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">A</text>
        <circle cx="160" cy="95" r="2.4" fill="var(--ink)"/>
        <text x="166" y="88" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">D</text>
        <text x="118" y="162" font-size="9" text-anchor="start" fill="var(--faint)">v<tspan font-size="7" dy="2">I</tspan><tspan dy="-2"> = 0</tspan></text>
        <line x1="158" y1="198" x2="188" y2="198" stroke="var(--ink)" stroke-width="1" marker-end="url(#dsl-fe)"/>
        <line x1="158" y1="198" x2="158" y2="168" stroke="var(--ink)" stroke-width="1" marker-end="url(#dsl-fe)"/>
        <text x="192" y="201" font-size="9.5" font-style="italic" fill="var(--ink)">x</text>
        <text x="154" y="170" font-size="9.5" font-style="italic" text-anchor="end" fill="var(--ink)">y</text>
        <path d="M225.5 189.5 A11 11 0 1 0 205.7 187.8" fill="none" stroke="var(--ink)" stroke-width="1" marker-end="url(#dsl-fe)"/>
        <text x="231" y="176" font-size="10" fill="var(--ink)">+</text>
      </svg>
      <figcaption>

      Solo las direcciones, sin escala. I, el punto de contacto, no se mueve: en ese instante el disco gira alrededor de él, y la velocidad de cada punto es perpendicular a la recta que lo une con I. Ejes: x hacia la derecha, y hacia arriba; giros positivos en sentido antihorario.

      </figcaption>
      </figure>

      - **I, el punto de contacto.** Rodar sin deslizar quiere decir que no
        se mueve respecto del suelo: en ese instante, $\vec{v}_I = \vec{0}$.
      - **El giro**, $\omega = 10\ \text{rad/s}$ en sentido horario, dato.
      - **O, el centro**, siempre a la altura R: su velocidad es horizontal,
        hacia donde avanza el disco.
      - **A y D.** Con I quieto, el disco gira en ese instante alrededor de I,
        y la velocidad de cada punto es perpendicular a la recta que lo une
        con I.

      **2. Incógnitas.** $\vec{v}_O$, $\vec{v}_A$ y $\vec{v}_D$.

      **3. Ecuaciones.** Ejes x hacia la derecha e y hacia arriba, con el
      origen en I. El giro horario es $\vec{\omega} = -\omega\,\vec{k}$, y las
      posiciones respecto de I, $\overrightarrow{IO} = R\,\vec{j}$,
      $\overrightarrow{IA} = 2R\,\vec{j}$ y
      $\overrightarrow{ID} = R\,\vec{i} + R\,\vec{j}$. El campo de velocidades
      desde I:

      $$
      \vec{v}_P = \vec{v}_I + \vec{\omega}\times\overrightarrow{IP},
      \qquad
      \vec{v}_I = \vec{0}
      $$

      **4. Resultados.** Con $\omega R = 10\cdot 0{,}3 = 3\ \text{m/s}$:

      $$
      \vec{v}_O = \omega R\,\vec{i} = 3\,\vec{i}\ \text{m/s},
      \qquad
      \vec{v}_A = 2\omega R\,\vec{i} = 6\,\vec{i}\ \text{m/s}
      $$

      $$
      \vec{v}_D = \omega R\,\vec{i} - \omega R\,\vec{j} = 3\,\vec{i} - 3\,\vec{j}\ \text{m/s},
      \qquad
      |\vec{v}_D| = 3\sqrt{2} = 4{,}243\ \text{m/s}
      $$

      **El centro va a 3 m/s, el punto más alto a 6 m/s y el delantero a
      4,243 m/s**, este a 45° por debajo de la horizontal, hacia delante.

      **5. Comprobación.** El campo de velocidades desde el centro, que no se
      ha usado, con $\overrightarrow{OA} = R\,\vec{j}$ y
      $\overrightarrow{OD} = R\,\vec{i}$:

      $$
      \vec{v}_A = \vec{v}_O + \vec{\omega}\times\overrightarrow{OA} = 3\,\vec{i} + 3\,\vec{i} = 6\,\vec{i},
      \qquad
      \vec{v}_D = \vec{v}_O + \vec{\omega}\times\overrightarrow{OD} = 3\,\vec{i} - 3\,\vec{j}
      $$

      lo mismo. En A, el giro alrededor del centro va hacia delante y se suma
      al avance; en D, va hacia abajo y se compone con él en ángulo recto.

      **Lo que dice el resultado.** El contacto está parado, el centro va a 3
      y el punto más alto al doble: en cada instante la rueda gira alrededor
      del suelo, y cada punto va más rápido cuanto más lejos está del
      contacto. Por eso, en la foto de una bicicleta en marcha, los radios de
      arriba salen movidos y los de abajo, nítidos.

  - id: ejma7-la-deslizadera-y-coriolis
    titulo: Una deslizadera en una varilla que gira, y la aceleración de Coriolis
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    antes:
      idea: |
        Cuando un punto se mueve sobre un sólido que a su vez se mueve, su
        movimiento se compone de dos: el de arrastre, que es el del punto del
        sólido que coincide con él en ese instante, y el relativo, el que se ve
        desde el sólido. En la aceleración aparece además un término que
        mezcla el giro del sólido con la velocidad relativa: el de Coriolis.
      formula: |
        La composición de velocidades y de aceleraciones, con
        $\vec{\omega}$ el giro del sólido que arrastra:

        $$
        \vec{v} = \vec{v}_{\text{arr}} + \vec{v}_{\text{rel}},
        \qquad
        \vec{a} = \vec{a}_{\text{arr}} + \vec{a}_{\text{rel}} + 2\,\vec{\omega}\times\vec{v}_{\text{rel}}
        $$

        Y la aceleración de un punto de un sólido que gira alrededor de un eje
        fijo, a la posición $\vec{r}$ desde el eje:

        $$
        \vec{a}_{\text{arr}} = \vec{\alpha}\times\vec{r} + \vec{\omega}\times\left(\vec{\omega}\times\vec{r}\right)
        $$
      reconocer: |
        Antes de calcular se mira cómo se mueve la varilla y cómo se mueve la
        deslizadera sobre ella.
    enunciado: |
      Una varilla gira en un plano horizontal alrededor de su extremo fijo $O$
      con velocidad angular constante $\omega = 2\ \text{rad/s}$. Por ella corre
      una deslizadera que se aleja de $O$ a velocidad constante de 1 m/s
      respecto de la varilla. En el instante en que está a 0,5 m de $O$,
      calcular la aceleración de Coriolis y el módulo de la aceleración
      absoluta de la deslizadera.
    pide: La aceleración de Coriolis y el módulo de la aceleración absoluta.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuántos términos tiene la aceleración absoluta de la deslizadera en
          ese instante?
        opciones:
          - texto: Dos no nulos, el arrastre centrípeto y Coriolis; la relativa es nula
            correcta: true
            mensaje: |
              Eso es. El giro es uniforme, así que el arrastre es solo la
              centrípeta; la deslizadera va a velocidad relativa constante, así
              que la relativa es nula; y Coriolis existe porque hay giro y
              velocidad relativa a la vez.
          - texto: Solo la centrípeta, porque todo va a velocidad constante
            mensaje: |
              Velocidades constantes en un sistema que gira no dan
              aceleración nula. Falta Coriolis, $2\vec{\omega} \times \vec{v}_r$, que
              aquí es el término mayor.
          - texto: Ninguno, porque la deslizadera va a velocidad constante
            mensaje: |
              Va a velocidad constante **respecto de la varilla**. Vista desde
              fuera, cambia de dirección y de módulo a la vez: la trayectoria
              absoluta es una espiral.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **la varilla vista desde arriba,
          con su giro y las dos velocidades de la deslizadera**, la relativa y
          la de arrastre. Solo las direcciones, sin escala.
        comprueba:
          - punto: |
              **$\omega$ alrededor de O, con un sentido elegido.**
            porque: |
              El enunciado no dice hacia dónde gira la varilla. Se dibuja uno;
              con el otro, todo lo que es perpendicular a la varilla cambia de
              lado, y los módulos no cambian.
          - punto: |
              **$\vec{v}_{\text{rel}}$ a lo largo de la varilla, alejándose
              de O.**
            porque: |
              Vista desde la varilla, la deslizadera solo puede correr por
              ella, y el enunciado dice que se aleja.
          - punto: |
              **$\vec{v}_{\text{arr}}$ perpendicular a la varilla, en el
              sentido del giro.**
            porque: |
              Es la velocidad del punto de la varilla que coincide con la
              deslizadera, que gira alrededor de O a la distancia r.
