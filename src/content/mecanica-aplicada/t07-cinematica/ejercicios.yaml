      - tipo: calcular
        titulo: La aceleración angular del disco
        pregunta: |
          ¿Cuánto vale la componente $x$ de $\vec{\alpha}$, en rad/s²?
        respuesta:
          tipo: numero
          valor: '-20'
          tolerancia: 0.1
          formato: un número, en rad/s², con su signo
        distractores:
          - valor: '20'
            mensaje: |
              El módulo está bien y el signo no. Con
              $\vec{\omega}_1 = 5\vec{k}$ y $\vec{\omega}_2 = 4\vec{j}$, el
              producto $\vec{\omega}_1\times\vec{\omega}_2$ apunta hacia las
              $x$ negativas.
          - valor: '0'
            mensaje: |
              Los dos giros son constantes en módulo, pero el eje del disco
              —vertical, montado en el brazo— gira arrastrado por ω₁, y esa
              rotación del vector es la aceleración angular.
        pista: |
          $\vec{\alpha} = \vec{\omega}_1\times\vec{\omega}_2$ con
          $\vec{\omega}_1 = 5\vec{k}$ y $\vec{\omega}_2 = 4\vec{j}$.
        desarrollo: |
          $$
          \vec{\alpha} = 5\vec{k}\times 4\vec{j} = -20\,\vec{i}\ \text{rad/s}^{2}
          $$

      - tipo: calcular
        titulo: La velocidad de A
        pregunta: |
          ¿Cuánto vale la componente $y$ de $\vec{v}_A$, en m/s?
        respuesta:
          tipo: numero
          valor: '0.75'
          tolerancia: 0.005
          formato: un número, en m/s, con su signo
        distractores:
          - valor: '0.6'
            mensaje: |
              Ese es el valor de las componentes $x$ y $z$, que valen −0,6
              m/s. La componente $y$ sale de $\omega_1$ por la coordenada $x$
              de A: $5 \cdot 0{,}15$.
          - valor: '-0.75'
            mensaje: |
              El módulo está bien y el signo no: la componente $y$ de
              $\vec{\omega}\times\overrightarrow{CA}$ es
              $\omega_z\,x_A - \omega_x\,z_A = 5\cdot 0{,}15$, positiva. Sale
              negativa si se hace $\overrightarrow{CA}\times\vec{\omega}$.
        pista: |
          $\vec{\omega} = 4\vec{j}+5\vec{k}$ y
          $\overrightarrow{CA} = (0{,}15;\ 0{,}12;\ 0)$ m.
        desarrollo: |
          $$
          \vec{v}_A = \vec{\omega}\times\overrightarrow{CA}
          = -0{,}6\,\vec{i} + 0{,}75\,\vec{j} - 0{,}6\,\vec{k}\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La aceleración de A
        pregunta: |
          ¿Cuánto vale la componente $x$ de $\vec{a}_A$, en m/s²?
        respuesta:
          tipo: numero
          valor: '-6.15'
          tolerancia: 0.02
          formato: un número, en m/s², con su signo
        distractores:
          - valor: '-3.75'
            mensaje: |
              Esa es solo la centrípeta del giro del brazo,
              $-\omega_1^{2}\cdot 0{,}15$. Falta la del giro propio del disco,
              $-\omega_2^{2}\cdot 0{,}15 = -2{,}4$; la tangencial va entera
              según $z$.
          - valor: '-2.4'
            mensaje: |
              Esa es solo una parte del término normal,
              $\omega_y\,v_{Az} = 4\cdot(-0{,}6)$. Falta
              $-\omega_z\,v_{Ay} = -5\cdot 0{,}75 = -3{,}75$; la tangencial,
              $\vec{\alpha}\times\overrightarrow{CA}$, no aporta nada en $x$:
              va entera según $z$.
        pista: |
          $\vec{a}_A = \vec{\alpha}\times\overrightarrow{CA} +
          \vec{\omega}\times\vec{v}_A$.
        desarrollo: |
          $$
          \vec{a}_A = -6{,}15\,\vec{i} - 3\,\vec{j}\ \text{m/s}^{2}
          $$

          La componente $z$ se anula: la tangencial vale $-2{,}4\vec{k}$ y el
          término normal aporta $+2{,}4\vec{k}$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Los ejes Z y CB se cortan en C, que es punto fijo: $\vec{\omega} = 4\vec{j}+5\vec{k}$ rad/s.'
          - texto: $\vec{\alpha} = \vec{\omega}_1\times\vec{\omega}_2 = -20\vec{i}$ rad/s².
          - texto: Con $\overrightarrow{CA} = (0{,}15;\ 0{,}12;\ 0)$ m salen $\vec{v}_A = (-0{,}6;\ 0{,}75;\ -0{,}6)$ m/s y $\vec{a}_A = (-6{,}15;\ -3;\ 0)$ m/s².
          - texto: Como A está en el borde del disco, su velocidad es $\omega_2$ por el radio, 0,6 m/s, y nada más.
            trampa: true
            mensaje: |
              Eso sería si el disco girase sobre un eje fijo. Aquí todo el
              brazo gira además alrededor de Z, y esa parte aporta las
              componentes $x$ e $y$ de la velocidad, −0,6 y 0,75 m/s; los
              0,6 del giro del disco van según $z$.
    resolucion: |
      **1. Esquema de velocidades.** Es un giro compuesto: el dibujo lleva
      el brazo y el disco, los dos giros como vectores sobre sus ejes y los
      puntos C y A, sin escala para los vectores.

      <figure class="figura-examen">
      <svg viewBox="30 10 244 194" role="img" width="366" height="291" aria-labelledby="dsl-t dsl-d">
