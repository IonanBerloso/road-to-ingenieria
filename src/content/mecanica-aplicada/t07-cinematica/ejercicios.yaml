        <text x="106" y="44" font-size="10" fill="var(--ink)">ω₁, α₁</text>
        <path d="M44 88 A 14 14 0 0 1 58 82" fill="none" stroke="var(--ink)" stroke-width="1.1"/>
        <text x="30" y="88" font-size="10" fill="var(--ink)">ω₂</text>
