      <figcaption>

      Solo las direcciones, sin escala. El plano visto de frente, con x saliendo del papel. A es un punto del plano: solo tiene la velocidad de arrastre, perpendicular al plano. B está en el eje: no tiene arrastre, y su velocidad es la de girar alrededor de A dentro del plano, perpendicular a AB. Respecto del plano, cada barra gira en perpendicular a él, según x: la 1 con 2ω, dato; la 2, dibujada en el sentido positivo. Y C, en la guía, respecto del plano solo puede moverse en horizontal; su velocidad relativa se dibuja en el sentido de y. Los dos sentidos los dirá el cálculo.

      </figcaption>
      </figure>

      - **El plano** gira alrededor de z a $\omega$, constante, en sentido
        horario visto desde arriba, el de la flecha de la figura. **A**, un
        punto del plano a L del eje, solo tiene el arrastre: perpendicular al
        plano, saliendo del papel.
      - **Las barras** se quedan en el plano: respecto de él giran alrededor
        de su normal, x. La 1, a $2\omega$ antihorario, dato; la 2, a
        $\omega_{2/\pi}$, dibujada en el sentido positivo; el
        cálculo dirá su sentido.
      - **B** está sobre el eje z: no tiene arrastre, y su velocidad es la de
        girar alrededor de A dentro del plano, perpendicular a AB.
      - **C**, respecto del plano, solo puede correr por la guía: en
        horizontal.

      **2. Incógnitas.** $\omega_{2/\pi}$, y con él $\vec{\omega}_1$ y
      $\vec{\omega}_2$; $\vec{v}_A$, $\vec{v}_B$, $\vec{v}_C$ y
      $\vec{v}_{C/\pi}$; $\vec{\alpha}_1$ y $\vec{\alpha}_2$; y
      $\vec{a}_A$ y $\vec{a}_C$.

      **3. Ecuaciones.** Con el plano π conteniendo los ejes $y$ y $z$ en el
      instante de la figura: $A = (0;\ L;\ 0)$, $B = (0;\ 0;\ -L)$ y
      $C = (0;\ -L;\ 0)$, con O en el origen. El giro del plano es
      $\vec{\omega}_\pi = -\omega\,\vec{k}$, y los relativos,
      $\vec{\omega}_{1/\pi} = 2\omega\,\vec{i}$ y
      $\vec{\omega}_{2/\pi} = \omega_{2/\pi}\,\vec{i}$. Las velocidades
      angulares:

      $$
      \vec{\omega}_1 = \vec{\omega}_\pi + \vec{\omega}_{1/\pi},
      \qquad
      \vec{\omega}_2 = \vec{\omega}_\pi + \vec{\omega}_{2/\pi}
      $$

      Las velocidades, de A a B por la barra 1 y de B a C por la 2, con la
      condición de la guía: C no tiene velocidad vertical.

      $$
      \vec{v}_A = \vec{\omega}_\pi\times\overrightarrow{OA},
      \qquad
      \vec{v}_B = \vec{v}_A + \vec{\omega}_1\times\overrightarrow{AB},
      \qquad
      \vec{v}_C = \vec{v}_B + \vec{\omega}_2\times\overrightarrow{BC},
      \qquad
      \vec{v}_C\cdot\vec{k} = 0
      $$

      La de C vista desde el plano, restando el arrastre:

      $$
      \vec{v}_{C/\pi} = \vec{v}_C - \vec{\omega}_\pi\times\overrightarrow{OC}
      $$

      Las aceleraciones angulares, derivando $\vec{\omega}_1$ y
      $\vec{\omega}_2$. $\vec{\omega}_\pi$ es constante. Los giros relativos
      son constantes en módulo —el de la 2 también: AB y BC miden lo mismo y
      A y C están siempre a la misma altura, así que la 2 gira siempre al
      revés que la 1—, pero van según $\vec{i}$, la normal al plano, y el
      plano la hace girar: $d\vec{i}/dt = \vec{\omega}_\pi\times\vec{i}$.

      $$
      \vec{\alpha}_1 = \vec{\omega}_\pi\times\vec{\omega}_{1/\pi},
      \qquad
      \vec{\alpha}_2 = \vec{\omega}_\pi\times\vec{\omega}_{2/\pi}
      $$

      A es un punto del plano, que gira uniforme:
      $\vec{a}_A = \vec{\omega}_\pi\times(\vec{\omega}_\pi\times\overrightarrow{OA})$.
      C, por composición: el arrastre es el del punto del plano que coincide
      con C; la relativa, la de C en el mecanismo visto desde el plano, con
      A quieta y las dos barras girando a ritmo constante; y Coriolis.

      $$
      \vec{a}_C = \vec{\omega}_\pi\times\left(\vec{\omega}_\pi\times\overrightarrow{OC}\right)
      + \vec{a}_{C/\pi} + 2\,\vec{\omega}_\pi\times\vec{v}_{C/\pi}
      $$

      $$
      \vec{a}_{C/\pi} = \vec{a}_{B/\pi}
      + \vec{\omega}_{2/\pi}\times\left(\vec{\omega}_{2/\pi}\times\overrightarrow{BC}\right),
      \qquad
      \vec{a}_{B/\pi} = \vec{\omega}_{1/\pi}\times\left(\vec{\omega}_{1/\pi}\times\overrightarrow{AB}\right)
      $$

      **4. Resultados.** La velocidad de A y la de B:

      $$
      \vec{v}_A = \omega L\,\vec{i},
      \qquad
      \vec{v}_B = \omega L\,\vec{i} + \left(-\omega L\,\vec{i} + 2\omega L\,\vec{j} - 2\omega L\,\vec{k}\right)
      = 2\omega L\,\vec{j} - 2\omega L\,\vec{k}
      $$

      Desde B, con $\overrightarrow{BC} = (0;\ -L;\ L)$:

      $$
      \vec{v}_C = -\omega L\,\vec{i} + \left(2\omega L - \omega_{2/\pi}L\right)\vec{j} - \left(2\omega L + \omega_{2/\pi}L\right)\vec{k}
      $$

      La guía anula la componente vertical, y de ahí todo lo demás:

      $$
      \omega_{2/\pi} = -2\omega,
      \qquad
      \vec{\omega}_1 = 2\omega\,\vec{i} - \omega\,\vec{k},
      \qquad
      \vec{\omega}_2 = -2\omega\,\vec{i} - \omega\,\vec{k}
      $$

      $$
      \vec{v}_C = -\omega L\,\vec{i} + 4\omega L\,\vec{j},
      \qquad
      \vec{v}_{C/\pi} = \vec{v}_C - \left(-\omega L\,\vec{i}\right) = 4\omega L\,\vec{j}
      $$

      $$
      \vec{\alpha}_1 = -\omega\,\vec{k}\times 2\omega\,\vec{i} = -2\omega^{2}\,\vec{j},
      \qquad
      \vec{\alpha}_2 = -\omega\,\vec{k}\times\left(-2\omega\,\vec{i}\right) = 2\omega^{2}\,\vec{j}
      $$

      Las aceleraciones: A, a L del eje, $\vec{a}_A = -\omega^{2}L\,\vec{j}$,
      hacia el eje. Para C, el arrastre es $\omega^{2}L\,\vec{j}$, también
      hacia el eje; en el plano,
      $\vec{a}_{B/\pi} = -4\omega^{2}\,\overrightarrow{AB} = 4\omega^{2}L\,(\vec{j}+\vec{k})$
      y la barra 2 añade
      $-4\omega^{2}\,\overrightarrow{BC} = 4\omega^{2}L\,(\vec{j}-\vec{k})$,
      así que $\vec{a}_{C/\pi} = 8\omega^{2}L\,\vec{j}$; y Coriolis,
      $2\,(-\omega\,\vec{k})\times 4\omega L\,\vec{j} = 8\omega^{2}L\,\vec{i}$:

      $$
      \vec{a}_C = 8\omega^{2}L\,\vec{i} + 9\omega^{2}L\,\vec{j},
      \qquad
      |\vec{a}_C| = \sqrt{145}\,\omega^{2}L = 12{,}04\,\omega^{2}L
      $$

      La barra 2 gira respecto del plano a $2\omega$ como la 1, pero en
      sentido horario. Los módulos: $\sqrt{5}\,\omega$ las dos velocidades
      angulares; $\omega L$, $2\sqrt{2}\,\omega L$ y $\sqrt{17}\,\omega L$ las
      velocidades de A, B y C; $4\omega L$ la de C vista desde el plano; y
      $2\omega^{2}$ las dos aceleraciones angulares. Con los valores de
      prueba de las casillas, $\omega = 1$ rad/s y $L = 1$ m, los
      coeficientes son los números: $\vec{v}_{C/\pi} = 4\,\vec{j}$ m/s y
      $\vec{a}_C = (8;\ 9;\ 0)$ m/s².

      **5. Comprobación.** La velocidad de C, por composición de
      movimientos, que no se ha usado para ella: respecto del plano, A está
      fija y la barra 1 gira a $2\omega\,\vec{i}$:

      $$
      \vec{v}_{B/\pi} = 2\omega\,\vec{i}\times(0;\ -L;\ -L) = 2\omega L\,\vec{j} - 2\omega L\,\vec{k}
      $$

      $$
      \vec{v}_{C/\pi} = \vec{v}_{B/\pi} + \omega_{2/\pi}\,\vec{i}\times(0;\ -L;\ L)
      = \left(2\omega L - \omega_{2/\pi}L\right)\vec{j} - \left(2\omega L + \omega_{2/\pi}L\right)\vec{k}
      $$

      La guía anula otra vez la vertical, $\omega_{2/\pi} = -2\omega$, y con
      el arrastre de C, $-\omega L\,\vec{i}$, sale
      $\vec{v}_C = -\omega L\,\vec{i} + 4\omega L\,\vec{j}$: lo mismo.

      La aceleración de C, por los campos de aceleraciones de las dos
      barras, de A a B y de B a C, que tampoco se han usado. En la barra 1,
      $\vec{\alpha}_1\times\overrightarrow{AB} = 2\omega^{2}L\,\vec{i}$ y
      $\vec{\omega}_1\times(\vec{\omega}_1\times\overrightarrow{AB}) = (2;\ 5;\ 4)\,\omega^{2}L$:

      $$
      \vec{a}_B = -\omega^{2}L\,\vec{j} + 2\omega^{2}L\,\vec{i} + (2;\ 5;\ 4)\,\omega^{2}L
      = 4\omega^{2}L\,(\vec{i}+\vec{j}+\vec{k})
      $$

      que es el resultado que imprime la colección para el apartado e. En la
      barra 2, $\vec{\alpha}_2\times\overrightarrow{BC} = 2\omega^{2}L\,\vec{i}$
      y $\vec{\omega}_2\times(\vec{\omega}_2\times\overrightarrow{BC}) = (2;\ 5;\ -4)\,\omega^{2}L$:

      $$
      \vec{a}_C = 4\omega^{2}L\,(1;\ 1;\ 1) + 2\omega^{2}L\,\vec{i} + (2;\ 5;\ -4)\,\omega^{2}L
      = (8;\ 9;\ 0)\,\omega^{2}L
      $$

      lo mismo que por composición.

      **Lo que dice el resultado.** Cada punto tiene una mezcla distinta: A
      solo arrastre, B solo movimiento relativo, porque está en el eje, y C
      las dos cosas. Que todos los giros sean constantes no deja a las barras
      sin aceleración angular: el plano arrastra la dirección de los giros
      relativos, y las aceleraciones angulares salen según $\vec{j}$,
      perpendiculares a la vez a $\vec{\omega}_\pi$ y a los giros relativos.
      Y la única parte de la aceleración de C que se sale del plano,
      $8\omega^{2}L$ según x, es la de Coriolis.

  - id: ejma7-col714-el-disco-que-rueda-y-el-punto-que-sube-por-el-eje
    titulo: El disco que rueda y el punto que sube por el eje vertical
    fuente: >-
      Ejercicio 7.14 · Tema 7, «Cinemática del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo. En la aceleración de M
      relativa al disco la colección imprime más cuatro omega uve según i, y
      las dos comprobaciones nuestras dan menos cuatro omega uve según i, con
      el signo contrario; se publica el nuestro y el impreso queda de
      distractor.
      Las casillas piden el número con los valores de prueba que se declaran
      en cada pregunta.
    nivel: practica
    antes:
      idea: |
        El disco tiene dos giros: el de la barra alrededor del eje vertical y
        el suyo propio alrededor de la barra. Su velocidad angular es la suma
        vectorial de los dos y su aceleración angular, la derivada de esa
        suma. Para un punto que se mueve respecto del disco, la composición de
        movimientos relaciona lo que ve un observador fijo con lo que ve el
        que gira con el disco, y en la aceleración aparece el término de
        Coriolis.
      formula: |
        La composición de los giros y de los movimientos de un punto, con
        $\vec{\omega}$ el giro del sólido que arrastra:

        $$
        \vec{\omega} = \vec{\omega}_1 + \vec{\omega}_2,
        \qquad
        \vec{\alpha} = \frac{d\vec{\omega}}{dt}
        $$

        $$
        \vec{v} = \vec{v}_{\text{arr}} + \vec{v}_{\text{rel}},
        \qquad
        \vec{a} = \vec{a}_{\text{arr}} + \vec{a}_{\text{rel}} + 2\,\vec{\omega}\times\vec{v}_{\text{rel}}
        $$

        El EIRD es la recta paralela a $\vec{\omega}$ por los puntos de
        velocidad mínima.
      reconocer: |
        Antes de calcular se mira cómo se mueve cada parte: la barra AB, el
        disco respecto de ella y el punto M.
    enunciado: |
      Un disco vertical de radio R rueda sobre un plano horizontal fijo π con
      rotación angular constante 2ω relativa a la barra AB. Sobre el eje OZ se
      mueve con velocidad contante v positiva un punto material M. Si la
      longitud de la barra es 2R, calcular:

      a) La rotación y aceleración angular del movimiento absoluto del disco
      para que no exista deslizamiento entre disco y plano π.

      b) Velocidad y aceleración del punto M respecto al disco cuando el punto
      está a una altura R.

      c) Eje instantáneo de rotación y deslizamiento (EIRD) del disco.

