    pide: La velocidad angular y la aceleración angular del disco A, y la aceleración del punto D.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué condición fija la velocidad de giro propio del disco A?
        opciones:
          - texto: Que su punto de contacto D tenga velocidad nula
            correcta: true
            mensaje: |
              Eso es rodar sin deslizar. Esa única ecuación relaciona el giro
              propio con el del eje: $\omega_{\text{propio}} = \omega_1 R/r$.
          - texto: Que el centro A esté quieto
            mensaje: |
              A no está quieto: describe una circunferencia de radio R
              alrededor del eje vertical, a velocidad $\omega_1 R$.
          - texto: Que los dos discos giren a la misma velocidad y en el mismo sentido
            mensaje: |
              Están a la misma distancia del centro, así que sus giros propios
              tienen el mismo módulo, pero eso no lo fija: lo fija el no
              deslizamiento en cada contacto.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el conjunto visto de frente,
          con los dos giros del disco A y la velocidad de su centro**. Solo las
          direcciones, sin escala.
        comprueba:
          - punto: |
              **C fijo, y $\vec{\omega}_1$ sobre la vertical que pasa por él.**
            porque: |
              El eje AB gira alrededor de la vertical que pasa por su centro:
              C está sobre ella y no se mueve.
          - punto: |
              **$\vec{v}_A$ perpendicular al papel.**
            porque: |
              A gira alrededor de la vertical a la distancia R: su velocidad es
              horizontal y perpendicular al eje AB. Con $\vec{\omega}_1$ hacia
              arriba, sale del papel.
          - punto: |
              **El giro propio, $\vec{\omega}_p$, sobre el eje AB, dibujado
              según x.**
            porque: |
              Respecto del eje, el disco solo puede girar alrededor de AB. Su
              sentido lo dará el signo, al imponer la condición del contacto.
          - punto: |
              **En D, ninguna flecha.**
            porque: |
              Rueda sin deslizar: el punto de contacto no se mueve respecto del
              suelo.
