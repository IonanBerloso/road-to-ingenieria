        <text x="124" y="98" font-size="10" fill="var(--ink)">β</text>
        <line x1="70" y1="104" x2="70" y2="70" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="76" y="80" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">ω<tspan font-size="7.5" dy="2.5">1</tspan><tspan dy="-2.5"></tspan></text>
        <line x1="157" y1="107.7" x2="184" y2="91.2" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="190" y="96" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">ω<tspan font-size="7.5" dy="2.5">2</tspan><tspan dy="-2.5"></tspan></text>
        <circle cx="70" cy="152" r="2.4" fill="var(--ink)"/>
        <text x="62" y="164" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">A</text>
