        <line x1="158" y1="174" x2="158" y2="144" stroke="var(--ink)" stroke-width="1" marker-end="url(#dsl-fe)"/>
        <text x="192" y="177" font-size="9.5" font-style="italic" fill="var(--ink)">x</text>
        <text x="154" y="146" font-size="9.5" font-style="italic" text-anchor="end" fill="var(--ink)">y</text>
        <path d="M225.5 165.5 A11 11 0 1 0 205.7 163.8" fill="none" stroke="var(--ink)" stroke-width="1" marker-end="url(#dsl-fe)"/>
        <text x="231" y="152" font-size="10" fill="var(--ink)">+</text>
      </svg>
      <figcaption>

      Solo las direcciones, sin escala, en t = 1 s: la varilla ha dado una vuelta entera y está según x. La componente radial va a lo largo de la varilla; la transversal, perpendicular a ella, en el sentido en que crece θ. Ejes: x hacia la derecha, y hacia arriba; giros positivos en sentido antihorario.

      </figcaption>
      </figure>

      - **En t = 1 s**, $\theta = 2\pi$: la varilla ha dado una vuelta entera
        y está según x. Las direcciones polares coinciden con las
        cartesianas: $\vec{u}_r = \vec{i}$ y $\vec{u}_\theta = \vec{j}$.
      - **El giro**, $\dot{\theta}$, antihorario: θ crece con el tiempo.
      - **La componente radial**, a lo largo de la varilla, y **la
        transversal**, perpendicular, en el sentido del giro.

      **2. Incógnitas.** La velocidad y la aceleración de A en t = 1 s, y su
      aceleración respecto de la varilla.

      **3. Ecuaciones.** Las componentes polares:

      $$
      \vec{v} = \dot{r}\,\vec{u}_r + r\dot{\theta}\,\vec{u}_\theta,
      \qquad
      \vec{a} = \left(\ddot{r} - r\dot{\theta}^{2}\right)\vec{u}_r
      + \left(r\ddot{\theta} + 2\dot{r}\dot{\theta}\right)\vec{u}_\theta
      $$

      Y la relativa: vista desde la varilla, A recorre una recta, así que su
      aceleración relativa es $\ddot{r}\,\vec{u}_r$. Los datos salen de
      derivar las dos leyes: $\dot{r} = 120t - 60t^{2}$,
      $\ddot{r} = 120 - 120t$, $\dot{\theta} = 4\pi t$ y
      $\ddot{\theta} = 4\pi$.

      **4. Resultados.** En t = 1 s: $r = 40$ m, $\dot{r} = 60$ m/s,
      $\ddot{r} = 0$, $\dot{\theta} = 4\pi$ rad/s y
      $\ddot{\theta} = 4\pi$ rad/s².

      $$
      \vec{v} = 60\,\vec{i} + 160\pi\,\vec{j} = 60\,\vec{i} + 502{,}65\,\vec{j}\ \text{m/s}
      $$

      $$
      \vec{a} = -640\pi^{2}\,\vec{i} + 640\pi\,\vec{j} = -6316{,}5\,\vec{i} + 2010{,}6\,\vec{j}\ \text{m/s}^{2}
      $$

      $$
      \vec{a}_{\text{rel}} = \ddot{r}\,\vec{u}_r = \vec{0}
      $$

      La colección imprime 60, 160, −640 y 640, que es esta misma cuenta con
      $\dot{\theta} = 4$ rad/s en vez de $4\pi$; con la ley del enunciado,
      los tres últimos llevan π.

      **5. Comprobación.** Por la composición de movimientos, que no se ha
      usado: arrastre de la varilla, relativa y Coriolis, con
      $\vec{\omega} = 4\pi\,\vec{k}$, $\vec{\alpha} = 4\pi\,\vec{k}$,
      $\overrightarrow{OA} = 40\,\vec{i}$ y
      $\vec{v}_{\text{rel}} = 60\,\vec{i}$:

      $$
      \vec{a}_{\text{arr}} = \vec{\alpha}\times\overrightarrow{OA} + \vec{\omega}\times\left(\vec{\omega}\times\overrightarrow{OA}\right) = 160\pi\,\vec{j} - 640\pi^{2}\,\vec{i},
      \qquad
      \vec{a}_{\text{cor}} = 2\,\vec{\omega}\times\vec{v}_{\text{rel}} = 480\pi\,\vec{j}
      $$

      Con la relativa nula, la suma es $-640\pi^{2}\,\vec{i} + 640\pi\,\vec{j}$:
      lo mismo.

      **Lo que dice el resultado.** La componente según x, −6316 m/s², es la
      centrípeta, y sale entera del arrastre: la nota el punto de la varilla
      que coincide con A. Para alguien montado en la varilla, A va en línea
      recta y en ese instante ni siquiera acelera. Los números son enormes
      porque en t = 1 s la varilla da dos vueltas por segundo con A a 40 m
      del eje.

  - id: ejma7-col74-el-cuadro-de-barras-que-gira-alrededor-de-ad
    titulo: Velocidad y aceleración de B en un cuadro de barras que gira sobre AD
    fuente: >-
      Ejercicio 7.4 · Tema 7, «Cinemática del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    antes:
      idea: |
        Un sólido con dos puntos fijos solo puede girar alrededor de la recta
        que los une. Conocido su giro, el campo de velocidades da la velocidad
        de cualquier punto, y derivándolo sale la aceleración.
      formula: |
        El campo de velocidades y el de aceleraciones del sólido rígido, con A
        y P dos puntos suyos:

        $$
        \vec{v}_P = \vec{v}_A + \vec{\omega}\times\overrightarrow{AP},
        \qquad
        \vec{a}_P = \vec{a}_A + \vec{\alpha}\times\overrightarrow{AP}
        + \vec{\omega}\times\left(\vec{\omega}\times\overrightarrow{AP}\right)
        $$
      reconocer: |
        Antes de calcular se mira en qué forma tienen que estar los datos para
        usar el campo de velocidades.
    enunciado: |
      Las barras AB, BC y CD unen rígidamente los puntos A y D. El sistema
      gira respecto al eje AD con una velocidad constante ω = 75 rad/s, siendo
      el sentido de rotación desde D hacia A. Determinar la velocidad y
      aceleración de B.

