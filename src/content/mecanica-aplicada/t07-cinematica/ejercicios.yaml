            <text x="140" y="114" font-size="9" text-anchor="start" fill="var(--faint)">t = 2 s</text>
          </svg>

      - tipo: calcular
        titulo: El módulo de la velocidad
        pregunta: |
          ¿Cuánto vale $|\vec{v}|$ en $t = 2\ \text{s}$, en m/s?
        respuesta:
          tipo: numero
          valor: '15.297'
          tolerancia: 0.02
          formato: un número, en m/s
        distractores:
          - valor: '15.62'
            mensaje: |
              Ese es el módulo de la **aceleración**,
              $\vec{a} = 10\vec{j}-12\vec{k}$. La velocidad en $t=2$ es
              $(3,\ 12,\ -9)$.
          - valor: '6'
            mensaje: |
              Has sumado las componentes con su signo, $3 + 12 - 9 = 6$. El
              módulo es la raíz de la suma de sus cuadrados:
              $|\vec{v}| = \sqrt{9+144+81}$.
        pista: |
          $\vec{v} = 3\vec{i} + (10t-8)\vec{j} + (15-12t)\vec{k}$.
        desarrollo: |
          $$
          \vec{v}(2) = 3\vec{i} + 12\vec{j} - 9\vec{k}
          \qquad
          |\vec{v}| = \sqrt{234} = 15{,}297\ \text{m/s}
          $$

      - tipo: calcular
        titulo: El radio de curvatura
        pregunta: |
          ¿Cuánto vale el radio de curvatura en ese instante, en metros?
        respuesta:
          tipo: numero
          valor: '50.06'
          tolerancia: 0.15
          formato: un número, en m
        distractores:
          - valor: '3.27'
            mensaje: |
              Te has dejado un $|\vec{v}|$: la fórmula lleva el módulo de la
              velocidad **al cubo**, no al cuadrado. Con el cubo salen unos
              50 m.
          - valor: '14.98'
            mensaje: |
              Has dividido entre el módulo total de la aceleración en vez de
              entre la componente normal, que es bastante menor
              (4,67 frente a 15,62 m/s²).
        pista: |
          $\vec{v}\times\vec{a} = (-54,\ 36,\ 30)$, de módulo
          $\sqrt{5112} = 71{,}50$.
        desarrollo: |
          $$
          \rho = \frac{|\vec{v}|^{3}}{|\vec{v}\times\vec{a}|}
          = \frac{234\sqrt{234}}{\sqrt{5112}} = 50{,}06\ \text{m}
          $$

          La colección imprime 49,95 m: la misma cuenta con redondeos por el
          camino; con $a_n \approx 4{,}685$ m/s², en vez de 4,674, sale 49,95.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Derivando: $\vec{v} = (3,\ 10t-8,\ 15-12t)$ y $\vec{a} = (0,\ 10,\ -12)$.'
          - texto: 'En $t=2$: $\vec{v} = (3,\ 12,\ -9)$ con $|\vec{v}| = \sqrt{234}$, y $\vec{v}\times\vec{a} = (-54,\ 36,\ 30)$.'
          - texto: $\rho = |\vec{v}|^{3}/|\vec{v}\times\vec{a}| = 50{,}06$ m.
          - texto: Como $z$ tiene un término en $t^{2}$ con signo negativo, el radio de curvatura sale negativo.
            trampa: true
            mensaje: |
              El radio de curvatura es una distancia y nunca es negativo: se
              calcula con **módulos**. El signo de un coeficiente cambia hacia
              dónde se dobla la curva, no cuánto.
    resolucion: |
      **1. Esquema de velocidades.** Es cinemática del punto: el dibujo lleva
      la forma de la trayectoria, el punto P donde está la partícula a los
      2 s, su velocidad y su aceleración.

      <figure class="figura-examen">
      <svg viewBox="14 40 200 158" role="img" width="300" height="237" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">Esquema de la trayectoria en su propio plano, con la velocidad y la aceleración a los 2 segundos</title>
        <desc id="dsl-d">La trayectoria dibujada en su propio plano: una parábola como la de un tiro, que sale del punto inicial subiendo, llega a lo más alto y baja. La aceleración, constante, hace el papel de la gravedad y se dibuja hacia abajo. En la bajada, el punto P, donde está la partícula a los 2 segundos; en él, la velocidad, tangente a la curva y hacia abajo, y la aceleración, vertical hacia abajo, separadas un ángulo pequeño. Desde P, hacia dentro de la curva, la normal n, en línea fina.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M40 150 Q90.3 -33.1 140.7 161.8" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <line x1="131.5" y1="129.5" x2="102.9" y2="138.5" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="131.5" y1="129.5" x2="145.3" y2="173.4" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="151" y="178" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">v</text>
        <line x1="131.5" y1="129.5" x2="131.5" y2="172" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="126" y="182" font-size="10" text-anchor="end" fill="var(--ink)" font-style="italic">a</text>
        <circle cx="40" cy="150" r="2.4" fill="var(--ink)"/>
        <circle cx="131.5" cy="129.5" r="2.4" fill="var(--ink)"/>
        <text x="140" y="126" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">P</text>
        <text x="46" y="162" font-size="9" text-anchor="start" fill="var(--faint)">t = 0</text>
        <text x="98" y="142" font-size="9" text-anchor="end" fill="var(--faint)">n</text>
        <text x="140" y="114" font-size="9" text-anchor="start" fill="var(--faint)">t = 2 s</text>
      </svg>
      <figcaption>

      La parábola en su propio plano, a escala, con la aceleración constante dibujada hacia abajo, como la gravedad en un tiro; las flechas, sin escala. Ese plano no es ninguno de los coordenados. En P, la velocidad es tangente y la normal, n, apunta hacia dentro de la curva.

      </figcaption>
      </figure>

      - **La trayectoria es plana.** Las tres coordenadas son de grado 2:
        $\vec{r} = \vec{r}_0 + \vec{b}\,t + \vec{c}\,t^{2}$, con
        $\vec{r}_0 = (-1,\ -4,\ 1)$, $\vec{b} = (3,\ -8,\ 15)$ y
        $\vec{c} = (0,\ 5,\ -6)$. Es una parábola en el plano que pasa por
        $\vec{r}_0$ y contiene a $\vec{b}$ y a $\vec{c}$, que no es ninguno
        de los coordenados.
      - **La aceleración**, $2\,\vec{c}$, es constante: hace el papel de la
        gravedad en un tiro, y se dibuja hacia abajo.
      - **En t = 2 s**, la partícula está en $P = (5,\ 0,\ 7)$ m, con la
        velocidad tangente y la normal hacia dentro de la curva.

      **2. Incógnitas.** $\vec{v}$ y $\vec{a}$ en t = 2 s, y el radio de
      curvatura $\rho$.

      **3. Ecuaciones.** Las derivadas del vector de posición y el radio de
      curvatura por el producto vectorial, que no obliga a separar antes las
      componentes intrínsecas:

      $$
      \vec{v} = \frac{d\vec{r}}{dt},
      \qquad
      \vec{a} = \frac{d\vec{v}}{dt},
      \qquad
      \rho = \frac{|\vec{v}|^{3}}{|\vec{v}\times\vec{a}|}
      $$

      **4. Resultados.** Derivando,
      $\vec{v} = 3\,\vec{i} + (10t - 8)\,\vec{j} + (15 - 12t)\,\vec{k}$ y
      $\vec{a} = 10\,\vec{j} - 12\,\vec{k}$. En t = 2 s:

      $$
      \vec{v} = 3\,\vec{i} + 12\,\vec{j} - 9\,\vec{k}\ \text{m/s},
      \qquad
      |\vec{v}| = \sqrt{234} = 15{,}297\ \text{m/s},
      \qquad
      \vec{a} = 10\,\vec{j} - 12\,\vec{k}\ \text{m/s}^{2}
      $$

      $$
      \vec{v}\times\vec{a} = -54\,\vec{i} + 36\,\vec{j} + 30\,\vec{k},
      \qquad
      |\vec{v}\times\vec{a}| = \sqrt{5112} = 71{,}50
      $$

      $$
      \rho = \frac{234\sqrt{234}}{\sqrt{5112}} = 50{,}06\ \text{m}
      $$

      La colección publica 49,95 m, que es la misma cuenta con redondeos por
      el camino: con $a_n \approx 4{,}685$ m/s², en vez de 4,674, sale 49,95.

      **5. Comprobación.** Por las componentes intrínsecas, que no se han
      usado. La tangencial es la proyección de la aceleración sobre la
      velocidad, y la normal, lo que queda:

      $$
      a_t = \frac{\vec{v}\cdot\vec{a}}{|\vec{v}|} = \frac{228}{15{,}297} = 14{,}90\ \text{m/s}^{2},
      \qquad
      a_n = \sqrt{244 - 14{,}90^{2}} = 4{,}674\ \text{m/s}^{2},
      \qquad
      \rho = \frac{|\vec{v}|^{2}}{a_n} = \frac{234}{4{,}674} = 50{,}06\ \text{m}
      $$

      lo mismo.

      **Lo que dice el resultado.** De los 15,6 m/s² de aceleración, 14,9 van
      a lo largo de la velocidad: a los 2 s la partícula ya ha pasado lo alto
      de la parábola —$\vec{v}\cdot\vec{a} > 0$, se acelera— y baja casi en
      recta, con la curva muy abierta. Lo más cerrado de la parábola está en
      su vértice, en t ≈ 1,07 s, donde la velocidad es perpendicular a la
      aceleración: allí el radio es de solo 1,34 m.

  - id: ejma7-col73-la-deslizadera-sobre-la-varilla-que-acelera
    titulo: La deslizadera de una varilla con giro acelerado, en polares
    fuente: >-
      Ejercicio 7.3 · Tema 7, «Cinemática del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado
      —60 y 160 m/s, y −640 y 640 m/s²—, que sale de tomar una derivada del
      ángulo de 4 rad/s; con la ley del enunciado, theta igual a dos pi te al
      cuadrado, esa derivada vale 4 pi, así que aquí se publican los valores
      con pi y los impresos aparecen como distractores.
    nivel: practica
    antes:
      idea: |
        Un punto que corre por una varilla que gira se describe bien en
        polares: la distancia r al eje de giro y el ángulo θ de la varilla. La
        velocidad y la aceleración se reparten en la dirección de la varilla,
        la radial, y en su perpendicular, la transversal, dos direcciones que
        giran con ella.
      formula: |
        Con $\vec{u}_r$ a lo largo de la varilla y $\vec{u}_\theta$
        perpendicular, en el sentido en que crece θ:

        $$
        \vec{v} = \dot{r}\,\vec{u}_r + r\dot{\theta}\,\vec{u}_\theta,
        \qquad
        \vec{a} = \left(\ddot{r} - r\dot{\theta}^{2}\right)\vec{u}_r
        + \left(r\ddot{\theta} + 2\dot{r}\dot{\theta}\right)\vec{u}_\theta
        $$
      reconocer: |
        Antes de calcular se mira hacia dónde apunta la varilla en el instante
        que se pide.
    enunciado: |
      El movimiento de la varilla se rige a través de la siguiente ley:
      $\theta = 2\pi t^{2}$, con el ángulo en radianes si el tiempo está en
      segundos. Por otro lado, la ecuación del movimiento de la deslizadera
      relativo a la varilla está gobernado por: $r = 60t^{2} - 20t^{3}$, con
      r en metros y t en segundos. Cuando t = 1 s, calcular:

      a) Velocidad de la deslizadera.

      b) Aceleración de la deslizadera.

      c) Aceleración respecto de la deslizadera.

      <figure>
      <svg viewBox="0 0 300 180" role="img" width="300" height="180" aria-labelledby="ma7c3-t ma7c3-d">
        <title id="ma7c3-t">Varilla articulada en O con una deslizadera A a distancia r</title>
        <desc id="ma7c3-d">Una varilla recta articulada en el punto O sobre el suelo forma un ángulo theta con la horizontal. Sobre ella corre una deslizadera A, situada a una distancia r del punto O medida a lo largo de la varilla.</desc>
        <path d="M30 152 H110 M34 152 l-8 8 M50 152 l-8 8 M66 152 l-8 8 M82 152 l-8 8 M98 152 l-8 8" fill="none" stroke="var(--faint)" stroke-width="1"/>
        <line x1="30" y1="152" x2="110" y2="152" stroke="var(--ink)" stroke-width="1.2"/>
        <line x1="60" y1="140" x2="253" y2="29" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
        <circle cx="60" cy="140" r="4" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.4"/>
        <text x="48" y="152" font-size="11" fill="var(--ink)">O</text>
        <line x1="60" y1="140" x2="180" y2="140" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="4 3"/>
        <path d="M96 140 A 36 36 0 0 0 91 121" fill="none" stroke="var(--ink)" stroke-width="1"/>
        <text x="100" y="132" font-size="11" fill="var(--ink)">θ</text>
        <rect x="176" y="63" width="26" height="15" rx="2" fill="var(--faint)" fill-opacity="0.45" stroke="var(--ink)" stroke-width="1.2" transform="rotate(-30 189 70)"/>
        <text x="196" y="86" font-size="11" fill="var(--ink)">A</text>
        <line x1="52" y1="126" x2="181" y2="52" stroke="var(--d1)" stroke-width="1" stroke-dasharray="4 3"/>
        <text x="104" y="82" font-size="11" fill="var(--d1)">r</text>
      </svg>
      </figure>
    pide: La velocidad y la aceleración absolutas de la deslizadera en t = 1 s, y su aceleración relativa a la varilla.
    pasos:
      - tipo: reconocer
        pregunta: |
          En $t = 1\ \text{s}$ la varilla ha dado una vuelta entera
          ($\theta = 2\pi$). ¿Qué dirección tiene entonces la componente
          radial de la velocidad?
        opciones:
          - texto: La del eje x, porque la varilla vuelve a estar en su posición inicial
            correcta: true
            mensaje: |
              Eso es: $\theta = 2\pi$ es una vuelta completa, así que la
              varilla apunta otra vez según $x$ y las componentes polares
              coinciden con las cartesianas.
          - texto: La del eje y, porque el ángulo vale $2\pi$ radianes y eso son 90°
            mensaje: |
              $2\pi$ radianes son 360°, no 90°. Los 90° son $\pi/2$. Cuidado
              con esa conversión, que aquí decide qué eje es cuál.
          - texto: Ninguna fija, porque la varilla gira y no se puede saber
            mensaje: |
              Sí se puede: la ley $\theta(t)$ da el ángulo exacto en cada
              instante. En $t=1$ vale $2\pi$, una vuelta justa.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **la varilla en t = 1 s, con su
          giro y las dos componentes de la velocidad de la deslizadera**. Solo
          las direcciones, sin escala.
        comprueba:
          - punto: |
              **La varilla según x, con A a la distancia r de O.**
            porque: |
              En t = 1 s, $\theta = 2\pi$: una vuelta entera, y la varilla
              vuelve a estar donde empezó.
          - punto: |
              **$\dot{\theta}$ en sentido antihorario.**
            porque: |
              θ crece con el tiempo, y los ángulos se miden en sentido
              antihorario desde x.
          - punto: |
              **$v_r$ a lo largo de la varilla, dibujada alejándose de O, y
              $v_\theta$ perpendicular a ella, en el sentido del giro.**
            porque: |
              La radial es la de correr por la varilla, $\dot{r}$, y su signo
              dirá si se aleja o se acerca; la transversal es la de girar con
              ella, $r\dot{\theta}$.
        figura: |
          <svg viewBox="0 34 240 150" role="img" width="240" height="150" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">Esquema de velocidades de la deslizadera en t igual a 1 segundo</title>
            <desc id="dsl-d">La varilla en t igual a 1 segundo, horizontal, según el eje x, articulada en O a la izquierda. Alrededor de O, la derivada de theta, antihoraria. La deslizadera A sobre la varilla, a una distancia r de O. Debajo de A, la velocidad radial, a lo largo de la varilla y alejándose de O. Encima, la velocidad transversal, perpendicular a la varilla, en el sentido del giro.</desc>
            <defs>
              <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
              </marker>
              <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
              </marker>
              <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
              </marker>
            </defs>
            <path d="M130 92 H150 V108 H130 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <line x1="50" y1="100" x2="210" y2="100" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
            <circle cx="50" cy="100" r="3.4" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
            <line x1="140" y1="108" x2="140" y2="140" stroke="var(--faint)" stroke-width="0.7"/>
            <path d="M50 136 H140 M50 132 V140 M140 132 V140" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
            <text x="95" y="130" font-size="9" text-anchor="middle" fill="var(--faint)">r</text>
            <path d="M65 94.5 A16 16 0 0 0 35 94.5" fill="none" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
            <text x="50" y="74" font-size="10" text-anchor="middle" fill="var(--ink)" font-style="italic">θ̇</text>
            <line x1="130" y1="118" x2="168" y2="118" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
            <text x="172" y="122" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">v<tspan font-size="7.5" dy="2.5">r</tspan></text>
            <line x1="140" y1="92" x2="140" y2="56" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
            <text x="146" y="62" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">v<tspan font-size="7.5" dy="2.5">θ</tspan></text>
            <circle cx="50" cy="100" r="2.4" fill="var(--ink)"/>
            <text x="44" y="120" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">O</text>
            <circle cx="140" cy="100" r="2.4" fill="var(--ink)"/>
            <text x="124" y="88" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">A</text>
            <line x1="158" y1="174" x2="188" y2="174" stroke="var(--ink)" stroke-width="1" marker-end="url(#dsl-fe)"/>
            <line x1="158" y1="174" x2="158" y2="144" stroke="var(--ink)" stroke-width="1" marker-end="url(#dsl-fe)"/>
            <text x="192" y="177" font-size="9.5" font-style="italic" fill="var(--ink)">x</text>
            <text x="154" y="146" font-size="9.5" font-style="italic" text-anchor="end" fill="var(--ink)">y</text>
            <path d="M225.5 165.5 A11 11 0 1 0 205.7 163.8" fill="none" stroke="var(--ink)" stroke-width="1" marker-end="url(#dsl-fe)"/>
            <text x="231" y="152" font-size="10" fill="var(--ink)">+</text>
          </svg>

      - tipo: calcular
        titulo: La velocidad radial
        pregunta: |
          ¿Cuánto vale $\dot{r}$ en $t = 1\ \text{s}$, en m/s?
        respuesta:
          tipo: numero
          valor: '60'
          tolerancia: 0.5
          formato: un número, en m/s
        distractores:
          - valor: '40'
            mensaje: |
              Eso es $r(1) = 60-20$, la **posición**, no su derivada.
              $\dot{r} = 120t - 60t^{2}$.
          - valor: '120'
            mensaje: |
              Te has dejado el término cúbico al derivar:
              $\dot{r} = 120t - 60t^{2}$, y en $t=1$ los dos cuentan.
        pista: |
          Deriva $r = 60t^{2}-20t^{3}$ y evalúa en $t=1$.
        desarrollo: |
          $$
          \dot{r} = 120t - 60t^{2} = 60\ \text{m/s}
          \qquad
          r(1) = 40\ \text{m}
          \qquad
          \ddot{r} = 120 - 120t = 0
          $$

      - tipo: calcular
        titulo: La velocidad transversal
        pregunta: |
          ¿Cuánto vale $r\dot{\theta}$ en $t = 1\ \text{s}$, en m/s?
        respuesta:
          tipo: numero
          valor: '502.65'
          tolerancia: 0.5
          formato: un número, en m/s
        distractores:
          - valor: '160'
            mensaje: |
              Es el valor que imprime la colección, y sale de tomar
              $\dot{\theta} = 4$ rad/s. Con la ley del enunciado,
              $\theta = 2\pi t^{2}$, la derivada es $\dot{\theta} = 4\pi t$, y
              en $t=1$ vale $4\pi = 12{,}57$ rad/s.
          - valor: '251.33'
            mensaje: |
              Te has dejado un factor 2 al derivar: la derivada de
              $2\pi t^{2}$ es $4\pi t$, no $2\pi t$.
        pista: |
          $\dot{\theta} = 4\pi t$, y la componente transversal es
          $r\dot{\theta}$ con $r = 40$ m.
        desarrollo: |
          $$
          \dot{\theta} = 4\pi t = 4\pi\ \text{rad/s}
          \qquad
          r\dot{\theta} = 40 \cdot 4\pi = 160\pi = 502{,}65\ \text{m/s}
          $$

          Como la varilla está según $x$, $v_x = 60$ m/s y
          $v_y = 502{,}65$ m/s.

      - tipo: calcular
        titulo: La aceleración radial
        pregunta: |
          ¿Cuánto vale la componente radial de la aceleración,
          $\ddot{r}-r\dot{\theta}^{2}$, en m/s²?
        respuesta:
          tipo: numero
          valor: '-6316.5'
          tolerancia: 5
          formato: un número, en m/s², con su signo
        distractores:
          - valor: '-640'
            mensaje: |
              Es el valor impreso en la colección, otra vez con
              $\dot{\theta} = 4$ rad/s en lugar de $4\pi$. El cuadrado
              multiplica el error por $\pi^{2}$, casi diez.
          - valor: '0'
            mensaje: |
              Ese es solo $\ddot{r}$, que en $t=1$ se anula. Falta el término
              centrípeto $-r\dot{\theta}^{2}$, que aquí es enorme.
        pista: |
          $\ddot{r} = 0$ en $t=1$, así que queda $-r\dot{\theta}^{2}$ con
          $\dot{\theta} = 4\pi$.
        desarrollo: |
          $$
          a_r = \ddot{r} - r\dot{\theta}^{2} = 0 - 40\,(4\pi)^{2}
          = -640\pi^{2} = -6316{,}5\ \text{m/s}^{2}
          $$

          Y la transversal,
          $a_\theta = r\ddot{\theta} + 2\dot{r}\dot{\theta} = 40\cdot 4\pi +
          2\cdot 60\cdot 4\pi = 640\pi = 2010{,}6\ \text{m/s}^{2}$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'En $t=1$: $r = 40$ m, $\dot{r} = 60$ m/s, $\ddot{r} = 0$, $\dot{\theta} = 4\pi$ rad/s y $\ddot{\theta} = 4\pi$ rad/s².'
          - texto: 'Velocidad: radial $\dot{r} = 60$ m/s y transversal $r\dot{\theta} = 160\pi$ m/s.'
          - texto: 'Aceleración: $a_r = -r\dot{\theta}^{2} = -640\pi^{2}$ y $a_\theta = r\ddot{\theta}+2\dot{r}\dot{\theta} = 640\pi$, en m/s².'
          - texto: La aceleración de la deslizadera respecto de la varilla es $-r\dot{\theta}^{2}$, la centrípeta.
            trampa: true
            mensaje: |
              La centrípeta es de **arrastre**: la nota el punto de la varilla,
              no el observador montado en ella. Para ese observador la
              deslizadera solo recorre una recta, y su aceleración relativa es
              $\ddot{r}$, que en $t=1$ vale 0.
    resolucion: |
      **1. Esquema de velocidades.** Es un punto que corre por una varilla que
      gira: el dibujo lleva la varilla en t = 1 s, su giro y las dos
      componentes de la velocidad de la deslizadera A, sin escala.

      <figure class="figura-examen">
