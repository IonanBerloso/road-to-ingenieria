    pide: La velocidad y la aceleración de la esfera A.
    pasos:
      - tipo: reconocer
        pregunta: |
          Los dos ejes de giro se cortan en E. ¿Qué permite eso?
        opciones:
          - texto: Tomar E como punto fijo del brazo HKG y aplicar el campo desde él
            correcta: true
            mensaje: |
              Eso es. Un punto que está en los dos ejes tiene velocidad nula
              para el conjunto, así que
              $\vec{v}_A = \vec{\omega}\times\overrightarrow{EA}$ sin más
              términos.
          - texto: Sumar los dos giros como escalares, 0,2 + 0,4 = 0,6 rad/s
            mensaje: |
              Los ejes son perpendiculares entre sí, no paralelos: los giros
              se suman como **vectores**, y el módulo sale
              $\sqrt{0{,}2^{2}+0{,}4^{2}}$.
          - texto: Ignorar α₂, porque el brazo HKG gira alrededor de un eje fijo
            mensaje: |
              El eje EH no es fijo: gira con el eje vertical. Y aunque lo
              fuera, α₂ es un dato del enunciado y entra en el campo de
              aceleraciones.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el brazo, con los dos giros
          como vectores sobre sus ejes, el punto E y la esfera A**. Solo las
          direcciones, sin escala.
        comprueba:
          - punto: |
              **$\vec{\omega}_1$ sobre el eje Y y $\vec{\omega}_2$ sobre EH,
              según x.**
            porque: |
              Cada giro va a lo largo de su eje: el eje vertical gira
              alrededor de Y, y el brazo HKG, respecto de EH, alrededor de EH,
              que va en la dirección x.
          - punto: |
              **E, donde se cortan los dos ejes, y la línea de E a A.**
            porque: |
              E está en los dos ejes y ninguno de los dos giros lo mueve;
              desde él, el vector $\overrightarrow{EA}$, que se lee en las
              cotas, es el que entra en los campos.
          - punto: |
              **A por debajo de la línea EHK, a 0,1 m.**
            porque: |
              Si A estuviera sobre EH, el giro $\vec{\omega}_2$ no la movería:
              es esa distancia la que le da velocidad respecto de EH.
