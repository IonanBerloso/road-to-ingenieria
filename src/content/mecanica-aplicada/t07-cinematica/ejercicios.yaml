        <text x="219" y="64" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">v<tspan font-size="7.5" dy="2.5">B</tspan></text>
        <circle cx="102" cy="93.5" r="2.4" fill="var(--ink)"/>
        <text x="98" y="108" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">A</text>
        <circle cx="202" cy="93.5" r="2.4" fill="var(--ink)"/>
        <text x="196" y="86" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">B</text>
        <circle cx="202" cy="153.5" r="2.4" fill="var(--ink)"/>
        <text x="208" y="166" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">C</text>
        <circle cx="220" cy="140" r="2.4" fill="var(--ink)"/>
        <text x="226" y="136" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">D</text>
        <circle cx="177.5" cy="123.3" r="2.4" fill="var(--ink)"/>
        <text x="172" y="136" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">H</text>
        <text x="194" y="114" font-size="9" text-anchor="start" fill="var(--faint)">d</text>
        <text x="68" y="179" font-size="9" text-anchor="start" fill="var(--faint)">x</text>
        <text x="36" y="152" font-size="9" text-anchor="end" fill="var(--faint)">y</text>
        <text x="20" y="192" font-size="9" text-anchor="end" fill="var(--faint)">z</text>
      </svg>
      <figcaption>

      Solo las direcciones, sin escala, en la perspectiva del enunciado. A y D están fijos: el cuadro gira alrededor de AD, y la velocidad angular va sobre ese eje, de D hacia A. B gira alrededor del eje a la distancia d, medida en perpendicular a él, y su velocidad es perpendicular al eje y a esa distancia.

      </figcaption>
      </figure>

      - **El eje.** A y D están fijos: el cuadro solo puede girar alrededor de
        la recta AD. La velocidad angular va sobre ella, de D hacia A, como
        dice el enunciado.
      - **El brazo de B.** B gira alrededor del eje a la distancia d, medida
        en perpendicular a AD; H es el pie de esa perpendicular.
      - **La velocidad de B**, perpendicular al eje y a ese brazo.

      **2. Incógnitas.** El vector $\vec{\omega}$, y $\vec{v}_B$ y
      $\vec{a}_B$.

      **3. Ecuaciones.** Con el origen y los ejes de la figura, en mm:
      $A = (0;\ 120;\ 90)$, $B = (200;\ 120;\ 90)$ y $D = (200;\ 0;\ 0)$. La
      velocidad angular, 75 rad/s por el unitario de D hacia A; y los campos
      de velocidades y de aceleraciones desde A, que está quieto:

      $$
      \vec{\omega} = 75\,\frac{\overrightarrow{DA}}{|\overrightarrow{DA}|},
      \qquad
      \vec{v}_B = \vec{v}_A + \vec{\omega}\times\overrightarrow{AB},
      \qquad
      \vec{a}_B = \vec{a}_A + \vec{\alpha}\times\overrightarrow{AB}
      + \vec{\omega}\times\left(\vec{\omega}\times\overrightarrow{AB}\right)
      $$

      con $\vec{v}_A = \vec{a}_A = \vec{0}$ y $\vec{\alpha} = \vec{0}$: el
      giro es constante en módulo y el eje no cambia de dirección.

      **4. Resultados.** $\overrightarrow{DA} = (-200;\ 120;\ 90)$ mm, de
      módulo 250 mm, y $\overrightarrow{AB} = 0{,}2\,\vec{i}$ m:

      $$
      \vec{\omega} = 75\,(-0{,}8;\ 0{,}48;\ 0{,}36) = -60\,\vec{i} + 36\,\vec{j} + 27\,\vec{k}\ \text{rad/s}
      $$

      $$
      \vec{v}_B = \vec{\omega}\times\overrightarrow{AB} = 5{,}4\,\vec{j} - 7{,}2\,\vec{k}\ \text{m/s},
      \qquad
      |\vec{v}_B| = 9\ \text{m/s}
      $$

      $$
      \vec{a}_B = \vec{\omega}\times\vec{v}_B = -405\,\vec{i} - 432\,\vec{j} - 324\,\vec{k}\ \text{m/s}^{2},
      \qquad
      |\vec{a}_B| = 675\ \text{m/s}^{2}
      $$

      **5. Comprobación.** Por la geometría del giro, sin productos
      vectoriales. El pie de la perpendicular de B al eje está a
      $\overrightarrow{AB}\cdot\vec{u}_{AD} = 200\cdot 0{,}8 = 160$ mm de A:
      $H = (128;\ 43{,}2;\ 32{,}4)$ mm, y el brazo es
      $\overrightarrow{HB} = (72;\ 76{,}8;\ 57{,}6)$ mm, de módulo
      $d = 120$ mm. Entonces

      $$
      |\vec{v}_B| = \omega\,d = 75\cdot 0{,}12 = 9\ \text{m/s},
      \qquad
      \vec{a}_B = -\omega^{2}\,\overrightarrow{HB} = -5625\,(0{,}072;\ 0{,}0768;\ 0{,}0576) = (-405;\ -432;\ -324)\ \text{m/s}^{2}
      $$

      lo mismo, componente a componente.

      **Lo que dice el resultado.** El giro es uniforme y aun así B lleva
      675 m/s², casi 70 veces la gravedad: toda es centrípeta, de B hacia H,
      porque B da vueltas a 9 m/s en una circunferencia de solo 12 cm de
      radio. Y el brazo que cuenta es esa distancia al eje, no los 20 cm de
      AB.

  - id: ejma7-col75-el-disco-en-horquilla-con-dos-giros
    titulo: El disco de una horquilla que gira, y su aceleración angular
    fuente: >-
      Ejercicio 7.5 · Tema 7, «Cinemática del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado
      simbólico, contra el que está contrastado el desarrollo. Las casillas
      piden el número con los valores de prueba que se declaran en cada
      pregunta.
    nivel: practica
    antes:
      idea: |
        Cuando un sólido gira dentro de otro que también gira, su velocidad
        angular es la suma vectorial de los dos giros. La aceleración angular
        es la derivada de ese vector, y la aceleración de cada punto sale del
        campo de aceleraciones del sólido rígido.
      formula: |
        La composición de los giros, la aceleración angular y el campo de
        aceleraciones, con O un punto del sólido:

        $$
        \vec{\omega} = \vec{\omega}_1 + \vec{\omega}_2,
        \qquad
        \vec{\alpha} = \frac{d\vec{\omega}}{dt},
        \qquad
        \vec{a}_P = \vec{a}_O + \vec{\alpha}\times\overrightarrow{OP}
        + \vec{\omega}\times\left(\vec{\omega}\times\overrightarrow{OP}\right)
        $$
      reconocer: |
        Antes de calcular se mira qué le pasa a cada uno de los dos giros
        mientras el conjunto se mueve.
    enunciado: |
      Un disco de radio r gira a una velocidad angular constante ω₂ en torno a
      un eje horizontal Z. La barra vertical en horquilla unida a él tiene una
      velocidad de rotación constante ω₁, respecto al eje Y. Hallar:

      a) Aceleración angular del disco.

      b) Aceleración del punto P cuando θ = 0º.

      c) Aceleración del punto P cuando θ = 90º.

      <figure>
      <svg viewBox="0 0 300 210" role="img" width="300" height="210" aria-labelledby="ma7c5-t ma7c5-d">
        <title id="ma7c5-t">Disco montado en una horquilla vertical, con dos giros</title>
        <desc id="ma7c5-d">Un disco vertical de radio r gira con velocidad angular omega dos alrededor del eje Z, que sale hacia el observador. El disco está montado en una horquilla unida a una barra vertical que gira con velocidad angular omega uno alrededor del eje Y. El punto P está en el borde del disco, formando un ángulo theta con el eje X.</desc>
        <circle cx="150" cy="80" r="52" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.3"/>
        <line x1="150" y1="80" x2="150" y2="14" stroke="var(--ink)" stroke-width="1"/>
        <text x="146" y="11" font-size="10" fill="var(--ink)">Y</text>
        <line x1="150" y1="80" x2="238" y2="80" stroke="var(--ink)" stroke-width="1"/>
        <text x="242" y="83" font-size="10" fill="var(--ink)">X</text>
        <line x1="150" y1="80" x2="96" y2="112" stroke="var(--ink)" stroke-width="1"/>
        <text x="86" y="120" font-size="10" fill="var(--ink)">Z</text>
        <rect x="142" y="78" width="16" height="120" rx="3" fill="var(--d2)" fill-opacity="0.35" stroke="var(--ink)" stroke-width="1.2"/>
        <path d="M132 178 A 22 22 0 0 0 168 186" fill="none" stroke="var(--ink)" stroke-width="1.2"/>
        <text x="172" y="186" font-size="10" fill="var(--ink)">ω₁</text>
        <path d="M112 62 A 40 40 0 0 1 128 44" fill="none" stroke="var(--ink)" stroke-width="1.2"/>
        <text x="98" y="58" font-size="10" fill="var(--ink)">ω₂</text>
        <circle cx="195" cy="53" r="3.2" fill="var(--d1)"/>
        <text x="200" y="48" font-size="10" fill="var(--d1)">P</text>
        <path d="M176 80 A 26 26 0 0 0 170 64" fill="none" stroke="var(--ink)" stroke-width="1"/>
        <text x="176" y="72" font-size="10" fill="var(--ink)">θ</text>
        <line x1="150" y1="80" x2="195" y2="53" stroke="var(--d1)" stroke-width="1" stroke-dasharray="4 3"/>
      </svg>
      </figure>
    pide: La aceleración angular del disco y la aceleración de P en las dos posiciones.
    pasos:
      - tipo: reconocer
        pregunta: |
          Los dos giros son de módulo constante. ¿Por qué la aceleración
          angular del disco no es nula?
        opciones:
          - texto: Porque la horquilla arrastra el eje del disco, y ω₂ cambia de dirección
            correcta: true
            mensaje: |
              Eso es. $\vec{\alpha}$ es la derivada del **vector**
              $\vec{\omega}$, y un vector de módulo constante que gira tiene
              derivada: $\vec{\alpha} = \vec{\omega}_1\times\vec{\omega}_2$.
          - texto: Porque la suma de dos velocidades angulares nunca es constante
            mensaje: |
              Sí puede serlo: si los dos ejes fueran paralelos y fijos, la
              suma sería constante y la aceleración angular, nula. Lo que la
              crea aquí es que un giro **arrastra** al otro.
          - texto: Porque el punto P recorre una circunferencia
            mensaje: |
              Eso explica que P tenga aceleración normal, no que el sólido
              tenga aceleración **angular**. Son cosas distintas: una es del
              punto y la otra, del sólido.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el disco con sus dos giros como
          vectores y el punto P en las dos posiciones que se piden**. Solo las
          direcciones, sin escala.
        comprueba:
          - punto: |
              **$\vec{\omega}_1$ sobre el eje Y y $\vec{\omega}_2$ sobre el eje
              Z, el del disco.**
            porque: |
              Cada velocidad angular es un vector a lo largo de su eje: la
              horquilla gira alrededor de Y y el disco, respecto de ella,
              alrededor de Z.
          - punto: |
              **El eje Z, montado en la horquilla, girando con ella alrededor
              de Y.**
            porque: |
              El disco va en la horquilla: cuando ella gira, se lleva su eje, y
              con él la dirección de $\vec{\omega}_2$, aunque su módulo no
              cambie.
          - punto: |
              **O fijo, y P en el borde: sobre X con θ = 0 y sobre Y con
              θ = 90°.**
            porque: |
              El centro está sobre los dos ejes de giro y no se mueve; θ se
              mide en el plano del disco a partir de X.
        figura: |
          <svg viewBox="54 -10 204 206" role="img" width="204" height="206" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">Esquema de los dos giros del disco de la horquilla</title>
            <desc id="dsl-d">El disco, vertical, en el plano de los ejes X e Y, con su centro O fijo, y la barra de la horquilla bajando desde O. El eje Y, vertical; el eje X, horizontal hacia la derecha; el eje Z, el del disco, en perspectiva hacia abajo a la izquierda, hacia el observador. Sobre Y, por encima del disco, la velocidad angular omega uno de la horquilla. Sobre Z, la velocidad angular omega dos del disco. Junto a la punta de omega dos, una flecha fina curva hacia la derecha: el eje Z, arrastrado por la horquilla, gira alrededor de Y. En el borde del disco, el punto P en sus dos posiciones: sobre X, con theta igual a cero, y arriba, sobre Y, con theta igual a 90 grados.</desc>
            <defs>
              <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
              </marker>
              <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
              </marker>
              <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
