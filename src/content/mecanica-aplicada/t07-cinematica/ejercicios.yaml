    pide: La velocidad angular de la esfera, su EIRD, las componentes de rodadura y pivotamiento, y la velocidad y aceleración de su centro.
    pasos:
      - tipo: reconocer
        pregunta: |
          La esfera toca dos superficies fijas —el plano y el cono— sin
          deslizar. ¿Qué se deduce de ahí?
        opciones:
          - texto: Que el EIRD de la esfera es la recta que une los dos puntos de contacto
            correcta: true
            mensaje: |
              Eso es. Sin deslizamiento contra una superficie fija, el punto
              de contacto tiene velocidad nula; con dos, hay dos puntos de
              velocidad nula y el eje instantáneo es la recta que los une.
          - texto: Que la esfera está en reposo
            mensaje: |
              Tener dos puntos parados no para el sólido: le deja un eje de
              giro. La esfera gira alrededor de la recta AB y su centro se
              mueve.
          - texto: Que la velocidad angular de la esfera es vertical
            mensaje: |
              Sería vertical si los dos contactos estuvieran en una vertical,
              y no lo están: B está debajo del centro y A, en la pared del
              cono. La recta AB está inclinada 60° sobre la horizontal.

      - tipo: calcular
        titulo: La velocidad del centro
        pregunta: |
          Con los valores de prueba $\omega = 4\ \text{rad/s}$ y
          $R = 0{,}5\ \text{m}$, ¿cuánto vale el módulo de $\vec{v}_G$, en
          m/s?
        respuesta:
          tipo: numero
          valor: '1.732'
          tolerancia: 0.01
          formato: un número, en m/s
        distractores:
          - valor: '2'
            mensaje: |
              Has puesto $\omega R$ a secas. La velocidad del centro es
              $(\sqrt{3}/2)\,\omega R$: la esfera gira alrededor de la recta
              AB, y la distancia de G a esa recta no es R.
          - valor: '2.732'
            mensaje: |
              Has usado la distancia del centro al eje del cilindro,
              $(3+\sqrt{3})R/2$, multiplicada por algo que no es su velocidad
              de precesión. El centro avanza a $(\sqrt{3}/2)\omega R$.
        pista: |
          $\vec{v}_G = \vec{\omega}_e \times \overrightarrow{BG}$, con
          $\overrightarrow{BG} = R\vec{k}$ y
          $\vec{\omega}_e = (\omega/2)(0;\ \sqrt{3};\ -1)$.
        desarrollo: |
          $$
          \vec{v}_G = \frac{\sqrt{3}}{2}\,\omega R\,\vec{i}
          = 1{,}732\ \text{m/s}
          $$

          con $\omega = 4$ rad/s y $R = 0{,}5$ m. Va en la dirección
          tangencial: la esfera recorre una circunferencia alrededor del eje
          del cilindro.

      - tipo: calcular
        titulo: La aceleración del centro
        pregunta: |
          Con los mismos valores, ¿cuánto vale el módulo de $\vec{a}_G$, en
          m/s²?
        respuesta:
          tipo: numero
          valor: '2.536'
          tolerancia: 0.02
          formato: un número, en m/s²
        distractores:
          - valor: '0'
            mensaje: |
              El centro recorre una circunferencia alrededor del eje del
              cilindro, así que tiene aceleración centrípeta aunque su
              velocidad sea de módulo constante.
          - valor: '6'
            mensaje: |
              Has usado $\omega^{2}R$ sin el factor $(3-\sqrt{3})/4$. La
              velocidad de precesión del centro no es $\omega$, sino
              $(\sqrt{3}-1)\omega/2$.
        pista: |
          $a_G = \Omega^{2} d$ con $d = (3+\sqrt{3})R/2$ y
          $\Omega = v_G/d$, la velocidad angular con la que G rodea el eje.
        desarrollo: |
          $$
          \Omega = \frac{(\sqrt{3}-1)\,\omega}{2}
          \qquad
          a_G = \Omega^{2}\,\frac{(3+\sqrt{3})R}{2} = (3-\sqrt{3})\,\frac{\omega^{2}R}{4}
          $$

          Con $\omega = 4$ y $R = 0{,}5$: $2{,}536\ \text{m/s}^{2}$, dirigida
          hacia el eje del cilindro.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'El centro G está a $(3+\sqrt{3})R/2$ del eje y a altura R: toca el plano en B, justo debajo, y el cono en A, según la normal a 30°.'
          - texto: 'A y B están fijos y no desliza: el EIRD es la recta AB, de dirección $(0;\ \sqrt{3};\ -1)$, y $\vec{\omega}_e = \lambda(0;\ \sqrt{3};\ -1)$.'
          - texto: La rodadura sobre el cilindro fija $\lambda = \omega/2$, y de ahí $\vec{v}_G = (\sqrt{3}/2)\omega R\,\vec{i}$.
          - texto: Como el plano y el cono están fijos, la esfera no puede girar y solo puede deslizar sobre el cilindro.
            trampa: true
            mensaje: |
              Dos contactos fijos no impiden girar: dejan libre el eje que los
              une. Justamente por eso la esfera rueda —sin deslizar en ninguno
              de los tres contactos— y su centro describe una circunferencia.
    resolucion: |
      **La geometría.** El centro G está a $R$ de altura sobre el plano y a
      $(1+\sqrt{3})R/2 + R = (3+\sqrt{3})R/2$ del eje. El contacto con el
      plano, B, queda justo debajo; el contacto con el cono, A, en la
      dirección de la normal a la pared, que forma 30° con la vertical.

      **a) y b).** El plano y el cono están fijos y la esfera no desliza, así
      que $\vec{v}_A = \vec{v}_B = \vec{0}$: el EIRD es la recta AB, cuya
      dirección es $(0;\ \sqrt{3};\ -1)$. Escribiendo
      $\vec{\omega}_e = \lambda\,(0;\ \sqrt{3};\ -1)$ e imponiendo que en el
      contacto C la esfera lleve la misma velocidad que el cilindro
      —$\omega\,(1+\sqrt{3})R/2$— sale $\lambda = \omega/2$:

      $$
      \vec{\omega}_e = \frac{\sqrt{3}}{2}\,\omega\,\vec{j} - \frac{\omega}{2}\,\vec{k}
      $$

      **c) Rodadura y pivotamiento.** Contra el plano, de normal $\vec{k}$:
      pivotamiento $-(\omega/2)\vec{k}$ y rodadura $(\sqrt{3}/2)\omega\vec{j}$.
      Contra el cono, de normal $(0;\ \sqrt{3}/2;\ 1/2)$: pivotamiento
      $(\omega/2)$ por esa normal, y el resto, rodadura. Contra el cilindro
      hay que restar antes su giro:
      $\vec{\omega}_{rel} = (\sqrt{3}/2)\omega\vec{j} - (3/2)\omega\vec{k}$, y
      con la normal $\vec{j}$ el pivotamiento es $(\sqrt{3}/2)\omega\vec{j}$ y
      la rodadura $-(3/2)\omega\vec{k}$.

      **d) El centro.**

      $$
      \vec{v}_G = \vec{\omega}_e\times\overrightarrow{BG} = \frac{\sqrt{3}}{2}\,\omega R\,\vec{i}
      \qquad
      \vec{a}_G = (3-\sqrt{3})\,\frac{\omega^{2}R}{4}\,\vec{j}
      $$

      **e) La aceleración angular.** El vector $\vec{\omega}_e$ mantiene su
      módulo pero gira con el centro, a $\Omega = (\sqrt{3}-1)\omega/2$:

      $$
      \vec{\alpha}_e = -(3-\sqrt{3})\,\frac{\omega^{2}}{4}\,\vec{i}
      $$

  - id: ejma7-col716-la-esfera-entre-dos-conos
    titulo: La esfera entre dos conos de 30 grados y un plano que la tapa
    fuente: >-
      Ejercicio 7.16 · Tema 7, «Cinemática del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo. Los apartados de
      pivotamiento y rodadura salen exactamente como los imprime la colección;
      en la velocidad angular la colección escribe j donde, con esos mismos
      ejes, corresponde i. Las casillas piden el número con los valores de
      prueba que se declaran en cada pregunta.
    nivel: practica
    enunciado: |
      El sistema mostrado se compone de una pista cónica fija de eje vertical
      y semi-ángulo en el vértice de 30°. Con el mismo eje, se tiene un cono
      de revolución del mismo semi-ángulo que gira con velocidad angular de
      módulo constante (positivo). Entre ambos conos, se dispone una esfera de
      radio R/(2√3). El conjunto se tapa con un plano fijo horizontal.
      Sabiendo que la esfera no desliza en ninguno de sus contactos, calcular:

      a) Velocidad angular de la esfera.

      b) Componentes de pivotamiento y rodadura en el movimiento de la esfera
      relativo al cono móvil. Dibujar los vectores sobre la figura.

      c) Velocidad del punto G y aceleración angular de la esfera.

      <figure>
      <svg viewBox="0 0 300 230" role="img" width="300" height="230" aria-labelledby="ma7c16-t ma7c16-d">
