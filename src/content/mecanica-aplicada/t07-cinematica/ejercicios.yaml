        <desc id="ma7c16-d">Corte por el plano que contiene el eje vertical Z y el eje X. El cono móvil, de semiángulo 30 grados y vértice en O, cuelga del plano horizontal fijo que tapa el conjunto. La pista cónica fija, del mismo semiángulo, lo rodea. Entre los dos, y tocando también el plano, está la esfera de centro G y radio R partido por dos raíz de tres, a media R del eje. Todo está dibujado a escala.</desc>
