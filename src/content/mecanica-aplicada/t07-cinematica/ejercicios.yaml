      <figcaption>

      Solo las direcciones, sin escala. El corte por el plano YZ, con x saliendo del papel. El giro del cono 1, 3ω, y la precesión del cono 2, 2ω, van los dos sobre Z: uno se dibuja por debajo del cono 1 y otro por encima de O. El giro propio del cono 2, σ, va sobre OY; se dibuja según +j y el cálculo dirá su sentido. En P, en la generatriz de contacto, el cono 1 lleva su velocidad perpendicular al corte, entrando en el papel.

      </figcaption>
      </figure>

      - **El cono 1** gira a $3\omega$, constante, alrededor de su eje fijo
        OZ, según +k.
      - **El eje del cono 2**, OY, gira alrededor de Z a $2\omega$, según +k:
        la precesión. El cono 2 gira además alrededor de OY, con un giro
        propio $\sigma$ dibujado según +j; el cálculo dirá su sentido.
      - **O**, el vértice común, no se mueve. Los dos conos tienen
        semiángulo de 45° y se tocan a lo largo de la generatriz
        $(0;\ 1;\ -1)$. En un punto P de ella, $(0;\ y;\ -y)$, el cono 1
        lleva $-3\omega y\,\vec{i}$: hacia dentro del papel.
      - **A**, en $(0;\ R;\ R)$, está en la generatriz de arriba del cono 2.

      **2. Incógnitas.** $\sigma$, y con él $\vec{\omega}_2$; la rodadura y
      el pivotamiento; $\vec{\alpha}_2$; $\vec{a}_A$ y la aceleración de A
      respecto del cono 1.

      **3. Ecuaciones.** El giro del cono 2 y la rodadura en P, con O quieto:

      $$
      \vec{\omega}_2 = 2\omega\,\vec{k} + \sigma\,\vec{j},
      \qquad
      \vec{\omega}_2\times\overrightarrow{OP} = 3\omega\,\vec{k}\times\overrightarrow{OP}
      $$

      El giro relativo, con la normal al plano tangente común, que contiene
      la generatriz y la dirección x: $\vec{n} = (0;\ 1;\ 1)/\sqrt{2}$.

      $$
      \vec{\omega}_{rel} = \vec{\omega}_2 - 3\omega\,\vec{k},
      \qquad
      \vec{\omega}_{piv} = \left(\vec{\omega}_{rel}\cdot\vec{n}\right)\vec{n},
      \qquad
      \vec{\omega}_{rod} = \vec{\omega}_{rel} - \vec{\omega}_{piv}
      $$

      La aceleración angular, con $\sigma$ constante y
      $d\vec{j}/dt = 2\omega\,\vec{k}\times\vec{j}$; A por el campo desde O; y
      A respecto del cono 1, restando lo que pone su giro:

      $$
      \vec{\alpha}_2 = \sigma\,\frac{d\vec{j}}{dt},
      \qquad
      \vec{a}_A = \vec{\alpha}_2\times\overrightarrow{OA}
      + \vec{\omega}_2\times\left(\vec{\omega}_2\times\overrightarrow{OA}\right)
      $$

      $$
      \vec{a}_{A/1} = \vec{a}_A - 3\omega\,\vec{k}\times\left(3\omega\,\vec{k}\times\overrightarrow{OA}\right)
      - 2\cdot 3\omega\,\vec{k}\times\vec{v}_{A/1},
      \qquad
      \vec{v}_{A/1} = \vec{v}_A - 3\omega\,\vec{k}\times\overrightarrow{OA}
      $$

      **4. Resultados.** En P, el cono 2 lleva
      $-(\sigma + 2\omega)\,y\,\vec{i}$ y el cono 1, $-3\omega y\,\vec{i}$:
      $\sigma = \omega$.

      $$
      \vec{\omega}_2 = \omega\,\vec{j} + 2\omega\,\vec{k},
      \qquad
      |\vec{\omega}_2| = \sqrt{5}\,\omega
      $$

      $$
      \vec{\omega}_{rel} = \omega\,\vec{j} - \omega\,\vec{k},
      \qquad
      \vec{\omega}_{rel}\cdot\vec{n} = 0,
      \qquad
      \vec{\omega}_{piv} = \vec{0},
      \qquad
      \vec{\omega}_{rod} = \omega\,\vec{j} - \omega\,\vec{k}
      $$

      La rodadura, de módulo $\sqrt{2}\,\omega$, va a lo largo de la
      generatriz de contacto. La aceleración angular y A, con
      $\vec{v}_A = \vec{\omega}_2\times\overrightarrow{OA} = -\omega R\,\vec{i}$,
      $\vec{\alpha}_2\times\overrightarrow{OA} = (0;\ 2\omega^{2}R;\ -2\omega^{2}R)$
      y $\vec{\omega}_2\times\vec{v}_A = (0;\ -2\omega^{2}R;\ \omega^{2}R)$:

      $$
      \vec{\alpha}_2 = 2\omega\,\vec{k}\times\omega\,\vec{j} = -2\omega^{2}\,\vec{i},
      \qquad
      \vec{a}_A = -\omega^{2}R\,\vec{k}
      $$

      Respecto del cono 1, $\vec{v}_{A/1} = -\omega R\,\vec{i} + 3\omega R\,\vec{i} = 2\omega R\,\vec{i}$,
      el arrastre es $-9\omega^{2}R\,\vec{j}$ y Coriolis,
      $2\cdot 3\omega\,\vec{k}\times 2\omega R\,\vec{i} = 12\omega^{2}R\,\vec{j}$:

      $$
      \vec{a}_{A/1} = -\omega^{2}R\,\vec{k} + 9\omega^{2}R\,\vec{j} - 12\omega^{2}R\,\vec{j}
      = -\omega^{2}R\,\left(3\,\vec{j} + \vec{k}\right),
      \qquad
      |\vec{a}_{A/1}| = \sqrt{10}\,\omega^{2}R
      $$

      Con los valores de prueba de las casillas, $\omega = 5$ rad/s y
      $R = 0{,}2$ m: $\vec{\omega}_2 = 5\,\vec{j} + 10\,\vec{k}$ rad/s y
      $\vec{a}_A = -5\,\vec{k}$ m/s².

      **5. Comprobación.** La aceleración de A, desde unos ejes que giran
      con la precesión, sin $\vec{\alpha}_2$ ni el campo. En esos ejes el
      cono 2 gira a $\omega$ alrededor de OY, que está quieto, y A, a R de
      OY, tiene relativa $-\omega^{2}R\,\vec{k}$ y velocidad
      $\omega\,\vec{j}\times\overrightarrow{OA} = \omega R\,\vec{i}$. El
      arrastre es $-4\omega^{2}R\,\vec{j}$, y Coriolis,
      $2\cdot 2\omega\,\vec{k}\times\omega R\,\vec{i} = 4\omega^{2}R\,\vec{j}$:
      la suma, $-\omega^{2}R\,\vec{k}$, es la misma.

      La aceleración relativa al cono 1, como un movimiento con punto fijo
      visto desde él. Para el cono 1, el cono 2 gira alrededor de O con
      $\vec{\omega}_{rel} = (0;\ \omega;\ -\omega)$, y su aceleración angular
      vista desde el cono 1 es
      $\vec{\alpha}_2 - 3\omega\,\vec{k}\times\vec{\omega}_{rel} = -2\omega^{2}\,\vec{i} + 3\omega^{2}\,\vec{i} = \omega^{2}\,\vec{i}$:

      $$
      \vec{a}_{A/1} = \omega^{2}\,\vec{i}\times\overrightarrow{OA}
      + \vec{\omega}_{rel}\times\left(\vec{\omega}_{rel}\times\overrightarrow{OA}\right)
      = (0;\ -\omega^{2}R;\ \omega^{2}R) + (0;\ -2\omega^{2}R;\ -2\omega^{2}R)
      $$

      que es $-\omega^{2}R\,(3\,\vec{j} + \vec{k})$: también la misma.

      **Lo que dice el resultado.** La aceleración de A es pequeña y
      vertical, $\omega^{2}R$, aunque A tenga dos giros: en y, la tangencial y
      la normal se cancelan. Vista desde el cono 1 es mucho mayor,
      $\sqrt{10}\,\omega^{2}R$, porque ese observador gira a $3\omega$ y ve a
      A moverse a $2\omega R$. Y todo el movimiento relativo es rodadura, sin
      pivotamiento: dos conos del mismo vértice que se tocan a lo largo de
      una generatriz ruedan uno sobre otro como dos engranajes cónicos.
