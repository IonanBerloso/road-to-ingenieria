    pide: La aceleración angular del disco y la aceleración del punto D, el más alto del disco.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál es el punto de referencia más cómodo para la aceleración de D?
        opciones:
          - texto: El centro C del disco, cuya aceleración es la centrípeta de su giro alrededor de Y
            correcta: true
            mensaje: |
              Eso es. C describe una circunferencia alrededor del eje
              vertical, así que su aceleración es
              $-\omega_1^{2}$ por su distancia al eje, y desde ahí se aplica
              el campo de aceleraciones del disco.
          - texto: El origen O, porque está fijo
            mensaje: |
              O está fijo, pero **no pertenece** al disco: el punto del disco
              que pasa por O no tiene velocidad nula. Aplicar el campo desde
              un punto que no es del sólido da un resultado falso.
          - texto: El punto D mismo, tomando su aceleración como nula
            mensaje: |
              D es justamente lo que hay que calcular. Y ningún punto del
              disco está en reposo permanente aquí.

      - tipo: calcular
        titulo: La aceleración angular del disco
        pregunta: |
          ¿Cuánto vale la componente $x$ de $\vec{\alpha}$, en rad/s²?
        respuesta:
          tipo: numero
          valor: '12'
          tolerancia: 0.05
          formato: un número, en rad/s²
        distractores:
          - valor: '0'
            mensaje: |
              Los dos giros son de módulo constante, pero el eje del disco
              gira arrastrado por el brazo: ahí está
              $\vec{\alpha} = \vec{\omega}_1\times\vec{\omega}_2$.
          - valor: '5'
            mensaje: |
              Ese es el módulo de $\vec{\omega} = 3\vec{j}+4\vec{k}$, no de la
              aceleración angular. La aceleración angular es el producto
              vectorial de los dos giros.
        pista: |
          $\vec{\omega}_1 = 3\vec{j}$ y $\vec{\omega}_2 = 4\vec{k}$, porque el
          tramo BC del brazo va en la dirección $z$.
        desarrollo: |
          $$
          \vec{\alpha} = \vec{\omega}_1\times\vec{\omega}_2
          = 3\vec{j}\times 4\vec{k} = 12\,\vec{i}\ \text{rad/s}^{2}
          $$

      - tipo: calcular
        titulo: La componente z de la aceleración de D
        pregunta: |
          ¿Cuánto vale la componente $z$ de $\vec{a}_D$, en m/s²?
        respuesta:
          tipo: numero
          valor: '225'
          tolerancia: 0.5
          formato: un número, en m/s², con su signo
        distractores:
          - valor: '81'
            mensaje: |
              Te has quedado con la centrípeta del brazo,
              $\omega_1^{2}\cdot 9 = 81$, y falta lo que aporta el giro del
              disco sobre su propio eje —tangencial y normal— en el punto D.
          - valor: '144'
            mensaje: |
              Ese es solo el término $2\omega_1\omega_2\,y_D$ del producto
              doble. Hay que sumarle la parte que viene de la posición de C
              respecto del eje vertical.
        pista: |
          $C = (15;\ 8;\ -9)$ m y $\overrightarrow{CD} = 6\vec{j}$, con
          $\vec{a}_C = -\omega_1^{2}(15;\ 0;\ -9)$.
        desarrollo: |
          $$
          \vec{a}_D = \vec{a}_C + \vec{\alpha}\times\overrightarrow{CD}
          + \vec{\omega}\times(\vec{\omega}\times\overrightarrow{CD})
          = -135\,\vec{i} - 96\,\vec{j} + 225\,\vec{k}\ \text{m/s}^{2}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: $\vec{\omega} = 3\vec{j}+4\vec{k}$ y $\vec{\alpha} = \vec{\omega}_1\times\vec{\omega}_2 = 12\vec{i}$ rad/s².
          - texto: 'C gira alrededor del eje Y a 24 m del eje en proyección: $\vec{a}_C = -9\,(15;\ 0;\ -9) = (-135;\ 0;\ 81)$ m/s².'
          - texto: Con $\overrightarrow{CD} = 6\vec{j}$ salen $\vec{\alpha}\times\overrightarrow{CD} = 72\vec{k}$ y $\vec{\omega}\times(\vec{\omega}\times\overrightarrow{CD}) = -96\vec{j}+72\vec{k}$.
          - texto: Como $D$ está en el eje vertical del disco, su aceleración coincide con la de C.
            trampa: true
            mensaje: |
              D no está en ningún eje de giro: está a 6 m del centro del
              disco, y el disco gira. Por eso aparecen los dos términos extra,
              y de hecho $\vec{a}_D$ no se parece nada a $\vec{a}_C$.
    resolucion: |
      **La geometría.** Con el brazo en la posición de la figura,
      $A = (0;\ 8;\ 0)$, $B = (15;\ 8;\ 0)$ y $C = (15;\ 8;\ -9)$ m. El disco
      gira alrededor de BC, que va en la dirección $z$, y el brazo alrededor
      del eje Y:

      $$
      \vec{\omega} = 3\,\vec{j} + 4\,\vec{k}\ \text{rad/s}
      \qquad
      \vec{\alpha} = \vec{\omega}_1\times\vec{\omega}_2 = 12\,\vec{i}\ \text{rad/s}^{2}
      $$

      **La aceleración de C.** Describe una circunferencia alrededor del eje
      vertical, de radio $\sqrt{15^{2}+9^{2}}$:

      $$
      \vec{a}_C = -\omega_1^{2}\,(15;\ 0;\ -9) = (-135;\ 0;\ 81)\ \text{m/s}^{2}
      $$

      **La aceleración de D.** Con $\overrightarrow{CD} = 6\,\vec{j}$:

      $$
      \vec{a}_D = \vec{a}_C + \vec{\alpha}\times\overrightarrow{CD}
      + \vec{\omega}\times(\vec{\omega}\times\overrightarrow{CD})
      = -135\,\vec{i} - 96\,\vec{j} + 225\,\vec{k}\ \text{m/s}^{2}
      $$

      El término $\vec{\alpha}\times\overrightarrow{CD} = 72\vec{k}$ es el que
      se olvida cuando se da por hecho que dos giros constantes no producen
      aceleración angular.

  - id: ejma7-col78-el-brazo-de-robot-y-la-esfera-a
    titulo: El brazo de robot de dos giros con aceleración angular propia
    fuente: >-
      Ejercicio 7.8 · Tema 7, «Cinemática del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      El brazo de robot de la figura mueve la esfera A a través de dos brazos.
      El brazo EH está soldado al eje vertical. El brazo HKG gira alrededor
      del eje EH. Calcular la velocidad y aceleración de A.

      Datos: ω₁ = 0,2 rad/s; α₁ = 0,1 rad/s²; ω₂ = 0,4 rad/s;
      α₂ = 0,3 rad/s².

