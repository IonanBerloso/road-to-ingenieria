      - tipo: calcular
        titulo: La componente y de la velocidad de B
        pregunta: |
          Tomando $A$ como punto del eje, ¿cuánto vale la componente $y$ de
          $\vec{v}_B$, en m/s?
        respuesta:
          tipo: numero
          valor: '5.4'
          tolerancia: 0.02
          formato: un número, en m/s, con su signo
        distractores:
          - valor: '-7.2'
            mensaje: |
              Esa es la componente $z$. Cuidado con el orden de las filas al
              desarrollar el determinante del producto vectorial.
          - valor: '5400'
            mensaje: |
              Has dejado los milímetros sin pasar a metros. AB son 0,2 m, no
              200: el resultado sale mil veces mayor.
        pista: |
          $\overrightarrow{AD} = (200,\ -120,\ -90)$ mm y $|AD| = 250$ mm, así
          que el unitario de D hacia A es $(-0{,}8;\ 0{,}48;\ 0{,}36)$.
        desarrollo: |
          $$
          \vec{\omega} = 75\,(-0{,}8;\ 0{,}48;\ 0{,}36)
          = (-60;\ 36;\ 27)\ \text{rad/s}
          $$

          $$
          \vec{v}_B = \vec{\omega} \times \overrightarrow{AB}
          = (-60;\ 36;\ 27) \times (0{,}2;\ 0;\ 0)
          = 5{,}4\,\vec{j} - 7{,}2\,\vec{k}\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La componente x de la aceleración de B
        pregunta: |
          ¿Cuánto vale la componente $x$ de $\vec{a}_B$, en m/s²?
        respuesta:
          tipo: numero
          valor: '-405'
          tolerancia: 1
          formato: un número, en m/s², con su signo
        distractores:
          - valor: '0'
            mensaje: |
              Que $\vec{\omega}$ sea constante anula la componente tangencial
              $\vec{\alpha}\times\overrightarrow{AB}$, pero no la normal:
              $\vec{\omega}\times\vec{v}_B$ sigue existiendo mientras haya
              giro.
          - valor: '405'
            mensaje: |
              El módulo está bien y el signo no. La aceleración normal apunta
              **hacia** el eje: aquí, hacia las $x$ negativas.
        pista: |
          Con $\vec{\alpha} = \vec{0}$, la aceleración se reduce a
          $\vec{a}_B = \vec{\omega}\times\vec{v}_B$.
        desarrollo: |
          $$
          \vec{a}_B = \vec{\omega}\times\vec{v}_B
          = (-60;\ 36;\ 27)\times(0;\ 5{,}4;\ -7{,}2)
          = -405\,\vec{i} - 432\,\vec{j} - 324\,\vec{k}\ \text{m/s}^{2}
          $$

          De módulo 675 m/s², que es $\omega\,|\vec{v}_B| = 75 \cdot 9$: la
          comprobación rápida de que es una aceleración puramente centrípeta.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'A y D están fijos, así que el sólido gira alrededor del eje AD: $\vec{v}_A = \vec{0}$.'
          - texto: $\vec{\omega} = 75\,\overrightarrow{DA}/|DA| = -60\vec{i}+36\vec{j}+27\vec{k}$ rad/s.
          - texto: $\vec{v}_B = \vec{\omega}\times\overrightarrow{AB} = 5{,}4\vec{j}-7{,}2\vec{k}$ y $\vec{a}_B = \vec{\omega}\times\vec{v}_B$.
          - texto: Como la velocidad angular es constante, la aceleración de B es nula.
            trampa: true
            mensaje: |
              Constante en módulo **y** en dirección, sí: la aceleración
              angular es nula. Pero B describe una circunferencia alrededor
              del eje, y eso pide aceleración centrípeta: 675 m/s².
    resolucion: |
      **1. Esquema de velocidades.** Es un sólido que gira alrededor de un eje
      fijo: el dibujo lleva el eje, la velocidad angular y la dirección de la
      velocidad de B, sin escala.

      <figure class="figura-examen">
      <svg viewBox="10 44 250 150" role="img" width="375" height="225" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">Esquema de velocidades del cuadro de barras que gira alrededor de AD</title>
        <desc id="dsl-d">El cuadro de barras en perspectiva, como en el enunciado: AB según x, BC bajando según y y CD según z hasta D. A y D, fijos, unidos por el eje de giro, a trazos. Sobre la prolongación del eje más allá de A, la velocidad angular omega, apuntando de D hacia A. Desde B, una recta tenue perpendicular al eje que lo corta en H: la distancia d de B al eje. En B, su velocidad, hacia arriba y hacia el fondo, perpendicular al plano que forman el eje y B. Abajo a la izquierda, el triedro x, y, z, con z hacia el observador.</desc>
