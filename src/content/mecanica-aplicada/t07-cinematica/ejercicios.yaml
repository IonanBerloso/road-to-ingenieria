        <text x="219" y="102" font-size="10" fill="var(--ink)">B</text>
        <line x1="66" y1="90" x2="66" y2="170" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="60" y="134" font-size="10" text-anchor="end" fill="var(--faint)">L</text>
        <line x1="110" y1="82" x2="146" y2="85" stroke="var(--d1)" stroke-width="1.4"/>
        <path d="M142 81 L150 85 L142 89 Z" fill="var(--d1)"/>
        <text x="124" y="76" font-size="10" fill="var(--d1)">v</text>
        <circle cx="160" cy="97" r="3.4" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
        <text x="150" y="92" font-size="10" fill="var(--ink)">C</text>
        <line x1="160" y1="97" x2="160" y2="150" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="4 3"/>
        <line x1="160" y1="97" x2="215" y2="162" stroke="var(--ink)" stroke-width="2.2"/>
