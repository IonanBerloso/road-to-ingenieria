      <figcaption>

      Solo las direcciones, sin escala para los vectores. El corte por el plano XZ, con y entrando en el papel. El plano de arriba y la pista, con el vértice abajo, están fijos; el cono móvil cuelga del plano y gira con ω. Cada contacto está sobre la normal común: T encima de G, y M y P a 30° por debajo de la horizontal, porque las paredes de los conos forman 30° con la vertical. En M, el cono lleva su velocidad perpendicular al corte, entrando en el papel.

      </figcaption>
      </figure>

      - **El cono móvil** gira a $\omega$, constante, alrededor de Z, según
        +k; el plano y la pista están quietos.
      - **La esfera**, de radio $r = R/(2\sqrt{3})$, toca el plano en T,
        encima de G; el cono móvil en M y la pista en P, sobre las normales a
        sus paredes, 30° por debajo de la horizontal de G. Que toque las tres
        cosas a la vez fija su posición: G a $R/2$ del eje y a $r$ por debajo
        del plano.
      - **T y P** no tienen velocidad: el plano y la pista están quietos y la
        esfera no desliza. **En M**, la esfera lleva la velocidad del cono,
        perpendicular al corte.

      Con O, el vértice del cono móvil, en el origen, X a la derecha e y
      entrando en el papel: $G = (R/2;\ 0;\ -r)$, $T = (R/2;\ 0;\ 0)$,
      $M = (R/4;\ 0;\ -\sqrt{3}R/4)$ y $P = (3R/4;\ 0;\ -\sqrt{3}R/4)$.

      **2. Incógnitas.** $\vec{\omega}_e$; el pivotamiento y la rodadura
      respecto del cono móvil; $\vec{v}_G$ y $\vec{\alpha}_e$.

      **3. Ecuaciones.** T y P tienen velocidad nula, así que la esfera gira
      sin deslizar alrededor de la recta TP, de dirección
      $(1;\ 0;\ -\sqrt{3})$. En M, la esfera y el cono llevan la misma
      velocidad:

      $$
      \vec{\omega}_e = \lambda\,(1;\ 0;\ -\sqrt{3}),
      \qquad
      \vec{\omega}_e\times\overrightarrow{TM} = \omega\,\vec{k}\times\overrightarrow{OM}
      $$

      El movimiento relativo al cono, con la normal en M,
      $\vec{n} = (\sqrt{3}/2;\ 0;\ 1/2)$:

      $$
      \vec{\omega}_{rel} = \vec{\omega}_e - \omega\,\vec{k},
      \qquad
      \vec{\omega}_{piv} = \left(\vec{\omega}_{rel}\cdot\vec{n}\right)\vec{n},
      \qquad
      \vec{\omega}_{rod} = \vec{\omega}_{rel} - \vec{\omega}_{piv}
      $$

      El centro, desde T; y como toda la figura gira alrededor de Z con G, a
      $\Omega$, G recorre una circunferencia de radio $R/2$ y
      $\vec{\omega}_e$ tiene componentes fijas en unos ejes que giran con él:

      $$
      \vec{v}_G = \vec{\omega}_e\times\overrightarrow{TG},
      \qquad
      \Omega = \frac{v_G}{R/2},
      \qquad
      \vec{\alpha}_e = \Omega\,\vec{k}\times\vec{\omega}_e
      $$

      **4. Resultados.** Con
      $\overrightarrow{TM} = (-R/4;\ 0;\ -\sqrt{3}R/4)$, la esfera lleva en M
      $\lambda\,(\sqrt{3}R/2)\,\vec{j}$ y el cono $\omega R/4\,\vec{j}$:
      $\lambda = \sqrt{3}\,\omega/6$.

      $$
      \vec{\omega}_e = \frac{\sqrt{3}\,\omega}{6}\,\vec{i} - \frac{\omega}{2}\,\vec{k},
      \qquad
      |\vec{\omega}_e| = \frac{\omega}{\sqrt{3}}
      $$

      Respecto del cono móvil,
      $\vec{\omega}_{rel} = \frac{\sqrt{3}\,\omega}{6}\,\vec{i} - \frac{3\omega}{2}\,\vec{k}$
      y $\vec{\omega}_{rel}\cdot\vec{n} = -\omega/2$:

      $$
      \vec{\omega}_{piv} = -\frac{\omega}{2}\left(\frac{\sqrt{3}}{2}\,\vec{i}+\frac{1}{2}\,\vec{k}\right),
      \qquad
      \vec{\omega}_{rod} = \frac{5\omega}{2}\left(\frac{\sqrt{3}}{6}\,\vec{i}-\frac{1}{2}\,\vec{k}\right)
      $$

      de módulos $\omega/2$ y $5\omega/(2\sqrt{3}) = 1{,}443\,\omega$. Las dos
      coinciden con las impresas en la colección. Sobre la figura, como pide
      el apartado b:

