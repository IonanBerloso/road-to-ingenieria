    pide: La velocidad y aceleración angulares del cono 2, sus componentes de rodadura y pivotamiento, y la aceleración de A absoluta y relativa al cono 1.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿A lo largo de qué recta se tocan los dos conos?
        opciones:
          - texto: De la generatriz que baja a 45°, la que comparten los dos conos
            correcta: true
            mensaje: |
              Eso es. Los dos tienen el vértice en O y semiángulo 45°, así que
              comparten la generatriz $(0;\ 1;\ -1)$, y el contacto es esa
              recta entera.
          - texto: De la generatriz que pasa por A, $(0;\ 1;\ 1)$
            mensaje: |
              Esa es la generatriz **superior** del cono 2, donde está A. El
              cono 1 abre hacia abajo, así que la común es la de bajada.
          - texto: Solo en el vértice O
            mensaje: |
              En el vértice coinciden, pero el contacto no es puntual: dos
              conos del mismo vértice cuyos ejes forman 90°, la suma de sus
              semiángulos de 45°, se tocan a lo largo de toda una generatriz.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el corte por el plano YZ, con
          los dos conos, sus giros como vectores, la generatriz de contacto y
          la velocidad del cono 1 en un punto P de ella**. Solo las
          direcciones, sin escala.
        comprueba:
          - punto: |
              **El giro del cono 1, $3\omega$, y la precesión del cono 2,
              $2\omega$, los dos sobre Z; el giro propio del cono 2, sobre
              OY.**
            porque: |
              El cono 1 gira alrededor de su eje, OZ; el eje del cono 2, OY,
              gira alrededor de Z a $2\omega$, y el cono gira además alrededor
              de OY, con el sentido aún por saber.
          - punto: |
              **La generatriz de contacto, la que baja a 45°, y A en la
              generatriz de arriba del cono 2.**
            porque: |
              Los dos conos tienen el vértice en O y semiángulo de 45°:
              comparten la generatriz $(0;\ 1;\ -1)$. A, en $(0;\ R;\ R)$, está
              en la de arriba.
          - punto: |
              **En P, la velocidad del cono 1, perpendicular al papel, hacia
              dentro.**
            porque: |
              El cono 1 gira alrededor de Z: sus puntos se mueven en
              horizontal, perpendiculares al plano YZ, y con x saliendo del
              papel, los de y positiva entran en él.
