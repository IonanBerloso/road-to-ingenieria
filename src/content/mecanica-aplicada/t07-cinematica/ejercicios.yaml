      <figcaption>

      Solo las direcciones, sin escala para los vectores. La velocidad angular del eje vertical, ω₁, va sobre Y; la del brazo HKG respecto de EH, ω₂, sobre EH, según x: se dibuja como vector libre, por encima del brazo, para que no lo tape. Los dos sentidos, +j y +i, son los que toma la colección. E está en los dos ejes; la línea tenue va de E a la esfera A.

      </figcaption>
      </figure>

      - **El eje vertical**, con el brazo EH soldado a él, gira a
        $\omega_1 = 0{,}2$ rad/s alrededor de Y, que es fijo, con
        $\alpha_1 = 0{,}1$ rad/s².
      - **El brazo HKG** gira respecto de EH a $\omega_2 = 0{,}4$ rad/s
        alrededor de EH, según x, con $\alpha_2 = 0{,}3$ rad/s². Los dos
        sentidos, +j y +i, son los que toma la colección.
      - **EH** es parte del eje vertical: su dirección gira alrededor de Y.
      - **E** está en los dos ejes: ninguno de los dos giros lo mueve, y es
        punto fijo del brazo HKG. **A** está, según las cotas, en
        $\overrightarrow{EA} = (0{,}7;\ -0{,}1;\ 0)$ m.

      **2. Incógnitas.** $\vec{v}_A$ y $\vec{a}_A$, y de camino
      $\vec{\omega}$ y $\vec{\alpha}$ del brazo HKG.

      **3. Ecuaciones.** Los giros y la aceleración angular, con
      $d\vec{i}/dt = \vec{\omega}_1\times\vec{i}$ porque EH gira con el eje
      vertical:

      $$
      \vec{\omega} = \omega_2\,\vec{i} + \omega_1\,\vec{j},
      \qquad
      \vec{\alpha} = \alpha_2\,\vec{i} + \alpha_1\,\vec{j}
      + \omega_2\,\frac{d\vec{i}}{dt}
      = \alpha_2\,\vec{i} + \alpha_1\,\vec{j} + \vec{\omega}_1\times\vec{\omega}_2
      $$

      Y los dos campos desde E, que está quieto:

      $$
      \vec{v}_A = \vec{\omega}\times\overrightarrow{EA},
      \qquad
      \vec{a}_A = \vec{\alpha}\times\overrightarrow{EA}
      + \vec{\omega}\times\vec{v}_A
      $$

      **4. Resultados.** Con
      $\vec{\omega}_1\times\vec{\omega}_2 = 0{,}2\,\vec{j}\times 0{,}4\,\vec{i} = -0{,}08\,\vec{k}$:

      $$
      \vec{\omega} = (0{,}4;\ 0{,}2;\ 0)\ \text{rad/s},
      \qquad
      \vec{\alpha} = (0{,}3;\ 0{,}1;\ -0{,}08)\ \text{rad/s}^{2}
      $$

      $$
      \vec{v}_A = (0{,}4;\ 0{,}2;\ 0)\times(0{,}7;\ -0{,}1;\ 0)
      = -0{,}18\,\vec{k}\ \text{m/s}
      $$

      Con $\vec{\alpha}\times\overrightarrow{EA} = (-0{,}008;\ -0{,}056;\ -0{,}1)$
      y $\vec{\omega}\times\vec{v}_A = (-0{,}036;\ 0{,}072;\ 0)$:

      $$
      \vec{a}_A = -0{,}044\,\vec{i} + 0{,}016\,\vec{j} - 0{,}1\,\vec{k}\ \text{m/s}^{2},
      \qquad
      |\vec{a}_A| = 0{,}110\ \text{m/s}^{2}
      $$

      **5. Comprobación.** Por la composición de movimientos, que no se ha
      usado: el eje vertical con EH arrastra, y HKG gira respecto de él
      alrededor de EH, que en ese sistema es un eje fijo. En velocidades,
      arrastre $\vec{\omega}_1\times\overrightarrow{EA} = -0{,}14\,\vec{k}$ y
      relativa $\vec{\omega}_2\times\overrightarrow{EA} = -0{,}04\,\vec{k}$:
      suman $-0{,}18\,\vec{k}$. En aceleraciones, el arrastre es el de un
      punto que gira alrededor de Y,
      $\vec{\alpha}_1\times\overrightarrow{EA} + \vec{\omega}_1\times(\vec{\omega}_1\times\overrightarrow{EA}) = (-0{,}028;\ 0;\ -0{,}07)$;
      la relativa, la de un punto que gira alrededor de EH,
      $\vec{\alpha}_2\times\overrightarrow{EA} + \vec{\omega}_2\times\vec{v}_{\text{rel}} = (0;\ 0{,}016;\ -0{,}03)$;
      y Coriolis:

      $$
      2\,\vec{\omega}_1\times\vec{v}_{\text{rel}} = 2\cdot 0{,}2\,\vec{j}\times\left(-0{,}04\,\vec{k}\right) = -0{,}016\,\vec{i}
      $$

      La suma, $(-0{,}044;\ 0{,}016;\ -0{,}1)$ m/s², es la misma.

      **Lo que dice el resultado.** La velocidad de A va entera según −z,
      perpendicular al plano del brazo: 0,14 m/s los pone el eje vertical,
      por los 0,7 m a los que está A del eje Y, y 0,04 el giro de HKG, por
      los 0,1 m a los que está A por debajo de EH. En la aceleración, el
      término $\vec{\omega}_1\times\vec{\omega}_2$ no toca la componente z,
      pero sí las otras dos: sin él saldría $(-0{,}036;\ 0{,}072;\ -0{,}1)$
      m/s², con la componente y cuatro veces y media mayor. En la
      comprobación, todo lo que mezcla los dos giros queda en un solo
      término, el de Coriolis.

  - id: ejma7-col79-la-placa-articulada-en-ab
    titulo: La placa cuadrada articulada en AB, con giro acelerado del eje
    fuente: >-
      Ejercicio 7.9 · Tema 7, «Cinemática del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    antes:
      idea: |
        La placa tiene dos giros: el del eje vertical, que se lleva el eje AB,
        y el suyo propio alrededor de AB. Su velocidad angular es la suma
        vectorial de los dos, su aceleración angular es la derivada de esa
        suma, y los campos de velocidades y de aceleraciones dan las de C
        desde otro punto de la placa.
      formula: |
        La composición de los giros, la aceleración angular y los dos campos,
        con P y C dos puntos de la placa:

        $$
        \vec{\omega} = \vec{\omega}_1 + \vec{\omega}_2,
        \qquad
        \vec{\alpha} = \frac{d\vec{\omega}}{dt}
        $$

        $$
        \vec{v}_C = \vec{v}_P + \vec{\omega}\times\overrightarrow{PC},
        \qquad
        \vec{a}_C = \vec{a}_P + \vec{\alpha}\times\overrightarrow{PC}
        + \vec{\omega}\times\left(\vec{\omega}\times\overrightarrow{PC}\right)
        $$
      reconocer: |
        Antes de calcular se mira cómo se mueve cada parte: el eje vertical,
        el eje AB y la placa.
    enunciado: |
      Una placa cuadrada de 450 mm de lado está articulada en los puntos A y
      B. La placa gira a velocidad angular constante ω₂ = 4 rad/s respecto al
      eje AB y éste tiene una velocidad angular ω₁ = 3 rad/s y una aceleración
      angular α₁ = 2 rad/s² respecto al eje Y. En el instante mostrado,
      calcular:

      a) Aceleración angular de la placa.

      b) Velocidad y aceleración del punto C.

      <figure>
      <svg viewBox="0 0 300 190" role="img" width="300" height="190" aria-labelledby="ma7c9-t ma7c9-d">
