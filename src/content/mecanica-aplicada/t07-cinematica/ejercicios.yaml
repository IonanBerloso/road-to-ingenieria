      <figcaption>

      Solo las direcciones, sin escala. El plano de frente en ωt = π/2, cuando es el plano YZ, con x saliendo del papel. Respecto del plano, C avanza por AB a v, alejándose de A, y M recorre la barra hacia C a v; la barra gira alrededor del pasador con ω, antihoraria, y en este instante está horizontal: se dibuja justo por debajo de AB para que no la tape. El punto del plano que coincide con C, a L del eje, se mueve perpendicular al plano, entrando en el papel.

      </figcaption>
      </figure>

      - **El plano** gira a $\omega$, constante, alrededor de OZ, según +k.
        En $\omega t = \pi/2$ es el plano YZ, con x saliendo del papel.
      - **AB** está soldado al eje vertical a la altura L: gira con el plano.
      - **La deslizadera C** avanza por AB, alejándose de A, a $v$ constante
        respecto del plano, y está a $AC = L$.
      - **La barra CD** gira respecto del plano alrededor de C a $\omega$,
        según la normal, +x, antihoraria en el dibujo; ha girado 90° desde la
        vertical y está horizontal, hacia B.
      - **M** está en C y recorre la barra hacia C a $v$ constante.

      Con O en el suelo, sobre el eje: $A = (0;\ 0;\ L)$ y
      $C = (0;\ L;\ L)$.

      **2. Incógnitas.** $\vec{\omega}_{AB}$, $\vec{\alpha}_{AB}$,
      $\vec{\omega}_{CD}$, $\vec{\alpha}_{CD}$ y $\vec{a}_M$.

      **3. Ecuaciones.** AB es parte del plano. CD gira además respecto de
      él, según $\vec{i}$, la normal, que gira con el plano:
      $d\vec{i}/dt = \omega\,\vec{k}\times\vec{i}$.

      $$
      \vec{\omega}_{AB} = \omega\,\vec{k},
      \qquad
      \vec{\omega}_{CD} = \omega\,\vec{k} + \omega\,\vec{i},
      \qquad
      \vec{\alpha}_{CD} = \omega\,\frac{d\vec{i}}{dt} = \omega\,\vec{k}\times\omega\,\vec{i}
      $$

      M, por composición con el plano. El arrastre es el del punto del plano
      que coincide con M; la velocidad relativa, la de C sobre AB más la de M
      sobre la barra; y la aceleración relativa, en polares alrededor de C,
      que dentro del plano va a velocidad constante, con $r = CM = 0$,
      $\dot r = -v$ y $\dot\theta = \omega$:

      $$
      \vec{a}_M = \omega\,\vec{k}\times\left(\omega\,\vec{k}\times\overrightarrow{OM}\right)
      + \vec{a}_{M/\pi} + 2\,\omega\,\vec{k}\times\vec{v}_{M/\pi},
      \qquad
      \vec{v}_{M/\pi} = v\,\vec{j} - v\,\vec{j}
      $$

      $$
      \vec{a}_{M/\pi} = \left(\ddot r - r\,\dot\theta^{2}\right)\vec{e}_r
      + \left(2\,\dot r\,\dot\theta + r\,\ddot\theta\right)\vec{e}_\theta
      $$

      con $\vec{e}_r = \vec{j}$, a lo largo de la barra, y
      $\vec{e}_\theta = \vec{k}$, hacia donde la hace girar $\omega$.

      **4. Resultados.**

      $$
      \vec{\omega}_{AB} = \omega\,\vec{k},
      \qquad
      \vec{\alpha}_{AB} = \vec{0},
      \qquad
      \vec{\omega}_{CD} = \omega\,\vec{i} + \omega\,\vec{k},
      \qquad
      \vec{\alpha}_{CD} = \omega^{2}\,\vec{j}
      $$

      con $|\vec{\omega}_{CD}| = \sqrt{2}\,\omega$. La velocidad de M
      respecto del plano es nula, así que Coriolis con el plano también; el
      arrastre es la centrípeta de un punto a L del eje,
      $-\omega^{2}L\,\vec{j}$; y la relativa,
      $2\,(-v)\,\omega\,\vec{k} = -2\omega v\,\vec{k}$:

      $$
      \vec{a}_M = -\omega^{2}L\,\vec{j} - 2\omega v\,\vec{k},
      \qquad
      |\vec{a}_M| = \omega\sqrt{\omega^{2}L^{2} + 4v^{2}}
      $$

      Con los valores de prueba de las casillas, $\omega = 3$ rad/s,
      $v = 2$ m/s y $L = 1$ m: $\vec{\alpha}_{CD} = 9\,\vec{j}$ rad/s² y
      $\vec{a}_M = -9\,\vec{j} - 12\,\vec{k}$ m/s².

      **5. Comprobación.** Derivando dos veces la posición de M en ejes
      fijos, sin composición. Con $\vec{u} = (\cos\omega t;\ \sin\omega t;\ 0)$,
      la horizontal del plano, y
      $\vec{e} = \sin\omega t\,\vec{u} - \cos\omega t\,\vec{k}$, la dirección
      de la barra:

      $$
      \overrightarrow{OM} = L\,\vec{k} + s\,\vec{u} + r\,\vec{e},
      \qquad
      \dot s = v,
      \qquad
      \dot r = -v
      $$

      En el instante, $s = L$, $r = 0$, $\vec{u} = \vec{e} = \vec{j}$,
      $\dot{\vec{u}} = -\omega\,\vec{i}$, $\ddot{\vec{u}} = -\omega^{2}\,\vec{j}$
      y $\dot{\vec{e}} = \omega\,\vec{k} - \omega\,\vec{i}$:

      $$
      \vec{a}_M = 2\dot s\,\dot{\vec{u}} + s\,\ddot{\vec{u}} + 2\dot r\,\dot{\vec{e}}
      = -2\omega v\,\vec{i} - \omega^{2}L\,\vec{j} - 2v\left(\omega\,\vec{k} - \omega\,\vec{i}\right)
      = -\omega^{2}L\,\vec{j} - 2\omega v\,\vec{k}
      $$

      lo mismo. Una derivación numérica de la posición de M lo confirma
      también, y muestra lo sensible que es al sentido de las velocidades
      relativas: si M se alejara de C, aparecería $-4\omega v\,\vec{i}$,
      perpendicular al plano.

      **Lo que dice el resultado.** Que M esté quieta respecto del plano en
      ese instante no la deja sin aceleración relativa: la barra gira bajo
      ella, y M, que la recorre, se acelera hacia abajo, $-2\omega v$. La
      parte horizontal es la centrípeta de un punto a L del eje. Y M y C,
      que ocupan el mismo sitio, no tienen la misma aceleración: C lleva
      además el Coriolis de deslizar por AB, $-2\omega v\,\vec{i}$, que en
      M se cancela con el de la barra.

  - id: ejma7-col719-el-cono-que-rueda-sobre-otro-cono
    titulo: El cono que rueda sin deslizar sobre otro cono que gira
    fuente: >-
      Ejercicio 7.19 · Tema 7, «Cinemática del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo. Las casillas piden el
      número con los valores de prueba que se declaran en cada pregunta.
    nivel: practica
    antes:
      idea: |
        El cono 2 tiene dos giros: la precesión de su eje alrededor de Z y el
        giro propio alrededor de ese eje; su velocidad angular es la suma
        vectorial de los dos. Rodar sin deslizar sobre otro sólido es que, en
        el contacto, los dos lleven la misma velocidad, y el giro relativo se
        descompone en pivotamiento, según la normal, y rodadura, en el plano
        tangente.
      formula: |
        La composición de los giros, con $\vec{u}$ el eje del cono, y la
        descomposición del giro relativo con $\vec{n}$ la normal común:

        $$
        \vec{\omega}_2 = \vec{\omega}_{\text{prec}} + \omega_s\,\vec{u},
        \qquad
        \vec{\omega}_{rel} = \vec{\omega}_2 - \vec{\omega}_1,
        \qquad
        \vec{\omega}_{piv} = \left(\vec{\omega}_{rel}\cdot\vec{n}\right)\vec{n}
        $$

        El campo de aceleraciones desde un punto fijo O, y la composición de
        aceleraciones con $\vec{\omega}$ el giro del sólido que arrastra:

        $$
        \vec{a}_P = \vec{\alpha}\times\overrightarrow{OP}
        + \vec{\omega}\times\left(\vec{\omega}\times\overrightarrow{OP}\right),
        \qquad
        \vec{a} = \vec{a}_{\text{arr}} + \vec{a}_{\text{rel}} + 2\,\vec{\omega}\times\vec{v}_{\text{rel}}
        $$
      reconocer: |
        Antes de calcular se mira cómo se mueve cada cono: el 1 alrededor de
        su eje, y el 2 con su eje girando alrededor de Z.
    enunciado: |
      El cono (1) gira alrededor de su eje fijo OZ con velocidad angular
      constante y positiva 3ω. Otro cono (2) rueda sin deslizar sobre el
      anterior de forma que su eje OY gira con velocidad angular constante,
      también positiva, 2ω y también alrededor del eje OZ. Calcular:

      a) Velocidad angular del cono (2).

      b) Componentes de rodadura y pivotamiento en el movimiento del cono (2)
      sobre (1).

      c) Aceleración angular absoluta del cono (2).

      d) Aceleración absoluta del punto A (0; R; R).

      e) Aceleración del punto A del cono 2 respecto al cono (1).

      <figure>
      <svg viewBox="0 0 300 200" role="img" width="300" height="200" aria-labelledby="ma7c19-t ma7c19-d">
