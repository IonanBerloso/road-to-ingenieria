        <desc id="dsl-d">La placa en la perspectiva del enunciado: el eje vertical sube por Y desde O, el punto medio de AB; el eje AB va según z, y la placa cuadrada cuelga de él inclinada 20 grados por debajo de la horizontal, con C en el centro del lado opuesto. Sobre el eje Y, por encima del eje vertical, la velocidad angular omega uno, hacia arriba. Sobre la recta de AB, más allá de A, la velocidad angular omega dos de la placa respecto del eje, según z. Una línea tenue une O con C.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M64.7 99.7 L115.3 60.3 L221 98.8 L170.4 138.2 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <line x1="90" y1="80" x2="90" y2="40" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
        <line x1="64.7" y1="99.7" x2="115.3" y2="60.3" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
        <line x1="90" y1="80" x2="90" y2="4" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="90" y1="80" x2="250" y2="80" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="90" y1="80" x2="25.6" y2="130.8" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="90" y1="80" x2="195.7" y2="118.5" stroke="var(--faint)" stroke-width="0.7"/>
        <path d="M118.2 90.3 A30 30 0 0 0 120 80" fill="none" stroke="var(--ink)" stroke-width="0.9"/>
        <text x="124" y="95" font-size="10" fill="var(--ink)">20°</text>
        <line x1="90" y1="34" x2="90" y2="8" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="96" y="16" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">ω<tspan font-size="7.5" dy="2.5">1</tspan><tspan dy="-2.5"></tspan></text>
        <line x1="56.9" y1="105.9" x2="37" y2="121.5" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="46" y="133" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">ω<tspan font-size="7.5" dy="2.5">2</tspan><tspan dy="-2.5"></tspan></text>
        <circle cx="90" cy="80" r="2.4" fill="var(--ink)"/>
