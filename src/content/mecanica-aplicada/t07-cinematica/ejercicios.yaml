        <text x="212" y="140" font-size="9" fill="var(--faint)">225 + 225 mm</text>
      </svg>
      </figure>
    pide: La aceleración angular de la placa y la velocidad y aceleración del punto C.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué dos sumandos tiene aquí la aceleración angular de la placa?
        opciones:
          - texto: La α₁ del eje y el término $\vec{\omega}_1\times\vec{\omega}_2$ del arrastre
            correcta: true
            mensaje: |
              Eso es. ω₂ es constante en módulo pero su eje gira, y eso aporta
              $\vec{\omega}_1\times\vec{\omega}_2$; α₁ es la otra mitad.
          - texto: Solo α₁, porque ω₂ es constante
            mensaje: |
              Constante en módulo, pero no en dirección: el eje AB gira
              arrastrado por el eje vertical. Sin ese término la componente
              $x$ de $\vec{\alpha}$ se pierde entera.
          - texto: Solo $\vec{\omega}_1\times\vec{\omega}_2$, porque α₁ es del eje y no de la placa
            mensaje: |
              La placa está montada sobre el eje: todo lo que acelera el eje
              acelera también a la placa. Los dos sumandos cuentan.

      - tipo: calcular
        titulo: La aceleración angular de la placa
        pregunta: |
          ¿Cuánto vale la componente $x$ de $\vec{\alpha}$, en rad/s²?
        respuesta:
          tipo: numero
          valor: '12'
          tolerancia: 0.05
          formato: un número, en rad/s²
        distractores:
          - valor: '2'
            mensaje: |
              Esa es la componente $y$, que es α₁. La componente $x$ sale del
              producto $\vec{\omega}_1\times\vec{\omega}_2 = 3\vec{j}\times
              4\vec{k}$.
          - valor: '0'
            mensaje: |
              Ese sería el resultado si el eje AB no girase. Como gira, el
              vector ω₂ cambia de dirección y aparece
              $\vec{\omega}_1\times\vec{\omega}_2 = 12\vec{i}$.
        pista: |
          $\vec{\omega}_1 = 3\vec{j}$, $\vec{\omega}_2 = 4\vec{k}$ y
          $\vec{\alpha}_1 = 2\vec{j}$.
        desarrollo: |
          $$
          \vec{\alpha} = \vec{\alpha}_1 + \vec{\omega}_1\times\vec{\omega}_2
          = 12\,\vec{i} + 2\,\vec{j}\ \text{rad/s}^{2}
          $$

      - tipo: calcular
        titulo: La velocidad de C
        pregunta: |
          ¿Cuánto vale la componente $y$ de $\vec{v}_C$, en m/s?
        respuesta:
          tipo: numero
          valor: '1.691'
          tolerancia: 0.005
          formato: un número, en m/s, con su signo
        distractores:
          - valor: '1.269'
            mensaje: |
              Ese es el módulo de la componente $z$, y con el signo cambiado
              además. Cuidado con el orden de las componentes al desarrollar
              el producto vectorial.
          - valor: '1.8'
            mensaje: |
              Has usado 0,45 m como distancia horizontal de C al eje. La placa
              está inclinada 20°, así que la proyección horizontal es
              $0{,}45\cos 20^\circ = 0{,}423$ m.
        pista: |
          $O$ es punto fijo y
          $\overrightarrow{OC} = 0{,}45(\cos 20^\circ;\ -\sin 20^\circ;\ 0)$ m.
        desarrollo: |
          $$
          \vec{v}_C = \vec{\omega}\times\overrightarrow{OC}
          = (0;\ 3;\ 4)\times(0{,}423;\ -0{,}154;\ 0)
          = 0{,}616\,\vec{i} + 1{,}691\,\vec{j} - 1{,}269\,\vec{k}\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La aceleración de C
        pregunta: |
          ¿Cuánto vale la componente $x$ de $\vec{a}_C$, en m/s²?
        respuesta:
          tipo: numero
          valor: '-10.57'
          tolerancia: 0.03
          formato: un número, en m/s², con su signo
        distractores:
          - valor: '-3.81'
            mensaje: |
              Has usado solo $-\omega_1^{2}$ por la distancia al eje vertical.
              El giro de la placa alrededor de AB añade su propia centrípeta,
              y las dos van en el mismo sentido.
          - valor: '10.57'
            mensaje: |
              El módulo está bien y el signo no: la aceleración apunta hacia
              los ejes de giro, es decir, hacia las $x$ negativas.
        pista: |
          $\vec{a}_C = \vec{\alpha}\times\overrightarrow{OC} +
          \vec{\omega}\times\vec{v}_C$.
        desarrollo: |
          $$
          \vec{a}_C = -10{,}57\,\vec{i} + 2{,}46\,\vec{j} - 4{,}54\,\vec{k}\ \text{m/s}^{2}
          $$

          La componente $x$ es $-25\,x_C$: los dos giros, de 3 y 4 rad/s,
          suman $3^{2}+4^{2} = 25$ sobre la distancia $x_C = 0{,}423$ m.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'El eje AB va según $z$ y O es punto fijo: $\vec{\omega} = 3\vec{j}+4\vec{k}$ rad/s.'
          - texto: $\vec{\alpha} = 2\vec{j} + 3\vec{j}\times 4\vec{k} = 12\vec{i}+2\vec{j}$ rad/s².
          - texto: 'Con $\overrightarrow{OC} = (0{,}423;\ -0{,}154;\ 0)$ m: $\vec{v}_C = \vec{\omega}\times\overrightarrow{OC}$ y $\vec{a}_C = \vec{\alpha}\times\overrightarrow{OC}+\vec{\omega}\times\vec{v}_C$.'
          - texto: Como C está en el borde opuesto a AB, su distancia al eje de giro es el lado de la placa, 450 mm.
            trampa: true
            mensaje: |
              450 mm es la distancia **medida sobre la placa**, que está
              inclinada 20°. Las coordenadas de C son
              $0{,}45\cos 20^\circ$ en $x$ y $-0{,}45\sin 20^\circ$ en $y$, y
              ese seno es justo lo que hace aparecer la componente $y$ de la
              aceleración.
    resolucion: |
      **Velocidad angular.** La placa gira alrededor de AB —dirección $z$— y
      el eje AB, alrededor de $Y$:

      $$
      \vec{\omega} = 3\,\vec{j} + 4\,\vec{k}\ \text{rad/s}
      $$

      **Aceleración angular.** Dos sumandos: la del eje y la de Resal, porque
      el eje AB arrastra a $\vec{\omega}_2$:

      $$
      \vec{\alpha} = 2\,\vec{j} + \vec{\omega}_1\times\vec{\omega}_2
      = 12\,\vec{i} + 2\,\vec{j}\ \text{rad/s}^{2}
      $$

      **El punto C.** Está en el centro del lado opuesto, a 450 mm de AB
      medidos sobre la placa, que forma 20° con la horizontal:

      $$
      \overrightarrow{OC} = (0{,}4229;\ -0{,}1539;\ 0)\ \text{m}
      $$

      $$
      \vec{v}_C = \vec{\omega}\times\overrightarrow{OC}
      = 0{,}616\,\vec{i} + 1{,}691\,\vec{j} - 1{,}269\,\vec{k}\ \text{m/s}
      $$

      $$
      \vec{a}_C = \vec{\alpha}\times\overrightarrow{OC} + \vec{\omega}\times\vec{v}_C
      = -10{,}57\,\vec{i} + 2{,}46\,\vec{j} - 4{,}54\,\vec{k}\ \text{m/s}^{2}
      $$

  - id: ejma7-col710-el-brazo-cd-que-gira-sobre-la-barra-bc
    titulo: El brazo CD sobre una barra que gira, con el ángulo en el plano XY
    fuente: >-
      Ejercicio 7.10 · Tema 7, «Cinemática del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo. Las cotas de la figura
      están en milímetros, así que las velocidades salen en mm/s y las
      aceleraciones en mm/s².
    nivel: practica
    enunciado: |
      El sólido AB y la barra BC giran a una velocidad constante ω₁ = 0.6
      rad/s alrededor de Y. Simultáneamente el brazo CD gira a velocidad
      constante ω₂ = 0.45 rad/s. Sabiendo que β = 120º, calcular:

      a) Aceleración angular del brazo CD.

      b) Velocidad de D.

      c) Aceleración de D.

      <figure>
      <svg viewBox="0 0 300 200" role="img" width="300" height="200" aria-labelledby="ma7c10-t ma7c10-d">
        <title id="ma7c10-t">Brazo CD articulado al extremo de la barra BC, que gira alrededor del eje Y</title>
        <desc id="ma7c10-d">Sobre una base circular, el sólido AB sube por el eje Y hasta B, a 10 milímetros de altura. De B sale la barra BC, de 20 milímetros, en la dirección x. En C se articula el brazo CD, de 16 milímetros, que forma un ángulo beta de 120 grados con CB dentro del plano XY, de modo que D queda arriba y a la derecha. El conjunto gira alrededor de Y con omega uno y el brazo CD alrededor de C con omega dos.</desc>
        <path d="M30 178 L74 152 L246 152 L202 178 Z" fill="var(--faint)" fill-opacity="0.2" stroke="var(--ink)" stroke-width="0.9"/>
        <ellipse cx="70" cy="152" rx="26" ry="9" fill="var(--d2)" fill-opacity="0.35" stroke="var(--ink)" stroke-width="1.1"/>
        <line x1="70" y1="152" x2="70" y2="24" stroke="var(--ink)" stroke-width="1"/>
        <text x="66" y="20" font-size="10" fill="var(--ink)">Y</text>
        <line x1="70" y1="152" x2="250" y2="152" stroke="var(--ink)" stroke-width="1"/>
        <text x="254" y="155" font-size="10" fill="var(--ink)">X</text>
        <line x1="70" y1="152" x2="34" y2="174" stroke="var(--ink)" stroke-width="1"/>
        <text x="24" y="182" font-size="10" fill="var(--ink)">Z</text>
        <rect x="65" y="112" width="10" height="40" fill="var(--d2)" fill-opacity="0.35" stroke="var(--ink)" stroke-width="1.1"/>
        <line x1="70" y1="112" x2="150" y2="112" stroke="var(--d2)" stroke-width="4.5"/>
        <line x1="150" y1="112" x2="182" y2="57" stroke="var(--d2)" stroke-width="4.5"/>
        <circle cx="70" cy="152" r="3" fill="var(--ink)"/>
        <circle cx="70" cy="112" r="3" fill="var(--ink)"/>
        <circle cx="150" cy="112" r="3" fill="var(--ink)"/>
        <circle cx="182" cy="57" r="3.4" fill="var(--d1)"/>
        <text x="58" y="160" font-size="10" fill="var(--ink)">A</text>
        <text x="58" y="110" font-size="10" fill="var(--ink)">B</text>
        <text x="146" y="126" font-size="10" fill="var(--ink)">C</text>
        <text x="186" y="52" font-size="10" fill="var(--d1)">D</text>
        <path d="M128 112 A 22 22 0 0 0 160 96" fill="none" stroke="var(--ink)" stroke-width="1"/>
        <text x="132" y="100" font-size="10" fill="var(--ink)">β</text>
        <line x1="96" y1="132" x2="96" y2="152" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="100" y="146" font-size="9" fill="var(--faint)">10 mm</text>
        <line x1="70" y1="90" x2="150" y2="90" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="110" y="86" font-size="9" text-anchor="middle" fill="var(--faint)">20 mm</text>
        <text x="190" y="86" font-size="9" fill="var(--faint)">16 mm</text>
        <path d="M56 130 A 14 14 0 0 0 84 134" fill="none" stroke="var(--ink)" stroke-width="1.1"/>
        <text x="86" y="138" font-size="10" fill="var(--ink)">ω₁</text>
        <path d="M170 44 A 16 16 0 0 1 186 38" fill="none" stroke="var(--ink)" stroke-width="1.1"/>
        <text x="188" y="36" font-size="10" fill="var(--ink)">ω₂</text>
      </svg>
      </figure>
    pide: La aceleración angular del brazo CD y la velocidad y aceleración del punto D.
    pasos:
      - tipo: reconocer
        pregunta: |
          El ángulo β está contenido en el plano XY. ¿Qué dirección tiene
          entonces $\vec{\omega}_2$?
        opciones:
          - texto: La del eje z, perpendicular al plano en el que gira el brazo
            correcta: true
            mensaje: |
              Eso es. El brazo CD se mueve dentro del plano XY, así que su
              velocidad angular relativa es perpendicular a ese plano: va
              según $z$.
          - texto: La del propio brazo CD, porque gira alrededor de sí mismo
            mensaje: |
              El brazo no gira sobre su eje: gira **en** el plano XY alrededor
              del punto C. El vector velocidad angular es perpendicular al
              plano del movimiento.
          - texto: La del eje y, la misma que ω₁
            mensaje: |
              Si fueran paralelas, el conjunto sería una rotación simple y no
              habría ni aceleración angular ni componente $z$ en la velocidad
              de D. Aquí son perpendiculares.

      - tipo: calcular
        titulo: La aceleración angular del brazo
        pregunta: |
          ¿Cuánto vale la componente $x$ de $\vec{\alpha}$, en rad/s²?
        respuesta:
          tipo: numero
          valor: '-0.27'
          tolerancia: 0.003
          formato: un número, en rad/s², con su signo
        distractores:
          - valor: '0'
            mensaje: |
              Los dos giros son de módulo constante, pero el eje de ω₂ es
              arrastrado por ω₁: la aceleración angular es
              $\vec{\omega}_1\times\vec{\omega}_2$.
          - valor: '0.27'
            mensaje: |
              El módulo está bien y el signo no. Con
              $\vec{\omega}_2 = -0{,}45\vec{k}$ —el sentido que marca la
              figura—, el producto $\vec{\omega}_1\times\vec{\omega}_2$ sale
              hacia las $x$ negativas.
        pista: |
          $\vec{\omega}_1 = 0{,}6\,\vec{j}$ y
          $\vec{\omega}_2 = -0{,}45\,\vec{k}$.
        desarrollo: |
          $$
          \vec{\alpha} = \vec{\omega}_1\times\vec{\omega}_2
          = 0{,}6\vec{j}\times(-0{,}45\vec{k}) = -0{,}27\,\vec{i}\ \text{rad/s}^{2}
          $$

      - tipo: calcular
        titulo: La velocidad de D
        pregunta: |
          ¿Cuánto vale la componente $z$ de $\vec{v}_D$, en mm/s?
        respuesta:
          tipo: numero
          valor: '-16.8'
          tolerancia: 0.05
          formato: un número, en mm/s, con su signo
        distractores:
          - valor: '-12'
            mensaje: |
              Esa es solo la velocidad de C, $\omega_1 \cdot 20$. Falta lo que
              añade el giro del brazo CD, que en la dirección $z$ aporta otros
              −4,8 mm/s.
          - valor: '-4.8'
            mensaje: |
              Esa es solo la parte del giro del brazo alrededor de C. Falta el
              arrastre: C ya se mueve a 12 mm/s por el giro de la barra
              alrededor de Y.
        pista: |
          $\vec{v}_D = \vec{v}_C + \vec{\omega}\times\overrightarrow{CD}$, con
          $\overrightarrow{CD} = 16(\cos 60^\circ;\ \sin 60^\circ;\ 0)$ mm.
        desarrollo: |
          $$
          \vec{v}_C = \vec{\omega}_1\times\overrightarrow{AC} = -12\,\vec{k}
          \qquad
          \overrightarrow{CD} = (8;\ 13{,}86;\ 0)\ \text{mm}
          $$

          $$
          \vec{v}_D = 6{,}23\,\vec{i} - 3{,}6\,\vec{j} - 16{,}8\,\vec{k}\ \text{mm/s}
          $$

      - tipo: calcular
        titulo: La aceleración de D
        pregunta: |
          ¿Cuánto vale la componente $x$ de $\vec{a}_D$, en mm/s²?
        respuesta:
          tipo: numero
          valor: '-11.7'
          tolerancia: 0.05
          formato: un número, en mm/s², con su signo
        distractores:
          - valor: '-7.2'
            mensaje: |
              Esa es la aceleración de C, $-\omega_1^{2}\cdot 20$. Faltan los
              términos del giro del brazo alrededor de C, que aportan otros
              −4,5 mm/s² en $x$.
          - valor: '-4.5'
            mensaje: |
              Esa es solo la parte del giro del brazo. Falta la centrípeta de
              C alrededor del eje vertical, que vale −7,2 mm/s².
        pista: |
          $\vec{a}_C = -\omega_1^{2}\,(20;\ 0;\ 0)$ y luego el campo de
          aceleraciones desde C, con sus tres sumandos.
        desarrollo: |
          $$
          \vec{a}_D = -11{,}7\,\vec{i} - 2{,}81\,\vec{j} - 7{,}48\,\vec{k}\ \text{mm/s}^{2}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Con β = 120° medido desde CB: $\overrightarrow{CD} = 16(\cos 60^\circ;\ \sin 60^\circ;\ 0)$ mm.'
          - texto: $\vec{\omega} = 0{,}6\vec{j}-0{,}45\vec{k}$ rad/s y $\vec{\alpha} = \vec{\omega}_1\times\vec{\omega}_2 = -0{,}27\vec{i}$ rad/s².
          - texto: 'C gira alrededor de Y a 20 mm del eje: $\vec{v}_C = -12\vec{k}$ mm/s y $\vec{a}_C = -7{,}2\vec{i}$ mm/s².'
          - texto: Como los dos giros son constantes, la aceleración de D es solo la centrípeta de C.
            trampa: true
            mensaje: |
              Aparte de que hay aceleración angular —el término
              $\vec{\omega}_1\times\vec{\omega}_2$—, D gira además alrededor
              de C: su distancia a C, 16 mm, aporta términos que triplican
              la componente $z$.
    resolucion: |
      **La geometría.** Con la barra BC en la dirección $x$ y 20 mm de largo,
      $C = (20;\ 10;\ 0)$ mm. El ángulo β = 120° se mide entre CB y CD dentro
      del plano XY, así que CD forma 60° con el eje $x$:
      $\overrightarrow{CD} = (8;\ 13{,}86;\ 0)$ mm.

      **Los giros.**

      $$
      \vec{\omega} = 0{,}6\,\vec{j} - 0{,}45\,\vec{k}\ \text{rad/s}
      \qquad
      \vec{\alpha} = \vec{\omega}_1\times\vec{\omega}_2 = -0{,}27\,\vec{i}\ \text{rad/s}^{2}
      $$

      **El punto C.** Gira alrededor del eje Y a 20 mm de él:
      $\vec{v}_C = -12\,\vec{k}$ mm/s y $\vec{a}_C = -7{,}2\,\vec{i}$ mm/s².

      **El punto D.**

      $$
      \vec{v}_D = \vec{v}_C + \vec{\omega}\times\overrightarrow{CD}
      = 6{,}23\,\vec{i} - 3{,}6\,\vec{j} - 16{,}8\,\vec{k}\ \text{mm/s}
      $$

      $$
      \vec{a}_D = \vec{a}_C + \vec{\alpha}\times\overrightarrow{CD}
      + \vec{\omega}\times(\vec{\omega}\times\overrightarrow{CD})
      = -11{,}7\,\vec{i} - 2{,}81\,\vec{j} - 7{,}48\,\vec{k}\ \text{mm/s}^{2}
      $$
  - id: ejma7-col711-el-disco-del-brazo-bcd
    titulo: El disco horizontal del brazo BCD que gira alrededor de Z
    fuente: >-
      Ejercicio 7.11 · Tema 7, «Cinemática del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      El brazo BCD gira con respecto al eje Z con una velocidad constante
      ω₁ = 5 rad/s. El disco gira a su vez con una velocidad angular constante
      ω₂ = 4 rad/s. Determinar:

      a) Aceleración angular del disco.

      b) Velocidad y aceleración del punto A.

      <figure>
      <svg viewBox="0 0 300 200" role="img" width="300" height="200" aria-labelledby="ma7c11-t ma7c11-d">
        <title id="ma7c11-t">Disco horizontal montado sobre el brazo acodado BCD</title>
        <desc id="ma7c11-d">El brazo acodado BCD gira alrededor del eje Z, que pasa por C y D. En C el brazo sube 120 milímetros hasta B, centro de un disco horizontal de 150 milímetros de radio que gira alrededor del eje vertical CB con omega dos. El punto A está en el borde del disco, en la dirección del eje X.</desc>
        <line x1="120" y1="150" x2="252" y2="150" stroke="var(--ink)" stroke-width="1"/>
        <text x="256" y="153" font-size="10" fill="var(--ink)">X</text>
        <line x1="120" y1="150" x2="120" y2="28" stroke="var(--ink)" stroke-width="1"/>
        <text x="116" y="24" font-size="10" fill="var(--ink)">Y</text>
        <line x1="120" y1="150" x2="66" y2="182" stroke="var(--ink)" stroke-width="1"/>
        <text x="56" y="190" font-size="10" fill="var(--ink)">Z</text>
        <ellipse cx="120" cy="90" rx="75" ry="26" fill="var(--faint)" fill-opacity="0.25" stroke="var(--ink)" stroke-width="1.2"/>
        <rect x="115" y="90" width="10" height="60" fill="var(--d2)" fill-opacity="0.4" stroke="var(--ink)" stroke-width="1.1"/>
        <line x1="120" y1="150" x2="86" y2="170" stroke="var(--d2)" stroke-width="5"/>
        <circle cx="120" cy="90" r="3" fill="var(--ink)"/>
        <circle cx="120" cy="150" r="3" fill="var(--ink)"/>
        <circle cx="86" cy="170" r="3" fill="var(--ink)"/>
        <circle cx="195" cy="90" r="3.4" fill="var(--d1)"/>
        <text x="112" y="84" font-size="10" fill="var(--ink)">B</text>
        <text x="126" y="162" font-size="10" fill="var(--ink)">C</text>
        <text x="72" y="166" font-size="10" fill="var(--ink)">D</text>
        <text x="200" y="86" font-size="10" fill="var(--d1)">A</text>
        <line x1="212" y1="90" x2="212" y2="150" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="216" y="124" font-size="9" fill="var(--faint)">120 mm</text>
        <text x="150" y="72" font-size="9" text-anchor="middle" fill="var(--faint)">150 mm</text>
        <path d="M60 156 A 16 16 0 0 1 76 148" fill="none" stroke="var(--ink)" stroke-width="1.1"/>
        <text x="52" y="146" font-size="10" fill="var(--ink)">ω₁</text>
        <path d="M92 78 A 20 20 0 0 1 110 70" fill="none" stroke="var(--ink)" stroke-width="1.1"/>
        <text x="82" y="70" font-size="10" fill="var(--ink)">ω₂</text>
      </svg>
      </figure>
    pide: La aceleración angular del disco y la velocidad y aceleración del punto A del borde.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué se puede tomar C como punto fijo del disco?
        opciones:
          - texto: Porque los dos ejes de giro, Z y CB, se cortan en C
            correcta: true
            mensaje: |
              Eso es. Cuando los ejes se cortan, su punto común tiene
              velocidad nula por los dos giros a la vez, y el disco se mueve
              como un sólido con punto fijo.
          - texto: Porque C es el centro del disco
            mensaje: |
              El centro del disco es B, que sí se mueve: gira alrededor del
              eje Z a 120 mm de él. Lo que hace fijo a C es estar en los dos
              ejes.
          - texto: Porque el brazo BCD no se mueve
            mensaje: |
              El brazo gira alrededor de Z: es justamente el primero de los
              dos movimientos.

      - tipo: calcular
        titulo: La aceleración angular del disco
        pregunta: |
          ¿Cuánto vale la componente $x$ de $\vec{\alpha}$, en rad/s²?
        respuesta:
          tipo: numero
          valor: '-20'
          tolerancia: 0.1
          formato: un número, en rad/s², con su signo
        distractores:
          - valor: '20'
            mensaje: |
              El módulo está bien y el signo no. Con
              $\vec{\omega}_1 = 5\vec{k}$ y $\vec{\omega}_2 = 4\vec{j}$, el
              producto $\vec{\omega}_1\times\vec{\omega}_2$ apunta hacia las
              $x$ negativas.
          - valor: '0'
            mensaje: |
              Los dos giros son constantes en módulo, pero el eje del disco
              —vertical, montado en el brazo— gira arrastrado por ω₁, y esa
              rotación del vector es la aceleración angular.
        pista: |
          $\vec{\alpha} = \vec{\omega}_1\times\vec{\omega}_2$ con
          $\vec{\omega}_1 = 5\vec{k}$ y $\vec{\omega}_2 = 4\vec{j}$.
        desarrollo: |
          $$
          \vec{\alpha} = 5\vec{k}\times 4\vec{j} = -20\,\vec{i}\ \text{rad/s}^{2}
          $$

      - tipo: calcular
        titulo: La velocidad de A
        pregunta: |
          ¿Cuánto vale la componente $y$ de $\vec{v}_A$, en m/s?
        respuesta:
          tipo: numero
          valor: '0.75'
          tolerancia: 0.005
          formato: un número, en m/s, con su signo
        distractores:
          - valor: '0.6'
            mensaje: |
              Ese es el valor de las componentes $x$ y $z$, que valen −0,6
              m/s. La componente $y$ sale de $\omega_1$ por la coordenada $x$
              de A: $5 \cdot 0{,}15$.
          - valor: '0.45'
            mensaje: |
              Has multiplicado 5 por 0,09 o algo parecido. La distancia que
              cuenta aquí es el radio del disco, 0,15 m.
        pista: |
          $\vec{\omega} = 4\vec{j}+5\vec{k}$ y
          $\overrightarrow{CA} = (0{,}15;\ 0{,}12;\ 0)$ m.
        desarrollo: |
          $$
          \vec{v}_A = \vec{\omega}\times\overrightarrow{CA}
          = -0{,}6\,\vec{i} + 0{,}75\,\vec{j} - 0{,}6\,\vec{k}\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La aceleración de A
        pregunta: |
          ¿Cuánto vale la componente $x$ de $\vec{a}_A$, en m/s²?
        respuesta:
          tipo: numero
          valor: '-6.15'
          tolerancia: 0.02
          formato: un número, en m/s², con su signo
        distractores:
          - valor: '-3.75'
            mensaje: |
              Esa es solo la centrípeta del giro del brazo,
              $-\omega_1^{2}\cdot 0{,}15$. Falta la del giro propio del disco
              y la tangencial de la aceleración angular.
          - valor: '-2.4'
            mensaje: |
              Esa es solo la parte tangencial
              $\vec{\alpha}\times\overrightarrow{CA}$ proyectada mal: esa
              componente va en $z$ y se cancela. Lo que queda en $x$ viene del
              término normal.
        pista: |
          $\vec{a}_A = \vec{\alpha}\times\overrightarrow{CA} +
          \vec{\omega}\times\vec{v}_A$.
        desarrollo: |
          $$
          \vec{a}_A = -6{,}15\,\vec{i} - 3\,\vec{j}\ \text{m/s}^{2}
          $$

          La componente $z$ se anula: la tangencial vale $-2{,}4\vec{k}$ y el
          término normal aporta $+2{,}4\vec{k}$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Los ejes Z y CB se cortan en C, que es punto fijo: $\vec{\omega} = 4\vec{j}+5\vec{k}$ rad/s.'
          - texto: $\vec{\alpha} = \vec{\omega}_1\times\vec{\omega}_2 = -20\vec{i}$ rad/s².
          - texto: Con $\overrightarrow{CA} = (0{,}15;\ 0{,}12;\ 0)$ m salen $\vec{v}_A = (-0{,}6;\ 0{,}75;\ -0{,}6)$ m/s y $\vec{a}_A = (-6{,}15;\ -3;\ 0)$ m/s².
          - texto: Como A está en el borde del disco, su velocidad es $\omega_2$ por el radio, 0,6 m/s, y nada más.
            trampa: true
            mensaje: |
              Eso sería si el disco girase sobre un eje fijo. Aquí todo el
              brazo gira además alrededor de Z, y esa parte aporta las
              componentes $y$ y $z$ de la velocidad.
    resolucion: |
      **El punto fijo.** El eje Z —por donde va el brazo CD— y el eje del
      disco —la vertical CB— se cortan en C, así que C es punto fijo del
      disco.

      **Los giros.**

      $$
      \vec{\omega} = 4\,\vec{j} + 5\,\vec{k}\ \text{rad/s}
      \qquad
      \vec{\alpha} = \vec{\omega}_1\times\vec{\omega}_2 = -20\,\vec{i}\ \text{rad/s}^{2}
      $$

      **El punto A.** Está en el borde del disco, a 150 mm de B y 120 mm por
      encima de C: $\overrightarrow{CA} = (0{,}15;\ 0{,}12;\ 0)$ m.

      $$
      \vec{v}_A = \vec{\omega}\times\overrightarrow{CA}
      = -0{,}6\,\vec{i} + 0{,}75\,\vec{j} - 0{,}6\,\vec{k}\ \text{m/s}
      $$

      $$
      \vec{a}_A = \vec{\alpha}\times\overrightarrow{CA} + \vec{\omega}\times\vec{v}_A
      = -6{,}15\,\vec{i} - 3\,\vec{j}\ \text{m/s}^{2}
      $$

  - id: ejma7-col712-el-cono-que-rueda-sobre-el-disco
    titulo: El cono que rueda sin deslizar sobre un disco que gira
    fuente: >-
      Ejercicio 7.12 · Tema 7, «Cinemática del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo. Las casillas piden el
      número con los valores de prueba que se declaran en cada pregunta.
    nivel: practica
    enunciado: |
      El disco de radio R de la figura gira respecto al eje OO' con velocidad
      angular constante ω, siendo el sentido de giro positivo en el eje Z. A
      su vez el cono de vértice O se mueve sobre dicho disco sin deslizar de
      manera que el punto B, centro de su base, sigue una trayectoria circular
      respecto del eje OO' y con velocidad angular constante 2ω, siendo
      también el sentido de giro positivo en el eje Z. Si el ángulo medio del
      cono es 30º y su generatriz mide R, calcular:

      a) La velocidad angular del cono.

      b) Las componentes de pivotamiento y rodadura del movimiento relativo
      del cono sobre el disco.

      <figure>
      <svg viewBox="0 0 300 190" role="img" width="300" height="190" aria-labelledby="ma7c12-t ma7c12-d">
        <title id="ma7c12-t">Cono apoyado sobre un disco que gira alrededor del eje vertical</title>
        <desc id="ma7c12-d">Un disco horizontal de radio R gira alrededor del eje vertical OO'. Sobre él se apoya un cono de vértice O y ángulo medio de 30 grados, cuya generatriz de contacto descansa sobre el disco a lo largo del eje Y. B es el centro de la base del cono y C, el punto de la base que toca el disco.</desc>
        <ellipse cx="110" cy="105" rx="100" ry="30" fill="var(--d2)" fill-opacity="0.3" stroke="var(--ink)" stroke-width="1.2"/>
        <line x1="110" y1="145" x2="110" y2="20" stroke="var(--ink)" stroke-width="1.2" stroke-dasharray="6 4"/>
        <text x="104" y="16" font-size="10" fill="var(--ink)">Z</text>
        <text x="100" y="160" font-size="10" fill="var(--ink)">O'</text>
        <line x1="110" y1="105" x2="262" y2="105" stroke="var(--ink)" stroke-width="1"/>
        <text x="266" y="108" font-size="10" fill="var(--ink)">Y</text>
        <path d="M110 105 L210 105 L160 18.4 Z" fill="var(--faint)" fill-opacity="0.35" stroke="var(--ink)" stroke-width="1.2"/>
        <line x1="110" y1="105" x2="185" y2="61.7" stroke="var(--ink)" stroke-width="1" stroke-dasharray="5 3"/>
        <circle cx="110" cy="105" r="3.4" fill="var(--ink)"/>
        <circle cx="185" cy="61.7" r="3" fill="var(--ink)"/>
        <circle cx="210" cy="105" r="3.4" fill="var(--d1)"/>
        <text x="98" y="100" font-size="10" fill="var(--ink)">O</text>
        <text x="188" y="56" font-size="10" fill="var(--ink)">B</text>
        <text x="206" y="120" font-size="10" fill="var(--d1)">C</text>
        <path d="M136 105 A 26 26 0 0 0 132 92" fill="none" stroke="var(--ink)" stroke-width="1"/>
        <text x="138" y="98" font-size="9" fill="var(--ink)">30°</text>
        <text x="150" y="140" font-size="9" fill="var(--faint)">generatriz = R</text>
        <path d="M96 30 A 18 10 0 0 0 124 34" fill="none" stroke="var(--ink)" stroke-width="1.1"/>
        <text x="128" y="34" font-size="10" fill="var(--ink)">ω</text>
      </svg>
      </figure>
    pide: La velocidad angular del cono y las componentes de pivotamiento y rodadura de su movimiento relativo al disco.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué condición traduce que el cono ruede sin deslizar sobre el
          disco?
        opciones:
          - texto: Que en cada punto de la generatriz de contacto, cono y disco tengan la misma velocidad
            correcta: true
            mensaje: |
              Eso es. El contacto es una recta entera —la generatriz—, y en
              toda ella las dos velocidades han de coincidir. Basta imponerlo
              en un punto: como las dos son lineales en la distancia a O, se
              cumple en todos.
          - texto: Que el vértice O tenga velocidad nula
            mensaje: |
              O tiene velocidad nula, sí, pero eso pasa por estar en el eje de
              giro: no dice nada del deslizamiento. La condición que fija
              $\omega$ es la igualdad de velocidades en la generatriz.
          - texto: Que el centro B de la base esté quieto
            mensaje: |
              B recorre una circunferencia a 2ω: precisamente el dato del
              enunciado. No está quieto.

      - tipo: calcular
        titulo: El giro propio del cono
        pregunta: |
          Con el valor de prueba $\omega = 2\ \text{rad/s}$, ¿cuánto vale la
          componente $y$ de $\vec{\omega}_c$, en rad/s?
        respuesta:
          tipo: numero
          valor: '-3.464'
          tolerancia: 0.01
          formato: un número, en rad/s, con su signo
        distractores:
          - valor: '-2'
            mensaje: |
              Has puesto $-\omega$. La componente $y$ es $-\sqrt{3}\,\omega$:
              sale del giro propio $-2\omega$ proyectado sobre el eje del
              cono, que forma 30° con la generatriz de contacto.
          - valor: '3.464'
            mensaje: |
              El módulo está bien y el signo no. El giro propio va en el
              sentido de las $y$ negativas: es lo que hace que el punto de
              contacto tenga la misma velocidad que el disco.
        pista: |
          Escribe $\vec{\omega}_c = 2\omega\vec{k} + \omega_s\,\vec{u}$ con
          $\vec{u} = (0;\ \cos 30^\circ;\ \sin 30^\circ)$ y obliga a que la
          velocidad en la generatriz coincida con la del disco.
        desarrollo: |
          $$
          \vec{\omega}_c = -\sqrt{3}\,\omega\,\vec{j} + \omega\,\vec{k}
          = -3{,}464\,\vec{j} + 2\,\vec{k}\ \text{rad/s}
          $$

          El giro propio sale $\omega_s = -2\omega$, y sus proyecciones son
          $-2\omega\cos 30^\circ = -\sqrt{3}\omega$ en $y$ y
          $-2\omega\sin 30^\circ = -\omega$ en $z$, que con el $2\omega$ de la
          precesión deja $\omega$.

      - tipo: calcular
        titulo: El pivotamiento
        pregunta: |
          Con $\omega = 2\ \text{rad/s}$, ¿cuánto vale la componente de
          pivotamiento del movimiento relativo del cono sobre el disco, en
          rad/s?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.02
          formato: un número, en rad/s
        distractores:
          - valor: '2'
            mensaje: |
              Esa es la componente $z$ de la velocidad angular **absoluta** del
              cono. El pivotamiento se calcula con la velocidad angular
              **relativa** al disco, y al restar $\omega\vec{k}$ la componente
              normal desaparece.
          - valor: '3.464'
            mensaje: |
              Ese es el módulo de la rodadura, que va en el plano de contacto.
              El pivotamiento es la componente perpendicular a ese plano, y
              aquí es nula.
        pista: |
          $\vec{\omega}_{rel} = \vec{\omega}_c - \omega\vec{k}$, y el plano
          tangente en el contacto es el propio disco, de normal $\vec{k}$.
        desarrollo: |
          $$
          \vec{\omega}_{rel} = -\sqrt{3}\,\omega\,\vec{j}
          \qquad
          \vec{\omega}_{piv} = \vec{0}
          \qquad
          \vec{\omega}_{rod} = -\sqrt{3}\,\omega\,\vec{j}
          $$

          Todo el movimiento relativo es de rodadura, que es lo que tiene que
          pasar cuando un cono rueda sobre un plano sin deslizar: su velocidad
          angular relativa va **a lo largo** de la generatriz de contacto.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'El eje del cono forma 30° con la generatriz apoyada: $\vec{u} = (0;\ \cos 30^\circ;\ \sin 30^\circ)$.'
          - texto: $\vec{\omega}_c = 2\omega\vec{k}+\omega_s\vec{u}$, y la igualdad de velocidades en la generatriz da $\omega_s = -2\omega$.
          - texto: $\vec{\omega}_c = -\sqrt{3}\omega\vec{j}+\omega\vec{k}$ y $\vec{\omega}_{rel} = \vec{\omega}_c-\omega\vec{k} = -\sqrt{3}\omega\vec{j}$.
          - texto: Como el cono rueda sin deslizar, su velocidad angular absoluta va a lo largo de la generatriz de contacto.
            trampa: true
            mensaje: |
              Lo que va a lo largo de la generatriz es la velocidad angular
              **relativa** al disco. La absoluta,
              $-\sqrt{3}\omega\vec{j}+\omega\vec{k}$, tiene componente
              vertical, porque el disco de debajo también gira.
    resolucion: |
      **El planteamiento.** El cono tiene dos giros: la precesión $2\omega$
      alrededor del eje vertical —el dato de que B recorre una circunferencia
      a $2\omega$— y su giro propio alrededor de su eje OB, que forma 30° con
      la generatriz apoyada:

      $$
      \vec{\omega}_c = 2\omega\,\vec{k} + \omega_s\,(0;\ \cos 30^\circ;\ \sin 30^\circ)
      $$

      **La condición de rodadura.** En un punto cualquiera $(0;\ y;\ 0)$ de la
      generatriz de contacto, el disco lleva velocidad $-\omega y\,\vec{i}$ y
      el cono, $-(2\omega + \omega_s/2)\,y\,\vec{i}$. Igualando,
      $\omega_s = -2\omega$:

      $$
      \vec{\omega}_c = -\sqrt{3}\,\omega\,\vec{j} + \omega\,\vec{k}
      $$

      **Pivotamiento y rodadura.** El movimiento relativo del cono sobre el
      disco tiene velocidad angular

      $$
      \vec{\omega}_{rel} = \vec{\omega}_c - \omega\,\vec{k} = -\sqrt{3}\,\omega\,\vec{j}
      $$

      El plano tangente del contacto es el propio disco, de normal $\vec{k}$:
      la componente normal —el **pivotamiento**— es nula, y toda la velocidad
      angular relativa es de **rodadura**,
      $\vec{\omega}_{rod} = -\sqrt{3}\,\omega\,\vec{j}$, a lo largo de la
      generatriz de contacto.
  - id: ejma7-col713-las-dos-barras-en-el-plano-que-gira
    titulo: Dos barras articuladas dentro de un plano vertical que gira
    fuente: >-
      Ejercicio 7.13 · Tema 7, «Cinemática del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo. En el apartado e la
      colección imprime la aceleración de B —que aquí se reproduce y se
      comprueba— cuando el enunciado pide las de A y C; las de A y C son
      nuestras, contrastadas con una derivación numérica del mecanismo. Las
      casillas piden el número con los valores de prueba que se declaran en
      cada pregunta.
    nivel: practica
    enunciado: |
      El plano π vertical gira alrededor del eje vertical z con velocidad
      angular ω constante y sentido de giro dado en la figura. Dos barras 1
      (AB) y 2 (BC) de longitud L√2 permanecen siempre en el plano π. La
      velocidad angular de la barra 1 relativa al plano π es 2ω constante y de
      sentido antihorario (ver figura). La barra 1 está articulada en A, punto
      solidario al plano, y en B a la barra 2. Por su parte, la barra 2 está
      articulada a una deslizadera C que se mueve siempre sobre una guía
      horizontal a la altura de A. En la posición de la figura, determinar:

      a) Velocidad angular de la barra 1.

      b) Velocidades lineales de los puntos A y B.

      c) Velocidad angular de la barra 2, velocidad del punto C para un
      observador situado en el plano π y velocidad lineal (absoluta) del
      punto C.

      d) Aceleraciones angulares de las barras 1 y 2.

      e) Aceleraciones lineales de los puntos A y C.

      <figure>
      <svg viewBox="0 0 300 200" role="img" width="300" height="200" aria-labelledby="ma7c13-t ma7c13-d">
        <title id="ma7c13-t">Las dos barras dentro del plano vertical, vistas de frente</title>
        <desc id="ma7c13-d">El plano vertical pi contiene el eje z y gira alrededor de él. Visto de frente, A está a la derecha sobre la horizontal que pasa por el origen, B queda abajo en el eje vertical y C a la izquierda, sobre la misma horizontal que A, dentro de una guía. Las barras AB y BC, de longitud L raíz de dos, forman 45 grados con la horizontal.</desc>
        <rect x="60" y="26" width="190" height="150" fill="var(--faint)" fill-opacity="0.16" stroke="var(--faint)" stroke-width="1"/>
        <line x1="150" y1="176" x2="150" y2="20" stroke="var(--ink)" stroke-width="1"/>
        <text x="144" y="17" font-size="10" fill="var(--ink)">z</text>
        <line x1="150" y1="80" x2="266" y2="80" stroke="var(--ink)" stroke-width="1"/>
        <text x="270" y="83" font-size="10" fill="var(--ink)">y</text>
        <circle cx="150" cy="80" r="3" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.1"/>
        <line x1="210" y1="80" x2="150" y2="140" stroke="var(--ink)" stroke-width="3.4"/>
        <line x1="150" y1="140" x2="90" y2="80" stroke="var(--ink)" stroke-width="3.4"/>
        <circle cx="210" cy="80" r="3.6" fill="var(--d1)"/>
        <circle cx="150" cy="140" r="3.6" fill="var(--ink)"/>
        <circle cx="90" cy="80" r="3.6" fill="var(--d1)"/>
        <text x="214" y="74" font-size="10" fill="var(--d1)">A</text>
        <text x="154" y="154" font-size="10" fill="var(--ink)">B</text>
        <text x="78" y="74" font-size="10" fill="var(--d1)">C</text>
        <path d="M70 72 H110 M74 72 l-6 -6 M86 72 l-6 -6 M98 72 l-6 -6" fill="none" stroke="var(--faint)" stroke-width="1"/>
        <line x1="70" y1="72" x2="110" y2="72" stroke="var(--ink)" stroke-width="1.1"/>
        <path d="M192 80 A 18 18 0 0 0 197 92" fill="none" stroke="var(--ink)" stroke-width="1"/>
        <text x="188" y="96" font-size="9" fill="var(--ink)">45°</text>
        <path d="M108 80 A 18 18 0 0 1 103 92" fill="none" stroke="var(--ink)" stroke-width="1"/>
        <text x="106" y="96" font-size="9" fill="var(--ink)">45°</text>
        <text x="178" y="118" font-size="9" fill="var(--faint)">1</text>
        <text x="118" y="118" font-size="9" fill="var(--faint)">2</text>
        <path d="M130 34 A 22 8 0 0 0 172 36" fill="none" stroke="var(--ink)" stroke-width="1.1"/>
        <text x="176" y="38" font-size="10" fill="var(--ink)">ω</text>
      </svg>
      </figure>
    pide: Las velocidades y aceleraciones angulares de las dos barras y las velocidades y aceleraciones de A, B y C.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué condición determina la velocidad angular de la barra 2?
        opciones:
          - texto: Que C solo pueda moverse a lo largo de la guía horizontal, dentro del plano
            correcta: true
            mensaje: |
              Eso es. La deslizadera obliga a que la componente vertical de la
              velocidad relativa de C sea nula, y esa única ecuación fija
              $\vec{\omega}_{2/\pi}$.
          - texto: Que la barra 2 gire a la misma velocidad que la 1, por ser de la misma longitud
            mensaje: |
              La longitud no impone eso. De hecho salen iguales en módulo pero
              **opuestas** en sentido, y eso es un resultado del cálculo, no
              una hipótesis.
          - texto: Que la velocidad de B sea nula
            mensaje: |
              B se mueve: es el extremo de la barra 1, que gira alrededor de A
              a 2ω dentro del plano, y además el plano entero gira.

      - tipo: calcular
        titulo: La velocidad relativa de la deslizadera
        pregunta: |
          Con los valores de prueba $\omega = 1\ \text{rad/s}$ y
          $L = 1\ \text{m}$, ¿cuánto vale la componente $y$ de la velocidad de
          C **vista desde el plano**, en m/s?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.02
          formato: un número, en m/s, con su signo
        distractores:
          - valor: '2'
            mensaje: |
              Esa es la velocidad relativa de B, $2\omega L$ en cada
              componente. C se mueve al doble: la barra 2 aporta otro tanto en
              horizontal y cancela la vertical.
          - valor: '1'
            mensaje: |
              Ese es el orden de magnitud de la velocidad de arrastre,
              $\omega L$. La relativa la producen los giros de las barras
              dentro del plano, que van a $2\omega$.
        pista: |
          En el plano, $\vec{v}_{B/\pi} = \vec{\omega}_{1/\pi}\times
          \overrightarrow{AB}$, y luego se impone que
          $\vec{v}_{C/\pi}$ no tenga componente vertical.
        desarrollo: |
          $$
          \vec{v}_{B/\pi} = 2\omega L\,\vec{j} - 2\omega L\,\vec{k}
          \qquad
          \vec{\omega}_{2/\pi} = -2\omega\,\vec{i}
          \qquad
          \vec{v}_{C/\pi} = 4\omega L\,\vec{j}
          $$

      - tipo: calcular
        titulo: La aceleración de C
        pregunta: |
          Con $\omega = 1\ \text{rad/s}$ y $L = 1\ \text{m}$, ¿cuánto vale la
          componente $x$ de la aceleración **absoluta** de C, en m/s²?
        respuesta:
          tipo: numero
          valor: '8'
          tolerancia: 0.05
          formato: un número, en m/s², con su signo
        distractores:
          - valor: '0'
            mensaje: |
              Es el resultado de olvidar Coriolis. C se mueve dentro de un
              plano que gira, así que aparece
              $2\vec{\omega}\times\vec{v}_{C/\pi}$, y aquí es justamente la
              única componente perpendicular al plano.
          - valor: '4'
            mensaje: |
              Te has dejado el 2 de la aceleración complementaria: es
              $2\vec{\omega}\times\vec{v}_{rel}$, no
              $\vec{\omega}\times\vec{v}_{rel}$.
        pista: |
          $\vec{a}_C = \vec{a}_{arr} + \vec{a}_{rel} + 2\vec{\omega}\times
          \vec{v}_{C/\pi}$, con $\vec{v}_{C/\pi} = 4\omega L\,\vec{j}$.
        desarrollo: |
          $$
          \vec{a}_{arr} = \omega^{2}L\,\vec{j}
          \qquad
          \vec{a}_{rel} = 8\omega^{2}L\,\vec{j}
          \qquad
          \vec{a}_{cor} = 8\omega^{2}L\,\vec{i}
          $$

          $$
          \vec{a}_C = 8\omega^{2}L\,\vec{i} + 9\omega^{2}L\,\vec{j}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Con $A = (0;\ L;\ 0)$, $B = (0;\ 0;\ -L)$ y $C = (0;\ -L;\ 0)$, el plano gira a $-\omega\vec{k}$ y la barra 1 a $2\omega\vec{i}$ respecto del plano.'
          - texto: $\vec{\omega}_1 = 2\omega\vec{i}-\omega\vec{k}$ y $\vec{\omega}_2 = -2\omega\vec{i}-\omega\vec{k}$, y por Resal $\vec{\alpha}_1 = -2\omega^{2}\vec{j}$, $\vec{\alpha}_2 = 2\omega^{2}\vec{j}$.
          - texto: 'La guía obliga a $\vec{v}_{C/\pi} = 4\omega L\vec{j}$, y con el arrastre: $\vec{v}_C = -\omega L\vec{i}+4\omega L\vec{j}$.'
            # el `: ` de dentro obliga a comillas (§17)
          - texto: Como C se mueve dentro del plano, su aceleración absoluta es la suma del arrastre y la relativa.
            trampa: true
            mensaje: |
              Falta la aceleración complementaria,
              $2\vec{\omega}\times\vec{v}_{rel}$, que aquí vale
              $8\omega^{2}L\vec{i}$ y es la **única** componente
              perpendicular al plano. Sin ella la aceleración de C sale
              contenida en el plano, y no lo está.
    resolucion: |
      **Los ejes.** Con el plano π conteniendo los ejes $y$ y $z$ en el
      instante de la figura: $A = (0;\ L;\ 0)$, $B = (0;\ 0;\ -L)$ y
      $C = (0;\ -L;\ 0)$. El giro del plano es $-\omega\,\vec{k}$ y el de la
      barra 1 respecto del plano, $2\omega\,\vec{i}$.

      **a) y b).**

      $$
      \vec{\omega}_1 = 2\omega\,\vec{i} - \omega\,\vec{k}
      \qquad
      \vec{v}_A = \omega L\,\vec{i}
      \qquad
      \vec{v}_B = 2\omega L\,\vec{j} - 2\omega L\,\vec{k}
      $$

      **c).** Dentro del plano, la barra 2 tiene que dejar a C sobre la guía
      horizontal, y eso da $\vec{\omega}_{2/\pi} = -2\omega\,\vec{i}$:

      $$
      \vec{\omega}_2 = -2\omega\,\vec{i} - \omega\,\vec{k}
      \qquad
      \vec{v}_{C/\pi} = 4\omega L\,\vec{j}
      \qquad
      \vec{v}_C = -\omega L\,\vec{i} + 4\omega L\,\vec{j}
      $$

      **d).** Los dos giros relativos son constantes en módulo, pero el plano
      arrastra su dirección:

      $$
      \vec{\alpha}_1 = -2\omega^{2}\,\vec{j}
      \qquad
      \vec{\alpha}_2 = 2\omega^{2}\,\vec{j}
      $$

      **e).** A es solidario al plano, así que solo tiene la centrípeta del
      giro del plano:

      $$
      \vec{a}_A = -\omega^{2}L\,\vec{j}
      $$

      Para C hay que sumar arrastre, relativa y complementaria:

      $$
      \vec{a}_C = 8\omega^{2}L\,\vec{i} + 9\omega^{2}L\,\vec{j}
      $$

      El resultado impreso en la colección para el apartado e es el de B,
      $\vec{a}_B = 4\omega^{2}L\,(\vec{i}+\vec{j}+\vec{k})$, que sale del
      campo de aceleraciones de la barra 1 desde A y que nuestra comprobación
      numérica reproduce.

  - id: ejma7-col714-el-disco-que-rueda-y-el-punto-que-sube-por-el-eje
    titulo: El disco que rueda y el punto que sube por el eje vertical
    fuente: >-
      Ejercicio 7.14 · Tema 7, «Cinemática del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo. En la aceleración de M
      relativa al disco la colección imprime $4\omega v\,\vec{i}$ y las dos
      comprobaciones nuestras dan $-4\omega v\,\vec{i}$, con el signo
      contrario; se publica el nuestro y el impreso aparece como distractor.
      Las casillas piden el número con los valores de prueba que se declaran
      en cada pregunta.
    nivel: practica
    enunciado: |
      Un disco vertical de radio R rueda sobre un plano horizontal fijo π con
      rotación angular constante 2ω relativa a la barra AB. Sobre el eje OZ se
      mueve con velocidad contante v positiva un punto material M. Si la
      longitud de la barra es 2R, calcular:

      a) La rotación y aceleración angular del movimiento absoluto del disco
      para que no exista deslizamiento entre disco y plano π.

      b) Velocidad y aceleración del punto M respecto al disco cuando el punto
      está a una altura R.

      c) Eje instantáneo de rotación y deslizamiento (EIRD) del disco.

      <figure>
