ejercicios:
  - id: ejma7-el-disco-que-rueda
    titulo: Las velocidades de un disco que rueda sin deslizar
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Un disco de radio $R = 0{,}3\ \text{m}$ rueda sin deslizar sobre un suelo
      horizontal, girando con velocidad angular $\omega = 10\ \text{rad/s}$ en
      sentido horario, de modo que avanza hacia la derecha. Calcular la
      velocidad de su centro, la del punto más alto y la del punto delantero,
      en el extremo del radio horizontal.
    pide: Las velocidades del centro, del punto más alto y del punto delantero.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué punto del disco conviene usar como punto conocido del campo de
          velocidades?
        opciones:
          - texto: El punto de contacto con el suelo, porque al rodar sin deslizar su velocidad es nula
            correcta: true
            mensaje: |
              Eso es. En ese instante el punto de contacto no desliza, así que
              su velocidad es cero y el disco gira alrededor de él. Cualquier
              velocidad es $\omega$ por la distancia a ese punto.
          - texto: El centro, porque es el único punto que no se mueve
            mensaje: |
              El centro se mueve: avanza con el disco, a $\omega R$. Si lo usas
              como punto conocido, primero hay que saber su velocidad, y esa
              sale del punto de contacto.
          - texto: El punto más alto, porque es el que más rápido va
            mensaje: |
              Va el más rápido, pero no se conoce su velocidad de antemano. El
              único punto con velocidad conocida sin calcular nada es el de
              contacto.

      - tipo: calcular
        titulo: La velocidad del centro
        pregunta: |
          ¿A qué velocidad va el centro del disco?
        respuesta:
          tipo: magnitud
          valor: '3 m/s'
          formato: una velocidad, con su unidad
        distractores:
          - valor: '6 m/s'
            mensaje: |
              Has usado el diámetro, 0,6 m. El centro está a un **radio** del
              punto de contacto: $v_O = \omega R = 10 \cdot 0{,}3$.
          - valor: '0 m/s'
            mensaje: |
              El centro no está quieto: el disco avanza. El punto sin velocidad
              es el de contacto, a una distancia $R$ del centro.
        pista: |
          El centro está a una distancia $R$ del punto de contacto, que está
          quieto en ese instante.
        desarrollo: |
          $$
          v_O = \omega\,R = 10 \cdot 0{,}3 = 3\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La velocidad del punto más alto
        pregunta: |
          ¿A qué velocidad va el punto más alto del disco?
        respuesta:
          tipo: magnitud
          valor: '6 m/s'
          formato: una velocidad, con su unidad
        distractores:
          - valor: '3 m/s'
            mensaje: |
              Esa es la del centro. El punto más alto va a la velocidad del
              centro **más** la de su giro alrededor de él, que va en el mismo
              sentido: está a $2R$ del punto de contacto.
        pista: |
          El punto más alto está a $2R$ del punto de contacto.
        desarrollo: |
          $$
          v_{\text{arriba}} = \omega \cdot 2R = 10 \cdot 0{,}6 = 6\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La velocidad del punto delantero
        pregunta: |
          ¿Y el punto delantero, en el extremo del radio horizontal?
        respuesta:
          tipo: magnitud
          valor: '4.243 m/s'
          formato: una velocidad, con su unidad
        distractores:
          - valor: '6 m/s'
            mensaje: |
              Has sumado las dos componentes como si fueran paralelas. El
              avance del centro es horizontal y el giro alrededor del centro,
              en ese punto, vertical: se componen con Pitágoras.
          - valor: '3 m/s'
            mensaje: |
              Solo has puesto una de las dos componentes. A la velocidad del
              centro, horizontal, hay que sumarle la del giro alrededor de él,
              que en el punto delantero es vertical y hacia abajo.
        pista: |
          Está a $R\sqrt{2}$ del punto de contacto. O bien: la velocidad del
          centro, 3 m/s en horizontal, más $\omega R = 3\ \text{m/s}$ en vertical.
        desarrollo: |
          $$
          v = \omega\,R\sqrt{2} = 10 \cdot 0{,}3 \cdot 1{,}4142 = 4{,}243\ \text{m/s}
          $$

          A 45° por debajo de la horizontal: perpendicular a la recta que lo une
          con el punto de contacto.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: Al rodar sin deslizar, el punto de contacto tiene velocidad nula y el disco gira alrededor de él.
          - texto: 'El centro, a distancia $R$: $v_O = 3$ m/s. El punto más alto, a $2R$: 6 m/s.'
          - texto: El punto delantero, a $R\sqrt{2}$ del contacto, va a 4,243 m/s, perpendicular a esa distancia.
          - texto: Todos los puntos del disco van a la misma velocidad que el centro, porque el disco es rígido.
            trampa: true
            mensaje: |
              Solo sería así en una traslación, sin giro. El disco gira, y cada
              punto suma a la velocidad del centro la de su giro alrededor de
              él: el contacto va a 0 y el punto más alto al doble.
    resolucion: |
      **El punto de referencia.** Rodar sin deslizar significa que el punto de
      contacto tiene velocidad nula en ese instante. El disco gira alrededor de
      él, y cada punto va a $\omega$ por su distancia al contacto, perpendicular
      a esa distancia.

      **Los tres puntos.**

      $$
      v_O = \omega R = 3\ \text{m/s}
      \qquad
      v_{\text{arriba}} = \omega \cdot 2R = 6\ \text{m/s}
      \qquad
      v_{\text{delante}} = \omega R\sqrt{2} = 4{,}243\ \text{m/s}
      $$

      Lo mismo sale con el campo de velocidades desde el centro:
      $\vec{v}_P = \vec{v}_O + \vec{\omega} \times \overrightarrow{OP}$. En el punto de
      arriba, las dos van hacia delante y se suman; en el delantero, una es
      horizontal y la otra vertical.

  - id: ejma7-la-deslizadera-y-coriolis
    titulo: Una deslizadera en una varilla que gira, y la aceleración de Coriolis
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Una varilla gira en un plano horizontal alrededor de su extremo fijo $O$
      con velocidad angular constante $\omega = 2\ \text{rad/s}$. Por ella corre
      una deslizadera que se aleja de $O$ a velocidad constante de 1 m/s
      respecto de la varilla. En el instante en que está a 0,5 m de $O$,
      calcular la aceleración de Coriolis y el módulo de la aceleración
      absoluta de la deslizadera.
    pide: La aceleración de Coriolis y el módulo de la aceleración absoluta.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuántos términos tiene la aceleración absoluta de la deslizadera en
          ese instante?
        opciones:
          - texto: Dos no nulos, el arrastre centrípeto y Coriolis; la relativa es nula
            correcta: true
            mensaje: |
              Eso es. El giro es uniforme, así que el arrastre es solo la
              centrípeta; la deslizadera va a velocidad relativa constante, así
              que la relativa es nula; y Coriolis existe porque hay giro y
              velocidad relativa a la vez.
          - texto: Solo la centrípeta, porque todo va a velocidad constante
            mensaje: |
              Velocidades constantes en un sistema que gira no dan
              aceleración nula. Falta Coriolis, $2\vec{\omega} \times \vec{v}_r$, que
              aquí es el término mayor.
          - texto: Ninguno, porque la deslizadera va a velocidad constante
            mensaje: |
              Va a velocidad constante **respecto de la varilla**. Vista desde
              fuera, cambia de dirección y de módulo a la vez: la trayectoria
              absoluta es una espiral.

      - tipo: calcular
        titulo: La aceleración de Coriolis
        pregunta: |
          ¿Cuánto vale la aceleración de Coriolis, en m/s²?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.02
          formato: un número, en m/s²
        distractores:
          - valor: '2'
            mensaje: |
              Te has dejado el 2 de la fórmula: $a_c = 2\,\omega\,v_r$. Son dos
              efectos iguales que se suman, no uno.
          - valor: '1'
            mensaje: |
              Has multiplicado $\omega$ por la distancia en lugar de por la
              velocidad relativa, y sin el 2. Coriolis es $2\,\omega\,v_r$.
        pista: |
          $\vec{\omega}$ es perpendicular a la varilla, así que el módulo del
          producto vectorial es el producto de los módulos.
        desarrollo: |
          $$
          a_c = 2\,\omega\,v_r = 2 \cdot 2 \cdot 1 = 4\ \text{m/s}^{2}
          $$

          Perpendicular a la varilla, en el sentido del giro.

      - tipo: calcular
        titulo: La aceleración absoluta
        pregunta: |
          ¿Cuánto vale el módulo de la aceleración absoluta, en m/s²?
        respuesta:
          tipo: numero
          valor: '4.472'
          tolerancia: 0.01
          formato: un número, en m/s²
        distractores:
          - valor: '6'
            mensaje: |
              Has sumado los módulos, $2 + 4$. La centrípeta va a lo largo de la
              varilla, hacia $O$, y Coriolis perpendicular a ella: se componen
              con Pitágoras.
          - valor: '2'
            mensaje: |
              Esa es solo la centrípeta. Falta Coriolis, que en este instante es
              el doble de grande.
        pista: |
          Centrípeta, $\omega^{2} r = 2\ \text{m/s}^{2}$, a lo largo de la varilla;
          Coriolis, 4, perpendicular.
        desarrollo: |
          $$
          a = \sqrt{2^{2} + 4^{2}} = \sqrt{20} = 4{,}472\ \text{m/s}^{2}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'El arrastre es el de un punto pegado a la varilla: centrípeta, $\omega^{2} r = 2$ m/s², hacia $O$.'
          - texto: La relativa es nula, porque la deslizadera se aleja a velocidad constante respecto de la varilla.
          - texto: Coriolis vale $2\,\omega\,v_r = 4$ m/s², perpendicular a la varilla, y el total es $\sqrt{20} = 4{,}47$ m/s².
          - texto: Como la deslizadera va a velocidad constante respecto de la varilla, Coriolis es nulo.
            trampa: true
            mensaje: |
              Coriolis no depende de que la velocidad relativa cambie, sino de
              que exista mientras el sistema gira. Es $2\vec{\omega} \times \vec{v}_r$,
              y aquí vale 4 m/s².
    resolucion: |
      **Los tres términos.** La aceleración absoluta es la de arrastre, más la
      relativa, más la de Coriolis.

      - **Arrastre:** la de un punto de la varilla a 0,5 m, que gira uniforme:
        centrípeta, $\omega^{2} r = 4 \cdot 0{,}5 = 2\ \text{m/s}^{2}$, hacia $O$.
      - **Relativa:** nula, porque la velocidad relativa es constante y la
        trayectoria relativa, recta.
      - **Coriolis:** $2\,\omega\,v_r = 2 \cdot 2 \cdot 1 = 4\ \text{m/s}^{2}$,
        perpendicular a la varilla.

      **El total.** Dos componentes perpendiculares:

      $$
      a = \sqrt{2^{2} + 4^{2}} = 4{,}472\ \text{m/s}^{2}
      $$

      Coriolis domina: una deslizadera que se aleja rápido de un eje que gira
      despacio nota más el giro por Coriolis que por la centrípeta.
