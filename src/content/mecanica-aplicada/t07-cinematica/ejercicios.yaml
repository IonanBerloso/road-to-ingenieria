        <line x1="182" y1="136" x2="172" y2="124" stroke="var(--d1)" stroke-width="1.4"/>
        <path d="M169 128 L171 119 L177 125 Z" fill="var(--d1)"/>
        <text x="180" y="148" font-size="10" fill="var(--d1)">v</text>
        <path d="M52 186 A 40 16 0 0 0 104 190" fill="none" stroke="var(--ink)" stroke-width="1"/>
