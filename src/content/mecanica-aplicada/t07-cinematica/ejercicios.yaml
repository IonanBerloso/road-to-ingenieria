    pide: La aceleración angular del disco y la aceleración del punto D, el más alto del disco.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál es el punto de referencia más cómodo para la aceleración de D?
        opciones:
          - texto: El centro C del disco, cuya aceleración es la centrípeta de su giro alrededor de Y
            correcta: true
            mensaje: |
              Eso es. C describe una circunferencia alrededor del eje
              vertical, así que su aceleración es
              $-\omega_1^{2}$ por su distancia al eje, y desde ahí se aplica
              el campo de aceleraciones del disco.
          - texto: El origen O, porque está fijo
            mensaje: |
              O está fijo, pero **no pertenece** al disco: el punto del disco
              que pasa por O no tiene velocidad nula. Aplicar el campo desde
              un punto que no es del sólido da un resultado falso.
          - texto: El punto D mismo, tomando su aceleración como nula
            mensaje: |
              D es justamente lo que hay que calcular. Y ningún punto del
              disco está en reposo permanente aquí.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el brazo y el disco, con los
          dos giros como vectores, el centro C y el punto D**. Solo las
          direcciones, sin escala.
        comprueba:
          - punto: |
              **$\vec{\omega}_1$ sobre el eje Y y $\vec{\omega}_2$ sobre BC,
              según z.**
            porque: |
              Cada giro va a lo largo de su eje: el brazo gira alrededor de Y,
              y el disco, respecto del brazo, alrededor de BC, que va en la
              dirección z.
          - punto: |
              **BC, arrastrado por el brazo, girando alrededor de Y.**
            porque: |
              BC es parte del brazo: cuando el brazo gira se lleva su
              dirección, y con ella la de $\vec{\omega}_2$, aunque su módulo
              no cambie.
          - punto: |
              **C en el eje del disco, y D, el punto más alto, 6 m por encima
              de C.**
            porque: |
              C está sobre el eje de giro propio del disco y solo se mueve con
              el brazo; D, en el borde, gira además con el disco.
        figura: |
          <svg viewBox="10 24 232 176" role="img" width="232" height="176" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">Esquema de los dos giros del disco del brazo ABC</title>
