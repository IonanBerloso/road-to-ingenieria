      - tipo: calcular
        titulo: La velocidad relativa de la deslizadera
        pregunta: |
          Con los valores de prueba $\omega = 1\ \text{rad/s}$ y
          $L = 1\ \text{m}$, ¿cuánto vale la componente $y$ de la velocidad de
          C **vista desde el plano**, en m/s?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.02
          formato: un número, en m/s, con su signo
        distractores:
          - valor: '2'
            mensaje: |
              Esa es la velocidad relativa de B, $2\omega L$ en cada
              componente. C se mueve al doble: la barra 2 aporta otro tanto en
              horizontal y cancela la vertical.
          - valor: '1'
            mensaje: |
              Ese es el orden de magnitud de la velocidad de arrastre,
              $\omega L$. La relativa la producen los giros de las barras
              dentro del plano, que van a $2\omega$.
        pista: |
          En el plano, $\vec{v}_{B/\pi} = \vec{\omega}_{1/\pi}\times
          \overrightarrow{AB}$, y luego se impone que
          $\vec{v}_{C/\pi}$ no tenga componente vertical.
        desarrollo: |
          $$
          \vec{v}_{B/\pi} = 2\omega L\,\vec{j} - 2\omega L\,\vec{k}
          \qquad
          \vec{\omega}_{2/\pi} = -2\omega\,\vec{i}
          \qquad
          \vec{v}_{C/\pi} = 4\omega L\,\vec{j}
          $$

      - tipo: calcular
        titulo: La aceleración de C
        pregunta: |
          Con $\omega = 1\ \text{rad/s}$ y $L = 1\ \text{m}$, ¿cuánto vale la
          componente $x$ de la aceleración **absoluta** de C, en m/s²?
        respuesta:
          tipo: numero
          valor: '8'
          tolerancia: 0.05
          formato: un número, en m/s², con su signo
        distractores:
          - valor: '0'
            mensaje: |
              Es el resultado de olvidar Coriolis. C se mueve dentro de un
              plano que gira, así que aparece
              $2\vec{\omega}\times\vec{v}_{C/\pi}$, y aquí es justamente la
              única componente perpendicular al plano.
          - valor: '4'
            mensaje: |
              Te has dejado el 2 de la aceleración complementaria: es
              $2\vec{\omega}\times\vec{v}_{rel}$, no
              $\vec{\omega}\times\vec{v}_{rel}$.
        pista: |
          $\vec{a}_C = \vec{a}_{arr} + \vec{a}_{rel} + 2\vec{\omega}\times
          \vec{v}_{C/\pi}$, con $\vec{v}_{C/\pi} = 4\omega L\,\vec{j}$.
        desarrollo: |
          $$
          \vec{a}_{arr} = \omega^{2}L\,\vec{j}
          \qquad
          \vec{a}_{rel} = 8\omega^{2}L\,\vec{j}
          \qquad
          \vec{a}_{cor} = 8\omega^{2}L\,\vec{i}
          $$

          $$
          \vec{a}_C = 8\omega^{2}L\,\vec{i} + 9\omega^{2}L\,\vec{j}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Con $A = (0;\ L;\ 0)$, $B = (0;\ 0;\ -L)$ y $C = (0;\ -L;\ 0)$, el plano gira a $-\omega\vec{k}$ y la barra 1 a $2\omega\vec{i}$ respecto del plano.'
          - texto: $\vec{\omega}_1 = 2\omega\vec{i}-\omega\vec{k}$ y $\vec{\omega}_2 = -2\omega\vec{i}-\omega\vec{k}$, y por Resal $\vec{\alpha}_1 = -2\omega^{2}\vec{j}$, $\vec{\alpha}_2 = 2\omega^{2}\vec{j}$.
          - texto: 'La guía obliga a $\vec{v}_{C/\pi} = 4\omega L\vec{j}$, y con el arrastre: $\vec{v}_C = -\omega L\vec{i}+4\omega L\vec{j}$.'
            # el `: ` de dentro obliga a comillas (§17)
          - texto: Como C se mueve dentro del plano, su aceleración absoluta es la suma del arrastre y la relativa.
            trampa: true
            mensaje: |
              Falta la aceleración complementaria,
              $2\vec{\omega}\times\vec{v}_{rel}$, que aquí vale
              $8\omega^{2}L\vec{i}$ y es la **única** componente
              perpendicular al plano. Sin ella la aceleración de C sale
              contenida en el plano, y no lo está.
    resolucion: |
      **1. Esquema de velocidades.** Es un problema de cinemática: el dibujo
      lleva la dirección de las velocidades que se conocen y los giros, sin
      escala.

