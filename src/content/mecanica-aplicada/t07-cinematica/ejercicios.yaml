            <text x="241" y="162" font-size="10" fill="var(--ink)">+</text>
          </svg>

      - tipo: calcular
        titulo: La componente tangencial
        pregunta: |
          ¿Cuánto vale $a_t$ en $t = 2\ \text{s}$, en m/s²?
        respuesta:
          tipo: numero
          valor: '1.9403'
          tolerancia: 0.01
          formato: un número, en m/s²
        distractores:
          - valor: '2'
            mensaje: |
              Has puesto el módulo de la aceleración entera,
              $|\vec{a}| = 2\ \text{m/s}^{2}$. Solo una parte de ella acelera
              el módulo de la velocidad; el resto curva la trayectoria.
          - valor: '0.4851'
            mensaje: |
              Ese es el valor de la componente **normal**. La tangencial es la
              proyección de $\vec{a}$ sobre $\vec{v}$, y aquí es la mayor de
              las dos.
        pista: |
          $|\vec{v}| = \sqrt{4t^{2}+1}$, así que
          $a_t = 4t/\sqrt{4t^{2}+1}$.
        desarrollo: |
          $$
          \vec{v} = 2t\,\vec{i} + \vec{j}
          \qquad
          |\vec{v}| = \sqrt{4t^{2}+1} = \sqrt{17}
          \qquad
          a_t = \frac{8}{\sqrt{17}} = 1{,}940\ \text{m/s}^{2}
          $$

      - tipo: calcular
        titulo: El radio de curvatura
        pregunta: |
          ¿Cuánto vale el radio de curvatura en ese instante, en metros?
        respuesta:
          tipo: numero
          valor: '35.05'
          tolerancia: 0.06
          formato: un número, en m
        distractores:
          - valor: '35.5'
            mensaje: |
              Es el valor que imprime la colección. Las dos comprobaciones
              nuestras —$|\vec{v}|^{2}/a_n$ y
              $|\vec{v}|^{3}/|\vec{v}\times\vec{a}|$— dan 35,05 m, así que
              parece una errata de transcripción por 35,05.
          - valor: '8.5'
            mensaje: |
              Has dividido entre el módulo total de la aceleración. Quien
              curva la trayectoria es solo la componente **normal**, 0,485
              m/s², bastante menor: el radio sale mucho mayor.
        pista: |
          $\rho = v^{2}/a_n$, con $a_n = \sqrt{a^{2}-a_t^{2}}$, donde $a$ y $v$
          son los módulos de la aceleración y de la velocidad.
        desarrollo: |
          $$
          a_n = \sqrt{2^{2}-1{,}940^{2}} = 0{,}4851\ \text{m/s}^{2}
          \qquad
          \rho = \frac{|\vec{v}|^{2}}{a_n} = \frac{17}{0{,}4851} = 35{,}05\ \text{m}
          $$

          Y por el otro camino, $\vec{v}\times\vec{a} = -2\vec{k}$, con lo que
          $\rho = |\vec{v}|^{3}/|\vec{v}\times\vec{a}| = 17\sqrt{17}/2$, el
          mismo número.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Derivando dos veces: $\vec{v} = 2t\vec{i}+\vec{j}$ y $\vec{a} = 2\vec{i}$, constante.'
          - texto: 'En $t=2$: $|\vec{v}| = \sqrt{17}$ y $a_t = \mathrm{d}|\vec{v}|/\mathrm{d}t = 8/\sqrt{17} = 1{,}94$ m/s².'
          - texto: $a_n = \sqrt{a^{2}-a_t^{2}} = 0{,}485$ m/s² y $\rho = v^{2}/a_n = 35{,}05$ m.
          - texto: Como la aceleración es constante, la trayectoria es una recta y el radio de curvatura es infinito.
            trampa: true
            mensaje: |
              Aceleración constante no implica recta: es el caso del tiro
              parabólico. La trayectoria es recta solo si $\vec{a}$ es
              paralela a $\vec{v}$, y aquí no lo es —el producto vectorial no
              se anula—.
    resolucion: |
      **1. Esquema de velocidades.** Es cinemática del punto: el dibujo lleva
      la trayectoria, el punto P donde está el cuerpo a los 2 s, su velocidad
      y su aceleración.

      <figure class="figura-examen">
      <svg viewBox="0 48 260 150" role="img" width="390" height="225" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">Esquema de la trayectoria, la velocidad y la aceleración a los 2 segundos</title>
        <desc id="dsl-d">La trayectoria del cuerpo en el plano z igual a 1, con x hacia la derecha e y hacia arriba: una parábola que sale del punto inicial subiendo y se va tumbando hacia la derecha. En ella, el punto P, donde está el cuerpo a los 2 segundos. Desde P, hacia el lado cóncavo de la curva, la normal, n, en línea fina. La velocidad, a lo largo de la tangente, hacia donde avanza el cuerpo. La aceleración, horizontal hacia la derecha, entre la tangente y la normal.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M30 150 Q30 111 232.8 72" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <line x1="150" y1="90" x2="158.5" y2="124" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="150" y1="90" x2="198.5" y2="77.9" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="196" y="68" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">v</text>
        <line x1="150" y1="90" x2="184" y2="90" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="188" y="98" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">a</text>
        <circle cx="30" cy="150" r="2.4" fill="var(--ink)"/>
        <circle cx="150" cy="90" r="2.4" fill="var(--ink)"/>
        <text x="140" y="84" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">P</text>
        <text x="36" y="162" font-size="9" text-anchor="start" fill="var(--faint)">t = 0</text>
        <text x="162" y="132" font-size="9" text-anchor="start" fill="var(--faint)">n</text>
        <text x="140" y="70" font-size="9" text-anchor="end" fill="var(--faint)">t = 2 s</text>
        <line x1="168" y1="184" x2="198" y2="184" stroke="var(--ink)" stroke-width="1" marker-end="url(#dsl-fe)"/>
        <line x1="168" y1="184" x2="168" y2="154" stroke="var(--ink)" stroke-width="1" marker-end="url(#dsl-fe)"/>
        <text x="202" y="187" font-size="9.5" font-style="italic" fill="var(--ink)">x</text>
        <text x="164" y="156" font-size="9.5" font-style="italic" text-anchor="end" fill="var(--ink)">y</text>
        <path d="M235.5 175.5 A11 11 0 1 0 215.7 173.8" fill="none" stroke="var(--ink)" stroke-width="1" marker-end="url(#dsl-fe)"/>
        <text x="241" y="162" font-size="10" fill="var(--ink)">+</text>
      </svg>
      <figcaption>

      La parábola, a escala; las flechas, sin escala. La trayectoria está en el plano z = 1, con z saliendo del papel. La velocidad va según la tangente; la aceleración se reparte en una componente según la tangente y otra según la normal, n, que apunta hacia el lado cóncavo. Ejes: x hacia la derecha, y hacia arriba; giros positivos en sentido antihorario.

      </figcaption>
      </figure>

      - **La trayectoria.** z vale 1 siempre, y de $x = t^{2}$ e $y = t$ sale
        $x = y^{2}$: una parábola en el plano $z = 1$, recorrida con x e y
        crecientes.
      - **En t = 2 s**, el cuerpo está en $P = (4,\ 2,\ 1)$, y su velocidad
        es tangente a la parábola.
      - **La aceleración** se reparte en $a_t$, según la velocidad, y $a_n$,
        según la normal, hacia el lado cóncavo, donde está el centro de
        curvatura.

      **2. Incógnitas.** $\vec{v}$, $a_t$, $a_n$ y $\rho$ en t = 2 s.

      **3. Ecuaciones.** Las derivadas del vector de posición, la tangencial
      como derivada del módulo de la velocidad, la normal como lo que queda
      de la aceleración, y el radio de curvatura:

      $$
      \vec{v} = \frac{d\vec{r}}{dt},
      \qquad
      \vec{a} = \frac{d\vec{v}}{dt},
      \qquad
      a_t = \frac{d|\vec{v}|}{dt},
      \qquad
      a_n = \sqrt{|\vec{a}|^{2} - a_t^{2}},
      \qquad
      \rho = \frac{|\vec{v}|^{2}}{a_n}
      $$

      **4. Resultados.** Derivando, $\vec{v} = 2t\,\vec{i} + \vec{j}$ y
      $\vec{a} = 2\,\vec{i}$, constante. En t = 2 s:

      $$
      \vec{v} = 4\,\vec{i} + \vec{j}\ \text{m/s},
      \qquad
      |\vec{v}| = \sqrt{17} = 4{,}123\ \text{m/s},
      \qquad
      \vec{a} = 2\,\vec{i}\ \text{m/s}^{2}
      $$

      $$
      a_t = \frac{4t}{\sqrt{4t^{2}+1}} = \frac{8}{\sqrt{17}} = 1{,}940\ \text{m/s}^{2},
      \qquad
      a_n = \sqrt{4 - \frac{64}{17}} = \frac{2}{\sqrt{17}} = 0{,}4851\ \text{m/s}^{2}
      $$

      Como vectores, $\vec{a}_t = \tfrac{8}{17}\left(4\,\vec{i} + \vec{j}\right)$
      y $\vec{a}_n = \tfrac{2}{17}\left(\vec{i} - 4\,\vec{j}\right)$ m/s²:
      la normal apunta hacia x crecientes e y decrecientes, hacia dentro de
      la parábola. Y el radio de curvatura:

      $$
      \rho = \frac{|\vec{v}|^{2}}{a_n} = \frac{17}{2/\sqrt{17}} = \frac{17\sqrt{17}}{2} = 35{,}05\ \text{m}
      $$

      La colección imprime 35,5 m; las dos cuentas de esta resolución dan
      35,05, así que el valor bueno es 35,05 y el impreso parece una errata.

      **5. Comprobación.** Por el producto vectorial, que no se ha usado:
      $\vec{v}\times\vec{a} = (4\,\vec{i} + \vec{j})\times 2\,\vec{i} = -2\,\vec{k}$,
      y

      $$
      \rho = \frac{|\vec{v}|^{3}}{|\vec{v}\times\vec{a}|} = \frac{17\sqrt{17}}{2} = 35{,}05\ \text{m}
      $$

      lo mismo. Y la tangencial, como proyección de la aceleración sobre la
      velocidad: $\vec{a}\cdot\vec{v}/|\vec{v}| = 8/\sqrt{17}$, la misma.

      **Lo que dice el resultado.** Casi toda la aceleración va ya a lo largo
      de la velocidad: a los 2 s la parábola se ha enderezado mucho, y el
      radio de curvatura es de 35 m. La normal, $a_n = 2/\sqrt{4t^{2}+1}$,
      sigue bajando con el tiempo: cuanto más avanza el cuerpo, más se parece
      su camino a una recta, aunque nunca llegue a serlo.

  - id: ejma7-col72-el-radio-de-curvatura-de-una-parabola-en-el-espacio
    titulo: El radio de curvatura de una trayectoria dada por sus tres coordenadas
    fuente: >-
      Ejercicio 7.2 · Tema 7, «Cinemática del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo. La colección imprime
      49,95 m y el cálculo exacto da 50,06 m; la diferencia es de redondeo y
      la casilla admite las dos.
    nivel: practica
    antes:
      idea: |
        El radio de curvatura mide cuánto se dobla la trayectoria en un punto:
        es el radio de la circunferencia que mejor se le ajusta ahí. Lo fija la
        aceleración normal, la parte de la aceleración perpendicular a la
        velocidad, que es la que cambia la dirección del movimiento.
      formula: |
        Con $\vec{u}_t$ el unitario de la velocidad, $\vec{u}_n$ el normal
        hacia el centro de curvatura y $\rho$ el radio de curvatura:

        $$
        \vec{a} = a_t\,\vec{u}_t + a_n\,\vec{u}_n,
        \qquad
        a_n = \frac{v^{2}}{\rho},
        \qquad
        |\vec{a}|^{2} = a_t^{2} + a_n^{2}
        $$
      reconocer: |
        Antes de calcular se mira cómo viene dada la trayectoria: tres
        coordenadas en función del tiempo.
    enunciado: |
      Una partícula móvil sigue la trayectoria determinada por los siguientes
      coeficientes en metros: $x = 3t - 1$; $y = 5t^{2} - 8t - 4$;
      $z = 15t - 6t^{2} + 1$. Calcular el radio de curvatura de la trayectoria
      a los 2 segundos de iniciar el movimiento.
    pide: El radio de curvatura de la trayectoria en t = 2 s.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué fórmula del radio de curvatura conviene aquí, con la
          trayectoria dada en coordenadas?
        opciones:
          - texto: La del producto vectorial, $\rho = |\vec{v}|^{3}/|\vec{v}\times\vec{a}|$
            correcta: true
            mensaje: |
              Es la más directa: se derivan las tres coordenadas dos veces y
              se hace un producto vectorial. Equivale a
              $\rho = |\vec{v}|^{2}/a_n$, pero sin tener que separar antes las
              componentes intrínsecas.
          - texto: La de la segunda derivada de $y$ respecto de $x$
            mensaje: |
              Esa vale para una curva plana escrita como $y(x)$. Aquí la curva
              también es plana, pero su plano no es ninguno de los coordenados
              y viene dada en función de t: hay que trabajar con los vectores.
          - texto: El radio de curvatura es la distancia al origen en ese instante
            mensaje: |
              El radio de curvatura no mide dónde está el punto, sino cuánto
              se dobla la trayectoria: es el radio de la circunferencia que
              mejor se le ajusta ahí.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **la forma de la trayectoria, el
          punto donde está la partícula a los 2 s y, en él, la velocidad y la
          aceleración**. Las flechas, sin escala.
        comprueba:
          - punto: |
              **La trayectoria es plana: una parábola.**
            porque: |
              Las tres coordenadas son de grado 2 en t, así que
              $\vec{r} = \vec{r}_0 + \vec{b}\,t + \vec{c}\,t^{2}$: la curva
              no sale del plano que pasa por $\vec{r}_0$ y contiene a
              $\vec{b}$ y a $\vec{c}$.
          - punto: |
              **La aceleración, la misma en todos los puntos, dibujada hacia
              abajo.**
            porque: |
              Derivando dos veces no queda t: la aceleración es constante y
              hace el papel de la gravedad en un tiro, con la parábola abierta
              en su sentido.
          - punto: |
              **En P, $\vec{v}$ tangente a la curva y la normal hacia dentro
              de ella.**
            porque: |
              La velocidad es siempre tangente a la trayectoria, y la normal
              apunta hacia el centro de curvatura, en el lado cóncavo.
        figura: |
          <svg viewBox="14 40 200 158" role="img" width="200" height="158" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">Esquema de la trayectoria en su propio plano, con la velocidad y la aceleración a los 2 segundos</title>
            <desc id="dsl-d">La trayectoria dibujada en su propio plano: una parábola como la de un tiro, que sale del punto inicial subiendo, llega a lo más alto y baja. La aceleración, constante, hace el papel de la gravedad y se dibuja hacia abajo. En la bajada, el punto P, donde está la partícula a los 2 segundos; en él, la velocidad, tangente a la curva y hacia abajo, y la aceleración, vertical hacia abajo, separadas un ángulo pequeño. Desde P, hacia dentro de la curva, la normal n, en línea fina.</desc>
