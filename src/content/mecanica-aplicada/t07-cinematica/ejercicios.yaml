        <text x="62" y="110" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">B</text>
        <circle cx="150" cy="112" r="2.4" fill="var(--ink)"/>
        <text x="152" y="128" font-size="10" text-anchor="middle" font-weight="700" fill="var(--ink)">C</text>
        <circle cx="182" cy="56.6" r="2.4" fill="var(--ink)"/>
        <text x="188" y="52" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">D</text>
        <text x="254" y="155" font-size="9" text-anchor="start" fill="var(--faint)">X</text>
        <text x="66" y="20" font-size="9" text-anchor="end" fill="var(--faint)">Y</text>
        <text x="30" y="182" font-size="9" text-anchor="end" fill="var(--faint)">Z</text>
      </svg>
      <figcaption>

      Solo las direcciones, sin escala para los vectores. La velocidad angular de la barra, ω₁, va sobre Y; la del brazo respecto de la barra, ω₂, perpendicular al plano XY en el que se mueve el brazo: se dibuja en C, según −z, el sentido que marca el enunciado. La articulación de C es parte de la barra y gira con ella alrededor de Y.

      </figcaption>
      </figure>

      - **La barra BC**, con el sólido AB, gira a $\omega_1 = 0{,}6$ rad/s,
        constante, alrededor de Y, que es fijo.
      - **El brazo CD** gira respecto de la barra a $\omega_2 = 0{,}45$ rad/s,
        constante, alrededor de C y dentro del plano XY: su vector va según
        z, y el sentido de la figura es −z.
      - **La articulación de C** es parte de la barra: su dirección gira
        alrededor de Y.
      - **C**, con el origen en A, está en $(20;\ 10;\ 0)$ mm. **D**, con
        β = 120° medido desde CB, en
        $\overrightarrow{CD} = 16\,(\cos 60^\circ;\ \sin 60^\circ;\ 0) = (8;\ 13{,}86;\ 0)$ mm.

      **2. Incógnitas.** $\vec{\alpha}$ del brazo, $\vec{v}_D$ y
      $\vec{a}_D$.

      **3. Ecuaciones.** Los giros y la aceleración angular: los dos
      módulos son constantes, y $d\vec{k}/dt = \vec{\omega}_1\times\vec{k}$
      porque la articulación gira con la barra:

      $$
      \vec{\omega} = \omega_1\,\vec{j} - \omega_2\,\vec{k},
      \qquad
      \vec{\alpha} = -\omega_2\,\frac{d\vec{k}}{dt} = \vec{\omega}_1\times\vec{\omega}_2
      $$

      C es un punto de la barra, que gira uniforme alrededor de Y; y D,
      desde C, por los campos del brazo:

      $$
      \vec{v}_C = \vec{\omega}_1\times\overrightarrow{AC},
      \qquad
      \vec{a}_C = \vec{\omega}_1\times\vec{v}_C
      $$

      $$
      \vec{v}_D = \vec{v}_C + \vec{\omega}\times\overrightarrow{CD},
      \qquad
      \vec{a}_D = \vec{a}_C + \vec{\alpha}\times\overrightarrow{CD}
      + \vec{\omega}\times\left(\vec{\omega}\times\overrightarrow{CD}\right)
      $$

      **4. Resultados.**

      $$
      \vec{\omega} = 0{,}6\,\vec{j} - 0{,}45\,\vec{k}\ \text{rad/s},
      \qquad
      \vec{\alpha} = 0{,}6\,\vec{j}\times\left(-0{,}45\,\vec{k}\right) = -0{,}27\,\vec{i}\ \text{rad/s}^{2}
      $$

      C gira a 20 mm del eje: $\vec{v}_C = -12\,\vec{k}$ mm/s y
      $\vec{a}_C = -7{,}2\,\vec{i}$ mm/s². Con
      $\vec{\omega}\times\overrightarrow{CD} = (6{,}235;\ -3{,}6;\ -4{,}8)$
      mm/s:

      $$
      \vec{v}_D = 6{,}23\,\vec{i} - 3{,}6\,\vec{j} - 16{,}8\,\vec{k}\ \text{mm/s},
      \qquad
      |\vec{v}_D| = 18{,}28\ \text{mm/s}
      $$

      Con $\vec{\alpha}\times\overrightarrow{CD} = -3{,}741\,\vec{k}$ y
      $\vec{\omega}\times(\vec{\omega}\times\overrightarrow{CD}) = (-4{,}5;\ -2{,}806;\ -3{,}741)$:

      $$
      \vec{a}_D = -11{,}7\,\vec{i} - 2{,}81\,\vec{j} - 7{,}48\,\vec{k}\ \text{mm/s}^{2},
      \qquad
      |\vec{a}_D| = 14{,}17\ \text{mm/s}^{2}
      $$

      **5. Comprobación.** Por la composición de movimientos, que no se ha
      usado: la barra arrastra y el brazo gira respecto de ella alrededor de
      C. El punto de la barra que coincide con D está en
      $\overrightarrow{AD} = (28;\ 23{,}86;\ 0)$ mm, a 28 mm del eje Y: en
      velocidades, arrastre $\vec{\omega}_1\times\overrightarrow{AD} = -16{,}8\,\vec{k}$
      y relativa
      $\vec{v}_{\text{rel}} = \vec{\omega}_2\times\overrightarrow{CD} = (6{,}235;\ -3{,}6;\ 0)$,
      que suman lo de arriba. En aceleraciones, arrastre
      $-\omega_1^{2}\cdot 28\,\vec{i} = -10{,}08\,\vec{i}$, relativa
      $-\omega_2^{2}\,\overrightarrow{CD} = (-1{,}62;\ -2{,}806;\ 0)$ y
      Coriolis:

      $$
      2\,\vec{\omega}_1\times\vec{v}_{\text{rel}} = 2\cdot 0{,}6\,\vec{j}\times(6{,}235;\ -3{,}6;\ 0) = -7{,}482\,\vec{k}
      $$

      La suma, $(-11{,}70;\ -2{,}806;\ -7{,}482)$ mm/s², es la misma.

      **Lo que dice el resultado.** Los −16,8 mm/s de D según z son enteros
      del arrastre: un punto a 28 mm del eje Y que gira a 0,6 rad/s; el giro
      del brazo solo le añade velocidad dentro del plano XY. En la
      aceleración, la componente z, −7,48 mm/s², es toda acoplamiento de los
      dos giros: en la resolución sale mitad de
      $\vec{\alpha}\times\overrightarrow{CD}$ y mitad del producto doble, y
      en la comprobación, entera, de Coriolis. Con la aceleración de C sola
      quedarían −7,2 en x y nada en las otras dos.

  - id: ejma7-col711-el-disco-del-brazo-bcd
    titulo: El disco horizontal del brazo BCD que gira alrededor de Z
    fuente: >-
      Ejercicio 7.11 · Tema 7, «Cinemática del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    antes:
      idea: |
        El disco tiene dos giros: el del brazo BCD alrededor de Z, que se
        lleva el eje del disco, y el suyo propio alrededor de CB. Su velocidad
        angular es la suma vectorial de los dos, su aceleración angular es la
        derivada de esa suma, y los campos de velocidades y de aceleraciones
        dan las de A desde otro punto del disco.
      formula: |
        La composición de los giros, la aceleración angular y los dos campos,
        con P y A dos puntos del disco:

        $$
        \vec{\omega} = \vec{\omega}_1 + \vec{\omega}_2,
        \qquad
        \vec{\alpha} = \frac{d\vec{\omega}}{dt}
        $$

        $$
        \vec{v}_A = \vec{v}_P + \vec{\omega}\times\overrightarrow{PA},
        \qquad
        \vec{a}_A = \vec{a}_P + \vec{\alpha}\times\overrightarrow{PA}
        + \vec{\omega}\times\left(\vec{\omega}\times\overrightarrow{PA}\right)
        $$
      reconocer: |
        Antes de calcular se mira cómo se mueve cada parte: el brazo BCD y el
        disco respecto de él.
    enunciado: |
      El brazo BCD gira con respecto al eje Z con una velocidad constante
      ω₁ = 5 rad/s. El disco gira a su vez con una velocidad angular constante
      ω₂ = 4 rad/s. Determinar:

      a) Aceleración angular del disco.

      b) Velocidad y aceleración del punto A.

