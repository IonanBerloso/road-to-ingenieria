    pide: La velocidad angular de la esfera, sus componentes de pivotamiento y rodadura sobre el cono móvil, la velocidad de G y la aceleración angular.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuáles son aquí los dos puntos de velocidad nula de la esfera?
        opciones:
          - texto: El contacto con el plano fijo y el contacto con el cono fijo
            correcta: true
            mensaje: |
              Eso es. Son las dos superficies que no se mueven, y como la
              esfera no desliza en ellas, esos dos puntos tienen velocidad
              nula: el EIRD es la recta que los une.
          - texto: El contacto con el cono móvil y el centro de la esfera
            mensaje: |
              El cono móvil gira, así que su punto de contacto **no** está
              parado; y el centro de la esfera se mueve, describiendo una
              circunferencia alrededor del eje.
          - texto: El vértice O del cono móvil y el centro de la esfera
            mensaje: |
              O no es un punto de la esfera. Los puntos parados de la esfera
              son los que tocan superficies fijas.

      - tipo: calcular
        titulo: La velocidad angular de la esfera
        pregunta: |
          Con el valor de prueba $\omega = 6\ \text{rad/s}$, ¿cuánto vale la
          componente $x$ de $\vec{\omega}_e$, en rad/s?
        respuesta:
          tipo: numero
          valor: '1.732'
          tolerancia: 0.01
          formato: un número, en rad/s, con su signo
        distractores:
          - valor: '-3'
            mensaje: |
              Esa es la componente $z$, $-\omega/2$. La componente $x$ vale
              $\sqrt{3}\omega/6$, tres veces menor en módulo.
          - valor: '5.196'
            mensaje: |
              Has puesto $\sqrt{3}\omega/2$ en lugar de $\sqrt{3}\omega/6$.
              Repasa la condición de rodadura sobre el cono móvil: el contacto
              M está a $R/4$ del eje, no a $3R/4$.
        pista: |
          El EIRD une el contacto con el plano y el contacto con el cono fijo:
          su dirección es $(1;\ 0;\ -\sqrt{3})$. El módulo lo fija la rodadura
          sobre el cono móvil.
        desarrollo: |
          $$
          \vec{\omega}_e = \frac{\sqrt{3}\,\omega}{6}\,\vec{i} - \frac{\omega}{2}\,\vec{k}
          = 1{,}732\,\vec{i} - 3\,\vec{k}\ \text{rad/s}
          $$

          con $\omega = 6$ rad/s.

      - tipo: calcular
        titulo: El pivotamiento sobre el cono móvil
        pregunta: |
          Con $\omega = 6\ \text{rad/s}$, ¿cuánto vale el módulo de la
          componente de pivotamiento del movimiento de la esfera relativo al
          cono móvil, en rad/s?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.02
          formato: un número, en rad/s
        distractores:
          - valor: '6'
            mensaje: |
              Ese es $\omega$ entero. El pivotamiento es la proyección de
              $\vec{\omega}_{rel}$ sobre la normal del contacto, y vale
              $\omega/2$.
          - valor: '8.66'
            mensaje: |
              Ese es el módulo de la rodadura, la componente contenida en el
              plano tangente. El pivotamiento es la perpendicular a ese plano
              y vale bastante menos.
        pista: |
          $\vec{\omega}_{rel} = \vec{\omega}_e - \omega\vec{k}$, y la normal
          del contacto con el cono móvil es
          $\vec{n} = (\sqrt{3}/2;\ 0;\ 1/2)$.
        desarrollo: |
          $$
          \vec{\omega}_{rel} = \frac{\sqrt{3}\omega}{6}\,\vec{i} - \frac{3\omega}{2}\,\vec{k}
          \qquad
          \vec{\omega}_{piv} = -\frac{\omega}{2}\left(\frac{\sqrt{3}}{2}\,\vec{i} + \frac{1}{2}\,\vec{k}\right)
          $$

          y la rodadura, lo que queda:
          $\vec{\omega}_{rod} = \frac{5\omega}{2}\left(\frac{\sqrt{3}}{6}\vec{i} - \frac{1}{2}\vec{k}\right)$.
          Las dos coinciden con las impresas en la colección.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'La geometría da el centro a $R/2$ del eje y a $R/(2\sqrt{3})$ por debajo del plano: los contactos son T con el plano, P con el cono fijo y M con el móvil.'
          - texto: 'T y P están fijos: el EIRD es la recta TP, de dirección $(1;\ 0;\ -\sqrt{3})$.'
          - texto: La rodadura sobre el cono móvil en M fija el módulo y da $\vec{\omega}_e = (\sqrt{3}\omega/6)\vec{i} - (\omega/2)\vec{k}$.
          - texto: El pivotamiento relativo al cono móvil es nulo, porque la esfera no desliza sobre él.
            trampa: true
            mensaje: |
              No deslizar solo obliga a que la **velocidad** relativa del
              punto de contacto sea nula; la velocidad angular relativa puede
              tener componente normal, y aquí la tiene: el pivotamiento vale
              $\omega/2$. Una peonza pivota sin deslizar.
    resolucion: |
      **La geometría.** Que la esfera toque a la vez el cono móvil, el fijo y
      el plano fija su posición: el centro G queda a $R/2$ del eje y a
      $R/(2\sqrt{3})$ por debajo del plano —su propio radio—. Los contactos
      son T con el plano (justo encima de G), M con el cono móvil y P con el
      cono fijo.

      **a) La velocidad angular.** El plano y el cono fijo no se mueven y la
      esfera no desliza, así que T y P tienen velocidad nula y el EIRD es la
      recta TP, de dirección $(1;\ 0;\ -\sqrt{3})$. El módulo lo da la
      rodadura sobre el cono móvil: en M —que está a $R/4$ del eje— la esfera
      tiene que llevar la misma velocidad que el cono, $\omega R/4$. Sale

      $$
      \vec{\omega}_e = \frac{\sqrt{3}\,\omega}{6}\,\vec{i} - \frac{\omega}{2}\,\vec{k}
      $$

      **b) Pivotamiento y rodadura sobre el cono móvil.** Con
      $\vec{\omega}_{rel} = \vec{\omega}_e - \omega\vec{k}$ y la normal
      $(\sqrt{3}/2;\ 0;\ 1/2)$:

      $$
      \vec{\omega}_{piv} = -\frac{\omega}{2}\left(\frac{\sqrt{3}}{2}\,\vec{i}+\frac{1}{2}\,\vec{k}\right)
      \qquad
      \vec{\omega}_{rod} = \frac{5\omega}{2}\left(\frac{\sqrt{3}}{6}\,\vec{i}-\frac{1}{2}\,\vec{k}\right)
      $$

      **c) El centro y la aceleración angular.**

      $$
      \vec{v}_G = \vec{\omega}_e \times \overrightarrow{TG} = \frac{\omega R}{12}\,\vec{j}
      $$

      Es decir, G rodea el eje a $\Omega = \omega/6$, y como
      $\vec{\omega}_e$ gira con él sin cambiar de módulo,

      $$
      \vec{\alpha}_e = \Omega\,\vec{k}\times\vec{\omega}_e
      = \frac{\sqrt{3}\,\omega^{2}}{36}\,\vec{j}
      $$
  - id: ejma7-col717-el-satelite-con-barra-y-masa-deslizante
    titulo: El satélite con una barra articulada y una masa que desliza por ella
    fuente: >-
      Ejercicio 7.17 · Tema 7, «Cinemática del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo. La colección solo imprime
      la aceleración relativa al satélite; nuestra comprobación muestra que la
      absoluta coincide con ella, y las dos se publican. Las casillas piden el
      número con los valores de prueba que se declaran en cada pregunta.
    nivel: practica
    enunciado: |
      La figura muestra un esquema similar al usado por un satélite de
      comunicaciones. Un cilindro de radio R, gira con velocidad angular
      constante ω alrededor de su eje de revolución. Una barra AB, está
      articulada en la periferia del cilindro (punto A) y se mueve
      relativamente a éste en un plano perpendicular OXZ con velocidad angular
      relativa constante ω. Finalmente, una masa M se desplaza a lo largo de
      AB con velocidad relativa a la barra constante de valor
      $v_M = \omega R\sqrt{2}$. Cuando AB forma 45º con la superficie superior
      del cilindro, la distancia AM es R√2. Calcular en ese instante:

      a) Velocidad angular absoluta de la barra AB.

      b) Velocidad absoluta de la masa M.

      c) Aceleración angular absoluta de la barra AB.

      d) Aceleración absoluta de la masa M.

      e) Aceleración de la masa M relativa al satélite.

      <figure>
      <svg viewBox="0 0 300 190" role="img" width="300" height="190" aria-labelledby="ma7c17-t ma7c17-d">
        <title id="ma7c17-t">Cilindro giratorio con una barra articulada en su periferia y una masa que desliza</title>
        <desc id="ma7c17-d">Un cilindro de radio R gira alrededor de su eje vertical Z con velocidad angular omega. En el punto A de su borde superior se articula la barra AB, que forma 45 grados con la superficie superior del cilindro y gira en el plano OXZ. La masa M desliza por la barra alejándose de A; en el instante dibujado está a una distancia R raíz de dos de A, es decir, justo encima del eje.</desc>
        <ellipse cx="170" cy="110" rx="60" ry="18" fill="var(--d2)" fill-opacity="0.3" stroke="var(--ink)" stroke-width="1.2"/>
        <path d="M110 110 V150 A 60 18 0 0 0 230 150 V110" fill="var(--d2)" fill-opacity="0.22" stroke="var(--ink)" stroke-width="1.2"/>
        <line x1="170" y1="110" x2="170" y2="18" stroke="var(--ink)" stroke-width="1"/>
        <text x="164" y="15" font-size="10" fill="var(--ink)">Z</text>
        <line x1="170" y1="110" x2="252" y2="146" stroke="var(--ink)" stroke-width="1"/>
        <text x="256" y="150" font-size="10" fill="var(--ink)">Y</text>
        <line x1="170" y1="110" x2="86" y2="110" stroke="var(--ink)" stroke-width="1"/>
        <text x="76" y="113" font-size="10" fill="var(--ink)">X</text>
        <text x="174" y="122" font-size="10" fill="var(--ink)">O</text>
        <line x1="110" y1="110" x2="228" y2="26" stroke="var(--ink)" stroke-width="2.6"/>
        <circle cx="110" cy="110" r="3.6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.4"/>
        <text x="100" y="122" font-size="10" fill="var(--ink)">A</text>
        <text x="232" y="24" font-size="10" fill="var(--ink)">B</text>
        <rect x="163" y="43" width="14" height="12" rx="2" fill="var(--d1)" fill-opacity="0.5" stroke="var(--ink)" stroke-width="1" transform="rotate(-35 170 49)"/>
        <text x="152" y="44" font-size="10" fill="var(--d1)">M</text>
        <line x1="182" y1="44" x2="200" y2="31" stroke="var(--d1)" stroke-width="1.5"/>
        <path d="M196 27 L204 28 L200 35 Z" fill="var(--d1)"/>
        <text x="200" y="46" font-size="10" fill="var(--d1)">v</text>
        <path d="M132 110 A 22 22 0 0 0 128 96" fill="none" stroke="var(--ink)" stroke-width="1"/>
        <text x="132" y="102" font-size="9" fill="var(--ink)">45°</text>
        <path d="M186 96 A 20 8 0 0 1 214 100" fill="none" stroke="var(--ink)" stroke-width="1.1"/>
        <text x="218" y="102" font-size="10" fill="var(--ink)">ω</text>
        <line x1="110" y1="168" x2="170" y2="168" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="140" y="180" font-size="9" text-anchor="middle" fill="var(--faint)">R</text>
      </svg>
      </figure>
    pide: La velocidad y aceleración angulares de la barra y la velocidad y aceleración de la masa, absolutas y relativas al satélite.
    pasos:
      - tipo: reconocer
        pregunta: |
          En ese instante, ¿dónde está la masa M?
        opciones:
          - texto: Justo sobre el eje del cilindro, a una altura R
            correcta: true
            mensaje: |
              Eso es, y simplifica mucho: con AM = R√2 y la barra a 45°, M
              avanza R hacia el eje y sube R. Al estar en el eje, el arrastre
              del cilindro sobre ella es nulo.
          - texto: En el borde del cilindro, a la altura de A
            mensaje: |
              Ese es el punto A. M ya se ha desplazado R√2 a lo largo de la
              barra, que sube a 45°.
          - texto: A una distancia R√2 del eje, en la superficie superior
            mensaje: |
              R√2 es la distancia recorrida **sobre la barra**, no la
              distancia al eje. Como la barra sube a 45° hacia el eje, M queda
              sobre él.

      - tipo: calcular
        titulo: La velocidad absoluta de la masa
        pregunta: |
          Con los valores de prueba $\omega = 2\ \text{rad/s}$ y
          $R = 0{,}5\ \text{m}$, ¿cuánto vale la componente $z$ de
          $\vec{v}_M$, en m/s?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.02
          formato: un número, en m/s, con su signo
        distractores:
          - valor: '1'
            mensaje: |
              Solo has contado una de las dos aportaciones. La componente
              vertical de la velocidad relativa vale $\omega R$ y la del
              arrastre de la barra, otro tanto: se suman.
          - valor: '1.414'
            mensaje: |
              Ese es $v_M = \omega R\sqrt{2}$, el módulo de la velocidad
              **relativa** a la barra. Su componente vertical es $\omega R$, y
              hay que sumarle el arrastre.
        pista: |
          A la velocidad del punto de la barra que coincide con M
          —$\vec{v}_A + \vec{\omega}_{AB}\times\overrightarrow{AM}$— hay que
          sumarle la relativa. Y $\vec{v}_A = \omega R\,\vec{j}$.
        desarrollo: |
          $$
          \vec{v}_M = 2\omega R\,\vec{k} = 2\ \text{m/s}\ \text{en } z
          $$

          Las componentes horizontales se cancelan: el arrastre lleva a M
          hacia $-x$ tanto como la velocidad relativa la lleva hacia $+x$.

      - tipo: calcular
        titulo: La aceleración absoluta de la masa
        pregunta: |
          Con los mismos valores, ¿cuánto vale la componente $x$ de
          $\vec{a}_M$, en m/s²?
        respuesta:
          tipo: numero
          valor: '6'
          tolerancia: 0.05
          formato: un número, en m/s², con su signo
        distractores:
          - valor: '2'
            mensaje: |
              Te has quedado con $\omega^{2}R$. La aceleración de M tiene tres
              orígenes —el arrastre de la barra, la aceleración angular y
              Coriolis— y en $x$ suman $3\omega^{2}R$.
          - valor: '4'
            mensaje: |
              Ese es el término de Coriolis solo,
              $2\omega^{2}R$. Falta lo que aporta el movimiento de la barra
              como sólido, que en $x$ vale otro $\omega^{2}R$.
        pista: |
          Con la barra como sólido de referencia:
          $\vec{a}_M = \vec{a}_{arr} + 2\,\vec{\omega}_{AB}\times\vec{v}_{rel}$,
          porque la relativa es nula.
        desarrollo: |
          $$
          \vec{a}_M = 3\omega^{2}R\,\vec{i} + \omega^{2}R\,\vec{k}
          = 6\,\vec{i} + 2\,\vec{k}\ \text{m/s}^{2}
          $$

          Y como M está en el eje y su velocidad relativa al cilindro es
          axial, el arrastre y el Coriolis del cilindro se anulan: la
          aceleración relativa al satélite es esa misma.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: $\vec{\omega}_{AB} = \omega\vec{j}+\omega\vec{k}$ y, por Resal, $\vec{\alpha}_{AB} = \omega\vec{k}\times\omega\vec{j} = -\omega^{2}\vec{i}$.
          - texto: 'Con $A = (R;\ 0;\ 0)$ y $M = (0;\ 0;\ R)$: $\vec{v}_A = \omega R\vec{j}$ y $\vec{v}_{rel} = \omega R(-\vec{i}+\vec{k})$.'
          - texto: Sumando arrastre y relativa, $\vec{v}_M = 2\omega R\vec{k}$; y con Coriolis, $\vec{a}_M = 3\omega^{2}R\vec{i}+\omega^{2}R\vec{k}$.
          - texto: Como la masa recorre la barra a velocidad constante y los dos giros son constantes, su aceleración es nula.
            trampa: true
            mensaje: |
              Tres velocidades constantes no dan aceleración nula cuando todo
              gira: hay centrípetas, hay aceleración angular por Resal y hay
              Coriolis. De hecho $|\vec{a}_M| = \sqrt{10}\,\omega^{2}R$.
    resolucion: |
      **La posición.** Con la barra a 45° y AM = R√2, la masa está justo sobre
      el eje, a la altura R: $A = (R;\ 0;\ 0)$ y $M = (0;\ 0;\ R)$.

      **a) y c).** La barra gira con el cilindro y además respecto de él:

      $$
      \vec{\omega}_{AB} = \omega\,\vec{j} + \omega\,\vec{k}
      \qquad
      \vec{\alpha}_{AB} = \omega\vec{k}\times\omega\vec{j} = -\omega^{2}\,\vec{i}
      $$

      **b) La velocidad de M.** Arrastre de la barra más velocidad relativa:

      $$
      \vec{v}_M = \left(\vec{v}_A + \vec{\omega}_{AB}\times\overrightarrow{AM}\right)
      + \vec{v}_{rel} = 2\omega R\,\vec{k}
      $$

      **d) La aceleración de M.** La relativa a la barra es nula —velocidad
      constante sobre una recta—, así que quedan el arrastre y la
      complementaria:

      $$
      \vec{a}_{arr} = \omega^{2}R\,(\vec{i}+2\vec{j}-\vec{k})
      \qquad
      \vec{a}_{cor} = 2\vec{\omega}_{AB}\times\vec{v}_{rel} = 2\omega^{2}R\,(\vec{i}-\vec{j}+\vec{k})
      $$

      $$
      \vec{a}_M = 3\omega^{2}R\,\vec{i} + \omega^{2}R\,\vec{k}
      $$

      **e) Relativa al satélite.** M está sobre el eje del cilindro y su
      velocidad relativa a él es vertical, así que el arrastre y el Coriolis
      del cilindro se anulan y la aceleración relativa coincide con la
      absoluta: $3\omega^{2}R\,\vec{i} + \omega^{2}R\,\vec{k}$, que es el
      resultado impreso.

  - id: ejma7-col718-el-plano-que-gira-con-eje-barra-y-masa
    titulo: El plano giratorio con el eje AB, la barra CD y una masa que desliza
    fuente: >-
      Ejercicio 7.18 · Tema 7, «Cinemática del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo, incluida una derivación
      numérica de la posición de M. Las casillas piden el número con los
      valores de prueba que se declaran en cada pregunta.
    nivel: practica
    enunciado: |
      Un plano π gira alrededor del eje fijo OZ con velocidad angular
      constante ω. En ese plano, se encuentra definido el sistema siguiente:

      - Un eje horizontal AB soldado al eje vertical a una altura L.

      - Una barra CD cuyo extremo C desliza con velocidad relativa constante v
      (respecto de AB). La barra gira al mismo tiempo alrededor de C con
      velocidad angular ω.

      - Una masa puntual M que desliza a lo largo de CD con velocidad relativa
      constante v.

      En el instante ωt = π/2, la masa M se sitúa en el extremo C de la barra
      y la distancia AC = L. Para ese instante, calcular:

      a) Velocidad angular absoluta del eje AB.

      b) Aceleración angular absoluta de la barra AB.

      c) Velocidad angular absoluta de la barra CD.

      d) Aceleración angular absoluta de la barra CD.

      e) Aceleración absoluta de la masa puntual M.

