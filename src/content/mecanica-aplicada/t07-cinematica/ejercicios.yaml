          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M210 98 A36 36 0 1 0 138 98 A36 36 0 1 0 210 98 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <line x1="60" y1="165" x2="60" y2="117" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
        <line x1="60" y1="117" x2="150" y2="117" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
        <line x1="150" y1="117" x2="174" y2="98" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
        <line x1="60" y1="117" x2="60" y2="34" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="60" y1="165" x2="232" y2="165" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="60" y1="165" x2="26" y2="185" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="174" y1="98" x2="174" y2="62" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="60" y1="108" x2="60" y2="74" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="66" y="82" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">ω<tspan font-size="7.5" dy="2.5">1</tspan><tspan dy="-2.5"></tspan></text>
