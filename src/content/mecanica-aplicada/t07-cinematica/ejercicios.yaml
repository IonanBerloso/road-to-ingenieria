        <line x1="64.7" y1="99.7" x2="115.3" y2="60.3" stroke="var(--d2)" stroke-width="3.5"/>
        <circle cx="64.7" cy="99.7" r="3.2" fill="var(--ink)"/>
        <circle cx="115.3" cy="60.3" r="3.2" fill="var(--ink)"/>
        <circle cx="195.7" cy="118.5" r="3.4" fill="var(--d1)"/>
        <text x="52" y="98" font-size="10" fill="var(--ink)">A</text>
        <text x="118" y="56" font-size="10" fill="var(--ink)">B</text>
