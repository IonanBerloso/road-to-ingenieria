      Solo las direcciones, sin escala, visto de frente, con z hacia el observador. C está sobre la vertical alrededor de la que gira el eje AB, y no se mueve. A gira alrededor de esa vertical a la distancia R: su velocidad es perpendicular al papel. El giro propio del disco va sobre AB, dibujado según x; el signo dirá su sentido. D no desliza. Ejes: x hacia la derecha, y hacia arriba; giros positivos en sentido antihorario.

      </figcaption>
      </figure>

      - **La notación.** El enunciado llama R al radio de los discos; aquí,
        como en el resultado de la colección, r es el radio de los discos y R
        el semieje, $CA = CB = R$.
      - **C**, el centro del eje, está sobre la vertical alrededor de la que
        gira AB: no se mueve. $\vec{\omega}_1$ va sobre esa vertical; el
        enunciado no da el sentido y se toma hacia arriba.
      - **A** gira alrededor de la vertical a la distancia R: su velocidad es
        perpendicular al papel, saliendo de él.
      - **El giro propio** del disco, $\vec{\omega}_p$, va sobre AB; se dibuja
        según x.
      - **D** no desliza: $\vec{v}_D = \vec{0}$.

      **2. Incógnitas.** $\omega_p$, y con él $\vec{\omega}_A$; la
      aceleración angular $\vec{\alpha}$ del disco; $\vec{a}_D$; y el eje
      instantáneo de rotación.

      **3. Ecuaciones.** Origen en el suelo, bajo C; x según AB, y vertical
      y z hacia el observador. Entonces $C = (0;\ r;\ 0)$,
      $A = (-R;\ r;\ 0)$, $D = (-R;\ 0;\ 0)$ y
      $\vec{\omega}_A = \omega_p\,\vec{i} + \omega_1\,\vec{j}$. La velocidad
      de A, desde C fijo, y la condición de rodadura:

      $$
      \vec{v}_A = \vec{\omega}_1\times\overrightarrow{CA},
      \qquad
      \vec{v}_D = \vec{v}_A + \vec{\omega}_A\times\overrightarrow{AD} = \vec{0}
      $$

      La aceleración angular: $\omega_1\vec{j}$ no cambia, pero $\vec{i}$, la
      dirección del eje AB, gira con él: $d\vec{i}/dt = \vec{\omega}_1\times\vec{i}$.
      Y la aceleración de D, desde A:

      $$
      \vec{\alpha} = \omega_p\,\vec{\omega}_1\times\vec{i},
      \qquad
      \vec{a}_A = \vec{\omega}_1\times\left(\vec{\omega}_1\times\overrightarrow{CA}\right),
      \qquad
      \vec{a}_D = \vec{a}_A + \vec{\alpha}\times\overrightarrow{AD}
      + \vec{\omega}_A\times\left(\vec{\omega}_A\times\overrightarrow{AD}\right)
      $$

      **4. Resultados.** **a)** $\vec{v}_A = \omega_1 R\,\vec{k}$ y
      $\vec{\omega}_A\times(-r\,\vec{j}) = -\omega_p r\,\vec{k}$, así que la
      rodadura da $\omega_p = \omega_1 R/r$, positivo: va según x, como se
      dibujó.

      $$
      \vec{\omega}_A = \frac{\omega_1 R}{r}\,\vec{i} + \omega_1\,\vec{j}
      $$

      **b)** La aceleración angular:

      $$
      \vec{\alpha} = \frac{\omega_1 R}{r}\,\omega_1\,\vec{j}\times\vec{i} = -\frac{\omega_1^{2}R}{r}\,\vec{k}
      $$

      **c)** Con $\vec{a}_A = \omega_1^{2}R\,\vec{i}$, hacia la vertical, y
      $\overrightarrow{AD} = -r\,\vec{j}$:
      $\vec{\alpha}\times\overrightarrow{AD} = -\omega_1^{2}R\,\vec{i}$ y
      $\vec{\omega}_A\times(\vec{\omega}_A\times\overrightarrow{AD}) = -\omega_1^{2}R\,\vec{i} + (\omega_1^{2}R^{2}/r)\,\vec{j}$:

      $$
      \vec{a}_D = -\omega_1^{2}R\,\vec{i} + \frac{\omega_1^{2}R^{2}}{r}\,\vec{j}
      $$

      Con $\omega_1 = 2$ rad/s, $R = 0{,}3$ m y $r = 0{,}2$ m:
      $\vec{\omega}_A = 3\,\vec{i} + 2\,\vec{j}$ rad/s,
      $\vec{\alpha} = -6\,\vec{k}$ rad/s² y
      $\vec{a}_D = -1{,}2\,\vec{i} + 1{,}8\,\vec{j}$ m/s².

      **d)** El eje instantáneo de rotación del disco A pasa por los dos
      puntos suyos de velocidad nula: C, sobre el eje AB y sobre la vertical,
      y D. Es la recta CD. Al girar el conjunto, esa recta barre en el
      espacio el **axoide fijo**, un cono de vértice C y eje vertical que
      toca el suelo en la circunferencia que recorren los contactos; y dentro
      del disco, el **axoide móvil**, un cono de vértice C y eje AB que tiene
      por base el borde del disco. El móvil rueda sobre el fijo a lo largo de
      CD.

      <figure class="figura-examen">
      <svg viewBox="20 44 220 162" role="img" width="330" height="243" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">El eje instantáneo de rotación del disco A y sus dos axoides, vistos de frente</title>
        <desc id="dsl-d">La misma vista de frente. El eje instantáneo de rotación y deslizamiento del disco A, una recta gruesa que pasa por C y por el contacto D. A trazos, el axoide fijo: el cono de vértice C y eje vertical que pasa por D y por E, con la base en el suelo. A trazos también, el axoide móvil: el cono de vértice C y eje AB que pasa por el borde del disco A, de D hasta su punto más alto. Los dos conos se tocan a lo largo de CD.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M87 80 H93 V160 H87 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M207 80 H213 V160 H207 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M40 160 H240" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M171 106 L84 164" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="90" y1="120" x2="210" y2="120" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
        <path d="M150 120 L210 160" fill="none" stroke="var(--ink)" stroke-width="1" stroke-dasharray="4 3"/>
        <path d="M150 120 L90 80" fill="none" stroke="var(--ink)" stroke-width="1" stroke-dasharray="4 3"/>
        <line x1="150" y1="88" x2="150" y2="172" stroke="var(--faint)" stroke-width="0.7"/>
        <circle cx="150" cy="120" r="2.4" fill="var(--ink)"/>
        <text x="162" y="140" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">C</text>
        <circle cx="90" cy="160" r="2.4" fill="var(--ink)"/>
        <text x="84" y="176" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">D</text>
        <circle cx="210" cy="160" r="2.4" fill="var(--ink)"/>
        <text x="216" y="176" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">E</text>
        <circle cx="90" cy="80" r="2.4" fill="var(--ink)"/>
        <text x="176" y="102" font-size="9" text-anchor="start" fill="var(--faint)">EIRD</text>
        <text x="188" y="154" font-size="9" text-anchor="end" fill="var(--faint)">axoide fijo</text>
        <text x="100" y="74" font-size="9" text-anchor="start" fill="var(--faint)">axoide móvil</text>
      </svg>
      <figcaption>

      El eje instantáneo del disco A es la recta CD: C no se mueve y D no desliza. Al girar el conjunto, esa recta barre en el espacio el axoide fijo, un cono de vértice C y eje vertical, y dentro del disco el axoide móvil, un cono de vértice C y eje AB. El móvil rueda sobre el fijo a lo largo de CD.

      </figcaption>
      </figure>

      **5. Comprobación.** Dos cosas que no se han usado. La primera: el
      vector $\vec{\omega}_A$ tiene que ir a lo largo del eje instantáneo, y
      $\vec{\omega}_A = (\omega_1/r)(R;\ r;\ 0)$ es paralelo a
      $\overrightarrow{DC} = (R;\ r;\ 0)$. La segunda: $\vec{a}_D$ por la
      composición de movimientos, con el eje AB como sólido que arrastra. El
      punto del eje que coincide con D gira alrededor de la vertical a la
      distancia R: arrastre $\omega_1^{2}R\,\vec{i}$. Respecto del eje, D gira
      alrededor de A a $\omega_p$: relativa
      $\omega_p^{2}r\,\vec{j} = (\omega_1^{2}R^{2}/r)\,\vec{j}$, con
      $\vec{v}_{\text{rel}} = -\omega_1 R\,\vec{k}$. Y Coriolis:

      $$
      2\,\vec{\omega}_1\times\vec{v}_{\text{rel}} = 2\,\omega_1\vec{j}\times\left(-\omega_1 R\,\vec{k}\right) = -2\,\omega_1^{2}R\,\vec{i}
      $$

      La suma, $-\omega_1^{2}R\,\vec{i} + (\omega_1^{2}R^{2}/r)\,\vec{j}$, es
      la misma.

      **Lo que dice el resultado.** D tiene velocidad nula y aceleración no
      nula: 1,8 m/s² hacia arriba, hacia el centro del disco, que es lo que
      lo despega del suelo un instante después, y 1,2 m/s² hacia fuera. El
      disco da vueltas más deprisa que el eje, $\omega_1 R/r$, porque recorre
      una circunferencia de radio R con una rueda de radio r. Y el eje
      instantáneo no es horizontal ni vertical: va de C al contacto.

  - id: ejma7-col77-el-brazo-abc-y-el-disco-de-seis-metros
    titulo: El disco del brazo ABC, con dos giros perpendiculares
    fuente: >-
      Ejercicio 7.7 · Tema 7, «Cinemática del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    antes:
      idea: |
        El disco tiene dos giros: el del brazo alrededor del eje Y y el suyo
        propio respecto del brazo. Su velocidad angular es la suma vectorial de
        los dos, su aceleración angular es la derivada de esa suma, y el campo
        de aceleraciones relaciona las de dos puntos cualesquiera del disco.
      formula: |
        La composición de los giros, la aceleración angular y el campo de
        aceleraciones, con A y P dos puntos del disco:

        $$
        \vec{\omega} = \vec{\omega}_1 + \vec{\omega}_2,
        \qquad
        \vec{\alpha} = \frac{d\vec{\omega}}{dt},
        \qquad
        \vec{a}_P = \vec{a}_A + \vec{\alpha}\times\overrightarrow{AP}
        + \vec{\omega}\times\left(\vec{\omega}\times\overrightarrow{AP}\right)
        $$
      reconocer: |
        Antes de calcular se mira cómo se mueve cada parte: el brazo, el eje
        BC y el disco.
    enunciado: |
      Un disco de 6 m de radio de giro a una velocidad angular constante
      ω₂ = 4 rad/s con respecto al brazo ABC, que a su vez gira a una
      velocidad constante ω₁ = 3 rad/s con respecto al eje Y. Determinar:

      a) Aceleración angular del disco.

      b) Aceleración del punto D.

      <figure>
      <svg viewBox="0 0 300 200" role="img" width="300" height="200" aria-labelledby="ma7c7-t ma7c7-d">
        <title id="ma7c7-t">Brazo acodado ABC con un disco vertical en su extremo</title>
        <desc id="ma7c7-d">Del origen O sale una barra vertical de 8 metros hasta A. Desde A el brazo avanza 15 metros en la dirección x hasta B y desde B otros 9 metros en la dirección z negativa hasta C, centro de un disco de 6 metros de radio contenido en un plano vertical. El punto D es el más alto del disco. El brazo gira alrededor del eje Y y el disco alrededor del propio brazo BC.</desc>
        <path d="M26 178 L74 140 L236 140 L188 178 Z" fill="var(--faint)" fill-opacity="0.2" stroke="var(--ink)" stroke-width="0.9"/>
        <line x1="60" y1="165" x2="60" y2="40" stroke="var(--ink)" stroke-width="1"/>
        <text x="56" y="36" font-size="10" fill="var(--ink)">Y</text>
        <line x1="60" y1="165" x2="230" y2="165" stroke="var(--ink)" stroke-width="1"/>
        <text x="234" y="168" font-size="10" fill="var(--ink)">X</text>
        <line x1="60" y1="165" x2="26" y2="185" stroke="var(--ink)" stroke-width="1"/>
