      <figcaption>

      Las dos aceleraciones, a escala entre ellas: la de arrastre, 2 m/s² hacia O, y la de Coriolis, 4 m/s², perpendicular a la varilla en el sentido del giro. La relativa es nula. Ejes: x hacia la derecha, y hacia arriba; giros positivos en sentido antihorario.

      </figcaption>
      </figure>

      **5. Comprobación.** En polares, que no se han usado, con
      $\dot{r} = 1\ \text{m/s}$, $\ddot{r} = 0$, $\dot{\theta} = 2\ \text{rad/s}$
      y $\ddot{\theta} = 0$:

      $$
      a_r = \ddot{r} - r\,\dot{\theta}^{2} = 0 - 0{,}5\cdot 4 = -2,
      \qquad
      a_\theta = r\,\ddot{\theta} + 2\,\dot{r}\,\dot{\theta} = 0 + 2\cdot 1\cdot 2 = 4
      $$

      las mismas dos componentes, en m/s².

      **Lo que dice el resultado.** Nada cambia de velocidad respecto de la
      varilla y, aun así, Coriolis dobla a la centrípeta. Al alejarse, la
      deslizadera pasa a puntos de la varilla que van más rápido, y además su
      velocidad relativa gira con la varilla: los dos efectos, a partes
      iguales, son el 2 de la fórmula. La varilla tiene que empujarla de lado
      para que la siga.

  - id: ejma7-col71-la-trayectoria-y-sus-componentes-intrinsecas
    titulo: Velocidad, componentes intrínsecas y radio de curvatura de una trayectoria
    fuente: >-
      Ejercicio 7.1 · Tema 7, «Cinemática del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo. En el radio de curvatura
      publica 35,5 m y las dos comprobaciones nuestras dan 35,05 m, así que se
      publica 35,05 y se explica la diferencia.
    nivel: practica
    antes:
      idea: |
        La aceleración de un punto se describe en dos direcciones que van con
        él: la tangente a la trayectoria, la de la velocidad, y la normal, que
        apunta hacia el centro de curvatura. Son las componentes intrínsecas:
        no dependen de los ejes que se elijan.
      formula: |
        Con $\vec{u}_t$ el unitario de la velocidad, $\vec{u}_n$ el normal
        hacia el centro de curvatura y $\rho$ el radio de curvatura:

        $$
        \vec{v} = \frac{d\vec{r}}{dt},
        \qquad
        \vec{a} = \frac{d\vec{v}}{dt} = a_t\,\vec{u}_t + a_n\,\vec{u}_n,
        \qquad
        a_n = \frac{v^{2}}{\rho},
        \qquad
        |\vec{a}|^{2} = a_t^{2} + a_n^{2}
        $$
      reconocer: |
        Antes de calcular se mira qué mide cada una de las dos componentes de
        la aceleración.
    enunciado: |
      Un cuerpo se mueve sobre una trayectoria cuyo vector de posición es
      $\vec{r} = t^{2}\vec{i} + t\vec{j} + \vec{k}$, siendo sus unidades
      metros. Calcular velocidad y aceleración con las dos componentes
      intrínsecas y el radio de curvatura de la trayectoria a los 2 segundos
      de iniciar el movimiento.
    pide: La velocidad, las componentes tangencial y normal de la aceleración y el radio de curvatura en t = 2 s.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se obtiene la componente tangencial de la aceleración?
        opciones:
          - texto: Derivando el módulo de la velocidad respecto del tiempo
            correcta: true
            mensaje: |
              Eso es. La tangencial mide cómo cambia la **rapidez**,
              $a_t = \mathrm{d}|\vec{v}|/\mathrm{d}t$; la normal mide cómo
              cambia la dirección.
          - texto: Tomando el módulo del vector aceleración
            mensaje: |
              Ese es el módulo total, que reparte entre las dos componentes:
              $|\vec{a}|^{2} = a_t^{2} + a_n^{2}$. Aquí vale 2 y la tangencial
              es menor.
          - texto: Proyectando la aceleración sobre el vector de posición
            mensaje: |
              La referencia intrínseca la marca la **velocidad**, no la
              posición. El vector de posición depende de dónde pongas el
              origen; la tangente a la trayectoria, no.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **la trayectoria, el punto donde
          está el cuerpo a los 2 s y, en él, la velocidad y la aceleración**,
          con la dirección normal. Las flechas, sin escala.
        comprueba:
          - punto: |
              **Una parábola en el plano $z = 1$: $x = y^{2}$.**
            porque: |
              La coordenada z vale 1 siempre, y quitando t de $x = t^{2}$ e
              $y = t$ queda la relación entre x e y.
          - punto: |
              **En el punto $(4,\ 2,\ 1)$, $\vec{v}$ tangente a la curva,
              hacia donde crecen x e y.**
            porque: |
              La velocidad es siempre tangente a la trayectoria y apunta hacia
              donde avanza el cuerpo, que en t = 2 s está en ese punto.
          - punto: |
              **$\vec{a}$ según x, y la normal hacia el lado cóncavo de la
              parábola.**
            porque: |
              Derivando dos veces el vector de posición solo queda la parte de
              x. La normal apunta siempre hacia el centro de curvatura, dentro
              de la curva.
        figura: |
          <svg viewBox="0 48 260 150" role="img" width="260" height="150" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">Esquema de la trayectoria, la velocidad y la aceleración a los 2 segundos</title>
            <desc id="dsl-d">La trayectoria del cuerpo en el plano z igual a 1, con x hacia la derecha e y hacia arriba: una parábola que sale del punto inicial subiendo y se va tumbando hacia la derecha. En ella, el punto P, donde está el cuerpo a los 2 segundos. Desde P, hacia el lado cóncavo de la curva, la normal, n, en línea fina. La velocidad, a lo largo de la tangente, hacia donde avanza el cuerpo. La aceleración, horizontal hacia la derecha, entre la tangente y la normal.</desc>
