    pide: La aceleración angular del disco y la velocidad y aceleración del punto A del borde.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué se puede tomar C como punto fijo del disco?
        opciones:
          - texto: Porque los dos ejes de giro, Z y CB, se cortan en C
            correcta: true
            mensaje: |
              Eso es. Cuando los ejes se cortan, su punto común tiene
              velocidad nula por los dos giros a la vez, y el disco se mueve
              como un sólido con punto fijo.
          - texto: Porque C es el centro del disco
            mensaje: |
              El centro del disco es B, que sí se mueve: gira alrededor del
              eje Z a 120 mm de él. Lo que hace fijo a C es estar en los dos
              ejes.
          - texto: Porque el brazo BCD no se mueve
            mensaje: |
              El brazo gira alrededor de Z: es justamente el primero de los
              dos movimientos.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el brazo y el disco, con los
          dos giros como vectores sobre sus ejes, el punto C y el punto A**.
          Solo las direcciones, sin escala.
        comprueba:
          - punto: |
              **$\vec{\omega}_1$ sobre el eje Z y $\vec{\omega}_2$ sobre CB,
              vertical.**
            porque: |
              El brazo gira alrededor de Z, por donde va su tramo CD; el disco,
              respecto del brazo, alrededor de CB, su eje, que es vertical.
          - punto: |
              **C, donde CB corta al eje Z.**
            porque: |
              Por C pasan los dos ejes, y es el punto desde el que se aplican
              los campos del disco.
          - punto: |
              **A en el borde, según x: a 150 mm de B y 120 mm por encima de
              C.**
            porque: |
              La posición de A respecto de C es la que entra en los campos, y
              tiene dos cotas: una horizontal y otra vertical.
        figura: |
          <svg viewBox="30 10 244 194" role="img" width="244" height="194" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">Esquema de los dos giros del disco del brazo BCD</title>
            <desc id="dsl-d">El conjunto en la perspectiva del enunciado: el tramo CD del brazo va por el eje Z; de C sube el tramo CB, vertical, hasta B, el centro del disco horizontal; A está en el borde del disco, según x. Sobre el eje Z, más allá de D, la velocidad angular omega uno del brazo, según z. Sobre la vertical de CB, por encima del disco, la velocidad angular omega dos del disco respecto del brazo, hacia arriba. Una línea tenue une C con A.</desc>
