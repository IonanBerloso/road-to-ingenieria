    pide: El momento de T respecto de A y respecto de B, como vectores según k.
    pasos:
      - tipo: reconocer
        pregunta: |
          Para el momento de $\vec{T}$ respecto de $A$, ¿qué vector de
          posición multiplica a $\vec{T}$?
        opciones:
          - texto: >-
              $\overrightarrow{AC}$, del punto de momentos al punto de
              aplicación de la fuerza
            correcta: true
            mensaje: |
              Eso es: $\vec{M}_A = \overrightarrow{AC} \times \vec{T}$. $A$ es
              el punto **respecto del que** se toma el momento y $C$ el punto
              **donde está aplicada** $\vec{T}$, que es lo que la nota de la
              colección pide no confundir.
          - texto: >-
              $\overrightarrow{CA}$, del punto de aplicación al punto de
              momentos
            mensaje: |
              Con $\overrightarrow{CA}$ el producto sale con el signo
              cambiado: $\overrightarrow{CA} \times \vec{T} = -\vec{M}_A$. El
              vector de posición sale siempre del punto de momentos.
          - texto: >-
              $\overrightarrow{AB}$, porque $B$ es el otro punto que pide el
              enunciado
            mensaje: |
              $B$ es otro punto de momentos, no el punto de aplicación.
              $\vec{T}$ está aplicada en $C$, y su recta soporte no pasa por
              $B$.

      - tipo: calcular
        titulo: La componente vertical de T
        pregunta: |
          Con $\vec{T}$ a $20^{\circ}$ por debajo de la horizontal y hacia la
          derecha, ¿cuánto vale $T_y$, en newtons?
        respuesta:
          tipo: numero
          valor: '-44.46'
          tolerancia: 0.05
          formato: un número con su signo, en N
        distractores:
          - valor: '44.46'
            mensaje: |
              El módulo está bien, pero $\vec{T}$ apunta hacia **abajo**: con
              $y$ hacia arriba, su componente vertical es negativa.
          - valor: '-122.16'
            mensaje: |
              Has cambiado seno y coseno. El ángulo se mide desde la
              horizontal, así que la componente vertical lleva el seno:
              $130 \sin 20^{\circ} = 44{,}46$.
        pista: |
          $\vec{T} = 130\,(\cos 20^{\circ}\,\vec{i} - \sin 20^{\circ}\,\vec{j})$.
        desarrollo: |
          $$
          \vec{T} = 122{,}16\,\vec{i} - 44{,}46\,\vec{j}\ \text{N}
          $$

      - tipo: calcular
        titulo: El momento respecto de A
        pregunta: |
          Con $\overrightarrow{AC} = 2{,}25\,(\cos 30^{\circ},\ \sin 30^{\circ})\ \text{m}$,
          ¿cuánto vale la componente $z$ de $\vec{M}_A$, en N·m?
        respuesta:
          tipo: numero
          valor: '-224.07'
          tolerancia: 0.5
          formato: un número con su signo, en N·m
        distractores:
          - valor: '224.07'
            mensaje: |
              Signo cambiado: es $\overrightarrow{CA} \times \vec{T}$, o
              $\vec{T} \times \overrightarrow{AC}$. $\vec{T}$ tiende a girar
              la barra en sentido horario, y eso es $-\vec{k}$.
          - valor: '-292.5'
            mensaje: |
              $130 \cdot 2{,}25$ sería el momento si $\vec{T}$ fuera
              perpendicular a la barra. El brazo es la distancia de $A$ a la
              recta de $\vec{T}$, y el ángulo entre barra y fuerza es
              $30^{\circ} + 20^{\circ} = 50^{\circ}$: falta el
              $\sin 50^{\circ}$.
          - valor: '-86.64'
            mensaje: |
              Te has quedado con un solo término del producto vectorial,
              $AC_x\,T_y$. La componente $z$ es $AC_x\,T_y - AC_y\,T_x$, y el
              segundo término pesa más.
        pista: |
          $\overrightarrow{AC} = (1{,}9486;\ 1{,}125)$ y
          $M_{A,z} = AC_x\,T_y - AC_y\,T_x$.
        desarrollo: |
          $$
          M_{A,z} = 1{,}9486\cdot(-44{,}46) - 1{,}125\cdot 122{,}16 = -86{,}64 - 137{,}43 = -224{,}07\ \text{N·m}
          $$

          O de un golpe: $130 \cdot 2{,}25 \cdot \sin 50^{\circ} = 224{,}07$, y
          el sentido es horario.

      - tipo: calcular
        titulo: El momento respecto de B, por el campo
        pregunta: |
          Con la ecuación del campo,
          $\vec{M}_B = \vec{M}_A + \overrightarrow{BA} \times \vec{T}$,
          ¿cuánto vale la componente $z$ de $\vec{M}_B$?
        respuesta:
          tipo: numero
          valor: '-124.48'
          tolerancia: 0.2
          formato: un número con su signo, en N·m
        distractores:
          - valor: '-323.65'
            mensaje: |
              Has usado $\overrightarrow{AB}$ en lugar de
              $\overrightarrow{BA}$, y el término de transporte ha entrado con
              el signo al revés. El vector va del punto nuevo, $B$, al viejo,
              $A$.
          - valor: '-99.58'
            mensaje: |
              Ese es solo el término $\overrightarrow{AB} \times \vec{T}$. Falta
              sumarlo, con el signo bueno, al momento que ya tenías en $A$.
        pista: |
          $\overrightarrow{BA} = -(0{,}866;\ 0{,}5)$, y
          $(\overrightarrow{BA} \times \vec{T})_z = +99{,}58$.
        desarrollo: |
          $$
          \vec{M}_B = -224{,}07\,\vec{k} + 99{,}58\,\vec{k} = -124{,}48\,\vec{k}\ \text{N·m}
          $$

          Y directamente, con $\overrightarrow{BC}$ de $1{,}25$ m:
          $130 \cdot 1{,}25 \cdot \sin 50^{\circ} = 124{,}48$. Cuadra.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $\vec{T} = 122{,}16\,\vec{i} - 44{,}46\,\vec{j}$ N, aplicada en
              $C$, con $\overrightarrow{AC} = 1{,}9486\,\vec{i} + 1{,}125\,\vec{j}$ m.
          - texto: >-
              $\vec{M}_A = \overrightarrow{AC} \times \vec{T} = -224{,}07\,\vec{k}$ N·m.
          - texto: >-
              $\vec{M}_B = \vec{M}_A + \overrightarrow{BA} \times \vec{T} = -124{,}48\,\vec{k}$ N·m,
              que es lo mismo que $\overrightarrow{BC} \times \vec{T}$.
          - texto: >-
              Como $A$ y $B$ están en la misma barra, el momento de $\vec{T}$
              es el mismo en los dos.
            trampa: true
            mensaje: |
              El momento solo se repite en puntos de una recta paralela a la
              resultante. La barra no es paralela a $\vec{T}$: $B$ está más
              cerca de la recta de la fuerza y su momento es menor.
    resolucion: |
      **La fuerza.** $\vec{T}$ va hacia la derecha y $20^{\circ}$ por debajo
      de la horizontal:

      $$
      \vec{T} = 130\,(\cos 20^{\circ}\,\vec{i} - \sin 20^{\circ}\,\vec{j}) = 122{,}16\,\vec{i} - 44{,}46\,\vec{j}\ \text{N}
      $$

      **El momento en A.** El vector de posición va de $A$, el punto de
      momentos, a $C$, el de aplicación: $\overrightarrow{AC} = 2{,}25\,(\cos 30^{\circ},\ \sin 30^{\circ}) = (1{,}9486;\ 1{,}125)$ m.

      $$
      \vec{M}_A = \overrightarrow{AC} \times \vec{T} = \left(1{,}9486\cdot(-44{,}46) - 1{,}125 \cdot 122{,}16\right)\vec{k} = -224{,}07\,\vec{k}\ \text{N·m}
      $$

      **El momento en B.** Por el campo de momentos, con el vector del punto
      nuevo al viejo, $\overrightarrow{BA} = -(0{,}866;\ 0{,}5)$:

      $$
      \vec{M}_B = \vec{M}_A + \overrightarrow{BA} \times \vec{T} = -224{,}07\,\vec{k} + 99{,}58\,\vec{k} = -124{,}48\,\vec{k}\ \text{N·m}
      $$

      **Comprobación.** Como $A$, $B$ y $C$ están alineados, los dos momentos
      son $T$ por la distancia a $C$ por $\sin 50^{\circ}$:
      $130 \cdot 2{,}25 \cdot \sin 50^{\circ} = 224{,}07$ y
      $130 \cdot 1{,}25 \cdot \sin 50^{\circ} = 124{,}48$. Coincide con la
      colección, que da $-224\,\vec{k}$ y $-124{,}5\,\vec{k}$ N·m.

  - id: ejma1-col13-el-cable-que-dobla-la-rama
    titulo: El cable que dobla la rama, en el espacio
    fuente: >-
      Ejercicio 1.3 · Tema 1, «Fundamentos de cálculo vectorial» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Sobre la rama inclinada de la figura actúa una fuerza de
      $400\ \text{N}$ mediante un cable con la intención de doblarla.
      Encontrar el momento que realiza esta persona respecto al punto $C$.

