ejercicios:
  - id: ejma1-el-momento-en-otro-punto
    titulo: El momento en otro punto, y el signo que se escapa
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Un sistema de vectores deslizantes tiene resultante
      $\vec{R} = \hat{\imath} + 2\hat{\jmath}$ y momento resultante en el origen
      $\vec{M}_O = 3\hat{k}$. Calcular el momento resultante en el punto
      $P(1, 1, 0)$.
    pide: El momento en P a partir del momento en O.
    pasos:
      - tipo: reconocer
        pregunta: |
          Conoces la resultante y el momento en $O$. ¿Qué ecuación da el
          momento en $P$?
        opciones:
          - texto: $\vec{M}_P = \vec{M}_O + \overrightarrow{PO} \times \vec{R}$
            correcta: true
            mensaje: |
              Eso es: la ecuación del campo de momentos, con el vector de
              posición saliendo del punto nuevo, $P$, hacia el punto donde ya
              conoces el momento, $O$.
          - texto: $\vec{M}_P = \vec{M}_O + \overrightarrow{OP} \times \vec{R}$
            mensaje: |
              Casi, pero con el signo cambiado. $\overrightarrow{OP}$ es el
              opuesto de $\overrightarrow{PO}$, así que ese término sale con el
              signo al revés y el resultado, equivocado.
          - texto: $\vec{M}_P = \vec{M}_O$, porque el momento es un invariante
            mensaje: |
              Lo invariante es la resultante y el producto escalar
              $\vec{M} \cdot \vec{R}$, no el momento. El momento cambia de un
              punto a otro, y cuánto cambia es justo lo que da el campo.

      - tipo: calcular
        titulo: El producto del campo
        pregunta: |
          Calcula $\overrightarrow{PO} \times \vec{R}$. ¿Cuánto vale su
          componente $z$?
        respuesta:
          tipo: numero
          valor: '-1'
          tolerancia: 0.001
          formato: un número, la componente z
        distractores:
          - valor: '1'
            mensaje: |
              Has usado $\overrightarrow{OP} = (1, 1, 0)$ en lugar de
              $\overrightarrow{PO} = O - P = (-1, -1, 0)$. El vector va del
              punto nuevo al viejo.
          - valor: '-3'
            mensaje: |
              Revisa la componente $z$ del producto vectorial: es
              $a_x b_y - a_y b_x$, con los dos productos restados.
        pista: |
          $\overrightarrow{PO} = (-1, -1, 0)$ y $\vec{R} = (1, 2, 0)$. La
          componente $z$ es $(-1)\cdot 2 - (-1)\cdot 1$.
        desarrollo: |
          $$
          \overrightarrow{PO} \times \vec{R} = (-1, -1, 0) \times (1, 2, 0)
          = \left(0,\ 0,\ (-1)\cdot 2 - (-1)\cdot 1\right) = -\hat{k}
          $$

      - tipo: calcular
        titulo: El momento en P
        pregunta: |
          ¿Cuánto vale la componente $z$ de $\vec{M}_P$? Las otras dos son
          nulas.
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número, la componente z
        distractores:
          - valor: '4'
            mensaje: |
              Has sumado $+\hat{k}$ en lugar de $-\hat{k}$: es el signo de
              $\overrightarrow{OP}$ colándose en el campo de momentos.
          - valor: '3'
            mensaje: |
              Ese es el momento en $O$. Al cambiar de punto el momento cambia,
              salvo que el nuevo punto esté en una recta paralela a
              $\vec{R}$ que pase por $O$, y $P$ no lo está.
        pista: |
          Suma el momento en $O$ y el producto del paso anterior.
        desarrollo: |
          $$
          \vec{M}_P = 3\hat{k} + (-\hat{k}) = 2\hat{k}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: $\overrightarrow{PO} = O - P = (-1, -1, 0)$.
          - texto: $\overrightarrow{PO} \times \vec{R} = (0, 0, -2 + 1) = -\hat{k}$.
          - texto: $\vec{M}_P = \vec{M}_O + \overrightarrow{PO} \times \vec{R} = 3\hat{k} - \hat{k} = 2\hat{k}$.
          - texto: Como el momento es el mismo en todos los puntos, $\vec{M}_P = 3\hat{k}$.
            trampa: true
            mensaje: |
              El momento no es un invariante. Lo que no cambia es su
              proyección sobre la resultante: aquí $\vec{M}_O \cdot \vec{R} = 0$
              y $\vec{M}_P \cdot \vec{R} = 0$, los dos iguales, aunque los
              momentos sean distintos.
    resolucion: |
      **El campo de momentos.** Conocidos $\vec{R}$ y $\vec{M}_O$, el momento en
      otro punto es

      $$
      \vec{M}_P = \vec{M}_O + \overrightarrow{PO} \times \vec{R}
      $$

      con el vector de posición del punto nuevo al viejo:
      $\overrightarrow{PO} = O - P = (-1, -1, 0)$.

      **El producto.**

      $$
      \overrightarrow{PO} \times \vec{R} = (-1, -1, 0) \times (1, 2, 0) = -\hat{k}
      $$

      **El resultado.** $\vec{M}_P = 3\hat{k} - \hat{k} = 2\hat{k}$.

      Una comprobación que sale gratis: el invariante escalar tiene que ser el
      mismo en los dos puntos. $\vec{M}_O \cdot \vec{R} = 0$ y
      $\vec{M}_P \cdot \vec{R} = 0$. Cuadra, y además dice algo del sistema:
      con invariante nulo y resultante no nula, se reduce a una única fuerza.

  - id: ejma1-el-momento-minimo
    titulo: El momento mínimo, a partir de un momento cualquiera
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Un sistema de vectores deslizantes tiene resultante
      $\vec{R} = 3\hat{\jmath} + 4\hat{k}$ y, en el origen, momento resultante
      $\vec{M}_O = \hat{\imath} + 2\hat{\jmath} + 6\hat{k}$. Calcular el
      invariante escalar y el módulo del momento mínimo.
    pide: El invariante escalar y el módulo del momento mínimo.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué tienen en común el momento en el origen y el momento en
          cualquier otro punto del espacio?
        opciones:
          - texto: Su proyección sobre la resultante, que es la misma en todos los puntos
            correcta: true
            mensaje: |
              Eso es. $\vec{M} \cdot \vec{R}$ es el invariante escalar, y
              dividido por $R$ es la proyección del momento sobre la
              resultante: el momento mínimo.
          - texto: El módulo, porque todos los momentos del sistema miden lo mismo
            mensaje: |
              No: el módulo crece al alejarte del eje central, porque aparece
              una componente perpendicular a $\vec{R}$ proporcional a la
              distancia. Solo la componente sobre $\vec{R}$ se conserva.
          - texto: Nada, cada punto tiene un momento independiente de los demás
            mensaje: |
              El campo de momentos los liga a todos: conocido uno y la
              resultante, se conocen los demás. Y de esa ecuación sale que la
              proyección sobre $\vec{R}$ no cambia.

      - tipo: calcular
        titulo: El invariante escalar
        pregunta: |
          ¿Cuánto vale $\tau = \vec{M}_O \cdot \vec{R}$?
        respuesta:
          tipo: numero
          valor: '30'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '11'
            mensaje: |
              Has emparejado mal las componentes. El producto escalar
              multiplica $x$ con $x$, $y$ con $y$ y $z$ con $z$:
              $1 \cdot 0 + 2 \cdot 3 + 6 \cdot 4$.
        pista: |
          $\vec{M}_O = (1, 2, 6)$ y $\vec{R} = (0, 3, 4)$.
        desarrollo: |
          $$
          \tau = 1 \cdot 0 + 2 \cdot 3 + 6 \cdot 4 = 30
          $$

      - tipo: calcular
        titulo: El módulo del momento mínimo
        pregunta: |
          ¿Cuánto mide el momento mínimo?
        respuesta:
          tipo: numero
          valor: '6'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '30'
            mensaje: |
              Ese es el invariante escalar. El momento mínimo es la
              **proyección** del momento sobre la resultante, así que falta
              dividir entre el módulo de $\vec{R}$.
          - valor: '1.2'
            mensaje: |
              $\tau / R^{2} = 1{,}2$ es el factor que multiplica a $\vec{R}$
              para dar el vector momento mínimo, no su módulo. Multiplica por
              $R = 5$, o divide $\tau$ entre $R$ directamente.
          - valor: '6.403'
            mensaje: |
              Ese es el módulo de $\vec{M}_O$, $\sqrt{41}$. El origen es un
              punto cualquiera, no del eje central: su momento tiene, además de
              la proyección sobre $\vec{R}$, una parte perpendicular.
        pista: |
          $\left| \vec{M}_{\min} \right| = \tau / R$, con $R = \sqrt{3^{2} + 4^{2}}$.
        desarrollo: |
          $$
          R = \sqrt{9 + 16} = 5
          \qquad
          \left| \vec{M}_{\min} \right| = \frac{\tau}{R} = \frac{30}{5} = 6
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: $\tau = \vec{M}_O \cdot \vec{R} = 0 + 6 + 24 = 30$.
          - texto: '$R = 5$, y el momento mínimo es la proyección de cualquier momento sobre la resultante: $\tau / R = 6$.'
          - texto: Su dirección es la de la resultante, $\vec{M}_{\min} = \frac{30}{25}(3\hat{\jmath} + 4\hat{k}) = 3{,}6\hat{\jmath} + 4{,}8\hat{k}$.
          - texto: Como el origen es un punto cualquiera, el momento mínimo es $\vec{M}_O$, de módulo $\sqrt{41}$.
            trampa: true
            mensaje: |
              El momento mínimo solo se alcanza en el eje central, y nada dice
              que el origen esté en él. De $\vec{M}_O$ solo sirve su
              proyección sobre $\vec{R}$; el resto es la parte perpendicular
              que se va al moverte hasta el eje.
    resolucion: |
      **El invariante escalar.** Es el producto escalar del momento en
      cualquier punto por la resultante:

      $$
      \tau = \vec{M}_O \cdot \vec{R} = 1 \cdot 0 + 2 \cdot 3 + 6 \cdot 4 = 30
      $$

      **El momento mínimo.** Es la proyección del momento sobre la resultante,
      que es la misma en todos los puntos, y lleva la dirección de
      $\vec{R}$:

      $$
      \left| \vec{M}_{\min} \right| = \frac{\tau}{R} = \frac{30}{5} = 6
      \qquad
      \vec{M}_{\min} = \frac{\tau}{R^{2}}\,\vec{R} = 3{,}6\hat{\jmath} + 4{,}8\hat{k}
      $$

      **Dónde se alcanza.** En el eje central. Un punto suyo es
      $\overrightarrow{OP_0} = \vec{R} \times \vec{M}_O / R^{2}
      = (10, 4, -3)/25$, y se puede comprobar que el campo de momentos da ahí
      exactamente $3{,}6\hat{\jmath} + 4{,}8\hat{k}$.

  - id: ejma1-col11-tres-cables-y-el-eje-y
    titulo: Tres cables y el ángulo que forman con el eje y
    fuente: >-
      Ejercicio 1.1 · Tema 1, «Fundamentos de cálculo vectorial» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Para sostener el contenedor de la figura se emplean tres cables. Calcular
      los ángulos de todos los cables respecto al eje $y$.

      <figure>
      <svg viewBox="0 0 460 290" role="img" width="460" height="290" aria-labelledby="ejma1-col11-t ejma1-col11-d">
        <title id="ejma1-col11-t">Tres cables que bajan de un plano horizontal a un mismo punto A</title>
        <desc id="ejma1-col11-d">Perspectiva de los ejes x, y, z con el plano horizontal xz sombreado y el eje y vertical hacia arriba. Tres cables parten de B(0,56; 0; 0), C(0; 0; −0,48) y D(−0,52; 0; 0,36), en el plano xz, y se juntan en A(0; −0,9; 0), sobre el eje y y por debajo del plano. De A cuelga la carga, dibujada como una flecha vertical hacia abajo. Coordenadas en metros.</desc>
        <defs>
          <marker id="ejma1-col11-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
          <marker id="ejma1-col11-ff" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
        </defs>
        <polygon points="411.9,125 256,215 54.6,98.8 210.5,8.8" fill="var(--faint)" fill-opacity="0.15" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="78" y="107" font-size="9" fill="var(--faint)">xz</text>
        <line x1="230" y1="110" x2="340.4" y2="173.8" stroke="var(--ink)" stroke-width="1.3" marker-end="url(#ejma1-col11-fe)"/>
        <line x1="230" y1="110" x2="126.1" y2="170" stroke="var(--ink)" stroke-width="1.3" marker-end="url(#ejma1-col11-fe)"/>
        <line x1="230" y1="110" x2="230" y2="50" stroke="var(--ink)" stroke-width="1.3" marker-end="url(#ejma1-col11-fe)"/>
        <text x="346" y="182" font-size="10" fill="var(--ink)">x</text>
        <text x="114" y="180" font-size="10" fill="var(--ink)">z</text>
        <text x="236" y="54" font-size="10" fill="var(--ink)">y</text>
        <text x="220" y="106" font-size="10" text-anchor="end" fill="var(--ink)">O</text>
        <line x1="230" y1="245" x2="302.7" y2="152" stroke="var(--d1)" stroke-width="1.4"/>
        <line x1="230" y1="245" x2="292.4" y2="74" stroke="var(--d1)" stroke-width="1.4"/>
        <line x1="230" y1="245" x2="115.7" y2="98" stroke="var(--d1)" stroke-width="1.4"/>
        <line x1="230" y1="245" x2="230" y2="280" stroke="var(--flag)" stroke-width="1.8" marker-end="url(#ejma1-col11-ff)"/>
        <circle cx="230" cy="245" r="2.8" fill="var(--paper)" stroke="var(--ink)" stroke-width="1"/>
        <circle cx="302.7" cy="152" r="2.8" fill="var(--paper)" stroke="var(--ink)" stroke-width="1"/>
        <circle cx="292.4" cy="74" r="2.8" fill="var(--paper)" stroke="var(--ink)" stroke-width="1"/>
        <circle cx="115.7" cy="98" r="2.8" fill="var(--paper)" stroke="var(--ink)" stroke-width="1"/>
        <text x="238" y="256" font-size="9" fill="var(--ink)">A(0; −0,9; 0)</text>
        <text x="309" y="150" font-size="9" fill="var(--ink)">B(0,56; 0; 0)</text>
        <text x="298" y="70" font-size="9" fill="var(--ink)">C(0; 0; −0,48)</text>
        <text x="110" y="92" font-size="9" text-anchor="end" fill="var(--ink)">D(−0,52; 0; 0,36)</text>
      </svg>
      </figure>
    pide: El ángulo de cada uno de los tres cables con el eje y, en grados.
    pasos:
      - tipo: reconocer
        pregunta: |
          Cada cable va de $A$ a uno de los puntos de anclaje. ¿Cómo se saca
          el ángulo que forma, por ejemplo, $\overrightarrow{AB}$ con el eje
          $y$?
        opciones:
          - texto: >-
              Con el coseno director, dividiendo la componente y del vector del
              cable entre su módulo
            correcta: true
            mensaje: |
              Eso es. El producto escalar por el unitario del eje,
              $\overrightarrow{AB} \cdot \vec{j}$, es la proyección del cable
              sobre el eje $y$, y dividida por $|\overrightarrow{AB}|$ da el
              coseno del ángulo: $\cos\alpha = AB_y / |\overrightarrow{AB}|$.
          - texto: >-
              Con el vector de posición del punto de anclaje, que es el que da
              la figura
            mensaje: |
              $\overrightarrow{OB}$ está en el plano $xz$ y forma siempre
              $90^{\circ}$ con el eje $y$. El cable no va de $O$ a $B$: va de
              $A$ a $B$, y su vector es $B - A$.
          - texto: >-
              Con el arco tangente de la componente y entre la parte horizontal
              del cable
            mensaje: |
              Ese es el ángulo con el **plano** $xz$, el complementario del que
              se pide. Para el cable $AB$ saldría $58{,}11^{\circ}$ en vez de
              $31{,}89^{\circ}$.

      - tipo: calcular
        titulo: La longitud del cable AD
        pregunta: |
          ¿Cuánto mide $\overrightarrow{AD}$, en metros?
        respuesta:
          tipo: numero
          valor: '1.1'
          tolerancia: 0.005
          formato: un número, en metros
        distractores:
          - valor: '0.6325'
            mensaje: |
              Ese es el módulo de $\overrightarrow{OD}$, el vector de posición
              de $D$. El cable empieza en $A$, que está $0{,}9\ \text{m}$ por
              debajo del origen: $\overrightarrow{AD} = D - A = (-0{,}52;\ 0{,}9;\ 0{,}36)$.
        pista: |
          $\overrightarrow{AD} = D - A$, con $A = (0;\ -0{,}9;\ 0)$.
        desarrollo: |
          $$
          \overrightarrow{AD} = (-0{,}52;\ 0{,}9;\ 0{,}36)
          \qquad
          |\overrightarrow{AD}| = \sqrt{0{,}2704 + 0{,}81 + 0{,}1296} = \sqrt{1{,}21} = 1{,}1\ \text{m}
          $$

      - tipo: calcular
        titulo: El ángulo del cable AB
        pregunta: |
          ¿Qué ángulo forma el cable $AB$ con el eje $y$, en grados?
        respuesta:
          tipo: numero
          valor: '31.89'
          tolerancia: 0.05
          formato: un número, en grados
        distractores:
          - valor: '58.11'
            mensaje: |
              Es el complementario: el ángulo del cable con el plano $xz$. El
              coseno director del eje $y$ lleva arriba la componente $y$, no
              la horizontal.
          - valor: '90'
            mensaje: |
              Has usado $\overrightarrow{OB} = (0{,}56;\ 0;\ 0)$, que no tiene
              componente $y$. El cable es $\overrightarrow{AB} = B - A$.
        pista: |
          $\overrightarrow{AB} = (0{,}56;\ 0{,}9;\ 0)$ y $|\overrightarrow{AB}| = 1{,}06$.
        desarrollo: |
          $$
          \cos\alpha_{AB} = \frac{0{,}9}{1{,}06} = 0{,}8491
          \qquad
          \alpha_{AB} = 31{,}89^{\circ}
          $$

      - tipo: calcular
        titulo: El ángulo del cable AC
        pregunta: |
          ¿Y el cable $AC$?
        respuesta:
          tipo: numero
          valor: '28.07'
          tolerancia: 0.05
          formato: un número, en grados
        distractores:
          - valor: '61.93'
            mensaje: |
              Otra vez el complementario. Con $\arctan(0{,}9/0{,}48)$ sale el
              ángulo con el plano; con $\arccos(0{,}9/1{,}02)$, el del eje.
        pista: |
          $\overrightarrow{AC} = (0;\ 0{,}9;\ -0{,}48)$, de módulo $1{,}02$.
        desarrollo: |
          $$
          \cos\alpha_{AC} = \frac{0{,}9}{1{,}02} = 0{,}8824
          \qquad
          \alpha_{AC} = 28{,}07^{\circ}
          $$

      - tipo: calcular
        titulo: El ángulo del cable AD
        pregunta: |
          ¿Y el cable $AD$?
        respuesta:
          tipo: numero
          valor: '35.10'
          tolerancia: 0.15
          formato: un número, en grados
        distractores:
          - valor: '54.90'
            mensaje: |
              Es el ángulo con el plano $xz$. El que se pide sale del coseno:
              $\cos\alpha_{AD} = 0{,}9 / 1{,}1$.
        pista: |
          Usa el módulo del paso anterior, $|\overrightarrow{AD}| = 1{,}1$.
        desarrollo: |
          $$
          \cos\alpha_{AD} = \frac{0{,}9}{1{,}1} = 0{,}8182
          \qquad
          \alpha_{AD} = 35{,}10^{\circ}
          $$

          La colección lo da redondeado a $35^{\circ}$; los dos valen.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Cada cable es el vector que va de $A$ a su anclaje:
              $\overrightarrow{AB} = (0{,}56;\ 0{,}9;\ 0)$,
              $\overrightarrow{AC} = (0;\ 0{,}9;\ -0{,}48)$ y
              $\overrightarrow{AD} = (-0{,}52;\ 0{,}9;\ 0{,}36)$.
          - texto: >-
              Sus módulos son $1{,}06$, $1{,}02$ y $1{,}1$ metros.
          - texto: >-
              El coseno director del eje $y$ es la componente $y$ entre el
              módulo, y da $31{,}89^{\circ}$, $28{,}07^{\circ}$ y $35{,}10^{\circ}$.
          - texto: >-
              Como los tres cables tienen la misma componente $y$, los tres
              forman el mismo ángulo con el eje.
            trampa: true
            mensaje: |
              La componente $y$ es la misma, $0{,}9$, pero el módulo no: el
              coseno es el cociente de las dos, y cambia de un cable a otro.
              El cable más largo, $AD$, es el más inclinado.
    resolucion: |
      **Los vectores de los cables.** Cada cable va de $A = (0;\ -0{,}9;\ 0)$ a
      su anclaje, así que su vector es el punto de anclaje menos $A$:

      $$
      \overrightarrow{AB} = (0{,}56;\ 0{,}9;\ 0)
      \qquad
      \overrightarrow{AC} = (0;\ 0{,}9;\ -0{,}48)
      \qquad
      \overrightarrow{AD} = (-0{,}52;\ 0{,}9;\ 0{,}36)
      $$

      con módulos $1{,}06$, $1{,}02$ y $1{,}1$ m.

      **Los ángulos.** El producto escalar por $\vec{j}$ proyecta cada cable
      sobre el eje $y$; dividido por el módulo, es el coseno director:

      $$
      \cos\alpha = \frac{\overrightarrow{AX} \cdot \vec{j}}{|\overrightarrow{AX}|}
      \quad\Longrightarrow\quad
      \alpha_{AB} = 31{,}89^{\circ}
      \quad
      \alpha_{AC} = 28{,}07^{\circ}
      \quad
      \alpha_{AD} = 35{,}10^{\circ}
      $$

      Coincide con el resultado de la colección, que redondea el tercero a
      $35^{\circ}$ (la cuenta da $35{,}097^{\circ}$).

      **Comprobación por otro camino.** El seno del mismo ángulo es
      $|\overrightarrow{AX} \times \vec{j}| / |\overrightarrow{AX}|$, y con
      $\operatorname{atan2}$ de los dos salen exactamente los mismos tres
      ángulos.

  - id: ejma1-col12-el-momento-de-t-en-a-y-en-b
    titulo: El momento de una fuerza en dos puntos de la misma barra
    fuente: >-
      Ejercicio 1.2 · Tema 1, «Fundamentos de cálculo vectorial» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Calcular el momento resultante en los puntos $A, B$ de la fuerza
      $T = 130\ \text{N}$.

      <figure>
      <svg viewBox="0 0 360 200" role="img" width="360" height="200" aria-labelledby="ejma1-col12-t ejma1-col12-d">
