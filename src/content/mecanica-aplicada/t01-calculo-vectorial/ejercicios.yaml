    pide: El momento de la fuerza del cable respecto de C, componente a componente.
    pasos:
      - tipo: reconocer
        pregunta: |
          En la notación del dibujo la fuerza se llama $\overrightarrow{AB}$.
          ¿Qué es exactamente lo que multiplica al vector de posición en
          $\vec{M}_C$?
        opciones:
          - texto: >-
              Una fuerza de 400 N en la dirección de A hacia B, o sea
              $400\,\overrightarrow{AB}/|\overrightarrow{AB}|$
            correcta: true
            mensaje: |
              Eso es. Aquí $\overrightarrow{AB}$ indica la **dirección** del
              cable; la fuerza es su unitario por 400 N. Es lo que la nota de
              la colección subraya: $\overrightarrow{AB}$ no es un vector de
              posición, es una fuerza que va de $A$ hacia $B$.
          - texto: >-
              El vector $B - A$ tal cual, con sus componentes en metros
            mensaje: |
              Eso da un «momento» en metros cuadrados. $B - A$ solo sirve para
              la dirección: hay que dividirlo por su módulo, 11 m, y
              multiplicarlo por 400 N.
          - texto: >-
              El vector de posición de B, porque ahí está la persona
            mensaje: |
              $\overrightarrow{OB}$ es una posición, no una fuerza. La persona
              está en $B$, pero lo que tira de la rama es el cable, en la
              dirección de $A$ a $B$.

      - tipo: calcular
        titulo: La longitud del cable
        pregunta: |
          Con $A(0, 8, 11)$ y $B(6, 10, 2)$, ¿cuánto mide
          $|\overrightarrow{AB}|$, en metros?
        respuesta:
          tipo: numero
          valor: '11'
          tolerancia: 0.01
          formato: un número, en metros
        distractores:
          - valor: '11.83'
            mensaje: |
              Ese es el módulo de $\overrightarrow{OB}$, $\sqrt{140}$. El cable
              va de $A$ a $B$: $\overrightarrow{AB} = (6,\ 2,\ -9)$.
        pista: |
          $\overrightarrow{AB} = B - A = (6,\ 2,\ -9)$.
        desarrollo: |
          $$
          |\overrightarrow{AB}| = \sqrt{36 + 4 + 81} = \sqrt{121} = 11\ \text{m}
          \qquad
          \vec{F} = \frac{400}{11}\,(6,\ 2,\ -9) = (218{,}18;\ 72{,}73;\ -327{,}27)\ \text{N}
          $$

      - tipo: calcular
        titulo: La componente x del momento
        pregunta: |
          Con $C(0, 2, 8)$, $\vec{M}_C = \overrightarrow{CA} \times \vec{F}$.
          ¿Cuánto vale su componente $x$, en N·m?
        respuesta:
          tipo: numero
          valor: '-2181.82'
          tolerancia: 3
          formato: un número con su signo, en N·m
        distractores:
          - valor: '2181.82'
            mensaje: |
              Signo cambiado: has usado $\overrightarrow{AC}$ en vez de
              $\overrightarrow{CA}$. El vector de posición sale del punto de
              momentos, $C$, y llega al punto de aplicación, $A$.
          - valor: '-3418.18'
            mensaje: |
              Es el momento respecto del origen, $\overrightarrow{OA} \times \vec{F}$.
              Se pide respecto de $C$: el vector de posición empieza en $C$,
              $\overrightarrow{CA} = (0,\ 6,\ 3)$.
          - valor: '-60'
            mensaje: |
              Has multiplicado por $\overrightarrow{AB} = (6, 2, -9)$ sin
              convertirlo en fuerza. Falta el factor $400/11$: el cable tira
              con 400 N, no con 11 «metros».
        pista: |
          $\overrightarrow{CA} = (0,\ 6,\ 3)$, y la componente $x$ del
          producto es $CA_y F_z - CA_z F_y$.
        desarrollo: |
          $$
          M_{C,x} = 6\cdot(-327{,}27) - 3\cdot 72{,}73 = -1963{,}64 - 218{,}18 = -2181{,}82\ \text{N·m}
          $$

      - tipo: calcular
        titulo: La componente y del momento
        pregunta: |
          ¿Y la componente $y$?
        respuesta:
          tipo: numero
          valor: '654.55'
          tolerancia: 1
          formato: un número con su signo, en N·m
        distractores:
          - valor: '-654.55'
            mensaje: |
              Signo cambiado. La componente $y$ es $CA_z F_x - CA_x F_z$, con
              $CA_x = 0$: queda $3 \cdot 218{,}18$, positiva.
          - valor: '2400'
            mensaje: |
              Es la componente $y$ del momento respecto del origen. Con
              $\overrightarrow{CA}$ la altura que cuenta es $11 - 8 = 3$, no 11.
        pista: |
          $M_{C,y} = CA_z F_x - CA_x F_z$.
        desarrollo: |
          $$
          M_{C,y} = 3 \cdot 218{,}18 - 0 = 654{,}55\ \text{N·m}
          $$

      - tipo: calcular
        titulo: La componente z del momento
        pregunta: |
          ¿Y la componente $z$?
        respuesta:
          tipo: numero
          valor: '-1309.09'
          tolerancia: 1
          formato: un número con su signo, en N·m
        distractores:
          - valor: '1309.09'
            mensaje: |
              Signo cambiado. $M_{C,z} = CA_x F_y - CA_y F_x = 0 - 6 \cdot 218{,}18$,
              negativa.
          - valor: '-1745.45'
            mensaje: |
              Es la del origen: $\overrightarrow{OA}$ tiene $y = 8$, y
              $\overrightarrow{CA}$ solo $y = 6$.
        pista: |
          $M_{C,z} = CA_x F_y - CA_y F_x$.
        desarrollo: |
          $$
          M_{C,z} = 0 \cdot 72{,}73 - 6 \cdot 218{,}18 = -1309{,}09\ \text{N·m}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La fuerza tiene la dirección de $\overrightarrow{AB} = (6, 2, -9)$,
              de módulo 11, así que $\vec{F} = \tfrac{400}{11}(6, 2, -9)$ N.
          - texto: >-
              El vector de posición va del punto de momentos al de aplicación:
              $\overrightarrow{CA} = (0, 6, 3)$ m.
          - texto: >-
              $\vec{M}_C = \overrightarrow{CA} \times \vec{F} = -2181{,}8\,\vec{i} + 654{,}5\,\vec{j} - 1309{,}1\,\vec{k}$ N·m.
          - texto: >-
              Si se toma $B$ en lugar de $A$ como punto de aplicación, el
              momento cambia, porque $B$ está más lejos de $C$.
            trampa: true
            mensaje: |
              La fuerza es deslizante: vale cualquier punto de su recta
              soporte. $\overrightarrow{CB} = \overrightarrow{CA} + \overrightarrow{AB}$,
              y $\overrightarrow{AB} \times \vec{F} = \vec{0}$ porque son
              paralelos. El momento es el mismo.
    resolucion: |
      **La fuerza.** El cable tira de $A(0, 8, 11)$ hacia $B(6, 10, 2)$ con
      400 N. Su dirección es $\overrightarrow{AB} = (6, 2, -9)$, de módulo
      11 m, así que

      $$
      \vec{F} = \frac{400}{11}\,(6,\ 2,\ -9) = (218{,}18;\ 72{,}73;\ -327{,}27)\ \text{N}
      $$

      **El momento.** Con $C(0, 2, 8)$, el vector de posición es
      $\overrightarrow{CA} = (0, 6, 3)$ m, y

      $$
      \vec{M}_C = \overrightarrow{CA} \times \vec{F} =
      \begin{vmatrix} \vec{i} & \vec{j} & \vec{k} \\ 0 & 6 & 3 \\ 218{,}18 & 72{,}73 & -327{,}27 \end{vmatrix}
      = -2181{,}8\,\vec{i} + 654{,}5\,\vec{j} - 1309{,}1\,\vec{k}\ \text{N·m}
      $$

      En fracción exacta es $(-24000,\ 7200,\ -14400)/11$. La colección da
      $-2180\,\vec{i} + 655\,\vec{j} - 1309\,\vec{k}$, que es lo mismo
      redondeado a tres o cuatro cifras.

      **Comprobación.** Tomando $B$ como punto de aplicación, que está en la
      misma recta, $\overrightarrow{CB} \times \vec{F}$ da exactamente el
      mismo vector. Y el momento es perpendicular a la fuerza:
      $\vec{M}_C \cdot \vec{F} = 0$.

      Las coordenadas de $A$ y $C$ se leen de las cotas de la figura: $C$ a
      2 m del eje $z$ y 8 m de altura, $A$ a $2 + 6 = 8$ m del eje y 11 m de
      altura, los dos en el plano $x = 0$. Con ellas sale el resultado
      publicado.

  - id: ejma1-col14-tres-fuerzas-en-el-extremo-de-una-escuadra
    titulo: Tres fuerzas en el extremo de una escuadra, y sus momentos respecto de los ejes
    fuente: >-
      Ejercicio 1.4 · Tema 1, «Fundamentos de cálculo vectorial» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo. Los valores numéricos de
      prueba de los pasos son nuestros.
    nivel: practica
    enunciado: |
      Calcular los momentos respecto a los ejes $x$, $y$, y $z$ originadas
      por las fuerzas $P_1, P_2, P_3$.

      <figure>
      <svg viewBox="0 0 300 260" role="img" width="300" height="260" aria-labelledby="ejma1-col14-t ejma1-col14-d">
        <title id="ejma1-col14-t">Una escuadra empotrada en una pared con tres fuerzas en su extremo A</title>
        <desc id="ejma1-col14-d">Una pared, el plano x = 0, con el origen O. El eje x sale perpendicular a la pared hacia la derecha, el eje y está dibujado hacia abajo y el eje z en perspectiva, hacia el fondo y a la derecha. La escuadra va de O a lo largo del eje x una longitud a y luego gira y avanza una longitud b en el sentido de las z negativas, hacia el observador, hasta el extremo A. En A actúan tres fuerzas: P1 en el sentido de las z positivas, P2 en el de las x negativas y P3 en el de las y negativas, es decir, dibujada hacia arriba.</desc>
        <defs>
          <marker id="ejma1-col14-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
          <marker id="ejma1-col14-ff" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
        </defs>
        <polygon points="44,93 120,17 120,169 44,245" fill="var(--d4)" fill-opacity="0.18" stroke="var(--d4)" stroke-width="0.9"/>
        <line x1="80" y1="105" x2="272" y2="105" stroke="var(--ink)" stroke-width="1.3" marker-end="url(#ejma1-col14-fe)"/>
        <line x1="80" y1="105" x2="80" y2="222" stroke="var(--ink)" stroke-width="1.3" marker-end="url(#ejma1-col14-fe)"/>
        <line x1="80" y1="105" x2="138" y2="47" stroke="var(--ink)" stroke-width="1.3" marker-end="url(#ejma1-col14-fe)"/>
        <text x="276" y="109" font-size="10" fill="var(--ink)">x</text>
        <text x="86" y="232" font-size="10" fill="var(--ink)">y</text>
        <text x="142" y="46" font-size="10" fill="var(--ink)">z</text>
        <text x="70" y="101" font-size="10" text-anchor="end" fill="var(--ink)">O</text>
        <path d="M80 105 L215 105 L179 141" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/>
        <text x="147" y="99" font-size="10" fill="var(--ink)">a</text>
        <text x="203" y="130" font-size="10" fill="var(--ink)">b</text>
        <text x="170" y="136" font-size="10" text-anchor="end" fill="var(--ink)">A</text>
        <line x1="149" y1="171" x2="177" y2="143" stroke="var(--flag)" stroke-width="1.8" marker-end="url(#ejma1-col14-ff)"/>
        <line x1="232" y1="141" x2="183" y2="141" stroke="var(--flag)" stroke-width="1.8" marker-end="url(#ejma1-col14-ff)"/>
        <line x1="179" y1="202" x2="179" y2="145" stroke="var(--flag)" stroke-width="1.8" marker-end="url(#ejma1-col14-ff)"/>
        <text x="140" y="188" font-size="10" text-anchor="end" fill="var(--flag)">P₁</text>
        <text x="238" y="145" font-size="10" fill="var(--flag)">P₂</text>
        <text x="185" y="214" font-size="10" fill="var(--flag)">P₃</text>
      </svg>
      </figure>
    pide: >-
      Los momentos de las tres fuerzas respecto de los ejes x, y, z, en función
      de P1, P2, P3, a y b.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué relación hay entre los momentos respecto de los tres ejes y el
          momento $\vec{M}_O$ respecto del origen?
        opciones:
          - texto: >-
              Son las tres componentes de $\vec{M}_O$, porque O está en los tres
              ejes
            correcta: true
            mensaje: |
              Eso es: el momento respecto de un eje es la proyección sobre él
              del momento en cualquier punto del eje. $O$ está en los tres,
              así que $M_x = \vec{M}_O \cdot \vec{i}$, y lo mismo con $y$ y
              $z$.
          - texto: >-
              Cada una es el módulo de la fuerza por la distancia de A al
              origen
            mensaje: |
              Esa sería una cuenta de módulos, sin dirección. El momento
              respecto de un eje depende de qué componente de la fuerza
              **cruza** el eje y a qué distancia, no de la distancia a $O$.
          - texto: >-
              No hay relación, cada eje necesita su propio punto de
              referencia
            mensaje: |
              Sí la hay, y ahorra trabajo: el resultado no depende del punto
              del eje que elijas, y $O$ vale para los tres a la vez.

      - tipo: reconocer
        pregunta: |
          En la figura, el eje $y$ está dibujado hacia abajo y el eje $z$ en
          perspectiva, hacia el fondo. ¿Cuál es el vector de posición
          $\overrightarrow{OA}$?
        opciones:
          - texto: $\overrightarrow{OA} = a\,\vec{i} - b\,\vec{k}$
            correcta: true
            mensaje: |
              Eso es. La escuadra avanza $a$ según $x$ y luego $b$ hacia el
              observador, que es el sentido contrario al eje $z$ dibujado.
          - texto: $\overrightarrow{OA} = a\,\vec{i} + b\,\vec{j}$
            mensaje: |
              El tramo $b$ no va según $y$: el eje $y$ está dibujado vertical
              hacia abajo, y el tramo $b$ va en diagonal, paralelo al eje $z$
              de la perspectiva.
          - texto: $\overrightarrow{OA} = a\,\vec{i} + b\,\vec{k}$
            mensaje: |
              La dirección es la buena y el sentido no: el eje $z$ se aleja
              hacia el fondo y el tramo $b$ viene hacia delante.

      - tipo: calcular
        titulo: El momento respecto del eje x, con números de prueba
        pregunta: |
          Las fuerzas son $\vec{P}_1 = P_1\vec{k}$, $\vec{P}_2 = -P_2\vec{i}$
          y $\vec{P}_3 = -P_3\vec{j}$. Para comprobar tu expresión con
          números, toma $P_1 = 10$, $P_2 = 20$, $P_3 = 30$ N, $a = 3$ y
          $b = 2$ m, que son valores de prueba nuestros y no del enunciado.
          ¿Cuánto vale $M_x$?
        respuesta:
          tipo: numero
          valor: '-60'
          tolerancia: 0.01
          formato: un número con su signo, en N·m
        distractores:
          - valor: '60'
            mensaje: |
              Signo cambiado. O has puesto $\vec{F} \times \overrightarrow{OA}$,
              o has tomado el tramo $b$ hacia $+z$. Con
              $\overrightarrow{OA} = (a, 0, -b)$ y $\vec{F} = (-P_2, -P_3, P_1)$,
              $M_x = r_y F_z - r_z F_y = 0 - (-b)(-P_3) = -P_3 b$.
          - valor: '20'
            mensaje: |
              Has leído el tramo $b$ según el eje $y$,
              $\overrightarrow{OA} = (a, b, 0)$. Mira la perspectiva: $b$ es
              paralelo al eje $z$.
        pista: |
          $M_x = r_y F_z - r_z F_y$, con $\vec{r} = (a, 0, -b)$ y
          $\vec{F} = (-P_2, -P_3, P_1)$.
        desarrollo: |
          $$
          M_x = 0 \cdot P_1 - (-b)(-P_3) = -P_3\,b = -30 \cdot 2 = -60\ \text{N·m}
          $$

      - tipo: calcular
        titulo: El momento respecto del eje y
        pregunta: |
          Con los mismos valores de prueba, ¿cuánto vale $M_y$?
        respuesta:
          tipo: numero
          valor: '10'
          tolerancia: 0.01
          formato: un número con su signo, en N·m
        distractores:
          - valor: '-10'
            mensaje: |
              Signo cambiado en los dos términos: es
              $\vec{F} \times \overrightarrow{OA}$ en vez de
              $\overrightarrow{OA} \times \vec{F}$.
          - valor: '-70'
            mensaje: |
              Has tomado el tramo $b$ hacia $+z$. Con $r_z = -b$,
              $M_y = r_z F_x - r_x F_z = (-b)(-P_2) - a P_1 = P_2 b - P_1 a$.
          - valor: '-30'
            mensaje: |
              Has tomado $\overrightarrow{OA} = (a, b, 0)$, y entonces $P_2$ ya
              no da momento respecto de $y$. Pero $P_2$ sí lo da: está a una
              distancia $b$ del plano $xy$.
        pista: |
          $M_y = r_z F_x - r_x F_z$.
        desarrollo: |
          $$
          M_y = (-b)(-P_2) - a\,P_1 = -P_1 a + P_2 b = -30 + 40 = 10\ \text{N·m}
          $$

      - tipo: calcular
        titulo: El momento respecto del eje z
        pregunta: |
          ¿Y $M_z$?
        respuesta:
          tipo: numero
          valor: '-90'
          tolerancia: 0.01
          formato: un número con su signo, en N·m
        distractores:
          - valor: '90'
            mensaje: |
              Signo cambiado: $M_z = r_x F_y - r_y F_x = a\,(-P_3) - 0$. La
              fuerza $P_3$ va hacia $-y$.
          - valor: '-50'
            mensaje: |
              Has tomado $\overrightarrow{OA} = (a, b, 0)$ y te ha aparecido
              un término con $P_2$. Con el tramo $b$ según $z$, la recta de
              $P_2$ —paralela a $x$, en $y = 0$— corta el eje $z$ en el punto
              $(0, 0, -b)$, y una fuerza que corta un eje no da momento
              respecto de él.
        pista: |
          $M_z = r_x F_y - r_y F_x$, con $r_y = 0$.
        desarrollo: |
          $$
          M_z = a\,(-P_3) - 0 \cdot (-P_2) = -P_3\,a = -90\ \text{N·m}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Las tres fuerzas están aplicadas en $A$, así que se pueden sumar
              en una: $\vec{F} = -P_2\,\vec{i} - P_3\,\vec{j} + P_1\,\vec{k}$.
          - texto: >-
              Con $\overrightarrow{OA} = a\,\vec{i} - b\,\vec{k}$,
              $\vec{M}_O = \overrightarrow{OA} \times \vec{F} = -P_3 b\,\vec{i} + (-P_1 a + P_2 b)\,\vec{j} - P_3 a\,\vec{k}$.
          - texto: >-
              Los momentos respecto de los ejes son las componentes de
              $\vec{M}_O$: $M_x = -P_3 b$, $M_y = -P_1 a + P_2 b$ y
              $M_z = -P_3 a$.
          - texto: >-
              $P_1$ no da momento respecto de ningún eje, porque es paralela
              al eje $z$.
            trampa: true
            mensaje: |
              Ser paralela al eje $z$ la deja sin momento respecto de **ese**
              eje, no de los otros dos. Respecto de $y$ sí cruza, a una
              distancia $a$, y por eso aparece $-P_1 a$ en $M_y$.
    resolucion: |
      **La idea.** El momento respecto de un eje es la componente, según el
      eje, del momento en cualquier punto suyo. El origen está en los tres
      ejes, así que basta con $\vec{M}_O$: sus componentes son $M_x$, $M_y$ y
      $M_z$.

      **La geometría.** Leída la perspectiva de la figura —$x$ a la derecha,
      $y$ hacia abajo, $z$ hacia el fondo—, el extremo es
      $\overrightarrow{OA} = a\,\vec{i} - b\,\vec{k}$, y las fuerzas son
      $P_1\,\vec{k}$, $-P_2\,\vec{i}$ y $-P_3\,\vec{j}$. Como comparten punto
      de aplicación, como dice la nota de la colección, se suman en una sola:

      $$
      \vec{M}_O =
      \begin{vmatrix} \vec{i} & \vec{j} & \vec{k} \\ a & 0 & -b \\ -P_2 & -P_3 & P_1 \end{vmatrix}
      = -P_3 b\,\vec{i} + (-P_1 a + P_2 b)\,\vec{j} - P_3 a\,\vec{k}
      $$

      **El resultado.** $M_x = -P_3 b$, $M_y = -P_1 a + P_2 b$ y
      $M_z = -P_3 a$, que es exactamente el de la colección. Con los valores
      de prueba de los pasos ($P_1 = 10$, $P_2 = 20$, $P_3 = 30$ N, $a = 3$,
      $b = 2$ m) da $(-60,\ 10,\ -90)$ N·m, y el producto vectorial hecho con
      esos números da lo mismo.

      **Eje por eje, sin determinante.** $P_3$ cruza el eje $x$ a distancia
      $b$ y el eje $z$ a distancia $a$; $P_1$ cruza el eje $y$ a distancia
      $a$ y $P_2$ lo cruza a distancia $b$, con sentidos de giro opuestos. Lo
      demás es cero por la regla de la puerta: cada fuerza es paralela a un
      eje, $P_1$ corta además el eje $x$ y $P_2$ corta el eje $z$.
  - id: ejma1-col15-tres-vectores-aplicados-en-tres-puntos
    titulo: Tres vectores en tres puntos, reducidos al origen
    fuente: >-
      Ejercicio 1.5 · Tema 1, «Fundamentos de cálculo vectorial» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Los vectores $\vec{v}_1$, $\vec{v}_2$ y $\vec{v}_3$ están aplicados
      respectivamente sobre los puntos siguientes $A_1 = (-1,0,2)$,
      $A_2 = (3,-1,0)$ y $A_3 = (-1,1,-1)$.

      $$
      \vec{v}_1 = 3\vec{i} - \vec{j} + 2\vec{k};\quad \vec{v}_2 = \vec{i} + 3\vec{j};\quad \vec{v}_3 = 2\vec{i} - \vec{j} + 4\vec{k}
      $$

      Calcular:

      **a.** Resultante $\vec{R}$ del sistema y momento $\vec{M}_O$ sobre el
      origen.

      **b.** Invariantes vectorial y escalar del sistema.

      **c.** Vector momento mínimo del sistema.
    pide: >-
      La resultante, el momento en el origen, el invariante escalar y el
      vector momento mínimo.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se obtiene el momento del sistema en el origen?
        opciones:
          - texto: >-
              Sumando el momento de cada vector, con el vector de posición de
              su propio punto de aplicación: $\sum \overrightarrow{OA_i} \times \vec{v}_i$
            correcta: true
            mensaje: |
              Eso es. Cada vector aporta su momento, y cada uno con **su**
              punto de aplicación. El momento del sistema es la suma.
          - texto: >-
              Multiplicando la suma de las posiciones por la resultante,
              $\left(\sum \overrightarrow{OA_i}\right) \times \vec{R}$
            mensaje: |
              Eso solo valdría si los tres estuvieran aplicados en el mismo
              punto. Aquí da $(-1, 0, 1)$, que no tiene nada que ver: el
              producto vectorial no reparte así.
          - texto: >-
              Con $\sum \vec{v}_i \times \overrightarrow{OA_i}$, que es lo
              mismo en otro orden
            mensaje: |
              No es lo mismo: el producto vectorial es anticonmutativo, y
              cambiar el orden cambia el signo de todo el momento.

      - tipo: calcular
        titulo: El momento en el origen
        pregunta: |
          La resultante es $\vec{R} = 6\vec{i} + \vec{j} + 6\vec{k}$. ¿Cuánto
          vale $\vec{M}_O$?
        respuesta:
          tipo: vector
          valor: '(5, 10, 10)'
          tolerancia: 0.001
          formato: tres componentes entre paréntesis, separadas por comas
        distractores:
          - valor: '(-5, -10, -10)'
            mensaje: |
              Signo cambiado en todo: has hecho $\vec{v}_i \times \overrightarrow{OA_i}$.
              El vector de posición va primero.
          - valor: '(-1, 0, 1)'
            mensaje: |
              Es $\left(\sum \overrightarrow{OA_i}\right) \times \vec{R}$.
              Los vectores están aplicados en puntos distintos, y cada uno
              lleva su propio brazo.
        pista: |
          $\overrightarrow{OA_1} \times \vec{v}_1 = (2, 8, 1)$. Faltan los
          otros dos.
        desarrollo: |
          $$
          (2, 8, 1) + (0, 0, 10) + (3, 2, -1) = (5, 10, 10)
          $$

      - tipo: calcular
        titulo: El invariante escalar
        pregunta: |
          ¿Cuánto vale $\tau = \vec{M}_O \cdot \vec{R}$?
        respuesta:
          tipo: numero
          valor: '100'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '73'
            mensaje: |
              Ese es $\vec{R} \cdot \vec{R} = R^{2}$. El invariante es el
              producto escalar del **momento** por la resultante.
          - valor: '128.16'
            mensaje: |
              Has multiplicado los módulos, $15 \cdot \sqrt{73}$. Eso sería el
              producto escalar solo si $\vec{M}_O$ y $\vec{R}$ fueran
              paralelos, y no lo son.
        pista: |
          $(5, 10, 10) \cdot (6, 1, 6)$.
        desarrollo: |
          $$
          \tau = 5 \cdot 6 + 10 \cdot 1 + 10 \cdot 6 = 100
          $$

      - tipo: calcular
        titulo: El módulo del momento mínimo
        pregunta: |
          ¿Cuánto mide el momento mínimo?
        respuesta:
          tipo: numero
          valor: '11.704'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '1.37'
            mensaje: |
              $\tau / R^{2} = 100/73$ es el factor que multiplica a $\vec{R}$
              para dar el vector momento mínimo, no su módulo. El módulo es
              $\tau / R$.
          - valor: '15'
            mensaje: |
              Es $|\vec{M}_O|$. El origen no está en el eje central, así que
              su momento no es el mínimo: tiene además una parte
              perpendicular a $\vec{R}$.
        pista: |
          $|\vec{M}_{\min}| = \tau / R$, con $R = \sqrt{73}$.
        desarrollo: |
          $$
          |\vec{M}_{\min}| = \frac{100}{\sqrt{73}} = 11{,}704
          $$

      - tipo: calcular
        titulo: La componente x del momento mínimo
        pregunta: |
          El vector momento mínimo es $\vec{M}_{\min} = \dfrac{\tau}{R^{2}}\,\vec{R}$.
          ¿Cuánto vale su componente $x$?
        respuesta:
          tipo: numero
          valor: '8.219'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '70.22'
            mensaje: |
              Has multiplicado $\tau / R$ por $R_x$: te falta dividir otra vez
              por $R$. El vector es $\tau/R^{2}$ veces $\vec{R}$, o el módulo
              $\tau/R$ por el **unitario** de $\vec{R}$.
          - valor: '5'
            mensaje: |
              Es $M_{O,x}$. El momento en el origen no es el mínimo, que
              además tiene que ser paralelo a $\vec{R}$, y $(5, 10, 10)$ no lo
              es.
        pista: |
          $\tau / R^{2} = 100/73 = 1{,}3699$.
        desarrollo: |
          $$
          \vec{M}_{\min} = \frac{100}{73}\,(6, 1, 6) = 8{,}219\,\vec{i} + 1{,}370\,\vec{j} + 8{,}219\,\vec{k}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $\vec{R} = \sum \vec{v}_i = 6\vec{i} + \vec{j} + 6\vec{k}$, que
              es además el invariante vectorial.
          - texto: >-
              $\vec{M}_O = \sum \overrightarrow{OA_i} \times \vec{v}_i = 5\vec{i} + 10\vec{j} + 10\vec{k}$.
          - texto: >-
              $\tau = \vec{M}_O \cdot \vec{R} = 100$, y
              $\vec{M}_{\min} = \tfrac{100}{73}\vec{R} = 8{,}22\vec{i} + 1{,}37\vec{j} + 8{,}22\vec{k}$.
          - texto: >-
              Como $\tau \neq 0$, el sistema se reduce a una única fuerza
              aplicada en el eje central.
            trampa: true
            mensaje: |
              Es al revés: una fuerza única solo es posible con $\tau = 0$.
              Con $\tau \neq 0$ el sistema se reduce a la resultante más el
              momento mínimo sobre el eje central, un torsor, y no se puede
              simplificar más.
    resolucion: |
      **a. Resultante y momento en el origen.**

      $$
      \vec{R} = \vec{v}_1 + \vec{v}_2 + \vec{v}_3 = 6\vec{i} + \vec{j} + 6\vec{k}
      $$

      Cada vector aporta su momento con el brazo de su propio punto:

      $$
      \overrightarrow{OA_1} \times \vec{v}_1 = (2, 8, 1)
      \quad
      \overrightarrow{OA_2} \times \vec{v}_2 = (0, 0, 10)
      \quad
      \overrightarrow{OA_3} \times \vec{v}_3 = (3, 2, -1)
      $$

      y la suma es $\vec{M}_O = 5\vec{i} + 10\vec{j} + 10\vec{k}$.

      **b. Invariantes.** El vectorial es la propia resultante,
      $6\vec{i} + \vec{j} + 6\vec{k}$. El escalar,
      $\tau = \vec{M}_O \cdot \vec{R} = 30 + 10 + 60 = 100$. Calculado con el
      momento en otro punto cualquiera sale lo mismo, que es la comprobación
      natural.

      **c. Momento mínimo.** Es la proyección del momento sobre la
      resultante, con la dirección de esta:

      $$
      \vec{M}_{\min} = \frac{\tau}{R^{2}}\,\vec{R} = \frac{100}{73}\,(6, 1, 6) = 8{,}22\,\vec{i} + 1{,}37\,\vec{j} + 8{,}22\,\vec{k}
      \qquad
      |\vec{M}_{\min}| = \frac{\tau}{R} = 11{,}70
      $$

      Todo coincide con el resultado de la colección.

  - id: ejma1-col16-dos-pares-sobre-un-bloque
    titulo: Dos pares de fuerzas sobre un bloque
    fuente: >-
      Ejercicio 1.6 · Tema 1, «Fundamentos de cálculo vectorial» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      El elemento de la figura soporta dos pares de fuerzas. Calcular la
      resultante del momento siendo $F_1 = 200\ \text{N}$ y
      $F_2 = 100\ \text{N}$.

