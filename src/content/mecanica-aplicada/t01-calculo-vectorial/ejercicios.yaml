    pide: La resultante del sistema y a qué distancia de la pared va la fuerza única equivalente.
    pasos:
      - tipo: reconocer
        pregunta: |
          El sistema equivalente es una sola fuerza. ¿Qué dos condiciones la
          fijan?
        opciones:
          - texto: >-
              Que sea la resultante, y que su momento respecto de la pared sea
              el momento del sistema, incluido el par
            correcta: true
            mensaje: |
              Eso es. Dos sistemas son equivalentes si tienen la misma
              resultante y el mismo momento en un punto. La fuerza única es
              $\vec{R}$, y su posición sale de igualar momentos.
          - texto: >-
              Que sea la resultante, colocada en la media de las posiciones
              ponderada por las fuerzas; el par no cuenta porque no tiene
              resultante
            mensaje: |
              El par no aporta resultante, pero sí momento, y el momento es
              lo que decide dónde va la fuerza. Olvidarlo coloca la fuerza a
              18 m de la pared, fuera de la viga.
          - texto: >-
              No se puede: un sistema con un par nunca se reduce a una sola
              fuerza
            mensaje: |
              Se puede siempre que $\tau = 0$ y $\vec{R} \neq \vec{0}$, y un
              sistema plano tiene siempre $\tau = 0$. El par se absorbe
              desplazando la resultante.

      - tipo: calcular
        titulo: La resultante
        pregunta: |
          Con $y$ hacia arriba, ¿cuánto vale $R_y$, en newtons?
        respuesta:
          tipo: numero
          valor: '-100'
          tolerancia: 0.01
          formato: un número con su signo, en N
        distractores:
          - valor: '100'
            mensaje: |
              Signo cambiado. Hacia abajo van $400 + 200 = 600$ N y hacia
              arriba solo 500: la resultante apunta hacia abajo.
          - valor: '-1100'
            mensaje: |
              Has tomado los 500 N hacia abajo. La flecha de 500 N empuja la
              viga hacia **arriba**.
        pista: |
          $500 - 400 - 200$.
        desarrollo: |
          $$
          \vec{R} = (500 - 400 - 200)\,\vec{j} = -100\,\vec{j}\ \text{N}
          $$

      - tipo: calcular
        titulo: El momento en el empotramiento
        pregunta: |
          Tomando el origen en el empotramiento, ¿cuánto vale la componente
          $z$ de $\vec{M}_O$, en N·m?
        respuesta:
          tipo: numero
          valor: '-300'
          tolerancia: 0.1
          formato: un número con su signo, en N·m
        distractores:
          - valor: '-1800'
            mensaje: |
              Te has dejado el par. $1500$ N·m antihorario es $+1500\,\vec{k}$,
              y se suma tal cual: un par tiene el mismo momento en todos los
              puntos.
          - valor: '-3300'
            mensaje: |
              Has tomado el par en sentido horario. La flecha de la figura gira
              en sentido antihorario, que con $x$ a la derecha e $y$ arriba es
              $+\vec{k}$.
          - valor: '300'
            mensaje: |
              Signo cambiado en los momentos de las fuerzas. Una fuerza hacia
              abajo a la derecha del origen gira en sentido horario:
              $(4, 0, 0) \times (0, -400, 0) = -1600\,\vec{k}$.
        pista: |
          $M_{O,z} = 2 \cdot 500 - 4 \cdot 400 - 6 \cdot 200 + 1500$.
        desarrollo: |
          $$
          M_{O,z} = 1000 - 1600 - 1200 + 1500 = -300\ \text{N·m}
          $$

      - tipo: calcular
        titulo: La distancia a la pared
        pregunta: |
          ¿A qué distancia $x$ de la pared hay que colocar $\vec{R}$ para que
          su momento en el empotramiento sea $\vec{M}_O$?
        respuesta:
          tipo: magnitud
          valor: '3 m'
          tolerancia: 0.01
          formato: una distancia, con su unidad
        distractores:
          - valor: '18 m'
            mensaje: |
              Es lo que sale sin el par: $-1800 = x\,(-100)$. El par no mueve
              la resultante en módulo, pero sí de sitio.
          - valor: '33 m'
            mensaje: |
              Arrastras el par con el signo cambiado, $-3300$. Con el par
              antihorario, $M_{O,z} = -300$ y $x = 3$ m.
        pista: |
          $(x\,\vec{i}) \times (-100\,\vec{j}) = -100\,x\,\vec{k}$, y eso tiene
          que valer $-300\,\vec{k}$.
        desarrollo: |
          $$
          -100\,x = -300 \quad\Longrightarrow\quad x = 3\ \text{m}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La resultante es $\vec{R} = (500 - 400 - 200)\,\vec{j} = -100\,\vec{j}$ N.
          - texto: >-
              El momento en el empotramiento, con el par antihorario, es
              $\vec{M}_O = (1000 - 1600 - 1200 + 1500)\,\vec{k} = -300\,\vec{k}$ N·m.
          - texto: >-
              La fuerza única $-100\,\vec{j}$ colocada en $x$ tiene momento
              $-100\,x\,\vec{k}$, que vale $\vec{M}_O$ para $x = 3$ m.
          - texto: >-
              El par de 1500 N·m no afecta a la posición, porque su
              resultante es nula.
            trampa: true
            mensaje: |
              Que no tenga resultante significa que no cambia $\vec{R}$, no que
              no cambie el momento. Sin él, el momento sería $-1800$ y la
              fuerza iría a 18 m de la pared.
    resolucion: |
      **La resultante.** Con $y$ hacia arriba:
      $\vec{R} = (500 - 400 - 200)\,\vec{j} = -100\,\vec{j}$ N.

      **El momento en el empotramiento.** Es el origen natural, como dice la
      nota de la colección. Cada fuerza vertical en $x_i$ da
      $x_i F_i\,\vec{k}$, y el par antihorario suma $+1500\,\vec{k}$ tal cual:

      $$
      \vec{M}_O = (2 \cdot 500 - 4 \cdot 400 - 6 \cdot 200 + 1500)\,\vec{k} = -300\,\vec{k}\ \text{N·m}
      $$

      **La fuerza única.** El sistema equivalente tiene la misma resultante y
      el mismo momento en $O$. Colocada a una distancia $x$ de la pared:

      $$
      (x\,\vec{i}) \times (-100\,\vec{j}) = -100\,x\,\vec{k} = -300\,\vec{k}
      \quad\Longrightarrow\quad x = 3\ \text{m}
      $$

      Coincide con la colección: $\vec{R} = -100\,\vec{j}$ N a 3 m de la
      pared. El sistema plano tiene $\tau = 0$, y por eso cabe en una sola
      fuerza: su recta es el eje central.

  - id: ejma1-col18-el-cuadrado-y-los-dos-vectores-que-faltan
    titulo: El cuadrado y los dos vectores que faltan
    fuente: >-
      Ejercicio 1.8 · Tema 1, «Fundamentos de cálculo vectorial» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      En el cuadrado $ABCD$ de la figura sobre el lado $AB$ actúa una fuerza
      $\vec{F}_1 = 20\vec{j}$ y sobre el lado $CD$ $\vec{F}_2 = -20\vec{j}$.
      Encontrar qué vectores hay que poner en los lados $AC$ y $BD$ -
      $\vec{F}_3$ y $\vec{F}_4$ respectivamente - para que el sistema de
      vectores formado por los cuatro vectores tenga resultante nula y su
      momento resultante respecto al punto $0$, origen de coordenadas sea
      $30\vec{i}$.

      <figure>
      <svg viewBox="0 0 260 260" role="img" width="260" height="260" aria-labelledby="ejma1-col18-t ejma1-col18-d">
        <title id="ejma1-col18-t">Un cuadrado ABCD en el plano yz</title>
        <desc id="ejma1-col18-d">Perspectiva de los ejes x, y, z con el cuadrado ABCD contenido en el plano yz. A está en y = 1, z = 2; B en y = 4, z = 2; C en y = 1, z = 5; y D en y = 4, z = 5. Los lados AB y CD son horizontales, paralelos al eje y, y los lados AC y BD verticales, paralelos al eje z.</desc>
        <defs>
          <marker id="ejma1-col18-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <line x1="60" y1="200" x2="17.6" y2="242.4" stroke="var(--ink)" stroke-width="1.2" marker-end="url(#ejma1-col18-fe)"/>
        <line x1="60" y1="200" x2="219" y2="200" stroke="var(--ink)" stroke-width="1.2" marker-end="url(#ejma1-col18-fe)"/>
        <line x1="60" y1="200" x2="60" y2="20" stroke="var(--ink)" stroke-width="1.2" marker-end="url(#ejma1-col18-fe)"/>
        <text x="10" y="254" font-size="10" fill="var(--ink)">x</text>
        <text x="224" y="204" font-size="10" fill="var(--ink)">y</text>
        <text x="66" y="22" font-size="10" fill="var(--ink)">z</text>
        <text x="50" y="214" font-size="10" text-anchor="end" fill="var(--ink)">O</text>
        <line x1="90" y1="140" x2="90" y2="200" stroke="var(--faint)" stroke-width="0.6"/>
        <line x1="180" y1="140" x2="180" y2="200" stroke="var(--faint)" stroke-width="0.6"/>
        <line x1="60" y1="140" x2="90" y2="140" stroke="var(--faint)" stroke-width="0.6"/>
        <line x1="60" y1="50" x2="90" y2="50" stroke="var(--faint)" stroke-width="0.6"/>
        <polygon points="90,140 180,140 180,50 90,50" fill="var(--faint)" fill-opacity="0.25" stroke="var(--ink)" stroke-width="1.4"/>
        <text x="90" y="214" font-size="9" text-anchor="middle" fill="var(--ink)">1</text>
        <text x="180" y="214" font-size="9" text-anchor="middle" fill="var(--ink)">4</text>
        <text x="54" y="143" font-size="9" text-anchor="end" fill="var(--ink)">2</text>
        <text x="54" y="53" font-size="9" text-anchor="end" fill="var(--ink)">5</text>
        <text x="94" y="154" font-size="10" fill="var(--ink)">A</text>
        <text x="186" y="144" font-size="10" fill="var(--ink)">B</text>
        <text x="94" y="44" font-size="10" fill="var(--ink)">C</text>
        <text x="186" y="44" font-size="10" fill="var(--ink)">D</text>
      </svg>
      </figure>
    pide: Los vectores F3, sobre AC, y F4, sobre BD.
    pasos:
      - tipo: reconocer
        pregunta: |
          $\vec{F}_3$ y $\vec{F}_4$ tienen que ir **en** los lados $AC$ y
          $BD$. ¿Qué dice eso de ellos, junto con la condición de resultante
          nula?
        opciones:
          - texto: >-
              Que los dos son paralelos al eje z y opuestos entre sí: forman
              un par
            correcta: true
            mensaje: |
              Eso es. $AC$ y $BD$ son paralelos a $z$, así que
              $\vec{F}_3 = f_3\,\vec{k}$ y $\vec{F}_4 = f_4\,\vec{k}$. Como
              $\vec{F}_1 + \vec{F}_2 = \vec{0}$, la resultante nula exige
              $f_4 = -f_3$.
          - texto: >-
              Que pueden tener cualquier dirección mientras sumen cero
            mensaje: |
              Un vector deslizante «en» un lado tiene la dirección de ese
              lado. Sin esa condición el problema tendría infinitas
              soluciones.
          - texto: >-
              Que tienen que ser iguales a $\vec{F}_1$ y $\vec{F}_2$, para
              que el cuadrado quede simétrico
            mensaje: |
              $\vec{F}_1$ y $\vec{F}_2$ van según $y$, y en los lados $AC$ y
              $BD$ no cabe un vector según $y$. Además, nada en el enunciado
              pide simetría: pide un momento concreto, $30\,\vec{i}$.

      - tipo: calcular
        titulo: El momento de las dos fuerzas dadas
        pregunta: |
          $\vec{F}_1$ está en el lado $AB$ ($z = 2$) y $\vec{F}_2$ en el
          $CD$ ($z = 5$). ¿Cuánto vale la componente $x$ de su momento en
          $O$?
        respuesta:
          tipo: numero
          valor: '60'
          tolerancia: 0.01
          formato: un número con su signo
        distractores:
          - valor: '-60'
            mensaje: |
              Signo cambiado. $(0, y, 2) \times (0, 20, 0) = (-40, 0, 0)$ y
              $(0, y, 5) \times (0, -20, 0) = (100, 0, 0)$: la suma es $+60$.
          - valor: '140'
            mensaje: |
              Has sumado los dos momentos en valor absoluto. $\vec{F}_1$ da
              $-40\,\vec{i}$ y $\vec{F}_2$ da $+100\,\vec{i}$: tienen signos
              contrarios.
        pista: |
          La componente $x$ de $\vec{r} \times \vec{F}$ es $r_y F_z - r_z F_y$,
          y aquí $F_z = 0$.
        desarrollo: |
          $$
          M_x = -2 \cdot 20 - 5 \cdot (-20) = -40 + 100 = 60
          $$

      - tipo: calcular
        titulo: El vector del lado AC
        pregunta: |
          Con $\vec{F}_3 = f_3\,\vec{k}$ en $AC$ ($y = 1$) y
          $\vec{F}_4 = -f_3\,\vec{k}$ en $BD$ ($y = 4$), ¿cuánto vale $f_3$
          para que el momento total en $O$ sea $30\,\vec{i}$?
        respuesta:
          tipo: numero
          valor: '10'
          tolerancia: 0.01
          formato: un número con su signo
        distractores:
          - valor: '-10'
            mensaje: |
              Te has dejado el momento de $\vec{F}_1$ y $\vec{F}_2$: has
              impuesto que el par de $\vec{F}_3$ y $\vec{F}_4$ valga
              $30\,\vec{i}$ él solo. Tiene que valer $30 - 60 = -30$.
          - valor: '7.5'
            mensaje: |
              Te has olvidado del momento de $\vec{F}_3$, que también da
              componente $x$: $(0, 1, z) \times (0, 0, f_3) = (f_3, 0, 0)$.
              El par entero es $f_3 - 4 f_3 = -3 f_3$.
        pista: |
          $(0, 1, z) \times (0, 0, f_3) + (0, 4, z') \times (0, 0, -f_3) = (-3 f_3,\ 0,\ 0)$.
        desarrollo: |
          $$
          60 - 3 f_3 = 30 \quad\Longrightarrow\quad f_3 = 10
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              En los lados $AC$ y $BD$ los vectores van según $z$:
              $\vec{F}_3 = f_3\,\vec{k}$ y $\vec{F}_4 = f_4\,\vec{k}$.
          - texto: >-
              Resultante nula: $f_3 + f_4 = 0$, porque $\vec{F}_1$ y
              $\vec{F}_2$ ya se anulan.
          - texto: >-
              Momento en $O$: $60 + f_3 + 4 f_4 = 30$, y con $f_4 = -f_3$ sale
              $f_3 = 10$.
          - texto: >-
              Así que $\vec{F}_3 = 10\,\vec{k}$ y $\vec{F}_4 = -10\,\vec{k}$,
              y el momento no depende de a qué altura de cada lado se
              pongan.
          - texto: >-
              Como la resultante es nula, el momento no depende del punto, y
              la condición de $30\,\vec{i}$ se puede escribir en $A$ en vez
              de en $O$ sin cambiar nada: basta con que se cumpla en uno.
          - texto: >-
              Hace falta saber a qué altura de $AC$ está aplicado
              $\vec{F}_3$, porque su momento respecto de $O$ depende de ella.
            trampa: true
            mensaje: |
              El vector es deslizante y va según $z$, que es la dirección del
              propio lado: moverlo por $AC$ es deslizarlo por su recta, y su
              momento no cambia. Por eso el enunciado no da ninguna altura.
    resolucion: |
      **Las incógnitas.** $AC$ y $BD$ son paralelos al eje $z$, así que los
      vectores que van en ellos son $\vec{F}_3 = f_3\,\vec{k}$ y
      $\vec{F}_4 = f_4\,\vec{k}$.

      **Resultante nula.** $\vec{F}_1 + \vec{F}_2 = \vec{0}$, así que
      $f_3 + f_4 = 0$.

      **Momento en O.** Las dos fuerzas dadas, en $AB$ ($z = 2$) y en $CD$
      ($z = 5$):

      $$
      (0, y, 2) \times (0, 20, 0) + (0, y, 5) \times (0, -20, 0) = -40\,\vec{i} + 100\,\vec{i} = 60\,\vec{i}
      $$

      Las dos nuevas, en $y = 1$ y en $y = 4$:
      $(0, 1, z) \times (0, 0, f_3) + (0, 4, z') \times (0, 0, f_4) = (f_3 + 4 f_4)\,\vec{i}$.
      La condición es

      $$
      60 + f_3 + 4 f_4 = 30
      \quad\text{con}\quad f_4 = -f_3
      \quad\Longrightarrow\quad f_3 = 10,\ f_4 = -10
      $$

      **El resultado.** $\vec{F}_3 = 10\,\vec{k}$ y $\vec{F}_4 = -10\,\vec{k}$,
      el de la colección. Es la idea de la nota: el sistema de partida más
      los dos vectores nuevos tiene que equivaler a un par de $30\,\vec{i}$,
      y el par que falta, $-30\,\vec{i}$, lo ponen $\vec{F}_3$ y
      $\vec{F}_4$ con brazo 3.

  - id: ejma1-col19-la-placa-y-la-fuerza-unica
    titulo: Una fuerza y un par sobre una placa, sustituidos por una fuerza
    fuente: >-
      Ejercicio 1.9 · Tema 1, «Fundamentos de cálculo vectorial» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      En la placa cuadrada de la figura actúan la fuerza $P$ y un par de
      fuerzas, siendo $P = 60\ \text{N}$, $Q = 40\ \text{N}$,
      $\alpha = 50^{\circ}$ y $a = 25\ \text{cm}$, sustituir el sistema de
      fuerzas por una única fuerza si su punto de aplicación está:

      **a.** En el lado $AB$.

      **b.** En el lado $AC$.

      Calcular en cada caso la distancia que existe entre el punto $A$ y el
      punto de aplicación de fuerza.

      <figure>
      <svg viewBox="0 0 330 250" role="img" width="330" height="250" aria-labelledby="ejma1-col19-t ejma1-col19-d">
        <title id="ejma1-col19-t">Placa cuadrada con una fuerza P en B y un par de fuerzas Q</title>
        <desc id="ejma1-col19-d">Una placa cuadrada de lado a con los vértices A arriba a la izquierda, B arriba a la derecha, C abajo a la izquierda y D abajo a la derecha. El origen está en A, con el eje x a lo largo del lado AB y el eje y hacia arriba. En A actúa una fuerza Q horizontal hacia la derecha y en C otra Q horizontal hacia la izquierda, que forman el par. En B actúa la fuerza P, hacia arriba y a la derecha, formando un ángulo alfa con el eje x.</desc>
        <defs>
          <marker id="ejma1-col19-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
          <marker id="ejma1-col19-ff" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
        </defs>
        <rect x="90" y="70" width="140" height="140" fill="var(--faint)" fill-opacity="0.25" stroke="var(--ink)" stroke-width="1.4"/>
        <line x1="90" y1="70" x2="300" y2="70" stroke="var(--ink)" stroke-width="1.2" marker-end="url(#ejma1-col19-fe)"/>
        <line x1="90" y1="70" x2="90" y2="20" stroke="var(--ink)" stroke-width="1.2" marker-end="url(#ejma1-col19-fe)"/>
        <text x="304" y="74" font-size="10" fill="var(--ink)">x</text>
        <text x="96" y="24" font-size="10" fill="var(--ink)">y</text>
        <line x1="30" y1="70" x2="87" y2="70" stroke="var(--flag)" stroke-width="2" marker-end="url(#ejma1-col19-ff)"/>
        <text x="50" y="62" font-size="10" fill="var(--flag)">Q</text>
        <line x1="90" y1="210" x2="33" y2="210" stroke="var(--flag)" stroke-width="2" marker-end="url(#ejma1-col19-ff)"/>
        <text x="50" y="202" font-size="10" fill="var(--flag)">Q</text>
        <line x1="230" y1="70" x2="275" y2="16.4" stroke="var(--flag)" stroke-width="2" marker-end="url(#ejma1-col19-ff)"/>
        <text x="282" y="24" font-size="10" fill="var(--flag)">P</text>
        <path d="M258 70 A28 28 0 0 0 248 48.6" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <text x="262" y="58" font-size="10" fill="var(--faint)">α</text>
        <line x1="92" y1="46" x2="228" y2="46" stroke="var(--faint)" stroke-width="0.9"/>
        <line x1="230" y1="68" x2="230" y2="42" stroke="var(--faint)" stroke-width="0.6"/>
        <text x="160" y="42" font-size="10" text-anchor="middle" fill="var(--faint)">a</text>
        <line x1="252" y1="72" x2="252" y2="210" stroke="var(--faint)" stroke-width="0.9"/>
        <line x1="232" y1="210" x2="256" y2="210" stroke="var(--faint)" stroke-width="0.6"/>
        <text x="258" y="144" font-size="10" fill="var(--faint)">a</text>
        <text x="84" y="84" font-size="10" text-anchor="end" fill="var(--ink)">A</text>
        <text x="236" y="84" font-size="10" fill="var(--ink)">B</text>
        <text x="84" y="226" font-size="10" text-anchor="end" fill="var(--ink)">C</text>
        <text x="236" y="226" font-size="10" fill="var(--ink)">D</text>
      </svg>
      </figure>
    pide: >-
      La distancia de A al punto de aplicación de la fuerza única, sobre el
      lado AB y sobre el lado AC.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué fuerza única equivale a $P$ más el par de las $Q$?
        opciones:
          - texto: >-
              La propia $\vec{P}$, trasladada a donde su momento respecto de
              A iguale el del sistema
            correcta: true
            mensaje: |
              Eso es. El par no tiene resultante, así que la resultante del
              sistema es $\vec{P}$. El par solo cambia el momento, y eso se
              traduce en mover $\vec{P}$ de sitio.
          - texto: >-
              La suma de $\vec{P}$ y las dos $\vec{Q}$ en módulo, $60 + 80$ N
            mensaje: |
              Las dos $\vec{Q}$ son opuestas y se anulan en la resultante. Una
              fuerza única equivalente es la resultante, $\vec{P}$, y nada
              más.
          - texto: >-
              $\vec{P}$ en su sitio, en $B$, porque el par se puede ignorar
              al no tener resultante
            mensaje: |
              El par no aporta resultante, pero sí momento: $-Q a = -10$ N·m.
              Dejar $\vec{P}$ en $B$ sería perder ese momento.

      - tipo: calcular
        titulo: El momento del sistema en A
        pregunta: |
          Con el origen en $A$, ¿cuánto vale la componente $z$ del momento del
          sistema, en N·m?
        respuesta:
          tipo: numero
          valor: '1.4907'
          tolerancia: 0.005
          formato: un número con su signo, en N·m
        distractores:
          - valor: '11.49'
            mensaje: |
              Es solo el momento de $\vec{P}$. Falta el par de las $Q$, que
              tiende a girar la placa en sentido horario: $-40 \cdot 0{,}25 = -10$ N·m.
          - valor: '21.49'
            mensaje: |
              Has sumado el par con el signo cambiado. La $Q$ de arriba empuja
              hacia la derecha y la de abajo hacia la izquierda: eso gira en
              sentido horario, $-10\,\vec{k}$.
          - valor: '-0.358'
            mensaje: |
              Has tomado $P\cos\alpha$ como brazo vertical. $\vec{P}$ está en
              $B$, sobre el eje $x$: solo su componente **vertical**,
              $P\sin\alpha = 45{,}96$ N, da momento respecto de $A$.
        pista: |
          $\vec{P}$ en $B(0{,}25;\ 0)$ da $0{,}25 \cdot 60 \sin 50^{\circ}$, y
          el par, $-Q\,a$.
        desarrollo: |
          $$
          M_{A,z} = 0{,}25 \cdot 45{,}963 - 40 \cdot 0{,}25 = 11{,}491 - 10 = 1{,}491\ \text{N·m}
          $$

      - tipo: calcular
        titulo: El punto sobre AB
        pregunta: |
          Si la fuerza única $\vec{P}$ va en el lado $AB$, a una distancia $d$
          de $A$, ¿cuánto vale $d$?
        respuesta:
          tipo: magnitud
          valor: '3.243 cm'
          tolerancia: 0.005
          formato: una distancia, con su unidad
        distractores:
          - valor: '2.484 cm'
            mensaje: |
              Has dividido por el módulo de $\vec{P}$. En el lado $AB$, que es
              el eje $x$, solo da momento la componente vertical:
              $d\,P\sin\alpha = 1{,}491$.
          - valor: '3.865 cm'
            mensaje: |
              Has dividido por $P\cos\alpha$, que es lo que corresponde al
              lado $AC$. En $AB$ el brazo es horizontal y multiplica a la
              componente vertical.
        pista: |
          $(d, 0) \times \vec{P} = d\,P\sin\alpha\,\vec{k}$.
        desarrollo: |
          $$
          d = \frac{1{,}4907}{45{,}963} = 0{,}03243\ \text{m} = 3{,}243\ \text{cm}
          $$

      - tipo: calcular
        titulo: El punto sobre AC
        pregunta: |
          Y si va en el lado $AC$, a una distancia $e$ de $A$ hacia abajo,
          ¿cuánto vale $e$?
        respuesta:
          tipo: magnitud
          valor: '3.865 cm'
          tolerancia: 0.005
          formato: una distancia, con su unidad
        distractores:
          - valor: '3.243 cm'
            mensaje: |
              Es la del lado $AB$. En $AC$ el brazo es vertical, así que el
              momento lo da la componente **horizontal** de $\vec{P}$,
              $P\cos\alpha = 38{,}57$ N.
          - valor: '2.484 cm'
            mensaje: |
              Has dividido por el módulo de $\vec{P}$. Con el punto en $AC$,
              solo la componente horizontal cruza el brazo.
        pista: |
          $(0, -e) \times \vec{P} = e\,P\cos\alpha\,\vec{k}$.
        desarrollo: |
          $$
          e = \frac{1{,}4907}{38{,}567} = 0{,}03865\ \text{m} = 3{,}865\ \text{cm}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El par no tiene resultante, así que la fuerza única es
              $\vec{P} = 38{,}57\,\vec{i} + 45{,}96\,\vec{j}$ N.
          - texto: >-
              El momento del sistema en $A$ es
              $0{,}25 \cdot 45{,}96 - 40 \cdot 0{,}25 = 1{,}491$ N·m, antihorario.
          - texto: >-
              En $AB$, $d \cdot 45{,}96 = 1{,}491$ da $d = 3{,}243$ cm; en
              $AC$, $e \cdot 38{,}57 = 1{,}491$ da $e = 3{,}865$ cm.
          - texto: >-
              Las dos distancias son la misma, porque las dos rectas pasan por
              el mismo eje central.
            trampa: true
            mensaje: |
              El eje central es uno, la recta de acción de $\vec{P}$
              desplazada; lo que cambia es dónde corta a cada lado. Corta a
              $AB$ y a $AC$ en puntos distintos, y por eso $d$ y $e$ no
              coinciden.
    resolucion: |
      **La fuerza única es la resultante.** El par de las $Q$ no tiene
      resultante, así que $\vec{R} = \vec{P} = 60(\cos 50^{\circ},\ \sin 50^{\circ}) = (38{,}567;\ 45{,}963)$ N.

      **El momento en A.** Con el origen en $A$ y $a = 0{,}25$ m, $\vec{P}$ en
      $B$ da $0{,}25 \cdot 45{,}963 = 11{,}491$ N·m, y el par, con la $Q$ de
      arriba hacia la derecha y la de abajo hacia la izquierda, $-Q\,a = -10$ N·m:

      $$
      M_{A,z} = 11{,}491 - 10 = 1{,}491\ \text{N·m}
      $$

      **a. Sobre el lado AB.** En el punto $(d, 0)$ la fuerza da
      $d\,P\sin\alpha$:

      $$
      d = \frac{1{,}4907}{45{,}963} = 0{,}03243\ \text{m} = 3{,}243\ \text{cm}
      $$

      **b. Sobre el lado AC.** En el punto $(0, -e)$ da $e\,P\cos\alpha$:

      $$
      e = \frac{1{,}4907}{38{,}567} = 0{,}03865\ \text{m} = 3{,}865\ \text{cm}
      $$

      Los dos coinciden con la colección. Los dos puntos son los cortes del
      eje central —la recta de $\vec{P}$ desplazada para absorber el par—
      con cada lado.
  - id: ejma1-col110-la-columna-con-brazo-y-su-eje-central
    titulo: Una columna con un brazo, y la distancia de su base al eje central
    fuente: >-
      Ejercicio 1.10 · Tema 1, «Fundamentos de cálculo vectorial» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Calcular la resultante y el momento resultante en el punto $A$.
      Encontrar la distancia entre el punto $A$ y el eje central.

      <figure>
      <svg viewBox="0 0 330 250" role="img" width="330" height="250" aria-labelledby="ejma1-col110-t ejma1-col110-d">
        <title id="ejma1-col110-t">Columna empotrada con dos fuerzas horizontales, un brazo con una fuerza inclinada y un momento</title>
        <desc id="ejma1-col110-d">Una columna vertical empotrada en el suelo, con el punto A en la base, en la vertical de su cara izquierda. Sobre la cara izquierda empujan hacia la derecha una fuerza de 300 N a 2,1 m de altura y otra de 200 N a 1,5 m más arriba, a 3,6 m. La columna mide 4,2 m, 0,6 m más que la fuerza de 200 N. De su cara derecha sale un brazo inclinado cuyo extremo está a la altura de lo alto de la columna y a 1,8 m en horizontal de la cara izquierda. En ese extremo actúan una fuerza de 125 N hacia arriba y a la derecha, a 30 grados sobre la horizontal, y un momento de 750 N·m en sentido horario.</desc>
        <defs>
          <marker id="ejma1-col110-ff" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="ejma1-col110-fm" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
        </defs>
        <line x1="115" y1="230" x2="195" y2="230" stroke="var(--ink)" stroke-width="1.2"/>
        <path d="M121 230 L115 238 M133 230 L127 238 M145 230 L139 238 M157 230 L151 238 M169 230 L163 238 M181 230 L175 238 M193 230 L187 238" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <rect x="140" y="41" width="27" height="189" fill="var(--d4)" fill-opacity="0.2" stroke="var(--ink)" stroke-width="1.2"/>
        <path d="M167 61 L194 61 L221 41" fill="none" stroke="var(--ink)" stroke-width="6" stroke-linejoin="round"/>
        <circle cx="221" cy="41" r="2.6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1"/>
        <line x1="221" y1="41" x2="279.5" y2="7.3" stroke="var(--flag)" stroke-width="2" marker-end="url(#ejma1-col110-ff)"/>
        <text x="284" y="16" font-size="10" fill="var(--flag)">125 N</text>
        <line x1="221" y1="41" x2="300" y2="41" stroke="var(--faint)" stroke-width="0.6" stroke-dasharray="3 2"/>
        <path d="M255 41 A34 34 0 0 0 250.4 24" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <text x="260" y="36" font-size="9" fill="var(--faint)">30°</text>
        <path d="M206 35.5 A16 16 0 1 1 229 54.9" fill="none" stroke="var(--d2)" stroke-width="1.5" marker-end="url(#ejma1-col110-fm)"/>
        <text x="236" y="76" font-size="10" fill="var(--d2)">750 N·m</text>
        <line x1="90" y1="68" x2="138" y2="68" stroke="var(--flag)" stroke-width="2" marker-end="url(#ejma1-col110-ff)"/>
        <text x="86" y="72" font-size="10" text-anchor="end" fill="var(--flag)">200 N</text>
        <line x1="90" y1="135.5" x2="138" y2="135.5" stroke="var(--flag)" stroke-width="2" marker-end="url(#ejma1-col110-ff)"/>
        <text x="86" y="139.5" font-size="10" text-anchor="end" fill="var(--flag)">300 N</text>
        <line x1="112" y1="41" x2="112" y2="230" stroke="var(--faint)" stroke-width="0.9"/>
        <line x1="108" y1="41" x2="140" y2="41" stroke="var(--faint)" stroke-width="0.6"/>
        <line x1="108" y1="68" x2="116" y2="68" stroke="var(--faint)" stroke-width="0.9"/>
        <line x1="108" y1="135.5" x2="116" y2="135.5" stroke="var(--faint)" stroke-width="0.9"/>
        <text x="108" y="58" font-size="9" text-anchor="end" fill="var(--faint)">0,6 m</text>
        <text x="108" y="106" font-size="9" text-anchor="end" fill="var(--faint)">1,5 m</text>
        <text x="108" y="186" font-size="9" text-anchor="end" fill="var(--faint)">2,1 m</text>
        <line x1="140" y1="41" x2="140" y2="20" stroke="var(--faint)" stroke-width="0.6"/>
        <line x1="221" y1="37" x2="221" y2="20" stroke="var(--faint)" stroke-width="0.6"/>
        <line x1="140" y1="24" x2="221" y2="24" stroke="var(--faint)" stroke-width="0.9"/>
        <text x="180" y="19" font-size="9" text-anchor="middle" fill="var(--faint)">1,8 m</text>
        <text x="146" y="224" font-size="10" fill="var(--ink)">A</text>
      </svg>
      </figure>
    pide: >-
      La resultante, el momento en A y la distancia de A al eje central.
    pasos:
      - tipo: reconocer
        pregunta: |
          Es un sistema plano. ¿Qué sabes de su eje central antes de calcular
          nada?
        opciones:
          - texto: >-
              Que en él el momento es nulo, así que su distancia a A es el
              momento en A partido por la resultante
            correcta: true
            mensaje: |
              Eso es. Un sistema plano tiene $\tau = 0$: el momento mínimo es
              nulo y el sistema se reduce a una sola fuerza, $\vec{R}$, sobre
              el eje central. Su momento en $A$ es $R \cdot d$, así que
              $d = |M_A| / R$.
          - texto: >-
              Que pasa por A, porque es el punto donde está el empotramiento
            mensaje: |
              El eje central es donde el momento es mínimo, y en $A$ el
              momento es de casi 2500 N·m. El empotramiento es solo el punto
              elegido para tomar momentos.
          - texto: >-
              Que su distancia a A es el momento en A partido por el cuadrado
              de la resultante
            mensaje: |
              Dimensionalmente no cuadra: N·m entre N² no es una longitud.
              $\vec{R} \times \vec{M}_A / R^{2}$ es el **vector** al pie del eje
              central, y su módulo es $|M_A| / R$.

      - tipo: calcular
        titulo: La componente x de la resultante
        pregunta: |
          ¿Cuánto vale $R_x$, en newtons?
        respuesta:
          tipo: numero
          valor: '608.25'
          tolerancia: 0.05
          formato: un número, en N
        distractores:
          - valor: '625'
            mensaje: |
              Has sumado los 125 N enteros. Solo su componente horizontal,
              $125 \cos 30^{\circ} = 108{,}25$ N, va según $x$.
          - valor: '562.5'
            mensaje: |
              Has cambiado seno y coseno: el ángulo de 30° se mide desde la
              horizontal, así que la componente $x$ lleva el coseno.
        pista: |
          $200 + 300 + 125\cos 30^{\circ}$.
        desarrollo: |
          $$
          R_x = 200 + 300 + 108{,}25 = 608{,}25\ \text{N}
          \qquad
          R_y = 125 \sin 30^{\circ} = 62{,}5\ \text{N}
          $$

      - tipo: calcular
        titulo: El momento en A
        pregunta: |
          Con $A$ en el origen, el extremo del brazo en $(1{,}8;\ 4{,}2)$ m y
          el momento de 750 N·m horario, ¿cuánto vale la componente $z$ de
          $\vec{M}_A$, en N·m?
        respuesta:
          tipo: numero
          valor: '-2442.16'
          tolerancia: 0.5
          formato: un número con su signo, en N·m
        distractores:
          - valor: '-942.16'
            mensaje: |
              Has tomado el momento de 750 N·m en sentido antihorario. La
              flecha de la figura gira en sentido horario: $-750\,\vec{k}$.
          - valor: '-1692.16'
            mensaje: |
              Te has dejado el momento de 750 N·m. Es un par: se suma tal
              cual, sin brazo, en cualquier punto.
          - valor: '-2667.16'
            mensaje: |
              Signo cambiado en el término $x\,F_y$ de la fuerza de 125 N. Su
              componente vertical, a 1,8 m a la derecha de $A$, gira en sentido
              antihorario: $+1{,}8 \cdot 62{,}5$.
        pista: |
          $M_{A,z} = -3{,}6 \cdot 200 - 2{,}1 \cdot 300 + (1{,}8 \cdot 62{,}5 - 4{,}2 \cdot 108{,}25) - 750$.
        desarrollo: |
          $$
          M_{A,z} = -720 - 630 + (112{,}5 - 454{,}66) - 750 = -2442{,}16\ \text{N·m}
          $$

      - tipo: calcular
        titulo: La distancia al eje central
        pregunta: |
          ¿A qué distancia de $A$ está el eje central?
        respuesta:
          tipo: magnitud
          valor: '3.994 m'
          tolerancia: 0.01
          formato: una distancia, con su unidad
        distractores:
          - valor: '1.541 m'
            mensaje: |
              Arrastras el momento con el par antihorario, $-942{,}16$. Con el
              par horario, $d = 2442{,}16 / 611{,}46$.
          - valor: '2.767 m'
            mensaje: |
              Arrastras el momento sin el par de 750 N·m. El par no cambia la
              resultante, pero sí dónde está su recta.
          - valor: '0.00653 m'
            mensaje: |
              Has dividido por $R^{2}$. La distancia es $|M_A| / R$: el
              momento de una fuerza es la fuerza por el brazo, una sola vez.
        pista: |
          $R = \sqrt{608{,}25^{2} + 62{,}5^{2}} = 611{,}46$ N.
        desarrollo: |
          $$
          d = \frac{2442{,}16}{611{,}46} = 3{,}994\ \text{m}
          $$

          La colección lo redondea a 4 m.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $\vec{R} = 608{,}25\,\vec{i} + 62{,}5\,\vec{j}$ N, de módulo
              $611{,}46$ N.
          - texto: >-
              $\vec{M}_A = -2442{,}16\,\vec{k}$ N·m, con el par de 750 N·m
              horario sumado tal cual.
          - texto: >-
              El sistema es plano, así que $\tau = 0$ y en el eje central el
              momento es nulo.
          - texto: >-
              Por eso $d = |M_A| / R = 3{,}994$ m, unos 4 m.
          - texto: >-
              Como la resultante es casi horizontal, la distancia al eje
              central es $|M_A| / R_x$, y el resultado es exacto.
            trampa: true
            mensaje: |
              El brazo del momento de $\vec{R}$ se mide con el módulo entero
              de la resultante, no con una componente. $|M_A| / R_x = 4{,}015$
              m se parece por casualidad —$\vec{R}$ es casi horizontal—, pero
              no es la distancia.
    resolucion: |
      **La resultante.** Las dos horizontales y las componentes de la
      inclinada:

      $$
      \vec{R} = (200 + 300 + 125\cos 30^{\circ})\,\vec{i} + 125\sin 30^{\circ}\,\vec{j} = 608{,}25\,\vec{i} + 62{,}5\,\vec{j}\ \text{N}
      $$

      **El momento en A.** Con $A$ en el origen: las fuerzas de 200 y 300 N
      están a 3,6 y 2,1 m de altura y giran en sentido horario; la de 125 N
      está en $(1{,}8;\ 4{,}2)$ m; y el par es horario.

      $$
      M_{A,z} = -3{,}6 \cdot 200 - 2{,}1 \cdot 300 + 1{,}8 \cdot 62{,}5 - 4{,}2 \cdot 108{,}25 - 750 = -2442{,}16\ \text{N·m}
      $$

      **El eje central.** El sistema es plano, $\tau = 0$, y se reduce a
      $\vec{R}$ sobre el eje central, donde el momento se anula. La
      distancia de $A$ es

      $$
      d = \frac{|M_A|}{R} = \frac{2442{,}16}{611{,}46} = 3{,}994\ \text{m}
      $$

      Por el otro camino, el pie del eje central desde $A$ es
      $\vec{R} \times \vec{M}_A / R^{2}$, y su módulo da los mismos
      3,994 m. La colección publica $\vec{R}$ y $\vec{M}_A$ iguales y
      $d = 4$ m, redondeado.

      La posición del extremo del brazo se lee de la figura: a 1,8 m en
      horizontal de la cara de la columna, que pasa por $A$, y a la altura de
      lo alto de la columna, $2{,}1 + 1{,}5 + 0{,}6 = 4{,}2$ m. Con ella sale
      el momento publicado.

  - id: ejma1-col111-el-punto-del-eje-y-de-momento-nulo
    titulo: El punto del eje y donde el momento se anula
    fuente: >-
      Ejercicio 1.11 · Tema 1, «Fundamentos de cálculo vectorial» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Dado el sistema de vectores deslizantes, $\overrightarrow{AB}$,
      $\overrightarrow{BC}$ y $\overrightarrow{CD}$, encontrar el punto
      $P(0, y, 0)$ situado sobre el eje $y$ de forma que el momento
      resultante respecto de $P$ sea nulo.

      Datos: $A(0, 1, 0)$; $B(0, 3, 2)$; $C(0, 5, 2)$; $D(0, 3, -2)$.
    pide: La coordenada y del punto P.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se escribe el momento de $\overrightarrow{AB}$ respecto de
          $P$?
        opciones:
          - texto: >-
              $\overrightarrow{PA} \times \overrightarrow{AB}$, con el vector
              de posición de P a un punto de la recta del vector
            correcta: true
            mensaje: |
              Eso es. $\overrightarrow{AB}$ hace de fuerza, aplicada en su
              recta, y $\overrightarrow{PA}$ es la posición, de $P$ a un punto
              de esa recta. Es la fórmula que da la propia nota de la
              colección.
          - texto: >-
              $\overrightarrow{PA} \times \overrightarrow{PB}$, con los dos
              extremos del vector
            mensaje: |
              Eso mezcla dos posiciones. El segundo factor es el vector del
              sistema, $\overrightarrow{AB} = B - A$, que hace de fuerza; no
              la posición de su extremo.
          - texto: >-
              $\overrightarrow{OA} \times \overrightarrow{AB}$, y luego se
              impone que sea nulo
            mensaje: |
              Ese es el momento respecto del origen, y en el origen no se
              anula: da $-18\,\vec{i}$. Hay que llevarlo a $P$, y ahí es donde
              aparece la $y$.

      - tipo: calcular
        titulo: El momento en el origen
        pregunta: |
          Con $\overrightarrow{AB} = (0, 2, 2)$, $\overrightarrow{BC} = (0, 2, 0)$
          y $\overrightarrow{CD} = (0, -2, -4)$, ¿cuánto vale la componente
          $x$ de $\vec{M}_O$?
        respuesta:
          tipo: numero
          valor: '-18'
          tolerancia: 0.01
          formato: un número con su signo
        distractores:
          - valor: '18'
            mensaje: |
              Signo cambiado: has puesto el vector del sistema delante,
              $\overrightarrow{AB} \times \overrightarrow{OA}$. La posición va
              primero.
          - valor: '-14'
            mensaje: |
              Te has dejado $\overrightarrow{BC}$. Aunque sea horizontal, está
              a 2 de altura y da $(0, 3, 2) \times (0, 2, 0) = -4\,\vec{i}$.
        pista: |
          La componente $x$ de $\overrightarrow{OA_i} \times \vec{v}_i$ es
          $y_i\,v_z - z_i\,v_y$.
        desarrollo: |
          $$
          M_{O,x} = (1 \cdot 2 - 0) + (3 \cdot 0 - 2 \cdot 2) + (5 \cdot (-4) - 2 \cdot (-2)) = 2 - 4 - 16 = -18
          $$

      - tipo: calcular
        titulo: La posición de P
        pregunta: |
          La resultante es $\vec{R} = (0, 2, -2)$. Con
          $\vec{M}_P = \vec{M}_O + \overrightarrow{PO} \times \vec{R}$, ¿para
          qué $y$ se anula el momento?
        respuesta:
          tipo: numero
          valor: '9'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '-9'
            mensaje: |
              Has usado $\overrightarrow{OP}$ en el campo en vez de
              $\overrightarrow{PO}$. El vector va del punto nuevo, $P$, al
              viejo, $O$: $\overrightarrow{PO} = (0, -y, 0)$.
          - valor: '7'
            mensaje: |
              Arrastras el momento sin $\overrightarrow{BC}$, $-14$. Con los
              tres vectores, $M_{O,x} = -18$.
        pista: |
          $(0, -y, 0) \times (0, 2, -2) = (2y, 0, 0)$.
        desarrollo: |
          $$
          -18 + 2y = 0 \quad\Longrightarrow\quad y = 9
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Los vectores del sistema son $\overrightarrow{AB} = (0, 2, 2)$,
              $\overrightarrow{BC} = (0, 2, 0)$ y
              $\overrightarrow{CD} = (0, -2, -4)$, con resultante
              $\vec{R} = (0, 2, -2)$.
          - texto: >-
              Su momento en el origen es $\vec{M}_O = -18\,\vec{i}$.
          - texto: >-
              En $P(0, y, 0)$, $\vec{M}_P = \vec{M}_O + \overrightarrow{PO} \times \vec{R} = (2y - 18)\,\vec{i}$,
              que se anula para $y = 9$.
          - texto: >-
              Como $\vec{M}_O \cdot \vec{R} = 0$ y $\vec{R} \neq \vec{0}$, el
              sistema se reduce a una fuerza, y P es un punto de su eje
              central.
          - texto: >-
              El momento se anula en $P$ y en ningún otro punto del espacio,
              porque el campo de momentos solo tiene un cero.
            trampa: true
            mensaje: |
              Se anula en toda una recta: el eje central, que pasa por
              $P(0, 9, 0)$ con la dirección de $\vec{R}$. El enunciado busca
              solo el punto donde esa recta corta al eje $y$.
    resolucion: |
      **El sistema.** Los vectores son $\overrightarrow{AB} = (0, 2, 2)$,
      aplicado en $A$; $\overrightarrow{BC} = (0, 2, 0)$, en $B$; y
      $\overrightarrow{CD} = (0, -2, -4)$, en $C$. La resultante es
      $\vec{R} = (0, 2, -2)$.

      **El momento en el origen.**

      $$
      \vec{M}_O = \overrightarrow{OA} \times \overrightarrow{AB} + \overrightarrow{OB} \times \overrightarrow{BC} + \overrightarrow{OC} \times \overrightarrow{CD} = (2 - 4 - 16)\,\vec{i} = -18\,\vec{i}
      $$

      **El punto.** Con el campo de momentos, del punto nuevo al viejo:

      $$
      \vec{M}_P = -18\,\vec{i} + (0, -y, 0) \times (0, 2, -2) = (2y - 18)\,\vec{i} = \vec{0}
      \quad\Longrightarrow\quad y = 9
      $$

      Coincide con la colección, $P(0, 9, 0)$. Calculado directamente,
      $\overrightarrow{PA} \times \overrightarrow{AB} + \overrightarrow{PB} \times \overrightarrow{BC} + \overrightarrow{PC} \times \overrightarrow{CD}$
      en $P(0, 9, 0)$ da el vector nulo.

      **Por qué existe.** $\vec{M}_O \cdot \vec{R} = 0$: el invariante es
      nulo y el sistema —plano, en $x = 0$— se reduce a una fuerza sobre el
      eje central. $P$ es donde ese eje corta al eje $y$.

  - id: ejma1-col112-el-momento-a-sesenta-grados
    titulo: El momento que forma sesenta grados con la resultante
    fuente: >-
      Ejercicio 1.12 · Tema 1, «Fundamentos de cálculo vectorial» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      En un sistema de vectores deslizantes, se conocen los módulos del
      vector resultante y del momento resultante en un punto del eje central,
      siendo respectivamente $R = \sqrt{2}$ y $M = \sqrt{3}$. Calcular:

      **a.** Invariante escalar.

      **b.** El momento resultante respecto a otro punto denominado $O'$ si
      forma un ángulo de $60^{\circ}$ respecto a la resultante, y calcular el
      módulo de dicho momento resultante.
    pide: >-
      El invariante escalar y el momento en O', en particular su módulo.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué tiene de especial el momento en un punto del eje central?
        opciones:
          - texto: >-
              Es el momento mínimo, y es paralelo a la resultante
            correcta: true
            mensaje: |
              Eso es. En el eje central el momento no tiene parte
              perpendicular a $\vec{R}$: es $\vec{M}_{\min}$, y el producto
              escalar por $\vec{R}$ es el producto de los módulos.
          - texto: >-
              Es nulo, porque en el eje central el sistema se reduce a la
              resultante
            mensaje: |
              Solo si $\tau = 0$. Aquí el momento en el eje central mide
              $\sqrt{3}$: el sistema se reduce a la resultante **más** ese
              momento mínimo.
          - texto: >-
              Es perpendicular a la resultante
            mensaje: |
              Es al revés. La parte perpendicular a $\vec{R}$ es la que crece
              al alejarte del eje, y en el eje vale cero.

      - tipo: calcular
        titulo: El invariante escalar
        pregunta: |
          ¿Cuánto vale $\tau$?
        respuesta:
          tipo: numero
          valor: '2.4495'
          tolerancia: 0.005
          formato: en forma exacta (√6) o con cuatro decimales
        distractores:
          - valor: '1.2247'
            mensaje: |
              Es $M / R = \sqrt{3}/\sqrt{2}$. El invariante es el producto
              escalar $\vec{M} \cdot \vec{R}$, y como aquí son paralelos, el
              producto de los módulos.
          - valor: '0.8165'
            mensaje: |
              Has dividido $R$ entre $M$. El invariante es un producto:
              $\sqrt{2} \cdot \sqrt{3}$.
        pista: |
          $\tau = \vec{M}_{\min} \cdot \vec{R} = M\,R\cos 0^{\circ}$.
        desarrollo: |
          $$
          \tau = \sqrt{3}\,\sqrt{2} = \sqrt{6} = 2{,}449
          $$

      - tipo: calcular
        titulo: El módulo del momento en O'
        pregunta: |
          En $O'$ el momento forma $60^{\circ}$ con $\vec{R}$. ¿Cuánto mide?
        respuesta:
          tipo: numero
          valor: '3.4641'
          tolerancia: 0.005
          formato: en forma exacta (2√3) o con cuatro decimales
        distractores:
          - valor: '0.866'
            mensaje: |
              Has proyectado al revés: $\sqrt{3}\cos 60^{\circ}$. Lo que vale
              $\sqrt{3}$ es la **proyección** de $\vec{M}_{O'}$ sobre $\vec{R}$,
              así que $M_{O'}\cos 60^{\circ} = \sqrt{3}$.
          - valor: '2'
            mensaje: |
              Has usado el seno: $\sqrt{3}/\sin 60^{\circ}$. El ángulo es con
              la resultante, y la proyección sobre ella lleva el coseno.
          - valor: '4.899'
            mensaje: |
              Has partido de $\tau$ en lugar del momento mínimo. La
              proyección del momento sobre $\vec{R}$ es $\tau / R = \sqrt{3}$,
              no $\tau$.
        pista: |
          La proyección del momento sobre la resultante es la misma en todos
          los puntos.
        desarrollo: |
          $$
          M_{O'}\cos 60^{\circ} = \sqrt{3}
          \quad\Longrightarrow\quad
          M_{O'} = 2\sqrt{3} = 3{,}464
          $$

      - tipo: calcular
        titulo: La parte perpendicular a R
        pregunta: |
          ¿Cuánto mide la componente de $\vec{M}_{O'}$ perpendicular a
          $\vec{R}$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '1.5'
            mensaje: |
              Es $\sqrt{3}\sin 60^{\circ}$, que mezcla el momento mínimo con
              el ángulo del otro. La perpendicular es
              $M_{O'}\sin 60^{\circ} = 2\sqrt{3} \cdot \tfrac{\sqrt{3}}{2}$.
          - valor: '1.732'
            mensaje: |
              Esa es la componente **paralela**, el momento mínimo. La
              perpendicular es la que cierra el triángulo:
              $\sqrt{12 - 3}$.
        pista: |
          $M_{O'}^{2} = M_{\min}^{2} + M_{\perp}^{2}$.
        desarrollo: |
          $$
          M_{\perp} = \sqrt{(2\sqrt{3})^{2} - (\sqrt{3})^{2}} = \sqrt{9} = 3
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              En el eje central el momento es el mínimo y es paralelo a
              $\vec{R}$, así que $\tau = \sqrt{3}\,\sqrt{2} = \sqrt{6}$.
          - texto: >-
              La proyección del momento sobre $\vec{R}$ vale $\sqrt{3}$ en
              todos los puntos, también en $O'$.
          - texto: >-
              En $O'$, $M_{O'}\cos 60^{\circ} = \sqrt{3}$, y
              $M_{O'} = 2\sqrt{3}$.
          - texto: >-
              Su parte perpendicular a $\vec{R}$ mide 3.
          - texto: >-
              Como el módulo en $O'$ es mayor que el mínimo, el invariante en
              $O'$ también es mayor.
            trampa: true
            mensaje: |
              El invariante no cambia de un punto a otro: por eso se llama
              así. $\vec{M}_{O'} \cdot \vec{R} = 2\sqrt{3} \cdot \sqrt{2} \cdot \cos 60^{\circ} = \sqrt{6}$,
              el mismo.
    resolucion: |
      **a. El invariante escalar.** En un punto del eje central el momento es
      el mínimo, paralelo a la resultante, así que el producto escalar es el
      producto de módulos:

      $$
      \tau = \vec{M}_{\min} \cdot \vec{R} = \sqrt{3}\,\sqrt{2} = \sqrt{6}
      $$

      **b. El momento en O'.** Lo que no cambia de un punto a otro es la
      proyección del momento sobre $\vec{R}$, $\tau / R = \sqrt{3}$. En $O'$
      el momento forma $60^{\circ}$ con $\vec{R}$, así que

      $$
      M_{O'}\cos 60^{\circ} = \sqrt{3}
      \quad\Longrightarrow\quad
      M_{O'} = 2\sqrt{3}
      $$

      Como vector, $\vec{M}_{O'}$ es la suma del momento mínimo, $\sqrt{3}$
      en la dirección de $\vec{R}$, y de una parte perpendicular de módulo
      $\sqrt{12 - 3} = 3$. Esa parte es $R$ por la distancia de $O'$ al eje
      central, así que $O'$ está a $3/\sqrt{2} = 2{,}12$ de él.

      Coincide con la colección: $\tau = \sqrt{6}$ y $M_{O'} = 2\sqrt{3}$.

  - id: ejma1-col113-dos-vectores-sobre-el-eje-x
    titulo: Dos vectores sobre el eje x con el eje central en el eje y
    fuente: >-
      Ejercicio 1.13 · Tema 1, «Fundamentos de cálculo vectorial» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección lo marca como de nivel
      de examen. La colección publica el resultado, contra el que está
      contrastado el desarrollo.
    nivel: practica
    enunciado: |
      El eje $y$ es el eje central de un sistema de vectores. En el dibujo,
      aparecen representados el momento mínimo de módulo $M$ y la resultante
      de módulo $R$. El sistema de vectores formado por los vectores
      $\vec{v}_A$ y $\vec{v}_B$ está aplicado en los puntos $A$ y $B$
      situados sobre el eje $x$, estando ambos vectores situados en planos
      perpendiculares a dicho eje $x$. Calcular las componentes de estos
      vectores respecto el sistema de referencia $Oxyz$ de la figura.

      Datos: $R = 150\ \text{N}$, $M = 20\ \text{N}\cdot\text{m}$,
      $a = 125\ \text{mm}$, $b = 50\ \text{mm}$.

      <figure>
      <svg viewBox="0 0 320 210" role="img" width="320" height="210" aria-labelledby="ejma1-col113-t ejma1-col113-d">
        <title id="ejma1-col113-t">El eje y como eje central, con la resultante y el momento mínimo, y dos puntos A y B sobre el eje x</title>
        <desc id="ejma1-col113-d">Perspectiva de los ejes x, y, z con el origen O. Sobre el eje y, que es el eje central, están dibujadas la resultante R, una flecha hacia arriba desde O, y más arriba el momento mínimo M, como una flecha curva que gira alrededor del eje y según la regla de la mano derecha. Sobre el eje x están los puntos A, a una distancia a de O, y B, a una distancia b más allá de A.</desc>
        <defs>
          <marker id="ejma1-col113-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
          <marker id="ejma1-col113-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d1)"/>
          </marker>
          <marker id="ejma1-col113-fm" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
        </defs>
        <line x1="70" y1="150" x2="300" y2="150" stroke="var(--ink)" stroke-width="1.3" marker-end="url(#ejma1-col113-fe)"/>
        <line x1="70" y1="150" x2="70" y2="20" stroke="var(--ink)" stroke-width="1.3" marker-end="url(#ejma1-col113-fe)"/>
        <line x1="70" y1="150" x2="27.2" y2="192.8" stroke="var(--ink)" stroke-width="1.3" marker-end="url(#ejma1-col113-fe)"/>
        <text x="302" y="166" font-size="10" fill="var(--ink)">x</text>
        <text x="76" y="22" font-size="10" fill="var(--ink)">y</text>
        <text x="16" y="204" font-size="10" fill="var(--ink)">z</text>
        <text x="62" y="146" font-size="10" text-anchor="end" fill="var(--ink)">O</text>
        <line x1="70" y1="150" x2="70" y2="106" stroke="var(--d1)" stroke-width="3" marker-end="url(#ejma1-col113-fr)"/>
        <text x="79" y="132" font-size="10" fill="var(--d1)">R</text>
        <path d="M56.2 54 A14 6 0 1 0 82.1 52" fill="none" stroke="var(--d2)" stroke-width="1.5" marker-end="url(#ejma1-col113-fm)"/>
        <text x="90" y="48" font-size="10" fill="var(--d2)">M</text>
        <circle cx="195" cy="150" r="2.6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1"/>
        <circle cx="245" cy="150" r="2.6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1"/>
        <text x="195" y="142" font-size="10" text-anchor="middle" fill="var(--ink)">A</text>
        <text x="245" y="142" font-size="10" text-anchor="middle" fill="var(--ink)">B</text>
        <line x1="195" y1="150" x2="163.9" y2="181.1" stroke="var(--faint)" stroke-width="0.6"/>
        <line x1="245" y1="150" x2="213.9" y2="181.1" stroke="var(--faint)" stroke-width="0.6"/>
        <line x1="38.9" y1="181.1" x2="213.9" y2="181.1" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="101" y="196" font-size="10" text-anchor="middle" fill="var(--faint)">a</text>
        <text x="189" y="196" font-size="10" text-anchor="middle" fill="var(--faint)">b</text>
      </svg>
      </figure>
    pide: Las componentes de los vectores aplicados en A y en B.
    pasos:
      - tipo: reconocer
        pregunta: |
          El origen $O$ está en el eje central. ¿Qué dos ecuaciones
          vectoriales tiene que cumplir el sistema?
        opciones:
          - texto: >-
              $\vec{v}_A + \vec{v}_B = R\,\vec{j}$ y
              $\overrightarrow{OA} \times \vec{v}_A + \overrightarrow{OB} \times \vec{v}_B = M\,\vec{j}$
            correcta: true
            mensaje: |
              Eso es. En un punto del eje central el momento es el mínimo, que
              es paralelo a la resultante. Como $O$ está en el eje, el momento
              en $O$ es $M\,\vec{j}$, y la resultante, $R\,\vec{j}$.
          - texto: >-
              La misma resultante, y momento nulo en $O$ porque está en el eje
              central
            mensaje: |
              En el eje central el momento es **mínimo**, no nulo. Solo sería
              nulo con $\tau = 0$, y aquí el dibujo da un momento mínimo de
              20 N·m.
          - texto: >-
              La misma resultante, y un momento en $O$ perpendicular a
              $\vec{R}$
            mensaje: |
              Es al revés: en el eje central el momento es paralelo a
              $\vec{R}$. La parte perpendicular es la que aparece al salir del
              eje.

      - tipo: calcular
        titulo: La componente y del vector en A
        pregunta: |
          Con $\vec{v}_A = (0, y_A, z_A)$ en $(a, 0, 0)$ y
          $\vec{v}_B = (0, y_B, z_B)$ en $(a + b, 0, 0)$, ¿cuánto vale $y_A$,
          en newtons?
        respuesta:
          tipo: numero
          valor: '525'
          tolerancia: 0.5
          formato: un número con su signo, en N
        distractores:
          - valor: '-100'
            mensaje: |
              Has colocado $B$ a una distancia $b$ del origen. En la figura
              $b$ se mide desde $A$: $B$ está en $x = a + b = 175$ mm.
          - valor: '-375'
            mensaje: |
              Has cambiado $A$ y $B$ de sitio. $A$ es el más cercano al
              origen, en $x = a$.
        pista: |
          La componente $z$ del momento en $O$ tiene que ser nula:
          $a\,y_A + (a + b)\,y_B = 0$, con $y_A + y_B = 150$.
        desarrollo: |
          $$
          a\,y_A + (a + b)(150 - y_A) = 0
          \quad\Longrightarrow\quad
          y_A = \frac{150\,(a + b)}{b} = \frac{150 \cdot 175}{50} = 525\ \text{N}
          $$

      - tipo: calcular
        titulo: La componente y del vector en B
        pregunta: |
          ¿Y $y_B$?
        respuesta:
          tipo: numero
          valor: '-375'
          tolerancia: 0.5
          formato: un número con su signo, en N
        distractores:
          - valor: '250'
            mensaje: |
              Arrastras $B$ en $x = b$. Con $B$ en $x = a + b$ sale
              $y_B = 150 - 525$.
          - valor: '525'
            mensaje: |
              Es la de $A$. Las dos suman 150, así que
              $y_B = 150 - 525 = -375$.
        pista: |
          $y_B = R - y_A$.
        desarrollo: |
          $$
          y_B = 150 - 525 = -375\ \text{N}
          $$

      - tipo: calcular
        titulo: La componente z del vector en A
        pregunta: |
          La componente $y$ del momento en $O$ tiene que valer $M = 20$ N·m.
          ¿Cuánto vale $z_A$, en newtons?
        respuesta:
          tipo: numero
          valor: '400'
          tolerancia: 0.5
          formato: un número con su signo, en N
        distractores:
          - valor: '0.4'
            mensaje: |
              Has dejado $a$ y $b$ en milímetros con $M$ en N·m. Pasa las
              distancias a metros: $b = 0{,}05$ m.
          - valor: '-400'
            mensaje: |
              Signo cambiado. $(x, 0, 0) \times (0, y, z) = (0, -x z, x y)$: la
              componente $y$ lleva un menos, así que $-a z_A - (a + b) z_B = 20$
              y, con $z_B = -z_A$, $b\,z_A = 20$.
          - valor: '-266.67'
            mensaje: |
              Arrastras $B$ en $x = b$: salen $z_A (b - a) = 20$. $B$ está en
              $x = a + b$.
        pista: |
          $z_A + z_B = 0$ y $-a\,z_A - (a + b)\,z_B = 20$.
        desarrollo: |
          $$
          -a\,z_A + (a + b)\,z_A = b\,z_A = 20
          \quad\Longrightarrow\quad
          z_A = \frac{20}{0{,}05} = 400\ \text{N}
          $$

      - tipo: calcular
        titulo: La componente z del vector en B
        pregunta: |
          ¿Y $z_B$?
        respuesta:
          tipo: numero
          valor: '-400'
          tolerancia: 0.5
          formato: un número con su signo, en N
        distractores:
          - valor: '400'
            mensaje: |
              La resultante no tiene componente $z$, así que las dos se
              anulan: $z_B = -z_A$.
          - valor: '-0.4'
            mensaje: |
              Arrastras las distancias en milímetros. Con $b = 0{,}05$ m,
              $z_A = 400$ y $z_B = -400$.
        pista: |
          $z_A + z_B = R_z = 0$.
        desarrollo: |
          $$
          z_B = -z_A = -400\ \text{N}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $O$ está en el eje central, así que
              $\vec{v}_A + \vec{v}_B = 150\,\vec{j}$ N y el momento en $O$ es
              $20\,\vec{j}$ N·m.
          - texto: >-
              Con $\overrightarrow{OA} = a\,\vec{i}$ y
              $\overrightarrow{OB} = (a + b)\,\vec{i}$, el momento en $O$ es
              $(0,\ -a z_A - (a + b) z_B,\ a y_A + (a + b) y_B)$.
          - texto: >-
              De $z$: $a\,y_A + (a + b)\,y_B = 0$, que con $y_A + y_B = 150$
              da $y_A = 525$ e $y_B = -375$ N.
          - texto: >-
              De $y$: $b\,z_A = 20$ con $z_B = -z_A$, que da $z_A = 400$ y
              $z_B = -400$ N.
          - texto: >-
              La componente $x$ del momento da una tercera ecuación, que es la
              que fija $z_A$.
            trampa: true
            mensaje: |
              Los dos puntos están sobre el eje $x$, y un vector de posición
              según $\vec{i}$ no produce momento según $\vec{i}$: la
              componente $x$ es $0 = 0$ y no dice nada. $z_A$ sale de la
              componente $y$.
    resolucion: |
      **Lo que dice el eje central.** $O$ está en el eje central, que es el
      eje $y$, así que el momento en $O$ es el momento mínimo, paralelo a la
      resultante. Con los sentidos del dibujo:
      $\vec{R} = 150\,\vec{j}$ N y $\vec{M}_O = 20\,\vec{j}$ N·m.

      **Las incógnitas.** Los vectores están en planos perpendiculares al eje
      $x$: $\vec{v}_A = (0, y_A, z_A)$ en $(a, 0, 0)$ y
      $\vec{v}_B = (0, y_B, z_B)$ en $(a + b, 0, 0)$, con $a = 0{,}125$ m y
      $a + b = 0{,}175$ m.

      **Las ecuaciones.** La resultante da $y_A + y_B = 150$ y
      $z_A + z_B = 0$. El momento en $O$:

      $$
      \overrightarrow{OA} \times \vec{v}_A + \overrightarrow{OB} \times \vec{v}_B = \left(0,\ -a z_A - (a + b) z_B,\ a y_A + (a + b) y_B\right) = (0,\ 20,\ 0)
      $$

      **La solución.**

      $$
      y_A = \frac{150\,(a + b)}{b} = 525
      \quad
      y_B = -375
      \quad
      z_A = \frac{M}{b} = 400
      \quad
      z_B = -400
      $$

      Es decir, $\vec{v}_A = 525\,\vec{j} + 400\,\vec{k}$ N y
      $\vec{v}_B = -375\,\vec{j} - 400\,\vec{k}$ N, como en la colección.
      Sustituidos, dan exactamente $\vec{R} = 150\,\vec{j}$ y
      $\vec{M}_O = 20\,\vec{j}$.
  - id: ejma1-col114-dos-sistemas-que-se-suman
    titulo: Dos sistemas de vectores que se suman en uno
    fuente: >-
      Ejercicio 1.14 · Tema 1, «Fundamentos de cálculo vectorial» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo; sus dos últimas cifras
      salen de redondear a medio camino, como se explica en la resolución.
    nivel: practica
    enunciado: |
      Se tienen dos sistemas de vectores deslizantes en el mismo espacio. El
      eje central del primer sistema $S_1$ pasa por el origen $O(0,0,0)$, su
      resultante es $\vec{R}_1 = 3{,}4\vec{j} + 9{,}4\vec{k}\ [\text{N}]$ y
      su invariante escalar es $\tau_1 = 80\ \text{N}^{2}\text{m}$. La
      resultante del segundo sistema $S_2$, en cambio, es
      $\vec{R}_2 = 2\vec{j}$ y su momento resultante en el punto $A(3,0,4)$
      es $\vec{M}_A = 5\vec{j}$.

      Si con la unión de todos los vectores que forman los dos sistemas se
      forma un sistema completo $S$, calcular:

      **a.** Resultante del sistema completo.

      **b.** Momento resultante del sistema completo respecto al origen $O$.

      **c.** Invariante escalar del sistema completo.
    pide: >-
      La resultante del sistema unión, su momento en el origen y su
      invariante escalar.
    pasos:
      - tipo: reconocer
        pregunta: |
          Al juntar dos sistemas, ¿qué se puede sumar directamente?
        opciones:
          - texto: >-
              Las resultantes, y los momentos siempre que estén tomados en el
              mismo punto
            correcta: true
            mensaje: |
              Eso es. La resultante y el momento en un punto son sumas sobre
              todos los vectores, así que se suman sistema a sistema, pero
              solo con los dos momentos en el **mismo** punto. Por eso hay que
              llevar $\vec{M}_A$ de $S_2$ hasta $O$ antes de sumar.
          - texto: >-
              Los invariantes escalares, $\tau = \tau_1 + \tau_2$
            mensaje: |
              $\tau$ es un producto, $\vec{M} \cdot \vec{R}$, y un producto de
              sumas tiene términos cruzados: $\vec{M}_1 \cdot \vec{R}_2$ y
              $\vec{M}_2 \cdot \vec{R}_1$. Aquí $\tau_1 + \tau_2 = 90$ se queda
              muy lejos.
          - texto: >-
              Los momentos que da el enunciado, el mínimo de $S_1$ y
              $\vec{M}_A$ de $S_2$, tal cual
            mensaje: |
              Están tomados en puntos distintos, $O$ y $A$. Sumar momentos de
              puntos distintos no da el momento de nada.

      - tipo: calcular
        titulo: El momento del primer sistema en O
        pregunta: |
          El eje central de $S_1$ pasa por $O$, así que ahí su momento es el
          mínimo, $\dfrac{\tau_1}{R_1^{2}}\,\vec{R}_1$. ¿Cuánto vale su
          componente $z$, en N·m?
        respuesta:
          tipo: numero
          valor: '7.526'
          tolerancia: 0.01
          formato: un número, en N·m
        distractores:
          - valor: '75.23'
            mensaje: |
              Has multiplicado $\tau_1 / R_1$ por la componente de $\vec{R}_1$.
              Eso es el módulo del mínimo por un vector que no es unitario:
              falta dividir otra vez por $R_1$.
          - valor: '0'
            mensaje: |
              En el eje central el momento es mínimo, no nulo. Con
              $\tau_1 = 80 \neq 0$, el momento en $O$ vale $\tau_1 / R_1$ en
              la dirección de $\vec{R}_1$.
        pista: |
          $R_1^{2} = 3{,}4^{2} + 9{,}4^{2} = 99{,}92$.
        desarrollo: |
          $$
          \vec{M}_{O,1} = \frac{80}{99{,}92}\,(0,\ 3{,}4,\ 9{,}4) = (0;\ 2{,}722;\ 7{,}526)\ \text{N·m}
          $$

      - tipo: calcular
        titulo: El momento del segundo sistema en O
        pregunta: |
          Con $\vec{M}_{O,2} = \vec{M}_A + \overrightarrow{OA} \times \vec{R}_2$,
          ¿cuánto vale su componente $x$?
        respuesta:
          tipo: numero
          valor: '-8'
          tolerancia: 0.01
          formato: un número con su signo, en N·m
        distractores:
          - valor: '8'
            mensaje: |
              Has usado $\overrightarrow{AO}$ en el campo. Para llevar el
              momento de $A$ a $O$, el vector va de $O$, el punto nuevo, a
              $A$, el viejo: $\overrightarrow{OA} = (3, 0, 4)$.
        pista: |
          $(3, 0, 4) \times (0, 2, 0) = (-8, 0, 6)$.
        desarrollo: |
          $$
          \vec{M}_{O,2} = 5\,\vec{j} + (-8\,\vec{i} + 6\,\vec{k}) = -8\,\vec{i} + 5\,\vec{j} + 6\,\vec{k}\ \text{N·m}
          $$

      - tipo: calcular
        titulo: El momento total en O
        pregunta: |
          ¿Cuánto vale la componente $z$ del momento del sistema completo en
          $O$?
        respuesta:
          tipo: numero
          valor: '13.526'
          tolerancia: 0.01
          formato: un número, en N·m
        distractores:
          - valor: '1.526'
            mensaje: |
              Arrastras el signo de $\overrightarrow{AO}$: con él,
              $\vec{M}_{O,2}$ tiene $-6\,\vec{k}$ en vez de $+6\,\vec{k}$.
          - valor: '7.526'
            mensaje: |
              Es solo la de $S_1$. Falta sumar la de $S_2$ llevada a $O$, que
              es 6.
        pista: |
          $7{,}526 + 6$.
        desarrollo: |
          $$
          \vec{M}_O = -8\,\vec{i} + 7{,}722\,\vec{j} + 13{,}526\,\vec{k}\ \text{N·m}
          $$

      - tipo: calcular
        titulo: El invariante escalar del sistema completo
        pregunta: |
          Con $\vec{R} = 5{,}4\,\vec{j} + 9{,}4\,\vec{k}$, ¿cuánto vale
          $\tau = \vec{M}_O \cdot \vec{R}$, en N²·m?
        respuesta:
          tipo: numero
          valor: '168.84'
          tolerancia: 0.1
          formato: un número
        distractores:
          - valor: '90'
            mensaje: |
              Es $\tau_1 + \tau_2$. Faltan los términos cruzados,
              $\vec{M}_{O,1} \cdot \vec{R}_2 + \vec{M}_{O,2} \cdot \vec{R}_1 = 5{,}44 + 73{,}4$.
          - valor: '56.04'
            mensaje: |
              Arrastras $\vec{M}_{O,2}$ con el signo de $\overrightarrow{AO}$,
              y con él una componente $z$ de $1{,}526$ en vez de $13{,}526$.
        pista: |
          $7{,}722 \cdot 5{,}4 + 13{,}526 \cdot 9{,}4$.
        desarrollo: |
          $$
          \tau = 41{,}70 + 127{,}14 = 168{,}84\ \text{N}^{2}\text{m}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $\vec{R} = \vec{R}_1 + \vec{R}_2 = 5{,}4\,\vec{j} + 9{,}4\,\vec{k}$ N.
          - texto: >-
              $S_1$ tiene su eje central en $O$, así que su momento ahí es
              $\tfrac{80}{99{,}92}\vec{R}_1 = 2{,}722\,\vec{j} + 7{,}526\,\vec{k}$ N·m.
          - texto: >-
              El de $S_2$ en $O$ es
              $5\,\vec{j} + \overrightarrow{OA} \times 2\,\vec{j} = -8\,\vec{i} + 5\,\vec{j} + 6\,\vec{k}$ N·m.
          - texto: >-
              Sumando, $\vec{M}_O = -8\,\vec{i} + 7{,}722\,\vec{j} + 13{,}526\,\vec{k}$ N·m
              y $\tau = \vec{M}_O \cdot \vec{R} = 168{,}84$ N²·m.
          - texto: >-
              Como los invariantes no dependen del punto, el del sistema
              completo es la suma de los dos, $80 + 10 = 90$.
            trampa: true
            mensaje: |
              Cada $\tau$ es invariante dentro de su sistema, pero el del
              sistema unión no es la suma: el producto
              $(\vec{M}_1 + \vec{M}_2) \cdot (\vec{R}_1 + \vec{R}_2)$ tiene dos
              términos cruzados que aquí suman 78,84.
    resolucion: |
      **a. Resultante.**
      $\vec{R} = \vec{R}_1 + \vec{R}_2 = 5{,}4\,\vec{j} + 9{,}4\,\vec{k}$ N.
      La colección lo escribe $\vec{R}_1$, que es una errata de nombre: el
      vector es la resultante del sistema completo.

      **b. Momento en O.** Los momentos se suman solo en el mismo punto. El
      eje central de $S_1$ pasa por $O$, así que ahí su momento es el mínimo:

      $$
      \vec{M}_{O,1} = \frac{\tau_1}{R_1^{2}}\,\vec{R}_1 = \frac{80}{99{,}92}\,(0,\ 3{,}4,\ 9{,}4) = 2{,}722\,\vec{j} + 7{,}526\,\vec{k}
      $$

      El de $S_2$ se lleva de $A$ a $O$ con el campo:

      $$
      \vec{M}_{O,2} = \vec{M}_A + \overrightarrow{OA} \times \vec{R}_2 = 5\,\vec{j} + (3, 0, 4) \times (0, 2, 0) = -8\,\vec{i} + 5\,\vec{j} + 6\,\vec{k}
      $$

      Y la suma: $\vec{M}_O = -8\,\vec{i} + 7{,}722\,\vec{j} + 13{,}526\,\vec{k}$ N·m.

      **c. Invariante.**

      $$
      \tau = \vec{M}_O \cdot \vec{R} = 7{,}722 \cdot 5{,}4 + 13{,}526 \cdot 9{,}4 = 168{,}84\ \text{N}^{2}\text{m}
      $$

      Por el otro camino,
      $\tau = \tau_1 + \tau_2 + \vec{M}_{O,1} \cdot \vec{R}_2 + \vec{M}_{O,2} \cdot \vec{R}_1 = 80 + 10 + 5{,}44 + 73{,}4 = 168{,}84$.

      **Contra la colección.** Publica $13{,}52$ y $168{,}78$. Las dos
      diferencias son de redondeo: $7{,}526 + 6 = 13{,}526$, que redondeado es
      $13{,}53$, y con $7{,}72$ y $13{,}52$ ya truncados el producto escalar
      da $168{,}776$. La cuenta sin redondear a medio camino da $168{,}84$;
      la casilla acepta los dos valores.

  - id: ejma1-col115-tres-momentos-y-la-resultante
    titulo: Tres momentos con incógnitas, la resultante y el eje central
    fuente: >-
      Ejercicio 1.15 · Tema 1, «Fundamentos de cálculo vectorial» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Los momentos generados en los puntos $A(0,0,0)$, $B(1,1,0)$ y
      $C(0,0,1)$ por un sistema de vectores deslizantes son respectivamente:

      $$
      \begin{aligned}
      \vec{M}_A &= \vec{i} + \vec{j} - \vec{k} \\
      \vec{M}_B &= 2\vec{i} + a\vec{j} + b\vec{k} \\
      \vec{M}_C &= -4\vec{i} + c\vec{k}
      \end{aligned}
      $$

      Calcular:

      **a.** Valores de $a$, $b$ y $c$.

      **b.** Resultante del sistema.

      **c.** Ecuaciones del eje central.
    pide: Los valores de a, b y c, la resultante y el eje central.
    pasos:
      - tipo: reconocer
        pregunta: |
          La resultante es desconocida, y $\vec{M}_A$ es el único momento
          completo. ¿Qué ecuaciones hay que plantear?
        opciones:
          - texto: >-
              El campo de momentos de A a B y de A a C, con las tres
              componentes de $\vec{R}$ como incógnitas
            correcta: true
            mensaje: |
              Eso es. $\vec{M}_B = \vec{M}_A + \overrightarrow{BA} \times \vec{R}$
              y $\vec{M}_C = \vec{M}_A + \overrightarrow{CA} \times \vec{R}$
              son seis ecuaciones escalares para seis incógnitas: $R_x$,
              $R_y$, $R_z$, $a$, $b$ y $c$.
          - texto: >-
              Solo el invariante escalar, igualando $\vec{M} \cdot \vec{R}$ en
              los tres puntos
            mensaje: |
              El invariante es una consecuencia del campo, y da una ecuación
              escalar por punto: se queda corto. Además, sin conocer $\vec{R}$
              no se puede ni escribir.
          - texto: >-
              Igualar los tres momentos, porque el momento es el mismo en
              todos los puntos
            mensaje: |
              El momento cambia de un punto a otro. Solo es igual en todos
              cuando la resultante es nula, y aquí no lo es: con él saldría
              $\vec{M}_C = \vec{M}_A$, y ya la componente $x$ lo desmiente,
              $-4 \neq 1$.

      - tipo: calcular
        titulo: La resultante
        pregunta: |
          De $\vec{M}_C = \vec{M}_A + \overrightarrow{CA} \times \vec{R}$ salen
          $R_x$ y $R_y$; de la componente $x$ de la ecuación en $B$, $R_z$.
          ¿Cuánto vale $\vec{R}$?
        respuesta:
          tipo: vector
          valor: '(1, -5, -1)'
          tolerancia: 0.001
          formato: tres componentes entre paréntesis, separadas por comas
        distractores:
          - valor: '(-1, 5, 1)'
            mensaje: |
              La resultante sale con el signo cambiado porque has usado
              $\overrightarrow{AC}$ y $\overrightarrow{AB}$ en el campo. El
              vector va del punto nuevo al viejo: $\overrightarrow{CA} = (0, 0, -1)$.
        pista: |
          $\overrightarrow{CA} \times \vec{R} = (R_y,\ -R_x,\ 0)$, así que
          $1 + R_y = -4$ y $1 - R_x = 0$.
        desarrollo: |
          $$
          R_y = -5,\quad R_x = 1;
          \qquad
          \overrightarrow{BA} \times \vec{R} = (-R_z,\ R_z,\ R_x - R_y) \Rightarrow 1 - R_z = 2,\ R_z = -1
          $$

      - tipo: calcular
        titulo: Los valores de a, b y c
        pregunta: |
          ¿Cuánto valen $a$, $b$ y $c$?
        respuesta:
          tipo: vector
          valor: '(0, 5, -1)'
          tolerancia: 0.001
          formato: tres números entre paréntesis, en el orden a, b, c
        distractores:
          - valor: '(0, -7, -1)'
            mensaje: |
              $b$ sale mal por la componente $z$ del producto vectorial:
              es $BA_x R_y - BA_y R_x = (-1)(-5) - (-1)(1) = 6$, y has restado
              en el orden contrario.
          - valor: '(1, -1, -1)'
            mensaje: |
              Has copiado las componentes de $\vec{M}_A$, como si el momento
              fuera el mismo en todos los puntos. Solo lo es la proyección
              sobre $\vec{R}$.
        pista: |
          $a = 1 + R_z$, $b = -1 + R_x - R_y$ y $c = -1 + 0$.
        desarrollo: |
          $$
          a = 1 - 1 = 0 \qquad b = -1 + 1 + 5 = 5 \qquad c = -1
          $$

      - tipo: calcular
        titulo: Un punto del eje central
        pregunta: |
          Con $A$ en el origen, un punto del eje central es
          $P_0 = \dfrac{\vec{R} \times \vec{M}_A}{R^{2}}$. ¿Cuánto vale su
          coordenada $x$?
        respuesta:
          tipo: numero
          valor: '0.2222'
          tolerancia: 0.001
          formato: un número; vale 2/9
        distractores:
          - valor: '-0.2222'
            mensaje: |
              Has hecho $\vec{M}_A \times \vec{R}$. El orden importa: es
              $\vec{R} \times \vec{M}_A$, y el otro da el punto simétrico.
          - valor: '1.1547'
            mensaje: |
              Has dividido por $R$ en vez de por $R^{2}$. $\vec{R} \times \vec{M}_A$
              tiene módulo $R$ por la distancia, así que hay que dividir dos
              veces por $R$.
        pista: |
          $\vec{R} \times \vec{M}_A = (1, -5, -1) \times (1, 1, -1) = (6, 0, 6)$
          y $R^{2} = 27$.
        desarrollo: |
          $$
          P_0 = \frac{(6,\ 0,\ 6)}{27} = \left(\tfrac{2}{9},\ 0,\ \tfrac{2}{9}\right)
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El campo de $A$ a $C$ da $R_x = 1$, $R_y = -5$ y $c = -1$; el de
              $A$ a $B$ da $R_z = -1$, $a = 0$ y $b = 5$.
          - texto: >-
              $\tau = \vec{M}_A \cdot \vec{R} = 1 - 5 + 1 = -3$, y el eje
              central pasa por $P_0 = (2/9,\ 0,\ 2/9)$.
          - texto: >-
              El eje es $P_0 + \lambda\,(1, -5, -1)$; eliminando $\lambda$,
              $x + z = 4/9$ y $5x + y = 10/9$.
          - texto: >-
              Como $\tau$ es negativo, el sistema no tiene eje central.
            trampa: true
            mensaje: |
              El eje central existe siempre que $\vec{R} \neq \vec{0}$. El
              signo de $\tau$ solo dice que el momento mínimo apunta en
              sentido contrario a $\vec{R}$.
    resolucion: |
      **Las ecuaciones.** Con $\vec{R}$ desconocida, el campo de momentos
      desde $A$, que es el único momento completo:

      $$
      \vec{M}_C = \vec{M}_A + \overrightarrow{CA} \times \vec{R} = (1 + R_y,\ 1 - R_x,\ -1)
      \qquad
      \vec{M}_B = \vec{M}_A + \overrightarrow{BA} \times \vec{R} = (1 - R_z,\ 1 + R_z,\ -1 + R_x - R_y)
      $$

      **a y b.** De $\vec{M}_C = (-4, 0, c)$: $R_y = -5$, $R_x = 1$ y
      $c = -1$. De $\vec{M}_B = (2, a, b)$: $R_z = -1$, $a = 0$ y $b = 5$. Así
      que $\vec{R} = \vec{i} - 5\vec{j} - \vec{k}$.

      **c. El eje central.** Con $\tau = \vec{M}_A \cdot \vec{R} = -3$ y
      $R^{2} = 27$, un punto del eje es

      $$
      P_0 = \frac{\vec{R} \times \vec{M}_A}{R^{2}} = \frac{(6,\ 0,\ 6)}{27} = \left(\tfrac{2}{9},\ 0,\ \tfrac{2}{9}\right)
      $$

      y el eje, $P_0 + \lambda\,(1, -5, -1)$. Eliminando $\lambda$:

      $$
      x + z = \frac{4}{9}
      \qquad
      5x + y = \frac{10}{9}
      $$

      Todo coincide con la colección. Comprobación: el campo llevado a $P_0$
      da $(-1/9,\ 5/9,\ 1/9)$, que es exactamente
      $\tfrac{\tau}{R^{2}}\vec{R}$, el momento mínimo.

  - id: ejma1-col116-el-eje-central-que-pasa-por-a
    titulo: Tres momentos y un eje central que pasa por uno de los puntos
    fuente: >-
      Ejercicio 1.16 · Tema 1, «Fundamentos de cálculo vectorial» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Dado un sistema de vectores definido por los momentos en tres puntos:

      En $A(1,1,1)$, el momento es $\vec{M}_A = \vec{i} + \vec{j} + \vec{k}$

      En $B(1,0,0)$, el momento es $\vec{M}_B = \vec{i} - \vec{j} + a\vec{k}$

      En $C(0,0,1)$, el momento es $\vec{M}_C = b\vec{i} + c\vec{j} + \vec{k}$

      Calcular:

      **a.** Valores de $a$, $b$ y $c$.

      **b.** Ecuaciones del eje central.
    pide: Los valores de a, b y c, y el eje central.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿De qué punto conviene salir en el campo de momentos?
        opciones:
          - texto: >-
              De A, porque es el único momento sin incógnitas
            correcta: true
            mensaje: |
              Eso es. $\vec{M}_B = \vec{M}_A + \overrightarrow{BA} \times \vec{R}$
              y $\vec{M}_C = \vec{M}_A + \overrightarrow{CA} \times \vec{R}$
              dejan como incógnitas $\vec{R}$ y los tres parámetros.
          - texto: >-
              De B, porque es el más cercano al origen
            mensaje: |
              La distancia al origen no importa nada. Salir de $B$ mete su
              incógnita $a$ en las dos ecuaciones y complica el sistema.
          - texto: >-
              De ninguno: sin la resultante no se puede usar el campo
            mensaje: |
              Se puede, con $\vec{R}$ como incógnita. Las ecuaciones siguen
              siendo lineales, y dan a la vez $\vec{R}$ y los parámetros.

      - tipo: calcular
        titulo: La resultante
        pregunta: |
          ¿Cuánto vale $\vec{R}$?
        respuesta:
          tipo: vector
          valor: '(-2, -2, -2)'
          tolerancia: 0.001
          formato: tres componentes entre paréntesis, separadas por comas
        distractores:
          - valor: '(2, 2, 2)'
            mensaje: |
              Signo cambiado en todo: has usado $\overrightarrow{AB}$ y
              $\overrightarrow{AC}$ en el campo. El vector va del punto nuevo
              al viejo.
        pista: |
          $\overrightarrow{BA} \times \vec{R} = (R_z - R_y,\ R_x,\ -R_x)$, y la
          componente $y$ de la ecuación en $B$ da $1 + R_x = -1$.
        desarrollo: |
          La componente $y$ de la ecuación en $B$ da $R_x = -2$; su
          componente $x$, $R_z = R_y$; y la componente $z$ de la ecuación en
          $C$, $R_y = R_x$.

          $$
          \vec{R} = (-2,\ -2,\ -2)
          $$

      - tipo: calcular
        titulo: Los valores de a, b y c
        pregunta: |
          ¿Cuánto valen $a$, $b$ y $c$?
        respuesta:
          tipo: vector
          valor: '(3, -1, 3)'
          tolerancia: 0.001
          formato: tres números entre paréntesis, en el orden a, b, c
        distractores:
          - valor: '(1, 1, 1)'
            mensaje: |
              Has copiado $\vec{M}_A$, como si el momento fuera el mismo en
              todos los puntos. Cambia de un punto a otro, y lo que cambia es
              $\overrightarrow{BA} \times \vec{R}$.
          - valor: '(-1, 3, -1)'
            mensaje: |
              Has llevado la resultante con el signo cambiado, $(2, 2, 2)$, a
              unas ecuaciones escritas con el signo bueno. O los dos al
              derecho o los dos al revés.
        pista: |
          $a = 1 - R_x$, $b = 1 + R_z$ y $c = 1 - R_z$.
        desarrollo: |
          $$
          a = 1 + 2 = 3 \qquad b = 1 - 2 = -1 \qquad c = 1 + 2 = 3
          $$

      - tipo: calcular
        titulo: El invariante escalar
        pregunta: |
          ¿Cuánto vale $\tau$?
        respuesta:
          tipo: numero
          valor: '-6'
          tolerancia: 0.01
          formato: un número con su signo
        distractores:
          - valor: '6'
            mensaje: |
              Arrastras la resultante con el signo cambiado. Con
              $\vec{R} = (-2, -2, -2)$, $\vec{M}_A \cdot \vec{R} = -6$.
          - valor: '-1.732'
            mensaje: |
              Es $\tau / R$, la proyección del momento sobre la resultante. El
              invariante es el producto escalar sin dividir.
        pista: |
          $(1, 1, 1) \cdot (-2, -2, -2)$.
        desarrollo: |
          $$
          \tau = -2 - 2 - 2 = -6
          $$

      - tipo: reconocer
        pregunta: |
          $\vec{M}_A = (1, 1, 1)$ resulta paralelo a $\vec{R} = (-2, -2, -2)$.
          ¿Qué dice eso?
        opciones:
          - texto: >-
              Que A está en el eje central: su momento es el mínimo
            correcta: true
            mensaje: |
              Eso es. El momento es paralelo a la resultante justo en los
              puntos del eje central, y allí es el mínimo:
              $\tfrac{\tau}{R^{2}}\vec{R} = -\tfrac{1}{2}(-2, -2, -2) = (1, 1, 1)$.
          - texto: >-
              Nada: que dos vectores sean paralelos es una casualidad de los
              números
            mensaje: |
              No es casualidad: fuera del eje central el momento tiene una
              parte perpendicular a $\vec{R}$, y aquí no la hay.
          - texto: >-
              Que el sistema se reduce a una única fuerza
            mensaje: |
              Para eso haría falta $\tau = 0$, y aquí $\tau = -6$. El sistema
              se reduce a la resultante más un momento mínimo de módulo
              $\sqrt{3}$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El campo desde $A$ da $\vec{R} = (-2, -2, -2)$, $a = 3$,
              $b = -1$ y $c = 3$.
          - texto: >-
              $\tau = -6$ y $\tfrac{\tau}{R^{2}}\vec{R} = (1, 1, 1) = \vec{M}_A$:
              $A$ está en el eje central.
          - texto: >-
              El eje pasa por $A(1, 1, 1)$ con la dirección de $(1, 1, 1)$, así
              que sus ecuaciones son $x = y$ y $x = z$.
          - texto: >-
              Como $\tau$ es negativo, el eje central tiene la dirección
              contraria a la de la resultante.
            trampa: true
            mensaje: |
              El eje central es una recta, y una recta no tiene sentido: es
              paralela a $\vec{R}$. Lo que apunta al revés de $\vec{R}$ es el
              momento mínimo, porque $\tau < 0$.
    resolucion: |
      **Las ecuaciones.** Desde $A$, que es el único momento completo:

      $$
      \vec{M}_B = \vec{M}_A + \overrightarrow{BA} \times \vec{R} = (1 + R_z - R_y,\ 1 + R_x,\ 1 - R_x)
      \qquad
      \vec{M}_C = \vec{M}_A + \overrightarrow{CA} \times \vec{R} = (1 + R_z,\ 1 - R_z,\ 1 + R_y - R_x)
      $$

      **a.** De $\vec{M}_B = (1, -1, a)$: $R_z = R_y$, $R_x = -2$ y
      $a = 3$. De $\vec{M}_C = (b, c, 1)$: $R_y = R_x = -2$, así que
      $R_z = -2$, $b = -1$ y $c = 3$. La resultante es
      $\vec{R} = -2\vec{i} - 2\vec{j} - 2\vec{k}$.

      Comprobación que no se ha usado: llevado de $B$ a $C$,
      $\vec{M}_B + \overrightarrow{CB} \times \vec{R} = (-1, 3, 1)$, que es
      $\vec{M}_C$ con los valores obtenidos.

      **b. El eje central.** $\tau = \vec{M}_A \cdot \vec{R} = -6$ y
      $R^{2} = 12$, así que el momento mínimo es
      $\tfrac{\tau}{R^{2}}\vec{R} = (1, 1, 1)$: exactamente $\vec{M}_A$. $A$
      está en el eje central, que es la recta por $A(1, 1, 1)$ paralela a
      $(1, 1, 1)$, y pasa también por el origen:

      $$
      x = y \qquad x = z
      $$

      Todo coincide con la colección.

  - id: ejma1-col117-tres-momentos-y-la-resultante-escondida
    titulo: Tres momentos y los tres parámetros compatibles
    fuente: >-
      Ejercicio 1.17 · Tema 1, «Fundamentos de cálculo vectorial» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Un sistema de vectores deslizantes origina en los puntos $A$, $B$ y $O$
      los siguientes momentos resultantes:

      $$
      \begin{aligned}
      &A\,(1,1,1), \quad \vec{M}_A = \varepsilon\vec{i} - 2\vec{j} + 2\vec{k} \\
      &B\,(2,1,-1), \quad \vec{M}_B = 2\vec{i} + 2\vec{j} + 2\vec{k} \\
      &O\,(0,0,0), \quad \vec{M}_O = 2\vec{i} + \lambda\vec{j} + \gamma\vec{k}
      \end{aligned}
      $$

      Calcular:

      **a.** Valores $\varepsilon - \lambda - \gamma$ compatibles con el
      sistema.

      **b.** Invariantes escalar y vectorial.
    pide: Los valores de épsilon, lambda y gamma, y los dos invariantes.
    pasos:
      - tipo: reconocer
        pregunta: |
          Ahora el momento completo es el de $B$. ¿Cuántas incógnitas hay, y
          de dónde salen las ecuaciones?
        opciones:
          - texto: >-
              Seis, $\vec{R}$ y los tres parámetros, y seis ecuaciones: el
              campo de B a A y de B a O
            correcta: true
            mensaje: |
              Eso es. Cada ecuación del campo son tres escalares, y las dos
              juntas fijan las seis incógnitas.
          - texto: >-
              Tres, los parámetros; la resultante se saca de los momentos
              dividiendo
            mensaje: |
              Un momento no se puede «dividir» por una posición: el producto
              vectorial no tiene inversa. $\vec{R}$ es incógnita y sale del
              sistema.
          - texto: >-
              Basta con el invariante: $\vec{M}_A \cdot \vec{R} = \vec{M}_B \cdot \vec{R} = \vec{M}_O \cdot \vec{R}$
            mensaje: |
              Son dos ecuaciones escalares, y encima no lineales en las
              incógnitas. El campo vectorial da seis, lineales.

      - tipo: calcular
        titulo: La resultante
        pregunta: |
          Con $\vec{M}_A = \vec{M}_B + \overrightarrow{AB} \times \vec{R}$ y
          $\vec{M}_O = \vec{M}_B + \overrightarrow{OB} \times \vec{R}$, ¿cuánto
          vale $\vec{R}$?
        respuesta:
          tipo: vector
          valor: '(2, 0, 0)'
          tolerancia: 0.001
          formato: tres componentes entre paréntesis, separadas por comas
        distractores:
          - valor: '(-2, 0, 0)'
            mensaje: |
              Signo cambiado: has usado $\overrightarrow{BA}$ y
              $\overrightarrow{BO}$. Para ir de $B$ a $A$ el vector del campo
              va de $A$, el punto nuevo, a $B$: $\overrightarrow{AB} = (1, 0, -2)$.
        pista: |
          $\overrightarrow{AB} \times \vec{R} = (2R_y,\ -2R_x - R_z,\ R_y)$ y
          $\overrightarrow{OB} \times \vec{R} = (R_z + R_y,\ -R_x - 2R_z,\ 2R_y - R_x)$.
        desarrollo: |
          $$
          2 + R_y = 2 \Rightarrow R_y = 0;
          \quad
          2 + R_z + R_y = 2 \Rightarrow R_z = 0;
          \quad
          2 - 2R_x - R_z = -2 \Rightarrow R_x = 2
          $$

      - tipo: calcular
        titulo: Los tres parámetros
        pregunta: |
          ¿Cuánto valen $\varepsilon$, $\lambda$ y $\gamma$?
        respuesta:
          tipo: vector
          valor: '(2, 0, 0)'
          tolerancia: 0.001
          formato: tres números entre paréntesis, en el orden épsilon, lambda, gamma
        distractores:
          - valor: '(2, 4, 4)'
            mensaje: |
              Has sacado bien $\vec{R}$ y luego lo has llevado a $O$ con
              $\overrightarrow{BO}$. La ecuación es
              $\vec{M}_O = \vec{M}_B + \overrightarrow{OB} \times \vec{R}$,
              con $\overrightarrow{OB} = (2, 1, -1)$.
        pista: |
          $\varepsilon = 2 + 2R_y$, $\lambda = 2 - R_x - 2R_z$ y
          $\gamma = 2 + 2R_y - R_x$.
        desarrollo: |
          $$
          \varepsilon = 2 \qquad \lambda = 2 - 2 = 0 \qquad \gamma = 2 - 2 = 0
          $$

      - tipo: calcular
        titulo: El invariante escalar
        pregunta: |
          ¿Cuánto vale $\tau$?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.01
          formato: un número con su signo
        distractores:
          - valor: '-4'
            mensaje: |
              Arrastras la resultante con el signo cambiado. Con
              $\vec{R} = 2\vec{i}$, $\vec{M}_B \cdot \vec{R} = 4$.
          - valor: '2'
            mensaje: |
              Es $\tau / R$, el módulo del momento mínimo. El invariante es el
              producto escalar entero.
        pista: |
          $(2, 2, 2) \cdot (2, 0, 0)$, y debe dar lo mismo con $\vec{M}_A$ y
          con $\vec{M}_O$.
        desarrollo: |
          $$
          \tau = \vec{M}_B \cdot \vec{R} = 4 = \vec{M}_A \cdot \vec{R} = \vec{M}_O \cdot \vec{R}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El campo de $B$ a $A$ da $R_y = 0$, $\varepsilon = 2$ y
              $2R_x + R_z = 4$.
          - texto: >-
              El de $B$ a $O$ da $R_z + R_y = 0$, así que $R_z = 0$ y
              $R_x = 2$; con ellos, $\lambda = 0$ y $\gamma = 0$.
          - texto: >-
              Invariante vectorial $\vec{R} = 2\,\vec{i}$ y escalar
              $\tau = 4$, el mismo con los tres momentos.
          - texto: >-
              Como $\vec{M}_O = 2\,\vec{i}$ es paralelo a $\vec{R}$, el origen
              está en el eje central, que es el eje $x$.
          - texto: >-
              El invariante escalar tiene que ser el mismo en los tres puntos,
              así que los tres momentos tienen el mismo módulo.
            trampa: true
            mensaje: |
              Lo que coincide es la proyección sobre $\vec{R}$, no el módulo:
              $|\vec{M}_B| = \sqrt{12}$ y $|\vec{M}_O| = 2$, y los dos dan
              $\tau = 4$.
    resolucion: |
      **Las ecuaciones.** El único momento completo es el de $B$. Con
      $\vec{R}$ como incógnita, el campo de momentos hacia $A$ y hacia $O$:

      $$
      \vec{M}_A = \vec{M}_B + \overrightarrow{AB} \times \vec{R} = (2 + 2R_y,\ 2 - 2R_x - R_z,\ 2 + R_y) = (\varepsilon,\ -2,\ 2)
      $$

      $$
      \vec{M}_O = \vec{M}_B + \overrightarrow{OB} \times \vec{R} = (2 + R_z + R_y,\ 2 - R_x - 2R_z,\ 2 + 2R_y - R_x) = (2,\ \lambda,\ \gamma)
      $$

      **a.** La tercera componente de la primera da $R_y = 0$, y con ella
      $\varepsilon = 2$. La primera de la segunda da $R_z = 0$, y la
      segunda de la primera, $R_x = 2$. Queda $\lambda = 0$ y $\gamma = 0$.

      **b.** El invariante vectorial es $\vec{R} = 2\,\vec{i}$, y el escalar

      $$
      \tau = \vec{M}_B \cdot \vec{R} = 4
      $$

      que sale igual con $\vec{M}_A = (2, -2, 2)$ y con $\vec{M}_O = (2, 0, 0)$:
      es la comprobación de que los valores son compatibles. Coincide con la
      colección. De propina, $\vec{M}_O$ es paralelo a $\vec{R}$: el eje
      central es el propio eje $x$.

  - id: ejma1-col118-dos-vectores-paralelos-ligados
    titulo: Dos vectores paralelos ligados, uno desconocido
    fuente: >-
      Ejercicio 1.18 · Tema 1, «Fundamentos de cálculo vectorial» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo. Publica una de las dos
      soluciones que admiten los datos; la segunda, y su discusión, son
      nuestras.
    nivel: practica
    enunciado: |
      Sea un sistema de dos vectores paralelos ligados, formado por:

      $\vec{v}_1$ desconocido aplicado en $A_1(x_1, y_1, z_1)$

      $\vec{v}_2 = 6\vec{i} + 3\vec{k}$, aplicado en $A_2(0,1,0)$

      Sabiendo que: 1) ambos puntos de aplicación pertenecen al plano de
      ecuación $2x + z = 0$, 2) que el módulo de la resultante es
      $\sqrt{80}$ y 3) que el sistema produce un momento en el origen de valor
      $\vec{M}_O = 3\vec{i} - 6\vec{k}$, calcular:

      **a.** Vector $\vec{v}_1$.

      **b.** Punto de aplicación $A_1$.
    pide: El vector v1 y su punto de aplicación A1.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué forma tiene $\vec{v}_1$, sabiendo que el sistema es de vectores
          paralelos?
        opciones:
          - texto: >-
              $\vec{v}_1 = k\,(2\vec{i} + \vec{k})$, un múltiplo de la
              dirección de $\vec{v}_2$, con k de cualquier signo
            correcta: true
            mensaje: |
              Eso es. Paralelo quiere decir con la misma dirección, así que
              $\vec{v}_1$ es un múltiplo de $(6, 0, 3)$, o de $(2, 0, 1)$. Una
              sola incógnita escalar, $k$, que puede ser negativa.
          - texto: >-
              $\vec{v}_1 = \vec{v}_2$, porque dos vectores paralelos son
              iguales
            mensaje: |
              Paralelos no es iguales: pueden tener distinto módulo y distinto
              sentido. Con $\vec{v}_1 = \vec{v}_2$ la resultante mediría
              $2\sqrt{45}$, y el enunciado dice $\sqrt{80}$.
          - texto: >-
              $\vec{v}_1$ es perpendicular a $\vec{v}_2$ y está en el plano
              $2x + z = 0$
            mensaje: |
              El plano es donde están los **puntos de aplicación**, no los
              vectores. Y el sistema es de vectores paralelos: misma dirección.

      - tipo: calcular
        titulo: Los valores posibles de k
        pregunta: |
          Con $\vec{R} = \vec{v}_1 + \vec{v}_2 = (3 + k)(2, 0, 1)$ y
          $|\vec{R}| = \sqrt{80}$, ¿qué valores puede tomar $k$?
        respuesta:
          tipo: conjunto
          valor: '1, -7'
          tolerancia: 0.001
          formato: los valores separados por comas
        distractores:
          - valor: '1, -1'
            mensaje: |
              Has sumado módulos, $|\vec{v}_1| = \sqrt{80} - \sqrt{45}$. Los
              módulos solo se suman si los dos vectores tienen el mismo
              sentido; con la ecuación $|3 + k|\sqrt{5} = \sqrt{80}$ salen las
              dos soluciones de verdad.
          - valor: '7, -1'
            mensaje: |
              Has restado, $\vec{v}_1 - \vec{v}_2$. La resultante es la
              **suma**: $(6 + 2k,\ 0,\ 3 + k)$.
        pista: |
          $|\vec{R}| = |3 + k|\,\sqrt{5} = \sqrt{80}$, así que $|3 + k| = 4$.
        desarrollo: |
          $$
          |3 + k| = 4 \quad\Longrightarrow\quad k = 1 \quad\text{o}\quad k = -7
          $$

          Es decir, $\vec{v}_1 = 2\vec{i} + \vec{k}$ (del mismo sentido que
          $\vec{v}_2$) o $\vec{v}_1 = -14\vec{i} - 7\vec{k}$ (del contrario).

      - tipo: calcular
        titulo: El momento de v2 en el origen
        pregunta: |
          ¿Cuánto vale $\overrightarrow{OA_2} \times \vec{v}_2$?
        respuesta:
          tipo: vector
          valor: '(3, 0, -6)'
          tolerancia: 0.001
          formato: tres componentes entre paréntesis, separadas por comas
        distractores:
          - valor: '(-3, 0, 6)'
            mensaje: |
              Signo cambiado: es $\vec{v}_2 \times \overrightarrow{OA_2}$. El
              vector de posición va primero.
        pista: |
          $(0, 1, 0) \times (6, 0, 3)$.
        desarrollo: |
          $$
          (0, 1, 0) \times (6, 0, 3) = (3,\ 0,\ -6)
          $$

          Es exactamente $\vec{M}_O$: el momento de $\vec{v}_1$ en el origen
          tiene que ser nulo.

      - tipo: calcular
        titulo: El punto de aplicación de v1
        pregunta: |
          $\overrightarrow{OA_1} \times \vec{v}_1 = \vec{0}$ pone $A_1$ en la
          recta que pasa por $O$ con la dirección $(2, 0, 1)$. Con el plano
          $2x + z = 0$, ¿cuál es $A_1$?
        respuesta:
          tipo: vector
          valor: '(0, 0, 0)'
          tolerancia: 0.001
          formato: tres coordenadas entre paréntesis, separadas por comas
        distractores:
          - valor: '(0, 1, 0)'
            mensaje: |
              Ese es $A_2$. Has tomado la recta de $\vec{v}_2$, que pasa por
              $A_2$, en vez de la que pasa por el origen: $A_1 = t\,(2, 0, 1)$.
        pista: |
          $A_1 = t\,(2, 0, 1)$, y $2(2t) + t = 5t = 0$.
        desarrollo: |
          $$
          5t = 0 \quad\Longrightarrow\quad A_1 = (0,\ 0,\ 0)
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $\vec{v}_1 = k\,(2, 0, 1)$ y $\vec{R} = (3 + k)(2, 0, 1)$, así
              que $|3 + k| = 4$: $k = 1$ o $k = -7$.
          - texto: >-
              $\overrightarrow{OA_2} \times \vec{v}_2 = 3\vec{i} - 6\vec{k}$ ya
              es $\vec{M}_O$, así que $\overrightarrow{OA_1} \times \vec{v}_1 = \vec{0}$.
          - texto: >-
              $A_1$ está en la recta $t\,(2, 0, 1)$ y en el plano
              $2x + z = 0$: $A_1 = (0, 0, 0)$, para las dos soluciones.
          - texto: >-
              La solución $k = -7$ se descarta, porque daría una resultante de
              módulo distinto de $\sqrt{80}$.
            trampa: true
            mensaje: |
              Con $k = -7$, $\vec{R} = (-8, 0, -4)$, y
              $|\vec{R}| = \sqrt{64 + 16} = \sqrt{80}$: cumple la condición
              exactamente. Cumple también las otras dos. La colección publica
              solo $k = 1$, el del mismo sentido que $\vec{v}_2$.
    resolucion: |
      **La forma de v1.** Paralelo a $\vec{v}_2 = (6, 0, 3)$:
      $\vec{v}_1 = k\,(2, 0, 1)$, con $k$ de cualquier signo.

      **La resultante.** $\vec{R} = (6 + 2k,\ 0,\ 3 + k) = (3 + k)(2, 0, 1)$,
      de módulo $|3 + k|\sqrt{5}$. Igualado a $\sqrt{80} = 4\sqrt{5}$:

      $$
      |3 + k| = 4 \quad\Longrightarrow\quad k = 1 \quad\text{o}\quad k = -7
      $$

      **El momento.** El de $\vec{v}_2$ en el origen es
      $(0, 1, 0) \times (6, 0, 3) = 3\vec{i} - 6\vec{k}$, que ya es
      $\vec{M}_O$. Así que $\overrightarrow{OA_1} \times \vec{v}_1 = \vec{0}$:
      $A_1$ está en la recta por $O$ de dirección $(2, 0, 1)$,
      $A_1 = t\,(2, 0, 1)$.

      **El plano.** $2x + z = 0$ da $4t + t = 0$, $t = 0$: $A_1 = (0, 0, 0)$.

      **El resultado, y lo que la colección no dice.** La colección publica
      $\vec{v}_1 = 2\vec{i} + \vec{k}$ en $A_1(0, 0, 0)$, que es la solución
      $k = 1$. Pero $k = -7$, es decir $\vec{v}_1 = -14\vec{i} - 7\vec{k}$
      aplicado también en el origen, cumple las tres condiciones: su
      resultante es $(-8, 0, -4)$, de módulo $\sqrt{80}$, y su momento en $O$
      es el mismo. El enunciado no pide que los dos vectores tengan el mismo
      sentido; si se sobreentiende, queda solo la de la colección.
