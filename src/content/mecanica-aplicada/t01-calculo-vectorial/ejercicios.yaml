    pide: El momento resultante de los dos pares, como vector.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado pide «la resultante del momento» sin decir respecto de
          qué punto. ¿Por qué no hace falta?
        opciones:
          - texto: >-
              Porque cada par tiene resultante nula, y con resultante nula el
              momento es el mismo en todos los puntos
            correcta: true
            mensaje: |
              Eso es. En $\vec{M}_{O'} = \vec{M}_O + \overrightarrow{O'O} \times \vec{R}$,
              con $\vec{R} = \vec{0}$ el segundo término desaparece: el
              momento de un par es un vector libre.
          - texto: >-
              Porque se sobreentiende que es el origen de coordenadas
            mensaje: |
              Lo calcularás en $O$ por comodidad, pero no es un convenio: en
              cualquier otro punto saldría exactamente lo mismo, porque el
              sistema no tiene resultante.
          - texto: >-
              Porque el sistema se reduce a una única fuerza, y su momento no
              depende del punto
            mensaje: |
              Una fuerza única tiene resultante no nula, y entonces su momento
              **sí** depende del punto. Aquí la resultante es cero: el sistema
              se reduce a un par, no a una fuerza.

      - tipo: calcular
        titulo: El par de las fuerzas F1
        pregunta: |
          Las dos $F_1$ son verticales y están aplicadas en $(0, 0, 4)$, hacia
          abajo, y en $(3, 0, 0)$, hacia arriba. ¿Cuánto vale la componente
          $y$ del momento de ese par, en N·m?
        respuesta:
          tipo: numero
          valor: '-600'
          tolerancia: 0.5
          formato: un número con su signo, en N·m
        distractores:
          - valor: '600'
            mensaje: |
              Signo cambiado. $(3, 0, 0) \times (0, 0, 200) = (0, -600, 0)$:
              la fuerza que sube por delante y la que baja por detrás hacen
              girar el bloque hacia $-y$.
          - valor: '-800'
            mensaje: |
              Has tomado de brazo los 4 m de altura. Las dos fuerzas son
              verticales, así que la altura no cuenta: el brazo es la
              distancia **horizontal** entre sus rectas, los 3 m según $x$.
        pista: |
          Suma $(0, 0, 4) \times (0, 0, -200)$ y $(3, 0, 0) \times (0, 0, 200)$.
          El primero es nulo.
        desarrollo: |
          $$
          (3, 0, 0) \times (0, 0, 200) = (0,\ -600,\ 0)\ \text{N·m}
          $$

      - tipo: calcular
        titulo: El módulo del par de las fuerzas F2
        pregunta: |
          Las dos $F_2$ son horizontales, según $y$, en $(0, 4, 4)$ y en
          $(3, 4, 0)$. ¿Cuánto mide el momento de ese par, en N·m?
        respuesta:
          tipo: numero
          valor: '500'
          tolerancia: 0.5
          formato: un número, en N·m
        distractores:
          - valor: '400'
            mensaje: |
              Has tomado de brazo solo la diferencia de altura, 4 m. Las
              rectas de las dos $F_2$ están separadas 4 m en $z$ **y** 3 m en
              $x$: la distancia entre ellas es $\sqrt{3^{2} + 4^{2}} = 5$ m.
          - valor: '300'
            mensaje: |
              Has tomado de brazo solo los 3 m según $x$. Las dos rectas están
              también a distinta altura, y la distancia entre ellas es la
              diagonal, 5 m.
          - valor: '700'
            mensaje: |
              Has sumado las dos componentes, 400 y 300. Son perpendiculares:
              el módulo es $\sqrt{400^{2} + 300^{2}}$, no la suma.
        pista: |
          $\left((0, 4, 4) - (3, 4, 0)\right) \times (0, 100, 0)$.
        desarrollo: |
          $$
          (-3,\ 0,\ 4) \times (0,\ 100,\ 0) = (-400,\ 0,\ -300)
          \qquad
          |\vec{M}_2| = 500\ \text{N·m}
          $$

      - tipo: calcular
        titulo: El momento resultante
        pregunta: |
          ¿Cuánto vale el momento resultante de los dos pares?
        respuesta:
          tipo: vector
          valor: '(-400, -600, -300)'
          tolerancia: 0.5
          formato: tres componentes entre paréntesis, separadas por comas, en N·m
        distractores:
          - valor: '(400, 600, 300)'
            mensaje: |
              Todo con el signo cambiado: has hecho $\vec{F} \times \vec{r}$
              en vez de $\vec{r} \times \vec{F}$.
          - valor: '(-400, -800, -300)'
            mensaje: |
              El par de $F_1$ tiene de brazo los 3 m según $x$, no los 4 de
              altura: su componente es $-600$.
        pista: |
          Suma los dos pares: $(0, -600, 0) + (-400, 0, -300)$.
        desarrollo: |
          $$
          \vec{M} = -400\,\vec{i} - 600\,\vec{j} - 300\,\vec{k}\ \text{N·m}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Cada par tiene resultante nula, así que el momento del sistema
              es el mismo en cualquier punto y se puede calcular en $O$.
          - texto: >-
              El par de $F_1$ vale $(3, 0, 0) \times (0, 0, 200) = -600\,\vec{j}$ N·m.
          - texto: >-
              El de $F_2$ vale $(-3, 0, 4) \times (0, 100, 0) = -400\,\vec{i} - 300\,\vec{k}$ N·m,
              de módulo 500.
          - texto: >-
              El par de $F_2$ solo tiene componente según $x$, porque las
              fuerzas van según $y$ y están a 4 m de altura una de otra.
            trampa: true
            mensaje: |
              Además de la altura, las dos $F_2$ están separadas 3 m según $x$
              —una en la cara trasera y otra en la delantera—, y eso da la
              componente $-300\,\vec{k}$.
    resolucion: |
      **Por qué no hay punto.** Cada par tiene resultante nula, así que en el
      campo de momentos el término $\overrightarrow{O'O} \times \vec{R}$
      desaparece y el momento es el mismo en todo el espacio. Se calcula en
      $O$ por comodidad; es lo que dice la nota de la colección.

      **El par de F1.** $-200\,\vec{k}$ en $(0, 0, 4)$ y $+200\,\vec{k}$ en
      $(3, 0, 0)$:

      $$
      \vec{M}_1 = (0, 0, 4) \times (0, 0, -200) + (3, 0, 0) \times (0, 0, 200) = -600\,\vec{j}\ \text{N·m}
      $$

      **El par de F2.** $+100\,\vec{j}$ en $(0, 4, 4)$ y $-100\,\vec{j}$ en
      $(3, 4, 0)$. Con el brazo que va de una recta a la otra:

      $$
      \vec{M}_2 = (-3,\ 0,\ 4) \times (0,\ 100,\ 0) = -400\,\vec{i} - 300\,\vec{k}\ \text{N·m}
      $$

      **El resultado.**
      $\vec{M} = -400\,\vec{i} - 600\,\vec{j} - 300\,\vec{k}$ N·m, el mismo
      que la colección. Calculado en otro punto cualquiera, por ejemplo
      $(5, -2, 9)$, sale idéntico, que es la comprobación de que es un par.

      Las posiciones de las fuerzas se leen de la figura: las dos $F_1$ en
      las aristas verticales del lado $y = 0$ y las dos $F_2$ en las del lado
      $y = 4$, cada pareja en caras opuestas del bloque.

  - id: ejma1-col17-la-viga-empotrada-y-su-fuerza-unica
    titulo: Una viga empotrada con tres fuerzas y un momento, reducida a una fuerza
    fuente: >-
      Ejercicio 1.7 · Tema 1, «Fundamentos de cálculo vectorial» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      En el sistema de la figura actúan tres fuerzas y un momento. Encontrar
      la resultante de sistema de vectores y la distancia respecto a la pared
      a la debe de colocarse para que el sistema resultante sea equivalente.

      <figure>
