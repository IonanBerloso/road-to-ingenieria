    pide: Los esfuerzos en las barras AB y AD y las reacciones en los apoyos E y C.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuántas incógnitas de reacción hay y por qué el problema es
          isostático?
        opciones:
          - texto: >-
              Tres: dos componentes en la articulación C y una vertical en el
              apoyo simple E
            correcta: true
            mensaje: |
              Eso es. La articulación de $C$ al muro impide los dos
              desplazamientos y el apoyo simple de $E$ solo el vertical. Tres
              incógnitas y tres ecuaciones de equilibrio para el conjunto: se
              resuelve solo con la estática.
          - texto: Cuatro, dos en cada apoyo
            mensaje: |
              El apoyo simple de $E$ solo impide el desplazamiento
              perpendicular a la superficie, así que aporta una reacción, no
              dos. Con cuatro incógnitas y tres ecuaciones el conjunto sería
              hiperestático.
          - texto: Dos, una vertical en cada apoyo, porque las cargas son verticales
            mensaje: |
              Que la reacción horizontal salga nula es un **resultado**, no un
              punto de partida: se sabe después de escribir $\sum F_x = 0$. La
              articulación aporta dos incógnitas aunque una acabe valiendo cero.

      - tipo: calcular
        titulo: La reacción del apoyo simple
        pregunta: |
          Tomando momentos en $C$ para el conjunto, ¿cuánto vale la reacción
          en $E$?
        respuesta:
          tipo: magnitud
          valor: '40 kN'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '32 kN'
            mensaje: |
              Te has dejado la carga de 4 kN de $B$, que está a 3 m de $C$ y
              aporta $12\ \text{kN}\cdot\text{m}$ al momento.
          - valor: '28 kN'
            mensaje: |
              Has medido los brazos desde $E$ en vez de desde $C$. Al tomar
              momentos en $C$, la carga de $A$ tiene un brazo de 6 m y la de
              $B$, de 3 m.
        pista: |
          $\sum M_C = 0$. La reacción de $E$ es vertical y $E$ está a 1,5 m de
          $C$; las cargas de $A$ y $B$ están a 6 m y 3 m.
        desarrollo: |
          $$
          \sum M_C = 8 \cdot 6 + 4 \cdot 3 - E \cdot 1{,}5 = 0
          \;\Longrightarrow\; E = \frac{60}{1{,}5} = 40\ \text{kN}
          $$

          Hacia arriba, como se había supuesto.

      - tipo: calcular
        titulo: La reacción vertical del muro
        pregunta: |
          ¿Cuánto vale $C_y$, en kN y con su signo, tomando positivo hacia
          arriba?
        respuesta:
          tipo: numero
          valor: '-28'
          tolerancia: 0.05
          formato: un número, en kN, con su signo
        distractores:
          - valor: '28'
            mensaje: |
              El módulo está bien y el signo no. El apoyo $E$ empuja hacia
              arriba con 40 kN y las cargas suman 12: el muro tiene que tirar
              de la estructura **hacia abajo** para que la suma sea cero.
          - valor: '-12'
            mensaje: |
              Te has dejado la reacción de $E$ en la suma de fuerzas
              verticales. La ecuación completa es $C_y + 40 - 8 - 4 = 0$.
        pista: |
          $\sum F_y = 0$ para el conjunto, con $E = 40$ kN ya calculada.
        desarrollo: |
          $$
          C_y + 40 - 8 - 4 = 0 \;\Longrightarrow\; C_y = -28\ \text{kN}
          $$

          $$
          \sum F_x = 0 \;\Longrightarrow\; C_x = 0
          $$

          La colección publica el módulo, $C = 28$ kN.

      - tipo: calcular
        titulo: El esfuerzo en la barra AD
        pregunta: |
          Aislando el nudo $A$, ¿cuánto vale el esfuerzo de $AD$, en kN y con
          su signo, tomando la tracción positiva?
        respuesta:
          tipo: numero
          valor: '-10'
          tolerancia: 0.05
          formato: un número, en kN, con su signo
        distractores:
          - valor: '10'
            mensaje: |
              El módulo está bien y el signo no. La barra $AD$ empuja al nudo
              $A$ hacia arriba para sostener los 8 kN, así que trabaja a
              **compresión** y su esfuerzo es negativo con este convenio.
          - valor: '-8'
            mensaje: |
              Has puesto la carga entera en la barra sin proyectar. $AD$ es
              inclinada: mide 2,5 m con 1,5 de base y 2 de altura, así que solo
              su componente vertical, $0{,}8\,N$, equilibra los 8 kN.
          - valor: '-12.5'
            mensaje: |
              Has dividido entre $0{,}64$ en vez de entre $0{,}8$, o has usado
              el coseno donde va el seno. La componente vertical del vector
              unitario de $AD$ es $2/2{,}5 = 0{,}8$.
        pista: |
          En $A$ solo concurren $AB$ —horizontal— y $AD$, más la carga de 8 kN.
          La vertical la aguanta $AD$ sola.
        desarrollo: |
          El vector unitario de $A$ a $D$ es $(0{,}6;\ -0{,}8)$, porque
          $AD = \sqrt{1{,}5^{2} + 2^{2}} = 2{,}5$ m.

          $$
          \sum F_y = -0{,}8\,N_{AD} - 8 = 0
          \;\Longrightarrow\; N_{AD} = -10\ \text{kN}
          $$

          Negativo: compresión, los 10 kN (c) que publica la colección.

      - tipo: calcular
        titulo: El esfuerzo en la barra AB
        pregunta: |
          ¿Y el de $AB$, con el mismo convenio?
        respuesta:
          tipo: numero
          valor: '6'
          tolerancia: 0.05
          formato: un número, en kN, con su signo
        distractores:
          - valor: '-6'
            mensaje: |
              El módulo está bien y el signo no. $AD$ empuja al nudo $A$ hacia
              la derecha, así que $AB$ tiene que tirar de él hacia la izquierda:
              está a **tracción**.
          - valor: '8'
            mensaje: |
              Has usado la carga de 8 kN en la ecuación horizontal, pero esa
              carga es vertical y no entra en $\sum F_x$. Lo que entra es la
              componente horizontal de $AD$, $0{,}6 \cdot 10 = 6$.
        pista: |
          $\sum F_x = 0$ en el nudo $A$, con $N_{AD} = -10$ kN.
        desarrollo: |
          $$
          \sum F_x = N_{AB} + 0{,}6\,N_{AD} = 0
          \;\Longrightarrow\; N_{AB} = -0{,}6 \cdot (-10) = 6\ \text{kN}
          $$

          Positivo: tracción, los 6 kN (t) publicados.

      - tipo: calcular
        titulo: El esfuerzo en la barra BC
        pregunta: |
          Aislando ahora el nudo $C$, donde solo concurren $BC$ y $CE$ además
          de la reacción, ¿cuánto vale el esfuerzo de $BC$ en kN, con la
          tracción positiva?
        respuesta:
          tipo: numero
          valor: '21'
          tolerancia: 0.05
          formato: un número, en kN, con su signo
        distractores:
          - valor: '16'
            mensaje: |
              Es el valor que imprime la colección, y no cuadra. En el nudo $C$
              la única fuerza horizontal además de $BC$ es la componente de
              $CE$: $0{,}6 \cdot 35 = 21$, y $C_x = 0$. El nudo $B$ da lo
              mismo. Aquí se publica el 21 que dan los datos.
          - valor: '-21'
            mensaje: |
              El módulo está bien y el signo no. $CE$ está comprimida y empuja
              al nudo $C$ hacia la derecha, así que $BC$ tiene que tirar de él
              hacia la izquierda: tracción.
        pista: |
          En $C$: $\sum F_y$ da $N_{CE}$, y con ella $\sum F_x$ da $N_{BC}$.
          Recuerda que $C_x = 0$.
        desarrollo: |
          El unitario de $C$ a $E$ es $(-0{,}6;\ -0{,}8)$.

          $$
          \sum F_y = -0{,}8\,N_{CE} + C_y = 0
          \;\Longrightarrow\; N_{CE} = \frac{-28}{0{,}8} = -35\ \text{kN}
          $$

          $$
          \sum F_x = -N_{BC} - 0{,}6\,N_{CE} + C_x = 0
          \;\Longrightarrow\; N_{BC} = -0{,}6 \cdot (-35) = 21\ \text{kN}
          $$

          El nudo $B$ lo confirma:
          $-6 + N_{BC} + 0{,}6\,(10) \cdot (-1) + 0{,}6\,(-15) = 0$ da el mismo
          21. La colección imprime 16 kN (t).

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Momentos en $C$ para el conjunto dan $E = 40$ kN, y las dos
              ecuaciones de fuerzas, $C_x = 0$ y $C_y = -28$ kN.
          - texto: >-
              En el nudo $A$ solo hay dos barras: la vertical la aguanta $AD$
              —que sale a compresión, $-10$ kN— y la horizontal, $AB$, a
              tracción con 6 kN.
          - texto: >-
              El nudo $C$ cierra la comprobación: $N_{CE} = -35$ kN y
              $N_{BC} = 21$ kN.
          - texto: >-
              Como las cargas son verticales, todas las barras horizontales
              tienen esfuerzo nulo.
            trampa: true
            mensaje: |
              No: el cordón superior es justo el que más carga. Las barras
              inclinadas convierten la carga vertical en componentes
              horizontales que solo pueden equilibrar $AB$ y $BC$, y por eso
              valen 6 y 21 kN.
    resolucion: |
      **Los apoyos.** La articulación de $C$ al muro aporta dos componentes y el
      apoyo simple de $E$, una vertical: tres incógnitas y tres ecuaciones.

      $$
      \sum M_C = 8 \cdot 6 + 4 \cdot 3 - 1{,}5\,E = 0
      \;\Longrightarrow\; E = 40\ \text{kN}
      $$

      $$
      C_y = 8 + 4 - 40 = -28\ \text{kN}
      \qquad C_x = 0
      $$

      **El nudo A.** Concurren $AB$, horizontal, y $AD$, cuyo unitario es
      $(0{,}6;\ -0{,}8)$:

      $$
      -0{,}8\,N_{AD} - 8 = 0 \;\Longrightarrow\; N_{AD} = -10\ \text{kN}\ (c)
      $$

      $$
      N_{AB} + 0{,}6\,(-10) = 0 \;\Longrightarrow\; N_{AB} = 6\ \text{kN}\ (t)
      $$

      **El resto de la celosía.** Nudo a nudo salen $N_{BD} = 10$ (t),
      $N_{DE} = -12$ (c), $N_{BE} = -15$ (c), $N_{CE} = -35$ (c) y
      $N_{BC} = 21$ (t).

      **Lo que no cuadra.** La colección publica $N_6 = N_{BC} = 16$ kN (t). El
      nudo $C$ solo tiene dos barras y una reacción sin componente horizontal,
      así que $N_{BC} = 0{,}6\,|N_{CE}| = 21$ kN, y el nudo $B$ da lo mismo. Se
      publica el 21 y se deja el 16 como distractor. Los otros seis esfuerzos y
      las dos reacciones coinciden con lo impreso.

  - id: ejma3-col320-la-cercha-de-triangulos-equilateros
