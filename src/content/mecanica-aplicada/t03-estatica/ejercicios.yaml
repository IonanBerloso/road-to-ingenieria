        <text x="240" y="60" font-size="9.5" fill="var(--faint)">OA = 3R</text>
        <text x="240" y="76" font-size="9.5" fill="var(--faint)">BC = 5R√3/3</text>
        <text x="240" y="92" font-size="9.5" fill="var(--faint)">OB = 8R√3/3</text>
      </svg>
      </figure>
    pide: El valor del par P aplicado sobre OA, en funcion de M, g y R.
    pasos:
      - tipo: reconocer
        pregunta: |
          La nota de la colección pide buscar el aislamiento que conteste antes
          a lo que se pregunta. ¿Cuál es?
        opciones:
          - texto: >-
              La barra OA junto con el disco, porque la normal del contacto en
              D pasa por O y no da momento
            correcta: true
            mensaje: |
              Eso es, y es todo el ejercicio. El contacto en $D$ es liso, así
              que la normal es perpendicular a $CB$; como pasa por el centro
              del disco, $A$, y los puntos $O$, $A$ y $D$ están alineados, esa
              normal pasa por $O$. En la ecuación de momentos en $O$ desaparece,
              y el par solo tiene que equilibrar los dos pesos.
          - texto: Solo la barra OA, porque es donde actúa el par
            mensaje: |
              Si aíslas solo $OA$ aparece la fuerza que el disco le hace en el
              pasador $A$, que son dos incógnitas más y que no conoces todavía.
              Metiendo el disco dentro del sistema esa fuerza pasa a ser
              interna.
          - texto: El conjunto entero, para que no aparezca ninguna fuerza interna
            mensaje: |
              En el conjunto entero aparecen las reacciones de $O$ **y** las de
              $B$. Tomando momentos en $O$ quedan las de $B$, que son dos
              incógnitas: hace falta otra ecuación antes de despejar el par.

      - tipo: calcular
        titulo: La inclinación de la manivela
        pregunta: |
          Con $OD = 4R$ y $OB = 8R\sqrt{3}/3$, y sabiendo que $OD$ es
          perpendicular a $CB$, ¿cuántos grados forma $OA$ con la horizontal?
        respuesta:
          tipo: numero
          valor: '30'
          tolerancia: 0.05
          formato: un número, en grados
        distractores:
          - valor: '60'
            mensaje: |
              Es el complementario. En el triángulo rectángulo $ODB$ el cateto
              conocido es $OD = 4R$ y la hipotenusa es $OB$, así que lo que sale
              directamente es el coseno del ángulo en $O$.
          - valor: '49.47'
            mensaje: |
              Has usado $OA = 3R$ en vez de $OD = 4R$. El vértice del ángulo
              recto es $D$, el punto de contacto, que está a $3R + R = 4R$
              de $O$.
        pista: |
          El triángulo $ODB$ es rectángulo en $D$, así que
          $\cos\alpha = OD/OB$.
        desarrollo: |
          $$
          \cos\alpha = \frac{OD}{OB} = \frac{4R}{8R\sqrt{3}/3}
          = \frac{12}{8\sqrt{3}} = \frac{\sqrt{3}}{2}
          \;\Longrightarrow\; \alpha = 30^{\circ}
          $$

          $OD = OA + R = 3R + R = 4R$ porque el contacto está a un radio del
          centro del disco y los tres puntos están alineados.

      - tipo: calcular
        titulo: El par aplicado
        pregunta: |
          ¿Cuánto vale el coeficiente $c$ del par, si se escribe
          $P = c\,MgR$?
        respuesta:
          tipo: numero
          valor: '5.196'
          tolerancia: 0.01
          formato: un número, con tres decimales
        distractores:
          - valor: '2.598'
            mensaje: |
              Te has dejado el peso del disco. Pesa $Mg$ y su centro está en
              $A$, a $3R\cos 30^{\circ}$ de la vertical de $O$: aporta tanto
              momento como la propia barra $OA$.
          - valor: '3'
            mensaje: |
              Has usado el seno en vez del coseno. El brazo de un peso vertical
              es la distancia **horizontal** al punto donde tomas momentos, y
              eso es $x = d\cos\alpha$.
          - valor: '6'
            mensaje: |
              Te has dejado la proyección: has sumado $2M \cdot 1{,}5R$ y
              $M \cdot 3R$ sin multiplicar por $\cos 30^{\circ}$. La manivela
              está inclinada, y el brazo del peso es la distancia horizontal.
        pista: |
          Momentos en $O$ del conjunto $OA$ más disco. La normal en $D$ pasa
          por $O$: no da momento. Quedan los dos pesos y el par.
        desarrollo: |
          $$
          P = 2Mg \cdot \frac{3R}{2}\cos 30^{\circ} + Mg \cdot 3R\cos 30^{\circ}
          = 6MgR\cos 30^{\circ}
          $$

          $$
          P = 6MgR \cdot \frac{\sqrt{3}}{2} = 3\sqrt{3}\,MgR = 5{,}196\,MgR
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El contacto en $D$ es liso, así que la normal es perpendicular a
              $CB$ y pasa por el centro del disco.
          - texto: >-
              Como $O$, $A$ y $D$ están alineados, esa normal pasa también por
              $O$ y no da momento respecto de $O$.
          - texto: >-
              Momentos en $O$ del conjunto $OA$ más disco:
              $P = 6MgR\cos 30^{\circ} = 3\sqrt{3}\,MgR$.
          - texto: >-
              Hace falta calcular antes la normal en $D$, porque sin ella no se
              puede escribir la ecuación de momentos en $O$.
            trampa: true
            mensaje: |
              Justo al revés: la gracia del ejercicio es que **no** hace falta.
              Su línea de acción pasa por $O$, así que su momento es nulo valga
              lo que valga. Calcularla —sale $15Mg/32$— es trabajo de más.
    resolucion: |
      **La geometría.** El contacto en $D$ no tiene rozamiento, así que la
      fuerza que se transmiten disco y barra $CB$ es perpendicular a $CB$. Toda
      normal a un disco pasa por su centro, o sea por $A$. Y como el enunciado
      sitúa $O$, $A$ y $D$ sobre la misma recta, esa normal pasa **por $O$**.

      La inclinación sale del triángulo rectángulo $ODB$, con $OD = 3R + R = 4R$:

      $$
      \cos\alpha = \frac{4R}{8R\sqrt{3}/3} = \frac{\sqrt{3}}{2}
      \qquad \alpha = 30^{\circ}
      $$

      **El aislamiento que ahorra el trabajo.** Se aíslan juntos la barra $OA$ y
      el disco. Sobre ese sistema actúan: el par $P$, los pesos $2Mg$ en el
      centro de $OA$ y $Mg$ en $A$, la reacción de la articulación $O$ —que no
      da momento en $O$— y la normal de $D$, cuya recta de acción pasa por $O$
      y **tampoco** da momento. Queda una sola ecuación con una sola incógnita:

      $$
      P = 2Mg\,\frac{3R}{2}\cos 30^{\circ} + Mg\,3R\cos 30^{\circ}
      = 6MgR\,\frac{\sqrt{3}}{2} = 3\sqrt{3}\,MgR
      $$

      **Comprobación.** Por si hiciera falta, la normal se puede sacar aparte
      con la barra $CB$: momentos en $B$ dan $N = 15Mg/32$, y su momento
      respecto de $O$ es nulo, como se ha dicho. El resultado coincide con el
      $3\sqrt{3}\,MgR$ que publica la colección.

  - id: ejma3-col317-la-constante-del-resorte-entre-las-dos-barras
    titulo: La constante del resorte que sostiene el disco
    fuente: >-
      Ejercicio 3.17 · Tema 3, «Estática del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Dos barras iguales $AB$ y $CD$ de masa $M$ y longitud $4R\sqrt{3}$ están
      articuladas en su punto medio, unidas mediante un resorte ideal y
      apoyadas en un suelo liso. A su vez, en las barras se apoya un disco de
      masa $M$ y radio $R$ como se muestra en la figura. Sabiendo que no existe
      rozamiento entre el disco y las barras, determinar la constante elástica
      del resorte $k$ para que el sistema esté en equilibrio en la posición
      indicada.

      <figure>
      <svg viewBox="0 0 300 240" role="img" width="300" height="240" aria-labelledby="ma3c317-t ma3c317-d">
