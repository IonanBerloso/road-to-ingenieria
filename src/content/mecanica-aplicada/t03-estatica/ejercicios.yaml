    pide: Las fuerzas internas en las barras CD, CF y EF, en funcion de p y a.
    pasos:
      - tipo: reconocer
        pregunta: |
          La nota de la colección avisa de la peculiaridad de la carga: cuelga
          de dos cordones y hay que separarla de la celosía. ¿Cómo llega
          entonces a la estructura?
        opciones:
          - texto: >-
              Como dos cargas puntuales en los nudos de los que cuelga, que se
              reparten la resultante según la posición de su centroide
            correcta: true
            mensaje: |
              Eso es. El bloque colgado es un sólido aparte, sostenido por dos
              cordones verticales: se le aplican sus dos ecuaciones y la
              resultante $pa$ se reparte según dónde caiga el centroide, a dos
              tercios del extremo izquierdo.
          - texto: Como una carga repartida sobre el cordón inferior
            mensaje: |
              No toca el cordón: cuelga de dos cordones verticales atados a dos
              nudos. Si estuviera apoyada sobre las barras habría que repartirla
              tramo a tramo, y además las barras trabajarían a flexión.
          - texto: Como una única carga puntual en el nudo del centro del bloque
            mensaje: |
              El bloque no está colgado del centro sino de sus dos extremos.
              Con dos cordones, cada uno se lleva la parte que le toca según el
              centroide, y aquí el reparto es de un tercio y dos tercios.

      - tipo: calcular
        titulo: Lo que se lleva el cordón de E
        pregunta: |
          La carga triangular vale $0$ sobre $E$ y $p$ dos tramos a la derecha.
          ¿Qué coeficiente $c$ tiene la fuerza del cordón de $E$, escrita como
          $F = c\,pa$?
        respuesta:
          tipo: numero
          valor: '0.3333'
          tolerancia: 0.005
          formato: un número, coeficiente de pa, con cuatro decimales
        distractores:
          - valor: '0.5'
            mensaje: |
              Has repartido la resultante a medias. El centroide de un triángulo
              no está en el centro: está a dos tercios del vértice, o sea más
              cerca del cordón de la derecha, que carga con el doble.
          - valor: '0.6667'
            mensaje: |
              Has intercambiado los dos cordones. El centroide cae cerca del
              extremo donde la carga es máxima, así que ese cordón es el que se
              lleva los dos tercios; el de $E$, donde la carga se anula, el
              tercio.
        pista: |
          Resultante $= p \cdot 2a/2 = pa$, aplicada a $2a/3$ del vértice
          izquierdo. El bloque es una barra sobre dos apoyos.
        desarrollo: |
          $$
          R = \frac{p \cdot 2a}{2} = pa
          \qquad
          x_c = \frac{2}{3}\,(2a) = \frac{4a}{3}\ \text{desde}\ E
          $$

          $$
          F_{\text{der}} = pa\,\frac{4a/3}{2a} = \frac{2pa}{3}
          \qquad
          F_E = pa - \frac{2pa}{3} = \frac{pa}{3}
          $$

      - tipo: calcular
        titulo: El cordón inferior EF
        pregunta: |
          Cortando por $CD$, $CF$ y $EF$ y tomando momentos en $C$ para la parte
          izquierda, ¿cuánto vale el coeficiente de $T_{EF}$, con la tracción
          positiva?
        respuesta:
          tipo: numero
          valor: '0.8889'
          tolerancia: 0.005
          formato: un número, coeficiente de pa, con cuatro decimales
        distractores:
          - valor: '0.4444'
            mensaje: |
              Has dado la reacción de $A$, no el esfuerzo. El momento en $C$ de
              la parte izquierda es $A_y \cdot 2a = 8pa^{2}/9$, y hay que
              dividirlo entre el canto $a$.
          - valor: '0.6667'
            mensaje: |
              Sale de colgar toda la resultante del cordón de la derecha, sin el
              tercio que se lleva $E$. Con ese reparto la reacción de $A$ sería
              $pa/3$ en vez de $4pa/9$.
        pista: |
          Primero las reacciones: $\sum M_A = 0$ con las dos cargas colgadas.
          Después, momentos en $C$, donde $CD$ y $CF$ pasan por el punto.
        desarrollo: |
          Reacciones, con las cargas $pa/3$ en $x = 2a$ y $2pa/3$ en $x = 4a$:

          $$
          6a\,B = \frac{pa}{3}\,2a + \frac{2pa}{3}\,4a = \frac{10pa^{2}}{3}
          \;\Longrightarrow\; B = \frac{5pa}{9}
          \qquad A_y = \frac{4pa}{9}
          $$

          Momentos en $C$ de la parte izquierda, donde la carga de $E$ tiene
          brazo nulo:

          $$
          a\,T_{EF} = \frac{4pa}{9}\,2a
          \;\Longrightarrow\; T_{EF} = \frac{8pa}{9} = 0{,}8889\,pa\ (t)
          $$

      - tipo: calcular
        titulo: La diagonal CF
        pregunta: |
          Con el equilibrio vertical de esa misma parte, ¿cuánto vale el
          coeficiente de $T_{CF}$?
        respuesta:
          tipo: numero
          valor: '0.1571'
          tolerancia: 0.005
          formato: un número, coeficiente de pa, con cuatro decimales
        distractores:
          - valor: '0'
            mensaje: |
              Es el valor que imprime la colección, y no puede ser: la
              resultante vertical de la parte izquierda vale
              $4pa/9 - pa/3 = pa/9$, distinta de cero, y la diagonal es la
              única barra cortada que puede equilibrarla.
          - valor: '0.1111'
            mensaje: |
              Eso es la componente vertical, $pa/9$, no el esfuerzo. La diagonal
              está a $45^{\circ}$: su módulo es esa componente multiplicada por
              $\sqrt{2}$.
        pista: |
          En la parte izquierda quedan $A_y = 4pa/9$ hacia arriba y la carga
          $pa/3$ del cordón de $E$ hacia abajo.
        desarrollo: |
          $$
          \frac{4pa}{9} - \frac{pa}{3} - \frac{T_{CF}}{\sqrt{2}} = 0
          $$

          $$
          T_{CF} = \frac{\sqrt{2}}{9}\,pa = 0{,}1571\,pa\ (t)
          $$

      - tipo: calcular
        titulo: El cordón superior CD
        pregunta: |
          Y con el equilibrio horizontal, ¿cuánto vale el coeficiente de
          $T_{CD}$, con su signo?
        respuesta:
          tipo: numero
          valor: '-1'
          tolerancia: 0.005
          formato: un número, coeficiente de pa, con su signo
        distractores:
          - valor: '-0.3333'
            mensaje: |
              Es el valor que imprime la colección, y no cierra el equilibrio:
              con $T_{EF} = 8pa/9$ y $T_{CF} = 0$, la suma horizontal daría
              $0{,}56\,pa$ en vez de cero. Con los tres valores de aquí,
              $-1 + 0{,}1571/\sqrt{2} + 0{,}8889 = 0$.
          - valor: '-1.3333'
            mensaje: |
              Te has dejado la carga del cordón de $E$ al tomar momentos en $F$:
              su brazo respecto de $F$ es $a$, no cero.
        pista: |
          $\sum F_x = 0$ de la parte cortada, con las tres barras: dos
          horizontales y la diagonal a $45^{\circ}$.
        desarrollo: |
          $$
          T_{CD} + \frac{T_{CF}}{\sqrt{2}} + T_{EF} = 0
          $$

          $$
          T_{CD} = -\frac{pa}{9} - \frac{8pa}{9} = -pa\ (c)
          $$

          Lo confirman los momentos en $F$:
          $-a\,T_{CD} = \frac{4pa}{9}\,3a - \frac{pa}{3}\,a = pa^{2}$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El bloque colgado se separa de la celosía: su resultante $pa$ se
              reparte en $pa/3$ sobre $E$ y $2pa/3$ sobre el nudo de la
              derecha.
          - texto: >-
              Con esas dos cargas, $A_y = 4pa/9$ y $B = 5pa/9$, y momentos en
              $C$ dan $T_{EF} = 8pa/9$ a tracción.
          - texto: >-
              El equilibrio vertical da $T_{CF} = \sqrt{2}\,pa/9$ y el
              horizontal cierra con $T_{CD} = -pa$.
          - texto: >-
              Como la carga no toca ningún nudo del cordón superior, las barras
              $CD$ y $CF$ no trabajan.
            trampa: true
            mensaje: |
              Una carga en el cordón inferior se transmite a toda la celosía: el
              momento flector lo aguantan los dos cordones y el cortante, la
              diagonal. Que la carga esté abajo no deja ociosa a la mitad de la
              estructura.
    resolucion: |
      **La carga colgada.** El bloque cuelga de dos cordones verticales atados a
      $E$ —donde la carga se anula— y al nudo situado dos tramos a su derecha
      —donde vale $p$—. Es un sólido aparte: su resultante es
      $R = p\,(2a)/2 = pa$, aplicada a $4a/3$ de $E$, y sus dos ecuaciones dan

      $$
      F_E = \frac{pa}{3}
      \qquad
      F_{\text{der}} = \frac{2pa}{3}
      $$

      **Las reacciones.**

      $$
      6a\,B = \frac{pa}{3}\,2a + \frac{2pa}{3}\,4a
      \;\Longrightarrow\; B = \frac{5pa}{9}
      \qquad A_y = \frac{4pa}{9}
      $$

      **La sección.** Se corta el tercer panel por $CD$, $CF$ y $EF$:

      $$
      \sum M_C = 0 \;\Longrightarrow\; T_{EF} = \frac{8pa}{9}\ (t)
      $$

      $$
      \sum F_y = 0 \;\Longrightarrow\; T_{CF} = \frac{\sqrt{2}}{9}pa\ (t)
      $$

      $$
      \sum F_x = 0 \;\Longrightarrow\; T_{CD} = -pa\ (c)
      $$

      **Lo que no cuadra.** La colección publica $T_{CD} = -pa/3$ y
      $T_{CF} = 0$ junto con $T_{EF} = 8pa/9$. Esos tres valores no cumplen el
      equilibrio horizontal de la parte cortada —hay dos barras horizontales y
      una diagonal, y $-pa/3 + 0 + 8pa/9 \neq 0$—, así que no pueden ser los
      tres correctos. El $T_{EF}$ impreso sí coincide con el nuestro. Se
      publican los tres que salen de los datos y se dejan los impresos como
      distractores.

