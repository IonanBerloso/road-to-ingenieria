        <line x1="46" y1="88.75" x2="46" y2="111.25" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="42" y1="88.75" x2="50" y2="88.75" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="42" y1="111.25" x2="50" y2="111.25" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="46" y1="111.25" x2="46" y2="190" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="42" y1="190" x2="50" y2="190" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="40" y="103" font-size="9" text-anchor="end" fill="var(--faint)">50 mm</text>
        <text x="40" y="153" font-size="9" text-anchor="end" fill="var(--faint)">175 mm</text>
        <line x1="70" y1="196" x2="70" y2="218" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="160" y1="196" x2="160" y2="218" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="250" y1="212" x2="250" y2="218" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="70" y1="214" x2="160" y2="214" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="160" y1="214" x2="250" y2="214" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="70" y1="210" x2="70" y2="218" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="160" y1="210" x2="160" y2="218" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="250" y1="210" x2="250" y2="218" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="115" y="228" font-size="9" text-anchor="middle" fill="var(--faint)">200 mm</text>
        <text x="205" y="228" font-size="9" text-anchor="middle" fill="var(--faint)">200 mm</text>
      </svg>
      <figcaption>

      Dos piezas unidas por el pasador **C**. La de arriba llega hasta **B**;
      la que tiene forma de C lleva el brazo de **A** y el de **F**. Según
      dónde se aplique la carga, una de las dos queda **sin cargas
      intermedias**, y entonces es de dos fuerzas.

      </figcaption>
      </figure>
    pide: Las componentes de las reacciones en B y en F en los tres casos.
    pasos:
      - tipo: reconocer
        pregunta: |
          Con la carga en $A$, ¿qué tiene de particular la pieza $CDB$?
        opciones:
          - texto: Que solo recibe fuerzas en C y en B, así que es de dos fuerzas y su reacción va en la dirección CB
            correcta: true
            mensaje: |
              Eso es. Con la carga en $A$ —que está en la otra pieza—, sobre
              $CDB$ solo actúan los dos pasadores: la fuerza va en la recta
              $CB$, y eso fija la relación entre $B_x$ y $B_y$ antes de
              calcular nada.
          - texto: Que es horizontal, así que su reacción en B es horizontal
            mensaje: |
              La forma de la pieza no manda: lo que manda es la recta que une
              los dos puntos donde recibe fuerza. $C$ está 50 mm por debajo de
              $B$, así que la dirección no es horizontal.
          - texto: Que las dos piezas son de dos fuerzas, porque ninguna tiene peso
            mensaje: |
              La otra pieza recibe **tres** fuerzas —la carga en $A$, el
              pasador $C$ y el apoyo $F$—, así que no lo es. Solo una de las dos
              lo es en cada caso, y depende de dónde se ponga la carga.
          - texto: Que al estar articulada en sus dos extremos, no transmite nada
            mensaje: |
              Transmite, y mucho: una barra de dos fuerzas trabaja a tracción o
              a compresión. Lo que no puede es transmitir una fuerza
              perpendicular a su recta ni un momento.

      - tipo: calcular
        titulo: La componente horizontal en B, con la carga en A
        pregunta: |
          Con la carga en $A$, ¿cuánto vale $B_x$?
        respuesta:
          tipo: magnitud
          valor: '213.3 N'
          tolerancia: 0.01
          formato: una fuerza, con su unidad
        distractores:
          - valor: '240 N'
            mensaje: |
              240 N es la carga entera, y es **vertical**. La componente
              horizontal sale de los momentos del conjunto, y depende de los
              brazos, no del valor de la carga.
          - valor: '120 N'
            mensaje: |
              Has repartido la carga a medias entre los dos apoyos. Eso valdría
              para las componentes verticales de una viga simétrica, no para la
              horizontal de este entramado.
          - valor: '26.7 N'
            mensaje: |
              Esa es $B_y$, la componente vertical. La relación entre las dos es
              la de la recta $CB$: 400 mm en horizontal por cada 50 en vertical.
        pista: |
          Toma momentos en $F$ para el **conjunto**: desaparecen $F_x$ y $F_y$ y
          queda solo $B_x$, porque $B$ está en la misma vertical que $F$.
        desarrollo: |
          $$
          \sum M_F = 240 \cdot 200 - B_x \cdot 225 = 0
          \;\Longrightarrow\; B_x = 213{,}3\ \text{N}
          $$

          $B_y$ no aparece porque su brazo respecto de $F$ es cero: $B$ está
          justo encima de $F$.

      - tipo: calcular
        titulo: La componente vertical en B, con la carga en A
        pregunta: |
          Con la carga en $A$, ¿cuánto vale $B_y$?
        respuesta:
          tipo: magnitud
          valor: '26.7 N'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '146.7 N'
            mensaje: |
              Ese es el valor del caso b, con la carga en $D$. Ahí la carga está
              sobre la pieza $CDB$ y la de dos fuerzas es la otra, así que la
              dirección que se conoce es distinta.
          - valor: '120 N'
            mensaje: |
              Has repartido la carga a medias. Aquí el reparto lo impone la
              dirección $CB$: por cada 400 N horizontales, 50 verticales.
          - valor: '213.3 N'
            mensaje: |
              Esa es $B_x$. La componente vertical es ocho veces menor, porque
              la recta $CB$ recorre 400 mm en horizontal y solo 50 en vertical.
        pista: |
          La pieza $CDB$ es de dos fuerzas: la fuerza en $B$ va en la dirección
          de $C(0; 175)$ a $B(400; 225)$.
        desarrollo: |
          $$
          \frac{B_y}{B_x} = \frac{50}{400} \;\Longrightarrow\;
          B_y = \frac{213{,}3}{8} = 26{,}7\ \text{N}
          $$

          Y del conjunto, $F_x = -213{,}3$ N y $F_y = 240 - 26{,}7 = 213{,}3$ N.

      - tipo: calcular
        titulo: La componente vertical en F, con la carga en D
        pregunta: |
          Con la carga en $D$, ¿cuánto vale $F_y$?
        respuesta:
          tipo: magnitud
          valor: '93.3 N'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '213.3 N'
            mensaje: |
              Ese es el valor del caso a. Al mover la carga a $D$ cambia qué
              pieza es de dos fuerzas: ahora lo es la de $F$, y su reacción va
              en la dirección $FC$, no en la $CB$.
          - valor: '146.7 N'
            mensaje: |
              Esa es $B_y$ en este caso. Las dos suman 240 N, así que si una es
              146,7 la otra tiene que ser 93,3.
          - valor: '120 N'
            mensaje: |
              Has repartido la carga a medias entre los dos apoyos. El reparto
              lo fija la dirección de la pieza de dos fuerzas, que aquí une
              $F(400; 0)$ con $C(0; 175)$.
        pista: |
          Con la carga en $D$, la pieza de dos fuerzas es la otra: la reacción
          en $F$ va en la dirección de $F$ a $C$, con 400 mm en horizontal por
          cada 175 en vertical. Y $B_x$ sigue valiendo 213,3 N.
        desarrollo: |
          $$
          F_y = 213{,}3 \cdot \frac{175}{400} = 93{,}3\ \text{N}
          $$

          Y entonces $B_y = 240 - 93{,}3 = 146{,}7$ N.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Momentos del conjunto en F: la carga tiene brazo 200 mm y $B_x$ tiene 225 mm, así que $B_x = 213{,}3$ N en los tres casos.'
          - texto: Con la carga en $A$ o en $E$, la pieza $CDB$ no tiene cargas intermedias, así que la fuerza en $B$ va en la dirección $CB$ y $B_y = B_x/8 = 26{,}7$ N.
          - texto: Con la carga en $D$, la que queda de dos fuerzas es la otra pieza, y entonces $F_y = 213{,}3 \cdot 175/400 = 93{,}3$ N.
          - texto: Al bajar la carga de A a E cambian las reacciones, porque el punto de aplicación está mucho más abajo.
            trampa: true
            mensaje: |
              Los casos a y c dan exactamente lo mismo, y el resultado de la
              colección lo confirma. La carga sigue estando en la misma pieza y
              en la misma vertical, $x = 200$ mm: lo único que cuenta para los
              momentos es esa distancia, porque la carga es vertical.
    resolucion: |
      **Lo que no cambia.** En los tres casos, momentos del conjunto respecto
      de $F$: la carga de 240 N, vertical y a 200 mm de $F$, y la reacción en
      $B$, cuya componente vertical no da momento porque $B$ está justo encima
      de $F$.

      $$
      240 \cdot 200 = B_x \cdot 225 \;\Longrightarrow\; B_x = 213{,}3\ \text{N}
      $$

      Y $F_x = -213{,}3$ N siempre.

      **Lo que sí cambia: quién es la pieza de dos fuerzas.**

      Con la carga en $A$ o en $E$ —las dos están en la pieza de abajo—, la
      pieza $CDB$ solo recibe los pasadores $C$ y $B$, así que su fuerza va en
      la recta $CB$, que recorre 400 mm en horizontal por 50 en vertical:

      $$
      B_y = \frac{213{,}3}{8} = 26{,}7\ \text{N}
      \qquad
      F_y = 240 - 26{,}7 = 213{,}3\ \text{N}
      $$

      Con la carga en $D$, la de dos fuerzas es la otra, y su recta es $FC$,
      400 mm por 175:

      $$
      F_y = 213{,}3 \cdot \frac{175}{400} = 93{,}3\ \text{N}
      \qquad
      B_y = 146{,}7\ \text{N}
      $$

      Los tres coinciden con el resultado de la colección. El ejercicio está
      montado para enseñar justo eso: mover la carga de una pieza a la otra
      cambia cuál de las dos es de dos fuerzas, y con ello el reparto de las
      componentes verticales — pero no las horizontales.
  - id: ejma3-col36-el-entramado-de-dos-piezas
    titulo: Un entramado con una pieza de dos fuerzas
    fuente: >-
      Ejercicio 3.6 · Tema 3, «Estática del sólido rígido» · Mecánica Aplicada,
      UPV/EHU, curso 2025-2026. La colección publica el resultado, contra el
      que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Calcular las reacciones en $A$ y $C$ en el entramado de la figura.

