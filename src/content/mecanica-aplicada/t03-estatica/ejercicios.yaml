      <figcaption>

      Dos piezas unidas por el pasador **D**. La de arriba, la **L** que va de
      **C** a **D**, no recibe ninguna otra fuerza: es de dos fuerzas, y eso
      fija la dirección de su empuje antes de escribir nada.

      </figcaption>
      </figure>
    pide: Las componentes de las reacciones en A y en C.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué se puede decir de la pieza en forma de L que une $C$ con $D$?
        opciones:
          - texto: Que es de dos fuerzas, así que su empuje va en la recta CD, aunque la pieza no sea recta
            correcta: true
            mensaje: |
              Eso es. Solo recibe fuerza en dos puntos, $C$ y $D$, y da igual
              que el trozo de material vaya en ángulo: la recta que cuenta es
              la que une los dos puntos, con 100 mm en horizontal y 60 en
              vertical.
          - texto: Que no es de dos fuerzas, porque está doblada en ángulo recto
            mensaje: |
              La forma no importa. Lo que hace a un sólido «de dos fuerzas» es
              recibir fuerzas en solo dos puntos; entonces las dos son iguales,
              opuestas y están en la recta que los une.
          - texto: Que trabaja a flexión y por eso hay que ponerle dos componentes en cada extremo
            mensaje: |
              Flexiona, sí —el codo lo nota—, pero eso no cambia el equilibrio
              global de la pieza. Poner cuatro incógnitas donde hay una deja el
              problema sin resolver con la estática sola.
          - texto: Que su empuje es horizontal, porque el tramo que llega a C lo es
            mensaje: |
              La dirección la dan los **puntos** $C$ y $D$, no el último tramo
              de material. $D$ está 60 mm por debajo de $C$, así que la fuerza
              está inclinada.

      - tipo: calcular
        titulo: La componente horizontal de la reacción en C
        pregunta: |
          ¿Cuánto vale $C_x$, en kilopondios y con su signo, tomando positivo
          hacia la derecha?
        respuesta:
          tipo: numero
          valor: '277.78'
          tolerancia: 1
          formato: un número, en kg*, positivo hacia la derecha
        distractores:
          - valor: '-277.78'
            mensaje: |
              El módulo está bien y el sentido no. La carga cuelga a la
              izquierda de $A$, así que la pieza $CD$ tiene que empujar la barra
              hacia la derecha en $D$, y sobre ella el apoyo $C$ empuja hacia la
              derecha también.
          - valor: '178.57'
            mensaje: |
              Has tomado momentos en $A$ sin contar el brazo vertical. $A$ está
              30 mm por encima de la barra, así que la componente **horizontal**
              de la fuerza de $D$ también da momento respecto de $A$.
          - valor: '166.67'
            mensaje: |
              Ese es el módulo de la componente vertical, $C_y$. La relación
              entre las dos la fija la recta $CD$: 100 en horizontal por cada 60
              en vertical.
        pista: |
          Aísla la barra $B$-$A$-$D$ y toma momentos en $A$. La fuerza en $D$
          es $\lambda\,(100;\ -60)$, con una sola incógnita.
        desarrollo: |
          $$
          \sum M_A = 15000 - 5400\,\lambda = 0 \;\Longrightarrow\; \lambda = 2{,}778
          $$

          La fuerza que $CD$ hace sobre la barra en $D$ es
          $(277{,}78;\ -166{,}67)$ kp, y sobre la pieza $CD$ es la opuesta, así
          que en $C$ vale $(277{,}78;\ -166{,}67)$ kp.

      - tipo: calcular
        titulo: La componente vertical de la reacción en A
        pregunta: |
          ¿Cuánto vale $A_y$, en kilopondios y con su signo, tomando positivo
          hacia arriba?
        respuesta:
          tipo: numero
          valor: '416.67'
          tolerancia: 1
          formato: un número, en kg*, positivo hacia arriba
        distractores:
          - valor: '250'
            mensaje: |
              Has equilibrado solo la carga. La pieza $CD$ tira de la barra
              hacia **abajo** en $D$ con 166,67 kp, así que $A$ tiene que
              sostener las dos cosas.
          - valor: '83.33'
            mensaje: |
              Has restado los 166,67 en vez de sumarlos. En $D$ la barra recibe
              una componente vertical hacia abajo: mira el signo de
              $\lambda\,(100;\ -60)$.
        pista: |
          $\sum F_y = 0$ sobre la barra, con la carga, la componente vertical de
          $D$ y $A_y$.
        desarrollo: |
          $$
          A_y - 250 - 166{,}67 = 0 \;\Longrightarrow\; A_y = 416{,}67\ \text{kp}
          $$

          Y $\sum F_x = 0$ da $A_x = -277{,}78$ kp.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: La pieza $CD$ solo recibe fuerza en $C$ y en $D$, así que su fuerza va en la recta $CD$, con componentes proporcionales a 100 y 60.
          - texto: 'Momentos en A sobre la otra pieza: la carga da $15000$ y la fuerza de $D$, $-5400\lambda$, de donde $\lambda = 2{,}778$.'
          - texto: $A_x = -277{,}78$ y $A_y = 416{,}67$ kp; en $C$, $C_x = 277{,}78$ y $C_y = -166{,}67$ kp.
          - texto: En D, la fuerza sobre las dos piezas tiene el mismo sentido, porque el pasador es uno solo.
            trampa: true
            mensaje: |
              Justo al revés: son iguales y **opuestas**, una en cada pieza. Si
              las dibujas con el mismo sentido, el pasador quedaría empujando a
              las dos hacia el mismo lado y las ecuaciones de las dos piezas se
              contradicen.
    resolucion: |
      **La pieza de dos fuerzas.** La $L$ que va de $C$ a $D$ solo recibe los
      dos pasadores, así que su fuerza está en la recta $CD$: 100 mm en
      horizontal por 60 en vertical. Queda una sola incógnita, $\lambda$, con
      la fuerza sobre la barra escrita como $\lambda\,(100;\ -60)$.

      **La barra B-A-D.** Recibe la carga de 250 kp en $B$, el apoyo $A$ y esa
      fuerza en $D$. Con el origen en $B$, $A(60; 30)$ y $D(200; 0)$, momentos
      en $A$:

      $$
      (-60)(-250) - \left[140 \cdot 60\lambda - 30 \cdot 100 \lambda\right] = 0
      $$

      $$
      15000 - 5400\,\lambda = 0 \;\Longrightarrow\; \lambda = 2{,}778
      $$

      **Las reacciones.**

      $$
      A_x = -277{,}78\ \text{kp}
      \qquad
      A_y = 416{,}67\ \text{kp}
      $$

      $$
      C_x = 277{,}78\ \text{kp}
      \qquad
      C_y = -166{,}67\ \text{kp}
      $$

      Coinciden con el resultado de la colección. El detalle que más se falla
      está en los momentos respecto de $A$: como $A$ no está sobre la barra
      sino 30 mm por encima, la componente horizontal de $D$ también tiene
      brazo.

  - id: ejma3-col37-la-carga-repartida-y-las-dos-piezas
    titulo: Dos piezas, una carga repartida y una fuerza en el extremo
    fuente: >-
      Ejercicio 3.7 · Tema 3, «Estática del sólido rígido» · Mecánica Aplicada,
      UPV/EHU, curso 2025-2026. La colección publica el resultado; el signo de
      la componente horizontal en D discrepa del que dan los datos y está
