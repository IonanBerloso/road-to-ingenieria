        <line x1="216" y1="82" x2="216" y2="68" stroke="var(--d2)" stroke-width="0.9" marker-end="url(#ejma3-col311-d-r)"/>
        <text x="146" y="96" font-size="9.5" fill="var(--d2)">q2 = 2 kN/m</text>
        <rect x="50" y="60" width="180" height="8" fill="var(--faint)" fill-opacity="0.35" stroke="var(--ink)" stroke-width="1.2"/>
        <rect x="230" y="34" width="10" height="60" fill="var(--faint)" fill-opacity="0.25" stroke="var(--ink)" stroke-width="1"/>
        <path d="M240 38 L234 44 M240 48 L234 54 M240 58 L234 64 M240 68 L234 74 M240 78 L234 84 M240 88 L234 94" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
