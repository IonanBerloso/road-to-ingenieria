      El alambre es homogéneo, así que el peso de cada tramo es proporcional a
      su **longitud** y se aplica en su centro de gravedad. El de la
      semicircunferencia no está en el centro del círculo.

      </figcaption>
      </figure>
    pide: El ángulo que hace que el tramo BC quede horizontal.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué condición impone que el alambre quede colgando con $BC$
          horizontal?
        opciones:
          - texto: Que el centro de gravedad del alambre entero esté en la misma vertical que B
            correcta: true
            mensaje: |
              Eso es. La articulación solo puede dar una fuerza, no un momento,
              así que el peso total no puede tener brazo respecto de $B$. La
              nota de la colección lo dice igual: si $G$ no está bajo $B$, hay
              un momento imposible de equilibrar.
          - texto: Que el centro de gravedad coincida exactamente con B, también en altura
            mensaje: |
              Basta con que esté en la **misma vertical**. Un $G$ más abajo,
              pero alineado con $B$, no da momento: el peso es vertical y su
              brazo es la distancia horizontal.
          - texto: Que el tramo BC pese lo mismo que el tramo CD
            mensaje: |
              Miden 200 y 150 mm, así que no pesan lo mismo, y aun así puede
              haber equilibrio: lo que se equilibra son **momentos**, no pesos.
          - texto: Que la suma de las longitudes a la izquierda de B iguale a la de la derecha
            mensaje: |
              Cada trozo cuenta con su longitud **y su brazo**. Un tramo corto
              lejos de $B$ pesa poco y da mucho momento; uno largo y cercano, al
              revés.

      - tipo: calcular
        titulo: El coseno del ángulo
        pregunta: |
          Escribiendo $\sum M_B = 0$, ¿cuánto vale $\cos\theta$?
        respuesta:
          tipo: numero
          valor: '0.4444'
          tolerancia: 0.004
          formato: un número entre cero y uno
        distractores:
          - valor: '0.2222'
            mensaje: |
              Has puesto el peso del tramo $CD$ en $D$, su extremo, en vez de en
              su punto medio. El centro de gravedad de un tramo recto está a la
              mitad.
          - valor: '1.7778'
            mensaje: |
              Has usado $4r/3\pi$ para el centro de gravedad de la
              semicircunferencia, que es el del **semicírculo macizo**. El de un
              arco de alambre está a $2r/\pi$ del centro, más lejos. Además,
              un coseno mayor que uno avisa solo de que algo falla.
        pista: |
          El centro de gravedad de un arco semicircular de radio $r$ está a
          $2r/\pi$ del centro, sobre el eje de simetría. Toma momentos
          respecto de $B$ con las longitudes como pesos.
        desarrollo: |
          $$
          -\pi r \cdot \frac{2r}{\pi} + 200 \cdot 100
          + 150\,(200 - 75\cos\theta) = 0
          $$

          $$
          11250 \cos\theta = -45000 + 20000 + 30000 = 5000
          \;\Longrightarrow\; \cos\theta = \frac{5000}{11250} = 0{,}4444
          $$

      - tipo: calcular
        titulo: El ángulo
        pregunta: |
          ¿Cuánto vale $\theta$, en grados?
        respuesta:
          tipo: numero
          valor: '63.61'
          tolerancia: 0.2
          formato: un número, en grados
        distractores:
          - valor: '26.39'
            mensaje: |
              Es el complementario. El ángulo del enunciado se mide entre $CD$ y
              el tramo $CB$, que es horizontal, no con la vertical.
          - valor: '77.16'
            mensaje: |
              Sale de $\cos\theta = 0{,}2222$, es decir, de poner el peso de
              $CD$ en $D$ en vez de en su punto medio.
        pista: |
          Es el arco coseno del número anterior.
        desarrollo: |
          $$
          \theta = \arccos 0{,}4444 = 63{,}61^{\circ}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: Como el alambre es homogéneo, el peso de cada tramo es proporcional a su longitud, aplicado en su centro de gravedad.
          - texto: 'Tomando B como origen: el arco mide $\pi \cdot 150 = 471$ mm y su $G$ está 95,5 mm a la izquierda; $BC$ mide 200 con su $G$ a 100 a la derecha; $CD$ mide 150 con su $G$ en $200 - 75\cos\theta$.'
          - texto: $\sum M_B = 0$ da $11250\cos\theta = 5000$, y de ahí $\theta = 63{,}61^{\circ}$.
          - texto: El arco no da momento respecto de B, porque es simétrico respecto de la recta AB.
            trampa: true
            mensaje: |
              Es simétrico respecto de la **horizontal** que pasa por el centro,
              no respecto de la vertical $AB$: todo el arco queda a la izquierda
              de esa vertical, y su centro de gravedad está a $2r/\pi = 95{,}5$
              mm de ella. Es el término más grande de la ecuación.
    resolucion: |
      **La condición.** En $B$ hay una articulación, que no puede dar momento.
      Si el peso total tuviera brazo respecto de $B$, el alambre giraría: la
      posición dibujada solo es de equilibrio si el centro de gravedad del
      alambre entero está en la vertical de $B$. Es lo que apunta la nota de la
      colección al remitir al ejercicio 2.9.

      **Los tres tramos**, con $B$ como origen y $x$ positiva hacia la derecha.
      Como el alambre es homogéneo, cada peso es proporcional a su longitud:

      - el arco, $\pi \cdot 150 = 471{,}2$ mm, con su centro de gravedad a
        $2 \cdot 150/\pi = 95{,}5$ mm a la izquierda;
      - $BC$, 200 mm, con el suyo a 100 mm a la derecha;
      - $CD$, 150 mm, con el suyo en $200 - 75\cos\theta$.

      **La ecuación de momentos.**

      $$
      471{,}2 \cdot (-95{,}5) + 200 \cdot 100
      + 150\,(200 - 75\cos\theta) = 0
      $$

      $$
      -45000 + 20000 + 30000 - 11250\cos\theta = 0
      \;\Longrightarrow\; \cos\theta = \frac{4}{9}
      $$

      $$
      \theta = 63{,}61^{\circ}
      $$

      Coincide con el resultado de la colección. El primer término es exacto y
      conviene verlo: $\pi r \cdot 2r/\pi = 2r^{2} = 45000$, sin $\pi$ ninguno.

  - id: ejma3-col39-la-polea-entre-dos-barras
    titulo: Una polea montada sobre una de las dos barras
    fuente: >-
      Ejercicio 3.9 · Tema 3, «Estática del sólido rígido» · Mecánica Aplicada,
      UPV/EHU, curso 2025-2026. La colección publica el resultado, contra el
      que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      La polea sin rozamiento de la figura posee un radio de 60 mm. Calcular
      las reacciones en los puntos $A$ y $E$.

      <figure>
      <svg viewBox="0 0 282 252" role="img" width="282" height="252" aria-labelledby="ejma3-col39-t ejma3-col39-d">
        <title id="ejma3-col39-t">Barra vertical y barra inclinada con una polea, unidas en C</title>
        <desc id="ejma3-col39-d">Del techo cuelga en A una barra vertical de 600 mm que termina en C. De C sale una barra inclinada que baja hasta el apoyo articulado E, 900 mm a la derecha y 480 mm por debajo. La polea, de radio 60 mm, está montada en D, el punto medio de esa barra. Una cuerda sale de B, en la barra vertical justo encima de C, va paralela a la barra inclinada, rodea la polea y baja vertical con una carga de 170 N.</desc>
        <defs>
          <marker id="ejma3-col39-f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
        </defs>
        <line x1="46" y1="30" x2="104" y2="30" stroke="var(--ink)" stroke-width="1.2"/>
        <path d="M52 30 L46 24 M62 30 L56 24 M72 30 L66 24 M82 30 L76 24 M92 30 L86 24 M102 30 L96 24" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <path d="M68.35 129.1 L71.65 122.9 L206.65 194.9 L203.35 201.1 Z" fill="var(--faint)" fill-opacity="0.3" stroke="var(--ink)" stroke-width="1.2"/>
        <rect x="66" y="36" width="8" height="90" fill="var(--faint)" fill-opacity="0.3" stroke="var(--ink)" stroke-width="1.2"/>
        <rect x="62" y="30" width="16" height="12" rx="2" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/>
        <circle cx="70" cy="36" r="2" fill="var(--ink)"/>
        <circle cx="137.5" cy="162" r="9" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.4"/>
        <circle cx="137.5" cy="162" r="2" fill="var(--ink)"/>
        <path d="M70 115.8 L141.7 154.1 A9 9 0 0 1 146.5 162 L146.5 206" fill="none" stroke="var(--ink)" stroke-width="1.1"/>
        <line x1="146.5" y1="206" x2="146.5" y2="222" stroke="var(--flag)" stroke-width="1.6" marker-end="url(#ejma3-col39-f)"/>
        <text x="146" y="238" font-size="9.5" text-anchor="middle" fill="var(--flag)">170 N</text>
        <circle cx="70" cy="115.8" r="2.4" fill="var(--ink)"/>
        <circle cx="70" cy="126" r="2.4" fill="var(--ink)"/>
        <rect x="197" y="192" width="16" height="12" rx="2" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/>
        <circle cx="205" cy="198" r="2" fill="var(--ink)"/>
        <line x1="191" y1="210" x2="219" y2="210" stroke="var(--ink)" stroke-width="1"/>
        <path d="M195 210 L191 216 M201 210 L197 216 M207 210 L203 216 M213 210 L209 216 M219 210 L215 216" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="82" y="38" font-size="10" fill="var(--ink)">A</text>
        <text x="80" y="112" font-size="10" fill="var(--ink)">B</text>
        <text x="62" y="136" font-size="10" text-anchor="end" fill="var(--ink)">C</text>
        <text x="132" y="152" font-size="10" text-anchor="end" fill="var(--ink)">D</text>
        <text x="216" y="196" font-size="10" fill="var(--ink)">E</text>
        <line x1="70" y1="22" x2="70" y2="10" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="137.5" y1="150" x2="137.5" y2="10" stroke="var(--faint)" stroke-width="0.7" stroke-dasharray="3 3"/>
        <line x1="205" y1="188" x2="205" y2="10" stroke="var(--faint)" stroke-width="0.7" stroke-dasharray="3 3"/>
        <line x1="70" y1="14" x2="137.5" y2="14" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="137.5" y1="14" x2="205" y2="14" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="70" y1="10" x2="70" y2="18" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="137.5" y1="10" x2="137.5" y2="18" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="205" y1="10" x2="205" y2="18" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="103" y="26" font-size="9" text-anchor="middle" fill="var(--faint)">450 mm</text>
        <text x="171" y="26" font-size="9" text-anchor="middle" fill="var(--faint)">450 mm</text>
        <line x1="60" y1="36" x2="42" y2="36" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="62" y1="126" x2="42" y2="126" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="130" y1="162" x2="42" y2="162" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="44" y1="36" x2="44" y2="126" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="40" y1="36" x2="48" y2="36" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="40" y1="126" x2="48" y2="126" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="44" y1="126" x2="44" y2="162" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="40" y1="162" x2="48" y2="162" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="38" y="84" font-size="9" text-anchor="end" fill="var(--faint)">600 mm</text>
        <text x="38" y="148" font-size="9" text-anchor="end" fill="var(--faint)">240 mm</text>
      </svg>
      <figcaption>

      La cuerda sale de **B**, en la barra vertical, y va **paralela** a la
      barra inclinada hasta rodear la polea. El ramal que cuelga es vertical y
      pasa a un radio del eje **D**.

      </figcaption>
      </figure>
    pide: Las componentes de las reacciones en A y en E.
    pasos:
      - tipo: reconocer
        pregunta: |
          El ramal $BD$ de la cuerda es paralelo a la barra $CDE$ y tangente a
          la polea. ¿A qué distancia de $C$ pasa su recta de acción?
        opciones:
          - texto: A 60 mm, el radio de la polea
            correcta: true
            mensaje: |
              Eso es. La barra $CDE$ pasa por el centro de la polea, y la
              cuerda es paralela a ella y tangente: la separación entre las dos
              rectas es exactamente el radio, valga lo que valga la posición de
              $B$.
          - texto: A cero, porque la cuerda sale de la barra vertical y C está en ella
            mensaje: |
              La cuerda sale de $B$, que está por encima de $C$, y su recta se
              separa de $C$. Si pasara por $C$ no daría momento y la barra
              vertical quedaría sin nada que la equilibrase.
          - texto: A 510 mm, la distancia horizontal hasta el ramal que cuelga
            mensaje: |
              Esa es la distancia al **otro** ramal, el vertical, que es la que
              hace falta para los momentos del conjunto. La del ramal inclinado
              es la separación perpendicular entre dos rectas paralelas.
          - texto: A 240 mm, la altura que baja la barra hasta la polea
            mensaje: |
              Eso es un cateto de la barra, no una distancia perpendicular a la
              cuerda. La distancia entre dos rectas paralelas se mide
              perpendicularmente a ellas.

      - tipo: calcular
        titulo: La componente horizontal de la reacción en A
        pregunta: |
          Aislando la barra $AC$, ¿cuánto vale $A_x$, en newtons y con su
          signo, tomando positivo hacia la derecha?
        respuesta:
          tipo: numero
          valor: '-17'
          tolerancia: 0.4
          formato: un número, en N, con su signo
        distractores:
          - valor: '17'
            mensaje: |
              El módulo está bien y el sentido no. La cuerda tira de $B$ hacia
              la polea, o sea hacia la derecha y hacia abajo; el techo tiene que
              tirar de la barra hacia la izquierda.
          - valor: '0'
            mensaje: |
              Sería cero si la barra $AC$ fuera de dos fuerzas, pero no lo es:
              además de los pasadores $A$ y $C$ recibe el tirón de la cuerda en
              $B$, que es una tercera fuerza.
        pista: |
          Toma momentos en $C$ sobre la barra $AC$: la cuerda tiene brazo 60 mm
          y $A_x$, 600 mm.
        desarrollo: |
          $$
          \sum M_C = -600\,A_x - 170 \cdot 60 = 0
          \;\Longrightarrow\; A_x = -17\ \text{N}
          $$

          Y del conjunto, $E_x = 17$ N.

      - tipo: calcular
        titulo: La componente vertical de la reacción en E
        pregunta: |
          ¿Cuánto vale $E_y$?
        respuesta:
          tipo: magnitud
          valor: '75.93 N'
          tolerancia: 0.01
          formato: una fuerza, con su unidad
        distractores:
          - valor: '64.6 N'
            mensaje: |
              Has puesto la carga en el eje de la polea, a 450 mm de $A$. El
              ramal que cuelga es tangente a la polea, así que pasa 60 mm más a
              la derecha, por 510 mm.
          - valor: '85 N'
            mensaje: |
              Has repartido los 170 N a medias entre $A$ y $E$. El reparto lo
              deciden los brazos, y aquí además hay una pareja horizontal de
              17 N que también da momento.
        pista: |
          Toma momentos en $A$ para todo el conjunto. La carga cuelga por
          $x = 510$ mm, y $E$ está en $(900; -1080)$.
        desarrollo: |
          $$
          \sum M_A = 900\,E_y + 1080\,E_x - 170 \cdot 510 = 0
          $$

          $$
          900\,E_y = 86700 - 1080 \cdot 17 = 68340
          \;\Longrightarrow\; E_y = 75{,}9\ \text{N}
          $$

      - tipo: calcular
        titulo: La componente vertical de la reacción en A
        pregunta: |
          ¿Cuánto vale $A_y$?
        respuesta:
          tipo: magnitud
          valor: '94.07 N'
          tolerancia: 0.01
          formato: una fuerza, con su unidad
        distractores:
          - valor: '76 N'
            mensaje: |
              Ese es $E_y$. Los dos apoyos suman los 170 N de la carga, y como
              la carga cuelga más cerca de $A$, es $A$ quien se lleva la parte
              mayor.
          - valor: '170 N'
            mensaje: |
              Los 170 N son la carga entera, y la sostienen los dos apoyos entre
              los dos. $\sum F_y = 0$ del conjunto reparte, no duplica.
        pista: |
          $\sum F_y = 0$ del conjunto, con $E_y$ ya calculado.
        desarrollo: |
          $$
          A_y = 170 - 75{,}93 = 94{,}07\ \text{N}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: La cuerda es la misma en los dos ramales, 170 N, porque la polea no tiene rozamiento.
          - texto: 'Momentos en C sobre la barra AC: el ramal inclinado pasa a 60 mm de C, así que $600\,A_x = -170 \cdot 60$ y $A_x = -17$ N.'
          - texto: 'Momentos en A del conjunto: la carga cuelga por $x = 510$ mm y $E$ está en $(900; -1080)$, de donde $E_y = 75{,}9$ N y $A_y = 94{,}1$ N.'
          - texto: Como la polea está montada en D, la carga de 170 N se puede tratar como si colgara del propio eje D.
            trampa: true
            mensaje: |
              El ramal que cuelga es tangente a la polea, no pasa por su eje:
              está 60 mm a la derecha. Trasladar la carga al eje cambia el
              momento respecto de $A$ en $170 \cdot 60 = 10\,200$ N·mm y da
              $E_y = 64{,}6$ N en vez de 75,9.
    resolucion: |
      **La cuerda.** Sin rozamiento, la tracción es 170 N en los dos ramales:
      el inclinado, que va de $B$ a la polea paralelo a la barra $CDE$, y el
      vertical del que cuelga la carga.

      **La barra AC.** Con $A$ en el origen, $C(0; -600)$. La recta del ramal
      inclinado es paralela a $CDE$ y tangente a la polea, así que dista de $C$
      exactamente el radio, 60 mm. Momentos en $C$:

      $$
      -600\,A_x - 170 \cdot 60 = 0 \;\Longrightarrow\; A_x = -17\ \text{N}
      $$

      **El conjunto.** $E_x = 17$ N. El ramal que cuelga es tangente por el
      lado derecho, en $x = 450 + 60 = 510$ mm, y $E$ está en $(900; -1080)$
      porque la barra $CDE$ es recta. Momentos en $A$:

      $$
      900\,E_y + 1080 \cdot 17 = 170 \cdot 510
      \;\Longrightarrow\; E_y = 75{,}9\ \text{N}
      $$

      $$
      A_y = 170 - 75{,}9 = 94{,}1\ \text{N}
      $$

      Coincide con el resultado de la colección, que redondea a 94 y 76. Lo que
      hay que ver aquí es que **la posición de B no hace falta**: mientras la
      cuerda sea paralela a la barra, su brazo respecto de $C$ es el radio de
      la polea.

