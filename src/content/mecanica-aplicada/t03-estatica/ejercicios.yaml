        <line x1="100" y1="214" x2="194.5" y2="214" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="194.5" y1="214" x2="226" y2="214" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="100" y1="210" x2="100" y2="218" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="226" y1="210" x2="226" y2="218" stroke="var(--faint)" stroke-width="0.8"/>
