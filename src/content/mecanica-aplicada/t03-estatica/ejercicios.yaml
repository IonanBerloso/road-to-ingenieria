        <line x1="150" y1="44" x2="150" y2="52" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="240" y1="44" x2="240" y2="52" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="87" y="40" font-size="9" text-anchor="middle" fill="var(--faint)">60 mm</text>
