ejercicios:
  - id: ejma3-una-viga-con-dos-apoyos
    titulo: Una viga con un apoyo articulado y otro simple
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Una viga horizontal $AB$ de 4 m, de peso despreciable, tiene un apoyo
      articulado en $A$ y un apoyo simple en $B$. Soporta una carga vertical de
      600 N, hacia abajo, a 1 m de $A$. Calcular las reacciones en los apoyos.
    pide: Las reacciones en A y en B.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué incógnitas mete cada apoyo en el diagrama del sólido libre?
        opciones:
          - texto: El articulado, dos componentes Ax y Ay; el simple, una fuerza vertical B
            correcta: true
            mensaje: |
              Eso es: tres incógnitas y tres ecuaciones en el plano. La viga es
              isostática y se resuelve solo con la estática.
          - texto: Los dos, una fuerza vertical cada uno
            mensaje: |
              El articulado impide moverse en cualquier dirección del plano,
              así que lleva también una componente horizontal. Aquí saldrá
              nula, pero hay que ponerla para saberlo.
          - texto: El articulado, dos componentes y un momento; el simple, una fuerza
            mensaje: |
              El momento es de un empotramiento, que impide girar. Una
              articulación deja girar, así que no da momento.

      - tipo: calcular
        titulo: La reacción en B
        pregunta: |
          Tomando momentos en $A$, ¿cuánto vale la reacción en $B$?
        respuesta:
          tipo: magnitud
          valor: '150 N'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '450 N'
            mensaje: |
              Has intercambiado las reacciones: 450 N es la de $A$. La carga
              está cerca de $A$, así que es $A$ la que carga con la mayor
              parte.
          - valor: '300 N'
            mensaje: |
              Has repartido la carga a medias. Solo sería así con la carga en
              el centro; está a 1 m de $A$ y a 3 m de $B$.
        pista: |
          $\sum M_A = 0$: $B \cdot 4 - 600 \cdot 1 = 0$.
        desarrollo: |
          $$
          \sum M_A = B \cdot 4 - 600 \cdot 1 = 0 \;\Longrightarrow\; B = 150\ \text{N}
          $$

          Tomar momentos en $A$ elimina $A_x$ y $A_y$ de un golpe: queda una
          sola incógnita.

      - tipo: calcular
        titulo: La reacción vertical en A
        pregunta: |
          ¿Cuánto vale $A_y$?
        respuesta:
          tipo: magnitud
          valor: '450 N'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '150 N'
            mensaje: |
              Ese es el valor de $B$. De $\sum F_y = 0$ sale
              $A_y = 600 - 150$.
          - valor: '750 N'
            mensaje: |
              Has sumado $B$ a la carga en lugar de restarlo. Las dos
              reacciones van hacia arriba y entre las dos sostienen los 600 N.
        pista: |
          $\sum F_y = 0$: $A_y + B - 600 = 0$.
        desarrollo: |
          $$
          A_y = 600 - 150 = 450\ \text{N}
          \qquad
          A_x = 0
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'El diagrama del sólido libre lleva $A_x$ y $A_y$ en el articulado, $B$ vertical en el simple y la carga de 600 N.'
          - texto: $\sum M_A = 0$ da $4B = 600$, así que $B = 150$ N.
          - texto: $\sum F_y = 0$ da $A_y = 450$ N, y $\sum F_x = 0$ da $A_x = 0$.
          - texto: El apoyo más cercano a la carga es el que menos carga soporta.
            trampa: true
            mensaje: |
              Al revés. La viga es una palanca: el apoyo a 1 m de la carga se
              lleva tres cuartos de ella, y el que está a 3 m, un cuarto.
    resolucion: |
      **El diagrama del sólido libre.** La viga, con la carga de 600 N a 1 m de
      $A$; en $A$, un apoyo articulado con dos componentes $A_x$ y $A_y$; en
      $B$, un apoyo simple con una reacción vertical $B$. Tres incógnitas y
      tres ecuaciones: isostática.

      **Momentos en A.** Eliminan las dos incógnitas de $A$:

      $$
      B \cdot 4 - 600 \cdot 1 = 0 \;\Longrightarrow\; B = 150\ \text{N}
      $$

      **Fuerzas.** $A_y = 600 - 150 = 450\ \text{N}$ y $A_x = 0$, porque no hay
      ninguna carga horizontal.

      Comprobación con momentos en $B$: $A_y \cdot 4 = 600 \cdot 3$, que da los
      mismos 450 N.

  - id: ejma3-el-puntal-de-dos-fuerzas
    titulo: Un puntal biarticulado, que solo empuja en su dirección
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      La viga horizontal $AD$, de 3 m y peso despreciable, está articulada a
      una pared en $A$ y lleva en su extremo $D$ una carga de 300 N hacia
      abajo. La sostiene un puntal $BC$, también de peso despreciable,
      articulado en sus dos extremos: $C$ está en la viga, a 2 m de $A$, y $B$
      en la pared, 1,5 m por debajo de $A$. Calcular la fuerza en el puntal y
      las reacciones en $A$.

      <figure>
      <svg viewBox="0 0 260 176" role="img" width="260" height="176" aria-labelledby="ma3e2-t ma3e2-d">
        <title id="ma3e2-t">Viga articulada en la pared y sostenida por un puntal</title>
        <desc id="ma3e2-d">Una pared vertical a la izquierda. La viga horizontal AD sale de la pared en A y mide 3 m; en su extremo D cuelga una carga de 300 N. Un puntal recto va desde B, en la pared 1,5 m por debajo de A, hasta C, en la viga a 2 m de A.</desc>
        <defs>
          <marker id="ma3e2-f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
        </defs>
        <line x1="40" y1="30" x2="40" y2="160" stroke="var(--ink)" stroke-width="1.4"/>
        <path d="M40 36 L32 44 M40 56 L32 64 M40 76 L32 84 M40 96 L32 104 M40 116 L32 124 M40 136 L32 144 M40 156 L32 164" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <rect x="40" y="56" width="180" height="8" fill="var(--faint)" fill-opacity="0.25" stroke="var(--ink)" stroke-width="1.2"/>
        <line x1="40" y1="150" x2="160" y2="60" stroke="var(--ink)" stroke-width="3"/>
        <circle cx="40" cy="60" r="3" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/>
        <circle cx="40" cy="150" r="3" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/>
        <circle cx="160" cy="60" r="3" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/>
        <line x1="220" y1="64" x2="220" y2="100" stroke="var(--flag)" stroke-width="1.8" marker-end="url(#ma3e2-f)"/>
        <text x="226" y="96" font-size="10" fill="var(--flag)">300 N</text>
        <text x="48" y="50" font-size="10" fill="var(--ink)">A</text>
        <text x="48" y="158" font-size="10" fill="var(--ink)">B</text>
        <text x="158" y="50" font-size="10" fill="var(--ink)">C</text>
        <text x="214" y="50" font-size="10" fill="var(--ink)">D</text>
        <line x1="40" y1="24" x2="160" y2="24" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="100" y="20" font-size="9" text-anchor="middle" fill="var(--faint)">2 m</text>
        <line x1="160" y1="24" x2="220" y2="24" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="190" y="20" font-size="9" text-anchor="middle" fill="var(--faint)">1 m</text>
        <line x1="22" y1="60" x2="22" y2="150" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="18" y="108" font-size="9" text-anchor="end" fill="var(--faint)">1,5</text>
      </svg>
      </figure>
    pide: La fuerza en el puntal BC y las reacciones en la articulación A.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué dirección tiene la fuerza que el puntal $BC$ hace sobre la viga
          en $C$?
        opciones:
          - texto: La del propio puntal, de B hacia C, porque es una barra de dos fuerzas
            correcta: true
            mensaje: |
              Eso es. El puntal solo recibe fuerzas en sus dos extremos, así que
              trabaja a tracción o a compresión en su dirección: una sola
              incógnita, su módulo.
          - texto: Vertical, porque sostiene una carga vertical
            mensaje: |
              La carga es vertical, pero el puntal está inclinado y solo puede
              empujar a lo largo de sí mismo. Por eso aparece además una
              reacción horizontal en $A$.
          - texto: Desconocida, con dos componentes como cualquier articulación
            mensaje: |
              En la viga sí aparecerían dos componentes en $C$, pero el puntal
              es una barra de dos fuerzas y fija la dirección. Poner dos
              incógnitas donde hay una deja el problema con cinco incógnitas y
              tres ecuaciones.

      - tipo: calcular
        titulo: La fuerza en el puntal
        pregunta: |
          Tomando momentos en $A$ sobre la viga, ¿cuánto vale la fuerza en el
          puntal?
        respuesta:
          tipo: magnitud
          valor: '750 N'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '450 N'
            mensaje: |
              Esa es solo la componente vertical de la fuerza del puntal. El
              puntal está inclinado: su módulo es esa componente dividida
              entre el seno del ángulo con la horizontal, $0{,}6$.
          - valor: '562.5 N'
            mensaje: |
              Has dividido la componente vertical entre el coseno, $0{,}8$, en
              lugar de entre el seno. El ángulo con la horizontal tiene
              tangente $1{,}5/2$: seno $0{,}6$ y coseno $0{,}8$.
        pista: |
          El puntal mide $\sqrt{2^{2} + 1{,}5^{2}} = 2{,}5$ m. Su fuerza sobre la
          viga es $F\,(0{,}8;\ 0{,}6)$, y solo la componente vertical da momento
          en $A$.
        desarrollo: |
          $$
          \sum M_A = 0{,}6F \cdot 2 - 300 \cdot 3 = 0
          \;\Longrightarrow\; F = \frac{900}{1{,}2} = 750\ \text{N}
          $$

          Positiva con el sentido supuesto, de $B$ hacia $C$: el puntal empuja
          la viga, trabaja a compresión.

      - tipo: calcular
        titulo: La reacción vertical en A
        pregunta: |
          ¿Cuánto vale $A_y$, en newtons y con su signo, tomando positivo hacia
          arriba?
        respuesta:
          tipo: numero
          valor: '-150'
          tolerancia: 1
          formato: un número, en N, con su signo
        distractores:
          - valor: '150'
            mensaje: |
              El módulo está bien, pero el signo no. El puntal empuja hacia
              arriba con 450 N, más que la carga: la pared tiene que tirar de la
              viga hacia abajo para compensar.
          - valor: '-450'
            mensaje: |
              Te has dejado la carga de 300 N en la suma de fuerzas verticales:
              $A_y + 450 - 300 = 0$.
        pista: |
          $\sum F_y = 0$: $A_y + 0{,}6 \cdot 750 - 300 = 0$.
        desarrollo: |
          $$
          A_y = 300 - 450 = -150\ \text{N}
          \qquad
          A_x = -0{,}8 \cdot 750 = -600\ \text{N}
          $$

          Las dos negativas: la pared tira de la viga hacia abajo y hacia la
          izquierda.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'El puntal es de dos fuerzas: su fuerza sobre la viga va en la dirección de B a C, $F\,(0{,}8;\ 0{,}6)$.'
          - texto: $\sum M_A = 1{,}2F - 900 = 0$, así que $F = 750$ N, de compresión.
          - texto: $\sum F_x = 0$ da $A_x = -600$ N y $\sum F_y = 0$ da $A_y = -150$ N.
          - texto: La articulación A sostiene la carga, así que $A_y$ tiene que ser positiva.
            trampa: true
            mensaje: |
              Quien sostiene la carga es el puntal, que empuja hacia arriba con
              450 N, más que los 300 N de la carga. La pared solo corrige el
              exceso, tirando hacia abajo.
    resolucion: |
      **El puntal es de dos fuerzas.** Solo recibe fuerzas en $B$ y en $C$, así
      que trabaja en su propia dirección. Mide $\sqrt{2^{2} + 1{,}5^{2}} = 2{,}5$
      m, y su fuerza sobre la viga es $F\,(0{,}8;\ 0{,}6)$, suponiendo que
      empuja.

      **Momentos en A, sobre la viga.** Eliminan $A_x$ y $A_y$:

      $$
      0{,}6F \cdot 2 - 300 \cdot 3 = 0 \;\Longrightarrow\; F = 750\ \text{N}
      $$

      Positiva: el puntal empuja, a compresión.

      **Fuerzas.**

      $$
      A_x + 0{,}8 \cdot 750 = 0 \;\Longrightarrow\; A_x = -600\ \text{N}
      $$

      $$
      A_y + 0{,}6 \cdot 750 - 300 = 0 \;\Longrightarrow\; A_y = -150\ \text{N}
      $$

      Los signos negativos no son un error: el puntal empuja hacia arriba más
      de lo que pesa la carga, y la pared tira de la viga hacia abajo y hacia
      fuera para compensar.

  - id: ejma3-col31-los-dos-cables-del-nudo-c
    titulo: Dos cables que sostienen una carga en un nudo
    fuente: >-
      Ejercicio 3.1 · Tema 3, «Estática del sólido rígido» · Mecánica Aplicada,
      UPV/EHU, curso 2025-2026. La colección publica el resultado, contra el
      que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Se unen dos cables $AC$ y $BC$ en el punto $C$, tal y como muestra la
      figura. Calcular la fuerza sobre los cables $AC$ y $BC$.

      <figure>
      <svg viewBox="0 0 342 240" role="img" width="342" height="240" aria-labelledby="ejma3-col31-t ejma3-col31-d">
        <title id="ejma3-col31-t">Dos cables unidos en C, con una carga de 3 kN colgando</title>
        <desc id="ejma3-col31-d">El punto C cuelga de dos cables. A está 400 mm a la izquierda de C y 300 mm por encima; B está 525 mm a la derecha de C y 500 mm por encima. Los dos anclajes están fijos a una estructura escalonada. De C cuelga una carga de 3 kN.</desc>
        <path d="M60 101 L190 101 L190 57 L285 57" fill="none" stroke="var(--ink)" stroke-width="1.3"/>
        <path d="M68 101 L61 94 M82 101 L75 94 M96 101 L89 94 M110 101 L103 94 M124 101 L117 94 M138 101 L131 94 M152 101 L145 94 M166 101 L159 94 M180 101 L173 94 M196 57 L189 50 M210 57 L203 50 M224 57 L217 50 M238 57 L231 50 M252 57 L245 50 M266 57 L259 50 M280 57 L273 50" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="70" y1="101" x2="158" y2="167" stroke="var(--ink)" stroke-width="1.6"/>
        <line x1="273.5" y1="57" x2="158" y2="167" stroke="var(--ink)" stroke-width="1.6"/>
        <rect x="63" y="95" width="14" height="12" rx="2" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.1"/>
        <circle cx="70" cy="101" r="2" fill="var(--ink)"/>
        <rect x="266.5" y="51" width="14" height="12" rx="2" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.1"/>
        <circle cx="273.5" cy="57" r="2" fill="var(--ink)"/>
        <circle cx="158" cy="167" r="2.4" fill="var(--ink)"/>
        <rect x="148" y="170" width="20" height="17" rx="2" fill="var(--flag)" fill-opacity="0.2" stroke="var(--flag)" stroke-width="1.2"/>
        <text x="174" y="184" font-size="9.5" fill="var(--flag)">3 kN</text>
        <text x="80" y="98" font-size="10" fill="var(--ink)">A</text>
        <text x="262" y="55" font-size="10" text-anchor="end" fill="var(--ink)">B</text>
        <text x="148" y="163" font-size="10" text-anchor="end" fill="var(--ink)">C</text>
        <line x1="66" y1="101" x2="40" y2="101" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="150" y1="167" x2="40" y2="167" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="42" y1="101" x2="42" y2="167" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="38" y1="101" x2="46" y2="101" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="38" y1="167" x2="46" y2="167" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="36" y="137" font-size="9" text-anchor="end" fill="var(--faint)">300 mm</text>
        <line x1="278" y1="57" x2="302" y2="57" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="166" y1="167" x2="302" y2="167" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="300" y1="57" x2="300" y2="167" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="296" y1="57" x2="304" y2="57" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="296" y1="167" x2="304" y2="167" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="306" y="116" font-size="9" fill="var(--faint)">500 mm</text>
        <line x1="70" y1="109" x2="70" y2="214" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="158" y1="189" x2="158" y2="214" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="273.5" y1="65" x2="273.5" y2="214" stroke="var(--faint)" stroke-width="0.7" stroke-dasharray="3 3"/>
        <line x1="70" y1="210" x2="158" y2="210" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="158" y1="210" x2="273.5" y2="210" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="70" y1="206" x2="70" y2="214" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="158" y1="206" x2="158" y2="214" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="273.5" y1="206" x2="273.5" y2="214" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="114" y="226" font-size="9" text-anchor="middle" fill="var(--faint)">400 mm</text>
        <text x="215" y="226" font-size="9" text-anchor="middle" fill="var(--faint)">525 mm</text>
      </svg>
      <figcaption>

      El nudo **C** con los dos cables y la carga de **3 kN**. Las cotas fijan
      las dos direcciones: **AC** sube 300 mm en 400 mm, y **BC** sube 500 mm
      en 525 mm.

      </figcaption>
      </figure>
    pide: La tracción de cada uno de los dos cables.
    pasos:
      - tipo: reconocer
        pregunta: |
          En $C$ concurren las tres fuerzas. ¿Con qué ecuaciones se resuelve?
        opciones:
          - texto: Con las dos de fuerzas, porque el momento respecto de C es idénticamente nulo
            correcta: true
            mensaje: |
              Eso es. Al concurrir todas las fuerzas en $C$, la ecuación de
              momentos respecto de ese punto se cumple sola: dos ecuaciones y
              dos incógnitas.
          - texto: Con las dos de fuerzas y la de momentos, que da la tercera ecuación
            mensaje: |
              La de momentos respecto de $C$ es $0 = 0$: todas las fuerzas
              pasan por $C$ y ninguna tiene brazo. No aporta nada, y si la
              cuentas creerás que hay tres ecuaciones para dos incógnitas.
          - texto: No hacen falta ecuaciones, cada cable se lleva la mitad de la carga
            mensaje: |
              Solo sería así con los dos cables simétricos. Aquí tienen
              inclinaciones distintas, y el reparto lo deciden las dos
              direcciones, no el número de cables.
          - texto: Hay que suponer además que los cables pueden empujar en C
            mensaje: |
              Un cable solo tira. Aquí las dos tracciones salen positivas, que
              es la comprobación de que la hipótesis del dibujo era buena.

      - tipo: calcular
        titulo: La tracción del cable AC
        pregunta: |
          ¿Cuánto vale $T_{AC}$?
        respuesta:
          tipo: magnitud
          valor: '2.203 kN'
          tolerancia: 0.01
          formato: una fuerza, con su unidad
        distractores:
          - valor: '1.5 kN'
            mensaje: |
              Has repartido los 3 kN a partes iguales. Los dos cables no tienen
              la misma inclinación, así que no pueden llevar lo mismo: hay que
              resolver las dos ecuaciones.
          - valor: '2.434 kN'
            mensaje: |
              Ese es $T_{BC}$, el otro cable. $AC$ está más tumbado —sube 300 en
              400— y por eso necesita menos tracción para dar la misma
              componente vertical.
          - valor: '2.098 kN'
            mensaje: |
              Has cambiado el seno por el coseno en las dos direcciones. En $AC$,
              400 mm son horizontales y 300 verticales, así que el unitario es
              $(-0{,}8;\ 0{,}6)$ y no al revés.
        pista: |
          $AC$ mide $\sqrt{400^{2}+300^{2}} = 500$ mm y $BC$,
          $\sqrt{525^{2}+500^{2}} = 725$ mm. Escribe $\sum F_x = 0$ y
          $\sum F_y = 0$ con los unitarios.
        desarrollo: |
          $$
          \sum F_x = -0{,}8\,T_{AC} + 0{,}7241\,T_{BC} = 0
          \qquad
          \sum F_y = 0{,}6\,T_{AC} + 0{,}6897\,T_{BC} - 3 = 0
          $$

          De la primera, $T_{AC} = 0{,}9052\,T_{BC}$; sustituyendo,
          $T_{BC} = 2{,}434$ kN y $T_{AC} = 2{,}203$ kN.

      - tipo: calcular
        titulo: La tracción del cable BC
        pregunta: |
          ¿Cuánto vale $T_{BC}$?
        respuesta:
          tipo: magnitud
          valor: '2.434 kN'
          tolerancia: 0.01
          formato: una fuerza, con su unidad
        distractores:
          - valor: '2.203 kN'
            mensaje: |
              Ese es $T_{AC}$. El cable $BC$ está más empinado y, además, tiene
              que equilibrar la componente horizontal de $AC$: se lleva algo
              más.
          - valor: '3 kN'
            mensaje: |
              Los 3 kN son la carga entera, y la sostienen los dos cables entre
              los dos. Solo un cable vertical único llevaría los 3 kN.
        pista: |
          Con $T_{AC}$ ya calculado, $\sum F_x = 0$ da $T_{BC}$ en un paso.
        desarrollo: |
          $$
          T_{BC} = \frac{0{,}8 \cdot 2{,}203}{0{,}7241} = 2{,}434\ \text{kN}
          $$

          Comprobación con $\sum F_y$: $0{,}6 \cdot 2{,}203 + 0{,}6897 \cdot
          2{,}434 = 1{,}322 + 1{,}679 = 3{,}00$ kN.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'En C concurren tres fuerzas: la carga de 3 kN hacia abajo y la tracción de cada cable, en la dirección del cable.'
          - texto: $AC$ mide 500 mm y $BC$ 725 mm, así que los unitarios son $(-0{,}8;\ 0{,}6)$ y $(0{,}7241;\ 0{,}6897)$.
          - texto: $\sum F_x = 0$ y $\sum F_y = 0$ dan $T_{AC} = 2{,}20$ kN y $T_{BC} = 2{,}43$ kN.
          - texto: Como entre los dos cables sostienen la carga, sus módulos suman 3 kN.
            trampa: true
            mensaje: |
              Lo que suma 3 kN son las **componentes verticales**, 1,32 y 1,68.
              Los módulos suman 4,64 kN, y las componentes horizontales se
              cancelan entre sí. Sumar módulos de fuerzas con distinta
              dirección no significa nada.
    resolucion: |
      **Es equilibrio de un punto.** Las tres fuerzas concurren en $C$, así que
      la ecuación de momentos no aporta nada y quedan dos ecuaciones para dos
      incógnitas.

      **Las direcciones.** $AC$ recorre 400 mm en horizontal y 300 en vertical,
      luego mide 500 mm y su unitario, de $C$ hacia $A$, es
      $(-0{,}8;\ 0{,}6)$. $BC$ recorre 525 y 500, mide 725 mm y su unitario es
      $(0{,}7241;\ 0{,}6897)$.

      **Las ecuaciones.**

      $$
      -0{,}8\,T_{AC} + 0{,}7241\,T_{BC} = 0
      \qquad
      0{,}6\,T_{AC} + 0{,}6897\,T_{BC} = 3
      $$

      $$
      T_{AC} = 2{,}20\ \text{kN}
      \qquad
      T_{BC} = 2{,}43\ \text{kN}
      $$

      Las dos salen positivas, que es lo que hacía falta comprobar: un cable
      solo puede tirar. Coincide con el resultado de la colección.

  - id: ejma3-col32-el-muelle-y-los-dos-bloques
    titulo: Un muelle y dos cuerdas que sostienen una carga
    fuente: >-
      Ejercicio 3.2 · Tema 3, «Estática del sólido rígido» · Mecánica Aplicada,
