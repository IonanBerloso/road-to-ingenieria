    pide: Las reacciones en los apoyos A y E, en funcion de P.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué le transmite la polea a la barra $CDE$ en el punto $D$?
        opciones:
          - texto: >-
              Una fuerza de componentes P hacia la izquierda y P hacia abajo,
              aplicada en D y sin momento
            correcta: true
            mensaje: |
              Eso es. La tensión es la misma en los dos ramales, $P$, porque la
              polea no tiene rozamiento. Los dos tramos tiran de ella —uno
              horizontal hacia la barra $AB$ y otro vertical hacia abajo— y sus
              momentos respecto del eje se cancelan, así que al eje le llega la
              resultante y nada más.
          - texto: Solo la fuerza P vertical del peso que cuelga
            mensaje: |
              El ramal horizontal también tira de la polea, y con la misma
              tensión $P$. Si te dejas esa componente, la ecuación horizontal
              de $CDE$ pierde un término y las reacciones salen mal.
          - texto: Una fuerza y un momento, porque la cuerda envuelve la polea
            mensaje: |
              Los dos ramales dan momentos iguales y opuestos respecto del eje
              —cada uno vale la tensión por el radio—, así que el momento neto
              sobre la polea es nulo. Lo que sí importa del radio es **dónde**
              está cada ramal.

      - tipo: calcular
        titulo: La reacción horizontal en A
        pregunta: |
          ¿Cuánto vale el coeficiente de $A_x$, escrita como $A_x = c\,P$, con
          el eje $x$ positivo hacia la derecha?
        respuesta:
          tipo: numero
          valor: '-0.4375'
          tolerancia: 0.005
          formato: un número, coeficiente de P, con su signo
        distractores:
          - valor: '-0.5'
            mensaje: |
              Es el valor que imprime la colección, y sale de despreciar el
              radio de la polea. El enunciado lo da: $L/8$. La cuerda no pasa
              por $D$, sino tangente por arriba —a $L/2 + L/8$ del suelo— y el
              peso cuelga a $L + L/8$ del eje de $AB$.
          - valor: '0.4375'
            mensaje: |
              El módulo está bien y el signo no. La carga repartida y la cuerda
              empujan la estructura hacia la derecha, así que la articulación de
              $A$ tiene que tirar de ella hacia la izquierda.
        pista: |
          Tres ecuaciones para $ABC$ y tres para $CDE$, con la pareja de fuerzas
          opuestas en $C$. El par vale $PL$ en sentido horario.
        desarrollo: |
          Con $A$ en el origen, la resultante de la carga repartida es $P$ hacia
          la derecha a la altura $L/2$, y la cuerda tira de $AB$ con $P$ hacia
          la derecha a la altura $L/2 + L/8 = 5L/8$.

          Momentos en $C$ para $ABC$, más las dos ecuaciones de fuerzas de cada
          barra y el momento en $E$ para $CDE$, dan el sistema. Al resolverlo:

          $$
          A_x = -\frac{7}{16}P = -0{,}4375\,P
          $$

      - tipo: calcular
        titulo: La reacción vertical en A
        pregunta: |
          ¿Y el coeficiente de $A_y$, con el eje $y$ positivo hacia arriba?
        respuesta:
          tipo: numero
          valor: '-0.5625'
          tolerancia: 0.005
          formato: un número, coeficiente de P, con su signo
        distractores:
          - valor: '-0.5'
            mensaje: |
              Es el valor que imprime la colección, y sale de despreciar el
              radio $L/8$ que da el propio enunciado.
          - valor: '0.5625'
            mensaje: |
              El módulo está bien y el signo no. El apoyo $E$ empuja hacia
              arriba con más de lo que pesa la carga, así que en $A$ la
              estructura recibe una componente hacia abajo.
        pista: |
          $\sum F_y = 0$ del conjunto: solo hay la carga colgada $P$ y las dos
          reacciones verticales.
        desarrollo: |
          $$
          A_y + E_y - P = 0
          \;\Longrightarrow\; A_y = P - \frac{25}{16}P = -\frac{9}{16}P
          = -0{,}5625\,P
          $$

      - tipo: calcular
        titulo: La reacción vertical en E
        pregunta: |
          ¿Cuánto vale el coeficiente de $E_y$?
        respuesta:
          tipo: numero
          valor: '1.5625'
          tolerancia: 0.005
          formato: un número, coeficiente de P, con su signo
        distractores:
          - valor: '1.5'
            mensaje: |
              Es el valor que imprime la colección, y sale de despreciar el
              radio de la polea. Con el radio $L/8$ la cuerda cuelga a
              $L + L/8$ del eje de $AB$, y ese octavo de más cambia el momento.
          - valor: '-1.5625'
            mensaje: |
              El módulo está bien y el signo no. El apoyo $E$ sostiene la
              estructura: su reacción vertical va hacia arriba.
        pista: |
          Momentos en $A$ para el conjunto, con el par $PL$ horario, la
          resultante de $q_{0}$ a la altura $L/2$ y el peso colgando a
          $L + L/8$.
        desarrollo: |
          $$
          -P\,\frac{L}{2} - P\left(L + \frac{L}{8}\right) - PL
          + \frac{3L}{2}E_y - \frac{L}{2}E_x = 0
          $$

          Resolviendo el sistema completo:

          $$
          E_y = \frac{25}{16}P = 1{,}5625\,P
          \qquad
          E_x = -\frac{9}{16}P = -0{,}5625\,P
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La tensión de la cuerda es $P$ en los dos ramales, así que sobre
              la polea actúa una fuerza $(-P,\,-P)$ aplicada en su eje $D$.
          - texto: >-
              Sobre $AB$, la carga repartida da una resultante $P$ a la altura
              $L/2$ y la cuerda tira con $P$ a la altura $5L/8$.
          - texto: >-
              Con las dos barras y la pareja de fuerzas opuestas en $C$ salen
              $A_x = -7P/16$, $A_y = -9P/16$, $E_x = -9P/16$ y $E_y = 25P/16$.
          - texto: >-
              Como la polea es ideal, su radio no influye en el resultado y se
              puede tomar la cuerda pasando por $D$.
            trampa: true
            mensaje: |
              Que sea ideal significa que no hay rozamiento y que la tensión no
              cambia al pasarla, no que el radio no cuente. El radio decide
              **dónde** están las rectas de acción: la cuerda se ata a $AB$ a
              $5L/8$ y el peso cuelga a $L + L/8$. Despreciarlo es justo lo que
              produce el $P/2$ impreso.
    resolucion: |
      **La polea.** Sin rozamiento, la tensión es $P$ en los dos ramales. Los dos
      tiran de la polea: el horizontal hacia la izquierda y el vertical hacia
      abajo, y sus momentos respecto del eje se cancelan. A la barra $CDE$ le
      llega, en $D$, una fuerza de componentes $(-P,\,-P)$.

      **Dónde actúa cada cosa, que es lo que decide el resultado.** La cuerda es
      tangente a la polea, así que el ramal horizontal está a
      $L/2 + L/8 = 5L/8$ sobre $A$ y se ata ahí a la barra $AB$; y el ramal
      vertical cuelga en $x = L + L/8$. El radio $L/8$ es un dato del enunciado y
      cambia las dos rectas de acción.

      **Las ecuaciones.** Sobre $ABC$: la reacción de $A$, la resultante $P$ de
      la carga repartida a la altura $L/2$, la cuerda con $P$ a la altura
      $5L/8$, el par $PL$ horario y la fuerza de la articulación $C$. Sobre
      $CDE$: la opuesta en $C$, la $(-P,\,-P)$ en $D$ y la reacción de $E$.
      Resolviendo el sistema de seis ecuaciones:

      $$
      A_x = -\frac{7}{16}P
      \qquad
      A_y = -\frac{9}{16}P
      \qquad
      E_x = -\frac{9}{16}P
      \qquad
      E_y = \frac{25}{16}P
      $$

      **Lo que no cuadra.** La colección publica $P/2$, $P/2$, $P/2$ y $3P/2$,
      que es exactamente lo que sale al hacer pasar la cuerda por el eje $D$, o
      sea al despreciar el radio $L/8$. Con el radio en su sitio —como lo dibuja
      la propia figura, tangente por arriba— salen los dieciseisavos de arriba.
      Se publican estos y se dejan los impresos como distractores.

  - id: ejma3-col325-la-viga-apoyada-en-la-celosia
    titulo: La viga que descarga sobre una celosia inclinada
    fuente: >-
      Ejercicio 3.25 · Tema 3, «Estática del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo.
