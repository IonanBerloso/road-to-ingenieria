    pide: Las fuerzas en los elementos 1 y 2, diciendo si son de traccion o de compresion.
    pasos:
      - tipo: reconocer
        pregunta: |
          Se quiere cortar la cercha por una sección que deje al descubierto los
          elementos 1 y 2. ¿Por dónde y con qué criterio?
        opciones:
          - texto: >-
              Por las barras BD, CD y CE, que son tres y no concurren en un
              punto
            correcta: true
            mensaje: |
              Eso es. El método de las secciones necesita cortar exactamente
              tres barras no concurrentes: así las tres ecuaciones de la parte
              aislada bastan para despejarlas. $BD$ y $CE$ son horizontales y
              $CD$ las une.
          - texto: Por las tres barras que concurren en el nudo D
            mensaje: |
              Si las tres cortadas concurren en un punto, la ecuación de
              momentos en ese punto se anula sola y solo quedan dos ecuaciones
              útiles para tres incógnitas. Por eso el método pide tres barras
              **no** concurrentes.
          - texto: Por dos barras, BD y CD, que son las que se piden
            mensaje: |
              Con dos cortes la parte aislada no queda separada del resto: la
              cercha sigue unida por el cordón inferior. Hay que cortar la
              estructura entera en dos trozos.

      - tipo: calcular
        titulo: La reacción del apoyo simple
        pregunta: |
          Tomando momentos en $G$ para el conjunto, ¿cuánto vale la reacción
          en $C$?
        respuesta:
          tipo: magnitud
          valor: '2625 N'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '1250 N'
            mensaje: |
              Has repartido la carga total a medias entre los dos apoyos. No hay
              simetría: los 1000 N de $A$ cuelgan en voladizo, a 20 m por fuera
              del apoyo $C$, y eso descarga a $G$ y sobrecarga a $C$.
          - valor: '1125 N'
            mensaje: |
              Te has dejado los 1000 N de $A$. Es la carga mayor y además la de
              mayor brazo respecto de los apoyos.
        pista: |
          Con $A$ en el origen, $C$ está a 20 m, $G$ a 60 m, y las cargas de
          500 N en $x = 10$, 30 y 50 m.
        desarrollo: |
          Momentos en $C$, con $x$ medido desde $A$:

          $$
          \sum M_C = 1000 \cdot 20 + 500 \cdot 10 - 500 \cdot 10
          - 500 \cdot 30 + 40\,R_G = 0
          $$

          $$
          R_G = -125\ \text{N}
          \qquad
          R_C = 2500 - (-125) = 2625\ \text{N}
          $$

          $R_G$ sale negativa: en $G$ la cercha tira hacia abajo del apoyo.

      - tipo: calcular
        titulo: La fuerza en el elemento 1
        pregunta: |
          Cortando por $BD$, $CD$ y $CE$ y tomando momentos en $C$ para la parte
          izquierda, ¿cuánto vale la fuerza del elemento 1?
        respuesta:
          tipo: magnitud
          valor: '1443.37 N'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '1250 N'
            mensaje: |
              Has usado los 20 m del lado como brazo. El brazo de una barra
              horizontal respecto de $C$ es la **altura** de la cercha, que en
              un triángulo equilátero de 20 m vale
              $10\sqrt{3} = 17{,}32$ m.
          - valor: '288.68 N'
            mensaje: |
              Te has dejado los 1000 N de $A$, que respecto de $C$ tienen un
              brazo de 20 m y aportan la mayor parte del momento.
        pista: |
          En la parte izquierda quedan la carga de 1000 N en $A$, la de 500 N
          en $B$ y la reacción de $C$, que no da momento en $C$. La altura es
          $10\sqrt{3}$ m.
        desarrollo: |
          $$
          \sum M_C = 1000 \cdot 20 + 500 \cdot 10 - T_1 \cdot 10\sqrt{3} = 0
          $$

          $$
          T_1 = \frac{25000}{17{,}32} = 1443{,}37\ \text{N}
          $$

          Positiva con el sentido supuesto de tracción: el cordón superior tira,
          o sea trabaja a tracción.

      - tipo: calcular
        titulo: La fuerza en el elemento 2
        pregunta: |
          Con la misma sección, ¿cuánto vale la fuerza del elemento 2, en N y
          con su signo, tomando la tracción positiva?
        respuesta:
          tipo: numero
          valor: '-1299.03'
          tolerancia: 1
          formato: un número, en N, con su signo
        distractores:
          - valor: '1299.03'
            mensaje: |
              El módulo está bien y el signo no. La resultante vertical de la
              parte izquierda apunta hacia arriba, así que la diagonal tiene que
              empujar hacia abajo: trabaja a **compresión**.
          - valor: '-2250'
            mensaje: |
              Has proyectado con el seno de $30^{\circ}$. La diagonal $CD$ forma
              $60^{\circ}$ con la horizontal, así que su componente vertical es
              $\sin 60^{\circ} = 0{,}866$ veces su módulo.
        pista: |
          Equilibrio vertical de la parte izquierda: solo la diagonal $CD$ tiene
          componente vertical, porque $BD$ y $CE$ son horizontales.
        desarrollo: |
          $$
          \sum F_y = -1000 - 500 + 2625 + T_2 \sin 60^{\circ} = 0
          $$

          $$
          T_2 = \frac{-1125}{0{,}866} = -1299{,}03\ \text{N}
          $$

          Negativa: compresión, como publica la colección.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Momentos en $C$ para el conjunto dan $R_G = -125$ N, y de ahí
              $R_C = 2625$ N.
          - texto: >-
              Se corta por $BD$, $CD$ y $CE$, y momentos en $C$ de la parte
              izquierda dan $T_1 = 1443{,}37$ N a tracción.
          - texto: >-
              El equilibrio vertical de esa misma parte da
              $T_2 = -1299{,}03$ N, o sea compresión.
          - texto: >-
              Como en $G$ la reacción sale negativa, ahí hay que poner un
              contrapeso o la cercha vuelca.
            trampa: true
            mensaje: |
              Una reacción negativa solo dice que el apoyo tira hacia abajo en
              vez de empujar, y una articulación puede hacerlo perfectamente:
              está unida al suelo. Lo que no podría es un apoyo simple, que solo
              empuja.
    resolucion: |
      **La geometría.** Todos los triángulos son equiláteros de 20 m de lado, así
      que la altura de la cercha es $10\sqrt{3} = 17{,}32$ m y los nudos
      inferiores están en $x = 0$, 20, 40 y 60 m desde $A$.

      **Las reacciones.** Momentos en $C$, que está a 20 m de $A$:

      $$
      1000 \cdot 20 + 500 \cdot 10 - 500 \cdot 10 - 500 \cdot 30 + 40\,R_G = 0
      \;\Longrightarrow\; R_G = -125\ \text{N}
      $$

      $$
      R_C = 2500 + 125 = 2625\ \text{N}
      $$

      **La sección.** Se corta por $BD$ (elemento 1), $CD$ (elemento 2) y $CE$:
      tres barras no concurrentes. Momentos en $C$ de la parte izquierda, donde
      $CD$ y $CE$ pasan por el punto y no dan momento:

      $$
      1000 \cdot 20 + 500 \cdot 10 = T_1 \cdot 10\sqrt{3}
      \;\Longrightarrow\; T_1 = 1443{,}37\ \text{N}\ (t)
      $$

      Y el equilibrio vertical de esa parte, donde solo $CD$ tiene componente
      vertical:

      $$
      -1000 - 500 + 2625 + T_2 \sin 60^{\circ} = 0
      \;\Longrightarrow\; T_2 = -1299{,}03\ \text{N}\ (c)
      $$

      Los dos coinciden con lo publicado, incluido el signo de $R_G$.

