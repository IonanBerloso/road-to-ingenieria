    pide: Las fuerzas en las barras CD, CE y EF.
    pasos:
      - tipo: reconocer
        pregunta: |
          Mirando la sección que corta $CD$, $CE$ y $EF$: ¿qué se puede
          anticipar de la diagonal $CE$ antes de calcular nada?
        opciones:
          - texto: >-
              Que solo ella puede equilibrar la resultante vertical de la parte
              cortada, así que su valor lo fija esa resultante
            correcta: true
            mensaje: |
              Eso es. $CD$ y $EF$ son horizontales, así que la única componente
              vertical de la sección es la de la diagonal. Si la resultante
              vertical de la parte aislada resulta ser nula, la diagonal también
              lo es, y aquí pasa justo eso.
          - texto: Que vale cero porque une dos nudos cargados
            mensaje: |
              Que un nudo esté cargado no dice nada del esfuerzo de sus barras.
              Lo que hace nula esta diagonal es que la resultante vertical de la
              parte cortada sea cero, y eso hay que comprobarlo con las
              reacciones.
          - texto: Que carga con las dos toneladas del nudo C entero
            mensaje: |
              En el nudo $C$ concurren además la vertical $CF$ y el cordón
              superior. La carga de $C$ se la lleva la barra vertical que tiene
              justo debajo, no la diagonal.

      - tipo: calcular
        titulo: La reacción del apoyo simple
        pregunta: |
          Tomando momentos en $A$ para el conjunto, ¿cuánto vale la reacción
          vertical en $B$?
        respuesta:
          tipo: magnitud
          valor: '6 kN'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '5 kN'
            mensaje: |
              Te has dejado el momento de la carga horizontal de 2 kN. Está
              aplicada 9 m por encima de $A$, así que aporta
              $18\ \text{kN}\cdot\text{m}$, tanto como una carga vertical de
              6 kN a 3 m.
          - valor: '4 kN'
            mensaje: |
              Ese es el valor de $A_y$, la otra reacción vertical. Las dos
              suman los 10 kN de las cinco cargas verticales, pero no se
              reparten a medias porque la carga horizontal descarga un lado.
        pista: |
          $\sum M_A = 0$. Las cinco cargas verticales están a 3, 6, 9, 12 y 15 m
          de $A$; la horizontal, a 9 m de altura, y $B$ a 18 m.
        desarrollo: |
          $$
          18\,B_y - 2\,(3 + 6 + 9 + 12 + 15) - 2 \cdot 9 = 0
          $$

          $$
          18\,B_y = 90 + 18 \;\Longrightarrow\; B_y = 6\ \text{kN}
          $$

          Y entonces $A_y = 10 - 6 = 4$ kN y $A_x = -2$ kN.

      - tipo: calcular
        titulo: La diagonal CE
        pregunta: |
          ¿Cuánto vale la fuerza en $CE$, en kN y con su signo, con la tracción
          positiva?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.02
          formato: un número, en kN, con su signo
        distractores:
          - valor: '2'
            mensaje: |
              Has cargado la diagonal con la carga del nudo. La resultante
              vertical de la parte izquierda es $4 - 2 - 2 = 0$, y como la
              diagonal es la única barra cortada con componente vertical, tiene
              que ser nula.
          - valor: '-2.83'
            mensaje: |
              Has repartido $2\sqrt{2}$ como si la diagonal tuviera que
              equilibrar una carga de 2 kN. La cuenta correcta es la de la
              resultante vertical de la parte cortada, y esa vale cero.
        pista: |
          En la parte izquierda de la sección quedan $A_y = 4$ kN hacia arriba y
          dos cargas de 2 kN hacia abajo.
        desarrollo: |
          $$
          \sum F_y = 4 - 2 - 2 - \frac{T_{CE}}{\sqrt{2}} = 0
          \;\Longrightarrow\; T_{CE} = 0
          $$

          Es una barra de esfuerzo nulo **en este estado de carga**: si las
          cargas cambian deja de serlo.

      - tipo: calcular
        titulo: El cordón superior CD
        pregunta: |
          Tomando momentos en $E$ para la parte izquierda, ¿cuánto vale la
          fuerza en $CD$, en kN y con su signo?
        respuesta:
          tipo: numero
          valor: '-12'
          tolerancia: 0.05
          formato: un número, en kN, con su signo
        distractores:
          - valor: '12'
            mensaje: |
              El módulo está bien y el signo no. El cordón superior de una viga
              apoyada trabaja a **compresión**: se acorta cuando la viga flecta
              hacia abajo.
          - valor: '-9'
            mensaje: |
              Te has dejado la carga horizontal de 2 kN, que además de cambiar
              las reacciones aporta su propio momento respecto de $E$: está 3 m
              por encima de la línea del cordón inferior.
        pista: |
          Momentos en $E$ eliminan $CE$ —que pasa por $E$— y $EF$ —cuya recta
          pasa por $E$—. Queda $CD$, con brazo 3 m.
        desarrollo: |
          Con $E$ en $(9;\ 6)$ y el origen en $A$:

          $$
          \sum M_E = -48 - 6 + 12 + 6 - 3\,T_{CD} = 0
          \;\Longrightarrow\; T_{CD} = -12\ \text{kN}
          $$

          Compresión, como publica la colección.

      - tipo: calcular
        titulo: El cordón inferior EF
        pregunta: |
          Y con el equilibrio horizontal de esa misma parte, ¿cuánto vale la
          fuerza en $EF$?
        respuesta:
          tipo: numero
          valor: '12'
          tolerancia: 0.05
          formato: un número, en kN, con su signo
        distractores:
          - valor: '-12'
            mensaje: |
              El módulo está bien y el signo no. El cordón inferior hace la
              pareja del superior: si arriba hay compresión, abajo hay
              tracción.
          - valor: '14'
            mensaje: |
              Has sumado la carga horizontal de 2 kN en vez de compensarla con
              $A_x$. La reacción horizontal de $A$ vale $-2$ kN y las dos se
              cancelan en $\sum F_x$ de la parte izquierda.
        pista: |
          $\sum F_x = 0$ en la parte izquierda, con $T_{CE} = 0$ y
          $A_x = -2$ kN.
        desarrollo: |
          $$
          -2 + 2 + T_{CD} + \frac{T_{CE}}{\sqrt{2}} + T_{EF} = 0
          $$

          $$
          T_{EF} = -T_{CD} = 12\ \text{kN}\ (t)
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Momentos en $A$ dan $B_y = 6$ kN, y de ahí $A_y = 4$ kN y
              $A_x = -2$ kN.
          - texto: >-
              La resultante vertical de la parte izquierda de la sección es
              $4 - 2 - 2 = 0$, así que la diagonal $CE$ no trabaja.
          - texto: >-
              Momentos en $E$ dan $T_{CD} = -12$ kN, y el equilibrio horizontal,
              $T_{EF} = +12$ kN.
          - texto: >-
              Como $CE$ vale cero, se puede quitar de la estructura sin que pase
              nada.
            trampa: true
            mensaje: |
              Vale cero **para estas cargas**. Quitarla cambia la estructura:
              con otro reparto de cargas —o simplemente con el viento— esa
              diagonal trabaja, y sin ella el panel se convertiría en un
              mecanismo.
    resolucion: |
      **Las reacciones.** El apoyo $A$ es una articulación y $B$ un apoyo simple.
      Momentos en $A$, contando también el momento de la carga horizontal, que
      está a 9 m de altura:

      $$
      18\,B_y = 2\,(3+6+9+12+15) + 2 \cdot 9 = 108
      \;\Longrightarrow\; B_y = 6\ \text{kN}
      $$

      $$
      A_y = 10 - 6 = 4\ \text{kN} \qquad A_x = -2\ \text{kN}
      $$

      **La sección.** Se corta el panel central por $CD$, $CE$ y $EF$ y se aísla
      la parte izquierda, donde quedan $A$, las dos primeras cargas verticales y
      la horizontal.

      $$
      \sum F_y = 4 - 2 - 2 - \frac{T_{CE}}{\sqrt{2}} = 0
      \;\Longrightarrow\; T_{CE} = 0
      $$

      $$
      \sum M_E = 0 \;\Longrightarrow\; T_{CD} = -12\ \text{kN}\ (c)
      $$

      $$
      \sum F_x = 0 \;\Longrightarrow\; T_{EF} = +12\ \text{kN}\ (t)
      $$

      Los tres coinciden con lo publicado. Conviene quedarse con el patrón: en
      una celosía de cordones paralelos, el momento se lo reparten los dos
      cordones —uno a tracción y otro a compresión, iguales y opuestos— y el
      cortante se lo lleva entero la diagonal.

  - id: ejma3-col322-la-estructura-articulada-de-once-barras
    titulo: Las barras de la estructura articulada con cargas P y 2P
    fuente: >-
      Ejercicio 3.22 · Tema 3, «Estática del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica los resultados;
      el de la barra 6 no cuadra con el equilibrio del nudo y aquí se publica el
      que dan los datos, con el impreso señalado como distractor.
