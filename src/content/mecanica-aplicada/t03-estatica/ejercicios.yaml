    pide: Las fuerzas en las barras GH, FH y EF y en las barras BC y CD.
    pasos:
      - tipo: reconocer
        pregunta: |
          La nota de la colección dice que hay que separar la viga $AB$ de la
          celosía «por sus efectos en forma de cargas puntuales sobre $B$ y
          $G$». ¿Por qué la barra que va a $G$ solo aporta una fuerza vertical?
        opciones:
          - texto: >-
              Porque es una barra biarticulada y sin masa: es un sólido de dos
              fuerzas y trabaja en su propia dirección, que aquí es vertical
            correcta: true
            mensaje: |
              Eso es. Una barra articulada en sus dos extremos y sin carga entre
              ellos solo puede tener fuerzas iguales y opuestas en la recta que
              los une. Como está dibujada vertical, su fuerza es vertical: una
              sola incógnita en vez de dos.
          - texto: Porque el peso de la viga es vertical
            mensaje: |
              La dirección de la carga no fija la de una reacción. Lo que fija
              la dirección aquí es que la barra sea de dos fuerzas: si estuviera
              inclinada, su fuerza sería inclinada aunque la carga siguiera
              siendo vertical.
          - texto: Porque en G la celosía solo puede empujar hacia arriba
            mensaje: |
              Una barra biarticulada puede tirar o empujar, a tracción o a
              compresión; no está limitada a un sentido. Lo que la limita es la
              **dirección**, la de la recta que une sus dos articulaciones.

      - tipo: calcular
        titulo: Lo que la viga descarga en cada punto
        pregunta: |
          La carga repartida vale 10 N/m sobre los 2 m centrales de la viga, que
          mide 6 m. ¿Qué fuerza recibe el nudo $G$ a través de la barra
          vertical?
        respuesta:
          tipo: magnitud
          valor: '10 N'
          tolerancia: 0.02
          formato: una fuerza, con su unidad
        distractores:
          - valor: '20 N'
            mensaje: |
              Esa es la resultante entera de la carga repartida,
              $10 \cdot 2 = 20$ N. La viga la reparte entre sus dos apoyos, y
              como la carga está centrada, a partes iguales.
          - valor: '13.33 N'
            mensaje: |
              Has puesto la resultante en un punto que no es el suyo. La carga
              ocupa los 2 m centrales, así que su resultante cae en el centro de
              la viga, a 3 m de cada extremo.
        pista: |
          La viga es un sólido con dos apoyos: la barra vertical en $A$ y la
          articulación en $B$. La resultante, 20 N, está centrada.
        desarrollo: |
          $$
          R = 10 \cdot 2 = 20\ \text{N}\ \text{en el centro de la viga}
          $$

          $$
          \sum M_B = 0 \;\Longrightarrow\; F_A \cdot 6 = 20 \cdot 3
          \;\Longrightarrow\; F_A = 10\ \text{N}
          $$

          Y por simetría $F_B = 10$ N. La celosía recibe, pues, 10 N hacia abajo
          en $G$ y otros 10 N hacia abajo en $B$.

      - tipo: calcular
        titulo: El cordón superior GH
        pregunta: |
          ¿Cuánto vale la fuerza en $GH$, en N y con su signo, con la tracción
          positiva?
        respuesta:
          tipo: numero
          valor: '-15'
          tolerancia: 0.05
          formato: un número, en N, con su signo
        distractores:
          - valor: '15'
            mensaje: |
              El módulo está bien y el signo no. El cordón superior de esta
              celosía trabaja a compresión: la carga tiende a acortarlo.
          - valor: '-8.66'
            mensaje: |
              Ese es el valor de $FH$ y de $EF$, las otras dos barras del
              apartado. $GH$ va por el cordón inclinado y le toca un valor
              distinto.
        pista: |
          Primero las reacciones del conjunto: momentos en $O$ con las dos
          cargas de 10 N, en $G$ y en $B$, y la reacción vertical de $C$.
        desarrollo: |
          Con $O$ en el origen y la celosía a $30^{\circ}$, los nudos caen en
          $G(3;\ \sqrt{3})$, $H(6;\ 2\sqrt{3})$, $B(9;\ 3\sqrt{3})$,
          $C(12;\ 4\sqrt{3})$, $F(4;\ 0)$ y $E(8;\ 0)$.

          $$
          \sum M_O = 12\,R_C - 10 \cdot 3 - 10 \cdot 9 = 0
          \;\Longrightarrow\; R_C = 10\ \text{N}
          $$

          $$
          O_y = 20 - 10 = 10\ \text{N} \qquad O_x = 0
          $$

          Nudo a nudo desde $O$ sale $T_{GH} = -15$ N, de compresión.

      - tipo: calcular
        titulo: El cordón inferior EF
        pregunta: |
          ¿Y la fuerza en $EF$?
        respuesta:
          tipo: numero
          valor: '8.66'
          tolerancia: 0.05
          formato: un número, en N, con su signo
        distractores:
          - valor: '-8.66'
            mensaje: |
              El módulo está bien y el signo no. El cordón inferior es el que se
              estira: trabaja a tracción, $5\sqrt{3}$ N.
          - valor: '15'
            mensaje: |
              Ese es el módulo de $GH$, la barra del cordón superior. $EF$ es
              horizontal y le corresponde $5\sqrt{3} = 8{,}66$ N.
        pista: |
          $EF$ y $FH$ valen lo mismo, $5\sqrt{3}$ N, las dos a tracción.
        desarrollo: |
          $$
          T_{EF} = T_{FH} = 5\sqrt{3} = 8{,}66\ \text{N}\ (t)
          $$

          Coinciden con los $5\sqrt{3}$ que publica la colección para las dos.

      - tipo: calcular
        titulo: La barra CD
        pregunta: |
          En el apartado b, ¿cuánto vale la fuerza en $CD$?
        respuesta:
          tipo: numero
          valor: '17.32'
          tolerancia: 0.05
          formato: un número, en N, con su signo
        distractores:
          - valor: '-17.32'
            mensaje: |
              El módulo está bien y el signo no. En el nudo $C$ solo hay dos
              barras y una reacción vertical hacia arriba: $CD$ tiene que tirar
              hacia abajo del nudo, o sea trabajar a tracción.
          - valor: '-10'
            mensaje: |
              Ese es el valor de $BC$, la otra barra del nudo. $CD$ y $BC$ son
              perpendiculares entre sí y sus valores no coinciden.
        pista: |
          Aísla el nudo $C$: solo concurren $BC$ —a lo largo del cordón, a
          $30^{\circ}$— y $CD$, con la reacción vertical de 10 N.
        desarrollo: |
          En el nudo $C$, con $BC$ a $30^{\circ}$ y $CD$ perpendicular a ella:

          $$
          T_{BC} = -10\ \text{N}\ (c)
          \qquad
          T_{CD} = 10\sqrt{3} = 17{,}32\ \text{N}\ (t)
          $$

          Los dos coinciden con lo publicado.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La viga se separa de la celosía: como la carga está centrada, deja
              10 N sobre $G$ y 10 N sobre $B$.
          - texto: >-
              Con esas dos cargas, momentos en $O$ dan $R_C = 10$ N vertical, y
              las fuerzas, $O_y = 10$ N y $O_x = 0$.
          - texto: >-
              Nudo a nudo salen $T_{GH} = -15$ N, $T_{FH} = T_{EF} = 5\sqrt{3}$ N
              y, en el nudo $C$, $T_{BC} = -10$ N y $T_{CD} = 10\sqrt{3}$ N.
          - texto: >-
              La barra vertical que une la viga con $G$ está a tracción, porque
              la viga tira de ella hacia arriba.
            trampa: true
            mensaje: |
              Al revés: la viga se apoya en ella y la aplasta. La barra recibe
              10 N hacia abajo por arriba y otros 10 hacia arriba desde $G$:
              trabaja a **compresión**, y sobre el nudo $G$ empuja hacia abajo.
    resolucion: |
      **La viga, aparte.** La carga repartida de 10 N/m ocupa los 2 m centrales
      de una viga de 6 m: su resultante, 20 N, cae en el centro. La viga se
      sostiene en dos puntos —la barra biarticulada vertical en $A$ y la
      articulación en $B$—, así que cada uno se lleva 10 N. Sobre la celosía
      quedan **10 N hacia abajo en $G$ y 10 N hacia abajo en $B$**.

      **La geometría.** El cordón superior sube a $30^{\circ}$ desde $O$ y los
      triángulos son equiláteros o rectángulos, así que
      $G(3;\ \sqrt{3})$, $H(6;\ 2\sqrt{3})$, $B(9;\ 3\sqrt{3})$,
      $C(12;\ 4\sqrt{3})$, con $F(4;\ 0)$ y $E(8;\ 0)$ en el cordón inferior.

      **Las reacciones.**

      $$
      \sum M_O = 12\,R_C - 10 \cdot 3 - 10 \cdot 9 = 0
      \;\Longrightarrow\; R_C = 10\ \text{N}
      \qquad O_y = 10\ \text{N},\quad O_x = 0
      $$

      **Los esfuerzos.** Recorriendo los nudos:

      $$
      T_{GH} = -15\ \text{N}\ (c)
      \qquad
      T_{FH} = T_{EF} = 5\sqrt{3}\ \text{N}\ (t)
      $$

      $$
      T_{BC} = -10\ \text{N}\ (c)
      \qquad
      T_{CD} = 10\sqrt{3}\ \text{N}\ (t)
      $$

      Los cinco coinciden con los publicados. Y hay una comprobación que sale
      gratis: con $R_C$ vertical de 10 N, los momentos del conjunto respecto de
      $O$ cierran exactamente —$12 \cdot 10 = 10 \cdot 3 + 10 \cdot 9$—, lo que
      confirma de paso que el apoyo de $C$ es simple y su reacción, vertical.
  - id: ejma3-col326-el-entramado-con-la-barra-diagonal
    titulo: El entramado con la barra diagonal biarticulada
    fuente: >-
      Ejercicio 3.26 · Tema 3, «Estática del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo.
