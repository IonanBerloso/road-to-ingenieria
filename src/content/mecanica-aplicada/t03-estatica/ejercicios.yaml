      </svg>
      <figcaption>

      El nudo **A** recibe cuatro fuerzas: el muelle que sube a **B**, las dos
      cuerdas que van a las poleas **C** y **D**, y la carga de **400 N**. Cada
      cuerda pasa por su polea y termina en un bloque, así que su tracción es
      el peso de ese bloque.

      </figcaption>
      </figure>
    pide: El peso W y la longitud sin deformar del resorte.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuánto vale la tracción de la cuerda que va de $A$ a la polea $C$?
        opciones:
          - texto: 3W, el peso del bloque que cuelga al otro lado de esa polea
            correcta: true
            mensaje: |
              Eso es. La polea no tiene rozamiento y solo cambia la dirección
              de la cuerda: la tracción es la misma en los dos ramales, y el
              ramal vertical sostiene el bloque de peso $3W$.
          - texto: W, porque las dos cuerdas salen del mismo nudo y tiran igual
            mensaje: |
              Salir del mismo nudo no iguala las tracciones. Cada cuerda tiene
              su propio bloque al otro lado de su polea, y son distintos: $3W$
              y $W$.
          - texto: 3W multiplicado por el coseno del ángulo de la cuerda con la vertical
            mensaje: |
              Esa es la **componente** vertical de la tracción en $A$, no la
              tracción. El módulo es $3W$; las componentes salen después, al
              proyectar sobre los ejes.
          - texto: 400 N menos el peso del bloque, porque la carga se reparte
            mensaje: |
              La carga de 400 N cuelga de $A$, no de la cuerda. Lo que fija la
              tracción de esa cuerda es únicamente el bloque que hay al otro
              lado de la polea.

      - tipo: calcular
        titulo: El peso W
        pregunta: |
          Escribiendo el equilibrio del nudo $A$, ¿cuánto vale $W$?
        respuesta:
          tipo: magnitud
          valor: '62.84 N'
          tolerancia: 0.01
          formato: un peso, con su unidad
        distractores:
          - valor: '100 N'
            mensaje: |
              Has hecho $3W + W = 400$, como si las cuatro fuerzas fueran
              verticales. Las dos cuerdas y el muelle están inclinados, y solo
              cuentan sus componentes verticales.
          - valor: '188.3 N'
            mensaje: |
              Has escrito $\sum F_y = 0$ olvidándote del muelle, que aporta la
              mayor parte de la componente vertical: su fuerza sale de
              $\sum F_x = 0$ y vale 282 N.
        pista: |
          $AC$ mide 600 mm, y $AD$ y $AB$ miden los dos 1110 mm. Los unitarios
          desde $A$ son $(-0{,}8;\ 0{,}6)$, $(0{,}946;\ 0{,}324)$ y
          $(0{,}324;\ 0{,}946)$.
        desarrollo: |
          $$
          \sum F_x = -0{,}8 \cdot 3W + 0{,}946\,W + 0{,}324\,F = 0
          \;\Longrightarrow\; F = 4{,}483\,W
          $$

          $$
          \sum F_y = 0{,}6 \cdot 3W + 0{,}324\,W + 0{,}946\,F - 400 = 0
          \;\Longrightarrow\; 6{,}365\,W = 400
          $$

          $W = 62{,}84$ N, y la fuerza del muelle $F = 281{,}7$ N.

      - tipo: calcular
        titulo: La longitud sin deformar del resorte
        pregunta: |
          ¿Cuánto vale $L_0$?
        respuesta:
          tipo: magnitud
          valor: '757.8 mm'
          tolerancia: 0.01
          formato: una longitud, con su unidad
        distractores:
          - valor: '1110 mm'
            mensaje: |
              Esa es la longitud del muelle **montado**, la distancia $AB$. La
              longitud en reposo es menor: hay que restarle el alargamiento que
              produce la fuerza de 282 N.
          - valor: '1462 mm'
            mensaje: |
              Has sumado el alargamiento en vez de restarlo. El muelle está
              estirado, así que en reposo es más corto que los 1110 mm que mide
              montado.
          - valor: '352 mm'
            mensaje: |
              Eso es el alargamiento, $F/k = 281{,}7/800$ en metros. La
              pregunta es la longitud en reposo, que es la de montaje menos el
              alargamiento.
        pista: |
          $L_{AB} = \sqrt{360^{2} + 1050^{2}} = 1110$ mm, y el alargamiento es
          $F/k$ con $k = 800$ N/m, o sea 0,8 N/mm.
        desarrollo: |
          $$
          \Delta L = \frac{F}{k} = \frac{281{,}7}{800} = 0{,}352\ \text{m}
          $$

          $$
          L_0 = 1110 - 352 = 758\ \text{mm}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: Cada cuerda pasa por su polea sin rozamiento, así que tira de $A$ con el peso de su bloque, $3W$ y $W$.
          - texto: 'Las direcciones desde A: $(-0{,}8;\ 0{,}6)$ hacia C, $(0{,}946;\ 0{,}324)$ hacia D y $(0{,}324;\ 0{,}946)$ hacia B.'
          - texto: $\sum F_x = 0$ da $F = 4{,}483\,W$ y $\sum F_y = 0$ da $W = 62{,}8$ N, con $F = 282$ N.
          - texto: Como el muelle es real, su fuerza es $k$ por su longitud montada, $0{,}8 \cdot 1110 = 888$ N.
            trampa: true
            mensaje: |
              Un muelle no tira de su longitud, sino de lo que se ha estirado
              respecto de la longitud sin deformar: $F = k\,(L - L_0)$. Por eso
              se pregunta $L_0$: es la longitud en la que el muelle no hace
              nada.
    resolucion: |
      **Las cuatro fuerzas del nudo A.** La carga de 400 N hacia abajo, las
      tracciones de las dos cuerdas —que valen $3W$ y $W$, porque cada polea
      solo cambia la dirección— y la fuerza del muelle en la dirección $AB$.

      **La geometría.** Con $B$ en el origen, $C(-840, -690)$, $D(690, -690)$ y
      $A(-360, -1050)$, en milímetros. Desde $A$: hacia $C$ hay $(-480, 360)$,
      600 mm; hacia $D$, $(1050, 360)$, 1110 mm; hacia $B$, $(360, 1050)$, otros
      1110 mm.

      **Las dos ecuaciones.**

      $$
      -2{,}4\,W + 0{,}946\,W + 0{,}324\,F = 0
      \qquad
      1{,}8\,W + 0{,}324\,W + 0{,}946\,F = 400
      $$

      De la primera, $F = 4{,}483\,W$; sustituyendo, $6{,}365\,W = 400$ y
      $W = 62{,}8$ N. Con eso, $F = 281{,}7$ N.

      **El resorte.** Está montado con 1110 mm y estirado
      $\Delta L = F/k = 0{,}352$ m, así que

      $$
      L_0 = 1110 - 352 = 758\ \text{mm}
      $$

      Los dos coinciden con el resultado de la colección.

