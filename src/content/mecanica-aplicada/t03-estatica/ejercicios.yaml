    pide: La fuerza del cable y las reacciones de los dos rodillos.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué reacción mete cada rodillo en el diagrama del sólido libre?
        opciones:
          - texto: Una fuerza horizontal, normal a la cara de la columna sobre la que apoya
            correcta: true
            mensaje: |
              Eso es. La nota de la colección lo subraya: al ser rodillos sin
              fricción no hay componente tangencial, solo la normal, y la
              columna es vertical, así que las dos reacciones son horizontales.
          - texto: Dos componentes, una normal y otra tangencial, como cualquier contacto
            mensaje: |
              La componente tangencial es rozamiento, y el enunciado dice
              «rodillos sin fricción». Con ella el problema tendría cinco
              incógnitas y tres ecuaciones.
          - texto: Una fuerza vertical, porque sostienen el peso de la ménsula
            mensaje: |
              La normal es perpendicular a la superficie de contacto, y la cara
              de la columna es vertical: la normal es horizontal. Lo vertical
              lo sostiene el cable.
          - texto: Dos componentes y un momento, porque la ménsula no puede girar
            mensaje: |
              El momento es de un empotramiento. Aquí lo que impide girar es la
              **pareja** de rodillos separados 90 mm, no un momento en cada uno.

      - tipo: calcular
        titulo: La fuerza del cable
        pregunta: |
          ¿Cuánto vale la tracción $T$ del cable?
        respuesta:
          tipo: magnitud
          valor: '600 N'
          tolerancia: 0.01
          formato: una fuerza, con su unidad
        distractores:
          - valor: '300 N'
            mensaje: |
              Has repartido la carga entre el cable y los rodillos. Los
              rodillos no dan nada vertical —su reacción es horizontal—, así
              que el cable se lleva los 600 N enteros.
          - valor: '4000 N'
            mensaje: |
              Esa es la reacción de cada rodillo, que sale de los momentos. La
              del cable sale de $\sum F_y = 0$ y es mucho menor.
        pista: |
          Escribe $\sum F_y = 0$. Las dos reacciones son horizontales, así que
          no aparecen en esa ecuación.
        desarrollo: |
          $$
          \sum F_y = T - 600 = 0 \;\Longrightarrow\; T = 600\ \text{N}
          $$

      - tipo: calcular
        titulo: La reacción de los rodillos
        pregunta: |
          Tomando momentos en $C$, ¿cuánto vale la reacción en $A$?
        respuesta:
          tipo: magnitud
          valor: '4000 N'
          tolerancia: 0.01
          formato: una fuerza, con su unidad
        distractores:
          - valor: '3166.7 N'
            mensaje: |
              Has usado 475 mm como brazo de la carga. El brazo se mide hasta
              el punto donde tomas momentos, $C$, y hay 475 + 75 + 50 = 600 mm.
          - valor: '3666.7 N'
            mensaje: |
              Has llegado hasta $B$, 550 mm, en vez de hasta $C$. Si tomas
              momentos en $C$ es porque ahí se cortan el cable y la reacción de
              $B$, y entonces el brazo de la carga es 600 mm.
          - valor: '600 N'
            mensaje: |
              Esa es la fuerza del cable. Los rodillos están muy juntos —90 mm—
              y por eso su pareja de fuerzas tiene que ser mucho mayor que la
              carga.
        pista: |
          En $C$ concurren el cable y la reacción de $B$, que está al mismo
          nivel: solo quedan la carga y la reacción de $A$.
        desarrollo: |
          $$
          \sum M_C = 600 \cdot 600 - A \cdot 90 = 0
          \;\Longrightarrow\; A = 4000\ \text{N}
          $$

          Y $\sum F_x = 0$ da $B = 4000$ N en sentido contrario: $A$ empuja la
          ménsula hacia la izquierda y $B$ hacia la derecha.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: Los rodillos sin fricción dan reacciones normales a la columna, o sea horizontales.
          - texto: $\sum F_y = 0$ deja el cable solo frente a la carga, y $T = 600$ N.
          - texto: 'Momentos en C: la carga tiene brazo 600 mm y la reacción de A, 90 mm, así que $A = B = 4000$ N.'
          - texto: Como los rodillos sostienen la ménsula, entre A y B se reparten los 600 N verticales.
            trampa: true
            mensaje: |
              Un rodillo sin fricción sobre una cara vertical no puede dar
              nada vertical: su reacción es horizontal. Lo vertical lo sostiene
              entero el cable, y los rodillos forman una pareja de fuerzas
              horizontales que impide el giro.
    resolucion: |
      **Las tres incógnitas.** La tracción del cable, vertical, y las dos
      reacciones de los rodillos, horizontales porque no hay fricción —lo dice
      el enunciado y lo subraya la nota de la colección—.

      **Fuerzas verticales.** Solo están la carga y el cable:

      $$
      T = 600\ \text{N}
      $$

      **Momentos en C.** En $C$ concurren el cable y la reacción de $B$, que
      está a su misma altura, así que los dos desaparecen:

      $$
      600 \cdot 600 = A \cdot 90 \;\Longrightarrow\; A = 4000\ \text{N}
      $$

      **Fuerzas horizontales.** $B = A = 4000$ N, en sentido contrario.

      Las dos reacciones son casi siete veces la carga, y ese es el contenido
      físico del problema: los rodillos están separados solo 90 mm, y una
      pareja de fuerzas con un brazo tan corto necesita módulos enormes para
      equilibrar un momento de 360 N·m. Coincide con el resultado de la
      colección.

  - id: ejma3-col34-el-cable-abd-sobre-la-polea
    titulo: Un cable que pasa por una polea y vuelve a la misma pieza
    fuente: >-
      Ejercicio 3.4 · Tema 3, «Estática del sólido rígido» · Mecánica Aplicada,
      UPV/EHU, curso 2025-2026. La colección publica el resultado, contra el
      que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Determinar la fuerza en el cable $ABD$ y las reacciones horizontal y
      vertical en el soporte $C$.

