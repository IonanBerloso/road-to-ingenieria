        <text x="20" y="80" font-size="10" text-anchor="end" fill="var(--faint)">h</text>
      </svg>
      </figure>
    pide: La deformacion del muelle y su inclinacion, la reaccion de la anilla sobre el aro y la altura h.
    pasos:
      - tipo: reconocer
        pregunta: |
          La nota de la colección avisa de que, en el fondo, esto es un
          ejercicio de partículas. ¿Qué dos cosas permiten resolverlo así?
        opciones:
          - texto: >-
              Que en B concurren tres fuerzas y que AB es tangente a la guía,
              así que OA es perpendicular a AB
            correcta: true
            mensaje: |
              Eso es. En $B$ concurren los dos cables y el muelle: tres fuerzas
              en un punto, equilibrio de partícula. Y como $AB$ es tangente a la
              guía, el radio $OA$ —que es la dirección de la reacción de una
              guía lisa— es perpendicular al muelle. Con eso está todo.
          - texto: >-
              Que los cables no tienen masa y que la guía no tiene rozamiento
            mensaje: |
              Las dos cosas son ciertas y hacen falta, pero no son las que
              convierten el problema en uno de partículas. Lo que lo hace es que
              las fuerzas concurren en puntos —$B$ y $A$— y que la tangencia fija
              la dirección de la reacción.
          - texto: >-
              Que el muelle es ideal y por eso su fuerza es vertical
            mensaje: |
              Que sea ideal significa que su fuerza es proporcional a la
              deformación y va en la dirección del muelle, que aquí no es
              vertical: forma $60^{\circ}$ con la horizontal, y eso es
              justamente lo que hay que calcular.

      - tipo: calcular
        titulo: La deformación del muelle
        pregunta: |
          Componiendo en $B$ las tensiones de los dos cables, ¿cuánto vale el
          cociente $\delta/R$ de la deformación del muelle?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.005
          formato: un número, en unidades de R, con dos decimales
        distractores:
          - valor: '1.366'
            mensaje: |
              Has sumado los módulos de las dos tensiones,
              $\frac{\sqrt{3}}{2} + \frac{1}{2}$, en vez de componerlas como
              vectores. Los cables tiran en direcciones distintas: hay que sumar
              sus componentes.
          - valor: '0.5'
            mensaje: |
              Eso es solo la tensión del cable 2. La fuerza del muelle equilibra
              la **resultante** de los dos cables, y esa resultante vale $kR$.
        pista: |
          Suma vectorial en $B$: $T_{1}$ a $30^{\circ}$ y $T_{2}$ a
          $120^{\circ}$. El muelle equilibra la resultante, y en un muelle ideal
          $F = k\delta$.
        desarrollo: |
          $$
          \vec{T_{1}} = \frac{\sqrt{3}kR}{2}\left(\frac{\sqrt{3}}{2};\
          \frac{1}{2}\right) = kR\left(\frac{3}{4};\ \frac{\sqrt{3}}{4}\right)
          $$

          $$
          \vec{T_{2}} = \frac{kR}{2}\left(-\frac{1}{2};\
          \frac{\sqrt{3}}{2}\right) = kR\left(-\frac{1}{4};\
          \frac{\sqrt{3}}{4}\right)
          $$

          $$
          \vec{T_{1}} + \vec{T_{2}} = kR\left(\frac{1}{2};\
          \frac{\sqrt{3}}{2}\right)
          \qquad
          \left|\vec{T_{1}} + \vec{T_{2}}\right| = kR
          $$

          El muelle tira de $B$ con esa misma fuerza y sentido contrario, así
          que $F = kR$ y $\delta = F/k = R$.

      - tipo: calcular
        titulo: La inclinación del muelle
        pregunta: |
          ¿Cuántos grados forma $AB$ con la horizontal?
        respuesta:
          tipo: numero
          valor: '60'
          tolerancia: 0.05
          formato: un número, en grados
        distractores:
          - valor: '30'
            mensaje: |
              Ese es el ángulo del cable 1. La resultante de los dos cables no
              lleva la dirección de ninguno de ellos: sale a $60^{\circ}$,
              porque sus componentes son $\frac{1}{2}$ y $\frac{\sqrt{3}}{2}$
              de $kR$.
          - valor: '45'
            mensaje: |
              La resultante no bisecciona el ángulo de los dos cables, porque
              sus módulos son distintos. Hay que componer las componentes y
              tomar el arco tangente.
        pista: |
          La resultante de los dos cables es
          $kR\left(\frac{1}{2};\ \frac{\sqrt{3}}{2}\right)$.
        desarrollo: |
          $$
          \alpha = \arctan\frac{\sqrt{3}/2}{1/2} = \arctan\sqrt{3}
          = 60^{\circ}
          $$

      - tipo: calcular
        titulo: La reacción sobre el aro
        pregunta: |
          ¿Cuánto vale el módulo de la reacción de la anilla sobre el aro,
          escrito como $R_{A} = c\,Mg$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.005
          formato: un número, coeficiente de Mg, con dos decimales
        distractores:
          - valor: '0.866'
            mensaje: |
              Ese es el valor de $kR/(Mg)$, que sale por el camino, no la
              reacción. La reacción es la componente normal a la guía, y vale la
              mitad del peso.
          - valor: '0.25'
            mensaje: |
              Esa es una de las dos componentes del vector, la vertical. El
              módulo es la raíz de la suma de los cuadrados de
              $\frac{\sqrt{3}}{4}Mg$ y $\frac{1}{4}Mg$, o sea $Mg/2$.
        pista: |
          Equilibrio de la anilla: el peso $Mg$, el muelle tirando hacia $B$ y
          la reacción de la guía, que es radial porque no hay rozamiento. De ahí
          salen a la vez $kR$ y la reacción.
        desarrollo: |
          Con $AB$ a $60^{\circ}$, la normal $OA$ está a $-30^{\circ}$. Las dos
          ecuaciones de la anilla dan

          $$
          kR = \frac{\sqrt{3}}{2}Mg
          \qquad
          N = \frac{Mg}{2}
          $$

          Por el principio de acción y reacción, la anilla empuja al aro con esa
          misma fuerza cambiada de signo:

          $$
          \vec{R_{A}} = \frac{Mg}{2}\left(\frac{\sqrt{3}}{2}\,\vec{i}
          - \frac{1}{2}\,\vec{j}\right)
          $$

          que es lo que publica la colección.

      - tipo: calcular
        titulo: La altura del centro del aro
        pregunta: |
          ¿Cuánto vale $h/R$, la distancia del techo al centro $O$?
        respuesta:
          tipo: numero
          valor: '1.2321'
          tolerancia: 0.005
          formato: un número, en unidades de R, con cuatro decimales
        distractores:
          - valor: '1.7321'
            mensaje: |
              Te has dejado el medio radio que $A$ está por debajo de $O$. El
              punto $A$ no está a la altura de $O$: está a $R\sin 30^{\circ}$
              por debajo, y esa media unidad se resta al final.
          - valor: '0.7321'
            mensaje: |
              Has restado donde había que sumar, o al revés. $A$ está $R/2$ por
              **debajo** de $O$, y desde $A$ se sube $\frac{\sqrt{3}}{2}R$ hasta
              $B$ y otro tanto hasta el techo.
        pista: |
          Recorre el camino $O \to A \to B \to$ techo con las direcciones ya
          conocidas: $OA$ a $-30^{\circ}$, $AB$ a $60^{\circ}$ y de largo
          $\delta = R$, y el cable 2 a $120^{\circ}$ y de largo $R$.
        desarrollo: |
          Tomando $O$ como origen y contando alturas hacia arriba:

          $$
          y_A = -R\sin 30^{\circ} = -\frac{R}{2}
          $$

          $$
          y_B = y_A + R\sin 60^{\circ} = -\frac{R}{2} + \frac{\sqrt{3}}{2}R
          $$

          $$
          y_{\text{techo}} = y_B + R\sin 60^{\circ}
          = \sqrt{3}R - \frac{R}{2} = R\left(\sqrt{3} - \frac{1}{2}\right)
          = 1{,}2321\,R
          $$

          El cable 1 lo confirma:
          $y_B + \sqrt{3}R\sin 30^{\circ}$ da la misma altura.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              En $B$ concurren tres fuerzas: la resultante de los dos cables
              vale $kR$ y apunta a $60^{\circ}$, así que el muelle tira en esa
              dirección con $kR$ y $\delta = R$.
          - texto: >-
              Como $AB$ es tangente a la guía, la reacción de la guía en $A$ es
              perpendicular al muelle, y el equilibrio de la anilla da
              $kR = \sqrt{3}Mg/2$ y $N = Mg/2$.
          - texto: >-
              Recorriendo $O \to A \to B \to$ techo sale
              $h = R(\sqrt{3} - 1/2)$, y los dos cables dan la misma altura.
          - texto: >-
              Como el muelle es ideal, su deformación es la diferencia entre su
              longitud y la longitud natural, que aquí hay que dar como dato.
            trampa: true
            mensaje: |
              No hace falta ningún dato más: en este curso un muelle **ideal**
              tiene longitud natural nula, de modo que su longitud es su
              deformación. Se comprueba con la propia figura: solo con
              $\delta = R$ los dos cables llegan a la misma altura del techo.
    resolucion: |
      **El nudo B.** Los dos cables y el muelle concurren en $B$. Con
      $T_{1} = \frac{\sqrt{3}}{2}kR$ a $30^{\circ}$ y $T_{2} = \frac{1}{2}kR$ a
      $120^{\circ}$:

      $$
      \vec{T_{1}} + \vec{T_{2}} = kR\left(\frac{1}{2};\
      \frac{\sqrt{3}}{2}\right)
      $$

      de módulo $kR$ y dirección $60^{\circ}$. El muelle equilibra esa
      resultante, así que tira con $kR$ a lo largo de $BA$:

      $$
      \delta = \frac{F}{k} = R
      \qquad
      \alpha_{AB} = 60^{\circ}
      $$

      **La anilla A.** La guía es lisa, así que su reacción es radial; y como
      $AB$ es tangente, esa reacción es perpendicular al muelle. Con el peso
      $Mg$ colgando y el muelle tirando hacia $B$:

      $$
      kR = \frac{\sqrt{3}}{2}Mg
      \qquad
      N = \frac{Mg}{2}
      $$

      La reacción de la anilla **sobre el aro** es la opuesta:

      $$
      \vec{R_{A}} = \frac{Mg}{2}\left(\frac{\sqrt{3}}{2}\,\vec{i}
      - \frac{1}{2}\,\vec{j}\right)
      $$

      **La altura.** Se recorre el camino desde $O$: hasta $A$ se baja
      $R\sin 30^{\circ}$; de $A$ a $B$ se sube $\delta\sin 60^{\circ}$ con
      $\delta = R$; y de $B$ al techo, por el cable 2, otro
      $R\sin 60^{\circ}$:

      $$
      h = -\frac{R}{2} + \frac{\sqrt{3}}{2}R + \frac{\sqrt{3}}{2}R
      = R\left(\sqrt{3} - \frac{1}{2}\right) = 1{,}2321\,R
      $$

      **La comprobación que cierra el ejercicio.** Por el cable 1, de largo
      $\sqrt{3}R$ y a $30^{\circ}$, se sube $\sqrt{3}R\sin 30^{\circ}$ desde
      $B$: la misma altura. Que los dos cables lleguen exactamente al mismo
      techo confirma a la vez la geometría y que la deformación del muelle es su
      longitud entera, $R$. Los tres resultados coinciden con los publicados.
