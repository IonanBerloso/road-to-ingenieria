        <text x="160" y="194" font-size="9.5" fill="var(--faint)">60°</text>
        <text x="97" y="40" font-size="11" fill="var(--ink)">A</text>
        <text x="197" y="40" font-size="11" fill="var(--ink)">C</text>
        <text x="94" y="197" font-size="11" fill="var(--ink)">D</text>
        <text x="200" y="197" font-size="11" fill="var(--ink)">B</text>
        <text x="156" y="68" font-size="10" fill="var(--faint)">R</text>
        <line x1="240" y1="161" x2="240" y2="200" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="235" y1="161" x2="245" y2="161" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="235" y1="200" x2="245" y2="200" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="250" y="184" font-size="9.5" fill="var(--faint)">3R/2</text>
