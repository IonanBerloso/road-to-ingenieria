      </figcaption>
      </figure>
    pide: El centro de gravedad, los momentos de inercia y las reacciones con y sin peso propio.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo conviene descomponer la placa para el centro de gravedad?
        opciones:
          - texto: En el cuadrado de 15 por 15 de arriba y el triángulo que va de A a D
            correcta: true
            mensaje: |
              Eso es. El cuadrado ocupa de $y = 15$ a $y = 30$ y el triángulo
              tiene por catetos el tramo de eje $y$ de 0 a 15 y la horizontal
              hasta $D$. Sus áreas son 225 y 112,5 cm².
          - texto: En el rectángulo de 15 por 30 menos el triángulo de la derecha
            mensaje: |
              También vale —restar áreas es legítimo—, pero el triángulo que
              hay que quitar es el de debajo de la recta $AD$, con área 112,5:
              justo el mismo número. Sale lo mismo, así que fíjate en cuál
              restas.
          - texto: En dos triángulos iguales, partiendo por la diagonal BD
            mensaje: |
              $ABD$ y $BCD$ no son iguales: el primero tiene catetos 15 y 15 y
              el segundo también, pero el contorno de la placa incluye la
              diagonal $AD$, no la $BD$.
          - texto: No hace falta descomponer, el centro está en el centro del contorno
            mensaje: |
              «El centro del contorno» no es nada definido. El centro de
              gravedad es una media pesada por el área, y para calcularla hay
              que descomponer o integrar.

      - tipo: calcular
        titulo: La abscisa del centro de gravedad
        pregunta: |
          ¿Cuánto vale $x_G$?
        respuesta:
          tipo: magnitud
          valor: '6.667 cm'
          tolerancia: 0.01
          formato: una longitud, con su unidad
        distractores:
          - valor: '7.5 cm'
            mensaje: |
              Ese es el centro del cuadrado de arriba. El triángulo de abajo
              tira del centro de gravedad hacia la izquierda, porque su
              centroide está en $x = 5$.
          - valor: '5 cm'
            mensaje: |
              Ese es el centroide del triángulo solo. Hay que promediar los dos
              trozos pesando por sus áreas, 225 y 112,5 cm².
        pista: |
          $x_G = (225 \cdot 7{,}5 + 112{,}5 \cdot 5)/337{,}5$.
        desarrollo: |
          $$
          x_G = \frac{225 \cdot 7{,}5 + 112{,}5 \cdot 5}{337{,}5}
          = \frac{2250}{337{,}5} = 6{,}67\ \text{cm}
          $$

      - tipo: calcular
        titulo: La ordenada del centro de gravedad
        pregunta: |
          ¿Cuánto vale $y_G$?
        respuesta:
          tipo: magnitud
          valor: '18.333 cm'
          tolerancia: 0.01
          formato: una longitud, con su unidad
        distractores:
          - valor: '22.5 cm'
            mensaje: |
              Ese es el centro del cuadrado de arriba. El triángulo, con su
              centroide en $y = 10$, baja el conjunto.
          - valor: '15 cm'
            mensaje: |
              Esa es la media altura del contorno. No es una media pesada por
              área: arriba hay más área que abajo, así que $y_G$ queda por
              encima de 15.
        pista: |
          El centroide del triángulo de vértices $(0,0)$, $(0,15)$ y $(15,15)$
          está en $y = 10$.
        desarrollo: |
          $$
          y_G = \frac{225 \cdot 22{,}5 + 112{,}5 \cdot 10}{337{,}5}
          = \frac{6187{,}5}{337{,}5} = 18{,}33\ \text{cm}
          $$

      - tipo: calcular
        titulo: El momento de inercia respecto del eje x
        pregunta: |
          Integrando, ¿cuánto vale $I_x$?
        respuesta:
          tipo: numero
          valor: '130781.25'
          tolerancia: 60
          formato: un número, en cm^4
        distractores:
          - valor: '118125'
            mensaje: |
              Te has dejado el triángulo. Aporta poco —está cerca del eje $x$—
              pero aporta: $\int_0^{15} y^{3}\,dy = 12\,656$ cm⁴.
          - valor: '135000'
            mensaje: |
              Has tratado el triángulo como si fuera el rectángulo entero de 15
              por 15. A la altura $y$, la placa solo llega hasta $x = y$, no
              hasta 15.
        pista: |
          Con franjas horizontales, la anchura es 15 para $15 \le y \le 30$ y
          vale $y$ para $0 \le y \le 15$.
        desarrollo: |
          $$
          I_x = \int_{15}^{30} 15\,y^{2}\,dy + \int_{0}^{15} y \cdot y^{2}\,dy
          = 118125 + \frac{15^{4}}{4}
          $$

          $$
          I_x = 118125 + 12656{,}25 = 130\,781{,}25\ \text{cm}^{4}
          $$

      - tipo: calcular
        titulo: El momento de inercia respecto del eje y
        pregunta: |
          ¿Cuánto vale $I_y$?
        respuesta:
          tipo: numero
          valor: '21093.75'
          tolerancia: 20
          formato: un número, en cm^4
        distractores:
          - valor: '16875'
            mensaje: |
              Ese es el del cuadrado solo, $15 \cdot 15^{3}/3$. Falta el
              triángulo, que aporta 4218,75 cm⁴.
          - valor: '33750'
            mensaje: |
              Has contado el triángulo como un cuadrado más. Con franjas
              verticales, a la abscisa $x$ el triángulo solo va de $y = x$ a
              $y = 15$, no de 0 a 15.
        pista: |
          Con franjas verticales, la altura es 15 en el cuadrado y $15 - x$ en
          el triángulo.
        desarrollo: |
          $$
          I_y = \int_{0}^{15} 15\,x^{2}\,dx + \int_{0}^{15} x^{2}(15 - x)\,dx
          = 16875 + 4218{,}75
          $$

          $$
          I_y = 21\,093{,}75\ \text{cm}^{4}
          \qquad
          I_A = I_x + I_y = 151\,875\ \text{cm}^{4}
          $$

      - tipo: calcular
        titulo: La fuerza del cable sin peso propio
        pregunta: |
          Despreciando la masa de la placa, ¿cuánto vale la tracción del cable?
        respuesta:
          tipo: magnitud
          valor: '74.54 N'
          tolerancia: 0.01
          formato: una fuerza, con su unidad
        distractores:
          - valor: '50 N'
            mensaje: |
              50 N es $P$. El cable no le hace frente de tú a tú: está
              inclinado y su punto de aplicación, $D$, está más cerca de $A$ que
              $C$, así que necesita más fuerza.
          - valor: '70.7 N'
            mensaje: |
              Has usado la longitud $AD$ como brazo del cable. El brazo es la
              distancia **perpendicular** de $A$ a la recta $DE$, que es algo
              menor: 20,12 cm.
        pista: |
          El cable va de $D(15;\ 15)$ a $E(45;\ 0)$: su unitario es
          $(0{,}894;\ -0{,}447)$. Toma momentos en $A$.
        desarrollo: |
          $$
          \sum M_A = 30 \cdot 50 - T\,\bigl(15 \cdot 0{,}447
          + 15 \cdot 0{,}894\bigr) = 0
          $$

          $$
          T = \frac{1500}{20{,}12} = 74{,}54\ \text{N}
          $$

          Y las fuerzas dan $A_x = -16{,}67$ N y $A_y = 33{,}33$ N.

      - tipo: calcular
        titulo: La componente horizontal en A con el peso propio
        pregunta: |
          Con la placa de 10 kg, ¿cuánto vale $A_x$, en newtons y con su signo,
          tomando positivo hacia la derecha?
        respuesta:
          tipo: numero
          valor: '12.4'
          tolerancia: 0.4
          formato: un número, en N, con su signo
        distractores:
          - valor: '-12.4'
            mensaje: |
              Es el valor que imprime la colección, y el módulo es correcto,
              pero el signo no puede serlo: con el peso, el cable afloja hasta
              42 N y su tirón horizontal, 37,6 N, ya no llega a los 50 N de
              $P$. La articulación tiene que empujar hacia la derecha.
          - valor: '-16.67'
            mensaje: |
              Ese es el valor del apartado d, sin peso. Al añadir el peso la
              tracción del cable baja de 74,5 a 42 N, así que $A_x$ cambia,
              y de hecho cambia de signo.
        pista: |
          Con $g = 9{,}81$ m/s², el peso es 98,1 N aplicado en $x_G = 6{,}67$
          cm, y la tracción baja a 42,04 N.
        desarrollo: |
          $$
          \sum M_A = 1500 - 98{,}1 \cdot 6{,}67 - 20{,}12\,T = 0
          \;\Longrightarrow\; T = 42{,}04\ \text{N}
          $$

          $$
          A_x = 50 - 0{,}894 \cdot 42{,}04 = 50 - 37{,}60 = 12{,}40\ \text{N}
          $$

      - tipo: calcular
        titulo: La componente vertical en A con el peso propio
        pregunta: |
          Con la placa de 10 kg, ¿cuánto vale $A_y$?
        respuesta:
          tipo: magnitud
          valor: '116.9 N'
          tolerancia: 0.01
          formato: una fuerza, con su unidad
        distractores:
          - valor: '12.4 N'
            mensaje: |
              Es el valor que imprime la colección, y no puede cumplir
              $\sum F_y = 0$: la placa pesa 98,1 N y el cable tira hacia abajo
              otros 18,8 N, así que la articulación tiene que sostener 116,9 N.
          - valor: '98.1 N'
            mensaje: |
              Ese es solo el peso. El cable baja de $D$ a $E$, así que también
              tira de la placa hacia abajo, con $0{,}447 \cdot 42 = 18{,}8$ N
              más.
          - valor: '79.3 N'
            mensaje: |
              Has restado la componente vertical del cable en vez de sumarla.
              El cable va hacia abajo y hacia la derecha, no hacia arriba.
        pista: |
          $\sum F_y = 0$: la reacción sostiene el peso **y** la componente
          vertical del cable, que también apunta hacia abajo.
        desarrollo: |
          $$
          A_y = 98{,}1 + 0{,}447 \cdot 42{,}04 = 98{,}1 + 18{,}8 = 116{,}9\ \text{N}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución del apartado e. Una pieza es falsa.
        piezas:
          - texto: El peso, $98{,}1$ N, se aplica en el centro de gravedad, a $x_G = 6{,}67$ cm de $A$, y da momento horario.
          - texto: 'Momentos en A: $1500 - 654 = 20{,}12\,T$, así que el cable baja de 74,5 a $42{,}0$ N.'
          - texto: $\sum F_x = 0$ da $A_x = 50 - 37{,}6 = 12{,}4$ N y $\sum F_y = 0$ da $A_y = 98{,}1 + 18{,}8 = 116{,}9$ N.
          - texto: Como en el apartado d la componente $A_x$ salía negativa, en el e también tiene que serlo.
            trampa: true
            mensaje: |
              El signo de $A_x$ depende de quién gana entre $P$ y el tirón
              horizontal del cable. Sin peso, el cable tira con 66,7 N y gana
              él; con peso, la tracción baja y solo tira con 37,6 N, así que
              gana $P$ y $A_x$ cambia de signo.
    resolucion: |
      **a. Centro de gravedad.** Cuadrado de 225 cm² centrado en
      $(7{,}5;\ 22{,}5)$ y triángulo de 112,5 cm² con centroide en
      $(5;\ 10)$:

      $$
      x_G = 6{,}67\ \text{cm}
      \qquad
      y_G = 18{,}33\ \text{cm}
      $$

      **b y c. Momentos de inercia.** Por franjas, con la anchura variable del
      triángulo:

      $$
      I_x = 130\,781{,}25\ \text{cm}^{4}
      \qquad
      I_y = 21\,093{,}75\ \text{cm}^{4}
      \qquad
      I_A = 151\,875\ \text{cm}^{4}
      $$

      **d. Sin peso propio.** El cable $DE$ tiene unitario
      $(0{,}894;\ -0{,}447)$ y su brazo respecto de $A$ es 20,12 cm:

      $$
      T = 74{,}54\ \text{N}
      \qquad
      A_x = -16{,}67\ \text{N}
      \qquad
      A_y = 33{,}33\ \text{N}
      $$

      **e. Con 10 kg.** Con $g = 9{,}81$ m/s² —que es la que reproduce el 42,03
      impreso; con 9,8 sale 42,07— el peso es 98,1 N en $x_G$:

      $$
      T = 42{,}04\ \text{N}
      \qquad
      A_x = 12{,}40\ \text{N}
      \qquad
      A_y = 116{,}90\ \text{N}
      $$

      **Las dos discrepancias del apartado e.** La colección imprime
      $A_x = -12{,}4$ N y $A_y = 12{,}4$ N. La tracción coincide con la nuestra,
      y con ella las dos ecuaciones de fuerzas no dejan margen: el cable tira
      de la placa hacia la derecha con 37,6 N, menos que los 50 N de $P$, así
      que $A_x$ es **positiva**; y en vertical la placa pesa 98,1 N y el cable
      tira hacia abajo otros 18,8, así que $A_y = 116{,}9$ N y no 12,4. El
      12,4 repetido en las dos componentes tiene toda la pinta de una errata de
      transcripción. Aquí se publica lo que dan los datos.

  - id: ejma3-col313-las-dos-barras-y-el-angulo
    titulo: El ángulo de equilibrio de dos barras articuladas
    fuente: >-
      Ejercicio 3.13 · Tema 3, «Estática del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      La barra de longitud $l$ tiene una masa uniforme de valor $m$, y la barra
      de longitud $2l$ tiene una masa uniforme de valor $2m$. Para una fuerza
      $P$ conocida, determinar el ángulo $\theta$ de equilibrio.

      <figure>
      <svg viewBox="0 0 242 252" role="img" width="242" height="252" aria-labelledby="ejma3-col313-t ejma3-col313-d">
        <title id="ejma3-col313-t">Dos barras articuladas en su extremo superior, con una rueda y una fuerza P</title>
        <desc id="ejma3-col313-d">Dos barras articuladas en el vértice superior forman un ángulo theta. La de la derecha, de longitud l, termina en una rueda apoyada en el suelo, donde actúa la fuerza P dirigida hacia la pared. La de la izquierda, de longitud 2l, pasa por un pasador de la pared situado en su punto medio, a la misma altura que la rueda, y sigue por debajo. Una línea de puntos une el pasador con el centro de la rueda.</desc>
        <defs>
          <marker id="ejma3-col313-f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
        </defs>
        <line x1="123.8" y1="77.5" x2="56.2" y2="222.5" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
        <line x1="123.8" y1="77.5" x2="157.6" y2="150" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
        <line x1="90" y1="150" x2="157.6" y2="150" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="3 3"/>
        <rect x="60" y="130" width="12" height="40" fill="var(--faint)" fill-opacity="0.25" stroke="var(--ink)" stroke-width="1"/>
        <path d="M72 134 L66 140 M72 144 L66 150 M72 154 L66 160 M72 164 L66 170" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <path d="M90 150 L72 142 L72 158 Z" fill="none" stroke="var(--ink)" stroke-width="1.2"/>
        <circle cx="90" cy="150" r="3.4" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/>
        <circle cx="123.8" cy="77.5" r="3.4" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/>
        <circle cx="157.6" cy="150" r="8" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/>
        <circle cx="157.6" cy="150" r="2" fill="var(--ink)"/>
        <line x1="136" y1="158" x2="182" y2="158" stroke="var(--ink)" stroke-width="1"/>
        <path d="M140 158 L136 164 M146 158 L142 164 M152 158 L148 164 M158 158 L154 164 M164 158 L160 164 M170 158 L166 164 M176 158 L172 164 M182 158 L178 164" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="215" y1="150" x2="170" y2="150" stroke="var(--flag)" stroke-width="1.8" marker-end="url(#ejma3-col313-f)"/>
        <text x="219" y="147" font-size="10" fill="var(--flag)">P</text>
        <path d="M134.8 101.1 A26 26 0 0 1 112.8 101.1" fill="none" stroke="var(--ink)" stroke-width="1"/>
        <text x="123" y="116" font-size="10" text-anchor="middle" fill="var(--ink)">θ</text>
        <text x="96" y="106" font-size="10" text-anchor="end" fill="var(--ink)">l</text>
        <text x="150" y="108" font-size="10" fill="var(--ink)">l</text>
      </svg>
      <figcaption>

      El pasador de la pared está en el **punto medio** de la barra larga y a
      la misma altura que la rueda. Por eso el peso de esa barra no da momento
      respecto de él, y el problema se reduce a la barra corta.

      </figcaption>
      </figure>
    pide: El ángulo de equilibrio en función de P y del peso.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué conviene tomar momentos de todo el conjunto respecto del
          pasador de la pared?
        opciones:
          - texto: Porque el peso de la barra larga pasa por ese punto y no da momento
            correcta: true
            mensaje: |
              Eso es. El pasador está en el punto medio de la barra $2l$, que es
              su centro de gravedad, así que su peso —el mayor de los dos— sale
              de la ecuación junto con las dos componentes del pasador.
          - texto: Porque el peso de la barra larga es el doble y hay que contarlo dos veces
            mensaje: |
              Es el doble, sí, pero eso no es la razón. Lo que lo hace cómodo es
              que su recta de acción pasa justo por el punto elegido, así que
              su momento es cero.
          - texto: Porque es el único punto donde P no da momento
            mensaje: |
              $P$ tampoco da momento ahí, y es cierto que ayuda —está a la
              misma altura que la rueda, y $P$ es horizontal—, pero eso vale
              para cualquier punto de esa recta horizontal.
          - texto: Porque en una articulación el momento siempre es nulo
            mensaje: |
              Nulo es el momento **que la articulación transmite**, no el de las
              demás fuerzas respecto de ella. Aquí lo que se aprovecha es dónde
              está aplicado cada peso.

      - tipo: calcular
        titulo: La reacción del suelo sobre la rueda
        pregunta: |
          La normal del suelo vale $N = k\,mg$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '0.75'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '0.5'
            mensaje: |
              Has repartido el peso de la barra corta a medias entre sus dos
              extremos. Su centro de gravedad no está a medio camino **en
              horizontal** entre el pasador de la pared y la rueda: está a tres
              cuartos.
          - valor: '1'
            mensaje: |
              La rueda no sostiene la barra corta entera: parte del peso pasa
              por el pasador de arriba a la barra larga y de ahí a la pared.
          - valor: '1.5'
            mensaje: |
              Has repartido el peso total, $3mg$, a medias. La barra larga
              descarga su peso íntegro en el pasador de la pared, porque su
              centro de gravedad está justo ahí.
        pista: |
          Momentos del conjunto respecto del pasador de la pared. Llamando
          $\alpha = \theta/2$, la rueda está a $2l\operatorname{sen}\alpha$ y el
          centro de la barra corta, a $1{,}5\,l\operatorname{sen}\alpha$.
        desarrollo: |
          $$
          N \cdot 2l\operatorname{sen}\alpha
          = mg \cdot 1{,}5\,l\operatorname{sen}\alpha
          \;\Longrightarrow\; N = 0{,}75\,mg
          $$

          $P$ no aparece porque es horizontal y está a la misma altura que el
          pasador.

      - tipo: calcular
        titulo: El coeficiente del resultado
        pregunta: |
          El resultado tiene la forma
          $\theta = 2\arctan\left(k\,\dfrac{P}{mg}\right)$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.05
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              Sale de tomar $N = mg$. Con la normal correcta, $0{,}75\,mg$, el
              término que multiplica al seno es $N - 0{,}5\,mg = 0{,}25\,mg$, y
              el coeficiente se duplica.
          - valor: '1'
            mensaje: |
              Sale de tomar $N = 1{,}5\,mg$, es decir, de repartir el peso total
              entre los dos apoyos. La barra larga no carga nada sobre la rueda.
        pista: |
          Momentos de la barra corta respecto del pasador de arriba, con $N$ ya
          conocida y $P$ empujando hacia la pared.
        desarrollo: |
          $$
          \operatorname{sen}\alpha\,(N - 0{,}5\,mg) = P\cos\alpha
          \;\Longrightarrow\; \tan\alpha = \frac{P}{0{,}25\,mg} = \frac{4P}{mg}
          $$

          Y como $\alpha = \theta/2$,

          $$
          \theta = 2\arctan\left(\frac{4P}{mg}\right)
          $$

      - tipo: calcular
        titulo: Un caso concreto
        pregunta: |
          Si $P = mg/4$, ¿cuánto vale $\theta$, en grados?
        respuesta:
          tipo: numero
          valor: '90'
          tolerancia: 0.5
          formato: un número, en grados
        distractores:
          - valor: '45'
            mensaje: |
              Te has quedado con $\arctan(1)$ y falta el factor 2. El ángulo que
              aparece en la geometría es la **mitad** del ángulo entre las
              barras.
          - valor: '53.13'
            mensaje: |
              Sale de $2\arctan(0{,}5)$, es decir, del coeficiente 2 en vez de
              4. Revisa la normal de la rueda.
        pista: |
          Sustituye en la fórmula anterior.
        desarrollo: |
          $$
          \theta = 2\arctan\left(4 \cdot \frac{1}{4}\right)
          = 2 \cdot 45^{\circ} = 90^{\circ}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: El pasador de la pared es el punto medio de la barra $2l$, así que su peso no da momento respecto de él.
          - texto: 'Momentos del conjunto en ese pasador: $N \cdot 2l\operatorname{sen}\alpha = mg \cdot 1{,}5\,l\operatorname{sen}\alpha$, o sea $N = 0{,}75\,mg$.'
          - texto: 'Momentos de la barra corta en el pasador de arriba: $0{,}25\,mg\operatorname{sen}\alpha = P\cos\alpha$, y $\theta = 2\arctan(4P/mg)$.'
          - texto: La rueda es un apoyo simple, así que da una reacción vertical y también una horizontal que ayuda a equilibrar $P$.
            trampa: true
            mensaje: |
              Un apoyo móvil sobre suelo liso da **una sola** fuerza, normal al
              suelo, o sea vertical. Si diera también horizontal, $P$ quedaría
              equilibrada por ella y el ángulo no aparecería en ninguna
              ecuación.
    resolucion: |
      **La geometría.** Llamando $\alpha = \theta/2$ y poniendo el origen en el
      pasador de la pared: el pasador de arriba está en
      $(l\operatorname{sen}\alpha,\ l\cos\alpha)$ y la rueda, en
      $(2l\operatorname{sen}\alpha,\ 0)$, porque el triángulo es isósceles —los
      dos lados miden $l$— y el pasador de la pared está a la misma altura que
      la rueda.

      **El conjunto.** Respecto del pasador de la pared, el peso $2mg$ de la
      barra larga no da momento —está aplicado justo ahí— y $P$ tampoco, porque
      es horizontal y pasa por esa altura. Queda

      $$
      N \cdot 2l\operatorname{sen}\alpha
      = mg \cdot \frac{3}{2}\,l\operatorname{sen}\alpha
      \;\Longrightarrow\; N = \frac{3}{4}\,mg
      $$

      **La barra corta.** Momentos respecto del pasador de arriba, donde $P$ sí
      tiene brazo:

      $$
      \operatorname{sen}\alpha\left(N - \frac{mg}{2}\right) = P\cos\alpha
      \;\Longrightarrow\; \tan\alpha = \frac{4P}{mg}
      $$

      $$
      \theta = 2\arctan\left(\frac{4P}{mg}\right)
      $$

      Coincide con el resultado de la colección. Comprobado además resolviendo
      el sistema completo —seis ecuaciones, con $P$ como incógnita— para varios
      ángulos: en todos sale $P = (mg/4)\tan(\theta/2)$, que es la misma
      fórmula despejada al revés.

  - id: ejma3-col314-el-vaso-y-las-dos-esferas
    titulo: El peso mínimo de un vaso para que dos esferas no lo vuelquen
    fuente: >-
      Ejercicio 3.14 · Tema 3, «Estática del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección lo marca como de nivel
      de examen e indica que está resuelto en el libro de la asignatura, y
      publica el resultado, contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Dentro de un vaso cilíndrico de radio $R$ colocado boca abajo, están
      colocadas dos esferas de radio $r$ y peso $mg$ cada una. Calcular el peso
      $Q$ del vaso cilíndrico con el cual las bolas no volcarán. Todos los
      contactos entre superficies son lisos.

      <figure>
      <svg viewBox="0 0 282 244" role="img" width="282" height="244" aria-labelledby="ejma3-col314-t ejma3-col314-d">
        <title id="ejma3-col314-t">Vaso cilíndrico boca abajo con dos esferas dentro</title>
        <desc id="ejma3-col314-d">Un vaso cilíndrico de diámetro interior 2R, colocado boca abajo sobre el suelo. Dentro hay dos esferas iguales de radio r: la de abajo apoya en el suelo y en la pared izquierda, y la de arriba apoya sobre la primera y en la pared derecha.</desc>
        <line x1="40" y1="210" x2="250" y2="210" stroke="var(--ink)" stroke-width="1.2"/>
        <path d="M46 210 L40 216 M58 210 L52 216 M70 210 L64 216 M82 210 L76 216 M94 210 L88 216 M106 210 L100 216 M118 210 L112 216 M130 210 L124 216 M142 210 L136 216 M154 210 L148 216 M166 210 L160 216 M178 210 L172 216 M190 210 L184 216 M202 210 L196 216 M214 210 L208 216 M226 210 L220 216 M238 210 L232 216 M250 210 L244 216" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <circle cx="118" cy="172" r="38" fill="var(--faint)" fill-opacity="0.3" stroke="var(--ink)" stroke-width="1.3"/>
        <circle cx="162" cy="110" r="38" fill="var(--faint)" fill-opacity="0.3" stroke="var(--ink)" stroke-width="1.3"/>
        <rect x="72" y="42" width="136" height="8" fill="var(--ink)" fill-opacity="0.75" stroke="var(--ink)" stroke-width="1"/>
        <rect x="72" y="50" width="8" height="160" fill="var(--ink)" fill-opacity="0.75" stroke="var(--ink)" stroke-width="1"/>
        <rect x="200" y="50" width="8" height="160" fill="var(--ink)" fill-opacity="0.75" stroke="var(--ink)" stroke-width="1"/>
        <circle cx="118" cy="172" r="2" fill="var(--ink)"/>
        <circle cx="162" cy="110" r="2" fill="var(--ink)"/>
        <line x1="118" y1="172" x2="93" y2="197" stroke="var(--ink)" stroke-width="1"/>
        <line x1="93" y1="197" x2="101" y2="195" stroke="var(--ink)" stroke-width="1"/>
        <line x1="93" y1="197" x2="95" y2="189" stroke="var(--ink)" stroke-width="1"/>
        <text x="100" y="176" font-size="10" fill="var(--ink)">r</text>
        <line x1="162" y1="110" x2="187" y2="135" stroke="var(--ink)" stroke-width="1"/>
        <line x1="187" y1="135" x2="179" y2="133" stroke="var(--ink)" stroke-width="1"/>
        <line x1="187" y1="135" x2="185" y2="127" stroke="var(--ink)" stroke-width="1"/>
        <text x="170" y="126" font-size="10" fill="var(--ink)">r</text>
        <line x1="80" y1="36" x2="80" y2="24" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="200" y1="36" x2="200" y2="24" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="80" y1="28" x2="200" y2="28" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="80" y1="24" x2="80" y2="32" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="200" y1="24" x2="200" y2="32" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="140" y="20" font-size="10" text-anchor="middle" fill="var(--faint)">2R</text>
      </svg>
      <figcaption>

      Las dos esferas apoyan en paredes **opuestas**: la de abajo en la
      izquierda, la de arriba en la derecha. Esas dos normales son iguales y
      contrarias, y forman el par que puede volcar el vaso.

      </figcaption>
      </figure>
    pide: El peso mínimo del vaso para que no vuelque.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué es lo que tiende a volcar el vaso?
        opciones:
          - texto: El par que forman las dos normales de las esferas sobre las paredes opuestas
            correcta: true
            mensaje: |
              Eso es. La esfera de arriba empuja la pared derecha hacia fuera y
              la de abajo empuja la izquierda hacia fuera: dos fuerzas iguales y
              opuestas separadas en altura, o sea un par.
          - texto: El peso de las dos esferas, que carga el vaso hacia un lado
            mensaje: |
              El vaso está boca abajo y las esferas apoyan en el **suelo**, no
              en el vaso: su peso baja directamente al suelo y no pasa por el
              vaso.
          - texto: La componente horizontal del contacto entre las dos esferas
            mensaje: |
              Esa fuerza es interna entre las dos esferas: aparece y desaparece
              al aislarlas juntas. Sobre el vaso solo actúan las normales de las
              paredes.
          - texto: Nada, porque todos los contactos son lisos y no hay rozamiento
            mensaje: |
              Que sean lisos elimina las fuerzas tangenciales, no las normales.
              Y son justamente las normales las que empujan las paredes hacia
              fuera.

      - tipo: calcular
        titulo: El coeficiente del resultado
        pregunta: |
          El peso mínimo tiene la forma
          $Q = k\,\dfrac{R - r}{R}\,mg$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.02
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              Has tomado $2R$ como brazo del peso del vaso. El vuelco es
              alrededor del canto de apoyo, y el peso del vaso pasa por su eje,
              que está a $R$ de ese canto, no a $2R$.
          - valor: '4'
            mensaje: |
              Has contado dos veces la separación horizontal de los centros. Es
              $2R - 2r$ una sola vez, que es lo que vale el brazo del par.
        pista: |
          El par de las dos normales vale $N\,h$, donde $h$ es la separación
          vertical de los centros, y la normal es $N = mg\,d/h$ con
          $d = 2R - 2r$. Fíjate en que $h$ se cancela.
        desarrollo: |
          $$
          N = mg\,\frac{d}{h}
          \qquad
          \text{par} = N\,h = mg\,d = mg\,(2R - 2r)
          $$

          $$
          Q \cdot R = mg\,(2R - 2r)
          \;\Longrightarrow\; Q = \frac{2R - 2r}{R}\,mg
          $$

      - tipo: calcular
        titulo: Un caso concreto
        pregunta: |
          Si $r = 0{,}6\,R$, ¿cuánto vale $Q/mg$?
        respuesta:
          tipo: numero
          valor: '0.8'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '0.4'
            mensaje: |
              Sale de tomar $2R$ como brazo del peso del vaso. El canto de
              vuelco está a $R$ del eje.
          - valor: '0.894'
            mensaje: |
              Sale de tomar $N = mg$ en vez de $mg\,d/h$. La fuerza entre las
              esferas está inclinada, y solo una parte de ella empuja las
              paredes.
        pista: |
          Sustituye $r = 0{,}6R$ en la fórmula anterior.
        desarrollo: |
          $$
          \frac{Q}{mg} = \frac{2(R - 0{,}6R)}{R} = 0{,}8
          $$

          Es decir: si las esferas son grandes frente al vaso —$r$ cerca de
          $R$—, casi no lo vuelcan; si son pequeñas, sus centros se separan
          mucho y el par crece.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: Los centros están separados $d = 2R - 2r$ en horizontal y $h = \sqrt{4r^{2} - d^{2}}$ en vertical, porque las esferas se tocan.
          - texto: 'Aislando la esfera de arriba: su peso lo sostiene la componente vertical del contacto, y la horizontal, $mg\,d/h$, es la que empuja la pared derecha.'
          - texto: Las dos normales forman un par de valor $mg\,d$, y en el límite del vuelco lo equilibra el peso del vaso con brazo $R$.
          - texto: El peso de las esferas ayuda a que el vaso no vuelque, así que hay que sumar $2mg$ a $Q$.
            trampa: true
            mensaje: |
              El vaso está boca abajo y las esferas descansan en el suelo, no
              en él: su peso no pasa por el vaso en ningún momento. Lo único
              que el vaso recibe de ellas son las dos normales horizontales.
    resolucion: |
      **La geometría.** La esfera de abajo apoya en el suelo y en la pared
      izquierda; la de arriba, sobre ella y en la pared derecha. Sus centros
      están separados

      $$
      d = 2R - 2r
      \qquad
      h = \sqrt{(2r)^{2} - d^{2}}
      $$

      **La esfera de arriba.** Sus tres fuerzas son el peso, la normal de la
      pared derecha —horizontal— y el contacto con la otra esfera, que va en la
      línea de centros. La vertical de ese contacto sostiene el peso, así que
      su horizontal vale

      $$
      N = mg\,\frac{d}{h}
      $$

      y esa es también la normal de la pared.

      **El vaso.** Recibe $N$ hacia la derecha en la pared derecha, a la altura
      del centro de arriba, y $N$ hacia la izquierda en la izquierda, a la
      altura del centro de abajo: un **par** de momento

      $$
      N\,h = mg\,d = mg\,(2R - 2r)
      $$

      La $h$ se cancela, así que la altura de las esferas no importa. Como
      indica la nota de la colección, el caso a estudiar es el instante en que
      empieza el vuelco: la normal del suelo se traslada al canto derecho, y el
      peso del vaso, aplicado en su eje, lo frena con un brazo $R$:

      $$
      Q\,R = mg\,(2R - 2r)
      \;\Longrightarrow\; Q = \frac{2R - 2r}{R}\,mg
      $$

      Coincide con el resultado de la colección. Conviene leer la fórmula: con
      $r \to R$ el peso necesario tiende a cero —las esferas no separan las
      paredes—, y con esferas pequeñas hace falta un vaso muy pesado, aunque
      entonces las dos esferas dejarían de tocarse a la vez las dos paredes.

  - id: ejma3-col315-la-barra-sobre-la-pista-semicircular
    titulo: La barra que se apoya en una pista semicircular
    fuente: >-
      Ejercicio 3.15 · Tema 3, «Estática del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Una barra $AB$ de peso $P$ y longitud $L = 3R$ descansa sobre una pista
      semicircular fija de radio $R$. Despreciando el rozamiento entre todas
      las superficies, calcular el ángulo $\theta$ en la posición de
      equilibrio mostrada.

      <figure>
      <svg viewBox="0 0 340 215" role="img" width="340" height="215" aria-labelledby="ma3c315-t ma3c315-d">
        <title id="ma3c315-t">Barra apoyada en una pista semicircular</title>
        <desc id="ma3c315-d">Un bloque macizo tiene labrada en su cara superior una hendidura semicircular de radio R y centro O. Una barra recta AB de longitud 3R se apoya en el punto A de la superficie curva y en el canto derecho C de la hendidura, y sobresale del bloque hasta el extremo B. La barra forma un ángulo theta con la horizontal.</desc>
        <rect x="60" y="70" width="190" height="112" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2"/>
        <path d="M90 70 A60 60 0 0 0 210 70" fill="none" stroke="var(--ink)" stroke-width="1.4" stroke-dasharray="7 5"/>
        <line x1="210" y1="70" x2="322" y2="70" stroke="var(--faint)" stroke-width="1" stroke-dasharray="6 4"/>
        <line x1="150" y1="70" x2="108.7" y2="113.5" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="4 3"/>
        <line x1="108.7" y1="113.5" x2="274" y2="42.5" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
        <path d="M238 70 A28 28 0 0 0 235.7 59" fill="none" stroke="var(--ink)" stroke-width="1"/>
        <text x="245" y="66" font-size="11" fill="var(--ink)">θ</text>
        <circle cx="150" cy="70" r="2.6" fill="var(--ink)"/>
        <circle cx="108.7" cy="113.5" r="2.6" fill="var(--ink)"/>
        <circle cx="210" cy="70" r="2.6" fill="var(--ink)"/>
        <text x="144" y="62" font-size="11" fill="var(--ink)">O</text>
        <text x="94" y="127" font-size="11" fill="var(--ink)">A</text>
        <text x="213" y="87" font-size="11" fill="var(--ink)">C</text>
        <text x="279" y="38" font-size="11" fill="var(--ink)">B</text>
        <text x="120" y="98" font-size="10" fill="var(--faint)">R</text>
      </svg>
      </figure>
    pide: El ángulo que forma la barra con la horizontal en la posición de equilibrio.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de escribir ninguna ecuación: ¿qué dirección tienen las
          reacciones en los dos contactos, $A$ y $C$?
        opciones:
          - texto: >-
              En A, dirigida hacia el centro O; en C, perpendicular a la barra
            correcta: true
            mensaje: |
              Eso es. En $A$ la barra toca la superficie curva, y la normal a
              una circunferencia pasa por su centro. En $C$ toca el canto de
              la pista, así que la superficie que manda es la de la barra y la
              normal le es perpendicular. Es lo que sugiere la nota de la
              colección al pedir que se piense cómo son las reacciones en los
              contactos.
          - texto: Las dos verticales, porque la única carga es el peso
            mensaje: |
              El peso es vertical, pero una normal lo es a la superficie de
              contacto, no a la carga. Si las dos fueran verticales no habría
              nada que equilibrase nada horizontalmente y el ángulo saldría
              indeterminado.
          - texto: Las dos perpendiculares a la barra, porque actúan sobre ella
            mensaje: |
              En $C$ sí, porque ahí el contacto es contra un canto. En $A$ el
              contacto es contra la superficie curva, y entonces la normal es
              la de la circunferencia: pasa por $O$, no es perpendicular a la
              barra.

      - tipo: calcular
        titulo: El coseno del ángulo
        pregunta: |
          La barra está sometida a tres fuerzas, así que son concurrentes.
          ¿Cuánto vale $\cos\theta$ en el equilibrio?
        respuesta:
          tipo: numero
          valor: '0.919'
          tolerancia: 0.002
          formato: un número entre 0 y 1, con tres decimales
        distractores:
          - valor: '-0.544'
            mensaje: |
              Esa es la otra raíz de la ecuación de segundo grado. Es negativa,
              o sea $\theta > 90^{\circ}$: la barra estaría del otro lado y no
              tocaría la pista en dos puntos. Se descarta por la geometría.
          - valor: '0.7071'
            mensaje: |
              Sale de tomar la reacción de $C$ vertical, como si la barra se
              apoyase en un suelo horizontal. Entonces las tres fuerzas serían
              verticales, $A$ tendría que estar en el fondo de la pista y
              saldría $45^{\circ}$. En $C$ la normal es perpendicular a la
              barra.
        pista: |
          Las normales de $A$ y de $C$ se cortan en el punto $D$ diametralmente
          opuesto a $A$, porque el ángulo $ACD$ es recto por estar inscrito en
          una semicircunferencia. El peso pasa por ahí, así que el centro de la
          barra y $D$ tienen la misma abscisa.
        desarrollo: |
          Con el origen en $O$ y $C$ en $(R,\,0)$, el punto $A$ está a
          $2R\cos\theta$ de $C$ sobre la barra, así que su abscisa es
          $x_A = R - 2R\cos^{2}\theta$. El punto de corte de las dos normales
          es $D = -A$, y el peso pasa por $D$:

          $$
          x_A + \frac{3R}{2}\cos\theta = -x_A
          $$

          $$
          2\left(R - 2R\cos^{2}\theta\right) + \frac{3R}{2}\cos\theta = 0
          \;\Longrightarrow\; 8\cos^{2}\theta - 3\cos\theta - 4 = 0
          $$

          $$
          \cos\theta = \frac{3 + \sqrt{9 + 128}}{16} = 0{,}9190
          $$

      - tipo: calcular
        titulo: El ángulo
        pregunta: |
          ¿Cuánto vale $\theta$, en grados?
        respuesta:
          tipo: numero
          valor: '23.22'
          tolerancia: 0.05
          formato: un número, en grados, con dos decimales
        distractores:
          - valor: '66.78'
            mensaje: |
              Es el complementario: has hecho el arco seno de $0{,}919$ en vez
              del arco coseno, o has medido el ángulo desde la vertical. El
              enunciado lo mide con la horizontal.
          - valor: '45'
            mensaje: |
              Sale de suponer la reacción de $C$ vertical. Con esa hipótesis
              $A$ cae en el fondo de la pista, pero entonces los momentos no se
              anulan: el contacto en el canto da una normal perpendicular a la
              barra.
        pista: |
          $\theta = \arccos(0{,}9190)$.
        desarrollo: |
          $$
          \theta = \arccos(0{,}9190) = 23{,}22^{\circ}
          $$

          Coincide con el resultado que publica la colección.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Sobre la barra actúan tres fuerzas: la normal en $A$, que pasa
              por $O$; la normal en $C$, perpendicular a la barra; y el peso,
              vertical y aplicado en el centro.
          - texto: >-
              Al ser tres fuerzas no paralelas, tienen que concurrir en un
              punto, y ese punto es el diametralmente opuesto a $A$.
          - texto: >-
              Imponerlo da $8\cos^{2}\theta - 3\cos\theta - 4 = 0$, cuya raíz
              válida es $\cos\theta = 0{,}919$, o sea $\theta = 23{,}22^{\circ}$.
          - texto: >-
              Como no hay rozamiento, la barra no puede estar en equilibrio y
              resbala hasta el fondo de la pista.
            trampa: true
            mensaje: |
              El rozamiento no hace falta para que haya equilibrio: lo que
              sostiene la barra son dos normales con direcciones distintas. Hay
              una única posición en la que las tres fuerzas concurren, y esa es
              la del enunciado.
    resolucion: |
      **Las tres fuerzas.** La barra recibe la normal de la superficie curva en
      $A$ —dirigida hacia $O$, porque la normal a una circunferencia pasa por
      su centro—, la normal del canto en $C$ —perpendicular a la barra— y su
      peso $P$, vertical y aplicado en el punto medio. Tres fuerzas no
      paralelas en equilibrio son **concurrentes**.

      **Dónde concurren.** Tomando el origen en $O$ y $C$ en $(R,\,0)$, la
      normal de $A$ es la recta $AO$ y la de $C$ es perpendicular a la barra.
      Se cortan en el punto $D$ diametralmente opuesto a $A$: el ángulo $ACD$
      está inscrito en una semicircunferencia y por eso es recto, así que la
      perpendicular a la barra por $C$ pasa por $D$.

      **La ecuación.** La cuerda $AC$ mide $2R\cos\theta$, de modo que
      $x_A = R - 2R\cos^{2}\theta$ y $x_D = -x_A$. Que el peso pase por $D$
      significa que el centro de la barra tiene la abscisa de $D$:

      $$
      x_A + \frac{3R}{2}\cos\theta = -x_A
      \;\Longrightarrow\; 8\cos^{2}\theta - 3\cos\theta - 4 = 0
      $$

      $$
      \cos\theta = \frac{3 + \sqrt{137}}{16} = 0{,}9190
      \qquad
      \theta = 23{,}22^{\circ}
      $$

      La otra raíz, $-0{,}544$, daría un ángulo mayor de $90^{\circ}$ y no
      corresponde a la posición dibujada.

      **Comprobación.** Con ese ángulo la cuerda $AC$ mide
      $2R\cos\theta = 1{,}838R$, menor que los $3R$ de la barra: el punto $C$
      cae dentro de ella, como en la figura. El resultado coincide con el
      $23{,}22^{\circ}$ que publica la colección.

  - id: ejma3-col316-el-par-que-equilibra-la-manivela
    titulo: El par que mantiene en equilibrio la manivela y el disco
    fuente: >-
      Ejercicio 3.16 · Tema 3, «Estática del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      El sistema de la figura está contenido en un plano vertical y se
      encuentra en equilibrio por la acción de un par $P$ sobre $OA$. Sabiendo
      que no existe rozamiento y que las masas de $OA$, $CB$ y disco son $2M$,
      $3M/2$ y $M$, respectivamente, calcular el valor del par $P$ aplicado.

      <figure>
      <svg viewBox="0 0 330 235" role="img" width="330" height="235" aria-labelledby="ma3c316-t ma3c316-d">
