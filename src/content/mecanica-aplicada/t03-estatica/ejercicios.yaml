      <figcaption>

      El cable es uno solo: sale de **A**, pasa por la polea **B** y baja a
      **D**, los dos puntos de la misma pieza. La polea no tiene rozamiento, así
      que tira de **A** y de **D** con la misma fuerza.

      </figcaption>
      </figure>
    pide: La tracción del cable y las dos componentes de la reacción en C.
    pasos:
      - tipo: reconocer
        pregunta: |
          El cable $ABD$ pasa por la polea $B$ y sus dos extremos están en la
          misma pieza. ¿Cómo entra eso en el diagrama del sólido libre?
        opciones:
          - texto: Como dos fuerzas del mismo módulo T, una en A hacia B y otra en D hacia B
            correcta: true
            mensaje: |
              Eso es. La polea sin rozamiento no cambia la tracción, solo la
              dirección: el mismo $T$ tira en los dos extremos, y por eso hay
              una sola incógnita para el cable.
          - texto: Como dos tensiones distintas, una en el tramo AB y otra en el BD
            mensaje: |
              Serían distintas si la polea tuviera rozamiento o si el cable
              estuviera anudado a ella. Sin rozamiento, la tracción es la misma
              en todo el cable.
          - texto: Como una sola fuerza en A, porque D es donde el cable termina
            mensaje: |
              El cable tira igual de sus dos extremos, y los dos están en la
              pieza. Olvidar el ramal vertical de $D$ cambia por completo la
              ecuación de momentos.
          - texto: Como fuerzas internas, porque el cable empieza y acaba en la misma pieza
            mensaje: |
              No son internas: el cable pasa por una polea que está anclada a la
              pared, y por ahí entra la fuerza al sistema. Si aislaras pieza y
              polea juntas, aparecería la reacción del anclaje.

      - tipo: calcular
        titulo: La tracción del cable
        pregunta: |
          Tomando momentos en $C$, ¿cuánto vale $T$?
        respuesta:
          tipo: magnitud
          valor: '195 N'
          tolerancia: 0.01
          formato: una fuerza, con su unidad
        distractores:
          - valor: '136 N'
            mensaje: |
              Te has dejado el ramal vertical que tira de $D$ hacia arriba. Ese
              ramal da momento contrario en $C$ y por eso hace falta más
              tracción, no menos.
          - valor: '450 N'
            mensaje: |
              Has contado solo el tirón vertical de $D$, olvidando el de $A$.
              El de $A$ es el que más momento da: su componente horizontal tiene
              un brazo de 175 mm.
        pista: |
          De $A$ a $B$ hay 300 mm en horizontal y 125 en vertical, así que el
          cable mide 325 mm y su unitario es $(12/13;\ 5/13)$.
        desarrollo: |
          $$
          \sum M_C = -225 \cdot \frac{5T}{13} - 175 \cdot \frac{12T}{13}
          + 75\,T + 33750 = 0
          $$

          $$
          \frac{3225}{13}T - 75\,T = 33750
          \;\Longrightarrow\; T = 195\ \text{N}
          $$

      - tipo: calcular
        titulo: La componente horizontal de la reacción en C
        pregunta: |
          ¿Cuánto vale $C_x$, en newtons y con su signo, tomando positivo hacia
          la derecha?
        respuesta:
          tipo: numero
          valor: '-180'
          tolerancia: 1
          formato: un número, en N, con su signo
        distractores:
          - valor: '180'
            mensaje: |
              El módulo está bien y el signo no. El cable tira de $A$ hacia la
              derecha con 180 N, así que el soporte tiene que tirar hacia la
              izquierda.
          - valor: '0'
            mensaje: |
              Sería cero si el cable fuera vertical en los dos ramales. El ramal
              $AB$ está inclinado y aporta $12T/13 = 180$ N horizontales.
        pista: |
          $\sum F_x = 0$, y la única fuerza horizontal aparte de $C_x$ es la
          componente $12T/13$ del ramal $AB$.
        desarrollo: |
          $$
          C_x = -\frac{12}{13} \cdot 195 = -180\ \text{N}
          $$

      - tipo: calcular
        titulo: La componente vertical de la reacción en C
        pregunta: |
          ¿Cuánto vale $C_y$, en newtons y con su signo, tomando positivo hacia
          arriba?
        respuesta:
          tipo: numero
          valor: '-120'
          tolerancia: 1
          formato: un número, en N, con su signo
        distractores:
          - valor: '120'
            mensaje: |
              El módulo está bien y el signo no. Los dos ramales del cable
              levantan 270 N en total, más que los 150 N de la carga, así que el
              soporte tiene que tirar hacia abajo.
          - valor: '75'
            mensaje: |
              Te has dejado el ramal vertical de $D$, que tira hacia arriba con
              195 N. Con él, $C_y = 150 - 75 - 195$.
        pista: |
          $\sum F_y = 0$ con tres términos: la carga, la componente $5T/13$ del
          ramal $AB$ y los $T$ enteros del ramal $BD$.
        desarrollo: |
          $$
          C_y = 150 - \frac{5}{13} \cdot 195 - 195 = 150 - 75 - 195 = -120\ \text{N}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: La polea no tiene rozamiento, así que el mismo $T$ tira en $A$, hacia $B$, y en $D$, hacia arriba.
          - texto: El unitario de $A$ hacia $B$ es $(12/13;\ 5/13)$, porque hay 300 mm horizontales y 125 verticales.
          - texto: 'Momentos en C: $-225\,(5T/13) - 175\,(12T/13) + 75\,T + 150 \cdot 225 = 0$, y sale $T = 195$ N.'
          - texto: $\sum F_x = 0$ y $\sum F_y = 0$ dan $C_x = 180$ N y $C_y = 120$ N, las dos positivas.
            trampa: true
            mensaje: |
              Los módulos son esos, pero los dos signos son negativos: el cable
              tira de la pieza hacia la derecha y hacia arriba, y el soporte
              corrige tirando hacia la izquierda y hacia abajo. El resultado de
              la colección los publica con el signo menos.
    resolucion: |
      **El cable es uno solo.** Pasa por la polea $B$ sin rozamiento, así que
      su tracción $T$ es la misma en los dos ramales: tira de $A$ en la
      dirección $AB$ y de $D$ hacia arriba. Con eso, el problema tiene tres
      incógnitas —$T$, $C_x$ y $C_y$— y tres ecuaciones.

      **La geometría.** Con la esquina en el origen, $A(0, 175)$, $C(225, 0)$,
      $D(300, 0)$ y la polea en $(300, 300)$. De $A$ a la polea hay $(300, 125)$,
      325 mm: unitario $(12/13;\ 5/13)$.

      **Momentos en C.**

      $$
      -225 \cdot \frac{5T}{13} - 175 \cdot \frac{12T}{13} + 75\,T
      + 150 \cdot 225 = 0
      $$

      $$
      \frac{2250}{13}\,T = 33750 \;\Longrightarrow\; T = 195\ \text{N}
      $$

      **Las fuerzas.**

      $$
      C_x = -\frac{12}{13} \cdot 195 = -180\ \text{N}
      \qquad
      C_y = 150 - 75 - 195 = -120\ \text{N}
      $$

      Los dos signos negativos dicen que el soporte tira de la pieza hacia la
      izquierda y hacia abajo: el cable levanta más de lo que pesa la carga.
      Coincide con el resultado de la colección.

  - id: ejma3-col35-la-carga-en-tres-puntos-distintos
