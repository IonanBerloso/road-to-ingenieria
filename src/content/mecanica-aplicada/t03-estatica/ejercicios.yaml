        <line x1="298" y1="149.5" x2="312" y2="149.5" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="310" y1="46" x2="310" y2="149.5" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="306" y1="46" x2="314" y2="46" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="306" y1="149.5" x2="314" y2="149.5" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="316" y="100" font-size="9" fill="var(--faint)">690 mm</text>
        <line x1="131" y1="232" x2="131" y2="244" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="185" y1="52" x2="185" y2="244" stroke="var(--faint)" stroke-width="0.7" stroke-dasharray="3 3"/>
        <line x1="131" y1="240" x2="185" y2="240" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="131" y1="236" x2="131" y2="244" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="185" y1="236" x2="185" y2="244" stroke="var(--faint)" stroke-width="0.8"/>
