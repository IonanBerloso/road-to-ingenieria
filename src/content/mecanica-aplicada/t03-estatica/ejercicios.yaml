        <text x="56" y="134" font-size="11" fill="var(--ink)">A</text>
        <text x="208" y="126" font-size="11" fill="var(--ink)">B</text>
        <text x="86" y="112" font-size="10" fill="var(--faint)">R</text>
      </svg>
      </figure>
    pide: La longitud L de la barra, en funcion del radio R.
    pasos:
      - tipo: reconocer
        pregunta: |
          El conjunto barra más casquete se apoya en un suelo liso. ¿Qué
          condición de equilibrio da directamente la longitud?
        opciones:
          - texto: >-
              La normal del suelo pasa por O, así que el centro de gravedad del
              conjunto tiene que estar en la vertical de O
            correcta: true
            mensaje: |
              Eso es. El suelo es liso, así que su reacción es vertical, y la
              normal a una esfera pasa por su centro: la recta de acción pasa
              por $O$. Solo hay tres fuerzas verticales —los dos pesos y la
              normal—, y para que los momentos se anulen el peso total tiene que
              estar en esa misma vertical.
          - texto: >-
              Hay que separar la barra del casquete y escribir las tres
              ecuaciones de cada uno
            mensaje: |
              La nota de la colección avisa justo de lo contrario. El enunciado
              solo dice que no hay rozamiento **entre la semiesfera y el suelo**,
              así que entre barra y casquete puede haberlo, y separarlos mete
              incógnitas que la estática no puede despejar.
          - texto: >-
              El centro de gravedad del conjunto está en la vertical de O sea
              cual sea la longitud de la barra
            mensaje: |
              Eso es lo que hay que **imponer**, no un dato: es la ecuación del
              problema. Con otra longitud el centro de gravedad se sale de esa
              vertical y el conjunto vuelca hasta encontrar otra postura.

      - tipo: calcular
        titulo: El centro de gravedad del casquete
        pregunta: |
          El centro de gravedad del casquete está a $R/2$ de $O$ sobre su eje
          de simetría. ¿A qué distancia horizontal de $O$ queda, en unidades
          de $R$? Da el valor absoluto.
        respuesta:
          tipo: numero
          valor: '0.25'
          tolerancia: 0.005
          formato: un número, en unidades de R, con dos decimales
        distractores:
          - valor: '0.5'
            mensaje: |
              Has tomado $R/2$ como si fuera horizontal. El eje de simetría del
              casquete es perpendicular al borde, y el borde está inclinado
              $30^{\circ}$: hay que proyectar.
          - valor: '0.433'
            mensaje: |
              Has proyectado con el coseno. El eje del casquete forma
              $30^{\circ}$ con la **vertical**, así que su componente horizontal
              es $\frac{R}{2}\sin 30^{\circ}$.
          - valor: '0.1875'
            mensaje: |
              Has usado $3R/8$, que es el centro de gravedad de una semiesfera
              **maciza**. El enunciado habla de una superficie semiesférica, y
              la nota de la colección da el dato: $R/2$.
        pista: |
          El eje de simetría es perpendicular al borde. Si el borde forma
          $30^{\circ}$ con la horizontal, el eje forma $30^{\circ}$ con la
          vertical.
        desarrollo: |
          $$
          x_G = \frac{R}{2}\sin 30^{\circ} = \frac{R}{4} = 0{,}25R
          $$

          Queda hacia el lado del cuenco, o sea a la izquierda de $O$.

      - tipo: calcular
        titulo: La longitud de la barra
        pregunta: |
          ¿Cuánto vale $L/R$?
        respuesta:
          tipo: numero
          valor: '2.232'
          tolerancia: 0.005
          formato: un número, en unidades de R, con tres decimales
        distractores:
          - valor: '1.732'
            mensaje: |
              Sale de poner el centro de la barra en la vertical de $O$, es
              decir, de olvidar que el casquete también pesa y tira hacia el
              otro lado. Los dos pesos son iguales, así que el de la barra tiene
              que compensar exactamente el desplazamiento del casquete.
          - valor: '2.732'
            mensaje: |
              Arrastras el $R/2$ sin proyectar del apartado anterior. Con
              $x_G = R/4$ el centro de la barra tiene que caer en $+R/4$, no
              en $+R/2$.
          - valor: '2.598'
            mensaje: |
              Arrastras la proyección con el coseno, $0{,}433R$. El eje del
              casquete forma $30^{\circ}$ con la vertical y hay que usar el
              seno.
        pista: |
          El extremo $A$ está en $x = -R\cos 30^{\circ}$, y el centro de la
          barra tiene que caer en $+R/4$ para compensar al casquete.
        desarrollo: |
          El extremo $A$ está sobre la esfera, a la misma altura que el canto:

          $$
          x_A = -R\cos 30^{\circ} = -0{,}866R
          $$

          Los dos cuerpos pesan igual, así que el centro de gravedad del
          conjunto está en la vertical de $O$ cuando

          $$
          x_{G,\text{barra}} = -x_{G,\text{casquete}} = +\frac{R}{4}
          $$

          $$
          x_A + \frac{L}{2} = \frac{R}{4}
          \;\Longrightarrow\;
          L = 2\left(\frac{R}{4} + 0{,}866R\right) = \frac{1 + 2\sqrt{3}}{2}R
          = 2{,}232R
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El suelo es liso y la normal a una esfera pasa por su centro, así
              que la reacción del suelo es vertical y pasa por $O$.
          - texto: >-
              Barra y casquete se tratan como un solo sólido, y su centro de
              gravedad conjunto tiene que caer en la vertical de $O$.
          - texto: >-
              Con $x_G$ del casquete en $-R/4$ y $A$ en $-R\cos 30^{\circ}$,
              sale $L = (1+2\sqrt{3})R/2 = 2{,}232R$.
          - texto: >-
              Como la barra es horizontal y la normal es vertical, el peso de la
              barra no interviene en la condición de equilibrio.
            trampa: true
            mensaje: |
              Interviene, y es la mitad del problema: los dos cuerpos pesan
              $Mg$, y lo que fija $L$ es precisamente que el peso de la barra
              compense el desplazamiento del centro de gravedad del casquete.
              Sin él no habría ecuación.
    resolucion: |
      **Por qué no se separan.** El enunciado solo garantiza que no hay
      rozamiento **entre la semiesfera y el suelo**. Entre barra y casquete
      puede haberlo, así que aislarlos por separado introduce fuerzas
      tangenciales desconocidas. La nota de la colección lo dice: conviene
      tratar el conjunto como un único sólido rígido.

      **La condición.** Sobre el conjunto actúan tres fuerzas verticales: los
      dos pesos $Mg$ y la normal del suelo. Como el suelo es liso y la normal a
      una esfera pasa por su centro, esa reacción actúa sobre la vertical de
      $O$. Para que los momentos se anulen, el centro de gravedad del conjunto
      tiene que estar en esa misma vertical.

      **El casquete.** Su centro de gravedad está a $R/2$ de $O$ sobre el eje de
      simetría, que es perpendicular al borde. Con el borde a $30^{\circ}$ de la
      horizontal, el eje está a $30^{\circ}$ de la vertical:

      $$
      x_{G,\text{casquete}} = -\frac{R}{2}\sin 30^{\circ} = -\frac{R}{4}
      $$

      **La barra.** Su extremo $A$ está sobre la esfera, a la misma altura que
      el canto de apoyo, o sea en $x_A = -R\cos 30^{\circ}$. Como las dos masas
      son iguales:

      $$
      \frac{x_{G,\text{casquete}} + x_{G,\text{barra}}}{2} = 0
      \;\Longrightarrow\; x_{G,\text{barra}} = +\frac{R}{4}
      $$

      $$
      -R\cos 30^{\circ} + \frac{L}{2} = \frac{R}{4}
      \;\Longrightarrow\;
      L = \frac{R}{2} + \sqrt{3}R = \frac{1 + 2\sqrt{3}}{2}R = 2{,}232R
      $$

      que es el resultado publicado. Conviene fijarse en el signo: el cuenco
      cuelga hacia la izquierda y por eso la barra tiene que sobresalir hacia la
      derecha, no al revés.
