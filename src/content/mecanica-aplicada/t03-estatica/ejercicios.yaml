      </svg>
      <figcaption>

      La cuerda va de **C** a la polea en horizontal —justo por la altura de su
      punto más alto— y baja tangente por el otro lado, a 75 mm del eje **E**.
      Ese desplazamiento es lo que hace que **B** cargue más de 240 N.

      </figcaption>
      </figure>
    pide: Las componentes de las reacciones en A y en B.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por dónde pasa la recta de acción de la carga de 240 N?
        opciones:
          - texto: Por 75 mm a la derecha del eje E, porque el ramal que cuelga es tangente a la polea
            correcta: true
            mensaje: |
              Eso es. La cuerda toca la polea y baja por su borde, un radio más
              allá del eje. Con 600 + 75 = 675 mm de brazo respecto de $A$
              salen los 270 N de $B$.
          - texto: Por el eje E, porque la polea reconduce la carga a su centro
            mensaje: |
              La polea traslada la **resultante** de los dos ramales a su eje,
              pero cada ramal sigue estando donde está. Con la carga en el eje
              saldría $B_y = 240$ N y el problema perdería justo su detalle.
          - texto: Por la vertical de B, porque la polea cuelga de esa pieza
            mensaje: |
              $B$ está en $x = 600$ mm y el ramal, en 675. Que la polea esté
              montada en esa pieza no cambia dónde actúa la cuerda.
          - texto: Por el punto medio entre D y E, que es donde se reparte
            mensaje: |
              Una fuerza no se aplica «donde se reparte»: actúa sobre su recta
              de acción, la del ramal vertical de la cuerda.

      - tipo: calcular
        titulo: La componente vertical de la reacción en B
        pregunta: |
          Tomando momentos en $A$ para el conjunto, ¿cuánto vale $B_y$?
        respuesta:
          tipo: magnitud
          valor: '270 N'
          tolerancia: 0.01
          formato: una fuerza, con su unidad
        distractores:
          - valor: '240 N'
            mensaje: |
              Has puesto la carga en el eje de la polea, a 600 mm, justo en la
              vertical de $B$. El ramal que cuelga está 75 mm más a la derecha,
              y por eso $B$ carga más que el peso entero.
          - valor: '120 N'
            mensaje: |
              Has repartido la carga a medias entre $A$ y $B$. Aquí la carga
              cuelga **fuera** de los dos apoyos, así que uno tira hacia arriba
              y el otro hacia abajo.
        pista: |
          $\sum M_A = 600\,B_y - 240 \cdot 675 = 0$. Fíjate en que $B_x$ no
          aparece: $B$ está a la misma altura que $A$.
        desarrollo: |
          $$
          B_y = \frac{240 \cdot 675}{600} = 270\ \text{N}
          $$

      - tipo: calcular
        titulo: La componente vertical de la reacción en A
        pregunta: |
          ¿Cuánto vale $A_y$, en newtons y con su signo, tomando positivo hacia
          arriba?
        respuesta:
          tipo: numero
          valor: '-30'
          tolerancia: 0.5
          formato: un número, en N, con su signo
        distractores:
          - valor: '30'
            mensaje: |
              El módulo está bien y el signo no. $B$ ya tira hacia arriba con
              270 N, más que los 240 de la carga: $A$ tiene que tirar de la
              pieza hacia **abajo** para compensar.
          - valor: '0'
            mensaje: |
              Sería cero si la carga colgara justo de la vertical de $B$. Cuelga
              75 mm más allá, y esa excentricidad es la que carga a $A$ hacia
              abajo.
        pista: |
          $\sum F_y = 0$ del conjunto, con $B_y$ ya calculado.
        desarrollo: |
          $$
          A_y = 240 - 270 = -30\ \text{N}
          $$

      - tipo: calcular
        titulo: La componente horizontal de la reacción en A
        pregunta: |
          Aislando la pieza de la izquierda, ¿cuánto vale $A_x$, en newtons y
          con su signo, tomando positivo hacia la derecha?
        respuesta:
          tipo: numero
          valor: '-45'
          tolerancia: 0.5
          formato: un número, en N, con su signo
        distractores:
          - valor: '45'
            mensaje: |
              Ese es $B_x$, y sobre esta pieza el sentido es el contrario. La
              cuerda tira de $C$ hacia la derecha con 240 N, así que el techo
              tiene que sujetar la pieza tirando hacia la izquierda.
          - valor: '-90'
            mensaje: |
              Has usado un brazo equivocado para la cuerda. $C$ está 75 mm por
              encima del brazo horizontal, no 150: mira las dos cotas de la
              izquierda.
        pista: |
          Aísla la pieza $A$-$C$-$D$ y toma momentos en $D$: la cuerda tira en
          $C$ con 240 N horizontales y un brazo de 75 mm.
        desarrollo: |
          $$
          \sum M_D = -300\,A_y - 200\,A_x - 240 \cdot 75 = 0
          $$

          $$
          9000 - 200\,A_x - 18000 = 0 \;\Longrightarrow\; A_x = -45\ \text{N}
          $$

          Y $\sum F_x = 0$ del conjunto da $B_x = 45$ N.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: La cuerda tiene 240 N en los dos ramales, y el que cuelga baja tangente a la polea, por $x = 675$ mm.
          - texto: 'Momentos en A del conjunto: $600\,B_y = 240 \cdot 675$, así que $B_y = 270$ N y $A_y = -30$ N.'
          - texto: 'Aislando la pieza de la izquierda y tomando momentos en D: $A_x = -45$ N, y del conjunto $B_x = 45$ N.'
          - texto: Al aislar la pieza de la izquierda, la cuerda no cuenta, porque está por dentro del conjunto.
            trampa: true
            mensaje: |
              Es interna para el **conjunto**, pero en cuanto aíslas una pieza
              sola la cuerda la corta y aparece con sus 240 N en $C$. Sin ese
              término salen $A_x = 45$ N, con el signo cambiado.
    resolucion: |
      **La cuerda.** La polea no tiene rozamiento, así que sus dos ramales
      llevan los 240 N de la carga: el horizontal, que va de $C$ al punto más
      alto de la polea, y el vertical, tangente por el lado derecho, en
      $x = 600 + 75 = 675$ mm.

      **El conjunto.** Con $A$ en el origen, $B(600; 0)$. Como $B$ está a la
      misma altura que $A$, su componente horizontal no da momento:

      $$
      600\,B_y = 240 \cdot 675 \;\Longrightarrow\; B_y = 270\ \text{N}
      \qquad
      A_y = 240 - 270 = -30\ \text{N}
      $$

      **La pieza de la izquierda.** Recibe $A$, la cuerda en $C(0; -125)$ y el
      pasador $D(300; -200)$. Momentos en $D$:

      $$
      -300\,A_y - 200\,A_x - 240 \cdot 75 = 0
      \;\Longrightarrow\; A_x = -45\ \text{N}
      $$

      y $B_x = 45$ N.

      El resultado de la colección da estos cuatro valores, aunque rotula el
      último como $E_y$: es $B_y$, porque $E$ es el eje de la polea y el
      enunciado pide $A$ y $B$.
