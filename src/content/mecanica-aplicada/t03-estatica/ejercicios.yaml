      a. Fuerzas en las barras 4, 5, 6 mediante el método de las secciones.

      b. Fuerzas en las barras 1, 2, 3 mediante el método de las secciones.

      c. Fuerzas en las barras 7, 8, 9, 10, 11 mediante el método de los nudos.

