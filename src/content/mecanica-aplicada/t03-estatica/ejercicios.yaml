          </marker>
        </defs>
        <line x1="30" y1="175" x2="230" y2="175" stroke="var(--ink)" stroke-width="1"/>
        <path d="M36 175 L30 183 M52 175 L46 183 M68 175 L62 183 M84 175 L78 183 M100 175 L94 183 M116 175 L110 183 M132 175 L126 183 M148 175 L142 183 M164 175 L158 183 M180 175 L174 183 M196 175 L190 183 M212 175 L206 183 M228 175 L222 183" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <circle cx="138.3" cy="124" r="34" fill="var(--faint)" fill-opacity="0.2" stroke="var(--ink)" stroke-width="1.3"/>
        <line x1="50" y1="175" x2="167.8" y2="107" stroke="var(--ink)" stroke-width="2.6"/>
        <line x1="207" y1="175" x2="157.9" y2="89.9" stroke="var(--ink)" stroke-width="2.6"/>
        <path d="M50 175 L42 187 L58 187 Z" fill="none" stroke="var(--ink)" stroke-width="1.2"/>
        <path d="M207 175 L199 187 L215 187 Z" fill="none" stroke="var(--ink)" stroke-width="1.2"/>
        <line x1="138.3" y1="124" x2="167.8" y2="107" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="4 3"/>
        <path d="M74 152 Q64 138 76 130" fill="none" stroke="var(--d1)" stroke-width="1.8" marker-end="url(#ma3c316-f)"/>
        <text x="58" y="140" font-size="11" fill="var(--d1)">P</text>
