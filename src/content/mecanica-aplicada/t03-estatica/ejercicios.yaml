    pide: La constante elastica k del resorte, en funcion de M, g y R.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo es la fuerza que el disco hace sobre cada una de las dos
          barras?
        opciones:
          - texto: Perpendicular a la barra y de módulo Mg
            correcta: true
            mensaje: |
              Eso es. Sin rozamiento la fuerza es normal a la barra, o sea a
              $60^{\circ}$ de la vertical. Las dos normales sostienen el disco:
              $2N\cos 60^{\circ} = Mg$, y como $\cos 60^{\circ} = 1/2$, resulta
              $N = Mg$ en cada una, no la mitad del peso.
          - texto: Vertical y de módulo Mg/2, medio peso en cada barra
            mensaje: |
              El peso se reparte a medias por simetría, pero la fuerza de
              contacto no es vertical: sin rozamiento tiene que ser
              perpendicular a la barra, que está inclinada $60^{\circ}$.
          - texto: Perpendicular a la barra y de módulo Mg/2
            mensaje: |
              La dirección está bien y el módulo no. Al proyectar sobre la
              vertical cada normal aporta $N\cos 60^{\circ} = N/2$, así que para
              sumar $Mg$ entre las dos hace falta $N = Mg$.

      - tipo: calcular
        titulo: La normal entre disco y barra
        pregunta: |
          ¿Cuánto vale el coeficiente $c$ de esa normal, escrita como
          $N = c\,Mg$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número, con dos decimales
        distractores:
          - valor: '0.5'
            mensaje: |
              Has repartido el peso a medias sin proyectar. Cada normal está a
              $60^{\circ}$ de la vertical, así que solo aporta la mitad de su
              módulo a la ecuación vertical.
          - valor: '0.577'
            mensaje: |
              Has usado el seno donde va el coseno:
              $2N\sin 60^{\circ} = Mg$ daría $0{,}577Mg$. El ángulo de la
              normal con la vertical es $60^{\circ}$, el mismo que el de la
              barra con la horizontal.
        pista: |
          Equilibrio vertical del disco solo: $2N\cos 60^{\circ} = Mg$.
        desarrollo: |
          $$
          2N\cos 60^{\circ} = Mg \;\Longrightarrow\; N = \frac{Mg}{2 \cdot 0{,}5} = Mg
          $$

          El punto de contacto está sobre la rama superior, a
          $\sqrt{3}R$ del cruce: el centro del disco está a $2R$ del cruce
          —porque $d\sin 30^{\circ} = R$— y el contacto, a $2R\cos 30^{\circ}$.

      - tipo: calcular
        titulo: La fuerza del resorte
        pregunta: |
          Tomando momentos en el pasador del cruce para una de las barras,
          ¿cuánto vale el coeficiente $c$ de la fuerza del resorte,
          $F = c\,Mg$?
        respuesta:
          tipo: numero
          valor: '2.887'
          tolerancia: 0.01
          formato: un número, con tres decimales
        distractores:
          - valor: '2.309'
            mensaje: |
              Te has dejado el peso del disco al calcular la reacción del suelo.
              El suelo aguanta las dos barras **y** el disco: $3Mg$ entre los
              dos apoyos, o sea $3Mg/2$ en cada uno, no $Mg$.
          - valor: '1.155'
            mensaje: |
              Te has dejado la reacción del suelo. Respecto del cruce, esa
              reacción tiene un brazo grande y es la que más momento aporta:
              $\frac{3}{2}Mg \cdot \sqrt{3}R$.
        pista: |
          Momentos en el cruce, sobre una barra: la normal del disco
          ($Mg$ a $\sqrt{3}R$), la reacción del suelo ($3Mg/2$ en el pie) y la
          fuerza del resorte, cuyo brazo es la altura $3R/2$. El peso de la
          barra pasa por el cruce y no da momento.
        desarrollo: |
          $$
          Mg\sqrt{3}R + \frac{3}{2}Mg\,\sqrt{3}R = F \cdot \frac{3R}{2}
          $$

          $$
          F = \frac{\frac{5}{2}\sqrt{3}\,MgR}{\frac{3}{2}R}
          = \frac{5\sqrt{3}}{3}Mg = 2{,}887\,Mg
          $$

      - tipo: calcular
        titulo: La constante del resorte
        pregunta: |
          ¿Cuánto vale el coeficiente $c$ de la constante, escrita como
          $k = c\,Mg/R$?
        respuesta:
          tipo: numero
          valor: '1.667'
          tolerancia: 0.01
          formato: un número, con tres decimales
        distractores:
          - valor: '0.833'
            mensaje: |
              Has dividido entre la distancia entre los dos pies,
              $2\sqrt{3}R$. El resorte no va de pie a pie: va de una barra a
              otra a la altura $3R/2$, donde la separación es la mitad.
          - valor: '1.925'
            mensaje: |
              Has dividido entre $3R/2$, que es la **altura** a la que está el
              resorte, no su longitud. A esa altura las dos barras están
              separadas $\sqrt{3}R$.
        pista: |
          A la altura $3R/2$ las dos barras están separadas $\sqrt{3}R$, y en un
          resorte ideal la deformación es su propia longitud.
        desarrollo: |
          La anchura del aspa a la altura $y$ vale $2\,(3R - y)/\tan 60^{\circ}$;
          con $y = 3R/2$ sale $\sqrt{3}R$. Como el resorte es ideal, esa
          longitud es su deformación:

          $$
          k = \frac{F}{\delta} = \frac{\frac{5\sqrt{3}}{3}Mg}{\sqrt{3}R}
          = \frac{5}{3}\frac{Mg}{R} = 1{,}667\,\frac{Mg}{R}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El disco reparte su peso en dos normales perpendiculares a las
              barras, y como cada una está a $60^{\circ}$ de la vertical, vale
              $N = Mg$.
          - texto: >-
              El suelo es liso, así que sus reacciones son verticales, y por
              simetría cada pie soporta $3Mg/2$.
          - texto: >-
              Momentos en el cruce sobre una barra dan
              $F = 5\sqrt{3}Mg/3$, y dividiendo por la longitud
              $\sqrt{3}R$ del resorte, $k = 5Mg/(3R)$.
          - texto: >-
              El peso de la barra hay que ponerlo en la ecuación de momentos
              del cruce, porque la barra pesa $M$.
            trampa: true
            mensaje: |
              Pesa, pero su centro de gravedad es **el punto medio**, que es
              justo el pasador del cruce donde se toman momentos: su brazo es
              cero. Por eso conviene tomar momentos ahí y no en otro punto.
    resolucion: |
      **La geometría.** Cada barra mide $4R\sqrt{3}$ y forma $60^{\circ}$ con el
      suelo, así que el cruce está a $2R\sqrt{3}\sin 60^{\circ} = 3R$ de altura
      y cada pie, a $\sqrt{3}R$ del eje. El disco se apoya en las dos ramas
      superiores: su centro está a $2R$ del cruce sobre el eje —de
      $d\sin 30^{\circ} = R$— y los contactos, a $\sqrt{3}R$ del cruce.

      **El disco.** Sin rozamiento, las dos normales son perpendiculares a las
      barras:

      $$
      2N\cos 60^{\circ} = Mg \;\Longrightarrow\; N = Mg
      $$

      **El suelo.** Liso, así que las reacciones son verticales; el sistema
      entero pesa $3Mg$ y por simetría cada pie recibe $3Mg/2$.

      **Una barra sola, momentos en el cruce.** El peso de la barra se aplica en
      su punto medio, que es el propio cruce: no da momento. Quedan la normal
      del disco —brazo $\sqrt{3}R$—, la reacción del suelo —brazo $\sqrt{3}R$—
      y el resorte, cuyo brazo es la altura $3R/2$:

      $$
      Mg\sqrt{3}R + \frac{3}{2}Mg\sqrt{3}R = F\,\frac{3R}{2}
      \;\Longrightarrow\; F = \frac{5\sqrt{3}}{3}Mg
      $$

      **La constante.** A la altura $3R/2$ las barras están separadas
      $\sqrt{3}R$, y en un resorte ideal la deformación coincide con su
      longitud:

      $$
      k = \frac{F}{\delta} = \frac{5\sqrt{3}Mg/3}{\sqrt{3}R} = \frac{5Mg}{3R}
      $$

      que es el resultado que publica la colección.

  - id: ejma3-col318-la-barra-en-el-casquete-semiesferico
    titulo: La barra que se apoya dentro de un casquete semiesferico
    fuente: >-
      Ejercicio 3.18 · Tema 3, «Estática del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
