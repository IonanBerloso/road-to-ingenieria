        <text x="36" y="170" font-size="11" fill="var(--ink)">O</text>
        <text x="128" y="139" font-size="11" fill="var(--ink)">A</text>
        <text x="172" y="103" font-size="11" fill="var(--ink)">D</text>
        <text x="212" y="170" font-size="11" fill="var(--ink)">B</text>
        <text x="148" y="86" font-size="11" fill="var(--ink)">C</text>
        <text x="150" y="118" font-size="10" fill="var(--faint)">R</text>
