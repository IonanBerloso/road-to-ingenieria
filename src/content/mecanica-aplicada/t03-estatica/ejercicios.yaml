      </figure>
    pide: Las fuerzas de las barras pedidas, en funcion de P y con su caracter de traccion o compresion.
    pasos:
      - tipo: reconocer
        pregunta: |
          El nudo superior izquierdo no tiene carga y en él solo concurren las
          barras 7 y 9, que forman ángulo recto. ¿Qué se deduce?
        opciones:
          - texto: Que las dos son de esfuerzo nulo
            correcta: true
            mensaje: |
              Eso es. En un nudo descargado con solo dos barras no alineadas,
              cada dirección tiene que equilibrarse por su cuenta y las dos
              salen nulas. Es el atajo que resuelve el apartado c antes de
              empezar: $N_7 = N_9 = 0$.
          - texto: Que las dos valen lo mismo, porque el nudo está descargado
            mensaje: |
              Valdrían lo mismo si estuvieran alineadas, que es el otro caso
              clásico. Al formar ángulo recto, las dos ecuaciones del nudo se
              desacoplan y cada una obliga a que su barra valga cero.
          - texto: Que no se puede decir nada sin resolver antes las reacciones
            mensaje: |
              El equilibrio de un nudo no necesita las reacciones si en ese nudo
              no hay ninguna. Con dos barras no alineadas y sin carga, las dos
              ecuaciones dan cero directamente.

      - tipo: calcular
        titulo: La barra 4
        pregunta: |
          Cortando por las barras 4, 5 y 6 y tomando momentos en el nudo donde
          concurren 5 y 6, ¿cuánto vale el coeficiente de la barra 4, escrita
          como $N_4 = c\,P$, con la tracción positiva?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.02
          formato: un número, coeficiente de P, con su signo
        distractores:
          - valor: '-3'
            mensaje: |
              El módulo está bien y el signo no. La carga de $2P$ hace girar la
              parte derecha de forma que el cordón superior se estira: la barra
              4 trabaja a tracción.
          - valor: '2'
            mensaje: |
              Te has dejado la $P$ horizontal del nudo superior derecho. Su
              brazo respecto del nudo donde tomas momentos es $L$, así que
              aporta $PL$ al momento.
        pista: |
          Aísla la parte derecha de la sección. Tomando momentos en el nudo
          intermedio derecho, las barras 5 y 6 pasan por él y desaparecen.
        desarrollo: |
          Con el origen en ese nudo, la carga vertical $2P$ está a $L$ a la
          derecha y $L$ por encima, y la horizontal $P$ a la misma altura:

          $$
          L\,(-2P) - L\,(P) + L\,N_4 = 0 \;\Longrightarrow\; N_4 = 3P\ (t)
          $$

      - tipo: calcular
        titulo: La barra 5
        pregunta: |
          Con el equilibrio vertical de esa misma parte, ¿cuánto vale el
          coeficiente de $N_5$?
        respuesta:
          tipo: numero
          valor: '2.828'
          tolerancia: 0.01
          formato: un número, coeficiente de P, con su signo
        distractores:
          - valor: '2'
            mensaje: |
              Eso es la componente vertical de la diagonal, no su módulo. La
              barra 5 está a $45^{\circ}$, así que su esfuerzo es
              $2P/\sin 45^{\circ} = 2\sqrt{2}P$.
          - valor: '-2.828'
            mensaje: |
              El módulo está bien y el signo no. La diagonal tiene que tirar
              hacia arriba de la parte derecha para sostener la carga de $2P$:
              está a tracción.
        pista: |
          En la sección, la única barra cortada con componente vertical es la
          diagonal 5, que está a $45^{\circ}$.
        desarrollo: |
          $$
          -2P + \frac{N_5}{\sqrt{2}} = 0
          \;\Longrightarrow\; N_5 = 2\sqrt{2}\,P = 2{,}828\,P\ (t)
          $$

      - tipo: calcular
        titulo: La barra 6
        pregunta: |
          Y con el equilibrio horizontal, ¿cuánto vale el coeficiente de $N_6$?
        respuesta:
          tipo: numero
          valor: '-5'
          tolerancia: 0.02
          formato: un número, coeficiente de P, con su signo
        distractores:
          - valor: '-3'
            mensaje: |
              Es el valor que imprime la colección, y no cuadra. En el nudo
              intermedio central solo hay dos barras horizontales, la 11 y la 6,
              más dos verticales; el equilibrio horizontal de ese nudo obliga a
              que $N_6 = N_{11}$, y la propia colección publica $N_{11} = 5P$
              (c). Aquí se publica el $-5$ que dan los datos.
          - valor: '5'
            mensaje: |
              El módulo está bien y el signo no. El cordón intermedio se acorta
              bajo esta carga: la barra 6 trabaja a compresión.
        pista: |
          $\sum F_x$ de la parte derecha, con las dos cargas horizontales
          —la $P$ hacia la derecha de arriba y la $P$ hacia la izquierda del
          nudo intermedio— y las componentes de 4 y 5.
        desarrollo: |
          $$
          P - P - N_4 - \frac{N_5}{\sqrt{2}} - N_6 = 0
          $$

          $$
          -3P - 2P - N_6 = 0 \;\Longrightarrow\; N_6 = -5P\ (c)
          $$

          El nudo intermedio central lo confirma: ahí solo concurren las
          horizontales 11 y 6 y las verticales 10 y 3, así que
          $N_6 = N_{11} = -5P$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El nudo superior izquierdo está descargado y solo tiene dos barras
              no alineadas: $N_7 = N_9 = 0$.
          - texto: >-
              Cortando por 4, 5 y 6, los momentos en el nudo intermedio derecho
              dan $N_4 = 3P$ y el equilibrio vertical, $N_5 = 2\sqrt{2}P$.
          - texto: >-
              El equilibrio horizontal cierra la sección con $N_6 = -5P$, que es
              lo mismo que da el nudo intermedio central.
          - texto: >-
              Como la carga horizontal $P$ del nudo intermedio y la del nudo
              superior son iguales y opuestas, se cancelan y no afectan a
              ninguna barra.
            trampa: true
            mensaje: |
              Se cancelan en la **resultante** horizontal, pero no en los
              momentos: están aplicadas en puntos distintos y a alturas
              distintas, así que forman un par. Ese par es justo lo que
              distingue $N_4 = 3P$ de $N_4 = 2P$.
    resolucion: |
      **El atajo del apartado c.** El nudo superior izquierdo no tiene carga y en
      él concurren solo las barras 7 —horizontal— y 9 —vertical—. Las dos
      ecuaciones se desacoplan y dan $N_7 = N_9 = 0$.

      **Apartado a.** Se corta por 4, 5 y 6 y se aísla la parte derecha, con la
      carga $2P$ vertical y la $P$ horizontal del nudo superior derecho, más la
      $P$ hacia la izquierda del nudo intermedio derecho.

      $$
      N_4 = 3P\ (t)
      \qquad
      N_5 = 2\sqrt{2}\,P\ (t)
      \qquad
      N_6 = -5P\ (c)
      $$

      **Apartado b.** Cortando por 1, 2 y 3 y aislando la parte de arriba salen
      $N_1 = 5P$ (t), $N_2 = 0$ y $N_3 = -7P$ (c).

      **Apartado c.** Nudo a nudo, con $N_7 = N_9 = 0$: en el nudo intermedio
      izquierdo, $N_8 = 5\sqrt{2}P$ (t) y $N_{11} = -5P$ (c); en el superior
      izquierdo del nivel intermedio, $N_{10} = -7P$ (c).

      **Lo que no cuadra.** La colección publica $N_6 = 3P$ (c). En el nudo
      intermedio central concurren dos barras horizontales —la 11 y la 6— y dos
      verticales, así que el equilibrio horizontal de ese nudo obliga a
      $N_6 = N_{11}$; y la propia colección publica $N_{11} = 5P$ (c). Los otros
      diez valores impresos coinciden con los nuestros, así que lo más probable
      es una errata de copia entre $N_4$ y $N_6$. Se publica $-5P$.
  - id: ejma3-col323-la-pratt-con-la-carga-colgada
