      </figcaption>
      </figure>
    pide: Las componentes de las reacciones en A y en D.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué se sustituye la carga repartida en el diagrama del sólido
          libre?
        opciones:
          - texto: Por una fuerza de 20 N aplicada a 100 mm de A, en el centro del tramo cargado
            correcta: true
            mensaje: |
              Eso es. La resultante es el área del diagrama de carga,
              $100 \cdot 0{,}2 = 20$ N, y va aplicada en el centroide de ese
              área, que en un reparto uniforme es el punto medio.
          - texto: Por una fuerza de 100 N en el centro del tramo cargado
            mensaje: |
              100 es la carga **por metro**. Hay que multiplicarla por la
              longitud cargada, 0,2 m, para obtener una fuerza en newtons.
          - texto: Por una fuerza de 20 N aplicada en B, donde termina el reparto
            mensaje: |
              La resultante va en el centroide del diagrama de carga, no en su
              extremo. Ponerla en $B$ duplicaría su momento respecto de $A$.
          - texto: Por una fuerza de 30 N en el centro de la pieza, a 150 mm de A
            mensaje: |
              El reparto solo llega hasta $B$, a 200 mm; el tramo $BC$ no está
              cargado. Ni la resultante es 30 N ni está a 150 mm.

      - tipo: calcular
        titulo: La componente vertical de la reacción en A
        pregunta: |
          ¿Cuánto vale $A_y$, en newtons y con su signo, tomando positivo hacia
          arriba?
        respuesta:
          tipo: numero
          valor: '10'
          tolerancia: 0.5
          formato: un número, en N, con su signo
        distractores:
          - valor: '20'
            mensaje: |
              Esa es la resultante entera de la carga repartida. La viga $AB$
              está sostenida por sus dos extremos, $A$ y el pasador $B$, y como
              la carga es uniforme se la reparten a medias.
          - valor: '5'
            mensaje: |
              Has repartido 20 N entre cuatro, o has tomado la mitad de la
              mitad. Los apoyos de la viga $AB$ son dos, $A$ y $B$, y cada uno
              se lleva 10 N.
        pista: |
          Aísla solo la viga $AB$ y toma momentos en $B$. Con la carga
          uniforme, la simetría ya adelanta el resultado.
        desarrollo: |
          $$
          \sum M_B = -A_y \cdot 200 + 20 \cdot 100 = 0
          \;\Longrightarrow\; A_y = 10\ \text{N}
          $$

      - tipo: calcular
        titulo: La componente horizontal de la reacción en A
        pregunta: |
          ¿Cuánto vale $A_x$, en newtons y con su signo, tomando positivo hacia
          la derecha?
        respuesta:
          tipo: numero
          valor: '20'
          tolerancia: 0.5
          formato: un número, en N, con su signo
        distractores:
          - valor: '10'
            mensaje: |
              10 N es el valor de $P$. La horizontal de $A$ no vale lo mismo
              que $P$ porque $D$ también aporta la suya: entre las dos
              equilibran $P$.
          - valor: '-20'
            mensaje: |
              El módulo está bien y el sentido no. $P$ empuja el montante hacia
              la izquierda, y para no volcar alrededor de $D$ la viga tiene que
              tirar del montante hacia la derecha: en $A$ la reacción va hacia
              la derecha.
          - valor: '0'
            mensaje: |
              Sería cero si no hubiera fuerzas horizontales, pero está $P$. La
              viga $AB$ transmite esa horizontal entera desde $B$ hasta $A$: es
              lo único horizontal que tiene.
        pista: |
          Aísla la pieza $BCD$ y toma momentos en $D$. En $B$ recibe de la viga
          $(-B_x;\ -10)$, y $P$ tiene un brazo de 300 mm.
        desarrollo: |
          $$
          \sum M_D = 1000 + 200\,B_x + 3000 = 0
          \;\Longrightarrow\; B_x = -20\ \text{N}
          $$

          Ese $B_x$ es la componente que $BCD$ ejerce sobre la viga, así que
          sobre la viga apunta hacia la izquierda y $\sum F_x = 0$ en $AB$ da
          $A_x = 20$ N.

      - tipo: calcular
        titulo: La componente horizontal de la reacción en D
        pregunta: |
          ¿Cuánto vale $D_x$, en newtons y con su signo, tomando positivo hacia
          la derecha?
        respuesta:
          tipo: numero
          valor: '-10'
          tolerancia: 0.5
          formato: un número, en N, con su signo
        distractores:
          - valor: '10'
            mensaje: |
              Ese es el módulo, y es el valor que imprime la colección, pero el
              sentido es el contrario. Con todo el conjunto aislado,
              $\sum F_x = A_x + D_x - P = 0$ y con $A_x = 20$ y $P = 10$ sale
              $D_x = -10$ N, o sea 10 N hacia la izquierda.
          - valor: '-20'
            mensaje: |
              Ese es el valor de $A_x$ cambiado de signo. Entre $A_x$ y $D_x$
              tienen que sumar los 10 N de $P$, no cancelarse.
        pista: |
          El camino más corto es aislar **todo el conjunto**: solo quedan $A$,
          $D$ y las cargas exteriores.
        desarrollo: |
          $$
          \sum F_x = 20 + D_x - 10 = 0 \;\Longrightarrow\; D_x = -10\ \text{N}
          $$

          Y $\sum F_y = 0$ del conjunto da $D_y = 20 - 10 = 10$ N.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: La carga repartida se sustituye por 20 N a 100 mm de $A$, y la viga $AB$ da $A_y = 10$ N y $B_y = 10$ N.
          - texto: 'Momentos en D sobre BCD: la fuerza de $B$ y la $P$ del extremo dan $B_x = -20$ N, o sea $A_x = 20$ N.'
          - texto: $\sum F$ del conjunto da $D_x = -10$ N y $D_y = 10$ N.
          - texto: En B se dibuja la misma fuerza sobre las dos piezas, porque la articulación las une.
            trampa: true
            mensaje: |
              En cada pieza va con el sentido contrario. Si las dibujas iguales,
              al sumar las ecuaciones de las dos piezas aparecería una fuerza
              interna que no se cancela, y el resultado sale con el signo
              cambiado.
    resolucion: |
      **La carga repartida.** Uniforme de 100 N/m sobre 200 mm: resultante
      $20$ N en el punto medio, a 100 mm de $A$.

      **La viga AB.** Solo tiene la carga y los dos pasadores, así que
      momentos en $B$ dan $A_y = 10$ N, y $\sum F_y$ da que el pasador aporta
      otros 10 N hacia arriba.

      **La pieza BCD.** Recibe en $B$ la reacción de la viga, la fuerza $P$ en
      $C$ y la articulación $D$. Con el origen en $A$, $B(200; 0)$,
      $C(300; 100)$ y $D(300; -200)$; momentos en $D$:

      $$
      1000 + 200\,B_x + 3000 = 0 \;\Longrightarrow\; B_x = -20\ \text{N}
      $$

      y por tanto $A_x = 20$ N.

      **El conjunto.**

      $$
      D_x = -10\ \text{N}
      \qquad
      D_y = 10\ \text{N}
      $$

      **Sobre el signo de $D_x$.** La colección imprime $D_x = 10$ N. El módulo
      es ese, pero con el criterio de signos del propio resultado —el que da
      $A_x = 20$ N positiva hacia la derecha— la suma de fuerzas horizontales
      obliga a que $D_x$ sea negativa: $P$ empuja hacia la izquierda con 10 N y
      $A$ ya empuja hacia la derecha con 20. Aquí se publica $-10$ N y se
      entiende que el impreso da el módulo.

  - id: ejma3-col38-el-alambre-doblado-y-su-angulo
    titulo: El ángulo que deja horizontal un tramo de alambre
    fuente: >-
      Ejercicio 3.8 · Tema 3, «Estática del sólido rígido» · Mecánica Aplicada,
      UPV/EHU, curso 2025-2026. La colección publica el resultado, contra el
      que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Un alambre homogéneo $ABCD$ se dobla tal y como se muestra en la figura,
      estando articulado en el punto $B$. Calcular el ángulo $\theta$ para que
      el tramo $BC$ permanezca horizontal.

