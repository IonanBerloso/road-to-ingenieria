      <figcaption>

      Las cuatro vigas del enunciado. La **d** tiene una **rótula** en B —el
      circulito dentro de la viga—: transmite fuerza pero no momento, y es lo
      que la hace isostática con un empotramiento en el extremo.

      </figcaption>
      </figure>
    pide: Las reacciones de los apoyos de cada una de las cuatro vigas.
    pasos:
      - tipo: reconocer
        pregunta: |
          En la viga **a**, ¿por qué fuerza se sustituye la carga triangular?
        opciones:
          - texto: Por 17,5 T aplicadas a 4,67 m de A, en el centroide del triángulo de carga
            correcta: true
            mensaje: |
              Eso es. La resultante es el área del diagrama, $5 \cdot 7/2 =
              17{,}5$ T, y va en el centroide del triángulo, a dos tercios de la
              base desde el vértice, o sea a $2 \cdot 7/3 = 4{,}67$ m de $A$.
          - texto: Por 17,5 T aplicadas en el centro de la viga, a 3,5 m de A
            mensaje: |
              El valor está bien y el punto no. El centro solo vale para un
              reparto uniforme; en un triángulo hay mucha más carga cerca de
              $B$, y el centroide se corre hacia allí.
          - texto: Por 35 T aplicadas a 4,67 m de A
            mensaje: |
              35 sería $5 \cdot 7$, el área del **rectángulo**. El diagrama es
              un triángulo, así que su área es la mitad.
          - texto: Por 5 T aplicadas en B, donde la carga es máxima
            mensaje: |
              5 T/m es la carga por metro en el punto más cargado, no una
              fuerza. Hay que integrar a lo largo de la viga, y eso da el área
              del diagrama.

      - tipo: calcular
        titulo: La reacción del apoyo móvil de la viga a
        pregunta: |
          En la viga **a**, ¿cuánto vale la reacción vertical en $B$, en
          toneladas?
        respuesta:
          tipo: numero
          valor: '11.667'
          tolerancia: 0.05
          formato: un número, en T, positivo hacia arriba
        distractores:
          - valor: '8.75'
            mensaje: |
              Has repartido las 17,5 T a medias. La resultante está a 4,67 m de
              $A$ y solo a 2,33 m de $B$, así que $B$ carga con el doble que
              $A$.
          - valor: '5.833'
            mensaje: |
              Esa es la reacción en $A$. La carga está mucho más cerca de $B$,
              y el apoyo cercano es el que más se lleva.
        pista: |
          Momentos en $A$: $R_B \cdot 7 = 17{,}5 \cdot 4{,}67$.
        desarrollo: |
          $$
          R_B = \frac{17{,}5 \cdot 14/3}{7} = \frac{35}{3} = 11{,}67\ \text{T}
          \qquad
          R_A = 17{,}5 - 11{,}67 = 5{,}83\ \text{T}
          $$

          Y $A_x = 0$, porque no hay ninguna carga horizontal.

      - tipo: calcular
        titulo: El momento del empotramiento de la viga b
        pregunta: |
          En la viga **b**, ¿cuánto vale el momento del empotramiento, en
          toneladas por metro y en valor absoluto?
        respuesta:
          tipo: numero
          valor: '19.5'
          tolerancia: 0.2
          formato: un número, en T·m
        distractores:
          - valor: '18.75'
            mensaje: |
              Has puesto la resultante de 7,5 T en el centro del tramo cargado,
              a 2,5 m. El trapecio no es simétrico: su centroide está algo más
              a la derecha, a 2,6 m.
          - valor: '15'
            mensaje: |
              Has puesto la resultante en el centro de la **viga**, a 2 m. El
              tramo cargado empieza a 1 m del empotramiento y termina a 4.
          - valor: '7.5'
            mensaje: |
              7,5 T es la resultante de la carga, no su momento. Falta
              multiplicar por el brazo.
        pista: |
          Parte el trapecio en un rectángulo de 2 T/m sobre 3 m y un triángulo
          de 1 T/m sobre 3 m, y suma los dos momentos respecto de $A$.
        desarrollo: |
          $$
          M_A = 6 \cdot 2{,}5 + 1{,}5 \cdot 3 = 15 + 4{,}5 = 19{,}5\ \text{T·m}
          $$

          El rectángulo son 6 T con su centroide a 2,5 m y el triángulo, 1,5 T
          a 3 m. La reacción vertical es $R_A = 7{,}5$ T hacia arriba, y el
          momento del empotramiento es antihorario.

      - tipo: calcular
        titulo: La reacción del apoyo móvil de la viga c
        pregunta: |
          En la viga **c**, ¿cuánto vale la reacción en $B$, en toneladas y con
          su signo, tomando positivo hacia arriba?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.05
          formato: un número, en T, con su signo
        distractores:
          - valor: '0'
            mensaje: |
              Un par no tiene resultante, pero sí momento, y ese momento hay
              que equilibrarlo. Lo hace la pareja de reacciones de los dos
              apoyos, que son iguales y opuestas.
          - valor: '1.5'
            mensaje: |
              Has dividido el par entre los 4 m del voladizo. Lo que equilibra
              el par es la pareja $R_A$-$R_B$, cuyo brazo es la distancia entre
              los dos apoyos, 6 m.
          - valor: '0.6'
            mensaje: |
              Has dividido entre los 10 m de la viga entera. El brazo de la
              pareja de reacciones es la separación entre $A$ y $B$, 6 m; el
              voladizo no cuenta.
        pista: |
          El par es el mismo respecto de cualquier punto. Momentos en $A$:
          $R_B \cdot 6 - 6 = 0$.
        desarrollo: |
          $$
          R_B = 1\ \text{T (hacia arriba)}
          \qquad
          R_A = -1\ \text{T (hacia abajo)}
          $$

          Las dos reacciones forman una pareja de 6 T·m que equilibra al par
          aplicado, y da igual dónde esté aplicado: un par tiene el mismo
          momento respecto de todos los puntos.

      - tipo: calcular
        titulo: El momento del empotramiento de la viga d
        pregunta: |
          En la viga **d**, ¿cuánto vale el momento del empotramiento $C$, en
          kilonewtons por metro y con su signo, tomando positivo el
          antihorario?
        respuesta:
          tipo: numero
          valor: '-4'
          tolerancia: 0.2
          formato: un número, en kN·m, con su signo
        distractores:
          - valor: '4'
            mensaje: |
              El módulo está bien y el sentido no. El tramo $AB$ empuja a la
              rótula hacia abajo con 4 kN a 2 m de $C$, y eso pide un momento
              horario en el empotramiento.
          - valor: '8'
            mensaje: |
              Te has dejado la carga repartida hacia arriba del tramo $BC$, que
              da 4 kN a 1 m de $C$ y descuenta la mitad del momento.
          - valor: '0'
            mensaje: |
              La reacción vertical de $C$ sí es cero, pero el momento no. Son
              cosas distintas: las fuerzas se cancelan y sus momentos no,
              porque actúan en puntos diferentes.
        pista: |
          Empieza por el tramo $AB$, que con el apoyo móvil y la rótula se
          resuelve solo: la rótula pasa 4 kN al tramo $BC$.
        desarrollo: |
          $$
          R_A = 4\ \text{kN}
          \qquad
          \text{en la rótula, } 4\ \text{kN}
          $$

          En el tramo $BC$, con 4 kN hacia abajo en $B$ y la resultante de
          $q_2$, 4 kN hacia arriba a 1 m de $C$:

          $$
          C_y = 0
          \qquad
          M_C = -\left(4 \cdot 2 - 4 \cdot 1\right) = -4\ \text{kN·m}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento de la viga d. Una pieza es falsa.
        piezas:
          - texto: La rótula de $B$ transmite fuerza pero no momento, así que el tramo $AB$ se puede aislar y resolver solo.
          - texto: En $AB$, con 8 kN a 1 m de $A$, salen $R_A = 4$ kN y 4 kN en la rótula.
          - texto: En $BC$ actúan esos 4 kN hacia abajo en $B$ y los 4 kN hacia arriba de $q_2$, así que $C_y = 0$ y $M_C = 4$ kN·m en sentido horario.
          - texto: Como la reacción vertical del empotramiento sale nula, el empotramiento no trabaja y se podría quitar.
            trampa: true
            mensaje: |
              Que $C_y$ salga cero no significa que el empotramiento no haga
              nada: está dando un momento de 4 kN·m. Si lo quitas, la viga gira
              alrededor de la rótula.
    resolucion: |
      **a. Carga triangular.** Resultante $5 \cdot 7/2 = 17{,}5$ T en el
      centroide del triángulo, a $2 \cdot 7/3 = 4{,}67$ m de $A$.

      $$
      R_B = \frac{17{,}5 \cdot 4{,}67}{7} = 11{,}67\ \text{T}
      \qquad
      R_A = 5{,}83\ \text{T}
      \qquad
      A_x = 0
      $$

      **b. Ménsula con carga trapecial.** Se parte en rectángulo y triángulo:
      6 T a 2,5 m y 1,5 T a 3 m.

      $$
      R_A = 7{,}5\ \text{T}
      \qquad
      M_A = 19{,}5\ \text{T·m (antihorario)}
      $$

      **c. Par en el voladizo.** Un par no tiene resultante, así que las dos
      reacciones son iguales y opuestas, y su pareja equilibra el par:

      $$
      R_B = 1\ \text{T hacia arriba}
      \qquad
      R_A = 1\ \text{T hacia abajo}
      $$

      El voladizo de 4 m no interviene: da igual dónde se aplique el par.

      **d. Viga Gerber.** La rótula de $B$ no transmite momento, así que el
      tramo $AB$ —apoyo móvil y rótula— se resuelve solo: con 8 kN a 1 m de
      $A$, $R_A = 4$ kN y la rótula pasa otros 4 kN. En el tramo $BC$, esos
      4 kN hacia abajo y los 4 kN hacia arriba de $q_2$, aplicados a 1 m de
      $C$:

      $$
      C_y = 0
      \qquad
      M_C = 4\ \text{kN·m (horario)}
      $$

      La colección no publica el resultado de este ejercicio; estas cuatro
      soluciones son nuestras, y cada una está comprobada dos veces —a mano y
      resolviendo el sistema de equilibrio numéricamente, con las resultantes
      obtenidas por integración del diagrama de carga—.

  - id: ejma3-col312-la-placa-articulada-y-el-cable
    titulo: Una placa con cable, con y sin su propio peso
    fuente: >-
      Ejercicio 3.12 · Tema 3, «Estática del sólido rígido» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado;
      las dos componentes de la reacción del apartado e discrepan y están
      explicadas en la resolución.
    nivel: practica
    enunciado: |
      La placa $ABCD$ de masa uniforme está articulada en $A$ y unida a un
      cable en $D$ tal y como muestra la figura. Sobre el punto $C$ se aplica
      una fuerza horizontal $P = 50$ N. Calcular:

      a. La posición del centro de gravedad de la placa $ABCD$ según sistema
      $xy$.

      b. El momento de inercia de la placa $ABCD$ respecto de los ejes $x$ e
      $y$ ($I_x$ e $I_y$ respectivamente) por integración explicando los pasos
      seguidos.

      c. El momento de inercia polar respecto del punto $A$ ($I_A$).

      d. Despreciando la masa de la placa $ABCD$, reacción en $A$ y fuerza del
      cable en el equilibrio.

      e. Teniendo en cuenta que la placa $ABCD$ tiene una masa de 10 kg,
      reacción en $A$ y fuerza del cable en el equilibrio.

