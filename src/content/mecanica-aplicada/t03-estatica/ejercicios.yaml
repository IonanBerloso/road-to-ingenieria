        <desc id="ma3c317-d">Dos barras iguales se cruzan en aspa y están articuladas en su punto medio. Sus extremos inferiores D y B se apoyan en un suelo liso formando 60 grados con él, y sus extremos superiores A y C se abren hacia arriba. Un disco de radio R descansa en el hueco que dejan las dos ramas superiores. Un resorte horizontal une las dos ramas inferiores a una altura de tres medios de R sobre el suelo.</desc>
