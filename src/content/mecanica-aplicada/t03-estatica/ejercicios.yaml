    pide: Las reacciones en A y en E y la fuerza de la barra BD, en funcion de P.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué tiene de especial la barra $BD$ y cuántas incógnitas ahorra?
        opciones:
          - texto: >-
              Es un sólido de dos fuerzas: solo recibe carga en B y en D, así
              que su fuerza va en la dirección BD y es una sola incógnita
            correcta: true
            mensaje: |
              Eso es. $BD$ está articulada en sus dos extremos y no tiene carga
              entre ellos, así que trabaja a tracción o compresión en su propia
              dirección. Como va de $B(0;\,4a)$ a $D(8a;\,10a)$, mide $10a$ y su
              unitario es $(0{,}8;\ 0{,}6)$: una incógnita en vez de dos.
          - texto: >-
              Es una barra empotrada en sus extremos, así que transmite también
              un momento
            mensaje: |
              Los círculos de la figura en $B$ y en $D$ son articulaciones, no
              empotramientos. Una articulación deja girar y por eso no
              transmite momento.
          - texto: >-
              Es una barra cualquiera: en cada extremo hay que poner dos
              componentes
            mensaje: |
              Se pueden poner, pero es trabajo de más: el equilibrio de la
              propia barra demuestra enseguida que las dos fuerzas tienen que
              ser iguales, opuestas y sobre la recta $BD$. Reconocerlo quita dos
              incógnitas del problema.

      - tipo: calcular
        titulo: La fuerza de la barra diagonal
        pregunta: |
          ¿Cuánto vale el coeficiente de la fuerza en $BD$, escrita como
          $T = c\,P$, con la tracción positiva?
        respuesta:
          tipo: numero
          valor: '1.4583'
          tolerancia: 0.005
          formato: un número, coeficiente de P, con cuatro decimales
        distractores:
          - valor: '-2.1875'
            mensaje: |
              Sale de suponer que en $C$ no hay componente horizontal. La
              articulación $C$ transmite las dos, y la horizontal vale
              $C_x = -0{,}8\,T$: sin ella la ecuación de momentos de $ABC$ queda
              coja.
          - valor: '1.9444'
            mensaje: |
              Has intercambiado los cosenos directores de $BD$. La barra va de
              $B(0;\,4a)$ a $D(8a;\,10a)$: avanza $8a$ en horizontal y $6a$ en
              vertical, así que su unitario es $(0{,}8;\ 0{,}6)$, no
              $(0{,}6;\ 0{,}8)$.
        pista: |
          Momentos en $A$ para la barra $ABC$ sola, con $C_x = -0{,}8\,T$ del
          equilibrio horizontal de la viga.
        desarrollo: |
          Equilibrio horizontal de la viga $CDE$, cuya única fuerza horizontal
          además de $C$ es la de la barra:

          $$
          -C_x - 0{,}8\,T = 0 \;\Longrightarrow\; C_x = -0{,}8\,T
          $$

          Momentos en $A$ para $ABC$, con $P$ a $7a$ y la barra tirando de $B$
          a $4a$:

          $$
          -7aP - 4a\,(0{,}8\,T) - 10a\,C_x = 0
          $$

          $$
          -7P - 3{,}2\,T + 8\,T = 0 \;\Longrightarrow\; T = \frac{35}{24}P
          = 1{,}4583\,P\ (t)
          $$

      - tipo: calcular
        titulo: La reacción del apoyo simple
        pregunta: |
          ¿Cuánto vale el coeficiente de la reacción vertical en $E$?
        respuesta:
          tipo: numero
          valor: '5.2778'
          tolerancia: 0.005
          formato: un número, coeficiente de P, con cuatro decimales
        distractores:
          - valor: '4.5'
            mensaje: |
              Es la mitad de la carga total, $9P/2$: has repartido la carga
              repartida entre los dos extremos de la viga como si la barra $BD$
              no tirase de ella en $D$. Esa barra sostiene parte de la viga y
              cambia el reparto.
          - valor: '8.7778'
            mensaje: |
              Has puesto la resultante de la carga repartida en $D$, a $8a$ de
              $C$. Una carga uniforme se sustituye por su resultante en el
              **centro** del tramo cargado, aquí a $4{,}5a$ de $C$.
        pista: |
          La carga repartida vale $q_{0} = P/a$ sobre los $9a$ de la viga: su
          resultante es $9P$ en el centro. Momentos en $C$ para la viga.
        desarrollo: |
          $$
          9a\,E_y - 9P \cdot 4{,}5a - 8a\,(0{,}6\,T) = 0
          $$

          $$
          9\,E_y = 40{,}5 + 4{,}8 \cdot \frac{35}{24} = 47{,}5
          \;\Longrightarrow\; E_y = \frac{95}{18}P = 5{,}2778\,P
          $$

      - tipo: calcular
        titulo: La reacción vertical en A
        pregunta: |
          ¿Y el coeficiente de $A_y$, positiva hacia arriba?
        respuesta:
          tipo: numero
          valor: '3.7222'
          tolerancia: 0.005
          formato: un número, coeficiente de P, con cuatro decimales
        distractores:
          - valor: '5.2778'
            mensaje: |
              Ese es el valor de $E_y$. Las dos reacciones verticales suman los
              $9P$ de la carga repartida, así que no pueden ser iguales:
              $9 - 5{,}2778 = 3{,}7222$.
          - valor: '4.5'
            mensaje: |
              Has repartido la carga a medias entre los dos apoyos. La carga no
              está centrada respecto de ellos y además la barra $BD$ y la fuerza
              $P$ desplazan el reparto.
        pista: |
          $\sum F_y = 0$ para el conjunto: solo hay la carga repartida y las dos
          reacciones verticales.
        desarrollo: |
          $$
          A_y + E_y - 9P = 0
          \;\Longrightarrow\; A_y = 9P - \frac{95}{18}P = \frac{67}{18}P
          = 3{,}7222\,P
          $$

          Y del equilibrio horizontal del conjunto, $A_x = -P$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $BD$ es una barra de dos fuerzas: su unitario es
              $(0{,}8;\ 0{,}6)$ y aporta una sola incógnita.
          - texto: >-
              El equilibrio horizontal de la viga da $C_x = -0{,}8\,T$, y
              momentos en $A$ sobre $ABC$ dan $T = 35P/24$ a tracción.
          - texto: >-
              Momentos en $C$ sobre la viga dan $E_y = 95P/18$, y el equilibrio
              vertical del conjunto, $A_y = 67P/18$.
          - texto: >-
              Como la fuerza $P$ es horizontal y la carga repartida vertical,
              cada una se equilibra por su lado y $P$ no influye en $E_y$.
            trampa: true
            mensaje: |
              Influye a través del momento. La $P$ está aplicada a $7a$ del
              suelo y hace girar la barra $ABC$; ese giro lo frena la diagonal
              $BD$, que a su vez tira de la viga en $D$ y cambia $E_y$. Sin la
              $P$, la barra no trabajaría igual y $E_y$ sería otra.
    resolucion: |
      **Lo primero, la barra de dos fuerzas.** $BD$ está articulada en sus dos
      extremos y no lleva carga entre ellos, así que su fuerza va en la
      dirección $BD$. De $B(0;\,4a)$ a $D(8a;\,10a)$ hay $10a$, con unitario
      $(0{,}8;\ 0{,}6)$.

      **Las cargas.** La repartida vale $q_{0} = P/a$ a lo largo de los $9a$ de
      la viga: resultante $9P$ en el centro, a $4{,}5a$ de $C$. La fuerza
      horizontal $P$ actúa sobre $ABC$ a $7a$ del suelo.

      **Las ecuaciones.** Del equilibrio horizontal de la viga,
      $C_x = -0{,}8\,T$. Momentos en $A$ para $ABC$:

      $$
      -7aP - 4a\,(0{,}8\,T) - 10a\,C_x = 0
      \;\Longrightarrow\; T = \frac{35}{24}P\ (t)
      $$

      Momentos en $C$ para la viga:

      $$
      9a\,E_y = 9P \cdot 4{,}5a + 8a\,(0{,}6\,T)
      \;\Longrightarrow\; E_y = \frac{95}{18}P
      $$

      Y las fuerzas del conjunto:

      $$
      A_y = 9P - \frac{95}{18}P = \frac{67}{18}P
      \qquad
      A_x = -P
      $$

      Los tres valores que publica la colección —$R_E = 95P/18$,
      $R_{Ay} = 67P/18$ y $T_{BD} = 35P/24$ a tracción— salen exactos. La
      componente horizontal de $A$, que la colección no imprime, vale $-P$:
      equilibra ella sola la fuerza horizontal del enunciado, porque el apoyo de
      $E$ es simple y solo da reacción vertical.

  - id: ejma3-col327-la-anilla-el-muelle-y-los-dos-cables
    titulo: La anilla que desliza por la guia circular con muelle y dos cables
    fuente: >-
