        <line x1="60" y1="108" x2="60" y2="130" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="150" y1="108" x2="150" y2="130" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="240" y1="126" x2="240" y2="130" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="60" y1="126" x2="150" y2="126" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="150" y1="126" x2="240" y2="126" stroke="var(--faint)" stroke-width="0.8"/>
