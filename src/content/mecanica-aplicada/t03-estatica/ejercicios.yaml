        <desc id="ma3c316-d">La barra OA, articulada en O sobre el suelo, sube hacia la derecha con una inclinación de 30 grados y lleva en su extremo A el centro de un disco de radio R. La barra CB está articulada en B, a la derecha de O sobre el suelo, y sube hacia la izquierda tocando el disco en el punto D. Los puntos O, A y D están alineados. Un par P actúa sobre OA. A la derecha se recogen las medidas OA igual a 3R, BC igual a cinco R raíz de tres partido por tres y OB igual a ocho R raíz de tres partido por tres.</desc>
        <defs>
          <marker id="ma3c316-f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
