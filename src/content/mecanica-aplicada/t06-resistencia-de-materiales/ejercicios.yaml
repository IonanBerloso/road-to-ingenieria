  - id: ejma6-col617-la-mensula-con-par-y-fuerza-en-el-extremo
    titulo: La ménsula con carga repartida, par y fuerza en el extremo
    fuente: >-
      Ejercicio 6.17 · Tema 6, «Principios de resistencia de materiales» ·
      Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección lo marca como de
      nivel de examen y publica el resultado, contra el que está contrastado el
      desarrollo.
    nivel: practica
    enunciado: |
      La viga $AB$ soporta una carga uniformemente repartida en $CD$, una carga
      puntual en $B$ y un momento en $E$. Las dimensiones de la sección de están
      en $cm$. Determinar:

      a. Diagramas de esfuerzos cortantes y de momentos flectores en función de
      $q_0$ y $a$.

      b. Si $a = 1\ m$, calcular $q_0$ teniendo en cuenta que
      $\sigma_{max} = 1.200\ kg/cm^2$.

