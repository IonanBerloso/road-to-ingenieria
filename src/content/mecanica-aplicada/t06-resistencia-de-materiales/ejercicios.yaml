ejercicios:
  - id: ejma6-la-viga-biapoyada
    titulo: La viga biapoyada, y dónde tiene el flector máximo
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Una viga de 6 m, apoyada en sus dos extremos, soporta una carga
      uniforme de $q = 2\ \text{kN/m}$ en toda su longitud. Calcular las
      reacciones, la cortante en la sección situada a 1 m del apoyo izquierdo y
      el momento flector máximo.
    pide: Las reacciones, la cortante a 1 m y el flector máximo.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Dónde está el momento flector máximo de esta viga?
        opciones:
          - texto: Donde la cortante se anula, porque la pendiente del flector es la cortante
            correcta: true
            mensaje: |
              Eso es: $dM/dx = V$. Donde $V = 0$ el flector tiene tangente
              horizontal, y aquí es un máximo. Por simetría, en el centro.
          - texto: En los apoyos, porque ahí están las reacciones
            mensaje: |
              En los apoyos de una viga biapoyada el flector es nulo: no hay
              nada a un lado que dé momento. Las reacciones marcan donde la
              **cortante** es máxima.
          - texto: Donde la carga es mayor
            mensaje: |
              La carga es la misma en todas partes. El flector depende de todo
              lo que hay a un lado de la sección, y crece hasta donde la
              cortante cambia de signo.

      - tipo: calcular
        titulo: La cortante a 1 m del apoyo
        pregunta: |
          ¿Cuánto vale $V$ a 1 m del apoyo izquierdo, en kN?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.05
          formato: un número, en kN
        distractores:
          - valor: '8'
            mensaje: |
              Has sumado la carga del primer metro a la reacción en lugar de
              restarla. La carga va hacia abajo: $V = 6 - 2 \cdot 1$.
          - valor: '6'
            mensaje: |
              Esa es la cortante justo en el apoyo. En el primer metro hay 2 kN
              de carga hacia abajo, y la cortante baja con ella.
        pista: |
          $V$ es la suma de las fuerzas hacia arriba a la izquierda: la
          reacción, 6 kN, menos la carga del primer metro.
        desarrollo: |
          $$
          V(1) = 6 - 2 \cdot 1 = 4\ \text{kN}
          $$

      - tipo: calcular
        titulo: El flector máximo
        pregunta: |
          ¿Cuánto vale el momento flector máximo, en kN·m?
        respuesta:
          tipo: numero
          valor: '9'
          tolerancia: 0.05
          formato: un número, en kN·m
        distractores:
          - valor: '18'
            mensaje: |
              Has hecho el momento de la reacción, $6 \cdot 3$, y te has
              olvidado de la carga del medio vano, que también da momento:
              $2 \cdot 3 \cdot 1{,}5 = 9$ que hay que restar.
          - valor: '36'
            mensaje: |
              Es $qL^{2}/2$, el flector de un voladizo. En una viga biapoyada
              con carga uniforme el máximo es $qL^{2}/8$.
        pista: |
          En el centro, a la izquierda hay la reacción de 6 kN a 3 m y 6 kN de
          carga con su resultante a 1,5 m.
        desarrollo: |
          $$
          M(3) = 6 \cdot 3 - 2 \cdot 3 \cdot 1{,}5 = 18 - 9 = 9\ \text{kN}\cdot\text{m}
          $$

          Que es $qL^{2}/8 = 2 \cdot 36/8$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: Por simetría, cada apoyo lleva la mitad de la carga total, 12 kN, así que 6 kN.
          - texto: $V(x) = 6 - 2x$, que se anula en el centro, $x = 3$ m.
          - texto: Allí el flector es máximo, $M(3) = 6 \cdot 3 - 2 \cdot 3 \cdot 1{,}5 = 9$ kN·m.
          - texto: El flector máximo está en los apoyos, donde la cortante es mayor.
            trampa: true
            mensaje: |
              En los apoyos el flector es cero. Donde la cortante es mayor el
              flector crece más deprisa, pero su máximo está donde la cortante
              se anula.
    resolucion: |
      **Las reacciones.** La carga total es $2 \cdot 6 = 12\ \text{kN}$ y, por
      simetría, cada apoyo lleva 6 kN.

      **La cortante.** A una distancia $x$ del apoyo izquierdo, la suma de las
      fuerzas hacia arriba a la izquierda es

      $$
      V(x) = 6 - 2x \qquad V(1) = 4\ \text{kN}
      $$

      **El flector máximo.** $dM/dx = V$, así que el máximo está donde $V = 0$,
      en $x = 3\ \text{m}$:

      $$
      M(3) = 6 \cdot 3 - 2 \cdot 3 \cdot \frac{3}{2} = 9\ \text{kN}\cdot\text{m}
      $$

      Que es el $qL^{2}/8$ de siempre, y positivo: la viga se comba hacia abajo
      y tracciona la fibra inferior.

  - id: ejma6-la-torsion-de-un-eje
    titulo: La tensión de torsión en un eje, macizo y hueco
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Un eje macizo de sección circular, de diámetro $D = 50\ \text{mm}$,
      transmite un momento torsor $M_t = 1\ \text{kN}\cdot\text{m}$. Calcular la
      tensión tangencial máxima. Calcular también la de un eje hueco con el
      mismo diámetro exterior y un diámetro interior $d = 40\ \text{mm}$.
    pide: La tensión tangencial máxima en el eje macizo y en el hueco.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Dónde es máxima la tensión tangencial en una sección circular a
          torsión?
        opciones:
          - texto: En el borde, porque la tensión crece en línea recta con la distancia al centro
            correcta: true
            mensaje: |
              Eso es: $\tau = M_t\,r/I_p$. Es nula en el centro y máxima en el
              radio exterior.
          - texto: En el centro de la sección
            mensaje: |
              En el centro es nula. La torsión es un giro de cada sección
              respecto de la vecina, y cuanto más lejos del eje, más se
              distorsiona el material.
          - texto: Es la misma en toda la sección
            mensaje: |
              Solo sería casi uniforme en un tubo de pared muy fina. En una
              sección maciza crece con el radio, de cero a su máximo.

      - tipo: calcular
        titulo: El eje macizo
        pregunta: |
          ¿Cuánto vale la tensión tangencial máxima del eje macizo?
        respuesta:
          tipo: magnitud
          valor: '40.74 MPa'
          formato: una tensión, con su unidad
        distractores:
          - valor: '81.49 MPa'
            mensaje: |
              Has usado el momento de inercia respecto de un diámetro,
              $\pi D^{4}/64$, en lugar del polar, $\pi D^{4}/32$. En torsión el
              que manda es el polar, el doble.
          - valor: '325.9 MPa'
            mensaje: |
              Has puesto el radio, 25 mm, donde la fórmula lleva el diámetro:
              $\tau_{\max} = 16\,M_t/(\pi D^{3})$ con $D = 0{,}05\ \text{m}$.
        pista: |
          $\tau_{\max} = 16\,M_t/(\pi D^{3})$, con todo en metros y newtons.
        desarrollo: |
          $$
          \tau_{\max} = \frac{16 \cdot 1000}{\pi \cdot 0{,}05^{3}} = \frac{16\,000}{3{,}927 \cdot 10^{-4}} = 40{,}74\ \text{MPa}
          $$

      - tipo: calcular
        titulo: El eje hueco
        pregunta: |
          ¿Y la del eje hueco, con $d = 40\ \text{mm}$?
        respuesta:
          tipo: magnitud
          valor: '69 MPa'
          formato: una tensión, con su unidad
        distractores:
          - valor: '40.74 MPa'
            mensaje: |
              Es la del eje macizo. Al quitar el núcleo, el momento de inercia
              polar baja y la misma torsión reparte más tensión en el borde.
        pista: |
          $I_p = \pi(D^{4} - d^{4})/32$, y $\tau_{\max} = M_t\,(D/2)/I_p$. Con
          $k = d/D = 0{,}8$, es la del macizo dividida entre $1 - k^{4}$.
        desarrollo: |
          $$
          \tau_{\max} = \frac{16\,M_t}{\pi D^{3}(1 - k^{4})} = \frac{40{,}74}{1 - 0{,}8^{4}} = \frac{40{,}74}{0{,}5904} = 69{,}0\ \text{MPa}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: La tensión de torsión crece con el radio, $\tau = M_t\,r/I_p$, y es máxima en el borde.
          - texto: 'Eje macizo: $\tau_{\max} = 16 \cdot 1000/(\pi \cdot 0{,}05^{3}) = 40{,}7$ MPa.'
          - texto: 'Eje hueco: $I_p$ baja en el factor $1 - 0{,}8^{4} = 0{,}59$ y la tensión sube a 69 MPa.'
          - texto: El eje hueco trabaja peor, así que siempre es peor diseño que el macizo.
            trampa: true
            mensaje: |
              Su tensión es mayor, pero ha perdido el 64 % del material, justo
              el del centro, que apenas trabajaba. Por kilo de acero, el eje
              hueco aguanta más torsión: por eso los ejes de transmisión son
              tubos.
    resolucion: |
      **El macizo.** La tensión es máxima en el borde:

      $$
      \tau_{\max} = \frac{16\,M_t}{\pi D^{3}} = \frac{16 \cdot 1000}{\pi \cdot 0{,}05^{3}} = 40{,}74\ \text{MPa}
      $$

      **El hueco.** Con $k = d/D = 0{,}8$, el momento polar pasa a
      $\pi D^{4}(1 - k^{4})/32$, y la tensión en el borde

      $$
      \tau_{\max} = \frac{40{,}74}{1 - 0{,}8^{4}} = 69{,}0\ \text{MPa}
      $$

      Un 69 % más de tensión con un 36 % del material: el hueco ha perdido
      $1 - (1 - 0{,}64) = 64\ \%$ del área, la del centro, que era la que menos
      trabajaba.
