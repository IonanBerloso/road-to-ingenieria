        <path d="M56 84 L60 92 L64 84 M80 84 L84 92 L88 84 M104 84 L108 92 L112 84 M128 84 L132 92 L136 84 M152 84 L156 92 L160 84 M176 84 L180 92 L184 84 M200 84 L204 92 L208 84 M224 84 L228 92 L232 84 M248 84 L252 92 L256 84 M272 84 L276 92 L280 84 M296 84 L300 92 L304 84" fill="none" stroke="var(--d1)" stroke-width="1"/>
        <text x="170" y="48" font-size="11" text-anchor="middle" fill="var(--d1)">2 kN/m</text>
        <line x1="300" y1="30" x2="300" y2="92" stroke="var(--flag)" stroke-width="1.8"/>
        <path d="M296 85 L300 93 L304 85" fill="none" stroke="var(--flag)" stroke-width="1.8"/>
        <text x="310" y="42" font-size="11" fill="var(--flag)">5 kN</text>
        <circle cx="60" cy="112" r="5" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/>
        <path d="M60 117 L50 133 L70 133 Z" fill="none" stroke="var(--ink)" stroke-width="1.2"/>
        <circle cx="140" cy="112" r="5" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/>
        <path d="M140 117 L130 133 L150 133 Z" fill="none" stroke="var(--ink)" stroke-width="1.2"/>
        <line x1="44" y1="133" x2="160" y2="133" stroke="var(--ink)" stroke-width="1.2"/>
        <path d="M48 133 L42 141 M64 133 L58 141 M80 133 L74 141 M96 133 L90 141 M112 133 L106 141 M128 133 L122 141 M144 133 L138 141 M158 133 L152 141" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <text x="52" y="92" font-size="11" fill="var(--ink)">A</text>
        <text x="148" y="126" font-size="11" fill="var(--ink)">C</text>
        <text x="306" y="92" font-size="11" fill="var(--ink)">B</text>
        <line x1="60" y1="164" x2="300" y2="164" stroke="var(--faint)" stroke-width="0.8"/>
        <path d="M60 160 L60 168 M140 160 L140 168 M300 160 L300 168" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="100" y="180" font-size="10" text-anchor="middle" fill="var(--faint)">0,4 m</text>
        <text x="220" y="180" font-size="10" text-anchor="middle" fill="var(--faint)">0,8 m</text>
      </svg>
      </figure>
    pide: Los diagramas de cortante y flector con sus valores representativos, y las dimensiones b y h de la sección rectangular.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de calcular: ¿qué esperas de la reacción del apoyo $A$?
        opciones:
          - texto: Que salga hacia abajo, porque el voladizo cargado hace de palanca y levanta ese extremo
            correcta: true
            mensaje: |
              Eso es. El apoyo C hace de punto de apoyo de la palanca y el
              voladizo pesa mucho más que el tramo AC: A tiene que **sujetar**
              la viga hacia abajo, no sostenerla.
          - texto: Que salga hacia arriba, porque un apoyo siempre empuja hacia arriba
            mensaje: |
              Un apoyo empuja hacia arriba cuando la viga tiende a bajar sobre
              él. Si la viga tiende a levantarse, la reacción cambia de sentido,
              y el apoyo tiene que estar preparado para tirar.
          - texto: Que sea nula, porque toda la carga la recoge el apoyo C
            mensaje: |
              Si A no trabajara, la viga giraría alrededor de C: los momentos no
              se equilibrarían. A da 11,2 kN hacia abajo, que no es poco.

      - tipo: calcular
        titulo: La reacción del apoyo intermedio
        pregunta: |
          ¿Cuánto vale la reacción del apoyo $C$, en kN?
        respuesta:
          tipo: numero
          valor: '18.6'
          tolerancia: 0.05
          formato: un número, en kN
        distractores:
          - valor: '15'
            mensaje: |
              Has contado solo la carga puntual de 5 kN. La repartida también da
              momento respecto de A, y su resultante de 2,4 kN está a 0,6 m.
          - valor: '3.6'
            mensaje: |
              Has contado solo la carga repartida y te has dejado los 5 kN del
              extremo, que son los que más momento hacen porque están a 1,2 m
              de A.
          - valor: '7.4'
            mensaje: |
              Esa es la carga total sobre la viga, 2,4 más 5. No se reparte
              entre los dos apoyos: uno tira hacia abajo y el otro tiene que
              cargar con la suma.
        pista: |
          Momentos respecto de $A$: la repartida, 2,4 kN a 0,6 m, y los 5 kN a
          1,2 m, contra $R_C$ a 0,4 m.
        desarrollo: |
          $$
          R_C = \frac{2 \cdot 1{,}2 \cdot 0{,}6 + 5 \cdot 1{,}2}{0{,}4}
          = \frac{7{,}44}{0{,}4} = 18{,}6\ \text{kN}
          $$

          y entonces $R_A = 7{,}4 - 18{,}6 = -11{,}2$ kN, o sea 11,2 kN hacia
          abajo.

      - tipo: calcular
        titulo: El flector que dimensiona
        pregunta: |
          ¿Cuál es el mayor momento flector en valor absoluto, en kN·m?
        respuesta:
          tipo: numero
          valor: '4.64'
          tolerancia: 0.03
          formato: un número, en kN·m
        distractores:
          - valor: '4'
            mensaje: |
              Has contado solo la carga puntual del extremo. En el voladizo hay
              además 1,6 kN de carga repartida, cuya resultante está a 0,4 m de
              C y aporta 0,64 kN·m más.
          - valor: '1.44'
            mensaje: |
              Ese es solo el momento de la repartida del voladizo. Falta el de
              los 5 kN, que es el grande.
        pista: |
          Corta en $C$ y quédate con el voladizo entero: es el lado sin
          reacciones.
        desarrollo: |
          $$
          M_C = -\left(5 \cdot 0{,}8 + 2 \cdot 0{,}8 \cdot 0{,}4\right)
          = -4{,}64\ \text{kN}\cdot\text{m}
          $$

          Es negativo: en el apoyo C la viga tracciona la fibra **superior**.

      - tipo: calcular
        titulo: La base de la sección
        pregunta: |
          Con $h = 3b$, $\sigma_y = 250$ MPa y coeficiente de seguridad 1,5,
          ¿cuánto vale $b$?
        respuesta:
          tipo: magnitud
          valor: '26.48 mm'
          tolerancia: 0.015
          formato: una longitud, con su unidad
        distractores:
          - valor: '23.13 mm'
            mensaje: |
              Te has olvidado del coeficiente de seguridad: has dimensionado con
              los 250 MPa del límite elástico en vez de con los 166,7 MPa
              admisibles.
          - valor: '33.36 mm'
            mensaje: |
              Has usado $W = bh^{2}/12$. Ese es $I/h$; el módulo resistente es
              $I$ dividido por la distancia a la fibra más alejada, $h/2$, o sea
              $bh^{2}/6$.
        pista: |
          $W = b h^{2}/6 = 1{,}5\,b^{3}$ al sustituir $h = 3b$, y
          $\sigma_{\text{adm}} = 250/1{,}5$.
        desarrollo: |
          $$
          \sigma_{\text{adm}} = \frac{250}{1{,}5} = 166{,}7\ \text{MPa}
          \qquad
          W = \frac{b(3b)^{2}}{6} = 1{,}5\,b^{3}
          $$

          $$
          b \ge \sqrt[3]{\frac{4640}{1{,}5 \cdot 166{,}7 \cdot 10^{6}}}
          = 26{,}48\ \text{mm}
          \qquad h = 3b = 79{,}43\ \text{mm}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Momentos en A: R_C = 18,6 kN hacia arriba, y con el equilibrio vertical R_A = 11,2 kN hacia abajo.'
          - texto: 'La cortante baja de −11,2 a −12 kN en AC, salta a +6,6 kN al pasar el apoyo C y baja hasta +5 kN en B, donde la carga puntual la anula.'
          - texto: 'El flector es nulo en los dos extremos y máximo en C, con −4,64 kN·m: la viga tracciona ahí la fibra de arriba.'
          - texto: 'Como el flector es negativo, hay que dimensionar con la admisible de compresión, que es la que trabaja en la fibra inferior.'
            trampa: true
            mensaje: |
              El enunciado da el mismo límite elástico a tracción y a
              compresión, y la sección es rectangular y simétrica: las dos
              fibras extremas están a $h/2$ y trabajan al mismo valor absoluto.
              El signo del flector dice **qué** fibra tracciona, no cambia el
              dimensionamiento.
    resolucion: |
      **Las reacciones.** Tomando momentos en $A$, con la resultante de la
      repartida —2,4 kN— a 0,6 m:

      $$
      R_C = \frac{2 \cdot 1{,}2 \cdot 0{,}6 + 5 \cdot 1{,}2}{0{,}4} = 18{,}6\ \text{kN}
      \qquad
      R_A = 7{,}4 - 18{,}6 = -11{,}2\ \text{kN}
      $$

      La reacción de $A$ sale **negativa**: ese apoyo tira de la viga hacia
      abajo. Es lo que tiene un voladizo largo y cargado — el tramo AC hace de
      contrapeso al revés.

      **La cortante.** Sumando fuerzas hacia arriba a la izquierda:

      $$
      V(x) = -11{,}2 - 2x \quad (0 \le x \le 0{,}4)
      \qquad
      V(x) = 6{,}6 - 2(x - 0{,}4) \quad (0{,}4 \le x \le 1{,}2)
      $$

      es decir: de $-11{,}2$ a $-12$ kN, salto de 18,6 al pasar el apoyo, y de
      $+6{,}6$ a $+5$ kN, que la carga puntual devuelve a cero en B.

      **El flector.** Vale cero en los dos extremos y tiene su máximo en C,
      donde la cortante cambia de signo:

      $$
      M_C = -\left(5 \cdot 0{,}8 + 2 \cdot 0{,}8 \cdot 0{,}4\right) = -4{,}64\ \text{kN}\cdot\text{m}
      $$

      Negativo en toda la viga: tracciona siempre la fibra superior.

      **El dimensionamiento.** Con $h = 3b$ y el coeficiente de seguridad:

      $$
      \sigma_{\text{adm}} = \frac{250}{1{,}5} = 166{,}7\ \text{MPa}
      \qquad
      W = \frac{b(3b)^{2}}{6} = 1{,}5\,b^{3}
      $$

      $$
      b \ge \sqrt[3]{\frac{4640}{1{,}5 \cdot 166{,}7 \cdot 10^{6}}} = 26{,}47\ \text{mm}
      \qquad
      h \ge 79{,}43\ \text{mm}
      $$

      que son los dos valores publicados.

      <figure>
      <svg viewBox="0 0 380 360" role="img" width="380" height="360" aria-labelledby="ma6c618r-t ma6c618r-d">
