        <rect x="70" y="155" width="230" height="8" fill="var(--faint)" fill-opacity="0.3" stroke="var(--ink)" stroke-width="1.2"/>
        <circle cx="82" cy="167" r="5" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/>
        <path d="M82 172 L72 188 L92 188 Z" fill="none" stroke="var(--ink)" stroke-width="1.2"/>
        <line x1="66" y1="188" x2="98" y2="188" stroke="var(--ink)" stroke-width="1.2"/>
