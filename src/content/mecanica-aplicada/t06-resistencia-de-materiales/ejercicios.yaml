        <text x="218" y="146" font-size="12" fill="var(--ink)">C</text>
        <text x="306" y="166" font-size="12" fill="var(--ink)">B</text>
        <line x1="82" y1="200" x2="82" y2="232" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="212" y1="166" x2="212" y2="232" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="298" y1="166" x2="298" y2="232" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="82" y1="226" x2="212" y2="226" stroke="var(--faint)" stroke-width="0.8"/>
