    pide: El valor máximo de la carga P, en kilogramos-fuerza.
    pasos:
      - tipo: reconocer
        pregunta: |
          La sección es una T y el material aguanta muy distinto a tracción
          (20) que a compresión (150). ¿Qué hay que comprobar?
        opciones:
          - texto: "Las cuatro combinaciones: los dos signos del flector con las dos fibras extremas, y quedarse con la más restrictiva"
            correcta: true
            mensaje: |
              Eso es. El eje neutro no está a media altura, así que las dos
              fibras están a distancias distintas; y como el flector cambia de
              signo, cada fibra pasa por tracción y por compresión. Hay que
              probarlas todas.
          - texto: Solo la sección de flector máximo positivo, en el centro del vano
            mensaje: |
              Aquí el flector negativo de los apoyos vale exactamente lo mismo
              que el positivo del centro, y encima pone a traccionar la fibra
              más alejada. Quedarse con el centro deja fuera la comprobación que
              manda.
          - texto: Solo la fibra más alejada del eje neutro, que es la que más tensión tiene
            mensaje: |
              Es la que más tensión tiene, sí, pero no siempre la que antes
              falla: enfrente hay dos admisibles muy distintas. Una fibra menos
              cargada a tracción puede romper antes que otra más cargada a
              compresión.

      - tipo: calcular
        titulo: El centro de gravedad de la sección
        pregunta: |
          ¿A qué distancia de la fibra inferior está el centro de gravedad de
          la sección?
        respuesta:
          tipo: magnitud
          valor: '31 cm'
          tolerancia: 0.01
          formato: una longitud, con su unidad
        distractores:
          - valor: '45 cm'
            mensaje: |
              Esa es la mitad de la altura total, que valdría si la sección
              fuera simétrica. En una T el material está casi todo abajo y el
              centro de gravedad baja con él.
          - valor: '59 cm'
            mensaje: |
              Esa es la distancia del centro de gravedad a la fibra **superior**
              —las dos suman los 90 cm de canto—. Aquí se pedía la de abajo.
        pista: |
          Dos rectángulos: el ala, $80 \times 20$ con su centro a 10 cm, y el
          alma, $20 \times 70$ con su centro a 55 cm.
        desarrollo: |
          $$
          \overline{y} = \frac{1600 \cdot 10 + 1400 \cdot 55}{1600 + 1400}
          = \frac{93\,000}{3000} = 31\ \text{cm}
          $$

      - tipo: calcular
        titulo: El momento de inercia
        pregunta: |
          ¿Cuánto vale el momento de inercia de la sección respecto del eje
          neutro?
        respuesta:
          tipo: numero
          valor: '2137000'
          tolerancia: 3000
          formato: un número, en cm a la cuarta
        distractores:
          - valor: '625000'
            mensaje: |
              Has sumado los dos momentos propios y te has dejado el término de
              Steiner. Cada rectángulo tiene su centro lejos del eje neutro, y
              ese traslado aporta aquí más que los momentos propios.
          - valor: '2725000'
            mensaje: |
              Has trasladado al eje de media altura, 45 cm, en vez de al centro
              de gravedad, 31 cm. Steiner solo vale desde el eje que pasa por el
              centro de gravedad de cada pieza hasta el eje neutro de verdad.
        pista: |
          $I = \sum \left(\frac{b h^{3}}{12} + A\,d^{2}\right)$, con $d$ medido
          desde 31 cm.
        desarrollo: |
          $$
          I = \frac{80 \cdot 20^{3}}{12} + 1600 \cdot 21^{2}
            + \frac{20 \cdot 70^{3}}{12} + 1400 \cdot 24^{2}
          $$

          $$
          I = 53\,333 + 705\,600 + 571\,667 + 806\,400 = 2\,137\,000\ \text{cm}^{4}
          $$

      - tipo: calcular
        titulo: La carga máxima
        pregunta: |
          ¿Cuál es el valor máximo de $P$?
        respuesta:
          tipo: numero
          valor: '9658.7'
          tolerancia: 8
          formato: un número, en kg* (kilogramos-fuerza)
        distractores:
          - valor: '18383'
            mensaje: |
              Has comprobado solo el centro del vano, donde el flector positivo
              tracciona la fibra **inferior**, que está cerca del eje neutro. En
              los apoyos el flector vale lo mismo pero tracciona la de arriba,
              que está al doble de distancia.
          - valor: '72441'
            mensaje: |
              Has usado la admisible de compresión, 150, en la fibra superior de
              la sección del apoyo. Ahí el flector es negativo, así que esa
              fibra está **traccionada** y le toca la admisible de 20.
        pista: |
          La combinación que manda es la del apoyo —$M = 0{,}75P$ negativo— con
          la fibra superior, a 59 cm, y la admisible de tracción, 20.
        desarrollo: |
          $$
          M = 0{,}75P\ \text{kg}\cdot\text{m} = 75P\ \text{kg}\cdot\text{cm}
          \qquad
          \sigma = \frac{M\,y_{\text{sup}}}{I} \le 20
          $$

          $$
          P \le \frac{20 \cdot 2\,137\,000}{75 \cdot 59} = 9658{,}7\ \text{kg}^{*}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: 'Por simetría cada apoyo lleva P/2, y el flector vale 0,75P en el centro y −0,75P en los apoyos: el mismo valor con los dos signos.'
          - texto: 'El eje neutro pasa a 31 cm de la fibra inferior, así que la superior está a 59 cm, casi al doble.'
          - texto: 'En el apoyo el flector es negativo y tracciona la fibra de arriba, la más alejada, justo la que solo aguanta 20.'
          - texto: 'Como los dos flectores valen lo mismo, da igual cuál se use para dimensionar.'
            trampa: true
            mensaje: |
              Valen lo mismo, pero no hacen lo mismo. El signo decide **qué
              fibra tracciona**: el positivo tracciona la de abajo, a 31 cm, y
              el negativo la de arriba, a 59 cm. Con dos admisibles tan
              distintas, esa diferencia divide la carga admisible casi por dos.
    resolucion: |
      **Las reacciones y el flector.** La carga total es $P$ y el problema es
      simétrico, así que cada apoyo lleva $P/2$. En el apoyo $A$, con el
      voladizo de la izquierda:

      $$
      M_A = -\frac{P}{4}\cdot 3 = -0{,}75P
      \qquad
      M_{\text{centro}} = \frac{P}{2}\cdot 6 - \frac{P}{4}\cdot 9 = +0{,}75P
      $$

      Los dos valen lo mismo, en kg·m, y con signos opuestos. Eso es lo que
      hace interesante al problema.

      **La sección.** Con el ala abajo, el centro de gravedad queda a

      $$
      \overline{y} = \frac{1600 \cdot 10 + 1400 \cdot 55}{3000} = 31\ \text{cm}
      $$

      de la fibra inferior, y la superior queda a $90 - 31 = 59$ cm. El momento
      de inercia respecto del eje neutro, con Steiner:

      $$
      I = 53\,333 + 705\,600 + 571\,667 + 806\,400 = 2\,137\,000\ \text{cm}^{4}
      $$

      **Las cuatro comprobaciones.** Con $M = 75P$ en kg·cm:

      | sección | fibra | trabaja a | admisible | P máximo |
      |---|---|---|---|---|
      | centro | inferior, 31 cm | tracción | 20 | 18 383 |
      | centro | superior, 59 cm | compresión | 150 | 72 441 |
      | apoyo | superior, 59 cm | tracción | 20 | **9 659** |
      | apoyo | inferior, 31 cm | compresión | 150 | 137 870 |

      **Manda la tercera**, con quince veces menos margen que la cuarta:

      $$
      P_{\max} = \frac{20 \cdot 2\,137\,000}{75 \cdot 59} = 9658{,}7\ \text{kg}^{*}
      $$

      que es el resultado publicado, 9658,75 kg*. La lección está en la tabla:
      la sección más cargada y la fibra más alejada no bastan por separado
      cuando el material tiene dos admisibles distintas.

  - id: ejma6-col616-el-eje-escalonado-a-torsion
    titulo: El eje escalonado a torsión, y qué tramo manda
    fuente: >-
      Ejercicio 6.16 · Tema 6, «Principios de resistencia de materiales» ·
      Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección publica D = 3,99
      cm; ese valor sale de dimensionar solo el tramo BC y deja el tramo AB a
      3200 kg/cm2, más de cinco veces la admisible, así que aquí se publica el
      diámetro que cumplen los dos tramos, 6,98 cm. Justo antes de este
      ejercicio la colección abre su bloque marcado como de nivel de examen.
