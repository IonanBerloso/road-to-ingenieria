  - id: ejma6-col611-el-diagrama-de-momentos-torsores
    titulo: El diagrama de momentos torsores de un árbol empotrado
    fuente: >-
      Ejercicio 6.11 · Tema 6, «Principios de resistencia de materiales» ·
      Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección solo pide el
      diagrama y no publica resultado, así que el desarrollo es nuestro,
      contrastado sumando los pares por los dos lados de cada sección.
    nivel: practica
    enunciado: |
      Dibujar el diagrama de momentos torsores de la figura.

      Datos: $T_0 = 0{,}4\ T \cdot m$, $L = 1\ m$.

      <figure>
