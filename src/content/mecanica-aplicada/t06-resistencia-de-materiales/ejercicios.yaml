  - id: ejma6-col619-la-viga-con-la-celosia-encima
    titulo: La viga con la celosía articulada encima
    fuente: >-
      Ejercicio 6.19 · Tema 6, «Principios de resistencia de materiales» ·
      Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección lo marca como de
      nivel de examen. Publica Ox = 8Mg/3 y Cx = -8Mg/3, y con la geometría de
      la figura esas dos componentes no cierran el equilibrio de momentos del
      conjunto: sobra 2MgL. Aquí se publica el valor que sí lo cierra, 4Mg/3,
      comprobado por dos caminos independientes. Lo demás que publica la
      colección -Oy = 0, Cy = 6Mg y la sección y la fibra más solicitadas- sí se
      reproduce.
    nivel: practica
    enunciado: |
      El sistema mecánico de la figura está en equilibrio estático. Está formado
      por una viga de longitud $2L$, articulada en $O$ a un apoyo fijo, y unida
      en $A$ con la estructura articulada superior (a su vez articulada en el
      apoyo fijo $C$). La viga soporta una carga distribuida de valor constante
      $Mg/L$ (unidades de $N/m$), mientras que la estructura articulada soporta
      cuatro cargas puntuales de valor $Mg$.

      a. Reacciones en los apoyos $O$ y $C$.

      b. Diagramas de esfuerzos axiales, cortantes y momentos flectores en la
      viga.

      c. Suponiendo la viga de sección transversal rectangular ($b\ x\ h$),
      discutir cual es la sección más solicitada de la viga, y dentro de la
      propia sección, señalar el/los puntos de tensión normal máxima (en valor
      absoluto). Plantear el cálculo de dicha tensión máxima en función de $b$ y
      $h$.

