ejercicios:
  - id: ejma6-la-viga-biapoyada
    titulo: La viga biapoyada, y dónde tiene el flector máximo
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Una viga de 6 m, apoyada en sus dos extremos, soporta una carga
      uniforme de $q = 2\ \text{kN/m}$ en toda su longitud. Calcular las
      reacciones, la cortante en la sección situada a 1 m del apoyo izquierdo y
      el momento flector máximo.
    pide: Las reacciones, la cortante a 1 m y el flector máximo.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Dónde está el momento flector máximo de esta viga?
        opciones:
          - texto: Donde la cortante se anula, porque la pendiente del flector es la cortante
            correcta: true
            mensaje: |
              Eso es: $dM/dx = V$. Donde $V = 0$ el flector tiene tangente
              horizontal, y aquí es un máximo. Por simetría, en el centro.
          - texto: En los apoyos, porque ahí están las reacciones
            mensaje: |
              En los apoyos de una viga biapoyada el flector es nulo: no hay
              nada a un lado que dé momento. Las reacciones marcan donde la
              **cortante** es máxima.
          - texto: Donde la carga es mayor
            mensaje: |
              La carga es la misma en todas partes. El flector depende de todo
              lo que hay a un lado de la sección, y crece hasta donde la
              cortante cambia de signo.

      - tipo: calcular
        titulo: La cortante a 1 m del apoyo
        pregunta: |
          ¿Cuánto vale $V$ a 1 m del apoyo izquierdo, en kN?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.05
          formato: un número, en kN
        distractores:
          - valor: '8'
            mensaje: |
              Has sumado la carga del primer metro a la reacción en lugar de
              restarla. La carga va hacia abajo: $V = 6 - 2 \cdot 1$.
          - valor: '6'
            mensaje: |
              Esa es la cortante justo en el apoyo. En el primer metro hay 2 kN
              de carga hacia abajo, y la cortante baja con ella.
        pista: |
          $V$ es la suma de las fuerzas hacia arriba a la izquierda: la
          reacción, 6 kN, menos la carga del primer metro.
        desarrollo: |
          $$
          V(1) = 6 - 2 \cdot 1 = 4\ \text{kN}
          $$

      - tipo: calcular
        titulo: El flector máximo
        pregunta: |
          ¿Cuánto vale el momento flector máximo, en kN·m?
        respuesta:
          tipo: numero
          valor: '9'
          tolerancia: 0.05
          formato: un número, en kN·m
        distractores:
          - valor: '18'
            mensaje: |
              Has hecho el momento de la reacción, $6 \cdot 3$, y te has
              olvidado de la carga del medio vano, que también da momento:
              $2 \cdot 3 \cdot 1{,}5 = 9$ que hay que restar.
          - valor: '36'
            mensaje: |
              Es $qL^{2}/2$, el flector de un voladizo. En una viga biapoyada
              con carga uniforme el máximo es $qL^{2}/8$.
        pista: |
          En el centro, a la izquierda hay la reacción de 6 kN a 3 m y 6 kN de
          carga con su resultante a 1,5 m.
        desarrollo: |
          $$
          M(3) = 6 \cdot 3 - 2 \cdot 3 \cdot 1{,}5 = 18 - 9 = 9\ \text{kN}\cdot\text{m}
          $$

          Que es $qL^{2}/8 = 2 \cdot 36/8$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: Por simetría, cada apoyo lleva la mitad de la carga total, 12 kN, así que 6 kN.
          - texto: $V(x) = 6 - 2x$, que se anula en el centro, $x = 3$ m.
          - texto: Allí el flector es máximo, $M(3) = 6 \cdot 3 - 2 \cdot 3 \cdot 1{,}5 = 9$ kN·m.
          - texto: El flector máximo está en los apoyos, donde la cortante es mayor.
            trampa: true
            mensaje: |
              En los apoyos el flector es cero. Donde la cortante es mayor el
              flector crece más deprisa, pero su máximo está donde la cortante
              se anula.
    resolucion: |
      **Las reacciones.** La carga total es $2 \cdot 6 = 12\ \text{kN}$ y, por
      simetría, cada apoyo lleva 6 kN.

      **La cortante.** A una distancia $x$ del apoyo izquierdo, la suma de las
      fuerzas hacia arriba a la izquierda es

      $$
      V(x) = 6 - 2x \qquad V(1) = 4\ \text{kN}
      $$

      **El flector máximo.** $dM/dx = V$, así que el máximo está donde $V = 0$,
      en $x = 3\ \text{m}$:

      $$
      M(3) = 6 \cdot 3 - 2 \cdot 3 \cdot \frac{3}{2} = 9\ \text{kN}\cdot\text{m}
      $$

      Que es el $qL^{2}/8$ de siempre, y positivo: la viga se comba hacia abajo
      y tracciona la fibra inferior.

  - id: ejma6-la-torsion-de-un-eje
    titulo: La tensión de torsión en un eje, macizo y hueco
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Un eje macizo de sección circular, de diámetro $D = 50\ \text{mm}$,
      transmite un momento torsor $M_t = 1\ \text{kN}\cdot\text{m}$. Calcular la
      tensión tangencial máxima. Calcular también la de un eje hueco con el
      mismo diámetro exterior y un diámetro interior $d = 40\ \text{mm}$.
    pide: La tensión tangencial máxima en el eje macizo y en el hueco.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Dónde es máxima la tensión tangencial en una sección circular a
          torsión?
        opciones:
          - texto: En el borde, porque la tensión crece en línea recta con la distancia al centro
            correcta: true
            mensaje: |
              Eso es: $\tau = M_t\,r/I_p$. Es nula en el centro y máxima en el
              radio exterior.
          - texto: En el centro de la sección
            mensaje: |
              En el centro es nula. La torsión es un giro de cada sección
              respecto de la vecina, y cuanto más lejos del eje, más se
              distorsiona el material.
          - texto: Es la misma en toda la sección
            mensaje: |
              Solo sería casi uniforme en un tubo de pared muy fina. En una
              sección maciza crece con el radio, de cero a su máximo.

      - tipo: calcular
        titulo: El eje macizo
        pregunta: |
          ¿Cuánto vale la tensión tangencial máxima del eje macizo?
        respuesta:
          tipo: magnitud
          valor: '40.74 MPa'
          formato: una tensión, con su unidad
        distractores:
          - valor: '81.49 MPa'
            mensaje: |
              Has usado el momento de inercia respecto de un diámetro,
              $\pi D^{4}/64$, en lugar del polar, $\pi D^{4}/32$. En torsión el
              que manda es el polar, el doble.
          - valor: '325.9 MPa'
            mensaje: |
              Has puesto el radio, 25 mm, donde la fórmula lleva el diámetro:
              $\tau_{\max} = 16\,M_t/(\pi D^{3})$ con $D = 0{,}05\ \text{m}$.
        pista: |
          $\tau_{\max} = 16\,M_t/(\pi D^{3})$, con todo en metros y newtons.
        desarrollo: |
          $$
          \tau_{\max} = \frac{16 \cdot 1000}{\pi \cdot 0{,}05^{3}} = \frac{16\,000}{3{,}927 \cdot 10^{-4}} = 40{,}74\ \text{MPa}
          $$

      - tipo: calcular
        titulo: El eje hueco
        pregunta: |
          ¿Y la del eje hueco, con $d = 40\ \text{mm}$?
        respuesta:
          tipo: magnitud
          valor: '69 MPa'
          formato: una tensión, con su unidad
        distractores:
          - valor: '40.74 MPa'
            mensaje: |
              Es la del eje macizo. Al quitar el núcleo, el momento de inercia
              polar baja y la misma torsión reparte más tensión en el borde.
        pista: |
          $I_p = \pi(D^{4} - d^{4})/32$, y $\tau_{\max} = M_t\,(D/2)/I_p$. Con
          $k = d/D = 0{,}8$, es la del macizo dividida entre $1 - k^{4}$.
        desarrollo: |
          $$
          \tau_{\max} = \frac{16\,M_t}{\pi D^{3}(1 - k^{4})} = \frac{40{,}74}{1 - 0{,}8^{4}} = \frac{40{,}74}{0{,}5904} = 69{,}0\ \text{MPa}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: La tensión de torsión crece con el radio, $\tau = M_t\,r/I_p$, y es máxima en el borde.
          - texto: 'Eje macizo: $\tau_{\max} = 16 \cdot 1000/(\pi \cdot 0{,}05^{3}) = 40{,}7$ MPa.'
          - texto: 'Eje hueco: $I_p$ baja en el factor $1 - 0{,}8^{4} = 0{,}59$ y la tensión sube a 69 MPa.'
          - texto: El eje hueco trabaja peor, así que siempre es peor diseño que el macizo.
            trampa: true
            mensaje: |
              Su tensión es mayor, pero ha perdido el 64 % del material, justo
              el del centro, que apenas trabajaba. Por kilo de acero, el eje
              hueco aguanta más torsión: por eso los ejes de transmisión son
              tubos.
    resolucion: |
      **El macizo.** La tensión es máxima en el borde:

      $$
      \tau_{\max} = \frac{16\,M_t}{\pi D^{3}} = \frac{16 \cdot 1000}{\pi \cdot 0{,}05^{3}} = 40{,}74\ \text{MPa}
      $$

      **El hueco.** Con $k = d/D = 0{,}8$, el momento polar pasa a
      $\pi D^{4}(1 - k^{4})/32$, y la tensión en el borde

      $$
      \tau_{\max} = \frac{40{,}74}{1 - 0{,}8^{4}} = 69{,}0\ \text{MPa}
      $$

      Un 69 % más de tensión con un 36 % del material: el hueco ha perdido
      $1 - (1 - 0{,}64) = 64\ \%$ del área, la del centro, que era la que menos
      trabajaba.

  - id: ejma6-col61-la-carga-puntual-en-una-viga-biapoyada
    titulo: La carga puntual en una viga biapoyada, y dónde tiene el flector su pico
    fuente: >-
      Ejercicio 6.1 · Tema 6, «Principios de resistencia de materiales» ·
      Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección solo pide los
      diagramas y no publica resultado, así que el desarrollo es nuestro,
      contrastado integrando la carga por un segundo camino.
    nivel: practica
    enunciado: |
      Calcular los diagramas de esfuerzos cortantes y momentos flectores en las
      siguientes vigas y pórticos (6.1-6.10):

      <figure>
      <svg viewBox="0 0 460 158" role="img" width="460" height="158" aria-labelledby="ejma6-col61-viga-t ejma6-col61-viga-d">
        <title id="ejma6-col61-viga-t">Viga biapoyada con una carga puntual P a distancia a del apoyo A</title>
        <desc id="ejma6-col61-viga-d">Una viga recta AB de luz L, apoyada en A con una articulacion y en B con un rodillo. Una carga puntual P hacia abajo actua en un punto interior, a distancia a del apoyo A y b del apoyo B. El dibujo esta hecho con a igual a 0,6 veces L.</desc>
        <defs>
          <marker id="ejma6-col61-viga-fd" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="var(--d1)"/></marker>
          <marker id="ejma6-col61-viga-fp" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/></marker>
          <marker id="ejma6-col61-viga-fi" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/></marker>
        </defs>
        <rect x="52" y="82" width="356" height="7" fill="var(--faint)" fill-opacity="0.25" stroke="var(--ink)" stroke-width="1"/>
        <line x1="265.6" y1="38" x2="265.6" y2="81" stroke="var(--flag)" stroke-width="1.6" marker-end="url(#ejma6-col61-viga-fp)"/>
        <text x="265.6" y="34" font-size="9.5" text-anchor="middle" fill="var(--flag)">P</text>
        <path d="M52 89 L45 101 L59 101 Z" fill="none" stroke="var(--ink)" stroke-width="1.1"/>
        <line x1="40" y1="101" x2="64" y2="101" stroke="var(--ink)" stroke-width="1.1"/>
        <path d="M42 101 L38 106 M47 101 L43 106 M52 101 L48 106 M57 101 L53 106 M62 101 L58 106" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <path d="M408 89 L401 101 L415 101 Z" fill="none" stroke="var(--ink)" stroke-width="1.1"/>
        <circle cx="404.5" cy="103.5" r="2.4" fill="none" stroke="var(--ink)" stroke-width="1"/>
        <circle cx="411.5" cy="103.5" r="2.4" fill="none" stroke="var(--ink)" stroke-width="1"/>
        <line x1="396" y1="106" x2="420" y2="106" stroke="var(--ink)" stroke-width="1.1"/>
        <path d="M398 106 L394 111 M403 106 L399 111 M408 106 L404 111 M413 106 L409 111 M418 106 L414 111" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <text x="40" y="77" font-size="10" text-anchor="middle" fill="var(--ink)">A</text>
        <text x="420" y="77" font-size="10" text-anchor="middle" fill="var(--ink)">B</text>
        <line x1="52" y1="122" x2="265.6" y2="122" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="52" y1="118" x2="52" y2="126" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="265.6" y1="118" x2="265.6" y2="126" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="158.8" y="117" font-size="9" text-anchor="middle" fill="var(--faint)">a</text>
        <line x1="265.6" y1="122" x2="408" y2="122" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="265.6" y1="118" x2="265.6" y2="126" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="408" y1="118" x2="408" y2="126" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="336.8" y="117" font-size="9" text-anchor="middle" fill="var(--faint)">b</text>
        <line x1="52" y1="142" x2="408" y2="142" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="52" y1="138" x2="52" y2="146" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="408" y1="138" x2="408" y2="146" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="230" y="137" font-size="9" text-anchor="middle" fill="var(--faint)">L</text>
      </svg>
      <figcaption>

      La viga del ejercicio 6.1, redibujada. La carga **P** está a una distancia
      **a** del apoyo A y **b** del apoyo B, con **a + b = L**. El dibujo está
      hecho con a igual a 0,6 L.

      </figcaption>
      </figure>
    pide: Las reacciones, el diagrama de cortantes y el de flectores, en función de P, a, b y L.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de calcular nada, ¿qué forma tienen los dos diagramas?
        opciones:
          - texto: >-
              La cortante es constante a trozos, con un salto de valor P bajo la
              carga; el flector es lineal a trozos, con un pico bajo la carga
            correcta: true
            mensaje: |
              Eso es. Entre los apoyos no hay carga repartida, así que
              $dV/dx = -q_y = 0$ y la cortante es constante en cada tramo; y
              como $dM/dx = V$ es constante, el flector es una recta en cada
              tramo.
          - texto: La cortante es una recta y el flector una parábola
            mensaje: |
              Esa es la pareja que sale con carga **uniformemente repartida**.
              Aquí la carga es puntual: entre los apoyos $q_y = 0$, así que la
              cortante no puede tener pendiente.
          - texto: El flector es máximo en el centro de la luz
            mensaje: |
              Solo si la carga está en el centro. El máximo está donde la
              cortante cambia de signo, y eso pasa **bajo la carga**, en
              $x = a$.

      - tipo: calcular
        titulo: La reacción del apoyo A
        pregunta: |
          Si la carga está a $a = L/4$ del apoyo A, ¿cuánto vale la reacción
          $R_A$ en unidades de $P$? Es decir, el número $k$ tal que
          $R_A = k\,P$.
        respuesta:
          tipo: numero
          valor: '0.75'
          tolerancia: 0.005
          formato: un número, el coeficiente de P
        distractores:
          - valor: '0.25'
            mensaje: |
              Has puesto $a/L$. Tomando momentos en B, la reacción de A lleva la
              distancia **al otro apoyo**: $R_A = P\,b/L$, y con $a = L/4$ es
              $b/L = 3/4$. El apoyo más cercano a la carga es el que más lleva.
          - valor: '0.5'
            mensaje: |
              Has repartido la carga a partes iguales. Eso solo vale si la carga
              está justo en el centro; aquí está a un cuarto de la luz del
              apoyo A.
        pista: |
          Momentos en B, con el giro horario positivo:
          $R_A\,L = P\,b$, y $b = 3L/4$.
        desarrollo: |
          $$
          R_A = \frac{P\,b}{L} = \frac{3}{4}P = 0{,}75\,P
          \qquad
          R_B = \frac{P\,a}{L} = 0{,}25\,P
          $$

      - tipo: calcular
        titulo: El flector máximo
        pregunta: |
          Con esa misma carga a $a = L/4$, ¿cuánto vale el flector máximo en
          unidades de $P\,L$?
        respuesta:
          tipo: numero
          valor: '0.1875'
          tolerancia: 0.003
          formato: un número, el coeficiente de PL
        distractores:
          - valor: '0.25'
            mensaje: |
              Ese es el $P\,L/4$ de la carga centrada. Descentrarla **baja** el
              flector máximo: la fórmula general es $M_{\max} = P\,a\,b/L$, que
              es máxima cuando $a = b$.
          - valor: '0.5625'
            mensaje: |
              Has multiplicado la reacción por la distancia equivocada. El
              flector bajo la carga es $R_A\,a$, con la distancia **de A a la
              carga**, no de la carga al otro apoyo.
        pista: |
          El flector bajo la carga es $R_A\,a$, con $R_A = 0{,}75\,P$ y
          $a = L/4$.
        desarrollo: |
          $$
          M_{\max} = R_A\,a = \frac{P\,b}{L}\,a = \frac{P\,a\,b}{L}
          = \frac{3}{16}P\,L = 0{,}1875\,P\,L
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Momentos en cada apoyo: $R_A = P\,b/L$ y $R_B = P\,a/L$, y la suma
              de las dos es P.
          - texto: >-
              A la izquierda de la carga solo está $R_A$, así que
              $V = +P\,b/L$; a la derecha, $V = -P\,a/L$. El salto vale P.
          - texto: >-
              El flector crece con pendiente $V$ desde cero en A y alcanza
              $P\,a\,b/L$ bajo la carga, donde la cortante cambia de signo.
          - texto: El flector máximo de una viga biapoyada está siempre en el centro de la luz.
            trampa: true
            mensaje: |
              Está donde la cortante cambia de signo, y con una carga puntual
              eso es **bajo la carga**. Solo cae en el centro cuando $a = b$.
    resolucion: |
      **Las reacciones.** Momentos en B y en A, con el giro horario positivo:

      $$
      R_A = \frac{P\,b}{L}
      \qquad
      R_B = \frac{P\,a}{L}
      $$

      **La cortante.** Es la suma de las fuerzas hacia arriba que hay a la
      izquierda de la sección. En el tramo $0 < x < a$ solo está $R_A$, y en el
      tramo $a < x < L$ está además la carga:

      $$
      V = +\frac{P\,b}{L} \quad (x < a)
      \qquad
      V = -\frac{P\,a}{L} \quad (x > a)
      $$

      La carga puntual hace saltar la cortante justo en su valor, $P$, y hacia
      abajo.

      **El flector.** Como $dM/dx = V$ y $V$ es constante en cada tramo, el
      flector es una recta en cada uno: sube desde cero en A hasta

      $$
      M_{\max} = R_A\,a = \frac{P\,a\,b}{L}
      $$

      y baja hasta cero en B. Es máximo justo bajo la carga, que es donde la
      cortante cambia de signo, y es positivo en toda la viga: la viga se comba
      hacia abajo y tracciona la fibra inferior.

      <figure>
      <svg viewBox="0 0 460 302" role="img" width="460" height="302" aria-labelledby="ejma6-col61-diag-t ejma6-col61-diag-d">
        <title id="ejma6-col61-diag-t">Diagramas de cortante y de flector de la viga biapoyada con carga puntual</title>
        <desc id="ejma6-col61-diag-d">La cortante vale mas P b partido por L desde A hasta la carga y menos P a partido por L desde la carga hasta B: dos escalones constantes con un salto de valor P bajo la carga. El flector es un triangulo, nulo en los dos apoyos y maximo bajo la carga, donde vale P a b partido por L. El dibujo esta a escala para a igual a 0,6 veces L.</desc>
        <defs>
          <marker id="ejma6-col61-diag-fd" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="var(--d1)"/></marker>
          <marker id="ejma6-col61-diag-fp" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/></marker>
          <marker id="ejma6-col61-diag-fi" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/></marker>
        </defs>
        <rect x="52" y="34" width="356" height="5" fill="var(--faint)" fill-opacity="0.3" stroke="var(--ink)" stroke-width="0.9"/>
        <path d="M52 39 L47 47 L57 47 Z" fill="none" stroke="var(--ink)" stroke-width="1"/>
        <path d="M408 39 L403 47 L413 47 Z" fill="none" stroke="var(--ink)" stroke-width="1"/>
        <text x="52" y="29" font-size="9.5" text-anchor="middle" fill="var(--ink)">A</text>
