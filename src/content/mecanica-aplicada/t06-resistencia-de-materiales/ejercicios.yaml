        <text x="230" y="296" font-size="9" text-anchor="middle" fill="var(--flag)">V = 0 · x = L/2</text>
      </svg>
      <figcaption>

      Cortante lineal y flector parabólico. El máximo del flector cae justo
      donde la cortante cruza el cero, en el centro de la luz.

      </figcaption>
      </figure>

      **Lo que hay que llevarse.** $q\,L^{2}/8$ es el número más repetido de
      todo el tema, y conviene saber de dónde sale y con qué se compara: el
      mismo tramo empotrado en un extremo daría $q\,L^{2}/2$, cuatro veces más.

  - id: ejma6-col64-el-par-concentrado-en-una-biapoyada
