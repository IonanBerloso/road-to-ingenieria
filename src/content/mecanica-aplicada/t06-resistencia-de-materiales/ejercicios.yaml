      enunciado: la carga repartida cubre el tramo AB y la carga puntual está en
      el extremo libre D.

      </figcaption>
      </figure>
    pide: Las reacciones en A y en C y los diagramas de cortante y de flector.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿En qué secciones puede estar el flector que dimensiona esta viga?
        opciones:
          - texto: >-
              Donde la cortante se anula dentro del tramo cargado, y en el apoyo
              C; hay que comparar los dos
            correcta: true
            mensaje: |
              Eso es. El vano da un máximo positivo donde $V = 0$ y el voladizo
              CD mete un flector negativo sobre C. Aquí gana el del vano,
              3,28 frente a 0,64 T·m, pero eso hay que comprobarlo, no
              suponerlo.
          - texto: En el centro de la luz AC
            mensaje: |
              El centro solo es la sección peor si la carga es simétrica. Aquí
              la carga repartida está toda en la mitad izquierda, así que la
              cortante se anula antes del centro, en $x = 3{,}62$ m.
          - texto: En B, donde acaba la carga repartida
            mensaje: |
              En B el flector ya está bajando: vale 2,805 T·m, menos que los
              3,28 de la sección de cortante nula. El final de la carga es un
              cambio de forma del diagrama, no un máximo.

      - tipo: calcular
        titulo: La reacción del apoyo A
        pregunta: |
          ¿Cuánto vale la reacción en A, en T?
        respuesta:
          tipo: numero
          valor: '1.811'
          tolerancia: 0.005
          formato: un número, en T
        distractores:
          - valor: '1.875'
            mensaje: |
              Te has olvidado de la carga P del extremo D. Está en un voladizo
              al otro lado del apoyo C, así que **descarga** el apoyo A: sin
              ella saldría 1,875 T.
          - valor: '0.686'
            mensaje: |
              Has puesto la resultante de la carga repartida en el centro de la
              viga. Está en el centro de **su tramo**, o sea a 2,5 m de A, no a
              7 m.
        pista: |
          Momentos en C: la resultante de la repartida, 2,5 T, está a 2,5 m de A
          y a 7,5 m de C; la carga P está a 4 m al otro lado.
        desarrollo: |
          $$
          R_C \cdot 10 = 2{,}5 \cdot 2{,}5 + 0{,}16 \cdot 14 = 8{,}49
          \;\Longrightarrow\;
          R_C = 0{,}849\ \text{T}
          $$

          $$
          R_A = 2{,}5 + 0{,}16 - 0{,}849 = 1{,}811\ \text{T}
          $$

      - tipo: calcular
        titulo: Dónde se anula la cortante
        pregunta: |
          ¿A qué distancia del apoyo A se anula la cortante, en metros?
        respuesta:
          tipo: numero
          valor: '3.622'
          tolerancia: 0.03
          formato: un número, en m
        distractores:
          - valor: '2.5'
            mensaje: |
              Ese es el centro del tramo cargado. La cortante se anula donde la
              carga acumulada iguala a la reacción, $0{,}5\,x = 1{,}811$, y eso
              cae más a la derecha.
          - valor: '5'
            mensaje: |
              En $x = 5$ acaba la carga repartida, y allí la cortante ya es
              negativa, $-0{,}689$ T. Se ha anulado antes.
        pista: |
          $V(x) = 1{,}811 - 0{,}5\,x$.
        desarrollo: |
          $$
          x_0 = \frac{1{,}811}{0{,}5} = 3{,}622\ \text{m}
          $$

      - tipo: calcular
        titulo: El flector máximo
        pregunta: |
          ¿Cuánto vale el momento flector máximo, en T·m?
        respuesta:
          tipo: numero
          valor: '3.28'
          tolerancia: 0.03
          formato: un número, en T·m
        distractores:
          - valor: '2.805'
            mensaje: |
              Ese es el flector en B, donde acaba la carga. El máximo está en
              $x = 3{,}62$ m, donde la cortante se anula, y vale algo más.
          - valor: '6.559'
            mensaje: |
              Eso es $R_A\,x_0$: te has olvidado de restar el momento de la
              carga repartida que queda a la izquierda,
              $0{,}5\,x_0^{2}/2 = 3{,}28$. Justo la mitad, que es lo que hace
              que el máximo sea $R_A^{2}/(2q)$.
        pista: |
          $M(x) = 1{,}811\,x - 0{,}25\,x^{2}$, evaluado en $x_0 = 3{,}622$ m.
        desarrollo: |
          $$
          M(x_0) = 1{,}811 \cdot 3{,}622 - 0{,}25 \cdot 3{,}622^{2}
          = 6{,}559 - 3{,}280 = 3{,}280\ \text{T}\cdot\text{m}
          $$

          Que es el $R_A^{2}/(2q)$ de siempre.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Momentos en C: $R_C = 0{,}849$ T, y con la suma de fuerzas,
              $R_A = 1{,}811$ T.
          - texto: >-
              La cortante baja con pendiente $-q$ hasta B, se mantiene en
              $-0{,}689$ T hasta C y salta a $+0{,}16$ T en el voladizo.
          - texto: >-
              El flector es máximo, 3,28 T·m, donde la cortante se anula, y vale
              $-0{,}64$ T·m sobre el apoyo C.
          - texto: El voladizo CD no influye en el tramo AC, porque está fuera de los apoyos.
            trampa: true
            mensaje: |
              Influye por partida doble: cambia las reacciones —sin P saldría
              $R_A = 1{,}875$ T— y mete un flector negativo de $-0{,}64$ T·m
              sobre el apoyo C, que además cambia de signo al flector en
              $x = 9{,}07$ m.
    resolucion: |
      **Las reacciones.** La carga repartida son $0{,}5 \cdot 5 = 2{,}5$ T con
      su resultante a 2,5 m de A. Tomando momentos en C:

      $$
      R_C \cdot 10 = 2{,}5 \cdot 2{,}5 + 0{,}16 \cdot 14 = 8{,}49
      \;\Longrightarrow\;
      R_C = 0{,}849\ \text{T}
      \qquad
      R_A = 1{,}811\ \text{T}
      $$

      **La cortante.**

      $$
      V(x) = 1{,}811 - 0{,}5\,x \quad (x < 5)
      \qquad
      V = -0{,}689 \quad (5 < x < 10)
      \qquad
      V = +0{,}16 \quad (x > 10)
      $$

      y se anula en $x_0 = 3{,}622$ m.

      **El flector.**

      $$
      M(x_0) = +3{,}280\ \text{T}\cdot\text{m}
      \qquad
      M(5) = +2{,}805
      \qquad
      M(10) = -0{,}64\ \text{T}\cdot\text{m}
      $$

      y se anula, además de en los extremos, en $x = 9{,}07$ m, donde el
      diagrama cambia de signo.

