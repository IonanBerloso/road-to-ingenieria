      <figcaption>

      La viga del ejercicio 6.10, redibujada a escala. La carga repartida actúa
      **hacia arriba** en toda la longitud; el par M1 es antihorario y el par
      M2, horario.

      </figcaption>
      </figure>
    pide: Las reacciones del empotramiento y los diagramas de cortante y de flector.
    pasos:
      - tipo: reconocer
        pregunta: |
          La carga repartida va hacia arriba. ¿Qué cambia respecto del caso de
          siempre?
        opciones:
          - texto: >-
              Que $q_y$ es negativa, así que $dV/dx = -q_y > 0$ y la cortante
              **sube** de izquierda a derecha
            correcta: true
            mensaje: |
              Eso es. El convenio no cambia: $q_y$ es positiva hacia abajo, y
              aquí la carga va hacia arriba, así que $q_y = -7{,}8$ T/m y la
              cortante crece con pendiente $+7{,}8$.
          - texto: Nada, el signo se arregla al final poniendo el diagrama del revés
            mensaje: |
              El signo no se arregla al final: entra en la integración. Con la
              carga hacia arriba el flector se curva hacia el otro lado
              —$d^{2}M/dx^{2} = -q_y > 0$, convexo— y donde la cortante se anula
              hay un **mínimo**, no un máximo.
          - texto: Que hay que usar $dV/dx = +q_y$
            mensaje: |
              La relación no cambia nunca: es $dV/dx = -q_y$ siempre. Lo que
              cambia es el signo del dato, $q_y = -7{,}8$ T/m.

      - tipo: calcular
        titulo: El flector en el empotramiento
        pregunta: |
          ¿Cuánto vale el momento flector en la sección del empotramiento, en
          T·m?
        respuesta:
          tipo: numero
          valor: '3.804'
          tolerancia: 0.02
          formato: un número con su signo, en T·m
        distractores:
          - valor: '-3.804'
            mensaje: |
              El módulo está bien y el signo no. La carga hacia arriba empuja el
              tramo cercano al muro hacia arriba y tracciona la fibra
              **inferior** junto al empotramiento, y eso en el convenio del
              curso es flector positivo.
          - valor: '26.364'
            mensaje: |
              Eso es solo el momento de la carga repartida,
              $7{,}8 \cdot 2{,}6^{2}/2$. Faltan la carga P del extremo
              ($-20{,}8$) y los dos pares ($+1$ y $-2{,}76$).
        pista: |
          Es más corto mirando desde el extremo libre: la carga repartida de
          toda la viga, la carga P y los dos pares.
        desarrollo: |
          $$
          M(0^{+}) = 3{,}9 \cdot 2{,}6^{2} - 8 \cdot 2{,}6 - 2{,}76 + 1
          = 26{,}364 - 20{,}8 - 1{,}76 = 3{,}804\ \text{T}\cdot\text{m}
          $$

      - tipo: calcular
        titulo: Dónde se anula la cortante
        pregunta: |
          ¿A qué distancia del empotramiento se anula la cortante, en metros?
        respuesta:
          tipo: numero
          valor: '1.574'
          tolerancia: 0.02
          formato: un número, en m
        distractores:
          - valor: '1.026'
            mensaje: |
              Esa es la distancia medida desde el **extremo libre**:
              $8/7{,}8 = 1{,}026$ m. Desde el empotramiento son
              $2{,}6 - 1{,}026 = 1{,}574$ m.
          - valor: '1.3'
            mensaje: |
              Ese es el centro de la viga. Solo sería el punto de cortante nula
              si la carga repartida fuese lo único que actúa; la carga P del
              extremo desplaza el corte hacia la derecha.
        pista: |
          Mirando desde el extremo libre: $V = 8 - 7{,}8\,u$, con $u$ medido
          desde C.
        desarrollo: |
          $$
          u = \frac{8}{7{,}8} = 1{,}0256\ \text{m}
          \;\Longrightarrow\;
          x = 2{,}6 - 1{,}0256 = 1{,}5744\ \text{m}
          $$

      - tipo: calcular
        titulo: El flector extremo del vano
        pregunta: |
          ¿Cuánto vale el flector en esa sección, en T·m?
        respuesta:
          tipo: numero
          valor: '-6.863'
          tolerancia: 0.02
          formato: un número con su signo, en T·m
        distractores:
          - valor: '-5.576'
            mensaje: |
              Ese es el valor justo a la derecha del par de B. El flector sigue
              bajando después, hasta la sección donde la cortante se anula.
          - valor: '6.863'
            mensaje: |
              El módulo está bien y el signo no. Ahí el flector tracciona la
              fibra superior: es el valor **mínimo** del diagrama, no un máximo,
              porque con la carga hacia arriba la curvatura se invierte.
        pista: |
          Desde el extremo libre, con $u = 1{,}0256$ m:
          $M = 3{,}9\,u^{2} - 8\,u - 2{,}76$.
        desarrollo: |
          $$
          M = 3{,}9 \cdot 1{,}0256^{2} - 8 \cdot 1{,}0256 - 2{,}76
          = 4{,}103 - 8{,}205 - 2{,}76 = -6{,}863\ \text{T}\cdot\text{m}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La resultante de la carga hacia arriba, $7{,}8 \cdot 2{,}6 = 20{,}28$
              T, menos los 8 T de P deja 12,28 T hacia arriba, que el
              empotramiento sujeta tirando hacia abajo.
          - texto: >-
              La cortante sube en línea recta desde $-12{,}28$ T en el
              empotramiento hasta $+8$ T junto al extremo, y se anula en
              $x = 1{,}574$ m.
          - texto: >-
              El flector vale $+3{,}804$ T·m en el empotramiento, salta $-1$ T·m
              al pasar el par de B y llega a su mínimo, $-6{,}863$ T·m, donde la
              cortante se anula.
          - texto: El par M1 aplicado en B hace saltar la cortante en esa sección.
            trampa: true
            mensaje: |
              Un par no tiene resultante, así que la cortante pasa por B sin
              enterarse: sigue siendo la misma recta. Lo que salta en B es el
              **flector**, y salta exactamente 1 T·m.
    resolucion: |
      **Las reacciones.** La carga repartida hacia arriba vale
      $7{,}8 \cdot 2{,}6 = 20{,}28$ T y la carga del extremo, 8 T hacia abajo.
      El empotramiento tiene que equilibrar la diferencia:

      $$
      R_A = 20{,}28 - 8 = 12{,}28\ \text{T} \quad (\text{hacia abajo})
      $$

      **La cortante.** Es más cómodo mirar desde el extremo libre, con $u$ la
      distancia a C:

      $$
      V = 8 - 7{,}8\,u
      $$

      Vale $+8$ T junto a C, se anula en $u = 1{,}0256$ m —o sea a 1,574 m del
      empotramiento— y llega a $-12{,}28$ T en el muro. **Sube** de izquierda a
      derecha porque la carga va hacia arriba: $dV/dx = -q_y = +7{,}8$.

      **El flector.** Con los dos pares dentro:

      $$
      M = 3{,}9\,u^{2} - 8\,u - 2{,}76 \quad (\text{tramo BC})
      \qquad
      M = 3{,}9\,u^{2} - 8\,u - 1{,}76 \quad (\text{tramo AB})
      $$

      $$
      M(C^{-}) = -2{,}76
      \qquad
      M(B^{+}) = -5{,}576
      \qquad
      M(B^{-}) = -4{,}576
      $$

      $$
      M_{\min} = -6{,}863\ \text{T}\cdot\text{m}
      \qquad
      M(A^{+}) = +3{,}804\ \text{T}\cdot\text{m}
      $$

