    pide: Los diagramas de cortante y de flector en función de q y L.
    pasos:
      - tipo: reconocer
        pregunta: |
          Si la carga repartida es constante, ¿de qué grado son la cortante y el
          flector?
        opciones:
          - texto: La cortante es una recta y el flector una parábola
            correcta: true
            mensaje: |
              Eso es. Integrando una vez $dV/dx = -q_y$ sale un polinomio de
              grado 1, y volviendo a integrar $dM/dx = V$, uno de grado 2. Con
              carga de grado $n$, la cortante es de grado $n+1$ y el flector de
              grado $n+2$.
          - texto: La cortante es una parábola y el flector una cúbica
            mensaje: |
              Eso es con carga **triangular**, que es de grado 1. Una carga
              uniforme es de grado 0.
          - texto: La cortante es constante y el flector una recta
            mensaje: |
              Eso es en un tramo **sin** carga repartida. Aquí la carga es
              constante pero no nula, así que la cortante tiene pendiente
              $-q$.

      - tipo: calcular
        titulo: La cortante a un cuarto de la luz
        pregunta: |
          ¿Cuánto vale $V$ en la sección $x = L/4$, en unidades de $q\,L$?
        respuesta:
          tipo: numero
          valor: '0.25'
          tolerancia: 0.005
          formato: un número, el coeficiente de qL
        distractores:
          - valor: '0.5'
            mensaje: |
              Esa es la reacción, es decir la cortante justo a la derecha del
              apoyo. Al avanzar $L/4$ ya se ha dejado atrás una carga
              $q\,L/4$, que hay que restar.
          - valor: '-0.25'
            mensaje: |
              El módulo está bien y el signo no. A la izquierda del centro
              pesa más la reacción que la carga acumulada, así que la cortante
              es **positiva**; se hace negativa pasado el centro.
        pista: |
          $V(x) = q\,L/2 - q\,x$, y aquí $x = L/4$.
        desarrollo: |
          $$
          V\!\left(\frac{L}{4}\right) = \frac{q\,L}{2} - q\,\frac{L}{4}
          = \frac{q\,L}{4} = 0{,}25\,q\,L
          $$

      - tipo: calcular
        titulo: El flector máximo
        pregunta: |
          ¿Cuánto vale el flector máximo, en unidades de $q\,L^{2}$?
        respuesta:
          tipo: numero
          valor: '0.125'
          tolerancia: 0.003
          formato: un número, el coeficiente de qL²
        distractores:
          - valor: '0.5'
            mensaje: |
              Ese es el $q\,L^{2}/2$ de un **voladizo** empotrado con la misma
              carga. Una viga biapoyada tiene cuatro veces menos flector: los
              dos apoyos se reparten el trabajo.
          - valor: '0.25'
            mensaje: |
              Has hecho $R\,L/2 = q\,L^{2}/4$ y te has olvidado del momento de
              la media carga que también queda a la izquierda,
              $q\,(L/2)(L/4) = q\,L^{2}/8$, que hay que restar.
        pista: |
          Está donde $V = 0$, o sea en el centro:
          $M = q\,L/2 \cdot L/2 - q\,L/2 \cdot L/4$.
        desarrollo: |
          $$
          M\!\left(\frac{L}{2}\right) = \frac{q\,L}{2}\cdot\frac{L}{2}
          - \frac{q\,L}{2}\cdot\frac{L}{4} = \frac{q\,L^{2}}{8} = 0{,}125\,q\,L^{2}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Por simetría, cada apoyo lleva media carga total:
              $R_A = R_B = q\,L/2$.
          - texto: >-
              $V(x) = q\,L/2 - q\,x$ es una recta que baja y se anula en el
              centro de la luz.
          - texto: >-
              Allí el flector es máximo y vale $q\,L^{2}/8$, con la parábola
              cóncava hacia abajo porque $d^{2}M/dx^{2} = -q_y < 0$.
          - texto: Como $dM/dx = -V$, el flector baja mientras la cortante es positiva.
            trampa: true
            mensaje: |
              Ese signo es el de otros libros, que toman el eje $y$ hacia
              arriba. En el convenio del curso —con $y$ hacia abajo— es
              $dM/dx = +V$: el flector **sube** mientras la cortante es
              positiva.
    resolucion: |
      **Las reacciones.** La carga total es $q\,L$ y, por simetría, cada apoyo
      lleva la mitad: $R_A = R_B = q\,L/2$.

      **La cortante.** Sumando lo que hay a la izquierda:

      $$
      V(x) = \frac{q\,L}{2} - q\,x
      $$

      una recta que baja de $+q\,L/2$ a $-q\,L/2$ y se anula en el centro.

      **El flector.** Integrando la cortante, o tomando momentos de lo que queda
      a la izquierda:

      $$
      M(x) = \frac{q\,L}{2}\,x - \frac{q\,x^{2}}{2}
      \qquad
      M_{\max} = M\!\left(\frac{L}{2}\right) = \frac{q\,L^{2}}{8}
      $$

