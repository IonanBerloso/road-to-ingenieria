    pide: Las reacciones en O y en C, los diagramas de la viga y la sección y la fibra más solicitadas.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué la componente vertical de la reacción en $O$ vale cero?
        opciones:
          - texto: Porque tomando momentos en A sobre la viga sola, la resultante de la carga repartida y la fuerza de la celosía pasan las dos por A, y solo queda O
            correcta: true
            mensaje: |
              Eso es. La carga repartida es uniforme en $2L$, así que su
              resultante cae justo en el centro, que es $A$; y la fuerza que la
              celosía mete en la viga se aplica en $A$. Ninguna de las dos da
              momento respecto de $A$, así que $O_y \cdot L = 0$.
          - texto: Porque el apoyo en O es un apoyo móvil y solo puede dar reacción horizontal
            mensaje: |
              El enunciado dice que la viga está «articulada en O a un apoyo
              fijo»: es una articulación, y puede dar las dos componentes. Que
              una salga nula es un resultado, no un dato del apoyo.
          - texto: Porque la carga de la viga es simétrica respecto de su centro
            mensaje: |
              La simetría de la carga repartida es parte de la razón, pero no
              basta: si la celosía tirara de la viga en un punto que no fuera el
              centro, $O_y$ no sería cero aunque la repartida siguiera siendo
              simétrica. Lo que decide es que **las dos** acciones pasan por A.

      - tipo: calcular
        titulo: La reacción vertical del apoyo fijo
        pregunta: |
          ¿Cuánto vale $C_y$, en unidades de $Mg$?
        respuesta:
          tipo: numero
          valor: '6'
          tolerancia: 0.02
          formato: un número, el coeficiente que multiplica a Mg
        distractores:
          - valor: '4'
            mensaje: |
              Has contado solo las cuatro cargas de la celosía. La viga cuelga de
              ella en A, así que su carga repartida —otros $2Mg$— también acaba
              pasando por C.
          - valor: '2'
            mensaje: |
              Esa es solo la resultante de la carga repartida de la viga. Faltan
              las cuatro cargas puntuales de la celosía.
          - valor: '3'
            mensaje: |
              Parece que has repartido el total entre los dos apoyos. No se
              reparte: como $O_y = 0$, el apoyo C se lleva la carga vertical
              entera del sistema.
        pista: |
          Equilibrio vertical de todo el sistema, sabiendo que $O_y = 0$: las
          cuatro cargas de la celosía y la resultante de la repartida.
        desarrollo: |
          $$
          C_y = 4Mg + \frac{Mg}{L}\cdot 2L = 6\,Mg
          $$

      - tipo: calcular
        titulo: La reacción horizontal
        pregunta: |
          ¿Cuánto vale $O_x$, en unidades de $Mg$?
        respuesta:
          tipo: numero
          valor: '1.3333'
          tolerancia: 0.02
          formato: un número, el coeficiente que multiplica a Mg
        distractores:
          - valor: '2.6667'
            mensaje: |
              Ese es el valor que publica la colección, $8Mg/3$, y es el doble
              del que cierra el equilibrio. Con él, los momentos del sistema
              respecto de O dejan un residuo de $2MgL$: comprueba esa ecuación y
              verás que no se anula.
          - valor: '0'
            mensaje: |
              Si no hubiera reacción horizontal en O tampoco podría haberla en C,
              y entonces nada equilibraría el momento de las cargas respecto de
              C. La pareja $O_x$ y $C_x$ forma el par que lo hace.
        pista: |
          Momentos de todo el sistema respecto de $C$: las cuatro cargas, la
          resultante de la repartida y $O_x$, cuyo brazo es la altura $3L/2$.
        desarrollo: |
          Con $O$ en el origen y $C$ en $(L/2,\ 3L/2)$, los momentos del sistema
          completo respecto de $C$ dan

          $$
          \frac{3L}{2}\,O_x = 2\,Mg\,L
          \;\Longrightarrow\;
          O_x = \frac{4}{3}\,Mg = 1{,}333\,Mg
          $$

          y por el equilibrio horizontal $C_x = -O_x$.

      - tipo: calcular
        titulo: El flector de la viga
        pregunta: |
          ¿Cuánto vale el momento flector de la viga en $A$, en unidades de
          $Mg\,L$, con su signo?
        respuesta:
          tipo: numero
          valor: '-0.5'
          tolerancia: 0.01
          formato: un número con su signo, el coeficiente de Mg por L
        distractores:
          - valor: '0.5'
            mensaje: |
              El valor absoluto está bien, pero el signo no. Con $O_y = 0$, a la
              izquierda de A solo hay carga hacia abajo: el flector es negativo
              y tracciona la fibra **superior**.
          - valor: '0.25'
            mensaje: |
              Parece el $qL^{2}/8$ de una biapoyada de luz $L$. Aquí la viga no
              está biapoyada: es la carga del tramo OA, con la resultante $Mg$ a
              $L/2$ de A, la que da el momento.
        pista: |
          Corta en A y quédate con el tramo OA: la reacción de O no da nada
          vertical, así que solo pesa la carga repartida de ese tramo.
        desarrollo: |
          $$
          M_A = -\frac{Mg}{L}\cdot L \cdot \frac{L}{2} = -\frac{MgL}{2}
          $$

      - tipo: justificar
        pregunta: Ordena la discusión del apartado c. Una pieza es falsa.
        piezas:
          - texto: 'La sección más solicitada es A, y por el lado izquierdo: ahí coinciden el flector máximo, MgL/2, y el axil de compresión del tramo OA, 4Mg/3.'
          - texto: 'Justo a la derecha de A el axil se anula, porque la celosía mete en ese nudo una fuerza horizontal que compensa la reacción de O.'
          - texto: 'En esa sección el flector es negativo y comprime la fibra inferior, y el axil de compresión se suma a él precisamente ahí.'
          - texto: 'El punto de tensión máxima es la fibra superior, porque el flector negativo la tracciona y es la más alejada.'
            trampa: true
            mensaje: |
              La fibra superior se tracciona, sí, pero ahí el axil de
              **compresión** resta. Donde los dos efectos se suman es en la
              fibra inferior, que el flector negativo comprime y el axil también:
              $|\sigma|_{\max} = \dfrac{4Mg}{3bh} + \dfrac{3MgL}{bh^{2}}$. Es la
              «fibra más baja» que señala el resultado publicado.
    resolucion: |
      **La viga, primero.** Su carga repartida vale $Mg/L$ en una longitud $2L$,
      o sea $2Mg$, con la resultante en el centro, que es justo $A$. Tomando
      momentos en $A$ para la viga sola, ni esa resultante ni la fuerza que la
      celosía le hace en $A$ dan momento:

      $$
      O_y \cdot L = 0 \;\Longrightarrow\; O_y = 0
      $$

      y del equilibrio vertical, la celosía tira de la viga hacia arriba en $A$
      con $2Mg$.

      **El sistema completo.** Verticalmente,

      $$
      C_y = 4Mg + 2Mg = 6\,Mg
      $$

      y tomando momentos respecto de $C$, que está en $(L/2,\ 3L/2)$ si $O$ es
      el origen:

      $$
      \frac{3L}{2}\,O_x = 2\,Mg\,L
      \;\Longrightarrow\;
      O_x = \frac{4}{3}Mg
      \qquad
      C_x = -\frac{4}{3}Mg
      $$

      **Los diagramas de la viga.** El axil vale $-4Mg/3$ en el tramo $OA$
      —compresión— y cero en $AB$, porque la celosía mete en $A$ la horizontal
      que compensa la reacción de $O$. La cortante baja de 0 a $-Mg$ en $A^{-}$,
      salta a $+Mg$ con la fuerza de la celosía y vuelve a 0 en $B$. El flector
      es negativo en toda la viga, nulo en los extremos y mínimo en $A$:

      $$
      M_A = -\frac{Mg}{L}\cdot L\cdot\frac{L}{2} = -\frac{MgL}{2}
      $$

      **La sección más solicitada, que es el apartado c.** Es $A$ **por el lado
      izquierdo**: ahí el flector es máximo en valor absoluto y además todavía
      hay axil de compresión, que a la derecha ya no está. Dentro de la sección,
      el flector negativo comprime la fibra inferior y tracciona la superior,
      mientras que el axil comprime las dos por igual; los dos efectos se suman
      abajo:

      $$
      |\sigma|_{\max} = \frac{4Mg}{3bh} + \frac{6\,(MgL/2)}{b h^{2}}
      = \frac{4Mg}{3bh} + \frac{3MgL}{b h^{2}}
      $$

      que coincide con lo publicado: la peor sección es A desde la izquierda y,
      dentro de ella, la fibra más baja.

      **La discrepancia, dicha entera.** La colección publica $O_x = 8Mg/3$ y
      $C_x = -8Mg/3$, el doble de lo que sale aquí. Con la geometría de la
      figura —$C$ a $L/2$ de $O$ y a $3L/2$ de altura— esos valores no cierran
      los momentos del sistema respecto de $O$: dejan un residuo de $2MgL$. El
      valor de arriba se ha comprobado por dos caminos independientes —momentos
      del conjunto respecto de $C$ y equilibrio de la celosía sola— y anula
      todas las ecuaciones. Los otros tres resultados publicados sí se
      reproducen.

