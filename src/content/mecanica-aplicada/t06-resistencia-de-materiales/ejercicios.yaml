        <circle cx="301.2" cy="282" r="2.3" fill="var(--d1)"/>
        <text x="301.2" y="295" font-size="9" text-anchor="middle" fill="var(--d1)">−6000</text>
        <line x1="205.08" y1="76" x2="205.08" y2="288" stroke="var(--flag)" stroke-width="0.8" stroke-dasharray="4 3"/>
        <text x="205.08" y="296" font-size="9" text-anchor="middle" fill="var(--flag)">V = 0 · x = 4,3 m</text>
      </svg>
      <figcaption>

      Los dos diagramas, a escala. El flector cambia de signo dos veces, en
      3,16 m y en 5,44 m, y su mayor valor absoluto está sobre el apoyo B.

      </figcaption>
      </figure>

      **Lo que hay que llevarse.** En una viga con voladizos el flector es
      negativo sobre los apoyos y positivo en el vano, y el que dimensiona es el
      mayor en valor absoluto: aquí los $-6000$ kg·m de B, no los $+1290$ del
      vano. Y si la sección no es simétrica —una T, como en los exámenes— hay
      que mirar las dos secciones, porque el signo del flector cambia qué fibra
      trabaja a tracción.

