      <figcaption>

      El árbol del ejercicio 6.11, redibujado. Las dobles flechas son los pares
      torsores: en C y en D apuntan hacia la izquierda, en E hacia la derecha y
      en el extremo B, hacia la izquierda.

      </figcaption>
      </figure>
    pide: El diagrama de momentos torsores, con el valor de cada tramo y el máximo.
    pasos:
      - tipo: reconocer
        pregunta: |
          Si el árbol solo soporta pares concentrados, ¿qué forma tiene el
          diagrama de momentos torsores?
        opciones:
          - texto: >-
              Escalonado: constante en cada tramo, con un salto en cada par
              aplicado
            correcta: true
            mensaje: |
              Eso es. La ecuación de equilibrio es $dM_t/dx = -m_t$, y aquí el
              par repartido $m_t$ es nulo, así que $M_t$ no puede cambiar dentro
              de un tramo.
          - texto: Lineal a trozos, como el flector de una viga con cargas puntuales
            mensaje: |
              Esa es la analogía equivocada. El flector es lineal porque su
              derivada es la cortante; el torsor tiene por derivada el par
              repartido, que aquí vale cero.
          - texto: Parabólico, porque la torsión reparte la tensión con el radio
            mensaje: |
              Cómo se reparte la tensión **dentro** de la sección
              —$\tau = M_t\,r/I_p$— no tiene nada que ver con cómo varía $M_t$ a
              lo largo del árbol.

      - tipo: calcular
        titulo: El par que soporta el empotramiento
        pregunta: |
          ¿Cuánto vale el par torsor de reacción en el empotramiento A, en T·m?
        respuesta:
          tipo: numero
          valor: '0.2'
          tolerancia: 0.005
          formato: un número, en T·m
        distractores:
          - valor: '2.6'
            mensaje: |
              Has sumado los módulos, $6{,}5\,T_0$. Los pares son vectores a lo
              largo del eje: los de C, D y B apuntan en un sentido y el de E en
              el contrario, así que se restan.
          - valor: '0.4'
            mensaje: |
              Te has dejado el par del extremo B. Sin él la suma sería
              $-1-1+3 = 1\,T_0$ y la reacción, $0{,}4$ T·m; contando los cuatro
              queda $0{,}5\,T_0 = 0{,}2$ T·m.
        pista: |
          Suma los cuatro pares con su signo: $-1 - 1 + 3 - 1{,}5 = -0{,}5$ en
          unidades de $T_0$, y el empotramiento equilibra esa suma.
        desarrollo: |
          $$
          \sum T = (-1 - 1 + 3 - 1{,}5)\,T_0 = -0{,}5\,T_0
          \;\Longrightarrow\;
          T_A = +0{,}5\,T_0 = 0{,}2\ \text{T}\cdot\text{m}
          $$

      - tipo: calcular
        titulo: El torsor del tramo DE
        pregunta: |
          ¿Cuánto vale el momento torsor en el tramo DE, en T·m? Toma como
          positivo el torsor cuya doble flecha sale de la sección, igual que el
          axil de tracción.
        respuesta:
          tipo: numero
          valor: '0.6'
          tolerancia: 0.005
          formato: un número con su signo, en T·m
        distractores:
          - valor: '1.2'
            mensaje: |
              Ese es el par de E a secas, $3\,T_0$. En el tramo DE hay que sumar
              todo lo que queda a un lado de la sección: el par de E **y** el
              del extremo B, que van en sentidos contrarios.
          - valor: '0.2'
            mensaje: |
              Ese es el torsor del tramo CD. Al pasar la sección D se suma el
              par aplicado allí, y el diagrama sube un escalón de $T_0$.
        pista: |
          Mira lo que hay a la derecha de una sección del tramo DE: los pares de
          E y de B, es decir $3\,T_0 - 1{,}5\,T_0$.
        desarrollo: |
          $$
          M_t^{DE} = (3 - 1{,}5)\,T_0 = 1{,}5\,T_0 = 0{,}6\ \text{T}\cdot\text{m}
          $$

      - tipo: calcular
        titulo: El tramo más solicitado
        pregunta: |
          ¿Cuál es el mayor valor absoluto del momento torsor, en T·m?
        respuesta:
          tipo: numero
          valor: '0.6'
          tolerancia: 0.005
          formato: un número, en T·m
        distractores:
          - valor: '1.2'
            mensaje: |
              Has tomado el mayor par aplicado, $3\,T_0$, como si fuera el
              torsor. El torsor de un tramo es la **suma** de los pares que
              quedan a un lado, no el mayor de ellos.
          - valor: '0.2'
            mensaje: |
              Ese es el torsor de los tramos AC y CD, los dos menos cargados.
              Los tramos DE y EB soportan tres veces más.
        pista: |
          Compara los cuatro escalones: $-0{,}5$, $+0{,}5$, $+1{,}5$ y
          $-1{,}5$, en unidades de $T_0$.
        desarrollo: |
          $$
          |M_t|_{\max} = 1{,}5\,T_0 = 0{,}6\ \text{T}\cdot\text{m}
          $$

          y se da en **dos** tramos, DE y EB, con signos contrarios. Los dos
          piden el mismo diámetro.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Como no hay par repartido, $dM_t/dx = 0$ y el diagrama es
              constante entre pares, con un escalón en cada uno.
          - texto: >-
              Sumando por la derecha de cada sección salen los cuatro valores:
              $-0{,}5$, $+0{,}5$, $+1{,}5$ y $-1{,}5$ veces $T_0$.
          - texto: >-
              El máximo en valor absoluto es $1{,}5\,T_0 = 0{,}6$ T·m, y se da en
              los tramos DE y EB.
          - texto: >-
              El tramo más solicitado es el del empotramiento, como en un
              voladizo a flexión.
            trampa: true
            mensaje: |
              En flexión el voladizo acumula todo hacia el empotramiento porque
              las cargas van todas en el mismo sentido. Aquí los pares se
              cancelan entre sí, y el tramo del empotramiento resulta ser el
              **menos** cargado: $0{,}2$ T·m frente a los $0{,}6$ de DE y EB.
    resolucion: |
      **El convenio.** Se toma positivo el momento torsor cuya doble flecha sale
      de la sección, igual que el axil de tracción. Con eso, el torsor de una
      sección es la suma de los pares que quedan a su derecha, contando
      positivos los que apuntan en el sentido de las $x$ crecientes.

      **Los cuatro tramos.** Sumando por la derecha, en unidades de $T_0$:

      $$
      M_t^{AC} = -1 - 1 + 3 - 1{,}5 = -0{,}5
      \qquad
      M_t^{CD} = -1 + 3 - 1{,}5 = +0{,}5
      $$

      $$
      M_t^{DE} = 3 - 1{,}5 = +1{,}5
      \qquad
      M_t^{EB} = -1{,}5
      $$

      y con $T_0 = 0{,}4\ \text{T}\cdot\text{m}$:

      $$
      -0{,}2
      \qquad
      +0{,}2
      \qquad
      +0{,}6
      \qquad
      -0{,}6\ \text{T}\cdot\text{m}
      $$

      **La reacción del empotramiento** es la que cierra el equilibrio:
      $+0{,}5\,T_0 = 0{,}2\ \text{T}\cdot\text{m}$, que es justo el torsor del
      primer tramo con el signo cambiado.

