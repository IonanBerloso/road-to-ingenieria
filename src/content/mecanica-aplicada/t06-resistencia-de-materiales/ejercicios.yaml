    pide: Las reacciones en A y en F y los diagramas de cortante y de momento flector.
    pasos:
      - tipo: reconocer
        pregunta: |
          Hay cuatro incógnitas de reacción —tres del empotramiento y una del
          apoyo móvil— y solo tres ecuaciones de equilibrio. ¿Qué aporta la
          rótula de $C$?
        opciones:
          - texto: Que el momento flector es nulo en C, que es la cuarta ecuación
            correcta: true
            mensaje: |
              Eso es. Una articulación interior transmite fuerza pero no momento,
              así que $M_C = 0$. Con esa condición el problema se vuelve
              isostático y se resuelve aislando el tramo CF.
          - texto: Que la cortante es nula en C
            mensaje: |
              La cortante sí pasa por la rótula: la articulación transmite las
              fuerzas, y de hecho por ahí pasan 3 kN. Lo que no transmite es el
              momento.
          - texto: Que las dos mitades están desconectadas y cada una se resuelve por su cuenta sin más
            mensaje: |
              No están desconectadas: la rótula transmite las dos componentes de
              fuerza. Lo que permite es empezar por el tramo CF, donde solo hay
              dos incógnitas, y pasar el resultado al otro tramo.

      - tipo: calcular
        titulo: La reacción del apoyo móvil
        pregunta: |
          ¿Cuánto vale la reacción vertical en $F$, en kN?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.02
          formato: un número, en kN
        distractores:
          - valor: '2'
            mensaje: |
              Eso es la mitad de P, que valdría si la carga estuviera en el
              centro del tramo CF. Está a 1 m de C y a 3 m de F, así que a F le
              toca la cuarta parte.
          - valor: '4'
            mensaje: |
              Esa es la carga entera. El tramo CF se apoya en dos sitios —la
              rótula y F—, así que la carga se reparte entre los dos.
        pista: |
          Aísla el tramo $CF$ y toma momentos en $C$: solo están $P$ a 1 m y
          $R_F$ a 4 m.
        desarrollo: |
          $$
          R_F \cdot 4 = 4 \cdot 1 \;\Longrightarrow\; R_F = 1\ \text{kN}
          $$

          y la rótula transmite $4 - 1 = 3$ kN hacia arriba desde el tramo AC.

      - tipo: calcular
        titulo: La reacción vertical del empotramiento
        pregunta: |
          ¿Cuánto vale la reacción vertical en $A$, en kN?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.02
          formato: un número, en kN
        distractores:
          - valor: '7'
            mensaje: |
              Has tomado la carga triangular como si fuera uniforme de 2 kN/m en
              2 m, o sea 4 kN. Un triángulo vale la mitad: $2 \cdot 2/2 = 2$ kN.
          - valor: '2'
            mensaje: |
              Esa es solo la resultante de la carga triangular. Falta lo que el
              tramo de la derecha le pasa al de la izquierda por la rótula, otros
              3 kN.
        pista: |
          El tramo $AC$ soporta la carga triangular —2 kN— y los 3 kN que le
          llegan por la rótula.
        desarrollo: |
          $$
          A_y = \frac{2 \cdot 2}{2} + 3 = 5\ \text{kN}
          $$

          y horizontalmente $A_x = 3$ kN hacia la izquierda, que equilibra la
          carga axial $Q$.

      - tipo: calcular
        titulo: El momento del empotramiento
        pregunta: |
          ¿Cuánto vale el momento flector en $A$, en kN·m, con su signo?
        respuesta:
          tipo: numero
          valor: '-14.67'
          tolerancia: 0.05
          formato: un número con su signo, en kN·m
        distractores:
          - valor: '-13.33'
            mensaje: |
              Has puesto la resultante del triángulo a 2/3 de metro de A. El
              centro de gravedad de un triángulo que crece hacia la derecha está
              a 2/3 de su base **desde A**, o sea a 1,33 m.
          - valor: '-12'
            mensaje: |
              Te has dejado la carga triangular: esos 12 kN·m son solo el momento
              de los 3 kN de la rótula, que están a 4 m.
        pista: |
          Momentos en A del tramo AC: la resultante del triángulo, 2 kN, está a
          $\frac{2}{3}\cdot 2 = 1{,}33$ m, y los 3 kN de la rótula a 4 m.
        desarrollo: |
          $$
          M_A = -\left(2 \cdot \frac{4}{3} + 3 \cdot 4\right) = -14{,}67\ \text{kN}\cdot\text{m}
          $$

          Negativo: en el empotramiento la viga tracciona la fibra superior.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'El tramo CF, con momentos en C, da R_F = 1 kN, y la rótula transmite 3 kN hacia arriba al tramo de la izquierda.'
          - texto: 'El tramo AC lleva la carga triangular de 2 kN y esos 3 kN, así que A_y = 5 kN y M_A = −14,67 kN·m.'
          - texto: 'El axil vale 3 kN de tracción entre A y E, y cero entre E y F, porque la carga axial se aplica en E.'
          - texto: 'En la rótula el flector vale 8 kN·m, que es lo que la articulación transmite de un tramo al otro.'
            trampa: true
            mensaje: |
              Una rótula es precisamente lo que **no** transmite momento: el
              flector vale cero en C, y esa es la ecuación que permite resolver
              el problema. Lo que sí transmite son las fuerzas, 3 kN verticales y
              3 kN horizontales.
    resolucion: |
      **La rótula es la clave.** Con empotramiento en $A$ (tres reacciones) y
      apoyo móvil en $F$ (una), hay cuatro incógnitas y tres ecuaciones. La
      articulación de $C$ añade la que falta: $M_C = 0$.

      **El tramo CF.** Aislándolo, con la rótula a la izquierda y el apoyo móvil
      a la derecha, y tomando momentos en C:

      $$
      R_F \cdot 4 = 4 \cdot 1 \;\Longrightarrow\; R_F = 1\ \text{kN}
      $$

      así que por la rótula pasan $4 - 1 = 3$ kN verticales. La carga axial $Q$
      va por el eje, no da momento, y se transmite entera hacia el
      empotramiento: el apoyo móvil no puede recogerla.

      **El tramo AC.** Soporta la carga triangular —resultante $2$ kN a
      $\frac{2}{3}\cdot 2 = 1{,}33$ m de A— y los 3 kN de la rótula a 4 m:

      $$
      A_x = 3\ \text{kN (hacia la izquierda)}
      \qquad
      A_y = 5\ \text{kN}
      \qquad
      M_A = -14{,}67\ \text{kN}\cdot\text{m}
      $$

      **Los diagramas.** El axil vale $+3$ kN entre A y E y cero entre E y F. La
      cortante parte de 5 kN, baja como una parábola hasta 3 kN en B —la carga
      es lineal, así que $V$ es de segundo grado—, se mantiene en 3 kN hasta D,
      salta a $-1$ kN y se queda ahí hasta F, donde la reacción la cierra. El
      flector va de $-14{,}67$ kN·m en A a cero en la rótula, sube hasta
      $+3$ kN·m en D —donde la cortante cambia de signo— y vuelve a cero en el
      apoyo móvil.

      **Qué no se puede resolver, y por qué.** Los apartados c y d piden el
      centro de gravedad, la inercia y la tensión máxima de **la sección**, y la
      figura publicada no la incluye: no hay ninguna sección dibujada ni acotada
      en el enunciado. La colección tampoco publica resultado —imprime
      «Resultado: [-]»—. Con lo publicado, esos dos apartados no tienen datos, y
      no se inventan: en cuanto se conozca la sección, el camino es el de
      siempre, $\sigma_{\max} = M_{\max}\,y_{\max}/I$ con
      $M_{\max} = 14{,}67$ kN·m en el empotramiento, sumando el axil
      $N/A = 3\ \text{kN}/A$ en las secciones entre A y E.

