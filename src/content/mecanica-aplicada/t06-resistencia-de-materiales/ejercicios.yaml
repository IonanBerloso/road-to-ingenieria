  - id: ejma6-col613-la-barra-inclinada-sobre-la-viga
    titulo: La barra inclinada y lo que le mete a la viga
    fuente: >-
      Ejercicio 6.13 · Tema 6, «Principios de resistencia de materiales» ·
      Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección no publica
      resultado, y su figura no lleva ninguna carga exterior sobre la viga: con
      lo publicado, el equilibrio obliga a que la barra no trabaje y los tres
      diagramas salen nulos. El desarrollo y las preguntas son nuestros.
    nivel: practica
    enunciado: |
      Dibujar los diagramas de esfuerzos y momentos sobre el elemento $AB$ de
      la figura.

      <figure>
      <svg viewBox="0 0 360 260" role="img" width="360" height="260" aria-labelledby="ma6c613-t ma6c613-d">
