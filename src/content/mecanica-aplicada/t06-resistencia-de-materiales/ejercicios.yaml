    pide: El canto h de la sección, sabiendo que el ancho es 40 mm y la tensión admisible 12 MPa.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿En qué sección hay que dimensionar, y por qué?
        opciones:
          - texto: En C, bajo la carga de 3,6 kN, porque ahí la cortante cambia de signo y el flector es máximo
            correcta: true
            mensaje: |
              Eso es. Con cargas puntuales el flector es una poligonal y su
              máximo está en un vértice: justo donde $V$ pasa de positiva a
              negativa. Aquí ocurre en $C$.
          - texto: En el centro del vano, que es donde el flector es siempre máximo
            mensaje: |
              Eso solo es verdad cuando la carga es simétrica. Aquí la carga de
              la derecha es el doble que la de la izquierda, así que el máximo
              se desplaza hacia ella.
          - texto: En los apoyos, que es donde están las reacciones y la cortante es mayor
            mensaje: |
              En un apoyo extremo el flector es nulo: no hay nada a un lado que
              dé momento. Donde la cortante es mayor el flector crece más
              deprisa, que no es lo mismo que ser máximo.

      - tipo: calcular
        titulo: El flector máximo
        pregunta: |
          ¿Cuánto vale el momento flector máximo de la viga, en kN·m?
        respuesta:
          tipo: numero
          valor: '2.4'
          tolerancia: 0.02
          formato: un número, en kN·m
        distractores:
          - valor: '1.92'
            mensaje: |
              Ese es el flector en $B$, bajo la carga de 1,8 kN. Es un vértice
              del diagrama, pero no el mayor: en $C$ el momento sigue subiendo
              hasta 2,4 kN·m.
          - valor: '4.32'
            mensaje: |
              Has sumado los momentos de las dos cargas sin restar el de la
              reacción, o has multiplicado por la luz entera. Corta en $C$ y
              usa solo lo que hay a un lado.
        pista: |
          Corta en $C$ y quédate con la parte derecha: solo está la reacción de
          $D$, a 0,8 m.
        desarrollo: |
          $$
          R_D = \frac{1{,}8 \cdot 0{,}8 + 3{,}6 \cdot 1{,}6}{2{,}4} = 3\ \text{kN}
          \qquad
          M_C = 3 \cdot 0{,}8 = 2{,}4\ \text{kN}\cdot\text{m}
          $$

      - tipo: calcular
        titulo: El canto
        pregunta: |
          Con $b = 40\ \text{mm}$ y $\sigma_{\text{adm}} = 12\ \text{MPa}$,
          ¿cuánto vale el canto $h$?
        respuesta:
          tipo: magnitud
          valor: '173.2 mm'
          tolerancia: 0.01
          formato: una longitud, con su unidad
        distractores:
          - valor: '244.9 mm'
            mensaje: |
              Has usado $b h^{2}/12$ como módulo resistente. Eso es $I/h$, no
              $W$: el módulo resistente de un rectángulo es
              $W = I/(h/2) = b h^{2}/6$.
          - valor: '154.9 mm'
            mensaje: |
              Has dimensionado con el flector de $B$, 1,92 kN·m, en vez de con
              el máximo, 2,4 kN·m. La sección que manda es la peor de todas.
        pista: |
          $\sigma = M/W$ con $W = b h^{2}/6$; despeja $h$ con todo en metros y
          newtons.
        desarrollo: |
          $$
          h = \sqrt{\frac{6M}{b\,\sigma_{\text{adm}}}}
          = \sqrt{\frac{6 \cdot 2400}{0{,}04 \cdot 12 \cdot 10^{6}}}
          = 0{,}1732\ \text{m}
          $$

      - tipo: justificar
        pregunta: Ordena el dimensionamiento. Una pieza es falsa.
        piezas:
          - texto: 'Las reacciones salen de los momentos: 2,4 kN en A y 3 kN en D, que suman las dos cargas.'
          - texto: 'El flector es una poligonal con vértices en B y en C, y el mayor es el de C, 2,4 kN·m.'
          - texto: 'Con W = bh²/6 e imponiendo σ = M/W ≤ 12 MPa sale h = 173,2 mm.'
          - texto: 'Como el material aguanta lo mismo a tracción que a compresión, hay que comprobar por separado la fibra de arriba y la de abajo.'
            trampa: true
            mensaje: |
              En una sección **rectangular** las dos fibras extremas están a la
              misma distancia del eje neutro, así que las dos tensiones tienen
              el mismo valor absoluto y una sola comprobación basta. Eso de
              mirar las dos fibras hace falta en una **T**, donde el eje neutro
              no está a media altura.
    resolucion: |
      **Las reacciones.** Tomando momentos en $A$:

      $$
      R_D = \frac{1{,}8 \cdot 0{,}8 + 3{,}6 \cdot 1{,}6}{2{,}4} = 3\ \text{kN}
      \qquad
      R_A = 5{,}4 - 3 = 2{,}4\ \text{kN}
      $$

      **El flector máximo.** Con cargas puntuales la cortante es constante a
      trozos —2,4 kN, luego 0,6 kN, luego $-3$ kN— y el flector, una poligonal
      con vértices bajo las cargas:

      $$
      M_B = 2{,}4 \cdot 0{,}8 = 1{,}92\ \text{kN}\cdot\text{m}
      \qquad
      M_C = 3 \cdot 0{,}8 = 2{,}4\ \text{kN}\cdot\text{m}
      $$

      La cortante cambia de signo en $C$, así que el máximo es
      $M_{\max} = 2{,}4\ \text{kN}\cdot\text{m}$.

      **El canto.** La sección es rectangular, con
      $W = b h^{2}/6$, y se impone la tensión admisible:

      $$
      \sigma_{\max} = \frac{M_{\max}}{W} = \frac{6M_{\max}}{b\,h^{2}} \le \sigma_{\text{adm}}
      \;\Longrightarrow\;
      h \ge \sqrt{\frac{6 \cdot 2400}{0{,}04 \cdot 12 \cdot 10^{6}}} = 173{,}2\ \text{mm}
      $$

      que es el resultado que publica la colección, $h = 173{,}20$ mm. Al ser
      rectangular y simétrica, la fibra de arriba y la de abajo trabajan al
      mismo valor —una a compresión y otra a tracción— y por eso basta una sola
      comprobación.
  - id: ejma6-col615-la-carga-maxima-con-seccion-en-t
    titulo: La carga máxima de una viga con sección en T
    fuente: >-
