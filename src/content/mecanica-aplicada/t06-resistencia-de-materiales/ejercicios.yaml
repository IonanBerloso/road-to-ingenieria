      <figcaption>

      La viga del ejercicio 6.7, redibujada a escala. El círculo blanco en D es
      la rótula que une los dos trozos; los apoyos son B, C y E.

      </figcaption>
      </figure>
    pide: Las reacciones en B, C y E y los diagramas de cortante y de flector.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué aporta la rótula de D al cálculo?
        opciones:
          - texto: >-
              Una ecuación más, la de flector nulo en esa sección, que es lo que
              hace isostática una viga con tres apoyos
            correcta: true
            mensaje: |
              Eso es. Tres reacciones verticales y solo dos ecuaciones de la
              estática plana dejarían la viga hiperestática; la rótula añade
              «$M = 0$ en D» y el problema se cierra.
          - texto: Nada para el cálculo, es solo una junta constructiva
            mensaje: |
              Sin ella el problema no se puede resolver con la estática: hay
              tres incógnitas verticales y dos ecuaciones. La rótula es
              justamente la tercera ecuación.
          - texto: Que la cortante sea nula en esa sección
            mensaje: |
              Lo que no transmite una rótula es **momento**, no cortante. De
              hecho aquí la cortante en D salta de $+200$ a $-800$ kg por la
              carga puntual.

      - tipo: calcular
        titulo: La reacción del apoyo E
        pregunta: |
          ¿Cuánto vale la reacción en E, en kg?
        respuesta:
          tipo: numero
          valor: '2400'
          tolerancia: 5
          formato: un número, en kg
        distractores:
          - valor: '3200'
            mensaje: |
              Has puesto la resultante de la carga de EF en el extremo F. Está
              en el centro de esos 2 m, o sea a 3 m de la rótula, no a 4.
          - valor: '800'
            mensaje: |
              Has repartido los 1600 kg del tramo EF a medias entre E y F, como
              si fuera una viga biapoyada. F es un extremo **libre**: la carga
              del voladizo la aguanta el apoyo E con la ayuda de la rótula.
        pista: |
          Aísla el trozo de la derecha de la rótula y toma momentos en D, donde
          el flector es nulo: la resultante de la carga de EF, 1600 kg, está a
          3 m de D.
        desarrollo: |
          $$
          R_E \cdot 2 = 1600 \cdot 3
          \;\Longrightarrow\;
          R_E = 2400\ \text{kg}
          $$

          El trozo DEF recibe además, en la rótula, una fuerza de
          $1600 - 2400 = -800$ kg: la parte izquierda tira de él hacia abajo.

      - tipo: calcular
        titulo: La reacción del apoyo C
        pregunta: |
          ¿Cuánto vale la reacción en C, en kg? Cuidado con el signo.
        respuesta:
          tipo: numero
          valor: '-400'
          tolerancia: 5
          formato: un número con su signo, en kg; negativo si va hacia abajo
        distractores:
          - valor: '400'
            mensaje: |
              El módulo está bien y el signo no. Con la cuenta hecha, en C sale
              una reacción **hacia abajo**: el apoyo tiene que sujetar la viga,
              no empujarla. Un rodillo que solo empuja no valdría aquí.
          - valor: '1600'
            mensaje: |
              Esa es la reacción de B. Los dos apoyos están a un metro y
              trabajan en sentidos opuestos: B empuja 1600 kg hacia arriba y C
              tira 400 hacia abajo.
        pista: |
          Del trozo izquierdo ABCD, con momentos en D y la suma de fuerzas:
          $3R_B + 2R_C = 1000 \cdot 4$ y $R_B + R_C = 1200$.
        desarrollo: |
          $$
          3R_B + 2R_C = 4000
          \qquad
          R_B + R_C = 1200
          $$

          $$
          R_B = 1600\ \text{kg}
          \qquad
          R_C = -400\ \text{kg} \quad (\text{hacia abajo})
          $$

      - tipo: calcular
        titulo: El flector máximo en valor absoluto
        pregunta: |
          ¿Cuál es el mayor valor absoluto del momento flector, en kg·m?
        respuesta:
          tipo: numero
          valor: '1600'
          tolerancia: 5
          formato: un número, en kg·m
        distractores:
          - valor: '1000'
            mensaje: |
              Ese es el flector del apoyo B, el del voladizo izquierdo:
              $-500 \cdot 2 \cdot 1$. El de E es mayor porque el voladizo FE
              lleva 800 kg/m.
          - valor: '400'
            mensaje: |
              Ese es el flector del apoyo C. Entre C y la rótula el flector
              sigue subiendo hacia cero, así que C no es la sección peor.
        pista: |
          Mira el voladizo de la derecha desde F: 800 kg/m sobre 2 m, con la
          resultante a 1 m del apoyo E.
        desarrollo: |
          $$
          M(7) = -800 \cdot 2 \cdot 1 = -1600\ \text{kg}\cdot\text{m}
          $$

          Contra los $-1000$ de B y los $-400$ de C: la sección de E es la peor.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Se empieza por el trozo de la derecha de la rótula, que se resuelve
              solo: $R_E = 2400$ kg y en D se transmiten 800 kg hacia abajo.
          - texto: >-
              Con eso, el trozo izquierdo da $R_B = 1600$ kg hacia arriba y
              $R_C = 400$ kg hacia abajo.
          - texto: >-
              El flector es negativo en toda la viga, vale exactamente cero en
              la rótula y su mayor valor absoluto, 1600 kg·m, está en E.
          - texto: En la rótula el flector no puede ser nulo, porque justo ahí hay una carga de 1000 kg.
            trampa: true
            mensaje: |
              Una carga puntual hace saltar la **cortante**, no el flector. En
              la rótula el flector es nulo por construcción: es una sección que
              no transmite momento, tenga o no una carga encima.
    resolucion: |
      **Por dónde se empieza.** La rótula parte el problema en dos. El trozo
      DEF se resuelve solo, tomando momentos en D, donde el flector es nulo:

      $$
      R_E \cdot 2 = 800 \cdot 2 \cdot 3 = 4800
      \;\Longrightarrow\;
      R_E = 2400\ \text{kg}
      $$

      y en la rótula el trozo derecho recibe $1600 - 2400 = -800$ kg, es decir,
      la parte izquierda tira de él hacia abajo con 800 kg.

      **El trozo izquierdo.** Con la carga de 1000 kg en D y esos 800 kg que le
      devuelve el trozo derecho:

      $$
      R_B = 1600\ \text{kg}
      \qquad
      R_C = -400\ \text{kg}
      $$

      La reacción de C es **hacia abajo**: el tramo BC hace de contrapeso.

      **Los diagramas.** La cortante, sumando lo que hay a la izquierda:

      $$
      V(2^{-}) = -1000
      \qquad
      V(2^{+}) = 600
      \qquad
      V(3^{+}) = 200
      \qquad
      V(5^{+}) = -800
      \qquad
      V(7^{+}) = 1600
      $$

      y el flector,

      $$
      M(2) = -1000
      \qquad
      M(3) = -400
      \qquad
      M(5) = 0
      \qquad
      M(7) = -1600\ \text{kg}\cdot\text{m}
      $$

      <figure>
      <svg viewBox="0 0 460 302" role="img" width="460" height="302" aria-labelledby="ejma6-col67-diag-t ejma6-col67-diag-d">
        <title id="ejma6-col67-diag-t">Diagramas de cortante y de flector de la viga Gerber</title>
        <desc id="ejma6-col67-diag-d">La cortante baja hasta menos 1000 kilogramos en el voladizo AB, salta a mas 600 en el apoyo B, baja a mas 200 en el apoyo C, cae a menos 800 en la rotula D por la carga de 1000 kilogramos, salta a mas 1600 en el apoyo E y baja linealmente hasta cero en el extremo F. El flector es negativo en toda la viga: menos 1000 kilogramo metro en B, menos 400 en C, exactamente cero en la rotula D y menos 1600 en E, que es el maximo en valor absoluto.</desc>
