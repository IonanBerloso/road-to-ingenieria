      <figcaption>

      La viga del ejercicio 6.5, redibujada a escala. La carga repartida de
      2000 kg/m llega desde el extremo izquierdo hasta el apoyo B, y la carga
      puntual de 2000 kg cuelga del extremo derecho.

      </figcaption>
      </figure>
    pide: Las reacciones en A y en B y los diagramas de cortante y de flector.
    pasos:
      - tipo: reconocer
        pregunta: |
          En una viga con voladizos, ¿en qué secciones hay que mirar el flector?
        opciones:
          - texto: >-
              En los apoyos, donde suele ser negativo, y en el punto del vano
              donde la cortante se anula
            correcta: true
            mensaje: |
              Eso es. Los voladizos meten flector negativo sobre los apoyos y el
              vano da uno positivo donde $V = 0$; el que manda para dimensionar
              es el mayor de los dos **en valor absoluto**.
          - texto: Solo en el centro del vano, que es donde más se comba
            mensaje: |
              En una viga con voladizos el centro del vano casi nunca es la
              sección peor. Aquí el flector del vano vale 1290 kg·m y el del
              apoyo B, 6000: casi cinco veces más.
          - texto: En el extremo libre, donde está la carga
            mensaje: |
              En un extremo libre el flector es siempre cero: no hay nada más
              allá que dé momento. Lo que hace la carga del extremo es cargar el
              apoyo de al lado.

      - tipo: calcular
        titulo: La reacción del apoyo A
        pregunta: |
          ¿Cuánto vale la reacción en A, en kg?
        respuesta:
          tipo: numero
          valor: '8600'
          tolerancia: 5
          formato: un número, en kg
        distractores:
          - valor: '9800'
            mensaje: |
              Te has olvidado de los 2000 kg del extremo derecho. Esa carga tira
              del voladizo, carga el apoyo B y **descarga** el apoyo A, así que
              con ella $R_A$ baja.
          - valor: '6800'
            mensaje: |
              Has extendido la carga repartida hasta el extremo derecho. Solo
              llega hasta el apoyo B: son 7 m de carga, 14000 kg, no 10 m.
        pista: |
          Momentos en B: la resultante de la repartida, 14000 kg, está en el
          centro de sus 7 m, o sea a 3,5 m del extremo izquierdo.
        desarrollo: |
          $$
          R_B \cdot 5 = 14000 \cdot 1{,}5 + 2000 \cdot 8 = 37000
          \;\Longrightarrow\;
          R_B = 7400\ \text{kg}
          $$

          $$
          R_A = 14000 + 2000 - 7400 = 8600\ \text{kg}
          $$

      - tipo: calcular
        titulo: La sección de flector máximo positivo
        pregunta: |
          ¿A qué distancia del extremo izquierdo se anula la cortante dentro del
          vano, en metros?
        respuesta:
          tipo: numero
          valor: '4.3'
          tolerancia: 0.05
          formato: un número, en m
        distractores:
          - valor: '3.5'
            mensaje: |
              Ese es el centro de la carga repartida, que no tiene por qué ser
              donde la cortante se anula. Hay que partir de la cortante justo a
              la derecha de A, 4600 kg, e ir restando 2000 kg por metro.
          - valor: '4.5'
            mensaje: |
              Ese es el centro del vano AB. Solo sería el punto de cortante nula
              si la viga fuese simétrica, y aquí no lo es: hay 2 m de voladizo a
              un lado y 3 m con una carga puntual al otro.
        pista: |
          Justo a la derecha de A la cortante vale $-4000 + 8600 = 4600$ kg, y
          baja 2000 kg por cada metro.
        desarrollo: |
          $$
          V(x) = 4600 - 2000\,(x - 2) = 0
          \;\Longrightarrow\;
          x - 2 = 2{,}3
          \;\Longrightarrow\;
          x = 4{,}3\ \text{m}
          $$

      - tipo: calcular
        titulo: El flector sobre el apoyo B
        pregunta: |
          ¿Cuánto vale el momento flector en la sección del apoyo B, en kg·m?
        respuesta:
          tipo: numero
          valor: '-6000'
          tolerancia: 5
          formato: un número con su signo, en kg·m
        distractores:
          - valor: '6000'
            mensaje: |
              El módulo está bien y el signo no. El voladizo de la derecha
              **levanta** la viga sobre el apoyo: tracciona la fibra superior, y
              eso en el convenio del curso es flector negativo.
          - valor: '-4000'
            mensaje: |
              Ese es el flector sobre el apoyo A, el del voladizo izquierdo:
              $-2000 \cdot 2 \cdot 1$. El de B lo da la carga del extremo
              derecho.
        pista: |
          Es más corto mirando por la derecha: solo hay la carga de 2000 kg a
          3 m de distancia.
        desarrollo: |
          $$
          M(7) = -2000 \cdot 3 = -6000\ \text{kg}\cdot\text{m}
          $$

          Por la izquierda sale lo mismo:
          $-2000 \cdot 7 \cdot 3{,}5 + 8600 \cdot 5 = -49000 + 43000 = -6000$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Momentos en B y suma de fuerzas: $R_A = 8600$ kg y
              $R_B = 7400$ kg.
          - texto: >-
              La cortante baja hasta $-4000$ kg en A, salta a $+4600$, vuelve a
              bajar hasta $-5400$ en B y salta a $+2000$ en el último tramo.
          - texto: >-
              El flector vale $-4000$ kg·m en A, $+1290$ en la sección de
              cortante nula y $-6000$ en B, que es el máximo en valor absoluto.
          - texto: El flector máximo está en el vano, donde la cortante se anula.
            trampa: true
            mensaje: |
              Ahí está el máximo **positivo**, 1290 kg·m, pero no el mayor en
              valor absoluto: sobre el apoyo B el flector vale $-6000$ kg·m, y
              esa es la sección que hay que dimensionar.
    resolucion: |
      **Las reacciones.** La carga repartida son $2000 \cdot 7 = 14000$ kg con
      su resultante a 3,5 m del extremo izquierdo. Tomando momentos en B:

      $$
      R_B \cdot 5 = 14000 \cdot 1{,}5 + 2000 \cdot 8 = 37000
      \;\Longrightarrow\;
      R_B = 7400\ \text{kg}
      \qquad
      R_A = 8600\ \text{kg}
      $$

      **La cortante.** En el voladizo izquierdo baja de 0 a $-4000$ kg; en A
      salta a $+4600$ y baja con pendiente $-2000$ hasta $-5400$ justo antes de
      B; allí salta a $+2000$, que es lo que pide la carga del extremo. Se anula
      en

      $$
      x = 2 + \frac{4600}{2000} = 4{,}3\ \text{m}
      $$

      **El flector.**

      $$
      M(2) = -1000 \cdot 2^{2} = -4000\ \text{kg}\cdot\text{m}
      $$

      $$
      M(4{,}3) = -1000 \cdot 4{,}3^{2} + 8600 \cdot 2{,}3 = +1290\ \text{kg}\cdot\text{m}
      $$

      $$
      M(7) = -2000 \cdot 3 = -6000\ \text{kg}\cdot\text{m}
      $$

