    pide: El diagrama de momentos torsores en función de M sub o y el diámetro D que cumple en los dos tramos.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué fija el momento torsor de cada tramo?
        opciones:
          - texto: La suma de los momentos aplicados a un lado de la sección, así que los dos tramos llevan torsores distintos
            correcta: true
            mensaje: |
              Eso es. Con momentos concentrados, $dM_t/dx = 0$ dentro de cada
              tramo y el diagrama es uniforme a trozos, con un escalón en cada
              momento aplicado.
          - texto: Es el mismo en toda la barra, porque el torsor se transmite entero de un extremo al otro
            mensaje: |
              Solo sería así si no hubiera ningún momento aplicado en medio.
              Aquí en B se aplica uno, y ahí el diagrama salta.
          - texto: El tramo grueso lleva menos torsor porque tiene más diámetro
            mensaje: |
              El diámetro no entra en el equilibrio: el torsor lo fija la
              estática, no la geometría de la sección. Lo que sí cambia con el
              diámetro es la **tensión** que ese torsor produce.

      - tipo: calcular
        titulo: El torsor del tramo delgado
        pregunta: |
          ¿Cuánto vale el momento torsor del tramo $AB$, en unidades de $M_O$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número, el coeficiente que multiplica a M sub o
        distractores:
          - valor: '4'
            mensaje: |
              Has sumado los dos momentos. Están dibujados con las flechas
              opuestas, así que giran en sentidos contrarios y se restan: el
              empotramiento solo tiene que dar la diferencia.
          - valor: '3'
            mensaje: |
              Ese es el torsor del tramo BC, el que solo ve el momento del
              extremo. En AB hay que contar además el que se aplica en B.
          - valor: '1'
            mensaje: |
              Has restado al revés. Mirando hacia el lado libre, a la derecha de
              AB están los dos momentos, y su suma con signo vale 2M sub o.
        pista: |
          Corta en $AB$ y mira hacia $C$: a ese lado están $M_O$ y $3M_O$, en
          sentidos contrarios.
        desarrollo: |
          $$
          M_{t,AB} = 3M_O - M_O = 2M_O
          \qquad
          M_{t,BC} = 3M_O
          $$

      - tipo: calcular
        titulo: El diámetro
        pregunta: |
          ¿Qué diámetro $D$ hace falta para que **los dos** tramos aguanten?
        respuesta:
          tipo: magnitud
          valor: '6.976 cm'
          tolerancia: 0.01
          formato: una longitud, con su unidad
        distractores:
          - valor: '3.99 cm'
            mensaje: |
              Ese es el valor que publica la colección, y sale de imponer la
              admisible solo en el tramo grueso. Con él, el tramo delgado se va
              a 3200 kg/cm2: el diámetro tiene que cumplir en los dos.
          - valor: '7.986 cm'
            mensaje: |
              Ese es el diámetro del tramo **grueso** que exige BC, o sea 2D, no
              D. Ojo con qué diámetro estás despejando en cada tramo.
        pista: |
          En AB, $\tau = 16 M_{t}/(\pi D^{3})$ con $M_t = 2M_O$; en BC lo mismo
          pero con $2D$ y $3M_O$. Comprueba cuál pide más.
        desarrollo: |
          Con $M_O = 20\,000$ kg·cm, en el tramo delgado:

          $$
          D \ge \sqrt[3]{\frac{16 \cdot 2M_O}{\pi\,\tau_{\text{adm}}}}
          = \sqrt[3]{\frac{16 \cdot 40\,000}{\pi \cdot 600}} = 6{,}98\ \text{cm}
          $$

          y en el grueso, $2D \ge 7{,}99$ cm, o sea $D \ge 4{,}0$ cm. Manda el
          delgado.

      - tipo: justificar
        pregunta: Ordena el dimensionamiento. Una pieza es falsa.
        piezas:
          - texto: 'El diagrama de torsores es uniforme a trozos: 2Mo en AB y 3Mo en BC, con un escalón de Mo en B.'
          - texto: 'La tensión máxima de cada tramo va como el torsor partido por el cubo del diámetro, y en AB eso es 2Mo/D³ frente a 3Mo/8D³ en BC.'
          - texto: 'El tramo delgado está más de cinco veces más solicitado, así que es el que dimensiona: D = 6,98 cm.'
            trampa: false
          - texto: 'Manda el tramo BC porque lleva más momento torsor, 3Mo frente a 2Mo.'
            trampa: true
            mensaje: |
              Llevar más momento no es estar más solicitado. La tensión es
              $16M_t/(\pi D^{3})$: al doblar el diámetro, el denominador se
              multiplica por ocho. El tramo grueso aguanta el 50 % más de
              momento con la octava parte de penalización.
    resolucion: |
      **El diagrama de torsores.** Solo hay momentos concentrados, así que el
      diagrama es uniforme a trozos. Mirando hacia el extremo libre:

      $$
      M_{t,AB} = 3M_O - M_O = 2M_O
      \qquad
      M_{t,BC} = 3M_O
      $$

      y en el empotramiento la reacción vale $2M_O$, que es lo que cierra el
      equilibrio.

      **Qué tramo manda.** La tensión máxima de una sección circular llena es
      $\tau_{\max} = 16M_t/(\pi D^{3})$. Comparando los dos tramos con el mismo
      $D$ de referencia:

      $$
      \tau_{AB} = \frac{16 \cdot 2M_O}{\pi D^{3}} = \frac{32 M_O}{\pi D^{3}}
      \qquad
      \tau_{BC} = \frac{16 \cdot 3M_O}{\pi (2D)^{3}} = \frac{6 M_O}{\pi D^{3}}
      $$

      El delgado está **5,3 veces más solicitado**. Doblar el diámetro divide la
      tensión por ocho, y eso se come de sobra el 50 % más de momento.

      **El diámetro.** Con $M_O = 0{,}2\ \text{T}\cdot\text{m} = 20\,000$ kg·cm
      y $\tau_{\text{adm}} = 600$ kg/cm²:

      $$
      D \ge \sqrt[3]{\frac{16 \cdot 40\,000}{\pi \cdot 600}} = 6{,}98\ \text{cm}
      $$

      **La discrepancia, dicha entera.** La colección publica $D = 3{,}99$ cm,
      que es exactamente lo que sale de imponer la admisible **solo en BC**:
      $2D \ge 7{,}99$ cm. Pero con ese diámetro el tramo delgado trabaja a

      $$
      \tau_{AB} = \frac{16 \cdot 40\,000}{\pi \cdot 3{,}99^{3}} = 3200\ \text{kg}/\text{cm}^{2}
      $$

      más de cinco veces la admisible. El diámetro que cumple los dos tramos es
      el nuestro, 6,98 cm.

