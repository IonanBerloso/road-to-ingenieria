      </figcaption>
      </figure>
    pide: Las reacciones y los diagramas de cortante y de flector en función de q0 y L.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Dónde está la resultante de la carga triangular?
        opciones:
          - texto: >-
              A un tercio de la base contando desde el lado de mayor carga, o
              sea en $x = 5L/6$
            correcta: true
            mensaje: |
              Eso es: el centro de gravedad de un triángulo está a un tercio de
              la altura desde su base mayor. Con la carga de $L/2$ a $L$, cae en
              $L/2 + (2/3)(L/2) = 5L/6$.
          - texto: En el centro del tramo cargado, en $x = 3L/4$
            mensaje: |
              Ese es el centro de un rectángulo, no de un triángulo. La carga
              pesa mucho más cerca de C, así que su resultante está desplazada
              hacia allí.
          - texto: En el punto de carga máxima, en el apoyo C
            mensaje: |
              Ahí está el valor máximo de la carga, no su resultante. Si toda la
              carga estuviera en C, el apoyo A no recibiría nada, y sí recibe
              $q_0L/24$.

      - tipo: calcular
        titulo: La reacción del apoyo A
        pregunta: |
          ¿Cuánto vale $R_A$ en unidades de $q_0 L$?
        respuesta:
          tipo: numero
          valor: '0.041667'
          tolerancia: 0.0008
          formato: un número, el coeficiente de q0L
        distractores:
          - valor: '0.0625'
            mensaje: |
              Sale de poner la resultante en el centro del tramo cargado,
              $3L/4$. El centro de gravedad de un triángulo está en $5L/6$, más
              cerca de C, y por eso A recibe menos.
          - valor: '0.125'
            mensaje: |
              Has repartido la carga total, $q_0L/4$, a partes iguales. La carga
              no está centrada en la viga: está toda en la mitad derecha.
        pista: |
          Carga total $q_0L/4$ aplicada en $5L/6$; momentos en C:
          $R_A\,L = (q_0L/4)(L/6)$.
        desarrollo: |
          $$
          R_A = \frac{q_0L}{4}\cdot\frac{L/6}{L} = \frac{q_0L}{24}
          = 0{,}041667\,q_0L
          \qquad
          R_C = \frac{5\,q_0L}{24}
          $$

      - tipo: calcular
        titulo: Dónde se anula la cortante
        pregunta: |
          ¿En qué sección se anula la cortante, medida desde A en unidades de
          $L$?
        respuesta:
          tipo: numero
          valor: '0.7041'
          tolerancia: 0.004
          formato: un número, la fracción de L
        distractores:
          - valor: '0.75'
            mensaje: |
              Ese es el punto medio del tramo cargado. La cortante se anula
              cuando la carga acumulada iguala a $R_A$, y como la carga crece,
              eso pasa un poco antes.
          - valor: '0.8333'
            mensaje: |
              Esa es la posición de la resultante, $5L/6$. Allí la cortante ya
              es bastante negativa: la resultante sirve para el equilibrio
              global, no para localizar la sección de cortante nula.
        pista: |
          Con $s = x - L/2$, la carga acumulada es $q_0 s^{2}/L$, y hay que
          igualarla a $R_A = q_0L/24$.
        desarrollo: |
          $$
          \frac{q_0\,s^{2}}{L} = \frac{q_0L}{24}
          \;\Longrightarrow\;
          s = \frac{L}{\sqrt{24}} = 0{,}2041\,L
          \;\Longrightarrow\;
          x = 0{,}7041\,L
          $$

      - tipo: calcular
        titulo: El flector máximo
        pregunta: |
          ¿Cuánto vale el flector máximo, en unidades de $q_0 L^{2}$?
        respuesta:
          tipo: numero
          valor: '0.0265'
          tolerancia: 0.0008
          formato: un número, el coeficiente de q0L²
        distractores:
          - valor: '0.020833'
            mensaje: |
              Ese es el flector en B, $q_0L^{2}/48$, donde empieza la carga. El
              flector sigue subiendo un poco más allá, porque la cortante todavía
              es positiva.
          - valor: '0.034722'
            mensaje: |
              Has usado la resultante de la carga para calcular el momento en
              una sección **interior** al tramo cargado. La resultante solo vale
              para el equilibrio de la viga entera; dentro de la carga hay que
              integrar solo el trozo que queda a la izquierda de la sección.
        pista: |
          $M = R_A\,x - q_0 s^{3}/(3L)$ con $s = x - L/2$, evaluado en
          $s = L/\sqrt{24}$.
        desarrollo: |
          $$
          M = \frac{q_0L}{24}\left(\frac{L}{2} + \frac{L}{\sqrt{24}}\right)
          - \frac{q_0}{3L}\left(\frac{L}{\sqrt{24}}\right)^{3}
          = 0{,}02650\,q_0L^{2}
          $$

          Un 27 % más que el valor en B, $q_0L^{2}/48 = 0{,}02083\,q_0L^{2}$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La carga total es $q_0L/4$ y su resultante está en $5L/6$, así que
              $R_A = q_0L/24$ y $R_C = 5q_0L/24$.
          - texto: >-
              En la mitad izquierda no hay carga: la cortante es constante y el
              flector, una recta que llega a $q_0L^{2}/48$ en B.
          - texto: >-
              A partir de B la cortante baja como una parábola y se anula en
              $x = 0{,}704\,L$, donde el flector alcanza $0{,}0265\,q_0L^{2}$.
          - texto: >-
              Para hallar el flector en una sección dentro del tramo cargado,
              basta con poner la resultante de toda la carga en $5L/6$.
            trampa: true
            mensaje: |
              La resultante solo es equivalente para el sólido **entero**. En
              una sección interior a la carga hay que contar únicamente el trozo
              de carga que queda a un lado, con su propio centro de gravedad;
              usar la resultante entera daría aquí $0{,}0347\,q_0L^{2}$, un 31 %
              de más.
    resolucion: |
      **Las reacciones.** La carga total es el área del triángulo,
      $q_0(L/2)/2 = q_0L/4$, con su centro de gravedad a un tercio de la base
      desde C, es decir en $x = 5L/6$. Momentos en C:

      $$
      R_A = \frac{q_0L}{4}\cdot\frac{1}{6} = \frac{q_0L}{24}
      \qquad
      R_C = \frac{5\,q_0L}{24}
      $$

      **La cortante.** En $0 < x < L/2$ no hay carga, así que es constante y
      vale $q_0L/24$. Pasado B, con $s = x - L/2$ y $q(s) = 2q_0 s/L$:

      $$
      V = \frac{q_0L}{24} - \frac{q_0\,s^{2}}{L}
      $$

      una parábola que se anula en $s = L/\sqrt{24} = 0{,}2041\,L$, o sea en
      $x = 0{,}7041\,L$, y llega a $-5q_0L/24$ en C.

      **El flector.** Recta hasta B y cúbica después:

      $$
      M\!\left(\frac{L}{2}\right) = \frac{q_0L^{2}}{48}
      \qquad
      M_{\max} = 0{,}02650\,q_0L^{2} \ \text{en}\ x = 0{,}7041\,L
      $$

