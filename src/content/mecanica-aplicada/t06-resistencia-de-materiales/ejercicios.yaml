      Calcular los diagramas de esfuerzos cortantes y momentos flectores en las
      siguientes vigas y pórticos (6.1-6.10):

      Datos: $q = 7{,}8\ T/m$, $P = 8\ T$, $L_1 = 1\ m$, $L_2 = 1{,}6\ m$,
      $M_1 = 1\ T \cdot m$, $M_2 = 2{,}76\ T \cdot m$.

