      La viga del ejercicio 6.4, redibujada. El par **M0** es horario y actúa a
      una distancia **a** del apoyo A. El dibujo está hecho con a igual a
      0,6 L.

      </figcaption>
      </figure>
    pide: Las reacciones y los diagramas de cortante y de flector en función de M0, a, b y L.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hace en los diagramas un par concentrado aplicado en un punto?
        opciones:
          - texto: >-
              Hace saltar el flector en su valor y deja la cortante sin ningún
              salto
            correcta: true
            mensaje: |
              Eso es. Un par no aporta resultante, así que la cortante no salta;
              lo que salta es el flector, y justo en el valor del par.
          - texto: Hace saltar la cortante en su valor
            mensaje: |
              Eso lo hace una **fuerza** puntual. Un par tiene resultante nula,
              así que no puede cambiar la suma de fuerzas de un lado de la
              sección.
          - texto: No cambia nada, porque un par no tiene resultante
            mensaje: |
              No cambia la resultante, pero sí el equilibrio de momentos: hace
              falta una pareja de reacciones iguales y opuestas, y con ellas
              aparece una cortante constante en toda la viga.

      - tipo: calcular
        titulo: La cortante
        pregunta: |
          ¿Cuánto vale la cortante en toda la viga, en unidades de $M_0/L$?
        respuesta:
          tipo: numero
          valor: '-1'
          tolerancia: 0.005
          formato: un número, el coeficiente de M0 partido por L
        distractores:
          - valor: '1'
            mensaje: |
              El módulo está bien y el signo no. Para equilibrar un par horario,
              la reacción de A va hacia **abajo** y la de B hacia arriba, así
              que la cortante —la suma de fuerzas hacia arriba a la izquierda—
              es negativa.
          - valor: '0'
            mensaje: |
              Si la cortante fuera nula, el flector sería constante y no podría
              valer cero en los dos apoyos con un salto en medio. Las dos
              reacciones forman un par de fuerzas, y ese par da cortante.
        pista: |
          Las reacciones valen $M_0/L$, una hacia abajo en A y otra hacia
          arriba en B.
        desarrollo: |
          $$
          R_A = -\frac{M_0}{L} \quad (\text{hacia abajo})
          \qquad
          V(x) = R_A = -\frac{M_0}{L}
          $$

          La cortante es la misma en toda la viga: no hay ninguna fuerza que la
          haga saltar.

      - tipo: calcular
        titulo: El flector justo a la derecha del par
        pregunta: |
          Con $a = 0{,}6\,L$, ¿cuánto vale el flector justo a la **derecha** del
          par, en unidades de $M_0$?
        respuesta:
          tipo: numero
          valor: '0.4'
          tolerancia: 0.005
          formato: un número, el coeficiente de M0
        distractores:
          - valor: '-0.6'
            mensaje: |
              Ese es el valor justo a la **izquierda** del par,
              $-M_0\,a/L$. Al cruzar el punto de aplicación el flector salta
              $M_0$ entero, de $-0{,}6\,M_0$ a $+0{,}4\,M_0$.
          - valor: '0.6'
            mensaje: |
              Has usado $a/L$ donde va $b/L$. A la derecha del par el flector
              vale $M_0\,b/L$, y con $a = 0{,}6\,L$ es $b = 0{,}4\,L$.
          - valor: '1'
            mensaje: |
              Ese sería el par entero. El salto sí vale $M_0$, pero se reparte
              entre los dos lados: parte del valor negativo de la izquierda y
              parte del positivo de la derecha.
        pista: |
          A la derecha del par, mirando desde B, $M = R_B\,(L-x)$ con
          $R_B = M_0/L$ y $L - a = b$.
        desarrollo: |
          $$
          M(a^{-}) = -\frac{M_0\,a}{L} = -0{,}6\,M_0
          \qquad
          M(a^{+}) = +\frac{M_0\,b}{L} = +0{,}4\,M_0
          $$

          La diferencia entre los dos es exactamente $M_0$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El equilibrio de momentos exige dos reacciones iguales y opuestas
              de valor $M_0/L$: hacia abajo en A y hacia arriba en B.
          - texto: >-
              Con eso la cortante es constante en toda la viga y vale
              $-M_0/L$, sin ningún salto.
          - texto: >-
              El flector baja linealmente hasta $-M_0\,a/L$, salta $M_0$ al
              cruzar el par y vuelve a bajar hasta cero en B.
          - texto: El flector es continuo en el punto del par, porque un diagrama no puede saltar.
            trampa: true
            mensaje: |
              Los diagramas sí saltan: la cortante salta bajo una fuerza puntual
              y el flector, bajo un par puntual. Lo que no puede saltar es el
              flector en una sección donde no hay ningún par aplicado.
    resolucion: |
      **Las reacciones.** El par no aporta resultante, así que las dos
      reacciones tienen que formar otro par que lo equilibre:

      $$
      R_A = -\frac{M_0}{L} \quad (\text{hacia abajo})
      \qquad
      R_B = +\frac{M_0}{L}
      $$

      **La cortante.** Solo hay dos fuerzas, y entre ellas la cortante es
      constante:

      $$
      V(x) = -\frac{M_0}{L}
      $$

      **El flector.** Con pendiente $dM/dx = V$ constante y negativa, el flector
      baja en línea recta en los dos tramos, y en el punto del par salta:

      $$
      M(x) = -\frac{M_0}{L}\,x \quad (x < a)
      \qquad
      M(x) = M_0\left(1 - \frac{x}{L}\right) \quad (x > a)
      $$

      $$
      M(a^{-}) = -\frac{M_0\,a}{L}
      \qquad
      M(a^{+}) = +\frac{M_0\,b}{L}
      \qquad
      M(a^{+}) - M(a^{-}) = M_0
      $$

