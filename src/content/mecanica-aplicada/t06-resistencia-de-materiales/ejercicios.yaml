    pide: El axil en B, a los dos lados de la sección donde actúa la carga de 2 kN y en la base A, con el criterio de tracción positiva.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué le hace al diagrama de axiles la carga de 2 kN que actúa hacia
          arriba en la sección intermedia?
        opciones:
          - texto: Un salto de 2 kN en esa sección, que alivia la compresión de la parte de abajo
            correcta: true
            mensaje: |
              Eso es. Una fuerza puntual en la dirección del eje hace saltar el
              axil en su valor, igual que una fuerza transversal hace saltar la
              cortante. Como va hacia arriba, sostiene parte de la carga y la
              base queda menos comprimida.
          - texto: Nada, porque es una fuerza interior de la propia columna
            mensaje: |
              No es interior: es una carga exterior aplicada en esa sección. Lo
              que sí es cierto es que no cambia nada por encima de ella, porque
              el axil de una sección solo depende de lo que hay a un lado.
          - texto: Cambia la pendiente del diagrama a partir de ahí, pero no su valor
            mensaje: |
              La pendiente del diagrama de axiles la fija la carga repartida
              $q$, que aquí es la misma arriba y abajo. Una carga puntual no
              cambia la pendiente: produce un escalón.

      - tipo: calcular
        titulo: El axil justo por encima de la carga de 2 kN
        pregunta: |
          ¿Cuánto vale el axil en la sección situada 2 m por debajo de B, justo
          por encima de donde actúa la carga de 2 kN? Con tracción positiva, en
          kN.
        respuesta:
          tipo: numero
          valor: '-8'
          tolerancia: 0.05
          formato: un número con su signo, en kN
        distractores:
          - valor: '-5'
            mensaje: |
              Te has quedado con la carga de cabeza y has olvidado la repartida.
              En esos 2 m hay además $1{,}5 \cdot 2 = 3$ kN que también
              comprimen.
          - valor: '-6'
            mensaje: |
              Has restado ya la carga de 2 kN, que está por debajo de esta
              sección. El axil de una sección solo cuenta lo que hay a un lado:
              por encima solo están los 5 kN y los 3 kN de la repartida.
          - valor: '8'
            mensaje: |
              El valor absoluto está bien, pero el signo no: la columna está
              comprimida, y con el criterio de tracción positiva eso es
              negativo.
        pista: |
          Corta ahí y quédate con la parte de arriba: los 5 kN de cabeza más
          los 2 m de carga repartida.
        desarrollo: |
          $$
          N = -\left(5 + 1{,}5 \cdot 2\right) = -8\ \text{kN}
          $$

      - tipo: calcular
        titulo: El axil en la base
        pregunta: |
          ¿Y en la base $A$, con el mismo criterio, en kN?
        respuesta:
          tipo: numero
          valor: '-10.5'
          tolerancia: 0.05
          formato: un número con su signo, en kN
        distractores:
          - valor: '-12.5'
            mensaje: |
              Has sumado los 5 kN y los $1{,}5 \cdot 5 = 7{,}5$ kN de la
              repartida, pero te has dejado la carga de 2 kN hacia arriba, que
              descarga la base.
          - valor: '-5.5'
            mensaje: |
              Parece que has contado la repartida solo en los 3 m de abajo y
              además has restado los 2 kN. La repartida actúa en los 5 m
              enteros.
        pista: |
          Todo lo que hay por encima de la base: $5 + 1{,}5 \cdot 5$ hacia
          abajo y 2 kN hacia arriba.
        desarrollo: |
          $$
          N_A = -\left(5 + 1{,}5 \cdot 5 - 2\right) = -10{,}5\ \text{kN}
          $$

          Y es la reacción del suelo, 10,5 kN hacia arriba.

      - tipo: justificar
        pregunta: Ordena cómo queda el diagrama. Una pieza es falsa.
        piezas:
          - texto: 'En el tramo de arriba el axil baja en línea recta de −5 kN en B a −8 kN a los 2 m, porque la repartida es uniforme.'
          - texto: 'En esa sección el diagrama salta 2 kN hacia arriba, de −8 a −6 kN.'
          - texto: 'En los 3 m de abajo vuelve a bajar en línea recta hasta −10,5 kN en A, que es la reacción del suelo.'
          - texto: 'La carga repartida no cambia el axil: el diagrama es constante a trozos y solo salta con las cargas puntuales.'
            trampa: true
            mensaje: |
              Eso valdría si la única carga fuera la de cabeza. Con una carga
              repartida en la dirección del eje, $dN/dx = -q_x$: el axil crece
              en línea recta, y por eso el diagrama son dos rampas y no dos
              escalones.
    resolucion: |
      **De arriba abajo, que es como se lee una columna.** El axil de una
      sección es la suma de las fuerzas axiales que hay a un lado, con tracción
      positiva. Aquí conviene mirar hacia arriba, que es el lado sin reacción.

      **Los 2 m de arriba.** Solo están los 5 kN de cabeza y la parte de carga
      repartida acumulada:

      $$
      N(y) = -\left(5 + 1{,}5\,y\right) \qquad 0 \le y \le 2
      $$

      que vale $-5$ kN en $B$ y $-8$ kN al llegar a la sección intermedia.

      **El salto.** Ahí actúan 2 kN hacia arriba, así que el diagrama sube de
      golpe de $-8$ a $-6$ kN.

      **Los 3 m de abajo.** Sigue la misma pendiente:

      $$
      N(y) = -\left(5 + 1{,}5\,y - 2\right) \qquad 2 \le y \le 5
      $$

      y en la base $N_A = -10{,}5$ kN.

      **La comprobación que no cuesta nada.** La resultante de todo lo aplicado
      es $5 + 7{,}5 - 2 = 10{,}5$ kN hacia abajo, y el suelo tiene que
      devolverla entera. Coincide con el valor del diagrama en $A$.

      <figure>
      <svg viewBox="0 0 330 300" role="img" width="330" height="300" aria-labelledby="ma6c612r-t ma6c612r-d">
        <title id="ma6c612r-t">Diagrama de esfuerzos axiales de la columna, dibujado a escala junto a ella</title>
        <desc id="ma6c612r-d">A la izquierda, la columna vertical de 5 metros. A la derecha, el diagrama de axiles, todo del lado de la compresión: vale menos 5 kilonewtons en B, baja en línea recta hasta menos 8 kilonewtons a los 2 metros, salta a menos 6 kilonewtons en la sección donde actúa la carga de 2 kilonewtons hacia arriba, y desde ahí vuelve a bajar en línea recta hasta menos 10,5 kilonewtons en la base A.</desc>
        <rect x="60" y="40" width="34" height="200" fill="var(--faint)" fill-opacity="0.25" stroke="var(--ink)" stroke-width="1.2"/>
        <line x1="55" y1="240" x2="99" y2="240" stroke="var(--ink)" stroke-width="1.4"/>
        <path d="M59 240 L53 248 M73 240 L67 248 M87 240 L81 248" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <text x="100" y="48" font-size="11" fill="var(--ink)">B</text>
        <text x="100" y="238" font-size="11" fill="var(--ink)">A</text>
        <line x1="170" y1="30" x2="170" y2="255" stroke="var(--ink)" stroke-width="0.9"/>
        <path d="M170 40 L200 40 L218 120 L206 120 L233 240 L170 240 Z" fill="var(--d2)" fill-opacity="0.15" stroke="none"/>
        <path d="M170 40 L200 40 L218 120 L206 120 L233 240 L170 240" fill="none" stroke="var(--d2)" stroke-width="2"/>
        <text x="205" y="36" font-size="9.5" fill="var(--d2)">−5</text>
        <text x="223" y="116" font-size="9.5" fill="var(--d2)">−8</text>
        <text x="211" y="134" font-size="9.5" fill="var(--d2)">−6</text>
        <text x="238" y="243" font-size="9.5" fill="var(--d2)">−10,5</text>
        <text x="170" y="24" font-size="10" text-anchor="middle" fill="var(--ink)">N (kN)</text>
        <text x="170" y="270" font-size="9.5" text-anchor="middle" fill="var(--faint)">todo comprimido</text>
        <line x1="94" y1="120" x2="170" y2="120" stroke="var(--flag)" stroke-width="0.8" stroke-dasharray="4 3"/>
