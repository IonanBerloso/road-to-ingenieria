  - id: ejma6-col620-la-viga-con-rotula-y-carga-triangular
    titulo: La viga con rótula intermedia y carga triangular
    fuente: >-
      Ejercicio 6.20 · Tema 6, «Principios de resistencia de materiales» ·
      Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección lo marca como de
      nivel de examen y no publica resultado: imprime «Resultado: [-]». Su
      figura tampoco incluye la sección transversal, así que los apartados c y d
      no se pueden resolver con lo publicado; aquí se resuelven a y b, y el
      desarrollo es nuestro.
    nivel: practica
    enunciado: |
      La viga $AF$ de $8\ m$ de longitud está empotrada en $A$, articulada en
      $C$ y tiene un apoyo móvil en $F$. Soporta una carga distribuida
      triangular con $q_{max} = 2\ kN/m$, una carga puntual $P = 4\ kN$ en D y
      una carga axial $Q = 3\ kN$, como aparece en la figura. Calcular:

      a. Reacciones en los puntos $A$ y $F$.

      b. Diagramas de esfuerzo cortante ($V$) y momento flector ($M$).

      c. Posición del centro de gravedad de la sección y momento de inercia
      respecto del eje horizontal que pasa por el centro de gravedad.

      d. Tensión normal máxima.

