    pide: Los diagramas de cortante y flector en función de q sub cero y a, y el valor de q sub cero.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué le hace al diagrama el momento aplicado en $E$?
        opciones:
          - texto: Hace saltar el flector en su valor, y no toca la cortante
            correcta: true
            mensaje: |
              Eso es. Un par concentrado no aporta fuerza, así que $V$ no se
              entera; pero sí aporta momento, y el diagrama de flectores da un
              escalón de $q_0 a^{2}$ al pasar por E.
          - texto: Hace saltar la cortante, igual que una fuerza puntual
            mensaje: |
              Quien hace saltar la cortante es una **fuerza** puntual. Un par no
              tiene resultante: el equilibrio de fuerzas ni se entera de que
              está ahí.
          - texto: No cambia ningún diagrama, solo la reacción del empotramiento
            mensaje: |
              Cambia la reacción, sí, pero también el diagrama de flectores en
              todo el tramo: entre el empotramiento y E el momento vale
              $q_0a^{2}$ más que si el par no estuviera.

      - tipo: calcular
        titulo: El flector en el empotramiento
        pregunta: |
          ¿Cuánto vale el momento flector en el empotramiento $A$, en unidades
          de $q_0 a^{2}$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.02
          formato: un número, el coeficiente de q0 a al cuadrado
        distractores:
          - valor: '1'
            mensaje: |
              Te has dejado el par de E. Sin él saldría 1; el par aporta otro
              $q_0a^{2}$ a todas las secciones que están a su izquierda.
          - valor: '3.5'
            mensaje: |
              Ese es el flector **máximo**, que está en el centro del tramo
              cargado, no en el empotramiento. El diagrama sube desde A antes de
              llegar a su máximo.
        pista: |
          Integra desde el extremo libre, donde $M = 0$, y ve hacia el
          empotramiento sin olvidar el escalón del par.
        desarrollo: |
          Con $V = q_0a$ a la derecha de $E$ y $M_B = 0$, el flector justo a la
          derecha de E vale $q_0a^{2}$; el par lo sube a $2q_0a^{2}$ a su
          izquierda; y de ahí hasta A el balance de las áreas de cortante da

          $$
          M_A = 2\,q_0 a^{2}
          $$

      - tipo: calcular
        titulo: El flector máximo
        pregunta: |
          ¿Y el mayor momento flector de toda la viga, en unidades de
          $q_0 a^{2}$?
        respuesta:
          tipo: numero
          valor: '3.5'
          tolerancia: 0.02
          formato: un número, el coeficiente de q0 a al cuadrado
        distractores:
          - valor: '2'
            mensaje: |
              Ese es el valor en el empotramiento. En una ménsula el máximo
              suele estar ahí, pero aquí no: la cortante se anula dentro del
              tramo cargado y el flector sigue subiendo hasta ese punto.
          - valor: '3'
            mensaje: |
              Ese es el valor en C y en D, los dos extremos del tramo cargado.
              Entre ellos el flector describe una parábola que todavía sube
              medio $q_0a^{2}$ más.
        pista: |
          El máximo está donde $V = 0$. La cortante vale $q_0a$ en C y baja con
          pendiente $-q_0$: se anula a un metro de C, en el centro del tramo
          cargado.
        desarrollo: |
          $$
          V(x) = q_0a - q_0\,(x - a) = 0 \;\Longrightarrow\; x = 2a
          $$

          $$
          M(2a) = M(a) + q_0a\cdot a - \frac{q_0 a^{2}}{2}
          = 3q_0a^{2} + 0{,}5\,q_0a^{2} = 3{,}5\,q_0a^{2}
          $$

      - tipo: calcular
        titulo: La carga
        pregunta: |
          Con $a = 1$ m y $\sigma_{\max} = 1200\ \text{kg}/\text{cm}^{2}$,
          ¿cuánto vale $q_0$?
        respuesta:
          tipo: numero
          valor: '1349.5'
          tolerancia: 8
          formato: un número, en kg/m
        distractores:
          - valor: '2361.6'
            mensaje: |
              Has dimensionado con el flector del empotramiento, $2q_0a^{2}$, en
              vez de con el máximo, $3{,}5\,q_0a^{2}$. La sección que manda es la
              peor de la viga.
          - valor: '674.7'
            mensaje: |
              Has usado el canto entero, 20 cm, donde la fórmula pide la
              distancia del eje neutro a la fibra más alejada, que es la mitad,
              10 cm.
        pista: |
          $W = I/(h/2)$ con $I = 3936\ \text{cm}^{4}$, y después
          $M_{\text{adm}} = \sigma\,W$ igualado a $3{,}5\,q_0a^{2}$.
        desarrollo: |
          $$
          I = \frac{10 \cdot 20^{3}}{12} - \frac{8 \cdot 16^{3}}{12} = 3936\ \text{cm}^{4}
          \qquad
          W = \frac{3936}{10} = 393{,}6\ \text{cm}^{3}
          $$

          $$
          M_{\text{adm}} = 1200 \cdot 393{,}6 = 472\,320\ \text{kg}\cdot\text{cm}
          = 4723{,}2\ \text{kg}\cdot\text{m}
          $$

          $$
          q_0 = \frac{4723{,}2}{3{,}5 \cdot 1^{2}} = 1349{,}5\ \text{kg/m}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'El equilibrio vertical da la reacción del empotramiento: q0·a hacia arriba, porque la repartida vale 2q0a y en B suben q0a.'
          - texto: 'La cortante vale q0a hasta C, baja hasta −q0a en D y se queda ahí hasta B, donde la fuerza del extremo la devuelve a cero.'
          - texto: 'El flector sube de 2q0a² en A hasta 3,5q0a² en el centro del tramo cargado, que es donde V se anula, y baja después con el escalón del par en E.'
          - texto: 'El flector máximo está en el empotramiento, como en toda ménsula, y vale 2q0a².'
            trampa: true
            mensaje: |
              En una ménsula con toda la carga hacia abajo sí, pero aquí hay una
              fuerza hacia arriba en el extremo y un par. La cortante cambia de
              signo **dentro** del vano, y donde $V = 0$ está el máximo:
              $3{,}5\,q_0a^{2}$, un 75 % más que en el empotramiento.
    resolucion: |
      **La reacción.** El equilibrio vertical de toda la viga da
      $R_A = 2q_0a - q_0a = q_0a$ hacia arriba.

      **La cortante.** Con el convenio del curso, $V$ es la suma de las fuerzas
      hacia arriba a la izquierda:

      $$
      V = q_0 a \quad (0 \le x \le a)
      \qquad
      V = q_0a - q_0(x-a) \quad (a \le x \le 3a)
      \qquad
      V = -q_0 a \quad (3a \le x \le 5a)
      $$

      y se anula en $x = 2a$, el centro del tramo cargado.

      **El flector.** Integrando $dM/dx = V$ desde el extremo libre y contando
      el escalón del par en E:

      | sección | M |
      |---|---|
      | A | 2 q0a² |
      | C | 3 q0a² |
      | x = 2a | 3,5 q0a² |
      | D | 3 q0a² |
      | E por la izquierda | 2 q0a² |
      | E por la derecha | 1 q0a² |
      | B | 0 |

      El máximo es $3{,}5\,q_0a^{2}$ en $x = 2a$, justo donde la cortante cruza
      el cero, y el diagrama es positivo en toda la viga: tracciona siempre la
      fibra inferior.

      **La sección y la carga.** La doble T da

      $$
      I = \frac{10 \cdot 20^{3}}{12} - \frac{8 \cdot 16^{3}}{12} = 3936\ \text{cm}^{4}
      \qquad
      W = 393{,}6\ \text{cm}^{3}
      $$

      y con la admisible:

      $$
      3{,}5\,q_0 a^{2} = \sigma_{\max} W = 4723{,}2\ \text{kg}\cdot\text{m}
      \;\Longrightarrow\;
      q_0 = 1349{,}5\ \text{kg/m}
      $$

      que es el resultado publicado.

      <figure>
      <svg viewBox="0 0 420 320" role="img" width="420" height="320" aria-labelledby="ma6c617r-t ma6c617r-d">
        <title id="ma6c617r-t">Diagramas de cortante y de momento flector de la ménsula, a escala y alineados bajo la viga</title>
        <desc id="ma6c617r-d">Arriba, la cortante: vale más q sub cero por a desde el empotramiento hasta C, baja en línea recta hasta menos q sub cero por a en D cruzando el cero en el centro del tramo cargado, y se mantiene en menos q sub cero por a hasta B. Abajo, el flector, positivo en toda la viga: dos q sub cero a al cuadrado en el empotramiento, tres en C, un máximo de tres y medio en el centro del tramo cargado, tres en D, dos justo antes de E, un escalón que lo baja a uno justo después, y cero en el extremo B.</desc>
        <rect x="60" y="30" width="300" height="8" fill="var(--faint)" fill-opacity="0.3" stroke="var(--ink)" stroke-width="1"/>
