    pide: Qué fuerza mete la barra inclinada en la viga y cuánto valen los diagramas con la figura tal como se publica.
    pasos:
      - tipo: reconocer
        pregunta: |
          La barra que llega a $C$ está articulada en sus dos extremos y no
          lleva ninguna carga entre ellos. ¿Qué fuerza le hace entonces a la
          viga en $C$?
        opciones:
          - texto: Una fuerza en la dirección de la propia barra, a 30° con la viga, con componente axial y componente transversal
            correcta: true
            mensaje: |
              Eso es. Una barra de dos fuerzas solo puede trabajar a lo largo de
              sí misma, así que su dirección se conoce y su módulo es la única
              incógnita. Al estar inclinada, mete a la vez axil y cortante en la
              viga.
          - texto: Una fuerza vertical, porque lo que hace es sostener la viga
            mensaje: |
              La barra sostiene, pero no puede elegir la dirección: tira o
              empuja a lo largo de sí misma. Suponerla vertical se come la
              componente horizontal, que es la que produce el axil de la viga.
          - texto: Una fuerza perpendicular a la viga, como haría un apoyo móvil
            mensaje: |
              Un apoyo móvil sí daría una reacción perpendicular, pero esto no
              es un apoyo: es una barra biarticulada inclinada 30°, y su fuerza
              va en su dirección.

      - tipo: calcular
        titulo: La componente que flexiona
        pregunta: |
          Si la barra transmite una fuerza de módulo $F$, ¿qué fracción de $F$
          es la componente perpendicular a la viga, la que produce cortante y
          flector?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.005
          formato: un número, la fracción de F
        distractores:
          - valor: '0.866'
            mensaje: |
              Ese es el coseno de 30°, que da la componente **a lo largo** de la
              viga, o sea el axil. La perpendicular sale con el seno del ángulo
              que la barra forma con la viga.
          - valor: '0.5774'
            mensaje: |
              Esa es la tangente de 30°. Las componentes de una fuerza salen con
              el seno y el coseno; la tangente es el cociente entre las dos, no
              una componente.
        pista: |
          El ángulo está medido entre la barra y la viga, así que la componente
          perpendicular es $F\,\operatorname{sen}30^{\circ}$.
        desarrollo: |
          $$
          F_{\perp} = F\,\operatorname{sen}30^{\circ} = 0{,}5\,F
          $$

      - tipo: calcular
        titulo: La componente que estira
        pregunta: |
          ¿Y qué fracción de $F$ va en la dirección de la viga, la que produce
          el axil?
        respuesta:
          tipo: numero
          valor: '0.866'
          tolerancia: 0.005
          formato: un número, la fracción de F
        distractores:
          - valor: '0.5'
            mensaje: |
              Has cambiado el seno por el coseno. Con 30° medidos desde la viga,
              la componente a lo largo de ella es la grande, $\cos 30^{\circ}$,
              y la perpendicular es la mitad de F.
          - valor: '1'
            mensaje: |
              Eso sería tomar la fuerza entera como axil, que solo pasaría si la
              barra fuera paralela a la viga. Al estar a 30°, una parte se va en
              la dirección perpendicular.
        pista: |
          La otra componente, con el coseno de 30°.
        desarrollo: |
          $$
          F_{\parallel} = F\cos 30^{\circ} = 0{,}866\,F
          $$

          Con lo que la barra, si trabajase, metería en la viga las dos cosas a
          la vez: axil en el tramo $AC$ y flexión con vértice en $C$.

      - tipo: justificar
        pregunta: Ordena el razonamiento sobre la figura publicada. Una pieza es falsa.
        piezas:
          - texto: 'La barra es de dos fuerzas: su fuerza va en su dirección, a 30° de la viga, y su módulo F es la única incógnita que aporta.'
          - texto: 'Tomando momentos en A sobre la viga, lo único que da momento es la componente perpendicular en C, así que F·sen30°·a = 0.'
          - texto: 'De ahí F = 0, y sin ninguna otra carga los tres diagramas —axil, cortante y flector— son idénticamente nulos.'
          - texto: 'Aunque no haya cargas dibujadas, la barra tira de la viga y el flector es máximo en C, con forma de triángulo.'
            trampa: true
            mensaje: |
              Esa es la forma que tendría el diagrama **si** hubiera una carga
              exterior, y es lo que uno espera al ver la figura. Pero una barra
              biarticulada no tira porque sí: si nada más carga la viga, el
              equilibrio de momentos en $A$ obliga a que $F$ valga cero.
    resolucion: |
      **Lo primero, qué clase de pieza es la barra.** Está articulada en sus dos
      extremos y no lleva carga entre ellos, así que es una **barra de dos
      fuerzas**: su fuerza va en su propia dirección. Al formar 30° con la viga,
      si su módulo fuera $F$ le metería a la viga en $C$

      $$
      F_{\parallel} = F\cos 30^{\circ} = 0{,}866\,F
      \qquad
      F_{\perp} = F\,\operatorname{sen}30^{\circ} = 0{,}5\,F
      $$

      es decir, axil por un lado y cortante y flector por otro.

      **Y ahora el equilibrio, que es lo que decide.** Sobre la viga $AB$ solo
      actúan dos cosas: la articulación en $A$ y la barra en $C$. Tomando
      momentos respecto de $A$, la reacción de $A$ no da momento y solo queda la
      componente perpendicular de la barra:

      $$
      F\,\operatorname{sen}30^{\circ} \cdot a = 0
      \;\Longrightarrow\;
      F = 0
      $$

      **Conclusión.** Con la figura tal como la publica la colección, la barra
      no trabaja y los tres diagramas de $AB$ son nulos en toda su longitud:
      $N = 0$, $V = 0$ y $M = 0$. No hay nada que dibujar, y eso es el
      resultado.

      **Qué falta, dicho con todas las letras.** Un enunciado que pide dibujar
      diagramas y una figura cuyo resultado es «todo cero» no encajan: lo más
      probable es que a la figura publicada le falte la carga. El camino, en
      cuanto aparezca una, es siempre el mismo y ya está medio hecho aquí: los
      momentos en $A$ dan $F$, y con $F$ conocida el tramo $AC$ queda con axil
      $0{,}866\,F$ y el flector crece hasta $C$ y baja hasta $B$. Lo que no se
      puede es inventarse esa carga y publicar unos diagramas que el enunciado
      no sostiene.

  - id: ejma6-col614-dimensionar-el-canto-de-la-viga
