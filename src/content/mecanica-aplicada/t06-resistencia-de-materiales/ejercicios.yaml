      </figcaption>
      </figure>
    pide: Las reacciones y los diagramas de cortante y de flector, con sus valores clave.
    pasos:
      - tipo: reconocer
        pregunta: |
          Los dos pares están aplicados justo en los apoyos. ¿Entran en el
          cálculo de las reacciones?
        opciones:
          - texto: >-
              Sí: entran en la ecuación de momentos y cambian las reacciones, y
              además hacen que el flector no empiece valiendo cero
            correcta: true
            mensaje: |
              Eso es, y son las dos consecuencias. Sin los pares las reacciones
              serían 64 y 32 kN; con ellos, 66,78 y 29,22. Y el flector arranca
              en $-25$ kN·m en vez de en cero.
          - texto: No, porque un par no aporta fuerza y las reacciones son fuerzas
            mensaje: |
              No aporta fuerza, pero sí momento, y las reacciones salen de una
              ecuación de **momentos**. Un par aplicado cambia el reparto entre
              los dos apoyos aunque la carga vertical sea la misma.
          - texto: Solo el de A, porque es donde se toman los momentos
            mensaje: |
              Un par tiene el mismo momento respecto de cualquier punto, así que
              los dos entran en la ecuación se tome donde se tome. Precisamente
              por eso da igual dónde esté aplicado un par.

      - tipo: calcular
        titulo: La reacción del apoyo A
        pregunta: |
          ¿Cuánto vale la reacción en A, en kN?
        respuesta:
          tipo: numero
          valor: '66.78'
          tolerancia: 0.05
          formato: un número, en kN
        distractores:
          - valor: '48'
            mensaje: |
              Has repartido a medias los 96 kN de la carga e ignorado los pares.
              La carga no está centrada —cubre solo los primeros 2,4 m— y además
              los pares cambian el reparto.
          - valor: '61.22'
            mensaje: |
              Has metido los dos pares con el signo cambiado. El de A es
              antihorario y el de B horario: en la ecuación de momentos van con
              signos opuestos entre sí, $+25 - 15$.
        pista: |
          Momentos en A, con el giro antihorario positivo:
          $25 - 15 - 96 \cdot 1{,}2 + R_B \cdot 3{,}6 = 0$.
        desarrollo: |
          $$
          R_B = \frac{96 \cdot 1{,}2 + 15 - 25}{3{,}6} = \frac{105{,}2}{3{,}6}
          = 29{,}22\ \text{kN}
          $$

          $$
          R_A = 96 - 29{,}22 = 66{,}78\ \text{kN}
          $$

      - tipo: calcular
        titulo: El flector máximo
        pregunta: |
          ¿Cuánto vale el momento flector máximo, en kN·m?
        respuesta:
          tipo: numero
          valor: '30.74'
          tolerancia: 0.08
          formato: un número, en kN·m
        distractores:
          - valor: '55.74'
            mensaje: |
              Te has olvidado del par de 25 kN·m de A. El flector no arranca en
              cero sino en $-25$, así que hay que restarlo:
              $55{,}74 - 25 = 30{,}74$.
          - valor: '20.07'
            mensaje: |
              Ese es el flector donde **acaba** la carga repartida, en $x = 2,4$
              m. El máximo está antes, donde la cortante se anula, en
              $x = 1,67$ m.
        pista: |
          La cortante se anula en $x = 66{,}78/40 = 1{,}669$ m; allí
          $M = -25 + 66{,}78\,x - 20\,x^{2}$.
        desarrollo: |
          $$
          x_0 = \frac{66{,}78}{40} = 1{,}6694\ \text{m}
          $$

          $$
          M(x_0) = -25 + 66{,}78 \cdot 1{,}6694 - 20 \cdot 1{,}6694^{2}
          = -25 + 55{,}74 = 30{,}74\ \text{kN}\cdot\text{m}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Con los dos pares en la ecuación de momentos salen
              $R_A = 66{,}78$ kN y $R_B = 29{,}22$ kN.
          - texto: >-
              La cortante baja en línea recta desde $+66{,}78$ hasta
              $-29{,}22$ kN al acabar la carga, y sigue constante hasta B.
          - texto: >-
              El flector empieza en $-25$ kN·m por el par de A, sube hasta
              $+30{,}74$ donde la cortante se anula y acaba en $-15$ en B.
          - texto: En el apoyo A el flector vale cero, porque una articulación no transmite momento.
            trampa: true
            mensaje: |
              El **apoyo** no transmite momento, pero aquí hay además un par
              aplicado de 25 kN·m justo en esa sección, y el flector tiene que
              equilibrarlo: $M(0^{+}) = -25$ kN·m.
    resolucion: |
      **Las reacciones.** La carga repartida son $40 \cdot 2{,}4 = 96$ kN con su
      resultante a 1,2 m de A. Tomando momentos en A, con el giro antihorario
      positivo y los dos pares dentro:

      $$
      25 - 15 - 96 \cdot 1{,}2 + R_B \cdot 3{,}6 = 0
      \;\Longrightarrow\;
      R_B = 29{,}22\ \text{kN}
      \qquad
      R_A = 66{,}78\ \text{kN}
      $$

      **La cortante.** No hay ninguna fuerza puntual en el vano, así que solo
      baja con la carga repartida:

      $$
      V(x) = 66{,}78 - 40\,x \quad (x < 2{,}4)
      \qquad
      V = -29{,}22 \quad (x > 2{,}4)
      $$

      y se anula en $x_0 = 1{,}669$ m.

      **El flector.** El par de A hace que arranque en $-25$ kN·m:

      $$
      M(x) = -25 + 66{,}78\,x - 20\,x^{2}
      \qquad
      M(x_0) = +30{,}74\ \text{kN}\cdot\text{m}
      $$

      $$
      M(2{,}4) = +20{,}07\ \text{kN}\cdot\text{m}
      \qquad
      M(3{,}6^{-}) = -15\ \text{kN}\cdot\text{m}
      $$

