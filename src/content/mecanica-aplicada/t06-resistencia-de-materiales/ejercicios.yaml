  - id: ejma6-col610-la-carga-hacia-arriba-en-una-viga-empotrada
    titulo: Una viga empotrada con la carga hacia arriba y dos pares
    fuente: >-
      Ejercicio 6.10 · Tema 6, «Principios de resistencia de materiales» ·
      Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección solo pide los
      diagramas y no publica resultado, así que el desarrollo es nuestro,
      contrastado integrando la carga por un segundo camino.
    nivel: practica
