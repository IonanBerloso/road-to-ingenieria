        <desc id="ma6c618r-d">Arriba, la cortante: empieza en menos 11,2 kilonewtons en A, baja hasta menos 12 justo antes del apoyo C, salta a más 6,6 al pasarlo y baja hasta más 5 en el extremo B, donde la carga puntual la devuelve a cero. Abajo, el flector, negativo en toda la viga: cero en A, menos 4,64 kilonewton metro en el apoyo C, que es el máximo, y cero otra vez en el extremo libre B.</desc>
