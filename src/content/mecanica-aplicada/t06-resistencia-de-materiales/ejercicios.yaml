      La viga del ejercicio 6.2, redibujada a escala. Las cargas son de 10 Tn y
      6 Tn, y los tres tramos miden 3, 4 y 5 metros.

      </figcaption>
      </figure>
    pide: Las reacciones y los diagramas de cortante y de flector, con sus valores.
    pasos:
      - tipo: reconocer
        pregunta: |
          Entre las dos cargas, ¿qué le pasa a la cortante y al flector?
        opciones:
          - texto: >-
              La cortante se anula en todo ese tramo y el flector es constante,
              igual a su valor máximo
            correcta: true
            mensaje: |
              Eso es, y es la particularidad de esta viga: $10 - 10 = 0$. Como
              $dM/dx = V = 0$, el flector no sube ni baja: es una meseta, y
              todas las secciones del tramo están igual de solicitadas.
          - texto: La cortante cruza el cero en un punto y ahí el flector tiene un pico
            mensaje: |
              Eso pasaría si la cortante pasara de positiva a negativa en un
              punto. Aquí **vale cero en todo el tramo**, así que en vez de un
              pico hay una meseta.
          - texto: El flector sigue creciendo hasta el centro de la viga
            mensaje: |
              La pendiente del flector es la cortante, y ahí la cortante es
              nula. El flector se queda quieto en 30 Tn·m hasta la segunda
              carga.

      - tipo: calcular
        titulo: La reacción del apoyo A
        pregunta: |
          ¿Cuánto vale la reacción en A, en Tn?
        respuesta:
          tipo: numero
          valor: '10'
          tolerancia: 0.05
          formato: un número, en Tn
        distractores:
          - valor: '8'
            mensaje: |
              Has repartido las 16 Tn a medias. Las cargas no están colocadas
              simétricamente: la de 10 Tn está más cerca de A, así que A carga
              más.
          - valor: '6'
            mensaje: |
              Esa es la reacción de B. Al tomar momentos en A se despeja $R_B$;
              $R_A$ sale de momentos en B o de la suma de fuerzas.
        pista: |
          Momentos en B: $R_A \cdot 12 = 10 \cdot 9 + 6 \cdot 5$.
        desarrollo: |
          $$
          R_A = \frac{10 \cdot 9 + 6 \cdot 5}{12} = \frac{120}{12} = 10\ \text{Tn}
          \qquad
          R_B = 16 - 10 = 6\ \text{Tn}
          $$

      - tipo: calcular
        titulo: El flector máximo
        pregunta: |
          ¿Cuánto vale el momento flector máximo, en Tn·m?
        respuesta:
          tipo: numero
          valor: '30'
          tolerancia: 0.05
          formato: un número, en Tn·m
        distractores:
          - valor: '24'
            mensaje: |
              Sale de repartir las cargas a medias, $R_A = 8$, y multiplicar por
              los 3 m. La reacción buena es 10 Tn.
          - valor: '72'
            mensaje: |
              Eso es $10 \cdot 3 + 6 \cdot 7$, el momento de las dos cargas
              respecto de A: es la cuenta de las reacciones sin dividir entre la
              luz, no un flector.
        pista: |
          Bajo la primera carga, $M = R_A \cdot 3$; y como después la cortante
          es nula, el flector se mantiene.
        desarrollo: |
          $$
          M(3) = 10 \cdot 3 = 30\ \text{Tn}\cdot\text{m}
          $$

          $$
          M(7) = 10 \cdot 7 - 10 \cdot 4 = 30\ \text{Tn}\cdot\text{m}
          $$

          El mismo valor: entre las dos cargas el flector es constante.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Momentos en B dan $R_A = 10$ Tn, y la suma de fuerzas,
              $R_B = 6$ Tn.
          - texto: >-
              La cortante vale $+10$ Tn hasta la primera carga, $0$ entre las
              dos y $-6$ Tn desde la segunda hasta B.
          - texto: >-
              El flector sube linealmente hasta 30 Tn·m, se mantiene en ese
              valor entre las dos cargas y baja hasta cero en B.
          - texto: Como hay dos cargas puntuales, el flector tiene dos picos, uno bajo cada carga.
            trampa: true
            mensaje: |
              Tendría dos picos si la cortante cambiara de signo dos veces. Aquí
              cambia de signo una sola vez, y encima anulándose en todo un
              tramo: por eso el máximo no es un punto, es un segmento entero.
    resolucion: |
      **Las reacciones.** Con momentos en B y la suma de fuerzas:

      $$
      R_A = \frac{10 \cdot 9 + 6 \cdot 5}{12} = 10\ \text{Tn}
      \qquad
      R_B = 6\ \text{Tn}
      $$

      **La cortante.** Sumando las fuerzas hacia arriba que quedan a la
      izquierda de cada sección:

      $$
      V = +10 \quad (0 < x < 3)
      \qquad
      V = 0 \quad (3 < x < 7)
      \qquad
      V = -6 \quad (7 < x < 12)
      $$

      **El flector.** La pendiente es la cortante, así que sube con pendiente 10
      hasta la primera carga, se queda plano y baja con pendiente $-6$:

      $$
      M(3) = 30 \qquad M(7) = 30 \qquad M(12) = 0\ \text{Tn}\cdot\text{m}
      $$

