    pide: La tensión del hilo, las fuerzas en las barras, las reacciones en G, los diagramas de FG y la tensión normal máxima.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál es la forma más corta de sacar la tensión del hilo $OO'$?
        opciones:
          - texto: Momentos respecto de F sobre toda la celosía, porque ahí desaparecen las dos componentes del pasador
            correcta: true
            mensaje: |
              Eso es. La celosía tiene tres incógnitas exteriores —el hilo y las
              dos del pasador F—, y tomando momentos en F quedan fuera las dos
              del pasador. Una ecuación, una incógnita.
          - texto: Aislando el nudo O, donde concurren el hilo y dos barras
            mensaje: |
              En el nudo O hay tres incógnitas —el hilo y las dos barras OB y
              OA— y solo dos ecuaciones. Hace falta conocer antes el hilo, no al
              revés.
          - texto: Sumando las cargas verticales, porque el hilo sostiene las cuatro
            mensaje: |
              El hilo no está solo: el pasador F también tiene componente
              vertical y se lleva la mayor parte. El equilibrio vertical tiene
              dos incógnitas y no basta.

      - tipo: calcular
        titulo: La tensión del hilo
        pregunta: |
          ¿Cuánto vale la tensión del hilo $OO'$, en unidades de $P$?
        respuesta:
          tipo: numero
          valor: '0.756'
          tolerancia: 0.005
          formato: un número, el coeficiente que multiplica a P
        distractores:
          - valor: '1.3333'
            mensaje: |
              Te has dejado la fuerza horizontal de 2P. Está aplicada en A, que
              no está a la altura de F, así que sí da momento respecto de F: su
              brazo es la altura de la celosía.
          - valor: '4'
            mensaje: |
              Esa es la carga vertical total. El hilo solo se lleva una parte
              pequeña; el resto va al pasador F, que está mucho más cerca de las
              cargas.
        pista: |
          Momentos en F, con la altura de la celosía igual a
          $L\sqrt{3}/2$: la horizontal de 2P también aporta.
        desarrollo: |
          $$
          3L\,T = \frac{5}{2}PL + \frac{3}{2}PL - \sqrt{3}\,PL
          \;\Longrightarrow\;
          T = \frac{4 - \sqrt{3}}{3}\,P = 0{,}756\,P
          $$

      - tipo: calcular
        titulo: La barra del cordón superior
        pregunta: |
          ¿Cuánto vale la fuerza interna de la barra $OB$, en unidades de $P$,
          con su signo?
        respuesta:
          tipo: numero
          valor: '-0.4365'
          tolerancia: 0.005
          formato: un número con su signo, el coeficiente de P
        distractores:
          - valor: '0.4365'
            mensaje: |
              El valor absoluto está bien, pero OB trabaja a **compresión**: el
              hilo tira de O hacia arriba, la diagonal OA responde a tracción y
              su componente horizontal empuja a OB contra el nudo.
          - valor: '0.756'
            mensaje: |
              Ese es el valor del hilo, no el de la barra. En el nudo O, la
              vertical del hilo se equilibra con la diagonal OA, y OB sale de la
              ecuación horizontal.
        pista: |
          Nudo O: la vertical da $N_{OA}$ y con ella la horizontal da $N_{OB}$,
          que vale la mitad de $N_{OA}$ cambiada de signo.
        desarrollo: |
          $$
          N_{OA} = \frac{2T}{\sqrt{3}} = \frac{8\sqrt{3}-6}{9}P
          \qquad
          N_{OB} = -\frac{N_{OA}}{2} = -\frac{4\sqrt{3}-3}{9}P = -0{,}4365\,P
          $$

      - tipo: calcular
        titulo: El momento del empotramiento
        pregunta: |
          ¿Cuánto vale el momento en el empotramiento $G$, en unidades de
          $P\,L$?
        respuesta:
          tipo: numero
          valor: '7.613'
          tolerancia: 0.02
          formato: un número, el coeficiente de P por L
        distractores:
          - valor: '6.488'
            mensaje: |
              Ese es solo el momento de la fuerza que la celosía mete en F. Falta
              el de la carga repartida, cuya resultante de 1,5P está a 3L/4 de G
              y aporta 1,125 PL más.
          - valor: '1.125'
            mensaje: |
              Ese es solo el momento de la carga repartida. El grande es el de la
              fuerza vertical que llega por el pasador F, 3,244P con brazo 2L.
        pista: |
          En F la celosía empuja la viga hacia abajo con
          $(8+\sqrt{3})P/3 = 3{,}244P$, con brazo $2L$; y la repartida vale
          $1{,}5P$ con brazo $3L/4$.
        desarrollo: |
          $$
          M_G = 3{,}244P \cdot 2L + 1{,}5P \cdot \frac{3L}{4}
          = \frac{155 + 16\sqrt{3}}{24}PL = 7{,}613\,PL
          $$

          Con $P = 1000$ kg y $L = 100$ cm son 761 303 kg·cm, que es el valor
          publicado.

      - tipo: justificar
        pregunta: Ordena el apartado e. Una pieza es falsa.
        piezas:
          - texto: 'La sección más solicitada de FG es la del empotramiento G, donde el flector vale 7,613 PL, el mayor de la viga.'
          - texto: 'Ahí hay además axil: la celosía tira de F hacia la izquierda con 2P, así que toda la viga está traccionada con N = 2P.'
          - texto: 'El flector de G es negativo y tracciona la fibra superior, justo donde el axil de tracción también suma.'
          - texto: 'Como el axil es de tracción y el flector negativo, los dos se restan y la tensión máxima es menor que la de flexión sola.'
            trampa: true
            mensaje: |
              Se restan en la fibra **inferior**, pero se suman en la superior, y
              la tensión máxima es la mayor de las dos:
              $\sigma_{\max} = \dfrac{2P}{bh} + \dfrac{45{,}68\,PL}{b h^{2}}$.
              Con una combinación de axil y flector siempre hay una fibra donde
              los dos van en el mismo sentido.
    resolucion: |
      **El hilo.** La celosía tiene tres incógnitas exteriores: la tensión $T$
      del hilo, vertical, y las dos componentes del pasador $F$. Tomando
      momentos respecto de $F$, con la altura de los triángulos equiláteros
      $L\sqrt{3}/2$, la fuerza de $2P$ aplicada en A también aporta:

      $$
      3L\,T = \frac{5}{2}PL + \frac{3}{2}PL - \sqrt{3}\,PL
      \;\Longrightarrow\;
      T = \frac{4-\sqrt{3}}{3}P = 0{,}756\,P
      $$

      que es el resultado publicado.

      **Las barras.** En el nudo O, con el hilo vertical y las barras OB y OA:

      $$
      N_{OA} = \frac{2T}{\sqrt{3}} = 0{,}873\,P
      \qquad
      N_{OB} = -\frac{N_{OA}}{2} = -\frac{4\sqrt{3}-3}{9}P = -0{,}4365\,P
      $$

      y en el nudo A, con las dos cargas:

      $$
      N_{AB} = \frac{6-2\sqrt{3}}{9}P = 0{,}282\,P
      \qquad
      N_{AC} = \frac{12+5\sqrt{3}}{9}P = 2{,}296\,P
      $$

      Las tres de tracción salvo OB, comprimida, como publica la colección.

      **El pasador y las reacciones en G.** Del equilibrio de la celosía, el
      pasador $F$ le hace $2P$ hacia la derecha y
      $(8+\sqrt{3})P/3 = 3{,}244P$ hacia arriba; sobre la viga, lo contrario.
      Entonces:

      $$
      G_x = 2P
      \qquad
      G_y = 3{,}244P + 1{,}5P = 4{,}744\,P
      \qquad
      M_G = 7{,}613\,PL
      $$

      Con $P = 1000$ kg y $L = 1$ m son 2 000 kg, 4 744 kg y 761 303 kg·cm,
      exactamente los tres valores publicados.

      **Los diagramas de FG.** El axil es constante, $N = 2P$ de tracción: la
      celosía tira del extremo libre en sentido contrario a la pared. La
      cortante vale $-3{,}244P$ en el tramo descargado y baja en línea recta
      hasta $-4{,}744P$ en G. El flector es nulo en F —es una articulación— y
      crece en valor absoluto hasta $-7{,}613\,PL$ en el empotramiento.

      **La tensión máxima.** En la sección de G, con la sección rectangular
      $b \times h$, el flector negativo tracciona la fibra superior y el axil
      tracciona toda la sección: los dos se suman arriba.

      $$
      \sigma_{\max} = \frac{N}{bh} + \frac{6M_G}{b h^{2}}
      = \frac{2P}{bh} + \frac{45{,}68\,PL}{b h^{2}}
      $$

