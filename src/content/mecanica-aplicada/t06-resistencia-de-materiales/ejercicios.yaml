      **Comprobación.** El flector en B tiene que valer lo que dice el par
      aplicado allí, $-15$ kN·m, y sale: $-15 + 29{,}22 \cdot 1{,}2 = 20{,}07$
      es el valor en 2,4 m calculado desde la derecha, el mismo que sale desde
      la izquierda. Cuando los dos caminos coinciden en una sección interior,
      las reacciones están bien.

