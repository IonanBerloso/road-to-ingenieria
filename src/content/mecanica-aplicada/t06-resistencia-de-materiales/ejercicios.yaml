  - id: ejma6-col621-la-celosia-con-hilo-y-la-viga-empotrada
    titulo: La celosía atada por un hilo y la viga empotrada
    fuente: >-
      Ejercicio 6.21 · Tema 6, «Principios de resistencia de materiales» ·
      Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección lo marca como de
      nivel de examen y publica los apartados a, b y c, contra los que está
      contrastado el desarrollo. Sus valores del apartado c son numéricos y
      llaman A al empotramiento que el enunciado llama G; solo se reproducen
      tomando P = 1.000 kg y L = 1 m, que el enunciado no da: con esos dos
      valores salen exactamente sus 2.000 kg, 4.744 kg y 761.303 kg por cm.
    nivel: practica
    enunciado: |
      El sistema mecánico de la figura está en equilibrio en la posición
      mostrada. La estructura articulada $OABCDEF$ está atada a un hilo $OO'$
      (peso despreciable) y en $F$ está articulada a una vida $FG$. La viga $EF$
      soporta una carga distribuida de valor $\frac{P}{L}$, está empotrada en
      $G$ y tiene sección rectangular $b\ x\ h$:

      a. Tensión (fuerza interna) en el hilo $OO'$.

      b. Fuerzas internas en barras $OB$, $AB$ y $AC$.

      c. Reacciones en el empotramiento $G$.

      d. Diagramas de esfuerzos axiales, cortantes y momentos flectores en la
      viga $FG$, indicando los valores máximos.

      e. Obtener la tensión normal máxima señalando la sección donde se produce.

