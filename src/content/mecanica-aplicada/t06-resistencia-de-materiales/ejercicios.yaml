  - id: ejma6-col622-el-portico-con-dos-cables
    titulo: El pórtico con dos cables, y la sección que vale para los dos
    fuente: >-
      Ejercicio 6.22 · Tema 6, «Principios de resistencia de materiales» ·
      Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección lo marca como de
      nivel de examen y publica los resultados de los apartados b, c y d, contra
      los que está contrastado el desarrollo: los cuatro se reproducen.
    nivel: practica
    enunciado: |
      La columna $ABC$ y la viga $BDF$ poseen la misma sección rectangular,
      siendo $h = 2b$. Se pide:

      a. Sobre la viga $BDF$, expresar los esfuerzos axiales, cortantes y
      momentos flectores en función de $q_0$ y de $a$.

      b. Sobre la columna $ABC$, expresar los momentos flectores y el esfuerzo
      axial máximo en función de $q_0$ y de $a$.

      c. Si $a = 500\ mm$ y $q_0 = 10\ N/mm$, dimensión $b$ de la sección si
      $\sigma_{adm} = 50\ MPa$ en los dos elementos.

      d. Bajo las mismas condiciones del apartado anterior, determinar el radio
      de los cables $CD$ y $GH$ si ambos son de la misma sección teniendo en
      cuenta que $\sigma_{adm} = 200\ MPa$.

