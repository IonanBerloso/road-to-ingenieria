    pide: Los esfuerzos de la viga y de la columna en función de q sub cero y a, la dimensión b y el radio de los cables.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Con qué ecuación sale la tensión del cable $CD$ de un tirón?
        opciones:
          - texto: Momentos respecto de B en la viga BDF, porque ahí desaparece la reacción del nudo B
            correcta: true
            mensaje: |
              Eso es. La viga tiene tres incógnitas —las dos del nudo B y la
              tensión del cable—, y tomando momentos en B las dos primeras se
              van. Queda la carga repartida contra la componente vertical del
              cable.
          - texto: El equilibrio vertical de la viga
            mensaje: |
              Ahí aparecen a la vez la componente vertical del cable y la del
              nudo B: dos incógnitas en una ecuación. Sirve después, para sacar
              la reacción de B, pero no la primera.
          - texto: Momentos respecto de D, que es donde está el cable
            mensaje: |
              Justo en D el cable no da momento, así que esa ecuación no lo
              contiene: sirve para relacionar la reacción de B con la carga, no
              para sacar la tensión.

      - tipo: calcular
        titulo: La tensión del cable inclinado
        pregunta: |
          ¿Cuánto vale la tensión del cable $CD$, en unidades de $q_0 a$?
        respuesta:
          tipo: numero
          valor: '26.667'
          tolerancia: 0.05
          formato: un número, el coeficiente de q0 por a
        distractores:
          - valor: '16'
            mensaje: |
              Has puesto la tensión entera donde va solo su componente vertical.
              El cable CD sube 3a y avanza 4a, así que su longitud es 5a y solo
              tres quintos de la tensión son verticales.
          - valor: '20'
            mensaje: |
              Has usado la componente horizontal, cuatro quintos, donde el
              momento respecto de B pide la vertical, tres quintos.
        pista: |
          El cable va de $D$ a $C$: sube $3a$ y retrocede $4a$, longitud $5a$.
          Momentos en B con su componente vertical, $\frac{3}{5}T$, y brazo
          $4a$.
        desarrollo: |
          $$
          \frac{3}{5}T \cdot 4a = 8q_0a \cdot 8a
          \;\Longrightarrow\;
          T_{CD} = \frac{80}{3}q_0a = 26{,}67\,q_0 a
          $$

      - tipo: calcular
        titulo: El flector que dimensiona
        pregunta: |
          ¿Cuál es el mayor momento flector de todo el conjunto, en unidades de
          $q_0 a^{2}$?
        respuesta:
          tipo: numero
          valor: '48'
          tolerancia: 0.1
          formato: un número, el coeficiente de q0 a al cuadrado
        distractores:
          - valor: '32'
            mensaje: |
              Ese es el mayor de la **viga**, en la sección D. La columna está
              peor: en B llega a 48, y como las dos piezas tienen la misma
              sección, es la columna la que dimensiona.
          - valor: '192'
            mensaje: |
              Has multiplicado por 9a la fuerza horizontal que la viga mete en B,
              21,33 q0a. Quien flecta el tramo AB es la reacción horizontal de A,
              que vale 5,33 q0a, no la del nudo B.
        pista: |
          En la columna, el tramo AB se flecta con la reacción horizontal de A,
          $16q_0a/3$, y el brazo es $9a$.
        desarrollo: |
          $$
          M_B = A_x \cdot 9a = \frac{16}{3}q_0a \cdot 9a = 48\,q_0a^{2}
          $$

          que es el valor publicado, y desde B el flector vuelve a cero en C.

      - tipo: calcular
        titulo: La dimensión de la sección
        pregunta: |
          Con $a = 500$ mm, $q_0 = 10$ N/mm y $\sigma_{adm} = 50$ MPa, ¿cuánto
          vale $b$?
        respuesta:
          tipo: magnitud
          valor: '155.8 mm'
          tolerancia: 0.01
          formato: una longitud, con su unidad
        distractores:
          - valor: '153.3 mm'
            mensaje: |
              Has dimensionado solo a flexión. En la sección de B la columna
              lleva además un axil de compresión de 208 q0a/9, y las dos
              tensiones se suman: hay que resolver la ecuación completa.
          - valor: '243.3 mm'
            mensaje: |
              Parece que has usado $W = b^{3}/6$, o sea una sección cuadrada. El
              enunciado dice $h = 2b$, así que
              $W = b(2b)^{2}/6 = 2b^{3}/3$.
        pista: |
          $\sigma = \dfrac{N}{2b^{2}} + \dfrac{3M}{2b^{3}} \le 50$ MPa, con
          $M = 48q_0a^{2}$ y $N = \frac{208}{9}q_0a$.
        desarrollo: |
          $$
          M = 48 \cdot 10 \cdot 500^{2} = 1{,}2\cdot 10^{8}\ \text{N}\cdot\text{mm}
          \qquad
          N = \frac{208}{9}\cdot 10 \cdot 500 = 115\,556\ \text{N}
          $$

          $$
          \frac{115\,556}{2b^{2}} + \frac{3\cdot 1{,}2\cdot 10^{8}}{2b^{3}} = 50
          \;\Longrightarrow\;
          b = 155{,}8\ \text{mm}
          $$

          y se adopta $b = 156$ mm, que es lo publicado.

      - tipo: calcular
        titulo: El radio de los cables
        pregunta: |
          Con $\sigma_{adm} = 200$ MPa para los cables, ¿qué radio hace falta?
        respuesta:
          tipo: magnitud
          valor: '14.57 mm'
          tolerancia: 0.015
          formato: una longitud, con su unidad
        distractores:
          - valor: '8.41 mm'
            mensaje: |
              Has dimensionado con el cable GH, que lleva 80 q0a/9. Los dos
              cables son de la misma sección, así que manda el más cargado, CD,
              con 80 q0a/3: el triple.
          - valor: '29.13 mm'
            mensaje: |
              Ese es el **diámetro**. El área de la sección circular es
              $\pi R^{2}$, así que lo que se despeja de ahí es el radio.
        pista: |
          $A \ge T_{CD}/\sigma_{adm}$ con $T_{CD} = 26{,}67\,q_0a$, y después
          $A = \pi R^{2}$.
        desarrollo: |
          $$
          T_{CD} = 26{,}67 \cdot 10 \cdot 500 = 133\,333\ \text{N}
          \qquad
          A \ge \frac{133\,333}{200} = 666{,}7\ \text{mm}^{2}
          $$

          $$
          R = \sqrt{\frac{666{,}7}{\pi}} = 14{,}57\ \text{mm}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Momentos en B sobre la viga: el cable CD lleva 80 q0a/3, y con él la viga tiene axil de compresión 64 q0a/3 en BD y flector máximo 32 q0a² en D.'
          - texto: 'Momentos en A sobre la columna: el cable GH lleva 80 q0a/9, y la reacción horizontal de A vale 16 q0a/3.'
          - texto: 'El flector de la columna crece hasta 48 q0a² en B y baja a cero en C, y el axil máximo es 208 q0a/9 en el tramo BC.'
          - texto: 'Como las dos piezas tienen la misma sección, basta dimensionar con el flector máximo de la viga, 32 q0a².'
            trampa: true
            mensaje: |
              Precisamente porque comparten sección hay que dimensionar con la
              **peor** de las dos, y esa es la columna: 48 q0a² frente a 32, y
              además con un axil de compresión que la viga no tiene en esa
              sección. Dimensionar con la viga dejaría la columna corta.
    resolucion: |
      **La viga BDF.** Tiene tres incógnitas: las dos componentes del nudo B y
      la tensión del cable CD, que va de D a C subiendo $3a$ y retrocediendo
      $4a$, o sea con longitud $5a$. Momentos en B:

      $$
      \frac{3}{5}T_{CD}\cdot 4a = 8q_0a\cdot 8a
      \;\Longrightarrow\;
      T_{CD} = \frac{80}{3}q_0a
      $$

      Con ella, el nudo B recibe $\frac{64}{3}q_0a$ horizontales y la viga queda
      con **axil** de compresión $\frac{64}{3}q_0a$ en BD y nulo en DF —el cable
      lo cancela—, **cortante** de $-8q_0a$ en BD, $+8q_0a$ justo pasado D y
      cero en F, y **flector** que baja hasta $-32q_0a^{2}$ en D y vuelve a cero
      en el extremo libre.

      **La columna ABC.** Sobre ella actúan la reacción de A, el cable GH —que
      baja $12a$ y retrocede $9a$, longitud $15a$— y lo que le pasa la viga en
      B. Momentos en A:

      $$
      T_{GH} = \frac{80}{9}q_0a
      \qquad
      A_x = \frac{16}{3}q_0a
      \qquad
      A_y = \frac{136}{9}q_0a
      $$

      El **flector** de la columna crece linealmente desde cero en A hasta

      $$
      M_B = \frac{16}{3}q_0a\cdot 9a = 48\,q_0a^{2}
      $$

      y vuelve a cero en C, donde solo hay cables. El **axil** es de compresión:
      $\frac{136}{9}q_0a$ en AB y

      $$
      N_{\max} = \frac{208}{9}q_0a
      $$

      en BC, los dos valores publicados.

      **La sección.** La peor combinación está en B, en la columna: el flector
      máximo y el axil máximo a la vez. Con $h = 2b$,
      $A = 2b^{2}$ y $W = 2b^{3}/3$:

      $$
      \frac{N}{2b^{2}} + \frac{3M}{2b^{3}} \le \sigma_{adm}
      $$

      y con $M = 1{,}2\cdot 10^{8}$ N·mm y $N = 115\,556$ N sale
      $b = 155{,}8$ mm, o sea **b = 156 mm**. Conviene ver cuánto aporta el
      axil: solo con flexión saldrían 153,3 mm, así que despreciarlo dejaría la
      pieza un 2 % corta.

      **Los cables.** El más cargado es CD, con $\frac{80}{3}q_0a = 133\,333$ N:

      $$
      A \ge \frac{133\,333}{200} = 666{,}7\ \text{mm}^{2}
      \qquad
      R = \sqrt{\frac{666{,}7}{\pi}} = 14{,}6\ \text{mm}
      $$

      Los cuatro resultados publicados se reproducen.

