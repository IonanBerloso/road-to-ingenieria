  - id: ejma6-col618-la-viga-con-voladizo-y-apoyo-que-tira
    titulo: La viga con voladizo y el apoyo que tira hacia abajo
    fuente: >-
      Ejercicio 6.18 · Tema 6, «Principios de resistencia de materiales» ·
      Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección lo marca como de
      nivel de examen y publica el resultado, contra el que está contrastado el
      desarrollo.
    nivel: practica
    enunciado: |
      Para la viga de la figura:

      a. Calcular los diagramas de esfuerzo tangencial, momento flector
      indicando los valores representativos en cada diagrama.

      b. Dimensionar una viga de sección rectangular, sabiendo que la relación
      altura-base es $\frac{h}{b} = 3$ y que se emplea un material $A-42$ de
      limite elástico (tracción y compresión) $\sigma_y = 250\ MPa$, y siendo el
      coeficiente de seguridad de 1,5.

      <figure>
      <svg viewBox="0 0 380 220" role="img" width="380" height="220" aria-labelledby="ma6c618-t ma6c618-d">
        <title id="ma6c618-t">Viga apoyada en A y en C con un voladizo a la derecha, carga repartida en toda ella y una carga puntual en el extremo</title>
        <desc id="ma6c618-d">La viga AB es horizontal y mide 1,2 metros. Tiene un apoyo en A, su extremo izquierdo, y otro en C, a 0,4 metros de A; desde C hasta el extremo B hay 0,8 metros en voladizo. Sobre toda la viga actúa una carga uniformemente repartida de 2 kilonewtons por metro hacia abajo, y en el extremo B una carga puntual de 5 kilonewtons hacia abajo.</desc>
