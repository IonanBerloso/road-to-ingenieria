        <circle cx="130" cy="50" r="3.4" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
        <circle cx="130" cy="100" r="3.4" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
        <circle cx="230" cy="100" r="3.4" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
        <path d="M175 44.5 A16 16 0 0 1 187.2 34.2" fill="none" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="176" y="30" font-size="10" text-anchor="end" fill="var(--ink)" font-style="italic">ω<tspan font-size="7.5" dy="2.5">1</tspan></text>
        <path d="M215 94.5 A16 16 0 0 1 227.2 84.2" fill="none" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="216" y="80" font-size="10" text-anchor="end" fill="var(--ink)" font-style="italic">ω<tspan font-size="7.5" dy="2.5">3</tspan></text>
