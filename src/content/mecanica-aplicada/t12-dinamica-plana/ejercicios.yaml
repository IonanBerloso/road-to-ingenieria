        <line x1="80" y1="110" x2="80" y2="76" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="87" y="108" font-size="10" text-anchor="start" fill="var(--d2-tinta)">C<tspan font-size="7.5" dy="2.5">y</tspan></text>
        <line x1="130" y1="70" x2="130" y2="108" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
        <text x="136" y="104" font-size="10" text-anchor="start" fill="var(--flag)">W</text>
        <line x1="380" y1="70" x2="380" y2="108" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="386" y="104" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">Ma<tspan font-size="7.5" dy="2.5">G</tspan></text>
        <circle cx="30" cy="70" r="2.4" fill="var(--ink)"/>
        <text x="30" y="85" font-size="10" text-anchor="middle" font-weight="700" fill="var(--ink)">A</text>
        <circle cx="80" cy="70" r="2.4" fill="var(--ink)"/>
        <text x="73" y="64" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">C</text>
        <circle cx="130" cy="70" r="2.4" fill="var(--ink)"/>
        <text x="125" y="84" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">G</text>
        <circle cx="230" cy="70" r="2.4" fill="var(--ink)"/>
        <text x="230" y="85" font-size="10" text-anchor="middle" font-weight="700" fill="var(--ink)">B</text>
        <circle cx="280" cy="70" r="2.4" fill="var(--ink)"/>
        <text x="280" y="85" font-size="10" text-anchor="middle" font-weight="700" fill="var(--ink)">A</text>
        <circle cx="380" cy="70" r="2.4" fill="var(--ink)"/>
        <text x="375" y="84" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">G</text>
        <circle cx="480" cy="70" r="2.4" fill="var(--ink)"/>
        <text x="480" y="85" font-size="10" text-anchor="middle" font-weight="700" fill="var(--ink)">B</text>
        <text x="255" y="74" font-size="9" text-anchor="middle" fill="var(--faint)">=</text>
      </svg>
      <figcaption>

      A la izquierda, el sólido libre: el cable se ha roto y en B no queda nada. A la derecha, lo que tienen que dar sus fuerzas. Sin velocidad todavía, G solo tiene la aceleración perpendicular a CG, vertical.

      </figcaption>
      </figure>

      - **En C**, la reacción del pasador, $C_x$ y $C_y$.
      - **En G**, el peso, $W = Mg$, a $L/4$ de $C$.
      - **En B**, nada: el cable se ha roto.
      - **Al lado**, $M a_G$, vertical, y el par $I_G\,\alpha$, horario.

      **2. Incógnitas.** $\alpha$, $C_x$ y $C_y$: tres, con las tres
      ecuaciones del movimiento plano. Las aceleraciones de $G$ y de $B$ las
      da la cinemática a partir de $\alpha$.

      **3. Ecuaciones.** Al romperse el cable, $\omega = 0$: cada punto solo
      tiene aceleración tangente, perpendicular a la viga y proporcional a su
      distancia a $C$. $G$ está a $L/4$ y $B$, a $3L/4$:

      $$
      a_G = \alpha\,\frac{L}{4}
      \qquad
      a_B = \alpha\,\frac{3L}{4}
      $$

      Momentos en $C$, donde la reacción no da momento; fuera de $G$ se suma
      el momento de $M a_G$, que está a $L/4$ de $C$:

      $$
      W\,\frac{L}{4} = \frac{ML^{2}}{12}\,\alpha + M a_G\,\frac{L}{4}
      = \left(\frac{ML^{2}}{12} + \frac{ML^{2}}{16}\right)\alpha = \frac{7ML^{2}}{48}\,\alpha
      $$

      Que es la del punto fijo, con $I_C = 7ML^{2}/48$ por Steiner. Y las de
      fuerzas, con $y$ hacia arriba:

      $$
      C_x = 0
      \qquad
      C_y - W = -M a_G
      $$

      **4. Resultados.**

      $$
      \alpha = \frac{12g}{7L}
      \qquad
      a_B = \frac{12g}{7L}\cdot\frac{3L}{4} = \frac{9g}{7} = 9 \cdot 9{,}81/7 = 12{,}61\ \text{m/s}^{2}
      $$

      $$
      a_G = \frac{3g}{7}
      \qquad
      C_y = W - \frac{3}{7}\,W = \frac{4}{7}\,W
      \qquad
      C_x = 0
      $$

      **5. Comprobación.** Por momentos en $G$, que no se han usado: allí el
      peso no da momento, y solo lo da $C_y$, a $L/4$:

      $$
      C_y\,\frac{L}{4} = \frac{ML^{2}}{12}\cdot\frac{12g}{7L} = \frac{MgL}{7}
      \;\Rightarrow\;
      C_y = \frac{4}{7}\,Mg
      $$

      La misma. Y $a_B = 3\,a_G$, como deben estar: $B$ está tres veces más
      lejos de $C$ que $G$.

      **Lo que dice el resultado.** Justo al romperse el cable, $B$ baja con
      $9g/7$, más deprisa que en caída libre: la viga no cae, pivota, y el
      extremo largo se adelanta a $g$. El pasador pasa de sostener el peso
      entero a sostener cuatro séptimos, porque $G$ ya baja con $3g/7$, y el
      extremo corto, $A$, sube con esa misma aceleración.

  - id: ejma12-col125-la-barra-con-muelle-en-dos-ranuras
    titulo: La barra con muelle que desliza en dos ranuras
    fuente: >-
      Ejercicio 12.5 · Tema 12, «Dinámica del sólido con movimiento plano» ·
      Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección publica el
      resultado, contra el que está contrastado el desarrollo, y se ha
      comprobado también con la resolución oficial del profesor. Con g = 9,81
      m/s2 la cuenta da 3,839 rad/s y 2,438 m/s; la colección imprime 3,836 y
      2,436, un 0,08 por ciento menos, que es redondeo y no discrepancia.
    nivel: practica
    antes:
      idea: |
        Entre dos posiciones, el trabajo de todas las fuerzas es lo que cambia
        la energía cinética; el del peso y el de los muelles se escriben como
        pérdida de energía potencial. Una fuerza perpendicular al movimiento
        de su punto de aplicación no trabaja. La energía cinética de un sólido
        con movimiento plano es la de traslación con G más la de giro
        alrededor de G. En cada instante, los puntos del sólido se mueven como
        si girara alrededor del centro instantáneo de rotación, que está donde
        se cortan las perpendiculares a las velocidades de dos de sus puntos.
      formula: |
        $$
        T_0 + V_0 + W_{nc} = T + V,
        \qquad
        V = M g\,y_G + \tfrac12 k\,\delta^{2}
        $$

        $$
        T = \tfrac12 M v_G^{2} + \tfrac12 I_G\,\omega^{2},
        \qquad
        I_G = \tfrac{1}{12}ML^{2},
        \qquad
        v_P = \omega\,\overline{IP}
        $$
      reconocer: |
        Antes de calcular se mira cómo se mueven los dos extremos de la barra
        en la posición final.
    enunciado: |
      Los extremos de la barra $AB$ de 4 kg y 635 mm de longitud están
      obligados a moverse, como se muestra, por las ranuras abiertas en un
      plano vertical. Al extremo $A$ se sujeta un muelle de constante
      $k$ = 525 N/m de tal modo que su tensión es nula cuando $\theta$ = 0º. Si
      la barra se abandona en reposo cuando $\theta$ = 50º, calcular su
      velocidad angular y la velocidad en el extremo cuando $\theta$ = 0º.

      <figure>
      <svg viewBox="0 0 300 258" role="img" width="300" height="258" aria-labelledby="ma12c5-t ma12c5-d">
        <title id="ma12c5-t">Barra AB con los extremos en una ranura horizontal y otra vertical, y un muelle en A</title>
        <desc id="ma12c5-d">Una ranura horizontal en la parte alta guia el extremo A de la barra; una ranura vertical, a la derecha, guia el extremo B. La barra baja de A hacia B formando el angulo theta con la horizontal, dibujado en 50 grados. Un muelle une la pared izquierda con el extremo A, y no esta deformado cuando la barra queda horizontal.</desc>
