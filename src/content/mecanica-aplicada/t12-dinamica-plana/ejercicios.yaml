      - tipo: calcular
        titulo: La aceleración angular del conjunto
        pregunta: |
          Con $g = 9{,}81\ \text{m/s}^{2}$, ¿cuánto vale el módulo de la
          aceleración angular nada más soltar, en rad/s²?
        respuesta:
          tipo: numero
          valor: '21.24'
          tolerancia: 0.05
          formato: un número, en rad/s²
        distractores:
          - valor: '24.525'
            mensaje: |
              Has puesto el centro de gravedad a $L/2$ de $A$. Las barras están
              inclinadas 30 grados, así que la distancia horizontal de $G$ a $A$
              es $\tfrac{\sqrt{3}}{4}L$, no $L/2$.
          - valor: '84.96'
            mensaje: |
              Has usado $I_G = 2\,mL^{2}/12$ en un punto que no es $G$. El eje de
              giro pasa por $A$, en el extremo de las dos barras, y ahí
              $I_A = 2\,mL^{2}/3$.
        pista: |
          Solo los pesos dan momento en $A$, y lo hacen con el brazo horizontal
          $x_G = \tfrac{\sqrt{3}}{4}L$. Iguala a $I_A\alpha$ con
          $I_A = 2\,mL^{2}/3$.
        desarrollo: |
          $$
          2mg\,\frac{\sqrt{3}}{4}L = \frac{2mL^{2}}{3}\,\alpha
          \;\Longrightarrow\;
          \alpha = \frac{3\sqrt{3}}{4}\,\frac{g}{L}
          = \frac{3\sqrt{3}}{4}\cdot\frac{9{,}81}{0{,}6} = 21{,}24\ \text{rad/s}^{2}
          $$

      - tipo: calcular
        titulo: La aceleración del punto B
        pregunta: |
          ¿Cuánto vale el módulo de la aceleración de $B$ en ese instante?
        respuesta:
          tipo: magnitud
          valor: '12.74 m/s^2'
          tolerancia: 0.01
          formato: una aceleración, con su unidad
        distractores:
          - valor: '6.37 m/s^2'
            mensaje: |
              Es la aceleración del centro de la barra $AB$, a $L/2$ de $A$:
              $\alpha\cdot 0{,}3$. Con $\omega = 0$, la de $B$ es $\alpha\cdot AB$,
              con la distancia entera, $AB = 0{,}6$ m.
          - valor: '9.81 m/s^2'
            mensaje: |
              Eso sería caída libre. El conjunto está articulado en $A$, y $B$
              acelera perpendicularmente a $AB$, con un valor que sale de $\alpha$.
        pista: |
          Con $\omega = 0$ solo hay componente tangencial, $a_B = \alpha\cdot AB$,
          perpendicular a la barra $AB$.
        desarrollo: |
          $$
          a_B = \alpha\,L = \frac{3\sqrt{3}}{4}\,g = 12{,}74\ \text{m/s}^{2}
          $$

          Perpendicular a $AB$, así que forma 30 grados con la vertical. Ni la
          masa ni la longitud aparecen en el resultado.

      - tipo: calcular
        titulo: La reacción en A
        pregunta: |
          ¿Cuánto vale la componente vertical de la reacción en $A$?
        respuesta:
          tipo: magnitud
          valor: '25.75 N'
          tolerancia: 0.01
          formato: una fuerza, con su unidad
        distractores:
          - valor: '58.86 N'
            mensaje: |
              Es el peso de las dos barras, la reacción que habría con el conjunto
              en equilibrio. Al soltarlo, $G$ baja acelerando y la articulación
              sostiene bastante menos.
          - valor: '33.11 N'
            mensaje: |
              Es $2m\,a_{Gy}$, la parte del peso que se va en acelerar. La
              reacción es lo que queda, $2m(g - a_{Gy})$.
        pista: |
          $a_{Gy} = -\alpha\,x_G$, hacia abajo. Después,
          $A_y - 2mg = 2m\,a_{Gy}$.
        desarrollo: |
          Con $x_G = \tfrac{\sqrt{3}}{4}L = 0{,}2598$ m,
          $a_{Gy} = -\alpha\,x_G = -5{,}52\ \text{m/s}^{2}$, y

          $$
          A_y = 2m\,(g + a_{Gy}) = 6\,(9{,}81 - 5{,}518) = 25{,}75\ \text{N}
          $$

          La componente horizontal es nula, porque $G$ está en la horizontal de
          $A$ y con $\omega = 0$ no hay aceleración normal.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Por simetría $G$ está sobre la horizontal de A, a $x_G = \tfrac{\sqrt{3}}{4}L = 0{,}26$ m, y $I_A = 2mL^{2}/3 = 0{,}72$ kg m².'
          - texto: 'Momentos en el punto fijo A, $2mg\,x_G = I_A\,\alpha$, y sale $\alpha = \tfrac{3\sqrt{3}}{4}\,g/L = 21{,}24$ rad/s².'
          - texto: 'Con $\omega = 0$, $a_B = \alpha\,AB = 12{,}74$ m/s², perpendicular a la barra AB.'
          - texto: 'El centro baja con $a_{Gy} = -\alpha x_G = -5{,}52$ m/s², y del momento lineal $A_y = 2m(g + a_{Gy}) = 25{,}75$ N, con $A_x = 0$.'
          - texto: Como el conjunto está en reposo, la articulación soporta todo el peso, 58,86 N.
            trampa: true
            mensaje: |
              Estar en reposo no es estar en equilibrio. En ese instante
              $\omega = 0$ pero $\alpha \ne 0$, el centro de gravedad baja
              acelerando, y la articulación sostiene menos de la mitad del peso.
    resolucion: |
      **1. Sólidos libres.** Es un problema de dinámica de un sólido que gira
      alrededor de un punto fijo: el dibujo lleva las dos barras en el
      instante de soltarlas, sin la articulación, y al lado, lo que tienen que
      dar sus fuerzas.

      <figure class="figura-examen">
      <svg viewBox="6 4 370 170" role="img" width="555" height="255" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">Sólido libre de las dos barras soldadas en uve al soltarlas y lo que tienen que dar sus fuerzas</title>
