      - tipo: calcular
        titulo: Cuánto se alarga el muelle
        pregunta: |
          El muelle tira de un hilo arrollado a la periferia del disco. ¿Cuánto
          se alarga al girar el conjunto 90º?
        respuesta:
          tipo: magnitud
          valor: '0.19635 m'
          tolerancia: 0.01
          formato: en metros, con cinco cifras
        distractores:
          - valor: '0.17678 m'
            mensaje: |
              Es la cuerda, $R\sqrt{2}$: la distancia en línea recta entre las
              dos posiciones del punto de anclaje. Como el hilo va arrollado,
              lo que se desenrolla es el **arco**, que es algo mayor.
          - valor: '0.125 m'
            mensaje: |
              Es el radio a secas. El arco de un cuarto de vuelta vale
              $R\,\pi/2$, un 57 por ciento más que el radio.
          - valor: '0.7854 m'
            mensaje: |
              Has usado la longitud de la varilla como radio. El hilo se
              arrolla al disco, así que el radio que cuenta es el del disco,
              125 mm.
        pista: |
          Arco = radio por ángulo, con el ángulo en radianes:
          $\delta = R\,\theta$ y $\theta = \pi/2$.
        desarrollo: |
          $$
          \delta = R\,\frac{\pi}{2} = 0{,}125\cdot 1{,}5708 = 0{,}19635\ \text{m}
          $$

      - tipo: calcular
        titulo: La velocidad angular tras el cuarto de vuelta
        pregunta: |
          Con $g = 9{,}81\ \text{m/s}^{2}$, ¿cuánto vale la velocidad angular
          del conjunto cuando ha girado 90º?
        respuesta:
          tipo: numero
          valor: '6.980'
          tolerancia: 0.02
          formato: un número, en rad/s
        distractores:
          - valor: '7.465'
            mensaje: |
              Te has dejado el muelle. Al girar 90º almacena 1,54 J de los
              12,26 que suelta el peso de la varilla: poco, pero no cero.
          - valor: '6.801'
            mensaje: |
              Has usado $m_dR^{2}$ para el disco, que es la inercia de un aro.
              Un disco macizo tiene la mitad.
          - valor: '12.96'
            mensaje: |
              Te has dejado el Steiner de la varilla: has puesto
              $m_vL^{2}/12$ en vez de $m_vL^{2}/3$: el momento de inercia de la
              varilla se queda en la cuarta parte, y el del conjunto, en menos
              de un tercio.
        pista: |
          $m_v g \frac{L}{2} - \tfrac12 k\delta^{2}
          = \tfrac12 I_A\,\omega^{2}$. El centro del disco no baja: está en el
          pasador.
        desarrollo: |
          $$
          5\cdot 9{,}81\cdot 0{,}25 - \tfrac12\cdot 80\cdot 0{,}19635^{2}
          = \tfrac12\cdot 0{,}44010\,\omega^{2}
          $$

          $$
          12{,}2625 - 1{,}5421 = 0{,}22005\,\omega^{2}
          \;\Longrightarrow\;
          \omega = 6{,}980\ \text{rad/s}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'El conjunto gira alrededor del punto fijo A, así que $T = \tfrac12 I_A\omega^{2}$ con $I_A = \tfrac12 m_dR^{2} + \tfrac13 m_vL^{2} = 0{,}4401$ kg m².'
          - texto: 'El único peso que baja es el de la varilla, cuyo centro desciende $L/2$, y suelta $m_vg\frac{L}{2} = 12{,}26$ J.'
          - texto: 'El muelle se alarga el arco $R\pi/2 = 0{,}196$ m y almacena $\tfrac12 k\delta^{2} = 1{,}54$ J; con lo que queda, $\omega = 6{,}98$ rad/s.'
          - texto: El disco también baja su centro de gravedad al girar, y hay que sumar su energía potencial a la de la varilla.
            trampa: true
            mensaje: |
              El centro de gravedad del disco es su propio centro, y ahí está
              el pasador: no se mueve. Del disco solo cuenta la energía de
              rotación, que ya va dentro de $I_A$.
    resolucion: |
      **1. Posiciones.** Es un problema de dinámica de un sólido que gira
      alrededor de un punto fijo, entre dos posiciones: el dibujo lleva el
      sólido libre del conjunto, para ver qué fuerzas trabajan, y las dos
      posiciones de la varilla.

