          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <line x1="40" y1="60" x2="160" y2="60" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
        <path d="M40 60 L168 124.0" fill="none" stroke="var(--ink)" stroke-width="1" stroke-dasharray="4 3"/>
        <path d="M100 60 L228 188.0" fill="none" stroke="var(--ink)" stroke-width="1" stroke-dasharray="4 3"/>
        <path d="M100.0 60.0 A60 60 0 1 0 -20.0 60.0 A60 60 0 1 0 100.0 60.0 Z" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
        <path d="M220.0 60.0 A60 60 0 1 0 100.0 60.0 A60 60 0 1 0 220.0 60.0 Z" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
        <line x1="100" y1="60" x2="100" y2="90" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="92" y="104" font-size="10" text-anchor="end" fill="var(--ink)" font-style="italic">α<tspan font-size="7.5" dy="2.5">3</tspan><tspan dy="-2.5">L/2</tspan></text>
        <line x1="160" y1="60" x2="160" y2="120" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="166" y="102" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">α<tspan font-size="7.5" dy="2.5">3</tspan><tspan dy="-2.5">L</tspan></text>
        <line x1="220" y1="60" x2="220" y2="180" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="226" y="140" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">2α<tspan font-size="7.5" dy="2.5">3</tspan><tspan dy="-2.5">L</tspan></text>
        <circle cx="40" cy="60" r="2.4" fill="var(--ink)"/>
        <text x="34" y="54" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">A</text>
        <circle cx="100" cy="60" r="2.4" fill="var(--ink)"/>
        <text x="100" y="53" font-size="10" text-anchor="middle" font-weight="700" fill="var(--ink)">P</text>
        <circle cx="160" cy="60" r="2.4" fill="var(--ink)"/>
        <text x="160" y="53" font-size="10" text-anchor="middle" font-weight="700" fill="var(--ink)">B</text>
        <circle cx="220" cy="60" r="2.4" fill="var(--ink)"/>
        <text x="226" y="54" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">Q</text>
      </svg>
      <figcaption>

      Al soltarlo no hay velocidad, así que cada punto solo tiene aceleración tangente, proporcional a su distancia al centro de giro. La barra gira alrededor de A; el engranaje, alrededor de P, que no se mueve, y para que B lleve lo mismo en los dos, el engranaje tiene que girar al doble.

      </figcaption>
      </figure>

      $$
      a_{G3} = \alpha_3\,\frac{L}{2}
      \qquad
      a_B = \alpha_3 L = \alpha_2\,\frac{L}{2}
      \;\Longrightarrow\;
      \alpha_2 = 2\,\alpha_3
      $$

      La dinámica, con $y$ hacia arriba y los momentos positivos en el
      sentido en que cae, horario. La barra, con momentos en $A$, que es
      fijo; el engranaje, con momentos en $B$, su centro, y la ecuación
      vertical:

      $$
      m_3 g\,\frac{L}{2} - B_y L = \frac{m_3L^{2}}{3}\,\alpha_3
      \qquad
      F_t\,\frac{L}{2} = m_2 r_G^{2}\,\alpha_2
      \qquad
      F_t - B_y - m_2 g = -m_2\,a_B
      $$

      Y la vertical de la barra, para $A_y$:
      $A_y + B_y - m_3 g = -m_3\,a_{G3}$.

      **4. Resultados.** Sustituyendo $F_t = 4m_2r_G^{2}\alpha_3/L$ y $B_y$
      en la de la barra:

      $$
      g\left(m_3\frac{L}{2} + m_2 L\right) = \left(\frac{m_3L^{2}}{3} + m_2L^{2} + 4m_2r_G^{2}\right)\alpha_3
      $$

      Con $g = 9{,}81\ \text{m/s}^{2}$, el primer miembro vale
      $9{,}81 \cdot (0{,}3 + 1) = 12{,}753$ N·m y el paréntesis,
      $0{,}04 + 0{,}2 + 0{,}1125 = 0{,}3525$ kg·m²:

      $$
      \alpha_3 = 12{,}753/0{,}3525 = 36{,}18\ \text{rad/s}^{2}
      \qquad
      \alpha_2 = 2 \cdot 36{,}18 = 72{,}36\ \text{rad/s}^{2}
      \qquad
      a_B = 36{,}18 \cdot 0{,}2 = 7{,}236\ \text{m/s}^{2}
      $$

      Las fuerzas: $F_t = 0{,}1125 \cdot 36{,}18/0{,}2 = 20{,}35$ N,
      $B_y = 20{,}35 - 49{,}05 + 36{,}18 = 7{,}48$ N y
      $A_y = 29{,}43 - 10{,}85 - 7{,}48 = 11{,}10$ N.

      **5. Comprobación.** Por energía, sin ninguna fuerza interna: $A$ no se
      mueve y el punto de contacto $P$ tampoco, así que solo dan potencia los
      pesos, que bajan a $\omega_3 L/2$ y a $\omega_3 L$. La cinética es la de
      la barra girando en $A$ más la del engranaje trasladando con $B$ y
      girando al doble:

      $$
      T = \tfrac12\left(\frac{m_3L^{2}}{3} + m_2L^{2} + 4m_2r_G^{2}\right)\omega_3^{2},
      \qquad
      \frac{dT}{dt} = g\left(m_3\frac{L}{2} + m_2 L\right)\omega_3
      $$

      que, derivando, da la misma ecuación y $\alpha_3 = 36{,}18$ rad/s². Y
      la vertical del conjunto, con $F_t$ como única fuerza del (1):
      $A_y = 78{,}48 - 20{,}35 - 10{,}85 - 36{,}18 = 11{,}10$ N, la misma.

      **Lo que dice el resultado.** La colección imprime 36,17 rad/s² en el
      apartado a, y ese número es la aceleración angular de la barra: el
      engranaje gira al doble, 72,36. Lo que lo hace girar es $F_t$, la única
      fuerza con momento respecto de su centro; si se toma como interna y se
      escriben momentos en $A$ para el conjunto sin ella, salen 43,0 rad/s².
      $B$ arranca con 7,24 m/s², casi tres cuartos de $g$.

  - id: ejma12-col124-la-viga-cuando-se-rompe-el-cable
    titulo: La viga cuando se rompe el cable
    fuente: >-
      Ejercicio 12.4 · Tema 12, «Dinámica del sólido con movimiento plano» ·
      Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección publica el
      resultado, contra el que está contrastado el desarrollo, y se ha
      comprobado también con la resolución oficial del profesor. La colección
      imprime la reacción como 4/7 W g, con una g de más: el enunciado llama W
      al PESO, así que la reacción es 4W/7, que es lo que escribe la
      resolución oficial cuando la pone como 4mg/7.
    nivel: practica
    antes:
      idea: |
        Un sólido con movimiento plano cumple tres ecuaciones: la resultante
        de las fuerzas es la masa por la aceleración del centro de gravedad,
        y el momento respecto de G es el momento de inercia en G por la
        aceleración angular. Respecto de otro punto, al par de inercia se le
        suma el momento del vector masa por aceleración de G, aplicado en G.
        Un punto que gira alrededor de un punto fijo, a una distancia r de él,
        tiene una aceleración tangente a su trayectoria y otra hacia el punto
        fijo.
      formula: |
        $$
        \sum\vec{F} = M\vec{a}_G,
        \qquad
        \sum M_G = I_G\,\alpha,
        \qquad
        \sum M_P = I_G\,\alpha + M\,a_G\,d
        $$

        $$
        a_t = \alpha\,r,
        \qquad
        a_n = \omega^{2} r,
        \qquad
        I_G = \tfrac{1}{12} ML^{2}\ \text{(barra)},
        \qquad
        I_O = I_G + M\,d^{2}
        $$
      reconocer: |
        Antes de calcular se mira qué fuerzas quedan sobre la viga al
        romperse el cable.
    enunciado: |
      Una viga uniforme de longitud $L$ y peso $W$ está sostenida en la forma
      indicada en la figura. Si el cable se rompe repentinamente, calcular:

      a) Aceleración del extremo $B$.

      b) Reacción en el soporte del pasador $C$.

      <figure>
      <svg viewBox="0 0 300 180" role="img" width="300" height="180" aria-labelledby="ma12c4-t ma12c4-d">
        <title id="ma12c4-t">Viga horizontal con un pasador a L partido por cuatro del extremo A y un cable en B</title>
        <desc id="ma12c4-d">Una viga horizontal uniforme de longitud L va del extremo A, a la izquierda, al extremo B, a la derecha. Un pasador fijo la sujeta en el punto C, situado a L partido por cuatro de A. Del extremo B sale un cable vertical que la cuelga del techo. Es ese cable el que se rompe.</desc>
        <rect x="248" y="26" width="44" height="14" fill="var(--faint)" fill-opacity="0.4" stroke="var(--ink)" stroke-width="1.1"/>
        <path d="M254 40 L248 48 M264 40 L258 48 M274 40 L268 48 M284 40 L278 48" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="270" y1="40" x2="270" y2="105" stroke="var(--ink)" stroke-width="1.2"/>
        <rect x="30" y="100" width="240" height="10" fill="var(--faint)" fill-opacity="0.25" stroke="var(--ink)" stroke-width="1.3"/>
        <rect x="79" y="96" width="22" height="18" rx="4" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/>
        <circle cx="90" cy="105" r="3.5" fill="var(--ink)"/>
        <line x1="70" y1="120" x2="110" y2="120" stroke="var(--ink)" stroke-width="1.1"/>
        <path d="M76 120 L70 128 M86 120 L80 128 M96 120 L90 128 M106 120 L100 128" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <text x="24" y="109" font-size="10" text-anchor="end" fill="var(--ink)">A</text>
        <text x="277" y="109" font-size="10" fill="var(--ink)">B</text>
        <text x="90" y="90" font-size="10" text-anchor="middle" fill="var(--ink)">C</text>
        <line x1="30" y1="70" x2="90" y2="70" stroke="var(--faint)" stroke-width="0.9"/>
        <path d="M30 66 L30 74 M90 66 L90 74" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <text x="60" y="63" font-size="9" text-anchor="middle" fill="var(--faint)">L/4</text>
