      <figcaption>

      Las velocidades de B y de C son las dos verticales, paralelas a BC: la barra BC no puede girar, y sus dos extremos suben a la vez y a la misma velocidad.

      </figcaption>
      </figure>

      $B$ gira alrededor de $A$ con $AB$ horizontal, así que
      $v_B = |\omega_1|\,AB = 1{,}2$ m/s, vertical; y $C$, alrededor de $D$
      con $CD$ horizontal, también va en vertical. Dos puntos de $BC$ con
      velocidades paralelas a $BC$: $\omega_2 = 0$, $v_C = v_B$ y
      $\omega_3 = -1{,}2$ rad/s. Las aceleraciones de $C$, por $B$ y por $D$:

      $$
      \vec{a}_B = (\omega_1^{2}AB;\ |\alpha_1|\,AB) = (2{,}4;\ 1{,}8)
      \qquad
      \vec{a}_C = \vec{a}_B + \vec{\alpha}_2\times\overrightarrow{BC}
      = (2{,}4 + 0{,}5\,\alpha_2;\ 1{,}8)
      $$

      $$
      \vec{a}_C = \vec{\alpha}_3\times\overrightarrow{DC} - \omega_3^{2}\,\overrightarrow{DC}
      = (1{,}44;\ -\alpha_3)
      $$

      De ahí $\alpha_3 = -1{,}8$ y $\alpha_2 = -1{,}92\ \text{rad/s}^{2}$, las
      dos horarias, y los centros:

      $$
      \vec{a}_{G1} = (1{,}2;\ 0{,}9)
      \qquad
      \vec{a}_{G2} = (1{,}92;\ 1{,}8)
      \qquad
      \vec{a}_{G3} = (0{,}72;\ 0{,}9)\ \text{m/s}^{2}
      $$

      Las de la dinámica, con $I_2 = M_2 BC^{2}/12 = 0{,}0625$ e
      $I_3 = M_3 CD^{2}/12 = 0{,}5$ kg·m². Barra 3:

      $$
      C_x + D_x = M_3 a_{G3x}
      \qquad
      C_y + D_y - M_3 g = M_3 a_{G3y}
      \qquad
      \frac{CD}{2}\,(D_y - C_y) = I_3\,\alpha_3
      $$

      Barra 2:

      $$
      B_x - C_x = M_2 a_{G2x}
      \qquad
      B_y - C_y - M_2 g = M_2 a_{G2y}
      \qquad
      -\frac{BC}{2}\,(B_x + C_x) = I_2\,\alpha_2
      $$

      Barra 1, con momentos en $A$, que es fijo, e $I_A = M_1 AB^{2}/3 = 0{,}48$ kg·m²:

      $$
      A_x - B_x = M_1 a_{G1x}
      \qquad
      A_y - B_y - M_1 g = M_1 a_{G1y}
      \qquad
      P + AB\,B_y + \frac{AB}{2}\,M_1 g = I_A\,\alpha_1
      $$

      **4. Resultados.** Barra 3:

      $$
      C_y + D_y = 6 \cdot (9{,}81 + 0{,}9) = 64{,}26
      \qquad
      D_y - C_y = 2 \cdot 0{,}5 \cdot (-1{,}8) = -1{,}8
      $$

      $$
      C_y = 33{,}03\ \text{N}
      \qquad
      D_y = 31{,}23\ \text{N}
      $$

      Barra 2, y con ella $D_x$:

      $$
      B_x - C_x = 3 \cdot 1{,}92 = 5{,}76
      \qquad
      B_x + C_x = 0{,}0625 \cdot 1{,}92/0{,}25 = 0{,}48
      $$

      $$
      B_x = 3{,}12\ \text{N}
      \qquad
      C_x = -2{,}64\ \text{N}
      \qquad
      B_y = 33{,}03 + 29{,}43 + 3 \cdot 1{,}8 = 67{,}86\ \text{N}
      \qquad
      D_x = 6 \cdot 0{,}72 + 2{,}64 = 6{,}96\ \text{N}
      $$

      Barra 1:

      $$
      A_x = 4 \cdot 1{,}2 + 3{,}12 = 7{,}92\ \text{N}
      \qquad
      A_y = 4 \cdot 0{,}9 + 39{,}24 + 67{,}86 = 110{,}7\ \text{N}
      $$

      Y el par, que no hacía falta para las reacciones:

      $$
      P = 0{,}48 \cdot (-3) - 0{,}6 \cdot 67{,}86 - 0{,}3 \cdot 39{,}24 = -53{,}93\ \text{N·m}
      $$

      horario.

      **5. Comprobación.** Con las ecuaciones del conjunto de las tres
      barras, que no se han usado. Las fuerzas entre barras se anulan de dos
      en dos, y quedan las reacciones y los pesos:

      $$
      A_x + D_x = 7{,}92 + 6{,}96 = 14{,}88
      \qquad
      4 \cdot 1{,}2 + 3 \cdot 1{,}92 + 6 \cdot 0{,}72 = 14{,}88
      $$

      $$
      A_y + D_y - 13 \cdot 9{,}81 = 110{,}7 + 31{,}23 - 127{,}53 = 14{,}4
      \qquad
      4 \cdot 0{,}9 + 3 \cdot 1{,}8 + 6 \cdot 0{,}9 = 14{,}4
      $$

      Lo que las reacciones dan de más sobre los pesos es justo la suma de
      los $M a_G$.

      **Lo que dice el resultado.** Las aceleraciones son pequeñas frente a
      $g$, y el par del motor es casi todo para sostener: de sus 53,9 N·m,
      52,5 son los momentos respecto de $A$ de lo que la barra 2 le carga en
      $B$ y del peso de la barra 1, y solo 1,44 hacen girar la barra 1. El
      sentido de giro sí importa en vertical: con giro antihorario los
      términos de inercia cambian de signo y salen $A_y = 85{,}5$ N y
      $D_y = 27{,}6$ N. En horizontal, no: solo dependen de $\omega^{2}$ y de
      $\alpha_2$, que salen iguales en los dos casos.

  - id: ejma12-col1211-la-barra-que-desliza-por-el-suelo
    titulo: La barra articulada a un balancín que desliza por el suelo
    fuente: Ejercicio 12.11 · Tema 12, «Dinámica del sólido con movimiento plano» · Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado y el curso su resolución, y el desarrollo está contrastado contra los dos. El número impreso en la colección no sale de los datos; el bueno es el de la resolución del curso, y aquí se explica de dónde viene el otro.
    nivel: practica
    antes:
      idea: |
        Un sólido con movimiento plano cumple tres ecuaciones: la resultante
        de las fuerzas es la masa por la aceleración del centro de gravedad,
        y el momento respecto de G es el momento de inercia en G por la
        aceleración angular. La aceleración de un punto de un sólido sale de
        la de otro punto del mismo sólido y de su velocidad y su aceleración
        angulares. Un apoyo sin rozamiento solo empuja perpendicular a la
        superficie.
      formula: |
        $$
        \sum\vec{F} = M\vec{a}_G,
        \qquad
        \sum M_G = I_G\,\alpha,
        \qquad
        I_G = \tfrac{1}{12}ML^{2}\ \text{(barra)}
        $$

        $$
        \vec{a}_B = \vec{a}_A + \vec{\alpha}\times\overrightarrow{AB} - \omega^{2}\,\overrightarrow{AB}
        $$
      reconocer: |
        Antes de calcular se mira qué piezas tienen masa y cuáles no, y qué
        puntos están fijos.
    enunciado: |
      La barra uniforme de 6 kg $AB$ está articulada en su extremo A a la barra
      $AC$ de peso despreciable y en el otro extremo $B$ desliza sin rozamiento
      por el suelo. En el instante señalado, la barra $AB$ parte del reposo y el
      punto $B$ tiene una aceleración de $3\ \text{m/s}^{2}$ hacia la izquierda
      debido a la fuerza $P$. Para ese instante, calcular:

      a) Valor de la fuerza $P$.

      b) Fuerza que la barra $AC$ ejerce sobre la barra $AB$.

      <figure>
      <svg viewBox="0 0 300 205" role="img" width="300" height="205" aria-labelledby="ma1211-t ma1211-d">
        <title id="ma1211-t">La barra AB, articulada en A a la barra AC y apoyada en B sobre el suelo</title>
        <desc id="ma1211-d">La barra AB mide 1,5 metros y baja desde A, arriba a la izquierda, hasta B, abajo a la derecha, sobre el suelo horizontal. Desde A sale hacia la derecha la barra horizontal AC, articulada en C a un apoyo fijo. El desnivel entre la recta AC y el suelo es de 1,2 metros. En B actúa la fuerza P, horizontal y hacia la izquierda. El ángulo entre AB y la horizontal se llama beta.</desc>
