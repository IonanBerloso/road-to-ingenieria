        <text x="68" y="140" font-size="10" text-anchor="start" fill="var(--flag)">Mg</text>
        <line x1="104" y1="190" x2="67" y2="190" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
        <text x="86" y="183" font-size="10" text-anchor="middle" fill="var(--flag)">P</text>
        <line x1="214" y1="110" x2="176" y2="110" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="194" y="103" font-size="10" text-anchor="middle" fill="var(--ink)" font-style="italic">Ma<tspan font-size="7.5" dy="2.5">G</tspan></text>
        <circle cx="60" cy="70" r="2.4" fill="var(--ink)"/>
        <text x="52" y="84" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">C</text>
        <circle cx="60" cy="110" r="2.4" fill="var(--ink)"/>
        <text x="52" y="114" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">G</text>
        <circle cx="60" cy="190" r="2.4" fill="var(--ink)"/>
        <text x="52" y="194" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">B</text>
        <circle cx="214" cy="70" r="2.4" fill="var(--ink)"/>
        <text x="206" y="74" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">C</text>
        <circle cx="214" cy="110" r="2.4" fill="var(--ink)"/>
        <text x="206" y="126" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">G</text>
        <text x="159" y="114" font-size="9" text-anchor="middle" fill="var(--faint)">=</text>
      </svg>
      <figcaption>

      A la izquierda, el sólido libre, con la reacción en su sentido positivo; a la derecha, lo que tienen que dar sus fuerzas. El peso pasa por C: no da momento respecto de ella.

      </figcaption>
      </figure>

      - **En C**, la reacción, $C_x$ y $C_y$.
      - **En G**, el peso, $Mg = 4 \cdot 9{,}81 = 39{,}24$ N, en la vertical de
        $C$ y $r = 0{,}225$ m por debajo.
      - **En B**, $P = 75$ N, horizontal hacia la izquierda, a
        $L/2 + r = 0{,}675$ m de $C$.
      - **Al lado**, $M a_G$ y el par $I_G\,\alpha$.

      **2. Incógnitas.** $\alpha$, $C_x$ y $C_y$: tres, con las tres
      ecuaciones del movimiento plano. La aceleración de $G$ la da la
      cinemática a partir de $\alpha$.

      **3. Ecuaciones.** Al aplicar $P$ la barra está en reposo, así que
      $\omega = 0$ y $G$ solo tiene la aceleración tangente, perpendicular a
      $CG$: horizontal.

      $$
      \vec{a}_G = \vec{\alpha}\times\overrightarrow{CG}
      \;\Longrightarrow\;
      a_{Gx} = \alpha\,r
      \qquad
      a_{Gy} = 0
      $$

      Con $x$ hacia la derecha, $y$ hacia arriba y los momentos antihorarios
      positivos. Momentos en $C$, que es fijo, con el momento de inercia
      respecto de $C$; el peso pasa por $C$ y no da momento:

      $$
      -P\left(\frac{L}{2} + r\right) = I_C\,\alpha,
      \qquad
      I_C = \frac{ML^{2}}{12} + M r^{2}
      $$

      $$
      C_x - P = M\,a_{Gx}
      \qquad
      C_y - Mg = 0
      $$

      **4. Resultados.**

      $$
      I_C = 0{,}27 + 0{,}2025 = 0{,}4725\ \text{kg}\cdot\text{m}^{2}
      \qquad
      \alpha = -75 \cdot 0{,}675/0{,}4725 = -107{,}14\ \text{rad/s}^{2}
      $$

      $$
      a_{Gx} = -107{,}14 \cdot 0{,}225 = -24{,}11\ \text{m/s}^{2}
      \qquad
      C_x = 4 \cdot (-24{,}107) + 75 = -21{,}43\ \text{N}
      \qquad
      C_y = 39{,}24\ \text{N}
      $$

      El signo de $\alpha$: la barra empieza a girar en sentido horario, con
      $B$ yendo hacia la izquierda.

      **5. Comprobación.** Por momentos en $G$, que no se han usado: el peso
      no da momento; $P$, a $L/2 = 0{,}45$ m por debajo, y $C_x$, a
      $r = 0{,}225$ m por encima, sí:

      $$
      -75 \cdot 0{,}45 - 0{,}225\,C_x = \frac{ML^{2}}{12}\,\alpha = 0{,}27 \cdot (-107{,}14) = -28{,}93
      $$

      Así que $C_x = (33{,}75 - 28{,}929)/(-0{,}225) = -21{,}43$ N, el mismo.

      **Lo que dice el resultado.** $P$ empuja hacia la izquierda con 75 N y
      la articulación, en vez de aguantar, también tira hacia la izquierda
      con 21,4 N: entre las dos dan los 96,4 N que pide $M a_{Gx}$. Pasa
      porque $B$ está por debajo del centro de percusión, a
      $I_C/(Mr) = 0{,}4725/0{,}9 = 0{,}525$ m de $C$: aplicada ahí, $P$ no
      cargaría la articulación en horizontal. En vertical, $C_y$ es justo el
      peso, porque en ese instante $G$ no acelera en vertical.

  - id: ejma12-col127-la-varilla-soldada-al-disco
    titulo: La varilla soldada al disco con muelle
    fuente: >-
      Ejercicio 12.7 · Tema 12, «Dinámica del sólido con movimiento plano» ·
      Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección publica el
      resultado, contra el que está contrastado el desarrollo, y se ha
      comprobado también con la resolución oficial del profesor, de la que se
      toma además la lectura de la figura que el enunciado no dice con
      palabras: el muelle tira de un hilo arrollado al disco, así que al girar
      un ángulo se alarga el arco correspondiente.
    nivel: practica
    antes:
      idea: |
        Entre dos posiciones, el trabajo de todas las fuerzas es lo que cambia
        la energía cinética; el del peso y el de los muelles se escriben como
        pérdida de energía potencial. Un sólido que gira alrededor de un punto
        fijo tiene la energía cinética de un giro alrededor de ese punto, con
        el momento de inercia respecto de él. El momento de inercia respecto
        de un punto que no es el centro de gravedad se obtiene con el teorema
        de Steiner. Un hilo arrollado a un disco se desenrolla el arco que
        gira el disco.
      formula: |
        $$
        T_0 + V_0 + W_{nc} = T + V,
        \qquad
        V = M g\,y_G + \tfrac12 k\,\delta^{2},
        \qquad
        T = \tfrac12 I_O\,\omega^{2}\ \ (O\ \text{fijo})
        $$

        $$
        I_G = \tfrac12 MR^{2}\ \text{(disco)},
        \qquad
        I_G = \tfrac{1}{12}ML^{2}\ \text{(barra)},
        \qquad
        I_O = I_G + M\,d^{2},
        \qquad
        s = R\,\theta
        $$
      reconocer: |
        Antes de calcular se mira dónde está el pasador respecto de cada pieza
        del conjunto.
    enunciado: |
      La varilla (1) de 5 kg está soldada al disco uniforme de 3 kg que gira
      sobre un pasador en $A$. Un resorte constante 80 N/m está unido al disco
      y no está deformado cuando la varilla $AB$ está horizontal (caso
      mostrado). Si se suelta el conjunto desde el reposo como se indica,
      obtener su velocidad angular después de que haya girado un ángulo de 90º.

      <figure>
      <svg viewBox="0 0 300 215" role="img" width="300" height="215" aria-labelledby="ma12c7-t ma12c7-d">
