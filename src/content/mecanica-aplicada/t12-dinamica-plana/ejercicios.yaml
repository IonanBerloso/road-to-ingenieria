        <rect x="100" y="76" width="92" height="92" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.5"/>
        <circle cx="100" cy="30" r="3.4" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
        <circle cx="100" cy="76" r="3.4" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
        <circle cx="146" cy="122" r="2.8" fill="var(--ink)"/>
        <text x="88" y="28" font-size="11" font-weight="600" fill="var(--ink)">O</text>
