        <circle cx="250" cy="90" r="2.4" fill="var(--ink)"/>
        <text x="243" y="94" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">A</text>
        <circle cx="302" cy="90" r="2.4" fill="var(--ink)"/>
        <text x="296" y="85" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">G</text>
        <text x="210.95" y="94" font-size="9" text-anchor="middle" fill="var(--faint)">=</text>
      </svg>
      <figcaption>

      Las dos barras son iguales y simétricas respecto de la horizontal de A: su centro común, G, queda en ella. Al soltar, G solo puede acelerar perpendicular a AG, en vertical.

      </figcaption>
      </figure>

      - **En A**, la reacción, $A_x$ y $A_y$.
      - **En G**, el peso de las dos barras, $2mg = 6 \cdot 9{,}81 = 58{,}86$ N.
        Por simetría, $G$ está en la horizontal de $A$, a
        $x_G = \frac{L}{2}\cos 30^\circ$ de ella.
      - **Al lado**, $2m\,a_G$ y el par $I_G\,\alpha$.

      **2. Incógnitas.** $\alpha$, $A_x$ y $A_y$: tres, con las tres
      ecuaciones del movimiento plano. La aceleración de $G$ la da la
      cinemática a partir de $\alpha$.

      **3. Ecuaciones.** Al soltar, $\omega = 0$, y $G$ solo tiene la
      aceleración tangente, perpendicular a $AG$, que es horizontal:

      $$
      \vec{a}_G = \vec{\alpha}\times\overrightarrow{AG}
      \;\Longrightarrow\;
      a_{Gx} = 0
      \qquad
      a_{Gy} = \alpha\,x_G
      $$

      Con $x$ hacia la derecha, $y$ hacia arriba y los giros antihorarios
      positivos. Momentos en $A$, que es fijo, con el momento de inercia de
      las dos barras respecto de $A$; la reacción pasa por $A$ y no da
      momento:

      $$
      -2mg\,x_G = I_A\,\alpha,
      \qquad
      I_A = 2\cdot\frac{mL^{2}}{3}
      $$

      $$
      A_x = 2m\,a_{Gx}
      \qquad
      A_y - 2mg = 2m\,a_{Gy}
      $$

      **4. Resultados.**

      $$
      x_G = 0{,}3 \cdot 0{,}86603 = 0{,}25981\ \text{m}
      \qquad
      I_A = 2 \cdot 3 \cdot 0{,}6^{2}/3 = 0{,}72\ \text{kg·m}^{2}
      $$

      $$
      \alpha = -58{,}86 \cdot 0{,}25981/0{,}72 = -21{,}24\ \text{rad/s}^{2}
      \qquad
      a_B = 21{,}24 \cdot 0{,}6 = 12{,}74\ \text{m/s}^{2}
      $$

      $\alpha$ es horaria, y $a_B$, perpendicular a $AB$: hacia abajo y hacia
      la derecha, a 30° de la vertical.

      $$
      a_{Gy} = -21{,}24 \cdot 0{,}25981 = -5{,}518\ \text{m/s}^{2}
      \qquad
      A_x = 0
      \qquad
      A_y = 6 \cdot (9{,}81 - 5{,}518) = 25{,}75\ \text{N}
      $$

      **5. Comprobación.** Por momentos en $G$, que no se han usado, con el
      momento de inercia del conjunto respecto de $G$, por Steiner:
      $I_G = 0{,}72 - 6 \cdot 0{,}25981^{2} = 0{,}315$ kg·m². El peso pasa por
      $G$; $A_y$ está a $x_G$ a su izquierda:

      $$
      -0{,}25981\,A_y = I_G\,\alpha = 0{,}315 \cdot (-21{,}2395) = -6{,}6904
      \qquad
      A_y = 6{,}6904/0{,}25981 = 25{,}75\ \text{N}
      $$

      La misma.

      **Lo que dice el resultado.** Con letras,
      $a_B = \frac{3\sqrt{3}}{4}\,g = 1{,}3\,g$: $B$ arranca más deprisa que
      si cayera libre, y ni la masa ni la longitud aparecen. $G$ baja con
      $\frac{9}{16}\,g$, así que la articulación solo sostiene
      $\frac{7}{16}$ del peso: 25,75 de 58,86 N en el instante de soltar, y
      ninguna fuerza horizontal.

  - id: ejma12-col1214-la-barra-con-el-disco-apoyado-encima
    titulo: La barra con un disco apoyado encima cuando se corta el hilo
    fuente: Ejercicio 12.14 · Tema 12, «Dinámica del sólido con movimiento plano» · Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado y el curso su resolución, y el desarrollo está contrastado contra los dos. La colección intercambia los apartados a) y c) al imprimir el resultado, y la resolución del curso da la versión correcta, que es la que se publica aquí.
    nivel: practica
    antes:
      idea: |
        Un sólido con movimiento plano cumple tres ecuaciones: la resultante
        de las fuerzas es la masa por la aceleración del centro de gravedad,
        y el momento respecto de G es el momento de inercia en G por la
        aceleración angular. Cuando dos sólidos se tocan, se separa cada uno
        con las fuerzas que le hace el otro: la misma fuerza, con sentidos
        opuestos. Mientras sigan en contacto, los dos puntos que se tocan
        tienen la misma aceleración en la dirección perpendicular a la
        superficie de contacto. Un muelle ideal tira o empuja a lo largo de sí
        mismo, con una fuerza proporcional a lo que se ha estirado o
        encogido.
      formula: |
        $$
        \sum\vec{F} = M\vec{a}_G,
        \qquad
        \sum M_G = I_G\,\alpha,
        \qquad
        I_G = \tfrac{1}{12}ML^{2}\ \text{(barra)}
        $$

        $$
        F_m = k\,\delta,
        \qquad
        a_{1,n} = a_{2,n}\ \text{(contacto)}
        $$
      reconocer: |
        Antes de calcular se mira qué fuerza puede hacer cada contacto y qué
        cambia en el instante del corte.
    enunciado: |
      Una barra $AB$ de masa $M$ y longitud $4R$ está suspendida en un plano
      vertical mediante un hilo $BC$ y un muelle ideal $OA$ de constante
      $k = Mg/(2R)$ que forma 45º con la vertical. Sobre el punto medio de la
      barra se apoya un disco de masa $M$ y radio $R$, no existiendo rozamiento
      entre ambos. Estando en equilibrio con la barra $AB$ horizontal, se corta el
      hilo $BC$. Determinar en ese instante (inmediatamente antes de que se inicie
      el movimiento):

      a) La aceleración del punto medio de la barra.

      b) La aceleración angular de la barra.

      c) La aceleración del centro del disco.

      d) La aceleración angular del disco.

      e) La reacción entre disco y barra.

