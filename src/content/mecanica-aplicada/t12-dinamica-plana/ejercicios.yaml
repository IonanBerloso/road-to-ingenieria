    pide: Las aceleraciones de los dos sólidos y la reacción entre ellos, en función de M, g y R.
    pasos:
      - tipo: reconocer
        pregunta: |
          Entre el disco y la barra no hay rozamiento. ¿Qué impone eso sobre el
          disco justo después de cortar el hilo?
        opciones:
          - texto: Que la fuerza de contacto es vertical, así que el disco no acelera en horizontal ni gira
            correcta: true
            mensaje: |
              Eso es. Sin rozamiento la única fuerza de contacto es la normal,
              vertical porque la barra es horizontal, y su línea de acción pasa
              por el centro del disco. Ni fuerza horizontal ni momento, así que
              $a_{Gx} = 0$ y $\alpha_{\text{disco}} = 0$.
          - texto: Que el disco rueda sin deslizar sobre la barra
            mensaje: |
              Rodar sin deslizar es justo lo que hace falta rozamiento para
              conseguir. Sin él, el disco no tiene ninguna fuerza que le dé
              momento y no puede empezar a girar.
          - texto: Que el disco y la barra tienen la misma aceleración, porque siguen en contacto
            mensaje: |
              Solo comparten la componente **vertical** en el punto de contacto,
              que es lo que mantiene el contacto. En horizontal son
              independientes, y de hecho aceleran distinto.
          - texto: Que la normal sigue valiendo Mg, porque el disco solo tiene su peso
            mensaje: |
              Valdría $Mg$ si el disco no acelerara. Al cortar el hilo la barra se
              va hacia abajo, el disco la acompaña, y entonces la normal baja
              hasta la mitad del peso.

      - tipo: calcular
        titulo: La reacción entre el disco y la barra
        pregunta: |
          Escribiendo la normal como $N = c\,Mg$, ¿cuánto vale $c$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.01
          formato: un número, sin unidad
        distractores:
          - valor: '1'
            mensaje: |
              Es el valor de equilibrio, antes de cortar el hilo. En cuanto la
              barra empieza a bajar, el disco la sigue acelerando y la normal cae.
          - valor: '0'
            mensaje: |
              El contacto no se pierde. Si $N$ fuese cero, el disco caería con $g$
              y la barra bajaría menos; el contacto obliga a que las dos
              aceleraciones verticales coincidan, y eso exige $N = Mg/2$.
        pista: |
          El disco da $N - Mg = M\,a_{Gd,y}$ y la barra, en vertical,
          $Mg - Mg - N = M\,a_{Gb,y}$. Y el contacto impone
          $a_{Gd,y} = a_{Gb,y}$.
        desarrollo: |
          Del disco, $a_{Gd,y} = (N - Mg)/M$; de la barra, $a_{Gb,y} = -N/M$
          —el muelle aporta $Mg$ hacia arriba, que se come el peso—. Igualando,

          $$
          \frac{N - Mg}{M} = -\frac{N}{M}
          \;\Longrightarrow\;
          N = \frac{Mg}{2}
          $$

      - tipo: calcular
        titulo: La componente horizontal del punto medio de la barra
        pregunta: |
          Con $x$ hacia la derecha, escribe la aceleración del punto medio de la
          barra como $a_{x} = c\,g$. ¿Cuánto vale $c$?
        respuesta:
          tipo: numero
          valor: '-1'
          tolerancia: 0.01
          formato: un número, con su signo
        distractores:
          - valor: '0'
            mensaje: |
              Cero es la componente horizontal del **centro del disco**, no la de
              la barra. El muelle tira de la barra en $A$ con una componente
              horizontal $Mg$ hacia $O$, y sobre el disco no actúa nada
              horizontal. La colección imprime este valor en el apartado a), y su
              propia resolución lo asigna al disco.
          - valor: '-0.5'
            mensaje: |
              Esa es la componente **vertical**, que sí vale $-g/2$ y es común a
              los dos sólidos. La horizontal de la barra es la del muelle entera.
        pista: |
          El muelle es lo único que empuja en horizontal, y solo actúa sobre la
          barra. Su componente horizontal es $Mg$, y la masa de la barra es $M$.
        desarrollo: |
          De la estática previa, el muelle está estirado lo justo para dar
          $F_m = \sqrt{2}\,Mg$ a 45º, o sea $Mg$ en cada componente. Al cortar el
          hilo esa fuerza no cambia, y en horizontal la barra solo la tiene a ella:

          $$
          -Mg = M\,a_{Gb,x} \;\Longrightarrow\; a_{Gb,x} = -g
          $$

          El centro del disco, en cambio, no tiene ninguna fuerza horizontal, así
          que $a_{Gd,x} = 0$.

      - tipo: calcular
        titulo: La aceleración angular de la barra
        pregunta: |
          Escribiendo $\alpha_{b} = c\,g/R$, ¿cuánto vale $c$? Cuenta positivo el
          sentido antihorario.
        respuesta:
          tipo: numero
          valor: '-1.5'
          tolerancia: 0.01
          formato: un número, con su signo
        distractores:
          - valor: '-0.75'
            mensaje: |
              Has usado $I_G = M(4R)^{2}/12$ pero con el brazo equivocado, o has
              dividido de más. El momento del muelle en $G$ es $Mg\cdot 2R$ y la
              inercia es $\tfrac{4}{3}MR^{2}$, y el cociente da $\tfrac32 g/R$.
          - valor: '1.5'
            mensaje: |
              El módulo está bien, el sentido no. El muelle tira hacia arriba del
              extremo $A$, que está a la izquierda de $G$, así que hace girar la
              barra en sentido horario.
        pista: |
          Toma momentos en el centro de la barra. La normal actúa justo ahí y no
          da momento; solo lo da la componente vertical del muelle, a $2R$ de $G$.
        desarrollo: |
          Con $I_{Gb} = \tfrac{1}{12}M(4R)^{2} = \tfrac{4}{3}MR^{2}$ y el muelle
          tirando hacia arriba en $A$, a $2R$ a la izquierda de $G$,

          $$
          -Mg\cdot 2R = \frac{4}{3}MR^{2}\,\alpha_b
          \;\Longrightarrow\;
          \alpha_b = -\frac{3g}{2R}
          $$

          El disco, en cambio, no recibe ningún momento respecto de su centro, así
          que $\alpha_d = 0$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'De la estática previa, el muelle tira de A con $\sqrt{2}Mg$ a 45º, o sea $Mg$ en horizontal y $Mg$ en vertical, y esa fuerza no cambia al cortar el hilo.'
          - texto: 'Sin rozamiento la normal es vertical y pasa por el centro del disco, así que $a_{Gd,x} = 0$ y $\alpha_d = 0$.'
          - texto: 'El contacto obliga a que las dos aceleraciones verticales coincidan, y con las dos ecuaciones verticales sale $N = Mg/2$ y $a_y = -g/2$ para los dos.'
          - texto: 'En horizontal, sobre la barra solo actúa el muelle, $a_{Gb,x} = -g$; y momentos en el centro de la barra dan $\alpha_b = -3g/(2R)$.'
          - texto: Como el disco se apoya en la barra, la normal sigue valiendo Mg y el disco baja con la aceleración de la gravedad.
            trampa: true
            mensaje: |
              Las dos cosas se contradicen entre sí. Si el disco bajara con $g$
              sería porque no hay normal, y si la normal valiera $Mg$ el disco no
              bajaría en absoluto. La respuesta está en medio, $N = Mg/2$ y
              $a_y = -g/2$.
    resolucion: |
      **La fuerza del muelle.** Antes de cortar, la barra está en equilibrio con
      el peso, la normal del disco —que en equilibrio vale $Mg$—, el muelle en $A$
      y el hilo en $B$. Tomando momentos en $A$ sale que el hilo tira con $Mg$ en
      vertical, y de la ecuación vertical, que el muelle también aporta $Mg$ hacia
      arriba. Como forma 45º, su componente horizontal es igualmente $Mg$ y su
      módulo $\sqrt{2}\,Mg$. **Al cortar el hilo el muelle no cambia**, porque no
      le ha dado tiempo a estirarse ni a encogerse.

      **El disco.** Sin rozamiento la única fuerza de contacto es la normal,
      vertical y en la línea del centro. Por tanto

      $$
      a_{Gd,x} = 0
      \qquad
      \alpha_d = 0
      \qquad
      N - Mg = M\,a_{Gd,y}
      $$

      **La barra.** En horizontal solo actúa el muelle; en vertical, el muelle
      hacia arriba, el peso y la normal hacia abajo:

      $$
      a_{Gb,x} = -g
      \qquad
      Mg - Mg - N = M\,a_{Gb,y}
      $$

      **El contacto.** El disco se apoya en el punto medio de la barra, que es su
      centro, así que las dos aceleraciones verticales son la misma. Igualando,
      $N = Mg/2$ y $a_y = -g/2$ para los dos.

      **El giro de la barra.** Momentos en su centro, donde la normal no da
      momento:

      $$
      -Mg\cdot 2R = \frac{4}{3}MR^{2}\,\alpha_b
      \;\Longrightarrow\;
      \alpha_b = -\frac{3g}{2R}
      $$

      **Resumen.** Punto medio de la barra, $-g\,\hat{\imath} - \tfrac{g}{2}\hat{\jmath}$;
      centro del disco, $-\tfrac{g}{2}\hat{\jmath}$; $\alpha_b = -3g/(2R)$;
      $\alpha_d = 0$; $N = Mg/2$. La colección imprime estos mismos valores pero
      con los apartados a) y c) cambiados de sitio; quien tiene la componente
      horizontal es la barra, que es la que recibe el muelle.

  - id: ejma12-col1215-el-disco-tirado-por-el-muelle
    titulo: El disco tirado por un muelle que acaba deslizando
    fuente: Ejercicio 12.15 · Tema 12, «Dinámica del sólido con movimiento plano» · Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado y el curso su resolución, y el desarrollo está contrastado contra los dos.
    nivel: practica
    enunciado: |
      Un disco circular homogéneo de masa $M$ y radio $R$ se apoya verticalmente
      sobre un suelo horizontal. El centro del disco está conectado a un resorte
      de constante elástica $k$. Se comunica al resorte un alargamiento
      $\delta = Mg/k$ y, en esa posición, se suelta el sistema sin velocidad.
      Calcular la aceleración inicial del punto $A$ del disco (opuesto
      diametralmente al punto de contacto con el suelo) si el coeficiente de
      rozamiento entre disco y suelo vale f = 0.25.

      <figure>
      <svg viewBox="0 0 290 190" role="img" width="290" height="190" aria-labelledby="ma1215-t ma1215-d">
        <title id="ma1215-t">El disco apoyado en el suelo y unido por un muelle a la pared</title>
        <desc id="ma1215-d">Un disco de radio R apoyado sobre un suelo horizontal. Su centro G está unido por un muelle horizontal a un punto fijo de la pared de la derecha. El punto A es el más alto del disco, diametralmente opuesto al punto de contacto con el suelo.</desc>
        <line x1="30" y1="140" x2="258" y2="140" stroke="var(--ink)" stroke-width="1.4"/>
        <path d="M38 140 L30 148 M58 140 L50 148 M78 140 L70 148 M98 140 L90 148 M118 140 L110 148 M138 140 L130 148 M158 140 L150 148 M178 140 L170 148 M198 140 L190 148 M218 140 L210 148 M238 140 L230 148 M258 140 L250 148" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="258" y1="52" x2="258" y2="140" stroke="var(--ink)" stroke-width="1.4"/>
        <path d="M258 58 L266 66 M258 78 L266 86 M258 98 L266 106 M258 118 L266 126 M258 138 L266 146" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <circle cx="100" cy="102" r="38" fill="var(--faint)" fill-opacity="0.12" stroke="var(--ink)" stroke-width="1.5"/>
        <circle cx="100" cy="102" r="2.8" fill="var(--ink)"/>
        <circle cx="100" cy="64" r="3.2" fill="var(--flag)"/>
        <line x1="100" y1="102" x2="127" y2="129" stroke="var(--faint)" stroke-width="0.9"/>
        <text x="112" y="126" font-size="9" fill="var(--faint)">R</text>
        <polyline points="138,102 146,102 150,94 158,110 166,94 174,110 182,94 190,110 198,94 206,110 214,94 222,110 230,102 246,102" fill="none" stroke="var(--d5)" stroke-width="1.8"/>
        <rect x="246" y="94" width="10" height="16" rx="1.5" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.1"/>
        <text x="90" y="106" font-size="11" font-weight="600" fill="var(--ink)">G</text>
        <text x="92" y="56" font-size="11" font-weight="600" fill="var(--flag)">A</text>
        <text x="188" y="86" font-size="9.5" fill="var(--d5)">k</text>
        <text x="145" y="170" font-size="9" text-anchor="middle" fill="var(--faint)">alargamiento inicial Mg/k, f = 0,25</text>
      </svg>
      </figure>
    pide: La aceleración inicial del punto A del disco, en función de g.
    pasos:
      - tipo: reconocer
        pregunta: |
          Lo primero es decidir si el disco rueda sin deslizar. ¿Cómo se decide?
        opciones:
          - texto: Se supone rodadura, se calcula el rozamiento que haría falta y se compara con f·N
            correcta: true
            mensaje: |
              Eso es. El rozamiento estático vale lo que pida el movimiento, pero
              tiene un techo. Se resuelve suponiendo rodadura, se mira el $F_r$ que
              sale y, si supera $f\,N$, la hipótesis era falsa y el disco desliza.
          - texto: Como el enunciado da f, el rozamiento vale f·N desde el principio
            mensaje: |
              Dar el coeficiente no obliga a que el rozamiento esté en su tope.
              $f\,N$ es el **máximo** del rozamiento estático; mientras el disco
              ruede, el rozamiento vale menos. Hay que comprobarlo, y aquí resulta
              que sí desliza.
          - texto: Con f = 0,25 el rozamiento es pequeño, así que se puede despreciar
            mensaje: |
              Despreciarlo daría $\alpha = 0$ y el disco resbalaría sin girar. El
              rozamiento vale $Mg/4$, que no es despreciable, y de hecho es lo
              único que hace girar el disco.
          - texto: Rueda siempre, porque el enunciado no dice que deslice
            mensaje: |
              La rodadura no se supone, se comprueba. Aquí el rozamiento necesario
              sería $Mg/3$ y el máximo disponible es $Mg/4$, así que el disco
              desliza.

      - tipo: calcular
        titulo: El rozamiento que exigiría rodar sin deslizar
        pregunta: |
          Suponiendo rodadura pura, escribe el rozamiento necesario como
          $F_r = c\,Mg$. ¿Cuánto vale $c$?
        respuesta:
          tipo: numero
          valor: '0.3333'
          tolerancia: 0.005
          formato: un número, sin unidad
        distractores:
          - valor: '0.25'
            mensaje: |
              Eso es $f\,N$, el máximo disponible, no el necesario. Lo que hay que
              calcular es cuánto rozamiento pide la rodadura, y sale mayor que ese
              máximo, que es justo lo que decide el problema.
          - valor: '0.5'
            mensaje: |
              Has igualado $F_r$ a $\tfrac12 M a_G$ con $a_G = g$. La ecuación de
              fuerzas también lleva el rozamiento, y al resolver las dos juntas
              sale $a_G = \tfrac23 g$ y $F_r = Mg/3$.
        pista: |
          Con rodadura, $Mg - F_r = Ma_G$, $F_r R = \tfrac12 MR^{2}\alpha$ y
          $a_G = \alpha R$. El muelle tira con $k\delta = Mg$.
        desarrollo: |
          De las tres, $F_r = \tfrac12 M a_G$ y $Mg - \tfrac12 Ma_G = Ma_G$, luego
          $a_G = \tfrac23 g$ y

          $$
          F_r = \frac{Mg}{3} = 0{,}333\,Mg > f\,N = 0{,}25\,Mg
          $$

          Imposible: **el disco desliza**.

      - tipo: calcular
        titulo: La aceleración del centro con deslizamiento
        pregunta: |
          Ya sabiendo que desliza, y con $F_r = f\,N = 0{,}25\,Mg$, escribe
          $a_G = c\,g$. ¿Cuánto vale $c$?
        respuesta:
          tipo: numero
          valor: '0.75'
          tolerancia: 0.005
          formato: un número, sin unidad
        distractores:
          - valor: '0.6667'
            mensaje: |
              Es la aceleración de la hipótesis de rodadura, la que se acaba de
              descartar. Al deslizar, el rozamiento baja a $Mg/4$ y el centro
              acelera más.
          - valor: '1'
            mensaje: |
              Has olvidado el rozamiento. El muelle tira con $Mg$ y el rozamiento
              se lleva $Mg/4$ en sentido contrario.
        pista: |
          Ahora el rozamiento ya no depende del giro, $N = Mg$ y $F_r = 0{,}25\,Mg$.
          Basta la ecuación de fuerzas horizontal.
        desarrollo: |
          $$
          Mg - 0{,}25\,Mg = M\,a_G \;\Longrightarrow\; a_G = \frac{3}{4}g
          $$

          Y de momentos en $G$, $0{,}25\,MgR = \tfrac12 MR^{2}\alpha$, o sea
          $\alpha = g/(2R)$, que ya **no** cumple $a_G = \alpha R$.

      - tipo: calcular
        titulo: La aceleración del punto A
        pregunta: |
          Escribiendo $a_A = c\,g$, ¿cuánto vale $c$?
        respuesta:
          tipo: numero
          valor: '1.25'
          tolerancia: 0.005
          formato: un número, sin unidad
        distractores:
          - valor: '1.3333'
            mensaje: |
              Es $2a_G$ con la $a_G$ de la rodadura, que además solo valdría si el
              disco rodase, porque solo entonces $A$ va al doble que el centro.
              Aquí desliza y hay que sumar $\alpha R$ aparte.
          - valor: '0.75'
            mensaje: |
              Esa es la aceleración del centro. $A$ está a $R$ por encima, y con
              $\omega = 0$ hay que sumarle el término $\alpha R$ del giro.
          - valor: '1.5'
            mensaje: |
              Has sumado dos veces $a_G$ y una vez de más el giro. La suma correcta
              es $a_A = a_G + \alpha R = \tfrac34 g + \tfrac12 g$.
        pista: |
          $\vec{a}_A = \vec{a}_G + \vec{\alpha}\times\overrightarrow{GA}$, y con
          $\omega = 0$ no hay término normal. $\overrightarrow{GA}$ es vertical y
          mide $R$.
        desarrollo: |
          $$
          a_A = a_G + \alpha R = \frac{3}{4}g + \frac{1}{2}g = \frac{5}{4}g
          $$

          en el sentido en que tira el muelle. Con $g = 9{,}81\ \text{m/s}^{2}$ son
          $12{,}26\ \text{m/s}^{2}$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'El muelle tira del centro con $k\delta = Mg$, y la normal es $N = Mg$ porque no hay aceleración vertical.'
          - texto: 'Suponiendo rodadura salen $a_G = \tfrac23 g$ y $F_r = Mg/3$, mayor que el máximo $f N = Mg/4$, así que el disco desliza.'
          - texto: 'Deslizando, $F_r = 0{,}25 Mg$ y de las ecuaciones de fuerzas y momentos, $a_G = \tfrac34 g$ y $\alpha = g/(2R)$.'
          - texto: 'Componiendo, $a_A = a_G + \alpha R = \tfrac54 g$, ya sin la relación $a_G = \alpha R$, que solo vale rodando.'
          - texto: Como hay deslizamiento, el punto A del disco acelera el doble que el centro.
            trampa: true
            mensaje: |
              El doble es justo lo que pasa **rodando**, cuando $a_G = \alpha R$.
              Aquí las dos son independientes, $a_G = \tfrac34 g$ y
              $\alpha R = \tfrac12 g$, y su suma no es el doble de ninguna.
    resolucion: |
      **Los datos.** El muelle estirado $\delta = Mg/k$ tira del centro con
      $k\delta = Mg$, horizontal. En vertical no hay aceleración, así que
      $N = Mg$ y el rozamiento máximo disponible es $f\,N = 0{,}25\,Mg$.

      **¿Rueda?** Se supone que sí y se comprueba. Con $a_G = \alpha R$,

      $$
      Mg - F_r = M a_G
      \qquad
      F_r R = \tfrac12 MR^{2}\alpha
      \;\Longrightarrow\;
      a_G = \tfrac23 g,\quad F_r = \tfrac13 Mg
      $$

      y $\tfrac13 Mg > \tfrac14 Mg$. La hipótesis es imposible: **el disco
      desliza**. Este paso es el problema entero; saltárselo da un resultado
      razonable y falso.

      **Deslizando.** Ahora el rozamiento sí vale $f\,N$, y las dos ecuaciones se
      desacoplan:

      $$
      a_G = \frac{Mg - 0{,}25Mg}{M} = \frac{3}{4}g
      \qquad
      \alpha = \frac{0{,}25\,MgR}{\tfrac12 MR^{2}} = \frac{g}{2R}
      $$

      **El punto A.** Con $\omega = 0$,

      $$
      \vec{a}_A = \vec{a}_G + \vec{\alpha}\times\overrightarrow{GA}
      \;\Longrightarrow\;
      a_A = \frac{3}{4}g + \frac{1}{2}g = \frac{5}{4}g
      $$

      Que es más que $g$, y no tiene nada de raro: es un punto de un sólido, no un
      cuerpo en caída libre.
  - id: ejma12-col1216-la-barra-con-la-masa-puntual-encima
    titulo: La barra con una masa puntual encima al quitar el tirante
    fuente: Ejercicio 12.16 · Tema 12, «Dinámica del sólido con movimiento plano» · Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado y el curso su resolución, y el desarrollo está contrastado contra los dos.
    nivel: practica
    enunciado: |
      Una barra $AB$ de masa $M$ y longitud $3L$ soporta una masa puntual $M$, no
      existiendo rozamiento entre ambas. El sistema está en equilibrio mediante el
      muelle ideal $AC$ de constante $k$ y la barra rígida $BD$, observándose que
      ésta soporta un esfuerzo de magnitud $Mg$. Determinar:

      a) El valor de la constante $k$ en el equilibrio.

      b) La reacción entre la masa puntual y la barra $AB$ inmediatamente después
      de eliminar la barra $BD$.

