        <text x="74" y="152" font-size="9" fill="var(--faint)">635 mm</text>
        <text x="34" y="92" font-size="9" fill="var(--live)">k = 525 N/m</text>
      </svg>
      <figcaption>

      El extremo **A** corre por la ranura horizontal y **B** por la vertical.
      El ángulo **θ** se mide desde la horizontal, y el muelle está sin
      deformar cuando la barra queda horizontal, es decir con **θ = 0**.
      Dibujada a escala con θ = 50°.

      </figcaption>
      </figure>
    pide: La velocidad angular de la barra y la velocidad de B cuando theta vale cero.
    pasos:
      - tipo: reconocer
        pregunta: |
          En la posición final, $\theta = 0$, ¿dónde está el centro
          instantáneo de rotación de la barra?
        opciones:
          - texto: En A, porque ahí la velocidad va a lo largo de la barra y en B es perpendicular a ella
            correcta: true
            mensaje: |
              Eso es. Con la barra horizontal, $A$ se mueve por la ranura
              horizontal —o sea a lo largo de la barra— y $B$ por la vertical.
              Las dos perpendiculares se cortan en $A$: $v_A = 0$ y
              $v_B = \omega L$.
          - texto: En B, porque es el extremo que baja
            mensaje: |
              Si $B$ fuera el centro instantáneo tendría velocidad nula, y es
              justo el punto cuya velocidad pide el enunciado.
          - texto: En el punto medio de la barra
            mensaje: |
              Eso pasaría si los dos extremos llevasen velocidades iguales y
              opuestas. Aquí en $\theta = 0$ la de $A$ es nula, así que el
              centro instantáneo es $A$.
          - texto: No hay, porque la barra no gira alrededor de ningún punto fijo
            mensaje: |
              El centro instantáneo no tiene que ser un punto fijo ni estar en
              el sólido: existe siempre que el movimiento plano no sea una
              traslación, y va cambiando de sitio.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **la barra sin las ranuras ni el
          muelle, con todas las fuerzas; y aparte, las dos posiciones, con lo
          que se mueve $A$, lo que sube $G$ y las velocidades en la final**.
          Sin escala.
        comprueba:
          - punto: |
              **En $A$, la fuerza del muelle, horizontal, y la de la ranura,
              vertical.**
            porque: |
              El muelle va a lo largo de la ranura horizontal; la ranura no
              roza, así que solo empuja perpendicular a ella.
          - punto: |
              **En $B$, la de la ranura vertical, horizontal.**
            porque: |
              La ranura vertical tampoco roza: solo empuja en horizontal.
          - punto: |
              **El peso, $Mg$, a media barra.**
            porque: |
              La barra es uniforme: su centro de gravedad está en el medio.
          - punto: |
              **Entre las dos posiciones, lo que se mueve $A$ por su ranura y lo
              que sube $G$.**
            porque: |
              Son lo que estira el muelle y lo que cambia la energía potencial
              del peso.
          - punto: |
              **En la posición final, las velocidades de $A$ y de $B$.**
            porque: |
              $A$ va por la ranura horizontal y $B$ por la vertical: de sus
              direcciones sale el centro instantáneo.
        figura: |
