        <text x="156" y="128" font-size="10" text-anchor="start" fill="var(--d2-tinta)">N</text>
        <line x1="156" y1="160" x2="190" y2="160" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="188" y="153" font-size="10" text-anchor="start" fill="var(--d2-tinta)">P<tspan font-size="7.5" dy="2.5">x</tspan></text>
        <line x1="105" y1="100" x2="105" y2="136" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
        <text x="99" y="134" font-size="10" text-anchor="end" fill="var(--flag)">mg</text>
        <line x1="305" y1="100" x2="277.8" y2="79.6" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="274" y="78" font-size="10" text-anchor="end" fill="var(--ink)" font-style="italic">ma<tspan font-size="7.5" dy="2.5">G</tspan></text>
        <circle cx="60" cy="40" r="2.4" fill="var(--ink)"/>
        <text x="53" y="35" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">A</text>
        <circle cx="150" cy="160" r="2.4" fill="var(--ink)"/>
        <text x="142" y="174" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">B</text>
        <circle cx="105" cy="100" r="2.4" fill="var(--ink)"/>
        <text x="112" y="102" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">G</text>
        <circle cx="305" cy="100" r="2.4" fill="var(--ink)"/>
        <text x="298" y="114" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">G</text>
        <text x="227" y="104" font-size="9" text-anchor="middle" fill="var(--faint)">=</text>
      </svg>
      <figcaption>

      La fuerza de AC, horizontal: AC no pesa y va articulada en sus dos extremos. P se dibuja en el sentido positivo de x; el signo dirá hacia dónde va. El suelo no roza: solo empuja hacia arriba.

      </figcaption>
      </figure>

      - **En A**, la fuerza de $AC$, $A_x$, horizontal: $AC$ no pesa y va
        articulada en sus dos extremos.
      - **En B**, la normal, $N$, vertical, y $P_x$, horizontal, dibujada en
        el sentido positivo de $x$.
      - **En G**, el peso, $mg = 6 \cdot 9{,}81 = 58{,}86$ N.
      - **Al lado**, $m a_G$ y $I_G\,\alpha$.

      **2. Incógnitas.** $A_x$, $N$ y $P_x$: tres, con las tres ecuaciones
      del movimiento plano. Antes, la cinemática da $\alpha$ y $a_G$.

      **3. Ecuaciones.** Con $x$ hacia la derecha, $y$ hacia arriba y los
      giros antihorarios positivos; $\sin\beta = 1{,}2/1{,}5 = 0{,}8$ y
      $\cos\beta = 0{,}6$. Al partir del reposo $\omega = 0$, y $A$, que gira
      alrededor del $C$ fijo, solo puede acelerar perpendicular a $AC$: en
      vertical.

      <figure class="figura-examen">
      <svg viewBox="20 12 200 170" role="img" width="300" height="255" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">Las aceleraciones de A, B y G al soltar la barra</title>
        <desc id="dsl-d">La barra AB, de A arriba a la izquierda a B en el suelo. En B, su aceleración, 3 metros por segundo al cuadrado hacia la izquierda. En A, la misma aceleración de B, hacia la izquierda, y desde su punta, la aceleración angular por BA, perpendicular a la barra, hacia arriba y hacia la derecha: la suma es la aceleración de A, vertical hacia arriba. En G, a media barra, su aceleración, hacia la izquierda y hacia arriba.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M110 174 H190" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <line x1="80" y1="50" x2="170" y2="170" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
        <line x1="170" y1="170" x2="134" y2="170" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="152" y="163" font-size="10" text-anchor="middle" fill="var(--ink)" font-style="italic">a<tspan font-size="7.5" dy="2.5">B</tspan></text>
        <line x1="80" y1="50" x2="44" y2="50" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="62" y="63" font-size="10" text-anchor="middle" fill="var(--ink)" font-style="italic">a<tspan font-size="7.5" dy="2.5">B</tspan></text>
        <line x1="44" y1="50" x2="80" y2="23" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="57" y="32.5" font-size="10" text-anchor="end" fill="var(--ink)" font-style="italic">αL</text>
        <line x1="80" y1="50" x2="80" y2="23" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="86" y="38.5" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">a<tspan font-size="7.5" dy="2.5">A</tspan></text>
        <line x1="125" y1="110" x2="107" y2="96.5" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="104" y="95" font-size="10" text-anchor="end" fill="var(--ink)" font-style="italic">a<tspan font-size="7.5" dy="2.5">G</tspan></text>
        <circle cx="80" cy="50" r="2.4" fill="var(--ink)"/>
        <text x="89" y="52" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">A</text>
        <circle cx="170" cy="170" r="2.4" fill="var(--ink)"/>
        <text x="178" y="164" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">B</text>
        <circle cx="125" cy="110" r="2.4" fill="var(--ink)"/>
        <text x="132" y="114" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">G</text>
      </svg>
      <figcaption>

      La aceleración de A tiene que ser vertical: la componente horizontal de alfa por BA anula la de B. Esa componente es alfa por L sen beta, la altura de la barra.

      </figcaption>
      </figure>

      Con $\overrightarrow{BA} = (-0{,}9;\ 1{,}2)$ y $\overrightarrow{BG} = (-0{,}45;\ 0{,}6)$:

      $$
      \vec{a}_A = \vec{a}_B + \vec{\alpha}\times\overrightarrow{BA}
      \;\Longrightarrow\;
      0 = -3 - 1{,}2\,\alpha
      \qquad
      \vec{a}_G = \vec{a}_B + \vec{\alpha}\times\overrightarrow{BG}
      = (-3 - 0{,}6\,\alpha;\ -0{,}45\,\alpha)
      $$

      La dinámica, con $I_G = mL^{2}/12$ y $A$ y $B$ a $(\mp 0{,}45;\ \pm 0{,}6)$
      de $G$:

      $$
      A_x + P_x = m\,a_{Gx}
      \qquad
      N - mg = m\,a_{Gy}
      \qquad
      -0{,}6\,A_x + 0{,}45\,N + 0{,}6\,P_x = I_G\,\alpha
      $$

      **4. Resultados.**

      $$
      \alpha = -3/1{,}2 = -2{,}5\ \text{rad/s}^{2}
      \qquad
      \vec{a}_G = (-1{,}5;\ 1{,}125)\ \text{m/s}^{2}
      \qquad
      I_G = 6 \cdot 1{,}5^{2}/12 = 1{,}125\ \text{kg·m}^{2}
      $$

      $\alpha$ es horaria: la barra se levanta, con $B$ hacia la izquierda.

      $$
      N = 6 \cdot (9{,}81 + 1{,}125) = 65{,}61\ \text{N}
      \qquad
      A_x + P_x = 6 \cdot (-1{,}5) = -9
      $$

      $$
      P_x - A_x = (1{,}125 \cdot (-2{,}5) - 0{,}45 \cdot 65{,}61)/0{,}6 = -53{,}895
      $$

      $$
      P_x = (-9 - 53{,}895)/2 = -31{,}45\ \text{N}
      \qquad
      A_x = (-9 + 53{,}895)/2 = 22{,}45\ \text{N}
      $$

      $P$ vale 31,45 N hacia la izquierda, y $AC$ tira de $A$ hacia $C$ con
      22,45 N: trabaja a tracción.

      **5. Comprobación.** Por momentos en $B$, que no se han usado: la normal
      y $P$ pasan por $B$ y no dan momento, así que la ecuación da $A_x$ sola.
      Respecto de un punto que no es $G$, al par $I_G\,\alpha$ se le suma el
      momento de $m\vec{a}_G$ aplicado en $G$:

      $$
      -1{,}2\,A_x + 0{,}45\,mg = I_G\,\alpha + (\overrightarrow{BG}\times m\vec{a}_G)_z
      $$

      con $0{,}45 \cdot 58{,}86 = 26{,}487$ y
      $(\overrightarrow{BG}\times m\vec{a}_G)_z = -0{,}45 \cdot 6{,}75 + 0{,}6 \cdot 9 = 2{,}3625$:

      $$
      -1{,}2\,A_x + 26{,}487 = -2{,}8125 + 2{,}3625 = -0{,}45
      \qquad
      A_x = 26{,}937/1{,}2 = 22{,}45\ \text{N}
      $$

      La misma, y con ella $P_x = -9 - 22{,}45 = -31{,}45$ N.

      **Lo que dice el resultado.** Con letras salen
      $P = \tfrac38\,mg + \tfrac{25}{48}\,m\,a_B$ y
      $A_x = \tfrac38\,mg + \tfrac{1}{48}\,m\,a_B$. Sin acelerar $B$, las dos
      valdrían $\tfrac38\,mg = 22{,}07$ N: lo que hace falta para que la barra
      no se caiga. Acelerar $B$ a 3 m/s² le cuesta casi todo a $P$, 9,38 N
      más, y a la barra $AC$, solo 0,38. La colección imprime 26,76 y
      17,76 N: salen de escribir $+I_G\alpha$ donde va $-I_G\alpha$, y cada
      valor se mueve $I_G|\alpha|/0{,}6 = 4{,}69$ N.

  - id: ejma12-col1212-las-barras-soldadas-con-dos-eslabones
    titulo: Dos barras soldadas colgadas de dos eslabones paralelos
    fuente: Ejercicio 12.12 · Tema 12, «Dinámica del sólido con movimiento plano» · Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado y el curso su resolución, y el desarrollo está contrastado contra los dos. La resolución del curso da T1 = -2,27 N y T2 = 31,71 N porque dibuja la fuerza del eslabón 1 como tracción y la del 2 como compresión; las dos son de compresión.
    nivel: practica
    antes:
      idea: |
        Un sólido con movimiento plano cumple tres ecuaciones: la resultante
        de las fuerzas es la masa por la aceleración del centro de gravedad,
        y el momento respecto de G es el momento de inercia en G por la
        aceleración angular. Una barra de masa despreciable, articulada en sus
        dos extremos y sin cargas entre ellos, solo puede tirar o empujar a lo
        largo de sí misma. El extremo de una barra que gira alrededor de un
        punto fijo tiene una aceleración perpendicular a la barra y otra a lo
        largo de ella, hacia el punto fijo.
      formula: |
        $$
        \sum\vec{F} = M\vec{a}_G,
        \qquad
        \sum M_G = I_G\,\alpha
        $$

        $$
        a_t = \alpha\,r,
        \qquad
        a_n = \omega^{2} r,
        \qquad
        \vec{a}_P = \vec{a}_G + \vec{\alpha}\times\overrightarrow{GP} - \omega^{2}\,\overrightarrow{GP}
        $$
      reconocer: |
        Antes de calcular se mira cómo están colocados los dos eslabones que
        sujetan la estructura.
    enunciado: |
      Dos barras uniformes $BD$ y $EF$ cada una de 2 kg de masa están unidas
      mediante soldadura (rígidamente) en el punto $E$ y ligadas a dos eslabones
      (1) y (2), sin masa. Calcular las fuerzas sobre las barras (1) y (2) después
      de soltar desde el reposo. $G$ es el centro de gravedad de la estructura.

