    pide: La relación entre las dos aceleraciones angulares y la reacción en A, en función de M, g y L.
    pasos:
      - tipo: reconocer
        pregunta: |
          Justo después de cortar el hilo, ¿cómo se relaciona la aceleración del
          centro del cuadrado con la de $A$?
        opciones:
          - texto: a_G2 = a_A + α2 × r, porque el cuadrado tiene su propia aceleración angular
            correcta: true
            mensaje: |
              Eso es. Son **dos** sólidos con dos giros distintos, unidos solo por
              la articulación $A$. La aceleración de $A$ la pone la barra y el
              cuadrado añade su propio término de giro.
          - texto: El cuadrado gira alrededor de A, así que a_G2 = α2 × r y nada más
            mensaje: |
              Eso valdría si $A$ estuviera fijo, y no lo está: $A$ es el extremo de
              una barra que también gira. Hay que sumar $\vec{a}_A$.
          - texto: El cuadrado y la barra forman un solo sólido, con una única α
            mensaje: |
              Están **articulados** en $A$, no soldados. Si fueran un solo sólido
              las dos aceleraciones angulares coincidirían, y aquí resultan de
              signos opuestos y en relación cuatro tercios.
          - texto: El cuadrado traslada, porque el hilo lo mantenía horizontal
            mensaje: |
              El hilo lo mantenía horizontal mientras existía. Al cortarlo, nada
              impide que gire, y de hecho gira en sentido contrario a la barra.

      - tipo: calcular
        titulo: La relación entre las dos aceleraciones angulares
        pregunta: |
          ¿Cuánto vale el cociente $\alpha_2/\alpha_1$, con su signo?
        respuesta:
          tipo: numero
          valor: '-1.3333'
          tolerancia: 0.005
          formato: un número, con su signo
        distractores:
          - valor: '1'
            mensaje: |
              Uno sería el cociente si los dos cuerpos fueran uno solo, soldados.
              Están articulados, y de hecho giran en sentidos contrarios.
          - valor: '0'
            mensaje: |
              Cero sería el cuadrado trasladando. Solo trasladaría si algo le
              impidiera girar, y al cortar el hilo no queda nada que lo haga.
        pista: |
          Combina la ecuación de momentos de la barra en $O$ con la ecuación
          horizontal del cuadrado. En las dos aparece $A_x$ y en ninguna el peso.
        desarrollo: |
          De la barra, momentos en $O$, $-A_x L = \tfrac13 ML^{2}\alpha_1$; del
          cuadrado, en horizontal, $A_x = M(\alpha_1 + \alpha_2)L$. Igualando,

          $$
          -\frac{\alpha_1}{3} = \alpha_1 + \alpha_2
          \;\Longrightarrow\;
          \frac{\alpha_2}{\alpha_1} = -\frac{4}{3}
          $$

      - tipo: calcular
        titulo: La aceleración angular de la barra
        pregunta: |
          Escribiendo $\alpha_1 = c\,g/L$, ¿cuánto vale $c$?
        respuesta:
          tipo: numero
          valor: '0.3913'
          tolerancia: 0.002
          formato: un número, sin unidad
        distractores:
          - valor: '1.5'
            mensaje: |
              Es la aceleración angular de la barra sola, como un péndulo que se
              suelta desde la horizontal. Aquí la barra está vertical y arrastra un
              cuadrado, que es casi todo el problema.
          - valor: '0.25'
            mensaje: |
              Sale de tratar barra y cuadrado como un único sólido soldado que gira
              alrededor de $O$. Están articulados en $A$, y esa articulación no
              transmite momento.
        pista: |
          Con las seis ecuaciones —tres por sólido— y las dos relaciones
          cinemáticas, quedan $\alpha_1$ y $\alpha_2$. La única fuerza motriz es el
          peso del cuadrado.
        desarrollo: |
          Sustituyendo $\alpha_2 = -\tfrac43\alpha_1$ en las ecuaciones vertical y
          de momentos del cuadrado,

          $$
          \alpha_1 = \frac{9}{23}\frac{g}{L}
          \qquad
          \alpha_2 = -\frac{12}{23}\frac{g}{L}
          $$

      - tipo: calcular
        titulo: La componente vertical de la reacción en A
        pregunta: |
          Escribiendo esa componente como $|A_y| = c\,Mg$, ¿cuánto vale $c$?
        respuesta:
          tipo: numero
          valor: '0.4783'
          tolerancia: 0.002
          formato: un número, sin unidad
        distractores:
          - valor: '1'
            mensaje: |
              Sería el peso entero del cuadrado, que es lo que sostendría la barra
              si el cuadrado no cayera. Está cayendo, con
              $a_{G2y} = -\tfrac{12}{23}g$, y la barra sostiene solo la diferencia.
          - valor: '0.5217'
            mensaje: |
              Eso es $M\,|a_{G2y}|$, la resultante vertical que necesita el
              cuadrado, no la reacción. La reacción es $M(g + a_{G2y})$, con
              $a_{G2y}$ negativa.
        pista: |
          El centro del cuadrado baja con $a_{G2y} = \alpha_2 L$. Después,
          $A_y - Mg = M\,a_{G2y}$.
        desarrollo: |
          $$
          a_{G2y} = \alpha_2 L = -\frac{12}{23}g
          \qquad
          A_y = M\left(g - \frac{12}{23}g\right) = \frac{11}{23}Mg
          $$

          hacia arriba sobre el cuadrado, y $A_x = \tfrac{3}{23}Mg$ hacia la
          izquierda. La colección los imprime como $3Mg/23$ y $-11Mg/23$, que son
          los mismos módulos con las flechas dibujadas al revés.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Son dos sólidos con dos giros, unidos en A; con $\omega = 0$, $\vec{a}_A = \alpha_1 L\,\hat{\imath}$ y $\vec{a}_{G2} = \vec{a}_A + \vec{\alpha}_2\times\overrightarrow{AG_2}$.'
          - texto: 'Momentos de la barra en O y ecuación horizontal del cuadrado, que comparten $A_x$, y sale $\alpha_2/\alpha_1 = -4/3$.'
          - texto: 'Con las otras dos ecuaciones del cuadrado se cierra el sistema, $\alpha_1 = 9g/(23L)$ y $\alpha_2 = -12g/(23L)$.'
          - texto: 'El centro del cuadrado baja con $\tfrac{12}{23}g$, y de su ecuación vertical $|A_y| = \tfrac{11}{23}Mg$, con $|A_x| = \tfrac{3}{23}Mg$.'
          - texto: Al cortar el hilo el cuadrado cae libremente, así que su centro acelera con g y la reacción en A es nula.
            trampa: true
            mensaje: |
              Si cayera libre no habría nada que calcular. El cuadrado sigue
              colgado de la barra por $A$, baja con algo más de la mitad de $g$, y
              la reacción vale casi medio peso.
    resolucion: |
      **Los dos sólidos.** Barra y cuadrado están **articulados** en $A$, así que
      cada uno tiene su aceleración angular. Con $\omega_1 = \omega_2 = 0$ justo
      después de cortar,

      $$
      \vec{a}_A = \alpha_1 L\,\hat{\imath}
      \qquad
      \vec{a}_{G2} = \vec{a}_A + \vec{\alpha}_2\times\overrightarrow{AG_2}
      = (\alpha_1 + \alpha_2)L\,\hat{\imath} + \alpha_2 L\,\hat{\jmath}
      $$

      porque $\overrightarrow{AG_2} = (L,\,-L)$.

      **La relación entre los giros.** Momentos de la barra en el punto fijo $O$ y
      ecuación horizontal del cuadrado:

      $$
      -A_x L = \frac{1}{3}ML^{2}\alpha_1
      \qquad
      A_x = M(\alpha_1 + \alpha_2)L
      \;\Longrightarrow\;
      \frac{\alpha_2}{\alpha_1} = -\frac{4}{3}
      $$

      **Los valores.** Con la vertical del cuadrado, $A_y - Mg = M\alpha_2 L$, y
      sus momentos en $G_2$, $-A_x L - A_y L = \tfrac23 ML^{2}\alpha_2$,

      $$
      \alpha_1 = \frac{9g}{23L}
      \qquad
      \alpha_2 = -\frac{12g}{23L}
      $$

      **La reacción.** El centro del cuadrado baja con $\tfrac{12}{23}g$ y se
      desplaza a la izquierda con $\tfrac{3}{23}g$, así que la barra tira de él con

      $$
      A_y = \frac{11}{23}Mg \ \text{hacia arriba}
      \qquad
      A_x = \frac{3}{23}Mg \ \text{hacia la izquierda}
      $$

      Los mismos módulos que imprime la colección, con los signos referidos a las
      flechas de su diagrama.

  - id: ejma12-col1220-el-disco-la-barra-y-el-resorte
    titulo: Energía del disco con barra y resorte tras un cuarto de vuelta
    fuente: Ejercicio 12.20 · Tema 12, «Dinámica del sólido con movimiento plano» · Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado y el curso su resolución, y el desarrollo está contrastado contra los dos. El valor impreso en la colección para el apartado b) no sale de los datos; el bueno es el de la resolución del curso, que es el que se publica aquí.
    nivel: practica
    enunciado: |
      La figura muestra el estado inicial del sistema compuesto por:

      - un disco de masa $M = 10$ kg y radio $R = 0.5$ m, que gira con rotación
        $\omega = 5\ \text{rad/s}$ en sentido horario alrededor de su punto fijo
        $O$.

      - una barra $AB$ de masa $M = 10$ kg y longitud $L = 2R$. Esta barra está
        articulada al disco en el punto $A$ y a una deslizadera sin masa que se
        desplaza verticalmente en $B$.

      - un resorte ideal (Longitud sin fuerza aplicada = 0) cuya constante es
        $k = 100$ N/m, atado entre el suelo y el punto diametralmente opuesto al
        punto $A$.

      Calcular:

      a) Energía cinética del sistema en el estado inicial.

      b) Valor de $\omega$ cuando el disco ha girado 90º en sentido horario.

