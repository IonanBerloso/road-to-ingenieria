        <text x="196" y="74" font-size="11" font-weight="600" fill="var(--ink)">B</text>
        <text x="196" y="180" font-size="11" font-weight="600" fill="var(--ink)">C</text>
        <text x="88" y="180" font-size="11" font-weight="600" fill="var(--ink)">D</text>
