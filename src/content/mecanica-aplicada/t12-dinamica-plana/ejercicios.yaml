      - tipo: calcular
        titulo: La velocidad angular del disco con la barra vertical
        pregunta: |
          Escribiendo el resultado como
          $\omega_d = \dfrac{\sqrt{c\,gL}}{R}$, ¿cuánto vale $c$?
        respuesta:
          tipo: numero
          valor: '0.2727'
          tolerancia: 0.002
          formato: un número, sin unidad
        distractores:
          - valor: '1.1818'
            mensaje: |
              Es $13/11$, el valor que encuadra la resolución del curso. Sus
              propias ecuaciones dan $3/11$, y el resultado impreso en la
              colección también; el $13$ es un desliz al despejar.
          - valor: '0.3333'
            mensaje: |
              Has contado solo la energía cinética del disco,
              $\tfrac34 MR^{2}\omega^{2}$. La barra también se mueve, y suma
              $\tfrac16 MR^{2}\omega^{2}$ más.
          - valor: '0.375'
            mensaje: |
              Te falta el término de rotación del disco,
              $\tfrac12\left(\tfrac12 MR^{2}\right)\omega^{2}$. El disco rueda, así
              que tiene traslación **y** giro.
        pista: |
          Solo baja el centro de la barra, de $\tfrac34 L$ a $\tfrac12 L$ sobre el
          nivel final de $A$; el centro del disco no cambia de altura. Y al final,
          $A$ es el centro instantáneo de la barra.
        desarrollo: |
          La energía liberada es $Mg\,L/4$. Al final, con $v_B = \omega R$,
          $\omega_{\text{barra}} = \omega R/L$ y $v_C = \omega R/2$,

          $$
          T = \frac{3}{4}MR^{2}\omega^{2} + \frac{1}{6}MR^{2}\omega^{2}
          = \frac{11}{12}MR^{2}\omega^{2}
          $$

          $$
          \frac{MgL}{4} = \frac{11}{12}MR^{2}\omega^{2}
          \;\Longrightarrow\;
          \omega_d = \sqrt{\frac{3gL}{11R^{2}}}
          $$

      - tipo: calcular
        titulo: La aceleración angular del disco al empezar
        pregunta: |
          Escribiendo $\alpha_d = c\,g/R$, ¿cuánto vale $c$ en el instante
          inicial, con la barra a 60º?
        respuesta:
          tipo: numero
          valor: '0.3057'
          tolerancia: 0.002
          formato: un número, sin unidad
        distractores:
          - valor: '0.4724'
            mensaje: |
              Sale de tomar momentos del disco en el punto de contacto escribiendo
              $\sum M_C = I_G\alpha$, sin sumar el momento de $M\vec{a}_B$. Ahí la
              inercia que toca es $I_G + MR^{2}$.
          - valor: '0.3712'
            mensaje: |
              Sale de olvidar la inercia de giro del disco,
              $\tfrac12 MR^{2}$, y tratarlo como una masa que solo se traslada. El
              disco rueda y su giro cuenta.
        pista: |
          Con $\omega = 0$, $a_B = \alpha_d R$ horizontal y la condición
          $a_{Ax} = 0$ da $\alpha_{\text{barra}} = 2R\,\alpha_d/L$. Después, tres
          ecuaciones para la barra y tres para el disco.
        desarrollo: |
          De la cinemática, $\vec{a}_C = \alpha_d R\left(-\tfrac12,\ -\tfrac{\sqrt3}{2}\right)$.
          Con las tres ecuaciones de cada sólido y la corredera sin masa —que solo
          transmite fuerza horizontal—, el sistema de seis ecuaciones da

          $$
          \alpha_d = \frac{3\sqrt{3}}{17}\,\frac{g}{R} = 0{,}3057\,\frac{g}{R}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Como no hay rozamiento en la corredera ni deslizamiento en el disco, no hay trabajo no conservativo y vale $T_1 + V_1 = T_2 + V_2$.'
          - texto: 'De 60º a la vertical solo baja el centro de la barra, un cuarto de L; el centro del disco se mueve en horizontal y no cambia de altura.'
          - texto: 'Con la barra vertical, A es el centro instantáneo de la barra, así que $v_B = \omega R$, $\omega_{\text{barra}} = \omega R/L$ y $T = \tfrac{11}{12}MR^{2}\omega^{2}$.'
          - texto: 'Para el apartado c) se plantean las tres ecuaciones de cada sólido con $\omega = 0$ y las relaciones cinemáticas, y sale $\alpha_d = 3\sqrt{3}g/(17R)$.'
          - texto: Al rodar sin deslizar, el rozamiento del suelo hace un trabajo negativo que hay que restar de la energía.
            trampa: true
            mensaje: |
              El rozamiento sobre un disco que rueda sin deslizar **no trabaja**,
              porque su punto de aplicación tiene velocidad nula. Por eso se puede
              usar la conservación de la energía aunque haya rozamiento.
    resolucion: |
      **1. Sólidos libres y posiciones.** Es un problema de energía, para el
      apartado a), y de dinámica de dos sólidos con movimiento plano en un
      instante, para el c). El dibujo del apartado b) lleva la barra y el
      disco por separado, en la posición inicial, y al lado, lo que tienen
      que dar sus fuerzas.

