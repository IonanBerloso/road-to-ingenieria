        <desc id="ma12c7-d">Un disco de 125 milimetros de radio gira sobre un pasador fijo situado en su centro A. De A sale hacia la derecha la varilla AB, de 500 milimetros, soldada al disco y dibujada horizontal. Del punto de la periferia diametralmente opuesto a B baja un muelle de 80 newtons por metro hasta un anclaje fijo en el suelo.</desc>
        <circle cx="110" cy="90" r="37.5" fill="var(--faint)" fill-opacity="0.22" stroke="var(--ink)" stroke-width="1.3"/>
        <rect x="110" y="86" width="150" height="8" fill="var(--faint)" fill-opacity="0.35" stroke="var(--ink)" stroke-width="1.2"/>
