          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <line x1="50" y1="100" x2="210" y2="100" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
        <line x1="290" y1="100" x2="450" y2="100" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
        <path d="M50 74 H130 M50 70 V78 M130 70 V78" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="90" y="70" font-size="9" text-anchor="middle" fill="var(--faint)">L/2</text>
        <path d="M50 58 H210 M50 54 V62 M210 54 V62" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="130" y="54" font-size="9" text-anchor="middle" fill="var(--faint)">L</text>
        <path d="M355 94.5 A16 16 0 0 1 385 94.5" fill="none" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="370" y="78" font-size="10" text-anchor="middle" fill="var(--ink)" font-style="italic">I<tspan font-size="7.5" dy="2.5">G</tspan><tspan dy="-2.5">α</tspan></text>
        <line x1="10" y1="100" x2="44" y2="100" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="14" y="93" font-size="10" text-anchor="start" fill="var(--d2-tinta)">O<tspan font-size="7.5" dy="2.5">x</tspan></text>
        <line x1="50" y1="140" x2="50" y2="106" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="57" y="138" font-size="10" text-anchor="start" fill="var(--d2-tinta)">O<tspan font-size="7.5" dy="2.5">y</tspan></text>
        <line x1="130" y1="100" x2="130" y2="138" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
        <text x="136" y="134" font-size="10" text-anchor="start" fill="var(--flag)">Mg</text>
        <line x1="370" y1="100" x2="370" y2="138" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="376" y="134" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">Ma<tspan font-size="7.5" dy="2.5">G</tspan></text>
        <circle cx="50" cy="100" r="2.4" fill="var(--ink)"/>
        <text x="43" y="115" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">O</text>
        <circle cx="130" cy="100" r="2.4" fill="var(--ink)"/>
        <text x="125" y="114" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">G</text>
        <circle cx="290" cy="100" r="2.4" fill="var(--ink)"/>
        <text x="290" y="115" font-size="10" text-anchor="middle" font-weight="700" fill="var(--ink)">O</text>
        <circle cx="370" cy="100" r="2.4" fill="var(--ink)"/>
        <text x="365" y="114" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">G</text>
        <text x="250" y="104" font-size="9" text-anchor="middle" fill="var(--faint)">=</text>
      </svg>
      <figcaption>

      A la izquierda, el sólido libre, con las dos componentes de la reacción en su sentido positivo; a la derecha, lo que tienen que dar sus fuerzas. Al soltarla no hay velocidad angular: G solo tiene la aceleración perpendicular a OG, vertical.

      </figcaption>
      </figure>

      - **En O**, la reacción, $O_x$ y $O_y$.
      - **En G**, el peso, $Mg = 3 \cdot 9{,}8 = 29{,}4$ N, a $L/2 = 0{,}5$ m
        de $O$.
      - **Al lado**, $M a_G$, vertical, y el par $I_G\,\alpha$, en el sentido
        en que cae.

      **2. Incógnitas.** $\alpha$, $O_x$ y $O_y$: tres, con las tres
      ecuaciones del movimiento plano. La aceleración de $G$ la da la
      cinemática a partir de $\alpha$.

      **3. Ecuaciones.** Al soltarla, $\omega = 0$: $G$ solo tiene la
      aceleración tangente, $a_G = \alpha L/2$, vertical y hacia abajo, y la
      que va hacia $O$, $\omega^{2} L/2$, es nula. Momentos en $O$, donde la
      reacción no da momento; fuera de $G$ se suma el momento de $M a_G$, que
      está a $L/2$ de $O$:

      $$
      M g \frac{L}{2} = I_G\,\alpha + M a_G\,\frac{L}{2} = \left(\frac{ML^{2}}{12} + \frac{ML^{2}}{4}\right)\alpha = \frac{ML^{2}}{3}\,\alpha
      $$

      Que es la del punto fijo, $M g L/2 = I_O\,\alpha$. Y las de fuerzas,
      con $y$ hacia arriba:

      $$
      O_x = 0
      \qquad
      O_y - M g = -M a_G
      $$

      **4. Resultados.**

      $$
      \alpha = \frac{3g}{2L} = 14{,}7\ \text{rad/s}^{2}
      \qquad
      a_G = 14{,}7 \cdot 0{,}5 = 7{,}35\ \text{m/s}^{2}
      \qquad
      O_y = 3\,(9{,}8 - 7{,}35) = 7{,}35\ \text{N}
      \qquad
      O_x = 0
      $$

      **5. Comprobación.** Por momentos en $G$, que no se han usado: allí el
      peso no da momento, y solo lo da la reacción, a $L/2$:

      $$
      O_y\,\frac{L}{2} = \frac{ML^{2}}{12}\,\alpha
      \;\Rightarrow\;
      O_y = \frac{M L\,\alpha}{6} = 3 \cdot 1 \cdot 14{,}7/6 = 7{,}35\ \text{N}
      $$

      La misma, y hacia arriba: respecto de $G$, el peso no da momento, y es
      la reacción la que hace girar la barra.

      **Lo que dice el resultado.** En el instante de soltarla, la
      articulación sostiene solo la cuarta parte del peso: $G$ cae con tres
      cuartos de $g$. Y el extremo libre arranca con
      $\alpha L = 14{,}7\ \text{m/s}^{2}$, más que $g$: una moneda puesta en
      ese extremo se quedaría atrás, separándose de la barra.

  - id: ejma12-col121-el-engranaje-que-rueda-por-la-pista
    titulo: El engranaje que rueda por la pista dentada
    fuente: >-
      Ejercicio 12.1 · Tema 12, «Dinámica del sólido con movimiento plano» ·
      Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección publica el
      resultado, contra el que está contrastado el desarrollo, y se ha
      comprobado también con la resolución oficial del profesor. Con g = 9,81
      m/s2 la cuenta da 1,543 m/s; la colección imprime 1,542 y la resolución
      oficial, 1,543.
    nivel: practica
    antes:
      idea: |
        Un sólido con movimiento plano cumple tres ecuaciones: la resultante
        de las fuerzas es la masa por la aceleración de G, y el momento
        respecto de G es el momento de inercia en G por la aceleración
        angular. Entre dos posiciones, el trabajo de todas las fuerzas es lo
        que cambia la energía cinética; el de los pesos se escribe como
        pérdida de energía potencial. Una fuerza no trabaja si su punto de
        aplicación tiene velocidad nula. La energía cinética de un sólido con
        movimiento plano es la de traslación con G más la de giro alrededor
        de G.
      formula: |
        $$
        \sum\vec{F} = M\vec{a}_G,
        \qquad
        \sum M_G = I_G\,\alpha,
        \qquad
        T_0 + V_0 + W_{nc} = T + V
        $$

        $$
        T = \tfrac12 M v_G^{2} + \tfrac12 I_G\,\omega^{2},
        \qquad
        I_G = M\,r_G^{2},
        \qquad
        \vec{v}_E = \vec{v}_B + \vec{\omega}\times\overrightarrow{BE}
        $$
      reconocer: |
        Antes de calcular se mira qué relaciona la pregunta y qué fuerzas
        actúan sobre el sistema.
    enunciado: |
      El engranaje (2) de radio $L/2$ ($=BE$) tiene una masa de 3,2 kg y un
      radio de giro central de 60 mm. Rueda sobre la pista dentada fija (3) y
      está articulado en su centro $B$ a la barra (1), de masa 2,4 kg y
      longitud $L$ = 160 mm. Si el sistema se suelta del reposo en la posición
      mostrada, calcular la velocidad del punto $B$ después de que la barra
      $AB$ haya girado 90º.

      <figure>
      <svg viewBox="0 0 300 262" role="img" width="300" height="262" aria-labelledby="ma12c1-t ma12c1-d">
        <title id="ma12c1-t">El engranaje articulado a la barra AB, rodando por la pista dentada fija</title>
        <desc id="ma12c1-d">La barra AB, de 160 milimetros, esta articulada en A a un apoyo fijo del suelo y en B al centro del engranaje (2), de radio 80 milimetros. El engranaje engrana por su derecha con la pista dentada fija (3), un arco centrado en A y de radio 240 milimetros; el contacto es el punto E, alineado con A y con B. En la posicion dibujada la barra esta horizontal.</desc>
        <path d="M247.5 19.8 A235 235 0 0 1 247.5 240.2 L230.7 231.4 A216 216 0 0 0 230.7 28.6 Z" fill="var(--faint)" fill-opacity="0.35" stroke="var(--ink)" stroke-width="1.2"/>
        <circle cx="184" cy="130" r="72" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.3"/>
        <line x1="40" y1="130" x2="184" y2="130" stroke="var(--ink)" stroke-width="4"/>
        <circle cx="40" cy="130" r="4.5" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
        <circle cx="184" cy="130" r="3.5" fill="var(--ink)"/>
        <line x1="22" y1="138" x2="58" y2="138" stroke="var(--ink)" stroke-width="1.1"/>
        <path d="M28 138 L22 146 M36 138 L30 146 M44 138 L38 146 M52 138 L46 146" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <circle cx="256" cy="130" r="3" fill="var(--flag)"/>
        <text x="34" y="122" font-size="10" text-anchor="end" fill="var(--ink)">A</text>
        <text x="177" y="121" font-size="10" text-anchor="end" fill="var(--ink)">B</text>
        <text x="250" y="152" font-size="10" fill="var(--flag)">E</text>
        <text x="112" y="122" font-size="9.5" text-anchor="middle" fill="var(--ink)">(1)</text>
        <text x="184" y="82" font-size="9.5" text-anchor="middle" fill="var(--ink)">(2)</text>
        <text x="215" y="45" font-size="9.5" text-anchor="middle" fill="var(--ink)">(3)</text>
        <line x1="40" y1="228" x2="184" y2="228" stroke="var(--faint)" stroke-width="0.9"/>
