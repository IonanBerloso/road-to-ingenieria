    pide: La energía cinética inicial en julios y la velocidad angular tras un cuarto de vuelta.
    pasos:
      - tipo: reconocer
        pregunta: |
          El resorte tiene longitud natural nula. ¿Cómo se escribe su energía
          elástica en cada posición?
        opciones:
          - texto: Media k por la longitud del resorte al cuadrado, y esa longitud cambia al girar el disco
            correcta: true
            mensaje: |
              Eso es. Con longitud natural nula la deformación **es** la longitud,
              así que $V_e = \tfrac12 k\,l^{2}$. Y el extremo de arriba está en el
              disco, así que al girar 90º pasa de $R$ a $\sqrt{5}R$ y la energía se
              multiplica por cinco.
          - texto: Media k por el cuadrado de lo que se estira respecto de su longitud inicial
            mensaje: |
              La longitud inicial no es la natural. La natural es cero, y el
              resorte ya está estirado $R$ en el estado inicial; esa energía
              también cuenta.
          - texto: No cambia, porque el disco gira alrededor de su centro y el resorte sigue igual
            mensaje: |
              El resorte no está atado al centro, sino al punto diametralmente
              opuesto a $A$, que es un punto **del disco** y se mueve con él. Al
              girar 90º ese punto se va a un lado y el resorte se alarga.
          - texto: Media k por R al cuadrado en las dos posiciones, porque el radio no cambia
            mensaje: |
              El radio no cambia, pero la longitud del resorte sí. Va del suelo a
              un punto de la periferia, y ese punto se desplaza al girar.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **las dos posiciones, la inicial y
          tras girar el disco 90° en sentido horario, con la altura del centro
          de la barra, el resorte y las velocidades de $A$ y de $B$ en cada
          una**. Sin escala.
        comprueba:
          - punto: |
              **En la segunda, $A$ a la derecha de $O$ y a su altura, y la barra
              inclinada hasta $B$, que sigue en la guía.**
            porque: |
              Al girar 90° en sentido horario, el punto más alto del disco baja
              al lateral; $B$ solo se mueve en vertical, y la barra mide $2R$.
          - punto: |
              **La altura del centro de la barra sobre el suelo, en las dos.**
            porque: |
              El centro del disco no se mueve: el único peso que cambia de
              altura es el de la barra.
          - punto: |
              **El resorte, del suelo al punto del disco opuesto a $A$, en las
              dos posiciones.**
            porque: |
              Su energía depende de lo que mide, y lo que mide, de dónde está
              ese punto.
          - punto: |
              **En cada una, $\vec{v}_A$ perpendicular a $OA$ y $\vec{v}_B$
              vertical.**
            porque: |
              Con las dos direcciones sale el centro instantáneo de la barra, y
              con él su energía cinética.
        figura: |
          <svg viewBox="0 62 430 214" role="img" width="430" height="214" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">Las dos posiciones del disco, la barra y el resorte, con sus velocidades</title>
            <desc id="dsl-d">a) Al empezar: el disco, con centro fijo O dos radios por encima del suelo; A, su punto más alto; la barra AB, vertical, hasta la deslizadera B, en una guía vertical; G, el centro de la barra, cuatro radios por encima del suelo. El resorte va del punto más bajo del disco al suelo y mide R. A va hacia la derecha con omega por R; G, con la mitad; B está parado: es el centro instantáneo de la barra. b) Tras girar el disco 90 grados en sentido horario: A, a la derecha de O y a su altura; la barra, a 30 grados de la vertical, hasta B, en la misma guía; G, a dos radios más raíz de tres medios de radio sobre el suelo. El resorte va del punto del disco a la izquierda de O al punto del suelo bajo O, y mide raíz de cinco por R. A y B van hacia abajo, los dos con omega por R: la barra no gira.</desc>
