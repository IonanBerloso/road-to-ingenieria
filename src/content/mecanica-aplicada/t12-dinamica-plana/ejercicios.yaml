        <text x="355" y="71" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">G</text>
        <circle cx="380" cy="196" r="2.4" fill="var(--ink)"/>
        <text x="374" y="211" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">B</text>
        <text x="268" y="60" font-size="9" text-anchor="middle" fill="var(--faint)">=</text>
        <text x="268" y="200" font-size="9" text-anchor="middle" fill="var(--faint)">=</text>
        <text x="162" y="118" font-size="9" text-anchor="middle" fill="var(--faint)">(2)</text>
        <text x="380" y="118" font-size="9" text-anchor="middle" fill="var(--faint)">(2)</text>
        <text x="0" y="34" font-size="11" font-weight="700" fill="var(--ink)">a)</text>
        <text x="0" y="130" font-size="11" font-weight="700" fill="var(--ink)">b)</text>
      </svg>
      <figcaption>

      a) La barra y b) el engranaje (2), cada uno con lo que tienen que dar sus fuerzas, en el sentido en que cae el sistema. Lo que se hacen en B es lo mismo con el sentido cambiado. El engranaje (1) está fijo: no se dibuja aparte.

      </figcaption>
      </figure>

      - **La barra**: en $A$, $A_x$ y $A_y$; en $B$, $B_x$ y $B_y$, lo que le
        hace el engranaje; y su peso, $m_3 g = 29{,}43$ N, en su centro $G$, a
        $L/2$ de $A$.
      - **El engranaje (2)**: en $B$, lo mismo con el sentido cambiado; su
        peso, $m_2 g = 49{,}05$ N; y en el contacto $P$ con el (1), a $L/2$ de
        $B$, la fuerza de los dientes, $F_t$ tangente y $N$ en la línea de
        centros.

      **2. Incógnitas.** $\alpha_3$, de la que salen $\alpha_2$ y las
      aceleraciones; y $A_y$, $B_y$ y $F_t$: cuatro, con las dos ecuaciones
      verticales y las dos de momentos. En horizontal no acelera nada: $A_x$,
      $B_x$ y $N$ se equilibran entre sí y no entran en lo que se pide.

      **3. Ecuaciones.** La cinemática. Al soltarlo no hay velocidad, así que
      cada punto solo tiene aceleración tangente, proporcional a su distancia
      al centro de giro. La barra gira alrededor de $A$; el engranaje, sobre
      el punto de contacto $P$, que no se mueve:

      <figure class="figura-examen">
      <svg viewBox="-24 -6 300 200" role="img" width="450" height="300" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">Las aceleraciones tangentes en el arranque, en la barra y en el engranaje (2)</title>
        <desc id="dsl-d">La línea de centros, horizontal, con A a la izquierda, el punto de contacto P en el medio, que es también el centro de la barra, B a la derecha y Q, el punto del engranaje (2) más alejado. Los dos engranajes, a trazos. Flechas verticales hacia abajo: en P, la del centro de la barra, alfa tres por L medios; en B, alfa tres por L; en Q, el doble. Dos rectas a trazos: la de la barra, desde A, que pasa por la punta de B; y la del engranaje, desde P, que pasa por la punta de B y por la de Q, con el doble de pendiente.</desc>
