    pide: La fuerza P y la fuerza que la barra AC ejerce sobre AB, en newtons.
    pasos:
      - tipo: reconocer
        pregunta: |
          La barra $AC$ no pesa y está articulada en sus dos extremos, con $C$
          fijo. ¿Qué dos cosas impone eso?
        opciones:
          - texto: Que su fuerza sobre AB es horizontal, y que la aceleración de A es vertical
            correcta: true
            mensaje: |
              Eso es. Al ser una barra de dos fuerzas, la fuerza que transmite va
              en su propia dirección, que aquí es horizontal. Y como $A$ describe
              una circunferencia alrededor del $C$ fijo y se parte del reposo, su
              aceleración es perpendicular a $AC$, o sea vertical.
          - texto: Que no ejerce ninguna fuerza sobre AB, porque no tiene peso
            mensaje: |
              No pesar no es no transmitir. Una barra sin masa transmite una
              fuerza perfectamente; lo que su falta de masa impone es que esa
              fuerza vaya justo en la dirección de la barra.
          - texto: Que en A hay una reacción con dos componentes, como en cualquier articulación
            mensaje: |
              Sería así si $AC$ tuviera masa o cargas por el camino. Al ser una
              barra de dos fuerzas, la componente vertical en $A$ es nula y queda
              una sola incógnita.
          - texto: Que el punto A está fijo, porque C lo está
            mensaje: |
              $C$ es fijo, pero $A$ no. $A$ gira alrededor de $C$, y por eso su
              aceleración no es cero, sino perpendicular a $AC$.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **la barra $AB$ sin la barra $AC$
          ni el suelo, con todas las fuerzas que actúan sobre ella, y al lado,
          lo que tienen que dar esas fuerzas**. Sin escala.
        comprueba:
          - punto: |
              **En $A$, la fuerza de la barra $AC$, horizontal.**
            porque: |
              $AC$ no pesa y va articulada en sus dos extremos, sin cargas entre
              ellos: solo tira o empuja a lo largo de sí misma.
          - punto: |
              **En $B$, la normal del suelo, vertical, y la fuerza $P$,
              horizontal.**
            porque: |
              El suelo no roza: solo empuja hacia arriba. $P$ es la fuerza del
              enunciado; si se dibuja en el sentido positivo, el signo dirá
              hacia dónde va.
          - punto: |
              **El peso, $mg$, a media barra.**
            porque: |
              La barra es uniforme: su centro de gravedad está en el medio.
          - punto: |
              **Al lado, $m a_G$ en $G$ y el par $I_G\,\alpha$.**
            porque: |
              Es lo que tienen que dar las fuerzas; la cinemática, con $A$ que
              solo puede acelerar en vertical, da $\alpha$ y $a_G$.
        figura: |
          <svg viewBox="-10 12 400 196" role="img" width="400" height="196" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">Sólido libre de la barra AB y lo que tienen que dar sus fuerzas</title>
