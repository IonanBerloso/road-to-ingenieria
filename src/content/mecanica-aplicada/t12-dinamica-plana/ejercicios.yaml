      - tipo: calcular
        titulo: La aceleración angular de la biela
        pregunta: |
          En esta posición $A$ es el punto más alto del disco y $\omega_3 = 0$.
          ¿Cuánto vale $\alpha_3$, en rad/s²?
        respuesta:
          tipo: numero
          valor: '3.0792'
          tolerancia: 0.01
          formato: un número, en rad/s²
        distractores:
          - valor: '0'
            mensaje: |
              $\omega_3 = 0$ no implica $\alpha_3 = 0$. La biela está parada en
              giro pero su velocidad angular está cambiando, y lo que la obliga a
              cambiar es el término normal $\omega_2^{2}R$ de la aceleración de
              $A$.
          - valor: '5.3333'
            mensaje: |
              Has proyectado con el seno de 30 grados donde va el coseno. La
              componente vertical de
              $\vec{\alpha}_3\times\overrightarrow{AB}$ sale de la coordenada
              **horizontal** de $\overrightarrow{AB}$, que es $L\cos 30^{\circ}$.
        pista: |
          $\vec{a}_A$ tiene una parte tangencial $\alpha_2 R$ horizontal y una
          normal $\omega_2^{2}R$ hacia $O$, o sea vertical. Impón que
          $a_{By} = 0$, porque la mesa solo se mueve en horizontal.
        desarrollo: |
          $$
          a_{By} = -\omega_2^{2}R + \alpha_3\,L\cos 30^{\circ} = 0
          \;\Longrightarrow\;
          \alpha_3 = \frac{2\sqrt{3}\,R}{3L}\,\omega_2^{2}
          = 3{,}079\ \text{rad/s}^{2}
          $$

      - tipo: calcular
        titulo: El par motor
        pregunta: |
          ¿Cuánto vale el par motor $T$ sobre el disco, en N·m?
        respuesta:
          tipo: numero
          valor: '26.55'
          tolerancia: 0.05
          formato: un número, en N·m
        distractores:
          - valor: '5'
            mensaje: |
              Es solo $\tfrac12 MR^{2}\alpha_2$, el par que se lleva la inercia del
              propio disco. Falta el que hace falta para tirar de la biela y
              acelerar la mesa, que es más de cuatro veces mayor.
          - valor: '21.55'
            mensaje: |
              Es solo el término de la biela, $F_3\tfrac{\sqrt3}{2}R$. Al disco hay
              que darle además el par de su propia inercia,
              $\tfrac12 MR^{2}\alpha_2 = 5$ N·m.
          - valor: '526.5'
            mensaje: |
              Has metido la fuerza de la muela en la ecuación horizontal de la
              mesa, como si frenara su avance. $F$ es vertical y la mesa no roza
              con el suelo, así que no interviene en el par.
        pista: |
          De la mesa, $F_3\cos 30^{\circ} = m_4\,a_B$ con
          $a_B = \alpha_2 R + \tfrac{\sqrt3}{3}\omega_2^{2}R$. Después, momentos en
          $O$ para el disco.
        desarrollo: |
          $$
          a_B = \alpha_2 R + \frac{\sqrt3}{3}\omega_2^{2}R = 8{,}62\ \text{m/s}^{2}
          \qquad
          F_3 = \frac{m_4\,a_B}{\cos 30^{\circ}} = 49{,}76\ \text{N}
          $$

          $$
          T = \frac{1}{2}MR^{2}\alpha_2 + F_3\,\frac{\sqrt3}{2}R
          = MR^{2}\left(\frac{3\alpha_2}{2} + \frac{\sqrt3\,\omega_2^{2}}{3}\right)
          = 26{,}55\ \text{N}\cdot\text{m}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Como B solo se mueve en horizontal y A es el punto más alto del disco, de $v_{By} = 0$ sale $\omega_3 = 0$.'
          - texto: 'De $a_{By} = 0$, con la parte normal $\omega_2^{2}R$ de la aceleración de A, sale $\alpha_3 = 2\sqrt{3}R\,\omega_2^{2}/(3L) = 3{,}08$ rad/s².'
          - texto: 'La biela no pesa y se articula en sus dos extremos, así que su fuerza va en su dirección; de la horizontal de la mesa, $F_3 = 49{,}76$ N.'
          - texto: 'Momentos en O para el disco, $T - F_3\tfrac{\sqrt3}{2}R = \tfrac12 MR^{2}\alpha_2$, y $T = 26{,}55$ N·m.'
          - texto: La fuerza F de 1 kN se opone al avance de la mesa, así que hay que vencerla con el par motor.
            trampa: true
            mensaje: |
              $F$ es **vertical** y el enunciado manda despreciar el rozamiento con
              el suelo, así que no se opone a nada horizontal. Lo único que hace es
              subir la normal del suelo de 74 N a 1074 N.
    resolucion: |
      **1. Sólidos libres.** Es un problema de dinámica de un mecanismo con
      movimiento plano, en un instante: primero la cinemática y después las
      ecuaciones de cada pieza. El dibujo del apartado b) lleva la mesa, la
      biela y el disco por separado, y al lado, lo que tienen que dar sus
      fuerzas.

