      - **El centro del disco** no cambia de altura.
      - **El centro de la barra** está $L/4$ por debajo de $B$ al soltar y
        $L/2$ con la barra vertical: baja $L/4$.
      - **Con la barra vertical**, $v_B$ es horizontal y $v_A$, vertical, y
        $A$ está justo debajo de $B$: las perpendiculares se cortan en $A$, el
        centro instantáneo de la barra.

      **2. Incógnitas.** Para a), solo $\omega$: el conjunto tiene un grado
      de libertad, y la energía da una ecuación. Para c), con $\omega = 0$, la
      cinemática deja todas las aceleraciones en función de $\alpha_d$;
      quedan $\alpha_d$, $H$, $B_x$, $B_y$, $N$ y $F_r$: seis, con las tres
      ecuaciones de cada sólido.

      **3. Ecuaciones.** a) La normal y el rozamiento actúan en $P$, que no se
      mueve mientras el disco rueda sin deslizar, y $H$ es perpendicular a la
      guía, por donde se mueve $A$: ninguna trabaja, y la energía se
      conserva. En la posición final, $v_B = \omega R$,
      $\omega_b = \omega R/L$ y $v_C = \omega R/2$:

      $$
      Mg\,\frac{L}{4} = \underbrace{\frac{1}{2}M(\omega R)^{2} + \frac{1}{2}\cdot\frac{MR^{2}}{2}\,\omega^{2}}_{\text{disco}}
      + \underbrace{\frac{1}{2}M\left(\frac{\omega R}{2}\right)^{2}
      + \frac{1}{2}\cdot\frac{ML^{2}}{12}\left(\frac{\omega R}{L}\right)^{2}}_{\text{barra}}
      $$

      c) Con $x$ hacia la derecha, $y$ hacia arriba y los giros antihorarios
      positivos; $\overrightarrow{AB} = L\left(\tfrac{\sqrt3}{2};\ \tfrac12\right)$.
      Rodando, $\vec{a}_B = -\alpha_d R\,\hat{\imath}$, y con $\omega = 0$ la
      corredera obliga a $a_{Ax} = 0$:

      $$
      \vec{a}_A = \vec{a}_B + \vec{\alpha}_b\times\overrightarrow{BA}
      \;\Longrightarrow\;
      -\alpha_d R + \alpha_b\,\frac{L}{2} = 0
      \;\Longrightarrow\;
      \alpha_b = \frac{2R}{L}\,\alpha_d
      $$

      $$
      \vec{a}_C = \vec{a}_B + \vec{\alpha}_b\times\overrightarrow{BC}
      = -\frac{\alpha_d R}{2}\,\hat{\imath} - \frac{\sqrt3}{2}\,\alpha_d R\,\hat{\jmath}
      $$

      El disco, con momentos en $B$:

      $$
      F_r - B_x = -M\alpha_d R
      \qquad
      N - Mg - B_y = 0
      \qquad
      F_r\,R = \tfrac12 MR^{2}\,\alpha_d
      $$

      La barra, con momentos en $C$; desde $C$, $A$ está en
      $\left(-\tfrac{\sqrt3}{4}L;\ -\tfrac{L}{4}\right)$ y $B$ en
      $\left(\tfrac{\sqrt3}{4}L;\ \tfrac{L}{4}\right)$:

      $$
      H + B_x = -\frac{M\alpha_d R}{2}
      \qquad
      B_y - Mg = -\frac{\sqrt3}{2}\,M\alpha_d R
      \qquad
      \frac{L}{4}\,H + \frac{\sqrt3}{4}L\,B_y - \frac{L}{4}\,B_x = \frac{ML^{2}}{12}\,\alpha_b
      $$

      **4. Resultados.** a)

      $$
      \frac{MgL}{4} = \left(\frac34 + \frac16\right) MR^{2}\omega^{2} = \frac{11}{12}MR^{2}\omega^{2}
      \;\Longrightarrow\;
      \omega_d = \sqrt{\frac{3gL}{11R^{2}}}
      $$

      c) Del disco, $F_r = \tfrac12 MR\alpha_d$ y $B_x = \tfrac32 MR\alpha_d$;
      de la barra, $H = -2MR\alpha_d$ y
      $B_y = Mg - \tfrac{\sqrt3}{2}MR\alpha_d$. En la de momentos, con
      $\tfrac{ML^{2}}{12}\alpha_b = \tfrac{MLR}{6}\alpha_d$ y dividiendo entre
      $L$:

      $$
      -\frac12 MR\alpha_d + \frac{\sqrt3}{4}Mg - \frac38 MR\alpha_d - \frac38 MR\alpha_d = \frac16 MR\alpha_d
      \;\Longrightarrow\;
      \frac{\sqrt3}{4}Mg = \frac{17}{12}MR\alpha_d
      $$

      $$
      \alpha_d = \frac{3\sqrt3}{17}\,\frac{g}{R} = 0{,}3057\,\frac{g}{R}
      $$

      Antihoraria: el disco arranca rodando hacia la guía. Con ella,
      $H = -0{,}611\,Mg$, $B_x = 0{,}459\,Mg$, $B_y = \tfrac{25}{34}Mg$,
      $N = \tfrac{59}{34}Mg$ y $F_r = 0{,}153\,Mg$.

      **5. Comprobación.** a) Por otro camino: cada sólido gira alrededor de
      su centro instantáneo, el disco alrededor de $P$ y la barra alrededor de
      $A$, y su energía es $\tfrac12 I\omega^{2}$ respecto de ese punto:

      $$
      T = \frac12\cdot\frac32 MR^{2}\,\omega^{2} + \frac12\cdot\frac{ML^{2}}{3}\left(\frac{\omega R}{L}\right)^{2}
      = \frac34 MR^{2}\omega^{2} + \frac16 MR^{2}\omega^{2}
      $$

      La misma. c) Por la energía, que en c) no se ha usado. Con la barra a
      $\varphi$ de la vertical, su centro instantáneo está a la altura de $A$
      y en la vertical de $B$, a $L\cos\varphi$ de $B$ y a $L/2$ de $C$, que es
      la mediana de un triángulo rectángulo. Así que
      $\omega_b = v_B/(L\cos\varphi)$, $v_C = v_B/(2\cos\varphi)$ y

      $$
      T = \left(\frac34 + \frac{1}{6\cos^{2}\varphi}\right) M v_B^{2}
      $$

      A 60°, $\tfrac{17}{12}Mv_B^{2}$; a 0°, $\tfrac{11}{12}Mv_B^{2}$, la del
      apartado a). $C$ está $\tfrac{L}{2}\cos\varphi$ por debajo de $B$, y como
      $x_B - x_A = L\sin\varphi$, la energía potencial cambia a razón de
      $\tfrac{Mg}{2}\tan\varphi\,v_B$. Se deriva $T + V$ y se divide entre
      $v_B$; lo que sale de derivar el paréntesis lleva $v_B^{2}$ y se anula
      al arrancar:

      $$
      \frac{17}{6}M\,a_B + \frac{\sqrt3}{2}Mg = 0
      \;\Longrightarrow\;
      a_B = -\frac{3\sqrt3}{17}\,g
      $$

      y $a_B = -\alpha_d R$ da la misma $\alpha_d$.

      **Lo que dice el resultado.** Al arrancar, la barra pone casi tanta
      inercia como el disco: a 60° su centro va tan deprisa como $B$, y su
      energía cinética es $\tfrac23 Mv_B^{2}$, frente a $\tfrac34 Mv_B^{2}$
      del disco; con la barra vertical se queda en $\tfrac16 Mv_B^{2}$. Y para
      que el disco ruede sin deslizar al arrancar basta poco rozamiento:
      $F_r/N = 3\sqrt3/59 = 0{,}088$.

  - id: ejma12-col1218-la-rectificadora-de-mesa-alternativa
    titulo: El par motor de una rectificadora de mesa alternativa
    fuente: Ejercicio 12.18 · Tema 12, «Dinámica del sólido con movimiento plano» · Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado y el curso su resolución, y el desarrollo está contrastado contra los dos.
    nivel: practica
    antes:
      idea: |
        Un sólido con movimiento plano cumple tres ecuaciones: la resultante
        de las fuerzas es la masa por la aceleración del centro de gravedad,
        y el momento respecto de G es el momento de inercia en G por la
        aceleración angular. Una barra de masa despreciable, articulada en sus
        dos extremos y sin cargas entre ellos, solo tira o empuja a lo largo
        de sí misma. Un punto que gira alrededor de un centro fijo tiene una
        aceleración tangente a su trayectoria y otra hacia el centro; la de
        otro punto del mismo sólido sale de la suya.
      formula: |
        $$
        \sum\vec{F} = M\vec{a}_G,
        \qquad
        \sum M_G = I_G\,\alpha,
        \qquad
        I_G = \tfrac12 MR^{2}\ \text{(disco)}
        $$

        $$
        a_t = \alpha\,r,
        \qquad
        a_n = \omega^{2} r,
        \qquad
        \vec{a}_B = \vec{a}_A + \vec{\alpha}\times\overrightarrow{AB} - \omega^{2}\,\overrightarrow{AB}
        $$
      reconocer: |
        Antes de calcular se mira cómo se mueve cada pieza y qué fuerzas
        actúan sobre cada una.
    enunciado: |
      La figura representa un proceso de rectificado con mesa alternativa
      horizontal. En el instante considerado, la herramienta de corte con forma de
      disco (5) produce únicamente una fuerza normal vertical hacia abajo sobre el
      conjunto pieza-mesa (4) de valor $F = 1$ kN. El conjunto pieza-mesa (4)
      tiene una masa $m_4 = 5$ kg y se desplaza horizontalmente hacia la
      izquierda. Está articulado a la barra $AB$ (3) mediante un pasador situado
      en su centro de gravedad $B$. La barra $AB$ tiene masa despreciable y
      longitud $L = 3$ m y está a su vez articulada en el punto $A$ de la
      periferia de un disco (2) de masa $m_2 = 5$ kg y radio $R = 0{,}50$ m cuyo
      centro de gravedad $O$ es fijo. El disco (2) gira con velocidad
      $\omega_2 = 4\ \text{rad/s}$ y aceleración
      $\alpha_2 = 8\ \text{rad/s}^{2}$ (ambas positivas, sentido antihorario)
      impulsado por un par motor $T$. En la posición de la figura:

      a) Calcular la velocidad $\omega_3$ y aceleración angular $\alpha_3$ de la
      barra (3).

      b) Representar los diagramas de sólido libre de los elementos (2), (3) y (4).

      c) Obtener el par motor $T$ aplicado sobre el disco (2).

      NOTAS:

      - cualquier referencia fija se nota como (1).

      - despreciar el rozamiento entre el conjunto mesa-pieza (4) y el suelo (1).

