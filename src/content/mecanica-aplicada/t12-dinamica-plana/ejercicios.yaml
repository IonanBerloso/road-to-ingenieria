        <line x1="66" y1="40" x2="100" y2="40" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="98" y="33" font-size="10" text-anchor="start" fill="var(--d2-tinta)">A<tspan font-size="7.5" dy="2.5">x</tspan></text>
