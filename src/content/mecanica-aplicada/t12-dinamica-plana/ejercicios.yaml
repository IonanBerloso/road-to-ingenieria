      <figcaption>

      a) Las ranuras no rozan: empujan perpendicular a ellas, y A y B se mueven a lo largo de ellas, así que no trabajan. Trabajan el muelle y el peso. b) Entre las dos posiciones, el muelle se relaja y G sube. En la horizontal, A se mueve a lo largo de la barra y B, perpendicular a ella.

      </figcaption>
      </figure>

      - **Las ranuras** no rozan: empujan perpendicular a ellas, y $A$ y $B$
        se mueven a lo largo de ellas. No trabajan.
      - **El muelle** trabaja: de $\theta = 50^\circ$ a $\theta = 0$, $A$ se
        acerca a la pared y el muelle se relaja hasta su longitud natural.
      - **El peso** trabaja: $G$ sube $\frac{L}{2}\sin 50^\circ$.

      **2. Incógnitas.** La velocidad angular $\omega$ en $\theta = 0$, y con
      ella $v_B$: una, con la ecuación de la energía.

      **3. Ecuaciones.** El alargamiento de partida: $A$ está a $L\cos\theta$
      de la ranura vertical, y el muelle no está deformado con $\theta = 0$,
      así que $\delta = L(1 - \cos 50^\circ)$. La cinemática en $\theta = 0$:
      $A$ se mueve a lo largo de la barra y $B$, perpendicular a ella; las
      perpendiculares a sus velocidades se cortan en $A$, el centro
      instantáneo. Así que $v_G = \omega L/2$ y $v_B = \omega L$. La energía,
      desde el reposo:

      $$
      \tfrac12 k\,\delta^{2}
      = Mg\,\frac{L}{2}\sin 50^\circ + \tfrac12 M v_G^{2} + \tfrac12\,\frac{ML^{2}}{12}\,\omega^{2}
      $$

      **4. Resultados.** Con $L = 0{,}635$ m y $g = 9{,}81\ \text{m/s}^{2}$:

      $$
      \delta = 0{,}635 \cdot 0{,}3572 = 0{,}2268\ \text{m}
      \qquad
      \tfrac12 k\,\delta^{2} = 262{,}5 \cdot 0{,}05145 = 13{,}51\ \text{J}
      \qquad
      Mg\,\frac{L}{2}\sin 50^\circ = 4 \cdot 9{,}81 \cdot 0{,}2432 = 9{,}54\ \text{J}
      $$

      La cinética es $\tfrac12 M\left(\frac{\omega L}{2}\right)^{2} + \frac{ML^{2}}{24}\,\omega^{2} = \frac{ML^{2}}{6}\,\omega^{2} = 0{,}26882\,\omega^{2}$, y

      $$
      \omega^{2} = 3{,}963/0{,}26882 = 14{,}74
      \qquad
      \omega = 3{,}839\ \text{rad/s}
      \qquad
      v_B = 3{,}839 \cdot 0{,}635 = 2{,}438\ \text{m/s}
      $$

      con $13{,}506 - 9{,}543 = 3{,}963$ J de energía cinética.

      **5. Comprobación.** La cinética, por otro camino: en $\theta = 0$ la
      barra gira alrededor de $A$, así que es la de un giro alrededor de $A$,
      con el momento de inercia respecto de $A$:

      $$
      T = \tfrac12\,\frac{ML^{2}}{3}\,\omega^{2} = \tfrac12 \cdot 0{,}53763\,\omega^{2} = 0{,}26882\,\omega^{2}
      $$

      El mismo coeficiente. Y repartida: la traslación de $G$, a
      $3{,}839 \cdot 0{,}3175 = 1{,}219$ m/s, se lleva
      $2 \cdot 1{,}219^{2} = 2{,}97$ J, y el giro alrededor de $G$, el resto,
      0,99 J.

      **Lo que dice el resultado.** El muelle suelta 13,5 J y el peso se
      queda con 9,5: a la barra le llegan menos de 4 J, y tres cuartas partes
      son la traslación de $G$. Con un muelle de menos de
      $2 \cdot 9{,}543/0{,}2268^{2} = 371$ N/m la barra no llegaría a la
      horizontal.

  - id: ejma12-col126-la-barra-colgada-con-una-fuerza-en-b
    titulo: La barra colgada de C con una fuerza en el extremo
    fuente: >-
      Ejercicio 12.6 · Tema 12, «Dinámica del sólido con movimiento plano» ·
      Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección publica el
      resultado, contra el que está contrastado el desarrollo, y se ha
      comprobado también con la resolución oficial del profesor. Los signos son
      los del resultado impreso, con la fuerza P dibujada hacia la izquierda y
      el eje x hacia la derecha. En la figura, la flecha de P llega a B desde
      la derecha, como en la del curso.
    nivel: practica
    antes:
      idea: |
        Un sólido con movimiento plano cumple tres ecuaciones: la resultante
        de las fuerzas es la masa por la aceleración del centro de gravedad,
        y el momento respecto de G es el momento de inercia en G por la
        aceleración angular. Respecto de otro punto, al par de inercia se le
        suma el momento del vector masa por aceleración de G, aplicado en G.
        Un punto que gira alrededor de un punto fijo, a una distancia r de él,
        tiene una aceleración tangente a su trayectoria y otra hacia el punto
        fijo.
      formula: |
        $$
        \sum\vec{F} = M\vec{a}_G,
        \qquad
        \sum M_G = I_G\,\alpha,
        \qquad
        \sum M_P = I_G\,\alpha + M\,a_G\,d
        $$

        $$
        a_t = \alpha\,r,
        \qquad
        a_n = \omega^{2} r,
        \qquad
        I_G = \tfrac{1}{12} ML^{2}\ \text{(barra)},
        \qquad
        I_O = I_G + M\,d^{2}
        $$
      reconocer: |
        Antes de calcular se mira qué punto de la barra no se mueve y dónde
        está G respecto de él.
    enunciado: |
      Una barra uniforme de longitud $L$ = 900 mm y masa 4 kg cuelga libremente
      de una articulación en C. Una fuerza horizontal $P$ de 75 N de magnitud
      se aplica en el extremo $B$. Si la distancia $r$ es 225 mm, calcular:

      a) Aceleración angular de la barra.

      b) Reacción en $C$.

