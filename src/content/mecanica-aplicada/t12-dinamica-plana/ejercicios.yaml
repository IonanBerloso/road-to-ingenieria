    pide: La velocidad angular del disco cuando la barra queda vertical y su aceleración angular al inicio, en función de g, L y R.
    pasos:
      - tipo: reconocer
        pregunta: |
          En la posición final la barra está vertical, con $A$ abajo en la guía y
          $B$ arriba. ¿Cuál es el centro instantáneo de rotación de la barra?
        opciones:
          - texto: El propio punto A, que queda instantáneamente parado
            correcta: true
            mensaje: |
              Eso es. $v_B$ es horizontal —el centro del disco va a altura
              constante— y $v_A$ es vertical, pero $A$ está justo debajo de $B$;
              la perpendicular a $v_B$ por $B$ es la propia barra, y corta a la
              perpendicular a $v_A$ por $A$ en $A$. Así que $v_A = 0$.
          - texto: El centro del disco, B
            mensaje: |
              $B$ se mueve, y bastante: es el punto que arrastra al disco. El
              centro instantáneo es el que tiene velocidad nula, y en esa posición
              es $A$.
          - texto: El punto de contacto del disco con el suelo
            mensaje: |
              Ese es el centro instantáneo del **disco**, que rueda. La barra es
              otro sólido y tiene el suyo, que no tiene por qué coincidir.
          - texto: No hay, porque la barra está trasladando
            mensaje: |
              La barra gira: pasa de 60 grados a estar vertical. Un sólido que
              gira siempre tiene centro instantáneo, aunque a veces esté en el
              infinito, y aquí está en $A$.

      - tipo: calcular
        titulo: La velocidad angular del disco con la barra vertical
        pregunta: |
          Escribiendo el resultado como
          $\omega_d = \dfrac{\sqrt{c\,gL}}{R}$, ¿cuánto vale $c$?
        respuesta:
          tipo: numero
          valor: '0.2727'
          tolerancia: 0.002
          formato: un número, sin unidad
        distractores:
          - valor: '1.1818'
            mensaje: |
              Es $13/11$, el valor que encuadra la resolución del curso. Sus
              propias ecuaciones dan $3/11$, y el resultado impreso en la
              colección también; el $13$ es un desliz al despejar.
          - valor: '0.3333'
            mensaje: |
              Has contado solo la energía cinética del disco. La barra también se
              mueve y su energía es la tercera parte de la del disco.
          - valor: '0.375'
            mensaje: |
              Te falta el término de rotación del disco,
              $\tfrac12\left(\tfrac12 MR^{2}\right)\omega^{2}$. El disco rueda, así
              que tiene traslación **y** giro.
        pista: |
          Solo baja el centro de la barra, de $\tfrac34 L$ a $\tfrac12 L$ sobre el
          nivel final de $A$; el centro del disco no cambia de altura. Y al final,
          $A$ es el centro instantáneo de la barra.
        desarrollo: |
          La energía liberada es $Mg\,L/4$. Al final, con $v_B = \omega R$,
          $\omega_{\text{barra}} = \omega R/L$ y $v_C = \omega R/2$,

          $$
          T = \frac{3}{4}MR^{2}\omega^{2} + \frac{1}{6}MR^{2}\omega^{2}
          = \frac{11}{12}MR^{2}\omega^{2}
          $$

          $$
          \frac{MgL}{4} = \frac{11}{12}MR^{2}\omega^{2}
          \;\Longrightarrow\;
          \omega_d = \sqrt{\frac{3gL}{11R^{2}}}
          $$

      - tipo: calcular
        titulo: La aceleración angular del disco al empezar
        pregunta: |
          Escribiendo $\alpha_d = c\,g/R$, ¿cuánto vale $c$ en el instante
          inicial, con la barra a 60º?
        respuesta:
          tipo: numero
          valor: '0.3057'
          tolerancia: 0.002
          formato: un número, sin unidad
        distractores:
          - valor: '0.4724'
            mensaje: |
              Sale de tomar momentos del disco en el punto de contacto escribiendo
              $\sum M_C = I_G\alpha$, sin sumar el momento de $M\vec{a}_B$. Ahí la
              inercia que toca es $I_G + MR^{2}$.
          - valor: '0.3712'
            mensaje: |
              Sale de olvidar la inercia de giro del disco,
              $\tfrac12 MR^{2}$, y tratarlo como una masa que solo se traslada. El
              disco rueda y su giro cuenta.
        pista: |
          Con $\omega = 0$, $a_B = \alpha_d R$ horizontal y la condición
          $a_{Ax} = 0$ da $\alpha_{\text{barra}} = 2R\,\alpha_d/L$. Después, tres
          ecuaciones para la barra y tres para el disco.
        desarrollo: |
          De la cinemática, $\vec{a}_C = \alpha_d R\left(-\tfrac12,\ -\tfrac{\sqrt3}{2}\right)$.
          Con las tres ecuaciones de cada sólido y la corredera sin masa —que solo
          transmite fuerza horizontal—, el sistema de seis ecuaciones da

          $$
          \alpha_d = \frac{3\sqrt{3}}{17}\,\frac{g}{R} = 0{,}3057\,\frac{g}{R}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Como no hay rozamiento en la corredera ni deslizamiento en el disco, no hay trabajo no conservativo y vale $T_A + V_A = T_B + V_B$.'
          - texto: 'De 60º a la vertical solo baja el centro de la barra, un cuarto de L; el centro del disco se mueve en horizontal y no cambia de altura.'
          - texto: 'Con la barra vertical, A es el centro instantáneo de la barra, así que $v_B = \omega R$, $\omega_{\text{barra}} = \omega R/L$ y $T = \tfrac{11}{12}MR^{2}\omega^{2}$.'
          - texto: 'Para el apartado c) se plantean las tres ecuaciones de cada sólido con $\omega = 0$ y las relaciones cinemáticas, y sale $\alpha_d = 3\sqrt{3}g/(17R)$.'
          - texto: Al rodar sin deslizar, el rozamiento del suelo hace un trabajo negativo que hay que restar de la energía.
            trampa: true
            mensaje: |
              El rozamiento de rodadura sin deslizamiento **no trabaja**, porque su
              punto de aplicación tiene velocidad nula. Por eso se puede usar la
              conservación de la energía aunque haya rozamiento.
    resolucion: |
      **Apartado a), por energía.** No hay trabajo no conservativo, porque el
      rozamiento actúa en un punto de velocidad nula y la corredera no roza. Con
      el origen de alturas en la posición final de $A$, el centro del disco está
      siempre a la misma altura y el de la barra baja de $\tfrac34 L$ a
      $\tfrac12 L$. Se liberan $Mg\,L/4$.

      En la posición final, la barra está vertical y $A$ es su centro instantáneo,
      así que con $v_B = \omega R$,

      $$
      T = \underbrace{\frac{1}{2}M(\omega R)^{2} + \frac{1}{2}\cdot\frac{MR^{2}}{2}\,\omega^{2}}_{\text{disco}}
      + \underbrace{\frac{1}{2}M\left(\frac{\omega R}{2}\right)^{2}
      + \frac{1}{2}\cdot\frac{ML^{2}}{12}\left(\frac{\omega R}{L}\right)^{2}}_{\text{barra}}
      = \frac{11}{12}MR^{2}\omega^{2}
      $$

      $$
      \frac{MgL}{4} = \frac{11}{12}MR^{2}\omega^{2}
      \;\Longrightarrow\;
      \omega_d = \sqrt{\frac{3gL}{11R^{2}}}
      $$

      **Apartado c), por las ecuaciones del movimiento.** Al empezar, $\omega = 0$
      en los dos sólidos. Rodando, $\vec{a}_B = -\alpha_d R\,\hat{\imath}$; la
      corredera obliga a $a_{Ax} = 0$, y de ahí
      $\alpha_{\text{barra}} = 2R\,\alpha_d/L$ y

      $$
      \vec{a}_C = -\frac{\alpha_d R}{2}\,\hat{\imath} - \frac{\sqrt{3}}{2}\alpha_d R\,\hat{\jmath}
      $$

      Con las tres ecuaciones de la barra, las tres del disco y la corredera sin
      masa —que solo transmite fuerza horizontal—, el sistema da

      $$
      \alpha_d = \frac{3\sqrt{3}}{17}\,\frac{g}{R}
      $$

      **Sobre el resultado impreso.** La colección publica
      $\omega_d = \sqrt{3gL/(11R^{2})}$, que es lo que sale aquí. La resolución
      del curso plantea exactamente las mismas energías —se pueden leer una a una
      y coinciden— pero encuadra $\sqrt{13gL/(11R^{2})}$; despejando de sus
      propias ecuaciones sale el $3$.
  - id: ejma12-col1218-la-rectificadora-de-mesa-alternativa
    titulo: El par motor de una rectificadora de mesa alternativa
    fuente: Ejercicio 12.18 · Tema 12, «Dinámica del sólido con movimiento plano» · Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado y el curso su resolución, y el desarrollo está contrastado contra los dos.
    nivel: practica
    enunciado: |
      La figura representa un proceso de rectificado con mesa alternativa
      horizontal. En el instante considerado, la herramienta de corte con forma de
      disco (5) produce únicamente una fuerza normal vertical hacia abajo sobre el
      conjunto pieza-mesa (4) de valor $F = 1$ kN. El conjunto pieza-mesa (4)
      tiene una masa $m_4 = 5$ kg y se desplaza horizontalmente hacia la
      izquierda. Está articulado a la barra $AB$ (3) mediante un pasador situado
      en su centro de gravedad $B$. La barra $AB$ tiene masa despreciable y
      longitud $L = 3$ m y está a su vez articulada en el punto $A$ de la
      periferia de un disco (2) de masa $m_2 = 5$ kg y radio $R = 0{,}50$ m cuyo
      centro de gravedad $O$ es fijo. El disco (2) gira con velocidad
      $\omega_2 = 4\ \text{rad/s}$ y aceleración
      $\alpha_2 = 8\ \text{rad/s}^{2}$ (ambas positivas, sentido antihorario)
      impulsado por un par motor $T$. En la posición de la figura:

      a) Calcular la velocidad $\omega_3$ y aceleración angular $\alpha_3$ de la
      barra (3).

      b) Representar los diagramas de sólido libre de los elementos (2), (3) y (4).

      c) Obtener el par motor $T$ aplicado sobre el disco (2).

      NOTAS:

      - cualquier referencia fija se nota como (1).

      - despreciar el rozamiento entre el conjunto mesa-pieza (4) y el suelo (1).

      <figure>
