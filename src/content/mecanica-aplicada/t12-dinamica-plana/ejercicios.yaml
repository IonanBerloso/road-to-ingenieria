    pide: La velocidad angular del disco cuando la barra queda vertical y su aceleración angular al inicio, en función de g, L y R.
    pasos:
      - tipo: reconocer
        pregunta: |
          En la posición final la barra está vertical, con $A$ abajo en la guía y
          $B$ arriba. ¿Cuál es el centro instantáneo de rotación de la barra?
        opciones:
          - texto: El propio punto A, que queda instantáneamente parado
            correcta: true
            mensaje: |
              Eso es. $v_B$ es horizontal —el centro del disco va a altura
              constante— y $v_A$ es vertical, pero $A$ está justo debajo de $B$;
              la perpendicular a $v_B$ por $B$ es la propia barra, y corta a la
              perpendicular a $v_A$ por $A$ en $A$. Así que $v_A = 0$.
          - texto: El centro del disco, B
            mensaje: |
              $B$ se mueve, y bastante: es el punto que arrastra al disco. El
              centro instantáneo es el que tiene velocidad nula, y en esa posición
              es $A$.
          - texto: El punto de contacto del disco con el suelo
            mensaje: |
              Ese es el centro instantáneo del **disco**, que rueda. La barra es
              otro sólido y tiene el suyo, que no tiene por qué coincidir.
          - texto: No hay, porque la barra está trasladando
            mensaje: |
              La barra gira: pasa de 60 grados a estar vertical. Un sólido que
              gira siempre tiene centro instantáneo, aunque a veces esté en el
              infinito, y aquí está en $A$.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta, y es el apartado b): **la barra y
          el disco por separado, en la posición inicial, cada uno con todas las
          fuerzas que actúan sobre él, y al lado, lo que tienen que dar esas
          fuerzas**. Sin escala.
        comprueba:
          - punto: |
              **En $A$, la fuerza de la corredera, horizontal.**
            porque: |
              La corredera no pesa y desliza sin rozamiento por una guía
              vertical: solo puede empujar perpendicular a la guía.
          - punto: |
              **En $B$, la fuerza entre la barra y el disco, con sus dos
              componentes, la misma en los dos dibujos y con sentidos
              opuestos.**
            porque: |
              Es la articulación que los une: lo que el disco le hace a la
              barra, la barra se lo hace al disco.
          - punto: |
              **En el punto de contacto del disco, la normal y el
              rozamiento.**
            porque: |
              El disco rueda sin deslizar: el suelo tiene que poder empujarlo
              en horizontal, y cuánto lo dicen las ecuaciones.
          - punto: |
              **Al lado, $M\vec{a}_C$ e $I_C\,\alpha_b$ en la barra, y
              $M\vec{a}_B$ e $I_B\,\alpha_d$ en el disco.**
            porque: |
              Todo parte del reposo; las direcciones las da la cinemática: $B$
              va en horizontal, hacia la guía, y $A$, en vertical.
