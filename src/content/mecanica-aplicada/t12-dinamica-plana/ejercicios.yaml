      - tipo: calcular
        titulo: Cuánto se ha desplazado B
        pregunta: |
          Cuando $A$ ha bajado 25 mm, ¿cuánto se ha desplazado $B$ en
          horizontal desde la posición vertical?
        respuesta:
          tipo: magnitud
          valor: '0.11990 m'
          tolerancia: 0.01
          formato: en metros, con cinco cifras
        distractores:
          - valor: '0.025 m'
            mensaje: |
              Eso es lo que baja $A$. $B$ se mueve mucho más: con la biela casi
              vertical, un descenso pequeño de $A$ produce un desplazamiento
              lateral grande de $B$.
          - valor: '0.275 m'
            mensaje: |
              Es la altura que le queda a $A$, no el desplazamiento de $B$. El
              cateto horizontal sale del teorema de Pitágoras con la biela como
              hipotenusa.
          - valor: '0.2990 m'
            mensaje: |
              Has tomado los 25 mm como un cateto: $\sqrt{L^{2}-d^{2}}$. Lo que
              baja $A$ se resta a la altura, así que el cateto vertical es
              $L-d$ y $x = \sqrt{L^{2}-(L-d)^{2}}$.
        pista: |
          La biela es la hipotenusa: $x^{2} + (L-d)^{2} = L^{2}$.
        desarrollo: |
          $$
          x = \sqrt{0{,}3^{2} - 0{,}275^{2}} = \sqrt{0{,}014375}
          = 0{,}11990\ \text{m}
          $$

      - tipo: calcular
        titulo: La velocidad de A con la biela sin masa
        pregunta: |
          Con $g = 9{,}81\ \text{m/s}^{2}$ y la biela de masa despreciable,
          ¿cuánto vale $v_A$?
        respuesta:
          tipo: magnitud
          valor: '0.1524 m/s'
          tolerancia: 0.01
          formato: en m/s, con cuatro cifras
        distractores:
          - valor: '0.2799 m/s'
            mensaje: |
              Te has dejado los muelles. Absorben 12,94 J de los 18,39 que
              suelta el peso de $A$: casi tres cuartas partes.
          - valor: '0.2254 m/s'
            mensaje: |
              Has contado un solo muelle. Son dos, y los dos almacenan energía
              a la vez: uno se comprime y el otro se estira, pero
              $\tfrac12 kx^{2}$ es positivo en los dos casos.
          - valor: '0.2697 m/s'
            mensaje: |
              Has puesto $v_B = v_A$. $B$ va 2,29 veces más rápido, y como la
              energía cinética va con el cuadrado, casi toda está en $B$.
        pista: |
          $m g d = \tfrac12 m v_A^{2} + \tfrac12 m v_B^{2} + 2\cdot\tfrac12 k x^{2}$,
          con $v_B = v_A\,(L-d)/x$.
        desarrollo: |
          $$
          v_B = v_A\,\frac{0{,}275}{0{,}11990} = 2{,}2937\,v_A
          $$

          $$
          75\cdot 9{,}81\cdot 0{,}025 - 900\cdot 0{,}014375
          = 37{,}5\,(1 + 2{,}2937^{2})\,v_A^{2}
          $$

          $$
          5{,}456 = 234{,}78\,v_A^{2}
          \;\Longrightarrow\;
          v_A = 0{,}1524\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La velocidad de B con la biela sin masa
        pregunta: |
          ¿Y cuánto vale $v_B$ en ese mismo instante?
        respuesta:
          tipo: magnitud
          valor: '0.3497 m/s'
          tolerancia: 0.01
          formato: en m/s, con cuatro cifras
        distractores:
          - valor: '0.1524 m/s'
            mensaje: |
              Esa es la de $A$. Las dos masas son iguales pero sus velocidades
              no: la ligadura de la biela hace que $B$ vaya 2,29 veces más
              rápido en esta posición.
          - valor: '0.06646 m/s'
            mensaje: |
              Has invertido la relación, $v_B = v_A\,x/(L-d)$. Es al revés: el
              cateto pequeño va con la velocidad pequeña.
        pista: |
          $v_B = v_A\,(L-d)/x$, la misma relación del paso anterior.
        desarrollo: |
          $$
          v_B = 2{,}2937\cdot 0{,}15245 = 0{,}3497\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La velocidad de A con la biela de 10 kg
        pregunta: |
          Ahora la biela pesa 10 kg. ¿Cuánto vale $v_A$?
        respuesta:
          tipo: magnitud
          valor: '0.1651 m/s'
          tolerancia: 0.01
          formato: en m/s, con cuatro cifras
        distractores:
          - valor: '0.1524 m/s'
            mensaje: |
              Es el resultado del apartado a. La biela de 10 kg cambia las dos
              cosas a la vez: añade energía cinética, pero también baja su
              centro de gravedad 12,5 mm y aporta 1,23 J.
          - valor: '0.2829 m/s'
            mensaje: |
              Has añadido la biela pero te has dejado los muelles. Su energía,
              12,94 J, sigue siendo el término más grande de todos.
        pista: |
          La biela aporta tres cosas: su peso baja $d/2$, su centro lleva
          $v_G^{2} = (v_A^{2}+v_B^{2})/4$ y gira con $\omega = v_A/x$, con
          $I_G = m_3L^{2}/12$.
        desarrollo: |
          $$
          (75 + 5)\,g\,d - k x^{2}
          = \left[37{,}5 + 197{,}28 + 7{,}83 + 2{,}61\right] v_A^{2}
          $$

          donde el 5 es la biela de 10 kg, cuyo centro baja la mitad, y los
          cuatro sumandos son A, B, la traslación de la biela y su rotación.

          $$
          6{,}6825 = 245{,}22\,v_A^{2}
          \;\Longrightarrow\;
          v_A = 0{,}1651\ \text{m/s}
          \qquad
          v_B = 0{,}3786\ \text{m/s}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Geometría: cuando A baja 25 mm, $x = \sqrt{L^{2}-(L-d)^{2}} = 0{,}1199$ m, y derivando la ligadura, $v_B = v_A(L-d)/x = 2{,}2937\,v_A$.'
          - texto: Los dos muelles almacenan $2\cdot\tfrac12 kx^{2} = 12{,}94$ J y el peso de A suelta $mgd = 18{,}39$ J.
          - texto: 'Con biela sin masa queda $5{,}46 = \tfrac12 m (v_A^{2}+v_B^{2})$, y salen 0,152 y 0,350 m/s.'
          - texto: Al añadir la biela de 10 kg las velocidades bajan, porque hay más masa que mover con la misma energía.
            trampa: true
            mensaje: |
              Suben, de 0,152 a 0,165 m/s. La biela no solo añade inercia:
              también añade peso que baja, y su centro desciende $d/2$. Aquí
              gana el peso: los muelles se quedan casi tres cuartas partes de
              lo que suelta $A$, así que los 1,23 J de la biela son un 22 % más
              de lo que queda para moverse, y su inercia solo añade un 4 % al
              coeficiente de $v_A^{2}$.
    resolucion: |
      **1. Posiciones.** Es un problema de dinámica de un sistema de sólidos
      entre dos posiciones: el dibujo lleva el sólido libre del conjunto, para
      ver qué fuerzas trabajan, y las dos posiciones, con las velocidades en la
      final.

