    pide: La constante k del muelle y la reacción entre la masa puntual y la barra, en función de M, g y L.
    pasos:
      - tipo: reconocer
        pregunta: |
          La masa puntual se **apoya** sobre la barra, sin rozamiento y sin estar
          soldada. ¿Qué se sigue de eso al quitar la barra $BD$?
        opciones:
          - texto: Que tiene su propia ecuación en vertical, y su reacción N deja de valer Mg en cuanto acelera
            correcta: true
            mensaje: |
              Eso es. La masa puntual es un sólido más, con su
              $N - Mg = M\,a_y$. Mientras el sistema esté quieto, $N = Mg$; en
              cuanto la barra sube o baja acelerando, $N$ cambia.
          - texto: Que N sigue valiendo Mg, porque la masa solo tiene su peso
            mensaje: |
              Solo si no acelerase. Al quitar $BD$ la barra gira, la masa sube con
              ella acelerando, y para acelerarla hacia arriba la barra tiene que
              empujarla con más de $Mg$.
          - texto: Que se puede tratar como parte de la barra, con su masa sumada al conjunto
            mensaje: |
              Para el giro sale lo mismo, porque la masa está justo encima del
              centro de gravedad de la barra, pero entonces no se puede contestar a
              lo que se pregunta, que es precisamente la fuerza de contacto.
          - texto: Que la masa se despega inmediatamente, porque no hay rozamiento
            mensaje: |
              El rozamiento no tiene nada que ver con despegarse. La masa se
              despegaría si la barra bajara con más de $g$; aquí la barra sube y
              la aprieta más.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **la masa puntual y la barra $AB$
          por separado, cada una con todas las fuerzas que actúan sobre ella, y
          al lado, lo que tienen que dar esas fuerzas**. La fuerza de $BD$, de
          otro modo, porque solo está antes de quitarla. Sin escala.
        comprueba:
          - punto: |
              **En $A$, la fuerza del muelle, $kL$, vertical hacia abajo.**
            porque: |
              El muelle tiene longitud natural nula y mide $L$: está estirado
              $L$ y tira de $A$ hacia $C$.
          - punto: |
              **En $O$, una sola fuerza, vertical.**
            porque: |
              El poste que sostiene $O$ no pesa y va articulado en sus dos
              extremos: solo empuja o tira a lo largo de sí mismo.
          - punto: |
              **La masa aparte, con su peso y la normal hacia arriba; en la
              barra, la misma normal hacia abajo, en $G$, y su peso.**
            porque: |
              La masa solo se apoya: lo que se hacen una a otra es la normal,
              con sentidos opuestos. Y está justo encima de $G$, a $L/2$ de $O$.
          - punto: |
              **En $B$, la fuerza de $BD$, vertical, marcada aparte.**
            porque: |
              Su valor, $Mg$, lo da el enunciado; si tira o empuja lo dice la
              ecuación de momentos. Al quitar $BD$, desaparece.
          - punto: |
              **Al lado, $M a$ de la masa y $M a_G$ de la barra, verticales, y
              el par $I_G\,\alpha$.**
            porque: |
              Ninguna fuerza es horizontal, así que nada acelera en horizontal.
        figura: |
