        <line x1="28" y1="68" x2="182" y2="68" stroke="var(--ink)" stroke-width="1.2"/>
        <path d="M34 42 L28 34 M50 42 L44 34 M66 42 L60 34 M82 42 L76 34 M98 42 L92 34 M114 42 L108 34 M130 42 L124 34 M146 42 L140 34 M162 42 L156 34 M178 42 L172 34" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
