      <figcaption>

      La barra baja **30°** hacia la derecha. El bloque **A** corre por la
      ranura horizontal y el bloque **C**, que es el punto medio, por la
      vertical. La flecha de **P** se ha dibujado en el sentido en el que la
      fuerza resulta positiva.

      </figcaption>
      </figure>
    pide: La fuerza P y la reacción en A, en función de M, L, alfa y g.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de escribir ninguna ecuación, ¿cómo es la aceleración del
          centro de gravedad $G$ de la barra?
        opciones:
          - texto: Vertical, porque G es el punto medio y coincide con el bloque C, que solo puede subir o bajar
            correcta: true
            mensaje: |
              Eso es, y es la clave del problema. $AC = CB = L/2$, así que
              $G = C$; la ranura vertical obliga a que $a_{Gx} = 0$ y la
              ecuación horizontal se queda en $N_C = P$.
          - texto: Nula, porque la barra parte del reposo
            mensaje: |
              Partir del reposo anula la **velocidad**, no la aceleración. De
              hecho lo único que se anula por eso son los términos $\omega^{2}$
              de la aceleración relativa.
          - texto: Perpendicular a la barra y de valor alfa por L partido por dos
            mensaje: |
              Eso sería si $A$ estuviera fijo. Aquí $A$ también se mueve, así
              que $\vec{a}_G = \vec{a}_A + \vec{\alpha}\times\overrightarrow{AG}$
              y hay que sumar los dos.
          - texto: Horizontal, la misma que la del bloque A
            mensaje: |
              $G$ no es $A$. Solo tendrían la misma aceleración si la barra
              trasladara, y aquí gira con $\alpha$.

      - tipo: calcular
        titulo: El coeficiente de Mg en la fuerza P
        pregunta: |
          La fuerza sale de la forma $P = M(c_1\,g + c_2\,L\alpha)$. ¿Cuánto
          vale $c_1$, el coeficiente de $Mg$?
        respuesta:
          tipo: numero
          valor: '1.7320508'
          tolerancia: 0.002
          formato: un número, sin unidad (el coeficiente de Mg)
        distractores:
          - valor: '0.5773503'
            mensaje: |
              Es $1/\sqrt{3}$: has cambiado el brazo horizontal por el
              vertical al tomar momentos. El brazo de $R_A$ es
              $\frac{L}{2}\cos 30^\circ$ y el de $P$, $\frac{L}{2}\sin 30^\circ$,
              y el cociente de los dos es $\sqrt{3}$.
          - valor: '1'
            mensaje: |
              Has supuesto que $P$ equilibra el peso. $P$ es horizontal y el
              peso vertical: lo que las relaciona es la ecuación de momentos,
              y ahí aparece el $\sqrt{3}$ de la geometría.
          - valor: '0.8660254'
            mensaje: |
              Es $\cos 30^\circ$, uno solo de los dos brazos. En el cociente
              aparecen los dos, y sale $\cos 30^\circ / \sin 30^\circ = \sqrt{3}$.
        pista: |
          Con $\alpha = 0$ el problema es de estática: $R_A = Mg$, y momentos
          en $G$ dan $P\,\frac{L}{2}\sin 30^\circ = R_A\,\frac{L}{2}\cos 30^\circ$.
        desarrollo: |
          $$
          P\,\frac{L}{2}\sin 30^\circ - R_A\,\frac{L}{2}\cos 30^\circ = I_G\,\alpha
          \;\Longrightarrow\;
          c_1 = \frac{\cos 30^\circ}{\sin 30^\circ} = \sqrt{3} = 1{,}732
          $$

      - tipo: calcular
        titulo: El coeficiente de MLalfa en la fuerza P
        pregunta: |
          En $P = M(\sqrt{3}\,g + c_2\,L\alpha)$, ¿cuánto vale $c_2$?
        respuesta:
          tipo: numero
          valor: '1.0833333'
          tolerancia: 0.002
          formato: un número, sin unidad (el coeficiente de MLalfa)
        distractores:
          - valor: '0.0833333'
            mensaje: |
              Es $1/12$, o sea solo el par $I_G\alpha$. Falta el otro camino
              por el que entra $\alpha$: la reacción $R_A$ ya lleva dentro
              $\sqrt{3}L\alpha/4$, y al despejar $P$ eso aporta $3/4$.
          - valor: '0.75'
            mensaje: |
              Es solo la parte que entra por $R_A$. Falta el par $I_G\alpha$,
              que añade $\sqrt{3}\cdot\frac{1}{12}\cdot\frac{2}{\sqrt{3}} = 1/3$.
          - valor: '0.4330127'
            mensaje: |
              Es $\sqrt{3}/4$, el coeficiente que lleva la reacción en $A$, no
              la fuerza $P$. Al pasar de $R_A$ a $P$ hay que multiplicar por
              $\sqrt{3}$ y sumar el par de inercia.
        pista: |
          $P = \sqrt{3}R_A + \frac{2 I_G \alpha}{L\sin 30^\circ}$, con
          $R_A = M\!\left(g + \frac{\sqrt{3}}{4}L\alpha\right)$ e
          $I_G = ML^{2}/12$.
        desarrollo: |
          $$
          c_2 = \sqrt{3}\cdot\frac{\sqrt{3}}{4} + \frac{1}{3}
          = \frac{3}{4} + \frac{1}{3} = \frac{13}{12} = 1{,}0833
          $$

      - tipo: calcular
        titulo: El coeficiente de MLalfa en la reacción en A
        pregunta: |
          La reacción vale $R_A = M(g + c_3\,L\alpha)$. ¿Cuánto vale $c_3$?
        respuesta:
          tipo: numero
          valor: '0.4330127'
          tolerancia: 0.002
          formato: un número, sin unidad (el coeficiente de MLalfa)
        distractores:
          - valor: '0'
            mensaje: |
              Has supuesto que la ranura sostiene solo el peso. $G$ acelera
              **hacia arriba** con $\sqrt{3}L\alpha/4$, así que la ranura tiene
              que empujar más que el peso.
          - valor: '0.25'
            mensaje: |
              Es $L/4$ sin el $\cos 30^\circ$. La componente vertical de
              $\vec{\alpha}\times\overrightarrow{AG}$ vale
              $\frac{L}{2}\alpha\cos 30^\circ$, no $\frac{L}{2}\alpha\sin 30^\circ$.
          - valor: '0.8660254'
            mensaje: |
              Te has dejado el $1/2$ de $\overrightarrow{AG} = L/2$: has puesto
              la longitud entera en vez de la media barra.
        pista: |
          $\vec{a}_G = \vec{a}_A + \vec{\alpha}\times\overrightarrow{AG}$, y
          $a_{Gx} = 0$ porque $G$ va por la ranura vertical. Luego
          $R_A - Mg = M a_{Gy}$.
        desarrollo: |
          $$
          a_{Gy} = \frac{L}{2}\,\alpha\cos 30^\circ = \frac{\sqrt{3}}{4}L\alpha
          \qquad
          R_A = M\!\left(g + \frac{\sqrt{3}}{4}L\alpha\right)
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'C es el punto medio, así que G = C y la ranura vertical impone $a_{Gx} = 0$; entonces $a_{Gy} = \frac{\sqrt{3}}{4}L\alpha$.'
          - texto: 'Momento lineal en vertical: $R_A - Mg = Ma_{Gy}$, o sea $R_A = M\!\left(g + \frac{\sqrt{3}}{4}L\alpha\right)$.'
          - texto: 'Momentos en G, donde solo dan momento P y $R_A$: $P\frac{L}{4} - R_A\frac{\sqrt{3}L}{4} = \frac{ML^{2}}{12}\alpha$, y sale $P = M\!\left(\sqrt{3}g + \frac{13}{12}L\alpha\right)$.'
          - texto: Como los bloques no tienen masa y las ranuras no rozan, la fuerza sobre el bloque C es nula y P se lleva sola todo el peso.
            trampa: true
            mensaje: |
              Un bloque sin masa no anula la fuerza, solo obliga a que la suma
              sobre él sea cero. La ranura vertical empuja a $C$ en horizontal
              con $N_C = P$, y es lo que impide que la barra se vaya de lado.
    resolucion: |
      **La geometría manda.** $AC = CB = L/2$, así que el centro de gravedad
      de la barra es el bloque $C$, y $C$ solo puede moverse por la ranura
      vertical. Eso fija la aceleración de $G$ sin resolver nada:

      $$
      \vec{a}_G = \vec{a}_A + \vec{\alpha}\times\overrightarrow{AG}
      \qquad
      a_{Gx} = 0
      \qquad
      a_{Gy} = \frac{L}{2}\,\alpha\cos 30^\circ = \frac{\sqrt{3}}{4}L\alpha
      $$

      **Las tres ecuaciones.** Las ranuras no rozan, así que la horizontal solo
      da fuerza vertical ($R_A$ en $A$) y la vertical solo horizontal ($N_C$ en
      $C$):

      $$
      N_C - P = M a_{Gx} = 0
      \qquad
      R_A - Mg = M a_{Gy}
      \qquad
      P\,\frac{L}{4} - R_A\,\frac{\sqrt{3}L}{4} = \frac{ML^{2}}{12}\,\alpha
      $$

      **Los resultados.** De la segunda,
      $R_A = M\!\left(g + \frac{\sqrt{3}}{4}L\alpha\right)$; sustituyendo en la
      tercera,

      $$
      P = \sqrt{3}\,R_A + \frac{ML\alpha}{3}
      = M\!\left(\sqrt{3}\,g + \frac{13}{12}L\alpha\right)
      $$

      Y de la primera, la ranura vertical empuja con $N_C = P$. Conviene mirar
      el caso $\alpha = 0$: en equilibrio harían falta $P = \sqrt{3}Mg$ y
      $R_A = Mg$, y todo lo que lleva $\alpha$ es lo que cuesta acelerar.

  - id: ejma12-col123-dos-engranajes-unidos-por-una-barra
    titulo: Dos engranajes unidos por una barra
    fuente: >-
      Ejercicio 12.3 · Tema 12, «Dinámica del sólido con movimiento plano» ·
      Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección publica el
      resultado, contra el que está contrastado el desarrollo, y se ha
      comprobado también con la resolución oficial del profesor. Ojo al
      apartado a: la colección imprime 36,17 rad/s2, y ese número es la
      aceleración angular de la BARRA AB, no la del engranaje (2), que gira al
      doble. La resolución oficial del profesor publica 72,36 rad/s2 para el
      engranaje y 36,18 para la barra, y es lo que da la cuenta; el sitio
      publica 72,36 y explica el otro.
    nivel: practica
    enunciado: |
      Dos ruedas dentadas (1) y (2) engranan y están conectadas mediante la
      barra (3) $AB$ uniforme de longitud 200 mm. El engranaje (2) tiene una
      masa de 5 kg y un radio de giro central de 75 mm. La barra $AB$ tiene una
      masa de 3 kg. Si el sistema se suelta desde el reposo (posición de la
      figura), obtener:

      a) Aceleración angular del engranaje (2).

      b) Aceleración del punto $B$.

      <figure>
      <svg viewBox="0 0 300 210" role="img" width="300" height="210" aria-labelledby="ma12c3-t ma12c3-d">
        <title id="ma12c3-t">Dos engranajes iguales que engranan, con la barra AB uniendo sus centros</title>
        <desc id="ma12c3-d">Dos ruedas dentadas iguales, de 100 milimetros de radio, con los centros A y B separados 200 milimetros en horizontal. La rueda (1), a la izquierda, esta montada sobre un apoyo fijo en A. La barra (3) AB, de 200 milimetros y 3 kilogramos, une los dos centros; su centro de gravedad G esta en el punto medio, que cae justo sobre el punto donde engranan las dos ruedas.</desc>
        <circle cx="85" cy="118" r="55" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.3"/>
        <circle cx="195" cy="118" r="55" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.3"/>
        <line x1="85" y1="118" x2="195" y2="118" stroke="var(--ink)" stroke-width="4.5"/>
        <circle cx="85" cy="118" r="4.5" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
        <circle cx="195" cy="118" r="3.5" fill="var(--ink)"/>
        <line x1="67" y1="126" x2="103" y2="126" stroke="var(--ink)" stroke-width="1.1"/>
        <path d="M73 126 L67 134 M81 126 L75 134 M89 126 L83 134 M97 126 L91 134" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <circle cx="140" cy="118" r="3" fill="var(--flag)"/>
        <text x="78" y="110" font-size="10" text-anchor="end" fill="var(--ink)">A</text>
        <text x="202" y="110" font-size="10" fill="var(--ink)">B</text>
        <text x="140" y="106" font-size="10" text-anchor="middle" fill="var(--flag)">G</text>
        <text x="85" y="76" font-size="9.5" text-anchor="middle" fill="var(--ink)">(1)</text>
        <text x="195" y="76" font-size="9.5" text-anchor="middle" fill="var(--ink)">(2)</text>
        <text x="140" y="146" font-size="9.5" text-anchor="middle" fill="var(--ink)">(3)</text>
        <line x1="85" y1="38" x2="195" y2="38" stroke="var(--faint)" stroke-width="0.9"/>
        <path d="M85 34 L85 42 M195 34 L195 42" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <text x="140" y="31" font-size="9" text-anchor="middle" fill="var(--faint)">200 mm</text>
        <text x="140" y="197" font-size="9" text-anchor="middle" fill="var(--faint)">las dos ruedas tienen radio 100 mm</text>
      </svg>
      <figcaption>

      Las dos ruedas son iguales, de radio **100 mm**, y engranan en el punto
      medio de **AB**, que es también el centro de gravedad **G** de la barra.
      La rueda **(1)** está montada sobre el apoyo fijo **A**. Dibujada a
      escala.

      </figcaption>
      </figure>
    pide: La aceleración angular del engranaje (2) y la aceleración del punto B.
    pasos:
      - tipo: reconocer
        pregunta: |
          El engranaje (1) está fijo al suelo. ¿Qué relación hay entre su
          aceleración angular $\alpha_2$ y la $\alpha_3$ de la barra?
        opciones:
          - texto: El doble, porque el engranaje (2) rueda sobre el (1), que está quieto
            correcta: true
            mensaje: |
              Eso es. Es el planeta que rueda sobre un sol del mismo radio: su
              rotación absoluta es el doble que la del brazo,
              $\alpha_2 = 2\alpha_3$.
          - texto: La misma, porque la barra y el engranaje están unidos en B
            mensaje: |
              La barra y el engranaje comparten el punto $B$, no la rotación:
              en $B$ hay una articulación, y el engranaje gira respecto de la
              barra porque sus dientes recorren los del engranaje fijo.
          - texto: La mitad, porque el radio del engranaje es la mitad de la distancia entre centros
            mensaje: |
              Los radios entran, pero al revés: cuanto más pequeño es el
              engranaje, **más** deprisa gira. Con radios iguales sale el
              doble.
          - texto: Cero, porque el centro del engranaje describe una circunferencia y el engranaje solo traslada
            mensaje: |
              Trasladar significa que todos sus puntos llevan la misma
              velocidad, y aquí el punto de contacto está parado mientras el
              centro se mueve: eso es rotación.

      - tipo: calcular
        titulo: La aceleración angular de la barra
        pregunta: |
          Con $g = 9{,}81\ \text{m/s}^{2}$, ¿cuánto vale $\alpha_3$, la
          aceleración angular de la barra $AB$, en valor absoluto?
        respuesta:
          tipo: numero
          valor: '36.18'
          tolerancia: 0.06
          formato: un número, en rad/s²
        distractores:
          - valor: '43.05'
            mensaje: |
              Has tomado momentos en $A$ para todo el sistema sin contar la
              fuerza del diente, que actúa a $L/2$ de $A$. No es interna: el
              engranaje (1) está unido al suelo, así que esa fuerza es
              exterior y sí da momento.
          - valor: '53.14'
            mensaje: |
              Has tratado el engranaje (2) como una masa puntual en $B$. Gira
              con $\alpha_2 = 2\alpha_3$, y su radio de giro de 75 mm aporta
              casi un tercio de la inercia equivalente.
          - valor: '47.56'
            mensaje: |
              Has puesto $\alpha_2 = \alpha_3$ en la inercia del engranaje. Al
              ser el doble, el término entra al cuadrado en la energía y por
              cuatro en la inercia equivalente.
        pista: |
          Inercia equivalente respecto de $A$:
          $\frac{m_3L^{2}}{3} + m_2L^{2} + 4m_2 r_G^{2}$. El momento motor es
          el de los dos pesos, $g\!\left(m_3\frac{L}{2} + m_2 L\right)$.
        desarrollo: |
          $$
          g\!\left(m_3\frac{L}{2} + m_2L\right)
          = \left(\frac{m_3L^{2}}{3} + m_2L^{2} + 4m_2r_G^{2}\right)\alpha_3
          $$

          $$
          \frac{12{,}753}{0{,}3525} = 36{,}18\ \text{rad/s}^{2}
          $$

      - tipo: calcular
        titulo: La aceleración angular del engranaje (2)
        pregunta: |
          ¿Y cuánto vale $\alpha_2$, la del engranaje (2), en valor absoluto?
        respuesta:
          tipo: numero
          valor: '72.36'
          tolerancia: 0.12
          formato: un número, en rad/s²
        distractores:
          - valor: '36.18'
            mensaje: |
              Esa es la de la barra. El engranaje gira al doble porque rueda
              sobre el (1), que está fijo. Es además el número que imprime la
              colección en este apartado, y ahí se equivoca de sólido: su
              propia resolución publica 72,36.
          - valor: '18.09'
            mensaje: |
              Has dividido entre dos en vez de multiplicar. La rueda pequeña
              que rueda sobre otra gira **más** deprisa que el brazo, no menos.
          - valor: '108.5'
            mensaje: |
              Has usado el factor 3, que sería el cociente entre la distancia
              entre centros y el radio si el centro estuviera quieto. Con dos
              ruedas iguales el factor es 2.
        pista: |
          Es la relación de rodadura del paso anterior aplicada a las
          aceleraciones angulares.
        desarrollo: |
          $$
          \alpha_2 = 2\,\alpha_3 = 2 \cdot 36{,}18 = 72{,}36\ \text{rad/s}^{2}
          $$

      - tipo: calcular
        titulo: La aceleración del punto B
        pregunta: |
          ¿Cuánto vale el módulo de la aceleración del punto $B$?
        respuesta:
          tipo: magnitud
          valor: '7.236 m/s^2'
          tolerancia: 0.01
          formato: en m/s², con tres cifras
        distractores:
          - valor: '14.47 m/s^2'
            mensaje: |
              Has multiplicado por $\alpha_2$. $B$ es el centro del engranaje y
              describe una circunferencia de radio $L$ alrededor de $A$, así
              que su aceleración la manda la barra: $a_B = \alpha_3 L$.
          - valor: '3.618 m/s^2'
            mensaje: |
              Has usado $L/2$. $B$ está a la distancia $L$ entera del punto
              fijo $A$; $L/2$ es donde está el centro de la barra.
        pista: |
          Al soltar el sistema $\omega = 0$, así que $B$ solo tiene componente
          tangencial: $a_B = \alpha_3 L$.
        desarrollo: |
          $$
          a_B = \alpha_3 L = 36{,}18 \cdot 0{,}2 = 7{,}236\ \text{m/s}^{2}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Rodadura sobre el engranaje fijo: $\alpha_2 = 2\alpha_3$, y como se parte del reposo, $a_B = \alpha_3 L$ sin término normal.'
          - texto: La inercia equivalente respecto de A es $\frac{m_3L^{2}}{3} + m_2L^{2} + 4m_2r_G^{2} = 0{,}3525$ kg m².
          - texto: 'Los pesos dan el momento motor $g\!\left(m_3\frac{L}{2}+m_2L\right) = 12{,}75$ N m, y de ahí $\alpha_3 = 36{,}18$ y $\alpha_2 = 72{,}36$ rad/s².'
          - texto: La fuerza entre los dientes es interna al conjunto, así que basta con tomar momentos en A sumando las inercias de la barra y del engranaje.
            trampa: true
            mensaje: |
              El engranaje (1) está unido al suelo, así que la fuerza del
              diente es **exterior** y da momento $F_t\,L/2$ respecto de $A$.
              Tomando momentos así, sin ella, salen 43,0 rad/s² en vez de 36,2.
    resolucion: |
      **La cinemática.** El engranaje (2) rueda sobre el (1), que está fijo, y
      los dos tienen el mismo radio $L/2$. El punto de contacto pertenece a los
      dos, así que su velocidad es nula y el engranaje gira al doble que el
      brazo:

      $$
      \alpha_2 = 2\,\alpha_3
      \qquad
      a_B = \alpha_3 L
      $$

      **La ecuación del movimiento.** Sale más limpia por energía —o, lo que es
      lo mismo, por trabajos virtuales— porque así no aparece la fuerza entre
      los dientes. La inercia equivalente respecto de $A$ es la suma de la
      barra girando en $A$, el engranaje trasladando y el engranaje girando al
      doble:

      $$
      I_{eq} = \frac{m_3L^{2}}{3} + m_2L^{2} + 4m_2r_G^{2}
      = 0{,}04 + 0{,}20 + 0{,}1125 = 0{,}3525\ \text{kg m}^{2}
      $$

      $$
      g\!\left(m_3\frac{L}{2} + m_2L\right) = I_{eq}\,\alpha_3
      \;\Longrightarrow\;
      \alpha_3 = \frac{12{,}753}{0{,}3525} = 36{,}18\ \text{rad/s}^{2}
      $$

      $$
      \alpha_2 = 72{,}36\ \text{rad/s}^{2}
      \qquad
      a_B = 7{,}236\ \text{m/s}^{2}
      $$

      **Por qué no vale tomar momentos en A a lo bruto.** Si se escribe
      $\sum M_A = I_{eq}'\alpha_3$ con $I_{eq}' = \frac{m_3L^{2}}{3} + m_2L^{2} + 2m_2r_G^{2}$
      —es decir, sumando $I_{G2}\alpha_2$ y el momento de $m_2a_B$— falta la
      fuerza tangencial del diente, que actúa a $L/2$ de $A$ y vale 20,4 N.
      Con ella la cuenta vuelve a cuadrar; sin ella salen 43,0 rad/s².
  - id: ejma12-col124-la-viga-cuando-se-rompe-el-cable
    titulo: La viga cuando se rompe el cable
    fuente: >-
      Ejercicio 12.4 · Tema 12, «Dinámica del sólido con movimiento plano» ·
      Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección publica el
      resultado, contra el que está contrastado el desarrollo, y se ha
      comprobado también con la resolución oficial del profesor. La colección
      imprime la reacción como 4/7 W g, con una g de más: el enunciado llama W
      al PESO, así que la reacción es 4W/7, que es lo que escribe la
      resolución oficial cuando la pone como 4mg/7.
    nivel: practica
    enunciado: |
      Una viga uniforme de longitud $L$ y peso $W$ está sostenida en la forma
      indicada en la figura. Si el cable se rompe repentinamente, calcular:

      a) Aceleración del extremo $B$.

      b) Reacción en el soporte del pasador $C$.

      <figure>
      <svg viewBox="0 0 300 180" role="img" width="300" height="180" aria-labelledby="ma12c4-t ma12c4-d">
        <title id="ma12c4-t">Viga horizontal con un pasador a L partido por cuatro del extremo A y un cable en B</title>
        <desc id="ma12c4-d">Una viga horizontal uniforme de longitud L va del extremo A, a la izquierda, al extremo B, a la derecha. Un pasador fijo la sujeta en el punto C, situado a L partido por cuatro de A. Del extremo B sale un cable vertical que la cuelga del techo. Es ese cable el que se rompe.</desc>
        <rect x="248" y="26" width="44" height="14" fill="var(--faint)" fill-opacity="0.4" stroke="var(--ink)" stroke-width="1.1"/>
        <path d="M254 40 L248 48 M264 40 L258 48 M274 40 L268 48 M284 40 L278 48" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="270" y1="40" x2="270" y2="105" stroke="var(--ink)" stroke-width="1.2"/>
        <rect x="30" y="100" width="240" height="10" fill="var(--faint)" fill-opacity="0.25" stroke="var(--ink)" stroke-width="1.3"/>
        <rect x="79" y="96" width="22" height="18" rx="4" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/>
        <circle cx="90" cy="105" r="3.5" fill="var(--ink)"/>
        <line x1="70" y1="120" x2="110" y2="120" stroke="var(--ink)" stroke-width="1.1"/>
        <path d="M76 120 L70 128 M86 120 L80 128 M96 120 L90 128 M106 120 L100 128" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <text x="24" y="109" font-size="10" text-anchor="end" fill="var(--ink)">A</text>
        <text x="277" y="109" font-size="10" fill="var(--ink)">B</text>
        <text x="90" y="90" font-size="10" text-anchor="middle" fill="var(--ink)">C</text>
        <line x1="30" y1="70" x2="90" y2="70" stroke="var(--faint)" stroke-width="0.9"/>
        <path d="M30 66 L30 74 M90 66 L90 74" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <text x="60" y="63" font-size="9" text-anchor="middle" fill="var(--faint)">L/4</text>
        <line x1="30" y1="146" x2="270" y2="146" stroke="var(--faint)" stroke-width="0.9"/>
        <path d="M30 142 L30 150 M270 142 L270 150" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <text x="150" y="140" font-size="9" text-anchor="middle" fill="var(--faint)">L</text>
        <circle cx="150" cy="105" r="2.6" fill="var(--flag)"/>
        <text x="150" y="171" font-size="9" text-anchor="middle" fill="var(--flag)">el centro de gravedad está en L/2, a L/4 del pasador</text>
      </svg>
      <figcaption>

      El pasador **C** está a **L/4** del extremo **A**, y el centro de
      gravedad, en el punto medio: entre los dos hay **L/4**. Del extremo **B**
      cuelga el cable que se rompe. Dibujada a escala.

      </figcaption>
      </figure>
    pide: La aceleración del extremo B y la reacción vertical del pasador C.
    pasos:
      - tipo: reconocer
        pregunta: |
          Roto el cable, ¿dónde conviene tomar momentos y con qué momento de
          inercia?
        opciones:
          - texto: En C, que es un punto fijo de la viga, con I respecto de C
            correcta: true
            mensaje: |
              Eso es. $C$ no se mueve, así que $\sum M_C = I_C\,\alpha$ con
              $I_C = \frac{ML^{2}}{12} + M\!\left(\frac{L}{4}\right)^{2}
              = \frac{7ML^{2}}{48}$, y la reacción del pasador no da momento.
          - texto: En C, pero con el momento de inercia central I_G
            mensaje: |
              Ese es el error clásico. $\sum M_O = I_O\alpha$ solo vale con el
              momento de inercia respecto **de ese** punto; con $I_G$ sale
              $\alpha = 3g/L$ en vez de $12g/(7L)$, casi el doble.
          - texto: En G, porque ahí siempre vale la suma de momentos igual a I_G por alfa
            mensaje: |
              Vale, y es correcto, pero entonces la reacción del pasador
              aparece en la ecuación y hace falta combinarla con la de fuerzas.
              En $C$ sale $\alpha$ de una sola ecuación.
          - texto: En B, el extremo que estaba colgado
            mensaje: |
              $B$ no es un punto fijo ni es $G$, así que habría que escribir
              $\sum M_B = I_G\alpha + (\overrightarrow{BG}\times M\vec{a}_G)_z$.
              Se puede, pero no elimina ninguna incógnita.

      - tipo: calcular
        titulo: La aceleración del extremo B
        pregunta: |
          Con $g = 9{,}81\ \text{m/s}^{2}$, ¿cuánto vale la aceleración del
          extremo $B$ justo al romperse el cable? Fíjate en que no depende de
          $L$.
        respuesta:
          tipo: magnitud
          valor: '12.613 m/s^2'
          tolerancia: 0.01
          formato: en m/s², con cuatro cifras
        distractores:
          - valor: '9.81 m/s^2'
            mensaje: |
              Has supuesto que $B$ cae libre. El extremo largo de una viga que
              pivota baja **más** deprisa que $g$: aquí $9g/7$. Quien no puede
              pasar de $g$ es el centro de gravedad, y de hecho baja $3g/7$.
          - valor: '22.07 m/s^2'
            mensaje: |
              Has usado $I_G$ tomando momentos en $C$. Como $C$ es un punto
              fijo distinto de $G$, hay que llevar el momento de inercia a $C$
              con Steiner: $I_C = \frac{7ML^{2}}{48}$.
          - valor: '16.82 m/s^2'
            mensaje: |
              Es $\alpha L$: has puesto $B$ a la distancia $L$ del pasador. La
              distancia de $C$ a $B$ es $3L/4$, porque $C$ está a $L/4$ de $A$.
          - valor: '4.204 m/s^2'
            mensaje: |
              Es la aceleración del centro de gravedad, $3g/7$. La de $B$ es
              tres veces mayor, porque $B$ está a $3L/4$ del pasador y $G$
              solo a $L/4$.
        pista: |
          $\sum M_C = I_C\alpha$ con $I_C = \frac{7ML^{2}}{48}$ y el peso
          actuando a $L/4$ del pasador; después $a_B = \alpha\,\frac{3L}{4}$.
        desarrollo: |
          $$
          Mg\,\frac{L}{4} = \frac{7ML^{2}}{48}\,\alpha
          \;\Longrightarrow\;
          \alpha = \frac{12g}{7L}
          \qquad
          a_B = \alpha\,\frac{3L}{4} = \frac{9g}{7} = 12{,}613\ \text{m/s}^{2}
          $$

      - tipo: calcular
        titulo: La reacción del pasador
        pregunta: |
          La reacción vertical vale $C_y = c\,W$, con $W$ el peso de la viga.
          ¿Cuánto vale $c$?
        respuesta:
          tipo: numero
          valor: '0.5714286'
          tolerancia: 0.002
          formato: un número, sin unidad (el coeficiente de W)
        distractores:
          - valor: '1'
            mensaje: |
              Es lo que sostiene el pasador con la viga quieta. Al romperse el
              cable $G$ empieza a bajar con $3g/7$, y esa parte del peso ya no
              la aguanta nadie.
          - valor: '0.4285714'
            mensaje: |
              Es $3/7$, o sea $Ma_G$ en vez de $W - Ma_G$. Has puesto el
              término de inercia donde va la reacción.
          - valor: '0.25'
            mensaje: |
              Parece un reparto de la estática por distancias, pero aquí no hay
              dos apoyos que repartirse el peso: solo queda el pasador, y lo
              que descarga la reacción es la aceleración de $G$.
        pista: |
          $a_G = \alpha\frac{L}{4}$ hacia abajo, y el teorema del momento
          lineal en vertical dice $W - C_y = M a_G$.
        desarrollo: |
          $$
          a_G = \frac{12g}{7L}\cdot\frac{L}{4} = \frac{3g}{7}
          \qquad
          C_y = M\!\left(g - \frac{3g}{7}\right) = \frac{4}{7}\,W = 0{,}5714\,W
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'El pasador C es un punto fijo de la viga, así que $\sum M_C = I_C\alpha$ con $I_C = \frac{ML^{2}}{12} + M\frac{L^{2}}{16} = \frac{7ML^{2}}{48}$.'
          - texto: El peso actúa en G, a $L/4$ del pasador, y de ahí $\alpha = \frac{12g}{7L}$ y $a_B = \alpha\frac{3L}{4} = \frac{9g}{7}$.
          - texto: 'Momento lineal en vertical: $W - C_y = M\alpha\frac{L}{4} = \frac{3}{7}W$, luego $C_y = \frac{4}{7}W$.'
          - texto: Justo al romperse el cable la viga todavía no se ha movido, así que el pasador sigue sosteniendo el peso entero.
            trampa: true
            mensaje: |
              No haberse movido significa velocidad nula, no aceleración nula.
              En ese mismo instante $G$ ya baja con $3g/7$, y el pasador
              sostiene solo $4W/7$.
    resolucion: |
      **La aceleración angular.** Roto el cable quedan el peso y el pasador.
      $C$ es un punto fijo de la viga, así que tomando momentos ahí la reacción
      desaparece y hace falta el momento de inercia respecto de $C$:

      $$
      I_C = \frac{ML^{2}}{12} + M\!\left(\frac{L}{4}\right)^{2}
      = \frac{7ML^{2}}{48}
      \qquad
      Mg\,\frac{L}{4} = I_C\,\alpha
      \;\Longrightarrow\;
      \alpha = \frac{12g}{7L}
      $$

      **El extremo B.** Al romperse el cable la velocidad angular es nula, así
      que $B$ solo tiene aceleración tangencial, y está a $3L/4$ del pasador:

      $$
      a_B = \alpha\,\frac{3L}{4} = \frac{9g}{7} = 12{,}61\ \text{m/s}^{2}
      $$

      Sale mayor que $g$, y no hay contradicción: la viga no cae libre, pivota,
      y el pasador empuja hacia arriba la parte corta mientras la larga baja.

      **La reacción.** El centro de gravedad está a $L/4$ del pasador, así que
      baja con $a_G = \alpha L/4 = 3g/7$:

      $$
      W - C_y = M\,\frac{3g}{7}
      \;\Longrightarrow\;
      C_y = \frac{4}{7}\,W
      $$

      Y la horizontal es nula, porque $a_{Gx} = 0$: al partir del reposo la
      aceleración de $G$ es perpendicular a $CG$, o sea vertical.

  - id: ejma12-col125-la-barra-con-muelle-en-dos-ranuras
    titulo: La barra con muelle que desliza en dos ranuras
    fuente: >-
      Ejercicio 12.5 · Tema 12, «Dinámica del sólido con movimiento plano» ·
      Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección publica el
      resultado, contra el que está contrastado el desarrollo, y se ha
      comprobado también con la resolución oficial del profesor. Con g = 9,81
      m/s2 la cuenta da 3,839 rad/s y 2,438 m/s; la colección imprime 3,836 y
      2,436, un 0,08 por ciento menos, que es redondeo y no discrepancia.
    nivel: practica
    enunciado: |
      Los extremos de la barra $AB$ de 4 kg y 635 mm de longitud están
      obligados a moverse, como se muestra, por las ranuras abiertas en un
      plano vertical. Al extremo $A$ se sujeta un muelle de constante
      $k$ = 525 N/m de tal modo que su tensión es nula cuando $\theta$ = 0º. Si
      la barra se abandona en reposo cuando $\theta$ = 50º, calcular su
      velocidad angular y la velocidad en el extremo cuando $\theta$ = 0º.

      <figure>
      <svg viewBox="0 0 300 258" role="img" width="300" height="258" aria-labelledby="ma12c5-t ma12c5-d">
        <title id="ma12c5-t">Barra AB con los extremos en una ranura horizontal y otra vertical, y un muelle en A</title>
        <desc id="ma12c5-d">Una ranura horizontal en la parte alta guia el extremo A de la barra; una ranura vertical, a la derecha, guia el extremo B. La barra baja de A hacia B formando el angulo theta con la horizontal, dibujado en 50 grados. Un muelle une la pared izquierda con el extremo A, y no esta deformado cuando la barra queda horizontal.</desc>
        <line x1="28" y1="42" x2="182" y2="42" stroke="var(--ink)" stroke-width="1.2"/>
        <line x1="28" y1="68" x2="182" y2="68" stroke="var(--ink)" stroke-width="1.2"/>
        <path d="M34 42 L28 34 M50 42 L44 34 M66 42 L60 34 M82 42 L76 34 M98 42 L92 34 M114 42 L108 34 M130 42 L124 34 M146 42 L140 34 M162 42 L156 34 M178 42 L172 34" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <path d="M34 76 L28 68 M50 76 L44 68 M66 76 L60 68 M82 76 L76 68 M98 76 L92 68 M114 76 L108 68 M130 76 L124 68 M146 76 L140 68 M162 76 L156 68" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="28" y1="42" x2="28" y2="68" stroke="var(--ink)" stroke-width="1.2"/>
        <line x1="180" y1="68" x2="180" y2="242" stroke="var(--ink)" stroke-width="1.2"/>
        <line x1="206" y1="42" x2="206" y2="242" stroke="var(--ink)" stroke-width="1.2"/>
        <line x1="180" y1="242" x2="206" y2="242" stroke="var(--ink)" stroke-width="1.2"/>
        <path d="M174 82 L168 74 M174 102 L168 94 M174 122 L168 114 M174 142 L168 134 M174 162 L168 154 M174 182 L168 174 M174 202 L168 194 M174 222 L168 214" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <path d="M218 56 L212 48 M218 76 L212 68 M218 96 L212 88 M218 116 L212 108 M218 136 L212 128 M218 156 L212 148 M218 176 L212 168 M218 196 L212 188 M218 216 L212 208 M218 236 L212 228" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <path d="M30 55 L38 55 L41 48 L47 62 L53 48 L59 62 L62 55 L62 55" fill="none" stroke="var(--live)" stroke-width="1.4"/>
        <line x1="62" y1="55" x2="70" y2="55" stroke="var(--live)" stroke-width="1.4"/>
        <line x1="70" y1="55" x2="193" y2="202" stroke="var(--ink)" stroke-width="4.5"/>
        <line x1="70" y1="55" x2="160" y2="55" stroke="var(--faint)" stroke-width="0.8" stroke-dasharray="7 3 2 3"/>
        <path d="M108 55 A38 38 0 0 1 94 80" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <text x="110" y="76" font-size="9.5" fill="var(--faint)">θ</text>
        <circle cx="70" cy="55" r="5" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
        <circle cx="193" cy="202" r="5" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
        <text x="70" y="32" font-size="10" text-anchor="middle" fill="var(--ink)">A</text>
        <text x="222" y="206" font-size="10" fill="var(--ink)">B</text>
        <text x="74" y="152" font-size="9" fill="var(--faint)">635 mm</text>
        <text x="34" y="92" font-size="9" fill="var(--live)">k = 525 N/m</text>
      </svg>
      <figcaption>

      El extremo **A** corre por la ranura horizontal y **B** por la vertical.
      El ángulo **θ** se mide desde la horizontal, y el muelle está sin
      deformar cuando la barra queda horizontal, es decir con **θ = 0**.
      Dibujada a escala con θ = 50°.

      </figcaption>
      </figure>
    pide: La velocidad angular de la barra y la velocidad de B cuando theta vale cero.
    pasos:
      - tipo: reconocer
        pregunta: |
          En la posición final, $\theta = 0$, ¿dónde está el centro
          instantáneo de rotación de la barra?
        opciones:
          - texto: En A, porque ahí la velocidad va a lo largo de la barra y en B es perpendicular a ella
            correcta: true
            mensaje: |
              Eso es. Con la barra horizontal, $A$ se mueve por la ranura
              horizontal —o sea a lo largo de la barra— y $B$ por la vertical.
              Las dos perpendiculares se cortan en $A$: $v_A = 0$ y
              $v_B = \omega L$.
          - texto: En B, porque es el extremo que baja
            mensaje: |
              Si $B$ fuera el centro instantáneo tendría velocidad nula, y es
              justo el punto cuya velocidad pide el enunciado.
          - texto: En el punto medio de la barra
            mensaje: |
              Eso pasaría si los dos extremos llevasen velocidades iguales y
              opuestas. Aquí en $\theta = 0$ la de $A$ es nula, así que el
              centro instantáneo es $A$.
          - texto: No hay, porque la barra no gira alrededor de ningún punto fijo
            mensaje: |
              El centro instantáneo no tiene que ser un punto fijo ni estar en
              el sólido: existe siempre que el movimiento plano no sea una
              traslación, y va cambiando de sitio.

      - tipo: calcular
        titulo: El alargamiento inicial del muelle
        pregunta: |
          ¿Cuánto está estirado el muelle en la posición de partida,
          $\theta = 50^\circ$?
        respuesta:
          tipo: magnitud
          valor: '0.2268 m'
          tolerancia: 0.01
          formato: en metros, con cuatro cifras
        distractores:
          - valor: '0.4864 m'
            mensaje: |
              Es $L\sin 50^\circ$, o sea lo que baja $B$ por su ranura. El
              muelle está en la ranura horizontal, así que lo que lo estira es
              el desplazamiento **horizontal** de $A$.
          - valor: '0.1486 m'
            mensaje: |
              Has cambiado el seno por el coseno: $L(1-\sin 50^\circ)$. La
              distancia horizontal de $A$ a la ranura vertical es
              $L\cos\theta$, así que el alargamiento es $L(1-\cos 50^\circ)$.
          - valor: '0.635 m'
            mensaje: |
              Es la barra entera. El muelle solo se estira lo que $A$ se
              separa de su posición de $\theta = 0$, no toda la longitud.
        pista: |
          La distancia horizontal entre $A$ y la ranura vertical vale
          $L\cos\theta$, y en $\theta = 0$ vale $L$.
        desarrollo: |
          $$
          \delta = L\,(1-\cos 50^\circ) = 0{,}635\cdot 0{,}35721
          = 0{,}2268\ \text{m}
          $$

      - tipo: calcular
        titulo: La velocidad angular en theta igual a cero
        pregunta: |
          Con $g = 9{,}81\ \text{m/s}^{2}$, ¿cuánto vale la velocidad angular
          de la barra al llegar a $\theta = 0$?
        respuesta:
          tipo: numero
          valor: '3.839'
          tolerancia: 0.012
          formato: un número, en rad/s
        distractores:
          - valor: '7.088'
            mensaje: |
              Te has olvidado del peso. Al pasar de 50º a 0º el centro de la
              barra **sube** $\frac{L}{2}\sin 50^\circ$, así que la gravedad se
              come 9,54 de los 13,51 J que suelta el muelle.
          - valor: '7.679'
            mensaje: |
              Solo has puesto la energía de rotación, $\tfrac12 I_G\omega^{2}$.
              El centro de gravedad también se mueve: falta
              $\tfrac12 M v_G^{2}$ con $v_G = \omega L/2$.
          - valor: '13.98'
            mensaje: |
              Has estirado el muelle $L\sin 50^\circ$ en vez de
              $L(1-\cos 50^\circ)$: la energía elástica va con el cuadrado, así
              que ese error multiplica por más de cuatro el término del muelle.
        pista: |
          $\tfrac12 k\delta^{2} - Mg\frac{L}{2}\sin 50^\circ
          = \tfrac12 M v_G^{2} + \tfrac12 I_G\omega^{2}$, con $A$ de centro
          instantáneo: $v_G = \omega L/2$ e $I_G = ML^{2}/12$.
        desarrollo: |
          $$
          \tfrac12 k\,\delta^{2} - Mg\,\frac{L}{2}\sin 50^\circ
          = \frac{ML^{2}}{6}\,\omega^{2}
          $$

          $$
          13{,}506 - 9{,}544 = 0{,}26882\,\omega^{2}
          \;\Longrightarrow\;
          \omega = 3{,}839\ \text{rad/s}
          $$

      - tipo: calcular
        titulo: La velocidad del extremo B
        pregunta: |
          ¿Y cuánto vale la velocidad del extremo $B$ en ese instante?
        respuesta:
          tipo: magnitud
          valor: '2.438 m/s'
          tolerancia: 0.01
          formato: en m/s, con cuatro cifras
        distractores:
          - valor: '1.219 m/s'
            mensaje: |
              Es la velocidad del centro de gravedad, $\omega L/2$. $B$ está al
              doble de distancia del centro instantáneo $A$.
          - valor: '4.876 m/s'
            mensaje: |
              Has puesto $B$ a $2L$ del centro instantáneo. El centro
              instantáneo es $A$, y $AB$ vale $L$, no $2L$.
        pista: |
          Con el centro instantáneo en $A$, $v_B = \omega\,\overline{AB}$.
        desarrollo: |
          $$
          v_B = \omega L = 3{,}839\cdot 0{,}635 = 2{,}438\ \text{m/s}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Las ranuras no rozan y no hay más fuerzas no conservativas: se conserva la suma de energía cinética, potencial gravitatoria y elástica.'
          - texto: 'De 50º a 0º el muelle suelta $\tfrac12 k L^{2}(1-\cos 50^\circ)^{2} = 13{,}51$ J y el peso absorbe $Mg\frac{L}{2}\sin 50^\circ = 9{,}54$ J.'
          - texto: 'En θ = 0 el centro instantáneo es A, así que $T = \tfrac12 M(\omega L/2)^{2} + \tfrac12\frac{ML^{2}}{12}\omega^{2} = \frac{ML^{2}}{6}\omega^{2}$, y sale ω = 3,84 rad/s.'
          - texto: Como A es el centro instantáneo de rotación y su velocidad es nula, la barra no tiene energía cinética de traslación en esa posición.
            trampa: true
            mensaje: |
              El que está parado es $A$, no el centro de gravedad. $G$ lleva
              $\omega L/2 = 1{,}22$ m/s, y su energía de traslación vale
              2,97 J de los 3,96 totales: tres cuartas partes.
    resolucion: |
      **Qué energía se mueve.** Nada roza, así que se conserva la energía
      mecánica. Entre $\theta = 50^\circ$ y $\theta = 0^\circ$ pasan dos cosas
      opuestas: el muelle se relaja y el centro de la barra **sube**.

      $$
      \delta = L(1-\cos 50^\circ) = 0{,}2268\ \text{m}
      \qquad
      \tfrac12 k\delta^{2} = 13{,}51\ \text{J}
      $$

      $$
      Mg\,\frac{L}{2}\sin 50^\circ = 4\cdot 9{,}81\cdot 0{,}2432 = 9{,}54\ \text{J}
      $$

      **La cinemática de la posición final.** Con la barra horizontal, $A$ se
      mueve a lo largo de la barra y $B$ perpendicularmente: el centro
      instantáneo de rotación es $A$. Entonces $v_G = \omega L/2$ y

      $$
      T = \tfrac12 M\!\left(\frac{\omega L}{2}\right)^{2}
      + \tfrac12\,\frac{ML^{2}}{12}\,\omega^{2}
      = \frac{ML^{2}}{6}\,\omega^{2}
      = 0{,}26882\,\omega^{2}
      $$

      **El resultado.**

      $$
      13{,}51 - 9{,}54 = 0{,}26882\,\omega^{2}
      \;\Longrightarrow\;
      \omega = 3{,}839\ \text{rad/s}
      \qquad
      v_B = \omega L = 2{,}438\ \text{m/s}
      $$

      Conviene fijarse en el orden de magnitud: el muelle da 13,5 J y el peso
      se queda con 9,5. Si el muelle fuera un poco más flojo la barra no
      llegaría a la horizontal.

  - id: ejma12-col126-la-barra-colgada-con-una-fuerza-en-b
    titulo: La barra colgada de C con una fuerza en el extremo
    fuente: >-
      Ejercicio 12.6 · Tema 12, «Dinámica del sólido con movimiento plano» ·
      Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección publica el
      resultado, contra el que está contrastado el desarrollo, y se ha
      comprobado también con la resolución oficial del profesor. Los signos son
      los del resultado impreso, con la fuerza P dibujada hacia la izquierda y
      el eje x hacia la derecha.
    nivel: practica
    enunciado: |
      Una barra uniforme de longitud $L$ = 900 mm y masa 4 kg cuelga libremente
      de una articulación en C. Una fuerza horizontal $P$ de 75 N de magnitud
      se aplica en el extremo $B$. Si la distancia $r$ es 225 mm, calcular:

      a) Aceleración angular de la barra.

      b) Reacción en $C$.

      <figure>
      <svg viewBox="0 0 250 270" role="img" width="250" height="270" aria-labelledby="ma12c6-t ma12c6-d">
        <title id="ma12c6-t">Barra vertical articulada en C, con una fuerza horizontal en el extremo inferior</title>
        <desc id="ma12c6-d">Una barra uniforme vertical de 900 milimetros cuelga de una articulacion situada en el punto C. El centro de gravedad G esta en el punto medio, a 225 milimetros por debajo de C, que es la distancia r. En el extremo inferior B se aplica una fuerza horizontal P de 75 newtons dirigida hacia la izquierda.</desc>
        <defs>
          <marker id="ma12c6-p" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--live)"/>
          </marker>
        </defs>
        <rect x="134" y="35" width="12" height="198" fill="var(--faint)" fill-opacity="0.3" stroke="var(--ink)" stroke-width="1.3"/>
        <rect x="126" y="74" width="28" height="20" rx="4" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/>
        <circle cx="140" cy="84" r="3.5" fill="var(--ink)"/>
        <line x1="120" y1="72" x2="120" y2="96" stroke="var(--ink)" stroke-width="1.1"/>
        <path d="M120 78 L112 72 M120 88 L112 82 M120 98 L112 92" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <circle cx="140" cy="134" r="3.5" fill="var(--flag)"/>
        <text x="156" y="80" font-size="10" fill="var(--ink)">C</text>
        <text x="156" y="131" font-size="10" fill="var(--flag)">G</text>
        <text x="147" y="248" font-size="10" fill="var(--ink)">B</text>
        <line x1="134" y1="233" x2="88" y2="233" stroke="var(--live)" stroke-width="2.2" marker-end="url(#ma12c6-p)"/>
        <text x="92" y="226" font-size="10" fill="var(--live)">P = 75 N</text>
        <line x1="100" y1="35" x2="100" y2="134" stroke="var(--faint)" stroke-width="0.9"/>
        <path d="M96 35 L104 35 M96 134 L104 134" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <text x="94" y="88" font-size="9" text-anchor="end" fill="var(--faint)">L/2</text>
        <line x1="100" y1="134" x2="100" y2="233" stroke="var(--faint)" stroke-width="0.9"/>
        <path d="M96 233 L104 233" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <text x="94" y="188" font-size="9" text-anchor="end" fill="var(--faint)">L/2</text>
        <line x1="186" y1="84" x2="186" y2="134" stroke="var(--faint)" stroke-width="0.9"/>
        <path d="M182 84 L190 84 M182 134 L190 134" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <text x="192" y="112" font-size="9" fill="var(--faint)">r</text>
        <text x="125" y="264" font-size="9" text-anchor="middle" fill="var(--faint)">L = 900 mm, r = 225 mm</text>
      </svg>
      <figcaption>

      La barra mide **900 mm** y cuelga de la articulación **C**, que está
      **225 mm** por encima del centro de gravedad **G**. La fuerza **P** de
      **75 N** actúa en el extremo **B**, horizontal y hacia la izquierda.
      Dibujada a escala.

      </figcaption>
      </figure>
    pide: La aceleración angular de la barra y las dos componentes de la reacción en C.
    pasos:
      - tipo: reconocer
        pregunta: |
          $C$ es una articulación fija y $G$ está $r$ por debajo. ¿Con qué
          momento de inercia hay que escribir $\sum M_C = I\,\alpha$?
        opciones:
          - texto: Con I_C = I_G + m r cuadrado, o sea 0,4725 kg m²
            correcta: true
            mensaje: |
              Eso es. $C$ es punto fijo, así que vale $\sum M_C = I_C\alpha$,
              pero con el momento de inercia trasladado a $C$ por Steiner:
              $\frac{4\cdot 0{,}9^{2}}{12} + 4\cdot 0{,}225^{2} = 0{,}4725$.
          - texto: Con I_G = m L cuadrado partido por doce, que es 0,27 kg m²
            mensaje: |
              $I_G$ solo vale en $G$ o acompañado del momento de $M\vec{a}_G$.
              Usarlo tal cual en $C$ da $\alpha = -187{,}5$ en vez de
              $-107{,}1$ rad/s².
          - texto: Con I = m L cuadrado partido por tres, la de una barra que gira por un extremo
            mensaje: |
              Esa es la de una barra articulada en su **extremo**, y aquí $C$
              está a $L/4$ del extremo, no en él. Steiner lo resuelve con la
              distancia real.
          - texto: Con I = m L cuadrado, concentrando toda la masa en el extremo B
            mensaje: |
              La masa está repartida a lo largo de la barra, no concentrada en
              un punto. Concentrarla en $B$ multiplicaría la inercia por más de
              seis.

      - tipo: calcular
        titulo: La aceleración angular
        pregunta: |
          Tomando el eje $x$ hacia la derecha —así que $P$ es negativa—,
          ¿cuánto vale la aceleración angular de la barra?
        respuesta:
          tipo: numero
          valor: '-107.14'
          tolerancia: 0.06
          formato: un número con su signo, en rad/s²
        distractores:
          - valor: '-187.5'
            mensaje: |
              Has usado $I_G$ tomando momentos en $C$. Como $C$ es un punto
              fijo distinto de $G$, el momento de inercia hay que llevarlo allí
              con Steiner: $I_C = 0{,}4725$ y no 0,27.
          - valor: '-71.43'
            mensaje: |
              Has medido el brazo de $P$ desde $G$ y no desde $C$. De $C$ a
              $B$ hay $L/2 + r = 0{,}675$ m, no $L/2$.
          - valor: '-46.88'
            mensaje: |
              Has puesto Steiner con $L/2$ en vez de con $r$. La distancia de
              $C$ a $G$ es $r = 0{,}225$ m, que es justo $L/4$.
        pista: |
          $\sum M_C = I_C\alpha$, con el peso sin momento —está en la vertical
          de $C$— y $P$ actuando a $L/2 + r$ por debajo.
        desarrollo: |
          $$
          -P\,(L/2 + r) = I_C\,\alpha
          \;\Longrightarrow\;
          \alpha = \frac{-75\cdot 0{,}675}{0{,}4725} = -107{,}14\ \text{rad/s}^{2}
          $$

      - tipo: calcular
        titulo: La componente horizontal de la reacción
        pregunta: |
          ¿Cuánto vale $C_x$, la componente horizontal de la reacción en la
          articulación?
        respuesta:
          tipo: magnitud
          valor: '-21.43 N'
          tolerancia: 0.01
          formato: en newtons, con su signo
        distractores:
          - valor: '75 N'
            mensaje: |
              Has planteado equilibrio. La barra no está en equilibrio: $G$
              acelera 24,1 m/s² hacia la izquierda, y esa inercia se lleva casi
              todo el empujón de $P$.
          - valor: '-96.43 N'
            mensaje: |
              Es $M a_{Gx}$ a secas: te has dejado $P$ en la ecuación de
              fuerzas. La reacción es lo que falta para llegar de $P$ a
              $M a_{Gx}$.
        pista: |
          $a_{Gx} = \alpha\,r$, y el teorema del momento lineal dice
          $C_x + P_x = M\,a_{Gx}$ con $P_x = -75$ N.
        desarrollo: |
          $$
          a_{Gx} = \alpha\,r = -107{,}14\cdot 0{,}225 = -24{,}11\ \text{m/s}^{2}
          $$

          $$
          C_x = M a_{Gx} - P_x = 4(-24{,}11) + 75 = -21{,}43\ \text{N}
          $$

      - tipo: calcular
        titulo: La componente vertical de la reacción
        pregunta: |
          ¿Y cuánto vale $C_y$?
        respuesta:
          tipo: magnitud
          valor: '39.24 N'
          tolerancia: 0.01
          formato: en newtons
        distractores:
          - valor: '135.7 N'
            mensaje: |
              Has sumado la aceleración de $G$ a la vertical. Con la barra
              vertical y $\omega = 0$, $\vec{a}_G$ es perpendicular a $CG$, o
              sea **horizontal**: en vertical no hay inercia que sostener.
          - valor: '9.81 N'
            mensaje: |
              Has puesto $g$ donde va $Mg$. La barra pesa $4\cdot 9{,}81 = 39{,}24$ N.
        pista: |
          Al partir del reposo, $\vec{a}_G = \vec{\alpha}\times\overrightarrow{CG}$
          es perpendicular a la barra. Con la barra vertical, eso es
          horizontal.
        desarrollo: |
          $$
          a_{Gy} = 0
          \qquad
          C_y - Mg = 0
          \;\Longrightarrow\;
          C_y = 4\cdot 9{,}81 = 39{,}24\ \text{N}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'C es fijo: $\sum M_C = I_C\alpha$ con $I_C = \frac{ML^{2}}{12} + Mr^{2} = 0{,}4725$ kg m², y el peso no da momento porque G está en la vertical de C.'
          - texto: El momento de P vale $-75\cdot 0{,}675 = -50{,}6$ N m, así que $\alpha = -107{,}14$ rad/s² y $a_{Gx} = \alpha r = -24{,}1$ m/s².
          - texto: 'Momento lineal: $C_x - 75 = Ma_{Gx}$ da $C_x = -21{,}43$ N, y en vertical $C_y = Mg = 39{,}24$ N porque $a_{Gy} = 0$.'
          - texto: Como la barra está girando, el centro de gravedad tiene aceleración normal hacia C y la articulación soporta más que el peso.
            trampa: true
            mensaje: |
              La aceleración normal vale $\omega^{2}r$, y en ese instante
              $\omega = 0$: la barra empieza a moverse. Por eso $\vec{a}_G$ es
              puramente tangencial y $C_y$ vale exactamente el peso.
    resolucion: |
      **La aceleración angular.** La articulación $C$ es un punto fijo, así que
      tomando momentos allí la reacción desaparece; el peso tampoco da momento,
      porque $G$ está justo debajo de $C$. Queda solo $P$, con brazo
      $L/2 + r = 0{,}675$ m:

      $$
      I_C = \frac{ML^{2}}{12} + Mr^{2} = 0{,}27 + 0{,}2025 = 0{,}4725\ \text{kg m}^{2}
      $$

      $$
      \alpha = \frac{-75\cdot 0{,}675}{0{,}4725} = -107{,}14\ \text{rad/s}^{2}
      $$

      **La reacción.** Al aplicar $P$ la barra está en reposo, así que
      $\omega = 0$ y la aceleración de $G$ es solo tangencial:

      $$
      \vec{a}_G = \vec{\alpha}\times\overrightarrow{CG}
      \;\Longrightarrow\;
      a_{Gx} = \alpha r = -24{,}11\ \text{m/s}^{2}
      \qquad
      a_{Gy} = 0
      $$

      $$
      C_x = M a_{Gx} - P_x = -96{,}43 + 75 = -21{,}43\ \text{N}
      \qquad
      C_y = Mg = 39{,}24\ \text{N}
      $$

      **Lo que enseña el signo de $C_x$.** La fuerza empuja hacia la izquierda
      con 75 N y la articulación, en vez de aguantar, también tira hacia la
      izquierda con 21,4 N. No es raro: la barra está acelerando, y entre las
      dos tienen que dar los 96,4 N que pide $M a_{Gx}$.
  - id: ejma12-col127-la-varilla-soldada-al-disco
    titulo: La varilla soldada al disco con muelle
    fuente: >-
      Ejercicio 12.7 · Tema 12, «Dinámica del sólido con movimiento plano» ·
      Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección publica el
      resultado, contra el que está contrastado el desarrollo, y se ha
      comprobado también con la resolución oficial del profesor, de la que se
      toma además la lectura de la figura que el enunciado no dice con
      palabras: el muelle tira de un hilo arrollado al disco, así que al girar
      un ángulo se alarga el arco correspondiente.
    nivel: practica
    enunciado: |
      La varilla (1) de 5 kg está soldada al disco uniforme de 3 kg que gira
      sobre un pasador en $A$. Un resorte constante 80 N/m está unido al disco
      y no está deformado cuando la varilla $AB$ está horizontal (caso
      mostrado). Si se suelta el conjunto desde el reposo como se indica,
      obtener su velocidad angular después de que haya girado un ángulo de 90º.

      <figure>
      <svg viewBox="0 0 300 215" role="img" width="300" height="215" aria-labelledby="ma12c7-t ma12c7-d">
        <title id="ma12c7-t">Disco con pasador en su centro y varilla soldada, con un muelle atado a la periferia</title>
        <desc id="ma12c7-d">Un disco de 125 milimetros de radio gira sobre un pasador fijo situado en su centro A. De A sale hacia la derecha la varilla AB, de 500 milimetros, soldada al disco y dibujada horizontal. Del punto de la periferia diametralmente opuesto a B baja un muelle de 80 newtons por metro hasta un anclaje fijo en el suelo.</desc>
        <circle cx="110" cy="90" r="37.5" fill="var(--faint)" fill-opacity="0.22" stroke="var(--ink)" stroke-width="1.3"/>
        <rect x="110" y="86" width="150" height="8" fill="var(--faint)" fill-opacity="0.35" stroke="var(--ink)" stroke-width="1.2"/>
        <circle cx="110" cy="90" r="4.5" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.4"/>
        <line x1="94" y1="99" x2="126" y2="99" stroke="var(--ink)" stroke-width="1.1"/>
        <path d="M100 99 L94 107 M108 99 L102 107 M116 99 L110 107 M124 99 L118 107" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <circle cx="72.5" cy="90" r="3" fill="var(--live)"/>
        <path d="M72.5 93 L72.5 104 L64 110 L81 118 L64 126 L81 134 L64 142 L81 150 L72.5 156 L72.5 168" fill="none" stroke="var(--live)" stroke-width="1.5"/>
        <rect x="63" y="168" width="19" height="9" rx="2" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.1"/>
        <path d="M67 177 L61 185 M75 177 L69 185 M83 177 L77 185" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <text x="110" y="76" font-size="10" text-anchor="middle" fill="var(--ink)">A</text>
        <text x="266" y="94" font-size="10" fill="var(--ink)">B</text>
        <text x="132" y="66" font-size="9.5" fill="var(--ink)">(1)</text>
        <text x="90" y="140" font-size="9" text-anchor="end" fill="var(--live)">k = 80 N/m</text>
        <line x1="72.5" y1="40" x2="110" y2="40" stroke="var(--faint)" stroke-width="0.9"/>
        <path d="M72.5 36 L72.5 44 M110 36 L110 44" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <text x="91" y="33" font-size="9" text-anchor="middle" fill="var(--faint)">125 mm</text>
        <line x1="110" y1="40" x2="260" y2="40" stroke="var(--faint)" stroke-width="0.9"/>
        <path d="M260 36 L260 44" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <text x="185" y="33" font-size="9" text-anchor="middle" fill="var(--faint)">500 mm</text>
        <text x="150" y="204" font-size="9" text-anchor="middle" fill="var(--faint)">disco 3 kg · varilla 5 kg</text>
      </svg>
      <figcaption>

      El disco, de radio **125 mm**, gira sobre el pasador **A**; la varilla
      **AB**, de **500 mm**, va soldada a él. El muelle cuelga del punto de la
      periferia opuesto a **B**. Dibujada a escala.

      </figcaption>
      </figure>
    pide: La velocidad angular del conjunto después de girar 90 grados.
    pasos:
      - tipo: reconocer
        pregunta: |
          El conjunto gira alrededor del pasador $A$. ¿Cuál es su momento de
          inercia respecto de ese eje?
        opciones:
          - texto: El del disco respecto de su centro más el de la varilla respecto de su extremo
            correcta: true
            mensaje: |
              Eso es: $\tfrac12 m_d R^{2} + \tfrac13 m_v L^{2}
              = 0{,}0234 + 0{,}4167 = 0{,}4401$ kg m². El pasador está en el
              centro del disco, pero en el **extremo** de la varilla.
          - texto: El del disco más el central de la varilla, m L cuadrado partido por doce
            mensaje: |
              Ese es el de la varilla respecto de su punto medio, y el eje pasa
              por su extremo. Falta el término de Steiner
              $m_v(L/2)^{2}$, que es tres veces mayor que el otro.
          - texto: m R cuadrado para el disco, más el de la varilla respecto de su extremo
            mensaje: |
              $mR^{2}$ es el de un aro, con toda la masa en la periferia. Un
              disco macizo tiene $\tfrac12 mR^{2}$, la mitad.
          - texto: El del disco más la varilla como masa puntual en su centro
            mensaje: |
              Concentrar la varilla en su centro da $m_v(L/2)^{2} = 0{,}3125$,
              y le falta justo su inercia propia $m_vL^{2}/12$ para llegar a
              0,4167.

      - tipo: calcular
        titulo: Cuánto se alarga el muelle
        pregunta: |
          El muelle tira de un hilo arrollado a la periferia del disco. ¿Cuánto
          se alarga al girar el conjunto 90º?
        respuesta:
          tipo: magnitud
          valor: '0.19635 m'
          tolerancia: 0.01
          formato: en metros, con cinco cifras
        distractores:
          - valor: '0.17678 m'
            mensaje: |
              Es la cuerda, $R\sqrt{2}$: la distancia en línea recta entre las
              dos posiciones del punto de anclaje. Como el hilo va arrollado,
              lo que se desenrolla es el **arco**, que es algo mayor.
          - valor: '0.125 m'
            mensaje: |
              Es el radio a secas. El arco de un cuarto de vuelta vale
              $R\,\pi/2$, un 57 por ciento más que el radio.
          - valor: '0.7854 m'
            mensaje: |
              Has usado la longitud de la varilla como radio. El hilo se
              arrolla al disco, así que el radio que cuenta es el del disco,
              125 mm.
        pista: |
          Arco = radio por ángulo, con el ángulo en radianes:
          $\delta = R\,\theta$ y $\theta = \pi/2$.
        desarrollo: |
          $$
          \delta = R\,\frac{\pi}{2} = 0{,}125\cdot 1{,}5708 = 0{,}19635\ \text{m}
          $$

      - tipo: calcular
        titulo: La velocidad angular tras el cuarto de vuelta
        pregunta: |
          Con $g = 9{,}81\ \text{m/s}^{2}$, ¿cuánto vale la velocidad angular
          del conjunto cuando ha girado 90º?
        respuesta:
          tipo: numero
          valor: '6.980'
          tolerancia: 0.02
          formato: un número, en rad/s
        distractores:
          - valor: '7.465'
            mensaje: |
              Te has dejado el muelle. Al girar 90º almacena 1,54 J de los
              12,26 que suelta el peso de la varilla: poco, pero no cero.
          - valor: '6.799'
            mensaje: |
              Has usado $m_dR^{2}$ para el disco, que es la inercia de un aro.
              Un disco macizo tiene la mitad.
          - valor: '12.96'
            mensaje: |
              Te has dejado el Steiner de la varilla: has puesto
              $m_vL^{2}/12$ en vez de $m_vL^{2}/3$, y el momento de inercia del
              conjunto se queda en la cuarta parte.
        pista: |
          $m_v g \frac{L}{2} - \tfrac12 k\delta^{2}
          = \tfrac12 I_A\,\omega^{2}$. El centro del disco no baja: está en el
          pasador.
        desarrollo: |
          $$
          5\cdot 9{,}81\cdot 0{,}25 - \tfrac12\cdot 80\cdot 0{,}19635^{2}
          = \tfrac12\cdot 0{,}44010\,\omega^{2}
          $$

          $$
          12{,}2625 - 1{,}5421 = 0{,}22005\,\omega^{2}
          \;\Longrightarrow\;
          \omega = 6{,}980\ \text{rad/s}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'El conjunto gira alrededor del punto fijo A, así que $T = \tfrac12 I_A\omega^{2}$ con $I_A = \tfrac12 m_dR^{2} + \tfrac13 m_vL^{2} = 0{,}4401$ kg m².'
          - texto: 'El único peso que baja es el de la varilla, cuyo centro desciende $L/2$, y suelta $m_vg\frac{L}{2} = 12{,}26$ J.'
          - texto: 'El muelle se alarga el arco $R\pi/2 = 0{,}196$ m y almacena $\tfrac12 k\delta^{2} = 1{,}54$ J; con lo que queda, $\omega = 6{,}98$ rad/s.'
          - texto: El disco también baja su centro de gravedad al girar, y hay que sumar su energía potencial a la de la varilla.
            trampa: true
            mensaje: |
              El centro de gravedad del disco es su propio centro, y ahí está
              el pasador: no se mueve. Del disco solo cuenta la energía de
              rotación, que ya va dentro de $I_A$.
    resolucion: |
      **Qué se conserva.** El pasador no trabaja y el muelle es conservativo,
      así que la energía mecánica se conserva entre la posición inicial y la de
      90º después.

      **El momento de inercia.** El conjunto gira alrededor del punto fijo $A$.
      El pasador está en el centro del disco pero en el extremo de la varilla:

      $$
      I_A = \tfrac12 m_d R^{2} + \tfrac13 m_v L^{2}
      = 0{,}02344 + 0{,}41667 = 0{,}44010\ \text{kg m}^{2}
      $$

      **Las dos energías potenciales.** El centro del disco no se mueve; el de
      la varilla baja $L/2$. Y el muelle, arrollado al disco, se alarga el arco
      $R\theta$:

      $$
      m_v g\,\frac{L}{2} = 12{,}2625\ \text{J}
      \qquad
      \delta = R\,\frac{\pi}{2} = 0{,}19635\ \text{m}
      \qquad
      \tfrac12 k\delta^{2} = 1{,}5421\ \text{J}
      $$

      **El resultado.**

      $$
      12{,}2625 - 1{,}5421 = \tfrac12\cdot 0{,}44010\,\omega^{2}
      \;\Longrightarrow\;
      \omega = 6{,}980\ \text{rad/s}
      $$

      En forma cerrada, $\omega = \sqrt{\dfrac{m_v g/L - k\pi^{2}/64}{m_v/3 + m_d/32}}$
      tomando $L$ como longitud de la varilla y $R = L/4$, que es como lo
      escribe la resolución oficial.

  - id: ejma12-col128-la-placa-colgada-de-dos-barras
    titulo: La placa colgada de dos barras paralelas
    fuente: >-
      Ejercicio 12.8 · Tema 12, «Dinámica del sólido con movimiento plano» ·
      Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección publica el
      resultado, contra el que está contrastado el desarrollo, y se ha
      comprobado también con la resolución oficial del profesor. Los números
      impresos en la hoja de enunciados están redondeados a la baja: dice
      aA = -8,44 m/s2 y F = -48,7 N, mientras que la cuenta exacta da
      8,496 m/s2, que son (raiz de 3 partido por 2) por g, y 47,94 N y 8,70 N
      en las dos barras. La resolución oficial del profesor publica 8,5 m/s2,
      FE = 47,9 N y FF = -8,67 N, que es lo mismo; el sitio publica la cuenta
      exacta. Ojo también a que la figura de la resolución oficial intercambia
      las cotas de la placa: las buenas son las del enunciado, 500 por 200 mm.
    nivel: practica
    enunciado: |
      La placa delgada $ABCD$ (3) tiene una masa de 8 kg y se mantiene en la
      posición indicada por medio del alambre $BH$ y dos barras articuladas (1)
      y (2) de igual longitud desconocida. Para el instante en el que se corta
      el alambre $BH$, hallar:

      a) Aceleración de los puntos $A$, $B$, $C$ y $D$ de la placa (3).

      b) Fuerza sobre las articulaciones $E$ y $F$.

