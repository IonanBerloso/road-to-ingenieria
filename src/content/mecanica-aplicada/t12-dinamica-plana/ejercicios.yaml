      <figcaption>

      El centro del disco no cambia de altura; el de la barra baja. El resorte tiene longitud natural nula: su energía es k l²/2 con su longitud entera. En a), B no se mueve; en b), A y B van paralelas y la barra traslada.

      </figcaption>
      </figure>

      - **Al empezar**, $A$ está arriba y la barra, vertical: $\vec{v}_A$ es
        horizontal y $\vec{v}_B$, vertical, y las perpendiculares se cortan en
        $B$, que es el centro instantáneo de la barra.
      - **Tras 90°**, $A$ queda a la derecha de $O$ y a su altura. $B$ sigue
        en la guía, en la vertical de $O$; como $AB = 2R$ y $A$ está a $R$ de
        la guía, la barra forma 30° con la vertical, y $B$ queda $\sqrt3 R$ por
        encima de $A$.
      - **Las alturas sobre el suelo.** $O$ está a $2R$ y no se mueve; $G$
        pasa de $4R$ a $2R + \tfrac{\sqrt3}{2}R$.
      - **El resorte**, de longitud natural nula, pasa de medir $R$ a medir
        $\sqrt{R^{2} + (2R)^{2}} = \sqrt5 R$.

      **2. Incógnitas.** Para a), ninguna: es una cuenta de energía cinética.
      Para b), solo $\omega$: un grado de libertad y una ecuación, la de la
      energía.

      **3. Ecuaciones.** La reacción en $O$ actúa en un punto fijo, y la de la
      guía es perpendicular al movimiento de $B$: la deslizadera no tiene masa
      y la guía se toma sin rozamiento. Ninguna fuerza no conservativa trabaja:

      $$
      T_1 + V_1 = T_2 + V_2
      $$

      Al empezar, el disco gira alrededor de $O$ y la barra alrededor de $B$,
      con $\omega_b = v_A/L = \omega_0/2$ y $v_G = \omega_0 R/2$:

      $$
      T_1 = \frac12\cdot\frac{MR^{2}}{2}\,\omega_0^{2} + \frac12 M\left(\frac{\omega_0 R}{2}\right)^{2}
      + \frac12\cdot\frac{M(2R)^{2}}{12}\left(\frac{\omega_0}{2}\right)^{2}
      = \frac{5}{12}MR^{2}\omega_0^{2}
      $$

      Tras 90°, $\vec{v}_A$ es vertical, como $\vec{v}_B$: las perpendiculares
      no se cortan, y la barra traslada con $v = \omega R$:

      $$
      T_2 = \frac12\cdot\frac{MR^{2}}{2}\,\omega^{2} + \frac12 M(\omega R)^{2} = \frac34 MR^{2}\omega^{2}
      $$

      Con el suelo como origen de alturas:

      $$
      V_1 = Mg\,2R + Mg\,4R + \tfrac12 kR^{2}
      \qquad
      V_2 = Mg\,2R + Mg\left(2R + \tfrac{\sqrt3}{2}R\right) + \tfrac12 k\,5R^{2}
      $$

      **4. Resultados.** a) Con $MR^{2} = 2{,}5$ kg·m² y $\omega_0 = 5$ rad/s:

      $$
      T_1 = \frac{5}{12} \cdot 2{,}5 \cdot 25 = 26{,}04\ \text{J}
      $$

      De ellos, 15,63 J son del disco y 10,42, de la barra.

      b) Con $MgR = 49{,}05$ J, $\tfrac12 kR^{2} = 12{,}5$ J y
      $\tfrac34 MR^{2} = 1{,}875$ kg·m²:

      $$
      26{,}04 + 294{,}3 + 12{,}5 = 1{,}875\,\omega^{2} + 238{,}68 + 62{,}5
      $$

      $$
      \omega^{2} = \frac{332{,}84 - 301{,}18}{1{,}875} = 16{,}89
      \qquad
      \omega = 4{,}11\ \text{rad/s}
      $$

      **5. Comprobación.** a) Por otro camino: la barra gira alrededor de su
      centro instantáneo, $B$, con $I_B = \tfrac13 M(2R)^{2}$, y
      $\omega_b = 2{,}5$ rad/s:

      $$
      T_{\text{barra}} = \frac12 \cdot \frac{10 \cdot 1^{2}}{3} \cdot 2{,}5^{2} = 10{,}42\ \text{J}
      $$

      La misma. b) Por el trabajo de cada fuerza, sin energías absolutas: el
      peso de la barra trabaja $Mg\left(2R - \tfrac{\sqrt3}{2}R\right)$ al
      bajar $G$, o sea $98{,}1 \cdot 0{,}567 = 55{,}62$ J; el resorte,
      $-\tfrac12 k\,(5R^{2} - R^{2}) = -50$ J; el peso del disco, nada.

      $$
      T_2 = 26{,}04 + 55{,}62 - 50 = 31{,}66\ \text{J}
      \qquad
      \omega = \sqrt{31{,}66/1{,}875} = 4{,}11\ \text{rad/s}
      $$

      **Lo que dice el resultado.** El resorte se lleva 50 J de los 55,6 que
      libera la barra al bajar, y aun así la energía cinética crece, de 26,04
      a 31,66 J. Pero $\omega$ baja, de 5 a 4,11 rad/s: en la segunda posición
      la barra va entera con $\omega R$, sin girar, y su energía cinética es
      $\tfrac12 MR^{2}\omega^{2}$, el triple que al principio para la misma
      $\omega$, cuando giraba alrededor de $B$ y era
      $\tfrac16 MR^{2}\omega^{2}$.
