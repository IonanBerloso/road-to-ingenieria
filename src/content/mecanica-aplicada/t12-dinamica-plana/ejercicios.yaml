    pide: Las fuerzas sobre los eslabones (1) y (2), en newtons.
    pasos:
      - tipo: reconocer
        pregunta: |
          Los dos eslabones son paralelos y de la misma longitud. ¿Qué movimiento
          tiene la estructura soldada al soltarla?
        opciones:
          - texto: Traslación curvilínea, con α = 0 y todos los puntos con la misma aceleración
            correcta: true
            mensaje: |
              Eso es. $ABDC$ es un paralelogramo articulado, así que la estructura
              no gira nunca. Con $\alpha = 0$, la ecuación de momentos se queda en
              $\sum M_G = 0$ y sirve para repartir las dos fuerzas.
          - texto: Rotación alrededor del punto medio E
            mensaje: |
              No hay ningún punto fijo en la estructura. Los dos eslabones giran
              alrededor de $A$ y de $C$, que sí son fijos, pero pertenecen a la
              pared, no a la estructura.
          - texto: Movimiento plano general, con α distinta de cero y desconocida
            mensaje: |
              Lo sería con eslabones de distinta longitud o no paralelos. Aquí
              $\overrightarrow{AB} = \overrightarrow{CD}$, y eso obliga a que la
              estructura mantenga su orientación.
          - texto: Caída libre, porque los eslabones no pesan
            mensaje: |
              Los eslabones no pesan pero sí sujetan. Si la estructura cayera
              libre, $a_G$ sería $g$ hacia abajo, y sale la mitad y además
              inclinada.

      - tipo: calcular
        titulo: La aceleración del centro de gravedad
        pregunta: |
          ¿Cuánto vale el módulo de la aceleración de $G$ nada más soltar el
          sistema, con $g = 9{,}81\ \text{m/s}^{2}$?
        respuesta:
          tipo: magnitud
          valor: '4.905 m/s^2'
          tolerancia: 0.01
          formato: una aceleración, con su unidad
        distractores:
          - valor: '9.81 m/s^2'
            mensaje: |
              Eso sería caída libre. Los eslabones obligan a $G$ a moverse
              perpendicularmente a ellos, y solo la componente del peso en esa
              dirección acelera el conjunto.
          - valor: '8.496 m/s^2'
            mensaje: |
              Has proyectado el peso sobre la dirección del eslabón,
              $g\cos 30^{\circ}$. La componente que mueve el sistema es la
              perpendicular al eslabón, que con 60 grados es $g\cos 60^{\circ}$.
        pista: |
          Con $\omega = 0$, $G$ recorre un arco igual al de los eslabones, así que
          su aceleración es perpendicular a ellos. Proyecta el peso en esa
          dirección.
        desarrollo: |
          Como el conjunto traslada, todos los puntos se mueven como el extremo de
          un eslabón. La componente del peso perpendicular al eslabón es
          $2mg\cos 60^{\circ}$, y la masa que mueve es $2m$,

          $$
          a_G = g\cos 60^{\circ} = \frac{g}{2} = 4{,}905\ \text{m/s}^{2}
          $$

      - tipo: calcular
        titulo: La fuerza del eslabón (1), el de arriba
        pregunta: |
          ¿Cuánto vale el módulo de la fuerza que soporta el eslabón (1), el que
          une $A$ con $B$?
        respuesta:
          tipo: magnitud
          valor: '2.276 N'
          tolerancia: 0.01
          formato: una fuerza, con su unidad
        distractores:
          - valor: '16.99 N'
            mensaje: |
              Has repartido la fuerza total entre los dos eslabones por igual. No
              se reparten igual porque $G$ no está a la misma distancia de las dos
              líneas de acción, y ahí manda la ecuación de momentos.
          - valor: '19.62 N'
            mensaje: |
              Es el peso de una de las barras. Los eslabones no sostienen el peso,
              sino la parte de él que no se convierte en aceleración, y además
              repartida de forma muy desigual.
        pista: |
          Con $\alpha = 0$, la suma de momentos en $G$ es nula. Las dos fuerzas van
          en la dirección de los eslabones, a 60 grados de la horizontal.
        desarrollo: |
          Tomando $G$ a $(0{,}2;\ 0)$ m de $E$, con $B$ y $D$ a $\pm 0{,}4$ m,

          $$
          \sum M_G = -0{,}3732\,F_1 + 0{,}0268\,F_2 = 0
          \;\Longrightarrow\;
          F_2 = 13{,}93\,F_1
          $$

          y de las dos ecuaciones de fuerzas $F_1 + F_2 = 33{,}98$ N. De ahí

          $$
          F_1 = \frac{2\sqrt{3}-3}{4}\,mg = 2{,}276\ \text{N}
          $$

      - tipo: calcular
        titulo: La fuerza del eslabón (2), el de abajo
        pregunta: |
          ¿Y el módulo de la fuerza en el eslabón (2), el que une $C$ con $D$?
        respuesta:
          tipo: magnitud
          valor: '31.71 N'
          tolerancia: 0.01
          formato: una fuerza, con su unidad
        distractores:
          - valor: '16.99 N'
            mensaje: |
              Es la mitad de la suma. Las dos fuerzas suman $33{,}98$ N, pero el
              eslabón de abajo carga con casi catorce veces lo del de arriba.
          - valor: '39.24 N'
            mensaje: |
              Es el peso total del conjunto. La suma de las dos fuerzas de los
              eslabones no es el peso, porque el conjunto acelera.
        pista: |
          $F_2 = 13{,}93\,F_1$, y las dos suman $33{,}98$ N.
        desarrollo: |
          $$
          F_2 = \frac{3+2\sqrt{3}}{4}\,mg = 31{,}71\ \text{N}
          $$

          Las dos son de compresión, es decir empujan a la estructura hacia arriba
          y hacia la derecha a lo largo del eslabón; por eso la colección las
          imprime con signo negativo, con sus flechas dibujadas al revés.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Los eslabones son paralelos e iguales, así que ABDC es un paralelogramo y la estructura traslada, con $\alpha = 0$.'
          - texto: 'Al trasladar, $\vec{a}_G$ es perpendicular a los eslabones, y proyectando el peso, $a_G = g\cos 60^{\circ} = g/2$.'
          - texto: 'Con $\alpha = 0$, la ecuación de momentos en G queda $\sum M_G = 0$, y de ella $F_2 = 13{,}93\,F_1$.'
          - texto: 'Las dos ecuaciones de fuerzas dan $F_1 + F_2 = 33{,}98$ N, y con la de momentos, $F_1 = 2{,}28$ N y $F_2 = 31{,}71$ N.'
          - texto: Como el conjunto no gira, las dos fuerzas de los eslabones son iguales y valen la mitad del peso cada una.
            trampa: true
            mensaje: |
              No girar obliga a que los **momentos** se cancelen, no a que las
              fuerzas sean iguales, y $G$ no equidista de las dos líneas de
              acción. Y su suma tampoco es el peso, porque el conjunto acelera.
    resolucion: |
      **El movimiento.** Los dos eslabones tienen la misma longitud
      —$461{,}9$ mm— y son paralelos, así que $ABDC$ es un paralelogramo
      articulado y la estructura describe una **traslación curvilínea**, con
      $\alpha = 0$ en todo momento. Eso convierte la tercera ecuación en
      $\sum M_G = 0$.

      **La aceleración.** Al soltar, $\omega = 0$, y la aceleración de cualquier
      punto es perpendicular a los eslabones. Proyectando el peso del conjunto en
      esa dirección,

      $$
      2m\,g\cos 60^{\circ} = 2m\,a_G
      \;\Longrightarrow\;
      a_G = \frac{g}{2} = 4{,}905\ \text{m/s}^{2}
      $$

      **Las fuerzas.** Con $E$ en el origen, $G$ está en $(0{,}2;\ 0)$ m, $B$ en
      $(0;\ 0{,}4)$ y $D$ en $(0;\ -0{,}4)$. Las dos fuerzas van a 60 grados, y
      tomando momentos en $G$,

      $$
      -0{,}3732\,F_1 + 0{,}0268\,F_2 = 0
      $$

      Junto con las dos ecuaciones de fuerzas,

      $$
      F_1 = \frac{2\sqrt{3}-3}{4}\,mg = 2{,}28\ \text{N}
      \qquad
      F_2 = \frac{3+2\sqrt{3}}{4}\,mg = 31{,}71\ \text{N}
      $$

      Las dos de compresión. Lo llamativo del resultado es el reparto, casi
      catorce a uno, y sale entero de la ecuación de momentos.
  - id: ejma12-col1213-las-dos-barras-soldadas-en-uve
    titulo: Dos barras soldadas en uve que se sueltan desde el reposo
    fuente: Ejercicio 12.13 · Tema 12, «Dinámica del sólido con movimiento plano» · Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado y el curso su resolución, y el desarrollo está contrastado contra los dos.
    nivel: practica
    enunciado: |
      Dos barras de 3 kg $AB$ y $AC$ están soldadas (rígidamente unidas) como se
      muestra en la figura. Si ambas se sueltan en reposo, hallar inmediatamente
      antes del inicio del movimiento:

      1) Aceleración del punto $B$.

      2) Reacción en $A$.

      <figure>
      <svg viewBox="0 0 250 200" role="img" width="250" height="200" aria-labelledby="ma1213-t ma1213-d">
        <title id="ma1213-t">Dos barras soldadas en uve, articuladas a una pared</title>
        <desc id="ma1213-d">Desde el punto A, articulado en una pared vertical, salen dos barras iguales de 600 milímetros, soldadas entre sí. La barra AB sube hacia la derecha formando 30 grados con la horizontal y la barra AC baja hacia la derecha formando otros 30 grados, de modo que el conjunto es simétrico respecto de la horizontal que pasa por A.</desc>
        <line x1="56" y1="52" x2="56" y2="150" stroke="var(--ink)" stroke-width="1.4"/>
        <path d="M56 58 L48 66 M56 78 L48 86 M56 98 L48 106 M56 118 L48 126 M56 138 L48 146" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="60" y1="100" x2="164" y2="40" stroke="var(--ink)" stroke-width="4"/>
        <line x1="60" y1="100" x2="164" y2="160" stroke="var(--ink)" stroke-width="4"/>
        <rect x="52" y="92" width="16" height="16" rx="2" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/>
        <circle cx="60" cy="100" r="3.2" fill="var(--ink)"/>
        <path d="M72 100 L215 100" fill="none" stroke="var(--faint)" stroke-width="0.6" stroke-dasharray="7 3 1.5 3"/>
        <path d="M108 100 A 48 48 0 0 0 101 72" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <path d="M108 100 A 48 48 0 0 1 101 128" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <text x="112" y="86" font-size="9.5" fill="var(--ink)">30°</text>
        <text x="112" y="124" font-size="9.5" fill="var(--ink)">30°</text>
        <text x="60" y="88" font-size="11" font-weight="600" fill="var(--ink)">A</text>
        <text x="170" y="36" font-size="11" font-weight="600" fill="var(--ink)">B</text>
        <text x="170" y="168" font-size="11" font-weight="600" fill="var(--ink)">C</text>
        <text x="76" y="24" font-size="9.5" fill="var(--faint)">AB = 600 mm</text>
        <text x="76" y="36" font-size="9.5" fill="var(--faint)">AC = 600 mm</text>
        <text x="125" y="192" font-size="9" text-anchor="middle" fill="var(--faint)">cada barra, 3 kg</text>
      </svg>
      </figure>
    pide: El módulo de la aceleración de B y la reacción en A, en N.
    pasos:
      - tipo: reconocer
        pregunta: |
          Las dos barras están soldadas y articuladas en $A$. ¿Qué ecuación da
          directamente la aceleración angular?
        opciones:
          - texto: Momentos en A, con el I_A del conjunto de las dos barras
            correcta: true
            mensaje: |
              Eso es. $A$ es un punto fijo, así que vale $\sum M_A = I_A\alpha$ y la
              reacción desaparece de la ecuación. El $I_A$ es el de las dos barras
              sumado, $2\,mL^{2}/3$.
          - texto: Momentos en A, con el I_G del conjunto
            mensaje: |
              En un punto fijo hay que usar el momento de inercia respecto de ese
              punto. Si se usa $I_G$ hay que añadir además el momento de
              $M\vec{a}_G$ respecto de $A$, y entonces ya no es la misma ecuación.
          - texto: La de fuerzas en vertical, porque el peso es la única fuerza conocida
            mensaje: |
              En esa ecuación aparece la reacción de $A$, que no se conoce. La de
              momentos en $A$ la elimina y deja una sola incógnita.
          - texto: Momentos en G, porque el conjunto gira alrededor de su centro de gravedad
            mensaje: |
              El conjunto no gira alrededor de $G$, sino de $A$. Se puede tomar
              momentos en $G$, pero entonces aparece la reacción en $A$ y hace
              falta combinar con las ecuaciones de fuerzas.

      - tipo: calcular
        titulo: La aceleración angular del conjunto
        pregunta: |
          Con $g = 9{,}81\ \text{m/s}^{2}$, ¿cuánto vale el módulo de la
          aceleración angular nada más soltar, en rad/s²?
        respuesta:
          tipo: numero
          valor: '21.24'
          tolerancia: 0.05
          formato: un número, en rad/s²
        distractores:
          - valor: '24.525'
            mensaje: |
              Has puesto el centro de gravedad a $L/2$ de $A$. Las barras están
              inclinadas 30 grados, así que la distancia horizontal de $G$ a $A$
              es $\tfrac{\sqrt{3}}{4}L$, no $L/2$.
          - valor: '63.72'
            mensaje: |
              Has usado $I_G = 2\,mL^{2}/12$ en un punto que no es $G$. El eje de
              giro pasa por $A$, en el extremo de las dos barras, y ahí
              $I_A = 2\,mL^{2}/3$.
        pista: |
          Solo los pesos dan momento en $A$, y lo hacen con el brazo horizontal
          $x_G = \tfrac{\sqrt{3}}{4}L$. Iguala a $I_A\alpha$ con
          $I_A = 2\,mL^{2}/3$.
        desarrollo: |
          $$
          2mg\,\frac{\sqrt{3}}{4}L = \frac{2mL^{2}}{3}\,\alpha
          \;\Longrightarrow\;
          \alpha = \frac{3\sqrt{3}}{4}\,\frac{g}{L}
          = \frac{3\sqrt{3}}{4}\cdot\frac{9{,}81}{0{,}6} = 21{,}24\ \text{rad/s}^{2}
          $$

      - tipo: calcular
        titulo: La aceleración del punto B
        pregunta: |
          ¿Cuánto vale el módulo de la aceleración de $B$ en ese instante?
        respuesta:
          tipo: magnitud
          valor: '12.74 m/s^2'
          tolerancia: 0.01
          formato: una aceleración, con su unidad
        distractores:
          - valor: '6.37 m/s^2'
            mensaje: |
              Has usado el brazo del centro de gravedad en vez de la distancia
              real $AB$. Con $\omega = 0$, la aceleración de $B$ es $\alpha\cdot AB$
              con $AB = 0{,}6$ m.
          - valor: '9.81 m/s^2'
            mensaje: |
              Eso sería caída libre. El conjunto está articulado en $A$, y $B$
              acelera perpendicularmente a $AB$, con un valor que sale de $\alpha$.
        pista: |
          Con $\omega = 0$ solo hay componente tangencial, $a_B = \alpha\cdot AB$,
          perpendicular a la barra $AB$.
        desarrollo: |
          $$
          a_B = \alpha\,L = \frac{3\sqrt{3}}{4}\,g = 12{,}74\ \text{m/s}^{2}
          $$

          Perpendicular a $AB$, así que forma 30 grados con la vertical. Ni la
          masa ni la longitud aparecen en el resultado.

      - tipo: calcular
        titulo: La reacción en A
        pregunta: |
          ¿Cuánto vale la componente vertical de la reacción en $A$?
        respuesta:
          tipo: magnitud
          valor: '25.75 N'
          tolerancia: 0.01
          formato: una fuerza, con su unidad
        distractores:
          - valor: '58.86 N'
            mensaje: |
              Es el peso de las dos barras, la reacción que habría con el conjunto
              en equilibrio. Al soltarlo, $G$ baja acelerando y la articulación
              sostiene bastante menos.
          - valor: '33.11 N'
            mensaje: |
              Es $2m\,a_{Gy}$, la parte del peso que se va en acelerar. La
              reacción es lo que queda, $2m(g - a_{Gy})$.
        pista: |
          $a_{Gy} = -\alpha\,x_G$, hacia abajo. Después,
          $A_y - 2mg = 2m\,a_{Gy}$.
        desarrollo: |
          Con $x_G = \tfrac{\sqrt{3}}{4}L = 0{,}2598$ m,
          $a_{Gy} = -\alpha\,x_G = -5{,}52\ \text{m/s}^{2}$, y

          $$
          A_y = 2m\,(g + a_{Gy}) = 6\,(9{,}81 - 5{,}52) = 25{,}75\ \text{N}
          $$

          La componente horizontal es nula, porque $G$ está en la horizontal de
          $A$ y con $\omega = 0$ no hay aceleración normal.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Por simetría $G$ está sobre la horizontal de A, a $x_G = \tfrac{\sqrt{3}}{4}L = 0{,}26$ m, y $I_A = 2mL^{2}/3 = 0{,}72$ kg m².'
          - texto: 'Momentos en el punto fijo A, $2mg\,x_G = I_A\,\alpha$, y sale $\alpha = \tfrac{3\sqrt{3}}{4}\,g/L = 21{,}24$ rad/s².'
          - texto: 'Con $\omega = 0$, $a_B = \alpha\,AB = 12{,}74$ m/s², perpendicular a la barra AB.'
          - texto: 'El centro baja con $a_{Gy} = -\alpha x_G = -5{,}52$ m/s², y del momento lineal $A_y = 2m(g + a_{Gy}) = 25{,}75$ N, con $A_x = 0$.'
          - texto: Como el conjunto está en reposo, la articulación soporta todo el peso, 58,86 N.
            trampa: true
            mensaje: |
              Estar en reposo no es estar en equilibrio. En ese instante
              $\omega = 0$ pero $\alpha \ne 0$, el centro de gravedad baja
              acelerando, y la articulación sostiene menos de la mitad del peso.
    resolucion: |
      **La geometría de masas.** Las dos barras son iguales y simétricas respecto
      de la horizontal de $A$, así que $G$ está en esa horizontal, a
      $x_G = \tfrac{\sqrt{3}}{4}L = 0{,}2598$ m. Cada barra aporta $mL^{2}/3$
      respecto de $A$, luego $I_A = 2mL^{2}/3 = 0{,}72\ \text{kg}\,\text{m}^{2}$.

      **La aceleración angular.** $A$ es fijo, y solo los pesos dan momento:

      $$
      2mg\,x_G = I_A\,\alpha
      \;\Longrightarrow\;
      \alpha = \frac{3\sqrt{3}}{4}\,\frac{g}{L} = 21{,}24\ \text{rad/s}^{2}
      $$

      **El punto B.** Con $\omega = 0$ no hay término normal,

      $$
      a_B = \alpha\,L = \frac{3\sqrt{3}}{4}\,g = 12{,}74\ \text{m/s}^{2}
      $$

      perpendicular a $AB$. Fíjate en que ni la masa ni la longitud sobreviven.

      **La reacción.** El centro baja con $a_{Gy} = -\alpha\,x_G = -5{,}52$ m/s², y

      $$
      A_y = 2m\,(g + a_{Gy}) = \frac{7}{16}\cdot 2mg = 25{,}75\ \text{N}
      $$

      con $A_x = 0$. Es decir, siete dieciseisavos del peso total.

  - id: ejma12-col1214-la-barra-con-el-disco-apoyado-encima
    titulo: La barra con un disco apoyado encima cuando se corta el hilo
    fuente: Ejercicio 12.14 · Tema 12, «Dinámica del sólido con movimiento plano» · Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado y el curso su resolución, y el desarrollo está contrastado contra los dos. La colección intercambia los apartados a) y c) al imprimir el resultado, y la resolución del curso da la versión correcta, que es la que se publica aquí.
    nivel: practica
    enunciado: |
      Una barra $AB$ de masa $M$ y longitud $4R$ está suspendida en un plano
      vertical mediante un hilo $BC$ y un muelle ideal $OA$ de constante
      $k = Mg/(2R)$ que forma 45º con la vertical. Sobre el punto medio de la
      barra se apoya un disco de masa $M$ y radio $R$, no existiendo rozamiento
      entre ambos. Estando en equilibrio con la barra $AB$ horizontal, se corta el
      hilo $BC$. Determinar en ese instante (inmediatamente antes de que se inicie
      el movimiento):

      a) La aceleración del punto medio de la barra.

      b) La aceleración angular de la barra.

      c) La aceleración del centro del disco.

      d) La aceleración angular del disco.

      e) La reacción entre disco y barra.

      <figure>
      <svg viewBox="0 0 300 212" role="img" width="300" height="212" aria-labelledby="ma1214-t ma1214-d">
        <title id="ma1214-t">La barra horizontal con un disco apoyado en su punto medio</title>
        <desc id="ma1214-d">La barra AB es horizontal y mide cuatro radios. Su extremo izquierdo A cuelga de un muelle que sube a 45 grados hasta el punto O de la pared de la izquierda. Sobre el punto medio de la barra se apoya un disco de radio R y centro G. El extremo derecho B está sujeto por el hilo BC, que sube hasta el punto C de la pared de la derecha.</desc>
