      <figcaption>

      En A, la barra y el cuadrado se hacen la misma fuerza con sentidos opuestos: la articulación no transmite momento. Las fuerzas y aceleraciones desconocidas van en su sentido positivo; el signo lo dan las ecuaciones.

      </figcaption>
      </figure>

      - **En A**, la fuerza de la barra sobre el cuadrado, $(A_x,\ A_y)$, y la
        misma al revés sobre la barra.
      - **En O**, la reacción del techo, $(O_x,\ O_y)$; en $B$, nada.
      - **Los pesos**, $Mg$, en $G_1$, el centro de la barra, y en $G_2$, el
        del cuadrado.
      - **Al lado**, $M\vec{a}_{G1}$ e $I_{G1}\,\alpha_1$ en la barra, y
        $M\vec{a}_{G2}$ e $I_{G2}\,\alpha_2$ en el cuadrado.

      **2. Incógnitas.** $\alpha_1$, $\alpha_2$, $A_x$, $A_y$, $O_x$ y $O_y$:
      seis, con las tres ecuaciones de cada sólido; las aceleraciones de los
      centros las da la cinemática. Para lo que se pide no hacen falta $O_x$
      ni $O_y$: basta tomar momentos de la barra en $O$.

      **3. Ecuaciones.** Con $x$ hacia la derecha, $y$ hacia arriba y los
      giros antihorarios positivos. Justo al cortar,
      $\omega_1 = \omega_2 = 0$; la barra gira alrededor de $O$ y el cuadrado
      tiene su propio giro:

      $$
      \vec{a}_A = \vec{\alpha}_1\times\overrightarrow{OA} = \alpha_1 L\,\hat{\imath}
      \qquad
      \vec{a}_{G2} = \vec{a}_A + \vec{\alpha}_2\times\overrightarrow{AG_2}
      = (\alpha_1 + \alpha_2)L\,\hat{\imath} + \alpha_2 L\,\hat{\jmath}
      $$

      porque $\overrightarrow{OA} = (0;\ -L)$ y
      $\overrightarrow{AG_2} = (L;\ -L)$. La barra, con momentos en $O$, fijo,
      e $I_O = \tfrac13 ML^{2}$; su peso pasa por $O$:

      $$
      -A_x L = \tfrac13 ML^{2}\,\alpha_1
      $$

      El cuadrado, con momentos en $G_2$, desde donde $A$ está en
      $(-L;\ L)$:

      $$
      A_x = M(\alpha_1 + \alpha_2)L
      \qquad
      A_y - Mg = M\alpha_2 L
      \qquad
      -A_x L - A_y L = \tfrac23 ML^{2}\,\alpha_2
      $$

      **4. Resultados.** La de la barra y la horizontal del cuadrado
      comparten $A_x$: igualando, $-\tfrac{\alpha_1}{3} = \alpha_1 + \alpha_2$,
      así que

      $$
      \frac{\alpha_2}{\alpha_1} = -\frac{4}{3}
      $$

      Con $A_x = -\tfrac13 ML\alpha_1$ y $A_y = Mg + M\alpha_2 L$ en la de
      momentos del cuadrado, y $\alpha_2 = -\tfrac43\alpha_1$:

      $$
      \frac13 ML\alpha_1 - Mg - ML\alpha_2 = \frac23 ML\alpha_2
      \;\Longrightarrow\;
      \left(\frac13 + \frac{20}{9}\right) ML\alpha_1 = Mg
      $$

      $$
      \alpha_1 = \frac{9}{23}\,\frac{g}{L}
      \qquad
      \alpha_2 = -\frac{12}{23}\,\frac{g}{L}
      $$

      La barra gira en sentido antihorario, y el cuadrado, en horario. La
      reacción en $A$, sobre el cuadrado:

      $$
      A_x = -\frac13 ML\alpha_1 = -\frac{3}{23}Mg
      \qquad
      A_y = Mg - \frac{12}{23}Mg = \frac{11}{23}Mg
      $$

      $A_x$ hacia la izquierda y $A_y$ hacia arriba. La colección los imprime
      como $3Mg/23$ y $-11Mg/23$: los mismos módulos con las flechas al revés.

      **5. Comprobación.** Por el conjunto de barra y cuadrado, que no se ha
      usado: la fuerza en $A$ es interna y no aparece. Momentos en $O$, fijo:
      el peso del cuadrado, a $L$ a la derecha de $O$, da $-MgL$, y el de la
      barra pasa por $O$. Del otro lado, $I_O\,\alpha_1$ de la barra y, del
      cuadrado, $I_{G2}\,\alpha_2$ más el momento de $M\vec{a}_{G2}$ aplicado
      en $G_2$, que está en $(L;\ -2L)$ desde $O$:

      $$
      -MgL = \frac13 ML^{2}\alpha_1 + \frac23 ML^{2}\alpha_2
      + \left[L \cdot M\alpha_2 L + 2L \cdot M(\alpha_1 + \alpha_2)L\right]
      = ML^{2}\left(\frac73\,\alpha_1 + \frac{11}{3}\,\alpha_2\right)
      $$

      Con los resultados, el paréntesis vale
      $\left(\tfrac{21}{23} - \tfrac{44}{23}\right)\tfrac{g}{L} = -\tfrac{g}{L}$:
      cuadra.

      **Lo que dice el resultado.** Al cortar el hilo, el cuadrado no cae
      libre: su centro baja con $\tfrac{12}{23}g$, algo más de la mitad de
      $g$, y la barra lo sostiene con $\tfrac{11}{23}$ de su peso. Los dos
      giran en sentidos contrarios: el cuadrado, colgado de su esquina, gira
      en sentido horario para llevar su centro hacia la vertical de $A$, y al
      hacerlo tira de la barra hacia la derecha, que gira en sentido
      antihorario.

  - id: ejma12-col1220-el-disco-la-barra-y-el-resorte
    titulo: Energía del disco con barra y resorte tras un cuarto de vuelta
    fuente: Ejercicio 12.20 · Tema 12, «Dinámica del sólido con movimiento plano» · Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado y el curso su resolución, y el desarrollo está contrastado contra los dos. El valor impreso en la colección para el apartado b) no sale de los datos; el bueno es el de la resolución del curso, que es el que se publica aquí.
    nivel: practica
    antes:
      idea: |
        Si las fuerzas no conservativas no trabajan, la suma de la energía
        cinética y la potencial se conserva. La cinética de un sólido es la de
        su centro de gravedad más la de su giro alrededor de él; si gira
        alrededor de un punto que no se mueve, es la de ese giro respecto del
        punto. La energía de un resorte ideal es la mitad de su constante por
        el cuadrado de lo que se ha alargado desde su longitud natural. El
        centro instantáneo de rotación está donde se cortan las
        perpendiculares a las velocidades de dos puntos; si no se cortan, el
        sólido traslada.
      formula: |
        $$
        T_1 + V_1 = T_2 + V_2,
        \qquad
        T = \tfrac12 M v_G^{2} + \tfrac12 I_G\,\omega^{2} = \tfrac12 I_O\,\omega^{2}\ \text{(O fijo)}
        $$

        $$
        V_g = Mg\,h_G,
        \qquad
        V_e = \tfrac12 k\,\delta^{2},
        \qquad
        I_G = \tfrac12 MR^{2}\ \text{(disco)},
        \qquad
        I_G = \tfrac{1}{12}ML^{2}\ \text{(barra)}
        $$
      reconocer: |
        Antes de calcular se mira qué fuerzas trabajan entre las dos
        posiciones y cuáles no.
    enunciado: |
      La figura muestra el estado inicial del sistema compuesto por:

      - un disco de masa $M = 10$ kg y radio $R = 0.5$ m, que gira con rotación
        $\omega = 5\ \text{rad/s}$ en sentido horario alrededor de su punto fijo
        $O$.

      - una barra $AB$ de masa $M = 10$ kg y longitud $L = 2R$. Esta barra está
        articulada al disco en el punto $A$ y a una deslizadera sin masa que se
        desplaza verticalmente en $B$.

      - un resorte ideal (Longitud sin fuerza aplicada = 0) cuya constante es
        $k = 100$ N/m, atado entre el suelo y el punto diametralmente opuesto al
        punto $A$.

      Calcular:

      a) Energía cinética del sistema en el estado inicial.

      b) Valor de $\omega$ cuando el disco ha girado 90º en sentido horario.

