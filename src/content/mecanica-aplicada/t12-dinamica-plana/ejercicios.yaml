      - tipo: calcular
        titulo: El alargamiento inicial del muelle
        pregunta: |
          ¿Cuánto está estirado el muelle en la posición de partida,
          $\theta = 50^\circ$?
        respuesta:
          tipo: magnitud
          valor: '0.2268 m'
          tolerancia: 0.01
          formato: en metros, con cuatro cifras
        distractores:
          - valor: '0.4864 m'
            mensaje: |
              Es $L\sin 50^\circ$, o sea lo que baja $B$ por su ranura. El
              muelle está en la ranura horizontal, así que lo que lo estira es
              el desplazamiento **horizontal** de $A$.
          - valor: '0.1486 m'
            mensaje: |
              Has cambiado el seno por el coseno: $L(1-\sin 50^\circ)$. La
              distancia horizontal de $A$ a la ranura vertical es
              $L\cos\theta$, así que el alargamiento es $L(1-\cos 50^\circ)$.
          - valor: '0.635 m'
            mensaje: |
              Es la barra entera. El muelle solo se estira lo que $A$ se
              separa de su posición de $\theta = 0$, no toda la longitud.
        pista: |
          La distancia horizontal entre $A$ y la ranura vertical vale
          $L\cos\theta$, y en $\theta = 0$ vale $L$.
        desarrollo: |
          $$
          \delta = L\,(1-\cos 50^\circ) = 0{,}635\cdot 0{,}35721
          = 0{,}2268\ \text{m}
          $$

      - tipo: calcular
        titulo: La velocidad angular en theta igual a cero
        pregunta: |
          Con $g = 9{,}81\ \text{m/s}^{2}$, ¿cuánto vale la velocidad angular
          de la barra al llegar a $\theta = 0$?
        respuesta:
          tipo: numero
          valor: '3.839'
          tolerancia: 0.012
          formato: un número, en rad/s
        distractores:
          - valor: '7.088'
            mensaje: |
              Te has olvidado del peso. Al pasar de 50º a 0º el centro de la
              barra **sube** $\frac{L}{2}\sin 50^\circ$, así que la gravedad se
              come 9,54 de los 13,51 J que suelta el muelle.
          - valor: '7.679'
            mensaje: |
              Solo has puesto la energía de rotación, $\tfrac12 I_G\omega^{2}$.
              El centro de gravedad también se mueve: falta
              $\tfrac12 M v_G^{2}$ con $v_G = \omega L/2$.
          - valor: '13.98'
            mensaje: |
              Has estirado el muelle $L\sin 50^\circ$ en vez de
              $L(1-\cos 50^\circ)$: la energía elástica va con el cuadrado, así
              que ese error multiplica por más de cuatro el término del muelle.
        pista: |
          $\tfrac12 k\delta^{2} - Mg\frac{L}{2}\sin 50^\circ
          = \tfrac12 M v_G^{2} + \tfrac12 I_G\omega^{2}$, con $A$ de centro
          instantáneo: $v_G = \omega L/2$ e $I_G = ML^{2}/12$.
        desarrollo: |
          $$
          \tfrac12 k\,\delta^{2} - Mg\,\frac{L}{2}\sin 50^\circ
          = \frac{ML^{2}}{6}\,\omega^{2}
          $$

          $$
          13{,}506 - 9{,}544 = 0{,}26882\,\omega^{2}
          \;\Longrightarrow\;
          \omega = 3{,}839\ \text{rad/s}
          $$

      - tipo: calcular
        titulo: La velocidad del extremo B
        pregunta: |
          ¿Y cuánto vale la velocidad del extremo $B$ en ese instante?
        respuesta:
          tipo: magnitud
          valor: '2.438 m/s'
          tolerancia: 0.01
          formato: en m/s, con cuatro cifras
        distractores:
          - valor: '1.219 m/s'
            mensaje: |
              Es la velocidad del centro de gravedad, $\omega L/2$. $B$ está al
              doble de distancia del centro instantáneo $A$.
          - valor: '4.876 m/s'
            mensaje: |
              Has puesto $B$ a $2L$ del centro instantáneo. El centro
              instantáneo es $A$, y $AB$ vale $L$, no $2L$.
        pista: |
          Con el centro instantáneo en $A$, $v_B = \omega\,\overline{AB}$.
        desarrollo: |
          $$
          v_B = \omega L = 3{,}839\cdot 0{,}635 = 2{,}438\ \text{m/s}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Las ranuras no rozan y no hay más fuerzas no conservativas: se conserva la suma de energía cinética, potencial gravitatoria y elástica.'
          - texto: 'De 50º a 0º el muelle suelta $\tfrac12 k L^{2}(1-\cos 50^\circ)^{2} = 13{,}51$ J y el peso absorbe $Mg\frac{L}{2}\sin 50^\circ = 9{,}54$ J.'
          - texto: 'En θ = 0 el centro instantáneo es A, así que $T = \tfrac12 M(\omega L/2)^{2} + \tfrac12\frac{ML^{2}}{12}\omega^{2} = \frac{ML^{2}}{6}\omega^{2}$, y sale ω = 3,84 rad/s.'
          - texto: Como A es el centro instantáneo de rotación y su velocidad es nula, la barra no tiene energía cinética de traslación en esa posición.
            trampa: true
            mensaje: |
              El que está parado es $A$, no el centro de gravedad. $G$ lleva
              $\omega L/2 = 1{,}22$ m/s, y su energía de traslación vale
              2,97 J de los 3,96 totales: tres cuartas partes.
