    pide: Las cuatro componentes de las reacciones en los apoyos A y D.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuánto vale $\omega_2$, la velocidad angular de la barra $BC$?
        opciones:
          - texto: Cero, porque las velocidades de B y de C son las dos verticales, o sea paralelas a la propia BC
            correcta: true
            mensaje: |
              Eso es. $B$ gira alrededor de $A$ con $AB$ horizontal, así que
              $\vec{v}_B$ es vertical; lo mismo le pasa a $C$ con $CD$. Dos
              puntos de un sólido con velocidades paralelas a la recta que los
              une obligan a $\omega = 0$.
          - texto: 2 rad/s, la misma que la barra AB, porque están articuladas en B
            mensaje: |
              La articulación obliga a que compartan la **velocidad del punto
              B**, no la velocidad angular. Cada barra gira lo suyo.
          - texto: 1,2 rad/s, la misma que la barra CD
            mensaje: |
              Ese es el valor de $\omega_3$, que sale de que $v_C = v_B$. La
              barra $BC$ es otra cosa: sus dos extremos suben a la vez y a la
              misma velocidad, así que no gira.
          - texto: No se puede saber sin conocer la distancia entre A y D
            mensaje: |
              La distancia $AD$ está fijada por las longitudes: $D$ queda 0,4 m
              a la derecha de $A$. Y para $\omega_2$ ni siquiera hace falta:
              basta con que $AB$ y $CD$ estén horizontales.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **las tres barras por separado,
          sin los apoyos ni las articulaciones, con todas las fuerzas que
          actúan sobre cada una, y al lado de cada una, lo que tienen que dar
          esas fuerzas**. Sin escala.
        comprueba:
          - punto: |
              **En $A$, las dos componentes de la reacción y un par; en $D$, las
              dos de la reacción.**
            porque: |
              Los dos apoyos son articulaciones fijas. Sin un par en $A$, la
              barra 1 no podría tener la $\omega_1$ y la $\alpha_1$ que da el
              enunciado: se las impone un motor.
          - punto: |
              **En $B$ y en $C$, la fuerza entre las dos barras que se tocan: con
              su sentido positivo en una y al revés en la otra.**
            porque: |
              Es la acción y la reacción de cada articulación: la misma fuerza,
              con el sentido cambiado.
          - punto: |
              **Los tres pesos, cada uno a media barra.**
            porque: |
              Las tres barras son uniformes: su centro de gravedad está en el
              medio.
          - punto: |
              **Al lado de cada barra, $M a_G$ en su centro y el par
              $I_G\,\alpha$.**
            porque: |
              Es lo que tienen que dar las fuerzas; las aceleraciones las da la
              cinemática, barra a barra.
