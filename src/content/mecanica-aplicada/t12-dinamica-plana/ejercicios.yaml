      - **En A**, la fuerza $P$, horizontal, y la reacción de la ranura
        horizontal, $R_A$, vertical.
      - **En C**, la reacción de la ranura vertical, $N_C$, horizontal.
      - **En G**, que es $C$, el peso, $Mg$.
      - **Al lado**, $M a_G$, vertical, y el par $I_G\,\alpha$, antihorario.

      **2. Incógnitas.** $P$, $R_A$ y $N_C$: tres, con las tres ecuaciones del
      movimiento plano. La aceleración de $G$ la da la cinemática a partir de
      $\alpha$.

      **3. Ecuaciones.** La cinemática, con $\omega = 0$ porque parte del
      reposo: $\vec{a}_G = \vec{a}_A + \vec{\alpha}\times\overrightarrow{AG}$,
      con $\vec{a}_A$ horizontal y $\vec{a}_G$ vertical, porque $G$ es $C$:

      <figure class="figura-examen">
      <svg viewBox="62 40 140 104" role="img" width="210" height="156" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">Las aceleraciones de A y de G en el arranque</title>
        <desc id="dsl-d">Un triángulo de vectores. La aceleración de A, horizontal hacia la izquierda. Desde su punta, la aceleración del giro, alfa por L medios, perpendicular a la barra, hacia arriba y a la derecha. Desde el origen de la primera hasta la punta de la segunda, la aceleración de G, vertical hacia arriba. Entre la del giro y la vertical, 30 grados.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M139 69.8 A22 22 0 0 0 150 72.7" fill="none" stroke="var(--ink)" stroke-width="0.9"/>
        <text x="132" y="86.7" font-size="10" fill="var(--ink)">30°</text>
        <line x1="150" y1="120" x2="110" y2="120" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="130" y="134" font-size="10" text-anchor="middle" fill="var(--ink)" font-style="italic">a<tspan font-size="7.5" dy="2.5">A</tspan></text>
        <line x1="110" y1="120" x2="150" y2="50.7" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="122" y="85.35" font-size="10" text-anchor="end" fill="var(--ink)" font-style="italic">αL/2</text>
        <line x1="150" y1="120" x2="150" y2="50.7" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="157" y="89.35" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">a<tspan font-size="7.5" dy="2.5">G</tspan></text>
      </svg>
      <figcaption>

      Con ω = 0. La suma tiene que ser vertical, porque G va por la ranura vertical: eso fija aA, hacia la izquierda, y aG, hacia arriba.

      </figcaption>
      </figure>

      $$
      a_{Gx} = a_A + \frac{L}{2}\,\alpha\sin 30^\circ = 0
      \qquad
      a_{Gy} = \frac{L}{2}\,\alpha\cos 30^\circ = \frac{\sqrt{3}}{4}L\alpha
      $$

      La dinámica, con $x$ hacia la derecha, $y$ hacia arriba y los momentos
      antihorarios positivos. $A$ está a $\frac{L}{2}\cos 30^\circ = \frac{\sqrt{3}L}{4}$
      de $G$ en horizontal y a $\frac{L}{2}\sin 30^\circ = \frac{L}{4}$ en
      vertical; $N_C$ y el peso pasan por $G$:

      $$
      N_C - P = 0
      \qquad
      R_A - Mg = M a_{Gy}
      \qquad
      P\,\frac{L}{4} - R_A\,\frac{\sqrt{3}L}{4} = \frac{ML^{2}}{12}\,\alpha
      $$

      **4. Resultados.**

      $$
      R_A = M\left(g + \frac{\sqrt{3}}{4}L\alpha\right)
      \qquad
      P = \sqrt{3}\,R_A + \frac{ML\alpha}{3} = M\left(\sqrt{3}\,g + \frac{13}{12}L\alpha\right)
      \qquad
      N_C = P
      $$

      Y $a_A = -L\alpha/4$: el bloque $A$ arranca hacia la izquierda, hacia
      donde tira $P$.

      **5. Comprobación.** Por momentos en $A$, que no se han usado: allí no
      dan momento ni $P$ ni $R_A$, y al par $I_G\,\alpha$ se le suma el
      momento de $M a_G$, vertical y aplicado en $G$, a $\frac{\sqrt{3}L}{4}$ en
      horizontal. $N_C$ está a $L/4$ por debajo de $A$ y el peso, a
      $\frac{\sqrt{3}L}{4}$ a su derecha:

      $$
      N_C\,\frac{L}{4} - Mg\,\frac{\sqrt{3}L}{4}
      = \frac{ML^{2}}{12}\,\alpha + \frac{\sqrt{3}L}{4}\cdot M\,\frac{\sqrt{3}}{4}L\alpha
      = \left(\frac{1}{12} + \frac{3}{16}\right) ML^{2}\alpha = \frac{13}{48}\,ML^{2}\alpha
      $$

      Así que $N_C = M\left(\sqrt{3}\,g + \frac{13}{12}L\alpha\right)$, que es
      $P$, como pide la ecuación horizontal.

      **Lo que dice el resultado.** Que $G$ vaya por la ranura vertical fija
      toda la cinemática: $G$ sube con $\frac{\sqrt{3}}{4}L\alpha$ aunque el
      empuje sea horizontal. Con $\alpha = 0$ quedan $P = \sqrt{3}\,Mg$ y
      $R_A = Mg$: solo para sostener la barra quieta hace falta una fuerza
      horizontal 1,73 veces el peso, porque el brazo de $P$ respecto de $G$
      es $\sqrt{3}$ veces menor que el de $R_A$. Lo que lleva $\alpha$ es lo
      que cuesta acelerarla.

  - id: ejma12-col123-dos-engranajes-unidos-por-una-barra
    titulo: Dos engranajes unidos por una barra
    fuente: >-
      Ejercicio 12.3 · Tema 12, «Dinámica del sólido con movimiento plano» ·
      Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección publica el
      resultado, contra el que está contrastado el desarrollo, y se ha
      comprobado también con la resolución oficial del profesor. Ojo al
      apartado a: la colección imprime 36,17 rad/s2, y ese número es la
      aceleración angular de la BARRA AB, no la del engranaje (2), que gira al
      doble. La resolución oficial del profesor publica 72,36 rad/s2 para el
      engranaje y 36,18 para la barra, y es lo que da la cuenta; el sitio
      publica 72,36 y explica el otro. El enunciado de la colección no dice
      que el engranaje (1) es fijo; el de la resolución oficial, sí, y así
      lo dice el pie de la figura.
    nivel: practica
    antes:
      idea: |
        Cada sólido con movimiento plano cumple tres ecuaciones: la
        resultante de las fuerzas es su masa por la aceleración de su centro
        de gravedad, y el momento respecto de G es el momento de inercia en G
        por la aceleración angular. Si el sólido gira alrededor de un punto
        fijo O, la de momentos puede tomarse en O, con el momento de inercia
        respecto de O. Dos engranajes que engranan sin deslizar tienen la
        misma velocidad en el punto de contacto, y la velocidad de un punto
        de un sólido es la de otro más la que añade el giro.
      formula: |
        $$
        \sum\vec{F} = M\vec{a}_G,
        \qquad
        \sum M_G = I_G\,\alpha,
        \qquad
        \sum M_O = I_O\,\alpha\ \ (O\ \text{fijo})
        $$

        $$
        \vec{v}_P = \vec{v}_B + \vec{\omega}\times\overrightarrow{BP},
        \qquad
        I_G = M\,r_G^{2},
        \qquad
        I_A = \tfrac13 ML^{2}\ \text{(barra, en su extremo)}
        $$
      reconocer: |
        Antes de calcular se mira cómo se mueve el engranaje (2) respecto del
        (1).
    enunciado: |
      Dos ruedas dentadas (1) y (2) engranan y están conectadas mediante la
      barra (3) $AB$ uniforme de longitud 200 mm. El engranaje (2) tiene una
      masa de 5 kg y un radio de giro central de 75 mm. La barra $AB$ tiene una
      masa de 3 kg. Si el sistema se suelta desde el reposo (posición de la
      figura), obtener:

      a) Aceleración angular del engranaje (2).

      b) Aceleración del punto $B$.

      <figure>
      <svg viewBox="0 0 300 210" role="img" width="300" height="210" aria-labelledby="ma12c3-t ma12c3-d">
        <title id="ma12c3-t">Dos engranajes iguales que engranan, con la barra AB uniendo sus centros</title>
        <desc id="ma12c3-d">Dos ruedas dentadas iguales, de 100 milimetros de radio, con los centros A y B separados 200 milimetros en horizontal. La rueda (1), a la izquierda, esta montada sobre un apoyo fijo en A. La barra (3) AB, de 200 milimetros y 3 kilogramos, une los dos centros; su centro de gravedad G esta en el punto medio, que cae justo sobre el punto donde engranan las dos ruedas.</desc>
        <circle cx="85" cy="118" r="55" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.3"/>
        <circle cx="195" cy="118" r="55" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.3"/>
        <line x1="85" y1="118" x2="195" y2="118" stroke="var(--ink)" stroke-width="4.5"/>
        <circle cx="85" cy="118" r="4.5" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
        <circle cx="195" cy="118" r="3.5" fill="var(--ink)"/>
        <line x1="67" y1="126" x2="103" y2="126" stroke="var(--ink)" stroke-width="1.1"/>
        <path d="M73 126 L67 134 M81 126 L75 134 M89 126 L83 134 M97 126 L91 134" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <circle cx="140" cy="118" r="3" fill="var(--flag)"/>
        <text x="78" y="110" font-size="10" text-anchor="end" fill="var(--ink)">A</text>
        <text x="202" y="110" font-size="10" fill="var(--ink)">B</text>
        <text x="140" y="106" font-size="10" text-anchor="middle" fill="var(--flag)">G</text>
        <text x="85" y="76" font-size="9.5" text-anchor="middle" fill="var(--ink)">(1)</text>
        <text x="195" y="76" font-size="9.5" text-anchor="middle" fill="var(--ink)">(2)</text>
        <text x="140" y="146" font-size="9.5" text-anchor="middle" fill="var(--ink)">(3)</text>
        <line x1="85" y1="38" x2="195" y2="38" stroke="var(--faint)" stroke-width="0.9"/>
        <path d="M85 34 L85 42 M195 34 L195 42" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <text x="140" y="31" font-size="9" text-anchor="middle" fill="var(--faint)">200 mm</text>
        <text x="140" y="197" font-size="9" text-anchor="middle" fill="var(--faint)">las dos ruedas tienen radio 100 mm</text>
      </svg>
      <figcaption>

      Las dos ruedas son iguales, de radio **100 mm**, y engranan en el punto
      medio de **AB**, que es también el centro de gravedad **G** de la barra.
      La rueda **(1)** está fija, unida al apoyo **A**, sobre el que gira la
      barra. Dibujada a escala.

      </figcaption>
      </figure>
    pide: La aceleración angular del engranaje (2) y la aceleración del punto B.
    pasos:
      - tipo: reconocer
        pregunta: |
          El engranaje (1) está fijo al suelo. ¿Qué relación hay entre su
          aceleración angular $\alpha_2$ y la $\alpha_3$ de la barra?
        opciones:
          - texto: El doble, porque el engranaje (2) rueda sobre el (1), que está quieto
            correcta: true
            mensaje: |
              Eso es. Es el planeta que rueda sobre un sol del mismo radio: su
              rotación absoluta es el doble que la del brazo,
              $\alpha_2 = 2\alpha_3$.
          - texto: La misma, porque la barra y el engranaje están unidos en B
            mensaje: |
              La barra y el engranaje comparten el punto $B$, no la rotación:
              en $B$ hay una articulación, y el engranaje gira respecto de la
              barra porque sus dientes recorren los del engranaje fijo.
          - texto: La mitad, porque el radio del engranaje es la mitad de la distancia entre centros
            mensaje: |
              Los radios entran, pero al revés: cuanto más pequeño es el
              engranaje, **más** deprisa gira. Con radios iguales sale el
              doble.
          - texto: Cero, porque el centro del engranaje describe una circunferencia y el engranaje solo traslada
            mensaje: |
              Trasladar significa que todos sus puntos llevan la misma
              velocidad, y aquí el punto de contacto está parado mientras el
              centro se mueve: eso es rotación.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **la barra y el engranaje (2) por
          separado, cada uno con todas las fuerzas que actúan sobre él, y al
          lado de cada uno, lo que tienen que dar esas fuerzas**. Sin escala.
        comprueba:
          - punto: |
              **La barra: en $A$, $A_x$ y $A_y$; en $B$, $B_x$ y $B_y$; y su
              peso, $m_3 g$, a media barra.**
            porque: |
              $A$ es una articulación fija y $B$ la une con el engranaje: cada
              una sujeta en las dos direcciones del plano.
          - punto: |
              **El engranaje (2): en $B$, las mismas $B_x$ y $B_y$ con el sentido
              cambiado, y su peso, $m_2 g$.**
            porque: |
              Lo que la barra recibe del engranaje en $B$ es lo contrario de lo
              que el engranaje recibe de la barra.
          - punto: |
              **En el contacto $P$ con el (1), la fuerza de los dientes: $F_t$,
              tangente, y $N$, en la línea de centros.**
            porque: |
              Los dientes se empujan en el punto de contacto; como no se sabe
              cuánto, van las dos componentes.
          - punto: |
              **Al lado, $m_3 a_{G3}$ e $I_{G3}\,\alpha_3$ en la barra, y $m_2 a_B$ e
              $I_{G2}\,\alpha_2$ en el engranaje, en el sentido en que cae.**
            porque: |
              Al soltarlo, la barra empieza a girar alrededor de $A$, y el
              engranaje la acompaña girando sobre el (1).
        figura: |
