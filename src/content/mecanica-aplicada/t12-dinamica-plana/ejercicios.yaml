        <line x1="368" y1="70" x2="368" y2="154" stroke="var(--faint)" stroke-width="0.9"/>
        <path d="M364 70 L372 70 M364 154 L372 154" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
