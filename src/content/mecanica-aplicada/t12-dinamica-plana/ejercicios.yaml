    pide: El módulo de la aceleración de B y la reacción en A, en N.
    pasos:
      - tipo: reconocer
        pregunta: |
          Las dos barras están soldadas y articuladas en $A$. ¿Qué ecuación da
          directamente la aceleración angular?
        opciones:
          - texto: Momentos en A, con el I_A del conjunto de las dos barras
            correcta: true
            mensaje: |
              Eso es. $A$ es un punto fijo, así que vale $\sum M_A = I_A\alpha$ y la
              reacción desaparece de la ecuación. El $I_A$ es el de las dos barras
              sumado, $2\,mL^{2}/3$.
          - texto: Momentos en A, con el I_G del conjunto
            mensaje: |
              En un punto fijo hay que usar el momento de inercia respecto de ese
              punto. Si se usa $I_G$ hay que añadir además el momento de
              $M\vec{a}_G$ respecto de $A$, y entonces ya no es la misma ecuación.
          - texto: La de fuerzas en vertical, porque el peso es la única fuerza conocida
            mensaje: |
              En esa ecuación aparece la reacción de $A$, que no se conoce. La de
              momentos en $A$ la elimina y deja una sola incógnita.
          - texto: Momentos en G, porque el conjunto gira alrededor de su centro de gravedad
            mensaje: |
              El conjunto no gira alrededor de $G$, sino de $A$. Se puede tomar
              momentos en $G$, pero entonces aparece la reacción en $A$ y hace
              falta combinar con las ecuaciones de fuerzas.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **las dos barras en el instante de
          soltarlas, sin la articulación, con todas las fuerzas que actúan
