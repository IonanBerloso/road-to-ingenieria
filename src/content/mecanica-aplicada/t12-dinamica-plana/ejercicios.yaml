      - tipo: calcular
        titulo: La aceleración angular
        pregunta: |
          Tomando el eje $x$ hacia la derecha —así que $P$ es negativa—,
          ¿cuánto vale la aceleración angular de la barra?
        respuesta:
          tipo: numero
          valor: '-107.14'
          tolerancia: 0.06
          formato: un número con su signo, en rad/s²
        distractores:
          - valor: '-187.5'
            mensaje: |
              Has usado $I_G$ tomando momentos en $C$. Como $C$ es un punto
              fijo distinto de $G$, el momento de inercia hay que llevarlo allí
              con Steiner: $I_C = 0{,}4725$ y no 0,27.
          - valor: '-71.43'
            mensaje: |
              Has medido el brazo de $P$ desde $G$ y no desde $C$. De $C$ a
              $B$ hay $L/2 + r = 0{,}675$ m, no $L/2$.
          - valor: '-46.88'
            mensaje: |
              Has puesto Steiner con $L/2$ en vez de con $r$. La distancia de
              $C$ a $G$ es $r = 0{,}225$ m, que es justo $L/4$.
        pista: |
          $\sum M_C = I_C\alpha$, con el peso sin momento —está en la vertical
          de $C$— y $P$ actuando a $L/2 + r$ por debajo.
        desarrollo: |
          $$
          -P\,(L/2 + r) = I_C\,\alpha
          \;\Longrightarrow\;
          \alpha = \frac{-75\cdot 0{,}675}{0{,}4725} = -107{,}14\ \text{rad/s}^{2}
          $$

      - tipo: calcular
        titulo: La componente horizontal de la reacción
        pregunta: |
          ¿Cuánto vale $C_x$, la componente horizontal de la reacción en la
          articulación?
        respuesta:
          tipo: magnitud
          valor: '-21.43 N'
          tolerancia: 0.01
          formato: en newtons, con su signo
        distractores:
          - valor: '75 N'
            mensaje: |
              Has planteado equilibrio. La barra no está en equilibrio: $G$
              acelera 24,1 m/s² hacia la izquierda, y esa inercia se lleva casi
              todo el empujón de $P$.
          - valor: '-96.43 N'
            mensaje: |
              Es $M a_{Gx}$ a secas: te has dejado $P$ en la ecuación de
              fuerzas. La reacción es lo que falta para llegar de $P$ a
              $M a_{Gx}$.
        pista: |
          $a_{Gx} = \alpha\,r$, y el teorema del momento lineal dice
          $C_x + P_x = M\,a_{Gx}$ con $P_x = -75$ N.
        desarrollo: |
          $$
          a_{Gx} = \alpha\,r = -107{,}14\cdot 0{,}225 = -24{,}11\ \text{m/s}^{2}
          $$

          $$
          C_x = M a_{Gx} - P_x = 4(-24{,}11) + 75 = -21{,}43\ \text{N}
          $$

      - tipo: calcular
        titulo: La componente vertical de la reacción
        pregunta: |
          ¿Y cuánto vale $C_y$?
        respuesta:
          tipo: magnitud
          valor: '39.24 N'
          tolerancia: 0.01
          formato: en newtons
        distractores:
          - valor: '135.7 N'
            mensaje: |
              Has sumado la aceleración de $G$ a la vertical. Con la barra
              vertical y $\omega = 0$, $\vec{a}_G$ es perpendicular a $CG$, o
              sea **horizontal**: en vertical no hay inercia que sostener.
          - valor: '9.81 N'
            mensaje: |
              Has puesto $g$ donde va $Mg$. La barra pesa $4\cdot 9{,}81 = 39{,}24$ N.
        pista: |
          Al partir del reposo, $\vec{a}_G = \vec{\alpha}\times\overrightarrow{CG}$
          es perpendicular a la barra. Con la barra vertical, eso es
          horizontal.
        desarrollo: |
          $$
          a_{Gy} = 0
          \qquad
          C_y - Mg = 0
          \;\Longrightarrow\;
          C_y = 4\cdot 9{,}81 = 39{,}24\ \text{N}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'C es fijo: $\sum M_C = I_C\alpha$ con $I_C = \frac{ML^{2}}{12} + Mr^{2} = 0{,}4725$ kg m², y el peso no da momento porque G está en la vertical de C.'
          - texto: El momento de P vale $-75\cdot 0{,}675 = -50{,}6$ N m, así que $\alpha = -107{,}14$ rad/s² y $a_{Gx} = \alpha r = -24{,}1$ m/s².
          - texto: 'Momento lineal: $C_x - 75 = Ma_{Gx}$ da $C_x = -21{,}43$ N, y en vertical $C_y = Mg = 39{,}24$ N porque $a_{Gy} = 0$.'
          - texto: Como la barra está girando, el centro de gravedad tiene aceleración normal hacia C y la articulación soporta más que el peso.
            trampa: true
            mensaje: |
              La aceleración normal vale $\omega^{2}r$, y en ese instante
              $\omega = 0$: la barra empieza a moverse. Por eso $\vec{a}_G$ es
              puramente tangencial y $C_y$ vale exactamente el peso.
    resolucion: |
      **1. Sólidos libres.** Es un problema de dinámica de un sólido que gira
      alrededor de un punto fijo: el dibujo lleva la barra en el instante de
      aplicar $P$, sin la articulación, y al lado, lo que tienen que dar sus
      fuerzas.

