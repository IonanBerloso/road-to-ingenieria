      <figcaption>

      La biela no pesa y va articulada en sus dos extremos: tira o empuja a lo largo de sí misma, y al otro lado del igual no hay nada. Se dibuja tirando; si sale positiva, trabaja a tracción. El suelo no roza: solo empuja en vertical, y dónde lo dice la ecuación de momentos de la mesa.

      </figcaption>
      </figure>

      - **La biela** no pesa y va articulada en sus extremos: la misma
        fuerza, $F_3$, en los dos, a lo largo de ella. Se dibuja tirando; si
        sale positiva, trabaja a tracción.
      - **En la mesa**, $F$, su peso, $m_4 g$, la normal del suelo, $N$, y en
        $B$ la biela, tirando hacia $A$, a 30° por debajo de la horizontal.
        El suelo no roza.
      - **En el disco**, la biela, tirando de $A$ hacia $B$, la reacción en
        $O$, $(O_x,\ O_y)$, su peso, $m_2 g$, y el par motor, $T$.
      - **Al lado**, $m_4\,a_B$ en la mesa, horizontal, e $I_O\,\alpha_2$ en
        el disco; en la biela, nada.

      **2. Incógnitas.** $\omega_3$ y $\alpha_3$, de la cinemática. Después,
      $F_3$ y $N$ en la mesa, y $O_x$, $O_y$ y $T$ en el disco. Para el par
      bastan dos ecuaciones: la horizontal de la mesa y la de momentos del
      disco en $O$.

      **3. Ecuaciones.** Con $x$ hacia la derecha, $y$ hacia arriba y los
      giros antihorarios positivos; $A$ está encima de $O$ y
      $\overrightarrow{AB} = L\,(\cos 30^\circ;\ \sin 30^\circ)$. Velocidades,
      con $\vec{v}_A = \vec{\omega}_2\times\overrightarrow{OA} = -\omega_2 R\,\hat{\imath}$
      y $\vec{v}_B$ horizontal:

      $$
      \vec{v}_B = \vec{v}_A + \vec{\omega}_3\times\overrightarrow{AB}
      \;\Longrightarrow\;
      v_{By} = \omega_3 L\cos 30^\circ = 0
      $$

      Aceleraciones, con $\vec{a}_A = (-\alpha_2 R;\ -\omega_2^{2} R)$ y
      $\omega_3 = 0$; la mesa solo se mueve en horizontal:

      $$
      a_{By} = -\omega_2^{2} R + \alpha_3 L\cos 30^\circ = 0
      \qquad
      a_{Bx} = -\alpha_2 R - \alpha_3 L\sin 30^\circ
      $$

      La mesa en horizontal, y el disco con momentos en $O$, su centro fijo,
      con $I_O = \tfrac12 m_2 R^{2}$; la biela tira de $A$ con
      $F_3\,(\cos 30^\circ;\ \sin 30^\circ)$, a $R$ por encima de $O$:

      $$
      -F_3\cos 30^\circ = m_4\,a_{Bx}
      \qquad
      T - F_3\cos 30^\circ \cdot R = \tfrac12 m_2 R^{2}\,\alpha_2
      $$

      **4. Resultados.**

      $$
      \omega_3 = 0
      \qquad
      \alpha_3 = \frac{16 \cdot 0{,}5}{3 \cdot 0{,}86603} = 3{,}079\ \text{rad/s}^{2}
      $$

      $\alpha_3$ es antihoraria: el extremo $B$ no puede bajar, y la biela
      gira para compensar que $A$ acelera hacia $O$.

      $$
      a_{Bx} = -8 \cdot 0{,}5 - 3{,}0792 \cdot 1{,}5 = -8{,}619\ \text{m/s}^{2}
      \qquad
      F_3 = \frac{5 \cdot 8{,}6188}{0{,}86603} = 49{,}76\ \text{N}
      $$

      $F_3$ sale positiva: la biela trabaja a tracción.

      $$
      T = \tfrac12 \cdot 5 \cdot 0{,}5^{2} \cdot 8 + 49{,}76 \cdot 0{,}86603 \cdot 0{,}5 = 26{,}55\ \text{N·m}
      $$

      Y la normal, de la vertical de la mesa, con la biela tirando de $B$
      hacia abajo con $F_3\sin 30^\circ$:
      $N = 49{,}05 + 1000 + 24{,}88 = 1073{,}9$ N.

      **5. Comprobación.** Por potencias, sin pasar por $F_3$. De las fuerzas
      exteriores al mecanismo, solo trabaja el par motor: los pesos de la
      mesa, $F$ y $N$ son verticales y la mesa se mueve en horizontal, y la
      reacción y el peso del disco actúan en $O$, que no se mueve. Así que
      $T\,\omega_2$ es lo que crece por segundo la energía cinética del disco
      y de la mesa; la biela no tiene masa. Como $\omega_3 = 0$,
      $\vec{v}_B = \vec{v}_A = (-2;\ 0)$ m/s:

      $$
      T \cdot 4 = \tfrac12 \cdot 5 \cdot 0{,}5^{2} \cdot 4 \cdot 8 + 5 \cdot (-2) \cdot (-8{,}6188) = 106{,}188
      \qquad
      T = 106{,}188/4 = 26{,}55\ \text{N·m}
      $$

      El mismo.

      **Lo que dice el resultado.** El kilonewton de la muela no aparece en
      el par: es vertical, la mesa se mueve en horizontal y el suelo no roza,
      así que solo carga la normal, que pasa de 73,9 N a 1073,9 N. De los
      26,55 N·m, 5 se los lleva el propio disco y 21,55, la mesa, que en este
      instante acelera con 8,62 m/s², casi $g$. Y aunque la biela no gire,
      su aceleración angular pone más de la mitad: 4,62 de esos 8,62 m/s².

  - id: ejma12-col1219-el-cuadrado-colgado-de-una-barra
    titulo: El cuadrado colgado de una barra cuando se corta el hilo
    fuente: Ejercicio 12.19 · Tema 12, «Dinámica del sólido con movimiento plano» · Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado y el curso su resolución, y el desarrollo está contrastado contra los dos.
    nivel: practica
    antes:
      idea: |
        Un sólido con movimiento plano cumple tres ecuaciones: la resultante
        de las fuerzas es la masa por la aceleración del centro de gravedad,
        y el momento respecto de G es el momento de inercia en G por la
        aceleración angular. Respecto de un punto fijo, el momento de las
        fuerzas es el momento de inercia respecto de ese punto por la
        aceleración angular. Dos sólidos articulados se hacen en la
        articulación la misma fuerza, con sentidos opuestos. La aceleración
        de un punto de un sólido sale de la de otro punto del mismo sólido y
        de su velocidad y su aceleración angulares.
      formula: |
        $$
        \sum\vec{F} = M\vec{a}_G,
        \qquad
        \sum M_G = I_G\,\alpha,
        \qquad
        \sum M_O = I_O\,\alpha\ \text{(O fijo)}
        $$

        $$
        \vec{a}_P = \vec{a}_Q + \vec{\alpha}\times\overrightarrow{QP} - \omega^{2}\,\overrightarrow{QP},
        \qquad
        I_O = \tfrac13 ML^{2}\ \text{(barra, por un extremo)}
        $$
      reconocer: |
        Antes de calcular se mira cuántos sólidos hay y cómo están unidos.
    enunciado: |
      Un cuadrado $ABCD$ (2) de masa $M$ y lado $2L$ se encuentra suspendido del
      techo mediante una barra $OA$ (1) de masa $M$ y longitud $L$ (articulada en
      A y O), y un hilo h. Se corta el hilo h. En el instante inmediatamente
      siguiente, se pide:

      a) Obtener la relación entre las aceleraciones angulares de ambos elementos.

      b) Dibujar los diagramas de sólido libre expresando las ecuaciones
      correspondientes.

      c) Calcular la reacción en $A$.

      NOTA: el momento de inercia de la placa de masa $M$ y lado $2L$ respecto del
      eje Z que pasa por su centro de gravedad es $\tfrac{2}{3}ML^{2}$.

