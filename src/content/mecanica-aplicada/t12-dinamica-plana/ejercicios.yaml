        <text x="62" y="148" font-size="9" text-anchor="end" fill="var(--faint)">R</text>
        <text x="62" y="178" font-size="9" text-anchor="end" fill="var(--faint)">R</text>
        <text x="150" y="212" font-size="9" text-anchor="middle" fill="var(--faint)">estado inicial</text>
