        <circle cx="80" cy="34" r="2.4" fill="var(--ink)"/>
        <text x="80" y="27" font-size="10" text-anchor="middle" font-weight="700" fill="var(--ink)">A</text>
        <circle cx="80" cy="106" r="2.4" fill="var(--ink)"/>
        <text x="72" y="121" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">C</text>
        <circle cx="280" cy="70" r="2.4" fill="var(--ink)"/>
        <text x="273" y="85" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">G</text>
        <text x="201" y="74" font-size="9" text-anchor="middle" fill="var(--faint)">=</text>
      </svg>
      <figcaption>

      El muelle va unido al centro: tira de él a lo largo de sí mismo. El rozamiento se opone a que el contacto se vaya hacia la pared; si vale lo que pide la rodadura o su máximo, f N, lo dicen las ecuaciones.

      </figcaption>
      </figure>

      - **En G**, el peso, $Mg$, y la fuerza del muelle,
        $k\delta = k \cdot Mg/k = Mg$, horizontal, hacia la pared.
      - **En el contacto**, la normal, $N$, y el rozamiento, $F_r$, hacia el
        lado contrario de la pared: sin él, el disco se iría hacia la pared
        sin girar.
      - **Al lado**, $M a_G$, horizontal, y el par $I_G\,\alpha$, con
        $I_G = \tfrac12 MR^{2}$.

      **2. Incógnitas.** $a_G$, $\alpha$, $N$ y $F_r$: cuatro, con las tres
      ecuaciones del movimiento plano. La cuarta es una de dos: si rueda,
      $a_G = \alpha R$; si desliza, $F_r = f\,N$. Se supone que rueda y se
      comprueba.

      **3. Ecuaciones.** Con $x$ hacia la pared, $y$ hacia arriba y los giros
      horarios positivos, que es el sentido en que el disco rueda hacia la
      pared:

      $$
      Mg - F_r = M\,a_G
      \qquad
      N - Mg = 0
      \qquad
      F_r\,R = \tfrac12 MR^{2}\,\alpha
      $$

      **4. Resultados.** $N = Mg$, así que el suelo da como mucho
      $f\,N = \tfrac14 Mg$. Rodando, $a_G = \alpha R$; la tercera da
      $F_r = \tfrac12 M a_G$, y la primera, $Mg = \tfrac32 M a_G$:

      $$
      a_G = \frac23\,g
      \qquad
      F_r = \frac13\,Mg > f\,N = \frac14\,Mg
      $$

      El suelo no puede dar tanto rozamiento: **el disco desliza**, y entonces
      $F_r = f\,N = \tfrac14 Mg$:

      $$
      a_G = \frac{Mg - \tfrac14 Mg}{M} = \frac34\,g
      \qquad
      \alpha = \frac{\tfrac14 MgR}{\tfrac12 MR^{2}} = \frac{g}{2R}
      $$

      Con $\omega = 0$, la aceleración de $A$, a $R$ por encima de $G$:

      $$
      \vec{a}_A = \vec{a}_G + \vec{\alpha}\times\overrightarrow{GA}
      \;\Longrightarrow\;
      a_A = \frac34\,g + \frac{g}{2R}\,R = \frac54\,g
      $$

      hacia la pared: con $g = 9{,}81$ m/s², 12,26 m/s².

      **5. Comprobación.** Que el disco desliza tiene que verse en el punto de
      contacto, $C$, a $R$ por debajo de $G$: su aceleración no puede salir
      nula.

      $$
      a_C = a_G - \alpha R = \frac34\,g - \frac12\,g = \frac14\,g
      $$

      <figure class="figura-examen">
      <svg viewBox="20 20 186 122" role="img" width="279" height="183" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">Las aceleraciones de A, de G y del punto de contacto al soltar el disco</title>
        <desc id="dsl-d">El disco, con A arriba, G en el centro y C, el punto de contacto, abajo. Las tres aceleraciones, horizontales hacia la pared: la de A, cinco cuartos de g; la de G, tres cuartos; la de C, un cuarto. Sus puntas quedan en una recta a trazos. El giro, horario.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M110 80 A40 40 0 1 0 30 80 A40 40 0 1 0 110 80 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M136 30 L76 130" fill="none" stroke="var(--ink)" stroke-width="1" stroke-dasharray="4 3"/>
        <path d="M55 85.5 A16 16 0 0 1 64.5 65" fill="none" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="48" y="72" font-size="10" text-anchor="end" fill="var(--ink)" font-style="italic">α</text>
        <line x1="70" y1="40" x2="130" y2="40" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="138" y="44" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">a<tspan font-size="7.5" dy="2.5">A</tspan><tspan dy="-2.5"> = 5g/4</tspan></text>
        <line x1="70" y1="80" x2="106" y2="80" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="114" y="84" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">a<tspan font-size="7.5" dy="2.5">G</tspan><tspan dy="-2.5"> = 3g/4</tspan></text>
        <line x1="70" y1="120" x2="82" y2="120" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="90" y="124" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">a<tspan font-size="7.5" dy="2.5">C</tspan><tspan dy="-2.5"> = g/4</tspan></text>
        <circle cx="70" cy="40" r="2.4" fill="var(--ink)"/>
        <text x="63" y="36" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">A</text>
        <circle cx="70" cy="80" r="2.4" fill="var(--ink)"/>
        <text x="66" y="96" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">G</text>
        <circle cx="70" cy="120" r="2.4" fill="var(--ink)"/>
        <text x="63" y="124" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">C</text>
      </svg>
      <figcaption>

      Sin velocidad, cada punto de la vertical de G acelera lo de G más alfa por su altura sobre G: las puntas, en una recta. Rodando, la de C sería nula; aquí vale g/4, hacia la pared: el contacto resbala.

      </figcaption>
      </figure>

      Hacia la pared: el contacto resbala en ese sentido, y el rozamiento, que
      se opone, va hacia fuera, como se dibujó. Y por momentos en $C$, que no
      se han usado: el peso, la normal y el rozamiento pasan por $C$, y el
      muelle, a $R$ por encima, da $MgR$. Al par $I_G\,\alpha$ se le suma el
      momento de $M\vec{a}_G$, aplicado en $G$:

      $$
      MgR = \tfrac12 MR^{2} \cdot \frac{g}{2R} + M \cdot \frac34\,g \cdot R = \tfrac14\,MgR + \tfrac34\,MgR
      $$

      Cuadra.

      **Lo que dice el resultado.** El rozamiento hace dos cosas a la vez:
      frena el centro y hace girar el disco. Para rodar, le haría falta
      $Mg/3$; el suelo solo da $Mg/4$, así que el disco gira menos de lo que
      avanza y el contacto resbala hacia la pared. Si se hubiera supuesto
      rodadura sin comprobarla, $A$ saldría con $2 \cdot \tfrac23\,g = \tfrac43\,g$:
      un resultado razonable y falso.

  - id: ejma12-col1216-la-barra-con-la-masa-puntual-encima
    titulo: La barra con una masa puntual encima al quitar el tirante
    fuente: Ejercicio 12.16 · Tema 12, «Dinámica del sólido con movimiento plano» · Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado y el curso su resolución, y el desarrollo está contrastado contra los dos.
    nivel: practica
    antes:
      idea: |
        Un sólido con movimiento plano cumple tres ecuaciones: la resultante
        de las fuerzas es la masa por la aceleración del centro de gravedad,
        y el momento respecto de G es el momento de inercia en G por la
        aceleración angular. Si el sólido gira alrededor de un punto que no
        acelera, vale también tomar momentos en ese punto, con el momento de
        inercia respecto de él. Dos sólidos que se tocan se hacen la misma
        fuerza, con sentidos opuestos. Un muelle ideal tira a lo largo de sí
        mismo con una fuerza proporcional a lo que se ha estirado desde su
        longitud natural.
      formula: |
        $$
        \sum\vec{F} = M\vec{a}_G,
        \qquad
        \sum M_G = I_G\,\alpha,
        \qquad
        \sum M_O = I_O\,\alpha\ \text{(O sin aceleración)}
        $$

        $$
        F_m = k\,(\ell - \ell_0),
        \qquad
        I_G = \tfrac{1}{12}ML^{2}\ \text{(barra)},
        \qquad
        I_O = I_G + M\,d^{2}
        $$
      reconocer: |
        Antes de calcular se mira qué piezas forman el sistema y cuáles solo
        están apoyadas en otras.
    enunciado: |
      Una barra $AB$ de masa $M$ y longitud $3L$ soporta una masa puntual $M$, no
      existiendo rozamiento entre ambas. El sistema está en equilibrio mediante el
      muelle ideal $AC$ de constante $k$ y la barra rígida $BD$, observándose que
      ésta soporta un esfuerzo de magnitud $Mg$. Determinar:

      a) El valor de la constante $k$ en el equilibrio.

      b) La reacción entre la masa puntual y la barra $AB$ inmediatamente después
      de eliminar la barra $BD$.

