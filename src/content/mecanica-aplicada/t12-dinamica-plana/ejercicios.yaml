      <figcaption>

      En cada articulación, la fuerza se dibuja con su sentido positivo en una barra y al revés en la otra. El par P del motor es el que da a la barra 1 la velocidad y la aceleración angulares del enunciado. Las tres aceleraciones angulares son horarias.

      </figcaption>
      </figure>

      - **En A**, la reacción, $A_x$ y $A_y$, y el par $P$ del motor: sin él,
        la barra 1 no podría tener la $\omega_1$ y la $\alpha_1$ del
        enunciado.
      - **En B**, $B_x$ y $B_y$, lo que la barra 1 le hace a la 2; sobre la 1
        van al revés.
      - **En C**, $C_x$ y $C_y$, lo que la barra 2 le hace a la 3; sobre la 2
        van al revés.
      - **En D**, la reacción, $D_x$ y $D_y$.
      - **Los pesos**, a media barra: $M_1 g = 39{,}24$ N, $M_2 g = 29{,}43$ N
        y $M_3 g = 58{,}86$ N.
      - **Al lado**, $M a_G$ y $I_G\,\alpha$ de cada barra.

      **2. Incógnitas.** Ocho componentes de fuerza y el par: nueve, con tres
      ecuaciones por barra. Las aceleraciones las da antes la cinemática. Para
      las reacciones no hace falta el par: se empieza por la barra 3, cuya
      ecuación de momentos y cuya vertical solo tienen $C_y$ y $D_y$.

      **3. Ecuaciones.** Con $x$ hacia la derecha, $y$ hacia arriba y los
      giros antihorarios positivos. Las flechas de la figura dicen que $B$ y
      $C$ suben: giro horario, $\omega_1 = -2$ rad/s y
      $\alpha_1 = -3\ \text{rad/s}^{2}$.

      <figure class="figura-examen">
      <svg viewBox="98 4 152 142" role="img" width="228" height="213" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">Las velocidades de B y de C en el entramado</title>
        <desc id="dsl-d">Las tres barras en el instante del enunciado: AB horizontal, BC vertical y CD horizontal, con A y D fijos. B gira alrededor de A y C alrededor de D, las dos barras en sentido horario, así que las velocidades de B y de C son verticales y hacia arriba: paralelas a la barra BC, que las une.</desc>
