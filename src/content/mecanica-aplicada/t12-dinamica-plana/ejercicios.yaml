            <circle cx="60" cy="60" r="2.4" fill="var(--ink)"/>
            <text x="60" y="51" font-size="10" text-anchor="middle" font-weight="700" fill="var(--ink)">A</text>
            <circle cx="129.3" cy="100" r="2.4" fill="var(--ink)"/>
            <text x="137.3" y="91" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">C = G</text>
