    pide: Las aceleraciones de los dos sólidos y la reacción entre ellos, en función de M, g y R.
    pasos:
      - tipo: reconocer
        pregunta: |
          Entre el disco y la barra no hay rozamiento. ¿Qué impone eso sobre el
          disco justo después de cortar el hilo?
        opciones:
          - texto: Que la fuerza de contacto es vertical, así que el disco no acelera en horizontal ni gira
            correcta: true
            mensaje: |
              Eso es. Sin rozamiento la única fuerza de contacto es la normal,
              vertical porque la barra es horizontal, y su línea de acción pasa
              por el centro del disco. Ni fuerza horizontal ni momento, así que
              $a_{Gx} = 0$ y $\alpha_{\text{disco}} = 0$.
          - texto: Que el disco rueda sin deslizar sobre la barra
            mensaje: |
              Rodar sin deslizar es justo lo que hace falta rozamiento para
              conseguir. Sin él, el disco no tiene ninguna fuerza que le dé
              momento y no puede empezar a girar.
          - texto: Que el disco y la barra tienen la misma aceleración, porque siguen en contacto
            mensaje: |
              Solo comparten la componente **vertical** en el punto de contacto,
              que es lo que mantiene el contacto. En horizontal son
              independientes, y de hecho aceleran distinto.
          - texto: Que la normal sigue valiendo Mg, porque el disco solo tiene su peso
            mensaje: |
              Valdría $Mg$ si el disco no acelerara. Al cortar el hilo la barra se
              va hacia abajo, el disco la acompaña, y entonces la normal baja
              hasta la mitad del peso.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el disco y la barra por
          separado, justo al cortar el hilo, cada uno con todas las fuerzas que
          actúan sobre él, y al lado de cada uno, lo que tienen que dar esas
          fuerzas**. Sin escala.
        comprueba:
          - punto: |
              **En $A$, la fuerza del muelle, a lo largo de él: hacia $O$, a 45°
              de la vertical.**
            porque: |
              Un muelle ideal solo tira o empuja a lo largo de sí mismo. Antes
              del corte sostenía la barra, así que tira de $A$ hacia arriba,
              hacia $O$.
          - punto: |
              **La normal, la misma en los dos dibujos y con sentidos opuestos:
              hacia arriba sobre el disco y hacia abajo sobre la barra, en su
              punto medio.**
            porque: |
              Es una acción mutua: lo que la barra le hace al disco, el disco
              se lo hace a la barra. Sin rozamiento, es la única fuerza del
              contacto.
          - punto: |
              **Los pesos, $Mg$, en el centro de cada uno, y en $B$, nada.**
            porque: |
              El hilo está cortado: la fuerza que hacía ya no está, y es eso lo
              que pone en marcha el movimiento.
          - punto: |
              **Al lado, $M\vec{a}_G$ en el centro de cada uno, por componentes,
              y su par $I_G\,\alpha$.**
            porque: |
              Ninguna aceleración se conoce todavía: se dibujan en su sentido
              positivo, y el signo lo dan las ecuaciones.
        figura: |
          <svg viewBox="-14 10 420 248" role="img" width="420" height="248" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">Sólidos libres del disco y de la barra al cortar el hilo y lo que tienen que dar sus fuerzas</title>
            <desc id="dsl-d">Arriba, el disco sin la barra: en su centro, el peso, vertical hacia abajo, y en el punto de apoyo, abajo, la normal de la barra, vertical hacia arriba. Un signo igual. Al lado, el mismo disco con lo que tienen que dar esas fuerzas: en su centro, la masa por las dos componentes de su aceleración, hacia la derecha y hacia arriba, y el momento de inercia por la aceleración angular, en sentido antihorario. Abajo, la barra AB sin el muelle ni el disco: en A, el extremo izquierdo, la fuerza del muelle, hacia arriba y hacia la izquierda, a 45 grados de la vertical; en su punto medio, a 2R de A, la normal del disco, que llega desde arriba, y el peso, los dos hacia abajo; en B, nada, porque el hilo está cortado. Un signo igual. Al lado, la misma barra con la masa por las dos componentes de la aceleración de su centro, hacia la derecha y hacia arriba, y el momento de inercia por la aceleración angular, en sentido antihorario.</desc>
            <defs>
              <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
              </marker>
              <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
              </marker>
              <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
