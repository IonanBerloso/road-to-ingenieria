    pide: Las velocidades de A y de B cuando A ha bajado 25 mm, con la biela sin masa y con biela de 10 kg.
    pasos:
      - tipo: reconocer
        pregunta: |
          Al bajar $A$, ¿qué relación hay entre su velocidad y la de $B$?
        opciones:
          - texto: La proyección de las dos sobre la biela es la misma, y de ahí sale que v_B es mayor que v_A
            correcta: true
            mensaje: |
              Eso es. La biela es rígida, así que las proyecciones de $v_A$ y
              $v_B$ sobre $AB$ coinciden. Con la biela casi vertical, $B$ corre
              mucho más deprisa que $A$: aquí 2,3 veces.
          - texto: Son iguales, porque la biela es rígida y no se estira
            mensaje: |
              Rígida quiere decir que la **distancia** $AB$ no cambia, no que
              los dos extremos vayan igual de rápido. Solo coinciden sus
              proyecciones sobre la biela.
          - texto: v_B es cero mientras los muelles no se hayan deformado
            mensaje: |
              Los muelles se deforman justamente porque $B$ se mueve: al
              principio no hay deformación, pero sí velocidad, y de hecho es la
              mayor de las dos.
          - texto: La suma de las dos velocidades es constante, porque la longitud de la biela lo es
            mensaje: |
              Lo que es constante es $x^{2}+y^{2} = L^{2}$. Al derivar sale
              $x\,v_B = y\,v_A$, que es un producto, no una suma.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **las dos masas con la biela, sin
          las ranuras ni los muelles, con todas las fuerzas; y aparte, las dos
          posiciones, con lo que baja $A$, lo que se mueve $B$ y las velocidades
          en la final**. Sin escala.
        comprueba:
          - punto: |
              **En $A$, la reacción de la ranura vertical, horizontal.**
            porque: |
              La ranura no roza: solo empuja perpendicular a ella, y $A$ se
              mueve a lo largo.
          - punto: |
              **En $B$, la de la ranura del suelo, vertical, y las de los dos
              muelles, horizontales.**
            porque: |
              La ranura tampoco roza; los muelles van a lo largo de ella, uno a
              cada lado de $B$.
          - punto: |
              **Los pesos de $A$ y de $B$ y, con la biela de 10 kg, el suyo, a
              media biela.**
            porque: |
              Cada pieza tiene su peso en su centro de gravedad; la biela es
              uniforme.
          - punto: |
              **Entre las dos posiciones, lo que baja $A$ y lo que se mueve
              $B$.**
            porque: |
              Son lo que cambia la energía potencial de los pesos y la de los
              muelles.
          - punto: |
              **En la posición final, las velocidades de $A$ y de $B$, cada una
              a lo largo de su ranura.**
            porque: |
              De sus direcciones sale el centro instantáneo de la biela.
        figura: |
