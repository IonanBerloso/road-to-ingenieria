      - tipo: calcular
        titulo: La aceleración angular de la barra
        pregunta: |
          Con $g = 9{,}81\ \text{m/s}^{2}$, ¿cuánto vale $\alpha_3$, la
          aceleración angular de la barra $AB$, en valor absoluto?
        respuesta:
          tipo: numero
          valor: '36.18'
          tolerancia: 0.06
          formato: un número, en rad/s²
        distractores:
          - valor: '43.05'
            mensaje: |
              Has tomado momentos en $A$ para todo el sistema sin contar la
              fuerza del diente, que actúa a $L/2$ de $A$. No es interna: el
              engranaje (1) está unido al suelo, así que esa fuerza es
              exterior y sí da momento.
          - valor: '53.14'
            mensaje: |
              Has tratado el engranaje (2) como una masa puntual en $B$. Gira
              con $\alpha_2 = 2\alpha_3$, y su radio de giro de 75 mm aporta
              casi un tercio de la inercia equivalente.
          - valor: '47.56'
            mensaje: |
              Has puesto $\alpha_2 = \alpha_3$ en la inercia del engranaje. Al
              ser el doble, el término entra al cuadrado en la energía y por
              cuatro en la inercia equivalente.
        pista: |
          Inercia equivalente respecto de $A$:
          $\frac{m_3L^{2}}{3} + m_2L^{2} + 4m_2 r_G^{2}$. El momento motor es
          el de los dos pesos, $g\!\left(m_3\frac{L}{2} + m_2 L\right)$.
        desarrollo: |
          $$
          g\!\left(m_3\frac{L}{2} + m_2L\right)
          = \left(\frac{m_3L^{2}}{3} + m_2L^{2} + 4m_2r_G^{2}\right)\alpha_3
          $$

          $$
          \frac{12{,}753}{0{,}3525} = 36{,}18\ \text{rad/s}^{2}
          $$

      - tipo: calcular
        titulo: La aceleración angular del engranaje (2)
        pregunta: |
          ¿Y cuánto vale $\alpha_2$, la del engranaje (2), en valor absoluto?
        respuesta:
          tipo: numero
          valor: '72.36'
          tolerancia: 0.12
          formato: un número, en rad/s²
        distractores:
          - valor: '36.18'
            mensaje: |
              Esa es la de la barra. El engranaje gira al doble porque rueda
              sobre el (1), que está fijo. Es además el número que imprime la
              colección en este apartado, y ahí se equivoca de sólido: su
              propia resolución publica 72,36.
          - valor: '18.09'
            mensaje: |
              Has dividido entre dos en vez de multiplicar. La rueda pequeña
              que rueda sobre otra gira **más** deprisa que el brazo, no menos.
          - valor: '108.5'
            mensaje: |
              Has usado un factor 3: el giro de la barra más el doble de él.
              Respecto de la barra, el (1) gira $\alpha_3$ hacia un lado y el
              (2), que engrana con él y tiene el mismo radio, $\alpha_3$ hacia el
              otro. Desde el suelo, $\alpha_2 = \alpha_3 + \alpha_3 = 2\alpha_3$.
        pista: |
          Es la relación de rodadura del paso anterior aplicada a las
          aceleraciones angulares.
        desarrollo: |
          $$
          \alpha_2 = 2\,\alpha_3 = 2 \cdot 36{,}18 = 72{,}36\ \text{rad/s}^{2}
          $$

      - tipo: calcular
        titulo: La aceleración del punto B
        pregunta: |
          ¿Cuánto vale el módulo de la aceleración del punto $B$?
        respuesta:
          tipo: magnitud
          valor: '7.236 m/s^2'
          tolerancia: 0.01
          formato: en m/s², con tres cifras
        distractores:
          - valor: '14.47 m/s^2'
            mensaje: |
              Has multiplicado por $\alpha_2$. $B$ es el centro del engranaje y
              describe una circunferencia de radio $L$ alrededor de $A$, así
              que su aceleración la manda la barra: $a_B = \alpha_3 L$.
          - valor: '3.618 m/s^2'
            mensaje: |
              Has usado $L/2$. $B$ está a la distancia $L$ entera del punto
              fijo $A$; $L/2$ es donde está el centro de la barra.
        pista: |
          Al soltar el sistema $\omega = 0$, así que $B$ solo tiene componente
          tangencial: $a_B = \alpha_3 L$.
        desarrollo: |
          $$
          a_B = \alpha_3 L = 36{,}18 \cdot 0{,}2 = 7{,}236\ \text{m/s}^{2}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Rodadura sobre el engranaje fijo: $\alpha_2 = 2\alpha_3$, y como se parte del reposo, $a_B = \alpha_3 L$ sin término normal.'
          - texto: La inercia equivalente respecto de A es $\frac{m_3L^{2}}{3} + m_2L^{2} + 4m_2r_G^{2} = 0{,}3525$ kg m².
          - texto: 'Los pesos dan el momento motor $g\!\left(m_3\frac{L}{2}+m_2L\right) = 12{,}75$ N m, y de ahí $\alpha_3 = 36{,}18$ y $\alpha_2 = 72{,}36$ rad/s².'
          - texto: La fuerza entre los dientes es interna al conjunto, así que basta con tomar momentos en A sumando las inercias de la barra y del engranaje.
            trampa: true
            mensaje: |
              El engranaje (1) está unido al suelo, así que la fuerza del
              diente es **exterior** y da momento $F_t\,L/2$ respecto de $A$.
              Tomando momentos así, sin ella, salen 43,0 rad/s² en vez de 36,2.
    resolucion: |
      **1. Sólidos libres.** Es un problema de dinámica de dos sólidos con
      movimiento plano, la barra y el engranaje (2); el (1) está fijo y no se
      dibuja aparte. Cada uno, con lo que tienen que dar sus fuerzas:

