        <text x="340" y="95" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">G<tspan font-size="7.5" dy="2.5">1</tspan></text>
        <circle cx="334" cy="150" r="2.4" fill="var(--ink)"/>
        <text x="340" y="144" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">B</text>
        <circle cx="334" cy="200" r="2.4" fill="var(--ink)"/>
        <text x="328" y="194" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">E</text>
        <circle cx="434" cy="50" r="2.4" fill="var(--ink)"/>
        <text x="434" y="43" font-size="10" text-anchor="middle" font-weight="700" fill="var(--ink)">B<tspan font-size="7.5" dy="2.5">0</tspan></text>
        <text x="0" y="22" font-size="11" font-weight="700" fill="var(--ink)">a)</text>
        <text x="262" y="22" font-size="11" font-weight="700" fill="var(--ink)">b)</text>
      </svg>
      <figcaption>

      a) Los pesos trabajan; la reacción en A no, porque A no se mueve; y la fuerza de la pista tampoco, porque el punto de contacto del engranaje tiene velocidad nula. Lo que la barra y el engranaje se hacen en B queda dentro del conjunto. b) Al girar la barra 90°, su centro baja L/2 y B baja L. El engranaje gira al revés que la barra.

      </figcaption>
      </figure>

      - **Los pesos**, $m_1 g$ a media barra y $m_2 g$ en $B$, trabajan.
      - **La reacción en A** no trabaja: $A$ no se mueve.
      - **La fuerza de la pista en E** tampoco: el punto de contacto del
        engranaje tiene velocidad nula.
      - **Al girar 90°**, el centro de la barra baja $L/2$ y $B$ baja $L$.

      **2. Incógnitas.** $\omega_1$, la velocidad angular de la barra en la
      posición final, y $\omega_2$, la del engranaje: dos, con la ecuación de
      la rodadura y la de la energía. Con $\omega_1$, $v_B = \omega_1 L$.

      **3. Ecuaciones.** La barra gira alrededor de $A$, así que
      $v_B = \omega_1 L$. El punto de contacto $E$, a $L/2$ de $B$ y más lejos
      de $A$, tiene velocidad nula; el engranaje gira al revés que la barra:

      $$
      0 = \omega_1 L - \omega_2\,\frac{L}{2}
      $$

      La energía, desde el reposo, sin fuerzas no conservativas que trabajen:

      $$
      m_1 g \frac{L}{2} + m_2 g L
      = \tfrac12\,\frac{m_1L^{2}}{3}\,\omega_1^{2}
      + \tfrac12\,m_2 L^{2}\omega_1^{2}
      + \tfrac12\,m_2 r_G^{2}\,\omega_2^{2}
      $$

      **4. Resultados.** $\omega_2 = 2\,\omega_1$. Con $m_1 = 2{,}4$ kg,
      $m_2 = 3{,}2$ kg, $L = 0{,}16$ m, $r_G = 0{,}06$ m y
      $g = 9{,}81\ \text{m/s}^{2}$, los pesos dan
      $2{,}4 \cdot 9{,}81 \cdot 0{,}08 = 1{,}884$ J y
      $3{,}2 \cdot 9{,}81 \cdot 0{,}16 = 5{,}023$ J, 6,906 J en total; y el
      coeficiente de $\omega_1^{2}$ es
      $0{,}01024 + 0{,}04096 + 0{,}02304 = 0{,}07424$ kg·m². Así que

      $$
      \omega_1 = \sqrt{\frac{6{,}906}{0{,}07424}} = 9{,}645\ \text{rad/s}
      \qquad
      v_B = 9{,}645 \cdot 0{,}16 = 1{,}543\ \text{m/s}
      $$

      **5. Comprobación.** La energía cinética del engranaje, por otro camino:
      gira alrededor de $E$, que tiene velocidad nula, así que es la de un
      giro alrededor de $E$, con el momento de inercia respecto de $E$:

      $$
      I_E = m_2\left(r_G^{2} + \frac{L^{2}}{4}\right) = 3{,}2 \cdot (0{,}0036 + 0{,}0064) = 0{,}032\ \text{kg}\cdot\text{m}^{2}
      $$

      $$
      T = \tfrac12\,\frac{m_1L^{2}}{3}\,\omega_1^{2} + \tfrac12\,I_E\,(2\omega_1)^{2} = (0{,}01024 + 0{,}064)\,\omega_1^{2} = 0{,}07424\,\omega_1^{2}
      $$

      El mismo coeficiente. Y un tope: si todo cayera libremente $L$, $B$ iría
      a $\sqrt{2gL} = 1{,}772$ m/s; la barra baja solo $L/2$ y parte de la
      energía se va en girar, así que 1,543 m/s, por debajo, es razonable.

      **Lo que dice el resultado.** De los 6,906 J, la barra se lleva
      0,95 J, la traslación del engranaje 3,81 J y su rotación 2,14 J. El
      engranaje se lleva casi nueve de cada diez julios, y casi un tercio del
      total es su giro, al doble de velocidad angular que la barra: por eso
      olvidarse de su radio de giro estropea la respuesta.

  - id: ejma12-col122-la-barra-acb-guiada-por-dos-bloques
    titulo: La barra ACB guiada por dos bloques
    fuente: >-
      Ejercicio 12.2 · Tema 12, «Dinámica del sólido con movimiento plano» ·
      Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección publica el
      resultado, contra el que está contrastado el desarrollo, y se ha
      comprobado también con la resolución oficial del profesor. El resultado
      es simbólico, así que las casillas piden los coeficientes de la
      expresión, no un número con unidades.
    nivel: practica
    antes:
      idea: |
        Un sólido con movimiento plano cumple tres ecuaciones: la resultante
        de las fuerzas es la masa por la aceleración del centro de gravedad,
        y el momento respecto de G es el momento de inercia en G por la
        aceleración angular. La aceleración de un punto del sólido es la de
        otro más la que añade el giro: una perpendicular al segmento que los
        une, y otra hacia el primero, que depende de la velocidad angular. Un
        punto que desliza por una ranura recta fija solo puede acelerar a lo
        largo de ella, y una ranura sin rozamiento solo empuja perpendicular a
        sí misma.
      formula: |
        $$
        \sum\vec{F} = M\vec{a}_G,
        \qquad
        \sum M_G = I_G\,\alpha,
        \qquad
        I_G = \tfrac{1}{12}ML^{2}
        $$

        $$
        \vec{a}_G = \vec{a}_A + \vec{\alpha}\times\overrightarrow{AG} - \omega^{2}\,\overrightarrow{AG}
        $$
      reconocer: |
        Antes de escribir ecuaciones se mira qué puntos de la barra están
        guiados y dónde está su centro de gravedad.
    enunciado: |
      El movimiento de la barra uniforme $ACB$ de masa $M$ está guiado por dos
      bloques de masa despreciable que deslizan sin rozamiento en las ranuras
      mostradas. Una fuerza $P$ se aplica al bloque $A$ haciendo que la barra
      parta del reposo con una aceleración angular de valor $\alpha$ opuesta al
      sentido del giro de las manecillas del reloj. Calcular:

      a) Fuerza necesaria $P$.

      b) Reacción en $A$.

      <figure>
