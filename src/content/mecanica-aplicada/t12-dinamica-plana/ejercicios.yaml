          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <line x1="30" y1="70" x2="230" y2="70" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
        <line x1="280" y1="70" x2="480" y2="70" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
        <path d="M30 48 H80 M30 44 V52 M80 44 V52" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="55" y="44" font-size="9" text-anchor="middle" fill="var(--faint)">L/4</text>
        <path d="M80 48 H130 M80 44 V52 M130 44 V52" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="105" y="44" font-size="9" text-anchor="middle" fill="var(--faint)">L/4</text>
        <path d="M80 32 H230 M80 28 V36 M230 28 V36" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="155" y="28" font-size="9" text-anchor="middle" fill="var(--faint)">3L/4</text>
        <path d="M365 64.5 A16 16 0 0 1 395 64.5" fill="none" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="380" y="48" font-size="10" text-anchor="middle" fill="var(--ink)" font-style="italic">I<tspan font-size="7.5" dy="2.5">G</tspan><tspan dy="-2.5">α</tspan></text>
        <line x1="42" y1="84" x2="72" y2="84" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
