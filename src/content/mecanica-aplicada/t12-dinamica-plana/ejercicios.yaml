# De ocho en ocho y no de diez: con el sólido libre, las flechas de vector y la
# comprobación, el bloque del 12.11 al 12.20 pesaba 2,99 MiB,
# a un paso de los 3 MB (lib/ejercicios.ts).
porPagina: 8
ejercicios:
  - id: ejma12-el-cilindro-que-rueda-por-el-plano
    titulo: Un cilindro que rueda por un plano inclinado
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    antes:
      idea: |
        Un sólido con movimiento plano cumple tres ecuaciones: la resultante
        de las fuerzas es la masa por la aceleración del centro de gravedad,
        y el momento respecto de G es el momento de inercia en G por la
        aceleración angular. Respecto de otro punto, al par de inercia se le
        suma el momento del vector masa por aceleración de G, aplicado en G.
        Un sólido que rueda sin deslizar sobre una superficie fija tiene el
        punto de contacto con velocidad nula, y su centro avanza lo que gira
        por el radio.
      formula: |
        $$
        \sum\vec{F} = M\vec{a}_G,
        \qquad
        \sum M_G = I_G\,\alpha,
        \qquad
        \sum M_P = I_G\,\alpha + M\,a_G\,d
        $$

        $$
        a_G = \alpha\,R,
        \qquad
        I_G = \tfrac12 MR^{2}\ \text{(cilindro macizo)}
        $$
      reconocer: |
        Antes de calcular se mira qué fuerzas no se conocen y dónde están
        aplicadas.
    enunciado: |
      Un cilindro macizo y homogéneo de 2 kg rueda sin deslizar por un plano
      inclinado 30°. Tomando $g = 9{,}8\ \text{m/s}^{2}$, calcular la aceleración
      de su centro y el coeficiente de rozamiento mínimo para que no deslice.
    pide: La aceleración del centro y el rozamiento mínimo.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿En qué punto conviene tomar momentos para sacar la aceleración?
        opciones:
          - texto: En el punto de contacto, sumando el momento de M·aG, porque ahí no aparecen N ni Fr
            correcta: true
            mensaje: |
              Eso es. En el contacto la normal y el rozamiento no dan momento, y
              la ecuación sale con una sola incógnita, si al par $I_G\,\alpha$ le
              sumas el momento de $M a_G$, que es $M a_G R$.
          - texto: En el centro, porque allí la ecuación es la más sencilla
            mensaje: |
              Se puede, pero entonces el rozamiento da momento y aparece como
              incógnita: hay que combinarla con la ecuación de fuerzas. En el
              contacto sale directamente.
          - texto: En el punto de contacto, con solo el par I_G·α
            mensaje: |
              Fuera de $G$ hay que contar también el momento de $M\vec{a}_G$
              respecto del punto. Sin él, la aceleración sale tres veces mayor.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el cilindro sin el plano, con
          todas las fuerzas que actúan sobre él, y al lado, lo que tienen que
          dar esas fuerzas**. Sin escala.
        comprueba:
          - punto: |
              **El peso, $Mg$, vertical, en el centro $G$.**
            porque: |
              El cilindro es homogéneo: su centro de gravedad es su centro
              geométrico.
          - punto: |
              **En el punto de contacto, la normal $N$, perpendicular al plano.**
            porque: |
              Es lo que el plano empuja hacia fuera de su superficie; lo que va
              a lo largo de ella se dibuja aparte.
          - punto: |
              **En el punto de contacto, el rozamiento $F_r$, a lo largo del
              plano y hacia arriba.**
            porque: |
              Es la única fuerza con momento respecto de $G$: es la que hace
              girar el cilindro, y tiene que girarlo en el sentido en que rueda
              al bajar.
          - punto: |
              **Al lado, $M a_G$ a lo largo del plano y hacia abajo, y el par
              $I_G\,\alpha$ en el sentido en que gira.**
            porque: |
              Es lo que tienen que dar las fuerzas: el centro baja por el plano
              y el cilindro gira cada vez más deprisa.
        figura: |
          <svg viewBox="10 62 400 140" role="img" width="400" height="140" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">Sólido libre del cilindro y lo que tienen que dar sus fuerzas</title>
            <desc id="dsl-d">A la izquierda, el cilindro sobre el plano, que baja hacia la derecha 30 grados; el plano, quitado y a trazos. En el centro G, el peso, vertical hacia abajo. En el punto de contacto C, la normal, perpendicular al plano, y el rozamiento, a lo largo del plano y hacia arriba. Un signo igual. A la derecha, el mismo cilindro con lo que tienen que dar esas fuerzas: en G, la masa por la aceleración de G, a lo largo del plano y hacia abajo, y el momento de inercia en G por la aceleración angular, en sentido horario.</desc>
            <defs>
              <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
              </marker>
              <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
              </marker>
              <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
              </marker>
            </defs>
            <path d="M173.0 113.6 A42 42 0 1 0 89.0 113.6 A42 42 0 1 0 173.0 113.6 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M369.0 113.6 A42 42 0 1 0 285.0 113.6 A42 42 0 1 0 369.0 113.6 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M23.4 100.0 L158.5 178.0" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
            <path d="M23.4 100.0 H73.4" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
            <path d="M49.4 115 A30 30 0 0 0 53.4 100" fill="none" stroke="var(--ink)" stroke-width="0.9"/>
            <text x="56.4" y="114" font-size="10" fill="var(--ink)">30°</text>
            <path d="M311.4 104.6 A18 18 0 0 1 344.7 110.5" fill="none" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
            <text x="319" y="89.6" font-size="10" text-anchor="end" fill="var(--ink)" font-style="italic">I<tspan font-size="7.5" dy="2.5">G</tspan><tspan dy="-2.5">α</tspan></text>
            <line x1="131" y1="113.6" x2="131" y2="149.6" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
            <text x="137" y="143.6" font-size="10" text-anchor="start" fill="var(--flag)">Mg</text>
            <line x1="89" y1="186.4" x2="108" y2="153.5" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
            <text x="83" y="188.4" font-size="10" text-anchor="end" fill="var(--d2-tinta)">N</text>
            <line x1="106.5" y1="148" x2="73.6" y2="129" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
            <text x="82.7" y="149.3" font-size="10" text-anchor="middle" fill="var(--d2-tinta)">F<tspan font-size="7.5" dy="2.5">r</tspan></text>
            <line x1="327" y1="113.6" x2="366.8" y2="136.6" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
            <text x="370.8" y="148.6" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">Ma<tspan font-size="7.5" dy="2.5">G</tspan></text>
            <circle cx="131" cy="113.6" r="2.4" fill="var(--ink)"/>
            <text x="124" y="108.6" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">G</text>
            <circle cx="110" cy="150" r="2.4" fill="var(--ink)"/>
            <text x="118" y="166" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">C</text>
            <circle cx="327" cy="113.6" r="2.4" fill="var(--ink)"/>
            <text x="320" y="127.6" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">G</text>
            <text x="233" y="117.6" font-size="9" text-anchor="middle" fill="var(--faint)">=</text>
          </svg>

      - tipo: calcular
        titulo: La aceleración del centro
        pregunta: |
          ¿Cuánto vale la aceleración del centro, en m/s²?
        respuesta:
          tipo: numero
          valor: '3.267'
          tolerancia: 0.01
          formato: un número, en m/s²
        distractores:
          - valor: '4.9'
            mensaje: |
              Es $g \sin 30°$, la de un bloque que desliza sin rozamiento. El
              cilindro rueda: parte de la energía se va en girar, y acelera
              menos.
          - valor: '2.45'
            mensaje: |
              Es la de un anillo, con $I_G = MR^{2}$. El cilindro macizo tiene
              $I_G = MR^{2}/2$.
          - valor: '9.8'
            mensaje: |
              Has tomado momentos en el contacto solo con $I_G\,\alpha$, sin el
              momento de $M a_G$. Falta ese término.
        pista: |
          Momentos en el contacto: $M g R \sin 30° = I_G\,\alpha + M\,a_G\,R$, con
          $I_G = MR^{2}/2$ y $\alpha = a_G/R$.
        desarrollo: |
          $$
          M g R \sin 30° = \tfrac12 M R^{2} \frac{a_G}{R} + M a_G R
          \;\Longrightarrow\;
          a_G = \tfrac23\,g \sin 30° = 3{,}267\ \text{m/s}^{2}
          $$

      - tipo: calcular
        titulo: El rozamiento mínimo
        pregunta: |
          ¿Qué coeficiente de rozamiento mínimo hace falta para que no deslice?
        respuesta:
          tipo: numero
          valor: '0.1925'
          tolerancia: 0.002
          formato: un número, sin unidad
        distractores:
          - valor: '0.577'
            mensaje: |
              Es $\tan 30°$, el coeficiente que necesita un bloque para quedarse
              quieto. El cilindro no está quieto: rueda, y el rozamiento solo
              tiene que dar la parte que hace girar.
          - valor: '0.2887'
            mensaje: |
              Es el de un anillo, $\tfrac12 \tan 30°$. Con el cilindro macizo el
              rozamiento es menor: $\tfrac13 \tan 30°$.
        pista: |
          Del teorema del momento angular en $G$: $F_r R = I_G\,\alpha$, así que
          $F_r = \tfrac12 M a_G$. Y $N = M g \cos 30°$.
        desarrollo: |
          $$
          F_r = \tfrac12 M a_G = 3{,}267\ \text{N}
          \qquad
          N = 2 \cdot 9{,}8 \cos 30° = 16{,}97\ \text{N}
          \qquad
          \mu_{\min} = \frac{3{,}267}{16{,}97} = 0{,}1925
          $$

          Que es $\tfrac13 \tan 30°$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Momentos en el contacto, con el sistema equivalente: $M g R \sin 30° = I_G\,\alpha + M a_G R$.'
          - texto: Con $I_G = MR^{2}/2$ y $\alpha = a_G/R$, $a_G = \tfrac23 g \sin 30° = 3{,}27$ m/s².
          - texto: En $G$, $F_r R = I_G\,\alpha$, así que $F_r = \tfrac12 M a_G = 3{,}27$ N, y $\mu \ge 3{,}27/16{,}97 = 0{,}19$.
          - texto: Como rueda sin deslizar, el rozamiento vale $\mu N$ y el cilindro acelera $g(\sin 30° - \mu \cos 30°)$.
            trampa: true
            mensaje: |
              Rodar sin deslizar es un rozamiento **estático**, por debajo de su
              techo: vale lo que pida el equilibrio de momentos, 3,27 N, no
              $\mu N$. Esa fórmula es la de un bloque que desliza.
    resolucion: |
      **1. Sólidos libres.** Es un problema de dinámica de un sólido con
      movimiento plano: el dibujo lleva el cilindro sin el plano, y al lado, lo
      que tienen que dar sus fuerzas.

      <figure class="figura-examen">
      <svg viewBox="10 62 400 140" role="img" width="600" height="210" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">Sólido libre del cilindro y lo que tienen que dar sus fuerzas</title>
        <desc id="dsl-d">A la izquierda, el cilindro sobre el plano, que baja hacia la derecha 30 grados; el plano, quitado y a trazos. En el centro G, el peso, vertical hacia abajo. En el punto de contacto C, la normal, perpendicular al plano, y el rozamiento, a lo largo del plano y hacia arriba. Un signo igual. A la derecha, el mismo cilindro con lo que tienen que dar esas fuerzas: en G, la masa por la aceleración de G, a lo largo del plano y hacia abajo, y el momento de inercia en G por la aceleración angular, en sentido horario.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M173.0 113.6 A42 42 0 1 0 89.0 113.6 A42 42 0 1 0 173.0 113.6 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M369.0 113.6 A42 42 0 1 0 285.0 113.6 A42 42 0 1 0 369.0 113.6 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M23.4 100.0 L158.5 178.0" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
        <path d="M23.4 100.0 H73.4" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
        <path d="M49.4 115 A30 30 0 0 0 53.4 100" fill="none" stroke="var(--ink)" stroke-width="0.9"/>
        <text x="56.4" y="114" font-size="10" fill="var(--ink)">30°</text>
        <path d="M311.4 104.6 A18 18 0 0 1 344.7 110.5" fill="none" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="319" y="89.6" font-size="10" text-anchor="end" fill="var(--ink)" font-style="italic">I<tspan font-size="7.5" dy="2.5">G</tspan><tspan dy="-2.5">α</tspan></text>
        <line x1="131" y1="113.6" x2="131" y2="149.6" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
        <text x="137" y="143.6" font-size="10" text-anchor="start" fill="var(--flag)">Mg</text>
        <line x1="89" y1="186.4" x2="108" y2="153.5" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="83" y="188.4" font-size="10" text-anchor="end" fill="var(--d2-tinta)">N</text>
        <line x1="106.5" y1="148" x2="73.6" y2="129" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="82.7" y="149.3" font-size="10" text-anchor="middle" fill="var(--d2-tinta)">F<tspan font-size="7.5" dy="2.5">r</tspan></text>
        <line x1="327" y1="113.6" x2="366.8" y2="136.6" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="370.8" y="148.6" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">Ma<tspan font-size="7.5" dy="2.5">G</tspan></text>
        <circle cx="131" cy="113.6" r="2.4" fill="var(--ink)"/>
        <text x="124" y="108.6" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">G</text>
        <circle cx="110" cy="150" r="2.4" fill="var(--ink)"/>
        <text x="118" y="166" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">C</text>
        <circle cx="327" cy="113.6" r="2.4" fill="var(--ink)"/>
        <text x="320" y="127.6" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">G</text>
        <text x="233" y="117.6" font-size="9" text-anchor="middle" fill="var(--faint)">=</text>
      </svg>
      <figcaption>

      A la izquierda, el sólido libre; a la derecha, lo que tienen que dar sus fuerzas: M aG a lo largo del plano y IG α. El rozamiento es la única fuerza con momento respecto de G: va hacia arriba del plano, porque es el que hace girar el cilindro en el sentido en que rueda.

      </figcaption>
      </figure>

      - **En G**, el peso, $Mg = 2 \cdot 9{,}8 = 19{,}6$ N.
      - **En el contacto C**, la normal $N$, perpendicular al plano, y el
        rozamiento $F_r$, a lo largo del plano y hacia arriba.
      - **Al lado**, $M a_G$ a lo largo del plano, hacia abajo, y el par
        $I_G\,\alpha$, en el sentido en que gira.

      **2. Incógnitas.** $a_G$, $\alpha$, $N$ y $F_r$: cuatro, con las tres
      ecuaciones del movimiento plano y la de rodar sin deslizar. El
      coeficiente mínimo sale al final, de la condición $F_r \le \mu N$.

      **3. Ecuaciones.** Perpendicular al plano, $G$ no acelera. Momentos en
      $C$, donde $N$ y $F_r$ no dan momento: fuera de $G$ se suma el momento
      de $M a_G$, que está a $R$ de $C$. Y momentos en $G$, donde solo da
      momento el rozamiento:

      $$
      N - M g \cos 30° = 0
      \qquad
      M g R \sin 30° = I_G\,\alpha + M a_G R
      \qquad
      F_r\,R = I_G\,\alpha
      $$

      con $I_G = \tfrac12 MR^{2}$ y $a_G = \alpha R$.

      **4. Resultados.**

      $$
      a_G = \tfrac23\,g \sin 30° = 3{,}267\ \text{m/s}^{2}
      \qquad
      F_r = \tfrac12 M a_G = 3{,}267\ \text{N}
      \qquad
      N = 2 \cdot 9{,}8 \cdot 0{,}866 = 16{,}97\ \text{N}
      $$

      Rodar sin deslizar exige $F_r \le \mu N$:
      $\mu_{\min} = 3{,}267/16{,}97 = 0{,}1925$, un tercio de $\tan 30°$.

      **5. Comprobación.** Por energía, sin pasar por las fuerzas del
      contacto: rodando sin deslizar, el punto de contacto no se mueve y el
      rozamiento no trabaja. Tras bajar $s = 1$ m por el plano, el peso ha
      dado $2 \cdot 9{,}8 \cdot 1 \cdot 0{,}5 = 9{,}8$ J, y el cilindro tiene

      $$
      T = \tfrac12 M v^{2} + \tfrac12 \cdot \tfrac12 MR^{2}\,\frac{v^{2}}{R^{2}} = \tfrac34 M v^{2} = 1{,}5\,v^{2}
      $$

      Así que $v^{2} = 9{,}8/1{,}5 = 6{,}533$ m²/s², y como $v^{2} = 2 a_G s$,
      $a_G = 9{,}8/3 = 3{,}267$ m/s², la misma. El rozamiento, por la ecuación
      de fuerzas a lo largo del plano, que no se ha usado:

      $$
      F_r = M g \sin 30° - M a_G = 9{,}8 - 6{,}533 = 3{,}267\ \text{N}
      $$

      **Lo que dice el resultado.** El cilindro baja con dos tercios de la
      aceleración de un bloque sin rozamiento: un tercio de la energía que
      gana se va en girar. Ni la masa ni el radio importan: todos los
      cilindros macizos bajan igual. Y el rozamiento que hace falta es un
      tercio de $\tan 30°$; si el plano da más, el rozamiento se queda en
      3,267 N, sin llegar a su techo.

  - id: ejma12-la-barra-que-se-suelta
    titulo: Una barra articulada que se suelta desde la horizontal
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    antes:
      idea: |
        Un sólido con movimiento plano cumple tres ecuaciones: la resultante
        de las fuerzas es la masa por la aceleración del centro de gravedad,
        y el momento respecto de G es el momento de inercia en G por la
        aceleración angular. Respecto de otro punto, al par de inercia se le
        suma el momento del vector masa por aceleración de G, aplicado en G.
        Un punto que gira alrededor de un punto fijo, a una distancia r de él,
        tiene una aceleración tangente a su trayectoria y otra hacia el punto
        fijo.
      formula: |
        $$
        \sum\vec{F} = M\vec{a}_G,
        \qquad
        \sum M_G = I_G\,\alpha,
        \qquad
        \sum M_P = I_G\,\alpha + M\,a_G\,d
        $$

        $$
        a_t = \alpha\,r,
        \qquad
        a_n = \omega^{2} r,
        \qquad
        I_G = \tfrac{1}{12} ML^{2}\ \text{(barra)},
        \qquad
        I_O = I_G + M\,d^{2}
        $$
      reconocer: |
        Antes de calcular se mira cómo se mueve cada punto de la barra al
        soltarla.
    enunciado: |
      Una barra homogénea de 1 m y 3 kg está articulada en su extremo $O$ y se
      mantiene horizontal. Se suelta desde el reposo. Tomando
      $g = 9{,}8\ \text{m/s}^{2}$, calcular su aceleración angular y la reacción
      vertical en la articulación en el instante de soltarla.
    pide: La aceleración angular y la reacción en O al soltarla.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué ecuación da directamente la aceleración angular?
        opciones:
          - texto: La del momento angular en el punto fijo O, con I_O
            correcta: true
            mensaje: |
              Eso es. $O$ es fijo, así que $\sum M_O = I_O\,\alpha$, y la reacción
              en $O$ no da momento: una sola incógnita.
          - texto: La del momento angular en O, pero con I_G
            mensaje: |
              En un punto fijo el momento de inercia es el respecto de ese
              punto. Con $I_G$ la aceleración sale cuatro veces mayor.
          - texto: La de fuerzas, porque el peso es la única fuerza conocida
            mensaje: |
              En la de fuerzas aparece la reacción en $O$, que no se conoce. La de
              momentos en $O$ la elimina.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **la barra en el instante de
          soltarla, sin la articulación, con todas las fuerzas que actúan
          sobre ella, y al lado, lo que tienen que dar esas fuerzas**. Sin
          escala.
        comprueba:
          - punto: |
              **En $O$, las dos componentes de la reacción, $O_x$ y $O_y$, en
              su sentido positivo.**
            porque: |
              Una articulación sujeta en las dos direcciones del plano; cuánto
              vale cada una lo dicen las ecuaciones.
          - punto: |
              **El peso, $Mg$, en el centro $G$, a $L/2$ de $O$.**
            porque: |
              La barra es homogénea: su centro de gravedad está a media barra.
          - punto: |
              **Al lado, $M a_G$ en $G$, perpendicular a la barra, y el par
              $I_G\,\alpha$ en el sentido en que cae.**
            porque: |
              $G$ gira alrededor de $O$; al soltarla no hay velocidad, así que
              no hay aceleración hacia $O$.
        figura: |
          <svg viewBox="0 42 460 112" role="img" width="460" height="112" aria-labelledby="dsl-t dsl-d">
