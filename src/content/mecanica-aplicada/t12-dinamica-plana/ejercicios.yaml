        <text x="56" y="36" font-size="10" text-anchor="middle" fill="var(--ink)">A</text>
        <text x="150" y="90" font-size="10" fill="var(--ink)">C</text>
        <text x="240" y="152" font-size="10" fill="var(--ink)">B</text>
