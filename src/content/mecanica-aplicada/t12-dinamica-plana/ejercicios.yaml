      <figcaption>

      La masa solo se apoya: la normal es la misma en los dos dibujos, con sentidos opuestos. A trazos, la fuerza de BD: solo antes de quitarla, y su sentido lo dice la ecuación. El poste de O no pesa y va articulado en sus dos extremos: solo empuja a lo largo de sí mismo.

      </figcaption>
      </figure>

      - **En A**, el muelle, $kL$, hacia abajo: tiene longitud natural nula y
        mide $L$.
      - **En O**, $T_O$, vertical: el poste no pesa y va articulado en sus dos
        extremos.
      - **En G**, a $L/2$ de $O$, el peso de la barra, $Mg$, y la normal de la
        masa, $N$, hacia abajo. Sobre la masa, su peso, $Mg$, y la misma $N$,
        hacia arriba.
      - **En B**, mientras está, la fuerza de $BD$, $F_{BD}$, vertical, de
        valor $Mg$.
      - **Al lado**, $M a$ en la masa, y $M a_G$ e $I_G\,\alpha$ en la barra.

      **2. Incógnitas.** En el equilibrio, $k$, $T_O$ y el sentido de
      $F_{BD}$; basta la ecuación de momentos en $O$, donde $T_O$ no entra.
      Quitada $BD$, $\alpha$, $N$ y $T_O$, con las ecuaciones de la barra y la
      vertical de la masa; las aceleraciones las da la cinemática.

      **3. Ecuaciones.** Con $y$ hacia arriba y los giros antihorarios
      positivos. En el equilibrio, momentos en $O$, con $F_{BD}$ positiva hacia
      arriba:

      $$
      kL \cdot L - Mg\,\frac{L}{2} - Mg\,\frac{L}{2} + F_{BD} \cdot 2L = 0
      \qquad
      F_{BD} = \pm Mg
      $$

      Quitada $BD$, $O$ no acelera: el poste no le deja subir ni bajar, y en
      horizontal no hay ninguna fuerza. Vale tomar momentos en él, con el
      momento de inercia de la barra respecto de $O$:

      $$
      I_O = \tfrac{1}{12}M(3L)^{2} + M\left(\tfrac{L}{2}\right)^{2} = ML^{2}
      $$

      $$
      kL \cdot L - Mg\,\frac{L}{2} - N\,\frac{L}{2} = ML^{2}\,\alpha
      \qquad
      N - Mg = M\,a
      \qquad
      a = \alpha\,\frac{L}{2}
      $$

      La última, porque la masa acompaña al punto de la barra que tiene
      debajo, a $L/2$ de $O$, mientras no se despegue.

      **4. Resultados.** Con $F_{BD} = +Mg$ saldría $kL^{2} = MgL - 2MgL$: una
      $k$ negativa, imposible. Así que $BD$ empuja $B$ hacia abajo, trabaja a
      compresión, y

      $$
      kL^{2} = MgL + 2MgL
      \;\Longrightarrow\;
      k = \frac{3Mg}{L}
      $$

      Quitada $BD$, el muelle sigue tirando con $kL = 3Mg$: no le ha dado
      tiempo a cambiar de longitud. Llevando $N = Mg + M\alpha L/2$ a la de
      momentos,

      $$
      3MgL - Mg\,\frac{L}{2} - Mg\,\frac{L}{2} - M\alpha\,\frac{L^{2}}{4} = ML^{2}\,\alpha
      \;\Longrightarrow\;
      2MgL = \frac{5}{4}ML^{2}\,\alpha
      \;\Longrightarrow\;
      \alpha = \frac{8}{5}\,\frac{g}{L}
      $$

      $$
      a = \frac{8}{5}\,\frac{g}{L} \cdot \frac{L}{2} = \frac{4}{5}\,g
      \qquad
      N = Mg + \frac{4}{5}\,Mg = \frac{9}{5}\,Mg
      $$

      $\alpha$ es antihoraria: el lado de $B$ sube, y la masa con él.

      **5. Comprobación.** Primero, el conjunto de barra y masa, sin separar:
      la normal es interna y no aparece. Momentos en $O$, con el momento de
      inercia de los dos, $ML^{2} + M(L/2)^{2} = \tfrac54 ML^{2}$:

      $$
      3MgL - MgL = \frac{5}{4}ML^{2}\,\alpha
      \;\Longrightarrow\;
      \alpha = \frac{8}{5}\,\frac{g}{L}
      $$

      La misma. Después, la normal: la ecuación vertical de la barra da
      $T_O = kL + Mg + N + M a_G = (3 + 1 + 1{,}8 + 0{,}8)\,Mg = 6{,}6\,Mg$, y
      los momentos de la barra en $G$, que no se han usado y en los que $N$ no
      entra, tienen que dar lo mismo. $A$ está a $\tfrac32 L$ de $G$ y $O$, a
      $\tfrac12 L$, los dos a su izquierda; $I_G = \tfrac34 ML^{2}$:

      $$
      \frac32 L \cdot 3Mg - \frac12 L\,T_O = \frac34 ML^{2} \cdot \frac85\,\frac{g}{L} = \frac65\,MgL
      \;\Longrightarrow\;
      T_O = 2\left(\frac92 - \frac65\right) Mg = 6{,}6\,Mg
      $$

      Cuadra, y con ella, $N$.

      **Lo que dice el resultado.** Al quitar $BD$ desaparece una fuerza de
      $Mg$ que empujaba hacia abajo con el brazo más largo, a $2L$ de $O$, y el
      muelle, cargado con $3Mg$, levanta la barra por el lado de $B$. La masa
      sube con $\tfrac45 g$, y para eso la barra la empuja con $\tfrac95 Mg$:
      casi el doble que en equilibrio. Y el poste, que en equilibrio aguantaba
      $3Mg + 2Mg + Mg = 6Mg$, pasa a $6{,}6\,Mg$, aunque se haya quitado una
      fuerza que empujaba hacia abajo.

  - id: ejma12-col1217-el-disco-y-la-barra-en-la-guia-vertical
    titulo: El disco que rueda arrastrado por una barra en una guía vertical
    fuente: Ejercicio 12.17 · Tema 12, «Dinámica del sólido con movimiento plano» · Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado y el curso su resolución, y el desarrollo está contrastado contra los dos. En el apartado a) la resolución del curso encuadra un resultado que sus propias ecuaciones no dan; el desarrollo de aquí coincide con el resultado impreso en la colección.
    nivel: practica
    antes:
      idea: |
        Un sólido con movimiento plano cumple tres ecuaciones: la resultante
        de las fuerzas es la masa por la aceleración del centro de gravedad,
        y el momento respecto de G es el momento de inercia en G por la
        aceleración angular. Si las fuerzas no conservativas no trabajan, la
        suma de la energía cinética y la potencial se conserva; la cinética de
        un sólido es la de su centro de gravedad más la de su giro alrededor
        de él. El centro instantáneo de rotación de un sólido está donde se
        cortan las perpendiculares a las velocidades de dos de sus puntos.
      formula: |
        $$
        T_1 + V_1 = T_2 + V_2,
        \qquad
        T = \tfrac12 M v_G^{2} + \tfrac12 I_G\,\omega^{2}
        $$

        $$
        \sum\vec{F} = M\vec{a}_G,
        \qquad
        \sum M_G = I_G\,\alpha,
        \qquad
        \vec{a}_P = \vec{a}_G + \vec{\alpha}\times\overrightarrow{GP} - \omega^{2}\,\overrightarrow{GP}
        $$

        $$
        I_G = \tfrac12 MR^{2}\ \text{(disco)},
        \qquad
        I_G = \tfrac{1}{12}ML^{2}\ \text{(barra)}
        $$
      reconocer: |
        Antes de calcular se mira qué puntos tienen la velocidad obligada por
        una guía o por un apoyo, y en qué dirección.
    enunciado: |
      Un disco homogéneo de masa $M$ y radio $R$ contacta sin deslizamiento sobre
      un suelo horizontal. Una barra homogénea $AB$ también de masa $M$ y de
      longitud $L$ articula en el centro geométrico del disco y en una corredera
      sin masa que desliza sin rozamiento en una guía vertical fija. El conjunto
      se mantiene inmóvil en la posición indicada en la figura, esto es, formando
      la barra $AB$ un ángulo de 60º con la guía vertical. Dejado el conjunto en
      libertad, se inicia el movimiento. Calcular:

      a) Velocidad angular de rotación del disco en el instante en el que la barra
      $AB$ se coloca en posición vertical.

      b) Diagramas del cuerpo libre en la posición inicial.

      c) Aceleración angular del disco en el instante de inicio del movimiento.

