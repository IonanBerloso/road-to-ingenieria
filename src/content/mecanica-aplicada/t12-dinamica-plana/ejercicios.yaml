            <circle cx="274" cy="60" r="2.4" fill="var(--ink)"/>
            <text x="274" y="51" font-size="10" text-anchor="middle" font-weight="700" fill="var(--ink)">A</text>
            <circle cx="343.3" cy="100" r="2.4" fill="var(--ink)"/>
            <text x="351.3" y="91" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">G</text>
            <circle cx="412.6" cy="140" r="2.4" fill="var(--ink)"/>
            <text x="418.6" y="153" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">B</text>
            <text x="236.3" y="104" font-size="9" text-anchor="middle" fill="var(--faint)">=</text>
          </svg>

      - tipo: calcular
        titulo: El coeficiente de Mg en la fuerza P
        pregunta: |
          La fuerza sale de la forma $P = M(c_1\,g + c_2\,L\alpha)$. ¿Cuánto
          vale $c_1$, el coeficiente de $Mg$?
        respuesta:
          tipo: numero
          valor: '1.7320508'
          tolerancia: 0.002
          formato: un número, sin unidad (el coeficiente de Mg)
        distractores:
          - valor: '0.5773503'
            mensaje: |
              Es $1/\sqrt{3}$: has cambiado el brazo horizontal por el
              vertical al tomar momentos. El brazo de $R_A$ es
              $\frac{L}{2}\cos 30^\circ$ y el de $P$, $\frac{L}{2}\sin 30^\circ$,
              y el cociente de los dos es $\sqrt{3}$.
          - valor: '1'
            mensaje: |
              Has supuesto que $P$ equilibra el peso. $P$ es horizontal y el
              peso vertical: lo que las relaciona es la ecuación de momentos,
              y ahí aparece el $\sqrt{3}$ de la geometría.
          - valor: '0.8660254'
            mensaje: |
              Es $\cos 30^\circ$, uno solo de los dos brazos. En el cociente
              aparecen los dos, y sale $\cos 30^\circ / \sin 30^\circ = \sqrt{3}$.
        pista: |
          Con $\alpha = 0$ el problema es de estática: $R_A = Mg$, y momentos
          en $G$ dan $P\,\frac{L}{2}\sin 30^\circ = R_A\,\frac{L}{2}\cos 30^\circ$.
        desarrollo: |
          $$
          P\,\frac{L}{2}\sin 30^\circ - R_A\,\frac{L}{2}\cos 30^\circ = I_G\,\alpha
          \;\Longrightarrow\;
          c_1 = \frac{\cos 30^\circ}{\sin 30^\circ} = \sqrt{3} = 1{,}732
          $$

      - tipo: calcular
        titulo: El coeficiente de MLalfa en la fuerza P
        pregunta: |
          En $P = M(\sqrt{3}\,g + c_2\,L\alpha)$, ¿cuánto vale $c_2$?
        respuesta:
          tipo: numero
          valor: '1.0833333'
          tolerancia: 0.002
          formato: un número, sin unidad (el coeficiente de MLalfa)
        distractores:
          - valor: '0.0833333'
            mensaje: |
              Es $1/12$, o sea solo el par $I_G\alpha$. Falta el otro camino
              por el que entra $\alpha$: la reacción $R_A$ ya lleva dentro
              $\sqrt{3}L\alpha/4$, y al despejar $P$ eso aporta $3/4$.
          - valor: '0.75'
            mensaje: |
              Es solo la parte que entra por $R_A$. Falta el par $I_G\alpha$,
              que al despejar $P$ añade $\frac{4}{L}\cdot\frac{ML^{2}}{12}\,\alpha = \frac{ML\alpha}{3}$:
              otro $1/3$ en el coeficiente.
          - valor: '0.4330127'
            mensaje: |
              Es $\sqrt{3}/4$, el coeficiente que lleva la reacción en $A$, no
              la fuerza $P$. Al pasar de $R_A$ a $P$ hay que multiplicar por
              $\sqrt{3}$ y sumar el par de inercia.
        pista: |
          $P = \sqrt{3}R_A + \frac{2 I_G \alpha}{L\sin 30^\circ}$, con
          $R_A = M\!\left(g + \frac{\sqrt{3}}{4}L\alpha\right)$ e
          $I_G = ML^{2}/12$.
        desarrollo: |
          $$
          c_2 = \sqrt{3}\cdot\frac{\sqrt{3}}{4} + \frac{1}{3}
          = \frac{3}{4} + \frac{1}{3} = \frac{13}{12} = 1{,}0833
          $$

      - tipo: calcular
        titulo: El coeficiente de MLalfa en la reacción en A
        pregunta: |
          La reacción vale $R_A = M(g + c_3\,L\alpha)$. ¿Cuánto vale $c_3$?
        respuesta:
          tipo: numero
          valor: '0.4330127'
          tolerancia: 0.002
          formato: un número, sin unidad (el coeficiente de MLalfa)
        distractores:
          - valor: '0'
            mensaje: |
              Has supuesto que la ranura sostiene solo el peso. $G$ acelera
              **hacia arriba** con $\sqrt{3}L\alpha/4$, así que la ranura tiene
              que empujar más que el peso.
          - valor: '0.25'
            mensaje: |
              Es $L/4$ sin el $\cos 30^\circ$. La componente vertical de
              $\vec{\alpha}\times\overrightarrow{AG}$ vale
              $\frac{L}{2}\alpha\cos 30^\circ$, no $\frac{L}{2}\alpha\sin 30^\circ$.
          - valor: '0.8660254'
            mensaje: |
              Te has dejado el $1/2$ de $\overrightarrow{AG} = L/2$: has puesto
              la longitud entera en vez de la media barra.
        pista: |
          $\vec{a}_G = \vec{a}_A + \vec{\alpha}\times\overrightarrow{AG}$, y
          $a_{Gx} = 0$ porque $G$ va por la ranura vertical. Luego
          $R_A - Mg = M a_{Gy}$.
        desarrollo: |
          $$
          a_{Gy} = \frac{L}{2}\,\alpha\cos 30^\circ = \frac{\sqrt{3}}{4}L\alpha
          \qquad
          R_A = M\!\left(g + \frac{\sqrt{3}}{4}L\alpha\right)
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'C es el punto medio, así que G = C y la ranura vertical impone $a_{Gx} = 0$; entonces $a_{Gy} = \frac{\sqrt{3}}{4}L\alpha$.'
          - texto: 'Momento lineal en vertical: $R_A - Mg = Ma_{Gy}$, o sea $R_A = M\!\left(g + \frac{\sqrt{3}}{4}L\alpha\right)$.'
          - texto: 'Momentos en G, donde solo dan momento P y $R_A$: $P\frac{L}{4} - R_A\frac{\sqrt{3}L}{4} = \frac{ML^{2}}{12}\alpha$, y sale $P = M\!\left(\sqrt{3}g + \frac{13}{12}L\alpha\right)$.'
          - texto: Como los bloques no tienen masa y las ranuras no rozan, la fuerza sobre el bloque C es nula y P se lleva sola todo el peso.
            trampa: true
            mensaje: |
              Un bloque sin masa no anula la fuerza, solo obliga a que la suma
              sobre él sea cero. La ranura vertical empuja a $C$ en horizontal
              con $N_C = P$, y es lo que impide que la barra se vaya de lado.
    resolucion: |
      **1. Sólidos libres.** Es un problema de dinámica de un sólido con
      movimiento plano: el dibujo lleva la barra sin los bloques, que no tienen
      masa, y al lado, lo que tienen que dar sus fuerzas.

