        <text x="190" y="68" font-size="10" text-anchor="middle" font-weight="700" fill="var(--ink)">A</text>
        <circle cx="130" cy="50" r="2.4" fill="var(--ink)"/>
        <text x="138" y="42" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">B</text>
        <circle cx="130" cy="100" r="2.4" fill="var(--ink)"/>
        <text x="138" y="116" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">C</text>
        <circle cx="230" cy="100" r="2.4" fill="var(--ink)"/>
        <text x="230" y="118" font-size="10" text-anchor="middle" font-weight="700" fill="var(--ink)">D</text>
