        comprueba:
          - punto: |
              **En $A$, las dos componentes de la reacción, $A_x$ y $A_y$, en su
              sentido positivo.**
            porque: |
              Una articulación sujeta en las dos direcciones del plano; cuánto
              vale cada una lo dicen las ecuaciones.
          - punto: |
              **Los pesos: $mg$ en el centro de cada barra, o los dos juntos,
              $2mg$, en $G$, sobre la horizontal de $A$.**
            porque: |
              Las barras son uniformes e iguales, y simétricas respecto de la
              horizontal de $A$: su centro común queda en ella.
          - punto: |
              **Al lado, $2m\,a_G$ en $G$ y el par $I_G\,\alpha$.**
            porque: |
              Es lo que tienen que dar las fuerzas; la dirección de $a_G$ la da
              la cinemática de un punto que gira alrededor de $A$.
