        <circle cx="163.9" cy="30" r="2.4" fill="var(--ink)"/>
        <text x="169.9" y="34" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">B</text>
        <circle cx="163.9" cy="150" r="2.4" fill="var(--ink)"/>
        <text x="169.9" y="154" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">C</text>
        <circle cx="112" cy="90" r="2.4" fill="var(--ink)"/>
