            <line x1="156" y1="160" x2="190" y2="160" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
            <text x="188" y="153" font-size="10" text-anchor="start" fill="var(--d2-tinta)">P<tspan font-size="7.5" dy="2.5">x</tspan></text>
            <line x1="105" y1="100" x2="105" y2="136" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
            <text x="99" y="134" font-size="10" text-anchor="end" fill="var(--flag)">mg</text>
            <line x1="305" y1="100" x2="277.8" y2="79.6" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
            <text x="274" y="78" font-size="10" text-anchor="end" fill="var(--ink)" font-style="italic">ma<tspan font-size="7.5" dy="2.5">G</tspan></text>
            <circle cx="60" cy="40" r="2.4" fill="var(--ink)"/>
            <text x="53" y="35" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">A</text>
            <circle cx="150" cy="160" r="2.4" fill="var(--ink)"/>
            <text x="142" y="174" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">B</text>
            <circle cx="105" cy="100" r="2.4" fill="var(--ink)"/>
            <text x="112" y="102" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">G</text>
            <circle cx="305" cy="100" r="2.4" fill="var(--ink)"/>
            <text x="298" y="114" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">G</text>
            <text x="227" y="104" font-size="9" text-anchor="middle" fill="var(--faint)">=</text>
          </svg>

      - tipo: calcular
        titulo: La aceleración angular de la barra AB
        pregunta: |
          Con $\sin\beta = 1{,}2/1{,}5 = 0{,}8$, ¿cuánto vale el módulo de la
          aceleración angular de $AB$, en rad/s²?
        respuesta:
          tipo: numero
          valor: '2.5'
          tolerancia: 0.02
          formato: un número, en rad/s²
        distractores:
          - valor: '2'
            mensaje: |
              Has dividido la aceleración de $B$ entre la longitud entera,
              $3/1{,}5$. Lo que fija $\alpha$ es la condición de que $A$ solo
              pueda acelerar en vertical, y ahí entra la proyección
              $L\sin\beta = 1{,}2$ m.
          - valor: '3.3333'
            mensaje: |
              Has usado la proyección horizontal, $L\cos\beta = 0{,}9$ m. La
              componente horizontal de $\vec{\alpha}\times\overrightarrow{BA}$
              sale de la coordenada vertical de $\overrightarrow{BA}$, que es
              $L\sin\beta$.
        pista: |
          Escribe $\vec{a}_A = \vec{a}_B + \vec{\alpha}\times\overrightarrow{BA}$
          con $\omega = 0$ e impón que $a_{Ax} = 0$.
        desarrollo: |
          Con $\overrightarrow{BA} = (-L\cos\beta,\ L\sin\beta)$ y $\omega = 0$,

          $$
          a_{Ax} = a_B - \alpha\,L\sin\beta = 0
          \;\Longrightarrow\;
          \alpha = \frac{a_B}{L\sin\beta} = \frac{3}{1{,}2} = 2{,}5\ \text{rad/s}^{2}
          $$

          El giro es en sentido horario, así que en ejes $\vec{\alpha} = -2{,}5\,\hat{k}$.

      - tipo: calcular
        titulo: La normal del suelo en B
        pregunta: |
          El centro de masas acelera $a_{Gy} = 1{,}125\ \text{m/s}^{2}$ hacia
          arriba. Tomando $g = 9{,}81\ \text{m/s}^{2}$, ¿cuánto vale la normal en
          $B$?
        respuesta:
          tipo: magnitud
          valor: '65.61 N'
          tolerancia: 0.01
          formato: una fuerza, con su unidad
        distractores:
          - valor: '58.86 N'
            mensaje: |
              Es el peso de la barra, la normal que habría si $G$ no acelerara en
              vertical. Aquí $G$ sube acelerando, así que el suelo tiene que
              empujar más que el peso.
          - valor: '52.11 N'
            mensaje: |
              Has restado el término $m\,a_{Gy}$ en vez de sumarlo. $G$ acelera
              hacia arriba, y $N - mg = m\,a_{Gy}$ con $a_{Gy}$ positiva.
        pista: |
          Teorema del momento lineal en vertical, $N - mg = m\,a_{Gy}$. Ninguna
          otra fuerza tiene componente vertical.
        desarrollo: |
          $$
          N = m\,(g + a_{Gy}) = 6\,(9{,}81 + 1{,}125) = 65{,}61\ \text{N}
          $$

      - tipo: calcular
        titulo: La fuerza P
        pregunta: |
          Tomando momentos en $G$ con el sistema equivalente, ¿cuánto vale el
          módulo de la fuerza $P$?
        respuesta:
          tipo: magnitud
          valor: '31.45 N'
          tolerancia: 0.01
          formato: una fuerza, con su unidad
        distractores:
          - valor: '26.76 N'
            mensaje: |
              Es el valor que imprime la colección, y sale de escribir el par
              $I_G\alpha$ con el signo cambiado. El giro es horario y $G$ acelera
              hacia la izquierda y hacia arriba; con el signo bueno salen
              $31{,}45$ N y $22{,}45$ N.
          - valor: '9 N'
            mensaje: |
              Eso es solo $m\,|a_{Gx}|$, la resultante horizontal. En horizontal
              actúan dos fuerzas, $P$ y la que transmite $AC$, y hace falta la
              ecuación de momentos para separarlas.
        pista: |
          En $G$, la normal y $P$ dan momento desde $B$, y la fuerza de $AC$ desde
          $A$. Iguala la suma a $I_G\alpha$ con $I_G = mL^{2}/12$.
        desarrollo: |
          Con $A$ y $B$ a $(\mp 0{,}45;\ \pm 0{,}6)$ m de $G$ y
          $I_G = 6\cdot 1{,}5^{2}/12 = 1{,}125\ \text{kg}\,\text{m}^{2}$,

          $$
          -0{,}6\,A_x + 0{,}45\,N + 0{,}6\,P_x = I_G\,\alpha = -2{,}8125
          $$

          Junto con $A_x + P_x = m\,a_{Gx} = -9$ N queda
          $P_x = -31{,}45$ N, es decir $31{,}45$ N hacia la izquierda.

      - tipo: calcular
        titulo: La fuerza que AC ejerce sobre AB
        pregunta: |
          ¿Cuánto vale esa fuerza, la que la barra $AC$ hace sobre $AB$ en $A$?
        respuesta:
          tipo: magnitud
          valor: '22.45 N'
          tolerancia: 0.01
          formato: una fuerza, con su unidad
        distractores:
          - valor: '17.76 N'
            mensaje: |
              Es el valor impreso en la colección, y arrastra el mismo signo
              cambiado en $I_G\alpha$ que el de la fuerza $P$. Con el signo bueno
              son $22{,}45$ N.
          - valor: '65.61 N'
            mensaje: |
              Esa es la normal del suelo. La fuerza de $AC$ es horizontal y sale
              de la ecuación de momentos, no de la vertical.
        pista: |
          Ya tienes $P_x$ y la ecuación horizontal $A_x + P_x = m\,a_{Gx}$.
        desarrollo: |
          $$
          A_x = m\,a_{Gx} - P_x = -9 + 31{,}45 = 22{,}45\ \text{N}
          $$

          Positiva hacia la derecha, o sea que $AC$ tira de $AB$ hacia $C$:
          trabaja a tracción.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'La barra AC no pesa y se articula en sus dos extremos, así que su fuerza en $A$ es horizontal y $\vec{a}_A$ es vertical.'
          - texto: 'De $a_{Ax}=0$ sale $\alpha = a_B/(L\sin\beta) = 2{,}5$ rad/s², y con ella $a_{Gx} = -1{,}5$ y $a_{Gy} = 1{,}125$ m/s².'
          - texto: 'Del momento lineal en vertical, $N = m(g + a_{Gy}) = 65{,}61$ N.'
          - texto: 'Momentos en $G$ con $\sum M_G = I_G\alpha$, y con la horizontal $A_x + P_x = m a_{Gx}$, salen $P = 31{,}45$ N y $A_x = 22{,}45$ N.'
          - texto: Como la barra parte del reposo, su aceleración angular es nula y G acelera lo mismo que B.
            trampa: true
            mensaje: |
              Partir del reposo es $\omega = 0$, no $\alpha = 0$. Justamente
              porque $\alpha \ne 0$ los puntos de la barra aceleran de forma
              distinta, y todo el problema vive en esa diferencia.
    resolucion: |
      **1. Sólidos libres.** Es un problema de dinámica de un sólido con
      movimiento plano, en un instante: el dibujo lleva la barra $AB$ sin la
      barra $AC$ ni el suelo, y al lado, lo que tienen que dar sus fuerzas.

      <figure class="figura-examen">
      <svg viewBox="-10 12 400 196" role="img" width="600" height="294" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">Sólido libre de la barra AB y lo que tienen que dar sus fuerzas</title>
        <desc id="dsl-d">A la izquierda, la barra AB sin la barra AC ni el suelo: baja de A, arriba a la izquierda, a B, abajo a la derecha, 0,9 metros en horizontal y 1,2 en vertical. En A, la fuerza de la barra AC, horizontal hacia la derecha. En B, la normal del suelo, vertical hacia arriba, y la fuerza P, horizontal, dibujada hacia la derecha. En G, a media barra, el peso. Un signo igual. A la derecha, la misma barra con lo que tienen que dar esas fuerzas: en G, la masa por la aceleración de G, hacia la izquierda y hacia arriba, y el momento de inercia por la aceleración angular, en sentido horario.</desc>
        <defs>
