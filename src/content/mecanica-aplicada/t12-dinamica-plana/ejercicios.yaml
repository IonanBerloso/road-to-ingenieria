                <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
              </marker>
            </defs>
            <line x1="60" y1="60" x2="198.6" y2="140" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
