        <circle cx="340" cy="200" r="2.4" fill="var(--ink)"/>
        <text x="333" y="204" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">B</text>
        <text x="302" y="48" font-size="9" text-anchor="end" fill="var(--faint)">Rπ/2</text>
        <text x="20" y="34" font-size="11" font-weight="700" fill="var(--ink)">a)</text>
        <text x="272" y="34" font-size="11" font-weight="700" fill="var(--ink)">b)</text>
      </svg>
      <figcaption>

      a) La reacción del pasador no trabaja: A no se mueve. El peso del disco tampoco: está aplicado en A. Trabajan el peso de la varilla y el muelle. b) El hilo, arrollado al disco, se desenrolla el arco que gira el disco, R por el ángulo.

      </figcaption>
      </figure>

      - **La reacción del pasador** no trabaja: $A$ no se mueve.
      - **El peso del disco** tampoco: está aplicado en $A$.
      - **El peso de la varilla** trabaja: su centro baja $L/2$.
      - **El muelle** trabaja: el hilo, arrollado al disco, se desenrolla el
        arco que gira el disco, y el muelle se alarga eso.

      **2. Incógnitas.** La velocidad angular $\omega$ tras girar 90°: una,
      con la ecuación de la energía.

      **3. Ecuaciones.** El conjunto gira alrededor de $A$, que es el centro
      del disco y el extremo de la varilla:

      $$
      T = \tfrac12 I_A\,\omega^{2},
      \qquad
      I_A = \tfrac12 m_d R^{2} + \tfrac13 m_v L^{2},
      \qquad
      \delta = R\,\frac{\pi}{2}
      $$

      La energía, desde el reposo y con el muelle sin deformar al principio:

      $$
      m_v g\,\frac{L}{2} = \tfrac12 k\,\delta^{2} + \tfrac12 I_A\,\omega^{2}
      $$

      **4. Resultados.** Con $R = 0{,}125$ m, $L = 0{,}5$ m y
      $g = 9{,}81\ \text{m/s}^{2}$:

      $$
      I_A = 0{,}02344 + 0{,}41667 = 0{,}4401\ \text{kg}\cdot\text{m}^{2}
      \qquad
      \delta = 0{,}125 \cdot 1{,}5708 = 0{,}19635\ \text{m}
      $$

      $$
      m_v g\,\frac{L}{2} = 5 \cdot 9{,}81 \cdot 0{,}25 = 12{,}2625\ \text{J}
      \qquad
      \tfrac12 k\,\delta^{2} = 40 \cdot 0{,}038553 = 1{,}5421\ \text{J}
      $$

      $$
      \omega^{2} = 2 \cdot 10{,}7204/0{,}44010 = 48{,}72
      \qquad
      \omega = 6{,}980\ \text{rad/s}
      $$

      con $12{,}2625 - 1{,}5421 = 10{,}7204$ J de energía cinética.

      **5. Comprobación.** Por el trabajo de los momentos respecto de $A$, sin
      energías potenciales. Con la varilla girada $\theta$, su peso tiene
      brazo $\frac{L}{2}\cos\theta$, y el hilo, siempre tangente, tira a $R$
      de $A$ con $kR\theta$:

      $$
      W = \int_0^{\pi/2} m_v g\,\frac{L}{2}\cos\theta\,d\theta - \int_0^{\pi/2} kR^{2}\,\theta\,d\theta
      = m_v g\,\frac{L}{2} - kR^{2}\,\frac{\pi^{2}}{8}
      $$

      con $kR^{2}\pi^{2}/8 = 80 \cdot 0{,}015625 \cdot 1{,}2337 = 1{,}5421$ J:
      los mismos dos términos, y la misma $\omega$.

      **Lo que dice el resultado.** El muelle se queda con el 13 por ciento
      de lo que suelta el peso. Casi toda la inercia es de la varilla, 0,4167
      de 0,4401 kg·m²: el disco pesa poco en el giro, pero es el que lleva el
      hilo. Sin muelle saldrían 7,465 rad/s.

  - id: ejma12-col128-la-placa-colgada-de-dos-barras
    titulo: La placa colgada de dos barras paralelas
    fuente: >-
      Ejercicio 12.8 · Tema 12, «Dinámica del sólido con movimiento plano» ·
      Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección publica el
      resultado, contra el que está contrastado el desarrollo, y se ha
      comprobado también con la resolución oficial del profesor. Los números
      impresos en la hoja de enunciados no cuadran con la cuenta: dice
      aA = -8,44 m/s2 y F = -48,7 N, mientras que la cuenta exacta da
      8,496 m/s2, que son (raiz de 3 partido por 2) por g, y 47,94 N y 8,70 N
      en las dos barras. La resolución oficial del profesor publica 8,5 m/s2,
      FE = 47,9 N y FF = -8,67 N, que es lo mismo; el sitio publica la cuenta
      exacta. Ojo también a que la figura de la resolución oficial intercambia
      las cotas de la placa: las buenas son las del enunciado, 500 por 200 mm.
    nivel: practica
    antes:
      idea: |
        Un sólido con movimiento plano cumple tres ecuaciones: la resultante
        de las fuerzas es la masa por la aceleración del centro de gravedad,
        y el momento respecto de G es el momento de inercia en G por la
        aceleración angular. Una barra de masa despreciable, articulada en sus
        dos extremos y sin cargas entre ellos, solo puede tirar o empujar a lo
        largo de sí misma. El extremo de una barra que gira alrededor de un
        punto fijo tiene una aceleración perpendicular a la barra y otra a lo
        largo de ella, hacia el punto fijo.
      formula: |
        $$
        \sum\vec{F} = M\vec{a}_G,
        \qquad
        \sum M_G = I_G\,\alpha
        $$

        $$
        a_t = \alpha\,r,
        \qquad
        a_n = \omega^{2} r,
        \qquad
        \vec{a}_P = \vec{a}_G + \vec{\alpha}\times\overrightarrow{GP} - \omega^{2}\,\overrightarrow{GP}
        $$
      reconocer: |
        Antes de calcular se mira cómo están colocadas las dos barras de las
        que cuelga la placa.
    enunciado: |
      La placa delgada $ABCD$ (3) tiene una masa de 8 kg y se mantiene en la
      posición indicada por medio del alambre $BH$ y dos barras articuladas (1)
      y (2) de igual longitud desconocida. Para el instante en el que se corta
      el alambre $BH$, hallar:

      a) Aceleración de los puntos $A$, $B$, $C$ y $D$ de la placa (3).

      b) Fuerza sobre las articulaciones $E$ y $F$.

      <figure>
      <svg viewBox="0 0 400 200" role="img" width="400" height="200" aria-labelledby="ma12c8-t ma12c8-d">
