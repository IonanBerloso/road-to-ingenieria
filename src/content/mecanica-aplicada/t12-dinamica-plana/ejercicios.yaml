            <text x="125" y="84" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">G</text>
            <circle cx="230" cy="70" r="2.4" fill="var(--ink)"/>
            <text x="230" y="85" font-size="10" text-anchor="middle" font-weight="700" fill="var(--ink)">B</text>
            <circle cx="280" cy="70" r="2.4" fill="var(--ink)"/>
            <text x="280" y="85" font-size="10" text-anchor="middle" font-weight="700" fill="var(--ink)">A</text>
            <circle cx="380" cy="70" r="2.4" fill="var(--ink)"/>
            <text x="375" y="84" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">G</text>
            <circle cx="480" cy="70" r="2.4" fill="var(--ink)"/>
            <text x="480" y="85" font-size="10" text-anchor="middle" font-weight="700" fill="var(--ink)">B</text>
            <text x="255" y="74" font-size="9" text-anchor="middle" fill="var(--faint)">=</text>
          </svg>

      - tipo: calcular
        titulo: La aceleración del extremo B
        pregunta: |
          Con $g = 9{,}81\ \text{m/s}^{2}$, ¿cuánto vale la aceleración del
          extremo $B$ justo al romperse el cable? Fíjate en que no depende de
          $L$.
        respuesta:
          tipo: magnitud
          valor: '12.613 m/s^2'
          tolerancia: 0.01
          formato: en m/s², con cuatro cifras
        distractores:
          - valor: '9.81 m/s^2'
            mensaje: |
              Has supuesto que $B$ cae libre. El extremo largo de una viga que
              pivota baja **más** deprisa que $g$: aquí $9g/7$. Quien no puede
              pasar de $g$ es el centro de gravedad, y de hecho baja $3g/7$.
          - valor: '22.07 m/s^2'
            mensaje: |
              Has usado $I_G$ tomando momentos en $C$. Como $C$ es un punto
              fijo distinto de $G$, hay que llevar el momento de inercia a $C$
              con Steiner: $I_C = \frac{7ML^{2}}{48}$.
          - valor: '16.82 m/s^2'
            mensaje: |
              Es $\alpha L$: has puesto $B$ a la distancia $L$ del pasador. La
              distancia de $C$ a $B$ es $3L/4$, porque $C$ está a $L/4$ de $A$.
          - valor: '4.204 m/s^2'
            mensaje: |
              Es la aceleración del centro de gravedad, $3g/7$. La de $B$ es
              tres veces mayor, porque $B$ está a $3L/4$ del pasador y $G$
              solo a $L/4$.
        pista: |
          $\sum M_C = I_C\alpha$ con $I_C = \frac{7ML^{2}}{48}$ y el peso
          actuando a $L/4$ del pasador; después $a_B = \alpha\,\frac{3L}{4}$.
        desarrollo: |
          $$
          Mg\,\frac{L}{4} = \frac{7ML^{2}}{48}\,\alpha
          \;\Longrightarrow\;
          \alpha = \frac{12g}{7L}
          \qquad
          a_B = \alpha\,\frac{3L}{4} = \frac{9g}{7} = 12{,}613\ \text{m/s}^{2}
          $$

      - tipo: calcular
        titulo: La reacción del pasador
        pregunta: |
          La reacción vertical vale $C_y = c\,W$, con $W$ el peso de la viga.
          ¿Cuánto vale $c$?
        respuesta:
          tipo: numero
          valor: '0.5714286'
          tolerancia: 0.002
          formato: un número, sin unidad (el coeficiente de W)
        distractores:
          - valor: '1'
            mensaje: |
              Es lo que sostiene el pasador con la viga quieta. Al romperse el
              cable $G$ empieza a bajar con $3g/7$, y esa parte del peso ya no
              la aguanta nadie.
          - valor: '0.4285714'
            mensaje: |
              Es $3/7$, o sea $Ma_G$ en vez de $W - Ma_G$. Has puesto el
              término de inercia donde va la reacción.
          - valor: '0.25'
            mensaje: |
              Parece un reparto de la estática por distancias, pero aquí no hay
              dos apoyos que repartirse el peso: solo queda el pasador, y lo
              que descarga la reacción es la aceleración de $G$.
        pista: |
          $a_G = \alpha\frac{L}{4}$ hacia abajo, y el teorema del momento
          lineal en vertical dice $W - C_y = M a_G$.
        desarrollo: |
          $$
          a_G = \frac{12g}{7L}\cdot\frac{L}{4} = \frac{3g}{7}
          \qquad
          C_y = M\!\left(g - \frac{3g}{7}\right) = \frac{4}{7}\,W = 0{,}5714\,W
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'El pasador C es un punto fijo de la viga, así que $\sum M_C = I_C\alpha$ con $I_C = \frac{ML^{2}}{12} + M\frac{L^{2}}{16} = \frac{7ML^{2}}{48}$.'
          - texto: El peso actúa en G, a $L/4$ del pasador, y de ahí $\alpha = \frac{12g}{7L}$ y $a_B = \alpha\frac{3L}{4} = \frac{9g}{7}$.
          - texto: 'Momento lineal en vertical: $W - C_y = M\alpha\frac{L}{4} = \frac{3}{7}W$, luego $C_y = \frac{4}{7}W$.'
          - texto: Justo al romperse el cable la viga todavía no se ha movido, así que el pasador sigue sosteniendo el peso entero.
            trampa: true
            mensaje: |
              No haberse movido significa velocidad nula, no aceleración nula.
              En ese mismo instante $G$ ya baja con $3g/7$, y el pasador
              sostiene solo $4W/7$.
    resolucion: |
      **1. Sólidos libres.** Es un problema de dinámica de un sólido que gira
      alrededor de un punto fijo: el dibujo lleva la viga justo al romperse el
      cable, sin el pasador, y al lado, lo que tienen que dar sus fuerzas.

      <figure class="figura-examen">
      <svg viewBox="0 18 490 102" role="img" width="735" height="153" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">Sólido libre de la viga al romperse el cable y lo que tienen que dar sus fuerzas</title>
        <desc id="dsl-d">A la izquierda, la viga horizontal, de A a B, sin el pasador C, que está a L cuartos de A, y sin el cable de B, que se ha roto. En C, la reacción, horizontal hacia la derecha y vertical hacia arriba. En G, a media viga, el peso, hacia abajo. Cotas: L cuartos de A a C, L cuartos de C a G, y tres cuartos de L de C a B. Un signo igual. A la derecha, la misma viga con lo que tienen que dar esas fuerzas: en G, la masa por la aceleración de G, vertical hacia abajo, y el momento de inercia en G por la aceleración angular, en sentido horario.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
