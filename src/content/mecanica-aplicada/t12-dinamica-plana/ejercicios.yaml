    pide: La fuerza P y la reacción en A, en función de M, L, alfa y g.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de escribir ninguna ecuación, ¿cómo es la aceleración del
          centro de gravedad $G$ de la barra?
        opciones:
          - texto: Vertical, porque G es el punto medio y coincide con el bloque C, que solo puede subir o bajar
            correcta: true
            mensaje: |
              Eso es, y es la clave del problema. $AC = CB = L/2$, así que
              $G = C$; la ranura vertical obliga a que $a_{Gx} = 0$ y la
              ecuación horizontal se queda en $N_C = P$.
          - texto: Nula, porque la barra parte del reposo
            mensaje: |
              Partir del reposo anula la **velocidad**, no la aceleración. De
              hecho lo único que se anula por eso son los términos $\omega^{2}$
              de la aceleración relativa.
          - texto: Perpendicular a la barra y de valor alfa por L partido por dos
            mensaje: |
              Eso sería si $A$ estuviera fijo. Aquí $A$ también se mueve, así
              que $\vec{a}_G = \vec{a}_A + \vec{\alpha}\times\overrightarrow{AG}$
              y hay que sumar los dos.
          - texto: Horizontal, la misma que la del bloque A
            mensaje: |
              $G$ no es $A$. Solo tendrían la misma aceleración si la barra
              trasladara, y aquí gira con $\alpha$.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **la barra sin los bloques, con
          todas las fuerzas que actúan sobre ella, y al lado, lo que tienen que
          dar esas fuerzas**. Sin escala.
        comprueba:
          - punto: |
              **En $A$, dos fuerzas: $R_A$, vertical, y $P$, horizontal.**
            porque: |
              La ranura horizontal no roza: solo empuja en vertical. $P$ se
              aplica al bloque, que va unido a la barra en $A$.
          - punto: |
              **En $C$, una fuerza horizontal, $N_C$.**
            porque: |
              La ranura vertical no roza: solo puede empujar en horizontal;
              cuánto, lo dicen las ecuaciones.
          - punto: |
              **El peso, $Mg$, en $G$, que es $C$.**
            porque: |
              La barra es uniforme y $C$ es su punto medio: $AC = CB = L/2$.
          - punto: |
              **Al lado, $M a_G$ vertical y el par $I_G\,\alpha$ en sentido
              antihorario.**
            porque: |
              $G$ va por la ranura vertical, y el enunciado da $\alpha$ contraria
              a las agujas del reloj.
        figura: |
          <svg viewBox="4 34 440 130" role="img" width="440" height="130" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">Sólido libre de la barra ACB y lo que tienen que dar sus fuerzas</title>
            <desc id="dsl-d">A la izquierda, la barra, que baja 30 grados hacia la derecha, sin los bloques. En A, la fuerza P, horizontal hacia la izquierda, y la reacción de la ranura horizontal, vertical hacia arriba. En C, que es G, la reacción de la ranura vertical, horizontal hacia la derecha, y el peso, vertical hacia abajo. Un signo igual. A la derecha, la misma barra con lo que tienen que dar esas fuerzas: en G, la masa por la aceleración de G, vertical hacia arriba, y el momento de inercia en G por la aceleración angular, en sentido antihorario.</desc>
