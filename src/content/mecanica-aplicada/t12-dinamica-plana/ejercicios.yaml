      </figcaption>
      </figure>
    pide: La velocidad angular del conjunto después de girar 90 grados.
    pasos:
      - tipo: reconocer
        pregunta: |
          El conjunto gira alrededor del pasador $A$. ¿Cuál es su momento de
          inercia respecto de ese eje?
        opciones:
          - texto: El del disco respecto de su centro más el de la varilla respecto de su extremo
            correcta: true
            mensaje: |
              Eso es: $\tfrac12 m_d R^{2} + \tfrac13 m_v L^{2}
              = 0{,}0234 + 0{,}4167 = 0{,}4401$ kg m². El pasador está en el
              centro del disco, pero en el **extremo** de la varilla.
          - texto: El del disco más el central de la varilla, m L cuadrado partido por doce
            mensaje: |
              Ese es el de la varilla respecto de su punto medio, y el eje pasa
              por su extremo. Falta el término de Steiner
              $m_v(L/2)^{2}$, que es tres veces mayor que el otro.
          - texto: m R cuadrado para el disco, más el de la varilla respecto de su extremo
            mensaje: |
              $mR^{2}$ es el de un aro, con toda la masa en la periferia. Un
              disco macizo tiene $\tfrac12 mR^{2}$, la mitad.
          - texto: El del disco más la varilla como masa puntual en su centro
            mensaje: |
              Concentrar la varilla en su centro da $m_v(L/2)^{2} = 0{,}3125$,
              y le falta justo su inercia propia $m_vL^{2}/12$ para llegar a
              0,4167.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el disco con la varilla, sin el
          pasador ni el muelle, con todas las fuerzas; y aparte, las dos
          posiciones, con lo que baja el centro de la varilla y lo que se
          desenrolla el hilo**. Sin escala.
        comprueba:
          - punto: |
              **En $A$, las dos componentes de la reacción del pasador.**
            porque: |
              El pasador sujeta el disco en las dos direcciones del plano;
              cuánto vale cada una no hace falta para la energía.
          - punto: |
              **Los dos pesos: $m_d g$ en $A$ y $m_v g$ en el centro de la
              varilla.**
            porque: |
              Cada pieza es uniforme: su peso va en su centro.
          - punto: |
              **En el punto de la periferia de donde sale el hilo, la fuerza del
              muelle, vertical y hacia abajo.**
            porque: |
              El hilo va arrollado al disco y sale de él tangente, hacia el
              muelle del suelo.
          - punto: |
              **Entre las dos posiciones, lo que baja el centro de la varilla y
              lo que se desenrolla el hilo.**
            porque: |
              Son lo que cambia la energía potencial del peso y la del muelle.
