      La resultante tiene que pasar por G, porque la placa no gira. Como su recta corta la de AD por encima de A, las dos fuerzas no pueden tener el mismo sentido: la barra EA tira y la FD empuja.

      </figcaption>
      </figure>

      Para que la resultante caiga fuera del segmento $AD$, una barra tiene
      que tirar y la otra empujar. Y la aceleración, $g\cos 30^\circ$, no
      depende de lo que midan las barras: al partir del reposo no hay
      aceleración normal. Por eso el enunciado puede no dar su longitud.

  - id: ejma12-col129-las-dos-masas-con-biela-y-muelles
    titulo: Las dos masas unidas por una biela, con dos muelles
    fuente: >-
      Ejercicio 12.9 · Tema 12, «Dinámica del sólido con movimiento plano» ·
      Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección publica el
      resultado, contra el que está contrastado el desarrollo, y se ha
      comprobado también con la resolución oficial del profesor. La tabla final
      de esa resolución trae una errata que no afecta a lo que se pide, y
      conviene saberla al comparar: da la velocidad angular de la biela como
      1,62 rad/s en el caso de biela sin masa, cuando de sus propios v_A y v_B
      salen 1,27 rad/s. El caso de 10 kg sí está bien, 1,38 rad/s. En esa
      misma tabla, la fila de v_B va rotulada también como v_A.
    nivel: practica
    antes:
      idea: |
        Entre dos posiciones, el trabajo de todas las fuerzas es lo que cambia
        la energía cinética; el del peso y el de los muelles se escriben como
        pérdida de energía potencial, la del peso con la altura del centro de
        gravedad de cada pieza. Una fuerza perpendicular al movimiento de su
        punto de aplicación no trabaja. La energía cinética de un sólido con
        movimiento plano es la de traslación con G más la de giro alrededor de
        G. En cada instante, los puntos del sólido se mueven como si girara
        alrededor del centro instantáneo de rotación, que está donde se cortan
        las perpendiculares a las velocidades de dos de sus puntos.
      formula: |
        $$
        T_0 + V_0 + W_{nc} = T + V,
        \qquad
        V = \sum m g\,y_G + \tfrac12 k\,\delta^{2}
        $$

        $$
        T = \tfrac12 M v_G^{2} + \tfrac12 I_G\,\omega^{2},
        \qquad
        I_G = \tfrac{1}{12}ML^{2},
        \qquad
        v_P = \omega\,\overline{IP}
        $$
      reconocer: |
        Antes de calcular se mira cómo se mueven los dos extremos de la biela.
    enunciado: |
      Las masas $A$ y $B$ de 75 kg cada una están obligadas a moverse por unas
      ranuras sin rozamiento. Están conectadas mediante una biela ligera de
      longitud $L$ = 300 mm. La masa $B$ está conectada a dos muelles de
      constante $k$ = 900 N/m. Si los muelles están en reposo cuando la biela
      está en posición vertical, calcular $v_A$ y $v_B$ cuando $A$ descienda
      una distancia de 25 mm si:

      a) La masa de la biela es despreciable.

      b) Si la masa de la biela son 10 kg.

      <figure>
