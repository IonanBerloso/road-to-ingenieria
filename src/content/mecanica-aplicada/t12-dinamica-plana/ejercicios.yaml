        <path d="M51 207 L45 215 M67 207 L61 215 M83 207 L77 215 M99 207 L93 215 M115 207 L109 215 M131 207 L125 215 M147 207 L141 215 M163 207 L157 215 M179 207 L173 215 M195 207 L189 215 M211 207 L205 215 M227 207 L221 215 M243 207 L237 215 M259 207 L253 215 M275 207 L269 215" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="45" y1="178" x2="45" y2="207" stroke="var(--ink)" stroke-width="1.3"/>
        <line x1="275" y1="178" x2="275" y2="207" stroke="var(--ink)" stroke-width="1.3"/>
        <line x1="160" y1="60" x2="160" y2="195" stroke="var(--ink)" stroke-width="4.5"/>
        <path d="M45 195 L58 195 L64 187 L76 203 L88 187 L100 203 L112 187 L124 203 L130 195 L146 195" fill="none" stroke="var(--live)" stroke-width="1.4"/>
        <path d="M174 195 L190 195 L196 187 L208 203 L220 187 L232 203 L244 187 L256 203 L262 195 L275 195" fill="none" stroke="var(--live)" stroke-width="1.4"/>
        <rect x="150" y="50" width="20" height="20" rx="3" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
        <circle cx="160" cy="60" r="3" fill="var(--ink)"/>
        <rect x="146" y="186" width="28" height="18" rx="3" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
        <circle cx="160" cy="195" r="3" fill="var(--ink)"/>
        <text x="160" y="44" font-size="10" text-anchor="middle" fill="var(--ink)">A</text>
        <text x="139" y="182" font-size="10" text-anchor="end" fill="var(--ink)">B</text>
        <text x="95" y="180" font-size="9" text-anchor="middle" fill="var(--live)">k</text>
        <text x="225" y="180" font-size="9" text-anchor="middle" fill="var(--live)">k</text>
        <line x1="212" y1="60" x2="212" y2="195" stroke="var(--faint)" stroke-width="0.9"/>
        <path d="M208 60 L216 60 M208 195 L216 195" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <text x="220" y="130" font-size="9" fill="var(--faint)">L = 300 mm</text>
        <text x="150" y="226" font-size="9" text-anchor="middle" fill="var(--faint)">A y B pesan 75 kg cada una</text>
      </svg>
      <figcaption>

      La masa **A** sube y baja por la ranura vertical; **B** corre por la
      ranura del suelo, entre los dos muelles. En la posición dibujada la biela
      está vertical y los muelles, sin deformar. Dibujada a escala.

      </figcaption>
      </figure>
    pide: Las velocidades de A y de B cuando A ha bajado 25 mm, con la biela sin masa y con biela de 10 kg.
    pasos:
      - tipo: reconocer
        pregunta: |
          Al bajar $A$, ¿qué relación hay entre su velocidad y la de $B$?
        opciones:
          - texto: La proyección de las dos sobre la biela es la misma, y de ahí sale que v_B es mayor que v_A
            correcta: true
            mensaje: |
              Eso es. La biela es rígida, así que las proyecciones de $v_A$ y
              $v_B$ sobre $AB$ coinciden. Con la biela casi vertical, $B$ corre
              mucho más deprisa que $A$: aquí 2,3 veces.
          - texto: Son iguales, porque la biela es rígida y no se estira
            mensaje: |
              Rígida quiere decir que la **distancia** $AB$ no cambia, no que
              los dos extremos vayan igual de rápido. Solo coinciden sus
              proyecciones sobre la biela.
          - texto: v_B es cero mientras los muelles no se hayan deformado
            mensaje: |
              Los muelles se deforman justamente porque $B$ se mueve: al
              principio no hay deformación, pero sí velocidad, y de hecho es la
              mayor de las dos.
          - texto: La suma de las dos velocidades es constante, porque la longitud de la biela lo es
            mensaje: |
              Lo que es constante es $x^{2}+y^{2} = L^{2}$. Al derivar sale
              $x\,v_B = y\,v_A$, que es un producto, no una suma.

      - tipo: calcular
        titulo: Cuánto se ha desplazado B
        pregunta: |
          Cuando $A$ ha bajado 25 mm, ¿cuánto se ha desplazado $B$ en
          horizontal desde la posición vertical?
        respuesta:
          tipo: magnitud
          valor: '0.11990 m'
          tolerancia: 0.01
          formato: en metros, con cinco cifras
        distractores:
          - valor: '0.025 m'
            mensaje: |
              Eso es lo que baja $A$. $B$ se mueve mucho más: con la biela casi
              vertical, un descenso pequeño de $A$ produce un desplazamiento
              lateral grande de $B$.
          - valor: '0.275 m'
            mensaje: |
              Es la altura que le queda a $A$, no el desplazamiento de $B$. El
              cateto horizontal sale del teorema de Pitágoras con la biela como
              hipotenusa.
          - valor: '0.05477 m'
            mensaje: |
              Parece $\sqrt{L\cdot d}$ o algo así. La cuenta es
              $x = \sqrt{L^{2}-(L-d)^{2}}$ con $L = 0{,}3$ y $d = 0{,}025$.
        pista: |
          La biela es la hipotenusa: $x^{2} + (L-d)^{2} = L^{2}$.
        desarrollo: |
          $$
          x = \sqrt{0{,}3^{2} - 0{,}275^{2}} = \sqrt{0{,}014375}
          = 0{,}11990\ \text{m}
          $$

      - tipo: calcular
        titulo: La velocidad de A con la biela sin masa
        pregunta: |
          Con $g = 9{,}81\ \text{m/s}^{2}$ y la biela de masa despreciable,
          ¿cuánto vale $v_A$?
        respuesta:
          tipo: magnitud
          valor: '0.1524 m/s'
          tolerancia: 0.01
          formato: en m/s, con cuatro cifras
        distractores:
          - valor: '0.2799 m/s'
            mensaje: |
              Te has dejado los muelles. Absorben 12,94 J de los 18,39 que
              suelta el peso de $A$: casi tres cuartas partes.
          - valor: '0.2254 m/s'
            mensaje: |
              Has contado un solo muelle. Son dos, y los dos almacenan energía
              a la vez: uno se comprime y el otro se estira, pero
              $\tfrac12 kx^{2}$ es positivo en los dos casos.
          - valor: '0.2697 m/s'
            mensaje: |
              Has puesto $v_B = v_A$. $B$ va 2,29 veces más rápido, y como la
              energía cinética va con el cuadrado, casi toda está en $B$.
        pista: |
          $m g d = \tfrac12 m v_A^{2} + \tfrac12 m v_B^{2} + 2\cdot\tfrac12 k x^{2}$,
          con $v_B = v_A\,(L-d)/x$.
        desarrollo: |
          $$
          v_B = v_A\,\frac{0{,}275}{0{,}11990} = 2{,}2935\,v_A
          $$

          $$
          75\cdot 9{,}81\cdot 0{,}025 - 900\cdot 0{,}014375
          = 37{,}5\,(1 + 2{,}2935^{2})\,v_A^{2}
          $$

          $$
          5{,}456 = 234{,}76\,v_A^{2}
          \;\Longrightarrow\;
          v_A = 0{,}1524\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La velocidad de B con la biela sin masa
        pregunta: |
          ¿Y cuánto vale $v_B$ en ese mismo instante?
        respuesta:
          tipo: magnitud
          valor: '0.3497 m/s'
          tolerancia: 0.01
          formato: en m/s, con cuatro cifras
        distractores:
          - valor: '0.1524 m/s'
            mensaje: |
              Esa es la de $A$. Las dos masas son iguales pero sus velocidades
              no: la ligadura de la biela hace que $B$ vaya 2,29 veces más
              rápido en esta posición.
          - valor: '0.06645 m/s'
            mensaje: |
              Has invertido la relación, $v_B = v_A\,x/(L-d)$. Es al revés: el
              cateto pequeño va con la velocidad pequeña.
        pista: |
          $v_B = v_A\,(L-d)/x$, la misma relación del paso anterior.
        desarrollo: |
          $$
          v_B = 2{,}2935\cdot 0{,}1524 = 0{,}3497\ \text{m/s}
          $$

      - tipo: calcular
        titulo: La velocidad de A con la biela de 10 kg
        pregunta: |
          Ahora la biela pesa 10 kg. ¿Cuánto vale $v_A$?
        respuesta:
          tipo: magnitud
          valor: '0.1651 m/s'
          tolerancia: 0.01
          formato: en m/s, con cuatro cifras
        distractores:
          - valor: '0.1524 m/s'
            mensaje: |
              Es el resultado del apartado a. La biela de 10 kg cambia las dos
              cosas a la vez: añade energía cinética, pero también baja su
              centro de gravedad 12,5 mm y aporta 1,23 J.
          - valor: '0.2829 m/s'
            mensaje: |
              Has añadido la biela pero te has dejado los muelles. Su energía,
              12,94 J, sigue siendo el término más grande de todos.
        pista: |
          La biela aporta tres cosas: su peso baja $d/2$, su centro lleva
          $v_G^{2} = (v_A^{2}+v_B^{2})/4$ y gira con $\omega = v_A/x$, con
          $I_G = m_3L^{2}/12$.
        desarrollo: |
          $$
          (75 + 5)\,g\,d - k x^{2}
          = \left[37{,}5 + 197{,}26 + 7{,}83 + 2{,}61\right] v_A^{2}
          $$

          donde el 5 es la biela de 10 kg, cuyo centro baja la mitad, y los
          cuatro sumandos son A, B, la traslación de la biela y su rotación.

          $$
          6{,}6825 = 245{,}19\,v_A^{2}
          \;\Longrightarrow\;
          v_A = 0{,}1651\ \text{m/s}
          \qquad
          v_B = 0{,}3786\ \text{m/s}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Geometría: cuando A baja 25 mm, $x = \sqrt{L^{2}-(L-d)^{2}} = 0{,}1199$ m, y derivando la ligadura, $v_B = v_A(L-d)/x = 2{,}2935\,v_A$.'
          - texto: Los dos muelles almacenan $2\cdot\tfrac12 kx^{2} = 12{,}94$ J y el peso de A suelta $mgd = 18{,}39$ J.
          - texto: 'Con biela sin masa queda $5{,}46 = \tfrac12 m (v_A^{2}+v_B^{2})$, y salen 0,152 y 0,350 m/s.'
          - texto: Al añadir la biela de 10 kg las velocidades bajan, porque hay más masa que mover con la misma energía.
            trampa: true
            mensaje: |
              Suben, de 0,152 a 0,165 m/s. La biela no solo añade inercia:
              también añade peso que baja, y su centro desciende $d/2$. Aquí
              gana el peso, porque el centro de la biela está cerca del centro
              instantáneo y su energía cinética es pequeña.
    resolucion: |
      **La ligadura.** Con $A$ a altura $y$ y $B$ a distancia $x$ de la
      vertical, $x^{2}+y^{2} = L^{2}$. Cuando $A$ baja $d = 25$ mm,

      $$
      y = 0{,}275\ \text{m}
      \qquad
      x = 0{,}11990\ \text{m}
      \qquad
      v_B = v_A\,\frac{y}{x} = 2{,}2935\,v_A
      $$

      **Las energías.** El peso de $A$ suelta $mgd = 18{,}394$ J; el de $B$ no
      cambia de altura. Los **dos** muelles almacenan

      $$
      2\cdot\tfrac12 k x^{2} = 900\cdot 0{,}014375 = 12{,}938\ \text{J}
      $$

      **Apartado a, biela sin masa.**

      $$
      18{,}394 - 12{,}938 = \tfrac12\,75\,(v_A^{2}+v_B^{2}) = 234{,}76\,v_A^{2}
      $$

      $$
      v_A = 0{,}1524\ \text{m/s}
      \qquad
      v_B = 0{,}3497\ \text{m/s}
      $$

      **Apartado b, biela de 10 kg.** Su centro baja $d/2 = 12{,}5$ mm y aporta
      1,226 J más de potencial. Y suma energía cinética por dos vías: su centro
      lleva $v_G^{2} = (v_A^{2}+v_B^{2})/4$ y la biela gira con
      $\omega = v_A/x = 8{,}34\,v_A$, con $I_G = m_3L^{2}/12 = 0{,}075$ kg m²:

      $$
      6{,}6825 = 245{,}19\,v_A^{2}
      \;\Longrightarrow\;
      v_A = 0{,}1651\ \text{m/s}
      \qquad
      v_B = 0{,}3786\ \text{m/s}
      $$

      **Y sale más deprisa que sin biela**, que es lo contrario de lo que dice
      la intuición. El motivo es que la biela añade 1,23 J de potencial y solo
      10,4 unidades de las 245 al coeficiente cinético: en esta posición su
      centro está cerca del centro instantáneo y se mueve poco.

  - id: ejma12-col1210-el-entramado-de-tres-barras
    titulo: El entramado articulado de tres barras
    fuente: >-
      Ejercicio 12.10 · Tema 12, «Dinámica del sólido con movimiento plano» ·
      Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección publica el
      resultado, contra el que está contrastado el desarrollo, y se ha
      comprobado también con la resolución oficial del profesor, que añade un
      dato que la hoja de enunciados no dice y hace falta para cerrar el
      problema: en A actúa un motor que suministra un par. El sentido de giro
      es el de las flechas de la figura, o sea el horario, que en los ejes de
      la resolución es omega1 = menos 2 k. Con el sentido contrario saldrían
      Ay = 85,5 N y Dy = 27,6 N, y no es lo que imprime la colección.
    nivel: practica
    enunciado: |
      Se muestra un entramado articulado de tres barras. En el instante
      mostrado, la barra $AB$ tiene un movimiento angular con
      $\omega_1$ = 2 rad/s y $\alpha_1$ = 3 rad/s$^{2}$. Reacciones en los
      apoyos $A$ y $D$.

      Datos: $M_1$ = 4 kg; $M_2$ = 3 kg; $M_3$ = 6 kg; $AB$ = 0,6 m;
      $BC$ = 0,5 m; $CD$ = 1 m

      <figure>
      <svg viewBox="0 0 320 200" role="img" width="320" height="200" aria-labelledby="ma12c10-t ma12c10-d">
        <title id="ma12c10-t">Entramado de tres barras articuladas entre dos apoyos fijos</title>
        <desc id="ma12c10-d">La barra 1 va del apoyo fijo A, a la derecha, hasta B, a la izquierda, y mide 0,6 metros en horizontal. De B baja la barra 2 hasta C, medio metro en vertical. De C sale la barra 3 hacia la derecha, un metro en horizontal, hasta el apoyo fijo D, que queda mas a la derecha que A. Sendas flechas curvas junto a las barras 1 y 3 marcan el sentido del giro, con los extremos B y C subiendo.</desc>
        <defs>
          <marker id="ma12c10-f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--live)"/>
          </marker>
        </defs>
        <line x1="196" y1="30" x2="196" y2="70" stroke="var(--ink)" stroke-width="1.3"/>
        <path d="M196 36 L204 28 M196 48 L204 40 M196 60 L204 52 M196 72 L204 64" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <line x1="276" y1="130" x2="276" y2="170" stroke="var(--ink)" stroke-width="1.3"/>
        <path d="M276 136 L284 128 M276 148 L284 140 M276 160 L284 152 M276 172 L284 164" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <line x1="70" y1="50" x2="190" y2="50" stroke="var(--ink)" stroke-width="5"/>
        <line x1="70" y1="50" x2="70" y2="150" stroke="var(--ink)" stroke-width="5"/>
        <line x1="70" y1="150" x2="270" y2="150" stroke="var(--ink)" stroke-width="5"/>
        <circle cx="190" cy="50" r="4.5" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.4"/>
        <circle cx="270" cy="150" r="4.5" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.4"/>
        <circle cx="70" cy="50" r="4" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.4"/>
        <circle cx="70" cy="150" r="4" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.4"/>
        <path d="M126 62 A18 18 0 0 1 144 44" fill="none" stroke="var(--live)" stroke-width="1.6" marker-end="url(#ma12c10-f)"/>
        <path d="M150 62 A18 18 0 0 1 168 44" fill="none" stroke="var(--live)" stroke-width="1.6" marker-end="url(#ma12c10-f)"/>
        <text x="126" y="76" font-size="9.5" fill="var(--live)">α₁</text>
        <text x="152" y="76" font-size="9.5" fill="var(--live)">ω₁</text>
        <path d="M196 162 A18 18 0 0 1 214 144" fill="none" stroke="var(--live)" stroke-width="1.6" marker-end="url(#ma12c10-f)"/>
        <path d="M220 162 A18 18 0 0 1 238 144" fill="none" stroke="var(--live)" stroke-width="1.6" marker-end="url(#ma12c10-f)"/>
        <text x="196" y="176" font-size="9.5" fill="var(--live)">α₃</text>
        <text x="222" y="176" font-size="9.5" fill="var(--live)">ω₃</text>
        <text x="196" y="40" font-size="10" fill="var(--ink)">A</text>
        <text x="60" y="44" font-size="10" text-anchor="end" fill="var(--ink)">B</text>
        <text x="60" y="156" font-size="10" text-anchor="end" fill="var(--ink)">C</text>
        <text x="266" y="140" font-size="10" text-anchor="end" fill="var(--ink)">D</text>
        <text x="130" y="42" font-size="9.5" text-anchor="middle" fill="var(--ink)">(1)</text>
        <text x="82" y="104" font-size="9.5" fill="var(--ink)">(2)</text>
        <text x="170" y="142" font-size="9.5" text-anchor="middle" fill="var(--ink)">(3)</text>
        <text x="130" y="24" font-size="9" text-anchor="middle" fill="var(--faint)">AB = 0,6 m</text>
        <text x="34" y="104" font-size="9" text-anchor="middle" fill="var(--faint)">0,5 m</text>
        <text x="170" y="192" font-size="9" text-anchor="middle" fill="var(--faint)">CD = 1 m</text>
      </svg>
      <figcaption>

      Las tres barras, con los dos apoyos fijos **A** y **D**. Las flechas
      marcan el sentido del giro: los extremos **B** y **C** suben, o sea giro
      horario. Fíjate en que **D** queda 0,4 m a la derecha de **A**, porque
      **CD** es más larga que **AB**. Dibujada a escala.

      </figcaption>
      </figure>
    pide: Las cuatro componentes de las reacciones en los apoyos A y D.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuánto vale $\omega_2$, la velocidad angular de la barra $BC$?
        opciones:
          - texto: Cero, porque las velocidades de B y de C son las dos verticales, o sea paralelas a la propia BC
            correcta: true
            mensaje: |
              Eso es. $B$ gira alrededor de $A$ con $AB$ horizontal, así que
              $\vec{v}_B$ es vertical; lo mismo le pasa a $C$ con $CD$. Dos
              puntos de un sólido con velocidades paralelas a la recta que los
              une obligan a $\omega = 0$.
          - texto: 2 rad/s, la misma que la barra AB, porque están articuladas en B
            mensaje: |
              La articulación obliga a que compartan la **velocidad del punto
              B**, no la velocidad angular. Cada barra gira lo suyo.
          - texto: 1,2 rad/s, la misma que la barra CD
            mensaje: |
              Ese es el valor de $\omega_3$, que sale de que $v_C = v_B$. La
              barra $BC$ es otra cosa: sus dos extremos suben a la vez y a la
              misma velocidad, así que no gira.
          - texto: No se puede saber sin conocer la distancia entre A y D
            mensaje: |
              La distancia $AD$ está fijada por las longitudes: $D$ queda 0,4 m
              a la derecha de $A$. Y para $\omega_2$ ni siquiera hace falta:
              basta con que $AB$ y $CD$ estén horizontales.

      - tipo: calcular
        titulo: La aceleración angular de la barra CD
        pregunta: |
          ¿Cuánto vale $\alpha_3$, la aceleración angular de la barra $CD$, en
          valor absoluto?
        respuesta:
          tipo: numero
          valor: '1.8'
          tolerancia: 0.01
          formato: un número, en rad/s²
        distractores:
          - valor: '1.2'
            mensaje: |
              Eso es $\omega_3$, la velocidad angular, que sale de
              $v_C = v_B = \omega_1\cdot AB = 1{,}2$ m/s repartida en el metro
              de $CD$. La aceleración angular sale de la componente vertical de
              $\vec{a}_C$.
          - valor: '3'
            mensaje: |
              Es $\alpha_1$, la de la barra motriz, o el módulo de $\vec{a}_B$.
              Lo que hay que igualar es solo la componente **vertical** de
              $\vec{a}_C$, que vale 1,8 m/s².
          - valor: '1.44'
            mensaje: |
              Es la componente **horizontal** de $\vec{a}_C$, que vale
              $\omega_3^{2}\,CD$ y no contiene a $\alpha_3$. La que la da es la
              vertical, $\alpha_3\,CD$.
        pista: |
          $\vec{a}_C = \vec{a}_B + \vec{\alpha}_2\times\overrightarrow{BC}$, y
          como $BC$ es vertical, $\alpha_2$ solo aporta componente horizontal:
          la vertical de $\vec{a}_C$ es la de $\vec{a}_B$.
        desarrollo: |
          $$
          a_{By} = \alpha_1\,AB = 3\cdot 0{,}6 = 1{,}8\ \text{m/s}^{2}
          = a_{Cy} = \alpha_3\,CD
          \;\Longrightarrow\;
          \alpha_3 = 1{,}8\ \text{rad/s}^{2}
          $$

      - tipo: calcular
        titulo: La componente horizontal de la reacción en A
        pregunta: |
          ¿Cuánto vale $A_x$?
        respuesta:
          tipo: magnitud
          valor: '7.92 N'
          tolerancia: 0.01
          formato: en newtons, con tres cifras
        distractores:
          - valor: '4.8 N'
            mensaje: |
              Es $M_1 a_{G1x}$ a secas: te has dejado la fuerza que la barra
              $BC$ hace sobre la $AB$ en $B$, que vale 3,12 N y va en el mismo
              sentido.
          - valor: '6.96 N'
            mensaje: |
              Esa es $D_x$. Las dos reacciones horizontales se parecen pero no
              son iguales: por la barra $CD$ pasa además la inercia de sus
              6 kg.
          - valor: '2.4 N'
            mensaje: |
              Has usado la aceleración de $B$ en vez de la de $G_1$. El centro
              de la barra está a $0{,}3$ m de $A$, la mitad, así que
              $a_{G1x} = \omega_1^{2}\cdot 0{,}3 = 1{,}2$ m/s².
        pista: |
          Con $\omega_1 = 2$, la aceleración de $G_1$ tiene componente normal
          $\omega_1^{2}(AB/2) = 1{,}2$ m/s² hacia $A$. Después,
          $A_x + B_x = M_1 a_{G1x}$.
        desarrollo: |
          $$
          a_{G1x} = \omega_1^{2}\,\frac{AB}{2} = 1{,}2\ \text{m/s}^{2}
          \qquad
          A_x = M_1 a_{G1x} - B_x = 4{,}8 + 3{,}12 = 7{,}92\ \text{N}
          $$

      - tipo: calcular
        titulo: La componente vertical de la reacción en A
        pregunta: |
          ¿Y cuánto vale $A_y$?
        respuesta:
          tipo: magnitud
          valor: '110.7 N'
          tolerancia: 0.01
          formato: en newtons, con cuatro cifras
        distractores:
          - valor: '85.5 N'
            mensaje: |
              Es lo que sale girando en sentido antihorario. Las flechas de la
              figura dicen que $B$ y $C$ **suben**, o sea giro horario, y eso
              cambia el signo de todos los términos con $\alpha$.
          - valor: '39.24 N'
            mensaje: |
              Es el peso de la barra $AB$ sola. Por el apoyo $A$ pasa además
              todo lo que le transmite la barra $BC$, que a su vez carga con
              parte de la $CD$.
          - valor: '127.5 N'
            mensaje: |
              Es el peso de las tres barras juntas, que sería el reparto
              estático total entre $A$ y $D$. Ni el sistema está en equilibrio
              ni $A$ se lleva todo.
        pista: |
          Sube por la cadena. Momentos en $G_3$ dan $C_y$; la ecuación vertical
          de la barra 2 da $B_y$; y la vertical de la barra 1, $A_y$.
        desarrollo: |
          $$
          C_y = 33{,}03\ \text{N}
          \qquad
          B_y = 67{,}86\ \text{N}
          $$

          $$
          A_y = M_1 a_{G1y} + M_1 g + B_y = 3{,}6 + 39{,}24 + 67{,}86
          = 110{,}7\ \text{N}
          $$

      - tipo: calcular
        titulo: La componente vertical de la reacción en D
        pregunta: |
          ¿Cuánto vale $D_y$?
        respuesta:
          tipo: magnitud
          valor: '31.23 N'
          tolerancia: 0.01
          formato: en newtons, con cuatro cifras
        distractores:
          - valor: '27.63 N'
            mensaje: |
              Otra vez el sentido de giro cambiado. Con las flechas de la
              figura —$C$ subiendo— salen 31,23 N; con el contrario, 27,63.
          - valor: '58.86 N'
            mensaje: |
              Es el peso de la barra $CD$ entera. El apoyo $D$ solo aguanta la
              mitad larga: la otra la sostiene la articulación $C$.
          - valor: '29.43 N'
            mensaje: |
              Es medio peso de la barra $CD$, que sería el reparto si estuviera
              en equilibrio. Falta el término de inercia,
              $M_3 a_{G3y}/2 = 1{,}8$ N.
        pista: |
          Momentos en $G_3$ para la barra 3: $\frac{CD}{2}(D_y - C_y) = I_3\alpha_3$,
          y en vertical $D_y + C_y = M_3 g + M_3 a_{G3y}$.
        desarrollo: |
          $$
          D_y - C_y = \frac{2 I_3 \alpha_3}{CD} = 1{,}8\ \text{N}
          \qquad
          D_y + C_y = 58{,}86 + 5{,}4 = 64{,}26\ \text{N}
          $$

          $$
          D_y = 31{,}23\ \text{N}
          \qquad
          C_y = 33{,}03\ \text{N}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Cinemática: $\omega_2 = 0$ y $\omega_3 = 1{,}2$ rad/s; después $\alpha_2 = 1{,}92$ y $\alpha_3 = 1{,}8$ rad/s², las dos en sentido horario.'
          - texto: 'Se empieza por la barra 3, que solo tiene dos incógnitas nuevas: momentos en $G_3$ y fuerzas dan $C_y = 33{,}03$ N y $D_y = 31{,}23$ N.'
          - texto: 'Subiendo por la cadena, la barra 2 da $B_y = 67{,}86$ N y la barra 1 cierra con $A_x = 7{,}92$ N y $A_y = 110{,}7$ N.'
          - texto: Como en A hay un motor que da un par, la ecuación de momentos de la barra 1 hace falta para calcular las reacciones.
            trampa: true
            mensaje: |
              Es al revés: esa ecuación es la que **sobra** para las
              reacciones, porque introduce una incógnita nueva, el par. Sirve
              para calcular el par una vez que todo lo demás está resuelto
              —sale $-53{,}9$ N m—, no para llegar a las reacciones.
    resolucion: |
      **La cinemática, barra a barra.** Con $AB$ y $CD$ horizontales y $BC$
      vertical, y tomando el sentido de las flechas —$B$ y $C$ suben, o sea
      giro horario:

      $$
      v_B = \omega_1\,AB = 1{,}2\ \text{m/s (vertical)}
      \;\Longrightarrow\;
      \omega_2 = 0,
      \qquad
      \omega_3 = \frac{1{,}2}{CD} = 1{,}2\ \text{rad/s}
      $$

      $$
      \vec{a}_B = (\omega_1^{2}AB,\; \alpha_1 AB) = (2{,}4;\ 1{,}8)\ \text{m/s}^{2}
      \;\Longrightarrow\;
      \alpha_2 = 1{,}92,
      \qquad
      \alpha_3 = 1{,}8\ \text{rad/s}^{2}
      $$

      **Las aceleraciones de los tres centros.**

      $$
      \vec{a}_{G1} = (1{,}2;\ 0{,}9)
      \qquad
      \vec{a}_{G2} = (1{,}92;\ 1{,}8)
      \qquad
      \vec{a}_{G3} = (0{,}72;\ 0{,}9)\ \text{m/s}^{2}
      $$

      **Por dónde empezar.** Hay nueve incógnitas —ocho componentes de fuerza
      más el par del motor— y nueve ecuaciones, tres por barra. Pero no hace
      falta resolver el sistema entero: la barra 3 tiene solo cuatro incógnitas
      y tres ecuaciones, y la de momentos en $G_3$ junto con las de fuerzas
      cierra $C_y$ y $D_y$:

      $$
      D_y - C_y = \frac{2I_3\alpha_3}{CD} = 1{,}8
      \qquad
      D_y + C_y = M_3(g + a_{G3y}) = 64{,}26
      $$

      $$
      C_y = 33{,}03\ \text{N}
      \qquad
      D_y = 31{,}23\ \text{N}
      $$

      Con los momentos de la barra 2 salen $C_x = -2{,}64$ N y $B_x = 3{,}12$ N,
      y con su ecuación vertical $B_y = 67{,}86$ N. Bajando a la barra 3,
      $D_x = M_3a_{G3x} + C_x = 6{,}96$ N; subiendo a la 1,

      $$
      A_x = 7{,}92\ \text{N}
      \qquad
      A_y = 110{,}7\ \text{N}
      $$

      **El sentido de giro importa, y mucho.** Con el giro antihorario los
      términos de inercia cambian de signo y salen $A_y = 85{,}5$ N y
      $D_y = 27{,}6$ N. Los valores publicados son los del giro horario, que es
      el de las flechas de la figura. Las componentes horizontales, en cambio,
      no cambian: solo dependen de $\omega^{2}$ y de $\alpha_2$, que salen
      iguales en los dos casos.
  - id: ejma12-col1211-la-barra-que-desliza-por-el-suelo
    titulo: La barra articulada a un balancín que desliza por el suelo
    fuente: Ejercicio 12.11 · Tema 12, «Dinámica del sólido con movimiento plano» · Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado y el curso su resolución, y el desarrollo está contrastado contra los dos. El número impreso en la colección no sale de los datos; el bueno es el de la resolución del curso, y aquí se explica de dónde viene el otro.
    nivel: practica
    enunciado: |
      La barra uniforme de 6 kg $AB$ está articulada en su extremo A a la barra
      $AC$ de peso despreciable y en el otro extremo $B$ desliza sin rozamiento
      por el suelo. En el instante señalado, la barra $AB$ parte del reposo y el
      punto $B$ tiene una aceleración de $3\ \text{m/s}^{2}$ hacia la izquierda
      debido a la fuerza $P$. Para ese instante, calcular:

      a) Valor de la fuerza $P$.

      b) Fuerza que la barra $AC$ ejerce sobre la barra $AB$.

      <figure>
      <svg viewBox="0 0 300 205" role="img" width="300" height="205" aria-labelledby="ma1211-t ma1211-d">
        <title id="ma1211-t">La barra AB, articulada en A a la barra AC y apoyada en B sobre el suelo</title>
        <desc id="ma1211-d">La barra AB mide 1,5 metros y baja desde A, arriba a la izquierda, hasta B, abajo a la derecha, sobre el suelo horizontal. Desde A sale hacia la derecha la barra horizontal AC, articulada en C a un apoyo fijo. El desnivel entre la recta AC y el suelo es de 1,2 metros. En B actúa la fuerza P, horizontal y hacia la izquierda. El ángulo entre AB y la horizontal se llama beta.</desc>
        <defs>
          <marker id="ma1211-p" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="ma1211-c" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--faint)"/>
          </marker>
        </defs>
        <line x1="100" y1="160" x2="288" y2="160" stroke="var(--ink)" stroke-width="1.4"/>
        <path d="M108 160 L100 168 M128 160 L120 168 M148 160 L140 168 M168 160 L160 168 M188 160 L180 168 M208 160 L200 168 M228 160 L220 168 M248 160 L240 168 M268 160 L260 168 M288 160 L280 168" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="232" y1="22" x2="268" y2="22" stroke="var(--ink)" stroke-width="1.4"/>
        <path d="M236 22 L228 30 M248 22 L240 30 M260 22 L252 30 M268 22 L260 30" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="60" y1="40" x2="250" y2="40" stroke="var(--ink)" stroke-width="2.2"/>
        <line x1="60" y1="40" x2="150" y2="160" stroke="var(--ink)" stroke-width="3.4"/>
        <rect x="242" y="32" width="16" height="16" rx="2" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/>
        <line x1="250" y1="22" x2="250" y2="32" stroke="var(--ink)" stroke-width="1.2"/>
        <circle cx="250" cy="40" r="2.6" fill="var(--ink)"/>
        <circle cx="60" cy="40" r="3.2" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.4"/>
        <circle cx="150" cy="160" r="3.2" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.4"/>
        <path d="M84 40 A 24 24 0 0 1 78 55" fill="none" stroke="var(--faint)" stroke-width="1"/>
        <text x="88" y="58" font-size="10" fill="var(--ink)">β</text>
        <text x="48" y="36" font-size="11" font-weight="600" fill="var(--ink)">A</text>
        <text x="139" y="176" font-size="11" font-weight="600" fill="var(--ink)">B</text>
        <text x="256" y="58" font-size="11" font-weight="600" fill="var(--ink)">C</text>
        <line x1="146" y1="172" x2="106" y2="172" stroke="var(--flag)" stroke-width="2" marker-end="url(#ma1211-p)"/>
        <text x="150" y="176" font-size="10" fill="var(--flag)">P</text>
        <line x1="278" y1="44" x2="278" y2="156" stroke="var(--faint)" stroke-width="0.9" marker-start="url(#ma1211-c)" marker-end="url(#ma1211-c)"/>
        <text x="274" y="104" font-size="9.5" text-anchor="end" fill="var(--faint)">1,2 m</text>
        <text x="26" y="120" font-size="9.5" fill="var(--faint)">AB = 1,5 m</text>
        <text x="150" y="198" font-size="9" text-anchor="middle" fill="var(--faint)">B desliza sin rozamiento; AC no pesa</text>
      </svg>
      </figure>
    pide: La fuerza P y la fuerza que la barra AC ejerce sobre AB, en newtons.
    pasos:
      - tipo: reconocer
        pregunta: |
          La barra $AC$ no pesa y está articulada en sus dos extremos, con $C$
          fijo. ¿Qué dos cosas impone eso?
        opciones:
          - texto: Que su fuerza sobre AB es horizontal, y que la aceleración de A es vertical
            correcta: true
            mensaje: |
              Eso es. Al ser una barra de dos fuerzas, la fuerza que transmite va
              en su propia dirección, que aquí es horizontal. Y como $A$ describe
              una circunferencia alrededor del $C$ fijo y se parte del reposo, su
              aceleración es perpendicular a $AC$, o sea vertical.
          - texto: Que no ejerce ninguna fuerza sobre AB, porque no tiene peso
            mensaje: |
              No pesar no es no transmitir. Una barra sin masa transmite una
              fuerza perfectamente; lo que su falta de masa impone es que esa
              fuerza vaya justo en la dirección de la barra.
          - texto: Que en A hay una reacción con dos componentes, como en cualquier articulación
            mensaje: |
              Sería así si $AC$ tuviera masa o cargas por el camino. Al ser una
              barra de dos fuerzas, la componente vertical en $A$ es nula y queda
              una sola incógnita.
          - texto: Que el punto A está fijo, porque C lo está
            mensaje: |
              $C$ es fijo, pero $A$ no. $A$ gira alrededor de $C$, y por eso su
              aceleración no es cero, sino perpendicular a $AC$.

      - tipo: calcular
        titulo: La aceleración angular de la barra AB
        pregunta: |
          Con $\sin\beta = 1{,}2/1{,}5 = 0{,}8$, ¿cuánto vale el módulo de la
          aceleración angular de $AB$, en rad/s²?
        respuesta:
          tipo: numero
          valor: '2.5'
          tolerancia: 0.02
          formato: un número, en rad/s²
        distractores:
          - valor: '2'
            mensaje: |
              Has dividido la aceleración de $B$ entre la longitud entera,
              $3/1{,}5$. Lo que fija $\alpha$ es la condición de que $A$ solo
              pueda acelerar en vertical, y ahí entra la proyección
              $L\sin\beta = 1{,}2$ m.
          - valor: '3.3333'
            mensaje: |
              Has usado la proyección horizontal, $L\cos\beta = 0{,}9$ m. La
              componente horizontal de $\vec{\alpha}\times\overrightarrow{BA}$
              sale de la coordenada vertical de $\overrightarrow{BA}$, que es
              $L\sin\beta$.
        pista: |
          Escribe $\vec{a}_A = \vec{a}_B + \vec{\alpha}\times\overrightarrow{BA}$
          con $\omega = 0$ e impón que $a_{Ax} = 0$.
        desarrollo: |
          Con $\overrightarrow{BA} = (-L\cos\beta,\ L\sin\beta)$ y $\omega = 0$,

          $$
          a_{Ax} = a_B - \alpha\,L\sin\beta = 0
          \;\Longrightarrow\;
          \alpha = \frac{a_B}{L\sin\beta} = \frac{3}{1{,}2} = 2{,}5\ \text{rad/s}^{2}
          $$

          El giro es en sentido horario, así que en ejes $\vec{\alpha} = -2{,}5\,\hat{k}$.

      - tipo: calcular
        titulo: La normal del suelo en B
        pregunta: |
          El centro de masas acelera $a_{Gy} = 1{,}125\ \text{m/s}^{2}$ hacia
          arriba. Tomando $g = 9{,}81\ \text{m/s}^{2}$, ¿cuánto vale la normal en
          $B$?
        respuesta:
          tipo: magnitud
          valor: '65.61 N'
          tolerancia: 0.01
          formato: una fuerza, con su unidad
        distractores:
          - valor: '58.86 N'
            mensaje: |
              Es el peso de la barra, la normal que habría si $G$ no acelerara en
              vertical. Aquí $G$ sube acelerando, así que el suelo tiene que
              empujar más que el peso.
          - valor: '52.11 N'
            mensaje: |
              Has restado el término $m\,a_{Gy}$ en vez de sumarlo. $G$ acelera
              hacia arriba, y $N - mg = m\,a_{Gy}$ con $a_{Gy}$ positiva.
        pista: |
          Teorema del momento lineal en vertical, $N - mg = m\,a_{Gy}$. Ninguna
          otra fuerza tiene componente vertical.
        desarrollo: |
          $$
          N = m\,(g + a_{Gy}) = 6\,(9{,}81 + 1{,}125) = 65{,}61\ \text{N}
          $$

      - tipo: calcular
        titulo: La fuerza P
        pregunta: |
          Tomando momentos en $G$ con el sistema equivalente, ¿cuánto vale el
          módulo de la fuerza $P$?
        respuesta:
          tipo: magnitud
          valor: '31.45 N'
          tolerancia: 0.01
          formato: una fuerza, con su unidad
        distractores:
          - valor: '26.76 N'
            mensaje: |
              Es el valor que imprime la colección, y sale de escribir el par
              $I_G\alpha$ con el signo cambiado. El giro es horario y $G$ acelera
              hacia la izquierda y hacia arriba; con el signo bueno salen
              $31{,}45$ N y $22{,}45$ N.
          - valor: '9 N'
            mensaje: |
              Eso es solo $m\,|a_{Gx}|$, la resultante horizontal. En horizontal
              actúan dos fuerzas, $P$ y la que transmite $AC$, y hace falta la
              ecuación de momentos para separarlas.
        pista: |
          En $G$, la normal y $P$ dan momento desde $B$, y la fuerza de $AC$ desde
          $A$. Iguala la suma a $I_G\alpha$ con $I_G = mL^{2}/12$.
        desarrollo: |
          Con $A$ y $B$ a $(\mp 0{,}45;\ \pm 0{,}6)$ m de $G$ y
          $I_G = 6\cdot 1{,}5^{2}/12 = 1{,}125\ \text{kg}\,\text{m}^{2}$,

          $$
          -0{,}6\,A_x + 0{,}45\,N + 0{,}6\,P_x = I_G\,\alpha = -2{,}8125
          $$

          Junto con $A_x + P_x = m\,a_{Gx} = -9$ N queda
          $P_x = -31{,}45$ N, es decir $31{,}45$ N hacia la izquierda.

      - tipo: calcular
        titulo: La fuerza que AC ejerce sobre AB
        pregunta: |
          ¿Cuánto vale esa fuerza, la que la barra $AC$ hace sobre $AB$ en $A$?
        respuesta:
          tipo: magnitud
          valor: '22.45 N'
          tolerancia: 0.01
          formato: una fuerza, con su unidad
        distractores:
          - valor: '17.76 N'
            mensaje: |
              Es el valor impreso en la colección, y arrastra el mismo signo
              cambiado en $I_G\alpha$ que el de la fuerza $P$. Con el signo bueno
              son $22{,}45$ N.
          - valor: '65.61 N'
            mensaje: |
              Esa es la normal del suelo. La fuerza de $AC$ es horizontal y sale
              de la ecuación de momentos, no de la vertical.
        pista: |
          Ya tienes $P_x$ y la ecuación horizontal $A_x + P_x = m\,a_{Gx}$.
        desarrollo: |
          $$
          A_x = m\,a_{Gx} - P_x = -9 + 31{,}45 = 22{,}45\ \text{N}
          $$

          Positiva hacia la derecha, o sea que $AC$ empuja a $AB$ hacia $C$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'La barra AC no pesa y se articula en sus dos extremos, así que su fuerza en $A$ es horizontal y $\vec{a}_A$ es vertical.'
          - texto: 'De $a_{Ax}=0$ sale $\alpha = a_B/(L\sin\beta) = 2{,}5$ rad/s², y con ella $a_{Gx} = -1{,}5$ y $a_{Gy} = 1{,}125$ m/s².'
          - texto: 'Del momento lineal en vertical, $N = m(g + a_{Gy}) = 65{,}61$ N.'
          - texto: 'Momentos en $G$ con $\sum M_G = I_G\alpha$, y con la horizontal $A_x + P_x = m a_{Gx}$, salen $P = 31{,}45$ N y $A_x = 22{,}45$ N.'
          - texto: Como la barra parte del reposo, su aceleración angular es nula y G acelera lo mismo que B.
            trampa: true
            mensaje: |
              Partir del reposo es $\omega = 0$, no $\alpha = 0$. Justamente
              porque $\alpha \ne 0$ los puntos de la barra aceleran de forma
              distinta, y todo el problema vive en esa diferencia.
    resolucion: |
      **La geometría.** Con $H = 1{,}2$ m y $AB = 1{,}5$ m, $\sin\beta = 0{,}8$ y
      $\cos\beta = 0{,}6$.

      **Cinemática.** La barra $AC$ no tiene masa y está articulada en sus dos
      extremos, así que solo transmite fuerza en su dirección, horizontal; y como
      $C$ es fijo y se parte del reposo, $\vec{a}_A$ es perpendicular a $AC$, es
      decir vertical. Con $\omega = 0$,

      $$
      \vec{a}_A = \vec{a}_B + \vec{\alpha}\times\overrightarrow{BA}
      \;\Longrightarrow\;
      0 = -3 + \alpha\,L\sin\beta
      \;\Longrightarrow\;
      \alpha = 2{,}5\ \text{rad/s}^{2}
      $$

      en sentido horario. Para el centro, a media barra de $B$,

      $$
      a_{Gx} = -1{,}5\ \text{m/s}^{2}
      \qquad
      a_{Gy} = 1{,}125\ \text{m/s}^{2}
      $$

      **Dinámica.** En vertical solo hay peso y normal, así que
      $N = m(g + a_{Gy}) = 65{,}61$ N. En horizontal, $A_x + P_x = m a_{Gx} = -9$ N.
      Y tomando momentos en $G$, con $I_G = mL^{2}/12 = 1{,}125\ \text{kg}\,\text{m}^{2}$,

      $$
      -0{,}6\,A_x + 0{,}45\,N + 0{,}6\,P_x = I_G\,\alpha
      $$

      De las dos últimas salen $P = 31{,}45$ N hacia la izquierda y
      $A_x = 22{,}45$ N hacia $C$.

      **Sobre el resultado impreso.** La colección publica $P = 26{,}76$ N y
      $A_x = 17{,}76$ N. Esos dos números se reproducen exactamente escribiendo
      $+I_G\alpha$ donde va $-I_G\alpha$, y la resolución oficial del curso
      publica los mismos $31{,}45$ y $22{,}45$ que salen aquí, junto con la misma
      normal $N = 65{,}61$ N. Los dos valores impresos se diferencian en
      $4{,}69$ N, que es justo $2 I_G\alpha/0{,}6$ repartido por igual.

  - id: ejma12-col1212-las-barras-soldadas-con-dos-eslabones
    titulo: Dos barras soldadas colgadas de dos eslabones paralelos
    fuente: Ejercicio 12.12 · Tema 12, «Dinámica del sólido con movimiento plano» · Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado y el curso su resolución, y el desarrollo está contrastado contra los dos.
    nivel: practica
    enunciado: |
      Dos barras uniformes $BD$ y $EF$ cada una de 2 kg de masa están unidas
      mediante soldadura (rígidamente) en el punto $E$ y ligadas a dos eslabones
      (1) y (2), sin masa. Calcular las fuerzas sobre las barras (1) y (2) después
      de soltar desde el reposo. $G$ es el centro de gravedad de la estructura.

      <figure>
      <svg viewBox="0 0 305 268" role="img" width="305" height="268" aria-labelledby="ma1212-t ma1212-d">
        <title id="ma1212-t">Las barras soldadas BD y EF colgadas de dos eslabones paralelos</title>
        <desc id="ma1212-d">La barra BD es vertical y mide 800 milímetros, con B arriba y D abajo; la barra EF es horizontal, mide 800 milímetros y arranca del punto medio E de la barra BD. G, el centro de gravedad del conjunto, está sobre EF a 200 milímetros de E. El eslabón 1 une B con el punto A de la pared, y el eslabón 2 une D con el punto C de la misma pared; los dos forman 60 grados con la horizontal y son paralelos e iguales.</desc>
        <defs>
          <marker id="ma1212-c" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--faint)"/>
          </marker>
        </defs>
        <line x1="118" y1="60" x2="118" y2="250" stroke="var(--ink)" stroke-width="1.4"/>
