ejercicios:
  - id: ejma12-el-cilindro-que-rueda-por-el-plano
    titulo: Un cilindro que rueda por un plano inclinado
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Un cilindro macizo y homogéneo de 2 kg rueda sin deslizar por un plano
      inclinado 30°. Tomando $g = 9{,}8\ \text{m/s}^{2}$, calcular la aceleración
      de su centro y el coeficiente de rozamiento mínimo para que no deslice.
    pide: La aceleración del centro y el rozamiento mínimo.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿En qué punto conviene tomar momentos para sacar la aceleración?
        opciones:
          - texto: En el punto de contacto, sumando el momento de M·aG, porque ahí no aparecen N ni Fr
            correcta: true
            mensaje: |
              Eso es. En el contacto la normal y el rozamiento no dan momento, y
              la ecuación sale con una sola incógnita, si al par $I_G\,\alpha$ le
              sumas el momento de $M a_G$, que es $M a_G R$.
          - texto: En el centro, porque allí la ecuación es la más sencilla
            mensaje: |
              Se puede, pero entonces el rozamiento da momento y aparece como
              incógnita: hay que combinarla con la ecuación de fuerzas. En el
              contacto sale directamente.
          - texto: En el punto de contacto, con solo el par I_G·α
            mensaje: |
              Fuera de $G$ hay que contar también el momento de $M\vec{a}_G$
              respecto del punto. Sin él, la aceleración sale tres veces mayor.

      - tipo: calcular
        titulo: La aceleración del centro
        pregunta: |
          ¿Cuánto vale la aceleración del centro, en m/s²?
        respuesta:
          tipo: numero
          valor: '3.267'
          tolerancia: 0.01
          formato: un número, en m/s²
        distractores:
          - valor: '4.9'
            mensaje: |
              Es $g \sin 30°$, la de un bloque que desliza sin rozamiento. El
              cilindro rueda: parte de la energía se va en girar, y acelera
              menos.
          - valor: '2.45'
            mensaje: |
              Es la de un anillo, con $I_G = MR^{2}$. El cilindro macizo tiene
              $I_G = MR^{2}/2$.
          - valor: '9.8'
            mensaje: |
              Has tomado momentos en el contacto solo con $I_G\,\alpha$, sin el
              momento de $M a_G$. Falta ese término.
        pista: |
          Momentos en el contacto: $M g R \sin 30° = I_G\,\alpha + M\,a_G\,R$, con
          $I_G = MR^{2}/2$ y $\alpha = a_G/R$.
        desarrollo: |
          $$
          M g R \sin 30° = \tfrac12 M R^{2} \frac{a_G}{R} + M a_G R
          \;\Longrightarrow\;
          a_G = \tfrac23\,g \sin 30° = 3{,}267\ \text{m/s}^{2}
          $$

      - tipo: calcular
        titulo: El rozamiento mínimo
        pregunta: |
          ¿Qué coeficiente de rozamiento mínimo hace falta para que no deslice?
        respuesta:
          tipo: numero
          valor: '0.1925'
          tolerancia: 0.002
          formato: un número, sin unidad
        distractores:
          - valor: '0.577'
            mensaje: |
              Es $\tan 30°$, el coeficiente que necesita un bloque para quedarse
              quieto. El cilindro no está quieto: rueda, y el rozamiento solo
              tiene que dar la parte que hace girar.
          - valor: '0.2887'
            mensaje: |
              Es el de un anillo, $\tfrac12 \tan 30°$. Con el cilindro macizo el
              rozamiento es menor: $\tfrac13 \tan 30°$.
        pista: |
          Del teorema del momento angular en $G$: $F_r R = I_G\,\alpha$, así que
          $F_r = \tfrac12 M a_G$. Y $N = M g \cos 30°$.
        desarrollo: |
          $$
          F_r = \tfrac12 M a_G = 3{,}267\ \text{N}
          \qquad
          N = 2 \cdot 9{,}8 \cos 30° = 16{,}97\ \text{N}
          \qquad
          \mu_{\min} = \frac{3{,}267}{16{,}97} = 0{,}1925
          $$

          Que es $\tfrac13 \tan 30°$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Momentos en el contacto, con el sistema equivalente: $M g R \sin 30° = I_G\,\alpha + M a_G R$.'
          - texto: Con $I_G = MR^{2}/2$ y $\alpha = a_G/R$, $a_G = \tfrac23 g \sin 30° = 3{,}27$ m/s².
          - texto: En $G$, $F_r R = I_G\,\alpha$, así que $F_r = \tfrac12 M a_G = 3{,}27$ N, y $\mu \ge 3{,}27/16{,}97 = 0{,}19$.
          - texto: Como rueda sin deslizar, el rozamiento vale $\mu N$ y el cilindro acelera $g(\sin 30° - \mu \cos 30°)$.
            trampa: true
            mensaje: |
              Rodar sin deslizar es un rozamiento **estático**, por debajo de su
              techo: vale lo que pida el equilibrio de momentos, 3,27 N, no
              $\mu N$. Esa fórmula es la de un bloque que desliza.
    resolucion: |
      **La aceleración.** Momentos en el punto de contacto $C$, donde no dan
      momento ni la normal ni el rozamiento. El sistema equivalente tiene el par
      $I_G\,\alpha$ y el vector $M a_G$ en $G$, a una distancia $R$ de $C$:

      $$
      M g R \sin 30° = \tfrac12 M R^{2}\,\frac{a_G}{R} + M a_G R
      \;\Longrightarrow\;
      a_G = \tfrac23\,g \sin 30° = 3{,}267\ \text{m/s}^{2}
      $$

      **El rozamiento.** Momentos en $G$: solo el rozamiento da momento,

      $$
      F_r\,R = \tfrac12 M R^{2}\,\frac{a_G}{R} \;\Longrightarrow\; F_r = \tfrac12 M a_G = 3{,}267\ \text{N}
      $$

      Con $N = M g \cos 30° = 16{,}97\ \text{N}$, rodar sin deslizar exige
      $\mu \ge 0{,}1925$, un tercio de $\tan 30°$. Y ni la masa ni el radio
      importan: todos los cilindros macizos bajan igual.

  - id: ejma12-la-barra-que-se-suelta
    titulo: Una barra articulada que se suelta desde la horizontal
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Una barra homogénea de 1 m y 3 kg está articulada en su extremo $O$ y se
      mantiene horizontal. Se suelta desde el reposo. Tomando
      $g = 9{,}8\ \text{m/s}^{2}$, calcular su aceleración angular y la reacción
      vertical en la articulación en el instante de soltarla.
    pide: La aceleración angular y la reacción en O al soltarla.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué ecuación da directamente la aceleración angular?
        opciones:
          - texto: La del momento angular en el punto fijo O, con I_O
            correcta: true
            mensaje: |
              Eso es. $O$ es fijo, así que $\sum M_O = I_O\,\alpha$, y la reacción
              en $O$ no da momento: una sola incógnita.
          - texto: La del momento angular en O, pero con I_G
            mensaje: |
              En un punto fijo el momento de inercia es el respecto de ese
              punto. Con $I_G$ la aceleración sale cuatro veces mayor.
          - texto: La de fuerzas, porque el peso es la única fuerza conocida
            mensaje: |
              En la de fuerzas aparece la reacción en $O$, que no se conoce. La de
              momentos en $O$ la elimina.

      - tipo: calcular
        titulo: La aceleración angular
        pregunta: |
          ¿Cuánto vale la aceleración angular al soltarla, en rad/s²?
        respuesta:
          tipo: numero
          valor: '14.7'
          tolerancia: 0.05
          formato: un número, en rad/s²
        distractores:
          - valor: '58.8'
            mensaje: |
              Has usado $I_G = ML^{2}/12$. El eje de giro pasa por $O$, en el
              extremo: $I_O = ML^{2}/3$.
          - valor: '4.9'
            mensaje: |
              Has concentrado la masa en el extremo libre, $I = ML^{2}$. Está
              repartida a lo largo de la barra: $I_O = ML^{2}/3$.
        pista: |
          $M g \frac{L}{2} = I_O\,\alpha$, con $I_O = ML^{2}/3$.
        desarrollo: |
          $$
          \alpha = \frac{M g L/2}{ML^{2}/3} = \frac{3g}{2L} = \frac{3 \cdot 9{,}8}{2} = 14{,}7\ \text{rad/s}^{2}
          $$

      - tipo: calcular
        titulo: La reacción en O
        pregunta: |
          ¿Cuánto vale la reacción vertical en $O$ en ese instante, en N?
        respuesta:
          tipo: numero
          valor: '7.35'
          tolerancia: 0.05
          formato: un número, en N
        distractores:
          - valor: '29.4'
            mensaje: |
              Es el peso, la reacción que habría con la barra quieta. Al
              soltarla, $G$ baja acelerando y la articulación deja de sostener
              todo el peso.
          - valor: '0'
            mensaje: |
              La barra no cae libre: está articulada. $G$ acelera $\alpha L/2 = 7{,}35$
              m/s², menos que $g$, y la diferencia la sostiene la articulación.
        pista: |
          $a_G = \alpha \frac{L}{2}$, hacia abajo. Teorema del momento lineal:
          $M g - R = M a_G$.
        desarrollo: |
          $$
          a_G = 14{,}7 \cdot 0{,}5 = 7{,}35\ \text{m/s}^{2}
          \qquad
          R = M(g - a_G) = 3\,(9{,}8 - 7{,}35) = 7{,}35\ \text{N}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Momentos en el punto fijo O: $M g L/2 = I_O\,\alpha$, con $I_O = ML^{2}/3$, así que $\alpha = 3g/(2L) = 14{,}7$ rad/s².'
          - texto: Al soltarla no hay velocidad, así que $G$ solo tiene aceleración tangencial, $\alpha L/2 = 7{,}35$ m/s², vertical.
          - texto: 'Teorema del momento lineal: $M g - R = M a_G$, y $R = 3 \cdot 2{,}45 = 7{,}35$ N.'
          - texto: Mientras la barra no se mueve, la articulación sigue sosteniendo todo el peso, 29,4 N.
            trampa: true
            mensaje: |
              En el instante de soltarla la barra no tiene velocidad, pero sí
              aceleración. $G$ baja acelerando, y la articulación sostiene solo
              la cuarta parte del peso.
    resolucion: |
      **La aceleración angular.** $O$ es un punto fijo, y tomando momentos en él
      la reacción desaparece:

      $$
      M g \frac{L}{2} = \frac{ML^{2}}{3}\,\alpha
      \;\Longrightarrow\;
      \alpha = \frac{3g}{2L} = 14{,}7\ \text{rad/s}^{2}
      $$

      **La reacción.** Al soltarla, la velocidad angular es nula, así que $G$
      solo tiene aceleración tangencial, vertical y hacia abajo:
      $a_G = \alpha L/2 = 7{,}35\ \text{m/s}^{2}$. Por el teorema del momento
      lineal:

      $$
      M g - R = M a_G \;\Longrightarrow\; R = 3\,(9{,}8 - 7{,}35) = 7{,}35\ \text{N}
      $$

      Una cuarta parte del peso: en ese instante la articulación sostiene mucho
      menos de lo que sostenía con la barra quieta.

  - id: ejma12-col121-el-engranaje-que-rueda-por-la-pista
    titulo: El engranaje que rueda por la pista dentada
    fuente: >-
      Ejercicio 12.1 · Tema 12, «Dinámica del sólido con movimiento plano» ·
      Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección publica el
      resultado, contra el que está contrastado el desarrollo, y se ha
      comprobado también con la resolución oficial del profesor. Con g = 9,81
      m/s2 la cuenta da 1,543 m/s; la colección imprime 1,542 y la resolución
      oficial, 1,543.
    nivel: practica
    enunciado: |
      El engranaje (2) de radio $L/2$ ($=BE$) tiene una masa de 3,2 kg y un
      radio de giro central de 60 mm. Rueda sobre la pista dentada fija (3) y
      está articulado en su centro $B$ a la barra (1), de masa 2,4 kg y
      longitud $L$ = 160 mm. Si el sistema se suelta del reposo en la posición
      mostrada, calcular la velocidad del punto $B$ después de que la barra
      $AB$ haya girado 90º.

      <figure>
      <svg viewBox="0 0 300 262" role="img" width="300" height="262" aria-labelledby="ma12c1-t ma12c1-d">
        <title id="ma12c1-t">El engranaje articulado a la barra AB, rodando por la pista dentada fija</title>
        <desc id="ma12c1-d">La barra AB, de 160 milimetros, esta articulada en A a un apoyo fijo del suelo y en B al centro del engranaje (2), de radio 80 milimetros. El engranaje engrana por su derecha con la pista dentada fija (3), un arco centrado en A y de radio 240 milimetros; el contacto es el punto E, alineado con A y con B. En la posicion dibujada la barra esta horizontal.</desc>
        <path d="M247.5 19.8 A235 235 0 0 1 247.5 240.2 L230.7 231.4 A216 216 0 0 0 230.7 28.6 Z" fill="var(--faint)" fill-opacity="0.35" stroke="var(--ink)" stroke-width="1.2"/>
        <circle cx="184" cy="130" r="72" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.3"/>
        <line x1="40" y1="130" x2="184" y2="130" stroke="var(--ink)" stroke-width="4"/>
        <circle cx="40" cy="130" r="4.5" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
        <circle cx="184" cy="130" r="3.5" fill="var(--ink)"/>
        <line x1="22" y1="138" x2="58" y2="138" stroke="var(--ink)" stroke-width="1.1"/>
        <path d="M28 138 L22 146 M36 138 L30 146 M44 138 L38 146 M52 138 L46 146" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <circle cx="256" cy="130" r="3" fill="var(--flag)"/>
        <text x="34" y="122" font-size="10" text-anchor="end" fill="var(--ink)">A</text>
        <text x="177" y="121" font-size="10" text-anchor="end" fill="var(--ink)">B</text>
        <text x="250" y="152" font-size="10" fill="var(--flag)">E</text>
        <text x="112" y="122" font-size="9.5" text-anchor="middle" fill="var(--ink)">(1)</text>
        <text x="184" y="82" font-size="9.5" text-anchor="middle" fill="var(--ink)">(2)</text>
        <text x="215" y="45" font-size="9.5" text-anchor="middle" fill="var(--ink)">(3)</text>
        <line x1="40" y1="228" x2="184" y2="228" stroke="var(--faint)" stroke-width="0.9"/>
        <path d="M40 224 L40 232 M184 224 L184 232" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <text x="112" y="221" font-size="9" text-anchor="middle" fill="var(--faint)">L = 160 mm</text>
        <line x1="184" y1="252" x2="256" y2="252" stroke="var(--faint)" stroke-width="0.9"/>
        <path d="M184 248 L184 256 M256 248 L256 256" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <text x="220" y="245" font-size="9" text-anchor="middle" fill="var(--faint)">L/2</text>
      </svg>
      <figcaption>

      La barra **AB** mide **160 mm** y el engranaje **(2)**, articulado a ella
      en **B**, tiene radio **80 mm**. La pista **(3)** está fija: su radio es
      **240 mm** y el contacto **E** queda alineado con **A** y **B**. Dibujada
      a escala.

      </figcaption>
      </figure>
    pide: La velocidad del punto B cuando la barra AB ha girado 90 grados.
    pasos:
      - tipo: reconocer
        pregunta: |
          El sistema parte del reposo y se pide una velocidad 90º después.
          ¿Qué herramienta del tema resuelve eso con menos cuentas?
        opciones:
          - texto: El teorema de la energía, porque no hay ninguna fuerza no conservativa
            correcta: true
            mensaje: |
              Eso es. La reacción de la articulación no trabaja y el contacto
              de rodadura tampoco —su punto de aplicación tiene velocidad
              nula—, así que $T_A + V_A = T_B + V_B$ entre las dos posiciones.
          - texto: Las tres ecuaciones del movimiento plano en la posición inicial
            mensaje: |
              Dan la aceleración angular en ese instante, no la velocidad 90º
              después. Para llegar a la velocidad habría que integrar, y
              $\alpha$ cambia con el ángulo: mucho más trabajo.
          - texto: La conservación del momento angular respecto del punto fijo A
            mensaje: |
              No se conserva: los dos pesos dan momento respecto de $A$, y ese
              momento es justo lo que pone el sistema en marcha.
          - texto: El teorema del impulso angular entre las dos posiciones
            mensaje: |
              Relaciona dos instantes a través de la integral del momento en el
              tiempo, y el enunciado no dice cuánto tarda. Lo que conecta dos
              posiciones es la energía.

      - tipo: calcular
        titulo: La rodadura sobre la pista fija
        pregunta: |
          El contacto $E$ es un punto del engranaje con velocidad nula.
          ¿Cuántas veces mayor es $\omega_2$, la velocidad angular del
          engranaje, que $\omega_1$, la de la barra?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.02
          formato: un número, sin unidad
        distractores:
          - valor: '0.5'
            mensaje: |
              Has invertido la proporción. $B$ va a $\omega_1 L$ y $E$ está a
              $L/2$ de $B$, así que hace falta una $\omega_2$ **mayor** para
              frenar ese punto hasta cero.
          - valor: '3'
            mensaje: |
              Es el cociente entre el radio de la pista y el del engranaje,
              $1{,}5L$ entre $0{,}5L$. Eso valdría si el centro $B$ estuviera
              quieto, y aquí $B$ se mueve con la barra.
          - valor: '1'
            mensaje: |
              Si el engranaje girase solidario con la barra, el punto de
              contacto llevaría $\omega_1 \cdot 1{,}5L$ y estaría deslizando
              sobre la pista.
        pista: |
          Escribe $\vec{v}_E = \vec{v}_B + \vec{\omega}_2 \times \overrightarrow{BE}$
          y obliga a que $\vec{v}_E$ sea nula.
        desarrollo: |
          $$
          0 = \omega_1 L - \omega_2\,\frac{L}{2}
          \;\Longrightarrow\;
          \omega_2 = 2\,\omega_1
          $$

      - tipo: calcular
        titulo: La velocidad de B tras el cuarto de vuelta
        pregunta: |
          Con $g = 9{,}81\ \text{m/s}^{2}$, ¿cuánto vale la velocidad de $B$
          después de que la barra haya girado 90º?
        respuesta:
          tipo: magnitud
          valor: '1.543 m/s'
          tolerancia: 0.01
          formato: en m/s, con tres cifras
        distractores:
          - valor: '1.858 m/s'
            mensaje: |
              Te has dejado la energía de rotación del engranaje,
              $\tfrac12 m_2 r_G^{2}\omega_2^{2}$. Vale casi un tercio del
              total: el engranaje gira el doble de rápido que la barra.
          - valor: '1.762 m/s'
            mensaje: |
              Has puesto $\omega_2 = \omega_1$ en la energía de rotación del
              engranaje. Rueda sobre una pista fija, así que gira al doble.
          - valor: '1.230 m/s'
            mensaje: |
              Has bajado el centro del engranaje solo $L/2$. Es $B$ quien
              recorre el cuarto de circunferencia de radio $L$, así que baja
              $L$ entero; la barra baja $L/2$ porque su centro está a mitad.
        pista: |
          La potencial baja $m_1 g \frac{L}{2} + m_2 g L$. Y la cinética tiene
          cuatro términos: la barra girando en $A$, y el engranaje trasladando
          con $B$ y girando con $\omega_2 = 2\omega_1$.
        desarrollo: |
          $$
          m_1 g \frac{L}{2} + m_2 g L
          = \tfrac12\left(\frac{m_1L^{2}}{3}\right)\omega_1^{2}
          + \tfrac12 m_2 (\omega_1 L)^{2} + \tfrac12 m_2 r_G^{2}(2\omega_1)^{2}
          $$

          $$
          6{,}906 = 0{,}07424\,\omega_1^{2}
          \;\Longrightarrow\;
          \omega_1 = 9{,}645\ \text{rad/s}
          \qquad
          v_B = \omega_1 L = 1{,}543\ \text{m/s}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Nada disipa energía: la articulación en A no trabaja y el contacto de rodadura tampoco, porque su punto de aplicación está parado.'
          - texto: La potencial baja $m_1 g \frac{L}{2} + m_2 g L = 6{,}906$ J, porque el centro de la barra desciende $L/2$ y el del engranaje, $L$.
          - texto: 'Rodadura en E: $\omega_2 = 2\omega_1$, y la cinética suma la barra girando en A más el engranaje trasladando y girando.'
          - texto: Como el engranaje rueda sin deslizar, su punto de contacto está quieto y por tanto el engranaje no aporta energía cinética de rotación.
            trampa: true
            mensaje: |
              Que el punto de contacto esté quieto no quita rotación: el
              engranaje gira alrededor de él con $\omega_2 = 2\omega_1$. Ese
              término vale 1,07 J de los 6,91, y quitarlo sube la respuesta de
              1,54 a 1,86 m/s.
    resolucion: |
      **La cinemática.** La barra gira alrededor del punto fijo $A$, así que
      $v_B = \omega_1 L$. El engranaje rueda sobre la pista fija, y su punto de
      contacto $E$ —a distancia $L/2$ de $B$— tiene velocidad nula:

      $$
      0 = \omega_1 L - \omega_2\,\frac{L}{2}
      \;\Longrightarrow\;
      \omega_2 = 2\,\omega_1
      $$

      **La energía.** No hay fuerzas no conservativas. Al girar 90º el centro
      de la barra baja $L/2$ y el centro del engranaje baja $L$:

      $$
      m_1 g \frac{L}{2} + m_2 g L
      = \tfrac12\,\frac{m_1L^{2}}{3}\,\omega_1^{2}
      + \tfrac12\,m_2 L^{2}\omega_1^{2}
      + \tfrac12\,m_2 r_G^{2}\,4\omega_1^{2}
      $$

      Con $m_1 = 2{,}4$ kg, $m_2 = 3{,}2$ kg, $L = 0{,}16$ m y
      $r_G = 0{,}06$ m, el primer miembro vale 6,906 J y el corchete del
      segundo, 0,07424 kg m²:

      $$
      \omega_1 = 9{,}645\ \text{rad/s}
      \qquad
      v_B = \omega_1 L = 1{,}543\ \text{m/s}
      $$

      **De dónde sale cada trozo de energía.** De los 6,906 J, la barra se
      lleva 0,95 J, la traslación del engranaje 3,81 J y su rotación 1,07 J.
      El engranaje se lleva siete de cada diez julios, y por eso olvidarse de
      su radio de giro estropea la respuesta.

  - id: ejma12-col122-la-barra-acb-guiada-por-dos-bloques
    titulo: La barra ACB guiada por dos bloques
    fuente: >-
      Ejercicio 12.2 · Tema 12, «Dinámica del sólido con movimiento plano» ·
      Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección publica el
      resultado, contra el que está contrastado el desarrollo, y se ha
      comprobado también con la resolución oficial del profesor. El resultado
      es simbólico, así que las casillas piden los coeficientes de la
      expresión, no un número con unidades.
    nivel: practica
    enunciado: |
      El movimiento de la barra uniforme $ACB$ de masa $M$ está guiado por dos
      bloques de masa despreciable que deslizan sin rozamiento en las ranuras
      mostradas. Una fuerza $P$ se aplica al bloque $A$ haciendo que la barra
      parta del reposo con una aceleración angular de valor $\alpha$ opuesta al
      sentido del giro de las manecillas del reloj. Calcular:

      a) Fuerza necesaria $P$.

      b) Reacción en $A$.

      <figure>
