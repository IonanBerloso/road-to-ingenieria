      <figcaption>

      Las dos barras miden lo mismo, **150 mm**, y las dos bajan **30°**: con
      la pared forman un paralelogramo con el lado **AD** de la placa. Del
      vértice **B** sube el alambre que se corta. Dibujada a escala.

      </figcaption>
      </figure>
    pide: La aceleración de los cuatro vértices de la placa y la fuerza en cada una de las dos barras.
    pasos:
      - tipo: reconocer
        pregunta: |
          Cortado el alambre, ¿cómo se mueve la placa en ese instante?
        opciones:
          - texto: En traslación curvilínea, porque las dos barras son iguales y paralelas
            correcta: true
            mensaje: |
              Eso es. $EA$ y $FD$ son iguales y paralelas, así que $EFDA$ es un
              paralelogramo y la placa no puede girar: $\alpha = 0$ y los
              cuatro vértices llevan la misma aceleración.
          - texto: Girando alrededor de la articulación A
            mensaje: |
              $A$ no está fijo: cuelga de la barra $EA$, que a su vez gira
              alrededor de $E$. El punto fijo es $E$, no $A$.
          - texto: Girando alrededor de su centro de gravedad G
            mensaje: |
              Para eso tendría que haber un momento respecto de $G$ y una
              resultante nula. Las dos barras se lo impiden: mientras midan lo
              mismo, la placa no gira.
          - texto: En traslación rectilínea vertical, como si cayera
            mensaje: |
              Traslada, sí, pero no en línea recta: cada punto describe la
              circunferencia de radio 150 mm de su barra. Por eso la
              aceleración es perpendicular a las barras y no vertical.

      - tipo: calcular
        titulo: La aceleración de los cuatro puntos
        pregunta: |
          Con $g = 9{,}81\ \text{m/s}^{2}$, ¿cuánto vale el módulo de la
          aceleración de la placa en ese instante?
        respuesta:
          tipo: magnitud
          valor: '8.496 m/s^2'
          tolerancia: 0.01
          formato: en m/s², con cuatro cifras
        distractores:
          - valor: '4.905 m/s^2'
            mensaje: |
              Es $g\sin 30^\circ$. Las barras están a 30º de la **horizontal**,
              así que la dirección perpendicular a ellas forma 30º con la
              vertical: lo que queda es $g\cos 30^\circ$.
          - valor: '9.81 m/s^2'
            mensaje: |
              Sería caída libre, y la placa no cae libre: las barras le impiden
              moverse en su propia dirección, y se llevan la componente
              $\tfrac12 Mg$ del peso.
          - valor: '7.357 m/s^2'
            mensaje: |
              Es solo la componente vertical de la aceleración,
              $g\cos^{2}30^\circ$. El módulo incluye también la componente
              horizontal de 4,25 m/s², con la que suma 8,496.
        pista: |
          Al partir del reposo, $\omega = 0$: la aceleración de cada punto es
          perpendicular a su barra. Proyecta el peso en esa dirección.
        desarrollo: |
          $$
          M a = M g\cos 30^\circ
          \;\Longrightarrow\;
          a = \frac{\sqrt{3}}{2}\,g = 8{,}496\ \text{m/s}^{2}
          $$

      - tipo: calcular
        titulo: La fuerza en la barra EA
        pregunta: |
          ¿Cuánto vale, en módulo, la fuerza que soporta la barra (1), la que
          va de $E$ a $A$?
        respuesta:
          tipo: magnitud
          valor: '47.94 N'
          tolerancia: 0.01
          formato: en newtons, con cuatro cifras
        distractores:
          - valor: '19.62 N'
            mensaje: |
              Has repartido a partes iguales entre las dos barras la fuerza
              total, $\tfrac12 Mg = 39{,}24$ N. No se reparte: la resultante
              tiene que pasar por $G$, y su recta de acción corta el lado $AD$
              **por encima** de $A$.
          - valor: '67.97 N'
            mensaje: |
              Es $Mg\cos 30^\circ$, la componente del peso perpendicular a las
              barras, que es justo la que **no** aguantan: esa es la que
              acelera la placa. Las barras se llevan $Mg\sin 30^\circ$.
          - valor: '8.699 N'
            mensaje: |
              Esa es la de la otra barra, la $FD$, que además trabaja a
              compresión. La de $EA$ es 5,5 veces mayor.
        pista: |
          Dos ecuaciones: la suma de las dos fuerzas en la dirección de las
          barras vale $\tfrac12 Mg$, y $\sum M_G = 0$ porque la placa no gira.
        desarrollo: |
          $$
          F_{EA} + F_{FD} = \tfrac12 Mg = 39{,}24\ \text{N}
          \qquad
          F_{EA}\,\overline{AG}\sin(30^\circ-\beta)
          = F_{FD}\,\overline{DG}\sin(30^\circ+\beta)
          $$

          con $\tan\beta = 200/500$. Los brazos valen 0,0384 y 0,2116 m, así
          que $F_{EA} = 5{,}51\,F_{FD}$ y

          $$
          F_{EA} = \frac{6+5\sqrt{3}}{24}\,Mg = 47{,}94\ \text{N (tracción)}
          $$

      - tipo: calcular
        titulo: La fuerza en la barra FD
        pregunta: |
          ¿Y cuánto vale, en módulo, la fuerza en la barra (2), la que va de
          $F$ a $D$?
        respuesta:
          tipo: magnitud
          valor: '8.699 N'
          tolerancia: 0.01
          formato: en newtons, con cuatro cifras
        distractores:
          - valor: '47.94 N'
            mensaje: |
              Esa es la de $EA$. Las dos no pueden ser iguales: si lo fueran,
              la resultante pasaría por el punto medio de $AD$ y daría momento
              respecto de $G$.
          - valor: '19.62 N'
            mensaje: |
              Es el reparto a partes iguales de $\tfrac12 Mg$. La ecuación de
              momentos en $G$ dice que una barra tira con 47,94 N y la otra
              empuja con 8,70 N; la suma sigue siendo 39,24 N.
        pista: |
          Sale de la misma pareja de ecuaciones. Fíjate en el signo: la
          resultante pasa por $G$, y esa recta corta la línea $AD$ fuera del
          segmento.
        desarrollo: |
          $$
          F_{FD} = \tfrac12 Mg - F_{EA}
          = \frac{5\sqrt{3}-6}{24}\,Mg = 8{,}699\ \text{N (compresión)}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: Las dos barras son iguales y paralelas, así que EFDA es un paralelogramo, la placa traslada y $\alpha = 0$.
          - texto: 'Al partir del reposo la aceleración es perpendicular a las barras: proyectando el peso, $a = g\cos 30^\circ = 8{,}50$ m/s² para los cuatro vértices.'
          - texto: 'En la dirección de las barras no hay aceleración: $F_{EA} + F_{FD} = Mg\sin 30^\circ = 39{,}24$ N, y $\sum M_G = 0$ reparte 47,94 y $-8{,}70$.'
          - texto: Como las dos barras son iguales y están igual de inclinadas, cada una soporta la mitad de la fuerza total.
            trampa: true
            mensaje: |
              Iguales y paralelas obligan a que la placa traslade, no a que las
              fuerzas sean iguales. La resultante tiene que pasar por $G$, y su
              recta corta el lado $AD$ por encima de $A$: por eso una barra
              tira y la otra empuja.
    resolucion: |
      **El movimiento.** $EA$ y $FD$ miden lo mismo y son paralelas, así que
      $EFDA$ es un paralelogramo: la placa se mueve en **traslación
      curvilínea**, sin girar. Los cuatro vértices tienen la misma aceleración,
      y al partir del reposo ($\omega = 0$) esa aceleración es perpendicular a
      las barras.

      **El módulo.** Proyectando el peso sobre esa perpendicular:

      $$
      M a = M g\cos 30^\circ
      \;\Longrightarrow\;
      a = \frac{\sqrt{3}}{2}\,g = 8{,}496\ \text{m/s}^{2}
      $$

      y en la dirección de las barras no hay aceleración, así que las dos
      fuerzas suman $Mg\sin 30^\circ = 39{,}24$ N hacia la pared.

      **El reparto entre las dos barras.** La placa no gira, luego
      $\sum M_G = 0$. Con $A = (0;0{,}2)$, $D = (0;0)$ y $G = (0{,}25;0{,}1)$,
      los brazos de las dos fuerzas respecto de $G$ valen

      $$
      \overline{AG}\sin(30^\circ-\beta) = 0{,}0384\ \text{m}
      \qquad
      \overline{DG}\sin(30^\circ+\beta) = 0{,}2116\ \text{m}
      $$

      con $\tan\beta = 2/5$, la pendiente de la diagonal. De ahí
      $F_{EA} = 5{,}51\,F_{FD}$ y, con la suma de arriba,

      $$
      F_{EA} = \frac{6+5\sqrt{3}}{24}\,Mg = 47{,}94\ \text{N}
      \qquad
      F_{FD} = \frac{5\sqrt{3}-6}{24}\,Mg = 8{,}70\ \text{N}
      $$

      **Por qué una empuja.** La resultante de las dos fuerzas vale 39,24 N,
      va hacia la pared y su recta de acción pasa por $G$. Al prolongarla,
      corta el lado $AD$ a 244 mm de $D$, fuera del segmento $AD$, que solo
      llega a 200. Con las dos fuerzas del mismo signo eso es imposible: la de
      $A$ tira (tracción) y la de $D$ empuja (compresión).
  - id: ejma12-col129-las-dos-masas-con-biela-y-muelles
    titulo: Las dos masas unidas por una biela, con dos muelles
    fuente: >-
      Ejercicio 12.9 · Tema 12, «Dinámica del sólido con movimiento plano» ·
      Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección publica el
      resultado, contra el que está contrastado el desarrollo, y se ha
      comprobado también con la resolución oficial del profesor. La tabla final
      de esa resolución trae una errata que no afecta a lo que se pide, y
      conviene saberla al comparar: da la velocidad angular de la biela como
      1,62 rad/s en el caso de biela sin masa, cuando de sus propios v_A y v_B
      salen 1,27 rad/s. El caso de 10 kg sí está bien, 1,38 rad/s.
    nivel: practica
    enunciado: |
      Las masas $A$ y $B$ de 75 kg cada una están obligadas a moverse por unas
      ranuras sin rozamiento. Están conectadas mediante una biela ligera de
      longitud $L$ = 300 mm. La masa $B$ está conectada a dos muelles de
      constante $k$ = 900 N/m. Si los muelles están en reposo cuando la biela
      está en posición vertical, calcular $v_A$ y $v_B$ cuando $A$ descienda
      una distancia de 25 mm si:

      a) La masa de la biela es despreciable.

      b) Si la masa de la biela son 10 kg.

