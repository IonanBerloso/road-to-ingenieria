      <figcaption>

      La normal es la misma fuerza en los dos sólidos, con sentidos opuestos. La del muelle va a lo largo de él. Las aceleraciones se dibujan en su sentido positivo; el signo lo dan las ecuaciones.

      </figcaption>
      </figure>

      - **El disco**: su peso, $Mg$, y la normal, $N$, hacia arriba. Sin
        rozamiento es la única fuerza del contacto: vertical, y pasa por su
        centro.
      - **La barra**: su peso, $Mg$, la normal, $N$, hacia abajo en su punto
        medio, y la fuerza del muelle en $A$. En $B$, nada: el hilo está
        cortado.
      - **La fuerza del muelle** sale del equilibrio de antes del corte, con
        el disco apoyando sobre la barra todo su peso. Momentos en $A$: el
        hilo sostenía $T_y \cdot 4R = 2Mg \cdot 2R$, o sea $T_y = Mg$; en
        vertical, el muelle pone el resto, $Mg$, y como va a 45°, también
        $Mg$ en horizontal, hacia $O$. Al cortar el hilo, el muelle no ha
        tenido tiempo de cambiar de longitud: sigue tirando igual.

      **2. Incógnitas.** Del disco, $a_{Gd,x}$, $a_{Gd,y}$ y $\alpha_d$; de la
      barra, $a_{Gb,x}$, $a_{Gb,y}$ y $\alpha_b$; y la normal, $N$: siete, con
      las tres ecuaciones de cada sólido y la del contacto.

      **3. Ecuaciones.** Con $x$ hacia la derecha, $y$ hacia arriba y los
      giros antihorarios positivos. El disco:

      $$
      0 = M\,a_{Gd,x}
      \qquad
      N - Mg = M\,a_{Gd,y}
      \qquad
      0 = I_{Gd}\,\alpha_d
      $$

      La barra, con $I_{Gb} = \tfrac{1}{12}M(4R)^{2} = \tfrac{4}{3}MR^{2}$ y el
      muelle en $A$, a $2R$ a la izquierda de su centro:

      $$
      -Mg = M\,a_{Gb,x}
      \qquad
      Mg - Mg - N = M\,a_{Gb,y}
      \qquad
      -Mg \cdot 2R = I_{Gb}\,\alpha_b
      $$

      El contacto: el disco se apoya en el centro de la barra y todo parte
      del reposo, así que los dos puntos que se tocan tienen la misma
      aceleración vertical, que es la de los dos centros:

      $$
      a_{Gd,y} = a_{Gb,y}
      $$

      **4. Resultados.** Igualando las dos aceleraciones verticales,
      $(N - Mg)/M = -N/M$:

      $$
      N = \frac{Mg}{2}
      \qquad
      a_{Gd,y} = a_{Gb,y} = -\frac{g}{2}
      $$

      $$
      a_{Gd,x} = 0
      \qquad
      \alpha_d = 0
      \qquad
      a_{Gb,x} = -g
      \qquad
      \alpha_b = -\frac{3g}{2R}
      $$

      El punto medio de la barra acelera con $-g\,\hat{\imath} - \tfrac{g}{2}\,\hat{\jmath}$,
      el centro del disco con $-\tfrac{g}{2}\,\hat{\jmath}$, y la barra gira en
      sentido horario.

      **5. Comprobación.** Por momentos de la barra en $A$, que no se han
      usado: el muelle pasa por $A$ y no da momento; el peso y la normal, a
      $2R$ a su derecha, sí. Respecto de un punto que no es $G$, al par
      $I_{Gb}\,\alpha_b$ se le suma el momento de $M\vec{a}_{Gb}$ aplicado en
      el centro de la barra:

      $$
      -(Mg + N) \cdot 2R = I_{Gb}\,\alpha_b + 2R \cdot M\,a_{Gb,y}
      $$

      A la izquierda, $-\tfrac{3}{2}Mg \cdot 2R = -3MgR$; a la derecha,
      $\tfrac{4}{3}MR^{2} \cdot \left(-\tfrac{3g}{2R}\right) + 2R \cdot M\left(-\tfrac{g}{2}\right) = -2MgR - MgR = -3MgR$.
      Lo mismo. Y el conjunto, en vertical: de fuera solo le actúan el
      muelle, $Mg$ hacia arriba, y los dos pesos, $2Mg$ hacia abajo; la
      resultante, $-Mg$, es $M\,a_{Gd,y} + M\,a_{Gb,y} = -\tfrac{Mg}{2} - \tfrac{Mg}{2}$.

      **Lo que dice el resultado.** Al cortar, el conjunto pierde el $Mg$ que
      sostenía el hilo, y esa fuerza de menos se reparte entre dos masas
      iguales: los dos bajan con $g/2$, y el disco ya solo apoya la mitad de
      su peso. En horizontal, la barra se va hacia $O$ con $g$ por debajo del
      disco, que no se mueve: el apoyo deja de estar en el centro de la
      barra. Y la barra gira deprisa: $B$ cae con
      $\tfrac{g}{2} + \tfrac{3g}{2R} \cdot 2R = 3{,}5\,g$, más que en caída
      libre, mientras $A$ sube con $3g - \tfrac{g}{2} = 2{,}5\,g$.

  - id: ejma12-col1215-el-disco-tirado-por-el-muelle
    titulo: El disco tirado por un muelle que acaba deslizando
    fuente: Ejercicio 12.15 · Tema 12, «Dinámica del sólido con movimiento plano» · Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado y el curso su resolución, y el desarrollo está contrastado contra los dos.
    nivel: practica
    antes:
      idea: |
        Un sólido con movimiento plano cumple tres ecuaciones: la resultante
        de las fuerzas es la masa por la aceleración del centro de gravedad,
        y el momento respecto de G es el momento de inercia en G por la
        aceleración angular. Un sólido que rueda sin deslizar sobre una
        superficie fija tiene el punto de contacto con velocidad nula, y su
        centro avanza lo que gira por el radio. El rozamiento entre dos
        superficies que no deslizan tiene un tope, $f\,N$; cuando deslizan,
        vale ese tope y se opone al deslizamiento.
      formula: |
        $$
        \sum\vec{F} = M\vec{a}_G,
        \qquad
        \sum M_G = I_G\,\alpha,
        \qquad
        I_G = \tfrac12 MR^{2}\ \text{(disco)}
        $$

        $$
        a_G = \alpha\,R\ \text{(rodadura)},
        \qquad
        F_r \le f\,N,
        \qquad
        \vec{a}_P = \vec{a}_G + \vec{\alpha}\times\overrightarrow{GP} - \omega^{2}\,\overrightarrow{GP}
        $$
      reconocer: |
        Antes de calcular se mira qué fuerzas no se conocen y cuántas
        ecuaciones hay para ellas.
    enunciado: |
      Un disco circular homogéneo de masa $M$ y radio $R$ se apoya verticalmente
      sobre un suelo horizontal. El centro del disco está conectado a un resorte
      de constante elástica $k$. Se comunica al resorte un alargamiento
      $\delta = Mg/k$ y, en esa posición, se suelta el sistema sin velocidad.
      Calcular la aceleración inicial del punto $A$ del disco (opuesto
      diametralmente al punto de contacto con el suelo) si el coeficiente de
      rozamiento entre disco y suelo vale f = 0.25.

      <figure>
      <svg viewBox="0 0 290 190" role="img" width="290" height="190" aria-labelledby="ma1215-t ma1215-d">
