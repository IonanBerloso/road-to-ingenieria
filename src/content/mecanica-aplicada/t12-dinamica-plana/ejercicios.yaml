      - tipo: calcular
        titulo: La aceleración del centro de gravedad
        pregunta: |
          ¿Cuánto vale el módulo de la aceleración de $G$ nada más soltar el
          sistema, con $g = 9{,}81\ \text{m/s}^{2}$?
        respuesta:
          tipo: magnitud
          valor: '4.905 m/s^2'
          tolerancia: 0.01
          formato: una aceleración, con su unidad
        distractores:
          - valor: '9.81 m/s^2'
            mensaje: |
              Eso sería caída libre. Los eslabones obligan a $G$ a moverse
              perpendicularmente a ellos, y solo la componente del peso en esa
              dirección acelera el conjunto.
          - valor: '8.496 m/s^2'
            mensaje: |
              Has proyectado el peso sobre la dirección del eslabón,
              $g\cos 30^{\circ}$. La componente que mueve el sistema es la
              perpendicular al eslabón, que con 60 grados es $g\cos 60^{\circ}$.
        pista: |
          Con $\omega = 0$, $G$ recorre un arco igual al de los eslabones, así que
          su aceleración es perpendicular a ellos. Proyecta el peso en esa
          dirección.
        desarrollo: |
          Como el conjunto traslada, todos los puntos se mueven como el extremo de
          un eslabón. La componente del peso perpendicular al eslabón es
          $2mg\cos 60^{\circ}$, y la masa que mueve es $2m$,

          $$
          a_G = g\cos 60^{\circ} = \frac{g}{2} = 4{,}905\ \text{m/s}^{2}
          $$

      - tipo: calcular
        titulo: La fuerza del eslabón (1), el de arriba
        pregunta: |
          ¿Cuánto vale el módulo de la fuerza que soporta el eslabón (1), el que
          une $A$ con $B$?
        respuesta:
          tipo: magnitud
          valor: '2.276 N'
          tolerancia: 0.01
          formato: una fuerza, con su unidad
        distractores:
          - valor: '16.99 N'
            mensaje: |
              Has repartido la fuerza total entre los dos eslabones por igual. No
              se reparten igual porque $G$ no está a la misma distancia de las dos
              líneas de acción, y ahí manda la ecuación de momentos.
          - valor: '19.62 N'
            mensaje: |
              Es el peso de una de las barras. Los eslabones no sostienen el peso,
              sino la parte de él que no se convierte en aceleración, y además
              repartida de forma muy desigual.
        pista: |
          Con $\alpha = 0$, la suma de momentos en $G$ es nula. Las dos fuerzas van
          en la dirección de los eslabones, a 60 grados de la horizontal.
        desarrollo: |
          Tomando $G$ a $(0{,}2;\ 0)$ m de $E$, con $B$ y $D$ a $\pm 0{,}4$ m,

          $$
          \sum M_G = -0{,}3732\,F_1 + 0{,}0268\,F_2 = 0
          \;\Longrightarrow\;
          F_2 = 13{,}93\,F_1
          $$

          y de las dos ecuaciones de fuerzas $F_1 + F_2 = 33{,}98$ N. De ahí

          $$
          F_1 = \frac{2\sqrt{3}-3}{4}\,mg = 2{,}276\ \text{N}
          $$

      - tipo: calcular
        titulo: La fuerza del eslabón (2), el de abajo
        pregunta: |
          ¿Y el módulo de la fuerza en el eslabón (2), el que une $C$ con $D$?
        respuesta:
          tipo: magnitud
          valor: '31.71 N'
          tolerancia: 0.01
          formato: una fuerza, con su unidad
        distractores:
          - valor: '16.99 N'
            mensaje: |
              Es la mitad de la suma. Las dos fuerzas suman $33{,}98$ N, pero el
              eslabón de abajo carga con casi catorce veces lo del de arriba.
          - valor: '39.24 N'
            mensaje: |
              Es el peso total del conjunto. La suma de las dos fuerzas de los
              eslabones no es el peso, porque el conjunto acelera.
        pista: |
          $F_2 = 13{,}93\,F_1$, y las dos suman $33{,}98$ N.
        desarrollo: |
          $$
          F_2 = \frac{3+2\sqrt{3}}{4}\,mg = 31{,}71\ \text{N}
          $$

          Las dos son de compresión, es decir empujan a la estructura hacia arriba
          y hacia la derecha a lo largo del eslabón; por eso la colección las
          imprime con signo negativo, con sus flechas dibujadas al revés.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Los eslabones son paralelos e iguales, así que ABDC es un paralelogramo y la estructura traslada, con $\alpha = 0$.'
          - texto: 'Al trasladar, $\vec{a}_G$ es perpendicular a los eslabones, y proyectando el peso, $a_G = g\cos 60^{\circ} = g/2$.'
          - texto: 'Con $\alpha = 0$, la ecuación de momentos en G queda $\sum M_G = 0$, y de ella $F_2 = 13{,}93\,F_1$.'
          - texto: 'Las dos ecuaciones de fuerzas dan $F_1 + F_2 = 33{,}98$ N, y con la de momentos, $F_1 = 2{,}28$ N y $F_2 = 31{,}71$ N.'
          - texto: Como el conjunto no gira, las dos fuerzas de los eslabones son iguales y valen la mitad del peso cada una.
            trampa: true
            mensaje: |
              No girar obliga a que los **momentos** se cancelen, no a que las
              fuerzas sean iguales, y $G$ no equidista de las dos líneas de
              acción. Y su suma tampoco es el peso, porque el conjunto acelera.
    resolucion: |
      **1. Sólidos libres.** Es un problema de dinámica de un sólido con
      movimiento plano en un instante: el dibujo lleva la estructura justo al
      soltarla, sin los eslabones, y al lado, lo que tienen que dar sus
      fuerzas.

