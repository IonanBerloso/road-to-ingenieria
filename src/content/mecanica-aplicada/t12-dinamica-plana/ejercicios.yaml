        <text x="196" y="194" font-size="9" text-anchor="middle" fill="var(--faint)">placa de 8 kg</text>
      </svg>
      <figcaption>

      Las dos barras miden lo mismo, **150 mm**, y las dos bajan **30°**: con
      la pared forman un paralelogramo con el lado **AD** de la placa. Del
      vértice **B** sube el alambre que se corta. Dibujada a escala.

      </figcaption>
      </figure>
    pide: La aceleración de los cuatro vértices de la placa y la fuerza en cada una de las dos barras.
    pasos:
      - tipo: reconocer
        pregunta: |
          Cortado el alambre, ¿cómo se mueve la placa en ese instante?
        opciones:
          - texto: En traslación curvilínea, porque las dos barras son iguales y paralelas
            correcta: true
            mensaje: |
              Eso es. $EA$ y $FD$ son iguales y paralelas, así que $EFDA$ es un
              paralelogramo y la placa no puede girar: $\alpha = 0$ y los
              cuatro vértices llevan la misma aceleración.
          - texto: Girando alrededor de la articulación A
            mensaje: |
              $A$ no está fijo: cuelga de la barra $EA$, que a su vez gira
              alrededor de $E$. El punto fijo es $E$, no $A$.
          - texto: Girando alrededor de su centro de gravedad G
            mensaje: |
              Para eso tendría que haber un momento respecto de $G$ y una
              resultante nula. Las dos barras se lo impiden: mientras midan lo
              mismo, la placa no gira.
          - texto: En traslación rectilínea vertical, como si cayera
            mensaje: |
              Traslada, sí, pero no en línea recta: cada punto describe la
              circunferencia de radio 150 mm de su barra. Por eso la
              aceleración es perpendicular a las barras y no vertical.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **la placa en el instante de
          cortar el alambre, sin las barras, con todas las fuerzas que actúan
          sobre ella, y al lado, lo que tienen que dar esas fuerzas**. Sin
          escala.
        comprueba:
          - punto: |
              **En $A$ y en $D$, la fuerza de cada barra, a lo largo de la
              barra, las dos como tracción.**
            porque: |
              Las barras no tienen masa y van articuladas en los dos extremos:
              solo tiran o empujan a lo largo de sí mismas. Cuánto vale cada
              una, y si tira o empuja, lo dicen las ecuaciones.
          - punto: |
              **El peso, $Mg$, en $G$, el centro de la placa.**
            porque: |
              La placa es delgada y uniforme: su centro de gravedad es el
              centro del rectángulo.
          - punto: |
              **En $B$, nada.**
            porque: |
              Es el instante justo después de cortar el alambre: su fuerza ya
              no está.
          - punto: |
              **Al lado, $M a_G$ en $G$, y ningún par.**
            porque: |
              La placa no gira; la dirección de $a_G$ la da la cinemática de
              $A$, que gira alrededor de $E$ partiendo del reposo.
        figura: |
          <svg viewBox="0 12 520 140" role="img" width="520" height="140" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">Sólido libre de la placa al cortar el alambre y lo que tienen que dar sus fuerzas</title>
            <desc id="dsl-d">A la izquierda, la placa rectangular de 500 por 200 milímetros, sin las barras ni el alambre. En A, el vértice de arriba a la izquierda, la fuerza de la barra EA, a lo largo de la barra: hacia la pared y hacia arriba, 30 grados sobre la horizontal. En D, el vértice de abajo a la izquierda, la de la barra FD, paralela a la anterior. En G, el centro de la placa, el peso. En B no hay nada: el alambre está cortado. Un signo igual. A la derecha, la misma placa con lo que tienen que dar esas fuerzas: en G, la masa por la aceleración de G, hacia abajo y hacia la pared, a 30 grados de la vertical. No hay par.</desc>
            <defs>
              <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
              </marker>
              <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
              </marker>
              <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
