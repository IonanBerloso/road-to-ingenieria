      </svg>
      <figcaption>

      El pasador **C** está a **L/4** del extremo **A**, y el centro de
      gravedad, en el punto medio: entre los dos hay **L/4**. Del extremo **B**
      cuelga el cable que se rompe. Dibujada a escala.

      </figcaption>
      </figure>
    pide: La aceleración del extremo B y la reacción vertical del pasador C.
    pasos:
      - tipo: reconocer
        pregunta: |
          Roto el cable, ¿dónde conviene tomar momentos y con qué momento de
          inercia?
        opciones:
          - texto: En C, que es un punto fijo de la viga, con I respecto de C
            correcta: true
            mensaje: |
              Eso es. $C$ no se mueve, así que $\sum M_C = I_C\,\alpha$ con
              $I_C = \frac{ML^{2}}{12} + M\!\left(\frac{L}{4}\right)^{2}
              = \frac{7ML^{2}}{48}$, y la reacción del pasador no da momento.
          - texto: En C, pero con el momento de inercia central I_G
            mensaje: |
              Ese es el error clásico. $\sum M_O = I_O\alpha$ solo vale con el
              momento de inercia respecto **de ese** punto; con $I_G$ sale
              $\alpha = 3g/L$ en vez de $12g/(7L)$, casi el doble.
          - texto: En G, porque ahí siempre vale la suma de momentos igual a I_G por alfa
            mensaje: |
              Vale, y es correcto, pero entonces la reacción del pasador
              aparece en la ecuación y hace falta combinarla con la de fuerzas.
              En $C$ sale $\alpha$ de una sola ecuación.
          - texto: En B, el extremo que estaba colgado
            mensaje: |
              $B$ no es un punto fijo ni es $G$, así que habría que escribir
              $\sum M_B = I_G\alpha + (\overrightarrow{BG}\times M\vec{a}_G)_z$.
              Se puede, pero no elimina ninguna incógnita.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **la viga justo al romperse el
          cable, sin el pasador, con todas las fuerzas que actúan sobre ella,
          y al lado, lo que tienen que dar esas fuerzas**. Sin escala.
        comprueba:
          - punto: |
              **En $C$, las dos componentes de la reacción del pasador, $C_x$ y
              $C_y$.**
            porque: |
              Un pasador sujeta en las dos direcciones del plano; cuánto vale
              cada una lo dicen las ecuaciones.
          - punto: |
              **El peso, $W$, en el centro $G$, a $L/4$ de $C$.**
            porque: |
              La viga es uniforme: $G$ está a $L/2$ de $A$, y $C$, a $L/4$.
          - punto: |
              **Nada en $B$.**
            porque: |
              El cable se ha roto: ya no tira.
          - punto: |
              **Al lado, $M a_G$ en $G$, perpendicular a la viga, y el par
              $I_G\,\alpha$ en el sentido en que cae $B$.**
            porque: |
              $G$ gira alrededor de $C$; al romperse el cable no hay velocidad,
              así que no hay aceleración hacia $C$.
        figura: |
