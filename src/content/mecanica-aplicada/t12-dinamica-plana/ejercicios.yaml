    pide: La constante k del muelle y la reacción entre la masa puntual y la barra, en función de M, g y L.
    pasos:
      - tipo: reconocer
        pregunta: |
          La masa puntual se **apoya** sobre la barra, sin rozamiento y sin estar
          soldada. ¿Qué se sigue de eso al quitar la barra $BD$?
        opciones:
          - texto: Que tiene su propia ecuación en vertical, y su reacción N deja de valer Mg en cuanto acelera
            correcta: true
            mensaje: |
              Eso es. La masa puntual es un sólido más, con su
              $N - Mg = M\,a_y$. Mientras el sistema esté quieto, $N = Mg$; en
              cuanto la barra sube o baja acelerando, $N$ cambia.
          - texto: Que N sigue valiendo Mg, porque la masa solo tiene su peso
            mensaje: |
              Solo si no acelerase. Al quitar $BD$ la barra gira, la masa sube con
              ella acelerando, y para acelerarla hacia arriba la barra tiene que
              empujarla con más de $Mg$.
          - texto: Que se puede tratar como parte de la barra, con su masa sumada al conjunto
            mensaje: |
              Para el giro sale lo mismo, porque la masa está justo encima del
              centro de gravedad de la barra, pero entonces no se puede contestar a
              lo que se pregunta, que es precisamente la fuerza de contacto.
          - texto: Que la masa se despega inmediatamente, porque no hay rozamiento
            mensaje: |
              El rozamiento no tiene nada que ver con despegarse. La masa se
              despegaría si la barra bajara con más de $g$; aquí la barra sube y
              la aprieta más.

      - tipo: calcular
        titulo: La constante del muelle
        pregunta: |
          Escribiendo $k = c\,Mg/L$, ¿cuánto vale $c$? Ten en cuenta que la barra
          $BD$ aguanta un esfuerzo de magnitud $Mg$.
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.01
          formato: un número, sin unidad
        distractores:
          - valor: '2.5'
            mensaje: |
              Has dejado fuera el peso de la masa puntual en la ecuación de
              momentos. Sobre la barra actúan **dos** pesos $Mg$, el suyo y el de
              la masa, los dos a $L/2$ de $O$.
          - valor: '1'
            mensaje: |
              Has olvidado la barra $BD$. Su esfuerzo $Mg$ actúa a $2L$ de $O$, o
              sea con el brazo más largo de todos, y es el término que más pesa en
              la ecuación de momentos.
          - valor: '-1'
            mensaje: |
              Ese valor sale de suponer que $BD$ tira de $B$ hacia arriba. Una
              constante de muelle negativa no existe, y eso mismo dice que $BD$
              está comprimida y empuja $B$ hacia abajo.
        pista: |
          Momentos en $O$ con el sistema en equilibrio. El muelle tiene longitud
          natural nula, así que tira de $A$ hacia abajo con $kL$.
        desarrollo: |
          Con $A$ a $L$ a la izquierda de $O$, los dos pesos a $L/2$ a la derecha y
          $B$ a $2L$,

          $$
          k L\cdot L - Mg\,\frac{L}{2} - Mg\,\frac{L}{2} - Mg\cdot 2L = 0
          \;\Longrightarrow\;
          k = \frac{3Mg}{L}
          $$

          El signo dice además que $BD$ empuja hacia abajo, o sea que trabaja a
          compresión.

      - tipo: calcular
        titulo: La aceleración angular al quitar BD
        pregunta: |
          Escribiendo $\alpha = c\,g/L$, ¿cuánto vale $c$? El momento de inercia
          del conjunto respecto de $O$ hay que montarlo.
        respuesta:
          tipo: numero
          valor: '1.6'
          tolerancia: 0.01
          formato: un número, sin unidad
        distractores:
          - valor: '2.5'
            mensaje: |
              Has quitado la masa puntual del problema. Sigue ahí, aportando su
              peso y su inercia; lo único que desaparece al cortar es la barra
              $BD$.
          - valor: '2'
            mensaje: |
              Has usado solo el $I_O$ de la barra, $ML^{2}$, olvidando el de la
              masa puntual, $M(L/2)^{2}$. El del conjunto es $\tfrac54 ML^{2}$.
        pista: |
          $I_O$ de la barra es $\tfrac{1}{12}M(3L)^{2} + M(L/2)^{2} = ML^{2}$, y la
          masa puntual añade $M(L/2)^{2}$. Momentos en $O$ con el muelle y los dos
          pesos.
        desarrollo: |
          $$
          I_O = ML^{2} + M\left(\frac{L}{2}\right)^{2} = \frac{5}{4}ML^{2}
          $$

          $$
          3MgL - Mg\frac{L}{2} - Mg\frac{L}{2} = \frac{5}{4}ML^{2}\,\alpha
          \;\Longrightarrow\;
          \alpha = \frac{8}{5}\,\frac{g}{L}
          $$

          En sentido antihorario, es decir el lado de $B$ sube.

      - tipo: calcular
        titulo: La reacción sobre la masa puntual
        pregunta: |
          Escribiendo $N = c\,Mg$, ¿cuánto vale $c$ justo después de quitar $BD$?
        respuesta:
          tipo: numero
          valor: '1.8'
          tolerancia: 0.01
          formato: un número, sin unidad
        distractores:
          - valor: '1'
            mensaje: |
              Es el valor de equilibrio, el de antes de quitar $BD$. La barra
              empieza a subir en esa zona con
              $a_y = \alpha L/2 = 0{,}8\,g$, y para acelerar así a la masa hace
              falta empujarla con $1{,}8\,Mg$.
          - valor: '0.2'
            mensaje: |
              Has restado la aceleración en vez de sumarla. El punto donde se
              apoya la masa está a la derecha de $O$ y **sube**, así que
              $N = M(g + a_y)$ con $a_y$ positiva.
        pista: |
          La masa acompaña al punto de la barra que está a $L/2$ de $O$, con
          $a_y = \alpha L/2$. Después, $N - Mg = M\,a_y$.
        desarrollo: |
          $$
          a_y = \alpha\,\frac{L}{2} = \frac{8}{5}\frac{g}{L}\cdot\frac{L}{2}
          = \frac{4}{5}g
          \qquad
          N = M\left(g + \frac{4}{5}g\right) = \frac{9}{5}Mg
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'En equilibrio, momentos en O con el muelle a $L$, los dos pesos a $L/2$ y el esfuerzo de BD a $2L$, y sale $k = 3Mg/L$ con BD comprimida.'
          - texto: 'Quitada BD, $I_O = ML^{2} + M(L/2)^{2} = \tfrac54 ML^{2}$, contando la barra y la masa puntual.'
          - texto: 'Momentos en O con lo que queda, $3MgL - MgL = \tfrac54 ML^{2}\alpha$, y $\alpha = \tfrac85 g/L$ en sentido antihorario.'
          - texto: 'La masa puntual sube con $a_y = \alpha L/2 = \tfrac45 g$, y de su ecuación en vertical $N = \tfrac95 Mg$.'
          - texto: Como la masa puntual solo se apoya, su reacción sigue valiendo Mg mientras no se despegue.
            trampa: true
            mensaje: |
              La reacción vale $Mg$ solo si la masa no acelera. Aquí sube con
              $\tfrac45 g$, y la barra tiene que empujarla casi el doble de fuerte
              que en equilibrio. Despegarse es otra cosa, y pasaría si bajara con
              más de $g$.
    resolucion: |
      **La estática.** El muelle tiene longitud natural nula y mide $L$, así que
      tira de $A$ hacia abajo con $kL$. La masa puntual se apoya justo encima del
      centro de gravedad de la barra, los dos a $L/2$ a la derecha de $O$.
      Tomando momentos en $O$,

      $$
      kL^{2} = Mg\frac{L}{2} + Mg\frac{L}{2} + Mg\cdot 2L
      \;\Longrightarrow\;
      k = \frac{3Mg}{L}
      $$

      donde el esfuerzo de $BD$ se ha puesto empujando $B$ hacia abajo. Que salga
      una $k$ positiva confirma ese sentido; con $BD$ tirando hacia arriba saldría
      negativa, que es imposible.

      **La dinámica.** Al eliminar $BD$ quedan el muelle, los dos pesos y la
      reacción de la masa. Con

      $$
      I_O = \frac{1}{12}M(3L)^{2} + M\left(\frac{L}{2}\right)^{2}
      + M\left(\frac{L}{2}\right)^{2} = \frac{5}{4}ML^{2}
      $$

      y momentos en el punto fijo $O$,

      $$
      3MgL - MgL = \frac{5}{4}ML^{2}\alpha
      \;\Longrightarrow\;
      \alpha = \frac{8}{5}\frac{g}{L}
      $$

      **La reacción.** La masa acompaña al punto de la barra que está bajo ella,
      que sube con $a_y = \alpha L/2 = \tfrac45 g$:

      $$
      N - Mg = M\,\frac{4}{5}g \;\Longrightarrow\; N = \frac{9}{5}Mg
      $$

      Casi el doble que en equilibrio, y esa es toda la gracia del problema.

  - id: ejma12-col1217-el-disco-y-la-barra-en-la-guia-vertical
    titulo: El disco que rueda arrastrado por una barra en una guía vertical
    fuente: Ejercicio 12.17 · Tema 12, «Dinámica del sólido con movimiento plano» · Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado y el curso su resolución, y el desarrollo está contrastado contra los dos. En el apartado a) la resolución del curso encuadra un resultado que sus propias ecuaciones no dan; el desarrollo de aquí coincide con el resultado impreso en la colección.
    nivel: practica
    enunciado: |
      Un disco homogéneo de masa $M$ y radio $R$ contacta sin deslizamiento sobre
      un suelo horizontal. Una barra homogénea $AB$ también de masa $M$ y de
      longitud $L$ articula en el centro geométrico del disco y en una corredera
      sin masa que desliza sin rozamiento en una guía vertical fija. El conjunto
      se mantiene inmóvil en la posición indicada en la figura, esto es, formando
      la barra $AB$ un ángulo de 60º con la guía vertical. Dejado el conjunto en
      libertad, se inicia el movimiento. Calcular:

      a) Velocidad angular de rotación del disco en el instante en el que la barra
      $AB$ se coloca en posición vertical.

      b) Diagramas del cuerpo libre en la posición inicial.

      c) Aceleración angular del disco en el instante de inicio del movimiento.

