        <line x1="343.3" y1="100" x2="343.3" y2="60" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="349.3" y="70" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">Ma<tspan font-size="7.5" dy="2.5">G</tspan></text>
