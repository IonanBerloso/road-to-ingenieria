        <desc id="ma1218-d">Un disco 2 de radio R y centro fijo O gira impulsado por un par motor T. En el punto A de su periferia, el más alto, se articula la biela 3 de longitud L, que sube hacia la derecha formando 30 grados con la horizontal hasta el punto B, centro de gravedad del conjunto pieza-mesa 4, que desliza sobre el suelo horizontal hacia la izquierda. Sobre la mesa, la muela 5 aprieta hacia abajo con una fuerza F.</desc>
