            <text x="10" y="294" font-size="9" text-anchor="start" fill="var(--faint)">(3)</text>
          </svg>

      - tipo: calcular
        titulo: La aceleración angular de la barra CD
        pregunta: |
          ¿Cuánto vale $\alpha_3$, la aceleración angular de la barra $CD$, en
          valor absoluto?
        respuesta:
          tipo: numero
          valor: '1.8'
          tolerancia: 0.01
          formato: un número, en rad/s²
        distractores:
          - valor: '1.2'
            mensaje: |
              Eso es $\omega_3$, la velocidad angular, que sale de
              $v_C = v_B = \omega_1\cdot AB = 1{,}2$ m/s repartida en el metro
              de $CD$. La aceleración angular sale de la componente vertical de
              $\vec{a}_C$.
          - valor: '3'
            mensaje: |
              Es $\alpha_1$, la de la barra motriz, o el módulo de $\vec{a}_B$.
              Lo que hay que igualar es solo la componente **vertical** de
              $\vec{a}_C$, que vale 1,8 m/s².
          - valor: '1.44'
            mensaje: |
              Es la componente **horizontal** de $\vec{a}_C$, que vale
              $\omega_3^{2}\,CD$ y no contiene a $\alpha_3$. La que la da es la
              vertical, $\alpha_3\,CD$.
        pista: |
          $\vec{a}_C = \vec{a}_B + \vec{\alpha}_2\times\overrightarrow{BC}$, y
          como $BC$ es vertical, $\alpha_2$ solo aporta componente horizontal:
          la vertical de $\vec{a}_C$ es la de $\vec{a}_B$.
        desarrollo: |
          $$
          a_{By} = \alpha_1\,AB = 3\cdot 0{,}6 = 1{,}8\ \text{m/s}^{2}
          = a_{Cy} = \alpha_3\,CD
          \;\Longrightarrow\;
          \alpha_3 = 1{,}8\ \text{rad/s}^{2}
          $$

      - tipo: calcular
        titulo: La componente horizontal de la reacción en A
        pregunta: |
          ¿Cuánto vale $A_x$?
        respuesta:
          tipo: magnitud
          valor: '7.92 N'
          tolerancia: 0.01
          formato: en newtons, con tres cifras
        distractores:
          - valor: '4.8 N'
            mensaje: |
              Es $M_1 a_{G1x}$ a secas: te has dejado la fuerza que la barra
              $BC$ hace sobre la $AB$ en $B$, 3,12 N hacia la izquierda, que $A$
              también tiene que vencer.
          - valor: '6.96 N'
            mensaje: |
              Esa es $D_x$. Las dos reacciones horizontales se parecen pero no
              son iguales: por la barra $CD$ pasa además la inercia de sus
              6 kg.
          - valor: '12.72 N'
            mensaje: |
              Has usado la aceleración de $B$ en vez de la de $G_1$. El centro
              de la barra está a $0{,}3$ m de $A$, la mitad, así que
              $a_{G1x} = \omega_1^{2}\cdot 0{,}3 = 1{,}2$ m/s².
        pista: |
          Con $\omega_1 = 2$, la aceleración de $G_1$ tiene componente normal
          $\omega_1^{2}(AB/2) = 1{,}2$ m/s² hacia $A$. Después,
          $A_x - B_x = M_1 a_{G1x}$, con $B_x$ la fuerza que la barra 1 hace
          sobre la 2.
        desarrollo: |
          $$
          a_{G1x} = \omega_1^{2}\,\frac{AB}{2} = 1{,}2\ \text{m/s}^{2}
          \qquad
          A_x = M_1 a_{G1x} + B_x = 4{,}8 + 3{,}12 = 7{,}92\ \text{N}
          $$

      - tipo: calcular
        titulo: La componente vertical de la reacción en A
        pregunta: |
          ¿Y cuánto vale $A_y$?
        respuesta:
          tipo: magnitud
          valor: '110.7 N'
          tolerancia: 0.01
          formato: en newtons, con cuatro cifras
        distractores:
          - valor: '85.5 N'
            mensaje: |
              Es lo que sale girando en sentido antihorario. Las flechas de la
              figura dicen que $B$ y $C$ **suben**, o sea giro horario, y eso
              cambia el signo de todos los términos con $\alpha$.
          - valor: '39.24 N'
            mensaje: |
              Es el peso de la barra $AB$ sola. Por el apoyo $A$ pasa además
              todo lo que le transmite la barra $BC$, que a su vez carga con
              parte de la $CD$.
          - valor: '127.5 N'
            mensaje: |
              Es el peso de las tres barras juntas, que sería el reparto
              estático total entre $A$ y $D$. Ni el sistema está en equilibrio
              ni $A$ se lleva todo.
        pista: |
          Sube por la cadena. Momentos en $G_3$ y la vertical de la barra 3 dan
          $C_y$; la ecuación vertical
          de la barra 2 da $B_y$; y la vertical de la barra 1, $A_y$.
        desarrollo: |
          $$
          C_y = 33{,}03\ \text{N}
          \qquad
          B_y = 67{,}86\ \text{N}
          $$

          $$
          A_y = M_1 a_{G1y} + M_1 g + B_y = 3{,}6 + 39{,}24 + 67{,}86
          = 110{,}7\ \text{N}
          $$

      - tipo: calcular
        titulo: La componente vertical de la reacción en D
        pregunta: |
          ¿Cuánto vale $D_y$?
        respuesta:
          tipo: magnitud
          valor: '31.23 N'
          tolerancia: 0.01
          formato: en newtons, con cuatro cifras
        distractores:
          - valor: '27.63 N'
            mensaje: |
              Otra vez el sentido de giro cambiado. Con las flechas de la
              figura —$C$ subiendo— salen 31,23 N; con el contrario, 27,63.
          - valor: '58.86 N'
            mensaje: |
              Es el peso de la barra $CD$ entera. El apoyo $D$ solo aguanta una
              parte: la otra la sostiene la articulación $C$.
          - valor: '29.43 N'
            mensaje: |
              Es medio peso de la barra $CD$, que sería el reparto si estuviera
              en equilibrio. Faltan los términos de inercia: la mitad de
              $M_3 a_{G3y}$, 2,7 N, menos $I_3|\alpha_3|/CD$, 0,9 N.
        pista: |
          Momentos en $G_3$ para la barra 3: $\frac{CD}{2}(D_y - C_y) = I_3\alpha_3$,
          con $\alpha_3 = -1{,}8\ \text{rad/s}^{2}$ porque es horaria, y en
          vertical $D_y + C_y = M_3 g + M_3 a_{G3y}$.
        desarrollo: |
          $$
          D_y - C_y = \frac{2 I_3 \alpha_3}{CD} = -1{,}8\ \text{N}
          \qquad
          D_y + C_y = 58{,}86 + 5{,}4 = 64{,}26\ \text{N}
          $$

          $$
          D_y = 31{,}23\ \text{N}
          \qquad
          C_y = 33{,}03\ \text{N}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Cinemática: $\omega_2 = 0$ y $\omega_3 = 1{,}2$ rad/s; después $\alpha_2 = 1{,}92$ y $\alpha_3 = 1{,}8$ rad/s², las dos en sentido horario.'
          - texto: 'Se empieza por la barra 3: su ecuación de momentos en $G_3$ y la vertical solo tienen $C_y$ y $D_y$, y dan 33,03 N y 31,23 N.'
          - texto: 'Subiendo por la cadena, la barra 2 da $B_y = 67{,}86$ N y la barra 1 cierra con $A_x = 7{,}92$ N y $A_y = 110{,}7$ N.'
          - texto: Como en A hay un motor que da un par, la ecuación de momentos de la barra 1 hace falta para calcular las reacciones.
            trampa: true
            mensaje: |
              Es al revés: esa ecuación es la que **sobra** para las
              reacciones, porque introduce una incógnita nueva, el par. Sirve
              para calcular el par una vez que todo lo demás está resuelto
              —sale $-53{,}9$ N m—, no para llegar a las reacciones.
    resolucion: |
      **1. Sólidos libres.** Es un problema de dinámica de un sistema de
      sólidos con movimiento plano, en un instante: el dibujo lleva las tres
      barras por separado y, al lado de cada una, lo que tienen que dar sus
      fuerzas.

