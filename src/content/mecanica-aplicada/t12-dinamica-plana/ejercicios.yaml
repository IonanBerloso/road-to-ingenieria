      <figcaption>

      Las barras no tienen masa y van articuladas en sus dos extremos: tiran o empujan a lo largo de sí mismas. Se dibujan las dos como tracción; el signo lo dicen las ecuaciones. A la derecha no hay par: la placa no gira.

      </figcaption>
      </figure>

      - **En A y en D**, las fuerzas de las barras, $F_{EA}$ y $F_{FD}$, a lo
        largo de ellas; se toman las dos como tracción, tirando de la placa
        hacia la pared.
      - **En G**, el peso, $Mg = 8 \cdot 9{,}81 = 78{,}48$ N.
      - **En B**, nada: el alambre está cortado.
      - **Al lado**, $M a_G$, y ningún par: $EA$ y $FD$ son iguales y
        paralelas, así que $EFDA$ es un paralelogramo, la placa traslada y
        $\alpha = 0$.

      **2. Incógnitas.** El módulo de la aceleración, $a$, y las dos fuerzas,
      $F_{EA}$ y $F_{FD}$: tres, con las tres ecuaciones del movimiento
      plano. La dirección de la aceleración la da la cinemática.

      **3. Ecuaciones.** Al cortar el alambre todo está en reposo,
      $\omega = 0$: $A$, que gira alrededor de $E$, solo tiene aceleración
      tangente, perpendicular a la barra. Como la placa traslada, es la de
      todos sus puntos, también la de $G$: a 30° de la vertical, hacia abajo
      y hacia la pared.

      Con el eje $n$ en esa dirección, el eje $t$ a lo largo de las barras,
      de la pared hacia la placa, y los momentos antihorarios positivos:

      $$
      Mg\cos 30^\circ = M a
      \qquad
      Mg\sin 30^\circ - F_{EA} - F_{FD} = 0
      $$

      $$
      -F_{EA}\,\overline{AG}\sin(30^\circ-\beta) - F_{FD}\,\overline{DG}\sin(30^\circ+\beta) = I_G\,\alpha = 0
      $$

      donde $\beta$ es la inclinación de la diagonal, $\tan\beta = 200/500$.
      Tomadas como tracción, las dos fuerzas hacen girar la placa en sentido
      horario respecto de $G$.

      **4. Resultados.**

      $$
      a = 9{,}81 \cdot 0{,}86603 = 8{,}496\ \text{m/s}^{2}
      $$

      la misma para $A$, $B$, $C$ y $D$. Los brazos valen

      $$
      \overline{AG}\sin(30^\circ-\beta) = 0{,}26926 \cdot 0{,}14261 = 0{,}0384\ \text{m}
      \qquad
      \overline{DG}\sin(30^\circ+\beta) = 0{,}26926 \cdot 0{,}78587 = 0{,}2116\ \text{m}
      $$

      así que $F_{EA} = -5{,}511\,F_{FD}$, y con
      $F_{EA} + F_{FD} = 78{,}48 \cdot 0{,}5 = 39{,}24$ N:

      $$
      F_{EA} = \frac{6+5\sqrt{3}}{24}\,Mg = 47{,}94\ \text{N}
      \qquad
      F_{FD} = -\frac{5\sqrt{3}-6}{24}\,Mg = -8{,}70\ \text{N}
      $$

      La barra $EA$ trabaja a tracción y la $FD$, a compresión.

      **5. Comprobación.** Por momentos en $D$ y en $A$, que no se han usado:
      cada uno deja fuera una de las dos fuerzas y da la otra sola. Respecto
      de un punto que no es $G$, al par de inercia, que es nulo, se le suma
      el momento de $M a_G$ aplicado en $G$. Con
      $M a = 8 \cdot 8{,}49571 = 67{,}9657$ N:

      $$
      \sum M_D:\quad 0{,}2\cos 30^\circ\,F_{EA} - 0{,}25\,Mg = -(0{,}25\cos 30^\circ - 0{,}1\sin 30^\circ)\,M a
      $$

      $$
      0{,}17321\,F_{EA} = 19{,}62 - 0{,}166506 \cdot 67{,}9657 = 8{,}303
      \qquad
      F_{EA} = 8{,}303/0{,}17321 = 47{,}94\ \text{N}
      $$

      $$
      \sum M_A:\quad -0{,}2\cos 30^\circ\,F_{FD} - 0{,}25\,Mg = -(0{,}25\cos 30^\circ + 0{,}1\sin 30^\circ)\,M a
      $$

      $$
      -0{,}17321\,F_{FD} = 19{,}62 - 0{,}266506 \cdot 67{,}9657 = 1{,}5067
      \qquad
      F_{FD} = 1{,}5067/(-0{,}17321) = -8{,}70\ \text{N}
      $$

      Las dos, como antes, y suman $47{,}94 - 8{,}70 = 39{,}24$ N, lo que pide
      la ecuación a lo largo de las barras.

      **Lo que dice el resultado.** Las dos barras son iguales, pero no se
      reparten la carga. La resultante de sus fuerzas, 39,24 N en la
      dirección de las barras, tiene que pasar por $G$ para que la placa no
      gire, y su recta corta la de $AD$ a 244 mm de $D$: por encima de $A$.

