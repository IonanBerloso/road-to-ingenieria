      <figcaption>

      Los eslabones no tienen masa y van articulados en sus dos extremos: tiran o empujan a lo largo de sí mismos. Se dibujan los dos empujando; el signo lo dicen las ecuaciones. A la derecha no hay par: la estructura no gira.

      </figcaption>
      </figure>

      - **En B y en D**, las fuerzas de los eslabones, $F_1$ y $F_2$, a lo
        largo de ellos, a 60° de la horizontal; se toman las dos como
        compresión, empujando hacia arriba y hacia la derecha.
      - **En G**, el peso de las dos barras, $2mg = 4 \cdot 9{,}81 = 39{,}24$ N.
      - **Al lado**, $2m\,a_G$, y ningún par: los eslabones son iguales y
        paralelos, así que $ABDC$ es un paralelogramo, la estructura traslada
        y $\alpha = 0$.

      **2. Incógnitas.** El módulo de la aceleración, $a_G$, y las dos
      fuerzas, $F_1$ y $F_2$: tres, con las tres ecuaciones del movimiento
      plano. La dirección de la aceleración la da la cinemática.

      **3. Ecuaciones.** Al soltar todo está en reposo, $\omega = 0$: $B$,
      que gira alrededor de $A$, solo tiene aceleración tangente,
      perpendicular al eslabón. Como la estructura traslada, es la de todos
      sus puntos, también la de $G$: 30° por debajo de la horizontal,
      alejándose de la pared.

      Con el eje $n$ en esa dirección, el eje $t$ a lo largo de los
      eslabones, hacia arriba, y los momentos antihorarios positivos. Desde
      $G$, $B$ está en $(-0{,}2;\ 0{,}4)$ m y $D$ en $(-0{,}2;\ -0{,}4)$:

      $$
      2mg\cos 60^\circ = 2m\,a_G
      \qquad
      F_1 + F_2 - 2mg\sin 60^\circ = 0
      $$

      $$
      -F_1\,(0{,}4\cos 60^\circ + 0{,}2\sin 60^\circ) + F_2\,(0{,}4\cos 60^\circ - 0{,}2\sin 60^\circ) = I_G\,\alpha = 0
      $$

      **4. Resultados.**

      $$
      a_G = 9{,}81 \cdot 0{,}5 = 4{,}905\ \text{m/s}^{2}
      \qquad
      F_1 + F_2 = 39{,}24 \cdot 0{,}86603 = 33{,}983\ \text{N}
      $$

      Los brazos valen 0,37321 y 0,02679 m, así que
      $F_2 = 0{,}37321/0{,}02679\,F_1 = 13{,}93\,F_1$ y

      $$
      F_1 = \frac{2\sqrt{3}-3}{4}\,mg = 2{,}276\ \text{N}
      \qquad
      F_2 = \frac{3+2\sqrt{3}}{4}\,mg = 31{,}71\ \text{N}
      $$

      con $m = 2$ kg. Las dos salen positivas: los dos eslabones trabajan a
      compresión.

      **5. Comprobación.** Por momentos en $D$ y en $B$, que no se han usado:
      cada uno deja fuera una de las dos fuerzas y da la otra sola. Respecto
      de un punto que no es $G$, al par de inercia, que es nulo, se le suma
      el momento de $2m\vec{a}_G$ aplicado en $G$. Con
      $2m\,a_G = 19{,}62$ N, sus componentes son
      $19{,}62 \cdot 0{,}86603 = 16{,}991$ y $-9{,}81$ N:

      $$
      \sum M_D:\quad -0{,}8\cos 60^\circ\,F_1 - 0{,}2 \cdot 39{,}24 = 0{,}2 \cdot (-9{,}81) - 0{,}4 \cdot 16{,}991 = -8{,}7584
      $$

      $$
      F_1 = (8{,}7584 - 7{,}848)/0{,}4 = 2{,}276\ \text{N}
      $$

      $$
      \sum M_B:\quad 0{,}8\cos 60^\circ\,F_2 - 0{,}2 \cdot 39{,}24 = 0{,}2 \cdot (-9{,}81) + 0{,}4 \cdot 16{,}991 = 4{,}8344
      $$

      $$
      F_2 = (4{,}8344 + 7{,}848)/0{,}4 = 31{,}71\ \text{N}
      $$

      Las dos, como antes, y suman 33,98 N, lo que pide la ecuación a lo
      largo de los eslabones.

      **Lo que dice el resultado.** Los dos eslabones son iguales, pero el de
      abajo carga casi catorce veces más que el de arriba. La resultante de
      sus dos fuerzas, 33,98 N en la dirección de los eslabones, tiene que
      pasar por $G$ para que la estructura no gire, y la recta paralela a los
      eslabones que pasa por $G$ queda a 27 mm de la de $D$ y a 373 mm de la
      de $B$. Y las dos juntas no aguantan el peso: el conjunto cae con
      $g/2$, sea cual sea la longitud de los eslabones.

  - id: ejma12-col1213-las-dos-barras-soldadas-en-uve
    titulo: Dos barras soldadas en uve que se sueltan desde el reposo
    fuente: Ejercicio 12.13 · Tema 12, «Dinámica del sólido con movimiento plano» · Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado y el curso su resolución, y el desarrollo está contrastado contra los dos.
    nivel: practica
    antes:
      idea: |
        Un sólido con movimiento plano cumple tres ecuaciones: la resultante
        de las fuerzas es la masa por la aceleración del centro de gravedad,
        y el momento respecto de G es el momento de inercia en G por la
        aceleración angular. Respecto de otro punto, al par de inercia se le
        suma el momento del vector masa por aceleración de G, aplicado en G.
        El momento de inercia de un conjunto es la suma de los de sus piezas
        respecto del mismo punto. Un punto que gira alrededor de un punto
        fijo, a una distancia r de él, tiene una aceleración tangente a su
        trayectoria y otra hacia el punto fijo.
      formula: |
        $$
        \sum\vec{F} = M\vec{a}_G,
        \qquad
        \sum M_G = I_G\,\alpha,
        \qquad
        \sum M_P = I_G\,\alpha + M\,a_G\,d
        $$

        $$
        a_t = \alpha\,r,
        \qquad
        a_n = \omega^{2} r,
        \qquad
        I_G = \tfrac{1}{12} ML^{2}\ \text{(barra)},
        \qquad
        I_O = I_G + M\,d^{2}
        $$
      reconocer: |
        Antes de calcular se mira qué punto del conjunto no se mueve y dónde
        está G respecto de él.
    enunciado: |
      Dos barras de 3 kg $AB$ y $AC$ están soldadas (rígidamente unidas) como se
      muestra en la figura. Si ambas se sueltan en reposo, hallar inmediatamente
      antes del inicio del movimiento:

      1) Aceleración del punto $B$.

      2) Reacción en $A$.

