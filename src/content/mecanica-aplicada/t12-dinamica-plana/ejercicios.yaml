    pide: La aceleración angular de la barra y las dos componentes de la reacción en C.
    pasos:
      - tipo: reconocer
        pregunta: |
          $C$ es una articulación fija y $G$ está $r$ por debajo. ¿Con qué
          momento de inercia hay que escribir $\sum M_C = I\,\alpha$?
        opciones:
          - texto: Con I_C = I_G + m r cuadrado, o sea 0,4725 kg m²
            correcta: true
            mensaje: |
              Eso es. $C$ es punto fijo, así que vale $\sum M_C = I_C\alpha$,
              pero con el momento de inercia trasladado a $C$ por Steiner:
              $\frac{4\cdot 0{,}9^{2}}{12} + 4\cdot 0{,}225^{2} = 0{,}4725$.
          - texto: Con I_G = m L cuadrado partido por doce, que es 0,27 kg m²
            mensaje: |
              $I_G$ solo vale en $G$ o acompañado del momento de $M\vec{a}_G$.
              Usarlo tal cual en $C$ da $\alpha = -187{,}5$ en vez de
              $-107{,}1$ rad/s².
          - texto: Con I = m L cuadrado partido por tres, la de una barra que gira por un extremo
            mensaje: |
              Esa es la de una barra articulada en su **extremo**, y aquí $C$
              está a $L/4$ del extremo, no en él. Steiner lo resuelve con la
              distancia real.
          - texto: Con I = m L cuadrado, concentrando toda la masa en el extremo B
            mensaje: |
              La masa está repartida a lo largo de la barra, no concentrada en
              un punto. Concentrarla en $B$ multiplicaría la inercia por más de
              seis.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **la barra en el instante de
          aplicar $P$, sin la articulación, con todas las fuerzas que actúan
          sobre ella, y al lado, lo que tienen que dar esas fuerzas**. Sin
          escala.
        comprueba:
          - punto: |
              **En $C$, las dos componentes de la reacción, $C_x$ y $C_y$, en su
              sentido positivo.**
            porque: |
              Una articulación sujeta en las dos direcciones del plano; cuánto
              vale cada una lo dicen las ecuaciones.
          - punto: |
              **El peso, $Mg$, en $G$, $r$ por debajo de $C$.**
            porque: |
              La barra es uniforme: $G$ está a media barra, y $C$, a $L/4$ del
              extremo de arriba.
          - punto: |
              **En $B$, $P$, horizontal y hacia la izquierda, a $L/2 + r$ de
              $C$.**
            porque: |
              Es la fuerza del enunciado, en el extremo de abajo; su brazo
              respecto de $C$ es la distancia de $C$ a $B$.
          - punto: |
              **Al lado, $M a_G$ en $G$ y el par $I_G\,\alpha$.**
            porque: |
              Es lo que tienen que dar las fuerzas; la dirección de $a_G$ la da
              la cinemática de un punto que gira alrededor de $C$.
        figura: |
          <svg viewBox="4 18 270 184" role="img" width="270" height="184" aria-labelledby="dsl-t dsl-d">
