      - tipo: calcular
        titulo: La energía cinética inicial
        pregunta: |
          ¿Cuánto vale la energía cinética del sistema en el estado inicial?
        respuesta:
          tipo: magnitud
          valor: '26.04 J'
          tolerancia: 0.01
          formato: una energía, con su unidad
        distractores:
          - valor: '15.63 J'
            mensaje: |
              Es solo la del disco, $\tfrac12 I_O\omega^{2}$. La barra también se
              mueve, aunque su extremo $B$ esté instantáneamente parado.
          - valor: '10.42 J'
            mensaje: |
              Es solo la de la barra. Falta la del disco, que gira alrededor de su
              punto fijo con $\tfrac12\left(\tfrac12 MR^{2}\right)\omega^{2}$.
          - valor: '46.88 J'
            mensaje: |
              Has usado $\tfrac12 M v_A^{2} = 31{,}25$ J para la barra, como si
              toda su masa fuera con el punto $A$. Su centro va a la mitad de
              velocidad, y además hay que sumar su término de rotación: son
              $10{,}42$ J.
        pista: |
          El disco gira alrededor del punto fijo $O$. Para la barra, $B$ es su
          centro instantáneo, así que $\omega_{\text{barra}} = v_A/L$ y
          $v_G = \omega_{\text{barra}}\,L/2$.
        desarrollo: |
          $$
          T_{\text{disco}} = \frac{1}{2}\cdot\frac{MR^{2}}{2}\,\omega^{2} = 15{,}625\ \text{J}
          $$

          Con $v_A = \omega R = 2{,}5$ m/s y $\omega_{\text{barra}} = 2{,}5$ rad/s,

          $$
          T_{\text{barra}} = \frac{1}{2}M v_G^{2} + \frac{1}{2}\frac{ML^{2}}{12}\omega_{\text{barra}}^{2}
          = 7{,}81 + 2{,}60 = 10{,}42\ \text{J}
          $$

          En total, $T_1 = 26{,}04$ J, o sea $\tfrac{5}{12}MR^{2}\omega^{2}$.

      - tipo: calcular
        titulo: La velocidad angular tras un cuarto de vuelta
        pregunta: |
          ¿Cuánto vale $\omega$ cuando el disco ha girado 90º en sentido horario,
          en rad/s? Toma $g = 9{,}81\ \text{m/s}^{2}$.
        respuesta:
          tipo: numero
          valor: '4.11'
          tolerancia: 0.03
          formato: un número, en rad/s
        distractores:
          - valor: '1.3'
            mensaje: |
              Es el valor que imprime la colección, y no se reproduce con estos
              datos por ningún camino. La resolución del curso publica $4{,}11$, que
              es lo que da el balance de energía y lo que sale también integrando
              el movimiento.
          - valor: '6.6'
            mensaje: |
              Has dejado el resorte fuera del balance. Se alarga de $R$ a
              $\sqrt5 R$, así que se lleva $50$ J, casi todo lo que libera la barra
              al bajar, $55{,}6$ J.
          - valor: '1.73'
            mensaje: |
              Has olvidado la energía cinética inicial. El disco ya venía girando a
              5 rad/s, y esos $26$ J entran en el balance.
        pista: |
          Al girar 90º, $G$ baja de $4R$ a $2R + \tfrac{\sqrt3}{2}R$, el centro del
          disco no se mueve y el resorte pasa de $R$ a $\sqrt5 R$. Y en esa
          posición la barra no gira.
        desarrollo: |
          Con la barra a 30º de la vertical, $\omega_{\text{barra}} = 0$ y todos
          los puntos de la barra van con $v = \omega R$, así que
          $T_2 = \tfrac34 MR^{2}\omega^{2}$. El balance $T_1 + V_1 = T_2 + V_2$ da

          $$
          26{,}04 + 294{,}3 + 12{,}5 = \frac{3}{4}MR^{2}\omega^{2} + 238{,}68 + 62{,}5
          $$

          $$
          \omega = 4{,}11\ \text{rad/s}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'No hay fuerzas no conservativas, así que $T_1 + V_1 = T_2 + V_2$ contando la energía del resorte como $\tfrac12 k l^{2}$.'
          - texto: 'En el estado inicial B es el centro instantáneo de la barra, y sale $T_1 = \tfrac{5}{12}MR^{2}\omega_0^{2} = 26{,}04$ J.'
          - texto: 'Tras 90º, el punto A queda a un lado, la barra forma 30º con la vertical, G baja de $4R$ a $2R + \tfrac{\sqrt3}{2}R$ y el resorte pasa de $R$ a $\sqrt5 R$.'
          - texto: 'En esa posición la barra no gira, así que $T_2 = \tfrac34 MR^{2}\omega^{2}$, y del balance $\omega = 4{,}11$ rad/s.'
          - texto: Como el disco gira alrededor de su centro fijo, su energía potencial y la del resorte no cambian.
            trampa: true
            mensaje: |
              La del disco no cambia, porque su centro está fijo. La del resorte
              **sí**, y mucho, porque está atado a un punto de la periferia que
              gira con él: pasa de $12{,}5$ J a $62{,}5$ J.
    resolucion: |
      **1. Posiciones.** Es un problema de energía entre dos posiciones de un
      mecanismo con un grado de libertad. El dibujo lleva las dos, con las
      velocidades:

