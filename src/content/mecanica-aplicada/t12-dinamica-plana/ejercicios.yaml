    pide: La velocidad y la aceleración angular de la biela y el par motor sobre el disco.
    pasos:
      - tipo: reconocer
        pregunta: |
          La muela aprieta la mesa con $F = 1$ kN hacia abajo. ¿Cómo entra esa
          fuerza en el cálculo del par motor $T$?
        opciones:
          - texto: 'No entra: es vertical y el suelo no roza, así que solo cambia la normal'
            correcta: true
            mensaje: |
              Eso es. La mesa solo acelera en horizontal, y en su ecuación
              horizontal solo aparece la biela. $F$ y el peso se van con la normal
              del suelo, que sale $1{,}074$ kN en vez de $74$ N, y el par motor no
              se entera.
          - texto: Entra multiplicada por el coeficiente de rozamiento con el suelo
            mensaje: |
              El enunciado dice expresamente que se desprecie el rozamiento entre
              la mesa y el suelo. Si lo hubiera, sí entraría por ahí, y sería el
              término dominante.
          - texto: Entra sumada a la fuerza de la biela, porque las dos actúan sobre la mesa
            mensaje: |
              Actúan las dos, pero en direcciones distintas. La ecuación que da la
              fuerza de la biela es la **horizontal**, y $F$ es vertical.
          - texto: Entra a través del par que hace respecto de B
            mensaje: |
              $F$ pasa por la vertical del contacto y la mesa no gira; su ecuación
              de momentos solo sirve para localizar la normal, no para el par
              motor.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta, y es el apartado b): **la mesa, la
          biela y el disco por separado, cada uno con todas las fuerzas que
          actúan sobre él, y al lado, lo que tienen que dar esas fuerzas**.
          Sin escala.
        comprueba:
          - punto: |
              **En la biela, una fuerza en cada extremo, a lo largo de ella,
              iguales y opuestas, y nada al otro lado del igual.**
            porque: |
              No tiene masa y va articulada en sus dos extremos, sin cargas
              entre ellos: solo tira o empuja a lo largo de sí misma.
          - punto: |
              **En la mesa, $F$ y el peso, hacia abajo, la normal del suelo,
              hacia arriba, y en $B$ la fuerza de la biela, a 30° de la
              horizontal.**
            porque: |
              Lo que la biela le hace a la mesa es lo contrario de lo que la
              mesa le hace a la biela. Dónde actúa la normal lo dice la
              ecuación de momentos de la mesa.
          - punto: |
              **En el disco, la fuerza de la biela en $A$, la reacción en $O$
              con sus dos componentes, el peso y el par motor $T$.**
            porque: |
              El centro está fijo: la articulación de $O$ sujeta en las dos
              direcciones del plano.
          - punto: |
              **Al lado, $m_4\,a_B$ en la mesa, horizontal, e $I_O\,\alpha_2$ en
              el disco.**
            porque: |
              La mesa solo se traslada en horizontal; el disco gira alrededor
              de su centro, que no se mueve.
