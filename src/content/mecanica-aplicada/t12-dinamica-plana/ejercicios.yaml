      <figcaption>

      a) Las ranuras no rozan: empujan perpendicular a ellas, y A y B se mueven a lo largo, así que no trabajan. El peso de la biela, solo en el apartado b. b) A baja d y B se mueve x: uno de los muelles se estira x y el otro se encoge x.

      </figcaption>
      </figure>

      - **Las ranuras** no rozan: empujan perpendicular a ellas, y $A$ y $B$
        se mueven a lo largo de ellas. No trabajan.
      - **Los muelles** trabajan: $B$ se mueve $x$, así que uno se estira $x$
        y el otro se encoge $x$. Los dos guardan energía.
      - **El peso de A** trabaja: $A$ baja $d$. **El de B**, no: $B$ no cambia
        de altura. **El de la biela**, en el apartado b, sí: su centro baja
        $d/2$.

      **2. Incógnitas.** $v_A$ y $v_B$ en la posición final: dos, con la
      ecuación de la energía y la ligadura de la biela.

      **3. Ecuaciones.** La geometría: la biela es la hipotenusa, así que
      $x^{2} + (L-d)^{2} = L^{2}$. La cinemática: las perpendiculares a $v_A$
      y a $v_B$ se cortan en $I$, a $x$ de $A$ y a $L-d$ de $B$, y el centro
      de la biela está a $L/2$ de $I$, la mitad de la diagonal del rectángulo:

      $$
      \omega = \frac{v_A}{x},
      \qquad
      v_B = \omega\,(L-d) = v_A\,\frac{L-d}{x},
      \qquad
      v_G = \omega\,\frac{L}{2}
      $$

      La energía, desde el reposo y con los muelles sin deformar al principio.
      Con la biela sin masa,

      $$
      m g\,d = 2\cdot\tfrac12 k\,x^{2} + \tfrac12 m\,v_A^{2} + \tfrac12 m\,v_B^{2}
      $$

      y con la biela de masa $m_3$, a la izquierda se suma $m_3 g\,\frac{d}{2}$
      y a la derecha, $\tfrac12 m_3 v_G^{2} + \tfrac12 I_G\,\omega^{2}$.

      **4. Resultados.** Con $L = 0{,}3$ m, $d = 0{,}025$ m y
      $g = 9{,}81\ \text{m/s}^{2}$:

      $$
      x = \sqrt{0{,}3^{2} - 0{,}275^{2}} = 0{,}11990\ \text{m}
      \qquad
      v_B = \frac{0{,}275}{0{,}11990}\,v_A = 2{,}2937\,v_A
      \qquad
      \omega = 8{,}3406\,v_A
      $$

      $$
      m g\,d = 75 \cdot 9{,}81 \cdot 0{,}025 = 18{,}39375\ \text{J}
      \qquad
      k\,x^{2} = 900 \cdot 0{,}014375 = 12{,}9375\ \text{J}
      $$

      **Apartado a, biela sin masa.** Con $(v_B/v_A)^{2} = 0{,}075625/0{,}014375 = 5{,}2609$:

      $$
      18{,}39375 - 12{,}9375 = 37{,}5 \cdot 6{,}2609\,v_A^{2} = 234{,}78\,v_A^{2}
      $$

      $$
      v_A = 0{,}1524\ \text{m/s}
      \qquad
      v_B = 2{,}2937 \cdot 0{,}15245 = 0{,}3497\ \text{m/s}
      $$

      **Apartado b, biela de 10 kg.** Su centro baja 12,5 mm:
      $10 \cdot 9{,}81 \cdot 0{,}0125 = 1{,}22625$ J más. Y su energía
      cinética tiene dos partes, con $I_G = 10 \cdot 0{,}3^{2}/12 = 0{,}075$ kg·m²:

      $$
      \tfrac12 m_3 v_G^{2} = 5\,(8{,}3406 \cdot 0{,}15)^{2}\,v_A^{2} = 7{,}826\,v_A^{2}
      \qquad
      \tfrac12 I_G\,\omega^{2} = 0{,}0375 \cdot 8{,}3406^{2}\,v_A^{2} = 2{,}609\,v_A^{2}
      $$

      $$
      18{,}39375 + 1{,}22625 - 12{,}9375 = 6{,}6825
      = (37{,}5 + 197{,}283 + 7{,}826 + 2{,}609)\,v_A^{2} = 245{,}22\,v_A^{2}
      $$

      $$
      v_A = 0{,}1651\ \text{m/s}
      \qquad
      v_B = 2{,}2937 \cdot 0{,}16508 = 0{,}3786\ \text{m/s}
      $$

      La biela gira a $8{,}3406 \cdot 0{,}15245 = 1{,}272$ rad/s sin masa y a
      $8{,}3406 \cdot 0{,}16508 = 1{,}377$ rad/s con 10 kg.

      **5. Comprobación.** Las dos relaciones, por otros caminos. La de las
      velocidades, con la biela rígida: las proyecciones de $v_A$ y de $v_B$
      sobre $AB$ son iguales,

      $$
      v_A\,\frac{L-d}{L} = v_B\,\frac{x}{L}
      \;\Longrightarrow\;
      v_B = v_A\,\frac{L-d}{x}
      $$

      la misma. Y la energía cinética de la biela, de una vez, como un giro
      alrededor de $I$, que está a $L/2$ de su centro:
      $I_I = 0{,}075 + 10 \cdot 0{,}15^{2} = 0{,}3$ kg·m², y

      $$
      \tfrac12 I_I\,\omega^{2} = 0{,}15 \cdot 8{,}3406^{2}\,v_A^{2} = 10{,}435\,v_A^{2}
      $$

      que es $7{,}826 + 2{,}609$: las dos partes de antes.

      **Lo que dice el resultado.** Los muelles se quedan con el 70 por
      ciento de lo que suelta el peso de $A$, y de lo que queda, el 84 por
      ciento se lo lleva $B$, que va 2,29 veces más rápido. Por eso la biela de
      10 kg hace ir **más** deprisa a las masas: sus 1,23 J son un 22 por
      ciento más de lo que queda para moverse, y su inercia solo añade un 4
      por ciento al coeficiente de $v_A^{2}$.

  - id: ejma12-col1210-el-entramado-de-tres-barras
    titulo: El entramado articulado de tres barras
    fuente: >-
      Ejercicio 12.10 · Tema 12, «Dinámica del sólido con movimiento plano» ·
      Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección publica el
      resultado, contra el que está contrastado el desarrollo, y se ha
      comprobado también con la resolución oficial del profesor, que añade un
      dato que la hoja de enunciados no dice y hace falta para cerrar el
      problema: en A actúa un motor que suministra un par. El sentido de giro
      es el de las flechas de la figura, o sea el horario, que en los ejes de
      la resolución es omega1 = menos 2 k. Con el sentido contrario saldrían
      Ay = 85,5 N y Dy = 27,6 N, y no es lo que imprime la colección. Al
      compararla, conviene saber que esa resolución usa otro convenio de
      signos para las fuerzas y que su hoja de soluciones trae tres rótulos
      cambiados: el 6,96 N, que es Dx, va como Ax; en la línea de Dy repite
      Cy = -33,03 N, cuando su cuenta da -31,23; y en la de Ay repite
      -67,86 N, cuando su cuenta da -110,7. Su hoja de enunciado da además
      Dy = 31,25 N; la cuenta da 31,23.
    nivel: practica
    antes:
      idea: |
        Un sólido con movimiento plano cumple tres ecuaciones: la resultante
        de las fuerzas es la masa por la aceleración del centro de gravedad,
        y el momento respecto de G es el momento de inercia en G por la
        aceleración angular. En un sistema de varios sólidos se aíslan uno a
        uno: en cada articulación entre dos de ellos, la fuerza que uno hace
        sobre el otro es igual y contraria a la que recibe. La velocidad y la
        aceleración de un punto de un sólido salen de las de otro punto del
        mismo sólido y de su velocidad y su aceleración angulares.
      formula: |
        $$
        \sum\vec{F} = M\vec{a}_G,
        \qquad
        \sum M_G = I_G\,\alpha,
        \qquad
        I_G = \tfrac{1}{12}ML^{2}\ \text{(barra)}
        $$

        $$
        \vec{v}_B = \vec{v}_A + \vec{\omega}\times\overrightarrow{AB},
        \qquad
        \vec{a}_B = \vec{a}_A + \vec{\alpha}\times\overrightarrow{AB} - \omega^{2}\,\overrightarrow{AB}
        $$
      reconocer: |
        Antes de calcular se mira cómo se mueven en ese instante los extremos
        de cada barra.
    enunciado: |
      Se muestra un entramado articulado de tres barras. En el instante
      mostrado, la barra $AB$ tiene un movimiento angular con
      $\omega_1$ = 2 rad/s y $\alpha_1$ = 3 rad/s$^{2}$. Reacciones en los
      apoyos $A$ y $D$.

      Datos: $M_1$ = 4 kg; $M_2$ = 3 kg; $M_3$ = 6 kg; $AB$ = 0,6 m;
      $BC$ = 0,5 m; $CD$ = 1 m

