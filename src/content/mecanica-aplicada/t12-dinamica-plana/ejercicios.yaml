      - tipo: calcular
        titulo: La relación entre las dos aceleraciones angulares
        pregunta: |
          ¿Cuánto vale el cociente $\alpha_2/\alpha_1$, con su signo?
        respuesta:
          tipo: numero
          valor: '-1.3333'
          tolerancia: 0.005
          formato: un número, con su signo
        distractores:
          - valor: '1'
            mensaje: |
              Uno sería el cociente si los dos cuerpos fueran uno solo, soldados.
              Están articulados, y de hecho giran en sentidos contrarios.
          - valor: '0'
            mensaje: |
              Cero sería el cuadrado trasladando. Solo trasladaría si algo le
              impidiera girar, y al cortar el hilo no queda nada que lo haga.
        pista: |
          Combina la ecuación de momentos de la barra en $O$ con la ecuación
          horizontal del cuadrado. En las dos aparece $A_x$ y en ninguna el peso.
        desarrollo: |
          De la barra, momentos en $O$, $-A_x L = \tfrac13 ML^{2}\alpha_1$; del
          cuadrado, en horizontal, $A_x = M(\alpha_1 + \alpha_2)L$. Igualando,

          $$
          -\frac{\alpha_1}{3} = \alpha_1 + \alpha_2
          \;\Longrightarrow\;
          \frac{\alpha_2}{\alpha_1} = -\frac{4}{3}
          $$

      - tipo: calcular
        titulo: La aceleración angular de la barra
        pregunta: |
          Escribiendo $\alpha_1 = c\,g/L$, ¿cuánto vale $c$?
        respuesta:
          tipo: numero
          valor: '0.3913'
          tolerancia: 0.002
          formato: un número, sin unidad
        distractores:
          - valor: '1.5'
            mensaje: |
              Es la aceleración angular de la barra sola, como un péndulo que se
              suelta desde la horizontal. Aquí la barra está vertical y arrastra un
              cuadrado, que es casi todo el problema.
          - valor: '0.1667'
            mensaje: |
              Es el módulo que sale de tratar barra y cuadrado como un único
              sólido soldado que gira alrededor de $O$: el peso del cuadrado, a $L$
              de la vertical de $O$, entre $I_O = 6ML^{2}$. Están articulados en
              $A$, y esa articulación no transmite momento.
        pista: |
          Con las seis ecuaciones —tres por sólido— y las dos relaciones
          cinemáticas, quedan $\alpha_1$ y $\alpha_2$. La única fuerza motriz es el
          peso del cuadrado.
        desarrollo: |
          Sustituyendo $\alpha_2 = -\tfrac43\alpha_1$ en las ecuaciones vertical y
          de momentos del cuadrado,

          $$
          \alpha_1 = \frac{9}{23}\frac{g}{L}
          \qquad
          \alpha_2 = -\frac{12}{23}\frac{g}{L}
          $$

      - tipo: calcular
        titulo: La componente vertical de la reacción en A
        pregunta: |
          Escribiendo esa componente como $|A_y| = c\,Mg$, ¿cuánto vale $c$?
        respuesta:
          tipo: numero
          valor: '0.4783'
          tolerancia: 0.002
          formato: un número, sin unidad
        distractores:
          - valor: '1'
            mensaje: |
              Sería el peso entero del cuadrado, que es lo que sostendría la barra
              si el cuadrado no cayera. Está cayendo, con
              $a_{G2y} = -\tfrac{12}{23}g$, y la barra sostiene solo la diferencia.
          - valor: '0.5217'
            mensaje: |
              Eso es $M\,|a_{G2y}|$, la resultante vertical que necesita el
              cuadrado, no la reacción. La reacción es $M(g + a_{G2y})$, con
              $a_{G2y}$ negativa.
        pista: |
          El centro del cuadrado baja con $a_{G2y} = \alpha_2 L$. Después,
          $A_y - Mg = M\,a_{G2y}$.
        desarrollo: |
          $$
          a_{G2y} = \alpha_2 L = -\frac{12}{23}g
          \qquad
          A_y = M\left(g - \frac{12}{23}g\right) = \frac{11}{23}Mg
          $$

          hacia arriba sobre el cuadrado, y $A_x = \tfrac{3}{23}Mg$ hacia la
          izquierda. La colección los imprime como $3Mg/23$ y $-11Mg/23$, que son
          los mismos módulos con las flechas dibujadas al revés.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Son dos sólidos con dos giros, unidos en A; con $\omega = 0$, $\vec{a}_A = \alpha_1 L\,\hat{\imath}$ y $\vec{a}_{G2} = \vec{a}_A + \vec{\alpha}_2\times\overrightarrow{AG_2}$.'
          - texto: 'Momentos de la barra en O y ecuación horizontal del cuadrado, que comparten $A_x$, y sale $\alpha_2/\alpha_1 = -4/3$.'
          - texto: 'Con las otras dos ecuaciones del cuadrado se cierra el sistema, $\alpha_1 = 9g/(23L)$ y $\alpha_2 = -12g/(23L)$.'
          - texto: 'El centro del cuadrado baja con $\tfrac{12}{23}g$, y de su ecuación vertical $|A_y| = \tfrac{11}{23}Mg$, con $|A_x| = \tfrac{3}{23}Mg$.'
          - texto: Al cortar el hilo el cuadrado cae libremente, así que su centro acelera con g y la reacción en A es nula.
            trampa: true
            mensaje: |
              Si cayera libre no habría nada que calcular. El cuadrado sigue
              colgado de la barra por $A$, baja con algo más de la mitad de $g$, y
              la reacción vale casi medio peso.
    resolucion: |
      **1. Sólidos libres.** Es un problema de dinámica de dos sólidos con
      movimiento plano en un instante, unidos por una articulación. El dibujo
      del apartado b) lleva la barra y el cuadrado por separado, justo al
      cortar el hilo, y al lado, lo que tienen que dar sus fuerzas.

