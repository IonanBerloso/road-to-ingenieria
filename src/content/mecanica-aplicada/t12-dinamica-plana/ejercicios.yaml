ejercicios:
  - id: ejma12-el-cilindro-que-rueda-por-el-plano
    titulo: Un cilindro que rueda por un plano inclinado
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Un cilindro macizo y homogéneo de 2 kg rueda sin deslizar por un plano
      inclinado 30°. Tomando $g = 9{,}8\ \text{m/s}^{2}$, calcular la aceleración
      de su centro y el coeficiente de rozamiento mínimo para que no deslice.
    pide: La aceleración del centro y el rozamiento mínimo.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿En qué punto conviene tomar momentos para sacar la aceleración?
        opciones:
          - texto: En el punto de contacto, sumando el momento de M·aG, porque ahí no aparecen N ni Fr
            correcta: true
            mensaje: |
              Eso es. En el contacto la normal y el rozamiento no dan momento, y
              la ecuación sale con una sola incógnita, si al par $I_G\,\alpha$ le
              sumas el momento de $M a_G$, que es $M a_G R$.
          - texto: En el centro, porque allí la ecuación es la más sencilla
            mensaje: |
              Se puede, pero entonces el rozamiento da momento y aparece como
              incógnita: hay que combinarla con la ecuación de fuerzas. En el
              contacto sale directamente.
          - texto: En el punto de contacto, con solo el par I_G·α
            mensaje: |
              Fuera de $G$ hay que contar también el momento de $M\vec{a}_G$
              respecto del punto. Sin él, la aceleración sale tres veces mayor.

      - tipo: calcular
        titulo: La aceleración del centro
        pregunta: |
          ¿Cuánto vale la aceleración del centro, en m/s²?
        respuesta:
          tipo: numero
          valor: '3.267'
          tolerancia: 0.01
          formato: un número, en m/s²
        distractores:
          - valor: '4.9'
            mensaje: |
              Es $g \sin 30°$, la de un bloque que desliza sin rozamiento. El
              cilindro rueda: parte de la energía se va en girar, y acelera
              menos.
          - valor: '2.45'
            mensaje: |
              Es la de un anillo, con $I_G = MR^{2}$. El cilindro macizo tiene
              $I_G = MR^{2}/2$.
          - valor: '9.8'
            mensaje: |
              Has tomado momentos en el contacto solo con $I_G\,\alpha$, sin el
              momento de $M a_G$. Falta ese término.
        pista: |
          Momentos en el contacto: $M g R \sin 30° = I_G\,\alpha + M\,a_G\,R$, con
          $I_G = MR^{2}/2$ y $\alpha = a_G/R$.
        desarrollo: |
          $$
          M g R \sin 30° = \tfrac12 M R^{2} \frac{a_G}{R} + M a_G R
          \;\Longrightarrow\;
          a_G = \tfrac23\,g \sin 30° = 3{,}267\ \text{m/s}^{2}
          $$

      - tipo: calcular
        titulo: El rozamiento mínimo
        pregunta: |
          ¿Qué coeficiente de rozamiento mínimo hace falta para que no deslice?
        respuesta:
          tipo: numero
          valor: '0.1925'
          tolerancia: 0.002
          formato: un número, sin unidad
        distractores:
          - valor: '0.577'
            mensaje: |
              Es $\tan 30°$, el coeficiente que necesita un bloque para quedarse
              quieto. El cilindro no está quieto: rueda, y el rozamiento solo
              tiene que dar la parte que hace girar.
          - valor: '0.2887'
            mensaje: |
              Es el de un anillo, $\tfrac12 \tan 30°$. Con el cilindro macizo el
              rozamiento es menor: $\tfrac13 \tan 30°$.
        pista: |
          Del teorema del momento angular en $G$: $F_r R = I_G\,\alpha$, así que
          $F_r = \tfrac12 M a_G$. Y $N = M g \cos 30°$.
        desarrollo: |
          $$
          F_r = \tfrac12 M a_G = 3{,}267\ \text{N}
          \qquad
          N = 2 \cdot 9{,}8 \cos 30° = 16{,}97\ \text{N}
          \qquad
          \mu_{\min} = \frac{3{,}267}{16{,}97} = 0{,}1925
          $$

          Que es $\tfrac13 \tan 30°$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Momentos en el contacto, con el sistema equivalente: $M g R \sin 30° = I_G\,\alpha + M a_G R$.'
          - texto: Con $I_G = MR^{2}/2$ y $\alpha = a_G/R$, $a_G = \tfrac23 g \sin 30° = 3{,}27$ m/s².
          - texto: En $G$, $F_r R = I_G\,\alpha$, así que $F_r = \tfrac12 M a_G = 3{,}27$ N, y $\mu \ge 3{,}27/16{,}97 = 0{,}19$.
          - texto: Como rueda sin deslizar, el rozamiento vale $\mu N$ y el cilindro acelera $g(\sin 30° - \mu \cos 30°)$.
            trampa: true
            mensaje: |
              Rodar sin deslizar es un rozamiento **estático**, por debajo de su
              techo: vale lo que pida el equilibrio de momentos, 3,27 N, no
              $\mu N$. Esa fórmula es la de un bloque que desliza.
    resolucion: |
      **La aceleración.** Momentos en el punto de contacto $C$, donde no dan
      momento ni la normal ni el rozamiento. El sistema equivalente tiene el par
      $I_G\,\alpha$ y el vector $M a_G$ en $G$, a una distancia $R$ de $C$:

      $$
      M g R \sin 30° = \tfrac12 M R^{2}\,\frac{a_G}{R} + M a_G R
      \;\Longrightarrow\;
      a_G = \tfrac23\,g \sin 30° = 3{,}267\ \text{m/s}^{2}
      $$

      **El rozamiento.** Momentos en $G$: solo el rozamiento da momento,

      $$
      F_r\,R = \tfrac12 M R^{2}\,\frac{a_G}{R} \;\Longrightarrow\; F_r = \tfrac12 M a_G = 3{,}267\ \text{N}
      $$

      Con $N = M g \cos 30° = 16{,}97\ \text{N}$, rodar sin deslizar exige
      $\mu \ge 0{,}1925$, un tercio de $\tan 30°$. Y ni la masa ni el radio
      importan: todos los cilindros macizos bajan igual.

  - id: ejma12-la-barra-que-se-suelta
    titulo: Una barra articulada que se suelta desde la horizontal
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Una barra homogénea de 1 m y 3 kg está articulada en su extremo $O$ y se
      mantiene horizontal. Se suelta desde el reposo. Tomando
      $g = 9{,}8\ \text{m/s}^{2}$, calcular su aceleración angular y la reacción
      vertical en la articulación en el instante de soltarla.
    pide: La aceleración angular y la reacción en O al soltarla.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué ecuación da directamente la aceleración angular?
        opciones:
          - texto: La del momento angular en el punto fijo O, con I_O
            correcta: true
            mensaje: |
              Eso es. $O$ es fijo, así que $\sum M_O = I_O\,\alpha$, y la reacción
              en $O$ no da momento: una sola incógnita.
          - texto: La del momento angular en O, pero con I_G
            mensaje: |
              En un punto fijo el momento de inercia es el respecto de ese
              punto. Con $I_G$ la aceleración sale cuatro veces mayor.
          - texto: La de fuerzas, porque el peso es la única fuerza conocida
            mensaje: |
              En la de fuerzas aparece la reacción en $O$, que no se conoce. La de
              momentos en $O$ la elimina.

      - tipo: calcular
        titulo: La aceleración angular
        pregunta: |
          ¿Cuánto vale la aceleración angular al soltarla, en rad/s²?
        respuesta:
          tipo: numero
          valor: '14.7'
          tolerancia: 0.05
          formato: un número, en rad/s²
        distractores:
          - valor: '58.8'
            mensaje: |
              Has usado $I_G = ML^{2}/12$. El eje de giro pasa por $O$, en el
              extremo: $I_O = ML^{2}/3$.
          - valor: '4.9'
            mensaje: |
              Has concentrado la masa en el extremo libre, $I = ML^{2}$. Está
              repartida a lo largo de la barra: $I_O = ML^{2}/3$.
        pista: |
          $M g \frac{L}{2} = I_O\,\alpha$, con $I_O = ML^{2}/3$.
        desarrollo: |
          $$
          \alpha = \frac{M g L/2}{ML^{2}/3} = \frac{3g}{2L} = \frac{3 \cdot 9{,}8}{2} = 14{,}7\ \text{rad/s}^{2}
          $$

      - tipo: calcular
        titulo: La reacción en O
        pregunta: |
          ¿Cuánto vale la reacción vertical en $O$ en ese instante, en N?
        respuesta:
          tipo: numero
          valor: '7.35'
          tolerancia: 0.05
          formato: un número, en N
        distractores:
          - valor: '29.4'
            mensaje: |
              Es el peso, la reacción que habría con la barra quieta. Al
              soltarla, $G$ baja acelerando y la articulación deja de sostener
              todo el peso.
          - valor: '0'
            mensaje: |
              La barra no cae libre: está articulada. $G$ acelera $\alpha L/2 = 7{,}35$
              m/s², menos que $g$, y la diferencia la sostiene la articulación.
        pista: |
          $a_G = \alpha \frac{L}{2}$, hacia abajo. Teorema del momento lineal:
          $M g - R = M a_G$.
        desarrollo: |
          $$
          a_G = 14{,}7 \cdot 0{,}5 = 7{,}35\ \text{m/s}^{2}
          \qquad
          R = M(g - a_G) = 3\,(9{,}8 - 7{,}35) = 7{,}35\ \text{N}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Momentos en el punto fijo O: $M g L/2 = I_O\,\alpha$, con $I_O = ML^{2}/3$, así que $\alpha = 3g/(2L) = 14{,}7$ rad/s².'
          - texto: Al soltarla no hay velocidad, así que $G$ solo tiene aceleración tangencial, $\alpha L/2 = 7{,}35$ m/s², vertical.
          - texto: 'Teorema del momento lineal: $M g - R = M a_G$, y $R = 3 \cdot 2{,}45 = 7{,}35$ N.'
          - texto: Mientras la barra no se mueve, la articulación sigue sosteniendo todo el peso, 29,4 N.
            trampa: true
            mensaje: |
              En el instante de soltarla la barra no tiene velocidad, pero sí
              aceleración. $G$ baja acelerando, y la articulación sostiene solo
              la cuarta parte del peso.
    resolucion: |
      **La aceleración angular.** $O$ es un punto fijo, y tomando momentos en él
      la reacción desaparece:

      $$
      M g \frac{L}{2} = \frac{ML^{2}}{3}\,\alpha
      \;\Longrightarrow\;
      \alpha = \frac{3g}{2L} = 14{,}7\ \text{rad/s}^{2}
      $$

      **La reacción.** Al soltarla, la velocidad angular es nula, así que $G$
      solo tiene aceleración tangencial, vertical y hacia abajo:
      $a_G = \alpha L/2 = 7{,}35\ \text{m/s}^{2}$. Por el teorema del momento
      lineal:

      $$
      M g - R = M a_G \;\Longrightarrow\; R = 3\,(9{,}8 - 7{,}35) = 7{,}35\ \text{N}
      $$

      Una cuarta parte del peso: en ese instante la articulación sostiene mucho
      menos de lo que sostenía con la barra quieta.
