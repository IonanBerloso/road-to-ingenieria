    pide: Las reacciones en A y B, el par P, y las posiciones de las dos masas de equilibrado.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué clase de desequilibrio tiene esta muela antes de corregirla?
        opciones:
          - texto: Solo estático, porque el plano del disco es de simetría y sus productos de inercia son nulos
            correcta: true
            mensaje: |
              Eso es. Toda la masa está en el plano $z = 0$, así que
              $I_{xz} = I_{yz} = 0$: el eje ya es dirección principal. Lo único
              que falla es que $G$ no está en el eje.
          - texto: Dinámico, porque hay aceleración angular
            mensaje: |
              La aceleración angular carga los apoyos, pero no es un
              desequilibrio: cuando el motor deje de acelerar desaparece. El
              desequilibrio es la geometría de masas, y aquí es $G$ fuera del
              eje.
          - texto: Estático, y por eso basta con una masa correctora en un plano cualquiera
            mensaje: |
              La primera mitad es cierta y la segunda no. Si pones la masa en un
              plano distinto del de $G$ arreglas la resultante y **creas** un
              producto de inercia que antes no había. Por eso el enunciado da
              dos planos.
          - texto: Ninguno, porque 0,1R es un descentrado muy pequeño
            mensaje: |
              Pequeño en longitud, no en efecto: la fuerza va con $\omega^{2}$ y
              crece con el cuadrado de la velocidad. Aquí ya vale 4 N con la
              muela girando despacio.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **la muela con su eje, sin los
          apoyos, con todas las acciones que actúan sobre ellos**. De lado, con
          el eje horizontal, y sin escala.
        comprueba:
          - punto: |
              **En A, tres componentes: según X, hacia dentro del papel; según
              Y, vertical; y según Z, a lo largo del eje.**
            porque: |
              Uno de los dos apoyos tiene que sujetar el eje a lo largo; la
              colección le da esa componente a A.
          - punto: |
              **En B, solo las dos perpendiculares al eje.**
            porque: |
              Con una componente axial en cada apoyo, las ecuaciones solo
              darían su suma.
          - punto: |
              **El peso, Mg, en G, fuera del eje.**
            porque: |
              El enunciado pone G a 0,1R del eje; en el dibujo conviene
              exagerarlo para que se vea.
          - punto: |
              **El par P a lo largo del eje.**
            porque: |
              Es el par que acciona la muela, según Z.
          - punto: |
              **A a 2R del plano de la muela y B a R, por el otro lado.**
            porque: |
              Son los brazos de las reacciones en las ecuaciones de momentos.
        figura: |
          <svg viewBox="36 60 286 148" role="img" width="286" height="148" aria-labelledby="dsl-t dsl-d">
