    pide: Las reacciones estáticas y dinámicas en A y en B, y el par T.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué son aquí las reacciones **estáticas**?
        opciones:
          - texto: Las que habría con el disco parado, y no son nulas porque el peso está aplicado en G, que no está en el eje
            correcta: true
            mensaje: |
              Eso es. Con todo quieto, el peso $Mg$ aplicado a $R/4$ del eje da
              un momento que los dos apoyos tienen que equilibrar con dos
              fuerzas horizontales opuestas.
          - texto: Ninguna, porque el peso es vertical y las reacciones perpendiculares al eje son horizontales
            mensaje: |
              Una fuerza vertical descentrada produce un **momento**
              horizontal, y ese momento se equilibra con dos fuerzas
              horizontales separadas $2a$. Por eso $A_x$ y $B_x$ tienen una
              parte que no depende de $\omega$.
          - texto: Las que da el par T, porque T no depende de la velocidad
            mensaje: |
              El par $T$ es justo lo contrario: vale $9MR^{2}\alpha/16$, así que
              es enteramente dinámico y desaparece si el eje no acelera.
          - texto: Las que dependen de omega al cuadrado, porque el régimen es estacionario
            mensaje: |
              Todo lo que lleva $\omega^{2}$ o $\alpha$ es **dinámico**, exista o
              no aceleración angular. «Estático» aquí significa «con el sólido
              quieto», no «a velocidad constante».

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el disco con su eje, sin los
          apoyos, con todas las acciones que actúan sobre ellos**. De lado, en
          el plano XZ, y sin escala.
        comprueba:
          - punto: |
              **En A y en B, la reacción con sus tres componentes: según X,
              según Y, hacia dentro del papel, y según Z.**
            porque: |
              Los dos apoyos sujetan el eje en todas las direcciones; con las
              componentes positivas, los signos los dan las ecuaciones.
          - punto: |
              **El peso, Mg, en G, a R/4 del eje, y no en C.**
            porque: |
              G es el centro del disco, y el enunciado lo pone a R/4 del punto
              en el que está soldado.
          - punto: |
              **El par T alrededor del eje, positivo según Z.**
            porque: |
              Es la acción que mueve el eje, y el enunciado la da positiva
              según Z.
          - punto: |
              **Los dos apoyos, a la misma distancia a del plano del disco.**
            porque: |
              Esas distancias son los brazos de las reacciones en las
              ecuaciones de momentos.
        figura: |
