        <rect x="148" y="62" width="24" height="10" fill="var(--faint)" fill-opacity="0.5" stroke="var(--ink)" stroke-width="1"/>
        <path d="M148 62 L142 56 M156 62 L150 56 M164 62 L158 56 M172 62 L166 56" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
