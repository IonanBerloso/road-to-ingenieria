      - tipo: calcular
        titulo: Dónde está el centro de gravedad
        pregunta: |
          Midiendo desde $B$ a lo largo del eje, ¿a qué distancia está el centro
          de gravedad de la placa?
        respuesta:
          tipo: magnitud
          valor: '750 mm'
          formato: una longitud, con su unidad
        distractores:
          - valor: '600 mm'
            mensaje: |
              Eso es el borde de la placa más cercano a $B$, no su centro. La
              placa mide 300 mm de ancho, así que su centro está 150 mm más
              allá.
          - valor: '900 mm'
            mensaje: |
              Ese es el borde más lejano. El centro de gravedad de un cuadrado
              homogéneo está en su centro geométrico.
          - valor: '450 mm'
            mensaje: |
              Parece que has restado en vez de sumar, o has medido desde el
              borde equivocado. Desde $B$ hay 600 mm hasta el borde y 150 mm más
              hasta el centro.
        pista: |
          El centro del cuadrado está a media anchura de su borde: $600 + 150$.
        desarrollo: |
          $$
          z_G = 600 + \frac{300}{2} = 750\ \text{mm}
          \qquad
          y_G = \frac{300}{2} = 150\ \text{mm}
          $$

          Y de paso, $A$ está a 400 mm de $B$, así que $G$ queda 350 mm más allá
          de $A$: la placa está enteramente en voladizo.

      - tipo: calcular
        titulo: La reacción en A
        pregunta: |
          Con $M = 2$ kg, $\omega = 5$ rad/s y $g = 9{,}8$ m/s², ¿cuánto vale
          $A_y$?
        respuesta:
          tipo: magnitud
          valor: '22.69 N'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '36.75 N'
            mensaje: |
              Esa es solo la parte estática, $\tfrac{15}{8}Mg$. Falta restar la
              dinámica, $\tfrac{45}{16}M\omega^{2}a = 14{,}06$ N.
          - valor: '50.81 N'
            mensaje: |
              Has sumado la parte dinámica en vez de restarla. La aceleración de
              $G$ apunta hacia el eje, o sea hacia abajo, así que descarga los
              apoyos en esta posición.
          - valor: '-10.59 N'
            mensaje: |
              Ese es $B_y$. El apoyo que está más lejos de la placa es el que
              tira hacia abajo; el más cercano, $A$, es el que empuja hacia
              arriba.
        pista: |
          $A_y + B_y - Mg = -M\omega^{2}y_G$, y los momentos en $G$ dan
          $7A_y + 15B_y = 0$ con las distancias en unidades de $a = 100$ mm.
        desarrollo: |
          $$
          A_y + B_y = Mg - M\omega^{2}y_G = 19{,}6 - 7{,}5 = 12{,}1\ \text{N}
          $$

          Tomando momentos en $G$, con $GA = 3{,}5a$ y $GB = 7{,}5a$ y
          $\dot{\vec{H}}_G = 0$:

          $$
          \frac{7}{2}a\,A_y + \frac{15}{2}a\,B_y = 0 \;\Longrightarrow\; B_y = -\frac{7}{15}A_y
          $$

          $$
          A_y = \frac{15}{8}Mg - \frac{45}{16}M\omega^{2}a = 36{,}75 - 14{,}06 = 22{,}69\ \text{N}
          $$

          La colección imprime 22,67 N; con $g = 9{,}8$ el valor exacto es
          22,6875 N.

      - tipo: calcular
        titulo: La reacción en B
        pregunta: |
          ¿Cuánto vale $B_y$, con su signo?
        respuesta:
          tipo: magnitud
          valor: '-10.59 N'
          formato: una fuerza, con su signo y su unidad
        distractores:
          - valor: '10.59 N'
            mensaje: |
              El módulo está bien y el signo no. Con la placa en voladizo, $B$
              es el apoyo que **tira hacia abajo** para que el conjunto no
              vuelque sobre $A$.
          - valor: '-17.15 N'
            mensaje: |
              Esa es solo la parte estática, $-\tfrac{7}{8}Mg$. La dinámica
              suma $+\tfrac{21}{16}M\omega^{2}a = 6{,}56$ N y deja $-10{,}59$ N.
        pista: |
          Ya tienes $A_y + B_y = 12{,}1$ N y $A_y = 22{,}69$ N.
        desarrollo: |
          $$
          B_y = 12{,}1 - 22{,}69 = -10{,}59\ \text{N}
          $$

          o, en forma cerrada,
          $B_y = -\tfrac{7}{8}Mg + \tfrac{21}{16}M\omega^{2}a$. Y las otras:
          $A_x = B_x = 0$ y $P = 0$, porque no hay ningún producto de inercia
          —la placa es simétrica respecto de sus dos ejes— ni aceleración
          angular.

      - tipo: calcular
        titulo: Dónde va la masa del plano Z = 100 mm
        pregunta: |
          Se colocan dos masas de 1 kg en los planos $Z = 100$ mm y
          $Z = 300$ mm. ¿Cuál es la coordenada $y_1$ de la del plano
          $Z = 100$ mm, en milímetros y con su signo?
        respuesta:
          tipo: magnitud
          valor: '675 mm'
          formato: una longitud, con su signo y su unidad
        distractores:
          - valor: '-450 mm'
            mensaje: |
              Ese es el valor que sale si se pide solo
              $m_1y_1z_1 + m_2y_2z_2 = 0$, olvidando que la placa aporta su
              propio producto de inercia, $I_{yz} = M y_G z_G = 225\,000$ kg·mm². Es
              el valor que imprime la colección, y no equilibra: con él el
              producto de inercia del conjunto sigue valiendo 225 000 kg·mm².
          - valor: '-975 mm'
            mensaje: |
              Ese es $y_2$, la del plano $Z = 300$ mm. Las dos masas van a
              lados opuestos del eje, y la del plano $Z = 100$ mm, del mismo
              lado que la placa.
          - valor: '150 mm'
            mensaje: |
              Ese es el otro valor que imprime la colección para la segunda
              masa, y viene del mismo descuido: no contar el producto de inercia
              de la placa.
        pista: |
          Dos condiciones: $M y_G + m_1 y_1 + m_2 y_2 = 0$ y
          $M y_G z_G + m_1 y_1 z_1 + m_2 y_2 z_2 = 0$, con las $z$ medidas desde
          $B$.
        desarrollo: |
          $$
          2 \cdot 150 + y_1 + y_2 = 0 \;\Longrightarrow\; y_1 + y_2 = -300\ \text{mm}
          $$

          $$
          2 \cdot 150 \cdot 750 + y_1 \cdot 100 + y_2 \cdot 300 = 0 \;\Longrightarrow\; y_1 + 3y_2 = -2250\ \text{mm}
          $$

          Restando, $y_2 = -975$ mm e $y_1 = 675$ mm:

          $$
          M_1\left(0,\ 675,\ 100\right)\ \text{mm}
          \qquad
          M_2\left(0,\ -975,\ 300\right)\ \text{mm}
          $$

          Comprobación: $675 \cdot 100 - 975 \cdot 300 = -225\,000$ kg·mm²,
          que cancela exactamente el producto de inercia de la placa.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Con $\omega$ constante y la placa simétrica, $\dot{\vec{H}}_G = 0$, así que $P = 0$ y las dos ecuaciones de momentos solo llevan reacciones.'
          - texto: 'La resultante vale $Mg - M\omega^{2}y_G = 12{,}1$ N y los momentos en $G$ dan $7A_y + 15B_y = 0$, de donde $A_y = 22{,}69$ N y $B_y = -10{,}59$ N.'
          - texto: 'Para equilibrar hay que anular a la vez $\sum m_i y_i$ y el producto de inercia del conjunto, que incluye el de la placa, $M y_G z_G$.'
          - texto: Como las dos masas de equilibrado están en planos distintos, basta con que entre ellas dos se anule la suma de sus productos y sí y zeta.
            trampa: true
            mensaje: |
              Lo que hay que anular es el producto de inercia del **conjunto**,
              y la placa aporta el suyo: $M y_G z_G = 225\,000$ kg·mm². Si se olvida,
              salen $-450$ mm y $150$ mm —que es lo que imprime la colección— y
              el rotor sigue desequilibrado dinámicamente.
    resolucion: |
      **1. Sólidos libres.** Es un problema de dinámica de un sólido que gira
      alrededor de un eje fijo: el dibujo lleva la placa con su eje, sin los
      apoyos.

      <figure class="figura-examen">
      <svg viewBox="14 56 370 206" role="img" width="555" height="309" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">Sólido libre de la placa en voladizo con su eje</title>
        <desc id="dsl-d">El eje horizontal, con B a la derecha, A a su izquierda y la placa cuadrada más a la izquierda todavía, por encima del eje. Los cojinetes, quitados y a trazos. En A, la reacción según Y, vertical, y según X, hacia el observador, en diagonal hacia abajo a la derecha. En B, las mismas y la axial, según Z, hacia la izquierda. El peso, en el centro de la placa. Entre la placa y A, el par P, como vector de doble flecha según Z. Cotas: 400 mm de A a B, 750 mm del centro de la placa a B y 150 mm del centro al eje.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
