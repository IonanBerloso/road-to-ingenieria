        <text x="225" y="178" font-size="9" text-anchor="middle" fill="var(--faint)">R</text>
        <line x1="100" y1="164" x2="100" y2="129" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="107" y="160" font-size="10" text-anchor="start" fill="var(--d2-tinta)">A<tspan font-size="7.5" dy="2.5">y</tspan></text>
        <line x1="50" y1="120" x2="86" y2="120" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="52" y="114" font-size="10" text-anchor="start" fill="var(--d2-tinta)">A<tspan font-size="7.5" dy="2.5">z</tspan></text>
