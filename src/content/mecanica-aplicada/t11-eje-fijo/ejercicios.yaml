        <line x1="110" y1="120" x2="226" y2="120" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="110" y1="120" x2="110" y2="36" stroke="var(--faint)" stroke-width="0.7"/>
        <path d="M107.2 104.2 A16 16 0 0 0 97.7 130.3" fill="none" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="70" y="104" font-size="10" text-anchor="end" fill="var(--ink)" font-style="italic">ω, α</text>
        <line x1="146" y1="120" x2="118" y2="120" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="150" y="140" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">ω²R/4</text>
        <line x1="146" y1="120" x2="146" y2="72" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="152" y="82" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">αR/4</text>
        <circle cx="146" cy="120" r="2.4" fill="var(--ink)"/>
        <text x="150" y="114" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">G</text>
        <text x="108" y="148" font-size="9" text-anchor="end" fill="var(--faint)">C</text>
        <text x="230" y="116" font-size="9" text-anchor="start" fill="var(--faint)">X</text>
        <text x="116" y="40" font-size="9" text-anchor="start" fill="var(--faint)">Y</text>
      </svg>
      <figcaption>

      Desde arriba, con Z hacia fuera del papel y sin escala. G da vueltas alrededor del eje en una circunferencia de radio R/4: su aceleración tiene una parte hacia el eje y otra tangente.

      </figcaption>
      </figure>

      $$
      \vec{a}_G = -\omega^{2}\frac{R}{4}\,\hat{\imath} + \alpha\frac{R}{4}\,\hat{\jmath}
      $$

      Sin productos de inercia, $\vec{H}_G = I_{Gz}\,\omega\,\hat{k}$ va a lo
      largo del eje y $\dot{\vec{H}}_G = I_{Gz}\,\alpha\,\hat{k}$: el término
      $\vec{\omega} \times \vec{H}_G$ se anula. Con A y B a $\mp a$ del plano
      del disco y a $R/4$ de $G$, $\sum\vec{F} = M\vec{a}_G$ y
      $\sum\vec{M}_G = \dot{\vec{H}}_G$ dan:

      $$
      A_x + B_x = -\frac{M\omega^{2}R}{4}
      \qquad
      A_y + B_y = \frac{M\alpha R}{4}
      \qquad
      A_z + B_z = Mg
      $$

      $$
      a\left(A_y - B_y\right) = 0
      \qquad
      \frac{R}{4}\left(A_z + B_z\right) - a\left(A_x - B_x\right) = 0
      \qquad
      T - \frac{R}{4}\left(A_y + B_y\right) = \frac{MR^{2}}{2}\alpha
      $$

      **4. Resultados.** Sumando y restando las parejas:

      $$
      A_y = B_y = \frac{MR\alpha}{8}
      \qquad
      A_x = -\frac{MR}{8}\left(\omega^{2} - \frac{g}{a}\right)
      \qquad
      B_x = -\frac{MR}{8}\left(\omega^{2} + \frac{g}{a}\right)
      \qquad
      T = \frac{9MR^{2}\alpha}{16}
      $$

      Lo que publica la colección. La parte **estática** es la que queda con
      $\omega = \alpha = 0$: $\pm MgR/(8a)$ en $A_x$ y $B_x$, y la vertical,
      $A_z + B_z = Mg$. Todo lo demás es **dinámico**. Con los valores de
      prueba, $MR/8$ vale 1 kg·m y $g/a$, 19,6 rad²/s²:

      $$
      A_x = -(225 - 19{,}6) = -205{,}4\ \text{N},
      \qquad
      B_x = -(225 + 19{,}6) = -244{,}6\ \text{N},
      \qquad
      A_y = B_y = 6\ \text{N},
      \qquad
      T = 10{,}8\ \text{N}\cdot\text{m}
      $$

      **5. Comprobación.** Por d'Alembert y con momentos respecto de A, sin
      pasar por $G$. Con las fuerzas de inercia en $G$, $M\omega^{2}R/4$ hacia
      fuera del eje, según $+x$, y $M\alpha R/4$ según $-y$, y con el par de
      inercia $-I_{Gz}\,\alpha$, el conjunto está en equilibrio. Con los
      valores de prueba, esas fuerzas valen
      $20 \cdot 225 \cdot 0{,}1 = 450$ N y $20 \cdot 6 \cdot 0{,}1 = 12$ N;
      B está a $2a = 1$ m de A, y G, a 0,5 m de altura y a 0,1 m del eje. Los
      momentos respecto de A, según $y$, según $x$ y según el eje:

      $$
      1 \cdot B_x + 0{,}1 \cdot 196 + 0{,}5 \cdot 450 = 0
      \;\Rightarrow\;
      B_x = -244{,}6\ \text{N}
      $$

      $$
      -1 \cdot B_y + 0{,}5 \cdot 12 = 0
      \;\Rightarrow\;
      B_y = 6\ \text{N}
      $$

      $$
      T = \left(\frac{MR^{2}}{2} + M\left(\frac{R}{4}\right)^{2}\right)\alpha = (1{,}6 + 0{,}2) \cdot 6 = 10{,}8\ \text{N}\cdot\text{m}
      $$

      La última es el momento de inercia respecto del eje real de giro,
      trasladado con Steiner. Y de las fuerzas, $A_x = -450 + 244{,}6 = -205{,}4$ N
      y $A_y = 12 - 6 = 6$ N. Los mismos valores.

      **Lo que dice el resultado.** El disco no tiene productos de inercia: el
      eje de giro es principal, el momento angular va con él y no hace falta
      ningún par para girarlo. Pero $G$ está fuera del eje, y eso basta: la
      parte dinámica de las reacciones según $x$, 225 N en cada apoyo, es más
      de once veces la estática, 19,6 N, y gira con el disco. Las reacciones
      según $y$ y el par $T$ solo existen mientras el eje acelera: a velocidad
      constante y sin rozamiento, no haría falta par.

  - id: ejma11-col113-dos-cuadrados-en-planos-perpendiculares
    titulo: Dos cuadrados en planos perpendiculares, y las dos masas que los equilibran
    fuente: >-
      Ejercicio 11.3 · Tema 11, «Dinámica del sólido rígido con eje fijo» ·
      Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección publica el
      resultado, contra el que está contrastado el desarrollo, y también se ha
      contrastado con la resolución oficial del profesor. El resultado es
      simbólico, así que las casillas usan valores de prueba nuestros,
      declarados en cada pregunta: masa 6 kg por cuadrado, lado 0,4 m y
      gravedad 9,8 metros por segundo al cuadrado.
    nivel: practica
    antes:
      idea: |
        Para un sólido que gira alrededor de un eje fijo, con A un punto del
        eje, el momento de las fuerzas respecto de A es la derivada del
        momento angular respecto de A, y el momento angular se obtiene con la
        matriz de inercia en A. La resultante es la masa por la aceleración
        del centro de gravedad. Un eje que gira está equilibrado del todo
        cuando el centro de gravedad está en el eje y los dos productos de
        inercia que mezclan el eje con las otras dos direcciones son nulos.
      formula: |
        $$
        \vec{H}_A = [I_A]\,\vec{\omega},
        \qquad
        \sum\vec{M}_A = \dot{\vec{H}}_A,
        \qquad
        \sum\vec{F} = m\,\vec{a}_G
        $$

        $$
        x_G = y_G = 0,
        \qquad
        I_{xz} = \sum m\,x\,z = 0,
        \qquad
        I_{yz} = \sum m\,y\,z = 0
        $$
      reconocer: |
        Antes de calcular se mira cómo está el movimiento en el instante que
        se pide.
    enunciado: |
      Dos cuadrados iguales, de masa $M$ y lado $L$, están situados en planos
      perpendiculares y giran alrededor del eje $AD$ vertical con $\omega$ por
      la acción del par $P$. Sabiendo que $D$ no puede absorber esfuerzos
      verticales, calcular:

      a) Valor del par $P$ en $t = 0$.

      b) Reacciones en $A$ y $D$ en $t = 0$.

      c) Si se equilibra el sistema con 2 masas iguales de valor $M$, colocadas
      respectivamente en dos planos perpendiculares al eje $Z$ que pasan por $B$
      y por $C$, determinar su posición.

      DATOS:

      - Velocidad angular

      $$
      \omega = \sqrt{\frac{2g}{L}}\,\operatorname{sen}\!\left(\sqrt{\frac{2g}{L}}\,t\right)
      $$

      - Matriz de inercia del conjunto referida al sistema de ejes centrados en
      $A$.

      $$
      [I_A] = \begin{bmatrix}
      9ML^{2} & 0 & -\dfrac{5ML^{2}}{4} \\[4pt]
      0 & 9ML^{2} & -\dfrac{3ML^{2}}{4} \\[4pt]
      -\dfrac{5ML^{2}}{4} & -\dfrac{3ML^{2}}{4} & \dfrac{2ML^{2}}{3}
      \end{bmatrix}
      $$

      <figure>
      <svg viewBox="0 0 300 350" role="img" width="300" height="350" aria-labelledby="ejma11-col113-t ejma11-col113-d">
        <title id="ejma11-col113-t">Dos placas cuadradas soldadas en planos perpendiculares a un eje vertical</title>
        <desc id="ejma11-col113-d">Eje vertical AD de longitud cuatro L, sujeto en A abajo y guiado en D arriba. Desde A, a una altura L, está el punto B; entre B y una altura de dos L hay un cuadrado de lado L en el plano YZ, hacia el eje Y. Entre dos L y tres L hay otro cuadrado de lado L en el plano XZ, hacia el eje X. El punto C está a tres L y desde ahí queda otra longitud L hasta D. El par P y la velocidad angular omega van según el eje Z, que es vertical.</desc>
