      <figcaption>

      El disco, de radio **R** y masa **M**, gira con el eje **AB** a velocidad
      angular constante. Su centro de gravedad **G** está en el eje, a la misma
      distancia **a** de los dos cojinetes, pero el plano del disco forma un
      ángulo **theta** con la perpendicular al eje: los ejes principales del
      disco, **X0** y **Z0**, van girados ese mismo ángulo.

      </figcaption>
      </figure>
    pide: Las reacciones dinámicas en los cojinetes A y B.
    pasos:
      - tipo: reconocer
        pregunta: |
          El centro de gravedad está **en** el eje y $\omega$ es constante, así
          que $\vec{a}_G = 0$. ¿De dónde salen entonces las reacciones
          dinámicas?
        opciones:
          - texto: Del producto de inercia, porque el eje de giro no es una dirección principal del disco inclinado
            correcta: true
            mensaje: |
              Eso es. Con $I_{zx} \neq 0$, el momento angular $\vec{H}_G$ no va
              según el eje: tiene una componente perpendicular que gira con el
              disco, y su derivada es un par que solo pueden dar los dos
              cojinetes.
          - texto: No hay ninguna, porque con G en el eje el rotor está equilibrado
            mensaje: |
              Con $G$ en el eje está equilibrado **estáticamente**, y eso solo
              anula la resultante. Falta el equilibrado dinámico, que pide
              además $I_{yz} = I_{zx} = 0$, y aquí el disco inclinado no lo
              cumple.
          - texto: De la aceleración centrípeta de G, que describe una circunferencia
            mensaje: |
              $G$ está **sobre** el eje, así que no describe ninguna
              circunferencia: su aceleración es nula y por eso la resultante de
              las reacciones dinámicas también lo es. Lo que queda es un par.
          - texto: De la aceleración angular, que aparece al estar el disco inclinado
            mensaje: |
              El enunciado dice que $\omega$ es constante, así que
              $\alpha = 0$. El término que sobrevive en $\dot{\vec{H}}$ es el de
              $\vec{\omega} \times \vec{H}$, que existe porque los ejes giran
              con el sólido.

      - tipo: calcular
        titulo: El par que hay que dar al disco
        pregunta: |
          Tomando los ejes principales del disco, $I_{X_0} = I_{Y_0} = MR^{2}/4$
          y $I_{Z_0} = MR^{2}/2$. Con $M = 12$ kg, $R = 0{,}25$ m,
          $\omega = 60$ rad/s y $\theta = 30^{\circ}$, ¿cuánto vale el módulo de
          $\dot{\vec{H}}_G$?
        respuesta:
          tipo: magnitud
          valor: '292.3 N·m'
          formato: un par, con su unidad
        distractores:
          - valor: '584.6 N·m'
            mensaje: |
              Has usado $I_{Z_0} = MR^{2}/2$ sola. Lo que aparece en
              $\vec{\omega} \times \vec{H}_G$ es la **diferencia**
              $I_{Z_0} - I_{X_0} = MR^{2}/4$: si el disco fuera una esfera, con
              los tres momentos iguales, no habría par.
          - valor: '168.8 N·m'
            mensaje: |
              Te has quedado en $\operatorname{sen}\theta$. El producto
              $\operatorname{sen}\theta\cos\theta$ vale
              $\tfrac{1}{2}\operatorname{sen}(2\theta)$, y con
              $\theta = 30^{\circ}$ eso es $0{,}433$, no $0{,}5$.
          - valor: '4.87 N·m'
            mensaje: |
              Has puesto $\omega$ donde va $\omega^{2}$. El término
              $\vec{\omega} \times \vec{H}_G$ lleva $\omega$ dos veces: una en
              $\vec{H}_G$ y otra en el producto vectorial.
        pista: |
          $\vec{\omega} = \omega(\operatorname{sen}\theta\,\hat{e}_1 + \cos\theta\,\hat{e}_3)$
          en ejes del disco, y
          $\vec{H}_G = I_{X_0}\omega\operatorname{sen}\theta\,\hat{e}_1 + I_{Z_0}\omega\cos\theta\,\hat{e}_3$.
        desarrollo: |
          Como $\omega$ es constante y los momentos de inercia no cambian en
          ejes del sólido, solo queda el término del arrastre:

          $$
          \dot{\vec{H}}_G = \vec{\omega} \times \vec{H}_G = \left(I_{Z_0} - I_{X_0}\right)\omega^{2}\operatorname{sen}\theta\cos\theta\,\hat{e}_2 = \frac{1}{8}MR^{2}\omega^{2}\operatorname{sen}(2\theta)\,\hat{e}_2
          $$

          $$
          \frac{1}{8} \cdot 12 \cdot 0{,}25^{2} \cdot 60^{2} \cdot \operatorname{sen}60^{\circ} = 292{,}3\ \text{N}\cdot\text{m}
          $$

      - tipo: calcular
        titulo: La reacción en cada cojinete
        pregunta: |
          Los dos cojinetes están a la misma distancia $a = 0{,}4$ m de $G$, y
          la resultante de sus reacciones dinámicas es nula. ¿Cuánto vale
          $A_x$?
        respuesta:
          tipo: magnitud
          valor: '365.4 N'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '730.7 N'
            mensaje: |
              Has dividido el par entre $a$ en vez de entre $2a$. Las dos
              fuerzas son iguales y opuestas y están separadas la distancia
              entera entre cojinetes, que es $2a$.
          - valor: '210.9 N'
            mensaje: |
              Ese es el valor con $\operatorname{sen}\theta$ en lugar de
              $\operatorname{sen}(2\theta)$. Revisa el paso anterior: el par
              lleva $\operatorname{sen}\theta\cos\theta$.
          - valor: '6.09 N'
            mensaje: |
              Has arrastrado $\omega$ en vez de $\omega^{2}$ desde el par. Con
              60 rad/s la diferencia es un factor 60.
        pista: |
          Con $\vec{a}_G = 0$ se tiene $A_x = -B_x$, y esas dos fuerzas separadas
          $2a$ forman un par que tiene que valer lo que $\dot{\vec{H}}_G$.
        desarrollo: |
          $$
          2a\,A_x = \frac{1}{8}MR^{2}\omega^{2}\operatorname{sen}(2\theta)
          \;\Longrightarrow\;
          A_x = -B_x = \frac{MR^{2}\omega^{2}\operatorname{sen}(2\theta)}{16\,a}
          $$

          $$
          A_x = \frac{292{,}3}{2 \cdot 0{,}4} = 365{,}4\ \text{N}
          $$

          Que es la expresión que publica la colección. Y no son fuerzas
          quietas: giran con el disco, así que el cojinete las nota como una
          vibración.

      - tipo: calcular
        titulo: La inclinación más dañina
        pregunta: |
          Manteniendo todo lo demás igual, ¿para qué ángulo $\theta$, en grados
          entre $0$ y $90$, es máxima la reacción dinámica?
        respuesta:
          tipo: numero
          valor: '45'
          tolerancia: 0.5
          formato: un número, en grados
        distractores:
          - valor: '90'
            mensaje: |
              Con $\theta = 90^{\circ}$ el eje de giro está **en** el plano del
              disco, o sea que vuelve a ser una dirección principal:
              $\operatorname{sen}(2\theta) = 0$ y las reacciones dinámicas
              desaparecen. Lo peor está en medio.
          - valor: '0'
            mensaje: |
              Ese es el disco bien montado, perpendicular al eje: el eje es
              principal y no hay reacciones dinámicas. Es el mínimo, no el
              máximo.
          - valor: '30'
            mensaje: |
              Ese es el valor del enunciado, no el peor. La reacción va con
              $\operatorname{sen}(2\theta)$, que crece hasta que
              $2\theta = 90^{\circ}$.
        pista: |
          La reacción es proporcional a $\operatorname{sen}(2\theta)$, y el seno
          vale 1 cuando su argumento vale $90^{\circ}$.
        desarrollo: |
          $$
          \operatorname{sen}(2\theta) = 1 \;\Longrightarrow\; 2\theta = 90^{\circ} \;\Longrightarrow\; \theta = 45^{\circ}
          $$

          Los dos extremos —disco perpendicular al eje y disco que contiene al
          eje— son montajes **principales** y no dan reacciones dinámicas. El
          desequilibrio es máximo a mitad de camino.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: En ejes principales del disco, $\vec{\omega}$ tiene componentes según $X_0$ y según $Z_0$, con $I_{X_0} = MR^{2}/4$ y $I_{Z_0} = MR^{2}/2$.
          - texto: 'Entonces $\vec{H}_G$ no es paralelo a $\vec{\omega}$, y al girar con el disco su derivada vale $\tfrac{1}{8}MR^{2}\omega^{2}\operatorname{sen}(2\theta)$ según $Y$.'
          - texto: 'Ese par lo dan dos fuerzas iguales y opuestas separadas $2a$: $A_x = -B_x = MR^{2}\omega^{2}\operatorname{sen}(2\theta)/(16a)$.'
          - texto: Como la aceleración de G es nula, la resultante de las reacciones dinámicas es nula y por tanto cada una de ellas también.
            trampa: true
            mensaje: |
              La resultante es nula, sí, pero eso solo obliga a que
              $A_x = -B_x$. Dos fuerzas opuestas que no están en la misma recta
              forman un par, y aquí ese par es justamente lo que hay que
              equilibrar.
    resolucion: |
      **Los ejes.** Se toman en $G$ los ejes principales del disco: $Z_0$
      perpendicular al disco y $X_0$ en su plano, girados $\theta$ respecto de
      los del eje de giro. Ahí $I_{X_0} = I_{Y_0} = MR^{2}/4$ y
      $I_{Z_0} = MR^{2}/2$, y la velocidad angular se descompone:

      $$
      \vec{\omega} = \omega\operatorname{sen}\theta\,\hat{e}_1 + \omega\cos\theta\,\hat{e}_3
      $$

      **El momento angular.** Multiplicando componente a componente:

      $$
      \vec{H}_G = I_{X_0}\,\omega\operatorname{sen}\theta\,\hat{e}_1 + I_{Z_0}\,\omega\cos\theta\,\hat{e}_3
      $$

      No es paralelo a $\vec{\omega}$, y ahí está todo el problema: al girar
      con el disco, $\vec{H}_G$ describe un cono y su derivada no es nula
      aunque $\omega$ lo sea.

      **La derivada.** Como los ejes van unidos al sólido, las componentes de
      $\vec{H}_G$ son constantes y solo queda el arrastre:

      $$
      \dot{\vec{H}}_G = \vec{\omega} \times \vec{H}_G = \left(I_{Z_0} - I_{X_0}\right)\omega^{2}\operatorname{sen}\theta\cos\theta\,\hat{e}_2 = \frac{1}{8}MR^{2}\omega^{2}\operatorname{sen}(2\theta)\,\hat{e}_2
      $$

      **Las reacciones.** El centro de gravedad está en el eje, así que
      $\vec{a}_G = 0$ y la resultante es nula: $A_x = -B_x$ y $A_y = -B_y$.
      Tomando momentos en $G$, con los cojinetes a $\pm a$:

      $$
      2a\,A_x = \frac{1}{8}MR^{2}\omega^{2}\operatorname{sen}(2\theta)
      \;\Longrightarrow\;
      A_x = -B_x = \frac{1}{16a}MR^{2}\omega^{2}\operatorname{sen}(2\theta)
      $$

      y $A_y = B_y = 0$, porque el par solo tiene componente según $Y$.

      **Comprobación.** Con $M = 12$ kg, $R = 0{,}25$ m, $a = 0{,}4$ m,
      $\omega = 60$ rad/s y $\theta = 30^{\circ}$ salen 292,3 N·m de par y
      365,4 N en cada cojinete, y el mismo número sale resolviendo las seis
      ecuaciones con el tensor de inercia del disco calculado por integración
      numérica. El máximo está en $\theta = 45^{\circ}$: los dos extremos son
      montajes principales y no cargan nada.
  - id: ejma11-col112-el-disco-soldado-fuera-de-su-centro
    titulo: El disco soldado al eje fuera de su centro, con par motor
    fuente: >-
      Ejercicio 11.2 · Tema 11, «Dinámica del sólido rígido con eje fijo» ·
      Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección publica el
      resultado, contra el que está contrastado el desarrollo, y también se ha
      contrastado con la resolución oficial del profesor. El resultado es
      simbólico, así que las casillas usan valores de prueba nuestros,
      declarados en cada pregunta: masa 20 kg, radio 0,4 m, semidistancia entre
      apoyos 0,5 m, velocidad angular 15 rad/s, aceleración angular
      6 rad/s cuadrado y gravedad 9,8 metros por segundo al cuadrado.
    nivel: practica
    enunciado: |
      Un disco de masa $M$ y radio $R$ está soldado al eje vertical $AB$ en el
      punto $C$, que está a una distancia $R/4$ del centro de gravedad. En el
      instante mostrado, dicho eje rota con una velocidad angular $\omega$ y una
      aceleración angular $\alpha$, ambas positivas en el eje $Z$. Sobre el eje
      se aplica un par $T$, también positivo en el eje $Z$. Calcular las
      reacciones estáticas y dinámicas en los apoyos $A$ y $B$ y el valor del
      par $T$ necesario en función de $\omega$ y $\alpha$.

      <figure>
      <svg viewBox="0 0 340 300" role="img" width="340" height="300" aria-labelledby="ejma11-col112-t ejma11-col112-d">
