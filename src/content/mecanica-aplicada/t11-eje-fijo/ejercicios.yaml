    pide: Las reacciones estáticas y dinámicas en A y B, y la posición de las dos masas de equilibrado.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado pide las reacciones «estáticas y dinámicas». ¿Cómo se
          combinan aquí las dos partes?
        opciones:
          - texto: La parte dinámica resta, porque la aceleración de G apunta hacia el eje, o sea hacia abajo
            correcta: true
            mensaje: |
              Eso es. $G$ está por encima del eje, así que su aceleración
              normal, $\omega^{2}y_G$, va hacia abajo: los apoyos tienen que
              sostener **menos** de lo que pesa la placa.
          - texto: Se suman siempre, porque las dos cargas van en el mismo sentido
            mensaje: |
              Depende de dónde esté $G$. Aquí está arriba y la aceleración
              apunta hacia abajo, así que los dos efectos se restan; media
              vuelta después, con $G$ abajo, se sumarían. Por eso la carga de
              un rotor desequilibrado vibra.
          - texto: No hay parte dinámica, porque la velocidad angular es constante
            mensaje: |
              Constante en módulo, pero $G$ no está en el eje: describe una
              circunferencia de 150 mm y necesita aceleración centrípeta. Con
              5 rad/s eso ya son 7,5 N.
          - texto: La dinámica solo afecta al apoyo más cercano a la placa
            mensaje: |
              Las dos partes se reparten entre los dos apoyos con las mismas
              ecuaciones, y en la misma proporción: la geometría no distingue de
              dónde viene la carga.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **la placa con su eje, sin los
          apoyos, con todas las acciones que actúan sobre ellos**. En la
          perspectiva del enunciado, y sin escala.
        comprueba:
          - punto: |
              **En A, la reacción perpendicular al eje: según X, hacia el
              observador, y según Y.**
            porque: |
              Es un cojinete: sujeta el eje en las dos direcciones
              perpendiculares a él.
          - punto: |
              **En B, esas dos y, además, la axial, según Z.**
            porque: |
              Uno de los dos apoyos tiene que sujetar el eje a lo largo; la
              resolución oficial se la da a B.
          - punto: |
              **El peso, Mg, en el centro de la placa.**
            porque: |
              La placa es homogénea: su centro de gravedad es su centro
              geométrico.
          - punto: |
              **Todas las componentes en su sentido positivo.**
            porque: |
              Así no hay que adivinar de antemano qué apoyo empuja y cuál tira:
              los signos los dan las ecuaciones.
          - punto: |
              **El par P a lo largo del eje.**
            porque: |
              El enunciado lo da según Z; cuánto vale lo dicen las ecuaciones.
