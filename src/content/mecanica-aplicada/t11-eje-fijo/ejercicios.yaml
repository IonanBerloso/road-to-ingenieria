        <desc id="ejma11-col112-d">Eje vertical con el apoyo B arriba y el apoyo A abajo, cada uno a una distancia a del plano del disco. El disco está soldado al eje en el punto C, y su centro de gravedad G queda a una distancia R cuarta parte de C, sobre el eje X. El eje gira con velocidad angular omega y aceleración angular alfa positivas según Z, y lleva aplicado un par T también según Z.</desc>
