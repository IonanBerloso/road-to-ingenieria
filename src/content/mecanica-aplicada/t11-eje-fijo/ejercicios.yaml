      - **En A**, $A_x$ y $A_y$; **en B**, $B_x$, $B_y$ y, a lo largo del
        eje, $B_z$.
      - **En G**, el peso, mg, a lo largo del eje.

      **2. Incógnitas.** Las reacciones dinámicas, las que añade el giro:
      $A_x$, $A_y$, $B_x$ y $B_y$. Las estáticas solo sostienen el peso,
      $B_z = mg$.

      **3. Ecuaciones.** Se toman en G los ejes principales del disco, unidos
      a él: $Z_0$ perpendicular al disco, girado θ desde Z hacia X; $X_0$ en
      su plano, θ por debajo de X; e $Y_0 = Y$. Ahí
      $I_{X_0} = I_{Y_0} = MR^{2}/4$ e $I_{Z_0} = MR^{2}/2$, y la vertical
      se reparte entre $Z_0$ y $-X_0$:

      $$
      \vec{\omega} = -\omega\operatorname{sen}\theta\,\hat{e}_1 + \omega\cos\theta\,\hat{e}_3,
      \qquad
      \vec{H}_G = -I_{X_0}\,\omega\operatorname{sen}\theta\,\hat{e}_1 + I_{Z_0}\,\omega\cos\theta\,\hat{e}_3
      $$

