      </svg>
      <figcaption>

      La masa va a R del eje, del lado contrario a G, y por debajo de O. A trazos, donde quedaría tomando el producto de inercia de una masa puntual en G: a la altura de G, por encima de O.

      </figcaption>
      </figure>

      **5. Comprobación.** Por momentos respecto de $B$ en lugar de $O$, que
      dan $A_y$ sin pasar por $B_y$. Respecto de $B$, el producto de inercia
      cambia con la altura:
      $I_{yz,B} = I_{yz} + 2R \cdot 2M\,y_G = MR^{2}\left(\tfrac{1}{12} + \tfrac{2}{3} - \tfrac{4}{\pi}\right) = -0{,}5232\,MR^{2}$.
      Con $MR^{2} = 0{,}81$ kg·m², $I_{yz,B}\,\omega^{2} = -169{,}53$ N·m; el
      peso da $2Mg\,y_G = -8{,}02$ N·m, y $A$ tiene el brazo $4R = 1{,}2$ m:

      $$
      -1{,}2\,A_y - 2Mg\,y_G = I_{yz,B}\,\omega^{2}
      \;\Rightarrow\;
      1{,}2\,A_y = 169{,}53 + 8{,}02 = 177{,}55
      \;\Rightarrow\;
      A_y = 147{,}96\ \text{N}
      $$

      Y de las fuerzas, $B_y = 327{,}54 - 147{,}96 = 179{,}58$ N. La masa,
      sustituida, anula las dos condiciones: $m\,R = 0{,}819$ kg·m frente a
      $2M\,y_G = -0{,}819$ kg·m, y $m\,R\,z_m = -0{,}0675$ kg·m² frente a
      $I_{yz} = 0{,}0675$ kg·m².

      **Lo que dice el resultado.** Con $\omega$ constante no hace falta par,
      pero los apoyos llevan entre los dos 327,5 N horizontales, casi el
      doble del peso, que giran con el conjunto. La masa de equilibrado va
      por debajo de $O$, no a la altura de $G$: el producto de inercia de los
      dos cuerpos no es el de una masa puntual en $G$, que daría
      $-0{,}0505\,MR^{2}$, con el signo cambiado.

  - id: ejma11-col115-la-muela-mal-montada
    titulo: La muela mal montada, y las dos masas que la equilibran
    fuente: >-
      Ejercicio 11.5 · Tema 11, «Dinámica del sólido rígido con eje fijo» ·
      Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección publica el
      resultado, contra el que está contrastado el desarrollo, y también se ha
      contrastado con la resolución oficial del profesor. Las cuentas están
      hechas con g igual a 9,8 metros por segundo al cuadrado, que es con lo que
      salen los valores publicados. El enunciado se copia tal cual, también su
      «fuerza del eje» por «fuera del eje». En la figura, el giro va en
      sentido antihorario, como en la del curso.
    nivel: practica
    antes:
      idea: |
        Para un sólido que gira alrededor de un eje fijo, la resultante es la
        masa por la aceleración del centro de gravedad, y el momento respecto
        de un punto O del eje es la derivada del momento angular respecto de
        O. Un punto a una distancia r del eje tiene una aceleración hacia el
        eje y otra tangente. Un rotor está equilibrado estáticamente cuando
        su centro de gravedad está en el eje, y dinámicamente cuando, además,
        los dos productos de inercia que mezclan el eje con las otras dos
        direcciones son nulos.
      formula: |
        $$
        \sum\vec{F} = M\vec{a}_G,
        \qquad
        \sum\vec{M}_O = \dot{\vec{H}}_O,
        \qquad
        a_n = \omega^{2} r,\quad a_t = \alpha\,r
        $$

        $$
        x_G = y_G = 0,
        \qquad
        I_{xz} = \sum m\,x\,z = 0,
        \qquad
        I_{yz} = \sum m\,y\,z = 0
        $$
      reconocer: |
        Antes de calcular se mira cómo está repartida la masa de la muela
        respecto del eje.
    enunciado: |
      Una muela, disco de masa $M$ = 4 kg y radio $R$ = 100 mm, está girando a
      una velocidad angular $\omega$ = 10 rad/s y $\alpha$ = 2 rad/s²
      accionada por el par $P$. Debido a una imprecisión en el montaje, el
      centro de gravedad está fuerza del eje de giro $Z$ una distancia $0{,}1R$.

      a) Calcular las reacciones sobre los ejes en los apoyos $A$ y $B$,
      incluido el par $P$.

      b) Se desea equilibrar el conjunto con 2 masas puntuales
      ($m = 0{,}1M$) situadas según los planos $z = -R$ y $z = 0{,}5R$,
      indicados en la figura. Calcular las posiciones de ambas masas y dibujar
      el conjunto equilibrado.

