      Las componentes son constantes, y los ejes giran con el disco,
      $\vec{\Omega} = \vec{\omega}$:

      $$
      \dot{\vec{H}}_G = \vec{\omega}\times\vec{H}_G = \left(I_{Z_0} - I_{X_0}\right)\omega^{2}\operatorname{sen}\theta\cos\theta\,\hat{e}_2
      $$

      G está en el eje y no se mueve, $\vec{a}_G = \vec{0}$. Las fuerzas y
      los momentos en G, con A a $+a$ y B a $-a$ sobre el eje:

      $$
      A_x + B_x = 0,
      \qquad
      A_y + B_y = 0,
      \qquad
      a\,(B_y - A_y) = 0,
      \qquad
      a\,(A_x - B_x) = \left(I_{Z_0} - I_{X_0}\right)\omega^{2}\operatorname{sen}\theta\cos\theta
      $$

      **4. Resultados.** Con $I_{Z_0} - I_{X_0} = MR^{2}/4$:

      $$
      \dot{\vec{H}}_G = \frac{1}{8}MR^{2}\omega^{2}\operatorname{sen}(2\theta)\,\hat{e}_2,
      \qquad
      A_x = -B_x = \frac{MR^{2}\omega^{2}\operatorname{sen}(2\theta)}{16\,a},
      \qquad
      A_y = B_y = 0
      $$

      Es el resultado de la colección. Con los valores de prueba, $M = 12$ kg,
      $R = 0{,}25$ m, $a = 0{,}4$ m, $\omega = 60$ rad/s y $\theta = 30^{\circ}$:
      $0{,}125 \cdot 12 \cdot 0{,}0625 \cdot 3600 \cdot 0{,}8660 = 292{,}3\ \text{N}\cdot\text{m}$
      de par, y $292{,}3/0{,}8 = 365{,}4$ N en cada cojinete.

      **5. Comprobación.** Con los ejes del eje de giro, sin pasar a los del
      disco: por el producto de inercia. En ejes X, Y, Z, el disco tiene
      $I_{xz} = \int x\,z\,dm$, y al girar alrededor de Z con ω constante el
      momento angular tiene una componente $-I_{xz}\,\omega$ según X que gira
      con él; su derivada, de módulo $\omega^{2}\,|I_{xz}|$, va según Y. Con
      $x = x_0\cos\theta + z_0\operatorname{sen}\theta$,
      $z = -x_0\operatorname{sen}\theta + z_0\cos\theta$, $z_0 = 0$ en el
      disco delgado e $\int x_0^{2}\,dm = MR^{2}/4$:

      $$
      I_{xz} = -\operatorname{sen}\theta\cos\theta\int x_0^{2}\,dm = -\tfrac14 MR^{2}\operatorname{sen}\theta\cos\theta
      $$

      $$
      |I_{xz}| = 0{,}25 \cdot 12 \cdot 0{,}0625 \cdot 0{,}4330 = 0{,}08119\ \text{kg}\cdot\text{m}^{2},
      \qquad
      \omega^{2}\,|I_{xz}| = 3600 \cdot 0{,}08119 = 292{,}3\ \text{N}\cdot\text{m}
      $$

      Lo mismo.

      **Lo que dice el resultado.** El disco está equilibrado estáticamente,
      con G en el eje, pero el eje no es dirección principal: los cojinetes
      llevan dos fuerzas opuestas que giran con el disco, una vibración. Con
      $\operatorname{sen}(2\theta)$, el máximo está en 45°; los dos extremos,
      el disco perpendicular al eje y el disco que lo contiene, son montajes
      principales y no cargan nada.

  - id: ejma11-col112-el-disco-soldado-fuera-de-su-centro
    titulo: El disco soldado al eje fuera de su centro, con par motor
    fuente: >-
      Ejercicio 11.2 · Tema 11, «Dinámica del sólido rígido con eje fijo» ·
      Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección publica el
      resultado, contra el que está contrastado el desarrollo, y también se ha
      contrastado con la resolución oficial del profesor. El resultado es
      simbólico, así que las casillas usan valores de prueba nuestros,
      declarados en cada pregunta: masa 20 kg, radio 0,4 m, semidistancia entre
      apoyos 0,5 m, velocidad angular 15 rad/s, aceleración angular
      6 rad/s cuadrado y gravedad 9,8 metros por segundo al cuadrado. En la
      figura, el disco va centrado en G, como en la del curso.
    nivel: practica
    antes:
      idea: |
        Un sólido que gira alrededor de un eje fijo cumple las dos ecuaciones
        de siempre: la resultante de las fuerzas es la masa por la aceleración
        del centro de gravedad, y el momento respecto de G es la derivada del
        momento angular respecto de G. Un punto a una distancia r del eje
        tiene una aceleración hacia el eje y otra tangente a su trayectoria.
        El momento de inercia respecto de un eje paralelo al que pasa por G
        se obtiene con el teorema de Steiner.
      formula: |
        $$
        \sum\vec{F} = M\vec{a}_G,
        \qquad
        \sum\vec{M}_G = \dot{\vec{H}}_G,
        \qquad
        a_n = \omega^{2} r,\quad a_t = \alpha\,r,
        \qquad
        I_{e} = I_{G} + M d^{2}
        $$
      reconocer: |
        Antes de calcular se mira cómo está colocado el disco respecto del eje
        de giro.
    enunciado: |
      Un disco de masa $M$ y radio $R$ está soldado al eje vertical $AB$ en el
      punto $C$, que está a una distancia $R/4$ del centro de gravedad. En el
      instante mostrado, dicho eje rota con una velocidad angular $\omega$ y una
      aceleración angular $\alpha$, ambas positivas en el eje $Z$. Sobre el eje
      se aplica un par $T$, también positivo en el eje $Z$. Calcular las
      reacciones estáticas y dinámicas en los apoyos $A$ y $B$ y el valor del
      par $T$ necesario en función de $\omega$ y $\alpha$.

