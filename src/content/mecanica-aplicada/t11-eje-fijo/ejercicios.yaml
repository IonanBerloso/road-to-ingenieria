      <figcaption>

      El disco está soldado al eje en **C**, y su centro de gravedad **G** queda
      a **R/4** de él, sobre el eje **X**. Los dos apoyos están a la misma
      distancia **a** del plano del disco: **B** arriba y **A** abajo. El par
      **T** y la rotación son positivos según **Z**.

      </figcaption>
      </figure>
    pide: Las reacciones estáticas y dinámicas en A y en B, y el par T.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué son aquí las reacciones **estáticas**?
        opciones:
          - texto: Las que habría con el disco parado, y no son nulas porque el peso está aplicado en G, que no está en el eje
            correcta: true
            mensaje: |
              Eso es. Con todo quieto, el peso $Mg$ aplicado a $R/4$ del eje da
              un momento que los dos apoyos tienen que equilibrar con dos
              fuerzas horizontales opuestas.
          - texto: Ninguna, porque el peso es vertical y las reacciones perpendiculares al eje son horizontales
            mensaje: |
              Una fuerza vertical descentrada produce un **momento**
              horizontal, y ese momento se equilibra con dos fuerzas
              horizontales separadas $2a$. Por eso $A_x$ y $B_x$ tienen una
              parte que no depende de $\omega$.
          - texto: Las que da el par T, porque T no depende de la velocidad
            mensaje: |
              El par $T$ es justo lo contrario: vale $9MR^{2}\alpha/16$, así que
              es enteramente dinámico y desaparece si el eje no acelera.
          - texto: Las que dependen de omega al cuadrado, porque el régimen es estacionario
            mensaje: |
              Todo lo que lleva $\omega^{2}$ o $\alpha$ es **dinámico**, exista o
              no aceleración angular. «Estático» aquí significa «con el sólido
              quieto», no «a velocidad constante».

      - tipo: calcular
        titulo: Las reacciones según Y
        pregunta: |
          Con $M = 20$ kg, $R = 0{,}4$ m, $a = 0{,}5$ m y $\alpha = 6$ rad/s²,
          ¿cuánto vale $A_y$?
        respuesta:
          tipo: magnitud
          valor: '6 N'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '12 N'
            mensaje: |
              Esa es la fuerza total, $M\,\alpha\,x_G$. La ecuación de momentos
              según $X$ da $A_y = B_y$, así que los dos apoyos se reparten esa
              resultante a partes iguales.
          - valor: '225 N'
            mensaje: |
              Has usado $\omega^{2}$ donde va $\alpha$. La componente $y$ de la
              aceleración de $G$ es la **tangencial**, $\alpha\,x_G$; la que
              lleva $\omega^{2}$ es la normal, que va según $x$.
        pista: |
          $a_{Gy} = \alpha\,x_G - \omega^{2} y_G$, y aquí $x_G = R/4$ e
          $y_G = 0$. Y de los momentos según $X$ sale $A_y = B_y$.
        desarrollo: |
          $$
          A_y + B_y = M\,\alpha\,\frac{R}{4} = 20 \cdot 6 \cdot 0{,}1 = 12\ \text{N}
          $$

          Los momentos según $X$ dan $a(A_y - B_y) = 0$, así que

          $$
          A_y = B_y = \frac{MR\alpha}{8} = 6\ \text{N}
          $$

          Toda esta componente es dinámica: se va con $\alpha$.

      - tipo: calcular
        titulo: La reacción en A según X
        pregunta: |
          Con $\omega = 15$ rad/s y $g = 9{,}8$ m/s², ¿cuánto vale $A_x$, con su
          signo?
        respuesta:
          tipo: magnitud
          valor: '-205.4 N'
          formato: una fuerza, con su signo y su unidad
        distractores:
          - valor: '-244.6 N'
            mensaje: |
              Ese es $B_x$. Las dos partes se suman con signos distintos en cada
              apoyo: la dinámica, $-MR\omega^{2}/8$, es igual en los dos, y la
              estática, $\pm MgR/(8a)$, cambia de signo.
          - valor: '-225 N'
            mensaje: |
              Esa es solo la parte dinámica, $-MR\omega^{2}/8$. Falta la
              estática que produce el peso descentrado, $+MgR/(8a) = 19{,}6$ N.
          - valor: '19.6 N'
            mensaje: |
              Esa es solo la reacción estática, la que habría con el disco
              parado. El enunciado pide las dos, y la dinámica es aquí diez
              veces mayor.
        pista: |
          De las fuerzas, $A_x + B_x = -M\omega^{2}R/4$; de los momentos según
          $Y$, $A_x - B_x = MgR/(4a)$.
        desarrollo: |
          $$
          A_x + B_x = M\left(-\omega^{2}\frac{R}{4}\right) = -300\ \text{N}
          \qquad
          A_x - B_x = \frac{MgR}{4a} = 39{,}2\ \text{N}
          $$

          $$
          A_x = -\frac{MR}{8}\left(\omega^{2} - \frac{g}{a}\right) = -\frac{20 \cdot 0{,}4}{8}\left(225 - 19{,}6\right) = -205{,}4\ \text{N}
          $$

          y $B_x = -\dfrac{MR}{8}\left(\omega^{2} + \dfrac{g}{a}\right) = -244{,}6$ N,
          que es lo que publica la colección.

      - tipo: calcular
        titulo: El par necesario
        pregunta: |
          ¿Cuánto vale el par $T$?
        respuesta:
          tipo: magnitud
          valor: '10.8 N·m'
          formato: un par, con su unidad
        distractores:
          - valor: '9.6 N·m'
            mensaje: |
              Has usado $I_{Gz} = MR^{2}/2$ olvidando que el eje de giro pasa
              por $C$, no por $G$. Con Steiner,
              $I_{Cz} = MR^{2}/2 + M(R/4)^{2} = 9MR^{2}/16$.
          - valor: '4.8 N·m'
            mensaje: |
              $MR^{2}/4$ es el momento de inercia respecto de un **diámetro**
              del disco. El que gira aquí es el eje perpendicular al disco, y
              ese vale $MR^{2}/2$ antes de trasladarlo a $C$.
          - valor: '27 N·m'
            mensaje: |
              Has puesto $\omega$ donde va $\alpha$. La ecuación según el eje es
              $M_z = I_z\,\alpha$: la velocidad angular no aparece.
        pista: |
          La ecuación de momentos según $Z$ no lleva reacciones de apoyo:
          $T - \tfrac{R}{4}(A_y + B_y) = I_{Gz}\,\alpha$.
        desarrollo: |
          $$
          T = I_{Gz}\,\alpha + \frac{R}{4}\left(A_y + B_y\right) = \frac{MR^{2}}{2}\alpha + \frac{MR^{2}}{16}\alpha = \frac{9MR^{2}\alpha}{16}
          $$

          $$
          T = \frac{9 \cdot 20 \cdot 0{,}16 \cdot 6}{16} = 10{,}8\ \text{N}\cdot\text{m}
          $$

          Que es lo mismo que $I_{Cz}\,\alpha$ con el momento de inercia
          trasladado al eje real de giro.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Con $G$ a $R/4$ del eje, su aceleración vale $a_{Gx} = -\omega^{2}R/4$ y $a_{Gy} = \alpha R/4$.'
          - texto: 'De $\vec{F} = M\vec{a}_G$ salen las dos sumas $A_x + B_x$ y $A_y + B_y$, y de los momentos, las dos diferencias.'
          - texto: 'La ecuación según $Z$, sin reacciones, da $T = 9MR^{2}\alpha/16$.'
          - texto: Como el disco es simétrico respecto de su plano, el eje de giro es principal y no hay reacciones dinámicas.
            trampa: true
            mensaje: |
              Los productos de inercia sí son nulos —el plano del disco es de
              simetría—, y por eso $\dot{\vec{H}}$ solo tiene componente según
              $Z$. Pero el equilibrado **estático** falla: $G$ está a $R/4$ del
              eje, y esa es la fuente de las reacciones dinámicas de este
              problema.
    resolucion: |
      **Los ejes y los datos de inercia.** Origen en $G$, con $z$ paralelo al
      eje de giro y el disco en el plano $xy$: $I_{Gx} = I_{Gy} = MR^{2}/4$,
      $I_{Gz} = MR^{2}/2$ y los tres productos de inercia nulos. El eje de giro
      pasa por $C$, a $R/4$ de $G$, así que $G$ describe una circunferencia de
      radio $R/4$.

      **La aceleración de G.**

      $$
      \vec{a}_G = -\omega^{2}\frac{R}{4}\,\hat{\imath} + \alpha\frac{R}{4}\,\hat{\jmath}
      $$

      **El momento angular.** Al ser nulos los productos de inercia,
      $\vec{H}_G = I_{Gz}\,\omega\,\hat{k}$ y $\dot{\vec{H}}_G = I_{Gz}\,\alpha\,\hat{k}$:
      el término $\vec{\omega} \times \vec{H}_G$ se anula.

      **Las seis ecuaciones.** Con $A$ y $B$ a $\mp a$ del plano del disco y el
      peso aplicado en $G$:

      $$
      A_x + B_x = -\frac{M\omega^{2}R}{4}
      \qquad
      A_y + B_y = \frac{M\alpha R}{4}
      \qquad
      A_z + B_z = Mg
      $$

      $$
      a\left(A_y - B_y\right) = 0
      \qquad
      \frac{R}{4}\left(A_z + B_z\right) - a\left(A_x - B_x\right) = 0
      \qquad
      T - \frac{R}{4}\left(A_y + B_y\right) = \frac{MR^{2}}{2}\alpha
      $$

      **El resultado.**

      $$
      A_y = B_y = \frac{MR\alpha}{8}
      \qquad
      A_x = -\frac{MR}{8}\left(\omega^{2} - \frac{g}{a}\right)
      \qquad
      B_x = -\frac{MR}{8}\left(\omega^{2} + \frac{g}{a}\right)
      \qquad
      T = \frac{9MR^{2}\alpha}{16}
      $$

      Separando las dos familias: la **estática** es la que queda con
      $\omega = \alpha = 0$, o sea $\pm MgR/(8a)$ en $A_x$ y $B_x$; todo lo
      demás es **dinámica**. Con los valores de prueba, $A_y = B_y = 6$ N,
      $A_x = -205{,}4$ N, $B_x = -244{,}6$ N y $T = 10{,}8$ N·m, y los mismos
      números salen resolviendo las seis ecuaciones con el tensor de inercia
      obtenido por integración numérica.
  - id: ejma11-col113-dos-cuadrados-en-planos-perpendiculares
    titulo: Dos cuadrados en planos perpendiculares, y las dos masas que los equilibran
    fuente: >-
      Ejercicio 11.3 · Tema 11, «Dinámica del sólido rígido con eje fijo» ·
      Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección publica el
      resultado, contra el que está contrastado el desarrollo, y también se ha
      contrastado con la resolución oficial del profesor. El resultado es
      simbólico, así que las casillas usan valores de prueba nuestros,
      declarados en cada pregunta: masa 6 kg por cuadrado, lado 0,4 m y
      gravedad 9,8 metros por segundo al cuadrado.
    nivel: practica
    enunciado: |
      Dos cuadrados iguales, de masa $M$ y lado $L$, están situados en planos
      perpendiculares y giran alrededor del eje $AD$ vertical con $\omega$ por
      la acción del par $P$. Sabiendo que $D$ no puede absorber esfuerzos
      verticales, calcular:

      a) Valor del par $P$ en $t = 0$.

      b) Reacciones en $A$ y $D$ en $t = 0$.

      c) Si se equilibra el sistema con 2 masas iguales de valor $M$, colocadas
      respectivamente en dos planos perpendiculares al eje $Z$ que pasan por $B$
      y por $C$, determinar su posición.

      DATOS:

      - Velocidad angular

      $$
      \omega = \sqrt{\frac{2g}{L}}\,\operatorname{sen}\!\left(\sqrt{\frac{2g}{L}}\,t\right)
      $$

      - Matriz de inercia del conjunto referida al sistema de ejes centrados en
      $A$.

      $$
      [I_A] = \begin{bmatrix}
      9ML^{2} & 0 & -\dfrac{5ML^{2}}{4} \\[4pt]
      0 & 9ML^{2} & -\dfrac{3ML^{2}}{4} \\[4pt]
      -\dfrac{5ML^{2}}{4} & -\dfrac{3ML^{2}}{4} & \dfrac{2ML^{2}}{3}
      \end{bmatrix}
      $$

      <figure>
      <svg viewBox="0 0 300 350" role="img" width="300" height="350" aria-labelledby="ejma11-col113-t ejma11-col113-d">
        <title id="ejma11-col113-t">Dos placas cuadradas soldadas en planos perpendiculares a un eje vertical</title>
        <desc id="ejma11-col113-d">Eje vertical AD de longitud cuatro L, empotrado en A abajo y guiado en D arriba. Desde A, a una altura L, está el punto B; entre B y una altura de dos L hay un cuadrado de lado L en el plano YZ, hacia el eje Y. Entre dos L y tres L hay otro cuadrado de lado L en el plano XZ, hacia el eje X. El punto C está a tres L y desde ahí queda otra longitud L hasta D. El par P y la velocidad angular omega van según el eje Z, que es vertical.</desc>
        <defs>
          <marker id="ejma11-col113-fi" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
