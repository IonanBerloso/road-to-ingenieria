        <line x1="40" y1="132" x2="40" y2="97" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="47" y="130" font-size="10" text-anchor="start" fill="var(--d2-tinta)">R<tspan font-size="7.5" dy="2.5">A</tspan><tspan dy="-2.5"></tspan></text>
        <line x1="280" y1="132" x2="280" y2="97" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="273" y="130" font-size="10" text-anchor="end" fill="var(--d2-tinta)">R<tspan font-size="7.5" dy="2.5">B</tspan><tspan dy="-2.5"></tspan></text>
        <text x="34" y="96" font-size="9" text-anchor="end" fill="var(--faint)">A</text>
        <text x="286" y="96" font-size="9" text-anchor="start" fill="var(--faint)">B</text>
      </svg>
      <figcaption>

      Solo el eje, sin las masas, y solo lo que añade el giro. Cada masa tira del eje hacia fuera, a lo largo de su brazo.

      </figcaption>
      </figure>

      - **En los brazos**, $F_1$ y $F_2$, las fuerzas con las que las masas
        tiran del eje hacia fuera.
      - **En A y en B**, las reacciones dinámicas $R_A$ y $R_B$.

      Los pesos, 0,98 N por masa, dan las reacciones estáticas aparte.

      **2. Incógnitas.** Las reacciones dinámicas $R_A$ y $R_B$.

      **3. Ecuaciones.** Cada masa tira con $F = m\,r\,\omega^{2}$. El eje no
      tiene masa: está en equilibrio. Con las fuerzas hacia arriba positivas
      y las distancias desde A:

      $$
      R_A + R_B + F_1 - F_2 = 0,
      \qquad
      0{,}2\,F_1 - 0{,}4\,F_2 + 0{,}6\,R_B = 0
      $$

      **4. Resultados.** $F_1 = F_2 = 0{,}1 \cdot 0{,}2 \cdot 2500 = 50\ \text{N}$.
      Su resultante es nula, y el centro de gravedad del conjunto está en el
      eje; pero no están en la misma recta, y forman un par de
      $50 \cdot 0{,}2 = 10\ \text{N}\cdot\text{m}$:

      $$
      R_B = \frac{0{,}4 \cdot 50 - 0{,}2 \cdot 50}{0{,}6} = 16{,}67\ \text{N},
      \qquad
      R_A = -R_B = -16{,}67\ \text{N}
      $$

      Iguales y opuestas, y girando con el eje.

      **5. Comprobación.** Por el producto de inercia, sin aislar el eje. Con
      x a lo largo del eje desde A e y en el plano de las masas, el momento
      angular respecto de A tiene, además de la componente del eje, otra
      $-I_{xy}\,\omega$ perpendicular a él, que gira con el eje. Su derivada
      es el momento que tienen que dar los cojinetes, de módulo
      $\omega^{2}\,|I_{xy}|$:

      $$
      I_{xy} = \sum m\,x\,y = 0{,}1 \cdot 0{,}2 \cdot 0{,}2 - 0{,}1 \cdot 0{,}4 \cdot 0{,}2 = -0{,}004\ \text{kg}\cdot\text{m}^{2},
      \qquad
      \omega^{2}\,|I_{xy}| = 2500 \cdot 0{,}004 = 10\ \text{N}\cdot\text{m}
      $$

      Ese par lo dan $R_A$ y $R_B$, separadas 0,6 m: $10/0{,}6 = 16{,}67$ N.
      Lo mismo.

      **Lo que dice el resultado.** El rotor está equilibrado estáticamente,
      con el centro de gravedad en el eje, pero no dinámicamente: el eje no
      es dirección principal, $I_{xy} \neq 0$, y los cojinetes llevan un par
      que gira con él. Se corrige con dos masas en dos planos que anulen el
      producto de inercia sin mover el centro de gravedad.

  - id: ejma11-col111-el-disco-inclinado-sobre-su-eje
    titulo: El disco inclinado, y las reacciones que aparecen solo por girar
    fuente: >-
      Ejercicio 11.1 · Tema 11, «Dinámica del sólido rígido con eje fijo» ·
      Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección publica el
      resultado, contra el que está contrastado el desarrollo, y también se ha
      contrastado con la resolución oficial del profesor. El resultado es
      simbólico, así que las casillas usan valores de prueba nuestros,
      declarados en cada pregunta: masa 12 kg, radio 0,25 m, semidistancia
      entre cojinetes 0,4 m, velocidad angular 60 rad/s e inclinación
      30 grados. En la figura, el disco va inclinado como en la del curso,
      bajando hacia X0.
    nivel: practica
    antes:
      idea: |
        La resultante de las fuerzas es la masa por la aceleración del centro
        de gravedad, y el momento respecto de él, la derivada del momento
        angular. En ejes principales, cada componente del momento angular es
        el momento de inercia de ese eje por la componente de la velocidad
        angular. Si esos ejes giran, la derivada tiene dos partes: la de las
        componentes y la del giro de los propios ejes.
      formula: |
        $$
        \sum\vec{F} = M\vec{a}_G,
        \qquad
        \sum\vec{M}_G = \dot{\vec{H}}_G,
        \qquad
        \dot{\vec{H}}_G = \left(\frac{d\vec{H}_G}{dt}\right)_{\text{ejes}} + \vec{\Omega}\times\vec{H}_G
        $$

        $$
        \vec{H}_G = I_{1}\,\omega_{1}\,\hat{e}_1 + I_{2}\,\omega_{2}\,\hat{e}_2 + I_{3}\,\omega_{3}\,\hat{e}_3
        \quad\text{en ejes principales}
        $$
      reconocer: |
        Antes de calcular se mira cómo está colocado el disco respecto del eje
        de giro.
    enunciado: |
      Un disco circular de radio $R$ y masa $M$ gira alrededor del eje $AB$ con
      una velocidad angular $\omega$ constante. El disco está inclinado un
      ángulo $\theta$ respecto al eje de giro. Determinar las reacciones
      dinámicas que se producen en $A$ y en $B$.

