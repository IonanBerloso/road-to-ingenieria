      - tipo: calcular
        titulo: La aceleración angular en el arranque
        pregunta: |
          Con $L = 0{,}4$ m y $g = 9{,}8$ m/s², ¿cuánto vale $\alpha$ en
          $t = 0$?
        respuesta:
          tipo: numero
          valor: '49'
          tolerancia: 0.2
          formato: un número, en rad/s al cuadrado
        distractores:
          - valor: '7'
            mensaje: |
              Ese es $\sqrt{2g/L}$, la amplitud de la velocidad angular, en
              rad/s. La aceleración es su derivada, y sale multiplicada otra vez
              por la misma raíz: $2g/L$.
          - valor: '24.5'
            mensaje: |
              Te has dejado el 2. El dato es $\sqrt{2g/L}$ y al derivar aparece
              el cuadrado de esa raíz, que es $2g/L = 49$.
          - valor: '0'
            mensaje: |
              Cero es $\omega(0)$, no $\alpha(0)$. Que la velocidad angular
              arranque de cero no impide que esté cambiando deprisa.
        pista: |
          Deriva $\omega(t) = k\operatorname{sen}(kt)$ con $k = \sqrt{2g/L}$ y
          evalúa en $t = 0$.
        desarrollo: |
          $$
          \alpha = \frac{d\omega}{dt} = k^{2}\cos(kt)
          \qquad
          k^{2} = \frac{2g}{L}
          $$

          $$
          \alpha(0) = \frac{2 \cdot 9{,}8}{0{,}4} = 49\ \text{rad/s}^{2}
          $$

      - tipo: calcular
        titulo: El par P en el arranque
        pregunta: |
          Con $M = 6$ kg, ¿cuánto vale el par $P$ en $t = 0$?
        respuesta:
          tipo: magnitud
          valor: '31.36 N·m'
          formato: un par, con su unidad
        distractores:
          - valor: '15.68 N·m'
            mensaje: |
              Has usado el momento de inercia de un solo cuadrado. El tercer
              elemento de la diagonal, $2ML^{2}/3$, ya es el del **conjunto**:
              cada cuadrado aporta $ML^{2}/3$ respecto del eje.
          - valor: '423.4 N·m'
            mensaje: |
              Has cogido el primer elemento de la diagonal, $9ML^{2}$, que es
              $I_{xx}$. La ecuación según el eje de giro lleva $I_{zz}$, el
              tercero.
          - valor: '4.48 N·m'
            mensaje: |
              Has multiplicado por $\sqrt{2g/L} = 7$ en vez de por
              $\alpha = 49$. Revisa el paso anterior.
        pista: |
          La ecuación de momentos según $Z$ no lleva reacciones:
          $P = I_{zz}\,\alpha$ con $I_{zz} = 2ML^{2}/3$.
        desarrollo: |
          $$
          P = I_{zz}\,\alpha = \frac{2ML^{2}}{3}\cdot\frac{2g}{L} = \frac{4MgL}{3}
          $$

          $$
          P = \frac{4 \cdot 6 \cdot 9{,}8 \cdot 0{,}4}{3} = 31{,}36\ \text{N}\cdot\text{m}
          $$

      - tipo: calcular
        titulo: La reacción horizontal en D
        pregunta: |
          El centro de gravedad del conjunto está en $(L/4,\ L/4,\ 2L)$. Tomando
          momentos en $A$, ¿cuánto vale $D_y$?
        respuesta:
          tipo: magnitud
          valor: '29.4 N'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '-7.35 N'
            mensaje: |
              Has igualado a cero la suma de momentos, o sea has supuesto
              $\dot{H}_{Ax} = 0$. No lo es: el producto de inercia
              $-5ML^{2}/4$ de la matriz hace que $\vec{H}_A$ tenga componente
              según $x$, y su derivada vale $-5MgL/2$.
          - valor: '-29.4 N'
            mensaje: |
              El módulo está bien y el signo no. Con
              $-MgL/2 - 4L\,D_y = -5MgL/2$ sale $D_y = +Mg/2$.
          - valor: '58.8 N'
            mensaje: |
              Ese es $Mg$, sin el medio. Al despejar,
              $4L\,D_y = -MgL/2 + 5MgL/2 = 2MgL$, y $D_y = Mg/2$.
        pista: |
          $\dot{H}_{Ax} = -\tfrac{5}{4}ML^{2}\alpha = -\tfrac{5}{2}MgL$, y el
          peso da $-MgL/2$ según $x$. La reacción de $D$ tiene el brazo $4L$.
        desarrollo: |
          El momento en $A$ según $x$ lo dan el peso del conjunto, aplicado en
          $G$, y la reacción horizontal de $D$:

          $$
          -2Mg\,\frac{L}{4} - 4L\,D_y = \dot{H}_{Ax} = -\frac{5ML^{2}}{4}\,\frac{2g}{L} = -\frac{5MgL}{2}
          $$

          $$
          D_y = \frac{Mg}{2} = \frac{6 \cdot 9{,}8}{2} = 29{,}4\ \text{N}
          $$

          Y por el mismo camino según $y$, $D_x = -Mg/2 = -29{,}4$ N. De las
          fuerzas salen entonces $A_x = -Mg/2$, $A_y = Mg/2$ y $A_z = 2Mg$,
          porque $D$ no puede dar reacción vertical.

      - tipo: calcular
        titulo: Dónde va la masa del plano de B
        pregunta: |
          Para equilibrar se colocan dos masas de valor $M$ en los planos
          $z = L$ (por $B$) y $z = 3L$ (por $C$). ¿Cuánto vale $y_1$, la
          coordenada $y$ de la masa del plano de $B$, en milímetros?
        respuesta:
          tipo: magnitud
          valor: '-150 mm'
          formato: una longitud, con su signo y su unidad
        distractores:
          - valor: '-100 mm'
            mensaje: |
              Has usado $2M\,y_G\,z_G$ como producto de inercia del conjunto. No
              lo es: el producto de inercia real lo da la matriz del enunciado,
              $I_{yz} = 3ML^{2}/4$, que no coincide con el de una masa puntual
              colocada en $G$.
          - valor: '-50 mm'
            mensaje: |
              Esa es $y_2$, la de la masa del plano de $C$. Las dos coordenadas
              salen cruzadas: $y_1 = -3L/8$ e $y_2 = -L/8$.
          - valor: '150 mm'
            mensaje: |
              El módulo está bien y el signo no. Las masas de equilibrado van al
              **lado opuesto** de donde está el centro de gravedad, que aquí
              tiene $y_G = +L/4$.
        pista: |
          Dos condiciones con $y$: $2M\,y_G + M y_1 + M y_2 = 0$ y
          $I_{yz} + M y_1 z_1 + M y_2 z_2 = 0$, con $z_1 = L$ y $z_2 = 3L$.
        desarrollo: |
          $$
          2M\frac{L}{4} + M y_1 + M y_2 = 0 \;\Longrightarrow\; y_1 + y_2 = -\frac{L}{2}
          $$

          $$
          \frac{3ML^{2}}{4} + M y_1 L + M y_2\,3L = 0 \;\Longrightarrow\; y_1 + 3y_2 = -\frac{3L}{4}
          $$

          Restando, $y_2 = -L/8$ e $y_1 = -3L/8 = -150$ mm. Con las dos
          condiciones en $x$ se obtiene igual $x_1 = -L/8$ y $x_2 = -3L/8$, o
          sea las posiciones que publica la colección:

          $$
          M_1\left(-\frac{L}{8},\ -\frac{3L}{8},\ L\right)
          \qquad
          M_2\left(-\frac{3L}{8},\ -\frac{L}{8},\ 3L\right)
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'En $t = 0$, $\omega = 0$ y $\alpha = 2g/L$, así que $\dot{\vec{H}}_A = [I_A]\,\vec{\alpha}$ y el término del arrastre desaparece.'
          - texto: 'La tercera columna de la matriz da $\dot{\vec{H}}_A = \left(-\tfrac{5}{2}MgL,\ -\tfrac{3}{2}MgL,\ \tfrac{4}{3}MgL\right)$, y de la componente $z$ sale $P = 4MgL/3$.'
          - texto: 'Con las dos componentes horizontales y los momentos del peso salen $D_x = -Mg/2$ y $D_y = Mg/2$, y de las fuerzas, las de $A$.'
          - texto: Como en t igual a cero la velocidad angular es nula, el momento angular es nulo y las ecuaciones de momentos solo llevan el peso.
            trampa: true
            mensaje: |
              El momento angular sí es nulo, pero lo que aparece en las
              ecuaciones es su **derivada**, y esa no lo es: vale
              $[I_A]\vec{\alpha}$, con las componentes horizontales que le dan
              los productos de inercia. Si se ignoran, $D_y$ sale $-Mg/8$ en
              vez de $+Mg/2$.
