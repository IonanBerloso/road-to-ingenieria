      - **En A y en B**, las reacciones, con sus tres componentes.
      - **En G**, el peso, $Mg$.
      - **Alrededor del eje**, el par $T$.

      **2. Incógnitas.** $A_x$, $A_y$, $B_x$, $B_y$ y el par $T$. A lo largo
      del eje solo sale la suma $A_z + B_z = Mg$: cómo se la reparten los dos
      apoyos depende de cómo estén montados, y el enunciado no la pide.

      **3. Ecuaciones.** Origen en $G$, con $z$ paralelo al eje de giro y el
      disco en el plano $xy$. Son ejes principales del disco:
      $I_{Gx} = I_{Gy} = MR^{2}/4$, $I_{Gz} = MR^{2}/2$ y los productos de
      inercia, nulos. El eje de giro pasa por $C$, a $R/4$ de $G$, así que $G$
      da vueltas a su alrededor:

      <figure class="figura-examen">
      <svg viewBox="24 -2 246 244" role="img" width="369" height="366" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">La aceleración del centro de gravedad del disco soldado</title>
        <desc id="dsl-d">Vista desde arriba. El disco, con su centro G, y el eje, en C, a la izquierda de G. A trazos, la circunferencia que describe G alrededor de C. En G, dos aceleraciones: omega cuadrado por R cuarta parte, hacia C, y alfa por R cuarta parte, hacia arriba, según Y. Alrededor de C, la velocidad y la aceleración angulares, en sentido antihorario.</desc>
