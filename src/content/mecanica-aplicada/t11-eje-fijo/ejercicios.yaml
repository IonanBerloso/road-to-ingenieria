    pide: Las reacciones en A y en B, el par P, y el valor y la posición de la masa de equilibrado.
    pasos:
      - tipo: reconocer
        pregunta: |
          La velocidad angular es constante, así que $\alpha = 0$. ¿Qué queda
          entonces en $\dot{\vec{H}}_O$, y por qué?
        opciones:
          - texto: Solo el término del arrastre, que no es nulo porque el producto de inercia I sub yz no lo es
            correcta: true
            mensaje: |
              Eso es. En ejes del sólido las componentes de $\vec{H}_O$ son
              constantes, pero $\vec{H}_O$ tiene una componente según $y$
              —$-I_{yz}\,\omega$— y al girar aparece
              $\vec{\omega} \times \vec{H}_O = I_{yz}\,\omega^{2}\,\hat{\imath}$.
          - texto: Nada, porque con alfa igual a cero el momento angular no cambia
            mensaje: |
              No cambia **visto desde el sólido**, que es otra cosa. Los ejes
              giran, así que la derivada respecto de los ejes fijos lleva
              además $\vec{\omega} \times \vec{H}_O$, y ese término es
              justamente el que carga los apoyos.
          - texto: El término I sub z por alfa, que es lo que da el par P
            mensaje: |
              Ese término es cero precisamente porque $\alpha = 0$, y por eso el
              par sale $P = 0$: para mantener la velocidad angular constante no
              hace falta ningún par.
          - texto: Solo la parte del peso, porque el eje es vertical
            mensaje: |
              El peso entra en las ecuaciones de fuerzas y en el momento del
              peso respecto de $O$, no en $\dot{\vec{H}}_O$, que solo depende de
              la inercia y del movimiento.

      - tipo: calcular
        titulo: El centro de gravedad del conjunto
        pregunta: |
          El centroide de un **alambre** semicircular está a $2R/\pi$ del
          centro. Con $R = 0{,}3$ m, ¿cuánto vale $y_G$ del conjunto, en
          milímetros y con su signo?
        respuesta:
          tipo: magnitud
          valor: '-45.5 mm'
          formato: una longitud, con su signo y su unidad
        distractores:
          - valor: '-13.7 mm'
            mensaje: |
              Has usado $4R/3\pi$, que es el centroide de un semicírculo
              **macizo**. Aquí es un aro: toda la masa está a distancia $R$ del
              centro, y su centroide cae en $2R/\pi$.
          - valor: '-25 mm'
            mensaje: |
              $R/2$ sería el centroide si la masa estuviera repartida
              uniformemente a lo largo del diámetro. En el alambre semicircular
              es $2R/\pi \approx 0{,}64R$, bastante más lejos.
          - valor: '45.5 mm'
            mensaje: |
              El módulo está bien y el signo no. El semiaro está del lado de las
              $y$ negativas y pesa lo mismo que el triángulo, así que se lleva
              el centro de gravedad hacia allí.
        pista: |
          $y_G = \dfrac{M\left(-2R/\pi\right) + M\left(R/3\right)}{2M}$, con el
          centroide del triángulo rectángulo a un tercio del cateto.
        desarrollo: |
          $$
          y_G = \frac{1}{2}\left(\frac{1}{3} - \frac{2}{\pi}\right)R = \left(\frac{1}{6} - \frac{1}{\pi}\right)R = -0{,}1516\,R
          $$

          $$
          y_G = -0{,}1516 \cdot 300 = -45{,}5\ \text{mm}
          $$

          Y por el mismo camino $z_G = R/6 = 50$ mm, porque el semiaro tiene su
          centroide a la altura de $O$ y el triángulo a $R/3$.

      - tipo: calcular
        titulo: La reacción en el apoyo de abajo
        pregunta: |
          Con $M = 9$ kg y $\omega = 20$ rad/s, ¿cuánto vale $B_y$?
        respuesta:
          tipo: magnitud
          valor: '179.6 N'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '163.8 N'
            mensaje: |
              Has repartido la resultante $-2M\omega^{2}y_G$ a partes iguales
              entre los dos apoyos. No se reparte así: hay además un momento
              —el del peso y el del producto de inercia— que descompensa los
              dos apoyos.
          - valor: '147.9 N'
            mensaje: |
              Ese es $A_y$, el apoyo de arriba. Los dos suman lo mismo, pero el
              momento les reparte $\pm(MR\omega^{2}/24 + Mg\,y_G/R)$ con signos
              contrarios.
        pista: |
          De las fuerzas, $A_y + B_y = -2M\omega^{2} y_G$; de los momentos en
          $O$ según $x$, $-2R\left(A_y - B_y\right) = I_{yz}\,\omega^{2} + 2Mg\,y_G$.
        desarrollo: |
          $$
          A_y + B_y = -2M\omega^{2}y_G = 327{,}5\ \text{N}
          $$

          $$
          -2R\left(A_y - B_y\right) - 2Mg\,y_G = I_{yz}\,\omega^{2} = \frac{MR^{2}}{12}\omega^{2}
          $$

          Resolviendo el par de ecuaciones:

          $$
          B_y = MR\omega^{2}\left(\frac{1}{\pi} - \frac{7}{48}\right) + Mg\left(\frac{1}{12} - \frac{1}{2\pi}\right) = 179{,}6\ \text{N}
          $$

          que es la expresión publicada, y $A_y = 147{,}9$ N. Las otras
          reacciones: $A_x = B_x = 0$, $P = 0$ y $B_z = 2Mg = 176{,}4$ N, con
          $A_z = 0$.

      - tipo: calcular
        titulo: La masa de equilibrado
        pregunta: |
          Se coloca una masa $m$ en $y = +R$. ¿Cuánto vale, en kg?
        respuesta:
          tipo: magnitud
          valor: '2.73 kg'
          formato: una masa, con su unidad
        distractores:
          - valor: '1.365 kg'
            mensaje: |
              Has puesto $M$ donde va la masa total. Lo que hay que llevar al
              eje es el centro de gravedad del conjunto, y el conjunto son los
              dos cuerpos: $2M\,y_G + m\,R = 0$.
          - valor: '0.82 kg'
            mensaje: |
              Arrastras el centroide equivocado del semiaro, el del semicírculo
              macizo $4R/3\pi$. Con el del alambre, $2R/\pi$, el descentrado es
              tres veces mayor y la masa también.
        pista: |
          Equilibrado estático: $2M\,y_G + m\,R = 0$.
        desarrollo: |
          $$
          m = -\frac{2M\,y_G}{R} = 2M\left(\frac{1}{\pi} - \frac{1}{6}\right) = \left(\frac{2}{\pi} - \frac{1}{3}\right)M
          $$

          $$
          m = 0{,}3033 \cdot 9 = 2{,}73\ \text{kg}
          $$

      - tipo: calcular
        titulo: A qué altura va esa masa
        pregunta: |
          ¿A qué cota $z_m$ hay que ponerla para que el equilibrado sea también
          dinámico, en milímetros y con su signo?
        respuesta:
          tipo: magnitud
          valor: '-82.4 mm'
          formato: una longitud, con su signo y su unidad
        distractores:
          - valor: '-50 mm'
            mensaje: |
              Has usado $2M\,y_G\,z_G$ como producto de inercia del conjunto, que
              es el de una masa puntual colocada en $G$. El de verdad lo da la
              matriz del enunciado, $I_{yz} = MR^{2}/12$, y es casi el doble.
              Es el mismo desliz que tiene la resolución oficial en esta línea.
          - valor: '82.4 mm'
            mensaje: |
              El módulo está bien y el signo no. La masa va en $y = +R$, así que
              para que $m\,y_m z_m$ cancele un $I_{yz}$ positivo tiene que estar
              **por debajo** del plano de $O$.
        pista: |
          Equilibrado dinámico: $I_{yz} + m\,y_m\,z_m = 0$, con
          $I_{yz} = MR^{2}/12$ y $y_m = R$. Ojo, la colección imprime la matriz
          sin el factor $MR^{2}$, que sí escribe la resolución oficial.
        desarrollo: |
          $$
          \frac{MR^{2}}{12} + m\,R\,z_m = 0
          \;\Longrightarrow\;
          z_m = -\frac{MR}{12\,m} = -\frac{R}{12\left(\frac{2}{\pi} - \frac{1}{3}\right)} = -\frac{\pi R}{4\left(6 - \pi\right)}
          $$

          $$
          z_m = -0{,}2748 \cdot 300 = -82{,}4\ \text{mm}
          $$

          La otra pareja de condiciones se cumple sola: $x_G = 0$ e
          $I_{xz} = 0$, así que $x_m = 0$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Con $\alpha = 0$, $\dot{\vec{H}}_O = \vec{\omega} \times \vec{H}_O = I_{yz}\,\omega^{2}\,\hat{\imath}$, y de la ecuación según $z$ sale $P = 0$.'
          - texto: 'Las fuerzas dan $A_y + B_y = -2M\omega^{2}y_G$ y $B_z = 2Mg$; los momentos en $O$ según $x$ reparten esa resultante entre los dos apoyos.'
          - texto: 'Para equilibrar, $2M y_G + mR = 0$ da la masa, y $I_{yz} + m R z_m = 0$ da su cota.'
          - texto: Para la condición dinámica basta con anular el producto de inercia de una masa puntual colocada en el centro de gravedad del conjunto.
            trampa: true
            mensaje: |
              El producto de inercia de un cuerpo no es el de una masa puntual
              en su centro de gravedad: falta el término propio de cada pieza
              respecto de su centroide. Aquí el enunciado da el valor bueno en
              su matriz, $I_{yz} = MR^{2}/12$, frente a los $0{,}0505\,MR^{2}$
              que daría $2M\,y_G z_G$.
    resolucion: |
      **La geometría de masas.** Todo está en el plano $x = 0$, así que
      $x_G = 0$, $I_{xy} = I_{xz} = 0$. El centroide del alambre semicircular
      está a $2R/\pi$ del centro, del lado de las $y$ negativas, y el del
      triángulo rectángulo a un tercio de cada cateto:

      $$
      y_G = \left(\frac{1}{6} - \frac{1}{\pi}\right)R = -0{,}1516\,R
      \qquad
      z_G = \frac{R}{6}
      $$

      El tensor del enunciado da $I_{yz} = MR^{2}/12$ y $I_z = 2MR^{2}/3$; la
      colección imprime la matriz sin el factor $MR^{2}$, que sí escribe la
      resolución oficial.

      **La dinámica.** Con $\omega$ constante:

      $$
      \vec{a}_G = -\omega^{2} y_G\,\hat{\jmath}
      \qquad
      \dot{\vec{H}}_O = \vec{\omega} \times \vec{H}_O = I_{yz}\,\omega^{2}\,\hat{\imath}
      $$

      **Las seis ecuaciones.** Con $A$ en $z = 2R$, $B$ en $z = -2R$ y el peso
      $2Mg$ aplicado en $G$:

      $$
      A_x + B_x = 0
      \qquad
      A_y + B_y = -2M\omega^{2}y_G
      \qquad
      B_z = 2Mg
      $$

      $$
      -2R\left(A_y - B_y\right) - 2Mg\,y_G = I_{yz}\,\omega^{2}
      \qquad
      2R\left(A_x - B_x\right) = 0
      \qquad
      P = 0
      $$

      de donde $A_x = B_x = 0$, $P = 0$ y

      $$
      A_y = MR\omega^{2}\left(\frac{1}{\pi} - \frac{3}{16}\right) + Mg\left(\frac{1}{2\pi} - \frac{1}{12}\right)
      \qquad
      B_y = MR\omega^{2}\left(\frac{1}{\pi} - \frac{7}{48}\right) + Mg\left(\frac{1}{12} - \frac{1}{2\pi}\right)
      $$

      **El equilibrado.** Con la masa en $y = +R$, la condición estática da
      $m = \left(2/\pi - 1/3\right)M$ y la dinámica,
      $z_m = -\pi R/\left[4(6-\pi)\right] = -0{,}2748\,R$.

      **Comprobación.** Con $M = 9$ kg, $R = 0{,}3$ m y $\omega = 20$ rad/s:
      $y_G = -45{,}5$ mm, $A_y = 147{,}96$ N, $B_y = 179{,}59$ N,
      $B_z = 176{,}4$ N, $m = 2{,}73$ kg y $z_m = -82{,}4$ mm. Los mismos
      números salen discretizando el triángulo y el alambre en masas puntuales:
      el tensor discretizado reproduce el del enunciado con cuatro cifras, y las
      reacciones salen del sistema de seis ecuaciones sin usar ninguna fórmula
      cerrada.
  - id: ejma11-col115-la-muela-mal-montada
    titulo: La muela mal montada, y las dos masas que la equilibran
    fuente: >-
      Ejercicio 11.5 · Tema 11, «Dinámica del sólido rígido con eje fijo» ·
      Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección publica el
      resultado, contra el que está contrastado el desarrollo, y también se ha
      contrastado con la resolución oficial del profesor. Las cuentas están
      hechas con g igual a 9,8 metros por segundo al cuadrado, que es con lo que
      salen los valores publicados.
    nivel: practica
    enunciado: |
      Una muela, disco de masa $M$ = 4 kg y radio $R$ = 100 mm, está girando a
      una velocidad angular $\omega$ = 10 rad/s y $\alpha$ = 2 rad/s²
      accionada por el par $P$. Debido a una imprecisión en el montaje, el
      centro de gravedad está fuerza del eje de giro $Z$ una distancia $0{,}1R$.

      a) Calcular las reacciones sobre los ejes en los apoyos $A$ y $B$,
      incluido el par $P$.

      b) Se desea equilibrar el conjunto con 2 masas puntuales
      ($m = 0{,}1M$) situadas según los planos $z = -R$ y $z = 0{,}5R$,
      indicados en la figura. Calcular las posiciones de ambas masas y dibujar
      el conjunto equilibrado.

