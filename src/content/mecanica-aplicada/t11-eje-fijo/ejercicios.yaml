        <line x1="268" y1="120" x2="308" y2="120" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="288" y="112" font-size="10" text-anchor="middle" fill="var(--d2-tinta)">P</text>
        <line x1="268" y1="120" x2="300" y2="120" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="288" y="112" font-size="10" text-anchor="start" fill="var(--d2-tinta)"></text>
