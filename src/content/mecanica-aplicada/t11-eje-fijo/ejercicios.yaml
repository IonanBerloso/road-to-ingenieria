ejercicios:
  - id: ejma11-el-rotor-con-un-milimetro
    titulo: Un milímetro de descentrado, y lo que tira del cojinete
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    antes:
      idea: |
        La resultante de las fuerzas sobre un sólido es su masa por la
        aceleración de su centro de gravedad. Un punto que gira alrededor de
        un eje fijo, a una distancia r de él, tiene una aceleración hacia el
        eje y otra tangente a su trayectoria. El centro de gravedad de un
        conjunto queda en el eje cuando las masas por sus distancias al eje,
        a un lado y a otro, se compensan.
      formula: |
        $$
        \sum\vec{F} = M\vec{a}_G,
        \qquad
        a_n = \omega^{2} r,
        \qquad
        a_t = \alpha\,r
        $$
      reconocer: |
        Antes de calcular se mira dónde está el centro de gravedad del rotor
        respecto del eje.
    enunciado: |
      Un rotor de 10 kg gira a velocidad constante de 300 rad/s alrededor de un
      eje fijo, pero su centro de gravedad está a 1 mm del eje. Calcular la
      resultante de las reacciones dinámicas en los cojinetes, y la masa que
      habría que añadir a 0,1 m del eje, en el mismo plano que $G$, para
      equilibrarlo estáticamente.
    pide: La fuerza dinámica sobre los cojinetes y la masa de equilibrado.
    pasos:
      - tipo: reconocer
        pregunta: |
          Con la velocidad angular constante, ¿por qué hay reacciones dinámicas?
        opciones:
          - texto: Porque G describe una circunferencia y tiene aceleración centrípeta
            correcta: true
            mensaje: |
              Eso es. Aunque $\omega$ no cambie, $G$ gira alrededor del eje y
              acelera hacia él. Por el teorema del momento lineal, esa
              aceleración exige una fuerza, y la dan los cojinetes.
          - texto: No las hay, porque la velocidad angular es constante
            mensaje: |
              Constante en módulo, pero $G$ va cambiando de dirección al girar:
              tiene aceleración centrípeta, $\omega^{2} e$, y eso necesita
              fuerza.
          - texto: Por el peso del rotor
            mensaje: |
              El peso da las reacciones **estáticas**, las que habría con el
              rotor quieto. Las dinámicas son las que aparecen solo por girar.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el rotor visto a lo largo de su
          eje, sin los cojinetes, con todas las acciones que actúan sobre
          él**. Sin escala, con el descentrado exagerado.
        comprueba:
          - punto: |
              **El eje, O, en el centro, y G a un lado, a 1 mm.**
            porque: |
              Es el descentrado del enunciado; a escala no se vería.
          - punto: |
              **En O, la reacción de los cojinetes, con dos componentes
              perpendiculares al eje.**
            porque: |
              Vistas a lo largo del eje, las reacciones de los dos cojinetes
              caen en O y se suman.
          - punto: |
              **El peso, Mg, vertical, en G.**
            porque: |
              G es el centro de gravedad del rotor.
          - punto: |
              **Alrededor del eje, el par del motor.**
            porque: |
              El peso, fuera del eje, tiene momento respecto de él; para que
              el giro sea constante, algo tiene que compensarlo.
        figura: |
          <svg viewBox="10 0 250 196" role="img" width="250" height="196" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">Sólido libre del rotor, visto a lo largo del eje</title>
            <desc id="dsl-d">El rotor visto a lo largo de su eje, como un disco con el eje O en el centro y el centro de gravedad G a un lado, a la distancia e, muy exagerada. Los cojinetes, quitados y a trazos alrededor del eje. En O, la reacción de los cojinetes con sus dos componentes, horizontal y vertical, y el par del motor, alrededor del eje. En G, el peso, vertical hacia abajo. Fuera del disco, la velocidad angular.</desc>
            <defs>
              <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
              </marker>
              <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
              </marker>
              <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
              </marker>
            </defs>
            <path d="M182 96 A62 62 0 1 0 58 96 A62 62 0 1 0 182 96 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <circle cx="120" cy="96" r="3.4" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
            <path d="M131 96 A11 11 0 1 0 109 96 A11 11 0 1 0 131 96 Z" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
            <line x1="120" y1="92" x2="120" y2="72" stroke="var(--faint)" stroke-width="0.7"/>
            <line x1="140" y1="92" x2="140" y2="72" stroke="var(--faint)" stroke-width="0.7"/>
            <path d="M120 76 H140 M120 72 V80 M140 72 V80" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
            <text x="130" y="72" font-size="9" text-anchor="middle" fill="var(--faint)">e</text>
            <path d="M111.2 63.2 A34 34 0 0 0 88.1 84.4" fill="none" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
            <text x="84" y="58" font-size="10" text-anchor="end" fill="var(--d2-tinta)">M<tspan font-size="7.5" dy="2.5">m</tspan></text>
            <path d="M189.5 70.7 A74 74 0 0 0 145.3 26.5" fill="none" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
            <text x="182" y="36" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">ω</text>
            <line x1="72" y1="96" x2="114" y2="96" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
            <text x="74" y="90" font-size="10" text-anchor="start" fill="var(--d2-tinta)">R<tspan font-size="7.5" dy="2.5">x</tspan></text>
            <line x1="120" y1="144" x2="120" y2="102" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
            <text x="114" y="142" font-size="10" text-anchor="end" fill="var(--d2-tinta)">R<tspan font-size="7.5" dy="2.5">y</tspan></text>
            <line x1="140" y1="96" x2="140" y2="142" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
            <text x="146" y="140" font-size="10" text-anchor="start" fill="var(--flag)">Mg</text>
            <circle cx="140" cy="96" r="2.4" fill="var(--ink)"/>
            <text x="145" y="91" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">G</text>
            <text x="128" y="112" font-size="9" text-anchor="start" fill="var(--faint)">O</text>
          </svg>

      - tipo: calcular
        titulo: La fuerza dinámica
        pregunta: |
          ¿Cuánto vale la resultante de las reacciones dinámicas, en N?
        respuesta:
          tipo: numero
          valor: '900'
          tolerancia: 5
          formato: un número, en N
        distractores:
          - valor: '3'
            mensaje: |
              Has usado $\omega$ en lugar de $\omega^{2}$. La aceleración
              centrípeta es $\omega^{2} e$.
          - valor: '900000'
            mensaje: |
              Has dejado el descentrado en milímetros. En metros es 0,001.
        pista: |
          $F = M\,a_G = M\,\omega^{2} e$, con $e$ en metros.
        desarrollo: |
          $$
          F = M\,\omega^{2} e = 10 \cdot 300^{2} \cdot 0{,}001 = 900\ \text{N}
          $$

          Más de nueve veces el peso del rotor, por un milímetro.

      - tipo: calcular
        titulo: La masa de equilibrado
        pregunta: |
          ¿Qué masa hay que añadir a 0,1 m del eje, en el lado opuesto a $G$, en
          kg?
        respuesta:
          tipo: numero
          valor: '0.1'
          tolerancia: 0.002
          formato: un número, en kg
        distractores:
          - valor: '1'
            mensaje: |
              Revisa las unidades: el descentrado es 0,001 m, no 0,01. La
              condición es $M\,e = m\,r$.
          - valor: '0.01'
            mensaje: |
              Has dividido al revés o te has comido un cero. Con
              $10 \cdot 0{,}001 = m \cdot 0{,}1$, la masa es 0,1 kg.
        pista: |
          Equilibrado estático: el centro de gravedad del conjunto en el eje,
          $M\,e = m\,r$.
        desarrollo: |
          $$
          m = \frac{M\,e}{r} = \frac{10 \cdot 0{,}001}{0{,}1} = 0{,}1\ \text{kg}
          $$

          En el lado opuesto a $G$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: $G$ gira alrededor del eje a 1 mm, con aceleración centrípeta $\omega^{2} e = 90$ m/s².
          - texto: 'Por el teorema del momento lineal, los cojinetes dan $M\,\omega^{2} e = 900$ N, que giran con el rotor.'
          - texto: 'Para equilibrarlo, $M\,e = m\,r$: una masa de 0,1 kg a 0,1 m, en el lado opuesto a $G$.'
          - texto: Como la velocidad angular es constante, el rotor no carga los cojinetes más que con su peso.
            trampa: true
            mensaje: |
              Constante en módulo, pero $G$ gira: su aceleración centrípeta
              exige 900 N, más de nueve veces el peso, que además giran con el
              rotor.
    resolucion: |
      **1. Sólidos libres.** Es un problema de dinámica de un sólido que gira
      alrededor de un eje fijo: el dibujo lleva el rotor visto a lo largo del
      eje, sin los cojinetes, con el descentrado muy exagerado.

      <figure class="figura-examen">
      <svg viewBox="10 0 250 196" role="img" width="375" height="294" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">Sólido libre del rotor, visto a lo largo del eje</title>
        <desc id="dsl-d">El rotor visto a lo largo de su eje, como un disco con el eje O en el centro y el centro de gravedad G a un lado, a la distancia e, muy exagerada. Los cojinetes, quitados y a trazos alrededor del eje. En O, la reacción de los cojinetes con sus dos componentes, horizontal y vertical, y el par del motor, alrededor del eje. En G, el peso, vertical hacia abajo. Fuera del disco, la velocidad angular.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M182 96 A62 62 0 1 0 58 96 A62 62 0 1 0 182 96 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <circle cx="120" cy="96" r="3.4" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
        <path d="M131 96 A11 11 0 1 0 109 96 A11 11 0 1 0 131 96 Z" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
        <line x1="120" y1="92" x2="120" y2="72" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="140" y1="92" x2="140" y2="72" stroke="var(--faint)" stroke-width="0.7"/>
        <path d="M120 76 H140 M120 72 V80 M140 72 V80" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="130" y="72" font-size="9" text-anchor="middle" fill="var(--faint)">e</text>
        <path d="M111.2 63.2 A34 34 0 0 0 88.1 84.4" fill="none" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="84" y="58" font-size="10" text-anchor="end" fill="var(--d2-tinta)">M<tspan font-size="7.5" dy="2.5">m</tspan></text>
        <path d="M189.5 70.7 A74 74 0 0 0 145.3 26.5" fill="none" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="182" y="36" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">ω</text>
        <line x1="72" y1="96" x2="114" y2="96" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="74" y="90" font-size="10" text-anchor="start" fill="var(--d2-tinta)">R<tspan font-size="7.5" dy="2.5">x</tspan></text>
        <line x1="120" y1="144" x2="120" y2="102" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="114" y="142" font-size="10" text-anchor="end" fill="var(--d2-tinta)">R<tspan font-size="7.5" dy="2.5">y</tspan></text>
        <line x1="140" y1="96" x2="140" y2="142" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
        <text x="146" y="140" font-size="10" text-anchor="start" fill="var(--flag)">Mg</text>
        <circle cx="140" cy="96" r="2.4" fill="var(--ink)"/>
        <text x="145" y="91" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">G</text>
        <text x="128" y="112" font-size="9" text-anchor="start" fill="var(--faint)">O</text>
      </svg>
      <figcaption>

      Visto a lo largo del eje, con el descentrado muy exagerado. Las reacciones de los dos cojinetes se suman en O.

      </figcaption>
      </figure>

      - **En O**, la reacción de los dos cojinetes, $R_x$ y $R_y$.
      - **En G**, el peso, $Mg = 10 \cdot 9{,}81 = 98{,}1\ \text{N}$.
      - **Alrededor del eje**, el par del motor, $M_m$.

      **2. Incógnitas.** La reacción de los cojinetes, separada en su parte
      estática, la que habría con el rotor quieto, y su parte dinámica, la
      que añade el giro; el par del motor; y la masa de equilibrado.

      **3. Ecuaciones.** Con ω constante, $\alpha = 0$: G solo tiene la
      aceleración hacia el eje, $a_G = \omega^{2} e$. El momento lineal y el
      momento respecto del eje:

      $$
      \vec{R} + M\vec{g} = M\vec{a}_G,
      \qquad
      M_m + M_{\text{peso}} = I_O\,\alpha = 0
      $$

      La parte dinámica de la reacción es $M\vec{a}_G$: de G hacia el eje,
      de módulo $M\omega^{2}e$, y girando con el rotor. Para el equilibrado,
      el centro de gravedad del conjunto en el eje: $M\,e = m\,r$.

      **4. Resultados.**

      $$
      F = M\,\omega^{2} e = 10 \cdot 90000 \cdot 0{,}001 = 900\ \text{N},
      \qquad
      m = \frac{M\,e}{r} = \frac{10 \cdot 0{,}001}{0{,}1} = 0{,}1\ \text{kg}
      $$

      La masa, en el lado opuesto a G. La fuerza es $900/98{,}1 = 9{,}17$
      veces el peso. El par del motor es como mucho
      $Mg\,e = 98{,}1 \cdot 0{,}001 = 0{,}0981\ \text{N}\cdot\text{m}$, y
      cambia de signo en cada vuelta.

      **5. Comprobación.** La masa de equilibrado, a 0,1 m del eje y a
      300 rad/s, necesita a su vez
      $m\,\omega^{2} r = 0{,}1 \cdot 90000 \cdot 0{,}1 = 900\ \text{N}$ hacia
      el eje: la misma fuerza que el rotor, en sentido contrario. Con las dos,
      la resultante es nula y los cojinetes ya no llevan fuerza dinámica. Y el
      centro de gravedad del conjunto queda en el eje:
      $10 \cdot 0{,}001 - 0{,}1 \cdot 0{,}1 = 0$.

      **Lo que dice el resultado.** Un milímetro de descentrado carga los
      cojinetes con más de nueve veces el peso, y esa fuerza gira con el
      rotor: los sacude unas 48 veces por segundo. La masa de equilibrado solo
      arregla el equilibrado estático. Si además hubiera productos de
      inercia, harían falta dos masas en dos planos.

  - id: ejma11-el-par-que-no-se-ve
    titulo: El par que carga los cojinetes con el centro de gravedad en el eje
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    antes:
      idea: |
        Una masa que gira alrededor de un eje fijo, a una distancia r de él,
        necesita una fuerza hacia el eje, y tira del eje con la misma fuerza
        hacia fuera, a lo largo de su brazo. Un eje de masa despreciable está
        en equilibrio con todo lo que actúa sobre él, también mientras gira.
      formula: |
        $$
        F = m\,r\,\omega^{2},
        \qquad
        \sum\vec{F} = \vec{0},
        \qquad
        \sum\vec{M}_A = \vec{0}\ \ \text{con el eje sin masa}
        $$
      reconocer: |
        Antes de calcular se mira cómo están colocadas las dos masas en el
        eje.
    enunciado: |
      Un eje horizontal de masa despreciable gira a 50 rad/s entre dos
      cojinetes $A$ y $B$ separados 0,6 m. Lleva dos masas de 0,1 kg a 0,2 m del
      eje, en lados opuestos: una a 0,2 m de $A$ y la otra a 0,4 m de $A$.
      Calcular las reacciones dinámicas en los cojinetes.
    pide: Las reacciones dinámicas en A y en B.
    pasos:
      - tipo: reconocer
        pregunta: |
          El centro de gravedad del conjunto está en el eje. ¿Hay reacciones
          dinámicas?
        opciones:
          - texto: Sí, porque las dos fuerzas forman un par, y el eje no es dirección principal
            correcta: true
            mensaje: |
              Eso es. Está equilibrado estáticamente, pero no dinámicamente: las
              fuerzas de las dos masas son iguales y opuestas y no están en la
              misma recta. Su resultante es nula, su momento no.
          - texto: No, porque el centro de gravedad está en el eje
            mensaje: |
              Eso es el equilibrado **estático**, y solo anula la resultante. El
              momento de las dos fuerzas sigue ahí: falta el equilibrado
              dinámico.
          - texto: Sí, cada cojinete lleva la fuerza de la masa que tiene más cerca
            mensaje: |
              Los cojinetes no se reparten las masas: equilibran entre los dos
              la resultante y el momento del conjunto. Aquí la resultante es
              nula y solo queda el par.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el eje solo, sin las masas, en
          el instante en que las dos están en el plano del papel, con lo que
          añade el giro**. Sin escala.
        comprueba:
          - punto: |
              **En el arranque de cada brazo, la fuerza con la que la masa
              tira del eje, hacia fuera: una hacia arriba y otra hacia
              abajo.**
            porque: |
              Cada masa necesita una fuerza hacia el eje para girar, y el eje
              la recibe al revés.
          - punto: |
              **Esas dos fuerzas a 0,2 m y a 0,4 m de A.**
            porque: |
              Es donde están montadas las masas, según el enunciado.
          - punto: |
              **En A y en B, las reacciones de los cojinetes, en el mismo
              plano.**
            porque: |
              Las fuerzas de las masas están en ese plano; perpendicular a él
              no hay nada que equilibrar.
          - punto: |
              **Sin los pesos.**
            porque: |
              Los pesos dan las reacciones estáticas, y el enunciado pide solo
              las dinámicas, las que añade el giro.
        figura: |
          <svg viewBox="10 3 300 173" role="img" width="300" height="173" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">Sólido libre del eje de las dos masas</title>
            <desc id="dsl-d">El eje horizontal de A a B, de lado, en el instante en que las dos masas están en el plano del papel: la primera, arriba, a 0,2 m de A, y la segunda, abajo, a 0,4 m de A. Las masas y sus brazos, quitados y a trazos. En el arranque de cada brazo, la fuerza con la que la masa tira del eje: hacia arriba la primera y hacia abajo la segunda. En A y en B, las reacciones dinámicas de los cojinetes, verticales. Cotas de 0,2 m entre A, las dos masas y B.</desc>
            <defs>
              <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
              </marker>
              <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
              </marker>
              <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
              </marker>
            </defs>
            <line x1="40" y1="92" x2="280" y2="92" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
            <path d="M120.0 92 V42" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
            <path d="M129.0 34 A9 9 0 1 0 111.0 34 A9 9 0 1 0 129.0 34 Z" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
            <path d="M200.0 92 V142" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
            <path d="M209.0 150 A9 9 0 1 0 191.0 150 A9 9 0 1 0 209.0 150 Z" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
            <path d="M40 16 H120 M40 12 V20 M120 12 V20" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
            <text x="80" y="12" font-size="9" text-anchor="middle" fill="var(--faint)">0,2</text>
            <path d="M120 16 H200 M120 12 V20 M200 12 V20" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
            <text x="160" y="12" font-size="9" text-anchor="middle" fill="var(--faint)">0,2</text>
            <path d="M200 16 H280 M200 12 V20 M280 12 V20" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
            <text x="240" y="12" font-size="9" text-anchor="middle" fill="var(--faint)">0,2</text>
