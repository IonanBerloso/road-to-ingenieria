      - **En A**, la reacción, con sus tres componentes.
      - **En D**, solo $D_x$ y $D_y$: no puede dar reacción vertical.
      - **En el centro de cada cuadrado**, su peso, $Mg$: en
        $G_1(L/2,\ 0,\ 5L/2)$ y en $G_2(0,\ L/2,\ 3L/2)$. Juntos, $2Mg$ en el
        centro de gravedad del conjunto, $G(L/4,\ L/4,\ 2L)$.
      - **Alrededor del eje**, el par $P$.

      **2. Incógnitas.** Para a) y b), $P$, $A_x$, $A_y$, $A_z$, $D_x$ y
      $D_y$: seis, con seis ecuaciones. Para c), las coordenadas horizontales
      de las dos masas, $x_1$, $y_1$, $x_2$ e $y_2$; las alturas las da el
      enunciado, $z_1 = L$ y $z_2 = 3L$.

      **3. Ecuaciones.** De $\omega = k\operatorname{sen}(kt)$ con
      $k = \sqrt{2g/L}$, en $t = 0$: $\omega(0) = 0$ y
      $\alpha(0) = k^{2} = 2g/L$. Con $\omega = 0$, la aceleración de $G$ es
      solo la tangencial:

      $$
      \vec{a}_G = \vec{\alpha} \times \vec{r}_G = \frac{2g}{L}\left(-\frac{L}{4},\ \frac{L}{4},\ 0\right) = \left(-\frac{g}{2},\ \frac{g}{2},\ 0\right)
      $$

      El momento angular es nulo, pero su derivada no: queda
      $[I_A]\vec{\alpha}$, la tercera columna de la matriz por $\alpha$, con
      las dos componentes horizontales que le dan los productos de inercia:

      $$
      \dot{\vec{H}}_A = \left(-\frac{5ML^{2}}{4},\ -\frac{3ML^{2}}{4},\ \frac{2ML^{2}}{3}\right)\frac{2g}{L} = \left(-\frac{5MgL}{2},\ -\frac{3MgL}{2},\ \frac{4MgL}{3}\right)
      $$

      Las fuerzas, y los momentos en $A$ del peso, aplicado en $G$, y de la
      reacción de $D$, con brazo $4L$:

      $$
      A_x + D_x = 2M\left(-\frac{g}{2}\right)
      \qquad
      A_y + D_y = 2M\,\frac{g}{2}
      \qquad
      A_z - 2Mg = 0
      $$

      $$
      -\frac{MgL}{2} - 4L\,D_y = -\frac{5MgL}{2}
      \qquad
      \frac{MgL}{2} + 4L\,D_x = -\frac{3MgL}{2}
      \qquad
      P = \frac{4MgL}{3}
      $$

      Para el equilibrado, el centro de gravedad de todo en el eje y los dos
      productos de inercia nulos, con los productos **de la matriz**,
      $I_{xz} = 5ML^{2}/4$ y $I_{yz} = 3ML^{2}/4$, no los de una masa puntual
      en $G$:

      $$
      2M\,\frac{L}{4} + M x_1 + M x_2 = 0
      \qquad
      \frac{5ML^{2}}{4} + M x_1 L + M x_2\,3L = 0
      $$

      $$
      2M\,\frac{L}{4} + M y_1 + M y_2 = 0
      \qquad
      \frac{3ML^{2}}{4} + M y_1 L + M y_2\,3L = 0
      $$

      **4. Resultados.**

      $$
      P = \frac{4MgL}{3}
      \qquad
      A = \left(-\frac{Mg}{2},\ \frac{Mg}{2},\ 2Mg\right)
      \qquad
      D = \left(-\frac{Mg}{2},\ \frac{Mg}{2},\ 0\right)
      $$

      $$
      M_1\left(-\frac{L}{8},\ -\frac{3L}{8},\ L\right)
      \qquad
      M_2\left(-\frac{3L}{8},\ -\frac{L}{8},\ 3L\right)
      $$

      Lo que publica la colección. Con $M = 6$ kg y $L = 0{,}4$ m:
      $\alpha = 49$ rad/s², $P = 31{,}36$ N·m,
      $A = (-29{,}4;\ 29{,}4;\ 117{,}6)$ N, $D = (-29{,}4;\ 29{,}4;\ 0)$ N, y
      las masas en $(-50;\ -150;\ 400)$ mm y $(-150;\ -50;\ 1200)$ mm.

      <figure class="figura-examen">
      <svg viewBox="20 14 236 222" role="img" width="354" height="333" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">Dónde van las dos masas de equilibrado, vistas desde arriba</title>
        <desc id="dsl-d">Vista desde arriba, con Y a la derecha y X hacia abajo. El eje, en el centro, y los dos cuadrados de canto: el de abajo, de z igual a L a dos L, hacia Y; el de arriba, de dos L a tres L, hacia X. El centro de gravedad de los dos, G, entre ellos, en la diagonal. Las dos masas, al otro lado del eje: la del plano de B, M1, más hacia menos Y; la del plano de C, M2, más hacia menos X.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <line x1="112" y1="92" x2="232" y2="92" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
        <line x1="112" y1="92" x2="112" y2="212" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
        <circle cx="112" cy="92" r="3.4" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
        <line x1="112" y1="92" x2="67" y2="77" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="112" y1="92" x2="97" y2="47" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="112" y1="92" x2="142" y2="122" stroke="var(--faint)" stroke-width="0.7"/>
        <circle cx="142" cy="122" r="2.4" fill="var(--ink)"/>
        <text x="148" y="134" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">G</text>
        <circle cx="67" cy="77" r="2.4" fill="var(--ink)"/>
        <text x="61" y="81" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">M<tspan font-size="7.5" dy="2.5">1</tspan></text>
        <circle cx="97" cy="47" r="2.4" fill="var(--ink)"/>
        <text x="91" y="43" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">M<tspan font-size="7.5" dy="2.5">2</tspan></text>
        <text x="182" y="84" font-size="9" text-anchor="middle" fill="var(--faint)">de z = L a 2L</text>
        <text x="120" y="202" font-size="9" text-anchor="start" fill="var(--faint)">de z = 2L a 3L</text>
        <text x="238" y="96" font-size="9" text-anchor="start" fill="var(--faint)">Y</text>
        <text x="116" y="226" font-size="9" text-anchor="start" fill="var(--faint)">X</text>
      </svg>
      <figcaption>

      Desde arriba, con Z hacia fuera del papel. Las masas van al lado opuesto de G, y cada una contrarresta sobre todo el cuadrado que tiene más cerca: M1, a la altura de B, el de abajo, y M2, a la de C, el de arriba.

      </figcaption>
      </figure>

      **5. Comprobación.** Por otro punto fijo y sin la matriz. Respecto de
      $D$, los productos de inercia cambian con la altura:
      $I_{xz,D} = I_{xz} - 4L \cdot 2M\,x_G = 5ML^{2}/4 - 2ML^{2} = -3ML^{2}/4$,
      y del mismo modo $I_{yz,D} = -5ML^{2}/4$. Con
      $ML^{2} = 0{,}96$ kg·m², $\dot{H}_{Dx} = 0{,}75 \cdot 0{,}96 \cdot 49 = 35{,}28$ N·m
      y $\dot{H}_{Dy} = 1{,}25 \cdot 0{,}96 \cdot 49 = 58{,}8$ N·m. El peso
      da en $D$ el mismo momento que en $A$, $\mp MgL/2 = \mp 11{,}76$ N·m, y
      la reacción de $A$ tiene el brazo $4L = 1{,}6$ m. Sale $A$ directamente,
      sin pasar por $D$:

      $$
      -11{,}76 + 1{,}6\,A_y = 35{,}28
      \;\Rightarrow\;
      A_y = 29{,}4\ \text{N}
      \qquad
      11{,}76 - 1{,}6\,A_x = 58{,}8
      \;\Rightarrow\;
      A_x = -29{,}4\ \text{N}
      $$

      El par, con el momento de inercia de cada cuadrado respecto de uno de
      sus lados, $ML^{2}/3$, sin la matriz:
      $P = 2 \cdot 0{,}32 \cdot 49 = 31{,}36$ N·m. Y las masas, sustituidas:
      $I_{xz}$ queda $\tfrac{5}{4} - \tfrac{1}{8} - \tfrac{9}{8} = 0$ y
      $I_{yz}$, $\tfrac{3}{4} - \tfrac{3}{8} - \tfrac{3}{8} = 0$, en unidades
      de $ML^{2}$.

      **Lo que dice el resultado.** En el arranque el eje está parado y, aun
      así, $D$ lleva $Mg/2$ en cada dirección horizontal: con el eje quieto
      llevaría $Mg/8$, y en sentido contrario según $y$. La diferencia la pone
      la aceleración angular a través de los productos de inercia. Con las
      dos masas, el centro de gravedad queda en el eje y los productos se
      anulan: las reacciones horizontales desaparecen para cualquier
      $\omega$ y $\alpha$. Cada masa contrarresta sobre todo el cuadrado que
      tiene más cerca.

  - id: ejma11-col114-la-placa-triangular-y-el-semiaro
    titulo: La placa triangular con el semiaro, y la masa que la equilibra
    fuente: >-
      Ejercicio 11.4 · Tema 11, «Dinámica del sólido rígido con eje fijo» ·
      Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección publica el
      resultado, contra el que está contrastado el desarrollo, y también se ha
      contrastado con la resolución oficial del profesor. En la posición de la
      masa de equilibrado los dos no coinciden y aquí se publica la de la
      colección, que es la que reproducen las cuentas; la resolución oficial da
      menos R partido por 6 porque en esa última línea usa el producto de
      inercia de una masa puntual en G en vez del que da su propia matriz, y
      arrastra la masa con el signo cambiado. El
      resultado es simbólico, así que las casillas usan valores de prueba
      nuestros, declarados en cada pregunta: masa 9 kg cada cuerpo, radio 0,3 m,
      velocidad angular 20 rad/s y gravedad 9,8 metros por segundo al cuadrado.
    nivel: practica
    antes:
      idea: |
        Para un sólido que gira alrededor de un eje fijo, con O un punto del
        eje, el momento de las fuerzas respecto de O es la derivada del
        momento angular respecto de O, y el momento angular se obtiene con la
        matriz de inercia en O. La resultante es la masa por la aceleración
        del centro de gravedad, y el centro de gravedad de un conjunto se
        obtiene ponderando con sus masas los de cada pieza. Un eje que gira
        está equilibrado del todo cuando el centro de gravedad está en el eje
        y los dos productos de inercia que mezclan el eje con las otras dos
        direcciones son nulos.
      formula: |
        $$
        \vec{H}_O = [I_O]\,\vec{\omega},
        \qquad
        \sum\vec{M}_O = \dot{\vec{H}}_O,
        \qquad
        \sum\vec{F} = m\,\vec{a}_G,
        \qquad
        y_G = \frac{\sum m_i\,y_i}{\sum m_i}
        $$

        $$
        x_G = y_G = 0,
        \qquad
        I_{xz} = \sum m\,x\,z = 0,
        \qquad
        I_{yz} = \sum m\,y\,z = 0
        $$
      reconocer: |
        Antes de calcular se mira cómo es el movimiento: qué hace la velocidad
        angular con el tiempo.
    enunciado: |
      Una placa triangular de masa $M$ y espesor despreciable está soldada a un
      eje vertical. En el mismo plano vertical y soldado a ese eje hay un
      semiaro de masa $M$ y radio $R$, tal y como se indica en la figura. El
      sistema gira con velocidad angular $\omega$ constante alrededor del eje
      accionado por un par $P$. Calcular:

      DATO: Tensor axil en O:

      $$
      [I_O] = \begin{bmatrix}
      4/3 & 0 & 0 \\
      0 & 2/3 & -1/12 \\
      0 & -1/12 & 2/3
      \end{bmatrix}
      $$

      a) Reacciones en los apoyos.

      b) Para equilibrar el sistema, se coloca una masa $m$ a una distancia
      $+R$ del eje. Hallar el valor de esta masa en función de $M$ y situar su
      posición.

