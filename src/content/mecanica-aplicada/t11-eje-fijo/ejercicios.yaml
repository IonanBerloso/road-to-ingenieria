        <text x="128" y="66" font-size="10" text-anchor="start" fill="var(--d2-tinta)">F<tspan font-size="7.5" dy="2.5">1</tspan><tspan dy="-2.5"></tspan></text>
        <line x1="200" y1="96" x2="200" y2="132" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
