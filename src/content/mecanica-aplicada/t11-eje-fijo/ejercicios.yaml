        <circle cx="250" cy="94" r="5.5" fill="var(--paper)" stroke="var(--d2)" stroke-width="1.3"/>
        <path d="M246.4 90.4 L253.6 97.6 M246.4 97.6 L253.6 90.4" stroke="var(--d2)" stroke-width="1.3"/>
        <text x="260" y="98" font-size="10" text-anchor="start" fill="var(--d2-tinta)">B<tspan font-size="7.5" dy="2.5">x</tspan></text>
        <circle cx="200" cy="106" r="2.4" fill="var(--ink)"/>
        <text x="192" y="102" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">G</text>
        <circle cx="200" cy="120" r="2.4" fill="var(--ink)"/>
        <text x="192" y="134" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">O</text>
        <text x="90" y="138" font-size="9" text-anchor="end" fill="var(--faint)">A</text>
        <text x="240" y="138" font-size="9" text-anchor="end" fill="var(--faint)">B</text>
      </svg>
      <figcaption>

      De lado, con X hacia dentro del papel y el descentrado de G exagerado. El par, como vector a lo largo del eje. Basta una componente axial, en A.

      </figcaption>
      </figure>

      - **En A**, $A_x$, $A_y$ y la axial, $A_z$; **en B**, $B_x$ y $B_y$.
      - **En G**, el peso, $Mg$, a $0{,}1R = 10$ mm del eje.
      - **A lo largo del eje**, el par $P$.

      **2. Incógnitas.** $A_x$, $A_y$, $A_z$, $B_x$, $B_y$ y $P$: seis, con
      seis ecuaciones. Para el equilibrado, las coordenadas $x$ e $y$ de las
      dos masas.

      **3. Ecuaciones.** Origen en $O$, el centro del disco, con $z$ a lo
      largo del eje e $y$ hacia $G$. Toda la masa está en el plano $z = 0$,
      así que $I_{xz} = I_{yz} = 0$: el eje es dirección principal,
      $\vec{H}_O = I_{Oz}\,\omega\,\hat{k}$ y
      $\dot{\vec{H}}_O = I_{Oz}\,\alpha\,\hat{k}$. Respecto del eje real,

      $$
      I_{Oz} = \frac{1}{2}MR^{2} + M\left(0{,}1R\right)^{2} = 0{,}51\,MR^{2} = 0{,}0204\ \text{kg}\,\text{m}^{2}
      $$

      $G$ gira a $0{,}1R$ del eje:

      $$
      a_{Gx} = -\alpha\left(0{,}1R\right) = -0{,}02\ \text{m/s}^{2}
      \qquad
      a_{Gy} = -\omega^{2}\left(0{,}1R\right) = -1\ \text{m/s}^{2}
      $$

      Con $A$ en $z = -2R$ y $B$ en $z = R$. El peso, vertical y aplicado en
      $G$, que está en la vertical de $O$, no da momento respecto de $O$:

      $$
      A_x + B_x = -M\alpha\left(0{,}1R\right)
      \qquad
      A_y + B_y - Mg = -M\omega^{2}\left(0{,}1R\right)
      \qquad
      A_z = 0
      $$

      $$
      2R\,A_y - R\,B_y = 0
      \qquad
      -2R\,A_x + R\,B_x = 0
      \qquad
      P = I_{Oz}\,\alpha
      $$

      Para el equilibrado, con $m = 0{,}1M$ en $z_1 = -R$ y $z_2 = 0{,}5R$: el
      centro de gravedad de todo en el eje y los productos de las dos masas
      nulos, porque el disco no tiene:

      $$
      M\left(0{,}1R\right) + m\,y_1 + m\,y_2 = 0
      \qquad
      m\,y_1 z_1 + m\,y_2 z_2 = 0
      $$

      y lo mismo en $x$, con $x_G = 0$.

      **4. Resultados.**

      $$
      A_x = -0{,}027\ \text{N}
      \qquad
      B_x = -0{,}053\ \text{N}
      \qquad
      A_y = 11{,}73\ \text{N}
      \qquad
      B_y = 23{,}47\ \text{N}
      \qquad
      A_z = 0
      \qquad
      P = 0{,}041\ \text{N}\cdot\text{m}
      $$

      $$
      M_1\left(0,\ -\frac{R}{3},\ -R\right)
      \qquad
      M_2\left(0,\ -\frac{2R}{3},\ \frac{R}{2}\right)
      $$

      o sea $(0;\ -33{,}3;\ -100)$ mm y $(0;\ -66{,}7;\ 50)$ mm, lo que
      publica la colección. El conjunto equilibrado:

      <figure class="figura-examen">
      <svg viewBox="44 16 286 176" role="img" width="429" height="264" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">La muela equilibrada, con sus dos masas</title>
        <desc id="dsl-d">De lado y a escala. El eje horizontal, de A a B, y la muela de canto, con G un poco por encima del eje. A la izquierda de la muela, a una distancia R, la primera masa, un tercio de R por debajo del eje. A la derecha, a media R, la segunda, dos tercios de R por debajo. Cada masa, unida al eje por un brazo vertical.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M186 36 H194 V156 H186 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M135.0 116.0 A5 5 0 1 0 125.0 116.0 A5 5 0 1 0 135.0 116.0 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M225.0 136.0 A5 5 0 1 0 215.0 136.0 A5 5 0 1 0 225.0 136.0 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M130 96 V111.0" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M220.0 96 V131.0" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <line x1="70" y1="96" x2="250" y2="96" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
        <path d="M116 96 V116 M112 96 H120 M112 116 H120" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="111" y="110" font-size="9" text-anchor="end" fill="var(--faint)">R/3</text>
        <path d="M236 96 V136 M232 96 H240 M232 136 H240" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="241" y="120" font-size="9" text-anchor="start" fill="var(--faint)">2R/3</text>
        <circle cx="190" cy="90" r="2.4" fill="var(--ink)"/>
        <text x="182" y="84" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">G</text>
        <text x="130" y="170" font-size="9" text-anchor="middle" fill="var(--faint)">z = −R</text>
        <text x="224" y="170" font-size="9" text-anchor="start" fill="var(--faint)">z = 0,5R</text>
        <text x="138" y="130" font-size="9" text-anchor="start" fill="var(--faint)">m</text>
        <text x="228" y="150" font-size="9" text-anchor="start" fill="var(--faint)">m</text>
        <text x="64" y="100" font-size="9" text-anchor="end" fill="var(--faint)">A</text>
        <text x="256" y="100" font-size="9" text-anchor="start" fill="var(--faint)">B</text>
      </svg>
      <figcaption>

      A escala, de lado. Las dos masas van al lado contrario de G; la del plano más alejado de la muela, z = −R, es la que menos se separa del eje.

      </figcaption>
      </figure>

      **5. Comprobación.** Por d'Alembert y con momentos respecto de $B$, sin
      pasar por $O$. En $G$ se añaden las fuerzas de inercia:
      $M\omega^{2}(0{,}1R) = 4$ N según $+y$, que con el peso deja
      $39{,}2 - 4 = 35{,}2$ N hacia abajo, y $M\alpha(0{,}1R) = 0{,}08$ N
      según $+x$. Las dos están a $R$ de $B$, y $A$ está a $3R$:

      $$
      3R\,A_y = R \cdot 35{,}2
      \;\Rightarrow\;
      A_y = 35{,}2/3 = 11{,}73\ \text{N}
      \qquad
      3R\,A_x = -R \cdot 0{,}08
      \;\Rightarrow\;
      A_x = -0{,}0267\ \text{N}
      $$

      Y respecto del eje, el par de inercia del disco respecto de $G$ más el
      momento de la fuerza de inercia tangencial, que está a $0{,}1R$:

      $$
      P = \frac{1}{2}MR^{2}\alpha + 0{,}01 \cdot 0{,}08 = 0{,}04 + 0{,}0008 = 0{,}0408\ \text{N}\cdot\text{m}
      $$

      Las masas, sustituidas, en unidades de $R$:
      $4 \cdot 0{,}1 + 0{,}4\left(-\tfrac{1}{3} - \tfrac{2}{3}\right) = 0$ y
      $0{,}4\left(-\tfrac{1}{3}\right)(-1) + 0{,}4\left(-\tfrac{2}{3}\right)(0{,}5) = 0$.

      **Lo que dice el resultado.** La muela solo tiene desequilibrio
      estático: $G$ fuera del eje, sin productos de inercia. La fuerza que
      eso pide crece con $\omega^{2}$; a 10 rad/s son 4 N, y al doble de
      velocidad serían 16. Una sola masa en el plano del disco bastaría. Como
      el enunciado pone las masas fuera, tienen que repartirse para no crear
      un producto de inercia: las dos van al lado contrario de $G$, y la del
      plano más alejado, $z = -R$, es la que menos se separa del eje.

  - id: ejma11-col116-la-placa-cuadrada-en-voladizo
    titulo: La placa cuadrada en voladizo sobre un eje horizontal
    fuente: >-
      Ejercicio 11.6 · Tema 11, «Dinámica del sólido rígido con eje fijo» ·
      Mecánica Aplicada, UPV/EHU, curso 2025-2026. El desarrollo está
      contrastado contra el resultado publicado y contra la resolución oficial
      del profesor. En el apartado b los dos no coinciden y aquí se publica lo
      que dan las cuentas, que es lo mismo que la resolución oficial: las masas
      van en y igual a 675 mm y menos 975 mm, no en menos 450 mm y 150 mm como
      imprime la colección, que en esa línea se deja el producto de inercia de
      la placa. En el apartado a el valor exacto con g igual a 9,8 metros por
      segundo al cuadrado es 22,69 N y la colección imprime 22,67 N. En la
      figura, el giro se dibuja alrededor del eje, positivo según Z.
    nivel: practica
    antes:
      idea: |
        Para un sólido que gira alrededor de un eje fijo, la resultante es la
        masa por la aceleración del centro de gravedad, y el momento respecto
        de G es la derivada del momento angular respecto de G. Un punto a una
        distancia r del eje tiene una aceleración hacia el eje y otra tangente.
        Las reacciones estáticas son las que habría con el sólido quieto, y
        las dinámicas, las que añade el movimiento. Un eje que gira está
        equilibrado del todo cuando el centro de gravedad del conjunto está en
        el eje y los dos productos de inercia del conjunto que mezclan el eje
        con las otras dos direcciones son nulos.
      formula: |
        $$
        \sum\vec{F} = M\vec{a}_G,
        \qquad
        \sum\vec{M}_G = \dot{\vec{H}}_G,
        \qquad
        a_n = \omega^{2} r,\quad a_t = \alpha\,r
        $$

        $$
        x_G = y_G = 0,
        \qquad
        I_{xz} = \sum m\,x\,z = 0,
        \qquad
        I_{yz} = \sum m\,y\,z = 0
        $$
      reconocer: |
        Antes de calcular se mira dónde está el centro de gravedad de la placa
        respecto del eje, en la posición del dibujo.
    enunciado: |
      La figura muestra una placa cuadrada de 2 kg de masa soldada sobre un eje
      horizontal. Si el eje gira con velocidad angular positiva constante
      $\omega$ = 5 rad/s:

      a) Calcular las reacciones estáticas y dinámicas en los apoyos A y B para
      la posición mostrada.

      b) Calcular las posiciones de dos masas $M$ = 1kg colocadas sobre los
      planos verticales $Z$ = 100 mm y $Z$ = 300 mm para conseguir el
      equilibrado del sistema.

      <figure>
      <svg viewBox="-12 0 412 250" role="img" width="412" height="250" aria-labelledby="ejma11-col116-t ejma11-col116-d">
        <title id="ejma11-col116-t">Placa cuadrada soldada en voladizo sobre un eje horizontal con dos apoyos</title>
        <desc id="ejma11-col116-d">Eje horizontal según Z, que apunta a la izquierda. El apoyo B está en el origen y el A a 400 mm a su izquierda. La placa cuadrada, de 300 por 300 mm, está más a la izquierda todavía: su borde derecho queda a 600 mm de B y el izquierdo a 900 mm, y sube 300 mm por encima del eje. El eje Y es vertical y el X sale hacia el observador. El par P y la velocidad angular omega van según Z.</desc>
        <defs>
          <marker id="ejma11-col116-fi" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
          <marker id="ejma11-col116-fl" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
