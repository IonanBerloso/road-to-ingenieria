      - tipo: calcular
        titulo: El par que hay que dar al disco
        pregunta: |
          Tomando los ejes principales del disco, $I_{X_0} = I_{Y_0} = MR^{2}/4$
          y $I_{Z_0} = MR^{2}/2$. Con $M = 12$ kg, $R = 0{,}25$ m,
          $\omega = 60$ rad/s y $\theta = 30^{\circ}$, ¿cuánto vale el módulo de
          $\dot{\vec{H}}_G$?
        respuesta:
          tipo: magnitud
          valor: '292.3 N·m'
          formato: un par, con su unidad
        distractores:
          - valor: '584.6 N·m'
            mensaje: |
              Has usado $I_{Z_0} = MR^{2}/2$ sola. Lo que aparece en
              $\vec{\omega} \times \vec{H}_G$ es la **diferencia**
              $I_{Z_0} - I_{X_0} = MR^{2}/4$: si el disco fuera una esfera, con
              los tres momentos iguales, no habría par.
          - valor: '168.8 N·m'
            mensaje: |
              Has puesto $\operatorname{sen}\theta$ donde va
              $\operatorname{sen}(2\theta)$: con $\theta = 30^{\circ}$, 0,5 en
              vez de 0,866. El $2\theta$ sale de
              $\operatorname{sen}\theta\cos\theta = \tfrac{1}{2}\operatorname{sen}(2\theta)$.
          - valor: '4.87 N·m'
            mensaje: |
              Has puesto $\omega$ donde va $\omega^{2}$. El término
              $\vec{\omega} \times \vec{H}_G$ lleva $\omega$ dos veces: una en
              $\vec{H}_G$ y otra en el producto vectorial.
        pista: |
          $\vec{\omega} = \omega(-\operatorname{sen}\theta\,\hat{e}_1 + \cos\theta\,\hat{e}_3)$
          en ejes del disco, y
          $\vec{H}_G = -I_{X_0}\omega\operatorname{sen}\theta\,\hat{e}_1 + I_{Z_0}\omega\cos\theta\,\hat{e}_3$.
        desarrollo: |
          Como $\omega$ es constante y los momentos de inercia no cambian en
          ejes del sólido, solo queda el término del arrastre:

          $$
          \dot{\vec{H}}_G = \vec{\omega} \times \vec{H}_G = \left(I_{Z_0} - I_{X_0}\right)\omega^{2}\operatorname{sen}\theta\cos\theta\,\hat{e}_2 = \frac{1}{8}MR^{2}\omega^{2}\operatorname{sen}(2\theta)\,\hat{e}_2
          $$

          $$
          \frac{1}{8} \cdot 12 \cdot 0{,}25^{2} \cdot 60^{2} \cdot \operatorname{sen}60^{\circ} = 292{,}3\ \text{N}\cdot\text{m}
          $$

      - tipo: calcular
        titulo: La reacción en cada cojinete
        pregunta: |
          Los dos cojinetes están a la misma distancia $a = 0{,}4$ m de $G$, y
          la resultante de sus reacciones dinámicas es nula. ¿Cuánto vale
          $A_x$?
        respuesta:
          tipo: magnitud
          valor: '365.4 N'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '730.7 N'
            mensaje: |
              Has dividido el par entre $a$ en vez de entre $2a$. Las dos
              fuerzas son iguales y opuestas y están separadas la distancia
              entera entre cojinetes, que es $2a$.
          - valor: '210.9 N'
            mensaje: |
              Ese es el valor con $\operatorname{sen}\theta$ en lugar de
              $\operatorname{sen}(2\theta)$. Revisa el paso anterior: el par
              lleva $\operatorname{sen}\theta\cos\theta$.
          - valor: '6.09 N'
            mensaje: |
              Has arrastrado $\omega$ en vez de $\omega^{2}$ desde el par. Con
              60 rad/s la diferencia es un factor 60.
        pista: |
          Con $\vec{a}_G = 0$ se tiene $A_x = -B_x$, y esas dos fuerzas separadas
          $2a$ forman un par que tiene que valer lo que $\dot{\vec{H}}_G$.
        desarrollo: |
          $$
          2a\,A_x = \frac{1}{8}MR^{2}\omega^{2}\operatorname{sen}(2\theta)
          \;\Longrightarrow\;
          A_x = -B_x = \frac{MR^{2}\omega^{2}\operatorname{sen}(2\theta)}{16\,a}
          $$

          $$
          A_x = \frac{292{,}3}{2 \cdot 0{,}4} = 365{,}4\ \text{N}
          $$

          Que es la expresión que publica la colección. Y no son fuerzas
          quietas: giran con el disco, así que el cojinete las nota como una
          vibración.

      - tipo: calcular
        titulo: La inclinación más dañina
        pregunta: |
          Manteniendo todo lo demás igual, ¿para qué ángulo $\theta$, en grados
          entre $0$ y $90$, es máxima la reacción dinámica?
        respuesta:
          tipo: numero
          valor: '45'
          tolerancia: 0.5
          formato: un número, en grados
        distractores:
          - valor: '90'
            mensaje: |
              Con $\theta = 90^{\circ}$ el eje de giro está **en** el plano del
              disco, o sea que vuelve a ser una dirección principal:
              $\operatorname{sen}(2\theta) = 0$ y las reacciones dinámicas
              desaparecen. Lo peor está en medio.
          - valor: '0'
            mensaje: |
              Ese es el disco bien montado, perpendicular al eje: el eje es
              principal y no hay reacciones dinámicas. Es el mínimo, no el
              máximo.
          - valor: '30'
            mensaje: |
              Ese es el valor del enunciado, no el peor. La reacción va con
              $\operatorname{sen}(2\theta)$, que crece hasta que
              $2\theta = 90^{\circ}$.
        pista: |
          La reacción es proporcional a $\operatorname{sen}(2\theta)$, y el seno
          vale 1 cuando su argumento vale $90^{\circ}$.
        desarrollo: |
          $$
          \operatorname{sen}(2\theta) = 1 \;\Longrightarrow\; 2\theta = 90^{\circ} \;\Longrightarrow\; \theta = 45^{\circ}
          $$

          Los dos extremos —disco perpendicular al eje y disco que contiene al
          eje— son montajes **principales** y no dan reacciones dinámicas. El
          desequilibrio es máximo a mitad de camino.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: En ejes principales del disco, $\vec{\omega}$ tiene componentes según $X_0$ y según $Z_0$, con $I_{X_0} = MR^{2}/4$ y $I_{Z_0} = MR^{2}/2$.
          - texto: 'Entonces $\vec{H}_G$ no es paralelo a $\vec{\omega}$, y al girar con el disco su derivada vale $\tfrac{1}{8}MR^{2}\omega^{2}\operatorname{sen}(2\theta)$ según $Y$.'
          - texto: 'Ese par lo dan dos fuerzas iguales y opuestas separadas $2a$: $A_x = -B_x = MR^{2}\omega^{2}\operatorname{sen}(2\theta)/(16a)$.'
          - texto: Como la aceleración de G es nula, la resultante de las reacciones dinámicas es nula y por tanto cada una de ellas también.
            trampa: true
            mensaje: |
              La resultante es nula, sí, pero eso solo obliga a que
              $A_x = -B_x$. Dos fuerzas opuestas que no están en la misma recta
              forman un par, y aquí ese par es justamente lo que hay que
              equilibrar.
    resolucion: |
      **1. Sólidos libres.** Es un problema de dinámica de un sólido que gira
      alrededor de un eje fijo: el dibujo lleva el disco con su eje, sin los
      cojinetes, de lado, en el plano XZ, con Y hacia dentro del papel.

