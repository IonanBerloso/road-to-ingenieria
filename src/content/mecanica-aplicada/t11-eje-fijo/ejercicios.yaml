    pide: Las reacciones en A y en B, el par P, y el valor y la posición de la masa de equilibrado.
    pasos:
      - tipo: reconocer
        pregunta: |
          La velocidad angular es constante, así que $\alpha = 0$. ¿Qué queda
          entonces en $\dot{\vec{H}}_O$, y por qué?
        opciones:
          - texto: Solo el término del arrastre, que no es nulo porque el producto de inercia I sub yz no lo es
            correcta: true
            mensaje: |
              Eso es. En ejes del sólido las componentes de $\vec{H}_O$ son
              constantes, pero $\vec{H}_O$ tiene una componente según $y$
              —$-I_{yz}\,\omega$— y al girar aparece
              $\vec{\omega} \times \vec{H}_O = I_{yz}\,\omega^{2}\,\hat{\imath}$.
          - texto: Nada, porque con alfa igual a cero el momento angular no cambia
            mensaje: |
              No cambia **visto desde el sólido**, que es otra cosa. Los ejes
              giran, así que la derivada respecto de los ejes fijos lleva
              además $\vec{\omega} \times \vec{H}_O$, y ese término es
              justamente el que carga los apoyos.
          - texto: El término I sub z por alfa, que es lo que da el par P
            mensaje: |
              Ese término es cero precisamente porque $\alpha = 0$, y por eso el
              par sale $P = 0$: para mantener la velocidad angular constante no
              hace falta ningún par.
          - texto: Solo la parte del peso, porque el eje es vertical
            mensaje: |
              El peso entra en las ecuaciones de fuerzas y en el momento del
              peso respecto de $O$, no en $\dot{\vec{H}}_O$, que solo depende de
              la inercia y del movimiento.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **la placa y el semiaro con su
          eje, sin los apoyos, con todas las acciones que actúan sobre
          ellos**. En el plano YZ, con X hacia fuera del papel, y sin escala.
        comprueba:
          - punto: |
              **En A y en B, la reacción perpendicular al eje, con dos
              componentes: según X, hacia fuera del papel, y según Y.**
            porque: |
              Los cojinetes sujetan el eje en las dos direcciones
              perpendiculares a él.
          - punto: |
              **A lo largo del eje, una sola componente, en B.**
            porque: |
              Con una en cada apoyo, las ecuaciones solo darían su suma; la
              colección la pone en el apoyo de abajo.
          - punto: |
              **El peso de cada cuerpo, Mg, en su propio centro de gravedad.**
            porque: |
              Los dos cuerpos pesan lo mismo, pero sus centros de gravedad
              están en sitios distintos, uno a cada lado del eje.
          - punto: |
              **El par P alrededor del eje.**
            porque: |
              Es la acción que mantiene el giro, según Z.
        figura: |
