ejercicios:
  - id: ejma11-el-rotor-con-un-milimetro
    titulo: Un milímetro de descentrado, y lo que tira del cojinete
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Un rotor de 10 kg gira a velocidad constante de 300 rad/s alrededor de un
      eje fijo, pero su centro de gravedad está a 1 mm del eje. Calcular la
      resultante de las reacciones dinámicas en los cojinetes, y la masa que
      habría que añadir a 0,1 m del eje, en el mismo plano que $G$, para
      equilibrarlo estáticamente.
    pide: La fuerza dinámica sobre los cojinetes y la masa de equilibrado.
    pasos:
      - tipo: reconocer
        pregunta: |
          Con la velocidad angular constante, ¿por qué hay reacciones dinámicas?
        opciones:
          - texto: Porque G describe una circunferencia y tiene aceleración centrípeta
            correcta: true
            mensaje: |
              Eso es. Aunque $\omega$ no cambie, $G$ gira alrededor del eje y
              acelera hacia él. Por el teorema del momento lineal, esa
              aceleración exige una fuerza, y la dan los cojinetes.
          - texto: No las hay, porque la velocidad angular es constante
            mensaje: |
              Constante en módulo, pero $G$ va cambiando de dirección al girar:
              tiene aceleración centrípeta, $\omega^{2} e$, y eso necesita
              fuerza.
          - texto: Por el peso del rotor
            mensaje: |
              El peso da las reacciones **estáticas**, las que habría con el
              rotor quieto. Las dinámicas son las que aparecen solo por girar.

      - tipo: calcular
        titulo: La fuerza dinámica
        pregunta: |
          ¿Cuánto vale la resultante de las reacciones dinámicas, en N?
        respuesta:
          tipo: numero
          valor: '900'
          tolerancia: 5
          formato: un número, en N
        distractores:
          - valor: '3'
            mensaje: |
              Has usado $\omega$ en lugar de $\omega^{2}$. La aceleración
              centrípeta es $\omega^{2} e$.
          - valor: '900000'
            mensaje: |
              Has dejado el descentrado en milímetros. En metros es 0,001.
        pista: |
          $F = M\,a_G = M\,\omega^{2} e$, con $e$ en metros.
        desarrollo: |
          $$
          F = M\,\omega^{2} e = 10 \cdot 300^{2} \cdot 0{,}001 = 900\ \text{N}
          $$

          Casi diez veces el peso del rotor, por un milímetro.

      - tipo: calcular
        titulo: La masa de equilibrado
        pregunta: |
          ¿Qué masa hay que añadir a 0,1 m del eje, en el lado opuesto a $G$, en
          kg?
        respuesta:
          tipo: numero
          valor: '0.1'
          tolerancia: 0.002
          formato: un número, en kg
        distractores:
          - valor: '1'
            mensaje: |
              Revisa las unidades: el descentrado es 0,001 m, no 0,01. La
              condición es $M\,e = m\,r$.
          - valor: '0.01'
            mensaje: |
              Has dividido al revés o te has comido un cero. Con
              $10 \cdot 0{,}001 = m \cdot 0{,}1$, la masa es 0,1 kg.
        pista: |
          Equilibrado estático: el centro de gravedad del conjunto en el eje,
          $M\,e = m\,r$.
        desarrollo: |
          $$
          m = \frac{M\,e}{r} = \frac{10 \cdot 0{,}001}{0{,}1} = 0{,}1\ \text{kg}
          $$

          En el lado opuesto a $G$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: $G$ gira alrededor del eje a 1 mm, con aceleración centrípeta $\omega^{2} e = 90$ m/s².
          - texto: 'Por el teorema del momento lineal, los cojinetes dan $M\,\omega^{2} e = 900$ N, que giran con el rotor.'
          - texto: 'Para equilibrarlo, $M\,e = m\,r$: una masa de 0,1 kg a 0,1 m, en el lado opuesto a $G$.'
          - texto: Como la velocidad angular es constante, el rotor no carga los cojinetes más que con su peso.
            trampa: true
            mensaje: |
              Constante en módulo, pero $G$ gira: su aceleración centrípeta
              exige 900 N, casi diez veces el peso, que además giran con el
              rotor.
    resolucion: |
      **La fuerza dinámica.** El centro de gravedad describe una circunferencia
      de 1 mm de radio, con aceleración centrípeta $\omega^{2} e$. Por el teorema
      del momento lineal:

      $$
      F = M\,\omega^{2} e = 10 \cdot 90\,000 \cdot 0{,}001 = 900\ \text{N}
      $$

      Casi diez veces el peso de 98 N, y girando con el rotor: una vibración.

      **El equilibrado.** Añadir una masa $m$ a una distancia $r$, en el lado
      opuesto, para que el centro de gravedad del conjunto quede en el eje:

      $$
      M\,e = m\,r \;\Longrightarrow\; m = \frac{10 \cdot 0{,}001}{0{,}1} = 0{,}1\ \text{kg}
      $$

      Solo arregla el equilibrado estático. Si además hubiera productos de
      inercia, harían falta dos masas en dos planos.

  - id: ejma11-el-par-que-no-se-ve
    titulo: El par que carga los cojinetes con el centro de gravedad en el eje
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Un eje horizontal de masa despreciable gira a 50 rad/s entre dos
      cojinetes $A$ y $B$ separados 0,6 m. Lleva dos masas de 0,1 kg a 0,2 m del
      eje, en lados opuestos: una a 0,2 m de $A$ y la otra a 0,4 m de $A$.
      Calcular las reacciones dinámicas en los cojinetes.
    pide: Las reacciones dinámicas en A y en B.
    pasos:
      - tipo: reconocer
        pregunta: |
          El centro de gravedad del conjunto está en el eje. ¿Hay reacciones
          dinámicas?
        opciones:
          - texto: Sí, porque las dos fuerzas forman un par, y el eje no es dirección principal
            correcta: true
            mensaje: |
              Eso es. Está equilibrado estáticamente, pero no dinámicamente: las
              fuerzas de las dos masas son iguales y opuestas y no están en la
              misma recta. Su resultante es nula, su momento no.
          - texto: No, porque el centro de gravedad está en el eje
            mensaje: |
              Eso es el equilibrado **estático**, y solo anula la resultante. El
              momento de las dos fuerzas sigue ahí: falta el equilibrado
              dinámico.
          - texto: Sí, cada cojinete lleva la fuerza de la masa que tiene más cerca
            mensaje: |
              Los cojinetes no se reparten las masas: equilibran entre los dos
              la resultante y el momento del conjunto. Aquí la resultante es
              nula y solo queda el par.

      - tipo: calcular
        titulo: La fuerza de cada masa
        pregunta: |
          ¿Con qué fuerza tira cada masa hacia fuera, en N?
        respuesta:
          tipo: numero
          valor: '50'
          tolerancia: 0.2
          formato: un número, en N
        distractores:
          - valor: '1'
            mensaje: |
              Has usado $\omega$ en lugar de $\omega^{2}$: $m\,r\,\omega^{2} = 0{,}1 \cdot 0{,}2 \cdot 2500$.
        pista: |
          La fuerza que necesita cada masa para girar es $m\,r\,\omega^{2}$.
        desarrollo: |
          $$
          m\,r\,\omega^{2} = 0{,}1 \cdot 0{,}2 \cdot 50^{2} = 50\ \text{N}
          $$

      - tipo: calcular
        titulo: La reacción en cada cojinete
        pregunta: |
          ¿Cuánto vale la reacción dinámica en cada cojinete, en N?
        respuesta:
          tipo: numero
          valor: '16.67'
          tolerancia: 0.1
          formato: un número, en N
        distractores:
          - valor: '25'
            mensaje: |
              Has repartido la fuerza de una masa entre los dos cojinetes, como
              si fuera un desequilibrio estático. Aquí la resultante es nula y
              lo que hay que equilibrar es un par.
          - valor: '0'
            mensaje: |
              La resultante es nula, pero el momento no: $50 \cdot 0{,}2 = 10$ N·m.
              Los cojinetes lo equilibran con dos fuerzas opuestas.
        pista: |
          El par de las dos fuerzas es $50 \cdot (0{,}4 - 0{,}2) = 10\ \text{N}\cdot\text{m}$,
          y lo equilibran dos reacciones opuestas separadas 0,6 m.
        desarrollo: |
          $$
          R = \frac{50 \cdot 0{,}2}{0{,}6} = 16{,}67\ \text{N}
          $$

          En $A$ y en $B$, en sentidos contrarios.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: Cada masa tira hacia fuera con $m\,r\,\omega^{2} = 50$ N, y como están en lados opuestos, la resultante es nula.
          - texto: Pero están en planos separados 0,2 m, así que forman un par de 10 N·m.
          - texto: Los cojinetes lo equilibran con dos fuerzas opuestas de $10/0{,}6 = 16{,}7$ N, que giran con el eje.
          - texto: Como el centro de gravedad está en el eje, el rotor está equilibrado y no carga los cojinetes.
            trampa: true
            mensaje: |
              El centro de gravedad en el eje es solo el equilibrado estático.
              Falta el dinámico: el producto de inercia no es nulo y aparece un
              par.
    resolucion: |
      **Las fuerzas.** Cada masa necesita $m\,r\,\omega^{2} = 0{,}1 \cdot 0{,}2 \cdot 2500 = 50$ N
      hacia el eje para girar; sobre el eje, cada una tira hacia fuera con esos
      50 N. Como están en lados opuestos, la resultante es nula: el centro de
      gravedad está en el eje.

      **El par.** Las dos fuerzas están separadas 0,2 m a lo largo del eje, así
      que forman un par de $50 \cdot 0{,}2 = 10\ \text{N}\cdot\text{m}$.

      **Las reacciones.** Tomando momentos en $A$:

      $$
      50 \cdot 0{,}2 - 50 \cdot 0{,}4 + R_B \cdot 0{,}6 = 0 \;\Longrightarrow\; R_B = 16{,}67\ \text{N}
      $$

      y $R_A = -16{,}67$ N: iguales y opuestas. Es el desequilibrio dinámico, y
      se corrige con masas en dos planos que anulen el producto de inercia.

  - id: ejma11-col111-el-disco-inclinado-sobre-su-eje
    titulo: El disco inclinado, y las reacciones que aparecen solo por girar
    fuente: >-
      Ejercicio 11.1 · Tema 11, «Dinámica del sólido rígido con eje fijo» ·
      Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección publica el
      resultado, contra el que está contrastado el desarrollo, y también se ha
      contrastado con la resolución oficial del profesor. El resultado es
      simbólico, así que las casillas usan valores de prueba nuestros,
      declarados en cada pregunta: masa 12 kg, radio 0,25 m, semidistancia
      entre cojinetes 0,4 m, velocidad angular 60 rad/s e inclinación
      30 grados.
    nivel: practica
    enunciado: |
      Un disco circular de radio $R$ y masa $M$ gira alrededor del eje $AB$ con
      una velocidad angular $\omega$ constante. El disco está inclinado un
      ángulo $\theta$ respecto al eje de giro. Determinar las reacciones
      dinámicas que se producen en $A$ y en $B$.

      <figure>
