      Con los ejes del enunciado: Z a la izquierda, Y arriba y X hacia el observador. Todas las componentes, en su sentido positivo; el par, como vector a lo largo del eje.

      </figcaption>
      </figure>

      - **En A**, $A_x$ y $A_y$; **en B**, $B_x$, $B_y$ y la axial, $B_z$.
      - **En G**, el peso, $Mg$: a 150 mm por encima del eje y a 750 mm de
        $B$ a lo largo de él.
      - **A lo largo del eje**, el par $P$.

      **2. Incógnitas.** $A_x$, $A_y$, $B_x$, $B_y$, $B_z$ y $P$: seis, con
      seis ecuaciones. Para el equilibrado, las coordenadas $x$ e $y$ de las
      dos masas; sus planos los da el enunciado, $z_1 = 100$ mm y
      $z_2 = 300$ mm.

      **3. Ecuaciones.** Midiendo desde $B$, $G$ está en
      $(0;\ 150;\ 750)$ mm. La placa es simétrica respecto de sus dos ejes
      centrales: en ejes de $G$ sus productos de inercia son nulos,
      $\vec{H}_G = I_{Gz}\,\omega\,\hat{k}$ es constante y
      $\dot{\vec{H}}_G = 0$. Con $\omega$ constante, $G$ solo tiene la
      aceleración hacia el eje:

      $$
      \vec{a}_G = -\omega^{2}y_G\,\hat{\jmath} = -25 \cdot 0{,}15\,\hat{\jmath} = -3{,}75\,\hat{\jmath}\ \text{m/s}^{2}
      $$

      Con $a = 100$ mm, $A$ está a $3{,}5a$ de $G$ a lo largo del eje y $B$, a
      $7{,}5a$, los dos del mismo lado:

      $$
      A_x + B_x = 0
      \qquad
      A_y + B_y - Mg = -M\omega^{2}y_G
      \qquad
      B_z = 0
      $$

      $$
      \frac{7}{2}a\,A_y + \frac{15}{2}a\,B_y = 0
      \qquad
      \frac{7}{2}a\,A_x + \frac{15}{2}a\,B_x = 0
      \qquad
      P = 0
      $$

      Para el equilibrado, el centro de gravedad de todo en el eje y el
      producto de inercia del conjunto respecto de $B$ nulo. La placa entra
      con el suyo: nulo en ejes de $G$, respecto de $B$ vale
      $M\,y_G\,z_G = 2 \cdot 150 \cdot 750 = 225000$ kg·mm²:

      $$
      M\,y_G + m\,y_1 + m\,y_2 = 0
      \qquad
      M\,y_G\,z_G + m\,y_1 z_1 + m\,y_2 z_2 = 0
      $$

      y en $x$, con $x_G = 0$ y la placa en el plano $x = 0$, $x_1 = x_2 = 0$.

      **4. Resultados.** $A_x = B_x = 0$, $B_z = 0$, $P = 0$ y

      $$
      A_y = \frac{15}{8}Mg - \frac{45}{16}M\omega^{2}a = 22{,}69\ \text{N}
      \qquad
      B_y = -\frac{7}{8}Mg + \frac{21}{16}M\omega^{2}a = -10{,}59\ \text{N}
      $$

      $$
      M_1\left(0,\ 675,\ 100\right)\ \text{mm}
      \qquad
      M_2\left(0,\ -975,\ 300\right)\ \text{mm}
      $$

      Las estáticas son las de $\omega = 0$: $\tfrac{15}{8}Mg = 36{,}75$ N y
      $-\tfrac{7}{8}Mg = -17{,}15$ N. El signo de $B_y$ no es un error: la
      placa está fuera de los dos apoyos, y $B$ tiene que tirar hacia abajo.
