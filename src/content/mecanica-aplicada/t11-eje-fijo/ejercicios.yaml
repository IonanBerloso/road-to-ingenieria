      **5. Comprobación.** Por momentos respecto de $B$ en lugar de $G$, que
      dan $A_y$ sin pasar por $B_y$. Respecto de $B$ la placa sí tiene
      producto de inercia, $I_{yz} = 0{,}225$ kg·m², y al girar con $\omega$
      constante pide un momento $I_{yz}\,\omega^{2} = 0{,}225 \cdot 25 = 5{,}625$ N·m
      según $x$. El peso da respecto de $B$
      $0{,}75 \cdot 19{,}6 = 14{,}7$ N·m, y $A$ está a 0,4 m:

      $$
      -0{,}4\,A_y + 14{,}7 = 5{,}625
      \;\Rightarrow\;
      0{,}4\,A_y = 14{,}7 - 5{,}625 = 9{,}075
      \;\Rightarrow\;
      A_y = 9{,}075/0{,}4 = 22{,}69\ \text{N}
      $$

      Y de las fuerzas, $B_y = 12{,}1 - 22{,}69 = -10{,}59$ N. Las masas,
      sustituidas: $2 \cdot 150 + 675 - 975 = 0$ y
      $225000 + 675 \cdot 100 - 975 \cdot 300 = 0$. Las de la colección,
      $(0,\ -450,\ 100)$ y $(0,\ 150,\ 300)$, cumplen la primera,
      $300 - 450 + 150 = 0$, pero en la segunda dejan
      $225000 - 45000 + 45000 = 225000$ kg·mm²: el producto de la placa,
      sin cancelar.

      **Lo que dice el resultado.** En esta posición la parte dinámica
      descarga los dos apoyos, porque $G$ está arriba y su aceleración apunta
      hacia abajo; media vuelta después los cargaría, y $A$ pasaría de
      22,69 N a 50,81 N. Esa oscilación en cada vuelta es la vibración de un
      rotor desequilibrado. Los planos de equilibrado están cerca de $B$ y
      lejos de la placa, así que las masas necesitan brazos de casi un metro,
      y la del plano más cercano a $B$ va del mismo lado que la placa.
