          </marker>
        </defs>
        <path d="M196 70 H204 V170 H196 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <line x1="100" y1="120" x2="250" y2="120" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
        <path d="M88 113 H112 V127 H88 Z" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
        <path d="M238 113 H262 V127 H238 Z" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
        <path d="M100 182 H200 M100 178 V186 M200 178 V186" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="150" y="178" font-size="9" text-anchor="middle" fill="var(--faint)">2R</text>
