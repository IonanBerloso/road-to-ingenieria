      </figcaption>
      </figure>
    pide: El par P y las reacciones en A y D en t igual a cero, y la posición de las dos masas de equilibrado.
    pasos:
      - tipo: reconocer
        pregunta: |
          En $t = 0$, ¿qué valen $\omega$ y $\alpha$, y qué consecuencia tiene?
        opciones:
          - texto: Omega vale cero y alfa vale 2g/L, así que desaparecen los términos con omega al cuadrado pero no los de alfa
            correcta: true
            mensaje: |
              Eso es. $\omega(0) = 0$ porque el seno se anula, y
              $\alpha(0) = \dot{\omega}(0) = 2g/L$. Como
              $\vec{H}_A = [I_A]\vec{\omega}$ es nulo, el término
              $\vec{\omega} \times \vec{H}_A$ también, y solo queda
              $[I_A]\vec{\alpha}$.
          - texto: Los dos son cero, porque el seno empieza en cero y con él su derivada
            mensaje: |
              La derivada de $\operatorname{sen}(kt)$ es $k\cos(kt)$, que en
              $t = 0$ vale $k$, no cero. Justo al arrancar la velocidad es nula
              y la aceleración angular es **máxima**.
          - texto: Omega vale la raíz de 2g partido por L, que es lo que dice el dato
            mensaje: |
              Eso es la **amplitud** del seno, el valor máximo que alcanzará
              $\omega$. En $t = 0$ el seno vale cero y $\omega$ también.
          - texto: No se puede saber, porque el dato de omega depende del tiempo
            mensaje: |
              Sí se puede: se sustituye $t = 0$ en la expresión y se deriva. El
              enunciado da $\omega(t)$ precisamente para poder sacar de ahí
              $\omega$ y $\alpha$ en el instante que se pide.

      - tipo: calcular
        titulo: La aceleración angular en el arranque
        pregunta: |
          Con $L = 0{,}4$ m y $g = 9{,}8$ m/s², ¿cuánto vale $\alpha$ en
          $t = 0$?
        respuesta:
          tipo: numero
          valor: '49'
          tolerancia: 0.2
          formato: un número, en rad/s al cuadrado
        distractores:
          - valor: '7'
            mensaje: |
              Ese es $\sqrt{2g/L}$, la amplitud de la velocidad angular, en
              rad/s. La aceleración es su derivada, y sale multiplicada otra vez
              por la misma raíz: $2g/L$.
          - valor: '24.5'
            mensaje: |
              Te has dejado el 2. El dato es $\sqrt{2g/L}$ y al derivar aparece
              el cuadrado de esa raíz, que es $2g/L = 49$.
          - valor: '0'
            mensaje: |
              Cero es $\omega(0)$, no $\alpha(0)$. Que la velocidad angular
              arranque de cero no impide que esté cambiando deprisa.
        pista: |
          Deriva $\omega(t) = k\operatorname{sen}(kt)$ con $k = \sqrt{2g/L}$ y
          evalúa en $t = 0$.
        desarrollo: |
          $$
          \alpha = \frac{d\omega}{dt} = k^{2}\cos(kt)
          \qquad
          k^{2} = \frac{2g}{L}
          $$

          $$
          \alpha(0) = \frac{2 \cdot 9{,}8}{0{,}4} = 49\ \text{rad/s}^{2}
          $$

      - tipo: calcular
        titulo: El par P en el arranque
        pregunta: |
          Con $M = 6$ kg, ¿cuánto vale el par $P$ en $t = 0$?
        respuesta:
          tipo: magnitud
          valor: '31.36 N·m'
          formato: un par, con su unidad
        distractores:
          - valor: '15.68 N·m'
            mensaje: |
              Has usado el momento de inercia de un solo cuadrado. El tercer
              elemento de la diagonal, $2ML^{2}/3$, ya es el del **conjunto**:
              cada cuadrado aporta $ML^{2}/3$ respecto del eje.
          - valor: '423.4 N·m'
            mensaje: |
              Has cogido el primer elemento de la diagonal, $9ML^{2}$, que es
              $I_{xx}$. La ecuación según el eje de giro lleva $I_{zz}$, el
              tercero.
          - valor: '4.48 N·m'
            mensaje: |
              Has multiplicado por $\sqrt{2g/L} = 7$ en vez de por
              $\alpha = 49$. Revisa el paso anterior.
        pista: |
          La ecuación de momentos según $Z$ no lleva reacciones:
          $P = I_{zz}\,\alpha$ con $I_{zz} = 2ML^{2}/3$.
        desarrollo: |
          $$
          P = I_{zz}\,\alpha = \frac{2ML^{2}}{3}\cdot\frac{2g}{L} = \frac{4MgL}{3}
          $$

          $$
          P = \frac{4 \cdot 6 \cdot 9{,}8 \cdot 0{,}4}{3} = 31{,}36\ \text{N}\cdot\text{m}
          $$

      - tipo: calcular
        titulo: La reacción horizontal en D
        pregunta: |
          El centro de gravedad del conjunto está en $(L/4,\ L/4,\ 2L)$. Tomando
          momentos en $A$, ¿cuánto vale $D_y$?
        respuesta:
          tipo: magnitud
          valor: '29.4 N'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '-7.35 N'
            mensaje: |
              Has igualado el momento del peso a cero, o sea has supuesto
              $\dot{H}_{Ax} = 0$. No lo es: el producto de inercia
              $-5ML^{2}/4$ de la matriz hace que $\vec{H}_A$ tenga componente
              según $x$, y su derivada vale $-5MgL/2$.
          - valor: '-29.4 N'
            mensaje: |
              El módulo está bien y el signo no. Con
              $-MgL/2 - 4L\,D_y = -5MgL/2$ sale $D_y = +Mg/2$.
          - valor: '58.8 N'
            mensaje: |
              Ese es $Mg$, sin el medio. Al despejar,
              $4L\,D_y = -MgL/2 + 5MgL/2 = 2MgL$, y $D_y = Mg/2$.
        pista: |
          $\dot{H}_{Ax} = -\tfrac{5}{4}ML^{2}\alpha = -\tfrac{5}{2}MgL$, y el
          peso da $-MgL/2$ según $x$. La reacción de $D$ tiene el brazo $4L$.
        desarrollo: |
          El momento en $A$ según $x$ lo dan el peso del conjunto, aplicado en
          $G$, y la reacción horizontal de $D$:

          $$
          -2Mg\,\frac{L}{4} - 4L\,D_y = \dot{H}_{Ax} = -\frac{5ML^{2}}{4}\,\frac{2g}{L} = -\frac{5MgL}{2}
          $$

          $$
          D_y = \frac{Mg}{2} = \frac{6 \cdot 9{,}8}{2} = 29{,}4\ \text{N}
          $$

          Y por el mismo camino según $y$, $D_x = -Mg/2 = -29{,}4$ N. De las
          fuerzas salen entonces $A_x = -Mg/2$, $A_y = Mg/2$ y $A_z = 2Mg$,
          porque $D$ no puede dar reacción vertical.

      - tipo: calcular
        titulo: Dónde va la masa del plano de B
        pregunta: |
          Para equilibrar se colocan dos masas de valor $M$ en los planos
          $z = L$ (por $B$) y $z = 3L$ (por $C$). ¿Cuánto vale $y_1$, la
          coordenada $y$ de la masa del plano de $B$, en milímetros?
        respuesta:
          tipo: magnitud
          valor: '-150 mm'
          formato: una longitud, con su signo y su unidad
        distractores:
          - valor: '-100 mm'
            mensaje: |
              Has usado $2M\,y_G\,z_G$ como producto de inercia del conjunto. No
              lo es: el producto de inercia real lo da la matriz del enunciado,
              $I_{yz} = 3ML^{2}/4$, que no coincide con el de una masa puntual
              colocada en $G$.
          - valor: '-50 mm'
            mensaje: |
              Esa es $y_2$, la de la masa del plano de $C$. Las dos coordenadas
              salen cruzadas: $y_1 = -3L/8$ e $y_2 = -L/8$.
          - valor: '150 mm'
            mensaje: |
              El módulo está bien y el signo no. Las masas de equilibrado van al
              **lado opuesto** de donde está el centro de gravedad, que aquí
              tiene $y_G = +L/4$.
        pista: |
          Dos condiciones con $y$: $2M\,y_G + M y_1 + M y_2 = 0$ y
          $I_{yz} + M y_1 z_1 + M y_2 z_2 = 0$, con $z_1 = L$ y $z_2 = 3L$.
        desarrollo: |
          $$
          2M\frac{L}{4} + M y_1 + M y_2 = 0 \;\Longrightarrow\; y_1 + y_2 = -\frac{L}{2}
          $$

          $$
          \frac{3ML^{2}}{4} + M y_1 L + M y_2\,3L = 0 \;\Longrightarrow\; y_1 + 3y_2 = -\frac{3L}{4}
          $$

          Restando, $y_2 = -L/8$ e $y_1 = -3L/8 = -150$ mm. Con las dos
          condiciones en $x$ se obtiene igual $x_1 = -L/8$ y $x_2 = -3L/8$, o
          sea las posiciones que publica la colección:

          $$
          M_1\left(-\frac{L}{8},\ -\frac{3L}{8},\ L\right)
          \qquad
          M_2\left(-\frac{3L}{8},\ -\frac{L}{8},\ 3L\right)
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'En $t = 0$, $\omega = 0$ y $\alpha = 2g/L$, así que $\dot{\vec{H}}_A = [I_A]\,\vec{\alpha}$ y el término del arrastre desaparece.'
          - texto: 'La tercera columna de la matriz da $\dot{\vec{H}}_A = \left(-\tfrac{5}{2}MgL,\ -\tfrac{3}{2}MgL,\ \tfrac{4}{3}MgL\right)$, y de la componente $z$ sale $P = 4MgL/3$.'
          - texto: 'Con las dos componentes horizontales y los momentos del peso salen $D_x = -Mg/2$ y $D_y = Mg/2$, y de las fuerzas, las de $A$.'
          - texto: Como en t igual a cero la velocidad angular es nula, el momento angular es nulo y las ecuaciones de momentos solo llevan el peso.
            trampa: true
            mensaje: |
              El momento angular sí es nulo, pero lo que aparece en las
              ecuaciones es su **derivada**, y esa no lo es: vale
              $[I_A]\vec{\alpha}$, con las componentes horizontales que le dan
              los productos de inercia. Si se ignoran, $D_y$ sale $-Mg/8$ en
              vez de $+Mg/2$.
    resolucion: |
      **El instante t = 0.** De $\omega = k\operatorname{sen}(kt)$ con
      $k = \sqrt{2g/L}$ sale $\omega(0) = 0$ y
      $\alpha(0) = k^{2} = 2g/L$. La velocidad angular es nula y la aceleración
      angular, máxima.

      **La cinemática de G.** El centro de gravedad del conjunto está en
      $(L/4,\ L/4,\ 2L)$, y con $\omega = 0$:

      $$
      \vec{a}_G = \vec{\alpha} \times \vec{r}_G = \frac{2g}{L}\left(-\frac{L}{4},\ \frac{L}{4},\ 0\right) = \left(-\frac{g}{2},\ \frac{g}{2},\ 0\right)
      $$

      **La derivada del momento angular.** Con $\vec{\omega} = 0$ solo queda
      $[I_A]\vec{\alpha}$, o sea la tercera columna de la matriz por $\alpha$:

      $$
      \dot{\vec{H}}_A = \left(-\frac{5ML^{2}}{4},\ -\frac{3ML^{2}}{4},\ \frac{2ML^{2}}{3}\right)\frac{2g}{L} = \left(-\frac{5MgL}{2},\ -\frac{3MgL}{2},\ \frac{4MgL}{3}\right)
      $$

      **Los momentos en A.** El peso $2Mg$ aplicado en $G$ y las reacciones de
      $D$, con brazo $4L$:

      $$
      -\frac{MgL}{2} - 4L\,D_y = -\frac{5MgL}{2}
      \qquad
      \frac{MgL}{2} + 4L\,D_x = -\frac{3MgL}{2}
      \qquad
      P = \frac{4MgL}{3}
      $$

      de donde $D_y = Mg/2$ y $D_x = -Mg/2$.

      **Las fuerzas.** $A_x + D_x = 2M(-g/2)$ y $A_y + D_y = 2M(g/2)$ dan
      $A_x = -Mg/2$ y $A_y = Mg/2$; y como $D_z = 0$, $A_z = 2Mg$.

      **El equilibrado.** Cuatro condiciones para las dos masas: las dos de
      $G$ en el eje y las dos de productos de inercia nulos, tomando los
      productos **de la matriz**, no los de una masa puntual en $G$:

      $$
      M_1\left(-\frac{L}{8},\ -\frac{3L}{8},\ L\right)
      \qquad
      M_2\left(-\frac{3L}{8},\ -\frac{L}{8},\ 3L\right)
      $$

      **Comprobación.** Con $M = 6$ kg y $L = 0{,}4$ m: $\alpha = 49$ rad/s²,
      $P = 31{,}36$ N·m, $A = (-29{,}4;\ 29{,}4;\ 117{,}6)$ N,
      $D = (-29{,}4;\ 29{,}4;\ 0)$ N y las masas en
      $(-50;\ -150;\ 400)$ mm y $(-150;\ -50;\ 1200)$ mm. Los mismos números
      salen discretizando las dos placas en masas puntuales y resolviendo el
      sistema de seis ecuaciones, y la matriz de inercia discretizada reproduce
      la del enunciado.
  - id: ejma11-col114-la-placa-triangular-y-el-semiaro
    titulo: La placa triangular con el semiaro, y la masa que la equilibra
    fuente: >-
      Ejercicio 11.4 · Tema 11, «Dinámica del sólido rígido con eje fijo» ·
      Mecánica Aplicada, UPV/EHU, curso 2025-2026. La colección publica el
      resultado, contra el que está contrastado el desarrollo, y también se ha
      contrastado con la resolución oficial del profesor. En la posición de la
      masa de equilibrado los dos no coinciden y aquí se publica la de la
      colección, que es la que reproducen las cuentas; la resolución oficial da
      menos R partido por 6 porque en esa última línea usa el producto de
      inercia de una masa puntual en G en vez del que da su propia matriz. El
      resultado es simbólico, así que las casillas usan valores de prueba
      nuestros, declarados en cada pregunta: masa 9 kg cada cuerpo, radio 0,3 m,
      velocidad angular 20 rad/s y gravedad 9,8 metros por segundo al cuadrado.
    nivel: practica
    enunciado: |
      Una placa triangular de masa $M$ y espesor despreciable está soldada a un
      eje vertical. En el mismo plano vertical y soldado a ese eje hay un
      semiaro de masa $M$ y radio $R$, tal y como se indica en la figura. El
      sistema gira con velocidad angular $\omega$ constante alrededor del eje
      accionado por un par $P$. Calcular:

      DATO: Tensor axil en O:

      $$
      [I_O] = \begin{bmatrix}
      4/3 & 0 & 0 \\
      0 & 2/3 & -1/12 \\
      0 & -1/12 & 2/3
      \end{bmatrix}
      $$

      a) Reacciones en los apoyos.

      b) Para equilibrar el sistema, se coloca una masa $m$ a una distancia
      $+R$ del eje. Hallar el valor de esta masa en función de $M$ y situar su
      posición.

      <figure>
      <svg viewBox="0 0 320 350" role="img" width="320" height="350" aria-labelledby="ejma11-col114-t ejma11-col114-d">
        <title id="ejma11-col114-t">Placa triangular y semiaro soldados a un eje vertical, en el mismo plano</title>
        <desc id="ejma11-col114-d">Eje vertical con el apoyo A arriba y el apoyo B abajo, cada uno a dos R del origen O. El semiaro, de radio R, ocupa el lado de las y negativas y va desde la altura más R hasta la altura menos R. La placa triangular tiene un vértice en O, otro en la altura más R sobre el eje y el tercero a una distancia R sobre el eje Y positivo. El par P y la velocidad angular omega van según el eje Z, vertical.</desc>
