            <text x="102" y="268" font-size="9" text-anchor="end" fill="var(--faint)">A</text>
          </svg>

      - tipo: calcular
        titulo: Las reacciones según Y
        pregunta: |
          Con $M = 20$ kg, $R = 0{,}4$ m, $a = 0{,}5$ m y $\alpha = 6$ rad/s²,
          ¿cuánto vale $A_y$?
        respuesta:
          tipo: magnitud
          valor: '6 N'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '12 N'
            mensaje: |
              Esa es la fuerza total, $M\,\alpha\,x_G$. La ecuación de momentos
              según $X$ da $A_y = B_y$, así que los dos apoyos se reparten esa
              resultante a partes iguales.
          - valor: '225 N'
            mensaje: |
              Has usado $\omega^{2}$ donde va $\alpha$. La componente $y$ de la
              aceleración de $G$ es la **tangencial**, $\alpha\,x_G$; la que
              lleva $\omega^{2}$ es la normal, que va según $x$.
        pista: |
          $a_{Gy} = \alpha\,x_G - \omega^{2} y_G$, y aquí $x_G = R/4$ e
          $y_G = 0$. Y de los momentos según $X$ sale $A_y = B_y$.
        desarrollo: |
          $$
          A_y + B_y = M\,\alpha\,\frac{R}{4} = 20 \cdot 6 \cdot 0{,}1 = 12\ \text{N}
          $$

          Los momentos según $X$ dan $a(A_y - B_y) = 0$, así que

          $$
          A_y = B_y = \frac{MR\alpha}{8} = 6\ \text{N}
          $$

          Toda esta componente es dinámica: se va con $\alpha$.

      - tipo: calcular
        titulo: La reacción en A según X
        pregunta: |
          Con $\omega = 15$ rad/s y $g = 9{,}8$ m/s², ¿cuánto vale $A_x$, con su
          signo?
        respuesta:
          tipo: magnitud
          valor: '-205.4 N'
          formato: una fuerza, con su signo y su unidad
        distractores:
          - valor: '-244.6 N'
            mensaje: |
              Ese es $B_x$. Las dos partes se suman con signos distintos en cada
              apoyo: la dinámica, $-MR\omega^{2}/8$, es igual en los dos, y la
              estática, $\pm MgR/(8a)$, cambia de signo.
          - valor: '-225 N'
            mensaje: |
              Esa es solo la parte dinámica, $-MR\omega^{2}/8$. Falta la
              estática que produce el peso descentrado, $+MgR/(8a) = 19{,}6$ N.
          - valor: '19.6 N'
            mensaje: |
              Esa es solo la reacción estática, la que habría con el disco
              parado. El enunciado pide las dos, y la dinámica es aquí más
              de once veces mayor.
        pista: |
          De las fuerzas, $A_x + B_x = -M\omega^{2}R/4$; de los momentos según
          $Y$, $A_x - B_x = MgR/(4a)$.
        desarrollo: |
          $$
          A_x + B_x = M\left(-\omega^{2}\frac{R}{4}\right) = -450\ \text{N}
          \qquad
          A_x - B_x = \frac{MgR}{4a} = 39{,}2\ \text{N}
          $$

          $$
          A_x = -\frac{MR}{8}\left(\omega^{2} - \frac{g}{a}\right) = -\frac{20 \cdot 0{,}4}{8}\left(225 - 19{,}6\right) = -205{,}4\ \text{N}
          $$

          y $B_x = -\dfrac{MR}{8}\left(\omega^{2} + \dfrac{g}{a}\right) = -244{,}6$ N,
          que es lo que publica la colección.

      - tipo: calcular
        titulo: El par necesario
        pregunta: |
          ¿Cuánto vale el par $T$?
        respuesta:
          tipo: magnitud
          valor: '10.8 N·m'
          formato: un par, con su unidad
        distractores:
          - valor: '9.6 N·m'
            mensaje: |
              Has usado $I_{Gz} = MR^{2}/2$ olvidando que el eje de giro pasa
              por $C$, no por $G$. Con Steiner,
              $I_{Cz} = MR^{2}/2 + M(R/4)^{2} = 9MR^{2}/16$.
          - valor: '4.8 N·m'
            mensaje: |
              $MR^{2}/4$ es el momento de inercia respecto de un **diámetro**
              del disco. El que gira aquí es el eje perpendicular al disco, y
              ese vale $MR^{2}/2$ antes de trasladarlo a $C$.
          - valor: '27 N·m'
            mensaje: |
              Has puesto $\omega$ donde va $\alpha$. La ecuación según el eje es
              $M_z = I_z\,\alpha$: la velocidad angular no aparece.
        pista: |
          La ecuación de momentos según $Z$ no lleva reacciones de apoyo:
          $T - \tfrac{R}{4}(A_y + B_y) = I_{Gz}\,\alpha$.
        desarrollo: |
          $$
          T = I_{Gz}\,\alpha + \frac{R}{4}\left(A_y + B_y\right) = \frac{MR^{2}}{2}\alpha + \frac{MR^{2}}{16}\alpha = \frac{9MR^{2}\alpha}{16}
          $$

          $$
          T = \frac{9 \cdot 20 \cdot 0{,}16 \cdot 6}{16} = 10{,}8\ \text{N}\cdot\text{m}
          $$

          Que es lo mismo que $I_{Cz}\,\alpha$ con el momento de inercia
          trasladado al eje real de giro.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Con $G$ a $R/4$ del eje, su aceleración vale $a_{Gx} = -\omega^{2}R/4$ y $a_{Gy} = \alpha R/4$.'
          - texto: 'De $\vec{F} = M\vec{a}_G$ salen las dos sumas $A_x + B_x$ y $A_y + B_y$, y de los momentos, las dos diferencias.'
          - texto: 'La ecuación según $Z$, sin reacciones, da $T = 9MR^{2}\alpha/16$.'
          - texto: Como el disco es simétrico respecto de su plano, el eje de giro es principal y no hay reacciones dinámicas.
            trampa: true
            mensaje: |
              Los productos de inercia sí son nulos —el plano del disco es de
              simetría—, y por eso $\dot{\vec{H}}$ solo tiene componente según
              $Z$. Pero el equilibrado **estático** falla: $G$ está a $R/4$ del
              eje, y esa es la fuente de las reacciones dinámicas de este
              problema.
    resolucion: |
      **1. Sólidos libres.** Es un problema de dinámica de un sólido que gira
      alrededor de un eje fijo: el dibujo lleva el disco con su eje, de lado,
      sin los apoyos.

