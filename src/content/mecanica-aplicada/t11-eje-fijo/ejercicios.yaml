      <figcaption>

      En el plano YZ, con X hacia fuera del papel. A lo largo del eje basta con una componente, en B.

      </figcaption>
      </figure>

      - **En A**, $A_x$ y $A_y$; **en B**, $B_x$, $B_y$ y la axial, $B_z$.
      - **El peso de cada cuerpo**, $Mg$: el del semiaro en su centroide,
        $G_1$, a $2R/\pi$ del eje y a la altura de $O$; el del triángulo en
        $G_2$, a un tercio de cada cateto.
      - **Alrededor del eje**, el par $P$.

      **2. Incógnitas.** $A_x$, $A_y$, $B_x$, $B_y$, $B_z$ y el par $P$: seis,
      con seis ecuaciones. Para el equilibrado, la masa $m$ y su posición; de
      ella, el enunciado da $y_m = R$.

      **3. Ecuaciones.** Todo está en el plano $x = 0$: $x_G = 0$ y los
      productos con $x$, nulos. El centro de gravedad del conjunto:

      $$
      y_G = \frac{M\left(-\frac{2R}{\pi}\right) + M\,\frac{R}{3}}{2M} = \left(\frac{1}{6} - \frac{1}{\pi}\right)R
      \qquad
      z_G = \frac{M \cdot 0 + M\,\frac{R}{3}}{2M} = \frac{R}{6}
      $$

      El tensor del enunciado da $I_{yz} = MR^{2}/12$, que aparece en la
      matriz con el signo cambiado, e $I_z = 2MR^{2}/3$; la colección imprime
      la matriz sin el factor $MR^{2}$, que sí escribe la resolución oficial.
      Con $\omega$ constante, $\alpha = 0$, y en ejes del sólido las
      componentes de $\vec{H}_O = -I_{yz}\,\omega\,\hat{\jmath} + I_z\,\omega\,\hat{k}$
      no cambian; su derivada es solo la del giro de los ejes:

      $$
      \vec{a}_G = -\omega^{2} y_G\,\hat{\jmath}
      \qquad
      \dot{\vec{H}}_O = \vec{\omega} \times \vec{H}_O = I_{yz}\,\omega^{2}\,\hat{\imath}
      $$

      Con $A$ en $z = 2R$, $B$ en $z = -2R$ y el peso $2Mg$ aplicado en $G$:

      $$
      A_x + B_x = 0
      \qquad
      A_y + B_y = -2M\omega^{2}y_G
      \qquad
      B_z - 2Mg = 0
      $$

      $$
      -2R\left(A_y - B_y\right) - 2Mg\,y_G = I_{yz}\,\omega^{2}
      \qquad
      2R\left(A_x - B_x\right) = 0
      \qquad
      P = 0
      $$

      Para el equilibrado, con la masa en $(x_m,\ R,\ z_m)$: el centro de
      gravedad de todo en el eje y los dos productos nulos, con el producto
      **de la matriz**:

      $$
      2M\,y_G + m\,R = 0
      \qquad
      \frac{MR^{2}}{12} + m\,R\,z_m = 0
      \qquad
      x_m = 0
      $$

      **4. Resultados.** $A_x = B_x = 0$, $P = 0$, $B_z = 2Mg$ y

      $$
      A_y = MR\omega^{2}\left(\frac{1}{\pi} - \frac{3}{16}\right) + Mg\left(\frac{1}{2\pi} - \frac{1}{12}\right)
      \qquad
      B_y = MR\omega^{2}\left(\frac{1}{\pi} - \frac{7}{48}\right) + Mg\left(\frac{1}{12} - \frac{1}{2\pi}\right)
      $$

      $$
      m = \left(\frac{2}{\pi} - \frac{1}{3}\right)M
      \qquad
      z_m = -\frac{\pi R}{4\left(6 - \pi\right)} = -0{,}2748\,R
      $$

      Lo que publica la colección. Con $M = 9$ kg, $R = 0{,}3$ m,
      $\omega = 20$ rad/s y $g = 9{,}8$ m/s²: $y_G = -45{,}5$ mm,
      $A_y = 147{,}96$ N, $B_y = 179{,}58$ N, $B_z = 176{,}4$ N,
      $m = 2{,}73$ kg y $z_m = -82{,}4$ mm.

