            <path d="M0 0 L8 4 L0 8 z" fill="var(--live)"/>
          </marker>
        </defs>

        <line x1="160" y1="62" x2="160" y2="36" stroke="var(--ink)" stroke-width="1.2" marker-end="url(#ejma11-col114-fi)"/>
        <text x="150" y="30" font-size="11" fill="var(--ink)">Z</text>
        <line x1="160" y1="70" x2="160" y2="290" stroke="var(--ink)" stroke-width="2.5"/>

