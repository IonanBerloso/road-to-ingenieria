        <text x="300" y="100" font-size="11" fill="var(--live)">ω, α, P</text>
      </svg>
      <figcaption>

      Vista lateral y vista frontal. El apoyo **A** está a **2R** del plano del
      disco y el **B**, a **R** por el otro lado. El centro de gravedad **G**
      queda **0,1R** por encima del eje —en el dibujo va exagerado para que se
      vea— y los dos planos de equilibrado son los de **z = −R** y
      **z = 0,5R**.

      </figcaption>
      </figure>
    pide: Las reacciones en A y B, el par P, y las posiciones de las dos masas de equilibrado.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué clase de desequilibrio tiene esta muela antes de corregirla?
        opciones:
          - texto: Solo estático, porque el plano del disco es de simetría y sus productos de inercia son nulos
            correcta: true
            mensaje: |
              Eso es. Toda la masa está en el plano $z = 0$, así que
              $I_{xz} = I_{yz} = 0$: el eje ya es dirección principal. Lo único
              que falla es que $G$ no está en el eje.
          - texto: Dinámico, porque hay aceleración angular
            mensaje: |
              La aceleración angular carga los apoyos, pero no es un
              desequilibrio: cuando el motor deje de acelerar desaparece. El
              desequilibrio es la geometría de masas, y aquí es $G$ fuera del
              eje.
          - texto: Estático, y por eso basta con una masa correctora en un plano cualquiera
            mensaje: |
              La primera mitad es cierta y la segunda no. Si pones la masa en un
              plano distinto del de $G$ arreglas la resultante y **creas** un
              producto de inercia que antes no había. Por eso el enunciado da
              dos planos.
          - texto: Ninguno, porque 0,1R es un descentrado muy pequeño
            mensaje: |
              Pequeño en longitud, no en efecto: la fuerza va con $\omega^{2}$ y
              crece con el cuadrado de la velocidad. Aquí ya vale 4 N con la
              muela girando despacio.

      - tipo: calcular
        titulo: El par motor
        pregunta: |
          El momento de inercia respecto del eje de giro es
          $I_{Oz} = \tfrac{1}{2}MR^{2} + M(0{,}1R)^{2}$. ¿Cuánto vale el par
          $P$?
        respuesta:
          tipo: magnitud
          valor: '0.0408 N·m'
          formato: un par, con su unidad
        distractores:
          - valor: '0.204 N·m'
            mensaje: |
              Has multiplicado por $\omega = 10$ en vez de por $\alpha = 2$. La
              ecuación según el eje es $P = I_{Oz}\,\alpha$: la velocidad
              angular no aparece.
          - valor: '0.0208 N·m'
            mensaje: |
              $MR^{2}/4$ es el momento de inercia respecto de un **diámetro**
              del disco. El del eje perpendicular al disco es $MR^{2}/2$.
        pista: |
          $P = I_{Oz}\,\alpha$, con $I_{Oz} = 0{,}51\,MR^{2}$ y $R$ en metros.
        desarrollo: |
          $$
          I_{Oz} = \frac{1}{2}MR^{2} + M\left(0{,}1R\right)^{2} = 0{,}51\,MR^{2} = 0{,}51 \cdot 4 \cdot 0{,}01 = 0{,}0204\ \text{kg}\,\text{m}^{2}
          $$

          $$
          P = 0{,}0204 \cdot 2 = 0{,}0408\ \text{N}\cdot\text{m}
          $$

          La colección redondea a 0,041 N·m. El término de Steiner solo añade un
          2 %, pero es el que hace que el momento de inercia sea el del eje real
          y no el del centro del disco.

      - tipo: calcular
        titulo: La reacción vertical en A
        pregunta: |
          Con $g = 9{,}8$ m/s², ¿cuánto vale $A_y$?
        respuesta:
          tipo: magnitud
          valor: '11.73 N'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '23.47 N'
            mensaje: |
              Ese es $B_y$. Los momentos dan $2R\,A_y = R\,B_y$, así que el
              apoyo que está al doble de distancia se lleva la mitad de fuerza,
              no el doble.
          - valor: '17.6 N'
            mensaje: |
              Has repartido la suma a partes iguales. Los dos apoyos no están a
              la misma distancia del disco: $A$ está a $2R$ y $B$ a $R$.
          - valor: '19.6 N'
            mensaje: |
              Eso es medio peso: has resuelto el problema estático. Falta restar
              la fuerza que pide la aceleración normal de $G$,
              $M\omega^{2}(0{,}1R) = 4$ N.
        pista: |
          $A_y + B_y - Mg = M\,a_{Gy} = -M\omega^{2}(0{,}1R)$, y de los momentos
          en el plano del disco, $2R\,A_y - R\,B_y = 0$.
        desarrollo: |
          $$
          A_y + B_y = Mg - M\omega^{2}\left(0{,}1R\right) = 39{,}2 - 4 = 35{,}2\ \text{N}
          $$

          El peso, aplicado en $G$, no da momento respecto de $O$ porque $G$
          está justo encima de $O$, así que la ecuación de momentos queda
          $2R\,A_y = R\,B_y$, o sea $B_y = 2A_y$:

          $$
          A_y = \frac{35{,}2}{3} = 11{,}73\ \text{N}
          \qquad
          B_y = 23{,}47\ \text{N}
          $$

      - tipo: calcular
        titulo: La reacción horizontal en A
        pregunta: |
          ¿Cuánto vale $A_x$, con su signo?
        respuesta:
          tipo: magnitud
          valor: '-0.0267 N'
          formato: una fuerza, con su signo y su unidad
        distractores:
          - valor: '-0.0533 N'
            mensaje: |
              Ese es $B_x$. El reparto es el mismo que en la componente
              vertical: $B_x = 2A_x$, porque $A$ está al doble de distancia del
              disco.
          - valor: '-0.04 N'
            mensaje: |
              Has repartido la resultante a partes iguales entre los dos
              apoyos, y no están a la misma distancia: la ecuación de momentos
              da $B_x = 2A_x$.
          - valor: '-1.333 N'
            mensaje: |
              Has usado $\omega^{2}$ donde va $\alpha$. La componente $x$ de la
              aceleración de $G$ es la tangencial, $-\alpha\,y_G$, y vale
              0,02 m/s²; la normal, con $\omega^{2}$, es la que va según $y$.
        pista: |
          $A_x + B_x = M\,a_{Gx} = -M\,\alpha\,(0{,}1R)$, y otra vez
          $B_x = 2A_x$.
        desarrollo: |
          $$
          A_x + B_x = -M\,\alpha\left(0{,}1R\right) = -4 \cdot 2 \cdot 0{,}01 = -0{,}08\ \text{N}
          $$

          $$
          A_x = -0{,}0267\ \text{N}
          \qquad
          B_x = -0{,}0533\ \text{N}
          $$

          Y según el eje, $A_z = 0$: nada empuja axialmente.

      - tipo: calcular
        titulo: Dónde va la masa del plano z = −R
        pregunta: |
          Las dos masas valen $m = 0{,}1M$ y van en $z_1 = -R$ y
          $z_2 = 0{,}5R$. ¿Cuál es la coordenada $y_1$ de la primera, en
          milímetros y con su signo?
        respuesta:
          tipo: magnitud
          valor: '-33.3 mm'
          formato: una longitud, con su signo y su unidad
        distractores:
          - valor: '-50 mm'
            mensaje: |
              Has repartido el descentrado a partes iguales entre las dos masas,
              y eso solo cumple la condición estática. La segunda condición,
              $\sum m_i y_i z_i = 0$, obliga a $y_2 = 2y_1$.
          - valor: '-66.7 mm'
            mensaje: |
              Esa es $y_2$, la del plano $z = 0{,}5R$. Están cruzadas: la que va
              en el plano más lejano, $z = -R$, es la más pequeña.
          - valor: '33.3 mm'
            mensaje: |
              El módulo está bien y el signo no. $G$ está en $y = +0{,}1R$, así
              que las masas correctoras van al otro lado del eje.
        pista: |
          Dos condiciones: $M(0{,}1R) + m y_1 + m y_2 = 0$ y
          $m y_1 z_1 + m y_2 z_2 = 0$, porque el producto de inercia del disco
          es nulo.
        desarrollo: |
          $$
          4\left(0{,}1R\right) + 0{,}4\,y_1 + 0{,}4\,y_2 = 0 \;\Longrightarrow\; y_1 + y_2 = -R
          $$

          $$
          0{,}4\,y_1\left(-R\right) + 0{,}4\,y_2\left(0{,}5R\right) = 0 \;\Longrightarrow\; y_2 = 2y_1
          $$

          $$
          y_1 = -\frac{R}{3} = -33{,}3\ \text{mm}
          \qquad
          y_2 = -\frac{2R}{3} = -66{,}7\ \text{mm}
          $$

          Y las dos con $x = 0$, porque $x_G = 0$ e $I_{xz} = 0$. Las
          posiciones son entonces $M_1(0,\ -R/3,\ -R)$ y
          $M_2(0,\ -2R/3,\ R/2)$: las dos por debajo del eje, en el lado
          opuesto a $G$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Toda la masa está en el plano del disco, así que $I_{xz} = I_{yz} = 0$ y $\dot{\vec{H}}_O = I_{Oz}\,\alpha\,\hat{k}$.'
          - texto: 'De la ecuación según el eje, $P = 0{,}51\,MR^{2}\alpha = 0{,}0408$ N·m; de las de fuerzas, las resultantes $-0{,}08$ N y $35{,}2$ N.'
          - texto: 'Los momentos dan $B_x = 2A_x$ y $B_y = 2A_y$, y de ahí las cuatro reacciones perpendiculares al eje.'
          - texto: Como el desequilibrio es solo estático, con una sola masa correctora en el plano z igual a menos R se arregla el conjunto.
            trampa: true
            mensaje: |
              Una sola masa en $z = -R$ llevaría $G$ al eje, sí, pero crearía un
              producto de inercia $m\,y\,z$ que antes era nulo: el rotor
              quedaría equilibrado estáticamente y desequilibrado
              dinámicamente. Hacen falta dos planos.
    resolucion: |
      **La geometría de masas.** El disco está entero en el plano $z = 0$, así
      que $I_{xz} = I_{yz} = 0$ y el eje es dirección principal. El único
      defecto es que $G$ está a $0{,}1R = 10$ mm del eje, en $y$. Respecto del
      eje real de giro,

      $$
      I_{Oz} = \frac{1}{2}MR^{2} + M\left(0{,}1R\right)^{2} = 0{,}51\,MR^{2} = 0{,}0204\ \text{kg}\,\text{m}^{2}
      $$

      **La cinemática de G.**

      $$
      a_{Gx} = -\alpha\left(0{,}1R\right) = -0{,}02\ \text{m/s}^{2}
      \qquad
      a_{Gy} = -\omega^{2}\left(0{,}1R\right) = -1\ \text{m/s}^{2}
      $$

      **Las ecuaciones.** Con $A$ a $2R$ a un lado del disco y $B$ a $R$ al
      otro, y $\dot{\vec{H}}_O = I_{Oz}\,\alpha\,\hat{k}$:

      $$
      A_x + B_x = -0{,}08\ \text{N}
      \qquad
      A_y + B_y = Mg - 4 = 35{,}2\ \text{N}
      \qquad
      A_z = 0
      $$

      $$
      2R\,A_y - R\,B_y = 0
      \qquad
      -2R\,A_x + R\,B_x = 0
      \qquad
      P = I_{Oz}\,\alpha
      $$

      **El resultado.**

      $$
      A_x = -0{,}027\ \text{N}
      \qquad
      B_x = -0{,}053\ \text{N}
      \qquad
      A_y = 11{,}73\ \text{N}
      \qquad
      B_y = 23{,}47\ \text{N}
      \qquad
      P = 0{,}041\ \text{N}\cdot\text{m}
      $$

      **El equilibrado.** Con $m = 0{,}1M$ en cada plano, las cuatro
      condiciones dan $x_1 = x_2 = 0$, $y_1 = -R/3$ e $y_2 = -2R/3$:

      $$
      M_1\left(0,\ -\frac{R}{3},\ -R\right)
      \qquad
      M_2\left(0,\ -\frac{2R}{3},\ \frac{R}{2}\right)
      $$

      o sea $(0;\ -33{,}3;\ -100)$ mm y $(0;\ -66{,}7;\ 50)$ mm. En el conjunto
      equilibrado las dos masas quedan por debajo del eje, en el lado opuesto a
      $G$, y la más alejada del disco es la más pequeña.

      **Comprobación.** Los mismos números salen discretizando el disco en
      masas puntuales y resolviendo el sistema de seis ecuaciones, con
      $g = 9{,}8$ m/s².
  - id: ejma11-col116-la-placa-cuadrada-en-voladizo
    titulo: La placa cuadrada en voladizo sobre un eje horizontal
    fuente: >-
      Ejercicio 11.6 · Tema 11, «Dinámica del sólido rígido con eje fijo» ·
      Mecánica Aplicada, UPV/EHU, curso 2025-2026. El desarrollo está
      contrastado contra el resultado publicado y contra la resolución oficial
      del profesor. En el apartado b los dos no coinciden y aquí se publica lo
      que dan las cuentas, que es lo mismo que la resolución oficial: las masas
      van en y igual a 675 mm y menos 975 mm, no en menos 450 mm y 150 mm como
      imprime la colección, que en esa línea se deja el producto de inercia de
      la placa. En el apartado a el valor exacto con g igual a 9,8 metros por
      segundo al cuadrado es 22,69 N y la colección imprime 22,67 N.
    nivel: practica
    enunciado: |
      La figura muestra una placa cuadrada de 2 kg de masa soldada sobre un eje
      horizontal. Si el eje gira con velocidad angular positiva constante
      $\omega$ = 5 rad/s:

      a) Calcular las reacciones estáticas y dinámicas en los apoyos A y B para
      la posición mostrada.

      b) Calcular las posiciones de dos masas $M$ = 1kg colocadas sobre los
      planos verticales $Z$ = 100 mm y $Z$ = 300 mm para conseguir el
      equilibrado del sistema.

      <figure>
      <svg viewBox="-12 0 412 250" role="img" width="412" height="250" aria-labelledby="ejma11-col116-t ejma11-col116-d">
        <title id="ejma11-col116-t">Placa cuadrada soldada en voladizo sobre un eje horizontal con dos apoyos</title>
        <desc id="ejma11-col116-d">Eje horizontal según Z, que apunta a la izquierda. El apoyo B está en el origen y el A a 400 mm a su izquierda. La placa cuadrada, de 300 por 300 mm, está más a la izquierda todavía: su borde derecho queda a 600 mm de B y el izquierdo a 900 mm, y sube 300 mm por encima del eje. El eje Y es vertical y el X sale hacia el observador. El par P y la velocidad angular omega van según Z.</desc>
        <defs>
          <marker id="ejma11-col116-fi" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
          <marker id="ejma11-col116-fl" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--live)"/>
          </marker>
          <marker id="ejma11-col116-ff" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--faint)"/>
          </marker>
        </defs>

        <rect x="60" y="70" width="90" height="90" fill="var(--faint)" fill-opacity="0.35" stroke="var(--ink)" stroke-width="1.3"/>
        <line x1="60" y1="160" x2="330" y2="160" stroke="var(--ink)" stroke-width="2.6"/>
        <line x1="60" y1="160" x2="34" y2="160" stroke="var(--ink)" stroke-width="1.2" marker-end="url(#ejma11-col116-fi)"/>
        <text x="34" y="178" font-size="11" fill="var(--ink)">Z</text>

        <rect x="204" y="150" width="14" height="10" fill="var(--faint)" fill-opacity="0.5" stroke="var(--ink)" stroke-width="1"/>
        <path d="M204 150 L198 142 M210 150 L204 142 M216 150 L210 142" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <rect x="322" y="150" width="16" height="10" fill="var(--faint)" fill-opacity="0.5" stroke="var(--ink)" stroke-width="1"/>
        <path d="M322 150 L316 142 M328 150 L322 142 M334 150 L328 142" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <text x="206" y="178" font-size="11" fill="var(--ink)">A</text>
        <text x="324" y="178" font-size="11" fill="var(--ink)">B</text>

        <line x1="330" y1="150" x2="330" y2="56" stroke="var(--ink)" stroke-width="1.2" marker-end="url(#ejma11-col116-fi)"/>
        <text x="336" y="54" font-size="11" fill="var(--ink)">Y</text>
        <line x1="330" y1="160" x2="362" y2="192" stroke="var(--ink)" stroke-width="1.2" marker-end="url(#ejma11-col116-fi)"/>
        <text x="366" y="200" font-size="11" fill="var(--ink)">X</text>

        <line x1="60" y1="46" x2="150" y2="46" stroke="var(--faint)" stroke-width="0.8" marker-end="url(#ejma11-col116-ff)"/>
        <line x1="150" y1="46" x2="330" y2="46" stroke="var(--faint)" stroke-width="0.8" marker-end="url(#ejma11-col116-ff)"/>
        <line x1="60" y1="40" x2="60" y2="66" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="150" y1="40" x2="150" y2="66" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="330" y1="40" x2="330" y2="52" stroke="var(--faint)" stroke-width="0.7"/>
        <text x="105" y="36" font-size="10" text-anchor="middle" fill="var(--faint)">300 mm</text>
        <text x="240" y="36" font-size="10" text-anchor="middle" fill="var(--faint)">600 mm</text>

        <line x1="46" y1="70" x2="46" y2="160" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="40" y1="70" x2="52" y2="70" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="40" y1="160" x2="52" y2="160" stroke="var(--faint)" stroke-width="0.7"/>
        <text x="38" y="118" font-size="10" text-anchor="end" fill="var(--faint)">300 mm</text>

        <line x1="211" y1="212" x2="330" y2="212" stroke="var(--faint)" stroke-width="0.8" marker-end="url(#ejma11-col116-ff)"/>
        <line x1="211" y1="196" x2="211" y2="218" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="330" y1="196" x2="330" y2="218" stroke="var(--faint)" stroke-width="0.7"/>
        <text x="270" y="230" font-size="10" text-anchor="middle" fill="var(--faint)">400 mm</text>

        <path d="M254 136 A 22 22 0 0 1 282 128" fill="none" stroke="var(--live)" stroke-width="1.6" marker-end="url(#ejma11-col116-fl)"/>
        <text x="288" y="130" font-size="11" fill="var(--live)">P, ω</text>
      </svg>
      <figcaption>

      La placa está **en voladizo**: los dos apoyos, **A** y **B**, quedan a un
      lado y toda la placa al otro. Su borde más cercano está a **600 mm** de
      **B** y el más lejano a **900 mm**, y sube **300 mm** por encima del eje.
      Entre los dos apoyos hay **400 mm**.

      </figcaption>
      </figure>
    pide: Las reacciones estáticas y dinámicas en A y B, y la posición de las dos masas de equilibrado.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado pide las reacciones «estáticas y dinámicas». ¿Cómo se
          combinan aquí las dos partes?
        opciones:
          - texto: La parte dinámica resta, porque la aceleración de G apunta hacia el eje, o sea hacia abajo
            correcta: true
            mensaje: |
              Eso es. $G$ está por encima del eje, así que su aceleración
              normal, $\omega^{2}y_G$, va hacia abajo: los apoyos tienen que
              sostener **menos** de lo que pesa la placa.
          - texto: Se suman siempre, porque las dos cargas van en el mismo sentido
            mensaje: |
              Depende de dónde esté $G$. Aquí está arriba y la aceleración
              apunta hacia abajo, así que los dos efectos se restan; media
              vuelta después, con $G$ abajo, se sumarían. Por eso la carga de
              un rotor desequilibrado vibra.
          - texto: No hay parte dinámica, porque la velocidad angular es constante
            mensaje: |
              Constante en módulo, pero $G$ no está en el eje: describe una
              circunferencia de 150 mm y necesita aceleración centrípeta. Con
              5 rad/s eso ya son 7,5 N.
          - texto: La dinámica solo afecta al apoyo más cercano a la placa
            mensaje: |
              Las dos partes se reparten entre los dos apoyos con las mismas
              ecuaciones, y en la misma proporción: la geometría no distingue de
              dónde viene la carga.

      - tipo: calcular
        titulo: Dónde está el centro de gravedad
        pregunta: |
          Midiendo desde $B$ a lo largo del eje, ¿a qué distancia está el centro
          de gravedad de la placa?
        respuesta:
          tipo: magnitud
          valor: '750 mm'
          formato: una longitud, con su unidad
        distractores:
          - valor: '600 mm'
            mensaje: |
              Eso es el borde de la placa más cercano a $B$, no su centro. La
              placa mide 300 mm de ancho, así que su centro está 150 mm más
              allá.
          - valor: '900 mm'
            mensaje: |
              Ese es el borde más lejano. El centro de gravedad de un cuadrado
              homogéneo está en su centro geométrico.
          - valor: '450 mm'
            mensaje: |
              Parece que has restado en vez de sumar, o has medido desde el
              borde equivocado. Desde $B$ hay 600 mm hasta el borde y 150 mm más
              hasta el centro.
        pista: |
          El centro del cuadrado está a media anchura de su borde: $600 + 150$.
        desarrollo: |
          $$
          z_G = 600 + \frac{300}{2} = 750\ \text{mm}
          \qquad
          y_G = \frac{300}{2} = 150\ \text{mm}
          $$

          Y de paso, $A$ está a 400 mm de $B$, así que $G$ queda 350 mm más allá
          de $A$: la placa está enteramente en voladizo.

      - tipo: calcular
        titulo: La reacción en A
        pregunta: |
          Con $M = 2$ kg, $\omega = 5$ rad/s y $g = 9{,}8$ m/s², ¿cuánto vale
          $A_y$?
        respuesta:
          tipo: magnitud
          valor: '22.69 N'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '36.75 N'
            mensaje: |
              Esa es solo la parte estática, $\tfrac{15}{8}Mg$. Falta restar la
              dinámica, $\tfrac{45}{16}M\omega^{2}a = 14{,}06$ N.
          - valor: '50.81 N'
            mensaje: |
              Has sumado la parte dinámica en vez de restarla. La aceleración de
              $G$ apunta hacia el eje, o sea hacia abajo, así que descarga los
              apoyos en esta posición.
          - valor: '-10.59 N'
            mensaje: |
              Ese es $B_y$. El apoyo que está más lejos de la placa es el que
              tira hacia abajo; el más cercano, $A$, es el que empuja hacia
              arriba.
        pista: |
          $A_y + B_y - Mg = -M\omega^{2}y_G$, y los momentos en $G$ dan
          $7A_y + 15B_y = 0$ con las distancias en unidades de $a = 100$ mm.
        desarrollo: |
          $$
          A_y + B_y = Mg - M\omega^{2}y_G = 19{,}6 - 7{,}5 = 12{,}1\ \text{N}
          $$

          Tomando momentos en $G$, con $GA = 3{,}5a$ y $GB = 7{,}5a$ y
          $\dot{\vec{H}}_G = 0$:

          $$
          \frac{7}{2}a\,A_y + \frac{15}{2}a\,B_y = 0 \;\Longrightarrow\; B_y = -\frac{7}{15}A_y
          $$

          $$
          A_y = \frac{15}{8}Mg - \frac{45}{16}M\omega^{2}a = 36{,}75 - 14{,}06 = 22{,}69\ \text{N}
          $$

          La colección imprime 22,67 N; con $g = 9{,}8$ el valor exacto es
          22,6875 N.

      - tipo: calcular
        titulo: La reacción en B
        pregunta: |
          ¿Cuánto vale $B_y$, con su signo?
        respuesta:
          tipo: magnitud
          valor: '-10.59 N'
          formato: una fuerza, con su signo y su unidad
        distractores:
          - valor: '10.59 N'
            mensaje: |
              El módulo está bien y el signo no. Con la placa en voladizo, $B$
              es el apoyo que **tira hacia abajo** para que el conjunto no
              vuelque sobre $A$.
          - valor: '-17.15 N'
            mensaje: |
              Esa es solo la parte estática, $-\tfrac{7}{8}Mg$. La dinámica
              suma $+\tfrac{21}{16}M\omega^{2}a = 6{,}56$ N y deja $-10{,}59$ N.
        pista: |
          Ya tienes $A_y + B_y = 12{,}1$ N y $A_y = 22{,}69$ N.
        desarrollo: |
          $$
          B_y = 12{,}1 - 22{,}69 = -10{,}59\ \text{N}
          $$

          o, en forma cerrada,
          $B_y = -\tfrac{7}{8}Mg + \tfrac{21}{16}M\omega^{2}a$. Y las otras:
          $A_x = B_x = 0$ y $P = 0$, porque no hay ningún producto de inercia
          —la placa es simétrica respecto de sus dos ejes— ni aceleración
          angular.

      - tipo: calcular
        titulo: Dónde va la masa del plano Z = 100 mm
        pregunta: |
          Se colocan dos masas de 1 kg en los planos $Z = 100$ mm y
          $Z = 300$ mm. ¿Cuál es la coordenada $y_1$ de la del plano
          $Z = 100$ mm, en milímetros y con su signo?
        respuesta:
          tipo: magnitud
          valor: '675 mm'
          formato: una longitud, con su signo y su unidad
        distractores:
          - valor: '-450 mm'
            mensaje: |
              Ese es el valor que sale si se pide solo
              $m_1y_1z_1 + m_2y_2z_2 = 0$, olvidando que la placa aporta su
              propio producto de inercia, $I_{yz} = M y_G z_G = 225$ kg·mm². Es
              el valor que imprime la colección, y no equilibra: con él el
              producto de inercia del conjunto sigue valiendo 225 kg·mm².
          - valor: '-975 mm'
            mensaje: |
              Ese es $y_2$, la del plano $Z = 300$ mm, y además con el signo
              cambiado de sitio. Las dos masas van a lados opuestos del eje.
          - valor: '150 mm'
            mensaje: |
              Ese es el otro valor que imprime la colección para la segunda
              masa, y viene del mismo descuido: no contar el producto de inercia
              de la placa.
        pista: |
          Dos condiciones: $M y_G + m_1 y_1 + m_2 y_2 = 0$ y
          $M y_G z_G + m_1 y_1 z_1 + m_2 y_2 z_2 = 0$, con las $z$ medidas desde
          $B$.
        desarrollo: |
          $$
          2 \cdot 150 + y_1 + y_2 = 0 \;\Longrightarrow\; y_1 + y_2 = -300\ \text{mm}
          $$

          $$
          2 \cdot 150 \cdot 750 + y_1 \cdot 100 + y_2 \cdot 300 = 0 \;\Longrightarrow\; y_1 + 3y_2 = -2250\ \text{mm}
          $$

          Restando, $y_2 = -975$ mm e $y_1 = 675$ mm:

          $$
          M_1\left(0,\ 675,\ 100\right)\ \text{mm}
          \qquad
          M_2\left(0,\ -975,\ 300\right)\ \text{mm}
          $$

          Comprobación: $675 \cdot 100 - 975 \cdot 300 = -225\,000$ kg·mm²,
          que cancela exactamente el producto de inercia de la placa.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Con $\omega$ constante y la placa simétrica, $\dot{\vec{H}}_G = 0$, así que $P = 0$ y las dos ecuaciones de momentos solo llevan reacciones.'
          - texto: 'La resultante vale $Mg - M\omega^{2}y_G = 12{,}1$ N y los momentos en $G$ dan $7A_y + 15B_y = 0$, de donde $A_y = 22{,}69$ N y $B_y = -10{,}59$ N.'
          - texto: 'Para equilibrar hay que anular a la vez $\sum m_i y_i$ y el producto de inercia del conjunto, que incluye el de la placa, $M y_G z_G$.'
          - texto: Como las dos masas de equilibrado están en planos distintos, basta con que entre ellas dos se anule la suma de sus productos y sí y zeta.
            trampa: true
            mensaje: |
              Lo que hay que anular es el producto de inercia del **conjunto**,
              y la placa aporta el suyo: $M y_G z_G = 225$ kg·mm². Si se olvida,
              salen $-450$ mm y $150$ mm —que es lo que imprime la colección— y
              el rotor sigue desequilibrado dinámicamente.
    resolucion: |
      **La geometría.** Midiendo desde $B$ a lo largo del eje, la placa va de
      600 a 900 mm, así que $z_G = 750$ mm, e $y_G = 150$ mm. El apoyo $A$ está
      a 400 mm de $B$. Con $a = 100$ mm: $GA = 3{,}5a$ y $GB = 7{,}5a$, los dos
      al mismo lado, porque la placa está en voladizo.

      **La dinámica.** La placa es simétrica respecto de sus dos ejes centrales,
      así que en ejes de $G$ los productos de inercia son nulos y
      $\vec{H}_G = I_{Gz}\,\omega\,\hat{k}$ es constante:
      $\dot{\vec{H}}_G = 0$. Y con $\omega$ constante,

      $$
      \vec{a}_G = -\omega^{2}y_G\,\hat{\jmath} = -3{,}75\,\hat{\jmath}\ \text{m/s}^{2}
      $$

      **Las ecuaciones.**

      $$
      A_x + B_x = 0
      \qquad
      A_y + B_y - Mg = -M\omega^{2}y_G
      \qquad
      \frac{7}{2}a\,A_y + \frac{15}{2}a\,B_y = 0
      \qquad
      P = 0
      $$

      **El resultado.**

      $$
      A_y = \frac{15}{8}Mg - \frac{45}{16}M\omega^{2}a = 22{,}69\ \text{N}
      \qquad
      B_y = -\frac{7}{8}Mg + \frac{21}{16}M\omega^{2}a = -10{,}59\ \text{N}
      $$

      con $A_x = B_x = 0$. El signo de $B_y$ no es un error: la placa está
      fuera de los dos apoyos, así que $B$ tiene que tirar hacia abajo. Y la
      parte dinámica descarga los dos apoyos en esta posición, porque $G$ está
      arriba; media vuelta después los cargaría.

      **El equilibrado.** Dos condiciones con las dos masas de 1 kg, y en la
      segunda entra el producto de inercia de la placa,
      $I_{yz} = M y_G z_G = 225$ kg·mm²:

      $$
      y_1 + y_2 = -300\ \text{mm}
      \qquad
      100\,y_1 + 300\,y_2 = -225\,000\ \text{kg}\,\text{mm}^{2}
      $$

      $$
      M_1\left(0,\ 675,\ 100\right)\ \text{mm}
      \qquad
      M_2\left(0,\ -975,\ 300\right)\ \text{mm}
      $$

      **Comprobación y discrepancia.** Los números salen también discretizando
      la placa en masas puntuales y resolviendo el sistema de seis ecuaciones.
      La colección publica para este apartado $(0,\ -450,\ 100)$ y
      $(0,\ 150,\ 300)$, que cumplen la condición estática pero dejan el
      producto de inercia del conjunto en 225 kg·mm², o sea sin equilibrar: son
      las posiciones que salen si se olvida el término de la placa. La
      resolución oficial del profesor da 675 mm y $-975$ mm, igual que aquí.
