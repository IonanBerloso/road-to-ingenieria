    pide: Las coordenadas del centro de gravedad de la sección en C.
    pasos:
      - tipo: reconocer
        pregunta: |
          La C no tiene fórmula propia. ¿Cómo se saca su centro de gravedad?
        opciones:
          - texto: >-
              Partiéndola en tres rectángulos que no se solapen y haciendo la
              media de sus centros pesada por sus áreas
            correcta: true
            mensaje: |
              Eso es. El ala inferior de 30 × 2, el alma entre las dos alas,
              de 2 × 16, y el ala superior de 10 × 2. El centro de cada
              rectángulo es su punto medio, y el área dice cuánto pesa.
          - texto: Haciendo la media de los tres centros, sin pesar
            mensaje: |
              Solo valdría con tres piezas de la misma área, y aquí van de 20
              a 60 cm². El ala inferior, la más grande, tira de $G$ hacia
              abajo y a la derecha.
          - texto: Tomando el centro del rectángulo de 30 por 20 que envuelve la C
            mensaje: |
              Ese rectángulo está casi vacío: la C es solo su borde por tres
              lados. Su centro, $(15, 10)$, no tiene nada que ver con el de la
              chapa.

      - tipo: calcular
        titulo: La coordenada x
        pregunta: |
          ¿Cuánto vale $x_G$?
        respuesta:
          tipo: magnitud
          valor: '9.214 cm'
          tolerancia: 0.005
          formato: una longitud, con su unidad
        distractores:
          - valor: '7 cm'
            mensaje: |
              Es la media de $15$, $1$ y $5$ sin pesar. El ala inferior tiene
              60 cm², tres veces el ala superior, y cuenta tres veces más.
          - valor: '8.667 cm'
            mensaje: |
              Has contado dos veces las esquinas: un alma de 2 × 20 que llega
              hasta el suelo y el techo **y** las dos alas enteras. Las piezas
              no pueden solaparse; el alma va solo entre las alas, de 2 × 16.
        pista: |
          Todos los espesores son de 2 cm, como el del ala superior acotada: la
          figura los dibuja iguales, y el resultado de la colección lo
          confirma. Las piezas: $A_1 = 60$ con centro en $(15, 1)$,
          $A_2 = 32$ con centro en $(1, 10)$ y $A_3 = 20$ con centro en
          $(5, 19)$.
        desarrollo: |
          $$
          x_G = \frac{60 \cdot 15 + 32 \cdot 1 + 20 \cdot 5}{60 + 32 + 20}
          = \frac{1032}{112} = 9{,}214\ \text{cm}
          $$

      - tipo: calcular
        titulo: La coordenada y
        pregunta: |
          ¿Cuánto vale $y_G$?
        respuesta:
          tipo: magnitud
          valor: '6.786 cm'
          tolerancia: 0.005
          formato: una longitud, con su unidad
        distractores:
          - valor: '10 cm'
            mensaje: |
              Es la media de $1$, $10$ y $19$ sin pesar por las áreas. El ala
              inferior pesa casi tanto como las otras dos juntas y baja $G$.
          - valor: '7 cm'
            mensaje: |
              Arrastras el alma de 2 × 20 que se solapa con las alas: el área
              total te sale 120 en lugar de 112. Las esquinas de 2 × 2 solo
              pueden contarse una vez.
        pista: |
          Los centros de las tres piezas están en $y = 1$, $y = 10$ e
          $y = 19$.
        desarrollo: |
          $$
          y_G = \frac{60 \cdot 1 + 32 \cdot 10 + 20 \cdot 19}{112}
          = \frac{760}{112} = 6{,}786\ \text{cm}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Tres rectángulos sin solape: $60\ \text{cm}^{2}$ en $(15, 1)$, $32\ \text{cm}^{2}$ en $(1, 10)$ y $20\ \text{cm}^{2}$ en $(5, 19)$.'
          - texto: $x_G = 1032/112 = 9{,}21$ cm.
          - texto: $y_G = 760/112 = 6{,}79$ cm.
          - texto: El centro de gravedad cae sobre la chapa, como el de cualquier superficie.
            trampa: true
            mensaje: |
              No tiene por qué. El punto $(9{,}21;\ 6{,}79)$ está en el hueco de
              la C: por encima del ala inferior, a la derecha del alma y por
              debajo del ala superior. Es el caso de un anillo, cuyo centro de
              gravedad está en el agujero.
    resolucion: |
      **Las piezas.** Todos los espesores son de 2 cm: la figura acota el del
      ala superior y dibuja los otros dos iguales, y el resultado de la
      colección solo sale así. Tres rectángulos que no se solapan:

      - ala inferior, $30 \times 2$: $A_1 = 60$, centro en $(15, 1)$;
      - alma entre las alas, $2 \times 16$: $A_2 = 32$, centro en $(1, 10)$;
      - ala superior, $10 \times 2$: $A_3 = 20$, centro en $(5, 19)$.

      **La media pesada.** Con $A = 112\ \text{cm}^{2}$:

      $$
      x_G = \frac{900 + 32 + 100}{112} = 9{,}21\ \text{cm}
      \qquad
      y_G = \frac{60 + 320 + 380}{112} = 6{,}79\ \text{cm}
      $$

      La colección da $9{,}21$ y $6{,}78$ cm; el segundo es el mismo
      $760/112 = 6{,}7857$ cortado en lugar de redondeado. Y el punto cae en
      el hueco de la C, que es lo normal en una sección abierta.
  - id: ejma2-col26-el-area-bajo-una-cubica
    titulo: El área bajo una cúbica, y el volumen que genera
    fuente: >-
      Ejercicio 2.6 · Tema 2, «Geometría de masas y superficies» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      En la superficie de la figura, siendo $n = 3$, calcular:

      a. Posición del centro de gravedad respecto de los ejes $x$ e $y$.

      b. Volumen del cuerpo que la superficie genera al girar respecto al eje
      $x$.

      <figure>
      <svg viewBox="0 0 270 210" role="img" width="270" height="210" aria-labelledby="ejma2-col26-t ejma2-col26-d">
        <title id="ejma2-col26-t">Superficie bajo la curva Y igual a K por x elevado a n</title>
        <desc id="ejma2-col26-d">La superficie limitada por el eje x, la recta vertical x igual a h y la curva Y igual a K por x elevado a n, que sale del origen y llega a una altura a en x igual a h. Unas franjas verticales finas indican cómo se integra.</desc>
        <defs>
          <marker id="ejma2-col26-f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M50 170 L57.5 169.985 L65 169.88 L72.5 169.595 L80 169.04 L87.5 168.125 L95 166.76 L102.5 164.855 L110 162.32 L117.5 159.065 L125 155 L132.5 150.035 L140 144.08 L147.5 137.045 L155 128.84 L162.5 119.375 L170 108.56 L177.5 96.305 L185 82.52 L192.5 67.115 L200 50 L200 170 Z" fill="var(--d1)" fill-opacity="0.16" stroke="none"/>
        <path d="M125 170 L125 155 M140 170 L140 144.08 M155 170 L155 128.84 M170 170 L170 108.56 M185 170 L185 82.52" fill="none" stroke="var(--faint)" stroke-width="0.6"/>
        <path d="M50 170 L57.5 169.985 L65 169.88 L72.5 169.595 L80 169.04 L87.5 168.125 L95 166.76 L102.5 164.855 L110 162.32 L117.5 159.065 L125 155 L132.5 150.035 L140 144.08 L147.5 137.045 L155 128.84 L162.5 119.375 L170 108.56 L177.5 96.305 L185 82.52 L192.5 67.115 L200 50" fill="none" stroke="var(--ink)" stroke-width="1.5"/>
        <line x1="200" y1="50" x2="200" y2="170" stroke="var(--ink)" stroke-width="0.8"/>
        <line x1="50" y1="170" x2="250" y2="170" stroke="var(--ink)" stroke-width="1.2" marker-end="url(#ejma2-col26-f)"/>
        <line x1="50" y1="170" x2="50" y2="22" stroke="var(--ink)" stroke-width="1.2" marker-end="url(#ejma2-col26-f)"/>
        <text x="252" y="184" font-size="11" fill="var(--ink)">x</text>
        <text x="36" y="28" font-size="11" fill="var(--ink)">y</text>
        <text x="66" y="104" font-size="10" fill="var(--ink)">Y = K·xⁿ</text>
        <line x1="203" y1="50" x2="220" y2="50" stroke="var(--faint)" stroke-width="0.7" stroke-dasharray="3 3"/>
        <line x1="216" y1="50" x2="216" y2="170" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="212" y1="50" x2="220" y2="50" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="212" y1="170" x2="220" y2="170" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="223" y="114" font-size="11" fill="var(--faint)">a</text>
        <line x1="50" y1="188" x2="200" y2="188" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="50" y1="184" x2="50" y2="192" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="200" y1="184" x2="200" y2="192" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="125" y="202" font-size="11" text-anchor="middle" fill="var(--faint)">h</text>
