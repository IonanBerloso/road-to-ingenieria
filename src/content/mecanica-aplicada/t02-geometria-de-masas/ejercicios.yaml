    pide: El centro de gravedad, los momentos de inercia respecto de x e y y respecto de x′ e y′ por G, y el producto de inercia respecto de x′y′.
    pasos:
      - tipo: reconocer
        pregunta: |
          La placa es un rectángulo menos un círculo. ¿Qué aporta el círculo a
          los momentos, y qué pasa con el producto de inercia?
        opciones:
          - texto: >-
              Resta su momento respecto de un diámetro, $\pi r^{4}/4$, más
              $A\,d^{2}$; y el producto por $G$ no es nulo, porque el agujero
              no está centrado
            correcta: true
            mensaje: |
              Eso es. Cada pieza tiene producto propio nulo —las dos tienen
              ejes de simetría paralelos a $x$ e $y$—, pero al llevarlas a $G$
              aparecen los términos $A\,d_x\,d_y$, y no se cancelan.
          - texto: Resta $\pi r^{4}/2$, su momento de inercia
            mensaje: |
              $\pi r^{4}/2$ es el momento polar, respecto del eje
              perpendicular a la placa por el centro. Respecto de un eje del
              plano, un diámetro, es la mitad: $\pi r^{4}/4$. Es el mismo
              salto que en el disco del 2.12.
          - texto: El producto $C_{x'y'}$ es nulo, porque el rectángulo y el círculo son simétricos
            mensaje: |
              Son simétricos respecto de **sus** centros, no respecto de $G$.
              El agujero está arriba a la izquierda de $G$, y esa asimetría es
              justo lo que mide el producto de inercia.

      - tipo: calcular
        titulo: La abscisa del centro de gravedad
        pregunta: |
          ¿Cuánto vale $x_G$?
        respuesta:
          tipo: magnitud
          valor: '18.047 cm'
          tolerancia: 0.002
          formato: una longitud, con su unidad
        distractores:
          - valor: '17.12 cm'
            mensaje: |
              Has sumado el agujero. Al quitar material a la izquierda de
              $x = 17{,}5$, $G$ se va a la derecha, no a la izquierda.
          - valor: '14.81 cm'
            mensaje: |
              Has restado el agujero en el numerador pero has dividido entre
              el área del rectángulo lleno, 1750. La placa tiene
              $1750 - 100\pi = 1435{,}8\ \text{cm}^{2}$.
        pista: |
          Rectángulo: $1750\ \text{cm}^{2}$ con centro en $(17{,}5;\ 25)$.
          Agujero: $100\pi\ \text{cm}^{2}$ con centro en $(15;\ 30)$.
        desarrollo: |
          $$
          x_G = \frac{1750 \cdot 17{,}5 - 100\pi \cdot 15}{1750 - 100\pi} = \frac{25912{,}6}{1435{,}84} = 18{,}05\ \text{cm}
          $$

      - tipo: calcular
        titulo: La ordenada del centro de gravedad
        pregunta: |
          ¿Cuánto vale $y_G$?
        respuesta:
          tipo: magnitud
          valor: '23.906 cm'
          tolerancia: 0.002
          formato: una longitud, con su unidad
        distractores:
          - valor: '25.76 cm'
            mensaje: |
              Has sumado el agujero. Está por encima del centro del
              rectángulo: quitarlo baja $G$ por debajo de 25 cm.
          - valor: '19.61 cm'
            mensaje: |
              Otra vez el denominador: el área de la placa es la del
              rectángulo **menos** el círculo.
        pista: |
          La misma media pesada con las ordenadas, 25 y 30 cm.
        desarrollo: |
          $$
          y_G = \frac{1750 \cdot 25 - 100\pi \cdot 30}{1435{,}84} = \frac{34325{,}2}{1435{,}84} = 23{,}91\ \text{cm}
          $$

      - tipo: calcular
        titulo: El momento respecto del eje x
        pregunta: |
          ¿Cuánto vale $I_x$?
        respuesta:
          tipo: numero
          valor: '1167736'
          tolerancia: 400
          formato: un número entero, en cm⁴ y sin puntos de millar
        distractores:
          - valor: '1166736'
            mensaje: |
              Es la cifra que imprime la colección, $1.166.736$, y lleva una
              errata de un dígito: los datos dan $1.167.736$, y el $I_{x'}$
              que imprime la propia colección, 347.157, sale del bueno. Si
              has llegado a un número parecido pero no igual, revisa $\pi$ y
              los redondeos: aquí no hay más aproximación que esa.
          - valor: '1748931'
            mensaje: |
              Has sumado el agujero. El rectángulo lleno da 1.458.333, y la
              placa agujereada tiene que dar menos.
          - valor: '1450479'
            mensaje: |
              Has restado solo el momento propio del círculo, $\pi r^{4}/4$.
              Su centro está a 30 cm del eje $x$: falta
              $100\pi \cdot 30^{2} = 282.743$.
        pista: |
          Rectángulo respecto de su base, $b\,h^{3}/3$. Círculo:
          $\pi r^{4}/4 + \pi r^{2}\cdot 30^{2}$.
        desarrollo: |
          $$
          I_x = \frac{35 \cdot 50^{3}}{3} - \left(\frac{\pi \cdot 10^{4}}{4} + 100\pi \cdot 30^{2}\right)
          = 1.458.333 - 290.597 = 1.167.736\ \text{cm}^{4}
          $$

      - tipo: calcular
        titulo: El momento respecto del eje y
        pregunta: |
          ¿Cuánto vale $I_y$?
        respuesta:
          tipo: numero
          valor: '636043.5'
          tolerancia: 400
          formato: un número entero, en cm⁴ y sin puntos de millar
        distractores:
          - valor: '603043'
            mensaje: |
              Es la cifra que imprime la colección, $603.043$, con dos dígitos
              cambiados: los datos dan $636.043$, y el $I_{y'}$ que imprime la
              propia colección, 168.399, sale del bueno.
          - valor: '793123'
            mensaje: |
              Has sumado el agujero: $714.583 + 78.540$. El agujero resta.
          - valor: '706729'
            mensaje: |
              Has restado solo $\pi r^{4}/4$. El centro del agujero está a
              15 cm del eje $y$: falta $100\pi \cdot 15^{2} = 70.686$.
        pista: |
          Ahora la base es 50 y el ancho 35: $50 \cdot 35^{3}/3$. El agujero,
          con la distancia 15.
        desarrollo: |
          $$
          I_y = \frac{50 \cdot 35^{3}}{3} - \left(\frac{\pi \cdot 10^{4}}{4} + 100\pi \cdot 15^{2}\right)
          = 714.583 - 78.540 = 636.043\ \text{cm}^{4}
          $$

      - tipo: calcular
        titulo: El momento respecto de x prima
        pregunta: |
          ¿Cuánto vale $I_{x'}$, respecto del eje paralelo a $x$ por $G$?
        respuesta:
          tipo: numero
          valor: '347157'
          tolerancia: 700
          formato: un número entero, en cm⁴ y sin puntos de millar
        distractores:
          - valor: '339303'
            mensaje: |
              Has restado el momento polar del círculo, $\pi r^{4}/2$, en vez
              del diametral, $\pi r^{4}/4$. El eje $x'$ está en el plano de la
              placa.
          - valor: '355011'
            mensaje: |
              Te has dejado el momento propio del círculo, $\pi r^{4}/4 = 7854$:
              Steiner es momento propio **más** $A\,d^{2}$.
          - valor: '167616'
            mensaje: |
              Has usado el área del rectángulo lleno en Steiner,
              $1750\,y_G^{2}$. La que se traslada es la de la placa,
              $1435{,}84\ \text{cm}^{2}$.
          - valor: '1988315'
            mensaje: |
              Has sumado $A\,y_G^{2}$ a $I_x$. Para bajar al eje por $G$ se
              resta: $I_x = I_{x'} + A\,y_G^{2}$.
        pista: |
          $I_{x'} = I_x - A\,y_G^{2}$. Mejor aún, pieza a pieza respecto de
          $G$: rectángulo $35 \cdot 50^{3}/12 + 1750\,(25 - y_G)^{2}$, menos
          círculo $\pi r^{4}/4 + 100\pi\,(30 - y_G)^{2}$.
        desarrollo: |
          $$
          I_{x'} = 1.167.736 - 1435{,}84 \cdot 23{,}906^{2} = 347.157\ \text{cm}^{4}
          $$

          Pieza a pieza: $366.678 - 19.521 = 347.157$. Esta vía aguanta mejor
          los redondeos de $G$, porque no resta dos números grandes.

      - tipo: calcular
        titulo: El momento respecto de y prima
        pregunta: |
          ¿Cuánto vale $I_{y'}$, respecto del eje paralelo a $y$ por $G$?
        respuesta:
          tipo: numero
          valor: '168399'
          tolerancia: 500
          formato: un número entero, en cm⁴ y sin puntos de millar
        distractores:
          - valor: '160545'
            mensaje: |
              Has restado el momento polar del círculo, $\pi r^{4}/2$. Respecto
              de un eje del plano es la mitad.
          - valor: '66079'
            mensaje: |
              Has usado el área del rectángulo lleno en Steiner,
              $1750\,x_G^{2}$. La de la placa es $1435{,}84\ \text{cm}^{2}$.
          - valor: '1103688'
            mensaje: |
              Has sumado $A\,x_G^{2}$. Hacia $G$ se resta.
        pista: |
          $I_{y'} = I_y - A\,x_G^{2}$, o pieza a pieza con las distancias
          $17{,}5 - x_G$ y $15 - x_G$.
        desarrollo: |
          $$
          I_{y'} = 636.043 - 1435{,}84 \cdot 18{,}047^{2} = 168.399\ \text{cm}^{4}
          $$

      - tipo: calcular
        titulo: El producto de inercia por G
        pregunta: |
          ¿Cuánto vale $C_{x'y'}$, con la convención del curso,
          $C_{x'y'} = \int x'\,y'\,dA$?
        respuesta:
          tipo: numero
          valor: '4786'
          tolerancia: 100
          formato: un número, en cm⁴, con su signo
        distractores:
          - valor: '-4786'
            mensaje: |
              El valor es bueno y el signo no. El agujero está arriba a la
              izquierda de $G$, donde $x'y' < 0$: quitar ese material quita
              producto negativo, y el total queda **positivo**.
          - valor: '-6881'
            mensaje: |
              Has sumado la aportación del agujero en lugar de restarla: los
              dos términos salen negativos y se acumulan.
          - valor: '0'
            mensaje: |
              El producto propio de cada pieza es nulo, pero sus centros no
              están sobre los ejes por $G$: quedan los términos de Steiner,
              $A\,d_x\,d_y$, que no se cancelan.
          - valor: '624253'
            mensaje: |
              Es $C_{xy}$, respecto de los ejes por $O$. Falta llevarlo a $G$:
              $C_{x'y'} = C_{xy} - A\,x_G\,y_G$.
        pista: |
          Pieza a pieza respecto de $G$: el rectángulo aporta
          $1750\,(17{,}5 - x_G)(25 - y_G)$ y el agujero resta
          $100\pi\,(15 - x_G)(30 - y_G)$. Por Steiner desde $O$ también sale,
          pero entonces necesitas $G$ con tres decimales: con dos, la resta
          de dos números de 600.000 da 4580.
        desarrollo: |
          $$
          C_{x'y'} = 1750\,(-0{,}547)(1{,}094) - 100\pi\,(-3{,}047)(6{,}094)
          = -1048 + 5834 = 4786\ \text{cm}^{4}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Placa = rectángulo de 1750 cm² menos círculo de $100\pi$ cm², y $G = (18{,}05;\ 23{,}91)$ cm.'
          - texto: $I_x = 1.458.333 - 290.597 = 1.167.736$ e $I_y = 714.583 - 78.540 = 636.043\ \text{cm}^{4}$.
          - texto: 'Bajando a $G$: $I_{x''} = 347.157$ e $I_{y''} = 168.399\ \text{cm}^{4}$.'
          - texto: $C_{x'y'} = -1048 + 5834 = 4786\ \text{cm}^{4}$, positivo porque se ha quitado material donde $x'y' < 0$.
          - texto: El círculo resta $\pi r^{4}/2$ de su momento propio, porque es el momento de inercia de un círculo.
            trampa: true
            mensaje: |
              $\pi r^{4}/2$ es el momento polar, respecto del eje perpendicular
              al plano. Respecto de $x$ o de $y$, que están en el plano, el
              círculo aporta el diametral, $\pi r^{4}/4$.
    resolucion: |
      **a) El centro de gravedad.** Rectángulo de $35 \times 50$ con centro en
      $(17{,}5;\ 25)$, menos círculo de radio 10 con centro en $(15;\ 30)$.
      Con $A = 1750 - 100\pi = 1435{,}84\ \text{cm}^{2}$:

      $$
      x_G = \frac{30625 - 1500\pi}{1435{,}84} = 18{,}05\ \text{cm}
      \qquad
      y_G = \frac{43750 - 3000\pi}{1435{,}84} = 23{,}91\ \text{cm}
      $$

      **b) Respecto de x e y.** El círculo resta su momento diametral más
      Steiner:

      $$
      I_x = \frac{35 \cdot 50^{3}}{3} - \left(\frac{\pi \cdot 10^{4}}{4} + 100\pi \cdot 30^{2}\right) = 1.167.736\ \text{cm}^{4}
      $$

      $$
      I_y = \frac{50 \cdot 35^{3}}{3} - \left(\frac{\pi \cdot 10^{4}}{4} + 100\pi \cdot 15^{2}\right) = 636.043\ \text{cm}^{4}
      $$

      **c) Respecto de x′ e y′.** $I_{x'} = I_x - A\,y_G^{2} = 347.157$ e
      $I_{y'} = I_y - A\,x_G^{2} = 168.399\ \text{cm}^{4}$.

      **d) El producto de inercia.** Pieza a pieza respecto de $G$:

      $$
      C_{x'y'} = 1750\,(-0{,}547)(1{,}094) - 100\pi\,(-3{,}047)(6{,}094) = 4786\ \text{cm}^{4}
      $$

      **Sobre el resultado de la colección.** Imprime
      $I_x = 1.166.736$ e $I_y = 603.043\ \text{cm}^{4}$. Las dos son erratas
      de transcripción: los datos dan $1.167.736$ y $636.043$, y los
      $I_{x'} = 347.157$ e $I_{y'} = 168.399$ que imprime la propia colección
      solo salen de estos, no de los impresos. Los de c y d coinciden.

      **Lo que el enunciado no pide.** Con la convención del curso,
      $\tan 2\theta_1 = -2 \cdot 4786/(347.157 - 168.399) = -0{,}0535$, así que
      $\theta_1 = -1{,}53^{\circ}$: los ejes principales por $G$ están girados
      un grado y medio en sentido horario respecto de $x'y'$, con momentos
      principales de 347.285 y 168.271 cm⁴. El agujero apenas tuerce la
      placa.
