ejercicios:
  - id: ejma2-el-centro-de-gravedad-de-una-ele
    titulo: El centro de gravedad de una L, pieza a pieza
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Una placa homogénea en forma de L está formada por dos rectángulos: uno
      vertical que ocupa $0 \le x \le 2$, $0 \le y \le 8$ y otro horizontal que
      ocupa $2 \le x \le 8$, $0 \le y \le 2$, con las medidas en centímetros.
      Calcular la posición de su centro de gravedad.
    pide: Las coordenadas del centro de gravedad de la L.
    pasos:
      - tipo: reconocer
        pregunta: |
          La L no tiene una fórmula propia. ¿Cómo se saca su centro de
          gravedad?
        opciones:
          - texto: Partiéndola en dos rectángulos y haciendo la media de sus centros pesada por sus áreas
            correcta: true
            mensaje: |
              Eso es: figuras compuestas. Cada rectángulo tiene su centro en
              el medio, y las áreas dicen cuánto pesa cada uno en la media.
          - texto: Haciendo la media de los centros de los dos rectángulos, sin más
            mensaje: |
              Solo valdría si las dos piezas tuvieran la misma área. Aquí una
              mide 16 cm² y la otra 12, y la grande tira más del centro de
              gravedad hacia su lado.
          - texto: Tomando el centro del cuadrado de 8 por 8 que envuelve la L
            mensaje: |
              Ese cuadrado tiene un hueco enorme que la L no tiene. El centro
              de gravedad de la L está mucho más cerca de la esquina donde se
              juntan las dos piezas.

      - tipo: calcular
        titulo: La coordenada x
        pregunta: |
          ¿Cuánto vale $x_G$, en centímetros?
        respuesta:
          tipo: numero
          valor: '2.714'
          tolerancia: 0.005
          formato: un número, en cm
        distractores:
          - valor: '3'
            mensaje: |
              Es la media de $1$ y $5$ sin pesar por las áreas. Los dos
              rectángulos no son iguales: el vertical tiene 16 cm² y el
              horizontal 12.
          - valor: '4'
            mensaje: |
              Es el centro del cuadrado de 8 por 8 que envuelve la L, no el de
              la L. A la L le falta todo el cuadrado de arriba a la derecha.
        pista: |
          El rectángulo vertical tiene área 16 y centro en $x = 1$; el
          horizontal, área 12 y centro en $x = 5$.
        desarrollo: |
          $$
          x_G = \frac{16 \cdot 1 + 12 \cdot 5}{16 + 12} = \frac{76}{28} = 2{,}714\ \text{cm}
          $$

      - tipo: calcular
        titulo: La coordenada y
        pregunta: |
          ¿Cuánto vale $y_G$, en centímetros?
        respuesta:
          tipo: numero
          valor: '2.714'
          tolerancia: 0.005
          formato: un número, en cm
        distractores:
          - valor: '2.5'
            mensaje: |
              Es la media de $4$ y $1$ sin pesar por las áreas. El rectángulo
              vertical, más grande, sube el centro de gravedad por encima de
              ese punto medio.
        pista: |
          Los centros de los dos rectángulos están en $y = 4$ y en $y = 1$.
        desarrollo: |
          $$
          y_G = \frac{16 \cdot 4 + 12 \cdot 1}{28} = \frac{76}{28} = 2{,}714\ \text{cm}
          $$

          Que salga lo mismo que $x_G$ no es casualidad: la L es simétrica
          respecto de la diagonal $y = x$, y su centro de gravedad tiene que
          estar sobre ella.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Se parte la L en dos rectángulos: $A_1 = 16$ con centro en $(1, 4)$ y $A_2 = 12$ con centro en $(5, 1)$.'
          - texto: $x_G = (16 \cdot 1 + 12 \cdot 5)/28 = 2{,}714$ cm.
          - texto: $y_G = (16 \cdot 4 + 12 \cdot 1)/28 = 2{,}714$ cm, y sale igual porque la L es simétrica respecto de la recta $y = x$.
          - texto: Como son dos piezas, el centro de gravedad es el punto medio de sus centros, $(3;\ 2{,}5)$.
            trampa: true
            mensaje: |
              El punto medio solo vale si las dos piezas pesan lo mismo. Con 16
              y 12 cm², la media tiene que ir pesada por las áreas.
    resolucion: |
      **Las piezas.** La L es la unión de un rectángulo vertical de 2 por 8,
      área $A_1 = 16\ \text{cm}^{2}$ y centro en $(1, 4)$, y uno horizontal de
      6 por 2, área $A_2 = 12\ \text{cm}^{2}$ y centro en $(5, 1)$.

      **La media pesada.**

      $$
      x_G = \frac{16 \cdot 1 + 12 \cdot 5}{28} = 2{,}714\ \text{cm}
      \qquad
      y_G = \frac{16 \cdot 4 + 12 \cdot 1}{28} = 2{,}714\ \text{cm}
      $$

      La simetría respecto de la recta $y = x$ lo confirma: el centro de
      gravedad cae sobre ella. Y está dentro de la esquina donde se juntan las
      dos piezas, que es donde tiene que estar.

  - id: ejma2-steiner-desde-el-centro
    titulo: Steiner, pasando siempre por el centro de gravedad
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      De un rectángulo de base $b = 4\ \text{cm}$ y altura $h = 6\ \text{cm}$
      se sabe que su momento de inercia respecto de la base es
      $I_{\text{base}} = bh^{3}/3 = 288\ \text{cm}^{4}$. Calcular su momento de
      inercia respecto de una recta paralela a la base, situada 1 cm por
      encima de ella.
    pide: El momento de inercia respecto de una recta paralela a la base, a 1 cm.
    pasos:
      - tipo: reconocer
        pregunta: |
          Conoces el momento respecto de la base y quieres el de otra recta
          paralela. ¿Cómo se usa Steiner?
        opciones:
          - texto: Bajando primero al eje que pasa por G y subiendo luego a la recta pedida
            correcta: true
            mensaje: |
              Eso es. Steiner relaciona el eje de $G$ con un eje paralelo, así
              que todo camino entre dos ejes cualesquiera pasa por $G$.
          - texto: Sumando al momento de la base el área por 1 cm al cuadrado
            mensaje: |
              Eso sería aplicar Steiner entre la base y la recta pedida, y
              ninguna de las dos pasa por $G$. El resultado sale más grande
              que el de la base, cuando la recta está más cerca de $G$.
          - texto: Restando al momento de la base el área por 1 cm al cuadrado
            mensaje: |
              Tampoco. El signo menos no arregla el problema: la fórmula no
              relaciona dos ejes cualesquiera, sino uno de ellos con el de $G$.

      - tipo: calcular
        titulo: El momento de inercia por G
        pregunta: |
          ¿Cuánto vale el momento de inercia respecto del eje paralelo a la
          base que pasa por $G$, en cm⁴?
        respuesta:
          tipo: numero
          valor: '72'
          tolerancia: 0.5
          formato: un número, en cm⁴
        distractores:
          - valor: '216'
            mensaje: |
              Has restado el área por $h^{2}$, no por $(h/2)^{2}$. La
              distancia de la base a $G$ es la mitad de la altura, 3 cm.
        pista: |
          $G$ está a $h/2 = 3\ \text{cm}$ de la base, y el área es
          $24\ \text{cm}^{2}$.
        desarrollo: |
          $$
          I_G = I_{\text{base}} - A\left(\frac{h}{2}\right)^{2} = 288 - 24 \cdot 9 = 72\ \text{cm}^{4}
          $$

          Es $bh^{3}/12$, como tenía que ser.

      - tipo: calcular
        titulo: El momento de inercia a 1 cm de la base
        pregunta: |
          ¿Cuánto vale el momento de inercia respecto de la recta pedida, en
          cm⁴?
        respuesta:
          tipo: numero
          valor: '168'
          tolerancia: 0.5
          formato: un número, en cm⁴
        distractores:
          - valor: '312'
            mensaje: |
              Has sumado $A \cdot 1^{2}$ al momento de la base: Steiner entre
              dos ejes que no pasan por $G$. La recta pedida está más cerca de
              $G$ que la base, así que su momento tiene que ser **menor** que
              288, no mayor.
          - valor: '264'
            mensaje: |
              Has restado $A \cdot 1^{2}$ al momento de la base. El signo
              cambia, pero el fallo es el mismo: Steiner no une dos ejes
              cualesquiera. Hay que pasar por $G$.
        pista: |
          La recta está a $3 - 1 = 2\ \text{cm}$ de $G$.
        desarrollo: |
          $$
          I = I_G + A\,d^{2} = 72 + 24 \cdot 2^{2} = 168\ \text{cm}^{4}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'El área es $A = 24\ \text{cm}^{2}$ y el centro de gravedad está a 3 cm de la base.'
          - texto: $I_G = 288 - 24 \cdot 3^{2} = 72\ \text{cm}^{4}$.
          - texto: La recta pedida está a 2 cm de $G$, así que $I = 72 + 24 \cdot 2^{2} = 168\ \text{cm}^{4}$.
          - texto: Como la recta está a 1 cm de la base, basta sumar $24 \cdot 1^{2}$ al momento de la base.
            trampa: true
            mensaje: |
              Steiner relaciona el eje por $G$ con un paralelo, no dos ejes
              cualesquiera. Sumar desde la base da 312 cm⁴, más que en la
              propia base, para una recta que está más cerca de $G$.
    resolucion: |
      **Bajar a G.** Steiner dice $I_{\text{base}} = I_G + A(h/2)^{2}$, así que

      $$
      I_G = 288 - 24 \cdot 3^{2} = 72\ \text{cm}^{4}
      $$

      que es el $bh^{3}/12$ de siempre.

      **Subir a la recta pedida.** Está a 1 cm de la base, es decir, a
      $3 - 1 = 2\ \text{cm}$ de $G$:

      $$
      I = 72 + 24 \cdot 2^{2} = 168\ \text{cm}^{4}
      $$

      Sale menor que el de la base, y tiene sentido: la recta está más cerca
      de $G$, y el momento mínimo de todos los paralelos es justo el de $G$.

  - id: ejma2-col21-el-arco-de-circunferencia
    titulo: El centro de gravedad de un arco de circunferencia
    fuente: >-
      Ejercicio 2.1 · Tema 2, «Geometría de masas y superficies» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado
      2R·sen α/α, que es el doble de lo que dan la figura y la integral: el
      desarrollo publica R·sen α/α y explica de dónde sale ese 2.
    nivel: practica
    enunciado: |
      Calcular la posición del centro de gravedad del arco de circunferencia
      (elemento curvilíneo) de radio $R$ y ángulo $\alpha$ respecto al sistema
      de referencia indicado.

      <figure>
      <svg viewBox="0 0 260 250" role="img" width="260" height="250" aria-labelledby="ejma2-col21-t ejma2-col21-d">
        <title id="ejma2-col21-t">Arco de circunferencia simétrico respecto del eje x</title>
        <desc id="ejma2-col21-d">Ejes x e y con el origen en el centro de un arco de circunferencia de radio R. El arco es simétrico respecto del eje x: va desde un ángulo alfa por encima del eje hasta un ángulo alfa por debajo, así que abarca dos alfa en total.</desc>
        <defs>
          <marker id="ejma2-col21-f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <line x1="60" y1="150" x2="60" y2="18" stroke="var(--ink)" stroke-width="1.2" marker-end="url(#ejma2-col21-f)"/>
        <line x1="60" y1="150" x2="236" y2="150" stroke="var(--ink)" stroke-width="1.2" marker-end="url(#ejma2-col21-f)"/>
        <text x="46" y="26" font-size="11" fill="var(--ink)">y</text>
        <text x="236" y="166" font-size="11" fill="var(--ink)">x</text>
        <line x1="60" y1="150" x2="162.4" y2="70" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="60" y1="150" x2="162.4" y2="230" stroke="var(--faint)" stroke-width="0.8"/>
        <path d="M162.4 70 A130 130 0 0 0 121 35.2" fill="none" stroke="var(--faint)" stroke-width="0.8" stroke-dasharray="3 3"/>
        <path d="M162.4 70 A130 130 0 0 1 162.4 230" fill="none" stroke="var(--d1)" stroke-width="2.4"/>
        <line x1="60" y1="150" x2="128.9" y2="39.8" stroke="var(--faint)" stroke-width="1" marker-end="url(#ejma2-col21-f)"/>
        <text x="78" y="90" font-size="11" fill="var(--faint)">R</text>
        <path d="M94 150 A34 34 0 0 0 86.8 129.1" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <path d="M94 150 A34 34 0 0 1 86.8 170.9" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <text x="98" y="142" font-size="10" fill="var(--faint)">α</text>
        <text x="98" y="168" font-size="10" fill="var(--faint)">α</text>
      </svg>
      </figure>
    pide: La abscisa del centro de gravedad del arco, en función de R y de α.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de integrar, ¿qué se integra y entre qué límites?
        opciones:
          - texto: >-
              $y_G = 0$ por simetría, y $x_G = \frac{1}{L}\int x\,dL$ con
              $dL = R\,d\varphi$ y $\varphi$ de $-\alpha$ a $\alpha$
            correcta: true
            mensaje: |
              Eso es. Es una línea, así que lo que pesa es la longitud, y el
              eje $x$ es de simetría: solo queda por calcular $x_G$. En la
              figura el ángulo $\alpha$ está a cada lado del eje, así que el
              arco abarca $2\alpha$.
          - texto: >-
              $x_G = \frac{1}{A}\int x\,dA$, con el área del sector circular
            mensaje: |
              El enunciado dice «elemento curvilíneo»: es el alambre, no la
              chapa. Con el sector saldría $2R\sin\alpha/(3\alpha)$, que es
              otro cuerpo, más cerca del centro porque tiene masa en el
              interior.
          - texto: >-
              $\varphi$ de $0$ a $\alpha$, porque $\alpha$ es el ángulo del arco
            mensaje: |
              Mira la figura: hay un $\alpha$ por encima del eje y otro por
              debajo. Integrar de $0$ a $\alpha$ es quedarse con medio arco, y
              el centro de gravedad de medio arco ni siquiera está sobre el eje
              $x$.

      - tipo: calcular
        titulo: El coeficiente del resultado
        pregunta: |
          El resultado tiene la forma $x_G = k\,\dfrac{R\sin\alpha}{\alpha}$.
          ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              Es el resultado que imprime la colección, $2R\sin\alpha/\alpha$, y
              sale de dividir entre $R\alpha$ en lugar de entre la longitud
              real, $2R\alpha$. Compruébalo con $\alpha \to 0$: el arco se
              encoge hacia el punto $(R, 0)$, y la fórmula con el 2 pondría $G$
              en $x = 2R$, fuera del arco.
          - valor: '0.6667'
            mensaje: |
              Ese $2/3$ es del sector circular, $2R\sin\alpha/(3\alpha)$: has
              integrado sobre el área. Aquí la masa está solo en la línea, toda
              a distancia $R$ del centro.
        pista: |
          Con $x = R\cos\varphi$ y $dL = R\,d\varphi$, el numerador es
          $\int_{-\alpha}^{\alpha} R^{2}\cos\varphi\,d\varphi$, y el
          denominador, la longitud del arco entero.
        desarrollo: |
          $$
          \int_{-\alpha}^{\alpha} R\cos\varphi \cdot R\,d\varphi = 2R^{2}\sin\alpha
          \qquad
          L = 2R\alpha
          $$

          $$
          x_G = \frac{2R^{2}\sin\alpha}{2R\alpha} = \frac{R\sin\alpha}{\alpha}
          $$

      - tipo: calcular
        titulo: La semicircunferencia, como comprobación
        pregunta: |
          Con $\alpha = \pi/2$ el arco es una semicircunferencia. ¿Cuánto vale
          entonces $x_G$ en unidades de $R$?
        respuesta:
          tipo: numero
          valor: '0.63662'
          tolerancia: 0.002
          formato: un número, x_G/R
        distractores:
          - valor: '1.27324'
            mensaje: |
              Es $4/\pi$, lo que da la fórmula con el 2. Mayor que 1: el
              centro de gravedad quedaría más lejos que el propio arco, y eso
              no puede ser. Por eso el 2 sobra.
          - valor: '0.42441'
            mensaje: |
              Es $4/(3\pi)$, el del semicírculo, la superficie. La
              semicircunferencia es la línea, y su valor conocido es $2/\pi$.
        pista: |
          $\sin(\pi/2) = 1$. Tiene que salir el $2R/\pi$ de la
          semicircunferencia.
        desarrollo: |
          $$
          x_G = \frac{R\sin(\pi/2)}{\pi/2} = \frac{2R}{\pi} = 0{,}6366\,R
          $$

          Coincide con el valor conocido de la semicircunferencia, y queda
          dentro del arco, entre el centro y el radio.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: Por simetría respecto del eje $x$, $y_G = 0$.
          - texto: 'El arco va de $-\alpha$ a $\alpha$: $dL = R\,d\varphi$ y su longitud es $L = 2R\alpha$.'
          - texto: $\int x\,dL = \int_{-\alpha}^{\alpha} R^{2}\cos\varphi\,d\varphi = 2R^{2}\sin\alpha$.
          - texto: $x_G = 2R^{2}\sin\alpha / (2R\alpha) = R\sin\alpha/\alpha$.
          - texto: La longitud del arco es $R\alpha$, porque su ángulo es $\alpha$.
            trampa: true
            mensaje: |
              En la figura hay un $\alpha$ a cada lado del eje: el arco abarca
              $2\alpha$ y mide $2R\alpha$. Con $R\alpha$ sale el doble,
              $2R\sin\alpha/\alpha$, que para arcos cortos pondría $G$ a $2R$,
              fuera del arco.
    resolucion: |
      **La simetría.** El eje $x$ es de simetría del arco, así que $y_G = 0$ y
      solo hay que calcular $x_G$. Es un elemento curvilíneo: lo que pesa es la
      longitud.

      **La integral.** Con el ángulo $\varphi$ medido desde el eje $x$, cada
      elemento está en $x = R\cos\varphi$ y mide $dL = R\,d\varphi$. El arco va
      de $-\alpha$ a $\alpha$:

      $$
      x_G = \frac{\int_{-\alpha}^{\alpha} R^{2}\cos\varphi\,d\varphi}{2R\alpha}
      = \frac{2R^{2}\sin\alpha}{2R\alpha} = \frac{R\sin\alpha}{\alpha}
      $$

      **Sobre el resultado impreso.** La colección da
      $x_G = 2R\sin\alpha/\alpha$, el doble. Con la figura como está —un
      $\alpha$ a cada lado— no puede ser: para $\alpha \to 0$ daría $2R$,
      fuera del arco, y para la semicircunferencia $4R/\pi > R$. Con
      $R\sin\alpha/\alpha$ los dos casos salen bien: $R$ y $2R/\pi$, el valor
      que se usa como pieza en el resto del tema.

  - id: ejma2-col22-el-triangulo-por-franjas
    titulo: El centro de gravedad de un triángulo, por franjas
    fuente: >-
      Ejercicio 2.2 · Tema 2, «Geometría de masas y superficies» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Calcular la posición del centro de gravedad de un triángulo de base $b$ y
      altura $h$.

      <figure>
      <svg viewBox="0 0 250 215" role="img" width="250" height="215" aria-labelledby="ejma2-col22-t ejma2-col22-d">
        <title id="ejma2-col22-t">Triángulo de base b y altura h</title>
        <desc id="ejma2-col22-d">Un triángulo con la base b sobre el eje x y el vértice opuesto sobre el eje y, a una altura h. El eje y pasa por el vértice y por el punto medio de la base.</desc>
        <defs>
          <marker id="ejma2-col22-f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M70 170 L190 170 L130 60 Z" fill="var(--d1)" fill-opacity="0.16" stroke="var(--ink)" stroke-width="1.4"/>
        <line x1="50" y1="170" x2="230" y2="170" stroke="var(--ink)" stroke-width="1.2" marker-end="url(#ejma2-col22-f)"/>
        <line x1="130" y1="170" x2="130" y2="32" stroke="var(--ink)" stroke-width="1.2" marker-end="url(#ejma2-col22-f)"/>
        <text x="232" y="184" font-size="11" fill="var(--ink)">x</text>
        <text x="116" y="40" font-size="11" fill="var(--ink)">y</text>
        <line x1="48" y1="60" x2="126" y2="60" stroke="var(--faint)" stroke-width="0.7" stroke-dasharray="3 3"/>
        <line x1="45" y1="60" x2="45" y2="170" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="41" y1="60" x2="49" y2="60" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="41" y1="170" x2="49" y2="170" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="37" y="119" font-size="11" text-anchor="end" fill="var(--faint)">h</text>
        <line x1="70" y1="190" x2="190" y2="190" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="70" y1="186" x2="70" y2="194" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="190" y1="186" x2="190" y2="194" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="130" y="206" font-size="11" text-anchor="middle" fill="var(--faint)">b</text>
      </svg>
      </figure>
    pide: La altura del centro de gravedad sobre la base.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se plantea $y_G$ por integración?
        opciones:
          - texto: >-
              Con franjas horizontales de altura $dy$ y anchura
              $b(y) = b\,(1 - y/h)$, que se estrechan al subir
            correcta: true
            mensaje: |
              Eso es. Cada franja está entera a la misma altura $y$, así que
              $y_G = \int y\,b(y)\,dy \big/ A$. Y la anchura decrece de forma
              lineal: vale $b$ en la base y cero en el vértice.
          - texto: La mitad de la altura, $h/2$, a medio camino entre la base y el vértice
            mensaje: |
              Eso sería si la figura tuviera la misma anchura a todas las
              alturas, como un rectángulo. El triángulo tiene mucha más área
              abajo que arriba, y eso baja el centro de gravedad.
          - texto: >-
              $y_G = \frac{1}{h}\int_0^h y\,dy$, la media de las alturas
            mensaje: |
              Es una media sin pesar: da $h/2$. Cada altura tiene que ir
              multiplicada por el área que hay a esa altura, $b(y)\,dy$, que no
              es la misma arriba que abajo.

      - tipo: calcular
        titulo: El momento estático respecto de la base
        pregunta: |
          $\int_A y\,dA = k\,b\,h^{2}$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '0.16667'
          tolerancia: 0.002
          formato: un número
        distractores:
          - valor: '0.5'
            mensaje: |
              Has dejado la anchura constante, igual a $b$: es el momento
              estático del rectángulo $b \times h$. En el triángulo la franja
              se estrecha, $b(y) = b\,(1 - y/h)$.
          - valor: '0.33333'
            mensaje: |
              Has puesto la anchura creciendo hacia arriba, $b\,y/h$: es el
              triángulo al revés, con el vértice abajo. En la figura la base
              está sobre el eje $x$.
        pista: |
          $\int_0^h y\,b\left(1 - \frac{y}{h}\right)dy
          = b\left(\frac{h^{2}}{2} - \frac{h^{2}}{3}\right)$.
        desarrollo: |
          $$
          \int_A y\,dA = \int_0^h y\,b\left(1 - \frac{y}{h}\right)dy
          = b\left(\frac{h^{2}}{2} - \frac{h^{2}}{3}\right) = \frac{b\,h^{2}}{6}
          $$

      - tipo: calcular
        titulo: La altura del centro de gravedad
        pregunta: |
          $y_G = k\,h$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '0.33333'
          tolerancia: 0.002
          formato: un número, y_G/h
        distractores:
          - valor: '0.5'
            mensaje: |
              Es la media de alturas sin pesar por el área. Hay más área cerca
              de la base, así que $G$ queda por debajo de la mitad.
          - valor: '0.66667'
            mensaje: |
              Es $2h/3$: la distancia medida desde el **vértice**. El sistema de
              referencia de la figura tiene el eje $x$ en la base, y desde ahí
              $G$ está a un tercio.
        pista: |
          Divide el momento estático entre el área, $A = b\,h/2$.
        desarrollo: |
          $$
          y_G = \frac{b\,h^{2}/6}{b\,h/2} = \frac{h}{3}
          $$

          Y $x_G = 0$, porque en la figura el eje $y$ pasa por el vértice y
          por el punto medio de la base.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: A la altura $y$ la franja horizontal mide $b(y) = b\,(1 - y/h)$.
          - texto: $A = \int_0^h b(y)\,dy = b\,h/2$ y $\int_A y\,dA = b\,h^{2}/6$.
          - texto: $y_G = (b\,h^{2}/6)/(b\,h/2) = h/3$, medido desde la base.
          - texto: El resultado solo vale para el triángulo isósceles de la figura; en uno escaleno ya no está a un tercio de la altura.
            trampa: true
            mensaje: |
              La anchura a la altura $y$ es $b\,(1 - y/h)$ en cualquier
              triángulo de base $b$ y altura $h$, esté donde esté el vértice.
              Lo que cambia con la forma es $x_G$, no $y_G$.
    resolucion: |
      **Las franjas.** Se toman horizontales, porque cada una está entera a la
      misma altura $y$. Por semejanza de triángulos, a la altura $y$ la
      anchura es $b(y) = b\,(1 - y/h)$.

      **La integral.**

      $$
      A = \int_0^h b\left(1 - \frac{y}{h}\right)dy = \frac{b\,h}{2}
      \qquad
      \int_A y\,dA = \int_0^h y\,b\left(1 - \frac{y}{h}\right)dy = \frac{b\,h^{2}}{6}
      $$

      $$
      y_G = \frac{b\,h^{2}/6}{b\,h/2} = \frac{h}{3}
      $$

      Coincide con el resultado de la colección. Es la pieza que se usa en
      todos los problemas de figuras compuestas: el centro de gravedad de un
      triángulo está a un tercio de la altura desde la base, en cualquier
      triángulo.

  - id: ejma2-col23-el-cono-recto
    titulo: El centro de gravedad de un cono macizo
    fuente: >-
      Ejercicio 2.3 · Tema 2, «Geometría de masas y superficies» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Calcular la posición del centro de gravedad de un cono recto de radio $R$
      y altura $h$.

      <figure>
      <svg viewBox="0 0 260 240" role="img" width="260" height="240" aria-labelledby="ejma2-col23-t ejma2-col23-d">
        <title id="ejma2-col23-t">Cono recto con la base en el plano xy</title>
        <desc id="ejma2-col23-d">Un cono recto de radio R y altura h, en perspectiva. La base circular está en el plano xy, centrada en el origen O, y el eje z coincide con el eje del cono y pasa por el vértice.</desc>
        <defs>
          <marker id="ejma2-col23-f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M68 175 L130 60 L192 175 A62 18 0 0 1 68 175 Z" fill="var(--d1)" fill-opacity="0.14" stroke="none"/>
        <line x1="40" y1="158" x2="130" y2="175" stroke="var(--faint)" stroke-width="0.8"/>
        <path d="M68 175 A62 18 0 0 1 192 175" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="3 3"/>
        <path d="M68 175 A62 18 0 0 0 192 175" fill="none" stroke="var(--ink)" stroke-width="1.4"/>
        <line x1="68" y1="175" x2="130" y2="60" stroke="var(--ink)" stroke-width="1.4"/>
        <line x1="192" y1="175" x2="130" y2="60" stroke="var(--ink)" stroke-width="1.4"/>
        <line x1="130" y1="175" x2="130" y2="30" stroke="var(--ink)" stroke-width="1.1" marker-end="url(#ejma2-col23-f)"/>
        <line x1="130" y1="175" x2="240" y2="196" stroke="var(--ink)" stroke-width="1.1" marker-end="url(#ejma2-col23-f)"/>
        <line x1="130" y1="175" x2="72" y2="228" stroke="var(--ink)" stroke-width="1.1" marker-end="url(#ejma2-col23-f)"/>
        <text x="116" y="38" font-size="11" fill="var(--ink)">z</text>
        <text x="244" y="200" font-size="11" fill="var(--ink)">y</text>
        <text x="60" y="236" font-size="11" fill="var(--ink)">x</text>
        <text x="134" y="189" font-size="10" fill="var(--ink)">O</text>
        <line x1="130" y1="175" x2="176" y2="186" stroke="var(--faint)" stroke-width="1" marker-end="url(#ejma2-col23-f)"/>
        <text x="180" y="200" font-size="10" fill="var(--faint)">R</text>
        <line x1="36" y1="60" x2="126" y2="60" stroke="var(--faint)" stroke-width="0.7" stroke-dasharray="3 3"/>
        <line x1="34" y1="60" x2="34" y2="175" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="30" y1="60" x2="38" y2="60" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="30" y1="175" x2="38" y2="175" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="27" y="121" font-size="11" text-anchor="end" fill="var(--faint)">h</text>
      </svg>
      </figure>
    pide: La altura del centro de gravedad sobre la base.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué elemento de volumen conviene tomar?
        opciones:
          - texto: >-
              Discos horizontales de radio $r(z) = R\,(1 - z/h)$ y volumen
              $dV = \pi\,r^{2}\,dz$
            correcta: true
            mensaje: |
              Eso es. Cada disco está entero a la altura $z$, y su radio
              decrece linealmente hasta el vértice. El volumen de cada uno va
              con el **cuadrado** del radio.
          - texto: Ninguno; el centro de gravedad del cono es el de su sección, a $h/3$
            mensaje: |
              La sección por el eje es un triángulo, pero el cono no se
              reparte como su sección: los discos de abajo tienen radio mayor y
              su volumen va con $r^{2}$. Eso baja $G$ de $h/3$ a $h/4$.
          - texto: Discos de volumen $dV = 2\pi\,r\,dz$
            mensaje: |
              $2\pi r$ es el perímetro del disco, no su área. El volumen de un
              disco de radio $r$ y espesor $dz$ es $\pi r^{2}\,dz$.

      - tipo: calcular
        titulo: El volumen del cono
        pregunta: |
          $V = k\,\pi R^{2} h$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '0.33333'
          tolerancia: 0.002
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              Es el volumen del cilindro de radio $R$ y altura $h$. El radio
              del cono decrece con la altura: $r(z) = R\,(1 - z/h)$.
          - valor: '0.5'
            mensaje: |
              Has integrado $\pi R^{2}(1 - z/h)$, sin elevar al cuadrado el
              paréntesis. El área del disco es $\pi r^{2}$, y es $r$ lo que
              decrece linealmente, no $r^{2}$.
        pista: |
          $\int_0^h \pi R^{2}\left(1 - \frac{z}{h}\right)^{2}dz$. Con el cambio
          $u = 1 - z/h$ sale directa.
        desarrollo: |
          $$
          V = \int_0^h \pi R^{2}\left(1 - \frac{z}{h}\right)^{2}dz = \frac{\pi R^{2} h}{3}
          $$

      - tipo: calcular
        titulo: La altura del centro de gravedad
        pregunta: |
          $z_G = k\,h$, medida desde la base. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '0.25'
          tolerancia: 0.002
          formato: un número, z_G/h
        distractores:
          - valor: '0.33333'
            mensaje: |
              Es el centro de gravedad de la sección triangular. En el cono,
              cada disco pesa con el cuadrado de su radio, y los grandes están
              abajo: $G$ baja hasta $h/4$.
          - valor: '0.75'
            mensaje: |
              Es $3h/4$, la distancia medida desde el **vértice**. En la figura
              el origen está en el centro de la base.
          - valor: '0.5'
            mensaje: |
              Es la media de alturas sin pesar. Casi todo el volumen del cono
              está en su mitad inferior: solo un octavo queda por encima de
              $h/2$.
        pista: |
          $\int_0^h z\,\pi R^{2}\left(1 - \frac{z}{h}\right)^{2}dz
          = \frac{\pi R^{2} h^{2}}{12}$.
        desarrollo: |
          $$
          z_G = \frac{\pi R^{2} h^{2}/12}{\pi R^{2} h/3} = \frac{h}{4}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: Por simetría de revolución, $G$ está sobre el eje $z$.
          - texto: A la altura $z$ el disco tiene radio $R\,(1 - z/h)$ y volumen $\pi R^{2}(1 - z/h)^{2}\,dz$.
          - texto: $V = \pi R^{2} h/3$ y $\int z\,dV = \pi R^{2} h^{2}/12$.
          - texto: $z_G = h/4$, medido desde la base.
          - texto: El cono tiene el mismo centro de gravedad que su sección triangular, a $h/3$.
            trampa: true
            mensaje: |
              La sección reparte el área con la anchura, lineal en $z$; el
              cono reparte el volumen con el área del disco, cuadrática. Por
              eso su $G$ está más abajo, a $h/4$.
    resolucion: |
      **El elemento.** Discos horizontales: a la altura $z$ el radio es
      $r = R\,(1 - z/h)$ y el volumen, $dV = \pi r^{2}\,dz$. Por simetría, $G$
      está en el eje $z$.

      **Las dos integrales.**

      $$
      V = \int_0^h \pi R^{2}\left(1 - \frac{z}{h}\right)^{2}dz = \frac{\pi R^{2} h}{3}
      \qquad
      \int_V z\,dV = \frac{\pi R^{2} h^{2}}{12}
      $$

      $$
      z_G = \frac{\pi R^{2} h^{2}/12}{\pi R^{2} h/3} = \frac{h}{4}
      $$

      Coincide con la colección. La comparación con el triángulo es la que
      conviene recordar: la sección está a $h/3$ y el cono a $h/4$, porque en
      el sólido la base pesa con el cuadrado del radio.

  - id: ejma2-col24-la-semiesfera-maciza
    titulo: El centro de gravedad de una semiesfera maciza
    fuente: >-
      Ejercicio 2.4 · Tema 2, «Geometría de masas y superficies» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Calcular la posición del centro de gravedad de la semiesfera homogénea de
      radio $R$ de la figura.

      <figure>
      <svg viewBox="0 0 260 230" role="img" width="260" height="230" aria-labelledby="ejma2-col24-t ejma2-col24-d">
        <title id="ejma2-col24-t">Semiesfera maciza apoyada en el plano xy</title>
        <desc id="ejma2-col24-d">Una semiesfera maciza de radio R, en perspectiva, con la cara plana en el plano xy, centrada en el origen O, y la cúpula hacia arriba. El eje z pasa por el centro de la base y por el punto más alto.</desc>
        <defs>
          <marker id="ejma2-col24-f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M55 150 A75 75 0 0 1 205 150 A75 22 0 0 1 55 150 Z" fill="var(--d1)" fill-opacity="0.14" stroke="none"/>
        <line x1="28" y1="130" x2="130" y2="150" stroke="var(--faint)" stroke-width="0.8"/>
        <path d="M55 150 A75 22 0 0 1 205 150" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="3 3"/>
        <path d="M55 150 A75 22 0 0 0 205 150" fill="none" stroke="var(--ink)" stroke-width="1.4"/>
        <path d="M55 150 A75 75 0 0 1 205 150" fill="none" stroke="var(--ink)" stroke-width="1.4"/>
        <line x1="130" y1="150" x2="130" y2="30" stroke="var(--ink)" stroke-width="1.1" marker-end="url(#ejma2-col24-f)"/>
        <line x1="130" y1="150" x2="242" y2="172" stroke="var(--ink)" stroke-width="1.1" marker-end="url(#ejma2-col24-f)"/>
        <line x1="130" y1="150" x2="70" y2="212" stroke="var(--ink)" stroke-width="1.1" marker-end="url(#ejma2-col24-f)"/>
        <text x="116" y="38" font-size="11" fill="var(--ink)">z</text>
        <text x="244" y="186" font-size="11" fill="var(--ink)">y</text>
        <text x="58" y="222" font-size="11" fill="var(--ink)">x</text>
        <text x="136" y="166" font-size="10" fill="var(--ink)">O</text>
        <line x1="130" y1="150" x2="172" y2="130" stroke="var(--faint)" stroke-width="1" marker-end="url(#ejma2-col24-f)"/>
        <text x="174" y="126" font-size="10" fill="var(--faint)">R</text>
      </svg>
      </figure>
    pide: La altura del centro de gravedad sobre la cara plana.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué elemento de volumen conviene tomar, y qué valor tiene que
          descartar tu memoria?
        opciones:
          - texto: >-
              Discos horizontales de radio $r^{2} = R^{2} - z^{2}$, con
              $dV = \pi\,(R^{2} - z^{2})\,dz$ y $z$ de $0$ a $R$
            correcta: true
            mensaje: |
              Eso es. Cada disco está a la altura $z$, y su radio sale de la
              ecuación de la esfera. La semiesfera es **maciza**, así que
              cuenta todo el volumen.
          - texto: La cáscara, con $G$ a $R/2$ de la base
            mensaje: |
              $R/2$ es el centro de gravedad de la **superficie** semiesférica,
              la cáscara hueca. El enunciado dice homogénea y la figura es
              maciza: pesa también el interior, que está más abajo.
          - texto: El mismo que el semicírculo, $4R/(3\pi)$
            mensaje: |
              $4R/(3\pi)$ es del semicírculo plano. El sólido reparte el
              volumen con el área de cada disco, que va con $R^{2} - z^{2}$, y
              eso da otro número.

      - tipo: calcular
        titulo: El volumen
        pregunta: |
          $V = k\,\pi R^{3}$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '0.66667'
          tolerancia: 0.003
          formato: un número
        distractores:
          - valor: '1.33333'
            mensaje: |
              Es $4/3$, la esfera entera. Aquí $z$ va de $0$ a $R$: la mitad.
        pista: |
          $\int_0^R \pi\,(R^{2} - z^{2})\,dz$.
        desarrollo: |
          $$
          V = \pi\left(R^{3} - \frac{R^{3}}{3}\right) = \frac{2}{3}\pi R^{3}
          $$

      - tipo: calcular
        titulo: La altura del centro de gravedad
        pregunta: |
          $z_G = k\,R$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '0.375'
          tolerancia: 0.002
          formato: un número, z_G/R
        distractores:
          - valor: '0.5'
            mensaje: |
              Es el de la cáscara semiesférica, la superficie. La semiesfera
              maciza tiene masa en el interior, cerca de la base, y su $G$
              está más abajo.
          - valor: '0.42441'
            mensaje: |
              Es $4/(3\pi)$, el del semicírculo. En el sólido cada disco pesa
              con su área, $\pi(R^{2} - z^{2})$.
          - valor: '0.625'
            mensaje: |
              Es $5R/8$: la distancia desde la cúspide, no desde la base. El
              origen de la figura está en el centro de la cara plana.
        pista: |
          $\int_0^R z\,\pi\,(R^{2} - z^{2})\,dz = \dfrac{\pi R^{4}}{4}$.
        desarrollo: |
          $$
          z_G = \frac{\pi R^{4}/4}{2\pi R^{3}/3} = \frac{3R}{8}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: Por simetría de revolución, $G$ está sobre el eje $z$.
          - texto: A la altura $z$ el disco tiene radio $\sqrt{R^{2} - z^{2}}$ y volumen $\pi(R^{2} - z^{2})\,dz$.
          - texto: $V = 2\pi R^{3}/3$ y $\int z\,dV = \pi R^{4}/4$, así que $z_G = 3R/8$.
          - texto: Como es media esfera, su centro de gravedad está a media altura, en $R/2$.
            trampa: true
            mensaje: |
              $R/2$ es el de la superficie semiesférica, no el del sólido. En
              la semiesfera maciza hay más volumen abajo, donde los discos son
              anchos, y $G$ baja a $3R/8$.
    resolucion: |
      **El elemento.** Discos horizontales: la esfera cumple
      $r^{2} + z^{2} = R^{2}$, así que a la altura $z$ el disco tiene área
      $\pi(R^{2} - z^{2})$. Por simetría, $G$ está en el eje $z$.

      **Las dos integrales.**

      $$
      V = \int_0^R \pi(R^{2} - z^{2})\,dz = \frac{2}{3}\pi R^{3}
      \qquad
      \int_V z\,dV = \int_0^R z\,\pi(R^{2} - z^{2})\,dz = \frac{\pi R^{4}}{4}
      $$

      $$
      z_G = \frac{\pi R^{4}/4}{2\pi R^{3}/3} = \frac{3R}{8}
      $$

      Coincide con la colección. Tres números parecidos que conviene no
      mezclar: la semiesfera maciza a $3R/8$, la cáscara a $R/2$ y el
      semicírculo plano a $4R/(3\pi)$.

  - id: ejma2-col25-una-seccion-en-c
    titulo: Una sección en C, en tres rectángulos
    fuente: >-
      Ejercicio 2.5 · Tema 2, «Geometría de masas y superficies» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Calcular la posición del centro de gravedad de la superficie de la
      figura, sabiendo que las medidas están en centímetros.

      <figure>
      <svg viewBox="0 0 270 205" role="img" width="270" height="205" aria-labelledby="ejma2-col25-t ejma2-col25-d">
        <title id="ejma2-col25-t">Sección en forma de C con las medidas en centímetros</title>
        <desc id="ejma2-col25-d">Una superficie en forma de C apoyada en los ejes: un ala inferior de 30 de largo sobre el eje x, un alma vertical de 20 de alto sobre el eje y y un ala superior de 10 de largo. El ala superior tiene 2 de espesor, y el alma y el ala inferior están dibujadas con el mismo espesor.</desc>
        <defs>
          <marker id="ejma2-col25-f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M50 165 L230 165 L230 153 L62 153 L62 57 L110 57 L110 45 L50 45 Z" fill="var(--d1)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.3"/>
        <line x1="50" y1="165" x2="254" y2="165" stroke="var(--ink)" stroke-width="1.1" marker-end="url(#ejma2-col25-f)"/>
        <line x1="50" y1="165" x2="50" y2="22" stroke="var(--ink)" stroke-width="1.1" marker-end="url(#ejma2-col25-f)"/>
        <text x="256" y="178" font-size="11" fill="var(--ink)">x</text>
        <text x="36" y="28" font-size="11" fill="var(--ink)">y</text>
        <line x1="50" y1="35" x2="110" y2="35" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="110" y1="31" x2="110" y2="39" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="80" y="31" font-size="10" text-anchor="middle" fill="var(--faint)">10</text>
