    pide: El centro de gravedad, los momentos de inercia respecto de x′ e y′ y respecto de los ejes paralelos por G, y el volumen al girar alrededor de x′.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se plantea la superficie, y qué se puede decir de $G$ sin
          calcular?
        opciones:
          - texto: >-
              Rectángulo lleno menos el hueco, con los dos referidos a los
              mismos ejes; y $G$ en el centro, $(3, 5)$, por la doble simetría
            correcta: true
            mensaje: |
              Eso es. El hueco está centrado, así que la figura es simétrica
              respecto de las rectas $x' = 3$ e $y' = 5$, y $G$ está en su
              cruce. Para los momentos, cada pieza se lleva a $x'$ o a $y'$
              antes de restar: es lo que la nota llama «siempre referidos a la
              misma referencia».
          - texto: Rectángulo lleno más el hueco, sumando los momentos de los dos
            mensaje: |
              El hueco es área que falta. Sumarlo es contar como material el
              doble de lo que había en esa zona: el momento sale mayor que el
              del rectángulo lleno, y eso es imposible.
          - texto: Restar al rectángulo el momento del hueco respecto de su propia base, $2 \cdot 6^{3}/3$
            mensaje: |
              La base del hueco está a 2 cm de $x'$, no sobre él. Hay que
              llevar su momento al eje $x'$ con Steiner, desde su centro de
              gravedad, que está a 5 cm.

      - tipo: calcular
        titulo: El momento respecto de x prima
        pregunta: |
          ¿Cuánto vale $I_{x'}$?
        respuesta:
          tipo: numero
          valor: '1664'
          tolerancia: 1
          formato: un número, en cm⁴
        distractores:
          - valor: '2336'
            mensaje: |
              Has sumado el hueco. El rectángulo lleno da 2000 cm⁴, y la
              figura, con menos material, tiene que dar menos.
          - valor: '1964'
            mensaje: |
              Has restado el momento del hueco respecto de **su** eje central,
              $2 \cdot 6^{3}/12 = 36$, sin llevarlo a $x'$. Te falta el
              $A\,d^{2} = 12 \cdot 5^{2} = 300$.
          - valor: '1856'
            mensaje: |
              Has restado $2 \cdot 6^{3}/3 = 144$, el momento del hueco
              respecto de su propia base. Esa base está a 2 cm de $x'$: hay
              que pasar por su centro y usar Steiner.
        pista: |
          Rectángulo lleno respecto de su base: $b\,h^{3}/3$. Hueco:
          $2 \cdot 6^{3}/12 + 12 \cdot 5^{2}$.
        desarrollo: |
          $$
          I_{x'} = \frac{6 \cdot 10^{3}}{3} - \left(\frac{2 \cdot 6^{3}}{12} + 12 \cdot 5^{2}\right)
          = 2000 - 336 = 1664\ \text{cm}^{4}
          $$

      - tipo: calcular
        titulo: El momento respecto de y prima
        pregunta: |
          ¿Cuánto vale $I_{y'}$?
        respuesta:
          tipo: numero
          valor: '608'
          tolerancia: 1
          formato: un número, en cm⁴
        distractores:
          - valor: '832'
            mensaje: |
              Has sumado el hueco: $720 + 112$. El hueco resta.
          - valor: '716'
            mensaje: |
              Has restado solo el momento propio del hueco,
              $6 \cdot 2^{3}/12 = 4$. Su centro está a 3 cm de $y'$: falta
              $12 \cdot 3^{2} = 108$.
        pista: |
          Ahora la base es 10 y el ancho 6: $10 \cdot 6^{3}/3$. El hueco tiene
          el ancho 2 en la dirección $x'$ y su centro en $x' = 3$.
        desarrollo: |
          $$
          I_{y'} = \frac{10 \cdot 6^{3}}{3} - \left(\frac{6 \cdot 2^{3}}{12} + 12 \cdot 3^{2}\right)
          = 720 - 112 = 608\ \text{cm}^{4}
          $$

      - tipo: calcular
        titulo: El momento respecto del eje x por G
        pregunta: |
          ¿Cuánto vale $I_x$, respecto del eje paralelo a $x'$ que pasa por
          $G$?
        respuesta:
          tipo: numero
          valor: '464'
          tolerancia: 1
          formato: un número, en cm⁴
        distractores:
          - valor: '2864'
            mensaje: |
              Has sumado $A\,y_G^{2}$. Steiner dice $I_{x'} = I_x + A\,y_G^{2}$:
              para bajar al eje por $G$ se resta, y el momento por $G$ es el
              menor de todos los paralelos.
          - valor: '164'
            mensaje: |
              Has restado $60 \cdot 5^{2}$, con el área del rectángulo lleno.
              La que va en Steiner es la de la figura, $48\ \text{cm}^{2}$.
          - valor: '500'
            mensaje: |
              Es el rectángulo lleno por su centro, $6 \cdot 10^{3}/12$. Falta
              restar el hueco, que por $G$ solo aporta su momento propio, 36.
        pista: |
          $I_x = I_{x'} - A\,y_G^{2}$, con $A = 48\ \text{cm}^{2}$ e
          $y_G = 5\ \text{cm}$.
        desarrollo: |
          $$
          I_x = 1664 - 48 \cdot 5^{2} = 464\ \text{cm}^{4}
          $$

          Directo, con las dos piezas centradas en $G$:
          $6 \cdot 10^{3}/12 - 2 \cdot 6^{3}/12 = 500 - 36 = 464$.

      - tipo: calcular
        titulo: El momento respecto del eje y por G
        pregunta: |
          ¿Cuánto vale $I_y$, respecto del eje paralelo a $y'$ que pasa por
          $G$?
        respuesta:
          tipo: numero
          valor: '176'
          tolerancia: 1
          formato: un número, en cm⁴
        distractores:
          - valor: '1040'
            mensaje: |
              Has sumado $A\,x_G^{2} = 432$ en lugar de restarlo.
          - valor: '180'
            mensaje: |
              Es el rectángulo lleno por su centro, $10 \cdot 6^{3}/12$. Falta
              restar el momento propio del hueco, $6 \cdot 2^{3}/12 = 4$.
          - valor: '68'
            mensaje: |
              Has usado el área del rectángulo lleno en Steiner:
              $608 - 60 \cdot 9$. La figura tiene 48 cm².
        pista: |
          $I_y = I_{y'} - A\,x_G^{2}$, con $x_G = 3\ \text{cm}$.
        desarrollo: |
          $$
          I_y = 608 - 48 \cdot 3^{2} = 176\ \text{cm}^{4}
          $$

      - tipo: calcular
        titulo: El volumen al girar alrededor de x prima
        pregunta: |
          ¿Qué volumen genera la superficie al girar alrededor del eje $x'$?
        respuesta:
          tipo: magnitud
          valor: '1508 cm^3'
          tolerancia: 0.005
          formato: un volumen, con su unidad
        distractores:
          - valor: '1885 cm^3'
            mensaje: |
              Es el rectángulo lleno, $2\pi \cdot 5 \cdot 60$. El hueco también
              gira, y lo que genera es un hueco: el área es 48, no 60.
          - valor: '754 cm^3'
            mensaje: |
              Es $\pi\,y_G\,A$: falta el 2. El centro de gravedad recorre una
              circunferencia de longitud $2\pi y_G$.
          - valor: '905 cm^3'
            mensaje: |
              Has usado $x_G = 3$. Gira alrededor de $x'$: la distancia de $G$
              a ese eje es $y_G = 5$.
        pista: |
          Pappus-Guldin: $V = 2\pi\,y_G\,A$.
        desarrollo: |
          $$
          V = 2\pi \cdot 5 \cdot 48 = 480\pi = 1508\ \text{cm}^{3}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Por la doble simetría, $G = (3, 5)$ cm, y el área es $60 - 12 = 48\ \text{cm}^{2}$.'
          - texto: $I_{x'} = 2000 - (36 + 300) = 1664$ e $I_{y'} = 720 - (4 + 108) = 608\ \text{cm}^{4}$.
          - texto: $I_x = 1664 - 48 \cdot 25 = 464$ e $I_y = 608 - 48 \cdot 9 = 176\ \text{cm}^{4}$.
          - texto: $V = 2\pi \cdot 5 \cdot 48 = 1508\ \text{cm}^{3}$.
          - texto: Para pasar de $x'$ al eje por $G$ se suma $A\,y_G^{2}$, porque el eje por $G$ está más arriba.
            trampa: true
            mensaje: |
              Steiner siempre suma **desde** $G$ hacia fuera:
              $I_{x'} = I_x + A\,y_G^{2}$. Para ir hacia $G$ se resta, y por
              eso el momento por $G$ es el menor de todos los paralelos.
    resolucion: |
      **a) El centro de gravedad.** El hueco está centrado, así que la figura
      es simétrica respecto de $x' = 3$ e $y' = 5$: $x_G = 3$ cm e $y_G = 5$
      cm. El área es $60 - 12 = 48\ \text{cm}^{2}$.

      **b) Respecto de x′ e y′.** Rectángulo lleno menos hueco, llevando el
      hueco a cada eje con Steiner desde su centro:

      $$
      I_{x'} = \frac{6 \cdot 10^{3}}{3} - \left(\frac{2 \cdot 6^{3}}{12} + 12 \cdot 5^{2}\right) = 1664\ \text{cm}^{4}
      $$

      $$
      I_{y'} = \frac{10 \cdot 6^{3}}{3} - \left(\frac{6 \cdot 2^{3}}{12} + 12 \cdot 3^{2}\right) = 608\ \text{cm}^{4}
      $$

      **c) Respecto de los ejes por G.** Steiner con el área de la figura:

      $$
      I_x = 1664 - 48 \cdot 5^{2} = 464\ \text{cm}^{4}
      \qquad
      I_y = 608 - 48 \cdot 3^{2} = 176\ \text{cm}^{4}
      $$

      **d) El volumen.** Pappus-Guldin alrededor de $x'$:
      $V = 2\pi \cdot 5 \cdot 48 = 1508\ \text{cm}^{3}$.

      Coincide con la colección, que imprime el último momento con la letra
      d en lugar de la c. Los resultados de c se comprueban también directos,
      con las dos piezas centradas en $G$: $500 - 36 = 464$ y $180 - 4 = 176$.

  - id: ejma2-col216-la-t-de-dos-barras
    titulo: Una T de dos barras soldadas, respecto de G y de O
    fuente: >-
      Ejercicio 2.16 · Tema 2, «Geometría de masas y superficies» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección lo marca como de nivel
      de examen, e indica que está resuelto en el libro de la asignatura. La
      colección publica el resultado, contra el que está contrastado el
      desarrollo.
    nivel: practica
    enunciado: |
      Las dos barras homogéneas de la figura están en un plano vertical,
      soldadas en el punto $A$ en forma de $T$ y articuladas en $O$. Siendo la
      masa de cada barra $8\ \text{kg}$, calcular:

      a. La posición del centro de gravedad del sistema $G$.

      b. El momento de inercia del elemento $T$ respecto al punto $G$.

      c. El momento de inercia del elemento $T$ respecto al punto $O$.

      <figure>
      <svg viewBox="0 0 260 265" role="img" width="260" height="265" aria-labelledby="ejma2-col216-t ejma2-col216-d">
        <title id="ejma2-col216-t">Dos barras soldadas en T y articuladas en O</title>
        <desc id="ejma2-col216-d">Una barra horizontal OA de 0,25 m, articulada en O a un apoyo fijo, y una barra vertical de 0,5 m soldada por su punto medio al extremo A de la primera, formando una T tumbada. Cada barra tiene 8 kg.</desc>
        <line x1="44" y1="116" x2="76" y2="116" stroke="var(--ink)" stroke-width="1"/>
        <path d="M46 116 L52 108 M54 116 L60 108 M62 116 L68 108 M70 116 L76 108" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <path d="M60 130 L52 116 L68 116 Z" fill="none" stroke="var(--ink)" stroke-width="1"/>
        <line x1="60" y1="130" x2="160" y2="130" stroke="var(--ink)" stroke-width="4"/>
        <line x1="160" y1="30" x2="160" y2="230" stroke="var(--ink)" stroke-width="4"/>
        <path d="M157 128 L149 128 L157 120 Z" fill="var(--faint)" stroke="none"/>
        <path d="M157 132 L149 132 L157 140 Z" fill="var(--faint)" stroke="none"/>
        <circle cx="60" cy="130" r="2.6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1"/>
        <text x="40" y="143" font-size="12" fill="var(--ink)">O</text>
        <text x="168" y="126" font-size="12" fill="var(--ink)">A</text>
        <line x1="164" y1="30" x2="199" y2="30" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="164" y1="130" x2="199" y2="130" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="164" y1="230" x2="199" y2="230" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="195" y1="30" x2="195" y2="230" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="201" y="84" font-size="10" fill="var(--faint)">0,25 m</text>
        <text x="201" y="184" font-size="10" fill="var(--faint)">0,25 m</text>
        <line x1="60" y1="134" x2="60" y2="254" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="160" y1="234" x2="160" y2="254" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="60" y1="250" x2="160" y2="250" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="110" y="245" font-size="10" text-anchor="middle" fill="var(--faint)">0,25 m</text>
      </svg>
      </figure>
    pide: La posición de G y los momentos de inercia de la T respecto de G y de O.
    pasos:
      - tipo: reconocer
        pregunta: |
          Las dos barras están en un plano. ¿Qué es el momento de inercia
          «respecto de un punto» de este sistema?
        opciones:
          - texto: >-
              $\int (x^{2} + y^{2})\,dm$, que para un sistema plano es el
              momento respecto del eje perpendicular al plano por ese punto
            correcta: true
            mensaje: |
              Eso es. Como todos los puntos tienen $z = 0$, el momento polar
              respecto del punto coincide con el del eje perpendicular al
              plano que pasa por él: el eje sobre el que gira la T colgada de
              $O$.
          - texto: La suma de los momentos de cada barra respecto de su propio centro
            mensaje: |
              Cada barra tiene su momento propio **más** su masa por el
              cuadrado de la distancia de su centro al punto: Steiner. Sin ese
              término, el resultado no depende de dónde esté el punto.
          - texto: El momento respecto de un eje del plano que pase por el punto
            mensaje: |
              Un eje del plano deja fuera la distancia en una de las dos
              direcciones. Respecto de un punto cuentan las dos:
              $x^{2} + y^{2}$.

      - tipo: calcular
        titulo: El centro de gravedad
        pregunta: |
          Con el origen en $O$ y el eje $x$ a lo largo de $OA$, ¿cuánto vale
          $x_G$?
        respuesta:
          tipo: magnitud
          valor: '0.1875 m'
          tolerancia: 0.005
          formato: una longitud, con su unidad
        distractores:
          - valor: '0.2083 m'
            mensaje: |
              Has pesado por las longitudes, 0,25 y 0,5 m. Las barras no tienen
              la misma densidad lineal: cada una pesa 8 kg, y lo que pesa en la
              media es la masa.
          - valor: '0.125 m'
            mensaje: |
              Es el centro de la barra $OA$ solo. La barra vertical, con su
              centro en $A$, a 0,25 m, también cuenta, y con la misma masa.
        pista: |
          Centro de $OA$ en $x = 0{,}125$ m; centro de la vertical en $A$,
          $x = 0{,}25$ m. Por simetría, $y_G = 0$.
        desarrollo: |
          $$
          x_G = \frac{8 \cdot 0{,}125 + 8 \cdot 0{,}25}{16} = \frac{3}{16} = 0{,}1875\ \text{m}
          \qquad
          y_G = 0
          $$

      - tipo: calcular
        titulo: Respecto de G
        pregunta: |
          ¿Cuánto vale el momento de inercia de la T respecto de $G$?
        respuesta:
          tipo: magnitud
          valor: '0.2708 kg*m^2'
          tolerancia: 0.005
          formato: un momento de inercia, con su unidad (kg·m²)
        distractores:
          - valor: '0.2083 kg*m^2'
            mensaje: |
              Son solo los momentos propios, $8 \cdot 0{,}25^{2}/12 +
              8 \cdot 0{,}5^{2}/12$. Ninguna de las dos barras tiene su centro
              en $G$: falta Steiner, $8 \cdot 0{,}0625^{2}$ para cada una.
          - valor: '0.8333 kg*m^2'
            mensaje: |
              Has medido las distancias de Steiner desde $O$, no desde $G$:
              eso es el momento respecto de $O$, el del apartado c.
        pista: |
          Los dos centros están a la misma distancia de $G$:
          $0{,}1875 - 0{,}125 = 0{,}25 - 0{,}1875 = 0{,}0625$ m.
        desarrollo: |
          $$
          I_G = \frac{8 \cdot 0{,}25^{2}}{12} + 8 \cdot 0{,}0625^{2}
          + \frac{8 \cdot 0{,}5^{2}}{12} + 8 \cdot 0{,}0625^{2}
          = \frac{13}{48} = 0{,}2708\ \text{kg}\cdot\text{m}^{2}
          $$

      - tipo: calcular
        titulo: Respecto de O
        pregunta: |
          ¿Cuánto vale el momento de inercia de la T respecto de $O$?
        respuesta:
          tipo: magnitud
          valor: '0.8333 kg*m^2'
          tolerancia: 0.005
          formato: un momento de inercia, con su unidad (kg·m²)
        distractores:
          - valor: '0.5521 kg*m^2'
            mensaje: |
              Has usado 8 kg en Steiner. La masa que se traslada de $G$ a $O$
              es la del sistema entero, 16 kg.
          - valor: '0.3333 kg*m^2'
            mensaje: |
              Has sumado el $ML^{2}/3$ de $OA$ y el $ML^{2}/12$ de la vertical
              sin trasladarla: su centro está en $A$, a 0,25 m de $O$, y le
              falta $8 \cdot 0{,}25^{2} = 0{,}5$.
        pista: |
          Steiner desde $G$ con toda la masa: $I_O = I_G + 16 \cdot 0{,}1875^{2}$.
          O barra a barra: $OA$ por su extremo, y la vertical desde su centro
          $A$.
        desarrollo: |
          $$
          I_O = \frac{13}{48} + 16 \cdot 0{,}1875^{2} = 0{,}2708 + 0{,}5625 = \frac{5}{6} = 0{,}8333\ \text{kg}\cdot\text{m}^{2}
          $$

          Barra a barra sale lo mismo:
          $\frac{8 \cdot 0{,}25^{2}}{3} + \frac{8 \cdot 0{,}5^{2}}{12} + 8 \cdot 0{,}25^{2} = 0{,}1667 + 0{,}1667 + 0{,}5$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: $x_G = (8 \cdot 0{,}125 + 8 \cdot 0{,}25)/16 = 0{,}1875$ m, e $y_G = 0$ por simetría.
          - texto: Cada barra aporta $ML^{2}/12$ más $8 \cdot 0{,}0625^{2}$, y $I_G = 13/48$ kg·m².
          - texto: 'Por Steiner, $I_O = 13/48 + 16 \cdot 0{,}1875^{2} = 5/6$ kg·m².'
          - texto: En Steiner de $G$ a $O$ va la masa de una barra, 8 kg, porque $G$ está sobre la barra $OA$.
            trampa: true
            mensaje: |
              Steiner traslada el momento del **sistema** entero, así que va
              su masa total, 16 kg. Que $G$ caiga sobre $OA$ no cambia qué
              masa se traslada.
    resolucion: |
      **a) El centro de gravedad.** Con el origen en $O$ y el eje $x$ por
      $OA$. Las dos barras pesan lo mismo, así que $G$ está a medio camino
      entre sus centros:

      $$
      x_G = \frac{8 \cdot 0{,}125 + 8 \cdot 0{,}25}{16} = \frac{3}{16} = 0{,}1875\ \text{m}
      \qquad
      y_G = 0
      $$

      **b) Respecto de G.** Para un sistema plano, el momento respecto de un
      punto es el del eje perpendicular al plano por él. Cada barra, su
      $ML^{2}/12$ más Steiner hasta $G$; los dos centros están a 0,0625 m:

      $$
      I_G = \frac{8 \cdot 0{,}25^{2}}{12} + \frac{8 \cdot 0{,}5^{2}}{12} + 2 \cdot 8 \cdot 0{,}0625^{2}
      = \frac{13}{48} = 0{,}2708\ \text{kg}\cdot\text{m}^{2}
      $$

      **c) Respecto de O.** Steiner con la masa total:

      $$
      I_O = \frac{13}{48} + 16 \cdot \left(\frac{3}{16}\right)^{2} = \frac{5}{6} = 0{,}8333\ \text{kg}\cdot\text{m}^{2}
      $$

      Coincide con la colección. Es el momento que usará la dinámica para la
      T oscilando alrededor de la articulación $O$.

  - id: ejma2-col217-la-placa-con-agujero-circular
    titulo: Una placa con un agujero circular, hasta el producto de inercia
    fuente: >-
      Ejercicio 2.17 · Tema 2, «Geometría de masas y superficies» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección lo marca como de nivel
      de examen. La colección publica el resultado, contra el que está
      contrastado el desarrollo; dos de sus cifras, los momentos respecto de x
      y de y, llevan una errata, y aquí se publican los que dan los datos.
    nivel: practica
    enunciado: |
      Calcular para la superficie plana de la figura:

      a. Posición del centro de gravedad respecto al sistema de referencia
      $xy$ de la figura.

      b. Momentos de inercia respecto a los ejes $x$ e $y$ de la figura.

      c. Momentos de inercia respecto a los ejes $x'$ e $y'$ que son paralelos
      a los ejes $x$ e $y$, y que pasan por el centro de gravedad.

      d. Productos de inercia respecto a los ejes $x'y'$.

