        <line x1="50" y1="240" x2="50" y2="8" stroke="var(--ink)" stroke-width="1.2" marker-end="url(#ejma2-col217-f)"/>
        <text x="238" y="254" font-size="11" fill="var(--ink)">x</text>
        <text x="36" y="16" font-size="11" fill="var(--ink)">y</text>
        <text x="36" y="254" font-size="11" fill="var(--ink)">O</text>
