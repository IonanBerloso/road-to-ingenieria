        <path d="M110 22 L110 30 M190 22 L190 36" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="80" y="21" font-size="10" text-anchor="middle" fill="var(--faint)">15 cm</text>
        <text x="150" y="21" font-size="10" text-anchor="middle" fill="var(--faint)">20 cm</text>
        <line x1="193" y1="40" x2="212" y2="40" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="208" y1="40" x2="208" y2="240" stroke="var(--faint)" stroke-width="0.8"/>
        <path d="M204 120 L212 120 M204 240 L212 240" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="214" y="84" font-size="10" fill="var(--faint)">20 cm</text>
