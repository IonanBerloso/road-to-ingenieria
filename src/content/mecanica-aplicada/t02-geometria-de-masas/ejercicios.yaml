        <path d="M50 40 L190 40 L190 240 L50 240 Z M150 120 A40 40 0 1 0 70 120 A40 40 0 1 0 150 120 Z" fill="var(--d1)" fill-opacity="0.18" fill-rule="evenodd" stroke="var(--ink)" stroke-width="1.3"/>
        <line x1="50" y1="120" x2="212" y2="120" stroke="var(--faint)" stroke-width="0.5"/>
        <line x1="110" y1="22" x2="110" y2="240" stroke="var(--faint)" stroke-width="0.5"/>
