    pide: Las coordenadas del centro de gravedad y el volumen generado al girar alrededor del eje x.
    pasos:
      - tipo: reconocer
        pregunta: |
          Con franjas verticales de anchura $dx$ y altura $y = Kx^{3}$, ¿cómo
          se escriben $x_G$ e $y_G$?
        opciones:
          - texto: >-
              $x_G = \frac{1}{A}\int x\,y\,dx$ y
              $y_G = \frac{1}{A}\int \frac{y}{2}\,y\,dx$, porque el centro de
              cada franja está a media altura
            correcta: true
            mensaje: |
              Eso es. La franja entera está en la misma $x$, pero no en la
              misma $y$: su centro de gravedad está en $y/2$. Es la idea que la
              nota de la colección llama «integración = área bajo la curva».
          - texto: >-
              $x_G = \frac{1}{A}\int x\,y\,dx$ y
              $y_G = \frac{1}{A}\int y\,y\,dx$
            mensaje: |
              El brazo de la franja respecto del eje $x$ no es $y$, que es su
              punto más alto, sino $y/2$, su centro. Con $y$ el resultado sale
              el doble.
          - texto: El centro de gravedad está sobre la curva, así que basta calcular $x_G$ y hacer $y_G = K x_G^{3}$
            mensaje: |
              El centro de gravedad de una superficie no tiene por qué estar
              en su borde. Aquí está por debajo de la curva, dentro de la
              zona sombreada.

      - tipo: calcular
        titulo: El área
        pregunta: |
          Con $K = a/h^{3}$, el área es $A = k\,a\,h$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '0.25'
          tolerancia: 0.002
          formato: un número
        distractores:
          - valor: '0.33333'
            mensaje: |
              Es el área bajo una parábola, $n = 2$. Aquí $n = 3$: la integral
              de $x^{3}$ da $h^{4}/4$.
          - valor: '0.5'
            mensaje: |
              Es el triángulo de vértices $(0,0)$, $(h,0)$ y $(h,a)$. La
              cúbica va por debajo de esa recta, así que encierra menos área.
        pista: |
          La curva pasa por $(h, a)$: $K h^{3} = a$. Después,
          $A = \int_0^h K x^{3}\,dx$.
        desarrollo: |
          $$
          A = \int_0^h K x^{3}\,dx = \frac{K h^{4}}{4} = \frac{a\,h}{4}
          $$

      - tipo: calcular
        titulo: La abscisa del centro de gravedad
        pregunta: |
          $x_G = k\,h$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '0.8'
          tolerancia: 0.002
          formato: un número, x_G/h
        distractores:
          - valor: '0.75'
            mensaje: |
              Es el de la parábola, $n = 2$: $(n+1)/(n+2) = 3/4$. Con $n = 3$
              sale $4/5$.
          - valor: '0.5'
            mensaje: |
              Es la media de $x$ sin pesar. Casi toda el área está a la
              derecha, donde la curva es alta: $G$ tiene que ir por encima de
              $h/2$.
        pista: |
          $\int_0^h x\cdot K x^{3}\,dx = K h^{5}/5$.
        desarrollo: |
          $$
          x_G = \frac{K h^{5}/5}{K h^{4}/4} = \frac{4h}{5}
          $$

      - tipo: calcular
        titulo: La ordenada del centro de gravedad
        pregunta: |
          $y_G = k\,a$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '0.28571'
          tolerancia: 0.002
          formato: un número, y_G/a
        distractores:
          - valor: '0.57143'
            mensaje: |
              Es el doble de la buena: has tomado como brazo de cada franja su
              altura $y$ en lugar de su centro, $y/2$.
          - valor: '0.512'
            mensaje: |
              Es $K x_G^{3} = (4/5)^{3}\,a$: has puesto $G$ sobre la curva. El
              centro de gravedad está dentro de la superficie, no en su borde.
        pista: |
          $\int_0^h \frac{y}{2}\,y\,dx = \frac{K^{2}}{2}\int_0^h x^{6}\,dx
          = \frac{K^{2} h^{7}}{14}$.
        desarrollo: |
          $$
          y_G = \frac{K^{2} h^{7}/14}{K h^{4}/4} = \frac{2}{7}\,K h^{3} = \frac{2a}{7}
          $$

      - tipo: calcular
        titulo: El volumen al girar alrededor del eje x
        pregunta: |
          $V = k\,\pi a^{2} h$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '0.142857'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0.071429'
            mensaje: |
              Es $\pi\,y_G\,A$: te falta el 2 de Pappus-Guldin. El centro de
              gravedad recorre una circunferencia entera, de longitud
              $2\pi y_G$.
          - valor: '0.285714'
            mensaje: |
              Arrastras el $y_G = 4a/7$ de tomar la altura de la franja como
              brazo. Con el bueno, $2a/7$, sale la mitad.
        pista: |
          Pappus-Guldin, $V = 2\pi\,y_G\,A$: gira alrededor del eje $x$, así
          que la distancia que cuenta es $y_G$.
        desarrollo: |
          $$
          V = 2\pi \cdot \frac{2a}{7} \cdot \frac{a\,h}{4} = \frac{\pi a^{2} h}{7}
          $$

          Por discos sale lo mismo:
          $\int_0^h \pi (K x^{3})^{2}\,dx = \pi K^{2} h^{7}/7 = \pi a^{2} h/7$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: Con $K = a/h^{3}$, $A = \int_0^h K x^{3}\,dx = a\,h/4$.
          - texto: $x_G = \frac{1}{A}\int_0^h x\cdot Kx^{3}\,dx = 4h/5$.
          - texto: $y_G = \frac{1}{A}\int_0^h \frac{y}{2}\,y\,dx = 2a/7$.
          - texto: $V = 2\pi\,y_G\,A = \pi a^{2} h/7$.
          - texto: El brazo de cada franja vertical respecto del eje $x$ es su altura $y$.
            trampa: true
            mensaje: |
              La altura $y$ es el punto más alto de la franja. Su centro de
              gravedad está en $y/2$, y ese es el brazo que entra en el
              momento estático.
    resolucion: |
      **La curva.** Pasa por $(h, a)$, así que $K = a/h^{3}$. Se integra con
      franjas verticales de anchura $dx$ y altura $y = Kx^{3}$, cuyo centro
      está en $(x,\ y/2)$.

      **a) El centro de gravedad.**

      $$
      A = \frac{K h^{4}}{4} = \frac{a\,h}{4}
      \qquad
      x_G = \frac{K h^{5}/5}{K h^{4}/4} = \frac{4h}{5}
      \qquad
      y_G = \frac{K^{2} h^{7}/14}{K h^{4}/4} = \frac{2a}{7}
      $$

      **b) El volumen.** Pappus-Guldin con la distancia al eje de giro, que es
      $y_G$:

      $$
      V = 2\pi\,y_G\,A = 2\pi \cdot \frac{2a}{7} \cdot \frac{a\,h}{4} = \frac{\pi a^{2} h}{7}
      $$

      Coincide con la colección, y con la integral por discos, que da lo
      mismo sin pasar por $G$. Que las dos vías coincidan es la mejor
      comprobación de que $y_G$ está bien.

  - id: ejma2-col27-el-semidisco-con-hueco
    titulo: Un semidisco con un hueco semicircular
    fuente: >-
      Ejercicio 2.7 · Tema 2, «Geometría de masas y superficies» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Calcular la posición del centro de gravedad de la figura respecto al
      sistema de referencia indicado.

      <figure>
      <svg viewBox="0 0 260 200" role="img" width="260" height="200" aria-labelledby="ejma2-col27-t ejma2-col27-d">
        <title id="ejma2-col27-t">Semidisco de radio r con un hueco semicircular de radio r/2</title>
        <desc id="ejma2-col27-d">Un semidisco de radio r apoyado sobre el eje x, con su diámetro entre x igual a 0 y x igual a 2r. Del lado derecho se ha quitado un semidisco de radio r/2 cuyo diámetro va de x igual a r a x igual a 2r, también sobre el eje x.</desc>
        <defs>
          <marker id="ejma2-col27-f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M40 160 A80 80 0 0 1 200 160 A40 40 0 0 0 120 160 Z" fill="var(--d1)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.3"/>
        <line x1="40" y1="160" x2="238" y2="160" stroke="var(--ink)" stroke-width="1.2" marker-end="url(#ejma2-col27-f)"/>
        <line x1="40" y1="160" x2="40" y2="22" stroke="var(--ink)" stroke-width="1.2" marker-end="url(#ejma2-col27-f)"/>
        <text x="240" y="174" font-size="11" fill="var(--ink)">x</text>
        <text x="26" y="28" font-size="11" fill="var(--ink)">y</text>
        <line x1="120" y1="163" x2="120" y2="184" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="160" y1="163" x2="160" y2="184" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="40" y1="180" x2="160" y2="180" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="40" y1="176" x2="40" y2="184" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="80" y="194" font-size="11" text-anchor="middle" fill="var(--faint)">r</text>
        <text x="140" y="194" font-size="11" text-anchor="middle" fill="var(--faint)">r/2</text>
      </svg>
      </figure>
    pide: Las coordenadas del centro de gravedad de la figura, en función de r.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo entra el hueco en la cuenta?
        opciones:
          - texto: >-
              Como un semidisco de área negativa: se resta en el numerador y
              también en el área total
            correcta: true
            mensaje: |
              Eso es. La figura es el semidisco grande, de radio $r$ y centro
              en $(r, 0)$, menos el pequeño, de radio $r/2$ y centro en
              $(3r/2, 0)$. Los dos centros de gravedad se conocen.
          - texto: Como una pieza más, sumando su área y su momento
            mensaje: |
              Sumar el hueco es rellenarlo dos veces: la figura tendría más
              material del que tenía el semidisco entero. El hueco es material
              que **falta**.
          - texto: Restando su momento del numerador, pero dividiendo entre el área del semidisco grande
            mensaje: |
              El denominador es el área de la figura que tienes, y a esa le
              falta el hueco. Si solo restas arriba, el resultado sale
              desplazado hacia el origen.

      - tipo: calcular
        titulo: La abscisa
        pregunta: |
          $x_G = k\,r$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '0.83333'
          tolerancia: 0.003
          formato: un número, x_G/r
        distractores:
          - valor: '1.1'
            mensaje: |
              Has sumado el hueco en lugar de restarlo. Añadir material a la
              derecha lleva $G$ más allá de $x = r$; quitarlo, al revés, lo
              trae hacia la izquierda.
          - valor: '0.625'
            mensaje: |
              Has restado el hueco en el numerador pero no en el denominador:
              divides entre $\pi r^{2}/2$ cuando el área de la figura es
              $3\pi r^{2}/8$.
          - valor: '1'
            mensaje: |
              Es el centro del semidisco entero, sin el hueco. Al quitar
              material de la derecha, $G$ tiene que moverse a la izquierda de
              $x = r$.
        pista: |
          $A_1 = \pi r^{2}/2$ en $x = r$; $A_2 = \pi r^{2}/8$ en $x = 3r/2$,
          y $A = A_1 - A_2 = 3\pi r^{2}/8$.
        desarrollo: |
          $$
          x_G = \frac{\frac{\pi r^{2}}{2}\,r - \frac{\pi r^{2}}{8}\cdot\frac{3r}{2}}{\frac{3\pi r^{2}}{8}}
          = \frac{\frac{1}{2} - \frac{3}{16}}{\frac{3}{8}}\,r = \frac{5r}{6}
          $$

      - tipo: calcular
        titulo: La ordenada
        pregunta: |
          $y_G = k\,r$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '0.49515'
          tolerancia: 0.003
          formato: un número, y_G/r
        distractores:
          - valor: '0.38197'
            mensaje: |
              Has sumado el hueco. Su centro está bajo, a $2r/(3\pi)$, así que
              sumarlo baja $G$; restarlo lo sube por encima del $4r/(3\pi)$ del
              semidisco entero.
          - valor: '0.42441'
            mensaje: |
              Es $4r/(3\pi)$, el del semidisco entero, o lo que sale si usas
              esa misma altura para los dos semidiscos. El pequeño tiene la
              suya: $4(r/2)/(3\pi) = 2r/(3\pi)$.
        pista: |
          Semidisco de radio $\rho$: su centro de gravedad está a
          $4\rho/(3\pi)$ del diámetro. Aquí $\rho = r$ y $\rho = r/2$.
        desarrollo: |
          $$
          y_G = \frac{\frac{\pi r^{2}}{2}\cdot\frac{4r}{3\pi} - \frac{\pi r^{2}}{8}\cdot\frac{2r}{3\pi}}{\frac{3\pi r^{2}}{8}}
          = \frac{\frac{2}{3} - \frac{1}{12}}{\frac{3\pi}{8}}\,r = \frac{14r}{9\pi} = 0{,}495\,r
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Semidisco grande: $A_1 = \pi r^{2}/2$ con centro en $(r,\ 4r/3\pi)$.'
          - texto: 'Hueco: $A_2 = \pi r^{2}/8$ con centro en $(3r/2,\ 2r/3\pi)$, que entra restando.'
          - texto: $x_G = 5r/6$ e $y_G = 14r/(9\pi)$, con $A = 3\pi r^{2}/8$ en el denominador.
          - texto: El hueco se resta en el numerador, pero el área que divide es la del semidisco entero, porque es la figura de partida.
            trampa: true
            mensaje: |
              Se divide entre el área de lo que queda, $3\pi r^{2}/8$. Si no,
              es como si el material del hueco siguiera ahí sin tener
              momento, y $x_G$ sale $0{,}625\,r$.
    resolucion: |
      **Las piezas.** Semidisco grande de radio $r$ y centro en $(r, 0)$ menos
      semidisco pequeño de radio $r/2$ y centro en $(3r/2, 0)$. El centro de
      gravedad de un semidisco de radio $\rho$ está a $4\rho/(3\pi)$ del
      diámetro.

      | pieza | $A$ | $x_G$ | $y_G$ |
      |---|---|---|---|
      | semidisco grande | $\pi r^{2}/2$ | $r$ | $4r/(3\pi)$ |
      | hueco | $-\pi r^{2}/8$ | $3r/2$ | $2r/(3\pi)$ |

      **La media pesada**, con $A = 3\pi r^{2}/8$:

      $$
      x_G = \frac{\frac{1}{2} - \frac{3}{16}}{\frac{3}{8}}\,r = \frac{5r}{6}
      \qquad
      y_G = \frac{\frac{2}{3} - \frac{1}{12}}{\frac{3\pi}{8}}\,r = \frac{14r}{9\pi}
      $$

      Coincide con la colección. Las dos comprobaciones de sentido común: $G$
      se ha ido a la izquierda de $x = r$ y ha subido por encima de
      $4r/(3\pi)$, justo lo que hace quitar material abajo a la derecha.

  - id: ejma2-col28-el-avellanado
    titulo: El volumen de un avellanado, con Pappus-Guldin
    fuente: >-
      Ejercicio 2.8 · Tema 2, «Geometría de masas y superficies» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo. Ese resultado, 4254 mm³,
      es todo el acero quitado, taladro incluido; el avellanado solo quita
      720 mm³, y el ejercicio calcula los dos.
    nivel: practica
    enunciado: |
      Se taladra un agujero de $15\ \text{mm}$ de diámetro en una pieza de
      acero de $20\ \text{mm}$ de espesor y después se avellana como indica la
      figura. Calcular el volumen de acero removido durante el proceso de
      avellanado. La densidad del acero es
      $\rho = 7{,}85\ \text{kg}/\text{dm}^{3}$.

      <figure>
      <svg viewBox="0 0 380 210" role="img" width="380" height="210" aria-labelledby="ejma2-col28-t ejma2-col28-d">
        <title id="ejma2-col28-t">Sección de una pieza con un agujero avellanado</title>
        <desc id="ejma2-col28-d">Sección por el eje de una pieza de 20 mm de espesor con un agujero pasante de 15 mm de diámetro. En la cara superior el agujero se abre en un cono de 90 grados de ángulo total, que en la superficie tiene 25 mm de diámetro.</desc>
        <path d="M40 70 L107.5 70 L132.5 95 L132.5 170 L40 170 Z" fill="var(--d1)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.3"/>
        <path d="M232.5 70 L300 70 L300 170 L207.5 170 L207.5 95 Z" fill="var(--d1)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.3"/>
        <line x1="170" y1="50" x2="170" y2="182" stroke="var(--faint)" stroke-width="0.8" stroke-dasharray="6 3 2 3"/>
        <line x1="107.5" y1="70" x2="88.7" y2="51.2" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="232.5" y1="70" x2="251.3" y2="51.2" stroke="var(--faint)" stroke-width="0.7"/>
        <path d="M88.7 51.2 A115 115 0 0 1 251.3 51.2" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="170" y="13" font-size="10" text-anchor="middle" fill="var(--faint)">90°</text>
        <line x1="107.5" y1="60" x2="232.5" y2="60" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="107.5" y1="56" x2="107.5" y2="64" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="232.5" y1="56" x2="232.5" y2="64" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="170" y="55" font-size="10" text-anchor="middle" fill="var(--faint)">25 mm</text>
        <line x1="303" y1="70" x2="322" y2="70" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="303" y1="170" x2="322" y2="170" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="318" y1="70" x2="318" y2="170" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="324" y="124" font-size="10" fill="var(--faint)">20 mm</text>
        <line x1="132.5" y1="173" x2="132.5" y2="192" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="207.5" y1="173" x2="207.5" y2="192" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="132.5" y1="188" x2="207.5" y2="188" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="170" y="203" font-size="10" text-anchor="middle" fill="var(--faint)">15 mm</text>
      </svg>
      </figure>
    pide: El volumen quitado al avellanar, y el total quitado contando el taladro, que es el que da la colección.
    pasos:
      - tipo: reconocer
        pregunta: |
          El avellanado es un sólido de revolución alrededor del eje del
          agujero. ¿Qué superficie gira para generar lo que quita?
        opciones:
          - texto: >-
              El triángulo rectángulo que queda entre la pared del taladro y el
              cono, con catetos de 5 mm
            correcta: true
            mensaje: |
              Eso es. El taladro ya había quitado el cilindro de 7,5 mm de
              radio; el avellanado solo añade el anillo que va de ese radio a
              la generatriz del cono. Su sección es un triángulo, y
              Pappus-Guldin da el volumen con su área y la distancia de su
              centro de gravedad al eje.
          - texto: El trapecio entre el eje y el cono, que genera un tronco de cono
            mensaje: |
              Ese tronco incluye el cilindro central, que se quitó al
              taladrar, antes de avellanar. Contarlo aquí es quitar dos veces
              el mismo acero.
          - texto: El triángulo, pero girando con la distancia de su vértice al eje
            mensaje: |
              Pappus-Guldin usa el recorrido del **centro de gravedad** de lo
              que gira, $2\pi x_G$, no el de un punto cualquiera de la
              figura.

      - tipo: calcular
        titulo: La profundidad del cono
        pregunta: |
          ¿Hasta qué profundidad baja el avellanado?
        respuesta:
          tipo: magnitud
          valor: '5 mm'
          tolerancia: 0.02
          formato: una longitud, con su unidad
        distractores:
          - valor: '10 mm'
            mensaje: |
              $25 - 15 = 10$ es la diferencia de **diámetros**. El cono avanza
              la diferencia de radios, 5 mm a cada lado.
          - valor: '7.07 mm'
            mensaje: |
              Es la longitud de la generatriz inclinada, $5\sqrt{2}$. La
              profundidad es el cateto vertical, que con 45° es igual al
              horizontal.
        pista: |
          El ángulo total de 90° deja 45° a cada lado del eje: el cono baja lo
          mismo que se estrecha en radio, de 12,5 a 7,5 mm.
        desarrollo: |
          $$
          p = \frac{12{,}5 - 7{,}5}{\tan 45^{\circ}} = 5\ \text{mm}
          $$

      - tipo: calcular
        titulo: Lo que quita el avellanado
        pregunta: |
          ¿Qué volumen quita el avellanado, sin contar el taladro?
        respuesta:
          tipo: magnitud
          valor: '720 mm^3'
          tolerancia: 0.01
          formato: un volumen, con su unidad
        distractores:
          - valor: '4254 mm^3'
            mensaje: |
              Ese es el volumen total del agujero, taladro incluido, que es lo
              que da la colección. Esta pregunta pide solo el anillo que añade
              el avellanado; el total es la siguiente.
          - valor: '1604 mm^3'
            mensaje: |
              Es el tronco de cono entero entre los diámetros 25 y 15. Dentro
              de él está el cilindro de 7,5 mm de radio y 5 mm de alto, que
              ya había quitado el taladro: resta sus 884 mm³.
          - valor: '851 mm^3'
            mensaje: |
              Has puesto el centro de gravedad del triángulo a un tercio desde
              el lado equivocado, en $12{,}5 - 5/3$. El ángulo recto está en la
              pared del taladro, en $r = 7{,}5$: el centroide está a
              $7{,}5 + 5/3 = 9{,}17$ mm del eje.
        pista: |
          Triángulo de catetos 5 y 5 mm: $A = 12{,}5\ \text{mm}^{2}$, con el
          ángulo recto en $r = 7{,}5$ mm. Su centro de gravedad está a
          $7{,}5 + 5/3$ mm del eje.
        desarrollo: |
          $$
          V_{\text{av}} = 2\pi\,x_G\,A = 2\pi \cdot 9{,}167 \cdot 12{,}5 = 720\ \text{mm}^{3}
          $$

          Comprobación sin Pappus: tronco de cono menos cilindro,
          $\frac{\pi \cdot 5}{3}(12{,}5^{2} + 12{,}5 \cdot 7{,}5 + 7{,}5^{2}) - \pi \cdot 7{,}5^{2} \cdot 5 = 1604 - 884 = 720\ \text{mm}^{3}$.

      - tipo: calcular
        titulo: Todo el acero quitado
        pregunta: |
          ¿Cuánto acero se ha quitado en total, taladro y avellanado juntos?
        respuesta:
          tipo: magnitud
          valor: '4254 mm^3'
          tolerancia: 0.005
          formato: un volumen, con su unidad
        distractores:
          - valor: '720 mm^3'
            mensaje: |
              Es solo el avellanado. Aquí se suma el cilindro del taladro, de
              7,5 mm de radio y 20 mm de alto.
          - valor: '3534 mm^3'
            mensaje: |
              Es solo el taladro, $\pi \cdot 7{,}5^{2} \cdot 20$. Falta el
              anillo del avellanado.
          - valor: '5138 mm^3'
            mensaje: |
              Has sumado al taladro el tronco de cono entero: los 5 mm de
              arriba del cilindro quedan contados dos veces.
        pista: |
          Cilindro de radio 7,5 mm y altura 20 mm, más el anillo del paso
          anterior.
        desarrollo: |
          $$
          V = \pi \cdot 7{,}5^{2} \cdot 20 + 720 = 3534 + 720 = 4254\ \text{mm}^{3}
          $$

          Es el resultado de la colección. Con Pappus-Guldin de una sola vez:
          el rectángulo de $7{,}5 \times 20$ más el triángulo, girando juntos.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: El cono de 90° baja 5 mm, lo que tarda en pasar del radio 12,5 al 7,5.
          - texto: 'El anillo del avellanado tiene por sección un triángulo de catetos 5 y 5 mm, con el ángulo recto en $r = 7{,}5$ mm.'
          - texto: $V_{\text{av}} = 2\pi \cdot (7{,}5 + 5/3) \cdot 12{,}5 = 720\ \text{mm}^{3}$.
          - texto: 'Con el taladro, $3534 + 720 = 4254\ \text{mm}^{3}$ en total.'
          - texto: Lo que quita el avellanado es el tronco de cono entero entre los diámetros 25 y 15 mm.
            trampa: true
            mensaje: |
              El tronco contiene el cilindro central, que el taladro ya había
              quitado. Lo nuevo es el tronco menos ese cilindro:
              $1604 - 884 = 720\ \text{mm}^{3}$.
    resolucion: |
      **La geometría.** Con 90° de ángulo total, el cono va a 45° del eje:
      baja lo mismo que se estrecha en radio, de 12,5 a 7,5 mm, es decir,
      5 mm.

      **Lo que quita el avellanado.** El taladro ya había quitado el cilindro
      de radio 7,5 mm. El avellanado añade un anillo cuya sección es un
      triángulo rectángulo de catetos 5 y 5 mm, con el ángulo recto en
      $r = 7{,}5$. Por Pappus-Guldin:

      $$
      V_{\text{av}} = 2\pi \left(7{,}5 + \frac{5}{3}\right) \cdot 12{,}5 = 720\ \text{mm}^{3}
      $$

      **Todo lo quitado.** Con el cilindro del taladro:

      $$
      V = \pi \cdot 7{,}5^{2} \cdot 20 + 720 = 4254\ \text{mm}^{3}
      $$

      **Sobre el resultado de la colección.** Publica $V = 4254\ \text{mm}^{3}$,
      que es el total quitado: la nota habla de figuras compuestas, rectángulo
      más triángulo. Leído al pie de la letra, el enunciado pregunta por el
      avellanado solo, que son 720 mm³. Aquí se dan los dos. La densidad no
      hace falta para ninguno de los dos volúmenes; con ella, el total quitado
      son $4254 \cdot 7{,}85 \cdot 10^{-6} = 0{,}0334\ \text{kg}$, unos 33 g.

  - id: ejma2-col29-el-alambre-que-se-equilibra-en-c
    titulo: El alambre cuyo centro de gravedad cae en C
    fuente: >-
      Ejercicio 2.9 · Tema 2, «Geometría de masas y superficies» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      La figura muestra un alambre homogéneo delgado. Calcular la longitud $l$
      del tramo $CE$ del alambre para el cual el centro de gravedad de la
      figura se localiza en el punto $C$ cuando: a) $\vartheta = 15^{\circ}$;
      b) $\vartheta = 60^{\circ}$.

      <figure>
      <svg viewBox="0 0 390 190" role="img" width="390" height="190" aria-labelledby="ejma2-col29-t ejma2-col29-d">
        <title id="ejma2-col29-t">Alambre con un arco AB y un tramo recto DE que pasa por C</title>
        <desc id="ejma2-col29-d">Un alambre formado por un arco de circunferencia AB de radio r y centro C, que abarca un ángulo theta a cada lado de la recta CD, y por un tramo recto que va de D, el punto medio del arco, hasta E, pasando por C. El tramo CE mide l. En C hay un apoyo.</desc>
        <defs>
          <marker id="ejma2-col29-f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--faint)"/>
          </marker>
        </defs>
        <line x1="180" y1="110" x2="93.4" y2="60" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="180" y1="110" x2="93.4" y2="160" stroke="var(--faint)" stroke-width="0.7"/>
        <path d="M93.4 60 A100 100 0 0 1 130 23.4" fill="none" stroke="var(--faint)" stroke-width="0.7" stroke-dasharray="3 3"/>
        <line x1="180" y1="110" x2="130" y2="23.4" stroke="var(--faint)" stroke-width="0.9" marker-end="url(#ejma2-col29-f)"/>
        <text x="162" y="62" font-size="11" fill="var(--faint)">r</text>
        <path d="M93.4 60 A100 100 0 0 0 93.4 160" fill="none" stroke="var(--d1)" stroke-width="3"/>
        <line x1="80" y1="110" x2="360" y2="110" stroke="var(--d1)" stroke-width="3"/>
        <path d="M145 110 A35 35 0 0 1 149.7 92.5" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <path d="M145 110 A35 35 0 0 0 149.7 127.5" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="131" y="100" font-size="10" fill="var(--faint)">θ</text>
        <text x="131" y="129" font-size="10" fill="var(--faint)">θ</text>
        <rect x="172" y="102" width="16" height="16" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.1"/>
        <circle cx="180" cy="110" r="2" fill="var(--ink)"/>
        <line x1="164" y1="121" x2="198" y2="121" stroke="var(--ink)" stroke-width="1"/>
        <path d="M170 121 L164 129 M178 121 L172 129 M186 121 L180 129 M194 121 L188 129" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="80" y="54" font-size="11" fill="var(--ink)">A</text>
        <text x="80" y="176" font-size="11" fill="var(--ink)">B</text>
        <text x="175" y="97" font-size="11" fill="var(--ink)">C</text>
        <text x="64" y="114" font-size="11" fill="var(--ink)">D</text>
        <text x="362" y="104" font-size="11" fill="var(--ink)">E</text>
        <line x1="360" y1="113" x2="360" y2="154" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="180" y1="132" x2="180" y2="154" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="180" y1="150" x2="360" y2="150" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="270" y="146" font-size="11" text-anchor="middle" fill="var(--faint)">l</text>
      </svg>
      </figure>
    pide: La longitud l del tramo CE, en unidades de r, para cada ángulo.
    pasos:
      - tipo: reconocer
        pregunta: |
          Es un alambre homogéneo: pesa la longitud. ¿Qué piezas entran, y
          dónde está el centro de gravedad de cada una?
        opciones:
          - texto: >-
              El arco $AB$, de longitud $2r\vartheta$, con su centro a
              $r\sin\vartheta/\vartheta$ de $C$ hacia $D$, y el tramo recto
              $DE$, de longitud $r + l$
            correcta: true
            mensaje: |
              Eso es. El tramo recto empieza en $D$, al otro lado de $C$, así
              que incluye los $r$ de $DC$. Y el arco es la figura del 2.1, con
              $C$ como centro.
          - texto: El arco $AB$ y el tramo $CE$, de longitud $l$
            mensaje: |
              El alambre recto empieza en $D$, no en $C$: el tramo $DC$ también
              es alambre y pesa, y está del mismo lado que el arco. Sin él, $l$
              sale corta.
          - texto: El arco $AB$ con su centro de gravedad en $D$, que es su punto medio
            mensaje: |
              $D$ es el punto medio del arco, pero no su centro de gravedad: un
              arco se curva hacia su centro, y su $G$ queda en el interior, a
              $r\sin\vartheta/\vartheta < r$ de $C$.

      - tipo: calcular
        titulo: El caso a, con 15 grados
        pregunta: |
          Para $\vartheta = 15^{\circ}$, ¿cuánto vale $l$ en unidades de $r$?
        respuesta:
          tipo: numero
          valor: '1.4266'
          tolerancia: 0.003
          formato: un número, l/r
        distractores:
          - valor: '1.0175'
            mensaje: |
              Te has dejado el tramo $DC$. El alambre recto va de $D$ a $E$:
              mide $r + l$ y su centro está en $(l - r)/2$ desde $C$.
          - valor: '1.7523'
            mensaje: |
              Has puesto el centro del arco a $2r\sin\vartheta/\vartheta$, la
              fórmula impresa en el 2.1, que es el doble. Con el ángulo
              $\vartheta$ a cada lado, el centro está a
              $r\sin\vartheta/\vartheta$.
        pista: |
          Momentos respecto de $C$, positivos hacia $E$:
          $-2r\vartheta \cdot \frac{r\sin\vartheta}{\vartheta} + (r + l)\,\frac{l - r}{2} = 0$.
          Sale $l^{2} = r^{2}(1 + 4\sin\vartheta)$.
        desarrollo: |
          $$
          -2r^{2}\sin\vartheta + \frac{l^{2} - r^{2}}{2} = 0
          \;\Longrightarrow\;
          l = r\sqrt{1 + 4\sin\vartheta}
          $$

          $$
          l = r\sqrt{1 + 4 \cdot 0{,}2588} = 1{,}427\,r
          $$

      - tipo: calcular
        titulo: El caso b, con 60 grados
        pregunta: |
          Para $\vartheta = 60^{\circ}$, ¿cuánto vale $l$ en unidades de $r$?
        respuesta:
          tipo: numero
          valor: '2.1128'
          tolerancia: 0.003
          formato: un número, l/r
        distractores:
          - valor: '1.8612'
            mensaje: |
              Otra vez sin el tramo $DC$. Con él, el momento del tramo recto
              es $(r + l)(l - r)/2 = (l^{2} - r^{2})/2$.
          - valor: '2.8157'
            mensaje: |
              Arrastras el 2 de más en el centro del arco: $l^{2} = r^{2}(1 +
              8\sin\vartheta)$ en lugar de $1 + 4\sin\vartheta$.
        pista: |
          La misma ecuación, $l = r\sqrt{1 + 4\sin\vartheta}$, con
          $\sin 60^{\circ} = 0{,}866$.
        desarrollo: |
          $$
          l = r\sqrt{1 + 4 \cdot 0{,}8660} = r\sqrt{4{,}464} = 2{,}113\,r
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Arco: longitud $2r\vartheta$, centro de gravedad a $r\sin\vartheta/\vartheta$ de $C$, del lado de $D$.'
          - texto: 'Tramo recto $DE$: longitud $r + l$, centro de gravedad a $(l - r)/2$ de $C$.'
          - texto: $G$ en $C$ exige momento nulo respecto de $C$, y de ahí $l = r\sqrt{1 + 4\sin\vartheta}$.
          - texto: 'Resultados: $1{,}427\,r$ con 15° y $2{,}113\,r$ con 60°.'
          - texto: El centro de gravedad del tramo recto está a $l/2$ de $C$.
            trampa: true
            mensaje: |
              Eso sería el tramo $CE$ solo. El tramo recto empieza en $D$, a
              $r$ al otro lado de $C$: su punto medio está en $(l - r)/2$.
    resolucion: |
      **Las piezas.** El alambre es un arco $AB$ de radio $r$ centrado en $C$,
      que abarca $\vartheta$ a cada lado de $CD$, y un tramo recto de $D$ a
      $E$. Con el eje por $DE$ y origen en $C$, positivo hacia $E$:

      - arco: $L_1 = 2r\vartheta$, $x_1 = -r\sin\vartheta/\vartheta$ (el
        resultado del 2.1);
      - tramo recto: $L_2 = r + l$, $x_2 = (l - r)/2$.

      **La condición.** $G$ en $C$ quiere decir momento estático nulo respecto
      de $C$:

      $$
      -2r\vartheta \cdot \frac{r\sin\vartheta}{\vartheta} + (r + l)\,\frac{l - r}{2} = 0
      \;\Longrightarrow\;
      l = r\sqrt{1 + 4\sin\vartheta}
      $$

      El $\vartheta$ del denominador se va con la longitud del arco, así que
      da igual trabajar en grados o en radianes.

      **Los dos casos.** Con 15°, $l = 1{,}427\,r$; con 60°, $l = 2{,}113\,r$.
      Coinciden con la colección. Tiene sentido que crezca: un arco más
      abierto es más largo y hace falta más alambre al otro lado para
      compensarlo.

  - id: ejma2-col210-el-volumen-de-revolucion
    titulo: El volumen de revolución de una figura con muesca
    fuente: >-
      Ejercicio 2.10 · Tema 2, «Geometría de masas y superficies» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Obtener el volumen del cuerpo de revolución que se genera al hacer girar
      la superficie de la figura alrededor del eje $e$.

      <figure>
      <svg viewBox="0 0 280 300" role="img" width="280" height="300" aria-labelledby="ejma2-col210-t ejma2-col210-d">
        <title id="ejma2-col210-t">Superficie con una muesca triangular junto al eje de giro e</title>
        <desc id="ejma2-col210-d">Una superficie plana apoyada en un eje vertical e. Abajo, una base horizontal de longitud R. Arriba, un triángulo rectángulo de catetos R y R, con el cateto vertical sobre el eje y la hipotenusa a 45 grados. Entre los dos, a la altura 2R/3, se abre desde la derecha una muesca triangular: la parte de abajo es un rectángulo de R/3 por 2R/3 junto al eje y un triángulo de catetos 2R/3 con la hipotenusa a 45 grados.</desc>
        <defs>
          <marker id="ejma2-col210-f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M50 270 L200 270 L100 170 L200 170 L50 20 Z" fill="var(--d1)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.3"/>
        <line x1="50" y1="286" x2="50" y2="6" stroke="var(--ink)" stroke-width="1.3" marker-end="url(#ejma2-col210-f)"/>
        <text x="36" y="14" font-size="12" fill="var(--ink)">e</text>
        <path d="M50 170 L100 170 L100 270" fill="none" stroke="var(--faint)" stroke-width="0.8" stroke-dasharray="4 3"/>
        <line x1="200" y1="170" x2="200" y2="270" stroke="var(--faint)" stroke-width="0.8" stroke-dasharray="4 3"/>
        <path d="M175 170 A25 25 0 0 1 182.3 152.3" fill="none" stroke="var(--ink)" stroke-width="0.8"/>
        <path d="M175 270 A25 25 0 0 1 182.3 252.3" fill="none" stroke="var(--ink)" stroke-width="0.8"/>
        <text x="146" y="164" font-size="10" fill="var(--ink)">45°</text>
        <text x="146" y="264" font-size="10" fill="var(--ink)">45°</text>
        <text x="207" y="224" font-size="11" fill="var(--ink)">2R/3</text>
        <line x1="50" y1="280" x2="200" y2="280" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="200" y1="276" x2="200" y2="284" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="125" y="295" font-size="11" text-anchor="middle" fill="var(--ink)">R</text>
      </svg>
      </figure>
    pide: El volumen del cuerpo de revolución, en función de R.
    pasos:
      - tipo: reconocer
        pregunta: |
          La figura gira alrededor de $e$, que es vertical. ¿Cómo se usa
          Pappus-Guldin?
        opciones:
          - texto: >-
              $V = 2\pi\sum A_i\,x_i$, con $x_i$ la distancia **horizontal** del
              centro de gravedad de cada pieza al eje $e$
            correcta: true
            mensaje: |
              Eso es. Se parte en un triángulo arriba, un rectángulo y un
              triángulo abajo, y no hace falta calcular $x_G$: basta el
              momento estático total, $\sum A_i x_i = x_G A$.
          - texto: $V = 2\pi\sum A_i\,y_i$, con la altura de cada centro de gravedad sobre la base
            mensaje: |
              La altura sería la distancia a un eje horizontal. Aquí gira
              alrededor de $e$, vertical, y lo que recorre cada centro de
              gravedad es una circunferencia de radio igual a su distancia
              horizontal a $e$.
          - texto: $V = \pi\,x_G\,A$, porque $x_G$ es el radio de giro del centro de gravedad
            mensaje: |
              El centro de gravedad recorre una circunferencia de radio $x_G$,
              y su longitud es $2\pi x_G$, no $\pi x_G$.

      - tipo: calcular
        titulo: El área
        pregunta: |
          $A = k\,R^{2}$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '0.94444'
          tolerancia: 0.003
          formato: un número
        distractores:
          - valor: '1.16667'
            mensaje: |
              No has quitado la muesca: triángulo de arriba más el
              rectángulo entero de $R \times 2R/3$. La muesca es el triángulo
              de catetos $2R/3$ que falta abajo a la derecha.
          - valor: '0.72222'
            mensaje: |
              Te falta una pieza: $1/2 + 2/9$. Abajo hay dos, el rectángulo
              de $R/3 \times 2R/3$ junto al eje y el triángulo de catetos
              $2R/3$.
        pista: |
          Triángulo de arriba, $R^{2}/2$; rectángulo, $(R/3)(2R/3)$; triángulo
          de abajo, $(2R/3)^{2}/2$.
        desarrollo: |
          $$
          A = \frac{R^{2}}{2} + \frac{2R^{2}}{9} + \frac{2R^{2}}{9} = \frac{17}{18}R^{2}
          $$

      - tipo: calcular
        titulo: El momento estático respecto del eje
        pregunta: |
          $\sum A_i\,x_i = k\,R^{3}$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '0.32716'
          tolerancia: 0.002
          formato: un número
        distractores:
          - valor: '0.5'
            mensaje: |
              Es sin quitar la muesca: $R^{3}/6$ del triángulo más $R^{3}/3$
              del rectángulo entero. La muesca quita material lejos del eje,
              que es el que más cuenta.
          - valor: '0.62346'
            mensaje: |
              Has usado las alturas de los centros de gravedad. El eje $e$ es
              vertical: la distancia que cuenta es la horizontal.
        pista: |
          Distancias al eje: triángulo de arriba, $R/3$; rectángulo, $R/6$;
          triángulo de abajo, $R/3 + (2R/3)/3 = 5R/9$.
        desarrollo: |
          $$
          \sum A_i x_i = \frac{R^{2}}{2}\cdot\frac{R}{3} + \frac{2R^{2}}{9}\cdot\frac{R}{6} + \frac{2R^{2}}{9}\cdot\frac{5R}{9}
          = \left(\frac{1}{6} + \frac{1}{27} + \frac{10}{81}\right)R^{3} = \frac{53}{162}R^{3}
          $$

      - tipo: calcular
        titulo: El volumen
        pregunta: |
          $V = k\,\pi R^{3}$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '0.65432'
          tolerancia: 0.003
          formato: un número
        distractores:
          - valor: '0.32716'
            mensaje: |
              Es $\pi\sum A_i x_i$: te falta el 2 de la circunferencia,
              $2\pi x_G$.
          - valor: '1'
            mensaje: |
              Es el volumen sin quitar la muesca. Revisa el momento
              estático: la muesca tiene que restar.
          - valor: '1.24691'
            mensaje: |
              Arrastras las alturas en lugar de las distancias al eje $e$. Al
              girar alrededor de un eje vertical, el radio de cada
              circunferencia es horizontal.
        pista: |
          $V = 2\pi\sum A_i x_i$.
        desarrollo: |
          $$
          V = 2\pi \cdot \frac{53}{162}R^{3} = \frac{53\pi R^{3}}{81} = 2{,}056\,R^{3}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Tres piezas: triángulo de catetos $R$ arriba, rectángulo $R/3 \times 2R/3$ junto al eje y triángulo de catetos $2R/3$ abajo.'
          - texto: Sus distancias al eje $e$ son $R/3$, $R/6$ y $5R/9$.
          - texto: $\sum A_i x_i = 53R^{3}/162$ y $V = 2\pi \cdot 53R^{3}/162 = 53\pi R^{3}/81$.
          - texto: El triángulo de abajo tiene su centro de gravedad a un tercio de su cateto desde el eje, en $2R/9$.
            trampa: true
            mensaje: |
              El tercio se mide desde el vértice del ángulo recto, que no está
              en el eje sino en $x = R/3$. La distancia al eje es
              $R/3 + (2R/3)/3 = 5R/9$.
    resolucion: |
      **Las piezas.** Leyendo la figura: arriba, un triángulo rectángulo de
      catetos $R$ y $R$ con el cateto vertical sobre el eje; abajo, un
      rectángulo de $R/3 \times 2R/3$ junto al eje y un triángulo de catetos
      $2R/3$, con el ángulo recto en $(R/3, 0)$. La muesca es lo que queda
      entre los dos triángulos.

      | pieza | $A$ | distancia a $e$ | $A\,x$ |
      |---|---|---|---|
      | triángulo de arriba | $R^{2}/2$ | $R/3$ | $R^{3}/6$ |
      | rectángulo | $2R^{2}/9$ | $R/6$ | $R^{3}/27$ |
      | triángulo de abajo | $2R^{2}/9$ | $5R/9$ | $10R^{3}/81$ |

      **Pappus-Guldin.** No hace falta $x_G$, solo el momento estático:

      $$
      V = 2\pi\sum A_i x_i = 2\pi\left(\frac{1}{6} + \frac{1}{27} + \frac{10}{81}\right)R^{3}
      = \frac{53\pi R^{3}}{81}
      $$

      Coincide con la colección. Como dice su nota, aquí no entra ningún
      momento de inercia: solo áreas y centros de gravedad.
  - id: ejma2-col211-la-barra-por-el-centro-y-por-el-extremo
    titulo: La barra, por el centro y por el extremo
    fuente: >-
      Ejercicio 2.11 · Tema 2, «Geometría de masas y superficies» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Hallar el momento de inercia de una barra homogénea de masa $M$ y
      longitud $L$ respecto al eje $z$, siendo éste perpendicular a la barra,
      para los casos:

      a. Eje $z$ que pasa por su centro de gravedad.

      b. Eje $z$ que pasa por un extremo.
    pide: Los dos momentos de inercia de la barra.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué integral da el momento de inercia de la barra?
        opciones:
          - texto: >-
              $I = \int x^{2}\,dm$ con $dm = \frac{M}{L}\,dx$ y $x$ la
              distancia de cada trozo al eje
            correcta: true
            mensaje: |
              Eso es. La barra es homogénea, así que cada trozo $dx$ tiene
              masa $\frac{M}{L}dx$, y cada uno cuenta con el cuadrado de su
              distancia al eje. Solo cambian los límites: de $-L/2$ a $L/2$
              por el centro y de $0$ a $L$ por el extremo.
          - texto: $I = M\,d^{2}$, con $d$ la distancia del eje al centro de la barra
            mensaje: |
              Eso es tratar la barra como una masa puntual. Por el centro
              daría cero, y la barra sí se resiste a girar: cada trozo está a
              su propia distancia del eje.
          - texto: $I = \int x\,dm$
            mensaje: |
              Eso es el momento estático, el del centro de gravedad. El de
              inercia lleva la distancia **al cuadrado**, y por eso nunca se
              anula.

      - tipo: calcular
        titulo: Por el centro de gravedad
        pregunta: |
          $I_z = k\,M L^{2}$ con el eje por el centro. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '0.083333'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0.33333'
            mensaje: |
              Es $1/3$, el del eje por el extremo. Por el centro la masa está
              repartida a los dos lados y más cerca: los límites van de
              $-L/2$ a $L/2$.
          - valor: '0.25'
            mensaje: |
              Es $M(L/2)^{2}$: toda la masa en los extremos, a la distancia
              máxima. La barra tiene masa a todas las distancias entre $0$ y
              $L/2$, y el momento sale tres veces menor.
        pista: |
          $\int_{-L/2}^{L/2} x^{2}\,\frac{M}{L}\,dx = \frac{M}{L}\cdot\frac{2}{3}\left(\frac{L}{2}\right)^{3}$.
        desarrollo: |
          $$
          I_G = \frac{M}{L}\left[\frac{x^{3}}{3}\right]_{-L/2}^{L/2} = \frac{M L^{2}}{12}
          $$

      - tipo: calcular
        titulo: Por un extremo
        pregunta: |
          $I_z = k\,M L^{2}$ con el eje por un extremo. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '0.33333'
          tolerancia: 0.002
          formato: un número
        distractores:
          - valor: '0.083333'
            mensaje: |
              Es el del centro. Por el extremo la masa está más lejos del eje:
              el momento tiene que salir mayor.
          - valor: '1.08333'
            mensaje: |
              Has aplicado Steiner con $d = L$. La distancia entre los dos
              ejes es la del centro al extremo, $L/2$:
              $\frac{ML^{2}}{12} + M\left(\frac{L}{2}\right)^{2}$.
        pista: |
          Directo, $\int_0^L x^{2}\,\frac{M}{L}\,dx$. O con Steiner desde el
          centro: $I = I_G + M(L/2)^{2}$.
        desarrollo: |
          $$
          I_{\text{ext}} = \frac{M}{L}\cdot\frac{L^{3}}{3} = \frac{M L^{2}}{3}
          \qquad
          \frac{M L^{2}}{12} + M\,\frac{L^{2}}{4} = \frac{M L^{2}}{3}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: La barra es homogénea, $dm = (M/L)\,dx$, e $I = \int x^{2}\,dm$.
          - texto: De $-L/2$ a $L/2$ sale $I_G = ML^{2}/12$.
          - texto: De $0$ a $L$ sale $ML^{2}/3$, lo mismo que $I_G + M(L/2)^{2}$ por Steiner.
          - texto: Por el extremo el momento es el doble que por el centro, porque la distancia máxima al eje se duplica.
            trampa: true
            mensaje: |
              Es el cuádruple: $1/3$ entre $1/12$. La distancia entra al
              cuadrado, y además por el extremo toda la masa queda del mismo
              lado.
    resolucion: |
      **La integral.** Con $dm = (M/L)\,dx$ y $x$ medida desde el eje:

      $$
      I_G = \int_{-L/2}^{L/2} x^{2}\,\frac{M}{L}\,dx = \frac{M L^{2}}{12}
      \qquad
      I_{\text{ext}} = \int_{0}^{L} x^{2}\,\frac{M}{L}\,dx = \frac{M L^{2}}{3}
      $$

      **La comprobación con Steiner.** El eje del extremo es paralelo al del
      centro de gravedad y está a $L/2$:

      $$
      I_{\text{ext}} = \frac{M L^{2}}{12} + M\left(\frac{L}{2}\right)^{2} = \frac{M L^{2}}{3}
      $$

      Coincide con la colección. Son los dos valores que la nota pide
      conocer y plantear: se usan como piezas en el 2.16 y en toda la
      dinámica.

  - id: ejma2-col212-el-disco-axial-y-diametral
    titulo: El disco, respecto de su eje y de un diámetro
    fuente: >-
      Ejercicio 2.12 · Tema 2, «Geometría de masas y superficies» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Hallar el momento de inercia de un disco homogéneo de masa $M$ y de
      radio $R$:

      a. Respecto al eje $z$.

      b. Respecto a un eje cualquiera en el plano $xy$ que pase por su centro.
    pide: El momento de inercia axial y el diametral del disco.
    pasos:
      - tipo: reconocer
        pregunta: |
          Para el eje $z$, perpendicular al disco por su centro, ¿qué
          elemento de masa conviene?
        opciones:
          - texto: >-
              Anillos de radio $r$ y anchura $dr$, con
              $dm = \frac{M}{\pi R^{2}}\,2\pi r\,dr$, todos a distancia $r$
              del eje
            correcta: true
            mensaje: |
              Eso es. Todo el anillo está a la misma distancia del eje, y su
              masa crece con $r$ porque su perímetro crece. Por eso los
              anillos de fuera pesan más en el momento.
          - texto: Ninguno; $I_z = M R^{2}$, porque la masa está a distancia $R$
            mensaje: |
              Eso vale para un aro, con toda la masa en el borde. El disco
              tiene masa a todas las distancias entre $0$ y $R$, y sale la
              mitad.
          - texto: Trozos del radio, con $dm = \frac{M}{R}\,dr$
            mensaje: |
              Eso reparte la masa por igual en cada distancia, como en una
              barra. En el disco, a distancia $r$ hay un anillo entero, y su
              masa es proporcional a $r$.

      - tipo: calcular
        titulo: Respecto del eje z
        pregunta: |
          $I_z = k\,M R^{2}$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.003
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              Es el aro: toda la masa a distancia $R$. El disco tiene masa
              también cerca del centro, donde apenas cuenta.
          - valor: '0.25'
            mensaje: |
              Es el momento respecto de un **diámetro**, el del apartado b. El
              eje $z$ es perpendicular al disco, y ahí cada anillo está entero
              a distancia $r$.
          - valor: '0.33333'
            mensaje: |
              Es lo que sale con $dm = (M/R)\,dr$, como si el disco fuera una
              barra radial. A distancia $r$ hay un anillo de perímetro
              $2\pi r$: la masa crece con $r$.
        pista: |
          $\int_0^R r^{2}\,\frac{M}{\pi R^{2}}\,2\pi r\,dr = \frac{2M}{R^{2}}\int_0^R r^{3}\,dr$.
        desarrollo: |
          $$
          I_z = \frac{2M}{R^{2}}\cdot\frac{R^{4}}{4} = \frac{M R^{2}}{2}
          $$

      - tipo: calcular
        titulo: Respecto de un diámetro
        pregunta: |
          $I_x = k\,M R^{2}$ para un eje del plano $xy$ que pasa por el
          centro. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '0.25'
          tolerancia: 0.003
          formato: un número
        distractores:
          - valor: '0.5'
            mensaje: |
              Es el axial. Un diámetro está en el plano del disco: los puntos
              que caen sobre él no aportan nada, y el momento es menor.
          - valor: '0.33333'
            mensaje: |
              Es $M(2R)^{2}/12$: has visto el disco de canto como una barra de
              longitud $2R$. Pero la masa de la «barra» no está repartida por
              igual a lo largo: hay más en el centro que en los bordes.
        pista: |
          Para una figura plana, $I_z = I_x + I_y$ (la suma de $x^{2}$ e
          $y^{2}$ es $r^{2}$). Y por simetría todos los diámetros son iguales.
        desarrollo: |
          $$
          I_x + I_y = I_z = \frac{M R^{2}}{2}
          \quad\text{e}\quad
          I_x = I_y
          \;\Longrightarrow\;
          I_x = \frac{M R^{2}}{4}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: Cada anillo de radio $r$ tiene masa $\frac{2M}{R^{2}}\,r\,dr$ y está entero a distancia $r$ del eje $z$.
          - texto: $I_z = \frac{2M}{R^{2}}\int_0^R r^{3}\,dr = MR^{2}/2$.
          - texto: En el plano, $x^{2} + y^{2} = r^{2}$, así que $I_x + I_y = I_z$; y por simetría $I_x = I_y = MR^{2}/4$.
          - texto: Respecto de un diámetro vale lo mismo que respecto del eje $z$, porque los dos pasan por el centro.
            trampa: true
            mensaje: |
              Pasar por el centro no basta: importa cómo está la masa respecto
              del eje. Respecto de $z$ cada punto está a distancia $r$;
              respecto de un diámetro, solo a su distancia a esa recta, que es
              menor. Sale la mitad.
    resolucion: |
      **a) El eje z.** Con anillos de radio $r$: la densidad superficial es
      $M/(\pi R^{2})$ y cada anillo tiene área $2\pi r\,dr$.

      $$
      I_z = \int_0^R r^{2}\,\frac{M}{\pi R^{2}}\,2\pi r\,dr = \frac{M R^{2}}{2}
      $$

      **b) Un diámetro.** No hace falta integrar otra vez. Para una figura
      plana, $r^{2} = x^{2} + y^{2}$, así que $I_z = I_x + I_y$; y como el disco
      es simétrico, todos los diámetros dan lo mismo:

      $$
      I_x = I_y = \frac{I_z}{2} = \frac{M R^{2}}{4}
      $$

      Coincide con la colección, que en el apartado b escribe $I_z$ aunque se
      refiere al eje del plano. Es la confusión que más cuesta en la
      dinámica: $MR^{2}/2$ para el eje del disco, $MR^{2}/4$ para un diámetro.

  - id: ejma2-col213-el-rectangulo-y-sus-productos
    titulo: El rectángulo, con sus momentos y productos de inercia
    fuente: >-
      Ejercicio 2.13 · Tema 2, «Geometría de masas y superficies» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección lo marca como de nivel
      de examen. La colección publica el resultado, contra el que está
      contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Calcular para el rectángulo (dimensiones $bxh$) de la figura los
      momentos de inercia y los productos de inercia respecto al sistema de
      referencia de la figura $xy$ y $x'y'$.

      <figure>
      <svg viewBox="0 0 260 220" role="img" width="260" height="220" aria-labelledby="ejma2-col213-t ejma2-col213-d">
        <title id="ejma2-col213-t">Rectángulo con dos sistemas de ejes, uno en un vértice y otro en el centro</title>
        <desc id="ejma2-col213-d">Un rectángulo de base b y altura h. Los ejes x e y tienen el origen O en el vértice inferior izquierdo y van por la base y por el lado izquierdo. Los ejes x prima e y prima son paralelos a ellos y tienen el origen en el centro de gravedad G del rectángulo.</desc>
        <defs>
          <marker id="ejma2-col213-f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <rect x="60" y="50" width="100" height="130" fill="var(--d1)" fill-opacity="0.16" stroke="var(--ink)" stroke-width="1.3"/>
        <line x1="60" y1="180" x2="238" y2="180" stroke="var(--ink)" stroke-width="1.2" marker-end="url(#ejma2-col213-f)"/>
        <line x1="60" y1="180" x2="60" y2="18" stroke="var(--ink)" stroke-width="1.2" marker-end="url(#ejma2-col213-f)"/>
        <line x1="110" y1="115" x2="234" y2="115" stroke="var(--ink)" stroke-width="1.2" marker-end="url(#ejma2-col213-f)"/>
        <line x1="110" y1="115" x2="110" y2="18" stroke="var(--ink)" stroke-width="1.2" marker-end="url(#ejma2-col213-f)"/>
        <circle cx="110" cy="115" r="2.6" fill="var(--ink)"/>
        <text x="94" y="131" font-size="11" fill="var(--ink)">G</text>
        <text x="238" y="195" font-size="11" fill="var(--ink)">x</text>
        <text x="236" y="131" font-size="11" fill="var(--ink)">x′</text>
        <text x="46" y="26" font-size="11" fill="var(--ink)">y</text>
        <text x="116" y="26" font-size="11" fill="var(--ink)">y′</text>
        <text x="46" y="196" font-size="11" fill="var(--ink)">O</text>
        <line x1="44" y1="50" x2="44" y2="180" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="40" y1="50" x2="48" y2="50" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="40" y1="180" x2="48" y2="180" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="38" y="119" font-size="11" text-anchor="end" fill="var(--faint)">h</text>
        <line x1="60" y1="198" x2="160" y2="198" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="60" y1="194" x2="60" y2="202" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="160" y1="194" x2="160" y2="202" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="110" y="213" font-size="11" text-anchor="middle" fill="var(--faint)">b</text>
      </svg>
      </figure>
    pide: Los momentos y productos de inercia del rectángulo respecto de xy, en el vértice, y de x′y′, por su centro.
    pasos:
      - tipo: reconocer
        pregunta: |
          Con la convención del curso, ¿qué integrales son $I_x$ y $C_{xy}$?
        opciones:
          - texto: >-
              $I_x = \int y^{2}\,dA$, porque la distancia de un punto al eje
              $x$ es su $y$, y $C_{xy} = \int x\,y\,dA$
            correcta: true
            mensaje: |
              Eso es. El momento respecto del eje $x$ mide lo lejos que está el
              área **de ese eje**, y esa distancia es la coordenada $y$. Aquí
              se trata como área, porque el enunciado da $b$ y $h$ y no una
              masa, como avisa la nota de la colección.
          - texto: $I_x = \int x^{2}\,dA$, porque es el momento «en $x$»
            mensaje: |
              La $x$ del subíndice es el eje, no la coordenada que se eleva al
              cuadrado. Los puntos del eje $x$ tienen $y = 0$ y no aportan
              nada: $I_x = \int y^{2}\,dA$.
          - texto: $C_{xy} = 0$, porque el rectángulo es simétrico
            mensaje: |
              Es simétrico respecto de $x'$ e $y'$, que pasan por $G$. Respecto
              de $x$ e $y$, en el vértice, no: todo el rectángulo está en el
              primer cuadrante, $xy > 0$ en cada punto, y el producto es
              positivo.

      - tipo: calcular
        titulo: El momento respecto de la base
        pregunta: |
          $I_x = k\,b\,h^{3}$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '0.33333'
          tolerancia: 0.002
          formato: un número
        distractores:
          - valor: '0.083333'
            mensaje: |
              Es $1/12$, el del eje por $G$. El eje $x$ va por la base: toda el
              área está a un lado y más lejos.
          - valor: '1'
            mensaje: |
              Es $A\,h^{2}$: toda el área a la altura del lado de arriba. Las
              franjas están a todas las alturas entre $0$ y $h$, y la
              integral de $y^{2}$ da un tercio.
        pista: |
          Franjas horizontales de área $b\,dy$: $I_x = \int_0^h y^{2}\,b\,dy$.
          Por la misma cuenta, $I_y = h\,b^{3}/3$.
        desarrollo: |
          $$
          I_x = \int_0^h y^{2}\,b\,dy = \frac{b\,h^{3}}{3}
          \qquad
          I_y = \int_0^b x^{2}\,h\,dx = \frac{h\,b^{3}}{3}
          $$

      - tipo: calcular
        titulo: El producto de inercia en el vértice
        pregunta: |
          $C_{xy} = k\,b^{2} h^{2}$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '0.25'
          tolerancia: 0.002
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              Nulo solo respecto de ejes de simetría, y $x$ e $y$ no lo son:
              van por dos lados del rectángulo, que queda entero en el primer
              cuadrante.
          - valor: '1'
            mensaje: |
              Es $A \cdot b \cdot h$: has usado $b$ y $h$ como coordenadas de
              $G$. El centro está en $(b/2,\ h/2)$, y Steiner da
              $0 + b\,h \cdot \frac{b}{2}\cdot\frac{h}{2}$.
        pista: |
          La integral se separa: $\int_0^b\int_0^h x\,y\,dy\,dx$. O Steiner
          desde $G$, donde es nulo: $C_{xy} = 0 + A\,x_G\,y_G$.
        desarrollo: |
          $$
          C_{xy} = \int_0^b x\,dx\int_0^h y\,dy = \frac{b^{2}}{2}\cdot\frac{h^{2}}{2} = \frac{b^{2} h^{2}}{4}
          $$

      - tipo: calcular
        titulo: El momento respecto de x prima
        pregunta: |
          $I_{x'} = k\,b\,h^{3}$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '0.083333'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0.58333'
            mensaje: |
              Has sumado $A\,(h/2)^{2}$ al de la base. Steiner va desde $G$
              hacia fuera: $I_x = I_{x'} + A\,y_G^{2}$, así que para bajar a
              $G$ se **resta**.
          - valor: '0.33333'
            mensaje: |
              Es el de la base. El eje $x'$ pasa por $G$, a media altura, y el
              momento por $G$ es el menor de todos los paralelos.
        pista: |
          $I_{x'} = I_x - A\,y_G^{2}$, con $y_G = h/2$.
        desarrollo: |
          $$
          I_{x'} = \frac{b\,h^{3}}{3} - b\,h\left(\frac{h}{2}\right)^{2} = \frac{b\,h^{3}}{12}
          \qquad
          I_{y'} = \frac{h\,b^{3}}{12}
          $$

      - tipo: calcular
        titulo: El producto de inercia por el centro
        pregunta: |
          $C_{x'y'} = k\,b^{2} h^{2}$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0.25'
            mensaje: |
              Es el del vértice. Los ejes $x'$ e $y'$ son ejes de simetría del
              rectángulo: cada punto $(x, y)$ tiene su pareja $(-x, y)$, y sus
              productos se cancelan.
          - valor: '0.5'
            mensaje: |
              Has sumado $A\,x_G\,y_G$ en lugar de restarlo. De Steiner,
              $C_{x'y'} = C_{xy} - A\,x_G\,y_G = \frac{b^{2}h^{2}}{4} - \frac{b^{2}h^{2}}{4}$.
        pista: |
          O por simetría, o con Steiner: $C_{x'y'} = C_{xy} - A\,x_G\,y_G$.
        desarrollo: |
          $$
          C_{x'y'} = \frac{b^{2} h^{2}}{4} - b\,h\cdot\frac{b}{2}\cdot\frac{h}{2} = 0
          $$

          Las dos vías coinciden, y la de la simetría no pide ninguna cuenta.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: $I_x = \int y^{2}\,dA = bh^{3}/3$ e $I_y = \int x^{2}\,dA = hb^{3}/3$.
          - texto: $C_{xy} = \int xy\,dA = b^{2}h^{2}/4$, positivo porque todo el rectángulo está en el primer cuadrante.
          - texto: Restando con Steiner, $I_{x'} = bh^{3}/12$ e $I_{y'} = hb^{3}/12$.
          - texto: $C_{x'y'} = 0$, porque $x'$ e $y'$ son ejes de simetría.
          - texto: $C_{xy} = 0$ también, porque el rectángulo es simétrico.
            trampa: true
            mensaje: |
              La simetría que anula el producto tiene que ser respecto de uno
              de los **ejes** del producto. El rectángulo es simétrico respecto
              de $x'$ e $y'$, no respecto de $x$ e $y$, que van por sus lados.
    resolucion: |
      **Respecto de xy, en el vértice.** Se trata como área, porque se dan $b$
      y $h$ y no una masa.

      $$
      I_x = \int_0^h y^{2}\,b\,dy = \frac{b\,h^{3}}{3}
      \qquad
      I_y = \frac{h\,b^{3}}{3}
      \qquad
      C_{xy} = \int_0^b x\,dx\int_0^h y\,dy = \frac{b^{2} h^{2}}{4}
      $$

      **Respecto de x′y′, por G.** Steiner, restando porque se baja a $G$:

      $$
      I_{x'} = \frac{b\,h^{3}}{3} - b\,h\,\frac{h^{2}}{4} = \frac{b\,h^{3}}{12}
      \qquad
      I_{y'} = \frac{h\,b^{3}}{12}
      \qquad
      C_{x'y'} = \frac{b^{2}h^{2}}{4} - b\,h\,\frac{b}{2}\,\frac{h}{2} = 0
      $$

      Coincide con la colección. El cero de $C_{x'y'}$ lo da también la
      simetría, y el positivo de $C_{xy}$ el signo de $xy$ en el primer
      cuadrante: las dos cosas se pueden saber antes de calcular.

  - id: ejma2-col214-la-region-sobre-la-parabola
    titulo: Los momentos de inercia de la región sobre una parábola
    fuente: >-
      Ejercicio 2.14 · Tema 2, «Geometría de masas y superficies» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección lo marca como de nivel
      de examen. La colección publica el resultado, contra el que está
      contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Calcular para la superficie de la figura los momentos de inercia
      respecto a los ejes $x$ e $y$.

      <figure>
      <svg viewBox="0 0 260 200" role="img" width="260" height="200" aria-labelledby="ejma2-col214-t ejma2-col214-d">
        <title id="ejma2-col214-t">Superficie entre el eje y y la parábola y igual a K por x al cuadrado</title>
        <desc id="ejma2-col214-d">La superficie limitada por el eje y, la recta horizontal y igual a b y la parábola y igual a K por x al cuadrado, que sale del origen y llega al punto de abscisa a y ordenada b. La superficie está por encima de la parábola, a su izquierda.</desc>
        <defs>
          <marker id="ejma2-col214-f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M50 180 L56 179.65 L62 178.6 L68 176.85 L74 174.4 L80 171.25 L86 167.4 L92 162.85 L98 157.6 L104 151.65 L110 145 L116 137.65 L122 129.6 L128 120.85 L134 111.4 L140 101.25 L146 90.4 L152 78.85 L158 66.6 L164 53.65 L170 40 L50 40 Z" fill="var(--d1)" fill-opacity="0.18" stroke="none"/>
        <path d="M50 180 L56 179.65 L62 178.6 L68 176.85 L74 174.4 L80 171.25 L86 167.4 L92 162.85 L98 157.6 L104 151.65 L110 145 L116 137.65 L122 129.6 L128 120.85 L134 111.4 L140 101.25 L146 90.4 L152 78.85 L158 66.6 L164 53.65 L170 40" fill="none" stroke="var(--ink)" stroke-width="1.5"/>
        <line x1="50" y1="40" x2="170" y2="40" stroke="var(--ink)" stroke-width="1.3"/>
        <line x1="50" y1="180" x2="246" y2="180" stroke="var(--ink)" stroke-width="1.2" marker-end="url(#ejma2-col214-f)"/>
        <line x1="50" y1="180" x2="50" y2="12" stroke="var(--ink)" stroke-width="1.2" marker-end="url(#ejma2-col214-f)"/>
        <text x="244" y="195" font-size="11" fill="var(--ink)">x</text>
        <text x="36" y="18" font-size="11" fill="var(--ink)">y</text>
        <text x="150" y="118" font-size="10" fill="var(--ink)">y = Kx²</text>
        <line x1="170" y1="37" x2="170" y2="24" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="50" y1="28" x2="170" y2="28" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="110" y="24" font-size="11" text-anchor="middle" fill="var(--faint)">a</text>
        <line x1="34" y1="40" x2="34" y2="180" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="30" y1="40" x2="38" y2="40" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="30" y1="180" x2="38" y2="180" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="28" y="114" font-size="11" text-anchor="end" fill="var(--faint)">b</text>
      </svg>
      </figure>
    pide: Los momentos de inercia de la superficie respecto de los ejes x e y.
    pasos:
      - tipo: reconocer
        pregunta: |
          La superficie está **por encima** de la parábola. ¿Qué franjas
          conviene usar para cada momento?
        opciones:
          - texto: >-
              Para $I_x$, franjas horizontales de longitud $x(y) = a\sqrt{y/b}$;
              para $I_y$, franjas verticales de altura $b - Kx^{2}$
            correcta: true
            mensaje: |
              Eso es. En una franja horizontal todos los puntos están a la
              misma distancia $y$ del eje $x$; en una vertical, a la misma
              distancia $x$ del eje $y$. Así cada integral es de una sola
              variable.
          - texto: Las mismas del 2.6, franjas verticales de altura $Kx^{2}$
            mensaje: |
              Esa es la región **bajo** la curva, la del 2.6. Aquí la parte
              sombreada es la de encima, entre la curva, el eje $y$ y la recta
              $y = b$. La nota de la colección avisa justo de esto.
          - texto: $I_y = \int x\,dA$, como en el centro de gravedad
            mensaje: |
              $\int x\,dA$ es el momento estático, el que da $x_G$. El de
              inercia lleva la distancia al cuadrado: $I_y = \int x^{2}\,dA$.

      - tipo: calcular
        titulo: El área
        pregunta: |
          $A = k\,a\,b$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '0.66667'
          tolerancia: 0.003
          formato: un número
        distractores:
          - valor: '0.33333'
            mensaje: |
              Es el área **bajo** la parábola. La sombreada es el resto del
              rectángulo $a \times b$: $ab - ab/3$.
        pista: |
          Con $K = b/a^{2}$: $A = \int_0^a (b - Kx^{2})\,dx$.
        desarrollo: |
          $$
          A = a\,b - \frac{K a^{3}}{3} = a\,b - \frac{a\,b}{3} = \frac{2a\,b}{3}
          $$

      - tipo: calcular
        titulo: El momento respecto del eje x
        pregunta: |
          $I_x = k\,a\,b^{3}$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '0.28571'
          tolerancia: 0.002
          formato: un número
        distractores:
          - valor: '0.047619'
            mensaje: |
              Es $1/21$, el de la región **bajo** la parábola. La de la figura
              está arriba, cerca de $y = b$, y por eso su momento respecto del
              eje $x$ es mucho mayor.
          - valor: '0.33333'
            mensaje: |
              Es el rectángulo entero $a \times b$ respecto de su base. A la
              superficie le falta la parte de abajo a la derecha.
        pista: |
          Franjas horizontales: $I_x = \int_0^b y^{2}\,a\sqrt{y/b}\,dy
          = \frac{a}{\sqrt{b}}\int_0^b y^{5/2}\,dy$.
        desarrollo: |
          $$
          I_x = \frac{a}{\sqrt{b}}\cdot\frac{2}{7}\,b^{7/2} = \frac{2a\,b^{3}}{7}
          $$

      - tipo: calcular
        titulo: El momento respecto del eje y
        pregunta: |
          $I_y = k\,b\,a^{3}$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '0.13333'
          tolerancia: 0.002
          formato: un número
        distractores:
          - valor: '0.2'
            mensaje: |
              Es $1/5$, el de la región bajo la parábola, que tiene el área
              lejos del eje $y$. La de la figura la tiene cerca.
          - valor: '0.33333'
            mensaje: |
              Es el rectángulo entero respecto de su lado izquierdo. Falta
              restar la parte bajo la curva, $b\,a^{3}/5$.
        pista: |
          Franjas verticales: $I_y = \int_0^a x^{2}\,(b - Kx^{2})\,dx$.
        desarrollo: |
          $$
          I_y = \frac{b\,a^{3}}{3} - \frac{K a^{5}}{5} = \frac{b\,a^{3}}{3} - \frac{b\,a^{3}}{5} = \frac{2b\,a^{3}}{15}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: La parábola pasa por $(a, b)$, así que $K = b/a^{2}$ y $x(y) = a\sqrt{y/b}$.
          - texto: Con franjas horizontales, $I_x = \int_0^b y^{2}\,x(y)\,dy = 2ab^{3}/7$.
          - texto: Con franjas verticales, $I_y = \int_0^a x^{2}(b - Kx^{2})\,dx = 2ba^{3}/15$.
          - texto: Para $I_x$ vale también una franja vertical, multiplicando su área por el cuadrado de la altura de la curva.
            trampa: true
            mensaje: |
              En una franja vertical los puntos están a alturas distintas,
              desde $Kx^{2}$ hasta $b$: no hay una sola distancia al eje $x$.
              O se integra $y^{2}$ dentro de la franja, o se usan franjas
              horizontales.
    resolucion: |
      **La región.** Es la de encima de la parábola: entre el eje $y$, la
      recta $y = b$ y la curva $y = Kx^{2}$, con $K = b/a^{2}$. Su área es
      $2ab/3$, lo que le falta al rectángulo para ser la región del 2.6.

      **I respecto del eje x**, con franjas horizontales de longitud
      $x(y) = a\sqrt{y/b}$:

      $$
      I_x = \int_0^b y^{2}\,a\sqrt{\frac{y}{b}}\,dy = \frac{2a\,b^{3}}{7}
      $$

      **I respecto del eje y**, con franjas verticales de altura $b - Kx^{2}$:

      $$
      I_y = \int_0^a x^{2}\left(b - \frac{b}{a^{2}}x^{2}\right)dx = \frac{2b\,a^{3}}{15}
      $$

      Coincide con la colección. La comparación que pide su nota: el centro
      de gravedad lleva la distancia a la primera potencia, $\int x\,dA$, y el
      momento de inercia, al cuadrado, $\int x^{2}\,dA$; lo demás —las
      franjas, los límites— se plantea igual.
  - id: ejma2-col215-el-rectangulo-con-ventana
    titulo: Un rectángulo con una ventana, de la base al centro
    fuente: >-
      Ejercicio 2.15 · Tema 2, «Geometría de masas y superficies» · Mecánica
      Aplicada, UPV/EHU, curso 2025-2026. La colección lo marca como de nivel
      de examen. La colección publica el resultado, contra el que está
      contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Calcular para la superficie plana de la figura:

      a. Posición del centro de gravedad respecto al sistema de referencia
      $x'y'$ de la figura.

      b. Momentos de inercia respecto a los ejes $x'$ e $y'$ de la figura.

      c. Momentos de inercia respecto a los ejes $x$ e $y$ que son paralelos a
      los ejes $x'$ e $y'$, y que pasan por el centro de gravedad.

      d. Volumen que se origina al girar la superficie de la figura respecto
      al eje $x'$.

      <figure>
