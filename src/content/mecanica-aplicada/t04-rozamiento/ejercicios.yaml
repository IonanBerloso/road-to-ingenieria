    pide: La fuerza mínima que inicia el movimiento con el cable puesto y con el cable suelto.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué cambia al soltar el cable $AB$?
        opciones:
          - texto: Con cable, D desliza bajo C y hay dos superficies rozando; sin cable, C y D arrancan juntos y solo roza el suelo
            correcta: true
            mensaje: |
              Eso es. Atado, $C$ no puede acompañar a $D$, así que $D$ tiene que
              vencer el rozamiento de la cara de arriba **y** el del suelo. Al
              soltarlo, nada impide que los dos se muevan a la vez, y entonces
              la cara entre ellos no desliza.
          - texto: Nada importante, porque el peso total que aprieta el suelo es el mismo
            mensaje: |
              La normal del suelo sí es la misma, 250 kg de peso en los dos
              casos. Lo que cambia es si la superficie entre $C$ y $D$ desliza
              o no, y ese rozamiento solo se paga cuando desliza.
          - texto: Que sin cable hace falta más fuerza, porque ahora hay que arrastrar también a C
            mensaje: |
              Al revés, y es lo que hace bonito el problema: hace falta
              **menos**. Arrastrar los dos juntos no cuesta rozamiento extra en
              la cara común, porque ahí no hay deslizamiento.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna ecuación: con el cable, **los bloques C y
          D por separado**; sin el cable, **el conjunto**. Con los ejes.
        comprueba:
          - punto: |
              **a) El bloque C: su peso, 981 N; la tensión $T$ hacia la pared;
              y en su cara de abajo, $N_1$ hacia arriba y $F_1$ hacia la
              derecha.**
            porque: |
              D se mueve hacia la derecha por debajo de C y lo arrastra; el
              cable lo retiene.
          - punto: |
              **a) El bloque D: su peso, 1471,5 N; $P$; arriba, $N_1$ y $F_1$
              cambiados de sentido; y en el suelo, $N_2$ hacia arriba y $F_2$
              hacia la izquierda.**
            porque: |
              Lo que D le hace a C, C se lo devuelve; y el suelo se opone a que
              D deslice hacia la derecha.
          - punto: |
              **a) Las dos caras deslizan: $F_1 = \mu N_1$ y $F_2 = \mu N_2$.**
            porque: |
              C está quieto y D se mueve: hay deslizamiento arriba y abajo.
          - punto: |
              **b) El conjunto: los dos pesos, $P$, y en el suelo $N_2$ y
              $F_2 = \mu N_2$.**
            porque: |
              Sin cable, C acompaña a D: la cara común queda dentro y no
              aparece.
