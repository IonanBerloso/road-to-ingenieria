          <marker id="ejma4-col41-f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d1)"/>
          </marker>
          <marker id="ejma4-col41-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <line x1="55" y1="190" x2="275" y2="190" stroke="var(--ink)" stroke-width="1.3"/>
