        <circle cx="43.7" cy="121.2" r="2.4" fill="var(--ink)"/>
        <text x="51.7" y="115.2" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">B</text>
        <circle cx="128.7" cy="99.9" r="2.4" fill="var(--ink)"/>
        <text x="122.7" y="95.9" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">G</text>
        <text x="88" y="164" font-size="9" text-anchor="end" fill="var(--faint)">L</text>
        <line x1="205" y1="244" x2="235" y2="244" stroke="var(--ink)" stroke-width="1" marker-end="url(#dsl-fe)"/>
        <line x1="205" y1="244" x2="205" y2="214" stroke="var(--ink)" stroke-width="1" marker-end="url(#dsl-fe)"/>
        <text x="239" y="247" font-size="9.5" font-style="italic" fill="var(--ink)">x</text>
