      <figcaption>

      El cilindro gira en sentido antihorario y desliza en los dos contactos: cada rozamiento se opone a la velocidad de su punto. Ejes: x hacia la derecha, y hacia arriba; momentos positivos en sentido antihorario.

      </figcaption>
      </figure>

      - **En el centro**, el peso $Mg$ y el momento $M$, en el sentido del
        giro.
      - **En los contactos**, las normales $N_1$ y $N_2$ hacia el centro, a
        $45^{\circ}$ de la vertical, y los rozamientos tangentes. El cilindro
        ya desliza en los dos, así que el rozamiento es cinético y vale
        $\mu N$ desde el principio.
      - **Los sentidos.** Girando en sentido antihorario, el punto de
        contacto 1 baja por su cara y el 2 sube por la suya. Cada rozamiento
        se opone: el de 1, hacia arriba y a la izquierda; el de 2, hacia
        abajo y a la izquierda.

      **2. Incógnitas.** $N_1$, $N_2$ y $M$: tres, para las tres ecuaciones
      del cilindro. Velocidad angular constante es momento total nulo.

      **3. Ecuaciones.** Con $\frac{\sqrt{2}}{2}$ de factor común en las
      componentes, que se simplifica:

      $$
      \sum F_x = \frac{\sqrt{2}}{2}\bigl[N_1 - \mu N_1 - N_2 - \mu N_2\bigr]
      = 0
      $$

      $$
      \sum F_y = \frac{\sqrt{2}}{2}\bigl[N_1 + \mu N_1 + N_2 - \mu N_2\bigr]
      - Mg = 0
      $$

      $$
      \sum M_O = M - \mu N_1 R - \mu N_2 R = 0
      $$

      **4. Resultados.** De la primera, $N_1(1-\mu) = N_2(1+\mu)$; con la
      segunda,

      $$
      N_1 = \frac{\sqrt{2}\,Mg\,(1+\mu)}{2\,(1+\mu^{2})}, \qquad
      N_2 = \frac{\sqrt{2}\,Mg\,(1-\mu)}{2\,(1+\mu^{2})}
      $$

      $$
      M = \mu\,(N_1 + N_2)\,R = \frac{\sqrt{2}\,\mu\,MgR}{1+\mu^{2}}
      $$

      Con $\mu = 0{,}3$: $N_1 = 0{,}8433\,Mg$, $N_2 = 0{,}4541\,Mg$ y
      $M = 0{,}3892\,MgR$. En vectores, el contacto 1 hace
      $0{,}8433\,Mg\,\frac{\sqrt{2}}{2}\left[(1 - 0{,}3)\,\vec{i} +
      (1 + 0{,}3)\,\vec{j}\right] = Mg\,(0{,}417\,\vec{i} +
      0{,}775\,\vec{j})$, y el 2,
      $Mg\,(-0{,}417\,\vec{i} + 0{,}225\,\vec{j})$.

      **5. Comprobación.** Momentos en el contacto 1, que no se han usado.
      Respecto de él, $O$ está a $\frac{\sqrt{2}}{2}R$ a la derecha y el
      contacto 2, a $\sqrt{2}R$ a la derecha y a la misma altura:

      $$
      \sum M_1 = -\frac{\sqrt{2}}{2}R\,Mg + \sqrt{2}R\,\frac{\sqrt{2}}{2}N_2
      - \sqrt{2}R\,\frac{\sqrt{2}}{2}\mu N_2 + M
      = R\,\bigl[-0{,}7071 + 0{,}4541 \cdot 0{,}7 + 0{,}3892\bigr]\,Mg = 0
      $$

      **Lo que dice el resultado.** Las tres expresiones coinciden con las
      publicadas. El giro descompensa los apoyos: el contacto hacia el que
      empuja el rozamiento se lleva casi el doble que el otro. Y el momento
      no es $\mu\,Mg\,R$: la V aprieta más que el peso, porque
      $N_1 + N_2 = \sqrt{2}\,Mg/(1+\mu^{2})$.

  - id: ejma4-col49-la-cuna-que-empuja-un-bloque-contra-la-pared
    titulo: La cuña que sube un bloque apoyado en la pared
    fuente: >-
      Ejercicio 4.9 · Tema 4, «Rozamiento» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. El dato del primer coeficiente aparece impreso como «0,4,4»;
      el resultado publicado se reproduce exactamente con 0,4, y así se dice en
      el desarrollo.
    nivel: practica
    antes:
      idea: |
        Cada pieza se aísla por separado, y lo que una le hace a otra, la otra
        se lo devuelve cambiado de sentido. En cada contacto que desliza, el
        rozamiento vale $\mu N$ y se opone al movimiento de esa pieza
        respecto de la otra.
      formula: |
        La normal a una cara inclinada $\alpha$ sobre la horizontal forma
        $\alpha$ con la vertical, y la cara misma va en la dirección
        $(\cos\alpha;\ -\sin\alpha)$ si baja hacia la derecha. Una pieza sin
        peso también apoya: pasa al suelo lo que recibe de encima.
      reconocer: |
        Antes de plantear se piensa cómo se mueve cada pieza respecto de las
        que toca.
    enunciado: |
      Hallar el valor de $Q$ de modo que el bloque $B$ tenga deslizamiento
      inminente hacia arriba. Se desprecia el peso de $A$. Datos:
      $P = 4000\ \text{kg}*$, $\mu_1 = 0{,}4{,}4$, $\mu_2 = 0{,}3$,
      $\mu_3 = 0{,}2$, $\alpha = 30^{\circ}$.

