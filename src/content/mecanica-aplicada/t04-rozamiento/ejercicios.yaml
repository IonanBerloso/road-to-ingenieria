      - tipo: calcular
        titulo: La tensión del cable
        pregunta: |
          Escribiendo el equilibrio de $A$ con $g = 9{,}81$ m/s², ¿cuánto vale la tensión $T$ del
          cable?
        respuesta:
          tipo: magnitud
          valor: '1015.5 N'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '1132.7 N'
            mensaje: |
              Has tomado la normal entre $A$ y $B$ igual a $P_a$, olvidando que
              el cable descarga el apoyo. La normal es
              $P_a - T\sin 30^{\circ}$, y como depende de $T$, hay que
              despejarla de la propia ecuación.
          - valor: '981 N'
            mensaje: |
              Eso es $\mu_1 P_a$ sin dividir por el coseno. Solo la componente
              horizontal del cable equilibra el rozamiento, así que
              $T\cos 30^{\circ} = \mu_1 N_1$.
        pista: |
          En $A$: horizontal $T\cos 30^{\circ} = \mu_1 N_1$; vertical
          $N_1 = P_a - T\sin 30^{\circ}$. Sustituye una en otra y despeja.
        desarrollo: |
          $$
          T\cos 30^{\circ} = \mu_1\,(P_a - T\sin 30^{\circ})
          $$

          $$
          T\,(0{,}866 + 0{,}2 \cdot 0{,}5) = 0{,}2 \cdot 500 \cdot 9{,}81
          \;\Longrightarrow\;
          T = \frac{981}{0{,}966} = 1015{,}5\ \text{N}
          $$

          Con ella, $N_1 = 4905 - 507{,}8 = 4397{,}2\ \text{N}$.

      - tipo: calcular
        titulo: La fuerza que hace deslizar a B
        pregunta: |
          ¿Cuánto vale la fuerza $F$ mínima?
        respuesta:
          tipo: magnitud
          valor: '5141.6 N'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '5395.5 N'
            mensaje: |
              Has ignorado la componente vertical del cable. Con
              $N_1 = P_a$ salen rozamientos mayores de la cuenta, arriba y
              abajo, y $F$ se va por encima de lo real.
          - valor: '4262.2 N'
            mensaje: |
              Te has dejado el rozamiento que $A$ hace sobre $B$ por arriba.
              $B$ desliza contra dos superficies, no solo contra el suelo.
          - valor: '3822.4 N'
            mensaje: |
              Has puesto en la normal del suelo solo el peso de $B$. El suelo
              soporta también lo que $A$ apoya sobre $B$, o sea $N_1$.
        pista: |
          En $B$: $F = \mu_1 N_1 + \mu_2 N_2$, con $N_2 = N_1 + P_b$. Ojo, $N_1$
          no es $P_a$.
        desarrollo: |
          $$
          N_2 = N_1 + P_b = 4397{,}2 + 9810 = 14207{,}2\ \text{N}
          $$

          $$
          F = \mu_1 N_1 + \mu_2 N_2 = 0{,}2 \cdot 4397{,}2 + 0{,}3 \cdot 14207{,}2
          $$

          $$
          F = 879{,}4 + 4262{,}2 = 5141{,}6\ \text{N}
          $$

          Coincide con el resultado impreso, que está calculado con
          $g = 9{,}81$. Con $g = 9{,}8$ salen 5136 N, un 0,1 % menos.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'El cable tira de A hacia arriba y hacia la izquierda: la normal entre A y B es $N_1 = P_a - T\sin 30^{\circ}$.'
          - texto: B desliza bajo A, así que el rozamiento sobre A vale $\mu_1 N_1$ y lo equilibra $T\cos 30^{\circ}$.
          - texto: De ahí $T = 1015{,}5$ N y $N_1 = 4397{,}2$ N.
          - texto: 'En el suelo, $N_2 = N_1 + P_b = 14207$ N, y $F = \mu_1 N_1 + \mu_2 N_2 = 5141{,}6$ N.'
          - texto: Como el cable está inclinado, también hay que restar su componente horizontal en el equilibrio de B.
            trampa: true
            mensaje: |
              El cable está atado a $A$ y a la pared, no a $B$. Sobre $B$ solo
              actúan su peso, $F$, el suelo y lo que le pasa $A$ por el
              contacto: normal $N_1$ y rozamiento $\mu_1 N_1$.
    resolucion: |
      **1. Sólidos libres.** Los dos bloques por separado. Los pesos, con
      $g = 9{,}81\ \text{m/s}^2$: 4905 N el de $A$ y 9810 N el de $B$.

      <figure class="figura-examen">
      <svg viewBox="0 0 330 190" role="img" width="495" height="285" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">Sólidos libres de los bloques A y B</title>
