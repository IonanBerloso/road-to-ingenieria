        <text x="20" y="20" font-size="11" font-weight="700" fill="var(--ink)">a)</text>
        <text x="260" y="20" font-size="11" font-weight="700" fill="var(--ink)">b)</text>
      </svg>
      <figcaption>

      P = 1000 kg*. a) A punto de deslizar: el rozamiento llega a su techo, μN. b) A punto de volcar: la normal y el rozamiento se van a la arista D. Ejes: x hacia la derecha, y hacia arriba; momentos positivos en sentido antihorario.

      </figcaption>
      </figure>

      - **a) A punto de deslizar.** $Q$, el peso y, en la base, $N$ y el
        rozamiento en su techo, $F_r = \mu N$, hacia la izquierda. La normal
        está en algún punto de la base, a una distancia $d$ de la vertical de
        $G$.
      - **b) A punto de volcar.** Todo el contacto se concentra en la arista
        $D$, y allí van $N$ y $F_r$. El rozamiento vale lo que haga falta,
        sin pasar de su techo.

      **2. Incógnitas.** En a), $Q$, $N$ y $d$; en b), $Q$, $N$ y $F_r$. Tres
      en cada caso, para las tres ecuaciones del bloque.

      **3. Ecuaciones.** En kg*. a), con $F_r = \mu N$:

      $$
      \sum F_y = N - 1000 = 0, \qquad \sum F_x = Q - 0{,}4\,N = 0
      $$

      b), momentos en $D$, donde ni $N$ ni $F_r$ dan momento:

      $$
      \sum M_D = 0{,}5 \cdot 1000 - 1{,}5\,Q = 0, \qquad
      \sum F_x = Q - F_r = 0, \qquad \sum F_y = N - 1000 = 0
      $$

      **4. Resultados.**

      $$
      Q_{\text{desliza}} = 0{,}4 \cdot 1000 = 400\ \text{kg}*, \qquad
      Q_{\text{vuelca}} = \frac{500}{1{,}5} = 333{,}3\ \text{kg}*
      $$

      Gana la menor: con $333$ kg* el bloque **vuelca**. En ese instante el
      suelo le hace, en $D$, $-333{,}3\,\vec{i} + 1000\,\vec{j}\ \text{kg}*$,
      y el rozamiento está por debajo de su techo de 400.

      **5. Comprobación.** Por el otro camino: suponer que desliza y mirar
      dónde tendría que estar la normal. Momentos en $G$, a 1 m del suelo,
      con $Q$ a 0,5 m por encima de $G$:

      $$
      \sum M_G = 1000\,d - 1 \cdot 400 - 0{,}5 \cdot 400 = 0
      \;\Longrightarrow\; d = 0{,}6\ \text{m}
      $$

      La normal tendría que caer a 0,6 m de la vertical de $G$, fuera de la
      base, que solo llega a 0,5 m: el bloque vuelca antes de deslizar.

      **Lo que dice el resultado.** Deslizar cuesta 400 kg* empujes donde
      empujes; volcar cuesta $0{,}5 \cdot 1000 / h_Q$, menos cuanto más arriba.
      Las dos se igualan con $h_Q = 1{,}25$ m: empujando por debajo de esa
      altura, el bloque desliza antes.

  - id: ejma4-col42-la-cuna-sobre-dos-bloques
    titulo: La cuña que hace volcar a dos bloques
    fuente: >-
      Ejercicio 4.2 · Tema 4, «Rozamiento» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección lo marca como teórico-práctico y publica el
      resultado, contra el que está contrastado el desarrollo.
    nivel: practica
    antes:
      idea: |
        En un sistema de varias piezas, cada una se aísla por separado, y lo
        que una le hace a otra, la otra se lo hace a la primera cambiado de
        sentido. Si el sistema es simétrico, basta con estudiar una mitad.
      formula: |
        A punto de volcar, un bloque solo toca el suelo en la arista sobre la
        que gira. Si una recta forma $\theta$ con la vertical, su
        perpendicular forma $\theta$ con la horizontal. Y el momento respecto
        de $P$ de una fuerza $(F_x;\ F_y)$ aplicada en $(x;\ y)$ es

        $$
        M_P = (x - x_P)\,F_y - (y - y_P)\,F_x
        $$
      reconocer: |
        Antes de plantear se mira qué contactos tienen rozamiento y cuáles no:
        eso decide qué fuerzas puede transmitir cada uno.
    enunciado: |
      En el sistema de la figura, la cuña de masa $M$ se apoya sobre los dos
      bloques iguales de masa $M$, base $b$ y altura $h$, de forma que forman
      un sistema simétrico. No existe rozamiento entre la cuña y los bloques,
      mientras que el rozamiento entre bloques y suelo impide el
      deslizamiento. Calcular la relación entre $b$ y $h$ cuando se produce el
      vuelco.

      <figure>
      <svg viewBox="0 0 320 215" role="img" width="320" height="215" aria-labelledby="ejma4-col42-t ejma4-col42-d">
        <title id="ejma4-col42-t">Cuña de 60 grados apoyada sobre las aristas superiores de dos bloques iguales</title>
        <desc id="ejma4-col42-d">Dos bloques rectangulares iguales, de base b y altura h, apoyados sobre un suelo horizontal y separados por un hueco. Entre ellos, una cuña con el vértice hacia abajo y un ángulo de 60 grados en el vértice se apoya sobre las aristas superiores interiores de los dos bloques. El sistema es simétrico respecto de la vertical que pasa por el vértice de la cuña.</desc>
