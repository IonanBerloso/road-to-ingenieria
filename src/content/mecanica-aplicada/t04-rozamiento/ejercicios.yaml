        <circle cx="320" cy="115" r="2.4" fill="var(--ink)"/>
        <text x="314" y="112" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">G</text>
        <text x="20" y="26" font-size="11" font-weight="700" fill="var(--ink)">a)</text>
        <text x="250" y="26" font-size="11" font-weight="700" fill="var(--ink)">b)</text>
      </svg>
      <figcaption>

      P = 500 N. a) A punto de deslizar: el rozamiento llega a su techo, μN. b) A punto de volcar: la normal y el rozamiento se van a la arista delantera. Ejes: x hacia la derecha, y hacia arriba; momentos positivos en sentido antihorario.

      </figcaption>
      </figure>

      - **a) A punto de deslizar.** $Q$, el peso y, en la base, $N$ y el
        rozamiento en su techo, $F_r = \mu_s N$, hacia la izquierda: se
        opone al deslizamiento hacia la derecha. La normal está en algún
        punto de la base, a una distancia $d$ de la vertical de $G$.
      - **b) A punto de volcar.** El bloque solo toca el suelo en la arista
        delantera $E$, y allí van $N$ y $F_r$. El rozamiento ya no tiene por
        qué estar en su techo: vale lo que haga falta.

      **2. Incógnitas.** En a), $Q$, $N$ y la posición $d$ de la normal; en
      b), $Q$, $N$ y $F_r$. Tres en cada caso, para las tres ecuaciones del
      bloque.

      **3. Ecuaciones.** a), con $F_r = \mu_s N$:

      $$
      \sum F_y = N - 500 = 0, \qquad \sum F_x = Q - \mu_s N = 0
      $$

      b), momentos en la arista $E$, donde ni $N$ ni $F_r$ dan momento:

      $$
      \sum M_E = 0{,}2 \cdot 500 - 0{,}8\,Q = 0, \qquad
      \sum F_x = Q - F_r = 0, \qquad \sum F_y = N - 500 = 0
      $$

      **4. Resultados.**

      $$
      Q_{\text{desliza}} = \mu_s \cdot 500 = 150\ \text{N}, \qquad
      Q_{\text{vuelca}} = \frac{0{,}2 \cdot 500}{0{,}8} = 125\ \text{N}
      $$

      Gana la menor: con $Q = 125$ N el bloque **vuelca**. En ese instante el
      suelo le hace, en $E$, $-125\,\vec{i} + 500\,\vec{j}\ \text{N}$, y el
      rozamiento está todavía por debajo de su techo: $125 < 150$ N.

      **5. Comprobación.** Por el otro camino: suponer que desliza y mirar
      dónde tendría que estar la normal. Momentos en $G$, que está a 0,5 m
      del suelo, con $Q$ a 0,3 m por encima de $G$:

      $$
      \sum M_G = 500\,d - 0{,}5 \cdot 150 - 0{,}3 \cdot 150 = 0
      \;\Longrightarrow\; d = 0{,}24\ \text{m}
      $$

      La normal tendría que caer a 0,24 m de la vertical de $G$, fuera de la
      base, que solo llega a 0,2 m. No puede: el bloque vuelca antes de
      deslizar, como salía.

      **Lo que dice el resultado.** Un bloque alto y estrecho, empujado
      arriba, vuelca antes de deslizar. La altura de $Q$ decide: el vuelco
      pide $0{,}2 \cdot 500 / h_Q$, y eso supera los 150 N del deslizamiento
      cuando $h_Q < 0{,}67$ m. Empujado por debajo de esa altura, desliza.

  - id: ejma4-la-resistencia-a-la-rodadura
    titulo: La fuerza que arranca a rodar una rueda
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    antes:
      idea: |
        Para saber si un cuerpo empieza a girar se toman momentos respecto
        del punto sobre el que giraría: las fuerzas que pasan por él no
        cuentan, y la ecuación queda con lo que de verdad decide.
      formula: |
        El rozamiento cumple $F_r \le \mu_s N$. Las longitudes de una misma
        ecuación van en la misma unidad. Y el momento respecto de $P$ de una
        fuerza $(F_x;\ F_y)$ aplicada en $(x;\ y)$ es

        $$
        M_P = (x - x_P)\,F_y - (y - y_P)\,F_x
        $$
      reconocer: |
        Antes de calcular se mira por dónde pasa cada fuerza del contacto, y
        qué pasaría si el contacto fuera un punto exacto.
    enunciado: |
      Una rueda de radio $R = 0{,}25\ \text{m}$ soporta una carga vertical
      total de 200 N sobre un suelo con coeficiente de resistencia a la
      rodadura $\mu_r = 5\ \text{mm}$. Se le aplica en el eje una fuerza
      horizontal $F_t$. Calcular la fuerza que la hace empezar a rodar y el
      coeficiente de rozamiento mínimo para que ruede sin deslizar.
    pide: La fuerza que arranca la rodadura y el rozamiento mínimo.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué hace falta una fuerza finita para que la rueda empiece a
          rodar?
        opciones:
          - texto: Porque la normal se adelanta una distancia μr y su momento se opone al de la fuerza
            correcta: true
            mensaje: |
              Eso es. El contacto es una pequeña superficie, y la resultante
              de la reacción se adelanta hasta $\mu_r$. Tomando momentos en ese
              punto, la carga vertical tiene brazo $\mu_r$ y frena el giro.
          - texto: Porque el rozamiento se opone al giro de la rueda
            mensaje: |
              El rozamiento está aplicado en el contacto, así que respecto de
              ese punto no da momento. Lo que frena la rodadura es que la
              normal no pasa bajo el centro.
          - texto: No hace falta, cualquier fuerza horizontal la hace rodar
            mensaje: |
              Eso pasaría con una rueda y un suelo perfectamente rígidos, que
              tocaran en un solo punto. En la realidad se deforman un poco, y
              la experiencia dice que hace falta una fuerza finita.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna ecuación: **el sólido libre de la
          rueda** a punto de rodar, sin el suelo. Con los ejes y las cotas.
        comprueba:
          - punto: |
              **En el eje C, la carga de 200 N hacia abajo y $F_t$ hacia la
              derecha.**
            porque: |
              Las dos están aplicadas en el centro.
          - punto: |
              **La normal $N$ en un punto A adelantado $\mu_r$ respecto de la
              vertical de C, hacia donde va a rodar.**
            porque: |
              El contacto se aplasta un poco y la resultante de las presiones
              se va hacia delante.
          - punto: |
              **El rozamiento $F_r$ en A, hacia la izquierda.**
            porque: |
              Sin él, $F_t$ arrastraría la rueda deslizando hacia la derecha.
          - punto: |
              **Los brazos respecto de A: $R$ para $F_t$ y $\mu_r$ para la
              carga.**
            porque: |
              Son los de la ecuación de momentos en A.
