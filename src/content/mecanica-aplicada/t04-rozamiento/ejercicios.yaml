    pide: La fuerza horizontal Q que pone el bloque B a punto de subir.
    pasos:
      - tipo: reconocer
        pregunta: |
          $B$ está a punto de subir mientras $A$ avanza hacia la derecha. ¿Hacia
          dónde va el rozamiento sobre $B$ en cada uno de sus dos contactos?
        opciones:
          - texto: En la pared, hacia abajo; en la cara inclinada, hacia abajo y a la derecha, a lo largo de la cara
            correcta: true
            mensaje: |
              Eso es. $B$ sube, así que la pared lo frena hacia abajo. Y
              respecto de $A$, $B$ se mueve hacia arriba y hacia la izquierda a
              lo largo de la cara, luego el rozamiento sobre $B$ va justo al
              revés.
          - texto: Los dos hacia arriba, porque ayudan a sostener el peso
            mensaje: |
              El rozamiento no elige ayudar: se opone al deslizamiento. Como $B$
              sube, los dos contactos lo frenan, y ponerlos hacia arriba da una
              $Q$ mucho menor que la real.
          - texto: En la pared hacia abajo, y en la cara inclinada no hay rozamiento porque A empuja perpendicularmente
            mensaje: |
              La normal es perpendicular a la cara, pero el enunciado da
              $\mu_2$ para ese contacto justamente porque además hay
              rozamiento, y ahí hay deslizamiento relativo.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna ecuación: **el bloque B y la cuña A por
          separado**. Con los ejes y el ángulo de la cara.
