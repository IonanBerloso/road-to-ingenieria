        <text x="233" y="224" font-size="10" fill="var(--ink)">+</text>
      </svg>
      <figcaption>

      Sentidos supuestos: T sobre el disco, subiendo por la tangente; FC hacia la derecha; F, positiva hacia la izquierda. Ejes: x hacia la derecha, y hacia arriba; momentos positivos en sentido antihorario.

      </figcaption>
      </figure>

      - **La barra.** En $A$, $A_x$ y $A_y$. En $G$, que es su punto medio y
        su centro de gravedad, el peso $Mg$, la normal $N$ del disco,
        perpendicular a la barra, y el rozamiento $T$, a lo largo de ella. En
        $G$ hay rodadura: $T$ vale lo que haga falta.
      - **El disco.** Sin masa. En $G$, $N$ —que pasa por su centro $O$— y
        $T$ cambiados de sentido; en $O$, $F$, positiva hacia la izquierda; y
        en el suelo, $N_C$ y $F_C$.

      **2. Incógnitas.** $A_x$, $A_y$, $N$, $T$, $N_C$, $F_C$ y $F$: siete,
      para las seis ecuaciones de las dos piezas. Sobra una, y por eso $F$ no
      tiene un solo valor: los extremos salen de $|F_C| \le f N_C$.

      **3. Ecuaciones.** La barra, momentos en $A$: el rozamiento en $G$ va
      por la propia barra y pasa por $A$:

      $$
      \sum M_A = L\,N - Mg\,L\cos 45^{\circ} = 0
      $$

      El disco, con $u = \frac{\sqrt{2}}{2}(1;\ 1)$ la dirección de la barra:
      $N$ actúa sobre él según $\frac{\sqrt{2}}{2}(1;\ -1)$ y $T$ según $u$.
      Momentos en $O$, donde $N$ y $F$ no dan momento:

      $$
      \sum M_O = -R\,T + R\,F_C = 0
      $$

      $$
      \sum F_x = \frac{N}{\sqrt{2}} + \frac{T}{\sqrt{2}} + F_C - F = 0,
      \qquad
      \sum F_y = -\frac{N}{\sqrt{2}} + \frac{T}{\sqrt{2}} + N_C = 0
      $$

      **4. Resultados.** $N = Mg/\sqrt{2}$ y $F_C = T$, y queda

      $$
      F = \frac{Mg}{2} + T\left(1 + \frac{1}{\sqrt{2}}\right), \qquad
      N_C = \frac{Mg}{2} - \frac{T}{\sqrt{2}}
      $$

      El equilibrio pide $|T| \le f N_C$ con $f = 1/\sqrt{2}$. Con $T > 0$,
      $T \le Mg/(3\sqrt{2})$; con $T < 0$, $T \ge -Mg/\sqrt{2}$. Por tanto

      $$
      -\frac{Mg}{\sqrt{2}} \le F \le \frac{Mg\,(4+\sqrt{2})}{6}
      = 0{,}9024\,Mg
      $$

      En el máximo, el suelo hace sobre el disco
      $Mg\left(\frac{1}{3\sqrt{2}}\,\vec{i} + \frac{1}{3}\,\vec{j}\right)$:
      la normal sigue positiva y el disco, apoyado.

      **5. Comprobación.** Momentos en $A$ para el conjunto, que no se han
      usado. La geometría da $L = (1+\sqrt{2})R$, y el centro del disco y su
      contacto con el suelo quedan a la distancia horizontal $L$ de $A$; $O$,
      a la altura $R$:

      $$
      \sum M_A = -Mg\,\frac{L}{\sqrt{2}} + R\,F + L\,N_C
      $$

      Con $F$ y $N_C$ de arriba, los términos en $Mg$ suman
      $R\left[-\frac{1+\sqrt{2}}{\sqrt{2}} + \frac{1}{2} +
      \frac{1+\sqrt{2}}{2}\right] = 0$ y los términos en $T$,
      $R\left[1 + \frac{1}{\sqrt{2}} - \frac{1+\sqrt{2}}{\sqrt{2}}\right] =
      0$.

      **Lo que dice el resultado.** Coincide con lo publicado. La horquilla
      no es simétrica: cuando el rozamiento del suelo cambia de sentido,
      cambia también la normal $N_C$, y con ella el rozamiento disponible.

  - id: ejma4-col413-el-disco-entre-la-pared-y-la-barra
    titulo: El disco entre una pared y una barra, sostenido por un peso
    fuente: >-
      Ejercicio 4.13 · Tema 4, «Rozamiento» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección lo marca como de nivel de examen. La colección
      publica el resultado, contra el que está contrastado el desarrollo. Que
      el hilo salga de A perpendicular a la barra se lee de la figura, y es lo
      que reproduce el resultado publicado.
    nivel: practica
    antes:
      idea: |
        En un contacto que no desliza, el rozamiento es una incógnita más: vale
        lo que pida el equilibrio. El equilibrio se rompe en el contacto que
        sí puede deslizar, cuando su rozamiento llega a $\mu N$, y puede
        hacerlo en los dos sentidos.
      formula: |
        Un círculo tangente a los dos lados de un ángulo tiene el centro en la
        bisectriz. Las normales en los contactos con un disco pasan por su
        centro. Y el momento respecto de $P$ de una fuerza $(F_x;\ F_y)$
        aplicada en $(x;\ y)$ es

        $$
        M_P = (x - x_P)\,F_y - (y - y_P)\,F_x
        $$
      reconocer: |
        Antes de plantear se mira, contacto a contacto, cuáles pueden deslizar
        y cuáles no.
    enunciado: |
      Un disco de centro $G$, radio $R$ y masa $M$ se encuentra entre una pared
      vertical $OB$ y una barra $OA$ sin masa de longitud $3R$. El coeficiente
      de rozamiento entre disco y barra es $0{,}5$ y entre disco y pared muy
      grande de forma que no hay deslizamiento entre pared y disco. El sistema
      está equilibrado gracias al peso $P$ que tensa el hilo que pasa por las
      poleas $B$ y $C$ hasta el punto $A$. Puede despreciarse el radio y la
      fricción en las poleas. Determinar los límites entre los que debe estar
      $P$ para que el sistema permanezca en reposo (equilibrio).

