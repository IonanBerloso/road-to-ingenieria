              **El bloque B: $P$; en la pared, $N_3$ hacia la izquierda y
              $F_3 = \mu_3 N_3$ hacia abajo.**
            porque: |
              B sube pegado a la pared, y la pared lo frena.
          - punto: |
              **En la cara inclinada de B: $N_2$ perpendicular a ella, hacia
              arriba y a la derecha, y $F_2 = \mu_2 N_2$ a lo largo de ella,
              hacia abajo y a la derecha.**
            porque: |
              Respecto de A, B se mueve subiendo por la cara hacia la
              izquierda; el rozamiento va al revés.
          - punto: |
              **La cuña A: $Q$; $N_2$ y $F_2$ cambiados de sentido; en el
              suelo, $N_1$ hacia arriba y $F_1 = \mu_1 N_1$ hacia la
              izquierda.**
            porque: |
              A avanza hacia la derecha sobre el suelo.
          - punto: |
              **A no tiene peso, pero $N_1$ no es cero.**
            porque: |
              El suelo aguanta lo que B carga sobre la cuña.
