      <figcaption>

      Izquierda, la cuña; derecha, el bloque derecho a punto de volcar sobre E. Ejes: x hacia la derecha, y hacia arriba; momentos positivos en sentido antihorario.

      </figcaption>
      </figure>

      - **La cuña.** Su peso $Mg$ y las dos normales de los bloques. Sin
        rozamiento, cada contacto solo transmite normal, perpendicular a la
        cara de la cuña. Con $60^{\circ}$ en el vértice, cada cara forma
        $30^{\circ}$ con la vertical, y su normal, $30^{\circ}$ con la
        horizontal. Por simetría, las dos valen $N$.
      - **El bloque derecho.** En su arista superior interior $C$, la normal
        de la cuña cambiada de sentido, $N(\cos 30^{\circ};\
        -\sin 30^{\circ})$; su peso $Mg$ en el centro; y en la arista
        exterior $E$, donde se concentra el contacto con el suelo a punto de
        volcar, la normal $N_E$ y el rozamiento $F_r$, hacia dentro.

      **2. Incógnitas.** $N$, $N_E$, $F_r$ y el cociente $b/h$ del vuelco:
      cuatro. La cuña da una ecuación útil, la vertical (la horizontal se
      cumple sola por simetría), y el bloque, tres.

      **3. Ecuaciones.** La cuña:

      $$
      \sum F_y = 2\,N\sin 30^{\circ} - Mg = 0
      $$

      El bloque, con $C$ a $b$ a la izquierda de $E$ y a $h$ por encima, y el
      peso a $b/2$ de $E$:

      $$
      \sum M_E = N\sin 30^{\circ}\,b + Mg\,\frac{b}{2}
      - N\cos 30^{\circ}\,h = 0
      $$

      $$
      \sum F_x = N\cos 30^{\circ} - F_r = 0, \qquad
      \sum F_y = N_E - N\sin 30^{\circ} - Mg = 0
      $$

      **4. Resultados.** De la cuña, $N = Mg$. En los momentos del bloque
      los dos términos que sujetan valen lo mismo, $Mg\,b/2$ cada uno:

      $$
      Mg\,b = Mg\cos 30^{\circ}\,h
      \;\Longrightarrow\;
      \frac{b}{h} = \cos 30^{\circ} = \frac{\sqrt{3}}{2} = 0{,}866
      $$

      $$
      F_r = \frac{\sqrt{3}}{2}Mg, \qquad N_E = \frac{3}{2}Mg
      $$

      Sobre el bloque, en vectores: en $C$,
      $Mg\left(\frac{\sqrt{3}}{2}\,\vec{i} - \frac{1}{2}\,\vec{j}\right)$; en
      $E$, $Mg\left(-\frac{\sqrt{3}}{2}\,\vec{i} + \frac{3}{2}\,\vec{j}\right)$.

      **5. Comprobación.** Momentos del bloque en $C$, que no se han usado.
      El peso está a $b/2$ a la derecha y $h/2$ por debajo; $E$, a $b$ a la
      derecha y $h$ por debajo:

      $$
      \sum M_C = -Mg\,\frac{b}{2} + b\,N_E - h\,F_r
      = Mg\left(-\frac{b}{2} + \frac{3}{2}b - \frac{\sqrt{3}}{2}h\right)
      = Mg\left(b - \frac{\sqrt{3}}{2}h\right) = 0
      $$

      que se cumple con $b/h = \sqrt{3}/2$.

      **Lo que dice el resultado.** El vuelco no depende de $\mu$: en la
      arista $E$ el rozamiento no da momento. Pero el enunciado da por hecho
      que el rozamiento impide deslizar, y eso pide
      $F_r \le \mu N_E$, es decir, $\mu \ge \frac{\sqrt{3}/2}{3/2} =
      \frac{1}{\sqrt{3}} = 0{,}577$. Ni $F_r$ ni $N_E$ dependen de dónde caiga
      la normal: con menos rozamiento, los bloques deslizarían hacia fuera
      fuera cual fuera $b/h$.

  - id: ejma4-col43-los-dos-bloques-y-el-cable
    titulo: Dos bloques apilados, con el de arriba atado y suelto
    fuente: >-
      Ejercicio 4.3 · Tema 4, «Rozamiento» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección publica el resultado en «kg*», pero los dos
      números que da son newtons: el desarrollo lo comprueba y lo dice.
    nivel: practica
    antes:
      idea: |
        Cada bloque se aísla por separado. Entre dos bloques en contacto, la
        normal y el rozamiento que uno le hace al otro, el otro se los
        devuelve cambiados de sentido.
      formula: |
        El rozamiento cumple $F_r \le \mu N$, y llega a $\mu N$ solo en una
        superficie que está a punto de deslizar. El peso de una masa $m$ es
        $m\,g$: en newtons si $m$ va en kg y $g = 9{,}81\ \text{m/s}^2$.
      reconocer: |
        Antes de plantear se piensa qué se mueve con qué, y qué superficies
        tendrían que deslizar para que haya movimiento.
    enunciado: |
      Si el coeficiente de rozamiento entre todas las superficies es
      $\mu = 0{,}3$, calcular la fuerza $P$ mínima necesaria para el inicio del
      movimiento si:

      a. el bloque $C$ está atado al cable $AB$.

      b. se suelta el cable $AB$.

