      </svg>
      <figcaption>

      Sentidos supuestos: T sobre el disco, subiendo por la barra; FE hacia arriba. Ejes: x hacia la derecha, y hacia arriba; momentos positivos en sentido antihorario.

      </figcaption>
      </figure>

      - **La geometría.** El disco es tangente a la pared y a la barra, así
        que su centro $G$ está en la bisectriz del ángulo de $60^{\circ}$, a
        $2R$ de $O$: en $(R;\ \sqrt{3}R)$. El contacto $D$ con la barra cae a
        $\sqrt{3}R$ de $O$, y el contacto $E$ con la pared, a la altura de
        $G$.
      - **La barra.** No tiene masa. En $O$, $O_x$ y $O_y$; en $D$, la normal
        $N$ y el rozamiento $T$ del disco; en $A$, el hilo, que tira con $P$
        perpendicular a la barra.
      - **El disco.** Su peso; en $D$, $N$ y $T$ cambiados de sentido; en
        $E$, $N_E$ y $F_E$. En la pared no hay deslizamiento: $F_E$ es una
        incógnita sin techo. El límite lo pone la barra, con $|T| \le 0{,}5N$.

      **2. Incógnitas.** $O_x$, $O_y$, $N$, $T$, $N_E$, $F_E$ y $P$: siete,
      para las seis ecuaciones de las dos piezas. Sobra una, y por eso $P$ va
      entre dos límites.

      **3. Ecuaciones.** La barra, momentos en $O$; el rozamiento en $D$ va
      por la barra y no da momento:

      $$
      \sum M_O = 3R\,P - \sqrt{3}R\,N = 0
      $$

      El disco, con $N$ según $\left(-\frac{1}{2};\ \frac{\sqrt{3}}{2}\right)$
      y $T$ según la barra, $\left(\frac{\sqrt{3}}{2};\ \frac{1}{2}\right)$.
      Momentos en $G$: las normales y el peso pasan por $G$, y los dos
      rozamientos tienen brazo $R$:

      $$
      \sum M_G = R\,T - R\,F_E = 0
      $$

      $$
      \sum F_x = -\frac{N}{2} + \frac{\sqrt{3}}{2}T + N_E = 0, \qquad
      \sum F_y = \frac{\sqrt{3}}{2}N + \frac{T}{2} + F_E - Mg = 0
      $$

      **4. Resultados.** $N = \sqrt{3}\,P$ y $F_E = T$; la vertical da

      $$
      T = \frac{2Mg - \sqrt{3}N}{3}
      $$

      Con $T \le N/2$, el disco a punto de bajar, sale el mínimo; con
      $T \ge -N/2$, a punto de subir, el máximo:

      $$
      \frac{4Mg}{6+3\sqrt{3}} \le P \le \frac{4Mg}{6-3\sqrt{3}}
      \qquad
      0{,}3573\,Mg \le P \le 4{,}976\,Mg
      $$

      En el mínimo, sobre el disco: en $D$,
      $N = 0{,}6188\,Mg$ y $T = 0{,}3094\,Mg$; en la pared,
      $N_E = 0{,}0415\,Mg$ y $F_E = 0{,}3094\,Mg$. $N_E$ sale positiva en los
      dos extremos: el disco sigue tocando la pared.

      **5. Comprobación.** Momentos en $O$ para el conjunto de barra y disco,
      que no se han usado. Las fuerzas exteriores son el peso, la pared, el
      hilo y $O$; $F_E$ pasa por la pared, a $x = 0$, y no da momento:

      $$
      \sum M_O = -R\,Mg - \sqrt{3}R\,N_E + 3R\,P
      $$

      De la horizontal del disco, $\sqrt{3}N_E = 3P - Mg$, y la suma queda
      $-R\,Mg - R(3P - Mg) + 3R\,P = 0$. Con los números del mínimo:
      $-1 - 1{,}732 \cdot 0{,}0415 + 3 \cdot 0{,}3573 = 0$.

      **Lo que dice el resultado.** Coincide con lo publicado. El intervalo
      es muy ancho, de 0,36 a 4,98 veces el peso: el rozamiento de la pared,
      sin techo, hace casi todo el trabajo de sostener el disco.

  - id: ejma4-col414-los-dos-discos-unidos-por-una-cuerda
    titulo: Dos discos unidos por una cuerda, uno en un plano inclinado
    fuente: >-
      Ejercicio 4.14 · Tema 4, «Rozamiento» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección lo marca como de nivel de examen. La colección
      publica el resultado, contra el que está contrastado el desarrollo.
    nivel: practica
    antes:
      idea: |
        En un sistema de dos cuerpos unidos por una cuerda, cada uno se aísla
        por separado y la cuerda tira de los dos con la misma tensión. Cuando
        hay varios contactos con el mismo coeficiente, el mínimo que sirve es
        el que pide el contacto más exigente.
      formula: |
        En un plano inclinado $\theta$ sobre la horizontal, el peso se
        descompone en $Mg\operatorname{sen}\theta$ a lo largo del plano y
        $Mg\cos\theta$ perpendicular a él. Y el momento respecto de $P$ de una
        fuerza $(F_x;\ F_y)$ aplicada en $(x;\ y)$ es

        $$
        M_P = (x - x_P)\,F_y - (y - y_P)\,F_x
        $$
      reconocer: |
        Antes de plantear se mira por qué punto de cada disco tira la cuerda.
    enunciado: |
      El disco 1 de masa $M$ y radio $2R$ descansa sobre una superficie
      horizontal rugosa y tiene su centro unido a una cuerda, la cual está
      arrollada a la periferia del disco 2 de masa $M$ y radio $R$. Este disco
      2 se apoya sobre un plano rugoso inclinado 60° respecto a la vertical.
      Sobre el disco 1 se aplica un par $P$ a determinar en el sentido indicado
      en la figura. El sistema se encuentra a punto de perder el equilibrio,
      siendo el coeficiente de rozamiento el mismo en ambas superficies de
      contacto. Calcular el valor del coeficiente de rozamiento mínimo
      necesario y el valor del par $P$.

