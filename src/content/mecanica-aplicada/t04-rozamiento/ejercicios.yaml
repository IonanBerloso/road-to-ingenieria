      - tipo: calcular
        titulo: El valor máximo de la fuerza
        pregunta: |
          ¿Cuál es el mayor valor de $F$ que admite el equilibrio, medido en
          unidades de $Mg$?
        respuesta:
          tipo: numero
          valor: '0.902369'
          tolerancia: 0.003
          formato: un número, la fuerza dividida entre Mg
        distractores:
          - valor: '0.5'
            mensaje: |
              Ese es el valor que equilibra el disco **sin** rozamiento en el
              suelo, la mitad de la normal. El rozamiento del suelo empuja en el
              mismo sentido y deja subir a $F$ bastante más.
          - valor: '1.1036'
            mensaje: |
              Has tomado la normal del suelo como $Mg/2$. El propio rozamiento
              en $G$ tiene componente vertical y descarga esa normal, así que
              hay que resolverla junto con el rozamiento, no antes.
        pista: |
          En el disco, sin masa, los momentos en su centro igualan los dos
          rozamientos. Después impón $F_C = f\,N_C$ con el suelo.
        desarrollo: |
          $$
          N = \frac{Mg}{\sqrt{2}}
          \qquad
          F = \frac{Mg}{2} + T\left(1 + \frac{1}{\sqrt{2}}\right)
          \qquad
          N_C = \frac{Mg}{2} - \frac{T}{\sqrt{2}}
          $$

          Con $T = f\,N_C$ y $f = 1/\sqrt{2}$ sale $T = Mg/(3\sqrt{2})$ y

          $$
          F_{\max} = \frac{Mg\,(4 + \sqrt{2})}{6} = 0{,}9024\,Mg
          $$

      - tipo: calcular
        titulo: El valor mínimo de la fuerza
        pregunta: |
          ¿Cuál es el menor valor de $F$, en unidades de $Mg$? Un valor
          negativo significa que la fuerza apunta al otro lado.
        respuesta:
          tipo: numero
          valor: '-0.707107'
          tolerancia: 0.003
          formato: un número con su signo, la fuerza dividida entre Mg
        distractores:
          - valor: '-0.902369'
            mensaje: |
              Has supuesto que el intervalo es simétrico. No lo es: al cambiar
              el sentido del rozamiento cambia también la normal del suelo, y
              con ella el rozamiento máximo disponible.
          - valor: '-0.5'
            mensaje: |
              Eso sale de anular el rozamiento del suelo. Con rozamiento el
              intervalo se ensancha por los dos lados, y por este el margen
              extra vale $Mg/\sqrt{2}$ menos $Mg/2$.
        pista: |
          Ahora el rozamiento del suelo apunta al revés, $T < 0$, y **aumenta**
          la normal $N_C$.
        desarrollo: |
          $$
          T = -\frac{Mg}{\sqrt{2}}
          \qquad\Longrightarrow\qquad
          F_{\min} = \frac{Mg}{2} - \frac{Mg}{\sqrt{2}}\left(1+\frac{1}{\sqrt{2}}\right)
          = -\frac{Mg}{\sqrt{2}}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: 'Momentos en A sobre la barra: la normal en G vale Mg partido por raíz de dos, y no depende de F.'
          - texto: El disco no tiene masa, así que los momentos en su centro obligan a que el rozamiento en G y el del suelo sean iguales.
          - texto: El equilibrio se rompe deslizando en el suelo, y por eso hay dos límites, uno por cada sentido del rozamiento.
          - texto: Como en el suelo el rozamiento vale siempre f por la normal, F queda determinada y no existe intervalo.
            trampa: true
            mensaje: |
              $F_r = f\,N$ solo se cumple **en el límite**. Mientras no hay
              deslizamiento el rozamiento toma el valor que pida el equilibrio,
              y eso es justo lo que produce un intervalo de $F$ en vez de un
              único valor.
    resolucion: |
      **1. Sólidos libres.** La barra y el disco por separado.

      <figure class="figura-examen">
      <svg viewBox="-12 2 400 252" role="img" width="600" height="378" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">Sólidos libres de la barra AB y del disco</title>
