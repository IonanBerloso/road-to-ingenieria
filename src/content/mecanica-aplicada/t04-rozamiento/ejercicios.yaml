      a) La estructura con el cuadrado, como un solo sólido. b) El triángulo, de catetos L; su peso está a L/3 de cada cateto, y VB se supone hacia arriba. c) El tramo de la derecha, cortado por las barras 1, 2 y 3, con los esfuerzos supuestos de tracción. Ejes: x hacia la derecha, y hacia arriba; momentos positivos en sentido antihorario.

      </figcaption>
      </figure>

      - **La estructura.** Las barras y el cuadrado forman un solo sólido,
        articulado en $O$: $O_x$ y $O_y$; el peso $4Mg$, en el centro del
        cuadrado, a $1{,}5L$ de $O$; y a $3L$, el muelle, que mide $L$ con
        longitud natural cero y tira de $D$ con $kL$, y el apoyo liso, que
        empuja $A$ hacia arriba con $N_A$.
      - **El triángulo.** $N_A$ hacia abajo en $A$; su peso $Mg$, a $2L/3$ de
        $B$; en $C$, $F$ y $2Mg$; y en $B$, la guía: la normal $H_B$,
        horizontal, y el rozamiento $V_B$, supuesto hacia arriba.
      - **El tramo de la derecha.** El montante $DA$ con el muelle y el
        apoyo, cortado por las barras 1, 2 y 3, con sus esfuerzos supuestos
        de tracción.

      **2. Incógnitas.** En la estructura, $O_x$, $O_y$, $k$ y $N_A$; en el
      triángulo, $F$, $H_B$ y $V_B$. Siete, para seis ecuaciones: la que
      falta es la condición de la guía, $V_B = \mu H_B$ con la deslizadera a
      punto de bajar y $V_B = -\mu H_B$ a punto de subir. Después, $T_1$,
      $T_2$ y $T_3$, con las tres ecuaciones del tramo cortado.

      **3. Ecuaciones.** La estructura, con momentos en $O$; sus dos
      ecuaciones de fuerzas solo dan $O_x$ y $O_y$:

      $$
      \sum M_O = 3L\,(kL) + 3L\,N_A - 1{,}5L\,(4Mg) = 0
      $$

      El triángulo, con momentos en $B$: $A$ y $C$ están $L$ a la izquierda,
      $C$ además $L$ más abajo, y el peso, $2L/3$ a la izquierda:

      $$
      \sum M_B = L\,N_A + \frac{2L}{3}\,Mg - L\,(2Mg) + L\,F = 0
      $$

      $$
      \sum F_x = F - H_B = 0, \qquad
      \sum F_y = V_B - N_A - Mg + 2Mg = 0
      $$

      **4. Resultados.** De la estructura, $kL + N_A = 2Mg$; del triángulo,
      $F = H_B = \tfrac{4Mg}{3} - N_A$ y $V_B = N_A - Mg$. Con $B$ **a punto
      de bajar**, $V_B = F/2$:

      $$
      N_A - Mg = \frac{1}{2}\left(\frac{4Mg}{3} - N_A\right)
      \;\Longrightarrow\;
      N_A = \frac{10Mg}{9}, \quad kL = \frac{8Mg}{9}, \quad F = \frac{2Mg}{9}
      $$

      Con $B$ **a punto de subir**, $V_B = -F/2$:

      $$
      N_A = \frac{2Mg}{3}, \quad kL = \frac{4Mg}{3}, \quad F = \frac{2Mg}{3}
      $$

      $$
      \frac{8Mg}{9L} \le k \le \frac{4Mg}{3L}
      $$

      $F$ no es libre: para cada $k$ vale $F = kL - 2Mg/3$. La guía hace
      sobre el triángulo $Mg\,(-\tfrac{2}{9}\,\vec{i} + \tfrac{1}{9}\,\vec{j})$
      con $k$ mínima y $Mg\,(-\tfrac{2}{3}\,\vec{i} - \tfrac{1}{3}\,\vec{j})$
      con $k$ máxima, y la articulación $O$ sostiene $2Mg\,\vec{j}$ en los dos
      casos.

      Las barras, con $k = 8Mg/(9L)$. En el tramo cortado, la diagonal va a
      45°; vertical, momentos en $D$ (por donde pasan $T_2$, $T_3$ y $kL$, y
      $N_A$ va por su vertical) y horizontal:

      $$
      \sum F_y = kL + N_A - \frac{T_2}{\sqrt{2}} = 0
      \;\Longrightarrow\;
      T_2 = 2\sqrt{2}\,Mg \;\text{(tracción)}
      $$

      $$
      \sum M_D = -L\,T_1 = 0 \;\Longrightarrow\; T_1 = 0,
      \qquad
      \sum F_x = -T_1 - T_3 - \frac{T_2}{\sqrt{2}} = 0
      \;\Longrightarrow\;
      T_3 = -2Mg \;\text{(compresión)}
      $$

      **5. Comprobación.** Momentos del triángulo en $A$, que no se han usado:
      $B$ está $L$ a la derecha, $C$, $L$ más abajo, y el peso, $L/3$ a la
      derecha; $H_B$, $2Mg$ y $N_A$ no dan momento:

      $$
      \sum M_A = L\,V_B - \frac{L}{3}\,Mg + L\,F = 0
      \qquad\Longrightarrow\qquad
      V_B + F = \frac{Mg}{3}
      $$

      Con $k$ mínima, $Mg/9 + 2Mg/9 = Mg/3$; con $k$ máxima,
      $-Mg/3 + 2Mg/3 = Mg/3$. Y en las barras, el nudo $D$: el montante, que
      en $A$ equilibra a $N_A$, está comprimido con $10Mg/9$ y empuja $D$
      hacia arriba; en vertical, $8Mg/9 + 10Mg/9 - 2\sqrt{2}Mg/\sqrt{2} = 0$.

      **Lo que dice el resultado.** Los límites de $k$, los valores de $F$ y
      los tres esfuerzos coinciden con lo publicado, aunque allí las barras 1
      y 3 van intercambiadas. Los esfuerzos no
      dependen de $k$: solo de que el muelle y el apoyo sumen $2Mg$.

      **Lo que no cuadra.** El enunciado pide los dos límites de $k$ «cuando
      el movimiento de $B$ es inminente hacia abajo», pero solo el inferior
      es así: en el superior la deslizadera está a punto de subir. Y el
      resultado publicado llama 1 a la barra superior y 3 a la inferior, al
      revés que la figura; aquí se sigue la figura.

  - id: ejma4-col420-el-disco-entre-el-plano-y-la-barra
    titulo: El disco entre un plano inclinado y una barra con muelle
    fuente: >-
      Ejercicio 4.20 · Tema 4, «Rozamiento» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección lo marca como de nivel de examen. La colección
      publica el resultado, contra el que está contrastado el desarrollo.
    nivel: practica
    antes:
      idea: |
        Las fuerzas de un contacto se descomponen en normal y rozamiento según
        la superficie que se toca; en un disco, la normal pasa siempre por el
        centro. Con momentos en el centro, de los contactos solo quedan los
        rozamientos.
      formula: |
        En el límite, $F_r = f\,N$. Y el momento respecto de $P$ de una
        fuerza $(F_x;\ F_y)$ aplicada en $(x;\ y)$ es

        $$
        M_P = (x - x_P)\,F_y - (y - y_P)\,F_x
        $$
      reconocer: |
        Antes de plantear se mira qué dice el enunciado de cada contacto: cuál
        va a deslizar y cuál no.
    enunciado: |
      El sistema mecánico de la figura está en equilibrio en la posición
      mostrada con el disco a punto de descender y de deslizar en $B$. El disco
      de masa $M$ y radio $R\sqrt{3}$ mantiene el contacto en todo momento con
      un plano inclinado y con una barra $OA$. La barra $OA$, de masa $3M$ y
      longitud $6R$ está articulada a un punto fijo $O$ y en su extremo $A$ se
      encuentra atada a un muelle ideal (horizontal en la posición mostrada).
      El coeficiente de rozamiento entre superficies es $f = \frac{\sqrt{3}}{2}$.
      Obtener:

      a. Diagramas de sólido libre del disco y de la barra y ecuaciones
      resultantes.

      b. Constante $k$ del muelle y reacciones en los puntos de contacto del
      disco.

