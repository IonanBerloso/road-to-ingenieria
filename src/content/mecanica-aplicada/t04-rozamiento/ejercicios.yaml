        <line x1="65" y1="240" x2="75" y2="240" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="62" y="198" font-size="9.5" text-anchor="end" fill="var(--faint)">2R</text>
        <path d="M232 240 A 30 30 0 0 0 226 222" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <text x="236" y="234" font-size="9" fill="var(--faint)">45°</text>
        <text x="112" y="142" font-size="10" text-anchor="end" fill="var(--ink)">A</text>
        <text x="306" y="146" font-size="10" fill="var(--ink)">C</text>
        <text x="202" y="236" font-size="10" text-anchor="end" fill="var(--ink)">B</text>
