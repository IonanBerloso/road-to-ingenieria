      Pesos con g = 9,81 m/s². El cable solo aparece en A. Ejes: x hacia la derecha, y hacia arriba; momentos positivos en sentido antihorario.

      </figcaption>
      </figure>

      - **El bloque A.** Está quieto, retenido por el cable. $B$ se le escapa
        por debajo hacia la derecha, así que el rozamiento de $B$ sobre $A$
        apunta a la derecha y vale $\mu_1 N_1$. El cable tira hacia arriba y
        hacia la pared, a $30^{\circ}$: además de retener a $A$, lo levanta.
      - **El bloque B.** Su peso, $F$, por arriba $N_1$ y $F_1$ cambiados de
        sentido, y en el suelo $N_2$ y $F_2 = \mu_2 N_2$, hacia la izquierda.
        El cable no actúa sobre $B$.

      **2. Incógnitas.** $T$, $N_1$, $F_1$, $N_2$, $F_2$ y $F$: seis, para las
      dos ecuaciones de fuerzas de cada bloque y las dos condiciones de
      deslizamiento. Los momentos solo dirían dónde caen las normales.

      **3. Ecuaciones.** El bloque $A$:

      $$
      \sum F_x = F_1 - T\cos 30^{\circ} = 0, \qquad
      \sum F_y = N_1 + T\sin 30^{\circ} - 4905 = 0, \qquad
      F_1 = 0{,}2\,N_1
      $$

      El bloque $B$:

      $$
      \sum F_x = F - F_1 - F_2 = 0, \qquad
      \sum F_y = N_2 - N_1 - 9810 = 0, \qquad F_2 = 0{,}3\,N_2
      $$

      **4. Resultados.** Del bloque $A$, sustituyendo $N_1$:

      $$
      T = \frac{0{,}2 \cdot 4905}{\cos 30^{\circ} + 0{,}2\sin 30^{\circ}}
      = \frac{981}{0{,}966} = 1015{,}5\ \text{N}, \qquad
      N_1 = 4905 - 507{,}8 = 4397{,}2\ \text{N}
      $$

      Del bloque $B$:

      $$
      N_2 = 14207{,}2\ \text{N}, \qquad
      F = 0{,}2 \cdot 4397{,}2 + 0{,}3 \cdot 14207{,}2
      = 879{,}4 + 4262{,}2 = 5141{,}6\ \text{N}
      $$

      El cable sobre $A$, en vectores: $-879{,}4\,\vec{i} + 507{,}8\,\vec{j}$
      N.

      **5. Comprobación.** El conjunto $A + B$, que no se ha usado. Sus
      fuerzas exteriores son los dos pesos, $T$, $F$ y el suelo; el contacto
      entre los bloques queda dentro:

      $$
      \sum F_x = 5141{,}6 - 879{,}4 - 4262{,}2 = 0
      $$

      $$
      \sum F_y = 14207{,}2 + 507{,}8 - 4905 - 9810 = 0
      $$

      **Lo que dice el resultado.** Coincide con el valor publicado. La
      inclinación del cable importa: levanta a $A$ en 508 N y aligera los dos
      rozamientos. Con el cable horizontal, $N_1$ sería el peso entero y $F$
      subiría a 5395,5 N.

  - id: ejma4-col45-la-varilla-apoyada-en-la-columna
    titulo: La varilla apoyada en una columna y atada por un extremo
    fuente: >-
      Ejercicio 4.5 · Tema 4, «Rozamiento» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección publica el resultado en símbolos, y el desarrollo
      reproduce las dos fórmulas.
    nivel: practica
    antes:
      idea: |
        Cuando el resultado se pide en función de los datos, se plantea con
        letras hasta el final y los números solo se meten para comprobar. Si
        una de las fuerzas tiene dos incógnitas, los momentos en su punto de
        aplicación la eliminan.
      formula: |
        El brazo de una fuerza respecto de un punto es la distancia
        perpendicular a su línea de acción: si la fuerza forma un ángulo
        $\varphi$ con el segmento de longitud $d$ que la une al punto, el
        brazo es $d\sin\varphi$. Y el rozamiento cumple $F \le \mu N$.
      reconocer: |
        Antes de plantear se mira qué superficie apoya sobre cuál en cada
        contacto.
    enunciado: |
      Una varilla sin peso de longitud total $l$ se apoya en $C$ sobre una
      columna. Su extremo $B$ sujeta con una cuerda atada en $D$ y su otro
      extremo en $A$ va cargado con un peso $P$. Son datos conocidos las
      distancias $a$, $b$ y los ángulos $\alpha$ y $\beta$. Determinar:

      a. La fuerza de la cuerda $BD$.

      b. Valor del coeficiente de rozamiento en $C$ para que se produzca el
      equilibrio.

      <figure>
      <svg viewBox="0 0 350 290" role="img" width="350" height="290" aria-labelledby="ejma4-col45-t ejma4-col45-d">
        <title id="ejma4-col45-t">Varilla apoyada en el extremo de una columna, con un peso en un extremo y una cuerda en el otro</title>
        <desc id="ejma4-col45-d">Una columna vertical apoyada en el suelo por su base D. En su extremo superior C se apoya una varilla inclinada, que baja hacia la izquierda hasta el extremo A y sube hacia la derecha hasta el extremo B. Del extremo A cuelga un peso P. Una cuerda tensa une el extremo B con la base D de la columna. El ángulo alfa se mide en C entre la varilla y la columna, y el ángulo beta en B entre la varilla y la cuerda. La distancia de A a C es a, la de B a C es b, y la longitud total de la varilla es l.</desc>
