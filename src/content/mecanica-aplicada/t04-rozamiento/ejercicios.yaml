            <circle cx="320" cy="115" r="2.4" fill="var(--ink)"/>
            <text x="314" y="112" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">G</text>
            <text x="20" y="26" font-size="11" font-weight="700" fill="var(--ink)">a)</text>
            <text x="250" y="26" font-size="11" font-weight="700" fill="var(--ink)">b)</text>
          </svg>

      - tipo: calcular
        titulo: La fuerza que lo hace deslizar
        pregunta: |
          ¿Qué fuerza $Q$ hace deslizar el bloque?
        respuesta:
          tipo: magnitud
          valor: '150 N'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '1667 N'
            mensaje: |
              Has dividido el peso entre el coeficiente en lugar de
              multiplicarlo. El rozamiento máximo es $\mu_s N = 0{,}3 \cdot 500$.
        pista: |
          Con la fuerza horizontal, $N = P$. Desliza cuando $Q = \mu_s N$.
        desarrollo: |
          $$
          Q_{\text{desliza}} = \mu_s\,P = 0{,}3 \cdot 500 = 150\ \text{N}
          $$

      - tipo: calcular
        titulo: La fuerza que lo hace volcar
        pregunta: |
          Tomando momentos en la arista delantera, ¿qué fuerza $Q$ lo hace
          volcar?
        respuesta:
          tipo: magnitud
          valor: '125 N'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '250 N'
            mensaje: |
              Has usado la base entera, 0,4 m, como brazo del peso. El peso
              está aplicado en el centro de gravedad, a media base de la
              arista: 0,2 m.
          - valor: '100 N'
            mensaje: |
              Has usado la altura del bloque, 1 m, como brazo de $Q$. La fuerza
              está aplicada a 0,8 m del suelo, y ese es su brazo respecto de la
              arista.
        pista: |
          En el vuelco, la normal y el rozamiento se van a la arista y no dan
          momento en ella: $Q \cdot 0{,}8 = P \cdot 0{,}2$.
        desarrollo: |
          $$
          Q_{\text{vuelca}} \cdot 0{,}8 = 500 \cdot 0{,}2
          \;\Longrightarrow\;
          Q_{\text{vuelca}} = 125\ \text{N}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: Para deslizar hace falta vencer el rozamiento máximo, $Q = 0{,}3 \cdot 500 = 150$ N.
          - texto: Para volcar, con la normal y el rozamiento en la arista, $0{,}8Q = 500 \cdot 0{,}2$ y $Q = 125$ N.
          - texto: 'La menor de las dos es 125 N: el bloque vuelca antes de deslizar.'
          - texto: El bloque desliza primero, porque el rozamiento siempre se vence antes que el peso.
            trampa: true
            mensaje: |
              Depende de la geometría. Aquí el bloque es alto y estrecho y se
              empuja arriba: el momento tumba antes de que el rozamiento llegue
              a su techo.
    resolucion: |
      **1. Sólidos libres.** Dos veces el bloque, una por cada manera de
      perder el equilibrio.

      <figure class="figura-examen">
      <svg viewBox="0 0 450 272" role="img" width="675" height="408" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">Sólidos libres del bloque a punto de deslizar y a punto de volcar</title>
        <desc id="dsl-d">Dos veces el bloque solo, sin el suelo. A la izquierda, a punto de deslizar: la fuerza Q horizontal hacia la derecha a 0,8 m del suelo, el peso P de 500 N en el centro de gravedad G, y en la base la normal N hacia arriba y el rozamiento hacia la izquierda, que vale mu por N. A la derecha, a punto de volcar: las mismas fuerzas, pero la normal y el rozamiento están en la arista delantera. Cotas: 0,2 m del peso a la arista y 0,8 m de altura de Q. Ejes x hacia la derecha e y hacia arriba, y momentos positivos en sentido antihorario.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
