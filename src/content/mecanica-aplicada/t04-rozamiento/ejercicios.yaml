      <figcaption>

      Caso c, rodadura. En la rueda, los adelantos μr de las normales están exagerados. Ejes: x hacia la derecha, y hacia arriba; momentos positivos en sentido antihorario.

      </figcaption>
      </figure>

      - **La viga.** $Q$, $P$ y, en cada rueda, la normal hacia arriba y el
        rozamiento hacia la izquierda.
      - **La rueda.** Arriba, la normal $N$ de la viga y el rozamiento $F$
        hacia la derecha; abajo, la normal del suelo, también $N$, y $F$
        hacia la izquierda. La rueda no pesa, así que arriba y abajo valen lo
        mismo. Las normales van adelantadas $\mu_{r,1}$ y $\mu_{r,2}$, los
        coeficientes de resistencia a la rodadura, que son longitudes.
      - **Los otros dos casos** no necesitan dibujo nuevo: en a) la viga
        desliza sobre las ruedas quietas; en b) todo desliza sobre el suelo.

      **2. Incógnitas.** $N_2$, $N_3$, $F_2$, $F_3$ y $Q$: las tres
      ecuaciones de la viga y la de momentos de cada rueda. Las otras
      ecuaciones de la rueda se cumplen solas.

      **3. Ecuaciones.** La viga, despreciando los adelantos, de medio
      milímetro, frente a sus metros:

      $$
      \sum M_2 = 12\,N_3 - 8\,P = 0, \qquad
      \sum M_3 = -12\,N_2 + 4\,P = 0, \qquad
      \sum F_x = Q - F_2 - F_3 = 0
      $$

      Cada rueda, con su carga $N$ y momentos en su centro:

      $$
      \sum M_O = N\,(\mu_{r,1} + \mu_{r,2}) - 2r\,F = 0
      $$

      **4. Resultados.** $N_2 = 4$ kN y $N_3 = 8$ kN. Con todo en metros,
      $\mu_{r,1} = 0{,}0005$, $\mu_{r,2} = 0{,}001$ y $r = 0{,}04$:

      $$
      \frac{F}{N} = \frac{0{,}0015}{0{,}08} = 0{,}01875, \qquad
      F_2 = 75\ \text{N}, \qquad F_3 = 150\ \text{N}
      $$

      $$
      Q_c = 75 + 150 = 225\ \text{N}
      $$

      Los otros dos modos piden mucho más:

      $$
      Q_a = \mu_1 P = 0{,}25 \cdot 12 = 3\ \text{kN}, \qquad
      Q_b = \mu_2 P = 0{,}4 \cdot 12 = 4{,}8\ \text{kN}
      $$

      Gana la rodadura. Sobre la viga, en vectores: en la rueda 2,
      $-75\,\vec{i} + 4000\,\vec{j}$ N; en la 3,
      $-150\,\vec{i} + 8000\,\vec{j}$ N.

      **5. Comprobación.** Las fuerzas verticales de la viga, que no se han
      usado: $4 + 8 - 12 = 0$ kN. Y la hipótesis de que las ruedas ruedan
      sin deslizar: cada contacto pide $F/N = 0{,}019$, muy por debajo de
      $\mu_1 = 0{,}25$ y de $\mu_2 = 0{,}4$. Ninguno desliza, como se había
      supuesto.

      **Lo que dice el resultado.** Con 225 N se mueve una carga de 12 kN:
      menos del 2 %. Rodar es trece veces más barato que deslizar.

      **Lo que no cuadra.** La colección publica «$Q = 225$ kg (caso c)». El
      número es el correcto, pero con $P$ en kN el resultado sale en
      **newtons**: 225 N, que son 23 kg*.

  - id: ejma4-col411-las-dos-barras-y-el-par
    titulo: Las dos barras articuladas y el par que las mantiene
    fuente: >-
      Ejercicio 4.11 · Tema 4, «Rozamiento» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección lo marca como de nivel de examen. Su cota
      inferior sale; la superior lleva un signo cambiado, y el desarrollo lo
      demuestra y publica la correcta.
    nivel: practica
    antes:
      idea: |
        El rozamiento estático cumple una desigualdad, $|F| \le fN$, y su
        sentido no se conoce de antemano: se supone uno, y el signo del
        resultado dice cuál era. Para despejar una fuerza, se toman momentos
        en el punto donde se cortan las demás incógnitas.
      formula: |
        Un par $P$ aplicado a un sólido da el mismo momento respecto de
        cualquier punto. El momento respecto de $Q$ de una fuerza
        $(F_x;\ F_y)$ aplicada en $(x;\ y)$ es

        $$
        M_Q = (x - x_Q)\,F_y - (y - y_Q)\,F_x
        $$
      reconocer: |
        Antes de plantear se piensa hacia dónde se movería el sistema si el
        par fuera muy pequeño, y hacia dónde si fuera muy grande.
    enunciado: |
      Una barra $OA$ de masa $m$ y longitud $2L$ está articulada a un apoyo fijo
      en $O$ y al extremo $A$ de otra barra igual $AB$, apoyada en $B$ sobre un
      suelo rugoso de coeficiente de rozamiento conocido $f$. Calcular entre qué
      valores oscila el valor del par $P$ aplicado en el centro de $AB$, para
      que el sistema esté en equilibrio.

      <figure>
      <svg viewBox="0 0 340 220" role="img" width="340" height="220" aria-labelledby="ejma4-col411-t ejma4-col411-d">
        <title id="ejma4-col411-t">Dos barras iguales articuladas formando un triángulo con el suelo</title>
        <desc id="ejma4-col411-d">Dos barras iguales, cada una de masa m y longitud 2L, forman una uve invertida. La barra OA sale de una articulación fija O en el suelo y sube a 45 grados hasta el vértice A. Desde A, la barra AB baja a 45 grados hasta apoyarse en el suelo en el punto B, que puede deslizar. En el centro de la barra AB se aplica un par P, dibujado en sentido horario.</desc>
