        <line x1="294" y1="142" x2="294" y2="174" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="288" y="150" font-size="10" text-anchor="end" fill="var(--d2-tinta)">V<tspan font-size="7.5" dy="2.5">B</tspan></text>
        <circle cx="70" cy="160" r="2.4" fill="var(--ink)"/>
        <circle cx="90" cy="160" r="2.4" fill="var(--ink)"/>
        <circle cx="260" cy="160" r="2.4" fill="var(--ink)"/>
        <circle cx="280" cy="160" r="2.4" fill="var(--ink)"/>
        <text x="6" y="86" font-size="11" font-weight="700" fill="var(--ink)">k mínima</text>
        <text x="196" y="86" font-size="11" font-weight="700" fill="var(--ink)">k máxima</text>
      </svg>
      <figcaption>

      Con k mínima, la masa, a la derecha del centro, hace rodar el disco hacia la barra: el punto B del disco baja respecto de la barra y el rozamiento sobre el disco va hacia arriba. Con k máxima, la barra empuja el disco hacia la izquierda: B sube y el rozamiento va hacia abajo. Las flechas finas negras son movimientos, no fuerzas.

      </figcaption>
      </figure>

      En cada extremo, $F_A = N_B$ y $N_A = Mg - V_B$:

      $$
      k = \frac{Mg}{6R}: \quad N_A = \frac{5Mg}{6},\ F_A = \frac{Mg}{3}
      \;\Rightarrow\; f_A \ge \frac{2}{5}
      $$

      $$
      k = \frac{Mg}{2R}: \quad N_A = \frac{3Mg}{2},\ F_A = Mg
      \;\Rightarrow\; f_A \ge \frac{2}{3}
      $$

      Con $k$ mínima, el suelo hace sobre el disco
      $Mg\,(\tfrac{1}{3}\,\vec{i} + \tfrac{5}{6}\,\vec{j})$ y la barra,
      $Mg\,(-\tfrac{1}{3}\,\vec{i} + \tfrac{1}{6}\,\vec{j})$; con $k$ máxima,
      $Mg\,(\vec{i} + \tfrac{3}{2}\,\vec{j})$ y
      $Mg\,(-\vec{i} - \tfrac{1}{2}\,\vec{j})$.

      **5. Comprobación.** Los dos sólidos juntos, con momentos en $D$: el
      contacto $B$ desaparece. El peso está $R/2$ a la izquierda de $D$ y $R$
      más arriba, $A$ está $R$ a la izquierda, $E$ está $2R$ más arriba y $F_A$
      va a la altura de $D$:

      $$
      \sum M_D = \frac{R}{2}\,Mg + 2R\,(kR) - R\,N_A = 0
      \qquad\Longrightarrow\qquad
      N_A = \frac{Mg}{2} + 2kR
      $$

      Con $k = Mg/(6R)$ da $Mg/2 + Mg/3 = 5Mg/6$, y con $k = Mg/(2R)$,
      $Mg/2 + Mg = 3Mg/2$: lo mismo que con el disco solo.

      **Lo que dice el resultado.** Los cuatro valores coinciden con lo
      publicado. El intervalo de $k$ va de uno a tres porque el rozamiento en
      $B$ ayuda en los dos sentidos. Y el suelo necesita más rozamiento con el
      muelle más duro: ahí la barra empuja el disco con $N_B = Mg$ y el suelo
      tiene que aguantarlo entero.

  - id: ejma4-col418-el-disco-dentro-de-la-pista-circular
    titulo: El disco con una masa soldada dentro de una pista circular
    fuente: >-
      Ejercicio 4.18 · Tema 4, «Rozamiento» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección lo marca como de nivel de examen. La colección
      publica el resultado, contra el que está contrastado el desarrollo.
    nivel: practica
    antes:
      idea: |
        En un contacto entre dos circunferencias, la normal va por la recta de
        los centros y el rozamiento, por la tangente común. Tomando momentos
        en un punto por el que pasan varias incógnitas, la ecuación se queda
        con pocas.
      formula: |
        El rozamiento cumple $F_r \le \mu_s N$. Y el momento respecto de $P$
        de una fuerza $(F_x;\ F_y)$ aplicada en $(x;\ y)$ es

        $$
        M_P = (x - x_P)\,F_y - (y - y_P)\,F_x
        $$
      reconocer: |
        Antes de plantear se mira, en cada pieza sin masa, en cuántos puntos
        recibe fuerzas.
    enunciado: |
      El sistema mecánico de la figura consta de un disco de radio $R$, sin
      masa, con una partícula de masa $M$ soldada en el punto $M$, y articulado
      en su centro $B$ a una barra $AB$ sin masa. El sistema está situado
      dentro de una pista circular fija de radio $2R$. Si el sistema está en
      equilibrio, calcular:

      a. Coeficiente de rozamiento mínimo necesario para que exista equilibrio.

      b. Fuerza transmitida en la articulación en $B$.

      <figure>
      <svg viewBox="0 0 400 320" role="img" width="400" height="320" aria-labelledby="ma4c418-t ma4c418-d">
