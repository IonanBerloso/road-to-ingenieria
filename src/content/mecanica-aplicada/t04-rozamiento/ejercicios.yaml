      a) La barra. b) El disco de arriba. c) El disco de abajo. Los rozamientos están dibujados con el sentido que sale. El muelle está alargado 3R y tira de D con 3kR. Ejes: x hacia la derecha, y hacia arriba; momentos positivos en sentido antihorario.

      </figcaption>
      </figure>

      - **La barra.** $A_x$ y $A_y$ en $A$; su peso $2Mg$, a $2R$; y en $C$,
        a $3R$, la normal $N_C$ y el rozamiento $F_C$.
      - **El disco de arriba.** Su peso y el muelle, alargado $3R$, que tira
        del centro $D$ con $3kR$ hacia la derecha; en $C$, $N_C$ hacia abajo y
        $F_C$; en $E$, $N_E$ hacia arriba y $F_E$.
      - **El disco de abajo.** Su peso y $F$ en el centro $O$; en $E$, $N_E$
        y $F_E$ con el sentido cambiado; y en $P$, el suelo, con $N_P$ y
        $F_P$.

      **2. Incógnitas.** $A_x$, $A_y$, $N_C$, $F_C$, $N_E$, $F_E$, $N_P$, $F_P$,
      $F$ y $k$: diez, para las nueve ecuaciones de los tres sólidos. La
      décima la da el contacto que se agota primero, a punto de deslizar.

      **3. Ecuaciones.** La barra, con momentos en $A$; $F_C$ va a la altura
      de $A$:

      $$
      \sum M_A = 3R\,N_C - 2R\,(2Mg) = 0, \qquad
      \sum F_x = A_x + F_C = 0, \qquad
      \sum F_y = A_y + N_C - 2Mg = 0
      $$

      El disco de arriba, con momentos en $D$, por donde pasan el peso, el
      muelle y las dos normales; $F_C$ y $F_E$, hacia la izquierda, están $R$
      por encima y $R$ por debajo:

      $$
      \sum M_D = R\,F_C - R\,F_E = 0, \qquad
      \sum F_x = 3kR - F_C - F_E = 0, \qquad
      \sum F_y = N_E - N_C - Mg = 0
      $$

      El disco de abajo, igual, con $F_E$ y $F_P$ hacia la derecha:

      $$
      \sum M_O = R\,F_P - R\,F_E = 0, \qquad
      \sum F_x = F_E + F_P - F = 0, \qquad
      \sum F_y = N_P - N_E - Mg = 0
      $$

      **4. Resultados.**

      $$
      N_C = \frac{4Mg}{3}, \quad N_E = \frac{7Mg}{3}, \quad
      N_P = \frac{10Mg}{3}, \quad F_C = F_E = F_P = \frac{3kR}{2}, \quad
      F = 3kR
      $$

      Los tres contactos piden el mismo rozamiento, pero el techo de cada uno
      es $N/4$: $Mg/3$ en $C$, $7Mg/12$ en $E$ y $5Mg/6$ en $P$. El primero en
      agotarse es el de la normal más pequeña:

      <figure class="figura-examen">
      <svg viewBox="0 66 352 150" role="img" width="528" height="225" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">El techo de rozamiento de cada contacto frente al que hace falta</title>
        <desc id="dsl-d">Tres barras verticales, una por contacto, con la altura del techo de rozamiento, la cuarta parte de la normal: C, un tercio de Mg; E, siete doceavos de Mg; P, cinco sextos de Mg. Una línea a trazos horizontal marca el rozamiento que piden los tres contactos con k máxima, un tercio de Mg: toca justo el techo de C y queda por debajo de los otros dos.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M40 190 V150 H80 V190 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M110 190 V120 H150 V190 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M180 190 V90 H220 V190 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M30 190 H240" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M30 150 H246" fill="none" stroke="var(--ink)" stroke-width="1" stroke-dasharray="4 3"/>
        <text x="60" y="143" font-size="9" text-anchor="middle" fill="var(--faint)">Mg/3</text>
        <text x="130" y="113" font-size="9" text-anchor="middle" fill="var(--faint)">7Mg/12</text>
        <text x="200" y="83" font-size="9" text-anchor="middle" fill="var(--faint)">5Mg/6</text>
        <text x="250" y="147" font-size="9" text-anchor="start" fill="var(--faint)">lo que hace falta</text>
        <text x="250" y="158" font-size="9" text-anchor="start" fill="var(--faint)">con k máxima</text>
        <text x="56" y="206" font-size="11" font-weight="700" fill="var(--ink)">C</text>
        <text x="126" y="206" font-size="11" font-weight="700" fill="var(--ink)">E</text>
        <text x="196" y="206" font-size="11" font-weight="700" fill="var(--ink)">P</text>
      </svg>
      <figcaption>

      Los tres contactos piden el mismo rozamiento, 3kR/2; la línea a trazos es su valor con k máxima, Mg/3. El techo de cada contacto es la cuarta parte de su normal: el más bajo es el de C, que es el primero en agotarse.

      </figcaption>
      </figure>

      $$
      \frac{3kR}{2} \le \frac{Mg}{3}
      \;\Longrightarrow\;
      k_{\max} = \frac{2Mg}{9R},
      \qquad
      F = 3k_{\max}R = \frac{2Mg}{3}
      $$

      En $A$, con $k$ máxima, la articulación hace
      $Mg\,(-\tfrac{1}{3}\,\vec{i} + \tfrac{2}{3}\,\vec{j})$.

      **5. Comprobación.** Los tres sólidos juntos, con momentos en $P$: solo
      cuentan las fuerzas de fuera. $A$ está $3R$ a la izquierda y $4R$ más
      arriba, el peso de la barra $R$ a la izquierda, el muelle a $3R$ de
      altura y $F$ a $R$; los pesos de los discos van por la vertical de $P$:

      $$
      \sum M_P = -4R\,A_x - 3R\,A_y + R\,(2Mg) - 3R\,(3kR) + R\,F
      = \left(\frac{4}{3} - 2 + 2 - 2 + \frac{2}{3}\right)MgR = 0
      $$

      **Lo que dice el resultado.** Los dos valores coinciden con lo
      publicado. Los tres rozamientos son iguales porque cada disco tiene sus
      dos contactos en la vertical del centro; lo que cambia de uno a otro es
      la normal, que crece hacia abajo con el peso de lo que hay encima.

  - id: ejma4-col422-la-viga-con-carga-repartida-y-el-disco
    titulo: La viga con carga repartida y el disco con un par
    fuente: >-
      Ejercicio 4.22 · Tema 4, «Rozamiento» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección lo marca como de nivel de examen. La colección
      publica el resultado, contra el que está contrastado el desarrollo.
    nivel: practica
    antes:
      idea: |
        En un sistema de dos sólidos articulados conviene empezar por el que
        tiene menos incógnitas y pasar al otro lo que se hacen en la
        articulación, con el sentido cambiado. Un par aplicado entra en los
        momentos con su valor, se tomen donde se tomen.
      formula: |
        El rozamiento cumple $F_r \le \mu_s N$. Y el momento respecto de $P$
        de una fuerza $(F_x;\ F_y)$ aplicada en $(x;\ y)$ es

        $$
        M_P = (x - x_P)\,F_y - (y - y_P)\,F_x
        $$
      reconocer: |
        Antes de plantear se mira sobre qué tramo de la viga actúa la carga y
        qué forma tiene.
    enunciado: |
      Se representa el sistema en su límite de equilibrio. Está formado por los
      elementos siguientes:

      - Viga (1): de masa despreciable y longitud $3R$, la cual soporta una
        carga rectangular de valor máximo $3Mg/R$ así como una carga horizontal
        puntual de valor $F$ desconocido. Está atada al tirante $OA$ en su
        extremo $A$ y articulada en $B$ a un disco.
      - Disco (2): de masa $M$ y radio $R$. Está articulado a la barra por su
        punto $B$ y apoyado sobre un plano horizontal (punto $C$). Sobre él,
        está aplicado además un par de valor conocido $P = 3MgR$. Se considera
        el coeficiente de fricción lo suficientemente grande como para asegurar
        que el movimiento se iniciaría con rodadura del disco.

      a. Tensión del cable $OA$, $T_O$.

      b. Reacciones en el punto $C$.

      c. Si el valor del coeficiente de fricción fuera $f = 1/2$, ¿existiría
      primero rodadura o deslizamiento? Justifica la respuesta.

