      <figcaption>

      El plano del disco 2 forma 30° con la horizontal. Sentidos supuestos para F1 y F2. Ejes: x hacia la derecha, y hacia arriba; momentos positivos en sentido antihorario.

      </figcaption>
      </figure>

      - **El disco 1.** Su peso, la cuerda tirando de su centro con $T$
        hacia la polea, el par $P$ y, en el suelo, $N_1$ y el rozamiento
        $F_1$, hacia la izquierda.
      - **El disco 2.** Su peso; la cuerda, arrollada a la periferia y
        paralela al plano, tirando con $T$ hacia arriba desde el punto $S$
        opuesto al contacto $C$; y en $C$, la normal $N_2$ y el rozamiento
        $F_2$, subiendo por el plano.

      **2. Incógnitas.** $T$, $N_2$ y $F_2$ en el disco 2, y $N_1$, $F_1$ y
      $P$ en el disco 1: tres en cada uno, para sus tres ecuaciones. El
      coeficiente mínimo sale después, comparando lo que pide cada contacto.

      **3. Ecuaciones.** El disco 2, a lo largo del plano (hacia arriba),
      perpendicular a él, y momentos en $C$, donde $N_2$ y $F_2$ no dan
      momento; $S$ está a $2R$ de $C$ y el centro, a $R$:

      $$
      \sum F_{\parallel} = T + F_2 - Mg\operatorname{sen}30^{\circ} = 0,
      \qquad
      \sum F_{\perp} = N_2 - Mg\cos 30^{\circ} = 0
      $$

      $$
      \sum M_C = T\,(2R) - Mg\operatorname{sen}30^{\circ}\,R = 0
      $$

      El disco 1, con momentos en su centro:

      $$
      \sum F_x = T - F_1 = 0, \qquad \sum F_y = N_1 - Mg = 0, \qquad
      \sum M_O = P - F_1\,(2R) = 0
      $$

      **4. Resultados.**

      $$
      T = \frac{Mg}{4}, \qquad F_2 = \frac{Mg}{4}, \qquad
      N_2 = \frac{\sqrt{3}}{2}Mg, \qquad
      F_1 = \frac{Mg}{4}, \qquad N_1 = Mg, \qquad P = \frac{MgR}{2}
      $$

      El plano pide $F_2/N_2 = \sqrt{3}/6 = 0{,}2887$ y el suelo,
      $F_1/N_1 = 0{,}25$. Con el mismo coeficiente en los dos, manda el más
      exigente:

      $$
      f_{\min} = \frac{\sqrt{3}}{6} = 0{,}2887
      $$

      Sobre el disco 2, el plano hace
      $Mg\,(0{,}2165\,\vec{i} + 0{,}875\,\vec{j})$ y la cuerda,
      $Mg\,(-0{,}2165\,\vec{i} + 0{,}125\,\vec{j})$.

      **5. Comprobación.** Momentos del disco 2 en su centro, que no se han
      usado. El peso y $N_2$ pasan por él; $T$ y $F_2$ tienen brazo $R$ y
      giran en sentidos opuestos:

      $$
      \sum M_{O_2} = R\,T - R\,F_2 = R\left(\frac{Mg}{4} - \frac{Mg}{4}\right)
      = 0
      $$

      **Lo que dice el resultado.** Coincide con lo publicado. Arrollada en
      la periferia, la cuerda sujeta el disco 2 con la mitad de la fuerza que
      necesitaría atada a su centro, $Mg/2$: el rozamiento del plano pone la
      otra mitad.

  - id: ejma4-col415-el-par-que-hace-rodar-el-disco
    titulo: El par que hace rodar un disco con resistencia a la rodadura
    fuente: >-
      Ejercicio 4.15 · Tema 4, «Rozamiento» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección lo marca como de nivel de examen y anota que es
      uno de sus dos problemas de resistencia a la rodadura. La colección
      publica el resultado, contra el que está contrastado el desarrollo.
    nivel: practica
    antes:
      idea: |
        Un cuerpo sin peso que solo recibe fuerzas en dos puntos está en
        equilibrio cuando las dos son iguales, opuestas y sobre la misma
        recta. En un sistema de barras, cada sólido se aísla y se toman
        momentos donde se juntan más incógnitas.
      formula: |
        El rozamiento cumple $F_r \le \mu_s N$. Y el momento respecto de $P$
        de una fuerza $(F_x;\ F_y)$ aplicada en $(x;\ y)$ es

        $$
        M_P = (x - x_P)\,F_y - (y - y_P)\,F_x
        $$
      reconocer: |
        Antes de plantear se mira en qué unidades viene el dato de rodadura
        y a qué altura recibe el disco la fuerza que lo arrastra.
    enunciado: |
      En el sistema de la figura, la barra $BC$ está sometida al par
      desconocido $M$ y la fuerza conocida $P$ actúa sobre la barra $AC$. Los
      pesos del disco y de las barras son despreciables. Determinar:

      a. Valor del momento $M$ para que el disco comience a rodar, en función
      de $P$ y $R$.

      b. Coeficiente de rozamiento mínimo entre suelo y disco para la rodadura.

      Dato: $\dfrac{\mu_r}{R} = 0{,}04$.

      <figure>
      <svg viewBox="0 0 420 290" role="img" width="420" height="290" aria-labelledby="ma4c415-t ma4c415-d">
