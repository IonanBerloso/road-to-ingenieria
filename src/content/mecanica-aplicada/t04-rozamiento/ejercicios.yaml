      - tipo: calcular
        titulo: La normal del contacto que más carga
        pregunta: |
          Con $\mu = 0{,}3$, un valor nuestro para poner número, ¿cuánto vale
          $N_1$ en unidades de $Mg$? Es el contacto de la izquierda, hacia el
          que el rozamiento empuja al girar en sentido antihorario.
        respuesta:
          tipo: numero
          valor: '0.8433'
          tolerancia: 0.004
          formato: un número, N1 dividido entre Mg
        distractores:
          - valor: '0.7071'
            mensaje: |
              Eso es $Mg/\sqrt{2}$, lo que valdrían las dos normales si no
              hubiera rozamiento. Con rozamiento el giro descompensa los dos
              apoyos y dejan de ser iguales.
          - valor: '0.4541'
            mensaje: |
              Ese es $N_2$, el otro contacto. Al girar en sentido antihorario el
              rozamiento carga más el apoyo de la izquierda y descarga el de la
              derecha.
        pista: |
          Escribe las dos ecuaciones de fuerzas con las normales a 45° y los
          rozamientos tangentes, cada uno opuesto a la velocidad de su punto de
          contacto.
        desarrollo: |
          Proyectando en horizontal y en vertical, con los rozamientos opuestos
          al deslizamiento de cada contacto:

          $$
          N_1(1-\mu) = N_2(1+\mu)
          \qquad
          N_1(1+\mu) + N_2(1-\mu) = \sqrt{2}\,Mg
          $$

          $$
          N_1 = \frac{\sqrt{2}\,Mg\,(1+\mu)}{2(1+\mu^{2})} = 0{,}8433\,Mg
          \qquad
          N_2 = \frac{\sqrt{2}\,Mg\,(1-\mu)}{2(1+\mu^{2})} = 0{,}4541\,Mg
          $$

      - tipo: calcular
        titulo: El momento que mantiene el giro
        pregunta: |
          Con el mismo $\mu = 0{,}3$, ¿cuánto vale el momento $M$ en unidades de
          $MgR$?
        respuesta:
          tipo: numero
          valor: '0.3892'
          tolerancia: 0.004
          formato: un número, M dividido entre MgR
        distractores:
          - valor: '0.4243'
            mensaje: |
              Has usado las normales del caso sin rozamiento,
              $Mg/\sqrt{2}$ cada una. Con rozamiento las normales cambian, y su
              **suma** ya no es $\sqrt{2}\,Mg$.
          - valor: '0.1168'
            mensaje: |
              Has restado los dos rozamientos. Apuntan en sentidos opuestos como
              vectores, pero respecto del centro los dos frenan el giro: sus
              momentos se **suman**.
          - valor: '0.3'
            mensaje: |
              Has tomado la normal total igual a $Mg$. La V reparte el peso en
              dos normales a 45°, y su suma vale más que $Mg$.
        pista: |
          Momentos en el centro: solo los rozamientos dan, los dos con brazo $R$
          y los dos frenando.
        desarrollo: |
          $$
          M = \mu (N_1 + N_2)\,R
          = \mu\,R\,\frac{\sqrt{2}\,Mg\,\bigl[(1+\mu)+(1-\mu)\bigr]}{2(1+\mu^{2})}
          $$

          $$
          M = \frac{\sqrt{2}\,\mu\,MgR}{1+\mu^{2}} = 0{,}3892\,MgR
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'El cilindro desliza en los dos contactos: el rozamiento es cinético y vale $\mu N$ en cada uno.'
          - texto: Cada rozamiento es tangente a su superficie y opuesto a la velocidad del punto de contacto, que con giro antihorario baja por la izquierda y sube por la derecha.
          - texto: De las dos ecuaciones de fuerzas salen $N_1 = \sqrt{2}Mg(1+\mu)/(2(1+\mu^{2}))$ y $N_2$ con $(1-\mu)$.
          - texto: Momentos en el centro, $M = \mu(N_1+N_2)R = \sqrt{2}\,\mu\,MgR/(1+\mu^{2})$.
          - texto: Como el cilindro gira con velocidad constante, no hace falta momento exterior ninguno.
            trampa: true
            mensaje: |
              Velocidad constante significa **aceleración angular nula**, o sea
              momento total nulo, no momento exterior nulo. Los rozamientos
              frenan, así que hace falta un momento exterior que los compense
              exactamente.
    resolucion: |
      **1. Sólido libre.** El cilindro solo.

