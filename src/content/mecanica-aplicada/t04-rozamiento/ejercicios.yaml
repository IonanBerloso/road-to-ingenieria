      </figcaption>
      </figure>
    pide: La tensión del cable, las dos reacciones en C y el coeficiente que haría falta allí.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál es la resultante de la carga repartida y dónde se aplica?
        opciones:
          - texto: 3Mg, aplicadas en el centro del tramo cargado, a 1,5R de A
            correcta: true
            mensaje: |
              Eso es. La carga es uniforme y ocupa un tramo de longitud $R$:
              $q\,R = 3Mg$, con la resultante en el centro de ese tramo.
          - texto: 9Mg, la carga por la longitud entera de la viga
            mensaje: |
              La carga no ocupa los $3R$: la figura la dibuja solo sobre el
              tramo central, de $R$ a $2R$. Multiplicar por la longitud entera
              triplica la resultante.
          - texto: 1,5Mg, la mitad, como en una carga triangular
            mensaje: |
              El enunciado dice carga **rectangular**: es uniforme y su
              resultante es el área del rectángulo, $q\,R$. La mitad sería el
              área de un triángulo.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna ecuación: **la viga y el disco por
          separado**. Con los ejes, el tramo que ocupa la carga y dónde está
          $B$ respecto del centro del disco.
        comprueba:
          - punto: |
              **La viga: $T_O$ y $F$ en $A$, la carga sobre el tramo central y,
              en $B$, $B_x$ y $B_y$.**
            porque: |
              La viga no pesa: solo la tocan el cable, $F$, la carga y la
              articulación.
          - punto: |
              **La resultante de la carga, $3Mg$, a $1{,}5R$ de $A$, sin
              sumarla aparte.**
            porque: |
              Es la misma carga, dicha de otra forma.
          - punto: |
              **El disco: $Mg$ y el par $P$, horario; en $B$, a $R$ a la
              izquierda del centro, $B_x$ y $B_y$ con el sentido cambiado; en
              $C$, $C_x$ y $C_y$.**
            porque: |
              Lo que la viga le hace al disco es lo contrario de lo que el
              disco le hace a la viga.
          - punto: |
              **$C_x$ sin escribir $fC_y$.**
            porque: |
              El disco va a rodar: el rozamiento sale del equilibrio, y luego
              se compara con su techo.
