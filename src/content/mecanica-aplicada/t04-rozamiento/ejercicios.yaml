        <line x1="81" y1="190" x2="91" y2="190" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="78" y="133" font-size="9" text-anchor="end" fill="var(--faint)">1,5 m</text>
      </svg>
      </figure>
    pide: La fuerza que lo hace deslizar, la que lo hace volcar y cuál de las dos ocurre antes.
    pasos:
      - tipo: reconocer
        pregunta: |
          El bloque mide 1 m de base y 2 m de alto, y se empuja a 1,5 m del
          suelo. ¿Cómo puede romperse el equilibrio?
        opciones:
          - texto: Deslizando o volcando sobre la arista D, y hay que calcular las dos fuerzas
            correcta: true
            mensaje: |
              Eso es. Son dos equilibrios límite distintos, cada uno con su
              fuerza, y el que ocurre de verdad es el que pide **menos**
              fuerza. La nota de la colección lo dice: en un sólido prismático
              de altura no despreciable hay que considerar las dos.
          - texto: Solo deslizando, porque la fuerza que se aplica es horizontal
            mensaje: |
              Una fuerza horizontal aplicada en alto también da momento
              respecto de la arista D. Si ese momento supera al del peso, el
              bloque vuelca aunque el rozamiento aguantara.
          - texto: Solo volcando, porque el bloque es más alto que ancho
            mensaje: |
              Ser alto y estrecho hace el vuelco más fácil, pero no lo
              garantiza: depende de a qué altura empujes y de cuánto valga
              $\mu$. Con $\mu$ pequeño se desliza antes por muy alto que sea.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna ecuación: **dos sólidos libres** del
          bloque, uno a punto de deslizar y otro a punto de volcar sobre D.
          Con los ejes y las cotas.
        comprueba:
          - punto: |
              **a) A punto de deslizar: $Q$, $P$ en $G$, y en la base $N$
              hacia arriba y $F_r = \mu N$ hacia la izquierda.**
            porque: |
              El rozamiento se opone al deslizamiento hacia la derecha que
              provocaría $Q$.
          - punto: |
              **b) A punto de volcar: $N$ y $F_r$ en la arista D.**
            porque: |
              Al empezar a girar, el bloque solo toca el suelo en D.
          - punto: |
              **En b), $F_r$ no vale $\mu N$: vale lo que haga falta.**
            porque: |
              Que vuelque no obliga a que deslice a la vez.
          - punto: |
              **Los brazos respecto de D: 0,5 m para $P$ y 1,5 m para $Q$.**
            porque: |
              El peso está a media base de la arista, y $Q$, a la altura a la
              que empuja.
        figura: |
          <svg viewBox="0 0 480 272" role="img" width="480" height="272" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">Sólidos libres del bloque a punto de deslizar y a punto de volcar sobre D</title>
            <desc id="dsl-d">Dos veces el bloque solo, sin el suelo. A la izquierda, a punto de deslizar: la fuerza Q horizontal hacia la derecha a 1,5 m del suelo, el peso P en el centro de gravedad G, y en la base la normal N hacia arriba y el rozamiento hacia la izquierda, que vale mu por N. A la derecha, a punto de volcar: las mismas fuerzas, pero la normal y el rozamiento están en la arista D. Cotas: 0,5 m del peso a la arista y 1,5 m de altura de Q. Ejes x hacia la derecha e y hacia arriba, y momentos positivos en sentido antihorario.</desc>
            <defs>
              <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
              </marker>
              <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
              </marker>
              <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
              </marker>
