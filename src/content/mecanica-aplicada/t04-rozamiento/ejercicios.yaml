    pide: El menor ángulo con la horizontal para el que el bloque sigue en equilibrio.
    pasos:
      - tipo: reconocer
        pregunta: |
          El bloque toca en dos vértices y hay rozamiento en los dos. ¿Hacia
          dónde apuntan los rozamientos cuando el bloque está a punto de
          escurrirse?
        opciones:
          - texto: El del suelo hacia la pared y el de la pared hacia arriba, porque el vértice de abajo se escapa hacia fuera y el de la pared baja
            correcta: true
            mensaje: |
              Eso es. El bloque se abre: el apoyo del suelo se desliza alejándose
              de la pared y el de la pared baja. Cada rozamiento se opone a su
              propio deslizamiento, y los dos hay que ponerlos.
          - texto: Los dos hacia arriba, porque el rozamiento siempre sujeta el peso
            mensaje: |
              El rozamiento se opone al deslizamiento **relativo** de cada
              contacto, no al peso. En el suelo el deslizamiento es horizontal,
              así que ahí el rozamiento es horizontal.
          - texto: Solo hay rozamiento en el suelo, porque en la pared la normal es horizontal y no aprieta
            mensaje: |
              La pared sí aprieta: su normal es horizontal y vale
              $N_2 = \mu N_1$, distinta de cero. Con normal hay rozamiento
              disponible, y aquí es justo el que aguanta parte del peso.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna ecuación: **el sólido libre del bloque**
          en el ángulo límite, sin el suelo ni la pared. Llama A al vértice del
          suelo y B al de la pared.
        comprueba:
          - punto: |
              **El peso $P$ en el centro G del cuadrado.**
            porque: |
              Es el punto medio de la diagonal que sale de A.
          - punto: |
              **En A: $N_1$ hacia arriba y $\mu N_1$ hacia la pared.**
            porque: |
              Ese vértice se escapa alejándose de la pared.
          - punto: |
              **En B: $N_2$ saliendo de la pared y $\mu N_2$ hacia arriba.**
            porque: |
              Ese vértice baja al abrirse el bloque.
          - punto: |
              **Los dos rozamientos en su techo a la vez.**
            porque: |
              Si el bloque se escurre, A y B deslizan juntos.
          - punto: |
              **Respecto de A: G a $\frac{L}{2}(\cos\alpha - \sin\alpha)$ hacia
              la pared, y B a $L\cos\alpha$ hacia la pared y $L\sin\alpha$ de
              altura.**
            porque: |
              Son los brazos de la ecuación de momentos en A.
