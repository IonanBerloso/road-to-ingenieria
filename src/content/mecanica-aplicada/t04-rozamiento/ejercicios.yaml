            porque: |
              No tiene masa: solo actúan las fuerzas de contacto y $F$.
          - punto: |
              **$T$ y $F_C$ con sentidos supuestos, sin escribir $fN$.**
            porque: |
              Hay dos límites, uno por cada sentido del rozamiento en el
              suelo.
          - punto: |
              **La normal $N$ en el disco pasa por O.**
            porque: |
