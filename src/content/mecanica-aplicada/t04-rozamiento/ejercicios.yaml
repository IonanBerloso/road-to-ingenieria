        <text x="46" y="64" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">B</text>
        <text x="4" y="16" font-size="11" font-weight="700" fill="var(--ink)">a)</text>
        <text x="98" y="64" font-size="11" font-weight="700" fill="var(--ink)">C</text>
        <text x="154" y="74" font-size="11" font-weight="700" fill="var(--ink)">D</text>
        <text x="318" y="16" font-size="11" font-weight="700" fill="var(--ink)">b)</text>
        <text x="393" y="48" font-size="11" font-weight="700" fill="var(--ink)">C</text>
        <text x="344" y="104" font-size="11" font-weight="700" fill="var(--ink)">D</text>
        <line x1="20" y1="214" x2="50" y2="214" stroke="var(--ink)" stroke-width="1" marker-end="url(#dsl-fe)"/>
        <line x1="20" y1="214" x2="20" y2="184" stroke="var(--ink)" stroke-width="1" marker-end="url(#dsl-fe)"/>
        <text x="54" y="217" font-size="9.5" font-style="italic" fill="var(--ink)">x</text>
        <text x="16" y="186" font-size="9.5" font-style="italic" text-anchor="end" fill="var(--ink)">y</text>
        <path d="M87.5 205.5 A11 11 0 1 0 67.7 203.8" fill="none" stroke="var(--ink)" stroke-width="1" marker-end="url(#dsl-fe)"/>
        <text x="93" y="192" font-size="10" fill="var(--ink)">+</text>
      </svg>
      <figcaption>

      a) Con el cable, C y D por separado. b) Sin el cable, el conjunto. Ejes: x hacia la derecha, y hacia arriba; momentos positivos en sentido antihorario.

      </figcaption>
      </figure>

      - **a) El bloque C.** Su peso, la tensión $T$ del cable hacia la pared
        y, en la cara de abajo, $N_1$ y $F_1$. $D$ se mueve hacia la derecha
        y arrastra a $C$, así que $F_1$ apunta a la derecha; el cable lo
        retiene.
      - **a) El bloque D.** Su peso, $P$, $N_1$ y $F_1$ cambiados de sentido,
        y en el suelo $N_2$ y $F_2$, hacia la izquierda. Las dos caras
        deslizan: $F_1 = \mu N_1$ y $F_2 = \mu N_2$.
      - **b) El conjunto.** Sin el cable, nada retiene a $C$ y los dos
        arrancan juntos. La cara común queda dentro; solo desliza el suelo,
        $F_2 = \mu N_2$.

      **2. Incógnitas.** a): $T$, $N_1$, $F_1$, $N_2$, $F_2$ y $P$, seis, para
      las dos ecuaciones de fuerzas de cada bloque y las dos condiciones de
      deslizamiento. b): $N_2$, $F_2$ y $P$, tres, para dos ecuaciones y una
      condición. Los momentos solo dirían dónde caen las normales, y no se
      piden.

      **3. Ecuaciones.** a), el bloque $C$:

      $$
      \sum F_x = F_1 - T = 0, \qquad \sum F_y = N_1 - 981 = 0, \qquad
      F_1 = 0{,}3\,N_1
      $$

      El bloque $D$:

      $$
      \sum F_x = P - F_1 - F_2 = 0, \qquad
      \sum F_y = N_2 - N_1 - 1471{,}5 = 0, \qquad F_2 = 0{,}3\,N_2
      $$

      b), el conjunto:

      $$
      \sum F_x = P - F_2 = 0, \qquad \sum F_y = N_2 - 2452{,}5 = 0, \qquad
      F_2 = 0{,}3\,N_2
      $$

      **4. Resultados.** a):

      $$
      N_1 = 981\ \text{N}, \quad F_1 = T = 294{,}3\ \text{N}, \quad
      N_2 = 2452{,}5\ \text{N}, \quad F_2 = 735{,}8\ \text{N}
      $$

      $$
      P = 294{,}3 + 735{,}8 = 1030\ \text{N}
      $$

      b):

      $$
      P = 0{,}3 \cdot 2452{,}5 = 735{,}8\ \text{N} \approx 736\ \text{N}
      $$

      Sobre $D$ en a), el suelo le hace $-735{,}8\,\vec{i} + 2452{,}5\,\vec{j}$
      N y $C$, $-294{,}3\,\vec{i} - 981\,\vec{j}$ N.

      **5. Comprobación.** a), el conjunto con el cable, que no se ha usado:
      las fuerzas exteriores horizontales son $P$, $T$ y $F_2$.

      $$
      \sum F_x = 1030 - 294{,}3 - 735{,}8 = 0
      $$

      b), el bloque $C$ solo: sin cable, su única fuerza horizontal es $F_1$,
      así que $F_1 = 0$. Está por debajo de su techo, $0{,}3 \cdot 981$: la cara
      común no desliza, como se había supuesto.

      **Lo que dice el resultado.** Sin el cable hace falta **menos** fuerza,
      no más: desaparece una de las dos superficies que deslizan, y en la
      cara común el rozamiento ni siquiera hace falta.

      **Lo que no cuadra.** La colección publica «$P = 1030$ kg*» y
      «$P = 736$ kg*». Los números son correctos, pero son **newtons**: en
      kilogramos-fuerza salen 105 y 75. Se ve sin calcular nada, comparando
      con el peso total, 250 kg*: ninguna fuerza de rozamiento con
      $\mu = 0{,}3$ puede valer 1030 kg*, cuatro veces el peso.

  - id: ejma4-col44-el-bloque-sujeto-con-un-cable-inclinado
    titulo: El bloque atado a la pared con un cable inclinado
    fuente: >-
      Ejercicio 4.4 · Tema 4, «Rozamiento» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección publica el resultado, contra el que está
      contrastado el desarrollo.
    nivel: practica
    antes:
      idea: |
        Cada bloque se aísla por separado, y lo que uno le hace al otro por
        el contacto, el otro se lo devuelve cambiado de sentido. Un cable solo
        tira, y siempre a lo largo de sí mismo.
      formula: |
        En una superficie que desliza, $F_r = \mu N$, y la normal no se
        supone: sale del equilibrio vertical. Una fuerza $T$ a $\theta$ sobre
        la horizontal tiene componentes $T\cos\theta$ y $T\sin\theta$. Y
        $1\ \text{kg}* = 9{,}81\ \text{N}$.
      reconocer: |
        Antes de plantear se miran las direcciones de todas las fuerzas sobre
        cada bloque, también las de las fuerzas que no son horizontales.
    enunciado: |
      Un bloque A de peso $P_a = 500\ \text{kg}*$, está apoyado sobre un bloque
      $B$ de peso $P_b = 1.000\ \text{kg}*$ y éste sobre una superficie
      horizontal plana. Si el bloque $A$ está sujeto a la pared vertical
      mediante un cable inclinado un ángulo de $30^{\circ}$, determinar la
      mínima fuerza $F$ horizontal que es necesario aplicar sobre el bloque $B$
      para que deslice. Datos: rozamiento entre $A$ y $B$,
      $\mu_1 = 0{,}2$; rozamiento entre $B$ y suelo, $\mu_2 = 0{,}3$.

