      - tipo: calcular
        titulo: La normal que recibe cada bloque
        pregunta: |
          Del equilibrio vertical de la cuña, ¿cuánto vale la normal $N$ sobre
          cada bloque, en unidades de $Mg$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número, N dividido entre Mg
        distractores:
          - valor: '0.5'
            mensaje: |
              Has repartido el peso de la cuña a medias sin proyectar. La
              normal está inclinada 30° sobre la horizontal: lo que vale $Mg/2$
              es su **componente vertical**, no la normal entera.
          - valor: '0.866'
            mensaje: |
              Has multiplicado por el coseno de 30° en vez de dividir entre el
              seno. De $2N\sin 30^{\circ} = Mg$ sale $N = Mg$.
        pista: |
          La cuña recibe dos normales simétricas, cada una a 30° de la
          horizontal. En vertical, $2N\sin 30^{\circ} = Mg$.
        desarrollo: |
          $$
          2\,N \sin 30^{\circ} = Mg
          \;\Longrightarrow\;
          N = \frac{Mg}{2 \cdot 0{,}5} = Mg
          $$

          Cada bloque recibe una fuerza de módulo $Mg$, con componentes
          $Mg\cos 30^{\circ}$ hacia fuera y $Mg\sin 30^{\circ} = Mg/2$ hacia
          abajo, aplicada en su arista superior interior.

      - tipo: calcular
        titulo: La relación entre la base y la altura
        pregunta: |
          Tomando momentos en la arista exterior del bloque de la derecha,
          ¿cuánto vale $b/h$ en el instante del vuelco?
        respuesta:
          tipo: numero
          valor: '0.86603'
          tolerancia: 0.005
          formato: un número, el cociente b entre h
        distractores:
          - valor: '1.7321'
            mensaje: |
              Te has dejado uno de los dos momentos estabilizadores. Con solo
              el peso del bloque, o con solo la componente vertical de la
              normal, sale $\sqrt{3}$, el doble de lo correcto. Los dos actúan
              a la vez.
          - valor: '0.5774'
            mensaje: |
              Has tomado $N = Mg/2$ en lugar de $N = Mg$. La normal no es medio
              peso de la cuña, porque está inclinada.
          - valor: '0.2887'
            mensaje: |
              Has usado 60° donde va 30°. El ángulo del vértice es 60°, así que
              cada cara forma 30° con la vertical y su normal, 30° con la
              horizontal.
        pista: |
          Vuelcan hacia fuera. Sobre la arista exterior, el momento que tumba
          es $Mg\cos 30^{\circ} \cdot h$; los que sujetan son
          $Mg\sin 30^{\circ} \cdot b$ y el peso propio, $Mg \cdot b/2$.
        desarrollo: |
          $$
          Mg\cos 30^{\circ}\,h = Mg\,\frac{b}{2} + Mg\,\frac{b}{2} = Mg\,b
          $$

          $$
          \frac{b}{h} = \cos 30^{\circ} = \frac{\sqrt{3}}{2} = 0{,}866
          $$

          Los dos momentos estabilizadores valen lo mismo, $Mgb/2$ cada uno, y
          por eso se suman en un $Mgb$ limpio.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Sin rozamiento cuña-bloque, la fuerza de contacto es normal a la cara: forma 30° con la horizontal.'
          - texto: Equilibrio vertical de la cuña, $2N\sin 30^{\circ} = Mg$, así que $N = Mg$.
          - texto: Sobre el bloque derecho, la normal da $Mg\cos 30^{\circ}$ hacia fuera en la arista alta y $Mg/2$ hacia abajo en la arista interior.
          - texto: Momentos en la arista exterior, $Mg\cos 30^{\circ}\,h = Mg\,b/2 + Mg\,b/2$, y de ahí $b/h = \sqrt{3}/2$.
          - texto: El rozamiento con el suelo entra en la ecuación de momentos y por eso hace falta conocer su valor.
            trampa: true
            mensaje: |
              El rozamiento está aplicado en la base, y en el vuelco toda la
              base se concentra en la arista exterior: ahí ni la normal ni el
              rozamiento dan momento. Por eso el resultado no contiene $\mu$,
              y por eso el enunciado solo dice que impide el deslizamiento.
    resolucion: |
      **1. Sólidos libres.** La cuña y el bloque de la derecha; el de la
      izquierda es su simétrico.

