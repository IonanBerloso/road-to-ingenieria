      a) El disco, con la partícula en M, el centro de la pista. b) La barra AB, que solo recibe fuerzas en sus extremos: las dos van por la barra. M, B y C están en línea, y la tangente en C es paralela a AB. Ft está dibujado con el sentido que sale. Ejes: x hacia la derecha, y hacia arriba; momentos positivos en sentido antihorario.

      </figcaption>
      </figure>

      - **La barra AB.** No pesa y solo la tocan en sus extremos: recibe en
        $A$ y en $B$ dos fuerzas iguales y opuestas, de módulo $S$, en la
        dirección de la barra.
      - **El disco.** Lo único que pesa es la partícula: $Mg$ en el punto
        opuesto a $C$, que cae en el centro $O$ de la pista. En $B$, la barra
        lo empuja con $S$ en la dirección $AB$; en $C$, la pista, con la
        normal $N$ hacia $O$ y el rozamiento $F_t$ por la tangente.
      - **La geometría.** El disco toca la pista por dentro, así que $B$ está
        a $R$ de $O$, y $O$, $B$ y $C$ están en línea. Ese radio forma 60° con
        la vertical y la barra, 30°: la barra es perpendicular al radio y
        paralela a la tangente en $C$.

      **2. Incógnitas.** $S$, $N$ y $F_t$: tres, para las tres ecuaciones del
      disco. La barra no añade ninguna: solo dice la dirección de $S$.

      **3. Ecuaciones.** Momentos en $B$, por donde pasan $S$ y $N$: la
      partícula está $\sqrt{3}R/2$ a la izquierda de $B$, y $F_t$, tangente
      al disco, tiene brazo $R$:

      $$
      \sum M_B = \frac{\sqrt{3}}{2}R\,Mg - R\,F_t = 0
      $$

      Las fuerzas, a lo largo de la barra (hacia arriba y a la derecha) y a
      lo largo del radio (hacia $O$). El peso forma 30° con la barra y 60°
      con el radio:

      $$
      \sum F_{\parallel} = S - F_t - Mg\cos 30^{\circ} = 0, \qquad
      \sum F_{\perp} = N - Mg\operatorname{sen}30^{\circ} = 0
      $$

      **4. Resultados.**

      $$
      F_t = \frac{\sqrt{3}}{2}Mg, \qquad S = \sqrt{3}\,Mg, \qquad
      N = \frac{Mg}{2}
      $$

      $$
      f \ge \frac{F_t}{N} = \sqrt{3} = 1{,}732
      $$

      En $B$, la barra hace sobre el disco
      $Mg\,(\tfrac{\sqrt{3}}{2}\,\vec{i} + \tfrac{3}{2}\,\vec{j})$, y el disco
      sobre la barra, lo contrario:
      $\vec{R}_B = -\tfrac{\sqrt{3}}{2}Mg\,\vec{i} - \tfrac{3}{2}Mg\,\vec{j}$,
      que es como lo publica el resultado. La pista hace sobre el disco
      $Mg\,(-\tfrac{\sqrt{3}}{2}\,\vec{i} - \tfrac{1}{2}\,\vec{j})$.

      **5. Comprobación.** Momentos del disco en $O$, el centro de la pista,
      por donde pasan el peso y $N$. La barra es perpendicular a $OB$, así
      que $S$ tiene brazo $R$; y $F_t$ es tangente a la pista, con brazo
      $2R$:

      $$
      \sum M_O = R\,S - 2R\,F_t = \sqrt{3}\,MgR - 2R\,\frac{\sqrt{3}}{2}Mg = 0
      $$

      **Lo que dice el resultado.** Los dos apartados coinciden con lo
      publicado. El coeficiente es muy alto porque la partícula queda lejos
      de la vertical de $B$ y todo su momento lo aguanta el rozamiento en
      $C$. Si en $A$ la barra solo apoya en la pista, allí $S$ forma 30° con
      la normal y pide $\tan 30^{\circ} = 0{,}577$, mucho menos: el mínimo
      del sistema sigue siendo $\sqrt{3}$.

  - id: ejma4-col419-la-celosia-el-triangulo-y-la-deslizadera
    titulo: La celosía, el triángulo y la deslizadera con rozamiento
    fuente: >-
      Ejercicio 4.19 · Tema 4, «Rozamiento» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección lo marca como de nivel de examen. Los dos límites
      de k coinciden con el resultado publicado; en el apartado b, el resultado
      publicado intercambia las barras 1 y 3 respecto de la figura, y aquí se
      sigue la figura.
    nivel: practica
    antes:
      idea: |
        Una estructura de barras con un sólido rígido dentro se puede aislar
        entera, como un solo sólido; los esfuerzos de las barras salen
        después, cortándola. Un rozamiento que no está en el límite puede ir
        en los dos sentidos, y cada extremo de un intervalo es uno de ellos.
      formula: |
        El rozamiento cumple $|F_r| \le \mu N$. Y el momento respecto de $P$
        de una fuerza $(F_x;\ F_y)$ aplicada en $(x;\ y)$ es

        $$
        M_P = (x - x_P)\,F_y - (y - y_P)\,F_x
        $$
      reconocer: |
        Antes de plantear se mira qué se puede aislar como un solo sólido y
        dónde tiene sus apoyos.
    enunciado: |
      El sistema mecánico de la figura está en equilibrio en la posición
      mostrada. El cuadrado de masa $4M$ y lado $L$ está articulado a varias
      barras de masa despreciable formando dos estructuras simétricas. En el
      punto $O$, se articulan a un punto fijo y en $A$ se apoyan sin rozamiento
      a un triángulo de masa $M$. Por otra parte, en $D$, la estructura está
      unida a un muelle ideal $(L_0 = 0)$ de constante elástica $k$
      desconocida. El triángulo inferior está articulado en $B$ a una
      deslizadera que se mueve sobre una guía vertical con un coeficiente de
      fricción entre superficies $\mu = 1/2$. En $C$ se aplican las fuerzas
      indicadas, siendo $F$ desconocida. Cuando el movimiento de $B$ es
      inminente hacia abajo, calcular:

      a. Valores límite entre los que oscila $k$ para el equilibrio y valor de
      $F$ en ambos casos.

      b. Tomando el valor inferior de $k$, calcular las fuerzas internas en las
      barras $1-2-3$, indicando si son de tracción o de compresión.

