        <desc id="ejma4-col44-d">Una pared vertical a la izquierda y un suelo horizontal. Sobre el suelo, un bloque B; encima de él, un bloque A más pequeño. Un cable recto une la pared con la esquina superior izquierda de A, formando un ángulo alfa de 30 grados con la horizontal. Una fuerza F horizontal empuja el bloque B hacia la derecha.</desc>
