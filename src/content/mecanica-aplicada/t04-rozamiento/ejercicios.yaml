      <figcaption>

      La cuerda sale del **centro** del disco 1, horizontal, pasa por la polea
      y baja **paralela al plano** hasta enrollarse en la periferia del disco
      2.

      </figcaption>
      </figure>
    pide: La tensión de la cuerda, el coeficiente de rozamiento mínimo y el par P.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué brazo tiene la tensión de la cuerda respecto del punto de
          contacto del disco 2 con el plano?
        opciones:
          - texto: 2R, porque la cuerda es paralela al plano y sale por el punto del disco más alejado de él
            correcta: true
            mensaje: |
              Eso es. Tomando momentos en el contacto, la tensión tiene brazo
              $2R$ y el peso, solo su componente por el plano, brazo $R$.
          - texto: R, porque la cuerda tira del disco con el radio como brazo
            mensaje: |
              La cuerda no pasa por el centro: está arrollada a la periferia y
              sale por el lado opuesto al contacto. Del contacto al punto por
              donde sale hay un diámetro entero, $2R$.
          - texto: Ninguno, porque la tensión pasa por el centro del disco 2
            mensaje: |
              Aunque pasara por el centro, respecto del contacto tendría brazo
              $R$, no cero. Y aquí ni eso: está **arrollada** y sale por el punto
              del disco más alejado del plano, a $2R$ del contacto.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna ecuación: **los dos discos por
          separado**. Con los ejes y la distancia del contacto del disco 2 al
          punto por donde sale la cuerda.
        comprueba:
          - punto: |
              **El disco 1: $Mg$, la cuerda tirando de su centro con $T$ hacia
              la polea, el par $P$ y, en el suelo, $N_1$ y $F_1$.**
            porque: |
              La cuerda está atada al centro: no da momento respecto de él.
          - punto: |
              **El disco 2: $Mg$; la cuerda, paralela al plano, tirando hacia
              arriba desde el punto S opuesto al contacto C; y en C, $N_2$
              perpendicular al plano y $F_2$ a lo largo de él.**
            porque: |
              La cuerda está arrollada a la periferia y sale por el lado más
              alejado del plano.
          - punto: |
              **De C a S hay $2R$, y la cuerda es perpendicular a ese
              diámetro.**
            porque: |
              Es el brazo de $T$ en los momentos respecto de C.
          - punto: |
              **$F_1$ y $F_2$ sin escribir $fN$.**
            porque: |
              Se calcula lo que pide cada contacto, y luego se compara.
