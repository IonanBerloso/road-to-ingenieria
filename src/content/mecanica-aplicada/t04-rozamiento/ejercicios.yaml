      - **El conjunto.** En $O$, $O_x$ y $O_y$; los dos pesos $mg$, en los
        centros; el par $P$, en sentido horario; y en $B$, la normal $N$ y
        el rozamiento $F$. La articulación $A$ queda dentro.
      - **La barra AB.** En $A$, $A_x$ y $A_y$; su peso; el par; y en $B$,
        $N$ y $F$.
      - **El sentido de F.** Se supone hacia fuera. Con el par pequeño, el
        sistema se abre y $B$ tiende a salir: $F$ saldrá negativo. Con el par
        grande, se cierra y $B$ tiende a entrar: $F$ saldrá positivo.

      **2. Incógnitas.** $O_x$, $O_y$, $A_x$, $A_y$, $N$ y $F$ para cada
      valor de $P$: seis, para las tres ecuaciones de cada barra. Hacen falta
      solo dos, $N$ y $F$; los extremos de $P$ salen de $|F| \le fN$.

      **3. Ecuaciones.** Con origen en $O$, $A$ en
      $(\sqrt{2}L;\ \sqrt{2}L)$ y $B$ en $(2\sqrt{2}L;\ 0)$. Momentos en
      $O$ para el conjunto, donde no entran $O_x$, $O_y$ ni $F$:

      $$
      \sum M_O = 2\sqrt{2}L\,N - \frac{\sqrt{2}}{2}L\,mg
      - \frac{3\sqrt{2}}{2}L\,mg - P = 0
      $$

      Momentos en $A$ para la barra $AB$, con $B$ a $\sqrt{2}L$ a la derecha
      y $\sqrt{2}L$ por debajo:

      $$
      \sum M_A = \sqrt{2}L\,N + \sqrt{2}L\,F - \frac{\sqrt{2}}{2}L\,mg - P = 0
      $$

      **4. Resultados.** Con $p = P/(2\sqrt{2}\,mgL)$:

      $$
      N = mg\,(1+p), \qquad F = mg\left(p - \frac{1}{2}\right)
      $$

      El equilibrio pide $|F| \le fN$, que son dos condiciones, una por cada
      sentido de $F$:

      $$
      \sqrt{2}\,mgL\,\frac{1-2f}{1+f} \le P
      \le \sqrt{2}\,mgL\,\frac{1+2f}{1-f}
      $$

      Con $f = 0{,}25$: de $0{,}5657\,mgL$ a $2{,}8284\,mgL$. En el mínimo,
      el suelo hace en $B$ $mg\,(-0{,}3\,\vec{i} + 1{,}2\,\vec{j})$; en el
      máximo, $mg\,(0{,}5\,\vec{i} + 2\,\vec{j})$.

      **5. Comprobación.** La barra $OA$, que no se ha usado. De las fuerzas
      de $AB$, $A_x = -F$ y $A_y = mg - N = -mg\,p$, y sobre $OA$ en $A$
      actúan las opuestas, $(F;\ mg\,p)$. Momentos en $O$:

      $$
      \sum M_O = \sqrt{2}L\,mg\,p - \sqrt{2}L\,F - \frac{\sqrt{2}}{2}L\,mg
      = \sqrt{2}L\,mg\left(p - p + \frac{1}{2} - \frac{1}{2}\right) = 0
      $$

      Se cumple para cualquier $P$, como debe. Y un caso concreto: con
      $P = \sqrt{2}\,mgL$, $p = 1/2$ y $F = 0$: equilibra sin rozamiento, y
      está dentro de la horquilla para todo $f$.

      **Lo que dice el resultado.** La cota inferior coincide con la
      publicada. Con $f = 1/2$ se hace nula: el suelo sujeta solo el sistema
      sin par ninguno.

      **Lo que no cuadra.** La colección publica como cota superior
      $\sqrt{2}\,mgL\,(1-2f)/(1-f)$, con $1-2f$ en el numerador. Se cae con
      el caso de arriba: $P = \sqrt{2}\,mgL$ equilibra con cualquier $f$,
      pero la fórmula impresa da un máximo menor en cuanto $f > 0$, y con
      $f = 1/2$ lo deja en cero. El numerador bueno es $1+2f$.

  - id: ejma4-col412-la-barra-apoyada-en-un-disco
    titulo: La barra apoyada en un disco, y el intervalo de la fuerza
    fuente: >-
      Ejercicio 4.12 · Tema 4, «Rozamiento» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección lo marca como de nivel de examen. La colección
      publica el resultado, contra el que está contrastado el desarrollo.
    nivel: practica
    antes:
      idea: |
        Un sólido sin masa en equilibrio cumple las tres ecuaciones con sus
        fuerzas de contacto solas, y eso suele dar relaciones directas entre
        ellas. Mientras no hay deslizamiento, el rozamiento vale lo que haga
        falta, hasta $fN$.
      formula: |
        En un contacto entre una barra y un disco, la normal es perpendicular
        a la barra y pasa por el centro del disco; el rozamiento va a lo largo
        de la barra. Y el momento respecto de $P$ de una fuerza $(F_x;\ F_y)$
        aplicada en $(x;\ y)$ es

        $$
        M_P = (x - x_P)\,F_y - (y - y_P)\,F_x
        $$
      reconocer: |
        Antes de plantear se busca un punto donde, tomando momentos, quede una
        sola incógnita.
    enunciado: |
      Una barra $AB$ (1) de longitud $2L$ y masa $M$ se encuentra articulada en
      el punto $A$ al suelo y apoyada en un punto $G$ sobre un disco (2) sin
      masa de radio $R$. El disco está sobre un suelo rugoso con coeficiente de
      rozamiento $f = \frac{1}{\sqrt{2}}$. En el contacto entre barra y disco,
      existe rodadura. En el centro del disco, se aplica una fuerza horizontal
      $F$. Determinar entre qué valores debe encontrarse $F$ para que exista
      equilibrio.

