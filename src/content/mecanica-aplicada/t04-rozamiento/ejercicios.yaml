    pide: El coeficiente de rozamiento mínimo en el suelo para elevar la carga y para sostenerla sin P.
    pasos:
      - tipo: reconocer
        pregunta: |
          Para elevar $Q$ hay que meter la cuña superior hacia la derecha. ¿Por
          qué necesita rozamiento el suelo?
        opciones:
          - texto: Porque la cuña inferior tiende a irse con la superior, y solo el suelo puede retenerla
            correcta: true
            mensaje: |
              Eso es. La cuña superior arrastra a la inferior por la normal
              inclinada y por el rozamiento de la interfaz. Si el suelo no la
              sujeta, las dos cuñas se van juntas hacia la derecha y la carga
              no sube.
          - texto: Porque el suelo tiene que soportar el peso de la carga
            mensaje: |
              Soportar el peso lo hace la **normal** del suelo, que no necesita
              rozamiento ninguno. Lo que hace falta rozamiento es para la
              componente horizontal.
          - texto: Porque sin rozamiento en el suelo la cuña inferior volcaría
            mensaje: |
              Aquí no hay vuelco: las cuñas son planas y anchas y el problema
              solo mira deslizamientos. Lo que se juega es si la cuña inferior
              resbala o no.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna ecuación: para elevar la carga, **tres
          sólidos libres**, la carga y cada cuña por separado. Con los ejes y
          el ángulo.
        comprueba:
          - punto: |
              **La carga: $Q$, $N_a$ hacia arriba, $F_a$ hacia la derecha y la
              reacción $R$ de los rodillos, horizontal.**
            porque: |
              La cuña superior se mueve a la derecha por debajo de la carga y
              la arrastra; los rodillos solo la dejan subir.
          - punto: |
              **La cuña superior: $P$; arriba, $N_a$ hacia abajo y
              $F_a = \mu_1 N_a$ hacia la izquierda; abajo, $N_i$ perpendicular
              a la cara inclinada y $F_b = \mu_1 N_i$ a lo largo de ella, hacia
              abajo y a la izquierda.**
            porque: |
              Sube por la rampa deslizando contra las dos piezas.
          - punto: |
              **La cuña inferior: $N_i$ y $F_b$ cambiados de sentido; en el
              suelo, $N_s$ y $F_s$ hacia la izquierda.**
            porque: |
              La interfaz la empuja hacia la derecha y el suelo la retiene.
          - punto: |
              **$F_s$ queda como incógnita, sin escribir $\mu_2 N_s$.**
            porque: |
              La cuña inferior no se mueve: el suelo da lo que haga falta, y
              de ahí sale el $\mu_2$ mínimo.
          - punto: |
              **$N_i$ forma $5^{\circ}$ con la vertical.**
            porque: |
              La cara de la cuña forma $5^{\circ}$ con la horizontal.
        figura: |
