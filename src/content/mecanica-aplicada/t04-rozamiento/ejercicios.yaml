      a) El disco. b) La barra. El rozamiento en B, VB, se supone hacia arriba sobre el disco: si sale negativo, va hacia abajo. El muelle está comprimido R y empuja E con kR. Ejes: x hacia la derecha, y hacia arriba; momentos positivos en sentido antihorario.

