    pide: La normal y el rozamiento en los dos contactos del disco y la constante del muelle.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado dice que el disco está a punto de descender y de
          deslizar en $B$. ¿Qué se escribe en cada contacto?
        opciones:
          - texto: En B el rozamiento está en su techo, f por la normal; en D es una incógnita más
            correcta: true
            mensaje: |
              Eso es. Solo el contacto que va a deslizar aporta la ecuación
              $F_r = f\,N$. En $D$ el disco rueda, así que su rozamiento es una
              incógnita que sale del equilibrio y queda por debajo del techo.
          - texto: En los dos contactos el rozamiento vale f por la normal
            mensaje: |
              Eso serían dos ecuaciones y el sistema quedaría sobredeterminado.
              De hecho, resuelto el problema, en $D$ el cociente sale $0{,}247$,
              muy por debajo de $\sqrt{3}/2$.
          - texto: En B no hay rozamiento, porque la barra es lisa
            mensaje: |
              El enunciado da un coeficiente «entre superficies» y dice que en
              $B$ va a deslizar: ahí hay rozamiento y además está en su valor
              máximo.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna ecuación: **el disco y la barra por
          separado**. Con los ejes, el ángulo del plano y las alturas de $B$ y
          de $A$ sobre $O$.
        comprueba:
          - punto: |
              **El disco: $Mg$ en el centro; en $B$, $N_B$ horizontal y el
              rozamiento vertical; en $D$, $N_D$ perpendicular al plano y el
              rozamiento a lo largo de él.**
            porque: |
              Las dos normales pasan por el centro del disco.
          - punto: |
              **El rozamiento de $B$ sobre el disco, hacia arriba.**
            porque: |
              Al bajar, el disco rueda sobre el plano y su punto $B$ baja
              respecto de la barra.
          - punto: |
              **La barra: $3Mg$ en su centro, que es $B$; el disco en $B$, con
              $N_B$ y el rozamiento cambiados de sentido; el muelle en $A$,
              horizontal; y la articulación $O$.**
            porque: |
              Lo que el disco le hace a la barra es lo contrario de lo que la
              barra le hace al disco.
          - punto: |
              **El muelle con su longitud real: de $A$ al plano, en
              horizontal.**
            porque: |
              Con longitud natural cero, la fuerza es $k$ por esa longitud.
