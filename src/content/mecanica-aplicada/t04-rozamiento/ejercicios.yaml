    pide: La tensión del cable y la fuerza horizontal mínima que hace deslizar a B.
    pasos:
      - tipo: reconocer
        pregunta: |
          $B$ desliza hacia la derecha y $A$ se queda sujeto por el cable. ¿Qué
          hace el cable, además de retener a $A$?
        opciones:
          - texto: Tira de A hacia arriba con su componente vertical, y eso descarga la normal entre A y B
            correcta: true
            mensaje: |
              Eso es, y es la clave del problema. El cable está inclinado 30°,
              así que además de retener a $A$ lo levanta un poco: la normal
              entre $A$ y $B$ ya no vale $P_a$, sino $P_a - T\sin 30^{\circ}$.
          - texto: Nada más, la normal entre A y B sigue valiendo el peso de A
            mensaje: |
              Solo sería así con el cable horizontal. Inclinado 30° tiene
              componente vertical hacia arriba, que aligera el apoyo de $A$
              sobre $B$ y reduce los dos rozamientos.
          - texto: Aprieta A contra B, porque el cable va desde arriba hacia abajo
            mensaje: |
              Mira el sentido: el cable sale de la pared **por encima** de $A$ y
              baja hasta él, así que la tensión sobre $A$ apunta hacia arriba y
              hacia la izquierda. Lo levanta, no lo aprieta.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna ecuación: **los bloques A y B por
          separado**. Con los ejes y el ángulo del cable.
        comprueba:
          - punto: |
              **El bloque A: su peso, 4905 N; la tensión $T$ hacia arriba y
              hacia la pared, a $30^{\circ}$; y abajo, $N_1$ hacia arriba y
              $F_1 = \mu_1 N_1$ hacia la derecha.**
            porque: |
              B se escapa por debajo hacia la derecha y arrastra a A.
          - punto: |
              **El bloque B: su peso, 9810 N; $F$; arriba, $N_1$ hacia abajo
              y $F_1$ hacia la izquierda; abajo, $N_2$ y $F_2 = \mu_2 N_2$
              hacia la izquierda.**
            porque: |
              En la cara común, acción y reacción; y el suelo se opone a que B
              deslice hacia la derecha.
          - punto: |
              **El cable no aparece en B.**
            porque: |
              Está atado a A y a la pared, no a B.
          - punto: |
              **$N_1$ queda como incógnita: no es el peso de A.**
            porque: |
              Sale del equilibrio vertical de A, donde también entra el cable.
