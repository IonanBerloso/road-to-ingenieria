        <text x="241" y="120" font-size="10" text-anchor="middle" fill="var(--flag)">D</text>
        <text x="162" y="72" font-size="11" text-anchor="middle" fill="var(--ink)">100 kg</text>
        <text x="185" y="155" font-size="11" text-anchor="middle" fill="var(--ink)">150 kg</text>
        <line x1="250" y1="150" x2="305" y2="150" stroke="var(--d1)" stroke-width="2" marker-end="url(#ejma4-col43-f)"/>
