        <path d="M290 40 H350 V190 H290 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <line x1="320" y1="168" x2="320" y2="256" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="350" y1="238" x2="350" y2="256" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="352" y1="70" x2="416" y2="70" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="394" y1="190" x2="416" y2="190" stroke="var(--faint)" stroke-width="0.7"/>
        <path d="M320 252 H350 M320 248 V256 M350 248 V256" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="335" y="268" font-size="9" text-anchor="middle" fill="var(--faint)">0,2 m</text>
        <path d="M412 70 V190 M408 70 H416 M408 190 H416" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="418" y="134" font-size="9" text-anchor="start" fill="var(--faint)">0,8 m</text>
        <line x1="14" y1="70" x2="58" y2="70" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
