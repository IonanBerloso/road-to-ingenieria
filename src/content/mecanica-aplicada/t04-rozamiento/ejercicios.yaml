    pide: El peso del bloque que hace falta para que no deslice y para que no vuelque, en unidades de P.
    pasos:
      - tipo: reconocer
        pregunta: |
          La barra se apoya en la **arista** del bloque. ¿Qué fuerzas hay que
          poner en ese contacto y qué dirección tienen?
        opciones:
          - texto: Una normal perpendicular a la barra y un rozamiento en la dirección de la barra
            correcta: true
            mensaje: |
              Eso es. En un contacto arista-superficie manda la superficie: la
              normal es perpendicular a la barra y el rozamiento va por ella.
              Además el rozamiento pasa por $A$, así que la normal sale sola de
              los momentos allí.
          - texto: Una fuerza vertical hacia arriba, porque el bloque está de pie
            mensaje: |
              La dirección del contacto no la decide la postura del bloque sino
              la geometría del contacto. La barra está inclinada, así que su
              normal también, y por eso el bloque recibe una componente
              horizontal que lo empuja.
          - texto: Solo una normal, porque en una arista no puede haber rozamiento
            mensaje: |
              El enunciado da coeficiente entre bloque y barra precisamente
              porque ahí hay rozamiento. Y cuenta: sin él cambian los dos
              resultados.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna ecuación: **la barra y el bloque por
          separado**. Con los ejes, las distancias de $A$ al apoyo y al centro
          de la barra, y las medidas del bloque.
        comprueba:
          - punto: |
              **En $B$, la normal perpendicular a la barra y el rozamiento a lo
              largo de ella.**
            porque: |
              Es la arista del bloque contra la cara de la barra: la dirección
              la pone la cara.
          - punto: |
              **El rozamiento sobre el bloque hacia $A$, y sobre la barra hacia
              $C$.**
            porque: |
              Si el bloque se va, su arista se corre por la barra hacia $C$; el
              rozamiento se opone a ese deslizamiento.
          - punto: |
              **En $A$, dos componentes: el escalón empuja hacia la derecha y
              el suelo, hacia arriba.**
            porque: |
              El extremo está encajado: ahí no hay que decidir si desliza.
          - punto: |
              **En la base del bloque, $N_s$ y $F_s$, sin fijar dónde está
              $N_s$.**
            porque: |
              Al ir a deslizar puede estar en cualquier punto de la base; al ir
              a volcar se va a la arista de la derecha.
