      - tipo: calcular
        titulo: El par que no necesita rozamiento
        pregunta: |
          Hay un valor de $P$ para el que $B$ no necesita rozamiento ninguno.
          ¿Cuánto vale, en unidades de $mgL$?
        respuesta:
          tipo: numero
          valor: '1.4142'
          tolerancia: 0.005
          formato: un número, P dividido entre mgL
        distractores:
          - valor: '1'
            mensaje: |
              Te falta el $\sqrt{2}$ de la geometría a 45°. Los brazos salen
              todos con $\sqrt{2}L$, y por eso el resultado lo lleva.
          - valor: '2'
            mensaje: |
              Has contado el peso de las dos barras en el equilibrio de $AB$.
              Tomando momentos en $A$ sobre la barra $AB$ sola, solo entra el
              peso de esa barra.
        pista: |
          Impón $F = 0$ en $B$. Con momentos en $O$ para todo el sistema sale
          $N$, y con momentos en $A$ para la barra $AB$, la relación con $P$.
        desarrollo: |
          Momentos en $O$ para el conjunto y en $A$ para la barra $AB$, con
          $p = P/(2\sqrt{2}\,mgL)$:

          $$
          N = mg\,(1+p)
          \qquad
          F = mg\left(p - \tfrac{1}{2}\right)
          $$

          $F$ se anula en $p = 1/2$, o sea

          $$
          P = 2\sqrt{2}\,mgL \cdot \tfrac{1}{2} = \sqrt{2}\,mgL = 1{,}4142\,mgL
          $$

          Este valor vale para **cualquier** $f$, incluso para $f = 0$, y es la
          comprobación que decide el resultado del problema.

      - tipo: calcular
        titulo: El par mínimo
        pregunta: |
          Con $f = 0{,}25$, un valor nuestro para poner número, ¿cuál es el par
          mínimo en unidades de $mgL$?
        respuesta:
          tipo: numero
          valor: '0.5657'
          tolerancia: 0.004
          formato: un número, P dividido entre mgL
        distractores:
          - valor: '1.4142'
            mensaje: |
              Ese es el par sin rozamiento. Con rozamiento el sistema aguanta
              pares menores, porque el suelo sujeta a $B$ mientras el conjunto
              tiende a abrirse.
          - valor: '0.8485'
            mensaje: |
              Has perdido el 2 del término $1-2f$. La cuenta da
              $(1-2f)/(1+f)$, no $(1-f)/(1+f)$.
          - valor: '1.6971'
            mensaje: |
              Has puesto el rozamiento en el sentido contrario. Con el par
              pequeño el sistema se abre, $B$ tiende a salir hacia fuera y el
              rozamiento lo frena hacia dentro.
        pista: |
          Es el caso $F < 0$: impón $\tfrac{1}{2} - p \le f(1+p)$ y despeja $p$.
        desarrollo: |
          $$
          \tfrac{1}{2} - p \le f\,(1+p)
          \;\Longrightarrow\;
          p \ge \frac{1-2f}{2(1+f)}
          $$

          $$
          P_{\min} = \sqrt{2}\,mgL\,\frac{1-2f}{1+f}
          = \sqrt{2}\cdot\frac{0{,}5}{1{,}25}\,mgL = 0{,}5657\,mgL
          $$

      - tipo: calcular
        titulo: El par máximo
        pregunta: |
          Con el mismo $f = 0{,}25$, ¿cuál es el par máximo en unidades de
          $mgL$?
        respuesta:
          tipo: numero
          valor: '2.8284'
          tolerancia: 0.01
          formato: un número, P dividido entre mgL
        distractores:
          - valor: '0.9428'
            mensaje: |
              Es lo que da la fórmula impresa,
              $\sqrt{2}\,mgL\,(1-2f)/(1-f)$, y no puede ser: es **menor** que
              $\sqrt{2}\,mgL$, el par que equilibra sin ningún rozamiento. Un
              máximo que deja fuera un caso de equilibrio seguro está mal.
          - valor: '1.4142'
            mensaje: |
              Ese es el par sin rozamiento, que está dentro de la horquilla, no
              en su borde. Con rozamiento se puede apretar bastante más antes
              de que $B$ escape hacia dentro.
          - valor: '1.8856'
            mensaje: |
              Ese es el máximo que saldría con $f = 0{,}1$. Con $f = 0{,}25$ el
              denominador $1-f$ vale 0,75.
        pista: |
          Es el caso $F > 0$: impón $p - \tfrac{1}{2} \le f(1+p)$ y despeja $p$.
        desarrollo: |
          $$
          p - \tfrac{1}{2} \le f\,(1+p)
          \;\Longrightarrow\;
          p \le \frac{1+2f}{2(1-f)}
          $$

          $$
          P_{\max} = \sqrt{2}\,mgL\,\frac{1+2f}{1-f}
          = \sqrt{2}\cdot\frac{1{,}5}{0{,}75}\,mgL = 2{,}8284\,mgL
          $$

          Ojo al numerador: es $1+2f$, no $1-2f$ como imprime la colección.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Momentos en O para el conjunto: la normal en B vale $N = mg + P/(2\sqrt{2}L)$.'
          - texto: 'Momentos en A para la barra AB: el rozamiento vale $F = P/(2\sqrt{2}L) - mg/2$.'
          - texto: El equilibrio exige $|F| \le fN$, y esa desigualdad con dos lados da las dos cotas.
          - texto: 'Salen $P_{\min} = \sqrt{2}mgL(1-2f)/(1+f)$ y $P_{\max} = \sqrt{2}mgL(1+2f)/(1-f)$.'
          - texto: Con $f = 1/2$ la horquilla se cierra y el único par que equilibra es $P = 0$.
            trampa: true
            mensaje: |
              Eso es lo que diría la fórmula impresa, y basta un caso para
              tumbarla: $P = \sqrt{2}mgL$ da $F = 0$ exactamente, así que
              equilibra con cualquier $f$, incluido $f = 1/2$. Lo que ocurre con
              $f = 1/2$ es que la cota **inferior** se hace nula, no que la
              horquilla desaparezca.
    resolucion: |
      **1. Sólidos libres.** El conjunto de las dos barras y la barra $AB$
      sola.

