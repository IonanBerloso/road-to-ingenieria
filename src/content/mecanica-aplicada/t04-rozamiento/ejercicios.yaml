        <path d="M340 96 V200" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M300 120 L305 114 L312 126 L319 114 L326 126 L333 114 L340 120" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
