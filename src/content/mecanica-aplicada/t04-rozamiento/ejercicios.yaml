    pide: El coeficiente de rozamiento mínimo en el suelo para elevar la carga y para sostenerla sin P.
    pasos:
      - tipo: reconocer
        pregunta: |
          Para elevar $Q$ hay que meter la cuña superior hacia la derecha. ¿Por
          qué necesita rozamiento el suelo?
        opciones:
          - texto: Porque la cuña inferior tiende a irse con la superior, y solo el suelo puede retenerla
            correcta: true
            mensaje: |
              Eso es. La cuña superior arrastra a la inferior por la normal
              inclinada y por el rozamiento de la interfaz. Si el suelo no la
              sujeta, las dos cuñas se van juntas hacia la derecha y la carga
              no sube.
          - texto: Porque el suelo tiene que soportar el peso de la carga
            mensaje: |
              Soportar el peso lo hace la **normal** del suelo, que no necesita
              rozamiento ninguno. Lo que hace falta rozamiento es para la
              componente horizontal.
          - texto: Porque sin rozamiento en el suelo la cuña inferior volcaría
            mensaje: |
              Aquí no hay vuelco: las cuñas son planas y anchas y el problema
              solo mira deslizamientos. Lo que se juega es si la cuña inferior
              resbala o no.

      - tipo: calcular
        titulo: El rozamiento mínimo para elevar la carga
        pregunta: |
          ¿Qué $\mu_2$ mínimo hace falta para poder elevar $Q$?
        respuesta:
          tipo: numero
          valor: '0.2926'
          tolerancia: 0.003
          formato: un número, sin unidad
        distractores:
          - valor: '0.1106'
            mensaje: |
              Has restado el ángulo de la cuña en vez de sumarlo. Al elevar, la
              cuña sube por la rampa y los dos efectos se **suman**:
              $\tan(5^{\circ} + \varphi_1)$.
          - valor: '0.2'
            mensaje: |
              Ese es $\mu_1$, el de las otras dos superficies. El suelo tiene
              que dar algo más, porque además del rozamiento de la interfaz
              debe aguantar la componente horizontal de la normal inclinada.
          - valor: '0.0875'
            mensaje: |
              Eso es $\tan 5^{\circ}$, el efecto de la rampa sola. Falta sumarle
              el rozamiento de la interfaz entre las dos cuñas.
        pista: |
          Sobre la cuña inferior, la superior empuja con
          $N_i(\sin 5^{\circ} + \mu_1\cos 5^{\circ})$ en horizontal, y la normal
          del suelo vale $Q$.
        desarrollo: |
          De la cuña superior, en vertical,
          $N_i(\cos 5^{\circ} - \mu_1\sin 5^{\circ}) = Q$. Lo que la interfaz
          empuja en horizontal sobre la inferior, dividido por la normal del
          suelo:

          $$
          \mu_2 \ge \frac{\sin 5^{\circ} + \mu_1\cos 5^{\circ}}
          {\cos 5^{\circ} - \mu_1\sin 5^{\circ}}
          = \tan(5^{\circ} + \varphi_1) = 0{,}2926
          $$

          con $\varphi_1 = \arctan 0{,}2 = 11{,}31^{\circ}$.

      - tipo: reconocer
        pregunta: |
          Quitamos $P$. ¿Qué tiene que pasar para que la carga $Q$ baje?
        opciones:
          - texto: Que la cuña superior salga hacia la izquierda o que la inferior salga hacia la derecha, y las dos cosas piden vencer el rozamiento de la interfaz
            correcta: true
            mensaje: |
              Eso es, y por ahí se ve el autobloqueo: la interfaz solo tiene
              $\tan 5^{\circ} = 0{,}087$ de pendiente y dispone de $\mu_1 =
              0{,}2$ de rozamiento. Lo que empuja no llega para lo que frena.
          - texto: Basta con que el suelo no tenga rozamiento, porque entonces la cuña inferior resbala sola
            mensaje: |
              Aunque el suelo sea liso, para que la inferior resbale hacia
              fuera alguien tiene que empujarla, y quien podría hacerlo es la
              interfaz. Con $\mu_1$ por encima de $\tan 5^{\circ}$, la interfaz
              tira de ella hacia dentro, no hacia fuera.
          - texto: Que la carga Q venza el rozamiento con los rodillos laterales
            mensaje: |
              Los rodillos solo guían: el enunciado dice que no hay reacción
              tangencial en las paredes verticales, así que no frenan la
              bajada.

      - tipo: calcular
        titulo: El rozamiento mínimo para sostener la carga sin P
        pregunta: |
          Quitada $P$, ¿qué coeficiente $\mu_2$ mínimo necesita el suelo para
          que el sistema sostenga la carga? Si no necesita ninguno, la
          respuesta es 0.
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.005
          formato: un número, sin unidad
        distractores:
          - valor: '0.1106'
            mensaje: |
              Es el número que imprime la colección, $\tan(\varphi_1 -
              5^{\circ})$. Sale de suponer la interfaz rozando a tope, y en esa
              hipótesis el empuje sobre la cuña inferior apunta hacia
              **dentro**: no es un rozamiento que el suelo tenga que dar para
              sostener, sino el tiro que haría falta para sacar la cuña.
          - valor: '0.2926'
            mensaje: |
              Ese es el del apartado a, para **elevar**. Sostener es mucho más
              barato que elevar: para bajar la carga hay que deshacer la cuña, y
              la cuña se resiste.
          - valor: '0.0875'
            mensaje: |
              Eso es $\tan 5^{\circ}$. Aparece en la comparación que decide el
              autobloqueo, pero como el rozamiento disponible $\mu_1 = 0{,}2$ es
              mayor, la conclusión es que no hace falta nada en el suelo.
        pista: |
          Prueba a suponer el suelo perfectamente liso y mira si las ecuaciones
          admiten equilibrio con rozamientos por debajo de su máximo.
        desarrollo: |
          Con $\mu_2 = 0$ y sin $P$, el equilibrio de las dos cuñas se cumple
          con

          $$
          F_a = 0
          \qquad
          N_i = Q\cos 5^{\circ}
          \qquad
          \frac{F_b}{N_i} = \tan 5^{\circ} = 0{,}0875
          $$

          y $0{,}0875 < \mu_1 = 0{,}2$: la interfaz no llega ni de lejos a su
          techo. Hay equilibrio sin que el suelo aporte nada, así que

          $$
          \mu_{2,\min} = 0
          $$

          El par de cuñas es **autobloqueante** porque el ángulo, 5°, es menor
          que el ángulo de rozamiento, 11,31°.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Para elevar, la cuña superior desliza contra la carga y contra la inferior: los dos rozamientos están en su máximo.'
          - texto: La cuña inferior recibe $N_i(\sin 5^{\circ} + \mu_1\cos 5^{\circ})$ hacia la derecha y se apoya en el suelo con normal $Q$.
          - texto: 'De ahí el apartado a: $\mu_2 \ge \tan(5^{\circ} + \varphi_1) = 0{,}29$.'
          - texto: 'Sin P, como $\tan 5^{\circ} = 0{,}087$ es menor que $\mu_1 = 0{,}2$, el par de cuñas se autobloquea y el suelo no necesita rozamiento.'
          - texto: Sin P el suelo necesita al menos 0,11 de rozamiento, porque si no la cuña inferior se escapa y la carga baja.
            trampa: true
            mensaje: |
              Es lo que imprime la colección, y no se sostiene: con el suelo
              perfectamente liso las ecuaciones dan equilibrio con la interfaz
              trabajando al 44 % de su capacidad. El 0,11 es
              $\tan(\varphi_1 - 5^{\circ})$, el tiro necesario para **extraer**
              la cuña inferior, no un rozamiento que el suelo deba aportar.
    resolucion: |
      **Elevar la carga (apartado a).** Al empujar con $P$, la cuña superior
      sube por la rampa deslizando contra la carga y contra la cuña inferior,
      así que los dos rozamientos valen $\mu_1 N$. En vertical, sobre la cuña
      superior,

      $$
      N_i(\cos 5^{\circ} - \mu_1 \sin 5^{\circ}) = Q
      $$

      y la interfaz empuja a la cuña inferior hacia la derecha con
      $N_i(\sin 5^{\circ} + \mu_1\cos 5^{\circ})$. Como el suelo la aguanta con
      normal $Q$:

      $$
      \mu_2 \ge \frac{\sin 5^{\circ} + \mu_1\cos 5^{\circ}}
      {\cos 5^{\circ} - \mu_1\sin 5^{\circ}}
      = \tan(5^{\circ} + \varphi_1) = 0{,}2926
      $$

      Es el 0,29 publicado.

      **Sostener la carga sin P (apartado b).** Aquí el resultado impreso, 0,11,
      no responde a lo que pregunta el enunciado. El par de cuñas es
      **autobloqueante**: el ángulo de la cuña, 5°, es menor que el ángulo de
      rozamiento, $\varphi_1 = 11{,}31^{\circ}$. Con el suelo perfectamente
      liso las ecuaciones ya admiten equilibrio:

      $$
      F_a = 0
      \qquad
      N_i = Q\cos 5^{\circ}
      \qquad
      \frac{F_b}{N_i} = \tan 5^{\circ} = 0{,}0875 < 0{,}2
      $$

      Ninguna de las dos cuñas puede escaparse: para que $Q$ baje, o sale la
      superior hacia la izquierda —y ahí el empuje disponible,
      $N_i\sin 5^{\circ}$, es menor que el rozamiento que lo frena— o sale la
      inferior hacia la derecha, y entonces la interfaz, rozando a tope, la
      empuja hacia dentro. Por tanto $\mu_{2,\min} = 0$.

      **De dónde sale el 0,11.** Es $\tan(\varphi_1 - 5^{\circ}) = 0{,}1106$, y
      tiene un significado real, pero otro: es la fuerza horizontal, en
      fracción de $Q$, que habría que aplicar a la cuña inferior para
      **extraerla** con el suelo liso y dejar bajar la carga. El mismo número
      con el signo cambiado de sentido.

  - id: ejma4-col48-el-cilindro-que-gira-en-la-v
    titulo: El cilindro que gira encajado en una V
    fuente: >-
      Ejercicio 4.8 · Tema 4, «Rozamiento» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección lo marca como especial y publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Un cilindro de masa $M$ y radio $R$ rota con velocidad constante
      $\omega$, tal y como se observar en la figura deslizando sobre ambas
      superficies inclinadas y fijas. El coeficiente de rozamiento entre el
      cilindro y cada superficie es conocido de valor $\mu$. Obtener el momento
      a aplicar sobre el cilindro para que continue con ese movimiento.

      <figure>
      <svg viewBox="0 0 320 215" role="img" width="320" height="215" aria-labelledby="ejma4-col48-t ejma4-col48-d">
        <title id="ejma4-col48-t">Cilindro girando apoyado en las dos caras de una V de 45 grados</title>
        <desc id="ejma4-col48-d">Dos superficies fijas inclinadas 45 grados forman una V. Dentro de la V se apoya un cilindro de radio r que toca cada superficie en un punto. El cilindro gira en sentido antihorario con velocidad angular constante omega, deslizando sobre las dos superficies.</desc>
        <defs>
          <marker id="ejma4-col48-f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
