        <desc id="ma4c417-d">Un disco de radio R apoyado en el suelo en el punto A. En su centro C y a media R a la derecha está la masa puntual soldada, en G. A la derecha, el disco toca en B una barra vertical DE de longitud dos R, articulada al suelo en D. El extremo superior E está unido por un muelle horizontal a una pared que está a una distancia R; la longitud sin tensión del muelle es dos R.</desc>
