        <line x1="392" y1="190" x2="354" y2="190" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="380" y="182" font-size="10" text-anchor="start" fill="var(--d2-tinta)">F<tspan font-size="7.5" dy="2.5">r</tspan></text>
