      - tipo: calcular
        titulo: La fuerza que lo hace deslizar
        pregunta: |
          ¿Qué valor de $Q$ pone el rozamiento en su máximo? Da el número en
          kg*, las mismas unidades del enunciado.
        respuesta:
          tipo: numero
          valor: '400'
          tolerancia: 1
          formato: un número, en kg*
        distractores:
          - valor: '2500'
            mensaje: |
              Has dividido el peso entre el coeficiente. El rozamiento máximo
              es $\mu N$, un producto: $0{,}4 \cdot 1000$.
          - valor: '3920'
            mensaje: |
              Eso son los 400 kg* pasados a newtons. El enunciado da el peso en
              kg*, así que la respuesta sale en kg* sin multiplicar por $g$.
        pista: |
          Con la fuerza horizontal, la normal es el peso entero: $N = P$. Y en
          el límite, $Q = \mu N$.
        desarrollo: |
          $$
          Q_{\text{desliza}} = \mu\,P = 0{,}4 \cdot 1000 = 400\ \text{kg}*
          $$

          No depende de la altura a la que empujes: deslizar cuesta lo mismo
          empujes donde empujes.

      - tipo: calcular
        titulo: La fuerza que lo hace volcar
        pregunta: |
          Tomando momentos en la arista $D$, ¿qué valor de $Q$ pone el bloque a
          punto de volcar?
        respuesta:
          tipo: numero
          valor: '333.33'
          tolerancia: 1
          formato: un número, en kg*
        distractores:
          - valor: '666.67'
            mensaje: |
              Has usado la base entera, 1 m, como brazo del peso. El peso está
              en el centro de gravedad, a media base de la arista: 0,5 m.
          - valor: '250'
            mensaje: |
              Has usado la altura del bloque, 2 m, como brazo de $Q$. La fuerza
              está aplicada a 1,5 m del suelo, y ese es su brazo respecto de D.
          - valor: '500'
            mensaje: |
              Has puesto la altura del centro de gravedad, 1 m, como brazo de
              $Q$. El brazo de una fuerza se mide donde está aplicada la
              fuerza, y $Q$ está a 1,5 m.
        pista: |
          A punto de volcar, la normal y el rozamiento se concentran en $D$ y
          no dan momento ahí. Queda $Q \cdot 1{,}5 = P \cdot 0{,}5$.
        desarrollo: |
          $$
          Q_{\text{vuelca}} \cdot 1{,}5 = 1000 \cdot 0{,}5
          \;\Longrightarrow\;
          Q_{\text{vuelca}} = \frac{500}{1{,}5} = 333{,}3\ \text{kg}*
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: Para deslizar hace falta vencer el rozamiento máximo, $Q = 0{,}4 \cdot 1000 = 400$ kg*.
          - texto: 'A punto de volcar todo el contacto se concentra en D: la normal y el rozamiento se aplican ahí y no dan momento en D.'
          - texto: Momentos en D, $Q \cdot 1{,}5 = 1000 \cdot 0{,}5$, dan $Q = 333{,}3$ kg*.
          - texto: 'La menor de las dos manda: con 333 kg* el bloque vuelca, y el rozamiento aún no ha llegado a su techo.'
          - texto: Como el rozamiento es una reacción con techo, siempre se agota antes de que el bloque llegue a volcar.
            trampa: true
            mensaje: |
              No hay ningún «siempre»: depende de la geometría. Aquí el bloque
              es alto y se empuja arriba, y el momento tumba con 333 kg* cuando
              deslizar todavía pedía 400.
    resolucion: |
      **1. Sólidos libres.** Dos veces el bloque, una por cada manera de
      perder el equilibrio.

