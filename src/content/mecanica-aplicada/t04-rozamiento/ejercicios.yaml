      <figcaption>

      a) El disco. b) La barra, cuyo centro coincide con B. El plano está a 30 grados, y el rozamiento en D se supone hacia arriba del plano. Ejes: x hacia la derecha, y hacia arriba; momentos positivos en sentido antihorario.

      </figcaption>
      </figure>

      - **El disco.** Su peso $Mg$, en el centro $C$; en $B$, la barra lo
        empuja con $N_B$ hacia la izquierda y el rozamiento $F_{r,B}$, hacia
        arriba; en $D$, el plano, con $N_D$ perpendicular a él y el
        rozamiento $F_{r,D}$ a lo largo del plano, supuesto hacia arriba.
      - **La barra.** Su peso $3Mg$, en el centro, que es $B$; en $B$, $N_B$
        hacia la derecha y $F_{r,B}$ hacia abajo; en $A$, el muelle, con $S$
        hacia el plano; y en $O$, $O_x$ y $O_y$.
      - **La geometría.** El centro del disco está $\sqrt{3}R$ a la izquierda
        de $B$, a su altura. $D$ está a $\sqrt{3}R$ del centro,
        perpendicular al plano: $\tfrac{\sqrt{3}}{2}R$ a la izquierda y
        $\tfrac{3}{2}R$ más abajo.

      **2. Incógnitas.** $N_B$, $F_{r,B}$, $N_D$ y $F_{r,D}$ en el disco, y $S$,
      $O_x$ y $O_y$ en la barra: siete, para seis ecuaciones. La séptima la da
      el contacto que va a deslizar: $F_{r,B} = \tfrac{\sqrt{3}}{2}N_B$. En
      $D$ el disco rueda, y su rozamiento sale del equilibrio.

      **3. Ecuaciones.** El disco, con momentos en su centro, por donde pasan
      las dos normales; los dos rozamientos tienen brazo $\sqrt{3}R$:

      $$
      \sum M_C = \sqrt{3}R\,F_{r,B} - \sqrt{3}R\,F_{r,D} = 0
      $$

      $$
      \sum F_x = -N_B + \frac{1}{2}N_D - \frac{\sqrt{3}}{2}F_{r,D} = 0, \qquad
      \sum F_y = F_{r,B} + \frac{\sqrt{3}}{2}N_D + \frac{1}{2}F_{r,D} - Mg = 0
      $$

      La barra, con momentos en $O$: su peso y $F_{r,B}$ van por la vertical
      de $O$; $N_B$ está a $3R$ y el muelle, a $6R$:

      $$
      \sum M_O = 6R\,S - 3R\,N_B = 0
      $$

      **4. Resultados.** De los momentos y la condición de $B$,
      $F_{r,B} = F_{r,D} = \tfrac{\sqrt{3}}{2}N_B$; de la horizontal,
      $N_D = \tfrac{7}{2}N_B$; y de la vertical,

      $$
      N_B = \frac{2Mg}{5\sqrt{3}} = 0{,}2309\,Mg, \qquad
      N_D = \frac{7Mg}{5\sqrt{3}} = 0{,}8083\,Mg, \qquad
      F_{r,B} = F_{r,D} = \frac{Mg}{5}
      $$

      En $D$ el cociente es $F_{r,D}/N_D = \sqrt{3}/7 = 0{,}247$, por debajo
      de $\sqrt{3}/2$: ahí no desliza. Sobre el disco, la barra hace
      $Mg\,(-0{,}2309\,\vec{i} + 0{,}2\,\vec{j})$ y el plano,
      $Mg\,(0{,}2309\,\vec{i} + 0{,}8\,\vec{j})$.

      El muelle tira con $S = N_B/2 = \tfrac{Mg}{5\sqrt{3}}$, y su longitud es
      la distancia horizontal de $A$ al plano,
      $6R/\tan 30^{\circ} = 6\sqrt{3}R$:

      $$
      k = \frac{S}{6\sqrt{3}R} = \frac{Mg}{90R}
      $$

      En $O$, $O_x = S - N_B = -\tfrac{Mg}{5\sqrt{3}}$ y
      $O_y = 3Mg + F_{r,B} = \tfrac{16}{5}Mg$.

      **5. Comprobación.** Momentos del disco en $D$, que no se han usado: el
      centro está $\tfrac{\sqrt{3}}{2}R$ a la derecha y $\tfrac{3}{2}R$ más
      arriba de $D$, y $B$, $\tfrac{3\sqrt{3}}{2}R$ a la derecha y
      $\tfrac{3}{2}R$ más arriba:

      $$
      \sum M_D = -\frac{\sqrt{3}}{2}R\,Mg + \frac{3\sqrt{3}}{2}R\,F_{r,B}
      + \frac{3}{2}R\,N_B
      = \left(-\frac{\sqrt{3}}{2} + \frac{3\sqrt{3}}{10} + \frac{\sqrt{3}}{5}\right)MgR = 0
      $$

      **Lo que dice el resultado.** Las cinco cifras coinciden con lo
      publicado. El muelle sale muy blando porque es muy largo, $6\sqrt{3}R$,
      y tira con poco: la barra lo aprovecha al doble y casi todo el peso del
      disco lo sostiene el plano.

  - id: ejma4-col421-la-barra-sobre-dos-discos
    titulo: La barra apoyada sobre dos discos, con muelle y fuerza horizontal
    fuente: >-
      Ejercicio 4.21 · Tema 4, «Rozamiento» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección lo marca como de nivel de examen. La colección
      publica el resultado, contra el que está contrastado el desarrollo.
    nivel: practica
    antes:
      idea: |
        En una pila de cuerpos, cada uno se aísla por separado y cada contacto
        aparece en los dos cuerpos que une, con el sentido cambiado. Cuando
        varios contactos tienen el mismo coeficiente, el que decide es el que
        antes llega a su techo.
      formula: |
        El rozamiento cumple $F_r \le \mu_s N$. Y el momento respecto de $P$
        de una fuerza $(F_x;\ F_y)$ aplicada en $(x;\ y)$ es

        $$
        M_P = (x - x_P)\,F_y - (y - y_P)\,F_x
        $$
      reconocer: |
        Antes de plantear se mira qué fuerzas de cada disco pasan por su
        centro.
    enunciado: |
      La barra $AB$ de la figura de masa $2M$ y longitud $4R$, se encuentra
      articulada en el punto fijo $A$ y apoyada en $C$ sobre un disco de centro
      $D$, masa $M$ y radio $R$. Sobre el punto $D$ actúa un resorte ideal de
      constante elástica $k$, que se encuentra alargado una longitud $3R$. El
      disco, a su vez, se apoya sobre otro disco igual, que descansa sobre el
      suelo y en cuyo centro se aplica una fuerza horizontal $F$, tal y como se
      indica. En todas las superficies de contacto existe rozamiento con un
      coeficiente de rozamiento $f = \frac{1}{4}$. Si el sistema está en
      equilibrio, se pide determinar:

      a. Valor máximo de la constante elástica del muelle.

      b. Valor de $F$ para la situación de equilibrio estricto.

