    pide: El coeficiente de rozamiento mínimo en C y la fuerza que la barra transmite en B.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué se puede afirmar de la fuerza que la barra $AB$ transmite en $B$?
        opciones:
          - texto: Que va en la dirección AB, porque la barra no tiene masa y solo recibe fuerzas en sus dos extremos
            correcta: true
            mensaje: |
              Eso es. Es una barra de dos fuerzas: con solo dos puntos de
              aplicación y sin peso, las dos fuerzas tienen que ser opuestas y
              estar sobre la recta $AB$. Queda una sola incógnita, su módulo.
          - texto: Que tiene dos componentes cualesquiera, porque B es una articulación
            mensaje: |
              Una articulación transmite dos componentes en general, pero aquí
              la barra impone su dirección. Poner dos incógnitas deja el disco
              con cuatro y solo tres ecuaciones.
          - texto: Que es vertical, porque sostiene el peso de la partícula
            mensaje: |
              La barra está inclinada 30° respecto de la vertical, así que su
              fuerza también, y su componente horizontal equilibra la de la
              reacción de la pista en $C$.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna ecuación: **el disco con su partícula y
          la barra por separado**. Con los ejes, el radio que pasa por $B$ y
          los ángulos.
        comprueba:
          - punto: |
              **La barra AB: una fuerza en cada extremo, las dos por la barra,
              iguales y opuestas.**
            porque: |
              No pesa y solo la tocan en $A$ y en $B$.
          - punto: |
              **El disco: $Mg$ en la partícula; en $B$, la fuerza de la barra
              en la dirección $AB$; en $C$, $N$ hacia el centro de la pista y
              $F_t$ por la tangente.**
            porque: |
              La normal entre la pista y el disco va por la recta de sus
              centros, que pasa por $B$.
          - punto: |
              **La partícula, $B$ y $C$ en una recta, y la tangente en $C$
              paralela a $AB$.**
            porque: |
              Ese radio forma 60° con la vertical y la barra, 30°: son
              perpendiculares.
          - punto: |
              **$F_t$ sin escribir $fN$.**
            porque: |
              Se calcula lo que hace falta y luego se compara con $N$.
