      - tipo: calcular
        titulo: El rozamiento mínimo para elevar la carga
        pregunta: |
          ¿Qué $\mu_2$ mínimo hace falta para poder elevar $Q$?
        respuesta:
          tipo: numero
          valor: '0.2926'
          tolerancia: 0.003
          formato: un número, sin unidad
        distractores:
          - valor: '0.1106'
            mensaje: |
              Has restado el ángulo de la cuña en vez de sumarlo. Al elevar, la
              cuña sube por la rampa y los dos efectos se **suman**:
              $\tan(5^{\circ} + \varphi_1)$.
          - valor: '0.2'
            mensaje: |
              Ese es $\mu_1$, el de las otras dos superficies. El suelo tiene
              que dar algo más, porque además del rozamiento de la interfaz
              debe aguantar la componente horizontal de la normal inclinada.
          - valor: '0.0875'
            mensaje: |
              Eso es $\tan 5^{\circ}$, el efecto de la rampa sola. Falta sumarle
              el rozamiento de la interfaz entre las dos cuñas.
        pista: |
          Sobre la cuña inferior, la superior empuja con
          $N_i(\sin 5^{\circ} + \mu_1\cos 5^{\circ})$ en horizontal, y la normal
          del suelo vale $Q$.
        desarrollo: |
          De la cuña superior, en vertical,
          $N_i(\cos 5^{\circ} - \mu_1\sin 5^{\circ}) = Q$. Lo que la interfaz
          empuja en horizontal sobre la inferior, dividido por la normal del
          suelo:

          $$
          \mu_2 \ge \frac{\sin 5^{\circ} + \mu_1\cos 5^{\circ}}
          {\cos 5^{\circ} - \mu_1\sin 5^{\circ}}
          = \tan(5^{\circ} + \varphi_1) = 0{,}2926
          $$

          con $\varphi_1 = \arctan 0{,}2 = 11{,}31^{\circ}$.

      - tipo: reconocer
        pregunta: |
          Quitamos $P$. ¿Qué tiene que pasar para que la carga $Q$ baje?
        opciones:
          - texto: Que la cuña superior salga hacia la izquierda o que la inferior salga hacia la derecha, y las dos cosas piden vencer el rozamiento de la interfaz
            correcta: true
            mensaje: |
              Eso es, y por ahí se ve el autobloqueo: la interfaz solo tiene
              $\tan 5^{\circ} = 0{,}087$ de pendiente y dispone de $\mu_1 =
              0{,}2$ de rozamiento. Lo que empuja no llega para lo que frena.
          - texto: Basta con que el suelo no tenga rozamiento, porque entonces la cuña inferior resbala sola
            mensaje: |
              Aunque el suelo sea liso, para que la inferior resbale hacia
              fuera alguien tiene que empujarla, y quien podría hacerlo es la
              interfaz. Con $\mu_1$ por encima de $\tan 5^{\circ}$, la interfaz
              tira de ella hacia dentro, no hacia fuera.
          - texto: Que la carga Q venza el rozamiento con los rodillos laterales
            mensaje: |
              Los rodillos solo guían: el enunciado dice que no hay reacción
              tangencial en las paredes verticales, así que no frenan la
              bajada.

      - tipo: calcular
        titulo: El rozamiento mínimo para sostener la carga sin P
        pregunta: |
          Quitada $P$, ¿qué coeficiente $\mu_2$ mínimo necesita el suelo para
          que el sistema sostenga la carga? Si no necesita ninguno, la
          respuesta es 0.
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.005
          formato: un número, sin unidad
        distractores:
          - valor: '0.1106'
            mensaje: |
              Es el número que imprime la colección, $\tan(\varphi_1 -
              5^{\circ})$. Sale de suponer la interfaz rozando a tope, y en esa
              hipótesis el empuje sobre la cuña inferior apunta hacia
              **dentro**: no es un rozamiento que el suelo tenga que dar para
              sostener, sino el tiro que haría falta para sacar la cuña.
          - valor: '0.2926'
            mensaje: |
              Ese es el del apartado a, para **elevar**. Sostener es mucho más
              barato que elevar: para bajar la carga hay que deshacer la cuña, y
              la cuña se resiste.
          - valor: '0.0875'
            mensaje: |
              Eso es $\tan 5^{\circ}$. Aparece en la comparación que decide el
              autobloqueo, pero como el rozamiento disponible $\mu_1 = 0{,}2$ es
              mayor, la conclusión es que no hace falta nada en el suelo.
        pista: |
          Prueba a suponer el suelo perfectamente liso y mira si las ecuaciones
          admiten equilibrio con rozamientos por debajo de su máximo.
        desarrollo: |
          Con $\mu_2 = 0$ y sin $P$, el equilibrio de las dos cuñas se cumple
          con

          $$
          F_a = 0
          \qquad
          N_i = Q\cos 5^{\circ}
          \qquad
          \frac{F_b}{N_i} = \tan 5^{\circ} = 0{,}0875
          $$

          y $0{,}0875 < \mu_1 = 0{,}2$: la interfaz no llega ni de lejos a su
          techo. Hay equilibrio sin que el suelo aporte nada, así que

          $$
          \mu_{2,\min} = 0
          $$

          El par de cuñas es **autobloqueante** porque el ángulo, 5°, es menor
          que el ángulo de rozamiento, 11,31°.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Para elevar, la cuña superior desliza contra la carga y contra la inferior: los dos rozamientos están en su máximo.'
          - texto: La cuña inferior recibe $N_i(\sin 5^{\circ} + \mu_1\cos 5^{\circ})$ hacia la derecha y se apoya en el suelo con normal $Q$.
          - texto: 'De ahí el apartado a: $\mu_2 \ge \tan(5^{\circ} + \varphi_1) = 0{,}29$.'
          - texto: 'Sin P, como $\tan 5^{\circ} = 0{,}087$ es menor que $\mu_1 = 0{,}2$, el par de cuñas se autobloquea y el suelo no necesita rozamiento.'
          - texto: Sin P el suelo necesita al menos 0,11 de rozamiento, porque si no la cuña inferior se escapa y la carga baja.
            trampa: true
            mensaje: |
              Es lo que imprime la colección, y no se sostiene: con el suelo
              perfectamente liso las ecuaciones dan equilibrio con la interfaz
              trabajando al 44 % de su capacidad. El 0,11 es
              $\tan(\varphi_1 - 5^{\circ})$, el tiro necesario para **extraer**
              la cuña inferior, no un rozamiento que el suelo deba aportar.
    resolucion: |
      **1. Sólidos libres.** Para elevar la carga: la carga y cada cuña por
      separado. Las cuñas no pesan.

