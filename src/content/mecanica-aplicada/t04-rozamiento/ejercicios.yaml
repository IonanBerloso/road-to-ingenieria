        <text x="185" y="154" font-size="10" text-anchor="middle" fill="var(--paper)">2</text>
        <circle cx="264" cy="186" r="9" fill="var(--ink)"/>
        <text x="264" y="190" font-size="10" text-anchor="middle" fill="var(--paper)">3</text>
