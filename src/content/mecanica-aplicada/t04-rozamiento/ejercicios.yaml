      <figcaption>

      a) La viga. b) El disco. Lo que se hacen en B aparece en los dos con el sentido cambiado. La resultante de la carga, a trazos, no se suma aparte. Ejes: x hacia la derecha, y hacia arriba; momentos positivos en sentido antihorario.

      </figcaption>
      </figure>

      - **La viga.** Sin masa: en $A$, el cable, con $T_O$ hacia arriba, y
        $F$, hacia la izquierda; la carga, uniforme sobre el tramo central de
        longitud $R$, con resultante $3Mg$ a $1{,}5R$ de $A$; y en $B$, el
        disco, con $B_x$ y $B_y$.
      - **El disco.** Su peso $Mg$ y el par $P = 3MgR$, horario; en $B$, en
        el borde y a la altura del centro, $B_x$ y $B_y$ con el sentido
        cambiado; y en $C$, el suelo, con $C_x$ y $C_y$.

      **2. Incógnitas.** $T_O$, $F$, $B_x$, $B_y$, $C_x$ y $C_y$: seis, para
      las seis ecuaciones de los dos sólidos. El apartado c compara después
      $C_x$ con su techo.

      **3. Ecuaciones.** La viga, con momentos en $B$; $F$ y $B_x$ van por la
      propia viga:

      $$
      \sum M_B = -3R\,T_O + 1{,}5R\,(3Mg) = 0, \qquad
      \sum F_x = B_x - F = 0, \qquad
      \sum F_y = T_O + B_y - 3Mg = 0
      $$

      El disco, con momentos en su centro: $B$ está $R$ a la izquierda y $C$,
      $R$ más abajo:

      $$
      \sum M = R\,B_y - 3MgR + R\,C_x = 0, \qquad
      \sum F_x = C_x - B_x = 0, \qquad
      \sum F_y = C_y - B_y - Mg = 0
      $$

      **4. Resultados.**

      $$
      T_O = B_y = \frac{3Mg}{2}, \qquad C_x = F = B_x = \frac{3Mg}{2}, \qquad
      C_y = \frac{5Mg}{2}
      $$

      Sobre el disco, el suelo hace $Mg\,(1{,}5\,\vec{i} + 2{,}5\,\vec{j})$ y
      la viga, $Mg\,(-1{,}5\,\vec{i} - 1{,}5\,\vec{j})$. Para que ruede, el
      contacto tiene que dar ese rozamiento:

      $$
      \mu_{\text{nec}} = \frac{C_x}{C_y} = \frac{3}{5} = 0{,}6
      $$

      Con $f = 1/2$ el techo es $\tfrac{1}{2}\cdot\tfrac{5Mg}{2} = 1{,}25Mg$,
      menos que los $1{,}5Mg$ que hacen falta: el disco **deslizaría
      primero**.

      **5. Comprobación.** Los dos sólidos juntos, con momentos en $C$: $A$
      está $4R$ a la izquierda y $R$ más arriba, la resultante de la carga,
      $2{,}5R$ a la izquierda, y el peso del disco va por la vertical de $C$:

      $$
      \sum M_C = -4R\,T_O + R\,F + 2{,}5R\,(3Mg) - 3MgR
      = (-6 + 1{,}5 + 7{,}5 - 3)\,MgR = 0
      $$

      **Lo que dice el resultado.** Los tres resultados coinciden con lo
      publicado. El rozamiento lo pide el par: sin él, $C_x$ saldría
      $-1{,}5Mg$, del otro lado.
