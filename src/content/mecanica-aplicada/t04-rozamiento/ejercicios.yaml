        <rect x="120" y="105" width="130" height="90" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.4"/>
        <rect x="120" y="30" width="85" height="75" fill="var(--faint)" fill-opacity="0.28" stroke="var(--ink)" stroke-width="1.4"/>
        <line x1="45" y1="55" x2="120" y2="55" stroke="var(--ink)" stroke-width="1.2"/>
