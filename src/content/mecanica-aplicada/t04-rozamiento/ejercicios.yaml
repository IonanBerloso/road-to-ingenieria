        <title id="ma4c414-t">Disco sobre suelo horizontal unido por una cuerda a un disco sobre un plano inclinado</title>
        <desc id="ma4c414-d">A la izquierda, el disco 1 de radio dos R descansa sobre un suelo horizontal y lleva aplicado un par P en sentido antihorario. De su centro sale una cuerda horizontal que pasa por una polea y baja paralela al plano inclinado hasta enrollarse en la periferia del disco 2, de radio R, apoyado en ese plano. El plano forma 60 grados con la vertical, es decir 30 grados con la horizontal.</desc>
