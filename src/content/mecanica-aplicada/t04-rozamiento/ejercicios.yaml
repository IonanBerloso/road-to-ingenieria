    pide: Las dos normales y el momento que hay que aplicar para mantener el giro.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué aquí sí se puede escribir $F_r = \mu N$ en los dos contactos
          desde el principio?
        opciones:
          - texto: Porque el cilindro está deslizando sobre las dos superficies, no a punto de deslizar
            correcta: true
            mensaje: |
              Eso es, y es lo que distingue este problema del resto del tema.
              Aquí ya hay movimiento relativo en los dos contactos, así que el
              rozamiento es el cinético y vale $\mu N$ sin más hipótesis.
          - texto: Porque en todo problema de rozamiento se escribe $F_r = \mu N$
            mensaje: |
              No: mientras no hay deslizamiento, $\mu N$ es solo el techo y el
              rozamiento vale lo que pida el equilibrio. Escribirlo como
              igualdad sin que haya movimiento inminente es el error más común
              del tema.
          - texto: Porque el cilindro gira, y todo lo que gira tiene rozamiento máximo
            mensaje: |
              Girar no basta: un disco que **rueda** sin deslizar tiene
              rozamiento estático por debajo del máximo. Lo que aquí lo fija es
              que el enunciado dice que desliza sobre ambas superficies.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna ecuación: **el sólido libre del
          cilindro**, sin la V. Con el sentido de giro, los ejes y los
          ángulos.
        comprueba:
          - punto: |
              **En el centro O, el peso $Mg$ y el momento $M$ aplicado, en el
              sentido del giro.**
            porque: |
              Los rozamientos frenan el giro; $M$ lo mantiene.
          - punto: |
              **En cada contacto, la normal hacia el centro, a $45^{\circ}$ de
              la vertical.**
            porque: |
              Las caras de la V forman $45^{\circ}$ con la horizontal.
          - punto: |
              **En el contacto 1, $\mu N_1$ tangente, hacia arriba y hacia la
              izquierda.**
            porque: |
              Girando en sentido antihorario, ese punto baja por su cara; el
              rozamiento se opone.
          - punto: |
              **En el contacto 2, $\mu N_2$ tangente, hacia abajo y hacia la
              izquierda.**
            porque: |
              Ese punto sube por su cara.
          - punto: |
              **Los dos rozamientos con brazo $R$ respecto de O, y los dos
              frenando.**
            porque: |
              Son tangentes a la circunferencia, y las normales pasan por O.
