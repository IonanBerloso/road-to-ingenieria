          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M220 100 A70 70 0 1 0 80 100 A70 70 0 1 0 220 100 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M150 100 L100.5 50.5" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <line x1="150" y1="172" x2="150" y2="246" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="164" y1="226" x2="164" y2="246" stroke="var(--faint)" stroke-width="0.7"/>
        <path d="M150 242 H164 M150 238 V246 M164 238 V246" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="157" y="258" font-size="9" text-anchor="middle" fill="var(--faint)">μr</text>
        <line x1="150" y1="100" x2="150" y2="152" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
        <text x="144" y="140" font-size="10" text-anchor="end" fill="var(--flag)">200 N</text>
        <line x1="150" y1="100" x2="214" y2="100" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="218" y="104" font-size="10" text-anchor="start" fill="var(--d2-tinta)">F<tspan font-size="7.5" dy="2.5">t</tspan></text>
        <line x1="164" y1="224" x2="164" y2="174" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="170" y="220" font-size="10" text-anchor="start" fill="var(--d2-tinta)">N</text>
        <line x1="220" y1="170" x2="168" y2="170" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="214" y="162" font-size="10" text-anchor="start" fill="var(--d2-tinta)">F<tspan font-size="7.5" dy="2.5">r</tspan></text>
        <circle cx="150" cy="100" r="2.4" fill="var(--ink)"/>
        <text x="156" y="92" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">C</text>
        <circle cx="164" cy="170" r="2.4" fill="var(--ink)"/>
        <text x="176" y="186" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">A</text>
        <text x="128" y="70" font-size="9" text-anchor="start" fill="var(--faint)">R</text>
        <line x1="250" y1="250" x2="280" y2="250" stroke="var(--ink)" stroke-width="1" marker-end="url(#dsl-fe)"/>
        <line x1="250" y1="250" x2="250" y2="220" stroke="var(--ink)" stroke-width="1" marker-end="url(#dsl-fe)"/>
        <text x="284" y="253" font-size="9.5" font-style="italic" fill="var(--ink)">x</text>
        <text x="246" y="222" font-size="9.5" font-style="italic" text-anchor="end" fill="var(--ink)">y</text>
        <path d="M317.5 241.5 A11 11 0 1 0 297.7 239.8" fill="none" stroke="var(--ink)" stroke-width="1" marker-end="url(#dsl-fe)"/>
        <text x="323" y="228" font-size="10" fill="var(--ink)">+</text>
      </svg>
      <figcaption>

      El adelanto μr de la normal está exagerado para que se vea. Ejes: x hacia la derecha, y hacia arriba; momentos positivos en sentido antihorario.

      </figcaption>
      </figure>

      - **En el eje.** La carga de 200 N hacia abajo y $F_t$ hacia la
        derecha, las dos en $C$.
      - **En el contacto.** La normal $N$ y el rozamiento $F_r$, los dos en
        el punto $A$, adelantado $\mu_r = 0{,}005$ m respecto de la vertical
        de $C$. El rozamiento va hacia la izquierda: impide que la rueda
        deslice arrastrada por $F_t$.

      **2. Incógnitas.** $F_t$, $N$ y $F_r$: tres, para las tres ecuaciones
      de la rueda.

      **3. Ecuaciones.** Con $A$ a $\mu_r$ a la derecha de $C$ y $R$ por
      debajo, momentos en $A$, donde ni $N$ ni $F_r$ dan momento:

      $$
      \sum M_A = 200\,\mu_r - F_t\,R = 0
      $$

      $$
      \sum F_x = F_t - F_r = 0, \qquad \sum F_y = N - 200 = 0
      $$

      **4. Resultados.** Con $\mu_r = 0{,}005$ m, en la misma unidad que el
      radio:

      $$
      F_t = 200 \cdot \frac{0{,}005}{0{,}25} = 4\ \text{N}, \qquad
      F_r = 4\ \text{N}, \qquad N = 200\ \text{N}
      $$

      El suelo le hace a la rueda, en $A$, $-4\,\vec{i} + 200\,\vec{j}\
      \text{N}$. Para que ruede sin deslizar, el rozamiento tiene que estar
      por debajo de su techo:

      $$
      \mu_s \ge \frac{F_r}{N} = \frac{4}{200} = 0{,}02
      $$

      **5. Comprobación.** Momentos en el centro $C$, que no se han usado.
      La carga y $F_t$ pasan por $C$; quedan $N$, con brazo $\mu_r$, y $F_r$,
      con brazo $R$:

      $$
      \sum M_C = 0{,}005 \cdot 200 - 0{,}25 \cdot 4 = 1 - 1 = 0
      $$

      **Lo que dice el resultado.** Con 4 N se mueve una carga de 200 N: el
      2 %. Por eso existen las ruedas. Y el rozamiento mínimo, 0,02, coincide
      con $\mu_r / R$, que es el coeficiente de rozamiento equivalente del
      que habla la teoría.

  - id: ejma4-col41-el-bloque-que-desliza-o-vuelca
    titulo: El bloque que puede deslizar o volcar
    fuente: >-
      Ejercicio 4.1 · Tema 4, «Rozamiento» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección publica el resultado, contra el que está
      contrastado el desarrollo.
    nivel: practica
    antes:
      idea: |
        El rozamiento vale lo que haga falta para el equilibrio, hasta un
        techo. Y la normal de un apoyo plano puede estar en cualquier punto
        de la base, pero nunca fuera de ella.
      formula: |
        En el límite del deslizamiento, $F_r = \mu N$. El kg* es un peso, lo
        que la gravedad tira de 1 kg: si los datos van en kg*, el resultado
        también. Y el momento respecto de $P$ de una fuerza $(F_x;\ F_y)$
        aplicada en $(x;\ y)$ es

        $$
        M_P = (x - x_P)\,F_y - (y - y_P)\,F_x
        $$
      reconocer: |
        Antes de calcular se mira la forma del cuerpo y dónde se le empuja:
        eso dice qué le puede pasar.
    enunciado: |
      Calcular la fuerza mínima $Q$ para que el bloque de la figura de peso $P$
      empiece a deslizar y para que vuelque. Datos: $P = 1000\ \text{kg}*$,
      $\mu = 0{,}4$.

