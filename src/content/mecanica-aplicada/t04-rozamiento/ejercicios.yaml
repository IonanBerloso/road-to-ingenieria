        <desc id="ejma4-col43-d">Una pared vertical a la izquierda y un suelo horizontal. Sobre el suelo descansa un bloque D de 150 kilogramos, y encima de él, apoyado contra la pared por la izquierda, un bloque C de 100 kilogramos. Un cable horizontal une el punto A de la pared con el punto B del bloque C. Una fuerza P horizontal empuja el bloque D hacia la derecha.</desc>
