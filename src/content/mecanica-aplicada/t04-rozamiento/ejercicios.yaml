    pide: La tensión de la cuerda BD y el coeficiente de rozamiento necesario en C, en función de los datos.
    pasos:
      - tipo: reconocer
        pregunta: |
          La varilla se apoya en el canto de la columna. ¿Cómo es la reacción
          en $C$?
        opciones:
          - texto: Normal perpendicular a la varilla y rozamiento a lo largo de ella
            correcta: true
            mensaje: |
              Eso es. Quien manda es la superficie de la varilla, que es la que
              apoya sobre el canto: la normal sale perpendicular a la varilla y
              el rozamiento va en su dirección, que es por donde deslizaría.
          - texto: Normal vertical y rozamiento horizontal, como en cualquier apoyo sobre el suelo
            mensaje: |
              Eso valdría si la varilla estuviera horizontal. Aquí está
              inclinada, y la varilla desliza **a lo largo de sí misma** sobre
              el canto, así que las dos componentes van giradas ese mismo
              ángulo. Sale un coeficiente distinto y equivocado.
          - texto: Solo normal, porque un apoyo puntual no puede transmitir rozamiento
            mensaje: |
              Un apoyo puntual sí transmite rozamiento; de hecho el apartado b
              pregunta exactamente cuánto hace falta. Sin él la varilla
              resbalaría sobre el canto.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna ecuación: **el sólido libre de la
          varilla**, sin la columna ni la cuerda. Con los ángulos y las
          distancias.
        comprueba:
          - punto: |
              **El peso $P$ en A, vertical hacia abajo.**
            porque: |
              La varilla no pesa: el único peso es el que cuelga.
          - punto: |
              **La tensión $T$ en B, a lo largo de la cuerda, hacia D.**
            porque: |
              Una cuerda solo tira, y en su propia dirección.
          - punto: |
              **En C, la normal $N$ perpendicular a la varilla y el rozamiento
              $F$ a lo largo de ella.**
            porque: |
              Es la varilla la que apoya sobre el canto: manda su superficie.
          - punto: |
              **$F$ apunta hacia B, subiendo por la varilla.**
            porque: |
              El peso y la cuerda tiran de la varilla hacia A; el rozamiento
              se opone.
          - punto: |
              **Los brazos respecto de C: $a\sin\alpha$ para $P$ y $b\sin\beta$
              para $T$.**
            porque: |
              Son las distancias de C a sus líneas de acción.
        figura: |
          <svg viewBox="20 44 320 150" role="img" width="320" height="150" aria-labelledby="dsl-t dsl-d">
