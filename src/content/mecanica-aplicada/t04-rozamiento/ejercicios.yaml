    pide: La fuerza mínima que mueve la viga, comparando los tres modos posibles.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado da $\mu_{r,1} = 0{,}05$ cm y $\mu_{r,2} = 0{,}1$ cm.
          ¿Qué son esos dos números?
        opciones:
          - texto: Coeficientes de resistencia a la rodadura, que son longitudes; el adelanto de la normal en cada contacto
            correcta: true
            mensaje: |
              Eso es, y por eso vienen en centímetros. Es la distancia que la
              normal se adelanta en el sentido del movimiento, y en la fórmula
              aparece siempre dividida por el radio.
          - texto: Coeficientes de rozamiento pequeños, adimensionales, para cuando la rueda casi no roza
            mensaje: |
              No son adimensionales: llevan unidades de longitud, centímetros.
              Tratarlos como coeficientes de rozamiento da una fuerza cientos de
              veces mayor que la real.
          - texto: El radio de la zona de contacto aplastada de la rueda
            mensaje: |
              La zona de contacto se aplasta, sí, y de ahí viene el fenómeno,
              pero $\mu_r$ no es su tamaño: es el brazo con el que la resultante
              de la normal queda adelantada.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna ecuación, para el caso de rodadura: **la
          viga y una de las ruedas**, por separado. Con los ejes y las cotas.
        comprueba:
          - punto: |
              **La viga: $Q$, $P$ a 8 m de la rueda 2 y a 4 m de la 3, y en
              cada rueda una normal hacia arriba y un rozamiento hacia la
              izquierda.**
            porque: |
              Las ruedas sostienen la viga y frenan su avance.
          - punto: |
              **Una rueda: arriba, $N$ hacia abajo y $F$ hacia la derecha;
              abajo, $N$ hacia arriba y $F$ hacia la izquierda.**
            porque: |
              La rueda no pesa: lo que recibe de la viga lo pasa al suelo.
          - punto: |
              **Las dos normales de la rueda, adelantadas: la de arriba
              $\mu_{r,1}$ y la de abajo $\mu_{r,2}$, de modo que su par frena el
              giro.**
            porque: |
              Es la resistencia a la rodadura en cada contacto.
          - punto: |
              **Las dos $F$ de la rueda, separadas $2r$.**
            porque: |
              Una está en lo alto de la rueda y la otra en lo bajo.
