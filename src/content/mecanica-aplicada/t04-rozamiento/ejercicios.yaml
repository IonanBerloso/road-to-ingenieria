          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M110 160 A40 40 0 1 0 30 160 A40 40 0 1 0 110 160 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M300 160 A40 40 0 1 0 220 160 A40 40 0 1 0 300 160 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M10 200 H160" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M150 96 V200" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M110 120 L115 114 L122 126 L129 114 L136 126 L143 114 L150 120" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
