        <line x1="232" y1="231" x2="232" y2="189" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="238" y="227" font-size="10" text-anchor="start" fill="var(--d2-tinta)">N<tspan font-size="7.5" dy="2.5">1</tspan></text>
        <line x1="312" y1="185" x2="279" y2="185" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="298" y="179" font-size="10" text-anchor="start" fill="var(--d2-tinta)">F<tspan font-size="7.5" dy="2.5">1</tspan></text>
        <text x="46" y="36" font-size="11" font-weight="700" fill="var(--ink)">B</text>
        <text x="196" y="172" font-size="11" font-weight="700" fill="var(--ink)">A</text>
        <line x1="10" y1="236" x2="40" y2="236" stroke="var(--ink)" stroke-width="1" marker-end="url(#dsl-fe)"/>
        <line x1="10" y1="236" x2="10" y2="206" stroke="var(--ink)" stroke-width="1" marker-end="url(#dsl-fe)"/>
        <text x="44" y="239" font-size="9.5" font-style="italic" fill="var(--ink)">x</text>
        <text x="6" y="208" font-size="9.5" font-style="italic" text-anchor="end" fill="var(--ink)">y</text>
        <path d="M77.5 227.5 A11 11 0 1 0 57.7 225.8" fill="none" stroke="var(--ink)" stroke-width="1" marker-end="url(#dsl-fe)"/>
        <text x="83" y="214" font-size="10" fill="var(--ink)">+</text>
      </svg>
      <figcaption>

      En cada contacto, Fᵢ = μᵢ Nᵢ: todos deslizan. La cuña no pesa. Ejes: x hacia la derecha, y hacia arriba; momentos positivos en sentido antihorario.

      </figcaption>
      </figure>

      - **El bloque B.** Su peso $P$; contra la pared, $N_3$ y $F_3$; y en la
        cara inclinada, $N_2$, perpendicular a ella, y $F_2$. $B$ sube
        deslizando contra la pared y contra la cara, así que los dos
        rozamientos lo frenan: $F_3$ hacia abajo y $F_2$ hacia abajo a lo
        largo de la cara.
      - **La cuña A.** $Q$; $N_2$ y $F_2$ cambiados de sentido; y en el
        suelo, $N_1$ y $F_1$, hacia la izquierda, porque avanza hacia la
        derecha.
      - Los tres contactos deslizan: $F_i = \mu_i N_i$.

      **2. Incógnitas.** $N_1$, $N_2$, $N_3$ y $Q$: cuatro, para las dos
      ecuaciones de fuerzas de cada pieza. Los momentos solo dirían dónde
      caen las normales.

      **3. Ecuaciones.** En kg*, con $\alpha = 30^{\circ}$. El bloque $B$:

      $$
      \sum F_x = N_2\sin\alpha + \mu_2 N_2\cos\alpha - N_3 = 0
      $$

      $$
      \sum F_y = N_2\cos\alpha - \mu_2 N_2\sin\alpha - \mu_3 N_3 - P = 0
      $$

      La cuña $A$:

      $$
      \sum F_x = Q - N_2\sin\alpha - \mu_2 N_2\cos\alpha - \mu_1 N_1 = 0,
      \qquad
      \sum F_y = N_1 - N_2\cos\alpha + \mu_2 N_2\sin\alpha = 0
      $$

      **4. Resultados.** Del bloque, con $N_3 = 0{,}7598\,N_2$:

      $$
      N_2 = \frac{4000}{0{,}7160 - 0{,}2 \cdot 0{,}7598} = \frac{4000}{0{,}5641}
      = 7091\ \text{kg}*, \qquad N_3 = 5388\ \text{kg}*
      $$

      De la cuña, $N_1 = 0{,}7160 \cdot 7091 = 5078$ kg* y

      $$
      Q = 5388 + 0{,}4 \cdot 5078 = 5388 + 2031 = 7419\ \text{kg}*
      $$

      Sobre $B$, en vectores: la pared,
      $-5388\,\vec{i} - 1078\,\vec{j}$ kg*; la cuña,
      $5388\,\vec{i} + 5078\,\vec{j}$ kg*.

      **5. Comprobación.** El conjunto $A + B$, que no se ha usado. Sus
      fuerzas exteriores son $P$, $Q$, la pared y el suelo:

      $$
      \sum F_x = 7419 - 5388 - 2031 = 0, \qquad
      \sum F_y = 5078 - 4000 - 0{,}2 \cdot 5388 = 5078 - 4000 - 1078 = 0
      $$

      **Lo que dice el resultado.** Para subir 4000 kg* hacen falta 7419:
      casi el doble, porque los tres rozamientos frenan a la vez. El del
      suelo, bajo una cuña que no pesa, se lleva más de la cuarta parte de
      $Q$.

      **Lo que no cuadra.** El enunciado publica $\mu_1 = 0{,}4{,}4$. Con
      $\mu_1 = 0{,}4$ sale 7419 kg*, exactamente el resultado publicado; con
      0,44 saldrían 7622. La coma de más es una errata, y el valor bueno es
      0,4.

  - id: ejma4-col410-la-viga-sobre-dos-ruedas
    titulo: La viga que se mueve sobre dos ruedas
    fuente: >-
      Ejercicio 4.10 · Tema 4, «Rozamiento» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección lo marca como especial y resuelto en el libro; su
      resultado, 225, es correcto pero está impreso en «kg» y sale en newtons.
    nivel: practica
    antes:
      idea: |
        Cuando un cuerpo puede empezar a moverse de varias maneras, se calcula
        la fuerza que pide cada una y ocurre la que pide menos. Una rueda sin
        masa entre dos superficies pasa abajo lo mismo que recibe arriba.
      formula: |
        Deslizar cuesta $\mu N$ en cada contacto que desliza. En una rueda,
        dos fuerzas horizontales iguales y opuestas, una arriba y otra abajo,
        forman un par de brazo igual al diámetro. Y las longitudes de una
        misma ecuación van en la misma unidad.
      reconocer: |
        Antes de calcular se lee cada dato con su unidad.
    enunciado: |
      Calcular la fuerza $Q$ mínima para el inicio del desplazamiento de la
      viga. Comprobar los siguientes casos:

      a. Deslizamiento entre rueda-viga.

      b. Deslizamiento entre rueda y suelo.

      c. Rodadura entre rueda y suelo.

      Datos: $P = 12\ \text{kN}$; $a = 8\ \text{m}$; $b = 4\ \text{m}$,
      $r = 4\ \text{cm}$. Entre ruega y viga: $\mu_{r,1} = 0{,}05\ \text{cm}$;
      $\mu_1 = 0{,}25$. Entre rueda y suelo: $\mu_{r,2} = 0{,}1\ \text{cm}$;
      $\mu_2 = 0{,}4$.

