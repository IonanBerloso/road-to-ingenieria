      <figcaption>

      El ángulo de las cuñas, 5°, está exagerado para que se vea. Las cuñas no pesan. Ejes: x hacia la derecha, y hacia arriba; momentos positivos en sentido antihorario.

      </figcaption>
      </figure>

      - **La carga.** Su peso $Q$, la normal $N_a$ y el rozamiento $F_a$ de
        la cuña superior, que se le escapa por debajo hacia la derecha y la
        arrastra, y la reacción horizontal $R$ de los rodillos, que solo la
        dejan subir.
      - **La cuña superior.** $P$; arriba, $N_a$ y $F_a$ cambiados de sentido;
        abajo, $N_i$, perpendicular a la cara inclinada, y $F_b$ a lo largo de
        ella. Sube por la rampa deslizando contra las dos piezas, así que
        $F_a = \mu_1 N_a$ y $F_b = \mu_1 N_i$, este hacia abajo y a la
        izquierda.
      - **La cuña inferior.** $N_i$ y $F_b$ cambiados de sentido, y el suelo:
        $N_s$ y $F_s$, hacia la izquierda. No se mueve, así que $F_s$ es lo
        que haga falta.

      **2. Incógnitas.** $N_a$, $R$, $N_i$, $P$, $N_s$ y $F_s$, con $F_a$ y
      $F_b$ dados por sus normales: seis, para las dos ecuaciones de fuerzas
      de cada pieza. Los momentos solo dirían dónde caen las normales. El
      $\mu_2$ mínimo sale de $F_s \le \mu_2 N_s$.

      **3. Ecuaciones.** La carga:

      $$
      \sum F_y = N_a - Q = 0, \qquad \sum F_x = \mu_1 N_a - R = 0
      $$

      La cuña superior:

      $$
      \sum F_x = P - \mu_1 N_a - N_i\sin 5^{\circ} - \mu_1 N_i\cos 5^{\circ}
      = 0
      $$

      $$
      \sum F_y = -N_a + N_i\cos 5^{\circ} - \mu_1 N_i\sin 5^{\circ} = 0
      $$

      La cuña inferior:

      $$
      \sum F_x = N_i\sin 5^{\circ} + \mu_1 N_i\cos 5^{\circ} - F_s = 0, \qquad
      \sum F_y = N_s - N_i\cos 5^{\circ} + \mu_1 N_i\sin 5^{\circ} = 0
      $$

      **4. Resultados.** $N_a = Q$ y $R = 0{,}2\,Q$. De la cuña superior,

      $$
      N_i = \frac{Q}{\cos 5^{\circ} - \mu_1\sin 5^{\circ}} = 1{,}0217\,Q,
      \qquad P = 0{,}4926\,Q
      $$

      y de la inferior, $N_s = Q$ y $F_s = 0{,}2926\,Q$:

      $$
      \mu_2 \ge \frac{F_s}{N_s}
      = \frac{\sin 5^{\circ} + \mu_1\cos 5^{\circ}}
      {\cos 5^{\circ} - \mu_1\sin 5^{\circ}}
      = \tan(5^{\circ} + \varphi_1) = 0{,}2926
      $$

      con $\varphi_1 = \arctan 0{,}2 = 11{,}31^{\circ}$. Sobre la cuña
      inferior, el suelo hace $Q\,(-0{,}2926\,\vec{i} + \vec{j})$.

      **Sin P (apartado b).** Se prueba con el suelo perfectamente liso,
      $F_s = 0$, y los rozamientos de arriba como incógnitas. La cuña
      inferior da $F_b = -N_i\tan 5^{\circ}$: el rozamiento sobre la cuña
      superior apunta ahora hacia arriba de la rampa. La superior da
      $F_a = 0$ y $N_i = Q\cos 5^{\circ}$. Hace falta
      $|F_b|/N_i = \tan 5^{\circ} = 0{,}0875$, por debajo de
      $\mu_1 = 0{,}2$: hay equilibrio sin que el suelo aporte nada,

      $$
      \mu_{2,\min} = 0
      $$

      El par de cuñas es **autobloqueante**: su ángulo, $5^{\circ}$, es menor
      que el de rozamiento, $11{,}31^{\circ}$.

      **5. Comprobación.** El conjunto de las tres piezas en a), que no se ha
      usado. Sus fuerzas exteriores son $Q$, $R$, $P$, $N_s$ y $F_s$:

      $$
      \sum F_x = 0{,}4926\,Q - 0{,}2\,Q - 0{,}2926\,Q = 0, \qquad
      \sum F_y = N_s - Q = 0
      $$

      **Lo que dice el resultado.** Elevar pide al suelo $\mu_2 \ge 0{,}29$,
      el 0,29 publicado. Sostener no pide nada: para que la carga baje habría
      que deshacer la cuña, y la cuña se resiste sola.

      **Lo que no cuadra.** Para b) la colección imprime 0,11. Es
      $\tan(\varphi_1 - 5^{\circ}) = 0{,}1106$, y tiene un significado real,
      pero otro: es la fuerza horizontal, en fracción de $Q$, que habría que
      hacer sobre la cuña inferior para **sacarla** con el suelo liso y dejar
      bajar la carga. No es un rozamiento que el suelo tenga que dar para
      sostenerla.

  - id: ejma4-col48-el-cilindro-que-gira-en-la-v
    titulo: El cilindro que gira encajado en una V
    fuente: >-
      Ejercicio 4.8 · Tema 4, «Rozamiento» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección lo marca como especial y publica el resultado,
      contra el que está contrastado el desarrollo.
    nivel: practica
    antes:
      idea: |
        El rozamiento estático vale lo que haga falta, hasta $\mu N$. Cuando
        ya hay deslizamiento, el rozamiento es cinético: vale $\mu N$ y se
        opone a la velocidad relativa del punto de contacto.
      formula: |
        En un sólido que gira con velocidad angular $\omega$ alrededor de su
        centro, la velocidad de un punto es perpendicular al radio que lo une
        al centro. Velocidad angular constante significa momento total nulo.
        Y el momento respecto de $P$ de una fuerza $(F_x;\ F_y)$ aplicada en
        $(x;\ y)$ es

        $$
        M_P = (x - x_P)\,F_y - (y - y_P)\,F_x
        $$
      reconocer: |
        Antes de plantear se lee qué dice el enunciado sobre el movimiento de
        cada contacto.
    enunciado: |
      Un cilindro de masa $M$ y radio $R$ rota con velocidad constante
      $\omega$, tal y como se observar en la figura deslizando sobre ambas
      superficies inclinadas y fijas. El coeficiente de rozamiento entre el
      cilindro y cada superficie es conocido de valor $\mu$. Obtener el momento
      a aplicar sobre el cilindro para que continue con ese movimiento.

      <figure>
