        <text x="210" y="94" font-size="9.5" text-anchor="middle" fill="var(--faint)">L</text>
        <text x="150" y="164" font-size="10" text-anchor="middle" fill="var(--ink)">4M</text>
        <text x="262" y="218" font-size="10" text-anchor="middle" fill="var(--ink)">M</text>
        <circle cx="210" cy="190" r="8" fill="var(--ink)"/>
        <text x="210" y="194" font-size="9.5" text-anchor="middle" fill="var(--paper)">1</text>
        <circle cx="204" cy="160" r="8" fill="var(--ink)"/>
        <text x="204" y="164" font-size="9.5" text-anchor="middle" fill="var(--paper)">2</text>
        <circle cx="210" cy="130" r="8" fill="var(--ink)"/>
        <text x="210" y="134" font-size="9.5" text-anchor="middle" fill="var(--paper)">3</text>
        <text x="52" y="198" font-size="10" text-anchor="end" fill="var(--ink)">O</text>
        <text x="248" y="128" font-size="10" fill="var(--ink)">D</text>
        <text x="246" y="182" font-size="10" fill="var(--ink)">A</text>
        <text x="314" y="186" font-size="10" fill="var(--ink)">B</text>
        <text x="232" y="258" font-size="10" text-anchor="end" fill="var(--ink)">C</text>
        <text x="316" y="232" font-size="9.5" fill="var(--faint)">μ = 1/2</text>
      </svg>
      <figcaption>

      El muelle tiene longitud natural **cero**, así que tira de **D** con
      **kL**. En **A** el apoyo es liso: solo transmite fuerza vertical. Las
      barras **1**, **2** y **3** son la inferior, la diagonal y la superior
      del tramo de la derecha.

      </figcaption>
      </figure>
    pide: Los dos límites de k, la fuerza F en cada caso y los esfuerzos de las barras 1, 2 y 3.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué se puede decir de la suma de la fuerza del muelle y la reacción
          del apoyo $A$, antes de mirar el triángulo?
        opciones:
          - texto: Que vale 2Mg siempre, porque los momentos de la estructura en O la fijan
            correcta: true
            mensaje: |
              Eso es. Las dos actúan a $3L$ de $O$ y el peso $4Mg$ a $1{,}5L$,
              así que $(kL + N_A)\,3L = 4Mg\,1{,}5L$. Lo que cambia con $k$ es
              el **reparto**, no la suma.
          - texto: Que el muelle no interviene, porque su longitud natural es cero
            mensaje: |
              Longitud natural cero significa que la fuerza es $k$ por la
              longitud actual, aquí $kL$: el muelle tira siempre, y con toda esa
              fuerza. Lo que no tiene es tramo sin tensión.
          - texto: Que la reacción en A vale 4Mg, todo el peso del cuadrado
            mensaje: |
              La articulación $O$ también carga. Tomando momentos en $O$, el
              peso a $1{,}5L$ se reparte entre el muelle y el apoyo, que están
              a $3L$: entre los dos suman $2Mg$.

      - tipo: calcular
        titulo: El valor mínimo de la constante
        pregunta: |
          ¿Cuál es el menor valor de $k$ que admite el equilibrio, en unidades
          de $Mg/L$?
        respuesta:
          tipo: numero
          valor: '0.888889'
          tolerancia: 0.004
          formato: un número, k dividido entre M g partido por L
        distractores:
          - valor: '1'
            mensaje: |
              Ese es el valor sin rozamiento en la guía, donde la deslizadera no
              admite ninguna fuerza vertical. El rozamiento es justo lo que abre
              el intervalo alrededor de ese caso.
          - valor: '1.333333'
            mensaje: |
              Has puesto el rozamiento hacia abajo. Si el movimiento inminente
              de $B$ es hacia abajo, el rozamiento de la guía sobre la
              deslizadera apunta hacia **arriba**; ese otro valor es el extremo
              contrario.
        pista: |
          En el triángulo, momentos en $B$ dan $F = 4Mg/3 - N_A$, y el
          equilibrio vertical, $V_B = N_A - Mg$. Impón $V_B = \mu F$.
        desarrollo: |
          $$
          N_A - Mg = \frac{1}{2}\left(\frac{4Mg}{3} - N_A\right)
          \;\Longrightarrow\;
          N_A = \frac{10Mg}{9}
          $$

          $$
          kL = 2Mg - N_A = \frac{8Mg}{9}
          \qquad
          F = \frac{4Mg}{3} - \frac{10Mg}{9} = \frac{2Mg}{9}
          $$

      - tipo: calcular
        titulo: El valor máximo de la constante
        pregunta: |
          ¿Y el mayor valor de $k$, en las mismas unidades?
        respuesta:
          tipo: numero
          valor: '1.333333'
          tolerancia: 0.005
          formato: un número, k dividido entre M g partido por L
        distractores:
          - valor: '1'
            mensaje: |
              Ese es el caso sin rozamiento, que cae justo en medio del
              intervalo. Con $\mu = 1/2$ el equilibrio aguanta entre $8/9$ y
              $4/3$.
          - valor: '0.888889'
            mensaje: |
              Ese es el otro extremo, el que corresponde a la deslizadera a
              punto de bajar. Aquí el rozamiento cambia de sentido y la
              deslizadera está a punto de subir.
        pista: |
          Es el mismo cálculo con $V_B = -\mu F$.
        desarrollo: |
          $$
          N_A - Mg = -\frac{1}{2}\left(\frac{4Mg}{3} - N_A\right)
          \;\Longrightarrow\;
          N_A = \frac{2Mg}{3}
          $$

          $$
          kL = 2Mg - \frac{2Mg}{3} = \frac{4Mg}{3}
          \qquad
          F = \frac{2Mg}{3}
          $$

      - tipo: calcular
        titulo: El esfuerzo de la diagonal
        pregunta: |
          Con $k$ en su valor inferior, ¿cuánto vale el esfuerzo de la barra 2,
          la diagonal, en unidades de $Mg$?
        respuesta:
          tipo: numero
          valor: '2.828427'
          tolerancia: 0.008
          formato: un número, el esfuerzo dividido entre Mg
        distractores:
          - valor: '2'
            mensaje: |
              Esa es la componente vertical que tiene que dar la diagonal, no su
              módulo. La barra está a 45°, así que hay que multiplicar por
              $\sqrt{2}$.
          - valor: '1.257079'
            mensaje: |
              Has contado solo la fuerza del muelle. Por la sección pasan las
              dos fuerzas verticales del tramo, la del muelle y la del apoyo
              $A$, y entre las dos suman $2Mg$ pase lo que pase con $k$.
        pista: |
          Corta el tramo derecho por las tres barras y suma verticales: el
          muelle y el apoyo suman $2Mg$, y la única barra con componente
          vertical es la diagonal.
        desarrollo: |
          $$
          \frac{T_2}{\sqrt{2}} = kL + N_A = 2Mg
          \qquad\Longrightarrow\qquad
          T_2 = 2\sqrt{2}\,Mg \;\text{(tracción)}
          $$

          Y con momentos en $A$ y en $D$ salen las otras dos: la superior a
          compresión con $2Mg$ y la inferior descargada.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Momentos de la estructura en O: la fuerza del muelle más la reacción en A valen 2Mg, con independencia de k.'
          - texto: En el triángulo, momentos en B y equilibrio vertical dan F y la fuerza de rozamiento de la guía, y de ahí los dos límites de k.
          - texto: En el nudo A solo hay una fuerza horizontal, la de la barra inferior, así que esa barra no trabaja.
          - texto: La barra inferior trabaja a compresión con 2Mg y la superior queda descargada.
            trampa: true
            mensaje: |
              Es al revés, y es lo que dice el nudo $A$: allí concurren la
              reacción vertical del apoyo, el montante vertical y la barra
              inferior, que es la única horizontal, así que su esfuerzo es
              **cero**. La comprimida con $2Mg$ es la superior. El resultado
              publicado intercambia los nombres de las dos barras.
    resolucion: |
      **La estructura.** Es un sólido rígido articulado en $O$. Momentos en
      $O$, con el peso $4Mg$ a $1{,}5L$ y el muelle y el apoyo a $3L$:

      $$
      (kL + N_A)\,3L = 4Mg\,(1{,}5L)
      \qquad\Longrightarrow\qquad
      kL + N_A = 2Mg
      $$

      **El triángulo.** Momentos en $B$ y equilibrio vertical, con el apoyo en
      $A$ liso —solo fuerza vertical—:

      $$
      F = \frac{4Mg}{3} - N_A
      \qquad
      V_B = N_A - Mg
      $$

      **Los dos límites.** La deslizadera admite $|V_B| \le \mu\,|H_B| = F/2$:

      $$
      \frac{8Mg}{9L} \le k \le \frac{4Mg}{3L}
      $$

      que es el resultado publicado. La fuerza $F$ no es libre: vale
      $F = kL - 2Mg/3$, o sea $2Mg/9$ en el extremo inferior —el que
      corresponde a $B$ a punto de bajar, como dice el enunciado— y $2Mg/3$ en
      el superior, donde el rozamiento cambia de sentido y $B$ está a punto de
      subir.

      **Las barras.** Con $k = 8Mg/(9L)$ son $N_A = 10Mg/9$ y $kL = 8Mg/9$.
      Cortando el tramo derecho:

      $$
      T_2 = \sqrt{2}\,(kL + N_A) = 2\sqrt{2}\,Mg \;\text{(tracción)}
      $$

      En el nudo $A$ la única fuerza horizontal es la de la barra inferior,
      luego **la barra 1 no trabaja**; y en el nudo $D$, el equilibrio
      horizontal deja **la barra 3 comprimida con $2Mg$**. El resultado
      publicado da los mismos tres valores pero llamando 1 a la superior y 3 a
      la inferior, al revés que la figura.

  - id: ejma4-col420-el-disco-entre-el-plano-y-la-barra
    titulo: El disco entre un plano inclinado y una barra con muelle
    fuente: >-
      Ejercicio 4.20 · Tema 4, «Rozamiento» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección lo marca como de nivel de examen. La colección
      publica el resultado, contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      El sistema mecánico de la figura está en equilibrio en la posición
      mostrada con el disco a punto de descender y de deslizar en $B$. El disco
      de masa $M$ y radio $R\sqrt{3}$ mantiene el contacto en todo momento con
      un plano inclinado y con una barra $OA$. La barra $OA$, de masa $3M$ y
      longitud $6R$ está articulada a un punto fijo $O$ y en su extremo $A$ se
      encuentra atada a un muelle ideal (horizontal en la posición mostrada).
      El coeficiente de rozamiento entre superficies es $f = \frac{\sqrt{3}}{2}$.
      Obtener:

      a. Diagramas de sólido libre del disco y de la barra y ecuaciones
      resultantes.

      b. Constante $k$ del muelle y reacciones en los puntos de contacto del
      disco.

