        <text x="182" y="186" font-size="10" fill="var(--ink)">E</text>
        <text x="166" y="240" font-size="10" text-anchor="end" fill="var(--ink)">O</text>
        <text x="182" y="274" font-size="10" fill="var(--ink)">P</text>
        <text x="100" y="120" font-size="9.5" text-anchor="middle" fill="var(--faint)">2M, 4R</text>
        <text x="238" y="196" font-size="9.5" fill="var(--faint)">M, R</text>
        <text x="238" y="252" font-size="9.5" fill="var(--faint)">M, R</text>
        <text x="60" y="268" font-size="9.5" fill="var(--faint)">f = 1/4</text>
      </svg>
      <figcaption>

      Los tres contactos alineados —**C** con la barra, **E** entre los discos
      y **P** con el suelo— y el muelle tirando de **D** hacia la derecha con
      **3kR**. La fuerza **F** empuja el disco de abajo hacia la izquierda.

      </figcaption>
      </figure>
    pide: La normal en C, el valor máximo de k y la fuerza F del equilibrio estricto.
    pasos:
      - tipo: reconocer
        pregunta: |
          En el disco de arriba, ¿qué relación hay entre el rozamiento en $C$ y
          el rozamiento en $E$?
        opciones:
          - texto: Son iguales, porque son las dos únicas fuerzas con momento respecto de su centro y tienen el mismo brazo R
            correcta: true
            mensaje: |
              Eso es. El peso y el muelle pasan por el centro, y las dos
              normales también. Los dos rozamientos tienen brazo $R$, así que
              momentos en $D$ los iguala.
          - texto: Son iguales porque el coeficiente de rozamiento es el mismo en los dos contactos
            mensaje: |
              El coeficiente igual no obliga a nada mientras no se llegue al
              techo: lo que iguala los dos rozamientos es la ecuación de
              momentos en el centro del disco.
          - texto: Están en la misma proporción que las normales de cada contacto
            mensaje: |
              Eso sería si los dos contactos estuvieran deslizando, y no lo
              están. Las normales son distintas —$4Mg/3$ y $7Mg/3$— y los
              rozamientos, iguales; por eso el contacto crítico es el de arriba.

      - tipo: calcular
        titulo: La normal entre la barra y el disco
        pregunta: |
          ¿Cuánto vale la normal en $C$, en unidades de $Mg$?
        respuesta:
          tipo: numero
          valor: '1.333333'
          tolerancia: 0.005
          formato: un número, la normal dividida entre Mg
        distractores:
          - valor: '1'
            mensaje: |
              Has puesto el peso de la barra en el punto medio del tramo $AC$.
              La barra mide $4R$, así que su centro de gravedad está a $2R$ de
              $A$, no a $1{,}5R$.
          - valor: '2'
            mensaje: |
              Ese es el peso entero de la barra. La articulación $A$ carga con
              su parte: momentos en $A$ dan $N_C\,3R = 2Mg\,2R$.
        pista: |
          Momentos en $A$ sobre la barra. El rozamiento en $C$ es horizontal y
          pasa por la altura de $A$, así que no da momento.
        desarrollo: |
          $$
          N_C\,(3R) = 2Mg\,(2R)
          \qquad\Longrightarrow\qquad
          N_C = \frac{4Mg}{3}
          $$

      - tipo: calcular
        titulo: La constante máxima del muelle
        pregunta: |
          ¿Cuál es el valor máximo de $k$, en unidades de $Mg/R$?
        respuesta:
          tipo: numero
          valor: '0.222222'
          tolerancia: 0.002
          formato: un número, k dividido entre M g partido por R
        distractores:
          - valor: '0.388889'
            mensaje: |
              Has mirado el contacto $E$, donde la normal es mayor y el techo
              también. El que se agota primero es $C$, con la normal más
              pequeña de los tres.
          - valor: '0.444444'
            mensaje: |
              Has cargado toda la fuerza del muelle sobre un solo rozamiento.
              El disco de arriba tiene dos, iguales entre sí, y entre los dos
              equilibran el muelle: cada uno vale $3kR/2$.
        pista: |
          En el disco de arriba, $2F_r = 3kR$, y en $C$ hace falta
          $F_r \le N_C/4$.
        desarrollo: |
          $$
          F_r = \frac{3kR}{2} \le \frac{N_C}{4} = \frac{Mg}{3}
          \qquad\Longrightarrow\qquad
          k \le \frac{2Mg}{9R}
          $$

          En $E$ el techo es $N_E/4 = 7Mg/12$ y en $P$, $10Mg/12$: los dos
          quedan lejos.

      - tipo: calcular
        titulo: La fuerza del equilibrio estricto
        pregunta: |
          Con esa $k$, ¿cuánto vale $F$, en unidades de $Mg$?
        respuesta:
          tipo: numero
          valor: '0.666667'
          tolerancia: 0.004
          formato: un número, la fuerza dividida entre Mg
        distractores:
          - valor: '0.333333'
            mensaje: |
              Te falta el rozamiento del suelo. En el disco de abajo también hay
              dos rozamientos iguales, el de $E$ y el de $P$, y $F$ tiene que
              equilibrar a los dos.
        pista: |
          En el disco de abajo, momentos en su centro igualan el rozamiento de
          $E$ y el de $P$, y los dos empujan en el mismo sentido contra $F$.
        desarrollo: |
          $$
          F = \frac{3kR}{2} + \frac{3kR}{2} = 3kR
          = 3\cdot\frac{2Mg}{9} = \frac{2Mg}{3}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Momentos en A sobre la barra: la normal en C vale cuatro tercios de Mg.'
          - texto: En el disco de arriba los rozamientos de C y de E son iguales y entre los dos equilibran la fuerza del muelle.
          - texto: 'El contacto que se agota primero es C, porque su normal es la más pequeña: de ahí sale k máxima.'
          - texto: 'El contacto crítico es el del suelo, porque ahí la normal es la mayor de las tres: aguanta más fuerza y por eso decide.'
            trampa: true
            mensaje: |
              Es al revés: cuanto mayor es la normal, más alto es el techo
              $\mu N$ y **menos** crítico es el contacto. Los tres rozamientos
              valen aquí lo mismo o menos, y el primero en llegar a su techo es
              el de la normal más pequeña, $C$.
    resolucion: |
      **La barra.** Momentos en $A$, con el peso $2Mg$ a $2R$ y el apoyo a
      $3R$:

      $$
      N_C = \frac{4Mg}{3}
      $$

      **El disco de arriba.** El peso, el muelle y las dos normales pasan por
      su centro, así que momentos en $D$ igualan los rozamientos de $C$ y $E$;
      el equilibrio horizontal reparte entre los dos la fuerza del muelle:

      $$
      F_{r,C} = F_{r,E} = \frac{3kR}{2}
      \qquad
      N_E = N_C + Mg = \frac{7Mg}{3}
      $$

      **Dónde se rompe.** El techo de cada contacto es $N/4$: en $C$ vale
      $Mg/3$, en $E$, $7Mg/12$, y en $P$ —con $N_P = 10Mg/3$—, $5Mg/6$. El
      primero en agotarse es $C$:

      $$
      \frac{3kR}{2} \le \frac{Mg}{3}
      \qquad\Longrightarrow\qquad
      k \le \frac{2Mg}{9R}
      $$

      **La fuerza.** En el disco de abajo se repite el argumento: los
      rozamientos de $E$ y $P$ son iguales y los dos se oponen a $F$,

      $$
      F = 3kR = \frac{2Mg}{3}
      $$

      Los dos valores coinciden con el resultado publicado.

  - id: ejma4-col422-la-viga-con-carga-repartida-y-el-disco
    titulo: La viga con carga repartida y el disco con un par
    fuente: >-
      Ejercicio 4.22 · Tema 4, «Rozamiento» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección lo marca como de nivel de examen. La colección
      publica el resultado, contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Se representa el sistema en su límite de equilibrio. Está formado por los
      elementos siguientes:

      - Viga (1): de masa despreciable y longitud $3R$, la cual soporta una
        carga rectangular de valor máximo $3Mg/R$ así como una carga horizontal
        puntual de valor $F$ desconocido. Está atada al tirante $OA$ en su
        extremo $A$ y articulada en $B$ a un disco.
      - Disco (2): de masa $M$ y radio $R$. Está articulado a la barra por su
        punto $B$ y apoyado sobre un plano horizontal (punto $C$). Sobre él,
        está aplicado además un par de valor conocido $P = 3MgR$. Se considera
        el coeficiente de fricción lo suficientemente grande como para asegurar
        que el movimiento se iniciaría con rodadura del disco.

      a. Tensión del cable $OA$, $T_O$.

      b. Reacciones en el punto $C$.

      c. Si el valor del coeficiente de fricción fuera $f = 1/2$, ¿existiría
      primero rodadura o deslizamiento? Justifica la respuesta.

      <figure>
      <svg viewBox="0 0 420 300" role="img" width="420" height="300" aria-labelledby="ma4c422-t ma4c422-d">
        <title id="ma4c422-t">Viga colgada de un tirante y articulada a un disco apoyado en el suelo</title>
        <desc id="ma4c422-d">Una viga horizontal de longitud tres R va del punto A, colgado del tirante vertical OA, hasta el punto B, articulado al borde de un disco de masa M y radio R que se apoya en el suelo en C. Sobre el tramo central de la viga, entre R y dos R desde A, actúa una carga repartida uniforme de valor tres M g partido por R. En A actúa además una fuerza horizontal F hacia la izquierda. Sobre el disco hay aplicado un par horario de valor tres M g R.</desc>
        <defs>
          <marker id="ma4c422-f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d1)"/>
          </marker>
          <marker id="ma4c422-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
