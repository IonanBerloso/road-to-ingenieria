        <line x1="110" y1="13" x2="110" y2="23" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="190" y1="13" x2="190" y2="23" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="150" y="11" font-size="9" text-anchor="middle" fill="var(--faint)">1 m</text>
        <line x1="232" y1="30" x2="232" y2="190" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="227" y1="30" x2="237" y2="30" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="227" y1="190" x2="237" y2="190" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="241" y="113" font-size="9" fill="var(--faint)">2 m</text>
        <line x1="86" y1="70" x2="86" y2="190" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="81" y1="70" x2="91" y2="70" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="81" y1="190" x2="91" y2="190" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="78" y="133" font-size="9" text-anchor="end" fill="var(--faint)">1,5 m</text>
      </svg>
      </figure>
    pide: La fuerza que lo hace deslizar, la que lo hace volcar y cuál de las dos ocurre antes.
    pasos:
      - tipo: reconocer
        pregunta: |
          El bloque mide 1 m de base y 2 m de alto, y se empuja a 1,5 m del
          suelo. ¿Cómo puede romperse el equilibrio?
        opciones:
          - texto: Deslizando o volcando sobre la arista D, y hay que calcular las dos fuerzas
            correcta: true
            mensaje: |
              Eso es. Son dos equilibrios límite distintos, cada uno con su
              fuerza, y el que ocurre de verdad es el que pide **menos**
              fuerza. La nota de la colección lo dice: en un sólido prismático
              de altura no despreciable hay que considerar las dos.
          - texto: Solo deslizando, porque la fuerza que se aplica es horizontal
            mensaje: |
              Una fuerza horizontal aplicada en alto también da momento
              respecto de la arista D. Si ese momento supera al del peso, el
              bloque vuelca aunque el rozamiento aguantara.
          - texto: Solo volcando, porque el bloque es más alto que ancho
            mensaje: |
              Ser alto y estrecho hace el vuelco más fácil, pero no lo
              garantiza: depende de a qué altura empujes y de cuánto valga
              $\mu$. Con $\mu$ pequeño se desliza antes por muy alto que sea.

      - tipo: calcular
        titulo: La fuerza que lo hace deslizar
        pregunta: |
          ¿Qué valor de $Q$ pone el rozamiento en su máximo? Da el número en
          kg*, las mismas unidades del enunciado.
        respuesta:
          tipo: numero
          valor: '400'
          tolerancia: 1
          formato: un número, en kg*
        distractores:
          - valor: '2500'
            mensaje: |
              Has dividido el peso entre el coeficiente. El rozamiento máximo
              es $\mu N$, un producto: $0{,}4 \cdot 1000$.
          - valor: '3920'
            mensaje: |
              Eso son los 400 kg* pasados a newtons. El enunciado da el peso en
              kg*, así que la respuesta sale en kg* sin multiplicar por $g$.
        pista: |
          Con la fuerza horizontal, la normal es el peso entero: $N = P$. Y en
          el límite, $Q = \mu N$.
        desarrollo: |
          $$
          Q_{\text{desliza}} = \mu\,P = 0{,}4 \cdot 1000 = 400\ \text{kg}*
          $$

          No depende de la altura a la que empujes: deslizar cuesta lo mismo
          empujes donde empujes.

      - tipo: calcular
        titulo: La fuerza que lo hace volcar
        pregunta: |
          Tomando momentos en la arista $D$, ¿qué valor de $Q$ pone el bloque a
          punto de volcar?
        respuesta:
          tipo: numero
          valor: '333.33'
          tolerancia: 1
          formato: un número, en kg*
        distractores:
          - valor: '666.67'
            mensaje: |
              Has usado la base entera, 1 m, como brazo del peso. El peso está
              en el centro de gravedad, a media base de la arista: 0,5 m.
          - valor: '250'
            mensaje: |
              Has usado la altura del bloque, 2 m, como brazo de $Q$. La fuerza
              está aplicada a 1,5 m del suelo, y ese es su brazo respecto de D.
          - valor: '500'
            mensaje: |
              Has puesto la altura del centro de gravedad, 1 m, como brazo de
              $Q$. El brazo de una fuerza se mide donde está aplicada la
              fuerza, y $Q$ está a 1,5 m.
        pista: |
          A punto de volcar, la normal y el rozamiento se concentran en $D$ y
          no dan momento ahí. Queda $Q \cdot 1{,}5 = P \cdot 0{,}5$.
        desarrollo: |
          $$
          Q_{\text{vuelca}} \cdot 1{,}5 = 1000 \cdot 0{,}5
          \;\Longrightarrow\;
          Q_{\text{vuelca}} = \frac{500}{1{,}5} = 333{,}3\ \text{kg}*
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: Para deslizar hace falta vencer el rozamiento máximo, $Q = 0{,}4 \cdot 1000 = 400$ kg*.
          - texto: 'A punto de volcar todo el contacto se concentra en D: la normal y el rozamiento se aplican ahí y no dan momento en D.'
          - texto: Momentos en D, $Q \cdot 1{,}5 = 1000 \cdot 0{,}5$, dan $Q = 333{,}3$ kg*.
          - texto: 'La menor de las dos manda: con 333 kg* el bloque vuelca, y el rozamiento aún no ha llegado a su techo.'
          - texto: Como el rozamiento es una reacción con techo, siempre se agota antes de que el bloque llegue a volcar.
            trampa: true
            mensaje: |
              No hay ningún «siempre»: depende de la geometría. Aquí el bloque
              es alto y se empuja arriba, y el momento tumba con 333 kg* cuando
              deslizar todavía pedía 400.
    resolucion: |
      **Deslizar.** Como $Q$ es horizontal, la normal es el peso entero, y el
      rozamiento llega a su techo cuando

      $$
      Q = \mu P = 0{,}4 \cdot 1000 = 400\ \text{kg}*
      $$

      Ese valor no depende de la altura de aplicación.

      **Volcar.** A punto de volcar, todo el contacto se concentra en la arista
      $D$, donde se aplican la normal y el rozamiento; ninguna de las dos da
      momento en $D$. Con el peso a media base y $Q$ a 1,5 m:

      $$
      Q \cdot 1{,}5 = 1000 \cdot 0{,}5 \;\Longrightarrow\; Q = 333{,}3\ \text{kg}*
      $$

      **Cuál gana.** La menor de las dos, 333 kg*: el bloque **vuelca** antes
      de deslizar, y en ese instante el rozamiento vale 333 kg*, por debajo de
      su techo de 400. Si se empujara más abajo de $0{,}5 \cdot 1000/400 =
      1{,}25$ m, el orden se invertiría y desliza antes.

  - id: ejma4-col42-la-cuna-sobre-dos-bloques
    titulo: La cuña que hace volcar a dos bloques
    fuente: >-
      Ejercicio 4.2 · Tema 4, «Rozamiento» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección lo marca como teórico-práctico y publica el
      resultado, contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      En el sistema de la figura, la cuña de masa $M$ se apoya sobre los dos
      bloques iguales de masa $M$, base $b$ y altura $h$, de forma que forman
      un sistema simétrico. No existe rozamiento entre la cuña y los bloques,
      mientras que el rozamiento entre bloques y suelo impide el
      deslizamiento. Calcular la relación entre $b$ y $h$ cuando se produce el
      vuelco.

