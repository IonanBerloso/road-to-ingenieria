            <text x="56" y="170" font-size="9" text-anchor="end" fill="var(--faint)">√3 R</text>
            <text x="150" y="132" font-size="9" text-anchor="start" fill="var(--faint)">3R</text>
            <line x1="150" y1="246" x2="180" y2="246" stroke="var(--ink)" stroke-width="1" marker-end="url(#dsl-fe)"/>
            <line x1="150" y1="246" x2="150" y2="216" stroke="var(--ink)" stroke-width="1" marker-end="url(#dsl-fe)"/>
            <text x="184" y="249" font-size="9.5" font-style="italic" fill="var(--ink)">x</text>
            <text x="146" y="218" font-size="9.5" font-style="italic" text-anchor="end" fill="var(--ink)">y</text>
            <path d="M217.5 237.5 A11 11 0 1 0 197.7 235.8" fill="none" stroke="var(--ink)" stroke-width="1" marker-end="url(#dsl-fe)"/>
            <text x="223" y="224" font-size="10" fill="var(--ink)">+</text>
          </svg>

      - tipo: calcular
        titulo: El valor mínimo del peso
        pregunta: |
          ¿Cuál es el menor valor de $P$, en unidades de $Mg$?
        respuesta:
          tipo: numero
          valor: '0.357266'
          tolerancia: 0.002
          formato: un número, el peso dividido entre Mg
        distractores:
          - valor: '0.666667'
            mensaje: |
              Con la pared lisa sale eso, y además sale un valor único, no un
              intervalo. El rozamiento de la pared es el que permite que el
              disco aguante con menos tensión en el hilo.
          - valor: '0.618802'
            mensaje: |
              Has igualado la fuerza del hilo a la normal en la barra. Los
              brazos no son iguales: el hilo tira a $3R$ de $O$ y la normal
              actúa a $\sqrt{3}R$, así que $N = \sqrt{3}\,P$.
        pista: |
          Momentos en $O$ sobre la barra dan $N = \sqrt{3}P$; momentos en $G$
          sobre el disco igualan el rozamiento de la barra con el de la pared.
        desarrollo: |
          $$
          T = \frac{2Mg - \sqrt{3}N}{3}
          \qquad
          T \le \tfrac{1}{2}N
          \;\Longrightarrow\;
          N \ge \frac{4Mg}{3 + 2\sqrt{3}}
          $$

          $$
          P_{\min} = \frac{N}{\sqrt{3}} = \frac{4Mg}{6 + 3\sqrt{3}} = 0{,}3573\,Mg
          $$

      - tipo: calcular
        titulo: El valor máximo del peso
        pregunta: |
          ¿Cuál es el mayor valor de $P$, en unidades de $Mg$?
        respuesta:
          tipo: numero
          valor: '4.976068'
          tolerancia: 0.02
          formato: un número, el peso dividido entre Mg
        distractores:
          - valor: '8.619'
            mensaje: |
              Es el valor de la normal $N$ en ese límite, no el del peso. El
              hilo tiene brazo $3R$ y la normal $\sqrt{3}R$, así que hay que
              dividir entre $\sqrt{3}$.
          - valor: '0.357266'
            mensaje: |
              Ese es el otro extremo, el que sale con el rozamiento de la barra
              hacia el otro lado. Aquí el disco tiende a subir y el rozamiento
              en $D$ cambia de sentido.
        pista: |
          Es el mismo cálculo con $T \ge -\tfrac{1}{2}N$.
        desarrollo: |
          $$
          T \ge -\tfrac{1}{2}N
          \;\Longrightarrow\;
          N \le \frac{4Mg}{2\sqrt{3}-3}
          \qquad
          P_{\max} = \frac{4Mg}{6 - 3\sqrt{3}} = 4{,}976\,Mg
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: 'Momentos en O sobre la barra, que no tiene masa: la normal del disco vale raíz de tres por P.'
          - texto: 'Momentos en G sobre el disco: el rozamiento de la barra y el de la pared son iguales, porque los dos tienen brazo R.'
          - texto: El equilibrio se rompe cuando el rozamiento en D llega a la mitad de su normal, y eso ocurre en los dos sentidos.
          - texto: Como en la pared no hay deslizamiento, ahí el rozamiento vale cero y solo queda la normal.
            trampa: true
            mensaje: |
              «No desliza» no es «no hay rozamiento»: es exactamente lo
              contrario. Ese rozamiento existe, vale lo que pida el equilibrio
              y es el que sostiene el disco; con la pared lisa el problema
              tendría una sola solución en vez de un intervalo.
    resolucion: |
      **1. Sólidos libres.** La barra y el disco por separado.

