        <line x1="220" y1="71" x2="220" y2="81" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="197" y="70" font-size="9.5" text-anchor="middle" fill="var(--faint)">R</text>
        <text x="32" y="96" font-size="10" text-anchor="end" fill="var(--ink)">A</text>
