      - tipo: calcular
        titulo: La tangente del ángulo límite
        pregunta: |
          Para poner número, toma $\mu = 0{,}25$. ¿Cuánto vale
          $\tan\alpha$ en el equilibrio límite?
        respuesta:
          tipo: numero
          valor: '0.6'
          tolerancia: 0.005
          formato: un número, la tangente del ángulo
        distractores:
          - valor: '0.25'
            mensaje: |
              Has aplicado $\tan\alpha = \mu$, que es la fórmula del bloque
              sobre un plano inclinado. Aquí no hay plano inclinado: hay dos
              contactos perpendiculares entre sí y un vuelco de por medio.
          - valor: '0.6667'
            mensaje: |
              Sale de olvidar el rozamiento de la pared, $1/(1+2\mu)$. La pared
              también roza, y su rozamiento vertical sujeta parte del peso.
          - valor: '0.7391'
            mensaje: |
              Has puesto el rozamiento de la pared hacia abajo. El vértice
              apoyado en la pared **baja** cuando el bloque se abre, así que el
              rozamiento allí va hacia arriba.
        pista: |
          De las fuerzas salen $N_1 = P/(1+\mu^{2})$ y $N_2 = \mu N_1$. Después,
          momentos en el vértice apoyado en el suelo.
        desarrollo: |
          Fuerzas, con el rozamiento del suelo hacia la pared y el de la pared
          hacia arriba:

          $$
          N_2 = \mu N_1
          \qquad
          N_1 + \mu N_2 = P
          \;\Longrightarrow\;
          N_1 = \frac{P}{1+\mu^{2}}
          $$

          Momentos en el vértice del suelo, donde $N_1$ y su rozamiento no dan
          momento:

          $$
          \tan\alpha = \frac{1-\mu}{1+\mu}
          = \frac{0{,}75}{1{,}25} = 0{,}6
          $$

      - tipo: calcular
        titulo: El ángulo, en grados
        pregunta: |
          Con ese mismo $\mu = 0{,}25$, ¿cuánto vale el ángulo mínimo en grados?
        respuesta:
          tipo: numero
          valor: '30.96'
          tolerancia: 0.1
          formato: un número, en grados
        distractores:
          - valor: '45'
            mensaje: |
              Ese es el caso sin rozamiento, $\mu = 0$: la diagonal vertical y
              el peso justo sobre el apoyo. Con rozamiento el bloque aguanta
              inclinaciones menores.
          - valor: '14.04'
            mensaje: |
              Ese es el ángulo de rozamiento, $\arctan\mu$. Aparece en el
              resultado, pero restándolo de 45°, no como respuesta.
        pista: |
          Ya tienes la tangente. Y hay una forma bonita de leerlo:
          $\alpha = 45^{\circ} - \arctan\mu$.
        desarrollo: |
          $$
          \alpha = \arctan 0{,}6 = 30{,}96^{\circ}
          $$

          Que es exactamente $45^{\circ} - \arctan 0{,}25 = 45^{\circ} -
          14{,}04^{\circ}$. El rozamiento le roba al 45° justo el ángulo de
          rozamiento.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'El bloque se abre: el apoyo del suelo se aleja de la pared y el de la pared baja, así que los rozamientos van hacia la pared y hacia arriba.'
          - texto: De las dos ecuaciones de fuerzas, $N_2 = \mu N_1$ y $N_1 = P/(1+\mu^{2})$.
          - texto: Momentos en el vértice apoyado en el suelo, que elimina $N_1$ y su rozamiento.
          - texto: Sale $\tan\alpha = (1-\mu)/(1+\mu)$, o sea $\alpha = 45^{\circ} - \arctan\mu$.
          - texto: Con más rozamiento el bloque necesita más ángulo, porque el rozamiento empuja hacia fuera.
            trampa: true
            mensaje: |
              Al revés: cuanto mayor es $\mu$, menor es el ángulo mínimo. Con
              $\mu = 0{,}25$ salen 31° y con $\mu = 0{,}4$, 23°. El rozamiento
              ayuda a sujetar, no a escapar.
    resolucion: |
      **1. Sólido libre.** El bloque solo, en el ángulo límite. $A$ es el
      vértice apoyado en el suelo y $B$, el apoyado en la pared.

      <figure class="figura-examen">
      <svg viewBox="0 0 290 252" role="img" width="435" height="378" aria-labelledby="dsl-t dsl-d">
