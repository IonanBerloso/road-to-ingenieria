        <text x="240" y="207" font-size="10" text-anchor="middle" fill="var(--faint)">b</text>
        <line x1="300" y1="60" x2="300" y2="175" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="295" y1="60" x2="305" y2="60" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="295" y1="175" x2="305" y2="175" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="310" y="121" font-size="10" fill="var(--faint)">h</text>
      </svg>
      </figure>
    pide: El cociente entre la base y la altura de los bloques en el instante del vuelco.
    pasos:
      - tipo: reconocer
        pregunta: |
          No hay rozamiento entre la cuña y los bloques. ¿Qué dirección tiene
          entonces la fuerza que la cuña hace sobre cada bloque?
        opciones:
          - texto: Perpendicular a la cara de la cuña, o sea a 30° de la horizontal
            correcta: true
            mensaje: |
              Eso es. Sin rozamiento solo hay normal, y la normal es
              perpendicular a la superficie de contacto. La cara de la cuña
              forma 30° con la vertical, así que su normal forma 30° con la
              horizontal y tiene componente horizontal **y** vertical.
          - texto: Vertical, porque la cuña solo tiene peso
            mensaje: |
              El peso de la cuña es vertical, pero la fuerza de contacto no
              tiene por qué serlo: es perpendicular a la cara inclinada. Si
              fuera vertical, nada empujaría los bloques hacia fuera y no
              habría vuelco posible.
          - texto: Horizontal, porque lo que vuelca los bloques es el empuje lateral
            mensaje: |
              La componente horizontal es la que vuelca, pero no está sola: la
              misma normal tiene una componente vertical que aprieta el bloque
              contra el suelo y **ayuda** a sujetarlo. Dejarla fuera cambia el
              resultado.

      - tipo: calcular
        titulo: La normal que recibe cada bloque
        pregunta: |
          Del equilibrio vertical de la cuña, ¿cuánto vale la normal $N$ sobre
          cada bloque, en unidades de $Mg$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número, N dividido entre Mg
        distractores:
          - valor: '0.5'
            mensaje: |
              Has repartido el peso de la cuña a medias sin proyectar. La
              normal está inclinada 30° sobre la horizontal: lo que vale $Mg/2$
              es su **componente vertical**, no la normal entera.
          - valor: '0.866'
            mensaje: |
              Has multiplicado por el coseno de 30° en vez de dividir entre el
              seno. De $2N\sin 30^{\circ} = Mg$ sale $N = Mg$.
        pista: |
          La cuña recibe dos normales simétricas, cada una a 30° de la
          horizontal. En vertical, $2N\sin 30^{\circ} = Mg$.
        desarrollo: |
          $$
          2\,N \sin 30^{\circ} = Mg
          \;\Longrightarrow\;
          N = \frac{Mg}{2 \cdot 0{,}5} = Mg
          $$

          Cada bloque recibe una fuerza de módulo $Mg$, con componentes
          $Mg\cos 30^{\circ}$ hacia fuera y $Mg\sin 30^{\circ} = Mg/2$ hacia
          abajo, aplicada en su arista superior interior.

      - tipo: calcular
        titulo: La relación entre la base y la altura
        pregunta: |
          Tomando momentos en la arista exterior del bloque de la derecha,
          ¿cuánto vale $b/h$ en el instante del vuelco?
        respuesta:
          tipo: numero
          valor: '0.86603'
          tolerancia: 0.005
          formato: un número, el cociente b entre h
        distractores:
          - valor: '1.7321'
            mensaje: |
              Te has dejado uno de los dos momentos estabilizadores. Con solo
              el peso del bloque, o con solo la componente vertical de la
              normal, sale $\sqrt{3}$, el doble de lo correcto. Los dos actúan
              a la vez.
          - valor: '0.5774'
            mensaje: |
              Has tomado $N = Mg/2$ en lugar de $N = Mg$. La normal no es medio
              peso de la cuña, porque está inclinada.
          - valor: '0.2887'
            mensaje: |
              Has usado 60° donde va 30°. El ángulo del vértice es 60°, así que
              cada cara forma 30° con la vertical y su normal, 30° con la
              horizontal.
        pista: |
          Vuelcan hacia fuera. Sobre la arista exterior, el momento que tumba
          es $Mg\cos 30^{\circ} \cdot h$; los que sujetan son
          $Mg\sin 30^{\circ} \cdot b$ y el peso propio, $Mg \cdot b/2$.
        desarrollo: |
          $$
          Mg\cos 30^{\circ}\,h = Mg\,\frac{b}{2} + Mg\,\frac{b}{2} = Mg\,b
          $$

          $$
          \frac{b}{h} = \cos 30^{\circ} = \frac{\sqrt{3}}{2} = 0{,}866
          $$

          Los dos momentos estabilizadores valen lo mismo, $Mgb/2$ cada uno, y
          por eso se suman en un $Mgb$ limpio.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Sin rozamiento cuña-bloque, la fuerza de contacto es normal a la cara: forma 30° con la horizontal.'
          - texto: Equilibrio vertical de la cuña, $2N\sin 30^{\circ} = Mg$, así que $N = Mg$.
          - texto: Sobre el bloque derecho, la normal da $Mg\cos 30^{\circ}$ hacia fuera en la arista alta y $Mg/2$ hacia abajo en la arista interior.
          - texto: Momentos en la arista exterior, $Mg\cos 30^{\circ}\,h = Mg\,b/2 + Mg\,b/2$, y de ahí $b/h = \sqrt{3}/2$.
          - texto: El rozamiento con el suelo entra en la ecuación de momentos y por eso hace falta conocer su valor.
            trampa: true
            mensaje: |
              El rozamiento está aplicado en la base, y en el vuelco toda la
              base se concentra en la arista exterior: ahí ni la normal ni el
              rozamiento dan momento. Por eso el resultado no contiene $\mu$,
              y por eso el enunciado solo dice que impide el deslizamiento.
    resolucion: |
      **La fuerza de la cuña.** Sin rozamiento entre cuña y bloques, cada
      contacto solo transmite normal, perpendicular a la cara de la cuña. Con
      60° en el vértice, cada cara forma 30° con la vertical y su normal, 30°
      con la horizontal. Del equilibrio vertical de la cuña:

      $$
      2\,N\sin 30^{\circ} = Mg \;\Longrightarrow\; N = Mg
      $$

      **Lo que recibe cada bloque.** Por reacción, en su arista superior
      interior: $Mg\cos 30^{\circ}$ hacia fuera y $Mg\sin 30^{\circ} = Mg/2$
      hacia abajo.

      **El vuelco.** El bloque vuelca hacia fuera, sobre su arista exterior. En
      esa arista se concentran normal y rozamiento del suelo, que no dan
      momento. Quedan tres términos: la componente horizontal tumba con brazo
      $h$, la vertical sujeta con brazo $b$ y el peso propio sujeta con brazo
      $b/2$:

      $$
      Mg\cos 30^{\circ}\,h = Mg\,b + Mg\,\frac{b}{2} - Mg\,\frac{b}{2}
      $$

      Ordenando los dos estabilizadores, $Mg\,b/2 + Mg\,b/2 = Mg\,b$, y

      $$
      \frac{b}{h} = \cos 30^{\circ} = \frac{\sqrt{3}}{2} \approx 0{,}866
      $$

      Comprobado numéricamente montando los momentos con productos vectoriales
      y buscando el cambio de signo: 0,86603.

  - id: ejma4-col43-los-dos-bloques-y-el-cable
    titulo: Dos bloques apilados, con el de arriba atado y suelto
    fuente: >-
      Ejercicio 4.3 · Tema 4, «Rozamiento» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección publica el resultado en «kg*», pero los dos
      números que da son newtons: el desarrollo lo comprueba y lo dice.
    nivel: practica
    enunciado: |
      Si el coeficiente de rozamiento entre todas las superficies es
      $\mu = 0{,}3$, calcular la fuerza $P$ mínima necesaria para el inicio del
      movimiento si:

      a. el bloque $C$ está atado al cable $AB$.

      b. se suelta el cable $AB$.

      <figure>
