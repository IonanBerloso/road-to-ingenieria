ejercicios:
  - id: ejma4-desliza-o-vuelca
    titulo: Un bloque alto, ¿desliza o vuelca?
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    antes:
      idea: |
        El rozamiento seco no tiene un valor fijo: vale lo que haga falta
        para el equilibrio, hasta un techo. Un equilibrio se rompe cuando
        alguna fuerza de contacto llega a su límite.
      formula: |
        El rozamiento cumple $F_r \le \mu_s N$ y se opone al deslizamiento
        que habría sin él. La normal de un apoyo plano es la resultante de un
        reparto de presiones: puede estar en cualquier punto de la base, pero
        no fuera. Y el momento respecto de $P$ de una fuerza $(F_x;\ F_y)$
        aplicada en $(x;\ y)$ es

        $$
        M_P = (x - x_P)\,F_y - (y - y_P)\,F_x
        $$
      reconocer: |
        Antes de calcular se piensa de cuántas maneras distintas podría
        empezar a moverse el cuerpo.
    enunciado: |
      Un bloque de 500 N de peso, con una base de 0,4 m y 1 m de altura,
      descansa sobre un suelo horizontal con coeficiente de rozamiento
      $\mu_s = 0{,}3$. Se le empuja con una fuerza horizontal $Q$ aplicada a
      0,8 m del suelo, en el plano que pasa por su centro de gravedad.
      Determinar el menor valor de $Q$ que rompe el equilibrio, y si el bloque
      desliza o vuelca.
    pide: La fuerza que lo hace deslizar, la que lo hace volcar y cuál es menor.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿De qué maneras puede perder el equilibrio el bloque?
        opciones:
          - texto: Deslizando o volcando sobre la arista delantera, y hay que calcular las dos
            correcta: true
            mensaje: |
              Eso es. Son dos equilibrios límite distintos, cada uno con su
              fuerza, y el que ocurre es el que pide menos fuerza.
          - texto: Solo deslizando, porque la fuerza es horizontal
            mensaje: |
              La fuerza horizontal aplicada en alto también da momento respecto
              de la arista delantera. Si ese momento supera al del peso, el
              bloque vuelca aunque el rozamiento aguante.
          - texto: Solo volcando, porque el rozamiento impide deslizar
            mensaje: |
              El rozamiento tiene un techo, $\mu_s N$. Si la fuerza lo supera
              antes de que el momento tumbe el bloque, desliza.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna ecuación: **dos sólidos libres** del
          bloque, uno a punto de deslizar y otro a punto de volcar. Con los
          ejes y las cotas.
        comprueba:
          - punto: |
              **a) A punto de deslizar: $Q$, el peso en $G$, y en la base $N$
              hacia arriba y $F_r = \mu_s N$ hacia la izquierda.**
            porque: |
              El rozamiento se opone al deslizamiento que habría: el bloque
              iría hacia la derecha.
          - punto: |
              **b) A punto de volcar: $N$ y $F_r$ en la arista delantera.**
            porque: |
              Al empezar a girar, el bloque solo toca el suelo en esa arista.
          - punto: |
              **En b), $F_r$ no vale $\mu_s N$: vale lo que haga falta, hasta
              ese techo.**
            porque: |
              Que vuelque no obliga a que deslice a la vez.
          - punto: |
              **Los brazos respecto de la arista: 0,2 m para el peso y 0,8 m
              para $Q$.**
            porque: |
              Son los de la ecuación de momentos del vuelco.
        figura: |
          <svg viewBox="0 0 450 272" role="img" width="450" height="272" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">Sólidos libres del bloque a punto de deslizar y a punto de volcar</title>
            <desc id="dsl-d">Dos veces el bloque solo, sin el suelo. A la izquierda, a punto de deslizar: la fuerza Q horizontal hacia la derecha a 0,8 m del suelo, el peso P de 500 N en el centro de gravedad G, y en la base la normal N hacia arriba y el rozamiento hacia la izquierda, que vale mu por N. A la derecha, a punto de volcar: las mismas fuerzas, pero la normal y el rozamiento están en la arista delantera. Cotas: 0,2 m del peso a la arista y 0,8 m de altura de Q. Ejes x hacia la derecha e y hacia arriba, y momentos positivos en sentido antihorario.</desc>
            <defs>
              <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
