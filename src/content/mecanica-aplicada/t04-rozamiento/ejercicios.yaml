        <circle cx="120" cy="195" r="45" fill="var(--faint)" fill-opacity="0.12" stroke="var(--ink)" stroke-width="1.3"/>
        <line x1="120" y1="150" x2="300" y2="150" stroke="var(--ink)" stroke-width="4"/>
        <line x1="300" y1="150" x2="210" y2="240" stroke="var(--ink)" stroke-width="4"/>
        <circle cx="120" cy="150" r="4" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
        <circle cx="300" cy="150" r="4" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
        <circle cx="210" cy="240" r="4" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
        <line x1="255" y1="106" x2="255" y2="144" stroke="var(--d1)" stroke-width="2" marker-end="url(#ma4c415-f)"/>
        <text x="248" y="102" font-size="10" text-anchor="end" fill="var(--d1)">P</text>
        <path d="M276 212 A 26 26 0 0 0 242 188" fill="none" stroke="var(--d2)" stroke-width="2" marker-end="url(#ma4c415-g)"/>
