        <line x1="90" y1="115" x2="90" y2="165" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
        <text x="96" y="152" font-size="10" text-anchor="start" fill="var(--flag)">P</text>
        <line x1="100" y1="236" x2="100" y2="194" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="106" y="232" font-size="10" text-anchor="start" fill="var(--d2-tinta)">N</text>
        <line x1="152" y1="190" x2="104" y2="190" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="140" y="182" font-size="10" text-anchor="start" fill="var(--d2-tinta)">F<tspan font-size="7.5" dy="2.5">r</tspan></text>
        <line x1="244" y1="70" x2="288" y2="70" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="254" y="62" font-size="10" text-anchor="start" fill="var(--d2-tinta)">Q</text>
        <line x1="320" y1="115" x2="320" y2="165" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
        <text x="326" y="152" font-size="10" text-anchor="start" fill="var(--flag)">P</text>
        <line x1="350" y1="236" x2="350" y2="194" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
