        <circle cx="150" cy="110" r="3" fill="var(--ink)"/>
        <line x1="150" y1="110" x2="150" y2="168" stroke="var(--ink)" stroke-width="1.5" marker-end="url(#ejma4-col41-g)"/>
        <text x="157" y="158" font-size="11" fill="var(--ink)">P</text>
        <line x1="44" y1="70" x2="106" y2="70" stroke="var(--d1)" stroke-width="2" marker-end="url(#ejma4-col41-f)"/>
        <text x="62" y="62" font-size="11" fill="var(--d1)">Q</text>
