        <path d="M285 116.7 A50 50 0 0 0 235 116.7" fill="none" stroke="var(--ink)" stroke-width="1.3" marker-end="url(#dsl-fe)"/>
        <path d="M328 104 L304 104" fill="none" stroke="var(--ink)" stroke-width="1.3" marker-end="url(#dsl-fe)"/>
        <line x1="104" y1="178" x2="104" y2="146" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
