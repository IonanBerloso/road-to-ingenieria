    pide: Los valores mínimo y máximo de k, y el rozamiento que hace falta en A en cada caso.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuánto se ha deformado el muelle y en qué sentido empuja o tira del
          extremo $E$?
        opciones:
          - texto: Está comprimido R, porque mide R y su longitud natural es 2R, y empuja E hacia el disco
            correcta: true
            mensaje: |
              Eso es. La pared está a $R$ del extremo de la barra y la longitud
              sin tensión es $2R$, así que la deformación es $R$ y el muelle
              **empuja** con $kR$ hacia la izquierda.
          - texto: Está estirado R y tira de E hacia la pared
            mensaje: |
              Si tirara hacia la pared, la barra se separaría del disco y no
              habría contacto en $B$. Lo que sostiene el sistema es
              precisamente que el muelle, comprimido, aprieta la barra contra
              el disco.
          - texto: La fuerza del muelle vale k por 2R, su longitud natural
            mensaje: |
              Un muelle no responde a su longitud natural sino a lo que se ha
              deformado desde ella. Aquí $F = k\,|L - L_0| = k\,(2R-R) = kR$.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna ecuación: **el disco y la barra por
          separado**. Con los ejes, dónde está la masa y las alturas de $B$ y
          de $E$ sobre $D$.
        comprueba:
          - punto: |
              **El disco: $Mg$ en la masa, a $R/2$ del centro; en $A$, $N_A$ y
              $F_A$; en $B$, la normal $N_B$ horizontal y el rozamiento $V_B$
              vertical.**
            porque: |
              En $B$ el disco toca la cara de la barra, que es vertical.
          - punto: |
              **$V_B$ con un sentido supuesto, sin escribir $fN_B$.**
            porque: |
              Según $k$, el contacto está a punto de deslizar hacia un lado o
              hacia el otro: el signo lo dirá.
          - punto: |
              **La barra: el muelle en $E$, a $2R$ de $D$; el disco en $B$, a
              $R$; y la articulación $D$.**
            porque: |
              Son los brazos de los momentos en $D$.
          - punto: |
              **En la barra, $N_B$ y $V_B$ con el sentido cambiado.**
            porque: |
              Lo que el disco le hace a la barra es lo contrario de lo que la
              barra le hace al disco.
        figura: |
          <svg viewBox="0 60 384 262" role="img" width="384" height="262" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">Sólidos libres del disco con la masa soldada y de la barra</title>
            <desc id="dsl-d">A la izquierda, el disco solo, de radio R y centro C: el peso Mg hacia abajo en la masa G, a R medios a la derecha de C; abajo, en A, la normal NA hacia arriba y el rozamiento FA hacia la derecha; y a la derecha, en B, a la altura de C, la normal NB hacia la izquierda y el rozamiento VB hacia arriba, supuesto. A la derecha, la barra vertical DE sola: en E, arriba, el muelle empuja con kR hacia la izquierda; en B, a R de D, NB hacia la derecha y VB hacia abajo; y en D, abajo, Dx hacia la izquierda y Dy hacia arriba. E está a dos R de D. Ejes x hacia la derecha e y hacia arriba, y momentos positivos en sentido antihorario.</desc>
