      - **El disco.** Solo pesa la masa soldada: $Mg$ en $G$, a $R/2$ a la
        derecha del centro. En $A$, $N_A$ y $F_A$; en $B$, la barra lo empuja
        con $N_B$ hacia la izquierda y el rozamiento $V_B$, supuesto hacia
        arriba.
      - **La barra.** Sin masa: el muelle en $E$, con $kR$ hacia la
        izquierda; el disco en $B$, con $N_B$ hacia la derecha y $V_B$ hacia
        abajo; y la articulación $D$, con $D_x$ y $D_y$.

      **2. Incógnitas.** $N_A$, $F_A$, $N_B$, $V_B$, $D_x$, $D_y$ y $k$: siete,
      para las seis ecuaciones de los dos sólidos. La que falta la pone cada
      límite: $V_B = N_B/2$ en un extremo de $k$ y $V_B = -N_B/2$ en el otro.

      **3. Ecuaciones.** La barra, con momentos en $D$: el muelle está a $2R$
      y $B$, a $R$; $V_B$ y $D_y$ van por la vertical de $D$:

      $$
      \sum M_D = 2R\,(kR) - R\,N_B = 0, \qquad
      \sum F_x = -D_x + N_B - kR = 0, \qquad
      \sum F_y = D_y - V_B = 0
      $$

      El disco, con momentos en su centro $C$: $N_B$ pasa por él, $F_A$ y
      $V_B$ tienen brazo $R$ y el peso, $R/2$:

      $$
      \sum M_C = R\,F_A + R\,V_B - \frac{R}{2}\,Mg = 0, \qquad
      \sum F_x = F_A - N_B = 0, \qquad
      \sum F_y = N_A + V_B - Mg = 0
      $$

      **4. Resultados.** De la barra, $N_B = 2kR$; del disco,
      $N_B + V_B = Mg/2$. Con $|V_B| \le N_B/2$:

      $$
      \frac{Mg}{2} - N_B \le \frac{N_B}{2} \;\Rightarrow\; N_B \ge \frac{Mg}{3},
      \qquad
      \frac{Mg}{2} - N_B \ge -\frac{N_B}{2} \;\Rightarrow\; N_B \le Mg
      $$

      $$
      \frac{Mg}{6R} \le k \le \frac{Mg}{2R}
      $$

      Con $k$ pequeña el muelle no aguanta: la masa hace rodar el disco hacia
      la barra y el rozamiento sobre el disco va hacia arriba. Con $k$ grande
      es al revés:

      <figure class="figura-examen">
      <svg viewBox="0 70 372 160" role="img" width="558" height="240" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">Hacia dónde se movería el sistema en cada límite de k</title>
        <desc id="dsl-d">Dos viñetas con el disco, la barra y el muelle. A la izquierda, k mínima: el disco gira en sentido horario y rueda hacia la barra, el extremo E se va hacia la pared y el rozamiento sobre el disco en B va hacia arriba. A la derecha, k máxima: el disco gira en sentido antihorario y se aparta, el extremo E se va hacia el disco y el rozamiento sobre el disco en B va hacia abajo.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
