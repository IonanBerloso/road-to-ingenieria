    pide: Los dos valores extremos de F, en unidades de Mg, entre los que hay equilibrio.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué fija la normal $N$ entre la barra y el disco en $G$?
        opciones:
          - texto: Los momentos en A sobre la barra, y sale Mg partido por raíz de dos sin depender de F
            correcta: true
            mensaje: |
              Eso es. El rozamiento en $G$ va en la dirección de la barra, así
              que pasa por $A$ y no da momento allí. Queda
              $N\,L = Mg\,L\cos 45^\circ$, con la normal independiente de $F$.
          - texto: Hay que resolver antes el disco, porque la normal depende de la fuerza F
            mensaje: |
              La barra sola ya la fija. Su ecuación de momentos en $A$ solo
              contiene el peso y la normal, porque el rozamiento en $G$ tiene la
              dirección de la barra y su recta de acción pasa por $A$.
          - texto: Vale Mg, porque el disco soporta todo el peso de la barra
            mensaje: |
              La barra está articulada en $A$, y la articulación se lleva su
              parte. Además la normal es perpendicular a la barra, no vertical,
              así que ni siquiera equilibra por sí sola un peso vertical.

