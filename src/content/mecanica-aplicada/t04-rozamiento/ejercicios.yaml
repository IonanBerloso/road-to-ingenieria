    pide: La fuerza mínima que inicia el movimiento con el cable puesto y con el cable suelto.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué cambia al soltar el cable $AB$?
        opciones:
          - texto: Con cable, D desliza bajo C y hay dos superficies rozando; sin cable, C y D arrancan juntos y solo roza el suelo
            correcta: true
            mensaje: |
              Eso es. Atado, $C$ no puede acompañar a $D$, así que $D$ tiene que
              vencer el rozamiento de la cara de arriba **y** el del suelo. Al
              soltarlo, nada impide que los dos se muevan a la vez, y entonces
              la cara entre ellos no desliza.
          - texto: Nada importante, porque el peso total que aprieta el suelo es el mismo
            mensaje: |
              La normal del suelo sí es la misma, 250 kg de peso en los dos
              casos. Lo que cambia es si la superficie entre $C$ y $D$ desliza
              o no, y ese rozamiento solo se paga cuando desliza.
          - texto: Que sin cable hace falta más fuerza, porque ahora hay que arrastrar también a C
            mensaje: |
              Al revés, y es lo que hace bonito el problema: hace falta
              **menos**. Arrastrar los dos juntos no cuesta rozamiento extra en
              la cara común, porque ahí no hay deslizamiento.

      - tipo: calcular
        titulo: Con el cable puesto
        pregunta: |
          Con $C$ atado, ¿qué fuerza $P$ mínima pone $D$ en movimiento?
        respuesta:
          tipo: magnitud
          valor: '1030 N'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '736 N'
            mensaje: |
              Te has dejado el rozamiento de la cara superior. $D$ desliza
              contra $C$, que está atado, así que además del suelo hay que
              vencer $\mu$ por el peso de $C$.
          - valor: '441 N'
            mensaje: |
              Has puesto en la normal del suelo solo el peso de $D$. El suelo
              aguanta los dos bloques: 250 kg, no 150.
          - valor: '1030 kgf'
            mensaje: |
              Ese es el número impreso leído como kilogramos-fuerza. La
              colección escribe «kg*», pero 1030 sale en **newtons**: en kg*
              serían 105.
        pista: |
          Dos superficies rozan: la de arriba con el peso de $C$ y la del suelo
          con el peso de los dos. Pasa los kilos a newtons con $g$.
        desarrollo: |
          $$
          P = \mu\,m_C\,g + \mu\,(m_C + m_D)\,g
          = 0{,}3 \cdot 100 \cdot 9{,}81 + 0{,}3 \cdot 250 \cdot 9{,}81
          $$

          $$
          P = 294{,}3 + 735{,}8 = 1030\ \text{N}
          $$

          Que en kg* son 105, y es lo que la colección imprime como «1030 kg*».

      - tipo: calcular
        titulo: Con el cable suelto
        pregunta: |
          Al soltar el cable, ¿qué fuerza $P$ mínima inicia el movimiento?
        respuesta:
          tipo: magnitud
          valor: '736 N'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '1030 N'
            mensaje: |
              Sigues pagando el rozamiento de la cara entre $C$ y $D$. Sin
              cable los dos arrancan juntos, esa cara no desliza y ahí el
              rozamiento no llega a su techo.
          - valor: '441 N'
            mensaje: |
              Has usado solo el peso de $D$ en la normal del suelo. Aunque se
              muevan juntos, el suelo soporta los 250 kg de los dos.
        pista: |
          Se mueven en bloque. Solo desliza la superficie del suelo, y la
          normal ahí es el peso de los dos.
        desarrollo: |
          $$
          P = \mu\,(m_C + m_D)\,g = 0{,}3 \cdot 250 \cdot 9{,}81 = 735{,}8\ \text{N}
          $$

          Comprobación de que este es el modo que gana: el otro camino posible
          —que $D$ deslizara bajo $C$ dejándolo quieto— pediría los 1030 N de
          antes, más que 736.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Con el cable, C está sujeto: D desliza contra C y contra el suelo, y hay que vencer los dos rozamientos.'

          - texto: La normal del suelo vale el peso de los dos bloques, 250 kg, en los dos apartados.
          - texto: 'Con cable: $P = 0{,}3 \cdot 100g + 0{,}3 \cdot 250g = 1030$ N.'
          - texto: 'Sin cable: los dos arrancan juntos, la cara común no desliza y $P = 0{,}3 \cdot 250g = 736$ N.'
          - texto: Al soltar el cable hace falta más fuerza, porque ahora P tiene que mover también la masa de C.
            trampa: true
            mensaje: |
              Esto es estática, no dinámica: se busca la fuerza que rompe el
              equilibrio, no la que acelera una masa. Y sale **menos** fuerza,
              porque desaparece una superficie deslizante.
    resolucion: |
      **Con el cable (apartado a).** El cable impide que $C$ acompañe a $D$, así
      que $D$ desliza contra dos superficies: la cara superior, con normal el
      peso de $C$, y el suelo, con normal el peso de los dos.

      $$
      P = \mu\,m_C\,g + \mu\,(m_C+m_D)\,g = 294{,}3 + 735{,}8 = 1030\ \text{N}
      $$

      **Sin el cable (apartado b).** Ya nada retiene a $C$, y el conjunto arranca
      como un solo cuerpo. La cara entre $C$ y $D$ **no** desliza —en el
      instante límite ni siquiera necesita rozamiento— y solo se paga el suelo:

      $$
      P = \mu\,(m_C+m_D)\,g = 735{,}8\ \text{N}
      $$

      **Sobre las unidades del resultado impreso.** La colección publica
      «$P = 1030$ kg*» y «$P = 736$ kg*». Los números son correctos, pero son
      **newtons**: en kilogramos-fuerza salen 105 y 75. Se ve sin calcular
      nada, comparando con el peso total, que es 250 kg*: ninguna fuerza de
      rozamiento con $\mu = 0{,}3$ puede valer 1030 kg*, cuatro veces el peso.

  - id: ejma4-col44-el-bloque-sujeto-con-un-cable-inclinado
    titulo: El bloque atado a la pared con un cable inclinado
    fuente: >-
      Ejercicio 4.4 · Tema 4, «Rozamiento» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección publica el resultado, contra el que está
      contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Un bloque A de peso $P_a = 500\ \text{kg}*$, está apoyado sobre un bloque
      $B$ de peso $P_b = 1.000\ \text{kg}*$ y éste sobre una superficie
      horizontal plana. Si el bloque $A$ está sujeto a la pared vertical
      mediante un cable inclinado un ángulo de $30^{\circ}$, determinar la
      mínima fuerza $F$ horizontal que es necesario aplicar sobre el bloque $B$
      para que deslice. Datos: rozamiento entre $A$ y $B$,
      $\mu_1 = 0{,}2$; rozamiento entre $B$ y suelo, $\mu_2 = 0{,}3$.

      <figure>
      <svg viewBox="0 0 320 245" role="img" width="320" height="245" aria-labelledby="ejma4-col44-t ejma4-col44-d">
        <title id="ejma4-col44-t">Bloque A atado a la pared con un cable a 30 grados, sobre el bloque B</title>
        <desc id="ejma4-col44-d">Una pared vertical a la izquierda y un suelo horizontal. Sobre el suelo, un bloque B; encima de él, un bloque A más pequeño. Un cable recto une la pared con la esquina superior izquierda de A, formando un ángulo alfa de 30 grados con la horizontal. Una fuerza F horizontal empuja el bloque B hacia la derecha.</desc>
        <defs>
          <marker id="ejma4-col44-f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d1)"/>
          </marker>
        </defs>
        <line x1="50" y1="20" x2="50" y2="205" stroke="var(--ink)" stroke-width="1.4"/>
        <path d="M50 28 L42 36 M50 48 L42 56 M50 68 L42 76 M50 88 L42 96 M50 108 L42 116 M50 128 L42 136 M50 148 L42 156 M50 168 L42 176 M50 188 L42 196 M50 203 L42 211" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="50" y1="205" x2="300" y2="205" stroke="var(--ink)" stroke-width="1.4"/>
        <path d="M65 205 L57 213 M95 205 L87 213 M125 205 L117 213 M155 205 L147 213 M185 205 L177 213 M215 205 L207 213 M245 205 L237 213 M275 205 L267 213 M298 205 L290 213" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <rect x="130" y="115" width="130" height="90" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.4"/>
        <rect x="130" y="40" width="85" height="75" fill="var(--faint)" fill-opacity="0.28" stroke="var(--ink)" stroke-width="1.4"/>
        <line x1="52" y1="43" x2="130" y2="88" stroke="var(--ink)" stroke-width="1.6"/>
        <circle cx="52" cy="43" r="3" fill="var(--ink)"/>
        <circle cx="130" cy="88" r="3" fill="var(--ink)"/>
        <line x1="78" y1="88" x2="130" y2="88" stroke="var(--faint)" stroke-width="0.8" stroke-dasharray="3 2"/>
        <path d="M104 88 A 26 26 0 0 0 96.5 69.7" fill="none" stroke="var(--ink)" stroke-width="0.9"/>
        <text x="96" y="82" font-size="10" fill="var(--ink)">α</text>
        <text x="205" y="58" font-size="10" text-anchor="middle" fill="var(--flag)">A</text>
        <text x="250" y="132" font-size="10" text-anchor="middle" fill="var(--flag)">B</text>
        <line x1="260" y1="160" x2="308" y2="160" stroke="var(--d1)" stroke-width="2" marker-end="url(#ejma4-col44-f)"/>
        <text x="278" y="152" font-size="11" fill="var(--d1)">F</text>
      </svg>
      </figure>
    pide: La tensión del cable y la fuerza horizontal mínima que hace deslizar a B.
    pasos:
      - tipo: reconocer
        pregunta: |
          $B$ desliza hacia la derecha y $A$ se queda sujeto por el cable. ¿Qué
          hace el cable, además de retener a $A$?
        opciones:
          - texto: Tira de A hacia arriba con su componente vertical, y eso descarga la normal entre A y B
            correcta: true
            mensaje: |
              Eso es, y es la clave del problema. El cable está inclinado 30°,
              así que además de retener a $A$ lo levanta un poco: la normal
              entre $A$ y $B$ ya no vale $P_a$, sino $P_a - T\sin 30^{\circ}$.
          - texto: Nada más, la normal entre A y B sigue valiendo el peso de A
            mensaje: |
              Solo sería así con el cable horizontal. Inclinado 30° tiene
              componente vertical hacia arriba, que aligera el apoyo de $A$
              sobre $B$ y reduce los dos rozamientos.
          - texto: Aprieta A contra B, porque el cable va desde arriba hacia abajo
            mensaje: |
              Mira el sentido: el cable sale de la pared **por encima** de $A$ y
              baja hasta él, así que la tensión sobre $A$ apunta hacia arriba y
              hacia la izquierda. Lo levanta, no lo aprieta.

      - tipo: calcular
        titulo: La tensión del cable
        pregunta: |
          Escribiendo el equilibrio de $A$, ¿cuánto vale la tensión $T$ del
          cable?
        respuesta:
          tipo: magnitud
          valor: '1015.5 N'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '1132.7 N'
            mensaje: |
              Has tomado la normal entre $A$ y $B$ igual a $P_a$, olvidando que
              el cable descarga el apoyo. La normal es
              $P_a - T\sin 30^{\circ}$, y como depende de $T$, hay que
              despejarla de la propia ecuación.
          - valor: '981 N'
            mensaje: |
              Eso es $\mu_1 P_a$ sin dividir por el coseno. Solo la componente
              horizontal del cable equilibra el rozamiento, así que
              $T\cos 30^{\circ} = \mu_1 N_1$.
        pista: |
          En $A$: horizontal $T\cos 30^{\circ} = \mu_1 N_1$; vertical
          $N_1 = P_a - T\sin 30^{\circ}$. Sustituye una en otra y despeja.
        desarrollo: |
          $$
          T\cos 30^{\circ} = \mu_1\,(P_a - T\sin 30^{\circ})
          $$

          $$
          T\,(0{,}866 + 0{,}2 \cdot 0{,}5) = 0{,}2 \cdot 500 \cdot 9{,}81
          \;\Longrightarrow\;
          T = \frac{981}{0{,}966} = 1015{,}5\ \text{N}
          $$

          Con ella, $N_1 = 4905 - 507{,}8 = 4397{,}2\ \text{N}$.

      - tipo: calcular
        titulo: La fuerza que hace deslizar a B
        pregunta: |
          ¿Cuánto vale la fuerza $F$ mínima?
        respuesta:
          tipo: magnitud
          valor: '5141.6 N'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '5395.5 N'
            mensaje: |
              Has ignorado la componente vertical del cable. Con
              $N_1 = P_a$ salen rozamientos mayores de la cuenta, arriba y
              abajo, y $F$ se va por encima de lo real.
          - valor: '4262.2 N'
            mensaje: |
              Te has dejado el rozamiento que $A$ hace sobre $B$ por arriba.
              $B$ desliza contra dos superficies, no solo contra el suelo.
          - valor: '3822.4 N'
            mensaje: |
              Has puesto en la normal del suelo solo el peso de $B$. El suelo
              soporta también lo que $A$ apoya sobre $B$, o sea $N_1$.
        pista: |
          En $B$: $F = \mu_1 N_1 + \mu_2 N_2$, con $N_2 = N_1 + P_b$. Ojo, $N_1$
          no es $P_a$.
        desarrollo: |
          $$
          N_2 = N_1 + P_b = 4397{,}2 + 9810 = 14207{,}2\ \text{N}
          $$

          $$
          F = \mu_1 N_1 + \mu_2 N_2 = 0{,}2 \cdot 4397{,}2 + 0{,}3 \cdot 14207{,}2
          $$

          $$
          F = 879{,}4 + 4262{,}2 = 5141{,}6\ \text{N}
          $$

          Coincide con el resultado impreso, que está calculado con
          $g = 9{,}81$. Con $g = 9{,}8$ salen 5136 N, un 0,1 % menos.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'El cable tira de A hacia arriba y hacia la izquierda: la normal entre A y B es $N_1 = P_a - T\sin 30^{\circ}$.'
          - texto: B desliza bajo A, así que el rozamiento sobre A vale $\mu_1 N_1$ y lo equilibra $T\cos 30^{\circ}$.
          - texto: De ahí $T = 1015{,}5$ N y $N_1 = 4397{,}2$ N.
          - texto: 'En el suelo, $N_2 = N_1 + P_b = 14207$ N, y $F = \mu_1 N_1 + \mu_2 N_2 = 5141{,}6$ N.'
          - texto: Como el cable está inclinado, también hay que restar su componente horizontal en el equilibrio de B.
            trampa: true
            mensaje: |
              El cable está atado a $A$ y a la pared, no a $B$. Sobre $B$ solo
              actúan su peso, $F$, el suelo y lo que le pasa $A$ por el
              contacto: normal $N_1$ y rozamiento $\mu_1 N_1$.
    resolucion: |
      **El bloque A.** Está en equilibrio, retenido por el cable. $B$ se le
      escapa por debajo hacia la derecha, así que el rozamiento que $B$ hace
      sobre $A$ apunta a la derecha y vale $\mu_1 N_1$. El cable tira hacia
      arriba y a la izquierda:

      $$
      T\cos 30^{\circ} = \mu_1 N_1
      \qquad
      N_1 = P_a - T\sin 30^{\circ}
      $$

      $$
      T = \frac{\mu_1 P_a}{\cos 30^{\circ} + \mu_1 \sin 30^{\circ}}
      = \frac{981}{0{,}966} = 1015{,}5\ \text{N}
      \qquad
      N_1 = 4397{,}2\ \text{N}
      $$

      La inclinación del cable importa: descarga el apoyo de $A$ en 508 N.

      **El bloque B.** Recibe por arriba $N_1$ y $\mu_1 N_1$, y se apoya en el
      suelo con $N_2 = N_1 + P_b$:

      $$
      F = \mu_1 N_1 + \mu_2 (N_1 + P_b) = 879{,}4 + 4262{,}2 = 5141{,}6\ \text{N}
      $$

      Coincide exactamente con el resultado publicado. Comprobado además
      resolviendo el sistema de cuatro ecuaciones de golpe.

  - id: ejma4-col45-la-varilla-apoyada-en-la-columna
    titulo: La varilla apoyada en una columna y atada por un extremo
    fuente: >-
      Ejercicio 4.5 · Tema 4, «Rozamiento» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección publica el resultado en símbolos, y el desarrollo
      reproduce las dos fórmulas.
    nivel: practica
    enunciado: |
      Una varilla sin peso de longitud total $l$ se apoya en $C$ sobre una
      columna. Su extremo $B$ sujeta con una cuerda atada en $D$ y su otro
      extremo en $A$ va cargado con un peso $P$. Son datos conocidos las
      distancias $a$, $b$ y los ángulos $\alpha$ y $\beta$. Determinar:

      a. La fuerza de la cuerda $BD$.

      b. Valor del coeficiente de rozamiento en $C$ para que se produzca el
      equilibrio.

      <figure>
      <svg viewBox="0 0 350 290" role="img" width="350" height="290" aria-labelledby="ejma4-col45-t ejma4-col45-d">
        <title id="ejma4-col45-t">Varilla apoyada en el extremo de una columna, con un peso en un extremo y una cuerda en el otro</title>
        <desc id="ejma4-col45-d">Una columna vertical apoyada en el suelo por su base D. En su extremo superior C se apoya una varilla inclinada, que baja hacia la izquierda hasta el extremo A y sube hacia la derecha hasta el extremo B. Del extremo A cuelga un peso P. Una cuerda tensa une el extremo B con la base D de la columna. El ángulo alfa se mide en C entre la varilla y la columna, y el ángulo beta en B entre la varilla y la cuerda. La distancia de A a C es a, la de B a C es b, y la longitud total de la varilla es l.</desc>
        <line x1="145" y1="115" x2="145" y2="245" stroke="var(--ink)" stroke-width="1.3"/>
        <line x1="155" y1="115" x2="155" y2="245" stroke="var(--ink)" stroke-width="1.3"/>
        <rect x="105" y="245" width="100" height="8" fill="var(--faint)" fill-opacity="0.3" stroke="var(--ink)" stroke-width="1"/>
        <path d="M112 253 L104 261 M132 253 L124 261 M152 253 L144 261 M172 253 L164 261 M192 253 L184 261 M204 253 L196 261" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="82.4" y1="133.1" x2="285.2" y2="78.7" stroke="var(--ink)" stroke-width="4"/>
        <line x1="285.2" y1="78.7" x2="155" y2="245" stroke="var(--ink)" stroke-width="1"/>
        <line x1="82.4" y1="133.1" x2="82.4" y2="163" stroke="var(--ink)" stroke-width="1"/>
        <rect x="58" y="163" width="48" height="42" fill="var(--faint)" fill-opacity="0.25" stroke="var(--ink)" stroke-width="1.2"/>
        <text x="82" y="190" font-size="12" text-anchor="middle" fill="var(--ink)">P</text>
        <circle cx="150" cy="115" r="3.2" fill="var(--flag)"/>
        <text x="60" y="127" font-size="11" fill="var(--ink)">A</text>
        <text x="291" y="74" font-size="11" fill="var(--ink)">B</text>
        <text x="141" y="106" font-size="11" text-anchor="end" fill="var(--ink)">C</text>
        <text x="139" y="243" font-size="11" text-anchor="end" fill="var(--ink)">D</text>
        <path d="M150 150 A 35 35 0 0 0 116.4 124.2" fill="none" stroke="var(--ink)" stroke-width="0.9"/>
        <text x="126" y="147" font-size="11" fill="var(--ink)">α</text>
        <path d="M251.4 87.7 A 35 35 0 0 0 263.6 116.8" fill="none" stroke="var(--ink)" stroke-width="0.9"/>
        <text x="252" y="111" font-size="11" fill="var(--ink)">β</text>
        <text x="215" y="196" font-size="10" fill="var(--faint)">AC = a</text>
        <text x="215" y="214" font-size="10" fill="var(--faint)">BC = b</text>
        <text x="215" y="232" font-size="10" fill="var(--faint)">ACB = l</text>
      </svg>
      </figure>
    pide: La tensión de la cuerda BD y el coeficiente de rozamiento necesario en C, en función de los datos.
    pasos:
      - tipo: reconocer
        pregunta: |
          La varilla se apoya en el canto de la columna. ¿Cómo es la reacción
          en $C$?
        opciones:
          - texto: Normal perpendicular a la varilla y rozamiento a lo largo de ella
            correcta: true
            mensaje: |
              Eso es. Quien manda es la superficie de la varilla, que es la que
              apoya sobre el canto: la normal sale perpendicular a la varilla y
              el rozamiento va en su dirección, que es por donde deslizaría.
          - texto: Normal vertical y rozamiento horizontal, como en cualquier apoyo sobre el suelo
            mensaje: |
              Eso valdría si la varilla estuviera horizontal. Aquí está
              inclinada, y la varilla desliza **a lo largo de sí misma** sobre
              el canto, así que las dos componentes van giradas ese mismo
              ángulo. Sale un coeficiente distinto y equivocado.
          - texto: Solo normal, porque un apoyo puntual no puede transmitir rozamiento
            mensaje: |
              Un apoyo puntual sí transmite rozamiento; de hecho el apartado b
              pregunta exactamente cuánto hace falta. Sin él la varilla
              resbalaría sobre el canto.

      - tipo: calcular
        titulo: La tensión de la cuerda
        pregunta: |
          Toma momentos en $C$. Para fijar el número, usa estos valores
          nuestros, parecidos a los de la figura: $a = 1$ m, $b = 2$ m,
          $\alpha = 75^{\circ}$ y $\beta = 40^{\circ}$. ¿Cuánto vale el
          cociente $T/P$?
        respuesta:
          tipo: numero
          valor: '0.7514'
          tolerancia: 0.003
          formato: un número, el cociente T entre P
        distractores:
          - valor: '0.1689'
            mensaje: |
              Has usado cosenos donde van senos. El brazo de una fuerza es la
              distancia perpendicular a su línea de acción, y aquí sale
              $a\sin\alpha$ para el peso y $b\sin\beta$ para la cuerda.
          - valor: '0.483'
            mensaje: |
              Has tomado $b$ como brazo de la tensión. La cuerda no es
              perpendicular a la varilla, así que su brazo respecto de $C$ es
              $b\sin\beta$, no $b$.
          - valor: '1.3309'
            mensaje: |
              Has invertido el cociente. Con $b$ mayor que $a$, la cuerda tiene
              más brazo que el peso y por eso necesita menos fuerza que $P$.
        pista: |
          En $C$ no dan momento ni la normal ni el rozamiento. Queda
          $T\,b\sin\beta = P\,a\sin\alpha$.
        desarrollo: |
          $$
          T\,b\sin\beta = P\,a\sin\alpha
          \;\Longrightarrow\;
          T = \frac{a\sin\alpha}{b\sin\beta}\,P
          $$

          Con los valores de arriba:

          $$
          \frac{T}{P} = \frac{1 \cdot \sin 75^{\circ}}{2 \cdot \sin 40^{\circ}}
          = \frac{0{,}9659}{1{,}2856} = 0{,}7514
          $$

      - tipo: calcular
        titulo: El coeficiente de rozamiento en C
        pregunta: |
          Con los mismos valores ($a = 1$ m, $b = 2$ m, $\alpha = 75^{\circ}$,
          $\beta = 40^{\circ}$, y por tanto $l = 3$ m), ¿cuánto vale el
          coeficiente de rozamiento mínimo en $C$?
        respuesta:
          tipo: numero
          valor: '0.5759'
          tolerancia: 0.003
          formato: un número, sin unidad
        distractores:
          - valor: '0.2668'
            mensaje: |
              Has puesto la normal vertical y el rozamiento horizontal. En un
              apoyo sobre el canto de la columna, la normal es perpendicular a
              la **varilla**, no al suelo.
          - valor: '0.8638'
            mensaje: |
              Te has dejado la tensión en la ecuación de la normal. La cuerda
              también tiene componente perpendicular a la varilla, y aumenta
              $N$; con una $N$ más pequeña el cociente sale mayor.
          - valor: '0.1786'
            mensaje: |
              Te has dejado la tensión en la componente a lo largo de la
              varilla. El rozamiento tiene que equilibrar el peso **y** la
              cuerda proyectados sobre la varilla.
        pista: |
          Proyecta las tres fuerzas sobre la varilla y sobre su perpendicular.
          Después, $\mu \ge F/N$.
        desarrollo: |
          Perpendicular a la varilla y a lo largo de ella:

          $$
          N = P\sin\alpha + T\sin\beta = \frac{P\,l\sin\alpha}{b}
          \qquad
          F = P\cos\alpha + T\cos\beta
          $$

          $$
          \mu \ge \frac{F}{N}
          = \frac{1}{l}\left(\frac{b\cos\alpha}{\sin\alpha}
          + \frac{a\cos\beta}{\sin\beta}\right)
          $$

          Con los valores de arriba, $N/P = 1{,}4489$ y $\mu = 0{,}5759$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'En C se apoya la varilla sobre el canto: la normal es perpendicular a la varilla y el rozamiento va en su dirección.'
          - texto: Momentos en C eliminan las dos incógnitas del apoyo y dan $T\,b\sin\beta = P\,a\sin\alpha$.
          - texto: Proyectando sobre la perpendicular, $N = P\sin\alpha + T\sin\beta$, que se simplifica a $P\,l\sin\alpha/b$.
          - texto: Proyectando sobre la varilla, $F = P\cos\alpha + T\cos\beta$, y $\mu \ge F/N$ da la fórmula del enunciado.
          - texto: Como la varilla no tiene peso, el rozamiento en C es nulo y el equilibrio no necesita ningún coeficiente.
            trampa: true
            mensaje: |
              Que la varilla no pese no quiere decir que no esté cargada: en
              $A$ cuelga $P$ y en $B$ tira la cuerda. Las dos tienen componente
              a lo largo de la varilla, y alguien tiene que equilibrarlas: el
              rozamiento en $C$.
    resolucion: |
      **Las incógnitas.** La varilla no pesa y recibe tres cosas: el peso $P$ en
      $A$, la tensión de la cuerda en $B$ y la reacción del apoyo en $C$, con
      dos componentes: $N$ perpendicular a la varilla y $F$ a lo largo de ella.

      **Momentos en C, que es lo que resuelve el apartado a.** Ni $N$ ni $F$ dan
      momento ahí. El brazo del peso es $a\sin\alpha$ y el de la cuerda,
      $b\sin\beta$:

      $$
      T\,b\sin\beta = P\,a\sin\alpha
      \;\Longrightarrow\;
      T = \frac{a\sin\alpha}{b\sin\beta}\,P
      $$

      **Las proyecciones, para el apartado b.** Perpendicular a la varilla,

      $$
      N = P\sin\alpha + T\sin\beta
      = P\sin\alpha\left(1 + \frac{a}{b}\right) = \frac{P\,l\sin\alpha}{b}
      $$

      y a lo largo de ella, $F = P\cos\alpha + T\cos\beta$. El equilibrio exige
      $F \le \mu N$:

      $$
      \mu \ge \frac{1}{l}\left(\frac{b\cos\alpha}{\sin\alpha}
      + \frac{a\cos\beta}{\sin\beta}\right)
      $$

      Las dos coinciden con lo publicado. Comprobado además montando las tres
      ecuaciones con vectores y resolviéndolas numéricamente para
      $a = 1$, $b = 2$, $\alpha = 75^{\circ}$ y $\beta = 40^{\circ}$: 0,75136 y
      0,57588, iguales hasta la quinta cifra.

  - id: ejma4-col46-el-bloque-cuadrado-entre-suelo-y-pared
    titulo: El bloque cuadrado encajado entre el suelo y la pared
    fuente: >-
      Ejercicio 4.6 · Tema 4, «Rozamiento» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección publica el resultado, contra el que está
      contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Un bloque prismático de sección cuadrada está apoyado sobre una
      superficie horizontal y otra vertical. Determinar el menor valor del
      ángulo para el cual el bloque está en equilibrio. Datos: peso del bloque
      $P$, longitud del lado de la sección $L$, coeficiente de rozamiento en
      todas las superficies $\mu$.

      <figure>
      <svg viewBox="0 0 265 235" role="img" width="265" height="235" aria-labelledby="ejma4-col46-t ejma4-col46-d">
        <title id="ejma4-col46-t">Bloque de sección cuadrada apoyado a la vez en una pared vertical y en el suelo</title>
        <desc id="ejma4-col46-d">Un rincón formado por una pared vertical a la izquierda y un suelo horizontal. Un bloque de sección cuadrada aparece girado, apoyado en dos vértices opuestos: uno toca la pared y el otro toca el suelo. El ángulo alfa se mide en el suelo, entre el suelo y el lado del cuadrado que va del vértice apoyado en el suelo al vértice apoyado en la pared.</desc>
        <line x1="55" y1="15" x2="55" y2="185" stroke="var(--ink)" stroke-width="1.4"/>
        <path d="M55 23 L47 31 M55 43 L47 51 M55 63 L47 71 M55 83 L47 91 M55 103 L47 111 M55 123 L47 131 M55 143 L47 151 M55 163 L47 171 M55 183 L47 191" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="55" y1="185" x2="245" y2="185" stroke="var(--ink)" stroke-width="1.4"/>
        <path d="M70 185 L62 193 M100 185 L92 193 M130 185 L122 193 M160 185 L152 193 M190 185 L182 193 M220 185 L212 193 M243 185 L235 193" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <path d="M150 185 L55 105.3 L134.7 10.3 L229.7 90 z" fill="var(--faint)" fill-opacity="0.22" stroke="var(--ink)" stroke-width="1.5"/>
        <circle cx="150" cy="185" r="3.2" fill="var(--flag)"/>
        <circle cx="55" cy="105.3" r="3.2" fill="var(--flag)"/>
        <path d="M120 185 A 30 30 0 0 0 126.9 165.9" fill="none" stroke="var(--ink)" stroke-width="0.9"/>
        <text x="118" y="177" font-size="11" text-anchor="end" fill="var(--ink)">α</text>
        <text x="185" y="120" font-size="11" text-anchor="middle" fill="var(--ink)">L</text>
        <text x="152" y="207" font-size="9" fill="var(--faint)">apoyo en el suelo</text>
        <text x="50" y="100" font-size="9" text-anchor="end" fill="var(--faint)">apoyo</text>
      </svg>
      </figure>
    pide: El menor ángulo con la horizontal para el que el bloque sigue en equilibrio.
    pasos:
      - tipo: reconocer
        pregunta: |
          El bloque toca en dos vértices y hay rozamiento en los dos. ¿Hacia
          dónde apuntan los rozamientos cuando el bloque está a punto de
          escurrirse?
        opciones:
          - texto: El del suelo hacia la pared y el de la pared hacia arriba, porque el vértice de abajo se escapa hacia fuera y el de la pared baja
            correcta: true
            mensaje: |
              Eso es. El bloque se abre: el apoyo del suelo se desliza alejándose
              de la pared y el de la pared baja. Cada rozamiento se opone a su
              propio deslizamiento, y los dos hay que ponerlos.
          - texto: Los dos hacia arriba, porque el rozamiento siempre sujeta el peso
            mensaje: |
              El rozamiento se opone al deslizamiento **relativo** de cada
              contacto, no al peso. En el suelo el deslizamiento es horizontal,
              así que ahí el rozamiento es horizontal.
          - texto: Solo hay rozamiento en el suelo, porque en la pared la normal es horizontal y no aprieta
            mensaje: |
              La pared sí aprieta: su normal es horizontal y vale
              $N_2 = \mu N_1$, distinta de cero. Con normal hay rozamiento
              disponible, y aquí es justo el que aguanta parte del peso.

      - tipo: calcular
        titulo: La tangente del ángulo límite
        pregunta: |
          Para poner número, toma $\mu = 0{,}25$. ¿Cuánto vale
          $\tan\alpha$ en el equilibrio límite?
        respuesta:
          tipo: numero
          valor: '0.6'
          tolerancia: 0.005
          formato: un número, la tangente del ángulo
        distractores:
          - valor: '0.25'
            mensaje: |
              Has aplicado $\tan\alpha = \mu$, que es la fórmula del bloque
              sobre un plano inclinado. Aquí no hay plano inclinado: hay dos
              contactos perpendiculares entre sí y un vuelco de por medio.
          - valor: '0.6667'
            mensaje: |
              Sale de olvidar el rozamiento de la pared, $1/(1+2\mu)$. La pared
              también roza, y su rozamiento vertical sujeta parte del peso.
          - valor: '0.7391'
            mensaje: |
              Has puesto el rozamiento de la pared hacia abajo. El vértice
              apoyado en la pared **baja** cuando el bloque se abre, así que el
              rozamiento allí va hacia arriba.
        pista: |
          De las fuerzas salen $N_1 = P/(1+\mu^{2})$ y $N_2 = \mu N_1$. Después,
          momentos en el vértice apoyado en el suelo.
        desarrollo: |
          Fuerzas, con el rozamiento del suelo hacia la pared y el de la pared
          hacia arriba:

          $$
          N_2 = \mu N_1
          \qquad
          N_1 + \mu N_2 = P
          \;\Longrightarrow\;
          N_1 = \frac{P}{1+\mu^{2}}
          $$

          Momentos en el vértice del suelo, donde $N_1$ y su rozamiento no dan
          momento:

          $$
          \tan\alpha = \frac{1-\mu}{1+\mu}
          = \frac{0{,}75}{1{,}25} = 0{,}6
          $$

      - tipo: calcular
        titulo: El ángulo, en grados
        pregunta: |
          Con ese mismo $\mu = 0{,}25$, ¿cuánto vale el ángulo mínimo en grados?
        respuesta:
          tipo: numero
          valor: '30.96'
          tolerancia: 0.1
          formato: un número, en grados
        distractores:
          - valor: '45'
            mensaje: |
              Ese es el caso sin rozamiento, $\mu = 0$: la diagonal vertical y
              el peso justo sobre el apoyo. Con rozamiento el bloque aguanta
              inclinaciones menores.
          - valor: '14.04'
            mensaje: |
              Ese es el ángulo de rozamiento, $\arctan\mu$. Aparece en el
              resultado, pero restándolo de 45°, no como respuesta.
        pista: |
          Ya tienes la tangente. Y hay una forma bonita de leerlo:
          $\alpha = 45^{\circ} - \arctan\mu$.
        desarrollo: |
          $$
          \alpha = \arctan 0{,}6 = 30{,}96^{\circ}
          $$

          Que es exactamente $45^{\circ} - \arctan 0{,}25 = 45^{\circ} -
          14{,}04^{\circ}$. El rozamiento le roba al 45° justo el ángulo de
          rozamiento.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'El bloque se abre: el apoyo del suelo se aleja de la pared y el de la pared baja, así que los rozamientos van hacia la pared y hacia arriba.'
          - texto: De las dos ecuaciones de fuerzas, $N_2 = \mu N_1$ y $N_1 = P/(1+\mu^{2})$.
          - texto: Momentos en el vértice apoyado en el suelo, que elimina $N_1$ y su rozamiento.
          - texto: Sale $\tan\alpha = (1-\mu)/(1+\mu)$, o sea $\alpha = 45^{\circ} - \arctan\mu$.
          - texto: Con más rozamiento el bloque necesita más ángulo, porque el rozamiento empuja hacia fuera.
            trampa: true
            mensaje: |
              Al revés: cuanto mayor es $\mu$, menor es el ángulo mínimo. Con
              $\mu = 0{,}25$ salen 31° y con $\mu = 0{,}4$, 23°. El rozamiento
              ayuda a sujetar, no a escapar.
    resolucion: |
      **Por qué 45° es el techo.** Con el cuadrado a 45° el centro de gravedad
      cae justo sobre el vértice apoyado en el suelo. Por debajo de 45° el peso
      queda del lado de la pared y tiende a abrir el bloque; por eso la nota de
      la colección dice que en la posición límite $\alpha$ es algo menor que
      45°.

      **Las fuerzas.** El bloque se abre, así que el rozamiento del suelo apunta
      hacia la pared y el de la pared, hacia arriba. Con los dos en su máximo:

      $$
      N_2 = \mu N_1
      \qquad
      N_1 + \mu N_2 = P
      \;\Longrightarrow\;
      N_1 = \frac{P}{1+\mu^{2}},
      \quad N_2 = \frac{\mu P}{1+\mu^{2}}
      $$

      **Los momentos.** Tomándolos en el vértice apoyado en el suelo, donde
      $N_1$ y su rozamiento no dan momento, y con el centro de gravedad en
      $\bigl(L(\cos\alpha+\sin\alpha)/2,\ L(\sin\alpha+\cos\alpha)/2\bigr)$:

      $$
      (\cos\alpha - \sin\alpha)(1+\mu^{2}) = 2\mu\,(\mu\cos\alpha + \sin\alpha)
      $$

      $$
      \tan\alpha = \frac{1-\mu^{2}}{(1+\mu)^{2}} = \frac{1-\mu}{1+\mu}
      $$

      **Comprobación.** Resuelto también por fuerza bruta: para cada $\alpha$ se
      busca si existe algún reparto de rozamientos admisible, y el ángulo donde
      deja de haberlo sale 30,96° con $\mu = 0{,}25$, 33,69° con $\mu = 0{,}2$ y
      23,20° con $\mu = 0{,}4$. Los tres coinciden con
      $\arctan\bigl((1-\mu)/(1+\mu)\bigr)$.

  - id: ejma4-col47-las-dos-cunas-y-la-carga
    titulo: Las dos cuñas que levantan una carga
    fuente: >-
      Ejercicio 4.7 · Tema 4, «Rozamiento» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección lo marca como resuelto en el libro. Su resultado
      del apartado a sale; el del apartado b, 0,11, no es el rozamiento mínimo
      que pide el enunciado, y el desarrollo explica de dónde viene ese número.
    nivel: practica
    enunciado: |
      En el sistema de cargas $P$ y $Q$ de la figura, la carga $Q$ se mantiene
      lateralmente sostenida entre rodillos. El coeficiente de rozamiento entre
      la carga $Q$ y la cuña superior y entre ambas cuñas es
      $\mu_1 = 0{,}2$. El coeficiente de rozamiento $\mu_2$ entre cuña inferior
      y suelo es desconocido. Calcular:

      a. El coeficiente de rozamiento mínimo $\mu_2$ para elevar la carga $Q$.

      b. El coeficiente de rozamiento mínimo $\mu_2$ para sostener la carga
      $Q$, al eliminar la carga $P$.

