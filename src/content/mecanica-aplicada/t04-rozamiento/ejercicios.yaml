    pide: La normal en C, el valor máximo de k y la fuerza F del equilibrio estricto.
    pasos:
      - tipo: reconocer
        pregunta: |
          En el disco de arriba, ¿qué relación hay entre el rozamiento en $C$ y
          el rozamiento en $E$?
        opciones:
          - texto: Son iguales, porque son las dos únicas fuerzas con momento respecto de su centro y tienen el mismo brazo R
            correcta: true
            mensaje: |
              Eso es. El peso y el muelle pasan por el centro, y las dos
              normales también. Los dos rozamientos tienen brazo $R$, así que
              momentos en $D$ los iguala.
          - texto: Son iguales porque el coeficiente de rozamiento es el mismo en los dos contactos
            mensaje: |
              El coeficiente igual no obliga a nada mientras no se llegue al
              techo: lo que iguala los dos rozamientos es la ecuación de
              momentos en el centro del disco.
          - texto: Están en la misma proporción que las normales de cada contacto
            mensaje: |
              Eso sería si los dos contactos estuvieran deslizando, y no lo
              están. Mientras no se llega al techo, cada rozamiento vale lo que
              pidan las ecuaciones.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna ecuación: **la barra y los dos discos
          por separado**. Con los ejes y las distancias de $A$ al centro de la
          barra y a $C$.
        comprueba:
          - punto: |
              **La barra: $A_x$ y $A_y$ en $A$, $2Mg$ a $2R$ y, en $C$, a
              $3R$, la normal $N_C$ hacia arriba y el rozamiento horizontal.**
            porque: |
              El rozamiento en $C$ va a la altura de $A$: allí no da momento.
          - punto: |
              **El disco de arriba: $Mg$ y el muelle, $3kR$ hacia la derecha,
              en el centro; en $C$ y en $E$, una normal vertical y un
              rozamiento horizontal.**
            porque: |
              Los dos contactos están en la vertical del centro.
          - punto: |
              **El disco de abajo: $Mg$ y $F$ en el centro; en $E$, lo del
              disco de arriba con el sentido cambiado; en $P$, el suelo.**
            porque: |
              Lo que un disco le hace al otro, el otro se lo hace al revés.
          - punto: |
              **Los rozamientos sin escribir $fN$.**
            porque: |
              Primero se calcula lo que hace falta en cada contacto, y luego
              se mira cuál llega antes a su techo.
