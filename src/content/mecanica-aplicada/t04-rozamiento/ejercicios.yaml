      a) La barra. b) El bloque. Lo que la barra y el bloque se hacen en B aparece en los dos con el sentido cambiado. La normal del suelo, Ns, puede estar en cualquier punto de la base; al ir a volcar se va a la arista D. Ejes: x hacia la derecha, y hacia arriba; momentos positivos en sentido antihorario.

      </figcaption>
      </figure>

      - **La barra.** Su peso $P$, a $7{,}5a$ de $A$; en $A$, el escalón y el
        suelo, con $A_x$ y $A_y$; y en $B$, a $10a$ de $A$, la normal $N$,
        perpendicular a la barra, y el rozamiento $F_B$, hacia $C$.
      - **El bloque.** Su peso $P_D$; en la esquina $B$, $N$ y $F_B$ con el
        sentido cambiado, el rozamiento hacia $A$; y en la base, la normal
        $N_s$ y el rozamiento $F_s$, hacia la izquierda.

      **2. Incógnitas.** En la barra, $A_x$, $A_y$ y $N$, con $F_B = 0{,}2N$,
      porque la arista desliza por la barra en cuanto el bloque se mueve. En
      el bloque, $N_s$, $F_s$, $P_D$ y dónde está $N_s$. Son seis ecuaciones
      más la condición de cada caso: $F_s = 0{,}2N_s$ al ir a deslizar, o
      $N_s$ en la arista $D$ al ir a volcar.

      **3. Ecuaciones.** La barra va en la dirección
      $0{,}6\,\vec{i} + 0{,}8\,\vec{j}$: sobre ella, la normal es
      $N(-0{,}8\,\vec{i} + 0{,}6\,\vec{j})$ y el rozamiento,
      $0{,}2N(0{,}6\,\vec{i} + 0{,}8\,\vec{j})$. Momentos en $A$, por donde
      pasa la recta del rozamiento; $B$ está en $(6a;\ 8a)$ y el centro, a
      $4{,}5a$ en horizontal:

      $$
      \sum M_A = 6a\,(0{,}6N) - 8a\,(-0{,}8N) - 4{,}5a\,P
      = 10a\,N - 4{,}5a\,P = 0
      $$

      $$
      \sum F_x = A_x - 0{,}8N + 0{,}12N = 0, \qquad
      \sum F_y = A_y + 0{,}6N + 0{,}16N - P = 0
      $$

      El bloque recibe en $B$ lo contrario,
      $N(0{,}8;\,-0{,}6) + 0{,}2N(-0{,}6;\,-0{,}8) = N(0{,}68;\,-0{,}76)$:

      $$
      \sum F_x = 0{,}68N - F_s = 0, \qquad
      \sum F_y = N_s - P_D - 0{,}76N = 0
      $$

      Y momentos en la arista $D$, de abajo a la derecha: $B$ está $2a$ a la
      izquierda y $8a$ más arriba, el peso, $a$ a la izquierda, y $N_s$, a una
      distancia $d$ a la izquierda:

      $$
      \sum M_D = P_D\,a + 0{,}76N\,(2a) - 0{,}68N\,(8a) - N_s\,d = 0
      $$

      **4. Resultados.**

      $$
      N = 0{,}45P, \qquad A_x = 0{,}306P, \qquad A_y = 0{,}658P
      $$

      Sobre el bloque, la barra hace $P\,(0{,}306\,\vec{i} - 0{,}342\,\vec{j})$.
      Al ir a **deslizar**, con $N_s = P_D + 0{,}342P$:

      $$
      0{,}306P = 0{,}2\,(P_D + 0{,}342P)
      \qquad\Longrightarrow\qquad
      P_D = \frac{297}{250}P = 1{,}188P
      $$

      Al ir a **volcar**, $d = 0$:

      $$
      P_D\,a = 2{,}448\,aP - 0{,}684\,aP
      \qquad\Longrightarrow\qquad
      P_D = \frac{441}{250}P = 1{,}764P
      $$

      Tienen que cumplirse las dos, así que el peso mínimo es el mayor,
      $1{,}764P$. Sobre la barra, el escalón y el suelo hacen en $A$
      $P\,(0{,}306\,\vec{i} + 0{,}658\,\vec{j})$.

      **5. Comprobación.** Momentos de la barra en $B$, que no se han usado:
      $A$ está $6a$ a la izquierda y $8a$ más abajo, y el centro, $1{,}5a$ a
      la izquierda y $2a$ más abajo; $N$ y $F_B$ pasan por $B$:

      $$
      \sum M_B = -6a\,(0{,}658P) + 8a\,(0{,}306P) + 1{,}5a\,P
      = (-3{,}948 + 2{,}448 + 1{,}5)\,aP = 0
      $$

      Y con $P_D = 1{,}764P$ tampoco desliza: $N_s = 2{,}106P$ y
      $F_s/N_s = 0{,}306/2{,}106 = 0{,}145$, por debajo de $0{,}2$.

      **Lo que dice el resultado.** Los dos coinciden con lo publicado. Manda
      el vuelco porque la barra empuja la esquina de arriba, a $8a$ del suelo,
      y el bloque solo tiene $2a$ de base para resistirlo.

  - id: ejma4-col417-el-disco-con-masa-soldada-y-el-muelle
    titulo: El disco con una masa soldada, la barra y el muelle
    fuente: >-
      Ejercicio 4.17 · Tema 4, «Rozamiento» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección lo marca como de nivel de examen. La colección
      publica el resultado, contra el que está contrastado el desarrollo.
    nivel: practica
    antes:
      idea: |
        Cuando un rozamiento no está en el límite, su sentido no se sabe de
        antemano: se supone uno y el signo lo corrige. Los dos extremos del
        intervalo de un parámetro salen de ponerlo en el límite hacia un lado
        y hacia el otro.
      formula: |
        En el límite, $|F_r| = \mu_s N$. Y el momento respecto de $P$ de una
        fuerza $(F_x;\ F_y)$ aplicada en $(x;\ y)$ es

        $$
        M_P = (x - x_P)\,F_y - (y - y_P)\,F_x
        $$
      reconocer: |
        Antes de plantear se mira cuánto mide el muelle en la figura y cuánto
        mediría sin tensión.
    enunciado: |
      Un disco sin masa de radio $R$ tiene soldada una masa puntual $M$ a una
      distancia $R/2$ del centro $C$. El disco está apoyado en el punto $A$
      sobre una superficie horizontal y en el punto $B$ sobre la barra $DE$. En
      el contacto en $A$, se garantiza la rodadura y en el contacto en $B$ se
      sabe que el coeficiente de rozamiento es $f = 1/2$. La barra $DE$ tiene
      una longitud $2R$, masa despreciable y en su extremo $E$ está articulada
      a un muelle de longitud sin tensión $L_0 = 2R$ y constante elástica $k$
      desconocida. En la posición de equilibrio de la figura:

      a. Valores máximo y mínimo de la constante elástica $k$.

      b. Coeficiente de rozamiento necesario en el contacto en $A$ para
      garantizar la rodadura cuando la constante elástica $k$ toma sus valores
      máximo y mínimo.

      <figure>
      <svg viewBox="0 0 360 280" role="img" width="360" height="280" aria-labelledby="ma4c417-t ma4c417-d">
