        <line x1="330" y1="100" x2="330" y2="280" stroke="var(--ink)" stroke-width="1.4"/>
        <path d="M330 110 L338 118 M330 140 L338 148 M330 170 L338 178 M330 200 L338 208 M330 230 L338 238 M330 260 L338 268" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <circle cx="175" cy="145" r="45" fill="var(--faint)" fill-opacity="0.12" stroke="var(--ink)" stroke-width="1.3"/>
        <circle cx="175" cy="235" r="45" fill="var(--faint)" fill-opacity="0.12" stroke="var(--ink)" stroke-width="1.3"/>
