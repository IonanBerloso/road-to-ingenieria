      - tipo: calcular
        titulo: Caso a, deslizamiento entre rueda y viga
        pregunta: |
          ¿Qué fuerza $Q$ haría deslizar la viga sobre las ruedas?
        respuesta:
          tipo: magnitud
          valor: '3 kN'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '2 kN'
            mensaje: |
              Has usado solo la carga de una rueda, la más cargada. Las dos
              ruedas rozan contra la viga, y entre las dos soportan los 12 kN.
          - valor: '4.8 kN'
            mensaje: |
              Has usado $\mu_2$, el del suelo. Entre rueda y viga el
              coeficiente es $\mu_1 = 0{,}25$.
        pista: |
          Las dos ruedas juntas soportan la carga entera. Deslizar la viga
          sobre ellas cuesta $\mu_1$ por esa carga.
        desarrollo: |
          $$
          Q_a = \mu_1\,P = 0{,}25 \cdot 12 = 3\ \text{kN}
          $$

      - tipo: calcular
        titulo: Caso b, deslizamiento entre rueda y suelo
        pregunta: |
          ¿Y qué fuerza haría deslizar el conjunto sobre el suelo, con las
          ruedas bloqueadas?
        respuesta:
          tipo: magnitud
          valor: '4.8 kN'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '3 kN'
            mensaje: |
              Has vuelto a usar $\mu_1$. Contra el suelo el coeficiente es
              $\mu_2 = 0{,}4$.
          - valor: '3.2 kN'
            mensaje: |
              Has usado la carga de una sola rueda. El suelo aguanta los 12 kN
              completos, repartidos entre los dos contactos.
        pista: |
          Igual que antes, pero con el coeficiente del suelo.
        desarrollo: |
          $$
          Q_b = \mu_2\,P = 0{,}4 \cdot 12 = 4{,}8\ \text{kN}
          $$

      - tipo: calcular
        titulo: Caso c, rodadura
        pregunta: |
          Si las ruedas ruedan, cada una vence la resistencia a la rodadura en
          sus **dos** contactos. ¿Cuánto vale $Q$?
        respuesta:
          tipo: magnitud
          valor: '225 N'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '450 N'
            mensaje: |
              Has usado $r$ como brazo en vez de $2r$. Las dos fuerzas
              horizontales de la rueda, la de arriba y la de abajo, forman un
              par cuyo brazo es el diámetro.
          - valor: '1800 N'
            mensaje: |
              Has tratado $\mu_r$ como si fuera adimensional, multiplicándolo
              por la carga. Es una longitud, y va dividido por el radio.
          - valor: '2207 N'
            mensaje: |
              Son los 225 leídos como kilogramos-fuerza y pasados a newtons. La
              colección imprime «225 kg», pero con $P$ en kN el resultado sale
              en newtons.
          - valor: '150 N'
            mensaje: |
              Solo has contado el contacto con el suelo. La rueda también rueda
              contra la viga, y las dos resistencias se suman.
        pista: |
          Para una rueda con carga $N$: $2r\,F = N(\mu_{r,1} + \mu_{r,2})$.
          Súmalo para las dos, que entre ambas llevan $P$.
        desarrollo: |
          Tomando momentos en una rueda, las dos normales adelantadas frenan y
          las dos fuerzas horizontales forman un par de brazo $2r$:

          $$
          F = \frac{N\,(\mu_{r,1} + \mu_{r,2})}{2r}
          $$

          Sumando las dos ruedas, cuyas cargas suman $P$:

          $$
          Q_c = \frac{P\,(\mu_{r,1}+\mu_{r,2})}{2r}
          = \frac{12000 \cdot 0{,}0015}{2 \cdot 0{,}04} = 225\ \text{N}
          $$

          Con todo en metros: $\mu_{r,1} = 0{,}0005$ m,
          $\mu_{r,2} = 0{,}001$ m, $r = 0{,}04$ m.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Hay tres formas de que la viga empiece a moverse: deslizar sobre las ruedas, deslizar con todo el conjunto sobre el suelo, o hacer rodar las ruedas.'
          - texto: 'Deslizar sobre las ruedas cuesta $0{,}25 \cdot 12 = 3$ kN; deslizar sobre el suelo, $0{,}4 \cdot 12 = 4{,}8$ kN.'
          - texto: 'Rodar cuesta $P(\mu_{r,1}+\mu_{r,2})/(2r) = 225$ N, con las tres longitudes en metros.'
          - texto: 'La menor de las tres es la que ocurre: la viga se mueve haciendo rodar las ruedas, con 225 N.'
          - texto: Como la rodadura es la que menos fuerza pide, el rozamiento entre rueda y suelo no interviene y podría ser nulo.
            trampa: true
            mensaje: |
              Justo al revés: rodar sin deslizar **exige** rozamiento suficiente.
              Lo que pasa es que aquí sobra de largo, porque la fuerza que cada
              contacto necesita es $0{,}019$ veces su normal, muy por debajo de
              $\mu_1$ y $\mu_2$.
    resolucion: |
      **1. Sólidos libres.** Para el caso de rodadura, la viga y una rueda
      cualquiera, con carga $N$.

