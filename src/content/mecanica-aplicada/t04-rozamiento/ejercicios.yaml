        <text x="252" y="96" font-size="12" fill="var(--d1)">P</text>
      </svg>
      </figure>
    pide: Los valores máximo y mínimo del par que mantienen el sistema en equilibrio.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué este problema tiene dos respuestas y no una?
        opciones:
          - texto: Porque el equilibrio puede romperse en dos sentidos, y el rozamiento en B cambia de signo según cuál
            correcta: true
            mensaje: |
              Eso es, y es lo que avisa la nota de la colección. Con el par
              pequeño el sistema se abre y $B$ se va hacia fuera; con el par
              grande se cierra y $B$ se va hacia dentro. El rozamiento se opone
              a cada uno, así que hay que resolver dos veces.
          - texto: Porque hay dos barras, y cada una da su propia condición de equilibrio
            mensaje: |
              Las dos barras dan ecuaciones, pero la horquilla no sale de ahí:
              sale de que $|F| \le fN$ es una **desigualdad** con dos lados.
          - texto: Porque el rozamiento estático y el cinético son distintos
            mensaje: |
              Aquí solo aparece un coeficiente, $f$, y todo el problema es
              estático. Los dos valores son los dos extremos de la misma
              desigualdad.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna ecuación: **el conjunto de las dos
          barras y la barra AB sola**. Con los ejes y los ángulos.
        comprueba:
          - punto: |
              **El conjunto: $O_x$ y $O_y$ en O, los dos pesos $mg$ en los
              centros, el par $P$ y, en B, $N$ y $F$.**
            porque: |
              La articulación A queda dentro y no aparece.
          - punto: |
              **La barra AB: $A_x$ y $A_y$ en A, su peso, el par $P$ y, en B,
              $N$ y $F$.**
            porque: |
              Con momentos en A, las fuerzas de la articulación no entran.
          - punto: |
              **$F$ con un sentido supuesto, hacia fuera, y sin escribir
              $fN$.**
            porque: |
              Según el par, B tiende a salir o a entrar: el signo de $F$ lo
              dirá.
          - punto: |
              **Los brazos, todos múltiplos de $\frac{\sqrt{2}}{2}L$: los
              centros a $\frac{\sqrt{2}}{2}L$ y $\frac{3\sqrt{2}}{2}L$ de O, y B
              a $2\sqrt{2}L$.**
            porque: |
              Cada barra mide $2L$ y forma $45^{\circ}$ con el suelo.
        figura: |
          <svg viewBox="-24 8 420 222" role="img" width="420" height="222" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">Sólidos libres del conjunto de las dos barras y de la barra AB</title>
            <desc id="dsl-d">A la izquierda, el conjunto de las dos barras, sin el apoyo ni el suelo: en O, las componentes Ox hacia la derecha y Oy hacia arriba; el peso mg de cada barra en su centro; el par P en el centro de AB, en sentido horario; y en B, la normal N hacia arriba y el rozamiento F, supuesto hacia fuera, hacia la derecha. A la derecha, la barra AB sola: en A, las componentes Ax y Ay de la articulación; su peso mg y el par P en su centro; y en B, N y F. Las barras forman 45 grados con el suelo y miden 2L. Ejes x hacia la derecha e y hacia arriba, y momentos positivos en sentido antihorario.</desc>
            <defs>
              <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
              </marker>
              <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
              </marker>
              <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
