      <figcaption>

      Dibujada con α = 75° y β = 40°. Ejes: x hacia la derecha, y hacia arriba; momentos positivos en sentido antihorario.

      </figcaption>
      </figure>

      - **En A**, el peso $P$, vertical. La varilla no pesa.
      - **En B**, la tensión $T$ de la cuerda, hacia $D$, formando $\beta$ con
        la varilla.
      - **En C**, la reacción del canto. Es la varilla la que apoya, así que
        la normal $N$ es perpendicular a la varilla y el rozamiento $F$ va a
        lo largo de ella. $P$ y $T$ tiran de la varilla hacia $A$, y $F$ se
        opone: apunta hacia $B$.

      **2. Incógnitas.** $T$, $N$ y $F$: tres, para las tres ecuaciones de la
      varilla. Con ellas, el coeficiente mínimo sale de $F \le \mu N$.

      **3. Ecuaciones.** Momentos en $C$, donde ni $N$ ni $F$ dan momento; el
      brazo del peso es $a\sin\alpha$ y el de la cuerda, $b\sin\beta$:

      $$
      \sum M_C = P\,a\sin\alpha - T\,b\sin\beta = 0
      $$

      Proyectando sobre la perpendicular a la varilla y a lo largo de ella,
      con el peso a $\alpha$ de la varilla y la cuerda a $\beta$:

      $$
      \sum F_{\perp} = N - P\sin\alpha - T\sin\beta = 0, \qquad
      \sum F_{\parallel} = F - P\cos\alpha - T\cos\beta = 0
      $$

      **4. Resultados.**

      $$
      T = \frac{a\sin\alpha}{b\sin\beta}\,P, \qquad
      N = P\sin\alpha\left(1 + \frac{a}{b}\right) = \frac{P\,l\sin\alpha}{b},
      \qquad F = P\cos\alpha + T\cos\beta
      $$

      $$
      \mu \ge \frac{F}{N}
      = \frac{1}{l}\left(\frac{b\cos\alpha}{\sin\alpha}
      + \frac{a\cos\beta}{\sin\beta}\right)
      $$

      Con $a = 1$ m, $b = 2$ m, $\alpha = 75^{\circ}$ y $\beta = 40^{\circ}$:
      $T = 0{,}7514\,P$, $N = 1{,}4489\,P$, $F = 0{,}8344\,P$ y
      $\mu \ge 0{,}5759$. En vectores, con la varilla a $15^{\circ}$ sobre la
      horizontal, la reacción en $C$ es $P\,(0{,}431\,\vec{i} +
      1{,}615\,\vec{j})$ y la cuerda tira de $B$ con
      $P\,(-0{,}431\,\vec{i} - 0{,}616\,\vec{j})$.

      **5. Comprobación.** Momentos en $A$, que no se han usado. El peso pasa
      por $A$ y el rozamiento va por la propia varilla: quedan $N$, con brazo
      $a$, y la cuerda, con brazo $l\sin\beta$:

      $$
      \sum M_A = a\,N - l\,T\sin\beta
      = a\,\frac{P\,l\sin\alpha}{b} - l\,\frac{a\sin\alpha}{b\sin\beta}P\sin\beta
      = 0
      $$

      **Lo que dice el resultado.** Las dos fórmulas coinciden con las
      publicadas. El rozamiento hace falta aunque la varilla no pese: el peso
      colgado y la cuerda tienen componente a lo largo de la varilla, y solo
      el rozamiento en $C$ las equilibra.

  - id: ejma4-col46-el-bloque-cuadrado-entre-suelo-y-pared
    titulo: El bloque cuadrado encajado entre el suelo y la pared
    fuente: >-
      Ejercicio 4.6 · Tema 4, «Rozamiento» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección publica el resultado, contra el que está
      contrastado el desarrollo.
    nivel: practica
    antes:
      idea: |
        Cada rozamiento se opone al deslizamiento de su propio contacto. Un
        sólido rígido que toca en dos puntos y empieza a escurrirse desliza en
        los dos a la vez, así que los dos rozamientos llegan juntos a su
        techo.
      formula: |
        En el límite, $F = \mu N$ en cada contacto. El centro de un cuadrado
        es el punto medio de cualquiera de sus diagonales. Y

        $$
        \tan(45^{\circ} - \varphi) = \frac{1 - \tan\varphi}{1 + \tan\varphi}
        $$
      reconocer: |
        Antes de plantear se imagina cómo se movería el cuerpo si se
        escurriera, contacto a contacto.
    enunciado: |
      Un bloque prismático de sección cuadrada está apoyado sobre una
      superficie horizontal y otra vertical. Determinar el menor valor del
      ángulo para el cual el bloque está en equilibrio. Datos: peso del bloque
      $P$, longitud del lado de la sección $L$, coeficiente de rozamiento en
      todas las superficies $\mu$.

