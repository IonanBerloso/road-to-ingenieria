        <text x="306" y="168" font-size="10" fill="var(--ink)">B</text>
        <text x="248" y="166" font-size="10" text-anchor="end" fill="var(--ink)">C</text>
        <text x="224" y="222" font-size="10" text-anchor="end" fill="var(--ink)">D</text>
        <text x="306" y="90" font-size="10" fill="var(--ink)">A</text>
        <text x="306" y="262" font-size="10" fill="var(--ink)">O</text>
        <text x="250" y="66" font-size="9.5" text-anchor="middle" fill="var(--faint)">disco: M, √3R</text>
        <text x="366" y="112" font-size="9.5" text-anchor="end" fill="var(--faint)">barra: 3M, 6R</text>
      </svg>
      <figcaption>

      El muelle es **ideal**, de longitud natural cero, y va desde **A** hasta
      el arranque del plano, a la misma altura: su longitud es la distancia
      horizontal entre los dos. El disco toca la barra en **B**, a **3R** de
      **O**, y el plano en **D**.

      </figcaption>
      </figure>
    pide: La normal y el rozamiento en los dos contactos del disco y la constante del muelle.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado dice que el disco está a punto de descender y de
          deslizar en $B$. ¿Qué se escribe en cada contacto?
        opciones:
          - texto: En B el rozamiento está en su techo, f por la normal; en D es una incógnita más
            correcta: true
            mensaje: |
              Eso es. Solo el contacto que va a deslizar aporta la ecuación
              $F_r = f\,N$. En $D$ el disco rueda, así que su rozamiento es una
              incógnita que sale del equilibrio y queda por debajo del techo.
          - texto: En los dos contactos el rozamiento vale f por la normal
            mensaje: |
              Eso serían dos ecuaciones y el sistema quedaría sobredeterminado.
              De hecho, resuelto el problema, en $D$ el cociente sale $0{,}247$,
              muy por debajo de $\sqrt{3}/2$.
          - texto: En B no hay rozamiento, porque la barra es lisa
            mensaje: |
              El enunciado da un coeficiente «entre superficies» y dice que en
              $B$ va a deslizar: ahí hay rozamiento y además está en su valor
              máximo. Sin él no habría nada que sostuviera el disco.

      - tipo: calcular
        titulo: La normal en el contacto con la barra
        pregunta: |
          ¿Cuánto vale la normal $N_B$, en unidades de $Mg$?
        respuesta:
          tipo: numero
          valor: '0.230940'
          tolerancia: 0.002
          formato: un número, la normal dividida entre Mg
        distractores:
          - valor: '0.384900'
            mensaje: |
              Has dejado sin rozamiento el contacto $D$. Ahí el disco no
              desliza, pero el rozamiento existe y vale $Mg/5$: sale de los
              momentos en el centro del disco, no de un $f\,N$.
          - valor: '0.577350'
            mensaje: |
              Has anulado el rozamiento en $B$. Entonces los momentos en el
              centro anulan también el de $D$ y el disco se queda con dos
              normales, que no pueden equilibrar el peso en esta posición.
        pista: |
          Momentos en el centro del disco igualan los dos rozamientos.
          Proyectando después en horizontal y en vertical, con
          $F_{r,B} = \frac{\sqrt{3}}{2}N_B$.
        desarrollo: |
          $$
          N_D = \frac{7}{2}N_B
          \qquad
          \frac{\sqrt{3}}{2}N_D + \frac{3}{2}\cdot\frac{\sqrt{3}}{2}N_B = Mg
          $$

          $$
          N_B = \frac{2Mg}{5\sqrt{3}} = 0{,}2309\,Mg
          \qquad
          F_{r,B} = \frac{Mg}{5}
          \qquad
          N_D = \frac{7Mg}{5\sqrt{3}}
          \qquad
          F_{r,D} = \frac{Mg}{5}
          $$

      - tipo: calcular
        titulo: La constante del muelle
        pregunta: |
          ¿Cuánto vale $k$, en unidades de $Mg/R$?
        respuesta:
          tipo: numero
          valor: '0.011111'
          tolerancia: 0.0002
          formato: un número, k dividido entre M g partido por R
        distractores:
          - valor: '0.019245'
            mensaje: |
              Has tomado la longitud del muelle igual a $6R$. El muelle es
              horizontal y llega hasta el plano, que a la altura de $A$ está a
              $6R/\tan 30^\circ = 6\sqrt{3}R$.
          - valor: '0.022222'
            mensaje: |
              Has igualado la fuerza del muelle a la normal en $B$. La barra
              multiplica: el muelle actúa a $6R$ de $O$ y el disco a $3R$, así
              que la fuerza del muelle es la mitad de $N_B$.
        pista: |
          Momentos en $O$ sobre la barra. El peso de la barra es vertical y
          pasa por $O$, así que no da momento.
        desarrollo: |
          $$
          S\,(6R) = N_B\,(3R)
          \qquad\Longrightarrow\qquad
          S = \frac{N_B}{2} = \frac{Mg}{5\sqrt{3}}
          $$

          $$
          k = \frac{S}{6\sqrt{3}R} = \frac{Mg}{90R}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Momentos en el centro del disco: los dos rozamientos tienen el mismo brazo y por tanto son iguales.'
          - texto: Con el rozamiento en B en su techo y las dos proyecciones salen las cuatro reacciones del disco.
          - texto: 'Momentos en O sobre la barra: la fuerza del muelle es la mitad de la normal en B, porque su brazo es el doble.'
          - texto: El peso de la barra, 3Mg, entra en la ecuación de momentos en O y aumenta la fuerza del muelle.
            trampa: true
            mensaje: |
              La barra está vertical y su peso pasa por $O$: su brazo es cero y
              no aparece en esa ecuación. Por eso $k$ no depende de la masa de
              la barra, aunque sea $3M$.
    resolucion: |
      **La geometría.** El disco toca la barra vertical en $B$, a $3R$ de $O$,
      y el plano en $D$. Su radio es $\sqrt{3}R$, así que su centro está a
      $\sqrt{3}R$ de la barra, a la altura de $B$.

      **El disco.** Momentos en su centro: los dos rozamientos tienen brazo
      $\sqrt{3}R$, luego $F_{r,D} = F_{r,B}$. Con el contacto $B$ en su techo,
      $F_{r,B} = \frac{\sqrt{3}}{2}N_B$, las dos proyecciones dan

      $$
      N_D = \frac{7}{2}N_B
      \qquad
      N_B = \frac{2Mg}{5\sqrt{3}}
      \qquad
      N_D = \frac{7Mg}{5\sqrt{3}}
      \qquad
      F_{r,B} = F_{r,D} = \frac{Mg}{5}
      $$

      En $D$ el cociente vale $0{,}247$, por debajo de $\sqrt{3}/2$: ahí no
      desliza, como decía el enunciado.

      **La barra.** Está vertical, así que su peso $3Mg$ pasa por $O$ y no da
      momento. Momentos en $O$:

      $$
      S\,(6R) = N_B\,(3R)
      \qquad\Longrightarrow\qquad
      S = \frac{Mg}{5\sqrt{3}}
      $$

      **El muelle.** Es ideal —longitud natural cero— y su longitud es la
      distancia horizontal de $A$ al plano, $6\sqrt{3}R$:

      $$
      k = \frac{S}{6\sqrt{3}R} = \frac{Mg}{90R}
      $$

      Las cinco cifras coinciden con el resultado publicado.

  - id: ejma4-col421-la-barra-sobre-dos-discos
    titulo: La barra apoyada sobre dos discos, con muelle y fuerza horizontal
    fuente: >-
      Ejercicio 4.21 · Tema 4, «Rozamiento» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección lo marca como de nivel de examen. La colección
      publica el resultado, contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      La barra $AB$ de la figura de masa $2M$ y longitud $4R$, se encuentra
      articulada en el punto fijo $A$ y apoyada en $C$ sobre un disco de centro
      $D$, masa $M$ y radio $R$. Sobre el punto $D$ actúa un resorte ideal de
      constante elástica $k$, que se encuentra alargado una longitud $3R$. El
      disco, a su vez, se apoya sobre otro disco igual, que descansa sobre el
      suelo y en cuyo centro se aplica una fuerza horizontal $F$, tal y como se
      indica. En todas las superficies de contacto existe rozamiento con un
      coeficiente de rozamiento $f = \frac{1}{4}$. Si el sistema está en
      equilibrio, se pide determinar:

      a. Valor máximo de la constante elástica del muelle.

      b. Valor de $F$ para la situación de equilibrio estricto.

      <figure>
      <svg viewBox="0 0 380 320" role="img" width="380" height="320" aria-labelledby="ma4c421-t ma4c421-d">
        <title id="ma4c421-t">Barra horizontal apoyada sobre dos discos iguales, uno sobre otro</title>
        <desc id="ma4c421-d">Una pared vertical a la izquierda con la articulación A. De ella sale la barra AB horizontal, de longitud cuatro R, que se apoya en C sobre el punto más alto de un disco de centro D, masa M y radio R. Ese disco descansa sobre otro igual, que toca el suelo en P; el contacto entre los dos discos es el punto E. Del centro D sale un muelle horizontal alargado tres R hasta la pared de la derecha, y en el centro O del disco inferior se aplica una fuerza F hacia la izquierda.</desc>
        <defs>
          <marker id="ma4c421-f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d1)"/>
