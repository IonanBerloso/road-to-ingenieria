        <path d="M32 175 L24 183 M62 175 L54 183 M92 175 L84 183 M122 175 L114 183 M152 175 L144 183 M182 175 L174 183 M212 175 L204 183 M242 175 L234 183 M272 175 L264 183 M298 175 L290 183" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <circle cx="160" cy="76" r="70" fill="var(--faint)" fill-opacity="0.12" stroke="var(--ink)" stroke-width="1.5"/>
        <circle cx="160" cy="76" r="3" fill="var(--ink)"/>
        <path d="M118 40 A 52 52 0 0 0 111 96" fill="none" stroke="var(--ink)" stroke-width="1.6" marker-end="url(#ejma4-col48-f)"/>
        <text x="126" y="66" font-size="12" fill="var(--ink)">ω</text>
        <line x1="160" y1="76" x2="209" y2="27" stroke="var(--ink)" stroke-width="1.2" marker-end="url(#ejma4-col48-f)"/>
        <text x="190" y="58" font-size="12" fill="var(--ink)">r</text>
        <circle cx="110.5" cy="125.5" r="3.4" fill="var(--flag)"/>
        <circle cx="209.5" cy="125.5" r="3.4" fill="var(--flag)"/>
        <text x="96" y="139" font-size="10" text-anchor="end" fill="var(--flag)">1</text>
        <text x="224" y="139" font-size="10" fill="var(--flag)">2</text>
        <path d="M134 175 A 26 26 0 0 0 141.6 156.6" fill="none" stroke="var(--ink)" stroke-width="0.9"/>
        <text x="122" y="169" font-size="10" text-anchor="end" fill="var(--ink)">45°</text>
        <path d="M186 175 A 26 26 0 0 1 178.4 156.6" fill="none" stroke="var(--ink)" stroke-width="0.9"/>
        <text x="198" y="169" font-size="10" fill="var(--ink)">45°</text>
      </svg>
      </figure>
    pide: Las dos normales y el momento que hay que aplicar para mantener el giro.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué aquí sí se puede escribir $F_r = \mu N$ en los dos contactos
          desde el principio?
        opciones:
          - texto: Porque el cilindro está deslizando sobre las dos superficies, no a punto de deslizar
            correcta: true
            mensaje: |
              Eso es, y es lo que distingue este problema del resto del tema.
              Aquí ya hay movimiento relativo en los dos contactos, así que el
              rozamiento es el cinético y vale $\mu N$ sin más hipótesis.
          - texto: Porque en todo problema de rozamiento se escribe $F_r = \mu N$
            mensaje: |
              No: mientras no hay deslizamiento, $\mu N$ es solo el techo y el
              rozamiento vale lo que pida el equilibrio. Escribirlo como
              igualdad sin que haya movimiento inminente es el error más común
              del tema.
          - texto: Porque el cilindro gira, y todo lo que gira tiene rozamiento máximo
            mensaje: |
              Girar no basta: un disco que **rueda** sin deslizar tiene
              rozamiento estático por debajo del máximo. Lo que aquí lo fija es
              que el enunciado dice que desliza sobre ambas superficies.

      - tipo: calcular
        titulo: La normal del contacto que más carga
        pregunta: |
          Con $\mu = 0{,}3$, un valor nuestro para poner número, ¿cuánto vale
          $N_1$ en unidades de $mg$? Es el contacto de la izquierda, hacia el
          que el rozamiento empuja al girar en sentido antihorario.
        respuesta:
          tipo: numero
          valor: '0.8433'
          tolerancia: 0.004
          formato: un número, N1 dividido entre mg
        distractores:
          - valor: '0.7071'
            mensaje: |
              Eso es $mg/\sqrt{2}$, lo que valdrían las dos normales si no
              hubiera rozamiento. Con rozamiento el giro descompensa los dos
              apoyos y dejan de ser iguales.
          - valor: '0.4541'
            mensaje: |
              Ese es $N_2$, el otro contacto. Al girar en sentido antihorario el
              rozamiento carga más el apoyo de la izquierda y descarga el de la
              derecha.
        pista: |
          Escribe las dos ecuaciones de fuerzas con las normales a 45° y los
          rozamientos tangentes, cada uno opuesto a la velocidad de su punto de
          contacto.
        desarrollo: |
          Proyectando en horizontal y en vertical, con los rozamientos opuestos
          al deslizamiento de cada contacto:

          $$
          N_1(1-\mu) = N_2(1+\mu)
          \qquad
          N_1(1+\mu) + N_2(1-\mu) = \sqrt{2}\,mg
          $$

          $$
          N_1 = \frac{\sqrt{2}\,mg\,(1+\mu)}{2(1+\mu^{2})} = 0{,}8433\,mg
          \qquad
          N_2 = \frac{\sqrt{2}\,mg\,(1-\mu)}{2(1+\mu^{2})} = 0{,}4541\,mg
          $$

      - tipo: calcular
        titulo: El momento que mantiene el giro
        pregunta: |
          Con el mismo $\mu = 0{,}3$, ¿cuánto vale el momento $M$ en unidades de
          $mgr$?
        respuesta:
          tipo: numero
          valor: '0.3892'
          tolerancia: 0.004
          formato: un número, M dividido entre mgr
        distractores:
          - valor: '0.4243'
            mensaje: |
              Has usado las normales del caso sin rozamiento,
              $mg/\sqrt{2}$ cada una. Con rozamiento las normales cambian, y su
              **suma** ya no es $\sqrt{2}\,mg$.
          - valor: '0.1168'
            mensaje: |
              Has restado los dos rozamientos. Apuntan en sentidos opuestos como
              vectores, pero respecto del centro los dos frenan el giro: sus
              momentos se **suman**.
          - valor: '0.3'
            mensaje: |
              Has tomado la normal total igual a $mg$. La V reparte el peso en
              dos normales a 45°, y su suma vale más que $mg$.
        pista: |
          Momentos en el centro: solo los rozamientos dan, los dos con brazo $r$
          y los dos frenando.
        desarrollo: |
          $$
          M = \mu (N_1 + N_2)\,r
          = \mu\,r\,\frac{\sqrt{2}\,mg\,\bigl[(1+\mu)+(1-\mu)\bigr]}{2(1+\mu^{2})}
          $$

          $$
          M = \frac{\sqrt{2}\,\mu\,mgr}{1+\mu^{2}} = 0{,}3892\,mgr
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'El cilindro desliza en los dos contactos: el rozamiento es cinético y vale $\mu N$ en cada uno.'
          - texto: Cada rozamiento es tangente a su superficie y opuesto a la velocidad del punto de contacto, que con giro antihorario baja por la izquierda y sube por la derecha.
          - texto: De las dos ecuaciones de fuerzas salen $N_1 = \sqrt{2}mg(1+\mu)/(2(1+\mu^{2}))$ y $N_2$ con $(1-\mu)$.
          - texto: Momentos en el centro, $M = \mu(N_1+N_2)r = \sqrt{2}\,\mu\,mgr/(1+\mu^{2})$.
          - texto: Como el cilindro gira con velocidad constante, no hace falta momento exterior ninguno.
            trampa: true
            mensaje: |
              Velocidad constante significa **aceleración angular nula**, o sea
              momento total nulo, no momento exterior nulo. Los rozamientos
              frenan, así que hace falta un momento exterior que los compense
              exactamente.
    resolucion: |
      **Qué tipo de problema es.** El cilindro ya está deslizando sobre las dos
      caras, así que el rozamiento es cinético y se escribe $\mu N$ en cada
      contacto desde el principio. Girando en sentido antihorario, el punto de
      contacto de la izquierda baja por su rampa y el de la derecha sube, y
      cada rozamiento se opone a eso.

      **Las normales.** Proyectando en los dos ejes, con las normales a 45°:

      $$
      N_1(1-\mu) = N_2(1+\mu)
      \qquad
      N_1(1+\mu) + N_2(1-\mu) = \sqrt{2}\,mg
      $$

      $$
      N_1 = \frac{\sqrt{2}\,mg\,(1+\mu)}{2\,(1+\mu^{2})}
      \qquad
      N_2 = \frac{\sqrt{2}\,mg\,(1-\mu)}{2\,(1+\mu^{2})}
      $$

      El giro descompensa los apoyos: con $\mu = 0{,}3$ el de la izquierda se
      lleva $0{,}843\,mg$ y el de la derecha, $0{,}454\,mg$.

      **El momento.** En el centro solo dan momento los rozamientos, los dos con
      brazo $r$ y los dos frenando:

      $$
      M = \mu\,(N_1+N_2)\,r = \frac{\sqrt{2}\,\mu\,mgr}{1+\mu^{2}}
      $$

      Las tres expresiones coinciden con las publicadas. Comprobadas además
      resolviendo el sistema con los vectores de contacto calculados a partir
      del sentido de giro: 0,84334, 0,45411 y 0,38923 para $\mu = 0{,}3$.

  - id: ejma4-col49-la-cuna-que-empuja-un-bloque-contra-la-pared
    titulo: La cuña que sube un bloque apoyado en la pared
    fuente: >-
      Ejercicio 4.9 · Tema 4, «Rozamiento» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. El dato del primer coeficiente aparece impreso como «0,4,4»;
      el resultado publicado se reproduce exactamente con 0,4, y así se dice en
      el desarrollo.
    nivel: practica
    enunciado: |
      Hallar el valor de $Q$ de modo que el bloque $B$ tenga deslizamiento
      inminente hacia arriba. Se desprecia el peso de $A$. Datos:
      $P = 4000\ \text{kg}*$, $\mu_1 = 0{,}4{,}4$, $\mu_2 = 0{,}3$,
      $\mu_3 = 0{,}2$, $\alpha = 30^{\circ}$.

      <figure>
      <svg viewBox="0 0 300 280" role="img" width="300" height="280" aria-labelledby="ejma4-col49-t ejma4-col49-d">
        <title id="ejma4-col49-t">Cuña horizontal que empuja hacia arriba un bloque apoyado en una pared</title>
        <desc id="ejma4-col49-d">Sobre un suelo horizontal descansa una cuña A, cuya cara superior está inclinada 30 grados y baja hacia la derecha. Sobre esa cara se apoya un bloque B, de peso P, cuyo lado derecho toca una pared vertical. Una fuerza horizontal Q empuja la cuña A hacia la derecha, lo que obliga al bloque B a subir. Hay tres contactos con rozamiento, numerados: 1 entre la cuña y el suelo, 2 entre la cuña y el bloque, y 3 entre el bloque y la pared.</desc>
        <defs>
          <marker id="ejma4-col49-f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d1)"/>
          </marker>
          <marker id="ejma4-col49-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <line x1="20" y1="245" x2="250" y2="245" stroke="var(--ink)" stroke-width="1.4"/>
        <path d="M32 245 L24 253 M62 245 L54 253 M92 245 L84 253 M122 245 L114 253 M152 245 L144 253 M182 245 L174 253 M212 245 L204 253 M242 245 L234 253" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="202" y1="45" x2="202" y2="245" stroke="var(--ink)" stroke-width="1.4"/>
        <path d="M210 52 L202 60 M210 72 L202 80 M210 92 L202 100 M210 112 L202 120 M210 132 L202 140 M210 152 L202 160 M210 172 L202 180 M210 192 L202 200 M210 212 L202 220 M210 232 L202 240" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <path d="M100 120 L200 177.7 L185 245 L100 245 z" fill="var(--faint)" fill-opacity="0.3" stroke="var(--ink)" stroke-width="1.4"/>
        <path d="M140 143.1 L200 177.7 L200 60 L140 60 z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.4"/>
        <text x="112" y="205" font-size="12" fill="var(--ink)">A</text>
        <text x="150" y="80" font-size="12" fill="var(--ink)">B</text>
        <circle cx="170" cy="112" r="3" fill="var(--ink)"/>
        <line x1="170" y1="112" x2="170" y2="152" stroke="var(--ink)" stroke-width="1.5" marker-end="url(#ejma4-col49-g)"/>
        <text x="177" y="144" font-size="11" fill="var(--ink)">P</text>
        <line x1="30" y1="205" x2="94" y2="205" stroke="var(--d1)" stroke-width="2" marker-end="url(#ejma4-col49-f)"/>
        <text x="52" y="197" font-size="12" fill="var(--d1)">Q</text>
        <line x1="100" y1="120" x2="146" y2="120" stroke="var(--faint)" stroke-width="0.8" stroke-dasharray="3 2"/>
        <path d="M128 120 A 28 28 0 0 0 124.5 136.1" fill="none" stroke="var(--ink)" stroke-width="0.9"/>
        <text x="130" y="137" font-size="11" fill="var(--ink)">α</text>
        <circle cx="150" cy="245" r="8" fill="var(--paper)" stroke="var(--flag)" stroke-width="1.2"/>
        <text x="150" y="249" font-size="10" text-anchor="middle" fill="var(--flag)">1</text>
        <circle cx="182" cy="167" r="8" fill="var(--paper)" stroke="var(--flag)" stroke-width="1.2"/>
        <text x="182" y="171" font-size="10" text-anchor="middle" fill="var(--flag)">2</text>
        <circle cx="200" cy="105" r="8" fill="var(--paper)" stroke="var(--flag)" stroke-width="1.2"/>
        <text x="200" y="109" font-size="10" text-anchor="middle" fill="var(--flag)">3</text>
      </svg>
      </figure>
    pide: La fuerza horizontal Q que pone el bloque B a punto de subir.
    pasos:
      - tipo: reconocer
        pregunta: |
          $B$ está a punto de subir mientras $A$ avanza hacia la derecha. ¿Hacia
          dónde va el rozamiento sobre $B$ en cada uno de sus dos contactos?
        opciones:
          - texto: En la pared, hacia abajo; en la cara inclinada, hacia abajo y a la derecha, a lo largo de la cara
            correcta: true
            mensaje: |
              Eso es. $B$ sube, así que la pared lo frena hacia abajo. Y
              respecto de $A$, $B$ se mueve hacia arriba y hacia la izquierda a
              lo largo de la cara, luego el rozamiento sobre $B$ va justo al
              revés.
          - texto: Los dos hacia arriba, porque ayudan a sostener el peso
            mensaje: |
              El rozamiento no elige ayudar: se opone al deslizamiento. Como $B$
              sube, los dos contactos lo frenan, y ponerlos hacia arriba da una
              $Q$ mucho menor que la real.
          - texto: En la pared hacia abajo, y en la cara inclinada no hay rozamiento porque A empuja perpendicularmente
            mensaje: |
              La normal es perpendicular a la cara, pero el enunciado da
              $\mu_2$ para ese contacto justamente porque además hay
              rozamiento, y ahí hay deslizamiento relativo.

      - tipo: calcular
        titulo: La fuerza contra la pared
        pregunta: |
          Del equilibrio de $B$, ¿cuánto vale la normal $N_3$ contra la pared,
          en kg*?
        respuesta:
          tipo: numero
          valor: '5388'
          tolerancia: 10
          formato: un número, en kg*
        distractores:
          - valor: '4245'
            mensaje: |
              Has olvidado el rozamiento de la pared en la ecuación vertical de
              $B$. Al frenar la subida, ese rozamiento obliga a la cuña a
              apretar más, y todas las fuerzas suben.
          - valor: '2611'
            mensaje: |
              Has quitado el rozamiento de la cara inclinada. Con $\mu_2 = 0{,}3$
              la normal $N_2$ tiene que ser bastante mayor, y con ella $N_3$.
        pista: |
          En $B$: horizontal $N_2(\sin\alpha + \mu_2\cos\alpha) = N_3$; vertical
          $N_2(\cos\alpha - \mu_2\sin\alpha) - \mu_3 N_3 = P$.
        desarrollo: |
          $$
          N_2\bigl[\cos\alpha - \mu_2\sin\alpha
          - \mu_3(\sin\alpha + \mu_2\cos\alpha)\bigr] = P
          $$

          $$
          N_2 = \frac{4000}{0{,}5641} = 7091\ \text{kg}*
          \qquad
          N_3 = 7091 \cdot 0{,}7598 = 5388\ \text{kg}*
          $$

      - tipo: calcular
        titulo: La fuerza Q
        pregunta: |
          Con el equilibrio de la cuña $A$, ¿cuánto vale $Q$?
        respuesta:
          tipo: numero
          valor: '7419'
          tolerancia: 10
          formato: un número, en kg*
        distractores:
          - valor: '7622'
            mensaje: |
              Es lo que sale leyendo el dato impreso «0,4,4» como 0,44. Con
              $\mu_1 = 0{,}4$ sale exactamente el resultado publicado, 7419, así
              que la coma de más es una errata.
          - valor: '6988'
            mensaje: |
              Has puesto en la normal del suelo solo el peso $P$. El suelo
              soporta además lo que el rozamiento de la pared empuja hacia
              abajo, así que $N_1 = 5078$ y no 4000.
          - valor: '5844.6'
            mensaje: |
              Has ignorado el rozamiento de la pared. Es el que más encarece la
              maniobra, porque frena la subida de $B$ y obliga a apretar más.
          - valor: '2671.9'
            mensaje: |
              Has dibujado el rozamiento de la cara inclinada al revés, como si
              $B$ bajara. Con $B$ subiendo, ese rozamiento se opone y hay que
              vencerlo.
        pista: |
          $A$ no pesa. En horizontal, $Q = N_3 + \mu_1 N_1$, y la normal del
          suelo es lo que $B$ carga sobre la cuña.
        desarrollo: |
          $$
          N_1 = N_2(\cos\alpha - \mu_2\sin\alpha) = 5078\ \text{kg}*
          $$

          $$
          Q = N_2(\sin\alpha + \mu_2\cos\alpha) + \mu_1 N_1
          = 5388 + 0{,}4 \cdot 5078 = 7419\ \text{kg}*
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'B sube, así que los dos rozamientos que actúan sobre él lo frenan: el de la pared hacia abajo y el de la cara inclinada hacia abajo a lo largo de ella.'
          - texto: Del equilibrio de B salen $N_2 = 7091$ kg* y $N_3 = 5388$ kg*.
          - texto: La cuña A no pesa, y recibe de B una carga vertical de 5078 kg*, que es la normal del suelo.
          - texto: 'En horizontal sobre A: $Q = 5388 + 0{,}4 \cdot 5078 = 7419$ kg*.'
          - texto: Como se desprecia el peso de A, la normal del suelo bajo la cuña es nula y el contacto 1 no aporta rozamiento.
            trampa: true
            mensaje: |
              Que $A$ no pese no quiere decir que no apriete el suelo: le está
              cayendo encima toda la carga vertical que le pasa $B$, 5078 kg*.
              Ese contacto aporta $0{,}4 \cdot 5078 = 2031$ kg*, más de una
              cuarta parte de $Q$.
    resolucion: |
      **El bloque B.** Sube deslizando contra la pared y contra la cara
      inclinada, así que los dos rozamientos lo frenan. Con la normal de la
      cara formando $\alpha$ con la vertical:

      $$
      N_3 = N_2(\sin\alpha + \mu_2\cos\alpha)
      $$

      $$
      N_2(\cos\alpha - \mu_2\sin\alpha) - \mu_3 N_3 - P = 0
      $$

      De las dos, $N_2 = 7091$ kg* y $N_3 = 5388$ kg*.

      **La cuña A.** No pesa, pero recibe de $B$ una carga vertical
      $N_1 = N_2(\cos\alpha - \mu_2\sin\alpha) = 5078$ kg*, que es su normal
      contra el suelo. En horizontal:

      $$
      Q = N_2(\sin\alpha + \mu_2\cos\alpha) + \mu_1 N_1
      = 5388 + 2031 = 7419\ \text{kg}*
      $$

      **Sobre el dato impreso.** El enunciado publica $\mu_1 = 0{,}4{,}4$. Con
      $\mu_1 = 0{,}4$ sale 7419 kg*, exactamente el resultado publicado; con
      0,44 saldrían 7622. La coma de más es una errata de la colección, y el
      valor bueno es 0,4.

  - id: ejma4-col410-la-viga-sobre-dos-ruedas
    titulo: La viga que se mueve sobre dos ruedas
    fuente: >-
      Ejercicio 4.10 · Tema 4, «Rozamiento» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección lo marca como especial y resuelto en el libro; su
      resultado, 225, es correcto pero está impreso en «kg» y sale en newtons.
    nivel: practica
    enunciado: |
      Calcular la fuerza $Q$ mínima para el inicio del desplazamiento de la
      viga. Comprobar los siguientes casos:

      a. Deslizamiento entre rueda-viga.

      b. Deslizamiento entre rueda y suelo.

      c. Rodadura entre rueda y suelo.

      Datos: $P = 12\ \text{kN}$; $a = 8\ \text{m}$; $b = 4\ \text{m}$,
      $r = 4\ \text{cm}$. Entre ruega y viga: $\mu_{r,1} = 0{,}05\ \text{cm}$;
      $\mu_1 = 0{,}25$. Entre rueda y suelo: $\mu_{r,2} = 0{,}1\ \text{cm}$;
      $\mu_2 = 0{,}4$.

      <figure>
      <svg viewBox="0 0 380 205" role="img" width="380" height="205" aria-labelledby="ejma4-col410-t ejma4-col410-d">
        <title id="ejma4-col410-t">Viga apoyada sobre dos ruedas, empujada por una fuerza horizontal</title>
        <desc id="ejma4-col410-d">Una viga horizontal descansa sobre dos ruedas iguales que a su vez ruedan sobre el suelo. Una fuerza horizontal Q empuja la viga por su extremo izquierdo. Una carga vertical P actúa sobre la viga entre las dos ruedas, a una distancia a de la primera y b de la segunda, con a doble que b. Los contactos van numerados: 1 entre la fuerza y la viga, 2 en la rueda izquierda y 3 en la derecha. Las ruedas están dibujadas mucho mayores de lo que serían a escala.</desc>
        <defs>
          <marker id="ejma4-col410-f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d1)"/>
          </marker>
          <marker id="ejma4-col410-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
          <marker id="ejma4-col410-h" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M8 0 L0 4 L8 8 z" fill="var(--faint)"/>
          </marker>
        </defs>
        <line x1="40" y1="165" x2="370" y2="165" stroke="var(--ink)" stroke-width="1.4"/>
        <path d="M52 165 L44 173 M82 165 L74 173 M112 165 L104 173 M142 165 L134 173 M172 165 L164 173 M202 165 L194 173 M232 165 L224 173 M262 165 L254 173 M292 165 L284 173 M322 165 L314 173 M352 165 L344 173 M368 165 L360 173" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <rect x="60" y="95" width="290" height="10" fill="var(--faint)" fill-opacity="0.3" stroke="var(--ink)" stroke-width="1.3"/>
        <circle cx="150" cy="135" r="30" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.4"/>
        <circle cx="150" cy="135" r="2.6" fill="var(--ink)"/>
        <circle cx="280" cy="135" r="30" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.4"/>
        <circle cx="280" cy="135" r="2.6" fill="var(--ink)"/>
        <line x1="12" y1="100" x2="56" y2="100" stroke="var(--d1)" stroke-width="2" marker-end="url(#ejma4-col410-f)"/>
        <text x="26" y="92" font-size="12" fill="var(--d1)">Q</text>
        <line x1="237" y1="42" x2="237" y2="92" stroke="var(--ink)" stroke-width="1.6" marker-end="url(#ejma4-col410-g)"/>
        <text x="243" y="56" font-size="12" fill="var(--ink)">P</text>
        <line x1="150" y1="60" x2="237" y2="60" stroke="var(--faint)" stroke-width="0.8" marker-start="url(#ejma4-col410-h)" marker-end="url(#ejma4-col410-h)"/>
        <text x="193" y="54" font-size="10" text-anchor="middle" fill="var(--faint)">a</text>
        <line x1="237" y1="60" x2="280" y2="60" stroke="var(--faint)" stroke-width="0.8" marker-start="url(#ejma4-col410-h)" marker-end="url(#ejma4-col410-h)"/>
        <text x="258" y="54" font-size="10" text-anchor="middle" fill="var(--faint)">b</text>
        <line x1="150" y1="66" x2="150" y2="100" stroke="var(--faint)" stroke-width="0.6" stroke-dasharray="3 2"/>
        <line x1="280" y1="66" x2="280" y2="100" stroke="var(--faint)" stroke-width="0.6" stroke-dasharray="3 2"/>
        <circle cx="95" cy="100" r="8" fill="var(--paper)" stroke="var(--flag)" stroke-width="1.2"/>
        <text x="95" y="104" font-size="10" text-anchor="middle" fill="var(--flag)">1</text>
        <circle cx="133" cy="118" r="8" fill="var(--paper)" stroke="var(--flag)" stroke-width="1.2"/>
        <text x="133" y="122" font-size="10" text-anchor="middle" fill="var(--flag)">2</text>
        <circle cx="263" cy="118" r="8" fill="var(--paper)" stroke="var(--flag)" stroke-width="1.2"/>
        <text x="263" y="122" font-size="10" text-anchor="middle" fill="var(--flag)">3</text>
      </svg>
      </figure>
    pide: La fuerza mínima que mueve la viga, comparando los tres modos posibles.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado da $\mu_{r,1} = 0{,}05$ cm y $\mu_{r,2} = 0{,}1$ cm.
          ¿Qué son esos dos números?
        opciones:
          - texto: Coeficientes de resistencia a la rodadura, que son longitudes; el adelanto de la normal en cada contacto
            correcta: true
            mensaje: |
              Eso es, y por eso vienen en centímetros. Es la distancia que la
              normal se adelanta en el sentido del movimiento, y en la fórmula
              aparece siempre dividida por el radio.
          - texto: Coeficientes de rozamiento pequeños, adimensionales, para cuando la rueda casi no roza
            mensaje: |
              No son adimensionales: llevan unidades de longitud, centímetros.
              Tratarlos como coeficientes de rozamiento da una fuerza cientos de
              veces mayor que la real.
          - texto: El radio de la zona de contacto aplastada de la rueda
            mensaje: |
              La zona de contacto se aplasta, sí, y de ahí viene el fenómeno,
              pero $\mu_r$ no es su tamaño: es el brazo con el que la resultante
              de la normal queda adelantada.

      - tipo: calcular
        titulo: Caso a, deslizamiento entre rueda y viga
        pregunta: |
          ¿Qué fuerza $Q$ haría deslizar la viga sobre las ruedas?
        respuesta:
          tipo: magnitud
          valor: '3 kN'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '2 kN'
            mensaje: |
              Has usado solo la carga de una rueda, la más cargada. Las dos
              ruedas rozan contra la viga, y entre las dos soportan los 12 kN.
          - valor: '4.8 kN'
            mensaje: |
              Has usado $\mu_2$, el del suelo. Entre rueda y viga el
              coeficiente es $\mu_1 = 0{,}25$.
        pista: |
          Las dos ruedas juntas soportan la carga entera. Deslizar la viga
          sobre ellas cuesta $\mu_1$ por esa carga.
        desarrollo: |
          $$
          Q_a = \mu_1\,P = 0{,}25 \cdot 12 = 3\ \text{kN}
          $$

      - tipo: calcular
        titulo: Caso b, deslizamiento entre rueda y suelo
        pregunta: |
          ¿Y qué fuerza haría deslizar el conjunto sobre el suelo, con las
          ruedas bloqueadas?
        respuesta:
          tipo: magnitud
          valor: '4.8 kN'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '3 kN'
            mensaje: |
              Has vuelto a usar $\mu_1$. Contra el suelo el coeficiente es
              $\mu_2 = 0{,}4$.
          - valor: '3.2 kN'
            mensaje: |
              Has usado la carga de una sola rueda. El suelo aguanta los 12 kN
              completos, repartidos entre los dos contactos.
        pista: |
          Igual que antes, pero con el coeficiente del suelo.
        desarrollo: |
          $$
          Q_b = \mu_2\,P = 0{,}4 \cdot 12 = 4{,}8\ \text{kN}
          $$

      - tipo: calcular
        titulo: Caso c, rodadura
        pregunta: |
          Si las ruedas ruedan, cada una vence la resistencia a la rodadura en
          sus **dos** contactos. ¿Cuánto vale $Q$?
        respuesta:
          tipo: magnitud
          valor: '225 N'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '450 N'
            mensaje: |
              Has usado $r$ como brazo en vez de $2r$. Las dos fuerzas
              horizontales de la rueda, la de arriba y la de abajo, forman un
              par cuyo brazo es el diámetro.
          - valor: '1800 N'
            mensaje: |
              Has tratado $\mu_r$ como si fuera adimensional, multiplicándolo
              por la carga. Es una longitud, y va dividido por el radio.
          - valor: '2207 N'
            mensaje: |
              Son los 225 leídos como kilogramos-fuerza y pasados a newtons. La
              colección imprime «225 kg», pero con $P$ en kN el resultado sale
              en newtons.
          - valor: '150 N'
            mensaje: |
              Solo has contado el contacto con el suelo. La rueda también rueda
              contra la viga, y las dos resistencias se suman.
        pista: |
          Para una rueda con carga $N$: $2r\,F = N(\mu_{r,1} + \mu_{r,2})$.
          Súmalo para las dos, que entre ambas llevan $P$.
        desarrollo: |
          Tomando momentos en una rueda, las dos normales adelantadas frenan y
          las dos fuerzas horizontales forman un par de brazo $2r$:

          $$
          F = \frac{N\,(\mu_{r,1} + \mu_{r,2})}{2r}
          $$

          Sumando las dos ruedas, cuyas cargas suman $P$:

          $$
          Q_c = \frac{P\,(\mu_{r,1}+\mu_{r,2})}{2r}
          = \frac{12000 \cdot 0{,}0015}{2 \cdot 0{,}04} = 225\ \text{N}
          $$

          Con todo en metros: $\mu_{r,1} = 0{,}0005$ m,
          $\mu_{r,2} = 0{,}001$ m, $r = 0{,}04$ m.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Hay tres formas de que la viga empiece a moverse: deslizar sobre las ruedas, deslizar con todo el conjunto sobre el suelo, o hacer rodar las ruedas.'
          - texto: 'Deslizar sobre las ruedas cuesta $0{,}25 \cdot 12 = 3$ kN; deslizar sobre el suelo, $0{,}4 \cdot 12 = 4{,}8$ kN.'
          - texto: 'Rodar cuesta $P(\mu_{r,1}+\mu_{r,2})/(2r) = 225$ N, con las tres longitudes en metros.'
          - texto: 'La menor de las tres es la que ocurre: la viga se mueve haciendo rodar las ruedas, con 225 N.'
          - texto: Como la rodadura es la que menos fuerza pide, el rozamiento entre rueda y suelo no interviene y podría ser nulo.
            trampa: true
            mensaje: |
              Justo al revés: rodar sin deslizar **exige** rozamiento suficiente.
              Lo que pasa es que aquí sobra de largo, porque la fuerza que cada
              contacto necesita es $0{,}019$ veces su normal, muy por debajo de
              $\mu_1$ y $\mu_2$.
    resolucion: |
      **Las cargas.** La viga reparte los 12 kN entre las dos ruedas según las
      distancias: 4 kN en la rueda 2 y 8 kN en la 3. Para lo que sigue solo
      importa que entre las dos suman $P$.

      **Caso a.** La viga desliza sobre las ruedas, que se quedan quietas:

      $$
      Q_a = \mu_1 P = 0{,}25 \cdot 12 = 3\ \text{kN}
      $$

      **Caso b.** Todo el conjunto desliza sobre el suelo:

      $$
      Q_b = \mu_2 P = 0{,}4 \cdot 12 = 4{,}8\ \text{kN}
      $$

      **Caso c.** Las ruedas ruedan. Cada rueda tiene resistencia a la rodadura
      arriba y abajo, y sus dos fuerzas horizontales forman un par de brazo
      $2r$:

      $$
      2r\,F = N\,(\mu_{r,1} + \mu_{r,2})
      \qquad
      Q_c = \frac{P(\mu_{r,1}+\mu_{r,2})}{2r}
      = \frac{12000 \cdot 0{,}0015}{0{,}08} = 225\ \text{N}
      $$

      **Cuál gana.** La menor con diferencia es la rodadura: 225 N frente a 3000
      y 4800. Y es coherente, porque el rozamiento que cada contacto necesita
      para que la rueda ruede sin deslizar es $0{,}019$ veces su normal, muy por
      debajo de los coeficientes disponibles.

      **Sobre las unidades del resultado impreso.** La colección publica
      «$Q = 225$ kg (caso c)». El número es el correcto, pero con $P$ dado en kN
      el resultado sale en **newtons**: 225 N, que son 23 kg*.

  - id: ejma4-col411-las-dos-barras-y-el-par
    titulo: Las dos barras articuladas y el par que las mantiene
    fuente: >-
      Ejercicio 4.11 · Tema 4, «Rozamiento» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección lo marca como de nivel de examen. Su cota
      inferior sale; la superior lleva un signo cambiado, y el desarrollo lo
      demuestra y publica la correcta.
    nivel: practica
    enunciado: |
      Una barra $OA$ de masa $m$ y longitud $2L$ está articulada a un apoyo fijo
      en $O$ y al extremo $A$ de otra barra igual $AB$, apoyada en $B$ sobre un
      suelo rugoso de coeficiente de rozamiento conocido $f$. Calcular entre qué
      valores oscila el valor del par $P$ aplicado en el centro de $AB$, para
      que el sistema esté en equilibrio.

      <figure>
      <svg viewBox="0 0 340 220" role="img" width="340" height="220" aria-labelledby="ejma4-col411-t ejma4-col411-d">
        <title id="ejma4-col411-t">Dos barras iguales articuladas formando un triángulo con el suelo</title>
        <desc id="ejma4-col411-d">Dos barras iguales, cada una de masa m y longitud 2L, forman una uve invertida. La barra OA sale de una articulación fija O en el suelo y sube a 45 grados hasta el vértice A. Desde A, la barra AB baja a 45 grados hasta apoyarse en el suelo en el punto B, que puede deslizar. En el centro de la barra AB se aplica un par P, dibujado en sentido horario.</desc>
        <defs>
          <marker id="ejma4-col411-f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d1)"/>
          </marker>
        </defs>
        <line x1="30" y1="175" x2="320" y2="175" stroke="var(--ink)" stroke-width="1.4"/>
        <path d="M42 175 L34 183 M72 175 L64 183 M102 175 L94 183 M132 175 L124 183 M162 175 L154 183 M192 175 L184 183 M222 175 L214 183 M252 175 L244 183 M282 175 L274 183 M312 175 L304 183" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="60" y1="175" x2="170" y2="65" stroke="var(--ink)" stroke-width="4"/>
        <line x1="170" y1="65" x2="280" y2="175" stroke="var(--ink)" stroke-width="4"/>
        <rect x="47" y="162" width="26" height="26" rx="4" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
        <circle cx="60" cy="175" r="3.4" fill="var(--ink)"/>
        <circle cx="170" cy="65" r="4.2" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.4"/>
        <circle cx="280" cy="175" r="3.4" fill="var(--flag)"/>
        <text x="44" y="158" font-size="12" text-anchor="end" fill="var(--ink)">O</text>
        <text x="170" y="54" font-size="12" text-anchor="middle" fill="var(--ink)">A</text>
        <text x="288" y="168" font-size="12" fill="var(--flag)">B</text>
        <text x="86" y="108" font-size="11" fill="var(--ink)">m, 2L</text>
        <text x="228" y="108" font-size="11" fill="var(--ink)">m, 2L</text>
        <path d="M100 175 A 40 40 0 0 0 88.8 146.8" fill="none" stroke="var(--ink)" stroke-width="0.9"/>
        <text x="106" y="163" font-size="11" fill="var(--ink)">45°</text>
        <path d="M243 100 A 30 30 0 1 1 209 129" fill="none" stroke="var(--d1)" stroke-width="1.8" marker-end="url(#ejma4-col411-f)"/>
        <text x="252" y="96" font-size="12" fill="var(--d1)">P</text>
      </svg>
      </figure>
    pide: Los valores máximo y mínimo del par que mantienen el sistema en equilibrio.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué este problema tiene dos respuestas y no una?
        opciones:
          - texto: Porque el equilibrio puede romperse en dos sentidos, y el rozamiento en B cambia de signo según cuál
            correcta: true
            mensaje: |
              Eso es, y es lo que avisa la nota de la colección. Con el par
              pequeño el sistema se abre y $B$ se va hacia fuera; con el par
              grande se cierra y $B$ se va hacia dentro. El rozamiento se opone
              a cada uno, así que hay que resolver dos veces.
          - texto: Porque hay dos barras, y cada una da su propia condición de equilibrio
            mensaje: |
              Las dos barras dan ecuaciones, pero la horquilla no sale de ahí:
              sale de que $|F| \le fN$ es una **desigualdad** con dos lados.
          - texto: Porque el rozamiento estático y el cinético son distintos
            mensaje: |
              Aquí solo aparece un coeficiente, $f$, y todo el problema es
              estático. Los dos valores son los dos extremos de la misma
              desigualdad.

      - tipo: calcular
        titulo: El par que no necesita rozamiento
        pregunta: |
          Hay un valor de $P$ para el que $B$ no necesita rozamiento ninguno.
          ¿Cuánto vale, en unidades de $mgL$?
        respuesta:
          tipo: numero
          valor: '1.4142'
          tolerancia: 0.005
          formato: un número, P dividido entre mgL
        distractores:
          - valor: '1'
            mensaje: |
              Te falta el $\sqrt{2}$ de la geometría a 45°. Los brazos salen
              todos con $\sqrt{2}L$, y por eso el resultado lo lleva.
          - valor: '2'
            mensaje: |
              Has contado el peso de las dos barras en el equilibrio de $AB$.
              Tomando momentos en $A$ sobre la barra $AB$ sola, solo entra el
              peso de esa barra.
        pista: |
          Impón $F = 0$ en $B$. Con momentos en $O$ para todo el sistema sale
          $N$, y con momentos en $A$ para la barra $AB$, la relación con $P$.
        desarrollo: |
          Momentos en $O$ para el conjunto y en $A$ para la barra $AB$, con
          $p = P/(2\sqrt{2}\,mgL)$:

          $$
          N = mg\,(1+p)
          \qquad
          F = mg\left(p - \tfrac{1}{2}\right)
          $$

          $F$ se anula en $p = 1/2$, o sea

          $$
          P = 2\sqrt{2}\,mgL \cdot \tfrac{1}{2} = \sqrt{2}\,mgL = 1{,}4142\,mgL
          $$

          Este valor vale para **cualquier** $f$, incluso para $f = 0$, y es la
          comprobación que decide el resultado del problema.

      - tipo: calcular
        titulo: El par mínimo
        pregunta: |
          Con $f = 0{,}25$, un valor nuestro para poner número, ¿cuál es el par
          mínimo en unidades de $mgL$?
        respuesta:
          tipo: numero
          valor: '0.5657'
          tolerancia: 0.004
          formato: un número, P dividido entre mgL
        distractores:
          - valor: '1.4142'
            mensaje: |
              Ese es el par sin rozamiento. Con rozamiento el sistema aguanta
              pares menores, porque el suelo sujeta a $B$ mientras el conjunto
              tiende a abrirse.
          - valor: '0.8485'
            mensaje: |
              Has perdido el 2 del término $1-2f$. La cuenta da
              $(1-2f)/(1+f)$, no $(1-f)/(1+f)$.
          - valor: '1.6971'
            mensaje: |
              Has puesto el rozamiento en el sentido contrario. Con el par
              pequeño el sistema se abre, $B$ tiende a salir hacia fuera y el
              rozamiento lo frena hacia dentro.
        pista: |
          Es el caso $F < 0$: impón $\tfrac{1}{2} - p \le f(1+p)$ y despeja $p$.
        desarrollo: |
          $$
          \tfrac{1}{2} - p \le f\,(1+p)
          \;\Longrightarrow\;
          p \ge \frac{1-2f}{2(1+f)}
          $$

          $$
          P_{\min} = \sqrt{2}\,mgL\,\frac{1-2f}{1+f}
          = \sqrt{2}\cdot\frac{0{,}5}{1{,}25}\,mgL = 0{,}5657\,mgL
          $$

      - tipo: calcular
        titulo: El par máximo
        pregunta: |
          Con el mismo $f = 0{,}25$, ¿cuál es el par máximo en unidades de
          $mgL$?
        respuesta:
          tipo: numero
          valor: '2.8284'
          tolerancia: 0.01
          formato: un número, P dividido entre mgL
        distractores:
          - valor: '0.9428'
            mensaje: |
              Es lo que da la fórmula impresa,
              $\sqrt{2}\,mgL\,(1-2f)/(1-f)$, y no puede ser: es **menor** que
              $\sqrt{2}\,mgL$, el par que equilibra sin ningún rozamiento. Un
              máximo que deja fuera un caso de equilibrio seguro está mal.
          - valor: '1.4142'
            mensaje: |
              Ese es el par sin rozamiento, que está dentro de la horquilla, no
              en su borde. Con rozamiento se puede apretar bastante más antes
              de que $B$ escape hacia dentro.
          - valor: '1.8856'
            mensaje: |
              Ese es el máximo que saldría con $f = 0{,}1$. Con $f = 0{,}25$ el
              denominador $1-f$ vale 0,75.
        pista: |
          Es el caso $F > 0$: impón $p - \tfrac{1}{2} \le f(1+p)$ y despeja $p$.
        desarrollo: |
          $$
          p - \tfrac{1}{2} \le f\,(1+p)
          \;\Longrightarrow\;
          p \le \frac{1+2f}{2(1-f)}
          $$

          $$
          P_{\max} = \sqrt{2}\,mgL\,\frac{1+2f}{1-f}
          = \sqrt{2}\cdot\frac{1{,}5}{0{,}75}\,mgL = 2{,}8284\,mgL
          $$

          Ojo al numerador: es $1+2f$, no $1-2f$ como imprime la colección.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Momentos en O para el conjunto: la normal en B vale $N = mg + P/(2\sqrt{2}L)$.'
          - texto: 'Momentos en A para la barra AB: el rozamiento vale $F = P/(2\sqrt{2}L) - mg/2$.'
          - texto: El equilibrio exige $|F| \le fN$, y esa desigualdad con dos lados da las dos cotas.
          - texto: 'Salen $P_{\min} = \sqrt{2}mgL(1-2f)/(1+f)$ y $P_{\max} = \sqrt{2}mgL(1+2f)/(1-f)$.'
          - texto: Con $f = 1/2$ la horquilla se cierra y el único par que equilibra es $P = 0$.
            trampa: true
            mensaje: |
              Eso es lo que diría la fórmula impresa, y basta un caso para
              tumbarla: $P = \sqrt{2}mgL$ da $F = 0$ exactamente, así que
              equilibra con cualquier $f$, incluido $f = 1/2$. Lo que ocurre con
              $f = 1/2$ es que la cota **inferior** se hace nula, no que la
              horquilla desaparezca.
    resolucion: |
      **Las dos ecuaciones que hacen falta.** Con momentos en $O$ para el sistema
      completo sale la normal en $B$, y con momentos en $A$ para la barra $AB$
      sola, el rozamiento. Llamando $p = P/(2\sqrt{2}\,mgL)$:

      $$
      N = mg\,(1+p)
      \qquad
      F = mg\left(p - \frac{1}{2}\right)
      $$

      **Los dos sentidos.** El equilibrio pide $|F| \le f N$, que son dos
      condiciones:

      $$
      \frac{1-2f}{2(1+f)} \le p \le \frac{1+2f}{2(1-f)}
      $$

      $$
      \sqrt{2}\,mgL\,\frac{1-2f}{1+f} \le P \le \sqrt{2}\,mgL\,\frac{1+2f}{1-f}
      $$

      **La cota superior impresa está mal.** La colección publica
      $\sqrt{2}\,mgL\,(1-2f)/(1-f)$, con $1-2f$ en el numerador. Se cae con una
      comprobación de una línea: $p = 1/2$, o sea $P = \sqrt{2}\,mgL$, anula el
      rozamiento —$F = 0$, $N = 1{,}5\,mg$— y por tanto equilibra **para
      cualquier** $f$, incluso $f = 0$. La fórmula impresa da un máximo menor
      que $\sqrt{2}\,mgL$ en cuanto $f > 0$, y con $f = 1/2$ colapsa a $P = 0$:
      dejaría fuera un equilibrio que existe seguro. Con $1+2f$ todo encaja.

      **Comprobación numérica.** Resolviendo el sistema de seis ecuaciones y
      buscando por bisección dónde deja de cumplirse $|F| \le fN$: con
      $f = 0{,}25$ salen 0,56569 y 2,82843 en unidades de $mgL$, y con
      $f = 0{,}1$, 1,02852 y 1,88562. Los cuatro coinciden con las fórmulas de
      arriba hasta la quinta cifra.

  - id: ejma4-col412-la-barra-apoyada-en-un-disco
    titulo: La barra apoyada en un disco, y el intervalo de la fuerza
    fuente: >-
      Ejercicio 4.12 · Tema 4, «Rozamiento» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección lo marca como de nivel de examen. La colección
      publica el resultado, contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Una barra $AB$ (1) de longitud $2L$ y masa $M$ se encuentra articulada en
      el punto $A$ al suelo y apoyada en un punto $G$ sobre un disco (2) sin
      masa de radio $R$. El disco está sobre un suelo rugoso con coeficiente de
      rozamiento $f = \frac{1}{\sqrt{2}}$. En el contacto entre barra y disco,
      existe rodadura. En el centro del disco, se aplica una fuerza horizontal
      $F$. Determinar entre qué valores debe encontrarse $F$ para que exista
      equilibrio.

      <figure>
      <svg viewBox="0 0 420 280" role="img" width="420" height="280" aria-labelledby="ma4c412-t ma4c412-d">
        <title id="ma4c412-t">Barra articulada en A, a 45 grados, apoyada por su punto medio sobre un disco</title>
        <desc id="ma4c412-d">Un suelo horizontal. La barra AB sale del suelo en A con una articulación y sube a 45 grados hacia la derecha. Su punto medio G se apoya sobre un disco de radio R que descansa en el suelo, tangente a la barra en G. En el centro O del disco actúa una fuerza horizontal F dibujada hacia la izquierda. El coeficiente de rozamiento entre el disco y el suelo es uno partido por raíz de dos.</desc>
        <defs>
          <marker id="ma4c412-f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d1)"/>
          </marker>
        </defs>
        <line x1="30" y1="230" x2="390" y2="230" stroke="var(--ink)" stroke-width="1.2"/>
        <path d="M40 230 L32 238 M70 230 L62 238 M100 230 L92 238 M130 230 L122 238 M160 230 L152 238 M190 230 L182 238 M220 230 L212 238 M250 230 L242 238 M280 230 L272 238 M310 230 L302 238 M340 230 L332 238 M370 230 L362 238" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <circle cx="200" cy="176" r="54" fill="var(--faint)" fill-opacity="0.12" stroke="var(--ink)" stroke-width="1.3"/>
        <line x1="70" y1="230" x2="254" y2="46" stroke="var(--ink)" stroke-width="3"/>
        <circle cx="70" cy="230" r="4" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
        <circle cx="162" cy="138" r="3" fill="var(--ink)"/>
        <circle cx="200" cy="176" r="2.6" fill="var(--ink)"/>
        <line x1="200" y1="176" x2="162" y2="138" stroke="var(--faint)" stroke-width="0.9"/>
        <text x="186" y="166" font-size="9" fill="var(--faint)">R</text>
        <line x1="200" y1="176" x2="130" y2="176" stroke="var(--d1)" stroke-width="2" marker-end="url(#ma4c412-f)"/>
        <text x="150" y="168" font-size="10" fill="var(--d1)">F</text>
        <path d="M96 230 A 26 26 0 0 0 88 212" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <text x="102" y="222" font-size="9" fill="var(--faint)">45°</text>
        <line x1="59" y1="219" x2="243" y2="35" stroke="var(--faint)" stroke-width="0.7"/>
        <text x="126" y="120" font-size="9.5" text-anchor="end" fill="var(--faint)">2L</text>
        <text x="62" y="246" font-size="10" text-anchor="end" fill="var(--ink)">A</text>
        <text x="260" y="42" font-size="10" fill="var(--ink)">B</text>
        <text x="150" y="130" font-size="10" text-anchor="end" fill="var(--ink)">G</text>
        <text x="208" y="194" font-size="10" fill="var(--ink)">O</text>
        <text x="250" y="250" font-size="9.5" fill="var(--faint)">f = 1/√2</text>
      </svg>
      <figcaption>

      La barra a **45°**, con su punto medio **G** justo sobre el disco: el
      apoyo cae en el centro de gravedad. La fuerza **F** está dibujada hacia
      la izquierda, que es el sentido positivo del resultado.

      </figcaption>
      </figure>
    pide: Los dos valores extremos de F, en unidades de Mg, entre los que hay equilibrio.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué fija la normal $N$ entre la barra y el disco en $G$?
        opciones:
          - texto: Los momentos en A sobre la barra, y sale Mg partido por raíz de dos sin depender de F
            correcta: true
            mensaje: |
              Eso es. El rozamiento en $G$ va en la dirección de la barra, así
              que pasa por $A$ y no da momento allí. Queda
              $N\,L = Mg\,L\cos 45^\circ$, con la normal independiente de $F$.
          - texto: Hay que resolver antes el disco, porque la normal depende de la fuerza F
            mensaje: |
              La barra sola ya la fija. Su ecuación de momentos en $A$ solo
              contiene el peso y la normal, porque el rozamiento en $G$ tiene la
              dirección de la barra y su recta de acción pasa por $A$.
          - texto: Vale Mg, porque el disco soporta todo el peso de la barra
            mensaje: |
              La barra está articulada en $A$, y la articulación se lleva su
              parte. Además la normal es perpendicular a la barra, no vertical,
              así que ni siquiera equilibra por sí sola un peso vertical.

      - tipo: calcular
        titulo: El valor máximo de la fuerza
        pregunta: |
          ¿Cuál es el mayor valor de $F$ que admite el equilibrio, medido en
          unidades de $Mg$?
        respuesta:
          tipo: numero
          valor: '0.902369'
          tolerancia: 0.003
          formato: un número, la fuerza dividida entre Mg
        distractores:
          - valor: '0.5'
            mensaje: |
              Ese es el valor que equilibra el disco **sin** rozamiento en el
              suelo, la mitad de la normal. El rozamiento del suelo empuja en el
              mismo sentido y deja subir a $F$ bastante más.
          - valor: '1.1036'
            mensaje: |
              Has tomado la normal del suelo como $Mg/2$. El propio rozamiento
              en $G$ tiene componente vertical y descarga esa normal, así que
              hay que resolverla junto con el rozamiento, no antes.
        pista: |
          En el disco, sin masa, los momentos en su centro igualan los dos
          rozamientos. Después impón $F_C = f\,N_C$ con el suelo.
        desarrollo: |
          $$
          N = \frac{Mg}{\sqrt{2}}
          \qquad
          F = \frac{Mg}{2} + T\left(1 + \frac{1}{\sqrt{2}}\right)
          \qquad
          N_C = \frac{Mg}{2} - \frac{T}{\sqrt{2}}
          $$

          Con $T = f\,N_C$ y $f = 1/\sqrt{2}$ sale $T = Mg/(3\sqrt{2})$ y

          $$
          F_{\max} = \frac{Mg\,(4 + \sqrt{2})}{6} = 0{,}9024\,Mg
          $$

      - tipo: calcular
        titulo: El valor mínimo de la fuerza
        pregunta: |
          ¿Cuál es el menor valor de $F$, en unidades de $Mg$? Un valor
          negativo significa que la fuerza apunta al otro lado.
        respuesta:
          tipo: numero
          valor: '-0.707107'
          tolerancia: 0.003
          formato: un número con su signo, la fuerza dividida entre Mg
        distractores:
          - valor: '-0.902369'
            mensaje: |
              Has supuesto que el intervalo es simétrico. No lo es: al cambiar
              el sentido del rozamiento cambia también la normal del suelo, y
              con ella el rozamiento máximo disponible.
          - valor: '-0.5'
            mensaje: |
              Eso sale de anular el rozamiento del suelo. Con rozamiento el
              intervalo se ensancha por los dos lados, y por este el margen
              extra vale $Mg/\sqrt{2}$ menos $Mg/2$.
        pista: |
          Ahora el rozamiento del suelo apunta al revés, $T < 0$, y **aumenta**
          la normal $N_C$.
        desarrollo: |
          $$
          T = -\frac{Mg}{\sqrt{2}}
          \qquad\Longrightarrow\qquad
          F_{\min} = \frac{Mg}{2} - \frac{Mg}{\sqrt{2}}\left(1+\frac{1}{\sqrt{2}}\right)
          = -\frac{Mg}{\sqrt{2}}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: 'Momentos en A sobre la barra: la normal en G vale Mg partido por raíz de dos, y no depende de F.'
          - texto: El disco no tiene masa, así que los momentos en su centro obligan a que el rozamiento en G y el del suelo sean iguales.
          - texto: El equilibrio se rompe deslizando en el suelo, y por eso hay dos límites, uno por cada sentido del rozamiento.
          - texto: Como en el suelo el rozamiento vale siempre f por la normal, F queda determinada y no existe intervalo.
            trampa: true
            mensaje: |
              $F_r = f\,N$ solo se cumple **en el límite**. Mientras no hay
              deslizamiento el rozamiento toma el valor que pida el equilibrio,
              y eso es justo lo que produce un intervalo de $F$ en vez de un
              único valor.
    resolucion: |
      **La normal en G.** Como $G$ es el punto medio de la barra, ahí está
      también su centro de gravedad. Tomando momentos en $A$, el rozamiento en
      $G$ va en la dirección de la barra y no da momento:

      $$
      N\,L = Mg\,L\,\cos 45^\circ
      \qquad\Longrightarrow\qquad
      N = \frac{Mg}{\sqrt{2}}
      $$

      **El disco.** No tiene masa, así que los momentos en su centro dan
      $T = F_C$: el rozamiento con la barra y el del suelo son iguales.
      Proyectando,

      $$
      F = \frac{Mg}{2} + T\left(1+\frac{1}{\sqrt{2}}\right)
      \qquad
      N_C = \frac{Mg}{2} - \frac{T}{\sqrt{2}}
      $$

      **Los dos límites.** El equilibrio se rompe cuando el suelo no aguanta,
      $|F_C| = f\,N_C$ con $f = 1/\sqrt{2}$. Con $T > 0$ sale
      $T = Mg/(3\sqrt{2})$ y con $T < 0$ sale $T = -Mg/\sqrt{2}$, de donde

      $$
      -\frac{Mg}{\sqrt{2}} \le F \le \frac{Mg\,(4+\sqrt{2})}{6}
      $$

      que es el resultado publicado. En el extremo superior la normal del suelo
      todavía vale $Mg/3$, positiva, así que el disco sigue apoyado.

  - id: ejma4-col413-el-disco-entre-la-pared-y-la-barra
    titulo: El disco entre una pared y una barra, sostenido por un peso
    fuente: >-
      Ejercicio 4.13 · Tema 4, «Rozamiento» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección lo marca como de nivel de examen. La colección
      publica el resultado, contra el que está contrastado el desarrollo. Que
      el hilo salga de A perpendicular a la barra se lee de la figura, y es lo
      que reproduce el resultado publicado.
    nivel: practica
    enunciado: |
      Un disco de centro $G$, radio $R$ y masa $M$ se encuentra entre una pared
      vertical $OB$ y una barra $OA$ sin masa de longitud $3R$. El coeficiente
      de rozamiento entre disco y barra es $0{,}5$ y entre disco y pared muy
      grande de forma que no hay deslizamiento entre pared y disco. El sistema
      está equilibrado gracias al peso $P$ que tensa el hilo que pasa por las
      poleas $B$ y $C$ hasta el punto $A$. Puede despreciarse el radio y la
      fricción en las poleas. Determinar los límites entre los que debe estar
      $P$ para que el sistema permanezca en reposo (equilibrio).

      <figure>
      <svg viewBox="0 0 330 300" role="img" width="330" height="300" aria-labelledby="ma4c413-t ma4c413-d">
        <title id="ma4c413-t">Disco encajado entre una pared vertical y una barra articulada en O</title>
        <desc id="ma4c413-d">Una pared vertical. En su pie, en O, hay una articulación de la que sale una barra OA de longitud tres R inclinada 30 grados sobre la horizontal. Entre la pared y la barra queda encajado un disco de centro G y radio R, tangente a las dos. Del extremo A sale un hilo perpendicular a la barra que sube hasta la polea B, en la pared, y de ahí se va hacia la izquierda tirando con el peso P.</desc>
        <defs>
          <marker id="ma4c413-f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d1)"/>
          </marker>
        </defs>
        <line x1="120" y1="15" x2="120" y2="272" stroke="var(--ink)" stroke-width="1.4"/>
        <path d="M120 25 L112 33 M120 55 L112 63 M120 85 L112 93 M120 115 L112 123 M120 145 L112 153 M120 175 L112 183 M120 205 L112 213 M120 235 L112 243 M120 265 L112 273" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <circle cx="160" cy="191" r="40" fill="var(--faint)" fill-opacity="0.12" stroke="var(--ink)" stroke-width="1.3"/>
        <circle cx="160" cy="191" r="2.6" fill="var(--ink)"/>
        <line x1="120" y1="260" x2="224" y2="200" stroke="var(--ink)" stroke-width="3"/>
        <circle cx="120" cy="260" r="4" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
        <line x1="224" y1="200" x2="120" y2="20" stroke="var(--faint)" stroke-width="1"/>
        <circle cx="120" cy="20" r="5" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/>
        <line x1="118" y1="20" x2="62" y2="20" stroke="var(--d1)" stroke-width="2" marker-end="url(#ma4c413-f)"/>
        <text x="58" y="16" font-size="10" text-anchor="end" fill="var(--d1)">P</text>
        <line x1="160" y1="191" x2="200" y2="191" stroke="var(--faint)" stroke-width="0.9"/>
        <text x="180" y="186" font-size="9" text-anchor="middle" fill="var(--faint)">R</text>
        <path d="M148 260 A 28 28 0 0 0 145 246" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <text x="152" y="256" font-size="9" fill="var(--faint)">30°</text>
        <line x1="127" y1="272" x2="231" y2="212" stroke="var(--faint)" stroke-width="0.7"/>
        <text x="196" y="252" font-size="9.5" fill="var(--faint)">3R</text>
        <circle cx="180" cy="225" r="2.6" fill="var(--flag)"/>
        <text x="186" y="238" font-size="9.5" fill="var(--flag)">D</text>
        <circle cx="120" cy="191" r="2.6" fill="var(--flag)"/>
        <text x="126" y="152" font-size="8.5" fill="var(--flag)">no desliza</text>
        <text x="152" y="184" font-size="10" text-anchor="end" fill="var(--ink)">G</text>
        <text x="128" y="274" font-size="10" fill="var(--ink)">O</text>
        <text x="230" y="196" font-size="10" fill="var(--ink)">A</text>
        <text x="128" y="34" font-size="10" fill="var(--ink)">B</text>
        <text x="230" y="272" font-size="9.5" text-anchor="middle" fill="var(--faint)">f = 0,5 en D</text>
      </svg>
      <figcaption>

      El disco toca la pared y la barra, y el hilo sale de **A**
      perpendicular a la barra hacia la polea **B**. En la pared no hay
      deslizamiento: su rozamiento es una incógnita más, sin techo.

      </figcaption>
      </figure>
    pide: El menor y el mayor valor de P, en unidades de Mg.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado dice que el rozamiento con la pared es muy grande. ¿Qué
          significa eso al plantear las ecuaciones?
        opciones:
          - texto: Que en la pared el rozamiento es una incógnita más, sin techo, y el equilibrio se rompe deslizando en la barra
            correcta: true
            mensaje: |
              Eso es. Un contacto sin deslizamiento no aporta la ecuación
              $F_r = \mu N$: aporta una incógnita. El límite lo pone el otro
              contacto, el de la barra, donde $\mu = 0{,}5$.
          - texto: Que en la pared el rozamiento vale mu por la normal, con un mu muy grande
            mensaje: |
              Escribir $F_r = \mu N$ con $\mu$ enorme da un rozamiento enorme,
              que no es lo que pasa. El rozamiento vale lo que pida el
              equilibrio; «muy grande» solo dice que ahí no se llega al techo.
          - texto: Que la pared no ejerce rozamiento, solo normal
            mensaje: |
              Es justo al revés. Si la pared fuera lisa, los momentos en $G$
              obligarían a que tampoco hubiera rozamiento en la barra y el
              equilibrio sería posible para un único valor de $P$.

      - tipo: calcular
        titulo: El valor mínimo del peso
        pregunta: |
          ¿Cuál es el menor valor de $P$, en unidades de $Mg$?
        respuesta:
          tipo: numero
          valor: '0.357266'
          tolerancia: 0.002
          formato: un número, el peso dividido entre Mg
        distractores:
          - valor: '0.666667'
            mensaje: |
              Con la pared lisa sale eso, y además sale un valor único, no un
              intervalo. El rozamiento de la pared es el que permite que el
              disco aguante con menos tensión en el hilo.
          - valor: '0.618802'
            mensaje: |
              Has igualado la fuerza del hilo a la normal en la barra. Los
              brazos no son iguales: el hilo tira a $3R$ de $O$ y la normal
              actúa a $\sqrt{3}R$, así que $N = \sqrt{3}\,P$.
        pista: |
          Momentos en $O$ sobre la barra dan $N = \sqrt{3}P$; momentos en $G$
          sobre el disco igualan el rozamiento de la barra con el de la pared.
        desarrollo: |
          $$
          T = \frac{2Mg - \sqrt{3}N}{3}
          \qquad
          T \le \tfrac{1}{2}N
          \;\Longrightarrow\;
          N \ge \frac{4Mg}{3 + 2\sqrt{3}}
          $$

          $$
          P_{\min} = \frac{N}{\sqrt{3}} = \frac{4Mg}{6 + 3\sqrt{3}} = 0{,}3573\,Mg
          $$

      - tipo: calcular
        titulo: El valor máximo del peso
        pregunta: |
          ¿Cuál es el mayor valor de $P$, en unidades de $Mg$?
        respuesta:
          tipo: numero
          valor: '4.976068'
          tolerancia: 0.02
          formato: un número, el peso dividido entre Mg
        distractores:
          - valor: '8.619'
            mensaje: |
              Es el valor de la normal $N$ en ese límite, no el del peso. El
              hilo tiene brazo $3R$ y la normal $\sqrt{3}R$, así que hay que
              dividir entre $\sqrt{3}$.
          - valor: '0.357266'
            mensaje: |
              Ese es el otro extremo, el que sale con el rozamiento de la barra
              hacia el otro lado. Aquí el disco tiende a subir y el rozamiento
              en $D$ cambia de sentido.
        pista: |
          Es el mismo cálculo con $T \ge -\tfrac{1}{2}N$.
        desarrollo: |
          $$
          T \ge -\tfrac{1}{2}N
          \;\Longrightarrow\;
          N \le \frac{4Mg}{2\sqrt{3}-3}
          \qquad
          P_{\max} = \frac{4Mg}{6 - 3\sqrt{3}} = 4{,}976\,Mg
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: 'Momentos en O sobre la barra, que no tiene masa: la normal del disco vale raíz de tres por P.'
          - texto: 'Momentos en G sobre el disco: el rozamiento de la barra y el de la pared son iguales, porque los dos tienen brazo R.'
          - texto: El equilibrio se rompe cuando el rozamiento en D llega a la mitad de su normal, y eso ocurre en los dos sentidos.
          - texto: Como en la pared no hay deslizamiento, ahí el rozamiento vale cero y solo queda la normal.
            trampa: true
            mensaje: |
              «No desliza» no es «no hay rozamiento»: es exactamente lo
              contrario. Ese rozamiento existe, vale lo que pida el equilibrio
              y es el que sostiene el disco; con la pared lisa el problema
              tendría una sola solución en vez de un intervalo.
    resolucion: |
      **La geometría.** El disco es tangente a la pared y a la barra, así que
      su centro está en la bisectriz, a $2R$ de $O$, y el contacto con la barra
      cae a $\sqrt{3}R$ de $O$.

      **La barra.** No tiene masa. Con el hilo perpendicular a ella en $A$,
      momentos en $O$:

      $$
      P\,3R = N\,\sqrt{3}R
      \qquad\Longrightarrow\qquad
      N = \sqrt{3}\,P
      $$

      **El disco.** Momentos en $G$: el rozamiento de la barra y el de la pared
      tienen los dos brazo $R$, luego son iguales. Proyectando en vertical,

      $$
      \frac{\sqrt{3}}{2}N + \frac{3}{2}T = Mg
      \qquad\Longrightarrow\qquad
      T = \frac{2Mg-\sqrt{3}N}{3}
      $$

      **Los dos límites.** El contacto que puede deslizar es el de la barra,
      con $|T| \le 0{,}5N$:

      $$
      \frac{4Mg}{6+3\sqrt{3}} \le P \le \frac{4Mg}{6-3\sqrt{3}}
      $$

      o sea entre $0{,}357\,Mg$ y $4{,}98\,Mg$, que es el resultado publicado.
      En los dos extremos la normal de la pared sale positiva, así que el disco
      sigue tocándola.

  - id: ejma4-col414-los-dos-discos-unidos-por-una-cuerda
    titulo: Dos discos unidos por una cuerda, uno en un plano inclinado
    fuente: >-
      Ejercicio 4.14 · Tema 4, «Rozamiento» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección lo marca como de nivel de examen. La colección
      publica el resultado, contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      El disco 1 de masa $M$ y radio $2R$ descansa sobre una superficie
      horizontal rugosa y tiene su centro unido a una cuerda, la cual está
      arrollada a la periferia del disco 2 de masa $M$ y radio $R$. Este disco
      2 se apoya sobre un plano rugoso inclinado 60° respecto a la vertical.
      Sobre el disco 1 se aplica un par $P$ a determinar en el sentido indicado
      en la figura. El sistema se encuentra a punto de perder el equilibrio,
      siendo el coeficiente de rozamiento el mismo en ambas superficies de
      contacto. Calcular el valor del coeficiente de rozamiento mínimo
      necesario y el valor del par $P$.

      <figure>
      <svg viewBox="0 0 430 300" role="img" width="430" height="300" aria-labelledby="ma4c414-t ma4c414-d">
        <title id="ma4c414-t">Disco sobre suelo horizontal unido por una cuerda a un disco sobre un plano inclinado</title>
        <desc id="ma4c414-d">A la izquierda, el disco 1 de radio dos R descansa sobre un suelo horizontal y lleva aplicado un par P en sentido antihorario. De su centro sale una cuerda horizontal que pasa por una polea y baja paralela al plano inclinado hasta enrollarse en la periferia del disco 2, de radio R, apoyado en ese plano. El plano forma 60 grados con la vertical, es decir 30 grados con la horizontal.</desc>
        <defs>
          <marker id="ma4c414-f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
        </defs>
        <line x1="20" y1="170" x2="230" y2="170" stroke="var(--ink)" stroke-width="1.2"/>
        <path d="M30 170 L22 178 M60 170 L52 178 M90 170 L82 178 M120 170 L112 178 M150 170 L142 178 M180 170 L172 178 M210 170 L202 178" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="230" y1="170" x2="403" y2="270" stroke="var(--ink)" stroke-width="1.2"/>
        <path d="M244 178 L236 186 M270 193 L262 201 M296 208 L288 216 M322 223 L314 231 M348 238 L340 246 M374 253 L366 261" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="230" y1="170" x2="230" y2="265" stroke="var(--faint)" stroke-width="0.7" stroke-dasharray="3 3"/>
        <path d="M230 240 A 70 70 0 0 0 264 227" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <text x="248" y="256" font-size="9.5" fill="var(--faint)">60°</text>
        <circle cx="110" cy="120" r="50" fill="var(--faint)" fill-opacity="0.12" stroke="var(--ink)" stroke-width="1.3"/>
        <circle cx="110" cy="120" r="2.6" fill="var(--ink)"/>
        <circle cx="337.5" cy="203.5" r="25" fill="var(--faint)" fill-opacity="0.12" stroke="var(--ink)" stroke-width="1.3"/>
        <circle cx="337.5" cy="203.5" r="2.2" fill="var(--ink)"/>
        <line x1="110" y1="120" x2="243" y2="120" stroke="var(--ink)" stroke-width="1"/>
        <line x1="243" y1="120" x2="350" y2="182" stroke="var(--ink)" stroke-width="1"/>
        <circle cx="243" cy="120" r="6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/>
        <line x1="243" y1="126" x2="243" y2="146" stroke="var(--ink)" stroke-width="1.6"/>
        <rect x="228" y="146" width="30" height="7" fill="var(--faint)" fill-opacity="0.3" stroke="var(--ink)" stroke-width="0.8"/>
        <path d="M148 103 A 45 45 0 0 0 80 108" fill="none" stroke="var(--d2)" stroke-width="2" marker-end="url(#ma4c414-f)"/>
        <text x="112" y="74" font-size="11" text-anchor="middle" fill="var(--d2-tinta)">P</text>
        <circle cx="78" cy="152" r="9" fill="var(--ink)"/>
        <text x="78" y="156" font-size="10" text-anchor="middle" fill="var(--paper)">1</text>
        <circle cx="352" cy="218" r="8" fill="var(--ink)"/>
        <text x="352" y="222" font-size="9.5" text-anchor="middle" fill="var(--paper)">2</text>
        <text x="20" y="106" font-size="9.5" fill="var(--faint)">M, 2R</text>
        <text x="368" y="248" font-size="9.5" fill="var(--faint)">M, R</text>
      </svg>
      <figcaption>

      La cuerda sale del **centro** del disco 1, horizontal, pasa por la polea
      y baja **paralela al plano** hasta enrollarse en la periferia del disco
      2. Ahí está la clave del problema, porque su brazo respecto del contacto
      del disco 2 es **2R**, no R.

      </figcaption>
      </figure>
    pide: La tensión de la cuerda, el coeficiente de rozamiento mínimo y el par P.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué brazo tiene la tensión de la cuerda respecto del punto de
          contacto del disco 2 con el plano?
        opciones:
          - texto: 2R, porque la cuerda es paralela al plano y sale por el punto del disco más alejado de él
            correcta: true
            mensaje: |
              Eso es. Tomando momentos en el contacto, la tensión tiene brazo
              $2R$ y el peso, solo su componente por el plano, brazo $R$: sale
              $T = Mg\operatorname{sen}30^\circ/2$.
          - texto: R, porque la cuerda tira del disco con el radio como brazo
            mensaje: |
              La cuerda no pasa por el centro: está arrollada a la periferia y
              sale por el lado opuesto al contacto. Del contacto al punto por
              donde sale hay un diámetro entero, $2R$.
          - texto: Ninguno, porque la tensión pasa por el centro del disco 2
            mensaje: |
              Eso sería si la cuerda estuviera atada al centro, como en el disco
              1. Aquí está **arrollada**, y por eso puede sostener el disco sin
              que haga falta más rozamiento del que hay.

      - tipo: calcular
        titulo: La tensión de la cuerda
        pregunta: |
          ¿Cuánto vale la tensión de la cuerda, en unidades de $Mg$?
        respuesta:
          tipo: numero
          valor: '0.25'
          tolerancia: 0.002
          formato: un número, la tensión dividida entre Mg
        distractores:
          - valor: '0.5'
            mensaje: |
              Has puesto la cuerda en el centro del disco 2, con brazo $R$.
              Entonces la tensión tendría que equilibrar ella sola la
              componente del peso; arrollada en la periferia le basta la mitad.
          - valor: '0.433013'
            mensaje: |
              Has usado el coseno de 30°. El plano está inclinado 30° sobre la
              horizontal, así que la componente del peso que tira por el plano
              es $Mg\operatorname{sen}30^\circ$.
        pista: |
          Momentos en el punto de contacto del disco 2:
          $T\,2R = Mg\operatorname{sen}30^\circ\,R$.
        desarrollo: |
          $$
          T\,(2R) = Mg\,\operatorname{sen}30^\circ\,R
          \qquad\Longrightarrow\qquad
          T = \frac{Mg}{4}
          $$

      - tipo: calcular
        titulo: El coeficiente de rozamiento mínimo
        pregunta: |
          ¿Qué coeficiente de rozamiento mínimo necesita el sistema?
        respuesta:
          tipo: numero
          valor: '0.288675'
          tolerancia: 0.002
          formato: un número, sin unidad
        distractores:
          - valor: '0.25'
            mensaje: |
              Ese es el que pide el contacto del disco 1, $F_1/N_1 = 0{,}25$. El
              mínimo lo manda el contacto más exigente, y ese es el del plano
              inclinado.
          - valor: '0.57735'
            mensaje: |
              Eso es $\tan 30^\circ$, el coeficiente que haría falta si el disco
              bajara solo, sin cuerda. La cuerda se lleva la mitad de la
              componente del peso y deja al rozamiento con la otra mitad.
        pista: |
          En el plano, $F_2 = Mg\operatorname{sen}30^\circ - T$ y $N_2 = Mg\cos 30^\circ$.
        desarrollo: |
          $$
          F_2 = \frac{Mg}{2} - \frac{Mg}{4} = \frac{Mg}{4}
          \qquad
          N_2 = \frac{\sqrt{3}}{2}Mg
          $$

          $$
          f \ge \frac{F_2}{N_2} = \frac{1/4}{\sqrt{3}/2} = \frac{\sqrt{3}}{6} = 0{,}2887
          $$

      - tipo: calcular
        titulo: El par sobre el disco 1
        pregunta: |
          ¿Cuánto vale el par $P$, en unidades de $MgR$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.004
          formato: un número, el par dividido entre M g R
        distractores:
          - valor: '0.25'
            mensaje: |
              Has usado $R$ como brazo del rozamiento del disco 1. Su radio es
              $2R$, así que el par vale $T\cdot 2R$.
          - valor: '1'
            mensaje: |
              Arrastras una tensión de $Mg/2$, la que sale de poner la cuerda en
              el centro del disco 2. Con la cuerda arrollada, $T = Mg/4$.
        pista: |
          En el disco 1 el rozamiento equilibra a la tensión, y su brazo
          respecto del centro es $2R$.
        desarrollo: |
          $$
          F_1 = T = \frac{Mg}{4}
          \qquad
          P = F_1\,(2R) = \frac{MgR}{2}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Momentos en el contacto del disco 2: la tensión tiene brazo 2R y sale Mg partido por cuatro.'
          - texto: En el plano el rozamiento vale la componente del peso menos la tensión, y comparado con la normal pide raíz de tres partido por seis.
          - texto: En el disco 1 el rozamiento iguala a la tensión, y el par es esa fuerza por el radio 2R.
          - texto: El coeficiente mínimo lo fija el disco 1, porque es el que soporta el par.
            trampa: true
            mensaje: |
              El disco 1 solo pide $0{,}25$ y el del plano pide $0{,}2887$. El
              mínimo que sirve para todo el sistema es el mayor de los dos, y
              soportar el par no tiene nada que ver: lo que exige rozamiento es
              la componente del peso que la cuerda no sujeta.
    resolucion: |
      **El disco 2.** Tomando momentos en su punto de contacto con el plano, la
      cuerda —paralela al plano y arrollada en la periferia— tiene brazo $2R$ y
      el peso, brazo $R$ con su componente por el plano:

      $$
      T\,(2R) = Mg\,\operatorname{sen}30^\circ\,R
      \qquad\Longrightarrow\qquad
      T = \frac{Mg}{4}
      $$

      **El rozamiento que hace falta ahí.** Proyectando sobre el plano y sobre
      su normal,

      $$
      F_2 = Mg\,\operatorname{sen}30^\circ - T = \frac{Mg}{4}
      \qquad
      N_2 = Mg\cos 30^\circ = \frac{\sqrt{3}}{2}Mg
      \qquad
      f \ge \frac{\sqrt{3}}{6}
      $$

      **El disco 1.** La cuerda tira de su centro en horizontal, así que el
      rozamiento del suelo la equilibra, $F_1 = Mg/4$, con $N_1 = Mg$: ese
      contacto solo pide $0{,}25$. Momentos en el centro:

      $$
      P = F_1\,(2R) = \frac{MgR}{2}
      $$

      **El resultado.** El coeficiente mínimo es el mayor de los dos,
      $f = \sqrt{3}/6 = 0{,}2887$, y el par vale $MgR/2$, que es lo publicado.

  - id: ejma4-col415-el-par-que-hace-rodar-el-disco
    titulo: El par que hace rodar un disco con resistencia a la rodadura
    fuente: >-
      Ejercicio 4.15 · Tema 4, «Rozamiento» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección lo marca como de nivel de examen y anota que es
      uno de sus dos problemas de resistencia a la rodadura. La colección
      publica el resultado, contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      En el sistema de la figura, la barra $BC$ está sometida al par
      desconocido $M$ y la fuerza conocida $P$ actúa sobre la barra $AC$. Los
      pesos del disco y de las barras son despreciables. Determinar:

      a. Valor del momento $M$ para que el disco comience a rodar, en función
      de $P$ y $R$.

      b. Coeficiente de rozamiento mínimo entre suelo y disco para la rodadura.

      Dato: $\dfrac{\mu_r}{R} = 0{,}04$.

      <figure>
