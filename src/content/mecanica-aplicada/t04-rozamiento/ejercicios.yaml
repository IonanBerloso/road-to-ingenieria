ejercicios:
  - id: ejma4-desliza-o-vuelca
    titulo: Un bloque alto, ¿desliza o vuelca?
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Un bloque de 500 N de peso, con una base de 0,4 m y 1 m de altura,
      descansa sobre un suelo horizontal con coeficiente de rozamiento
      $\mu_s = 0{,}3$. Se le empuja con una fuerza horizontal $Q$ aplicada a
      0,8 m del suelo, en el plano que pasa por su centro de gravedad.
      Determinar el menor valor de $Q$ que rompe el equilibrio, y si el bloque
      desliza o vuelca.
    pide: La fuerza que lo hace deslizar, la que lo hace volcar y cuál es menor.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿De qué maneras puede perder el equilibrio el bloque?
        opciones:
          - texto: Deslizando o volcando sobre la arista delantera, y hay que calcular las dos
            correcta: true
            mensaje: |
              Eso es. Son dos equilibrios límite distintos, cada uno con su
              fuerza, y el que ocurre es el que pide menos fuerza.
          - texto: Solo deslizando, porque la fuerza es horizontal
            mensaje: |
              La fuerza horizontal aplicada en alto también da momento respecto
              de la arista delantera. Si ese momento supera al del peso, el
              bloque vuelca aunque el rozamiento aguante.
          - texto: Solo volcando, porque el rozamiento impide deslizar
            mensaje: |
              El rozamiento tiene un techo, $\mu_s N$. Si la fuerza lo supera
              antes de que el momento tumbe el bloque, desliza.

      - tipo: calcular
        titulo: La fuerza que lo hace deslizar
        pregunta: |
          ¿Qué fuerza $Q$ hace deslizar el bloque?
        respuesta:
          tipo: magnitud
          valor: '150 N'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '1667 N'
            mensaje: |
              Has dividido el peso entre el coeficiente en lugar de
              multiplicarlo. El rozamiento máximo es $\mu_s N = 0{,}3 \cdot 500$.
        pista: |
          Con la fuerza horizontal, $N = P$. Desliza cuando $Q = \mu_s N$.
        desarrollo: |
          $$
          Q_{\text{desliza}} = \mu_s\,P = 0{,}3 \cdot 500 = 150\ \text{N}
          $$

      - tipo: calcular
        titulo: La fuerza que lo hace volcar
        pregunta: |
          Tomando momentos en la arista delantera, ¿qué fuerza $Q$ lo hace
          volcar?
        respuesta:
          tipo: magnitud
          valor: '125 N'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '250 N'
            mensaje: |
              Has usado la base entera, 0,4 m, como brazo del peso. El peso
              está aplicado en el centro de gravedad, a media base de la
              arista: 0,2 m.
          - valor: '100 N'
            mensaje: |
              Has usado la altura del bloque, 1 m, como brazo de $Q$. La fuerza
              está aplicada a 0,8 m del suelo, y ese es su brazo respecto de la
              arista.
        pista: |
          En el vuelco, la normal y el rozamiento se van a la arista y no dan
          momento en ella: $Q \cdot 0{,}8 = P \cdot 0{,}2$.
        desarrollo: |
          $$
          Q_{\text{vuelca}} \cdot 0{,}8 = 500 \cdot 0{,}2
          \;\Longrightarrow\;
          Q_{\text{vuelca}} = 125\ \text{N}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: Para deslizar hace falta vencer el rozamiento máximo, $Q = 0{,}3 \cdot 500 = 150$ N.
          - texto: Para volcar, con la normal y el rozamiento en la arista, $0{,}8Q = 500 \cdot 0{,}2$ y $Q = 125$ N.
          - texto: 'La menor de las dos es 125 N: el bloque vuelca antes de deslizar.'
          - texto: El bloque desliza primero, porque el rozamiento siempre se vence antes que el peso.
            trampa: true
            mensaje: |
              Depende de la geometría. Aquí el bloque es alto y estrecho y se
              empuja arriba: el momento tumba antes de que el rozamiento llegue
              a su techo.
    resolucion: |
      **Deslizar.** Con la fuerza horizontal la normal es el peso, y el
      rozamiento llega a su techo cuando

      $$
      Q = \mu_s P = 0{,}3 \cdot 500 = 150\ \text{N}
      $$

      **Volcar.** A punto de volcar, todo el contacto está en la arista
      delantera, y la normal y el rozamiento no dan momento en ella:

      $$
      Q \cdot 0{,}8 = 500 \cdot 0{,}2 \;\Longrightarrow\; Q = 125\ \text{N}
      $$

      **Cuál gana.** La menor: con 125 N el bloque vuelca, y el rozamiento
      todavía está en $125 < 150$ N, por debajo de su techo. Si se empujara más
      abajo, por debajo de $0{,}2 \cdot 500 / 150 = 0{,}67$ m, desliza antes.

  - id: ejma4-la-resistencia-a-la-rodadura
    titulo: La fuerza que arranca a rodar una rueda
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Una rueda de radio $R = 0{,}25\ \text{m}$ soporta una carga vertical
      total de 200 N sobre un suelo con coeficiente de resistencia a la
      rodadura $\mu_r = 5\ \text{mm}$. Se le aplica en el eje una fuerza
      horizontal $F_t$. Calcular la fuerza que la hace empezar a rodar y el
      coeficiente de rozamiento mínimo para que ruede sin deslizar.
    pide: La fuerza que arranca la rodadura y el rozamiento mínimo.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué hace falta una fuerza finita para que la rueda empiece a
          rodar?
        opciones:
          - texto: Porque la normal se adelanta una distancia μr y su momento se opone al de la fuerza
            correcta: true
            mensaje: |
              Eso es. El contacto es una pequeña superficie, y la resultante
              de la reacción se adelanta hasta $\mu_r$. Tomando momentos en ese
              punto, la carga vertical tiene brazo $\mu_r$ y frena el giro.
          - texto: Porque el rozamiento se opone al giro de la rueda
            mensaje: |
              El rozamiento está aplicado en el contacto, así que respecto de
              ese punto no da momento. Lo que frena la rodadura es que la
              normal no pasa bajo el centro.
          - texto: No hace falta, cualquier fuerza horizontal la hace rodar
            mensaje: |
              Eso pasaría con una rueda y un suelo perfectamente rígidos, que
              tocaran en un solo punto. En la realidad se deforman un poco, y
              la experiencia dice que hace falta una fuerza finita.

      - tipo: calcular
        titulo: La fuerza que arranca la rodadura
        pregunta: |
          ¿Cuánto vale $F_t$ cuando la rueda empieza a rodar?
        respuesta:
          tipo: magnitud
          valor: '4 N'
          formato: una fuerza, con su unidad
        distractores:
          - valor: '4000 N'
            mensaje: |
              Has puesto $\mu_r$ en milímetros y el radio en metros. Las dos
              longitudes tienen que ir en la misma unidad: $\mu_r = 0{,}005\ \text{m}$.
          - valor: '10000 N'
            mensaje: |
              Has invertido el cociente, $F_n R / \mu_r$. La fuerza que arranca
              es pequeña: el brazo de la carga, $\mu_r$, es mucho menor que el
              de la fuerza, $R$.
        pista: |
          Momentos en el punto adelantado: $F_t R = F_n \mu_r$.
        desarrollo: |
          $$
          F_t = F_n\,\frac{\mu_r}{R} = 200 \cdot \frac{0{,}005}{0{,}25} = 4\ \text{N}
          $$

      - tipo: calcular
        titulo: El rozamiento mínimo
        pregunta: |
          Para que ruede sin deslizar, ¿qué coeficiente de rozamiento estático
          mínimo hace falta?
        respuesta:
          tipo: numero
          valor: '0.02'
          tolerancia: 0.0005
          formato: un número, sin unidad
        distractores:
          - valor: '0.005'
            mensaje: |
              Has tomado $\mu_r$ en metros como si fuera el coeficiente de
              rozamiento. Son cosas distintas: $\mu_r$ es una longitud, y el
              rozamiento mínimo sale del equilibrio horizontal.
        pista: |
          En horizontal, el rozamiento equilibra a $F_t$: $F_r = 4\ \text{N}$.
          Tiene que ser $F_r \le \mu_s N$.
        desarrollo: |
          $$
          \mu_s \ge \frac{F_r}{N} = \frac{4}{200} = 0{,}02
          $$

          Que coincide con $\mu_r / R$: el coeficiente equivalente del que
          habla la teoría.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: La reacción del suelo se adelanta $\mu_r = 0{,}005$ m respecto de la vertical del eje.
          - texto: 'Momentos en ese punto: $F_t \cdot 0{,}25 = 200 \cdot 0{,}005$, así que $F_t = 4$ N.'
          - texto: En horizontal, $F_r = F_t = 4$ N, y rodar sin deslizar exige $\mu_s \ge 4/200 = 0{,}02$.
          - texto: El rozamiento mínimo es el propio $\mu_r$, 0,005.
            trampa: true
            mensaje: |
              $\mu_r$ es una longitud, el brazo de la normal, y no un
              coeficiente de rozamiento. El rozamiento mínimo sale de
              comparar $F_r$ con $N$, y aquí coincide con $\mu_r / R$.
    resolucion: |
      **Por qué hace falta fuerza.** La reacción del suelo se adelanta una
      distancia $\mu_r = 0{,}005\ \text{m}$. Tomando momentos en ese punto, la
      normal y el rozamiento no dan momento, y queda

      $$
      F_t\,R = F_n\,\mu_r
      \;\Longrightarrow\;
      F_t = 200 \cdot \frac{0{,}005}{0{,}25} = 4\ \text{N}
      $$

      **Rodar sin deslizar.** En horizontal, el rozamiento equilibra a la
      fuerza, $F_r = 4\ \text{N}$, y tiene que estar por debajo de su techo:

      $$
      \mu_s \ge \frac{4}{200} = 0{,}02
      $$

      Coincide con $\mu_r / R$, que es justo el coeficiente de rozamiento
      equivalente de la teoría.
