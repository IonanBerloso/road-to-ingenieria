      - tipo: calcular
        titulo: La fuerza contra la pared
        pregunta: |
          Del equilibrio de $B$, ¿cuánto vale la normal $N_3$ contra la pared,
          en kg*?
        respuesta:
          tipo: numero
          valor: '5388'
          tolerancia: 10
          formato: un número, en kg*
        distractores:
          - valor: '4245'
            mensaje: |
              Has olvidado el rozamiento de la pared en la ecuación vertical de
              $B$. Al frenar la subida, ese rozamiento obliga a la cuña a
              apretar más, y todas las fuerzas suben.
          - valor: '2611'
            mensaje: |
              Has quitado el rozamiento de la cara inclinada. Con $\mu_2 = 0{,}3$
              la normal $N_2$ tiene que ser bastante mayor, y con ella $N_3$.
        pista: |
          En $B$: horizontal $N_2(\sin\alpha + \mu_2\cos\alpha) = N_3$; vertical
          $N_2(\cos\alpha - \mu_2\sin\alpha) - \mu_3 N_3 = P$.
        desarrollo: |
          $$
          N_2\bigl[\cos\alpha - \mu_2\sin\alpha
          - \mu_3(\sin\alpha + \mu_2\cos\alpha)\bigr] = P
          $$

          $$
          N_2 = \frac{4000}{0{,}5641} = 7091\ \text{kg}*
          \qquad
          N_3 = 7091 \cdot 0{,}7598 = 5388\ \text{kg}*
          $$

      - tipo: calcular
        titulo: La fuerza Q
        pregunta: |
          Con el equilibrio de la cuña $A$, ¿cuánto vale $Q$?
        respuesta:
          tipo: numero
          valor: '7419'
          tolerancia: 10
          formato: un número, en kg*
        distractores:
          - valor: '7622'
            mensaje: |
              Es lo que sale leyendo el dato impreso «0,4,4» como 0,44. Con
              $\mu_1 = 0{,}4$ sale exactamente el resultado publicado, 7419, así
              que la coma de más es una errata.
          - valor: '6988'
            mensaje: |
              Has puesto en la normal del suelo solo el peso $P$. El suelo
              soporta además lo que el rozamiento de la pared empuja hacia
              abajo, así que $N_1 = 5078$ y no 4000.
          - valor: '5844.6'
            mensaje: |
              Has ignorado el rozamiento de la pared. Es el que más encarece la
              maniobra, porque frena la subida de $B$ y obliga a apretar más.
          - valor: '2671.9'
            mensaje: |
              Has dibujado el rozamiento de la cara inclinada al revés, como si
              $B$ bajara. Con $B$ subiendo, ese rozamiento se opone y hay que
              vencerlo.
        pista: |
          $A$ no pesa. En horizontal, $Q = N_3 + \mu_1 N_1$, y la normal del
          suelo es lo que $B$ carga sobre la cuña.
        desarrollo: |
          $$
          N_1 = N_2(\cos\alpha - \mu_2\sin\alpha) = 5078\ \text{kg}*
          $$

          $$
          Q = N_2(\sin\alpha + \mu_2\cos\alpha) + \mu_1 N_1
          = 5388 + 0{,}4 \cdot 5078 = 7419\ \text{kg}*
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'B sube, así que los dos rozamientos que actúan sobre él lo frenan: el de la pared hacia abajo y el de la cara inclinada hacia abajo a lo largo de ella.'
          - texto: Del equilibrio de B salen $N_2 = 7091$ kg* y $N_3 = 5388$ kg*.
          - texto: La cuña A no pesa, y recibe de B una carga vertical de 5078 kg*, que es la normal del suelo.
          - texto: 'En horizontal sobre A: $Q = 5388 + 0{,}4 \cdot 5078 = 7419$ kg*.'
          - texto: Como se desprecia el peso de A, la normal del suelo bajo la cuña es nula y el contacto 1 no aporta rozamiento.
            trampa: true
            mensaje: |
              Que $A$ no pese no quiere decir que no apriete el suelo: le está
              cayendo encima toda la carga vertical que le pasa $B$, 5078 kg*.
              Ese contacto aporta $0{,}4 \cdot 5078 = 2031$ kg*, más de una
              cuarta parte de $Q$.
    resolucion: |
      **1. Sólidos libres.** El bloque $B$ y la cuña $A$, que no pesa.

