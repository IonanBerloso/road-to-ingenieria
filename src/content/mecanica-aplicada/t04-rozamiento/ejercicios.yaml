        <line x1="32" y1="200" x2="70" y2="200" stroke="var(--faint)" stroke-width="0.7"/>
        <path d="M58 200 A28 28 0 0 0 49.8 180.2" fill="none" stroke="var(--ink)" stroke-width="0.9"/>
        <text x="62" y="194" font-size="10" fill="var(--ink)">45°</text>
