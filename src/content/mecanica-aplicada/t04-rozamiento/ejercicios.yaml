      <figcaption>

      La carga repartida ocupa solo el tramo central, de **R** a **2R**: su
      resultante son **3Mg** aplicadas a **1,5R** de **A**. El par sobre el
      disco es **horario** y **B** está en su borde, a la altura del centro.

      </figcaption>
      </figure>
    pide: La tensión del cable, las dos reacciones en C y el coeficiente que haría falta allí.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál es la resultante de la carga repartida y dónde se aplica?
        opciones:
          - texto: 3Mg, aplicadas en el centro del tramo cargado, a 1,5R de A
            correcta: true
            mensaje: |
              Eso es. La carga es uniforme y ocupa un tramo de longitud $R$:
              $q\,R = 3Mg$, con la resultante en el centro de ese tramo.
          - texto: 9Mg, la carga por la longitud entera de la viga
            mensaje: |
              La carga no ocupa los $3R$: la figura la dibuja solo sobre el
              tramo central, de $R$ a $2R$. Multiplicar por la longitud entera
              triplica la resultante.
          - texto: 1,5Mg, la mitad, como en una carga triangular
            mensaje: |
              El enunciado dice carga **rectangular**: es uniforme y su
              resultante es el área del rectángulo, $q\,R$. La mitad sería el
              área de un triángulo.

      - tipo: calcular
        titulo: La tensión del cable
        pregunta: |
          ¿Cuánto vale la tensión $T_O$, en unidades de $Mg$?
        respuesta:
          tipo: numero
          valor: '1.5'
          tolerancia: 0.005
          formato: un número, la tensión dividida entre Mg
        distractores:
          - valor: '4.5'
            mensaje: |
              Has repartido la carga por toda la viga, $9Mg$. Solo ocupa el
              tramo central de longitud $R$, así que su resultante es $3Mg$.
          - valor: '0.75'
            mensaje: |
              Has tratado la carga como triangular. Es rectangular: uniforme, de
              valor $3Mg/R$ en todo el tramo.
        pista: |
          Momentos en $B$ sobre la viga: la resultante está a $1{,}5R$ de $B$
          y el cable a $3R$.
        desarrollo: |
          $$
          T_O\,(3R) = 3Mg\,(1{,}5R)
          \qquad\Longrightarrow\qquad
          T_O = \frac{3Mg}{2}
          $$

      - tipo: calcular
        titulo: La reacción vertical en C
        pregunta: |
          ¿Cuánto vale $C_y$, en unidades de $Mg$?
        respuesta:
          tipo: numero
          valor: '2.5'
          tolerancia: 0.006
          formato: un número, la reacción dividida entre Mg
        distractores:
          - valor: '1.5'
            mensaje: |
              Te has dejado el peso del disco. La viga le pasa $1{,}5Mg$ por la
              articulación $B$, y el disco además pesa $Mg$.
          - valor: '3.5'
            mensaje: |
              Has sumado el peso del disco a la carga entera de la viga en vez
              de a la parte que llega por $B$. Por $B$ pasa $3Mg - T_O$, o sea
              $1{,}5Mg$.
        pista: |
          Vertical de la viga: $T_O + B_y = 3Mg$. Después, vertical del disco.
        desarrollo: |
          $$
          B_y = 3Mg - T_O = \frac{3Mg}{2}
          \qquad
          C_y = B_y + Mg = \frac{5Mg}{2}
          $$

      - tipo: calcular
        titulo: La reacción horizontal en C
        pregunta: |
          ¿Cuánto vale $C_x$, en unidades de $Mg$? Tómala positiva hacia la
          derecha, en el sentido en el que $F$ empuja el sistema.
        respuesta:
          tipo: numero
          valor: '1.5'
          tolerancia: 0.005
          formato: un número con su signo, la reacción dividida entre Mg
        distractores:
          - valor: '-1.5'
            mensaje: |
              Te has dejado el par. Sin él, la fuerza que la viga hace en $B$
              pediría un rozamiento del otro lado; el par de $3MgR$ le da la
              vuelta al signo y además duplica el valor.
          - valor: '3'
            mensaje: |
              Has olvidado el momento de la fuerza que la viga transmite en $B$.
              Esa fuerza vertical, $1{,}5Mg$, tiene brazo $R$ respecto del
              centro del disco y descuenta la mitad del par.
        pista: |
          Momentos en el centro del disco: el par, la fuerza de $B$ —que está
          a $R$ del centro— y el rozamiento de $C$, también a $R$.
        desarrollo: |
          $$
          C_x\,R + 1{,}5Mg\,R = 3MgR
          \qquad\Longrightarrow\qquad
          C_x = \frac{3Mg}{2}
          $$

      - tipo: calcular
        titulo: El coeficiente que haría falta
        pregunta: |
          ¿Qué coeficiente de rozamiento necesita el contacto $C$ para que el
          disco ruede en vez de deslizar?
        respuesta:
          tipo: numero
          valor: '0.6'
          tolerancia: 0.004
          formato: un número, sin unidad
        distractores:
          - valor: '0.5'
            mensaje: |
              Ese es el dato del apartado c, el coeficiente que **tendría** el
              contacto. Lo que se pide es el que **haría falta**, para poder
              compararlos.
          - valor: '1'
            mensaje: |
              Has dividido entre $1{,}5Mg$, la parte que llega por $B$. La
              normal en $C$ es toda la carga vertical que baja al suelo,
              $2{,}5Mg$, con el peso del disco incluido.
        pista: |
          Es el cociente entre las dos reacciones que acabas de calcular.
        desarrollo: |
          $$
          \mu_{\text{nec}} = \frac{C_x}{C_y} = \frac{3/2}{5/2} = \frac{3}{5} = 0{,}6
          $$

          Con $f = 1/2$ el contacto no puede dar $1{,}5Mg$ de rozamiento —su
          techo son $1{,}25Mg$—, así que **deslizaría antes de rodar**.

      - tipo: justificar
        pregunta: Ordena la respuesta del apartado c. Una pieza es falsa.
        piezas:
          - texto: El equilibrio pide en C un rozamiento de 1,5 Mg con una normal de 2,5 Mg, o sea un coeficiente de 0,6.
          - texto: 'Con f = 1/2 el techo del rozamiento es 1,25 Mg, menos de lo que hace falta: el contacto no puede dar esa fuerza.'
          - texto: Por tanto, con ese coeficiente el movimiento se iniciaría deslizando, no rodando.
          - texto: 'Como 1/2 es menor que 0,6, el disco rueda antes: cuanto menor es el coeficiente, más fácil es la rodadura.'
            trampa: true
            mensaje: |
              Es justo al revés. La rodadura necesita que el rozamiento
              **llegue** al valor que pide el equilibrio, y un coeficiente
              pequeño rebaja el techo. Con poco rozamiento el contacto patina;
              con mucho, rueda.
    resolucion: |
      **La carga.** Es uniforme y ocupa el tramo central, de longitud $R$:
      resultante $3Mg$ a $1{,}5R$ de $A$.

      **La viga.** Momentos en $B$ y equilibrio vertical:

      $$
      T_O\,(3R) = 3Mg\,(1{,}5R)
      \qquad\Longrightarrow\qquad
      T_O = \frac{3Mg}{2}
      \qquad
      B_y = \frac{3Mg}{2}
      $$

      **El disco.** En vertical, $C_y = B_y + Mg = \frac{5Mg}{2}$. Momentos en
      su centro, con $B$ en el borde —a $R$— y el par horario de $3MgR$:

      $$
      C_x\,R + \frac{3Mg}{2}R = 3MgR
      \qquad\Longrightarrow\qquad
      C_x = \frac{3Mg}{2}
      $$

      y el equilibrio horizontal da además $F = C_x = \frac{3Mg}{2}$.

      **El apartado c.** El contacto necesita

      $$
      \mu_{\text{nec}} = \frac{C_x}{C_y} = \frac{3}{5}
      $$

      Con $f = 1/2 < 3/5$ el rozamiento disponible se queda corto: el disco
      **deslizaría primero**. Los tres resultados publicados —$3Mg/2$, $3Mg/2$
      y $5Mg/2$, con $\mu = 3/5$— coinciden.
