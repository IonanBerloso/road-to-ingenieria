      </figcaption>
      </figure>
    pide: El coeficiente de rozamiento mínimo y el momento M en función de P y R.
    pasos:
      - tipo: reconocer
        pregunta: |
          El dato es $\mu_r/R = 0{,}04$. ¿Cómo entra en el equilibrio del disco?
        opciones:
          - texto: Como una longitud que adelanta la normal, y la condición es la fuerza horizontal por 2R igual a la vertical por mu erre
            correcta: true
            mensaje: |
              Eso es. $\mu_r$ es el brazo con el que se adelanta la normal, y
              aquí la fuerza horizontal entra por $A$, a $2R$ del suelo:
              $F_t\,2R = F_n\,\mu_r$, o sea $F_t/F_n = 0{,}02$.
          - texto: Como un coeficiente de rozamiento sin dimensiones, o sea la fuerza de rozamiento vale 0,04 por la normal
            mensaje: |
              $\mu_r$ es una **longitud**, no un número. Por eso el dato viene
              dividido por $R$: lo que hace de coeficiente equivalente es el
              cociente $\mu_r/(2R)$ con esta geometría, no $\mu_r/R$ a secas.
          - texto: Con la fuerza aplicada en el centro del disco, a R del suelo
            mensaje: |
              El disco no recibe nada en su centro: está articulado a la barra
              por su punto más alto, a $2R$ del suelo. El brazo de la fuerza que
              lo hace rodar es esa altura.

      - tipo: calcular
        titulo: El coeficiente de rozamiento mínimo
        pregunta: |
          ¿Qué coeficiente de rozamiento mínimo hace falta entre suelo y disco
          para que ruede en vez de deslizar?
        respuesta:
          tipo: numero
          valor: '0.02'
          tolerancia: 0.0008
          formato: un número, sin unidad
        distractores:
          - valor: '0.04'
            mensaje: |
              Has usado $R$ como brazo de la fuerza horizontal. Entra por $A$, a
              $2R$ del suelo, así que la relación es $F_t/F_n = \mu_r/(2R)$, la
              mitad del dato.
        pista: |
          Momentos en el punto adelantado: $F_t\,(2R) = F_n\,\mu_r$. El
          rozamiento equilibra a $F_t$ y la normal a $F_n$.
        desarrollo: |
          $$
          \frac{F_r}{N} = \frac{F_t}{F_n} = \frac{\mu_r}{2R}
          = \frac{0{,}04}{2} = 0{,}02
          $$

      - tipo: calcular
        titulo: El momento que hace rodar el disco
        pregunta: |
          ¿Cuánto vale $M$, en unidades de $PR$, con el par en el sentido
          dibujado?
        respuesta:
          tipo: numero
          valor: '1.51'
          tolerancia: 0.004
          formato: un número, el momento dividido entre P por R
        distractores:
          - valor: '1.49'
            mensaje: |
              Has adelantado la normal hacia el otro lado. Con el par
              antihorario el extremo $C$ sube y se va a la izquierda, la barra
              tira del disco hacia la izquierda y el disco rueda **hacia la
              izquierda**: la normal se adelanta en ese sentido y la resistencia
              se suma al momento, no se resta.
        pista: |
          Momentos en $C$ sobre la barra $AC$ dan la fuerza vertical en $A$; la
          horizontal es esa por $0{,}02$. Después, momentos en $B$.
        desarrollo: |
          En la barra $AC$, momentos en $C$:

          $$
          N\,(4R) = P\,R
          \qquad\Longrightarrow\qquad
          N = \frac{P}{4}
          \qquad
          C_y = \frac{3P}{4}
          \qquad
          C_x = 0{,}02\,N = \frac{P}{200}
          $$

          En la barra $BC$, momentos en $B$, con $C$ a $(2R, 2R)$ de $B$:

          $$
          M = 2R\cdot\frac{3P}{4} + 2R\cdot\frac{P}{200} = 1{,}5PR + 0{,}01PR
          = 1{,}51\,PR
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Momentos en C sobre la barra AC: la fuerza vertical en A vale P partido por cuatro.'
          - texto: La resistencia a la rodadura obliga a que la fuerza horizontal en A sea el 2 por ciento de la vertical, porque A está a 2R del suelo.
          - texto: 'Momentos en B sobre la barra BC: el par vale 1,5 PR más el 1 por ciento que aporta la resistencia a la rodadura.'
          - texto: Sin resistencia a la rodadura el par tendría que ser mayor, porque habría que vencer también el rozamiento del suelo.
            trampa: true
            mensaje: |
              Sin resistencia a la rodadura el par sería exactamente $1{,}5PR$,
              menor. El rozamiento del suelo no consume par: está aplicado en el
              punto sobre el que el disco gira, y lo único que frena la rodadura
              es que la normal se adelanta $\mu_r$.
    resolucion: |
      **Qué es el dato.** $\mu_r$ es una longitud: lo que se adelanta la normal
      en el sentido en que el disco va a rodar. Como el disco recibe la fuerza
      horizontal por $A$, a $2R$ del suelo, tomando momentos en el punto
      adelantado

      $$
      F_t\,(2R) = F_n\,\mu_r
      \qquad\Longrightarrow\qquad
      \frac{F_t}{F_n} = \frac{\mu_r}{2R} = 0{,}02
      $$

      y ese cociente es también $F_r/N$, o sea el coeficiente de rozamiento
      mínimo para que ruede en vez de deslizar: $\mu_{s,\min} = 0{,}02$.

      **La barra AC.** Momentos en $C$: $N\,4R = P\,R$, luego $N = P/4$ y la
      componente horizontal en $A$ vale $0{,}02\,N = P/200$.

      **La barra BC.** Con el par antihorario el disco rueda hacia la
      izquierda, así que la normal se adelanta hacia la izquierda y la
      componente horizontal se suma. Momentos en $B$, con $C$ a $2R$ en
      horizontal y $2R$ en vertical:

      $$
      M = 2R\left(\frac{3P}{4}\right) + 2R\left(\frac{P}{200}\right) = 1{,}51\,PR
      $$

      que es el resultado publicado. Si el disco rodara hacia el otro lado
      saldría $1{,}49PR$: el intervalo de pares que **no** mueven nada es
      justo ese, de $1{,}49PR$ a $1{,}51PR$.

  - id: ejma4-col416-la-barra-sostenida-por-un-bloque
    titulo: El bloque que sostiene una barra, entre deslizar y volcar
    fuente: >-
      Ejercicio 4.16 · Tema 4, «Rozamiento» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección lo marca como de nivel de examen y como resuelto
      en el libro. La colección publica el resultado, contra el que está
      contrastado el desarrollo.
    nivel: practica
    enunciado: |
      El peso de la barra $ABC$ es $P$ y su longitud $15a$. Determinar el peso
      mínimo necesario que debe tener el bloque para sostener la barra en
      función de $P$, analizando el deslizamiento y el vuelco del bloque. El
      coeficiente de rozamiento entre el bloque y el suelo y entre el bloque y
      la barra es $0{,}2$.

      <figure>
      <svg viewBox="0 0 340 300" role="img" width="340" height="300" aria-labelledby="ma4c416-t ma4c416-d">
        <title id="ma4c416-t">Barra apoyada en la arista superior de un bloque prismático</title>
        <desc id="ma4c416-d">Una barra recta ABC de longitud quince a arranca del suelo en A, encajada contra el escalón que hay a su izquierda, y sube hacia la derecha. A seis a de A hay un bloque de dos a de ancho y ocho a de alto, y la barra se apoya justo en su arista superior izquierda, el punto B. El extremo C queda en voladizo por encima del bloque. El peso P de la barra actúa en su punto medio.</desc>
        <defs>
          <marker id="ma4c416-f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d1)"/>
          </marker>
        </defs>
        <path d="M15 200 L70 200 L70 230 L320 230" fill="none" stroke="var(--ink)" stroke-width="1.3"/>
        <path d="M22 200 L14 208 M46 200 L38 208 M70 208 L62 216 M80 230 L72 238 M110 230 L102 238 M140 230 L132 238 M170 230 L162 238 M200 230 L192 238 M230 230 L222 238 M260 230 L252 238 M290 230 L282 238 M316 230 L308 238" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <rect x="166" y="102" width="32" height="128" fill="var(--faint)" fill-opacity="0.22" stroke="var(--ink)" stroke-width="1.3"/>
        <line x1="70" y1="230" x2="214" y2="38" stroke="var(--ink)" stroke-width="3.4"/>
        <circle cx="166" cy="102" r="3" fill="var(--flag)"/>
        <line x1="142" y1="134" x2="142" y2="176" stroke="var(--d1)" stroke-width="2" marker-end="url(#ma4c416-f)"/>
        <text x="148" y="166" font-size="10" fill="var(--d1)">P</text>
        <line x1="70" y1="252" x2="166" y2="252" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="70" y1="247" x2="70" y2="257" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="166" y1="247" x2="166" y2="257" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="118" y="266" font-size="9.5" text-anchor="middle" fill="var(--faint)">6a</text>
        <line x1="166" y1="252" x2="198" y2="252" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="198" y1="247" x2="198" y2="257" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="182" y="266" font-size="9.5" text-anchor="middle" fill="var(--faint)">2a</text>
        <line x1="212" y1="102" x2="212" y2="230" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="207" y1="102" x2="217" y2="102" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="207" y1="230" x2="217" y2="230" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="220" y="170" font-size="9.5" fill="var(--faint)">8a</text>
        <text x="62" y="224" font-size="10" text-anchor="end" fill="var(--ink)">A</text>
        <text x="158" y="96" font-size="10" text-anchor="end" fill="var(--ink)">B</text>
        <text x="220" y="34" font-size="10" fill="var(--ink)">C</text>
        <text x="250" y="212" font-size="9.5" fill="var(--faint)">f = 0,2</text>
      </svg>
      <figcaption>

      La barra mide **15a** y se apoya en la arista del bloque, que está a
      **6a** de **A** y mide **8a** de alto por **2a** de ancho. Su extremo
      **A** está encajado contra el escalón, que es lo que le impide correrse
      hacia la izquierda.

      </figcaption>
      </figure>
    pide: El peso del bloque que hace falta para que no deslice y para que no vuelque, en unidades de P.
    pasos:
      - tipo: reconocer
        pregunta: |
          La barra se apoya en la **arista** del bloque. ¿Qué fuerzas hay que
          poner en ese contacto y qué dirección tienen?
        opciones:
          - texto: Una normal perpendicular a la barra y un rozamiento en la dirección de la barra
            correcta: true
            mensaje: |
              Eso es. En un contacto arista-superficie manda la superficie: la
              normal es perpendicular a la barra y el rozamiento va por ella.
              Además el rozamiento pasa por $A$, así que la normal sale sola de
              los momentos allí.
          - texto: Una fuerza vertical hacia arriba, porque el bloque está de pie
            mensaje: |
              La dirección del contacto no la decide la postura del bloque sino
              la geometría del contacto. La barra está inclinada, así que su
              normal también, y por eso el bloque recibe una componente
              horizontal que lo empuja.
          - texto: Solo una normal, porque en una arista no puede haber rozamiento
            mensaje: |
              El enunciado da coeficiente entre bloque y barra precisamente
              porque ahí hay rozamiento. Y cuenta: sin él saldrían $1{,}53P$ y
              $2{,}34P$ en vez de $1{,}188P$ y $1{,}764P$.

      - tipo: calcular
        titulo: El peso que impide el deslizamiento
        pregunta: |
          ¿Qué peso del bloque hace falta para que no deslice, en unidades de
          $P$?
        respuesta:
          tipo: numero
          valor: '1.188'
          tolerancia: 0.005
          formato: un número, el peso del bloque dividido entre P
        distractores:
          - valor: '1.53'
            mensaje: |
              Has despreciado el rozamiento entre la barra y el bloque. Ese
              rozamiento apunta hacia arriba por la barra, así que empuja al
              bloque hacia abajo y hacia la izquierda, y le ayuda por los dos
              lados.
          - valor: '1.872'
            mensaje: |
              Has puesto el rozamiento del contacto $B$ al revés. El bloque
              avanza hacia la derecha y su arista se corre hacia $C$ sobre la
              barra, así que el rozamiento sobre el bloque apunta hacia $A$.
        pista: |
          Momentos en $A$ sobre la barra dan $N = 0{,}45P$. Después proyecta la
          acción sobre el bloque y escribe $F_x = 0{,}2\,(P_D + |F_y|)$.
        desarrollo: |
          $$
          N\,(10a) = P\,(4{,}5a)
          \qquad\Longrightarrow\qquad
          N = 0{,}45P
          $$

          La barra empuja al bloque con $N(0{,}8;\,-0{,}6)$ más el rozamiento
          $0{,}2N$ hacia $A$, y en total $(0{,}306P;\,-0{,}342P)$. Entonces

          $$
          0{,}306P = 0{,}2\,(P_D + 0{,}342P)
          \qquad\Longrightarrow\qquad
          P_D = 1{,}188\,P = \frac{297}{250}P
          $$

      - tipo: calcular
        titulo: El peso que impide el vuelco
        pregunta: |
          ¿Y para que no vuelque sobre su arista de la derecha, en unidades de
          $P$?
        respuesta:
          tipo: numero
          valor: '1.764'
          tolerancia: 0.006
          formato: un número, el peso del bloque dividido entre P
        distractores:
          - valor: '2.34'
            mensaje: |
              Otra vez sin el rozamiento en $B$. Su componente vertical empuja
              el bloque hacia abajo justo en la esquina de la izquierda, y ese
              momento ayuda a no volcar.
          - valor: '0.882'
            mensaje: |
              Has tomado $2a$ como brazo del peso del bloque. El peso está en su
              centro, a $a$ de la arista de vuelco, así que el brazo es la mitad
              de la base.
        pista: |
          Momentos respecto de la arista inferior derecha. El peso del bloque
          tiene brazo $a$; la acción de la barra está en la esquina superior
          izquierda, a $2a$ a la izquierda y $8a$ por encima.
        desarrollo: |
          $$
          P_D\,a = 0{,}306P\,(8a) - 0{,}342P\,(2a) = 1{,}764\,aP
          $$

          $$
          P_D = 1{,}764\,P = \frac{441}{250}P
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Momentos en A sobre la barra: la normal en la arista vale 0,45 P, y el rozamiento de ese contacto no da momento porque pasa por A.'
          - texto: La barra empuja al bloque con 0,306 P en horizontal y 0,342 P hacia abajo, ya sumado el rozamiento.
          - texto: 'Contra el deslizamiento hacen falta 1,188 P y contra el vuelco 1,764 P: el peso mínimo es el mayor de los dos.'
          - texto: 'Basta con el menor de los dos pesos, 1,188 P: en cuanto el bloque no desliza, tampoco vuelca.'
            trampa: true
            mensaje: |
              Son dos formas independientes de perder el equilibrio y hay que
              impedir las dos. Con $1{,}188P$ el bloque no desliza, pero vuelca:
              el peso mínimo que sirve es $1{,}764P$.
    resolucion: |
      **La barra.** Su longitud es $15a$ y el apoyo cae a $10a$ de $A$
      —$\sqrt{(6a)^2+(8a)^2}$—, con el centro de gravedad a $7{,}5a$, o sea a
      $4{,}5a$ en horizontal. El rozamiento del contacto va por la barra y su
      recta pasa por $A$, así que momentos en $A$:

      $$
      N\,(10a) = P\,(4{,}5a)
      \qquad\Longrightarrow\qquad
      N = 0{,}45P
      $$

      **Lo que recibe el bloque.** La normal es perpendicular a la barra,
      $N(0{,}8;\,-0{,}6)$, y el rozamiento, $0{,}2N$ dirigido hacia $A$ sobre
      el bloque, porque la arista se corre hacia $C$ sobre la barra. En total

      $$
      (F_x;\,F_y) = (0{,}306P;\;-0{,}342P)
      $$

      **Deslizamiento.** Con la normal del suelo $P_D + 0{,}342P$,

      $$
      0{,}306P = 0{,}2\,(P_D + 0{,}342P)
      \qquad\Longrightarrow\qquad
      P_D = \frac{297}{250}P = 1{,}188P
      $$

      **Vuelco.** Momentos respecto de la arista inferior derecha:

      $$
      P_D\,a = 0{,}306P\,(8a) - 0{,}342P\,(2a)
      \qquad\Longrightarrow\qquad
      P_D = \frac{441}{250}P = 1{,}764P
      $$

      Los dos coinciden con el resultado publicado. El peso mínimo que sostiene
      de verdad la barra es el mayor, $1{,}764P$: manda el vuelco.
  - id: ejma4-col417-el-disco-con-masa-soldada-y-el-muelle
    titulo: El disco con una masa soldada, la barra y el muelle
    fuente: >-
      Ejercicio 4.17 · Tema 4, «Rozamiento» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección lo marca como de nivel de examen. La colección
      publica el resultado, contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      Un disco sin masa de radio $R$ tiene soldada una masa puntual $M$ a una
      distancia $R/2$ del centro $C$. El disco está apoyado en el punto $A$
      sobre una superficie horizontal y en el punto $B$ sobre la barra $DE$. En
      el contacto en $A$, se garantiza la rodadura y en el contacto en $B$ se
      sabe que el coeficiente de rozamiento es $f = 1/2$. La barra $DE$ tiene
      una longitud $2R$, masa despreciable y en su extremo $E$ está articulada
      a un muelle de longitud sin tensión $L_0 = 2R$ y constante elástica $k$
      desconocida. En la posición de equilibrio de la figura:

      a. Valores máximo y mínimo de la constante elástica $k$.

      b. Coeficiente de rozamiento necesario en el contacto en $A$ para
      garantizar la rodadura cuando la constante elástica $k$ toma sus valores
      máximo y mínimo.

      <figure>
      <svg viewBox="0 0 360 280" role="img" width="360" height="280" aria-labelledby="ma4c417-t ma4c417-d">
        <title id="ma4c417-t">Disco con una masa soldada, apoyado en el suelo y en una barra vertical con muelle</title>
        <desc id="ma4c417-d">Un disco de radio R apoyado en el suelo en el punto A. En su centro C y a media R a la derecha está la masa puntual soldada, en G. A la derecha, el disco toca en B una barra vertical DE de longitud dos R, articulada al suelo en D. El extremo superior E está unido por un muelle horizontal a una pared que está a una distancia R, así que el muelle, cuya longitud sin tensión es dos R, está comprimido.</desc>
        <line x1="20" y1="240" x2="300" y2="240" stroke="var(--ink)" stroke-width="1.2"/>
        <path d="M30 240 L22 248 M60 240 L52 248 M90 240 L82 248 M120 240 L112 248 M150 240 L142 248 M180 240 L172 248 M210 240 L202 248 M240 240 L232 248 M270 240 L262 248 M296 240 L288 248" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <circle cx="120" cy="170" r="70" fill="var(--faint)" fill-opacity="0.12" stroke="var(--ink)" stroke-width="1.3"/>
        <circle cx="120" cy="170" r="2.6" fill="var(--ink)"/>
        <circle cx="155" cy="170" r="6" fill="var(--d1)"/>
        <line x1="120" y1="170" x2="190" y2="170" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="190" y1="240" x2="190" y2="100" stroke="var(--ink)" stroke-width="3"/>
        <circle cx="190" cy="240" r="4" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
        <line x1="260" y1="70" x2="260" y2="240" stroke="var(--ink)" stroke-width="1.4"/>
        <path d="M260 80 L268 88 M260 110 L268 118 M260 140 L268 148 M260 170 L268 178 M260 200 L268 208 M260 230 L268 238" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <path d="M190 100 L200 94 L210 106 L220 94 L230 106 L240 94 L250 106 L260 100" fill="none" stroke="var(--d2)" stroke-width="1.6"/>
        <text x="222" y="84" font-size="10" text-anchor="middle" fill="var(--d2-tinta)">k</text>
        <line x1="292" y1="100" x2="292" y2="240" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="287" y1="100" x2="297" y2="100" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="287" y1="240" x2="297" y2="240" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="300" y="172" font-size="9.5" fill="var(--faint)">2R</text>
        <line x1="190" y1="196" x2="260" y2="196" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="190" y1="191" x2="190" y2="201" stroke="var(--faint)" stroke-width="0.8"/>
        <line x1="260" y1="191" x2="260" y2="201" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="225" y="210" font-size="9.5" text-anchor="middle" fill="var(--faint)">R</text>
        <text x="137" y="188" font-size="9" text-anchor="middle" fill="var(--faint)">R/2</text>
        <text x="172" y="188" font-size="9" text-anchor="middle" fill="var(--faint)">R/2</text>
        <text x="114" y="164" font-size="10" text-anchor="end" fill="var(--ink)">C</text>
        <text x="155" y="158" font-size="10" text-anchor="middle" fill="var(--d1)">G</text>
        <text x="196" y="164" font-size="10" fill="var(--ink)">B</text>
        <text x="120" y="256" font-size="10" text-anchor="middle" fill="var(--ink)">A</text>
        <text x="198" y="252" font-size="10" fill="var(--ink)">D</text>
        <text x="184" y="94" font-size="10" text-anchor="end" fill="var(--ink)">E</text>
      </svg>
      <figcaption>

      El muelle mide **R** y su longitud natural es **2R**: está **comprimido**
      y empuja el extremo **E** hacia el disco. La masa está soldada en **G**,
      a media **R** del centro, en la horizontal que pasa por **B**.

      </figcaption>
      </figure>
    pide: Los valores mínimo y máximo de k, y el rozamiento que hace falta en A en cada caso.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuánto se ha deformado el muelle y en qué sentido empuja o tira del
          extremo $E$?
        opciones:
          - texto: Está comprimido R, porque mide R y su longitud natural es 2R, y empuja E hacia el disco
            correcta: true
            mensaje: |
              Eso es. La pared está a $R$ del extremo de la barra y la longitud
              sin tensión es $2R$, así que la deformación es $R$ y el muelle
              **empuja** con $kR$ hacia la izquierda.
          - texto: Está estirado R y tira de E hacia la pared
            mensaje: |
              Si tirara hacia la pared, la barra se separaría del disco y no
              habría contacto en $B$. Lo que sostiene el sistema es
              precisamente que el muelle, comprimido, aprieta la barra contra
              el disco.
          - texto: La fuerza del muelle vale k por 2R, su longitud natural
            mensaje: |
              Un muelle no responde a su longitud natural sino a lo que se ha
              deformado desde ella. Aquí $F = k\,|L - L_0| = k\,(2R-R) = kR$.

      - tipo: calcular
        titulo: La constante mínima
        pregunta: |
          ¿Cuál es el menor valor de $k$ que mantiene el equilibrio, en
          unidades de $Mg/R$?
        respuesta:
          tipo: numero
          valor: '0.166667'
          tolerancia: 0.0015
          formato: un número, k dividido entre M g partido por R
        distractores:
          - valor: '0.083333'
            mensaje: |
              Has tomado la fuerza del muelle como $k\,2R$. La deformación es
              $R$, no $2R$: el muelle mide $R$ y su longitud sin tensión es
              $2R$.
          - valor: '0.333333'
            mensaje: |
              Has igualado la normal en $B$ a la fuerza del muelle. La barra
              está articulada en $D$: el muelle actúa a $2R$ y el disco a $R$,
              así que $N_B = 2kR$.
        pista: |
          Momentos en $D$ sobre la barra dan $N_B = 2kR$; momentos en $C$ sobre
          el disco dan $N_B + V_B = Mg/2$, con $|V_B| \le N_B/2$.
        desarrollo: |
          $$
          V_B = \frac{Mg}{2} - N_B
          \qquad
          V_B \le \frac{N_B}{2}
          \;\Longrightarrow\;
          N_B \ge \frac{Mg}{3}
          $$

          $$
          2kR \ge \frac{Mg}{3}
          \qquad\Longrightarrow\qquad
          k \ge \frac{Mg}{6R}
          $$

      - tipo: calcular
        titulo: La constante máxima
        pregunta: |
          ¿Y el mayor valor de $k$, en las mismas unidades?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.004
          formato: un número, k dividido entre M g partido por R
        distractores:
          - valor: '0.25'
            mensaje: |
              Otra vez la fuerza del muelle como $k\,2R$. Con la deformación
              buena, $R$, el límite sale el doble.
          - valor: '1'
            mensaje: |
              Es el valor de la normal $N_B$ en ese límite, en unidades de $Mg$,
              no el de $k$. La barra multiplica por dos: $N_B = 2kR$.
        pista: |
          El otro extremo es $V_B \ge -N_B/2$, con el rozamiento en $B$ hacia
          abajo.
        desarrollo: |
          $$
          \frac{Mg}{2} - N_B \ge -\frac{N_B}{2}
          \;\Longrightarrow\;
          N_B \le Mg
          \qquad\Longrightarrow\qquad
          k \le \frac{Mg}{2R}
          $$

      - tipo: calcular
        titulo: El rozamiento que hace falta en A
        pregunta: |
          Con $k$ en su valor mínimo, ¿qué coeficiente de rozamiento necesita
          el contacto en $A$ para que el disco ruede sin deslizar?
        respuesta:
          tipo: numero
          valor: '0.4'
          tolerancia: 0.004
          formato: un número, sin unidad
        distractores:
          - valor: '0.333333'
            mensaje: |
              Has dividido el rozamiento en $A$ entre $Mg$. La normal del suelo
              no es el peso: el rozamiento en $B$ tiene componente vertical y la
              cambia, aquí hasta $Mg/2 + N_B$.
          - valor: '0.666667'
            mensaje: |
              Ese es el valor que sale con $k$ en su **máximo**. Con la $k$
              mínima la normal en $B$ vale $Mg/3$ y el cociente baja a $2/5$.
        pista: |
          En horizontal, $F_A = N_B$; en vertical, $N_A = Mg - V_B$.
        desarrollo: |
          Con $N_B = Mg/3$ sale $V_B = Mg/6$ y

          $$
          f_A \ge \frac{F_A}{N_A} = \frac{Mg/3}{Mg - Mg/6} = \frac{2}{5}
          $$

          Con $k$ en su máximo, $N_B = Mg$ y $V_B = -Mg/2$, sale
          $f_A \ge 1/(3/2) = 2/3$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'El muelle está comprimido R y empuja E con kR; momentos en D: la normal en B vale 2kR.'
          - texto: 'Momentos en C sobre el disco: el peso tiene brazo R medio y los dos contactos brazo R, así que la normal en B más el rozamiento en B valen Mg partido por dos.'
          - texto: Imponiendo que el rozamiento en B no pase de la mitad de su normal salen los dos límites de k.
          - texto: En A no hay que comprobar nada, porque el enunciado dice que ahí hay rodadura.
            trampa: true
            mensaje: |
              Que haya rodadura es lo que se quiere **garantizar**, y por eso el
              apartado b pide el coeficiente necesario: el rozamiento en $A$
              tiene que llegar a $F_A = N_B$ sin pasar de su techo, y eso exige
              $2/5$ o $2/3$ según el caso.
    resolucion: |
      **La barra.** No tiene masa y está articulada en $D$. El muelle mide $R$
      con longitud natural $2R$: está comprimido y empuja $E$ con $kR$.
      Momentos en $D$, con el muelle a $2R$ y el disco a $R$:

      $$
      kR\,(2R) = N_B\,R
      \qquad\Longrightarrow\qquad
      N_B = 2kR
      $$

      **El disco.** Momentos en su centro $C$: el peso está a $R/2$, y el
      rozamiento de $A$ y el de $B$ tienen brazo $R$. Con la normal de $B$
      pasando por $C$,

      $$
      F_A\,R + V_B\,R = Mg\,\frac{R}{2}
      \qquad
      F_A = N_B
      \qquad\Longrightarrow\qquad
      N_B + V_B = \frac{Mg}{2}
      $$

      **Los límites.** En $B$, $|V_B| \le N_B/2$:

      $$
      \frac{Mg}{3} \le N_B \le Mg
      \qquad\Longrightarrow\qquad
      \frac{Mg}{6R} \le k \le \frac{Mg}{2R}
      $$

      **El rozamiento en A.** Con $N_A = Mg - V_B$ y $F_A = N_B$:

      $$
      k = \frac{Mg}{6R} \;\Rightarrow\; f_A \ge \frac{2}{5}
      \qquad
      k = \frac{Mg}{2R} \;\Rightarrow\; f_A \ge \frac{2}{3}
      $$

      Los cuatro valores coinciden con el resultado publicado.

  - id: ejma4-col418-el-disco-dentro-de-la-pista-circular
    titulo: El disco con una masa soldada dentro de una pista circular
    fuente: >-
      Ejercicio 4.18 · Tema 4, «Rozamiento» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección lo marca como de nivel de examen. La colección
      publica el resultado, contra el que está contrastado el desarrollo.
    nivel: practica
    enunciado: |
      El sistema mecánico de la figura consta de un disco de radio $R$, sin
      masa, con una partícula de masa $M$ soldada en el punto $M$, y articulado
      en su centro $B$ a una barra $AB$ sin masa. El sistema está situado
      dentro de una pista circular fija de radio $2R$. Si el sistema está en
      equilibrio, calcular:

      a. Coeficiente de rozamiento mínimo necesario para que exista equilibrio.

      b. Fuerza transmitida en la articulación en $B$.

      <figure>
      <svg viewBox="0 0 400 320" role="img" width="400" height="320" aria-labelledby="ma4c418-t ma4c418-d">
        <title id="ma4c418-t">Disco dentro de una pista circular, unido por una barra al punto más bajo de la pista</title>
        <desc id="ma4c418-d">Una pista circular fija de radio dos R, dibujada como su mitad inferior. Dentro, un disco de radio R toca la pista en el punto C. Su centro B está unido por una barra recta al punto A, el más bajo de la pista; la barra forma 30 grados con la vertical. La partícula de masa M está soldada en el punto del disco diametralmente opuesto a C, que resulta ser el centro de la pista, y la recta que une la masa con B y con C forma 60 grados con la vertical.</desc>
        <path d="M50 130 A 140 140 0 0 1 330 130" fill="none" stroke="var(--ink)" stroke-width="2"/>
        <path d="M325 166 L335 170 M305 210 L312 216 M270 245 L276 252 M226 265 L229 274 M178 270 L177 279 M131 257 L127 265 M91 229 L85 235 M63 189 L55 193 M51 142 L42 143" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <circle cx="251" cy="165" r="70" fill="var(--faint)" fill-opacity="0.1" stroke="var(--ink)" stroke-width="1.2"/>
        <line x1="60" y1="130" x2="330" y2="130" stroke="var(--faint)" stroke-width="0.7" stroke-dasharray="4 3"/>
        <line x1="190" y1="60" x2="190" y2="272" stroke="var(--faint)" stroke-width="0.7" stroke-dasharray="4 3"/>
        <line x1="190" y1="130" x2="330" y2="211" stroke="var(--faint)" stroke-width="0.7" stroke-dasharray="4 3"/>
        <line x1="190" y1="270" x2="251" y2="165" stroke="var(--ink)" stroke-width="3"/>
        <circle cx="251" cy="165" r="4" fill="var(--ink)"/>
        <circle cx="190" cy="130" r="7" fill="var(--d1)"/>
        <circle cx="311" cy="200" r="3" fill="var(--flag)"/>
        <path d="M190 162 A 32 32 0 0 0 208 148" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <text x="196" y="176" font-size="9.5" fill="var(--faint)">60°</text>
        <path d="M190 240 A 30 30 0 0 0 205 234" fill="none" stroke="var(--faint)" stroke-width="0.9"/>
        <text x="198" y="256" font-size="9.5" fill="var(--faint)">30°</text>
        <text x="180" y="124" font-size="10" text-anchor="end" fill="var(--d1)">M</text>
        <text x="258" y="158" font-size="10" fill="var(--ink)">B</text>
        <text x="316" y="196" font-size="10" fill="var(--flag)">C</text>
        <text x="180" y="282" font-size="10" text-anchor="end" fill="var(--ink)">A</text>
        <text x="216" y="140" font-size="9" fill="var(--faint)">R</text>
        <text x="282" y="176" font-size="9" fill="var(--faint)">R</text>
      </svg>
      <figcaption>

      La masa está soldada en el punto del disco opuesto a **C**, que cae justo
      en el centro de la pista. La barra **AB** no tiene masa y solo recibe
      fuerzas en sus extremos, así que su reacción va en su propia dirección.

      </figcaption>
      </figure>
    pide: El coeficiente de rozamiento mínimo en C y la fuerza que la barra transmite en B.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué se puede afirmar de la fuerza que la barra $AB$ transmite en $B$?
        opciones:
          - texto: Que va en la dirección AB, porque la barra no tiene masa y solo recibe fuerzas en sus dos extremos
            correcta: true
            mensaje: |
              Eso es. Es una barra de dos fuerzas: con solo dos puntos de
              aplicación y sin peso, las dos fuerzas tienen que ser opuestas y
              estar sobre la recta $AB$. Queda una sola incógnita, su módulo.
          - texto: Que tiene dos componentes cualesquiera, porque B es una articulación
            mensaje: |
              Una articulación transmite dos componentes en general, pero aquí
              la barra impone su dirección. Poner dos incógnitas deja el disco
              con cuatro y solo tres ecuaciones.
          - texto: Que es vertical, porque sostiene el peso de la partícula
            mensaje: |
              La barra está inclinada 30° respecto de la vertical, así que su
              fuerza también. De hecho su componente horizontal es la que
              equilibra al rozamiento en $C$.

      - tipo: calcular
        titulo: El coeficiente de rozamiento en C
        pregunta: |
          ¿Qué coeficiente de rozamiento mínimo hace falta en el contacto $C$?
        respuesta:
          tipo: numero
          valor: '1.732051'
          tolerancia: 0.006
          formato: un número, sin unidad
        distractores:
          - valor: '1.5'
            mensaje: |
              Has usado $R$ como brazo del peso respecto de $B$. El brazo es la
              distancia **horizontal** de $B$ a la masa, que vale
              $R\cos 30^\circ = \sqrt{3}R/2$.
          - valor: '0.57735'
            mensaje: |
              Eso es $\tan 30^\circ$, el coeficiente que pediría el apoyo del
              extremo $A$ sobre la pista. En $C$ hace falta mucho más, y el
              mínimo del sistema es el mayor de los dos.
        pista: |
          Momentos en $B$: solo dan momento el peso y el rozamiento de $C$, los
          dos con su brazo. La normal de $C$ pasa por $B$.
        desarrollo: |
          $$
          F_t\,R = Mg\,\frac{\sqrt{3}}{2}R
          \qquad\Longrightarrow\qquad
          F_t = \frac{\sqrt{3}}{2}Mg
          $$

          Proyectando después sale $N = Mg/2$, y

          $$
          f \ge \frac{F_t}{N} = \frac{\sqrt{3}/2}{1/2} = \sqrt{3}
          $$

      - tipo: calcular
        titulo: La componente vertical de la fuerza en B
        pregunta: |
          ¿Cuánto vale la componente vertical de la fuerza que se transmite en
          $B$, en unidades de $Mg$?
        respuesta:
          tipo: numero
          valor: '1.5'
          tolerancia: 0.006
          formato: un número, la componente dividida entre Mg
        distractores:
          - valor: '1'
            mensaje: |
              La barra no sostiene solo el peso. El rozamiento en $C$ es grande
              y tiene componente vertical hacia abajo, así que la barra tiene
              que empujar con más de $Mg$.
          - valor: '0.866025'
            mensaje: |
              Esa es la componente horizontal, $Mg\sqrt{3}/2$. La vertical sale
              de multiplicar el módulo $\sqrt{3}Mg$ por $\cos 30^\circ$.
        pista: |
          El módulo de la fuerza en la barra vale $\sqrt{3}Mg$ y la barra forma
          30° con la vertical.
        desarrollo: |
          $$
          S = \sqrt{3}\,Mg
          \qquad
          S_y = S\cos 30^\circ = \sqrt{3}\,Mg\,\frac{\sqrt{3}}{2} = \frac{3}{2}Mg
          $$

          y la horizontal, $S_x = \sqrt{3}Mg/2$. Es la fuerza
          $\overline{R}_B = -\tfrac{\sqrt{3}}{2}Mg\,\overline{i} - \tfrac{3}{2}Mg\,\overline{j}$
          del resultado, escrita como la ejerce el disco sobre la barra.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: La masa soldada está en el punto opuesto a C, que cae en el centro de la pista, a media raíz de tres por R en horizontal de B.
          - texto: 'Momentos en B sobre el disco: la normal de C pasa por B, así que el rozamiento equilibra al peso y vale media raíz de tres por Mg.'
          - texto: Proyectando en las dos direcciones sale la normal, Mg partido por dos, y el coeficiente necesario, raíz de tres.
          - texto: Como el disco no tiene masa, en C basta con poner la normal y el sistema se resuelve sin rozamiento.
            trampa: true
            mensaje: |
              El disco no tiene masa, pero lleva una partícula soldada: el
              conjunto pesa $Mg$ y ese peso no pasa por $B$. Sin rozamiento en
              $C$ no hay nada que equilibre su momento y el sistema no puede
              estar en equilibrio.
    resolucion: |
      **La geometría.** El disco de radio $R$ toca por dentro a la pista de
      radio $2R$, así que su centro $B$ está a $R$ del centro de la pista. La
      masa está soldada en el punto opuesto a $C$, que resulta ser justo el
      centro de la pista, a $R\cos 30^\circ = \sqrt{3}R/2$ en horizontal de
      $B$.

      **El disco.** Momentos en $B$: la normal de $C$ pasa por $B$ y no da
      momento, así que

      $$
      F_t\,R = Mg\,\frac{\sqrt{3}}{2}R
      \qquad\Longrightarrow\qquad
      F_t = \frac{\sqrt{3}}{2}Mg
      $$

      **Las proyecciones.** Con la fuerza de la barra en la dirección $AB$
      —barra de dos fuerzas— las dos ecuaciones dan

      $$
      N = \frac{Mg}{2}
      \qquad
      S = \sqrt{3}\,Mg
      \qquad\Longrightarrow\qquad
      f \ge \frac{F_t}{N} = \sqrt{3}
      $$

      **La fuerza en B.** Sus componentes son
      $\left(\tfrac{\sqrt{3}}{2}Mg,\ \tfrac{3}{2}Mg\right)$ sobre el disco, o
      sea $\overline{R}_B$ con signo cambiado sobre la barra, que es como lo
      publica el resultado. Los dos apartados coinciden con él.

      **Un aviso sobre el apoyo en A.** La barra es de dos fuerzas, así que en
      $A$ la reacción de la pista también va en la dirección $AB$: ahí haría
      falta $\tan 30^\circ = 0{,}577$, mucho menos que en $C$. El mínimo que
      pide el sistema es por tanto $\sqrt{3}$.

  - id: ejma4-col419-la-celosia-el-triangulo-y-la-deslizadera
    titulo: La celosía, el triángulo y la deslizadera con rozamiento
    fuente: >-
      Ejercicio 4.19 · Tema 4, «Rozamiento» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección lo marca como de nivel de examen. Los dos límites
      de k coinciden con el resultado publicado; en el apartado b, el resultado
      publicado intercambia las barras 1 y 3 respecto de la figura, y aquí se
      sigue la figura.
    nivel: practica
    enunciado: |
      El sistema mecánico de la figura está en equilibrio en la posición
      mostrada. El cuadrado de masa $4M$ y lado $L$ está articulado a varias
      barras de masa despreciable formando dos estructuras simétricas. En el
      punto $O$, se articulan a un punto fijo y en $A$ se apoyan sin rozamiento
      a un triángulo de masa $M$. Por otra parte, en $D$, la estructura está
      unida a un muelle ideal $(L_0 = 0)$ de constante elástica $k$
      desconocida. El triángulo inferior está articulado en $B$ a una
      deslizadera que se mueve sobre una guía vertical con un coeficiente de
      fricción entre superficies $\mu = 1/2$. En $C$ se aplican las fuerzas
      indicadas, siendo $F$ desconocida. Cuando el movimiento de $B$ es
      inminente hacia abajo, calcular:

      a. Valores límite entre los que oscila $k$ para el equilibrio y valor de
      $F$ en ambos casos.

      b. Tomando el valor inferior de $k$, calcular las fuerzas internas en las
      barras $1-2-3$, indicando si son de tracción o de compresión.

