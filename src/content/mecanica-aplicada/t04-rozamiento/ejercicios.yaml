      </svg>
      <figcaption>

      Dibujado en el ángulo límite para μ = 0,25. Los dos rozamientos, en su techo. Ejes: x hacia la derecha, y hacia arriba; momentos positivos en sentido antihorario.

      </figcaption>
      </figure>

      - **El peso** $P$, en el centro $G$.
      - **En A**, la normal $N_1$ hacia arriba y el rozamiento hacia la
        pared: el bloque se abre y $A$ se escapa alejándose de ella.
      - **En B**, la normal $N_2$ saliendo de la pared y el rozamiento hacia
        arriba: $B$ baja.
      - En el ángulo límite el bloque está a punto de escurrirse, y $A$ y $B$
        deslizan a la vez: los dos rozamientos en su techo, $\mu N_1$ y
        $\mu N_2$.

      **2. Incógnitas.** $N_1$, $N_2$ y el ángulo $\alpha$: tres, para las
      tres ecuaciones del bloque.

      **3. Ecuaciones.** Con origen en $A$, el vértice $B$ está en
      $L(-\cos\alpha;\ \sin\alpha)$ y el centro, en
      $\frac{L}{2}(\sin\alpha - \cos\alpha;\ \sin\alpha + \cos\alpha)$:

      $$
      \sum F_x = N_2 - \mu N_1 = 0, \qquad
      \sum F_y = N_1 + \mu N_2 - P = 0
      $$

      $$
      \sum M_A = \frac{PL}{2}(\cos\alpha - \sin\alpha)
      - L\sin\alpha\,N_2 - \mu L\cos\alpha\,N_2 = 0
      $$

      **4. Resultados.** De las fuerzas,

      $$
      N_1 = \frac{P}{1+\mu^{2}}, \qquad N_2 = \frac{\mu P}{1+\mu^{2}}
      $$

      y con $N_2$ en los momentos,
      $(\cos\alpha - \sin\alpha)(1+\mu^{2}) = 2\mu\,(\sin\alpha + \mu\cos\alpha)$,
      que agrupando queda $\cos\alpha\,(1-\mu^{2}) = \sin\alpha\,(1+\mu)^{2}$:

      $$
      \tan\alpha = \frac{1-\mu}{1+\mu}
      \;\Longrightarrow\;
      \alpha = 45^{\circ} - \arctan\mu
      $$

      Con $\mu = 0{,}25$: $\alpha = 30{,}96^{\circ}$, $N_1 = 0{,}9412\,P$ y
      $N_2 = 0{,}2353\,P$. En vectores, el suelo hace en $A$
      $P\,(-0{,}2353\,\vec{i} + 0{,}9412\,\vec{j})$ y la pared en $B$,
      $P\,(0{,}2353\,\vec{i} + 0{,}0588\,\vec{j})$.

      **5. Comprobación.** Momentos en $B$, que no se han usado. Respecto de
      $B$, $A$ está a $L\cos\alpha$ a la derecha y $L\sin\alpha$ por debajo,
      y $G$ a $\frac{L}{2}(\cos\alpha + \sin\alpha)$ a la derecha:

      $$
      \sum M_B = L\cos\alpha\,N_1 - \mu L\sin\alpha\,N_1
      - \frac{PL}{2}(\cos\alpha + \sin\alpha) = 0
      $$

      Con $N_1 = P/(1+\mu^{2})$ queda
      $2(\cos\alpha - \mu\sin\alpha) = (1+\mu^{2})(\cos\alpha + \sin\alpha)$,
      que agrupando da otra vez $\tan\alpha = (1-\mu)/(1+\mu)$. Con números:
      $0{,}9412 \cdot 0{,}7289 = 0{,}686$ y $\frac{1}{2} \cdot 1{,}372 =
      0{,}686$.

      **Lo que dice el resultado.** Coincide con lo publicado. A $45^{\circ}$
      el centro cae justo encima de $A$ y el bloque se sostiene sin
      rozamiento; el rozamiento le quita a esos $45^{\circ}$ exactamente el
      ángulo de rozamiento, $\arctan\mu$. Cuanto más rozamiento, menor el
      ángulo mínimo, y con $\mu \ge 1$ el bloque aguanta en cualquier
      posición.

  - id: ejma4-col47-las-dos-cunas-y-la-carga
    titulo: Las dos cuñas que levantan una carga
    fuente: >-
      Ejercicio 4.7 · Tema 4, «Rozamiento» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección lo marca como resuelto en el libro. Su resultado
      del apartado a sale; el del apartado b, 0,11, no es el rozamiento mínimo
      que pide el enunciado, y el desarrollo explica de dónde viene ese número.
    nivel: practica
    antes:
      idea: |
        En un sistema de cuñas, cada pieza se aísla por separado. En cada
        contacto que desliza, el rozamiento vale $\mu N$ y se opone al
        deslizamiento de esa pieza respecto de la otra; en los que no
        deslizan, vale lo que haga falta.
      formula: |
        La normal a una cara inclinada $\theta$ sobre la horizontal forma
        $\theta$ con la vertical. Y con el ángulo de rozamiento
        $\varphi = \arctan\mu$:

        $$
        \frac{\sin\theta + \mu\cos\theta}{\cos\theta - \mu\sin\theta}
        = \tan(\theta + \varphi)
        $$
      reconocer: |
        Antes de plantear se piensa qué pieza se mueve respecto de cuál.
    enunciado: |
      En el sistema de cargas $P$ y $Q$ de la figura, la carga $Q$ se mantiene
      lateralmente sostenida entre rodillos. El coeficiente de rozamiento entre
      la carga $Q$ y la cuña superior y entre ambas cuñas es
      $\mu_1 = 0{,}2$. El coeficiente de rozamiento $\mu_2$ entre cuña inferior
      y suelo es desconocido. Calcular:

      a. El coeficiente de rozamiento mínimo $\mu_2$ para elevar la carga $Q$.

      b. El coeficiente de rozamiento mínimo $\mu_2$ para sostener la carga
      $Q$, al eliminar la carga $P$.

      <figure>
      <svg viewBox="0 0 340 250" role="img" width="340" height="250" aria-labelledby="ejma4-col47-t ejma4-col47-d">
        <title id="ejma4-col47-t">Dos cuñas de 5 grados que elevan una carga guiada entre rodillos</title>
        <desc id="ejma4-col47-d">Una carga Q guiada verticalmente entre rodillos apoyados en dos paredes, de modo que solo puede subir o bajar. Debajo de ella, una cuña superior con la cara de arriba horizontal y la de abajo inclinada 5 grados, empujada hacia la derecha por una fuerza P. Debajo, una cuña inferior con la cara de arriba inclinada los mismos 5 grados y la de abajo horizontal, apoyada en el suelo. El rozamiento vale mu uno entre la carga y la cuña superior y entre las dos cuñas, y mu dos entre la cuña inferior y el suelo.</desc>
