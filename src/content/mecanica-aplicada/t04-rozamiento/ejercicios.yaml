      a) El disco. b) La barra AC. c) La barra BC. El disco va a rodar hacia la izquierda: la normal se adelanta hacia ese lado; el adelanto μr está exagerado. Ejes: x hacia la derecha, y hacia arriba; momentos positivos en sentido antihorario.

      </figcaption>
      </figure>

      - **El disco.** No pesa. En $A$, la barra tira de él hacia la izquierda
        con $A_x$ y lo empuja hacia abajo con $A_y$; en el suelo, la normal
        $N$, adelantada $\mu_r$ hacia la izquierda, que es hacia donde va a
        rodar, y el rozamiento $F_r$, hacia la derecha.
      - **La barra AC.** En $A$, las mismas componentes cambiadas de
        sentido; la carga $P$, a $R$ de $C$; y en $C$, $C_x$ y $C_y$, que le
        hace la barra BC.
      - **La barra BC.** En $C$, $C_x$ y $C_y$ cambiadas de sentido; el par
        $M$; y en $B$, la articulación, con $B_x$ y $B_y$.

      **2. Incógnitas.** $A_x$, $A_y$, $N$, $F_r$, $C_x$, $C_y$, $B_x$, $B_y$ y
      $M$: nueve, para las nueve ecuaciones de los tres sólidos. Que el disco
      **empiece** a rodar fija dónde está la normal: adelantada justo
      $\mu_r$.

      **3. Ecuaciones.** El disco, con momentos en el punto $I$ donde actúa
      la normal: $N$ y $F_r$ pasan por él, y $A$ está $2R$ más arriba y
      $\mu_r$ más a la derecha:

      $$
      \sum M_I = 2R\,A_x - \mu_r\,A_y = 0, \qquad
      \sum F_x = F_r - A_x = 0, \qquad
      \sum F_y = N - A_y = 0
      $$

      La barra AC, con momentos en $C$, donde está a $4R$ de $A$ y a $R$ de
      $P$:

      $$
      \sum M_C = -4R\,A_y + R\,P = 0, \qquad
      \sum F_x = A_x - C_x = 0, \qquad
      \sum F_y = A_y + C_y - P = 0
      $$

      La barra BC, con momentos en $B$, con $C$ a $2R$ a la derecha y $2R$
      más arriba:

      $$
      \sum M_B = M - 2R\,C_y - 2R\,C_x = 0, \qquad
      \sum F_x = C_x - B_x = 0, \qquad
      \sum F_y = B_y - C_y = 0
      $$

      **4. Resultados.**

      $$
      A_y = N = \frac{P}{4}, \qquad C_y = B_y = \frac{3P}{4}, \qquad
      A_x = F_r = C_x = B_x = \frac{\mu_r}{2R}\,\frac{P}{4} = \frac{P}{200}
      $$

      $$
      M = 2R\cdot\frac{3P}{4} + 2R\cdot\frac{P}{200} = 1{,}5\,PR + 0{,}01\,PR
      = 1{,}51\,PR
      $$

      El rozamiento que hace falta es $F_r/N = \mu_r/(2R)$:

      $$
      \mu_{s,\min} = \frac{0{,}04}{2} = 0{,}02
      $$

      Sobre el disco, el suelo hace $P\,(0{,}005\,\vec{i} + 0{,}25\,\vec{j})$;
      sobre la barra BC, la articulación $B$ hace
      $P\,(-0{,}005\,\vec{i} + 0{,}75\,\vec{j})$.

      **5. Comprobación.** Los tres sólidos juntos, con momentos en $B$:
      quedan solo las fuerzas de fuera. El contacto del disco está $2R$ a la
      izquierda de $B$, así que la normal actúa a $2R + \mu_r = 2{,}04R$; $P$
      está $R$ a la derecha; y $F_r$ va a la altura de $B$:

      $$
      \sum M_B = M - 2{,}04R\cdot\frac{P}{4} - R\,P
      = (1{,}51 - 0{,}51 - 1)\,PR = 0
      $$

      **Lo que dice el resultado.** Coincide con lo publicado. De los
      $1{,}51PR$, $1{,}5PR$ son para sostener la carga y solo $0{,}01PR$ es
      la resistencia a la rodadura. Si el disco rodara hacia el otro lado
      saldría $1{,}49PR$: el intervalo de pares que **no** mueven nada es
      justo ese, de $1{,}49PR$ a $1{,}51PR$.

  - id: ejma4-col416-la-barra-sostenida-por-un-bloque
    titulo: El bloque que sostiene una barra, entre deslizar y volcar
    fuente: >-
      Ejercicio 4.16 · Tema 4, «Rozamiento» · Mecánica Aplicada, UPV/EHU, curso
      2025-2026. La colección lo marca como de nivel de examen y como resuelto
      en el libro. La colección publica el resultado, contra el que está
      contrastado el desarrollo.
    nivel: practica
    antes:
      idea: |
        Cuando dos cuerpos se tocan, cada uno se aísla por separado y lo que
        uno le hace al otro aparece en los dos, con el sentido cambiado. Un
        bloque puede perder el equilibrio deslizando o volcando, y cada forma
        tiene su propia condición.
      formula: |
        En el límite, $F_r = \mu_s N$, con el rozamiento opuesto al
        deslizamiento relativo. Y el momento respecto de $P$ de una fuerza
        $(F_x;\ F_y)$ aplicada en $(x;\ y)$ es

        $$
        M_P = (x - x_P)\,F_y - (y - y_P)\,F_x
        $$
      reconocer: |
        Antes de plantear se mira, en cada contacto, qué toca a qué: una cara,
        una arista o un punto.
    enunciado: |
      El peso de la barra $ABC$ es $P$ y su longitud $15a$. Determinar el peso
      mínimo necesario que debe tener el bloque para sostener la barra en
      función de $P$, analizando el deslizamiento y el vuelco del bloque. El
      coeficiente de rozamiento entre el bloque y el suelo y entre el bloque y
      la barra es $0{,}2$.

      <figure>
