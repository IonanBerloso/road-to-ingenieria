    pide: El coeficiente de rozamiento mínimo y el momento M en función de P y R.
    pasos:
      - tipo: reconocer
        pregunta: |
          El dato es $\mu_r/R = 0{,}04$. ¿Cómo entra en el equilibrio del disco?
        opciones:
          - texto: Como una longitud que adelanta la normal, y la condición es la fuerza horizontal por 2R igual a la vertical por mu erre
            correcta: true
            mensaje: |
              Eso es. $\mu_r$ es el brazo con el que se adelanta la normal, y
              aquí la fuerza horizontal entra por $A$, a $2R$ del suelo:
              $A_x\,2R = A_y\,\mu_r$.
          - texto: Como un coeficiente de rozamiento sin dimensiones, o sea la fuerza de rozamiento vale 0,04 por la normal
            mensaje: |
              $\mu_r$ es una **longitud**, no un número. Por eso el dato viene
              dividido por $R$: lo que hace de coeficiente equivalente es el
              cociente $\mu_r/(2R)$ con esta geometría, no $\mu_r/R$ a secas.
          - texto: Con la fuerza aplicada en el centro del disco, a R del suelo
            mensaje: |
              El disco no recibe nada en su centro: está articulado a la barra
              por su punto más alto, a $2R$ del suelo. El brazo de la fuerza que
              lo hace rodar es esa altura.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna ecuación: **el disco y las dos barras
          por separado**. Con los ejes, la altura de $A$ sobre el suelo y las
          distancias de las barras.
        comprueba:
          - punto: |
              **El disco: en $A$, la fuerza de la barra en sus dos
              componentes; abajo, $N$ y $F_r$. Nada más: no pesa.**
            porque: |
              Cargado solo en dos puntos, la fuerza de la barra y la del suelo
              tienen que estar sobre la misma recta.
          - punto: |
              **La normal adelantada $\mu_r$ hacia el lado al que va a rodar:
              con el par antihorario, hacia la izquierda.**
            porque: |
              La barra BC gira alrededor de $B$: $C$ sube y se va a la
              izquierda, y arrastra la barra AC y el disco con ella.
          - punto: |
              **Las componentes en $A$ y en $C$ con sentidos opuestos en los
              dos sólidos que unen, y el par $M$ solo en la barra BC.**
            porque: |
              Acción y reacción: lo que la barra le hace al disco, el disco se
              lo hace a la barra al revés.
          - punto: |
              **$P$ a $R$ de $C$, y $C$ a $2R$ de $B$ en horizontal y en
              vertical.**
            porque: |
              Son los brazos de los momentos en $C$ y en $B$.
