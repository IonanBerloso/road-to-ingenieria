# La ruta del bloque 2 de Mecánica Aplicada, Cinemática y Dinámica.
#
# TRANSCRITAS EL 27 DE SEPTIEMBRE DE 2026. Las tres convocatorias del bloque
# —26 de junio de 2018, 30 de mayo de 2019 y 26 de junio de 2019— son
# bilingües, con el castellano en la columna derecha como imágenes de
# palabra, que pdftotext no saca: se transcribió esa columna mirando la
# página renderizada, y nada se tradujo del euskera. Son trece piezas, cada
# una con su resolución y con sus respuestas recalculadas aparte en
# `tests/verificacion/mecanica-1718-2c-ext`, `-1819-2c` y `-1819-2c-ext`.
# Desde ese día cada bloque de esta ruta tiene al menos un ejercicio de
# examen. Lo que sigue es la historia de cómo se midió antes, cuando todavía
# no lo estaban, y sigue valiendo: el recuento no ha cambiado al transcribir.
#
# CÓMO SE HABÍA MEDIDO. Hasta ese día el bloque 2 no tenía ninguna
# convocatoria transcrita, por lo mismo: el castellano iba en imagen.
#
# CORREGIDO EL 13 DE SEPTIEMBRE DE 2026. Aquí ponía «y por eso el índice de
# exámenes las declara imposibles». No las declaraba: la palabra «euskera» no
# aparecía en ninguna página construida más que en el enlace a esta ruta, y
# las dos convocatorias de 2018-2019 del bloque 1 no se mencionaban en ningún
# sitio del sitio. Era una afirmación sobre el producto escrita desde el
# fichero, sin comprobar el producto. Ahora las cinco están en el `falta[]`
# del bloque que les toca, que es donde el lector las ve.
#
# Pero clasificar no es transcribir. Los tres se han leído SOLO para contar
# qué tema pide cada hueco, que es lo que §14 necesita para ordenar una ruta,
# y esa lectura no publica ni una palabra de ellos. Lo que se lee para eso es
# reconocible sin traducir nada: «abiadura angeluarra» es velocidad angular,
# «AEZ» es el centro instantáneo, «erreakzio estatiko eta dinamikoak» son las
# reacciones estáticas y dinámicas, y las figuras y las fórmulas no tienen
# idioma.
#
# El recuento, hueco a hueco sobre las tres:
#
#   movimiento plano (t08) ......... 4   el CIR, su velocidad de sucesión,
#                                        la rodadura de un disco sobre otro
#   cinemática (t07) ............... 3   contacto entre sólidos, componentes
#                                        intrínsecas, un plano que gira
#   dinámica del sólido (t10) ...... 3   momento angular con el tensor y
#                                        energía cinética, dos veces de teoría
#   eje fijo (t11) ................. 2   los dos ejercicios de reacciones y
#                                        equilibrado
#   dinámica plana (t12) ........... 2   el cuadrilátero articulado y el
#                                        mecanismo con par constante
#   teoremas (t09) ................. 1   el trabajo y la energía cinética
#                                        de una partícula
#
# Un aviso sobre el alcance: estos tres exámenes son de 2018 y 2019, y el
# bloque hoy se examina dentro de la ordinaria y la extraordinaria. El
# temario de la guía 2025/26 es el mismo, pero la medición tiene siete años,
# y eso pesa menos que una medida sobre convocatorias recientes.
asignatura: mecanica-aplicada
evaluacion: segundo-cuatrimestre
titulo: Preparar el examen del bloque 2, Cinemática y Dinámica
lede: >-
  Los temas 7 a 12 ordenados por lo que cae en los tres exámenes de dinámica
  que hay, transcritos con sus trece piezas y enlazados cada uno en su
  escalón. Los tres son de 2018 y 2019: **esta ruta está medida sobre siete
  años de antigüedad**, la más antigua del sitio.
tambienPrepara:
  - ordinaria
  - extraordinaria
temas:
  - t07-cinematica
  - t08-movimiento-plano
  - t09-teoremas-de-la-dinamica
  - t10-dinamica-del-solido
  - t11-eje-fijo
  - t12-dinamica-plana
medidoSobre: 3
criterioDeOrden: >-
  Por cuántos huecos ocupa cada tema en los tres exámenes de dinámica, de más
  a menos, con el suelo delante porque la derivada de un vector que gira
  aparece dentro de todos ellos y no como ejercicio propio. Cuando dos temas
  empatan manda el que cae como ejercicio largo y no solo como cuestión.

bloques:
  - id: suelo
    titulo: Derivar un vector que gira, que es lo que hay debajo de todo
    pide: >-
      Nada por sí mismo: es la operación que aparece dentro de cada ejercicio
      del bloque, desde la aceleración de Coriolis hasta el momento que piden
      los cojinetes.
    porque: >-
      No ocupa hueco propio en ninguno de los tres exámenes, y por eso su
      recuento es cero. Está dentro de todos: la aceleración complementaria
      del tema 7, la derivada del momento angular del 10 y el par que sostiene
      un rotor desequilibrado del 11 son el mismo cálculo con otro nombre.
    invariante:
      anios: 0
      fuente: >-
        Cero como ejercicio propio en los tres exámenes transcritos; presente en
        todos ellos como paso intermedio.
    apunte:
      texto: no puntúa — está dentro de todos
      tono: marco
    dominio: >-
      Sabes decir, ante cualquier vector que cambia de dirección, qué parte de
      su derivada viene de que cambie de módulo y qué parte de que gire.
    revisado: '2026-09-27'
    escalones:
      - id: la-derivada-que-gira
        titulo: Un vector de módulo constante que gira tiene derivada
        aprendes: >-
          A escribir la derivada de un vector en ejes que giran, que es de
          donde salen Coriolis, el término de Boure y los pares que no se ven.
        teoria:
          tema: t07-cinematica
          apartado: el-campo-de-aceleraciones
          nota: >-
            El error típico que sigue al apartado es exactamente este: tomar
            la aceleración angular como la derivada del módulo cuando el eje
            de giro también cambia de dirección.
        ejercicios:
          - id: ejma7-la-deslizadera-y-coriolis
            incrustado: true
            nota: >-
              El ejemplo de entrada, con los cuatro términos de la aceleración
              separados y la de Coriolis valiendo el doble que el arrastre.
          - id: ejma7-col78-el-brazo-de-robot-y-la-esfera-a
            nota: >-
              Dos giros a la vez, y la aceleración angular que sale de que uno
              arrastre al otro aunque ninguno se acelere.
        dominio: >-
          Separas los cuatro términos de la aceleración de un punto que se
          mueve sobre un sólido que gira, sin mirar la fórmula.
      - id: el-momento-que-cuesta-girar
        titulo: "Lo mismo, en dinámica: por qué hace falta un par sin acelerar"
        aprendes: >-
          A ver que un momento angular que no va en la dirección del giro
          exige un par aunque la velocidad angular no cambie.
        teoria:
          tema: t10-dinamica-del-solido
          apartado: el-momento-angular-y-el-tensor-de-inercia
        ejercicios:
          - id: ejma10-la-barra-que-gira-inclinada
            incrustado: true
          - id: exma1718-2cext-4-el-cilindro-inclinado-sobre-un-eje-vertical
            nota: >-
              Es el ejercicio 2 de junio de 2018: el mismo cálculo con un
              cilindro, H_G, su derivada y las reacciones que salen de ella,
              a velocidad constante.
        dominio: >-
          Explicas con una barra inclinada por qué los cojinetes de un rotor
          desequilibrado sufren aunque gire a velocidad constante.

  - id: movimiento-plano
    titulo: Movimiento plano, que es lo que más cae
    pide: >-
      Velocidades y aceleraciones angulares de mecanismos, el centro
      instantáneo con su base y su velocidad de sucesión, y la rodadura de un
      disco sobre otro.
    porque: >-
      Cuatro de los quince huecos contados, y aparece en los tres exámenes:
      el mecanismo de barras de junio de 2018, la velocidad de sucesión y la
      rodadura de un disco sobre otro en mayo de 2019, y las angulares del
      cuadrilátero en junio de 2019.
    invariante:
      anios: 3
      fuente: >-
        Contado sobre los tres exámenes de dinámica transcritos:
        26 de junio de 2018 (ejercicio 1), 30 de mayo de 2019 (cuestión 2 y
        cuestión 3) y 26 de junio de 2019 (ejercicio 1, apartados a y b).
    apunte:
      texto: cae en los tres — 4 de los 15 huecos
      tono: nota
    dominio: >-
      Colocas el CIR de cualquier barra de un mecanismo, sacas de él las
      velocidades angulares sin escribir una ecuación vectorial, y distingues
      la aceleración del punto de contacto de su velocidad, que es nula.
    falta:
      - >-
        ~~La velocidad de sucesión del CIR no tiene ningún ejercicio que la
        pida, y el examen del 30 de mayo de 2019 la pregunta como cuestión de
        un punto. El tema la explica con su fórmula y el simulador deja ver la
        base dibujándose, pero la colección de la asignatura no trae ni un
        problema que la calcule.~~ · **resuelto el 27 de septiembre de 2026**:
        la cuestión de mayo de 2019 está transcrita con su resolución y tiene
        escalón propio, y el tema la deduce ahora con la figura de las dos
        circunferencias de curvatura. La colección sigue sin un problema que
        la calcule con números.
      - >-
        ~~Y el hueco grande de esta ruta entera, que hasta hoy solo estaba
        dicho en un comentario del fichero: los tres exámenes sobre los que
        está medida —26 de junio de 2018, 30 de mayo de 2019 y 26 de junio de
        2019— son bilingües y aún no están transcritos, así que de momento
        **en seis de los siete bloques no hay ni un ejercicio de examen que
        hacer**: solo colección y ejemplos propios.~~ · **resuelto el 27 de
        septiembre de 2026**: los tres están transcritos, trece piezas de la
        columna en castellano, y cada bloque de la ruta tiene al menos un
        ejercicio de examen.
      - >-
        Lo que la transcripción no arregla: los tres exámenes son de hace
        siete años, que es la medición más antigua del sitio. Si el examen ha
        cambiado de forma desde 2019, esta ruta no se ha enterado.
    revisado: '2026-09-27'
    escalones:
      - id: el-cir-de-un-mecanismo
        titulo: El CIR, y las velocidades angulares que salen de él
        aprendes: >-
          A situar el centro instantáneo de cada barra y a leer de ahí todas
          las velocidades, que es como caen los apartados a de estos exámenes.
        teoria:
          tema: t08-movimiento-plano
          apartado: el-centro-instantáneo-de-rotación
          nota: >-
            El simulador del tema deja girar la manivela y ver el rastro que
            el centro va dejando, que es la base.
        ejercicios:
          - id: ejma8-la-biela-a-cuarenta-y-cinco-grados
            incrustado: true
          - id: ejma8-col83-las-angulares-de-bc-y-de-cd
            nota: >-
              Dos barras en cadena, que es el formato exacto del cuadrilátero
              articulado de junio de 2019.
          - id: ejma8-col85-la-deslizadera-d-de-la-barra-ad
          - id: exma1718-2cext-3-el-disco-que-rueda-sobre-la-barra-bc
            nota: >-
              Es el ejercicio 1 de junio de 2018, con el mismo enunciado que el
              8.9 de la colección: un disco, una barra que rueda sobre él y la
              velocidad de su centro vista desde la barra.
        dominio: >-
          Resuelves un mecanismo de tres barras con CIR y compruebas el
          resultado por el campo de velocidades.
      - id: la-velocidad-de-sucesion
        titulo: La base, la ruleta y lo rápido que avanza el CIR
        aprendes: >-
          A deducir con una figura la velocidad a la que el CIR recorre la
          base, que es la cuestión de un punto de mayo de 2019, y a comprobar
          su signo con un disco que rueda por el suelo.
        teoria:
          tema: t08-movimiento-plano
          apartado: la-base-y-la-ruleta
          nota: >-
            La deducción con las dos circunferencias de curvatura, con los
            signos del libro, y el simulador que dibuja la base.
        ejercicios:
          - id: exma1819-2c-2-la-velocidad-de-sucesion-del-cir
        dominio: >-
          Dibujas las dos circunferencias de curvatura en el CIR y sacas de
          ellas $v_s$ sin recordar la fórmula, con su signo.
      - id: las-aceleraciones-del-plano
        titulo: Las aceleraciones, y el punto de contacto que no está quieto
        aprendes: >-
          A aplicar el campo de aceleraciones en el plano y a no confundir
          velocidad nula con aceleración nula en el contacto de un disco.
        teoria:
          tema: t08-movimiento-plano
          apartado: los-tres-casos-de-rodadura
          nota: >-
            Los tres discos del libro, del que rueda por el suelo al que rueda
            sobre otro disco que gira, cada uno resuelto de dos maneras.
        ejercicios:
          - id: ejma8-la-aceleracion-del-punto-de-contacto
            incrustado: true
          - id: ejma8-col82-la-aceleracion-de-d-y-de-e
          - id: ejma8-col87-el-disco-en-el-plano-y-el-engranaje
            nota: >-
              Un disco que rueda unido a un engranaje, antes del caso del
              examen.
          - id: exma1819-2c-3-el-disco-que-rueda-sobre-otro-que-gira
            nota: >-
              La cuestión 3 de mayo de 2019: el tercer caso del libro, con la
              aceleración del punto de contacto y el CIR del disco pequeño.
        dominio: >-
          Calculas la aceleración del punto de contacto de un disco que rueda
          y sabes decir hacia dónde apunta.

  - id: cinematica
    titulo: Cinemática del sólido y movimiento relativo
    pide: >-
      Campos de velocidades y aceleraciones en el espacio, componentes
      intrínsecas, movimiento relativo con Coriolis y el contacto entre dos
      sólidos: rodar, pivotar y deslizar.
    porque: >-
      Tres de los quince huecos, y dos de ellos son cuestiones de teoría —el
      contacto entre sólidos en junio de 2018 y las componentes intrínsecas en
      junio de 2019—, que es la forma en que este tema cae: se pregunta la
      definición, no solo el número.
    invariante:
      anios: 3
      fuente: >-
        Contado sobre los tres exámenes transcritos: 26 de junio de
        2018 (cuestión 1), 30 de mayo de 2019 (ejercicio 1, el plano que gira)
        y 26 de junio de 2019 (cuestión 1).
    apunte:
      texto: cae en los tres, casi siempre como teoría
      tono: neutro
    dominio: >-
      Sabes explicar por escrito el movimiento entre dos sólidos en contacto y
      calcular la aceleración de un punto que se mueve sobre un sólido que
      gira, con su término de Coriolis.
    revisado: '2026-09-27'
    escalones:
      - id: rodar-pivotar-deslizar
        titulo: "Dos sólidos que se tocan: rodar, pivotar y deslizar"
        aprendes: >-
          A descomponer la velocidad angular relativa en su parte de rodadura
          y su parte de pivotamiento, que es la cuestión de junio de 2018.
        teoria:
          tema: t07-cinematica
          apartado: sólidos-en-contacto-rodar-pivotar-deslizar
        ejercicios:
          - id: ejma7-el-disco-que-rueda
            incrustado: true
          - id: ejma7-col75-el-disco-en-horquilla-con-dos-giros
            nota: >-
              Dos giros perpendiculares a la vez: es donde se ve que la
              velocidad angular se compone como un vector más.
          - id: exma1718-2cext-1-rodadura-y-pivotamiento-en-el-contacto
            nota: >-
              La cuestión 1 de junio de 2018, con la explicación que pide por
              escrito y la descomposición hecha con números.
        dominio: >-
          Separas rodadura y pivotamiento en un contacto cualquiera y sabes
          cuál de las dos se anula al rodar sin deslizar.
      - id: componentes-intrinsecas
        titulo: Las componentes intrínsecas y el radio de curvatura
        aprendes: >-
          A partir la aceleración en tangencial y normal y a sacar el radio de
          curvatura de una trayectoria dada, que es la cuestión de junio de
          2019.
        teoria:
          tema: t07-cinematica
          apartado: las-componentes-intrínsecas-de-la-aceleración
          nota: >-
            Hasta el 27 de septiembre de 2026 este escalón enlazaba al campo de
            aceleraciones del sólido, que no las explica: el tema no las tenía.
            Ahora tienen su apartado, con la deducción entera.
        ejercicios:
          - id: ejma7-col71-la-trayectoria-y-sus-componentes-intrinsecas
            incrustado: true
          - id: ejma7-col72-el-radio-de-curvatura-de-una-parabola-en-el-espacio
          - id: exma1819-2cext-1-las-componentes-intrinsecas-de-la-aceleracion
            nota: >-
              La cuestión 1 de junio de 2019, que nombra el tema sin verbo y se
              contesta con la deducción.
        dominio: >-
          Sacas ρ de una trayectoria en el espacio sin recordar la fórmula de
          memoria, partiendo de que la normal es lo que sobra de la total.
      - id: el-plano-que-gira
        titulo: Un punto que se mueve sobre algo que gira
        aprendes: >-
          A montar el movimiento relativo con sus tres términos cuando el
          sólido de arrastre es un plano o una varilla que gira.
        teoria:
          tema: t07-cinematica
          apartado: el-movimiento-relativo-de-un-punto
        ejercicios:
          - id: ejma7-col73-la-deslizadera-sobre-la-varilla-que-acelera
          - id: ejma7-col713-las-dos-barras-en-el-plano-que-gira
            nota: >-
              El enunciado de la colección del ejercicio 1 de mayo de 2019.
              Hasta el 27 de septiembre de 2026 ocupaba este sitio el 7.4, un
              cuadro que gira, porque se creía que el del examen no estaba en la
              colección; estaba, y es este.
          - id: exma1819-2c-4-las-dos-barras-en-el-plano-que-gira
            nota: >-
              El mismo problema como cayó en mayo de 2019, con su reparto de
              apartados y sin el sentido del giro de las barras, que el examen
              no da.
        dominio: >-
          Eliges los ejes de arrastre que simplifican el problema y justificas
          el signo del término de Coriolis.

  - id: dinamica-del-solido
    titulo: "Dinámica del sólido: momento angular y energía"
    pide: >-
      El momento angular de un sólido con su tensor de inercia y la energía
      cinética en el caso general, casi siempre pedidas como definición
      razonada.
    porque: >-
      Tres de los quince huecos, y las tres veces como teoría de peso: el
      momento angular respecto de G en mayo de 2019, la energía cinética de un
      sólido en junio de 2019 y el apartado a del cilindro en junio de 2018.
    invariante:
      anios: 3
      fuente: >-
        Contado sobre los tres exámenes transcritos: 26 de junio de
        2018 (ejercicio 2, apartados a y b), 30 de mayo de 2019 (cuestión 1) y
        26 de junio de 2019 (cuestión 2).
    apunte:
      texto: 3 de los 15 — y siempre hay que deducirlo
      tono: neutro
    dominio: >-
      Deduces por escrito H_G y la energía cinética de un sólido en el caso
      general, y sabes cuándo el tensor se reduce a un número.
    revisado: '2026-09-27'
    escalones:
      - id: el-tensor
        titulo: El momento angular con el tensor de inercia
        aprendes: >-
          A escribir H_G en ejes solidarios, con los productos de inercia en
          su sitio y su signo, y a derivarlo con la fórmula de Boure.
        teoria:
          tema: t10-dinamica-del-solido
          apartado: el-momento-angular-y-el-tensor-de-inercia
        ejercicios:
          - id: ejma10-col101-el-disco-de-la-horquilla
            incrustado: true
          - id: ejma10-col107-la-barra-en-el-plano-que-gira
          - id: exma1819-2c-1-el-momento-angular-respecto-de-g
            nota: >-
              La cuestión 1 de mayo de 2019: la deducción de H_G en el caso
              general, que es de donde sale el tensor.
        dominio: >-
          Montas el tensor de un sólido sencillo y explicas por qué H no es
          paralelo a ω salvo en las direcciones principales.
      - id: la-energia-del-solido
        titulo: La energía cinética de un sólido, caso general
        aprendes: >-
          A partir la energía en la del centro de gravedad más la de rotación,
          y a justificar de dónde sale esa separación.
        teoria:
          tema: t10-dinamica-del-solido
          apartado: la-energía-cinética-de-un-sólido
        ejercicios:
          - id: ejma10-la-energia-del-disco-que-rueda
            incrustado: true
          - id: ejma10-col102-las-dos-barras-y-el-muelle
          - id: exma1819-2cext-2-la-energia-cinetica-de-un-solido-rigido
            nota: >-
              La cuestión 2 de junio de 2019, con König deducido y una barra
              de números para comprobarlo.
        dominio: >-
          Escribes la energía cinética de un sólido cualquiera y sabes qué
          término desaparece cuando hay un punto fijo.

  - id: eje-fijo
    titulo: "Eje fijo: reacciones y equilibrado"
    pide: >-
      Las reacciones estáticas y dinámicas en los cojinetes de un sólido que
      gira, y las masas que hay que añadir en dos planos para equilibrarlo.
    porque: >-
      Dos de los quince huecos, pero los dos son **ejercicio largo**, no
      cuestión: el cilindro de junio de 2018 y la placa cuadrada de mayo de
      2019, que además pide el equilibrado con dos masas en dos planos.
    invariante:
      anios: 2
      fuente: >-
        Contado sobre los tres exámenes transcritos: 26 de junio de
        2018 (ejercicio 2, apartado c) y 30 de mayo de 2019 (ejercicio 2, con
        sus dos apartados).
    apunte:
      texto: solo 2 huecos — pero los dos de 3 puntos
      tono: nota
    dominio: >-
      Separas la reacción estática de la dinámica en cada cojinete y colocas
      las dos masas de equilibrado con su posición y su plano.
    revisado: '2026-09-27'
    escalones:
      - id: las-dinamicas
        titulo: Las reacciones que solo existen porque gira
        aprendes: >-
          A calcular la parte de la reacción que viene del giro, que crece con
          ω² y gira con el rotor.
        teoria:
          tema: t11-eje-fijo
          apartado: reacciones-estáticas-y-dinámicas
        ejercicios:
          - id: ejma11-el-rotor-con-un-milimetro
            incrustado: true
          - id: ejma11-col111-el-disco-inclinado-sobre-su-eje
            nota: >-
              Un disco montado torcido: las reacciones que solo aparecen al
              girar, sin nada descentrado.
          - id: exma1819-2c-5-la-placa-cuadrada-en-voladizo
            nota: >-
              Es el ejercicio 2 de mayo de 2019, palabra por palabra el 11.6 de
              la colección, que por eso ya no se enlaza aquí aparte: las
              reacciones y las dos masas que lo equilibran.
        dominio: >-
          Das las dos reacciones por separado y sabes cuál de las dos gira con
          el eje.
      - id: equilibrar
        titulo: Equilibrar con dos masas en dos planos
        aprendes: >-
          A imponer las cuatro condiciones del equilibrado —el centro de
          gravedad en el eje y los dos productos de inercia nulos— y a
          repartirlas entre dos planos.
        teoria:
          tema: t11-eje-fijo
          apartado: cómo-se-equilibra-añadiendo-masas
        ejercicios:
          - id: ejma11-el-par-que-no-se-ve
            incrustado: true
            nota: >-
              El caso que explica por qué no basta con el centro de gravedad
              en el eje.
          - id: ejma11-col115-la-muela-mal-montada
          - id: ejma11-col113-dos-cuadrados-en-planos-perpendiculares
        dominio: >-
          Colocas dos masas en dos planos dados y compruebas que anulan a la
          vez la resultante y el par.

  - id: dinamica-plana
    titulo: Dinámica del movimiento plano
    pide: >-
      Aceleraciones angulares y reacciones de mecanismos con masa, y problemas
      de energía con un par constante aplicado.
    porque: >-
      Dos de los quince huecos, los dos en junio de 2019 y los dos de 3,5
      puntos: el cuadrilátero articulado con su barra pesada y el mecanismo de
      dos barras al que se le aplica un par constante desde el reposo.
    invariante:
      anios: 1
      fuente: >-
        Contado sobre los tres exámenes transcritos: 26 de junio de
        2019 (ejercicio 1 apartado c, y ejercicio 2 entero). En los otros dos
        no aparece.
    apunte:
      texto: 7 de los 10 puntos de junio de 2019
      tono: nota
    dominio: >-
      Escribes las tres ecuaciones del movimiento plano de cada barra, tomas
      momentos donde te conviene sin olvidar el momento de M·a_G, y sabes
      cuándo sale más barato el teorema de la energía.
    revisado: '2026-09-27'
    escalones:
      - id: las-tres-ecuaciones
        titulo: Las tres ecuaciones, y dónde tomar momentos
        aprendes: >-
          A resolver un mecanismo con masa planteando ΣF = M·a_G y ΣM = I·α, y
          a tomar momentos en el punto que elimina las incógnitas.
        teoria:
          tema: t12-dinamica-plana
          apartado: tomar-momentos-donde-están-las-incógnitas
        ejercicios:
          - id: ejma12-el-cilindro-que-rueda-por-el-plano
            incrustado: true
          - id: ejma12-col122-la-barra-acb-guiada-por-dos-bloques
          - id: ejma12-col1210-el-entramado-de-tres-barras
            nota: >-
              Tres barras con sus reacciones, antes del cuadrilátero del
              examen.
          - id: exma1819-2cext-3-el-cuadrilatero-articulado-y-sus-reacciones
            nota: >-
              El ejercicio 1 de junio de 2019: el cuadrilátero con la barra
              pesada, sus angulares y las reacciones estáticas y dinámicas en B
              y en C. Da un dato de más, y la resolución lo dice.
        dominio: >-
          Ante un mecanismo con dos barras sabes en qué punto tomar momentos
          para no arrastrar reacciones desconocidas.
      - id: el-par-y-la-energia
        titulo: El par constante, resuelto por energía
        aprendes: >-
          A usar el teorema de la energía cuando el enunciado da dos
          posiciones y un par constante, que es el ejercicio 2 de junio de
          2019.
        teoria:
          tema: t12-dinamica-plana
          apartado: el-método-de-la-energía
        ejercicios:
          - id: ejma12-col125-la-barra-con-muelle-en-dos-ranuras
          - id: ejma12-col1220-el-disco-la-barra-y-el-resorte
            nota: >-
              Con muelle y disco: la energía es aquí mucho más corta que las
              tres ecuaciones.
          - id: exma1819-2cext-4-las-dos-barras-y-la-deslizadera
            nota: >-
              El ejercicio 2 de junio de 2019: el par constante que hace falta
              para llegar con una velocidad dada, con la energía cinética
              sacada del CIR.
        dominio: >-
          Decides, mirando lo que pide el enunciado, si te conviene energía o
          las tres ecuaciones, y lo justificas.

  - id: teoremas
    titulo: Los teoremas de la dinámica, que es la base de los dos anteriores
    pide: >-
      El trabajo de una fuerza y la energía cinética de una partícula,
      deducidos, y los tres teoremas con sus condiciones de conservación.
    porque: >-
      Un solo hueco de los quince —la cuestión 2 de junio de 2018—, pero va
      aquí y no fuera porque los bloques de dinámica del sólido y de
      movimiento plano son este mismo teorema aplicado a un sólido: sin él, se
      estudian de memoria.
    invariante:
      anios: 1
      fuente: >-
        Contado sobre los tres exámenes transcritos: 26 de junio de
        2018 (cuestión 2). Su contenido reaparece dentro de los ejercicios de
        energía de los otros dos.
    apunte:
      texto: 1 hueco — y está dentro de los otros
      tono: marco
    dominio: >-
      Deduces el teorema de la energía para una partícula y sabes decir, ante
      un problema, cuál de las tres magnitudes se conserva y por qué.
    revisado: '2026-09-27'
    escalones:
      - id: los-tres-teoremas
        titulo: Los tres teoremas y cuándo se conserva cada magnitud
        aprendes: >-
          A elegir entre momento lineal, momento angular y energía según lo
          que el enunciado dé y lo que pida.
        teoria:
          tema: t09-teoremas-de-la-dinamica
          apartado: los-tres-teoremas
        ejercicios:
          - id: ejma9-la-fuerza-central
            incrustado: true
            nota: >-
              Una fuerza central: el momento angular se conserva y la energía
              no, que es la pareja que más se confunde.
          - id: ejma9-col92-tres-particulas-y-sus-magnitudes
          - id: ejma9-col913-los-banistas-que-saltan-de-la-barca
            nota: >-
              El momento lineal que se conserva porque no hay fuerza horizontal
              exterior, y por qué el orden de los saltos cambia la velocidad
              final aunque se conserve.
        dominio: >-
          Justificas la conservación con la fuerza que la produce, no con la
          costumbre.
      - id: el-trabajo-y-la-energia
        titulo: El trabajo de una fuerza y la energía cinética
        aprendes: >-
          A deducir W = ΔT para una partícula, que es literalmente lo que pide
          la cuestión de junio de 2018.
        teoria:
          tema: t09-teoremas-de-la-dinamica
          apartado: los-tres-teoremas
          nota: >-
            La deducción está en el teorema de la energía; las definiciones
            de trabajo y de energía cinética, en «Las magnitudes», justo antes.
        ejercicios:
          - id: ejma9-el-bloque-y-el-muelle
            incrustado: true
          - id: ejma9-col95-el-martillo-de-pilotes
          - id: exma1718-2cext-2-el-trabajo-de-una-fuerza-y-la-energia-cinetica
            nota: >-
              La cuestión 2 de junio de 2018, la deducción entera de W = ΔT
              para una partícula.
        dominio: >-
          Escribes la deducción entera sin copiarla, partiendo de la segunda
          ley y del producto escalar por el desplazamiento.

  - id: simulacro
    titulo: El simulacro, con un examen entero
    apunte:
      texto: 'a reloj, y sin la solución al lado'
      tono: marco
    pide: >-
      Dos cuestiones de teoría y dos ejercicios, o tres cuestiones y dos
      ejercicios, de una sentada.
    porque: >-
      Los bloques de arriba entrenan cada hueco por separado, y el examen no
      va por separado: va contra el reloj y salta de la cinemática a la
      dinámica en la misma hoja. Son las tres únicas convocatorias del bloque
      2 que hay, y las tres están enteras, sin nada fuera. Cada página de
      examen trae su modo simulacro con reloj, a 30 minutos por ejercicio, que
      es la base que dio Ionan.
    dominio: >-
      Hacer una convocatoria completa de una sentada y sin abrir la
      resolución, y después contar cuántos apartados habrías dado por buenos
      sin serlo.
    material:
      - tipo: examen
        curso: '2018-2019'
        convocatoria: extraordinaria-segundo-cuatrimestre
        nota: >-
          Junio de 2019, la más reciente: la teoría de componentes intrínsecas
          y de energía, y los dos ejercicios de 3,5 puntos de dinámica plana.
          Es la que conviene hacer primero.
      - tipo: examen
        curso: '2018-2019'
        convocatoria: segundo-cuatrimestre
        nota: >-
          Mayo de 2019, la más completa: tres cuestiones, el plano que gira y
          la placa que hay que equilibrar.
      - tipo: examen
        curso: '2017-2018'
        convocatoria: extraordinaria-segundo-cuatrimestre
        nota: >-
          Junio de 2018: el contacto entre sólidos, el trabajo de una fuerza,
          el disco que rueda sobre una barra y el cilindro inclinado de 4
          puntos.
    falta:
      - >-
        Las tres son de 2018 y 2019. El temario de la guía de 2025/26 es el
        mismo, pero el examen de hoy puede tener otra forma, y un simulacro con
        siete años no lo avisa.
    revisado: '2026-09-27'

  - id: formulario
    titulo: Lo que hay que llevar sabido
    apunte:
      texto: 'en el examen, solo calculadora'
      tono: marco
    pide: >-
      Los campos de velocidades y aceleraciones, el CIR y su velocidad de
      sucesión, el momento angular con el tensor, König, la derivada en ejes
      que giran y las tres ecuaciones del movimiento plano, de memoria.
    porque: >-
      La guía no deja entrar más que la calculadora, así que todo esto se
      lleva en la cabeza, y casi nada se puede deducir en el momento sin
      perder el tiempo de un apartado. Va el último porque es repaso, no
      aprendizaje: es el bloque del rato de antes de entrar.

      **Los doce temas están juntos en una sola página**, hecha para
      imprimirse: [el formulario de Mecánica Aplicada](/road-to-ingenieria/mecanica-aplicada/formulario/).
      No hay nada escrito ahí que no esté en su tema: se lee de ellos.
    dominio: >-
      Escribir de memoria y en papel los dos campos, la aceleración de
      Coriolis, H_G con el tensor, la energía de König y las tres ecuaciones
      del plano, sin consultar nada. Si tienes que mirar una sola vez,
      todavía no.
    material:
      - tipo: teoria
        tema: t07-cinematica
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          Las componentes intrínsecas, los dos campos y el movimiento relativo
          con Coriolis.
      - tipo: teoria
        tema: t08-movimiento-plano
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          El CIR, la velocidad de sucesión y la aceleración del punto de
          contacto.
      - tipo: teoria
        tema: t10-dinamica-del-solido
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          El tensor, König y la derivada del momento angular en ejes que giran.
      - tipo: teoria
        tema: t12-dinamica-plana
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          Las tres ecuaciones del plano y cuándo sale más barata la energía.
    revisado: '2026-09-27'
