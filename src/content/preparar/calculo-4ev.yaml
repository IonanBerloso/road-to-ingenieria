asignatura: calculo
evaluacion: cuarta
titulo: Preparar la cuarta evaluación
lede: >-
  Los temas 6 y 7, el 10 % de la nota y el arranque del segundo cuatrimestre.
  Cinco cursos seguidos con la misma forma: el ejercicio 1 es siempre el
  gradiente aplicado, y los otros dos son integrales múltiples donde dibujar
  vale tanto como calcular.
temas:
  - t06-varias-variables
  - t07-integral-multiple
medidoSobre: 5
criterioDeOrden: >-
  Por lo que rinde. El gradiente va primero porque es el ejercicio 1 de los
  cinco cursos leídos, sin excepción, y porque contesta él solo las tres
  preguntas que el examen hace con distintos disfraces. Después la integral
  múltiple, que ocupa los otros dos ejercicios y donde COMP4 vale la mitad de
  la nota. El suelo —parciales y límites— va antes que los dos, porque no se
  examina solo y sin él los otros no se terminan.

bloques:
  # ─────────────────────────────────────────────────────────────────────
  - id: suelo
    titulo: El suelo, que no se examina solo
    pide: >-
      Nada por sí mismo. Es lo que los tres ejercicios dan por sabido: derivar
      parcialmente sin equivocarse de variable, y saber cuándo un límite en el
      plano no existe.
    porque: >-
      En los cinco cursos leídos no ha caído un ejercicio que sea «calcula
      estas derivadas parciales». Pero todo el ejercicio 1 se apoya en ellas, y
      una parcial mal hecha arrastra el gradiente, la derivada direccional y el
      plano tangente. Es corto y va primero por eso.
    dominio: >-
      Derivar parcialmente una función de dos variables sin dudar cuál se
      congela, y demostrar que un límite no existe encontrando dos caminos que
      discrepan. Los dos, sin pensarlo.
    escalones:
      - id: parciales
        titulo: Derivar con la otra variable congelada
        aprendes: >-
          Calcular derivadas parciales de primer y segundo orden tratando la
          otra variable como si fuera un número.
        dominio: >-
          Que ante $x^{3}y^{2}$ no dudes ni un segundo de cuál se deriva y cuál
          se queda quieta, y que sepas que las cruzadas coinciden si son
          continuas.
        teoria:
          tema: t06-varias-variables
          apartado: las-derivadas-parciales-mirar-en-una-sola-dirección
          nota: >-
            No hay regla nueva: son las del tema 3 con una letra haciendo de
            constante. Lo único que se añade es Schwarz, y su hipótesis.
        ejercicios:
          - id: ej-parcial-con-y-congelada
            incrustado: true
            nota: >-
              Empieza aquí. Una función corta y las dos parciales, para ver la
              asimetría: el término $4y$ desaparece en una y aporta en la otra.

      - id: limites
        titulo: Los límites, que ahora se niegan por caminos
        aprendes: >-
          Demostrar que un límite en dos variables no existe encontrando dos
          caminos por los que sale distinto.
        dominio: >-
          Saber que las rectas sirven para **negar** y nunca para afirmar, y
          escribir la demostración con dos valores numéricos concretos, no con
          una fórmula que lleve la $m$ dentro.
        teoria:
          tema: t06-varias-variables
          apartado: el-límite-ahora-importa-por-dónde-te-acerques
          nota: >-
            Es la misma estructura lógica que las dos subsucesiones del tema 2.
            Si aquello lo tienes, esto ya lo sabes.
        ejercicios:
          - id: limite-por-caminos
            incrustado: true
            nota: >-
              El caso de libro, y cayó en 2017-2018. Si al sustituir $y=mx$
              queda la $m$, has terminado.

  # ─────────────────────────────────────────────────────────────────────
  - id: gradiente
    titulo: El gradiente aplicado
    pide: >-
      Dada una función que modela algo físico —la altura de un monte, la
      temperatura de una placa, la contaminación del mar—, decir hacia dónde
      crece más rápido, hacia dónde no cambia, y cuánto cambia en una dirección
      dada. Y dibujarlo.
    porque: >-
      Es el ejercicio 1 de los cinco cursos leídos, sin una sola excepción, y
      el único de la evaluación que lleva puntos de COMP1 explícitos. Vale 10
      de los 30 puntos, y las preguntas se repiten literalmente año tras año
      con otro decorado.
    invariante:
      anios: 5
      fuente: >-
        Ejercicio 1 de las cuartas evaluaciones de 2021-2022 (contaminación en
        el océano), 2022-2023 (deducir la función a partir de dos
        direccionales), 2023-2024 (temperatura de una habitación), 2024-2025
        (curva de nivel dada) y 2025-2026 (mapa del Mauna Kea). Los cinco
        preguntan lo mismo con distinto disfraz.
    dominio: >-
      Coger un enunciado nuevo con una función de dos variables y contestar en
      menos de cinco minutos las cuatro preguntas de siempre: dirección de
      máximo cambio, dirección de cambio nulo, velocidad hacia un vector dado,
      y el dibujo. Y no equivocarte nunca al normalizar.
    escalones:
      - id: las-tres-preguntas
        titulo: Las tres preguntas que contesta el gradiente
        aprendes: >-
          Calcular el gradiente y leer en él la dirección de máximo crecimiento,
          la de cambio nulo y la velocidad máxima.
        dominio: >-
          Que ante «¿hacia dónde crece más?» escribas $\nabla f$ sin pensar, y
          que la perpendicular la saques cambiando el orden y un signo.
        teoria:
          tema: t06-varias-variables
          apartado: el-gradiente-contesta-las-tres-preguntas
          nota: >-
            El gradiente es perpendicular a la curva de nivel. De ese único
            hecho salen las otras dos respuestas.
        ejercicios:
          - id: ej-gradiente-tres-preguntas
            incrustado: true
            nota: >-
              Empieza aquí. Una función sencilla y las tres preguntas de golpe,
              con números que salen exactos.
          - id: cucaracha-y-el-gas
            nota: >-
              Y el mismo esquema con decorado: máximo descenso, curva de nivel
              y punto de mayor concentración. Cayó en 2019-2020.

      - id: direccional
        titulo: La derivada direccional, y el vector que se normaliza
        aprendes: >-
          Calcular cuánto cambia la función en una dirección dada, normalizando
          el vector antes del producto escalar.
        dominio: >-
          Normalizar siempre, y comprobar que el resultado no supera al módulo
          del gradiente. Ese control de un segundo caza el error más caro del
          tema.
        teoria:
          tema: t06-varias-variables
          apartado: el-gradiente-contesta-las-tres-preguntas
          nota: >-
            Y ojo con «desde $P$ hasta $Q$»: el vector es $Q-P$, y restarlo al
            revés cambia calentarse por enfriarse.
        ejercicios:
          - id: ej-direccional-sin-normalizar
            incrustado: true
            nota: >-
              Existe para cazar el error de no normalizar: el distractor es
              exactamente cinco veces la respuesta buena.
          - id: banista-en-el-lago
            nota: >-
              El caso aplicado, de 2017-2018. Y fíjate en que la respuesta a
              «se enfría o se calienta» es **el signo**, y hay que escribirla.

      - id: al-reves
        titulo: Deducir el gradiente a partir de datos
        aprendes: >-
          Montar un sistema de dos ecuaciones cuando el enunciado da dos
          derivadas direccionales, o un máximo y su dirección.
        dominio: >-
          Reconocer que el gradiente son dos incógnitas y que cada dato es una
          ecuación. Y saber los dos atajos: el máximo es el módulo, y su
          dirección es la del gradiente.
        teoria:
          tema: t06-varias-variables
          apartado: y-al-revés-deducir-el-gradiente-a-partir-de-datos
        ejercicios:
          - id: monte-con-dos-direccionales
            nota: >-
              Dos direccionales, dos ecuaciones. De 2015-2016.
          - id: placa-con-dos-ritmos
            nota: >-
              El mismo esquema con vectores no unitarios, que es lo que lo hace
              difícil. Fíjate en que los datos traen raíces a propósito.
          - id: maximo-paralelo-al-eje
            nota: >-
              Y la versión con parámetros. Tiene **dos** soluciones y hay que
              dar las dos.
          - id: perpendicular-a-la-curva-de-nivel
            nota: >-
              Corto, y es una frase disfrazada de cuenta. De 2018-2019.

      - id: plano-tangente
        titulo: El plano tangente, y aproximar sin calculadora
        aprendes: >-
          Escribir el plano tangente en un punto y usarlo para aproximar valores
          que no se pueden calcular a mano.
        dominio: >-
          Escribir el plano de memoria leyéndolo como una frase, y no
          equivocarte con el signo de los incrementos al evaluar.
        teoria:
          tema: t06-varias-variables
          apartado: el-plano-tangente-y-aproximar-sin-calculadora
          nota: >-
            En el examen de 2022-2023 el apartado b) era exactamente esto, y en
            el de 2019-2020 se daba el plano y se pedía la velocidad de cambio.
        ejercicios:
          - id: aproximar-con-la-diferencial
            incrustado: true
            nota: >-
              Los dos apartados juntos: el plano y la aproximación. El
              distractor es el error de signo en el incremento.

  # ─────────────────────────────────────────────────────────────────────
  - id: integral-multiple
    titulo: La integral múltiple, planteada y dibujada
    pide: >-
      Dibujar un recinto o un sólido y escribir la integral que le corresponde:
      cambiar el orden de integración, calcular un volumen, una masa o un
      centro de gravedad.
    porque: >-
      Ocupa los ejercicios 2 y 3 de los cinco cursos leídos, o sea 20 de los 30
      puntos. Y el reparto dice dónde está la nota: COMP2 entre 5 y 7 puntos,
      COMP4 entre 3 y 5. **La mitad del ejercicio es dibujar el recinto y
      escribir los límites**, no integrar.
    invariante:
      anios: 5
      fuente: >-
        Ejercicios 2 y 3 de las cuartas evaluaciones de 2021-2022 a 2025-2026.
        Todos empiezan con «dibujar el dominio de integración» o «dibujar el
        sólido», y en 2023-2024 el apartado b) del ejercicio 3 pedía
        literalmente «plantear (funciones y límites de integración)» sin
        calcular.
    dominio: >-
      Ante un recinto descrito con desigualdades, dibujarlo y escribir la
      integral en cualquiera de los órdenes en menos de cinco minutos. Y elegir
      las coordenadas mirando la forma del recinto, no el integrando.
    escalones:
      - id: leer-el-recinto
        titulo: Leer los límites de un recinto
        aprendes: >-
          Traducir un dibujo en límites de integración, sabiendo que los de
          dentro llevan la otra variable y los de fuera son números.
        dominio: >-
          Que el control «si me sale una letra en el límite exterior, está mal»
          te salga solo.
        teoria:
          tema: t07-integral-multiple
          apartado: el-recinto-manda-y-hay-que-dibujarlo
        ejercicios:
          - id: ej-doble-sobre-rectangulo
            incrustado: true
            nota: >-
              El caso más fácil, con los cuatro límites constantes. Sirve para
              ver que una doble son dos integrales encadenadas y nada más.
          - id: ej-recinto-y-limites
            incrustado: true
            nota: >-
              Y ahora con un recinto de verdad. La pieza trampa es justo el
              error de dejar una letra fuera.

      - id: cambiar-el-orden
        titulo: Cambiar el orden de integración
        aprendes: >-
          Reescribir una integral doble con el otro orden, releyendo el dibujo
          con la otra pregunta.
        dominio: >-
          Saber que no se hace con álgebra sino con el dibujo, y reconocer
          cuándo el cambio obliga a **partir el recinto en dos**.
        teoria:
          tema: t07-integral-multiple
          apartado: cambiar-el-orden-de-integración
          nota: >-
            Muchas veces la integral original es imposible y la cambiada sale
            en dos líneas. Ese es el motivo de que se pida.
        ejercicios:
          - id: invertir-el-orden
            nota: >-
              De 2017-2018, y es el caso completo: hay que partir el recinto
              porque la tapa cambia en $x=1$.

      - id: coordenadas
        titulo: Elegir las coordenadas por la forma del recinto
        aprendes: >-
          Decidir entre cartesianas, polares, cilíndricas y esféricas mirando el
          sólido, y aplicar el jacobiano que toca.
        dominio: >-
          No olvidar nunca el $\rho$, y tener a mano el control que lo delata:
          si una cuenta de áreas te devuelve algo que parece un perímetro, el
          jacobiano se ha quedado por el camino.
        teoria:
          tema: t07-integral-multiple
          apartado: cuando-el-recinto-es-redondo-polares
        ejercicios:
          - id: ej-polares-primera
            incrustado: true
            nota: >-
              El área de un círculo, que sabes cuánto vale. Por eso sirve para
              comprobar el jacobiano.
          - id: centro-de-gravedad-elipse
            nota: >-
              Polares generalizadas sobre un cuarto de elipse, y el centro de
              gravedad. De 2017-2018.

      - id: solidos
        titulo: Sólidos, volúmenes y centros de gravedad
        aprendes: >-
          Plantear una integral triple sobre un sólido descrito con
          desigualdades, y calcular volumen, masa o centro de gravedad.
        dominio: >-
          Dibujar el sólido antes de escribir nada, y buscar la simetría antes
          de integrar: una coordenada del centro de gravedad puede salir sin
          hacer ninguna cuenta.
        teoria:
          tema: t07-integral-multiple
          apartado: para-qué-sirve-todo-esto
          nota: >-
            Las cuatro aplicaciones comparten esqueleto: cambia lo que va
            dentro de la integral, no la integral.
        ejercicios:
          - id: solido-con-tres-ordenes
            nota: >-
              De 2014-2015. El apartado b) dice «sin hacer el cálculo»: lo que
              se corrige es el planteamiento, y un orden obliga a partir el
              sólido en dos.
    falta:
      - >-
        Los quince exámenes de cuarta evaluación no están transcritos todavía.
        Los ejercicios de esta ruta salen del boletín de problemas
        complementarios, que sí trae etiquetado el examen del que vino cada uno,
        pero no puedes hacer aquí un examen entero como en las tres primeras
        evaluaciones.
      - >-
        Los recuentos de esta ruta están medidos sobre **cinco** cursos, de
        2021-2022 a 2025-2026, y no sobre once como en las evaluaciones del
        primer cuatrimestre. El motivo es que el formato cambió: la «cuarta
        evaluación» de 2015-2016 era una recuperación del primer cuatrimestre
        —complejos y sucesiones— y no un examen de los temas 6 y 7. Hasta no
        leer año por año dónde está la frontera, contar once sería mentir.
      - >-
        No hay cronómetro en la página ni forma de guardar lo que has hecho: el
        sitio es estático. Lo que sí se guarda en tu navegador es qué escalones
        has marcado como dominados.
