asignatura: calculo
evaluacion: cuarta
titulo: Preparar la cuarta evaluación
lede: >-
  Los temas 6 y 7, el 10 % de la nota y el arranque del segundo cuatrimestre.
  Once cursos leídos y la misma forma en casi todos: se abre con el gradiente
  aplicado —ocho de once— y el resto son integrales múltiples, donde dibujar
  vale tanto como calcular.
temas:
  - t06-varias-variables
  - t07-integral-multiple
medidoSobre: 11
criterioDeOrden: >-
  Por lo que rinde. El gradiente va primero porque abre el examen en ocho de
  los once cursos leídos, porque es el único ejercicio de la evaluación que
  lleva puntos de COMP1 en todas sus apariciones, y porque contesta él solo
  las tres preguntas que el examen hace con distintos disfraces. Después la
  integral múltiple, que se lleva dieciocho de los veintinueve ejercicios y
  donde una parte grande de la nota es dibujar el recinto y escribir los
  límites, no calcular la primitiva. El suelo —parciales y límites— va antes
  que los dos, porque no se examina solo y sin él los otros no se terminan.


  **Cómo se han determinado los huecos de esta ruta.** Un bloque sin `falta[]`
  no es un bloque sin mirar: el 29 de agosto de 2026 se pasaron los sesenta y
  dos bloques de las siete rutas por tres criterios medidos —si su tema tiene
  pocos ejemplos de entrada para lo que el examen le exige, si sus ejercicios
  usan una herramienta que la prosa de ese tema no nombra, y si algún escalón
  suyo empieza directamente en un ejercicio de examen— y solo se declara lo que
  sale de alguno de ellos. Lo que no aparece aquí es porque ninguno de los tres
  lo señaló.
bloques:
  # ─────────────────────────────────────────────────────────────────────
  - id: suelo
    titulo: El suelo, que no se examina solo
    pide: >-
      Nada por sí mismo. Es lo que los tres ejercicios dan por sabido: derivar
      parcialmente sin equivocarse de variable, y saber cuándo un límite en el
      plano no existe.
    porque: >-
      En los once cursos leídos no ha caído un ejercicio que sea «calcula
      estas derivadas parciales». Pero todo el ejercicio 1 se apoya en ellas, y
      una parcial mal hecha arrastra el gradiente, la derivada direccional y el
      plano tangente. Es corto y va primero por eso.
    dominio: >-
      Derivar parcialmente una función de dos variables sin dudar cuál se
      congela, y demostrar que un límite no existe encontrando dos caminos que
      discrepan. Los dos, sin pensarlo.
    escalones:
      - id: parciales
        titulo: Derivar con la otra variable congelada
        aprendes: >-
          Calcular derivadas parciales de primer y segundo orden tratando la
          otra variable como si fuera un número.
        dominio: >-
          Que ante $x^{3}y^{2}$ no dudes ni un segundo de cuál se deriva y cuál
          se queda quieta, y que sepas que las cruzadas coinciden si son
          continuas.
        teoria:
          tema: t06-varias-variables
          apartado: las-derivadas-parciales-mirar-en-una-sola-dirección
          nota: >-
            No hay regla nueva: son las del tema 3 con una letra haciendo de
            constante. Lo único que se añade es Schwarz, y su hipótesis.
        ejercicios:
          - id: ej-parcial-con-y-congelada
            incrustado: true
            nota: >-
              Empieza aquí. Una función corta y las dos parciales, para ver la
              asimetría: el término $4y$ desaparece en una y aporta en la otra.
          - id: ex1516-4ev-2-dos-gradientes-encadenados
            nota: >-
              De 2015-2016, y es el suelo llevado al límite: un gradiente que
              sale del teorema fundamental del Cálculo y otro con la regla de la
              cadena. Nada de geometría, solo derivar bien.

      - id: limites
        titulo: Los límites, que ahora se niegan por caminos
        aprendes: >-
          Demostrar que un límite en dos variables no existe encontrando dos
          caminos por los que sale distinto.
        dominio: >-
          Saber que las rectas sirven para **negar** y nunca para afirmar, y
          escribir la demostración con dos valores numéricos concretos, no con
          una fórmula que lleve la $m$ dentro.
        teoria:
          tema: t06-varias-variables
          apartado: el-límite-ahora-importa-por-dónde-te-acerques
          nota: >-
            Es la misma estructura lógica que las dos subsucesiones del tema 2.
            Si aquello lo tienes, esto ya lo sabes.
        ejercicios:
          - id: limite-por-caminos
            incrustado: true
            nota: >-
              El caso de libro, y cayó en 2017-2018. Si al sustituir $y=mx$
              queda la $m$, has terminado.
          - id: ex1718-4ev-1-limite-y-direccional
            nota: >-
              El examen entero de 2017-2018, con el límite en el apartado a) y
              una direccional en el b). Es el único de los veintinueve que pide
              un límite, y por eso este escalón es corto.

  # ─────────────────────────────────────────────────────────────────────
  - id: gradiente
    titulo: El gradiente aplicado
    pide: >-
      Dada una función que modela algo físico —la altura de un monte, la
      temperatura de una placa, la contaminación del mar—, decir hacia dónde
      crece más rápido, hacia dónde no cambia, y cuánto cambia en una dirección
      dada. Y dibujarlo.
    porque: >-
      Abre el examen en ocho de los once cursos leídos, y cae en diez de los
      veintinueve ejercicios. Es además el único sitio de la evaluación donde
      COMP1 aparece siempre: los diez ejercicios de varias variables llevan
      puntos de reconocimiento —entre 0,5 y 3—, y de los dieciocho de integral
      múltiple solo cinco. Vale diez puntos, que en un examen de tres
      ejercicios es un tercio de la nota y en uno de dos, la mitad. Y las
      preguntas se repiten año tras año con otro decorado.
    invariante:
      anios: 10
      fuente: >-
        Ejercicio 1 de las cuartas evaluaciones de 2016-2017 a 2018-2019 y de
        2021-2022 a 2025-2026 —contaminación en el océano, deducir la función
        a partir de dos direccionales, temperatura de una habitación, curva de
        nivel dada, mapa del Mauna Kea—, y ejercicio 2 en 2014-2015 y
        2015-2016. Todos preguntan lo mismo con distinto disfraz. Diez de los
        once cursos, no once: **2020-2021 es el único que no lleva ni un
        ejercicio de varias variables**, y abre con una integral.
    dominio: >-
      Coger un enunciado nuevo con una función de dos variables y contestar en
      menos de cinco minutos las cuatro preguntas de siempre: dirección de
      máximo cambio, dirección de cambio nulo, velocidad hacia un vector dado,
      y el dibujo. Y no equivocarte nunca al normalizar.
    escalones:
      - id: las-tres-preguntas
        titulo: Las tres preguntas que contesta el gradiente
        aprendes: >-
          Calcular el gradiente y leer en él la dirección de máximo crecimiento,
          la de cambio nulo y la velocidad máxima.
        dominio: >-
          Que ante «¿hacia dónde crece más?» escribas $\nabla f$ sin pensar, y
          que la perpendicular la saques cambiando el orden y un signo.
        teoria:
          tema: t06-varias-variables
          apartado: el-gradiente-contesta-las-tres-preguntas
          nota: >-
            El gradiente es perpendicular a la curva de nivel. De ese único
            hecho salen las otras dos respuestas.
        ejercicios:
          - id: ej-gradiente-tres-preguntas
            incrustado: true
            nota: >-
              Empieza aquí. Una función sencilla y las tres preguntas de golpe,
              con números que salen exactos.
          - id: cucaracha-y-el-gas
            nota: >-
              Y el mismo esquema con decorado: máximo descenso, curva de nivel
              y punto de mayor concentración. Cayó en 2019-2020.
          - id: ex2324-4ev-1-temperatura-de-la-habitacion
            nota: >-
              De 2023-2024. Las tres preguntas con el decorado más limpio de
              todos: una habitación y un termómetro.
          - id: ex2526-4ev-1-el-mapa-del-mauna-kea
            nota: >-
              De 2025-2026, el más reciente, y el más difícil de los diez:
              **no te dan la función**. Solo un mapa de curvas de nivel, y hay
              que contestar leyendo el dibujo.

      - id: direccional
        titulo: La derivada direccional, y el vector que se normaliza
        aprendes: >-
          Calcular cuánto cambia la función en una dirección dada, normalizando
          el vector antes del producto escalar.
        dominio: >-
          Normalizar siempre, y comprobar que el resultado no supera al módulo
          del gradiente. Ese control de un segundo caza el error más caro del
          tema.
        teoria:
          tema: t06-varias-variables
          apartado: el-gradiente-contesta-las-tres-preguntas
          nota: >-
            Y ojo con «desde $P$ hasta $Q$»: el vector es $Q-P$, y restarlo al
            revés cambia calentarse por enfriarse.
        ejercicios:
          - id: ej-direccional-sin-normalizar
            incrustado: true
            nota: >-
              Existe para cazar el error de no normalizar: el distractor es
              exactamente cinco veces la respuesta buena.
          - id: banista-en-el-lago
            nota: >-
              El caso aplicado, de 2017-2018. Y fíjate en que la respuesta a
              «se enfría o se calienta» es **el signo**, y hay que escribirla.
          - id: ex2122-4ev-1-vertido-en-el-oceano
            nota: >-
              De 2021-2022, con una gaussiana por función. La exponencial
              asusta y no debería: al derivar sale ella misma multiplicada por
              algo, y en el punto que piden se simplifica.
          - id: ex1415-4ev-2-donde-la-derivada-maxima-vale-cuatro
            nota: >-
              De 2014-2015, y es la direccional del revés: te dan **cuánto**
              vale la máxima y hay que encontrar dónde. Sale una elipse, y hay
              que dibujarla.

      - id: al-reves
        titulo: Deducir el gradiente a partir de datos
        aprendes: >-
          Montar un sistema de dos ecuaciones cuando el enunciado da dos
          derivadas direccionales, o un máximo y su dirección.
        dominio: >-
          Reconocer que el gradiente son dos incógnitas y que cada dato es una
          ecuación. Y saber los dos atajos: el máximo es el módulo, y su
          dirección es la del gradiente.
        teoria:
          tema: t06-varias-variables
          apartado: y-al-revés-deducir-el-gradiente-a-partir-de-datos
        ejercicios:
          - id: monte-con-dos-direccionales
            nota: >-
              Dos direccionales, dos ecuaciones. De 2015-2016.
          - id: placa-con-dos-ritmos
            nota: >-
              El mismo esquema con vectores no unitarios, que es lo que lo hace
              difícil. Fíjate en que los datos traen raíces a propósito.
          - id: maximo-paralelo-al-eje
            nota: >-
              Y la versión con parámetros. Tiene **dos** soluciones y hay que
              dar las dos.
          - id: perpendicular-a-la-curva-de-nivel
            nota: >-
              Corto, y es una frase disfrazada de cuenta. De 2018-2019.
          - id: ex1617-4ev-1-montana-con-dos-pendientes
            nota: >-
              De 2016-2017, y es el sistema de dos ecuaciones en su forma más
              desnuda: dos direcciones, dos pendientes, dos incógnitas.
          - id: ex2425-4ev-1-curva-de-nivel-dada
            nota: >-
              De 2024-2025, y aquí el dato es **la curva de nivel**, no una
              direccional. De ella sale la dirección de cambio nulo, y el
              gradiente es su perpendicular.
          - id: ex1819-4ev-1-perpendicular-en-el-origen
            nota: >-
              De 2018-2019. El mismo ejercicio que el anterior de la lista, con
              la función dada: sirve para comprobar que los dos caminos —tener
              la función y tener la curva— llegan al mismo sitio.

      - id: plano-tangente
        titulo: El plano tangente, y aproximar sin calculadora
        aprendes: >-
          Escribir el plano tangente en un punto y usarlo para aproximar valores
          que no se pueden calcular a mano.
        dominio: >-
          Escribir el plano de memoria leyéndolo como una frase, y no
          equivocarte con el signo de los incrementos al evaluar.
        teoria:
          tema: t06-varias-variables
          apartado: el-plano-tangente-y-aproximar-sin-calculadora
          nota: >-
            En el examen de 2022-2023 el apartado b) era exactamente esto, y en
            el de 2019-2020 se daba el plano y se pedía la velocidad de cambio.
        ejercicios:
          - id: aproximar-con-la-diferencial
            incrustado: true
            nota: >-
              Los dos apartados juntos: el plano y la aproximación. El
              distractor es el error de signo en el incremento.
          - id: ex2223-4ev-1-que-funcion-puede-ser
            nota: >-
              De 2022-2023, y es el más raro de los diez: dan tres condiciones
              y piden **una función que las cumpla**. No hay una sola respuesta
              correcta, y eso es lo que lo hace difícil de puntuar y de hacer.

  # ─────────────────────────────────────────────────────────────────────
  - id: integral-multiple
    titulo: La integral múltiple, planteada y dibujada
    pide: >-
      Dibujar un recinto o un sólido y escribir la integral que le corresponde:
      cambiar el orden de integración, calcular un volumen, una masa o un
      centro de gravedad.
    porque: >-
      Es el bloque más grande de la evaluación con diferencia: dieciocho de
      los veintinueve ejercicios de los once cursos leídos, y está en los
      once sin faltar a ninguno. El reparto oficial dice dónde se pierde la
      nota: COMP2 entre 5 y 8 puntos y COMP4 entre 2 y 5, así que **entre un
      cuarto y la mitad del ejercicio es dibujar el recinto y escribir los
      límites**, no integrar.
    invariante:
      anios: 11
      fuente: >-
        Los dieciocho ejercicios de integral múltiple de las once cuartas
        evaluaciones transcritas, de 2014-2015 a 2025-2026. Casi todos empiezan
        con «dibujar el dominio de integración» o «dibujar el sólido»; en
        2023-2024 el apartado b) del ejercicio 3 pedía literalmente «plantear
        (funciones y límites de integración)» sin calcular, y en 2025-2026 el
        ejercicio 3 da la integral hecha y pide reconstruir el sólido a partir
        de ella, que es la misma destreza del revés.
    dominio: >-
      Ante un recinto descrito con desigualdades, dibujarlo y escribir la
      integral en cualquiera de los órdenes en menos de cinco minutos. Y elegir
      las coordenadas mirando la forma del recinto, no el integrando.
    escalones:
      - id: leer-el-recinto
        titulo: Leer los límites de un recinto
        aprendes: >-
          Traducir un dibujo en límites de integración, sabiendo que los de
          dentro llevan la otra variable y los de fuera son números.
        dominio: >-
          Que el control «si me sale una letra en el límite exterior, está mal»
          te salga solo.
        teoria:
          tema: t07-integral-multiple
          apartado: el-recinto-manda-y-hay-que-dibujarlo
        ejercicios:
          - id: ej-doble-sobre-rectangulo
            incrustado: true
            nota: >-
              El caso más fácil, con los cuatro límites constantes. Sirve para
              ver que una doble son dos integrales encadenadas y nada más.
          - id: ej-recinto-y-limites
            incrustado: true
            nota: >-
              Y ahora con un recinto de verdad. La pieza trampa es justo el
              error de dejar una letra fuera.
          - id: ex2021-4ev-2-region-con-recta-y-parabola
            nota: >-
              De 2020-2021, y es el primer examen que hacer entero: dibujar,
              cambiar el orden y calcular una masa, en ese orden.
          - id: ex1819-4ev-2-el-rombo-que-se-vuelve-cuadrado
            nota: >-
              De 2018-2019. Cuatro rectas que forman un rombo, y un cambio de
              variable que lo convierte en un cuadrado. El jacobiano del cambio
              es lo que se evalúa.

      - id: cambiar-el-orden
        titulo: Cambiar el orden de integración
        aprendes: >-
          Reescribir una integral doble con el otro orden, releyendo el dibujo
          con la otra pregunta.
        dominio: >-
          Saber que no se hace con álgebra sino con el dibujo, y reconocer
          cuándo el cambio obliga a **partir el recinto en dos**.
        teoria:
          tema: t07-integral-multiple
          apartado: cambiar-el-orden-de-integración
          nota: >-
            Muchas veces la integral original es imposible y la cambiada sale
            en dos líneas. Ese es el motivo de que se pida.
        ejercicios:
          - id: invertir-el-orden
            nota: >-
              De 2017-2018, y es el caso completo: hay que partir el recinto
              porque la tapa cambia en $x=1$.
          - id: ex2324-4ev-2-cambiar-el-orden-y-calcular
            nota: >-
              De 2023-2024, y va al revés que el anterior: la integral **viene
              partida en dos** y al cambiar el orden se junta en una. Ver eso
              es todo el ejercicio.

      - id: coordenadas
        titulo: Elegir las coordenadas por la forma del recinto
        aprendes: >-
          Decidir entre cartesianas, polares, cilíndricas y esféricas mirando el
          sólido, y aplicar el jacobiano que toca.
        dominio: >-
          No olvidar nunca el $\rho$, y tener a mano el control que lo delata:
          si una cuenta de áreas te devuelve algo que parece un perímetro, el
          jacobiano se ha quedado por el camino.
        teoria:
          tema: t07-integral-multiple
          apartado: cuando-el-recinto-es-redondo-polares
        ejercicios:
          - id: ej-polares-primera
            incrustado: true
            nota: >-
              El área de un círculo, que sabes cuánto vale. Por eso sirve para
              comprobar el jacobiano.
          - id: centro-de-gravedad-elipse
            nota: >-
              Polares generalizadas sobre un cuarto de elipse, y el centro de
              gravedad. De 2017-2018.
          - id: ex1718-4ev-2-centro-del-cuarto-de-elipse
            nota: >-
              El mismo ejercicio tal como cayó, con su reparto de puntos. Está
              aquí para que compares tu respuesta con el enunciado original.
          - id: ex2122-4ev-3-paraboloide-eliptico
            nota: >-
              De 2021-2022, y el eje de revolución es el $X$, no el $Z$. Las
              cilíndricas siguen valiendo, pero hay que girarlas — y ese es el
              paso que se falla.

      - id: solidos
        titulo: Sólidos, volúmenes y centros de gravedad
        aprendes: >-
          Plantear una integral triple sobre un sólido descrito con
          desigualdades, y calcular volumen, masa o centro de gravedad.
        dominio: >-
          Dibujar el sólido antes de escribir nada, y buscar la simetría antes
          de integrar: una coordenada del centro de gravedad puede salir sin
          hacer ninguna cuenta.
        teoria:
          tema: t07-integral-multiple
          apartado: para-qué-sirve-todo-esto
          nota: >-
            Las cuatro aplicaciones comparten esqueleto: cambia lo que va
            dentro de la integral, no la integral.
        ejercicios:
          - id: solido-con-tres-ordenes
            nota: >-
              De 2014-2015. El apartado b) dice «sin hacer el cálculo»: lo que
              se corrige es el planteamiento, y un orden obliga a partir el
              sólido en dos.
          - id: ex1415-4ev-1-masa-bajo-el-paraboloide
            nota: >-
              De 2014-2015, y la densidad no es constante: hay que arrastrarla
              dentro de la integral.
          - id: ex1819-4ev-3-cono-paraboloide-y-momento
            nota: >-
              De 2018-2019. Cono y paraboloide, volumen y momento de inercia,
              con la densidad $k y^{2}$ — que rompe la simetría y obliga a
              integrar de verdad.
          - id: ex2021-4ev-1-entre-cilindro-esfera-y-paraboloide
            nota: >-
              De 2020-2021, y es el más largo de los dieciocho: tres
              superficies, y el sólido es lo que queda **fuera** del cilindro.
          - id: ex2223-4ev-3-cono-eliptico-en-y
            nota: >-
              De 2022-2023. Cono elíptico alrededor del eje $Y$, y el centro de
              gravedad: dos coordenadas salen por simetría y solo una se
              calcula.
          - id: ex2122-4ev-2-pieza-con-rectangulo
            nota: >-
              De 2021-2022, y el centro de masa es el **dato**: hay que
              despejar la altura $H$ del rectángulo para que caiga donde piden.
          - id: ex2526-4ev-2-la-pieza-de-dos-materiales
            nota: >-
              De 2025-2026, y el mismo esquema con dos densidades distintas.
              La masa deja de ser el área y pasa a ser una suma ponderada.

      - id: plantear-sin-calcular
        titulo: Plantear sin calcular, y leer un sólido dentro de su integral
        aprendes: >-
          Escribir la integral completa —función, orden y límites— sin
          resolverla, y hacer el camino inverso: mirar una integral triple y
          dibujar el sólido del que salió.
        dominio: >-
          Que ante «plantear, sin calcular» no te lances a integrar, porque lo
          que se corrige son los límites. Y que ante una integral dada sepas
          leer las tres desigualdades que la generan: los límites de dentro son
          las tapas, los de fuera la sombra en el plano.
        teoria:
          tema: t07-integral-multiple
          apartado: integrales-triples-y-qué-coordenadas-elegir
          nota: >-
            Los límites de fuera son números y los de dentro pueden llevar
            variables. Esa frase, leída del revés, es el método entero para
            reconstruir un sólido a partir de su integral.
        ejercicios:
          - id: solido-con-tres-ordenes
            nota: >-
              Empieza por este, que ya conoces del escalón anterior: la misma
              integral en tres órdenes, y el apartado que se corrige es el
              planteamiento.
          - id: ex1617-4ev-2-cono-de-helado
            nota: >-
              De 2016-2017, y pide el mismo volumen **planteado dos veces**, en
              cilíndricas y en esféricas, sin calcular ninguna de las dos. Es la
              forma más pura de este hueco.
          - id: ex2324-4ev-3-cono-eliptico-planteado
            nota: >-
              De 2023-2024, y el enunciado lo dice con todas las letras:
              «plantear (funciones y límites de integración)».
          - id: ex2223-4ev-2-octante-de-la-bola
            nota: >-
              De 2022-2023, y aquí empieza el camino inverso: te dan la integral
              y hay que dibujar el dominio. Los tres límites describen un octavo
              de bola.
          - id: ex2526-4ev-3-entre-el-cono-y-el-paraboloide
            nota: >-
              De 2025-2026, y es el inverso completo: de la integral salen el
              cono y el paraboloide, y hay que dibujar el sólido antes de tocar
              nada.

      - id: el-area-de-la-superficie
        titulo: El área de la superficie, que no es el volumen
        aprendes: >-
          Calcular cuánta chapa recubre el sólido: la integral doble con la
          raíz, sumando todas las caras.
        dominio: >-
          Que ante «calcular el área de $S$» escribas una integral **doble** y
          no una triple, y que no te dejes ninguna cara: un sólido de dos
          superficies tiene dos áreas que sumar, y la tapa plana también cuenta.
        teoria:
          tema: t07-integral-multiple
          apartado: el-área-de-una-superficie-que-no-es-el-área-de-su-sombra
          nota: >-
            El apartado se escribió el 26 de agosto de 2026 porque faltaba, y
            faltaba pese a que tres de los dieciocho ejercicios de esta
            evaluación lo piden.
        ejercicios:
          - id: ej-area-de-un-plano-inclinado
            incrustado: true
            nota: >-
              Empieza aquí. Un plano se inclina igual en todos sus puntos, así
              que el factor de la raíz es constante y no hay que integrar nada.
          - id: ex1718-4ev-3-paraboloide-dentro-del-cilindro
            nota: >-
              De 2017-2018, y trae los tres apartados juntos: dibujar, volumen
              y área. Compara los dos últimos, que es donde se ve que no son la
              misma cuenta.
          - id: ex1516-4ev-1-paraboloide-y-su-centro
            nota: >-
              De 2015-2016. Un paraboloide apoyado en el plano: la superficie
              son dos, la curva y la tapa circular de abajo.
          - id: ex2425-4ev-2-cono-y-paraboloide-invertidos
            nota: >-
              De 2024-2025, y todo está boca abajo: $z\le 0$. Es el mismo
              trabajo con los signos cambiados, y por eso conviene hacerlo el
              último.
    falta:
      - >-
        De los veintinueve ejercicios de las once cuartas evaluaciones, esta
        ruta enlaza veintiocho. El que no está aquí es el ejercicio 3 de
        2020-2021, que calcula un área con una integral curvilínea: es del tema
        8, que no entra en esta evaluación, y cayó aquí una sola vez en once
        años. **Está enlazado desde el escalón de Green de la ruta de la
        quinta**, que es donde esa herramienta se enseña.
      - >-
        Los cuadernillos de cuarta evaluación traen dentro, hasta 2020-2021,
        un segundo examen marcado «PRIMER CUATRIMESTRAL». **No cuenta para
        esta ruta**: sus diecisiete ejercicios son de complejos y de
        sucesiones, no de los temas 6 y 7. Están transcritos, viven aparte como
        convocatoria propia, y los diecisiete ya cuelgan de los escalones de la
        ruta de la primera evaluación, que es donde sirven.
      - >-
        2019-2020 no aparece en los recuentos, y conviene decir por qué con
        precisión: **el cuadernillo que tenemos de ese curso trae solo la
        recuperación del primer cuatrimestre**, fechada el 24 de febrero de
        2020 y marcada «PRIMER CUATRIMESTRAL», con cuatro ejercicios de
        complejos. Si aquel año llegó a hacerse un examen de los temas 6 y 7,
        no está en el material que tenemos. Así que son once convocatorias
        leídas sobre doce cursos, y ese hueco es un hueco de fuente, no un
        dato sobre el calendario de la escuela. Lo único que se puede añadir es
        que **de ese curso tampoco hay quinta evaluación ni extraordinaria**, y
        que su ordinaria es un examen único de trece ejercicios fechado «mayo y
        junio de 2020»: la forma de un curso interrumpido en marzo. Eso es una
        lectura de las fechas, y así está dicha también en la ruta de la
        quinta.
      - >-
        No hay cronómetro en la página ni forma de guardar lo que has hecho: el
        sitio es estático. Lo que sí se guarda en tu navegador es qué escalones
        has marcado como dominados.
