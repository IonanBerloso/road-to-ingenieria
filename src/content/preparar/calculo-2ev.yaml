asignatura: calculo
evaluacion: segunda
titulo: Preparar la segunda evaluación
lede: >-
  Los temas 3 y 4, el 10 % de la nota. El examen no reparte por igual: de los
  42 ejercicios de los once años, 25 son de estudio local y 10 de funciones
  reales. Esto va en ese orden, no en el del temario.
temas:
  - t03-funciones-reales
  - t04-estudio-local
medidoSobre: 11
criterioDeOrden: >-
  Por lo que rinde cada bloque. Primero el suelo, que no se examina solo. Luego
  los cuatro huecos por número de años en que han caído: optimización nueve,
  teoremas ocho, Taylor siete y aplicaciones de la derivada siete. El bloque de
  complejos va el último a propósito, porque dejó de caer en 2021-2022 y solo
  interesa si tu profesor recupera el formato antiguo. Al final los exámenes
  enteros y el formulario, que son repaso y no aprendizaje.

  Dentro de cada escalón los ejercicios van de ejemplo a examen. Los últimos de
  varios escalones salen de la **recuperación del primer cuatrimestre** que
  hasta 2020-2021 venía dentro del cuadernillo de la quinta evaluación: son
  **once ejercicios más** de estos dos temas exactos, y hasta el 26 de agosto de
  2026 no los enlazaba ninguna ruta. Los recuentos siguen siendo sobre las once
  segundas evaluaciones y solo sobre ellas.


  **Cómo se han determinado los huecos de esta ruta.** Un bloque sin `falta[]`
  no es un bloque sin mirar: el 29 de agosto de 2026 se pasaron los sesenta y
  dos bloques de las siete rutas por tres criterios medidos —si su tema tiene
  pocos ejemplos de entrada para lo que el examen le exige, si sus ejercicios
  usan una herramienta que la prosa de ese tema no nombra, y si algún escalón
  suyo empieza directamente en un ejercicio de examen— y solo se declara lo que
  sale de alguno de ellos. Lo que no aparece aquí es porque ninguno de los tres
  lo señaló.
bloques:
  # ─────────────────────────────────────────────────────────────────────
  - id: suelo
    apunte:
      texto: 'no da puntos — los sostiene todos'
      tono: marco
    titulo: El suelo, que no se examina solo
    pide: >-
      Nada por sí mismo. Es lo que los cuatro ejercicios dan por sabido: buscar
      un dominio, invertir una función, pegar dos trozos y derivar.
    porque: >-
      En once años no ha caído un ejercicio que sea «halla el dominio». Pero un
      problema de optimización que plantea mal el intervalo, o un Taylor sobre
      una inversa que se invirtió con el signo cambiado, ya están perdidos
      antes de empezar. Es corto y va primero por eso.
    dominio: >-
      Sacar el dominio de una función con arcoseno dentro sin que se te escape
      la restricción, invertir una función eligiendo bien el signo, y decidir
      si una función a trozos es derivable en el empalme calculando las dos
      derivadas laterales. Sin dudar en ninguno de los tres.
    escalones:
      - id: dominio
        titulo: El dominio se busca prohibiendo
        aprendes: >-
          Recorrer una fórmula buscando lo que no siempre se puede hacer, y
          escribir el intervalo que queda.
        dominio: >-
          Que ante cualquier fórmula mires las cuatro prohibiciones sin que se
          te olvide la de las trigonométricas inversas, que es la que no se ve.
        teoria:
          tema: t03-funciones-reales
          apartado: el-dominio-se-busca-prohibiendo
          nota: >-
            El dominio no se calcula, se descarta. Y la cuarta prohibición, la
            de arcoseno y arcocoseno, es la que nadie mira.
        ejercicios:
          - id: ej-dominio-con-arcoseno
            incrustado: true
            nota: >-
              Empieza aquí. Una sola función y la restricción que no está
              escrita en ninguna parte de la fórmula.
          - id: dominio-y-rango
            nota: Seis dominios de un tirón. Si salen en cinco minutos, esto está.

      - id: inversa
        titulo: La inversa, y el signo que hay que elegir
        aprendes: >-
          Decidir si una función tiene inversa en un dominio dado, despejarla y
          quedarte con la rama correcta.
        dominio: >-
          Comprobar siempre que el dominio de la inversa coincide con el rango
          de la función. Si no cuadra, uno de los dos está mal.
        teoria:
          tema: t03-funciones-reales
          apartado: la-inversa-existe-cuando-no-hay-empates
          nota: >-
            La inversa depende del dominio en el que se mire, no de la fórmula.
            El signo al despejar es la mitad de los errores del tema.
        ejercicios:
          - id: ej-inversa-con-signo
            incrustado: true
            nota: >-
              El caso mínimo donde el signo decide, con un valor de
              comprobación que lo hace evidente.
          - id: funcion-inversa
            nota: Seis inversas, y el signo que decide una de ellas.
          - id: ex1516-5rec-1-el-coseno-hiperbolico-y-su-inversa
            nota: >-
              De la recuperación de la quinta de 2015-2016. El coseno hiperbólico no
              es inyectivo, y el ejercicio pide **elegir** el trozo donde sí lo es: es
              exactamente de lo que trata este escalón.

      - id: continuidad
        titulo: Continuidad, y los empalmes
        aprendes: >-
          Comprobar las tres condiciones de continuidad en el punto donde una
          función a trozos cambia de definición.
        dominio: >-
          Saber que son tres condiciones y no dos, y que la tercera —que el
          límite valga lo que vale la función— es la que se olvida.
        teoria:
          tema: t03-funciones-reales
          apartado: continuidad-es-una-igualdad-de-tres-cosas
        ejercicios:
          - id: ej-continuidad-parametro
            incrustado: true
            nota: >-
              Un parámetro y un solo empalme. Es el esqueleto de todos los
              ejercicios de trozos del tema.
          - id: continuidad-parametro-k
          - id: continuidad-y-derivabilidad-trozos
            nota: >-
              Y el escalón siguiente: continua no implica derivable. En el
              empalme puede haber un pico.
          - id: carretera-con-tramo-parabolico

      - id: derivada-definicion
        titulo: La derivada como límite
        aprendes: >-
          Calcular una derivada con la definición cuando las reglas no valen, y
          demostrar que un límite no existe con dos sucesiones.
        dominio: >-
          Reconocer los dos casos en que la definición es obligatoria: cuando
          el enunciado lo dice y cuando el punto es un empalme.
        teoria:
          tema: t03-funciones-reales
          apartado: la-derivada-es-un-límite-y-a-veces-hay-que-calcularlo-como-tal
          nota: >-
            Y el atajo tentador que no vale: derivar cada trozo y comparar las
            fórmulas no es lo mismo que comparar las derivadas laterales.
        ejercicios:
          - id: derivada-por-definicion
          - id: limite-que-no-existe
            nota: >-
              Dos sucesiones que discrepan. Es la única forma limpia de
              demostrar que un límite NO existe, y vuelve en la tercera
              evaluación.

  # ─────────────────────────────────────────────────────────────────────
  - id: optimizacion
    apunte:
      texto: '9 de 11 años — casi siempre cierra el examen'
      tono: neutro
    titulo: El problema de optimización aplicado
    pide: >-
      Encontrar las dimensiones que hacen máximo o mínimo algo — área, volumen,
      coste, distancia — a partir de un enunciado con palabras y un dibujo.
    porque: >-
      El hueco más frecuente de esta evaluación: nueve de los once años, y casi
      siempre el último ejercicio. Vale entre 7 y 8 puntos de cálculo, que es
      el máximo de COMP2 del examen. Y se falla antes de derivar: el paso de
      derivar es mecánico, y lo que puntúa es plantear.
    invariante:
      anios: 9
      fuente: >-
        Un problema de máximos o mínimos con enunciado aplicado en 2015-16,
        2017-18, 2018-19, 2020-21, 2021-22, 2022-23, 2023-24, 2024-25 y
        2025-26. Solo faltan 2016-17 y 2019-20.
    dominio: >-
      Coger un enunciado nuevo y llegar a la función objetivo de una sola
      variable, con su intervalo escrito, en menos de cinco minutos. Y cerrar
      siempre comprobando que es máximo o mínimo y que la solución tiene
      sentido físico.
    escalones:
      - id: plantear
        titulo: Plantear, que es donde se falla
        aprendes: >-
          Separar la función objetivo de la restricción, y dejar el objetivo con
          una sola variable y su intervalo.
        dominio: >-
          Llegar a la función de una variable sin haber derivado todavía. Si al
          empezar a derivar aún tienes dos incógnitas, el planteamiento está
          incompleto.
        teoria:
          tema: t04-estudio-local
          apartado: optimizar-es-traducir-no-derivar
          nota: >-
            Los siete pasos, y por qué el intervalo hay que escribirlo en el
            paso 1: si no está escrito, los bordes no se evalúan.
        ejercicios:
          - id: ej-optimizar-rectangulo
            incrustado: true
            nota: >-
              Empieza aquí. Objetivo y restricción a la vista, y el resultado
              es el que hay que reconocer: de todos los rectángulos con el
              mismo perímetro, el cuadrado.
          - id: maximo-con-restriccion
            nota: El mismo esqueleto sin decorado geométrico.
          - id: rectangulo-bajo-la-parabola
          - id: caja-sin-tapa
          - id: canal-de-capacidad-maxima
          - id: rectangulo-en-semicircunferencia
          - id: rectangulo-en-triangulo-equilatero
          - id: poster-con-margenes
          - id: triangulo-de-area-minima
          - id: ex1718-5rec-2-el-tanque-de-propano
            nota: >-
              De la recuperación de la quinta de 2017-2018. Un tanque cilíndrico con
              dos casquetes, y la pregunta de fondo: por qué la solución óptima no es
              una esfera.

      - id: cerrar-bien
        titulo: Cerrar el problema, con Weierstrass
        aprendes: >-
          Comprobar que el punto crítico es el extremo que se pide, evaluando
          también en los bordes del intervalo.
        dominio: >-
          Hacer uno de examen entero, con su dibujo, su intervalo y su
          comprobación de sentido físico. Sin dejar el paso 6 a medias.
        teoria:
          tema: t03-funciones-reales
          apartado: weierstrass-en-un-intervalo-cerrado-el-máximo-se-alcanza
          nota: >-
            El teorema que garantiza que el máximo existe, y que convierte el
            paso 6 en evaluar cuatro números y compararlos.
        ejercicios:
          - id: ej-velocidades-relacionadas
            nota: >-
              Traducir un enunciado a una función de una variable, sin optimizar todavía.
          - id: ex2526-2ev-4-triangulo-bajo-la-exponencial
            nota: >-
              Del más reciente hacia atrás. El bloque está cuando salgan tres
              seguidos sin abrir la pista.
          - id: ex2425-2ev-4-distancia-minima-a-la-parabola
          - id: ex2324-2ev-4-alambre-cuadrado-y-triangulo
          - id: ex2223-2ev-3-recta-que-minimiza-la-suma
          - id: ex2122-2ev-4-caja-sin-tapa
          - id: ex2021-2ev-4-triangulo-de-area-minima
          - id: ex1819-2ev-4-alambre-circulo-y-cuadrado
          - id: ex1718-2ev-3-cable-entre-dos-postes
          - id: ex1516-2ev-2-deposito-cilindrico

  # ─────────────────────────────────────────────────────────────────────
  - id: teoremas
    apunte:
      texto: '8 de 11 — puntos de explicar, no de calcular'
      tono: nota
    titulo: Los teoremas, enunciados y demostrados
    pide: >-
      Enunciar un teorema con sus hipótesis, demostrarlo, o construir un
      ejemplo que enseñe qué pasa cuando una hipótesis falla.
    porque: >-
      El bloque de COMP4 de esta evaluación, y el segundo más frecuente: ocho
      de los once años. Aquí el cálculo vale poco o nada — en 2019-2020 el
      ejercicio de Fermat valía diez puntos y ninguno era de calcular. Es donde
      más nota se gana por hora de estudio, porque el material es cerrado: son
      cinco teoremas y no cambian.
    invariante:
      anios: 8
      fuente: >-
        Un ejercicio que pide enunciar, demostrar o negar un teorema del valor
        medio o de continuidad en 2015-16, 2016-17, 2018-19, 2019-20, 2020-21,
        2021-22, 2022-23 y 2023-24.
    dominio: >-
      Escribir de memoria, en papel y sin apuntes, los enunciados de Fermat,
      Rolle, Lagrange, Bolzano y Weierstrass con sus hipótesis exactas, y para
      cada uno un contraejemplo de lo que pasa al quitarle una. Si tienes que
      pensar cuál pide continuidad en el cerrado, todavía no.
    escalones:
      - id: fermat
        titulo: Fermat, y por qué se busca donde la derivada se anula
        aprendes: >-
          Demostrar que en un extremo interior la derivada se anula, y
          reconocer que el recíproco es falso.
        dominio: >-
          Recitar las tres palabras del enunciado —local, interior, derivable—
          con un contraejemplo para cada una.
        teoria:
          tema: t04-estudio-local
          apartado: fermat-por-qué-se-busca-donde-la-derivada-se-anula
          nota: >-
            El que justifica todo lo demás, y el que más veces se ha pedido
            demostrado. La demostración cabe en tres líneas.
        ejercicios:
          - id: ej-punto-critico-clasificado
            incrustado: true
            nota: >-
              Empieza aquí. Se ve que anularse no basta y que hace falta la
              segunda derivada para decidir qué es cada punto.
          - id: ex1920-2ev-3-teorema-de-fermat
            nota: Diez puntos, y ninguno de calcular.
          - id: ex1617-2ev-2-fermat-y-la-inversa

      - id: rolle-lagrange
        titulo: Rolle y Lagrange, que son el mismo
        aprendes: >-
          Comprobar las dos hipótesis en sus dos intervalos y encontrar el punto
          que el teorema garantiza.
        dominio: >-
          Escribir los dos enunciados sin confundir el cerrado con el abierto, y
          saber que Rolle es Lagrange cuando la pendiente media vale cero.
        teoria:
          tema: t04-estudio-local
          apartado: rolle-y-lagrange-son-el-mismo-teorema
          nota: >-
            Continuidad en el cerrado y derivabilidad en el abierto. La
            diferencia entre los dos intervalos no es un descuido.
        ejercicios:
          - id: ej-lagrange-basico
            incrustado: true
            nota: >-
              Empieza aquí. Las hipótesis, la pendiente media y el punto, con
              los números más simples posibles.
          - id: teorema-de-lagrange
          - id: teorema-de-rolle
          - id: ex2122-2ev-2-lagrange-tres-casos
            nota: Construir los tres casos posibles, que es la variante dura.
          - id: ex2021-2ev-2-rolle-enunciar-y-demostrar
          - id: ex1617-2ev-3-prolongacion-y-lagrange

      - id: bolzano
        titulo: Bolzano, existencia y unicidad
        aprendes: >-
          Demostrar que una ecuación tiene solución en un intervalo, y añadir
          el argumento que prueba que es única.
        dominio: >-
          Distinguir los dos argumentos: Bolzano da la existencia, y la
          unicidad sale del signo constante de la derivada. Son dos, y los dos
          hay que escribirlos.
        teoria:
          tema: t03-funciones-reales
          apartado: bolzano-no-encuentra-la-raíz-garantiza-que-existe
          nota: >-
            Con la figura. Es un teorema de existencia: dice que la hay, no
            dónde.
        ejercicios:
          - id: ej-bolzano-una-raiz
            incrustado: true
            nota: >-
              Empieza aquí. Nombrar la función, comprobar los signos y
              concluir. Tres líneas.
          - id: bolzano-raiz-unica
          - id: ex2324-2ev-2-bolzano-y-lagrange
          - id: ex1819-2ev-2-lagrange-y-bolzano
          - id: ex1617-5rec-1-una-sola-raiz-y-hay-que-probarlo
            nota: >-
              De la recuperación de la quinta de 2016-2017. Bolzano da la existencia y
              la monotonía da la unicidad: las dos mitades del argumento, en un solo
              ejercicio.
          - id: ex1819-5rec-4-darboux
            nota: >-
              De la recuperación de la quinta de 2018-2019, y vale 0/0/10: enunciar y
              demostrar Darboux. Está aquí porque el propio enunciado lo contrasta con
              Bolzano, y la diferencia es la pregunta.

      - id: punto-fijo
        titulo: El punto fijo, que es Bolzano disfrazado
        aprendes: >-
          Construir la función auxiliar que convierte un problema de punto fijo
          en uno de Bolzano.
        dominio: >-
          Que el paso de restar la x te salga solo, y que sepas despachar en una
          línea los casos de igualdad en los extremos.
        teoria:
          tema: t03-funciones-reales
          apartado: el-punto-fijo-que-es-bolzano-disfrazado
          nota: >-
            Ese paso de restar la x es lo que se puntúa. Nadie lo ve la primera
            vez, y una vez visto se reutiliza.
        ejercicios:
          - id: ej-bolzano-una-raiz
            nota: >-
              Bolzano aplicado sin disfraz. El punto fijo es esto con la función auxiliar delante.
          - id: ex1516-2ev-3-teorema-del-punto-fijo
            nota: Ocho de los diez puntos del ejercicio.
          - id: ex1920-2ev-2-orden-en-el-limite
            nota: >-
              Este es de sucesiones y está aquí a propósito: es la única vez en
              once años que la segunda evaluación pidió una demostración del
              tema 2, y la técnica es la misma.

  # ─────────────────────────────────────────────────────────────────────
  - id: taylor
    apunte:
      texto: '7 de 11 — la cota del error es lo que se deja'
      tono: neutro
    titulo: Taylor, y la cota del error que se olvida
    pide: >-
      Calcular un polinomio de Taylor o de Maclaurin, usarlo para aproximar un
      valor, y acotar el error cometido. O al revés: cuántos términos hacen
      falta para una precisión dada.
    porque: >-
      Siete de los once años. Es el bloque que más se deja a medias, porque
      calcular el polinomio se hace y acotar el resto no: el resto suele valer
      tantos puntos como el cálculo, y una aproximación sin cota es un número
      sin garantía.
    invariante:
      anios: 7
      fuente: >-
        Taylor, Maclaurin o cota del error en 2018-19, 2019-20, 2020-21,
        2021-22, 2022-23, 2023-24 y 2024-25.
    dominio: >-
      Escribir el polinomio de Maclaurin de orden n de cualquiera de los seis
      desarrollos de memoria, y a continuación acotar el resto sin que te lo
      pidan. Y saber hacer el ejercicio en las dos direcciones.
    escalones:
      - id: el-polinomio
        titulo: Construir el polinomio
        aprendes: >-
          Calcular el polinomio de Taylor de un orden dado alrededor de un
          punto, y reconocer que Maclaurin es el caso centrado en cero.
        dominio: >-
          Que la fórmula te salga sin mirarla, con sus factoriales en el
          denominador, y que sepas que los coeficientes son las derivadas.
        teoria:
          tema: t04-estudio-local
          apartado: el-polinomio-de-taylor-es-la-mejor-imitación-local
          nota: >-
            Incluye qué es Maclaurin, y por qué reconstruir un polinomio a
            partir de condiciones no necesita plantear un sistema.
        ejercicios:
          - id: ej-taylor-orden-dos
            incrustado: true
            nota: >-
              Empieza aquí. El desarrollo más simple que hay, y su cota del
              resto calculada al final.
          - id: taylor-tangente-de-dos-grados
          - id: ex2425-2ev-3-reconstruir-la-cubica
            nota: >-
              La variante de contar condiciones: un polinomio de grado n queda
              fijado por n+1 datos.
          - id: ex2223-2ev-2-grado-del-polinomio
          - id: ex1617-5rec-2-los-signos-de-taylor-leidos-en-la-grafica
            nota: >-
              De la recuperación de la quinta de 2016-2017, y vale 1/2/7. No hay que
              calcular el polinomio: hay que decir el **signo** de cada coeficiente
              mirando la gráfica.
          - id: ex2021-5rec-3-mclaurin-sin-resolver-la-ecuacion
            nota: >-
              De la recuperación de la quinta de 2020-2021. La función viene dada por
              una ecuación implícita y aun así el polinomio sale, derivando la ecuación
              en vez de la función.

      - id: la-cota
        titulo: El resto, que es lo que se pregunta
        aprendes: >-
          Acotar el error de una aproximación, y resolver el problema inverso:
          cuántos términos hacen falta para una precisión dada.
        dominio: >-
          Que nunca entregues un valor aproximado sin su cota, aunque el
          enunciado no la pida con esas palabras.
        teoria:
          tema: t04-estudio-local
          apartado: el-resto-es-la-parte-que-se-suele-olvidar-y-es-la-que-se-pregunta
          nota: >-
            El punto intermedio no se conoce y no hace falta: se acota. Los dos
            ejercicios típicos salen los dos de aquí.
        ejercicios:
          - id: cuantos-terminos-hacen-falta
          - id: ex2223-2ev-4-cota-y-error-exacto
            nota: >-
              Aquí y en el siguiente el ejercicio ES la cota. Comparar la cota
              con el error de verdad es lo que se pregunta.
          - id: ex2122-2ev-3-cota-en-el-otro-sentido
          - id: ex2021-2ev-3-maclaurin-raiz-cubica
          - id: ex1920-2ev-4-maclaurin-de-la-exponencial

      - id: los-desarrollos
        titulo: Los seis que hay que saberse
        aprendes: >-
          Obtener el desarrollo de una función componiendo o derivando uno de
          los seis conocidos, en vez de calcular derivadas sucesivas.
        dominio: >-
          Escribir los seis de memoria con su radio de convergencia, que forma
          parte de la respuesta.
        teoria:
          tema: t04-estudio-local
          apartado: seis-desarrollos-que-conviene-tener-memorizados
          nota: >-
            La serie binómica es la que resuelve las raíces sin calculadora,
            que es como cayó en 2020-2021.
        ejercicios:
          - id: ocho-series-de-potencias
            nota: Ocho desarrollos y solo tres hay que calcular.
          - id: ex2425-2ev-2-taylor-implicito
            nota: La variante moderna, en la que la función no se puede despejar.
          - id: ex2324-2ev-3-taylor-de-una-composicion
          - id: ex1819-2ev-3-serie-de-potencias
          - id: ex1516-5rec-2-el-logaritmo-y-la-armonica-alternada
            nota: >-
              De la recuperación de la quinta de 2015-2016. Del desarrollo del
              logaritmo sale la suma de la armónica alternada: el mismo truco de
              evaluar en un punto que usa Fourier.
          - id: ex1819-5rec-2-tres-mclaurin-y-uno-que-no-existe
            nota: >-
              De la recuperación de la quinta de 2018-2019. Tres desarrollos, y el
              tercero **no existe**: saber decir por qué vale tanto como calcular los
              otros dos.

  # ─────────────────────────────────────────────────────────────────────
  - id: derivada-aplicada
    apunte:
      texto: '7 de 11 — el que más cambia de forma'
      tono: neutro
    titulo: La derivada leída en una gráfica, y las velocidades
    pide: >-
      Sacar conclusiones sobre una función a partir de la gráfica de su
      derivada, derivar una inversa o una implícita, o resolver un problema de
      velocidades relacionadas.
    porque: >-
      Siete de los once años, y es el hueco que más ha cambiado de forma: hasta
      2018-2019 eran razones de cambio con enunciado; desde 2023-2024, los tres
      últimos cursos seguidos, el enunciado trae dibujada la derivada y hay que
      contestar sobre la función. Es el formato más nuevo del examen.
    invariante:
      anios: 7
      fuente: >-
        Gráfica de la derivada en 2015-16, 2023-24, 2024-25 y 2025-26;
        velocidades relacionadas en 2017-18, 2022-23 y 2025-26; implícita con
        pendiente impuesta en 2021-22.
    dominio: >-
      Delante de una gráfica, escribir sin dudar dónde crece la función, dónde
      tiene sus extremos y dónde se dobla, diciendo en voz alta cuál de las dos
      curvas estás mirando. Y en un problema de velocidades, plantear la
      relación en general antes de sustituir ningún número.
    escalones:
      - id: leer-la-grafica
        titulo: Cuando lo dibujado es la derivada
        aprendes: >-
          Traducir cada rasgo de la gráfica de la derivada en una propiedad de
          la función que no ves.
        dominio: >-
          Escribir en el margen «lo dibujado es f prima» antes de contestar
          nada, y no confundir un mínimo de la curva con un mínimo de la
          función.
        teoria:
          tema: t04-estudio-local
          apartado: cuando-lo-que-te-dan-dibujado-es-la-derivada
          nota: >-
            Con la figura. Es el formato de los tres últimos cursos y
            desconcierta la primera vez.
        ejercicios:
          - id: ej-leer-grafica-derivada
            incrustado: true
            nota: >-
              Empieza aquí, con la derivada más simple posible, y fíjate en lo
              que no se puede saber.
          - id: ex2526-2ev-1-composicion-de-dos-graficas
          - id: ex2425-2ev-1-grafica-de-la-derivada
          - id: ex2324-2ev-1-derivada-y-velocidades
          - id: ex1516-2ev-4-cual-es-la-derivada
          - id: ex1819-5rec-3-cual-de-las-dos-es-la-derivada
            nota: >-
              De la recuperación de la quinta de 2018-2019, y es el mismo formato que
              volvió a caer en 2021-2022 y en 2023-2024: dos curvas sin etiquetar, y
              hay que decidir cuál es cuál antes de poder hacer nada.
          - id: ex1718-5rec-3-la-composicion-que-cambia-cuatro-veces
            nota: >-
              De la recuperación de la quinta de 2017-2018. El signo de la derivada de
              una composición se lee encadenando dos gráficas, y cambia cuatro veces.
          - id: ex1920-2-cual-de-las-dos-graficas-es-la-derivada
            nota: >-
              Del examen global de mayo-junio de 2020, y es la **cuarta** vez que cae
              este formato. Aquí la identificación no es el ejercicio: es el requisito
              para poder empezar el apartado b).

      - id: velocidades
        titulo: Velocidades relacionadas
        aprendes: >-
          Escribir la relación geométrica entre dos magnitudes, derivarla
          respecto del tiempo y sustituir al final.
        dominio: >-
          Que jamás sustituyas un dato antes de derivar. Es el único error de
          este escalón y se comete siempre.
        teoria:
          tema: t03-funciones-reales
          apartado: la-derivada-como-velocidad
          nota: >-
            Con la figura de los dos órdenes enfrentados. Lo que se falla no es
            la derivada, es el orden.
        ejercicios:
          - id: ej-velocidades-relacionadas
            incrustado: true
            nota: >-
              Empieza aquí. Un cuadrado que crece, y se ve por qué sustituir
              antes da cero.
          - id: coche-y-edificio
          - id: avion-y-radar
          - id: ex2526-2ev-2-beisbol
          - id: ex2223-2ev-1-coche-y-edificio
          - id: ex1718-2ev-2-el-dron

      - id: implicitas
        titulo: Derivar sin despejar
        aprendes: >-
          Derivar una ecuación implícita o una curva paramétrica, y sacar la
          tangente en un punto.
        dominio: >-
          Que cada y derivada te deje su y prima sin pensarlo, y que recuerdes
          que un punto alcanzado con dos valores del parámetro tiene dos
          tangentes.
        teoria:
          tema: t03-funciones-reales
          apartado: derivar-sin-despejar
          nota: >-
            Implícita y paramétrica. El detalle que decide ejercicios: si un
            punto se alcanza con dos valores del parámetro, hay dos tangentes.
        ejercicios:
          - id: derivacion-implicita
          - id: tangente-a-la-cuadrifolia
          - id: derivada-parametrica
          - id: dos-tangentes-en-un-punto
          - id: derivada-de-las-inversas
          - id: segunda-derivada-inversa
          - id: segunda-derivada-composicion
          - id: ex2526-2ev-3-derivadas-de-la-inversa
          - id: ex2122-2ev-1-tangente-de-pendiente-dada
          - id: ex2021-5rec-2-la-tangente-al-folio-de-descartes
            nota: >-
              De la recuperación de la quinta de 2020-2021. El folio de Descartes no
              se puede despejar, así que la derivación implícita no es un atajo: es la
              única vía.

      - id: diferencial
        titulo: El diferencial como calculadora
        aprendes: >-
          Aproximar un valor con la recta tangente, eligiendo bien el punto de
          apoyo.
        dominio: >-
          Elegir el punto más cercano donde la función se sepa de memoria, y
          acordarte de pasar los ángulos a radianes antes.
        teoria:
          tema: t03-funciones-reales
          apartado: el-diferencial-la-recta-tangente-como-calculadora
        ejercicios:
          - id: aproximar-con-el-diferencial
            nota: >-
              Cuatro valores aproximados sin calculadora, que es como se hace en
              el examen porque no la hay.

  # ─────────────────────────────────────────────────────────────────────
  - id: complejos-que-dejaron-de-caer
    apunte:
      texto: 'no cae desde 2021-2022'
      tono: neutro
    titulo: Complejos, que salían hasta 2020-2021
    pide: >-
      Lo mismo que el examen de la primera evaluación: una ecuación, un
      logaritmo, una potencia o un vértice que falta.
    porque: >-
      Durante seis cursos seguidos el ejercicio 1 de esta evaluación era de
      complejos, y desde 2021-2022 no ha vuelto a aparecer. Va el último a
      propósito y no en medio: si tu curso mantiene el formato reciente, esto
      no cae y se puede saltar entero. Está aquí porque callarlo sería esconder
      seis ejercicios de examen que existen.
    invariante:
      anios: 6
      fuente: >-
        Ejercicio 1 de tema 1 en las segundas evaluaciones de 2015-16, 2016-17,
        2017-18, 2018-19, 2019-20 y 2020-21. En 2021-22, 2022-23, 2023-24,
        2024-25 y 2025-26, ninguno.
    dominio: >-
      Si decides hacerlo, el criterio es el de la ruta de la primera
      evaluación, porque es la misma materia. Si decides saltártelo, asegúrate
      antes de que el examen de tu curso empieza por una gráfica y no por un
      número complejo.
    material:
      - tipo: ejercicio
        id: ex2021-2ev-1-hexagono-regular
      - tipo: ejercicio
        id: ex1920-2ev-1-logaritmo-de-modulo-uno
      - tipo: ejercicio
        id: ex1819-2ev-1-potencia-real-negativa
      - tipo: ejercicio
        id: ex1718-2ev-1-dos-complejos-con-tres-condiciones
      - tipo: ejercicio
        id: ex1617-2ev-1-cociente-real-o-imaginario
      - tipo: ejercicio
        id: ex1516-2ev-1-exponencial-compleja

  # ─────────────────────────────────────────────────────────────────────
  - id: enteros
    apunte:
      texto: 'papel en blanco y reloj'
      tono: neutro
    titulo: Los exámenes enteros, cronometrados
    pide: >-
      Sentarte con el papel en blanco, sin apuntes y con reloj, y hacer los
      cuatro ejercicios seguidos.
    porque: >-
      Los bloques anteriores entrenan cada hueco por separado, y eso no es lo
      que pasa en el aula. Estos tres son los más recientes y los que mejor
      representan el formato actual: sin complejos, con una gráfica al
      principio y un problema de optimización al final.
    dominio: >-
      Hacer uno entero dentro del tiempo, sin abrir ninguna pista, y que al
      corregirlo no haya ningún ejercicio en blanco.
    material:
      - tipo: examen
        curso: '2025-2026'
        convocatoria: segunda
        nota: >-
          Empieza por el último. Cada página abre en blanco: las resoluciones
          están en la otra pestaña y conviene no tocarlas hasta terminar.
      - tipo: examen
        curso: '2024-2025'
        convocatoria: segunda
      - tipo: examen
        curso: '2023-2024'
        convocatoria: segunda
    falta:
      - >-
        No hay cronómetro en la página ni forma de guardar lo que has hecho: el
        sitio es estático y no tiene cuentas de usuario. El reloj lo pones tú.

  # ─────────────────────────────────────────────────────────────────────
  - id: formulario
    apunte:
      texto: '8 de 11 años traen memoria pura'
      tono: marco
    titulo: Lo que hay que llevar sabido
    pide: >-
      El examen no deja formulario. Los enunciados de los teoremas se piden
      literales, con sus hipótesis, y los desarrollos de Taylor no se deducen.
    porque: >-
      En ocho de los once años hay un apartado que se contesta de memoria o no
      se contesta. Este bloque existe para el rato de antes de entrar, y por
      eso va el último: es repaso, no aprendizaje.
    invariante:
      anios: 8
      fuente: >-
        Los mismos ocho años del bloque de teoremas, donde el enunciado empieza
        por «enuncia», «define» o «demuestra».
    dominio: >-
      Escribir en papel, de memoria y sin consultar nada, los cinco teoremas
      con sus hipótesis, la fórmula del resto de Taylor y los seis desarrollos.
      Si tienes que mirar una sola vez, todavía no.
    material:
      - tipo: teoria
        tema: t04-estudio-local
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          Estudio local: la tabla de los tres teoremas, Taylor con su resto,
          los seis desarrollos y el criterio de la segunda derivada.
      - tipo: teoria
        tema: t03-funciones-reales
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          Funciones reales: las tres condiciones de continuidad, la tabla de
          Bolzano, Weierstrass y punto fijo, y el orden de las razones de
          cambio.
    falta:
      - >-
        Las dos listas son una segunda copia de cosas que ya están explicadas
        en los temas, y eso tiene un riesgo: si un día se corrige la teoría y
        no se corrige aquí, esto miente. No hay ningún guardián que lo
        compruebe todavía, así que se dice en voz alta.
