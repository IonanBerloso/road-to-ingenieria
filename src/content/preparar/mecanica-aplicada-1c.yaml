# La ruta del bloque 1 de Mecánica Aplicada, medida sobre sus tres
# convocatorias con enunciado en castellano: enero de 2024, la ordinaria de
# junio de 2025 y la extraordinaria de junio de 2025.
#
# Las tres examinan el MISMO bloque —Estática, temas 1 a 6—, que la guía deja
# aprobar en enero y que vuelve a caer en ordinaria y en extraordinaria para
# quien no lo tenga. Por eso hay una sola ruta y no tres: el examen es el
# mismo, cambia la fecha. Lo dice la propia guía docente en su apartado de
# convocatoria ordinaria.
#
# El orden de los bloques NO es el del temario, y el criterio está escrito
# abajo. Sale de contar los veinte ejercicios que caen en esas tres
# convocatorias, uno a uno, con el tema que cada uno pide:
#
#   cables ......................... 5   (en las tres)
#   rozamiento ..................... 4   (en las tres)
#   resistencia de materiales ...... 4   (en dos, y siempre con más peso)
#   estática del sólido rígido ..... 4   (en dos)
#   cálculo vectorial .............. 2   (en dos, siempre la cuestión 1)
#   geometría de masas ............. 1   (en una)
#
# El recuento es de ejercicios, no de puntos: la extraordinaria de 2025 no
# publica reparto por competencia y la de enero tampoco, así que puntuar cada
# tema sería inventar (§10).
asignatura: mecanica-aplicada
evaluacion: primer-cuatrimestre
# Las tres convocatorias transcritas son de este mismo bloque: la de enero, y
# los exámenes de bloque 1 que se repiten dentro de la ordinaria y de la
# extraordinaria de junio. Por eso esta ruta las prepara las tres y no hay
# tres rutas iguales — sería inventarse una diferencia que no existe (§10).
#
# Ojo con el alcance, y por eso se dice aquí: esas dos convocatorias de junio
# llevan ADEMÁS un examen del bloque 2, que esta ruta no cubre. Ese es el otro
# fichero, `mecanica-aplicada-2c.yaml`.
tambienPrepara:
  - ordinaria
  - extraordinaria
titulo: Preparar el examen del bloque 1, Estática
lede: >-
  Los temas 1 a 6 tal como caen: veinte ejercicios contados en las tres
  convocatorias con enunciado en castellano. Cables y rozamiento van primero
  porque son los que más aparecen, no porque el temario los ponga ahí.
temas:
  - t01-calculo-vectorial
  - t02-geometria-de-masas
  - t03-estatica
  - t04-rozamiento
  - t05-cables
  - t06-resistencia-de-materiales
medidoSobre: 3
criterioDeOrden: >-
  Por cuántas veces cae cada tema en las tres convocatorias, de más a menos, y
  con el suelo delante porque sin sus convenios los demás bloques se resuelven
  al revés. Cuando dos temas empatan manda el que además pesa como ejercicio
  largo y no solo como cuestión de teoría.

bloques:
  - id: suelo
    titulo: Los convenios, que no dan puntos y deciden todos los signos
    pide: >-
      Nada por sí mismos: son los tres criterios con los que hay que leer
      cualquier enunciado del bloque, y equivocarse en uno cambia el signo de
      todo lo que venga detrás.
    porque: >-
      No ocupa hueco propio en ninguna de las tres convocatorias, y por eso su
      recuento honesto es cero. Está dentro de los veinte ejercicios: el campo
      de momentos con su OP frente a PO, el convenio de la viga —y hacia
      abajo, M positivo cuando tracciona la fibra inferior— y la altura de la
      catenaria medida desde la directriz y no desde el punto más bajo.
    invariante:
      anios: 0
      fuente: >-
        Cero como ejercicio propio en las tres convocatorias leídas; presente
        en los veinte ejercicios como criterio de signo.
    apunte:
      texto: no puntúa — sostiene los veinte ejercicios
      tono: marco
    dominio: >-
      Sabes decir, sin mirar, de qué punto a qué punto va el vector del campo
      de momentos, hacia dónde apunta la y de una viga y desde qué recta se
      mide la altura de una catenaria.
    revisado: '2026-09-13'
    escalones:
      - id: el-campo-de-momentos
        titulo: El vector del campo va del punto nuevo al viejo
        aprendes: >-
          A trasladar un momento de un punto a otro sin equivocarte de sentido
          en el producto vectorial, que es el error que más veces cambia un
          signo en este bloque.
        teoria:
          tema: t01-calculo-vectorial
          apartado: un-sistema-de-vectores-la-resultante-y-el-campo-de-momentos
          nota: >-
            El apartado escribe la fórmula con el vector que va del punto
            nuevo al viejo, que es el orden que la asignatura usa en sus
            resoluciones.
        ejercicios:
          - id: ejma1-el-momento-en-otro-punto
            incrustado: true
            nota: >-
              El ejemplo de entrada, con el signo equivocado puesto de
              distractor para que salte aquí y no en el examen.
        dominio: >-
          Trasladas un momento a otro punto y sabes justificar el orden de los
          dos vectores del producto sin consultarlo.
      - id: el-convenio-de-la-viga
        titulo: El convenio de signos del curso, que no es el de todos los libros
        aprendes: >-
          A escribir dV/dx = −q_y y dM/dx = V con el criterio de la
          asignatura, y a reconocer cuándo un desarrollo de otro libro está
          usando el contrario.
        teoria:
          tema: t06-resistencia-de-materiales
          apartado: el-convenio-de-signos-del-curso
          nota: >-
            Se leyó de la figura del propio curso, no del volcado de texto,
            que había perdido los signos menos.
        ejercicios:
          - id: ejma6-la-viga-biapoyada
            incrustado: true
            nota: >-
              El caso limpio: la cortante baja de +6 a −6 y el flector es
              máximo justo donde cruza el cero.
        dominio: >-
          Dibujas los dos diagramas de una viga sencilla y sabes decir qué
          fibra tracciona un flector positivo.
      - id: la-directriz
        titulo: La y de la catenaria se mide desde la directriz
        aprendes: >-
          A colocar el origen una distancia c por debajo del punto más bajo, y
          a usar T = w·y, que es lo que hace que casi todos los problemas de
          catenaria salgan en dos líneas.
        teoria:
          tema: t05-cables
          apartado: su-propio-peso-la-catenaria
          nota: >-
            El error típico que sigue al apartado es exactamente este: medir
            la altura desde el punto más bajo.
        ejercicios:
          - id: ejma5-la-catenaria-en-un-punto
            incrustado: true
            nota: >-
              Con los números de la figura del tema: c = 2 m, y = 4,705 m y
              una tensión que es el peso de esos 4,705 m de cable.
        dominio: >-
          Escribes y = c·cosh(x/c), s = c·senh(x/c) y T = w·y sin dudar de
          dónde está el cero de la y, y compruebas con y² = c² + s².

  - id: cables
    titulo: Cables, que es lo que más cae
    pide: >-
      Tensiones y longitudes de cables con carga concentrada, con carga
      uniforme por unidad de abscisa y con su propio peso, casi siempre
      enganchados a un disco, una polea o un muelle.
    porque: >-
      Cinco de los veinte ejercicios contados, y aparece en las tres
      convocatorias: dos en enero de 2024, uno en la ordinaria y dos en la
      extraordinaria. Es el único tema que cae en las tres como ejercicio
      largo, no solo como cuestión.
    invariante:
      anios: 3
      fuente: >-
        Contado sobre las tres convocatorias con enunciado en castellano:
        enero de 2024 (n2 y n5), ordinaria de 2025 (n5) y extraordinaria de
        2025 (n2 y n3).
    apunte:
      texto: cae en las tres — 5 de los 20 ejercicios
      tono: nota
    dominio: >-
      Distingues de un vistazo si un cable es una parábola o una catenaria,
      sabes cuál de los dos datos te falta y resuelves la transcendente sin
      perder el parámetro por el camino.
    revisado: '2026-09-13'
    escalones:
      - id: parabola-o-catenaria
        titulo: Parábola o catenaria, y cómo se decide
        aprendes: >-
          A leer del enunciado si la carga va por unidad de abscisa o por
          unidad de cable, que es lo único que separa las dos curvas.
        teoria:
          tema: t05-cables
          apartado: tres-maneras-de-cargar-un-cable
        ejercicios:
          - id: ejma5-la-parabola-del-puente
            incrustado: true
          - id: ejma5-col54-la-parabola-con-amarres-a-distinta-altura
            nota: >-
              La parábola con los amarres a distinta altura, que es donde más
              se rompe el automatismo de la simetría.
        dominio: >-
          Justificas con el enunciado, y no de memoria, cuál de las dos
          ecuaciones toca.
      - id: la-catenaria-en-el-examen
        titulo: La catenaria tal como cae
        aprendes: >-
          A resolver una catenaria de la que te dan dos datos cualesquiera
          —longitud, altura, tensión o ángulo— usando y² = c² + s².
        teoria:
          tema: t05-cables
          apartado: cómo-se-atacan-los-problemas-de-catenaria
        ejercicios:
          - id: exma2324-1c-2-la-longitud-y-la-tension-de-la-catenaria
            incrustado: true
            nota: >-
              La cuestión de enero de 2024, que además pide deducir las
              fórmulas antes de usarlas.
          - id: exma2425-ord-5-la-catenaria-que-cuelga-de-la-polea
          - id: exma2425-ext-3-la-catenaria-entre-el-disco-y-la-polea
        dominio: >-
          Resuelves la transcendente con la calculadora del examen y sabes
          comprobar el resultado con la identidad, no repitiendo la cuenta.
      - id: el-cable-enganchado-a-algo
        titulo: El cable que tira de un disco, una barra o un muelle
        aprendes: >-
          A cerrar el problema uniendo la tensión del cable con el equilibrio
          de lo que hay al otro extremo, que es como caen casi todos.
        ejercicios:
          - id: exma2324-1c-5-la-fuerza-del-cable-en-d
          - id: ejma5-col516-la-catenaria-el-muelle-y-el-disco
            nota: >-
              Catenaria, muelle y disco a punto de deslizar en el mismo
              problema: el formato exacto de la ordinaria.
          - id: ejma5-col511-los-dos-cables-y-el-suelo-rugoso
        dominio: >-
          Planteas el sólido libre del extremo y sabes qué componente de la
          tensión entra en cada ecuación.

  - id: rozamiento
    titulo: Rozamiento, y saber cuándo vale μN
    pide: >-
      Fuerzas mínimas y máximas para que algo no deslice ni vuelque, discos a
      punto de rodar y resistencia a la rodadura.
    porque: >-
      Cuatro de los veinte, y en las tres convocatorias: dos en enero de 2024,
      uno en la ordinaria y uno en la extraordinaria. Es además el tema donde
      más se pierde por escribir μN cuando el cuerpo no está a punto de
      moverse.
    invariante:
      anios: 3
      fuente: >-
        Contado sobre las tres convocatorias: enero de 2024 (n3 y n6),
        ordinaria de 2025 (n2) y extraordinaria de 2025 (n3).
    apunte:
      texto: cae en las tres — 4 de los 20
      tono: nota
    dominio: >-
      Sabes decir en cada apoyo si el rozamiento vale μN o vale lo que pida el
      equilibrio, y compruebas el vuelco además del deslizamiento.
    revisado: '2026-09-13'
    escalones:
      - id: el-techo-del-rozamiento
        titulo: μN es un techo, no un valor
        aprendes: >-
          A escribir el rozamiento como incógnita mientras el cuerpo esté
          quieto, y a usar μN solo en el instante en que está a punto de
          moverse.
        teoria:
          tema: t04-rozamiento
          apartado: el-rozamiento-estático-y-el-cinético
        ejercicios:
          - id: ejma4-desliza-o-vuelca
            incrustado: true
          - id: ejma4-col43-los-dos-bloques-y-el-cable
        dominio: >-
          Ante un apoyo cualquiera decides si su rozamiento es dato, incógnita
          o techo, y lo justificas con el enunciado.
      - id: deslizar-o-volcar
        titulo: Deslizar o volcar, y cuál pasa antes
        aprendes: >-
          A calcular las dos fuerzas críticas y quedarte con la menor, en vez
          de suponer cuál manda.
        teoria:
          tema: t04-rozamiento
          apartado: deslizar-o-volcar
        ejercicios:
          - id: ejma4-col41-el-bloque-que-desliza-o-vuelca
          - id: ejma4-col416-la-barra-sostenida-por-un-bloque
        dominio: >-
          Sacas las dos y dices cuál ocurre antes con un número, no con una
          impresión.
      - id: el-disco-que-no-rueda
        titulo: El disco a punto de rodar, tal como cae
        aprendes: >-
          A plantear a la vez el equilibrio de fuerzas y el de momentos de un
          disco, que es lo que decide si desliza o rueda.
        teoria:
          tema: t04-rozamiento
          apartado: rodar-sin-deslizar
        ejercicios:
          - id: exma2324-1c-3-el-disco-que-no-debe-rodar-cuesta-abajo
            incrustado: true
          - id: exma2425-ord-2-el-rozamiento-que-empuja-la-rueda
            nota: >-
              La rueda con par motor: aquí el rozamiento empuja hacia delante,
              que es lo contrario de lo que dice la intuición.
          - id: exma2425-ext-3-el-bloque-que-sujeta-el-disco
        dominio: >-
          Resuelves un disco con dos contactos y sabes en cuál de los dos se
          agota antes el rozamiento.

  - id: resistencia
    titulo: Resistencia de materiales, el ejercicio largo
    pide: >-
      Diagramas de cortante y flector de una viga, y después las tensiones de
      su sección, casi siempre una T.
    porque: >-
      Cuatro de los veinte, dos en enero de 2024 y dos en la ordinaria de
      2025, y en las dos convocatorias es el ejercicio que más puntúa de la
      hoja. La extraordinaria no lo trae, pero su ejercicio 2 —el que falta
      del cuadernillo— era el que le tocaba.
    invariante:
      anios: 2
      fuente: >-
        Contado sobre las tres convocatorias: enero de 2024 (n4 y n7) y
        ordinaria de 2025 (n4 y n6); la extraordinaria publicada no lo trae.
    apunte:
      texto: el ejercicio largo de dos de las tres
      tono: nota
    dominio: >-
      Dibujas los dos diagramas con el convenio del curso, encuentras el
      flector que manda —que con voladizo está en el apoyo— y sacas la tensión
      máxima de una sección asimétrica.
    revisado: '2026-09-13'
    escalones:
      - id: los-diagramas
        titulo: Los dos diagramas, y dónde está el que manda
        aprendes: >-
          A sacar reacciones, dibujar V y M por tramos y localizar el extremo,
          que no siempre está donde la cortante se anula.
        teoria:
          tema: t06-resistencia-de-materiales
          apartado: cómo-se-dibujan-los-diagramas
          nota: >-
            El simulador del tema deja mover los apoyos y ver cómo el peor
            flector salta del vano al apoyo.
        ejercicios:
          - id: ejma6-col65-la-viga-con-dos-voladizos
            incrustado: true
            nota: >-
              Dos voladizos: el flector del vano vale +1290 kg·m y el del
              apoyo −6000, y es el segundo el que dimensiona.
          - id: ejma6-col67-la-viga-gerber-con-rotula
          - id: exma2425-ord-4-el-equilibrio-de-la-rebanada
            nota: >-
              La cuestión de teoría de la ordinaria: el equilibrio de la
              rebanada, de donde salen las dos relaciones diferenciales.
        dominio: >-
          Ante una viga con voladizo dices, antes de calcular, dónde vas a
          buscar el flector que manda.
      - id: la-seccion-en-t
        titulo: Las tensiones de una sección en T
        aprendes: >-
          A componer el centro de gravedad y la inercia de una T y a decidir
          qué fibra da la tracción máxima, que no es la de siempre.
        teoria:
          tema: t06-resistencia-de-materiales
          apartado: flexión
        ejercicios:
          - id: exma2324-1c-7-la-viga-con-dos-voladizos-y-la-seccion-en-t
            incrustado: true
          - id: exma2425-ord-6-los-diagramas-y-las-tensiones-de-la-viga-en-t
        dominio: >-
          Sacas σ máxima y mínima de una sección asimétrica y sabes decir cuál
          de las dos fibras las da, con el signo del flector delante.
      - id: la-torsion
        titulo: Torsión en sección circular
        aprendes: >-
          A usar τ = M_t·r/I_p en la sección llena y en la hueca, sin
          confundir I_p con I.
        teoria:
          tema: t06-resistencia-de-materiales
          apartado: torsión
        ejercicios:
          - id: exma2324-1c-4-la-torsion-en-una-seccion-circular
            incrustado: true
          - id: ejma6-la-torsion-de-un-eje
        dominio: >-
          Calculas la tensión de torsión de un eje macizo y de uno hueco y
          sabes qué parte de la sección trabaja de verdad.

  - id: estatica
    titulo: Estática del sólido rígido y el diagrama del sólido libre
    pide: >-
      Reacciones de vigas, entramados y piezas articuladas, y sustituir cargas
      repartidas por su resultante.
    porque: >-
      Cuatro de los veinte —uno en enero de 2024 y tres en la ordinaria de
      2025—, y además es el andamio de casi todo lo demás: los ejercicios de
      cables, rozamiento y vigas empiezan siempre por un sólido libre.
    invariante:
      anios: 2
      fuente: >-
        Contado sobre las tres convocatorias: enero de 2024 (n5) y ordinaria
        de 2025 (n3, n5 y n6).
    apunte:
      texto: 4 de los 20, y el andamio de los demás
      tono: neutro
    dominio: >-
      Aíslas la pieza que te conviene, pones la reacción que cada enlace exige
      y respetas la acción y reacción entre dos piezas.
    revisado: '2026-09-13'
    escalones:
      - id: los-enlaces
        titulo: Cada enlace, su reacción
        aprendes: >-
          A sustituir apoyos simples, articulados y empotramientos por lo que
          de verdad transmiten, ni una componente más ni una menos.
        teoria:
          tema: t03-estatica
          apartado: los-enlaces-y-sus-reacciones
        ejercicios:
          - id: ejma3-una-viga-con-dos-apoyos
            incrustado: true
          - id: ejma3-col33-la-mensula-con-dos-rodillos
        dominio: >-
          Dibujas el sólido libre de una pieza cualquiera del enunciado sin
          consultar la tabla de enlaces.
      - id: dos-piezas
        titulo: Dos piezas unidas, y el signo de la articulación
        aprendes: >-
          A escribir la reacción del pasador con el mismo módulo y sentido
          contrario en cada pieza, que es el fallo que más reacciones
          descuadra.
        teoria:
          tema: t03-estatica
          apartado: la-articulación-entre-dos-piezas
        ejercicios:
          - id: ejma3-col36-el-entramado-de-dos-piezas
          - id: exma2425-ord-5-el-bloque-articulado-en-d
            nota: >-
              La ordinaria pide además dónde tiene que estar la articulación
              para que el bloque no vuelque.
        dominio: >-
          Resuelves un entramado de dos piezas y compruebas que las dos
          reacciones del pasador son opuestas.
      - id: la-carga-repartida
        titulo: La carga repartida y dónde se pone su resultante
        aprendes: >-
          A cambiar una carga repartida por una fuerza en el centro de
          gravedad de su diagrama, también cuando es triangular.
        teoria:
          tema: t03-estatica
          apartado: las-fuerzas-externas
        ejercicios:
          - id: exma2425-ord-3-la-resultante-de-una-carga-distribuida
            incrustado: true
          - id: exma2324-1c-5-la-barra-el-resorte-y-el-cable
        dominio: >-
          Colocas la resultante de una repartida cualquiera sin dudar del
          punto, y sabes cuándo no puedes sustituirla.

  - id: calculo-vectorial
    titulo: Cálculo vectorial, que abre las dos hojas
    pide: >-
      Reducir un sistema de vectores: resultante, momento en un punto,
      invariante, momento mínimo y eje central.
    porque: >-
      Dos de los veinte, y las dos veces es la cuestión número 1 de la hoja:
      enero de 2024 y ordinaria de 2025. Poco peso y posición fija, así que se
      estudia entero y se despacha rápido.
    invariante:
      anios: 2
      fuente: >-
        Contado sobre las tres convocatorias: enero de 2024 (n1) y ordinaria
        de 2025 (n1); la extraordinaria abre con geometría de masas.
    apunte:
      texto: siempre la cuestión 1 — 2 de los 20
      tono: neutro
    dominio: >-
      Reduces un sistema a resultante y momento en cualquier punto, y sacas el
      eje central desde un momento conocido en un solo paso.
    revisado: '2026-09-13'
    escalones:
      - id: el-eje-central
        titulo: El eje central y el momento mínimo
        aprendes: >-
          A calcular el invariante, el momento mínimo y el punto del eje
          central más cercano al origen, que es lo que piden las dos veces.
        teoria:
          tema: t01-calculo-vectorial
          apartado: los-dos-invariantes-el-momento-mínimo-y-el-eje-central
        ejercicios:
          - id: ejma1-el-momento-minimo
            incrustado: true
          - id: exma2324-1c-1-el-momento-en-el-origen
            nota: >-
              Al revés de lo habitual: te dan por dónde pasa el eje central y
              piden el momento en el origen.
          - id: exma2425-ord-1-el-eje-central-que-pasa-por-e
        dominio: >-
          Sacas el eje central de un sistema y sabes reconocer cuándo el
          sistema es un par, una fuerza sola o un torsor.

  - id: geometria-de-masas
    titulo: Geometría de masas, la que menos cae
    pide: >-
      Centros de gravedad de figuras compuestas y de revolución, y momentos de
      inercia con Steiner.
    porque: >-
      Uno de los veinte, la cuestión 1 de la extraordinaria de 2025. Va el
      último por eso, pero no se salta: sin el centro de gravedad y la inercia
      de una sección no se cierra el ejercicio de vigas, que sí es largo.
    invariante:
      anios: 1
      fuente: >-
        Contado sobre las tres convocatorias: solo la extraordinaria de 2025
        (n1), aunque su contenido reaparece dentro de los ejercicios de viga
        de las otras dos.
    apunte:
      texto: 1 de los 20 — pero entra en el de vigas
      tono: marco
    dominio: >-
      Compones centros de gravedad e inercias de figuras con huecos y aplicas
      Steiner siempre desde el centro de gravedad.
    falta:
      - >-
        La rotación de ejes y el círculo de Mohr no tienen dónde practicarse:
        el tema los explica, pero la colección de la asignatura no trae ni un
        problema que los pida, y en las tres convocatorias tampoco cae ninguno.
        Lo más cerca que hay son las direcciones principales que la resolución
        del 2.17 calcula de paso.
    revisado: '2026-09-13'
    escalones:
      - id: figuras-compuestas
        titulo: Figuras compuestas, con los huecos restando
        aprendes: >-
          A tratar un agujero como área negativa y a componer el centro de
          gravedad de varias piezas sin promediar a ojo.
        teoria:
          tema: t02-geometria-de-masas
          apartado: figuras-compuestas
        ejercicios:
          - id: ejma2-el-centro-de-gravedad-de-una-ele
            incrustado: true
          - id: exma2425-ext-1-el-hueco-cuadrado-que-fija-el-volumen
            nota: >-
              La cuestión de la extraordinaria: un hueco cuadrado que fija el
              volumen de revolución, con Pappus-Guldin detrás.
        dominio: >-
          Compones una figura con hueco y compruebas que el centro de gravedad
          cae donde la simetría exige.
      - id: steiner
        titulo: Steiner, siempre desde el centro de gravedad
        aprendes: >-
          A trasladar una inercia entre dos ejes cualesquiera pasando por el
          del centro de gravedad, que es el único camino válido.
        teoria:
          tema: t02-geometria-de-masas
          apartado: los-teoremas-de-steiner
        ejercicios:
          - id: ejma2-steiner-desde-el-centro
            incrustado: true
          - id: ejma2-col217-la-placa-con-agujero-circular
            nota: >-
              Con los productos de inercia y el giro de ejes, que es lo que
              queda del tema sin practicar en ninguna convocatoria.
        dominio: >-
          Aplicas Steiner entre dos ejes que no pasan por G en dos pasos, y
          sabes por qué no se puede en uno.
