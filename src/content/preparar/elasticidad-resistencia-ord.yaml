# La ruta del examen final de enero de Elasticidad y Resistencia de
# Materiales, medida sobre las siete finales que hay en el material desde
# 2016-2017: 2016-2017, 2017-2018, 2018-2019, 2019-2020, 2020-2021,
# 2022-2023 y 2025-2026. Son todas las que existen para el sitio. La de
# 2025-2026 llegó en fotos.
#
# El examen de este curso tiene dos partes que se aprueban por separado: la
# 1, elasticidad (temas 1 a 6), y la 2, resistencia de materiales (temas 7 a
# 14; la guía docente de 2026-2027 dice «7-15», y el temario acaba en el 14).
# El primer parcial es solo de la parte 1. Así fue ya la final de 2025-2026,
# con dos hojas de 10 puntos: la parte 1 trajo los temas 2 a 6, y la parte 2,
# del 8 al 13.
#
# La ventana mide cursos en que el reparto era otro. Hasta 2022-2023 el
# primer parcial llegaba al tema 8 (los temas 7 y 8 iban con la elasticidad),
# y las seis finales de 2016-2017 a 2022-2023 son una sola hoja de 10 puntos
# (10,5 la de 2019-2020) que lo mezcla todo: cuatro cuestiones de teoría y
# cuatro problemas. Para que la ruta sirva a la final de este curso, cada
# pregunta de esas seis se cuenta en la parte que su tema tiene este curso:
# la rebanada, las barras y los depósitos, en la parte 2. La ruta va partida
# igual, y cada parte se ordena por su lado.
#
# Todas imprimen los puntos junto a cada pregunta, y por eso aquí se cuentan
# PUNTOS y no solo apariciones: son 60 preguntas y 80,5 puntos, con 57
# ejercicios distintos, porque la distorsión de las aristas cae igual en
# 2018-2019 y 2022-2023 y el flujo cortante en 2018-2019, 2019-2020 y
# 2020-2021. Las finales comparten preguntas con la segunda parte del mismo
# día y con primeros parciales anteriores (su `examen.yaml` apunta al id de
# otra convocatoria): cuentan como preguntas de la final, con los puntos que
# la final les imprime. El reparto por hueco, del 23 de octubre de 2026:
#
#   PARTE 1, elasticidad, temas 1 a 6: 19 preguntas y 24 puntos
#   el tensor de tensiones (tema 2) ............  6 pts     5 preguntas   en 4
#   la cuestión de deformaciones (tema 3) ......  6 pts     5 preguntas   en 4
#   galgas (temas 3 y 4) .......................  6 pts     4 preguntas   en 4
#   teorías de fallo (tema 6) ..................  3 pts     3 preguntas   en 3
#   Hooke y el prisma restringido (tema 4) .....  3 pts     2 preguntas   en 1
#
#   PARTE 2, resistencia de materiales, temas 7 a 14: 41 preguntas y 56,5 puntos
#   la rebanada y los diagramas (tema 7) .......  2 pts     2 preguntas   en 2   (suelo)
#   teoremas energéticos (tema 13) ............. 11,5 pts  7 preguntas   en las 7
#   vigas hiperestáticas (tema 11) .............  9 pts     5 preguntas   en 4
#   barras y sólido rígido (tema 8) ............  8,75 pts  6 preguntas   en 6
#   la sección que trabaja (tema 9) ............  5,5 pts   4 preguntas   en 3
#   flechas y giros (tema 10) ..................  5 pts     4 preguntas   en 3
#   torsión (tema 12) ..........................  4,75 pts  4 preguntas   en 4
#   la cuestión de flexión (tema 9) ............  4,5 pts   4 preguntas   en 4
#   pandeo (tema 14) ...........................  3 pts     3 preguntas   en 3
#   depósitos de pared delgada (tema 8) ........  2,5 pts   2 preguntas   en 2
#
# Qué pregunta va a qué hueco es una lectura humana: cada
# `invariante.fuente` la dice pregunta a pregunta, con la T de teoría y la P
# de problema de cada hoja (la de 2025-2026 numera cada parte desde 1). Las
# sumas las hizo un guion sobre ese reparto y sobre los `puntosImpresos` de
# cada `examen.yaml` (fase-p/p10b/guiones/reparto.mjs), no se hicieron a
# mano. La lectura sigue a la ruta del segundo parcial donde las dos cuentan
# la misma pregunta: el eje colgado de un tirante de 2022-2023 va en las
# vigas hiperestáticas y la barra en arco de 2018-2019 en la sección. La viga
# con platabandas de 2020-2021, que esa ruta usa de práctica en el flujo
# cortante, aquí es una pregunta de la ventana y cuenta en la sección: es un
# problema de 1,5 puntos que dimensiona tornillos, no la cuestión de teoría.
#
# Contada cada final sobre 10 en vez de con sus puntos impresos (la de
# 2025-2026 pesaría la mitad), el orden cambia en dos sitios: en la parte 1
# las galgas pasan delante y el tensor queda tercero, y en la parte 2 las
# barras pasan delante de las vigas hiperestáticas. El criterio de orden lo
# dice.
#
# La ruta es corta a propósito. Este curso la parte 1 es el primer parcial,
# temas 1 a 6, y la parte 2 es la misma hoja que la segunda parte de enero,
# temas 7 a 14; las dos rutas de los parciales tienen la escalera larga de
# cada hueco, con sus hojas de antes de entrar. Aquí cada bloque lleva los
# escalones que piden las finales, con todas sus preguntas, y enlaza el
# bloque largo: los de los temas 2 a 6, en la ruta del primer parcial, y los
# del 7 en adelante, en la del segundo (las barras, la rebanada y los
# depósitos salen este curso de la del primer parcial). La hoja de antes de
# entrar no se repite: se usan las de los dos parciales.
asignatura: elasticidad-resistencia
evaluacion: ordinaria
titulo: Preparar el examen final de enero, por partes
lede: >-
  La final de enero son dos exámenes el mismo día, elasticidad y
  resistencia de materiales, y hay que aprobar los dos. Esta ruta va partida
  igual: sesenta preguntas y 80,5 puntos contados en siete finales. En la
  parte 1 empatan arriba el tensor, las deformaciones y las galgas; en la
  parte 2 mandan los teoremas energéticos, que no han faltado nunca.
temas:
  - t02-tensiones
  - t03-deformaciones
  - t04-cuerpo-elastico
  - t06-teorias-de-fallo
  - t07-piezas-prismaticas
  - t08-esfuerzo-axial
  - t09-flexion-tensiones
  - t10-flexion-deformaciones
  - t11-flexion-hiperestatica
  - t12-torsion
  - t13-teoremas-energeticos
  - t14-pandeo
medidoSobre: 7
criterioDeOrden: >-
  La ruta va partida en dos, como el examen. La guía docente pone dos partes
  al 50 %, con un 5 en cada una: la 1, los temas 1 a 6, y la 2, del 7 al
  último, el 14.
  La primera la tiene liberada quien saca un 6 en el primer parcial: si es tu
  caso, empieza en el bloque de la rebanada, el primero de la parte 2. Dentro
  de cada parte, los bloques van por los
  puntos impresos que cada hueco ha sumado en las siete finales; a igualdad
  de puntos, delante el que cae en más finales, después el que cayó más
  tarde, y si todo empata, el orden del temario. Detrás de las dos partes van
  el simulacro y lo que hay que llevar sabido.


  En la parte 1 empatan tres huecos a 6 puntos y en cuatro finales: el tensor
  y las deformaciones cayeron los dos en 2026 y van por el orden del temario,
  y las galgas, que no caen desde 2023, detrás. En la parte 2, las vigas
  hiperestáticas le sacan un cuarto de punto a las barras por el problema de
  3,5 puntos de 2026, aunque las barras caen en seis finales y ellas en
  cuatro: con tan poca diferencia, empieza por la que te falte. El tema 7 va
  el primero de la parte 2 aunque solo suma 2 puntos propios, porque las
  leyes de esfuerzos de cada tramo son el primer paso de casi todos sus
  problemas.


  Seis de las siete finales de la ventana son de cursos en que el reparto era
  otro: hasta 2022-2023 el primer parcial llegaba al tema 8, y la final era
  una sola hoja que lo mezclaba todo. Cada pregunta de esas finales se cuenta en
  la parte que su tema tiene este curso, así que la rebanada, las barras y
  los depósitos están en la parte 2. La de 2025-2026 ya venía partida así, y
  se cuenta con sus 20 puntos, dos hojas de 10. Contada sobre 10, como las
  demás, las galgas pasarían delante en la parte 1, con el tensor tercero,
  y las barras delante de las vigas hiperestáticas en la parte 2; lo demás no
  se mueve.


  Esta ruta es corta a propósito: la parte 1 es el primer parcial, y la
  parte 2, la misma hoja que la segunda parte de enero. Cada bloque trae los
  escalones que piden las finales, con todas sus preguntas, y enlaza el
  bloque largo de
  [la ruta del primer parcial](/road-to-ingenieria/elasticidad-resistencia/preparar/1par/)
  o de [la del segundo](/road-to-ingenieria/elasticidad-resistencia/preparar/2par/).
  Para el rato de antes de entrar, usa las hojas de esas dos rutas,
  [la del primer parcial](/road-to-ingenieria/elasticidad-resistencia/preparar/1par/antes-de-entrar/)
  y [la del segundo](/road-to-ingenieria/elasticidad-resistencia/preparar/2par/antes-de-entrar/).

bloques:
  # ─────────────────────────────────────────────────────────────────────
  # PARTE 1 · elasticidad, temas 1 a 6 · 19 preguntas y 24 puntos
  # ─────────────────────────────────────────────────────────────────────
  - id: tensor
    titulo: El tensor de tensiones, de las deducciones al problema
    pide: >-
      Una cuestión de 1 punto que pide deducir algo del tema 2 —el equilibrio
      del elemento, el tetraedro de Cauchy o las componentes de un plano
      girado— o, en 2026, un problema con tensiones dadas en el contorno de
      una pieza.
    porque: >-
      Cae en cuatro de las siete finales: cinco preguntas y 6 de los 24 puntos
      de la parte 1. Cuatro son cuestiones de 1 punto, y la quinta es el
      problema 3 de la parte 1 de 2026, de 2 puntos. Ninguna de las siete pide
      las principales de un tensor de 3 × 3, que es el problema del primer
      parcial: esa escalera está en
      [el bloque del tensor de la ruta del primer parcial](/road-to-ingenieria/elasticidad-resistencia/preparar/1par/#tensor).
    invariante:
      anios: 4
      fuente: >-
        Contado pregunta a pregunta: 2016-2017 (T1), 2017-2018 (T1),
        2019-2020 (T1) y 2025-2026 (T1 y P3 de la parte 1). Los puntos son
        los impresos junto a cada pregunta.
    apunte:
      texto: parte 1 · en cuatro de siete — 6 de los 24 puntos
      tono: nota
    dominio: >-
      Escribes sin mirar la deducción del equilibrio del elemento y la de
      Cauchy, das σn y τn de un plano girado con su signo y sacas el tensor de
      una pieza a partir de lo que actúa en sus caras.
    revisado: '2026-10-23'
    escalones:
      - id: el-equilibrio-del-elemento
        titulo: El equilibrio del elemento diferencial
        aprendes: >-
          A escribir las ecuaciones de equilibrio interno con el dibujo del
          elemento, cada tensión con su incremento en la cara opuesta, y a
          demostrar que las tangenciales van por parejas.
        teoria:
          tema: t02-tensiones
          apartado: el-convenio-de-signos-del-curso
          nota: >-
            El equilibrio del elemento va al final del apartado, después del
            convenio, y dice qué se puntúa en la cuestión de examen: el dibujo.
        ejercicios:
          - id: ejerm2-cl2-3-las-fuerzas-de-volumen-de-un-campo
            nota: >-
              El 2.3 de clase: un tensor que cambia de punto a punto y las
              fuerzas de volumen que lo equilibran. Para este escalón cuenta el
              apartado a/; el b/, la parte esférica y la desviadora, es de
              otro apartado del tema.
          - id: exerm1617-1par-1-el-equilibrio-del-elemento-diferencial
            nota: >-
              La cuestión 1 de la final de enero de 2020, que es la del primer
              parcial de 2016-2017 con el mismo enunciado. Pide el dibujo, una
              ecuación de fuerzas y la simetría de las tangenciales.
        dominio: >-
          Dibujas el elemento con solo las tensiones que entran en una
          ecuación, cada una con su incremento, y escribes la ecuación y la
          simetría de las tangenciales sin mirar el tema.
      - id: el-tetraedro-de-cauchy
        titulo: El vector tensión de un plano, y el tetraedro de Cauchy
        aprendes: >-
          A sacar el vector tensión de un plano con la fórmula de Cauchy, a
          partirlo en sus dos componentes intrínsecas y a escribir la
          deducción con el tetraedro cuando la pregunta es de teoría.
        teoria:
          tema: t02-tensiones
          apartado: el-tensor-de-tensiones-y-la-ecuación-de-cauchy
        ejercicios:
          - id: ejerm2-el-vector-tension-de-un-plano
            incrustado: true
            nota: >-
              Nuestro: un tensor dado en xyz y un plano dado por su normal, con
              el tetraedro dibujado. Es la cuenta, antes de la deducción.
          - id: ejerm2-cl2-11-el-vector-tension-desde-las-principales
            nota: >-
              El 2.11 de clase: las principales llegan como vectores, y hay que
              montar el tensor en xyz antes de sacar el vector tensión de un
              plano y sus dos componentes.
          - id: ejerm2-cu1-las-componentes-intrinsecas
            nota: >-
              Cuestión 1 de autoevaluación del tema 2, de teoría: las
              componentes intrínsecas, con un ejemplo nuestro en que el vector
              tensión viene dado sin tensor. La deducción de abajo las da por
              sabidas.
          - id: exerm1819-1par-1-el-tetraedro-de-cauchy
            incrustado: true
            nota: >-
              La teoría 1 de la parte 1 de la final de enero de 2026, que es la
              cuestión del primer parcial de 2018-2019 con el mismo enunciado:
              la deducción, sin números.
          - id: exerm1920-ext-4-las-ecuaciones-de-cauchy
            nota: >-
              La cuestión 4 de la extraordinaria de enero de 2020: la misma
              deducción, pedida como «los componentes del vector tensión en un
              sistema de referencia» y resuelta con otro ejemplo. La deducción
              es la de arriba, y sirve de repaso.
        dominio: >-
          Calculas σn y τn de un plano dado por su normal, y escribes la
          deducción de Cauchy con el dibujo del tetraedro sin mirar el tema.
      - id: el-plano-girado
        titulo: Un plano girado, el círculo de Mohr y el contorno de una pieza
        aprendes: >-
          A escribir σn y τn de cualquier plano de un estado plano en función
          del ángulo doble, a dibujar su círculo de Mohr y a sacar el tensor de
          una pieza a partir de lo que actúa en sus caras.
        teoria:
          tema: t02-tensiones
          apartado: tensión-plana
          nota: >-
            El círculo, que es la misma cuenta dibujada, está en el apartado
            siguiente,
            [el círculo de Mohr](/road-to-ingenieria/elasticidad-resistencia/t02-tensiones/#el-círculo-de-mohr).
        ejercicios:
          - id: ejerm2-circulo-de-mohr-en-tension-plana
            incrustado: true
            nota: >-
              Nuestro: un estado plano con su círculo entero, de las
              principales a la tangencial máxima del punto.
          - id: ejerm2-cu11-tension-plana-en-funcion-del-angulo-doble
            nota: >-
              Cuestión 11 de autoevaluación del tema 2, de teoría: σn y τn de
              cualquier plano, deducidas hasta el ángulo doble, con un ejemplo
              nuestro de signos mezclados.
          - id: ejerm2-cl2-9-del-elemento-girado-a-los-ejes-xy
            nota: >-
              El 2.9 de clase: un elemento girado 60° con lo que actúa en sus
              caras, y el camino de vuelta a los ejes x e y con el círculo.
          - id: exerm1718-ord-1-las-componentes-intrinsecas-en-funcion-de-2-theta
            nota: >-
              La cuestión 1 de la final de enero de 2018: la deducción de la
              cuestión 11 de autoevaluación como pregunta de examen, con la
              relación entre el vector tensión y la normal dada en forma
              matricial, y un ejemplo nuestro con números.
          - id: exerm1617-ord-1-la-traccion-simple-vista-en-un-plano-inclinado
            nota: >-
              La cuestión 1 de la final de enero de 2017, al revés que las
              demás: de una pieza a tracción simple se dan la normal y la
              tangencial de un plano inclinado, y hay que volver a la tensión
              axial y al ángulo; después, el elemento girado 30°.
          - id: exerm2021-ext-5-la-chapa-romboidal-con-tensiones-oblicuas
            nota: >-
              El problema 1 de la extraordinaria de febrero de 2021: una chapa
              en rombo con tensiones oblicuas en sus cuatro lados. Pide el
              tensor en letras y, con un dato más, las principales, la
              deformación tangencial máxima y lo que cambia un lado. Es el que
              más se parece al de 2026.
          - id: exerm2526-ord-7-el-triangulo-en-deformacion-plana
            nota: >-
              El problema 3 de la parte 1 de la final de enero de 2026, de 2
              puntos: un triángulo con tensiones dadas en sus tres caras, en
              deformación plana. Sus apartados c) y d) usan la
              [deformación plana del tema 4](/road-to-ingenieria/elasticidad-resistencia/t04-cuerpo-elastico/#tensión-plana-y-deformación-plana)
              y el criterio de Mohr-Coulomb, que se resuelve con
              [la recta intrínseca del tema 6](/road-to-ingenieria/elasticidad-resistencia/t06-teorias-de-fallo/#los-estados-límite-de-mohr).
              Los dos están más abajo en esta ruta: si no los tienes, deja esos
              dos apartados para después.
        dominio: >-
          Escribes σn y τn de un plano girado con su signo, construyes el
          círculo de un estado plano con el punto de x en su sitio y sacas el
          tensor de un elemento a partir de lo que actúa en sus caras.

  - id: deformaciones
    titulo: La cuestión de deformaciones, que se repite
    pide: >-
      Una cuestión de 1 punto del tema 3: la distorsión sacada de las aristas
      de un elemento deformado, o la compatibilidad en el plano, deducida. En
      2026, además, un problema con un campo de desplazamientos.
    porque: >-
      Cae en cuatro de las siete finales: cinco preguntas y 6 de los 24 puntos
      de la parte 1. Se repite: la distorsión de dos aristas cayó en 2017,
      2019 y 2023, las dos últimas con el mismo enunciado, y la final de 2026
      trajo dos preguntas del tema. La rotación que no deforma, que es la
      cuestión que más se repite en el primer parcial, no ha caído en ninguna
      final; está en
      [el bloque de deformaciones de la ruta del primer parcial](/road-to-ingenieria/elasticidad-resistencia/preparar/1par/#deformaciones).
    invariante:
      anios: 4
      fuente: >-
        Contado pregunta a pregunta: 2016-2017 (T2), 2018-2019 (T1),
        2022-2023 (T1) y 2025-2026 (T4 y P2 de la parte 1). Los puntos son
        los impresos junto a cada pregunta.
    apunte:
      texto: parte 1 · en cuatro de siete — 6 de los 24 puntos
      tono: nota
    dominio: >-
      Escribes de memoria la distorsión de dos aristas deformadas, la exacta
      y la de desplazamientos pequeños, y la deducción de la compatibilidad en
      el plano, y de un campo de desplazamientos lineal sacas el tensor, el
      giro y el cambio de volumen.
    revisado: '2026-10-23'
    escalones:
      - id: la-distorsion-de-dos-aristas
        titulo: La distorsión, sacada de dos aristas deformadas
        aprendes: >-
          A sacar γxy de las dos aristas de un elemento deformado, primero sin
          aproximar y después con desplazamientos pequeños, y a decir qué se
          ha despreciado para pasar de una a otra.
        teoria:
          tema: t03-deformaciones
          apartado: lo-que-le-pasa-a-un-elemento-diferencial
          nota: >-
            Un error típico del apartado habla de la cuestión de las finales:
            las aristas x e y de un elemento ya deformado, y la distorsión que
            sale de ellas.
        ejercicios:
          - id: ejerm3-cu2-las-deformaciones-unitarias
            nota: >-
              Cuestión 2 de autoevaluación del tema 3: las dos deformaciones
              unitarias, en general y con pequeños desplazamientos, con una
              barra nuestra que se alarga y gira a la vez.
          - id: ejerm3-cl3-1-la-disminucion-de-un-angulo-cualquiera
            nota: >-
              El 3.1 de clase: dos direcciones cualesquiera de un punto, y el
              ángulo que forman después de deformarse. Las finales piden la
              misma cuenta con las aristas de los ejes.
          - id: exerm2223-ord-1-la-distorsion-desde-las-aristas-deformadas
            incrustado: true
            nota: >-
              La cuestión 1 de las finales de enero de 2019 y de 2023, con el
              mismo enunciado: las dos aristas de un elemento ya deformado,
              primero sin aproximar y después con desplazamientos pequeños.
          - id: exerm1617-ord-2-la-deformacion-tangencial-de-dos-aristas-en-el-espacio
            nota: >-
              La cuestión 2 de la final de enero de 2017: la misma pregunta con
              las dos aristas saliéndose del plano xy, resuelta con otro
              ejemplo. La deducción es la de arriba, y sirve de repaso.
        dominio: >-
          Escribes γxy a partir de dos aristas deformadas, la exacta y la de
          desplazamientos pequeños, y dices qué se ha despreciado para pasar
          de una a otra.
      - id: el-campo-de-desplazamientos
        titulo: Un campo de desplazamientos, del tensor al volumen
        aprendes: >-
          A derivar un campo de desplazamientos para sacar el tensor de
          deformaciones y el giro, a fijar las constantes del campo con lo que
          dice el enunciado y a sacar el cambio de volumen y las principales.
        teoria:
          tema: t03-deformaciones
          apartado: deformación-y-rotación-el-gradiente-partido-en-dos
          nota: >-
            El cambio de volumen, que también piden, está en
            [cambio de volumen y de forma](/road-to-ingenieria/elasticidad-resistencia/t03-deformaciones/#cambio-de-volumen-y-de-forma).
        ejercicios:
          - id: ejerm3-cl3-2-del-desplazamiento-a-las-principales
            nota: >-
              El 3.2 de clase: de un campo de desplazamientos dado al tensor de
              deformaciones y a sus principales, comprobadas con los
              invariantes.
          - id: ejerm3-cu8-la-variacion-de-volumen
            nota: >-
              Cuestión 8 de autoevaluación del tema 3: la variación de volumen
              de un elemento, con un bloque nuestro de deformaciones dadas.
          - id: ejerm3-cl3-5-el-paralelepipedo-y-el-punto-e
            nota: >-
              Ejercicio de clase: un paralelepípedo con un campo de tres
              constantes, que salen de lo que se mueve un vértice. Después, el
              tensor en un punto y el vector deformación de dos direcciones.
          - id: exerm1920-ext-1-el-campo-de-desplazamientos-del-prisma
            nota: >-
              La cuestión 1 de la extraordinaria de enero de 2020: un prisma
              con un campo lineal y cuatro constantes por fijar, que salen de
              dos condiciones del enunciado.
          - id: exerm2526-ord-6-la-esfera-de-radio-unidad
            nota: >-
              El problema 2 de la parte 1 de la final de enero de 2026, de 2
              puntos: una esfera de radio unidad de la que se sabe dónde acaban
              tres puntos. Pide el campo, el volumen, el giro, las principales
              y los diámetros extremos.
        dominio: >-
          De un campo de desplazamientos lineal sacas el tensor de
          deformaciones, el giro y el cambio de volumen, y fijas sus constantes
          con lo que el enunciado dice de unos puntos.
      - id: la-compatibilidad-en-el-plano
        titulo: La compatibilidad en el plano, deducida
        aprendes: >-
          A deducir la ecuación de compatibilidad del plano desde los
          desplazamientos, con las hipótesis que hacen falta para llegar a
          ella, y a decir qué asegura un campo que la cumple.
        teoria:
          tema: t03-deformaciones
          apartado: las-condiciones-de-compatibilidad
        ejercicios:
          - id: ejerm3-cu10-el-significado-de-la-compatibilidad
            nota: >-
              Cuestión 10 de autoevaluación del tema 3: qué significan las
              condiciones, con un ejemplo nuestro que integra el giro de un
              campo por dos caminos entre los mismos puntos.
          - id: ejerm3-cu11-las-condiciones-que-se-imponen
            nota: >-
              Cuestión 11 de autoevaluación del tema 3: qué se impone, y en qué
              orden, para llegar a la ecuación del plano, con un campo nuestro
              en el que comprobarla.
          - id: exerm1617-1par-4-la-compatibilidad-en-el-plano
            nota: >-
              La cuestión del primer parcial de 2016-2017: la ecuación del
              plano, deducida, y comprobada con un campo de ejemplo. Su primer
              paso es el de la cuestión 10 de arriba con dos desplazamientos, y
              sirve de repaso.
          - id: exerm2526-ord-4-la-compatibilidad-en-el-plano
            nota: >-
              La teoría 4 de la parte 1 de la final de enero de 2026: la misma
              cuestión con otra palabra en el enunciado, resuelta con otro
              ejemplo. La deducción es la de arriba, y sirve de repaso.
        dominio: >-
          Deduces la ecuación de compatibilidad del plano con sus dos
          condiciones de diferencial exacta y dices qué asegura un campo de
          deformaciones que la cumple.

  - id: galgas
    titulo: Galgas, el primer problema de la hoja
    pide: >-
      Un problema de 1,5 puntos: dos, tres o seis galgas, sus deformaciones,
      el tensor de tensiones y una tangencial máxima, un plano o la lectura de
      otra galga.
    porque: >-
      Cae en cuatro de las siete finales, siempre como el problema 1: cuatro
      preguntas y 6 de los 24 puntos de la parte 1. No ha caído desde 2023:
      la parte 1 de 2026 no trae galgas. Del primer parcial cambia poco, salvo
      que en 2021 y en 2023 el estado no es plano. La escalera larga, con las
      rosetas de los parciales, está en
      [el bloque de galgas de la ruta del primer parcial](/road-to-ingenieria/elasticidad-resistencia/preparar/1par/#galgas).
    invariante:
      anios: 4
      fuente: >-
        Contado pregunta a pregunta: 2017-2018 (P1), 2018-2019 (P1),
        2020-2021 (P1) y 2022-2023 (P1). Los puntos son los impresos junto a
        cada pregunta.
    apunte:
      texto: parte 1 · en cuatro de siete — 6 de los 24 puntos
      tono: nota
    dominio: >-
      De las lecturas de unas galgas llegas al tensor de tensiones con la ley
      de Hooke que toca, y sabes qué cambia cuando σz no es cero.
    revisado: '2026-10-23'
    escalones:
      - id: de-las-lecturas-a-las-deformaciones
        titulo: De las lecturas a las deformaciones principales
        aprendes: >-
          A pasar de las tres lecturas de una roseta a las deformaciones del
          plano, y de ellas a las principales con su dirección.
        teoria:
          tema: t03-deformaciones
          apartado: galgas-y-rosetas
        ejercicios:
          - id: ejerm3-roseta-a-45
            incrustado: true
            nota: >-
              Nuestro: la roseta de los apuntes, de las tres lecturas a las
              deformaciones principales.
          - id: ejerm4-cl4-4-tres-galgas-una-sobre-x
            nota: >-
              La primera mitad del 4.4 de clase: tres galgas que no son las de
              las rosetas de los apuntes, y ninguna sobre y. Leer hacia dónde
              va cada una es la mitad del problema.
          - id: ejerm3-cl3-6-tres-galgas-sobre-un-triangulo
            nota: >-
              Ejercicio de clase: tres galgas sobre los lados de un triángulo,
              con el ángulo de la figura en letras; los pasos de cálculo lo
              comprueban con un ejemplo nuestro.
          - id: exerm2021-1par-5-la-roseta-vista-en-un-espejo
            nota: >-
              El problema 1 del primer parcial de 2020-2021: una roseta de tres
              galgas, sus principales y la deformación en una dirección a 45°.
        dominio: >-
          De tres lecturas a cualquier ángulo sacas εx, εy y γxy, y las
          principales con su dirección medida desde x.
      - id: de-las-deformaciones-a-las-tensiones
        titulo: De las deformaciones a las tensiones
        aprendes: >-
          A pasar de εx, εy y γxy a las tensiones, a calcular la εz que las
          galgas no miden y a seguir hasta el plano o la tangencial máxima que
          pida el problema.
        teoria:
          tema: t04-cuerpo-elastico
          apartado: tensión-plana-y-deformación-plana
          nota: >-
            Las fórmulas que se usan después de una roseta, con su error
            típico.
        ejercicios:
          - id: ejerm4-de-la-roseta-a-las-tensiones
            incrustado: true
            nota: >-
              Nuestro: εx, εy y γxy ya resueltas, de números limpios, sin
              lecturas de galgas por medio.
          - id: ejerm4-cu8-tension-plana-y-deformacion-plana
            nota: >-
              Cuestión 8 de autoevaluación del tema 4: los dos estados planos,
              qué es nulo en cada uno y dónde se da, con unas mismas
              deformaciones nuestras llevadas a tensiones en uno y en otro.
          - id: ejerm4-cl4-4-las-tensiones-de-la-roseta
            nota: >-
              La segunda mitad del 4.4 de clase: de las deformaciones del
              escalón de arriba a las tensiones, la εz y el plano perpendicular
              a una galga. Su primer paso es el del ejemplo de arriba, y sirve
              de repaso.
          - id: exerm1819-ord-5-la-roseta-a-30-grados
            nota: >-
              El problema 1 de la final de enero de 2019, sin criterio de
              fallo: tres galgas separadas 30°, y la normal y la tangencial, con
              su sentido, en el plano perpendicular a cada una. El material se
              da con E y G.
          - id: exerm2223-1par-6-dos-galgas-y-sigma-z
            nota: >-
              El problema 2 del primer parcial de 2022-2023: dos galgas y un
              estado con σz, que acaba en tres factores de seguridad.
          - id: exerm1718-ord-5-dos-galgas-a-45-grados-y-sigma-x
            nota: >-
              El problema 1 de la final de enero de 2018: dos galgas a 45° de
              x, una a cada lado. Pide las principales del plano y la
              tangencial máxima en el espacio, y el material se da con E y G.
          - id: exerm2021-ord-5-el-cubo-con-dos-galgas
            nota: >-
              El problema 1 de la final de enero de 2021: un cubo con σz por
              conocer y dos galgas en dos caras distintas, en Kp/cm². Pide las
              dos matrices, la lectura de otra galga, las deformaciones
              principales y las direcciones de la tangencial máxima.
          - id: exerm2223-ord-5-seis-galgas
            nota: >-
              El problema 1 de la final de enero de 2023: seis galgas, sobre
              los tres ejes y las tres bisectrices, y de ellas el tensor de
              deformaciones, las principales, las tensiones y un plano paralelo
              a X sin tensión normal.
        dominio: >-
          Pasas de deformaciones a tensiones con la ley de Hooke que toca,
          calculas la εz que las galgas no miden y sabes qué cambia cuando σz
          no es cero.

  - id: fallo
    titulo: Las teorías de fallo, tres deducciones
    pide: >-
      Una cuestión de 1 punto que pide deducir un criterio: Von Mises desde la
      energía, los estados límite de Mohr o la tensión equivalente de Tresca
      de un tensor dado en letras.
    porque: >-
      Cae en tres de las siete finales, siempre como cuestión: tres preguntas
      y 3 de los 24 puntos de la parte 1. Las tres son de teoría; los
      criterios con números entran dentro de otros problemas, Von Mises en el
      recipiente soldado de 2020 y en los cables del prisma de 2026, y
      Mohr-Coulomb en el triángulo de 2026.
      Empata a puntos con Hooke y va delante porque cae en tres finales y
      Hooke en una. La escalera larga, con Rankine, Saint-Venant y los
      factores de seguridad, está en
      [el bloque de fallo de la ruta del primer parcial](/road-to-ingenieria/elasticidad-resistencia/preparar/1par/#fallo).
    invariante:
      anios: 3
      fuente: >-
        Contado pregunta a pregunta: 2017-2018 (T2), 2022-2023 (T2) y
        2025-2026 (T3 de la parte 1). Los puntos son los impresos junto a cada
        pregunta.
    apunte:
      texto: parte 1 · en tres de siete — 3 de los 24 puntos
      tono: nota
    dominio: >-
      Escribes sin mirar la deducción de Von Mises desde la energía y la del
      criterio de Mohr con su recta intrínseca, y demuestras la tensión
      equivalente de Tresca de un tensor dado.
    revisado: '2026-10-23'
    escalones:
      - id: la-tension-equivalente-de-tresca
        titulo: Tresca, y la tensión equivalente de un tensor
        aprendes: >-
          A sacar la tensión equivalente de Tresca y la de Von Mises de un
          estado dado por sus principales, y a demostrar la de Tresca para un
          tensor dado en letras.
        teoria:
          tema: t06-teorias-de-fallo
          apartado: tangencial-máxima-tresca
          nota: >-
            La tensión equivalente y el factor de seguridad, que usa todo el
            bloque, abren el tema, en
            [tensión equivalente y factor de seguridad](/road-to-ingenieria/elasticidad-resistencia/t06-teorias-de-fallo/#tensión-equivalente-y-factor-de-seguridad).
        ejercicios:
          - id: ejerm6-tresca-con-la-tercera-nula
            incrustado: true
          - id: ejerm6-cu5-el-criterio-de-tresca
            nota: >-
              Cuestión 5 de autoevaluación del tema 6: el criterio de Tresca
              deducido, y un ejemplo nuestro con tres principales no nulas que
              acaba en su factor de seguridad.
          - id: exerm2526-ord-3-la-tension-equivalente-de-tresca
            nota: >-
              La teoría 3 de la parte 1 de la final de enero de 2026: la
              tensión equivalente de Tresca de un tensor con una normal y dos
              tangenciales, que hay que demostrar.
        dominio: >-
          Das la tensión equivalente de Tresca y la de Von Mises de un estado
          con las tres principales bien ordenadas, y demuestras la fórmula de
          Tresca de un tensor con una sola normal.
      - id: los-estados-limite-de-mohr
        titulo: El criterio de los estados límite de Mohr
        aprendes: >-
          A usar la tensión equivalente de Mohr con la k de dos ensayos, a
          sacar un límite que no se ha ensayado y a deducir el criterio desde
          la curva intrínseca.
        teoria:
          tema: t06-teorias-de-fallo
          apartado: los-estados-límite-de-mohr
        ejercicios:
          - id: exerm2021-1par-4-el-limite-a-compresion-por-mohr
            incrustado: true
            nota: >-
              La cuestión del primer parcial de 2020-2021: un ensayo de
              tracción y uno de cortadura pura, y de ellos el límite a
              compresión.
          - id: exerm2223-1par-4-dos-estados-limite-de-mohr
            nota: >-
              La cuestión del primer parcial de 2022-2023: dos estados límite
              que se encadenan, y por el camino la k. Su primer paso sale ya en
              el de arriba, y sirve de repaso.
          - id: exerm1819-1par-3-el-criterio-de-los-estados-limites-de-mohr
            nota: >-
              La cuestión 2 de la final de enero de 2023, que es la del primer
              parcial de 2018-2019 con el mismo enunciado: el criterio
              deducido, de pura teoría. Sus dos círculos son los del primero
              del escalón, y sirve de repaso.
          - id: exerm1617-ext-1-el-criterio-de-mohr-deducido
            nota: >-
              La cuestión 1 de la extraordinaria de junio de 2017: la misma
              teoría con «Deducir el» delante, y un ejemplo nuestro con las
              tres principales. La deducción es la de arriba, y sirve de
              repaso.
        dominio: >-
          Sacas k de dos ensayos cualesquiera, das con ella un límite que no se
          ha ensayado y escribes la deducción del criterio con su dibujo.
      - id: von-mises-desde-la-energia
        titulo: Von Mises, deducido de la energía
        aprendes: >-
          A partir la energía de deformación de un punto en sus dos partes y a
          deducir de ella la tensión equivalente de Von Mises, comprobada con
          cortadura pura.
        teoria:
          tema: t06-teorias-de-fallo
          apartado: energía-de-distorsión-von-mises
        ejercicios:
          - id: ejerm2-cu12-las-componentes-esferica-y-desviadora
            nota: >-
              Cuestión 12 de autoevaluación del tema 2: las componentes
              esférica y desviadora del tensor, con un ejemplo nuestro. Es
              teoría del tema 2 que la deducción de abajo da por sabida.
          - id: ejerm4-cu9-la-energia-elastica-de-deformacion
            nota: >-
              Cuestión 9 de autoevaluación del tema 4: la energía de
              deformación por unidad de volumen, deducida, con un estado plano
              nuestro en el que calcularla. Es el punto de partida que las
              cuestiones de examen dan hecho.
          - id: exerm1920-1par-3-von-mises-desde-la-energia-de-distorsion
            incrustado: true
            nota: >-
              La cuestión del primer parcial de 2019-2020, con la cortadura
              pura de comprobación al final.
          - id: exerm1718-ord-2-el-criterio-de-von-mises-desde-la-energia
            nota: >-
              La cuestión 2 de la final de enero de 2018: la de arriba con
              otras palabras, la energía dada como 2U0, y un ejemplo nuestro
              con números.
          - id: exerm2526-1par-3-la-tension-equivalente-de-von-mises
            nota: >-
              La pregunta 3 del primer parcial de 2025-2026: la misma deducción
              sin ningún dato en el enunciado. La deducción es la de arriba, y
              sirve de repaso.
        dominio: >-
          Escribes la deducción de Von Mises desde la energía y compruebas que
          en cortadura pura da el factor √3.
    falta:
      - >-
        El escalón de los estados límite de Mohr no tiene ejemplo nuestro ni
        ejercicio de práctica. El tema 6 no trae ninguno de Mohr, y el escalón
        empieza en la cuestión del primer parcial de 2020-2021, incrustada.

  - id: hooke
    titulo: Hooke, el prisma que no se puede deformar
    pide: >-
      Un prisma o un cubo al que algo le impide deformarse, una cavidad
      rígida o unas placas unidas por cables, a veces con temperatura: las
      tensiones y las deformaciones que quedan.
    porque: >-
      Cae solo en la final de 2026, con dos preguntas: el cubo en una cavidad
      rígida, de 1 punto, y el prisma de hormigón entre placas y cables, de 2.
      Son 3 de los 24 puntos de la parte 1, los mismos que las teorías de
      fallo, que van delante porque caen en tres finales. Antes de 2026 el
      tema 4 entraba en las finales por las galgas. Las ecuaciones de Lamé y
      las cotas de ν, que caen en el primer parcial, están en
      [el bloque de Hooke de su ruta](/road-to-ingenieria/elasticidad-resistencia/preparar/1par/#hooke).
    invariante:
      anios: 1
      fuente: >-
        Contado pregunta a pregunta: 2025-2026 (T2 y P1 de la parte 1). Los
        puntos son los impresos junto a cada pregunta.
    apunte:
      texto: parte 1 · solo en la de 2026 — 3 de los 24 puntos
      tono: neutro
    dominio: >-
      Escribes las tres ecuaciones de Hooke de un prisma restringido,
      igualas a cero las que toca y, con unos cables, escribes la
      compatibilidad entre lo que se alarga el prisma y lo que se alargan
      ellos.
    revisado: '2026-10-23'
    escalones:
      - id: el-prisma-restringido
        titulo: El prisma en un hueco rígido, o entre placas y cables
        aprendes: >-
          A escribir la ley de Hooke de un prisma al que algo le impide
          deformarse, con temperatura o sin ella, y a resolver un prisma
          entre dos placas unidas por cables.
        teoria:
          tema: t04-cuerpo-elastico
          apartado: un-prisma-en-un-hueco-rígido
        ejercicios:
          - id: ejerm4-cubo-en-un-hueco-rigido
            incrustado: true
          - id: ejerm4-cu2-la-ley-de-hooke
            nota: >-
              Cuestión 2 de autoevaluación del tema 4: la ley de Hooke escrita
              entera, de dónde sale cada término, con un elemento nuestro de
              tres normales y una tangencial.
          - id: ejerm4-cl4-1-el-cuerpo-libre-en-z
            nota: >-
              El 4.1 de clase: un cuerpo cargado dentro de un hueco, todo en
              letras, con las tres aristas además del volumen; los pasos de
              cálculo lo comprueban con ν = 0,25.
          - id: ejerm4-cu7-el-efecto-de-la-temperatura
            nota: >-
              Cuestión 7 de autoevaluación del tema 4: la temperatura en la ley
              de Hooke, con un prisma nuestro que se calienta entre dos
              paredes.
          - id: ejerm4-cl4-3-el-hueco-y-la-temperatura
            nota: >-
              El 4.3 de clase: el hueco del 4.1 con una variación de
              temperatura, y la que deja el volumen sin cambiar. La cuestión de
              2026, que viene detrás, también lleva temperatura.
          - id: exerm2526-ord-2-el-cubo-en-la-cavidad-rigida
            nota: >-
              La teoría 2 de la parte 1 de la final de enero de 2026: un cubo
              en una cavidad rígida y un cambio de temperatura. Pide los dos
              tensores en letras.
          - id: exerm2223-1par-2-los-bloques-en-el-marco-rigido
            nota: >-
              La cuestión del primer parcial de 2022-2023: dos bloques en un
              mismo marco rígido, uno cargado y el otro no, y lo que baja la
              cara libre del segundo.
          - id: exerm1213-1par-4-el-prisma-entre-placas-y-cuatro-cables
            nota: >-
              El problema 1 del primer parcial de 2012-2013: un prisma entre
              dos placas rígidas unidas por cuatro cables, y su cambio de
              volumen. Es el montaje del de 2026, con la mitad de cables.
          - id: exerm2526-ord-5-el-prisma-de-hormigon-y-los-ocho-cables
            nota: >-
              El problema 1 de la parte 1 de la final de enero de 2026, de 2
              puntos: el prisma entre placas y cables, con ocho cables y de
              hormigón, y al final la tangencial en el plano de una
              microfisura. Su primer paso es el del prisma de arriba, y sirve
              de repaso.
        dominio: >-
          Escribes las tres ecuaciones de Hooke de un prisma restringido,
          igualas a cero las que toca y sacas la tensión y la deformación que
          quedan, también con los cables.

  # ─────────────────────────────────────────────────────────────────────
  # PARTE 2 · resistencia de materiales, del tema 7 en adelante
  # 41 preguntas y 56,5 puntos
  # ─────────────────────────────────────────────────────────────────────
  - id: esfuerzos
    titulo: La rebanada y las leyes de esfuerzos, el suelo de la parte 2
    pide: >-
      Una cuestión de 1 punto del tema 7: las ecuaciones de equilibrio de la
      rebanada, deducidas, o una viga que hay que reconstruir desde su
      diagrama de cortantes. Y dentro de casi todos los problemas, las leyes
      de cada tramo.
    porque: >-
      Son dos preguntas propias en dos de las siete finales, 2 de los 56,5
      puntos de la parte 2: en 2017, la viga que sale de su diagrama de
      cortantes, y en 2020, la rebanada. Va el primero de la parte 2 por otra
      razón: las leyes de cada tramo son el primer paso de casi todos sus
      problemas, de Castigliano a la sección que se dimensiona. La escalera
      larga, con estas dos preguntas dentro, está en
      [el bloque de los diagramas de la ruta del segundo parcial](/road-to-ingenieria/elasticidad-resistencia/preparar/2par/#diagramas),
      y el convenio de signos, en
      [su suelo](/road-to-ingenieria/elasticidad-resistencia/preparar/2par/#suelo).
    invariante:
      anios: 2
      fuente: >-
        Contado pregunta a pregunta: 2016-2017 (T3) y 2019-2020 (T2). Los
        puntos son los impresos junto a cada pregunta.
    apunte:
      texto: parte 2 · el suelo, en dos de siete — 2 de los 56,5 puntos
      tono: marco
    dominio: >-
      Deduces las ecuaciones de la rebanada con su dibujo, escribes la
      cortante y el flector de cada tramo de una viga con rótula y dibujas
      sus diagramas sin mirar la resolución.
    revisado: '2026-10-23'
    escalones:
      - id: el-equilibrio-de-la-rebanada
        titulo: Las ecuaciones de la rebanada
        aprendes: >-
          A deducir las tres ecuaciones de la rebanada con su dibujo, cada
          esfuerzo con el convenio del curso, y a leer en ellas lo que dicen
          de los diagramas.
        teoria:
          tema: t07-piezas-prismaticas
          apartado: el-equilibrio-de-la-rebanada
        ejercicios:
          - id: ejerm7-la-rebanada-con-la-carga-vertical-arriba
            incrustado: true
            nota: >-
              Nuestro: la rebanada con una carga vertical apoyada en su cara de
              arriba, y un voladizo con números.
          - id: ejerm7-cu5-la-carga-lineal
            nota: >-
              Cuestión 5 de autoevaluación del tema 7: la cortante y el flector
              bajo una carga repartida lineal, y el flector máximo con ellos.
          - id: exerm1920-ord-2-las-ecuaciones-de-equilibrio-de-la-pieza-recta
            nota: >-
              La cuestión 2 de la final de enero de 2020: la deducción, de 1
              punto, resuelta con un tramo nuestro de carga que crece con x.
              La deducción es la del ejemplo de arriba, y sirve de repaso.
        dominio: >-
          Deduces las tres ecuaciones de la rebanada con su dibujo, dices
          respecto de qué punto tomas momentos y las usas para sacar el flector
          máximo de un tramo.
      - id: las-leyes-tramo-a-tramo
        titulo: Las leyes de cada tramo, y el camino al revés
        aprendes: >-
          A sacar las reacciones de una viga con rótula, escribir la cortante y
          el flector de cada tramo y dibujar sus diagramas, y a hacer el camino
          al revés, de un diagrama de cortantes a las cargas.
        teoria:
          tema: t07-piezas-prismaticas
          apartado: cómo-se-dibujan-los-diagramas
        ejercicios:
          - id: ejerm7-la-viga-con-rotula
            incrustado: true
            nota: >-
              El ejemplo del tema: una viga empotrada con una rótula, resuelta
              hasta el flector máximo del vano.
          - id: ejerm7-cl7-5-la-viga-con-voladizo-y-un-par-de-20-kn-m
            nota: >-
              Ejercicio de clase: una viga con voladizo, dos fuerzas y un par
              concentrado entre los apoyos.
          - id: exerm2021-1par-6-la-gerber-empotrada-con-la-rotula-en-c
            nota: >-
              El problema 2 del primer parcial de 2020-2021, de 2 puntos: los
              diagramas de una Gerber empotrada, el nivel que piden los
              problemas de la parte 2 antes de llegar a la sección. Su primer
              paso, por dónde se empieza, es el del ejemplo de arriba, y sirve
              de repaso.
          - id: exerm1617-ord-3-la-viga-que-se-deduce-del-diagrama-de-cortantes
            nota: >-
              La cuestión 3 de la final de enero de 2017, al revés que las
              demás: se da el diagrama de cortantes de una viga apoyada en los
              extremos, sin pares, y hay que reconstruir las cargas y dibujar
              el de flectores.
        dominio: >-
          Dibujas los diagramas de una viga con rótula con sus valores en los
          puntos clave, y de un diagrama de cortantes sacas las cargas que lo
          producen.

  - id: energia
    titulo: Los teoremas energéticos, el problema que no ha faltado nunca
    pide: >-
      El último problema de la hoja: un pórtico o una barra quebrada, casi
      siempre en el espacio y casi siempre con un apoyo, un muelle o un
      resorte de más. Se pide la incógnita, un desplazamiento y a veces una
      tensión.
    porque: >-
      Cae en las siete finales, sin una excepción, siempre como problema:
      siete preguntas y 11,5 de los 56,5 puntos de la parte 2, más que ningún
      otro hueco del examen. Cinco de las siete son hiperestáticas, y desde
      2018 cinco de las seis son una pieza en el espacio, con flexión y
      torsión a la vez; la otra, la canasta de 2021, es plana. La escalera
      larga, con la reciprocidad y los pórticos de las extraordinarias, está
      en
      [el bloque de energía de la ruta del segundo parcial](/road-to-ingenieria/elasticidad-resistencia/preparar/2par/#energia).
    invariante:
      anios: 7
      fuente: >-
        Contado pregunta a pregunta: 2016-2017 (P4), 2017-2018 (P4),
        2018-2019 (P4), 2019-2020 (P4), 2020-2021 (P2), 2022-2023 (P4) y
        2025-2026 (P2 de la parte 2). Los puntos son los impresos junto a cada
        pregunta.
    apunte:
      texto: parte 2 · en las siete — 11,5 de los 56,5 puntos
      tono: nota
    dominio: >-
      Ante un pórtico o una barra quebrada cuentas las incógnitas que la
      estática no cierra, escribes el flector y el torsor de cada tramo con
      sus propios ejes, y sabes qué condición cierra cada incógnita cuando lo
      que sujeta el punto es un apoyo, un muelle o un resorte.
    revisado: '2026-10-23'
    escalones:
      - id: castigliano-y-la-fuerza-unidad
        titulo: Engesser-Castigliano y la fuerza unidad
        aprendes: >-
          A enunciar el teorema de Engesser-Castigliano y a sacar con él el
          desplazamiento de un punto de una estructura isostática.
        teoria:
          tema: t13-teoremas-energeticos
          apartado: la-fuerza-unitaria
          nota: >-
            El teorema que lo justifica está en
            [Castigliano y Engesser-Castigliano](/road-to-ingenieria/elasticidad-resistencia/t13-teoremas-energeticos/#castigliano-y-engesser-castigliano).
        ejercicios:
          - id: exerm1920-2par-2-engesser-castigliano-y-la-carga-unitaria
            nota: >-
              La cuestión 2 de la segunda parte de enero de 2020, de 1 punto:
              el teorema y el método, sin una estructura que calcular. No cayó
              en la final de ese día; aquí va de peldaño.
          - id: exerm2021-ord-6-la-canasta-de-baloncesto
            nota: >-
              El problema 2 de la final de enero de 2021, de 1,5 puntos: el
              soporte de una canasta, isostático y en un plano. Pide el
              diámetro del tubo por el descenso de un punto.
        dominio: >-
          Sacas el desplazamiento de un punto de una estructura isostática de
          dos tramos con la fuerza unidad, con todos los términos que pida el
          enunciado.
      - id: la-incognita-de-mas
        titulo: El pórtico plano hiperestático
        aprendes: >-
          A quitar los enlaces que sobran, dejar sus fuerzas como incógnitas
          y escribir la condición que cierra cada una con la coenergía, en un
          pórtico con un muelle o con una rótula.
        teoria:
          tema: t13-teoremas-energeticos
          apartado: hiperestáticos-la-incógnita-y-lo-que-hacía
        ejercicios:
          - id: ejerm13-el-portico-con-un-muelle
            incrustado: true
            nota: >-
              El ejemplo del tema: un pórtico en L con un muelle bajo la punta,
              con la incógnita ya elegida en el enunciado.
          - id: exerm1617-2par-7-el-portico-con-rotula-en-c
            nota: >-
              El problema 4 de la final de enero de 2017, que es el 3 de la
              segunda parte: un pórtico de tres barras con una rótula, sin
              muelle. Pide además el giro de un apoyo.
        dominio: >-
          Cuentas las incógnitas que sobran en un pórtico con un muelle o una
          rótula, escribes la condición que cierra cada una y sacas con ellas
          un giro o un desplazamiento.
      - id: la-barra-quebrada-en-el-espacio
        titulo: La barra quebrada en el espacio
        aprendes: >-
          A escribir el flector y el torsor de cada tramo de una pieza con
          tramos perpendiculares, cada uno en sus ejes, y a llevarlos a la
          coenergía con la incógnita de un apoyo, un muelle o un resorte.
        teoria:
          tema: t13-teoremas-energeticos
          apartado: barras-quebradas-en-el-espacio
          nota: >-
            El apartado la resuelve en una figura, con dos tramos y una carga.
        ejercicios:
          - id: exerm1718-2par-7-la-estructura-espacial-de-seccion-rectangular-hueca
            nota: >-
              El problema 4 de la final de enero de 2018, que es el 3 de la
              segunda parte: isostático, pide un desplazamiento y una tensión
              máxima, y es el peldaño de entrada.
          - id: exerm2223-2par-7-la-barra-quebrada-con-un-muelle
            nota: >-
              El problema 4 de la final de enero de 2023: una estructura en el
              espacio con un muelle. Pide la fuerza del muelle, lo que se
              deforma y un desplazamiento.
          - id: exerm1920-2par-7-la-estructura-espacial-con-un-par-en-d
            nota: >-
              El problema 4 de la final de enero de 2020: cinco tramos, un
              apoyo en un extremo y un par aplicado en otro punto.
          - id: exerm1819-2par-7-la-barra-quebrada-con-el-apoyo-en-c
            nota: >-
              El problema 4 de la final de enero de 2019: dos tramos, empotrada
              en un extremo y apoyada en el otro. Además de la reacción pide los
              esfuerzos del empotramiento y una tensión tangencial máxima. La
              reacción se cierra como la del apoyo de arriba, y sirve de
              repaso.
          - id: exerm2526-2par-5-la-barra-quebrada-con-un-resorte-en-b
            nota: >-
              El problema 2 de la parte 2 de la final de enero de 2026, de 2,5
              puntos y el más reciente: dos tramos perpendiculares, un resorte
              y una fuerza con tres componentes. Su primer paso es el de los de
              arriba con un resorte, y sirve de repaso.
        dominio: >-
          Ante una barra quebrada con un apoyo, un muelle o un resorte escribes
          el flector y el torsor de cada tramo con sus ejes, cierras la
          incógnita y das el desplazamiento que piden sin mirar la resolución.
    falta:
      - >-
        Los siete ejercicios de clase del tema 13 (13.1 a 13.7) y sus
        cuestiones de autoevaluación no están en el sitio. El tema tiene un
        solo ejemplo, el pórtico con un muelle, y los escalones de la fuerza
        unidad y de la barra quebrada empiezan en ejercicios de examen. Es el
        mismo hueco que declara la ruta del segundo parcial.

  - id: hiperestatica
    titulo: Las vigas hiperestáticas, con la pregunta que más vale
    pide: >-
      Una viga con más enlaces de los que el equilibrio resuelve, con un
      muelle, dos rótulas o un voladizo, o dos piezas que se pasan una fuerza:
      la incógnita, los diagramas y a veces la sección.
    porque: >-
      Cae en cuatro de las siete finales: cinco preguntas y 9 de los 56,5
      puntos de la parte 2, con el problema de 3,5 puntos de 2026, la
      pregunta que más ha valido en la ventana. La de 2023 trajo dos, las
      vigas cruzadas y el eje colgado de un tirante; las otras son una viga
      sobre un muelle, en 2020, y una empotrada en los dos extremos con dos
      rótulas, en 2021. La escalera larga, con las extraordinarias, está en
      [el bloque de vigas hiperestáticas de la ruta del segundo parcial](/road-to-ingenieria/elasticidad-resistencia/preparar/2par/#hiperestatica).
    invariante:
      anios: 4
      fuente: >-
        Contado pregunta a pregunta: 2019-2020 (P2), 2020-2021 (P3),
        2022-2023 (T4 y P2) y 2025-2026 (P1 de la parte 2). Los puntos son los
        impresos junto a cada pregunta.
    apunte:
      texto: parte 2 · en cuatro de siete — 9 de los 56,5 puntos
      tono: nota
    dominio: >-
      Ante una viga con un enlace de más quitas uno, escribes lo que el enlace
      no dejaba hacer con la tabla de vigas o con los tres momentos, y de la
      incógnita sacas los diagramas.
    revisado: '2026-10-23'
    escalones:
      - id: quitar-un-enlace
        titulo: Quitar un enlace y pedir lo que hacía
        aprendes: >-
          A contar las incógnitas que sobran, quitar un enlace y sustituirlo
          por su fuerza, y escribir lo que ese enlace no dejaba hacer con la
          tabla de vigas.
        teoria:
          tema: t11-flexion-hiperestatica
          apartado: un-solo-tramo-quitar-un-enlace-y-pedir-lo-que-hacía
          nota: >-
            Las flechas y los giros salen de la
            [tabla de vigas elementales del tema 10](/road-to-ingenieria/elasticidad-resistencia/t10-flexion-deformaciones/#integrar-la-ecuación-tramo-a-tramo),
            que el apartado enlaza: no hace falta haber hecho antes el bloque
            de las flechas, que va más abajo.
        ejercicios:
          - id: ejerm11-la-viga-empotrada-y-apoyada
            incrustado: true
            nota: >-
              El ejemplo del tema: una viga empotrada y apoyada con una carga
              uniforme, de la reacción al flector máximo del vano.
          - id: exerm2021-ord-7-la-viga-con-dos-rotulas
            nota: >-
              El problema 3 de la final de enero de 2021, de 1,5 puntos: una
              viga empotrada en los dos extremos, con dos rótulas y un apoyo
              entre ellas. Pide además una flecha y los dos giros de una
              rótula.
          - id: exerm1920-2par-5-la-viga-empotrada-sobre-un-resorte
            nota: >-
              El problema 2 de la final de enero de 2020, que es el 1 de la
              segunda parte: la viga apoya en un muelle, y el problema sigue
              hasta los diagramas y la longitud que da la tensión máxima, del
              tema 9.
        dominio: >-
          Ante una viga con un apoyo, un muelle o una rótula de más dices
          cuántas incógnitas sobran, eliges cuál quitar y escribes su condición
          antes de calcular nada.
      - id: los-tres-momentos
        titulo: Los tres momentos, en una viga continua
        aprendes: >-
          A deducir la ecuación de los tres momentos y a aplicarla a una viga
          continua con voladizo, empotramiento o muelle, hasta sus
          diagramas.
        teoria:
          tema: t11-flexion-hiperestatica
          apartado: vigas-continuas-el-teorema-de-los-tres-momentos
          nota: >-
            El apartado trae un ejemplo de dos vanos resuelto.
        ejercicios:
          - id: exerm1920-2par-4-la-ecuacion-de-los-tres-momentos
            nota: >-
              La cuestión 4 de la segunda parte de enero de 2020, de 1 punto:
              la deducción. No cayó en la final de ese día; aquí va de
              peldaño.
          - id: exerm2526-2par-4-la-viga-continua-y-la-seccion-en-pi
            nota: >-
              El problema 1 de la parte 2 de la final de enero de 2026, de 3,5
              puntos, la pregunta que más ha valido en la ventana. La hoja
              imprime la ecuación de los tres momentos, y el problema acaba en
              el espesor de una sección en π, del tema 9.
          - id: exerm2122-ext-6-la-viga-continua-con-un-resorte-en-b
            nota: >-
              El problema 2 de la extraordinaria de febrero de 2022: los tres
              momentos con un voladizo, un empotramiento y un resorte. Pide
              además un desplazamiento.
        dominio: >-
          Escribes la ecuación de los tres momentos de memoria, con cada
          distancia en su sitio, y la aplicas a una viga con voladizo y
          empotramiento hasta los diagramas.
      - id: dos-piezas-que-se-pasan-una-fuerza
        titulo: Dos piezas que se pasan una fuerza
        aprendes: >-
          A resolver dos vigas que se apoyan una en otra, o un eje colgado de
          un tirante, con la fuerza que se pasan como incógnita.
        teoria:
          tema: t11-flexion-hiperestatica
          apartado: vigas-continuas-el-teorema-de-los-tres-momentos
          nota: >-
            Las vigas cruzadas van al final del apartado, después del ejemplo
            de dos vanos.
        ejercicios:
          - id: exerm2223-2par-2-las-vigas-cruzadas
            nota: >-
              La cuestión 4 de la final de enero de 2023, de 1 punto: dos vigas
              cruzadas, una apoyada en la otra.
          - id: exerm2223-2par-5-el-eje-y-el-tirante
            nota: >-
              El problema 2 de la final de enero de 2023: un eje corto
              empotrado y colgado de un tirante. Va el último del bloque porque
              junta herramientas de varios temas: si alguna no la tienes
              todavía, déjalo para el final de la ruta.
        dominio: >-
          Ante dos piezas que se tocan en un punto escribes la fuerza que se
          pasan y la condición que la cierra, con lo que se mueve cada una
          sacado de su tabla.
    falta:
      - >-
        Los ejercicios de clase del tema 11 (11.1 a 11.6) y sus cuestiones de
        autoevaluación no están en el sitio. El primer escalón sube del único
        ejemplo del tema a los problemas de examen, y los otros dos empiezan en
        ejercicios de examen. Es el mismo hueco que declara la ruta del segundo
        parcial.

  - id: barras
    titulo: Barras y sólido rígido, en seis de las siete
    pide: >-
      Una pieza rígida sujeta por dos, tres o cuatro barras o cables, casi
      siempre con una barra calentada: los axiles y el desplazamiento de un
      punto.
    porque: >-
      Cae en seis de las siete finales, más que ningún otro hueco salvo la
      energía: seis preguntas y 8,75 de los 56,5 puntos de la parte 2. Cuatro
      de las seis llevan una barra calentada. Hasta 2022-2023 el tema 8
      entraba en el primer parcial; este curso es de la parte 2, y su bloque
      largo está en
      [la ruta del segundo parcial](/road-to-ingenieria/elasticidad-resistencia/preparar/2par/#barras).
    invariante:
      anios: 6
      fuente: >-
        Contado pregunta a pregunta: 2016-2017 (P1), 2017-2018 (P2),
        2018-2019 (P2), 2019-2020 (P3), 2020-2021 (T2) y 2025-2026 (T2 de la
        parte 2). Los puntos son los impresos junto a cada pregunta.
    apunte:
      texto: parte 2 · en seis de siete — 8,75 de los 56,5 puntos
      tono: nota
    dominio: >-
      Ante una pieza rígida con barras cuentas las incógnitas, escribes la
      compatibilidad con el giro pequeño y la temperatura dentro, y dices
      antes de calcular cuántas ecuaciones te faltan.
    revisado: '2026-10-23'
    escalones:
      - id: dos-barras-que-comparten-la-carga
        titulo: Dos barras que comparten una carga
        aprendes: >-
          A repartir una carga entre dos barras de distinto material que la
          sostienen juntas.
        teoria:
          tema: t08-esfuerzo-axial
          apartado: isostático-o-hiperestático
        ejercicios:
          - id: ejerm8-la-varilla-y-el-tubo-que-cuelgan-juntos
            incrustado: true
            nota: >-
              Nuestro: dos piezas de distinto material que cuelgan del techo y
              sostienen la misma placa.
          - id: exerm2021-ord-2-la-barra-rigida-y-los-dos-cables
            nota: >-
              La cuestión 2 de la final de enero de 2021: una barra rígida
              colgada de dos cables del mismo diámetro y distinto módulo, y
              dónde poner la carga para que baje sin girar.
        dominio: >-
          Dices de un vistazo si dos barras que comparten una carga son un
          problema hiperestático y escribes la ecuación que falta antes de
          calcular.
      - id: la-pieza-rigida-que-gira
        titulo: La pieza rígida que gira
        aprendes: >-
          A escribir cómo se mueve cada punto de una pieza rígida que gira un
          ángulo pequeño, y cuánto se alarga cada barra que la sujeta.
        teoria:
          tema: t08-esfuerzo-axial
          apartado: el-sólido-rígido-y-sus-barras
        ejercicios:
          - id: ejerm8-la-barra-rigida-colgada
            incrustado: true
          - id: ejerm8-cla6-la-pieza-en-l-y-la-barra-a-45
            nota: >-
              La propuesta A6 de clase: una pieza en L colgada de un punto, con
              una barra vertical y otra a 45°.
          - id: exerm1819-2par-5-la-viga-rigida-y-las-cuatro-barras
            nota: >-
              El problema 2 de la final de enero de 2019, que es el 1 de la
              segunda parte: una viga rígida sin articular, colgada del techo
              por cuatro barras. Pide además un desplazamiento horizontal.
        dominio: >-
          Cuentas incógnitas y ecuaciones de una pieza rígida con barras, y
          escribes el alargamiento de cada barra en función del giro.
      - id: la-barra-que-cambia-de-temperatura
        titulo: La barra que cambia de temperatura
        aprendes: >-
          A meter el término térmico en el alargamiento de cada barra y a decir
          antes de calcular si la temperatura carga las barras o solo mueve la
          pieza.
        teoria:
          tema: t08-esfuerzo-axial
          apartado: barras-entre-paredes-holguras-y-muelles
        ejercicios:
          - id: ejerm8-la-barra-calentada-que-toca-la-pared
            incrustado: true
            nota: >-
              Nuestro: una barra que se calienta y llega a tocar una pared.
          - id: ejerm8-cl8-1-la-viga-con-una-barra-calentada
            nota: >-
              El 8.1 de clase: una viga rígida articulada, con dos barras y una
              de ellas calentada.
          - id: exerm2526-2par-2-la-barra-cd-calentada
            nota: >-
              La teoría 2 de la parte 2 de la final de enero de 2026, de 1,25
              puntos: una pieza rígida y una barra a 45° que cambia de
              temperatura. Pide dos desplazamientos.
          - id: exerm1718-2par-5-la-viga-rigida-cd-y-la-barra-calentada
            nota: >-
              El problema 2 de la final de enero de 2018, que es el 1 de la
              segunda parte: una viga rígida apoyada en un punto intermedio y
              dos barras inclinadas, sin carga, con una de ellas calentada.
          - id: exerm1920-2par-6-la-barra-rigida-aob-con-dos-barras
            nota: >-
              El problema 3 de la final de enero de 2020, de 2 puntos, que es
              el 2 de la segunda parte: una barra rígida en L con dos barras
              inclinadas, una carga repartida y una barra calentada. Pide los
              desplazamientos de dos puntos.
          - id: exerm1617-ord-5-la-barra-rigida-abdf-colgada-de-tres-barras
            nota: >-
              El problema 1 de la final de enero de 2017: una barra rígida sin
              articular, sostenida por dos barras a 30° y una vertical, con la
              barra 2 calentada. El enunciado recomienda sacar el
              desplazamiento horizontal del extremo por Engesser-Castigliano,
              del bloque de los teoremas energéticos, más arriba en esta ruta.
        dominio: >-
          Escribes el alargamiento de cada barra con su término térmico, dices
          si la temperatura sola carga el conjunto y resuelves los axiles y los
          desplazamientos.

  - id: seccion
    titulo: La sección que trabaja, de los diagramas a la tensión máxima
    pide: >-
      Una viga con rótulas, resortes o un tirante, sus diagramas y las
      tensiones de su sección más cargada, o la separación de los tornillos de
      una viga compuesta; y como cuestión, una pieza cargada fuera de su eje.
    porque: >-
      Cae en tres de las siete finales: cuatro preguntas y 5,5 de los 56,5
      puntos de la parte 2. La de 2019 trajo dos, la barra en arco, de 1
      punto, y la viga con dos rótulas y una sección de alas desiguales; la de
      2021, la viga con platabandas atornilladas, y la de 2023, la viga sobre
      resortes. La tensión máxima de una sección cierra además los problemas
      de vigas hiperestáticas de 2020 y de 2026, que cuentan en su bloque. La
      escalera larga está en
      [el bloque de la sección de la ruta del segundo parcial](/road-to-ingenieria/elasticidad-resistencia/preparar/2par/#seccion).
    invariante:
      anios: 3
      fuente: >-
        Contado pregunta a pregunta: 2018-2019 (T3 y P3), 2020-2021 (P4) y
        2022-2023 (P3). Los puntos son los impresos junto a cada pregunta.
    apunte:
      texto: parte 2 · en tres de siete — 5,5 de los 56,5 puntos
      tono: nota
    dominio: >-
      Sacas el centro de gravedad, las inercias y la tensión máxima de una
      sección en función de su espesor, con flexión esviada si los ejes no
      son principales y con axil si la fuerza no pasa por el centro de
      gravedad.
    revisado: '2026-10-23'
    escalones:
      - id: la-tension-maxima
        titulo: La tensión máxima de una sección, y sus tornillos
        aprendes: >-
          A sacar el centro de gravedad y la inercia de una sección, la tensión
          normal de cada fibra y la cortante en un punto, y a sacar la
          separación de los tornillos de una viga compuesta.
        teoria:
          tema: t09-flexion-tensiones
          apartado: el-módulo-resistente-y-el-dimensionado
          nota: >-
            El centro de gravedad y las inercias de una sección compuesta se
            dan por sabidos. Están en
            [los teoremas de Steiner de Mecánica Aplicada](/road-to-ingenieria/mecanica-aplicada/t02-geometria-de-masas/#los-teoremas-de-steiner).
        ejercicios:
          - id: ejerm9-la-viga-en-t
            incrustado: true
            nota: >-
              El ejemplo del tema: una viga biapoyada de sección en T, del
              centro de gravedad a las tensiones máximas.
          - id: exerm2223-2par-6-la-viga-sobre-resortes
            nota: >-
              El problema 3 de la final de enero de 2023: una viga sobre dos
              resortes, con una rótula y un tirante. Pide los diagramas, un
              desplazamiento y las dos tensiones en un punto de la sección.
          - id: exerm2021-ord-8-la-viga-con-platabandas-atornilladas
            nota: >-
              El problema 4 de la final de enero de 2021: una viga con rótula y
              una sección en I con platabandas atornilladas, que acaba en la
              separación de los tornillos con el flujo cortante de las
              [vigas compuestas](/road-to-ingenieria/elasticidad-resistencia/t09-flexion-tensiones/#vigas-compuestas).
              La deducción del flujo cortante es la cuestión del bloque de la
              cuestión de flexión, más abajo.
        dominio: >-
          Das la tensión máxima de una sección en I, en T o en U mirando las
          dos fibras y el flector de cada signo, y sacas la separación de los
          tornillos de una viga compuesta.
      - id: la-seccion-en-l
        titulo: La sección en L, o de alas desiguales
        aprendes: >-
          A sacar la ley de tensiones, el eje neutro y la tensión máxima de una
          sección en L o de alas desiguales, cargada con un solo flector.
        teoria:
          tema: t09-flexion-tensiones
          apartado: ejes-principales-la-fórmula-de-navier
          nota: >-
            Las inercias de una sección compuesta se dan por sabidas. Están
            en
            [las superficies planas de Mecánica Aplicada](/road-to-ingenieria/mecanica-aplicada/t02-geometria-de-masas/#superficies-planas-momentos-y-productos-de-inercia).
        ejercicios:
          - id: exerm1819-ext-6-la-viga-con-voladizo-y-seccion-en-l
            nota: >-
              El problema 2 de la extraordinaria de junio de 2019: una viga con
              voladizo y sección en L, y la luz con la que la tracción llega a
              200 MPa.
          - id: exerm1819-2par-6-la-viga-con-dos-rotulas-y-la-seccion-de-alas-desiguales
            nota: >-
              El problema 3 de la final de enero de 2019, que es el 2 de la
              segunda parte: una viga con dos rótulas y un par, y una sección de
              alas desiguales. Pide la ecuación de las tensiones, el eje neutro
              y las tensiones extremas.
        dominio: >-
          Sacas el eje neutro de una sección en L o de alas desiguales y das
          la tensión máxima en el punto que de verdad la lleva.
      - id: la-fuerza-fuera-del-eje
        titulo: Flexión compuesta, la fuerza que no pasa por el eje
        aprendes: >-
          A sacar los esfuerzos de una sección cargada por una fuerza que no
          pasa por su eje, y a sumar sus tensiones.
        teoria:
          tema: t09-flexion-tensiones
          apartado: flexión-compuesta-y-fuerza-excéntrica
        ejercicios:
          - id: exerm1617-2par-2-el-poste-de-aluminio-con-la-fuerza-inclinada
            nota: >-
              La cuestión 2 de la segunda parte de enero de 2017, de 1 punto: un
              poste tubular con una fuerza inclinada en su cara exterior. No
              cayó en la final de ese día; aquí va de peldaño.
          - id: exerm1819-2par-3-la-barra-circular-abc
            nota: >-
              La cuestión 3 de la final de enero de 2019: una barra en arco, con
              los esfuerzos de una
              [pieza de directriz curva](/road-to-ingenieria/elasticidad-resistencia/t07-piezas-prismaticas/#piezas-de-directriz-curva),
              del tema 7, y el espesor mínimo de su sección.
        dominio: >-
          Ante una fuerza fuera del eje escribes el axil y los flectores en la
          sección que importa, sumas las tensiones con su signo y dices dónde
          queda el eje neutro.
    falta:
      - >-
        Los ejercicios de clase del tema 9 (9.1 a 9.8) y sus cuestiones de
        autoevaluación no están en el sitio. Los escalones de la sección en L
        y de la fuerza fuera del eje empiezan en ejercicios de examen, sin un
        ejemplo propio delante, y la prosa del tema no resuelve ninguna L.
      - >-
        La prosa del tema 9 no explica el centro de gravedad, las inercias ni
        el producto de inercia de una sección compuesta, que usan todos estos
        problemas. Se dan por sabidos de Mecánica Aplicada, y los dos primeros
        escalones lo enlazan.

  - id: flechas
    titulo: Flechas y giros, la elástica y la viga conjugada
    pide: >-
      La ecuación diferencial de la elástica, deducida; o los giros y la
      flecha de una viga con voladizo o con rótula, una vez por la viga
      conjugada.
    porque: >-
      Cae en tres de las siete finales, las tres primeras: cuatro preguntas y
      5 de los 56,5 puntos de la parte 2. Desde enero de 2019 no ha vuelto
      como pregunta propia, pero la tabla de vigas del tema 10 entra en cada
      viga hiperestática. De las cuatro, una es la ecuación de la elástica;
      las otras tres son giros y flechas, y solo la de 2019 dice el camino:
      la viga conjugada. La escalera de la ruta del segundo parcial es la
      misma; está en
      [su bloque de flechas](/road-to-ingenieria/elasticidad-resistencia/preparar/2par/#deformaciones).
    invariante:
      anios: 3
      fuente: >-
        Contado pregunta a pregunta: 2016-2017 (P2), 2017-2018 (T3 y P3) y
        2018-2019 (T4). Los puntos son los impresos junto a cada pregunta.
    apunte:
      texto: parte 2 · en tres de siete — y no desde 2019
      tono: nota
    dominio: >-
      Deduces la ecuación de la elástica con su signo, integras una viga
      tramo a tramo con sus condiciones, y con la viga conjugada o con los
      teoremas de Mohr das el giro y la flecha de un voladizo.
    revisado: '2026-10-23'
    escalones:
      - id: la-ecuacion-de-la-elastica
        titulo: La ecuación de la elástica, deducida
        aprendes: >-
          A deducir la ecuación diferencial de la elástica desde la curvatura,
          con su signo y las hipótesis con que vale.
        teoria:
          tema: t10-flexion-deformaciones
          apartado: de-la-curvatura-a-la-ecuación-de-la-elástica
        ejercicios:
          - id: exerm1819-ext-3-la-ecuacion-diferencial-de-la-curva-elastica
            nota: >-
              La cuestión 3 de la final de enero de 2018, de 1 punto, que volvió
              igual en la extraordinaria de junio de 2019. El ejemplo nuestro es
              un voladizo integrado con ella.
          - id: exerm2021-ext-3-la-ecuacion-diferencial-de-la-elastica
            nota: >-
              La cuestión 3 de la extraordinaria de febrero de 2021: la misma
              con «Deducir la» delante, resuelta con otro ejemplo. La deducción
              es la de arriba, y sirve de repaso.
        dominio: >-
          Escribes la deducción con el signo justificado y dices qué hipótesis
          la hace aproximada.
      - id: integrar-tramo-a-tramo
        titulo: Integrar la elástica tramo a tramo
        aprendes: >-
          A integrar dos veces la ley de flectores de cada tramo y a cerrar las
          constantes con los apoyos y la continuidad, en una viga con rótula.
        teoria:
          tema: t10-flexion-deformaciones
          apartado: integrar-la-ecuación-tramo-a-tramo
          nota: >-
            El apartado resuelve un voladizo y acaba en la tabla de vigas
            elementales que usan las vigas hiperestáticas.
        ejercicios:
          - id: exerm1617-2par-5-la-viga-gerber-con-p-en-el-voladizo-y-q0-en-df
            nota: >-
              El problema 1 de la segunda parte de enero de 2017: una viga
              Gerber con dos cargas, integrando la elástica. La final de ese día
              puso la misma viga, y en el escalón de abajo va por la viga
              conjugada.
        dominio: >-
          Integras una viga de dos o tres tramos con rótula sin perder una
          constante, y compruebas el resultado con la tabla.
      - id: la-viga-conjugada
        titulo: La viga conjugada, y los teoremas de Mohr
        aprendes: >-
          A convertir una viga en su conjugada, cargarla con M/EI y leer el giro
          y la flecha de un punto en su cortante y su flector, y a llegar a lo
          mismo con los teoremas de Mohr.
        teoria:
          tema: t10-flexion-deformaciones
          apartado: la-viga-conjugada
          nota: >-
            Los
            [teoremas de Mohr](/road-to-ingenieria/elasticidad-resistencia/t10-flexion-deformaciones/#los-dos-teoremas-de-mohr),
            en el apartado de antes, son el otro camino, con el que el sitio
            resuelve la final de enero de 2018.
        ejercicios:
          - id: ejerm10-el-giro-y-la-flecha-del-voladizo
            incrustado: true
            nota: >-
              El ejemplo del tema: una viga con voladizo y la carga en la punta,
              con el giro y la flecha de la punta.
          - id: exerm1617-ord-6-la-viga-gerber-por-la-viga-conjugada
            nota: >-
              El problema 2 de la final de enero de 2017: la Gerber del escalón
              de arriba, con los mismos datos y las mismas preguntas, por la
              viga conjugada. Los resultados ya los tienes; lo que entrena es el
              camino.
          - id: exerm1718-2par-6-la-pieza-de-dos-diametros-con-voladizo
            nota: >-
              El problema 2 de la segunda parte de enero de 2018: una pieza de
              dos diámetros con un voladizo cargado. Pide dos giros y una
              flecha. La final de ese día puso la misma pieza, y detrás va por
              los teoremas de Mohr. Su primer paso, la conjugada, es el del
              ejemplo del tema, y sirve de repaso.
          - id: exerm1718-ord-7-la-pieza-de-dos-diametros-con-voladizo
            nota: >-
              El problema 3 de la final de enero de 2018: la misma pieza por los
              teoremas de Mohr. Los resultados son los de arriba; lo que entrena
              es el otro camino.
          - id: exerm1819-2par-4-la-viga-conjugada-y-la-reciprocidad
            nota: >-
              La cuestión 4 de la final de enero de 2019, de 1 punto: un giro por
              la viga conjugada y un desplazamiento por el
              [teorema de reciprocidad](/road-to-ingenieria/elasticidad-resistencia/t13-teoremas-energeticos/#los-teoremas-de-reciprocidad),
              del tema 13. Su primer paso, la conjugada, vuelve a ser el del
              ejemplo, y sirve de repaso.
        dominio: >-
          Dibujas la conjugada de una viga con voladizo y rótula, sacas de ella
          un giro y una flecha con su signo, y repites la cuenta con los
          teoremas de Mohr.
    falta:
      - >-
        Los ejercicios de clase del tema 10 (10.1 a 10.6) y sus cuestiones de
        autoevaluación no están en el sitio. Los escalones de la elástica y de
        integrar tramo a tramo empiezan en ejercicios de examen, sin práctica
        delante.

  - id: torsion
    titulo: La torsión, un eje que no se resuelve solo o una pared delgada
    pide: >-
      Una cuestión de algo más de un punto: un eje con un enlace de más, o una
      sección de pared delgada, cerrada o abierta. En 2017, el eje empotrado
      en los dos extremos fue problema.
    porque: >-
      Cae en cuatro de las siete finales: cuatro preguntas y 4,75 de los 56,5
      puntos de la parte 2. Dos son un eje que el equilibrio no resuelve,
      empotrado en los dos extremos en 2017 y con un disco y dos barras en
      2026, y dos, secciones de pared delgada, un tubo rectangular en 2020 y
      dos triángulos en 2021. La escalera larga, con la sección circular, está
      en
      [el bloque de torsión de la ruta del segundo parcial](/road-to-ingenieria/elasticidad-resistencia/preparar/2par/#torsion).
    invariante:
      anios: 4
      fuente: >-
        Contado pregunta a pregunta: 2016-2017 (P3), 2019-2020 (T4),
        2020-2021 (T1) y 2025-2026 (T1 de la parte 2). Los puntos son los
        impresos junto a cada pregunta.
    apunte:
      texto: parte 2 · en cuatro de siete — 4,75 de los 56,5 puntos
      tono: nota
    dominio: >-
      Resuelves un eje con un enlace de más y dibujas sus diagramas de
      torsores y de giros, y deduces la tensión y el giro de una sección
      cerrada de pared delgada sin mirar.
    revisado: '2026-10-23'
    escalones:
      - id: el-eje-que-el-equilibrio-no-resuelve
        titulo: El eje que el equilibrio no resuelve
        aprendes: >-
          A repartir un par entre los extremos de un eje que la estática no
          resuelve, también cuando lo sujetan unas barras por una pieza
          rígida, y a dibujar sus diagramas de torsores y de giros.
        teoria:
          tema: t12-torsion
          apartado: el-giro-y-los-ejes-que-el-equilibrio-no-resuelve
        ejercicios:
          - id: ejerm12-el-eje-de-dos-diametros
            incrustado: true
            nota: >-
              El ejemplo del tema: un eje de dos diámetros entre dos paredes,
              con un par en el cambio de sección.
          - id: exerm1718-ext-7-el-eje-escalonado-con-flexion-y-torsion
            nota: >-
              El problema 3 de la extraordinaria de junio de 2018: un eje
              escalonado, empotrado en un extremo y apoyado en el otro, con una
              carga excéntrica en el cambio de diámetro.
          - id: exerm1617-2par-6-el-eje-biempotrado-con-un-par-repartido-y-otro-concentrado
            nota: >-
              El problema 3 de la final de enero de 2017, que es el 2 de la
              segunda parte: un eje empotrado en los dos extremos, con un par
              repartido y otro concentrado. Pide el diámetro y el diagrama de
              giros. Su primer paso es el del ejemplo de arriba, y sirve de
              repaso.
          - id: exerm2223-ext-7-el-eje-con-palancas-y-tirantes
            nota: >-
              El problema 4 de la extraordinaria de febrero de 2023: palancas y
              tirantes en los extremos de un eje, y dos galgas, del tema 3, en
              uno de los tirantes.
          - id: exerm2526-2par-1-el-eje-con-un-disco-y-dos-barras
            nota: >-
              La teoría 1 de la parte 2 de la final de enero de 2026, de 1,25
              puntos: un eje con un disco sujeto por dos barras, el caso del
              último párrafo del apartado.
        dominio: >-
          Resuelves un eje con un enlace de más, sea una pared o unas barras, y
          dibujas sus diagramas de torsores y de giros con su signo.
      - id: la-seccion-cerrada
        titulo: La sección cerrada de pared delgada
        aprendes: >-
          A deducir la tensión y el giro de una sección cerrada de pared
          delgada y a usarlos para dimensionar un tubo.
        teoria:
          tema: t12-torsion
          apartado: secciones-cerradas-de-pequeño-espesor
          nota: >-
            Léelo junto con el de antes, el de las
            [secciones abiertas de pequeño espesor](/road-to-ingenieria/elasticidad-resistencia/t12-torsion/#secciones-abiertas-de-pequeño-espesor).
        ejercicios:
          - id: exerm2223-2par-4-la-tension-tangencial-en-una-seccion-cerrada
            nota: >-
              La cuestión 4 de la segunda parte de enero de 2023, de 1 punto: la
              tensión tangencial, deducida. No cayó en la final de ese día; aquí
              va de peldaño.
          - id: exerm1920-2par-3-el-tubo-rectangular-en-lugar-de-la-barra-maciza
            nota: >-
              La cuestión 4 de la final de enero de 2020, que es la 3 de la
              segunda parte: un tubo rectangular que sustituye a una barra
              maciza. Pide el espesor mínimo, y su primer paso vuelve sobre el
              área de la fórmula: sirve de repaso.
          - id: exerm2021-ord-1-dos-triangulos-a-torsion
            nota: >-
              La cuestión 1 de la final de enero de 2021: dos triángulos de
              pared delgada, de espesores distintos, con el mismo par.
        dominio: >-
          Deduces la tensión y el giro de una sección cerrada, dices qué área
          entra en la fórmula en cualquier tubo y explicas qué cambia si la
          pared se abre.
    falta:
      - >-
        Los ejercicios de clase del tema 12 (12.1 a 12.8) y sus cuestiones de
        autoevaluación no están en el sitio. El escalón de la sección cerrada
        empieza en una cuestión de examen.

  - id: cuestion-de-flexion
    titulo: La cuestión de flexión, una deducción
    pide: >-
      Una deducción de 1 punto o de 1,5: el teorema del flujo cortante, o la
      ley de las tensiones normales en flexión pura con su eje neutro.
    porque: >-
      Cae en cuatro de las siete finales, siempre como cuestión de teoría:
      cuatro preguntas y 4,5 de los 56,5 puntos de la parte 2. El teorema del
      flujo cortante es la misma cuestión en 2019, 2020 y 2021, con el mismo
      enunciado, y la de 2026 es la ley de las tensiones normales. Se preparan
      con dos deducciones, las mismas que
      [el bloque de la ruta del segundo parcial](/road-to-ingenieria/elasticidad-resistencia/preparar/2par/#cuestion-de-flexion).
    invariante:
      anios: 4
      fuente: >-
        Contado pregunta a pregunta: 2018-2019 (T2), 2019-2020 (T3),
        2020-2021 (T3) y 2025-2026 (T3 de la parte 2). Los puntos son los
        impresos junto a cada pregunta.
    apunte:
      texto: parte 2 · en cuatro de siete — y son dos deducciones
      tono: nota
    dominio: >-
      Escribes las dos deducciones de memoria, con sus hipótesis y su figura,
      y aplicas cada una a una sección rectangular.
    revisado: '2026-10-23'
    escalones:
      - id: las-tensiones-normales
        titulo: Las tensiones normales en flexión pura, deducidas
        aprendes: >-
          A deducir la ley de las tensiones normales de una sección con dos
          flectores, desde la hipótesis de partida hasta el eje neutro.
        teoria:
          tema: t09-flexion-tensiones
          apartado: las-tensiones-normales-en-el-caso-general
          nota: >-
            La deducción empieza en el apartado de antes,
            [Navier-Bernoulli y el eje neutro](/road-to-ingenieria/elasticidad-resistencia/t09-flexion-tensiones/#navier-bernoulli-y-el-eje-neutro).
        ejercicios:
          - id: exerm2223-2par-1-la-ley-de-tensiones-en-flexion-pura
            nota: >-
              La cuestión 1 de la segunda parte de enero de 2023, de 1 punto: la
              deducción y el eje neutro. No cayó en la final de ese día; aquí va
              de peldaño.
          - id: exerm2526-2par-3-las-tensiones-normales-en-flexion-pura
            nota: >-
              La teoría 3 de la parte 2 de la final de enero de 2026, de 1,5
              puntos: la misma deducción con otras palabras, resuelta con otro
              ejemplo. La deducción es la de arriba, y sirve de repaso.
        dominio: >-
          Deduces la ley lineal de las tensiones y el eje neutro de memoria, y
          dices de qué hipótesis sale cada paso.
      - id: el-flujo-cortante
        titulo: El teorema del flujo cortante
        aprendes: >-
          A deducir el teorema del flujo cortante con su figura, y a sacar con
          él la tensión cortante de una sección rectangular.
        teoria:
          tema: t09-flexion-tensiones
          apartado: el-teorema-del-flujo-cortante
        ejercicios:
          - id: exerm2021-ord-3-el-teorema-del-flujo-cortante
            incrustado: true
            nota: >-
              La pregunta que más se repite de la final: la cuestión 2 de enero
              de 2019 y la 3 de enero de 2020 y de 2021, siempre con el mismo
              enunciado y de 1 punto. Está resuelta con un ejemplo nuestro en
              una sección rectangular.
        dominio: >-
          Escribes la deducción del flujo cortante con su figura y sacas con
          ella la cortante máxima de un rectángulo.
    falta:
      - >-
        Las cuestiones de autoevaluación del tema 9 no están en el sitio. Los
        dos escalones empiezan en la cuestión de examen, con la deducción en la
        prosa delante.

  - id: pandeo
    titulo: Pandeo, una cuestión que no cae desde 2021
    pide: >-
      Una cuestión de 1 punto: la carga crítica de Euler, deducida, o la
      compresión excéntrica de una columna esbelta, con el desplazamiento de
      su extremo o una dimensión de su sección.
    porque: >-
      Cae en tres de las siete finales, siempre como cuestión de 1 punto: tres
      preguntas y 3 de los 56,5 puntos de la parte 2. La compresión excéntrica
      en 2017 y en 2018, y la carga crítica de Euler en 2021. Las dos son
      deducciones cortas, y la de Euler volvió igual en la extraordinaria de
      2021-2022.
    invariante:
      anios: 3
      fuente: >-
        Contado pregunta a pregunta: 2016-2017 (T4), 2017-2018 (T4) y
        2020-2021 (T4). Los puntos son los impresos junto a cada pregunta.
    apunte:
      texto: parte 2 · en tres de siete — 3 de los 56,5 puntos
      tono: neutro
    dominio: >-
      Deduces la carga crítica de Euler y el desplazamiento del extremo libre
      de una columna con la carga excéntrica, y sabes qué inercia y qué
      longitud entran en cada fórmula.
    revisado: '2026-10-23'
    escalones:
      - id: la-carga-critica
        titulo: La carga crítica de Euler
        aprendes: >-
          A deducir la carga crítica de una columna biarticulada desde el
          equilibrio, y a aplicarla con la inercia que manda.
        teoria:
          tema: t14-pandeo
          apartado: la-carga-crítica-de-euler
        ejercicios:
          - id: exerm2021-ord-4-la-carga-critica-de-euler
            nota: >-
              La cuestión 4 de la final de enero de 2021, de 1 punto: la
              deducción, sin números.
          - id: exerm1617-ext-4-la-carga-critica-de-la-columna-en-c
            nota: >-
              La cuestión 4 de la extraordinaria de junio de 2017: la carga
              crítica de una columna de sección en C, con la fórmula dada.
        dominio: >-
          Deduces la carga crítica de la biarticulada y eliges la inercia que
          manda en una sección con un solo eje de simetría.
      - id: la-compresion-excentrica
        titulo: La compresión excéntrica de una columna esbelta
        aprendes: >-
          A plantear la elástica de una columna esbelta con la carga fuera del
          eje, cerrar sus constantes y sacar el desplazamiento del extremo
          libre y el flector máximo.
        teoria:
          tema: t14-pandeo
          apartado: compresión-excéntrica-de-columnas-esbeltas
        ejercicios:
          - id: ejerm14-la-columna-con-la-carga-desplazada
            incrustado: true
            nota: >-
              El ejemplo del tema: una columna empotrada y libre con la carga
              desplazada, de la carga crítica al desplazamiento del extremo.
          - id: exerm1617-2par-4-el-desplazamiento-del-extremo-libre-en-la-compresion-excentrica
            nota: >-
              La cuestión 4 de la final de enero de 2017, que es la 4 de la
              segunda parte: la deducción del desplazamiento del extremo libre.
          - id: exerm1718-2par-4-la-columna-con-dos-huecos-y-la-carga-en-b
            nota: >-
              La cuestión 4 de la final de enero de 2018, que es la 4 de la
              segunda parte: una sección con dos huecos y la carga en un borde.
              Pide una dimensión de la sección para un factor dado.
          - id: exerm2021-ext-4-compresion-excentrica-de-columnas-esbeltas
            nota: >-
              La cuestión 4 de la extraordinaria de febrero de 2021: la misma
              deducción que la de 2017, resuelta con otro ejemplo. La deducción
              es la de arriba, y sirve de repaso.
        dominio: >-
          Deduces el desplazamiento y el flector máximo de la empotrada y libre
          con la carga excéntrica, y dices qué longitud y qué inercia van en
          cada fórmula.
    falta:
      - >-
        El tema 14 no tiene ejercicios de clase en el material, y sus
        cuestiones de autoevaluación no están en el sitio. El escalón de la
        carga crítica empieza en la cuestión de examen.

  - id: depositos
    titulo: Depósitos de chapas soldadas
    pide: >-
      Un depósito de chapas soldadas, en anillos o en hélice, y la presión que
      aguanta con la tensión de la soldadura; en 2020, con dos galgas que dan
      las constantes del material.
    porque: >-
      Cae en dos de las siete finales: dos preguntas y 2,5 de los 56,5 puntos
      de la parte 2. Va el último de la parte por eso. Las dos son chapas
      soldadas, el problema de 1,5 puntos de 2020 y la cuestión de 1 punto de
      2023. La deducción del depósito, que cayó en el primer parcial de
      2017-2018, cuando el tema 8 entraba en él, va en el escalón como
      peldaño.
    invariante:
      anios: 2
      fuente: >-
        Contado pregunta a pregunta: 2019-2020 (P1) y 2022-2023 (T3). Los
        puntos son los impresos junto a cada pregunta.
    apunte:
      texto: parte 2 · en dos de siete — 2,5 de los 56,5 puntos
      tono: neutro
    dominio: >-
      Escribes las dos tensiones de la pared de un depósito, las llevas a la
      dirección de una soldadura y sacas la presión que aguanta o la que
      leen dos galgas.
    revisado: '2026-10-23'
    escalones:
      - id: el-deposito-soldado
        titulo: El depósito, y la soldadura que manda
        aprendes: >-
          A sacar la tensión circunferencial y la longitudinal de un depósito
          cilíndrico, a llevarlas a la dirección de una soldadura y a
          combinarlas con Hooke para leer unas galgas.
        teoria:
          tema: t08-esfuerzo-axial
          apartado: depósitos-y-anillos-de-pared-delgada
        ejercicios:
          - id: ejerm8-cu4-depositos-y-anillos
            nota: >-
              Cuestión 4 de autoevaluación del tema 8: la ecuación del depósito
              y los anillos, con un anillo nuestro con presión interior y dos
              anillos encajados.
          - id: exerm1718-1par-4-el-deposito-de-revolucion
            nota: >-
              La cuestión del primer parcial de 2017-2018: la ecuación de
              Laplace deducida para un depósito de revolución cualquiera. El
              cilindro y la esfera salen después, como dos casos.
          - id: exerm1920-1par-4-el-deposito-con-dos-galgas
            incrustado: true
            nota: >-
              La cuestión del primer parcial de 2019-2020: una galga axial y
              otra a 60°, y de ellas la deformación circunferencial, ν y la
              presión.
          - id: exerm2223-ord-3-el-tanque-soldado
            nota: >-
              La cuestión 3 de la final de enero de 2023: dos tanques de las
              mismas placas, soldadas en anillos o en hélice a 45°, y la
              presión que aguanta cada uno con la tensión admisible
              perpendicular a la soldadura.
          - id: exerm1920-ord-5-el-recipiente-soldado
            nota: >-
              El problema 1 de la final de enero de 2020, de 1,5 puntos: un
              recipiente de chapas soldadas en anillos o en hélice a 30°, con
              una tracción propia en la soldadura. Pide la presión máxima con
              Von Mises, E y ν de dos galgas y cuánto cambian el radio y la
              longitud.
        dominio: >-
          Deduces las dos tensiones de la pared con su dibujo, las llevas a la
          dirección de una soldadura y sacas la presión de un depósito a partir
          de una tensión admisible o de dos lecturas de galga.
    falta:
      - >-
        El tema 8 no trae un ejemplo resuelto de depósitos. El escalón empieza
        en la cuestión de autoevaluación y sube por dos cuestiones de primeros
        parciales antes de las de las finales.

  # ─────────────────────────────────────────────────────────────────────
  # Los dos de cierre, para las dos partes
  # ─────────────────────────────────────────────────────────────────────
  - id: simulacro
    titulo: El simulacro, con una final entera
    apunte:
      texto: de una sentada, y sin la solución al lado
      tono: marco
    pide: >-
      Las dos partes de una final de enero, de una sentada, o la parte que te
      toque si tienes la primera liberada.
    porque: >-
      Los bloques de arriba entrenan cada hueco por separado, y la final no va
      por separado: salta de una deducción de un punto a una barra quebrada
      de dos, y de la elasticidad a la resistencia en la misma hoja. Estas son
      las siete de la ventana, completas y con su resolución detrás.
    dominio: >-
      Hacer una final completa de una sentada sin abrir la resolución, y
      después contar cuántos apartados habrías dado por buenos sin serlo.
    material:
      - tipo: examen
        curso: '2025-2026'
        convocatoria: ordinaria
        nota: >-
          La más reciente y la primera partida en dos hojas de 10 puntos, como
          las dos partes de la guía de este curso: hazla primero. Llegó en
          fotos, así que no tiene PDF, y sus figuras están redibujadas.
      - tipo: examen
        curso: '2022-2023'
        convocatoria: ordinaria
        nota: >-
          La distorsión, Mohr, el tanque soldado, las vigas cruzadas, las seis
          galgas, el eje con el tirante, la viga sobre resortes y la barra
          quebrada con un muelle.
      - tipo: examen
        curso: '2020-2021'
        convocatoria: ordinaria
        nota: >-
          Los dos triángulos a torsión, los dos cables, el flujo cortante,
          Euler, el cubo con dos galgas, la canasta, la viga con dos rótulas y
          las platabandas.
      - tipo: examen
        curso: '2019-2020'
        convocatoria: ordinaria
        nota: >-
          El elemento diferencial, la rebanada, el flujo cortante, el tubo
          rectangular, el recipiente soldado, la viga sobre un muelle, la barra
          rígida en L y la estructura espacial con un par. Suma 10,5 puntos,
          porque su tercer problema vale 2.
      - tipo: examen
        curso: '2018-2019'
        convocatoria: ordinaria
        nota: >-
          La distorsión, el flujo cortante, el arco, la viga conjugada, la
          roseta a 30°, la viga rígida con cuatro barras, la viga con dos
          rótulas y la barra quebrada apoyada.
      - tipo: examen
        curso: '2017-2018'
        convocatoria: ordinaria
        nota: >-
          El ángulo doble, Von Mises, la elástica, la columna con dos huecos,
          las dos galgas a 45°, la viga rígida con la barra calentada, la pieza
          de dos diámetros y la estructura espacial.
      - tipo: examen
        curso: '2016-2017'
        convocatoria: ordinaria
        nota: >-
          El plano inclinado, la distorsión en el espacio, la viga que sale de
          su diagrama de cortantes, la compresión excéntrica, la barra rígida
          con tres barras, la Gerber con su rótula, el eje empotrado en los
          dos extremos y el pórtico con rótula.
    revisado: '2026-10-23'

  - id: formulario
    titulo: Lo que hay que llevar sabido
    apunte:
      texto: repaso, no aprendizaje
      tono: marco
    pide: >-
      Cauchy, el ángulo doble, la distorsión, la fórmula de la galga, Hooke en
      tensión plana, los criterios de fallo, la rebanada, la coenergía, los
      tres momentos, la torsión cerrada, la conjugada y Euler, de memoria.
    porque: >-
      Va el último porque es repaso, no aprendizaje: es el bloque del rato de
      antes de entrar. Cada tema acaba con su lista de lo que hay que llevar
      sabido, y aquí están las doce de la final, en el orden del temario. No
      hay nada en ellas que no esté en su tema.


      **Las listas de todos los temas escritos están juntas en una sola página**, hecha para imprimirse a dos columnas: [el formulario de Elasticidad](/road-to-ingenieria/elasticidad-resistencia/formulario/). Se leen de los temas, así que no hay nada escrito ahí que no esté en ellos.
    dominio: >-
      Escribir de memoria y en papel Cauchy, Hooke en tensión plana, σeq de
      Mohr, la fuerza unidad, la ecuación de los tres momentos y la tensión de
      una sección cerrada, sin consultar nada. Si tienes que mirar una sola
      vez, todavía no.
    material:
      - tipo: teoria
        tema: t02-tensiones
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          El convenio, el equilibrio interno, Cauchy, las principales y Mohr.
      - tipo: teoria
        tema: t03-deformaciones
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          γ/2 en el tensor, la fórmula de la galga y la compatibilidad.
      - tipo: teoria
        tema: t04-cuerpo-elastico
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          Hooke en los dos sentidos, las constantes y la tensión plana.
      - tipo: teoria
        tema: t06-teorias-de-fallo
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          La tensión equivalente de cada criterio, Mohr incluido, y el factor
          de seguridad.
      - tipo: teoria
        tema: t07-piezas-prismaticas
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          El convenio de los esfuerzos, las relaciones de la rebanada y las
          reglas de los diagramas.
      - tipo: teoria
        tema: t08-esfuerzo-axial
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          El alargamiento con temperatura, la compatibilidad del sólido rígido
          y los depósitos.
      - tipo: teoria
        tema: t09-flexion-tensiones
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          Navier, la fórmula general, el flujo cortante, las vigas compuestas,
          la flexión compuesta y el núcleo central.
      - tipo: teoria
        tema: t10-flexion-deformaciones
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          La elástica con su signo, las condiciones de los apoyos, la tabla de
          vigas, Mohr y la conjugada.
      - tipo: teoria
        tema: t11-flexion-hiperestatica
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          El enlace que se quita, la empotrada-apoyada y los tres momentos con
          el voladizo y el empotramiento.
      - tipo: teoria
        tema: t12-torsion
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          La circular, el eje empotrado en los dos extremos, la abierta y la
          cerrada de pared delgada.
      - tipo: teoria
        tema: t13-teoremas-energeticos
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          Castigliano, la coenergía de cada esfuerzo, la fuerza unidad, el
          muelle y el tirante, y la barra quebrada.
      - tipo: teoria
        tema: t14-pandeo
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          Euler, la longitud de pandeo, la esbeltez y la compresión excéntrica.
    revisado: '2026-10-23'
