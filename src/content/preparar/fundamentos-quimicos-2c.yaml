asignatura: fundamentos-quimicos
evaluacion: segundo-cuatrimestre
# El control y la extraordinaria **no** tienen ruta propia, y es una decisión
# medida. Leídas las tres convocatorias del segundo cuatrimestre que hay —el
# control de 2023-2024, el final de 2024-2025 y su extraordinaria—, los bloques
# son los mismos y en el mismo orden; lo único que cambia es dónde se corta.
#
# El **control** para en la espontaneidad: sus cuatro ejercicios son
# termoquímica y entropía, y no toca equilibrio, ácido-base ni redox. Quien
# prepara el control hace los tres primeros bloques y se detiene ahí, y así lo
# dice el criterio de orden.
#
# La **extraordinaria** cubre exactamente lo mismo que la ordinaria: uno por
# bloque —termoquímica, equilibrio, ácido-base y redox— contra los cinco de la
# ordinaria, que añade el diagrama P-V. Escribirle ruta propia sería duplicar.
tambienPrepara:
  - control-segundo-cuatrimestre
  - extraordinaria-segundo-cuatrimestre
titulo: Preparar el segundo cuatrimestre de Fundamentos Químicos
lede: >-
  El segundo cuatrimestre es una sola cadena: cuánta energía mueve una
  reacción, si va a ocurrir sola, dónde se para y qué pasa cuando hay
  electrones de por medio. Cada bloque usa el anterior, así que el orden no es
  una preferencia. Y un dato decide por dónde empezar: de las tres
  convocatorias, la termoquímica cae en las tres y siempre es el ejercicio más
  largo.
temas:
  - t05-termodinamica-clasica
  - t06-termoquimica
  - t07-espontaneidad-y-energia-libre
  - t08-equilibrio-quimico
  - t09-equilibrio-acido-base
  - t10-equilibrio-redox
medidoSobre: 3
criterioDeOrden: >-
  Por dependencia y después por rendimiento, contado sobre las tres
  convocatorias. Delante va el suelo —el convenio de signos y la diferencia
  entre función de estado y función de camino—, que solo ocupa hueco propio una
  vez de tres y sin el cual no se termina ninguno de los demás. Detrás, los
  cinco huecos en el orden en que se usan unos a otros: termoquímica (3 de 3),
  espontaneidad (3 de 3 como apartado), equilibrio (2 de 3), ácido-base (2 de
  3) y redox (2 de 3). Quien prepare **el control** se detiene después del
  tercero: sus cuatro ejercicios no pasan de la espontaneidad.

bloques:
  # ═══════════════════════════════════════════════════════════════════
  # SUELO
  # ═══════════════════════════════════════════════════════════════════
  - id: suelo-signos-y-funciones-de-estado
    apunte:
      texto: 'un ejercicio de tres — y está dentro de todos'
      tono: marco
    titulo: El convenio de signos y las dos familias de magnitudes
    pide: >-
      Casi nunca con estas palabras. Lo pide dentro de los demás: «calcula los
      cambios de entalpía, entropía, energía interna y energía libre»,
      «representar gráficamente las variaciones de trabajo e indicar si tienen
      signo positivo o negativo».
    porque: >-
      Como ejercicio propio ha caído una vez de tres, el diagrama P-V del final
      de 2024-2025, y vale 0 puntos de datos: no trae ni un número. Pero el
      convenio de signos decide el signo de la respuesta en los tres ejercicios
      de termoquímica, y la distinción entre función de estado y función de
      camino es de donde sale la ley de Hess entera. Un error de signo aquí no
      se nota hasta el final del ejercicio, cuando ya no da tiempo a rehacerlo.
    invariante:
      anios: 3
      fuente: >-
        Las tres convocatorias del segundo cuatrimestre, contadas sobre el
        reparto por tema. Que el convenio esté «dentro» de un ejercicio de
        termoquímica y no sea un hueco propio es lectura nuestra, y viene de
        que los tres piden el signo de una magnitud sin explicarlo.
    dominio: >-
      Decir el signo del trabajo de un tramo mirando solo si el volumen sube o
      baja, sin calcular nada; y saber cuáles de las magnitudes valen cero en
      un ciclo y cuáles no, sin dudar.
    escalones:
      - id: el-convenio-en-una-linea
        titulo: Lo que entra suma y lo que sale resta
        aprendes: >-
          A poner el signo correcto a un calor y a un trabajo leyendo las
          palabras del enunciado, antes de tocar ningún número.
        teoria:
          tema: t05-termodinamica-clasica
          apartado: sistema-entorno-y-la-primera-decisión
          nota: >-
            El apartado avisa además de que hay dos convenios en circulación y
            de cómo saber cuál usa el enunciado que tienes delante.
        ejercicios:
          - id: ejfq5-un-tramo-y-su-signo
            incrustado: true
            nota: >-
              El ejemplo de entrada. Un solo tramo y una sola pregunta, para
              separar el signo del cálculo.
          - id: colfq5-1-el-convenio-en-una-linea
            nota: >-
              Dos frases del enunciado y una suma. Es el problema 1 de la
              colección y está ahí por lo mismo que aquí.
          - id: colfq5-2-el-helio-comprimido
        dominio: >-
          Ver «se comprime» y «cede calor al entorno» en un enunciado y
          escribir los dos signos sin pararte a pensarlo.

      - id: estado-o-camino
        titulo: Cuáles valen cero en un ciclo y cuáles no
        aprendes: >-
          A decidir si una magnitud depende del camino, y a usar esa propiedad
          para calcular por la ruta cómoda en vez de por la real.
        teoria:
          tema: t05-termodinamica-clasica
          apartado: función-de-estado-y-función-de-camino
          nota: >-
            La figura del apartado enseña dos caminos entre los mismos dos
            estados con el mismo ΔU y trabajos distintos. Es la definición,
            dibujada.
        ejercicios:
          - id: colfq5-4-el-aire-en-dos-etapas
            nota: >-
              Dos compresiones encadenadas, y al final la comprobación de que
              una sola isoterma entre los mismos extremos daría otro trabajo.
          - id: ejfq5-el-area-que-encierra-el-ciclo
          - id: exfq2425-2c-1-el-ciclo-sin-un-solo-numero
            nota: >-
              El ejercicio de examen, y no tiene ni un dato: se contesta
              entero mirando hacia dónde se mueve el volumen.
        dominio: >-
          Decir sin calcular qué signo tiene el trabajo neto de un ciclo
          horario, y explicar por qué ΔU vale cero y el trabajo no.
    falta:
      - >-
        El tema 5 no tiene transcritos los problemas 3, 5, 6 y 7 de su
        colección, que son los que encadenan varias etapas con adiabáticas.
        Van tres de ocho.

  # ═══════════════════════════════════════════════════════════════════
  # LOS CINCO HUECOS, POR RENDIMIENTO
  # ═══════════════════════════════════════════════════════════════════
  - id: la-entalpia-de-una-reaccion
    apunte:
      texto: 'las 3 de 3 — y siempre el ejercicio más largo'
      tono: nota
    titulo: La entalpía de una reacción, por los tres caminos
    pide: >-
      «Calcula la entalpía estándar de formación para la hidracina»,
      «el cambio de entalpía de la reacción de combustión del eteno a 100 ºC»,
      «la entalpía de combustión del etanol».
    porque: >-
      Es el único bloque que cae en las tres convocatorias, y en las tres es el
      ejercicio de más puntos: 4,00 y 3,00 en el control de 2023-2024, y los
      ejercicios de mayor peso del final y de la extraordinaria. Si solo diera
      tiempo a preparar un bloque del cuatrimestre, sería este.
    invariante:
      anios: 3
      fuente: >-
        Las tres convocatorias del segundo cuatrimestre. Que los «tres
        disfraces» —entalpías de formación, combinación de ecuaciones y
        entalpías de combustión— sean la misma ley de Hess con otra cara es
        lectura nuestra, y sale de que los tres enunciados se resuelven con el
        mismo ciclo dibujado de otra manera.
    dominio: >-
      Coger cualquiera de los tres formatos de dato —formación, combustión o
      tres ecuaciones sueltas— y montar el ciclo sin dudar qué se suma y qué
      se resta; y acordarte de mirar en qué estado sale el agua antes de
      escribir el primer número.
    escalones:
      - id: hess-por-formacion
        titulo: El sumatorio de entalpías de formación
        aprendes: >-
          A calcular la entalpía de una reacción restando formaciones, y a
          saber por qué los elementos valen cero.
        teoria:
          tema: t06-termoquimica
          apartado: la-ley-de-hess-y-sus-tres-disfraces
          nota: >-
            La figura del apartado es la escalera desde los elementos, que es
            de donde sale que se resten y que el oxígeno no cuente.
        ejercicios:
          - id: ejfq6-hess-una-sola-vez
            incrustado: true
            nota: >-
              El ejemplo de entrada. Una sola aplicación del sumatorio, con
              cuatro datos y ningún apartado encadenado detrás.
          - id: exfq2425-2c-2-el-eteno-y-los-diez-kilos-de-aluminio
            nota: >-
              Seis apartados que recorren medio cuatrimestre. El primero es
              este escalón; los demás son los bloques siguientes.
        dominio: >-
          Escribir el sumatorio de una combustión cualquiera con sus
          coeficientes y decir de memoria qué especies valen cero.

      - id: el-estado-del-agua
        titulo: Si el agua sale líquida o en vapor
        aprendes: >-
          A corregir la entalpía de formación del agua cuando la reacción la
          produce en vapor, y a ver que no es un detalle.
        teoria:
          tema: t06-termoquimica
          apartado: el-estado-del-agua-la-trampa-que-más-cuesta
          nota: >-
            Con nueve moles de agua —la combustión del octano— son 396 kJ
            sobre 5470, casi un 8 %. No es un redondeo.
        ejercicios:
          - id: exfq2324-2c-control-1-la-hidracina-de-los-cohetes
            nota: >-
              La trampa está en la primera línea del enunciado y arrastra 176
              kJ. Vale 4,00 puntos, el ejercicio más caro del corpus.
          - id: exfq2324-2c-control-2-el-octano-y-los-cuatrocientos-kilos-de-agua
        dominio: >-
          Mirar el estado del agua en la ecuación antes de buscar ningún dato,
          y saber si hay que sumar o restar la entalpía de vaporización sin
          pensarlo dos veces.

      - id: kirchhoff-y-la-energia-interna
        titulo: La misma reacción a otra temperatura, y en energía interna
        aprendes: >-
          A llevar una entalpía y una entropía de 298 K a la temperatura del
          enunciado, y a pasar de ΔH a ΔU contando solo los gases.
        teoria:
          tema: t06-termoquimica
          apartado: kirchhoff-la-misma-reacción-a-otra-temperatura
          nota: >-
            Las dos correcciones no tienen la misma forma: la de la entalpía
            es lineal en la temperatura y la de la entropía lleva un
            logaritmo. Es el error más repetido del tema.
        ejercicios:
          - id: ejfq6-el-tramo-que-se-olvida
            incrustado: true
          - id: exfq2324-2c-control-1-la-hidracina-de-los-cohetes
            nota: >-
              El apartado 1.2 pide las cuatro magnitudes a 100 °C, así que
              este ejercicio aparece en dos escalones: aquí por Kirchhoff.
        dominio: >-
          Calcular ΔCp de una reacción y usarlo en las dos correcciones sin
          confundir cuál lleva logaritmo, y sacar ΔU contando bien Δn de gases.
    falta:
      - >-
        El tema 6 no tiene ni un problema de su colección transcrito: sus dos
        únicos ejercicios propios son los ejemplos de entrada. Es el hueco de
        práctica más grande del cuatrimestre, y en el bloque que más puntúa.

  - id: espontaneidad-con-la-temperatura
    apunte:
      texto: 'aparece en las 3, casi siempre como último apartado'
      tono: nota
    titulo: Si la reacción ocurre sola, y a qué temperatura
    pide: >-
      «¿Cómo afecta la temperatura a la espontaneidad de la reacción?»,
      «analiza la espontaneidad de la reacción de combustión con la
      temperatura», «indica por debajo de qué temperatura se produce la peste
      del estaño».
    porque: >-
      Contado sobre el reparto por tema aparece una vez de tres, pero eso
      esconde el dato útil: **como apartado dentro de otro ejercicio aparece en
      las tres**. La hidracina lo pide en su 1.3, el eteno en su d), y el
      control de 2023-2024 le dedica además dos ejercicios enteros —los signos
      de entropía y la peste del estaño, 3 de sus 10 puntos—.
    invariante:
      anios: 3
      fuente: >-
        Las tres convocatorias, leídas apartado por apartado y no solo por su
        tema principal. Contar solo el tema daría 1 de 3 y llevaría a
        estudiarlo el último, que es exactamente el error que este bloque
        existe para evitar.
    dominio: >-
      Mirar los signos de ΔH y ΔS y decir en cuál de los cuatro casos estás sin
      calcular nada; y cuando la temperatura decide, sacar la frontera y saber
      de qué lado hay que estar.
    escalones:
      - id: el-signo-de-la-entropia
        titulo: El signo de una entropía, sin calcular
        aprendes: >-
          A decir si la entropía de un proceso sube o baja mirando los moles de
          gas y el cambio de estado, y a razonarlo con las palabras que se
          puntúan.
        teoria:
          tema: t07-espontaneidad-y-energia-libre
          apartado: la-entropía-en-una-frase-que-sirve-para-responder
        ejercicios:
          - id: colfq7-1-la-entropia-de-condensar
            nota: >-
              Un cambio de fase, que es el caso donde la fórmula corta ΔS =
              ΔH/T sí vale, y por qué.
          - id: exfq2324-2c-control-3-cinco-signos-de-entropia
            nota: >-
              Cinco procesos y ningún número. Vale 2,00 puntos y lo que se
              puntúa es la razón, no el signo.
        dominio: >-
          Dar el signo de los cinco procesos del examen y, para cada uno,
          nombrar qué gana o pierde libertad. Decir «aumenta porque es una
          evaporación» no vale.

      - id: los-cuatro-casos
        titulo: Los cuatro casos, y cuándo decide la temperatura
        aprendes: >-
          A clasificar una reacción por los signos de ΔH y ΔS, y a calcular la
          temperatura de inversión cuando la hay.
        teoria:
          tema: t07-espontaneidad-y-energia-libre
          apartado: los-cuatro-casos-que-son-toda-la-pregunta-con-la-temperatura
          nota: >-
            La figura del apartado marca aparte los dos cuadrantes donde la
            temperatura decide algo. En los otros dos no hay frontera que
            calcular.
        ejercicios:
          - id: ejfq7-la-cal-y-la-temperatura-del-horno
            incrustado: true
          - id: colfq7-7-el-etano-y-si-arde-solo
            nota: >-
              Y el aviso que va con él: espontáneo no es rápido. Una mezcla de
              etano y aire puede estar años sin reaccionar.
          - id: exfq2324-2c-control-4-la-peste-del-estano
            nota: >-
              Dos restas y un cociente. Está en el examen porque es el caso
              ΔH<0 con ΔS<0 en su forma más limpia.
        dominio: >-
          Decir, sin calcular, cuál de los cuatro casos es una reacción dada; y
          cuando toque, sacar T = ΔH/ΔS con las unidades cuadradas y decir si
          hay que estar por encima o por debajo.

      - id: la-energia-libre-por-dos-caminos
        titulo: La energía libre, y el atajo que da la entropía gratis
        aprendes: >-
          A calcular ΔG por energías libres de formación y a despejar la
          entropía de ahí cuando la tabla no la trae.
        teoria:
          tema: t07-espontaneidad-y-energia-libre
          apartado: la-energía-libre-que-junta-las-dos-cosas
          nota: >-
            Es exactamente lo que pide el apartado a) del final de 2024-2025:
            la tabla trae energías libres de formación y ninguna entropía.
        ejercicios:
          - id: colfq7-8-la-expansion-isoterma-entera
          - id: ejfq7-el-logaritmo-o-la-division
            incrustado: true
          - id: exfq2425-2c-2-el-eteno-y-los-diez-kilos-de-aluminio
        dominio: >-
          Ver una tabla con ΔG°f y ningún dato de entropía y darte cuenta de
          que la entropía sale de ahí, sin buscarla.
    falta: []

  - id: el-equilibrio-y-su-constante
    apunte:
      texto: '2 de 3 — y siempre con una cuadrática dentro'
      tono: nota
    titulo: Dónde se para la reacción
    pide: >-
      «Calcular la constante de equilibrio», «¿hacia dónde se desplaza al
      comprimir?», «calcular las concentraciones en el equilibrio».
    porque: >-
      Cae en dos de las tres convocatorias —el final y la extraordinaria— y en
      las dos con el mismo molde: montar la tabla de equilibrio, resolver una
      cuadrática y descartar una raíz. El control no lo toca, y por eso este
      bloque va después de la espontaneidad y no antes.
    invariante:
      anios: 2
      fuente: >-
        Las tres convocatorias del segundo cuatrimestre. Que el gas de agua y
        el fosgeno sean «el mismo ejercicio con otro compuesto» es lectura
        nuestra: los dos piden Kc, los dos añaden una pregunta de Le Chatelier
        y en los dos la cuadrática tiene una raíz que hay que tirar.
    dominio: >-
      Montar la tabla de un equilibrio cualquiera, resolverla y decir en voz
      alta por qué la raíz que descartas es imposible; y contestar una pregunta
      de Le Chatelier sin calcular nada.
    escalones:
      - id: la-constante-y-la-tabla
        titulo: La constante, y la tabla que la resuelve
        aprendes: >-
          A escribir Kc con sus exponentes, a saber qué especies no entran, y a
          montar la tabla de inicio, cambio y equilibrio.
        teoria:
          tema: t08-equilibrio-quimico
          apartado: la-constante-y-lo-que-no-es
          nota: >-
            La figura del apartado compara Q con K en una recta, que es cómo
            se sabe hacia dónde va a moverse la reacción antes de calcular.
        ejercicios:
          - id: ejfq8-moles-no-son-concentraciones
            incrustado: true
          - id: colfq8-1-la-esterificacion-y-el-volumen-que-se-va
            nota: >-
              El caso en que el volumen se cancela, y por qué solo pasa cuando
              hay los mismos moles a los dos lados.
          - id: colfq8-4-la-caliza-y-el-solido-que-no-entra
        dominio: >-
          Escribir la constante de un equilibrio heterogéneo sin meter los
          sólidos, y decir si el volumen se puede cancelar mirando solo los
          coeficientes.

      - id: de-kc-a-kp
        titulo: El paso a presiones, y el exponente que lo decide
        aprendes: >-
          A pasar de Kc a Kp con el signo correcto de Δn, y a comprobar el
          resultado sabiendo hacia dónde tiene que ir.
        teoria:
          tema: t08-equilibrio-quimico
          apartado: la-constante-y-lo-que-no-es
        ejercicios:
          - id: colfq8-3-el-amoniaco-y-el-paso-de-kc-a-kp
            nota: >-
              Con Δn = −2 y RT ≈ 80, la constante cae cuatro órdenes de
              magnitud. Un signo mal aquí no se parece en nada al resultado.
          - id: exfq2425-2c-ext-2-el-fosgeno-y-la-raiz-que-sobra
        dominio: >-
          Antes de dar el número, decir si Kp tiene que salir mayor o menor que
          Kc mirando solo cuántos moles de gas hay a cada lado.

      - id: la-cuadratica-y-le-chatelier
        titulo: La cuadrática de verdad, y qué desplaza y qué no
        aprendes: >-
          A resolver el equilibrio cuando la aproximación no vale, y a decidir
          hacia dónde se desplaza al cambiar presión, volumen o temperatura.
        teoria:
          tema: t08-equilibrio-quimico
          apartado: le-chatelier-caso-por-caso
        ejercicios:
          - id: ejfq8-la-tabla-de-equilibrio
            incrustado: true
          - id: exfq2425-2c-3-el-gas-de-agua-y-el-volumen-que-no-importa
            nota: >-
              El caso que más confunde: comprimir no desplaza nada cuando hay
              los mismos moles de gas a los dos lados.
          - id: exfq2425-2c-ext-2-el-fosgeno-y-la-raiz-que-sobra
        dominio: >-
          Decir por qué se descarta una de las dos raíces con una frase física,
          no con «porque sale negativa»; y contestar los cuatro casos de Le
          Chatelier sin dudar cuál no mueve nada.
    falta:
      - >-
        Del tema 8 van tres problemas de la colección de once. Faltan los que
        piden el grado de disociación y los que combinan Le Chatelier con un
        recálculo completo, que son los que más se parecen a un examen.

  - id: acido-base-y-los-cuatro-regimenes
    apunte:
      texto: '2 de 3 — cuatro pH en el mismo ejercicio'
      tono: nota
    titulo: Cuatro pH que no se calculan igual
    pide: >-
      «Calcular el pH de la solución resultante», «el pH en el punto de
      equivalencia», «¿qué volumen hay que mezclar para preparar una reguladora
      de pH 9?».
    porque: >-
      Cae en dos de las tres convocatorias, y en las dos con la misma
      estructura: un mismo ácido o base al que se le van añadiendo cosas, y
      cuatro apartados que están cada uno en un régimen distinto. Lo que se
      evalúa no es calcular un pH sino **elegir cuál de las cuatro fórmulas
      toca**, y esa elección se hace contando moles.
    invariante:
      anios: 2
      fuente: >-
        Las tres convocatorias del segundo cuatrimestre. Que el amoniaco de la
        ordinaria y el ácido láctico de la extraordinaria sean el mismo
        ejercicio es lectura nuestra: uno va de base débil y otro de ácido
        débil, pero los dos recorren los mismos regímenes en el mismo orden.
    dominio: >-
      Ante cualquier mezcla, contar moles, ver quién sobra, decir en qué
      régimen estás y solo entonces elegir fórmula — y acordarte de recalcular
      el volumen total antes de aplicarla.
    escalones:
      - id: contar-moles-primero
        titulo: Contar moles y mirar quién sobra
        aprendes: >-
          A decidir en qué régimen está una mezcla antes de escribir ninguna
          fórmula, que es el paso que decide el ejercicio.
        teoria:
          tema: t09-equilibrio-acido-base
          apartado: lo-primero-siempre-cuenta-moles-y-mira-quién-sobra
        ejercicios:
          - id: ejfq9-un-acido-debil-no-es-un-acido-fuerte-flojo
            incrustado: true
          - id: colfq9-1-el-nitroso-al-diluirlo
            nota: >-
              Y la ley de dilución de Ostwald, que es el error típico del
              tema: diluir baja los protones y **sube** el grado de
              disociación.
        dominio: >-
          Decir el régimen de una mezcla en diez segundos, sin calcular nada
          más que una resta de moles.

      - id: el-tampon
        titulo: El tampón, y el atajo cuando las concentraciones se igualan
        aprendes: >-
          A usar Henderson-Hasselbalch en sus dos formas y a reconocer de un
          vistazo cuándo el pH es exactamente el pKa.
        teoria:
          tema: t09-equilibrio-acido-base
          apartado: el-tampón
          nota: >-
            La figura de la curva de valoración marca ese punto: a mitad de
            camino del equivalente, el pH vale pKa y no hay nada que calcular.
        ejercicios:
          - id: ejfq9-para-que-sirve-un-tampon
            incrustado: true
          - id: colfq9-6-el-acetico-con-y-sin-acetato
            nota: >-
              El mismo ácido con y sin su sal al lado. El grado de ionización
              cae cincuenta veces, y el pH sube casi dos unidades.
          - id: colfq9-7-la-reguladora-basica
            nota: >-
              La versión básica, donde el descuido caro es dar el pOH como si
              fuera el pH.
        dominio: >-
          Ver ácido y base conjugada a la misma concentración y contestar pKa
          sin calcular; y comprobar el signo del término logarítmico antes de
          dar el número.

      - id: el-punto-de-equivalencia
        titulo: El punto de equivalencia, que casi nunca cae en 7
        aprendes: >-
          A calcular el pH cuando ya no queda ácido, hidrolizando la base
          conjugada y sin olvidar rediluir.
        teoria:
          tema: t09-equilibrio-acido-base
          apartado: el-punto-de-equivalencia-que-casi-nunca-es-ph-7
        ejercicios:
          - id: colfq9-11-el-hipocloroso-y-su-punto-de-equivalencia
            nota: >-
              Sube más de tres unidades por encima de 7, y los dos descuidos
              que lo estropean son rediluir y olvidar la hidrólisis.
          - id: exfq2425-2c-4-el-amoniaco-y-cuatro-regimenes
          - id: exfq2425-2c-ext-3-el-acido-lactico-y-los-tres-regimenes
        dominio: >-
          Decir antes de calcular si el punto de equivalencia va a caer por
          encima o por debajo de 7, mirando solo qué queda en el vaso.
    falta:
      - >-
        Del tema 9 van cuatro problemas de la colección de doce. Faltan los de
        indicadores y su intervalo de viraje, que la teoría del tema no
        presenta y que en la colección ocupan un problema entero.

  - id: redox-y-pilas
    apunte:
      texto: '2 de 3 — y siempre el último ejercicio'
      tono: nota
    titulo: Quién oxida a quién, y cuánto empuja la pila
    pide: >-
      «Indicar cuál sería la pila más espontánea», «escribe la reacción del
      ánodo, del cátodo y de la pila», «calcula el potencial de cada electrodo
      si las concentraciones son…».
    porque: >-
      Cierra los dos exámenes finales del cuatrimestre, la ordinaria y la
      extraordinaria, y siempre en el mismo sitio: el último ejercicio. En el
      control no aparece. Los dos enunciados dan dos o tres potenciales de
      reducción y piden lo mismo, primero en condiciones estándar y después con
      Nernst.
    invariante:
      anios: 2
      fuente: >-
        Las tres convocatorias del segundo cuatrimestre. Que los dos
        ejercicios sean el mismo con distinto metal es lectura nuestra: los dos
        dan potenciales **todos positivos**, lo que obliga a decidir por
        comparación y no por el signo.
    dominio: >-
      Coger tres potenciales, decir cuál es la mejor pila y escribir sus dos
      semirreacciones sin cambiar ningún signo de la tabla; y recalcular los
      tres con Nernst sabiendo de antemano cuál subirá y cuál bajará.
    escalones:
      - id: leer-la-tabla
        titulo: Leer la tabla sin cambiar ningún signo
        aprendes: >-
          A decidir quién se reduce y quién se oxida, y a calcular el potencial
          de la pila con los valores tal como vienen tabulados.
        teoria:
          tema: t10-equilibrio-redox
          apartado: todo-empieza-leyendo-la-tabla-en-el-sentido-correcto
          nota: >-
            El error típico del apartado es cambiar el signo al invertir la
            semirreacción. Aquí no se hace: la resta ya se encarga, e
            invertirlo además lo cuenta dos veces.
        ejercicios:
          - id: ejfq10-la-resta-que-no-lleva-signos
            incrustado: true
          - id: exfq2425-2c-ext-4-el-yodo-y-los-dos-cobres
            nota: >-
              Tres pares de los que hay que elegir dos, y dos de ellos del
              mismo metal. Se decide por diferencia, no por signo.
        dominio: >-
          Dados tres potenciales, decir en diez segundos cuál es la mejor
          pareja y por qué las otras dos combinaciones dan menos.

      - id: la-pila-y-sus-tres-numeros
        titulo: La pila dibujada, y los tres números que dicen lo mismo
        aprendes: >-
          A montar el esquema con su ánodo, su cátodo y su puente salino, y a
          pasar entre E, ΔG y K sin equivocarte de signo.
        teoria:
          tema: t10-equilibrio-redox
          apartado: la-pila-dibujada
          nota: >-
            La figura del apartado enseña hacia dónde va cada cosa, incluidos
            los iones del puente salino, que van al revés de lo que parece.
        ejercicios:
          - id: exfq2425-2c-5-la-pila-de-cobre-y-hierro
            nota: >-
              Los dos potenciales son positivos a propósito, para que el atajo
              del signo no funcione.
        dominio: >-
          Dibujar la pila con los electrones en el sentido correcto y decir de
          memoria que si E > 0 entonces ΔG < 0 y K > 1.

      - id: nernst
        titulo: Nernst, cuando las concentraciones no son 1 M
        aprendes: >-
          A corregir un potencial por las concentraciones y a saber de antemano
          si va a subir o a bajar.
        teoria:
          tema: t10-equilibrio-redox
          apartado: nernst-cuando-las-concentraciones-no-son-1-m
        ejercicios:
          - id: ejfq10-nernst-y-la-pila-que-empuja-mas
            incrustado: true
          - id: exfq2425-2c-ext-4-el-yodo-y-los-dos-cobres
            nota: >-
              La trampa fina: dos de los tres pares llevan un sólido, cuya
              actividad vale 1 y no entra en el cociente.
        dominio: >-
          Antes de aplicar la fórmula, decir si el potencial subirá o bajará
          mirando de qué lado de la semirreacción está la especie diluida.
    falta:
      - >-
        El tema 10 no tiene ni un problema de su colección transcrito, igual
        que el 6. Sus dos ejercicios propios son los ejemplos de entrada, así
        que entre el ejemplo y el examen no hay peldaño intermedio.
      - >-
        La electrólisis y la corrosión están en el programa oficial y en la
        prosa del tema, pero no han caído en ninguna de las tres convocatorias
        y no tienen ni un ejercicio. Se estudian por si acaso, no por medida.

  # ═══════════════════════════════════════════════════════════════════
  # SIMULACRO Y FORMULARIO
  # ═══════════════════════════════════════════════════════════════════
  - id: simulacro
    apunte:
      texto: 'las tres convocatorias, con reloj'
      tono: marco
    titulo: Los tres exámenes enteros, cronometrados
    pide: >-
      Todo lo anterior a la vez, en 1.30 h y sin calculadora.
    porque: >-
      Los bloques se preparan de uno en uno y el examen no llega así: llega con
      cinco ejercicios encadenados y un reloj. Las tres convocatorias están
      transcritas enteras, sin un solo ejercicio declarado fuera, así que se
      pueden hacer completas y comparar contra la resolución al terminar.
    dominio: >-
      Terminar una convocatoria completa dentro del tiempo, y que los fallos
      que queden sean de cálculo y no de no saber por dónde empezar.
    material:
      - tipo: examen
        curso: '2023-2024'
        convocatoria: control-segundo-cuatrimestre
        nota: >-
          El más corto y el más desigual: 4,00 · 3,00 · 2,00 · 1,00. Solo
          termodinámica, así que sirve para cerrar los tres primeros bloques
          antes de seguir.
      - tipo: examen
        curso: '2024-2025'
        convocatoria: segundo-cuatrimestre
        nota: >-
          El más completo de los tres: cinco ejercicios, uno por bloque, y
          empieza con el diagrama P-V que no tiene ni un número.
      - tipo: examen
        curso: '2024-2025'
        convocatoria: extraordinaria-segundo-cuatrimestre
        nota: >-
          Cuatro ejercicios de 2,5 puntos cada uno, uno por bloque, sin la
          parte de termodinámica clásica. En la extraordinaria no cuentan los
          controles, así que vale por el cuatrimestre entero.
    falta: []

  - id: formulario
    apunte:
      texto: 'lo que hay que llevar en la cabeza'
      tono: marco
    titulo: Lo que no se puede consultar
    pide: >-
      Nada, directamente. Es lo que los enunciados dan por sabido.
    porque: >-
      En el examen no hay calculadora ni formulario, y las tres convocatorias
      dan por sabidas las mismas seis cosas sin escribirlas en ninguna parte.
      Va el último porque es repaso, no aprendizaje: se llega aquí con los
      bloques hechos, no antes.
    dominio: >-
      Escribir de memoria las seis relaciones de abajo y decir en qué bloque se
      usa cada una, sin mirar.
    material:
      - tipo: teoria
        tema: t05-termodinamica-clasica
        apartado: la-primera-ley
        nota: >-
          ΔE = q + W, con el convenio de que lo que entra suma. Y sus dos
          casos: a volumen constante q es ΔE, a presión constante es ΔH.
      - tipo: teoria
        tema: t06-termoquimica
        apartado: de-la-entalpía-a-la-energía-interna-donde-solo-cuentan-los-gases
        nota: >-
          ΔH = ΔU + Δn(gas)·RT, y la entalpía de vaporización del agua, 44,03
          kJ/mol, que las tres convocatorias usan sin darla siempre.
      - tipo: teoria
        tema: t07-espontaneidad-y-energia-libre
        apartado: los-cuatro-casos-que-son-toda-la-pregunta-con-la-temperatura
        nota: >-
          ΔG = ΔH − TΔS, los cuatro casos de signos y T = ΔH/ΔS para la
          frontera.
      - tipo: teoria
        tema: t08-equilibrio-quimico
        apartado: la-constante-y-lo-que-no-es
        nota: >-
          Kp = Kc(RT)^Δn, con Δn contando solo los gases, y qué especies no
          entran en la constante.
      - tipo: teoria
        tema: t09-equilibrio-acido-base
        apartado: la-receta-completa
        nota: >-
          Los cuatro regímenes con su fórmula, pH + pOH = 14 y Ka·Kb = 10⁻¹⁴.
      - tipo: teoria
        tema: t10-equilibrio-redox
        apartado: los-tres-números-que-dicen-lo-mismo
        nota: >-
          ΔG° = −nFE° = −RT·lnK, con F = 96 485 C/mol, y Nernst con su 0,0592
          a 25 °C.
    falta:
      - >-
        Este bloque duplica a propósito cosas que ya están en la prosa de los
        temas, y eso es una excepción declarada: un formulario que remite a
        seis páginas distintas no sirve la noche antes de un examen. Lo que
        **no** hace es inventarse ninguna fórmula nueva; todas están enlazadas
        a su apartado.
