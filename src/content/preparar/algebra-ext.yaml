asignatura: algebra
evaluacion: extraordinaria
titulo: Preparar la convocatoria extraordinaria
lede: >-
  La extraordinaria de Álgebra tiene la misma estructura que la ordinaria y
  **cambia un hueco**: donde la ordinaria pone espacios euclídeos, la
  extraordinaria pone determinantes, y siempre con la misma pregunta —«¿para
  qué valor existe la inversa?»—. Cuatro convocatorias extraordinarias leídas
  —de 2021-22 a 2024-25, una por curso—, y las cuatro lo hacen igual.
temas:
  - t01-espacios-vectoriales
  - t02-aplicaciones-lineales
  - t03-matrices
  - t04-determinantes
  - t05-sistemas-lineales
  - t06-espacios-euclideos
  - t07-diagonalizacion
medidoSobre: 8
criterioDeOrden: >-
  El mismo que en la ordinaria, y por el mismo motivo: los cuatro huecos del
  examen son fijos y salen siempre en el mismo orden, así que los bloques van
  detrás de ellos. Delante, el suelo —sistemas, rangos y operaciones con
  matrices—, que no ocupa ningún hueco y sin el cual no se termina ninguno de
  los cuatro. Detrás, el formulario. Lo único que cambia respecto de la
  ordinaria es el bloque del hueco 3, y ese cambio está medido: euclídeos en
  las cuatro ordinarias, determinantes en las cuatro extraordinarias.

  **Lo que esta ruta no prepara.** El examen de prácticas de ordenador con
  Maxima, que en la extraordinaria vale el 10 % y lo tiene quien no ha
  aprobado las prácticas, como avisa el pie de las extraordinarias de 2023-24
  y 2024-25. En este sitio no hay nada de él.

bloques:
  # ═══════════════════════════════════════════════════════════════════
  # SUELO
  # ═══════════════════════════════════════════════════════════════════
  - id: suelo-sistemas-y-matrices
    apunte:
      texto: 'no da puntos — los sostiene todos'
      tono: marco
    titulo: Sistemas, rangos y operaciones con matrices
    pide: >-
      No lo pide con estas palabras. Lo pide con «hallar una base del núcleo»,
      «calcular las coordenadas en la base B'», «hallar los vectores propios»
      y, en la extraordinaria, también con «desarrolla esta ecuación para
      obtener A⁴».
    porque: >-
      **Ni matrices ni sistemas ocupan un hueco del examen**: cero de treinta y
      dos entre los dos. Y aun así se usan en los cuatro. En la extraordinaria
      pesan además por otro sitio: el hueco 3 es de determinantes, y ahí hacen
      falta las potencias, la traspuesta y el producto —cosas del tema 3— antes
      de tocar ninguna inversa.
    invariante:
      anios: 0
      fuente: >-
        Contado sobre los 32 ejercicios de las ocho convocatorias, leídos uno a
        uno: **ninguno** tiene un enunciado de matrices o de sistemas como tal,
        y ese cero es el recuento de este bloque. Lo que sí pasa es lo otro, y
        también está contado: los cuatro huecos de las ocho usan al menos uno
        de los dos.
    dominio: >-
      Que sepas resolver un sistema con parámetro empezando por el determinante,
      y que ante un producto de matrices no des por hecho que se puede reordenar
      ni simplificar.
    escalones:
      - id: clasificar-y-resolver
        titulo: Clasificar antes de resolver
        aprendes: >-
          Decir si un sistema tiene solución, cuántas y de cuántos parámetros
          depende, comparando dos rangos y sin haber despejado nada.
        dominio: >-
          Que sepas de antemano cuántos parámetros va a tener la respuesta —es
          $n-r$— y que ante un homogéneo no escribas nunca «incompatible».
        teoria:
          tema: t05-sistemas-lineales
          apartado: rouché-fröbenius-la-clasificación-en-dos-comparaciones
          nota: >-
            Dos comparaciones y ya está clasificado. La primera decide si hay
            solución; la segunda, cuántas.
        ejercicios:
          - id: ejalg5-rouche-en-dos-comparaciones
            incrustado: true
            nota: >-
              El más corto, y enseña a mirar antes de escalonar: la tercera
              ecuación es la suma de las dos primeras.
          - id: ejalg5-bol51-dos-parametros-y-tres-casos
            nota: >-
              Del boletín, con **dos** parámetros, y el guion los separa: uno se
              decide sin tocar el otro.
          - id: ejalg5-cramer-cuando-piden-una-sola-incognita
            incrustado: true
            nota: >-
              El tercer método, y el único caso en que compensa: cuando piden
              **una** incógnita y no las tres. Aquí pesa doble, porque el hueco
              3 de la extraordinaria es de determinantes y este ejercicio los
              usa para algo.
      - id: el-producto-que-no-se-porta-bien
        titulo: Las tres cosas que el producto de matrices no cumple
        aprendes: >-
          Reconocer que el producto de matrices no conmuta, que tiene divisores
          de cero y que no se puede simplificar, y llevar un contraejemplo de
          cada una en la cabeza.
        dominio: >-
          Que ante «$\left(I+A+A^{2}+A^{3}\right)\left(I-A\right)=0$» no
          escribas nunca «luego uno de los dos factores es la matriz nula».
        teoria:
          tema: t03-matrices
          apartado: las-operaciones-y-las-tres-cosas-que-el-producto-no-cumple
          nota: >-
            La figura trae el par de matrices de la propia hoja de teoría
            oficial. Vale la pena memorizarlo: cabe en el margen del examen.
        ejercicios:
          - id: ejalg3-el-producto-no-conmuta
            incrustado: true
            nota: >-
              Los dos productos seguidos, y la conclusión sobre simplificar.
          - id: exalg2122-ext-3-una-ecuacion-que-da-la-inversa-sin-calcularla
            nota: >-
              De la extraordinaria de 2021-2022, y es exactamente el error que
              este escalón previene: de un producto nulo no se sigue nada.
      - id: potencias-sin-multiplicar
        titulo: Potencias, sin multiplicar cien veces
        aprendes: >-
          Bajar el grado de una potencia con una relación entre $A^{2}$, $A$ e
          $I$, sin diagonalizar y sin multiplicar la matriz por sí misma.
        dominio: >-
          Que ante «halla $m$ y $n$ para que $A^{2}+mA+nI=0$» leas la traza y el
          determinante en vez de calcular $A^{2}$.
        teoria:
          tema: t03-matrices
          apartado: potencias-y-el-atajo-de-cayley-hamilton
          nota: >-
            En orden $2$ los dos coeficientes se leen de la matriz. Es
            Cayley-Hamilton, y el boletín lo pide sin nombrarlo.
        ejercicios:
          - id: ejalg3-cayley-hamilton-baja-la-potencia
            incrustado: true
            nota: >-
              Los coeficientes sin calcular $A^{2}$, y luego $A^{3}$ reducido a
              $\alpha A+\beta I$.
          - id: ejalg3-bol31-simetrica-mas-antisimetrica
            nota: >-
              Del boletín, y es el otro uso de la traspuesta: toda cuadrada se
              parte en dos, de una sola manera.
    falta:
      - >-
        **~~No hay ningún ejercicio guiado del método de Cramer~~ · resuelto el
        8 de septiembre de 2026, y con una cifra mal contada dentro.** La nota
        decía «cinco veces en el corpus»: son **veintiuna** en las páginas de
        Álgebra —veinte en el tema 5 y una en el tema 2—. En lo demás acertaba:
        las veintiuna son el nombre y ninguna es el método. La prosa del tema 5
        escribe la fórmula y dice cuándo compensa; lo que no había era un
        ejercicio que la aplicara, porque el boletín tampoco lo trae. Ya está,
        y es nuestro: lo abre este escalón. Y en la extraordinaria importa algo
        más que en la ordinaria, porque el hueco 3 es de determinantes.
      - >-
        Y una corrección del rótulo de arriba, del **8 de septiembre de 2026**:
        decía «Cae 8 de 8 años» encima de un texto que dice «cero de treinta y
        dos». La de arriba iba destacada, que es la que se lee. Ahora dice «No
        cae solo, está dentro de las 8». Es el mismo fallo que se corrigió en
        el suelo de Fluidos el 7 de septiembre sin comprobar si estaba en más
        sitios: estaba aquí y en la ruta ordinaria.

  # ═══════════════════════════════════════════════════════════════════
  # HUECO 1
  # ═══════════════════════════════════════════════════════════════════
  - id: hueco-1-subespacios
    apunte:
      texto: 'las 8 convocatorias — 7 piden demostrar'
      tono: nota
    titulo: Hueco 1 · Demostrar que algo es subespacio, con base y dimensión
    pide: >-
      «Demostrar que uno de los siguientes subconjuntos es subespacio vectorial
      y que el otro no lo es», «hallar una base y la dimensión», «calcula las
      coordenadas del vector respecto de la base obtenida».
    porque: >-
      El ejercicio 1 es de espacios vectoriales en **las ocho convocatorias**.
      **Siete de ocho** piden demostrar que algo es subespacio, **siete de
      ocho** piden base o dimensión, **seis de ocho** piden coordenadas y
      **cinco de ocho** ponen el subespacio dentro de un espacio de **matrices**.
      Y hay algo propio de la extraordinaria: **las tres** que piden demostrar
      la unicidad de la expresión de una combinación lineal son
      extraordinarias.
    invariante:
      anios: 8
      fuente: >-
        Contado sobre los ocho enunciados del ejercicio 1. La demostración de
        la unicidad aparece en las extraordinarias de 2021-2022, 2022-2023 y
        2024-2025, y en ninguna ordinaria.
    dominio: >-
      Que ante cualquier conjunto decidas en diez segundos si el vector nulo
      está dentro, y que si lo está sepas escribirlo como $L(G)$ en una línea.
    escalones:
      - id: es-subespacio-o-no
        titulo: Decidirlo, y demostrarlo en una línea
        aprendes: >-
          Descartar un conjunto en diez segundos mirando si contiene al vector
          nulo, y demostrar que otro sí lo es escribiéndolo como una clausura
          lineal.
        dominio: >-
          Que ante un término independiente no nulo, un cuadrado o una
          desigualdad escribas «no» sin más cuentas; y que ante un conjunto por
          parámetros escribas $L(G)$ y lo des por demostrado.
        teoria:
          tema: t01-espacios-vectoriales
          apartado: subespacio-la-comprobación-que-cabe-en-tres-líneas
          nota: >-
            El criterio es «lineal e igualada a cero, o no lo es». Todo lo demás
            —un $7$, un cuadrado, un $\geq$— lo estropea.
        ejercicios:
          - id: ejalg1-lo-primero-es-mirar-el-cero
            incrustado: true
            nota: >-
              Tres conjuntos, y el tercero enseña el límite del atajo: contiene
              al cero y aun así no es subespacio.
          - id: ejalg1-bol6-cuales-son-subespacios-de-r3
            nota: >-
              Del boletín, ocho de golpe. Cinco lo son.
          - id: ejalg1-bol7-ocho-candidatos-a-subespacio-de-r4
            nota: >-
              Ocho conjuntos de $\mathbb{R}^{4}$ y dos filtros que deciden
              seis: ¿está el cero? ¿los parámetros recorren $\mathbb{R}$?
          - id: ejalg1-bol8-subespacios-de-funciones
            nota: >-
              Los vectores son funciones y el criterio es el mismo. Un
              cuadrado, una constante, y una condición lineal homogénea.
          - id: ejalg1-bol1-los-polinomios-de-grado-uno
            nota: >-
              Y el mismo salto con **polinomios**: comprobar los ocho axiomas
              sobre los de grado menor o igual que uno. Funciones y polinomios
              están aquí seguidos a propósito — el examen puede llamar vector a
              cualquier cosa, y lo que hay que tener automatizado es la lista de
              comprobaciones, no el dibujo de la flecha.
          - id: exalg2223-ext-1-un-subespacio-y-otro-que-no-lo-es
            nota: >-
              De la extraordinaria de 2022-2023, y con matrices de
              $2\times3$: dos conjuntos casi iguales y solo uno vale.
      - id: base-dimension-y-unicidad
        titulo: Base, dimensión, y por qué las coordenadas son únicas
        aprendes: >-
          Sacar base y dimensión de cualquier subespacio dado por parámetros, y
          demostrar que la expresión de un vector sobre una familia libre es
          única.
        dominio: >-
          Que puedas escribir de memoria la demostración de la unicidad —son
          cuatro líneas y todo el peso lo lleva la definición de libre— y que no
          la confundas con «luego es base».
        teoria:
          tema: t01-espacios-vectoriales
          apartado: base-dimensión-y-coordenadas
          nota: >-
            La demostración se hace restando, igual que la de «inyectiva si y
            solo si el núcleo es nulo» del tema 2. Es la misma idea dos veces.
        ejercicios:
          - id: ejalg1-del-elemento-generico-a-la-base
            incrustado: true
            nota: >-
              El molde de los tres pasos: elemento genérico, separar, contar.
          - id: ejalg1-bol13-una-base-de-polinomios-y-una-familia-libre
            nota: >-
              Los vectores son polinomios: igualar coeficientes es la
              demostración de que una familia es libre.
          - id: ejalg1-bol21-completar-tres-vectores-hasta-una-base-de-r5
            nota: >-
              Teorema de la base incompleta en la práctica: canónicos de uno
              en uno, comprobando que el rango sube.
          - id: exalg2425-ext-1-las-coordenadas-son-unicas-y-un-subespacio-de-matrices
            nota: >-
              De la extraordinaria de 2024-2025, y trae las dos cosas juntas: la
              unicidad y un subespacio de matrices.
          - id: exalg2324-ext-1-dos-combinaciones-y-las-matrices-de-traza-nula
            nota: >-
              De la extraordinaria de 2023-2024, con un parámetro en la
              dependencia lineal y las matrices de traza nula.
      - id: coordenadas-y-suma
        titulo: Coordenadas, suma e intersección
        aprendes: >-
          Cambiar de base en los dos sentidos, y calcular $S+T$ y $S\cap T$
          eligiendo la forma cómoda de cada uno.
        dominio: >-
          Que digas en voz alta si el apartado es «multiplicar» o «resolver»
          antes de escribir nada, y que compruebes Grassmann al final aunque no
          te lo pidan.
        teoria:
          tema: t01-espacios-vectoriales
          apartado: cambiar-de-base-y-en-qué-sentido-va-cada-cosa
          nota: >-
            La tabla de dos filas. De la base nueva a la vieja se multiplica; al
            revés, se resuelve.
        ejercicios:
          - id: ejalg1-las-coordenadas-y-el-sentido-del-cambio
            incrustado: true
            nota: >-
              Los dos sentidos seguidos, en $\mathbb{R}^{2}$.
          - id: ejalg1-bol12-suma-e-interseccion-en-r3
            nota: >-
              Del boletín: un plano y una recta que no está dentro.
          - id: ejalg1-bol19-la-base-nueva-a-partir-de-las-ecuaciones-del-cambio
            nota: >-
              Las ecuaciones dan $X = PY$: la base nueva son las columnas de
              $P$, pero en coordenadas de la vieja. Confundir coordenadas
              con vector es el error del ejercicio.
          - id: ejalg1-bol30-examen-dos-subespacios-de-r5
            nota: >-
              De examen: los dos por ecuaciones, la intersección es el
              sistema conjunto y la suma sale por Grassmann.
          - id: exalg2122-ext-1-un-subespacio-por-generadores-y-otro-por-ecuaciones
            nota: >-
              De la extraordinaria de 2021-2022, y es el caso cómodo servido:
              uno por generadores y otro por ecuaciones.
    falta:
      - >-
        **~~No hay ningún ejercicio guiado sobre espacios de polinomios~~ ·
        resuelto el 8 de septiembre de 2026, y la nota estaba mal contada.**
        Los dos del boletín estaban escritos; el de la base $1,x,x^{2}$ ya lo
        enlazaba el escalón siguiente y el de los ocho axiomas acaba de
        entrar arriba. Lo que faltaba no era el ejercicio, era la ruta.

  # ═══════════════════════════════════════════════════════════════════
  # HUECO 2
  # ═══════════════════════════════════════════════════════════════════
  - id: hueco-2-aplicaciones
    apunte:
      texto: 'las 8 convocatorias — la matriz en otra base'
      tono: nota
    titulo: Hueco 2 · La matriz asociada, el núcleo y la imagen
    pide: >-
      «Hallar la matriz de f en las bases B y B'», «calcular una base de Ker f
      e Im f y clasificar la aplicación», «obtén la expresión de f en la base
      canónica».
    porque: >-
      El ejercicio 2 es de aplicaciones lineales en **las ocho convocatorias**,
      y pide la **matriz asociada** en las ocho, **bases y dimensiones de Ker e
      Im** en las ocho y **clasificar** en siete de ocho. Es el ejercicio más
      previsible del examen. Y hay una vuelta de tuerca: **tres de las ocho**
      piden además la matriz en **otra base** que no es la canónica —las
      extraordinarias de 2023-2024 y 2024-2025 y la ordinaria de 2024-2025—.
    invariante:
      anios: 8
      fuente: >-
        Contado sobre los ocho enunciados del ejercicio 2. La matriz en otra
        base la piden las extraordinarias de 2023-2024 y 2024-2025 y la
        ordinaria de 2024-2025, esta en dos bases a la vez.
    dominio: >-
      Que ante tres datos cruzados llegues a la matriz sin dudar del orden, y
      que la compruebes contra los datos del enunciado antes de seguir.
    escalones:
      - id: la-matriz-en-columnas
        titulo: La matriz, y por qué va en columnas
        aprendes: >-
          Escribir la matriz asociada y comprobarla contra los datos del
          enunciado, sin confundirla con su traspuesta.
        dominio: >-
          Que después de escribirla multipliques por los vectores del enunciado
          y compruebes que salen sus imágenes.
        teoria:
          tema: t02-aplicaciones-lineales
          apartado: la-matriz-asociada-y-por-qué-las-imágenes-van-en-columnas
          nota: >-
            La hoja de teoría de este tema **no** define la matriz asociada:
            está en la de Matrices, apartado 3.2.
        ejercicios:
          - id: ejalg2-es-lineal-o-no-lo-es
            nota: >-
              Va el primero porque va antes en el examen: si la aplicación no es
              lineal, no hay ninguna matriz que escribir.
          - id: ejalg2-la-matriz-sale-de-las-columnas
            incrustado: true
            nota: >-
              El molde, con una aplicación de $\mathbb{R}^{2}$ en
              $\mathbb{R}^{3}$.
          - id: ejalg2-bol1-cuales-son-lineales
            nota: >-
              Del boletín, con los mismos tres casos y otros números.
          - id: ejalg2-bol10-de-una-base-a-otra-con-ecuaciones
            nota: >-
              Bases abstractas y matriz $4\times3$: las ecuaciones $y_i$ salen
              leyendo columnas, y una relación entre ellas da el núcleo.
          - id: exalg2223-ext-2-cuatro-imagenes-y-una-matriz-que-no-es-cuadrada
            nota: >-
              De la extraordinaria de 2022-2023, con una matriz $3\times4$: el
              orden ya avisa de que no puede ser inyectiva.
      - id: datos-cruzados-y-otra-base
        titulo: Datos torcidos, y la matriz en otra base
        aprendes: >-
          Despejar las imágenes de la base canónica a partir de datos mezclados,
          y reescribir la matriz en una base distinta.
        dominio: >-
          Que ante un núcleo dado por ecuaciones escribas
          $f\left(\overline{v}\right)=\overline{0}$ y lo uses como un dato más;
          y que sepas que la matriz en otra base se obtiene con el cambio de
          base por los dos lados.
        teoria:
          tema: t02-aplicaciones-lineales
          apartado: la-matriz-cuando-las-bases-no-son-la-canónica
          nota: >-
            Este escalón junta dos asuntos y el apartado enlazado es el del
            segundo, que es el que costaba: la fórmula de la matriz no cambia
            al cambiar de base, lo que cambia es que las coordenadas ya no
            vienen regaladas. El apartado de al lado, «Cuando los datos vienen
            cruzados», cubre el primero, y su paso que más se salta es
            comprobar que los vectores de partida son base.
        ejercicios:
          - id: ejalg2-bol9-tres-datos-encadenados
            incrustado: true
            nota: >-
              Del boletín, con las restas servidas: cada dato sale del anterior.
          - id: ejalg2-bol11-un-automorfismo-de-r4-y-otra-base
            nota: >-
              Cinco apartados sobre un automorfismo, y el último es la
              matriz en otra base: imágenes de $B$, escritas en $B$.
          - id: ejalg2-bol23-examen-el-nucleo-es-subespacio-y-una-matriz-en-bases-nuevas
            nota: >-
              De examen: cambiar la base de llegada obliga a resolver un
              sistema por columna. Sin atajo, y con comprobación.
          - id: exalg2324-ext-2-tres-datos-torcidos-y-una-aplicacion
            nota: >-
              De la extraordinaria de 2023-2024, y pide la matriz en una base
              $B'$ que da el enunciado.
          - id: exalg2425-ext-2-una-aplicacion-dada-por-tres-datos
            nota: >-
              De la extraordinaria de 2024-2025, con la misma vuelta de tuerca:
              la matriz asociada en otra base.
      - id: nucleo-imagen-y-clasificar
        titulo: Núcleo, imagen y la fórmula que decide antes de calcular
        aprendes: >-
          Dar bases y dimensiones del núcleo y la imagen leyendo las columnas, y
          clasificar la aplicación con la fórmula de las dimensiones.
        dominio: >-
          Que ante $f:\mathbb{R}^{4}\to\mathbb{R}^{3}$ digas «no puede ser
          inyectiva» antes de leer los datos, y que en un endomorfismo sepas que
          las dos propiedades van juntas.
        teoria:
          tema: t02-aplicaciones-lineales
          apartado: la-fórmula-de-las-dimensiones-y-lo-que-decide-antes-de-calcular
          nota: >-
            La tercera fila de la tabla es la que más se falla, y solo vale en
            un endomorfismo.
        ejercicios:
          - id: ejalg2-lo-que-la-formula-decide-antes-de-calcular
            incrustado: true
            nota: >-
              El contraejemplo de esa frase: sobreyectiva y no inyectiva a la
              vez, porque **no** es un endomorfismo.
          - id: ejalg2-bol7-nucleo-e-imagen-de-una-formula
            nota: >-
              Del boletín, con una variable que no aparece en la fórmula.
          - id: ejalg2-bol5-inyectiva-pero-no-suprayectiva
            nota: >-
              De $\mathbb{R}^{2}$ a $\mathbb{R}^{3}$ nunca es suprayectiva; lo
              único que hay que comprobar es el rango.
          - id: ejalg2-bol17-examen-rango-y-una-aplicacion-sobre-matrices
            nota: >-
              De examen: rango e inyectividad, el argumento de paridad de
              «$\operatorname{Ker}f \ne \operatorname{Im}f$», y una $f$ sobre
              matrices $2\times2$.
          - id: exalg2122-ext-2-tres-imagenes-en-una-base-torcida
            nota: >-
              De la extraordinaria de 2021-2022: tres datos sobre una base que
              no es la canónica, y un determinante nulo al final.
    falta:
      - >-
        **~~No hay ningún ejercicio guiado de la matriz en otra base~~ ·
        resuelto el 8 de septiembre de 2026, y la nota estaba mal escrita.**
        Decía que solo estaban los dos enunciados de examen, y este mismo
        bloque ya enlazaba dos ejercicios guiados que la piden — el
        automorfismo de R4 y el del núcleo como subespacio—. El tema 2 tiene
        **seis** en total. Lo que faltaba de verdad era el apartado de prosa
        que lo explicara, y ahora existe: la fórmula no cambia al cambiar de
        base, lo que cambia es que hay que escribir cada imagen en
        coordenadas.

  # ═══════════════════════════════════════════════════════════════════
  # HUECO 3 · el que distingue la extraordinaria
  # ═══════════════════════════════════════════════════════════════════
  - id: hueco-3-inversa
    apunte:
      texto: 'lo que distingue la extraordinaria — 4 de 8'
      tono: neutro
    titulo: Hueco 3 · La inversa, y para qué valores existe
    pide: >-
      «¿Para qué valor de a existe la inversa? Si es posible, calcula la
      inversa de A cuando a = 0», «calcular el valor de x para que exista
      A⁻¹», «para el caso x = −2, calcular A⁻¹».
    porque: >-
      **Este es el bloque que distingue la extraordinaria de la ordinaria.** El
      hueco 3 es de determinantes en **las cuatro convocatorias
      extraordinarias** y de espacios euclídeos en **las cuatro ordinarias**: no
      rota, está partido por convocatoria. Y dentro de las cuatro
      extraordinarias, **las cuatro** piden una **inversa** y **las cuatro** la
      condicionan a un parámetro.
    invariante:
      anios: 4
      fuente: >-
        Contado sobre las cuatro convocatorias extraordinarias transcritas
        —2021-2022, 2022-2023, 2023-2024 y 2024-2025—: en las cuatro el
        ejercicio 3 pide una matriz inversa y en las cuatro con una condición
        sobre un parámetro. En las cuatro ordinarias, ninguna.
    dominio: >-
      Que ante una matriz con parámetro calcules el determinante primero, digas
      «existe para todos menos estos» aunque la pregunta esté en singular, y
      elijas Gauss-Jordan si el orden es 4.
    escalones:
      - id: la-norma-y-sus-desigualdades
        titulo: El apartado a), que suele ser de espacios euclídeos
        aprendes: >-
          A demostrar Pitágoras, la identidad de polarización y la desigualdad
          triangular desarrollando cuadrados: tres de las cuatro
          extraordinarias abren el ejercicio 3 con una de ellas, aunque el
          cálculo que sigue sea de determinantes.
        dominio: >-
          Que escribas cada una partiendo de la norma como raíz del producto
          escalar de un vector consigo mismo, y que sepas en qué paso de la
          triangular entra Cauchy-Schwarz.
        teoria:
          tema: t06-espacios-euclideos
          apartado: norma-y-las-desigualdades-que-caen
        ejercicios:
          - id: exalg2223-ext-3-cuando-existe-la-inversa-y-cuanto-vale
            nota: >-
              Pitágoras, con las definiciones de norma y de vectores
              ortogonales delante.
          - id: exalg2324-ext-3-la-identidad-de-polarizacion-y-una-inversa
            nota: >-
              La identidad de polarización: dos cuadrados que se desarrollan
              y se restan.
          - id: exalg2425-ext-3-minkowsky-y-la-matriz-con-parametro
            nota: >-
              La triangular, que el enunciado llama desigualdad de Minkowsky.
      - id: las-propiedades-del-determinante
        titulo: Las propiedades, que son el ejercicio
        aprendes: >-
          Calcular determinantes de productos, traspuestas, potencias, inversas
          y múltiplos sin desarrollar ninguno.
        dominio: >-
          Que ante $\left|2B\right|$ con $B$ de orden $3$ escribas
          $8\left|B\right|$ y no $2\left|B\right|$, y que sepas que el
          determinante **no** es aditivo.
        teoria:
          tema: t04-determinantes
          apartado: las-propiedades-que-son-el-ejercicio
          nota: >-
            La tabla de ocho propiedades. La del escalar es la que cae y la que
            más se falla: el factor sale de **cada fila**.
        ejercicios:
          - id: ejalg4-las-propiedades-antes-que-la-cuenta
            incrustado: true
            nota: >-
              Cinco determinantes sin desarrollar ninguno.
          - id: ejalg4-bol412-cinco-por-cinco-con-x-en-la-diagonal
            nota: >-
              Una $5\times5$ que se factoriza en cinco factores lineales, y
              el enunciado pide nombrar la propiedad de cada paso.
          - id: ejalg4-bol420-examen-la-adjunta-y-una-ecuacion-de-grado-seis
            nota: >-
              De examen: la identidad $A(A^{*})^{T} = |A|\,I$ demostrada, y un
              determinante que es $(\lambda-1)^{6}$.
          - id: exalg2223-ord-3-determinantes-de-memoria-y-una-base-ortonormal
            nota: >-
              De la ordinaria de 2022-2023 —el único año en que estas
              propiedades caen fuera de una extraordinaria—, y pide exactamente
              los cinco.
      - id: calcular-el-determinante
        titulo: Calcularlo eligiendo bien por dónde
        aprendes: >-
          Elegir entre Sarrus, adjuntos y Gauss según la matriz, y fabricar
          ceros antes de desarrollar cuando no los hay.
        dominio: >-
          Que antes de empezar mires dónde hay ceros; que sepas que Sarrus solo
          existe en orden $3$; y que si divides una fila en Gauss recuerdes
          multiplicar el resultado por ese factor.
        teoria:
          tema: t04-determinantes
          apartado: calcularlo-tres-caminos-y-cuándo-usar-cada-uno
          nota: >-
            Elegir bien la fila es la mitad del trabajo: una fila con tres ceros
            convierte un orden $4$ en un orden $3$.
        ejercicios:
          - id: ejalg4-una-fila-con-ceros-vale-mas-que-sarrus
            incrustado: true
            nota: >-
              Un orden $4$ resuelto con **un** determinante de orden $3$.
          - id: ejalg4-bol42-cinco-por-cinco-restando-la-primera
            nota: >-
              El patrón «todas las filas casi iguales»: restar la primera a
              las demás y queda triangular.
          - id: ejalg4-bol415bis-examen-inversa-y-circulante
            nota: >-
              De examen: cuándo existe la inversa, $A^{2}-A-I = 0$, y un
              determinante circulante que vale $1875$.
          - id: ejalg4-bol46-un-determinante-por-gauss
            nota: >-
              Del boletín, y la mitad del enunciado es comprobarlo por otro
              camino. En un examen sin calculadora eso no es un lujo.
      - id: la-inversa-con-parametro
        titulo: La inversa, y los valores que la estropean
        aprendes: >-
          Decidir para qué valores del parámetro existe la inversa, y calcularla
          para uno concreto por el camino que corresponda al orden.
        dominio: >-
          Que la respuesta a «¿para qué valor existe?» sea «para todos menos
          estos dos», y que en orden $4$ no intentes la adjunta: son dieciséis
          determinantes de orden $3$.
        teoria:
          tema: t04-determinantes
          apartado: la-matriz-inversa
          nota: >-
            Los dos caminos y cuándo compensa cada uno. La figura enseña por qué
            Gauss-Jordan funciona.
        ejercicios:
          - id: ejalg4-bol414-una-inversa-de-orden-4
            incrustado: true
            nota: >-
              Del boletín, orden $4$ y determinante $1$: la inversa sale con
              todo enteros.
          - id: ejalg4-bol418-examen-dos-falsedades-y-una-inversa-con-alfa
            nota: >-
              De examen: dos contraejemplos a «$A^{2} = I$», el rango según
              $\alpha$ y la inversa entera para $\alpha = 0$.
          - id: ejalg4-bol419-examen-la-inversa-con-k-en-la-diagonal
            nota: >-
              De examen: $\det = k^{2}(k-3)$ dividiendo entre $k$, con el caso
              $k = 0$ aparte, y la inversa para $k = 1$.
          - id: exalg2223-ext-3-cuando-existe-la-inversa-y-cuanto-vale
            nota: >-
              De la extraordinaria de 2022-2023: una matriz $4\times4$ con
              parámetro, y el determinante sale $x^{2}-1$.
          - id: exalg2122-ext-3-una-ecuacion-que-da-la-inversa-sin-calcularla
            nota: >-
              De la extraordinaria de 2021-2022, y trae las dos formas: una
              inversa **regalada** por una ecuación, y otra con parámetro.
          - id: exalg2324-ext-3-la-identidad-de-polarizacion-y-una-inversa
            nota: >-
              De la extraordinaria de 2023-2024, con la identidad de
              polarización en el apartado a) y la inversa en el b).
          - id: exalg2425-ext-3-minkowsky-y-la-matriz-con-parametro
            nota: >-
              De la extraordinaria de 2024-2025, con Minkowsky delante y la
              misma inversa con parámetro detrás.
      - id: el-rango-con-parametro
        titulo: El rango, cuando el determinante se anula
        aprendes: >-
          Discutir el rango de una matriz con parámetro sin abrir un caso por
          cada valor.
        dominio: >-
          Que cuando el determinante de orden $3$ se anule no contestes «rango
          2» por inercia: hay que mirar la matriz en ese valor.
        teoria:
          tema: t04-determinantes
          apartado: el-rango
          nota: >-
            El procedimiento de tres pasos, y el aviso de que los valores que
            anulan el determinante son los únicos que hay que estudiar aparte.
        ejercicios:
          - id: ejalg4-el-rango-con-un-parametro-dentro
            incrustado: true
            nota: >-
              Un solo valor lo estropea, y ahí el rango baja a $1$ y no a $2$.
          - id: ejalg4-bol417-examen-rango-de-a-mas-uno-en-la-diagonal
            nota: >-
              De examen: el rango de $aI+J$ según $a$, con los dos valores
              que lo bajan y cuánto lo bajan.
          - id: ejalg5-bol54-el-nucleo-es-un-sistema-homogeneo
            nota: >-
              Del boletín de sistemas, y es el mismo cálculo con otro nombre: la
              dimensión del núcleo según el parámetro.
    falta:
      - >-
        ~~El apartado a) de estas extraordinarias suele ser una demostración de
        **espacios euclídeos** —Pitágoras, polarización, Minkowsky— aunque el
        cálculo sea de determinantes. Esa parte está cubierta por el tema 6, que
        esta ruta no incluye entre sus temas porque su hueco es de la ordinaria.
        Si te examinas de la extraordinaria, esas tres demostraciones hay que
        estudiarlas igual.~~ · **resuelto el 27 de septiembre de 2026**: el
        primer escalón de este bloque lleva al apartado del tema 6 donde están
        las tres, con los tres ejercicios que las piden.

  # ═══════════════════════════════════════════════════════════════════
  # HUECO 4
  # ═══════════════════════════════════════════════════════════════════
  - id: hueco-4-diagonalizar
    apunte:
      texto: 'las 8 — con teoría de autovalores'
      tono: nota
    titulo: Hueco 4 · Diagonalizar, y decidir cuándo se puede
    pide: >-
      «Demostrar que los autovectores asociados a autovalores diferentes son
      linealmente independientes», «calcula los valores del parámetro a para
      que la matriz A sea diagonalizable», «en caso de ser diagonalizable,
      diagonalizar A dando la matriz de cambio de base».
    porque: >-
      El ejercicio 4 es de diagonalización en **las ocho convocatorias**, y en
      las ocho pide una demostración de teoría además del cálculo. Solo **dos
      de las ocho** meten un parámetro, las extraordinarias de 2021-2022 y
      2022-2023; las de 2023-2024 y 2024-2025 dan la matriz con números, y la
      última pide diagonalizarla con paso ortogonal.
    invariante:
      anios: 8
      fuente: >-
        Contado sobre los ocho enunciados del ejercicio 4. Llevan letras la
        extraordinaria de 2021-2022 —el parámetro $a$— y la de 2022-2023
        —$\alpha$, $\beta$ y $\gamma$, que fija el dato del autovector—; las
        otras seis dan la matriz con números.
    dominio: >-
      Que ante una matriz con parámetro factorices el polinomio primero y solo
      calcules rangos donde dos autovalores coinciden.
    escalones:
      - id: autovalores-con-atajos
        titulo: Los autovalores, sin desarrollar el determinante
        aprendes: >-
          Sacar autovalores con la traza, el determinante y los tres atajos,
          antes de desarrollar nada.
        dominio: >-
          Que ante una matriz cuyas filas suman lo mismo escribas ese número
          como autovalor y $\left(1,\dots,1\right)$ como su autovector.
        teoria:
          tema: t07-diagonalizacion
          apartado: leerlo-sin-desarrollarlo
          nota: >-
            Y las dos comprobaciones gratis: los autovalores suman la traza y
            multiplican el determinante.
        ejercicios:
          - id: ejalg7-autovalor-y-autovector-de-una-2x2
            incrustado: true
            nota: >-
              El más pequeño posible, y ya usa el atajo de las filas.
          - id: ejalg7-bol72-traza-y-determinante-contra-autovalores
            nota: >-
              Del boletín: la traza y el determinante como comprobación
              gratis de los autovalores, antes de creerse el polinomio.
          - id: ejalg7-bol718-simetrica-por-bloques
            nota: >-
              Una coordenada que va sola y un bloque $2\times2$ de filas de
              igual suma: los tres autovalores sin un solo determinante.
          - id: exalg2223-ext-4-los-parametros-que-el-autovector-obliga
            nota: >-
              De la extraordinaria de 2022-2023, y la idea es al revés: el
              autovector **dado** es un sistema de tres ecuaciones.
      - id: las-dos-multiplicidades
        titulo: Las dos multiplicidades, que es lo que se examina
        aprendes: >-
          Decidir si una matriz diagonaliza comparando, para cada autovalor
          repetido, la multiplicidad algebraica con el rango de
          $A-\lambda I$.
        dominio: >-
          Que solo calcules rangos en los autovalores repetidos, y que si sale
          «no diagonaliza» escribas cuántas direcciones hay y cuántas faltan.
        teoria:
          tema: t07-diagonalizacion
          apartado: las-dos-multiplicidades-que-es-todo-el-tema
          nota: >-
            La figura lo resume: dos columnas que parten del mismo polinomio y
            acaban en respuestas opuestas.
        ejercicios:
          - id: ejalg7-las-dos-multiplicidades
            incrustado: true
            nota: >-
              El caso mínimo, en dos por dos. Vale la pena memorizarlo.
          - id: ejalg7-bol76-la-que-no-diagonaliza
            nota: >-
              Del boletín, con dos filas proporcionales que regalan el autovalor
              cero.
          - id: ejalg7-bol79-autovalor-doble-que-si-diagonaliza
            nota: >-
              La pareja buena: autovalor doble con rango 1, y diagonaliza.
          - id: ejalg7-bol720-examen-teoria-y-la-que-no-diagonaliza
            nota: >-
              De examen: la demostración de que autovectores de autovalores
              distintos son libres, y la matriz que no diagonaliza.
          - id: exalg2324-ext-4-esta-si-se-diagonaliza
            nota: >-
              De la extraordinaria de 2023-2024, y la que sí se diagonaliza — y
              no por ser simétrica, que es lo que uno esperaría.
      - id: el-parametro-en-la-diagonalizacion
        titulo: El parámetro, y los dos valores que lo estropean
        aprendes: >-
          Encontrar los valores del parámetro para los que una matriz deja de
          diagonalizar, sin abrir un caso por cada número.
        dominio: >-
          Que factorices el polinomio en función del parámetro, busques dónde
          coinciden dos autovalores —dos ecuaciones de primer grado— y solo ahí
          calcules rangos.
        teoria:
          tema: t07-diagonalizacion
          apartado: con-parámetro
          nota: >-
            Tres pasos, y el orden es lo que hace corto el ejercicio. Ir al
            revés lo alarga sin necesidad.
        ejercicios:
          - id: ejalg7-las-dos-multiplicidades
            nota: >-
              Las dos multiplicidades, que son lo que el parámetro pone en juego.
          - id: ejalg7-bol77-simetrica-con-paso-ortogonal
            nota: >-
              Del boletín, y trae el paso que se salta: dentro del autovalor
              doble hay que ortogonalizar.
          - id: ejalg7-bol710-triangular-con-tres-parametros
            nota: >-
              Tres parámetros en una triangular, y solo dos deciden: el
              rango de $A-I$ y de $A-cI$.
          - id: ejalg7-bol717-un-parametro-que-decide
            nota: >-
              El parámetro desaparece del polinomio característico y aun
              así manda, a través del rango de $A-I$.
          - id: ejalg7-bol713-dos-parametros-y-paso-ortogonal
            nota: >-
              Dos parámetros a la vez, y el mejor final del boletín: los
              autovalores salen $x+m$, $x-m$ y $2$ —dependen de todo— y la
              matriz de paso **no depende de ninguno de los dos**. Sale
              ortogonal sin tocar Gram-Schmidt.
          - id: exalg2122-ext-4-el-parametro-que-decide-si-diagonaliza
            incrustado: true
            nota: >-
              De la extraordinaria de 2021-2022, y es el molde: los autovalores
              salen $1$, $a+8$ y $a-8$, y solo dos valores los hacen coincidir.
          - id: exalg2425-ext-4-diagonalizar-con-una-base-ortonormal
            nota: >-
              De la extraordinaria de 2024-2025, que además pide la matriz de
              paso ortogonal.
      - id: para-que-sirve
        titulo: 'Y para qué sirve: potencias'
        aprendes: >-
          Usar $A^{n}=PD^{n}P^{-1}$ para calcular una potencia grande sin
          multiplicar la matriz por sí misma.
        dominio: >-
          Que sepas decir en una frase por qué se diagonaliza: para cambiar a la
          base donde la matriz no hace nada complicado.
        teoria:
          tema: t07-diagonalizacion
          apartado: para-qué-sirve-potencias
        ejercicios:
          - id: ejalg7-para-que-sirve-diagonalizar
            incrustado: true
            nota: >-
              La potencia cuarta con la fórmula, y la general de propina.
          - id: ejalg7-bol721-examen-la-potencia-veinte
            nota: >-
              De examen: $A^{20}$ con $D^{20} = I$. Y la trampa de creer que
              $P$ y $P^{-1}$ se cancelan con la $D$ en medio.
          - id: ejalg7-bol722-examen-una-permutacion-simetrica
            nota: >-
              De examen: $A^{6}$ y $A^{-1}$ con $P$ ortogonal, sin invertir
              nada.
    falta:
      - >-
        **~~No hay ningún ejercicio guiado de orden 4~~ · resuelto el 8 de
        septiembre de 2026, y la nota estaba mal contada.** El tema 7 tiene
        **cuatro de orden 4**: el característico contrastado con traza y
        determinante, la antidiagonal con dos autovalores dobles, la base
        ortonormal de R4 y la que se rompe en dos bloques. Este bloque ya
        enlazaba el primero. Y la coletilla que le puse —«la matriz con
        parámetro del boletín no está transcrita»— también era falsa: el
        boletín tiene **cuatro con parámetro** y las cuatro están escritas;
        tres las enlaza ya el escalón del parámetro. Lo que de verdad queda es
        que **ninguna de las cuatro es de orden 4**: tres son $3\times3$ y la
        otra es un endomorfismo de $\mathbb{R}^{3}$. No es una laguna del
        sitio, es cómo es el boletín.

  # ═══════════════════════════════════════════════════════════════════
  # LAS DEMOSTRACIONES QUE CAEN
  # ═══════════════════════════════════════════════════════════════════
  # Fase D1 de la auditoría del 27 de septiembre de 2026, que lo pide como
  # «bloque o página, por frecuencia». La prueba de utilidad de §13:
  #   · Para quién: quien prepara la extraordinaria y ya ha pasado por los
  #     cuatro huecos, que traen cada uno su apartado a) pero repartido entre
  #     ellos.
  #   · Cuándo: la última semana, cuando toca llevar la teoría escrita.
  #   · Qué gana: la teoría de los cuatro ejercicios. 29 de los 32
  #     enunciados de las ocho convocatorias piden demostrar algo, y 30 piden
  #     al menos una de las ocho familias de abajo.
  #   · Cómo se comprueba: cada ejercicio enlazado tiene su paso `redactar`,
  #     con una rúbrica que marca los mínimos del corrector. Si el folio los
  #     tiene todos, esa demostración está.
  # Es el mismo bloque que el de la ruta de la ordinaria, con los escalones
  # en el orden de la extraordinaria.
  - id: demostraciones-que-caen
    apunte:
      texto: '29 de los 32 enunciados piden demostrar'
      tono: neutro
    titulo: Las demostraciones que caen, de la que más a la que menos
    pide: >-
      «Demostrar que…», «Definir… y demostrar que…», «Razonar si las
      siguientes afirmaciones son ciertas». Casi siempre en el apartado a), y
      nunca depende de los números del examen.
    porque: >-
      De los 32 ejercicios de las ocho convocatorias, **29 piden demostrar
      algo**, dos piden razonar si unas afirmaciones son ciertas y uno es una
      cuenta con matrices. Y lo que se pide demostrar se repite: **30 de los 32
      piden al menos una de las ocho familias de abajo**; los otros dos son esa
      cuenta y una demostración que no ha vuelto a caer. Que algo es
      subespacio cae **en las ocho** convocatorias, y el ejercicio 4 pide una
      de las cuatro de diagonalización también en las ocho; alguna definición,
      en seis.


      Los escalones van por lo que más cae **en las cuatro extraordinarias**,
      y a igualdad, por lo que más cae en las ocho. Cada ejercicio enlazado
      tiene su paso `redactar`: lo escribes en papel y lo comparas con una
      rúbrica que marca lo que el corrector exige.
    invariante:
      anios: 8
      fuente: >-
        Contado sobre los 32 enunciados de las ocho convocatorias, leídos uno a
        uno: 29 piden demostrar algo. Los tres que no: la extraordinaria y la
        ordinaria de 2024-25 piden razonar si unas afirmaciones son ciertas, en
        sus ejercicios 2 y 3, y el ejercicio 3 de la extraordinaria de 2021-22
        es una cuenta. Que la intersección de tres subespacios y el núcleo sean
        la misma familia es lectura nuestra: es la comprobación de subespacio
        con dos conjuntos distintos.
    dominio: >-
      Que puedas escribir sin mirar las que más caen en extraordinaria —que
      algo es subespacio, la del ejercicio 4, las definiciones, una de las
      igualdades de la norma y la unicidad de las coordenadas— y que sepas
      comprobar lo escrito contra la rúbrica de cada una, marcando sus
      mínimos.
    escalones:
      - id: que-algo-es-subespacio
        titulo: Que algo es subespacio, que cae en las ocho
        aprendes: >-
          Demostrar que un conjunto dado por una condición es subespacio: el
          cero con su motivo, dos elementos y dos escalares cualesquiera, la
          propiedad que lo cierra nombrada donde entra, y de qué espacio es
          subespacio.
        teoria:
          tema: t01-espacios-vectoriales
          apartado: subespacio-la-comprobación-que-cabe-en-tres-líneas
          nota: >-
            La comprobación que sirve para todos. El núcleo, la suma, la
            intersección, las matrices de traza nula y el subespacio propio
            son esta misma con otro conjunto dentro.
        ejercicios:
          - id: ejalg2-bol23-examen-el-nucleo-es-subespacio-y-una-matriz-en-bases-nuevas
            nota: >-
              Del boletín, y la rampa: el núcleo es subespacio, con las tres
              comprobaciones preguntadas antes de escribirlas enteras.
          - id: exalg2324-ext-1-dos-combinaciones-y-las-matrices-de-traza-nula
            nota: >-
              Las matrices de traza nula, en la extraordinaria de 2023-24: lo
              que cierra el conjunto es que la traza es lineal. Que no sea
              multiplicativa no importa, y la rúbrica dice por qué.
          - id: exalg2223-ext-1-un-subespacio-y-otro-que-no-lo-es
            nota: >-
              Dos conjuntos casi iguales, y solo uno lo es: el que no, se
              descarta en una línea con el cero, y el que sí lleva la
              comprobación entera o sus generadores escritos.
          - id: exalg2223-ord-2-el-nucleo-dado-y-la-matriz-que-sale-de-el
            nota: >-
              El núcleo, definido y demostrado, en la ordinaria de 2022-23. Su
              rúbrica es la de toda la familia, y termina en una línea que
              conviene no saltarse: de qué espacio es subespacio.
        dominio: >-
          Que ante cualquier conjunto escribas los cuatro renglones en ese
          orden sin pensarlo, y que el primero —¿está el cero?— te diga en diez
          segundos si no lo es.
      - id: las-cuatro-de-diagonalizacion
        titulo: Las cuatro de diagonalización, una en cada ejercicio 4
        aprendes: >-
          Escribir las cuatro demostraciones que abren el ejercicio de
          diagonalización: que el polinomio característico no cambia al cambiar
          de base, que el subespacio propio es subespacio, que autovectores de
          autovalores distintos son independientes, y los autovalores de
          $A^{2}$, de $A^{-1}$ y de una $A$ con $A^{2}=I$.
        teoria:
          tema: t07-diagonalizacion
          apartado: las-demostraciones-que-caen
          nota: >-
            Las cuatro, seguidas y en pocas líneas cada una. La de la
            independencia va por inducción, y el tema dice por qué el caso de
            dos no basta.
        ejercicios:
          - id: ejalg7-bol723-examen-el-caracteristico-no-cambia
            nota: >-
              Del boletín, y la rampa: la invarianza, con las piezas de la
              demostración para ordenar antes de escribirla tú.
          - id: exalg2425-ext-4-diagonalizar-con-una-base-ortonormal
            nota: >-
              El subespacio propio, que cayó en las extraordinarias de 2023-24
              y de 2024-25, con el conjunto escrito como cae: se quita el cero
              y se vuelve a añadir, y la rúbrica empieza por decir por qué.
          - id: exalg2223-ext-4-los-parametros-que-el-autovector-obliga
            nota: >-
              La independencia, para cualquier número de autovalores. La
              resolución escribe la inducción entera, que es lo que se pide.
          - id: exalg2122-ext-4-el-parametro-que-decide-si-diagonaliza
            nota: >-
              La invarianza del polinomio característico, que en
              extraordinaria ha caído una vez y en ordinaria dos. El paso que
              hay que ver escrito es $\lambda I=P^{-1}\left(\lambda I\right)P$:
              sin él no hay factor común.
          - id: exalg2223-ord-4-el-mismo-polinomio-y-solo-una-diagonaliza
            nota: >-
              Los autovalores de $A^{-1}$ y de una $A$ con $A^{2}=I$, que solo
              ha pedido la ordinaria. Las dos se apoyan en lo mismo: el vector
              propio no es nulo.
        dominio: >-
          Que ante el ejercicio 4 reconozcas cuál de las cuatro te piden y la
          escribas sin mirar, con cada hipótesis nombrada en el paso donde
          entra.
      - id: las-definiciones-que-se-han-pedido
        titulo: Las ocho definiciones que se han pedido
        aprendes: >-
          Escribir de memoria, cada una con la condición que la hace buena, las
          definiciones que el examen ha pedido siete veces en seis
          convocatorias: núcleo e imagen, valor y vector propio, base y
          coordenadas, la suma de dos subespacios, norma y vectores
          ortogonales.
        ejercicios:
          - id: exalg2425-ext-1-las-coordenadas-son-unicas-y-un-subespacio-de-matrices
            nota: >-
              Base y coordenadas, pedidas juntas antes de demostrar que las
              coordenadas son únicas.
          - id: exalg2223-ext-3-cuando-existe-la-inversa-y-cuanto-vale
            nota: >-
              Norma y vectores ortogonales, pedidas antes de Pitágoras, que usa
              las dos.
          - id: exalg2223-ord-4-el-mismo-polinomio-y-solo-una-diagonaliza
            nota: >-
              Valor y vector propio, con el $\overline{x}\neq\overline{0}$ que
              la definición no puede perder: sin él, todo escalar sería valor
              propio. La extraordinaria de 2023-24 las pidió también, como
              «autovalor y autovector».
          - id: exalg2324-ord-2-la-imagen-de-una-base-genera-la-imagen
            nota: >-
              Núcleo e imagen, cada uno en su espacio: el núcleo en el de
              partida, la imagen en el de llegada. Por eso sus dimensiones
              suman $\dim V$ y nunca $\dim W$.
          - id: exalg2425-ord-1-la-suma-de-subespacios-y-una-base-de-r4
            nota: >-
              La suma $S+T$, que no es la unión: los dos ejes de
              $\mathbb{R}^{2}$ unidos no contienen a $\left(1,1\right)$.
        dominio: |-
          Que las escribas así, sin mirar:

          - $\operatorname{Ker}\left(f\right)=\left\{\overline{x}\in V\;:\;f\left(\overline{x}\right)=\overline{0}\right\}$,
            dentro de $V$.
          - $\operatorname{Im}\left(f\right)=\left\{f\left(\overline{x}\right)\;:\;\overline{x}\in V\right\}$,
            dentro de $W$.
          - $\lambda$ es valor propio de $f$ si existe
            $\overline{x}\neq\overline{0}$ con
            $f\left(\overline{x}\right)=\lambda\overline{x}$, y ese
            $\overline{x}$ es un vector propio asociado a $\lambda$.
          - Una base es una familia **libre** y **sistema generador** a la
            vez.
          - Las coordenadas de $\overline{x}$ en una base son los
            coeficientes de la única combinación de la base que da
            $\overline{x}$.
          - $S+T=\left\{s+t\;:\;s\in S,\;t\in T\right\}$.
          - $\left\|\overline{x}\right\|=\sqrt{\left\langle\overline{x},\overline{x}\right\rangle}$.
          - $\overline{u}$ y $\overline{v}$ son ortogonales si
            $\left\langle\overline{u},\overline{v}\right\rangle=0$.
      - id: las-igualdades-de-la-norma
        titulo: Pitágoras, la triangular y la polarización, tres extraordinarias seguidas
        aprendes: >-
          Demostrar las igualdades y desigualdades de la norma en un espacio
          euclídeo cualquiera, desarrollando
          $\left\|\overline{x}+\overline{y}\right\|^{2}$ con el producto
          escalar y nombrando la bilinealidad y la simetría donde entran.
        teoria:
          tema: t06-espacios-euclideos
          apartado: norma-y-las-desigualdades-que-caen
          nota: >-
            Todas salen del mismo desarrollo y se quedan con un trozo distinto;
            la triangular necesita además Cauchy-Schwarz para acotar el término
            cruzado.
        ejercicios:
          - id: exalg2223-ext-3-cuando-existe-la-inversa-y-cuanto-vale
            nota: >-
              Pitágoras, detrás de definir norma y vectores ortogonales, en
              2022-23. Y eso pese a que el ejercicio 3 de la extraordinaria sea
              de determinantes: su apartado a) ha sido de la norma tres años
              seguidos.
          - id: exalg2324-ext-3-la-identidad-de-polarizacion-y-una-inversa
            nota: >-
              La polarización, en 2023-24: al restar los dos desarrollos, los
              cuadrados se cancelan y los términos cruzados se suman.
          - id: exalg2425-ext-3-minkowsky-y-la-matriz-con-parametro
            nota: >-
              La triangular, con el nombre de Minkowski, en 2024-25.
          - id: exalg2122-ord-3-ortonormalizar-con-un-producto-escalar-que-no-es-el-de-siempre
            nota: >-
              Y la triangular y Pitágoras juntas, como las pidió la ordinaria
              de 2021-22.
        dominio: >-
          Que ante cualquiera de ellas empieces por la norma al cuadrado como
          producto escalar, y que el $2$ del término cruzado se lo atribuyas a
          la simetría y no a la bilinealidad.
      - id: la-unicidad-de-las-coordenadas
        titulo: La unicidad de las coordenadas, tres extraordinarias de cuatro
        aprendes: >-
          Demostrar que sobre una familia libre un vector se escribe de una
          sola manera: dos expresiones, la resta y la definición de libre.
        teoria:
          tema: t01-espacios-vectoriales
          apartado: base-dimensión-y-coordenadas
          nota: >-
            La demostración es una resta, y lo que usa es que la familia es
            libre, no que sea base.
        ejercicios:
          - id: exalg2425-ext-1-las-coordenadas-son-unicas-y-un-subespacio-de-matrices
            nota: >-
              Con el nombre de «las coordenadas son únicas», detrás de definir
              base y coordenadas, en 2024-25.
          - id: exalg2122-ext-1-un-subespacio-por-generadores-y-otro-por-ecuaciones
            nota: >-
              Como «se expresa de forma única», que es como cayó en 2021-22; en
              2022-23 fue «tiene expresión única». Las tres veces, en el
              ejercicio 1.
        dominio: >-
          Que la escribas en cuatro renglones y digas qué se ha usado: que la
          familia es libre, y solo eso.
      - id: inyectiva-si-y-solo-si-nucleo-cero
        titulo: Inyectiva si y solo si el núcleo es el cero
        aprendes: >-
          Demostrar las dos implicaciones de $f$ inyectiva
          $\iff\operatorname{Ker}\left(f\right)=\left\{\overline{0}\right\}$,
          cada una bajo su flecha, con la linealidad nombrada en los dos sitios
          donde entra.
        teoria:
          tema: t02-aplicaciones-lineales
          apartado: el-núcleo-qué-es-y-qué-decide
          nota: >-
            Se demuestra restando, como la unicidad de las coordenadas del
            tema 1.
        ejercicios:
          - id: ejalg2-bol16-examen-inyectiva-y-nucleo-trivial
            nota: >-
              Del boletín, y la rampa: la vuelta del teorema, preguntada paso a
              paso antes de escribirla entera.
          - id: exalg2324-ext-2-tres-datos-torcidos-y-una-aplicacion
            nota: >-
              Solo la vuelta, núcleo nulo implica inyectiva, que es la mitad en
              la que entra la hipótesis del núcleo. Así la pidió la
              extraordinaria de 2023-24.
          - id: exalg2425-ext-2-una-aplicacion-dada-por-tres-datos
            nota: >-
              El teorema usado en vez de demostrado: dos afirmaciones que se
              razonan pasando por el núcleo, en 2024-25.
          - id: exalg2425-ord-2-inyectiva-si-y-solo-si-el-nucleo-es-cero
            nota: >-
              Y entera, como la pidieron las ordinarias de 2021-22 y de
              2024-25. Es un «si y solo si», y una sola implicación es medio
              teorema.
        dominio: >-
          Que escribas las dos direcciones sin mezclarlas, y que en la vuelta se
          vea entrar la hipótesis: $\overline{x}-\overline{y}$ está en el
          núcleo, y el núcleo es el cero.
      - id: generadores-y-familias-libres
        titulo: Lo que una aplicación lineal hace con generadores y con familias libres
        aprendes: >-
          Demostrar que las imágenes de un sistema generador generan la
          imagen, y que una aplicación inyectiva lleva familias libres a
          familias libres, con la inyectividad en el paso que la necesita.
        teoria:
          tema: t02-aplicaciones-lineales
          apartado: los-dos-teoremas-de-libre-y-ligado
          nota: >-
            La tabla de los tres teoremas con la dirección marcada: solo el
            tercero necesita inyectividad. El de los generadores está en
            [la imagen](/road-to-ingenieria/algebra/t02-aplicaciones-lineales/#la-imagen-la-generan-las-columnas).
        ejercicios:
          - id: ejalg2-bol22-examen-generadores-van-a-generadores
            nota: >-
              Del boletín, y la rampa: por qué los generadores van a
              generadores, preguntado antes de escribirlo.
          - id: exalg2122-ext-2-tres-imagenes-en-una-base-torcida
            nota: >-
              Las dos seguidas, como cayeron en la extraordinaria de 2021-22.
          - id: exalg2223-ext-2-cuatro-imagenes-y-una-matriz-que-no-es-cuadrada
            nota: >-
              Las familias libres, en 2022-23. El contraejemplo de la
              aplicación nula dice en una línea por qué la inyectividad no se
              puede saltar.
          - id: exalg2324-ord-2-la-imagen-de-una-base-genera-la-imagen
            nota: >-
              Los generadores, y detrás una pregunta que hay que razonar: si
              además son base de la imagen.
        dominio: >-
          Que sepas cuál de los dos teoremas necesita inyectividad y por qué, y
          que en el de las familias libres arranques por una combinación nula
          de las imágenes, no de los vectores de partida.
      - id: ortogonales-idempotentes-y-la-inversa-del-producto
        titulo: Ortogonales, idempotentes y la inversa del producto, que la extraordinaria no ha pedido
        aprendes: >-
          Demostrar en tres líneas las propiedades de matrices que ha pedido el
          ejercicio 3 de la ordinaria desde 2022-23 —la inversa de un producto,
          las ortogonales, las idempotentes—, una distinta cada año y todas con
          la misma forma: la definición escrita como una igualdad, y una cuenta
          con ella.
        teoria:
          tema: t03-matrices
          apartado: ortogonales-e-idempotentes
          nota: >-
            Las dos familias con sus demostraciones cortas, y cómo se tumba
            una afirmación falsa: con una matriz concreta.
        ejercicios:
          - id: exalg2324-ord-3-matrices-ortogonales-y-un-producto-escalar-torcido
            nota: >-
              Ortogonales. El paso que decide es trasponer el producto con el
              orden invertido: dos ortogonales no tienen por qué conmutar.
          - id: exalg2425-ord-3-idempotentes-y-una-base-ortonormal
            nota: >-
              Idempotentes, con tres afirmaciones que razonar: la que sea
              cierta se demuestra, y la que sea falsa se tumba con una matriz
              escrita y comprobada, no con un «no tiene por qué».
          - id: exalg2223-ord-3-determinantes-de-memoria-y-una-base-ortonormal
            nota: >-
              La inversa del producto, y que conmutar se hereda a las
              inversas. Con matrices no se pasa dividiendo: se multiplica, y
              por el mismo lado en los dos miembros.
        dominio: >-
          Que sepas que en las cuatro extraordinarias no ha caído ninguna, y
          que si cae, escribas la definición de la matriz como una igualdad y
          la uses en la primera línea. Si una afirmación es falsa, la tumba una
          matriz concreta.
    falta:
      - >-
        Cuatro escalones arrancan en un ejercicio de examen porque su tema no
        tiene uno de práctica de esa demostración: las igualdades de la norma,
        las matrices especiales, la unicidad de las coordenadas y las
        definiciones. Hace de rampa el apartado de teoría, que escribe cada
        demostración entera; lo que falta es un ejercicio más corto que la
        entrene sola, como los del boletín que abren los otros cuatro.

  # ═══════════════════════════════════════════════════════════════════
  # FORMULARIO
  # ═══════════════════════════════════════════════════════════════════
  - id: formulario
    apunte:
      texto: 'lo que se usa sin demostrarlo'
      tono: marco
    titulo: Lo que hay que llevar en la cabeza
    pide: >-
      Nada, directamente. Pero los cuatro huecos se resuelven con hechos que se
      usan sin demostrarlos, y eso no se improvisa.
    porque: >-
      Las demostraciones y las definiciones tienen su bloque, el anterior,
      ordenadas por lo que más cae. Este es el de los **hechos**: el cero que
      descarta un subespacio, el rango que lo decide casi todo, las columnas
      que generan la imagen, el determinante que dice cuándo hay inversa y las
      dos multiplicidades. Va el último porque es repaso: cuando llegues aquí
      ya lo habrás usado todo.


      **Los siete «lo que hay que llevar sabido» están juntos y en una sola
      página**, hecha para imprimirse a dos columnas:
      [el formulario de Álgebra](/road-to-ingenieria/algebra/formulario/). No
      hay nada escrito ahí que no esté en su tema — se lee de la prosa de cada
      uno, así que corregir algo arriba lo corrige también allí.
    dominio: >-
      Que ante cada hueco sepas qué decide antes de calcular nada —¿está el
      cero?, ¿cuánto vale el rango?, ¿para qué valores se anula el
      determinante?, ¿coinciden las dos multiplicidades?— y que lo puedas decir
      sin abrir el formulario.
    material:
      - tipo: teoria
        tema: t01-espacios-vectoriales
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          Diez puntos. El primero —¿está el cero?— resuelve más ejercicios que
          los otros nueve juntos.
      - tipo: teoria
        tema: t02-aplicaciones-lineales
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          Y el punto 3 avisa de algo que no es culpa tuya: la matriz asociada no
          está en la hoja de teoría de este tema.
      - tipo: teoria
        tema: t04-determinantes
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          Once puntos, y el décimo —el orden se invierte en la inversa de un
          producto— hace falta para operar en el hueco 3, aunque **no** sea una
          de las demostraciones que caen aquí: $\left(AB\right)^{-1}
          =B^{-1}A^{-1}$ se ha pedido demostrar **una vez en ocho**
          convocatorias, la ordinaria de 2022-23, y en 2023-24 aparece como
          paso dentro de otra. En extraordinaria, ninguna.
      - tipo: teoria
        tema: t07-diagonalizacion
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          Doce puntos. El séptimo es el que más veces se ha preguntado sin
          preguntarlo: el polinomio característico **no** decide.
    falta:
      - >-
        **~~Sigue sin haber un sitio con las demostraciones escritas seguidas
        y en el orden en que caen~~ · resuelto el 28 de septiembre de 2026.**
        Es el bloque anterior, «Las demostraciones que caen»: ocho familias
        por lo que más cae en extraordinaria, cada una con su apartado de
        teoría y los ejercicios de examen que la piden, y en cada ejercicio un
        paso `redactar` con la rúbrica que marca los mínimos. La página de
        formulario sigue siendo de hechos, que es lo que se imprime; las
        demostraciones se escriben y se comparan, y eso se hace en el bloque.
