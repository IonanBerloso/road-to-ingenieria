asignatura: algebra
evaluacion: extraordinaria
titulo: Preparar la convocatoria extraordinaria
lede: >-
  La extraordinaria de Álgebra tiene la misma estructura que la ordinaria y
  **cambia un hueco**: donde la ordinaria pone espacios euclídeos, la
  extraordinaria pone determinantes, y siempre con la misma pregunta —«¿para
  qué valor existe la inversa?»—. Cuatro convocatorias extraordinarias leídas
  —de 2021-22 a 2024-25, una por curso—, y las cuatro lo hacen igual.
temas:
  - t01-espacios-vectoriales
  - t02-aplicaciones-lineales
  - t03-matrices
  - t04-determinantes
  - t05-sistemas-lineales
  - t07-diagonalizacion
medidoSobre: 8
criterioDeOrden: >-
  El mismo que en la ordinaria, y por el mismo motivo: los cuatro huecos del
  examen son fijos y salen siempre en el mismo orden, así que los bloques van
  detrás de ellos. Delante, el suelo —sistemas, rangos y operaciones con
  matrices—, que no ocupa ningún hueco y sin el cual no se termina ninguno de
  los cuatro. Detrás, el formulario. Lo único que cambia respecto de la
  ordinaria es el bloque del hueco 3, y ese cambio está medido: euclídeos en
  las cuatro ordinarias, determinantes en las cuatro extraordinarias.

bloques:
  # ═══════════════════════════════════════════════════════════════════
  # SUELO
  # ═══════════════════════════════════════════════════════════════════
  - id: suelo-sistemas-y-matrices
    apunte:
      texto: 'no da puntos — los sostiene todos'
      tono: marco
    titulo: Sistemas, rangos y operaciones con matrices
    pide: >-
      No lo pide con estas palabras. Lo pide con «hallar una base del núcleo»,
      «calcular las coordenadas en la base B'», «hallar los vectores propios»
      y, en la extraordinaria, también con «desarrolla esta ecuación para
      obtener A⁴».
    porque: >-
      **Ni matrices ni sistemas ocupan un hueco del examen**: cero de treinta y
      dos entre los dos. Y aun así se usan en los cuatro. En la extraordinaria
      pesan además por otro sitio: el hueco 3 es de determinantes, y ahí hacen
      falta las potencias, la traspuesta y el producto —cosas del tema 3— antes
      de tocar ninguna inversa.
    invariante:
      anios: 8
      fuente: >-
        Contado sobre los 32 ejercicios de las ocho convocatorias: ninguno tiene
        un enunciado de matrices o de sistemas como tal, y los cuatro huecos de
        las ocho usan al menos uno de los dos.
    dominio: >-
      Que sepas resolver un sistema con parámetro empezando por el determinante,
      y que ante un producto de matrices no des por hecho que se puede reordenar
      ni simplificar.
    escalones:
      - id: clasificar-y-resolver
        titulo: Clasificar antes de resolver
        aprendes: >-
          Decir si un sistema tiene solución, cuántas y de cuántos parámetros
          depende, comparando dos rangos y sin haber despejado nada.
        dominio: >-
          Que sepas de antemano cuántos parámetros va a tener la respuesta —es
          $n-r$— y que ante un homogéneo no escribas nunca «incompatible».
        teoria:
          tema: t05-sistemas-lineales
          apartado: rouché-fröbenius-la-clasificación-en-dos-comparaciones
          nota: >-
            Dos comparaciones y ya está clasificado. La primera decide si hay
            solución; la segunda, cuántas.
        ejercicios:
          - id: ejalg5-rouche-en-dos-comparaciones
            incrustado: true
            nota: >-
              El más corto, y enseña a mirar antes de escalonar: la tercera
              ecuación es la suma de las dos primeras.
          - id: ejalg5-bol51-dos-parametros-y-tres-casos
            nota: >-
              Del boletín, con **dos** parámetros, y el guion los separa: uno se
              decide sin tocar el otro.
      - id: el-producto-que-no-se-porta-bien
        titulo: Las tres cosas que el producto de matrices no cumple
        aprendes: >-
          Reconocer que el producto de matrices no conmuta, que tiene divisores
          de cero y que no se puede simplificar, y llevar un contraejemplo de
          cada una en la cabeza.
        dominio: >-
          Que ante «$\left(I+A+A^{2}+A^{3}\right)\left(I-A\right)=0$» no
          escribas nunca «luego uno de los dos factores es la matriz nula».
        teoria:
          tema: t03-matrices
          apartado: las-operaciones-y-las-tres-cosas-que-el-producto-no-cumple
          nota: >-
            La figura trae el par de matrices de la propia hoja de teoría
            oficial. Vale la pena memorizarlo: cabe en el margen del examen.
        ejercicios:
          - id: ejalg3-el-producto-no-conmuta
            incrustado: true
            nota: >-
              Los dos productos seguidos, y la conclusión sobre simplificar.
          - id: exalg2122-ext-3-una-ecuacion-que-da-la-inversa-sin-calcularla
            nota: >-
              De la extraordinaria de 2021-2022, y es exactamente el error que
              este escalón previene: de un producto nulo no se sigue nada.
      - id: potencias-sin-multiplicar
        titulo: Potencias, sin multiplicar cien veces
        aprendes: >-
          Bajar el grado de una potencia con una relación entre $A^{2}$, $A$ e
          $I$, sin diagonalizar y sin multiplicar la matriz por sí misma.
        dominio: >-
          Que ante «halla $m$ y $n$ para que $A^{2}+mA+nI=0$» leas la traza y el
          determinante en vez de calcular $A^{2}$.
        teoria:
          tema: t03-matrices
          apartado: potencias-y-el-atajo-de-cayley-hamilton
          nota: >-
            En orden $2$ los dos coeficientes se leen de la matriz. Es
            Cayley-Hamilton, y el boletín lo pide sin nombrarlo.
        ejercicios:
          - id: ejalg3-cayley-hamilton-baja-la-potencia
            incrustado: true
            nota: >-
              Los coeficientes sin calcular $A^{2}$, y luego $A^{3}$ reducido a
              $\alpha A+\beta I$.
          - id: ejalg3-bol31-simetrica-mas-antisimetrica
            nota: >-
              Del boletín, y es el otro uso de la traspuesta: toda cuadrada se
              parte en dos, de una sola manera.
    falta:
      - >-
        No hay ningún ejercicio guiado del método de Cramer. El temario lo
        incluye y el examen no lo ha pedido nunca en las ocho convocatorias.

  # ═══════════════════════════════════════════════════════════════════
  # HUECO 1
  # ═══════════════════════════════════════════════════════════════════
  - id: hueco-1-subespacios
    apunte:
      texto: 'las 8 convocatorias — 7 piden demostrar'
      tono: nota
    titulo: Hueco 1 · Demostrar que algo es subespacio, con base y dimensión
    pide: >-
      «Demostrar que uno de los siguientes subconjuntos es subespacio vectorial
      y que el otro no lo es», «hallar una base y la dimensión», «calcula las
      coordenadas del vector respecto de la base obtenida».
    porque: >-
      El ejercicio 1 es de espacios vectoriales en **las ocho convocatorias**.
      **Siete de ocho** piden demostrar que algo es subespacio, **siete de
      ocho** piden base o dimensión, **seis de ocho** piden coordenadas y
      **cinco de ocho** ponen el subespacio dentro de un espacio de **matrices**.
      Y hay algo propio de la extraordinaria: **las tres** que piden demostrar
      la unicidad de la expresión de una combinación lineal son
      extraordinarias.
    invariante:
      anios: 8
      fuente: >-
        Contado sobre los ocho enunciados del ejercicio 1. La demostración de
        la unicidad aparece en las extraordinarias de 2021-2022, 2022-2023 y
        2024-2025, y en ninguna ordinaria.
    dominio: >-
      Que ante cualquier conjunto decidas en diez segundos si el vector nulo
      está dentro, y que si lo está sepas escribirlo como $L(G)$ en una línea.
    escalones:
      - id: es-subespacio-o-no
        titulo: Decidirlo, y demostrarlo en una línea
        aprendes: >-
          Descartar un conjunto en diez segundos mirando si contiene al vector
          nulo, y demostrar que otro sí lo es escribiéndolo como una clausura
          lineal.
        dominio: >-
          Que ante un término independiente no nulo, un cuadrado o una
          desigualdad escribas «no» sin más cuentas; y que ante un conjunto por
          parámetros escribas $L(G)$ y lo des por demostrado.
        teoria:
          tema: t01-espacios-vectoriales
          apartado: subespacio-la-comprobación-que-cabe-en-tres-líneas
          nota: >-
            El criterio es «lineal e igualada a cero, o no lo es». Todo lo demás
            —un $7$, un cuadrado, un $\geq$— lo estropea.
        ejercicios:
          - id: ejalg1-lo-primero-es-mirar-el-cero
            incrustado: true
            nota: >-
              Tres conjuntos, y el tercero enseña el límite del atajo: contiene
              al cero y aun así no es subespacio.
          - id: ejalg1-bol6-cuales-son-subespacios-de-r3
            nota: >-
              Del boletín, ocho de golpe. Cinco lo son.
          - id: ejalg1-bol7-ocho-candidatos-a-subespacio-de-r4
            nota: >-
              Ocho conjuntos de $\mathbb{R}^{4}$ y dos filtros que deciden
              seis: ¿está el cero? ¿los parámetros recorren $\mathbb{R}$?
          - id: ejalg1-bol8-subespacios-de-funciones
            nota: >-
              Los vectores son funciones y el criterio es el mismo. Un
              cuadrado, una constante, y una condición lineal homogénea.
          - id: exalg2223-ext-1-un-subespacio-y-otro-que-no-lo-es
            nota: >-
              De la extraordinaria de 2022-2023, y con matrices de
              $2\times3$: dos conjuntos casi iguales y solo uno vale.
      - id: base-dimension-y-unicidad
        titulo: Base, dimensión, y por qué las coordenadas son únicas
        aprendes: >-
          Sacar base y dimensión de cualquier subespacio dado por parámetros, y
          demostrar que la expresión de un vector sobre una familia libre es
          única.
        dominio: >-
          Que puedas escribir de memoria la demostración de la unicidad —son
          cuatro líneas y todo el peso lo lleva la definición de libre— y que no
          la confundas con «luego es base».
        teoria:
          tema: t01-espacios-vectoriales
          apartado: base-dimensión-y-coordenadas
          nota: >-
            La demostración se hace restando, igual que la de «inyectiva si y
            solo si el núcleo es nulo» del tema 2. Es la misma idea dos veces.
        ejercicios:
          - id: ejalg1-del-elemento-generico-a-la-base
            incrustado: true
            nota: >-
              El molde de los tres pasos: elemento genérico, separar, contar.
          - id: exalg2425-ext-1-las-coordenadas-son-unicas-y-un-subespacio-de-matrices
            nota: >-
              De la extraordinaria de 2024-2025, y trae las dos cosas juntas: la
              unicidad y un subespacio de matrices.
          - id: ejalg1-bol13-una-base-de-polinomios-y-una-familia-libre
            nota: >-
              Los vectores son polinomios: igualar coeficientes es la
              demostración de que una familia es libre.
          - id: ejalg1-bol21-completar-tres-vectores-hasta-una-base-de-r5
            nota: >-
              Teorema de la base incompleta en la práctica: canónicos de uno
              en uno, comprobando que el rango sube.
          - id: exalg2324-ext-1-dos-combinaciones-y-las-matrices-de-traza-nula
            nota: >-
              De la extraordinaria de 2023-2024, con un parámetro en la
              dependencia lineal y las matrices de traza nula.
      - id: coordenadas-y-suma
        titulo: Coordenadas, suma e intersección
        aprendes: >-
          Cambiar de base en los dos sentidos, y calcular $S+T$ y $S\cap T$
          eligiendo la forma cómoda de cada uno.
        dominio: >-
          Que digas en voz alta si el apartado es «multiplicar» o «resolver»
          antes de escribir nada, y que compruebes Grassmann al final aunque no
          te lo pidan.
        teoria:
          tema: t01-espacios-vectoriales
          apartado: cambiar-de-base-y-en-qué-sentido-va-cada-cosa
          nota: >-
            La tabla de dos filas. De la base nueva a la vieja se multiplica; al
            revés, se resuelve.
        ejercicios:
          - id: ejalg1-las-coordenadas-y-el-sentido-del-cambio
            incrustado: true
            nota: >-
              Los dos sentidos seguidos, en $\mathbb{R}^{2}$.
          - id: ejalg1-bol12-suma-e-interseccion-en-r3
            nota: >-
              Del boletín: un plano y una recta que no está dentro.
          - id: ejalg1-bol19-la-base-nueva-a-partir-de-las-ecuaciones-del-cambio
            nota: >-
              Las ecuaciones dan $X = PY$: la base nueva son las columnas de
              $P$, pero en coordenadas de la vieja. Confundir coordenadas
              con vector es el error del ejercicio.
          - id: ejalg1-bol30-examen-dos-subespacios-de-r5
            nota: >-
              De examen: los dos por ecuaciones, la intersección es el
              sistema conjunto y la suma sale por Grassmann.
          - id: exalg2122-ext-1-un-subespacio-por-generadores-y-otro-por-ecuaciones
            nota: >-
              De la extraordinaria de 2021-2022, y es el caso cómodo servido:
              uno por generadores y otro por ecuaciones.
    falta:
      - >-
        No hay ningún ejercicio guiado sobre espacios de polinomios, y el
        boletín trae dos.

  # ═══════════════════════════════════════════════════════════════════
  # HUECO 2
  # ═══════════════════════════════════════════════════════════════════
  - id: hueco-2-aplicaciones
    apunte:
      texto: 'las 8 convocatorias — la matriz en otra base'
      tono: nota
    titulo: Hueco 2 · La matriz asociada, el núcleo y la imagen
    pide: >-
      «Hallar la matriz de f en las bases B y B'», «calcular una base de Ker f
      e Im f y clasificar la aplicación», «obtén la expresión de f en la base
      canónica».
    porque: >-
      El ejercicio 2 es de aplicaciones lineales en **las ocho convocatorias**,
      y pide la **matriz asociada** en las ocho, **bases y dimensiones de Ker e
      Im** en las ocho y **clasificar** en siete de ocho. Es el ejercicio más
      previsible del examen. Y en la extraordinaria hay una vuelta de tuerca:
      **dos de las cuatro** piden además la matriz en **otra base** que no es la
      canónica.
    invariante:
      anios: 8
      fuente: >-
        Contado sobre los ocho enunciados del ejercicio 2. La matriz en otra
        base la piden las extraordinarias de 2023-2024 y 2024-2025, y ninguna
        ordinaria.
    dominio: >-
      Que ante tres datos cruzados llegues a la matriz sin dudar del orden, y
      que la compruebes contra los datos del enunciado antes de seguir.
    escalones:
      - id: la-matriz-en-columnas
        titulo: La matriz, y por qué va en columnas
        aprendes: >-
          Escribir la matriz asociada y comprobarla contra los datos del
          enunciado, sin confundirla con su traspuesta.
        dominio: >-
          Que después de escribirla multipliques por los vectores del enunciado
          y compruebes que salen sus imágenes.
        teoria:
          tema: t02-aplicaciones-lineales
          apartado: la-matriz-asociada-y-por-qué-las-imágenes-van-en-columnas
          nota: >-
            La hoja de teoría de este tema **no** define la matriz asociada:
            está en la de Matrices, apartado 3.2.
        ejercicios:
          - id: ejalg2-es-lineal-o-no-lo-es
            nota: >-
              Va el primero porque va antes en el examen: si la aplicación no es
              lineal, no hay ninguna matriz que escribir.
          - id: ejalg2-la-matriz-sale-de-las-columnas
            incrustado: true
            nota: >-
              El molde, con una aplicación de $\mathbb{R}^{2}$ en
              $\mathbb{R}^{3}$.
          - id: ejalg2-bol1-cuales-son-lineales
            nota: >-
              Del boletín, con los mismos tres casos y otros números.
          - id: ejalg2-bol10-de-una-base-a-otra-con-ecuaciones
            nota: >-
              Bases abstractas y matriz $4\times3$: las ecuaciones $y_i$ salen
              leyendo columnas, y una relación entre ellas da el núcleo.
          - id: exalg2223-ext-2-cuatro-imagenes-y-una-matriz-que-no-es-cuadrada
            nota: >-
              De la extraordinaria de 2022-2023, con una matriz $3\times4$: el
              orden ya avisa de que no puede ser inyectiva.
      - id: datos-cruzados-y-otra-base
        titulo: Datos torcidos, y la matriz en otra base
        aprendes: >-
          Despejar las imágenes de la base canónica a partir de datos mezclados,
          y reescribir la matriz en una base distinta.
        dominio: >-
          Que ante un núcleo dado por ecuaciones escribas
          $f\left(\overline{v}\right)=\overline{0}$ y lo uses como un dato más;
          y que sepas que la matriz en otra base se obtiene con el cambio de
          base por los dos lados.
        teoria:
          tema: t02-aplicaciones-lineales
          apartado: cuando-los-datos-vienen-cruzados
          nota: >-
            El primer paso —comprobar que los vectores de partida son base— es
            el que se salta, y es el que decide si los datos determinan $f$.
        ejercicios:
          - id: ejalg2-bol9-tres-datos-encadenados
            incrustado: true
            nota: >-
              Del boletín, con las restas servidas: cada dato sale del anterior.
          - id: exalg2324-ext-2-tres-datos-torcidos-y-una-aplicacion
            nota: >-
              De la extraordinaria de 2023-2024, y pide la matriz en una base
              $B'$ que da el enunciado.
          - id: ejalg2-bol11-un-automorfismo-de-r4-y-otra-base
            nota: >-
              Cinco apartados sobre un automorfismo, y el último es la
              matriz en otra base: imágenes de $B$, escritas en $B$.
          - id: ejalg2-bol23-examen-el-nucleo-es-subespacio-y-una-matriz-en-bases-nuevas
            nota: >-
              De examen: cambiar la base de llegada obliga a resolver un
              sistema por columna. Sin atajo, y con comprobación.
          - id: exalg2425-ext-2-una-aplicacion-dada-por-tres-datos
            nota: >-
              De la extraordinaria de 2024-2025, con la misma vuelta de tuerca:
              la matriz asociada en otra base.
      - id: nucleo-imagen-y-clasificar
        titulo: Núcleo, imagen y la fórmula que decide antes de calcular
        aprendes: >-
          Dar bases y dimensiones del núcleo y la imagen leyendo las columnas, y
          clasificar la aplicación con la fórmula de las dimensiones.
        dominio: >-
          Que ante $f:\mathbb{R}^{4}\to\mathbb{R}^{3}$ digas «no puede ser
          inyectiva» antes de leer los datos, y que en un endomorfismo sepas que
          las dos propiedades van juntas.
        teoria:
          tema: t02-aplicaciones-lineales
          apartado: la-fórmula-de-las-dimensiones-y-lo-que-decide-antes-de-calcular
          nota: >-
            La tercera fila de la tabla es la que más se falla, y solo vale en
            un endomorfismo.
        ejercicios:
          - id: ejalg2-lo-que-la-formula-decide-antes-de-calcular
            incrustado: true
            nota: >-
              El contraejemplo de esa frase: sobreyectiva y no inyectiva a la
              vez, porque **no** es un endomorfismo.
          - id: ejalg2-bol7-nucleo-e-imagen-de-una-formula
            nota: >-
              Del boletín, con una variable que no aparece en la fórmula.
          - id: ejalg2-bol5-inyectiva-pero-no-suprayectiva
            nota: >-
              De $\mathbb{R}^{2}$ a $\mathbb{R}^{3}$ nunca es suprayectiva; lo
              único que hay que comprobar es el rango.
          - id: ejalg2-bol17-examen-rango-y-una-aplicacion-sobre-matrices
            nota: >-
              De examen: rango e inyectividad, el argumento de paridad de
              «$\operatorname{Ker}f \ne \operatorname{Im}f$», y una $f$ sobre
              matrices $2\times2$.
          - id: exalg2122-ext-2-tres-imagenes-en-una-base-torcida
            nota: >-
              De la extraordinaria de 2021-2022: tres datos sobre una base que
              no es la canónica, y un determinante nulo al final.
    falta:
      - >-
        No hay ningún ejercicio guiado de «la matriz asociada en otra base»,
        que es justo lo que piden **dos de las cuatro** extraordinarias. Solo
        están los dos enunciados de examen. Es el hueco más claro de esta ruta.

  # ═══════════════════════════════════════════════════════════════════
  # HUECO 3 · el que distingue la extraordinaria
  # ═══════════════════════════════════════════════════════════════════
  - id: hueco-3-inversa
    apunte:
      texto: 'lo que distingue la extraordinaria — 4 de 8'
      tono: neutro
    titulo: Hueco 3 · La inversa, y para qué valores existe
    pide: >-
      «¿Para qué valor de a existe la inversa? Si es posible, calcula la
      inversa de A cuando a = 0», «calcular el valor de x para que exista
      A⁻¹», «para el caso x = −2, calcular A⁻¹».
    porque: >-
      **Este es el bloque que distingue la extraordinaria de la ordinaria.** El
      hueco 3 es de determinantes en **las cuatro convocatorias
      extraordinarias** y de espacios euclídeos en **las cuatro ordinarias**: no
      rota, está partido por convocatoria. Y dentro de las cuatro
      extraordinarias, **las cuatro** piden una **inversa** y **las cuatro** la
      condicionan a un parámetro.
    invariante:
      anios: 4
      fuente: >-
        Contado sobre las cuatro convocatorias extraordinarias transcritas
        —2021-2022, 2022-2023, 2023-2024 y 2024-2025—: en las cuatro el
        ejercicio 3 pide una matriz inversa y en las cuatro con una condición
        sobre un parámetro. En las cuatro ordinarias, ninguna.
    dominio: >-
      Que ante una matriz con parámetro calcules el determinante primero, digas
      «existe para todos menos estos» aunque la pregunta esté en singular, y
      elijas Gauss-Jordan si el orden es 4.
    escalones:
      - id: las-propiedades-del-determinante
        titulo: Las propiedades, que son el ejercicio
        aprendes: >-
          Calcular determinantes de productos, traspuestas, potencias, inversas
          y múltiplos sin desarrollar ninguno.
        dominio: >-
          Que ante $\left|2B\right|$ con $B$ de orden $3$ escribas
          $8\left|B\right|$ y no $2\left|B\right|$, y que sepas que el
          determinante **no** es aditivo.
        teoria:
          tema: t04-determinantes
          apartado: las-propiedades-que-son-el-ejercicio
          nota: >-
            La tabla de ocho propiedades. La del escalar es la que cae y la que
            más se falla: el factor sale de **cada fila**.
        ejercicios:
          - id: ejalg4-las-propiedades-antes-que-la-cuenta
            incrustado: true
            nota: >-
              Cinco determinantes sin desarrollar ninguno.
          - id: ejalg4-bol412-cinco-por-cinco-con-x-en-la-diagonal
            nota: >-
              Una $5\times5$ que se factoriza en cinco factores lineales, y
              el enunciado pide nombrar la propiedad de cada paso.
          - id: ejalg4-bol420-examen-la-adjunta-y-una-ecuacion-de-grado-seis
            nota: >-
              De examen: la identidad $A(A^{*})^{T} = |A|\,I$ demostrada, y un
              determinante que es $(\lambda-1)^{6}$.
          - id: exalg2223-ord-3-determinantes-de-memoria-y-una-base-ortonormal
            nota: >-
              De la ordinaria de 2022-2023 —el único año en que estas
              propiedades caen fuera de una extraordinaria—, y pide exactamente
              los cinco.
      - id: calcular-el-determinante
        titulo: Calcularlo eligiendo bien por dónde
        aprendes: >-
          Elegir entre Sarrus, adjuntos y Gauss según la matriz, y fabricar
          ceros antes de desarrollar cuando no los hay.
        dominio: >-
          Que antes de empezar mires dónde hay ceros; que sepas que Sarrus solo
          existe en orden $3$; y que si divides una fila en Gauss recuerdes
          multiplicar el resultado por ese factor.
        teoria:
          tema: t04-determinantes
          apartado: calcularlo-tres-caminos-y-cuándo-usar-cada-uno
          nota: >-
            Elegir bien la fila es la mitad del trabajo: una fila con tres ceros
            convierte un orden $4$ en un orden $3$.
        ejercicios:
          - id: ejalg4-una-fila-con-ceros-vale-mas-que-sarrus
            incrustado: true
            nota: >-
              Un orden $4$ resuelto con **un** determinante de orden $3$.
          - id: ejalg4-bol42-cinco-por-cinco-restando-la-primera
            nota: >-
              El patrón «todas las filas casi iguales»: restar la primera a
              las demás y queda triangular.
          - id: ejalg4-bol415bis-examen-inversa-y-circulante
            nota: >-
              De examen: cuándo existe la inversa, $A^{2}-A-I = 0$, y un
              determinante circulante que vale $1875$.
          - id: ejalg4-bol46-un-determinante-por-gauss
            nota: >-
              Del boletín, y la mitad del enunciado es comprobarlo por otro
              camino. En un examen sin calculadora eso no es un lujo.
      - id: la-inversa-con-parametro
        titulo: La inversa, y los valores que la estropean
        aprendes: >-
          Decidir para qué valores del parámetro existe la inversa, y calcularla
          para uno concreto por el camino que corresponda al orden.
        dominio: >-
          Que la respuesta a «¿para qué valor existe?» sea «para todos menos
          estos dos», y que en orden $4$ no intentes la adjunta: son dieciséis
          determinantes de orden $3$.
        teoria:
          tema: t04-determinantes
          apartado: la-matriz-inversa
          nota: >-
            Los dos caminos y cuándo compensa cada uno. La figura enseña por qué
            Gauss-Jordan funciona.
        ejercicios:
          - id: ejalg4-bol414-una-inversa-de-orden-4
            incrustado: true
            nota: >-
              Del boletín, orden $4$ y determinante $1$: la inversa sale con
              todo enteros.
          - id: exalg2223-ext-3-cuando-existe-la-inversa-y-cuanto-vale
            nota: >-
              De la extraordinaria de 2022-2023: una matriz $4\times4$ con
              parámetro, y el determinante sale $x^{2}-1$.
          - id: exalg2122-ext-3-una-ecuacion-que-da-la-inversa-sin-calcularla
            nota: >-
              De la extraordinaria de 2021-2022, y trae las dos formas: una
              inversa **regalada** por una ecuación, y otra con parámetro.
          - id: exalg2324-ext-3-la-identidad-de-polarizacion-y-una-inversa
            nota: >-
              De la extraordinaria de 2023-2024, con la identidad de
              polarización en el apartado a) y la inversa en el b).
          - id: ejalg4-bol418-examen-dos-falsedades-y-una-inversa-con-alfa
            nota: >-
              De examen: dos contraejemplos a «$A^{2} = I$», el rango según
              $\alpha$ y la inversa entera para $\alpha = 0$.
          - id: ejalg4-bol419-examen-la-inversa-con-k-en-la-diagonal
            nota: >-
              De examen: $\det = k^{2}(k-3)$ dividiendo entre $k$, con el caso
              $k = 0$ aparte, y la inversa para $k = 1$.
          - id: exalg2425-ext-3-minkowsky-y-la-matriz-con-parametro
            nota: >-
              De la extraordinaria de 2024-2025, con Minkowsky delante y la
              misma inversa con parámetro detrás.
      - id: el-rango-con-parametro
        titulo: El rango, cuando el determinante se anula
        aprendes: >-
          Discutir el rango de una matriz con parámetro sin abrir un caso por
          cada valor.
        dominio: >-
          Que cuando el determinante de orden $3$ se anule no contestes «rango
          2» por inercia: hay que mirar la matriz en ese valor.
        teoria:
          tema: t04-determinantes
          apartado: el-rango
          nota: >-
            El procedimiento de tres pasos, y el aviso de que los valores que
            anulan el determinante son los únicos que hay que estudiar aparte.
        ejercicios:
          - id: ejalg4-el-rango-con-un-parametro-dentro
            incrustado: true
            nota: >-
              Un solo valor lo estropea, y ahí el rango baja a $1$ y no a $2$.
          - id: ejalg4-bol417-examen-rango-de-a-mas-uno-en-la-diagonal
            nota: >-
              De examen: el rango de $aI+J$ según $a$, con los dos valores
              que lo bajan y cuánto lo bajan.
          - id: ejalg5-bol54-el-nucleo-es-un-sistema-homogeneo
            nota: >-
              Del boletín de sistemas, y es el mismo cálculo con otro nombre: la
              dimensión del núcleo según el parámetro.
    falta:
      - >-
        El apartado a) de estas extraordinarias suele ser una demostración de
        **espacios euclídeos** —Pitágoras, polarización, Minkowsky— aunque el
        cálculo sea de determinantes. Esa parte está cubierta por el tema 6, que
        esta ruta no incluye entre sus temas porque su hueco es de la ordinaria.
        Si te examinas de la extraordinaria, esas tres demostraciones hay que
        estudiarlas igual.

  # ═══════════════════════════════════════════════════════════════════
  # HUECO 4
  # ═══════════════════════════════════════════════════════════════════
  - id: hueco-4-diagonalizar
    apunte:
      texto: 'las 8 — con teoría de autovalores'
      tono: nota
    titulo: Hueco 4 · Diagonalizar, y decidir cuándo se puede
    pide: >-
      «Demostrar que los autovectores asociados a autovalores diferentes son
      linealmente independientes», «calcula los valores del parámetro a para
      que la matriz A sea diagonalizable», «en caso de ser diagonalizable,
      diagonalizar A dando la matriz de cambio de base».
    porque: >-
      El ejercicio 4 es de diagonalización en **las ocho convocatorias**, y en
      las ocho pide una demostración de teoría además del cálculo. **Seis de
      las ocho** meten un parámetro, y **las cuatro extraordinarias** están
      entre esas seis: en la extraordinaria el parámetro es la norma, no la
      excepción.
    invariante:
      anios: 8
      fuente: >-
        Contado sobre los ocho enunciados del ejercicio 4. Las dos que no llevan
        parámetro son las ordinarias de 2023-2024 y 2024-2025; las cuatro
        extraordinarias lo llevan todas.
    dominio: >-
      Que ante una matriz con parámetro factorices el polinomio primero y solo
      calcules rangos donde dos autovalores coinciden.
    escalones:
      - id: autovalores-con-atajos
        titulo: Los autovalores, sin desarrollar el determinante
        aprendes: >-
          Sacar autovalores con la traza, el determinante y los tres atajos,
          antes de desarrollar nada.
        dominio: >-
          Que ante una matriz cuyas filas suman lo mismo escribas ese número
          como autovalor y $\left(1,\dots,1\right)$ como su autovector.
        teoria:
          tema: t07-diagonalizacion
          apartado: leerlo-sin-desarrollarlo
          nota: >-
            Y las dos comprobaciones gratis: los autovalores suman la traza y
            multiplican el determinante.
        ejercicios:
          - id: ejalg7-autovalor-y-autovector-de-una-2x2
            incrustado: true
            nota: >-
              El más pequeño posible, y ya usa el atajo de las filas.
          - id: ejalg7-bol72-traza-y-determinante-contra-autovalores
            nota: >-
              Del boletín: la traza y el determinante como comprobación
              gratis de los autovalores, antes de creerse el polinomio.
          - id: ejalg7-bol718-simetrica-por-bloques
            nota: >-
              Una coordenada que va sola y un bloque $2\times2$ de filas de
              igual suma: los tres autovalores sin un solo determinante.
          - id: exalg2223-ext-4-los-parametros-que-el-autovector-obliga
            nota: >-
              De la extraordinaria de 2022-2023, y la idea es al revés: el
              autovector **dado** es un sistema de tres ecuaciones.
      - id: las-dos-multiplicidades
        titulo: Las dos multiplicidades, que es lo que se examina
        aprendes: >-
          Decidir si una matriz diagonaliza comparando, para cada autovalor
          repetido, la multiplicidad algebraica con el rango de
          $A-\lambda I$.
        dominio: >-
          Que solo calcules rangos en los autovalores repetidos, y que si sale
          «no diagonaliza» escribas cuántas direcciones hay y cuántas faltan.
        teoria:
          tema: t07-diagonalizacion
          apartado: las-dos-multiplicidades-que-es-todo-el-tema
          nota: >-
            La figura lo resume: dos columnas que parten del mismo polinomio y
            acaban en respuestas opuestas.
        ejercicios:
          - id: ejalg7-las-dos-multiplicidades
            incrustado: true
            nota: >-
              El caso mínimo, en dos por dos. Vale la pena memorizarlo.
          - id: ejalg7-bol76-la-que-no-diagonaliza
            nota: >-
              Del boletín, con dos filas proporcionales que regalan el autovalor
              cero.
          - id: ejalg7-bol79-autovalor-doble-que-si-diagonaliza
            nota: >-
              La pareja buena: autovalor doble con rango 1, y diagonaliza.
          - id: ejalg7-bol720-examen-teoria-y-la-que-no-diagonaliza
            nota: >-
              De examen: la demostración de que autovectores de autovalores
              distintos son libres, y la matriz que no diagonaliza.
          - id: exalg2324-ext-4-esta-si-se-diagonaliza
            nota: >-
              De la extraordinaria de 2023-2024, y la que sí se diagonaliza — y
              no por ser simétrica, que es lo que uno esperaría.
      - id: el-parametro-en-la-diagonalizacion
        titulo: El parámetro, y los dos valores que lo estropean
        aprendes: >-
          Encontrar los valores del parámetro para los que una matriz deja de
          diagonalizar, sin abrir un caso por cada número.
        dominio: >-
          Que factorices el polinomio en función del parámetro, busques dónde
          coinciden dos autovalores —dos ecuaciones de primer grado— y solo ahí
          calcules rangos.
        teoria:
          tema: t07-diagonalizacion
          apartado: con-parámetro
          nota: >-
            Tres pasos, y el orden es lo que hace corto el ejercicio. Ir al
            revés lo alarga sin necesidad.
        ejercicios:
          - id: ejalg7-las-dos-multiplicidades
            nota: >-
              Las dos multiplicidades, que son lo que el parámetro pone en juego.
          - id: ejalg7-bol77-simetrica-con-paso-ortogonal
            nota: >-
              Del boletín, y trae el paso que se salta: dentro del autovalor
              doble hay que ortogonalizar.
          - id: exalg2122-ext-4-el-parametro-que-decide-si-diagonaliza
            incrustado: true
            nota: >-
              De la extraordinaria de 2021-2022, y es el molde: los autovalores
              salen $1$, $a+8$ y $a-8$, y solo dos valores los hacen coincidir.
          - id: ejalg7-bol710-triangular-con-tres-parametros
            nota: >-
              Tres parámetros en una triangular, y solo dos deciden: el
              rango de $A-I$ y de $A-cI$.
          - id: ejalg7-bol717-un-parametro-que-decide
            nota: >-
              El parámetro desaparece del polinomio característico y aun
              así manda, a través del rango de $A-I$.
          - id: exalg2425-ext-4-diagonalizar-con-una-base-ortonormal
            nota: >-
              De la extraordinaria de 2024-2025, que además pide la matriz de
              paso ortogonal.
      - id: para-que-sirve
        titulo: 'Y para qué sirve: potencias'
        aprendes: >-
          Usar $A^{n}=PD^{n}P^{-1}$ para calcular una potencia grande sin
          multiplicar la matriz por sí misma.
        dominio: >-
          Que sepas decir en una frase por qué se diagonaliza: para cambiar a la
          base donde la matriz no hace nada complicado.
        teoria:
          tema: t07-diagonalizacion
          apartado: para-qué-sirve-potencias
        ejercicios:
          - id: ejalg7-bol721-examen-la-potencia-veinte
            nota: >-
              De examen: $A^{20}$ con $D^{20} = I$. Y la trampa de creer que
              $P$ y $P^{-1}$ se cancelan con la $D$ en medio.
          - id: ejalg7-bol722-examen-una-permutacion-simetrica
            nota: >-
              De examen: $A^{6}$ y $A^{-1}$ con $P$ ortogonal, sin invertir
              nada.
          - id: ejalg7-para-que-sirve-diagonalizar
            incrustado: true
            nota: >-
              La potencia cuarta con la fórmula, y la general de propina.
    falta:
      - >-
        El boletín trae una matriz $4\times4$ con parámetro para diagonalizar y
        no hay ningún ejercicio guiado de orden $4$.

  # ═══════════════════════════════════════════════════════════════════
  # FORMULARIO
  # ═══════════════════════════════════════════════════════════════════
  - id: formulario
    apunte:
      texto: 'el apartado a) es teoría pura'
      tono: marco
    titulo: Lo que hay que llevar en la cabeza
    pide: >-
      Nada, directamente. Pero las cuatro extraordinarias empiezan cada
      ejercicio con una definición o una demostración, y eso no se improvisa.
    porque: >-
      En **las ocho convocatorias** los cuatro ejercicios llevan un apartado (a)
      de teoría pura. Y en la extraordinaria hay tres demostraciones que
      aparecen con nombre propio y conviene tener escritas: la unicidad de la
      expresión de una combinación lineal —**tres de las cuatro**
      extraordinarias—, la inversa de un producto y el polinomio característico
      que no varía. Va el último porque es repaso.
    dominio: >-
      Que puedas escribir de memoria las demostraciones que más se repiten: que
      $\operatorname{Ker}f$ es subespacio, que las coordenadas son únicas, que
      $\left(AB\right)^{-1}=B^{-1}A^{-1}$, y que el polinomio característico no
      varía al cambiar de base.
    material:
      - tipo: teoria
        tema: t01-espacios-vectoriales
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          Diez puntos. El primero —¿está el cero?— resuelve más ejercicios que
          los otros nueve juntos.
      - tipo: teoria
        tema: t02-aplicaciones-lineales
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          Y el punto 3 avisa de algo que no es culpa tuya: la matriz asociada no
          está en la hoja de teoría de este tema.
      - tipo: teoria
        tema: t04-determinantes
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          Once puntos, y el décimo es el que decide el hueco 3 de la
          extraordinaria: el orden se invierte en la inversa de un producto.
      - tipo: teoria
        tema: t07-diagonalizacion
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          Doce puntos. El séptimo es el que más veces se ha preguntado sin
          preguntarlo: el polinomio característico **no** decide.
    falta:
      - >-
        No hay una página de formulario propia con las demostraciones que se
        repiten juntas y en el orden en que caen. De momento esto es una lista
        de enlaces a cuatro resúmenes, que es exactamente lo que un bloque no
        debe ser.
