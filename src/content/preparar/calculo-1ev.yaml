asignatura: calculo
evaluacion: primera
titulo: Preparar la primera evaluación
lede: >-
  Los temas 1 y 2, el 10 % de la nota. Esto no es el temario en orden: es un
  camino de principio a fin, desde lo que hay que saber hacer sin pensar hasta
  los cuatro huecos que el examen lleva once años repitiendo. Y el orden
  importa, porque la mayor parte de los puntos no se gana calculando.
temas:
  - t01-complejos
  - t02-sucesiones
medidoSobre: 11
criterioDeOrden: >-
  Primero el suelo, que no se examina solo pero sin el cual no sale nada.
  Después los cuatro huecos del examen ordenados por lo que rinden: lo que cae
  todos los años, y dentro de eso lo que más puntos vale. El bloque de la
  demostración va antes que el de series aunque sea de más adelante en el
  temario, porque son diez puntos que se repiten casi literalmente año tras
  año. Al final los exámenes enteros y el formulario, que son repaso, no
  aprendizaje.

bloques:
  # ─────────────────────────────────────────────────────────────────────
  - id: suelo
    titulo: El suelo, que no se examina solo
    pide: >-
      Nada por sí mismo. Es lo que los cuatro ejercicios del examen dan por
      sabido antes de empezar: pasar de una forma a otra, dividir, girar.
    porque: >-
      En once años no ha caído ni un solo ejercicio que sea «pasa esto a
      polar». Y no hay prácticamente ninguno de los 22 ejercicios de tema 1 que
      se resuelva sin hacerlo, o sin racionalizar un cociente por el conjugado.
      Es el bloque que no da puntos por sí mismo y sin el cual los otros dos de
      complejos no se terminan a tiempo. Por eso va primero y por eso es corto.
    dominio: >-
      Dividir dos complejos cualesquiera y pasar el resultado a polar en menos
      de un minuto, sin mirar apuntes y acertando el cuadrante del argumento a
      la primera. Si dudas del cuadrante, no has terminado este bloque.
    material:
      - tipo: teoria
        tema: t01-complejos
        apartado: las-dos-formas-y-por-qué-hacen-falta-las-dos
        nota: >-
          Por qué hay dos notaciones y cuándo conviene cada una. Sumar en
          binómica, multiplicar en polar.
      - tipo: teoria
        tema: t01-complejos
        apartado: el-argumento-y-la-trampa-de-arctan
        nota: >-
          El error más caro del tema, y el más fácil de evitar: mirar el
          cuadrante antes de tocar la calculadora.
      - tipo: teoria
        tema: t01-complejos
        apartado: el-conjugado-que-hace-casi-todo-el-trabajo
        nota: >-
          La herramienta transversal. Aparece en cada cociente que se
          racionaliza y en las ecuaciones que parecen de grado cinco.

      - tipo: ejercicio
        id: cociente-exponencial
        incrustado: true
        nota: >-
          El más corto de todos, y el que junta las tres cosas: racionalizar,
          pasar a polar y volver.
      - tipo: ejercicio
        id: potencia-novena
        nota: >-
          Los cuatro siguientes son De Moivre. No caen solos en el examen, pero
          las raíces del bloque 2 no salen si esto no está automatizado.
      - tipo: ejercicio
        id: potencia-doceava
      - tipo: ejercicio
        id: suma-conjugados
      - tipo: ejercicio
        id: raiz-cubica-cociente
      - tipo: ejercicio
        id: potencia-real-negativa
      - tipo: ejercicio
        id: parametro-real-cociente
        nota: >-
          Estos dos son de separar parte real e imaginaria y poner una
          condición. Es el paso previo de la mitad de los lugares geométricos.
      - tipo: ejercicio
        id: dos-complejos-cociente-real

  # ─────────────────────────────────────────────────────────────────────
  - id: regiones
    titulo: Regiones del plano complejo
    pide: >-
      Calcular y representar gráficamente los afijos de los números complejos
      que verifican una o dos condiciones.
    porque: >-
      Es el único ejercicio que ha caído los once años sin faltar uno, y en
      nueve de ellos fue el número 1. Vale 7 puntos de cálculo de los 10: es el
      ejercicio con más COMP2 de todo el examen. Empieza por aquí porque es el
      más seguro y el que más rápido se automatiza.
    invariante:
      anios: 11
      fuente: >-
        Contado sobre los once exámenes de primera evaluación publicados aquí,
        de 2015-2016 a 2025-2026.
    dominio: >-
      Leer un enunciado con dos condiciones y saber, antes de escribir nada,
      qué figura sale de cada una. Y que el dibujo salga con el borde correcto,
      el punto excluido marcado y una comprobación con un punto interior.
    material:
      - tipo: teoria
        tema: t01-complejos
        apartado: lugares-geométricos-traducir-la-condición-a-una-distancia
        nota: >-
          La idea que resuelve casi todos: traducir cada condición a una
          distancia o a un ángulo. Las tres figuras de dentro son Apolonio, el
          arco capaz y la elipse, que son las que el examen repite.

      - tipo: ejercicio
        id: lugar-cociente-modulos
        incrustado: true
        nota: >-
          El más básico de los seis, y el que enseña el patrón: un cociente de
          módulos constante es una circunferencia de Apolonio.
      - tipo: ejercicio
        id: lugar-dos-condiciones-modulo
      - tipo: ejercicio
        id: lugar-mediatriz-parabola
      - tipo: ejercicio
        id: lugar-argumento-cociente
        nota: >-
          Aquí aparece el arco capaz, que es la segunda herramienta más
          frecuente del bloque.
      - tipo: ejercicio
        id: lugar-inverso-desplazado
      - tipo: ejercicio
        id: lugar-elipse-sector

      - tipo: ejercicio
        id: ex2526-1-semiplano-con-mordisco
        nota: >-
          A partir de aquí, uno por año y del más reciente hacia atrás. Se
          tiene el bloque cuando salen tres seguidos sin abrir la pista.
      - tipo: ejercicio
        id: ex2425-1-parabola-y-circunferencia
      - tipo: ejercicio
        id: ex2324-1-semirrecta-vertical
      - tipo: ejercicio
        id: ex2223-1-recta-y-conjunto-vacio
      - tipo: ejercicio
        id: ex2122-1-apolonio-de-area-dada
      - tipo: ejercicio
        id: ex2021-1-arco-capaz
      - tipo: ejercicio
        id: ex1920-1-apolonio-con-raiz-cubica
      - tipo: ejercicio
        id: ex1819-1-lente-de-dos-discos
      - tipo: ejercicio
        id: ex1718-1-semicircunferencia
      - tipo: ejercicio
        id: ex1617-2-elipse-por-definicion
      - tipo: ejercicio
        id: ex1516-2-media-elipse

  # ─────────────────────────────────────────────────────────────────────
  - id: segundo-de-complejos
    titulo: El segundo ejercicio de complejos
    pide: >-
      Resolver una ecuación en el plano complejo, encontrar un vértice que
      falta o demostrar una identidad trigonométrica para argumentos complejos.
    porque: >-
      Los once exámenes llevan exactamente dos ejercicios de tema 1, así que
      este hueco también cae siempre. Lo que cambia es qué se pide dentro: es
      el más variable de los cuatro. Se ataca por frecuencia reciente, no por
      orden del boletín.
    invariante:
      anios: 11
      fuente: >-
        Los once exámenes tienen dos ejercicios de tema 1 y el resto de tema 2,
        sin excepción.
    dominio: >-
      Ante una ecuación en el plano complejo, saber en qué caso estás —raíces
      n-ésimas, cambio de variable, o ecuación con conjugado y módulo— en los
      primeros treinta segundos, y no perder nunca la solución z = 0 ni
      quedarte con menos raíces de las que hay.
    material:
      - tipo: teoria
        tema: t01-complejos
        apartado: raíces-n-ésimas-cuántas-hay-y-por-qué-están-repartidas
        nota: >-
          La variante que más ha caído en los dos últimos años. Las raíces
          reparten el ángulo a partes iguales: si no salen n, falta alguna.
      - tipo: teoria
        tema: t01-complejos
        apartado: multiplicar-es-girar-y-escalar
        nota: >-
          Para la variante de giros y polígonos: el tercer vértice se obtiene
          multiplicando por una exponencial de argumento 60 o 90 grados.
      - tipo: teoria
        tema: t01-complejos
        apartado: cuando-la-variable-sube-al-exponente
        nota: >-
          Para la variante de funciones complejas. Lo que hay que tener claro
          es que el logaritmo da infinitos valores y que el seno no está
          acotado, que es de donde salen los dos enunciados que caen.

      - tipo: ejercicio
        id: ecuacion-bicubica
        incrustado: true
        nota: >-
          Una de grado seis que en realidad es de segundo. El cambio de
          variable es lo que hay que ver.
      - tipo: ejercicio
        id: ecuacion-cuarta-menos-dieciseis
      - tipo: ejercicio
        id: ecuacion-cubo-menos-modulo
      - tipo: ejercicio
        id: ecuacion-cuarta-conjugado
      - tipo: ejercicio
        id: triangulo-rectangulo-isosceles
      - tipo: ejercicio
        id: rombo-diagonales

      - tipo: ejercicio
        id: identidad-seno-suma
        nota: >-
          Los cinco siguientes son de funciones complejas. Se demuestran todos
          igual: sustituyendo la definición exponencial del seno y del coseno y
          operando. No se invoca la identidad real.
      - tipo: ejercicio
        id: identidad-seno-cuadrado
      - tipo: ejercicio
        id: coseno-igual-a-cinco
      - tipo: ejercicio
        id: coseno-complejo-igualdad
      - tipo: ejercicio
        id: logaritmo-complejo
      - tipo: ejercicio
        id: ecuacion-exponencial

      - tipo: ejercicio
        id: ex2526-2-raiz-cuarta-de-la-figura
        nota: >-
          Los tres primeros son la variante de raíces y ecuaciones, que es el
          formato de los dos últimos años.
      - tipo: ejercicio
        id: ex2425-2-cubica-desplazada
      - tipo: ejercicio
        id: ex1819-2-bicubica
      - tipo: ejercicio
        id: ex2324-2-triangulo-girado
      - tipo: ejercicio
        id: ex1617-1-triangulo-isosceles
      - tipo: ejercicio
        id: ex2122-2-quinta-con-conjugado
      - tipo: ejercicio
        id: ex2223-2-identidad-coseno-cuadrado
        nota: >-
          Las identidades trigonométricas complejas caen poco, pero cuando caen
          valen los diez puntos en explicación formal.
      - tipo: ejercicio
        id: ex1920-2-seno-de-una-suma
      - tipo: ejercicio
        id: ex1516-1-parametro-real
      - tipo: ejercicio
        id: ex2021-2-exponencial-en-el-eje-real
        nota: >-
          Estos dos son la variante de exponencial y logaritmo, que no cae
          desde 2020-2021. Se hacen igualmente: la ecuación no tiene una
          solución, tiene una fila infinita de ellas.
      - tipo: ejercicio
        id: ex1718-2-exponencial-recta-vertical

  # ─────────────────────────────────────────────────────────────────────
  - id: demostracion-de-sucesiones
    titulo: La demostración de sucesiones
    pide: >-
      Razonar si una afirmación sobre el límite de una sucesión es verdadera o
      falsa, y demostrarlo con la definición.
    porque: >-
      El bloque más rentable del examen. Los once años tienen un ejercicio de
      tema 2 que se juega entero en explicación formal, con 7 puntos o más; en
      nueve de ellos no hay que hacer una sola cuenta. Y en ocho es la misma
      propiedad con otro disfraz. Dominar una demostración cubre un cuarto de
      la nota del parcial.
    invariante:
      anios: 8
      fuente: >-
        «Una desigualdad no estricta sobrevive al paso al límite», en 2015-16,
        2016-17, 2017-18, 2018-19, 2022-23, 2023-24, 2024-25 y 2025-26. Los
        enunciados de 2017-18 y 2024-25 son idénticos entre sí, y los de
        2022-23 y 2023-24 también.
    dominio: >-
      Escribir la demostración entera de carrerilla en papel, sin apuntes, en
      menos de diez minutos: suponer lo contrario, elegir el épsilon que
      fabrica la contradicción, cerrar con desigualdad ancha y rematar con el
      contraejemplo de por qué no puede ser estricta.
    material:
      - tipo: teoria
        tema: t02-sucesiones
        apartado: qué-significa-exactamente-converger
        nota: >-
          El orden de los cuantificadores es lo que se corrige. Primero se da
          el épsilon y después se busca el término a partir del cual.
      - tipo: teoria
        tema: t02-sucesiones
        apartado: el-teorema-que-más-cae-el-signo-se-conserva-en-el-límite
        nota: >-
          La plantilla de cinco pasos, y el paso que separa el aprobado del
          sobresaliente: elegir el épsilon que fabrica la contradicción, no uno
          cualquiera.
      - tipo: teoria
        tema: t02-sucesiones
        apartado: el-límite-si-existe-es-único
        nota: >-
          La otra demostración que ha caído, en 2019-2020. Misma técnica con
          otro épsilon: la mitad de la distancia entre los dos candidatos.

      - tipo: ejercicio
        id: desigualdad-en-el-limite
        incrustado: true
        nota: >-
          Si solo se hace uno de todo el bloque, este. Es la propiedad que cae
          ocho de once años, con el matiz que decide la nota: la desigualdad
          estricta NO se hereda.
      - tipo: ejercicio
        id: limite-de-no-negativos
      - tipo: ejercicio
        id: signos-infinitos-limite-cero
      - tipo: ejercicio
        id: unicidad-del-limite
      - tipo: ejercicio
        id: definiciones-formales

      - tipo: ejercicio
        id: ex2526-3-cota-estricta-y-limite
      - tipo: ejercicio
        id: ex2425-3-limite-no-positivo
        nota: >-
          Enunciado idéntico al de 2017-2018. Si sale uno, sale el otro.
      - tipo: ejercicio
        id: ex2324-3-desigualdad-al-limite
      - tipo: ejercicio
        id: ex2223-3-desigualdad-al-limite
      - tipo: ejercicio
        id: ex1920-3-unicidad-del-limite
      - tipo: ejercicio
        id: ex1819-3-definiciones-y-desigualdad
      - tipo: ejercicio
        id: ex1718-3-limite-no-positivo
      - tipo: ejercicio
        id: ex1617-3-limite-no-negativo
      - tipo: ejercicio
        id: ex1516-3-verdadera-o-falsa

  # ─────────────────────────────────────────────────────────────────────
  - id: series
    titulo: Series y sucesiones a trozos
    pide: >-
      Decidir el carácter de una serie y, si converge, calcular su suma. O
      estudiar una sucesión definida por tramos y la serie que forma.
    porque: >-
      El tipo en crecimiento. Hasta 2020-2021 el cuarto ejercicio era
      «definiciones formales más una sucesión a trozos»; desde 2021-2022 son
      series de verdad, y han caído tres de los últimos cinco cursos. Vale 6
      puntos de cálculo.
    invariante:
      anios: 3
      fuente: >-
        Series con suma en 2021-2022, 2024-2025 y 2025-2026. Antes de
        2021-2022, ninguna.
    dominio: >-
      Ver de qué tipo es una serie —geométrica, telescópica, con una n delante,
      o de las que traen el criterio escrito en el enunciado— sin probar
      fórmulas a ciegas. Y ante una sucesión a trozos, contestar por separado a
      crecimiento, acotación y convergencia sin mezclar las tres.
    material:
      - tipo: teoria
        tema: t02-sucesiones
        apartado: series-sumar-infinitos-términos
        nota: >-
          La geométrica hay que tenerla en la punta de los dedos, incluida la
          versión que no empieza en cero.
      - tipo: teoria
        tema: t02-sucesiones
        apartado: las-otras-tres-que-caen
        nota: >-
          Telescópicas, Leibniz y la suma de n por r elevado a n. Son las tres
          formas que han salido desde que el ejercicio 4 dejó de ser
          definiciones y pasó a ser una serie de verdad.
      - tipo: teoria
        tema: t02-sucesiones
        apartado: creciente-decreciente-acotada
        nota: >-
          Para la variante de sucesión a trozos: las definiciones se piden
          literales, y supremo e ínfimo no son máximo y mínimo.

      - tipo: ejercicio
        id: serie-geometrica
        incrustado: true
      - tipo: ejercicio
        id: alpinista-geometrica
      - tipo: ejercicio
        id: decreciente-y-serie
      - tipo: ejercicio
        id: serie-sucesion-tres-tramos
      - tipo: ejercicio
        id: sucesion-tres-tramos
      - tipo: ejercicio
        id: alternante-frente-a-salto
      - tipo: ejercicio
        id: cubo-y-luego-cinco
      - tipo: ejercicio
        id: parametros-supremo-infimo
      - tipo: ejercicio
        id: creciente-con-limite-cero
      - tipo: ejercicio
        id: comparar-infinitesimos

      - tipo: ejercicio
        id: ex2526-4-serie-hipergeometrica
        nota: >-
          Las tres series primero. Fíjate en que el examen te regala el
          criterio dentro del enunciado: lo que se puntúa es aplicarlo bien.
      - tipo: ejercicio
        id: ex2425-4-serie-de-la-grafica
      - tipo: ejercicio
        id: ex2122-4-geometrica-alternada
      - tipo: ejercicio
        id: ex2324-4-sucesion-y-serie-a-trozos
      - tipo: ejercicio
        id: ex2223-4-definiciones-y-serie
      - tipo: ejercicio
        id: ex2122-3-sucesion-compleja-tres-partes
      - tipo: ejercicio
        id: ex2021-3-definiciones-supremo-infimo
      - tipo: ejercicio
        id: ex1920-4-tres-tramos-y-su-serie
    falta:
      - >-
        El temario oficial de la asignatura incluye «métodos numéricos» dentro
        del tema 2, y aquí no hay nada de eso: ni Newton-Raphson, ni bisección,
        ni punto fijo. No es un olvido. En los once años de exámenes leídos no
        aparece una sola vez, así que se ha preferido no escribir un apartado
        que nadie va a necesitar antes que engordar la ruta. Si algún curso
        cambia y cae, entra aquí.

  # ─────────────────────────────────────────────────────────────────────
  - id: enteros
    titulo: Los exámenes enteros, cronometrados
    pide: >-
      Sentarte con el papel en blanco, sin apuntes y con reloj, y hacer los
      cuatro ejercicios seguidos.
    porque: >-
      Los cuatro bloques anteriores entrenan cada hueco por separado, y eso no
      es lo que pasa en el aula: allí hay que repartir el tiempo entre los
      cuatro y decidir cuál se ataca primero. Estos tres son los más recientes,
      así que son los que mejor representan el formato actual — cuatro
      ejercicios y cuarenta puntos.
    dominio: >-
      Hacer uno entero dentro del tiempo, sin abrir ninguna pista, y que al
      corregirlo no haya ningún ejercicio en blanco. No se trata de acertarlo
      todo: se trata de que ningún hueco te pille sin saber por dónde empezar.
    material:
      - tipo: examen
        curso: '2025-2026'
        convocatoria: primera
        nota: >-
          Empieza por el último. Cada página abre en blanco: las resoluciones
          están en la otra pestaña y conviene no tocarlas hasta terminar.
      - tipo: examen
        curso: '2024-2025'
        convocatoria: primera
      - tipo: examen
        curso: '2023-2024'
        convocatoria: primera
    falta:
      - >-
        No hay cronómetro en la página ni forma de guardar lo que has hecho: el
        sitio es estático y no tiene cuentas de usuario. El reloj lo pones tú.

  # ─────────────────────────────────────────────────────────────────────
  - id: formulario
    titulo: Lo que hay que llevar sabido
    pide: >-
      El examen no deja formulario. Todo lo de aquí hay que llevarlo en la
      cabeza, y una parte se pide escrita literalmente.
    porque: >-
      «Definir formalmente los siguientes conceptos» es un apartado que ha
      caído en 2018-2019, 2019-2020, 2020-2021 y 2022-2023, y no se puede
      deducir: o te lo sabes o no. Lo mismo con las sumas de las series y con
      las identidades complejas. Este bloque existe para el rato de antes de
      entrar, y por eso va el último: es repaso, no aprendizaje.
    invariante:
      anios: 4
      fuente: >-
        Contado sobre los enunciados que empiezan por «definir formalmente» o
        «escribe la definición»: 2018-2019, 2019-2020, 2020-2021 y 2022-2023.
    dominio: >-
      Escribir de memoria y en papel las siete definiciones con sus
      cuantificadores en el orden correcto, y las cuatro sumas de series, sin
      consultar nada. Si tienes que mirar una sola vez, todavía no.
    material:
      - tipo: teoria
        tema: t01-complejos
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          Complejos: las formas, De Moivre y raíces, el conjugado, exponencial
          y logaritmo, y la tabla de las cinco traducciones de lugar
          geométrico.
      - tipo: teoria
        tema: t02-sucesiones
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          Sucesiones: las siete definiciones formales en una tabla, la
          plantilla de la demostración y las cuatro sumas.
    falta:
      - >-
        Las dos listas son una segunda copia de cosas que ya están explicadas
        en los temas, y eso tiene un riesgo: si un día se corrige la teoría y
        no se corrige aquí, esto miente. Se dice en voz alta porque no hay
        ningún guardián que lo compruebe todavía.
      - >-
        No se puede imprimir solo el formulario. Cada uno vive al final de la
        página de su tema, así que imprimir arrastra el tema entero — diecinueve
        folios el de complejos, diez el de sucesiones. Se imprime bien, pero no
        es la hoja suelta que este bloque querría ser.
