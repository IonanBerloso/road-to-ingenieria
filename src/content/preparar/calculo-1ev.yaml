asignatura: calculo
evaluacion: primera
titulo: Preparar la primera evaluación
lede: >-
  Los temas 1 y 2, el 10 % de la nota. Esto no es el temario en orden: es un
  camino de principio a fin, desde lo que hay que saber hacer sin pensar hasta
  los cuatro huecos que el examen lleva once años repitiendo. Y el orden
  importa, porque la mayor parte de los puntos no se gana calculando.
temas:
  - t01-complejos
  - t02-sucesiones
medidoSobre: 11
criterioDeOrden: >-
  Primero el suelo, que no se examina solo pero sin el cual no sale nada.
  Después los cuatro huecos del examen ordenados por lo que rinden: lo que cae
  todos los años, y dentro de eso lo que más puntos vale. El bloque de la
  demostración va antes que el de series aunque sea de más adelante en el
  temario, porque son diez puntos que se repiten casi literalmente año tras
  año. Al final los exámenes enteros y el formulario, que son repaso, no
  aprendizaje.

  Dentro de cada escalón los ejercicios van de ejemplo a examen, y en ese
  orden. Los últimos de varios escalones son de las **recuperaciones del
  primer cuatrimestre**, que hasta 2020-2021 venían dentro de los cuadernillos
  de la cuarta y de la quinta evaluación y preguntan exactamente estos dos
  temas: **veinte ejercicios más** con los que medirse, diecisiete de la
  recuperación de la cuarta y tres de la de la quinta. Los recuentos de esta
  ruta, en cambio, siguen siendo sobre las once primeras evaluaciones y solo
  sobre ellas.


  **Cómo se han determinado los huecos de esta ruta.** Un bloque sin `falta[]`
  no es un bloque sin mirar: el 29 de agosto de 2026 se pasaron los sesenta y
  dos bloques de las siete rutas por tres criterios medidos —si su tema tiene
  pocos ejemplos de entrada para lo que el examen le exige, si sus ejercicios
  usan una herramienta que la prosa de ese tema no nombra, y si algún escalón
  suyo empieza directamente en un ejercicio de examen— y solo se declara lo que
  sale de alguno de ellos. Lo que no aparece aquí es porque ninguno de los tres
  lo señaló.
bloques:
  # ─────────────────────────────────────────────────────────────────────
  - id: suelo
    apunte:
      texto: 'no da puntos — los sostiene todos'
      tono: marco
    titulo: El suelo, que no se examina solo
    pide: >-
      Nada por sí mismo. Es lo que los cuatro ejercicios del examen dan por
      sabido antes de empezar: pasar de una forma a otra, dividir, girar.
    porque: >-
      En once años no ha caído ni un solo ejercicio que sea «pasa esto a
      polar». Y no hay prácticamente ninguno de los 22 ejercicios de tema 1 que
      se resuelva sin hacerlo, o sin racionalizar un cociente por el conjugado.
      Es el bloque que no da puntos por sí mismo y sin el cual los otros dos de
      complejos no se terminan a tiempo. Por eso va primero y por eso es corto.
    dominio: >-
      Dividir dos complejos cualesquiera y pasar el resultado a polar en menos
      de un minuto, sin mirar apuntes y acertando el cuadrante del argumento a
      la primera. Si dudas del cuadrante, no has terminado este bloque.
    escalones:
      # ─────────────────────────────────────────────────────────────────
      - id: formas
        titulo: Pasar de una forma a la otra
        aprendes: >-
          Coger cualquier complejo escrito en binómica y decir su módulo y su
          argumento, y al revés: leer una forma polar y escribirla como a + bi.
        dominio: >-
          Hacer los dos caminos, ida y vuelta, sin mirar la fórmula y sin
          calculadora. Si tienes que pararte a recordar cuál lleva el coseno,
          repite los dos ejemplos.
        teoria:
          tema: t01-complejos
          apartado: las-dos-formas-y-por-qué-hacen-falta-las-dos
          nota: >-
            Por qué hay dos notaciones y cuándo conviene cada una. Sumar en
            binómica, multiplicar en polar.
        ejercicios:
          - id: ej-polar-de-uno-mas-i
            incrustado: true
            nota: >-
              Empieza por aquí. Es el camino de ida con los números más
              sencillos que hay, y está resuelto paso a paso si te atascas.
          - id: ej-binomica-desde-polar
            nota: El camino de vuelta, con el mismo tamaño de números.
          - id: cociente-exponencial
            nota: >-
              Y ahora el mismo viaje dentro de un ejercicio de verdad: aquí ya
              hay que racionalizar antes de poder pasar a polar.

      # ─────────────────────────────────────────────────────────────────
      - id: argumento
        titulo: El argumento, y el cuadrante que lo decide
        aprendes: >-
          Calcular el argumento de cualquier complejo sin equivocarte de
          cuadrante, incluidos los casos en que la fórmula de la tangente ni
          siquiera se puede usar.
        dominio: >-
          Delante de un complejo con alguna parte negativa, decir el cuadrante
          antes de tocar ninguna fórmula, y saber si al ángulo hay que sumarle
          o restarle pi. Sin dudar.
        teoria:
          tema: t01-complejos
          apartado: el-argumento-y-la-trampa-de-arctan
          nota: >-
            El error más caro del tema, y el más fácil de evitar. En el examen
            no hay calculadora, así que el cuadrante lo pones tú.
        ejercicios:
          - id: ej-argumento-tercer-cuadrante
            incrustado: true
            nota: >-
              El caso que se falla. Fíjate en que los dos signos menos se
              cancelan al dividir y con ellos se pierde el cuadrante.
          - id: ej-argumento-imaginario-puro
            nota: >-
              El otro caso raro: cuando la parte real es cero no hay tangente
              que valga y hay que mirar el dibujo.
          - id: potencia-novena
            nota: >-
              Ya con dificultad de boletín: un número del tercer cuadrante
              elevado a la novena. Si el argumento sale mal, sale todo mal.

      # ─────────────────────────────────────────────────────────────────
      - id: conjugado
        titulo: Dividir, que es multiplicar por el conjugado
        aprendes: >-
          Dividir dos complejos cualesquiera, y reconocer el conjugado cuando
          viene escondido dentro de una condición del enunciado.
        dominio: >-
          Dividir dos complejos en menos de un minuto y con el signo correcto,
          y saber de memoria que un número por su conjugado es el módulo al
          cuadrado.
        teoria:
          tema: t01-complejos
          apartado: el-conjugado-que-hace-casi-todo-el-trabajo
          nota: >-
            La herramienta transversal. Aparece en cada cociente que se
            racionaliza y en las ecuaciones que parecen de grado cinco.
        ejercicios:
          - id: ej-dividir-racionalizando
            incrustado: true
            nota: >-
              Una división y nada más. Es el gesto que vas a repetir en medio
              de casi todos los ejercicios del tema.
          - id: ej-modulo-por-conjugado
            nota: >-
              De dónde sale que el truco funcione: el producto de un número por
              su conjugado no tiene parte imaginaria.
          - id: parametro-real-cociente
            nota: >-
              Y aquí ya con un parámetro dentro, separando parte real e
              imaginaria para imponer una condición. Es el paso previo de la
              mitad de los lugares geométricos.
          - id: dos-complejos-cociente-real

      # ─────────────────────────────────────────────────────────────────
      - id: demoivre
        titulo: Potencias, con De Moivre
        aprendes: >-
          Elevar un complejo a una potencia alta sin desarrollar el binomio,
          pasando por la forma polar.
        dominio: >-
          Elevar a la doceava sin que te dé pereza, porque en polar es una
          multiplicación de nada. Y llegar a las raíces del bloque siguiente
          con esto automatizado.
        teoria:
          tema: t01-complejos
          apartado: multiplicar-es-girar-y-escalar
          nota: >-
            De Moivre no es una fórmula nueva: es «multiplica los módulos y
            suma los argumentos» repetido n veces.
        ejercicios:
          - id: potencia-doceava
          - id: suma-conjugados
            nota: >-
              Dos potencias décimas que se suman, y un atajo: son conjugados,
              así que las partes imaginarias se cancelan.
          - id: raiz-cubica-cociente
          - id: potencia-real-negativa
          - id: ex1516-rec-1-potencia-negativa-y-la-identidad-del-seno
            nota: >-
              De examen, y con exponente negativo: De Moivre vale igual, el
              módulo se va al denominador. Lleva detrás una identidad
              trigonométrica, que es el escalón de más abajo.
          - id: ex1617-rec-1-de-moivre-y-el-coseno-cuadruple
            nota: >-
              Este pide **demostrar** De Moivre y luego cobrarla en $\cos 4x$.
              Si te lo saltas, sáltate también la mitad de la nota de COMP4 de
              este bloque.

  # ─────────────────────────────────────────────────────────────────────
  - id: regiones
    apunte:
      texto: 'cae los 11 años — 7 pts de cálculo'
      tono: nota
    titulo: Regiones del plano complejo
    pide: >-
      Calcular y representar gráficamente los afijos de los números complejos
      que verifican una o dos condiciones.
    porque: >-
      Es el único ejercicio que ha caído los once años sin faltar uno, y en
      nueve de ellos fue el número 1. Vale 7 puntos de cálculo de los 10: es el
      ejercicio con más COMP2 de todo el examen. Empieza por aquí porque es el
      más seguro y el que más rápido se automatiza.
    invariante:
      anios: 11
      fuente: >-
        Contado sobre los once exámenes de primera evaluación publicados aquí,
        de 2015-2016 a 2025-2026.
    dominio: >-
      Leer un enunciado con dos condiciones y saber, antes de escribir nada,
      qué figura sale de cada una. Y que el dibujo salga con el borde correcto,
      el punto excluido marcado y una comprobación con un punto interior.
    escalones:
      - id: traducir
        titulo: Traducir una condición en una figura
        aprendes: >-
          Leer las cuatro frases básicas —distancia, mediatriz, semiplano y
          semirrecta— y dibujarlas sin hacer una sola cuenta.
        dominio: >-
          Ver un módulo y decir «distancia a este punto» sin pensarlo, y saber
          si el borde entra o no mirando solo el signo de la desigualdad.
        teoria:
          tema: t01-complejos
          apartado: lugares-geométricos-traducir-la-condición-a-una-distancia
          nota: >-
            Las cuatro traducciones, y las dos rutinas que se puntúan aparte
            del dibujo: el punto excluido y el borde.
        ejercicios:
          - id: ej-disco-y-borde
            incrustado: true
            nota: >-
              Empieza aquí. Una sola condición, sin álgebra: solo traducir y
              decidir si el borde entra.
          - id: ej-mediatriz-simple
            nota: >-
              La segunda traducción, la que compara dos distancias. Sale una
              recta y no hace falta desarrollar nada.
          - id: lugar-dos-condiciones-modulo
            nota: >-
              Ya de boletín, y con la vuelta de tuerca conceptual del tema: en
              los complejos no hay orden, así que una desigualdad entre
              complejos se lee entre módulos.

      - id: apolonio
        titulo: Apolonio, cuando las distancias no pesan igual
        aprendes: >-
          Reconocer que un cociente de módulos constante distinto de 1 da una
          circunferencia, y encontrar su centro y su radio completando
          cuadrados.
        dominio: >-
          Llegar de la condición a la ecuación de la circunferencia sin
          consultar nada, y saber que el centro no queda en el punto medio.
        teoria:
          tema: t01-complejos
          apartado: apolonio-cuando-las-dos-distancias-no-van-al-mismo-peso
          nota: >-
            Con la figura. Fíjate en dónde queda el centro: desplazado hacia el
            punto del que se está el doble de lejos.
        ejercicios:
          - id: lugar-cociente-modulos
            nota: El patrón limpio, sin nada más alrededor.
          - id: ex2526-1-semiplano-con-mordisco
          - id: ex1920-1-apolonio-con-raiz-cubica
            nota: >-
              Aquí la razón no te la dan: hay que calcularla antes, resolviendo
              unas raíces cúbicas.
          - id: ex2122-1-apolonio-de-area-dada
            nota: >-
              Y aquí al revés: te dan el área y hay que despejar el parámetro
              que la produce.

      - id: arco-capaz
        titulo: El arco capaz, y quedarse con la mitad correcta
        aprendes: >-
          Reconocer que un argumento de un cociente constante da un arco, y
          decidir cuál de las dos mitades cumple el signo.
        dominio: >-
          Que nunca se te quede la circunferencia entera cuando el enunciado
          solo pide un arco, y que los extremos salgan siempre excluidos.
        teoria:
          tema: t01-complejos
          apartado: el-arco-capaz-y-cuándo-se-rompe-en-una-semirrecta
          nota: >-
            Incluye la degeneración: con ángulo cero o llano el arco se estira
            y se convierte en una recta o en dos semirrectas.
        ejercicios:
          - id: lugar-argumento-cociente
          - id: ex1718-1-semicircunferencia
            nota: Enunciado idéntico al del boletín. Si sale uno, sale el otro.
          - id: ex2021-1-arco-capaz
            nota: >-
              Con conjugados y ángulo negativo, que es lo que decide qué arco
              te quedas.
          - id: ex2324-1-semirrecta-vertical
            nota: La degeneración, y un lugar geométrico que no tiene área.
          - id: ex2223-1-recta-y-conjunto-vacio
            nota: >-
              El caso extremo: un apartado cuyo lugar geométrico es el conjunto
              vacío, y hay que saber decir por qué.

      - id: elipse
        titulo: La elipse, que sale de sumar distancias
        aprendes: >-
          Reconocer la definición de elipse escrita con módulos y sacar los
          semiejes sin desarrollar la ecuación.
        dominio: >-
          Identificar focos y semiejes de memoria, y no confundir el mayor con
          el menor, que es el error que deja la elipse girada.
        teoria:
          tema: t01-complejos
          apartado: la-elipse-y-la-hipérbola-que-nunca-cae
          nota: >-
            Y la hipérbola, que aparece como respuesta plausible y en once años
            no se ha pedido ni una vez.
        ejercicios:
          - id: ej-mediatriz-simple
            incrustado: true
            nota: >-
              La condición más simple sobre dos distancias. La elipse es esta con una suma en vez de una igualdad.
          - id: lugar-elipse-sector
          - id: ex1617-2-elipse-por-definicion
            nota: >-
              El más abordable de los diecisiete: una condición, escrita en
              castellano, sin desigualdad ni denominador.
          - id: ex1516-2-media-elipse
          - id: ex1718-rec-1-la-elipse-cortada-por-el-sector
            nota: >-
              El caso completo: una elipse escrita con la suma de distancias, y
              un sector angular que la recorta. Fíjate en que el recinto que
              queda **no** es un triángulo.

      - id: parabola
        titulo: La parábola, de mezclar un módulo con una coordenada
        aprendes: >-
          Reconocer la condición que compara una distancia con una coordenada,
          y despejarla elevando al cuadrado una sola vez.
        dominio: >-
          Acordarte de la restricción tácita que hace legítimo elevar al
          cuadrado, y escribirla en la respuesta.
        teoria:
          tema: t01-complejos
          apartado: la-parábola-que-sale-de-mezclar-un-módulo-con-una-coordenada
        ejercicios:
          - id: lugar-mediatriz-parabola
          - id: ex2425-1-parabola-y-circunferencia
          - id: ex1920-rec-1-media-recta-y-parabola
            nota: >-
              Los dos lugares de este bloque en el mismo enunciado: una
              mediatriz y una parábola. Y la restricción tácita antes de elevar
              al cuadrado se cobra aquí.

      - id: cociente
        titulo: Cuando la z está en el denominador
        aprendes: >-
          Racionalizar una condición sobre la parte real o imaginaria de un
          cociente y llegar al disco que define.
        dominio: >-
          Hacer la racionalización sin errores de signo y no olvidar nunca el
          punto excluido, que es el medio punto que se pierde.
        teoria:
          tema: t01-complejos
          apartado: cuando-la-condición-viene-sobre-un-cociente
          nota: >-
            La variante que más se repite en la última década, y la que hace
            del conjugado la herramienta transversal del tema.
        ejercicios:
          - id: lugar-inverso-desplazado
          - id: ex1819-1-lente-de-dos-discos
            nota: >-
              Mismo enunciado que el del boletín. Dos condiciones de este tipo
              se cortan en una lente.
          - id: ex1819-rec-1-una-desigualdad-que-no-esta-definida
            nota: >-
              El más raro de todo el corpus, y el que más enseña: el enunciado
              escribe $1/z \ge \overline{z}$, una desigualdad entre complejos,
              que no está definida. Hay que decidir qué significa **antes** de
              calcular, y la respuesta no es solo un trozo del eje real.
          - id: ex2021-5rec-1-cuando-el-cociente-es-real
            nota: >-
              De la recuperación de la quinta de 2020-2021. Dos lugares de un
              cociente a la vez, y **dos puntos que hay que quitar**: es el ejercicio
              que más insiste en el punto excluido.

  # ─────────────────────────────────────────────────────────────────────
  - id: segundo-de-complejos
    apunte:
      texto: 'el más variable'
      tono: neutro
    titulo: El segundo ejercicio de complejos
    pide: >-
      Resolver una ecuación en el plano complejo, encontrar un vértice que
      falta o demostrar una identidad trigonométrica para argumentos complejos.
    porque: >-
      Los once exámenes llevan exactamente dos ejercicios de tema 1, así que
      este hueco también cae siempre. Lo que cambia es qué se pide dentro: es
      el más variable de los cuatro. Se ataca por frecuencia reciente, no por
      orden del boletín.
    invariante:
      anios: 11
      fuente: >-
        Los once exámenes tienen dos ejercicios de tema 1 y el resto de tema 2,
        sin excepción.
    dominio: >-
      Ante una ecuación en el plano complejo, saber en qué caso estás —raíces
      n-ésimas, cambio de variable, o ecuación con conjugado y módulo— en los
      primeros treinta segundos, y no perder nunca la solución z = 0 ni
      quedarte con menos raíces de las que hay.
    escalones:
      - id: raices
        titulo: Ecuaciones que son raíces n-ésimas
        aprendes: >-
          Resolver una ecuación del tipo z elevado a n igual a w, sacando las n
          raíces y colocándolas en su polígono regular.
        dominio: >-
          Que salgan siempre las n raíces, ni una menos, y que puedas dibujar
          el polígono antes de terminar de calcularlas.
        teoria:
          tema: t01-complejos
          apartado: raíces-n-ésimas-cuántas-hay-y-por-qué-están-repartidas
          nota: >-
            Las raíces reparten el ángulo a partes iguales. Si no salen n, o no
            están equiespaciadas, hay un error antes.
        ejercicios:
          - id: ecuacion-cuarta-menos-dieciseis
            incrustado: true
            nota: El caso desnudo, sin nada alrededor. Cuatro raíces y un cuadrado.
          - id: ecuacion-bicubica
            nota: >-
              De grado seis, pero es de segundo con un cambio de variable. Ver
              el cambio es todo el ejercicio.
          - id: ex1819-2-bicubica
          - id: ex2425-2-cubica-desplazada
            nota: Con el centro movido, así que la traslación va antes que las raíces.
          - id: ex2526-2-raiz-cuarta-de-la-figura
            nota: >-
              El del curso pasado, con los datos leídos de una figura en vez de
              escritos.
          - id: ex2021-rec-1-tres-raices-que-forman-un-triangulo
            nota: >-
              Las raíces de una cúbica que además hay que medir: perímetro y
              área del triángulo que dibujan. Ojo al primer paso — sacar $z$
              factor común, no dividir entre $z$.

      - id: ecuaciones-con-conjugado
        titulo: Ecuaciones con conjugado y módulo
        aprendes: >-
          Resolver ecuaciones donde aparecen a la vez la z, su conjugado y su
          módulo, tomando módulos primero para separar los casos.
        dominio: >-
          No perder nunca la solución z = 0, y usar que el conjugado es el
          inverso cuando el módulo vale 1 para bajar el grado.
        teoria:
          tema: t01-complejos
          apartado: el-conjugado-que-hace-casi-todo-el-trabajo
          nota: >-
            La propiedad que rinde aquí es la última: si el módulo vale 1, el
            conjugado es el inverso, y eso resta un grado.
        ejercicios:
          - id: ecuacion-cubo-menos-modulo
            nota: >-
              El más claro para ver los dos casos: o el módulo es cero, y
              entonces z también, o el módulo es uno.
          - id: ecuacion-cuarta-conjugado
          - id: ex2122-2-quinta-con-conjugado
          - id: ex1516-1-parametro-real
            nota: >-
              De separar parte real e imaginaria con un parámetro dentro. Cuatro
              apartados con la misma técnica.
          - id: ex1718-5rec-1-dos-complejos-atados-por-un-cociente
            nota: >-
              De la recuperación de la quinta de 2017-2018. Dos incógnitas complejas
              atadas por su cociente: se resuelve pasando a polar y separando módulo
              de argumento.

      - id: giros
        titulo: Giros y polígonos
        aprendes: >-
          Encontrar los vértices que faltan de una figura multiplicando por una
          exponencial, que es girar.
        dominio: >-
          Saber que multiplicar por i es girar 90 grados sin tener que
          comprobarlo, y elegir bien entre los dos candidatos que suelen salir.
        teoria:
          tema: t01-complejos
          apartado: multiplicar-es-girar-y-escalar
          nota: >-
            El tercer vértice se obtiene multiplicando por una exponencial de
            argumento 60 o 90 grados, según la figura.
        ejercicios:
          - id: triangulo-rectangulo-isosceles
          - id: rombo-diagonales
          - id: ex1617-1-triangulo-isosceles
            nota: >-
              Con la condición que decide cuál de los dos candidatos vale: «el
              de mayor componente imaginaria».
          - id: ex2324-2-triangulo-girado
            nota: Aquí hay que deshacer un giro dado, no darlo.

      - id: exponencial-y-logaritmo
        titulo: Ecuaciones con la z en el exponente
        aprendes: >-
          Resolver una ecuación exponencial en el plano complejo sabiendo que
          no tiene una solución, sino una fila infinita de ellas.
        dominio: >-
          Escribir siempre el 2kπ en la respuesta. Un logaritmo complejo sin la
          familia completa pierde los puntos de explicación formal.
        teoria:
          tema: t01-complejos
          apartado: el-logaritmo-que-da-infinitos-valores
          nota: >-
            De dónde salen los infinitos valores: de que la exponencial es
            periódica de periodo 2πi.
        ejercicios:
          - id: logaritmo-complejo
          - id: ecuacion-exponencial
          - id: ex2021-2-exponencial-en-el-eje-real
          - id: ex1718-2-exponencial-recta-vertical
          - id: ex1920-rec-2-coseno-igual-a-dos
            nota: >-
              $\cos z = 2$, que en los reales es imposible. Se resuelve tomando
              logaritmo complejo, y por eso está aquí y no entre las
              trigonométricas.

      - id: trigonometricas
        titulo: Identidades con seno y coseno complejos
        aprendes: >-
          Demostrar una identidad trigonométrica en el plano complejo
          sustituyendo la definición exponencial y operando.
        dominio: >-
          No invocar nunca la identidad real: la demostración que puntúa parte
          de la definición con exponenciales. Y recordar que el seno complejo
          no está acotado.
        teoria:
          tema: t01-complejos
          apartado: seno-y-coseno-definidos-con-exponenciales
          nota: >-
            La definición, y por qué la acotación se pierde mientras las
            identidades algebraicas se conservan.
        ejercicios:
          - id: identidad-seno-suma
          - id: identidad-seno-cuadrado
          - id: coseno-igual-a-cinco
            nota: >-
              La ecuación que en los reales no tiene solución. Se resuelve con
              el cambio t igual a la exponencial.
          - id: coseno-complejo-igualdad
          - id: ex1920-2-seno-de-una-suma
          - id: ex2223-2-identidad-coseno-cuadrado
          - id: ex1718-rec-2-el-coseno-del-doble
            nota: >-
              La identidad de siempre, pero hay que decir **por qué** sigue
              valiendo en $\mathbb{C}$. Tres puntos de COMP4 en esa frase.
          - id: ex1819-rec-2-seno-igual-a-seno-del-doble
            nota: >-
              Se factoriza, no se divide: dividir entre
              $\operatorname{sen} z$ borra la mitad de las soluciones.
          - id: ex2021-rec-2-la-ecuacion-que-se-desarma-sola
            nota: >-
              Parece difícil hasta que reconoces Euler y los dos senos se
              cancelan. Siete puntos de cálculo que se ganan mirando.

  # ─────────────────────────────────────────────────────────────────────
  - id: demostracion-de-sucesiones
    apunte:
      texto: 'el más rentable — 7+ pts sin una cuenta'
      tono: nota
    titulo: La demostración de sucesiones
    pide: >-
      Razonar si una afirmación sobre el límite de una sucesión es verdadera o
      falsa, y demostrarlo con la definición.
    porque: >-
      El bloque más rentable del examen. Los once años tienen un ejercicio de
      tema 2 que se juega entero en explicación formal, con 7 puntos o más; en
      nueve de ellos no hay que hacer una sola cuenta. Y en ocho es la misma
      propiedad con otro disfraz. Dominar una demostración cubre un cuarto de
      la nota del parcial.
    invariante:
      anios: 8
      fuente: >-
        «Una desigualdad no estricta sobrevive al paso al límite», en 2015-16,
        2016-17, 2017-18, 2018-19, 2022-23, 2023-24, 2024-25 y 2025-26. Los
        enunciados de 2017-18 y 2024-25 son idénticos entre sí, y los de
        2022-23 y 2023-24 también.
    dominio: >-
      Escribir la demostración entera de carrerilla en papel, sin apuntes, en
      menos de diez minutos: suponer lo contrario, elegir el épsilon que
      fabrica la contradicción, cerrar con desigualdad ancha y rematar con el
      contraejemplo de por qué no puede ser estricta.
    escalones:
      - id: la-definicion
        titulo: Leer la definición de límite
        aprendes: >-
          Entender el juego entre el épsilon y el m, y saber encontrar un m
          concreto cuando te dan un margen concreto.
        dominio: >-
          Escribir la definición con los cuantificadores en el orden correcto y
          sin mirar. Si dudas de si va primero el épsilon o el m, repite el
          ejemplo.
        teoria:
          tema: t02-sucesiones
          apartado: qué-significa-exactamente-converger
          nota: >-
            El orden de los cuantificadores es lo que se corrige: primero se da
            el épsilon y después se busca el término a partir del cual.
        ejercicios:
          - id: ej-definicion-de-limite
            incrustado: true
            nota: >-
              Empieza aquí. Un margen concreto, un número concreto, y se ve por
              qué el m depende del épsilon.
          - id: definiciones-formales
            nota: >-
              Y ahora las siete definiciones escritas con cuantificadores, que
              es como las pide el examen.
          - id: ex1617-rec-2-el-limite-de-uno-partido-n
            nota: >-
              El caso más simple que existe, y siete de sus diez puntos son la
              demostración. Si no sabes producir el $m$ a partir del
              $\varepsilon$, este es el sitio para aprenderlo.
          - id: ex1819-rec-3-negar-un-limite
            nota: >-
              Y ahora al revés: demostrar que $-2$ **no** es el límite. Negar
              la definición —cambiar los cuantificadores— es lo que se evalúa.
          - id: ex1819-5rec-1-la-sucesion-que-se-cae-en-el-cien
            nota: >-
              De la recuperación de la quinta de 2018-2019, y vale 0/2/8: casi todo
              es escribir las dos definiciones formales. La sucesión se desploma en el
              término cien, que es el contraejemplo de «crece siempre».

      - id: el-signo-en-el-limite
        titulo: La demostración que más cae
        aprendes: >-
          Demostrar por reducción al absurdo que una desigualdad no estricta
          sobrevive al paso al límite, eligiendo bien el épsilon.
        dominio: >-
          Que la plantilla de cinco pasos te salga sola, y que cierres siempre
          con desigualdad ancha y su contraejemplo.
        teoria:
          tema: t02-sucesiones
          apartado: el-teorema-que-más-cae-el-signo-se-conserva-en-el-límite
          nota: >-
            La plantilla, y el paso que separa el aprobado del sobresaliente:
            elegir el épsilon que fabrica la contradicción, no uno cualquiera.
        ejercicios:
          - id: ej-signo-en-el-limite
            incrustado: true
            nota: >-
              El caso más simple, con su contraejemplo. Es literalmente el
              enunciado que cae cinco de los once años.
          - id: desigualdad-en-el-limite
            nota: >-
              Si solo haces uno de boletín, este. Es la propiedad que cae ocho
              de once años.
          - id: limite-de-no-negativos
          - id: signos-infinitos-limite-cero
          - id: ex2526-3-cota-estricta-y-limite
          - id: ex2425-3-limite-no-positivo
            nota: Enunciado idéntico al de 2017-2018. Si sale uno, sale el otro.
          - id: ex2324-3-desigualdad-al-limite
          - id: ex2223-3-desigualdad-al-limite
          - id: ex1819-3-definiciones-y-desigualdad
          - id: ex1718-3-limite-no-positivo
          - id: ex1617-3-limite-no-negativo
          - id: ex1516-3-verdadera-o-falsa
          - id: ex1920-rec-3-el-signo-sobrevive-al-limite
            nota: >-
              La versión con $\le 0$, y diez puntos enteros de COMP4. Aquí se
              ve por qué el $\varepsilon$ que hay que elegir es $L/2$.
          - id: ex2021-rec-3-la-desigualdad-estricta-no-sobrevive
            nota: >-
              Las dos afirmaciones juntas, una cierta y otra falsa, para que se
              vea dónde exactamente se rompe la demostración cuando la
              desigualdad es estricta.

      - id: unicidad
        titulo: El límite, si existe, es único
        aprendes: >-
          Demostrar la unicidad del límite con la misma técnica, cambiando solo
          qué épsilon se elige.
        dominio: >-
          Ver que es la misma plantilla y que lo único que cambia es la
          distancia que se toma como épsilon: aquí, la mitad de la que separa
          los dos candidatos.
        teoria:
          tema: t02-sucesiones
          apartado: el-límite-si-existe-es-único
          nota: >-
            Cayó en 2019-2020. Misma técnica: suponer lo contrario y elegir
            bien el épsilon.
        ejercicios:
          - id: unicidad-del-limite
          - id: ex1920-3-unicidad-del-limite

  # ─────────────────────────────────────────────────────────────────────
  - id: series
    apunte:
      texto: 'el tipo en crecimiento'
      tono: neutro
    titulo: Series y sucesiones a trozos
    pide: >-
      Decidir el carácter de una serie y, si converge, calcular su suma. O
      estudiar una sucesión definida por tramos y la serie que forma.
    porque: >-
      El tipo en crecimiento. Hasta 2020-2021 el cuarto ejercicio era
      «definiciones formales más una sucesión a trozos»; desde 2021-2022 son
      series de verdad, y han caído tres de los últimos cinco cursos. Vale 6
      puntos de cálculo.
    invariante:
      anios: 3
      fuente: >-
        Series con suma en 2021-2022, 2024-2025 y 2025-2026. Antes de
        2021-2022, ninguna.
    dominio: >-
      Ver de qué tipo es una serie —geométrica, telescópica, con una n delante,
      o de las que traen el criterio escrito en el enunciado— sin probar
      fórmulas a ciegas. Y ante una sucesión a trozos, contestar por separado a
      crecimiento, acotación y convergencia sin mezclar las tres.
    escalones:
      - id: geometrica
        titulo: La serie geométrica
        aprendes: >-
          Reconocer una geométrica por su razón, decidir si converge y sumarla,
          empiece donde empiece.
        dominio: >-
          Sumarla de memoria, incluida la versión que no empieza en cero, y
          saber demostrar la fórmula si te la piden.
        teoria:
          tema: t02-sucesiones
          apartado: series-sumar-infinitos-términos
          nota: >-
            La condición necesaria sirve para descartar, nunca para confirmar.
            Y la geométrica hay que tenerla en la punta de los dedos.
        ejercicios:
          - id: ej-suma-geometrica
            incrustado: true
            nota: >-
              Empieza aquí. La geométrica más simple que existe, con la razón a
              la vista.
          - id: serie-geometrica
            nota: Con su demostración, que es lo que pidió 2017-2018.
          - id: alpinista-geometrica
            nota: Una geométrica disfrazada de problema de un alpinista.
          - id: ex2122-4-geometrica-alternada
            nota: Con razón negativa, que no cambia la fórmula pero sí los signos.
          - id: ex1516-rec-2-recurrente-y-geometrica
            nota: >-
              De definiciones: qué es una serie geométrica y qué es una
              sucesión recurrente, cada una con su ejemplo. Diez puntos que se
              pierden por dar un ejemplo que no distingue las dos cosas.

      - id: telescopica
        titulo: Telescópicas y las otras dos
        aprendes: >-
          Descomponer en fracciones simples, ver qué se cancela y qué
          sobrevive, y reconocer las otras dos formas que han caído.
        dominio: >-
          Escribir cuatro sumandos desarrollados antes de decidir qué queda. Con
          tres factores en el denominador no sobrevive uno en cada punta.
        teoria:
          tema: t02-sucesiones
          apartado: telescópicas-casi-todo-se-cancela
          nota: >-
            La señal para reconocerlas es un denominador factorizable en
            términos consecutivos.
        ejercicios:
          - id: ej-telescopica-que-se-cancela
            incrustado: true
            nota: >-
              Empieza aquí. La descomposición más simple, y se ve exactamente
              qué se cancela y qué no.
          - id: ex2526-4-serie-hipergeometrica
            nota: >-
              Del curso pasado. Fíjate en que el examen te regala el criterio
              dentro del enunciado: lo que se puntúa es aplicarlo bien.
          - id: ex2425-4-serie-de-la-grafica
            nota: La de n por r elevado a n, con la razón leída de una gráfica.

      - id: sucesiones-a-trozos
        titulo: Sucesiones definidas a trozos
        aprendes: >-
          Contestar por separado a crecimiento, acotación y convergencia de una
          sucesión partida en tramos, y a la serie que forma.
        dominio: >-
          No mezclar las tres preguntas. Los primeros términos no cuentan para
          el límite pero sí para la monotonía y para la suma.
        teoria:
          tema: t02-sucesiones
          apartado: creciente-decreciente-acotada
          nota: >-
            Las definiciones se piden literales, y supremo e ínfimo no son
            máximo y mínimo.
        ejercicios:
          - id: cubo-y-luego-cinco
          - id: sucesion-tres-tramos
          - id: serie-sucesion-tres-tramos
          - id: decreciente-y-serie
          - id: alternante-frente-a-salto
            nota: >-
              El contraste que más rinde: alternar infinitas veces no es lo
              mismo que cambiar una sola vez.
          - id: parametros-supremo-infimo
          - id: creciente-con-limite-cero
          - id: comparar-infinitesimos
          - id: ex2324-4-sucesion-y-serie-a-trozos
          - id: ex2223-4-definiciones-y-serie
          - id: ex2021-3-definiciones-supremo-infimo
          - id: ex1920-4-tres-tramos-y-su-serie
          - id: ex2122-3-sucesion-compleja-tres-partes
            nota: >-
              El único puente entre los dos temas: una sucesión de complejos, y
              hay que mirar módulo, argumento y parte imaginaria por separado.
          - id: ex1718-rec-3-dos-sucesiones-a-trozos
            nota: >-
              El contraste en estado puro: dos sucesiones con **las mismas dos
              fórmulas**, y solo converge una. Si haces uno solo de este
              escalón, que sea este.
          - id: ex1920-rec-4-la-sucesion-que-se-desploma
            nota: >-
              A trozos, con un salto enorme en medio, y encima hay que decidir
              si su serie converge. Cuidado con contestar «converge porque el
              término tiende a cero».
    falta:
      - >-
        El temario oficial de la asignatura incluye «métodos numéricos» dentro
        del tema 2 —y también del 5 y del 9—, y aquí no hay nada de eso: ni
        Newton-Raphson, ni bisección, ni trapecios, ni Simpson, ni Euler. No es
        un olvido, y ahora está contado: sobre las 88 convocatorias
        transcritas y sus 425 ejercicios, **un solo enunciado pide un método
        numérico** —la regla del punto medio con cuatro subintervalos, en la
        extraordinaria de 2012-2013, que es el examen más antiguo del
        corpus—, y en los doce años siguientes no vuelve a caer. Cero de
        Newton-Raphson, cero de bisección, cero de trapecios, cero de Simpson,
        cero de Euler, cero de Runge-Kutta. Contado el 5 de septiembre de 2026
        sobre el enunciado y lo que pide cada uno de los 425 ejercicios de las
        88 convocatorias —no sobre las resoluciones, porque que una resolución
        nuestra itere para cerrar una cuenta no significa que el examen pida
        el método—. Se ha preferido no escribir un apartado que
        nadie va a necesitar antes que engordar la ruta. Si algún curso cambia
        y cae, entra aquí.

  # ─────────────────────────────────────────────────────────────────────
  - id: enteros
    apunte:
      texto: 'papel en blanco y reloj'
      tono: neutro
    titulo: Los exámenes enteros, cronometrados
    pide: >-
      Sentarte con el papel en blanco, sin apuntes y con reloj, y hacer los
      cuatro ejercicios seguidos.
    porque: >-
      Los cuatro bloques anteriores entrenan cada hueco por separado, y eso no
      es lo que pasa en el aula: allí hay que repartir el tiempo entre los
      cuatro y decidir cuál se ataca primero. Estos tres son los más recientes,
      así que son los que mejor representan el formato actual — cuatro
      ejercicios y cuarenta puntos.
    dominio: >-
      Hacer uno entero dentro del tiempo, sin abrir ninguna pista, y que al
      corregirlo no haya ningún ejercicio en blanco. No se trata de acertarlo
      todo: se trata de que ningún hueco te pille sin saber por dónde empezar.
    material:
      - tipo: examen
        curso: '2025-2026'
        convocatoria: primera
        nota: >-
          Empieza por el último. Cada página abre en blanco: las resoluciones
          están en la otra pestaña y conviene no tocarlas hasta terminar.
      - tipo: examen
        curso: '2024-2025'
        convocatoria: primera
      - tipo: examen
        curso: '2023-2024'
        convocatoria: primera
    falta:
      - >-
        No hay cronómetro en la página, así que el reloj lo pones tú. Lo que
        vas resolviendo sí se recuerda, pero solo en este navegador: el sitio
        es estático y no tiene cuentas, así que si cambias de ordenador
        empiezas la cuenta de cero.

  # ─────────────────────────────────────────────────────────────────────
  - id: formulario
    apunte:
      texto: 'no hay formulario: va en la cabeza'
      tono: marco
    titulo: Lo que hay que llevar sabido
    pide: >-
      El examen no deja formulario. Todo lo de aquí hay que llevarlo en la
      cabeza, y una parte se pide escrita literalmente.
    porque: >-
      «Definir formalmente los siguientes conceptos» es un apartado que ha
      caído en 2018-2019, 2019-2020, 2020-2021 y 2022-2023, y no se puede
      deducir: o te lo sabes o no. Lo mismo con las sumas de las series y con
      las identidades complejas. Este bloque existe para el rato de antes de
      entrar, y por eso va el último: es repaso, no aprendizaje.
    invariante:
      anios: 4
      fuente: >-
        Contado sobre los enunciados que empiezan por «definir formalmente» o
        «escribe la definición»: 2018-2019, 2019-2020, 2020-2021 y 2022-2023.
    dominio: >-
      Escribir de memoria y en papel las siete definiciones con sus
      cuantificadores en el orden correcto, y las cuatro sumas de series, sin
      consultar nada. Si tienes que mirar una sola vez, todavía no.
    material:
      - tipo: teoria
        tema: t01-complejos
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          Complejos: las formas, De Moivre y raíces, el conjugado, exponencial
          y logaritmo, y la tabla de las cinco traducciones de lugar
          geométrico.
      - tipo: teoria
        tema: t02-sucesiones
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          Sucesiones: las siete definiciones formales en una tabla, la
          plantilla de la demostración y las cuatro sumas.
    falta:
      - >-
        Las dos listas son una segunda copia de cosas que ya están explicadas
        en los temas, y eso tiene un riesgo: si un día se corrige la teoría y
        no se corrige aquí, esto miente. Se dice en voz alta porque no hay
        ningún guardián que lo compruebe todavía.
      - >-
        No se puede imprimir solo el formulario. Cada uno vive al final de la
        página de su tema, así que imprimir arrastra el tema entero — diecinueve
        folios el de complejos, diez el de sucesiones. Se imprime bien, pero no
        es la hoja suelta que este bloque querría ser.
