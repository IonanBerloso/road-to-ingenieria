# La ruta del segundo parcial de Elasticidad y Resistencia de Materiales, la
# «2.ª parte» de enero, medida sobre las seis que hay en el material desde
# 2016-2017: 2016-2017, 2017-2018, 2018-2019, 2019-2020, 2022-2023 y
# 2025-2026. Son todas las que existen para el sitio. La de 2025-2026 llegó
# en fotos y es también la parte 2 del examen final de ese día.
#
# Las cinco primeras tienen el mismo formato: cuatro cuestiones de teoría de 1
# punto y tres problemas de 2 puntos. La de 2025-2026 trae tres cuestiones
# (1,25, 1,25 y 1,5) y dos problemas (3,5 y 2,5). Todas imprimen los puntos
# junto a cada pregunta, y por eso aquí se cuentan PUNTOS y no solo
# apariciones: son 40 preguntas y 60 puntos, con 37 ejercicios distintos,
# porque el teorema del flujo cortante es la misma cuestión en las cuatro
# primeras. El reparto por hueco, del 22 de octubre de 2026:
#
#   teoremas energéticos (tema 13) ..... 14,5 pts   8 preguntas   en las 6
#   vigas hiperestáticas (tema 11) .....  9,5 pts   5 preguntas   en 3
#   torsión (tema 12) ..................  8,25 pts  7 preguntas   en las 6
#   barras y sólido rígido (tema 8) ....  7,25 pts  4 preguntas   en 4
#   la cuestión de flexión (tema 9) ....  6,5 pts   6 preguntas   en las 6
#   la sección que trabaja (tema 9) ....  6 pts     4 preguntas   en 3
#   flechas y giros (tema 10) ..........  6 pts     4 preguntas   en 3
#   pandeo (tema 14) ...................  2 pts     2 preguntas   en 2
#
# Qué pregunta va a qué hueco es una lectura humana (§10): cada
# `invariante.fuente` la dice pregunta a pregunta, con la T de teoría y la P
# de problema que lleva cada hoja. Las sumas las hizo un guion sobre ese
# reparto y sobre los `puntosImpresos` de cada `examen.yaml`
# (fase-p/p10a/guiones/reparto.mjs), no se hicieron a mano. El problema 1 de
# 2022-2023, el eje colgado de un tirante, cuenta en las vigas hiperestáticas
# porque su `examen.yaml` lo pone en el tema 11; el inventario de la fase P lo
# ponía en el 13.
#
# La de 2016-2017 se transcribió en la entrega p9n y ya está en el sitio, con
# `sinRuta` hasta que entre esta ruta.
#
# Los temas 7 y 8, este curso. En los seis primeros parciales del material,
# de 2016-2017 a 2022-2023, el parcial llegaba al tema 8. Este curso llega al
# 6, como dice la guía docente, y los temas 7 y 8 pasan a la segunda parte y
# a la segunda parte de la final (confirmado el 23 de octubre de 2026). La
# ventana no ve lo que pesaban, porque esas preguntas iban en el parcial;
# solo las barras caían también aquí. En aquellos seis parciales, según la
# cabecera de la ruta del parcial 1:
#
#   · barras y sólido rígido, tema 8: 16 de 60 puntos, en los 6
#   · diagramas de esfuerzos, tema 7: 7 de 60 puntos, en 4
#   · depósitos de pared delgada, tema 8: 2 de 60 puntos, en 2
#
# Esos tres bloques y el escalón del flector positivo vienen de la ruta del
# parcial 1, adaptados: el `invariante` de las barras y de los diagramas
# cuenta las segundas partes y su `fuente` añade lo que pesaban en el
# parcial; los depósitos no llevan `invariante`, porque con cero la página
# diría que están dentro de las seis, y lo cuenta su `porque`. Las notas dicen
# «del primer parcial» donde antes bastaba el año. Lo que pesaban allí no se
# suma a lo de aquí: era otro examen, con otros temas.
asignatura: elasticidad-resistencia
evaluacion: segundo-parcial
titulo: Preparar el segundo parcial, de los diagramas al pandeo
lede: >-
  Lo que cae en la segunda parte de enero, ordenado por lo que puntúa:
  cuarenta preguntas y sesenta puntos contados en seis exámenes. Lo que más
  suma son los teoremas energéticos, con un problema en cada una de las seis.
  Este curso entran además los temas 7 y 8, que iban en el primer parcial:
  los diagramas van al principio y los depósitos, al final.
temas:
  - t07-piezas-prismaticas
  - t08-esfuerzo-axial
  - t09-flexion-tensiones
  - t10-flexion-deformaciones
  - t11-flexion-hiperestatica
  - t12-torsion
  - t13-teoremas-energeticos
  - t14-pandeo
medidoSobre: 6
criterioDeOrden: >-
  Por los puntos que cada hueco ha sumado en las seis segundas partes, de más
  a menos, con dos excepciones que vienen de los temas 7 y 8. El convenio de
  los esfuerzos y los diagramas van delante, aunque la ventana no les dé
  puntos propios, porque las leyes de esfuerzos de cada tramo son el primer
  paso de casi todos los problemas, y este curso el tema 7 entra además en el
  examen. Los depósitos, que la ventana no ve y en el parcial fueron 2 de 60
  puntos, van detrás del pandeo. Las barras, que ya caían en cuatro de las
  seis, van en su sitio por puntos. Los puntos van impresos en cada pregunta,
  así que se cuentan en vez de suponerse. La sección y las flechas empatan a
  seis puntos, y la sección va delante porque cayó en 2022-2023, y las
  flechas no caen desde enero de 2019. Las vigas hiperestáticas usan la tabla
  de vigas del tema 10, que su primer escalón enlaza: no hace falta haber
  hecho antes el bloque de las flechas. Detrás van el simulacro y lo que hay
  que llevar sabido.

bloques:
  - id: suelo
    titulo: El convenio de los esfuerzos, que no da puntos y decide todos los signos
    pide: >-
      Nada por sí mismo: es la regla con la que se da signo al axil, a la
      cortante y al flector de cada tramo, y un signo cambiado arrastra los
      diagramas, la tensión de la sección y la coenergía.
    porque: >-
      No ocupa hueco propio en ninguna de las seis segundas partes, y por eso
      su recuento honesto es cero. Está dentro de casi todos los problemas:
      Castigliano integra los flectores de cada tramo, la sección se
      dimensiona con el flector de cada signo, y seis de las cuarenta
      preguntas piden además los diagramas de cortantes y de flectores. El
      tema 7 tiene además su bloque, el siguiente, porque este curso entra en
      el examen.
    invariante:
      anios: 0
      fuente: >-
        Cero como pregunta propia en las seis segundas partes leídas. Los
        diagramas de cortantes y de flectores los piden seis de las cuarenta
        preguntas, y los de torsores, dos más.
    apunte:
      texto: no puntúa — decide todos los signos
      tono: marco
    dominio: >-
      Escribes el axil, la cortante y el flector de una sección con las
      fuerzas de un lado, justificas el signo de cada uno con el convenio y
      sabes qué fibra tracciona un flector positivo.
    revisado: '2026-10-23'
    escalones:
      - id: el-flector-positivo
        titulo: El flector positivo tracciona la fibra de abajo
        aprendes: >-
          A dar signo a N, T y M con el convenio del curso, la y hacia abajo,
          y a sacarlos de las fuerzas que quedan a un lado de la sección.
        teoria:
          tema: t07-piezas-prismaticas
          apartado: el-convenio-de-signos-del-curso
          nota: >-
            Es el mismo convenio que Mecánica Aplicada, con otra letra para la
            cortante: T en los apuntes, V en las diapositivas.
        ejercicios:
          - id: ejerm7-cu2-el-convenio-de-signos
            nota: >-
              Cuestión 2 de autoevaluación del tema 7: el convenio dibujado en
              las dos caras de un corte, en el plano xy y en el xz, con los seis
              esfuerzos. El ejemplo, un voladizo de 3 m, saca la cortante y el
              flector con las fuerzas de la derecha de la sección.
          - id: ejerm7-cu3-los-procedimientos-a-y-b
            nota: >-
              Cuestión 3 de autoevaluación del tema 7: los procedimientos A y B
              de los apuntes, con sus ecuaciones. El ejemplo, una biapoyada de
              6 m con una fuerza de 12 kN, saca la cortante de una sección por
              un procedimiento y el flector por el otro.
          - id: ejerm7-cl7-4-el-portico-quebrado-con-el-tramo-a-60
            nota: >-
              Ejercicio de clase: una pieza quebrada, con un tramo a 60°. Cada
              tramo lleva sus ejes, que es la costumbre que piden los pórticos
              y las barras quebradas de los teoremas energéticos.
        dominio: >-
          Escribes N, T y M de una sección con las fuerzas de un lado y sabes
          justificar el signo de cada uno sin mirar el convenio.

  - id: diagramas
    titulo: Los diagramas de esfuerzos, que este curso entran en el examen
    pide: >-
      Los diagramas de una viga con rótula, con el flector máximo; o una
      deducción, la rebanada o los esfuerzos de una tensión dada.
    porque: >-
      En las seis segundas partes no ha tenido pregunta propia, porque el tema
      7 iba en el primer parcial, pero seis de las cuarenta preguntas piden
      los diagramas de cortantes y de flectores dentro de otro problema, y dos
      más el de torsores. En los seis parciales de 2016-2017 a 2022-2023 fue
      tres veces el problema 2, siempre una Gerber, y una cuestión en dos
      mitades en 2016-2017: 7 de sus 60 puntos. Este curso entra en la segunda
      parte, y va delante de los huecos medidos porque sus leyes son el primer
      paso de casi todos.
    invariante:
      anios: 0
      fuente: >-
        Cero como pregunta propia en las seis segundas partes leídas: los
        diagramas van dentro de otros problemas, seis veces los de cortantes y
        de flectores y dos los de torsores. En los seis primeros parciales de
        2016-2017 a 2022-2023, donde iba entonces el tema 7, sumó 7 de sus 60
        puntos en cuatro: 2016-2017 (T3, sus dos mitades), 2018-2019
        (P2), 2019-2020 (P2) y 2020-2021 (P2).
    apunte:
      texto: entra este curso — en el primer parcial valía 7 de 60
      tono: neutro
    dominio: >-
      Ante una Gerber empiezas por el tramo que la rótula deja isostático,
      sacas las reacciones y dibujas los dos diagramas con el flector máximo
      donde la cortante se anula.
    revisado: '2026-10-23'
    escalones:
      - id: de-las-tensiones-a-los-esfuerzos
        titulo: De las tensiones a los esfuerzos, integrando en la sección
        aprendes: >-
          A sacar el axil y el flector de una distribución de σx dada,
          integrándola sobre la sección con el convenio del curso.
        teoria:
          tema: t07-piezas-prismaticas
          apartado: de-las-tensiones-a-los-esfuerzos
        ejercicios:
          - id: ejerm7-cu6-de-las-tensiones-a-los-esfuerzos
            nota: >-
              Cuestión 6 de autoevaluación del tema 7: las seis fuerzas y
              momentos de sección escritos con las tensiones, y un ejemplo
              nuestro con σx lineal en un rectángulo de 100 × 200 mm. Entrena
              el axil y el flector de una σx dada antes de la cuestión del
              primer parcial de 2016-2017, que da el flector y pide la
              constante.
          - id: exerm1617-1par-3-la-constante-de-una-tension-cubica
            incrustado: true
            nota: >-
              La mitad a/ de la cuestión 3 del primer parcial de 2016-2017, de
              medio punto: te dan la forma de σx y el flector, y hay que sacar
              la constante.
        dominio: >-
          Escribes la integral del flector de una sección rectangular, la
          resuelves con una franja b·dy y justificas su signo con el
          convenio, sin copiar el de otro libro.
      - id: el-equilibrio-de-la-rebanada
        titulo: El equilibrio de la rebanada, y una carga fuera del eje
        aprendes: >-
          A deducir dN/dx, dT/dx y dM/dx del equilibrio de una rebanada, con
          los esfuerzos positivos dibujados en sus dos caras, y a ver qué
          cambia cuando la carga no va en el eje.
        teoria:
          tema: t07-piezas-prismaticas
          apartado: el-equilibrio-de-la-rebanada
          nota: >-
            La rebanada curva, la de la mitad de los ejercicios del escalón, va
            en el apartado de las
            [piezas de directriz curva](/road-to-ingenieria/elasticidad-resistencia/t07-piezas-prismaticas/#piezas-de-directriz-curva).
        ejercicios:
          - id: ejerm7-la-rebanada-con-la-carga-vertical-arriba
            incrustado: true
            nota: >-
              Nuestro, el peldaño de antes de la mitad b/ de la cuestión del
              primer parcial de 2016-2017: la rebanada recta de una pieza de
              canto 2h con una carga vertical repartida sobre su cara de
              arriba, y un voladizo con números.
          - id: exerm1617-1par-3-la-rebanada-cargada-por-arriba
            incrustado: true
            nota: >-
              La mitad b/ de la cuestión 3 del primer parcial de 2016-2017, de
              medio punto: la misma rebanada recta de canto 2h que el ejemplo
              de delante, pero con la carga repartida horizontal, qx, sobre la
              cara superior.
          - id: exerm1516-1par-3-la-carga-por-metro-de-horizontal-en-una-pieza-curva
            nota: >-
              La mitad a de la cuestión 3 del primer parcial de 2015-2016: una
              carga vertical dada por metro de horizontal sobre una pieza
              curva, y por qué no se puede descomponer tal cual.
          - id: exerm1314-1par-1-la-rebanada-de-directriz-curva
            nota: >-
              La cuestión 1 del primer parcial de 2013-2014: el mismo
              equilibrio, pero de una rebanada de pieza curva, con una carga
              radial y otra tangencial.
          - id: exerm2223-ext-1-la-carga-por-metro-de-horizontal-en-una-pieza-curva
            nota: >-
              La parte d) de la pregunta 1 de la extraordinaria de febrero de
              2023 vuelve a pedir lo de la cuestión del primer parcial de
              2015-2016 de arriba, con otras palabras, y se resuelve con otro
              ejemplo. Su primer paso es el de aquella, y sirve de repaso.
          - id: exerm1718-ext-1-las-ecuaciones-de-la-pieza-curva
            nota: >-
              La cuestión 1 de la extraordinaria de junio de 2018: la misma
              deducción que la del primer parcial de 2013-2014, pedida en una
              línea y sin figura, así que el dibujo y los sentidos los pones
              tú. Se resuelve con otros ejemplos, y sirve de repaso.
          - id: exerm1213-1par-2-el-equilibrio-del-elemento-de-viga
            nota: >-
              La cuestión 2 del primer parcial de 2012-2013: la rebanada de
              pieza recta deducida dos veces, en el caso general y en el
              plano. Su primer paso sale ya en el ejemplo nuestro del
              principio del escalón, y sirve de repaso.
          - id: exerm1920-ord-2-las-ecuaciones-de-equilibrio-de-la-pieza-recta
            nota: >-
              La cuestión 2 de la final de enero de 2020: la misma deducción
              que la del primer parcial de 2012-2013, con otras palabras y 1
              punto, y sirve de repaso. Se resuelve con otro ejemplo, un tramo
              con una carga repartida que crece con x, y se pide su cortante y
              su flector máximo.
        dominio: >-
          Deduces las ecuaciones de la rebanada con su dibujo, dices respecto
          de qué punto tomas momentos y por qué se desprecia el término de
          segundo orden, y sabes qué añade una carga aplicada fuera del eje.
      - id: la-gerber
        titulo: La viga con rótula, y por dónde se empieza
        aprendes: >-
          A sacar las reacciones de una viga con rótula y a dibujar la
          cortante y el flector por tramos.
        teoria:
          tema: t07-piezas-prismaticas
          apartado: cómo-se-dibujan-los-diagramas
        ejercicios:
          - id: ejerm7-la-viga-con-rotula
            incrustado: true
            nota: >-
              El ejemplo del tema: una viga empotrada con una rótula, resuelta
              paso a paso hasta el flector máximo del vano.
          - id: ejerm7-cl7-5-la-viga-con-voladizo-y-un-par-de-20-kn-m
            nota: >-
              Ejercicio de clase sin rótula, en kN y m: una viga apoyada con
              voladizo, dos fuerzas de 8 kN y un par de 20 kN·m. Entrena lo
              que cada carga puntual les hace a los dos diagramas y el flector
              sobre el apoyo del voladizo, que el problema del primer parcial
              de 2020-2021 también tiene, en D.
          - id: ejerm7-cl7-2-el-voladizo-con-carga-trapecial-y-un-par
            nota: >-
              Ejercicio de clase: un voladizo con carga trapecial y un par
              antihorario de q0a² en mitad de la carga. Lo que un par le hace
              a cada diagrama ya sale en el de arriba, y sirve de repaso; lo
              nuevo es la carga que crece. El primer parcial de 2014-2015, más
              abajo, pone un par igual en la rótula.
          - id: ejerm7-cu5-la-carga-lineal
            nota: >-
              Cuestión 5 de autoevaluación del tema 7: las leyes de cortante y
              flector de un tramo recto con carga lineal, escritas en general,
              con la cortante y el flector del extremo izquierdo como datos. El
              ejemplo nuestro busca dónde se anula la cortante y el flector
              máximo, lo que el 7.1 de clase pide después.
          - id: ejerm7-cl7-1-la-carga-triangular-en-media-viga
            nota: >-
              Ejercicio de clase: biapoyada, con A móvil y C fijo, y un solo
              triángulo de carga, en la mitad derecha. Las leyes bajo una
              carga lineal son las de la cuestión 5 de arriba, y sirven de
              repaso; lo nuevo es la viga entera, con sus reacciones y la
              mitad sin carga, como el primer parcial de 2013-2014 que está
              en el bloque de la sección.
          - id: exerm2021-1par-6-la-gerber-empotrada-con-la-rotula-en-c
            nota: >-
              El problema 2 del primer parcial de 2020-2021, de 2 puntos: una
              Gerber empotrada en A, con la rótula en C. Es el nivel que piden
              los problemas de la segunda parte antes de llegar a la sección.
              Su primer paso, por dónde se empieza, es el del ejemplo del tema
              de arriba, y sirve de repaso.
          - id: exerm1617-ord-3-la-viga-que-se-deduce-del-diagrama-de-cortantes
            nota: >-
              La cuestión 3 de la final de enero de 2017, al revés que las
              demás: se da el diagrama de cortantes de una viga apoyada en los
              extremos, sin pares, y hay que reconstruir las cargas y dibujar
              el de flectores.
          - id: exerm1819-1par-6-la-gerber-con-la-rotula-en-e
            nota: >-
              El problema 2 del primer parcial de 2018-2019, con tres apoyos,
              una carga puntual P = q0·a y la rótula en E.
          - id: exerm1415-1par-7-la-gerber-con-un-par-en-la-rotula
            nota: >-
              El problema 3 del primer parcial de 2014-2015: una fuerza y un par
              aplicados justo en la rótula. Su último apartado, el espesor de
              una sección en U, es del tema 9: el del bloque de la sección.
          - id: exerm1920-1par-6-la-gerber-con-el-apoyo-fijo-en-e
            nota: >-
              El problema 2 del primer parcial de 2019-2020, con dos apoyos
              móviles y uno fijo: pide además las tres reacciones y el flector
              máximo.
        dominio: >-
          Dibujas los diagramas de una Gerber con sus valores en los apoyos,
          en la rótula y en el máximo, y compruebas dos cosas: que el flector
          se anula en la rótula y que la cortante salta en cada apoyo lo que
          vale su reacción.
    falta:
      - >-
        El escalón del equilibrio de la rebanada no tiene práctica entre el
        ejemplo y los exámenes. Las cuestiones 4, 7 y 8 de autoevaluación del
        tema 7, que podrían serlo, piden lo mismo que los exámenes que el
        escalón ya tiene.
    antesDeEntrar:
      pasos:
        - >-
          Empieza por la rótula, $M = 0$ en ella, con el tramo que deja una
          sola incógnita.
        - >-
          Por tramos. Sin carga, $T$ constante y $M$ recta; con carga
          uniforme, $T$ recta y $M$ parábola, con el máximo donde $T = 0$.
        - >-
          Al acabar, $M = 0$ en la rótula, y $T$ salta en cada apoyo lo que
          vale su reacción.
      trampa: >-
        En la rótula el flector es cero, pero la cortante no: la rótula
        transmite fuerza.

  - id: energia
    titulo: Los teoremas energéticos, el problema que no ha faltado nunca
    pide: >-
      Un pórtico o una barra quebrada en el espacio, a menudo con un enlace
      de más: la incógnita, un desplazamiento y a veces una tensión. O
      Castigliano, o la reciprocidad.
    porque: >-
      Es el último problema de las seis segundas partes, sin una excepción, y
      en 2019-2020 y 2022-2023 cae además como cuestión. Son ocho de las
      cuarenta preguntas y 14,5 de los 60 puntos, más que ningún otro hueco.
      Desde 2017-2018 el problema es siempre una pieza en el espacio, con
      flexión y torsión a la vez.
    invariante:
      anios: 6
      fuente: >-
        Contado pregunta a pregunta: 2016-2017 (P3), 2017-2018 (P3), 2018-2019
        (P3), 2019-2020 (T2 y P3), 2022-2023 (T3 y P3) y 2025-2026 (P2). Los
        puntos son los impresos junto a cada pregunta.
    apunte:
      texto: cae en las seis — 14,5 de los 60 puntos
      tono: nota
    dominio: >-
      Ante un pórtico o una barra quebrada cuentas las incógnitas que la
      estática no cierra, escribes el flector y el torsor de cada tramo con
      sus propios ejes, y sabes qué condición cierra cada incógnita cuando lo
      que sujeta el punto es un apoyo, un muelle o un tirante.
    revisado: '2026-10-23'
    escalones:
      - id: la-reciprocidad
        titulo: Los teoremas de reciprocidad, la cuestión de un punto
        aprendes: >-
          A enunciar y deducir el teorema de reciprocidad de los trabajos y el
          de los desplazamientos, como los pide la cuestión.
        teoria:
          tema: t13-teoremas-energeticos
          apartado: los-teoremas-de-reciprocidad
        ejercicios:
          - id: exerm2223-2par-3-el-teorema-de-reciprocidad
            nota: >-
              La cuestión 3 de la segunda parte de enero de 2023, de 1 punto:
              los dos teoremas con su deducción.
        dominio: >-
          Escribes los dos enunciados y la deducción de memoria, y en un
          ejemplo de dos cargas dices qué desplazamiento es igual a cuál.
      - id: castigliano-y-la-fuerza-unidad
        titulo: Engesser-Castigliano y la fuerza unidad
        aprendes: >-
          A enunciar y demostrar el teorema, y a sacar con él el
          desplazamiento de un punto de una estructura isostática de varios
          tramos.
        teoria:
          tema: t13-teoremas-energeticos
          apartado: la-fuerza-unitaria
          nota: >-
            El teorema que lo justifica está en el apartado de
            [Castigliano y Engesser-Castigliano](/road-to-ingenieria/elasticidad-resistencia/t13-teoremas-energeticos/#castigliano-y-engesser-castigliano),
            y la cuestión de 2019-2020 pide los dos.
        ejercicios:
          - id: exerm1920-2par-2-engesser-castigliano-y-la-carga-unitaria
            nota: >-
              La cuestión 2 de la segunda parte de enero de 2020, de 1 punto:
              el teorema y el método, sin una estructura que calcular.
          - id: exerm2021-ord-6-la-canasta-de-baloncesto
            nota: >-
              De la final de enero de 2021, de 1,5 puntos. Es isostático, así
              que entrena el desplazamiento sin la incógnita de más, y es el
              único de este bloque que manda contar también la energía de la
              cortante.
        dominio: >-
          Sacas el desplazamiento de un punto de una estructura isostática de
          dos tramos con la fuerza unidad, sin olvidar ningún término de los
          que pide el enunciado.
      - id: la-incognita-de-mas
        titulo: La incógnita de más en un pórtico plano
        aprendes: >-
          A quitar el enlace que sobra, dejar su fuerza como incógnita y cerrar
          el problema con la derivada de la coenergía, también con un muelle o
          una barra dentro.
        teoria:
          tema: t13-teoremas-energeticos
          apartado: hiperestáticos-la-incógnita-y-lo-que-hacía
        ejercicios:
          - id: ejerm13-el-portico-con-un-muelle
            incrustado: true
            nota: >-
              El ejemplo del tema: un pórtico en L con un muelle bajo la punta,
              con la incógnita ya elegida en el enunciado.
          - id: exerm1617-2par-7-el-portico-con-rotula-en-c
            nota: >-
              El problema 3 de la segunda parte de enero de 2017: un pórtico de
              tres barras con una rótula, sin muelle. Pide además el giro de un
              apoyo.
          - id: exerm1617-ext-8-el-portico-atado-por-la-barra-bf
            nota: >-
              De la extraordinaria de 2016-2017: un pórtico atado por una barra
              entre sus dos apoyos. El enunciado manda contar la energía de
              flexión del pórtico y la axial de la barra.
          - id: exerm1819-ext-8-el-portico-abcd-articulado-en-a-y-en-d
            nota: >-
              De la extraordinaria de 2018-2019: un pórtico con dos apoyos
              fijos a distinta altura. Pide las reacciones y el giro de un
              nudo.
          - id: exerm1920-ext-8-el-portico-abcd-y-el-pilar-fc
            nota: >-
              De la extraordinaria de 2019-2020: un pórtico unido por una
              articulación a un pilar empotrado. Pide una reacción y un
              desplazamiento.
        dominio: >-
          Eliges la incógnita de un pórtico con una rótula, un apoyo de más o
          una barra que lo ata, escribes la condición que la cierra y sacas con
          ella un giro o un desplazamiento.
      - id: la-barra-quebrada-en-el-espacio
        titulo: La barra quebrada en el espacio
        aprendes: >-
          A escribir el flector y el torsor de cada tramo de una pieza con
          tramos perpendiculares, cada uno en sus ejes, y a llevarlos a la
          coenergía con la incógnita de un apoyo, un muelle, un tirante o una
          barra.
        teoria:
          tema: t13-teoremas-energeticos
          apartado: barras-quebradas-en-el-espacio
          nota: >-
            Es el problema de las cinco últimas segundas partes. El apartado lo
            resuelve en una figura, con dos tramos y una carga.
        ejercicios:
          - id: exerm1718-2par-7-la-estructura-espacial-de-seccion-rectangular-hueca
            nota: >-
              El problema 3 de la segunda parte de enero de 2018, isostático:
              pide un desplazamiento y una tensión máxima, y es el peldaño de
              entrada.
          - id: exerm1617-ext-3-la-fuerza-que-deja-quieto-el-punto-c
            nota: >-
              De la extraordinaria de 2016-2017, también isostática: la fuerza
              que deja quieto un punto, con un par aplicado en otro tramo.
          - id: exerm1920-2par-7-la-estructura-espacial-con-un-par-en-d
            nota: >-
              El problema 3 de la segunda parte de enero de 2020: cinco tramos,
              un apoyo en un extremo y un par. El enunciado manda contar la
              energía de flexión y la de torsión.
          - id: exerm1819-2par-7-la-barra-quebrada-con-el-apoyo-en-c
            nota: >-
              El problema 3 de la segunda parte de enero de 2019: dos tramos,
              empotrada en un extremo y apoyada en el otro. Además de la
              reacción pide los esfuerzos del empotramiento y una tensión
              tangencial máxima. La reacción se cierra como la del apoyo de
              arriba, y sirve de repaso.
          - id: exerm2223-2par-7-la-barra-quebrada-con-un-muelle
            nota: >-
              El problema 3 de la segunda parte de enero de 2023: una barra
              quebrada apoyada en un muelle. Pide la fuerza del muelle, lo que
              se deforma y un desplazamiento.
          - id: exerm1718-ext-8-la-estructura-espacial-con-la-barra-fd
            nota: >-
              De la extraordinaria de 2017-2018: una estructura espacial con
              una barra que la sujeta y dos cargas repartidas.
          - id: exerm2223-ext-5-la-barra-quebrada-con-un-tirante
            nota: >-
              De la extraordinaria de 2022-2023: una barra quebrada empotrada,
              con una carga repartida en un tramo y un tirante en el extremo.
              Pide el axil del tirante y el descenso de un punto.
          - id: exerm2122-ext-7-la-barra-oab-con-el-tirante-bc
            nota: >-
              De la extraordinaria de 2021-2022: un tramo circular y otro
              rectangular con un tirante, y la carga admisible por Von Mises,
              del tema 6.
          - id: exerm2021-ext-8-la-estructura-abcde-con-la-barra-fd
            nota: >-
              De la extraordinaria de 2020-2021: una estructura de sección
              circular sujeta por una barra. Pide su axil y un desplazamiento.
          - id: exerm2526-2par-5-la-barra-quebrada-con-un-resorte-en-b
            nota: >-
              El problema 2 de la segunda parte de enero de 2026, de 2,5
              puntos y el más reciente: dos tramos, un resorte y una fuerza
              oblicua. Su primer paso es el de los de arriba con un resorte, y
              sirve de repaso.
        dominio: >-
          Ante una barra quebrada con un apoyo, un muelle o un tirante,
          escribes el flector y el torsor de cada tramo con sus ejes, cierras
          la incógnita y das el desplazamiento que piden sin mirar la
          resolución.
    falta:
      - >-
        Los siete ejercicios de clase del tema 13 (13.1 a 13.7) y sus
        cuestiones de autoevaluación no están en el sitio. El tema tiene un
        solo ejemplo, el pórtico con un muelle, así que los escalones suben de
        la teoría o de ese ejemplo a los problemas de examen.
      - >-
        La barra quebrada en el espacio no tiene un ejemplo propio del tema.
        El apartado la resuelve en una figura, y su escalón empieza en un
        problema de examen isostático.
    antesDeEntrar:
      pasos:
        - >-
          Cuenta las incógnitas contra tres ecuaciones en el plano o seis en
          el espacio, más una por rótula.
        - >-
          Cada tramo con sus ejes. Un mismo momento es flector en un tramo y
          torsor en el siguiente, que entra con $GI_t$.
        - >-
          Para un desplazamiento, la fuerza unidad va en la estructura
          isostática, en el punto y en la dirección que piden.
      trampa: >-
        Un muelle o un tirante también guardan energía, $X^2/2k$ o $X^2L/2EA$,
        y entra en la coenergía. Olvidarlo es suponer el apoyo rígido.

  - id: hiperestatica
    titulo: Las vigas hiperestáticas, con la pregunta que más vale
    pide: >-
      Una viga con un enlace de más, a menudo con un muelle, un voladizo o
      una segunda viga: la incógnita, los diagramas y a veces la sección. O
      los tres momentos, o dos vigas cruzadas.
    porque: >-
      Ha caído en tres de las seis, y son las tres últimas: 2019-2020 y
      2022-2023, con una cuestión y un problema cada una, y 2025-2026, con el
      problema de 3,5 puntos, la pregunta que más vale de toda la ventana. Son
      cinco preguntas y 9,5 de los 60 puntos. En las tres primeras no cayó
      ninguna.
    invariante:
      anios: 3
      fuente: >-
        Contado pregunta a pregunta: 2019-2020 (T4 y P1), 2022-2023 (T2 y P1)
        y 2025-2026 (P1). Los puntos son los impresos junto a cada pregunta.
    apunte:
      texto: las tres últimas — y la pregunta de 3,5 puntos
      tono: nota
    dominio: >-
      Ante una viga con un enlace de más quitas uno, escribes lo que el enlace
      no dejaba hacer con la tabla de vigas o con los tres momentos, y de la
      incógnita sacas los diagramas.
    revisado: '2026-10-23'
    escalones:
      - id: quitar-un-enlace
        titulo: Quitar un enlace y pedir lo que hacía
        aprendes: >-
          A elegir el enlace que sobra, sustituirlo por su fuerza y escribir la
          condición que cumplía, con las flechas y los giros de la tabla de
          vigas del tema 10.
        teoria:
          tema: t11-flexion-hiperestatica
          apartado: un-solo-tramo-quitar-un-enlace-y-pedir-lo-que-hacía
          nota: >-
            Las flechas y los giros salen de la
            [tabla de vigas elementales del tema 10](/road-to-ingenieria/elasticidad-resistencia/t10-flexion-deformaciones/#integrar-la-ecuación-tramo-a-tramo),
            que el apartado enlaza: no hace falta haber hecho antes el bloque
            de las flechas.
        ejercicios:
          - id: ejerm11-la-viga-empotrada-y-apoyada
            incrustado: true
            nota: >-
              El ejemplo del tema: una viga empotrada y apoyada con una carga
              uniforme, de la reacción al flector máximo del vano.
          - id: exerm1819-ext-7-la-viga-empotrada-con-el-apoyo-que-desciende
            nota: >-
              De la extraordinaria de 2018-2019: una viga empotrada con un
              apoyo que desciende. Pide su reacción.
          - id: exerm2021-ord-7-la-viga-con-dos-rotulas
            nota: >-
              De la final de enero de 2021: empotrada en los dos extremos, con
              dos rótulas y un apoyo entre ellas. Pide además una flecha y los
              dos giros de una rótula.
          - id: exerm1920-2par-5-la-viga-empotrada-sobre-un-resorte
            nota: >-
              El problema 1 de la segunda parte de enero de 2020: la viga
              apoya en un muelle, y el problema sigue hasta los diagramas y la
              longitud que da la tensión máxima, del tema 9.
          - id: exerm1617-ext-6-la-viga-empotrada-con-rotula-en-c
            nota: >-
              De la extraordinaria de 2016-2017: una viga con una rótula y tres
              apoyos. Pide los diagramas, los giros a los dos lados de la
              rótula y un desplazamiento.
          - id: exerm2021-ext-7-la-viga-unida-a-un-muelle
            nota: >-
              De la extraordinaria de 2020-2021: un voladizo que hay que forzar
              para unirlo a un muelle, y la constante del muelle que iguala las
              compresiones de las dos alas.
        dominio: >-
          Ante una viga con un apoyo, un muelle o una rótula de más dices
          cuántas incógnitas sobran, eliges cuál quitar y escribes su
          condición antes de calcular nada.
      - id: los-tres-momentos
        titulo: Los tres momentos, en una viga continua
        aprendes: >-
          A deducir la ecuación de los tres momentos y a aplicarla a una viga
          continua con voladizo, empotramiento o muelle, y de los momentos de
          los apoyos sacar las reacciones y los diagramas.
        teoria:
          tema: t11-flexion-hiperestatica
          apartado: vigas-continuas-el-teorema-de-los-tres-momentos
          nota: >-
            El apartado trae un ejemplo de dos vanos resuelto.
        ejercicios:
          - id: exerm1920-2par-4-la-ecuacion-de-los-tres-momentos
            nota: >-
              La cuestión 4 de la segunda parte de enero de 2020, de 1 punto:
              la deducción.
          - id: exerm1718-ext-2-la-ecuacion-de-los-tres-momentos
            nota: >-
              De la extraordinaria de 2017-2018: casi la misma cuestión,
              resuelta con otro ejemplo, una viga empotrada en un extremo. La
              deducción es la de arriba, y sirve de repaso.
          - id: exerm2526-2par-4-la-viga-continua-y-la-seccion-en-pi
            nota: >-
              El problema 1 de la segunda parte de enero de 2026, de 3,5
              puntos, la pregunta que más ha valido en la ventana. La hoja
              imprime la ecuación de los tres momentos, y el problema acaba en
              el espesor de una sección en π, del tema 9.
          - id: exerm1920-ext-6-la-viga-continua-y-la-seccion-en-u
            nota: >-
              De la extraordinaria de 2019-2020. El enunciado pide resolver la
              viga continua por
              [funciones de singularidad](/road-to-ingenieria/elasticidad-resistencia/t10-flexion-deformaciones/#funciones-de-singularidad-una-sola-ley-para-toda-la-viga),
              del tema 10, y no por los tres momentos. Acaba en el espesor de
              una sección en U.
          - id: exerm2122-ext-6-la-viga-continua-con-un-resorte-en-b
            nota: >-
              De la extraordinaria de 2021-2022: los tres momentos con un
              voladizo, un empotramiento y un resorte. Pide además un
              desplazamiento.
        dominio: >-
          Escribes la ecuación de los tres momentos de memoria, con cada
          distancia en su sitio, y la aplicas a una viga con voladizo y
          empotramiento hasta los diagramas.
      - id: dos-piezas-que-se-pasan-una-fuerza
        titulo: Dos piezas que se pasan una fuerza
        aprendes: >-
          A resolver dos vigas que se apoyan una en otra, o una pieza colgada
          de una barra, con la fuerza que se pasan como incógnita.
        teoria:
          tema: t11-flexion-hiperestatica
          apartado: vigas-continuas-el-teorema-de-los-tres-momentos
          nota: >-
            Son las dos familias del último párrafo del apartado, después del
            ejemplo de dos vanos.
        ejercicios:
          - id: exerm2223-2par-2-las-vigas-cruzadas
            nota: >-
              La cuestión 2 de la segunda parte de enero de 2023, de 1 punto:
              dos vigas cruzadas, una apoyada en la otra.
          - id: exerm2223-2par-5-el-eje-y-el-tirante
            nota: >-
              El problema 1 de la segunda parte de enero de 2023, y el último
              del bloque porque junta herramientas de varios temas: si alguna
              no la tienes todavía, déjalo para el final de la ruta.
        dominio: >-
          Ante dos piezas que se tocan en un punto escribes la fuerza que se
          pasan y la condición que la cierra, con lo que se mueve cada una
          sacado de su tabla.
    falta:
      - >-
        Los ejercicios de clase del tema 11 (11.1 a 11.6) y sus cuestiones de
        autoevaluación no están en el sitio. El primer escalón sube del único
        ejemplo del tema a los problemas de examen, y los otros dos empiezan
        en ejercicios de examen.
    antesDeEntrar:
      pasos:
        - >-
          Cuenta las reacciones contra las ecuaciones, más una por rótula. Lo
          que sobra son las incógnitas.
        - >-
          Quita un enlace y pide lo que hacía. Flecha nula en un apoyo, o la
          que asienta; $X/k$ en un muelle; giro nulo en un empotramiento.
        - >-
          En una viga continua, los tres momentos. Un voladizo da un momento
          conocido, y un empotramiento, un vano ficticio de inercia infinita.
      trampa: >-
        Un apoyo fija la flecha, no el giro. Escribir $\theta = 0$ en un apoyo
        es tratarlo como un empotramiento.

  - id: torsion
    titulo: La torsión, una pregunta en cada segunda parte
    pide: >-
      Casi siempre una cuestión: la sección circular, la cerrada de pared
      delgada o un tubo. Dos veces, un eje empotrado en los dos extremos o
      sujeto por un disco y dos barras.
    porque: >-
      Cae en las seis, y en 2016-2017 dos veces: siete preguntas y 8,25 de los
      60 puntos. Seis de las siete son cuestiones de un punto o poco más, y la
      sección cerrada de pared delgada ha caído cuatro veces.
    invariante:
      anios: 6
      fuente: >-
        Contado pregunta a pregunta: 2016-2017 (T3 y P2), 2017-2018 (T2),
        2018-2019 (T1), 2019-2020 (T3), 2022-2023 (T4) y 2025-2026 (T1). Los
        puntos son los impresos junto a cada pregunta.
    apunte:
      texto: cae en las seis — cuatro veces la sección cerrada
      tono: nota
    dominio: >-
      Deduces la tensión y el giro de la sección circular y de la cerrada de
      pared delgada sin mirar, y resuelves un eje empotrado en los dos
      extremos con su diagrama de torsores y de giros.
    revisado: '2026-10-23'
    escalones:
      - id: la-seccion-circular
        titulo: La sección circular, de la hipótesis al giro
        aprendes: >-
          A deducir la tensión tangencial y el ángulo de torsión de una sección
          circular, maciza o hueca, desde la hipótesis de partida.
        teoria:
          tema: t12-torsion
          apartado: la-sección-circular
        ejercicios:
          - id: exerm1819-2par-1-la-torsion-de-la-seccion-circular
            nota: >-
              La cuestión 1 de la segunda parte de enero de 2019, de 1 punto:
              la teoría entera, con un ejemplo nuestro de un eje macizo.
          - id: exerm1617-ext-2-la-torsion-de-piezas-prismaticas-circulares
            nota: >-
              De la extraordinaria de 2016-2017: casi la misma cuestión,
              resuelta con otro ejemplo, un tubo. La deducción es la de arriba,
              y sirve de repaso.
        dominio: >-
          Escribes la tensión en función del radio y el giro de un tramo con su
          signo, y dices qué cambia si el eje es un tubo.
      - id: el-eje-que-el-equilibrio-no-resuelve
        titulo: El eje que el equilibrio no resuelve
        aprendes: >-
          A repartir un par entre los dos extremos de un eje con la condición
          de giro que falta, y a dibujar sus diagramas de torsores y de giros.
        teoria:
          tema: t12-torsion
          apartado: el-giro-y-los-ejes-que-el-equilibrio-no-resuelve
        ejercicios:
          - id: ejerm12-el-eje-de-dos-diametros
            incrustado: true
            nota: >-
              El ejemplo del tema: un eje de dos diámetros entre dos paredes,
              con un par en el cambio de sección.
          - id: exerm1718-ext-7-el-eje-escalonado-con-flexion-y-torsion
            nota: >-
              De la extraordinaria de 2017-2018: un eje escalonado con una
              carga excéntrica, que pide también los diagramas de cortantes y
              de flectores.
          - id: exerm1617-2par-6-el-eje-biempotrado-con-un-par-repartido-y-otro-concentrado
            nota: >-
              El problema 2 de la segunda parte de enero de 2017: un eje
              empotrado en los dos extremos, con un par repartido y otro
              concentrado. Pide el diámetro y el diagrama de giros.
          - id: exerm2526-2par-1-el-eje-con-un-disco-y-dos-barras
            nota: >-
              La cuestión 1 de la segunda parte de enero de 2026, de 1,25
              puntos: un eje con un disco sujeto por dos barras, el caso del
              último párrafo del apartado.
          - id: exerm2223-ext-7-el-eje-con-palancas-y-tirantes
            nota: >-
              De la extraordinaria de 2022-2023: palancas y tirantes en los
              extremos, y dos galgas, del tema 3, en uno de ellos.
          - id: exerm2021-ext-6-el-eje-biempotrado-con-un-torsor-repartido
            nota: >-
              De la extraordinaria de 2020-2021: empotrado en los dos extremos,
              con un torsor repartido y un par. Acaba en el diámetro y en un eje
              anular.
          - id: exerm2122-ext-8-el-eje-abc-con-la-barra-de-y-dos-tirantes
            nota: >-
              De la extraordinaria de 2021-2022: un eje de dos secciones, tubo
              cuadrado y redondo macizo, con el extremo soldado a una barra
              rígida sobre dos tirantes.
        dominio: >-
          Resuelves un eje con un enlace de más con la condición de giro que
          falta, y dibujas sus diagramas de torsores y de giros con su signo.
      - id: la-seccion-cerrada
        titulo: La sección cerrada de pared delgada
        aprendes: >-
          A deducir la tensión y el giro de una sección cerrada de pared
          delgada, a usarlos para dimensionar un tubo y a compararla con una
          sección abierta.
        teoria:
          tema: t12-torsion
          apartado: secciones-cerradas-de-pequeño-espesor
          nota: >-
            Léelo junto con el de antes, el de las
            [secciones abiertas de pequeño espesor](/road-to-ingenieria/elasticidad-resistencia/t12-torsion/#secciones-abiertas-de-pequeño-espesor):
            el tema compara las dos.
        ejercicios:
          - id: exerm2223-2par-4-la-tension-tangencial-en-una-seccion-cerrada
            nota: >-
              La cuestión 4 de la segunda parte de enero de 2023, de 1 punto:
              la tensión tangencial, deducida.
          - id: exerm1617-2par-3-la-torsion-de-los-perfiles-cerrados-de-pequeno-espesor
            nota: >-
              La cuestión 3 de la segunda parte de enero de 2017: la tensión y
              el ángulo, con un ejemplo nuestro de paredes de espesor
              distinto. La tensión es la de arriba, y sirve de repaso.
          - id: exerm1920-ext-3-la-torsion-de-la-seccion-cerrada
            nota: >-
              De la extraordinaria de 2019-2020: casi la misma cuestión que la
              de 2017, resuelta con otro ejemplo. La deducción, la tensión y el
              ángulo, es la de arriba, y sirve de repaso.
          - id: exerm1920-2par-3-el-tubo-rectangular-en-lugar-de-la-barra-maciza
            nota: >-
              La cuestión 3 de la segunda parte de enero de 2020: un tubo
              rectangular que sustituye a una barra maciza. Pide el espesor
              mínimo, y su primer paso vuelve sobre el área de la fórmula:
              sirve de repaso.
          - id: exerm1718-2par-2-la-torsion-de-las-secciones-cerradas-de-pequeno-espesor
            nota: >-
              La cuestión 2 de la segunda parte de enero de 2018: la teoría
              otra vez, con otras palabras y un ejemplo nuestro distinto. Sirve
              de repaso.
          - id: exerm1819-ext-4-el-torsor-maximo-del-tubo-cuadrado
            nota: >-
              De la extraordinaria de 2018-2019: un tubo cuadrado en voladizo,
              y el torsor máximo por resistencia, con un criterio del tema 6, y
              por giro. Su primer paso vuelve sobre el área de la fórmula, y
              sirve de repaso.
          - id: exerm2021-ord-1-dos-triangulos-a-torsion
            nota: >-
              De la final de enero de 2021: dos triángulos de pared delgada con
              el mismo par, uno de ellos con una ranura.
        dominio: >-
          Deduces la tensión y el giro de una sección cerrada, dices qué área
          entra en la fórmula en cualquier tubo y dimensionas su espesor.
    falta:
      - >-
        Los ejercicios de clase del tema 12 (12.1 a 12.8) y sus cuestiones de
        autoevaluación no están en el sitio. El segundo escalón sube del
        ejemplo del tema al examen, y el primero y el tercero empiezan en
        cuestiones de examen.
    antesDeEntrar:
      pasos:
        - >-
          Circular, de la hipótesis de Coulomb, $\tau = M_tr/I_p$ y
          $\varphi = M_tL/GI_p$. Un tubo solo cambia $I_p$.
        - >-
          Cerrada de pared delgada, el producto $\tau t$ es constante y
          $\tau = M_t/2A_tt$, con $A_t$ el área que encierra la línea media.
        - >-
          Eje con dos empotramientos. El equilibrio da una ecuación, y la otra
          es el giro relativo nulo entre los extremos.
      trampa: >-
        $A_t$ no es el área de material: es la que encierra la línea media de
        la pared, con el hueco dentro.

  - id: barras
    titulo: Barras y sólido rígido, el tema 8 que este curso entra entero
    pide: >-
      Una pieza rígida sujeta por barras, a veces con una calentada, una
      holgura, un resorte o un error de montaje: los axiles y un
      desplazamiento.
    porque: >-
      Cae en cuatro de las seis, siempre como problema de 2 puntos salvo en
      2025-2026, que es una cuestión de 1,25: cuatro preguntas y 7,25 de los
      60 puntos. De 2016-2017 a 2022-2023 el tema 8 era también del primer
      parcial, donde fue el último problema de los seis y sumó 16 de sus 60
      puntos. Este curso solo entra aquí, y por eso la
      escalera es la larga, de la barra que no puede alargarse a la pieza
      rígida con temperatura y holguras.
    invariante:
      anios: 4
      fuente: >-
        Contado pregunta a pregunta: 2017-2018 (P1), 2018-2019 (P1), 2019-2020
        (P2) y 2025-2026 (T2). Los puntos son los impresos junto a cada
        pregunta. En los seis primeros parciales de 2016-2017 a 2022-2023,
        donde iba entonces el tema 8, cayó en los seis, con 16 de sus 60
        puntos.
    apunte:
      texto: en cuatro de las seis — 7,25 de los 60 puntos
      tono: nota
    dominio: >-
      Ante una pieza rígida con dos, tres o cuatro barras cuentas las
      incógnitas que la estática no cierra, las supones todas a tracción,
      escribes la compatibilidad con el giro pequeño y la resuelves con la
      temperatura o la holgura dentro, dejando que el signo diga cuál está
      comprimida.
    revisado: '2026-10-23'
    escalones:
      - id: la-barra-que-no-puede-alargarse
        titulo: El alargamiento, y una barra que no puede alargarse
        aprendes: >-
          A escribir el alargamiento de una barra con su término térmico y a
          sacar la tensión de una barra sujeta por sus dos extremos cuando
          cambia su temperatura.
        teoria:
          tema: t08-esfuerzo-axial
          apartado: el-alargamiento
        ejercicios:
          - id: ejerm8-la-barra-entre-dos-paredes
            incrustado: true
            nota: >-
              Nuestro, el peldaño de antes del alambre: una barra montada sin
              tensión entre dos paredes, que se calienta y se enfría.
          - id: ejerm8-cu1-la-hipotesis-de-bernoulli
            nota: >-
              Cuestión 1 de autoevaluación del tema 8: la hipótesis de las
              secciones planas y lo que se sigue de ella, con una barra
              nuestra libre, traccionada y calentada a la vez.
          - id: ejerm8-el-carril-soldado-sin-juntas
            nota: >-
              Nuestro, de práctica: un carril de ferrocarril soldado sin
              tensión a 20 °C y sujeto a las traviesas, en una noche de
              invierno y al sol del verano. Pide la tensión a una temperatura
              dada y, en dos apartados, la temperatura a la que el carril llega
              a cada tensión admisible.
          - id: exerm1617-1par-2-el-alambre-pretensado-que-se-enfria
            incrustado: true
            nota: >-
              La cuestión 2 del primer parcial de 2016-2017. El enunciado llama
              rígido al alambre: mira bien qué es lo rígido antes de decidir
              qué le pasa a su tensión.
        dominio: >-
          Sacas la tensión de una barra sujeta por los dos extremos a
          cualquier temperatura, y dices antes de calcular si al enfriarla se
          tensa o se afloja.
      - id: dos-barras-que-comparten-la-carga
        titulo: Dos barras que comparten la carga
        aprendes: >-
          A repartir una carga entre dos barras que la sostienen juntas, el
          caso más corto de los problemas de barras.
        teoria:
          tema: t08-esfuerzo-axial
          apartado: isostático-o-hiperestático
        ejercicios:
          - id: ejerm8-la-varilla-y-el-tubo-que-cuelgan-juntos
            incrustado: true
            nota: >-
              Nuestro: dos piezas de distinto material que cuelgan del techo y
              sostienen la misma placa.
          - id: ejerm8-la-barra-larga-y-la-corta
            nota: >-
              Nuestro, de práctica: dos barras del mismo acero y la misma
              sección, una colgada del techo y otra de una ménsula más baja,
              unidas abajo por el mismo pasador. Frente a la varilla y el tubo,
              lo que cambia entre las dos es la longitud.
          - id: ejerm8-cla5-las-cinco-barras-en-cometa
            nota: >-
              La propuesta A5 de clase: cinco barras del mismo material y
              sección en cometa, con dos apoyos fijos y la carga en D. Justo
              debajo, el primer parcial de 2014-2015 une cinco barras igual,
              pero con los dos nudos por encima de los apoyos y un apoyo
              móvil. En los dos, antes de escribir ninguna compatibilidad,
              cuenta incógnitas y ecuaciones.
          - id: exerm1415-1par-6-la-estructura-de-cinco-barras-con-p-en-c
            nota: >-
              El problema 2 del primer parcial de 2014-2015: cinco barras, un
              apoyo móvil y los datos del material en el enunciado.
          - id: exerm1819-1par-4-dos-cables-y-un-peso
            incrustado: true
            nota: >-
              La cuestión 4 del primer parcial de 2018-2019: dos cables de
              distinto material que sostienen un peso. Es un punto que se gana
              en pocos minutos.
          - id: exerm2021-ext-2-la-barra-circular-entre-dos-apoyos
            nota: >-
              La cuestión 2 de la extraordinaria de febrero de 2021: una barra
              de sección circular con un voladizo y dos apoyos, una carga P en
              el extremo libre y otra 4P entre los apoyos, y el diámetro para
              no pasar de una tensión admisible.
          - id: exerm2021-ord-2-la-barra-rigida-y-los-dos-cables
            nota: >-
              La cuestión 2 de la final de enero de 2021: una barra rígida
              colgada de dos cables del mismo diámetro y distinto módulo.
              Frente a los dos cables del primer parcial de 2018-2019, la
              pregunta va al revés: no cuánto lleva cada cable, sino dónde
              poner la carga para que A y B bajen lo mismo.
          - id: exerm1213-1par-5-las-cuatro-barras-iguales-con-p-en-c
            nota: >-
              El problema 2 del primer parcial de 2012-2013: cuatro barras
              iguales y la fuerza en C. Además de los esfuerzos, pide cuánto
              se mueve C. Es el 8.5 de clase.
        dominio: >-
          Dices de un vistazo si un sistema de barras es hiperestático y
          escribes la ecuación que falta antes de calcular nada.
      - id: la-pieza-rigida
        titulo: La pieza rígida colgada
        aprendes: >-
          A contar las incógnitas de una pieza rígida sujeta por barras y a
          escribir cuánto se alarga cada barra cuando la pieza gira un ángulo
          pequeño.
        teoria:
          tema: t08-esfuerzo-axial
          apartado: el-sólido-rígido-y-sus-barras
        ejercicios:
          - id: ejerm8-la-barra-rigida-colgada
            incrustado: true
            nota: >-
              El ejemplo del tema: una barra rígida articulada y colgada de dos
              barras.
          - id: ejerm8-cla6-la-pieza-en-l-y-la-barra-a-45
            nota: >-
              La propuesta A6 de clase: una pieza en L colgada de un punto, con
              una barra vertical y otra a 45°.
          - id: ejerm8-cla3-la-celosia-rigida-y-las-dos-barras
            nota: >-
              La propuesta A3 de clase: una celosía rígida, articulada en A y
              colgada de dos barras del mismo material y sección que salen del
              mismo punto de la pared. Frente a la A6, las dos barras van
              inclinadas. La figura no numera las barras ni da el canto: la
              nota del enunciado dice cómo se leen.
          - id: ejerm8-cla1-el-nudo-de-dos-barras-en-la-pared
            nota: >-
              La propuesta A1 de clase: un nudo colgado de la pared por dos
              barras, isostático. Lo que entrena es el camino de vuelta, del
              alargamiento de cada barra al desplazamiento del nudo.
          - id: ejerm8-caballete-el-tirante-y-el-desplazamiento-de-b
            nota: >-
              El ejemplo resuelto del caballete, del curso: dos patas rígidas
              articuladas en C, un tirante cuyo alargamiento se da y la
              pregunta de cuánto se va el apoyo móvil. No hay estática que
              hacer, solo el movimiento de las piezas.
          - id: exerm1718-1par-7-la-barra-rigida-y-el-tirante
            nota: >-
              El problema 3 del primer parcial de 2017-2018, isostático: el
              tirante sale de los momentos en A, y lo que se pide es cuánto se
              mueve B. La figura no lleva cotas: salen de los ángulos.
          - id: exerm1920-1par-7-la-pieza-en-escalon-colgada-de-dos-barras
            nota: >-
              El problema 3 del primer parcial de 2019-2020: una pieza en
              escalón colgada de dos barras. Pide además los dos
              desplazamientos de un punto de la pieza, el horizontal y el
              vertical.
          - id: exerm1819-1par-7-ab-rigida-con-dos-barras
            nota: >-
              El problema 3 del primer parcial de 2018-2019: las dos barras
              tienen distinto módulo, así que el reparto no lo decide solo el
              brazo de cada una.
          - id: exerm1819-2par-5-la-viga-rigida-y-las-cuatro-barras
            nota: >-
              El problema 1 de la segunda parte de enero de 2019, que el mismo
              día fue el 2 de la final: una viga rígida sin articular, colgada
              del techo por dos barras verticales y por dos inclinadas que
              llegan al mismo extremo. Además de las fuerzas pide cuánto se
              mueve en horizontal, y la altura del techo no está acotada: sale
              de los ángulos de la figura.
          - id: exerm1516-1par-3-el-proceso-de-deformacion-de-una-barra
            nota: >-
              La mitad b de la cuestión 3 del primer parcial de 2015-2016: cómo
              se deforma una barra de una estructura articulada, en los cuatro
              pasos de los apuntes, lo que el caballete de arriba hace con dos
              patas.
          - id: exerm2021-1par-7-dos-piezas-rigidas-y-tres-barras
            nota: >-
              El problema 3 del primer parcial de 2020-2021: dos piezas rígidas
              unidas por tres barras, la carga máxima con una tensión
              admisible y, al final, la barra 3 calentada sin carga.
          - id: exerm2223-ext-1-el-proceso-de-deformacion-de-una-barra
            nota: >-
              La cuestión del primer parcial de 2015-2016 de arriba, casi con
              las mismas palabras, en la parte e) de la pregunta 1 de la
              extraordinaria de febrero de 2023, con otro ejemplo. Su primer
              paso es el de aquella, y sirve de repaso.
          - id: exerm1617-1par-7-la-barra-corta-y-la-viga-rigida
            nota: >-
              El problema 3 del primer parcial de 2016-2017: no hay carga, y
              las tres barras trabajan porque la 3 se fabricó corta en ξ. El
              resultado va en función de η, que el enunciado no da.
          - id: exerm1617-ext-7-la-celosia-de-cinco-barras
            nota: >-
              El problema 3 de la extraordinaria de junio de 2017: una celosía
              cuadrada de cinco barras, con dos diagonales que se cruzan. Pide
              los axiles y cuánto se mueve el apoyo móvil, que es el proceso de
              deformación de las dos cuestiones de arriba aplicado a una
              estructura entera.
        dominio: >-
          Sacas los axiles y el giro de una pieza rígida sostenida por una o
          varias barras, y compruebas con el dibujo que las barras que
          dices traccionadas se alargan de verdad.
      - id: temperatura-holguras-y-muelles
        titulo: Temperatura, holguras y muelles
        aprendes: >-
          A meter en la compatibilidad lo que no es carga: la temperatura de
          una barra, una holgura o un resorte en lugar de una barra.
        teoria:
          tema: t08-esfuerzo-axial
          apartado: barras-entre-paredes-holguras-y-muelles
        ejercicios:
          - id: ejerm8-la-barra-calentada-que-toca-la-pared
            incrustado: true
            nota: >-
              El ejemplo nuestro de la temperatura: una barra que se calienta
              y llega a tocar una pared.
          - id: ejerm8-cl8-1-la-viga-con-una-barra-calentada
            nota: >-
              El 8.1 de clase: una viga rígida articulada, con dos barras y una
              de ellas calentada. Es el problema del primer parcial de
              2022-2023 sin el resorte ni los diagramas, y su apartado b deja
              la barra calentada sin poder alargarse.
          - id: ejerm8-cl8-3-tres-barras-en-c-con-la-2-calentada
            nota: >-
              El 8.3 de clase: tres barras iguales que llegan al mismo nudo,
              cargado, con la 2 calentada. No hay pieza rígida que gire: lo que
              se mueve es el nudo, en las dos direcciones. Prepara el primer
              parcial de 2013-2014 de más abajo, otro nudo con tres barras y
              una calentada, que allí va además sobre un apoyo móvil.
          - id: ejerm8-cla9-la-barra-bd-con-dos-barras-y-un-resorte
            nota: >-
              La propuesta A9 de clase: una barra rígida articulada en la
              pared, como la del primer parcial de 2022-2023, con dos barras y
              un resorte que llegan al mismo extremo D, donde está la carga, y
              sin temperatura. Cuenta las incógnitas antes de empezar: aquí hay
              una barra más que en el examen.
          - id: ejerm8-cla12-la-pieza-abc-sobre-cinco-barras
            nota: >-
              La propuesta A12 de clase: una pieza rígida sobre cinco barras,
              con la calentada, BE, entre la pieza y un nudo, E, sujeto por
              otras dos. Como en el primer parcial de 2015-2016 de más abajo,
              se mueven a la vez la pieza y un nudo; aquí hay carga y
              temperatura.
          - id: ejerm8-cla8-tres-barras-y-la-3-calentada
            nota: >-
              La propuesta A8 de clase: la disposición del primer parcial de
              2013-2014 de más abajo, un nudo sobre un apoyo móvil con
              dos barras horizontales en línea y otra que baja de la pared,
              pero esa forma 30° y no 45°, la calentada es una de las
              horizontales y solo se piden las fuerzas.
          - id: exerm2526-2par-2-la-barra-cd-calentada
            nota: >-
              La cuestión 2 de la segunda parte de enero de 2026, de 1,25
              puntos: una pieza rígida en L y la barra CD a 45°, que cambia de
              temperatura. Pide los desplazamientos horizontal y vertical de C.
          - id: exerm2223-1par-7-la-barra-rigida-con-resorte-y-temperatura
            incrustado: true
            nota: >-
              El problema 3 del primer parcial de 2022-2023: un resorte en lugar
              de una barra y la barra 1 calentada. Acaba pidiendo los diagramas
              de la barra rígida, que es el tema 7 dentro del 8.
          - id: exerm1718-2par-5-la-viga-rigida-cd-y-la-barra-calentada
            nota: >-
              El problema 1 de la segunda parte de enero de 2018, que el mismo
              día fue el 2 de la final: una viga rígida recta apoyada en un
              punto intermedio y dos barras inclinadas a 30° que salen de sus
              extremos y llegan al mismo nudo del techo. Sin carga, solo la
              barra 1 calentada; pide las fuerzas y el desplazamiento del
              extremo D.
          - id: exerm1920-2par-6-la-barra-rigida-aob-con-dos-barras
            nota: >-
              El problema 2 de la segunda parte y 3 de la final de enero de
              2020: una barra rígida en L, articulada en la esquina O, sujeta
              por dos barras inclinadas a 30°, con una carga repartida sobre
              OB y la barra 2 calentada. Pide las fuerzas de las dos barras y
              los desplazamientos de A y de B.
          - id: exerm1617-ord-5-la-barra-rigida-abdf-colgada-de-tres-barras
            nota: >-
              El problema 1 de la final de enero de 2017: una barra rígida
              recta, sin articular, sostenida por dos barras a 30° y por una
              tercera vertical, con una carga en el extremo libre y la barra 2
              calentada. Pide las fuerzas, los diagramas de la barra rígida y
              el desplazamiento horizontal del extremo, recomendando
              Engesser-Castigliano, del bloque de los teoremas energéticos.
          - id: exerm1819-1par-5-la-barra-que-toca-la-pared
            nota: >-
              El problema 1 del primer parcial de 2018-2019, la holgura:
              primero la carga que la cierra y después la barra apoyada en las
              dos paredes. Trae además un plano inclinado y una dirección u, de
              los temas 2 a 4, que son del primer parcial.
          - id: exerm1516-1par-5-la-viga-rigida-con-un-resorte-en-e
            nota: >-
              El problema 1 del primer parcial de 2015-2016: la viga rígida con
              dos barras, y un resorte muy blando que no sujeta la viga sino el
              extremo de una barra. Es el 8.6 de clase.
          - id: exerm1314-1par-6-la-barra-calentada-y-el-apoyo-movil
            nota: >-
              El problema 2 del primer parcial de 2013-2014: tres barras que
              llegan al mismo nudo, que se apoya en un apoyo móvil, y una de
              ellas calentada. Pide también cuánto se mueve el nudo.
          - id: exerm1920-ext-2-las-tres-barras-y-el-error-de-montaje
            nota: >-
              La cuestión 2 de la extraordinaria de enero de 2020: tres barras
              que llegan a un mismo nudo, y el extremo de una de ellas, a una
              distancia Δ del punto del techo donde tiene que ir. Pide las
              fuerzas de las tres barras después de unirlo, sin ninguna carga
              exterior.
        dominio: >-
          Escribes la compatibilidad de una barra calentada o con holgura con
          el término térmico y el geométrico en su sitio, y sabes decir qué
          pasa si la holgura no llega a cerrarse.
    antesDeEntrar:
      pasos:
        - >-
          Cuenta incógnitas contra ecuaciones. Si sobra una, falta una de
          compatibilidad.
        - >-
          La pieza gira un ángulo pequeño. Cada punto se mueve el giro por su
          distancia, en perpendicular, y cada barra se alarga su proyección.
        - >-
          Todas a tracción, con $\Delta L = NL/EA + \alpha\Delta T\,L$. El
          signo de $N$ dirá cuál se comprime.
      trampa: >-
        Rígido no es inmóvil. Si la pieza está articulada, gira, y sus barras
        no se alargan lo mismo.

  - id: cuestion-de-flexion
    titulo: La cuestión de flexión, una deducción que cae en cada segunda parte
    pide: >-
      Una deducción de un punto o de 1,5: el flujo cortante, o las tensiones
      normales en flexión pura con su eje neutro.
    porque: >-
      Cae en las seis, siempre como cuestión de teoría, y siempre una de dos:
      el teorema del flujo cortante, que es la misma pregunta palabra por
      palabra en las cuatro primeras, y la ley de las tensiones normales, en
      las dos últimas. Seis preguntas y 6,5 de los 60 puntos, que se preparan
      con dos deducciones.
    invariante:
      anios: 6
      fuente: >-
        Contado pregunta a pregunta: 2016-2017 (T1), 2017-2018 (T1), 2018-2019
        (T2), 2019-2020 (T1), 2022-2023 (T1) y 2025-2026 (T3). Los puntos son
        los impresos junto a cada pregunta.
    apunte:
      texto: cae en las seis — y son dos deducciones
      tono: nota
    dominio: >-
      Escribes las dos deducciones de memoria, con sus hipótesis y su figura,
      y aplicas cada una a una sección rectangular.
    revisado: '2026-10-23'
    escalones:
      - id: las-tensiones-normales
        titulo: Las tensiones normales en flexión pura, deducidas
        aprendes: >-
          A deducir la ley de las tensiones normales de una sección con dos
          flectores, desde la hipótesis de partida hasta el eje neutro.
        teoria:
          tema: t09-flexion-tensiones
          apartado: las-tensiones-normales-en-el-caso-general
          nota: >-
            La hipótesis de partida está en el apartado de antes,
            [Navier-Bernoulli y el eje neutro](/road-to-ingenieria/elasticidad-resistencia/t09-flexion-tensiones/#navier-bernoulli-y-el-eje-neutro).
        ejercicios:
          - id: exerm2223-2par-1-la-ley-de-tensiones-en-flexion-pura
            nota: >-
              La cuestión 1 de la segunda parte de enero de 2023, de 1 punto:
              la deducción y el eje neutro.
          - id: exerm2526-2par-3-las-tensiones-normales-en-flexion-pura
            nota: >-
              La cuestión 3 de la segunda parte de enero de 2026, de 1,5
              puntos: la misma deducción con otras palabras, resuelta con otro
              ejemplo. Es la de arriba, y sirve de repaso.
        dominio: >-
          Deduces la ley lineal de las tensiones y el eje neutro de memoria, y
          dices de qué hipótesis sale cada paso.
      - id: el-flujo-cortante
        titulo: El teorema del flujo cortante, y una sección que lo usa
        aprendes: >-
          A deducir el teorema del flujo cortante, a sacar con él la tensión
          cortante de una sección y a usarlo en una viga compuesta.
        teoria:
          tema: t09-flexion-tensiones
          apartado: el-teorema-del-flujo-cortante
        ejercicios:
          - id: exerm2021-ord-3-el-teorema-del-flujo-cortante
            nota: >-
              La pregunta que más se repite de toda la segunda parte: la
              cuestión de teoría de 2016-2017, 2017-2018, 2018-2019 y
              2019-2020, palabra por palabra y de 1 punto. Está resuelta con
              un ejemplo nuestro en una sección rectangular.
          - id: exerm2021-ord-8-la-viga-con-platabandas-atornilladas
            nota: >-
              De la final de enero de 2021: una viga con rótula y una sección
              en I con platabandas atornilladas, que acaba en la separación de
              los tornillos, de las
              [vigas compuestas](/road-to-ingenieria/elasticidad-resistencia/t09-flexion-tensiones/#vigas-compuestas).
        dominio: >-
          Escribes la deducción con su figura y sacas con ella la cortante
          máxima de una sección y el flujo entre dos piezas unidas.
    falta:
      - >-
        Las cuestiones de autoevaluación del tema 9 no están en el sitio. Los
        dos escalones empiezan en la cuestión de examen, con la deducción en
        la prosa delante.
    antesDeEntrar:
      pasos:
        - >-
          Flujo cortante. En una rebanada $dx$ se aísla el trozo $A_c$; sus
          tensiones normales no se equilibran, y lo que falta lo pone el flujo
          por el corte.
        - >-
          Tensiones normales. Las secciones siguen planas, la tensión es lineal
          en $y$ y en $z$, el axil nulo lleva el eje neutro por $G$ y los
          flectores dan su ángulo.
      trampa: >-
        Por el borde libre no pasa flujo, y $A_c$ es todo lo que queda a un
        lado del corte. El eje neutro solo sigue al momento en ejes
        principales.

  - id: seccion
    titulo: La sección que trabaja, de los diagramas a la tensión máxima
    pide: >-
      Las tensiones de la sección más cargada, después de los diagramas; o
      una pieza cargada fuera de su eje, con axil y flector.
    porque: >-
      Cae en tres de las seis: como problema de 2 puntos en 2018-2019 y en
      2022-2023, y como cuestión de 1 punto en 2016-2017 y en 2018-2019, que
      trajo las dos. Cuatro preguntas y 6 de los 60 puntos. Y la tensión
      máxima de una sección cierra también los problemas de vigas
      hiperestáticas de 2019-2020 y de 2025-2026, que cuentan en su bloque.
    invariante:
      anios: 3
      fuente: >-
        Contado pregunta a pregunta: 2016-2017 (T2), 2018-2019 (T3 y P2) y
        2022-2023 (P2). Los puntos son los impresos junto a cada pregunta.
    apunte:
      texto: en tres de las seis — y al final de las hiperestáticas
      tono: nota
    dominio: >-
      Sacas el centro de gravedad, las inercias y la tensión máxima de una
      sección en función de su espesor, con flexión esviada si los ejes no
      son principales y con axil si la fuerza no pasa por el centro de
      gravedad, y despejas el espesor.
    revisado: '2026-10-23'
    escalones:
      - id: la-tension-maxima
        titulo: La tensión máxima de una sección
        aprendes: >-
          A sacar el centro de gravedad y la inercia de una sección, la tensión
          normal de cada fibra y la cortante en un punto.
        teoria:
          tema: t09-flexion-tensiones
          apartado: el-módulo-resistente-y-el-dimensionado
          nota: >-
            El centro de gravedad y las inercias de una sección compuesta se
            dan por sabidos. Están en
            [los teoremas de Steiner de Mecánica Aplicada](/road-to-ingenieria/mecanica-aplicada/t02-geometria-de-masas/#los-teoremas-de-steiner).
        ejercicios:
          - id: ejerm9-la-viga-en-t
            incrustado: true
            nota: >-
              El ejemplo del tema: una viga biapoyada de sección en T, del
              centro de gravedad a las tensiones máximas.
          - id: exerm2223-2par-6-la-viga-sobre-resortes
            nota: >-
              El problema 2 de la segunda parte de enero de 2023: una viga
              sobre dos resortes, con una rótula y un tirante. Pide los
              diagramas, un desplazamiento y las dos tensiones en un punto de
              la sección.
        dominio: >-
          Sacas las tensiones extremas de una sección en I, en T o en U,
          mirando las dos fibras y el flector de cada signo.
      - id: la-seccion-en-l
        titulo: La sección en L
        aprendes: >-
          A sacar la ley de tensiones, el eje neutro y la tensión máxima de una
          sección en L o de alas desiguales.
        teoria:
          tema: t09-flexion-tensiones
          apartado: ejes-principales-la-fórmula-de-navier
          nota: >-
            Las inercias de una sección compuesta y el giro de ejes se dan por
            sabidos. Están en
            [las superficies planas de Mecánica Aplicada](/road-to-ingenieria/mecanica-aplicada/t02-geometria-de-masas/#superficies-planas-momentos-y-productos-de-inercia).
        ejercicios:
          - id: exerm1213-1par-6-la-viga-con-voladizo-y-seccion-en-l
            nota: >-
              Del primer parcial de 2012-2013, cuando el parcial llegaba a la
              flexión: una viga con voladizo y una sección en L de alas
              iguales. Pide su espesor.
          - id: exerm1314-1par-7-la-viga-con-carga-triangular-y-seccion-en-l
            nota: >-
              Del primer parcial de 2013-2014: una carga triangular y otra L,
              que pide además la posición del centro de gravedad, las inercias
              y el eje neutro.
          - id: exerm1819-ext-6-la-viga-con-voladizo-y-seccion-en-l
            nota: >-
              De la extraordinaria de 2018-2019: otra L, y la luz con la que la
              tracción llega a 200 MPa.
          - id: exerm1819-2par-6-la-viga-con-dos-rotulas-y-la-seccion-de-alas-desiguales
            nota: >-
              El problema 2 de la segunda parte de enero de 2019: una viga con
              dos rótulas y un par, y una sección de alas desiguales. Pide la
              ecuación de las tensiones, el eje neutro y las tensiones
              extremas.
          - id: exerm2223-ext-6-la-viga-con-rotula-y-un-par
            nota: >-
              De la extraordinaria de 2022-2023: una viga con rótula y un par, y
              una sección de pared delgada. Pide también la tensión tangencial
              máxima.
        dominio: >-
          Sacas el eje neutro de una sección en L o de alas desiguales y das
          la tensión máxima en el punto que de verdad la lleva.
      - id: la-fuerza-fuera-del-eje
        titulo: Flexión compuesta, la fuerza que no pasa por el eje
        aprendes: >-
          A llevar una fuerza al centro de gravedad de la sección que se
          estudia, escribir el axil y los flectores que da y sumar sus
          tensiones, con el eje neutro fuera de ese centro.
        teoria:
          tema: t09-flexion-tensiones
          apartado: flexión-compuesta-y-fuerza-excéntrica
        ejercicios:
          - id: exerm1617-2par-2-el-poste-de-aluminio-con-la-fuerza-inclinada
            nota: >-
              La cuestión 2 de la segunda parte de enero de 2017, de 1 punto:
              un poste tubular con una fuerza inclinada en su cara exterior.
          - id: exerm2223-ext-3-el-pilar-con-dos-galgas
            nota: >-
              De la extraordinaria de 2022-2023: un pilar con dos galgas, del
              tema 3, de las que se sacan las dos fuerzas que lo cargan.
          - id: exerm1819-2par-3-la-barra-circular-abc
            nota: >-
              La cuestión 3 de la segunda parte de enero de 2019: una barra en
              arco, con los esfuerzos de una
              [pieza de directriz curva](/road-to-ingenieria/elasticidad-resistencia/t07-piezas-prismaticas/#piezas-de-directriz-curva),
              del tema 7.
          - id: exerm1718-ext-6-la-viga-rigida-en-t-sujeta-por-la-barra-1
            nota: >-
              De la extraordinaria de 2017-2018: una viga de sección en T
              sujeta por una barra inclinada. Pide una longitud y el radio de
              la barra.
          - id: exerm2223-ext-2-el-eslabon-abierto-de-una-cadena
            nota: >-
              De la extraordinaria de 2022-2023: el eslabón abierto de una
              cadena. Pide las tensiones extremas y el eje neutro.
        dominio: >-
          Ante una fuerza fuera del eje escribes el axil y los dos flectores en
          la sección que importa, sumas las tres tensiones con su signo y dices
          dónde queda el eje neutro.
    falta:
      - >-
        Los ejercicios de clase del tema 9 (9.1 a 9.8) y sus cuestiones de
        autoevaluación no están en el sitio. Los escalones de la sección en L
        y de la fuerza fuera del eje empiezan en ejercicios de examen, sin un
        ejemplo propio delante, y la prosa del tema no resuelve ninguna L.
      - >-
        La prosa del tema 9 no explica el centro de gravedad, las inercias ni
        el producto de inercia de una sección compuesta, que todos estos
        problemas usan. Se dan por sabidos de Mecánica Aplicada, y los dos
        primeros escalones lo enlazan.
    antesDeEntrar:
      pasos:
        - >-
          Los diagramas primero, con el flector máximo positivo y el máximo
          negativo, porque cada signo tracciona una fibra distinta.
        - >-
          Sección en función de $t$. El área va con $t^2$ y las inercias con
          $t^4$, así que se calcula con $t = 1$ y la tensión de flexión se
          divide por $t^3$.
        - >-
          Sin eje de simetría, $I_{yz} \neq 0$, y el eje neutro no es $z$
          aunque solo haya $M_z$.
      trampa: >-
        Una sola admisible para dos fibras. Si el material resiste distinto a
        tracción y a compresión, cada fibra va con la suya.

  - id: deformaciones
    titulo: Flechas y giros, la elástica y la viga conjugada
    pide: >-
      La ecuación de la elástica, deducida; o la flecha y el giro de una viga
      con voladizo o con rótula, por la conjugada o integrando.
    porque: >-
      Cae en tres de las seis, las tres primeras: cuatro preguntas y 6 de los
      60 puntos, con dos en 2017-2018. Desde enero de 2019 no ha vuelto como
      pregunta propia, pero las flechas de la tabla de vigas entran en cada
      viga hiperestática. Empata en puntos con la sección, que va delante
      porque cayó en 2022-2023.
    invariante:
      anios: 3
      fuente: >-
        Contado pregunta a pregunta: 2016-2017 (P1), 2017-2018 (T3 y P2) y
        2018-2019 (T4). Los puntos son los impresos junto a cada pregunta.
    apunte:
      texto: las tres primeras — y no desde 2019
      tono: nota
    dominio: >-
      Deduces la ecuación de la elástica con su signo, integras una viga
      tramo a tramo con sus condiciones, y con la viga conjugada das el giro
      y la flecha de un voladizo.
    revisado: '2026-10-23'
    escalones:
      - id: la-ecuacion-de-la-elastica
        titulo: La ecuación de la elástica, deducida
        aprendes: >-
          A deducir la ecuación diferencial de la elástica desde la curvatura,
          con su signo y las hipótesis con que vale.
        teoria:
          tema: t10-flexion-deformaciones
          apartado: de-la-curvatura-a-la-ecuación-de-la-elástica
        ejercicios:
          - id: exerm1819-ext-3-la-ecuacion-diferencial-de-la-curva-elastica
            nota: >-
              La cuestión 3 de la segunda parte de enero de 2018, de 1 punto,
              que volvió igual en la extraordinaria de 2018-2019. El ejemplo
              nuestro es un voladizo integrado con ella.
          - id: exerm2021-ext-3-la-ecuacion-diferencial-de-la-elastica
            nota: >-
              De la extraordinaria de 2020-2021: la misma cuestión con
              «Deducir la» delante, resuelta con otro ejemplo. La deducción es
              la de arriba, y sirve de repaso.
        dominio: >-
          Escribes la deducción con el signo justificado y dices qué hipótesis
          la hace aproximada.
      - id: integrar-tramo-a-tramo
        titulo: Integrar la elástica tramo a tramo
        aprendes: >-
          A integrar dos veces la ley de flectores de cada tramo y a cerrar las
          constantes con los apoyos y la continuidad, también en una viga con
          rótula.
        teoria:
          tema: t10-flexion-deformaciones
          apartado: integrar-la-ecuación-tramo-a-tramo
          nota: >-
            El apartado resuelve un voladizo y acaba en la tabla de vigas
            elementales que usan las vigas hiperestáticas.
        ejercicios:
          - id: exerm1617-2par-5-la-viga-gerber-con-p-en-el-voladizo-y-q0-en-df
            nota: >-
              El problema 1 de la segunda parte de enero de 2017: una viga
              Gerber con dos cargas. Pide los diagramas de cada carga y la
              relación entre las dos que deja quieta la rótula.
        dominio: >-
          Integras una viga de dos o tres tramos con rótula sin perder una
          constante, y compruebas el resultado con la tabla.
      - id: la-viga-conjugada
        titulo: La viga conjugada, y los teoremas de Mohr
        aprendes: >-
          A convertir una viga en su conjugada, cargarla con $M/EI$ y leer el
          giro y la flecha de un punto en su cortante y su flector.
        teoria:
          tema: t10-flexion-deformaciones
          apartado: la-viga-conjugada
          nota: >-
            Los
            [teoremas de Mohr](/road-to-ingenieria/elasticidad-resistencia/t10-flexion-deformaciones/#los-dos-teoremas-de-mohr),
            en el apartado de antes, son el otro camino, con el que el sitio
            resuelve la final de enero de 2018.
        ejercicios:
          - id: ejerm10-el-giro-y-la-flecha-del-voladizo
            incrustado: true
            nota: >-
              El ejemplo del tema: una viga con voladizo y la carga en la
              punta, con el giro y la flecha de la punta.
          - id: exerm1617-ord-6-la-viga-gerber-por-la-viga-conjugada
            nota: >-
              De la final de enero de 2017: la Gerber del escalón de antes, con
              los mismos datos y las mismas preguntas, por la viga conjugada.
              Los resultados ya los tienes; lo que entrena es el camino.
          - id: exerm1718-2par-6-la-pieza-de-dos-diametros-con-voladizo
            nota: >-
              El problema 2 de la segunda parte de enero de 2018: una pieza de
              dos diámetros con un voladizo cargado. Pide dos giros y una
              flecha. Su primer paso, la conjugada, es el del ejemplo del
              tema, y sirve de repaso.
          - id: exerm1718-ord-7-la-pieza-de-dos-diametros-con-voladizo
            nota: >-
              De la final del mismo día: la misma pieza por los teoremas de
              Mohr. Los resultados son los de arriba; lo que entrena es el
              otro camino.
          - id: exerm1819-2par-4-la-viga-conjugada-y-la-reciprocidad
            nota: >-
              La cuestión 4 de la segunda parte de enero de 2019, de 1 punto:
              un giro por la viga conjugada y un desplazamiento por el
              [teorema de reciprocidad](/road-to-ingenieria/elasticidad-resistencia/t13-teoremas-energeticos/#los-teoremas-de-reciprocidad),
              del tema 13. Su primer paso, la conjugada, vuelve a ser el del
              ejemplo, y sirve de repaso.
        dominio: >-
          Dibujas la conjugada de una viga con voladizo y rótula sin mirar la
          tabla de equivalencias, y sacas de ella un giro y una flecha con su
          signo.
    falta:
      - >-
        Los ejercicios de clase del tema 10 (10.1 a 10.6) y sus cuestiones de
        autoevaluación no están en el sitio. El escalón de integrar tramo a
        tramo tiene un solo ejercicio, el de examen, sin práctica delante.
    antesDeEntrar:
      pasos:
        - >-
          La elástica sale de $1/\rho = M/EI$ y, con giros pequeños,
          $v'' = -M/EI$ con $y$ hacia abajo. Dos constantes por tramo, que
          cierran los apoyos y la continuidad.
        - >-
          La conjugada se carga con $M/EI$. Un extremo libre pasa a
          empotramiento, un empotramiento a extremo libre, un apoyo intermedio
          a rótula y una rótula a apoyo intermedio.
      trampa: >-
        En una rótula la flecha es continua y el giro no. Integrando, cada
        lado lleva su giro.

  - id: pandeo
    titulo: Pandeo, una cuestión que no cae desde 2018
    pide: >-
      Una cuestión de un punto sobre la compresión excéntrica de una columna
      esbelta: el desplazamiento de su extremo, o una dimensión para un
      factor dado.
    porque: >-
      Ha caído en dos de las seis, las dos primeras, siempre como cuestión de
      1 punto: dos preguntas y 2 de los 60 puntos, el hueco más pequeño. Va el
      último por eso, pero entra con una deducción corta, y las finales y las
      extraordinarias lo han seguido preguntando hasta 2022.
    invariante:
      anios: 2
      fuente: >-
        Contado pregunta a pregunta: 2016-2017 (T4) y 2017-2018 (T4). Los
        puntos son los impresos junto a cada pregunta.
    apunte:
      texto: en dos de las seis — 2 de los 60 puntos
      tono: nota
    dominio: >-
      Deduces la carga crítica de Euler y el desplazamiento del extremo libre
      de una columna con la carga excéntrica, y sabes qué inercia y qué
      longitud entran en cada fórmula.
    revisado: '2026-10-23'
    escalones:
      - id: la-carga-critica
        titulo: La carga crítica de Euler
        aprendes: >-
          A deducir la carga crítica de una columna biarticulada y a
          aplicarla con la inercia que manda.
        teoria:
          tema: t14-pandeo
          apartado: la-carga-crítica-de-euler
        ejercicios:
          - id: exerm2021-ord-4-la-carga-critica-de-euler
            nota: >-
              De la final de enero de 2021, que volvió igual en la
              extraordinaria de 2021-2022: la deducción, de 1 punto.
          - id: exerm1617-ext-4-la-carga-critica-de-la-columna-en-c
            nota: >-
              De la extraordinaria de 2016-2017: la carga crítica de una
              columna de sección en C, de 1 punto.
        dominio: >-
          Deduces la carga crítica de la biarticulada y eliges la inercia que
          manda en una sección con un solo eje de simetría.
      - id: la-compresion-excentrica
        titulo: La compresión excéntrica de una columna esbelta
        aprendes: >-
          A escribir el flector sobre la columna deformada, integrar la
          elástica con sus condiciones y sacar el desplazamiento del extremo
          libre y el flector máximo.
        teoria:
          tema: t14-pandeo
          apartado: compresión-excéntrica-de-columnas-esbeltas
        ejercicios:
          - id: ejerm14-la-columna-con-la-carga-desplazada
            incrustado: true
            nota: >-
              El ejemplo del tema: una columna empotrada y libre con la carga
              desplazada, de la carga crítica al desplazamiento del extremo.
          - id: exerm1617-2par-4-el-desplazamiento-del-extremo-libre-en-la-compresion-excentrica
            nota: >-
              La cuestión 4 de la segunda parte de enero de 2017, de 1 punto:
              la deducción del desplazamiento del extremo libre.
          - id: exerm1718-2par-4-la-columna-con-dos-huecos-y-la-carga-en-b
            nota: >-
              La cuestión 4 de la segunda parte de enero de 2018, de 1 punto:
              una sección con dos huecos y la carga en un borde. Pide una
              dimensión de la sección para un factor dado.
          - id: exerm2021-ext-4-compresion-excentrica-de-columnas-esbeltas
            nota: >-
              De la extraordinaria de 2020-2021, que ya había caído en la de
              2017-2018: la misma deducción, resuelta con otro ejemplo. Es la
              de 2016-2017 de arriba, y sirve de repaso.
        dominio: >-
          Deduces el desplazamiento y el flector máximo de la empotrada y libre
          con la carga excéntrica, y dices qué longitud va en el factor.
    falta:
      - >-
        El tema 14 no tiene ejercicios de clase en el material, y sus
        cuestiones de autoevaluación no están en el sitio. El primer escalón
        empieza en la cuestión de examen.
    antesDeEntrar:
      pasos:
        - >-
          Euler, con el equilibrio en la columna deformada.
          $P_{cr} = \pi^2EI/L_p^2$, con la longitud de pandeo de sus enlaces.
        - >-
          Compresión excéntrica de la empotrada y libre. El flector va sobre
          la deformada, y el desplazamiento del extremo sale con la secante de
          $\alpha L$, con $\alpha = \sqrt{P/EI}$.
      trampa: >-
        La carga crítica va con la inercia mínima de la sección, aunque la
        excentricidad flecte la columna alrededor del otro eje.

  - id: depositos
    titulo: Depósitos de pared delgada, lo más pequeño del tema 8
    pide: >-
      Las tensiones de la pared de un depósito con presión interior,
      deducidas o usadas con galgas para sacar la presión.
    porque: >-
      Ninguna de las seis segundas partes trae un depósito: del tema 8, allí
      solo caían las barras. En los seis primeros parciales de 2016-2017 a
      2022-2023, donde iba entonces, cayó en dos, como cuestión de 1
      punto: 2017-2018 (T4) y 2019-2020 (T4, con dos galgas), 2 de sus 60
      puntos, lo mismo que el pandeo en las seis segundas partes. Este curso
      entra aquí, y va detrás del pandeo porque su peso es el de otro examen.
      Las galgas y Hooke en tensión plana, que usa, son de los temas 3 y 4,
      del primer parcial.
    apunte:
      texto: entra este curso — en el primer parcial valía 2 de 60
      tono: neutro
    dominio: >-
      Escribes las tensiones circunferencial y longitudinal de un depósito
      cilíndrico, la una con Laplace y la otra con el equilibrio de la tapa, y
      las usas para pasar de unas galgas a la presión.
    revisado: '2026-10-23'
    escalones:
      - id: el-deposito
        titulo: El depósito cilíndrico, y la presión que leen dos galgas
        aprendes: >-
          A sacar las dos tensiones de la pared de un depósito de pared
          delgada y a combinarlas con Hooke para leer la presión de unas
          galgas.
        teoria:
          tema: t08-esfuerzo-axial
          apartado: depósitos-y-anillos-de-pared-delgada
        ejercicios:
          - id: ejerm8-cu4-depositos-y-anillos
            nota: >-
              Cuestión 4 de autoevaluación del tema 8: la ecuación del depósito
              que piden más abajo las cuestiones del primer parcial de
              2017-2018 y de 2013-2014, y además los anillos, que no pide
              ninguna de las dos: un anillo nuestro con presión interior y dos
              anillos encajados uno dentro del otro.
          - id: exerm1718-1par-4-el-deposito-de-revolucion
            nota: >-
              La cuestión 4 del primer parcial de 2017-2018: la ecuación de
              Laplace deducida para un depósito de revolución cualquiera, con
              el equilibrio de un trozo de pared. El cilindro y la esfera salen
              después, como dos casos.
          - id: exerm1920-1par-4-el-deposito-con-dos-galgas
            incrustado: true
            nota: >-
              La cuestión 4 del primer parcial de 2019-2020: una galga axial y
              otra a 60°, y de ellas la deformación circunferencial, ν y la
              presión.
          - id: exerm1314-1par-4-el-deposito-de-pequeno-espesor
            nota: >-
              La cuestión 4 del primer parcial de 2013-2014: la ecuación del
              depósito deducida de un elemento de pared. Es la cuestión de
              2017-2018 de arriba con otras palabras, resuelta con otros
              ejemplos, y sirve de repaso.
          - id: exerm2021-ext-1-el-deposito-esferico-y-la-roseta
            nota: >-
              La cuestión 1 de la extraordinaria de febrero de 2021: un
              depósito esférico con una roseta de tres galgas que leen lo
              mismo. Pide, en letras, los tensores de deformaciones y de
              tensiones de la superficie exterior y el cambio de espesor de la
              pared.
          - id: exerm2223-ord-3-el-tanque-soldado
            nota: >-
              La cuestión 3 de la final de enero de 2023: las mismas placas
              soldadas en anillos o en hélice a 45°, y la presión que aguanta
              cada tanque con la tensión admisible perpendicular a la
              soldadura.
          - id: exerm1920-ord-5-el-recipiente-soldado
            nota: >-
              El problema 1 de la final de enero de 2020, de 1,5 puntos: un
              recipiente de chapas soldadas en anillos o en hélice a 30°, con
              la tracción de la soldadura añadida a la de la presión. Pide la
              presión máxima con Von Mises, la tensión equivalente de las dos
              soluciones, E y ν de dos galgas y cuánto cambian el radio y la
              longitud.
        dominio: >-
          Deduces las dos tensiones de la pared en un dibujo y sacas la presión
          de un depósito a partir de dos lecturas de galga.
    antesDeEntrar:
      pasos:
        - >-
          Circunferencial $pr/t$, por la ecuación de Laplace; longitudinal
          $pr/2t$, por el equilibrio de la tapa.
        - >-
          Con galgas, Hooke en tensión plana. La radial se desprecia frente a
          las otras dos.
      trampa: >-
        Las dos tensiones al revés. La circunferencial, la que rodea el
        cilindro, es $pr/t$, y la longitudinal, la mitad.

  - id: simulacro
    titulo: El simulacro, con una segunda parte entera
    apunte:
      texto: de una sentada, y sin la solución al lado
      tono: marco
    pide: >-
      Las cuestiones y los problemas de una segunda parte de enero, de una
      sentada.
    porque: >-
      Los bloques de arriba entrenan cada hueco por separado, y la segunda
      parte no va por separado: salta de una deducción de un punto a una
      barra quebrada de dos. Estas son las seis de la ventana, completas y con
      su resolución detrás. Ninguna de las seis trae los diagramas ni los
      depósitos como pregunta propia, porque iban en el primer parcial; este
      curso pueden caer, y esos dos bloques no tienen simulacro aquí.
    dominio: >-
      Hacer una segunda parte completa de una sentada sin abrir la
      resolución, y después contar cuántos apartados habrías dado por buenos
      sin serlo.
    material:
      - tipo: examen
        curso: '2025-2026'
        convocatoria: segundo-parcial
        nota: >-
          La más reciente, y la que conviene hacer primero: tres cuestiones y
          dos problemas, con la viga continua de 3,5 puntos. Llegó en fotos,
          así que no tiene PDF, y sus figuras están redibujadas.
      - tipo: examen
        curso: '2022-2023'
        convocatoria: segundo-parcial
        nota: >-
          La flexión pura, las vigas cruzadas, la reciprocidad, la sección
          cerrada, el eje con tirante, la viga sobre resortes y la barra
          quebrada con un muelle.
      - tipo: examen
        curso: '2019-2020'
        convocatoria: segundo-parcial
        nota: >-
          El flujo cortante, Engesser-Castigliano, el tubo rectangular, los
          tres momentos, la viga sobre un muelle, la barra rígida con dos
          barras y la estructura espacial con un par.
      - tipo: examen
        curso: '2018-2019'
        convocatoria: segundo-parcial
        nota: >-
          La torsión circular, el flujo cortante, el arco, la viga conjugada,
          la viga rígida con cuatro barras, la viga con dos rótulas y la barra
          quebrada apoyada.
      - tipo: examen
        curso: '2017-2018'
        convocatoria: segundo-parcial
        nota: >-
          El flujo cortante, la sección cerrada, la elástica, la columna con
          dos huecos, la barra calentada, la pieza de dos diámetros y la
          estructura espacial.
      - tipo: examen
        curso: '2016-2017'
        convocatoria: segundo-parcial
        nota: >-
          El flujo cortante, el poste, la sección cerrada, la compresión
          excéntrica, la Gerber, el eje empotrado en los dos extremos y el
          pórtico con rótula.
    revisado: '2026-10-23'

  - id: formulario
    titulo: Lo que hay que llevar sabido
    apunte:
      texto: repaso, no aprendizaje
      tono: marco
    pide: >-
      Las relaciones de la rebanada, el alargamiento con temperatura, Navier
      y la fórmula general, el flujo cortante, la elástica y la tabla de
      vigas, los tres momentos, la torsión circular y la cerrada, la fuerza
      unidad y Euler, de memoria.
    porque: >-
      Va el último porque es repaso, no aprendizaje: es el bloque del rato de
      antes de entrar. Cada tema acaba con su lista de lo que hay que llevar
      sabido, y aquí están las ocho, en el orden del temario. No hay nada en
      ellas que no esté en su tema.

      **Las listas de todos los temas escritos están juntas en una sola página**, hecha para imprimirse a dos columnas: [el formulario de Elasticidad](/road-to-ingenieria/elasticidad-resistencia/formulario/). Se leen de los temas, así que no hay nada escrito ahí que no esté en ellos.
    dominio: >-
      Escribir de memoria y en papel el alargamiento con temperatura, la
      fórmula general de la flexión, el flujo cortante, la ecuación de los
      tres momentos, la tensión de una sección cerrada y la fuerza unidad, sin
      consultar nada. Si tienes que mirar una sola vez, todavía no.
    material:
      - tipo: teoria
        tema: t07-piezas-prismaticas
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          El convenio de los esfuerzos, las relaciones de la rebanada y las
          reglas de los diagramas.
      - tipo: teoria
        tema: t08-esfuerzo-axial
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          El alargamiento con temperatura, la compatibilidad del sólido
          rígido y los depósitos.
      - tipo: teoria
        tema: t09-flexion-tensiones
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          Navier, la fórmula general, el flujo cortante, las vigas compuestas,
          la flexión compuesta y el núcleo central.
      - tipo: teoria
        tema: t10-flexion-deformaciones
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          La elástica con su signo, las condiciones de los apoyos, la tabla de
          vigas, las funciones de singularidad, Mohr y la conjugada.
      - tipo: teoria
        tema: t11-flexion-hiperestatica
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          El enlace que se quita, la empotrada-apoyada y los tres momentos con
          el voladizo y el empotramiento.
      - tipo: teoria
        tema: t12-torsion
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          La circular, el eje empotrado en los dos extremos, la rectangular,
          la abierta y la cerrada de pared delgada.
      - tipo: teoria
        tema: t13-teoremas-energeticos
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          Castigliano, la coenergía de cada esfuerzo, la fuerza unidad, el
          muelle y el tirante, y la barra quebrada.
      - tipo: teoria
        tema: t14-pandeo
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          Euler, la longitud de pandeo, la esbeltez y la compresión
          excéntrica.
    revisado: '2026-10-23'
