asignatura: calculo
evaluacion: quinta
titulo: Preparar la quinta evaluación
lede: >-
  Los temas 8 y 9, y con ellos se acaba el temario que entra en evaluación
  continua. Diez convocatorias leídas y treinta y dos ejercicios contados: doce
  de integral curvilínea y diecisiete de ecuaciones diferenciales, uno de cada
  cosa en cada examen. Los tres que sobran son del formato antiguo, cuando la
  quinta todavía arrastraba la integral múltiple.
temas:
  - t06-varias-variables
  - t07-integral-multiple
  - t08-integral-curvilinea
  - t09-ecuaciones-diferenciales
medidoSobre: 10
criterioDeOrden: >-
  Por rendimiento los dos bloques grandes empatan: la integral curvilínea cae
  en las diez convocatorias leídas y las ecuaciones diferenciales también. Lo
  que los separa es la cantidad —doce ejercicios frente a diecisiete— y una
  dependencia: las EDO **exactas**, que son una de las cuatro casillas del
  árbol de clasificar, son campos conservativos con otro nombre, y el criterio
  para reconocerlas es el mismo $M_{y}=N_{x}$ del tema 8. Por eso la curvilínea
  va primero aunque rinda algo menos: hecha antes, el segundo bloque empieza
  con una cuarta parte del trabajo ya hecha. El tercer bloque, el del formato
  antiguo, va al final porque solo sirve si tu profesor sigue metiendo integral
  múltiple en la quinta.


  **Cómo se han determinado los huecos de esta ruta.** Un bloque sin `falta[]`
  no es un bloque sin mirar: el 29 de agosto de 2026 se pasaron los sesenta y
  dos bloques de las siete rutas por tres criterios medidos —si su tema tiene
  pocos ejemplos de entrada para lo que el examen le exige, si sus ejercicios
  usan una herramienta que la prosa de ese tema no nombra, y si algún escalón
  suyo empieza directamente en un ejercicio de examen— y solo se declara lo que
  sale de alguno de ellos. Lo que no aparece aquí es porque ninguno de los tres
  lo señaló.
bloques:
  # ─────────────────────────────────────────────────────────────────────
  - id: curvilinea
    apunte:
      texto: 'en las 10 convocatorias — casi siempre el 1'
      tono: nota
    titulo: El trabajo de un campo a lo largo de una curva
    pide: >-
      Calcular la integral de un campo vectorial sobre una curva: un trabajo,
      casi siempre. La curva puede venir parametrizada, descrita con
      condiciones, dibujada en una figura o contada en palabras — una ladera,
      un río, un alambre.
    porque: >-
      Doce de los treinta y dos ejercicios, y **está en las diez convocatorias
      leídas**, casi siempre en el ejercicio 1. Lo que se evalúa no es integrar:
      es elegir el camino. Los mismos diez puntos se sacan en cinco líneas o en
      media hora según lo que compruebes antes de empezar, y cinco de los doce
      enunciados están escritos precisamente para premiar esa comprobación.
    invariante:
      anios: 10
      fuente: >-
        Contado sobre las quintas evaluaciones de 2015-2016 a 2025-2026 (falta
        2019-2020; ver la nota del final sobre ese curso). Reparto de los doce
        por lo que premian:
        cinco la independencia del camino —2015-2016, 2021-2022, 2023-2024,
        2024-2025 y 2025-2026—, cuatro el teorema de Green —2016-2017,
        2017-2018, 2020-2021 y el segundo de 2022-2023—, dos la parametrización
        de una curva descrita con condiciones —2018-2019 y el primero de
        2022-2023— y uno la integral respecto de la longitud de arco, el
        segundo de 2021-2022.
    dominio: >-
      Ante cualquier integral curvilínea, decidir en menos de un minuto si el
      campo es conservativo y si la curva es cerrada, y solo entonces empezar.
      Y saber que si es conservativo y cerrada, la respuesta es cero sin
      calcular nada.
    escalones:
      - id: parametrizar
        titulo: Parametrizar, y no equivocarse de sentido
        aprendes: >-
          Describir una curva con un solo parámetro y comprobar que el recorrido
          va en el sentido que pide el enunciado.
        dominio: >-
          Que las tres parametrizaciones de siempre —segmento, circunferencia y
          gráfica— te salgan sin pensar, y que compruebes el sentido
          sustituyendo el primer valor del parámetro.
        teoria:
          tema: t08-integral-curvilinea
          apartado: parametrizar-describir-la-curva-con-un-solo-parámetro
          nota: >-
            Si la curva es $y=f(x)$, la propia $x$ sirve de parámetro y no hay
            nada que inventar. Es la que más se olvida.
        ejercicios:
          - id: ej-parametrizar-un-segmento
            incrustado: true
            nota: >-
              Empieza aquí. Corto, y con la comprobación del sentido hecha
              explícita, que es lo que cambia el signo del resultado.
          - id: ex2223-5ev-1-la-semicircunferencia-en-el-plano-y-tres
            nota: >-
              De 2022-2023. La curva no viene dibujada ni parametrizada: viene
              descrita con tres condiciones, y traducirlas es medio ejercicio.
          - id: ex1819-5ev-2-la-semielipse-que-minimiza
            nota: >-
              De 2018-2019, y es el más exigente de los tres: se parametriza una
              familia entera de curvas, sale un trabajo que depende de un
              parámetro, y hay que minimizarlo.

      - id: conservativo
        titulo: El atajo — comprobar si el campo es conservativo
        aprendes: >-
          Comprobar en diez segundos si un campo deriva de un potencial,
          encontrar ese potencial cuando existe, y usarlo para no integrar.
        dominio: >-
          Hacer la comprobación **siempre antes** de decidir el camino, saber
          que al integrar sale $+g(y)$ y no $+C$, y contestar «cero» ante una
          curva cerrada sin escribir una línea más.
        teoria:
          tema: t08-integral-curvilinea
          apartado: el-atajo-grande-campos-conservativos
          nota: >-
            Si el campo es conservativo, la integral solo depende de los
            extremos. Y sobre cualquier curva cerrada vale cero.
        ejercicios:
          - id: ej-conservativo-o-no
            incrustado: true
            nota: >-
              Dos campos casi iguales, uno conservativo y el otro no, para ver
              cuánto cambia la estrategia con una comprobación de diez segundos.
          - id: ex1516-5ev-2-el-campo-que-no-mira-el-camino
            nota: >-
              De 2015-2016, y es el caso de manual: tres curvas —segmento, arco
              y circunferencia entera— y una sola cuenta. El apartado c) vale
              cero.
          - id: ex2122-5ev-1-la-helice-y-el-potencial
            nota: >-
              De 2021-2022. El mismo atajo en el espacio, con tres variables:
              una hélice entera que no hay que recorrer.
          - id: ex2526-5ev-1-el-monte-y-las-tres-subidas
            nota: >-
              De 2025-2026. Dos campos en el mismo enunciado, uno conservativo y
              otro no, y hay que elegir camino con cada uno.
          - id: ex2425-5ev-1-el-rio-y-las-dos-parabolas
            nota: >-
              De 2024-2025. Aquí el campo **no** es conservativo, y por eso los
              dos caminos dan resultados distintos: es el contraejemplo que
              cierra el escalón.
          - id: ex2324-5ev-1-el-camino-con-semicircunferencia
            nota: >-
              De 2023-2024. Un camino que se va lejos para volver casi al mismo
              sitio; si sabes que hay potencial, la longitud del rodeo da igual.

      - id: green
        titulo: Green, cuando la curva se cierra
        aprendes: >-
          Cambiar una integral sobre una curva cerrada por una integral doble
          sobre lo que encierra, y usarla también al revés, cuando lo que se
          conoce es el área.
        dominio: >-
          Decir en voz alta las tres condiciones —cerrada, sentido positivo,
          parciales continuas dentro— y reconocer cuándo Green convierte cuatro
          parametrizaciones en una integral doble de una línea.
        teoria:
          tema: t08-integral-curvilinea
          apartado: green-cuando-la-curva-se-cierra
          nota: >-
            Y el puente entre los dos atajos: si el campo es conservativo el
            integrando de Green es cero, y por eso la integral cerrada se anula.
        ejercicios:
          - id: green-en-un-recinto-cerrado
            nota: >-
              De 2014-2015. Enfrenta los dos atajos en dos apartados: el primer
              campo es conservativo y el segundo no.
          - id: ex1617-5ev-2-el-cuarto-de-disco-por-dos-caminos
            nota: >-
              De 2016-2017, y el enunciado obliga a hacerlo de las dos formas.
              Por Green son tres líneas; a pelo, quince. Merece la pena verlo
              una vez.
          - id: ex2021-5ev-1-el-semianillo
            nota: >-
              De 2020-2021. El campo lleva un arcotangente y una exponencial
              puestos ahí para castigar a quien parametrice: los dos desaparecen
              al derivar.
          - id: ex1718-5ev-2-el-trabajo-que-sale-del-area
            nota: >-
              De 2017-2018, y es Green al revés: de la curva no se da la
              ecuación, solo el área que encierra. Sale igual.
          - id: ex2223-5ev-2-la-altura-que-da-ocho-julios
            nota: >-
              De 2022-2023. Otra vez al revés: se conoce el trabajo y se busca
              una altura.
          - id: ex2021-4ev-3-area-por-integral-curvilinea
            nota: >-
              Este no es de una quinta: es el ejercicio 3 de la **cuarta** de
              2020-2021, el único de integral curvilínea que se ha colado ahí en
              once años. Va aquí porque es la aplicación más limpia de Green que
              hay en el corpus: el área encerrada calculada con una integral de
              línea, que es la fórmula al revés.

      - id: escalar
        titulo: La otra integral de línea, la que no lleva vector
        aprendes: >-
          Distinguir la integral respecto de la longitud de arco de la de un
          campo vectorial, y calcular una masa o una longitud con ella.
        dominio: >-
          Reconocer por el enunciado cuál de las dos te piden —si hay «masa»,
          «longitud» o «densidad», es la escalar— y no olvidar el
          $ds=\left|r'(t)\right|dt$.
        teoria:
          tema: t08-integral-curvilinea
          apartado: la-otra-integral-curvilínea-respecto-de-la-longitud-de-arco
          nota: >-
            No depende del sentido del recorrido, y ahí está la diferencia de
            fondo con la otra: una masa no cambia de signo si recorres el
            alambre al revés.
        ejercicios:
          - id: ej-parametrizar-un-segmento
            nota: >-
              Parametrizar con su sentido, que es el primer paso de cualquier integral de línea.
          - id: ex2122-5ev-2-la-masa-de-un-alambre
            nota: >-
              De 2021-2022, y es el único de este tipo en las diez
              convocatorias. Un cuarto de circunferencia con densidad variable.

  # ─────────────────────────────────────────────────────────────────────
  - id: edos
    apunte:
      texto: '17 de 32 ejercicios — el que más puntos reparte'
      tono: nota
    titulo: Las ecuaciones diferenciales
    pide: >-
      Clasificar una EDO y resolverla; traducir un enunciado en palabras a una
      ecuación; y en las de segundo orden, montar la solución con su homogénea
      y su particular.
    porque: >-
      Diecisiete de los treinta y dos ejercicios, y también en las diez
      convocatorias leídas: es el bloque que más pesa de toda la asignatura por
      convocatoria. Y hay algo que no pasa en ningún otro sitio: **clasificar es
      literalmente una pregunta del enunciado**, con puntos propios.
    invariante:
      anios: 10
      fuente: >-
        Contado sobre las quintas evaluaciones de 2015-2016 a 2025-2026 (falta
        2019-2020). Reparto de los diecisiete: seis son problemas contados en
        palabras —cadáver, paracaidista, barra, Everest, plan de ahorro y
        salmones—, cinco son de segundo orden con coeficientes indeterminados y
        resonancia, cuatro piden clasificar y resolver varias de primer orden a
        la vez, y dos exigen variación de parámetros porque el segundo miembro
        no cabe en ningún ensayo.
    dominio: >-
      Ante una EDO cualquiera, decir de qué tipo es y por qué en menos de
      treinta segundos, y resolverla con el método que le toca. Y en las de
      segundo orden, saber **antes** de ensayar si la particular resuena.
    escalones:
      - id: clasificar
        titulo: Clasificar, que aquí es media pregunta
        aprendes: >-
          Recorrer el árbol de decisión y decidir si una EDO es separable,
          homogénea, exacta, con factor integrante o lineal.
        dominio: >-
          Que el árbol te salga de memoria y en el orden bueno, y que sepas
          justificar cada casilla con una frase — porque eso es lo que se
          corrige.
        teoria:
          tema: t09-ecuaciones-diferenciales
          apartado: lo-primero-es-clasificar-y-eso-decide-todo
          nota: >-
            El orden del árbol no es arbitrario: se prueba lo barato primero, y
            una misma EDO puede caer en dos casillas.
        ejercicios:
          - id: ej-segundo-orden-dos-raices
            incrustado: true
            nota: >-
              La ecuación característica, que es por donde empieza todo lo de segundo orden.
          - id: ej-clasificar-cuatro-edos
            incrustado: true
            nota: >-
              Cuatro EDOs y sus cuatro casillas. Es exactamente el formato del
              apartado que cayó en 2022-2023 y en 2025-2026.
          - id: ex2526-5ev-2-clasificar-tres-edos
            nota: >-
              De 2025-2026, y el enunciado lo pide con esas palabras: «indicar
              de qué tipo es cada una».
          - id: ex2223-5ev-3-una-de-cada-tipo
            nota: >-
              De 2022-2023. Tres ecuaciones y tres cajas, una en cada una: si
              aciertas la caja, el método viene solo.

      - id: exactas
        titulo: Las exactas, que ya sabes hacer
        aprendes: >-
          Reconocer una EDO exacta con el mismo criterio del tema 8 y
          resolverla buscando su potencial.
        dominio: >-
          Ver una EDO escrita como $M\,dx+N\,dy=0$ y comprobar $M_{y}=N_{x}$ sin
          que nadie te lo pida, y saber que lo que sale es una familia
          $F(x,y)=C$ y no una $y$ despejada.
        teoria:
          tema: t09-ecuaciones-diferenciales
          apartado: exactas-y-el-factor-integrante
          nota: >-
            Es el bloque anterior con otra notación: $M\,dx+N\,dy$ es el campo
            $(M,N)$, la condición de exactitud es la de conservativo, y $F$ es
            el potencial.
        ejercicios:
          - id: ej-clasificar-cuatro-edos
            nota: >-
              Clasificar cuatro sin resolver ninguna. Reconocer que es exacta va antes que serlo.
          - id: ex2021-5ev-2-la-exacta-con-exponencial
            nota: >-
              De 2020-2021. La exacta esconde una exponencial doble; el criterio
              se comprueba igual y el potencial se busca igual.
          - id: ex1819-5ev-3-lineal-con-condicion-inicial
            nota: >-
              De 2018-2019, y sirve de contraste: esta no es exacta, es lineal,
              y se resuelve casi mirándola.

      - id: aplicados
        titulo: Traducir un enunciado en una ecuación
        aprendes: >-
          Escribir la EDO a partir de un problema en palabras, resolverla y
          contestar la pregunta que se hacía — que casi nunca es «resuelve».
        dominio: >-
          Traducir «tasa proporcional a…» sin dudar, saber que el equilibrio se
          saca resolviendo $y'=0$ **sin** resolver la ecuación, y poner tú los
          datos físicos que el enunciado da por sabidos.
        teoria:
          tema: t09-ecuaciones-diferenciales
          apartado: traducir-un-enunciado-en-una-ecuación
          nota: >-
            El diccionario es corto y sirve para todos: embalses, cadáveres,
            barras de metal, paracaidistas y planes de ahorro son la misma
            ecuación con otra ropa.
        ejercicios:
          - id: embalse-y-largo-plazo
            nota: >-
              De 2020-2021. Empieza por este: el apartado b) se contesta sin
              resolver nada, mirando dónde se anula la derivada.
          - id: ex1516-5ev-3-la-hora-del-crimen
            nota: >-
              De 2015-2016. La ley de Newton, y el dato que **no** está en el
              enunciado: los 37 °C del cuerpo vivo. Declararlo vale puntos.
          - id: ex1718-5ev-3-la-barra-en-agua-hirviendo
            nota: >-
              De 2017-2018, la misma ley con el dato escondido en otro sitio:
              «agua hirviendo» son 100 °C.
          - id: ex1617-5ev-1-el-paracaidista-y-su-velocidad-limite
            nota: >-
              De 2016-2017. Es de segundo orden, y aun así lo mejor de él es de
              este escalón: la velocidad límite sale imponiendo $y''=0$, en dos
              líneas.
          - id: ex2122-5ev-3-la-altura-del-everest
            nota: >-
              De 2021-2022. Una ecuación de una línea, y el resultado se
              contrasta con un dato del mundo real.
          - id: ex2324-5ev-2-el-plan-de-ahorro
            nota: >-
              De 2023-2024. Dinero, no física: el mismo modelo con aportaciones
              continuas.
          - id: ex2425-5ev-2-los-salmones-del-rio
            nota: >-
              De 2024-2025, y el más interesante: dos poblaciones iniciales
              muy distintas acaban en el mismo sitio, y eso se ve sin resolver.

      - id: segundo-orden
        titulo: Las de segundo orden, y cuándo resuena
        aprendes: >-
          Montar la solución como homogénea más particular, y elegir la forma de
          la particular comparándola antes con las raíces de la característica.
        dominio: >-
          Comparar **siempre** el segundo miembro con la homogénea antes de
          ensayar: si lo que vas a probar ya está dentro, hay que multiplicar
          por $x$. Y saber hacerlo cuando el segundo miembro tiene dos sumandos
          y solo uno resuena.
        teoria:
          tema: t09-ecuaciones-diferenciales
          apartado: segundo-orden-dos-piezas-que-se-suman
          nota: >-
            La resonancia es el error caro del bloque: no da un resultado
            equivocado, da un sistema imposible, y quien no lo reconoce pierde
            el ejercicio entero buscando la cuenta mal hecha.
        ejercicios:
          - id: particular-que-resuena
            nota: >-
              Empieza aquí: el caso mínimo, para ver qué pasa exactamente cuando
              se ensaya una particular que ya está en la homogénea.
          - id: ex2021-5ev-3-recta-y-resonancia
            nota: >-
              De 2020-2021. Dos sumandos: un polinomio que no resuena y un
              coseno que sí.
          - id: ex1819-5ev-4-coseno-que-resuena-y-exponencial
            nota: >-
              De 2018-2019, con el mismo reparto. Verlos seguidos enseña a
              separar los dos sumandos antes de tocar nada.
          - id: ex2425-5ev-3-resonancia-y-exponencial
            nota: >-
              De 2024-2025, otra vez dos términos y solo uno resonando. Que
              caiga tres años seguidos no es casualidad.
          - id: ex2324-5ev-3-deducir-el-coeficiente-y-resolver
            nota: >-
              De 2023-2024. Antes de resolver hay que deducir un coeficiente que
              el enunciado no da.
          - id: ex2223-5ev-4-la-edo-con-parametro
            nota: >-
              De 2022-2023, y es el que cierra el escalón: la misma ecuación
              tiene dos respuestas según cuánto valga el parámetro, porque de él
              depende si hay resonancia.

      - id: variacion
        titulo: Cuando el segundo miembro no cabe en ningún molde
        aprendes: >-
          Reconocer que los coeficientes indeterminados no sirven, y resolver
          por variación de parámetros.
        dominio: >-
          Saber en qué se fija uno para descartar el método de ensayo —si el
          segundo miembro no es polinomio, exponencial, seno o coseno, ni
          producto de ellos, no hay molde— y montar el sistema de variación sin
          equivocarse de signo.
        teoria:
          tema: t09-ecuaciones-diferenciales
          apartado: segundo-orden-dos-piezas-que-se-suman
          nota: >-
            El apartado explica el método de ensayo; la variación de parámetros
            es lo que queda cuando ese método no se puede aplicar, y ahí está el
            hueco declarado abajo.
        ejercicios:
          - id: ej-clasificar-cuatro-edos
            nota: >-
              El mismo árbol de clasificación: variación de constantes es lo que queda cuando nada más encaja.
          - id: ex2122-5ev-4-uno-partido-seno
            nota: >-
              De 2021-2022. El segundo miembro es $1/\operatorname{sen}2x$: no
              hay nada que ensayar.
          - id: ex2526-5ev-3-variacion-de-constantes
            nota: >-
              De 2025-2026, con $8e^{x}/(1+x^{2})$. Dos años distintos y la
              misma señal: cuando el segundo miembro es un cociente raro, el
              método es este.

      - id: cualitativo
        titulo: Sacarle información a una ecuación sin resolverla
        aprendes: >-
          Contestar sobre el comportamiento de la solución —equilibrio, límite,
          desarrollo en serie— sin llegar a resolver la ecuación.
        dominio: >-
          Ver una pregunta del tipo «¿qué pasa a largo plazo?» y no ponerte a
          integrar: se contesta con $y'=0$, o derivando la propia ecuación.
        teoria:
          tema: t09-ecuaciones-diferenciales
          apartado: estudiar-la-solución-sin-resolverla
          nota: >-
            En las diez quintas leídas esta técnica no cae como ejercicio
            propio: aparece **dentro** de los aplicados, en el apartado que
            pregunta a dónde tiende la población o la velocidad. Se practica
            aquí para reconocerla cuando llegue disfrazada.
        ejercicios:
          - id: estudio-cualitativo-sin-resolver
            nota: >-
              Del boletín de complementarios, etiquetado «2016/2017 4E»: cayó en
              la cuarta evaluación, no en la quinta. Se enlaza igual porque es
              la única puerta de entrada a este escalón, y reutiliza el Taylor
              del tema 4: el desarrollo sale derivando la ecuación, no la
              solución.

  # ─────────────────────────────────────────────────────────────────────
  - id: formato-antiguo
    apunte:
      texto: 'solo hasta 2018-2019 — por si acaso'
      tono: neutro
    titulo: Lo que la quinta arrastraba hasta 2018-2019
    pide: >-
      Una integral múltiple —cambiar el orden, o un centro de gravedad— y, en
      un curso, un gradiente leído de dos derivadas direccionales.
    porque: >-
      Tres de los treinta y dos ejercicios, y **solo en tres de las diez
      convocatorias**: 2015-2016, 2017-2018 y 2018-2019. Después de 2018-2019
      no ha vuelto a caer. Va al final y en un bloque aparte porque es material
      de la cuarta evaluación colado en la quinta, no un hueco propio: si tu
      profesor no lo arrastra, este bloque te sobra.
    invariante:
      anios: 3
      fuente: >-
        Ejercicio 1 de la quinta de 2015-2016 (gradiente a partir de dos
        derivadas direccionales), ejercicio 1 de la de 2017-2018 (cambio de
        orden de integración) y ejercicio 1 de la de 2018-2019 (centro de
        gravedad de un cuarto de disco). En las siete convocatorias restantes no
        aparece ninguno de los dos temas.
    dominio: >-
      Saber que puede caer, y tener localizada la ruta de la cuarta evaluación,
      que es donde estos dos temas se preparan de verdad.
    escalones:
      - id: multiple-en-la-quinta
        titulo: La integral múltiple, cuando cae aquí
        aprendes: >-
          Dibujar el recinto, cambiar el orden de integración y calcular un
          centro de gravedad.
        dominio: >-
          Que el dibujo del recinto te salga antes que los límites, y que sepas
          que cambiar el orden puede partir la integral en dos.
        teoria:
          tema: t07-integral-multiple
          apartado: cambiar-el-orden-de-integración
          nota: >-
            Este bloque no explica nada nuevo: la ruta de la cuarta evaluación
            lo prepara entero, y aquí solo se enlazan los dos que cayeron en la
            quinta.
        ejercicios:
          - id: ej-recinto-y-limites
            incrustado: true
            nota: >-
              Leer los límites de un recinto dibujado, antes de cambiarles el orden.
          - id: ex1718-5ev-1-el-orden-que-parte-en-dos
            nota: >-
              De 2017-2018. Al girar el orden la tapa cambia de curva y hacen
              falta dos integrales: ese es todo el ejercicio.
          - id: ex1819-5ev-1-el-cuarto-de-disco-mordido
            nota: >-
              De 2018-2019. Un centro de gravedad sobre un recinto con un
              cuadrado quitado, y la simetría ahorra la mitad de la cuenta.

      - id: gradiente-en-la-quinta
        titulo: El gradiente, el año que cayó aquí
        aprendes: >-
          Reconstruir el gradiente a partir de derivadas direccionales y usarlo
          para calcular otra.
        dominio: >-
          No olvidar normalizar el vector dirección, y leer bien el signo cuando
          la dirección apunta hacia abajo.
        teoria:
          tema: t06-varias-variables
          apartado: y-al-revés-deducir-el-gradiente-a-partir-de-datos
          nota: >-
            Igual que el escalón anterior: la preparación está en la ruta de la
            cuarta evaluación, y aquí solo se enlaza el que cayó en la quinta.
        ejercicios:
          - id: ej-direccional-sin-normalizar
            incrustado: true
            nota: >-
              La derivada direccional y el vector que hay que normalizar. Aquí se usa al revés.
          - id: ex1516-5ev-1-el-gradiente-desde-dos-direcciones
            nota: >-
              De 2015-2016, y el ejercicio entero es un signo: hacia $(1,1)$ se
              baja en $y$, así que la derivada direccional es $-F_{y}$.
    falta:
      # Aquí decía que la variación de parámetros no estaba en la prosa del
      # tema 9. Sí está —el apartado «Cuando los coeficientes indeterminados no
      # valen» la desarrolla entera— y el hueco se cerró sin retirar su aviso.
      # §11: un guardián se retira cuando su motivo desaparece, y un `falta[]`
      # es lo mismo. Comprobado el 28 de agosto de 2026.
      - >-
        El ejercicio `green-en-un-recinto-cerrado` **no da un número**, y no es
        un descuido: el boletín define sus puntos y sus tres curvas en una
        figura que no tenemos, así que se resuelve todo lo que no depende de
        ella —el potencial, por qué las tres trayectorias dan lo mismo, y el
        integrando de Green— y ahí se para. Está dicho también dentro del
        ejercicio.
      - >-
        La integral respecto de la longitud de arco tiene un solo ejercicio en
        toda la ruta, y es de examen: no hay ejemplo de entrada delante. Quien
        llegue sin haberla visto empieza por arriba.
      - >-
        El temario oficial lista «métodos numéricos» también dentro del tema 9,
        y aquí no hay ni Euler ni Runge-Kutta. Es el mismo hueco declarado en
        la ruta de la primera evaluación y con el mismo recuento detrás: de los
        425 ejercicios de las 88 convocatorias transcritas, **uno solo** pide
        un método numérico, y es de integración, no de ecuaciones
        diferenciales. De Euler y de Runge-Kutta, cero. Contado el 5 de
        septiembre de 2026.
      - >-
        **De 2019-2020 no hay quinta evaluación, y no sabemos con certeza por
        qué.** Lo que sí sabemos es lo que hay en el corpus: ese curso tiene
        primera, segunda y tercera evaluación, una recuperación fechada el 24
        de febrero de 2020, y después nada hasta un examen único de «mayo y
        junio de 2020» con trece ejercicios y ciento treinta puntos, el más
        grande de todo el corpus. Es la forma que tiene un curso que se
        interrumpe en marzo de 2020 y se resuelve con un examen global. Eso es
        una **lectura nuestra de las fechas**, no un dato del calendario de la
        escuela: si aquel año llegó a hacerse una quinta, no está en el
        material que tenemos. Los recuentos de esta ruta son sobre diez
        convocatorias y no sobre once, y así están contados.
      - >-
        El tema 9 tiene siete ejercicios propios para diecisiete de examen. Los
        de entrada —clasificar y separables— existen; los de segundo orden se
        apoyan casi enteros en los exámenes.
      - >-
        **Dos ejercicios están duplicados en el corpus.** `paracaidista-y-
        velocidad-limite` y `barra-que-se-calienta`, del boletín de
        complementarios, son los mismos problemas que la quinta de 2016-2017 y
        la de 2017-2018, ahora transcritas desde su PDF original. Esta ruta
        enlaza solo la versión de examen; los del boletín siguen en la página
        del tema 9 y habrá que decidir en la auditoría si se retiran.
      - >-
        No hay cronómetro ni forma de guardar lo hecho: el sitio es estático.
        Lo que sí se guarda en tu navegador es qué escalones has dominado.
