asignatura: calculo
evaluacion: quinta
titulo: Preparar la quinta evaluación
lede: >-
  Los temas 8 y 9, el otro 10 % del segundo cuatrimestre. Dos huecos que se
  reparten el examen a partes iguales: el trabajo de un campo a lo largo de una
  curva, y las ecuaciones diferenciales — donde clasificar es literalmente una
  pregunta del enunciado.
temas:
  - t08-integral-curvilinea
  - t09-ecuaciones-diferenciales
medidoSobre: 3
criterioDeOrden: >-
  Los dos bloques valen lo mismo, así que el orden lo decide otra cosa: la
  integral curvilínea va primero porque reutiliza el gradiente y el potencial
  de la cuarta evaluación, y porque las EDOs exactas —que son la mitad del
  segundo bloque— son campos conservativos con otro nombre. Hecho en este
  orden, el segundo bloque empieza con la mitad del trabajo ya hecha.

bloques:
  # ─────────────────────────────────────────────────────────────────────
  - id: curvilinea
    titulo: El trabajo de un campo a lo largo de una curva
    pide: >-
      Calcular la integral de un campo vectorial sobre una curva dada: un
      trabajo, casi siempre. La curva puede venir parametrizada, descrita con
      condiciones, o dibujada en una figura.
    porque: >-
      Ocupa el ejercicio 1 de los tres cursos leídos, y en 2022-2023 también el
      2. Y lo que se evalúa no es integrar: es **elegir el camino**. Los mismos
      diez puntos se sacan en cinco líneas o en media hora según lo que
      compruebes antes de empezar.
    invariante:
      anios: 3
      fuente: >-
        Ejercicio 1 de las quintas evaluaciones de 2022-2023 (integral de línea
        sobre una curva dada por condiciones), 2023-2024 (trabajo sobre una
        semicircunferencia, con figura) y 2025-2026 (tres trayectorias sobre la
        ladera de un monte, incluida una cerrada). En 2022-2023 el ejercicio 2
        era además un Green con parámetro.
    dominio: >-
      Ante cualquier integral curvilínea, decidir en menos de un minuto si el
      campo es conservativo y si la curva es cerrada, y solo entonces empezar.
      Y saber que si es conservativo y cerrada, la respuesta es cero.
    escalones:
      - id: parametrizar
        titulo: Parametrizar, y no equivocarse de sentido
        aprendes: >-
          Describir una curva con un solo parámetro y comprobar que el recorrido
          va en el sentido que pide el enunciado.
        dominio: >-
          Que las tres parametrizaciones de siempre —segmento, circunferencia y
          gráfica— te salgan sin pensar, y que compruebes el sentido
          sustituyendo el primer valor del parámetro.
        teoria:
          tema: t08-integral-curvilinea
          apartado: parametrizar-describir-la-curva-con-un-solo-parámetro
          nota: >-
            Si la curva es $y=f(x)$, la propia $x$ sirve de parámetro y no hay
            nada que inventar. Es la que más se olvida.
        ejercicios:
          - id: ej-parametrizar-un-segmento
            incrustado: true
            nota: >-
              Empieza aquí. Corto, y con la comprobación del sentido hecha
              explícita, que es lo que cambia el signo del resultado.

      - id: conservativo
        titulo: El atajo — comprobar si el campo es conservativo
        aprendes: >-
          Comprobar en diez segundos si un campo deriva de un potencial, y
          encontrar ese potencial cuando existe.
        dominio: >-
          Hacer la comprobación **siempre antes** de decidir el camino, y saber
          que al integrar sale $+g(y)$ y no $+C$.
        teoria:
          tema: t08-integral-curvilinea
          apartado: el-atajo-grande-campos-conservativos
          nota: >-
            Si el campo es conservativo, la integral solo depende de los
            extremos. Y sobre cualquier curva cerrada vale cero.
        ejercicios:
          - id: ej-conservativo-o-no
            incrustado: true
            nota: >-
              Dos campos casi iguales, uno conservativo y el otro no, para ver
              cuánto cambia la estrategia con una comprobación de diez segundos.
          - id: tres-caminos-mismo-trabajo
            nota: >-
              De 2015-2016, y es el caso de manual: tres curvas, una sola
              cuenta. El apartado c) es la circunferencia entera, y vale cero.

      - id: green
        titulo: Green, cuando la curva se cierra
        aprendes: >-
          Cambiar una integral sobre una curva cerrada por una integral doble
          sobre lo que encierra.
        dominio: >-
          Decir en voz alta las tres condiciones —cerrada, sentido positivo,
          parciales continuas dentro— y reconocer cuándo Green convierte cuatro
          parametrizaciones en una integral doble.
        teoria:
          tema: t08-integral-curvilinea
          apartado: green-cuando-la-curva-se-cierra
          nota: >-
            Y el puente entre los dos atajos: si el campo es conservativo el
            integrando de Green es cero, y por eso la integral cerrada se anula.
        ejercicios:
          - id: green-en-un-recinto-cerrado
            nota: >-
              De 2014-2015. Enfrenta los dos atajos en dos apartados: el primer
              campo es conservativo y el segundo no.

  # ─────────────────────────────────────────────────────────────────────
  - id: edos
    titulo: Las ecuaciones diferenciales
    pide: >-
      Clasificar una EDO y resolverla. Y en las de segundo orden, montar la
      solución con su homogénea y su particular.
    porque: >-
      Ocupa la otra mitad del examen en los tres cursos leídos. Y hay algo que
      no pasa en ningún otro bloque de la asignatura: **clasificar es
      literalmente una pregunta del enunciado**, con puntos propios. En
      2022-2023 se pedía rellenar una tabla de exacta/homogénea/lineal, y en
      2025-2026 «indicar de qué tipo es cada una de las siguientes EDO».
    invariante:
      anios: 3
      fuente: >-
        Ejercicios 3 y 4 de la quinta evaluación de 2022-2023, ejercicios 2 y 3
        de la de 2025-2026, y el bloque de EDOs de la de 2023-2024. En dos de
        los tres, clasificar aparece como apartado con puntuación propia.
    dominio: >-
      Ante una EDO cualquiera, decir de qué tipo es y por qué en menos de
      treinta segundos, y resolverla con el método que le toca. Y en las de
      segundo orden, saber cuándo la particular hay que multiplicarla por $x$.
    escalones:
      - id: clasificar
        titulo: Clasificar, que aquí es media pregunta
        aprendes: >-
          Recorrer el árbol de decisión y decidir si una EDO es separable,
          homogénea, exacta, con factor integrante o lineal.
        dominio: >-
          Que el árbol te salga de memoria y en el orden bueno, y que sepas
          justificar cada casilla con una frase — porque eso es lo que se
          corrige.
        teoria:
          tema: t09-ecuaciones-diferenciales
          apartado: lo-primero-es-clasificar-y-eso-decide-todo
          nota: >-
            El orden del árbol no es arbitrario: se prueba lo barato primero, y
            una misma EDO puede caer en dos casillas.
        ejercicios:
          - id: ej-clasificar-cuatro-edos
            incrustado: true
            nota: >-
              Cuatro EDOs y sus cuatro casillas. Es exactamente el formato del
              apartado que cayó en 2022-2023 y en 2025-2026.

      - id: resolver-primer-orden
        titulo: Resolver las de primer orden
        aprendes: >-
          Aplicar el método que le toca a cada tipo, empezando por separar
          variables.
        dominio: >-
          Que la constante no se te vaya de sitio: al integrar entra dentro, y
          en las separables sale como factor y no como sumando.
        teoria:
          tema: t09-ecuaciones-diferenciales
          apartado: lo-primero-es-clasificar-y-eso-decide-todo
        ejercicios:
          - id: ej-separable-basica
            incrustado: true
            nota: >-
              La más simple, con la condición inicial. La pieza trampa es justo
              el error de poner la constante sumando.

      - id: aplicados
        titulo: Traducir un enunciado en una ecuación
        aprendes: >-
          Escribir la EDO a partir de un problema en palabras, y contestar qué
          pasa a largo plazo.
        dominio: >-
          Traducir «tasa proporcional a…» sin dudar, y saber que el equilibrio
          se saca resolviendo $y'=0$ **sin** resolver la ecuación.
        teoria:
          tema: t09-ecuaciones-diferenciales
          apartado: traducir-un-enunciado-en-una-ecuación
          nota: >-
            El diccionario es corto y sirve para todos: embalses, epidemias,
            enfriamientos y paracaidistas son la misma ecuación con otra ropa.
        ejercicios:
          - id: embalse-y-largo-plazo
            nota: >-
              De 2020-2021. Y fíjate en el apartado b): se contesta sin resolver
              nada, mirando dónde se anula la derivada.

      - id: segundo-orden
        titulo: Las de segundo orden, en dos piezas
        aprendes: >-
          Montar la solución como homogénea más particular, y elegir la forma de
          la particular según el segundo miembro.
        dominio: >-
          Comparar siempre las raíces de la característica con lo que hay en
          $f(x)$: si la particular ya está en la homogénea, hay que multiplicar
          por $x$.
        teoria:
          tema: t09-ecuaciones-diferenciales
          apartado: segundo-orden-dos-piezas-que-se-suman
          nota: >-
            Y si el segundo miembro no es un polinomio, una exponencial ni un
            seno —como el $8e^{x}/(1+x^{2})$ de 2025-2026— los coeficientes
            indeterminados no valen y hay que ir a variación de parámetros.
        ejercicios:
          - id: estudio-cualitativo-sin-resolver
            nota: >-
              No es de segundo orden, pero va aquí porque es la otra cara del
              tema: sacarle información a una ecuación sin resolverla. Cayó en
              2016-2017 y reutiliza el Taylor del tema 4.
    falta:
      - >-
        Los trece exámenes de quinta evaluación no están transcritos. Los
        ejercicios de esta ruta salen del boletín de complementarios, que sí
        trae etiquetado el examen de origen.
      - >-
        Los recuentos están medidos sobre **tres** cursos —2022-2023, 2023-2024
        y 2025-2026— verificados uno a uno. Como en la cuarta evaluación, el
        formato antiguo era distinto y no se cuenta hasta leerlo.
      - >-
        El bloque de segundo orden se queda corto: hay un ejemplo de entrada y
        ningún ejercicio de examen transcrito sobre variación de parámetros ni
        sobre coeficientes indeterminados, que son las dos técnicas que caen.
      - >-
        No hay cronómetro ni forma de guardar lo hecho: el sitio es estático.
        Lo que sí se guarda en tu navegador es qué escalones has dominado.
