asignatura: algebra
evaluacion: ordinaria
titulo: Preparar la convocatoria ordinaria
lede: >-
  El examen de Álgebra es el más previsible de los que hay aquí. Cuatro
  ejercicios, y **los cuatro huecos están fijos**: espacios vectoriales,
  aplicaciones lineales, espacios euclídeos y diagonalización. Ocho
  convocatorias leídas —**cuatro cursos**, de 2021-22 a 2024-25, ordinaria y
  extraordinaria— y treinta y dos ejercicios contados, sin fallar ni una vez.
  Lo que cambia son los números.
temas:
  - t01-espacios-vectoriales
  - t02-aplicaciones-lineales
  - t04-determinantes
  - t05-sistemas-lineales
  - t06-espacios-euclideos
  - t07-diagonalizacion
medidoSobre: 8
criterioDeOrden: >-
  Los bloques van en el orden de los huecos del examen, y eso aquí no es
  pereza: los huecos son fijos y salen siempre en el mismo orden. Delante va el
  suelo —resolver sistemas y calcular rangos—, que no ocupa ningún hueco y sin
  el cual no se termina ninguno de los cuatro. Y detrás, el formulario, que es
  repaso y no aprendizaje. Los recuentos de cada bloque están medidos sobre las
  ocho convocatorias transcritas, y cuando una cifra se refiere solo a las
  cuatro ordinarias se dice con esas palabras.

bloques:
  # ═══════════════════════════════════════════════════════════════════
  # SUELO
  # ═══════════════════════════════════════════════════════════════════
  - id: resolver-y-rangos
    apunte:
      texto: 'no da puntos — los sostiene todos'
      tono: marco
    titulo: Resolver sistemas y calcular rangos
    pide: >-
      No lo pide con estas palabras: lo pide con «hallar una base del núcleo»,
      «calcular las coordenadas en la base B'», «hallar la intersección de los
      subespacios» y «hallar los vectores propios». Las cuatro son lo mismo.
    porque: >-
      **Ningún ejercicio de las ocho convocatorias es «un ejercicio de
      sistemas»**: cero de treinta y dos. Y sin embargo se resuelve un sistema
      en los cuatro huecos, todas las veces. Todo núcleo es un sistema
      homogéneo; toda coordenada en una base nueva es un sistema; toda
      intersección de subespacios es un sistema; todo vector propio es un
      sistema. Va primero por el mismo motivo que el bloque de dibujar en
      Cálculo: no da puntos por sí mismo, y sin él los otros cuatro no se
      terminan a tiempo.
    invariante:
      anios: 8
      fuente: >-
        Contado sobre los 32 ejercicios de las ocho convocatorias: ninguno
        ocupa el hueco con un enunciado de sistemas, y los cuatro huecos de las
        ocho piden al menos un núcleo, unas coordenadas o unos vectores propios.
    dominio: >-
      Que ante un sistema con parámetro sepas que primero va el determinante y
      solo después los casos, y que ante un homogéneo no escribas nunca
      «incompatible».
    escalones:
      - id: rouche-y-los-parametros
        titulo: Clasificar antes de resolver
        aprendes: >-
          Decir si un sistema tiene solución, cuántas y de cuántos parámetros
          depende, comparando dos rangos y sin haber despejado nada.
        dominio: >-
          Que sepas de antemano cuántos parámetros va a tener la respuesta —es
          $n-r$— y que ante un sistema con parámetro abras dos casos y no diez.
        teoria:
          tema: t05-sistemas-lineales
          apartado: rouché-fröbenius-la-clasificación-en-dos-comparaciones
          nota: >-
            El árbol de decisión de la figura es lo que hay que llevar en la
            cabeza: dos comparaciones y ya está clasificado.
        ejercicios:
          - id: ejalg5-rouche-en-dos-comparaciones
            incrustado: true
            nota: >-
              El más corto, y el que enseña a mirar antes de escalonar: la
              tercera ecuación es la suma de las dos primeras.
          - id: ejalg5-bol51-dos-parametros-y-tres-casos
            nota: >-
              Del boletín, con **dos** parámetros. Y el guion los separa: uno se
              decide sin tocar el otro.
      - id: el-homogeneo-es-el-nucleo
        titulo: El homogéneo, que nunca es incompatible
        aprendes: >-
          Reconocer que un núcleo, una intersección y un subespacio propio son
          el mismo objeto —el conjunto solución de un homogéneo— y resolverlos
          con el mismo procedimiento.
        dominio: >-
          Que ante «halla una base de Ker f» escribas directamente el sistema
          $A\overline{x}=\overline{0}$ sin preguntarte si tendrá solución.
        teoria:
          tema: t05-sistemas-lineales
          apartado: los-sistemas-homogéneos-son-otro-problema
          nota: >-
            Y la frase que conecta el tema con los otros seis: las soluciones de
            un homogéneo forman subespacio; las de uno no homogéneo, no.
        ejercicios:
          - id: ejalg5-un-homogeneo-nunca-es-incompatible
            incrustado: true
            nota: >-
              Dos ecuaciones y tres incógnitas, y el conjunto solución es una
              recta que pasa por el origen. Esa recta es un núcleo.
          - id: ejalg5-bol54-el-nucleo-es-un-sistema-homogeneo
            nota: >-
              Del boletín, y es literalmente un ejercicio de aplicaciones
              lineales resuelto como sistema, con parámetro dentro.
      - id: el-rango-que-todo-lo-decide
        titulo: El rango, que aparece en los cuatro huecos
        aprendes: >-
          Calcular el rango de una matriz con y sin parámetro, y saber qué está
          contando en cada sitio: dimensión de la imagen, número de vectores
          independientes, o número de ecuaciones que de verdad restringen.
        dominio: >-
          Que ante una matriz con parámetro calcules primero el determinante y
          solo abras casos donde se anula, en vez de escalonar dividiendo por
          expresiones que podrían ser cero.
        teoria:
          tema: t04-determinantes
          apartado: el-rango
          nota: >-
            La tabla de «si te dan X, usa Y» es la que ahorra tiempo: con
            números, Gauss; con parámetro, determinantes.
        ejercicios:
          - id: ejalg4-el-rango-con-un-parametro-dentro
            incrustado: true
            nota: >-
              Un solo valor estropea el rango, y ahí baja a 1 y no a 2, que es
              lo que casi todo el mundo contesta por inercia.
          - id: ejalg4-bol415-dos-rangos-por-relaciones-entre-filas
            nota: >-
              Del boletín: una $5\times5$ y una $5\times6$ con fracciones, y
              las dos tienen rango 2. Buscar filas proporcionales antes de
              escalonar es lo que enseña.
          - id: ejalg4-bol417-examen-rango-de-a-mas-uno-en-la-diagonal
            nota: >-
              De examen: el rango de $aI+J$ según $a$, con los dos valores
              que lo bajan y cuánto lo bajan.
          - id: ejalg4-las-propiedades-antes-que-la-cuenta
            nota: >-
              Cinco determinantes sin desarrollar ninguno. El del escalar,
              $\left|2A\right|$, es el que cae en el examen.
    falta:
      - >-
        No hay ningún ejercicio guiado del método de Cramer. El temario lo
        incluye y el examen no lo ha pedido nunca en las ocho convocatorias,
        así que de momento solo está en la prosa.

  # ═══════════════════════════════════════════════════════════════════
  # HUECO 1
  # ═══════════════════════════════════════════════════════════════════
  - id: hueco-1-subespacios
    apunte:
      texto: 'las 8 convocatorias — 7 piden demostrar'
      tono: nota
    titulo: Hueco 1 · Demostrar que algo es subespacio, con base y dimensión
    pide: >-
      «Demostrar que S+T es subespacio vectorial», «estudiar si W es subespacio
      vectorial y hallar una base y la dimensión», «hallar las coordenadas del
      vector en la base B'».
    porque: >-
      El ejercicio 1 es de espacios vectoriales en **las ocho convocatorias**,
      sin una excepción. Y dentro de él: **siete de ocho** piden demostrar que
      algo es subespacio, **siete de ocho** piden una base o una dimensión,
      **seis de ocho** piden unas coordenadas y **cinco de ocho** ponen el
      subespacio dentro de un espacio de **matrices**, no de $\mathbb{R}^{n}$.
    invariante:
      anios: 8
      fuente: >-
        Contado sobre los ocho enunciados del ejercicio 1, uno por convocatoria.
        La única que no pide una demostración de subespacio es la ordinaria de
        2022-2023, que pide bases de la suma y la intersección y dos cambios de
        base.
    dominio: >-
      Que ante cualquier conjunto sepas decidir en diez segundos si el vector
      nulo está dentro, y que si lo está sepas escribirlo como $L(G)$ en una
      línea en vez de comprobar las dos condiciones.
    escalones:
      - id: es-subespacio-o-no
        titulo: Decidirlo, y demostrarlo en una línea
        aprendes: >-
          Descartar un conjunto en diez segundos mirando si contiene al vector
          nulo, y demostrar que otro sí lo es escribiéndolo como una clausura
          lineal.
        dominio: >-
          Que ante un término independiente no nulo, un cuadrado o una
          desigualdad escribas «no» sin más cuentas; y que ante un conjunto
          dado por parámetros escribas $L(G)$ y con eso lo des por demostrado.
        teoria:
          tema: t01-espacios-vectoriales
          apartado: subespacio-la-comprobación-que-cabe-en-tres-líneas
          nota: >-
            La tabla de los cinco casos del boletín resume el criterio: lineal e
            **igualada a cero**, o no lo es.
        ejercicios:
          - id: ejalg1-lo-primero-es-mirar-el-cero
            incrustado: true
            nota: >-
              Tres conjuntos, y el tercero enseña el límite del atajo: contiene
              al cero y aun así no es subespacio.
          - id: ejalg1-bol6-cuales-son-subespacios-de-r3
            nota: >-
              Del boletín, ocho de golpe. Cinco lo son, y el que cuesta es el de
              $xyz\in\mathbb{Q}$.
          - id: ejalg1-bol7-ocho-candidatos-a-subespacio-de-r4
            nota: >-
              Ocho conjuntos de $\mathbb{R}^{4}$ y dos filtros que deciden
              seis: ¿está el cero? ¿los parámetros recorren $\mathbb{R}$?
          - id: ejalg1-bol8-subespacios-de-funciones
            nota: >-
              Los vectores son funciones y el criterio es el mismo. Un
              cuadrado, una constante, y una condición lineal homogénea.
          - id: exalg2223-ext-1-un-subespacio-y-otro-que-no-lo-es
            nota: >-
              De la extraordinaria de 2022-2023, y con matrices de $2\times3$:
              dos conjuntos casi iguales y solo uno vale.
      - id: base-y-dimension-de-un-subespacio
        titulo: Del elemento genérico a la base
        aprendes: >-
          Sacar una base y la dimensión de cualquier subespacio dado por
          parámetros o por ecuaciones, con el mismo procedimiento de tres pasos.
        dominio: >-
          Que ante un subespacio de matrices —traza nula, simétricas,
          antisimétricas— escribas el elemento genérico, lo separes por
          parámetros y leas la base sin dudar.
        teoria:
          tema: t01-espacios-vectoriales
          apartado: generar-qué-significa-lg
          nota: >-
            El procedimiento de tres pasos vale igual para $\mathbb{R}^{n}$,
            para matrices y para polinomios. Es el mismo.
        ejercicios:
          - id: ejalg1-del-elemento-generico-a-la-base
            incrustado: true
            nota: >-
              El molde, sobre un subespacio de $\mathbb{R}^{4}$ dado por
              parámetros.
          - id: exalg2122-ord-1-simetricas-y-antisimetricas-parten-el-espacio
            nota: >-
              De la ordinaria de 2021-2022: las simétricas y las antisimétricas
              llenan entre las dos el espacio de las matrices.
          - id: exalg2324-ext-1-dos-combinaciones-y-las-matrices-de-traza-nula
            nota: >-
              De la extraordinaria de 2023-2024, con las matrices de traza nula.
              Es el subespacio de matrices que más ha caído.
          - id: ejalg1-bol22-base-de-un-hiperplano-y-completarla
            nota: >-
              Una ecuación en $\mathbb{R}^{4}$: base de tres vectores y uno
              solo para completar, que tiene que salirse del hiperplano.
          - id: ejalg1-bol23-un-plano-de-r3-dado-por-su-base
            nota: >-
              Todo lo que se le puede preguntar a un plano: ecuación,
              pertenencia, completar, coordenadas. Cinco apartados.
          - id: exalg2324-ord-1-cambiar-de-base-para-que-salga-1-0-0
            nota: >-
              De la ordinaria de 2023-2024, y va al revés: en vez de dar el
              subespacio y pedir la base, da el vector y pide la base en la que
              sus coordenadas son $\left(1,0,0\right)$.
      - id: coordenadas-y-cambio-de-base
        titulo: Coordenadas, y el sentido que decide el apartado
        aprendes: >-
          Pasar coordenadas de una base a otra sabiendo cuál de los dos sentidos
          es multiplicar y cuál es resolver un sistema.
        dominio: >-
          Que antes de escribir nada sepas decir en voz alta si el apartado que
          tienes delante es «multiplicar» o «resolver», y que compruebes el
          resultado sustituyéndolo en la combinación lineal.
        teoria:
          tema: t01-espacios-vectoriales
          apartado: cambiar-de-base-y-en-qué-sentido-va-cada-cosa
          nota: >-
            La tabla de dos filas es todo el apartado. El error de multiplicar
            cuando había que resolver produce un vector presentable y
            equivocado.
        ejercicios:
          - id: ejalg1-las-coordenadas-y-el-sentido-del-cambio
            incrustado: true
            nota: >-
              Los dos sentidos seguidos, en $\mathbb{R}^{2}$, para que se vea la
              diferencia de coste.
          - id: ejalg1-bol18-otra-base-y-las-coordenadas-en-ella
            nota: >-
              Del boletín: demostrar que es base con un determinante, y luego
              unas coordenadas en el sentido caro.
          - id: ejalg1-bol20-una-base-escalonada-y-el-cambio-en-los-dos-sentidos
            nota: >-
              La base nueva viene en escalera: matriz triangular, y el
              cambio inverso se despeja de abajo arriba sin invertir.
          - id: ejalg1-bol27-examen-la-suma-es-subespacio-y-una-base-nueva
            nota: >-
              De examen, con teoría delante. Las coordenadas salen con
              fracciones, y eso es normal: el determinante es 12.
          - id: exalg2223-ord-1-la-suma-la-interseccion-y-una-base-nueva
            nota: >-
              De la ordinaria de 2022-2023, y trae los **dos** sentidos en el
              mismo ejercicio, uno detrás de otro.
      - id: suma-e-interseccion
        titulo: La suma se ve, la intersección hay que buscarla
        aprendes: >-
          Calcular bases y dimensiones de $S+T$ y $S\cap T$ eligiendo la forma
          cómoda de cada uno, y comprobarlo con Grassmann.
        dominio: >-
          Que ante uno dado por generadores y otro por ecuaciones no conviertas
          nada: los generadores para la suma, las ecuaciones para la
          intersección.
        teoria:
          tema: t01-espacios-vectoriales
          apartado: suma-e-intersección-por-qué-dos-y-dos-no-dan-cuatro
          nota: >-
            La tabla de «se pide / forma cómoda» es la que ahorra el apartado, y
            Grassmann al final es una comprobación gratis.
        ejercicios:
          - id: ejalg1-bol12-suma-e-interseccion-en-r3
            incrustado: true
            nota: >-
              Un plano y una recta que no está dentro: se cortan solo en el
              origen y entre los dos llenan el espacio.
          - id: exalg2122-ext-1-un-subespacio-por-generadores-y-otro-por-ecuaciones
            nota: >-
              De la extraordinaria de 2021-2022, y es el caso cómodo servido:
              uno viene por generadores y el otro por ecuaciones.
          - id: ejalg1-bol16-dos-planos-de-r4-que-solo-comparten-el-cero
            nota: >-
              Uno por generadores y otro por ecuaciones: el genérico de uno
              se mete en las ecuaciones del otro. Aquí no queda nada, y la
              suma es todo.
          - id: ejalg1-bol32-examen-ligado-y-dos-planos-de-r4
            nota: >-
              De examen: la demostración de que en un sistema ligado alguien
              es combinación, y dos planos que comparten una recta.
          - id: exalg2425-ord-1-la-suma-de-subespacios-y-una-base-de-r4
            nota: >-
              De la ordinaria de 2024-2025, con la demostración de que $S+T$ es
              subespacio y una base que hay que completar.
    falta:
      - >-
        No hay ningún ejercicio guiado sobre espacios de polinomios, y el
        boletín trae dos. El examen no los ha pedido en las ocho convocatorias,
        pero el temario los incluye.

  # ═══════════════════════════════════════════════════════════════════
  # HUECO 2
  # ═══════════════════════════════════════════════════════════════════
  - id: hueco-2-aplicaciones
    apunte:
      texto: 'las 8 convocatorias — matriz, núcleo e imagen'
      tono: nota
    titulo: Hueco 2 · La matriz asociada, el núcleo y la imagen
    pide: >-
      «Calcular la matriz asociada a la aplicación lineal», «calcular bases y
      dimensiones de Im f y Ker f», «clasificar la aplicación».
    porque: >-
      El ejercicio 2 es de aplicaciones lineales en **las ocho convocatorias**.
      Y pide siempre lo mismo: la **matriz asociada** en las ocho, **bases y
      dimensiones de Ker e Im** en las ocho, **clasificar** en siete de ocho, y
      una demostración de teoría en siete de ocho. Es el ejercicio más
      previsible del examen entero.
    invariante:
      anios: 8
      fuente: >-
        Contado sobre los ocho enunciados del ejercicio 2. La única que no pide
        «clasificar» con esa palabra es la ordinaria de 2023-2024, y la única
        que no dice «demostrar» es la extraordinaria de 2024-2025, que lo pide
        como «razonar las afirmaciones».
    dominio: >-
      Que ante tres datos cruzados sepas llegar a la matriz sin dudar del
      orden, y que la compruebes contra los datos del enunciado antes de seguir.
    escalones:
      - id: la-matriz-en-columnas
        titulo: La matriz, y por qué va en columnas
        aprendes: >-
          Escribir la matriz asociada a una aplicación lineal y comprobarla
          contra los datos del enunciado, sin confundirla con su traspuesta.
        dominio: >-
          Que después de escribir la matriz multipliques por los vectores del
          enunciado y compruebes que salen sus imágenes. Es lo único que caza
          una traspuesta.
        teoria:
          tema: t02-aplicaciones-lineales
          apartado: la-matriz-asociada-y-por-qué-las-imágenes-van-en-columnas
          nota: >-
            La hoja de teoría de este tema **no** define la matriz asociada:
            está en la de Matrices. No es cosa tuya.
        ejercicios:
          - id: ejalg2-es-lineal-o-no-lo-es
            nota: >-
              Va el primero porque va antes en el examen: si la aplicación no
              es lineal, no hay ninguna matriz que escribir.
          - id: ejalg2-la-matriz-sale-de-las-columnas
            incrustado: true
            nota: >-
              El molde, con una aplicación de $\mathbb{R}^{2}$ en
              $\mathbb{R}^{3}$: el orden de la matriz ya dice mucho.
          - id: ejalg2-bol1-cuales-son-lineales
            nota: >-
              Del boletín, y los mismos tres casos con otros números: un término
              independiente, un producto de variables, y una que sí lo es.
          - id: ejalg2-bol8-imagenes-antiimagenes-y-el-nucleo
            nota: >-
              Cuatro imágenes de la base, y con ellas una imagen, una
              antiimagen (que es una recta, no un punto) y el núcleo.
          - id: ejalg3-bol310-matriz-asociada-de-una-formula
            nota: >-
              Del boletín de matrices, pero es este ejercicio: de la fórmula a
              la matriz y de la matriz al núcleo.
      - id: datos-cruzados
        titulo: Cuando el enunciado da los datos torcidos
        aprendes: >-
          Despejar las imágenes de la base canónica a partir de tres datos
          mezclados, y reconocer que un núcleo dado también es un dato de
          imagen.
        dominio: >-
          Que ante «Ker f = {x = y, z = 0}» escribas
          $f\left(1,1,0\right)=\overline{0}$ sin pensarlo, y que compruebes que
          los vectores de partida forman base antes de despejar.
        teoria:
          tema: t02-aplicaciones-lineales
          apartado: cuando-los-datos-vienen-cruzados
          nota: >-
            Los cuatro pasos, y el primero —comprobar que son base— es el que
            se salta y el que decide si los datos determinan $f$.
        ejercicios:
          - id: ejalg2-bol9-tres-datos-encadenados
            incrustado: true
            nota: >-
              Del boletín, y las restas están servidas: cada dato sale del
              anterior.
          - id: exalg2223-ord-2-el-nucleo-dado-y-la-matriz-que-sale-de-el
            nota: >-
              De la ordinaria de 2022-2023: el núcleo es el tercer dato, y sin
              esa lectura el sistema no se cierra.
          - id: ejalg2-bol14-la-expresion-desde-tres-imagenes
            nota: >-
              Tres imágenes que no son de la base canónica, y hay que
              deshacerlas para llegar a la fórmula de $f$.
          - id: ejalg2-bol16-examen-inyectiva-y-nucleo-trivial
            nota: >-
              De examen: la equivalencia inyectiva ⟺ núcleo trivial, y una
              $f$ dada por tres combinaciones que hay que despejar.
          - id: exalg2122-ord-2-tres-datos-cruzados-y-el-nucleo-por-ecuaciones
            nota: >-
              De la ordinaria de 2021-2022, con los datos en dos parejas y el
              núcleo por ecuaciones.
      - id: nucleo-imagen-y-clasificar
        titulo: Núcleo, imagen y la fórmula que decide antes de calcular
        aprendes: >-
          Dar bases y dimensiones del núcleo y la imagen leyendo las columnas, y
          clasificar la aplicación con la fórmula de las dimensiones.
        dominio: >-
          Que ante $f:\mathbb{R}^{4}\to\mathbb{R}^{3}$ digas «no puede ser
          inyectiva» antes de leer los datos, y que en un endomorfismo sepas
          que las dos propiedades van juntas.
        teoria:
          tema: t02-aplicaciones-lineales
          apartado: la-fórmula-de-las-dimensiones-y-lo-que-decide-antes-de-calcular
          nota: >-
            La tercera fila de la tabla es la que más se falla: en un
            endomorfismo, inyectiva y sobreyectiva van siempre juntas.
        ejercicios:
          - id: ejalg2-lo-que-la-formula-decide-antes-de-calcular
            incrustado: true
            nota: >-
              Y es el contraejemplo de la frase de arriba: sobreyectiva y no
              inyectiva a la vez, porque **no** es un endomorfismo.
          - id: ejalg2-bol7-nucleo-e-imagen-de-una-formula
            nota: >-
              Del boletín, con una variable que no aparece en la fórmula: media
              respuesta antes de plantear nada.
          - id: exalg2425-ord-2-inyectiva-si-y-solo-si-el-nucleo-es-cero
            nota: >-
              De la ordinaria de 2024-2025, y trae la demostración que más cae
              del hueco.
          - id: ejalg2-bol4-de-r4-en-r3-nucleo-e-imagen
            nota: >-
              Rango 3 de $\mathbb{R}^{4}$ a $\mathbb{R}^{3}$: la imagen es todo
              y el núcleo, una recta que hay que encontrar y comprobar.
          - id: ejalg2-bol15-examen-ligado-va-a-ligado
            nota: >-
              De examen: la demostración de que un sistema ligado va a uno
              ligado, y un endomorfismo de rango 2 que hay que clasificar.
          - id: exalg2324-ord-2-la-imagen-de-una-base-genera-la-imagen
            nota: >-
              De la ordinaria de 2023-2024, y es la otra mitad del teorema: las
              imágenes de una base **generan** la imagen, pero no siempre son
              base de ella.
    falta:
      - >-
        Dos convocatorias piden la matriz asociada **en otra base** que no es la
        canónica, y no hay ningún ejercicio guiado de eso: solo está el enunciado
        de examen. Es el hueco más claro de este bloque.

  # ═══════════════════════════════════════════════════════════════════
  # HUECO 3 · el que distingue la ordinaria
  # ═══════════════════════════════════════════════════════════════════
  - id: hueco-3-euclideos
    apunte:
      texto: 'lo que distingue la ordinaria — 4 de 8'
      tono: neutro
    titulo: Hueco 3 · Producto escalar y base ortonormal
    pide: >-
      «Definir producto escalar y norma», «demostrar la desigualdad
      triangular», «encontrar una base ortonormal de U», «completando la base
      anterior, encontrar una base ortonormal de R³».
    porque: >-
      **Este es el bloque que distingue la ordinaria de la extraordinaria**, y
      no es una impresión: el hueco 3 es de espacios euclídeos en **las cuatro
      ordinarias** y de determinantes en **las cuatro extraordinarias**. No
      rota: está partido por convocatoria. Dentro de las cuatro ordinarias, las
      cuatro piden una **base ortonormal**, y **tres de las ocho** convocatorias
      definen un producto escalar que **no es el usual**.
    invariante:
      anios: 4
      fuente: >-
        Contado sobre las cuatro convocatorias ordinarias transcritas
        —2021-2022, 2022-2023, 2023-2024 y 2024-2025—: en las cuatro el
        ejercicio 3 es de espacios euclídeos y en las cuatro pide una base
        ortonormal. En las cuatro extraordinarias, ninguna.
    dominio: >-
      Que ortonormalices una base con el producto escalar del enunciado sin
      caer ni una vez en la norma de siempre, y que compruebes al final las
      normas y los productos cruzados.
    escalones:
      - id: que-es-producto-escalar
        titulo: Qué tiene que cumplir, y cuál falla
        aprendes: >-
          Decidir si una forma bilineal es producto escalar, y encontrar el
          valor del parámetro que lo consigue cuando el enunciado lo pide.
        dominio: >-
          Que compruebes las tres propiedades en el orden barato —bilineal,
          simétrica, definida positiva— y que sepas que la tercera se lee en
          los menores principales de la matriz.
        teoria:
          tema: t06-espacios-euclideos
          apartado: qué-tiene-que-cumplir-para-ser-producto-escalar
          nota: >-
            El criterio de los menores principales es el que resuelve los
            ejercicios con parámetro, y «positivos» no es «no nulos».
        ejercicios:
          - id: ejalg6-que-hace-falta-para-ser-producto-escalar
            incrustado: true
            nota: >-
              Tres candidatos y solo uno vale. El tercero falla de una forma más
              sutil que el segundo.
          - id: ejalg6-bol66-el-parametro-que-lo-hace-producto-escalar
            nota: >-
              Del boletín, marcado como ejercicio de examen: la simetría fija el
              parámetro y la definida positiva lo confirma.
      - id: gram-schmidt-con-el-producto-del-enunciado
        titulo: Gram-Schmidt, con el producto escalar que toque
        aprendes: >-
          Ortonormalizar una base con cualquier producto escalar, restando en
          cada paso las proyecciones sobre **todos** los vectores anteriores.
        dominio: >-
          Que al tercer vector le restes dos proyecciones y no una, y que
          normalices con la norma del enunciado y no con la raíz de la suma de
          cuadrados.
        teoria:
          tema: t06-espacios-euclideos
          apartado: gram-schmidt
          nota: >-
            La figura enseña lo único que hay que entender: se resta la sombra
            del vector sobre el anterior. Lo demás es aritmética.
        ejercicios:
          - id: ejalg6-gram-schmidt-paso-a-paso
            incrustado: true
            nota: >-
              Dos vectores y el tercero de regalo, con el producto usual y
              números que salen enteros.
          - id: ejalg6-bol642-ortonormalizar-una-base-de-r3
            nota: >-
              Del boletín, con los tres vectores y las restas creciendo. Aquí
              las normas ya no salen enteras.
          - id: exalg2122-ord-3-ortonormalizar-con-un-producto-escalar-que-no-es-el-de-siempre
            nota: >-
              De la ordinaria de 2021-2022, y es **el** ejercicio de este bloque:
              con ese producto, $\left(1,1,0\right)$ tiene norma $1$.
          - id: exalg2223-ord-3-determinantes-de-memoria-y-una-base-ortonormal
            nota: >-
              De la ordinaria de 2022-2023, con el producto usual y cinco
              determinantes de propina en el apartado a).
      - id: completar-y-proyectar
        titulo: Completar la base, y el complemento ortogonal
        aprendes: >-
          Ampliar una base ortonormal de un subespacio hasta el espacio entero,
          y descomponer un vector en su parte dentro y su parte perpendicular.
        dominio: >-
          Que sepas que el producto vectorial **solo** vale con el producto
          escalar usual, y que con cualquier otro hay que imponer las ecuaciones
          de ortogonalidad.
        teoria:
          tema: t06-espacios-euclideos
          apartado: completar-a-base-de-todo-el-espacio
          nota: >-
            La tabla de dos filas dice cuándo vale cada camino. El segundo es
            más largo de escribir y es el único que vale siempre.
        ejercicios:
          - id: ejalg6-el-complemento-ortogonal-y-la-proyeccion
            incrustado: true
            nota: >-
              Los coeficientes de la ecuación del plano son el vector
              perpendicular: un atajo que ahorra plantear el sistema.
          - id: exalg2324-ord-3-matrices-ortogonales-y-un-producto-escalar-torcido
            nota: >-
              De la ordinaria de 2023-2024, con otro producto escalar definido
              en el enunciado.
          - id: exalg2425-ord-3-idempotentes-y-una-base-ortonormal
            nota: >-
              De la ordinaria de 2024-2025: tres afirmaciones que razonar y una
              base ortonormal.
    falta:
      - >-
        El boletín define productos escalares sobre **funciones** —integrales en
        un intervalo— y sobre **matrices** —la traza de $AB^{T}$—, y no hay
        ningún ejercicio guiado de esos. El examen no los ha pedido en las ocho
        convocatorias, pero el temario los contempla.

  # ═══════════════════════════════════════════════════════════════════
  # HUECO 4
  # ═══════════════════════════════════════════════════════════════════
  - id: hueco-4-diagonalizar
    apunte:
      texto: 'las 8 — y siempre con demostración'
      tono: nota
    titulo: Hueco 4 · Diagonalizar, y decidir cuándo se puede
    pide: >-
      «Definir valor propio y vector propio», «demostrar que el polinomio
      característico no varía al cambiar de base», «¿son diagonalizables? En los
      casos afirmativos, diagonalizar dando la matriz de cambio de base».
    porque: >-
      El ejercicio 4 es de diagonalización en **las ocho convocatorias**, sin
      una excepción, y en las ocho pide **una demostración de teoría** además
      del cálculo. **Seis de las ocho** meten un parámetro dentro. Y el
      enunciado de esa demostración se repite: «el polinomio característico no
      varía al cambiar de base» sale **tres veces de ocho**.
    invariante:
      anios: 8
      fuente: >-
        Contado sobre los ocho enunciados del ejercicio 4. Las dos que no llevan
        parámetro son las ordinarias de 2023-2024 y 2024-2025. La demostración
        repetida está anotada en el `examen.yaml` de las tres convocatorias
        donde aparece.
    dominio: >-
      Que ante una matriz con parámetro factorices el polinomio primero y solo
      calcules rangos en los valores donde dos autovalores coinciden, y que ante
      una simétrica contestes «diagonaliza» sin calcular ningún rango.
    escalones:
      - id: autovalores-con-atajos
        titulo: Los autovalores, sin desarrollar el determinante
        aprendes: >-
          Sacar autovalores usando la traza, el determinante y los tres atajos
          —filas proporcionales, filas que suman igual, matriz triangular— antes
          de desarrollar nada.
        dominio: >-
          Que ante una matriz cuyas filas suman lo mismo escribas ese número
          como autovalor y $\left(1,\dots,1\right)$ como su autovector, sin
          cuentas.
        teoria:
          tema: t07-diagonalizacion
          apartado: leerlo-sin-desarrollarlo
          nota: >-
            La tabla de tres atajos, y las dos comprobaciones gratis: los
            autovalores suman la traza y multiplican el determinante.
        ejercicios:
          - id: ejalg7-autovalor-y-autovector-de-una-2x2
            incrustado: true
            nota: >-
              El más pequeño posible, y ya usa el atajo de las filas que suman
              igual.
          - id: ejalg7-bol72-traza-y-determinante-contra-autovalores
            nota: >-
              Del boletín: la traza y el determinante como comprobación
              gratis de los autovalores, antes de creerse el polinomio.
          - id: ejalg7-bol716-tres-filas-proporcionales
            nota: >-
              Sumar 1 a la diagonal deja tres filas proporcionales: un
              autovalor doble con su plano, sin polinomio característico.
          - id: exalg2223-ord-4-el-mismo-polinomio-y-solo-una-diagonaliza
            nota: >-
              De la ordinaria de 2022-2023, y es **el** ejercicio del tema: dos
              matrices con el mismo polinomio, y una sí y otra no.
      - id: las-dos-multiplicidades
        titulo: Las dos multiplicidades, que es lo que se examina
        aprendes: >-
          Decidir si una matriz diagonaliza comparando, para cada autovalor
          repetido, la multiplicidad algebraica con el rango de
          $A-\lambda I$.
        dominio: >-
          Que sepas que los autovalores simples nunca dan problema y que solo
          calcules rangos en los repetidos; y que si te sale «no diagonaliza»
          escribas cuántas direcciones hay y cuántas faltan.
        teoria:
          tema: t07-diagonalizacion
          apartado: las-dos-multiplicidades-que-es-todo-el-tema
          nota: >-
            La figura es el resumen: dos columnas que parten del mismo
            polinomio y acaban en respuestas opuestas.
        ejercicios:
          - id: ejalg7-las-dos-multiplicidades
            incrustado: true
            nota: >-
              El caso mínimo, en dos por dos. Vale la pena memorizarlo.
          - id: ejalg7-bol76-la-que-no-diagonaliza
            nota: >-
              Del boletín, con dos filas proporcionales que regalan el autovalor
              cero.
          - id: ejalg7-bol79-autovalor-doble-que-si-diagonaliza
            nota: >-
              La pareja buena: autovalor doble con rango 1, y diagonaliza.
          - id: ejalg7-bol714-autovalor-doble-que-no-diagonaliza
            nota: >-
              La pareja mala: mismo esquema, rango 2, y no diagonaliza. El
              boletín repite esta matriz tres veces porque es EL caso.
          - id: exalg2425-ord-4-el-polinomio-caracteristico-y-una-que-no-se-puede
            nota: >-
              De la ordinaria de 2024-2025, con la demostración de la
              invariancia y una matriz que no se deja.
      - id: simetricas-y-paso-ortogonal
        titulo: Las simétricas, y la matriz de paso ortogonal
        aprendes: >-
          Reconocer que una matriz simétrica diagonaliza siempre, y construir
          una matriz de paso ortogonal normalizando y ortogonalizando dentro de
          cada subespacio propio repetido.
        dominio: >-
          Que ante una simétrica contestes «sí diagonaliza» antes de calcular
          nada, y que no entregues $P$ sin normalizar ni sin haber
          ortogonalizado dentro del autovalor múltiple.
        teoria:
          tema: t07-diagonalizacion
          apartado: matrices-simétricas-el-caso-regalado
          nota: >-
            Los tres teoremas, y el aviso de que la ortogonalidad **dentro** de
            un subespacio propio repetido no sale sola.
        ejercicios:
          - id: ejalg7-bol77-simetrica-con-paso-ortogonal
            incrustado: true
            nota: >-
              Del boletín, y trae el paso que se salta: dentro del autovalor
              doble hay que aplicar Gram-Schmidt.
          - id: exalg2122-ord-4-una-simetrica-con-tres-autovalores-limpios
            nota: >-
              De la ordinaria de 2021-2022, con tres autovalores distintos: ahí
              la ortogonalidad sale gratis del todo.
          - id: ejalg7-bol77-2-rango-uno-y-gram-schmidt
            nota: >-
              Autovalor doble en una simétrica, y los dos vectores del plano
              no salen perpendiculares: hay que ortogonalizar a mano.
          - id: ejalg7-bol724-examen-norma-y-base-ortogonal
            nota: >-
              De examen: la norma y Minkowski delante, y una simétrica con
              autovalor doble donde hay que elegir bien la base del plano.
          - id: exalg2324-ord-4-tres-autovalores-distintos-y-una-base-ortogonal
            nota: >-
              De la ordinaria de 2023-2024, que pide expresamente la matriz de
              paso ortogonal.
      - id: para-que-sirve
        titulo: 'Y para qué sirve: potencias'
        aprendes: >-
          Usar $A^{n}=PD^{n}P^{-1}$ para calcular una potencia grande sin
          multiplicar la matriz por sí misma.
        dominio: >-
          Que sepas decir en una frase por qué se diagonaliza: para cambiar a la
          base donde la matriz no hace nada complicado.
        teoria:
          tema: t07-diagonalizacion
          apartado: para-qué-sirve-potencias
        ejercicios:
          - id: ejalg7-para-que-sirve-diagonalizar
            incrustado: true
            nota: >-
              La potencia cuarta con la fórmula, y la general de propina.
          - id: ejalg7-bol721-examen-la-potencia-veinte
            nota: >-
              De examen: $A^{20}$ con $D^{20} = I$. Y la trampa de creer que
              $P$ y $P^{-1}$ se cancelan con la $D$ en medio.
          - id: ejalg7-bol722-examen-una-permutacion-simetrica
            nota: >-
              De examen: $A^{6}$ y $A^{-1}$ con $P$ ortogonal, sin invertir
              nada.
          - id: ejalg3-cayley-hamilton-baja-la-potencia
            nota: >-
              El otro camino para lo mismo, sin diagonalizar: Cayley-Hamilton
              baja el grado de cualquier potencia.
    falta:
      - >-
        El boletín trae una matriz $4\times4$ con parámetro para diagonalizar y
        no hay ningún ejercicio guiado de orden $4$: todos los del sitio son de
        orden $2$ o $3$.

  # ═══════════════════════════════════════════════════════════════════
  # FORMULARIO
  # ═══════════════════════════════════════════════════════════════════
  - id: formulario
    apunte:
      texto: 'el apartado a) es teoría pura'
      tono: marco
    titulo: Lo que hay que llevar en la cabeza
    pide: >-
      Nada, directamente. Pero las ocho convocatorias empiezan cada ejercicio
      con una definición o una demostración de teoría, y eso no se improvisa.
    porque: >-
      En **las ocho convocatorias**, los cuatro ejercicios llevan un apartado
      (a) de teoría pura: una definición, una demostración o las dos. Son
      dieciséis apartados de teoría por convocatoria contando los subapartados,
      y ninguno depende de los números del examen. Va el último porque es
      repaso: cuando llegues aquí ya lo habrás usado todo.
    dominio: >-
      Que puedas escribir de memoria las cuatro demostraciones que más se
      repiten: que $\operatorname{Ker}f$ es subespacio, que inyectiva equivale a
      núcleo nulo, que las coordenadas son únicas, y que el polinomio
      característico no varía al cambiar de base.
    material:
      - tipo: teoria
        tema: t01-espacios-vectoriales
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          Diez puntos. El primero —¿está el cero?— resuelve más ejercicios que
          los otros nueve juntos.
      - tipo: teoria
        tema: t02-aplicaciones-lineales
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          Y el punto 3 avisa de algo que no es culpa tuya: la matriz asociada no
          está en la hoja de teoría de este tema.
      - tipo: teoria
        tema: t06-espacios-euclideos
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          Once puntos, y el noveno es el que decide el hueco 3 de la ordinaria:
          usa el producto escalar del enunciado, también al normalizar.
      - tipo: teoria
        tema: t07-diagonalizacion
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          Doce puntos. El séptimo es el que más veces se ha preguntado sin
          preguntarlo: el polinomio característico **no** decide.
    falta:
      - >-
        No hay una página de formulario propia, con las demostraciones que se
        repiten juntas y en el orden en que caen. De momento esto es una lista
        de enlaces a los cuatro resúmenes, y eso es exactamente lo que §14 dice
        que un bloque no debe ser.
