asignatura: ingenieria-termica
evaluacion: ordinaria
# Una sola ruta para las dos convocatorias, y es una decisión medida.
#
# La decisión se tomó sobre seis convocatorias y el 9 de septiembre de 2026 se
# volvió a comprobar sobre las diecisiete, abiertas a mano: **sigue en pie, y ahora con
# más fundamento**. Ni un solo bloque aparece en las ordinarias y falta en las
# extraordinarias, ni al revés. Lo que sí se cayó al recontar fue la frase con
# que se justificaba: decía «tres ejercicios, uno de gas ideal, otro de agua y
# el tercero de transmisión de calor», y de eso solo aguanta la composición
# —un ejercicio de transmisión y dos de termodinámica—. El de agua no siempre
# está, y el de transmisión no siempre es el tercero: en enero de 2019 es el
# primero.
#
# Álgebra sí tiene dos rutas, y por el motivo contrario: allí la extraordinaria
# cambia un hueco entero en las cuatro convocatorias leídas. Aquí no cambia
# ninguno, así que publicar dos rutas sería inventarse una diferencia (§10).
tambienPrepara:
  - extraordinaria
titulo: Preparar el examen de Ingeniería Térmica
lede: >-
  El examen son tres ejercicios y cada uno vale un tercio: **uno de transmisión
  de calor y dos de termodinámica**, y eso no ha fallado en ninguna convocatoria
  leída. Lo que sí falla es el orden: en enero de 2019 el de transmisión fue el
  **primero**. Aquí no hay casi nada que descartar, así que el orden de esta
  ruta no es por frecuencia: es por dependencia.
temas:
  - t01-conceptos-y-definiciones
  - t02-energia-y-primer-principio
  - t03-sustancias-puras
  - t04-volumen-de-control
  - t05-segundo-principio
  - t06-entropia
  - t07-analisis-exergetico
  - t08-conduccion
  - t09-conveccion
  - t10-radiacion
medidoSobre: 17
criterioDeOrden: >-
  Por dependencia, y no por frecuencia, porque la frecuencia aquí no discrimina:
  los siete bloques caen en las diecisiete convocatorias leídas. Cuando todo entra
  siempre, ordenar por rendimiento no dice nada y lo que rinde es ordenar por lo
  que hace falta antes. Delante va el suelo —los tres convenios—, que no ocupa
  hueco propio en ningún examen y sin el cual no se termina ninguno. Detrás, los
  dos modelos de sustancia, el volumen de control y las dos magnitudes que casi
  siempre son los últimos apartados: entropía generada y exergía destruida. Al
  final, la transmisión de calor, que está en todas y se puede estudiar aparte
  porque no depende de nada de lo anterior — aunque no siempre sea el tercero.


  **Y de cuántas convocatorias sale todo esto, dicho con las dos cifras.** Los
  recuentos de esta ruta se escribieron sobre **seis** convocatorias. En el
  material hay **veintidós**, de 2014-2015 a 2025-2026, pero no valen todas
  para comparar: las de antes de 2018 son de otra asignatura, y eso deja
  **diecisiete** con la forma de ahora. El 9 de septiembre de 2026 se abrieron
  a mano **las diecisiete**, una por una, y de ahí salen los patrones cruzados
  que cuenta esta cabecera — dos ejercicios repetidos con los mismos números,
  tres moldes que vuelven y una duración medida quince veces. **No queda
  ninguna sin leer, y los recuentos de cada bloque están rehechos sobre las
  diecisiete**: hasta ese día contaban sobre seis. Los que más se movieron son
  los dos que deciden el final de un ejercicio — la exergía destruida sube a
  **quince de diecisiete** y es el bloque que más cae de la ruta, y la entropía
  generada baja a **ocho**, porque se ha separado de «la variación de
  entropía», que es otra cosa y sale cuatro veces más.


  De las abiertas a mano, la primera fue **enero de 2024**, y confirma la
  forma: tres ejercicios a un tercio, el primero de gas ideal —un politrópico
  de exponente $-0{,}5$, que es de los raros— y el tercero de transmisión de
  calor, con una tubería aislada y la velocidad del viento como incógnita
  final. Su segundo ejercicio **no es de agua**: es un motor térmico entre dos
  focos cuya potencia mueve un compresor de aire, y lo que se pide al final es
  la exergía destruida y el rendimiento exergético del compresor. Conviene
  saberlo, porque el patrón «el segundo es de agua» no es una ley.


  La segunda leída es **febrero de 2025**, y trae una forma de enunciado que no
  está en ninguno de los otros: su ejercicio 2 da la **ficha técnica de un
  generador de aire caliente comercial** —potencia nominal 200 kW, útil 184,
  caudal 16.500 m³/h— con la foto del aparato, y define la pérdida como la
  diferencia entre las dos potencias. No hay nada que buscar en tablas: los
  datos están en un catálogo. Sus otros dos son un bloque de acero enfriándose
  en agua —con la exergía destruida pedida **por dos caminos distintos**, uno
  detrás de otro— y una tubería aislada con el viento como incógnita, que es el
  mismo molde que el tercero de enero de 2024.


  Y la tercera es **la extraordinaria de febrero de 2026**, que además es la
  más fácil de leer de las veintidós: está compuesta a máquina y no escaneada,
  en castellano, con la resolución entera al lado. Sus tres: un tanque rígido
  con una resistencia eléctrica dentro —vapor húmedo que llega a saturado
  seco—, un intercambiador de nitrógeno y aire con un 10 % de pérdidas, y un
  ensayo en **túnel de viento comparando dos cascos** con la misma forma y
  distintas aberturas, del que se dan las pérdidas convectivas medidas. Aquí
  el de agua es el **primero**, no el segundo: una razón más para no fiarse
  del orden.


  Y la cuarta, la segunda convocatoria de 2023-2024, trae un dato de
  calendario que conviene tener claro antes de planificar nada: **su fichero
  se llama «Febrero» y el examen está fechado el 30 de enero de 2024**. Y no
  es un nombre mal puesto: la segunda convocatoria de 2022-2023 lleva la misma
  fecha, «2023ko urtarrilak 30». **La segunda oportunidad no llega en febrero,
  llega a finales de enero** — unas tres semanas después de la primera, no un
  mes y medio. Si contabas con ese margen para recuperar, no lo hay. Y no
  siempre fue así: en 2017-2018 la segunda fue **el 18 de junio**, cinco meses
  después. El calendario cambió en algún punto entre esas dos fechas, así que
  lo que vale es la costumbre reciente y no la antigua.

  Del examen de 2023-2024 en sí: sus tres son un cilindro-pistón que además hay
  que rehacer **en adiabático** —cuatro apartados repetidos con otro proceso—,
  un separador mal aislado con entropía generada, exergía destruida y
  rendimiento exergético, y dos tubos concéntricos con aceite de motor y agua a
  los que el enunciado da la tabla de propiedades hecha.


  Y la última que quedaba, **junio de 2018**, es la que trae la forma más rara
  de todas: su ejercicio 1 es **un ciclo completo de tres procesos
  politrópicos** con 1 kg de nitrógeno, del que hay que sacar el exponente y el
  calor específico politrópico **de cada uno de los tres** y después el
  rendimiento del ciclo. Ningún otro de los diecisiete pide un ciclo entero. El
  tercero es una **fachada de dos capas** con convección solo por fuera. Y en
  el segundo está escrito, con todas las letras, que «se valorará especialmente
  aquellas resoluciones que deduzcan previamente a cualquier cálculo el signo
  de los resultados».


  Y la quinta, **enero de 2019**, es la que rompe el orden. Su problema 1 es un
  **radiador de agua caliente** —módulos de 0,8 m² a 60 °C en una habitación a
  20 °C, y hay que decir cuántos hacen falta para 2 kW—, o sea transmisión de
  calor **en primer lugar**. Los otros dos son un calentador eléctrico de 50
  litros con su exergía destruida y un sistema abierto con politrópico de
  exponente $-2{,}6$ en el que primero hay que **deducir gráficamente, sin
  cuentas**, el signo del calor, el del trabajo y el de la variación de
  entropía, y solo después calcularlos. Dos avisos en un examen: ni el orden
  está fijo ni todo lo que puntúa se calcula.


  **Y hay dos ejercicios que se repiten enteros, con los mismos números — y
  los dos reaparecen en el mismo examen.** El del 30 de enero de 2024 está
  hecho, en dos de sus tres ejercicios, de exámenes anteriores:

  Su ejercicio 2 es el segundo de **enero de 2020**: un separador térmicamente
  mal aislado al que entran $0{,}5$ kg/s de vapor a 2 bar y 250 °C y del que
  salen dos corrientes, una de $0{,}1$ kg/s de líquido saturado y otra de vapor
  saturado seco, con el estado de referencia a 1 bar y 19 °C y la superficie
  del separador a 126 °C. Cuatro años de diferencia, uno en euskera y otro en
  castellano, y los mismos números.

  Su ejercicio 3 es el primero de **enero de 2021**: dos tubos concéntricos de
  $9{,}5$ m con $0{,}9$ kg/s de aceite de motor entrando a 106 °C y saliendo a
  96 °C, agua por fuera de 14 a 25 °C, diámetros de $2{,}5$ y 5 cm y espesor
  $0{,}5$ cm, con conductividad 55 W/(m·K) — **y la misma tabla de propiedades
  de los dos fluidos, dígito a dígito**. En 2021 pedía las dos temperaturas
  superficiales; en 2024, esas dos y además los dos coeficientes de convección.

  Si vas a preparar dos ejercicios y solo dos, que sean esos.


  Y el molde de los **tubos concéntricos** no aparece dos veces sino **tres**:
  en enero de 2022 vuelve con aire por dentro en vez de aceite —$0{,}5$ kg/s
  de 90 a 70 °C, diámetros 6 y 8 cm, agua por el anular— y pidiendo lo mismo,
  las temperaturas superficiales. Tres de las diecisiete leídas. Es la
  estructura que más se repite de toda la asignatura.


  Y contado más ancho —**un tubo por el que circula un fluido y del que hay
  que sacar una temperatura superficial**, con tubo exterior o sin él— son
  **seis de las diecisiete**: los tres de tubos concéntricos, más el tubo de
  hierro con agua del 30 de enero de 2023, la tubería de acero con magnesita
  de enero de 2024 y la de enero de 2026. Si el ejercicio de transmisión es el
  que menos varía, esta es la forma que más veces toma.


  Pero hay tres moldes más que vuelven con los números cambiados, y saberlos
  vale casi lo mismo.

  El primero, y el que más sale, es **algo caliente metido en agua dentro de
  un recipiente adiabático, del que se pide la exergía destruida**. Tres
  veces: una bola de acero de 5 cm de radio a 90 °C en veinte litros
  —febrero de 2020—, un bloque de acero de 5 kg a 80 °C en los mismos veinte
  litros —febrero de 2025— y cinco litros de agua a 90 °C vertidos sobre
  quince a 20 °C —enero de 2025—. Cambia el cuerpo caliente; no cambia el
  planteamiento.

  El segundo es **deducir los signos antes de calcularlos**, y va **tres
  veces**: en junio de 2018 el enunciado avisa de que «se valorará
  especialmente aquellas resoluciones que deduzcan previamente a cualquier
  cálculo el signo de los resultados»; en enero de 2019 lo pide
  «gráficamente, sin hacer cálculos numéricos»; y en febrero de 2020, «por
  cálculo». Puntúa razonar antes de coger la calculadora, y está escrito.
  Ojo además con el gas: **no siempre es aire** — butano en febrero de 2020,
  nitrógeno en junio de 2018 y en el 30 de enero de 2023, helio en enero de
  2025.

  El tercero es el más exigente y es de 2024-2025, los dos exámenes seguidos:
  **resolver lo mismo de dos maneras distintas, y que las dos cuenten**. En
  enero, los dos primeros apartados del ejercicio de transmisión piden un 20 %
  «analíticamente» y otro 20 % «usando la analogía eléctrica». En febrero, la
  exergía destruida «de una de las dos maneras enseñadas en el curso» y
  después «de la otra». Saber un camino da la mitad de los puntos.


  Y una forma que aparece **dos años seguidos** y conviene haber visto: los
  ejercicios **encadenados**. En enero de 2021 el 2 pide la exergía destruida
  «del proceso que ocurre entre agua y aceite **en el ejercicio anterior**» y
  el 3 coge «el agua del ejercicio 2, a la salida de la conducción». En enero
  de 2022 el 2 vuelve a colgar del 1. Un error arriba se arrastra hasta el
  final — **pero el de 2022 trae la salida de emergencia escrita en el propio
  examen**: «Si no se ha resuelto el ejercicio 1, tómense los siguientes datos
  aproximados para poder resolver el ejercicio 2». Si te bloqueas en el
  primero, busca esa nota antes de darlo por perdido: puede estar.


  **Cuánto dura, que lo imprimen los propios exámenes.** Trece enunciados
  llevan la duración escrita, y lo que dicen es que **no hay una duración
  fija**, aunque sí hay una clara mayoría. Enero de 2015 —temario antiguo—
  dio 3 h 30 min. Con el temario de ahora, curso por curso: 3,5 h y 3 h en 2017-2018;
  2,5 h en 2019; 2,5 h y 2,5 h en 2019-2020; **3,5 h** y 2,5 h en 2020-2021;
  2,5 h —«150 minutos», escrito así— y 3 h en 2021-2022; 2,5 h y 2,5 h en
  2022-2023; 2,5 h y 2,5 h en 2023-2024; y 2,5 h y 3 h en 2024-2025. **Diez de
  quince son 2,5 h**, así que cuenta con dos horas y media y no des por hecho
  que la segunda convocatoria dará más: en 2020, en 2021, en 2023 y en 2024 dio
  lo mismo o menos que la primera. Esos mismos enunciados confirman el reparto que
  esta ruta da por bueno —«cada ejercicio vale un tercio del valor total del
  examen»— y añaden el aviso de la Escuela: las hojas sin nombre, DNI, grupo y
  titulación **no se corrigen**. Unos exámenes son bilingües y otros salen solo
  en euskera, así que conviene poder leer el enunciado en los dos idiomas.


  **Y hasta dónde llega este examen hacia atrás.** El de enero de 2018 ya
  tiene la forma de ahora: tres ejercicios, uno de exergía en una cámara de
  mezcla, otro de entropía generada y el tercero de transmisión de calor. El
  de enero de 2015, en cambio, es **otra asignatura**: cuatro ejercicios con
  pesos 1-2-3-4, un ciclo frigorífico con R-134a, psicrometría y un Brayton —
  nada de eso está en el temario de estos diez temas. Así que los enunciados
  anteriores a 2018 sirven de curiosidad y no de entrenamiento, y por eso esta
  ruta no los cuenta.

bloques:
  # ═══════════════════════════════════════════════════════════════════
  # SUELO
  # ═══════════════════════════════════════════════════════════════════
  - id: suelo-los-tres-convenios
    apunte:
      texto: 'no da puntos — decide el signo de todos'
      tono: marco
    titulo: Los tres convenios que sostienen el examen
    pide: >-
      No los pide con estas palabras. Los pide dentro de los otros ejercicios,
      con «se intercambian 240 kJ de calor hacia el medio circundante»,
      «la bomba consume 6 kW» y «tómese como estado de referencia 15 °C y
      1 bar».
    porque: >-
      Ninguno de los tres tiene ejercicio propio en las seis convocatorias
      leídas, y los tres están dentro de los dieciocho ejercicios. El convenio de
      signos decide si un trabajo sale 314 o 794 kJ; la distinción entre theta
      y te decide si un logaritmo vale −0,62 o −2,36; y elegir el sistema
      decide qué ecuación se escribe. Los tres fallan en silencio: la cuenta se
      hace igual y el número es otro. Eso es exactamente lo que define un suelo,
      y por eso va delante aunque no puntúe.
    invariante:
      anios: 0
      fuente: >-
        Cero, y es el dato: ninguno de los tres convenios ocupa un hueco propio
        en ninguna de las **diecisiete** convocatorias leídas, revisadas
        apartado por apartado. Están dentro de los cincuenta y un ejercicios.
        Que los tres sean «el mismo suelo» y no tres asuntos sueltos es lectura
        nuestra, y viene de que los tres producen el mismo tipo de error: uno
        que no se detecta.
    dominio: >-
      Traducir un enunciado a signos antes de escribir ninguna ecuación; pasar
      todas las temperaturas a kelvin en la primera línea del folio; y decir,
      mirando un dibujo, si conviene cortar por una masa de control o por un
      volumen de control.
    escalones:
      - id: elegir-el-sistema
        titulo: Elegir el sistema antes de escribir nada
        aprendes: >-
          A decidir dónde pones la frontera, y a ver que la buena es la que
          hace que el dato que te falta no aparezca en la ecuación.
        teoria:
          tema: t01-conceptos-y-definiciones
          apartado: el-sistema-es-una-elección-tuya-no-un-dato-del-enunciado
          nota: >-
            El mismo condensador del examen de enero de 2026 se recorta de dos
            maneras distintas según lo que pida cada apartado, y ninguna de las
            dos es «la correcta».
        ejercicios:
          - id: ejter-el-estado-que-cambia-sin-que-cambie-la-temperatura
            incrustado: true
            nota: >-
              El ejemplo de entrada. Dos fotos del mismo depósito y el
              postulado de estado, para separar propiedad de estado antes de
              tocar ninguna ecuación.
          - id: ejter-la-presion-que-se-lleva-a-la-tabla
            nota: >-
              La lectura de un manómetro no es una propiedad del sistema: es la
              diferencia entre una propiedad del sistema y una de la sala. De
              ahí que en Termodinámica se trabaje en absolutas.
        dominio: >-
          Decir, ante un enunciado con una turbina y un depósito, cuál de los
          dos conviene encerrar y por qué, sin haber calculado nada todavía.

      - id: theta-y-te
        titulo: Theta es Celsius, te es kelvin
        aprendes: >-
          A saber en qué expresiones da igual la escala y en cuáles no, y a
          no volver a meter un grado Celsius dentro de un logaritmo.
        teoria:
          tema: t01-conceptos-y-definiciones
          apartado: theta-y-te-que-no-son-la-misma-letra
          nota: >-
            La regla entera cabe en una línea: restar perdona, dividir no. Los
            enunciados de esta asignatura usan las dos letras sin declararlo
            nunca.
        ejercicios:
          - id: ejter-la-temperatura-que-entra-en-un-logaritmo
            incrustado: true
            nota: >-
              Extraído del examen de enero de 2026. El mismo par de
              temperaturas en un cociente y en una resta, para ver de golpe qué
              sobrevive al cambio de escala.
        dominio: >-
          Evaluar un logaritmo de temperaturas sin pararte a pensar, porque ya
          las has pasado todas a kelvin en la primera línea.

      - id: el-convenio-de-signos
        titulo: Calor que entra, trabajo que sale
        aprendes: >-
          A traducir «cede 240 kJ» y «consume 6 kW» a números con signo antes
          de escribir la primera ley, y a leer los tres signos del resultado
          como comprobación.
        teoria:
          tema: t02-energia-y-primer-principio
          apartado: el-convenio-de-signos
          nota: >-
            Y el error típico de al lado, que avisa de que otros libros
            escriben la primera ley con la W del otro lado. Lo primero que hay
            que mirar en unos apuntes ajenos es de qué lado está.
        ejercicios:
          - id: ejter-el-signo-que-decide-el-resto-del-examen
            incrustado: true
            nota: >-
              Del examen de enero de 2026. Un gas que cede calor y aun así
              produce trabajo: los tres signos cuentan la misma historia y hay
              que saber leerla.
        dominio: >-
          Escribir el signo de Q y de W en una línea aparte del folio, nada más
          leer el enunciado, y que los tres signos del resultado encajen con lo
          que el enunciado describe.
    falta: []
    revisado: '2026-09-07'

  # ═══════════════════════════════════════════════════════════════════
  # LOS DOS MODELOS DE SUSTANCIA
  # ═══════════════════════════════════════════════════════════════════
  - id: el-gas-ideal-y-el-politropico
    apunte:
      texto: 'un ejercicio de cada examen, 6 de 6'
      tono: nota
    titulo: El gas ideal y el proceso politrópico
    pide: >-
      «Se expanden 3 kg de aire desde 6 bar y 0,8 m³ según un proceso
      reversible»; «se tiene 1 litro de aire a 20 ºC y 2 atm sometido a un
      proceso de exponente politrópico 3,5»; «a un intercambiador entra un
      gasto de 2 kg/s de nitrógeno».
    porque: >-
      En las seis convocatorias leídas hay **siempre** un ejercicio cuyo
      fluido es un gas y se resuelve con la ecuación de estado, sin abrir
      ninguna tabla: enero de 2026, febrero de 2026, enero de 2022-2023,
      febrero de 2021-2022 y enero de 2017-2018. Va antes que las tablas porque
      es el modelo más simple y porque el trabajo de frontera y los calores
      específicos, que se aprenden aquí, hacen falta en todos los demás
      bloques.
    invariante:
      anios: 16
      fuente: >-
        **Dieciséis de las diecisiete**, contadas por el fluido de cada
        ejercicio. La única sin gas ideal es enero de 2021, cuyos tres van de
        tubos concéntricos, de la exergía de ese mismo proceso y de una cámara
        de mezcla con agua. Que «gas ideal» y «tablas de vapor» sean dos huecos
        distintos y no dos variantes del mismo es lectura nuestra, y se sostiene
        mejor con diecisiete que con seis: en quince de las diecisiete aparecen
        los dos. Y un aviso que solo se ve leyéndolas todas: **el gas no siempre
        es aire** — butano en febrero de 2020, nitrógeno en junio de 2018 y en
        el 30 de enero de 2023, helio en enero de 2025.
    dominio: >-
      Sacar la temperatura de un estado con PV = mR'T sin dudar de las
      unidades; calcular el trabajo de una expansión sabiendo si se puede
      integrar o no; y pasar del calor al exponente politrópico con el calor
      específico del proceso.
    escalones:
      - id: el-trabajo-de-frontera
        titulo: Cuándo el área bajo la curva es el trabajo
        aprendes: >-
          A distinguir los tres casos de reversibilidad de una expansión, y a
          saber cuándo se puede integrar con la presión del gas y cuándo hay
          que usar la exterior.
        teoria:
          tema: t02-energia-y-primer-principio
          apartado: cuándo-el-área-bajo-la-curva-es-el-trabajo-y-cuándo-no
          nota: >-
            La tabla de tres filas es la que hay que llevarse. Y la
            consecuencia de lectura: una curva continua en un P-v es el
            enunciado diciéndote que el proceso es internamente reversible.
        ejercicios:
          - id: ejter-los-dos-caminos-entre-los-mismos-estados
            incrustado: true
            nota: >-
              El ejemplo de entrada. Los mismos dos estados por dos caminos, y
              un 65 % de diferencia en el trabajo. Es la primera aparición de
              la irreversibilidad en el temario, cuatro temas antes de que
              tenga nombre.
        dominio: >-
          Mirar un enunciado y decir si el trabajo se calcula con la presión
          del gas o con la exterior, sin haber escrito todavía la integral.

      - id: la-entalpia-y-los-calores-especificos
        titulo: La entalpía, y por qué aparece un cv y un cp
        aprendes: >-
          A elegir entre cv y cp según si la masa cruza o no la frontera, y a
          ver que su diferencia es exactamente el trabajo de flujo.
        teoria:
          tema: t02-energia-y-primer-principio
          apartado: los-calores-específicos-y-la-entalpía
          nota: >-
            La regla corta —sistema cerrado cv, volumen de control cp— no es
            por el volumen ni por la presión: es por si la masa cruza. El
            subíndice recuerda de dónde salió la definición, no dónde se usa.
        ejercicios:
          - id: ejter-la-entalpia-como-suma
            incrustado: true
            nota: >-
              El ejemplo de entrada. La diferencia entre los dos saltos sale
              exactamente R'·ΔT, que es la definición derivada término a
              término.
        dominio: >-
          Decir sin pensarlo cuál de los dos calores específicos toca en un
          problema, y saber cuánto vale la diferencia entre los dos.

      - id: el-exponente-politropico
        titulo: Del calor al exponente politrópico
        aprendes: >-
          A reconocer la única relación del tema que va del calor al exponente,
          y a comprobarla con los dos casos límite que se saben de memoria.
        teoria:
          tema: t03-sustancias-puras
          apartado: el-calor-específico-politrópico
          nota: >-
            Y el apartado de al lado, «Las tres relaciones que se usan», que es
            de donde sale la presión final una vez conocido el exponente.
        ejercicios:
          - id: ejter-el-exponente-que-se-lee-de-dos-estados
            incrustado: true
            nota: >-
              El ejemplo de entrada. Dos estados y un logaritmo: la manera más
              corta de ver qué es un exponente politrópico antes de que
              aparezca dentro de un examen.
          - id: ejter-el-exponente-que-sale-del-calor
            nota: >-
              El ejercicio 1 de enero de 2026, con su resolución oficial
              detrás. Aquí el exponente no se lee de dos estados sino del
              calor, que es el camino difícil y el que el examen pide.
          - id: ejter-seis-signos-y-ningun-numero
            nota: >-
              El ejercicio 1 de enero de 2022-2023, y no pide ni un número:
              pide el **signo** de cinco magnitudes y si las paredes se mueven.
              Es el mismo exponente politrópico mirado desde el razonamiento,
              y es donde se ve si distingues «la entropía del sistema baja» de
              «la entropía generada es negativa».
        dominio: >-
          Sacar el exponente politrópico de un enunciado que solo te da el
          calor, y comprobar la fórmula con el caso adiabático antes de
          fiarte de ella.
    falta: []
    revisado: '2026-09-07'

  - id: la-sustancia-pura-y-sus-tablas
    apunte:
      texto: 'el otro ejercicio de cada examen, 5 de 6'
      tono: nota
    titulo: La sustancia pura, y decidir la zona antes de abrir la tabla
    pide: >-
      «Un tanque rígido contiene 1,5 kg de vapor húmedo a 200 kPa»; «entran
      0,7 kg/s de vapor de agua con un volumen específico de 3 m³/kg»; «se
      desea obtener vapor húmedo a 10 bar y título del 80 %».
    porque: >-
      El compañero del bloque anterior: en **cinco de las seis** convocatorias
      hay un segundo ejercicio cuyo fluido es agua y se resuelve con tablas. La
      excepción es enero de 2024-2025, donde el agua aparece pero como líquido
      y se despacha con el modelo incompresible, sin abrir ninguna tabla. Va
      después del gas ideal porque es el mismo balance de energía con un paso
      más delante —decidir en qué zona del diagrama está el estado— y porque
      ese paso es el que más ejercicios tumba: no falla ruidosamente, falla
      dando un número plausible sacado de la tabla equivocada.
    invariante:
      anios: 16
      fuente: >-
        **Dieciséis de las diecisiete**, contadas por el fluido de cada
        ejercicio. La única sin agua es junio de 2018 —un ciclo de nitrógeno,
        un cilindro-pistón de aire y una fachada—. Que el paso crítico sea
        «decidir la zona» y no «leer la tabla» es lectura nuestra, y sale de que
        las resoluciones oficiales empiezan siempre comparando el volumen
        específico o la entalpía con los dos valores de saturación antes de
        cualquier otra cosa. Ojo: el agua no siempre llega como vapor — en
        enero de 2019 y en enero de 2025 entra como líquido y se resuelve con
        el modelo incompresible.
    dominio: >-
      Mirar un par de datos y decir en dos líneas si el estado es líquido
      comprimido, vapor húmedo o vapor sobrecalentado; y sacar el título con la
      propiedad que el enunciado te haya dado, sea v, h, u o s.
    escalones:
      - id: decidir-la-zona
        titulo: Los dos números que se miran primero
        aprendes: >-
          A comparar el dato del enunciado con los dos volúmenes de saturación
          antes de abrir ninguna otra tabla, y a saber qué comparar cuando lo
          que te dan es una temperatura.
        teoria:
          tema: t03-sustancias-puras
          apartado: decidir-la-zona-el-paso-que-nadie-escribe
          nota: >-
            El procedimiento entero son tres desigualdades. Dos apartados más
            abajo, «La notación de esta asignatura» resuelve el choque entre
            las primas de los apuntes y los subíndices de Moran y Shapiro, que
            los enunciados mezclan; y «El diagrama de Mollier» explica cuándo
            conviene abrir el diagrama en vez de la tabla, que es la otra
            manera de entrar a un estado.
        ejercicios:
          - id: ejter-dentro-o-fuera-de-la-campana
            incrustado: true
            nota: >-
              El ejemplo de entrada. La misma sustancia a la misma presión en
              tres zonas distintas, y tres maneras distintas de calcularla.
              Nada en el enunciado lo dice: lo dicen los dos números de la
              tabla.
        dominio: >-
          Decir en qué zona está un estado dado por presión y volumen
          específico, en diez segundos y sin abrir nada más que la tabla de
          saturación.

      - id: el-titulo-y-el-deposito-rigido
        titulo: El título, y el depósito que no cambia de volumen
        aprendes: >-
          A calcular el título con cualquiera de las cuatro propiedades, y a
          usar la condición de volumen constante para entrar en la segunda
          tabla sin más datos.
        teoria:
          tema: t03-sustancias-puras
          apartado: el-título
          nota: >-
            El título no está tabulado: se calcula. Lo que sí se interpola son
            las propiedades, y linealmente, como dice el tema.
        ejercicios:
          - id: ejter-el-deposito-rigido-que-se-calienta
            incrustado: true
            nota: >-
              El ejercicio 3.2 de la colección, con su resolución publicada.
              Rígido y cerrado quiere decir vertical en el diagrama T-v, y esa
              vertical es todo el ejercicio.
        dominio: >-
          Resolver un depósito rígido que se calienta de principio a fin:
          título inicial, volumen específico, título final, masa de vapor y
          calor aportado, sin más dato que las dos presiones.
    falta:
      - >-
        Las tablas de propiedades no están en el sitio, y no se pueden
        reproducir: son de Moran y Shapiro y del anexo de la asignatura. Los
        enunciados publicados llevan dentro los valores que usan, que es lo que
        hace el propio examen, pero para trabajar por libre hace falta el anexo
        de eGELA.
      - >-
        No hay ningún ejercicio publicado de líquido comprimido ni de vapor
        sobrecalentado con interpolación en dos entradas, que es lo que pide el
        apartado d) del ejercicio 2 de enero de 2026.
      - >-
        El **diagrama de Mollier** está explicado en la prosa del tema 3
        —cuándo gana a la tabla, y por qué la asignatura publica dos— pero no
        hay ningún ejercicio que se resuelva leyéndolo. Y el examen lo pide: el
        ejercicio 2 de enero de 2022-2023 da la presión de entrada a la turbina
        y el estado de salida, y pregunta la temperatura de entrada, que es una
        lectura de diagrama. Falta el diagrama, que no se puede reproducir, y
        falta el ejercicio.
    revisado: '2026-09-07'

  # ═══════════════════════════════════════════════════════════════════
  # EL VOLUMEN DE CONTROL
  # ═══════════════════════════════════════════════════════════════════
  - id: el-volumen-de-control
    apunte:
      texto: 'turbina, intercambiador o mezcla — 6 de 6'
      tono: nota
    titulo: El volumen de control, y qué término se tacha en cada aparato
    pide: >-
      «En una turbina de vapor se desarrollan 200 kW de potencia»; «a un
      intercambiador de calor entra un gasto de 2 kg/s de nitrógeno»; «0,5 kg/s
      de agua se mezclan adiabáticamente con una corriente a 111 ºC».
    porque: >-
      Aparece en las seis convocatorias, y en dos de ellas en los dos primeros
      ejercicios a la vez. El aparato cambia —turbina, condensador,
      intercambiador, cámara de mezcla— y la ecuación no: es siempre la misma, y
      lo único que cambia es qué términos se tachan. Va después de los dos
      modelos de sustancia porque los usa a los dos, y antes de la entropía
      porque el balance de energía se resuelve primero.
    invariante:
      anios: 16
      fuente: >-
        **Dieciséis de las diecisiete**. La única sin sistema abierto es junio
        de 2018. Que tobera, turbina, compresor, condensador, intercambiador,
        separador y cámara de mezcla sean «el mismo ejercicio con otro dibujo»
        es lectura nuestra, y con diecisiete delante se sostiene igual: las
        resoluciones oficiales empiezan por la misma ecuación y se diferencian
        solo en qué sumandos se tachan.
    dominio: >-
      Mirar el dibujo de un aparato y escribir su balance de energía tachado,
      con los términos que sobran ya fuera y el signo del trabajo puesto, antes
      de sustituir ningún número.
    escalones:
      - id: la-tabla-de-que-se-tacha
        titulo: La tabla que resuelve los ejercicios
        aprendes: >-
          A saber de memoria qué se anula en una tobera, un difusor, una
          turbina, un compresor, una caldera, un intercambiador y una válvula.
        teoria:
          tema: t04-volumen-de-control
          apartado: la-tabla-que-resuelve-los-ejercicios
          nota: >-
            Siete filas, y la columna «qué se tacha» vale solo mientras el
            enunciado no diga otra cosa. Un compresor refrigerado rompe su
            fila, y el enunciado siempre avisa.
        ejercicios:
          - id: ejter-el-difusor-la-tobera-al-reves
            incrustado: true
            nota: >-
              Nuestro, y el más barato de entender de los siete aparatos: un
              difusor es una tobera leída al revés, misma fila de la tabla y
              mismo tachado. Enseña además el orden de magnitud que decide
              estos ejercicios — la velocidad entra al cuadrado, así que
              frenar de 200 a 30 m/s aprovecha el 99,8 % de lo que
              aprovecharía frenar hasta cero.
          - id: ejter-la-tobera-y-lo-que-no-se-desprecia
            nota: >-
              De la colección, con sus resultados publicados. La tobera es la
              excepción de la tabla: aquí la energía cinética no se desprecia,
              es lo único que queda al otro lado.
          - id: ejter-la-valvula-que-no-hace-nada-y-lo-destruye-todo
            nota: >-
              La otra fila rara de la tabla: en una válvula no queda **nada** y
              por eso la laminación es isoentálpica. Mirada con el primer
              principio no pasa nada; con el segundo, destruye 172 kJ/kg. Es el
              mejor argumento del tema 7 y cabe en tres cuentas.
        dominio: >-
          Escribir de memoria qué queda de la ecuación de la energía en cada
          uno de los siete aparatos, y decir en cuáles no se puede despreciar
          la energía cinética.

      - id: el-intercambiador
        titulo: El intercambiador, y dónde poner la frontera
        aprendes: >-
          A elegir entre encerrar el aparato entero —y entonces el calor no
          cruza— o una sola corriente, según lo que el apartado pida.
        teoria:
          tema: t04-volumen-de-control
          apartado: el-intercambiador-y-el-volumen-de-control-que-se-elige
          nota: >-
            Ninguna de las dos elecciones es más correcta. La buena es la que
            hace que el dato que falta no aparezca en la ecuación, que es el
            criterio del suelo aplicado aquí.
        ejercicios:
          - id: ejter-el-aceite-y-el-agua-que-lo-enfria
            incrustado: true
            nota: >-
              El ejemplo de entrada. Dos corrientes, dos calores específicos y
              un balance de tres líneas, sin tablas por medio.
          - id: ejter-cuanta-agua-para-condensar-un-kilo
            nota: >-
              El ejercicio 2 de enero de 2026. El mismo balance, ahora con
              cambio de fase: treinta veces más agua de refrigeración que
              vapor, y la razón entre los dos números es exactamente el calor
              latente partido por el sensible.
        dominio: >-
          Plantear el balance de un intercambiador de dos corrientes que no se
          mezclan, y saber por qué el calor no aparece en la ecuación.

      - id: la-bomba-y-el-signo
        titulo: La bomba, y el signo de un trabajo que entra
        aprendes: >-
          A aplicar el convenio de signos del suelo a un volumen de control, y
          a comprobar el resultado con el trabajo ideal de la bomba.
        teoria:
          tema: t04-volumen-de-control
          apartado: el-trabajo-de-un-proceso-reversible-en-régimen-estacionario
          nota: >-
            De aquí sale el signo sin tener que recordarlo: en una turbina la
            presión baja y el trabajo es positivo; en una bomba sube y es
            negativo. Se lee del diagrama.
        ejercicios:
          - id: ejter-la-misma-ecuacion-con-los-dos-signos
            incrustado: true
            nota: >-
              El ejemplo de entrada, y el más barato de la ruta: la misma
              ecuación aplicada a una turbina y a una bomba, y los dos signos
              saliendo solos. Es la comprobación que ahorra más ejercicios.
          - id: ejter-la-bomba-que-consume-seis-kilovatios
            nota: >-
              Del examen de enero de 2026. Comprimir un líquido cuesta poco, y
              esa es la razón de que en un ciclo de vapor se bombee líquido en
              vez de comprimir vapor.
          - id: ejter-el-compresor-reversible-que-destruye-exergia
            nota: >-
              El ejercicio 1 de enero de 2024-2025, y el contraste con la
              bomba: comprimir un **gas** cuesta 2.184 kW donde bombear el
              líquido costaba 6. Además regala la palabra «reversible» y medio
              examen se la cree: lo es dentro del aparato, no en el universo.
        dominio: >-
          Sacar la entalpía a la salida de una bomba o una turbina con el signo
          correcto, y estimar si el número es razonable con el trabajo ideal.
    falta:
      - >-
        Falta la **caldera**, una de las siete filas de la tabla del tema 4 sin
        ejercicio propio. No aparece sola en las seis convocatorias leídas
        —sale dentro de los ciclos—, así que la deuda es pequeña; pero la fila
        está y el sitio no la practica. Y hay un motivo para que siga
        pendiente y no se escriba como se ha escrito el difusor: una caldera
        va con agua, y para dar sus dos entalpías hacen falta las tablas de
        propiedades, que son de la editorial y no se pueden reproducir aquí.
        Escribirla con valores recordados sería publicar un dato de tabla sin
        fuente, y eso no se hace.
    revisado: '2026-09-07'

  # ═══════════════════════════════════════════════════════════════════
  # LAS DOS MAGNITUDES QUE CIERRAN CADA EJERCICIO
  # ═══════════════════════════════════════════════════════════════════
  - id: la-entropia-generada
    apunte:
      texto: 'la piden las 6 convocatorias'
      tono: nota
    titulo: La entropía generada, y dónde está la irreversibilidad
    pide: >-
      «La entropía generada en el proceso que ocurre en el cilindro-pistón»;
      «la entropía generada en el universo»; «el signo de la entropía generada
      en el sistema (positivo, negativo o nulo)».
    porque: >-
      Aparece en las seis convocatorias leídas, y casi siempre como uno de los
      apartados centrales del ejercicio, no como pregunta suelta. Va después del
      volumen de control porque el balance de entropía se escribe sobre el mismo
      sistema que ya has recortado, y antes de la exergía porque Guy-Stodola
      convierte lo uno en lo otro multiplicando por la temperatura del ambiente.
    invariante:
      anios: 8
      fuente: >-
        **Ocho de las diecisiete**, contando solo los apartados que piden
        **entropía generada** con esas palabras —en el sistema, en el universo,
        o su signo—: junio de 2018, enero de 2018, febrero de 2021, enero y 30
        de enero de 2023, 30 de enero de 2024, enero de 2026 y febrero de 2026.
        No se cuentan los que piden «la variación de entropía», que son otros
        cuatro y otra cosa: uno es una propiedad del sistema y el otro mide la
        irreversibilidad. Esa distinción es la lectura nuestra de este bloque, y
        es justo el error que separa un aprobado de un notable. Que el
        rendimiento de Carnot vaya en este bloque también es lectura nuestra: el
        examen no lo pide por su nombre en ninguna de las diecisiete, pero sin
        el techo no hay manera de saber si un resultado es plausible.
    dominio: >-
      Escribir el balance de entropía de un sistema y del universo por
      separado, evaluando cada integral con la temperatura de la frontera por
      donde cruza el calor, y saber decir en qué punto del proceso está la
      irreversibilidad.
    escalones:
      - id: el-techo-de-carnot
        titulo: El techo que ningún resultado puede superar
        aprendes: >-
          A calcular el rendimiento máximo entre dos focos y a usarlo como
          comprobación de plausibilidad de cualquier resultado con focos.
        teoria:
          tema: t05-segundo-principio
          apartado: el-teorema-de-carnot
          nota: >-
            La consecuencia que se usa es que el rendimiento de un motor
            reversible solo depende de las temperaturas de los focos: ni del
            fluido, ni del ciclo, ni del tamaño.
        ejercicios:
          - id: ejter-el-motor-que-promete-demasiado
            incrustado: true
            nota: >-
              El ejemplo de entrada. Un cálculo de dos líneas que sirve de
              comprobación en cualquier ejercicio con focos: si tu resultado
              pasa del techo, hay un error antes.
          - id: ejter-el-frigorifico-y-su-techo
            nota: >-
              El mismo teorema al revés. Y de paso, por qué el COP puede pasar
              de uno sin que nadie esté creando energía.
        dominio: >-
          Decir en dos líneas si un rendimiento o un COP anunciados son
          posibles entre dos temperaturas dadas, y cuánto se alejan del máximo.

      - id: el-balance-de-entropia
        titulo: El balance, y la temperatura del denominador
        aprendes: >-
          A separar los dos términos del balance —el que va con el calor y el
          que se genera— y a evaluar cada uno con la temperatura que le toca.
        teoria:
          tema: t06-entropia
          apartado: la-propiedad-que-se-crea
          nota: >-
            Y el error típico de «dividir el calor por la temperatura
            equivocada», que es el que más cálculos de entropía estropea: la
            temperatura es la de la superficie por donde cruza el calor, y esa
            depende de dónde hayas puesto la frontera.
        ejercicios:
          - id: ejter-dos-terminos-que-tiran-en-sentidos-contrarios
            incrustado: true
            nota: >-
              Nuestro, y va delante porque un balance de entropía no se puede
              plantear sin saber evaluar la variación de entropía de un gas.
              Son dos términos de signo contrario y el resultado es su
              diferencia: aquí se ve por qué redondear a mitad de camino
              arruina la cuenta.
          - id: ejter-la-mezcla-adiabatica-de-dos-corrientes
            nota: >-
              De la colección. Adiabático no significa que no se genere nada:
              significa que todo lo que hay es generación. Y el resultado sale
              de restar dos números casi iguales, así que no se puede redondear
              a mitad de camino.
          - id: ejter-la-entropia-que-genera-el-universo
            nota: >-
              El examen de enero de 2026. Un proceso declarado reversible que
              genera 0,2415 kJ/K en el universo, y la explicación de por qué no
              hay contradicción.
          - id: ejter-la-turbina-que-es-mala-y-hay-que-decirlo
            nota: >-
              El ejercicio 2 de enero de 2022-2023, entero: temperatura de
              entrada, rendimiento interno, exergía destruida y rendimiento
              exergético. Es el más largo de la asignatura y el que junta los
              cuatro temas del bloque de termodinámica; su comprobación final
              —trabajo más exergía destruida igual a exergía entregada— cuadra
              al decimal por dos caminos independientes.
        dominio: >-
          Calcular la entropía generada en el sistema y en el universo del
          mismo proceso, obtener números distintos y saber explicar la
          diferencia sin mirar los apuntes.
    falta: []
    revisado: '2026-09-07'

  - id: la-exergia-destruida
    apunte:
      texto: 'los dos últimos apartados, casi siempre'
      tono: nota
    titulo: La exergía destruida y el rendimiento exergético
    pide: >-
      «¿Cuánta exergía se destruye en la turbina?»; «el rendimiento exergético
      del condensador»; «la variación de exergía del universo»; «la exergía
      destruida en el proceso».
    porque: >-
      Aparece en las seis convocatorias, y casi siempre como los **dos últimos
      apartados** de un ejercicio: primero la exergía destruida y luego el
      rendimiento exergético. Va el último de los bloques de termodinámica
      porque necesita todo lo anterior —el balance de energía, el de entropía y
      los dos modelos de sustancia— y porque Guy-Stodola lo ata a la entropía
      generada del bloque previo.
    invariante:
      anios: 15
      fuente: >-
        **Quince de las diecisiete**, contando los apartados que piden exergía
        destruida o rendimiento exergético. Las dos que no la piden son junio de
        2018 y el 30 de enero de 2023. Es el bloque que más cae de toda la
        ruta, y en cinco convocatorias aparece **dos veces en el mismo examen**.
        Que sean «los dos últimos apartados» es lectura nuestra sobre el orden,
        y en trece de las quince el rendimiento exergético es el último o el
        penúltimo.
    dominio: >-
      Escribir el balance de exergía de un sistema y de su medio circundante
      con los tres signos cambiados en el segundo, y comprobar el resultado por
      Guy-Stodola, que es un camino independiente.
    escalones:
      - id: guy-stodola
        titulo: Guy-Stodola, y los signos del medio circundante
        aprendes: >-
          A convertir entropía generada en kilojulios de trabajo perdido, y a
          escribir el balance del medio circundante cambiando los tres signos
          del sistema.
        teoria:
          tema: t07-analisis-exergetico
          apartado: el-teorema-de-guy-stodola
          nota: >-
            Es lo que hace útil el concepto: 0,2415 kJ/K no le dice nada a
            nadie, y 69,6 kJ de trabajo perdido, sí. Y el apartado siguiente,
            «La exergía de flujo», es el que hace falta en los ejercicios de
            volumen de control.
        ejercicios:
          - id: ejter-lo-que-vale-un-calor-segun-donde-este
            incrustado: true
            nota: >-
              El ejemplo de entrada. Los mismos 500 kJ valen diez veces más a
              600 K que a 310, y es el argumento entero de la cogeneración en
              tres líneas de cuenta.
        dominio: >-
          Convertir una entropía generada en kilojulios de trabajo perdido, y
          saber decir a qué temperatura hay que multiplicar y por qué es esa y
          no otra.

      - id: los-dos-caminos-en-un-sistema-cerrado
        titulo: Los dos caminos, en un recipiente cerrado
        aprendes: >-
          A calcular la exergía destruida de las dos maneras que enseña el
          curso —Guy-Stodola y el balance de exergía— y a comprobar que dan lo
          mismo.
        teoria:
          tema: t07-analisis-exergetico
          apartado: la-exergía-de-un-sistema-cerrado
          nota: >-
            El apartado donde está la expresión del balance, que es el camino
            que casi nadie practica: se aprende Guy-Stodola porque es más
            corto y luego el examen pide los dos.
        ejercicios:
          - id: ejter-el-agua-caliente-y-la-fria-que-se-mezclan
            incrustado: true
            nota: >-
              Nuestro, y escrito para el molde que más se repite: **algo
              caliente metido en agua dentro de un recipiente adiabático**, que
              sale en febrero de 2020, en enero de 2025 y en febrero de 2025.
              Resuelve la exergía destruida por los dos caminos y los dos dan
              35,3 kJ. Su mejor momento es el final: en un recipiente
              adiabático **no sale ni un julio** y aun así se destruyen treinta
              y cinco kilojulios de trabajo.
        dominio: >-
          Que ante «calcúlese la exergía destruida» sepas escribir los dos
          caminos sin mirar, y que si no coinciden busques el fallo en el
          signo de una variación de entropía.

      - id: el-rendimiento-exergetico
        titulo: El rendimiento exergético, que no es el isentrópico
        aprendes: >-
          A distinguir el rendimiento exergético del isentrópico y a calcular
          la exergía destruida en un equipo de flujo.
        teoria:
          tema: t07-analisis-exergetico
          apartado: el-rendimiento-exergético
          nota: >-
            Y el apartado anterior, «La exergía de flujo», que es el que hace
            falta en cuanto el sistema deja de ser cerrado.
        ejercicios:
          - id: ejter-el-rendimiento-exergetico-de-un-compresor
            nota: >-
              Nuestro, y escrito para el hueco que el material no cubre: el
              rendimiento exergético de un compresor. Su lección es que **no
              es el isentrópico** —salen 0,861 y 0,753 sobre la misma
              máquina—, y responder con uno donde piden el otro es un cero con
              la cuenta bien hecha.
          - id: ejter-la-exergia-que-el-universo-destruye
            nota: >-
              Los apartados d) y e) del examen de enero de 2026. Termina con un
              paso de redacción: explicar por qué la variación de exergía del
              universo sale negativa, que es donde se ve si has entendido el
              balance o solo lo has calculado.
        dominio: >-
          Que ante un equipo de flujo escribas la exergía de flujo y no la de
          sistema cerrado, y que no entregues el isentrópico donde piden el
          exergético.
    falta:
      - >-
        **~~Este bloque tiene un solo escalón para lo que más cae~~ · resuelto
        el 10 de septiembre de 2026.** Es el bloque que más pesa de la ruta
        —cae 15 de 17, y en cinco convocatorias **dos veces en el mismo
        examen**— y tenía un escalón con tres ejercicios metidos dentro. Ahora
        son tres, partidos por lo que de verdad cambia la ecuación: el teorema
        de Guy-Stodola, el sistema **cerrado** y el equipo de **flujo**. El del
        medio es nuevo entero, y con él el molde que más se repite en las
        diecisiete —algo caliente metido en agua en un recipiente adiabático—
        deja de no tener ni un ejercicio.

        Y el precio, que conviene decir: dos de los tres escalones se quedan
        **con un solo ejercicio**, porque en el tema 7 no hay más. Es un
        cambio a peor en un recuento —los escalones de un ejercicio del sitio
        pasan de diez a doce— a cambio de que cada peldaño enseñe una sola
        cosa. Lo que falta aquí no es estructura: es material, y la colección
        de la asignatura no trae ni un problema de exergía.
      - >-
        Un aviso sobre cómo lo piden, que sale de la extraordinaria de 2025:
        ahí la exergía destruida se pide **dos veces en el mismo apartado**, «de
        una de las dos maneras enseñadas en el curso» y después «de la otra
        manera». No basta con saber un camino: hay que tener los dos —el
        balance de exergía y Guy-Stodola— y saber que dan lo mismo. El escalón
        de este bloque ya lo entrena, y por eso su criterio de dominio dice
        justo eso.
    revisado: '2026-09-09'

  # ═══════════════════════════════════════════════════════════════════
  # EL TERCER EJERCICIO
  # ═══════════════════════════════════════════════════════════════════
  - id: la-transmision-de-calor
    apunte:
      texto: 'el tercer ejercicio de las 6 convocatorias'
      tono: nota
    titulo: La transmisión de calor
    pide: >-
      «Una tubería de cobre de 10 cm de diámetro interior transporta 0,12 kg/s
      de agua caliente»; «al cabo de cuántos metros de longitud habrá
      descendido la temperatura»; «calcúlese la emisividad de la superficie
      exterior de la tubería».
    porque: >-
      Es el tercer ejercicio en las seis convocatorias leídas, sin una sola
      excepción, y siempre es una tubería. Va el último no porque rinda menos
      —vale un tercio del examen, igual que los otros dos— sino porque **no
      depende de nada de lo anterior**: se puede estudiar aparte, y eso lo
      convierte en el bloque que conviene tener a mano cuando queda poco tiempo.
    invariante:
      anios: 16
      fuente: >-
        **Dieciséis de las diecisiete**, contando el ejercicio de transmisión
        de cada una. La única discutible es febrero de 2020, cuyo tercero es un
        intercambiador rectangular que cede calor al aire por arriba y se
        resuelve por balance de energía: hay transmisión dentro, pero no se pide
        ningún coeficiente ni ninguna resistencia, así que aquí no se cuenta. Y
        el orden no está fijo: en enero de 2019 este ejercicio es el **primero**
        del examen. Que conducción y convección sean un solo bloque y no dos es
        lectura nuestra, y sale de que en las dieciséis aparecen dentro del
        mismo ejercicio y en el mismo circuito de resistencias.
    dominio: >-
      Dibujar el circuito de resistencias de una tubería con sus capas y sus
      dos convecciones, calcular cada una con la correlación y la temperatura
      que le tocan, y decir cuál manda antes de proponer ninguna mejora.
    escalones:
      - id: el-circuito-de-resistencias
        titulo: Un muro es un circuito
        aprendes: >-
          A montar la analogía termoeléctrica y a sumar resistencias planas,
          cilíndricas y de convección sin mezclar las unidades de unas y otras.
        teoria:
          tema: t08-conduccion
          apartado: la-analogía-termoeléctrica
          nota: >-
            Las tres geometrías y sus tres resistencias. Y el aviso de no
            mezclar resistencias por unidad de área con resistencias a secas,
            que es lo que pasa en cuanto un problema junta una capa cilíndrica
            con una convección.
        ejercicios:
          - id: ejter-el-aislante-de-la-camara-frigorifica
            incrustado: true
            nota: >-
              De la colección, y resuelto allí dos veces: integrando y por
              analogía. Verlo por los dos caminos es lo que permite usar la
              analogía después sin remordimientos.
        dominio: >-
          Convertir un muro o una tubería de varias capas en un circuito, con
          todas las resistencias en las mismas unidades, y resolverlo como una
          ley de Ohm.

      - id: que-resistencia-manda
        titulo: Cuál es la resistencia dominante
        aprendes: >-
          A repartir la resistencia total entre sus términos y a decidir dónde
          conviene actuar, que es la pregunta que el examen hace de verdad.
        teoria:
          tema: t08-conduccion
          apartado: el-ejemplo-del-examen-y-la-pregunta-que-de-verdad-importa
          nota: >-
            Con el reparto delante, la chapa de acero aporta el 0,26 % y la
            película de aire exterior el 53 %. Identificar cuál manda antes de
            gastar dinero es el oficio.
        ejercicios:
          - id: ejter-el-muro-de-tres-capas-y-la-que-manda
            incrustado: true
            nota: >-
              El ejemplo de entrada. Un muro de fachada donde seis centímetros
              de aislante son el 97 % de la resistencia, para ver que el
              reparto no va por espesor sino por L partido por k.
          - id: ejter-que-resistencia-manda-en-la-tuberia
            nota: >-
              El ejercicio 3 de enero de 2026, y la respuesta contraria a la
              del muro: aquí manda la convección exterior, no el aislante. Por
              eso la pregunta se contesta calculando y no de memoria.
        dominio: >-
          Dar el porcentaje de cada resistencia sobre el total y decir cuál
          tocarías primero para reducir las pérdidas, con el número delante.

      - id: la-correlacion-y-su-temperatura
        titulo: La correlación, y a qué temperatura se lee
        aprendes: >-
          A elegir la correlación según la geometría y el régimen, y a leer las
          propiedades a la temperatura que esa correlación pide, que no es
          siempre la misma.
        teoria:
          tema: t09-conveccion
          apartado: dentro-de-una-tubería-dittus-boelter
          nota: >-
            Dittus-Boelter es la excepción del tema: propiedades a la
            temperatura del fluido, no a la de película. Y el exponente de
            Prandtl cambia según el fluido se caliente o se enfríe.
        ejercicios:
          - id: ejter-que-es-exactamente-el-coeficiente-de-pelicula
            incrustado: true
            nota: >-
              Nuestro, y de entrada: la ley de Newton con el coeficiente ya
              dado, para fijar qué significa h antes de pasar dos horas
              calculándolo. Si no tienes claro por qué un ventilador lo
              multiplica por cinco, ninguna correlación te va a servir de
              nada.
          - id: ejter-el-rayleigh-que-obliga-a-churchill-chu
            nota: >-
              También nuestro, y escrito para el caso que el material esquiva:
              un Rayleigh por encima de mil millones, donde la correlación
              corta queda fuera de rango y no hay atajo. El precio de no
              comprobarlo está medido: un 19 %.
          - id: ejter-cuanta-tuberia-para-calentar-el-agua
            nota: >-
              De la colección, con sus valores intermedios publicados. Y con el
              aviso que más vale saber: esta asignatura **no** usa la
              diferencia media logarítmica, y eso cambia el resultado un 18 %.
          - id: ejter-el-agua-que-corre-por-dentro-de-la-tuberia
            nota: >-
              Del examen de enero de 2026. Treinta W/(m²·K) para agua es un
              valor pobrísimo, y todo viene de la velocidad: h no es una
              propiedad del fluido, sino de lo que el fluido está haciendo.
          - id: ejter-la-pared-por-dos-caminos-y-el-numero-que-sobraba
            nota: >-
              El ejercicio 3 de enero de 2024-2025, con convección **natural**
              y con una exigencia que conviene tomarse en serio: el enunciado
              obliga a resolverlo de las dos maneras, integrando y por
              analogía. Y el dato de la altura, que no encaja en ninguna otra
              cuenta, es el que te dice qué correlación toca.
        dominio: >-
          Elegir la correlación correcta, decir a qué temperatura se leen sus
          propiedades y comprobar sus condiciones de aplicación antes de
          usarla.

      - id: la-radiacion
        titulo: La radiación, y su red de resistencias
        aprendes: >-
          A montar el circuito de radiación con sus dos tipos de resistencia, y
          a saber cuándo vale la fórmula corta y cuándo no.
        teoria:
          tema: t10-radiacion
          apartado: la-analogía-eléctrica-otra-vez
          nota: >-
            Dos tipos de resistencia y no uno: la superficial, que vale cero si
            la superficie es negra, y la geométrica, que lleva el factor de
            visión.
        ejercicios:
          - id: ejter-por-que-la-radiacion-va-a-la-cuarta
            incrustado: true
            nota: >-
              Nuestro, y va primero por una razón concreta: en radiación
              meter grados Celsius no produce un error del diez por ciento,
              produce 648 donde había 6.889. Y de paso queda claro cuánto
              pesa el entorno, que es lo que la cuarta potencia decide.
          - id: ejter-dos-placas-y-una-pantalla
            nota: >-
              El caso más simple, con las tres variantes que el tema explica.
              Y una sorpresa: bajar la emisividad resulta más eficaz que meter
              una pantalla negra.
          - id: ejter-el-conducto-dentro-del-conducto
            nota: >-
              El caso donde la fórmula corta falla, y por casi el doble. Si el
              enunciado te da la emisividad de la superficie grande, es porque
              hace falta.
          - id: ejter-la-emisividad-que-sale-de-lo-que-sobra
            nota: >-
              El ejercicio 3 de enero de 2017-2018, y el único del material que
              junta los tres mecanismos en un solo circuito: conducción,
              convección forzada dentro, convección natural fuera y radiación
              en paralelo con esta última. La emisividad no se calcula: se
              despeja de lo que sobra. Y su lectura resume el bloque: a 94 °C,
              **el 46 % de las pérdidas se van por radiación**.
        dominio: >-
          Resolver un intercambio radiante entre dos superficies grises con el
          circuito completo, y saber justificar cuándo se puede simplificar y
          cuándo no.
    falta:
      - >-
        El **factor de visión** entre dos superficies que no sean «cuerpo
        pequeño dentro de un recinto grande» no tiene ejercicio: los cuatro
        publicados resuelven con el factor igual a uno. El álgebra de los
        factores está explicada en la prosa del tema 10, pero las gráficas de
        las que se leen no se pueden reproducir, así que un ejercicio propio
        necesitaría el anexo de eGELA.
    revisado: '2026-09-07'
