asignatura: fundamentos-quimicos
evaluacion: primer-cuatrimestre
# El control **no** tiene ruta propia, y es una decisión medida. Las tres
# convocatorias del primer cuatrimestre —los controles de 2023-2024 y de
# 2024-2025 y el final de 2024-2025— cubren exactamente los mismos cuatro
# temas, y el control de 2024-2025 los cubre los cuatro él solo, igual que el
# final. Lo único que cambia es el reparto de puntos.
#
# La diferencia real está en otro sitio y se dice en el criterio de orden: el
# control de 2023-2024 es casi todo estequiometría —tres de sus cuatro
# ejercicios— y el final reparte más. Quien prepara un control concreto mira
# cuál es y adelanta el bloque que ese año pesó.
tambienPrepara:
  - control-primer-cuatrimestre
titulo: Preparar el primer cuatrimestre de Fundamentos Químicos
lede: >-
  El primer cuatrimestre no encadena: son cuatro bloques que se pueden estudiar
  casi por separado, y en las tres convocatorias caen casi todos. Dos de ellos
  —contar partículas y rellenar la tabla periódica— aparecen en las tres, así
  que aquí no hay nada que descartar. Hay un orden, y lo decide qué necesita
  qué.
temas:
  - t01-compuestos-y-estequiometria
  - t02-estructura-atomica
  - t03-enlace-quimico
  - t04-estados-y-propiedades
medidoSobre: 3
fueraDeLaVentana:
  - curso: '2012-2013'
    porque: >-
      Es la ordinaria del 31 de mayo de 2013: un solo examen con temas de los
      dos cuatrimestres, así que no es de ninguno, y queda diez años antes que
      las tres de la ventana. Sus ejercicios se enlazan en el escalón de su
      tema; lo que no hace es contar en las frecuencias.
criterioDeOrden: >-
  Por dependencia primero y por rendimiento después, contado sobre las tres
  convocatorias. Delante van formular y nombrar, que no es un hueco grande —2
  de 3, y 1,25 y 1,00 puntos— pero sin lo cual no se puede ni empezar el resto:
  quien no sabe escribir una fórmula no puede ajustar una ecuación ni
  identificar un sólido. Después la estequiometría (3 de 3) y la tabla
  periódica (3 de 3), que son los dos huecos grandes. Y al final el enlace (2
  de 3) y los estados de la materia (2 de 3), que dependen de la configuración
  electrónica del bloque anterior.


  **Cómo se han determinado los huecos de esta ruta.** Un bloque sin `falta[]`
  no es un bloque sin mirar: el 6 de septiembre de 2026 se pasaron todos sus
  bloques por cuatro criterios medidos —si su tema tiene pocos ejemplos de
  entrada para lo que el examen le exige, si sus ejercicios usan una
  herramienta que la prosa no nombra en ninguna parte, si algún escalón suyo
  empieza directamente en un ejercicio de examen, y si el bloque salta del
  ejemplo al examen sin ningún problema de colección en medio— y solo se
  declara lo que sale de alguno de ellos. Cada bloque lleva anotada la fecha en
  que se revisó, así que el que se añada mañana y no se mire se va a notar.

bloques:
  # ═══════════════════════════════════════════════════════════════════
  # SUELO
  # ═══════════════════════════════════════════════════════════════════
  - id: suelo-formular-y-nombrar
    apunte:
      texto: 'poco peso propio — y todo lo demás lo necesita'
      tono: marco
    titulo: Escribir una fórmula y leer un nombre
    pide: >-
      «Nombra o formula los siguientes compuestos», con una lista de diez: la
      mitad en cada dirección.
    porque: >-
      Como ejercicio propio cae en dos de las tres convocatorias y vale poco:
      1,25 puntos en un control y 1,00 en el otro. Pero está dentro de todo lo
      demás. El ejercicio de estequiometría empieza pidiendo el nombre de cinco
      compuestos, el de tipos de sólido pide completar la tabla con la fórmula
      de cada uno, y una ecuación no se ajusta si no se sabe escribir. Es un
      suelo de manual: poco peso propio y todos los demás encima.
    invariante:
      anios: 3
      fuente: >-
        Las tres convocatorias del primer cuatrimestre, leídas apartado por
        apartado. Que formular esté «dentro» de los otros bloques y no solo en
        su ejercicio es lectura nuestra, y sale de que el 1.1 del final y el
        3.1 del control piden fórmulas sin que ese sea su tema.
    dominio: >-
      Escribir la fórmula de un compuesto a partir de cualquiera de sus dos
      nombres, el de stock y el tradicional, y nombrarlo en las dos direcciones
      sin dudar de la valencia.
    escalones:
      - id: cruzar-las-cargas
        titulo: El subíndice de cada uno es la carga del otro
        aprendes: >-
          A construir la fórmula de un compuesto iónico cruzando las cargas, y
          a simplificar cuando toca.
        teoria:
          tema: t01-compuestos-y-estequiometria
          apartado: nombrar-y-formular
        ejercicios:
          - id: ejfq1-cruzar-las-cargas-una-vez
            incrustado: true
            nota: >-
              La rampa. Dos compuestos, uno que se simplifica y otro que no,
              antes de los diez del examen.
          - id: colfq1-f1-formular-del-1-al-10
            nota: >-
              La hoja 1 del curso en la dirección de formular: óxidos,
              anhídridos, peróxidos, hidruros y sales binarias, cuarenta
              compuestos en cuatro bloques de diez.
          - id: colfq1-f1-formular-del-11-al-20
          - id: colfq1-f1-formular-del-21-al-30
          - id: colfq1-f1-formular-del-31-al-40
          - id: colfq1-f2-formular-del-1-al-12
            nota: >-
              La hoja 2: hidróxidos y oxoácidos, con la trampa de meta-, piro- y
              orto-, que cambian las aguas y no el estado de oxidación.
          - id: colfq1-f2-formular-del-13-al-25
          - id: colfq1-f3-formular-del-1-al-12
            nota: >-
              La hoja 3: oxisales y sales ácidas, el peldaño más alto antes del
              examen. Aquí el anión sale del ácido y su carga decide todo.
          - id: colfq1-f3-formular-del-13-al-25
          - id: exfq2324-1c-control-2-diez-compuestos-que-nombrar-o-formular
            nota: >-
              Diez compuestos con los tres sitios donde se pierden puntos: los
              peróxidos, la pareja -ato/-ito y el ácido bromhídrico frente al
              brómico.
        dominio: >-
          Dar la fórmula del sulfato férrico y la del nitrato de bario sin
          mirar nada, y explicar de dónde sale cada subíndice.

      - id: las-dos-nomenclaturas
        titulo: Stock y tradicional, que son la misma cosa
        aprendes: >-
          A traducir entre «hierro(III)» y «férrico», y a no tomar los sufijos
          por números fijos.
        teoria:
          tema: t01-compuestos-y-estequiometria
          apartado: nombrar-y-formular
          nota: >-
            Los sufijos son relativos al metal: férrico es 3 porque el hierro
            tiene 2 y 3, y plúmbico es 4 porque el plomo tiene 2 y 4.
        ejercicios:
          - id: ejfq1-ico-y-oso-no-son-numeros
            incrustado: true
            nota: >-
              La rampa. Dos metales con valencias distintas y el mismo sufijo,
              que es la única idea del escalón: -ico no es un número.
          - id: colfq1-f1-nombrar-del-1-al-10
            nota: >-
              Las mismas tres hojas en la otra dirección, de la fórmula al
              nombre, que es la que más cuesta: el sufijo hay que deducirlo de
              la neutralidad, no leerlo.
          - id: colfq1-f1-nombrar-del-11-al-20
          - id: colfq1-f1-nombrar-del-21-al-30
          - id: colfq1-f1-nombrar-del-31-al-40
          - id: colfq1-f2-nombrar-del-1-al-12
          - id: colfq1-f2-nombrar-del-13-al-25
          - id: colfq1-f3-nombrar-del-1-al-12
          - id: colfq1-f3-nombrar-del-13-al-25
          - id: exfq2425-1c-control-5-nombra-y-formula
            nota: >-
              El enunciado imprime los dos nombres del mismo compuesto
              —«Plomo(II) hidróxido / hidróxido plumboso»— y ahí está la
              pregunta.
        dominio: >-
          Ver «-ico» y preguntarte cuál es la valencia mayor **de ese metal**,
          en vez de contestar tres por costumbre.
    falta:
      - >-
        La formulación orgánica tiene su apartado en el tema 1 y ningún
        ejercicio. Las tres hojas del curso son de inorgánica, y los exámenes
        solo nombran compuestos orgánicos sueltos —el etanol, el octano, el
        cloruro de vinilo— sin preguntar por su nombre.

        Hasta el 28 de septiembre de 2026 esta nota decía que entre los dos
        ejemplos de entrada y los dos ejercicios de examen no había peldaño
        intermedio, y que no era una carencia del material: los boletines
        traían 180 compuestos y faltaba transcribirlos. Ya están los 180, en
        dieciséis ejercicios repartidos entre los dos escalones.
    revisado: '2026-09-28'

  # ═══════════════════════════════════════════════════════════════════
  # LOS CUATRO HUECOS
  # ═══════════════════════════════════════════════════════════════════
  - id: contar-particulas
    apunte:
      texto: 'las 3 de 3 — y el ejercicio más largo del examen'
      tono: nota
    titulo: La cadena estequiométrica, de gramos a litros
    pide: >-
      «Calcular el rendimiento de la primera etapa», «la cantidad total de O₂
      necesaria», «el volumen de H₂SO₄ suponiendo un rendimiento del 95 %»,
      «calcular la molalidad de la dilución».
    porque: >-
      Cae en las tres convocatorias y en las tres es el ejercicio más largo:
      3,75 puntos en un control, 1,00 más en otro apartado del mismo, y 3,50 en
      el final. No es difícil por ninguna cuenta suelta — es difícil porque el
      resultado de cada apartado entra en el siguiente, así que un fallo en el
      primero se arrastra hasta el último.
    invariante:
      anios: 3
      fuente: >-
        Las tres convocatorias. Que la cadena industrial del final y la
        calcopirita del control sean «el mismo ejercicio con otro mineral» es
        lectura nuestra: los dos nombran, ajustan, arrastran un rendimiento y
        terminan en disoluciones o en volúmenes de gas.
    dominio: >-
      Recorrer la cadena entera —del dato que te den a lo que te pidan— sin
      pararte a decidir por dónde, y arrastrar un rendimiento sin aplicarlo dos
      veces.
    escalones:
      - id: el-puente-del-mol
        titulo: Todo pasa por el mol
        aprendes: >-
          A entrar y salir de los moles desde gramos, litros de gas, litros de
          disolución o número de partículas.
        teoria:
          tema: t01-compuestos-y-estequiometria
          apartado: todo-el-tema-es-un-puente-y-el-puente-es-el-mol
          nota: >-
            La figura del apartado enseña las cuatro puertas y deja claro que
            la única flecha con química dentro es la del centro.
        ejercicios:
          - id: ejfq1-el-puente-del-mol-una-sola-vez
            incrustado: true
            nota: >-
              El ejemplo de entrada. Un solo cruce del puente, sin apartados
              encadenados detrás.
          - id: ejfq1-el-puente-del-mol-en-las-cuatro-direcciones
            nota: >-
              El segundo peldaño, y nuestro. El anterior cruza el puente de
              gramos a gramos; este lo cruza también hacia moléculas, hacia
              litros y hacia átomos, que es la otra mitad. Su mejor momento es
              el último apartado: contar moléculas y contar átomos de oxígeno
              no es lo mismo, y el subíndice de la fórmula es un factor de
              conversión más.
        dominio: >-
          Ver un enunciado que da litros y pide gramos y saber, antes de leer
          nada más, que hay que pasar por el centro.

      - id: limitante-y-rendimiento
        titulo: Quién se acaba primero, y cuánto se pierde
        aprendes: >-
          A identificar el reactivo limitante y a aplicar un rendimiento en el
          sitio correcto de la cadena.
        teoria:
          tema: t01-compuestos-y-estequiometria
          apartado: el-rendimiento-y-lo-que-arrastra
        ejercicios:
          - id: colfq1-1-el-sulfato-amonico-y-el-abono
            nota: >-
              Una tonelada de un reactivo y 4.870 moles del otro, y el
              limitante es el segundo. El problema existe para que no te fíes
              de la cifra que más impresiona.
          - id: exfq2324-1c-control-4-la-calcopirita-y-la-errata-del-rendimiento
            nota: >-
              Trae una errata en el enunciado que daría un rendimiento del
              93 588 %. Se reproduce tal cual y se explica en la resolución:
              detectar que un resultado es imposible también es el ejercicio.
          - id: exfq1213-ord-4-la-calcopirita-y-sus-tres-rendimientos
            nota: >-
              La misma calcopirita en 2013, con tres rendimientos en cadena: del
              ácido que se quiere se sube a la calcopirita que hace falta, y de
              ahí se baja al cobre y al SO₂ que escapa.
          - id: exfq2425-modelo-5-la-blenda-y-el-acido-sulfurico
            nota: >-
              Del modelo de examen de 2024-2025, con la resolución del
              profesor detrás: la blenda que hace falta para 200 kg de ácido
              con un rendimiento del 90 %, y el ácido en otras dos unidades.
          - id: exfq2425-1c-1-el-acido-sulfurico-en-tres-etapas
            nota: >-
              Tres etapas en serie, y el rendimiento de la primera se arrastra
              hasta el final. Es el molde completo.
        dominio: >-
          Aplicar un rendimiento una sola vez y en el paso que toca, y darte
          cuenta sin ayuda cuando un resultado intermedio es físicamente
          imposible.

      - id: la-formula-empirica
        titulo: Deducir la fórmula sin ver la molécula
        aprendes: >-
          A sacar la fórmula empírica de un análisis de combustión y a subir de
          ahí a la molecular con la masa molar.
        teoria:
          tema: t01-compuestos-y-estequiometria
          apartado: la-fórmula-empírica-contar-sin-ver
        ejercicios:
          - id: colfq1-3-la-niacina-y-las-dos-muestras
            nota: >-
              Misma trampa que el de examen y con la solución oficial
              publicada: el nitrógeno se mide sobre una muestra distinta y hay
              que escalarlo antes de restar nada.
          - id: exfq2324-1c-control-3-la-formula-de-la-cocaina
            nota: >-
              La vuelta de tuerca es que el nitrógeno se mide sobre una muestra
              **distinta**. Quien no lo ve divide entre la masa equivocada y le
              sale una fórmula que no es ninguna sustancia.
          - id: exfq2425-modelo-4-el-hipnotico-clorado-y-su-formula-empirica
            nota: >-
              Del modelo de 2024-2025: el cloro se mide como cloruro de plata,
              y los cocientes salen 1,5, que no se redondean.
        dominio: >-
          Montar el análisis con dos muestras distintas sin cruzar sus masas, y
          decidir el factor que sube de empírica a molecular.

      - id: disoluciones
        titulo: Cuatro formas de decir cuánto hay disuelto
        aprendes: >-
          A moverte entre molaridad, molalidad, porcentaje en masa y densidad,
          y a diluir sin perder moles.
        teoria:
          tema: t01-compuestos-y-estequiometria
          apartado: disoluciones-cuatro-formas-de-decir-cuánto-hay
        ejercicios:
          - id: ejfq1-del-frasco-al-matraz
            incrustado: true
          - id: colfq1-2-el-sulfurico-que-se-diluye-dos-veces
            nota: >-
              Molaridad, molalidad y normalidad de la misma disolución, y
              después una mezcla. El detalle que se olvida es que el ácido
              concentrado ya traía agua dentro.
          - id: exfq2425-1c-1-el-acido-sulfurico-en-tres-etapas
            nota: >-
              El apartado 1.5 lo pide entero: preparar, diluir y sacar la
              molalidad. Aparece aquí y en el escalón del rendimiento.
        dominio: >-
          Preparar una disolución desde un reactivo comercial con su pureza y
          su densidad, y saber qué se conserva al diluir y qué no.
    falta:
      - >-
        El primer escalón, el del puente del mol, tenía **un solo ejercicio**
        hasta el 8 de septiembre de 2026, y era el escalón más corto de las dos
        rutas de Química siendo el que más se usa después. Ahora son dos: el
        segundo cruza el puente hacia moléculas, litros y átomos, que es la
        mitad que el primero no tocaba.

        Lo que sigue faltando es **colección**: los tres problemas del tema 1
        son uno de reactivo limitante, uno de fórmula empírica y uno de
        disoluciones, así que los tres caen en los escalones siguientes, y para
        el paso más básico no hay con qué repetir más allá de lo que hemos
        escrito nosotros. Esta nota decía que los tres eran «de reactivo
        limitante y de fórmula empírica» —se dejaba fuera el de disoluciones—
        y que este escalón ya tenía dos ejercicios cuando tenía uno: el
        segundo estaba escrito, pero colgado del escalón siguiente, que va de
        reactivo limitante y no del puente. Las dos cosas, corregidas el 8 de
        septiembre de 2026.
    revisado: '2026-09-08'

  - id: la-tabla-periodica
    apunte:
      texto: 'las 3 de 3 — siempre una tabla que rellenar'
      tono: nota
    titulo: Rellenar la tabla, de la Z a las propiedades
    pide: >-
      «Completar la tabla», «calcular la carga nuclear efectiva del electrón
      más externo», «¿cuál tendrá mayor radio atómico?», «indicar los números
      cuánticos del electrón diferenciador».
    porque: >-
      Es el bloque más regular de los cuatro: cae en las tres convocatorias y
      en las tres con el mismo formato, una tabla de cuatro o cinco columnas
      que hay que rellenar. Vale 3,00, 3,00 y 2,00 puntos. Y se resuelve entero
      con una cadena de un solo sentido, así que es también el que mejor rinde
      por hora estudiada.
    invariante:
      anios: 3
      fuente: >-
        Las tres convocatorias. Que las tres pidan «lo mismo con distinta cara»
        es lectura nuestra: una da los números atómicos, otra da grupo y
        periodo y otra mezcla las dos formas, pero las tres se resuelven
        escribiendo la configuración y leyéndola.
    dominio: >-
      Coger un número atómico y llegar hasta la afinidad electrónica sin
      saltarte ningún eslabón, y saber en cada paso si manda n o manda la
      carga efectiva.
    escalones:
      - id: los-numeros-cuanticos
        titulo: El átomo por dentro, y los cuatro números de cada electrón
        aprendes: >-
          A contar protones, neutrones y electrones, a sacar una masa atómica
          media, y a decidir si cuatro números cuánticos describen un
          electrón posible.
        teoria:
          tema: t02-estructura-atomica
          apartado: los-cuatro-números-cuánticos-y-qué-prohíbe-cada-uno
        ejercicios:
          - id: colfq2-p1-9-protones-neutrones-y-el-simbolo
          - id: colfq2-4-cuatro-masas-atomicas-medias
            nota: >-
              La media ponderada por la abundancia, y por qué no cae
              necesariamente junto al isótopo más abundante.
          - id: colfq2-5-seis-conjuntos-de-numeros-cuanticos
          - id: colfq2-p15-17-ocho-conjuntos-y-el-oxigeno
          - id: colfq2-p18-20-verdadero-o-falso-y-cinco-configuraciones
          - id: colfq2-p13-14-el-germanio-y-el-hidrogeno
            nota: >-
              Las dos cuentas con números del tema: la energía de un
              electrón arrancado y la línea del hidrógeno.
        dominio: >-
          Tachar en diez segundos un conjunto de números cuánticos imposible
          y decir cuál de las cuatro reglas incumple.

      - id: la-configuracion-en-dos-ordenes
        titulo: La configuración se escribe dos veces
        aprendes: >-
          A escribir una configuración en el orden de llenado y en el
          energético, y a saber para qué sirve cada una.
        teoria:
          tema: t02-estructura-atomica
          apartado: la-configuración-electrónica-se-escribe-dos-veces
          nota: >-
            El diagrama de Moeller es una herramienta para no olvidarse de
            ningún orbital, no un formato de respuesta. Grupo y periodo se
            leen sobre la otra.
        ejercicios:
          - id: ejfq2-cuantos-caben-en-el-nivel-tres
            incrustado: true
          - id: ejfq2-el-cinc-y-sus-dos-configuraciones
            nota: >-
              El peldaño de en medio, y nuestro. El cinc es el caso donde los
              dos órdenes dan respuestas distintas: el diferenciador es un 3d y
              el más externo un 4s. Y termina con la asimetría que más se
              falla — entra antes el 4s y sale antes el 4s también, así que el
              catión conserva los diez 3d.
          - id: colfq2-6-seis-configuraciones-atomos-e-iones
          - id: colfq2-p21-24-configuraciones-e-isoelectronicas
          - id: colfq2-8-cuatro-configuraciones-cuatro-elementos
            nota: >-
              De la configuración al periodo, el grupo y el tipo, y el
              gadolinio, que no se deja leer a la primera.
          - id: colfq2-p27-28-de-la-configuracion-al-elemento
          - id: exfq2425-1c-control-1-cinco-elementos-del-periodo-cinco
            nota: >-
              Tres de las cinco filas dan grupo y periodo en vez de la Z, así
              que hay que recorrer la cadena en el sentido contrario.
        dominio: >-
          Escribir la configuración de un elemento del bloque d en los dos
          órdenes y decir cuál es su electrón diferenciador y cuál el más
          externo, que no son el mismo.

      - id: slater
        titulo: La carga efectiva, con sus dos tablas
        aprendes: >-
          A calcular la carga nuclear efectiva por las reglas de Slater, y a
          usar la tabla que toca según el electrón sea s, p o d.
        teoria:
          tema: t02-estructura-atomica
          apartado: la-carga-nuclear-efectiva-por-las-reglas-de-slater
          nota: >-
            La figura del apartado reparte el apantallamiento del bromo en sus
            tres pesos. Y hay un patrón de comprobación: el sodio tiene que
            dar 2,20 y el cloro 6,10.
        ejercicios:
          - id: ejfq2-el-slater-mas-corto
            incrustado: true
            nota: >-
              El Slater más corto que existe con los tres pesos en juego, y su
              resultado está publicado en la colección. Sirve de patrón.
          - id: colfq2-7-tres-slater-y-uno-es-distinto
            nota: >-
              Tres átomos, y uno de ellos con el electrón diferenciador en un
              orbital d, que usa la otra tabla.
          - id: colfq2-p23-cuatro-slater-del-periodo-5
            nota: >-
              Cuatro del mismo periodo, y el patrón que ahorra cuentas: en
              qué grupos la carga efectiva no cambia al bajar.
          - id: colfq2-9-selenio-y-cesio
          - id: exfq2324-1c-control-1-cuatro-elementos-y-una-tabla
        dominio: >-
          Hacer un Slater de un electrón p y otro de uno d sin confundir las
          tablas, y comprobar el método contra el sodio antes de fiarte.

      - id: las-propiedades-periodicas
        titulo: Radio, ionización y electronegatividad, razonadas
        aprendes: >-
          A ordenar elementos por cualquiera de las cuatro propiedades diciendo
          si decide n o decide la carga efectiva.
        teoria:
          tema: t02-estructura-atomica
          apartado: las-propiedades-periódicas-salen-todas-de-la-carga-efectiva-y-de-n
        ejercicios:
          - id: colfq2-10-ordenar-por-electronegatividad
            nota: >-
              Un apartado dentro de un grupo y otro dentro de un periodo, que
              son los dos criterios y no se mezclan.
          - id: colfq2-11-tres-segundas-ionizaciones
          - id: colfq2-p29-35-el-salto-que-dice-el-grupo
            nota: >-
              Las ionizaciones sucesivas: el salto grande dice cuántos
              electrones de valencia hay.
          - id: colfq2-p30-calcio-selenio-y-cromo
          - id: colfq2-p31-32-fluor-contra-calcio-bromo-contra-potasio
          - id: colfq2-p33-34-ordenar-por-tamano-ionizacion-y-electronegatividad
          - id: exfq2425-1c-3-tres-elementos-y-la-tabla-descolocada
            nota: >-
              Las filas llegan descolocadas y hay que emparejarlas razonando
              la tendencia. Dos elementos solo se separan por la segunda
              energía de ionización.
        dominio: >-
          Ordenar cinco elementos de un periodo y cuatro de un grupo diciendo
          en cada caso cuál de los dos factores manda, y explicar por qué la
          afinidad electrónica no sigue una flecha limpia.

      - id: el-radio-ionico
        titulo: El radio iónico y las series isoelectrónicas
        aprendes: >-
          A comparar iones cuando las reglas de catión y anión no bastan porque
          todos tienen los mismos electrones.
        teoria:
          tema: t02-estructura-atomica
          apartado: el-radio-iónico-y-la-serie-isoelectrónica
        ejercicios:
          - id: ejfq2-cinco-iones-con-diez-electrones
            incrustado: true
            nota: >-
              La rampa. Una serie isoelectrónica limpia, los cinco iones del
              neón, sin ningún ion de fuera que obligue a cambiar de criterio
              a mitad de la comparación.
          - id: ejfq2-el-potasio-el-cloro-y-sus-dos-iones
            nota: >-
              El peldaño de en medio, y nuestro. El anterior compara cinco
              iones con los mismos electrones, donde solo decide la carga;
              este mezcla dos periodos y compara cada átomo con su propio ion,
              que es cuando hay que aplicar las dos reglas **en orden**. Su
              pieza trampa es la más útil del bloque: una ordenación correcta
              con el motivo equivocado, que es media pregunta perdida cuando
              el examen pide razonar.
          - id: colfq2-p25-26-protones-y-electrones-de-trece-iones
          - id: exfq2324-1c-control-1-cuatro-elementos-y-una-tabla
            nota: >-
              El apartado 1.5 pide ordenar tres iones, y son dos comparaciones
              distintas: una dentro de la serie isoelectrónica y otra fuera.
        dominio: >-
          Reconocer una serie isoelectrónica y ordenarla por número de
          protones, sin intentar aplicarle las reglas de catión y anión.
    falta:
      - >-
        El escalón de los números cuánticos no tiene ejemplo propio: empieza
        en la colección, con los recuentos de partículas del propuesto 1. La
        hoja del tema 2 está entera en el sitio desde el 29 de septiembre de
        2026.
    revisado: '2026-09-29'

  - id: el-enlace-y-la-molecula
    apunte:
      texto: '2 de 3 — seis apartados de un solo dibujo'
      tono: nota
    titulo: De la estructura de Lewis a las fuerzas intermoleculares
    pide: >-
      «Dibujar la estructura de Lewis. Razonar la respuesta», «analizar la
      hibridación de los átomos y estudiar la geometría», «indicar los ángulos
      de enlace y estudia la polaridad», «indicar razonadamente qué fuerzas
      intermoleculares surgirán».
    porque: >-
      Cae en dos de las tres convocatorias, y en las dos con la misma cadena de
      seis apartados encadenados sobre una sola molécula. Eso tiene una
      consecuencia que conviene saber antes de estudiarlo: **si falla el Lewis,
      fallan los seis**. No es un ejercicio donde se puedan rascar puntos
      sueltos.
    invariante:
      anios: 2
      fuente: >-
        Las tres convocatorias del primer cuatrimestre. Que el cloruro de
        vinilo y el acetilcianuro sean el mismo ejercicio subido de nivel es
        lectura nuestra: el segundo tiene tres hibridaciones distintas en la
        misma molécula donde el primero tenía una.
    dominio: >-
      Recorrer la cadena entera sobre una molécula que no hayas visto, y saber
      en cada paso si te preguntan por la geometría electrónica o por la
      molecular.
    escalones:
      - id: ionico-o-covalente
        titulo: Iónico o covalente, y cuándo conduce
        aprendes: >-
          A decidir el tipo de enlace por la diferencia de electronegatividad
          y a decir cuándo conduce una sustancia iónica: fundida o disuelta,
          nunca sólida.
        teoria:
          tema: t03-enlace-quimico
          apartado: los-tres-enlaces-y-qué-decide-cuál
        ejercicios:
          - id: colfq3-ion21a-el-cloruro-de-sodio-y-cuando-conduce
          - id: colfq3-ion21b-el-cloruro-de-berilio-que-no-se-disuelve
          - id: colfq3-ion21c-cuatro-parejas-ionico-o-covalente
        dominio: >-
          Clasificar cuatro parejas de elementos por su enlace y justificar
          cada una con la diferencia de electronegatividad.

      - id: lewis
        titulo: Lewis en cuatro pasos
        aprendes: >-
          A dibujar una estructura de Lewis contando primero los electrones de
          valencia, y a saber cuántos enlaces tiene que haber antes de empezar.
        teoria:
          tema: t03-enlace-quimico
          apartado: lewis-en-cuatro-pasos
        ejercicios:
          - id: ejfq3-el-dioxido-de-carbono-entero
            incrustado: true
            nota: >-
              Tres átomos y la cadena entera, incluido el final que más
              importa: por qué el CO₂ es apolar teniendo los enlaces más
              polares.
          - id: exfq2425-modelo-2-el-acido-carbamico-de-lewis-a-la-polaridad
            nota: >-
              Del modelo de 2024-2025: la cadena entera sobre una molécula de
              siete átomos, de Lewis a la polaridad, con la resolución del
              profesor detrás.
        dominio: >-
          Contar los electrones que hay y los que caben, restar, y saber
          cuántos enlaces múltiples faltan antes de dibujar nada.

      - id: hibridacion-y-geometria
        titulo: El número estérico, y las dos geometrías
        aprendes: >-
          A sacar la hibridación contando direcciones, y a no confundir la
          geometría electrónica con la molecular.
        teoria:
          tema: t03-enlace-quimico
          apartado: geometría-electrónica-y-geometría-molecular-no-son-lo-mismo
          nota: >-
            La figura del apartado enseña metano, amoniaco y agua con la misma
            geometría electrónica y tres formas distintas.
        ejercicios:
          - id: ejfq3-el-amoniaco-y-las-dos-geometrias
            incrustado: true
          - id: exfq2425-1c-2-el-cloruro-de-vinilo-de-lewis-a-las-fuerzas
          - id: exfq2425-1c-control-4-el-acetilcianuro-y-tres-hibridaciones
            nota: >-
              Tres carbonos con tres hibridaciones distintas. Aquí no se puede
              contestar «la molécula es sp²»: hay que ir átomo por átomo.
        dominio: >-
          Dar la hibridación de cada átomo central de una molécula de tres
          carbonos, y decir la geometría molecular sin describir el andamio de
          pares.

      - id: polaridad-y-fuerzas
        titulo: Cuándo se cancelan los dipolos, y qué queda entre moléculas
        aprendes: >-
          A decidir si una molécula es polar sumando vectores sobre su
          geometría, y a nombrar sus fuerzas intermoleculares con el criterio
          correcto.
        teoria:
          tema: t03-enlace-quimico
          apartado: la-molécula-es-polar-cuando-los-dipolos-no-se-cancelan
        ejercicios:
          - id: ejfq3-cuatro-moleculas-y-sus-fuerzas
            incrustado: true
            nota: >-
              La rampa. Cuatro moléculas conocidas, para separar «enlace
              polar» de «molécula polar» y fijar el criterio del enlace de
              hidrógeno antes del cloruro de vinilo.
          - id: colfq3-inter28-la-hidracina-y-el-enlace-de-hidrogeno
          - id: colfq3-inter37-gasolina-eter-y-ceras
            nota: >-
              Tres sustancias que solo tienen dispersión: decide el tamaño, y
              hay que escribirlo.
          - id: exfq2425-1c-2-el-cloruro-de-vinilo-de-lewis-a-las-fuerzas
            nota: >-
              El apartado 2.4 pide las fuerzas, y lo que se puntúa es descartar
              el enlace de hidrógeno **diciendo por qué**.
        dominio: >-
          Descartar el enlace de hidrógeno con el criterio bueno —el H tiene
          que colgar de N, O o F— y no por si acaso.

      - id: el-enlace-ionico-y-su-ciclo
        titulo: La energía reticular, y el ciclo que la mide
        aprendes: >-
          A ordenar dos iónicos por energía reticular y a montar un ciclo de
          Born-Haber contando bien sus escalones.
        teoria:
          tema: t03-enlace-quimico
          apartado: la-energía-reticular-y-el-rodeo-que-hay-que-dar-para-medirla
          nota: >-
            La figura del apartado es el ciclo del NaCl con sus números, y el
            error típico que va debajo es copiarlo cuando el no metal no es un
            gas.
        ejercicios:
          - id: ejfq3-los-escalones-del-ciclo
            incrustado: true
            nota: >-
              La rampa. El mismo ciclo con el no metal ya gaseoso, que es el
              caso fácil: aquí no hay sublimación del cloro que discutir.
          - id: colfq3-ion19-el-ciclo-del-bromuro-de-calcio
            nota: >-
              El peldaño que faltaba: un catión 2+ y un halógeno líquido, con
              el ciclo dibujado.
          - id: colfq3-ion20-la-energia-reticular-del-fluoruro-de-litio
          - id: colfq3-ion22a-tres-parejas-y-su-energia-reticular
          - id: colfq3-ion22b-los-cloruros-alrededor-del-788
          - id: exfq2425-1c-control-2-el-born-haber-del-yoduro-de-bario
            nota: >-
              El yodo es **sólido**, así que el ciclo lleva un escalón de
              sublimación que el del NaCl no tiene. Es el único ejercicio del
              corpus que pide un Born-Haber.
        dominio: >-
          Escribir el ciclo de un compuesto cualquiera mirando primero el
          estado físico de cada elemento y la fórmula, que dice cuántas
          ionizaciones y cuántas afinidades hacen falta.
    falta:
      - >-
        Iónico o covalente, el primer escalón, no tiene ejemplo propio:
        empieza en las preguntas de las diapositivas. Y dos preguntas de
        las diapositivas del enlace iónico se quedan fuera a propósito: las
        que ordenan por temperatura de fusión con la energía reticular. Los
        puntos de fusión medidos no siguen esa regla (el MgCl₂ funde por
        debajo del NaCl), y contestarlas enseñaría un orden falso.
    revisado: '2026-09-29'

  - id: estados-y-tipos-de-solido
    apunte:
      texto: '2 de 3 — se razona; los números, fuera de la ventana'
      tono: nota
    titulo: Por qué una sustancia funde donde funde
    pide: >-
      «Identificar la temperatura correspondiente a cada compuesto. Justificar
      la respuesta», «escoger razonadamente un compuesto de la lista para cada
      una de las cuatro sustancias», «explicar el fundamento científico de la
      siguiente afirmación».
    porque: >-
      Cae en dos de las tres convocatorias, y en las dos **sin números**: son
      preguntas de razonar, de 0,50 a 2,00 puntos, y una respuesta vaga vale
      cero. Lo que cuenta es nombrar el mecanismo con su vocabulario. Pero el
      programa incluye gases, coligativas y Clausius-Clapeyron con números,
      y los dos exámenes con resolución del profesor que hay fuera de la
      ventana —la ordinaria de 2013 y el modelo de 2024-2025— los piden: una
      combustión en un recipiente cerrado, las presiones de un reactor con
      aire y una masa molar por presión osmótica. Por eso los tres escalones
      de cálculo van detrás de los de razonar.
    invariante:
      anios: 2
      fuente: >-
        Las tres convocatorias del primer cuatrimestre. Que las temperaturas de
        fusión de un control y los tipos de sólido del final sean el mismo
        ejercicio es lectura nuestra: los dos dan una lista de sustancias y
        piden clasificarlas por su tipo de sólido y ordenarlas por la fuerza
        que las une.
    dominio: >-
      Clasificar cualquier sustancia por su tipo de sólido preguntando por la
      conductividad en dos tiempos, y ordenar dentro de cada familia con el
      criterio que le toca — energía reticular en los iónicos, fuerza
      intermolecular en los moleculares.
    escalones:
      - id: los-cuatro-tipos
        titulo: Los cuatro tipos de sólido, y cómo se delatan
        aprendes: >-
          A identificar un sólido a partir de lo que hace, preguntando por la
          conductividad antes que por nada más.
        teoria:
          tema: t04-estados-y-propiedades
          apartado: cómo-se-identifica-un-sólido-por-lo-que-hace
          nota: >-
            La figura del apartado es el árbol de decisión, y el orden importa:
            «conduce en sólido» y «conduce fundido» son dos preguntas
            distintas.
        ejercicios:
          - id: ejfq4-el-que-conduce-solo-fundido
            incrustado: true
            nota: >-
              La rampa. Cuatro sustancias y una tabla de tres columnas, para
              fijar el orden de las preguntas antes de que el examen ponga
              ocho candidatos.
          - id: exfq2425-1c-5-cuatro-solidos-por-lo-que-hacen
            nota: >-
              Cuatro descripciones y ocho candidatos. El fallo que lo decide es
              decir «conduce» sin decir cuándo.
          - id: exfq2425-1c-control-3-cinco-temperaturas-de-fusion
            nota: >-
              Cinco temperaturas que colocar, con casi tres mil grados entre
              los iónicos y los moleculares.
        dominio: >-
          Colocar cinco sustancias en su tipo sin dudar, y ordenar dos iónicos
          entre sí razonando con el tamaño y la carga de los iones.

      - id: la-presion-de-vapor
        titulo: Por qué un líquido se seca, y por qué el agua salada tarda más
        aprendes: >-
          A explicar un fenómeno de evaporación con la presión de vapor y las
          propiedades coligativas, usando los términos que se puntúan.
        teoria:
          tema: t04-estados-y-propiedades
          apartado: un-soluto-disuelto-baja-la-presión-de-vapor
        ejercicios:
          - id: ejfq4-donde-hierve-el-agua
            incrustado: true
            nota: >-
              El Kilimanjaro y la olla rápida, que son el mismo razonamiento
              en los dos sentidos.
          - id: exfq2425-1c-4-el-banador-y-la-presion-de-vapor
            nota: >-
              Medio punto y media hoja. La respuesta necesita cuatro términos: disociación
              en iones, ion-dipolo, presión de vapor y propiedad coligativa.
        dominio: >-
          Explicar lo del bañador con los cuatro términos, no con una frase de
          sentido común; y decir si una temperatura de ebullición sube o baja
          al cambiar la presión, razonándolo.

      - id: los-gases-con-numeros
        titulo: Los gases con números, y los que reaccionan dentro del recipiente
        aprendes: >-
          A usar la ecuación de los gases y las presiones parciales de Dalton,
          y a seguir una reacción en un recipiente cerrado contando moles
          antes y después.
        teoria:
          tema: t04-estados-y-propiedades
          apartado: los-gases-con-números
        ejercicios:
          - id: colfq4-gas31-el-propano-del-gas-natural
            nota: >-
              La entrada: una fracción molar y una presión parcial, sin nada
              más alrededor.
          - id: colfq4-gas16-el-cloro-que-se-comprime
          - id: colfq4-gas18-el-monoxido-que-encoge-al-enfriarse
          - id: colfq4-gas20-los-volumenes-del-amoniaco-que-arde
          - id: colfq4-gas27-la-masa-molar-de-un-gas-desconocido
          - id: colfq4-gas30-el-co2-que-sale-de-la-glucosa
          - id: colfq4-p3-las-dos-camaras-de-so2-y-oxigeno
            nota: >-
              Dos cámaras que se abren y una reacción: el molde de todos los
              que siguen.
          - id: colfq4-p4-la-mezcla-que-quema-su-monoxido
          - id: colfq4-p5-amoniaco-y-oxido-cuprico
          - id: colfq4-p6-el-amoniaco-de-dos-gases-medidos-distinto
          - id: colfq4-p7-el-matraz-que-se-calienta-y-reacciona
          - id: colfq4-p8-el-recipiente-que-se-vacia-a-medias
          - id: exfq1213-ord-3-la-mezcla-de-gases-con-etano
            nota: >-
              La ordinaria de 2013: aire, etano y nitrógeno medidos en tres
              condiciones, y una combustión dentro.
          - id: exfq2425-modelo-5-el-reactor-cerrado-con-aire
            nota: >-
              Del modelo de 2024-2025: las presiones parciales de un reactor
              con aire, contrastadas con la resolución del profesor.
        dominio: >-
          Montar la tabla de moles antes y después de la reacción, y sacar de
          ella cada presión parcial sin recalcular la total.

      - id: la-presion-de-vapor-con-la-temperatura
        titulo: La presión de vapor con la temperatura, por Clausius-Clapeyron
        aprendes: >-
          A sacar una entalpía de vaporización de dos presiones, o de una
          recta, y a llevar una presión de vapor a otra temperatura.
        teoria:
          tema: t04-estados-y-propiedades
          apartado: la-presión-de-vapor-con-la-temperatura-clausius-clapeyron
        ejercicios:
          - id: colfq4-liq8-el-eter-de-18-a-32-grados
          - id: colfq4-liq9-el-benceno-de-7-a-60-grados
          - id: colfq4-liq10-la-presion-que-se-duplica-en-diez-grados
          - id: colfq4-liq7-la-entalpia-del-mercurio-por-la-recta
            nota: >-
              La versión con muchos datos: la entalpía sale de la pendiente
              de la recta, que hay que dibujar.
        dominio: >-
          Escribir Clausius-Clapeyron con las temperaturas en kelvin y el
          signo que toca, sin mirar.

      - id: las-coligativas-con-numeros
        titulo: Las propiedades coligativas con números
        aprendes: >-
          A calcular el descenso de la presión de vapor, el ascenso
          ebulloscópico, el descenso crioscópico y la presión osmótica, y a
          sacar de cualquiera de ellos una masa molar.
        teoria:
          tema: t04-estados-y-propiedades
          apartado: las-propiedades-coligativas-con-números
        ejercicios:
          - id: colfq4-resuelto-el-propilenglicol-anticongelante
            nota: >-
              El resuelto del curso: las cuatro concentraciones y las dos
              temperaturas de una misma mezcla.
          - id: colfq4-p22-la-sacarosa-y-la-presion-de-vapor
          - id: colfq4-p23-la-presion-osmotica-de-un-carbohidrato
          - id: colfq4-p24-el-naftaleno-en-benceno
          - id: exfq2425-modelo-4-el-hipnotico-por-su-presion-osmotica
            nota: >-
              Del modelo de 2024-2025: una masa molar por presión osmótica, y
              la resolución del profesor calcula con otro dato del enunciado.
        dominio: >-
          Elegir la concentración que pide cada propiedad —fracción molar,
          molalidad o molaridad— sin dudar, y contar cada partícula cuando el
          soluto se disocia.
    falta:
      - >-
        Las tres convocatorias de la ventana no piden ni un número en este
        tema, así que los escalones de cálculo no cuentan en la medida: los
        piden la ordinaria de 2013 y el modelo de 2024-2025. El de Clausius-
        Clapeyron no tiene ejercicio de examen, y ninguno de los tres tiene
        un ejemplo propio: empiezan en la colección.
    revisado: '2026-09-29'

  # ═══════════════════════════════════════════════════════════════════
  # SIMULACRO Y FORMULARIO
  # ═══════════════════════════════════════════════════════════════════
  - id: simulacro
    apunte:
      texto: 'las tres convocatorias, con reloj'
      tono: marco
    titulo: Los tres exámenes enteros, cronometrados
    pide: >-
      Todo lo anterior a la vez, con el reloj que imprime cada cuadernillo:
      «1.45 h» en dos de ellos y «1.5 h» en el control de 2024-2025.
    porque: >-
      El primer cuatrimestre no encadena bloques dentro de un ejercicio, pero
      sí encadena apartados: el de estequiometría tiene hasta ocho, y el del
      enlace seis. Eso solo se entrena haciendo el examen entero con reloj. Las
      tres convocatorias están transcritas completas, sin un solo ejercicio
      declarado fuera.
    dominio: >-
      Terminar una convocatoria completa dentro del tiempo, y que el ejercicio
      de estequiometría no se te coma más de la mitad del reloj.
    material:
      - tipo: examen
        curso: '2023-2024'
        convocatoria: control-primer-cuatrimestre
        nota: >-
          Tres de sus cuatro ejercicios son estequiometría —3,00 · 1,25 · 2,00
          · 3,75—. Si vas justo de tiempo, es el que más rinde hacer entero.
      - tipo: examen
        curso: '2024-2025'
        convocatoria: control-primer-cuatrimestre
        nota: >-
          El más repartido: cubre los cuatro temas él solo y trae el único
          Born-Haber del corpus.
      - tipo: examen
        curso: '2024-2025'
        convocatoria: primer-cuatrimestre
        nota: >-
          El final, y el más difícil de los tres. Su ejercicio 1 vale 3,50 y
          cruza nombrar, ajustar, rendimientos y disoluciones en una sola
          cadena.
      - tipo: examen
        curso: '2024-2025'
        convocatoria: modelo
        nota: >-
          El modelo que reparte la asignatura, con tres de sus cinco
          ejercicios: no es una convocatoria y no cuenta en la medida, pero
          es el único con la resolución del profesor detrás.
    falta:
      - >-
        El sitio no te corrige el examen entero: el simulacro se corrige
        abriendo cada resolución. El reloj sí lo pone la página de cada examen,
        con la duración que imprime su cuadernillo: **«1.45 h» el final de
        2024-2025 y el control de 2023-2024, y «1.5 h» el control de
        2024-2025**.

        Y una lectura que conviene no equivocar: **«1.45 h» es una hora y
        cuarenta y cinco minutos, no 1,45 horas.** Lo confirma el segundo
        cuatrimestre, que imprime «1.30 h» en sus tres exámenes — con decimales
        serían 1 h 18 min, que no es un tiempo que nadie ponga. Leerlo como
        decimal te haría planificar dieciocho minutos de menos. El «1.5 h» del
        control de 2024-2025 no encaja en esa notación —serían 1 h 5 min— y se
        lee como hora y media.
      - >-
        Y son **tres convocatorias**, que para simular es poco: el primer
        cuatrimestre solo se examina desde 2023-2024 en el material que
        tenemos. El modelo de 2024-2025 suma una cuarta práctica, pero le
        faltan dos de sus cinco ejercicios. Cuando aparezca otra
        convocatoria, entra aquí.
    revisado: '2026-09-06'

  - id: formulario
    apunte:
      texto: 'lo que hay que llevar en la cabeza'
      tono: marco
    titulo: Lo que no se puede consultar
    pide: >-
      Nada, directamente. Es lo que los enunciados dan por sabido.
    porque: >-
      En el examen no hay formulario —la guía prohíbe «libros, notas o
      apuntes» salvo indicación, y ningún enunciado da uno—, y las tres convocatorias
      dan por sabidas las mismas cinco cosas sin escribirlas. Va el último
      porque es repaso: se llega aquí con los bloques hechos.
    dominio: >-
      Escribir de memoria las cinco de abajo y decir en qué bloque se usa cada
      una, sin mirar.
    material:
      - tipo: teoria
        tema: t01-compuestos-y-estequiometria
        apartado: todo-el-tema-es-un-puente-y-el-puente-es-el-mol
        nota: >-
          Las cuatro puertas del mol: dividir entre la masa molar, PV = nRT,
          multiplicar por la molaridad y dividir entre el número de Avogadro.
      - tipo: teoria
        tema: t01-compuestos-y-estequiometria
        apartado: disoluciones-cuatro-formas-de-decir-cuánto-hay
        nota: >-
          Molaridad, molalidad, porcentaje en masa y densidad, y qué se
          conserva al diluir.
      - tipo: teoria
        tema: t02-estructura-atomica
        apartado: la-carga-nuclear-efectiva-por-las-reglas-de-slater
        nota: >-
          Las dos tablas de Slater con sus pesos —0,35 · 0,85 · 1,00— y la
          regla aparte para los electrones d.
      - tipo: teoria
        tema: t03-enlace-quimico
        apartado: el-número-estérico-decide-la-hibridación
        nota: >-
          Átomos unidos más pares solitarios, con el enlace múltiple contando
          por uno, y la tabla de geometrías que sale de ahí.
      - tipo: teoria
        tema: t04-estados-y-propiedades
        apartado: los-cuatro-tipos-de-sólido-cristalino
        nota: >-
          Los cuatro tipos con su partícula y su fuerza de cohesión.
    falta:
      - >-
        Este bloque duplica a propósito cosas que ya están en la prosa de los
        temas, y es una excepción declarada: un formulario que remite a cinco
        páginas distintas no sirve la noche antes. No inventa ninguna fórmula
        nueva; todas están enlazadas a su apartado.
      - >-
        Si se admite calculadora no lo dice ningún documento de la asignatura:
        la guía solo trae la norma general de la UPV/EHU, que prohíbe «aparatos
        o dispositivos… electrónicos» salvo que se indique lo contrario, y
        ningún cuadernillo lo indica. Es una pregunta para quien haya hecho el
        examen.

  # FUERA DEL ESCRITO
  - id: practicas-de-laboratorio
    apunte:
      texto: '20 % de la nota, con un 5,0 propio'
      tono: nota
    titulo: Las prácticas de laboratorio, que esta ruta no prepara
    pide: >-
      Hacer las siete sesiones, entregar los informes o cuestionarios y
      aprobar un examen escrito de prácticas.
    porque: >-
      Valen el **20 %** de la nota y tienen umbral propio: sin un 5,0 en
      prácticas no se aprueba la asignatura, por bien que vaya el escrito. Esa
      nota sale en un 60 % de los informes o cuestionarios y en un 40 % del
      examen, y **las dos partes piden al menos un 3,5**. Son siete sesiones
      de dos horas. Fuente: guía docente 2025-26, págs. 2 y 3.
    dominio: >-
      Saber antes de la primera sesión qué te juegas —el 20 % y tres notas
      mínimas— y hacer sin mirar las cuentas que el sitio sí explica y que
      las prácticas nombran en su título.
    material:
      - tipo: teoria
        tema: t01-compuestos-y-estequiometria
        apartado: disoluciones-cuatro-formas-de-decir-cuánto-hay
        nota: >-
          Molaridad, riqueza y densidad: por su título, lo que usan las
          prácticas de estequiometría y de densidad y concentración.
      - tipo: ejercicio
        id: ejfq1-del-frasco-al-matraz
    falta:
      - >-
        Las prácticas en sí no las prepara el sitio, y a propósito: se
        preparan en clase, con los guiones del aula virtual. Esos guiones
        tampoco están en el material —de las seis prácticas que nombra el
        aula, de seguridad y tratamiento de datos a valoración ácido-base,
        solo está la página que enlaza a su PDF—, así que aquí queda lo que te
        juegas y las cuentas que el sitio sí explica.
