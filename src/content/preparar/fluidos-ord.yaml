asignatura: fluidos
evaluacion: ordinaria
# La extraordinaria **no** tiene ruta propia, y eso es una decisión medida, no
# una tarea pendiente. Leídas las once convocatorias finales de 2020 a 2026
# —siete ordinarias y cuatro extraordinarias—, los bloques son los mismos y
# caen con la misma frecuencia: análisis dimensional en las 7 ordinarias y en
# las 4 extraordinarias, bombeo en 6 y 4, canales en 6 y 4, propiedades en 4 y
# 4. Las diferencias que quedan —hidrostática 5/7 frente a 2/4, cuerpos
# sumergidos 2/7 frente a 3/4— caben dentro del ruido de cuatro exámenes, y
# publicar un orden distinto apoyándose en ellas sería inventarse una
# diferencia (§10).
#
# Álgebra sí tiene dos rutas, y por el motivo contrario: allí la
# extraordinaria **cambia un hueco entero** —determinantes donde la ordinaria
# pone euclídeos— en las cuatro convocatorias leídas. Aquí no cambia ninguno.
tambienPrepara:
  - extraordinaria
titulo: Preparar la convocatoria de Mecánica de Fluidos
lede: >-
  El examen de Fluidos no elige: recorre la asignatura de un extremo al otro,
  ocho o nueve ejercicios de temas casi siempre distintos. Leídas las once
  convocatorias finales de 2020 a 2026, dos bloques han caído los once años
  —análisis dimensional y bombeo— y ninguno de los siete siguientes ha faltado
  más de cuatro veces. Aquí no hay nada que descartar. Hay un orden, y este es
  el que rinde.
temas:
  - t01-introduccion
  - t02-propiedades
  - t03-estatica
  - t04-hidrostatica
  - t07-fuerzas-superficies
  - t08-fuerzas-cuerpos
  - t09-fundamentos-movimiento
  - t10-continuidad
  - t11-dinamica
  - t12-bernoulli
  - t13-medidores
  - t14-cantidad-movimiento
  - t15-aplicaciones-tcm
  - t16-analisis-dimensional
  - t17-viscosidad
  - t18-perdidas-carga
  - t19-conducciones
  - t20-golpe-ariete
  - t21-canales
  - t22-maquinas
  - t23-turbinas
  - t24-bombas
  - t25-bombeo
medidoSobre: 16
criterioDeOrden: >-
  Por rendimiento medido sobre las once convocatorias finales, no por el
  temario. Delante va el suelo —el kilopondio, las seis formas de escribir una
  presión y las pérdidas de carga—, que no ocupa hueco propio en el examen y
  sin el cual no se termina ninguno de los demás. Detrás, los once huecos
  ordenados por en cuántos de los once años han caído. Al final, el simulacro
  y el formulario. El golpe de ariete va el penúltimo a propósito y con su
  número delante: en los finales ha caído una sola vez de once, pero en los
  parciales cae en dos de cinco, así que quien prepara un parcial lo tiene que
  adelantar.

bloques:
  # ═══════════════════════════════════════════════════════════════════
  # SUELO
  # ═══════════════════════════════════════════════════════════════════
  - id: suelo-unidades-presiones-y-perdidas
    apunte:
      texto: 'no da puntos — los sostiene todos'
      tono: marco
    titulo: Unidades, presiones y pérdidas de carga
    pide: >-
      No lo pide con estas palabras. Lo pide dentro de otros ejercicios, con
      «la lectura del vacuómetro es de 0,4 kg/cm²», «tomar la rugosidad del
      cuadro n.º 20» y «la presión manométrica final, la densidad final y el
      coeficiente de compresibilidad».
    porque: >-
      Ninguno de estos tres asuntos tiene un ejercicio propio en las once
      convocatorias finales —cero de once para las unidades, uno de once para
      las pérdidas de carga— y aun así están dentro de casi todos. Bombeo cae
      en 11 de 11 y no se resuelve sin Darcy; canales cae en 10 de 11 y no se
      resuelve sin el cuadro n.º 26; conducciones cae en 7 de 11 y son
      pérdidas de la primera línea a la última. Eso es exactamente lo que
      define un suelo, y por eso va delante aunque no puntúe.
    invariante:
      anios: 11
      fuente: >-
        Las once convocatorias finales de 2020 a 2026, contadas una a una
        sobre el reparto por tema de cada examen. Que un enunciado que
        dice «kg/cm²» esté pidiendo un kilopondio y no un kilogramo es lectura
        nuestra, y viene de que las soluciones oficiales solo salen así.
    dominio: >-
      Pasar de kg/cm² a mca, a bar y a pascales sin mirar nada; recorrer un
      manómetro de varios ramales sin perder un signo; y sacar el factor de
      fricción del ábaco de Moody y de las cinco fórmulas sabiendo cuál toca
      en cada régimen.
    escalones:
      - id: el-kilopondio
        titulo: El kilogramo que no es una masa
        aprendes: >-
          A distinguir el kilogramo masa del kilopondio, y a no perder el
          factor `g` cuando el enunciado dice «pesa 50 kg».
        teoria:
          tema: t01-introduccion
          apartado: el-kilogramo-que-no-es-una-masa
          nota: >-
            El apartado explica por qué la escuela sigue usando la unidad
            técnica, y de dónde sale el 9,8 que aparece en todas las
            conversiones del cuadro.
        ejercicios:
          - id: ejflu1-masa-peso-y-el-kilogramo-de-dos-caras
            incrustado: true
            nota: >-
              El ejemplo de entrada. Un solo cuerpo, dos planetas y tres
              números, para separar masa de peso antes de tocar nada más.
          - id: ejflu1-col11-el-cuerpo-en-otro-planeta
          - id: ejflu1-col19-armstrong-en-la-luna
          - id: ejflu1-col110-tres-preguntas-sobre-la-misma-densidad
            nota: >-
              Dinas y decanewtons. Es el que más se parece a lo que hace un
              enunciado de examen cuando cambia de sistema sin avisar.
        dominio: >-
          Decir cuánto pesa en newtons un cuerpo de 50 kg en la Luna y cuánta
          masa tiene, sin dudar cuál de los dos números cambia.

      - id: las-seis-unidades-de-presion
        titulo: Las seis formas de escribir la misma presión
        aprendes: >-
          A convertir entre pascales, mca, mm de mercurio, bar, kg/cm² y
          atmósferas, y a saber cuándo un dato es absoluto y cuándo relativo.
        teoria:
          tema: t04-hidrostatica
          apartado: las-unidades-que-son-medio-examen
          nota: >-
            El título del apartado no es una figura retórica. Contadas sobre
            los enunciados de las dieciséis convocatorias: el bar aparece en
            catorce, los metros de columna de agua en trece, el pascal en once
            y el kg/cm² en diez.
        ejercicios:
          - id: ejflu4-col23-seis-unidades-de-presion
            incrustado: true
            nota: >-
              Un depósito con tres manómetros y la misma presión escrita seis
              veces. Es el ejercicio de referencia de todo el bloque.
          - id: ejflu4-col27-la-columna-de-keroseno
            nota: >-
              El paso que más se falla, porque una columna de líquido depende
              del líquido y la costumbre es pensarla en agua.
          - id: ejflu4-col218-el-barometro-defectuoso
        dominio: >-
          Escribir 0,4 kg/cm² en las otras cinco unidades de memoria, y decir
          sin pensarlo si el número que te acaban de dar es absoluto o
          manométrico.

      - id: darcy-moody-y-los-cuadros
        titulo: Darcy, Moody y los cuadros de la escuela
        aprendes: >-
          A calcular una pérdida de carga por Darcy-Weisbach, a entrar al
          ábaco de Moody por los dos lados y a decidir en qué régimen está el
          flujo antes de elegir fórmula.
        teoria:
          tema: t18-perdidas-carga
          apartado: el-ábaco-de-moody
          nota: >-
            Y el apartado «Liso, semirrugoso y rugoso», dos más arriba, que
            es el que evita el error de creer que el régimen lo decide el tubo.
        ejercicios:
          - id: ejflu18-cuando-la-tuberia-deja-de-ser-lisa
            incrustado: true
            nota: >-
              El ejemplo de entrada. Las dos fronteras del ábaco y por qué
              casi todos los problemas caen en la zona de en medio.
          - id: ejflu18-la-glicerina-y-la-potencia-perdida
          - id: ejflu18-el-petroleo-y-la-entrada-de-arriba-del-abaco
            nota: >-
              Cuando no se conoce la velocidad no se puede entrar por
              Reynolds. Este enseña la otra puerta del ábaco.
          - id: ejflu18-col66-la-tuberia-incrustada
            nota: >-
              Los tres tipos de problema en el mismo enunciado, que es como
              caen en el examen.
          - id: ejflu18-col615-el-fueloil-entre-a-y-b
          - id: ejflu18-col610-las-estaciones-de-bombeo-del-aceite
          - id: ejflu18-col613-el-big-inch
            nota: >-
              El Big Inch, y qué le pasa a un oleoducto cuando la bomba
              envejece. Es el más largo de los tres y el que más se parece a
              un apartado de examen.
          - id: exflu2021-3par-4-la-tuberia-que-se-ha-corroido
            nota: >-
              El mejor del cuadernillo para el ábaco. La misma tubería recorre
              turbulencia completa, transición y régimen liso en tres
              apartados.
          - id: exflu2526-ord-8-el-alcohol-entre-a-y-b
        dominio: >-
          Dado un tramo con su caudal, su material y su diámetro, dar la
          pérdida sin preguntar nada más — sabiendo de qué cuadro sale la
          rugosidad y por qué el régimen elige la fórmula.

      - id: clasificar-el-flujo
        titulo: Continuidad, y de qué se habla cuando se dice «permanente»
        aprendes: >-
          A clasificar un flujo con los cuatro criterios y a aplicar
          continuidad, que es la ecuación que se usa sin nombrarla en todos
          los bloques de abajo.
        teoria:
          tema: t09-fundamentos-movimiento
          apartado: los-cuatro-criterios-para-clasificar-un-flujo
          nota: >-
            «Permanente» y «uniforme» no son sinónimos, y el examen aprovecha
            la confusión más de una vez.
        ejercicios:
          - id: ejflu9-permanente-o-uniforme
            incrustado: true
            nota: >-
              Permanente, uniforme, o las dos cosas. Cuatro casos y ninguna
              cuenta.
          - id: ejflu9-la-continuidad-en-un-estrechamiento
          - id: ejflu10-el-gas-que-acelera-sin-estrecharse
            nota: >-
              Un gas acelera sin que la tubería cambie de sección, y eso
              obliga a escribir continuidad en masa y no en volumen.
          - id: ejflu11-cuanto-pesa-el-termino-viscoso
            nota: >-
              Cuánto pesa el término que separa a Euler de Navier-Stokes. Es
              la justificación de que en el resto de la asignatura se ignore.
        dominio: >-
          Decir de un flujo si es permanente, uniforme, las dos cosas o
          ninguna, y escribir continuidad en masa cuando la densidad cambia.
    falta:
      - >-
        Los cuadros de la escuela —rugosidades, Manning, Hazen-Williams— se
        citan desde la prosa de cada tema, pero no hay una página que los
        reúna. Es lo primero que uno querría tener abierto al lado.

  # ═══════════════════════════════════════════════════════════════════
  # LOS HUECOS, POR RENDIMIENTO
  # ═══════════════════════════════════════════════════════════════════
  - id: analisis-dimensional
    apunte:
      texto: 'cae los 11 años — nunca ha faltado'
      tono: nota
    titulo: Análisis dimensional y semejanza
    pide: >-
      «Obtener los parámetros adimensionales del sistema» y «¿se puede
      lograr una semejanza dinámica absoluta? Razonar la respuesta». Con esas
      palabras, y luego el paso del modelo al prototipo.
    porque: >-
      Uno de los dos bloques que han caído en las once convocatorias finales
      sin una sola excepción —el otro es bombeo—, y además en dos de los cinco
      parciales: trece ejercicios. De los dos va este primero, y no por
      frecuencia sino por dependencia: se puede resolver el día uno, sin saber
      nada de pérdidas ni de bombas, mientras que bombeo no se empieza sin el
      suelo entero.
    invariante:
      anios: 11
      fuente: >-
        Las once finales. Y una lectura nuestra encima: que siete de los trece
        enunciados pidan decidir «¿es posible la semejanza absoluta?» los
        convierte en el mismo ejercicio con distinto decorado, y por eso ese
        escalón va aparte.
    dominio: >-
      Montar la tabla de exponentes de Buckingham con seis variables sin
      equivocarte de repetidas, y contestar en dos líneas por qué Reynolds y
      Froude no se pueden cumplir a la vez en la Tierra.
    escalones:
      - id: el-teorema-pi
        titulo: El teorema de Vaschy-Buckingham, paso a paso
        aprendes: >-
          A contar variables y magnitudes fundamentales, elegir las repetidas
          y montar la tabla de exponentes hasta despejar cada grupo.
        teoria:
          tema: t16-analisis-dimensional
          apartado: el-teorema-de-vaschy-buckingham
        ejercicios:
          - id: ejflu16-los-dos-primeros-parametros-pi
            incrustado: true
            nota: >-
              El ejemplo de entrada. Cinco variables, dos parámetros, y uno de
              ellos resulta ser Reynolds sin haberlo buscado.
          - id: exflu2122-ord-8-buckingham-con-seis-variables
            nota: >-
              Seis variables y la tabla de potencias entera. Es el enunciado
              que pide el procedimiento completo, sin atajos.
          - id: exflu2425-ext-4-el-vertedero-en-v-por-analisis-dimensional
            nota: >-
              La ley del vertedero triangular deducida sin resolver ninguna
              integral. Enseña para qué sirve de verdad el teorema.
          - id: exflu2223-ext-5-el-morro-del-avion-en-el-tunel
        dominio: >-
          Dadas seis variables, escribir los tres grupos adimensionales en
          menos de diez minutos y comprobar uno de ellos por dimensiones.

      - id: los-cinco-numeros
        titulo: Los cinco números, y cuál manda en cada caso
        aprendes: >-
          A reconocer Reynolds, Froude, Mach, Weber y Euler en un grupo que
          acabas de despejar, y a decir cuál gobierna el fenómeno.
        teoria:
          tema: t16-analisis-dimensional
          apartado: los-cinco-números-y-qué-manda-en-cada-caso
        ejercicios:
          - id: ejflu16-col520-el-pilar-del-puente
            nota: >-
              Hay superficie libre, así que manda Froude. Es el caso que más
              se confunde con el de una tubería.
          - id: ejflu16-col517-el-agua-y-el-keroseno
          - id: exflu2122-ext-5-reynolds-y-froude-en-la-tierra
        dominio: >-
          Ver un ensayo descrito en tres líneas y decir qué número hay que
          igualar, con el motivo físico, antes de escribir ninguna cuenta.

      - id: la-semejanza-que-no-puede-ser
        titulo: La pregunta que cae siempre — ¿es posible la semejanza absoluta?
        aprendes: >-
          A demostrar que dos números no se pueden igualar a la vez, y a
          escribir la condición que tendría que cumplir el fluido del modelo
          para que sí se pudiera.
        teoria:
          tema: t16-analisis-dimensional
          apartado: la-pregunta-que-cae-siempre-es-posible-la-semejanza-absoluta
          nota: >-
            El apartado lleva la deducción general, que es la que permite
            contestar sin rehacer el álgebra en cada examen.
        ejercicios:
          - id: ejflu16-el-canal-y-el-liquido-que-no-existe
            incrustado: true
            nota: >-
              El líquido que haría falta para la homología, y por qué no
              existe. La respuesta es el número, no la excusa.
          - id: ejflu16-col511-el-submarino-a-escala
          - id: exflu2223-ord-6-mach-y-reynolds-a-la-vez
          - id: exflu2526-ord-7-el-submarino-que-no-se-puede-ensayar
          - id: exflu2324-ord-7-el-canal-de-donostia-a-barcelona
          - id: exflu2021-ord-6-el-tunel-de-viento-presurizado
            nota: >-
              Aquí la semejanza sí se puede comprar — presurizando el túnel—,
              y el examen pregunta cuánto cuesta.
        dominio: >-
          Contestar la pregunta en dos líneas y con la condición escrita, no
          con un «no es posible» a secas, que es lo que puntúa cero.

      - id: las-escalas
        titulo: Las escalas, que son lo que se calcula
        aprendes: >-
          A pasar velocidad, caudal, fuerza, potencia y tiempo del modelo al
          prototipo con la escala geométrica y el número que se conserva.
        teoria:
          tema: t16-analisis-dimensional
          apartado: las-escalas-que-son-lo-que-se-calcula
        ejercicios:
          - id: ejflu16-la-presa-a-escala-1-49
          - id: ejflu16-la-bomba-que-gira-cien-veces-mas-despacio
          - id: exflu2425-ord-5-la-maniobra-de-la-compuerta-a-escala
          - id: exflu2324-ext-5-la-bomba-en-otro-planeta
            nota: >-
              La gravedad deja de ser un dato y pasa a ser incógnita. Es la
              vuelta de tuerca que más veces ha caído.
          - id: exflu1920-2par-2-el-modulo-de-aterrizaje-en-marte
          - id: exflu1920-ord-5-las-dos-turbobombas-semejantes
          - id: exflu2021-2par-4-el-aerosol-y-la-valvula-con-mercurio
        dominio: >-
          Dado un ensayo a escala 1:12 con Froude, dar la escala de tiempos y
          la de fuerzas sin buscarlas, y justificar el exponente.
    falta: []

  - id: instalaciones-de-bombeo
    apunte:
      texto: 'cae los 11 años — 16 ejercicios'
      tono: nota
    titulo: Instalaciones de bombeo
    pide: >-
      «Deducir la expresión analítica de la curva característica de la
      instalación», con esas palabras, en seis de los doce enunciados. Y
      detrás, «punto de funcionamiento de la instalación de bombeo», «cota
      máxima a la que debe instalarse la turbobomba» y la pérdida que hay que
      generar en la válvula.
    porque: >-
      Cae en las once convocatorias finales y en dos de los cinco parciales
      —dieciséis ejercicios, el bloque más numeroso del corpus— y además es
      casi siempre el más largo del examen. Va el segundo y no el primero
      porque necesita el suelo entero: sin Darcy y sin los cuadros no se
      escribe ni la primera línea de la curva de la instalación.
    invariante:
      anios: 11
      fuente: >-
        Las once finales, contando como un solo hueco los temas 22 a 25. La
        agrupación es lectura nuestra: el examen nunca dice «tema 25», pero
        los doce enunciados piden la misma secuencia de cuatro pasos.
    dominio: >-
      Escribir la curva de la instalación de una red que no has visto antes,
      cortarla con la de la bomba, decidir si cavita y ajustar la válvula para
      mover el punto adonde te pidan.
    escalones:
      - id: la-cadena-de-rendimientos
        titulo: Del enchufe al agua, escalón por escalón
        aprendes: >-
          A recorrer la cadena de rendimientos en los dos sentidos y a no
          confundir potencia útil, potencia en el eje y potencia absorbida.
        teoria:
          tema: t22-maquinas
          apartado: la-cadena-de-rendimientos
        ejercicios:
          - id: ejflu22-la-cadena-de-rendimientos
            incrustado: true
            nota: >-
              El ejemplo de entrada. Del enchufe al agua, un escalón cada vez,
              sin ninguna instalación alrededor que distraiga.
          - id: exflu2021-3par-1-las-maquinas-hidraulicas-de-corrido
            nota: >-
              Un test donde fallar cuesta lo mismo que acertar. Sirve para
              medir si el vocabulario está o no está.
          - id: exflu2425-ord-6-la-central-de-tres-turbinas
        dominio: >-
          Dar la potencia absorbida de una bomba a partir del caudal, la
          altura y los tres rendimientos, y decir cuál de ellos falta si el
          enunciado solo da dos.

      - id: la-curva-y-el-punto
        titulo: La curva de la instalación y el punto de funcionamiento
        aprendes: >-
          A escribir la curva de la instalación como altura geométrica más un
          término en Q al cuadrado, y a cortarla con la curva de la bomba.
        teoria:
          tema: t25-bombeo
          apartado: la-curva-característica-de-la-instalación
          nota: >-
            Y el apartado siguiente, «El punto de funcionamiento», que es
            donde se hace el corte.
        ejercicios:
          - id: ejflu25-el-punto-de-funcionamiento
            incrustado: true
            nota: >-
              El ejemplo de entrada. Dónde acaba trabajando la bomba, y lo que
              cuesta de verdad cerrar una válvula.
          - id: ejflu25-col95-la-instalacion-completa
          - id: exflu2324-ord-6-la-bomba-deducida-de-dos-puntos
            nota: >-
              Aquí la curva de la bomba no la dan: hay que deducirla de dos
              puntos de funcionamiento. Cae más de lo que parece.
          - id: exflu2122-ord-11-la-boquilla-y-la-valvula-que-se-cierra
          - id: exflu1920-1par-3-la-boquilla-alimentada-por-dos-depositos
        dominio: >-
          Escribir la curva de una instalación con dos tramos y una boquilla
          en menos de cinco minutos, y localizar el punto de funcionamiento
          con la curva de la bomba dada por tres puntos.

      - id: mover-el-punto
        titulo: Cómo se mueve el punto de funcionamiento
        aprendes: >-
          A predecir adónde se va el punto si cierras una válvula, presurizas
          un depósito, subes el nivel o pones dos bombas en paralelo.
        teoria:
          tema: t25-bombeo
          apartado: cómo-se-mueve-el-punto-de-funcionamiento
        ejercicios:
          - id: ejflu25-col910-la-bomba-que-empuja-cuesta-abajo
            nota: >-
              El caso que rompe la intuición: el agua baja y aun así hace
              falta bomba.
          - id: ejflu25-col912-la-caldera-y-el-agua-a-setenta-y-cinco
          - id: exflu2425-ext-2-la-bomba-y-la-valvula-que-hay-que-cerrar
          - id: exflu2425-ext-5-el-bombeo-de-petroleo-en-el-desierto
            nota: >-
              Dos bombas en paralelo, y unos metros de columna que no son de
              agua. Las dos trampas del bloque en el mismo enunciado.
          - id: exflu2223-ord-9-el-circuito-cerrado-de-filtrado
            nota: >-
              En un circuito cerrado presurizar el depósito no sirve de nada,
              y el examen pregunta precisamente eso.
          - id: exflu2021-ord-8-la-boquilla-con-bomba-y-sin-ella
          - id: exflu1920-ord-7-la-red-de-cuatro-barrios
        dominio: >-
          Decir, sin calcular, en qué dirección se mueve el punto ante cada
          una de las cuatro maniobras — y luego calcularlo.

      - id: cavitacion-y-npsh
        titulo: Cavitación y NPSH
        aprendes: >-
          A calcular el NPSH disponible de una aspiración y a compararlo con
          el requerido para decidir la cota máxima de la bomba.
        teoria:
          tema: t25-bombeo
          apartado: cavitación-y-npsh
        ejercicios:
          - id: ejflu25-el-npsh-y-la-cota-de-la-bomba
            incrustado: true
            nota: >-
              El ejemplo de entrada. Hasta qué altura se puede subir la bomba
              antes de que empiece a cavitar.
          - id: ejflu25-col914-la-bomba-que-cavita
          - id: exflu2122-ext-8-la-cota-maxima-de-la-aspiracion
          - id: exflu2324-ext-6-la-bomba-que-cavita-y-la-que-no
            nota: >-
              La bomba de mejor rendimiento es la que hay que descartar. El
              enunciado está montado para castigar el atajo.
          - id: exflu2526-ord-2-elegir-la-bomba-entre-tres
          - id: exflu2223-ext-8-elegir-la-bomba-entre-tres-modelos
        dominio: >-
          Dada una aspiración con su longitud, su material y la temperatura
          del agua, decir la cota máxima de la bomba y de dónde sale cada
          término del NPSH disponible.
    falta:
      - >-
        El anexo de curvas de bomba de la colección no se puede reproducir
        aquí: son cartas de catálogo de un fabricante. Los ejercicios que
        dependen de él —el capítulo 9 entero— sí están escritos, y cada uno
        dice en su enunciado qué modelo y qué rodete se leen de esa carta,
        con el punto de funcionamiento que sale. Es la única parte del
        material de la que hay que fiarse de nuestra lectura en vez de
        mirarla uno mismo.

  - id: canales
    apunte:
      texto: '10 de 11 años — Manning y la óptima'
      tono: nota
    titulo: Flujo en canales
    pide: >-
      «Calcular la pendiente exacta del canal en milésimas y la velocidad»,
      «seleccionar el diámetro comercial mínimo a instalar» y «¿cuál deberá
      ser la berma de seguridad del canal?». Con esas palabras.
    porque: >-
      Cae en 10 de las 11 convocatorias finales y en uno de los cinco
      parciales: once ejercicios. Va detrás de bombeo porque comparte con él
      la mecánica de resolver por tanteo, pero delante de todo lo demás
      porque su rendimiento es casi el mismo y su temario es mucho más
      corto: un solo tema.
    invariante:
      anios: 11
      fuente: >-
        Las once finales. La lectura nuestra es que las secciones que han
        caído —rectángulo, trapecio, media caña, medio hexágono, V, calzada,
        acuerdo circular— son el mismo problema con otra geometría, porque lo
        único que cambia de una a otra es cómo se calculan el área y el
        perímetro mojado.
    dominio: >-
      Dimensionar un canal de sección que no habías visto nunca: escribir su
      área y su perímetro mojado en función de una variable, meterlos en
      Manning y despejar por tanteo.
    escalones:
      - id: chezy-y-manning
        titulo: Chezy y Manning
        aprendes: >-
          A aplicar Manning con el coeficiente que toca del cuadro n.º 26, y a
          entender por qué el radio hidráulico va elevado a dos tercios.
        teoria:
          tema: t21-canales
          apartado: manning
        ejercicios:
          - id: ejflu21-col87-el-rectangulo-y-la-media-cana
            incrustado: true
            nota: >-
              Los mismos datos en dos secciones. Es la forma más rápida de ver
              qué parte del resultado la pone la geometría.
          - id: exflu2122-ord-3-el-canal-y-su-berma
        dominio: >-
          Calcular el caudal de un canal trapecial dado el calado, la
          pendiente y el material, sin consultar la fórmula.

      - id: la-seccion-optima
        titulo: La sección hidráulicamente óptima
        aprendes: >-
          A deducir la relación entre ancho y calado que hace máximo el
          caudal, y a decir cuánto se gana de verdad con ella.
        teoria:
          tema: t21-canales
          apartado: la-sección-hidráulicamente-óptima
        ejercicios:
          - id: ejflu21-la-seccion-optima-y-cuanto-se-gana
            incrustado: true
            nota: >-
              El ejemplo de entrada. El semicuadrado, y la respuesta honesta a
              «¿cuánto se gana?», que es menos de lo que uno espera.
          - id: ejflu21-col813-los-cuatro-apartados-del-tema
          - id: exflu2223-ord-7-la-seccion-optima-del-canal-rectangular
            nota: >-
              Pide la deducción, no el resultado. Es COMP4 con la forma de un
              problema de cálculo.
        dominio: >-
          Deducir b = 2y para el rectángulo en papel, sin recordarla, y
          explicar en una frase por qué el semicírculo es la óptima absoluta.

      - id: los-tres-tipos-de-problema
        titulo: Los tres tipos de problema
        aprendes: >-
          A reconocer si te piden el caudal, el calado o la pendiente, y a
          saber cuál de los tres obliga a tantear.
        teoria:
          tema: t21-canales
          apartado: los-tres-tipos-de-problema
        ejercicios:
          - id: ejflu21-el-canal-de-doce-metros-cubicos
          - id: ejflu21-col89-el-colector-de-hormigon
            nota: >-
              Dimensionar la media caña y volver atrás a por el calado real.
              El camino de ida y vuelta que pide el examen.
          - id: ejflu21-col820-el-canal-de-desague-de-la-central
          - id: exflu2223-ext-7-los-tres-canales-encadenados
          - id: exflu2021-3par-5-la-red-de-canales-de-losas-cuadradas
            nota: >-
              El ramal que lleva la mitad de caudal arranca setenta metros más
              alto, porque su calado está limitado. Una limitación de calado
              se paga en cota.
        dominio: >-
          Ver un enunciado y decir en diez segundos cuál de los tres tipos es
          y si vas a tener que tantear.

      - id: secciones-sin-formula
        titulo: Las secciones que no tienen fórmula
        aprendes: >-
          A escribir el área y el perímetro mojado de una sección cualquiera
          —circular parcial, en V, un hexágono, una calzada— desde la
          geometría, sin buscar una fórmula que no existe.
        teoria:
          tema: t21-canales
          apartado: sección-circular-parcialmente-llena
        ejercicios:
          - id: ejflu21-col815-el-canal-en-v
            incrustado: true
            nota: >-
              No hay fórmula que recordar, y ese es el punto del ejercicio.
          - id: ejflu21-col816-el-foso-del-castillo
          - id: exflu1920-ord-8-el-canal-circular-de-arena
            nota: >-
              De aquí sale un dato del cuadro n.º 26 que se olvida: el
              coeficiente de Manning de la arena es 0,020.
          - id: exflu2425-ext-7-el-tubo-de-hexagono-y-semicirculo
          - id: exflu2425-ord-4-el-canal-con-acuerdo-circular
          - id: exflu2324-ext-7-la-calzada-como-canal
          - id: exflu2526-ord-5-el-canal-con-berma-y-la-pared-de-invierno
          - id: exflu2021-ord-3-el-aliviadero-de-dos-rampas
          - id: exflu2122-ext-6-los-dos-vertederos-del-mismo-canal
        dominio: >-
          Dibujar una sección compuesta, marcar qué parte del contorno está
          mojada y cuál no, y escribir las dos expresiones sin equivocarte de
          arco.
    falta: []

  - id: fuerzas-sobre-superficies-y-cuerpos
    apunte:
      texto: '10 de 11 años — la compuerta y Arquímedes'
      tono: nota
    titulo: Fuerzas sobre superficies y sobre cuerpos
    pide: >-
      «Dibujar los prismas de presiones acotados» —esas cinco palabras, en
      cinco de las once finales y en un parcial—, y detrás «calcular las componentes horizontal y
      vertical de la fuerza», «calcular la reacción en el tope C» y «¿para qué
      valor de h empezará a abrirse la compuerta?».
    porque: >-
      Sumados los dos temas caen en 10 de las 11 convocatorias finales y en
      dos de los cinco parciales: doce ejercicios. Van juntos porque el examen
      los mezcla en el mismo enunciado más veces que los separa: el bloque que
      ancla una tubería submarina es Arquímedes y prisma de presiones a la
      vez.
    invariante:
      anios: 11
      fuente: >-
        Las once finales, contando el tema 7 y el tema 8 como un solo hueco.
        La unión es lectura nuestra, y se apoya en que ningún examen de los
        once trae los dos por separado con enunciados independientes.
    dominio: >-
      Ante una superficie curva con dos fluidos y aire encima, dibujar el
      prisma de presiones, sacar las dos componentes con su punto de
      aplicación y cerrar el equilibrio de momentos.
    escalones:
      - id: la-plana-inclinada
        titulo: La superficie plana inclinada y el centro de presión
        aprendes: >-
          A calcular la fuerza sobre una compuerta plana y a situar el centro
          de presión por debajo del centro de gravedad, con su distancia.
        teoria:
          tema: t07-fuerzas-superficies
          apartado: superficie-plana-inclinada
        ejercicios:
          - id: ejflu7-compuerta-vertical-y-el-centro-de-presion
            incrustado: true
            nota: >-
              El ejemplo de entrada. Una compuerta vertical y la pregunta que
              de verdad importa: dónde se aplica la fuerza.
          - id: ejflu7-compuerta-inclinada
            nota: >-
              La misma compuerta a sesenta grados, para separar lo que cambia
              de lo que no.
          - id: ejflu7-col225-la-cota-de-equilibrio
          - id: exflu2021-1par-3-la-compuerta-que-se-abre-a-los-cuatro-metros
        dominio: >-
          Dar la fuerza y la profundidad del centro de presión de una
          compuerta inclinada de memoria, y explicar por qué el centro de
          presión sube al subir el agua.

      - id: el-prisma-de-presiones
        titulo: El prisma de presiones cuando no es un triángulo
        aprendes: >-
          A construir el prisma de presiones con aire presurizado o con
          vacuómetro encima, donde deja de ser un triángulo y pasa a ser un
          rectángulo con signo más dos triángulos.
        teoria:
          tema: t07-fuerzas-superficies
          apartado: el-prisma-de-presiones
        ejercicios:
          - id: ejflu7-col224-la-compuerta-entre-agua-y-aceite
            incrustado: true
          - id: exflu2324-ord-4-la-compuerta-abc-con-vacuometro
            nota: >-
              El prisma no es un triángulo, y el error típico consiste en
              dibujarlo como si lo fuera.
          - id: exflu2425-ext-6-la-compuerta-con-vacuometro
            nota: >-
              El plano piezométrico se hunde por debajo de la compuerta. Vale
              la pena dibujarlo antes de escribir nada.
        dominio: >-
          Dibujar el prisma de una compuerta con dos fluidos y aire encima, y
          descomponerlo en figuras cuyo área y centroide sepas de memoria.

      - id: superficies-curvas
        titulo: Superficies curvas — las dos componentes
        aprendes: >-
          A separar la componente horizontal —la de la proyección vertical— de
          la vertical —el peso del volumen de líquido que descansa encima, real
          o imaginario—.
        teoria:
          tema: t07-fuerzas-superficies
          apartado: superficies-curvas-dos-componentes
        ejercicios:
          - id: ejflu7-col229-el-cuarto-de-cilindro
            incrustado: true
            nota: >-
              Un cuarto de cilindro que se abre sin fuerza. El resultado sale
              exactamente cero, y eso no es casualidad.
          - id: ejflu7-col223-la-compuerta-con-resultante-nula
          - id: exflu2122-ord-5-la-compuerta-de-cuarto-de-cilindro
          - id: exflu2223-ord-3-el-tramo-circular-entre-dos-fluidos
        dominio: >-
          Sombrear el volumen que pesa sobre una superficie curva sin
          equivocarte de lado, y justificar el signo de la componente vertical
          cuando el líquido está debajo.

      - id: la-subpresion
        titulo: La subpresión, y la presa que vuelca
        aprendes: >-
          A incluir la subpresión del terreno en el equilibrio de una presa y
          a comprobar el vuelco y el deslizamiento.
        teoria:
          tema: t07-fuerzas-superficies
          apartado: la-subpresión
        ejercicios:
          - id: ejflu7-col238-la-presa-y-el-hielo
          - id: ejflu7-col231-la-compuerta-que-abre-la-subpresion
            nota: >-
              Lo que abre la compuerta no es el empuje, es lo que empuja desde
              abajo. Es el error típico del apartado entero.
          - id: ejflu7-col226-el-aliviadero-automatico
          - id: exflu2021-ord-1-la-presa-con-dos-leyes
        dominio: >-
          Escribir los cuatro momentos de una presa —empuje, peso, subpresión y
          lo que haya encima— respecto del pie de aguas abajo, con sus brazos.

      - id: arquimedes
        titulo: Arquímedes y los cuerpos sumergidos
        aprendes: >-
          A plantear el equilibrio de un cuerpo que flota o que está sumergido
          entre dos líquidos, con el empuje de cada uno.
        teoria:
          tema: t08-fuerzas-cuerpos
          apartado: arquímedes-deducido
        ejercicios:
          - id: ejflu8-el-calado-de-un-bloque-que-flota
            incrustado: true
            nota: >-
              El ejemplo de entrada. Cuánto se hunde un bloque, y de dónde
              sale el empuje sin recitar el principio.
          - id: ejflu8-col241-el-hidrometro
            nota: >-
              La escala de un hidrómetro no es lineal, y el ejercicio hace ver
              por qué.
          - id: ejflu8-col246-el-globo-de-hidrogeno
          - id: ejflu8-col25-las-campanas-de-buceo
          - id: exflu1920-ord-3-el-cuerpo-que-flota-entre-dos-liquidos
          - id: exflu2122-ext-3-el-balancin-en-dos-fluidos
          - id: exflu2324-ext-2-la-gabarra-que-se-hundio
            nota: >-
              Se hundió al pasar de agua salada a agua dulce. Es el ejercicio
              que mejor explica para qué sirve la densidad relativa.
          - id: exflu2223-ext-3-el-bloque-que-ancla-la-tuberia-submarina
          - id: exflu2526-ord-3-el-globo-aerostatico
        dominio: >-
          Resolver un cuerpo que flota en la interfaz de dos líquidos dando el
          calado en cada uno, y comprobar el resultado por pesos.

      - id: barlow
        titulo: Tensiones en tuberías — la fórmula de Barlow
        aprendes: >-
          A calcular el espesor de un tubo o de una esfera a presión y a
          justificar por qué la esfera necesita la mitad.
        teoria:
          tema: t08-fuerzas-cuerpos
          apartado: tensiones-en-tuberías-la-fórmula-de-barlow
        ejercicios:
          - id: ejflu8-col245-la-esfera-a-presion
            incrustado: true
          - id: exflu1920-1par-4-el-tubo-de-helio-que-tiende-a-abrirse
        dominio: >-
          Deducir Barlow cortando el tubo por un diámetro, sin recordar la
          fórmula, y decir qué cambia al hacerlo con una esfera.
    falta:
      - >-
        Cinco ejercicios grandes del cuadernillo se han quedado fuera porque
        su figura no acota lo que hace falta: el elevador de taller de junio
        de 2021, el embrague multidisco y los depósitos anidados de junio de
        2020, el apartado b) del bloque de anclaje de junio de 2023 y el codo
        convergente de junio de 2021. Están declarados con su número en
        `tasks/todo.md`.

  - id: cantidad-de-movimiento
    apunte:
      texto: '9 de 11 años — codos y álabes'
      tono: nota
    titulo: Cantidad de movimiento aplicada
    pide: >-
      «Fuerza que el fluido ejerce sobre el conjunto (módulo, dirección y
      sentido)», y en los de álabe «¿a qué velocidad debe desplazarse el álabe
      para que la potencia sea máxima?».
    porque: >-
      Cae en 9 de las 11 convocatorias finales y en dos de los cinco
      parciales: once ejercicios. Va después de los tres primeros huecos
      porque, a diferencia de ellos, se puede resolver casi entero con dos
      fórmulas bien entendidas, así que rinde más por hora al final que al
      principio.
    invariante:
      anios: 11
      fuente: >-
        Las once finales, contando el tema 14 y el 15 como un hueco. La
        lectura nuestra es que los once enunciados son el mismo teorema con
        tres decorados: un codo, un álabe o un chorro que se parte.
    dominio: >-
      Dibujar el volumen de control, poner las cuatro clases de fuerza que
      cruzan su frontera y proyectar en dos ejes sin perder un signo.
    escalones:
      - id: el-volumen-de-control
        titulo: El volumen de control y las fuerzas que hay que contar
        aprendes: >-
          A elegir el volumen de control y a enumerar sin olvidos las fuerzas
          que actúan sobre él: presiones en las caras, peso, y la reacción del
          anclaje.
        teoria:
          tema: t14-cantidad-movimiento
          apartado: las-fuerzas-que-hay-que-contar
        ejercicios:
          - id: ejflu14-el-codo-y-su-anclaje
            incrustado: true
            nota: >-
              El ejemplo de entrada. Cuál de los dos términos manda, el de
              presión o el de cantidad de movimiento, y por cuánto.
          - id: ejflu15-col44-el-codo-de-noventa-grados
          - id: ejflu15-col45-el-codo-convergente
          - id: ejflu15-col48-la-pieza-en-y
            nota: >-
              La pieza en Y, y las diecisiete toneladas que hay que anclar.
              Es el que hace ver la escala real de estas fuerzas.
          - id: exflu2223-ord-2-el-codo-boquilla-que-da-la-vuelta
          - id: exflu2324-ord-2-la-pieza-con-dos-boquillas
            nota: >-
              El examen pregunta quién pone de verdad la fuerza, y la
              respuesta no es la que uno diría de entrada.
          - id: exflu2526-ord-6-el-cabezal-de-la-ducha
        dominio: >-
          Anclar un codo reductor de 60° dando módulo y dirección, y decir qué
          fracción del total pone el término de presión.

      - id: los-alabes
        titulo: Los álabes, fijos y móviles
        aprendes: >-
          A calcular la fuerza sobre un álabe fijo y sobre uno que se mueve, y
          a encontrar la velocidad que hace máxima la potencia.
        teoria:
          tema: t15-aplicaciones-tcm
          apartado: teoría-general-de-los-álabes
        ejercicios:
          - id: ejflu15-el-alabe-fijo
            incrustado: true
            nota: >-
              El ejemplo de entrada, y de paso la razón de que 180 grados dé
              exactamente el doble.
          - id: ejflu15-el-alabe-movil
          - id: exflu1920-2par-1-el-alabe-que-huye-y-el-que-embiste
          - id: exflu2425-ext-8-los-alerones-del-formula-uno
          - id: exflu2021-2par-3-el-carro-con-el-alabe
            nota: >-
              El apartado que se responde sin una sola cuenta: si el depósito
              y el carro se unen, el conjunto no se mueve.
        dominio: >-
          Dar la potencia de un álabe móvil en función de su velocidad y
          demostrar dónde está el máximo, sin recordar que es un tercio.

      - id: chorros-que-se-parten
        titulo: Chorros que se parten y placas inclinadas
        aprendes: >-
          A repartir un chorro que choca contra una placa inclinada y a
          resolver una bifurcación con dos ángulos distintos.
        teoria:
          tema: t15-aplicaciones-tcm
          apartado: fuerzas-sobre-un-codo
        ejercicios:
          - id: ejflu15-col410-la-placa-inclinada
            incrustado: true
            nota: >-
              El reparto sale de proyectar sobre la placa, no de suponerlo.
          - id: exflu2122-ext-4-la-derivacion-en-y
          - id: exflu2223-ext-4-el-chorro-que-se-parte-en-dos
          - id: exflu2425-ord-7-el-flyboard-y-sus-dos-chorros
          - id: exflu1920-ord-4-el-limpiacristales-y-su-cono
          - id: exflu2122-ord-7-el-cono-que-desvia-el-chorro
        dominio: >-
          Repartir un chorro entre las dos ramas de una placa inclinada
          justificando el reparto, y encontrar el ángulo que hace máxima la
          fuerza.

      - id: el-ensanchamiento-brusco
        titulo: El ensanchamiento brusco, deducido
        aprendes: >-
          A deducir la pérdida de Borda-Carnot con el teorema de la cantidad
          de movimiento, en vez de copiarla de una tabla.
        teoria:
          tema: t15-aplicaciones-tcm
          apartado: y-el-resto-de-aplicaciones-del-temario
        ejercicios:
          - id: ejflu15-col411-el-ensanchamiento-brusco-con-aire
            incrustado: true
          - id: ejflu14-col413-la-reaccion-del-chorro
        dominio: >-
          Deducir la expresión de la pérdida por ensanchamiento brusco en
          papel, diciendo en qué cara se aplica la presión de entrada.
    falta: []

  - id: estatica-e-hidrostatica
    apunte:
      texto: '8 de 11 años — el micromanómetro'
      tono: nota
    titulo: Estática, manómetros y micromanómetros
    pide: >-
      «Representar esquemáticamente el micromanómetro», «deducir la
      expresión para el cálculo de la presión de vacío», «seleccionar los dos
      fluidos más adecuados para obtener la mayor sensibilidad» y «calcular el
      grado de sensibilidad del micromanómetro».
    porque: >-
      Cae en 8 de las 11 convocatorias finales y en dos de los cinco
      parciales: once ejercicios. El diseño de micromanómetros por sí solo
      aparece en cuatro de los once años, siempre con la misma pregunta.
    invariante:
      anios: 11
      fuente: >-
        Las once finales, temas 3 y 4 juntos. Que «elegir la pareja de
        líquidos» y «dar el ángulo equivalente de un tubo inclinado» sean el
        mismo ejercicio es lectura nuestra: lo son porque los dos miden la
        sensibilidad del aparato y se resuelven con la misma ecuación.
    dominio: >-
      Recorrer un manómetro de cuatro ramales y tres líquidos sin perder un
      signo, y diseñar un micromanómetro eligiendo las densidades para una
      sensibilidad pedida.
    escalones:
      - id: la-ecuacion-fundamental
        titulo: La ecuación fundamental y el gradiente
        aprendes: >-
          A saber a qué ritmo sube la presión en cada fluido y a decidir
          cuándo el peso de una columna de gas se puede despreciar.
        teoria:
          tema: t04-hidrostatica
          apartado: la-ecuación-fundamental
        ejercicios:
          - id: ejflu3-el-gradiente-de-presion-en-dos-fluidos
            incrustado: true
            nota: >-
              El ejemplo de entrada. El agua y el aire, y los cuatro órdenes
              de magnitud que los separan.
          - id: ejflu3-la-isotropia-y-lo-que-no-dice
          - id: ejflu4-col211-el-indicador-de-gasolina
            nota: >-
              El indicador miente porque hay agua en el fondo. La ecuación
              fundamental aplicada a un fallo real.
        dominio: >-
          Decir de memoria cuánto sube la presión por metro en agua, en
          mercurio y en aire, y justificar cuándo el aire se puede ignorar.

      - id: absoluta-y-manometrica
        titulo: Absoluta, manométrica y el barómetro
        aprendes: >-
          A moverte entre presión absoluta y manométrica sin confundirte, y a
          decir qué le pasa a cada aparato si cambia la atmósfera.
        teoria:
          tema: t04-hidrostatica
          apartado: absoluta-y-manométrica
        ejercicios:
          - id: exflu2223-ext-2-el-manometro-que-se-mueve-y-el-que-no
            nota: >-
              Sube la atmósfera y solo se mueve uno de los tres. Es la
              pregunta que separa entender de recordar.
          - id: exflu2122-ord-4-los-dos-depositos-y-el-helio
        dominio: >-
          Ante tres aparatos en la misma figura, decir cuál lee absoluta y
          cuál relativa, y qué marca cada uno si la atmósfera sube 20 mbar.

      - id: recorrer-un-manometro
        titulo: Recorrer un manómetro sin equivocarse
        aprendes: >-
          A bajar y subir por los ramales de un manómetro sumando y restando
          columnas, con un criterio de signo que no falle.
        teoria:
          tema: t04-hidrostatica
          apartado: recorrer-un-manómetro-sin-equivocarse
        ejercicios:
          - id: ejflu4-recorrer-un-tubo-en-u
            incrustado: true
            nota: >-
              El ejemplo de entrada. Tramo a tramo, con el criterio de signo
              escrito antes de empezar.
          - id: ejflu4-col215-el-manometro-dentro-del-deposito
          - id: exflu2526-ord-1-el-manometro-dentro-del-deposito-presurizado
          - id: exflu2324-ord-3-los-dos-manometros-y-el-que-miente
            nota: >-
              Dos aparatos redundantes y uno que miente. Se descubre con un
              tercer camino, y ese es el método del bloque entero.
          - id: exflu1920-1par-2-el-laboratorio-submarino
        dominio: >-
          Cerrar un manómetro de cuatro ramales a la primera y comprobarlo
          recorriéndolo en sentido contrario.

      - id: el-micromanometro
        titulo: Diseñar un micromanómetro
        aprendes: >-
          A elegir la pareja de líquidos y la geometría que dan la
          sensibilidad pedida, y a traducirla al ángulo equivalente de un tubo
          inclinado.
        teoria:
          tema: t04-hidrostatica
          apartado: los-aparatos-y-qué-mide-cada-uno
        ejercicios:
          - id: ejflu4-col22-el-manometro-con-ensanchamiento
            incrustado: true
            nota: >-
              El ensanchamiento hace que un nivel casi no se mueva, y de ahí
              sale toda la sensibilidad del aparato.
          - id: exflu2223-ord-1-el-micromanometro-de-dos-liquidos
          - id: exflu2324-ext-3-el-micromanometro-de-liquidos-inmiscibles
          - id: exflu2425-ord-3-disenar-la-sensibilidad-del-micromanometro
          - id: exflu2021-1par-2-el-micromanometro-que-hay-que-disenar
        dominio: >-
          Dar el intervalo de densidades del segundo líquido para una
          sensibilidad pedida, y el ángulo del tubo inclinado que haría lo
          mismo.

      - id: pascal-y-la-prensa
        titulo: Pascal y la prensa hidráulica
        aprendes: >-
          A resolver una prensa o un gato con su palanca, y a decidir en qué
          orden suben varios émbolos que comparten bomba.
        teoria:
          tema: t04-hidrostatica
          apartado: pascal-y-la-prensa-hidráulica
        ejercicios:
          - id: ejflu4-col21-el-gato-hidraulico
            incrustado: true
          - id: exflu2122-ext-2-los-tres-coches-y-una-sola-bomba
            nota: >-
              Tres coches y una bomba. Suben de uno en uno, y el orden lo
              decide el peso, no la geometría.
        dominio: >-
          Dar la fuerza en el émbolo grande de un gato con palanca, y predecir
          el orden de subida de tres cargas distintas.
    falta: []

  - id: propiedades-del-fluido
    apunte:
      texto: '8 de 11 años — viscosidad y capilaridad'
      tono: nota
    titulo: Propiedades del fluido
    pide: >-
      «La expresión del ascenso capilar en un tubo de sección…», «calcular
      el módulo de elasticidad volumétrico», «la potencia disipada por el
      fluido situado en el huelgo entre dos…» y «la relación existente entre
      las fuerzas de adhesión y las fuerzas de cohesión».
    porque: >-
      Cae en 8 de las 11 convocatorias finales y en dos de los cinco
      parciales: diez ejercicios. Va aquí y no antes porque es el bloque con
      más ejercicios de colección del corpus —veintiuno— y conviene llegar a
      él con tiempo de hacerlos, no con prisa.
    invariante:
      anios: 11
      fuente: >-
        Las once finales. La lectura nuestra es que la capilaridad ha
        cambiado de disfraz cada año —tubo, rectángulo, corona, dos tubos
        enfrentados, un piezómetro que miente— sin cambiar de fondo: siempre
        es el peso de la columna contra la componente vertical de la tensión
        en el perímetro mojado.
    dominio: >-
      Sacar una viscosidad de un montaje que no habías visto, comprimir un
      líquido con la fórmula exponencial y deducir el ascenso capilar de una
      sección cualquiera desde el equilibrio de fuerzas.
    escalones:
      - id: la-ley-de-newton
        titulo: La ley de Newton de la viscosidad
        aprendes: >-
          A relacionar la fuerza de rozamiento con el gradiente de velocidad,
          y a moverte entre poises, stokes y unidades del SI.
        teoria:
          tema: t02-propiedades
          apartado: la-ley-de-newton-de-la-viscosidad
        ejercicios:
          - id: ejflu2-la-ley-de-newton-una-sola-vez
            incrustado: true
            nota: >-
              El ejemplo de entrada. Una placa, un hueco, y la ley aplicada
              una sola vez para que se vea entera.
          - id: ejflu2-col12-la-placa-entre-dos-superficies
            nota: >-
              La placa roza por las dos caras, y los dos huelgos no son
              iguales. Es el primer sitio donde se falla.
          - id: ejflu2-col113-la-viscosidad-a-partir-de-la-fuerza
          - id: ejflu2-col112-de-dinamica-a-cinematica
          - id: ejflu2-col111-de-la-tension-cortante-a-los-centipoises
        dominio: >-
          Dar la fuerza que frena una placa entre dos huelgos distintos, y
          convertir el resultado a poises y a centistokes sin tabla.

      - id: geometrias-que-no-son-una-placa
        titulo: Cuando la geometría no es una placa plana
        aprendes: >-
          A aplicar la ley de Newton en cilindros coaxiales, poleas y discos
          que giran, donde la velocidad depende del radio.
        teoria:
          tema: t02-propiedades
          apartado: la-ley-de-newton-de-la-viscosidad
          nota: >-
            El mismo apartado, releído con la pregunta «¿qué es aquí el
            gradiente?» en la cabeza.
        ejercicios:
          - id: ejflu2-col13-los-tres-cilindros-coaxiales
          - id: ejflu2-col118-el-par-de-la-polea
          - id: ejflu2-col119-el-eje-y-el-cilindro-contrarrotantes
          - id: ejflu2-col120-el-disco-que-gira-sobre-la-pelicula
            nota: >-
              Aquí el radio deja de ser constante y hay que integrar. Es el
              techo del escalón.
          - id: ejflu2-col114-la-viscosidad-desde-la-potencia
          - id: ejflu2-col115-el-cilindro-que-desliza
          - id: ejflu2-col116-el-espesor-de-la-pelicula
          - id: ejflu2-col117-el-cubo-sobre-la-pelicula-de-aceite
          - id: exflu2223-ord-4-el-aceite-que-sostiene-la-chatarra
          - id: exflu2122-ord-1-el-perfil-parabolico-y-su-cortante
            nota: >-
              El cortante punto a punto de un perfil parabólico. Enlaza este
              bloque con el de conducciones.
        dominio: >-
          Escribir el par que hay que vencer en un huelgo cilíndrico, y decir
          en qué casos hace falta integrar y en cuáles basta con el radio
          medio.

      - id: compresibilidad
        titulo: Compresibilidad y el módulo de elasticidad
        aprendes: >-
          A usar la forma exponencial de la compresibilidad —la que usa la
          escuela— y a relacionar el módulo con el coeficiente.
        teoria:
          tema: t02-propiedades
          apartado: compresibilidad-el-módulo-de-elasticidad-volumétrico
          nota: >-
            El apartado insiste en la forma exponencial y no en la lineal, y
            no es un detalle: las soluciones oficiales solo salen con ella.
        ejercicios:
          - id: ejflu2-col121-el-modulo-de-elasticidad
            incrustado: true
          - id: ejflu2-col15-el-modulo-desde-la-densidad
          - id: ejflu2-col122-el-modulo-de-un-gas-isotermo
            nota: >-
              El módulo de un gas isotermo es su propia presión. Sale en dos
              líneas y se recuerda para siempre.
          - id: ejflu2-col123-el-deposito-de-cinco-mil-litros
          - id: ejflu2-col124-el-deposito-que-si-se-dilata
          - id: exflu2122-ord-2-el-oceano-que-se-comprime
          - id: exflu2324-ext-1-los-cincuenta-mililitros-que-faltan
          - id: exflu2425-ext-1-el-dioxido-de-carbono-comprimido
          - id: exflu2021-1par-4-el-deposito-que-se-dilata
          - id: exflu1920-1par-1-el-aire-que-se-calienta-a-medio-llenar
        dominio: >-
          Dar la presión final de un depósito al que le han quitado 50 ml, con
          la fórmula exponencial, y decir cuánto se equivocaría la lineal.

      - id: capilaridad
        titulo: Tensión superficial y capilaridad
        aprendes: >-
          A deducir el ascenso capilar de una sección cualquiera igualando el
          peso de la columna con la tensión repartida en el perímetro mojado.
        teoria:
          tema: t02-propiedades
          apartado: tensión-superficial-y-capilaridad
        ejercicios:
          - id: ejflu2-col125-el-ascenso-capilar
            incrustado: true
            nota: >-
              Jurin en su forma más simple, y con la tensión superficial
              todavía en kilopondios.
          - id: ejflu2-col126-el-capilar-cuadrado
            nota: >-
              Un capilar cuadrado sube lo mismo que uno circular del mismo
              lado, y el ejercicio explica por qué.
          - id: ejflu2-col127-la-corona-circular
          - id: exflu2324-ord-1-la-capilaridad-entre-dos-tubos
            nota: >-
              Aquí Jurin no sirve. Hay que volver al equilibrio de fuerzas, y
              esa es la única forma de aprobar el apartado.
          - id: exflu2223-ext-1-la-capilaridad-en-un-rectangulo
            nota: >-
              De aquí sale la construcción adhesión-cohesión que hace falta en
              la ordinaria de 2025: la adhesión perpendicular a la pared, la
              cohesión a 45°, y la superficie libre perpendicular a la
              resultante.
          - id: exflu2122-ext-1-la-savia-que-sube-treinta-metros
          - id: exflu2425-ord-2-el-piezometro-que-miente-por-capilaridad
          - id: exflu2021-1par-1-seis-afirmaciones-y-las-seis-falsas
            nota: >-
              Seis afirmaciones sobre propiedades y las seis falsas, cada una
              por un motivo distinto. Barre el bloque entero y es el mejor
              repaso final que tiene.
        dominio: >-
          Dado un hueco de sección cualquiera, escribir el ascenso como
          tensión por perímetro dividido por peso específico por área, y
          justificar cada uno de los cuatro términos.
    falta:
      - >-
        Presión de vapor y cavitación tiene apartado de teoría pero ningún
        ejercicio propio: se practica dentro del bloque de bombeo, en el
        escalón del NPSH, y dentro de los sifones del bloque de medidores.

  - id: conducciones
    apunte:
      texto: '7 de 11 años — series, paralelo y el nudo'
      tono: nota
    titulo: Conducciones — pérdidas menores, series y paralelo
    pide: >-
      «Energía por unidad de volumen del nudo N», «sentido y valor del
      caudal», «el diámetro exacto del conducto» y «diámetro comercial del
      conducto, sabiendo que los diámetros van de…».
    porque: >-
      Cae en 7 de las 11 convocatorias finales y en dos de los cinco
      parciales: once ejercicios. Va detrás de bombeo aunque bombeo lo
      necesite, y eso es deliberado: el escalón de la curva de la instalación
      ya obliga a montar una conducción entera, así que quien llega aquí llega
      con medio bloque hecho.
    invariante:
      anios: 11
      fuente: >-
        Las once finales, temas 17 a 19 juntos. La lectura nuestra es que «el
        depósito intermedio, ¿recibe o aporta?» es el mismo ejercicio en tres
        años distintos, con la red dibujada de otra manera.
    dominio: >-
      Resolver una red de tres conductos que se juntan en un nudo, decidiendo
      por tanteo el sentido del ramal intermedio, y cerrar el balance de
      caudales.
    escalones:
      - id: perdidas-menores
        titulo: Pérdidas menores y longitud equivalente
        aprendes: >-
          A contabilizar codos, válvulas y entradas por los dos métodos —el
          coeficiente y la longitud equivalente— y a saber cuánto pesan de
          verdad.
        teoria:
          tema: t19-conducciones
          apartado: pérdidas-menores
        ejercicios:
          - id: ejflu19-cuanto-pesan-de-verdad-las-perdidas-menores
            incrustado: true
            nota: >-
              El ejemplo de entrada. Los dos métodos sobre la misma
              instalación, y la respuesta a si se pueden despreciar.
          - id: ejflu19-col612-el-camion-de-alcohol
          - id: exflu2324-ord-8-el-codo-y-su-longitud-equivalente
          - id: exflu2021-3par-2-el-factor-de-paso-de-la-valvula
            nota: >-
              El factor de paso es adimensional, y por eso vale igual con agua
              que con mercurio. Dos cotas del enunciado sobran.
        dominio: >-
          Sumar las pérdidas menores de una instalación con seis accesorios
          por los dos métodos y decir cuánto se aparta un resultado del otro.

      - id: la-linea-piezometrica
        titulo: La línea piezométrica y la de altura total
        aprendes: >-
          A dibujar las dos líneas sobre un perfil y a leer en ellas dónde el
          fluido va a cavitar.
        teoria:
          tema: t19-conducciones
          apartado: línea-piezométrica-y-línea-de-altura-total
        ejercicios:
          - id: ejflu19-el-sifon-de-keroseno-que-cavita
            incrustado: true
            nota: >-
              La presión imposible del punto alto se ve antes en el dibujo que
              en la cuenta.
          - id: exflu1920-ord-6-la-turbina-entre-dos-tuberias
        dominio: >-
          Dibujar las dos líneas de una instalación con bomba, turbina y un
          punto alto, y marcar en el dibujo dónde está el problema.

      - id: serie-paralelo-y-el-nudo
        titulo: Serie, paralelo, y el depósito que aporta
        aprendes: >-
          A resolver ramales en serie y en paralelo, y a decidir por tanteo si
          el depósito intermedio recibe o aporta caudal.
        teoria:
          tema: t19-conducciones
          apartado: tuberías-en-serie-y-en-paralelo
        ejercicios:
          - id: ejflu19-col619-las-dos-tuberias-en-serie
            incrustado: true
          - id: exflu2223-ord-8-la-red-con-un-deposito-que-alimenta
            nota: >-
              El segundo depósito no recibe: aporta. Es el apartado que decide
              el ejercicio y el que más veces se resuelve al revés.
          - id: exflu2122-ord-9-los-dos-ramales-laminares
          - id: exflu2223-ext-6-los-dos-ramales-con-el-mismo-caudal
          - id: exflu2021-2par-1-la-embotelladora-de-diez-boquillas
            nota: >-
              El consumo lo fijan diez boquillas iguales, y el depósito
              intermedio acaba aportando lo que a la bomba le falta.
        dominio: >-
          Plantear las tres ecuaciones de un nudo con tres depósitos, suponer
          un sentido, resolver y comprobar el signo — y rehacerlo si sale al
          revés.

      - id: hazen-williams
        titulo: Hazen-Williams, y el coeficiente que no es del material
        aprendes: >-
          A usar la fórmula de Hazen-Williams y a sacar su coeficiente del
          cuadro n.º 25, que va por bandas de rugosidad relativa y no por
          material.
        teoria:
          tema: t19-conducciones
          apartado: hazen-williams
          nota: >-
            Esta es la trampa más cara del tema. El mismo PVC toma 140 a 150
            mm y otro valor a otro diámetro, porque lo que manda es la
            relación entre rugosidad y diámetro.
        ejercicios:
          - id: exflu2122-ext-7-el-diametro-que-hay-que-despejar
            incrustado: true
          - id: exflu2526-ord-2-elegir-la-bomba-entre-tres
        dominio: >-
          Elegir el coeficiente de Hazen-Williams de un tramo calculando antes
          su rugosidad relativa, y saber decir por qué el material solo no
          basta.

      - id: laminar-y-la-capa-limite
        titulo: Régimen laminar y la capa límite
        aprendes: >-
          A decidir el régimen con Reynolds, a usar el perfil parabólico del
          laminar y a situar la transición en una placa.
        teoria:
          tema: t17-viscosidad
          apartado: la-experiencia-de-reynolds
        ejercicios:
          - id: ejflu17-cuando-el-agua-deja-de-ser-laminar
            incrustado: true
            nota: >-
              El ejemplo de entrada. El agua y el aceite, y los dos órdenes de
              magnitud que hay entre sus velocidades críticas.
          - id: ejflu17-donde-se-vuelve-turbulenta-la-capa-limite
          - id: ejflu18-col69-el-capilar-de-mercurio
        dominio: >-
          Dar la velocidad a la que un fluido deja de ser laminar en un tubo
          dado, y decir qué cambia en la fórmula de la pérdida al cruzarla.
    falta: []

  - id: medidores-y-vaciado
    apunte:
      texto: '7 de 11 años — Pitot, venturi y vaciado'
      tono: nota
    titulo: Bernoulli, medidores y vaciado
    pide: >-
      «Deducir la expresión para el vaciado», «densidad relativa del líquido
      manométrico del conjunto» y «deducir la expresión del coeficiente de
      velocidad del orificio». Casi siempre una deducción y después su valor.
    porque: >-
      Cae en 7 de las 11 convocatorias finales y en dos de los cinco
      parciales: nueve ejercicios. Va el último de los huecos grandes porque
      es el que más se apoya en lo anterior: un venturímetro es Bernoulli más
      un manómetro, y los dos ya están.
    invariante:
      anios: 11
      fuente: >-
        Las once finales, temas 12 y 13 juntos. La lectura nuestra es que
        Pitot, venturi, diafragma, orificio y vertedero son la misma ecuación
        con distinto coeficiente, y que por eso conviene estudiarlos como un
        bloque y no como cinco aparatos.
    dominio: >-
      Escribir la expresión del caudal de cualquiera de los cinco aparatos
      desde Bernoulli y continuidad, sin recordar ninguna fórmula cerrada.
    escalones:
      - id: bernoulli-generalizada
        titulo: Bernoulli generalizada, y la potencia
        aprendes: >-
          A meter pérdidas, bomba y turbina en la ecuación de Bernoulli y a
          calcular la potencia que va con cada una.
        teoria:
          tema: t12-bernoulli
          apartado: bernoulli-generalizada-las-pérdidas
          nota: >-
            Y el apartado «Potencia», que es donde se decide si multiplicas
            por el rendimiento o divides.
        ejercicios:
          - id: ejflu12-torricelli-y-la-potencia-del-chorro
            incrustado: true
            nota: >-
              El ejemplo de entrada. Un chorro que sale de un depósito, y la
              potencia que lleva encima.
          - id: ejflu12-la-bomba-y-su-rendimiento
          - id: ejflu12-col310-hacia-donde-va-el-flujo
            nota: >-
              La presión dice una cosa y la cota la contraria. Manda la altura
              piezométrica, y hay que decirlo con esas palabras.
          - id: ejflu12-col311-la-presion-antes-de-la-boquilla
          - id: ejflu12-col312-la-distancia-entre-bombas
        dominio: >-
          Decidir hacia dónde va el fluido entre dos puntos con presión y cota
          distintas, y justificarlo con la altura piezométrica.

      - id: pitot-y-prandtl
        titulo: Pitot y Prandtl
        aprendes: >-
          A separar presión estática, dinámica y total, y a sacar la velocidad
          de la diferencia entre dos tomas.
        teoria:
          tema: t13-medidores
          apartado: pitot-y-prandtl
        ejercicios:
          - id: ejflu13-el-tubo-de-pitot
            incrustado: true
          - id: exflu2021-2par-2-el-pitot-y-el-piezometro-juntos
            nota: >-
              Hay que deducir la densidad del líquido manométrico, y comprobar
              después que ese líquido no serviría con agua.
          - id: exflu2425-ext-9-el-pitot-del-avion-que-se-bloquea
            nota: >-
              La avería no se nota hasta que el avión cambia de altura. Es
              COMP4 disfrazado de aeronáutica.
        dominio: >-
          Dar la velocidad de un Pitot con líquido manométrico distinto del
          fluido, y decir qué mide cada una de las dos tomas.

      - id: deprimogenos
        titulo: Venturímetros y diafragmas
        aprendes: >-
          A escribir el caudal de un aparato deprimógeno desde Bernoulli y
          continuidad, y a manejar su coeficiente de descarga.
        teoria:
          tema: t13-medidores
          apartado: aparatos-deprimógenos
        ejercicios:
          - id: ejflu13-el-venturimetro
            incrustado: true
          - id: ejflu13-col329-el-venturi-vertical
            nota: >-
              Un venturímetro vertical lee lo mismo que uno horizontal, y el
              ejercicio hace ver por qué su lectura no sabe que lo es.
          - id: ejflu13-col330-calibrar-el-diafragma
          - id: exflu2122-ord-6-los-dos-manometros-del-venturimetro
          - id: exflu2223-ord-5-el-venturimetro-que-dice-hacia-donde-va
          - id: exflu2324-ext-4-el-venturimetro-calibrado-con-un-pitot
          - id: exflu2425-ord-8-el-diafragma-y-su-liquido-manometrico
        dominio: >-
          Deducir la expresión del caudal de un venturímetro en cuatro líneas,
          y decir por qué la lectura no depende de la inclinación.

      - id: torricelli-y-el-vaciado
        titulo: Torricelli, los tres coeficientes y el vaciado
        aprendes: >-
          A distinguir contracción, velocidad y descarga, y a integrar el
          tiempo de vaciado de un depósito.
        teoria:
          tema: t13-medidores
          apartado: torricelli-y-los-tres-coeficientes
          nota: >-
            Y «Vaciado de depósitos», que es donde está la integral y la razón
            de que el segundo cuarto tarde más que el primero.
        ejercicios:
          - id: ejflu13-orificio-y-vaciado
            incrustado: true
            nota: >-
              El ejemplo de entrada. Los tres coeficientes y el vaciado, en el
              mismo depósito.
          - id: ejflu12-col314-el-sifon-con-boquilla-y-perdidas
          - id: ejflu12-col315-el-sifon-limitado-por-la-cavitacion
          - id: ejflu13-col331-del-orificio-al-vertedero
          - id: exflu2021-ord-2-el-coeficiente-medido-por-la-perdida
          - id: exflu2324-ord-5-el-tiempo-de-vaciado
            nota: >-
              El razonamiento sobre por qué el segundo cuarto tarda más vale
              tanto como la integral.
          - id: exflu1920-1par-5-el-vaciado-con-cambio-de-seccion
        dominio: >-
          Integrar el tiempo de vaciado de un depósito de sección variable, y
          explicar sin cuentas por qué la segunda mitad tarda más.

      - id: vertederos
        titulo: Vertederos
        aprendes: >-
          A usar la ley del vertedero rectangular y la del triangular, y a
          saber de dónde sale el exponente cinco medios.
        teoria:
          tema: t13-medidores
          apartado: aparatos-deprimógenos
        ejercicios:
          - id: ejflu13-col332-los-dos-vertederos
            incrustado: true
          - id: ejflu13-col333-el-vertedero-triangular
          - id: exflu2122-ext-6-los-dos-vertederos-del-mismo-canal
        dominio: >-
          Dar la lámina sobre un vertedero triangular para un caudal dado, y
          justificar el exponente sin integrar.
    falta: []

  - id: golpe-de-ariete
    apunte:
      texto: '1 de 11 finales — pero 2 de 5 parciales'
      tono: neutro
    titulo: Golpe de ariete
    pide: >-
      «Valor de la sobrepresión generada por golpe de ariete, en mca»,
      «tensión de tracción a la que se somete la tubería de acero» y «razonar
      cuál será la presión mínima que alcanzará el flujo aguas abajo».
    porque: >-
      Es el bloque con el número más bajo de todo el examen final —una sola
      vez en once años— y aun así está aquí, y no eliminado, por dos motivos
      medidos. Uno: en los parciales cae en dos de cinco, así que quien
      prepara un parcial tiene que adelantarlo hasta arriba. Y dos: cuando
      cae, cae entero, con sus tres o cuatro apartados encadenados.
    invariante:
      anios: 11
      fuente: >-
        Las once finales y los cinco parciales, contados por separado. Este es
        el único bloque donde los dos recuentos no dicen lo mismo, y por eso
        se publican los dos.
    dominio: >-
      Clasificar un cierre como lento o rápido comparando su duración con
      2L/a, y dar la sobrepresión con la fórmula que corresponde a cada caso.
    escalones:
      - id: la-celeridad
        titulo: De qué depende la celeridad
        aprendes: >-
          A calcular la celeridad de la onda con el módulo del líquido y la
          elasticidad de la tubería, y a ver cuánto la baja un material
          flexible.
        teoria:
          tema: t20-golpe-ariete
          apartado: de-qué-depende-la-celeridad
        ejercicios:
          - id: ejflu20-el-material-decide-el-golpe
            incrustado: true
            nota: >-
              El ejemplo de entrada. La misma tubería en acero y en PVC, con
              el mismo cierre, y dos resultados que no se parecen.
          - id: ejflu20-col79-los-dos-tubos-del-laboratorio
          - id: ejflu20-col71-la-columna-que-oscila-en-el-tubo-en-u
        dominio: >-
          Dar la celeridad de una conducción de acero y de una de PVC con los
          mismos datos, y explicar cuál de los dos términos la domina.

      - id: cierre-lento-o-rapido
        titulo: Cierre lento o rápido — la clasificación lo decide todo
        aprendes: >-
          A comparar el tiempo de cierre con el periodo 2L/a, elegir entre
          Allievi y Michaud, y diseñar una maniobra que no rompa el tubo.
        teoria:
          tema: t20-golpe-ariete
          apartado: cierre-lento-o-rápido-la-clasificación-lo-decide-todo
        ejercicios:
          - id: ejflu20-la-misma-valvula-en-cuatro-y-en-dos-segundos
            incrustado: true
            nota: >-
              La misma válvula a los dos lados de la frontera. Es la forma más
              rápida de ver que la clasificación no es un trámite.
          - id: ejflu20-col72-los-dos-casos-limite
          - id: ejflu20-col75-cuanto-tiene-que-durar-el-cierre
          - id: ejflu20-col713-la-maniobra-que-hay-que-disenar
          - id: ejflu20-col78-la-tuberia-forzada-de-villarino
          - id: exflu2021-ord-4-el-ariete-con-la-longitud-por-incognita
            nota: >-
              Aquí el ariete se usa al revés: sirve para medir la longitud de
              la tubería.
          - id: exflu1920-2par-3-el-canal-y-la-tuberia-forzada
          - id: exflu2021-3par-3-la-valvula-de-retencion-y-el-corte-de-luz
        dominio: >-
          Decir en treinta segundos si un cierre es lento o rápido, y dar el
          tiempo mínimo que habría que exigir para no pasar de una
          sobrepresión dada.
    falta: []

  - id: turbinas-y-maquinas
    apunte:
      texto: '2 de 11 años — casi siempre teoría'
      tono: neutro
    titulo: Turbinas y tipos de máquina
    pide: >-
      «Elementos de que consta la turbina Pelton», «¿por qué se denomina la
      turbina Pelton turbina de acción?», «función del distribuidor en las
      turbinas Francis y Kaplan». Cuando cae, cae en preguntas cortas.
    porque: >-
      Solo 2 de las 11 convocatorias finales, y las dos veces sin apenas
      cálculo: una tabla de acción y reacción y cinco preguntas cortas. Va
      casi al final porque rinde poco por hora, pero no se elimina: son puntos
      que se llevan enteros o se pierden enteros, sin cuentas de por medio.
    invariante:
      anios: 11
      fuente: >-
        Las once finales. Que los dos enunciados sean «el mismo tipo de
        pregunta» es lectura nuestra: los dos piden vocabulario y criterio de
        selección, ninguno pide dimensionar.
    dominio: >-
      Rellenar de memoria la tabla que separa acción de reacción, y decir qué
      turbina toca dados el salto y el caudal, con la velocidad específica
      calculada.
    escalones:
      - id: accion-y-reaccion
        titulo: Acción y reacción, y qué turbina toca
        aprendes: >-
          A clasificar una máquina hidráulica y a elegir la turbina adecuada a
          partir de la velocidad específica.
        teoria:
          tema: t23-turbinas
          apartado: la-velocidad-específica-dice-qué-máquina-toca
        ejercicios:
          - id: ejflu23-que-turbina-toca
            incrustado: true
            nota: >-
              El ejemplo de entrada. Dos aprovechamientos de la misma potencia
              que piden dos turbinas distintas.
          - id: ejflu23-dimensionar-la-pelton
            nota: >-
              La Pelton dimensionada con el óptimo del tema 15, que es el
              mismo álabe móvil de antes con otro nombre.
          - id: ejflu22-el-triangulo-de-salida-de-una-bomba
            nota: >-
              La altura de Euler de un rodete centrífugo, que es lo que hay
              detrás de la curva que en bombeo se daba hecha.
          - id: ejflu24-el-caudal-de-una-bomba-de-embolo
          - id: exflu2122-ord-10-cinco-preguntas-de-maquinas
          - id: exflu2223-ext-9-accion-y-reaccion-en-una-tabla
        dominio: >-
          Escribir la tabla de acción y reacción de memoria —seis filas, dos
          familias— y elegir turbina con la velocidad específica calculada, no
          intuida.
    falta:
      - >-
        Los temas 22, 23 y 24 no tienen ni un solo ejercicio de nivel
        `practica`: solo ejemplos nuestros y los dos exámenes. Es el hueco de
        práctica más grande de la asignatura, y viene de que la colección
        apenas trae problemas de máquinas.

  # ═══════════════════════════════════════════════════════════════════
  # SIMULACRO Y FORMULARIO
  # ═══════════════════════════════════════════════════════════════════
  - id: simulacro
    apunte:
      texto: 'a reloj, y sin la solución al lado'
      tono: marco
    titulo: El simulacro
    pide: >-
      Ocho o nueve ejercicios de temas distintos, de una sentada. Los cuadros
      y ábacos se reparten con el examen — eso sí lo dicen los propios
      enunciados, que citan «Documentación: Anexo I».
    porque: >-
      Los bloques de arriba entrenan cada hueco por separado, y el examen no
      va por separado: va contra el reloj y saltando de tema en tema. Estas
      son las cuatro convocatorias más completas del corpus, elegidas porque
      son las que menos ejercicios tienen declarados fuera- 2024 ordinaria
      está entera, y las dos de 2023 y la de 2022 también.
    dominio: >-
      Hacer una convocatoria completa de una sentada y sin abrir la
      resolución, y después contar cuántos apartados habrías dado por buenos
      sin serlo.
    material:
      - tipo: examen
        curso: '2023-2024'
        convocatoria: ordinaria
        nota: >-
          Ocho de ocho transcritos, sin un solo hueco. Es el simulacro más
          limpio del corpus y el que conviene hacer primero.
      - tipo: examen
        curso: '2022-2023'
        convocatoria: ordinaria
        nota: >-
          Nueve de nueve. Recorre estática, cantidad de movimiento, canales,
          conducciones y bombeo en el mismo examen.
      - tipo: examen
        curso: '2022-2023'
        convocatoria: extraordinaria
        nota: >-
          Nueve de nueve. Su ejercicio 1 trae la construcción de adhesión y
          cohesión que hace falta en otras dos convocatorias.
      - tipo: examen
        curso: '2021-2022'
        convocatoria: ordinaria
        nota: >-
          Once ejercicios, el examen más largo de los once años. Sirve para
          medir el ritmo, aunque no dé tiempo a terminarlo.
    falta:
      - >-
        No hay cronómetro ni corrección automática de un examen completo: el
        simulacro se hace en papel y se corrige abriendo cada resolución. Lo
        que el sitio aporta es que la resolución está, no que te tome el
        tiempo.
      - >-
        Y falta el dato que haría útil el cronómetro: **cuánto dura el examen
        de Fluidos y qué se puede llevar**. Los enunciados citan un anexo de
        documentación, pero ni la duración ni si se admite calculadora
        programable están en ningún sitio del material, así que no se
        publican. Es una pregunta para quien haya hecho el examen.
      - >-
        **Las prácticas de laboratorio entran en el examen, y aquí no hay
        ninguna.** La guía es explícita en su apartado 7: el escrito
        «constará de preguntas relativas a las prácticas del laboratorio así
        como teoría y ejercicios». Lo que sí se puede decir, porque está en la
        guía y en el guion de prácticas, es **qué se hace**: cinco sesiones,
        quince horas por alumno, veintitrés prácticas. La sesión 1 va de
        propiedades y medida de la presión —balanza, viscosímetro Engler,
        capilaridad, manómetros diferenciales y micromanómetros—; la 2, de
        fuerzas sobre superficies, hidrómetro, pesada hidrostática y
        cavitación; las sesiones 3 y 4, de medida del flujo —presión estática
        y total, velocidad de un flujo de aire, calibrado de orificios,
        tiempo de vaciado, venturímetros, diafragmas, medidores indirectos,
        rotámetros y vertederos—; y la 5, de pérdidas de carga en tuberías y
        piezas especiales, longitud equivalente de una válvula y análisis
        topológico de máquinas hidráulicas.
        Fuente: la guía de la asignatura, apartado 5 «Programa de prácticas de
        laboratorio», y el guion de prácticas de la Escuela, que las detalla
        una a una con el tema al que pertenece cada una.
      - >-
        Y la buena noticia, que es la que dice qué falta de verdad: **la
        teoría de las veintitrés prácticas está escrita**. Cada una lleva su
        tema en el guion, y los temas son los que esta ruta ya prepara: la
        sesión 1 cae en los temas 2 y 4, la 2 en el 7 y el 8, las 3 y 4
        enteras en el 13, y la 5 en el 18, el 19, el 23 y el 24. Nadie que
        haya seguido esta ruta llega en blanco a una pregunta de prácticas.
        Lo que **no** está, y no se puede escribir sin inventarlo, es lo que
        solo existe en el cuaderno de quien las hizo: qué se
        midió en cada montaje, con qué aparato y qué salió, y qué se suele
        preguntar de ellas en el examen. Eso lo aporta Ionan, y entonces cada
        práctica se escribe con su guion delante y citado.

  - id: formulario
    apunte:
      texto: 'lo que hay que llevar en la cabeza'
      tono: marco
    titulo: El formulario
    pide: >-
      Nada. Es lo que el examen da por sabido sin decirlo, y lo que hay que
      poder escribir sin buscarlo.
    porque: >-
      Va el último porque es repaso, no aprendizaje: ninguno de estos
      apartados se entiende leyéndolo aquí por primera vez. Y va, en vez de no
      ir, porque el examen reparte los cuadros pero no las fórmulas, y con
      ocho o nueve ejercicios por delante la diferencia entre terminar y no
      terminar suele estar en cuánto tiempo se pierde buscando.
    dominio: >-
      Escribir de memoria, en una cara de folio: Bernoulli generalizada,
      Darcy, Manning, Allievi, la cadena de rendimientos y las seis
      conversiones de presión.
    material:
      - tipo: teoria
        tema: t04-hidrostatica
        apartado: las-unidades-que-son-medio-examen
        nota: >-
          Las seis conversiones. Si hay que memorizar una sola cosa de toda la
          asignatura, es esta tabla.
      - tipo: teoria
        tema: t12-bernoulli
        apartado: tres-formas-y-la-que-se-usa
        nota: >-
          Las tres formas de Bernoulli y cuál se usa en cada sitio, que es lo
          que decide si la ecuación sale en metros o en pascales.
      - tipo: teoria
        tema: t18-perdidas-carga
        apartado: las-cinco-fórmulas-y-cuándo-se-usa-cada-una
        nota: >-
          Las cinco fórmulas de pérdida con su rango de validez. Elegir mal
          aquí invalida el resto del ejercicio.
      - tipo: teoria
        tema: t21-canales
        apartado: manning
        nota: >-
          Manning y los coeficientes del cuadro n.º 26, incluido el de la
          arena, que es 0,020 y no está en las diapositivas.
      - tipo: teoria
        tema: t20-golpe-ariete
        apartado: el-golpe-máximo-allievi
        nota: >-
          Allievi, Michaud y el periodo 4L/a. Las tres se olvidan juntas.
      - tipo: teoria
        tema: t22-maquinas
        apartado: la-cadena-de-rendimientos
        nota: >-
          El orden de los rendimientos, que decide si se multiplica o se
          divide.
      - tipo: teoria
        tema: t16-analisis-dimensional
        apartado: los-cinco-números-y-qué-manda-en-cada-caso
        nota: >-
          Los cinco números adimensionales con su expresión y su significado
          físico, que es lo que pide el primer apartado casi siempre.
    falta:
      - >-
        Los cuadros de la escuela —rugosidades, Manning, Hazen-Williams, las
        propiedades del agua con la temperatura— no están reunidos en una sola
        página. Mientras no lo estén, este bloque enlaza a los apartados que
        los citan, que no es lo mismo.
