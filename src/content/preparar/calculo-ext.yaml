asignatura: calculo
evaluacion: extraordinaria
titulo: Preparar la convocatoria extraordinaria
lede: >-
  Lo primero que hay que saber de la extraordinaria es que **no es un examen: son
  dos**, y lo más probable es que solo te presentes a uno. Once convocatorias
  leídas y noventa y un ejercicios contados. Complejos y ecuaciones diferenciales
  caen los once años; Laplace diez; funciones reales, ninguno. Y cuarenta de los
  noventa y uno empiezan pidiendo un dibujo.
temas:
  - t01-complejos
  - t04-estudio-local
  - t05-integracion
  - t07-integral-multiple
  - t08-integral-curvilinea
  - t09-ecuaciones-diferenciales
  - t10-laplace
  - t11-fourier
medidoSobre: 11
criterioDeOrden: >-
  La ruta va partida en dos mitades porque el examen lo está: primer
  cuatrimestral —temas 1 a 5— y segundo —temas 6 a 11—, cada uno con su hoja y
  su nota. Dentro de cada mitad, los bloques van por rendimiento medido: primero
  el suelo, que aquí es dibujar —cuarenta de los noventa y un ejercicios lo
  piden, en las once convocatorias—, y después los huecos ordenados por cuántos
  años caen. Los enteros y el formulario van los últimos porque son repaso, no
  aprendizaje.

bloques:
  # ═══════════════════════════════════════════════════════════════════
  # SUELO
  # ═══════════════════════════════════════════════════════════════════
  - id: dibujar
    titulo: Dibujar, que es por donde empieza casi todo
    pide: >-
      «Representar geométricamente los afijos», «dibujar el sólido», «dibujar la
      función ampliada», «representar el recinto». Con esas palabras, y casi
      siempre en el apartado a).
    porque: >-
      **Cuarenta de los noventa y un ejercicios** de las once extraordinarias
      piden dibujar algo, y caen en **las once convocatorias**, en los dos
      cuatrimestrales por igual: diecinueve en el primero y veintiuno en el
      segundo. No es un adorno: del dibujo salen los límites de integración, la
      paridad de la función y el arco que resuelve un lugar geométrico. Si sale
      mal, sale mal el ejercicio entero; y si no sale, no hay por dónde empezar.
      Por eso va primero: no se examina solo, y sin él los otros bloques no se
      terminan a tiempo.
    invariante:
      anios: 11
      fuente: >-
        Contado sobre los noventa y un ejercicios de las once extraordinarias
        transcritas, buscando «dibujar», «representar» y «esbozar» en el
        enunciado y en el campo `pide`. Salen cuarenta, repartidos por los once
        años sin excepción.
    dominio: >-
      Que ante «representar el recinto», «dibujar el sólido» o «dibujar la
      ampliación» no te quedes mirando el papel. Un sólido de revolución se
      dibuja cortándolo por un plano que contiene el eje; una región del plano
      complejo se dibuja traduciendo la condición a una distancia; y una función
      periódica se dibuja un periodo y se copia a los lados.
    escalones:
      - id: la-region-del-plano-complejo
        titulo: La región, traducida a una distancia
        aprendes: >-
          Leer una condición sobre módulos o argumentos y dibujarla, sabiendo de
          antemano si va a salir una recta, una circunferencia, un arco o una
          cónica.
        dominio: >-
          Que ante $\left|z-a\right|=\left|z-b\right|$ escribas «mediatriz» sin
          pensar, y que ante un argumento constante escribas «arco» y sepas
          cuál de los dos arcos es antes de dibujarlo.
        teoria:
          tema: t01-complejos
          apartado: lugares-geométricos-traducir-la-condición-a-una-distancia
          nota: >-
            La tabla de traducciones del principio del apartado es lo que hay
            que llevar sabido: cada forma de la condición produce una figura, y
            son cinco.
        ejercicios:
          - id: ej-mediatriz-simple
            incrustado: true
            nota: >-
              El más corto de todos, y el que enseña el mecanismo: la condición
              se traduce, no se opera.
          - id: ex2425-ext-1-el-arco-capaz-de-noventa-grados
            nota: >-
              De 2024-2025. Un cociente con argumento recto, y sale media
              circunferencia: el caso que más ha caído.
          - id: ex1819-ext-1-el-arco-capaz-y-la-elipse-imposible
            nota: >-
              De 2018-2019, y trae de propina una condición que **no** define
              ninguna figura. Saber decir «esto está vacío» también puntúa.

      - id: el-solido-por-su-seccion
        titulo: El sólido, cortado por un plano que contiene el eje
        aprendes: >-
          Dibujar un sólido limitado por dos superficies en dos pasos: hallar
          dónde se cortan, y dibujar la sección que pasa por el eje.
        dominio: >-
          Que ante «dentro de la esfera y por encima del paraboloide» sepas
          escribir el radio de cada superficie en función de $z$, igualarlos, y
          dibujar el perfil con la altura del corte marcada. La perspectiva es
          opcional; la sección, no.
        teoria:
          tema: t07-integral-multiple
          apartado: el-recinto-manda-y-hay-que-dibujarlo
          nota: >-
            Habla de recintos planos, y un sólido de revolución es exactamente
            eso una vez cortado: el perfil es una región del plano, y de ahí
            salen los límites.
        ejercicios:
          - id: ej-recinto-y-limites
            incrustado: true
            nota: >-
              Empieza en el plano. Leer un recinto dibujado y escribir sus
              límites es la mitad de lo que luego hay que hacer en el espacio.
          - id: ex1213-ext-6-el-paraboloide-dentro-de-la-esfera
            nota: >-
              De 2012-2013, la más antigua. Paraboloide por debajo, esfera por
              arriba, y se cortan a la altura uno.
          - id: ex2425-ext-6-el-paraboloide-tapado-por-la-esfera
            nota: >-
              De 2024-2025, doce años después: **el mismo sólido con otros
              números**. Merece la pena hacerlos seguidos.

      - id: la-funcion-a-trozos
        titulo: La función periódica, y su ampliación
        aprendes: >-
          Dibujar una función definida a trozos, repetirla por periodicidad, y
          construir su ampliación par o impar cuando el enunciado la pide.
        dominio: >-
          Que dibujes un periodo entero y al menos uno a cada lado, con los
          saltos marcados. Y que al ampliar no dudes: la par refleja, la impar
          refleja **y** cambia de signo — y esa diferencia crea saltos donde
          antes no había.
        teoria:
          tema: t11-fourier
          apartado: la-ampliación-cuando-solo-te-dan-media-función
          nota: >-
            El dibujo y la paridad son la misma pregunta: en cuanto está
            dibujado se ve cuál es, y con eso se anula la mitad de los
            coeficientes sin integrar nada.
        ejercicios:
          - id: ej-ampliar-y-reducir
            incrustado: true
            nota: >-
              Ampliar media función y reducir un argumento grande, que son los
              dos apartados a) más frecuentes del bloque de Fourier.
          - id: ex2324-ext-10-la-ampliacion-impar-de-una-escalera
            nota: >-
              De 2023-2024. Una escalera de dos peldaños ampliada de forma
              impar: el dibujo se complica y el examen lo pide entero.
          - id: ex2425-ext-10-la-ampliacion-par-de-t-mas-pi
            nota: >-
              De 2024-2025, y la **par** de la misma familia. Los dos seguidos
              enseñan la diferencia mejor que ninguna explicación.

  # ═══════════════════════════════════════════════════════════════════
  # PRIMER CUATRIMESTRAL
  # ═══════════════════════════════════════════════════════════════════
  - id: complejos
    titulo: Complejos, el único hueco que no falta ni un año
    pide: >-
      Una ecuación con conjugado o con potencias, un lugar geométrico, un
      logaritmo o un seno de un número complejo. Siempre **un** ejercicio, y
      siempre el primero.
    porque: >-
      **Once ejercicios en once convocatorias: exactamente uno cada año, y
      siempre en el puesto 1.** No hay otro hueco en toda la asignatura del que
      se pueda decir eso. Vale entre siete y nueve puntos de COMP 2 sobre diez,
      así que es además el ejercicio más «de calcular» del primer cuatrimestral:
      quien lo lleva preparado se lleva una cuarta parte de la nota antes de
      empezar a pensar.
    invariante:
      anios: 11
      fuente: >-
        Contado uno a uno sobre los `examen.yaml` de las once extraordinarias:
        cada una tiene un ejercicio con `tema: t01-complejos` y ninguna tiene
        dos. La posición en el cuadernillo se ha leído del `fuente` de cada
        ejercicio.
    dominio: >-
      Que en veinte minutos resuelvas cualquiera de los once, y que ante uno
      nuevo sepas en qué familia cae antes de escribir nada: ecuación con
      conjugado, raíces n-ésimas, lugar geométrico, o exponencial y logaritmo.
    escalones:
      - id: ecuaciones-con-conjugado
        titulo: Ecuaciones con conjugado y con potencias
        aprendes: >-
          Resolver una ecuación compleja pasando a polar cuando hay potencias, y
          separando parte real e imaginaria cuando hay conjugados, sabiendo cuál
          de las dos vías toca.
        dominio: >-
          Que no pierdas la solución $z=0$, que es la que más se pierde, y que
          sepas decir cuántas soluciones tiene la ecuación **antes** de
          resolverla.
        teoria:
          tema: t01-complejos
          apartado: raíces-n-ésimas-cuántas-hay-y-por-qué-están-repartidas
          nota: >-
            La regla de cuántas hay y dónde están es lo que permite comprobar el
            resultado: si no salen repartidas por igual en una circunferencia,
            hay un error.
        ejercicios:
          - id: ej-polar-de-uno-mas-i
            incrustado: true
            nota: >-
              El paso previo. Si pasar a polar no es automático, el resto del
              bloque cuesta el triple.
          - id: ex2324-ext-1-cinco-soluciones-y-una-en-el-origen
            nota: >-
              De 2023-2024, y es el ejemplo de libro de la solución que se
              pierde: hay cinco y casi todo el mundo entrega cuatro.
          - id: ex2122-ext-1-tres-soluciones-y-un-triangulo
            nota: >-
              De 2021-2022. Las tres soluciones forman un triángulo equilátero,
              y decirlo es parte de la respuesta.

      - id: lugares-y-regiones
        titulo: Lugares geométricos, con su dibujo
        aprendes: >-
          Traducir una condición sobre $z$ en una ecuación en $x$ e $y$,
          reconocer la figura y dibujar solo el trozo que cumple la condición
          de signo.
        dominio: >-
          Que después de hallar la circunferencia sigas trabajando: casi siempre
          queda una condición de signo que selecciona **un arco**, y entregarla
          entera es lo que separa el siete del diez.
        teoria:
          tema: t01-complejos
          apartado: el-arco-capaz-y-cuándo-se-rompe-en-una-semirrecta
          nota: >-
            El caso que más cae, y el que tiene la letra pequeña: el argumento
            fija un arco, no la circunferencia entera.
        ejercicios:
          - id: ej-disco-y-borde
            incrustado: true
            nota: >-
              Decidir si el borde entra o no. Parece un detalle y es la mitad de
              los puntos de COMP 4 de este bloque.
          - id: ex1718-ext-1-el-circulo-y-la-mediatriz
            nota: >-
              De 2017-2018. Dos condiciones a la vez, y hay que quedarse con lo
              que cumple las dos.
          - id: ex2223-ext-1-un-seno-complejo-y-una-elipse
            nota: >-
              De 2022-2023, y engancha con el escalón siguiente: el seno de un
              complejo se calcula con exponenciales.

      - id: exponencial-logaritmo-y-seno
        titulo: Cuando la variable sube al exponente
        aprendes: >-
          Manejar $e^{z}$, $\log z$, $\operatorname{sen}z$ y $\cos z$ con
          números complejos, y entender por qué el logaritmo da infinitos
          valores y el coseno puede valer cinco.
        dominio: >-
          Que ante $\cos z=5$ no digas «imposible» sino que escribas la
          exponencial y resuelvas la ecuación de segundo grado que sale.
        teoria:
          tema: t01-complejos
          apartado: seno-y-coseno-definidos-con-exponenciales
          nota: >-
            Con la definición exponencial delante, un seno complejo deja de ser
            un objeto raro y pasa a ser una ecuación de segundo grado.
        ejercicios:
          - id: coseno-igual-a-cinco
            nota: >-
              El caso puro, del boletín. Si sale este, sale el de examen.
          - id: ex1617-ext-1-el-coseno-que-vale-cinco
            nota: >-
              De 2016-2017, y es el mismo problema con enunciado de examen y
              nueve puntos de COMP 2.
          - id: ex1516-ext-1-el-logaritmo-que-sale-real
            nota: >-
              De 2015-2016. El logaritmo con su infinitud de valores, y la
              condición que selecciona los que valen.

  # ─────────────────────────────────────────────────────────────────────
  - id: optimizar
    titulo: El máximo y el mínimo, que es el ejercicio con más puntos de cálculo
    pide: >-
      «Calcular las dimensiones de forma que el área sea máxima», «hallar el
      rectángulo de área máxima», «minimizar el material». Un enunciado con
      geometría dentro y una restricción que hay que encontrar.
    porque: >-
      **Once ejercicios en ocho de las once convocatorias**, y son los que más
      puntos de COMP 2 reparten del primer cuatrimestral: siete u ocho sobre
      diez. Es también el hueco con el reparto más desequilibrado que existe —
      el de 2018-2019 vale 0/8/2 y el de 2021-2022, 1/8/1 —: aquí no se pide
      demostrar nada, se pide llegar al número.
    invariante:
      anios: 8
      fuente: >-
        Contado buscando «máximo», «mínimo» y «extremo» en los enunciados de los
        cuarenta y cuatro ejercicios de los primeros cuatrimestrales. Salen
        once, en ocho convocatorias distintas. Dos de ellos no son de optimizar
        sino de justificar por qué la derivada se anula en un extremo, y se han
        dejado dentro a propósito: son la misma herramienta vista del revés.
    dominio: >-
      Que ante un enunciado de tres líneas con una figura dentro escribas en
      menos de cinco minutos la función a optimizar y la restricción que la
      reduce a una variable. Esa traducción es el ejercicio; lo que viene
      después es derivar.
    escalones:
      - id: traducir-antes-de-derivar
        titulo: Traducir el enunciado, que es donde se gana o se pierde
        aprendes: >-
          Convertir un enunciado con geometría en una función de una sola
          variable: nombrar las incógnitas, escribir lo que se optimiza,
          escribir la restricción y sustituir.
        dominio: >-
          Que escribas siempre el dominio de la variable —de dónde a dónde puede
          ir— y que compruebes los extremos del intervalo además del punto
          crítico. El máximo en un extremo es el caso que más se olvida.
        teoria:
          tema: t04-estudio-local
          apartado: optimizar-es-traducir-no-derivar
          nota: >-
            El apartado entero está escrito alrededor de la idea de que derivar
            es la parte fácil, y de que el orden —incógnitas, objetivo,
            restricción, dominio— evita el noventa por ciento de los fallos.
        ejercicios:
          - id: ej-optimizar-rectangulo
            incrustado: true
            nota: >-
              La restricción está a la vista, así que solo se practica la
              traducción. Es el escalón de entrada del bloque.
          - id: rectangulo-bajo-la-parabola
            nota: >-
              Del boletín, y el mismo problema que cayó en 2018-2019: hacerlo
              antes que el de examen ahorra tiempo.
          - id: ex1819-ext-3-el-rectangulo-inscrito-en-la-parabola
            nota: >-
              De 2018-2019, 0/8/2. El reparto dice todo lo que hay que saber
              sobre qué se puntúa aquí.

      - id: los-que-vienen-disfrazados
        titulo: Los que vienen disfrazados de otra cosa
        aprendes: >-
          Reconocer un problema de optimización cuando el enunciado habla de
          alambres, ventanas, pórticos o chapas, y decidir qué variable conviene
          usar cuando hay dos candidatas.
        dominio: >-
          Que la respuesta no dependa de un dato que el enunciado no da. En
          varios de estos ejercicios el resultado es una **proporción** —la
          ventana de 2023-2024, sin ir más lejos— y el perímetro se cancela: si
          te queda dentro, hay un error.
        teoria:
          tema: t04-estudio-local
          apartado: crecer-y-curvarse-lo-que-dicen-la-primera-y-la-segunda-derivada
          nota: >-
            Para justificar que el punto crítico es máximo y no mínimo, que es
            lo que piden los dos puntos de COMP 4 de estos ejercicios.
        ejercicios:
          - id: canal-de-capacidad-maxima
            nota: >-
              Del boletín. La variable buena es un ángulo, y elegirla mal
              triplica la cuenta.
          - id: ex2324-ext-4-la-ventana-con-el-remate-semicircular
            nota: >-
              De 2023-2024, y el de la proporción que no depende del perímetro.
          - id: ex2425-ext-4-el-alambre-partido-en-dos
            nota: >-
              De 2024-2025. Un alambre, un cuadrado y un triángulo — y ya había
              caído en la segunda evaluación de 2023-2024.

  # ─────────────────────────────────────────────────────────────────────
  - id: la-integral-como-funcion
    titulo: La integral que no se sabe hacer, y que hay que estudiar igual
    pide: >-
      «Sin calcular la integral, hallar el polinomio de McLaurin», «estudiar la
      función definida por la integral», «hallar sus extremos». Con una integral
      de extremo variable y un integrando sin primitiva elemental.
    porque: >-
      **Cinco ejercicios en cinco convocatorias**, y todos de los últimos años:
      2020-2021, 2021-2022, 2022-2023, 2023-2024 y 2024-2025. Es el hueco que
      **está creciendo**, cinco años seguidos, y es también el que mejor separa
      a quien ha entendido el teorema fundamental de quien se lo sabe de
      memoria: no se puede resolver calculando.
    invariante:
      anios: 5
      fuente: >-
        Contado buscando integrales con extremo superior variable en los
        enunciados de los primeros cuatrimestrales. Son cinco, uno por año desde
        2020-2021, y ninguno antes. La lectura de que forman un mismo hueco es
        nuestra: los cinco piden derivar sin integrar y cuatro piden además el
        polinomio de Taylor.
    dominio: >-
      Que ante $F\left(x\right)=\int_{0}^{x}g$ escribas $F'=g$ sin pensarlo, y
      que sepas seguir: la segunda derivada, los extremos y el polinomio de
      Taylor salen todos de ahí sin calcular ni una primitiva.
    escalones:
      - id: derivar-sin-integrar
        titulo: Derivar una integral sin calcularla
        aprendes: >-
          Aplicar el teorema fundamental a una función definida por una integral
          de extremo variable, incluida la versión con el extremo compuesto.
        dominio: >-
          Que compruebes siempre la hipótesis —el integrando continuo— y que la
          escribas: es la mitad de los puntos de COMP 4 de estos ejercicios y
          se tarda una línea.
        teoria:
          tema: t05-integracion
          apartado: el-teorema-fundamental-en-sus-dos-mitades
          nota: >-
            Las dos mitades son cosas distintas y se confunden: una deriva una
            integral, la otra evalúa una integral definida. Aquí hace falta la
            primera.
        ejercicios:
          - id: ej-derivar-funcion-integral
            incrustado: true
            nota: >-
              Tres líneas y ninguna integral. Es el escalón de entrada del
              bloque entero.
          - id: derivar-sin-integrar
            nota: >-
              Seis derivadas del boletín, incluidas las de extremo compuesto,
              que es donde aparece la regla de la cadena.
          - id: ex2425-ext-3-una-arcotangente-disfrazada-de-integral
            nota: >-
              De 2024-2025. Estudia entera una función que solo se conoce como
              integral: dominio, crecimiento, extremos y asíntotas.

      - id: el-polinomio-de-la-integral
        titulo: El polinomio de Taylor de algo que no tiene primitiva
        aprendes: >-
          Calcular el desarrollo de McLaurin de una función definida por una
          integral, por los dos caminos: derivando la función, o desarrollando
          el integrando e integrando término a término.
        dominio: >-
          Que sepas hacerlo por los dos caminos y elegir el corto. Desarrollar
          el integrando y luego integrar es casi siempre la mitad de trabajo, y
          casi nadie lo usa.
        teoria:
          tema: t04-estudio-local
          apartado: el-polinomio-de-taylor-es-la-mejor-imitación-local
          nota: >-
            Y de ahí, los seis desarrollos memorizados del apartado siguiente:
            con ellos, integrar término a término es cuestión de un minuto.
        ejercicios:
          - id: maclaurin-sin-integrar
            nota: >-
              Dos polinomios de McLaurin sin calcular la integral, del boletín.
              El entrenamiento directo.
          - id: ex2021-ext-3-el-mclaurin-de-una-integral-sin-primitiva
            nota: >-
              De 2020-2021, el primero de la serie.
          - id: ex2324-ext-3-mclaurin-de-la-campana-al-reves
            nota: >-
              De 2023-2024, con la campana de Gauss: el integrando sin primitiva
              por excelencia. Y el mismo problema estaba en la tercera
              evaluación de 2020-2021.

  # ─────────────────────────────────────────────────────────────────────
  - id: areas-y-volumenes
    titulo: Áreas, volúmenes y algún perímetro
    pide: >-
      «Calcular el área del recinto», «el volumen del sólido que engendra al
      girar», «el perímetro». Con dos curvas que se cortan, o una curva y sus
      tangentes.
    porque: >-
      **Doce ejercicios en nueve de las once convocatorias**, y es el hueco que
      comparte sitio con el de optimizar en el primer cuatrimestral. Casi todos
      reparten siete u ocho puntos de cálculo, y en cinco de ellos el recinto
      viene definido por una curva **y su tangente**, que es la variante que
      obliga a hallar la tangente antes de poder integrar nada.
    invariante:
      anios: 9
      fuente: >-
        Contado sobre los ejercicios con `tema: t05-integracion` de los primeros
        cuatrimestrales de las once extraordinarias: son doce, en nueve
        convocatorias. Faltan 2017-2018 y 2021-2022, los dos años en que el
        primer cuatrimestral fue entero de estudio local.
    dominio: >-
      Que dibujes el recinto antes de escribir la integral, siempre, y que ante
      un giro sepas decidir entre discos y capas en función de alrededor de qué
      eje se gira — no de cuál te resulte más familiar.
    escalones:
      - id: el-area-entre-curvas
        titulo: El área entre dos curvas, y cuándo conviene integrar en y
        aprendes: >-
          Hallar los cortes, decidir cuál es la curva de arriba, y elegir la
          variable de integración que evita partir el recinto en trozos.
        dominio: >-
          Que ante una parábola tumbada no integres en $x$ por costumbre:
          integrar en $y$ convierte dos integrales en una.
        teoria:
          tema: t05-integracion
          apartado: áreas-y-volúmenes-el-mismo-esquema
          nota: >-
            El esquema es uno solo —cortes, quién está encima, integrar la
            diferencia— y sirve igual para áreas y para volúmenes.
        ejercicios:
          - id: ej-area-entre-curvas
            incrustado: true
            nota: >-
              Dos parábolas y nada más. Es el escalón de entrada.
          - id: parabola-tumbada
            nota: >-
              Del boletín, y el caso que enseña por qué a veces se integra en
              $y$.
          - id: ex2324-ext-5-la-parabola-y-su-tangente-de-pendiente-ocho
            nota: >-
              De 2023-2024. Hay que hallar la tangente antes de tener el
              recinto, que es la variante que más cae.

      - id: el-volumen-al-girar
        titulo: El volumen que engendra al girar
        aprendes: >-
          Calcular un volumen de revolución por discos o por capas, y reconocer
          cuál de los dos métodos deja la integral más corta.
        dominio: >-
          Que ante un giro alrededor de $OY$ no despejes por costumbre: el
          método de capas evita despejar, y ese es el caso que de verdad cae.
        teoria:
          tema: t05-integracion
          apartado: girar-alrededor-de-oy-que-es-el-caso-que-de-verdad-cae
          nota: >-
            Escrito precisamente porque es el que sale en el examen y el que
            los libros tratan de pasada.
        ejercicios:
          - id: ej-volumen-por-discos
            incrustado: true
            nota: >-
              El caso más simple, alrededor de $OX$, para fijar la fórmula.
          - id: ex2021-ext-4-la-recta-la-hiperbola-y-la-arandela
            nota: >-
              De 2020-2021. Al girar queda un agujero, y hay que restar dos
              volúmenes.
          - id: ex2425-ext-5-el-sector-que-gira-alrededor-del-eje
            nota: >-
              De 2024-2025, y pide además el perímetro: dos apartados con la
              misma figura y dos técnicas distintas.

  # ═══════════════════════════════════════════════════════════════════
  # SEGUNDO CUATRIMESTRAL
  # ═══════════════════════════════════════════════════════════════════
  - id: edo
    titulo: La ecuación diferencial, que tampoco falta ni un año
    pide: >-
      «Resolver la EDO», «clasificar y resolver», «hallar la solución que
      cumple». A veces con el factor integrante dado, a veces con la forma del
      factor y hay que encontrarlo.
    porque: >-
      **Once ejercicios en once convocatorias.** Junto con complejos, es el
      único hueco de toda la asignatura que cae los once años, y aquí manda
      todavía más: en el segundo cuatrimestral, con solo cuatro huecos, la EDO
      ocupa uno fijo. Seis de los once son exactas o llevan factor integrante —
      la familia que más cae, con diferencia.
    invariante:
      anios: 11
      fuente: >-
        Contado sobre los `examen.yaml`: cada una de las once extraordinarias
        tiene exactamente un ejercicio con `tema: t09-ecuaciones-diferenciales`.
        El recuento de «seis exactas o con factor integrante» sale de leer los
        once enunciados, y es una lectura nuestra, no un campo del dato.
    dominio: >-
      Que clasifiques cualquier EDO de primer orden en menos de un minuto
      —separable, homogénea, exacta, lineal— y que ante una exacta sepas hallar
      el potencial sin dudar del orden de los pasos.
    escalones:
      - id: clasificar-primero
        titulo: Clasificar, que decide todo lo demás
        aprendes: >-
          Mirar una EDO de primer orden y decir a qué familia pertenece antes de
          intentar resolverla, comprobando la condición que define cada una.
        dominio: >-
          Que ante tres ecuaciones sepas decir cuál es cuál sin resolver
          ninguna. Dos de las once convocatorias piden literalmente eso, y es la
          mitad de los puntos.
        teoria:
          tema: t09-ecuaciones-diferenciales
          apartado: lo-primero-es-clasificar-y-eso-decide-todo
          nota: >-
            Las cuatro familias, con la comprobación de cada una. El orden en
            que se prueban importa: exacta antes que lineal ahorra trabajo.
        ejercicios:
          - id: ej-clasificar-cuatro-edos
            incrustado: true
            nota: >-
              Cuatro ecuaciones y ninguna que resolver. Exactamente el apartado
              a) que piden dos extraordinarias.
          - id: ex2324-ext-8-clasificar-tres-y-resolver-la-exacta
            nota: >-
              De 2023-2024. Tres ecuaciones, tres etiquetas, y solo una que
              resolver.
          - id: ex2122-ext-6-una-exacta-entre-tres
            nota: >-
              De 2021-2022, el mismo formato dos años antes. Los dos juntos
              dejan claro que no es casualidad.

      - id: exactas-y-el-factor
        titulo: Exactas, y el factor integrante que las hace exactas
        aprendes: >-
          Comprobar si una ecuación es exacta, hallar el potencial, y encontrar
          el factor integrante cuando no lo es — incluidos los casos en que el
          enunciado solo da su **forma**.
        dominio: >-
          Que ante «utilizar un factor integrante de la forma $x^{n}y^{m}$»
          sepas plantear las ecuaciones que determinan $n$ y $m$, y no solo
          comprobar uno que te den hecho.
        teoria:
          tema: t09-ecuaciones-diferenciales
          apartado: exactas-y-el-factor-integrante
          nota: >-
            Con los dos casos estándar —factor que depende solo de $x$ y factor
            que depende solo de $y$— y la comprobación que los detecta.
        ejercicios:
          - id: ej-separable-basica
            incrustado: true
            nota: >-
              La más simple de todas, para tener el mecanismo de integrar los
              dos lados antes de complicarlo.
          - id: ex1516-ext-5-el-factor-integrante-exponencial
            nota: >-
              De 2015-2016, con el factor **dado**: solo hay que comprobarlo y
              usarlo.
          - id: ex1213-ext-5-el-factor-de-potencias-y-el-cadaver
            nota: >-
              De 2012-2013, y sube el listón: da la forma $x^{n}y^{m}$ y hay que
              hallar los exponentes. Trae además un problema de enfriamiento.

  # ─────────────────────────────────────────────────────────────────────
  - id: laplace
    titulo: Laplace, y casi siempre un sistema
    pide: >-
      «Utilizando la transformada de Laplace, resolver». Un sistema de dos
      ecuaciones, una ecuación con la incógnita dentro de una integral, o una
      con el segundo miembro definido a trozos.
    porque: >-
      **Diez ejercicios en diez de las once convocatorias** — solo falta en
      2013-2014. Y no cae de cualquier manera: **cinco de los diez son
      sistemas** de dos ecuaciones acopladas, que es justo lo que los métodos
      del tema 9 no alcanzan. Tres más son ecuaciones con una integral dentro.
      Saber la tabla no basta; hay que saber para qué compensa el rodeo.
    invariante:
      anios: 10
      fuente: >-
        Contado sobre los `examen.yaml`: diez de las once extraordinarias tienen
        un ejercicio con `tema: t10-laplace`. El desglose en cinco sistemas y
        tres ecuaciones integrales sale de leer los diez enunciados, y es
        lectura nuestra.
    dominio: >-
      Que ante un sistema de dos EDOs acopladas transformes las dos, despejes
      una incógnita del sistema algebraico y antitransformes, sin perder las
      condiciones iniciales por el camino. Y que reconozcas una convolución
      cuando la veas escrita como integral.
    escalones:
      - id: ida-y-vuelta
        titulo: La ida y la vuelta, que es todo el método
        aprendes: >-
          Transformar una ecuación con sus condiciones iniciales, despejar
          $Y\left(s\right)$, y volver descomponiendo en fracciones simples.
        dominio: >-
          Que la vuelta no te frene. Descomponer en fracciones simples con polos
          simples se hace evaluando en cada raíz, y con polos dobles aparece un
          factor $t$: esos dos casos cubren casi todo lo que cae.
        teoria:
          tema: t10-laplace
          apartado: volver-la-inversa-por-fracciones-simples
          nota: >-
            La vuelta es donde se atasca todo el mundo, y el apartado está
            escrito alrededor de eso.
        ejercicios:
          - id: ej-inversa-fracciones-simples
            incrustado: true
            nota: >-
              Solo la vuelta, sin ecuación. Para separar las dos dificultades.
          - id: ex1213-ext-7-la-antitransformada-por-dos-caminos
            nota: >-
              De 2012-2013. Pide la misma antitransformada de dos formas
              distintas: traslación y convolución.
          - id: ex2021-ext-8-laplace-con-termino-constante
            nota: >-
              De 2020-2021, y el más directo de los diez: transformar, despejar,
              volver.

      - id: el-sistema-acoplado
        titulo: El sistema de dos ecuaciones, que es lo que más cae
        aprendes: >-
          Resolver un sistema de dos EDOs acopladas con Laplace: transformar las
          dos, resolver el sistema algebraico en $s$, y antitransformar cada
          incógnita.
        dominio: >-
          Que sepas cuándo una de las dos incógnitas sale sola —pasa en tres de
          los cinco sistemas— y que no resuelvas el sistema entero por
          costumbre cuando basta con eliminar una.
        teoria:
          tema: t10-laplace
          apartado: para-qué-compensa-de-verdad
          nota: >-
            La lista de casos en que Laplace gana, y el sistema acoplado es el
            primero de ellos.
        ejercicios:
          - id: sistema-de-edos-con-laplace
            nota: >-
              Del boletín, el caso limpio. Hacerlo antes que los de examen
              ahorra la mitad del tiempo.
          - id: ex1819-ext-8-el-sistema-que-sale-en-espiral
            nota: >-
              De 2018-2019. Las raíces salen complejas y la solución gira: hay
              que saber leer eso en el resultado.
          - id: ex2122-ext-7-el-sistema-acoplado-por-laplace
            nota: >-
              De 2021-2022. Dos ecuaciones que se persiguen, resueltas de un
              tirón.

      - id: la-integral-dentro
        titulo: Cuando la incógnita está dentro de una integral
        aprendes: >-
          Reconocer una ecuación integral o íntegro-diferencial, transformarla
          usando que $\int_{0}^{t}$ divide entre $s$, y volver.
        dominio: >-
          Que no confundas las dos reglas: derivar multiplica por $s$ e integrar
          divide entre $s$. Y que reconozcas una convolución cuando el
          integrando lleva $t-u$ dentro.
        teoria:
          tema: t10-laplace
          apartado: el-rodeo-que-es-la-idea-entera
          nota: >-
            La idea de por qué el rodeo funciona: derivar e integrar se
            convierten en multiplicar y dividir, y eso es lo que hace que estas
            ecuaciones se vuelvan álgebra.
        ejercicios:
          - id: ecuacion-integral-convolucion
            nota: >-
              Del boletín, con la convolución explícita.
          - id: ex1516-ext-6-la-ecuacion-integral-por-convolucion
            nota: >-
              De 2015-2016, y el mismo problema volvió a caer en la
              extraordinaria de 2022-2023: dos de once, palabra por palabra.
          - id: ex2223-ext-7-la-ecuacion-integral-del-seno
            nota: >-
              De 2022-2023, el gemelo del anterior. Vale la pena hacerlos
              seguidos y ver que son el mismo.

  # ─────────────────────────────────────────────────────────────────────
  - id: el-solido
    titulo: El sólido, su volumen y su centro de gravedad
    pide: >-
      «Calcular el volumen del sólido definido por las condiciones», y muy a
      menudo «y su centro de gravedad». Con dos superficies que se cortan.
    porque: >-
      **Nueve ejercicios en nueve de las once convocatorias**, y hay un patrón
      que ahorra medio bloque: **cuatro de los nueve son un cilindro dentro de
      una esfera** y tres más son un paraboloide con una tapa. Cambian los
      números, no el procedimiento. Y en cinco de los nueve se pide además el
      centro de gravedad, que es una integral más con el mismo recinto.
    invariante:
      anios: 9
      fuente: >-
        Contado sobre los `examen.yaml`: nueve de las once extraordinarias
        tienen un ejercicio con `tema: t07-integral-multiple`. Faltan 2018-2019
        y 2021-2022. La agrupación en «cilindro dentro de esfera» y «paraboloide
        con tapa» es lectura nuestra, hecha leyendo los nueve enunciados.
    dominio: >-
      Que ante dos superficies escribas la altura del corte y el radio en tres
      líneas, elijas cilíndricas sin dudar, y sepas que el centro de gravedad
      son las mismas integrales con un factor más — no un problema nuevo.
    escalones:
      - id: que-coordenadas
        titulo: Qué coordenadas elegir, y el jacobiano que traen
        aprendes: >-
          Decidir entre cartesianas, cilíndricas y esféricas mirando la forma
          del sólido, y escribir el jacobiano correspondiente sin consultarlo.
        dominio: >-
          Que ante un sólido de revolución escribas cilíndricas por defecto, y
          que solo pases a esféricas cuando la esfera manda en los dos límites.
          El jacobiano mal puesto invalida la integral entera.
        teoria:
          tema: t07-integral-multiple
          apartado: integrales-triples-y-qué-coordenadas-elegir
          nota: >-
            Con la regla de decisión y los tres jacobianos, que son lo que hay
            que llevar de memoria.
        ejercicios:
          - id: ej-polares-primera
            incrustado: true
            nota: >-
              La primera en polares, con el jacobiano a la vista. En tres
              dimensiones es lo mismo con una variable más.
          - id: cilindricas-o-esfericas
            nota: >-
              Del boletín: el mismo sólido en los dos sistemas, para ver cuál
              deja la integral más corta.
          - id: ex2021-ext-5-el-cilindro-dentro-de-la-esfera
            nota: >-
              De 2020-2021, y el mismo sólido cayó en 2016-2017. Cuatro de las
              nueve convocatorias piden esta figura.

      - id: el-centro-de-gravedad
        titulo: El centro de gravedad, que es la misma integral con un factor
        aprendes: >-
          Calcular el centro de gravedad de un sólido, usando la simetría para
          no calcular las coordenadas que ya se saben.
        dominio: >-
          Que digas «por simetría, $\overline{x}=\overline{y}=0$» y lo
          justifiques en una línea antes de calcular la única coordenada que
          falta. Y que compruebes que el resultado cae dentro del sólido.
        teoria:
          tema: t07-integral-multiple
          apartado: para-qué-sirve-todo-esto
          nota: >-
            Masa, centro de gravedad y momento de inercia son la misma integral
            con distinta función dentro, y verlo así ahorra memorizar tres
            fórmulas.
        ejercicios:
          - id: centro-de-gravedad-elipse
            nota: >-
              En el plano, que es donde se entiende. En el espacio es igual con
              una integral más.
          - id: ex1718-ext-5-el-paraboloide-con-tapa-de-cono
            nota: >-
              De 2017-2018. Volumen y centro de gravedad del mismo sólido, que
              es el formato más frecuente.
          - id: ex2324-ext-6-el-cuenco-rematado-en-punta-a-la-altura-dos
            nota: >-
              De 2023-2024, la misma figura con otros números. Si has hecho el
              anterior, este sale en la mitad de tiempo.

  # ─────────────────────────────────────────────────────────────────────
  - id: curvilinea
    titulo: La integral de línea, y el atajo que casi siempre existe
    pide: >-
      «Calcular la integral de línea», «calcular el trabajo», «de dos formas
      distintas». Con una curva cerrada, o con un campo del que hay que decidir
      si es conservativo.
    porque: >-
      **Ocho ejercicios en ocho de las once convocatorias**, y el enunciado casi
      siempre esconde un atajo: o el campo es conservativo y solo importan los
      extremos, o la curva es cerrada y Green convierte la integral de línea en
      una integral doble. **Tres de los ocho piden explícitamente «de dos formas
      distintas»**, que es el examen diciendo en voz alta que el atajo existe y
      que quiere verlo.
    invariante:
      anios: 8
      fuente: >-
        Contado sobre los `examen.yaml`: ocho de las once extraordinarias tienen
        un ejercicio con `tema: t08-integral-curvilinea`. Faltan 2013-2014,
        2017-2018 y 2022-2023. El «tres piden dos formas» sale de buscar esa
        expresión en los ocho enunciados.
    dominio: >-
      Que antes de parametrizar nada compruebes si el campo es conservativo, y
      que ante una curva cerrada mires si Green se puede aplicar — y sepas decir
      **por qué no** cuando no se puede, que es el caso que más puntos de COMP 4
      reparte.
    escalones:
      - id: conservativo-o-no
        titulo: 'Lo primero: ¿es conservativo?'
        aprendes: >-
          Comprobar si un campo deriva de un potencial, encontrarlo cuando lo
          hace, y usarlo para que la integral dependa solo de los extremos.
        dominio: >-
          Que la comprobación sea automática y que no te saltes la hipótesis del
          dominio: un campo puede cumplir $P_{y}=Q_{x}$ y **no** ser
          conservativo si el recinto tiene un agujero.
        teoria:
          tema: t08-integral-curvilinea
          apartado: el-atajo-grande-campos-conservativos
          nota: >-
            Con la comprobación, la construcción del potencial y la advertencia
            del dominio, que es la que decide dos de los ocho ejercicios.
        ejercicios:
          - id: ej-conservativo-o-no
            incrustado: true
            nota: >-
              Solo la comprobación, sin integrar nada. Es el escalón de entrada.
          - id: tres-caminos-mismo-trabajo
            nota: >-
              Del boletín. Tres curvas distintas entre los mismos puntos, y una
              sola cuenta.
          - id: ex2425-ext-8-dos-caminos-y-cual-da-mas-trabajo
            nota: >-
              De 2024-2025, y el que enseña lo contrario: cuando el campo **no**
              es conservativo, el camino sí importa.

      - id: green-y-cuando-no-vale
        titulo: Green, y cuándo no se puede aplicar
        aprendes: >-
          Convertir una integral sobre una curva cerrada en una integral doble,
          y reconocer las dos situaciones en que el teorema no vale: una
          singularidad dentro, o una curva que no es simple.
        dominio: >-
          Que ante un campo irrotacional con una singularidad dentro no
          escribas «cero» automáticamente. Es la trampa que dos de los ocho
          ejercicios ponen a propósito, y cae casi todo el mundo.
        teoria:
          tema: t08-integral-curvilinea
          apartado: green-cuando-la-curva-se-cierra
          nota: >-
            Con las hipótesis escritas aparte, porque son ellas y no la fórmula
            lo que estos ejercicios evalúan.
        ejercicios:
          - id: green-que-no-se-puede-aplicar
            nota: >-
              Del boletín, y va directo al caso difícil.
          - id: ex1516-ext-4-el-agujero-que-rompe-green
            nota: >-
              De 2015-2016. Rotacional nulo, singularidad dentro, y el resultado
              es $2\pi$: no cero.
          - id: ex1213-ext-8-el-campo-con-dos-rectas-prohibidas
            nota: >-
              De 2012-2013, y es el más incómodo de los ocho: aplicar Green a lo
              bruto da el resultado correcto **por casualidad**, y hay que
              explicar por qué eso no lo valida.

  # ─────────────────────────────────────────────────────────────────────
  - id: fourier
    titulo: Fourier, con su ampliación y su suma de regalo
    pide: >-
      «Obtener la ampliación par o impar», «dibujar la función ampliada»,
      «calcular la serie», «calcular los valores de $S$ y de $f$ en estos
      puntos», «calcular la suma de la serie». Cinco apartados encadenados.
    porque: >-
      **Seis ejercicios en seis de las once convocatorias** — el hueco más
      irregular del segundo cuatrimestral, pero el que más puntos da por hora
      estudiada cuando cae, porque los cinco apartados son siempre los mismos
      cinco. Y el último, la suma de una serie numérica, sale gratis del
      anterior: **cuatro de los seis terminan en la serie de Leibniz o una
      pariente**.
    invariante:
      anios: 6
      fuente: >-
        Contado sobre los `examen.yaml`: seis de las once extraordinarias tienen
        un ejercicio con `tema: t11-fourier`. La observación de que los cinco
        apartados se repiten, y de que cuatro terminan en una serie alternada de
        inversos, sale de leer los seis enunciados.
    dominio: >-
      Que hagas los cinco apartados en orden sin pararte a decidir qué toca, y
      que el quinto —la suma de la serie— lo saques evaluando la serie en un
      punto que ya has calculado, no volviendo a empezar.
    escalones:
      - id: paridad-y-coeficientes
        titulo: La paridad primero, y luego los coeficientes
        aprendes: >-
          Decidir la paridad de la función ampliada antes de integrar, y con eso
          anular la mitad de los coeficientes sin hacer ninguna cuenta.
        dominio: >-
          Que ante una ampliación impar escribas «$a_{n}=0$ para todo $n$» y
          sigas, sin comprobarlo integrando. Y que sepas qué periodo va en la
          fórmula, que es donde se cuelan los errores de factor dos.
        teoria:
          tema: t11-fourier
          apartado: mirar-la-paridad-antes-de-integrar
          nota: >-
            Es el primer apartado del tema por la misma razón por la que es el
            primer paso del ejercicio: ahorra la mitad del trabajo.
        ejercicios:
          - id: ej-paridad-antes-de-integrar
            incrustado: true
            nota: >-
              Dos funciones, dos casos opuestos, y ninguna integral.
          - id: ampliacion-impar-de-una-recta
            nota: >-
              Del boletín, y el caso que más cae: una recta ampliada de forma
              impar.
          - id: ex1718-ext-8-la-rampa-y-la-serie-de-leibniz
            nota: >-
              De 2017-2018, y trae los cinco apartados completos, con Leibniz al
              final.

      - id: dirichlet-y-la-suma
        titulo: Dirichlet en los saltos, y la suma que sale de ahí
        aprendes: >-
          Decir a qué converge la serie en cada punto —incluidos los saltos que
          la propia ampliación ha creado— y usar ese valor para sumar una serie
          numérica.
        dominio: >-
          Que ante un salto escribas la media de los dos límites laterales sin
          dudar, y que ante «calcular la suma de la serie» busques el punto
          donde evaluar en vez de intentar sumarla directamente.
        teoria:
          tema: t11-fourier
          apartado: el-apartado-que-sorprende-sumar-una-serie-numérica
          nota: >-
            El mecanismo es siempre el mismo: se evalúa la serie en un punto
            elegido, se iguala al valor que da Dirichlet, y se despeja.
        ejercicios:
          - id: ej-dirichlet-en-el-salto
            incrustado: true
            nota: >-
              Un salto y su media. Tres líneas, y es la mitad de los puntos de
              COMP 4 del bloque.
          - id: dirichlet-en-cinco-puntos
            nota: >-
              Del boletín. Cinco puntos, y hay que decidir uno a uno si la
              función es continua ahí.
          - id: ex2324-ext-10-la-ampliacion-impar-de-una-escalera
            nota: >-
              De 2023-2024, con los cinco apartados y una escalera de dos
              peldaños: el más completo de los seis.

  # ═══════════════════════════════════════════════════════════════════
  # CIERRE
  # ═══════════════════════════════════════════════════════════════════
  - id: enteros
    titulo: Hacer una extraordinaria entera, con reloj
    pide: >-
      El examen completo: cuatro o cinco ejercicios, cuarenta o cincuenta
      puntos, dos horas y sin calculadora.
    porque: >-
      Los bloques anteriores entrenan herramientas sueltas. Un examen entero
      entrena otra cosa: **repartir el tiempo**. Con cuatro ejercicios y dos
      horas salen treinta minutos por ejercicio, y quien se atasca en el primero
      pierde los otros tres. Va aquí porque no enseña nada nuevo: mide.
    dominio: >-
      Terminar una extraordinaria completa en el tiempo, con el dibujo hecho en
      los que lo piden y sin dejar ningún apartado de justificación en blanco.
      Si un ejercicio te lleva más de cuarenta minutos, la cuenta que no sale es
      la del reloj.
    material:
      - tipo: examen
        curso: '2024-2025'
        convocatoria: extraordinaria
        nota: >-
          La más reciente, y del formato de diez ejercicios: cinco y cincuenta
          cada cuatrimestral. Es el formato que se lleva usando desde 2023-2024.
      - tipo: examen
        curso: '2021-2022'
        convocatoria: extraordinaria
        nota: >-
          Del formato de ocho, cuatro y cuarenta por cuatrimestral, que es el
          que se usó once años seguidos. Su primer cuatrimestral es entero de
          estudio local: tres ejercicios del tema 4 de cuatro.
      - tipo: examen
        curso: '2015-2016'
        convocatoria: extraordinaria
        nota: >-
          El más corto del corpus, siete ejercicios, y el único con los dos
          cuatrimestrales de distinto tamaño junto con el de 2017-2018.
    falta:
      - >-
        No hay cronómetro ni corrección automática de un examen completo: se
        hace en papel y se compara con las resoluciones una a una. Es una
        limitación real de un sitio estático, y se dice en voz alta.

  # ─────────────────────────────────────────────────────────────────────
  - id: formulario
    titulo: Lo que hay que llevar sabido
    pide: >-
      El examen no deja formulario ni calculadora — está impreso en la cabecera
      de siete de los once cuadernillos. Los jacobianos, la tabla de
      transformadas y las fórmulas de los coeficientes hay que llevarlos en la
      cabeza.
    porque: >-
      Es lo que más se pierde por no saberlo de memoria y no se puede deducir en
      el momento: un jacobiano mal puesto invalida la integral entera, y un par
      de la tabla de Laplace confundido da una función distinta sin que nada
      avise. Va el último porque es repaso, no aprendizaje: es el bloque del
      rato de antes de entrar.
    dominio: >-
      Escribir de memoria y en papel las cinco traducciones de lugares
      geométricos, los tres jacobianos, los ocho pares de la tabla de Laplace y
      las tres fórmulas de los coeficientes de Fourier. Si tienes que mirar una
      sola vez, todavía no.
    material:
      - tipo: teoria
        tema: t01-complejos
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          Las traducciones de lugares geométricos y las fórmulas de De Moivre,
          que son las que abren el examen todos los años.
      - tipo: teoria
        tema: t04-estudio-local
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          Los seis desarrollos memorizados, sin los cuales el ejercicio de
          Taylor no cabe en el tiempo.
      - tipo: teoria
        tema: t07-integral-multiple
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          Los jacobianos de polares, cilíndricas y esféricas, y la regla de qué
          coordenadas elegir según la forma del sólido.
      - tipo: teoria
        tema: t10-laplace
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          La tabla, y los dos desplazamientos —el de $s$ y el de $t$— que se
          confunden entre sí.
      - tipo: teoria
        tema: t11-fourier
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          Las fórmulas de los coeficientes, la regla de Dirichlet y las cuatro
          sumas que salen de evaluar una serie en un punto.
    falta:
      - >-
        Las cinco listas son una segunda copia de cosas explicadas en los temas,
        y si un día se corrige la teoría y no se corrige aquí, esto miente. No
        hay ningún guardián que lo compruebe, y por eso se dice.
      - >-
        No se puede imprimir solo el formulario: cada lista vive al final de la
        página de su tema, así que imprimir arrastra el tema entero.
