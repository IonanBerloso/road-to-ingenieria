# La ruta del control del bloque 1 de Expresión Gráfica, el diédrico, medida
# sobre lo único de examen que trae el material: las cuatro hojas sin fecha con
# que cierra la colección, los Ejercicios 52 a 55 (págs. 53 a 66 del PDF). No
# hay ninguna convocatoria con fecha del bloque 1.
#
# QUÉ SE HA CONTADO. Las hojas imprimen 13 apartados (4 + 3 + 3 + 3), y el sitio
# los resuelve en 17 piezas, cada una con su tema en su `examen.yaml`. La ruta
# cuenta sobre las 17 piezas, y `medidoSobre` es 4 porque el esquema cuenta
# convocatorias y aquí lo que hace de convocatoria son las cuatro hojas. Cada
# cifra sale de `cuenta-hojas.mjs`, en la carpeta de la unidad k-ruta-b1, que
# lleva la tabla de qué construcción pide cada pieza con la frase del enunciado
# que la sostiene, y comprueba que la frase está:
#
#   construcción                     piezas  hojas   temas de sus piezas
#   la perpendicular a un plano ....... 7     3      t05
#   la figura plana ................... 6     4      t02 t03 t04 t05
#   los ángulos ....................... 4     4      t06
#   dos rectas que se cruzan .......... 3     3      t05
#   las intersecciones ................ 2     2      t04
#
# Una pieza puede pedir dos construcciones (la 55.1 c-d pide la perpendicular
# en su c y las rectas que se cruzan en su d). Por tema, que es el dato del
# `examen.yaml`: t05 9, t06 4, t04 2, t03 1, t02 1, t01 0.
#
# EL ORDEN: por piezas, con una excepción que marcan las hojas (la figura plana
# delante de la perpendicular, porque cuatro de las siete piezas de la
# perpendicular parten de una figura plana y tres apartados la piden antes).
#
# LA CONVOCATORIA. `control-primer-cuatrimestre`: la guía llama «control» a la
# prueba escrita del bloque 1 (catálogo, `diedrico-control`), y el bloque 1 es
# el del primer cuatrimestre: la presentación del segundo, de 2025-26, es la
# del «2º bloque», y su pág. 5 pone el control del bloque 2 el «20 abril». La
# presentación de 2026-27 de la carpeta de eGela trae en la capa de texto de su
# pág. 6 «Examen……25% en noviembre» y «Posibilidad de liberar en abril», pero
# en la diapositiva renderizada los dos quedan tapados por recuadros blancos y
# solo se ve «Examen……25%»: por eso la ruta no publica el mes.
# `tambienPrepara: hoja` para que las cuatro hojas enlacen esta ruta desde su
# página. El porqué largo, en el LEEME de la unidad.
asignatura: expresion-grafica
evaluacion: control-primer-cuatrimestre
tambienPrepara:
  - hoja
titulo: Preparar el control del bloque 1, el diédrico
lede: >-
  El control del diédrico, a mano y sobre la figura impresa, medido sobre lo
  único de examen que trae el material: las cuatro hojas sin fecha de la
  colección, los Ejercicios 52 a 55, con 13 apartados que el sitio resuelve en
  17 piezas. Primero la figura plana y la perpendicular a un plano, que es lo
  que más piden; los ángulos caen en las cuatro.
temas:
  - t01-sistemas-de-representacion
  - t02-punto-recta-y-plano
  - t03-metodos-descriptivos
  - t04-intersecciones
  - t05-paralelismo-perpendicularidad-distancias
  - t06-angulos
medidoSobre: 4
criterioDeOrden: >-
  Por cuántas de las 17 piezas pide cada construcción, de más a menos,
  contadas pieza a pieza con la frase del enunciado que la pide; una pieza
  puede pedir dos. Con una excepción, que marcan las propias hojas: la figura
  plana, con seis piezas, va delante de la perpendicular a un plano, con
  siete, porque cuatro de esas siete parten de una figura plana —52.1, 52.2,
  54.2 b y 55.2— y el 52.2, el 54.2 y el 55.2 la piden antes, en el mismo
  apartado. Delante de todo, el suelo, que no da puntos; detrás, el simulacro
  y el formulario.


  «52.2» es el apartado 2 del Ejercicio 52, y «54.1 a», el a del apartado 1
  del 54. Las cuatro hojas no tienen fecha ni curso, y son todo lo que esta
  página cuenta: del bloque 1 no hay en el material ninguna otra cosa con
  formato de examen. Se ordena por piezas y no por hojas, que es lo que dice
  el rótulo de cada bloque, porque con cuatro hojas casi todo cae en tres o
  en cuatro y la cuenta por hojas no distingue.


  **Lo que esta ruta no prepara.** El control se hace a mano y en papel,
  sobre la figura impresa; aquí se construye en pantalla, y el trazo a lápiz
  hay que entrenarlo fuera. Tampoco los trabajos y entregables del bloque, un
  10 % de la nota según la guía docente (las presentaciones de la asignatura
  dicen un 5 %), que se hacen con el material de clase.

bloques:
  # ═══════════════════════════════════════════════════════════════════
  # SUELO
  # ═══════════════════════════════════════════════════════════════════
  - id: las-dos-vistas
    titulo: Las dos vistas sin línea de tierra, cota y alejamiento
    apunte:
      texto: 'no da puntos — los sostiene todos'
      tono: marco
    pide: >-
      Nada por sí mismo. Lo piden dentro de otras preguntas, con palabras
      como «más alejado del plano vertical» (52.2), «por encima» (52.4), «en
      la parte superior» (54.2 b), «el punto más alto» (54.3) o «de mayor
      cota» (55.2).
    porque: >-
      Ninguna de las 17 piezas es de este suelo: cero de diecisiete son del
      tema 1, que es el de leer las vistas. Pero las cuatro hojas dan los datos
      en alzado y planta, sin línea de tierra, así que en todas se lee
      comparando cotas y alejamientos entre puntos, y cinco piezas lo dicen
      con esas palabras. Va primero porque sin esto no se termina ninguna: se
      mide en la vista que acorta, o se pone encima lo que va debajo.
    invariante:
      anios: 0
      fuente: >-
        Contado sobre las 17 piezas de los Ejercicios 52 a 55: ninguna es del
        tema 1. Las cinco que comparan cotas o alejamientos con palabras de la
        hoja son 52.2, 52.4, 54.2 b, 54.3 y 55.2. Que ninguna de las cuatro
        dibuje la línea de tierra lo dice el tema 1, comprobado en ellas.
    dominio: >-
      Ante dos puntos cualesquiera de una hoja dices sin medir cuál está más
      alto y cuál más delante, y antes de medir un segmento sabes en qué vista
      está en verdadera magnitud, o que no lo está en ninguna.
    revisado: '2026-10-08'
    escalones:
      - id: comparar-sin-linea-de-tierra
        titulo: Cota y alejamiento, comparados entre puntos
        aprendes: >-
          A leer sin línea de tierra qué punto está más alto en el alzado y
          cuál está más delante en la planta, que es todo lo que las hojas
          preguntan de la posición de un punto, y qué dice de un segmento que
          sus dos extremos estén a la misma altura.
        teoria:
          tema: t01-sistemas-de-representacion
          apartado: sin-línea-de-tierra
          nota: >-
            Por qué se puede quitar la línea de tierra: lo que preguntan las
            hojas son diferencias entre puntos, y esas no dependen de dónde
            estén los planos.
        ejercicios:
          - id: sr-bc-horizontal-se-mide-en-la-planta
            incrustado: true
            nota: >-
              El ejemplo de entrada, sobre la figura del 55.2: una proyección
              que sale horizontal en el papel, y lo que dice de la recta.
        dominio: >-
          Señalas en cualquier figura de las hojas el punto de mayor cota y el
          de mayor alejamiento sin dudar de en qué vista mirar cada uno.
      - id: el-segmento-oblicuo
        titulo: Qué mide cada vista, y el segmento que no está en ninguna
        aprendes: >-
          A reconocer de un vistazo si un segmento es horizontal, frontal u
          oblicuo, y a sacar la longitud de uno oblicuo con su triángulo: la
          planta y la diferencia de cotas.
        teoria:
          tema: t02-punto-recta-y-plano
          apartado: qué-mide-cada-vista
          nota: >-
            La tabla de las siete posiciones de una recta dice dónde se mide
            cada una, y en cuáles no se mide en ninguna de las dos vistas: la
            de perfil y la oblicua.
        ejercicios:
          - id: sd4-el-poste-y-sus-tres-cables
            nota: >-
              Tres cables oblicuos, y la longitud y la pendiente de cada uno
              salen del mismo triángulo.
        dominio: >-
          Das la longitud real de un segmento oblicuo con su triángulo en
          menos de un minuto, y no mides nunca sobre una proyección que lo
          acorta.

  # ═══════════════════════════════════════════════════════════════════
  # LA FIGURA PLANA
  # ═══════════════════════════════════════════════════════════════════
  - id: la-figura-plana
    titulo: La figura plana, completada en su plano y en verdadera magnitud
    apunte:
      texto: 'las 4 hojas — 6 de las 17 piezas'
      tono: neutro
    pide: >-
      «Completar las proyecciones del cuadrado» (52.2), «Completar su
      proyección en el plano horizontal» (54.2 a), «Las proyecciones diédricas
      de la ventana cuando está cerrada» y abierta 60° (53.2), «Determinar la
      verdadera magnitud del plano oblicuo» (52.1), la verdadera magnitud de la
      sección «mediante el método de abatimientos» (53.1) y la base cuadrada
      que «se haya en el plano ABCD» (55.2; «se haya», así en la hoja).
    porque: >-
      Seis de las 17 piezas, en las cuatro hojas: cuatro piden dibujar o
      completar una figura que está en un plano (52.2, 53.2, 54.2 a y 55.2) y
      dos, verla en verdadera magnitud (52.1 y 53.1). Solo dos se cierran
      aquí, el 54.2 a y el 53.2; las otras cuatro se terminan en su bloque: el
      52.1, el 52.2 y el 55.2 empiezan por la figura, y el 53.1 acaba en ella,
      con la sección en verdadera magnitud. Va delante de la perpendicular,
      que pide una pieza más, porque las hojas la piden antes: el 52.2, el
      54.2 y el 55.2 empiezan por la figura y después levantan algo sobre ella.
    invariante:
      anios: 4
      fuente: >-
        Contado sobre las 17 piezas de los Ejercicios 52 a 55: 52.1, 52.2,
        53.1, 53.2, 54.2 a y 55.2. Son de cuatro temas distintos —el 2, el 3,
        el 4 y el 5—, porque en cuatro de las seis la figura plana no es lo
        principal de la pieza. Que completarla y verla en verdadera magnitud
        sean el mismo hueco es lectura nuestra: en el 52.2 y el 55.2 van
        juntas, porque para que un cuadrado salga cuadrado hay que dibujarlo en
        verdadera magnitud y devolverlo a las vistas.
    dominio: >-
      Completas una figura de la que te dan una proyección y un dato, sabes si
      basta una recta del plano o hay que tumbarlo, y la devuelves a las dos
      vistas sin que deje de ser lo que es: el cuadrado, cuadrado.
    falta:
      - >-
        Ningún escalón de esta ruta, salvo el primero del suelo, arranca en un
        ejemplo de entrada: los temas 2 a 6 no tienen ninguno propio, y cada
        escalón empieza en un ejercicio de la colección, o el del abatimiento
        en la hoja de clase «Plano en VM». Hace de rampa el apartado de teoría
        que abre el escalón; lo que falta es un ejercicio más corto, nuestro,
        que entrene la construcción sola antes del de la colección.
      - >-
        El tema 3 no explica el giro alrededor de un eje que no es vertical ni
        de punta, que es el del 53.2: la ventana gira sobre AB, que es
        horizontal. Su página pone antes AB de punta con un cambio de plano y
        gira en esa vista nueva; hasta que el tema lo cuente, se aprende ahí.
    revisado: '2026-10-08'
    escalones:
      - id: el-punto-en-su-plano
        titulo: Un punto en un plano, por una recta del plano
        aprendes: >-
          A sacar la proyección que falta de un punto que está en un plano
          trazando por él una recta del plano, también cuando el plano viene
          dado solo por su línea de máxima pendiente.
        teoria:
          tema: t02-punto-recta-y-plano
          apartado: las-rectas-notables-de-un-plano
          nota: >-
            Un plano dado por su l.m.p. tiene por horizontales las
            perpendiculares a ella en la planta, y con una basta: es el único
            dato del plano en el 54.2.
        ejercicios:
          - id: sd13-el-triangulo-de-la-lmp-frontal
            nota: >-
              El alzado de un triángulo dado solo en planta, con la l.m.p. de
              su plano: lo mismo que el 54.2 a, en la otra vista.
          - id: sd7-el-cuadrado-con-una-diagonal-en-la-lmp
            nota: >-
              Un cuadrado con una diagonal sobre la l.m.p.: la otra diagonal es
              una horizontal del plano.
          - id: exeg-h54-2a-la-planta-del-trapecio-en-el-plano-de-r
            nota: >-
              La planta de los cuatro vértices del trapecio, con la l.m.p. r
              como único dato de su plano.
        dominio: >-
          Sitúas en la otra vista cualquier punto de un plano con una
          horizontal o una frontal suya, y no lo bajas nunca a ojo.
      - id: abatir-para-verla
        titulo: Abatir el plano para ver la figura en verdadera magnitud
        aprendes: >-
          A tumbar un plano oblicuo alrededor de una horizontal o una frontal
          suya y ver en él la figura sin deformar, con el radio de cada punto
          sacado de su triángulo.
        teoria:
          tema: t03-metodos-descriptivos
          apartado: el-abatimiento-tumbar-el-plano
          nota: >-
            El método que llega en un paso; el cambio de plano y el giro llegan
            a lo mismo en dos, y la hoja de clase de abajo pide los tres.
        ejercicios:
          - id: pvm-el-plano-abc-por-seis-caminos
            nota: >-
              La hoja de clase: el mismo triángulo por seis caminos, y los dos
              abatimientos, con la charnela que da la hoja.
          - id: sd25-tres-caras-de-un-bloque-cortado
            nota: >-
              Una cara por método, para saber elegir: el 52.1 y el 53.1 piden
              la verdadera magnitud de una cara y de una sección.
        dominio: >-
          Abates un triángulo oblicuo con la charnela que te den y compruebas
          un lado midiéndolo contra su triángulo.
      - id: dibujarla-y-desabatirla
        titulo: Dibujar la figura en verdadera magnitud y devolverla a las vistas
        aprendes: >-
          A construir en el plano abatido un cuadrado o un triángulo
          equilátero con los datos del enunciado y a desabatirlo punto a punto,
          que es lo que piden el 52.2 y el 55.2 antes de levantar nada.
        teoria:
          tema: t03-metodos-descriptivos
          apartado: la-vuelta-dibujar-en-verdadera-magnitud-y-desabatir
        ejercicios:
          - id: sd11-el-cuadrado-de-40-mm-con-un-lado-sobre-r
            nota: >-
              Un cuadrado con un lado sobre una recta dada: se dibuja abatido y
              se devuelve.
          - id: sd10-el-triangulo-equilatero-con-el-lado-opuesto-sobre-r
            nota: >-
              El mismo camino con un triángulo equilátero.
          - id: sd28-el-triangulo-equilatero-de-centro-o
            nota: >-
              Por los tres métodos, para ver cuál es el más corto cuando la
              figura no está.
        dominio: >-
          Devuelves a las dos vistas un cuadrado dibujado abatido y compruebas
          que sus lados opuestos salen paralelos en las dos.
      - id: el-giro
        titulo: El giro, cuando el problema mismo es girar
        aprendes: >-
          A girar una figura alrededor de un eje vertical o de punta, y si el
          eje no es ni lo uno ni lo otro, como el lado AB de la ventana del
          53.2, a ponerlo antes de punta con un cambio de plano.
        teoria:
          tema: t03-metodos-descriptivos
          apartado: el-giro-mover-la-figura
          nota: >-
            Con una horizontal cualquiera de eje, la circunferencia de cada
            punto no se vería sin deformar en ninguna de las dos vistas; por
            eso el eje va vertical o de punta.
        ejercicios:
          - id: sd16-las-otras-dos-palas-del-molino
            nota: >-
              Un giro de 120° alrededor de un eje de punta.
          - id: sd17-el-cuadrado-y-la-barra-tras-dos-giros
            nota: >-
              Dos giros de 60° seguidos, uno de eje vertical y otro de punta.
          - id: exeg-h53-2-la-ventana-que-gira-sobre-ab
            nota: >-
              La ventana cerrada en una pared inclinada, y abierta 60° hacia
              fuera alrededor de su lado AB.
        dominio: >-
          Giras una figura el ángulo que te pidan alrededor de un eje dado, y
          sabes qué coordenada conserva cada punto en cada vista.

  # ═══════════════════════════════════════════════════════════════════
  # LA PERPENDICULAR A UN PLANO
  # ═══════════════════════════════════════════════════════════════════
  - id: la-perpendicular-a-un-plano
    titulo: La perpendicular a un plano, y lo que se levanta sobre ella
    apunte:
      texto: '7 de las 17 piezas — lo que más piden'
      tono: neutro
    pide: >-
      Un agujero que «es perpendicular a la cara oblicua ABC» (52.1); un
      «tronco de pirámide regular» que «mide 40 mm de altura» (52.2); otra
      chapa «en paralelo, a 25 mm de distancia» (52.4); «un plano rectangular
      que es perpendicular al trapecio» (54.2 b); «La distancia mínima entre el
      punto Z′ y el plano BCB′C′» (55.1 c); «La altura de la pirámide es el
      doble de la longitud de la recta BC» (55.2), y dos tuberías «de igual
      longitud» hasta un colector (55.3).
    porque: >-
      Siete de las 17 piezas, en tres de las cuatro hojas —todas menos la 53—:
      es la construcción que más piden. En cinco, una recta perpendicular a un
      plano y una medida en verdadera magnitud sobre ella: 40 mm
      (52.2), 25 mm (52.4), 30 mm (54.2 b), el doble de BC (55.2) o la
      distancia que se pide (55.1 c); en el 52.1, las aristas de un agujero, y
      en el 55.3, al revés, el plano perpendicular a una recta. En cuatro de
      las siete el resultado es un sólido o dos chapas que se dibujan enteros,
      con lo que se ve y lo que no (52.1, 52.2, 52.4 y 55.2); la hoja lo pide
      con palabras solo en el 55.2, y en las otras tres lo da su página como
      parte de la respuesta. La 55.1 c-d se entrena con las rectas que se
      cruzan, porque su d lo pide.
    invariante:
      anios: 3
      fuente: >-
        Contado sobre las 17 piezas: 52.1, 52.2 y 52.4; 54.2 b; 55.1 c-d, 55.2
        y 55.3, las siete del tema 5 (que tiene nueve: las otras dos, 53.3 B y
        54.3, son de las rectas que se cruzan). Dos son lectura nuestra, y el
        tema 5 las explica: que el eje de un tronco de pirámide regular es
        perpendicular a su base (52.2), y que el plano «equidistante a los
        puntos A y B» de la nota impresa del 55.3 es el plano mediador de AB,
        el perpendicular a AB por su punto medio: el plano lo dice la hoja, y
        que se construya así y por eso cuente aquí es lo nuestro. La 55.1 c-d
        cuenta aquí por su c, y en el bloque de las rectas que se cruzan, por
        su d.
    dominio: >-
      Trazas la perpendicular a un plano oblicuo por cualquier punto —la
      planta contra una horizontal del plano, el alzado contra una frontal—,
      llevas sobre ella una medida en verdadera magnitud y dibujas el sólido
      que queda, con lo que se ve y lo que no.
    revisado: '2026-10-08'
    escalones:
      - id: la-recta-perpendicular
        titulo: La recta perpendicular a un plano, contra la horizontal y la frontal
        aprendes: >-
          A dibujar las dos proyecciones de la perpendicular a un plano oblicuo
          por un punto, con una horizontal y una frontal del plano, y a saber
          que eso no da todavía su pie.
        teoria:
          tema: t05-paralelismo-perpendicularidad-distancias
          apartado: una-recta-perpendicular-a-un-plano
          nota: >-
            El pie es una intersección de recta y plano, la del tema 4, o sale
            poniendo el plano de canto, que es el escalón siguiente.
        ejercicios:
          - id: sd47-el-tubo-perpendicular-al-fondo-de-la-tolva
            nota: >-
              Un tubo perpendicular al fondo de una tolva, con la frontal que
              hace falta para trazarlo.
          - id: exeg-h54-2b-el-rectangulo-perpendicular-sobre-la-diagonal
            nota: >-
              Dos perpendiculares al plano del trapecio, por A y por C, con los
              30 mm sobre cada una. Su página vuelve a pedir A₁ y C₁, para que
              se pueda hacer sin el 54.2 a.
        dominio: >-
          Trazas la perpendicular a un plano por un punto en las dos vistas
          sin mirar los lados del triángulo, solo su horizontal y su frontal.
      - id: una-medida-sobre-la-perpendicular
        titulo: Una medida sobre la perpendicular, con el plano de canto
        aprendes: >-
          A poner el plano de canto con un cambio de plano, donde la
          perpendicular se ve en verdadera magnitud, y a llevar sobre ella una
          distancia dada o a medir la que se pide.
        teoria:
          tema: t05-paralelismo-perpendicularidad-distancias
          apartado: de-un-punto-a-un-plano
          nota: >-
            El camino corto, el del plano proyectante. El apartado siguiente
            del tema hace lo mismo entre dos planos paralelos, que es el 52.4.
        ejercicios:
          - id: sd58-la-tuberia-mas-corta-hasta-la-tolva
            nota: >-
              La distancia de un punto a una tolva, con la cara de canto, y
              comprobando en qué cara cae el pie.
          - id: sd54-la-recta-paralela-al-plano-y-su-distancia
            nota: >-
              La distancia de una recta paralela a un plano: vale la de
              cualquiera de sus puntos.
          - id: sd50-el-cuadrado-paralelo-a-abc-por-p
            nota: >-
              Un cuadrado paralelo a un plano, con P 20 mm por encima: la misma
              idea que la chapa del 52.4.
          - id: exeg-h52-4-la-chapa-paralela-a-25-mm
            nota: >-
              La chapa nueva, por la perpendicular al plano de la primera y con
              los 25 mm en verdadera magnitud.
        dominio: >-
          Pones un plano de canto en un solo cambio, eligiendo la recta que
          miras de punta, y llevas o mides sobre la perpendicular una distancia
          en verdadera magnitud.
      - id: el-plano-perpendicular-a-una-recta
        titulo: Al revés, el plano perpendicular a una recta, y el plano mediador
        aprendes: >-
          A dar el plano perpendicular a una recta por un punto con una
          horizontal y una frontal, y a reconocer que los puntos que están a la
          misma distancia de A y de B forman el plano mediador de AB.
        teoria:
          tema: t05-paralelismo-perpendicularidad-distancias
          apartado: un-plano-perpendicular-a-una-recta
          nota: >-
            El plano mediador no lo nombran las diapositivas; el apartado lo
            explica con el 55.3.
        ejercicios:
          - id: sd53-la-piramide-recta-de-eje-e
            nota: >-
              Una pirámide recta de eje dado: su base está en el plano
              perpendicular al eje.
          - id: exeg-h55-3-dos-tuberias-iguales-hasta-el-colector
            nota: >-
              Dos tuberías iguales desde A y desde B: el punto del colector está
              en el plano mediador de AB.
        dominio: >-
          Ante un punto que tiene que estar a la misma distancia de otros dos,
          escribes su plano mediador y lo cortas con la recta que te den.
      - id: el-solido-con-lo-que-se-ve
        titulo: El sólido entero, con lo que se ve y lo que no
        aprendes: >-
          A pasar a limpio el sólido que has levantado decidiendo en cada cruce
          de dos aristas cuál va delante, que es comparar alejamientos en el
          alzado y cotas en la planta.
        teoria:
          tema: t04-intersecciones
          apartado: el-cruce-aparente
          nota: >-
            Aquí las piezas se toman opacas; la hoja solo pide la visibilidad
            con palabras en el 55.2, «diferenciando zonas visibles y ocultas».
        ejercicios:
          - id: sd51-la-piramide-recta-de-base-rectangular
            nota: >-
              Una pirámide recta sobre una base rectangular: la altura por la
              perpendicular a la base por su centro, y la pirámide con lo visto
              y lo oculto.
          - id: sd67a-el-prisma-hexagonal-oblicuo
            nota: >-
              Un prisma con una base en el plano de una l.m.p.: la figura plana
              y lo que se levanta sobre ella, juntas.
          - id: exeg-h52-2-el-cuadrado-y-el-tronco-de-piramide
            nota: >-
              El cuadrado completado desde su alzado, el eje por la
              perpendicular a su plano y los 40 mm en verdadera magnitud.
          - id: exeg-h55-2-la-piramide-de-mayor-cota
            nota: >-
              La base sobre su diagonal EF, la altura doble de BC, y la
              visibilidad, que aquí la hoja pide con palabras.
          - id: exeg-h52-1-el-agujero-perpendicular-a-la-cara-abc
            nota: >-
              Lo junta todo: el cuadrado sobre la cara abatida, cada arista del
              agujero perpendicular a la cara hasta la cara por la que sale, y
              la cara en verdadera magnitud.
        dominio: >-
          Dibujas una pirámide o un tronco sobre un plano oblicuo con sus
          aristas vistas y ocultas, y justificas cada tramo oculto con el cruce
          que lo decide.

  # ═══════════════════════════════════════════════════════════════════
  # LOS ÁNGULOS
  # ═══════════════════════════════════════════════════════════════════
  - id: los-angulos
    titulo: Los ángulos, entre dos rectas, de una recta con un plano y entre dos planos
    apunte:
      texto: 'las 4 hojas — 8 ángulos en 4 piezas'
      tono: neutro
    pide: >-
      «Determinar la verdadera magnitud de los siguientes ángulos», cuatro de
      una pirámide (52.3); «Calcular gráficamente el ángulo entre los dos
      planos» (53.3 A); el «Ángulo entre las rectas AB y AV (por ABATIMIENTO)»
      (54.1 b), y «El ángulo entre las rectas AB y BC» y «El ángulo entre el
      plano A′B′C′ y la recta BB′» (55.1 a-b).
    porque: >-
      Cuatro de las 17 piezas, una en cada hoja, y ocho ángulos entre las
      cuatro: tres entre dos rectas, dos de una recta con un plano, dos entre
      dos planos y uno de un plano con el horizontal. Es, con la figura plana,
      la única construcción que cae en las cuatro hojas. Va aquí por su
      recuento, y le viene bien ir detrás de la perpendicular, porque la usa:
      el ángulo de una recta con un plano es el complementario del que la
      recta forma con la perpendicular al plano.
    invariante:
      anios: 4
      fuente: >-
        Contado sobre las 17 piezas: 52.3, 53.3 A, 54.1 b y 55.1 a-b, las
        cuatro del tema 6. Los ocho, enunciado a enunciado: en el 52.3, el de
        la cara ABC con el plano horizontal, el de BV con CV, el de AV con la
        cara ABC y el de las caras AVB y AVC; en el 53.3 A, el de los dos
        planos del tejado; en el 54.1 b, el de AB con AV, y en el 55.1, el de AB
        con BC y el de la recta BB′ con el plano A′B′C′.
    dominio: >-
      Ante cualquier ángulo de una hoja dices primero de qué clase es —dos
      rectas, recta y plano, dos planos, plano y horizontal—, con eso eliges
      la construcción, y lo das en grados medido donde está en verdadera
      magnitud.
    revisado: '2026-10-08'
    escalones:
      - id: el-angulo-con-el-horizontal
        titulo: El ángulo con el plano horizontal
        aprendes: >-
          A sacar el ángulo de una recta con el plano horizontal de su
          triángulo, y el de un plano, de su línea de máxima pendiente.
        teoria:
          tema: t06-angulos
          apartado: el-ángulo-con-los-planos-de-proyección
          nota: >-
            Y los casos particulares, que ahorran toda la construcción: el β
            del 55.1, con la base A′B′C′ horizontal, es uno.
        ejercicios:
          - id: sd18-la-placa-triangular-soldada-a-60
            nota: >-
              Una placa a 60° del ala horizontal: la altura de la placa es su
              l.m.p.
          - id: sd61-el-tripode-del-tren-de-aterrizaje
            nota: >-
              La longitud de un brazo y su ángulo con el plano horizontal, por
              su triángulo; y el de otros dos, abatiendo su plano.
        dominio: >-
          Das el ángulo de una recta o de un plano con el horizontal sin
          construir más que un triángulo.
      - id: el-angulo-entre-dos-rectas
        titulo: El ángulo entre dos rectas, abatiendo su plano
        aprendes: >-
          A ver en verdadera magnitud el plano que forman dos rectas que se
          cortan, abatiéndolo con una horizontal de charnela, y a medir allí el
          ángulo que piden.
        teoria:
          tema: t06-angulos
          apartado: el-ángulo-entre-dos-rectas
        ejercicios:
          - id: sd59-el-nudo-de-la-grua
            nota: >-
              Un giro de eje vertical para dejar el cable frontal, y el ángulo
              de NQ y QP.
          - id: sd62-los-angulos-de-la-cabria
            nota: >-
              El ángulo de dos patas, abatiendo su plano; pide también el de
              dos planos, que es el último escalón.
          - id: exeg-h54-1b-el-angulo-de-ab-y-av-por-abatimiento
            nota: >-
              Con el método impuesto, por abatimiento, y AB de charnela.
        dominio: >-
          Abates el plano de dos rectas con una charnela que no estorbe y das
          el ángulo en grados, sabiendo si piden el menor o el que abarca la
          figura.
      - id: el-angulo-de-una-recta-con-un-plano
        titulo: El ángulo de una recta con un plano
        aprendes: >-
          A sacar el ángulo de una recta con un plano por la perpendicular al
          plano desde un punto de la recta, en magnitud y, si lo piden, en
          posición.
        teoria:
          tema: t06-angulos
          apartado: el-ángulo-entre-una-recta-y-un-plano
        ejercicios:
          - id: sd63-el-angulo-de-r-con-el-plano-abc
            nota: >-
              En magnitud y posición: R, T y el triángulo PTR abatido.
          - id: sd66-el-mastil-sobre-el-tejado
            nota: >-
              El de una barra con el faldón, girándola alrededor de la
              perpendicular al faldón; trae también el de dos faldones.
          - id: exeg-h55-1ab-dos-angulos-del-prisma-oblicuo
            nota: >-
              α, entre dos rectas, y β, de la arista BB′ con la base A′B′C′, que
              es horizontal: los dos casos particulares a la vez.
        dominio: >-
          Sacas el ángulo de una recta con un plano oblicuo y no lo confundes
          con su complementario, el que la recta forma con la perpendicular.
      - id: el-angulo-entre-dos-planos
        titulo: El ángulo entre dos planos, con su arista de punta
        aprendes: >-
          A poner de punta la recta común de dos planos, con dos cambios de
          plano o con uno si ya es horizontal o frontal, y a medir allí el
          ángulo que forman sus cantos.
        teoria:
          tema: t06-angulos
          apartado: el-ángulo-entre-dos-planos
          nota: >-
            El menor de los dos ángulos, o el que abarcan las caras: la misma
            construcción da los dos, y lo decide el enunciado o, si calla, como
            en el 53.3 A, el convenio del menor.
        ejercicios:
          - id: sd60-la-cara-cdgh-y-el-diedro-de-alfa-y-beta
            nota: >-
              Una cara en verdadera magnitud, su pendiente y el diedro de dos
              caras, que pasa de 90°.
          - id: exeg-h53-3a-el-angulo-entre-los-dos-planos-del-tejado
            nota: >-
              Los dos planos del tejado, con AB de arista.
          - id: exeg-h52-3-cuatro-angulos-de-una-piramide
            nota: >-
              Las cuatro clases de ángulo en una sola pirámide: el repaso del
              bloque entero.
        dominio: >-
          Das el ángulo entre dos planos oblicuos con su arista de punta y
          sabes decir, antes de medir, si piden el menor o el de las caras.

  # ═══════════════════════════════════════════════════════════════════
  # DOS RECTAS QUE SE CRUZAN
  # ═══════════════════════════════════════════════════════════════════
  - id: dos-rectas-que-se-cruzan
    titulo: La distancia entre dos rectas que se cruzan, y dónde está
    apunte:
      texto: '3 de las 17 — y piden también dónde'
      tono: neutro
    pide: >-
      «Determinar la distancia mínima entre las rectas AD y BC y dibujar las
      proyecciones diédricas del refuerzo» (53.3 B); «¿Cumple la ley de
      seguridad? ¿A qué distancia pasa?», y el punto del tren y el del cable
      más cercanos (54.3); «La distancia mínima ente las rectas BB′ y ZZ′»
      («ente», así en la hoja), «indicando posición y magnitud» (55.1 d).
    porque: >-
      Tres de las 17 piezas, en tres hojas —la 53, la 54 y la 55—, y las tres
      con la misma construcción: la perpendicular común, la única recta que
      corta a las dos y es perpendicular a ambas. Las tres piden además dónde
      está, sus dos extremos en las dos vistas, y no solo cuánto mide. Va aquí
      por su recuento, detrás de los ángulos.
    invariante:
      anios: 3
      fuente: >-
        Contado sobre las 17 piezas: 53.3 B, 54.3 y el d de la 55.1 c-d, las
        tres del tema 5 (con las siete de la perpendicular son sus nueve,
        contando una vez la 55.1 c-d). Que el tren y el cable sean dos rectas
        que se cruzan es lectura nuestra, de la página del 54.3 y del tema 5:
        el punto más
        alto del tren va 4 m por encima de su trayectoria, por una paralela a
        ella, y lo que se mide es la perpendicular común de esa paralela y el
        cable.
    dominio: >-
      Pones una de las dos rectas de punta con dos cambios de plano, o con uno
      si ya es horizontal o frontal, sacas la perpendicular común en verdadera
      magnitud y llevas sus dos extremos de vuelta, vista a vista, hasta la
      planta y el alzado.
    revisado: '2026-10-08'
    escalones:
      - id: una-recta-de-punta
        titulo: Una recta de punta, en dos cambios de plano
        aprendes: >-
          A dejar una recta oblicua en verdadera magnitud con un primer cambio
          y de punta con el segundo, y a medir desde ella la distancia de un
          punto.
        teoria:
          tema: t05-paralelismo-perpendicularidad-distancias
          apartado: de-un-punto-a-una-recta-y-entre-dos-rectas-que-se-cruzan
          nota: >-
            Y la tabla del principio de las distancias, que dice qué se pone de
            canto o de punta para cada una.
        ejercicios:
          - id: sd55-la-tuberia-mas-corta-de-p-a-ab
            nota: >-
              La distancia de un punto a una recta, con la recta de punta en dos
              cambios: el primer paso de la perpendicular común.
        dominio: >-
          Pones de punta una recta oblicua en dos cambios sin perder la
          referencia de cotas ni la de alejamientos.
      - id: la-perpendicular-comun
        titulo: La perpendicular común, y sus extremos de vuelta a las vistas
        aprendes: >-
          A sacar la perpendicular común con una de las dos rectas de punta,
          donde se ve en verdadera magnitud y en ángulo recto con la otra, y a
          llevar sus dos extremos hacia atrás hasta las dos vistas.
        teoria:
          tema: t05-paralelismo-perpendicularidad-distancias
          apartado: de-un-punto-a-una-recta-y-entre-dos-rectas-que-se-cruzan
          nota: >-
            Con el error que la acompaña: la perpendicular a una sola de las dos
            rectas mide más que la distancia mínima.
        ejercicios:
          - id: sd56-la-tuberia-mas-corta-entre-ab-y-cd
            nota: >-
              Con CD ya frontal, un solo cambio la deja de punta.
          - id: sd57-la-tuberia-mas-corta-entre-ab-y-cd-paralelas
            nota: >-
              El caso que se sale: con las dos paralelas, la más corta no es
              única.
          - id: exeg-h53-3b-el-refuerzo-entre-ad-y-bc
            nota: >-
              El refuerzo del tejado, entre AD y BC.
          - id: exeg-h54-3-el-tren-y-el-cable
            nota: >-
              A escala 1:100: los 4 m y los 3 m del enunciado son 40 y 30 mm del
              papel.
          - id: exeg-h55-1cd-distancias-a-una-cara-y-entre-dos-rectas
            nota: >-
              Las dos distancias del prisma: la c, de un punto a una cara, es la
              del bloque de la perpendicular; la d, esta.
        dominio: >-
          Das la distancia entre dos rectas que se cruzan y sus dos extremos en
          la planta y el alzado, y compruebas que sale perpendicular a la otra
          en la vista donde la primera es un punto.

  # ═══════════════════════════════════════════════════════════════════
  # LAS INTERSECCIONES
  # ═══════════════════════════════════════════════════════════════════
  - id: las-intersecciones
    titulo: Las intersecciones, la sección de un sólido y dos sólidos que se cortan
    apunte:
      texto: '2 de las 17 — las dos, el apartado 1'
      tono: neutro
    pide: >-
      «La intersección entre el plano y la columna» y «La verdadera magnitud
      de la intersección mediante el método de abatimientos» (53.1), e
      «Intersección entre los dos prismas» (54.1 a).
    porque: >-
      Dos de las 17 piezas, en la 53 y la 54, y las dos son el apartado 1 de
      su hoja. Se buscan arista a arista, cada punto como el de una recta con
      un plano, y después queda algo más: la sección en verdadera magnitud,
      que el 53.1 pide, y qué se ve de cada sólido en el 54.1 a, que la hoja no
      pide con palabras y su página da como parte de la respuesta.
    invariante:
      anios: 2
      fuente: >-
        Contado sobre las 17 piezas: 53.1 y 54.1 a, las dos del tema 4. La
        visibilidad del 54.1 a la da su página como parte de la respuesta; la
        del 53.1, como pregunta nuestra. El punto en que una recta corta a un
        plano sale también dentro del 52.1, la 55.1 c y el 55.3, cuya nota
        impresa habla de «la intersección entre la recta r y un plano»; que
        esas cuenten en el bloque de su construcción y no aquí es lectura
        nuestra: aquí cuenta la pieza cuya respuesta es la intersección.
    dominio: >-
      Sacas la sección de un prisma por un plano arista a arista, unes los
      puntos que están en la misma cara y la pasas a limpio con lo que se ve;
      y si son dos sólidos, cortas las aristas de cada uno con las caras del
      otro.
    revisado: '2026-10-08'
    escalones:
      - id: la-recta-y-el-plano
        titulo: Donde una recta atraviesa un plano, con el plano auxiliar
        aprendes: >-
          A encontrar el punto donde una recta corta a un plano con un plano
          auxiliar que la contiene y se ve de canto, que es como sale cada
          vértice de una sección.
        teoria:
          tema: t04-intersecciones
          apartado: el-plano-auxiliar
        ejercicios:
          - id: sd29-la-recta-r-a-traves-de-la-chapa-doblada
            nota: >-
              Una recta a través de una chapa doblada: un punto en cada cara,
              con el plano vertical que contiene la recta.
        dominio: >-
          Cortas una recta con un plano oblicuo con un solo plano auxiliar y
          sabes en qué vista se lee el punto.
      - id: la-seccion-de-un-solido
        titulo: La sección de un sólido por un plano
        aprendes: >-
          A sacar los vértices de la sección arista a arista, a unirlos cara a
          cara, y después a verla en verdadera magnitud.
        teoria:
          tema: t04-intersecciones
          apartado: un-plano-y-un-poliedro
        ejercicios:
          - id: sd35-la-seccion-del-prisma-por-el-plano-mnop
            nota: >-
              La sección de un prisma por un plano, completando antes sus
              vistas: el formato del 53.1.
          - id: sd67b-la-seccion-del-prisma-por-el-plano-a-60
            nota: >-
              Una sección por un plano de canto, y en verdadera magnitud: la
              segunda mitad del 53.1 con un plano más fácil de cortar.
          - id: exeg-h53-1-la-columna-cortada-por-el-plano-de-r-y-s
            nota: >-
              La columna cortada por el plano de r y s, y la sección abatida con
              s de charnela.
        dominio: >-
          Das la sección de un prisma por un plano oblicuo en las dos vistas y
          en verdadera magnitud, y compruebas que cada lado está en una cara.
      - id: dos-solidos-que-se-cortan
        titulo: Dos sólidos que se cortan, y dónde cambia de vista una arista
        aprendes: >-
          A cortar las aristas de cada sólido con las caras del otro, y a saber
          que una arista solo pasa de vista a oculta en un cruce aparente o
          donde atraviesa una cara.
        teoria:
          tema: t04-intersecciones
          apartado: dónde-cambia-una-arista
        ejercicios:
          - id: sd32-la-interseccion-de-los-triangulos-abc-y-def
            nota: >-
              Dos triángulos que se cortan, con lo que tapa cada uno.
          - id: sd42-el-prisma-triangular-que-atraviesa-la-piramide
            nota: >-
              Un prisma que atraviesa una pirámide, con sus dos poligonales: el
              tema lo pone junto al 54.1 a.
          - id: exeg-h54-1a-la-piramide-atravesada-por-el-prisma
            nota: >-
              La pirámide atravesada por el prisma, con qué se ve y qué se
              oculta de los dos polígonos de la intersección.
        dominio: >-
          Ante dos sólidos que se cortan dices cuántas líneas de intersección
          salen —una si se muerden, dos si se atraviesan— y pasas a limpio cada
          arista tramo a tramo.

  # ═══════════════════════════════════════════════════════════════════
  # SIMULACRO
  # ═══════════════════════════════════════════════════════════════════
  - id: simulacro
    titulo: El simulacro, una hoja entera de una sentada
    apunte:
      texto: 'sin reloj — no se sabe cuánto dura'
      tono: marco
    pide: >-
      Los tres o cuatro apartados de una hoja, sobre su figura, uno detrás de
      otro y sin la resolución al lado.
    porque: >-
      Los bloques de arriba entrenan cada construcción por separado, y en una
      hoja van juntas: la 52 pasa de un agujero perpendicular a un tronco de
      pirámide, a cuatro ángulos y a una chapa paralela. Las cuatro tienen su
      página, con cada apartado resuelto paso a paso: el
      [Ejercicio 52](/road-to-ingenieria/expresion-grafica/examenes/ejercicio-52/),
      el [53](/road-to-ingenieria/expresion-grafica/examenes/ejercicio-53/),
      el [54](/road-to-ingenieria/expresion-grafica/examenes/ejercicio-54/) y
      el [55](/road-to-ingenieria/expresion-grafica/examenes/ejercicio-55/).
      Son hojas sin fecha: no dicen de qué curso son, y solo la 54 se titula
      «Examen». Si solo te da tiempo a una, la 54: es también la única que pide
      las cinco construcciones de arriba.


      Para hacerlas a mano, las figuras originales están en el
      [PDF de la colección](/road-to-ingenieria/examenes/expresion-grafica/coleccion-de-ejercicios.pdf#page=53),
      de la pág. 53 a la 66; si las imprimes, a tamaño real, y las del 53 al
      55 son A3.
    dominio: >-
      Haces una hoja entera a lápiz sin abrir ninguna resolución, después la
      corriges apartado a apartado en su página y cuentas cuántos puntos de la
      construcción habrías dado por buenos sin serlo.
    material:
      - tipo: teoria
        tema: t01-sistemas-de-representacion
        apartado: cómo-es-el-control-del-bloque-1
        nota: >-
          Cómo son las cuatro hojas: cuántos apartados traen, a qué escala y
          en qué idiomas.
    falta:
      - >-
        Sin reloj. Ni las hojas ni las presentaciones de la asignatura que hay
        en el material dicen cuánto dura el control, y la guía docente no está
        en él. Hasta que se sepa, ni las páginas de las hojas ni esta ruta
        ponen un cronómetro: uno inventado entrenaría para un examen que no
        existe.
    revisado: '2026-10-08'

  # ═══════════════════════════════════════════════════════════════════
  # FORMULARIO
  # ═══════════════════════════════════════════════════════════════════
  - id: formulario
    titulo: Lo que hay que llevar sabido
    apunte:
      texto: 'repaso, no aprendizaje'
      tono: marco
    pide: >-
      Nada con esas palabras. Pero cada apartado se resuelve con reglas que se
      aplican sin pararse: el ángulo recto que se ve, la perpendicular contra
      la horizontal y la frontal, qué se pone de canto o de punta para cada
      distancia.
    porque: >-
      Va el último porque es repaso: cuando llegues aquí ya lo habrás usado
      todo. Los apartados «Lo que hay que llevar sabido» de los temas 1, 3, 4,
      5 y 6 están juntos en
      [el formulario de Expresión Gráfica](/road-to-ingenieria/expresion-grafica/formulario/),
      con los del bloque 2 detrás. El tema 2 no tiene ese apartado, y su regla,
      la del ángulo recto que se ve, va enlazada abajo.
    dominio: >-
      Escribes de memoria, en papel, la regla del ángulo recto que se ve, cómo
      se trazan las dos proyecciones de la perpendicular a un plano y qué se
      pone de canto o de punta para cada distancia, sin consultar nada.
    material:
