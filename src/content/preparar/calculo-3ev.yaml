asignatura: calculo
evaluacion: tercera
# Y también las DOS recuperaciones, que a pesar de sus nombres no recuperan la
# cuarta ni la quinta evaluación: son el mismo examen —«PRIMER CUATRIMESTRAL
# (sólo para alumnos con el primer cuatrimestral suspendido)», explicado en
# `content.config.ts` junto a SUFIJO_CONV— repartido en dos fechas, y su
# alcance es el primer cuatrimestre entero: los temas 1 a 5.
#
# Van las dos a esta ruta y no a la 1.ª porque **esta es la única que cubre los
# cinco temas**. Medido sobre el corpus, sus 31 ejercicios son de los temas 1 a
# 4, todos dentro de este alcance; que la de la cuarta solo haya preguntado los
# temas 1 y 2 en sus seis convocatorias es una propiedad de esa muestra, no del
# alcance del examen, y mandar a un alumno a la ruta de la 1.ª evaluación por
# eso sería estrecharle el temario sin motivo.
tambienPrepara:
  - recuperacion-cuarta
  - recuperacion-quinta
titulo: Preparar la tercera evaluación
lede: >-
  El final, y el 17,5 % de la nota: entran los cinco temas y son seis
  ejercicios en vez de cuatro. Pero no entran a partes iguales. De los 62
  ejercicios de los once años, 26 son de integración y 13 de Taylor; los cinco
  temas caben en siete huecos, y esto va por lo que rinde cada uno.
  **También prepara la recuperación del primer cuatrimestre.**
temas:
  - t01-complejos
  - t02-sucesiones
  - t03-funciones-reales
  - t04-estudio-local
  - t05-integracion
  # Varias variables no es de esta evaluación, pero ha caído dos de los once
  # años. Está aquí para que su bloque pueda enlazar la teoría, y ese bloque
  # dice en su `porque` que son dos de once.
  - t06-varias-variables
medidoSobre: 11
criterioDeOrden: >-
  Por número de años en que ha caído cada hueco, con una excepción al
  principio. El de complejos va primero aunque no sea el que más puntos vale,
  porque es el ejercicio 1 de los once exámenes y porque ya lo preparaste para
  la primera evaluación: son puntos que empiezas teniendo. Después, integración
  y Taylor, que entre los dos son casi dos tercios del examen. Al final los
  exámenes enteros y el formulario, que son repaso y no aprendizaje.


  **Cómo se han determinado los huecos de esta ruta.** Un bloque sin `falta[]`
  no es un bloque sin mirar: el 29 de agosto de 2026 se pasaron los sesenta y
  dos bloques de las siete rutas por tres criterios medidos —si su tema tiene
  pocos ejemplos de entrada para lo que el examen le exige, si sus ejercicios
  usan una herramienta que la prosa de ese tema no nombra, y si algún escalón
  suyo empieza directamente en un ejercicio de examen— y solo se declara lo que
  sale de alguno de ellos. Lo que no aparece aquí es porque ninguno de los tres
  lo señaló.
bloques:
  # ─────────────────────────────────────────────────────────────────────
  - id: complejos-el-primero
    apunte:
      texto: 'cae los 11 años — siempre el ejercicio 1'
      tono: nota
    titulo: El ejercicio 1, que siempre es de complejos
    pide: >-
      Lo mismo que en la primera evaluación: representar los complejos que
      cumplen una o dos condiciones, o resolver una ecuación en el plano.
    porque: >-
      Los once años, sin faltar uno, y siempre en el mismo sitio: el primero.
      Va aquí arriba porque es material que ya estudiaste y porque empezar el
      final con un ejercicio conocido cambia cómo va el resto de la hora.
    invariante:
      anios: 11
      fuente: >-
        Ejercicio 1 de tema 1 en las once terceras evaluaciones, de 2015-2016 a
        2025-2026.
    dominio: >-
      Hacer tres de estos seguidos, del más reciente hacia atrás, sin abrir
      ninguna pista y en menos de quince minutos cada uno. Si ya tienes cerrada
      la ruta de la primera evaluación, esto es una comprobación, no estudio.
    escalones:
      - id: lugares
        titulo: Los que son un lugar geométrico
        aprendes: >-
          Traducir una o dos condiciones en figuras y dibujar la intersección,
          con su borde y sus puntos excluidos.
        dominio: >-
          Hacer tres seguidos sin abrir pista. Si tienes cerrado el bloque de
          regiones de la primera evaluación, esto ya está.
        teoria:
          tema: t01-complejos
          apartado: lugares-geométricos-traducir-la-condición-a-una-distancia
          nota: >-
            Ocho de los once son un lugar geométrico. Las traducciones y las
            tres figuras están aquí.
        ejercicios:
          - id: ej-disco-y-borde
            incrustado: true
            nota: >-
              Un disco y su borde: la traducción de la que salen todas las demás regiones.
          - id: ex2526-3ev-1-medio-disco
            incrustado: true
            nota: >-
              El del curso pasado. Del más reciente hacia atrás, que es como
              mejor se ve hacia dónde va el formato.
          - id: ex2223-3ev-1-parte-real-de-un-cociente
          - id: ex2122-3ev-1-semirrecta-cortada
          - id: ex2021-3ev-1-semiplano-con-mordisco
          - id: ex1920-3ev-1-dos-discos-que-se-solapan
          - id: ex1819-rec-1-una-desigualdad-que-no-esta-definida
            nota: >-
              De la recuperación del primer cuatrimestre, y el más difícil de
              todos los lugares geométricos: antes de dibujar nada hay que
              decidir qué significa una desigualdad entre complejos.

      - id: ecuaciones
        titulo: Los que son una ecuación
        aprendes: >-
          Resolver una ecuación en el plano complejo con raíces, conjugado o
          módulo, sin perder soluciones.
        dominio: >-
          Que salgan siempre todas las raíces y que no se te escape el caso
          z igual a cero cuando la ecuación lo admite.
        teoria:
          tema: t01-complejos
          apartado: raíces-n-ésimas-cuántas-hay-y-por-qué-están-repartidas
          nota: >-
            Las raíces reparten el ángulo a partes iguales. Si no salen n, o no
            están equiespaciadas, hay un error antes.
        ejercicios:
          - id: ej-polar-de-uno-mas-i
            incrustado: true
            nota: >-
              Pasar a polar, que es lo que hace falta antes de girar nada.
          - id: ex2425-3ev-1-dos-triangulos
            nota: Una ecuación de grado siete que esconde dos triángulos.
          - id: ex2324-3ev-1-tangente-compleja
            nota: >-
              El único de los once con una tangente compleja. Sale de la
              definición exponencial, no de la trigonometría real.
          - id: ex1819-3ev-1-conjugado-en-la-ecuacion
          - id: ex1718-3ev-1-cubo-igual-a-menos-el-modulo
          - id: ex1617-3ev-1-triangulo-y-fundamental
          - id: ex1516-3ev-1-dos-definiciones
          - id: ex1920-rec-2-coseno-igual-a-dos
            nota: >-
              De la recuperación del primer cuatrimestre. La ecuación que en
              los reales no existe, y la explicación de por qué en $\mathbb{C}$
              sí: el coseno complejo no está acotado.
          - id: ex2021-rec-2-la-ecuacion-que-se-desarma-sola
            nota: >-
              El contrario del anterior: aquí el valor pedido sí está en
              $[-1,1]$, y todas las soluciones salen reales. Los dos juntos
              enseñan a saber qué esperar antes de calcular.

  # ─────────────────────────────────────────────────────────────────────
  - id: taylor
    apunte:
      texto: '10 de 11 — el que distingue esta evaluación'
      tono: neutro
    titulo: Taylor de algo que no se puede calcular
    pide: >-
      El polinomio de Maclaurin de una función definida por una integral, por
      una inversa o por una ecuación implícita — es decir, de algo que no se
      puede derivar a mano tantas veces.
    porque: >-
      Diez de los once años, y es el hueco que mejor distingue esta evaluación
      de la segunda. Allí Taylor se aplicaba a funciones conocidas; aquí la
      función no se puede escribir, y la gracia está en sacar los coeficientes
      sin derivarla. En 2024-2025 el enunciado pedía dos derivadas de orden
      alto y la respuesta correcta no derivaba ni una vez.
    invariante:
      anios: 10
      fuente: >-
        Un ejercicio de tema 4 en todas las terceras evaluaciones menos la de
        2015-2016. Trece ejercicios en total.
    dominio: >-
      Ante una función dada por una integral con extremo variable, escribir su
      polinomio de Maclaurin de orden 4 sin calcular la integral. Y saber hacer
      el camino de vuelta: leer una derivada de orden alto del coeficiente del
      desarrollo, en vez de derivar.
    escalones:
      - id: el-atajo
        titulo: Componer en vez de derivar
        aprendes: >-
          Obtener el desarrollo de una función complicada partiendo de uno de
          los seis conocidos, sin calcular derivadas sucesivas.
        dominio: >-
          Que ante un polinomio de Maclaurin tu primer instinto sea buscar de
          cuál de los seis sale, y solo derives si de verdad no sale de ninguno.
        teoria:
          tema: t04-estudio-local
          apartado: seis-desarrollos-que-conviene-tener-memorizados
          nota: >-
            Aquí está el atajo: casi todos estos ejercicios se hacen
            componiendo uno de los seis, no derivando la función que te dan.
        ejercicios:
          - id: ej-taylor-orden-dos
            incrustado: true
            nota: >-
              Si vienes de cero, empieza aquí: el desarrollo más simple, con su
              cota del resto.
          - id: ocho-series-de-potencias
            nota: Ocho desarrollos y solo tres hay que calcular.
          - id: taylor-tangente-de-dos-grados
          - id: ex2122-3ev-3-serie-del-seno-hiperbolico
          - id: ex1819-3ev-4-serie-del-logaritmo-del-cociente
          - id: ex1718-3ev-4-serie-del-logaritmo-y-la-armonica

      - id: funciones-que-no-se-pueden-escribir
        titulo: Taylor de una integral, una inversa o una implícita
        aprendes: >-
          Sacar los coeficientes del desarrollo de una función que no se puede
          expresar, derivándola con el teorema fundamental o implícitamente.
        dominio: >-
          Que no te bloquee ver una integral sin primitiva elemental: la
          derivada la da el teorema fundamental y con eso basta.
        teoria:
          tema: t04-estudio-local
          apartado: el-polinomio-de-taylor-es-la-mejor-imitación-local
        ejercicios:
          - id: maclaurin-sin-integrar
            nota: >-
              Dos polinomios de una función integral sin calcular la integral.
              Es exactamente la técnica que piden los de examen.
          - id: ex2526-3ev-4-taylor-del-logaritmo
          - id: ex2425-3ev-3-mclaurin-del-coseno
            nota: >-
              Dos derivadas de orden alto sin derivar ni una vez: se leen del
              coeficiente del desarrollo.
          - id: ex2324-3ev-2-taylor-de-la-inversa
          - id: ex2223-3ev-3-mclaurin-del-logaritmo
          - id: ex2021-3ev-2-mclaurin-de-la-integral

      - id: aproximar-y-acotar
        titulo: Aproximar un número, con su cota
        aprendes: >-
          Usar el polinomio para dar un valor y acotar el error con el resto de
          Lagrange.
        dominio: >-
          Que la cota salga sola detrás del número, sin que el enunciado tenga
          que pedirla.
        teoria:
          tema: t04-estudio-local
          apartado: el-resto-es-la-parte-que-se-suele-olvidar-y-es-la-que-se-pregunta
        ejercicios:
          - id: cuantos-terminos-hacen-falta
          - id: ex1920-3ev-2-raiz-de-dos-por-taylor
          - id: ex1617-3ev-3-raiz-cubica-de-nueve

  # ─────────────────────────────────────────────────────────────────────
  - id: areas-y-volumenes
    apunte:
      texto: '9 de 11 — el ejercicio más largo del examen'
      tono: neutro
    titulo: Áreas, volúmenes y lo que barre un recinto al girar
    pide: >-
      Dibujar un recinto, calcular su área, y el volumen o la superficie que
      engendra al girar alrededor de un eje que casi nunca es OX.
    porque: >-
      Nueve de los once años, y es el ejercicio más largo del examen: suele
      traer tres apartados encadenados. El área se le da bien a casi todo el
      mundo; donde se pierden los puntos es en el eje de giro, porque los
      discos solo valen si el eje es horizontal y el enunciado casi siempre
      pone uno vertical o desplazado.
    invariante:
      anios: 9
      fuente: >-
        Un recinto con su área y su volumen de revolución en 2015-16, 2016-17,
        2017-18, 2018-19, 2021-22, 2022-23, 2023-24, 2024-25 y 2025-26. Solo
        faltan 2019-20 y 2020-21.
    dominio: >-
      Delante de un enunciado nuevo, decidir en menos de un minuto si integras
      en x o en y y si usas discos o capas, y saber decir por qué. Y que el
      dibujo del recinto salga antes que la primera integral, siempre.
    escalones:
      - id: el-area
        titulo: El área de un recinto
        aprendes: >-
          Dibujar el recinto, encontrar los cortes y plantear la integral con
          la curva de arriba menos la de abajo.
        dominio: >-
          Que el dibujo salga antes que la integral, y que compruebes con un
          punto cuál va por encima en vez de suponerlo.
        teoria:
          tema: t05-integracion
          apartado: áreas-y-volúmenes-el-mismo-esquema
          nota: >-
            Área entre curvas, discos y arandelas. Y por qué los volúmenes no
            se restan como se restan las áreas.
        ejercicios:
          - id: ej-area-entre-curvas
            incrustado: true
            nota: >-
              Empieza aquí. Dos curvas que todo el mundo sabe dibujar, y el
              punto de prueba que decide el orden de la resta.
          - id: area-entre-parabola-y-dos-tangentes
          - id: parabola-y-su-tangente-paralela
          - id: parabola-y-sus-dos-tangentes-en-los-cortes
          - id: raiz-frente-a-valor-absoluto
          - id: parametro-por-area
          - id: parabola-tumbada
            nota: >-
              Por qué a veces conviene integrar en y. Es el mismo criterio que
              decide entre discos y capas.

      - id: el-volumen
        titulo: El volumen al girar, y el eje que lo decide
        aprendes: >-
          Elegir entre discos y capas mirando si los cortes son perpendiculares
          o paralelos al eje de giro.
        dominio: >-
          Que nunca escribas la integral de discos con un eje vertical. La
          comprobación es de un segundo y es la que más puntos salva.
        teoria:
          tema: t05-integracion
          apartado: girar-alrededor-de-oy-que-es-el-caso-que-de-verdad-cae
          nota: >-
            Con la figura de los dos cortes. Discos en y si se puede despejar,
            capas si no, y Pappus si aparece un centroide.
        ejercicios:
          - id: ej-volumen-por-discos
            incrustado: true
            nota: >-
              Empieza aquí, con el eje horizontal y un sólido que se puede
              comprobar con la fórmula del cono.
          - id: giro-alrededor-de-y-igual-1
            nota: Y ahora con un eje que no pasa por el origen.
          - id: elipsoides
          - id: formulas-clasicas-con-integrales
            nota: >-
              De dónde salen las cinco fórmulas de volumen que te sabes de
              memoria. Sirve de comprobación de todo el escalón.
          - id: area-y-volumen-exponencial
          - id: ex2526-3ev-5-parabola-tumbada-y-tangente
          - id: ex2425-3ev-4-recinto-y-volumen
          - id: ex2324-3ev-4-area-de-la-elipse
          - id: ex2223-3ev-4-sector-de-45-grados
          - id: ex2122-3ev-6-parabola-y-recta-paralela
          - id: ex1819-3ev-6-parabola-y-sus-dos-tangentes
          - id: ex1718-3ev-5-parabola-recta-y-eje
          - id: ex1617-3ev-4-el-lazo
          - id: ex1516-3ev-5-integral-y-solido-sobre-y-igual-uno

      - id: arco-y-superficie
        titulo: La longitud del arco, y lo que barre
        aprendes: >-
          Calcular la longitud de una curva y el área de la superficie que
          engendra al girar.
        dominio: >-
          Distinguir cuándo se integra en dx y cuándo en ds. Un volumen se
          llena con trozos de la región; una superficie se forra con trozos de
          la curva.
        teoria:
          tema: t05-integracion
          apartado: longitud-de-arco
          nota: >-
            Con la figura del triángulo infinitesimal, que es de donde sale la
            raíz.
        ejercicios:
          - id: longitud-de-arco-parabola
          - id: ex2425-3ev-6-area-de-revolucion

  # ─────────────────────────────────────────────────────────────────────
  - id: teorema-fundamental
    apunte:
      texto: '8 de 11 — tres años pidió enunciar y demostrar'
      tono: nota
    titulo: El teorema fundamental, y las funciones integrales
    pide: >-
      Enunciar el teorema fundamental y deducir de él la regla de Barrow, o
      derivar y estudiar una función definida por una integral con el extremo
      variable.
    porque: >-
      Ocho de los once años, y en tres seguidos —2018-19, 2019-20 y 2020-21— el
      enunciado fue literalmente «enunciar y demostrar». Es el bloque de COMP4
      de esta evaluación: hay años en que estos puntos no exigen calcular nada
      y se pierden enteros por no tener el enunciado escrito.
    invariante:
      anios: 8
      fuente: >-
        Teorema fundamental, Barrow o una función integral en 2015-16, 2016-17,
        2018-19, 2019-20, 2020-21, 2021-22, 2023-24 y 2025-26.
    dominio: >-
      Escribir de memoria las dos partes del teorema con sus hipótesis y
      deducir Barrow de la primera, en papel y sin apuntes. Y derivar una
      función integral con los dos extremos variables sin olvidar la cadena en
      ninguno de los dos.
    escalones:
      - id: derivar-una-integral
        titulo: Derivar una función integral
        aprendes: >-
          Derivar una integral con extremos variables sin calcularla, aplicando
          la cadena en cada extremo.
        dominio: >-
          Que la fórmula con los dos extremos variables te salga sola, y que no
          se te olvide la derivada del límite superior.
        teoria:
          tema: t05-integracion
          apartado: el-teorema-fundamental-en-sus-dos-mitades
          nota: >-
            La primera parte dice por qué existe la primitiva, la segunda cómo
            usarla. Y la fórmula con límites variables, que es lo que más se
            pregunta.
        ejercicios:
          - id: ej-derivar-funcion-integral
            incrustado: true
            nota: >-
              Empieza aquí. Un extremo constante y otro variable, con la
              comprobación por el camino largo.
          - id: derivar-sin-integrar
            nota: Seis derivadas sin calcular ninguna integral.
          - id: funciones-integrales-a-trozos
          - id: ecuacion-con-funcion-integral
          - id: ex2526-3ev-6-valor-medio-y-funcion-integral
          - id: ex2324-3ev-3-funcion-integral-menos-exponencial
          - id: ex2122-3ev-5-funcion-error
          - id: ex1920-3ev-3-identificar-las-tres-graficas
            nota: >-
              Este junta las dos evaluaciones: hay que decir cuál de las tres
              curvas es la función, cuál su derivada y cuál su integral.

      - id: barrow-demostrado
        titulo: Enunciar y demostrar Barrow
        aprendes: >-
          Enunciar las dos partes del teorema con sus hipótesis y deducir la
          regla de Barrow de la primera.
        dominio: >-
          Escribirlo entero en papel sin apuntes. Cayó tres años seguidos con
          casi las mismas palabras, así que aquí la memoria sí paga.
        teoria:
          tema: t05-integracion
          apartado: el-teorema-fundamental-en-sus-dos-mitades
        ejercicios:
          - id: ej-derivar-funcion-integral
            nota: >-
              Derivar una integral sin calcularla: la primera mitad del teorema, usada.
          - id: ex2021-3ev-4-barrow-demostrado
          - id: ex1920-3ev-4-barrow-otra-vez
          - id: ex1819-3ev-3-barrow-tercera-vez
          - id: ex1617-3ev-2-dos-demostraciones

      - id: valor-medio
        titulo: El valor medio, y la función media
        aprendes: >-
          Calcular el valor medio de una función, y distinguirlo de la función
          media, que es otra cosa.
        dominio: >-
          Que sepas de un vistazo cuál te piden: si en la respuesta no aparece
          ninguna x, era el valor medio.
        teoria:
          tema: t05-integracion
          apartado: el-valor-medio-es-una-altura
          nota: >-
            Con la figura del rectángulo. La continuidad no es un adorno: sin
            ella la altura no se alcanza.
        ejercicios:
          - id: teorema-de-la-media
          - id: parametro-para-la-media
          - id: continuidad-media-y-derivabilidad
          - id: funcion-media-frente-a-valor-medio
            nota: El ejercicio que existe para que no se confundan.
          - id: ex1516-3ev-2-funcion-valor-medio

  # ─────────────────────────────────────────────────────────────────────
  - id: de-la-segunda-evaluacion
    apunte:
      texto: '8 de 11 traen un ejercicio que vuelve'
      tono: neutro
    titulo: Lo que vuelve de la segunda evaluación
    pide: >-
      Un teorema de continuidad enunciado y aplicado, una inversa, una
      implícita o un problema de optimización.
    porque: >-
      Ocho de los once años traen al menos un ejercicio de los temas 3 y 4 que
      no es de Taylor. No es un bloque nuevo: es la ruta de la segunda
      evaluación comprobada, y por eso es corto. Lo que cambia es el envoltorio
      — aquí suelen venir mezclados con una integral en el mismo enunciado.
    invariante:
      anios: 8
      fuente: >-
        Punto fijo, inversas, límites por sucesiones, implícitas u optimización
        en 2015-16, 2017-18, 2018-19, 2020-21, 2022-23, 2023-24, 2024-25 y
        2025-26.
    dominio: >-
      Reconocer, leyendo el enunciado, cuál de los cinco teoremas te están
      pidiendo, y escribirlo con sus hipótesis antes de empezar a operar. Si
      tienes cerrada la ruta de la segunda evaluación, esto ya está.
    escalones:
      - id: los-teoremas
        titulo: Reconocer qué teorema te piden
        aprendes: >-
          Leer un enunciado largo y ver cuál de los cinco teoremas lo resuelve,
          con sus hipótesis.
        dominio: >-
          Que ante un enunciado con contexto sepas separar el decorado del
          teorema que hay debajo.
        teoria:
          tema: t03-funciones-reales
          apartado: el-punto-fijo-que-es-bolzano-disfrazado
          nota: >-
            El que más ha caído aquí: dos veces con unicidad incluida, que es
            un argumento aparte del de existencia.
        ejercicios:
          - id: ej-bolzano-una-raiz
            incrustado: true
            nota: >-
              Un teorema de continuidad aplicado a un caso concreto, antes de enunciarlo.
          - id: ex2526-3ev-3-satelite
            incrustado: true
            nota: >-
              El del curso pasado, y el que mejor enseña el formato: un
              enunciado largo que por dentro es un teorema conocido.
          - id: ex2324-3ev-5-particula-y-teoremas
            nota: >-
              Cuatro teoremas y hay que decir cuál se aplica en cada apartado.
              Es la prueba de fuego del bloque.
          - id: ex1718-3ev-3-definiciones-y-punto-fijo
          - id: ex1516-3ev-3-punto-fijo-con-unicidad

      - id: limites-e-inversas
        titulo: Límites por sucesiones, e inversas
        aprendes: >-
          Negar la existencia de un límite con dos sucesiones, y derivar una
          función inversa.
        dominio: >-
          Que la técnica de las dos sucesiones te salga sola, porque es la
          misma que niega una convergencia en el tema 2.
        teoria:
          tema: t03-funciones-reales
          apartado: un-límite-no-existe-si-dos-caminos-discrepan
        ejercicios:
          - id: ej-inversa-con-signo
            incrustado: true
            nota: >-
              Una inversa y el signo que hay que elegir, que es la mitad de este hueco.
          - id: ex1819-3ev-2-limite-por-sucesiones-y-composicion
          - id: ex1516-3ev-4-inversa-del-coseno-hiperbolico

      - id: optimizar-y-tangentes
        titulo: Optimización y tangentes impuestas
        aprendes: >-
          Resolver un problema de máximos o mínimos, o encontrar tangentes con
          una condición de pendiente.
        dominio: >-
          El mismo criterio del bloque de optimización de la segunda: llegar a
          una sola variable con su intervalo antes de derivar.
        teoria:
          tema: t04-estudio-local
          apartado: optimizar-es-traducir-no-derivar
        ejercicios:
          - id: ej-optimizar-rectangulo
            incrustado: true
            nota: >-
              Optimizar con la restricción a la vista, antes de que la esconda un enunciado.
          - id: ex2425-3ev-5-triangulo-de-area-minima
          - id: ex2223-3ev-2-tangentes-perpendiculares
          - id: ex2021-3ev-3-bidon-cerrado

  # ─────────────────────────────────────────────────────────────────────
  - id: integrales
    apunte:
      texto: '5 de 11 como ejercicio propio — y dentro de todos'
      tono: neutro
    titulo: Las integrales sueltas, y las impropias
    pide: >-
      Calcular una integral por el método que toque, o decidir si una impropia
      converge y cuánto vale.
    porque: >-
      Cinco de los once años traen una integral como ejercicio propio, y
      además todas las integrales de los otros bloques hay que saber
      resolverlas. Las impropias son el sitio donde más se regalan puntos:
      aplicar Barrow sobre una discontinuidad da un número creíble y falso, y
      el examen pone ese caso a propósito.
    invariante:
      anios: 5
      fuente: >-
        Una integral o una impropia como ejercicio independiente en 2017-18,
        2018-19, 2019-20, 2020-21 y 2022-23.
    dominio: >-
      Mirar una integral y saber en diez segundos por qué método va. Y antes de
      aplicar Barrow, comprobar siempre si el integrando explota dentro del
      intervalo, aunque nada en el enunciado lo sugiera.
    escalones:
      - id: los-metodos
        titulo: Elegir el método
        aprendes: >-
          Mirar una integral y saber si va por inmediata, por partes, por
          fracciones simples o por cambio de variable.
        dominio: >-
          Decidirlo en diez segundos, y en las racionales comprobar el grado
          antes de descomponer.
        teoria:
          tema: t05-integracion
          apartado: los-cuatro-métodos-y-cuándo-usar-cada-uno
          nota: >-
            La tabla de qué método para qué forma, ALPES para las partes, y la
            comprobación del grado antes de descomponer una racional.
        ejercicios:
          - id: integrales-inmediatas
            incrustado: true
            nota: >-
              Diez inmediatas. Reconocer una derivada escondida es lo que
              ahorra el tiempo que después hace falta en el ejercicio largo.
          - id: integracion-por-partes
          - id: integrales-racionales
          - id: integrales-irracionales
          - id: integrales-trigonometricas
          - id: ex2223-3ev-5-integral-de-un-valor-absoluto
          - id: ex2021-3ev-5-dos-integrales-con-trampa
          - id: ex1920-3ev-5-integral-por-la-tangente
          - id: ex1819-3ev-5-sumas-y-una-integral-homogenea
          - id: ex1718-3ev-6-integral-con-tangente

      - id: impropias
        titulo: Las impropias, y la trampa que no se ve
        aprendes: >-
          Reconocer los dos tipos de impropia, sustituir el punto conflictivo
          por un límite y decidir si converge.
        dominio: >-
          Que antes de aplicar Barrow mires siempre si el integrando explota
          dentro del intervalo. Las de tipo 2 no avisan.
        teoria:
          tema: t05-integracion
          apartado: impropias-dos-formas-de-romperse
          nota: >-
            Las de tipo 2 no se ven. Y los dos límites hay que tomarlos por
            separado, o lo que sale es el valor principal, que no es lo mismo.
        ejercicios:
          - id: ej-impropia-que-converge
            incrustado: true
            nota: >-
              Empieza aquí. Una de primer tipo que converge, con el contraste
              del exponente que la haría divergir.
          - id: impropias-primer-tipo
          - id: impropias-segundo-tipo
            nota: >-
              Cuatro que divergen aunque Barrow diga otra cosa. Es el ejercicio
              que enseña por qué hay que mirar antes de integrar.
          - id: ex2122-3ev-4-integral-que-no-converge

  # ─────────────────────────────────────────────────────────────────────
  - id: sucesiones-y-series
    apunte:
      texto: '5 de 11 — pero 10 puntos cuando cae'
      tono: nota
    titulo: Sucesiones y series, que también vuelven
    pide: >-
      Decidir si una serie converge y sumarla, o razonar si una afirmación
      sobre sucesiones es verdadera o falsa.
    porque: >-
      Cinco de los once años. Es el hueco menos frecuente del final, y aun así
      son diez puntos cuando cae. Va aquí abajo por eso, no porque se pueda
      saltar: los dos últimos cursos que lo trajeron son 2024-2025 y 2025-2026,
      así que la tendencia es al alza.
    invariante:
      anios: 5
      fuente: >-
        Un ejercicio de tema 2 en las terceras evaluaciones de 2016-17,
        2017-18, 2021-22, 2024-25 y 2025-26.
    dominio: >-
      Ver de qué tipo es una serie sin probar fórmulas, y demostrar la suma de
      la geométrica de memoria, que es lo que pidió 2017-2018. Si tienes
      cerrada la ruta de la primera evaluación, esto es repaso.
    escalones:
      - id: sumar-series
        titulo: Sumar una serie
        aprendes: >-
          Reconocer el tipo de serie y sumarla, con la demostración de la
          fórmula si te la piden.
        dominio: >-
          Que la geométrica te salga de memoria, incluida la versión que no
          empieza en cero, y que sepas demostrarla.
        teoria:
          tema: t02-sucesiones
          apartado: series-sumar-infinitos-términos
          nota: >-
            La condición necesaria sirve para descartar, nunca para confirmar.
            Y la geométrica hay que tenerla en la punta de los dedos.
        ejercicios:
          - id: ej-suma-geometrica
            incrustado: true
            nota: Si vienes de cero, empieza aquí.
          - id: serie-geometrica
            nota: Con su demostración, que es lo que pidió 2017-2018.
          - id: alpinista-geometrica
          - id: ex2526-3ev-2-hipergeometricas
          - id: ex2425-3ev-2-pelota-que-bota
          - id: ex1718-3ev-2-suma-de-la-geometrica

      - id: negar-convergencias
        titulo: Decidir si una afirmación es verdadera
        aprendes: >-
          Razonar sobre sucesiones con contraejemplos y con subsucesiones que
          discrepan.
        dominio: >-
          Que ante un verdadero o falso busques primero un contraejemplo, que
          es más rápido que demostrar.
        teoria:
          tema: t02-sucesiones
          apartado: qué-significa-exactamente-converger
          nota: >-
            Dos subsucesiones que discrepan tumban una convergencia en una
            línea, sin épsilon ninguno.
        ejercicios:
          - id: alternante-frente-a-salto
          - id: ex2122-3ev-2-verdadero-o-falso
          - id: ex1617-3ev-5-convergencia-y-la-derivada-de-x
          - id: ex2021-rec-3-la-desigualdad-estricta-no-sobrevive
            nota: >-
              De la recuperación del primer cuatrimestre, y el formato exacto
              de este escalón: una afirmación cierta que hay que demostrar y
              una falsa que hay que tumbar con un contraejemplo.
          - id: ex1718-rec-3-dos-sucesiones-a-trozos
            nota: >-
              Dos sucesiones con las mismas dos fórmulas, y solo converge una.
              Negar una convergencia por subsucesiones, en su forma más limpia.

  # ─────────────────────────────────────────────────────────────────────
  - id: el-gradiente-que-se-cuela
    apunte:
      texto: 'no toca — y ha caído 2 de 11'
      tono: neutro
    titulo: El tema que no toca, y que aun así ha caído dos veces
    pide: >-
      «Hacia dónde escapa la cucaracha», «ajustar el gradiente para que apunte
      a la bisectriz».
    porque: >-
      La tercera evaluación es de los temas 1 a 5, y **dos de los once años
      trajeron un ejercicio de varias variables**: 2019-2020 y 2020-2021. Dos de
      once no es un hueco fiable, y por eso este bloque va al final y es corto.
      Está aquí por una razón concreta: si cae y no lo has visto nunca, son diez
      puntos que ni se intentan.
    invariante:
      anios: 2
      fuente: >-
        Los dos ejercicios con `tema: t06-varias-variables` de los once
        exámenes de tercera evaluación transcritos: el número 6 de 2019-2020 y
        el número 6 de 2020-2021.
    dominio: >-
      Que ante «hacia dónde» contestes con el gradiente y ante «cuánto sube»
      con su módulo. No hace falta más para estos dos.
    escalones:
      - id: las-tres-preguntas-en-corto
        titulo: Las tres preguntas del gradiente, y nada más
        aprendes: >-
          Calcular el gradiente de una función de dos variables y usarlo para
          contestar hacia dónde crece más, cuánto, y por dónde no cambia.
        dominio: >-
          Que la derivada direccional te salga como el producto escalar del
          gradiente por un vector **unitario**, que es donde falla casi todo el
          mundo la primera vez.
        teoria:
          tema: t06-varias-variables
          apartado: el-gradiente-contesta-las-tres-preguntas
          nota: >-
            Con este apartado basta para los dos ejercicios. El tratamiento
            completo del tema está en la ruta de la cuarta evaluación, que es
            donde de verdad se examina.
        ejercicios:
          - id: ej-gradiente-tres-preguntas
            incrustado: true
            nota: >-
              El ejemplo de entrada, para llegar a los dos de examen sabiendo
              qué es cada cosa.
          - id: ex1920-3ev-6-la-cucaracha
            nota: >-
              De 2019-2020, y es la pregunta directa: hacia dónde escapa, que
              es la dirección en que la temperatura baja más deprisa.
          - id: ex2021-3ev-6-derivada-direccional-maxima
            nota: >-
              De 2020-2021, y va al revés: te dicen hacia dónde tiene que
              apuntar el gradiente y hay que ajustar los parámetros.
    falta:
      - >-
        El plano tangente, la regla de la cadena y los extremos de dos
        variables no han caído nunca en una tercera evaluación, y aquí no se
        preparan. Están en la ruta de la cuarta.
      - >-
        El temario oficial lista «métodos numéricos» también dentro del tema 5,
        y de integración numérica aquí no hay nada: ni trapecios ni Simpson.
        Es el mismo hueco declarado en la ruta de la primera evaluación, y el
        recuento dice que es el sitio donde más cerca ha estado de caer: de los
        425 ejercicios de las 88 convocatorias, **uno** pide aproximar una
        integral —la regla del punto medio con cuatro subintervalos, en la
        extraordinaria de 2012-2013, el examen más antiguo del corpus— y en
        los doce años siguientes no vuelve. De trapecios y de Simpson, cero.
        Contado el 5 de septiembre de 2026.

  # ─────────────────────────────────────────────────────────────────────
  - id: enteros
    apunte:
      texto: 'papel en blanco y reloj'
      tono: neutro
    titulo: Los exámenes enteros, cronometrados
    pide: >-
      Sentarte con el papel en blanco, sin apuntes y con reloj, y hacer los
      seis ejercicios seguidos.
    porque: >-
      Aquí el simulacro pesa más que en las otras dos evaluaciones, porque son
      seis ejercicios de cinco temas distintos y la dificultad de verdad es
      cambiar de tema seis veces sin perder el hilo. Repartir el tiempo es
      parte del examen.
    dominio: >-
      Hacer uno entero dentro del tiempo, sin abrir ninguna pista, y que al
      corregirlo no haya ningún ejercicio en blanco. Y saber, antes de empezar,
      en qué orden vas a atacarlos.
    material:
      - tipo: examen
        curso: '2025-2026'
        convocatoria: tercera
        nota: >-
          Empieza por el último. Cada página abre en blanco: las resoluciones
          están en la otra pestaña y conviene no tocarlas hasta terminar.
      - tipo: examen
        curso: '2024-2025'
        convocatoria: tercera
      - tipo: examen
        curso: '2023-2024'
        convocatoria: tercera
    falta:
      - >-
        No hay cronómetro en la página ni forma de guardar lo que has hecho: el
        sitio es estático y no tiene cuentas de usuario. El reloj lo pones tú.
      - >-
        Dos ejercicios de estos once exámenes se salen de los cinco temas y
        aquí no tienen resolución guiada ni teoría detrás: el 6 de 2019-2020 y
        el 6 de 2020-2021, que son de funciones de varias variables. El tema 6
        todavía no está escrito, así que si tu curso mantiene ese formato, esos
        diez puntos no los cubre esta ruta.

  # ─────────────────────────────────────────────────────────────────────
  - id: formulario
    apunte:
      texto: 'cinco temas de material cerrado'
      tono: marco
    titulo: Lo que hay que llevar sabido
    pide: >-
      El examen no deja formulario, y en el final entra todo. Las definiciones,
      los enunciados de los teoremas y las fórmulas de volumen se piden de
      memoria.
    porque: >-
      Es la evaluación con más material cerrado de las tres: cinco temas de
      definiciones, teoremas y fórmulas. Este bloque va el último porque es el
      repaso de la última hora, y son los cinco formularios de los cinco temas
      en fila.
    dominio: >-
      Escribir en papel, de memoria y sin consultar nada, el teorema
      fundamental con sus dos partes, la tabla de volúmenes con el criterio del
      eje, los seis desarrollos y las siete definiciones de sucesiones. Si
      tienes que mirar una sola vez, todavía no.
    material:
      - tipo: teoria
        tema: t05-integracion
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          Integración: el teorema fundamental, la tabla de áreas y volúmenes
          con el criterio del eje, y cómo elegir método.
      - tipo: teoria
        tema: t04-estudio-local
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          Estudio local: los tres teoremas, Taylor con su resto y los seis
          desarrollos.
      - tipo: teoria
        tema: t03-funciones-reales
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          Funciones reales: continuidad, Bolzano, Weierstrass y punto fijo.
      - tipo: teoria
        tema: t02-sucesiones
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          Sucesiones: las siete definiciones formales y las cuatro sumas.
      - tipo: teoria
        tema: t01-complejos
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          Complejos: las formas, el conjugado y las cinco traducciones de lugar
          geométrico.
    falta:
      - >-
        Los cinco formularios son una segunda copia de cosas que ya están
        explicadas en los temas, y eso tiene un riesgo: si un día se corrige la
        teoría y no se corrige aquí, esto miente. No hay ningún guardián que lo
        compruebe todavía, así que se dice en voz alta.
