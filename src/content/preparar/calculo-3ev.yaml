asignatura: calculo
evaluacion: tercera
titulo: Preparar la tercera evaluación
lede: >-
  El final, y el 17,5 % de la nota: entran los cinco temas y son seis
  ejercicios en vez de cuatro. Pero no entran a partes iguales. De los 62
  ejercicios de los once años, 26 son de integración y 13 de Taylor; los cinco
  temas caben en siete huecos, y esto va por lo que rinde cada uno.
temas:
  - t01-complejos
  - t02-sucesiones
  - t03-funciones-reales
  - t04-estudio-local
  - t05-integracion
medidoSobre: 11
criterioDeOrden: >-
  Por número de años en que ha caído cada hueco, con una excepción al
  principio. El de complejos va primero aunque no sea el que más puntos vale,
  porque es el ejercicio 1 de los once exámenes y porque ya lo preparaste para
  la primera evaluación: son puntos que empiezas teniendo. Después, integración
  y Taylor, que entre los dos son casi dos tercios del examen. Al final los
  exámenes enteros y el formulario, que son repaso y no aprendizaje.

bloques:
  # ─────────────────────────────────────────────────────────────────────
  - id: complejos-el-primero
    titulo: El ejercicio 1, que siempre es de complejos
    pide: >-
      Lo mismo que en la primera evaluación: representar los complejos que
      cumplen una o dos condiciones, o resolver una ecuación en el plano.
    porque: >-
      Los once años, sin faltar uno, y siempre en el mismo sitio: el primero.
      Va aquí arriba porque es material que ya estudiaste y porque empezar el
      final con un ejercicio conocido cambia cómo va el resto de la hora.
    invariante:
      anios: 11
      fuente: >-
        Ejercicio 1 de tema 1 en las once terceras evaluaciones, de 2015-2016 a
        2025-2026.
    dominio: >-
      Hacer tres de estos seguidos, del más reciente hacia atrás, sin abrir
      ninguna pista y en menos de quince minutos cada uno. Si ya tienes cerrada
      la ruta de la primera evaluación, esto es una comprobación, no estudio.
    material:
      - tipo: teoria
        tema: t01-complejos
        apartado: lugares-geométricos-traducir-la-condición-a-una-distancia
        nota: >-
          Ocho de los once son un lugar geométrico. Las traducciones y las tres
          figuras están aquí.
      - tipo: teoria
        tema: t01-complejos
        apartado: raíces-n-ésimas-cuántas-hay-y-por-qué-están-repartidas
        nota: >-
          Y los otros tres son una ecuación. No pierdas la solución z igual a
          cero ni te dejes raíces.

      - tipo: ejercicio
        id: ex2526-3ev-1-medio-disco
        incrustado: true
        nota: >-
          El del curso pasado. Del más reciente hacia atrás, que es como mejor
          se ve hacia dónde va el formato.
      - tipo: ejercicio
        id: ex2425-3ev-1-dos-triangulos
      - tipo: ejercicio
        id: ex2324-3ev-1-tangente-compleja
        nota: >-
          El único de los once con una tangente compleja. Sale de la definición
          exponencial, no de la trigonometría real.
      - tipo: ejercicio
        id: ex2223-3ev-1-parte-real-de-un-cociente
      - tipo: ejercicio
        id: ex2122-3ev-1-semirrecta-cortada
      - tipo: ejercicio
        id: ex2021-3ev-1-semiplano-con-mordisco
      - tipo: ejercicio
        id: ex1920-3ev-1-dos-discos-que-se-solapan
      - tipo: ejercicio
        id: ex1819-3ev-1-conjugado-en-la-ecuacion
      - tipo: ejercicio
        id: ex1718-3ev-1-cubo-igual-a-menos-el-modulo
      - tipo: ejercicio
        id: ex1617-3ev-1-triangulo-y-fundamental
      - tipo: ejercicio
        id: ex1516-3ev-1-dos-definiciones

  # ─────────────────────────────────────────────────────────────────────
  - id: taylor
    titulo: Taylor de algo que no se puede calcular
    pide: >-
      El polinomio de Maclaurin de una función definida por una integral, por
      una inversa o por una ecuación implícita — es decir, de algo que no se
      puede derivar a mano tantas veces.
    porque: >-
      Diez de los once años, y es el hueco que mejor distingue esta evaluación
      de la segunda. Allí Taylor se aplicaba a funciones conocidas; aquí la
      función no se puede escribir, y la gracia está en sacar los coeficientes
      sin derivarla. En 2024-2025 el enunciado pedía dos derivadas de orden
      alto y la respuesta correcta no derivaba ni una vez.
    invariante:
      anios: 10
      fuente: >-
        Un ejercicio de tema 4 en todas las terceras evaluaciones menos la de
        2015-2016. Trece ejercicios en total.
    dominio: >-
      Ante una función dada por una integral con extremo variable, escribir su
      polinomio de Maclaurin de orden 4 sin calcular la integral. Y saber hacer
      el camino de vuelta: leer una derivada de orden alto del coeficiente del
      desarrollo, en vez de derivar.
    material:
      - tipo: teoria
        tema: t04-estudio-local
        apartado: el-polinomio-de-taylor-es-la-mejor-imitación-local
      - tipo: teoria
        tema: t04-estudio-local
        apartado: seis-desarrollos-que-conviene-tener-memorizados
        nota: >-
          Aquí está el atajo: casi todos estos ejercicios se hacen componiendo
          uno de los seis, no derivando la función que te dan.
      - tipo: teoria
        tema: t04-estudio-local
        apartado: el-resto-es-la-parte-que-se-suele-olvidar-y-es-la-que-se-pregunta
        nota: >-
          Y cuando el enunciado pide aproximar un número, la cota del resto
          sigue valiendo tantos puntos como el número.

      - tipo: ejercicio
        id: ocho-series-de-potencias
        incrustado: true
        nota: >-
          Ocho desarrollos y solo tres hay que calcular. Es exactamente la
          técnica que piden los diez de examen.
      - tipo: ejercicio
        id: taylor-tangente-de-dos-grados
      - tipo: ejercicio
        id: cuantos-terminos-hacen-falta
      - tipo: ejercicio
        id: maclaurin-sin-integrar
        nota: >-
          Del boletín de integración, pero es de Taylor: dos polinomios de una
          función integral sin calcular la integral.

      - tipo: ejercicio
        id: ex2526-3ev-4-taylor-del-logaritmo
        nota: >-
          Los diez de examen, del más reciente hacia atrás. Los cinco primeros
          son la variante dura: la función viene dada por una integral, una
          inversa o una gráfica.
      - tipo: ejercicio
        id: ex2425-3ev-3-mclaurin-del-coseno
      - tipo: ejercicio
        id: ex2324-3ev-2-taylor-de-la-inversa
      - tipo: ejercicio
        id: ex2223-3ev-3-mclaurin-del-logaritmo
      - tipo: ejercicio
        id: ex2021-3ev-2-mclaurin-de-la-integral
      - tipo: ejercicio
        id: ex2122-3ev-3-serie-del-seno-hiperbolico
        nota: >-
          Estos cuatro van por el otro lado: se parte de un desarrollo conocido
          y se manipula para llegar a la suma de una serie.
      - tipo: ejercicio
        id: ex1819-3ev-4-serie-del-logaritmo-del-cociente
      - tipo: ejercicio
        id: ex1718-3ev-4-serie-del-logaritmo-y-la-armonica
      - tipo: ejercicio
        id: ex1920-3ev-2-raiz-de-dos-por-taylor
        nota: >-
          Los dos últimos son de aproximar un número con su cota, que es el
          formato de la segunda evaluación.
      - tipo: ejercicio
        id: ex1617-3ev-3-raiz-cubica-de-nueve

  # ─────────────────────────────────────────────────────────────────────
  - id: areas-y-volumenes
    titulo: Áreas, volúmenes y lo que barre un recinto al girar
    pide: >-
      Dibujar un recinto, calcular su área, y el volumen o la superficie que
      engendra al girar alrededor de un eje que casi nunca es OX.
    porque: >-
      Nueve de los once años, y es el ejercicio más largo del examen: suele
      traer tres apartados encadenados. El área se le da bien a casi todo el
      mundo; donde se pierden los puntos es en el eje de giro, porque los
      discos solo valen si el eje es horizontal y el enunciado casi siempre
      pone uno vertical o desplazado.
    invariante:
      anios: 9
      fuente: >-
        Un recinto con su área y su volumen de revolución en 2015-16, 2016-17,
        2017-18, 2018-19, 2021-22, 2022-23, 2023-24, 2024-25 y 2025-26. Solo
        faltan 2019-20 y 2020-21.
    dominio: >-
      Delante de un enunciado nuevo, decidir en menos de un minuto si integras
      en x o en y y si usas discos o capas, y saber decir por qué. Y que el
      dibujo del recinto salga antes que la primera integral, siempre.
    material:
      - tipo: teoria
        tema: t05-integracion
        apartado: áreas-y-volúmenes-el-mismo-esquema
        nota: >-
          Área entre curvas, discos y arandelas. Y por qué los volúmenes no se
          restan como se restan las áreas.
      - tipo: teoria
        tema: t05-integracion
        apartado: girar-alrededor-de-oy-que-es-el-caso-que-de-verdad-cae
        nota: >-
          El caso que de verdad sale: eje vertical. Discos en y si se puede
          despejar, capas si no, y Pappus si aparece un centroide.
      - tipo: teoria
        tema: t05-integracion
        apartado: longitud-de-arco

      - tipo: ejercicio
        id: area-y-volumen-exponencial
        incrustado: true
        nota: >-
          El patrón entero en su forma más limpia: recinto, área, volumen.
      - tipo: ejercicio
        id: area-entre-parabola-y-dos-tangentes
      - tipo: ejercicio
        id: parabola-y-su-tangente-paralela
      - tipo: ejercicio
        id: parabola-y-sus-dos-tangentes-en-los-cortes
      - tipo: ejercicio
        id: parabola-tumbada
        nota: >-
          Por qué a veces conviene integrar en y. Es el mismo criterio que
          decide entre discos y capas.
      - tipo: ejercicio
        id: raiz-frente-a-valor-absoluto
      - tipo: ejercicio
        id: parametro-por-area
      - tipo: ejercicio
        id: giro-alrededor-de-y-igual-1
      - tipo: ejercicio
        id: elipsoides
      - tipo: ejercicio
        id: formulas-clasicas-con-integrales
        nota: >-
          De dónde salen las cinco fórmulas de volumen que te sabes de memoria.
          Sirve de comprobación de todo el bloque.
      - tipo: ejercicio
        id: longitud-de-arco-parabola

      - tipo: ejercicio
        id: ex2526-3ev-5-parabola-tumbada-y-tangente
        nota: >-
          Los nueve de examen, del más reciente hacia atrás.
      - tipo: ejercicio
        id: ex2425-3ev-4-recinto-y-volumen
      - tipo: ejercicio
        id: ex2425-3ev-6-area-de-revolucion
      - tipo: ejercicio
        id: ex2324-3ev-4-area-de-la-elipse
      - tipo: ejercicio
        id: ex2223-3ev-4-sector-de-45-grados
      - tipo: ejercicio
        id: ex2122-3ev-6-parabola-y-recta-paralela
      - tipo: ejercicio
        id: ex1819-3ev-6-parabola-y-sus-dos-tangentes
      - tipo: ejercicio
        id: ex1718-3ev-5-parabola-recta-y-eje
      - tipo: ejercicio
        id: ex1617-3ev-4-el-lazo
      - tipo: ejercicio
        id: ex1516-3ev-5-integral-y-solido-sobre-y-igual-uno

  # ─────────────────────────────────────────────────────────────────────
  - id: teorema-fundamental
    titulo: El teorema fundamental, y las funciones integrales
    pide: >-
      Enunciar el teorema fundamental y deducir de él la regla de Barrow, o
      derivar y estudiar una función definida por una integral con el extremo
      variable.
    porque: >-
      Ocho de los once años, y en tres seguidos —2018-19, 2019-20 y 2020-21— el
      enunciado fue literalmente «enunciar y demostrar». Es el bloque de COMP4
      de esta evaluación: hay años en que estos puntos no exigen calcular nada
      y se pierden enteros por no tener el enunciado escrito.
    invariante:
      anios: 8
      fuente: >-
        Teorema fundamental, Barrow o una función integral en 2015-16, 2016-17,
        2018-19, 2019-20, 2020-21, 2021-22, 2023-24 y 2025-26.
    dominio: >-
      Escribir de memoria las dos partes del teorema con sus hipótesis y
      deducir Barrow de la primera, en papel y sin apuntes. Y derivar una
      función integral con los dos extremos variables sin olvidar la cadena en
      ninguno de los dos.
    material:
      - tipo: teoria
        tema: t05-integracion
        apartado: el-teorema-fundamental-en-sus-dos-mitades
        nota: >-
          La primera dice por qué existe la primitiva, la segunda cómo usarla.
          Y la fórmula con límites variables, que es lo que más se pregunta.
      - tipo: teoria
        tema: t05-integracion
        apartado: el-valor-medio-es-una-altura
        nota: >-
          El teorema de la media, que suele venir en el mismo ejercicio. La
          continuidad no es un adorno: sin ella la altura no se alcanza.

      - tipo: ejercicio
        id: derivar-sin-integrar
        incrustado: true
        nota: >-
          Seis derivadas sin calcular ninguna integral. Si estas seis salen
          solas, la mitad del bloque está hecha.
      - tipo: ejercicio
        id: funciones-integrales-a-trozos
      - tipo: ejercicio
        id: ecuacion-con-funcion-integral
      - tipo: ejercicio
        id: teorema-de-la-media
      - tipo: ejercicio
        id: parametro-para-la-media
      - tipo: ejercicio
        id: continuidad-media-y-derivabilidad
      - tipo: ejercicio
        id: funcion-media-frente-a-valor-medio

      - tipo: ejercicio
        id: ex2526-3ev-6-valor-medio-y-funcion-integral
        nota: >-
          Los ocho de examen. Fíjate en los tres de Barrow: 2018-19, 2019-20 y
          2020-21 piden casi lo mismo con otras palabras.
      - tipo: ejercicio
        id: ex2324-3ev-3-funcion-integral-menos-exponencial
      - tipo: ejercicio
        id: ex2122-3ev-5-funcion-error
      - tipo: ejercicio
        id: ex2021-3ev-4-barrow-demostrado
      - tipo: ejercicio
        id: ex1920-3ev-4-barrow-otra-vez
      - tipo: ejercicio
        id: ex1819-3ev-3-barrow-tercera-vez
      - tipo: ejercicio
        id: ex1920-3ev-3-identificar-las-tres-graficas
        nota: >-
          Este junta las dos evaluaciones: hay que decir cuál de las tres
          curvas es la función, cuál su derivada y cuál su integral.
      - tipo: ejercicio
        id: ex1617-3ev-2-dos-demostraciones
      - tipo: ejercicio
        id: ex1516-3ev-2-funcion-valor-medio

  # ─────────────────────────────────────────────────────────────────────
  - id: de-la-segunda-evaluacion
    titulo: Lo que vuelve de la segunda evaluación
    pide: >-
      Un teorema de continuidad enunciado y aplicado, una inversa, una
      implícita o un problema de optimización.
    porque: >-
      Ocho de los once años traen al menos un ejercicio de los temas 3 y 4 que
      no es de Taylor. No es un bloque nuevo: es la ruta de la segunda
      evaluación comprobada, y por eso es corto. Lo que cambia es el envoltorio
      — aquí suelen venir mezclados con una integral en el mismo enunciado.
    invariante:
      anios: 8
      fuente: >-
        Punto fijo, inversas, límites por sucesiones, implícitas u optimización
        en 2015-16, 2017-18, 2018-19, 2020-21, 2022-23, 2023-24, 2024-25 y
        2025-26.
    dominio: >-
      Reconocer, leyendo el enunciado, cuál de los cinco teoremas te están
      pidiendo, y escribirlo con sus hipótesis antes de empezar a operar. Si
      tienes cerrada la ruta de la segunda evaluación, esto ya está.
    material:
      - tipo: teoria
        tema: t03-funciones-reales
        apartado: el-punto-fijo-que-es-bolzano-disfrazado
        nota: >-
          El que más ha caído aquí: dos veces con unicidad incluida, que es un
          argumento aparte del de existencia.
      - tipo: teoria
        tema: t03-funciones-reales
        apartado: un-límite-no-existe-si-dos-caminos-discrepan
      - tipo: teoria
        tema: t03-funciones-reales
        apartado: la-inversa-existe-cuando-no-hay-empates
      - tipo: teoria
        tema: t04-estudio-local
        apartado: optimizar-es-traducir-no-derivar

      - tipo: ejercicio
        id: ex2526-3ev-3-satelite
        incrustado: true
        nota: >-
          El del curso pasado, y el que mejor enseña el formato: un enunciado
          largo que por dentro es un teorema conocido.
      - tipo: ejercicio
        id: ex2425-3ev-5-triangulo-de-area-minima
      - tipo: ejercicio
        id: ex2324-3ev-5-particula-y-teoremas
        nota: >-
          Cuatro teoremas y hay que decir cuál se aplica en cada apartado. Es
          la prueba de fuego del bloque de la segunda evaluación.
      - tipo: ejercicio
        id: ex2223-3ev-2-tangentes-perpendiculares
      - tipo: ejercicio
        id: ex2021-3ev-3-bidon-cerrado
      - tipo: ejercicio
        id: ex1819-3ev-2-limite-por-sucesiones-y-composicion
      - tipo: ejercicio
        id: ex1718-3ev-3-definiciones-y-punto-fijo
      - tipo: ejercicio
        id: ex1516-3ev-3-punto-fijo-con-unicidad
      - tipo: ejercicio
        id: ex1516-3ev-4-inversa-del-coseno-hiperbolico

  # ─────────────────────────────────────────────────────────────────────
  - id: integrales
    titulo: Las integrales sueltas, y las impropias
    pide: >-
      Calcular una integral por el método que toque, o decidir si una impropia
      converge y cuánto vale.
    porque: >-
      Cinco de los once años traen una integral como ejercicio propio, y
      además todas las integrales de los otros bloques hay que saber
      resolverlas. Las impropias son el sitio donde más se regalan puntos:
      aplicar Barrow sobre una discontinuidad da un número creíble y falso, y
      el examen pone ese caso a propósito.
    invariante:
      anios: 5
      fuente: >-
        Una integral o una impropia como ejercicio independiente en 2017-18,
        2018-19, 2019-20, 2020-21 y 2022-23.
    dominio: >-
      Mirar una integral y saber en diez segundos por qué método va. Y antes de
      aplicar Barrow, comprobar siempre si el integrando explota dentro del
      intervalo, aunque nada en el enunciado lo sugiera.
    material:
      - tipo: teoria
        tema: t05-integracion
        apartado: los-cuatro-métodos-y-cuándo-usar-cada-uno
        nota: >-
          La tabla de qué método para qué forma, ALPES para las partes, y la
          comprobación del grado antes de descomponer una racional.
      - tipo: teoria
        tema: t05-integracion
        apartado: impropias-dos-formas-de-romperse
        nota: >-
          Las de tipo 2 no se ven. Y los dos límites hay que tomarlos por
          separado, o lo que sale es el valor principal, que no es lo mismo.

      - tipo: ejercicio
        id: integrales-inmediatas
        incrustado: true
        nota: >-
          Diez inmediatas. Reconocer una derivada escondida es lo que ahorra el
          tiempo que después hace falta en el ejercicio largo.
      - tipo: ejercicio
        id: integracion-por-partes
      - tipo: ejercicio
        id: integrales-racionales
      - tipo: ejercicio
        id: integrales-irracionales
      - tipo: ejercicio
        id: integrales-trigonometricas
      - tipo: ejercicio
        id: impropias-primer-tipo
      - tipo: ejercicio
        id: impropias-segundo-tipo
        nota: >-
          Cuatro que divergen aunque Barrow diga otra cosa. Es el ejercicio que
          enseña por qué hay que mirar antes de integrar.

      - tipo: ejercicio
        id: ex2223-3ev-5-integral-de-un-valor-absoluto
      - tipo: ejercicio
        id: ex2122-3ev-4-integral-que-no-converge
      - tipo: ejercicio
        id: ex2021-3ev-5-dos-integrales-con-trampa
      - tipo: ejercicio
        id: ex1920-3ev-5-integral-por-la-tangente
      - tipo: ejercicio
        id: ex1819-3ev-5-sumas-y-una-integral-homogenea
      - tipo: ejercicio
        id: ex1718-3ev-6-integral-con-tangente

  # ─────────────────────────────────────────────────────────────────────
  - id: sucesiones-y-series
    titulo: Sucesiones y series, que también vuelven
    pide: >-
      Decidir si una serie converge y sumarla, o razonar si una afirmación
      sobre sucesiones es verdadera o falsa.
    porque: >-
      Cinco de los once años. Es el hueco menos frecuente del final, y aun así
      son diez puntos cuando cae. Va aquí abajo por eso, no porque se pueda
      saltar: los dos últimos cursos que lo trajeron son 2024-2025 y 2025-2026,
      así que la tendencia es al alza.
    invariante:
      anios: 5
      fuente: >-
        Un ejercicio de tema 2 en las terceras evaluaciones de 2016-17,
        2017-18, 2021-22, 2024-25 y 2025-26.
    dominio: >-
      Ver de qué tipo es una serie sin probar fórmulas, y demostrar la suma de
      la geométrica de memoria, que es lo que pidió 2017-2018. Si tienes
      cerrada la ruta de la primera evaluación, esto es repaso.
    material:
      - tipo: teoria
        tema: t02-sucesiones
        apartado: series-sumar-infinitos-términos
      - tipo: teoria
        tema: t02-sucesiones
        apartado: las-otras-tres-que-caen
        nota: >-
          Telescópicas, alternadas y la de n por r elevado a n. Y el criterio
          que el examen regala dentro del enunciado.
      - tipo: teoria
        tema: t02-sucesiones
        apartado: qué-significa-exactamente-converger
        nota: >-
          Para el ejercicio de verdadero o falso de 2021-2022: dos
          subsucesiones que discrepan tumban una convergencia en una línea.

      - tipo: ejercicio
        id: serie-geometrica
        incrustado: true
        nota: >-
          Con su demostración, que es lo que pidió 2017-2018 antes de dejar
          usarla.
      - tipo: ejercicio
        id: alpinista-geometrica
      - tipo: ejercicio
        id: alternante-frente-a-salto

      - tipo: ejercicio
        id: ex2526-3ev-2-hipergeometricas
      - tipo: ejercicio
        id: ex2425-3ev-2-pelota-que-bota
      - tipo: ejercicio
        id: ex2122-3ev-2-verdadero-o-falso
      - tipo: ejercicio
        id: ex1718-3ev-2-suma-de-la-geometrica
      - tipo: ejercicio
        id: ex1617-3ev-5-convergencia-y-la-derivada-de-x

  # ─────────────────────────────────────────────────────────────────────
  - id: enteros
    titulo: Los exámenes enteros, cronometrados
    pide: >-
      Sentarte con el papel en blanco, sin apuntes y con reloj, y hacer los
      seis ejercicios seguidos.
    porque: >-
      Aquí el simulacro pesa más que en las otras dos evaluaciones, porque son
      seis ejercicios de cinco temas distintos y la dificultad de verdad es
      cambiar de tema seis veces sin perder el hilo. Repartir el tiempo es
      parte del examen.
    dominio: >-
      Hacer uno entero dentro del tiempo, sin abrir ninguna pista, y que al
      corregirlo no haya ningún ejercicio en blanco. Y saber, antes de empezar,
      en qué orden vas a atacarlos.
    material:
      - tipo: examen
        curso: '2025-2026'
        convocatoria: tercera
        nota: >-
          Empieza por el último. Cada página abre en blanco: las resoluciones
          están en la otra pestaña y conviene no tocarlas hasta terminar.
      - tipo: examen
        curso: '2024-2025'
        convocatoria: tercera
      - tipo: examen
        curso: '2023-2024'
        convocatoria: tercera
    falta:
      - >-
        No hay cronómetro en la página ni forma de guardar lo que has hecho: el
        sitio es estático y no tiene cuentas de usuario. El reloj lo pones tú.
      - >-
        Dos ejercicios de estos once exámenes se salen de los cinco temas y
        aquí no tienen resolución guiada ni teoría detrás: el 6 de 2019-2020 y
        el 6 de 2020-2021, que son de funciones de varias variables. El tema 6
        todavía no está escrito, así que si tu curso mantiene ese formato, esos
        diez puntos no los cubre esta ruta.

  # ─────────────────────────────────────────────────────────────────────
  - id: formulario
    titulo: Lo que hay que llevar sabido
    pide: >-
      El examen no deja formulario, y en el final entra todo. Las definiciones,
      los enunciados de los teoremas y las fórmulas de volumen se piden de
      memoria.
    porque: >-
      Es la evaluación con más material cerrado de las tres: cinco temas de
      definiciones, teoremas y fórmulas. Este bloque va el último porque es el
      repaso de la última hora, y son los cinco formularios de los cinco temas
      en fila.
    dominio: >-
      Escribir en papel, de memoria y sin consultar nada, el teorema
      fundamental con sus dos partes, la tabla de volúmenes con el criterio del
      eje, los seis desarrollos y las siete definiciones de sucesiones. Si
      tienes que mirar una sola vez, todavía no.
    material:
      - tipo: teoria
        tema: t05-integracion
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          Integración: el teorema fundamental, la tabla de áreas y volúmenes
          con el criterio del eje, y cómo elegir método.
      - tipo: teoria
        tema: t04-estudio-local
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          Estudio local: los tres teoremas, Taylor con su resto y los seis
          desarrollos.
      - tipo: teoria
        tema: t03-funciones-reales
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          Funciones reales: continuidad, Bolzano, Weierstrass y punto fijo.
      - tipo: teoria
        tema: t02-sucesiones
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          Sucesiones: las siete definiciones formales y las cuatro sumas.
      - tipo: teoria
        tema: t01-complejos
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          Complejos: las formas, el conjugado y las cinco traducciones de lugar
          geométrico.
    falta:
      - >-
        Los cinco formularios son una segunda copia de cosas que ya están
        explicadas en los temas, y eso tiene un riesgo: si un día se corrige la
        teoría y no se corrige aquí, esto miente. No hay ningún guardián que lo
        compruebe todavía, así que se dice en voz alta.
