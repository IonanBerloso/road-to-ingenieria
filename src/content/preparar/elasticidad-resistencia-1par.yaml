# La ruta del primer parcial de Elasticidad y Resistencia de Materiales del
# curso 2026-2027, que entra en los temas 1 a 6: lo dice la guía docente
# («abordará la parte de elasticidad (temas 1-6)») y se confirmó para este
# curso el 23 de octubre de 2026. Hasta ese día la ruta llegaba al tema 8,
# como los parciales de la ventana.
#
# Está medida sobre los seis primeros parciales del material desde
# 2016-2017: 2016-2017, 2017-2018, 2018-2019, 2019-2020, 2020-2021 y
# 2022-2023. El de 2021-2022 no está en el material, y del de 2025-2026 solo
# están la hoja de teoría y el problema 3 de la de problemas: sus tres
# preguntas y ese problema van en los escalones, pero no cuentan en el
# reparto.
#
# La ventana empieza en 2016-2017 porque ahí cambió el examen: hasta 2015-2016
# el parcial llegaba a la flexión, con un problema del tema 9 en los cuatro
# anteriores, y desde entonces no trae ninguno. Contar aquellos cuatro sería
# medir otro examen. Cada uno entra en `fueraDeLaVentana`, y sus ejercicios
# de los temas 2 a 6 van en los escalones para practicar.
#
# Los seis tienen el mismo formato: cuatro preguntas de teoría de 1 punto y
# tres problemas de 2 puntos, con los puntos impresos junto a cada pregunta.
# Por eso aquí se cuentan PUNTOS y no solo apariciones: son 42 preguntas y 60
# puntos (la pregunta 3 de 2016-2017 son dos mitades de medio punto y cuenta
# como una). De esos 60, 25 eran de los temas 7 y 8, que este curso no
# entran. El reparto por hueco, del 15 de octubre de 2026, sin ellos:
#
#   el tensor de tensiones (tema 2) ..... 12 pts   8 preguntas   en los 6
#   galgas (temas 3 y 4) ................  8 pts   4 preguntas   en 4
#   la cuestión de deformaciones (t. 3) .  6 pts   6 preguntas   en los 6
#   teorías de fallo (tema 6) ...........  5 pts   5 preguntas   en 5
#   Hooke y Poisson (tema 4) ............  4 pts   4 preguntas   en 3
#
# Son 27 preguntas y 35 puntos. Lo que se quitó el 23 de octubre, con lo que
# sumaba:
#
#   barras y sólido rígido (tema 8) ..... 16 pts   9 preguntas   en los 6
#   diagramas de esfuerzos (tema 7) .....  7 pts   4 preguntas   en 4
#   depósitos de pared delgada (t. 8) ...  2 pts   2 preguntas   en 2
#
# Qué pregunta va a qué hueco es una lectura humana (§10): cada
# `invariante.fuente` la dice pregunta a pregunta, con la T de teoría y la P
# de problema que lleva el inventario. Las sumas las hizo un guion sobre ese
# reparto, no se hicieron a mano.
#
# Ninguno de los seis es un parcial de este curso: los seis llegaban al tema
# 8, y el simulacro dice qué preguntas de cada uno saltar.
asignatura: elasticidad-resistencia
evaluacion: primer-parcial
titulo: Preparar el primer parcial, de las tensiones a las teorías de fallo
lede: >-
  Lo que cae en el primer parcial, ordenado por lo que puntúa. Este curso el
  parcial abarca los temas 1 a 6, como dice la guía docente: de los sesenta
  puntos contados en seis parciales anteriores, que llegaban al tema 8,
  quedan treinta y cinco, en veintisiete preguntas. El tensor de tensiones va
  primero: cae todos los años y es el hueco que más puntos ha dado.
temas:
  - t02-tensiones
  - t03-deformaciones
  - t04-cuerpo-elastico
  - t06-teorias-de-fallo
medidoSobre: 6
fueraDeLaVentana:
  - curso: '2025-2026'
    porque: >-
      Del parcial de octubre de 2025 solo están la hoja de teoría y uno de
      los problemas, el 3: sin los otros no se pueden contar sus puntos. Sus
      tres cuestiones y ese problema están en los escalones para practicar;
      lo que no hacen es contar en los puntos de cada hueco.
  - curso: '2015-2016'
    porque: >-
      Es el último parcial que llegaba a la flexión: su tercer problema es del
      tema 9, que desde 2016-2017 no ha vuelto a entrar, y su teoría reparte
      los cuatro puntos en cinco preguntas. Sus ejercicios de los temas 2 a 6
      están en los escalones para practicar; lo que no hacen es contar en los
      puntos de cada hueco.
  - curso: '2014-2015'
    porque: >-
      Llega a la flexión: su tercer problema, la viga con rótula, termina en
      el espesor de una sección en U por la tensión normal máxima, que es del
      tema 9. Sus ejercicios de los temas 2 a 6 están en los escalones para
      practicar; lo que no hacen es contar en los puntos de cada hueco.
  - curso: '2013-2014'
    porque: >-
      Llega a la flexión: su tercer problema termina en una sección en L con
      su eje neutro y su tensión máxima, que es del tema 9, y reparte los seis
      puntos de ejercicios en 1,5, 1,5 y 3. Sus ejercicios de los temas 2 a 6
      están en los escalones para practicar; lo que no hacen es contar en los
      puntos de cada hueco.
  - curso: '2012-2013'
    porque: >-
      Llega a la flexión: su tercera pregunta de teoría y la segunda parte de
      su tercer problema son del tema 9, y reparte la teoría en tres
      preguntas, de 1, 1,5 y 1,5 puntos. Sus ejercicios de los temas 2 a 6
      están en los escalones para practicar; lo que no hacen es contar en los
      puntos de cada hueco.
criterioDeOrden: >-
  Por los puntos que cada hueco ha sumado en los seis parciales, de más a
  menos, con el suelo delante porque sin sus convenios los demás bloques salen
  con el signo cambiado. Los puntos van impresos en cada pregunta, así que se
  cuentan en vez de suponerse. Detrás van el simulacro y lo que hay que llevar
  sabido. Ni el tema 1, la introducción, ni el 5 tienen bloque: ninguno de los
  seis parciales les dedica una pregunta. Tampoco lo tienen las barras con
  sólido rígido, los diagramas de esfuerzos y los depósitos, que sumaban 25 de
  los 60 puntos de los seis: son de los temas 7 y 8, que este curso no entran
  en el parcial sino en la segunda parte del examen final.

bloques:
  - id: suelo
    titulo: Los dos convenios, que no dan puntos y deciden todos los signos
    pide: >-
      Nada por sí mismos: son las reglas con las que se lee cualquier
      enunciado del parcial, y un signo cambiado en una tensión o en una γ
      arrastra todo lo que viene detrás.
    porque: >-
      No ocupa hueco propio en ninguno de los seis parciales, y por eso su
      recuento honesto es cero. Está dentro de casi todas las veintisiete
      preguntas: el signo de τxy decide hacia dónde gira la dirección
      principal, y γxy es lo que se cierra el ángulo recto y en el tensor
      entra su mitad. La cuestión
      de 2016-2017 que pide el equilibrio del elemento diferencial se puntúa
      por el dibujo, y el dibujo es el convenio.
    invariante:
      anios: 0
      fuente: >-
        Cero como pregunta propia en los seis parciales leídos; presente en
        casi todas las veintisiete como criterio de signo.
    apunte:
      texto: no puntúa — sostiene casi todas las preguntas
      tono: marco
    dominio: >-
      Dibujas sin mirar un elemento con sus tensiones positivas y dices qué
      signo tiene γxy cuando el ángulo recto se abre.
    revisado: '2026-10-23'
    escalones:
      - id: las-tensiones-positivas
        titulo: Las tensiones positivas, cara a cara
        aprendes: >-
          A dibujar σ y τ positivas en las caras de un elemento: en la cara
          positiva hacia el eje y en la negativa al revés, y τxy con la normal
          primero y la dirección después.
        teoria:
          tema: t02-tensiones
          apartado: el-convenio-de-signos-del-curso
          nota: >-
            El apartado acaba con la cuestión de 2016-2017, el equilibrio del
            elemento diferencial, y dice qué se puntúa en ella: el dibujo.
        ejercicios:
          - id: ejerm2-circulo-de-mohr-en-tension-plana
            nota: >-
              El ángulo de la dirección principal sale con el signo de τxy:
              cámbialo y la dirección gira hacia el otro lado.
          - id: ejerm2-cl2-3-las-fuerzas-de-volumen-de-un-campo
            nota: >-
              El 2.3 de clase: un tensor que cambia de punto a punto y las
              fuerzas de volumen que lo equilibran. Para este escalón cuenta el
              a/: qué componente y qué derivada entran en cada ecuación; la de
              y la pide deducir, con el dibujo, la cuestión de 2016-2017 que lo
              sigue. El b/, esférica y desviadora, es de otro apartado.
          - id: exerm1617-1par-1-el-equilibrio-del-elemento-diferencial
            incrustado: true
            nota: >-
              La cuestión de 2016-2017: las dos deducciones del
              paralelepípedo, la de fuerzas en y y la de momentos, cada una
              con su dibujo de solo las componentes que influyen.
        dominio: >-
          Dibujas las tensiones positivas de un elemento plano y explicas por
          qué τxy sube en la cara de la derecha y baja en la de la izquierda.
      - id: la-gamma-y-su-mitad
        titulo: γ es lo que se cierra el ángulo, y en el tensor va la mitad
        aprendes: >-
          A leer γxy como la disminución del ángulo recto entre x e y, y a
          escribir el tensor de deformaciones con γ/2 fuera de la diagonal.
        teoria:
          tema: t03-deformaciones
          apartado: el-convenio-y-la-notación-del-curso
        ejercicios:
          - id: ejerm3-roseta-a-45
            nota: >-
              La γxy de la roseta sale de la galga a 45°, y al tensor y al
              círculo de Mohr entra su mitad.
          - id: ejerm3-cu2-las-deformaciones-unitarias
            nota: >-
              Cuestión 2 de autoevaluación del tema 3: las dos deformaciones
              unitarias, con su expresión general y la de pequeños
              desplazamientos, y la diferencia entre los dos tipos de
              problema, con una barra nuestra que se alarga y gira a la vez.
          - id: ejerm3-cl3-4-la-placa-oabc-deformada
            nota: >-
              Ejercicio de clase: de una placa se dan dos alargamientos, el de
              un lado horizontal y el de otro a 45°, y que el ángulo de 45°
              entre ellos no cambia. Usa la fórmula del ejercicio 3.1, que está
              en el tema, y acaba en las principales.
          - id: exerm2223-ord-1-la-distorsion-desde-las-aristas-deformadas
            nota: >-
              La cuestión 1 de la final de enero de 2023: qué es la deformación
              tangencial, con las dos aristas deformadas del elemento, primero sin
              aproximar y después con desplazamientos pequeños.
        dominio: >-
          Escribes el tensor de deformaciones de un estado plano con γ/2 en su
          sitio y dices sin dudar qué significa una γxy negativa.

  - id: tensor
    titulo: El tensor de tensiones, que cae todos los años
    pide: >-
      Tensiones y direcciones principales de un tensor, el vector tensión de
      un plano con sus componentes intrínsecas y el círculo de Mohr; en teoría,
      la deducción de Cauchy o la de las direcciones principales.
    porque: >-
      Cae en los seis parciales: como problema 1 en cuatro de ellos y como
      cuestión en los otros dos, y 2016-2017 y 2019-2020 traen además una
      cuestión del tema junto al problema. Son ocho de las cuarenta y dos
      preguntas y 12 de los 60 puntos. El tensor de 2016-2017 está resuelto
      paso a paso dentro del propio tema.
    invariante:
      anios: 6
      fuente: >-
        Contado pregunta a pregunta: 2016-2017 (T1 y P1), 2017-2018 (P1),
        2018-2019 (T1), 2019-2020 (T1 y P1), 2020-2021 (T2) y 2022-2023 (P1).
    apunte:
      texto: cae en los seis — 12 de los 60 puntos
      tono: nota
    dominio: >-
      Sacas las principales de un tensor 3×3 con una dirección ya principal,
      calculas σn y τn de cualquier plano y dibujas los tres círculos de Mohr
      de un punto con la tangencial máxima bien elegida.
    revisado: '2026-10-15'
    escalones:
      - id: el-vector-tension
        titulo: El vector tensión de un plano, y sus dos componentes
        aprendes: >-
          A sacar {S} = [σ]{n} de un plano cualquiera, a partirlo en σn y τn,
          y a deducir la fórmula con el tetraedro cuando la pregunta es de
          teoría.
        teoria:
          tema: t02-tensiones
          apartado: el-tensor-de-tensiones-y-la-ecuación-de-cauchy
        ejercicios:
          - id: ejerm2-el-vector-tension-de-un-plano
            incrustado: true
            nota: >-
              Nuestro, antes del 2.11: el tensor ya dado en xyz y un plano por
              su normal, con el tetraedro dibujado. Entrena {S} = [σ]{n} fila a
              fila, σn y τn, y las áreas que hay detrás de la fórmula, que son
              la cuestión de 2018-2019.
          - id: ejerm2-cl2-11-el-vector-tension-desde-las-principales
            nota: >-
              Un ejercicio de clase: las principales vienen dadas como vectores,
              y hay que montar el tensor en Oxyz antes de sacar {S}, σn y τn de
              un plano. Se comprueba por el otro camino, en los ejes
              principales, donde σn = Σσi li².
          - id: ejerm2-cu1-las-componentes-intrinsecas
            nota: >-
              Cuestión 1 de autoevaluación del tema 2, de teoría: las
              componentes intrínsecas del vector tensión, con un ejemplo
              nuestro en que el vector tensión viene dado, sin tensor, y una
              errata de signo de los apuntes aclarada. Va delante de la
              deducción de 2018-2019, cuyo enunciado da por sabido lo que esta
              define.
          - id: exerm2223-ext-1-componentes-intrinsecas-del-vector-tension
            nota: >-
              La parte a) de la pregunta 1 de la extraordinaria de febrero de 2023 es,
              palabra por palabra, la cuestión de arriba. Se resuelve con otro
              ejemplo.
          - id: exerm1819-1par-1-el-tetraedro-de-cauchy
            incrustado: true
            nota: >-
              La cuestión de 2018-2019: la relación entre el vector tensión de
              un plano cualquiera y el tensor, deducida con el tetraedro
              elemental.
          - id: exerm1920-ext-4-las-ecuaciones-de-cauchy
            nota: >-
              La cuestión 4 de la extraordinaria de enero de 2020: la deducción
              de las ecuaciones de Cauchy, pedida como «los componentes del
              vector tensión en un sistema de referencia», con los pasos de
              cálculo sobre un ejemplo nuestro.
          - id: ejerm2-cl2-2-las-tensiones-octaedricas
            nota: >-
              El 2.2 de clase: σn y τn del plano que forma el mismo ángulo con
              las tres direcciones principales, en función de σ1, σ2 y σ3. Son
              las cuentas del de 2020-2021 que lo sigue, hechas al derecho:
              allí se dan σn y τn, y lo que se busca es el plano.
          - id: exerm2021-1par-2-el-plano-de-sigma-y-tau-iguales
            nota: >-
              Al revés que de costumbre: te dan σn y τn y hay que encontrar el
              plano. En ejes principales, las incógnitas son los cuadrados de
              las componentes de la normal.
          - id: ejerm2-cu4-un-vector-en-dos-sistemas-de-referencia
            nota: >-
              Cuestión 4 de autoevaluación del tema 2, de teoría: la relación
              entre las componentes de un vector en dos sistemas girados,
              deducida, con un ejemplo nuestro. Prepara la cuestión de
              2013-2014 que viene detrás, cuyo enunciado da esa relación como
              dato y pide la del tensor.
          - id: ejerm2-cu5-la-matriz-de-rotacion-es-ortogonal
            nota: >-
              Cuestión 5 de autoevaluación del tema 2, de teoría: la
              demostración de que la matriz de rotación es ortogonal, con un
              ejemplo nuestro de números limpios. Va con la anterior, delante
              de la cuestión de 2013-2014, cuya deducción se apoya en ella.
          - id: ejerm2-cl2-1-el-giro-alrededor-de-z
            nota: >-
              El 2.1 de clase: las seis componentes del tensor en unos ejes
              girados alrededor de z, en función de las de Oxyz y del seno y el
              coseno del ángulo. El texto y la figura no casan en el sentido
              del giro: las notas del enunciado dicen cuál se sigue.
          - id: ejerm2-cl2-6-el-tensor-en-un-triedro-girado
            nota: >-
              El 2.6 de clase: primero la ley de giro del tensor, demostrada con
              la fórmula ya escrita, y después aplicada a un triedro dado por
              sus tres unitarios. Su apartado a/ es la cuestión de 2013-2014 de
              más abajo, que pide llegar a esa ley sin que te la den.
          - id: ejerm2-cl2-12-el-tensor-y-un-plano-en-dos-triedros
            nota: >-
              El 2.12 de clase: el tensor en un triedro del que el enunciado da
              solo dos ejes, y el vector tensión de un plano, con sus
              componentes intrínsecas, en los dos sistemas. Justo antes de la
              deducción de 2013-2014: la ley de giro con números, para el
              tensor y para un vector a la vez.
          - id: exerm1314-1par-2-el-giro-del-tensor-de-tensiones
            nota: >-
              La cuestión de 2013-2014, fuera de la ventana: cómo cambian las
              componentes del tensor al girar los ejes, deducido paso a paso,
              y la ley inversa.
          - id: exerm1314-1par-5-la-union-adhesiva-en-el-plano-abcd
            nota: >-
              El problema 1 de 2013-2014, fuera de la ventana: dos piezas
              pegadas por un plano diagonal de un cubo, y lo que soporta el
              adhesivo. Es el 2.5 de clase.
        dominio: >-
          Calculas σn y τn de un plano dado por su normal, y escribes la
          deducción de Cauchy con el dibujo del tetraedro en cinco líneas.
      - id: las-principales
        titulo: Las tensiones y direcciones principales
        aprendes: >-
          A ver en el tensor qué dirección ya es principal, a resolver el
          bloque 2×2 que queda y a comprobar el resultado con los invariantes.
        teoria:
          tema: t02-tensiones
          apartado: un-tensor-de-parcial-paso-a-paso
          nota: >-
            Es el problema 1 de 2016-2017 resuelto, con el aviso de que el de
            2017-2018 trae los mismos números en otros sitios y no es el mismo
            tensor.
        ejercicios:
          - id: ejerm2-las-tres-principales-de-un-tensor
            incrustado: true
            nota: >-
              Nuestro, antes del 3.2 de clase: un tensor de tensiones de
              números limpios, dado ya en xyz. Entrena a mirar antes de
              calcular si alguna dirección ya es principal, a ordenar las tres
              y a comprobarlas con los dos primeros invariantes.
          - id: ejerm3-cl3-2-del-desplazamiento-a-las-principales
            nota: >-
              Un ejercicio de clase, un peldaño por debajo de los de examen: el
              tensor sale de derivar un campo de desplazamientos, y después se
              trabaja como el de tensiones del apartado. Es de deformaciones,
              con ½γ fuera de la diagonal, porque en clase no hay ninguno de
              principales del tensor de tensiones; se comprueba con los
              invariantes.
          - id: ejerm2-cu8-la-ecuacion-caracteristica-y-los-invariantes
            nota: >-
              Cuestión 8 de autoevaluación del tema 2, de teoría: la ecuación
              característica y los invariantes, deducidos, con un tensor
              nuestro del que se conoce una de las principales. Va delante del
              tensor de 2016-2017, cuya resolución acaba comprobando las
              principales con los invariantes.
          - id: exerm1617-1par-5-el-tensor-con-x-principal
            incrustado: true
            nota: >-
              El tensor que el apartado resuelve paso a paso: hazlo sin
              mirarlo y compara. El plano de b/ deja dos signos para nz, y
              los dos valen.
          - id: exerm1718-1par-5-el-tensor-y-el-plano-a-45-y-60
            nota: >-
              El de 2017-2018: los mismos números en otros sitios, y no es el
              mismo tensor. El plano viene dado en ejes principales, y ahí σn
              y τn solo dependen de los cuadrados de los cosenos.
          - id: ejerm2-cl2-8-de-las-principales-a-los-ejes-xy
            nota: >-
              El 2.8 de clase, en tensión plana: las tensiones principales
              vienen dibujadas con sus direcciones, y hay que volver a los ejes
              xy y sacar σn y τn de otro plano. Prepara el de 2022-2023 que lo
              sigue, donde el tensor llega en ejes principales y se piden las
              componentes intrínsecas en el plano de la placa.
          - id: exerm2223-1par-5-el-tensor-en-la-placa
            nota: >-
              El problema 1 de 2022-2023: el tensor ya viene en principales, y
              lo que se pide es proyectarlo sobre una placa, pasar a fuerzas y
              buscar un plano a 15°.
          - id: ejerm2-cu10-las-tensiones-principales-son-reales
            nota: >-
              Cuestión 10 de autoevaluación del tema 2, de teoría: que las
              tensiones principales son reales, demostrado como en los apuntes,
              con su desigualdad corregida, y un ejemplo nuestro con una
              dirección ya principal. Va delante de las dos cuestiones de las
              direcciones perpendiculares, del mismo apartado de los apuntes.
          - id: exerm1920-1par-1-las-direcciones-principales-son-perpendiculares
            nota: >-
              La cuestión de 2019-2020: que dos direcciones principales son
              perpendiculares, y además qué pasa si dos principales son
              iguales.
          - id: exerm1415-1par-1-las-direcciones-principales-son-ortogonales
            nota: >-
              La cuestión de 2014-2015, fuera de la ventana: la misma deducción
              que la de 2019-2020, con otras palabras. Sirve para comprobar que
              la sabes escribir sin mirar.
          - id: exerm2526-1par-2-direcciones-ortogonales-y-tensiones-reales
            nota: >-
              La pregunta 2 del parcial de octubre de 2025: las dos
              demostraciones de este apartado de los apuntes en una sola
              pregunta, la de las direcciones y la de los valores.
          - id: ejerm2-cu7-los-dos-planteamientos-de-las-principales
            nota: >-
              Cuestión 7 de autoevaluación del tema 2, de teoría: de dónde sale
              el problema de las principales, planteado de dos maneras, con un
              tensor nuestro de números limpios. Va delante de la cuestión de
              2013-2014, que se le parece y lo pide como una demostración.
          - id: exerm1314-1par-3-las-principales-son-las-de-normal-extrema
            nota: >-
              La cuestión de 2013-2014, fuera de la ventana: las principales
              vistas desde el otro lado, como las direcciones en que la
              tensión normal es máxima o mínima.
        dominio: >-
          Sacas las tres principales y sus direcciones de un tensor de parcial
          y compruebas con la traza que no se te ha cambiado un signo.
      - id: el-circulo-de-mohr
        titulo: El círculo de Mohr, y los tres de un punto
        aprendes: >-
          A dibujar el círculo de un estado plano, a leer en él las principales
          y la dirección 1, y a no olvidar la tercera principal al buscar la
          tangencial máxima.
        teoria:
          tema: t02-tensiones
          apartado: el-círculo-de-mohr
        ejercicios:
          - id: ejerm2-circulo-de-mohr-en-tension-plana
            incrustado: true
          - id: ejerm2-cu11-tension-plana-en-funcion-del-angulo-doble
            nota: >-
              Cuestión 11 de autoevaluación del tema 2, de teoría: σn y τn de
              cualquier plano en tensión plana, deducidas hasta el ángulo
              doble, con un ejemplo nuestro de signos mezclados. Va delante del
              2.10 de clase y de la chapa de 2019-2020.
          - id: exerm1718-ord-1-las-componentes-intrinsecas-en-funcion-de-2-theta
            nota: >-
              La cuestión 1 de la final de enero de 2018: la deducción de la
              cuestión 11 de arriba como pregunta de examen, con la relación
              entre el vector tensión y la normal dada en forma matricial, y
              un ejemplo nuestro con números.
          - id: ejerm2-cu13-el-criterio-de-colocacion-de-mohr
            nota: >-
              Cuestión 13 de autoevaluación del tema 2, de teoría: la
              demostración del criterio para colocar los puntos en el círculo,
              que los apuntes hacen con cuatro casos, y un ejemplo nuestro con
              σy mayor que σx y la tangencial negativa.
          - id: ejerm2-cu14-los-tres-circulos-y-la-tangencial-maxima
            nota: >-
              Cuestión 14 de autoevaluación del tema 2, de teoría: qué planos
              recoge cada uno de los tres círculos de un punto y dónde está la
              tangencial máxima, con un tensor nuestro que tiene x ya
              principal. Va delante del 2.10 de clase, que ya pide la
              tangencial máxima, y de la chapa de 2019-2020, que pide los tres
              círculos.
          - id: ejerm2-cl2-10-el-circulo-de-mohr-y-la-direccion-a
            nota: >-
              Un ejercicio de clase con la τxy mayor que las dos normales: antes
              de dar la tangencial máxima hay que ordenar las tres principales,
              con el 0 de z. Pide además el plano perpendicular a una dirección
              dibujada.
          - id: ejerm2-cl2-7-el-circulo-de-mohr-dado
            nota: >-
              El 2.7 de clase: el círculo es el dato, y de leerlo salen el
              estado de x e y, con su dibujo, y las principales con sus
              direcciones. Antes de la chapa de 2019-2020, donde hay que
              construirlo con lo que dicen dos de sus caras, se aprende a leer
              uno ya hecho.
          - id: ejerm2-cl2-9-del-elemento-girado-a-los-ejes-xy
            nota: >-
              El 2.9 de clase: el círculo se construye con lo que actúa en las
              caras de un elemento girado, como en la chapa de 2019-2020 de más
              abajo, pero aquí esas caras lo dan todo; con el círculo hecho, se
              gira hasta los ejes x e y.
          - id: exerm1617-ord-1-la-traccion-simple-vista-en-un-plano-inclinado
            nota: >-
              La cuestión 1 de la final de enero de 2017: de una pieza a
              tracción simple se dan la normal y la tangencial de un plano
              inclinado, y hay que volver a la tensión axial y al ángulo del
              plano; después, las tensiones del elemento girado 30°.
          - id: exerm1920-1par-5-la-chapa-hexagonal
            nota: >-
              El problema 1 de 2019-2020, sin tensor de partida: el círculo se
              construye con lo que dicen dos caras de la chapa.
          - id: exerm2021-ext-5-la-chapa-romboidal-con-tensiones-oblicuas
            nota: >-
              El problema 1 de la extraordinaria de febrero de 2021: una chapa
              en rombo con tensiones oblicuas en sus cuatro lados. Pide el
              tensor en letras y, con un dato más, las principales y sus
              direcciones, la deformación tangencial máxima y lo que cambia la
              longitud de un lado.
        dominio: >-
          Dibujas los tres círculos de Mohr de un estado plano y dices cuál da
          la tangencial máxima del punto, y por qué no siempre es el del
          plano xy.
    falta:
      - >-
        **~~Los escalones del vector tensión y de las principales siguen sin
        ejemplo nuestro: el ejercicio de clase hace de primer peldaño~~ ·
        resuelto el 15 de octubre de 2026.** Los dos escalones empiezan ahora
        por un ejemplo nuestro, delante del ejercicio de clase: el vector
        tensión de un plano con el tetraedro dibujado, y un tensor de
        tensiones dado en xyz con la comprobación por los invariantes.
      - >-
        **~~No hay ejercicios de práctica entre el ejemplo y los de examen:
        los dos primeros escalones empiezan ya en nivel de examen~~ · resuelto
        el 15 de octubre de 2026.** Los dos primeros escalones empiezan ahora con un
        ejercicio de clase: el 2.11 en el del vector tensión y el 3.2, de
        deformaciones, en el de las principales, porque en clase no hay
        ninguno de principales del tensor de tensiones. El del círculo tiene
        el 2.10 entre el ejemplo y el de examen.
      - >-
        **~~Los problemas 1 de 2016-2017 y 2017-2018 no están transcritos como
        ejercicio, ni la cuestión del equilibrio del elemento de 2016-2017~~ ·
        resuelto el 15 de octubre de 2026.** Los dos problemas van en el escalón de
        las principales, y la cuestión del equilibrio, en el bloque de los
        convenios.
    antesDeEntrar:
      pasos:
        - >-
          Busca una fila con ceros fuera de la diagonal: da una principal
          gratis y deja un problema plano: un círculo.
        - >-
          Comprueba las tres principales con la traza y con I₂ antes de
          seguir.
        - >-
          Si un coseno director sale de una raíz, da los dos signos o di cuál
          eliges: son dos planos distintos.
        - >-
          Para la tangencial máxima del punto, usa las tres principales, con
          el cero de la tensión plana dentro.
      trampa: >-
        En el círculo, con τxy positiva el punto de x va abajo, no arriba, y
        el ángulo es el doble del real. Si no, la dirección principal sale mal
        con números que parecen razonables.

  - id: galgas
    titulo: Galgas, de las lecturas al tensor y al factor de seguridad
    pide: >-
      Una roseta de dos o tres galgas, casi siempre en tensión plana: εx, εy,
      γxy, las deformaciones principales, el tensor de tensiones y, a menudo,
      un factor de seguridad.
    porque: >-
      Es uno de los tres problemas en cuatro de los seis parciales, siempre
      de 2 puntos: 8 de los 60. En 2018-2019 y 2019-2020 su sitio lo ocuparon
      los diagramas del tema 7, y en 2019-2020 las galgas salieron dentro de
      la cuestión del depósito, que es del tema 8. Es el problema que más
      temas junta: lee
      deformaciones del 3, pasa a tensiones con el 4 y a veces acaba en un
      criterio del 6.
    invariante:
      anios: 4
      fuente: >-
        Contado pregunta a pregunta: 2016-2017 (P2), 2017-2018 (P2), 2020-2021
        (P1) y 2022-2023 (P2). La cuestión del depósito con galgas de
        2019-2020 no cuenta: el depósito es del tema 8.
    apunte:
      texto: cae en cuatro de seis — 8 de los 60 puntos
      tono: nota
    dominio: >-
      De las lecturas de una roseta llegas a las tensiones principales y a un
      factor de seguridad, con la εz de tensión plana calculada y no supuesta
      nula.
    revisado: '2026-10-23'
    escalones:
      - id: de-las-lecturas-a-las-deformaciones
        titulo: De las lecturas a las deformaciones principales
        aprendes: >-
          A escribir la fórmula de la galga para cada ángulo de la roseta, a
          despejar εx, εy y γxy y a sacar las principales con su dirección.
        teoria:
          tema: t03-deformaciones
          apartado: galgas-y-rosetas
        ejercicios:
          - id: ejerm3-roseta-a-45
            incrustado: true
          - id: ejerm4-cl4-4-tres-galgas-una-sobre-x
            nota: >-
              Un ejercicio de clase: tres galgas que no son las de las rosetas
              de los apuntes, y ninguna sobre y. Leer hacia dónde va cada arco
              es la mitad del problema, y dos de las galgas dan un atajo.
          - id: ejerm3-cl3-3-tres-galgas-y-la-distorsion-entre-a-y-b
            nota: >-
              Ejercicio de clase: dos galgas sobre direcciones perpendiculares
              y una tercera a un ángulo dado por su tangente. Pide solo la
              deformación angular entre las dos primeras, y el ángulo de la
              tercera hay que leerlo bien en la figura.
          - id: ejerm3-cl3-6-tres-galgas-sobre-un-triangulo
            nota: >-
              Ejercicio de clase: tres galgas sobre los lados de un triángulo,
              con el ángulo θ de la figura en letras. Se resuelve en función de
              θ y de las tres lecturas, y los pasos de cálculo lo comprueban
              con un ejemplo nuestro.
          - id: exerm2021-1par-5-la-roseta-vista-en-un-espejo
            nota: >-
              El problema 1 de 2020-2021: una roseta a 120°, de las lecturas a
              las principales y sus círculos de Mohr. Leer bien los ángulos
              del dibujo es la mitad del problema.
        dominio: >-
          De tres lecturas a cualquier ángulo sacas εx, εy y γxy, y las
          principales con su dirección medida desde x.
      - id: de-las-deformaciones-a-las-tensiones
        titulo: De las deformaciones a las tensiones
        aprendes: >-
          A pasar de las deformaciones de una roseta a las tensiones, y a
          calcular la εz que la roseta no mide.
        teoria:
          tema: t04-cuerpo-elastico
          apartado: tensión-plana-y-deformación-plana
          nota: >-
            Las fórmulas que se usan después de una roseta, con su error
            típico.
        ejercicios:
          - id: ejerm4-de-la-roseta-a-las-tensiones
            incrustado: true
            nota: >-
              Nuestro, antes de la segunda mitad del 4.4: εx, εy y γxy ya
              resueltas, de números limpios, para pasar a tensiones y a la εz
              que la roseta no mide sin lecturas de galgas ni principales por
              medio.
          - id: ejerm4-cl4-4-las-tensiones-de-la-roseta
            nota: >-
              La segunda mitad del ejercicio de clase del escalón anterior: de
              εx, εy y γxy a las tensiones, la εz que la roseta no mide y σn y
              τn del plano perpendicular a una galga.
          - id: ejerm4-cu8-tension-plana-y-deformacion-plana
            nota: >-
              Cuestión 8 de autoevaluación del tema 4: los dos estados planos,
              qué es nulo en cada uno y dónde se da, con unas mismas
              deformaciones nuestras llevadas a tensiones en uno y en otro. Va
              antes de las tensiones de la roseta de 2020-2021.
          - id: ejerm4-cu4-las-mismas-direcciones-principales
            nota: >-
              Cuestión 4 de autoevaluación del tema 4: por qué coinciden las
              direcciones principales de los dos tensores, comprobado con unas
              tensiones nuestras de tensión plana. Entrena el paso de las
              tensiones a las deformaciones y su dirección principal antes de
              los problemas de roseta.
          - id: exerm2223-ext-1-por-que-coinciden-las-direcciones-principales
            nota: >-
              La parte b) de la pregunta 1 de la extraordinaria de febrero de 2023: la
              misma pregunta que la cuestión de arriba, con otras palabras y otro
              ejemplo.
          - id: exerm2021-1par-5-las-tensiones-que-causan-la-roseta
            incrustado: true
            nota: >-
              La segunda mitad del problema de 2020-2021: las tres tensiones
              del plano y la tangencial máxima del punto.
          - id: exerm1819-ord-5-la-roseta-a-30-grados
            nota: >-
              El problema 1 de la final de enero de 2019, entero y sin
              criterio de fallo: tres galgas separadas 30°, y las tensiones
              normal y tangencial, con su sentido, en el plano perpendicular a
              cada una, y el material se da con E y G.
          - id: exerm1718-1par-6-la-roseta-a-0-60-y-150
            nota: >-
              El problema 2 de 2017-2018, entero, de las lecturas a Tresca y
              Von Mises. Las galgas van sobre los lados de un triángulo, y el
              ángulo de cada una se lee en el dibujo antes de nada.
          - id: exerm1617-1par-6-la-roseta-de-0-60-y-150
            nota: >-
              El problema 2 de 2016-2017: la misma roseta con otras lecturas y
              otro material. Pide además las principales en el espacio, con la
              εz que la roseta no mide, los círculos de Mohr y la tangencial
              máxima del punto.
          - id: exerm1920-ext-5-la-roseta-de-galgas-a-0-30-y-150
            nota: >-
              El problema 1 de la extraordinaria de enero de 2020: tres galgas
              sobre los lados de un triángulo, en tensión plana. Pide εx, εy y
              γxy en función de las lecturas, las tensiones y direcciones
              principales y la normal y la tangencial en el plano
              perpendicular a una de las galgas.
          - id: exerm2223-1par-6-dos-galgas-y-sigma-z
            nota: >-
              El problema 2 de 2022-2023: dos galgas en vez de tres, y el
              resto del estado en el enunciado. Acaba en tres factores de
              seguridad del tema 6.
          - id: exerm1718-ord-5-dos-galgas-a-45-grados-y-sigma-x
            nota: >-
              El problema 1 de la final de enero de 2018: tensión plana con
              solo dos galgas, a 45° de x y una a cada lado. Pide las
              tensiones y direcciones principales del plano y la tangencial
              máxima en el espacio, y el material se da con E y G.
          - id: exerm2223-ord-5-seis-galgas
            nota: >-
              El problema de galgas de la final de enero de 2023: seis galgas, sobre
              los tres ejes y las tres bisectrices, y de ellas el tensor de
              deformaciones, las principales, las tensiones y un plano paralelo a X
              sin tensión normal.
          - id: exerm2223-ext-4-la-galga-a-60-grados-en-tension-plana
            nota: >-
              El problema 1 de la extraordinaria de febrero de 2023: tensión
              plana con una sola galga, a 60°; las tensiones y las
              deformaciones principales, y las componentes intrínsecas en un
              plano paralelo a la dirección 1.
          - id: exerm1819-ext-5-tension-plana-con-la-galga-a-45-grados
            nota: >-
              El problema 1 de la extraordinaria de junio de 2019: el mismo
              enunciado de plantilla que la de febrero de 2023, con la galga a
              45°. Pide las tensiones y direcciones principales, las
              deformaciones principales y σn y τn, con sus sentidos, en el
              plano perpendicular a la galga.
          - id: exerm2122-ext-5-las-galgas-a-15-grados-y-la-direccion-principal
            nota: >-
              El problema 1 de la extraordinaria de febrero de 2022: dos galgas
              a ±15° de x, la εz y la dirección de una principal dada; de ahí
              las principales, las componentes intrínsecas en el plano
              perpendicular a una dirección del plano XY y cinco factores de
              seguridad.
          - id: exerm2021-ord-5-el-cubo-con-dos-galgas
            nota: >-
              El problema 1 de la final de enero de 2021: un cubo con σz por
              conocer y dos galgas en dos caras distintas, en Kp/cm². Pide las
              matrices de tensiones y de deformaciones, la lectura de la otra
              galga, las deformaciones principales y el vector unitario, en
              XYZ, de las direcciones de τmax.
          - id: exerm1516-1par-6-la-roseta-y-el-plano-normal-a-c
            nota: >-
              El problema 2 de 2015-2016, fuera de la ventana: una roseta con
              una galga torcida en el PDF, un módulo muy bajo que da las
              tensiones en kPa, y el vector tensión en el plano normal a una
              galga.
        dominio: >-
          Pasas de deformaciones a tensiones en tensión plana sin usar σ = Eε,
          y sabes cuándo σz no es cero y qué cambia entonces.
    falta:
      - >-
        **~~El escalón de las tensiones de la roseta sigue sin ejemplo nuestro: la
        segunda mitad del ejercicio de clase 4.4 hace de primer peldaño~~ ·
        resuelto el 15 de octubre de 2026.** El escalón empieza ahora por un
        ejemplo nuestro, de εx, εy y γxy a las tensiones y a εz, y sigue con la
        segunda mitad del 4.4.
      - >-
        **~~No hay ejercicios de práctica entre el ejemplo y los de examen:
        después de la roseta a 45° vienen ya las de los parciales~~ · resuelto
        el 15 de octubre de 2026.** El ejercicio de clase 4.4, partido en dos, va en los
        dos escalones: las lecturas y las deformaciones en el primero, las
        tensiones en el segundo.
      - >-
        **~~Las rosetas de 2016-2017 y 2017-2018, a 0°, 60° y 150°, están leídas
        pero no transcritas~~ · resuelto el 15 de octubre de 2026.** Las dos van en el
        escalón de las tensiones.
    antesDeEntrar:
      pasos:
        - >-
          Lee los ángulos desde x, en sentido antihorario: un 30° dibujado
          puede ser interior, y la galga estar a 150°.
        - >-
          Escribe la fórmula de cada galga con γ entera y resuelve εx, εy y
          γxy; en el tensor y en el círculo, γ/2.
        - >-
          Pasa a tensiones con Hooke en tensión plana, no con σ = Eε, y
          calcula εz, que en general no es cero.
      trampa: >-
        γ entera en el círculo o en el tensor arrastra el error hasta el
        factor de seguridad, y ½γ en la fórmula de la galga da una γ doble.
        Las fórmulas de la roseta a 45° solo valen a 45°.

  - id: deformaciones
    titulo: La cuestión de deformaciones, un punto fijo cada año
    pide: >-
      Una deducción o una cuenta corta del tema 3: la rotación de la parte
      antisimétrica, las condiciones de compatibilidad o las componentes de
      la deformación en una dirección.
    porque: >-
      Cae en los seis parciales, siempre como cuestión de 1 punto: 6 de los
      60. Y se repite: la de la rotación salió palabra por palabra en
      2019-2020, 2020-2021 y 2022-2023, tres de los cuatro últimos.
    invariante:
      anios: 6
      fuente: >-
        Contado pregunta a pregunta: 2016-2017 (T4), 2017-2018 (T1), 2018-2019
        (T2), 2019-2020 (T2), 2020-2021 (T1) y 2022-2023 (T1).
    apunte:
      texto: cae en los seis — 1 punto que se repite
      tono: nota
    dominio: >-
      Escribes de memoria la nueva longitud de un elemento girado y por qué su
      cambio es de segundo orden, y sacas la deformación longitudinal y la
      transversal de una dirección cualquiera.
    revisado: '2026-10-15'
    escalones:
      - id: la-rotacion-no-deforma
        titulo: La rotación no cambia la longitud, a primer orden
        aprendes: >-
          A sacar la nueva longitud de un elemento con dr' = dr + Ω×dr y a ver
          que el cambio es de segundo orden en Ω: con un giro pequeño, se
          desprecia.
        teoria:
          tema: t03-deformaciones
          apartado: la-rotación-no-deforma-a-primer-orden
        ejercicios:
          - id: exerm2223-1par-1-la-rotacion-no-cambia-la-longitud
            incrustado: true
            nota: >-
              La cuestión que ha caído tres veces en los cuatro últimos
              parciales, con el mismo enunciado. Lo que se puntúa es la raíz:
              contestar «no cambia» sin ella pierde el punto.
          - id: ejerm3-cu5-el-angulo-tras-la-rotacion
            nota: >-
              Cuestión 5 de autoevaluación del tema 3, la compañera de la de
              2022-2023: allí se pregunta por la longitud de un elemento
              girado, y aquí por el ángulo entre dos. Con un ejemplo nuestro
              que compara la cuenta exacta con la de primer orden.
          - id: exerm1415-1par-2-los-tensores-de-deformacion-y-rotacion
            nota: >-
              La cuestión de 2014-2015, fuera de la ventana: de dónde salen el
              tensor de deformación y el de rotación, y por qué el segundo es
              un giro de sólido rígido. Es lo que hay debajo de la de
              2022-2023.
          - id: exerm1920-ext-1-el-campo-de-desplazamientos-del-prisma
            nota: >-
              La cuestión 1 de la extraordinaria de enero de 2020: un prisma
              con un campo de desplazamientos lineal y cuatro constantes por
              fijar, que salen de dos datos del enunciado: el volumen no cambia
              y el estado es de deformación plana en el plano Oxy.
          - id: exerm2526-ord-6-la-esfera-de-radio-unidad
            nota: >-
              El problema 2 de la parte 1 de la final de enero de 2026: una
              esfera de radio unidad de la que se sabe dónde acaban tres
              puntos. Pide el campo de desplazamientos, el volumen, el giro,
              las principales y los diámetros extremos.
          - id: ejerm3-cu8-la-variacion-de-volumen
            nota: >-
              Cuestión 8 de autoevaluación del tema 3: de las variaciones del
              paralelepípedo elemental que pide la cuestión de 2012-2013, solo
              la de volumen, con un bloque nuestro de deformaciones dadas. Va
              delante de esa cuestión como una de sus piezas.
          - id: exerm1213-1par-1-las-variaciones-del-paralelepipedo-elemental
            nota: >-
              La cuestión de 2012-2013, fuera de la ventana: qué variaciones
              sufre un paralelepípedo elemental cuando el cuerpo se deforma, y
              qué magnitud mide cada una.
        dominio: >-
          Escribes la longitud nueva con su raíz y explicas por qué, con Ω
          pequeño, lo que cambia es de segundo orden y no del orden del giro.
      - id: una-direccion-cualquiera
        titulo: La deformación en una dirección cualquiera
        aprendes: >-
          A sacar la componente longitudinal y la transversal del vector
          deformación de una dirección dada, a partir del tensor o de las
          principales.
        teoria:
          tema: t03-deformaciones
          apartado: el-vector-deformación-y-la-fórmula-de-la-galga
        ejercicios:
          - id: ejerm3-cu6-el-vector-deformacion
            nota: >-
              Cuestión 6 de autoevaluación del tema 3: qué es el vector
              deformación y cómo se parte en sus dos componentes, con un
              tensor nuestro de números limpios. Es lo que la de 2018-2019 da
              por sabido antes de calcular en la dirección k.
          - id: ejerm3-cl3-5-el-paralelepipedo-y-el-punto-e
            nota: >-
              Ejercicio de clase: un paralelepípedo con un campo de
              desplazamientos de tres constantes, que se sacan de lo que se
              mueve un vértice. Después, el tensor en ese vértice y las dos
              componentes del vector deformación en dos direcciones que salen
              de él.
          - id: exerm2526-1par-6-el-paralelepipedo-con-cuatro-constantes
            nota: >-
              El problema 3 del parcial de octubre de 2025, el único de su
              hoja de problemas que ha llegado: otro paralelepípedo, ahora
              con un campo de cuatro constantes. Sigue por las principales,
              el volumen, el área de una sección diagonal y unos ejes
              girados, y acaba en las tensiones de un plano.
          - id: exerm1819-1par-2-dos-deformaciones-principales-iguales
            incrustado: true
            nota: >-
              La cuestión de 2018-2019: dos principales iguales, así que
              cualquier dirección de su plano es principal, y una dirección k
              en la que calcular las dos componentes.
          - id: ejerm3-cu7-la-deformacion-normal-estacionaria
            nota: >-
              Cuestión 7 de autoevaluación del tema 3: una demostración, no
              una cuenta. La de 2013-2014 pide lo mismo para el tensor de
              tensiones; aquí se hace con el vector deformación, y un ejemplo
              nuestro lo comprueba con una dirección vecina.
        dominio: >-
          Calculas εu y ½γu de una dirección dada y sabes qué pasa con las
          direcciones principales cuando dos deformaciones principales son
          iguales.
      - id: las-condiciones-de-compatibilidad
        titulo: Las condiciones de compatibilidad, usadas y deducidas
        aprendes: >-
          A usar la ecuación de compatibilidad del plano,
          εx,yy + εy,xx = γxy,xy, para saber si un campo de deformaciones sale
          de unos desplazamientos de verdad, y a deducirla de que u, v y el
          giro son funciones del punto.
        teoria:
          tema: t03-deformaciones
          apartado: las-condiciones-de-compatibilidad
          nota: >-
            El apartado resuelve la cuestión de 2017-2018 y la comprueba por
            el otro lado, con unos desplazamientos que dan esas deformaciones.
        ejercicios:
          - id: ejerm3-cu10-el-significado-de-la-compatibilidad
            nota: >-
              Cuestión 10 de autoevaluación del tema 3: qué significan las
              condiciones, antes de usarlas en la de 2017-2018. Un ejemplo
              nuestro integra el giro de un campo de deformaciones por dos
              caminos entre los mismos puntos.
          - id: exerm1718-1par-1-la-compatibilidad-del-campo-plano
            nota: >-
              La cuestión de 2017-2018: la ecuación viene en el enunciado, y
              se pide usarla. C1 y C2 salen de exigirla en todos los puntos,
              igualando los coeficientes de x y de y.
          - id: ejerm3-cu11-las-condiciones-que-se-imponen
            nota: >-
              Cuestión 11 de autoevaluación del tema 3: qué se impone, y en
              qué orden, para llegar a la ecuación que la de 2017-2018 da
              hecha y la de 2016-2017 pide deducir. Va entre las dos, con un
              campo nuestro en el que comprobarlo.
          - id: exerm1617-1par-4-la-compatibilidad-en-el-plano
            incrustado: true
            nota: >-
              La cuestión de 2016-2017, la misma palabra por palabra que la de
              2015-2016: aquí no se usa la ecuación, se deduce.
          - id: exerm1516-1par-4-la-compatibilidad-en-el-plano
            nota: >-
              La de 2015-2016, fuera de la ventana: la misma pregunta que la de
              2016-2017, palabra por palabra, con otro campo de ejemplo para
              comprobarla.
          - id: exerm2526-ord-4-la-compatibilidad-en-el-plano
            nota: >-
              La teoría 4 de la parte 1 de la final de enero de 2026: la
              pregunta de 2015-2016 y 2016-2017 con otra palabra, y otro campo
              de ejemplo para comprobarla.
        dominio: >-
          Compruebas con la ecuación si un campo de deformaciones es posible,
          o qué constantes lo hacen posible, y escribes su deducción con las
          dos condiciones de diferencial exacta.
    falta:
      - >-
        **~~Las dos cuestiones de compatibilidad, de 2016-2017 y 2017-2018, están
        leídas pero no transcritas~~ · resuelto el 15 de octubre de 2026.** Las dos van
        en el escalón nuevo de las condiciones de compatibilidad.
    antesDeEntrar:
      pasos:
        - >-
          Si es la de la rotación, escribe dr' = dr + Ω×dr, saca el módulo con
          su raíz y di por qué el cambio es de segundo orden.
        - >-
          Si es de γ, defínela antes de calcular: lo que se cierra el ángulo
          recto, la suma de los giros de las dos aristas.
      trampa: >-
        «La longitud no cambia», sin la raíz, pierde el punto: cambia en
        segundo orden, y con un giro de 0,01 rad el alargamiento relativo
        llega a unas 5·10⁻⁵.

  - id: fallo
    titulo: Las teorías de fallo, con Mohr por delante
    pide: >-
      Una cuestión de 1 punto: deducir un criterio —Mohr o Von Mises— o
      aplicarlo a unos ensayos para sacar un límite o una tensión equivalente.
    porque: >-
      Cae en cinco de los seis parciales, siempre como cuestión: 5 de los 60
      puntos. Cuatro de las cinco son del criterio de los estados límite de
      Mohr y la otra deduce Von Mises. Los factores de seguridad de Tresca y
      Von Mises, además, cierran a menudo el problema de las galgas.
    invariante:
      anios: 5
      fuente: >-
        Contado pregunta a pregunta: 2017-2018 (T3), 2018-2019 (T3), 2019-2020
        (T3), 2020-2021 (T4) y 2022-2023 (T4).
    apunte:
      texto: cae en cinco de seis — casi siempre Mohr
      tono: nota
    dominio: >-
      Calculas un factor de seguridad con Tresca, Von Mises y Mohr sin
      olvidar la principal nula, y deduces la tensión equivalente de Mohr con
      su recta intrínseca.
    revisado: '2026-10-15'
    escalones:
      - id: el-factor-de-seguridad
        titulo: La tensión equivalente y el factor de seguridad
        aprendes: >-
          A ordenar las tres principales, con la nula incluida, y a sacar la
          tensión equivalente y el factor de seguridad de Tresca y de Von
          Mises.
        teoria:
          tema: t06-teorias-de-fallo
          apartado: tensión-equivalente-y-factor-de-seguridad
        ejercicios:
          - id: ejerm6-tresca-con-la-tercera-nula
            incrustado: true
          - id: ejerm6-cu1-la-tension-equivalente
            nota: >-
              Cuestión 1 de autoevaluación del tema 6: el concepto de tensión
              equivalente, de teoría, con un ejemplo nuestro de tres principales
              de signos distintos, 100, 50 y −20 MPa. Entrena a explicar qué es
              y para qué sirve antes de calcularla.
          - id: exerm2223-ext-1-el-concepto-de-tension-equivalente
            nota: >-
              La parte c) de la pregunta 1 de la extraordinaria de febrero de 2023 es,
              palabra por palabra, la cuestión de arriba. Se resuelve con otro
              ejemplo.
          - id: ejerm6-cu5-el-criterio-de-tresca
            nota: >-
              Cuestión 5 de autoevaluación del tema 6: el criterio de Tresca
              deducido, y puesto en relación con el de Mohr. El ejemplo
              nuestro, con tres principales no nulas de 90, 30 y −50 MPa, acaba
              en su factor de seguridad.
          - id: exerm2526-ord-3-la-tension-equivalente-de-tresca
            nota: >-
              La teoría 3 de la parte 1 de la final de enero de 2026: la
              tensión equivalente de Tresca de un tensor con una normal y dos
              tangenciales, que hay que demostrar.
          - id: ejerm6-cu7-factor-y-coeficiente-de-seguridad
            nota: >-
              Cuestión 7 de autoevaluación del tema 6: el factor y el
              coeficiente de seguridad, que el tema define por separado. El
              ejemplo nuestro, una pieza de acero cargada con 40 kN, usa los
              dos con Tresca.
          - id: ejerm6-cu2-el-criterio-de-rankine
            nota: >-
              Cuestión 2 de autoevaluación del tema 6: el criterio de la
              tensión máxima, con límites distintos a tracción y a compresión.
              El ejemplo nuestro es una fundición con una principal de tracción
              y otra de compresión, y acaba en el factor de seguridad del punto.
          - id: ejerm6-cu3-el-criterio-de-saint-venant
            nota: >-
              Cuestión 3 de autoevaluación del tema 6: el criterio de la
              deformación máxima, con las deformaciones principales de la ley de
              Hooke. El ejemplo nuestro, con dos principales de tracción y la
              tercera nula, se compara con lo que daría Rankine en el mismo
              punto.
          - id: exerm1415-1par-4-tres-principales-de-traccion-y-cuatro-criterios
            nota: >-
              La de 2014-2015, fuera de la ventana: dos principales y la
              tangencial máxima, la tercera que hay que sacar de ellas, y
              cuatro factores de seguridad a la vez. Es el 6.1 de clase, con
              los datos del 2.13.
        dominio: >-
          Das el factor de seguridad de Tresca y el de Von Mises de un estado
          plano y explicas por qué la tercera principal cambia el de Tresca.
      - id: los-estados-limite-de-mohr
        titulo: El criterio de los estados límite de Mohr
        aprendes: >-
          A usar σeq = σ1 − kσ3 con k = σet/σec, a sacar k de dos ensayos
          cualesquiera y a deducir el criterio con la recta intrínseca.
        teoria:
          tema: t06-teorias-de-fallo
          apartado: los-estados-límite-de-mohr
        ejercicios:
          - id: exerm2021-1par-4-el-limite-a-compresion-por-mohr
            incrustado: true
            nota: >-
              La cuestión de 2020-2021: un ensayo de tracción y uno de
              cortadura pura, y de ellos el límite a compresión.
          - id: exerm1718-1par-3-mohr-con-un-estado-hidrostatico
            nota: >-
              La cuestión de 2017-2018: un fallo hidrostático y uno de
              cortadura pura en vez de los ensayos de tracción y compresión, y
              de ellos el límite a tracción.
          - id: exerm2526-1par-1-la-chapa-en-rombo-en-estado-de-fallo
            nota: >-
              La pregunta 1 del parcial de octubre de 2025: una chapa en rombo,
              cargada en sus cuatro lados, que está justo en fallo. Pide sus
              principales y, con el límite a compresión, el estado
              hidrostático con el que fallaría el material.
          - id: exerm2223-1par-4-dos-estados-limite-de-mohr
            nota: >-
              La de 2022-2023: dos estados límite encadenados, y por el camino
              la k.
          - id: exerm1819-1par-3-el-criterio-de-los-estados-limites-de-mohr
            nota: >-
              La de 2018-2019, de pura teoría: la curva intrínseca, la recta
              tangente a los dos círculos y la tensión equivalente.
          - id: exerm1617-ext-1-el-criterio-de-mohr-deducido
            nota: >-
              La cuestión 1 de la extraordinaria de junio de 2017, fuera de la
              ventana: la misma teoría que la de 2018-2019, con «Deducir el»
              delante. Comparten la rúbrica; el ejemplo es otro que el de 2018-2019.
          - id: exerm1516-1par-1-los-cilindros-de-hormigon-confinados
            nota: >-
              La cuestión de 2015-2016, fuera de la ventana: dos ensayos de
              hormigón con presión lateral, y la recta intrínseca de Mohr que
              sale de los dos. Es el ejercicio 6.2 de clase con una palabra
              más.
          - id: exerm1415-1par-3-los-criterios-de-fallo-y-el-de-mohr
            nota: >-
              La cuestión de 2014-2015, fuera de la ventana: qué hace un
              criterio de fallo, los cinco del curso uno detrás de otro, y el
              de Mohr deducido de la recta intrínseca, sin números.
          - id: exerm2526-ord-7-el-triangulo-en-deformacion-plana
            nota: >-
              El problema 3 de la parte 1 de la final de enero de 2026: un
              triángulo con tensiones en sus tres caras, en deformación plana.
              Acaba en las deformaciones y en el criterio de Mohr-Coulomb, que
              no sale en ningún otro examen del sitio.
        dominio: >-
          Sacas k de dos ensayos, das un límite que no se ha ensayado y
          escribes la deducción del criterio con su dibujo.
      - id: von-mises-deducido
        titulo: Von Mises, deducido de la energía de distorsión
        aprendes: >-
          A partir la energía de deformación en la parte de volumen y la de
          distorsión, y a llegar desde la segunda a la tensión equivalente.
        teoria:
          tema: t06-teorias-de-fallo
          apartado: energía-de-distorsión-von-mises
        ejercicios:
          - id: ejerm2-cu12-las-componentes-esferica-y-desviadora
            nota: >-
              Cuestión 12 de autoevaluación del tema 2: las componentes
              esférica y desviadora del tensor de tensiones, con un ejemplo
              nuestro que acaba en el cambio de volumen. Va delante de la
              deducción de 2019-2020, que usa esta separación del tensor.
          - id: ejerm4-cu9-la-energia-elastica-de-deformacion
            nota: >-
              Cuestión 9 de autoevaluación del tema 4: la deducción de la
              energía de deformación por unidad de volumen, que la de
              2019-2020 da hecha en su enunciado, con un estado plano nuestro
              en el que calcularla. Va delante porque es el punto de partida
              de esa cuestión.
          - id: exerm1920-1par-3-von-mises-desde-la-energia-de-distorsion
            incrustado: true
            nota: >-
              La cuestión de 2019-2020, con la cortadura pura de comprobación
              al final.
          - id: exerm1718-ord-2-el-criterio-de-von-mises-desde-la-energia
            nota: >-
              La cuestión 2 de la final de enero de 2018: la de 2019-2020 con
              otras palabras, la energía de deformación dada como 2U0, y un
              ejemplo nuestro con números.
          - id: exerm2526-1par-3-la-tension-equivalente-de-von-mises
            nota: >-
              La pregunta 3 del parcial de octubre de 2025: la de 2019-2020
              sin ningún dato en el enunciado; la deducción, entera.
        dominio: >-
          Escribes la deducción de Von Mises desde la energía de distorsión y
          compruebas que en cortadura pura da el factor √3.
    falta:
      - >-
        **~~La cuestión de Mohr de 2017-2018, con un fallo en estado hidrostático
        y otro en cortadura pura, está leída pero no transcrita~~ · resuelto el
        15 de octubre de 2026.** Va en el escalón de los estados límite de Mohr.
    antesDeEntrar:
      pasos:
        - >-
          Ordena las tres principales con su signo, con la nula de la tensión
          plana incluida.
        - >-
          Con Mohr, σeq = σ1 − kσ3, con k = σet/σec, menor que 1 en un frágil,
          y σ3 con su signo; compárala con el límite a tracción.
        - >-
          Si dudas de la fórmula de Von Mises, compruébala con cortadura pura:
          tiene que dar √3·τ.
      trampa: >-
        k al revés, o σ1 − k·|σ3|, dan un estado más seguro de lo que es. Y en
        tensión plana, con las dos del plano del mismo signo, Tresca va con el
        cero: con 120 y 40 MPa, la equivalente es 120, no 80.

  - id: hooke
    titulo: Hooke, el prisma restringido y las cotas de ν
    pide: >-
      Una cuestión de 1 punto del tema 4: un prisma que no puede deformarse en
      alguna dirección, las cotas del coeficiente de Poisson o las ecuaciones
      de Lamé.
    porque: >-
      Cae en tres de los seis parciales, 4 de los 60 puntos, y en 2022-2023
      con dos cuestiones a la vez. La de las cotas de ν salió igual en
      2020-2021 y en 2022-2023.
    invariante:
      anios: 3
      fuente: >-
        Contado pregunta a pregunta: 2017-2018 (T2), 2020-2021 (T3) y
        2022-2023 (T2 y T3).
    apunte:
      texto: cae en tres de seis — 4 de los 60 puntos
      tono: nota
    dominio: >-
      Resuelves un prisma metido en un hueco rígido con Hooke generalizado y
      justificas las dos cotas de ν, cada una con su motivo físico.
    revisado: '2026-10-15'
    escalones:
      - id: el-prisma-restringido
        titulo: El prisma que no se puede deformar hacia un lado
        aprendes: >-
          A escribir Hooke generalizado con la deformación impedida igualada a
          cero y a despejar la tensión que hacen las paredes.
        teoria:
          tema: t04-cuerpo-elastico
          apartado: un-prisma-en-un-hueco-rígido
        ejercicios:
          - id: ejerm4-cubo-en-un-hueco-rigido
            incrustado: true
          - id: ejerm4-cu2-la-ley-de-hooke
            nota: >-
              Cuestión 2 de autoevaluación del tema 4: la ley de Hooke escrita
              entera, de dónde sale cada término, y un elemento nuestro con
              tres normales y una tangencial. Es la ley que se usa después en
              el prisma restringido, antes de igualar a cero ninguna
              deformación.
          - id: ejerm4-cl4-1-el-cuerpo-libre-en-z
            nota: >-
              Ejercicio de clase: el mismo hueco que el ejemplo, en letras
              —σ0, E y ν— y con las tres aristas además del volumen. Los pasos
              de cálculo lo comprueban con ν = 0,25, un ejemplo nuestro.
          - id: ejerm4-cl4-2-el-cuerpo-impedido-en-z
            nota: >-
              Ejercicio de clase: el hueco del 4.1 con la deformación impedida
              también en z, y un apartado más con ν = ½. Todo en letras; los
              pasos de cálculo lo comprueban con ν = 0,25.
          - id: ejerm4-cu7-el-efecto-de-la-temperatura
            nota: >-
              Cuestión 7 de autoevaluación del tema 4: la temperatura en la
              ley de Hooke, y un prisma nuestro que se calienta entre dos
              paredes que solo le impiden deformarse en una dirección. Es el
              primero del escalón con temperatura, antes del 4.5 de clase.
          - id: ejerm4-cl4-5-acero-y-aluminio-separados-por-una-placa
            nota: >-
              Ejercicio de clase, en kp/cm² y cm: un bloque de acero y otro de
              aluminio, calentados distinto, en un hueco rígido y separados por
              una placa rígida suelta, como la pared que se mueve en el de
              2022-2023. Aquí empuja la temperatura, no una carga.
          - id: exerm2223-1par-2-los-bloques-en-el-marco-rigido
            nota: >-
              La cuestión de 2022-2023: dos bloques distintos en un mismo
              marco, y lo que baja la cara libre de uno de ellos.
          - id: exerm1718-ext-5-el-bloque-comprimido-que-levanta-el-cuerpo-2
            nota: >-
              El problema 1 de la extraordinaria de junio de 2018, fuera de la
              ventana: sin marco ni paredes, un cuerpo libre en z, comprimido
              de lado y cargado por el que lleva encima. Pide la tensión
              lateral que hace subir el cuerpo de arriba una distancia dada,
              las tres variaciones de longitud y la de volumen.
          - id: ejerm4-cl4-3-el-hueco-y-la-temperatura
            nota: >-
              Ejercicio de clase: el hueco del 4.1 con una variación de
              temperatura T además de la carga σ0, y la T que deja el volumen
              sin cambiar. Todo en letras; los pasos de cálculo lo comprueban
              con ν = 0,3. Ningún examen de la ventana mete temperatura en un
              hueco.
          - id: exerm2526-ord-2-el-cubo-en-la-cavidad-rigida
            nota: >-
              La teoría 2 de la parte 1 de la final de enero de 2026: un cubo
              en una cavidad rígida que solo lo deja deformarse en x, y un
              cambio de temperatura. Pide los dos tensores en letras.
          - id: exerm1516-1par-2-la-columna-en-el-hueco-rigido
            nota: >-
              La de 2015-2016, fuera de la ventana: solo una parte de la
              columna está metida en el hueco, y es esa la que hay que
              resolver. Primero, qué dirección está libre y cuál impedida.
          - id: exerm1415-1par-5-el-prisma-entre-placas-y-cables
            nota: >-
              El problema 1 de 2014-2015, fuera de la ventana: el prisma no
              está entre paredes rígidas, sino entre dos placas unidas por
              cables. Es el 4.6 de clase.
          - id: exerm1213-1par-4-el-prisma-entre-placas-y-cuatro-cables
            nota: >-
              El problema 1 de 2012-2013, fuera de la ventana: el mismo prisma
              entre placas y cables que el de 2014-2015, contado con otras
              palabras, y además la variación de volumen.
          - id: exerm2526-ord-5-el-prisma-de-hormigon-y-los-ocho-cables
            nota: >-
              El problema 1 de la parte 1 de la final de enero de 2026: el
              prisma entre placas y cables de 2012-2013 y 2014-2015 con ocho
              cables y hormigón, y al final la tangencial en el plano de una
              microfisura.
        dominio: >-
          Escribes las tres ecuaciones de Hooke de un prisma restringido,
          igualas a cero las que toca y sacas la tensión y la deformación que
          quedan.
      - id: las-ecuaciones-de-lame
        titulo: Las tensiones a partir de las deformaciones
        aprendes: >-
          A despejar las tensiones de la ley de Hooke en tres pasos —sumar
          las tres ecuaciones, sumar y restar νσx, despejar— hasta
          σx = 2Gεx + λe, y a escribir λ con E y ν.
        teoria:
          tema: t04-cuerpo-elastico
          apartado: tensiones-a-partir-de-deformaciones-las-ecuaciones-de-lamé
        ejercicios:
          - id: exerm1718-1par-2-las-tensiones-a-partir-de-las-deformaciones
            incrustado: true
            nota: >-
              La cuestión de 2017-2018 es una línea sin datos: hay que
              deducir, no calcular. Los pasos de cálculo lo comprueban con las
              deformaciones del problema 2 del mismo examen.
        dominio: >-
          Deduces σx = 2Gεx + λe y τxy = Gγxy desde Hooke sin mirar el tema, y
          con ellas pasas de un tensor de deformaciones al de tensiones.
      - id: las-cotas-de-poisson
        titulo: Entre qué valores está ν, y por qué
        aprendes: >-
          A justificar las dos cotas de ν, cada una con un módulo que tiene
          que ser positivo.
        teoria:
          tema: t04-cuerpo-elastico
          apartado: entre-qué-valores-está-ν
        ejercicios:
          - id: ejerm4-cu6-la-relacion-entre-e-g-y-nu
            nota: >-
              Cuestión 6 de autoevaluación del tema 4: la demostración de
              G = E/2(1 + ν) en tensión plana, con dos materiales nuestros en
              los que despejar ν y G. Va antes de la de las cotas de ν, que
              usa esta relación sin deducirla.
          - id: exerm2223-1par-3-las-cotas-del-coeficiente-de-poisson
            incrustado: true
            nota: >-
              La misma cuestión, con el mismo enunciado, en 2020-2021 y en
              2022-2023. Lo que se puntúa es la justificación de cada cota.
        dominio: >-
          Escribes las dos cotas de ν y de dónde sale cada una sin mirar el
          tema.
    falta:
      - >-
        **~~La cuestión de 2017-2018, sacar las tensiones a partir de las
        deformaciones, que son las ecuaciones de Lamé, está leída pero no
        transcrita~~ · resuelto el 15 de octubre de 2026.** Abre el escalón nuevo de
        las ecuaciones de Lamé.
    antesDeEntrar:
      pasos:
        - >-
          Primero, la condición de cada dirección: libre, tensión nula;
          impedida, deformación nula; nunca las dos a la vez.
        - >-
          Con holgura, mira primero si el prisma toca la pared: mientras no,
          esa dirección está libre.
        - >-
          Al acabar, comprueba el signo: la pared solo empuja, así que su
          tensión tiene que salir de compresión.
      trampa: >-
        Las cotas de ν son −1 < ν < 0,5, no 0 < ν < 0,5: cada límite sale de
        un módulo que tiene que ser positivo, G el de abajo y k el de arriba,
        y se puntúa esa justificación.

  - id: simulacro
    titulo: El simulacro, con lo que queda de un parcial entero
    apunte:
      texto: de una sentada, y sin la solución al lado
      tono: marco
    pide: >-
      Las cuestiones y los problemas de los temas 1 a 6 de un primer parcial,
      de una sentada.
    porque: >-
      Los bloques de arriba entrenan cada hueco por separado, y el parcial no
      va por separado: salta de una deducción de un punto a un problema de
      dos. Estos son los seis parciales de la ventana, con su resolución
      detrás. Los seis llegaban al tema 8, así que cada nota dice qué
      preguntas saltar, con el número que llevan en la hoja, y van de más a
      menos puntos de los temas 1 a 6. Cada uno se abre con reloj: quita las
      preguntas que dice su nota y el reloj se ajusta solo.
    dominio: >-
      Hacer de una sentada lo que es de los temas 1 a 6 de un parcial, sin
      abrir la resolución, y después contar cuántos apartados habrías dado
      por buenos sin serlo.
    material:
      - tipo: examen
        curso: '2022-2023'
        convocatoria: primer-parcial
        nota: >-
          El más reciente de los enteros, y el que conviene hacer primero: la
          rotación, Poisson y el tensor en la placa. Salta el 7 de la hoja, el
          problema 3, la barra con resorte; quedan 8 de sus 10 puntos.
      - tipo: examen
        curso: '2017-2018'
        convocatoria: primer-parcial
        nota: >-
          El tensor con los números de 2016-2017 en otros sitios, la
          compatibilidad y Mohr con un fallo hidrostático. Salta el 4 y el 7 de
          la hoja, la cuestión del depósito y el problema 3, la barra rígida
          con su tirante; quedan 7 de sus 10 puntos.
      - tipo: examen
        curso: '2016-2017'
        convocatoria: primer-parcial
        nota: >-
          Se hizo en dos días, la teoría el 7 y los ejercicios el 14 de
          noviembre. El elemento diferencial y una roseta sobre un triángulo.
          Salta el 3a y el 3b de la hoja, las dos mitades de la cuestión 3,
          del tema 7, y el 7, el problema 3, la barra fabricada corta; quedan
          6 de sus 10 puntos. El 2, el alambre que se enfría, la hoja lo pone
          en el tema 8, pero el tema 4 lo trae como ejemplo de la
          temperatura: hazlo también.
      - tipo: examen
        curso: '2020-2021'
        convocatoria: primer-parcial
        nota: >-
          Una roseta a 120° en dos mitades, de las lecturas a las tensiones.
          Salta el 6 y el 7 de la hoja, los problemas 2 y 3: la Gerber
          empotrada y las barras; quedan 6 de sus 10 puntos.
      - tipo: examen
        curso: '2019-2020'
        convocatoria: primer-parcial
        nota: >-
          La chapa hexagonal y Von Mises deducido. Salta el 4, el 6 y el 7 de
          la hoja: la cuestión del depósito con galgas y los problemas 2 y 3,
          los diagramas y las barras; quedan 5 de sus 10 puntos.
      - tipo: examen
        curso: '2018-2019'
        convocatoria: primer-parcial
        nota: >-
          El que menos sirve este curso: de sus siete preguntas solo son de
          los temas 1 a 6 las cuestiones 1 a 3, 3 de sus 10 puntos. Las otras
          cuatro son de barras y de diagramas, aunque el b/ del 5 de la hoja,
          el plano a 30°, se hace suelto con el tema 2.
    falta:
      - >-
        **~~Los parciales de 2016-2017 y 2017-2018 están leídos pero no
        transcritos, así que hay cuatro simulacros y no seis~~ · resuelto el
        15 de octubre de 2026.** Son seis.
      - >-
        No hay un parcial entero solo de los temas 1 a 6: los seis de la
        ventana llegaban al tema 8, y del de octubre de 2025 solo están la
        hoja de teoría y el problema 3. Lo que queda de cada uno no llega a los 10 puntos de un
        parcial entero.
    revisado: '2026-10-25'

  - id: formulario
    titulo: Lo que hay que llevar sabido
    apunte:
      texto: repaso, no aprendizaje
      tono: marco
    pide: >-
      El convenio, Cauchy, las principales, la fórmula de la galga, Hooke en
      tensión plana y los criterios de fallo, de memoria.
    porque: >-
      Va el último porque es repaso, no aprendizaje: es el bloque del rato de
      antes de entrar. Cada tema acaba con su lista de lo que hay que llevar
      sabido, y aquí están las cuatro, en el orden del temario. No hay nada en
      ellas que no esté en su tema.

      **Las listas de todos los temas escritos están juntas en una sola página**, hecha para imprimirse a dos columnas: [el formulario de Elasticidad](/road-to-ingenieria/elasticidad-resistencia/formulario/). Lleva también las de los temas que este parcial no pide. Se leen de los temas, así que no hay nada escrito ahí que no esté en ellos.
    dominio: >-
      Escribir de memoria y en papel Cauchy, la fórmula de la galga, Hooke en
      tensión plana y σeq de Mohr, sin consultar nada. Si tienes que mirar una sola vez, todavía no.
    material:
      - tipo: teoria
        tema: t02-tensiones
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          El convenio, el equilibrio interno, Cauchy, las principales y Mohr.
      - tipo: teoria
        tema: t03-deformaciones
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          γ/2 en el tensor, la fórmula de la galga y la compatibilidad.
      - tipo: teoria
        tema: t04-cuerpo-elastico
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          Hooke en los dos sentidos, las constantes con las cotas de ν y la
          tensión plana.
      - tipo: teoria
        tema: t06-teorias-de-fallo
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          La tensión equivalente de cada criterio, Mohr incluido, y el
          factor de seguridad.
    falta:
      - >-
        **~~Elasticidad no tiene todavía un formulario en una sola página, hecho
        para imprimirse: hay que leer las seis listas por separado~~ · resuelto
        el 15 de octubre de 2026.** La página ya existía, armada sola con las
        listas de los temas como la de Cálculo, y este bloque no la enlazaba;
        ahora la enlaza.
    revisado: '2026-10-23'
