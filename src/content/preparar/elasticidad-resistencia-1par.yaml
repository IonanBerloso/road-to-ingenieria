# La ruta del primer parcial de Elasticidad y Resistencia de Materiales,
# medida sobre los seis primeros parciales del material desde 2016-2017:
# 2016-2017, 2017-2018, 2018-2019, 2019-2020, 2020-2021 y 2022-2023. El de
# 2021-2022 no está en el material, ni ninguno posterior.
#
# La ventana empieza en 2016-2017 porque ahí cambió el examen: hasta 2015-2016
# el parcial llegaba a la flexión, con un problema del tema 9 en los cuatro
# anteriores, y desde entonces no trae ninguno. Contar aquellos cuatro sería
# medir otro examen. Se van transcribiendo desde el 15 de octubre de 2026, y
# cada uno entra en `fueraDeLaVentana`: sus ejercicios de los temas 2 a 8 van
# en los escalones para practicar, y el del tema 9 se queda en su examen.
#
# Los seis tienen el mismo formato: cuatro preguntas de teoría de 1 punto y
# tres problemas de 2 puntos, con los puntos impresos junto a cada pregunta.
# Por eso aquí se cuentan PUNTOS y no solo apariciones: son 42 preguntas y 60
# puntos (la pregunta 3 de 2016-2017 son dos mitades de medio punto y cuenta
# como una). El reparto por hueco, del 15 de octubre de 2026:
#
#   barras y sólido rígido (tema 8) ..... 16 pts   9 preguntas   en los 6
#   el tensor de tensiones (tema 2) ..... 12 pts   8 preguntas   en los 6
#   galgas (temas 3 y 4) ................  8 pts   4 preguntas   en 4
#   diagramas de esfuerzos (tema 7) .....  7 pts   4 preguntas   en 4
#   la cuestión de deformaciones (t. 3) .  6 pts   6 preguntas   en los 6
#   teorías de fallo (tema 6) ...........  5 pts   5 preguntas   en 5
#   Hooke y Poisson (tema 4) ............  4 pts   4 preguntas   en 3
#   depósitos de pared delgada (t. 8) ...  2 pts   2 preguntas   en 2
#
# Qué pregunta va a qué hueco es una lectura humana (§10): cada
# `invariante.fuente` la dice pregunta a pregunta, con la T de teoría y la P
# de problema que lleva el inventario. Las sumas las hizo un guion sobre ese
# reparto, no se hicieron a mano.
#
# Los seis están transcritos con su resolución. Los de 2016-2017 y 2017-2018
# fueron los últimos, el 15 de octubre de 2026: sus quince ejercicios están en
# el escalón de lo que piden, y cinco apartados de teoría que no tenían
# escalón, porque no tenían ejercicio, tienen ahora el suyo. El reparto de
# arriba no cambia, porque ya contaba esos dos parciales.
#
# Y una advertencia que no se puede resolver desde aquí: el parcial de este
# curso es el 30 de octubre de 2026, antes que cualquiera del material (entre
# el 26 de octubre y el 20 de noviembre), y en 2019 los ejercicios del tema 8
# se hicieron en clase entre el 30 de octubre y el 4 de noviembre. Si el aviso
# del parcial en eGela deja fuera el tema 8, sobran el primer bloque y el
# último hueco. Lo dicen los dos bloques, que es donde se lee.
asignatura: elasticidad-resistencia
evaluacion: primer-parcial
titulo: Preparar el primer parcial, de las tensiones al axil
lede: >-
  Lo que cae en el primer parcial, ordenado por lo que puntúa: cuarenta y dos
  preguntas y sesenta puntos contados en seis parciales. Las barras con sólido
  rígido van primero porque son el problema que no ha faltado nunca, y el
  hueco que más puntos ha dado.
temas:
  - t02-tensiones
  - t03-deformaciones
  - t04-cuerpo-elastico
  - t06-teorias-de-fallo
  - t07-piezas-prismaticas
  - t08-esfuerzo-axial
medidoSobre: 6
fueraDeLaVentana:
  - curso: '2015-2016'
    porque: >-
      Es el último parcial que llegaba a la flexión: su tercer problema es del
      tema 9, que desde 2016-2017 no ha vuelto a entrar, y su teoría reparte
      los cuatro puntos en cinco preguntas. Sus ejercicios de los temas 2 a 8
      están en los escalones para practicar; lo que no hacen es contar en los
      puntos de cada hueco.
criterioDeOrden: >-
  Por los puntos que cada hueco ha sumado en los seis parciales, de más a
  menos, con el suelo delante porque sin sus convenios los demás bloques salen
  con el signo cambiado. Los puntos van impresos en cada pregunta, así que se
  cuentan en vez de suponerse. Detrás van el simulacro y lo que hay que llevar
  sabido. El tema 5 no tiene bloque: ninguno de los seis parciales le dedica
  una pregunta.

bloques:
  - id: suelo
    titulo: Los tres convenios, que no dan puntos y deciden todos los signos
    pide: >-
      Nada por sí mismos: son las reglas con las que se lee cualquier
      enunciado del parcial, y un signo cambiado en una tensión, en una γ o
      en un flector arrastra todo lo que viene detrás.
    porque: >-
      No ocupa hueco propio en ninguno de los seis parciales, y por eso su
      recuento honesto es cero. Está dentro de las cuarenta y dos preguntas: el
      signo de τxy decide hacia dónde gira la dirección principal, γxy es lo
      que se cierra el ángulo recto y en el tensor entra su mitad, y el flector
      positivo tracciona la fibra de abajo, con la y hacia abajo. La cuestión
      de 2016-2017 que pide el equilibrio del elemento diferencial se puntúa
      por el dibujo, y el dibujo es el convenio.
    invariante:
      anios: 0
      fuente: >-
        Cero como pregunta propia en los seis parciales leídos; presente en
        las cuarenta y dos como criterio de signo.
    apunte:
      texto: no puntúa — sostiene las cuarenta y dos preguntas
      tono: marco
    dominio: >-
      Dibujas sin mirar un elemento con sus tensiones positivas, dices qué
      signo tiene γxy cuando el ángulo recto se abre y sabes qué fibra
      tracciona un flector positivo.
    revisado: '2026-10-15'
    escalones:
      - id: las-tensiones-positivas
        titulo: Las tensiones positivas, cara a cara
        aprendes: >-
          A dibujar σ y τ positivas en las caras de un elemento: en la cara
          positiva hacia el eje y en la negativa al revés, y τxy con la normal
          primero y la dirección después.
        teoria:
          tema: t02-tensiones
          apartado: el-convenio-de-signos-del-curso
          nota: >-
            El apartado acaba con la cuestión de 2016-2017, el equilibrio del
            elemento diferencial, y dice qué se puntúa en ella: el dibujo.
        ejercicios:
          - id: ejerm2-circulo-de-mohr-en-tension-plana
            nota: >-
              El ángulo de la dirección principal sale con el signo de τxy:
              cámbialo y la dirección gira hacia el otro lado.
          - id: exerm1617-1par-1-el-equilibrio-del-elemento-diferencial
            incrustado: true
            nota: >-
              La cuestión de 2016-2017. Pide dibujar solo las componentes que
              influyen: para la ecuación en y, las que apuntan según y en cada
              pareja de caras, con su incremento en la cara opuesta.
        dominio: >-
          Dibujas las tensiones positivas de un elemento plano y explicas por
          qué τxy sube en la cara de la derecha y baja en la de la izquierda.
      - id: la-gamma-y-su-mitad
        titulo: γ es lo que se cierra el ángulo, y en el tensor va la mitad
        aprendes: >-
          A leer γxy como la disminución del ángulo recto entre x e y, y a
          escribir el tensor de deformaciones con γ/2 fuera de la diagonal.
        teoria:
          tema: t03-deformaciones
          apartado: el-convenio-y-la-notación-del-curso
        ejercicios:
          - id: ejerm3-roseta-a-45
            nota: >-
              La γxy de la roseta sale de la galga a 45°, y al tensor y al
              círculo de Mohr entra su mitad.
        dominio: >-
          Escribes el tensor de deformaciones de un estado plano con γ/2 en su
          sitio y dices sin dudar qué significa una γxy negativa.
      - id: el-flector-positivo
        titulo: El flector positivo tracciona la fibra de abajo
        aprendes: >-
          A dar signo a N, T y M con el convenio del curso, la y hacia abajo,
          y a sacarlos de las fuerzas que quedan a la izquierda de la sección.
        teoria:
          tema: t07-piezas-prismaticas
          apartado: el-convenio-de-signos-del-curso
          nota: >-
            Es el mismo convenio que Mecánica Aplicada, con otra letra para la
            cortante: T en los apuntes, V en las diapositivas.
        ejercicios:
          - id: ejerm7-la-viga-con-rotula
            nota: >-
              El flector del empotramiento sale negativo: tracciona la fibra
              de arriba, y el signo hay que justificarlo así.
        dominio: >-
          Escribes N, T y M de una sección con las fuerzas de su izquierda y
          sabes justificar el signo de cada uno sin mirar el convenio.

  - id: barras
    titulo: Barras y sólido rígido, el problema que no ha faltado nunca
    pide: >-
      Una pieza rígida articulada y sostenida por dos o tres barras, a veces
      con un resorte, una holgura, un error de montaje o un cambio de
      temperatura: los axiles, las tensiones y un desplazamiento o un giro.
    porque: >-
      Es el último problema de los seis parciales, sin una excepción, y además
      cae como cuestión: el alambre pretensado de 2016-2017 y los dos cables
      de 2018-2019, el año que sumó tres preguntas del tema. Son nueve de las
      cuarenta y dos preguntas y 16 de los 60 puntos, más que ningún otro
      hueco. Una advertencia que no se puede resolver desde aquí: el parcial
      de este curso es el 30 de octubre, antes que cualquiera del material, y
      en 2019 estos ejercicios se hacían en clase entre el 30 de octubre y el 4
      de noviembre. Si el aviso del parcial en eGela deja fuera el tema 8, este
      bloque sobra, y el de los depósitos también.
    invariante:
      anios: 6
      fuente: >-
        Contado pregunta a pregunta: 2016-2017 (T2 y P3), 2017-2018 (P3),
        2018-2019 (T4, P1 y P3), 2019-2020 (P3), 2020-2021 (P3) y 2022-2023
        (P3). Los puntos son los impresos junto a cada pregunta.
    apunte:
      texto: cae en los seis — 16 de los 60 puntos
      tono: nota
    dominio: >-
      Ante una pieza rígida con dos o tres barras cuentas las incógnitas que
      la estática no cierra, las supones todas a tracción, escribes la
      compatibilidad con el giro pequeño y la resuelves con la temperatura o
      la holgura dentro, dejando que el signo diga cuál está comprimida.
    revisado: '2026-10-15'
    escalones:
      - id: la-barra-que-no-puede-alargarse
        titulo: El alargamiento, y una barra que no puede alargarse
        aprendes: >-
          A escribir el alargamiento de una barra con su término térmico,
          ΔL = NL/(EA) + αΔT·L, y a igualarlo a cero cuando sus dos extremos
          están fijos: la deformación que la temperatura no puede dar se
          convierte en tensión.
        teoria:
          tema: t08-esfuerzo-axial
          apartado: el-alargamiento
          nota: >-
            El apartado acaba con la cuestión del alambre de 2016-2017
            resuelta, con Eα = 2,94 MPa por grado.
        ejercicios:
          - id: ejerm8-la-barra-entre-dos-paredes
            incrustado: true
            nota: >-
              Nuestro, el peldaño de antes del alambre: una barra montada sin
              tensión entre dos paredes, que se calienta y se enfría. Entrena
              la ecuación de una barra que no puede alargarse y a decir el
              signo de la tensión antes de hacer la cuenta.
          - id: exerm1617-1par-2-el-alambre-pretensado-que-se-enfria
            incrustado: true
            nota: >-
              La cuestión de 2016-2017. El enunciado llama rígido al alambre,
              y lo rígido son los soportes: el alambre no puede cambiar de
              longitud, así que al enfriarse se tensa más en vez de
              aflojarse.
        dominio: >-
          Sacas la tensión de una barra sujeta por los dos extremos a
          cualquier temperatura, y dices antes de calcular si al enfriarla se
          tensa o se afloja.
      - id: dos-barras-que-se-alargan-igual
        titulo: Dos barras que se alargan lo mismo
        aprendes: >-
          A ver cuándo la estática no basta y a cerrar el problema con una
          sola ecuación de compatibilidad, en el caso más corto: dos barras en
          paralelo que comparten la carga.
        teoria:
          tema: t08-esfuerzo-axial
          apartado: isostático-o-hiperestático
        ejercicios:
          - id: ejerm8-la-varilla-y-el-tubo-que-cuelgan-juntos
            incrustado: true
            nota: >-
              Nuestro, antes de los dos cables: dos piezas de distinto
              material que cuelgan del techo y sostienen la misma placa.
              Entrena a contar incógnitas y ecuaciones, a escribir la de
              compatibilidad que falta y a resolver el reparto de la carga.
          - id: exerm1819-1par-4-dos-cables-y-un-peso
            incrustado: true
            nota: >-
              La cuestión de 2018-2019: dos cables de distinto material que
              bajan juntos con el peso. La fuerza se reparte según la rigidez
              de cada uno, y es un punto que se gana en pocos minutos.
        dominio: >-
          Dices de un vistazo si un sistema de barras es hiperestático y
          escribes la ecuación que falta antes de calcular nada.
      - id: la-pieza-rigida
        titulo: La pieza rígida colgada, y la ecuación que falta
        aprendes: >-
          A escribir la compatibilidad de una pieza rígida que gira poco: cada
          punto se mueve el giro por su distancia a la articulación, en
          perpendicular, y el alargamiento de cada barra es ese desplazamiento
          proyectado sobre ella.
        teoria:
          tema: t08-esfuerzo-axial
          apartado: el-sólido-rígido-y-sus-barras
        ejercicios:
          - id: ejerm8-la-barra-rigida-colgada
            incrustado: true
          - id: ejerm8-cla6-la-pieza-en-l-y-la-barra-a-45
            nota: >-
              La propuesta A6 de clase: una pieza en L colgada de O, con una
              barra vertical y otra a 45°. A está justo debajo de O y se mueve
              en horizontal, así que la barra inclinada solo se alarga la
              proyección; es la idea del 2017-2018 con una ecuación más.
          - id: exerm1718-1par-7-la-barra-rigida-y-el-tirante
            nota: >-
              El problema 3 de 2017-2018, isostático: el tirante sale de los
              momentos en A. Lo que se pide es cuánto se mueve B, que va en
              perpendicular a AB, y su proyección sobre el tirante es lo que
              este se alarga. La figura no lleva cotas: salen de los ángulos.
          - id: exerm1819-1par-7-ab-rigida-con-dos-barras
            nota: >-
              El problema 3 de 2018-2019: las dos barras tienen distinto
              módulo, así que el reparto no lo decide solo el brazo de cada
              una.
          - id: exerm1920-1par-7-la-pieza-en-escalon-colgada-de-dos-barras
            nota: >-
              El de 2019-2020 pide además los dos desplazamientos de un punto
              de la pieza, el horizontal y el vertical, que salen del mismo
              giro.
          - id: exerm1617-1par-7-la-barra-corta-y-la-viga-rigida
            nota: >-
              El problema 3 de 2016-2017: no hay carga, y las tres barras
              trabajan porque la 3 se fabricó corta en ξ. Entra con h = −ξ, y
              el resultado va en función de η, que el enunciado no da: la 3
              sale a tracción y las otras dos, a compresión.
          - id: exerm2021-1par-7-dos-piezas-rigidas-y-tres-barras
            nota: >-
              El de 2020-2021: dos piezas rígidas unidas por tres barras, la
              carga máxima con una tensión admisible y, al final, la barra 3
              calentada sin carga.
          - id: exerm1516-1par-3-el-proceso-de-deformacion-de-una-barra
            nota: >-
              La otra media cuestión de 2015-2016, fuera de la ventana: cómo
              se deforma una barra de una estructura articulada, en los
              cuatro pasos de los apuntes.
        dominio: >-
          Sacas los axiles y el giro de una pieza rígida sostenida por dos
          barras distintas, y compruebas con el dibujo que las barras que
          dices traccionadas se alargan de verdad.
      - id: temperatura-holguras-y-muelles
        titulo: Temperatura, holguras y muelles
        aprendes: >-
          A meter en la compatibilidad lo que no es carga: el αΔT de una barra
          calentada, la holgura que hay que cerrar antes de que trabaje la
          pared y un resorte en lugar de una barra.
        teoria:
          tema: t08-esfuerzo-axial
          apartado: barras-entre-paredes-holguras-y-muelles
        ejercicios:
          - id: ejerm8-la-barra-calentada-que-toca-la-pared
            incrustado: true
            nota: >-
              Nuestro, de una sola idea: una barra calentada con 0,6 mm de
              hueco hasta la pared. Mientras no toca no tiene tensión; cuando
              toca, el alargamiento total vale el hueco, no cero.
          - id: ejerm8-cl8-1-la-viga-con-una-barra-calentada
            nota: >-
              El 8.1 de clase: la viga rígida gira alrededor de B con la barra
              1 calentada. Es el problema de 2022-2023 sin el resorte ni los
              diagramas, y su apartado b deja la barra 1 sin poder alargarse.
          - id: exerm2223-1par-7-la-barra-rigida-con-resorte-y-temperatura
            incrustado: true
            nota: >-
              El problema 3 del último parcial del material: un resorte en
              lugar de una barra y la barra 1 calentada. Acaba pidiendo los
              diagramas de la barra rígida, que es el tema 7 dentro del 8.
          - id: exerm1819-1par-5-la-barra-que-toca-la-pared
            nota: >-
              La holgura de 2018-2019: primero la carga que la cierra y después
              la barra apoyada en las dos paredes. Trae además un plano
              inclinado y una dirección u, de los temas 2 a 4.
          - id: exerm1516-1par-5-la-viga-rigida-con-un-resorte-en-e
            nota: >-
              El problema 1 de 2015-2016, fuera de la ventana: la viga rígida
              con dos barras, y un resorte muy blando que no sujeta la viga
              sino el extremo de una barra. Es el 8.6 de clase.
        dominio: >-
          Escribes la compatibilidad de una barra calentada o con holgura con
          el término térmico y el geométrico en su sitio, y sabes decir qué
          pasa si la holgura no llega a cerrarse.
    falta:
      - >-
        Los escalones de las dos barras en paralelo y de la barra que no puede
        alargarse empiezan por un ejemplo nuestro, pero siguen sin práctica
        entre el ejemplo y el examen: los ejercicios de clase del tema 8 no
        traen ninguno de esos dos tipos. Tampoco hay en el escalón de las
        holguras uno de muelle de clase: A9 lleva un resorte, pero es
        hiperestático de grado dos y su figura no deja claro dónde se une la
        barra 2. El 8.6, que lleva otro, es el problema 1 de 2015-2016 y está
        en el escalón como examen.
      - >-
        **~~Un ejemplo de holgura o de temperatura antes de los de examen: la
        temperatura entra por la cuestión del alambre de 2016-2017, y el
        escalón de las holguras y los muelles empieza directamente en el
        problema de 2022-2023~~ · resuelto el 15 de octubre de 2026.** El
        escalón empieza ahora por un ejemplo nuestro de holgura con
        temperatura y sigue con el 8.1 de clase, una viga rígida con una
        barra calentada.
      - >-
        **~~Los problemas 3 de 2016-2017 (una barra montada más corta de lo que
        mide el hueco) y de 2017-2018 (una barra rígida inclinada con su
        tirante), y la cuestión del alambre pretensado de 2016-2017, están
        leídos pero no transcritos~~ · resuelto el 15 de octubre de 2026.** El alambre
        está en el primer escalón, y los dos problemas, en el de la pieza
        rígida.
    antesDeEntrar:
      pasos:
        - >-
          Cuenta incógnitas y ecuaciones: con la pieza articulada y dos
          barras, falta una de compatibilidad.
        - >-
          Supón todas las barras a tracción, aunque alguna parezca comprimida:
          el signo de N lo dirá al final.
        - >-
          Cada punto se mueve el giro de la pieza por su distancia a la
          articulación, en perpendicular; cada barra se alarga lo que eso se
          proyecta sobre ella.
        - >-
          Mete en cada barra su ε0 con el signo que tendría sin carga: αΔT si
          se calienta, h/L con h negativa si es corta.
      trampa: >-
        Escribir ΔL1 = ΔL2 «porque la pieza es rígida». Rígido no es inmóvil:
        si está articulada, gira, y los descensos son proporcionales a la
        distancia a la articulación.

  - id: tensor
    titulo: El tensor de tensiones, que cae todos los años
    pide: >-
      Tensiones y direcciones principales de un tensor, el vector tensión de
      un plano con sus componentes intrínsecas y el círculo de Mohr; en teoría,
      la deducción de Cauchy o la de las direcciones principales.
    porque: >-
      Cae en los seis parciales: como problema 1 en cuatro de ellos y como
      cuestión en los otros dos, y 2016-2017 y 2019-2020 traen además una
      cuestión del tema junto al problema. Son ocho de las cuarenta y dos
      preguntas y 12 de los 60 puntos. El tensor de 2016-2017 está resuelto
      paso a paso dentro del propio tema.
    invariante:
      anios: 6
      fuente: >-
        Contado pregunta a pregunta: 2016-2017 (T1 y P1), 2017-2018 (P1),
        2018-2019 (T1), 2019-2020 (T1 y P1), 2020-2021 (T2) y 2022-2023 (P1).
    apunte:
      texto: cae en los seis — 12 de los 60 puntos
      tono: nota
    dominio: >-
      Sacas las principales de un tensor 3×3 con una dirección ya principal,
      calculas σn y τn de cualquier plano y dibujas los tres círculos de Mohr
      de un punto con la tangencial máxima bien elegida.
    revisado: '2026-10-15'
    escalones:
      - id: el-vector-tension
        titulo: El vector tensión de un plano, y sus dos componentes
        aprendes: >-
          A sacar {S} = [σ]{n} de un plano cualquiera, a partirlo en σn y τn,
          y a deducir la fórmula con el tetraedro cuando la pregunta es de
          teoría.
        teoria:
          tema: t02-tensiones
          apartado: el-tensor-de-tensiones-y-la-ecuación-de-cauchy
        ejercicios:
          - id: ejerm2-el-vector-tension-de-un-plano
            incrustado: true
            nota: >-
              Nuestro, antes del 2.11: el tensor ya dado en xyz y un plano por
              su normal, con el tetraedro dibujado. Entrena {S} = [σ]{n} fila a
              fila, σn y τn, y las áreas que hay detrás de la fórmula, que son
              la cuestión de 2018-2019.
          - id: ejerm2-cl2-11-el-vector-tension-desde-las-principales
            nota: >-
              Un ejercicio de clase: las principales vienen dadas como vectores,
              y hay que montar el tensor en Oxyz antes de sacar {S}, σn y τn de
              un plano. Se comprueba por el otro camino, en los ejes
              principales, donde σn = Σσi li².
          - id: exerm1819-1par-1-el-tetraedro-de-cauchy
            incrustado: true
            nota: >-
              La cuestión de 2018-2019: la deducción con el tetraedro, con las
              áreas de sus caras en función de la normal.
          - id: exerm2021-1par-2-el-plano-de-sigma-y-tau-iguales
            nota: >-
              Al revés que de costumbre: te dan σn y τn y hay que encontrar el
              plano. En ejes principales, las incógnitas son los cuadrados de
              las componentes de la normal.
        dominio: >-
          Calculas σn y τn de un plano dado por su normal, y escribes la
          deducción de Cauchy con el dibujo del tetraedro en cinco líneas.
      - id: las-principales
        titulo: Las tensiones y direcciones principales
        aprendes: >-
          A ver en el tensor qué dirección ya es principal, a resolver el
          bloque 2×2 que queda y a comprobar el resultado con los invariantes.
        teoria:
          tema: t02-tensiones
          apartado: un-tensor-de-parcial-paso-a-paso
          nota: >-
            Es el problema 1 de 2016-2017 resuelto, con el aviso de que el de
            2017-2018 trae los mismos números en otros sitios y no es el mismo
            tensor.
        ejercicios:
          - id: ejerm2-las-tres-principales-de-un-tensor
            incrustado: true
            nota: >-
              Nuestro, antes del 3.2 de clase: un tensor de tensiones de
              números limpios, dado ya en xyz. Entrena a mirar antes de
              calcular si alguna dirección ya es principal, a ordenar las tres
              y a comprobarlas con los dos primeros invariantes.
          - id: ejerm3-cl3-2-del-desplazamiento-a-las-principales
            nota: >-
              Un ejercicio de clase, un peldaño por debajo de los de examen: el
              tensor sale de derivar un campo de desplazamientos, y después se
              trabaja como el de tensiones del apartado. Es de deformaciones,
              con ½γ fuera de la diagonal, porque en clase no hay ninguno de
              principales del tensor de tensiones; se comprueba con los
              invariantes.
          - id: exerm1617-1par-5-el-tensor-con-x-principal
            incrustado: true
            nota: >-
              El tensor que el apartado resuelve paso a paso: hazlo sin
              mirarlo y compara. El plano de b/ deja dos signos para nz, y
              los dos valen.
          - id: exerm1718-1par-5-el-tensor-y-el-plano-a-45-y-60
            nota: >-
              El de 2017-2018: los mismos números en otros sitios, y la
              principal suelta es la y. El plano viene dado en ejes
              principales, y ahí σn y τn solo dependen de los cuadrados de los
              cosenos.
          - id: exerm2223-1par-5-el-tensor-en-la-placa
            nota: >-
              El problema 1 de 2022-2023: el tensor ya viene en principales, y
              lo que se pide es proyectarlo sobre una placa, pasar a fuerzas y
              buscar un plano a 15°.
          - id: exerm1920-1par-1-las-direcciones-principales-son-perpendiculares
            nota: >-
              La cuestión de 2019-2020: la demostración sale de la simetría del
              tensor, y pide además qué pasa si dos principales son iguales.
        dominio: >-
          Sacas las tres principales y sus direcciones de un tensor de parcial
          y compruebas con la traza que no se te ha cambiado un signo.
      - id: el-circulo-de-mohr
        titulo: El círculo de Mohr, y los tres de un punto
        aprendes: >-
          A dibujar el círculo de un estado plano, a leer en él las principales
          y la dirección 1, y a no olvidar la tercera principal al buscar la
          tangencial máxima.
        teoria:
          tema: t02-tensiones
          apartado: el-círculo-de-mohr
        ejercicios:
          - id: ejerm2-circulo-de-mohr-en-tension-plana
            incrustado: true
          - id: ejerm2-cl2-10-el-circulo-de-mohr-y-la-direccion-a
            nota: >-
              Un ejercicio de clase con la τxy mayor que las dos normales: antes
              de dar la tangencial máxima hay que ordenar las tres principales,
              con el 0 de z. Pide además el plano perpendicular a una dirección
              dibujada.
          - id: exerm1920-1par-5-la-chapa-hexagonal
            nota: >-
              El problema 1 de 2019-2020, sin tensor de partida: el círculo se
              construye con lo que dicen dos caras de la chapa.
        dominio: >-
          Dibujas los tres círculos de Mohr de un estado plano y dices cuál da
          la tangencial máxima del punto, y por qué no siempre es el del
          plano xy.
    falta:
      - >-
        **~~Los escalones del vector tensión y de las principales siguen sin
        ejemplo nuestro: el ejercicio de clase hace de primer peldaño~~ ·
        resuelto el 15 de octubre de 2026.** Los dos escalones empiezan ahora
        por un ejemplo nuestro, delante del ejercicio de clase: el vector
        tensión de un plano con el tetraedro dibujado, y un tensor de
        tensiones dado en xyz con la comprobación por los invariantes.
      - >-
        **~~No hay ejercicios de práctica entre el ejemplo y los de examen:
        los dos primeros escalones empiezan ya en nivel de examen~~ · resuelto
        el 15 de octubre de 2026.** Los dos primeros escalones empiezan ahora con un
        ejercicio de clase: el 2.11 en el del vector tensión y el 3.2, de
        deformaciones, en el de las principales, porque en clase no hay
        ninguno de principales del tensor de tensiones. El del círculo tiene
        el 2.10 entre el ejemplo y el de examen.
      - >-
        **~~Los problemas 1 de 2016-2017 y 2017-2018 no están transcritos como
        ejercicio, ni la cuestión del equilibrio del elemento de 2016-2017~~ ·
        resuelto el 15 de octubre de 2026.** Los dos problemas van en el escalón de
        las principales, y la cuestión del equilibrio, en el bloque de los
        convenios.
    antesDeEntrar:
      pasos:
        - >-
          Busca una fila con ceros fuera de la diagonal: da una principal
          gratis y deja un problema plano: un círculo.
        - >-
          Comprueba las tres principales con la traza y con I₂ antes de
          seguir.
        - >-
          Si un coseno director sale de una raíz, da los dos signos o di cuál
          eliges: son dos planos distintos.
        - >-
          Para la tangencial máxima del punto, usa las tres principales, con
          el cero de la tensión plana dentro.
      trampa: >-
        En el círculo, con τxy positiva el punto de x va abajo, no arriba, y
        el ángulo es el doble del real. Si no, la dirección principal sale mal
        con números que parecen razonables.

  - id: galgas
    titulo: Galgas, de las lecturas al tensor y al factor de seguridad
    pide: >-
      Una roseta de dos o tres galgas, casi siempre en tensión plana: εx, εy,
      γxy, las deformaciones principales, el tensor de tensiones y, a menudo,
      un factor de seguridad.
    porque: >-
      Es uno de los tres problemas en cuatro de los seis parciales, siempre
      de 2 puntos: 8 de los 60. En 2018-2019 y 2019-2020 su sitio lo ocuparon
      los diagramas del tema 7, y las galgas reaparecieron en 2019-2020 dentro
      de la cuestión del depósito. Es el problema que más temas junta: lee
      deformaciones del 3, pasa a tensiones con el 4 y a veces acaba en un
      criterio del 6.
    invariante:
      anios: 4
      fuente: >-
        Contado pregunta a pregunta: 2016-2017 (P2), 2017-2018 (P2), 2020-2021
        (P1) y 2022-2023 (P2). La cuestión del depósito con galgas de
        2019-2020 está contada en los depósitos.
    apunte:
      texto: cae en cuatro de seis — 8 de los 60 puntos
      tono: nota
    dominio: >-
      De las lecturas de una roseta llegas a las tensiones principales y a un
      factor de seguridad, con la εz de tensión plana calculada y no supuesta
      nula.
    revisado: '2026-10-15'
    escalones:
      - id: de-las-lecturas-a-las-deformaciones
        titulo: De las lecturas a las deformaciones principales
        aprendes: >-
          A escribir la fórmula de la galga para cada ángulo de la roseta, a
          despejar εx, εy y γxy y a sacar las principales con su dirección.
        teoria:
          tema: t03-deformaciones
          apartado: galgas-y-rosetas
        ejercicios:
          - id: ejerm3-roseta-a-45
            incrustado: true
          - id: ejerm4-cl4-4-tres-galgas-una-sobre-x
            nota: >-
              Un ejercicio de clase: tres galgas que no son las de las rosetas
              de los apuntes, y ninguna sobre y. Leer hacia dónde va cada arco
              es la mitad del problema, y dos de las galgas dan un atajo.
          - id: exerm2021-1par-5-la-roseta-vista-en-un-espejo
            nota: >-
              El problema 1 de 2020-2021: una roseta a 120° dibujada al revés
              que la de los apuntes, con la galga b a 60° y la c a −60°. Leer
              bien los ángulos del dibujo es la mitad del problema.
        dominio: >-
          De tres lecturas a cualquier ángulo sacas εx, εy y γxy, y las
          principales con su dirección medida desde x.
      - id: de-las-deformaciones-a-las-tensiones
        titulo: De las deformaciones a las tensiones
        aprendes: >-
          A pasar a tensiones con Hooke en tensión plana y no con σ = Eε, y a
          calcular la εz que la roseta no mide.
        teoria:
          tema: t04-cuerpo-elastico
          apartado: tensión-plana-y-deformación-plana
          nota: >-
            Las fórmulas que se usan después de una roseta, con el error
            típico de pasar a tensiones con σ = Eε.
        ejercicios:
          - id: ejerm4-de-la-roseta-a-las-tensiones
            incrustado: true
            nota: >-
              Nuestro, antes de la segunda mitad del 4.4: εx, εy y γxy ya
              resueltas, de números limpios. Entrena Hooke en tensión plana y
              la εz que la roseta no mide, sin lecturas de galgas ni
              principales por medio.
          - id: ejerm4-cl4-4-las-tensiones-de-la-roseta
            nota: >-
              La segunda mitad del ejercicio de clase del escalón anterior: de
              εx, εy y γxy a las tensiones con Hooke en tensión plana, la εz
              que la roseta no mide y σn y τn del plano perpendicular a una
              galga.
          - id: exerm2021-1par-5-las-tensiones-que-causan-la-roseta
            incrustado: true
            nota: >-
              La segunda mitad del problema de 2020-2021: las tres tensiones
              del plano y la tangencial máxima del punto.
          - id: exerm1718-1par-6-la-roseta-a-0-60-y-150
            nota: >-
              El problema 2 de 2017-2018, entero, de las lecturas a Tresca y
              Von Mises. Las galgas van sobre un triángulo y la c está a 150°,
              no a 30°: el 30° del dibujo es el ángulo interior del vértice.
          - id: exerm1617-1par-6-la-roseta-de-0-60-y-150
            nota: >-
              El problema 2 de 2016-2017: la misma roseta con otras lecturas y
              otro material. Pide además las principales en el espacio, con la
              εz que la roseta no mide, los círculos de Mohr y la tangencial
              máxima del punto.
          - id: exerm2223-1par-6-dos-galgas-y-sigma-z
            nota: >-
              El problema 2 de 2022-2023: solo dos galgas, porque τxy viene
              dada, y σz no es cero. Acaba en tres factores de seguridad del
              tema 6.
          - id: exerm1516-1par-6-la-roseta-y-el-plano-normal-a-c
            nota: >-
              El problema 2 de 2015-2016, fuera de la ventana: una roseta con
              una galga torcida en el PDF, un módulo muy bajo que da las
              tensiones en kPa, y el vector tensión en el plano normal a una
              galga.
        dominio: >-
          Pasas de deformaciones a tensiones en tensión plana sin usar σ = Eε,
          y sabes cuándo σz no es cero y qué cambia entonces.
    falta:
      - >-
        **~~El escalón de las tensiones de la roseta sigue sin ejemplo nuestro: la
        segunda mitad del ejercicio de clase 4.4 hace de primer peldaño~~ ·
        resuelto el 15 de octubre de 2026.** El escalón empieza ahora por un
        ejemplo nuestro, de εx, εy y γxy a las tensiones y a εz, y sigue con la
        segunda mitad del 4.4.
      - >-
        **~~No hay ejercicios de práctica entre el ejemplo y los de examen:
        después de la roseta a 45° vienen ya las de los parciales~~ · resuelto
        el 15 de octubre de 2026.** El ejercicio de clase 4.4, partido en dos, va en los
        dos escalones: las lecturas y las deformaciones en el primero, las
        tensiones en el segundo.
      - >-
        **~~Las rosetas de 2016-2017 y 2017-2018, a 0°, 60° y 150°, están leídas
        pero no transcritas~~ · resuelto el 15 de octubre de 2026.** Las dos van en el
        escalón de las tensiones.
    antesDeEntrar:
      pasos:
        - >-
          Lee los ángulos desde x, en sentido antihorario: un 30° dibujado
          puede ser interior, y la galga estar a 150°.
        - >-
          Escribe la fórmula de cada galga con γ entera y resuelve εx, εy y
          γxy; en el tensor y en el círculo, γ/2.
        - >-
          Pasa a tensiones con Hooke en tensión plana, no con σ = Eε, y
          calcula εz, que en general no es cero.
      trampa: >-
        γ entera en el círculo o en el tensor arrastra el error hasta el
        factor de seguridad, y ½γ en la fórmula de la galga da una γ doble.
        Las fórmulas de la roseta a 45° solo valen a 45°.

  - id: diagramas
    titulo: Los diagramas de una viga Gerber
    pide: >-
      Las reacciones y los diagramas de cortantes y de flectores de una viga
      con una rótula, con sus valores en los puntos clave y el flector máximo.
    porque: >-
      Fue el problema 2 de 2018-2019, 2019-2020 y 2020-2021, siempre una
      Gerber, y en 2016-2017 la cuestión 3 pedía, en dos mitades, el flector
      de una distribución de tensiones y las ecuaciones de la rebanada. Son 7
      de los 60 puntos. En 2022-2023 no hay pregunta propia, pero el problema
      de las barras acaba pidiendo los diagramas de la barra rígida: el tema 7
      entra también por ahí.
    invariante:
      anios: 4
      fuente: >-
        Contado pregunta a pregunta: 2016-2017 (T3, sus dos mitades),
        2018-2019 (P2), 2019-2020 (P2) y 2020-2021 (P2).
    apunte:
      texto: problema propio en tres de seis — 7 de los 60 puntos
      tono: nota
    dominio: >-
      Ante una Gerber empiezas por el tramo que la rótula deja isostático,
      sacas las reacciones y dibujas los dos diagramas con el flector máximo
      donde la cortante se anula.
    revisado: '2026-10-15'
    escalones:
      - id: de-las-tensiones-a-los-esfuerzos
        titulo: De las tensiones a los esfuerzos, integrando en la sección
        aprendes: >-
          A sacar el axil y el flector de una distribución de σx dada,
          integrando σx y σx·y sobre la sección, con el flector sin signo menos
          porque la y va hacia abajo.
        teoria:
          tema: t07-piezas-prismaticas
          apartado: de-las-tensiones-a-los-esfuerzos
          nota: >-
            El apartado resuelve la mitad a/ de la cuestión de 2016-2017, y su
            error típico es el signo que dan los libros con la y hacia arriba.
        ejercicios:
          - id: exerm1617-1par-3-la-constante-de-una-tension-cubica
            incrustado: true
            nota: >-
              La mitad a/ de la cuestión 3 de 2016-2017, de medio punto. Es la
              integral del flector al revés: te dan la forma de σx y el
              flector, y hay que sacar la constante.
        dominio: >-
          Escribes la integral del flector de una sección rectangular, la
          resuelves con una franja b·dy y justificas su signo con el
          convenio, sin copiar el de otro libro.
      - id: el-equilibrio-de-la-rebanada
        titulo: El equilibrio de la rebanada, y una carga fuera del eje
        aprendes: >-
          A deducir dN/dx, dT/dx y dM/dx del equilibrio de una rebanada, con
          los esfuerzos positivos dibujados en sus dos caras, y a ver qué
          cambia cuando la carga no va en el eje.
        teoria:
          tema: t07-piezas-prismaticas
          apartado: el-equilibrio-de-la-rebanada
          nota: >-
            El apartado resuelve también la variante de 2016-2017, con la
            carga qx en la cara superior.
        ejercicios:
          - id: exerm1617-1par-3-la-rebanada-cargada-por-arriba
            incrustado: true
            nota: >-
              La mitad b/ de la cuestión 3 de 2016-2017, de medio punto. La
              carga va en la cara superior, a h del eje: además de cambiar N,
              da momento, y dM/dx deja de ser T.
          - id: exerm1516-1par-3-la-carga-por-metro-de-horizontal-en-una-pieza-curva
            nota: >-
              Media cuestión de 2015-2016, fuera de la ventana: una carga
              vertical dada por metro de horizontal sobre una pieza curva, y
              por qué no se puede descomponer tal cual.
        dominio: >-
          Deduces las ecuaciones de la rebanada con su dibujo, dices respecto
          de qué punto tomas momentos y por qué se desprecia el término de
          segundo orden, y sabes qué añade una carga aplicada fuera del eje.
      - id: la-gerber
        titulo: La viga con rótula, y por dónde se empieza
        aprendes: >-
          A usar el flector nulo de la rótula como la ecuación que falta, a
          resolver primero el tramo que cuelga de ella y a dibujar V y M por
          tramos.
        teoria:
          tema: t07-piezas-prismaticas
          apartado: cómo-se-dibujan-los-diagramas
        ejercicios:
          - id: ejerm7-la-viga-con-rotula
            incrustado: true
          - id: exerm2021-1par-6-la-gerber-empotrada-con-la-rotula-en-c
            nota: >-
              El de 2020-2021, empotrada en A: el flector del empotramiento
              sale negativo y el máximo de BC, positivo.
          - id: exerm1819-1par-6-la-gerber-con-la-rotula-en-e
            nota: >-
              El de 2018-2019, con tres apoyos, una carga puntual P = q0·a y la
              rótula en E.
          - id: exerm1920-1par-6-la-gerber-con-el-apoyo-fijo-en-e
            nota: >-
              El de 2019-2020, con dos apoyos móviles y uno fijo: pide además
              las tres reacciones y el flector máximo.
        dominio: >-
          Dibujas los diagramas de una Gerber con sus valores en los apoyos,
          en la rótula y en el máximo, y compruebas dos cosas: que el flector
          se anula en la rótula y que la cortante salta en cada apoyo lo que
          vale su reacción.
    falta:
      - >-
        **~~La cuestión de 2016-2017, un σx dado que hay que integrar para sacar el
        flector y las ecuaciones de la rebanada, no está transcrita~~ · resuelto
        el 15 de octubre de 2026.** Son dos ejercicios, uno por apartado de la cuestión,
        y cada uno abre su escalón: de las tensiones a los esfuerzos, y el
        equilibrio de la rebanada.
    antesDeEntrar:
      pasos:
        - >-
          Empieza por la rótula: M = 0 en ella, con las fuerzas del tramo que
          deja una sola incógnita; no por el empotramiento.
        - >-
          Por tramos: sin carga, T constante y M recta; con carga uniforme, T
          recta y M parábola, con el extremo donde T se anula; compáralo con
          los bordes.
        - >-
          Al acabar, comprueba M = 0 en la rótula y que T salta en cada apoyo
          lo que vale su reacción.
      trampa: >-
        En la rótula el flector es cero, pero la cortante no: la rótula
        transmite fuerza, y el tramo sin carga lleva esa cortante y un flector
        que crece hasta el empotramiento.

  - id: deformaciones
    titulo: La cuestión de deformaciones, un punto fijo cada año
    pide: >-
      Una deducción o una cuenta corta del tema 3: la rotación de la parte
      antisimétrica, las condiciones de compatibilidad o las componentes de
      la deformación en una dirección.
    porque: >-
      Cae en los seis parciales, siempre como cuestión de 1 punto: 6 de los
      60. Y se repite: la de la rotación salió palabra por palabra en
      2019-2020, 2020-2021 y 2022-2023, tres de los cuatro últimos.
    invariante:
      anios: 6
      fuente: >-
        Contado pregunta a pregunta: 2016-2017 (T4), 2017-2018 (T1), 2018-2019
        (T2), 2019-2020 (T2), 2020-2021 (T1) y 2022-2023 (T1).
    apunte:
      texto: cae en los seis — 1 punto que se repite
      tono: nota
    dominio: >-
      Escribes de memoria la nueva longitud de un elemento girado y por qué su
      cambio es de segundo orden, y sacas la deformación longitudinal y la
      transversal de una dirección cualquiera.
    revisado: '2026-10-15'
    escalones:
      - id: la-rotacion-no-deforma
        titulo: La rotación no cambia la longitud, a primer orden
        aprendes: >-
          A sacar la nueva longitud de un elemento con dr' = dr + Ω×dr, que
          sale |dr|·√(1 + Ω²·sen²φ), y a ver que el cambio es de segundo orden
          en Ω: con un giro pequeño, se desprecia.
        teoria:
          tema: t03-deformaciones
          apartado: la-rotación-no-deforma-a-primer-orden
        ejercicios:
          - id: exerm2223-1par-1-la-rotacion-no-cambia-la-longitud
            incrustado: true
            nota: >-
              La cuestión que ha caído tres veces en los cuatro últimos
              parciales, con el mismo enunciado. Lo que se puntúa es la raíz:
              contestar «no cambia» sin ella pierde el punto.
        dominio: >-
          Escribes la longitud nueva con su raíz y explicas por qué, con Ω
          pequeño, lo que cambia es de segundo orden y no del orden del giro.
      - id: una-direccion-cualquiera
        titulo: La deformación en una dirección cualquiera
        aprendes: >-
          A sacar la componente longitudinal y la transversal del vector
          deformación de una dirección dada, a partir del tensor o de las
          principales.
        teoria:
          tema: t03-deformaciones
          apartado: el-vector-deformación-y-la-fórmula-de-la-galga
        ejercicios:
          - id: exerm1819-1par-2-dos-deformaciones-principales-iguales
            incrustado: true
            nota: >-
              La cuestión de 2018-2019: dos principales iguales, así que
              cualquier dirección de su plano es principal, y una dirección k
              en la que calcular las dos componentes.
        dominio: >-
          Calculas εu y ½γu de una dirección dada y sabes qué pasa con las
          direcciones principales cuando dos deformaciones principales son
          iguales.
      - id: las-condiciones-de-compatibilidad
        titulo: Las condiciones de compatibilidad, usadas y deducidas
        aprendes: >-
          A usar la ecuación de compatibilidad del plano,
          εx,yy + εy,xx = γxy,xy, para saber si un campo de deformaciones sale
          de unos desplazamientos de verdad, y a deducirla de que u, v y el
          giro son funciones del punto.
        teoria:
          tema: t03-deformaciones
          apartado: las-condiciones-de-compatibilidad
          nota: >-
            El apartado resuelve la cuestión de 2017-2018 y la comprueba por
            el otro lado, con unos desplazamientos que dan esas deformaciones.
        ejercicios:
          - id: exerm1718-1par-1-la-compatibilidad-del-campo-plano
            nota: >-
              La cuestión de 2017-2018: la ecuación viene en el enunciado, y
              se pide usarla. C1 y C2 salen de exigirla en todos los puntos,
              igualando los coeficientes de x y de y.
          - id: exerm1617-1par-4-la-compatibilidad-en-el-plano
            incrustado: true
            nota: >-
              La cuestión de 2016-2017, la misma palabra por palabra que la de
              2015-2016: aquí no se usa la ecuación, se deduce.
          - id: exerm1516-1par-4-la-compatibilidad-en-el-plano
            nota: >-
              La de 2015-2016, fuera de la ventana: la misma pregunta que la de
              2016-2017, palabra por palabra, con otro campo de ejemplo para
              comprobarla.
        dominio: >-
          Compruebas con la ecuación si un campo de deformaciones es posible,
          o qué constantes lo hacen posible, y escribes su deducción con las
          dos condiciones de diferencial exacta.
    falta:
      - >-
        **~~Las dos cuestiones de compatibilidad, de 2016-2017 y 2017-2018, están
        leídas pero no transcritas~~ · resuelto el 15 de octubre de 2026.** Las dos van
        en el escalón nuevo de las condiciones de compatibilidad.
    antesDeEntrar:
      pasos:
        - >-
          Si es la de la rotación, escribe dr' = dr + Ω×dr, saca el módulo con
          su raíz y di por qué el cambio es de segundo orden.
        - >-
          Si es de γ, defínela antes de calcular: lo que se cierra el ángulo
          recto, la suma de los giros de las dos aristas.
      trampa: >-
        «La longitud no cambia», sin la raíz, pierde el punto: cambia en
        segundo orden, y con un giro de 0,01 rad el alargamiento relativo
        llega a unas 5·10⁻⁵.

  - id: fallo
    titulo: Las teorías de fallo, con Mohr por delante
    pide: >-
      Una cuestión de 1 punto: deducir un criterio —Mohr o Von Mises— o
      aplicarlo a unos ensayos para sacar un límite o una tensión equivalente.
    porque: >-
      Cae en cinco de los seis parciales, siempre como cuestión: 5 de los 60
      puntos. Cuatro de las cinco son del criterio de los estados límite de
      Mohr y la otra deduce Von Mises. Los factores de seguridad de Tresca y
      Von Mises, además, cierran a menudo el problema de las galgas.
    invariante:
      anios: 5
      fuente: >-
        Contado pregunta a pregunta: 2017-2018 (T3), 2018-2019 (T3), 2019-2020
        (T3), 2020-2021 (T4) y 2022-2023 (T4).
    apunte:
      texto: cae en cinco de seis — casi siempre Mohr
      tono: nota
    dominio: >-
      Calculas un factor de seguridad con Tresca, Von Mises y Mohr sin
      olvidar la principal nula, y deduces la tensión equivalente de Mohr con
      su recta intrínseca.
    revisado: '2026-10-15'
    escalones:
      - id: el-factor-de-seguridad
        titulo: La tensión equivalente y el factor de seguridad
        aprendes: >-
          A ordenar las tres principales, con la nula incluida, y a sacar la
          tensión equivalente y el factor de seguridad de Tresca y de Von
          Mises.
        teoria:
          tema: t06-teorias-de-fallo
          apartado: tensión-equivalente-y-factor-de-seguridad
        ejercicios:
          - id: ejerm6-tresca-con-la-tercera-nula
            incrustado: true
        dominio: >-
          Das el factor de seguridad de Tresca y el de Von Mises de un estado
          plano y explicas por qué la tercera principal cambia el de Tresca.
      - id: los-estados-limite-de-mohr
        titulo: El criterio de los estados límite de Mohr
        aprendes: >-
          A usar σeq = σ1 − kσ3 con k = σet/σec, a sacar k de dos ensayos
          cualesquiera y a deducir el criterio con la recta intrínseca.
        teoria:
          tema: t06-teorias-de-fallo
          apartado: los-estados-límite-de-mohr
        ejercicios:
          - id: exerm2021-1par-4-el-limite-a-compresion-por-mohr
            incrustado: true
            nota: >-
              La cuestión de 2020-2021: un ensayo de tracción y uno de
              cortadura pura, y de ellos el límite a compresión.
          - id: exerm1718-1par-3-mohr-con-un-estado-hidrostatico
            nota: >-
              La cuestión de 2017-2018: un fallo hidrostático, cuyo círculo es
              un punto, y uno de cortadura pura. Los dos dan k, y con ella sale
              el límite a tracción.
          - id: exerm2223-1par-4-dos-estados-limite-de-mohr
            nota: >-
              La de 2022-2023: dos estados límite encadenados, y por el camino
              la k.
          - id: exerm1819-1par-3-el-criterio-de-los-estados-limites-de-mohr
            nota: >-
              La de 2018-2019, de pura teoría: la curva intrínseca, la recta
              tangente a los dos círculos y la tensión equivalente.
          - id: exerm1516-1par-1-los-cilindros-de-hormigon-confinados
            nota: >-
              La cuestión de 2015-2016, fuera de la ventana: dos ensayos de
              hormigón con presión lateral, y la recta intrínseca de Mohr que
              sale de los dos. Es el ejercicio 6.2 de clase con una palabra
              más.
        dominio: >-
          Sacas k de dos ensayos, das un límite que no se ha ensayado y
          escribes la deducción del criterio con su dibujo.
      - id: von-mises-deducido
        titulo: Von Mises, deducido de la energía de distorsión
        aprendes: >-
          A partir la energía de deformación en la parte de volumen y la de
          distorsión, y a llegar desde la segunda a la tensión equivalente.
        teoria:
          tema: t06-teorias-de-fallo
          apartado: energía-de-distorsión-von-mises
        ejercicios:
          - id: exerm1920-1par-3-von-mises-desde-la-energia-de-distorsion
            incrustado: true
            nota: >-
              La cuestión de 2019-2020, con la cortadura pura de comprobación
              al final.
        dominio: >-
          Escribes la deducción de Von Mises desde la energía de distorsión y
          compruebas que en cortadura pura da el factor √3.
    falta:
      - >-
        **~~La cuestión de Mohr de 2017-2018, con un fallo en estado hidrostático
        y otro en cortadura pura, está leída pero no transcrita~~ · resuelto el
        15 de octubre de 2026.** Va en el escalón de los estados límite de Mohr.
    antesDeEntrar:
      pasos:
        - >-
          Ordena las tres principales con su signo, con la nula de la tensión
          plana incluida.
        - >-
          Con Mohr, σeq = σ1 − kσ3, con k = σet/σec, menor que 1 en un frágil,
          y σ3 con su signo; compárala con el límite a tracción.
        - >-
          Si dudas de la fórmula de Von Mises, compruébala con cortadura pura:
          tiene que dar √3·τ.
      trampa: >-
        k al revés, o σ1 − k·|σ3|, dan un estado más seguro de lo que es. Y en
        tensión plana, con las dos del plano del mismo signo, Tresca va con el
        cero: con 120 y 40 MPa, la equivalente es 120, no 80.

  - id: hooke
    titulo: Hooke, el prisma restringido y las cotas de ν
    pide: >-
      Una cuestión de 1 punto del tema 4: un prisma que no puede deformarse en
      alguna dirección, las cotas del coeficiente de Poisson o las ecuaciones
      de Lamé.
    porque: >-
      Cae en tres de los seis parciales, 4 de los 60 puntos, y en 2022-2023
      con dos cuestiones a la vez. La de las cotas de ν salió igual en
      2020-2021 y en 2022-2023.
    invariante:
      anios: 3
      fuente: >-
        Contado pregunta a pregunta: 2017-2018 (T2), 2020-2021 (T3) y
        2022-2023 (T2 y T3).
    apunte:
      texto: cae en tres de seis — 4 de los 60 puntos
      tono: nota
    dominio: >-
      Resuelves un prisma metido en un hueco rígido con Hooke generalizado y
      justificas las dos cotas de ν, cada una con su motivo físico.
    revisado: '2026-10-15'
    escalones:
      - id: el-prisma-restringido
        titulo: El prisma que no se puede deformar hacia un lado
        aprendes: >-
          A escribir Hooke generalizado con la deformación impedida igualada a
          cero y a despejar la tensión que hacen las paredes.
        teoria:
          tema: t04-cuerpo-elastico
          apartado: un-prisma-en-un-hueco-rígido
        ejercicios:
          - id: ejerm4-cubo-en-un-hueco-rigido
            incrustado: true
          - id: exerm2223-1par-2-los-bloques-en-el-marco-rigido
            nota: >-
              La cuestión de 2022-2023: dos bloques distintos en un mismo
              marco, y lo que baja la cara libre de uno de ellos.
          - id: exerm1516-1par-2-la-columna-en-el-hueco-rigido
            nota: >-
              La de 2015-2016, fuera de la ventana: solo una parte de la
              columna está metida en el hueco, y es esa la que hay que
              resolver. Primero, qué dirección está libre y cuál impedida.
        dominio: >-
          Escribes las tres ecuaciones de Hooke de un prisma restringido,
          igualas a cero las que toca y sacas la tensión y la deformación que
          quedan.
      - id: las-ecuaciones-de-lame
        titulo: Las tensiones a partir de las deformaciones
        aprendes: >-
          A despejar las tensiones de la ley de Hooke en tres pasos —sumar
          las tres ecuaciones, sumar y restar νσx, despejar— hasta
          σx = 2Gεx + λe, y a escribir λ con E y ν.
        teoria:
          tema: t04-cuerpo-elastico
          apartado: tensiones-a-partir-de-deformaciones-las-ecuaciones-de-lamé
        ejercicios:
          - id: exerm1718-1par-2-las-tensiones-a-partir-de-las-deformaciones
            incrustado: true
            nota: >-
              La cuestión de 2017-2018 es una línea sin datos: hay que deducir,
              no calcular. Los pasos de cálculo usan las deformaciones del
              problema 2 del mismo examen, y σz sale cero porque su εz es la
              de tensión plana.
        dominio: >-
          Deduces σx = 2Gεx + λe y τxy = Gγxy desde Hooke sin mirar el tema, y
          con ellas pasas de un tensor de deformaciones al de tensiones.
      - id: las-cotas-de-poisson
        titulo: Entre qué valores está ν, y por qué
        aprendes: >-
          A justificar las dos cotas, cada una con un módulo que tiene que
          ser positivo: G da el suelo, −1 y no 0, y el módulo volumétrico da
          el techo, 0,5.
        teoria:
          tema: t04-cuerpo-elastico
          apartado: entre-qué-valores-está-ν
        ejercicios:
          - id: exerm2223-1par-3-las-cotas-del-coeficiente-de-poisson
            incrustado: true
            nota: >-
              La misma cuestión, con el mismo enunciado, en 2020-2021 y en
              2022-2023. Lo que se puntúa es la justificación de cada cota.
        dominio: >-
          Escribes las dos cotas de ν y de dónde sale cada una sin mirar el
          tema.
    falta:
      - >-
        **~~La cuestión de 2017-2018, sacar las tensiones a partir de las
        deformaciones, que son las ecuaciones de Lamé, está leída pero no
        transcrita~~ · resuelto el 15 de octubre de 2026.** Abre el escalón nuevo de
        las ecuaciones de Lamé.
    antesDeEntrar:
      pasos:
        - >-
          Primero, la condición de cada dirección: libre, tensión nula;
          impedida, deformación nula; nunca las dos a la vez.
        - >-
          Con holgura, mira primero si el prisma toca la pared: mientras no,
          esa dirección está libre.
        - >-
          Al acabar, comprueba el signo: la pared solo empuja, así que su
          tensión tiene que salir de compresión.
      trampa: >-
        Las cotas de ν son −1 < ν < 0,5, no 0 < ν < 0,5: cada límite sale de
        un módulo que tiene que ser positivo, G el de abajo y k el de arriba,
        y se puntúa esa justificación.

  - id: depositos
    titulo: Depósitos de pared delgada
    pide: >-
      La relación entre la presión interior y las tensiones de la pared de un
      depósito, deducida o usada con galgas para sacar la presión.
    porque: >-
      Cae en dos de los seis parciales, como cuestión de 1 punto: 2 de los 60.
      Va el último por eso. Como es del tema 8, vale para él la misma
      advertencia que para las barras: si el aviso del parcial deja fuera el
      tema 8, este bloque sobra.
    invariante:
      anios: 2
      fuente: >-
        Contado pregunta a pregunta: 2017-2018 (T4) y 2019-2020 (T4, con dos
        galgas).
    apunte:
      texto: cae en dos de seis — 2 de los 60 puntos
      tono: neutro
    dominio: >-
      Escribes las tensiones circunferencial y longitudinal de un depósito
      cilíndrico, la una con Laplace y la otra con el equilibrio de la tapa, y
      las usas para pasar de unas galgas a la presión.
    revisado: '2026-10-15'
    escalones:
      - id: el-deposito
        titulo: El depósito cilíndrico, y la presión que leen dos galgas
        aprendes: >-
          A sacar la tensión circunferencial y la longitudinal de un depósito,
          con la ecuación de Laplace y el equilibrio de la tapa, y a
          combinarlas con Hooke para leer la presión de unas galgas.
        teoria:
          tema: t08-esfuerzo-axial
          apartado: depósitos-y-anillos-de-pared-delgada
        ejercicios:
          - id: exerm1718-1par-4-el-deposito-de-revolucion
            nota: >-
              La cuestión de 2017-2018: la ecuación de Laplace deducida para
              un depósito de revolución cualquiera, con el equilibrio de un
              trozo de pared. El cilindro y la esfera salen después, como dos
              casos.
          - id: exerm1920-1par-4-el-deposito-con-dos-galgas
            incrustado: true
            nota: >-
              La cuestión de 2019-2020: una galga axial y otra a 60°, y de
              ellas la deformación circunferencial, ν y la presión.
        dominio: >-
          Deduces las dos tensiones de la pared en un dibujo y sacas la presión
          de un depósito a partir de dos lecturas de galga.
    falta:
      - >-
        **~~La cuestión de 2017-2018, que pide deducir la relación entre la presión
        y las tensiones de la pared, está leída pero no transcrita~~ · resuelto
        el 15 de octubre de 2026.** Va en el escalón del depósito.
    antesDeEntrar:
      pasos:
        - >-
          Circunferencial pr/t, por la ecuación de Laplace; longitudinal
          pr/(2t), por el equilibrio de la tapa.
        - >-
          Con galgas, Hooke en tensión plana: la radial se desprecia frente a
          las otras dos.
      trampa: >-
        Las dos tensiones al revés: pr/t es la circunferencial, la que rodea
        el cilindro; la longitudinal es la mitad, porque solo la crea la
        presión sobre las tapas.

  - id: simulacro
    titulo: El simulacro, con un parcial entero
    apunte:
      texto: de una sentada, y sin la solución al lado
      tono: marco
    pide: >-
      Las cuatro cuestiones y los tres problemas de un primer parcial, de una
      sentada.
    porque: >-
      Los bloques de arriba entrenan cada hueco por separado, y el parcial no
      va por separado: salta de una deducción de un punto a un problema de
      barras de dos. Estos son los seis parciales transcritos, completos y
      con su resolución detrás.
    dominio: >-
      Hacer un parcial completo de una sentada sin abrir la resolución, y
      después contar cuántos apartados habrías dado por buenos sin serlo.
    material:
      - tipo: examen
        curso: '2022-2023'
        convocatoria: primer-parcial
        nota: >-
          El más reciente del material, y el que conviene hacer primero: la
          rotación, Poisson, el tensor en la placa y la barra con resorte.
      - tipo: examen
        curso: '2020-2021'
        convocatoria: primer-parcial
        nota: >-
          La roseta a 120° vista en un espejo y una Gerber empotrada.
      - tipo: examen
        curso: '2019-2020'
        convocatoria: primer-parcial
        nota: >-
          La chapa hexagonal, Von Mises deducido y el depósito con galgas.
      - tipo: examen
        curso: '2018-2019'
        convocatoria: primer-parcial
        nota: >-
          El que más pesa del tema 8: tres de sus siete preguntas son de
          barras.
      - tipo: examen
        curso: '2017-2018'
        convocatoria: primer-parcial
        nota: >-
          El tensor con los números de 2016-2017 en otros sitios, la
          compatibilidad, Mohr con un fallo hidrostático y la barra rígida con
          su tirante.
      - tipo: examen
        curso: '2016-2017'
        convocatoria: primer-parcial
        nota: >-
          Se hizo en dos días, la teoría el 7 y los ejercicios el 14 de
          noviembre. El elemento diferencial, la rebanada cargada por arriba,
          una roseta con la galga c a 150° y la barra fabricada corta.
    falta:
      - >-
        **~~Los parciales de 2016-2017 y 2017-2018 están leídos pero no
        transcritos, así que hay cuatro simulacros y no seis~~ · resuelto el
        15 de octubre de 2026.** Son seis.
    revisado: '2026-10-15'

  - id: formulario
    titulo: Lo que hay que llevar sabido
    apunte:
      texto: repaso, no aprendizaje
      tono: marco
    pide: >-
      El convenio, Cauchy, las principales, la fórmula de la galga, Hooke en
      tensión plana, los criterios de fallo, las relaciones de la rebanada y
      el alargamiento de una barra, de memoria.
    porque: >-
      Va el último porque es repaso, no aprendizaje: es el bloque del rato de
      antes de entrar. Cada tema acaba con su lista de lo que hay que llevar
      sabido, y aquí están las seis, en el orden del temario. No hay nada en
      ellas que no esté en su tema.

      **Las listas de todos los temas escritos están juntas en una sola página**, hecha para imprimirse a dos columnas: [el formulario de Elasticidad](/road-to-ingenieria/elasticidad-resistencia/formulario/). Lleva también la del tema 5, que este parcial no pide. Se leen de los temas, así que no hay nada escrito ahí que no esté en ellos.
    dominio: >-
      Escribir de memoria y en papel Cauchy, la fórmula de la galga, Hooke en
      tensión plana, σeq de Mohr y el alargamiento con temperatura, sin
      consultar nada. Si tienes que mirar una sola vez, todavía no.
    material:
      - tipo: teoria
        tema: t02-tensiones
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          El convenio, el equilibrio interno, Cauchy, las principales y Mohr.
      - tipo: teoria
        tema: t03-deformaciones
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          γ/2 en el tensor, la fórmula de la galga y la compatibilidad.
      - tipo: teoria
        tema: t04-cuerpo-elastico
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          Hooke en los dos sentidos, las constantes con las cotas de ν y la
          tensión plana.
      - tipo: teoria
        tema: t06-teorias-de-fallo
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          La tensión equivalente de cada criterio, Mohr incluido, y el
          factor de seguridad.
      - tipo: teoria
        tema: t07-piezas-prismaticas
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          El convenio de los esfuerzos, las relaciones de la rebanada y las
          reglas de los diagramas.
      - tipo: teoria
        tema: t08-esfuerzo-axial
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          El alargamiento con temperatura, la compatibilidad del sólido rígido
          y los depósitos.
    falta:
      - >-
        **~~Elasticidad no tiene todavía un formulario en una sola página, hecho
        para imprimirse: hay que leer las seis listas por separado~~ · resuelto
        el 15 de octubre de 2026.** La página ya existía, armada sola con las
        listas de los temas como la de Cálculo, y este bloque no la enlazaba;
        ahora la enlaza.
    revisado: '2026-10-15'
