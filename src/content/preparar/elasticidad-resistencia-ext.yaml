# La ruta de la convocatoria extraordinaria de Elasticidad y Resistencia de
# Materiales, medida sobre las siete extraordinarias que hay en el material
# desde 2016-2017, una por curso hasta 2022-2023. Son todas las que existen
# para el sitio. Las tres primeras fueron en junio (2017, 2018 y 2019), y las
# cuatro siguientes, entre el final de enero y el principio de febrero (de
# 2020 a 2023).
#
# El examen de este curso tiene dos partes que se aprueban por separado, como
# la final de enero: la 1, elasticidad (temas 1 a 6), y la 2, resistencia de
# materiales (temas 7 a 14; la guía docente dice «7-15», y el temario acaba
# en el 14). Cada una vale el 50 %, pide un 5 y trae un 40 % de cuestiones
# (guía docente de 2026-2027). Una parte liberada antes, en el primer parcial
# o en la final de enero, vale hasta la extraordinaria, y entonces solo se
# hace la otra. El primer parcial es solo de la parte 1 (confirmado el 23 de
# octubre de 2026).
#
# La ventana mide cursos en que el reparto era otro. Hasta 2022-2023 el
# primer parcial llegaba al tema 8 (los temas 7 y 8 iban con la elasticidad),
# y las siete extraordinarias son una sola hoja de 10 puntos que lo mezcla
# todo: cuatro cuestiones de teoría y cuatro problemas, o tres y cuatro en
# 2022-2023. Ninguna viene partida en dos. Para que la ruta sirva a la
# extraordinaria de este curso, cada pregunta se cuenta en la parte que su
# tema tiene ESTE curso: la rebanada, las barras y los depósitos, en la parte
# 2. Con el reparto de entonces la parte 1 habría sumado 22,5 de los 70
# puntos; con el de este curso suma 15,2, y en cada extraordinaria va de 1 a
# 3,5 de sus 10 puntos. La ruta va partida igual, y cada parte se ordena por
# su lado.
#
# Todas imprimen los puntos junto a cada pregunta, y por eso aquí se cuentan
# PUNTOS y no solo apariciones: son 59 preguntas y 70 puntos, con 57
# ejercicios distintos, porque la compresión excéntrica cae igual en
# 2017-2018 y 2020-2021 y el flujo cortante en 2018-2019 y 2021-2022. Siete
# preguntas comparten el ejercicio con otra convocatoria (su `examen.yaml`
# apunta al ejercicio de otro examen): la cuestión 4 de 2017-2018, las
# cuestiones 1 y 2 de 2018-2019 y las cuatro cuestiones de 2021-2022. Cuentan
# como preguntas de la extraordinaria, con los puntos que la extraordinaria
# les imprime, y la ruta enlaza el ejercicio al que apuntan.
#
# Una sola pregunta no trae sus puntos repartidos: la cuestión 1 de 2022-2023
# vale 2 puntos y tiene cinco partes, de la a) a la e), de cinco temas, y la
# hoja no dice cuánto vale cada una. Aquí cuenta 0,4 cada parte. Es un
# supuesto: sin esa pregunta, el orden solo cambia en la parte 1, donde el
# campo de desplazamientos pasa delante de las teorías de fallo, las dos con
# 1 punto. El reparto por hueco, del 23 de octubre de 2026:
#
#   PARTE 1, elasticidad, temas 1 a 6: 14 preguntas y 15,2 puntos
#   galgas (temas 2 a 4) ......................  6 pts     4 preguntas   en 4
#   el tensor de tensiones (tema 2) ...........  3,9 pts   4 preguntas   en 4
#   Hooke y Lamé (tema 4) .....................  2,9 pts   3 preguntas   en 3
#   teorías de fallo (tema 6) .................  1,4 pts   2 preguntas   en 2
#   el campo de desplazamientos (tema 3) ......  1 pt      1 pregunta    en 1
#
#   PARTE 2, resistencia de materiales, temas 7 a 14: 45 preguntas y 54,8 puntos
#   la rebanada, recta y curva (tema 7) .......  2,4 pts   3 preguntas   en 3   (suelo)
#   teoremas energéticos (tema 13) ............ 11,5 pts   8 preguntas   en las 7
#   torsión (tema 12) ......................... 10 pts     8 preguntas   en las 7
#   vigas hiperestáticas (tema 11) ............  8,5 pts   6 preguntas   en 6
#   la sección que trabaja (tema 9) ...........  6,5 pts   5 preguntas   en 3
#   pandeo (tema 14) ..........................  4 pts     4 preguntas   en 4
#   barras y nudos (tema 8) ...................  3,9 pts   4 preguntas   en 4
#   flexión y torsión a la vez (tema 12) ......  3 pts     2 preguntas   en 2
#   el flujo cortante (tema 9) ................  2 pts     2 preguntas   en 2
#   la ecuación de la elástica (tema 10) ......  2 pts     2 preguntas   en 2
#   depósitos de pared delgada (tema 8) .......  1 pt      1 pregunta    en 1
#
# Qué pregunta va a qué hueco es una lectura humana: cada
# `invariante.fuente` la dice pregunta a pregunta, con la T de teoría y la P
# de problema de cada hoja (en 2022-2023, de T1a a T1e son las cinco partes
# de la cuestión 1). Las sumas las hizo un guion sobre ese reparto y sobre
# los `puntosImpresos` de cada `examen.yaml` (fase-p/p10c/guiones/reparto.mjs),
# no se hicieron a mano. La lectura sigue a las rutas hermanas donde cuentan
# la misma pregunta: el eje escalonado de 2017-2018 va en la torsión, como en
# la ruta del segundo parcial. El pilar con dos galgas de 2022-2023 va en la
# sección y no en las galgas: su `examen.yaml` lo pone en el tema 9, y las
# galgas solo dan el punto de partida.
#
# Un hueco que las rutas hermanas no tienen: flexión y torsión a la vez, del
# tema 12. Son dos problemas, la pieza con un brazo soldado de 2016-2017 y el
# voladizo en I de 2019-2020, que piden las tensiones principales del punto
# crítico con todos los esfuerzos juntos. Suma 3 puntos; con la torsión
# sumaría 13 y pasaría delante de los teoremas energéticos. Va aparte porque
# se prepara aparte: no es un eje ni una pared delgada, sino la suma de todas
# las tensiones en un punto.
#
# La ruta es corta a propósito, como la de la final de enero. La parte 1 es
# el temario del primer parcial, y la parte 2, el de la segunda parte de
# enero; las rutas de los dos parciales tienen la escalera larga de cada
# hueco, con sus hojas de antes de entrar. Aquí cada bloque lleva los
# escalones que piden las extraordinarias, con todas sus preguntas, y enlaza
# el bloque largo: los de los temas 2 a 6, en la ruta del primer parcial, y
# los del 7 en adelante, en la del segundo. La hoja de antes de entrar no se
# repite: se usan las de los dos parciales.
asignatura: elasticidad-resistencia
evaluacion: extraordinaria
titulo: Preparar la extraordinaria, por partes
lede: >-
  La extraordinaria son las mismas dos partes que la final de enero, y cada
  una se aprueba con un 5. Esta ruta va partida igual: cincuenta y nueve
  preguntas y 70 puntos contados en siete extraordinarias. En la parte 1
  mandan las galgas; en la parte 2, los teoremas energéticos y la torsión,
  que han caído en las siete.
temas:
  - t02-tensiones
  - t03-deformaciones
  - t04-cuerpo-elastico
  - t06-teorias-de-fallo
  - t07-piezas-prismaticas
  - t08-esfuerzo-axial
  - t09-flexion-tensiones
  - t10-flexion-deformaciones
  - t11-flexion-hiperestatica
  - t12-torsion
  - t13-teoremas-energeticos
  - t14-pandeo
medidoSobre: 7
criterioDeOrden: >-
  La ruta va partida en dos, como el examen. La guía docente pone en la
  extraordinaria las mismas dos partes que en la final de enero, al 50 %,
  con un 5 en cada una y un 40 % de cuestiones en cada una: la 1, los temas
  1 a 6, y la 2, del 7 al último, el 14. Una parte liberada antes, en el
  primer parcial o en la final, vale hasta la extraordinaria: si tienes la
  primera, empieza en el bloque de la rebanada, el primero de la parte 2.
  Dentro de cada parte, los bloques van por los puntos impresos que cada
  hueco ha sumado en las siete extraordinarias; a igualdad de puntos,
  delante el que cae en más, después el que cayó más tarde, y si todo
  empata, el orden del temario. Detrás de las dos partes van el simulacro y
  lo que hay que llevar sabido.


  Hasta 2022-2023 el primer parcial llegaba al tema 8, y la extraordinaria
  era una sola hoja que lo mezclaba todo. Cada pregunta de la ventana se
  cuenta en la parte que su tema tiene este curso, así que la rebanada, las
  barras y los depósitos están en la parte 2. Con el reparto de entonces, la
  parte 1 habría sumado 22,5 de los 70 puntos; con el de este curso suma
  15,2, y en cada extraordinaria va de 1 a 3,5 de sus 10 puntos.


  La cuestión 1 de 2022-2023 vale 2 puntos y tiene cinco apartados de cinco
  temas, sin el reparto impreso, así que aquí cuenta 0,4 cada parte. Sin
  ella, el campo de desplazamientos pasaría delante de las teorías de fallo,
  y lo demás no se mueve. El tema 7 va el primero de la parte 2 aunque solo
  suma 2,4 puntos propios, porque las leyes de esfuerzos de cada tramo son
  el primer paso de casi todos sus problemas. Flexión y torsión a la vez, del
  tema 12, tiene su propio bloque: con la torsión sumaría 13 puntos y pasaría
  delante de los teoremas energéticos, pero se prepara de otra manera.


  Esta ruta es corta a propósito: cada bloque trae los escalones que piden
  las extraordinarias, con todas sus preguntas, y enlaza el bloque largo de
  [la ruta del primer parcial](/road-to-ingenieria/elasticidad-resistencia/preparar/1par/)
  o de [la del segundo](/road-to-ingenieria/elasticidad-resistencia/preparar/2par/).
  Para el rato de antes de entrar, usa las hojas de esas dos rutas,
  [la del primer parcial](/road-to-ingenieria/elasticidad-resistencia/preparar/1par/antes-de-entrar/)
  y [la del segundo](/road-to-ingenieria/elasticidad-resistencia/preparar/2par/antes-de-entrar/).

bloques:
  # ─────────────────────────────────────────────────────────────────────
  # PARTE 1 · elasticidad, temas 1 a 6 · 14 preguntas y 15,2 puntos
  # ─────────────────────────────────────────────────────────────────────
  - id: galgas
    titulo: Galgas, el problema de la parte 1
    pide: >-
      Un problema de 1,5 puntos: unas galgas pegadas a una pieza en tensión
      plana, y con sus lecturas, las deformaciones y las tensiones
      principales, las tensiones de un plano y a veces un factor de
      seguridad.
    porque: >-
      Es el problema de la parte 1: cae en cuatro de las siete
      extraordinarias, las cuatro veces como problema de 1,5 puntos, y suma 6
      de los 15,2 puntos de la parte 1, más que ningún otro hueco de esa
      parte. Desde 2019 solo ha faltado en la de febrero de 2021. Las cuatro
      preguntas empiezan en unas lecturas y acaban en tensiones. La escalera
      larga, con el factor de seguridad, está en
      [el bloque de galgas de la ruta del primer parcial](/road-to-ingenieria/elasticidad-resistencia/preparar/1par/#galgas).
    invariante:
      anios: 4
      fuente: >-
        Contado pregunta a pregunta: 2018-2019 (P1), 2019-2020 (P1),
        2021-2022 (P1) y 2022-2023 (P1). Los puntos son los impresos junto a
        cada pregunta.
    apunte:
      texto: parte 1 · en cuatro de siete — 6 de los 15,2 puntos
      tono: nota
    dominio: >-
      Con tres lecturas cualesquiera sacas εx, εy y γxy, pasas a tensiones y
      das las principales, εz y las tensiones de un plano sin mirar la
      resolución, también cuando el enunciado deja una tensión por conocer.
    revisado: '2026-10-23'
    escalones:
      - id: de-las-lecturas-a-las-deformaciones
        titulo: De las lecturas a las deformaciones del plano
        aprendes: >-
          A escribir la lectura de cada galga con su ángulo y a despejar de
          tres lecturas las tres deformaciones del plano, con cualquier
          disposición de la roseta.
        teoria:
          tema: t03-deformaciones
          apartado: galgas-y-rosetas
          nota: >-
            La fórmula de la galga sale del apartado de antes,
            [el vector deformación](/road-to-ingenieria/elasticidad-resistencia/t03-deformaciones/#el-vector-deformación-y-la-fórmula-de-la-galga).
        ejercicios:
          - id: ejerm3-roseta-a-45
            incrustado: true
            nota: >-
              El ejemplo del tema: una roseta a 45°, de las tres lecturas a las
              principales del plano.
          - id: ejerm4-cl4-4-tres-galgas-una-sobre-x
            nota: >-
              El 4.4 de clase, en su primera mitad: tres galgas que no son las
              de las rosetas de los apuntes, hasta las principales y su
              dirección.
          - id: ejerm3-cl3-6-tres-galgas-sobre-un-triangulo
            nota: >-
              El 3.6 de clase: tres galgas sobre los lados de un triángulo,
              resuelto en función del ángulo de la figura y de las tres
              lecturas.
          - id: exerm2021-1par-5-la-roseta-vista-en-un-espejo
            nota: >-
              El problema 1 del primer parcial de 2020-2021, de 2 puntos: una
              roseta a 120°, hasta las principales, sus círculos de Mohr y la
              deformación en una dirección a 45°.
          - id: exerm1920-ext-5-la-roseta-de-galgas-a-0-30-y-150
            nota: >-
              El problema 1 de la extraordinaria de enero de 2020, de 1,5
              puntos: tres galgas en una pieza en tensión plana, hasta las
              tensiones principales y las del plano perpendicular a una de
              ellas.
        dominio: >-
          De tres lecturas a cualquier ángulo sacas εx, εy y γxy, y las
          principales con su dirección medida desde x.
      - id: de-las-deformaciones-a-las-tensiones
        titulo: De las deformaciones a las tensiones
        aprendes: >-
          A pasar de las deformaciones de una roseta a las tensiones y a sus
          principales, a dar la εz que la roseta no mide y a sacar las
          tensiones de un plano.
        teoria:
          tema: t04-cuerpo-elastico
          apartado: tensión-plana-y-deformación-plana
        ejercicios:
          - id: ejerm4-de-la-roseta-a-las-tensiones
            incrustado: true
            nota: >-
              El ejemplo del tema: εx, εy y γxy ya resueltas, de números
              limpios, para pasar a tensiones y a la εz.
          - id: ejerm4-cu8-tension-plana-y-deformacion-plana
            nota: >-
              Cuestión 8 de autoevaluación del tema 4: los dos estados planos,
              qué es nulo en cada uno y dónde se da cada uno.
          - id: ejerm4-cl4-4-las-tensiones-de-la-roseta
            nota: >-
              El 4.4 de clase, en su segunda mitad: de εx, εy y γxy a las
              tensiones, sus principales y σn y τn del plano perpendicular a
              una galga. Su primer paso es el del ejemplo de arriba, y sirve
              de repaso.
          - id: exerm1819-ext-5-tension-plana-con-la-galga-a-45-grados
            nota: >-
              El problema 1 de la extraordinaria de junio de 2019, de 1,5
              puntos: tensión plana con una sola galga, a 45°. Pide las
              tensiones y las deformaciones principales y σn y τn, con sus
              sentidos, en el plano perpendicular a la galga.
          - id: exerm2223-ext-4-la-galga-a-60-grados-en-tension-plana
            nota: >-
              El problema 1 de la extraordinaria de febrero de 2023, de 1,5
              puntos: el enunciado de plantilla de la de 2019, con la galga a
              60° y un plano paralelo a la dirección 1. Su primer paso es el
              de la de arriba, y sirve de repaso.
          - id: exerm2122-ext-5-las-galgas-a-15-grados-y-la-direccion-principal
            nota: >-
              El problema 1 de la extraordinaria de febrero de 2022, de 1,5
              puntos: dos galgas a ±15° de x, la εz y la dirección de una
              principal. Pide las principales, las componentes intrínsecas de
              un plano y cinco factores de seguridad, del tema 6.
        dominio: >-
          De las deformaciones de una roseta das las tensiones, sus
          principales y εz, y resuelves los problemas de examen sin mirar la
          resolución.

  - id: tensor
    titulo: El tensor de tensiones, de Cauchy al contorno de una chapa
    pide: >-
      Una cuestión de 1 punto que pide deducir algo del tema 2, el tetraedro
      de Cauchy o las componentes intrínsecas, o un problema de 1,5 puntos
      con tensiones dadas en el contorno de una chapa.
    porque: >-
      Cae en cuatro de las siete extraordinarias: cuatro preguntas y 3,9 de
      los 15,2 puntos de la parte 1. Tres son deducciones, Cauchy en 2020 y
      en 2022 y las componentes intrínsecas en 2023, y la cuarta, el problema
      de la chapa romboidal de 2021. Ninguna pide las principales de un
      tensor de 3 × 3, que es el problema del primer parcial: esa escalera
      está en
      [el bloque del tensor de la ruta del primer parcial](/road-to-ingenieria/elasticidad-resistencia/preparar/1par/#tensor).
    invariante:
      anios: 4
      fuente: >-
        Contado pregunta a pregunta: 2019-2020 (T4), 2020-2021 (P1),
        2021-2022 (T1) y 2022-2023 (T1a). Los puntos son los impresos junto a
        cada pregunta. La cuestión 1 de 2022-2023 vale 2 puntos y no los
        reparte entre sus cinco apartados: aquí cuenta 0,4 cada una.
    apunte:
      texto: parte 1 · en cuatro de siete — 3,9 de los 15,2 puntos
      tono: nota
    dominio: >-
      Deduces de memoria las ecuaciones de Cauchy con el tetraedro, das σn y
      τn de un plano y sacas el tensor de una chapa a partir de lo que actúa
      en su contorno.
    revisado: '2026-10-23'
    escalones:
      - id: las-componentes-intrinsecas
        titulo: Las componentes intrínsecas del vector tensión
        aprendes: >-
          A descomponer el vector tensión de un plano en sus dos componentes
          intrínsecas y a calcularlas con el tensor y la normal.
        teoria:
          tema: t02-tensiones
          apartado: el-vector-tensión-y-sus-componentes-intrínsecas
        ejercicios:
          - id: ejerm2-cu1-las-componentes-intrinsecas
            nota: >-
              Cuestión 1 de autoevaluación del tema 2: qué son, cómo se
              calculan y por qué se llaman así, con un tensor nuestro.
          - id: exerm2223-ext-1-componentes-intrinsecas-del-vector-tension
            nota: >-
              La parte a) de la cuestión 1 de la extraordinaria de febrero de
              2023: la cuestión de autoevaluación de arriba, palabra por
              palabra, resuelta con otro ejemplo. La respuesta es la de
              arriba, y sirve de repaso.
        dominio: >-
          Dices qué son σn y τn de un plano y las calculas con el tensor y la
          normal, sin confundir τn con una componente cartesiana.
      - id: el-tetraedro-de-cauchy
        titulo: El tetraedro de Cauchy
        aprendes: >-
          A deducir el vector tensión de un plano cualquiera con el equilibrio
          del tetraedro elemental, y a calcularlo con el tensor de un punto.
        teoria:
          tema: t02-tensiones
          apartado: el-tensor-de-tensiones-y-la-ecuación-de-cauchy
        ejercicios:
          - id: ejerm2-el-vector-tension-de-un-plano
            incrustado: true
            nota: >-
              El ejemplo del tema: el vector tensión de un plano oblicuo y sus
              componentes intrínsecas, con números.
          - id: ejerm2-cl2-11-el-vector-tension-desde-las-principales
            nota: >-
              El 2.11 de clase: las principales dadas como vectores, y el
              vector tensión de un plano con ellas.
          - id: exerm1819-1par-1-el-tetraedro-de-cauchy
            incrustado: true
            nota: >-
              La cuestión 1 de la extraordinaria de febrero de 2022, de 1
              punto, que es la del primer parcial de 2018-2019 palabra por
              palabra: la deducción con el tetraedro.
          - id: exerm1920-ext-4-las-ecuaciones-de-cauchy
            nota: >-
              La cuestión 4 de la extraordinaria de enero de 2020, de 1 punto:
              la misma deducción con otras palabras, resuelta con otro
              ejemplo. La deducción es la de arriba, y sirve de repaso.
        dominio: >-
          Escribes la deducción de Cauchy con su dibujo, dices por qué no
          quedan en ella las fuerzas de volumen y calculas el vector tensión
          de un plano con su normal unitaria.
      - id: el-contorno-de-una-chapa
        titulo: Las tensiones en el contorno de una chapa
        aprendes: >-
          A sacar el tensor de una chapa en tensión plana a partir de lo que
          actúa en su contorno, y a llevarlo al círculo de Mohr y a las
          principales.
        teoria:
          tema: t02-tensiones
          apartado: tensión-plana
          nota: >-
            El círculo va en el apartado siguiente,
            [el círculo de Mohr](/road-to-ingenieria/elasticidad-resistencia/t02-tensiones/#el-círculo-de-mohr).
        ejercicios:
          - id: ejerm2-circulo-de-mohr-en-tension-plana
            incrustado: true
            nota: >-
              El ejemplo del tema: un estado de tensión plana con su círculo
              entero, hasta la tangencial máxima del punto.
          - id: ejerm2-cl2-9-del-elemento-girado-a-los-ejes-xy
            nota: >-
              El 2.9 de clase: un elemento girado 60°, y de sus tensiones, las
              de los ejes x e y, con el círculo.
          - id: exerm1920-1par-5-la-chapa-hexagonal
            nota: >-
              El problema 1 del primer parcial de 2019-2020, de 2 puntos: una
              chapa hexagonal en tensión plana, sus tres círculos de Mohr y σn
              y τn en sus seis caras.
          - id: exerm2021-ext-5-la-chapa-romboidal-con-tensiones-oblicuas
            nota: >-
              El problema 1 de la extraordinaria de febrero de 2021, de 1,5
              puntos: una chapa romboidal con tensiones oblicuas en el
              contorno. Pide el tensor, las principales, la deformación
              tangencial máxima y lo que cambia la longitud de un lado.
        dominio: >-
          Sacas el tensor de una chapa a partir de lo que actúa en sus lados,
          dibujas su círculo y das las principales con su dirección.

  - id: hooke
    titulo: Hooke y Lamé, del cuerpo encajado a las direcciones principales
    pide: >-
      Un problema de 1,5 puntos con un cuerpo encajado en un hueco o
      comprimido por otro, o una cuestión de teoría del tema 4: las tensiones
      a partir de las deformaciones, deducidas, o por qué coinciden las
      direcciones principales de los dos tensores.
    porque: >-
      Cae en tres de las siete extraordinarias: tres preguntas y 2,9 de los
      15,2 puntos de la parte 1. La mitad es el problema del bloque
      comprimido de 2018; las otras dos son cuestiones, las tensiones a
      partir de las deformaciones en 2022, que había caído antes en un primer
      parcial, y las direcciones principales en 2023. La escalera larga, con
      las cotas de ν, está en
      [el bloque de Hooke de la ruta del primer parcial](/road-to-ingenieria/elasticidad-resistencia/preparar/1par/#hooke).
    invariante:
      anios: 3
      fuente: >-
        Contado pregunta a pregunta: 2017-2018 (P1), 2021-2022 (T2) y
        2022-2023 (T1b). Los puntos son los impresos junto a cada pregunta.
        La cuestión 1 de 2022-2023 vale 2 puntos y no los reparte entre sus
        cinco apartados: aquí cuenta 0,4 cada una.
    apunte:
      texto: parte 1 · en tres de siete — 2,9 de los 15,2 puntos
      tono: nota
    dominio: >-
      Escribes Hooke en los dos sentidos, con las condiciones de un cuerpo
      encajado o libre en cada dirección, y explicas por qué los dos
      tensores tienen las mismas direcciones principales.
    revisado: '2026-10-23'
    escalones:
      - id: el-prisma-restringido
        titulo: El cuerpo que no se puede deformar hacia un lado
        aprendes: >-
          A traducir paredes, cargas y caras libres en condiciones sobre
          tensiones y deformaciones, y a sacar con Hooke las que faltan y el
          cambio de volumen.
        teoria:
          tema: t04-cuerpo-elastico
          apartado: un-prisma-en-un-hueco-rígido
        ejercicios:
          - id: ejerm4-cubo-en-un-hueco-rigido
            incrustado: true
            nota: >-
              El ejemplo del tema: un cubo metido en un hueco rígido, con la
              tensión que le hacen las paredes y su cambio de volumen.
          - id: ejerm4-cu2-la-ley-de-hooke
            nota: >-
              Cuestión 2 de autoevaluación del tema 4: las deformaciones en
              función de las tensiones, y de dónde sale cada término.
          - id: ejerm4-cl4-1-el-cuerpo-libre-en-z
            nota: >-
              El 4.1 de clase: un cuerpo en un hueco rígido, comprimido y
              libre en z, hasta las tensiones principales y el cambio de
              volumen.
          - id: exerm1718-ext-5-el-bloque-comprimido-que-levanta-el-cuerpo-2
            nota: >-
              El problema 1 de la extraordinaria de junio de 2018, de 1,5
              puntos: un bloque comprimido de lado que levanta el cuerpo que
              lleva encima. Pide la tensión que lo sube una altura dada, sus
              alargamientos y su cambio de volumen.
        dominio: >-
          Escribes las condiciones de cada cara antes de calcular, y sacas con
          Hooke las tensiones que faltan, los alargamientos y el cambio de
          volumen.
      - id: las-ecuaciones-de-lame
        titulo: Las tensiones a partir de las deformaciones
        aprendes: >-
          A deducir de la ley de Hooke generalizada las tensiones en función
          de las deformaciones, con las constantes de Lamé.
        teoria:
          tema: t04-cuerpo-elastico
          apartado: tensiones-a-partir-de-deformaciones-las-ecuaciones-de-lamé
        ejercicios:
          - id: exerm1718-1par-2-las-tensiones-a-partir-de-las-deformaciones
            incrustado: true
            nota: >-
              La cuestión 2 de la extraordinaria de febrero de 2022, de 1
              punto, que es la del primer parcial de 2017-2018 palabra por
              palabra: la deducción, partiendo de Hooke generalizada.
        dominio: >-
          Deduces de memoria las tensiones en función de las deformaciones,
          con λ y G, y las usas en un punto con un tensor de deformaciones
          dado.
      - id: las-direcciones-principales
        titulo: Las mismas direcciones principales
        aprendes: >-
          A explicar por qué coinciden las direcciones principales de
          tensiones y de deformaciones, y a comprobarlo en un estado concreto.
        teoria:
          tema: t04-cuerpo-elastico
          apartado: la-ley-de-hooke-deformaciones-a-partir-de-tensiones
        ejercicios:
          - id: ejerm4-cu4-las-mismas-direcciones-principales
            nota: >-
              Cuestión 4 de autoevaluación del tema 4: la razón, comprobada con
              unas tensiones nuestras de tensión plana.
          - id: exerm2223-ext-1-por-que-coinciden-las-direcciones-principales
            nota: >-
              La parte b) de la cuestión 1 de la extraordinaria de febrero de
              2023: la cuestión de autoevaluación de arriba con otras palabras,
              resuelta con otro ejemplo. La razón es la de arriba, y sirve de
              repaso.
        dominio: >-
          Explicas en dos líneas por qué coinciden las direcciones principales
          de los dos tensores, y lo compruebas con un estado de tensión plana.
    falta:
      - >-
        Las tensiones a partir de las deformaciones no tienen ejemplo ni
        práctica en el sitio, y su escalón es la cuestión de examen sola, con
        la deducción en la prosa delante.

  - id: fallo
    titulo: Las teorías de fallo, con Mohr deducido
    pide: >-
      Una cuestión de teoría del tema 6: el criterio de los estados límite de
      Mohr, deducido, o qué es la tensión equivalente.
    porque: >-
      Cae en dos de las siete extraordinarias, siempre como cuestión: dos
      preguntas y 1,4 de los 15,2 puntos de la parte 1, el criterio de Mohr
      deducido en 2017 y la tensión equivalente en 2023. Los criterios entran
      además en los problemas de galgas: la extraordinaria de 2022 pide cinco
      factores de seguridad. La escalera larga, con Von Mises deducido, está
      en
      [el bloque de teorías de fallo de la ruta del primer parcial](/road-to-ingenieria/elasticidad-resistencia/preparar/1par/#fallo).
    invariante:
      anios: 2
      fuente: >-
        Contado pregunta a pregunta: 2016-2017 (T1) y 2022-2023 (T1c). Los
        puntos son los impresos junto a cada pregunta. La cuestión 1 de
        2022-2023 vale 2 puntos y no los reparte entre sus cinco apartados: aquí
        cuenta 0,4 cada una.
    apunte:
      texto: parte 1 · en dos de siete — 1,4 de los 15,2 puntos
      tono: neutro
    dominio: >-
      Dices qué es la tensión equivalente y deduces el criterio de Mohr con
      su figura hasta la condición de no fallo.
    revisado: '2026-10-23'
    escalones:
      - id: la-tension-equivalente
        titulo: La tensión equivalente
        aprendes: >-
          A decir qué es la tensión equivalente de un estado, de dónde sale y
          para qué sirve el factor de seguridad.
        teoria:
          tema: t06-teorias-de-fallo
          apartado: tensión-equivalente-y-factor-de-seguridad
        ejercicios:
          - id: ejerm6-cu1-la-tension-equivalente
            nota: >-
              Cuestión 1 de autoevaluación del tema 6: qué es, de dónde sale y
              para qué se usa.
          - id: exerm2223-ext-1-el-concepto-de-tension-equivalente
            nota: >-
              La parte c) de la cuestión 1 de la extraordinaria de febrero de
              2023: la cuestión de autoevaluación de arriba con otras palabras,
              resuelta con otro ejemplo. La respuesta es la de arriba, y sirve
              de repaso.
        dominio: >-
          Explicas qué es la tensión equivalente sin nombrar un criterio
          concreto, y das el factor de seguridad de un estado con el criterio
          que pida el enunciado.
      - id: los-estados-limite-de-mohr
        titulo: El criterio de los estados límite de Mohr
        aprendes: >-
          A deducir el criterio de Mohr desde la curva intrínseca hasta la
          condición de no fallo, y a usarlo con estados que no son ensayos.
        teoria:
          tema: t06-teorias-de-fallo
          apartado: los-estados-límite-de-mohr
        ejercicios:
          - id: exerm2021-1par-4-el-limite-a-compresion-por-mohr
            incrustado: true
            nota: >-
              La cuestión 4 del primer parcial de 2020-2021, de 1 punto: el
              límite a compresión que dan un ensayo de tracción y uno de
              cortadura pura.
          - id: exerm2223-1par-4-dos-estados-limite-de-mohr
            nota: >-
              La cuestión 4 del primer parcial de 2022-2023, de 1 punto: dos
              estados límite que se encadenan. Su primer paso sale ya en el de
              arriba, y sirve de repaso.
          - id: exerm1819-1par-3-el-criterio-de-los-estados-limites-de-mohr
            nota: >-
              La cuestión 3 del primer parcial de 2018-2019, de 1 punto, que
              volvió en la final de enero de 2023: el criterio deducido, de la
              curva intrínseca a la condición de no fallo. Sus dos círculos son
              los del primero del escalón, y sirve de repaso.
          - id: exerm1617-ext-1-el-criterio-de-mohr-deducido
            nota: >-
              La cuestión 1 de la extraordinaria de junio de 2017, de 1 punto:
              la misma deducción, resuelta con otro ejemplo que acaba en un
              factor de seguridad. La deducción es la de arriba, y sirve de
              repaso.
        dominio: >-
          Deduces el criterio con su figura, escribes σeq de memoria y sacas
          el límite a compresión de un material con dos ensayos.

  - id: deformaciones
    titulo: El campo de desplazamientos, una cuestión del tema 3
    pide: >-
      Una cuestión de 1 punto con un campo de desplazamientos que tiene
      constantes por conocer, y las condiciones que el enunciado pone para
      hallarlas.
    porque: >-
      Cae solo en la extraordinaria de enero de 2020: una pregunta y 1 de los
      15,2 puntos de la parte 1. Va el último de la parte por eso; sin el 0,4
      de la cuestión de 2023, empataría con las teorías de fallo y pasaría
      delante, por ser más reciente. La escalera larga del tema 3, con la
      rotación y la compatibilidad, está en
      [el bloque de deformaciones de la ruta del primer parcial](/road-to-ingenieria/elasticidad-resistencia/preparar/1par/#deformaciones).
    invariante:
      anios: 1
      fuente: >-
        Contado pregunta a pregunta: 2019-2020 (T1). Los puntos son los
        impresos junto a cada pregunta.
    apunte:
      texto: parte 1 · solo en la de enero de 2020 — 1 de los 15,2 puntos
      tono: neutro
    dominio: >-
      Ante un campo de desplazamientos con constantes escribes el tensor de
      deformaciones, traduces cada condición del enunciado a una ecuación y
      das el cambio de volumen.
    revisado: '2026-10-23'
    escalones:
      - id: el-campo-de-desplazamientos
        titulo: Del campo de desplazamientos al tensor
        aprendes: >-
          A derivar un campo de desplazamientos para sacar el tensor de
          deformaciones de un punto, y a leer en él el cambio de volumen.
        teoria:
          tema: t03-deformaciones
          apartado: deformación-y-rotación-el-gradiente-partido-en-dos
          nota: >-
            El cambio de volumen va más abajo, en
            [cambio de volumen y de forma](/road-to-ingenieria/elasticidad-resistencia/t03-deformaciones/#cambio-de-volumen-y-de-forma).
        ejercicios:
          - id: ejerm3-cl3-2-del-desplazamiento-a-las-principales
            nota: >-
              El 3.2 de clase: de un campo de desplazamientos al tensor de un
              punto y a sus principales.
          - id: ejerm3-cu8-la-variacion-de-volumen
            nota: >-
              Cuestión 8 de autoevaluación del tema 3: el volumen del elemento
              después de deformarse, y qué deformaciones lo cambian.
          - id: ejerm3-cl3-5-el-paralelepipedo-y-el-punto-e
            nota: >-
              El 3.5 de clase: un paralelepípedo deformado, el tensor en uno de
              sus vértices y dos direcciones.
          - id: exerm1920-ext-1-el-campo-de-desplazamientos-del-prisma
            nota: >-
              La cuestión 1 de la extraordinaria de enero de 2020, de 1 punto:
              un prisma que no cambia de volumen, en deformación plana, y las
              cuatro constantes de su campo de desplazamientos.
        dominio: >-
          Del campo de desplazamientos sacas el tensor de deformaciones de un
          punto y traduces cada condición del enunciado, sin cambio de volumen
          o plana, a una ecuación.

  # ─────────────────────────────────────────────────────────────────────
  # PARTE 2 · resistencia de materiales, temas 7 a 14 · 45 preguntas y
  # 54,8 puntos
  # ─────────────────────────────────────────────────────────────────────
  - id: esfuerzos
    titulo: La rebanada, recta y curva, el suelo de la parte 2
    pide: >-
      Una cuestión de 1 punto del tema 7: las ecuaciones de equilibrio de la
      rebanada deducidas, de una pieza recta o de una curva, o la carga
      repartida sobre una pieza curva. Y dentro de casi todos los problemas,
      las leyes de cada tramo.
    porque: >-
      Son tres preguntas en tres de las siete extraordinarias, 2,4 de los
      54,8 puntos de la parte 2: la rebanada de la pieza curva en 2018, la de
      la recta en 2019 y la carga por metro de horizontal en 2023. Va el
      primero de la parte 2 por otra razón: las leyes de cada tramo son el
      primer paso de casi todos sus problemas, de la energía a la sección que
      se dimensiona. Los diagramas tienen su bloque largo en
      [la ruta del segundo parcial](/road-to-ingenieria/elasticidad-resistencia/preparar/2par/#diagramas).
    invariante:
      anios: 3
      fuente: >-
        Contado pregunta a pregunta: 2017-2018 (T1), 2018-2019 (T1) y
        2022-2023 (T1d). Los puntos son los impresos junto a cada pregunta.
        La cuestión 1 de 2022-2023 vale 2 puntos y no los reparte entre sus
        cinco apartados: aquí cuenta 0,4 cada una.
    apunte:
      texto: parte 2 · el suelo, en tres de siete — 2,4 de los 54,8 puntos
      tono: marco
    dominio: >-
      Deduces las ecuaciones de la rebanada recta y de la curva con su
      dibujo, escribes en los ejes de la pieza una carga dada por metro de
      horizontal y dibujas los diagramas de una viga con rótula.
    revisado: '2026-10-23'
    escalones:
      - id: el-equilibrio-de-la-rebanada
        titulo: Las ecuaciones de la rebanada recta
        aprendes: >-
          A deducir las tres ecuaciones de la rebanada con su dibujo, cada
          esfuerzo con el convenio del curso, y a leer en ellas lo que dicen
          de los diagramas.
        teoria:
          tema: t07-piezas-prismaticas
          apartado: el-equilibrio-de-la-rebanada
        ejercicios:
          - id: ejerm7-la-rebanada-con-la-carga-vertical-arriba
            incrustado: true
            nota: >-
              El ejemplo del tema: la rebanada con una carga apoyada en su cara
              de arriba, y un voladizo con números.
          - id: ejerm7-cu5-la-carga-lineal
            nota: >-
              Cuestión 5 de autoevaluación del tema 7: la cortante y el flector
              bajo una carga repartida lineal, y el flector máximo con ellos.
          - id: exerm1213-1par-2-el-equilibrio-del-elemento-de-viga
            nota: >-
              La pregunta 2 de teoría del primer parcial de 2012-2013, de 1,5
              puntos: la deducción, en el caso general y en el plano. Su primer
              paso sale ya en el ejemplo de arriba, y sirve de repaso.
          - id: exerm1920-ord-2-las-ecuaciones-de-equilibrio-de-la-pieza-recta
            nota: >-
              La cuestión 1 de la extraordinaria de junio de 2019, de 1 punto,
              que volvió igual como cuestión 2 de la final de enero de 2020:
              la deducción, resuelta con otro ejemplo. La deducción es la de
              arriba, y sirve de repaso.
        dominio: >-
          Deduces las tres ecuaciones con su dibujo, justificas cada término
          y las usas para sacar el flector máximo de un tramo.
      - id: la-pieza-curva
        titulo: La rebanada de una pieza curva
        aprendes: >-
          A deducir las ecuaciones de equilibrio de la rebanada curva con sus
          ángulos, y a escribir en sus ejes una carga repartida vertical.
        teoria:
          tema: t07-piezas-prismaticas
          apartado: piezas-de-directriz-curva
        ejercicios:
          - id: exerm1314-1par-1-la-rebanada-de-directriz-curva
            nota: >-
              La pregunta 1 de teoría del primer parcial de 2013-2014, de 1
              punto: las tres ecuaciones de la rebanada curva, con los sentidos
              de la figura.
          - id: exerm1718-ext-1-las-ecuaciones-de-la-pieza-curva
            nota: >-
              La cuestión 1 de la extraordinaria de junio de 2018, de 1 punto:
              la misma deducción, resuelta con dos ejemplos nuestros. La
              deducción es la de arriba, y sirve de repaso.
          - id: exerm1516-1par-3-la-carga-por-metro-de-horizontal-en-una-pieza-curva
            nota: >-
              La parte a de la pregunta 3 de teoría del primer parcial de
              2015-2016, de 0,5 puntos: una carga vertical por metro de
              horizontal sobre una pieza curva, en las componentes de la
              pieza.
          - id: exerm2223-ext-1-la-carga-por-metro-de-horizontal-en-una-pieza-curva
            nota: >-
              La parte d) de la cuestión 1 de la extraordinaria de febrero de
              2023: la pregunta de arriba con otras palabras, resuelta con
              otro ejemplo. Su primer paso es el de arriba, y sirve de repaso.
        dominio: >-
          Deduces las ecuaciones de la rebanada curva con su dibujo y escribes
          en sus ejes una carga dada por metro de horizontal.
      - id: las-leyes-tramo-a-tramo
        titulo: Las leyes de esfuerzos y sus diagramas
        aprendes: >-
          A sacar las reacciones de una viga con varios apoyos, escribir la
          cortante y el momento de cada trozo y dibujar sus diagramas con los
          valores de los puntos clave.
        teoria:
          tema: t07-piezas-prismaticas
          apartado: cómo-se-dibujan-los-diagramas
        ejercicios:
          - id: ejerm7-la-viga-con-rotula
            incrustado: true
            nota: >-
              El ejemplo del tema: una viga empotrada con una rótula, resuelta
              hasta el flector máximo del vano.
          - id: ejerm7-cl7-5-la-viga-con-voladizo-y-un-par-de-20-kn-m
            nota: >-
              El 7.5 de clase: una viga con voladizo, dos fuerzas y un par
              concentrado entre los apoyos.
          - id: exerm2021-1par-6-la-gerber-empotrada-con-la-rotula-en-c
            nota: >-
              El problema 2 del primer parcial de 2020-2021, de 2 puntos: los
              diagramas de una Gerber empotrada, el nivel que piden los
              problemas de la parte 2 antes de llegar a la sección. Su primer
              paso, por dónde se empieza, es el del ejemplo de arriba, y sirve
              de repaso.
        dominio: >-
          Dibujas los diagramas de una viga con rótula y voladizo con sus
          valores en los puntos clave, y dices por qué tramo empiezas antes de
          calcular.
    falta:
      - >-
        La rebanada de la pieza curva empieza en preguntas de examen, sin
        ejemplo ni práctica delante. La cuestión 7 de autoevaluación del tema
        7, que la pregunta, no está en el sitio.

  - id: energia
    titulo: Los teoremas energéticos, el problema que cae en todas
    pide: >-
      Casi siempre el último problema de la hoja: un pórtico o una barra
      quebrada, a menudo sujeta además por una barra o un tirante. Se pide
      la fuerza de esa barra o una reacción, y un desplazamiento.
    porque: >-
      Cae en las siete extraordinarias, siempre con un problema de 1,5
      puntos, y en 2017 además con una cuestión: ocho preguntas y 11,5 de los
      54,8 puntos de la parte 2, más que ningún otro hueco del examen. Cinco
      de los siete problemas llevan una barra o un tirante que sujeta la
      pieza. La escalera larga, con la
      reciprocidad, está en
      [el bloque de energía de la ruta del segundo parcial](/road-to-ingenieria/elasticidad-resistencia/preparar/2par/#energia).
    invariante:
      anios: 7
      fuente: >-
        Contado pregunta a pregunta: 2016-2017 (T3 y P4), 2017-2018 (P4),
        2018-2019 (P4), 2019-2020 (P4), 2020-2021 (P4), 2021-2022 (P3) y
        2022-2023 (P2). Los puntos son los impresos junto a cada pregunta.
    apunte:
      texto: parte 2 · en las siete — 11,5 de los 54,8 puntos
      tono: nota
    dominio: >-
      Ante un pórtico o una barra quebrada eliges las incógnitas, escribes el
      flector y el torsor de cada tramo con sus ejes, cierras el problema y
      das el desplazamiento que piden.
    revisado: '2026-10-23'
    escalones:
      - id: castigliano-y-la-fuerza-unidad
        titulo: Engesser-Castigliano y la fuerza unidad
        aprendes: >-
          A enunciar el teorema de Engesser-Castigliano y a sacar con él el
          desplazamiento de un punto de una estructura isostática.
        teoria:
          tema: t13-teoremas-energeticos
          apartado: la-fuerza-unitaria
          nota: >-
            El teorema que lo justifica está en
            [Castigliano y Engesser-Castigliano](/road-to-ingenieria/elasticidad-resistencia/t13-teoremas-energeticos/#castigliano-y-engesser-castigliano).
        ejercicios:
          - id: exerm1920-2par-2-engesser-castigliano-y-la-carga-unitaria
            nota: >-
              La cuestión 2 de la segunda parte de enero de 2020, de 1 punto:
              el teorema y el método, sin una estructura que calcular. No ha
              caído en ninguna extraordinaria; aquí va de peldaño.
          - id: exerm2021-ord-6-la-canasta-de-baloncesto
            nota: >-
              El problema 2 de la final de enero de 2021, de 1,5 puntos: el
              soporte de una canasta, isostático y en un plano. Pide el
              diámetro del tubo por el descenso de un punto.
        dominio: >-
          Sacas el desplazamiento de un punto de una estructura isostática de
          dos tramos con la fuerza unidad, con todos los términos que pida el
          enunciado.
      - id: la-incognita-de-mas
        titulo: El pórtico plano hiperestático
        aprendes: >-
          A contar las incógnitas que la estática no cierra en un pórtico,
          quitar los enlaces que sobran y escribir con la coenergía la
          condición que cierra cada una.
        teoria:
          tema: t13-teoremas-energeticos
          apartado: hiperestáticos-la-incógnita-y-lo-que-hacía
        ejercicios:
          - id: ejerm13-el-portico-con-un-muelle
            incrustado: true
            nota: >-
              El ejemplo del tema: un pórtico en L con un muelle bajo la punta.
          - id: exerm1617-ext-8-el-portico-atado-por-la-barra-bf
            nota: >-
              El problema 4 de la extraordinaria de junio de 2017, de 1,5
              puntos: un pórtico biapoyado atado por una barra entre sus
              apoyos. Pide la fuerza de la barra, si tira o empuja, y un
              desplazamiento.
          - id: exerm1819-ext-8-el-portico-abcd-articulado-en-a-y-en-d
            nota: >-
              El problema 4 de la extraordinaria de junio de 2019, de 1,5
              puntos: un pórtico con dos apoyos fijos a distinta altura y una
              carga repartida. Pide las reacciones y el giro de un nudo.
          - id: exerm1920-ext-8-el-portico-abcd-y-el-pilar-fc
            nota: >-
              El problema 4 de la extraordinaria de enero de 2020, de 1,5
              puntos: un pórtico articulado a un pilar empotrado. Pide una
              reacción y un desplazamiento, solo con la energía de flexión.
        dominio: >-
          Cuentas las incógnitas de un pórtico con una barra, un muelle o una
          articulación, escribes la condición que cierra cada una y sacas con
          ellas un giro o un desplazamiento.
      - id: la-barra-quebrada-en-el-espacio
        titulo: La barra quebrada en el espacio
        aprendes: >-
          A escribir el flector y el torsor de cada tramo de una pieza con
          tramos perpendiculares, cada uno en sus ejes, y a sacar con ellos un
          desplazamiento.
        teoria:
          tema: t13-teoremas-energeticos
          apartado: barras-quebradas-en-el-espacio
          nota: >-
            El apartado la resuelve en una figura, con dos tramos y una carga.
        ejercicios:
          - id: exerm1718-2par-7-la-estructura-espacial-de-seccion-rectangular-hueca
            nota: >-
              El problema 3 de la segunda parte de enero de 2018, de 2 puntos,
              que cayó igual en la final de ese día: isostático, pide un
              desplazamiento y una tensión máxima, y es el peldaño de entrada.
          - id: exerm1718-ext-8-la-estructura-espacial-con-la-barra-fd
            nota: >-
              El problema 4 de la extraordinaria de junio de 2018, de 1,5
              puntos: una estructura en el espacio, empotrada y sujeta por una
              barra. Pide la fuerza de la barra y el descenso de un punto.
          - id: exerm1617-ext-3-la-fuerza-que-deja-quieto-el-punto-c
            nota: >-
              La cuestión 3 de la extraordinaria de junio de 2017, de 1 punto:
              una barra quebrada empotrada con un par en un extremo, y la
              fuerza que deja quieto el otro.
          - id: exerm2223-ext-5-la-barra-quebrada-con-un-tirante
            nota: >-
              El problema 2 de la extraordinaria de febrero de 2023, de 1,5
              puntos: una barra quebrada empotrada, con una carga repartida en
              un tramo y un tirante en la punta. Pide el axil del tirante y un
              desplazamiento.
          - id: exerm2021-ext-8-la-estructura-abcde-con-la-barra-fd
            nota: >-
              El problema 4 de la extraordinaria de febrero de 2021, de 1,5
              puntos: una estructura en el espacio sujeta por una barra, con
              flexión, torsión y axil. Su primer paso es el de la de arriba, y
              sirve de repaso.
          - id: exerm2122-ext-7-la-barra-oab-con-el-tirante-bc
            nota: >-
              El problema 3 de la extraordinaria de febrero de 2022, de 1,5
              puntos: una barra empotrada con un tirante, la carga admisible
              por Von Mises y un descenso. Va el último porque junta el tema 6
              con este.
        dominio: >-
          Ante una barra quebrada con una barra o un tirante escribes el
          flector y el torsor de cada tramo con sus ejes, cierras la incógnita
          y das el desplazamiento que piden sin mirar la resolución.
    falta:
      - >-
        Los siete ejercicios de clase del tema 13 (13.1 a 13.7) y sus
        cuestiones de autoevaluación no están en el sitio. El tema tiene un
        solo ejemplo, el pórtico con un muelle, y los escalones de la fuerza
        unidad y de la barra quebrada empiezan en ejercicios de examen. Es el
        mismo hueco que declaran las rutas del segundo parcial y de la final.

  - id: torsion
    titulo: La torsión, una pregunta en cada extraordinaria
    pide: >-
      Una cuestión de 1 punto, la teoría de la sección circular o de la
      cerrada de pared delgada o dónde cargar una viga de sección abierta, o
      un problema de 1,5 puntos con un eje que el equilibrio no resuelve,
      empotrado en los dos extremos o sujeto por barras y tirantes.
    porque: >-
      Cae en las siete extraordinarias: ocho preguntas y 10 de los 54,8 puntos
      de la parte 2, detrás solo de los teoremas energéticos. Cuatro son ejes
      que el equilibrio no resuelve, los problemas de 2018, 2021, 2022 y 2023,
      y los dos últimos sujetos por tirantes; las otras cuatro son
      cuestiones, la sección circular, la cerrada dos veces y el centro de
      torsión. Flexión y torsión a la vez va en su propio bloque, más abajo.
      La escalera larga está en
      [el bloque de torsión de la ruta del segundo parcial](/road-to-ingenieria/elasticidad-resistencia/preparar/2par/#torsion).
    invariante:
      anios: 7
      fuente: >-
        Contado pregunta a pregunta: 2016-2017 (T2), 2017-2018 (T3 y P3),
        2018-2019 (T4), 2019-2020 (T3), 2020-2021 (P2), 2021-2022 (P4) y
        2022-2023 (P4). Los puntos son los impresos junto a cada pregunta.
    apunte:
      texto: parte 2 · en las siete — 10 de los 54,8 puntos
      tono: nota
    dominio: >-
      Resuelves un eje con un enlace de más, sea una pared, una barra o un
      tirante, deduces la tensión y el giro de la sección circular y de la
      cerrada, y sitúas el centro de torsión de una sección abierta.
    revisado: '2026-10-23'
    escalones:
      - id: la-seccion-circular
        titulo: La sección circular, deducida
        aprendes: >-
          A deducir la tensión tangencial y el giro de una sección circular
          desde la hipótesis de partida, y a aplicarlos a un eje o a un tubo.
        teoria:
          tema: t12-torsion
          apartado: la-sección-circular
        ejercicios:
          - id: exerm1819-2par-1-la-torsion-de-la-seccion-circular
            nota: >-
              La cuestión 1 de la segunda parte de enero de 2019, de 1 punto:
              la teoría entera, resuelta con un eje nuestro.
          - id: exerm1617-ext-2-la-torsion-de-piezas-prismaticas-circulares
            nota: >-
              La cuestión 2 de la extraordinaria de junio de 2017, de 1 punto:
              la misma teoría, con «prismáticas», resuelta con otro ejemplo. La
              deducción es la de arriba, y sirve de repaso.
        dominio: >-
          Deduces τ y el giro de la sección circular con su hipótesis, y das
          qué cambia si la sección es un tubo.
      - id: el-eje-que-el-equilibrio-no-resuelve
        titulo: El eje que el equilibrio no resuelve
        aprendes: >-
          A repartir un par entre los extremos de un eje que la estática no
          resuelve, también cuando lo sujetan unas barras por una pieza
          rígida, y a dibujar sus diagramas de torsores y de giros.
        teoria:
          tema: t12-torsion
          apartado: el-giro-y-los-ejes-que-el-equilibrio-no-resuelve
        ejercicios:
          - id: ejerm12-el-eje-de-dos-diametros
            incrustado: true
            nota: >-
              El ejemplo del tema: un eje de dos diámetros entre dos paredes,
              con un par en el cambio de sección.
          - id: exerm1718-ext-7-el-eje-escalonado-con-flexion-y-torsion
            nota: >-
              El problema 3 de la extraordinaria de junio de 2018, de 1,5
              puntos: un eje escalonado, empotrado en un extremo y apoyado en
              el otro, con una carga excéntrica en el cambio de diámetro. Pide
              los diagramas y la carga que lo gira 2°.
          - id: exerm1617-2par-6-el-eje-biempotrado-con-un-par-repartido-y-otro-concentrado
            nota: >-
              El problema 2 de la segunda parte de enero de 2017, de 2 puntos,
              que cayó igual en la final de ese día: un eje empotrado en los
              dos extremos, con un par repartido y otro concentrado. Pide el
              diámetro y el diagrama de giros. Su primer paso es el del
              ejemplo de arriba, y sirve de repaso.
          - id: exerm2021-ext-6-el-eje-biempotrado-con-un-torsor-repartido
            nota: >-
              El problema 2 de la extraordinaria de febrero de 2021, de 1,5
              puntos: otro eje empotrado en los dos extremos, con un torsor
              repartido y un par, hasta un eje anular. Su primer paso es el de
              arriba, y sirve de repaso.
          - id: exerm2526-2par-1-el-eje-con-un-disco-y-dos-barras
            nota: >-
              La cuestión 1 de la segunda parte de enero de 2026, de 1,25
              puntos: un eje con un disco sujeto por dos barras, el caso del
              último párrafo del apartado.
          - id: exerm2223-ext-7-el-eje-con-palancas-y-tirantes
            nota: >-
              El problema 4 de la extraordinaria de febrero de 2023, de 1,5
              puntos: palancas y tirantes en los dos extremos de un eje, y dos
              galgas, del tema 3, en uno de los tirantes.
          - id: exerm2122-ext-8-el-eje-abc-con-la-barra-de-y-dos-tirantes
            nota: >-
              El problema 4 de la extraordinaria de febrero de 2022, de 1,5
              puntos: un eje con un tramo de tubo cuadrado y otro macizo, y el
              extremo soldado a una barra rígida sobre dos tirantes. Pide los
              axiles de los tirantes y un giro. Su primer paso es el de la
              cuestión de 2026 de arriba con tirantes, y sirve de repaso.
        dominio: >-
          Resuelves un eje con un enlace de más, sea una pared, unas barras o
          unos tirantes, y dibujas sus diagramas de torsores y de giros con su
          signo.
      - id: la-seccion-cerrada
        titulo: La sección cerrada de pared delgada
        aprendes: >-
          A deducir la tensión y el giro de una sección cerrada de pared
          delgada y a usarlos para dimensionar un tubo.
        teoria:
          tema: t12-torsion
          apartado: secciones-cerradas-de-pequeño-espesor
          nota: >-
            Léelo junto con el de antes, el de las
            [secciones abiertas](/road-to-ingenieria/elasticidad-resistencia/t12-torsion/#secciones-abiertas-de-pequeño-espesor).
        ejercicios:
          - id: exerm2223-2par-4-la-tension-tangencial-en-una-seccion-cerrada
            nota: >-
              La cuestión 4 de la segunda parte de enero de 2023, de 1 punto:
              la tensión tangencial, deducida. No ha caído en ninguna
              extraordinaria; aquí va de peldaño.
          - id: exerm1920-ext-3-la-torsion-de-la-seccion-cerrada
            nota: >-
              La cuestión 3 de la extraordinaria de enero de 2020, de 1 punto:
              la tensión y además el giro por unidad de longitud, deducidos. La
              deducción de la tensión es la de arriba, y sirve de repaso.
          - id: exerm1920-2par-3-el-tubo-rectangular-en-lugar-de-la-barra-maciza
            nota: >-
              La cuestión 3 de la segunda parte de enero de 2020, de 1 punto,
              que cayó igual en la final de ese día: un tubo rectangular que
              sustituye a una barra maciza. Pide el espesor mínimo, y su
              primer paso vuelve sobre el área de la fórmula: sirve de repaso.
          - id: exerm1819-ext-4-el-torsor-maximo-del-tubo-cuadrado
            nota: >-
              La cuestión 4 de la extraordinaria de junio de 2019, de 1 punto:
              un tubo cuadrado en voladizo, y el mayor torsor que cumple a la
              vez un criterio de fallo y un giro máximo. Su primer paso es el
              de la cuestión de arriba, y sirve de repaso.
          - id: exerm2021-ord-1-dos-triangulos-a-torsion
            nota: >-
              La cuestión 1 de la final de enero de 2021, de 1 punto: dos
              triángulos de pared delgada, de espesores distintos, con el mismo
              par, y la relación entre los espesores que iguala sus tensiones.
        dominio: >-
          Deduces la tensión y el giro de una sección cerrada y dimensionas
          con ellos un tubo cualquiera sin mirar la resolución.
      - id: el-centro-de-torsion
        titulo: El centro de torsión
        aprendes: >-
          A situar el centro de torsión de una sección abierta de pared
          delgada con el flujo de la cortante.
        teoria:
          tema: t12-torsion
          apartado: el-centro-de-torsión
        ejercicios:
          - id: exerm1718-ext-3-donde-cargar-la-viga-de-seccion-en-c
            nota: >-
              La cuestión 3 de la extraordinaria de junio de 2018, de 1 punto:
              una viga de sección en C, y dónde hay que cargarla.
        dominio: >-
          Sitúas el centro de torsión de una sección en C con las cotas de la
          figura, sin mirar la resolución.
    falta:
      - >-
        Los ejercicios de clase del tema 12 (12.1 a 12.8) y sus cuestiones de
        autoevaluación no están en el sitio. Los escalones de la sección
        circular, de la cerrada y del centro de torsión empiezan en cuestiones
        de examen, y el del centro de torsión no tiene más que una.

  - id: hiperestatica
    titulo: Las vigas hiperestáticas, un problema en seis de las siete
    pide: >-
      Una viga con más enlaces de los que el equilibrio resuelve, con un apoyo
      que desciende, una rótula, un muelle o varios vanos: la incógnita, los
      diagramas y a veces la sección. Y una vez, los tres momentos deducidos.
    porque: >-
      Cae en seis de las siete extraordinarias: seis preguntas y 8,5 de los
      54,8 puntos de la parte 2. Cinco son problemas de 1,5 puntos, y la
      sexta, la deducción de los tres momentos, de 2018. Dos de los problemas
      son vigas continuas. La escalera larga está en
      [el bloque de vigas hiperestáticas de la ruta del segundo parcial](/road-to-ingenieria/elasticidad-resistencia/preparar/2par/#hiperestatica).
    invariante:
      anios: 6
      fuente: >-
        Contado pregunta a pregunta: 2016-2017 (P2), 2017-2018 (T2),
        2018-2019 (P3), 2019-2020 (P2), 2020-2021 (P3) y 2021-2022 (P2). Los
        puntos son los impresos junto a cada pregunta.
    apunte:
      texto: parte 2 · en seis de siete — 8,5 de los 54,8 puntos
      tono: nota
    dominio: >-
      Ante una viga hiperestática cuentas las incógnitas que sobran, quitas
      sus enlaces, escribes lo que cada uno no dejaba hacer con la tabla de
      vigas o con los tres momentos, y de las incógnitas sacas los
      diagramas.
    revisado: '2026-10-23'
    escalones:
      - id: quitar-un-enlace
        titulo: Quitar un enlace y pedir lo que hacía
        aprendes: >-
          A contar las incógnitas que sobran, quitar un enlace y sustituirlo
          por su fuerza, y escribir lo que ese enlace no dejaba hacer con la
          tabla de vigas.
        teoria:
          tema: t11-flexion-hiperestatica
          apartado: un-solo-tramo-quitar-un-enlace-y-pedir-lo-que-hacía
          nota: >-
            Las flechas y los giros salen de la
            [tabla de vigas elementales del tema 10](/road-to-ingenieria/elasticidad-resistencia/t10-flexion-deformaciones/#integrar-la-ecuación-tramo-a-tramo),
            que el apartado enlaza: no hace falta haber hecho antes el bloque
            de la elástica, que va más abajo.
        ejercicios:
          - id: ejerm11-la-viga-empotrada-y-apoyada
            incrustado: true
            nota: >-
              El ejemplo del tema: una viga empotrada y apoyada con una carga
              uniforme, de la reacción al flector máximo del vano.
          - id: exerm1819-ext-7-la-viga-empotrada-con-el-apoyo-que-desciende
            nota: >-
              El problema 3 de la extraordinaria de junio de 2019, de 1,5
              puntos: una viga empotrada con un apoyo que desciende. Pide la
              reacción de ese apoyo.
          - id: exerm1617-ext-6-la-viga-empotrada-con-rotula-en-c
            nota: >-
              El problema 2 de la extraordinaria de junio de 2017, de 1,5
              puntos: una viga empotrada, apoyada en dos puntos y con una
              rótula. Pide los diagramas, los dos giros de la rótula y su
              descenso.
          - id: exerm2021-ext-7-la-viga-unida-a-un-muelle
            nota: >-
              El problema 3 de la extraordinaria de febrero de 2021, de 1,5
              puntos: una viga empotrada y apoyada cuyo voladizo se fuerza
              hasta un muelle. Pide la fuerza del muelle, los diagramas y la
              constante con la que las dos alas tienen la misma compresión
              máxima.
        dominio: >-
          Ante una viga con apoyos, muelles o rótulas dices cuántas incógnitas
          sobran, eliges qué quitar y escribes cada condición antes de
          calcular nada.
      - id: los-tres-momentos
        titulo: Los tres momentos, en una viga continua
        aprendes: >-
          A deducir la ecuación de los tres momentos y a aplicarla a una viga
          continua con voladizo, empotramiento o resorte, hasta sus diagramas.
        teoria:
          tema: t11-flexion-hiperestatica
          apartado: vigas-continuas-el-teorema-de-los-tres-momentos
          nota: >-
            El apartado trae un ejemplo de dos vanos resuelto.
        ejercicios:
          - id: exerm1920-2par-4-la-ecuacion-de-los-tres-momentos
            nota: >-
              La cuestión 4 de la segunda parte de enero de 2020, de 1 punto:
              la ecuación de los tres momentos, deducida.
          - id: exerm1718-ext-2-la-ecuacion-de-los-tres-momentos
            nota: >-
              La cuestión 2 de la extraordinaria de junio de 2018, de 1 punto:
              la misma deducción, resuelta con una viga continua empotrada en un
              extremo. La deducción es la de arriba, y sirve de repaso.
          - id: exerm1920-ext-6-la-viga-continua-y-la-seccion-en-u
            nota: >-
              El problema 2 de la extraordinaria de enero de 2020, de 1,5
              puntos: una viga continua de tres tramos con dos cargas
              repartidas, por
              [funciones de singularidad](/road-to-ingenieria/elasticidad-resistencia/t10-flexion-deformaciones/#funciones-de-singularidad-una-sola-ley-para-toda-la-viga),
              del tema 10, y no por los tres momentos, porque así lo pide el
              enunciado. Acaba en el espesor de su sección en U.
          - id: exerm2122-ext-6-la-viga-continua-con-un-resorte-en-b
            nota: >-
              El problema 2 de la extraordinaria de febrero de 2022, de 1,5
              puntos: los tres momentos con un voladizo, un empotramiento y un
              resorte. Pide además un desplazamiento.
        dominio: >-
          Escribes la ecuación de los tres momentos de memoria, con cada
          distancia en su sitio, y la aplicas a una viga con voladizo,
          empotramiento o resorte hasta los diagramas.
    falta:
      - >-
        Los ejercicios de clase del tema 11 (11.1 a 11.6) y sus cuestiones de
        autoevaluación no están en el sitio. El primer escalón sube del único
        ejemplo del tema a los problemas de examen, y el de los tres momentos
        empieza en una cuestión de examen. Es el mismo hueco que declaran las
        rutas del segundo parcial y de la final.

  - id: seccion
    titulo: La sección que trabaja, en L o con la fuerza fuera del eje
    pide: >-
      Una viga con su sección de alas desiguales o en L, sus diagramas y la
      tensión máxima, o una pieza cargada fuera de su eje, como problema o
      como cuestión.
    porque: >-
      Cae en tres de las siete extraordinarias: cinco preguntas y 6,5 de los
      54,8 puntos de la parte 2. La de 2023 trajo tres, el eslabón de una
      cadena, el pilar con dos galgas y la viga con una sección de pared
      delgada; las otras dos son la viga rígida en T de 2018 y la viga con
      sección en L de 2019. La tensión máxima de una sección cierra además
      algunos problemas de vigas hiperestáticas, que cuentan en su bloque.
      La escalera larga está en
      [el bloque de la sección de la ruta del segundo parcial](/road-to-ingenieria/elasticidad-resistencia/preparar/2par/#seccion).
    invariante:
      anios: 3
      fuente: >-
        Contado pregunta a pregunta: 2017-2018 (P2), 2018-2019 (P2) y
        2022-2023 (T2, T3 y P3). Los puntos son los impresos junto a cada
        pregunta.
    apunte:
      texto: parte 2 · en tres de siete — 6,5 de los 54,8 puntos
      tono: nota
    dominio: >-
      Sacas el centro de gravedad, las inercias y la tensión máxima de una
      sección en función de su espesor, en una viga en L y en una pieza
      cargada fuera de su eje.
    revisado: '2026-10-23'
    escalones:
      - id: la-seccion-en-l
        titulo: La sección en L, o de alas desiguales
        aprendes: >-
          A sacar el centro de gravedad y las inercias de una sección en L o
          de alas desiguales, la ley de tensiones de una viga cargada en un
          plano y la tensión máxima con su punto.
        teoria:
          tema: t09-flexion-tensiones
          apartado: ejes-principales-la-fórmula-de-navier
          nota: >-
            Las inercias de una sección compuesta se dan por sabidas. Están
            en
            [las superficies planas de Mecánica Aplicada](/road-to-ingenieria/mecanica-aplicada/t02-geometria-de-masas/#superficies-planas-momentos-y-productos-de-inercia).
        ejercicios:
          - id: ejerm9-la-viga-en-t
            incrustado: true
            nota: >-
              El ejemplo del tema: una viga biapoyada de sección en T, del
              centro de gravedad a las tensiones máximas, con las cuentas que
              usan las de abajo.
          - id: exerm1314-1par-7-la-viga-con-carga-triangular-y-seccion-en-l
            nota: >-
              El ejercicio 3 del primer parcial de 2013-2014, de 3 puntos: una
              viga apoyada con carga triangular, sus diagramas y el espesor de
              una sección en L.
          - id: exerm1819-ext-6-la-viga-con-voladizo-y-seccion-en-l
            nota: >-
              El problema 2 de la extraordinaria de junio de 2019, de 1,5
              puntos: una viga con voladizo y sección en L, y la luz con la que
              la tracción llega a 200 MPa. Su primer paso para la sección es
              el de arriba, y sirve de repaso.
          - id: exerm1819-2par-6-la-viga-con-dos-rotulas-y-la-seccion-de-alas-desiguales
            nota: >-
              El problema 2 de la segunda parte de enero de 2019, de 2 puntos,
              que cayó igual en la final de ese día: una viga con dos rótulas y
              un par, y una sección de alas desiguales. Pide la ecuación de las
              tensiones, el eje neutro y las tensiones extremas.
          - id: exerm2223-ext-6-la-viga-con-rotula-y-un-par
            nota: >-
              El problema 3 de la extraordinaria de febrero de 2023, de 1,5
              puntos: una viga con rótula, una carga repartida y un par, y una
              sección de pared delgada. Pide las tensiones normales extremas y
              la tangencial máxima. Su primer paso es el de la de junio de
              2019, y sirve de repaso.
        dominio: >-
          Sacas el eje neutro de una sección en L o de alas desiguales y das
          la tensión máxima en el punto que de verdad la lleva.
      - id: la-fuerza-fuera-del-eje
        titulo: La fuerza que no pasa por el eje de la pieza
        aprendes: >-
          A sacar los esfuerzos de la sección que importa cuando una fuerza se
          aplica fuera del eje, a sumar sus tensiones con su signo y a decir
          dónde queda el eje neutro.
        teoria:
          tema: t09-flexion-tensiones
          apartado: flexión-compuesta-y-fuerza-excéntrica
        ejercicios:
          - id: exerm1617-2par-2-el-poste-de-aluminio-con-la-fuerza-inclinada
            nota: >-
              La cuestión 2 de la segunda parte de enero de 2017, de 1 punto:
              un poste tubular con una fuerza inclinada en su cara exterior. No
              ha caído en ninguna extraordinaria; aquí va de peldaño.
          - id: exerm2223-ext-2-el-eslabon-abierto-de-una-cadena
            nota: >-
              La cuestión 2 de la extraordinaria de febrero de 2023, de 1
              punto: el eslabón abierto de una cadena, las tensiones extremas
              de su tramo recto y su eje neutro.
          - id: exerm2223-ext-3-el-pilar-con-dos-galgas
            nota: >-
              La cuestión 3 de la extraordinaria de febrero de 2023, de 1
              punto: un pilar con dos galgas, del tema 3, y las dos fuerzas que
              las cargan.
          - id: exerm1718-ext-6-la-viga-rigida-en-t-sujeta-por-la-barra-1
            nota: >-
              El problema 2 de la extraordinaria de junio de 2018, de 1,5
              puntos: una viga rígida de sección en T, apoyada en un punto y
              sujeta por una barra inclinada. Pide los diagramas, la longitud
              con la que la tracción llega al límite y el radio de la barra.
        dominio: >-
          Ante una fuerza fuera del eje escribes los esfuerzos de la sección
          que importa, sumas las tensiones con su signo y dices dónde queda el
          eje neutro.
    falta:
      - >-
        La sección en L no tiene delante ningún ejemplo de su forma; el del
        tema es una viga en T. La fuerza fuera del eje empieza en ejercicios
        de examen.
        Los ejercicios de clase del tema 9 (9.1 a 9.8) y sus cuestiones de
        autoevaluación no están en el sitio.
      - >-
        La prosa del tema 9 no explica el centro de gravedad, las inercias ni
        el producto de inercia de una sección compuesta, que usan todos estos
        problemas. Se dan por sabidos de Mecánica Aplicada, y el primer
        escalón lo enlaza.

  - id: pandeo
    titulo: Pandeo, una cuestión de 1 punto en cuatro de las siete
    pide: >-
      Una cuestión de 1 punto: la carga crítica de Euler, deducida o de una
      columna dada, o la compresión excéntrica de una columna esbelta,
      deducida.
    porque: >-
      Cae en cuatro de las siete extraordinarias, siempre como cuestión de 1
      punto: cuatro preguntas y 4 de los 54,8 puntos de la parte 2. Dos son
      la compresión excéntrica, con el mismo enunciado en 2018 y en 2021, y
      dos, la carga crítica de Euler, la de una columna en C en 2017 y la
      deducción en 2022, que había caído en la final de enero de 2021. En la
      de 2023 no cayó. La escalera larga está en
      [el bloque de pandeo de la ruta del segundo parcial](/road-to-ingenieria/elasticidad-resistencia/preparar/2par/#pandeo).
    invariante:
      anios: 4
      fuente: >-
        Contado pregunta a pregunta: 2016-2017 (T4), 2017-2018 (T4),
        2020-2021 (T4) y 2021-2022 (T4). Los puntos son los impresos junto a
        cada pregunta.
    apunte:
      texto: parte 2 · en cuatro de siete — 4 de los 54,8 puntos
      tono: neutro
    dominio: >-
      Deduces la carga crítica de Euler y el desplazamiento del extremo libre
      de una columna con la carga excéntrica, y sabes qué inercia y qué
      longitud entran en cada fórmula.
    revisado: '2026-10-23'
    escalones:
      - id: la-carga-critica
        titulo: La carga crítica de Euler
        aprendes: >-
          A deducir la carga crítica de una columna biarticulada desde el
          equilibrio, y a aplicarla con la inercia que manda.
        teoria:
          tema: t14-pandeo
          apartado: la-carga-crítica-de-euler
        ejercicios:
          - id: exerm2021-ord-4-la-carga-critica-de-euler
            nota: >-
              La cuestión 4 de la extraordinaria de febrero de 2022, de 1
              punto, que había caído igual en la final de enero de 2021: la
              deducción, resuelta con un ejemplo nuestro.
          - id: exerm1617-ext-4-la-carga-critica-de-la-columna-en-c
            nota: >-
              La cuestión 4 de la extraordinaria de junio de 2017, de 1 punto:
              la carga crítica de una columna de sección en C, con la fórmula
              dada.
        dominio: >-
          Deduces la carga crítica de la biarticulada y eliges la inercia que
          manda en una sección con un solo eje de simetría.
      - id: la-compresion-excentrica
        titulo: La compresión excéntrica de una columna esbelta
        aprendes: >-
          A plantear la elástica de una columna esbelta con la carga fuera del
          eje, cerrar sus constantes y sacar el desplazamiento del extremo
          libre y el flector máximo.
        teoria:
          tema: t14-pandeo
          apartado: compresión-excéntrica-de-columnas-esbeltas
        ejercicios:
          - id: ejerm14-la-columna-con-la-carga-desplazada
            incrustado: true
            nota: >-
              El ejemplo del tema: una columna empotrada y libre con la carga
              desplazada, de la carga crítica al desplazamiento del extremo.
          - id: exerm1617-2par-4-el-desplazamiento-del-extremo-libre-en-la-compresion-excentrica
            nota: >-
              La cuestión 4 de la segunda parte de enero de 2017, de 1 punto,
              que cayó igual en la final de ese día: la deducción del
              desplazamiento del extremo libre.
          - id: exerm2021-ext-4-compresion-excentrica-de-columnas-esbeltas
            nota: >-
              La cuestión 4 de las extraordinarias de junio de 2018 y de
              febrero de 2021, de 1 punto en las dos: la misma deducción,
              resuelta con otro ejemplo. La deducción es la de arriba, y sirve
              de repaso.
        dominio: >-
          Deduces el desplazamiento y el flector máximo de la empotrada y libre
          con la carga excéntrica, y dices qué longitud y qué inercia van en
          cada fórmula.
    falta:
      - >-
        El tema 14 no tiene ejercicios de clase en el material, y sus
        cuestiones de autoevaluación no están en el sitio. El escalón de la
        carga crítica empieza en la cuestión de examen.

  - id: barras
    titulo: Barras y nudos, del proceso de deformación a la celosía
    pide: >-
      Una cuestión de 1 punto con barras que se cargan o se montan a la
      fuerza, una deducción del proceso de deformación de una barra, o un
      problema de 1,5 puntos con una celosía: los axiles y el desplazamiento
      de un nudo.
    porque: >-
      Cae en cuatro de las siete extraordinarias: cuatro preguntas y 3,9 de
      los 54,8 puntos de la parte 2. Son la celosía de cinco barras de 2017,
      las tres barras con un error de montaje de 2020, la barra entre dos
      apoyos de 2021 y el proceso de deformación de 2023. Hasta 2022-2023 el
      tema 8 entraba en el primer parcial; este curso es de la parte 2, y su
      bloque largo está en
      [la ruta del segundo parcial](/road-to-ingenieria/elasticidad-resistencia/preparar/2par/#barras).
    invariante:
      anios: 4
      fuente: >-
        Contado pregunta a pregunta: 2016-2017 (P3), 2019-2020 (T2),
        2020-2021 (T2) y 2022-2023 (T1e). Los puntos son los impresos junto a
        cada pregunta. La cuestión 1 de 2022-2023 vale 2 puntos y no los
        reparte entre sus cinco apartados: aquí cuenta 0,4 cada una.
    apunte:
      texto: parte 2 · en cuatro de siete — 3,9 de los 54,8 puntos
      tono: neutro
    dominio: >-
      Ante unas barras que llegan a un nudo cuentas incógnitas y ecuaciones,
      escribes la compatibilidad con el proceso de deformación, con la
      temperatura o un error de montaje dentro, y sacas los axiles y el
      desplazamiento del nudo.
    revisado: '2026-10-23'
    escalones:
      - id: la-barra-entre-dos-apoyos
        titulo: Una barra entre dos apoyos
        aprendes: >-
          A sacar los axiles de una barra que la estática no resuelve, sujeta
          por sus dos extremos, con cargas o con un cambio de temperatura.
        teoria:
          tema: t08-esfuerzo-axial
          apartado: barras-entre-paredes-holguras-y-muelles
        ejercicios:
          - id: ejerm8-la-barra-entre-dos-paredes
            incrustado: true
            nota: >-
              El ejemplo del tema: una barra de latón entre dos paredes, que se
              calienta y se enfría.
          - id: ejerm8-cu1-la-hipotesis-de-bernoulli
            nota: >-
              Cuestión 1 de autoevaluación del tema 8: la hipótesis de
              Bernoulli, y lo que se sigue de ella para las tensiones de una
              barra.
          - id: exerm2021-ext-2-la-barra-circular-entre-dos-apoyos
            nota: >-
              La cuestión 2 de la extraordinaria de febrero de 2021, de 1
              punto: una barra circular entre dos apoyos, con una carga en el
              voladizo y otra entre los apoyos. Pide el diámetro. Su primer
              paso es el del ejemplo del escalón, ahora con cargas, y sirve de
              repaso.
        dominio: >-
          Escribes la compatibilidad de una barra sujeta por los dos extremos
          con cargas y temperatura, y sacas sus axiles y el diámetro que
          piden.
      - id: el-proceso-de-deformacion
        titulo: El proceso de deformación, y los nudos con varias barras
        aprendes: >-
          A seguir los pasos con que una barra pasa de su posición a la
          deformada, y a relacionar con ellos los alargamientos de las barras
          que llegan a un nudo con su desplazamiento.
        teoria:
          tema: t08-esfuerzo-axial
          apartado: el-proceso-de-deformación-de-una-barra
        ejercicios:
          - id: ejerm8-cla1-el-nudo-de-dos-barras-en-la-pared
            nota: >-
              La propuesta A1 de clase: un nudo sujeto a la pared por dos
              barras, sus axiles y las dos componentes de su desplazamiento.
          - id: ejerm8-cl8-3-tres-barras-en-c-con-la-2-calentada
            nota: >-
              El 8.3 de clase: un nudo con tres barras y una de ellas
              calentada, con la parte del desplazamiento que se debe a la
              temperatura.
          - id: exerm1516-1par-3-el-proceso-de-deformacion-de-una-barra
            nota: >-
              La parte b de la pregunta 3 de teoría del primer parcial de
              2015-2016, de 0,5 puntos: los pasos del proceso y la fórmula del
              alargamiento.
          - id: exerm2223-ext-1-el-proceso-de-deformacion-de-una-barra
            nota: >-
              La parte e) de la cuestión 1 de la extraordinaria de febrero de
              2023: la pregunta de arriba con otras palabras, resuelta con otro
              ejemplo. La deducción es la de arriba, y sirve de repaso.
          - id: exerm1314-1par-6-la-barra-calentada-y-el-apoyo-movil
            nota: >-
              El ejercicio 2 del primer parcial de 2013-2014, de 1,5 puntos:
              tres barras que llegan a un nudo sobre un apoyo móvil, y una de
              ellas se calienta.
          - id: exerm1920-ext-2-las-tres-barras-y-el-error-de-montaje
            nota: >-
              La cuestión 2 de la extraordinaria de enero de 2020, de 1 punto:
              tres barras unidas en un nudo y un hueco que se cierra al
              montarlas, sin cargas.
          - id: exerm1617-ext-7-la-celosia-de-cinco-barras
            nota: >-
              El problema 3 de la extraordinaria de junio de 2017, de 1,5
              puntos: una celosía cuadrada de cinco barras, sus axiles y el
              desplazamiento del apoyo móvil.
        dominio: >-
          Escribes el alargamiento de cada barra a partir del desplazamiento
          del nudo, con la temperatura o el error de montaje dentro, y
          resuelves los axiles y el desplazamiento.
    falta:
      - >-
        El escalón del proceso de deformación no tiene un ejemplo propio
        delante, y empieza en dos ejercicios de clase.

  - id: flexion-y-torsion
    titulo: Flexión y torsión a la vez, el punto crítico
    pide: >-
      Un problema de 1,5 puntos: una pieza cargada en varios planos, sus
      esfuerzos y las tensiones principales de su punto más cargado, sin las
      de las cortantes.
    porque: >-
      Cae en dos de las siete extraordinarias, siempre como problema: dos
      preguntas y 3 de los 54,8 puntos de la parte 2, la pieza con un brazo
      soldado de 2017 y el voladizo en I de 2020. Las rutas de los parciales y
      de la final no tienen este bloque. Aquí va aparte de la torsión porque
      se prepara de otra manera: no es un eje ni una pared delgada, sino todas
      las tensiones de la sección sumadas en un punto. Con la torsión sumaría
      13 puntos.
    invariante:
      anios: 2
      fuente: >-
        Contado pregunta a pregunta: 2016-2017 (P1) y 2019-2020 (P3). Los
        puntos son los impresos junto a cada pregunta. Las dos son del tema
        12, y aquí cuentan aparte de la torsión.
    apunte:
      texto: parte 2 · en dos de siete — 3 de los 54,8 puntos
      tono: neutro
    dominio: >-
      Ante una pieza cargada en varios planos dibujas los diagramas de todos
      sus esfuerzos, encuentras la sección y el punto críticos y das sus
      tensiones principales.
    revisado: '2026-10-23'
    escalones:
      - id: el-punto-critico
        titulo: El punto crítico de una pieza a flexión y torsión
        aprendes: >-
          A sumar en un punto de la sección la tensión normal y la tangencial
          de cada esfuerzo, a buscar el punto donde peor se combinan y a dar
          sus tensiones principales.
        teoria:
          tema: t12-torsion
          apartado: flexión-y-torsión
        ejercicios:
          - id: exerm1920-ext-7-el-voladizo-en-i-con-tres-fuerzas
            nota: >-
              El problema 3 de la extraordinaria de enero de 2020, de 1,5
              puntos: un voladizo de sección en I con tres fuerzas de 10 kN.
              Pide los diagramas de los cuatro esfuerzos y la tensión principal
              máxima, sin las tensiones de las cortantes.
          - id: exerm1617-ext-5-la-roseta-en-la-pieza-del-brazo-soldado
            nota: >-
              El problema 1 de la extraordinaria de junio de 2017, de 1,5
              puntos: una pieza circular con un brazo soldado y una roseta de
              galgas, del tema 3. Pide las lecturas de las galgas y las
              tensiones principales del punto crítico. Su primer paso es el de
              arriba, con otra fuerza, y sirve de repaso.
        dominio: >-
          Dibujas los diagramas de una pieza cargada en varios planos, eliges
          la sección y el punto críticos y das sus tensiones principales sin
          mirar la resolución.
    falta:
      - >-
        El apartado de flexión y torsión del tema 12 no tiene ejemplo ni
        ejercicio de práctica en el sitio, y el escalón empieza en los dos
        problemas de examen.

  - id: cuestion-de-flexion
    titulo: El flujo cortante, la misma cuestión dos veces
    pide: >-
      Una cuestión de 1 punto: el teorema del flujo cortante, enunciado y
      deducido, siempre con el mismo texto.
    porque: >-
      Cae en dos de las siete extraordinarias, las de junio de 2019 y febrero
      de 2022: dos preguntas y 2 de los 54,8 puntos de la parte 2. Las dos son
      el mismo enunciado, que ha caído además en cuatro segundas partes y tres
      finales de enero. Se prepara con una deducción, la misma que en
      [el bloque de la ruta del segundo parcial](/road-to-ingenieria/elasticidad-resistencia/preparar/2par/#cuestion-de-flexion).
    invariante:
      anios: 2
      fuente: >-
        Contado pregunta a pregunta: 2018-2019 (T2) y 2021-2022 (T3). Los
        puntos son los impresos junto a cada pregunta.
    apunte:
      texto: parte 2 · en dos de siete — y es siempre la misma
      tono: neutro
    dominio: >-
      Escribes la deducción del flujo cortante con su figura y sacas con
      ella la cortante máxima de un rectángulo y el flujo entre las piezas de
      una viga compuesta.
    revisado: '2026-10-23'
    escalones:
      - id: el-flujo-cortante
        titulo: El teorema del flujo cortante
        aprendes: >-
          A enunciar y deducir el teorema del flujo cortante con su figura, y a
          sacar con él la tensión cortante de una sección y el flujo que tienen
          que llevar unos tornillos.
        teoria:
          tema: t09-flexion-tensiones
          apartado: el-teorema-del-flujo-cortante
        ejercicios:
          - id: exerm2021-ord-3-el-teorema-del-flujo-cortante
            incrustado: true
            nota: >-
              La cuestión 2 de la extraordinaria de junio de 2019 y la 3 de la
              de febrero de 2022, de 1 punto en las dos, que es la 3 de la final
              de enero de 2021, siempre con el mismo enunciado. Está resuelta
              con un ejemplo nuestro en una sección rectangular.
          - id: exerm2021-ord-8-la-viga-con-platabandas-atornilladas
            nota: >-
              El problema 4 de la final de enero de 2021, de 1,5 puntos: una
              viga con rótula y una sección en I con platabandas atornilladas,
              que acaba en la separación de los tornillos con el flujo de las
              [vigas compuestas](/road-to-ingenieria/elasticidad-resistencia/t09-flexion-tensiones/#vigas-compuestas).
              No ha caído en ninguna extraordinaria; aquí va de práctica.
        dominio: >-
          Escribes la deducción con su figura, dices de qué equilibrio sale y
          la aplicas a una sección rectangular y a una viga compuesta.
    falta:
      - >-
        Las cuestiones de autoevaluación del tema 9 no están en el sitio. El
        escalón empieza en la cuestión de examen, con la deducción en la prosa
        delante.

  - id: flechas
    titulo: La ecuación de la elástica, deducida
    pide: >-
      Una cuestión de 1 punto: la ecuación diferencial de la elástica,
      deducida, con su signo y sus hipótesis.
    porque: >-
      Cae en dos de las siete extraordinarias, en 2019 y en 2021, casi con el
      mismo enunciado y siempre como cuestión: dos preguntas y 2 de los 54,8
      puntos de la parte 2. La tabla de vigas del tema 10 entra además en
      cada viga hiperestática, y la viga continua de 2020 se resuelve con
      funciones de singularidad. La escalera larga, con la viga conjugada,
      está en
      [el bloque de flechas de la ruta del segundo parcial](/road-to-ingenieria/elasticidad-resistencia/preparar/2par/#deformaciones).
    invariante:
      anios: 2
      fuente: >-
        Contado pregunta a pregunta: 2018-2019 (T3) y 2020-2021 (T3). Los
        puntos son los impresos junto a cada pregunta.
    apunte:
      texto: parte 2 · en dos de siete — y no desde 2021
      tono: neutro
    dominio: >-
      Deduces la ecuación de la elástica con su signo, dices qué hipótesis la
      hace aproximada y la integras en un voladizo.
    revisado: '2026-10-23'
    escalones:
      - id: la-ecuacion-de-la-elastica
        titulo: La ecuación de la elástica, deducida
        aprendes: >-
          A deducir la ecuación diferencial de la elástica, con su signo y las
          hipótesis con que vale.
        teoria:
          tema: t10-flexion-deformaciones
          apartado: de-la-curvatura-a-la-ecuación-de-la-elástica
        ejercicios:
          - id: exerm1819-ext-3-la-ecuacion-diferencial-de-la-curva-elastica
            nota: >-
              La cuestión 3 de la extraordinaria de junio de 2019, de 1 punto:
              la deducción, con un voladizo nuestro integrado con ella.
          - id: exerm2021-ext-3-la-ecuacion-diferencial-de-la-elastica
            nota: >-
              La cuestión 3 de la extraordinaria de febrero de 2021, de 1
              punto: la misma con «Deducir la» delante, resuelta con otro
              ejemplo. La deducción es la de arriba, y sirve de repaso.
        dominio: >-
          Escribes la deducción con el signo justificado y dices qué hipótesis
          la hace aproximada.
    falta:
      - >-
        Los ejercicios de clase del tema 10 (10.1 a 10.6) y sus cuestiones de
        autoevaluación no están en el sitio. El escalón empieza en la cuestión
        de examen, con la deducción en la prosa delante.

  - id: depositos
    titulo: Depósitos de pared delgada, con una roseta
    pide: >-
      Una cuestión de 1 punto: un depósito con una roseta de galgas pegada a
      su pared, y de sus lecturas, los tensores y el cambio de espesor.
    porque: >-
      Cae solo en la extraordinaria de febrero de 2021: una pregunta y 1 de
      los 54,8 puntos de la parte 2. Va el último de la parte por eso. Junta
      el tema 8 con las galgas del tema 3 y Hooke del tema 4, como la
      cuestión del depósito con dos galgas del primer parcial de 2019-2020,
      que va en el escalón. El bloque largo está en
      [la ruta del segundo parcial](/road-to-ingenieria/elasticidad-resistencia/preparar/2par/#depositos).
    invariante:
      anios: 1
      fuente: >-
        Contado pregunta a pregunta: 2020-2021 (T1). Los puntos son los
        impresos junto a cada pregunta.
    apunte:
      texto: parte 2 · solo en la de febrero de 2021 — 1 de los 54,8 puntos
      tono: neutro
    dominio: >-
      Escribes las dos tensiones de la pared de un depósito esférico o
      cilíndrico, pasas de unas galgas a los tensores con Hooke y das el
      cambio de espesor.
    revisado: '2026-10-23'
    escalones:
      - id: el-deposito
        titulo: El depósito y sus galgas
        aprendes: >-
          A deducir las tensiones de la pared de un depósito de revolución con
          el equilibrio de un elemento, y a combinarlas con Hooke para leer
          unas galgas o sacar el cambio de espesor.
        teoria:
          tema: t08-esfuerzo-axial
          apartado: depósitos-y-anillos-de-pared-delgada
        ejercicios:
          - id: ejerm8-cu4-depositos-y-anillos
            nota: >-
              Cuestión 4 de autoevaluación del tema 8: la ecuación del depósito
              y los anillos, con un anillo nuestro con presión interior y dos
              anillos encajados.
          - id: exerm1718-1par-4-el-deposito-de-revolucion
            nota: >-
              La cuestión 4 del primer parcial de 2017-2018, de 1 punto: la
              ecuación de un depósito de revolución cualquiera, deducida. El
              cilindro y la esfera salen después, como dos casos.
          - id: exerm1920-1par-4-el-deposito-con-dos-galgas
            incrustado: true
            nota: >-
              La cuestión 4 del primer parcial de 2019-2020, de 1 punto: una
              galga axial y otra a 60°, y de ellas la deformación
              circunferencial, ν y la presión.
          - id: exerm2021-ext-1-el-deposito-esferico-y-la-roseta
            nota: >-
              La cuestión 1 de la extraordinaria de febrero de 2021, de 1
              punto: un depósito esférico con una roseta de tres lecturas
              iguales. Pide los tensores de la superficie exterior y el cambio
              de espesor.
        dominio: >-
          Deduces las dos tensiones de la pared con su dibujo, y de unas
          galgas sacas los tensores, la presión o el cambio de espesor.
    falta:
      - >-
        El tema 8 no tiene un ejemplo resuelto de depósitos, y el escalón
        empieza en la cuestión de autoevaluación.

  # ─────────────────────────────────────────────────────────────────────
  # Los dos de cierre, para las dos partes
  # ─────────────────────────────────────────────────────────────────────
  - id: simulacro
    titulo: El simulacro, con una extraordinaria entera
    apunte:
      texto: de una sentada, y sin la solución al lado
      tono: marco
    pide: >-
      Las dos partes de una extraordinaria, de una sentada, o la parte que te
      toque si tienes la otra liberada.
    porque: >-
      Los bloques de arriba entrenan cada hueco por separado, y la
      extraordinaria no va por separado: salta de una deducción de un punto a
      un pórtico de un punto y medio, y de la elasticidad a la resistencia en
      la misma hoja. Estas son las siete de la ventana, completas y con su
      resolución detrás. Ninguna viene partida en dos como la de este curso,
      así que cada nota dice qué preguntas de la hoja son de cada parte. La
      parte 1 pesa en ellas de 1 a 3,5 de los 10 puntos. La final de enero de
      2026 ya venía partida así, y está en el simulacro de la ruta de la
      final.
    dominio: >-
      Hacer una extraordinaria completa de una sentada sin abrir la
      resolución, y después contar cuántos apartados habrías dado por buenos
      sin serlo.
    material:
      - tipo: examen
        curso: '2022-2023'
        convocatoria: extraordinaria
        nota: >-
          De la parte 1 son las preguntas 1a, 1b, 1c y 4 de la hoja; de la
          parte 2, las 1d, 1e, 2, 3, 5, 6 y 7. La más reciente, y la única
          con tres cuestiones, porque la 1 tiene cinco apartados de cinco
          temas.
          Trae además el eslabón de una cadena, el pilar con dos galgas, la
          galga a 60°, la barra quebrada con un tirante, la viga con rótula y
          el eje con palancas y tirantes.
      - tipo: examen
        curso: '2021-2022'
        convocatoria: extraordinaria
        nota: >-
          De la parte 1 son las preguntas 1, 2 y 5 de la hoja; de la parte 2,
          las 3, 4, 6, 7 y 8. Cauchy, las tensiones a partir de las
          deformaciones, el flujo cortante, Euler, las dos galgas a 15°, la
          viga continua con un resorte, la barra con un tirante y el eje sobre
          dos tirantes. Sus cuatro cuestiones habían caído antes, en primeros
          parciales y en la final de enero de 2021.
      - tipo: examen
        curso: '2020-2021'
        convocatoria: extraordinaria
        nota: >-
          De la parte 1 es la pregunta 5 de la hoja; de la parte 2, las 1, 2,
          3, 4, 6, 7 y 8. El depósito esférico con una roseta, la barra entre
          dos apoyos, la ecuación de la elástica, la compresión excéntrica, la
          chapa romboidal, el eje empotrado en los dos extremos, la viga unida
          a un muelle y la estructura en el espacio con una barra.
      - tipo: examen
        curso: '2019-2020'
        convocatoria: extraordinaria
        nota: >-
          De la parte 1 son las preguntas 1, 4 y 5 de la hoja; de la parte 2,
          las 2, 3, 6, 7 y 8. El campo de desplazamientos, las tres barras con
          un error de montaje, la sección cerrada, Cauchy, la roseta de tres
          galgas, la viga continua con la sección en U, el voladizo en I con
          tres fuerzas y el pórtico con un pilar.
      - tipo: examen
        curso: '2018-2019'
        convocatoria: extraordinaria
        nota: >-
          De la parte 1 es la pregunta 5 de la hoja; de la parte 2, las 1, 2,
          3, 4, 6, 7 y 8. La rebanada de la pieza recta, el flujo cortante, la
          ecuación de la elástica, el tubo cuadrado a torsión, la galga a 45°,
          la viga con sección en L, el apoyo que desciende y el pórtico con
          dos apoyos fijos.
      - tipo: examen
        curso: '2017-2018'
        convocatoria: extraordinaria
        nota: >-
          De la parte 1 es la pregunta 5 de la hoja; de la parte 2, las 1, 2,
          3, 4, 6, 7 y 8. La rebanada de la pieza curva, los tres momentos,
          dónde cargar una viga en C, la compresión excéntrica, el bloque que
          levanta el cuerpo de encima, la viga rígida en T, el eje escalonado
          y la estructura en el espacio con una barra.
      - tipo: examen
        curso: '2016-2017'
        convocatoria: extraordinaria
        nota: >-
          De la parte 1 es la pregunta 1 de la hoja; de la parte 2, las 2, 3,
          4, 5, 6, 7 y 8. El criterio de Mohr, la torsión de la sección
          circular, la barra quebrada que no deja moverse un punto, la columna
          en C, la pieza con un brazo soldado, la viga con rótula, la celosía
          de cinco barras y el pórtico atado por una barra.
    revisado: '2026-10-23'

  - id: formulario
    titulo: Lo que hay que llevar sabido
    apunte:
      texto: repaso, no aprendizaje
      tono: marco
    pide: >-
      Cauchy, la fórmula de la galga, Hooke en los dos sentidos, los
      criterios de fallo, la rebanada, la coenergía, los tres momentos, la
      torsión cerrada, la elástica y Euler, de memoria.
    porque: >-
      Va el último porque es repaso, no aprendizaje: es el bloque del rato de
      antes de entrar. Cada tema acaba con su lista de lo que hay que llevar
      sabido, y aquí están las doce de la extraordinaria, en el orden del
      temario. No hay nada en ellas que no esté en su tema.

      **Las listas de todos los temas escritos están juntas en una sola página**, hecha para imprimirse a dos columnas: [el formulario de Elasticidad](/road-to-ingenieria/elasticidad-resistencia/formulario/). Se leen de los temas, así que no hay nada escrito ahí que no esté en ellos.
    dominio: >-
      Escribir de memoria y en papel Cauchy, Hooke en tensión plana, σeq de
      Mohr, la fuerza unidad, la ecuación de los tres momentos y la tensión de
      una sección cerrada, sin consultar nada. Si tienes que mirar una sola
      vez, todavía no.
    material:
      - tipo: teoria
        tema: t02-tensiones
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          El convenio, el equilibrio interno, Cauchy, las principales y Mohr.
      - tipo: teoria
        tema: t03-deformaciones
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          γ/2 en el tensor, la fórmula de la galga y la compatibilidad.
      - tipo: teoria
        tema: t04-cuerpo-elastico
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          Hooke en los dos sentidos, las constantes y la tensión plana.
      - tipo: teoria
        tema: t06-teorias-de-fallo
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          La tensión equivalente de cada criterio, Mohr incluido, y el factor
          de seguridad.
      - tipo: teoria
        tema: t07-piezas-prismaticas
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          El convenio de los esfuerzos, las relaciones de la rebanada y las
          reglas de los diagramas.
      - tipo: teoria
        tema: t08-esfuerzo-axial
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          El alargamiento con temperatura, la compatibilidad de los nudos y los
          depósitos.
      - tipo: teoria
        tema: t09-flexion-tensiones
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          Navier, la fórmula general, el flujo cortante, las vigas compuestas,
          la flexión compuesta y el núcleo central.
      - tipo: teoria
        tema: t10-flexion-deformaciones
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          La elástica con su signo, las condiciones de los apoyos, la tabla de
          vigas, Mohr y la conjugada.
      - tipo: teoria
        tema: t11-flexion-hiperestatica
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          El enlace que se quita, la empotrada-apoyada y los tres momentos con
          el voladizo y el empotramiento.
      - tipo: teoria
        tema: t12-torsion
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          La circular, el eje empotrado en los dos extremos, la abierta y la
          cerrada de pared delgada.
      - tipo: teoria
        tema: t13-teoremas-energeticos
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          Castigliano, la coenergía de cada esfuerzo, la fuerza unidad, el
          muelle y el tirante, y la barra quebrada.
      - tipo: teoria
        tema: t14-pandeo
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          Euler, la longitud de pandeo, la esbeltez y la compresión excéntrica.
    revisado: '2026-10-23'
