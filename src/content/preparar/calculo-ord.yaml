asignatura: calculo
evaluacion: ordinaria
titulo: Preparar la convocatoria ordinaria
lede: >-
  El examen que más vale del año, 17,5 % en su segundo parcial. Entran los
  temas 6 a 11, y es el único sitio donde caen Laplace y Fourier. Además tiene
  algo que no tiene ningún parcial: un ejercicio que cruza tres temas a la vez.
temas:
  - t06-varias-variables
  - t07-integral-multiple
  - t08-integral-curvilinea
  - t09-ecuaciones-diferenciales
  - t10-laplace
  - t11-fourier
medidoSobre: 2
criterioDeOrden: >-
  Al revés que en los parciales. Aquí lo primero son Laplace y Fourier, porque
  son los dos temas que **no caen en ningún otro examen** y porque los dos
  últimos ejercicios del segundo parcial son suyos, año tras año. Después el
  ejercicio de síntesis, que cruza gradiente, ecuaciones diferenciales e
  integral curvilínea y no se parece a nada de lo que has hecho antes. Y lo
  demás se repasa en las rutas de la cuarta y la quinta evaluación, que ya
  existen.

bloques:
  # ─────────────────────────────────────────────────────────────────────
  - id: fourier
    titulo: Fourier, que es el ejercicio 4 y siempre el mismo
    pide: >-
      Dada una función periódica definida a trozos, dibujarla, calcular su
      serie de Fourier, evaluar la serie en unos puntos concretos y —a veces—
      sacar de ahí la suma de una serie numérica.
    porque: >-
      Es el ejercicio 4 del segundo parcial en los dos cursos leídos, y en los
      dos con la misma estructura de cuatro apartados. Es el bloque más
      predecible de toda la asignatura: cambia la función, no las preguntas.
    invariante:
      anios: 2
      fuente: >-
        Ejercicio 4 del segundo parcial de las convocatorias ordinarias de
        2023-2024 (ampliación impar, serie, y los valores en 2024·pi y en
        201·pi partido por 2) y 2024-2025 (función a trozos de periodo 4,
        serie, valores en tres puntos, y la suma de la serie de los inversos de
        los cuadrados impares). Los dos empiezan por
        «dibujar» y los dos preguntan el valor de la serie Y el de la función en el mismo punto.
    dominio: >-
      Ante una función periódica a trozos, mirar la paridad antes de integrar,
      calcular la serie, y contestar los valores en puntos grandes reduciendo al
      periodo básico y aplicando Dirichlet donde haya salto. Y saber que cuando
      te piden $S(t)$ y $f(t)$ juntos es porque no coinciden.
    escalones:
      - id: paridad
        titulo: La paridad, que ahorra la mitad
        aprendes: >-
          Decidir si una función es par o impar y anular la mitad de los
          coeficientes sin calcular ninguna integral.
        dominio: >-
          Que escribas «como $f$ es impar, $a_n=0$ para todo $n$» y sigas
          adelante, en vez de integrar algo que sabías nulo.
        teoria:
          tema: t11-fourier
          apartado: mirar-la-paridad-antes-de-integrar
          nota: >-
            Y ojo con el caso inverso: dar por nulos unos coeficientes en una
            función que no es par ni impar estropea la serie entera.
        ejercicios:
          - id: ej-paridad-antes-de-integrar
            incrustado: true
            nota: >-
              Empieza aquí. Dos funciones, dos casos opuestos, y ninguna
              integral.

      - id: dirichlet
        titulo: Dirichlet, y los puntos que el examen elige con mala idea
        aprendes: >-
          Decir a qué converge la serie en un punto, distinguiendo continuidad
          de salto, y reducir argumentos grandes al periodo básico.
        dominio: >-
          Que $S(2024\pi)$ no te asuste: reduces al periodo, miras si es salto,
          y aplicas la media. Y que cuando te piden $S$ y $f$ en el mismo punto
          sepas que la respuesta son dos números distintos.
        teoria:
          tema: t11-fourier
          apartado: dirichlet-a-qué-converge-la-serie-donde-la-función-salta
        ejercicios:
          - id: ej-dirichlet-en-el-salto
            incrustado: true
            nota: >-
              Dos puntos de la misma función: uno de salto y otro de
              continuidad. La diferencia entre los dos es la pregunta.
          - id: serie-de-f-igual-t
            nota: >-
              De 2015-2016, y trae los tres casos: continuidad, argumento
              grande que hay que reducir, y salto. Y acaba sumando una serie.

      - id: sumar-series
        titulo: Sumar una serie numérica evaluando la de Fourier
        aprendes: >-
          Elegir el punto donde evaluar la serie para que la igualdad se
          convierta en la suma numérica que te piden.
        dominio: >-
          Saber elegir el punto: uno donde se anulen los términos que sobran, y
          comprobar antes si ese punto es de salto — porque entonces el lado
          izquierdo no es $f$, es la media.
        teoria:
          tema: t11-fourier
          apartado: el-apartado-que-sorprende-sumar-una-serie-numérica
          nota: >-
            Es una suma que con los criterios del tema 2 no sabrías calcular:
            aquellos dicen si converge, no a cuánto.
        ejercicios:
          - id: extension-par-de-t
            nota: >-
              De 2017-2018, y da $\pi^{2}/8$ — que es exactamente la suma que
              pidió el segundo parcial de la ordinaria de 2024-2025.

  # ─────────────────────────────────────────────────────────────────────
  - id: laplace
    titulo: Laplace, que es el ejercicio 3
    pide: >-
      Resolver con la transformada de Laplace lo que los métodos del tema 9 no
      alcanzan: una ecuación integral, un sistema de EDOs, o una ecuación con el
      segundo miembro definido a trozos.
    porque: >-
      Es el ejercicio 3 del segundo parcial en los dos cursos leídos. Y no es
      casual que caiga aquí y no en la quinta evaluación: Laplace solo compensa
      en los casos que el tema 9 no resuelve, y esos son justo los que el examen
      elige.
    invariante:
      anios: 2
      fuente: >-
        Ejercicio 3 del segundo parcial de la ordinaria de 2023-2024 (EDO de
        segundo orden con segundo miembro a trozos, que se enciende en t igual a 2) y
        de 2024-2025 (la ecuación integral de y(z) entre 0 y t, igual a t por
        y(t)).
    dominio: >-
      Reconocer en menos de un minuto cuál de los tres casos tienes delante, y
      saber que las condiciones iniciales entran al transformar y no hay que
      volver a por ellas.
    escalones:
      - id: ir-y-volver
        titulo: Ir y volver por el dominio de s
        aprendes: >-
          Transformar con la tabla, despejar la incógnita algebraicamente, y
          antitransformar descomponiendo en fracciones simples.
        dominio: >-
          Que el rodeo te salga solo, y que en la vuelta reconozcas los tres
          casos del denominador — raíces distintas, raíz doble, y el que no
          factoriza y hay que completar el cuadrado.
        teoria:
          tema: t10-laplace
          apartado: el-rodeo-que-es-la-idea-entera
        ejercicios:
          - id: ej-transformada-con-la-tabla
            incrustado: true
            nota: >-
              La ida, con la tabla y la linealidad. Y el signo del denominador
              en la exponencial, que es lo único con trampa.
          - id: ej-inversa-fracciones-simples
            incrustado: true
            nota: >-
              La vuelta. Con el método de cubrir, que es el que hace las
              fracciones simples en treinta segundos.

      - id: convolucion
        titulo: Las ecuaciones integrales, y la convolución
        aprendes: >-
          Reconocer una convolución dentro de una integral y usar que su
          transformada es el producto de las transformadas.
        dominio: >-
          Que al ver una integral de 0 a $t$ con $(t-u)$ y $u$ en factores
          separados pienses «convolución» sin que nadie diga la palabra.
        teoria:
          tema: t10-laplace
          apartado: para-qué-compensa-de-verdad
          nota: >-
            Sin Laplace no hay forma razonable de atacar una ecuación integral,
            y por eso este tipo de ejercicio aparece siempre que aparece Laplace.
        ejercicios:
          - id: ecuacion-integral-convolucion
            nota: >-
              De 2015-2016. Y ojo al factorial de la tabla al volver: $1/s^{4}$
              no es $t^{3}$, es $t^{3}/6$.
          - id: sistema-de-edos-con-laplace
            nota: >-
              El otro caso donde compensa: dos ecuaciones acopladas se convierten
              en un sistema lineal de bachillerato. De 2016-2017.

  # ─────────────────────────────────────────────────────────────────────
  - id: sintesis
    titulo: El ejercicio que cruza tres temas
    pide: >-
      Un enunciado largo, casi siempre con una superficie y una figura, donde
      hay que encadenar herramientas de temas distintos: plantear una ecuación
      diferencial a partir de un gradiente, resolverla, parametrizar la curva
      que sale, y calcular un trabajo sobre ella.
    porque: >-
      Es el ejercicio 1 o 2 del segundo parcial en los dos cursos leídos, y es
      lo único de la asignatura que no se parece a ningún ejercicio de parcial.
      No pide una técnica nueva: pide **saber cuál usar en cada tramo**, que es
      lo que un parcial nunca puede evaluar porque solo entran dos temas.
    invariante:
      anios: 2
      fuente: >-
        Segundo parcial de la ordinaria de 2023-2024 (una bola rueda por una
        superficie: plantear la EDO de la trayectoria, resolverla y hallar dónde
        acaba) y de 2024-2025 (resolver una EDO, parametrizar la curva solución
        sobre una montaña, y calcular el trabajo de una ventisca sobre ella).
    dominio: >-
      Leer un enunciado de cinco líneas y saber decir, antes de escribir nada,
      qué herramienta toca en cada apartado y de qué tema viene. Si eso lo tienes,
      el ejercicio es tres ejercicios cortos seguidos.
    escalones:
      - id: trayectoria-del-gradiente
        titulo: La trayectoria de máxima pendiente
        aprendes: >-
          Plantear la ecuación diferencial que sigue una bola al rodar por una
          superficie, que es la que va en la dirección del gradiente.
        dominio: >-
          Reconocer que «rueda por la superficie» significa «sigue $-\nabla f$»,
          y que eso es una EDO cuya solución es la curva del plano.
        teoria:
          tema: t06-varias-variables
          apartado: el-gradiente-contesta-las-tres-preguntas
          nota: >-
            La bola baja por donde más pende, o sea en la dirección opuesta al
            gradiente. De ahí sale la ecuación, y a partir de ahí es el tema 9.
        ejercicios:
          - id: ej-gradiente-tres-preguntas
            nota: >-
              El repaso mínimo del gradiente antes de encadenarlo con la EDO.

      - id: encadenar
        titulo: Encadenar los tres temas
        aprendes: >-
          Recorrer el ejercicio completo: EDO, curva solución, parametrización y
          trabajo del campo sobre ella.
        dominio: >-
          Que el cambio de tema entre apartados no te frene. Cada apartado es un
          ejercicio corto de un tema que ya sabes; lo difícil es la costura.
        teoria:
          tema: t08-integral-curvilinea
          apartado: parametrizar-describir-la-curva-con-un-solo-parámetro
          nota: >-
            La curva que sale de resolver la EDO es la que hay que parametrizar,
            y sobre ella se calcula el trabajo. Ese es el punto de costura.
        ejercicios:
          - id: ej-conservativo-o-no
            nota: >-
              Antes de calcular el trabajo del último apartado, la comprobación
              de diez segundos que puede ahorrarte la integral entera.
    falta:
      - >-
        Los once exámenes de convocatoria ordinaria no están transcritos, y son
        los que más valen del curso. Esta ruta está medida sobre **dos** —los
        segundos parciales de 2023-2024 y 2024-2025—, leídos uno a uno.
      - >-
        La ordinaria trae **dos parciales en el mismo cuadernillo**: el primero
        es de los temas 1 a 5, para quien no aprobó el primer cuatrimestre, y no
        se cubre aquí porque es la misma materia de las rutas de la primera,
        segunda y tercera evaluación.
      - >-
        No hay ningún ejercicio propio del bloque de síntesis: los tres que
        enlaza son repasos de otros temas. Hace falta escribir uno que recorra
        la cadena entera —gradiente, EDO, parametrización y trabajo— porque es
        justo la costura lo que se evalúa y no cada pieza por separado.
      - >-
        No hay cronómetro ni forma de guardar lo hecho: el sitio es estático.
        Lo que sí se guarda en tu navegador es qué escalones has dominado.
