asignatura: calculo
evaluacion: ordinaria
titulo: Preparar la convocatoria ordinaria
lede: >-
  El examen que más vale del año, y **son dos parciales el mismo día**: el
  primero de los temas 1 a 5 y el segundo de los temas 6 a 11, y **pesan casi
  lo mismo** —entre treinta y cincuenta puntos cada mitad, con diez de
  diferencia o menos en diez de las doce convocatorias—. En el primero,
  complejos cae los once años; en el segundo, Laplace también. Esta ruta va
  partida igual que el examen.
temas:
  - t01-complejos
  - t03-funciones-reales
  - t04-estudio-local
  - t05-integracion
  - t06-varias-variables
  - t07-integral-multiple
  - t08-integral-curvilinea
  - t09-ecuaciones-diferenciales
  - t10-laplace
  - t11-fourier
medidoSobre: 11
criterioDeOrden: >-
  La ruta va partida en dos mitades porque el examen lo está, y dentro de cada
  mitad los bloques van por rendimiento medido. Delante de las dos, el suelo:
  dibujar, que veinte de los cuarenta y cinco ejercicios del segundo parcial
  piden y trece piden ya en el apartado a).

  En el **primer parcial** —42 ejercicios en las once convocatorias— manda
  complejos, que cae los once años y siempre en el primer sitio; después
  estudio local, que cae diez de once y ocupa dos huecos distintos —optimizar y
  Taylor—; y después integración, nueve de once. Sucesiones **no cae nunca**:
  cero de once, y por eso el tema 2 no está en esta ruta.

  En el **segundo parcial**, Laplace —once de once—, el sólido —diez— y Fourier
  —diez—; y al final los dos que se reparten el hueco que sobra: la ecuación
  diferencial suelta, que cayó siete veces y ninguna desde 2022-2023, y el
  ejercicio que cruza temas, que ha ocupado ese sitio en las tres últimas.
  Los enteros y el formulario van los últimos porque son repaso, no
  aprendizaje.

  Un aviso sobre los recuentos: **hay doce ordinarias transcritas, y todo lo
  que se cuenta aquí se cuenta sobre once**, las contiguas de 2015-2016 a
  2025-2026. La duodécima es 2013-2014, que está suelta ocho años atrás; sus
  ejercicios se enlazan igual, y donde aparecen se dice que quedan fuera del
  recuento.


  **Cómo se han determinado los huecos de esta ruta.** Un bloque sin `falta[]`
  no es un bloque sin mirar: el 29 de agosto de 2026 se pasaron los sesenta y
  dos bloques de las siete rutas por tres criterios medidos —si su tema tiene
  pocos ejemplos de entrada para lo que el examen le exige, si sus ejercicios
  usan una herramienta que la prosa de ese tema no nombra, y si algún escalón
  suyo empieza directamente en un ejercicio de examen— y solo se declara lo que
  sale de alguno de ellos. Lo que no aparece aquí es porque ninguno de los tres
  lo señaló.
bloques:
  # ─────────────────────────────────────────────────────────────────────
  - id: dibujar
    titulo: Dibujar, que aquí es el apartado a)
    pide: >-
      «Dibujar el sólido», «dibujar la función periódica», «dibujar el dominio
      de integración». Casi siempre con esas palabras, y casi siempre lo
      primero que se pide.
    porque: >-
      **Veinte de los cuarenta y cinco ejercicios** de los segundos parciales
      piden dibujar algo, y **trece lo piden en el apartado a)**. No es un
      adorno del enunciado: el dibujo es de donde salen los límites de
      integración y la paridad de la función, así que si sale mal, sale mal el
      ejercicio entero — y si no sale, no hay por dónde empezar. Vale uno o dos
      puntos y decide los ocho restantes. Por eso va primero: no se examina
      solo, y sin él los otros bloques no se terminan a tiempo.
    invariante:
      anios: 11
      fuente: >-
        Contado sobre los cuarenta y cinco ejercicios de los segundos parciales
        de las once ordinarias, buscando «dibujar», «representar», «esbozar» y
        «gráfica» en el enunciado y descartando los que solo mencionan una
        figura ya dada. Los veinte se reparten así: los diez de Fourier, ocho de
        los diez de integral múltiple —faltan 2020-2021 y 2022-2023—, el de
        curvas de nivel de 2016-2017 y el del montañero de 2024-2025.
    dominio: >-
      Que ante «dibujar el sólido» no te quedes mirando el papel. Un sólido de
      revolución se dibuja cortándolo por un plano que contenga el eje: dibujas
      la sección, la giras y ya está. Y una función periódica a trozos se dibuja
      un periodo y se copia a los lados.
    escalones:
      - id: seccion-meridiana
        titulo: El sólido, cortado por un plano que contiene el eje
        aprendes: >-
          Dibujar un sólido de revolución en dos pasos: hallar dónde se cortan
          las dos superficies y dibujar la sección que pasa por el eje.
        dominio: >-
          Que ante «dentro del paraboloide y dentro del cono» sepas escribir el
          radio de cada superficie en función de $z$, igualarlos, y dibujar el
          perfil con el corte marcado. El dibujo en perspectiva es opcional; la
          sección, no.
        teoria:
          tema: t07-integral-multiple
          apartado: el-recinto-manda-y-hay-que-dibujarlo
          nota: >-
            El apartado habla de recintos planos, y un sólido de revolución es
            exactamente eso una vez cortado: el perfil es una región del plano
            $rz$, y los límites de la integral salen de ahí.
        ejercicios:
          - id: ej-recinto-y-limites
            incrustado: true
            nota: >-
              Empieza aquí, en el plano. Leer un recinto dibujado y escribir sus
              límites es la mitad de lo que luego hay que hacer en tres
              dimensiones.
          - id: ex2122-ord-5-el-area-del-paraboloide-rematado-en-cono
            nota: >-
              De 2021-2022, y el apartado a) es solo dibujar. Cuenco parabólico
              rematado en punta: se cortan en $z=4$ con radio $2$.
          - id: ex1314-ord-6-el-cuenco-rematado-en-cono
            nota: >-
              De 2013-2014, y es **el mismo sólido** ocho años antes. Cambia lo
              que se pregunta después, no el dibujo.

      - id: la-funcion-a-trozos
        titulo: La función periódica, y su ampliación
        aprendes: >-
          Dibujar una función definida a trozos, repetirla por periodicidad, y
          construir su ampliación par o impar cuando el enunciado la pide.
        dominio: >-
          Que dibujes un periodo completo y al menos uno a cada lado, con los
          saltos marcados con puntos abiertos y cerrados. Y que al ampliar
          sepas sin dudar que la par refleja y la impar refleja **y** cambia de
          signo.
        teoria:
          tema: t11-fourier
          apartado: mirar-la-paridad-antes-de-integrar
          nota: >-
            El dibujo y la paridad son la misma pregunta: en cuanto está
            dibujado, se ve si es par o impar, y con eso se anula la mitad de
            los coeficientes sin integrar nada.
        ejercicios:
          - id: ej-paridad-antes-de-integrar
            incrustado: true
            nota: >-
              Dos funciones, dos casos opuestos, y ninguna integral. Es el
              escalón de entrada del tema.
          - id: ex2526-ord-8-fourier-de-la-ampliacion-impar
            nota: >-
              De 2025-2026, el más reciente. El apartado a) es construir la
              ampliación impar y el b) dibujarla: dos puntos antes de integrar.
          - id: ex2021-ord-8-la-ampliacion-par-de-una-recta
            nota: >-
              De 2020-2021, y el mismo apartado con la ampliación **par**. Los
              dos juntos enseñan la diferencia mejor que cualquier explicación.

  # ═══════════════════════════════════════════════════════════════════
  # PRIMER PARCIAL · temas 1 a 5
  # ═══════════════════════════════════════════════════════════════════
  - id: complejos
    titulo: El ejercicio 1, que siempre es de complejos
    pide: >-
      «Hallar el tercer vértice del triángulo», «resolver la ecuación y
      representar el lugar geométrico», «hallar los valores de a y b para que z
      sea imaginario puro de módulo uno».
    porque: >-
      Cae **los once años y siempre en el primer sitio**, sin una sola
      excepción. Es el hueco más previsible del examen entero y el que más
      barato sale de asegurar: es material de la primera evaluación, así que
      cuando llegas aquí ya lo estudiaste una vez.
    invariante:
      anios: 11
      fuente: >-
        Ejercicio 1 de tema 1 en las once ordinarias de 2015-2016 a 2025-2026.
        Once ejercicios, uno por año.
    dominio: >-
      Que ante cualquiera de los once escribas el planteamiento en menos de dos
      minutos, y que sepas de antemano si va a salir una recta, un arco o un
      polígono.
    escalones:
      - id: condiciones-sobre-un-complejo
        titulo: Dos condiciones, y el complejo que las cumple
        aprendes: >-
          Traducir condiciones como «imaginario puro», «de módulo uno» o «su
          parte real se anula» en ecuaciones sobre $a$ y $b$, y resolverlas.
        dominio: >-
          Que separes parte real e imaginaria sin pensarlo, y que no te dejes
          fuera los puntos que hay que excluir porque anulan un denominador.
        teoria:
          tema: t01-complejos
          apartado: el-conjugado-que-hace-casi-todo-el-trabajo
          nota: >-
            Casi todas estas condiciones se imponen sobre un cociente, y para
            eso primero hay que racionalizar.
        ejercicios:
          - id: ecuacion-cubica-cociente
            nota: >-
              Del boletín, y es el paso previo: racionalizar un cociente y
              separar parte real e imaginaria, que es lo que hacen todos los de
              examen antes de imponer nada.
          - id: ex2324-ord-1-imaginario-puro-de-modulo-uno
            incrustado: true
            nota: >-
              De 2023-2024. Dos condiciones, dos incógnitas y dos soluciones:
              el molde de este escalón.
          - id: ex2021-ord-1-la-parte-real-de-un-cociente
            nota: >-
              De 2020-2021, y trae el punto que hay que quitar: el que anula el
              denominador no está en el lugar geométrico aunque cumpla la
              ecuación.
          - id: ex2122-ord-1-imaginario-puro-y-un-lugar-geometrico
            nota: >-
              De 2021-2022, y junta las dos mitades del hueco: un parámetro que
              se despeja y una región que sale de dos condiciones.
          - id: ex2425-ord-1-la-tangente-compleja-y-la-circunferencia
            nota: >-
              De 2024-2025, y el más raro de los once: una tangente compleja
              que vale $2i$, que sale de la definición exponencial.

      - id: lugares-en-la-ordinaria
        titulo: Los que salen una figura
        aprendes: >-
          Dibujar la región del plano que cumple una condición sobre módulos o
          argumentos, con su borde y sus puntos excluidos.
        dominio: >-
          Que ante un argumento constante escribas «arco» y sepas cuál de los
          dos antes de dibujarlo, y que ante dos módulos iguales escribas
          «mediatriz» sin pensar.
        teoria:
          tema: t01-complejos
          apartado: lugares-geométricos-traducir-la-condición-a-una-distancia
          nota: >-
            La tabla de traducciones del principio: cada forma de la condición
            produce una figura, y son cinco.
        ejercicios:
          - id: ej-disco-y-borde
            incrustado: true
            nota: >-
              El disco y su borde: la traducción más simple de una condición a una región. Sin esto, el primero de examen ya pide decidir media circunferencia.
          - id: ex1819-ord-1-un-argumento-que-vale-noventa-grados
            nota: >-
              De 2018-2019. Media circunferencia, y la mitad del ejercicio es
              explicar por qué solo media.
          - id: ex1516-ord-1-una-circunferencia-y-un-eje
            nota: >-
              De 2015-2016, con dos figuras que hay que cortar.

      - id: poligonos-y-raices
        titulo: Cuando las raíces son los vértices de un polígono
        aprendes: >-
          Usar que las raíces $n$-ésimas reparten la circunferencia a partes
          iguales para hallar vértices, lados, perímetros y áreas.
        dominio: >-
          Que ante «los tres vértices de un triángulo equilátero» pienses en
          raíces cúbicas antes que en geometría, y que compruebes que salen
          $n$ y equiespaciadas.
        teoria:
          tema: t01-complejos
          apartado: raíces-n-ésimas-cuántas-hay-y-por-qué-están-repartidas
          nota: >-
            Si no salen $n$ raíces, o no están equiespaciadas, hay un error
            antes de llegar aquí.
        ejercicios:
          - id: ej-polar-de-uno-mas-i
            incrustado: true
            nota: >-
              Empieza aquí: pasar a polar es lo que hace falta antes de repartir una circunferencia en raíces.
          - id: ex2526-ord-1-el-triangulo-equilatero
            nota: >-
              De 2025-2026, el más reciente: tres vértices que son las tres
              raíces cúbicas de ocho.
          - id: ex1617-ord-1-las-seis-raices-y-su-hexagono
            nota: >-
              De 2016-2017, con seis raíces y un perímetro que sale redondo.
          - id: ex2223-ord-1-el-tercer-vertice-del-isosceles
            nota: >-
              De 2022-2023, y aquí el polígono no es regular: hay que girar un
              vector, no repartir un ángulo.
          - id: ex1718-ord-1-dos-potencias-que-se-cancelan
            nota: >-
              De 2017-2018. Dos potencias décimas cuya suma es cero, que es
              otra forma de preguntar lo mismo.
          - id: ex1314-ord-1-cuatro-operaciones-sobre-un-rectangulo
            nota: >-
              De 2013-2014, fuera de las once contadas. Cuatro operaciones
              seguidas sobre la misma figura: sirve de repaso del suelo.

  # ─────────────────────────────────────────────────────────────────────
  - id: optimizar
    titulo: El rectángulo más grande que cabe en algo
    pide: >-
      «Hallar las dimensiones del rectángulo de área máxima», «los tres lados
      del triángulo de área máxima», «la velocidad angular de la cámara en ese
      instante».
    porque: >-
      **Siete de los once años**, y casi siempre en el hueco 2 o 3. Son cinco
      de optimización pura y dos de razón de cambio, que es el mismo mecanismo
      con el tiempo dentro. Lo que se examina no es derivar: es **traducir el
      enunciado a una función de una variable**, y por eso va en un bloque
      propio y no dentro del de derivadas.
    invariante:
      anios: 7
      fuente: >-
        Siete ordinarias con un ejercicio de optimización o de razón de cambio
        en el primer parcial: 2025-2026, 2024-2025, 2023-2024, 2022-2023,
        2020-2021, 2019-2020 y 2017-2018.
    dominio: >-
      Que ante cualquiera de estos escribas la función a maximizar y la
      relación que elimina la segunda variable **antes** de derivar nada, y que
      justifiques que el punto crítico es un máximo en vez de darlo por hecho.
    escalones:
      - id: traducir-antes-de-derivar
        titulo: Traducir el enunciado a una función de una variable
        aprendes: >-
          Escribir la magnitud que hay que optimizar y la restricción que liga
          las dos variables, y quedarte con una función de una sola.
        dominio: >-
          Que la parte de derivar te ocupe menos tiempo que la de plantear. Si
          es al revés, el planteamiento no estaba cerrado.
        teoria:
          tema: t04-estudio-local
          apartado: optimizar-es-traducir-no-derivar
          nota: >-
            El apartado se llama así por algo: el error caro de estos
            ejercicios no está en la derivada.
        ejercicios:
          - id: ej-optimizar-rectangulo
            incrustado: true
            nota: >-
              El molde con la restricción a la vista. Después, los de examen la esconden.
          - id: ex1718-ord-3-el-rectangulo-inscrito
            incrustado: true
            nota: >-
              De 2017-2018, y el más limpio de los siete: entre todos los
              rectángulos inscritos, el cuadrado.
          - id: ex1920-3-el-rectangulo-mas-grande-de-la-elipse
            nota: >-
              Del examen de mayo-junio de 2020. La misma idea con una elipse en
              vez de una circunferencia.
          - id: ex2021-ord-2-el-rectangulo-que-gira
            nota: >-
              De 2020-2021, y con una vuelta más: el resultado depende de qué
              lado decidas que sea el radio.
          - id: ex2324-ord-4-el-rectangulo-en-el-triangulo
            nota: >-
              De 2023-2024. El rectángulo inscrito se lleva justo la mitad del
              triángulo, y ese resultado no depende de las medidas.
          - id: ex2425-ord-2-el-isosceles-que-sale-equilatero
            nota: >-
              De 2024-2025, y el final es el que se recuerda: el isósceles de
              área máxima resulta ser equilátero.

      - id: razon-de-cambio
        titulo: Cuando lo que se pide es una velocidad
        aprendes: >-
          Derivar una relación respecto del tiempo —o de otra variable— para
          convertir una geometría en una velocidad.
        dominio: >-
          Que identifiques qué magnitud te dan variando y cuál te piden, y que
          derives la relación entera con la regla de la cadena sin despejar
          antes.
        teoria:
          tema: t03-funciones-reales
          apartado: la-derivada-como-velocidad
          nota: >-
            Y el apartado de derivación implícita de al lado: casi nunca
            conviene despejar antes de derivar.
        ejercicios:
          - id: ej-velocidades-relacionadas
            incrustado: true
            nota: >-
              Dos magnitudes que cambian a la vez, sin decorado. El cohete es esto con una tangente dentro.
          - id: ex2223-ord-2-el-cohete-y-el-angulo-de-la-camara
            nota: >-
              De 2022-2023. La cámara que gira para seguir al cohete, que es el
              enunciado clásico de este hueco.
          - id: ex2526-ord-2-la-temperatura-respecto-a-la-posicion
            nota: >-
              De 2025-2026, y la variante que despista: la derivada no es
              respecto del tiempo.

  # ─────────────────────────────────────────────────────────────────────
  - id: taylor
    titulo: Taylor, y la cota del error que casi siempre se olvida
    pide: >-
      «El polinomio de Taylor de orden 2 y una cota del error», «cuántos
      términos hacen falta para que el error sea menor que 10⁻³», «la derivada
      vigesimoquinta en el origen».
    porque: >-
      **Seis de los once años.** Y hay un detalle que decide la nota: en cuatro
      de los seis el enunciado pide **acotar el error**, no solo escribir el
      polinomio. El resto de Lagrange es la mitad del ejercicio y es la mitad
      que se deja en blanco.
    invariante:
      anios: 6
      fuente: >-
        Seis ordinarias con un ejercicio de Taylor o de series de Maclaurin en
        el primer parcial: 2025-2026, 2024-2025, 2023-2024, 2022-2023,
        2021-2022 y 2018-2019.
    dominio: >-
      Que ante un polinomio de Maclaurin busques primero de cuál de los seis
      desarrollos conocidos sale, y que sepas escribir la cota del error sin
      mirar la fórmula.
    escalones:
      - id: componer-en-vez-de-derivar
        titulo: Componer uno de los seis, en vez de derivar
        aprendes: >-
          Sacar el desarrollo de una función complicada partiendo de uno
          conocido, y leer de él una derivada de orden alto sin derivar.
        dominio: >-
          Que ante «la derivada vigesimoquinta en el origen» no derives ni una
          vez: se lee del coeficiente.
        teoria:
          tema: t04-estudio-local
          apartado: seis-desarrollos-que-conviene-tener-memorizados
          nota: >-
            Los seis, y el aviso de que casi todos estos ejercicios se hacen
            componiendo uno de ellos.
        ejercicios:
          - id: ej-componer-un-desarrollo
            incrustado: true
            nota: >-
              Y el que enseña el atajo: componer uno de los seis desarrollos en vez de derivar, que es como se resuelven casi todos los de este hueco.
          - id: ej-taylor-orden-dos
            incrustado: true
            nota: >-
              El polinomio de orden dos, derivando. Los de examen ya no derivan: componen.
          - id: ex2122-ord-3-dos-series-de-mclaurin-y-dos-derivadas
            incrustado: true
            nota: >-
              De 2021-2022. Dos series conocidas y una derivada número
              veinticinco que sale sin derivar.
          - id: ex1819-ord-3-la-serie-de-equis-por-seno
            nota: >-
              De 2018-2019. Solo potencias pares, y por eso la derivada
              veinticuatro es la que se puede leer.
          - id: ex2526-ord-3-la-geometrica-y-su-intervalo
            nota: >-
              De 2025-2026, y con la pregunta que acompaña siempre a una serie:
              dónde deja de valer.

      - id: la-cota-del-error
        titulo: La cota del error, que es media pregunta
        aprendes: >-
          Escribir el resto de Lagrange y acotarlo, y responder «cuántos
          términos hacen falta» sin sumar ninguno.
        dominio: >-
          Que sepas qué se acota —la derivada siguiente en el intervalo— y que
          no confundas el orden del polinomio con el del resto.
        teoria:
          tema: t04-estudio-local
          apartado: el-resto-es-la-parte-que-se-suele-olvidar-y-es-la-que-se-pregunta
          nota: >-
            El apartado se llama así porque es literalmente lo que pasa: en
            cuatro de los seis años el error es la segunda mitad del enunciado.
        ejercicios:
          - id: ej-taylor-orden-dos
            nota: >-
              El polinomio de orden dos, que es sobre el que se monta la cota.
          - id: ej-cota-del-resto
            incrustado: true
            nota: >-
              La cota del resto en el caso más simple, antes de que la función venga de una ecuación diferencial.
          - id: ex2324-ord-3-taylor-de-una-edo-y-su-error
            incrustado: true
            nota: >-
              De 2023-2024, y el más completo: la función no se conoce —sale de
              una ecuación diferencial— y aun así hay que acotar el error.
          - id: ex2223-ord-4-mclaurin-para-el-logaritmo-de-nueve-decimas
            nota: >-
              De 2022-2023. Un polinomio de grado dos para $\ln 0{,}9$, con la
              cota que justifica los decimales.
          - id: ex2425-ord-3-dos-terminos-bastan
            nota: >-
              De 2024-2025, y la pregunta al revés: cuántos términos hacen
              falta, que se contesta antes de sumarlos.
          - id: ex1314-ord-3-taylor-de-una-edo-sin-resolverla
            nota: >-
              De 2013-2014, fuera de las once contadas, y el antecedente del de
              2023-2024: el polinomio sale de la ecuación, no de la función.

  # ─────────────────────────────────────────────────────────────────────
  - id: leer-lo-dibujado
    titulo: Cuando lo que te dan es una gráfica
    pide: >-
      «Cuál es la función y cuál la derivada», «verdadero o falso, razonado, en
      las cinco afirmaciones», «el enunciado del teorema y en cada caso si se
      aplica».
    porque: >-
      **Seis de los once años**, y es el hueco donde COMP 2 vale menos: casi
      todo son puntos de justificar. Cinco son de leer dos gráficas y decidir
      cuál deriva a cuál, y uno es el enunciado de un teorema con casos donde
      no se puede aplicar.
    invariante:
      anios: 6
      fuente: >-
        Seis ordinarias con un ejercicio de lectura de gráficas o de enunciado
        de teorema en el primer parcial: 2023-2024, 2022-2023, 2021-2022,
        2019-2020, 2018-2019 y 2015-2016.
    dominio: >-
      Que ante dos curvas sepas decidir cuál es la derivada mirando dónde una
      corta el eje y dónde la otra tiene su extremo, y que puedas enunciar
      Rolle y Lagrange sin mirar.
    escalones:
      - id: cual-deriva-a-cual
        titulo: Cuál de las dos es la derivada
        aprendes: >-
          Decidir cuál de dos curvas dibujadas es la derivada de la otra, y
          hacer con ellas un estudio completo sin conocer ninguna fórmula.
        dominio: >-
          Que uses los tres cruces —donde la derivada se anula, la función
          tiene extremo; donde cambia de signo, cambia la monotonía— y que
          escribas el argumento, no solo la conclusión.
        teoria:
          tema: t04-estudio-local
          apartado: cuando-lo-que-te-dan-dibujado-es-la-derivada
          nota: >-
            El apartado entero va de esto, y trae la figura con los tres cruces
            marcados.
        ejercicios:
          - id: ej-leer-grafica-derivada
            incrustado: true
            nota: >-
              Los tres cruces, en un caso con una sola curva. Empieza por aquí.
          - id: ex1920-2-cual-de-las-dos-graficas-es-la-derivada
            incrustado: true
            nota: >-
              Del examen de mayo-junio de 2020. El molde: cuál es cuál, y
              después el estudio completo de una compuesta.
          - id: ex2223-ord-3-cual-es-la-funcion-y-cual-la-derivada
            nota: >-
              De 2022-2023, con dominio, extremos y curvatura de $h$ encima.
          - id: ex1516-ord-3-cual-es-efe-y-cual-su-derivada
            nota: >-
              De 2015-2016, y pregunta además qué le pasa al cuadrado de $F$.

      - id: verdadero-o-falso
        titulo: Cinco afirmaciones, y razonar cada una
        aprendes: >-
          Decidir si una afirmación sobre una función dibujada es cierta, y
          escribir el motivo o el contraejemplo.
        dominio: >-
          Que ninguna respuesta sea «sí» o «no» a secas: en este hueco los
          puntos están en el porqué.
        teoria:
          tema: t04-estudio-local
          apartado: crecer-y-curvarse-lo-que-dicen-la-primera-y-la-segunda-derivada
          nota: >-
            Las cuatro combinaciones de signos, que es lo que estas
            afirmaciones mezclan una y otra vez.
        ejercicios:
          - id: ej-leer-grafica-derivada
            nota: >-
              Lo mismo, antes de que sean cinco afirmaciones a la vez.
          - id: ex2122-ord-2-cinco-afirmaciones-sobre-dos-graficas
            nota: >-
              De 2021-2022. Cinco afirmaciones y cuatro fallan.
          - id: ex2324-ord-2-cinco-afirmaciones-sobre-dos-graficas
            nota: >-
              De 2023-2024, el mismo formato dos años después: cinco, y solo
              una es cierta.
          - id: ex1819-ord-2-lagrange-y-cuando-no-se-puede-aplicar
            nota: >-
              De 2018-2019, y la variante con teorema: enunciarlo y decir en
              cada caso si se aplica y dónde. Aquí lo que puntúa es la
              hipótesis que falla.

  # ─────────────────────────────────────────────────────────────────────
  - id: la-integral-como-funcion
    titulo: Estudiar una función que solo se conoce como integral
    pide: >-
      «El crecimiento y la concavidad de F», «la recta tangente en x = 1», «los
      ceros, la monotonía, la curvatura y el dibujo».
    porque: >-
      **Cinco de los once años.** Es el hueco que más se parece a una pregunta
      de teoría disfrazada: la función no se puede calcular, así que todo sale
      del teorema fundamental. Quien lo entiende lo resuelve entero; quien
      intenta calcular la integral no termina.
    invariante:
      anios: 5
      fuente: >-
        Cinco ordinarias con un ejercicio de estudio de una función definida
        por una integral: 2024-2025, 2023-2024, 2020-2021, 2019-2020 y
        2015-2016.
    dominio: >-
      Que ante $F(x)=\int_a^{x}f$ derives sin pensarlo y saques monotonía y
      curvatura de $f$ y de $f'$, sin intentar calcular la primitiva.
    escalones:
      - id: derivar-sin-calcular
        titulo: Derivar sin calcular la integral
        aprendes: >-
          Sacar $F'$ y $F''$ de una función definida por una integral con
          extremo variable, y con ellas su monotonía, sus extremos y su
          curvatura.
        dominio: >-
          Que la primera línea de tu respuesta sea $F'(x)=f(x)$ y no un intento
          de primitiva.
        teoria:
          tema: t05-integracion
          apartado: el-teorema-fundamental-en-sus-dos-mitades
          nota: >-
            La primera mitad es la que se usa aquí; la segunda, Barrow, es la
            que se usa para calcular. Son cosas distintas y el examen las
            separa.
        ejercicios:
          - id: ej-derivar-funcion-integral
            incrustado: true
            nota: >-
              Derivar una integral sin calcularla, en el caso más corto.
          - id: ex2021-ord-3-una-integral-con-la-x-arriba
            incrustado: true
            nota: >-
              De 2020-2021, y el molde del hueco: ceros, monotonía, curvatura y
              dibujo, sin calcular nada.
          - id: ex2425-ord-4-la-longitud-de-arco-como-funcion
            nota: >-
              De 2024-2025, y con una vuelta de tuerca: la integral es una
              longitud de arco, así que el integrando es una raíz.
          - id: ex1314-ord-2-barrow-y-la-campana-de-gauss
            nota: >-
              De 2013-2014, fuera de las once contadas. La integral que no se
              sabe hacer —la campana de Gauss— y aun así se estudia entera.
          - id: ex1516-ord-2-la-particula-y-sus-integrales
            nota: >-
              De 2015-2016, y aquí lo que puntúa no es calcular: son cuatro
              integrales que hay que **interpretar** antes.

      - id: la-tangente-a-una-integral
        titulo: La recta tangente, que sale de dos evaluaciones
        aprendes: >-
          Escribir la recta tangente a una función definida por una integral,
          usando que su valor en el extremo inferior es cero.
        dominio: >-
          Que veas que $F(a)=0$ sin calcular nada, y que la pendiente es
          $f(a)$.
        teoria:
          tema: t05-integracion
          apartado: el-teorema-fundamental-en-sus-dos-mitades
        ejercicios:
          - id: ej-derivar-funcion-integral
            nota: >-
              La misma derivada, que es de donde sale la pendiente de la tangente.
          - id: ex2324-ord-5-la-tangente-a-una-integral
            nota: >-
              De 2023-2024. Dos evaluaciones y ya está la recta.
          - id: ex1920-4-la-recta-tangente-sin-calcular-la-integral
            nota: >-
              Del examen de mayo-junio de 2020, y el título lo dice todo.

  # ─────────────────────────────────────────────────────────────────────
  - id: areas-y-longitudes
    titulo: Áreas, volúmenes y perímetros
    pide: >-
      «El área del recinto y el volumen de revolución», «el perímetro completo
      del recinto», «el volumen, deducido con una integral y no citado de
      memoria».
    porque: >-
      **Cuatro de los once años.** Y hay un detalle del enunciado que se
      repite: piden **deducir** la fórmula, no aplicarla. En 2021-2022 el
      ejercicio era de dónde sale el tercio del volumen del cono.
    invariante:
      anios: 4
      fuente: >-
        Cuatro ordinarias con un ejercicio de áreas, volúmenes o longitudes en
        el primer parcial: 2025-2026, 2021-2022, 2019-2020 y 2016-2017.
    dominio: >-
      Que dibujes el recinto antes de plantear nada, y que sepas de memoria las
      cuatro fórmulas —área, volumen por discos, longitud de arco y superficie
      de revolución— sin confundir cuál lleva la raíz.
    escalones:
      - id: el-recinto-y-lo-que-engendra
        titulo: El recinto, y el sólido que engendra al girar
        aprendes: >-
          Calcular el área de un recinto entre curvas y el volumen que genera
          al girar, eligiendo bien el eje y el método.
        dominio: >-
          Que el dibujo salga antes que la integral, y que sepas decidir entre
          discos y capas sin probar los dos.
        teoria:
          tema: t05-integracion
          apartado: áreas-y-volúmenes-el-mismo-esquema
          nota: >-
            Y el apartado de al lado, sobre girar alrededor de OY, que es el
            caso que de verdad cae.
        ejercicios:
          - id: ej-area-entre-curvas
            incrustado: true
            nota: >-
              El área entre dos curvas, sin tangentes de por medio.
          - id: ex1617-ord-3-la-parabola-y-su-tangente
            incrustado: true
            nota: >-
              De 2016-2017. Un recinto entre una parábola y su tangente, y el
              sólido que engendra.
          - id: ex2122-ord-4-el-volumen-del-cono-por-integracion
            nota: >-
              De 2021-2022, y no vale citar la fórmula: piden de dónde sale el
              tercio.
          - id: ex2526-ord-4-el-valor-medio-y-los-tres-volumenes
            nota: >-
              De 2025-2026, y el eje de giro no es un eje coordenado: es el
              valor medio de la función.

      - id: longitudes-y-primitivas
        titulo: Perímetros, y la primitiva que hay que saber sacar
        aprendes: >-
          Calcular la longitud de un arco y resolver las primitivas que
          aparecen al hacerlo.
        dominio: >-
          Que no confundas la fórmula de la longitud con la del área de la
          superficie, y que sepas cuándo un cambio deja la integral a medias y
          hay que rematarla por partes.
        teoria:
          tema: t05-integracion
          apartado: longitud-de-arco
          nota: >-
            Y el apartado de los cuatro métodos, que es el que decide qué
            primitiva sale y cuál no.
        ejercicios:
          - id: ej-volumen-por-discos
            nota: >-
              Un giro por discos, que es el otro uso de la misma integral. La longitud de arco no tiene ejemplo propio todavía y ese salto está declarado en el bloque.
          - id: ex1920-5-el-perimetro-con-un-arco-de-parabola
            nota: >-
              Del examen de mayo-junio de 2020. Un perímetro con un arco de
              parábola dentro, que es la longitud que más cae.
          - id: ex1819-ord-4-un-cambio-y-despues-unas-partes
            nota: >-
              De 2018-2019, y es puro oficio: un cambio deja la integral hecha
              a medias y hay que terminarla por partes.

  # ─────────────────────────────────────────────────────────────────────
  - id: continuidad
    titulo: El hueco raro, que solo ha caído dos veces
    pide: >-
      «Demostrar que la ecuación tiene solución», «demostrar que una función
      continua no se salta ningún valor».
    porque: >-
      **Dos de los once años**, los dos seguidos y ninguno desde 2017-2018. Va
      al final del primer parcial precisamente por eso: es el bloque que menos
      rinde. Pero cuando cae vale el ejercicio entero, y es todo COMP 4.
    invariante:
      anios: 2
      fuente: >-
        Dos ordinarias con un ejercicio de continuidad o Bolzano en el primer
        parcial: 2017-2018 y 2016-2017. Ninguna después.
    dominio: >-
      Que sepas enunciar Bolzano con sus dos hipótesis y aplicarlo a un punto
      fijo, que es como viene disfrazado.
    escalones:
      - id: bolzano-disfrazado
        titulo: Bolzano, casi siempre disfrazado de punto fijo
        aprendes: >-
          Demostrar que una ecuación tiene solución construyendo la función
          auxiliar a la que aplicar Bolzano.
        dominio: >-
          Que ante «demuestra que existe $x$ con $f(x)=x$» escribas
          $g(x)=f(x)-x$ sin dudarlo, y que digas dónde compruebas el cambio de
          signo.
        teoria:
          tema: t03-funciones-reales
          apartado: el-punto-fijo-que-es-bolzano-disfrazado
          nota: >-
            El apartado explica el disfraz. Y el de al lado, que Bolzano **no
            encuentra** la raíz: garantiza que existe.
        ejercicios:
          - id: ej-bolzano-una-raiz
            incrustado: true
            nota: >-
              Bolzano aplicado directamente. El de examen es este con el disfraz de punto fijo.
          - id: ex1718-ord-2-el-punto-fijo-de-una-raiz
            incrustado: true
            nota: >-
              De 2017-2018. Una ecuación que tiene solución sin llegar a
              resolverla.
          - id: ex1617-ord-2-el-valor-intermedio-demostrado
            nota: >-
              De 2016-2017, y aquí lo que piden es demostrar el teorema, no
              aplicarlo.

  # ═══════════════════════════════════════════════════════════════════
  # SEGUNDO PARCIAL · temas 6 a 11
  # ═══════════════════════════════════════════════════════════════════
  - id: laplace
    titulo: Laplace, el único ejercicio que no falta nunca
    pide: >-
      Resolver con la transformada lo que los métodos del tema 9 no alcanzan:
      una ecuación integral, un sistema de EDOs, una ecuación con el segundo
      miembro definido a trozos, o una con la $t$ multiplicando.
    porque: >-
      **Doce ejercicios en once convocatorias, y está en las once.** Es el único
      bloque de toda la asignatura del que se puede decir eso. Y no cae aquí por
      casualidad: Laplace solo compensa en los casos que el tema 9 no resuelve,
      y esos son los que el examen elige. La única excepción es de 2013-2014, y
      es a propósito: pide la misma ecuación por Laplace **y** por coeficientes
      indeterminados, para que se vea que llevan al mismo sitio.
    invariante:
      anios: 11
      fuente: >-
        Contado sobre los segundos parciales de las once ordinarias, de
        2013-2014 a 2025-2026. Los doce por lo que piden: tres son ecuación
        integral —2017-2018, 2018-2019 y 2024-2025—, dos son un sistema de dos
        ecuaciones —2022-2023 y 2023-2024—, dos tienen el segundo miembro a
        trozos —2020-2021 y 2023-2024, que es las dos cosas—, dos son
        antitransformar un cociente —2016-2017 y el primero de 2021-2022—, uno
        pide la misma EDO por tres caminos distintos —2013-2014—, uno es una
        integral impropia que la tabla resuelve sola —2015-2016—, uno es
        aplicado —el barco de 2021-2022— y uno tiene coeficientes variables, con
        la te multiplicando —2025-2026—.
    dominio: >-
      Reconocer en menos de un minuto cuál de los cuatro casos tienes delante, y
      saber que las condiciones iniciales entran al transformar y no hay que
      volver a por ellas. Si al terminar te sobra alguna constante, es que las
      has perdido por el camino.
    escalones:
      - id: ir-y-volver
        titulo: Ir y volver por el dominio de s
        aprendes: >-
          Transformar con la tabla, despejar la incógnita algebraicamente, y
          antitransformar descomponiendo en fracciones simples.
        dominio: >-
          Que el rodeo te salga solo, y que en la vuelta reconozcas los tres
          casos del denominador — raíces distintas, raíz doble, y el que no
          factoriza y hay que completar el cuadrado.
        teoria:
          tema: t10-laplace
          apartado: el-rodeo-que-es-la-idea-entera
        ejercicios:
          - id: ej-transformada-con-la-tabla
            incrustado: true
            nota: >-
              La ida, con la tabla y la linealidad. Y el signo del denominador
              en la exponencial, que es lo único con trampa.
          - id: ej-inversa-fracciones-simples
            incrustado: true
            nota: >-
              La vuelta. Con el método de cubrir, que hace las fracciones
              simples en treinta segundos.
          - id: ex1617-ord-6-una-raiz-doble-y-un-seno
            nota: >-
              De 2016-2017, y es el ejercicio de descomponer: una raíz doble
              obliga a dos fracciones, no a una.
          - id: ex2122-ord-7-la-antitransformada-de-un-cociente
            nota: >-
              De 2021-2022, y es el tercer caso: el denominador no tiene raíces
              reales, así que no hay fracciones simples que valgan y hay que
              completar el cuadrado.

      - id: convolucion
        titulo: Las ecuaciones integrales, y la convolución
        aprendes: >-
          Reconocer una convolución dentro de una integral y usar que su
          transformada es el producto de las transformadas.
        dominio: >-
          Que al ver una integral de $0$ a $t$ con $(t-u)$ y $u$ en factores
          separados pienses «convolución» sin que nadie diga la palabra. Y que
          sepas que sin Laplace no hay forma razonable de atacarla.
        teoria:
          tema: t10-laplace
          apartado: para-qué-compensa-de-verdad
          nota: >-
            Es el caso que justifica el tema entero: una ecuación con la
            incógnita dentro de una integral no la resuelve ninguna técnica del
            tema 9.
        ejercicios:
          - id: ecuacion-integral-convolucion
            nota: >-
              De 2015-2016. Y ojo al factorial de la tabla al volver: $1/s^{4}$
              no es $t^{3}$, es $t^{3}/6$.
          - id: ecuacion-integral-que-da-un-seno
            nota: >-
              Del boletín, y es el mismo mecanismo que el de 2017-2018 con la
              cuenta más corta. Hazlo primero.
          - id: ex1819-ord-7-una-ecuacion-integral-por-laplace
            nota: >-
              De 2018-2019, el mismo esquema con otra función dentro.
          - id: ex1718-ord-6-una-ecuacion-integral-que-da-un-seno
            nota: >-
              De 2017-2018. La convolución es con $t$, y de ahí sale un seno
              donde no se esperaba ninguno.
          - id: ex1920-11-la-ecuacion-con-una-integral-dentro
            nota: >-
              Del examen de mayo-junio de 2020, y el mismo molde: la integral
              del enunciado es una convolución disfrazada.
          - id: ex2425-ord-7-la-integral-que-se-resuelve-con-laplace
            nota: >-
              De 2024-2025, y trae la sorpresa: la solución no es única, son
              todas las constantes a la vez.

      - id: a-trozos
        titulo: El segundo miembro que se enciende tarde
        aprendes: >-
          Escribir con la función escalón un segundo miembro definido a trozos,
          transformarlo, y deshacer el desplazamiento al volver.
        dominio: >-
          Que ante «la fuerza empieza a actuar en $t=2$» escribas el escalón sin
          pensarlo, y que en la vuelta no te olvides de que todo lo que
          acompaña a $e^{-2s}$ va evaluado en $t-2$ y multiplicado por el
          escalón.
        teoria:
          tema: t10-laplace
          apartado: el-escalón-que-es-como-se-escribe-a-partir-de
          nota: >-
            El escalón no calcula: traduce. Y hay que mirar si el argumento
            lleva el mismo retraso que el escalón antes de aplicar la regla,
            porque $t^{2}u(t-3)$ y $(t-3)^{2}u(t-3)$ no se transforman igual.
        ejercicios:
          - id: ej-escalon-y-retraso
            incrustado: true
            nota: >-
              Empieza aquí. Una función a trozos escrita en una línea, y su
              transformada. Sin ecuación diferencial alrededor.
          - id: retraso-en-el-tiempo
            nota: >-
              El caso limpio, sin ecuación diferencial alrededor: solo la
              transformada y la vuelta.
          - id: ex2021-ord-7-una-edo-que-arranca-en-t-igual-a-dos
            nota: >-
              De 2020-2021. Una EDO en reposo hasta el segundo dos, que es
              cuando aparece la fuerza.
          - id: ex2324-ord-8-un-arranque-retrasado-dos-segundos
            nota: >-
              De 2023-2024, y es las dos cosas a la vez: un **sistema** que
              además arranca tarde. Es el más largo de los doce.
          - id: ex1920-12-el-empujon-que-llega-tarde
            nota: >-
              Del examen global de mayo-junio de 2020. La fuerza entra en $t=2$ **con la
              frecuencia propia del sistema**, así que a partir de ahí hay resonancia con
              retraso: el factor que crece es $t-2$, no $t$.

      - id: sistemas
        titulo: Dos ecuaciones acopladas, que se vuelven un sistema lineal
        aprendes: >-
          Transformar las dos ecuaciones de un sistema, resolver el sistema
          algebraico que sale, y antitransformar las dos incógnitas.
        dominio: >-
          Que veas dos EDOs acopladas y pienses «esto es un sistema de dos
          ecuaciones con dos incógnitas, de bachillerato». Toda la dificultad
          está en no equivocarse con las condiciones iniciales de las dos.
        teoria:
          tema: t10-laplace
          apartado: para-qué-compensa-de-verdad
          nota: >-
            El segundo caso donde Laplace gana de calle: acoplar y desacoplar a
            mano cuesta mucho más que transformar y despejar.
        ejercicios:
          - id: ej-edo-entera-con-laplace
            incrustado: true
            nota: >-
              El rodeo completo sobre la ecuación más corta posible, antes de meter dos incógnitas.
          - id: sistema-de-edos-con-laplace
            nota: >-
              De 2016-2017, y es el sistema en su forma más limpia.
          - id: sistema-que-sale-en-espiral
            nota: >-
              Del boletín, y conviene hacerlo antes: la solución gira, así que
              si a ti no te salen senos y cosenos hay un error en la
              descomposición.
          - id: ex2223-ord-8-un-sistema-de-dos-ecuaciones-por-laplace
            nota: >-
              De 2022-2023. Las dos incógnitas acaban dando la misma respuesta,
              y eso es una comprobación gratis.
          - id: ex1314-ord-4-la-misma-edo-de-tres-maneras
            nota: >-
              De 2013-2014, y es el mejor para entender por qué se hace así: el
              enunciado pide la **misma** ecuación por Laplace directo, como
              sistema, y por coeficientes indeterminados. Tres caminos, un
              resultado.

      - id: los-dos-casos-raros
        titulo: Los dos casos raros, que también han caído
        aprendes: >-
          Resolver una ecuación con la $t$ multiplicando —derivando la
          transformada— y calcular una integral impropia leyendo la definición
          al revés.
        dominio: >-
          Que al ver una $t$ delante de $y'$ o $y''$ pienses «derivar $F$», y
          que al ver una integral de cero a infinito con un $e^{-st}$ dentro no
          integres nada: eso es un valor de la tabla.
        teoria:
          tema: t10-laplace
          apartado: cuando-la-t-multiplica-coeficientes-variables
          nota: >-
            Los dos son un ejercicio de once, así que no son el pan de cada
            día — pero los dos son de los que se dejan en blanco si no se han
            visto nunca, y con verlos una vez basta.
        ejercicios:
          - id: ej-transformada-con-la-tabla
            nota: >-
              La transformada con la tabla, antes del caso raro.
          - id: ex2526-ord-7-laplace-con-coeficientes-variables
            nota: >-
              De 2025-2026. La ecuación en $Y(s)$ que sale es de primer orden y
              separable, y la solución es $y=e^{2t}$ — con una sola constante
              que cumple las **dos** condiciones iniciales, que es la señal de
              que vas bien.
          - id: ex1516-ord-4-una-integral-impropia-por-laplace
            nota: >-
              De 2015-2016, y es el más corto de los doce: una línea. La
              respuesta es $17!/5^{18}$, y dejarla así es una respuesta
              completa.
    falta:
      - >-
        El tema 10 tiene **tres ejemplos de entrada propios para veinticuatro
        ejercicios de examen**. La mayoría de los escalones de este bloque
        empiezan con uno de ellos o con un ejercicio del boletín, pero
        «los dos casos raros» arranca directamente en examen y ese salto está
        reconocido: si llegas ahí sin haber visto una transformada con
        coeficientes variables, la tabla del tema no basta.
      - >-
        La prosa del tema 10 no nombra la **resonancia** ni los **coeficientes
        indeterminados**, y dos ejercicios de Laplace los usan. Están
        explicados en el tema 9, en el apartado de segundo orden.

  # ─────────────────────────────────────────────────────────────────────
  - id: solidos
    titulo: El sólido, que hay que dibujar antes de integrar
    pide: >-
      Un sólido definido por dos o tres desigualdades — dentro de un
      paraboloide, dentro de un cono, por debajo de un plano — del que se pide
      dibujarlo y calcular su volumen, el área de su superficie o su centro de
      gravedad.
    porque: >-
      **Diez ejercicios en diez de las once convocatorias** — solo falta en
      2017-2018 —, y es el bloque que esta ruta no tenía. Nueve de los diez son
      cuerpos de revolución formados por dos superficies que se cortan, y el
      trabajo entero está en hallar dónde se cortan: con eso salen los límites,
      y con los límites el ejercicio es mecánico.
    invariante:
      anios: 10
      fuente: >-
        Contado sobre los segundos parciales de las once ordinarias. Se pide
        volumen en la mayoría, **área de la superficie en cuatro** —2013-2014,
        2015-2016, 2016-2017 y 2021-2022— y **centro de gravedad en dos**
        —2013-2014 y 2025-2026—. Las parejas de superficies que se repiten:
        paraboloide con cono en 2013-2014 y 2021-2022 —el mismo sólido—,
        paraboloide con esfera en 2015-2016, cono con paraboloide en 2016-2017.
    dominio: >-
      Ante dos desigualdades con $x^{2}+y^{2}$, escribir el radio de cada
      superficie en función de $z$, igualarlos para hallar la altura del corte,
      y montar la integral en cilíndricas sin volver a mirar el enunciado. Y
      antes de integrar nada, mirar la simetría: si el sólido es de revolución,
      dos de las tres coordenadas del centro de gravedad son cero y se dice, no
      se calcula.
    escalones:
      - id: donde-se-cortan
        titulo: Dónde se cortan las dos superficies
        aprendes: >-
          Hallar la curva de intersección de dos superficies y traducirla en los
          límites de la integral.
        dominio: >-
          Que la ecuación del corte te salga en una línea, y que al resolverla
          **descartes en voz alta** la raíz que no cumple las otras condiciones.
          Casi siempre hay dos soluciones y solo una vale.
        teoria:
          tema: t07-integral-multiple
          apartado: cuando-el-recinto-es-redondo-polares
          nota: >-
            El corte de dos superficies de revolución es una circunferencia, y
            eso es lo que convierte el problema en unas polares con el radio
            dependiendo de la altura.
        ejercicios:
          - id: cono-y-paraboloide
            nota: >-
              Volumen y superficie del mismo cuerpo, con el corte hecho paso a
              paso.
          - id: volumen-entre-dos-paraboloides
            nota: >-
              Del boletín, y es el corte más simple de todos: dos paraboloides
              que se cortan en una circunferencia. Con este hecho, los de examen
              son el mismo trabajo con otra figura.
          - id: ex1617-ord-5-el-cono-tapado-por-un-paraboloide
            nota: >-
              De 2016-2017. Las mismas dos superficies que el anterior, con los
              papeles cambiados: aquí el cono va abajo.
          - id: ex2526-ord-5-el-solido-bajo-la-tapa
            nota: >-
              De 2025-2026, el más reciente, y con tapa plana: el corte es con
              un plano, que es el caso fácil.
          - id: ex2021-ord-5-el-cono-sobre-medio-disco
            nota: >-
              De 2020-2021, y con el corte al revés: el volumen te lo dan y lo
              que hay que hallar es el radio del recinto.
          - id: ex1920-6-el-cono-que-tapa-al-paraboloide
            nota: >-
              Del examen global de mayo-junio de 2020. Dos superficies escritas con la
              misma combinación $9x^2+3y^2$, así que un solo cambio estira los dos ejes y
              deja el sólido de revolución.

      - id: que-coordenadas
        titulo: Cilíndricas o esféricas, y por qué
        aprendes: >-
          Elegir el sistema de coordenadas mirando la forma del sólido, y no
          olvidar el jacobiano que corresponde.
        dominio: >-
          Que la elección sea de diez segundos: eje de simetría, cilíndricas;
          centro de simetría o esferas y conos por el vértice, esféricas. Y que
          el $\rho$ de las cilíndricas y el $r^{2}\operatorname{sen}\varphi$ de
          las esféricas te salgan sin mirar.
        teoria:
          tema: t07-integral-multiple
          apartado: integrales-triples-y-qué-coordenadas-elegir
        ejercicios:
          - id: ej-polares-primera
            incrustado: true
            nota: >-
              Empieza en el plano, con el jacobiano más simple de todos. Sin
              esto, las cilíndricas no se entienden.
          - id: cilindricas-o-esfericas
            nota: >-
              El mismo sólido de las dos maneras, para ver cuál sale más corta
              y por qué.
          - id: ex1819-ord-5-el-cucurucho-esferico
            nota: >-
              De 2018-2019, y es el caso donde las esféricas lo resuelven casi
              solas: un cono con una tapa de esfera centrada en el vértice.
          - id: ex2425-ord-5-el-dominio-en-forma-de-cucurucho
            nota: >-
              De 2024-2025, y el motivo de cambiar de coordenadas está a la
              vista: en cartesianas el dominio son dos trozos, y en polares uno.

      - id: cambiar-el-orden
        titulo: Cuando el orden que te dan no se puede integrar
        aprendes: >-
          Reescribir una integral doble en el otro orden, dibujando el recinto
          para leer los límites nuevos.
        dominio: >-
          Que el dibujo del recinto salga antes que los límites, y que
          reconozcas el aviso: cuando la primitiva de dentro no existe, el
          problema es el orden, no la integral.
        teoria:
          tema: t07-integral-multiple
          apartado: cambiar-el-orden-de-integración
          nota: >-
            El apartado entero va de esto, y trae el caso en que cambiar el
            orden convierte dos integrales en una.
        ejercicios:
          - id: ej-recinto-y-limites
            nota: >-
              Leer los límites de un recinto dibujado, que es lo que hay que hacer antes de invertir el orden.
          - id: ex1920-7-cambiar-el-orden-y-que-sobre-una-integral
            nota: >-
              Del examen de mayo-junio de 2020, y el título dice el premio: al
              cambiar el orden, de dos integrales queda una.
          - id: ex2324-ord-7-el-prisma-de-tapa-parabolica
            nota: >-
              De 2023-2024, y pide los dos órdenes: el mismo volumen escrito de
              las dos maneras, que es la forma de comprobarlo.

      - id: el-area-de-la-superficie
        titulo: El área de la superficie, que no es el área de su sombra
        aprendes: >-
          Calcular cuánta chapa hace falta para construir el sólido: la integral
          doble con la raíz, y el atajo de los cuerpos de revolución.
        dominio: >-
          Que ante «calcular el área de su superficie» escribas una integral
          **doble** y no una triple, que no te dejes ninguna cara —un sólido de
          dos superficies tiene dos áreas que sumar— y que sepas que la raíz
          nunca vale menos de $1$, así que el área nunca sale menor que la de la
          sombra.
        teoria:
          tema: t07-integral-multiple
          apartado: el-área-de-una-superficie-que-no-es-el-área-de-su-sombra
          nota: >-
            El apartado se escribió el 26 de agosto de 2026 precisamente porque
            esta ruta lo echó en falta: cuatro de los diez ejercicios lo piden y
            el tema no lo explicaba.
        ejercicios:
          - id: ej-area-de-un-plano-inclinado
            incrustado: true
            nota: >-
              Empieza aquí. Un plano se inclina igual en todos sus puntos, así
              que el factor es constante y no hay que integrar nada: la fórmula
              se ve sin que la cuenta la tape.
          - id: cono-y-paraboloide
            nota: >-
              El mismo cuerpo, volumen y superficie, con las dos caras sumadas.
          - id: ex1516-ord-5-el-cuenco-con-tapa-esferica
            nota: >-
              De 2015-2016. Paraboloide abajo y casquete esférico arriba: dos
              superficies, dos integrales y dos técnicas distintas.

      - id: lo-que-se-pide-al-final
        titulo: El centro de gravedad, y la simetría que ahorra integrales
        aprendes: >-
          Montar las cuatro integrales del centro de gravedad, y usar la
          simetría para no calcular lo que se puede afirmar.
        dominio: >-
          Que sepas que el centro de gravedad son **cuatro** integrales y no
          una, que todas van sobre el mismo recinto, y que en un sólido de
          revolución dos de ellas sobran por simetría. Decirlo con esa frase
          vale los mismos puntos que calcularlo.
        teoria:
          tema: t07-integral-multiple
          apartado: para-qué-sirve-todo-esto
          nota: >-
            La tabla de las cinco aplicaciones, con el atajo de la simetría
            escrito en la frase exacta que puntúa.
        ejercicios:
          - id: centro-de-gravedad-elipse
            nota: >-
              El centro de gravedad en el plano, que es donde se entiende la
              mecánica de las cuatro integrales.
          - id: centro-de-gravedad-de-una-figura
            nota: >-
              Del boletín, y el paso siguiente: la misma cuenta sobre una figura
              recortada, que es como viene en el examen.
          - id: ex1314-ord-6-el-cuenco-rematado-en-cono
            nota: >-
              De 2013-2014, y trae las tres cosas: dibujo, área de la superficie
              y centro de gravedad. La altura sale $25/8$, **por encima** de la
              mitad, que es justo lo contrario de lo que uno diría mirándolo.
          - id: ex2223-ord-5-la-esfera-cortada-por-el-cilindro
            nota: >-
              De 2022-2023. El sólido de Viviani, y el único de los diez que no
              es de revolución alrededor del eje $z$.
    falta:
      - >-
        El tema 7 tiene ahora un solo ejemplo introductorio de superficies —el
        plano inclinado— y ninguno de revolución. Entre ese ejemplo y el examen
        de 2015-2016 hay un salto: falta un escalón intermedio, un cuerpo
        curvado sencillo del que salga la integral en polares sin nada más
        alrededor.

  # ─────────────────────────────────────────────────────────────────────
  - id: fourier
    titulo: Fourier, que es el último y siempre el mismo
    pide: >-
      Dada una función periódica definida a trozos —o una función a la que hay
      que ampliar par o imparmente—, dibujarla, calcular su serie de Fourier,
      dar el valor de la serie en unos puntos concretos, y sumar una serie
      numérica.
    porque: >-
      **Diez ejercicios en diez de las once convocatorias** —solo falta en
      2013-2014—, y es el bloque más predecible de la asignatura: cambia la
      función, no las preguntas. Medido apartado por apartado sobre los diez:
      nueve piden dibujar, nueve piden la serie con esas palabras, ocho piden
      los valores de $S(t)$ en puntos concretos y **nueve acaban sumando una
      serie numérica**.
    invariante:
      anios: 10
      fuente: >-
        Contado sobre los diez ejercicios de Fourier de los segundos parciales
        de las once ordinarias, buscando en cada enunciado «dibujar», «serie de
        Fourier», «valores de S(t)» y una suma. El único que no acaba sumando
        una serie es el de 2023-2024. Y en cuatro de los diez la función hay que
        ampliarla antes: par en 2017-2018 y 2020-2021, impar en 2023-2024 y
        2025-2026.
    dominio: >-
      Ante una función periódica a trozos, mirar la paridad antes de integrar,
      calcular la serie, y contestar los valores en puntos grandes reduciendo al
      periodo básico y aplicando Dirichlet donde haya salto. Y saber que cuando
      te piden $S(t)$ y $f(t)$ juntos es porque no coinciden.
    escalones:
      - id: ampliar
        titulo: Ampliar media función, que es el apartado a)
        aprendes: >-
          Construir la ampliación par o impar de una función dada en medio
          intervalo, dibujarla con su periodicidad, y leer en la simetría qué
          coeficientes se anulan.
        dominio: >-
          Que ante «obtener la ampliación impar y periódica» no dudes: reflejas
          cambiando el signo, copias el periodo a los dos lados, y **antes de
          integrar** escribes «como $F$ es impar, $a_n=0$». Y que sepas dónde
          quedan los saltos, porque son los puntos que te van a preguntar
          después.
        teoria:
          tema: t11-fourier
          apartado: la-ampliación-cuando-solo-te-dan-media-función
          nota: >-
            La par no salta en el origen y la impar sí en los extremos. Esa
            diferencia no es estética: decide las respuestas del apartado de
            Dirichlet.
        ejercicios:
          - id: ej-ampliar-y-reducir
            incrustado: true
            nota: >-
              Empieza aquí. Ampliar y reducir un argumento, las dos preguntas
              que el examen hace siempre, y ninguna exige una integral.
          - id: ex2526-ord-8-fourier-de-la-ampliacion-impar
            nota: >-
              De 2025-2026. Ampliación impar de $t+\pi$, dibujarla, la serie, y
              los valores en $-5\pi$ y $\tfrac{25}{2}\pi$.
          - id: ex2021-ord-8-la-ampliacion-par-de-una-recta
            nota: >-
              De 2020-2021, y el mismo apartado con la ampliación **par**. Los
              dos juntos enseñan la diferencia mejor que cualquier explicación.
          - id: ex1718-ord-7-la-extension-par-de-la-identidad
            nota: >-
              De la ordinaria de 2017-2018. Una recta convertida en onda triangular: la
              ampliación par de $t$, que es la que sale de la mitad de los enunciados.
          - id: ex2324-ord-9-fourier-de-la-rampa-corta
            nota: >-
              De 2023-2024, y con el detalle que despista: la rampa solo ocupa
              media onda, así que el resto del periodo es cero y también hay que
              integrarlo.

      - id: dirichlet
        titulo: Dirichlet, y los puntos que el examen elige con mala idea
        aprendes: >-
          Decir a qué converge la serie en un punto, distinguiendo continuidad
          de salto, y reducir argumentos grandes al periodo básico.
        dominio: >-
          Que $S(2024\pi)$ no te asuste: reduces al periodo, miras si es salto,
          y aplicas la media. Y que cuando te piden $S$ y $f$ en el mismo punto
          sepas que la respuesta son dos números distintos.
        teoria:
          tema: t11-fourier
          apartado: reducir-el-argumento-que-es-lo-primero
          nota: >-
            Ocho de los diez ejercicios traen este apartado, y los puntos no se
            eligen al azar: uno de continuidad, uno de salto y uno con el
            argumento enorme para obligarte a reducir. El subapartado trae los
            cinco puntos reales de 2023-2024 y 2024-2025, reducidos uno a uno.
        ejercicios:
          - id: ej-dirichlet-en-el-salto
            incrustado: true
            nota: >-
              Dos puntos de la misma función: uno de salto y otro de
              continuidad. La diferencia entre los dos es la pregunta.
          - id: ej-un-coeficiente-integrado
            incrustado: true
            nota: >-
              Un coeficiente calculado con la integral entera, para saber de dónde sale la serie sobre la que se aplica Dirichlet.
          - id: cuando-la-funcion-ni-existe
            nota: >-
              Del boletín, y es el caso extremo de Dirichlet: en ese punto la
              función no está definida y la serie sí converge. Con esto
              entendido, los saltos son fáciles.
          - id: serie-de-f-igual-t
            nota: >-
              De 2015-2016, y trae los tres casos: continuidad, argumento grande
              que hay que reducir, y salto. Y acaba sumando una serie.
          - id: ex2526-ord-8-fourier-de-la-ampliacion-impar
            nota: >-
              De 2025-2026. Los puntos son $-5\pi$ y $\tfrac{25}{2}\pi$: el
              primero cae justo en un salto de la ampliación impar.

      - id: sumar-series
        titulo: Sumar una serie numérica evaluando la de Fourier
        aprendes: >-
          Elegir el punto donde evaluar la serie para que la igualdad se
          convierta en la suma numérica que te piden.
        dominio: >-
          Saber elegir el punto: uno donde se anulen los términos que sobran, y
          comprobar antes si ese punto es de salto — porque entonces el lado
          izquierdo no es $f$, es la media.
        teoria:
          tema: t11-fourier
          apartado: el-apartado-que-sorprende-sumar-una-serie-numérica
          nota: >-
            Es una suma que con los criterios del tema 2 no sabrías calcular:
            aquellos dicen si converge, no a cuánto. Y cae en nueve de los diez.
        ejercicios:
          - id: extension-par-de-t
            nota: >-
              De 2017-2018, y da $\pi^{2}/8$ — que es la misma suma que pidieron
              2018-2019 y, con otro disfraz, 2020-2021 y 2024-2025.
          - id: ex2122-ord-9-fourier-de-la-onda-cuadrada
            nota: >-
              De 2021-2022, y es de donde sale la serie de Leibniz. Esa suma
              —$\pi/4$— es la que más se repite: cinco de los diez.
          - id: ex1516-ord-7-el-diente-de-sierra-de-te
            nota: >-
              De 2015-2016. El diente de sierra clásico, y al final la serie de
              Leibniz, que es el remate que este hueco pide una y otra vez.
          - id: ex1617-ord-7-el-diente-de-sierra-de-menos-te
            nota: >-
              De 2016-2017, y es el de arriba con el signo cambiado. Ponerlos
              seguidos enseña qué cambia en los coeficientes y qué no.
          - id: ex2223-ord-9-fourier-de-la-escalera-de-dos-peldanos
            nota: >-
              De 2022-2023. La misma suma de Leibniz saliendo de una función que
              no se parece en nada a la onda cuadrada.

      - id: los-coeficientes
        titulo: Los coeficientes, que es la parte larga
        aprendes: >-
          Calcular $a_{0}$, $a_{n}$ y $b_{n}$ integrando por partes, y
          comprobar el resultado con un par de términos.
        dominio: >-
          Que la integral por partes con $t\operatorname{sen}(nt)$ te salga sin
          dudar del signo, y que sepas que $\operatorname{sen}(n\pi)=0$ y
          $\cos(n\pi)=(-1)^{n}$ son las dos simplificaciones que aparecen
          siempre al evaluar.
        teoria:
          tema: t11-fourier
          apartado: los-coeficientes-con-el-periodo-que-toque
          nota: >-
            Con el caso de siempre hecho entero —$f(t)=t$ en $(-\pi,\pi)$— y el
            aviso del periodo: cuando $T$ no es $2\pi$, el argumento del seno no
            es $nt$ y copiar la fórmula de memoria estropea la serie entera.
        ejercicios:
          - id: la-que-no-tiene-saltos
            nota: >-
              Una serie que coincide con la función en todas partes, así que el
              apartado de Dirichlet es trivial y queda solo el cálculo.
          - id: ex1819-ord-8-el-diente-de-sierra-con-media-onda-nula
            nota: >-
              De 2018-2019. Media onda vale cero, y eso no simplifica nada: hay
              que integrar igual, solo que en medio intervalo.
          - id: ex2425-ord-8-fourier-con-meseta
            nota: >-
              De 2024-2025, y el periodo no es $2\pi$ sino $4$. Cambia la
              fórmula de los coeficientes, y es donde más gente se equivoca.

  # ─────────────────────────────────────────────────────────────────────
  - id: edo
    titulo: La ecuación diferencial suelta
    pide: >-
      Resolver una EDO de segundo orden con coeficientes constantes, casi
      siempre con un segundo miembro que resuena, o una de primer orden que hay
      que clasificar antes.
    porque: >-
      **Siete de las once convocatorias**, y todas entre 2015-2016 y 2022-2023:
      **desde 2023-2024 no ha vuelto a caer una EDO suelta**. Su sitio lo ocupa
      ahora el ejercicio que cruza temas, que es el bloque siguiente. Se
      mantiene por dos motivos: siete de once es demasiado para tirarlo, y las
      técnicas siguen haciendo falta dentro de los ejercicios cruzados, donde la
      EDO es un apartado en vez de un ejercicio.
    invariante:
      anios: 7
      fuente: >-
        Contado sobre los segundos parciales de las once ordinarias: 2015-2016,
        2017-2018, 2018-2019, 2019-2020, 2020-2021, 2021-2022 y 2022-2023.
        Cuatro son de segundo orden con resonancia —2015-2016, 2017-2018,
        2020-2021 y 2021-2022—, dos son modelos escritos en palabras —el pez de
        2018-2019 y la epidemia de 2019-2020— y uno es un factor integrante
        dado hecho —2022-2023—.
      # Decía «seis» y se dejaba fuera 2019-2020, que trae dos: la epidemia y
      # la EDO con resonancia. Corregido en la auditoría del 28 de agosto de
      # 2026, contando sobre el corpus.
    dominio: >-
      Clasificar en menos de treinta segundos —separable, homogénea, exacta o
      lineal— y, en las de segundo orden, saber antes de empezar si el segundo
      miembro resuena con la homogénea, porque eso decide la forma de la
      particular y es donde se pierde el ejercicio.
    escalones:
      - id: clasificar
        titulo: Clasificar, que decide todo lo demás
        aprendes: >-
          Mirar una EDO de primer orden y decir cuál de los cuatro métodos le
          toca, antes de escribir nada.
        dominio: >-
          Que el árbol te salga en el orden bueno: primero mira si se separan
          las variables, luego si es homogénea, luego si es exacta, y lineal la
          última. Probar en otro orden funciona, pero cuesta el doble.
        teoria:
          tema: t09-ecuaciones-diferenciales
          apartado: lo-primero-es-clasificar-y-eso-decide-todo
        ejercicios:
          - id: ej-clasificar-cuatro-edos
            incrustado: true
            nota: >-
              Cuatro ecuaciones y ninguna hay que resolverla. Solo clasificar,
              que es lo que se evalúa de verdad.
          - id: ex2223-ord-7-un-factor-integrante-que-te-dan-hecho
            nota: >-
              De 2022-2023, y es el caso raro: el enunciado te regala el factor
              integrante y solo hay que comprobar que funciona y usarlo.

      - id: resonancia
        titulo: Cuando la particular ya está en la homogénea
        aprendes: >-
          Detectar que el segundo miembro es solución de la homogénea, y
          multiplicar la particular por $t$ tantas veces como haga falta.
        dominio: >-
          Que antes de proponer la particular compares el segundo miembro con
          las raíces de la característica, y que si el segundo miembro tiene dos
          partes las trates por separado — porque puede resonar una y la otra no.
        teoria:
          tema: t09-ecuaciones-diferenciales
          apartado: segundo-orden-dos-piezas-que-se-suman
          nota: >-
            La resonancia es el motivo de que la fórmula de la particular tenga
            ese factor $t^{k}$ que parece arbitrario: sin él, la propuesta se
            anula al sustituir y no queda nada que igualar.
        ejercicios:
          - id: particular-que-resuena
            nota: >-
              El caso limpio, para ver por qué la propuesta de siempre falla.
          - id: ex1516-ord-6-polinomio-mas-resonancia
            nota: >-
              De 2015-2016, y es el mismo caso siete años antes: un polinomio y
              un seno que resuena, con dos condiciones iniciales al final.
          - id: ex2122-ord-6-una-edo-con-resonancia-y-un-polinomio
            nota: >-
              De 2021-2022, y es el que hay que saber hacer: dos partes en el
              segundo miembro, una resuena y la otra no.
          - id: ex2021-ord-6-variacion-de-parametros-con-una-cosecante
            nota: >-
              De 2020-2021, y es el único de los seis donde los coeficientes
              indeterminados **no valen**: una cosecante no es de las formas
              que admite el método, y hay que ir a variación de parámetros.
          - id: ex1718-ord-5-resonancia-y-tipo-de-oscilacion
            nota: >-
              De la ordinaria de 2017-2018. Un término que resuena y otro que no, en la
              misma ecuación: el contraste que hace falta para no multiplicar por $x$
              cuando no toca.
          - id: ex1920-9-la-edo-con-resonancia-y-sin-ella
            nota: >-
              Del examen global de mayo-junio de 2020, y el mismo contraste con otros
              números. El $3$ del exponente y el $3$ del coseno son el mismo número y no
              significan lo mismo.

      - id: traducir-un-enunciado
        titulo: 'Cuando la ecuación no te la dan: la escribes tú'
        aprendes: >-
          Convertir un enunciado en palabras —una población, una epidemia, un
          pez que crece— en una ecuación diferencial con su condición inicial.
        dominio: >-
          Que sepas qué es la derivada en cada enunciado antes de escribir
          nada, y que la condición inicial la saques del propio texto en vez de
          dejar la constante suelta.
        teoria:
          tema: t09-ecuaciones-diferenciales
          apartado: traducir-un-enunciado-en-una-ecuación
          nota: >-
            El apartado trae las tres traducciones que caen: proporcional a lo
            que hay, proporcional a lo que falta, y proporcional al producto.
        ejercicios:
          - id: ej-lineal-con-factor-integrante
            incrustado: true
            nota: >-
              La lineal resuelta con su factor integrante. Los modelos aplicados de este escalón son todos lineales.
          - id: barra-que-se-calienta
            nota: >-
              Del boletín, y es la traducción de entrada: la ley de Newton del
              enfriamiento, donde la derivada es proporcional a la diferencia
              de temperaturas.
          - id: ex1819-ord-6-el-pez-de-bertalanffy
            nota: >-
              De 2018-2019, y es la traducción más limpia: la velocidad es
              proporcional a **lo que le falta** para llegar a su talla máxima.
          - id: ex1920-10-la-epidemia-en-un-pueblo-de-cien
            nota: >-
              Del examen de mayo-junio de 2020, y aquí el producto: la epidemia
              corre según cuántos hay contagiados **y** cuántos quedan sanos.
    falta:
      - >-
        El tema 9 tiene **dos ejemplos de entrada propios para treinta y seis
        ejercicios de examen**, y una sola figura: es la peor proporción de
        ejemplos de la asignatura. Los tres escalones de este bloque empiezan
        por un ejercicio del boletín, así que hay por dónde entrar, pero un
        ejercicio del boletín ya trae dificultad de examen.

  # ─────────────────────────────────────────────────────────────────────
  - id: cruce
    titulo: El ejercicio que cruza temas
    pide: >-
      Un enunciado largo, casi siempre con una superficie y una figura, donde
      hay que encadenar herramientas de temas distintos: plantear una ecuación
      diferencial a partir de un gradiente, resolverla, parametrizar la curva
      que sale, y calcular un trabajo sobre ella.
    porque: >-
      Nueve ejercicios en nueve convocatorias distintas, y lo que importa es
      **cuáles son los últimos**: 2023-2024, 2024-2025 y 2025-2026, o sea las
      tres más recientes, en el sitio donde antes iba la EDO suelta. Los seis
      anteriores se resolvían con una sola herramienta; los tres últimos, no.
      Ese cambio es la razón de que este bloque exista: no pide una técnica
      nueva, pide saber cuál usar en cada tramo, que es lo que un parcial no
      puede evaluar porque solo entran dos temas.
    invariante:
      anios: 8
      fuente: >-
        Los nueve ejercicios de los temas 6 y 8 en los segundos parciales de
        las ordinarias transcritas. De varias variables: las curvas de nivel de
        2016-2017, el gradiente implícito de 2020-2021, la bola que rueda de
        2023-2024 y el dron de 2025-2026. De integral curvilínea: el centroide
        de 2013-2014, la espiral de 2017-2018, el integrando constante de
        2019-2020, el trabajo que es un área de 2022-2023 y el montañero de
        2024-2025. Son nueve cursos distintos; ocho caen dentro de las once
        contiguas que mide esta ruta y 2013-2014 queda fuera, por eso el
        recuento dice ocho. Que los tres últimos sean de cruce y los seis
        anteriores no es lectura nuestra: los seis primeros se resuelven con
        una sola herramienta. El bloque enlaza además el barco de 2021-2022,
        que en el reparto es de Laplace y no cuenta en estos nueve: está aquí
        porque su primer apartado es un gradiente.
      # El recuento decía «siete ejercicios en seis convocatorias» hasta el 28
      # de agosto de 2026, y estaba mal por la misma causa que dejó 116
      # ejercicios sin enlazar: se habían quedado fuera el gradiente implícito
      # de 2020-2021 y el integrando constante de 2019-2020.
    dominio: >-
      Leer un enunciado de cinco líneas y saber decir, antes de escribir nada,
      qué herramienta toca en cada apartado y de qué tema viene. Si eso lo
      tienes, el ejercicio es tres ejercicios cortos seguidos.
    escalones:
      - id: leer-una-superficie
        titulo: 'Antes de cruzar nada: leer la superficie'
        aprendes: >-
          Sacar información de una función de dos variables sin resolver nada:
          dónde va una curva de nivel, y hacia dónde apunta el gradiente aunque
          la función esté dada en forma implícita.
        dominio: >-
          Que ante un mapa de niveles sepas dónde cae el que falta sin
          calcularlo, y que sepas derivar implícitamente cuando la función no se
          puede despejar.
        teoria:
          tema: t06-varias-variables
          apartado: las-curvas-de-nivel-son-la-función-vista-desde-arriba
          nota: >-
            Y el apartado de deducir el gradiente a partir de datos, que es el
            que resuelve el caso implícito.
        ejercicios:
          - id: ej-curva-de-nivel-basica
            incrustado: true
            nota: >-
              Empieza aquí: una sola curva de nivel, la que pasa por un punto
              dado. Sin esto, el primero de examen ya pide leer seis a la vez.
          - id: ex1617-ord-4-donde-va-la-curva-de-nivel-intermedia
            nota: >-
              De 2016-2017, y no lleva ni una cuenta: es leer el dibujo y decir
              por dónde pasa el nivel que falta.
          - id: ex2021-ord-4-perpendicular-a-una-curva-de-nivel-implicita
            nota: >-
              De 2020-2021, y sube un escalón: la función no se puede despejar,
              así que el gradiente sale derivando implícitamente.

      - id: trayectoria-del-gradiente
        titulo: La trayectoria de máxima pendiente
        aprendes: >-
          Plantear la ecuación diferencial que sigue una bola al rodar por una
          superficie, que es la que va en la dirección del gradiente.
        dominio: >-
          Reconocer que «rueda por la superficie» significa «sigue $-\nabla f$»,
          y que eso es una EDO cuya solución es la curva del plano.
        teoria:
          tema: t06-varias-variables
          apartado: el-gradiente-contesta-las-tres-preguntas
          nota: >-
            La bola baja por donde más pende, o sea en la dirección opuesta al
            gradiente. De ahí sale la ecuación, y a partir de ahí es el tema 9.
        ejercicios:
          - id: ej-gradiente-tres-preguntas
            incrustado: true
            nota: >-
              El repaso mínimo del gradiente antes de encadenarlo con la EDO.
          - id: la-bola-que-rueda
            nota: >-
              La cadena entera en un ejercicio, y es el que cayó en 2023-2024:
              plantear la EDO desde el gradiente, resolverla, y meter la curva
              otra vez en la superficie para hallar dónde para.
          - id: ex2324-ord-6-la-bola-que-rueda-por-la-cupula
            nota: >-
              Y el de 2023-2024 tal como cayó, con sus números y su cúpula.
          - id: ex2122-ord-8-el-barco-que-sigue-al-gradiente
            nota: >-
              De 2021-2022, y es el cruce más largo de los once años: el barco
              sigue el gradiente, eso da una ecuación diferencial, y la
              ecuación se resuelve con Laplace. Tres temas seguidos.
          - id: ex2526-ord-6-el-dron-del-fondo-del-mar
            nota: >-
              De 2025-2026, y añade el giro final: se calcula el trabajo de un
              campo que **no** es el gradiente, así que el atajo no vale.

      - id: encadenar
        titulo: De la curva al trabajo
        aprendes: >-
          Recorrer el ejercicio completo: EDO, curva solución, parametrización y
          trabajo del campo sobre ella.
        dominio: >-
          Que el cambio de tema entre apartados no te frene, y que antes de
          integrar hagas la comprobación de diez segundos: si el campo es
          conservativo, el trabajo depende solo de los extremos.
        teoria:
          tema: t08-integral-curvilinea
          apartado: parametrizar-describir-la-curva-con-un-solo-parámetro
          nota: >-
            La curva que sale de resolver la EDO es la que hay que parametrizar,
            y sobre ella se calcula el trabajo. Ese es el punto de costura.
        ejercicios:
          - id: ej-green-en-un-triangulo
            incrustado: true
            nota: >-
              Green con el integrando constante: la doble se convierte en el área, que es justo lo que hacen los tres de examen.
          - id: ej-conservativo-o-no
            incrustado: true
            nota: >-
              La comprobación de diez segundos que puede ahorrarte la integral
              entera.
          - id: ex2425-ord-6-el-montanero-y-la-ventisca
            nota: >-
              De 2024-2025, y es la cadena completa: resolver la EDO,
              parametrizar el camino de montaña que sale, y calcular el trabajo
              de la ventisca sobre él.
          - id: ex1920-8-la-curva-donde-el-integrando-es-constante
            nota: >-
              Del examen de mayo-junio de 2020, y es la comprobación llevada al
              extremo: sobre esa curva el integrando vale siempre lo mismo, así
              que la integral se hace mirándola.

      - id: green-y-el-area
        titulo: Green, y el trabajo que resulta ser un área
        aprendes: >-
          Cambiar una integral de línea sobre una curva cerrada por una integral
          doble sobre lo que encierra, y reconocer los casos en que esa doble ya
          es un área o un centro de gravedad conocidos.
        dominio: >-
          Que compruebes las dos hipótesis —curva cerrada y orientada al
          revés del reloj— antes de aplicarlo, y que al llegar a la doble mires
          si es un área o un momento antes de ponerte a integrar.
        teoria:
          tema: t08-integral-curvilinea
          apartado: green-cuando-la-curva-se-cierra
          nota: >-
            Y el caso que el examen repite: cuando $Q_x-P_y$ vale $1$, la
            integral de línea **es** el área encerrada.
        ejercicios:
          - id: ej-conservativo-o-no
            nota: >-
              Primero la comprobación de diez segundos: si el campo fuera
              conservativo, la integral sobre una curva cerrada valdría cero y
              no haría falta Green.
          - id: ex2223-ord-6-el-trabajo-en-la-espiral-y-su-area
            nota: >-
              De 2022-2023, y el mismo ejercicio cayó en 2017-2018. Aquí no hay
              cruce: es Green puro, y el trabajo resulta ser un área.
          - id: ex1718-ord-4-el-trabajo-en-la-espiral
            nota: >-
              De 2017-2018, el original. Ponerlos seguidos vale la pena: son el
              mismo enunciado con cinco años de diferencia.
          - id: ex1314-ord-5-green-con-el-centro-de-gravedad
            nota: >-
              De 2013-2014, fuera de las once contadas, y sube un escalón: la
              doble que sale no es un área sino un momento, y se resuelve con el
              centroide en vez de integrando.
    falta:
      - >-
        El tema 8 es el más corto de la asignatura —la mitad de palabras que
        cualquier otro— y tiene **una sola figura**, en un tema que va entero de
        curvas, orientaciones y regiones. Lo que más se echa de menos es un
        dibujo de qué hace Green: la curva cerrada por un lado, la región que
        encierra por el otro, y por qué la orientación decide el signo.

  # ─────────────────────────────────────────────────────────────────────
  - id: enteros
    titulo: Los segundos parciales enteros, cronometrados
    pide: >-
      Sentarte con el papel en blanco, sin apuntes y con reloj, y hacer los
      cuatro ejercicios del segundo parcial seguidos.
    porque: >-
      Los seis bloques anteriores entrenan cada hueco por separado, y eso no es
      lo que pasa en el aula: allí hay que repartir el tiempo y decidir por cuál
      empezar. Estos tres son los más recientes y representan el formato actual
      — cuatro ejercicios, y en los tres el cuarto es de cruce y no una EDO.
    dominio: >-
      Hacer uno entero dentro del tiempo, sin abrir ninguna pista, y que al
      corregirlo no haya ningún ejercicio en blanco. No se trata de acertarlo
      todo: se trata de que ningún hueco te pille sin saber por dónde empezar.
    material:
      - tipo: examen
        curso: '2025-2026'
        convocatoria: ordinaria
        nota: >-
          Empieza por el último. El cuadernillo trae los dos parciales; para
          esta ruta son los ejercicios 5 a 8.
      - tipo: examen
        curso: '2024-2025'
        convocatoria: ordinaria
      - tipo: examen
        curso: '2023-2024'
        convocatoria: ordinaria
        nota: >-
          Este trae el segundo parcial en los ejercicios 6 a 9, porque el
          primero tiene cinco.
    falta:
      - >-
        No hay cronómetro en la página, así que el reloj lo pones tú. Lo que vas
        resolviendo sí se recuerda, pero solo en este navegador: el sitio es
        estático y no tiene cuentas.
      - >-
        La página del examen presenta el cuadernillo entero, con sus dos
        parciales seguidos. No hay forma de abrir solo el segundo, que es el que
        esta ruta prepara.
      - >-
        Por lo mismo, el recuento de arriba —«te lleva por 28 de esos 86»— mide
        sobre el cuadernillo completo, y los 86 incluyen los 41 ejercicios del
        primer parcial, que son de los temas 1 a 5 y no se preparan aquí. Sobre
        los 45 del segundo parcial, que es lo que esta ruta cubre, la cuenta
        real es 28 de 45. El primer parcial se prepara con las rutas de la
        primera, la segunda y la tercera evaluación, que son de la misma
        materia.

  # ─────────────────────────────────────────────────────────────────────
  - id: formulario
    titulo: Lo que hay que llevar sabido
    pide: >-
      El examen no deja formulario ni calculadora. La tabla de transformadas,
      los jacobianos y las fórmulas de los coeficientes de Fourier hay que
      llevarlos en la cabeza.
    porque: >-
      Es lo que más se pierde por no saberlo de memoria, y no se puede deducir
      en el momento: un jacobiano mal puesto invalida la integral entera, y un
      par de la tabla de Laplace confundido da una función distinta sin que nada
      avise. Va el último porque es repaso, no aprendizaje: es el bloque del
      rato de antes de entrar.
    dominio: >-
      Escribir de memoria y en papel los tres jacobianos, los ocho pares de la
      tabla de Laplace y las tres fórmulas de los coeficientes de Fourier, sin
      consultar nada. Si tienes que mirar una sola vez, todavía no.
    material:
      - tipo: teoria
        tema: t07-integral-multiple
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          Los jacobianos de polares, cilíndricas y esféricas, y la regla de qué
          coordenadas elegir según la forma del sólido.
      - tipo: teoria
        tema: t10-laplace
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          La tabla, que es lo único que de verdad se usa, y los dos
          desplazamientos — el de $s$ y el de $t$ — que se confunden entre sí.
      - tipo: teoria
        tema: t11-fourier
        apartado: lo-que-hay-que-llevar-sabido
        nota: >-
          Las fórmulas de los coeficientes, la regla de Dirichlet y las cuatro
          sumas que salen de evaluar una serie en un punto.
    falta:
      - >-
        Las tres listas son una segunda copia de cosas que ya están explicadas
        en los temas, y eso tiene un riesgo: si un día se corrige la teoría y no
        se corrige aquí, esto miente. Se dice en voz alta porque no hay ningún
        guardián que lo compruebe.
      - >-
        No se puede imprimir solo el formulario: cada uno vive al final de la
        página de su tema, así que imprimir arrastra el tema entero.
