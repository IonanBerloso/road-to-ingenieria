      **Notas nuestras.** «Cocentricidad» y «perpendicularid» son erratas de la hoja por
      «concentricidad» y «perpendicularidad», y se dejan tal como están impresas.

      La figura es la de la hoja, redibujada desde sus cotas: una pieza de
      revolución cortada por su eje. Por fuera es un cilindro de Ø140 y 80 de alto, con un
      chaflán de 15 × 45° arriba. Por abajo tiene un agujero de Ø100, abierto, que acaba en una
      ranura de Ø105 y 5 de alto, cuyo techo está a 56 de la base; el agujero llega, pues, a 51,
      y esa cuenta es nuestra. B es la superficie exterior de Ø140; C, la del agujero de Ø100;
      D, el techo de la ranura; y E, la base. Las letras A, B, C y D con que empieza cada
      línea del enunciado son los apartados, no las superficies. La línea fina que cruza la
      base de lado a lado es la auxiliar de las cotas 80 y 56, como en el original.
    pide: Los marcos de tolerancia de los cuatro apartados, cada uno unido a su elemento y con su referencia si la lleva; aquí, qué va en el marco de A, qué apartados llevan letra, dónde van las flechas de A y de B, y cuántos marcos hay que dibujar.
    pasos:
      - tipo: reconocer
        pregunta: El apartado A pide una «cocentricidad de 0,05 mm de diámetro» entre Ø100 y Ø140. ¿Qué va en su marco?
        opciones:
          - texto: El símbolo de coaxialidad y 0,05, sin Ø
            mensaje: |
              El símbolo sí, el valor no. «De diámetro» quiere decir que la zona es un cilindro, y
              eso lo dice un Ø delante del valor (descripción, pág. 1, impresa 195): Ø0,05.
          - texto: El símbolo de coaxialidad, dos circunferencias concéntricas, y Ø0,05
            correcta: true
            mensaje: |
              Eso es. Entre dos cilindros es coaxialidad, y concentricidad entre dos puntos, con
              el mismo símbolo (descripción, págs. 16 y 17, impresas 210 y 211). El eje
              controlado tiene que caber en un cilindro de Ø0,05, «concéntrico con el eje de
              referencia» (diapositivas, pág. 27).
          - texto: El símbolo de posición, la circunferencia con la cruz que la sobrepasa, y Ø0,05
            mensaje: |
              La posición sitúa un eje a unas distancias de sus referencias (pág. 26). Que dos
              ejes coincidan es coaxialidad (pág. 27).
          - texto: El símbolo de redondez y 0,05
            mensaje: |
              La redondez es de forma: mira cada sección de una superficie sola, sin referencia
              (pág. 7). No relaciona un diámetro con otro.

      - tipo: calcular
        titulo: Los apartados que llevan referencia
        pregunta: |
          Numera los apartados: 1 el A, 2 el B, 3 el C y 4 el D. ¿Cuáles llevan letra de
          referencia en su marco?
        respuesta:
          tipo: conjunto
          valor: '1, 2, 4'
          tolerancia: 0.1
          formato: los números de los apartados, separados por comas
        distractores:
          - valor: '1, 2, 3, 4'
            mensaje: |
              La 3 es una cilindricidad, de forma, y las de forma van sin referencia (pág. 7).
              «Entre las superficies B y C» no hace a una referencia de la otra: son dos marcos,
              uno en cada superficie.
          - valor: '2, 4'
            mensaje: |
              Te falta la 1. Una coaxialidad alinea un eje con otro, y uno de los dos es la
              referencia: el eje controlado tiene que ser «concéntrico con el eje de referencia»
              (pág. 27).
          - valor: '1, 2'
            mensaje: |
              Te falta la 4. El paralelismo es de orientación, y una orientación siempre es
              respecto de algo: lleva referencia (pág. 7).
          - valor: '1, 4'
            mensaje: |
              Te falta la 2. La perpendicularidad es de orientación y lleva referencia (pág. 7):
              el eje de Ø140 si controlas la base E, o la base E si controlas el eje.
        pista: |
          La columna «Referencia» de la tabla de la pág. 7: las cuatro primeras de forma, sin
          referencia; las de orientación, localización y alabeo, con ella.
        desarrollo: |
          - **1, coaxialidad**: de localización, con referencia.
          - **2, perpendicularidad**: de orientación, con referencia.
          - **3, cilindricidad**: de forma, sin referencia; un marco en B y otro en C.
          - **4, paralelismo**: de orientación, con referencia.

          Llevan letra la 1, la 2 y la 4.

      - tipo: reconocer
        pregunta: Tomamos como referencia de A el eje de Ø140, que es también la de B; lo controlado en A es, entonces, el eje del agujero de Ø100. ¿Dónde va la flecha de su marco?
        opciones:
          - texto: Tocando la superficie C, separada de la cota
            mensaje: |
              Así se controla la superficie C, no su eje (tabla resumen, figuras 4 y 5). Para un
              eje, la flecha va en línea con la cota de ese diámetro.
          - texto: Sobre el eje de trazo y punto de la pieza
            mensaje: |
              Las diapositivas lo dibujan así alguna vez (pág. 5), pero aquí los dos cilindros
              comparten ese eje, y no se sabría cuál de los dos es el controlado. En línea con la
              cota de Ø100 no hay duda.
          - texto: En línea con la cota de Ø100, como prolongación de su línea de cota
            correcta: true
            mensaje: |
              Eso es. La flecha en línea con la cota controla el eje de lo que mide esa cota
              (tabla resumen, figura 4): el del agujero de Ø100. El triángulo de la referencia va
              igual, en línea con la cota de Ø140.
          - texto: En la cota de Ø140, que es el otro diámetro del apartado y el más grande de la pieza
            mensaje: |
              En la cota de Ø140 va el triángulo de la referencia, con su letra. La flecha señala
              lo controlado, y eso es el eje del agujero de Ø100.

      - tipo: reconocer
        pregunta: ¿Y la flecha del marco de B, el de perpendicularidad de 0,1 respecto del eje de Ø140?
        opciones:
          - texto: En línea con la cota de Ø140
            mensaje: |
              Eso señalaría el eje de Ø140, y ese eje es la referencia de B: lleva el triángulo,
              no la flecha. Lo controlado es la superficie E.
          - texto: En la superficie B, la de Ø140
            mensaje: |
              Cuidado con las letras: B es el apartado, y la superficie que pide es la E. De la
              superficie B, la de fuera, sale el eje de referencia de este marco, no lo que
              controla.
          - texto: En línea con la cota de 80, la de la altura de la pieza
            mensaje: |
              En línea con una cota, la flecha señala el eje o el plano de simetría de lo que mide
              (tabla resumen, figura 4): aquí, el plano que queda a 40 de la base. Lo que pide B
              es la base E.
          - texto: En la base E o en su prolongación, separada de las líneas de cota
            correcta: true
            mensaje: |
              Eso es. Lo controlado es la superficie E, y la flecha la toca, a ella o a su
              prolongación, claramente separada de las cotas (tabla resumen, figura 5). La zona
              son dos planos a 0,1 perpendiculares al eje de referencia (descripción, pág. 10,
              impresa 204).

      - tipo: calcular
        titulo: Cuántos marcos hay que dibujar
        pregunta: |
          Contando los de los cuatro apartados, y con una sola flecha en cada marco, ¿cuántos
          rectángulos de tolerancia hay que dibujar?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.1
          formato: un número entero
        distractores:
          - valor: '4'
            mensaje: |
              Uno por apartado deja la cilindricidad de C en una sola superficie. Es de forma y
              controla un elemento solo (pág. 7): para B y para C, dos marcos.
          - valor: '7'
            mensaje: |
              Has contado como marcos los dos recuadros de las referencias. Un triángulo con una
              letra en su recuadro marca la referencia: no es un rectángulo de tolerancia.
        pista: |
          Uno por apartado, salvo el que no puede relacionar sus dos superficies.
        desarrollo: |
          A, B y D, un marco cada uno. C, dos: la cilindricidad controla una superficie sola, y
          se pide en B y en C. En total, $1 + 1 + 2 + 1 = 5$.

      - tipo: dibujar
        consigna: |
          Copia la pieza en un folio y pon los marcos de los cuatro apartados, cada uno unido a su
          elemento, y las referencias que hagan falta, con su triángulo y su letra. Cuando lo
          tengas, compáralo con la figura y con la lista.
        comprueba:
          - punto: Cinco marcos, uno para A, uno para B, uno para D y dos para C, uno en la superficie B y otro en la C.
            porque: |
              La cilindricidad es de forma: controla una superficie sola y no lleva referencia
              (diapositivas, pág. 7). «Entre las superficies B y C» son dos superficies, y cada una
              lleva su marco. Un solo marco con dos flechas, una a cada superficie, dice lo mismo
              según la norma, pero el material no lo enseña: aquí van dos.
          - punto: Cada marco con sus casillas en orden, el símbolo, el valor y, si la lleva, la letra; y el de A con Ø delante del valor, Ø0,05.
            porque: |
              Es el rectángulo de la pág. 5. «De diámetro» quiere decir zona cilíndrica, y eso lo
              dice el Ø (descripción, pág. 1, impresa 195). B, C y D no lo piden: su zona son
              dos planos o dos cilindros coaxiales.
          - punto: Los valores en milímetros, como los da la hoja, 0,05, 0,1, 0,05 y 0,04.
            porque: |
              «Mismas unidades que la acotación» (pág. 5). Aquí la hoja ya los da en milímetros; en
              sus págs. 1 y 2 vienen en micras, y hay que pasarlos.
          - punto: La referencia del eje de Ø140, con su triángulo en línea con la cota de Ø140 y su letra, en el marco de A, y en el de B si la tomas también para él.
            porque: |
              Un eje se señala en línea con su cota, y «lo dicho para la flecha es aplicable
              asimismo al triángulo de referencia» (tabla resumen). Un triángulo apoyado en la
              superficie B haría referencia a la superficie, no al eje. En B la hoja no dice cuál
              manda: también vale al revés, la base E de referencia y el marco de
              perpendicularidad en línea con la cota de Ø140, que controla su eje.
          - punto: La flecha de A en línea con la cota de Ø100, y las de B, C y D tocando sus superficies, E, B, C y D, o su prolongación, separadas de las cotas; o, si en B tomas la base E de referencia, la de B en línea con la cota de Ø140.
            porque: |
              En línea con la cota, la flecha controla el eje; separada, la superficie (tabla
              resumen, figuras 4 y 5). En A se controla un eje; en los demás, caras.
          - punto: Una referencia para D, con su triángulo en la base E y su letra, y el marco de paralelismo en D con esa letra; o al revés, la referencia en D y el marco en E.
            porque: |
              El paralelismo es de orientación y lleva referencia (pág. 7), pero la hoja no dice
              cuál de las dos superficies lo es. Nosotros tomamos la base E, que ya queda atada
              al eje por el apartado B.
          - punto: Letras de referencia que no se confundan con los nombres de las superficies del dibujo.
            porque: |
              La figura ya usa B, C, D y E para nombrar superficies. Una referencia B puesta en el
              eje confundiría a quien lee el plano. Nosotros usamos A para el eje y E para la
              propia base E.
        figura: |
          <svg viewBox="0 0 400 284" role="img" width="400" height="284" aria-labelledby="t12tg3-sol-t t12tg3-sol-d">
            <title id="t12tg3-sol-t">La pieza de la pág. 3 con los cinco marcos de tolerancia y las dos referencias de la solución</title>
            <desc id="t12tg3-sol-d">Una pieza de revolución cortada por su eje, que va vertical, con las dos mitades rayadas. Por fuera es un cilindro de diámetro 140 y 80 de alto, con un chaflán de 15 por 45 grados en la arista de arriba. Por abajo tiene un agujero de diámetro 100, abierto, que sube hasta una ranura de diámetro 105 y 5 de alto; el techo de la ranura, una cara plana, está a 56 de la base. Cotas: diámetro 105 arriba; 80 y 15x45° a la izquierda; 5 y 56 a la derecha; diámetro 100 y diámetro 140 abajo. Una línea fina, la auxiliar de las cotas 80 y 56, recorre la base de lado a lado. Cuatro superficies llevan su nombre con una línea y un punto: B, la cara exterior de diámetro 140, a la derecha; C, la del agujero de diámetro 100, a la izquierda; D, el techo de la ranura; y E, la base. En color, la solución: un triángulo de referencia en línea con la cota de diámetro 140, a su izquierda, con la letra A, que es el eje de ese cilindro; un marco de coaxialidad, diámetro 0,05 y A, cuya flecha llega desde la derecha en línea con la cota de diámetro 100; un marco de perpendicularidad, 0,1 y A, cuya flecha sube hasta la prolongación de la base E, a la derecha de la pieza; dos marcos de cilindricidad, 0,05, sin letra, uno con la flecha en la cara B y otro, dentro del agujero, con la flecha en la cara C; un triángulo de referencia debajo de la base E, a la izquierda, con la letra E; y un marco de paralelismo, 0,04 y E, dentro del agujero, cuya flecha sube hasta el techo D.</desc>
