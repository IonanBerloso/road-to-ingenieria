ejercicios:
  # Decisión: los dos ejemplos usan las designaciones que pone el «Tema 7» de
  # ejemplo (págs. 13 y 19), sin cifras: las cifras son nuestras, rehechas de
  # las filas de la UNE-EN ISO 286-1 (k-t12a/guiones/ajustes.mjs).
  - id: ej-agujero-40-g7
    titulo: Las dos cotas de un agujero Ø40 G7
    fuente: Ejemplo introductorio · Road to Ingeniería, sobre la designación que pone de ejemplo el «Tema 7. Tolerancias dimensionales» (pág. 13) · Dpto. de Expresión Gráfica y Proyectos de Ingeniería, UPV/EHU. No es de examen ni de la hoja de ejercicios.
    nivel: ejemplo
    enunciado: |
      Un agujero lleva acotado Ø40 G7. ¿Entre qué dos medidas tiene que quedar para que la pieza
      valga?

      **Notas nuestras.** Las filas de la UNE-EN ISO 286-1:2011 que hacen falta: Tabla 1 (pág. 30
      de la norma), fila de 30 a 50 mm, IT7 = 25 µm; Tabla 2 (pág. 31), agujeros, fila de 30 a
      40 mm, G = +9 µm, que es la diferencia inferior. Son las págs. 1 y 2 de «Tablas ISO –
      Tolerancias dimensionales», el PDF de la asignatura.
    pide: La diferencia superior del agujero, en µm, y con ella sus cotas máxima y mínima.
    pasos:
      - tipo: reconocer
        pregunta: Antes de abrir la tabla, ¿qué dice la designación Ø40 G7?
        opciones:
          - texto: Que es un agujero, y que la G da su diferencia inferior; la superior sale sumándole IT7
            correcta: true
            mensaje: |
              Eso es. La mayúscula dice que es un agujero, y de la A a la H la tabla de agujeros da
              la diferencia **inferior**, la que está más cerca de la línea cero. La superior es esa
              más la anchura de la zona, el IT de calidad 7.
          - texto: Que es un eje, y que la Tabla 4 da su diferencia superior
            mensaje: |
              La letra es **mayúscula**, y las mayúsculas son agujeros. La g minúscula, la de los
              ejes, está en otra tabla y con el signo contrario.
          - texto: Que es un agujero, y que la G da su diferencia superior; la inferior es esa menos IT7
            mensaje: |
              La G deja el agujero por encima de la línea cero, pero el valor de la tabla es el borde
              **de abajo** de la zona: de la A a la H, la Tabla 2 da la diferencia inferior.
          - texto: Que es un agujero de 40 mm con una tolerancia de 7 µm
            mensaje: |
              El 7 es la **calidad**, no la tolerancia. La tolerancia es el IT de esa calidad en la
              fila de la cota nominal: IT7 vale 25 µm entre 30 y 50 mm.

      - tipo: calcular
        titulo: La diferencia superior
        pregunta: |
          ¿Cuánto vale la diferencia superior del agujero, $D_s$?
        respuesta:
          tipo: numero
          valor: '34'
          tolerancia: 1
          formato: un número, en µm
        distractores:
          - valor: '25'
            mensaje: |
              Eso es IT7 solo, como si el agujero fuera H7 y arrancara en la línea cero. La G lo
              sube 9 µm: a la diferencia inferior, +9, hay que sumarle los 25 de la zona.
          - valor: '16'
            mensaje: |
              Has partido de la g **minúscula** de la tabla de ejes, −9, y le has sumado el IT. Esa
              es la posición de un eje g7; el agujero G7 empieza en +9.
          - valor: '9'
            mensaje: |
              +9 es la diferencia **inferior**: de la A a la H la tabla de agujeros da el borde de
              abajo de la zona. El de arriba está una zona más allá, 25 µm por encima.
          - valor: '0.034'
            mensaje: |
              Eso son 34 µm escritos en milímetros. Aquí se pide en micras, que es como vienen las
              diferencias en la tabla; en milímetros va en la cota, 40,034.
        pista: |
          $D_s = D_i + IT$: la G da $D_i = +9$ µm, y la zona mide IT7 = 25 µm.
        desarrollo: |
          $$
          D_s = D_i + IT7 = 9 + 25 = 34
          $$

          Son micras. El agujero va de $40 + 0{,}009 = 40{,}009$ mm a $40 + 0{,}034 = 40{,}034$ mm.

      - tipo: justificar
        pregunta: Ordena cómo se lee la designación. Una pieza no debe entrar.
        piezas:
          - texto: La G es mayúscula, así que es un agujero, y su posición está en la Tabla 2.
          - texto: En la fila de 30 a 40 mm, la G vale +9 µm, y de la A a la H eso es la diferencia inferior.
          - texto: En la fila de 30 a 50 mm, IT7 = 25 µm, así que la diferencia superior es 9 + 25 = 34 µm.
          - texto: El agujero va de 40,009 a 40,034 mm, y nunca sale con los 40 mm justos de la nominal.
          - texto: Como la G queda por encima de la línea cero, el +9 de la tabla es su diferencia superior.
            trampa: true
            mensaje: |
              De la A a la H la tabla da el borde **inferior** de la zona, el más cercano a la línea
              cero. Leído al revés, el agujero iría de 39,984 a 40,009 mm, y eso ya no es un G7.
    resolucion: |
      **Qué dice la designación.** Ø40 es la cota nominal; la G mayúscula, la posición de la zona
      de un agujero; el 7, la calidad, que fija la anchura de la zona.

      **La anchura.** En la Tabla 1, fila de 30 a 50 mm, IT7 = 25 µm.

      **La posición.** En la Tabla 2, fila de 30 a 40 mm, la G vale +9 µm. De la A a la H, la
      tabla de agujeros da la diferencia inferior: $D_i = +9$ µm.

      **La otra diferencia.** $D_s = D_i + IT7 = 9 + 25 = 34$ µm.

      **Las cotas.** $C_{\min} = 40{,}009$ mm y $C_{\max} = 40{,}034$ mm. La zona entera queda por
      encima de la nominal: un agujero G7 nunca mide los 40 mm justos.

      El libro de la asignatura, «Normalización básica. Dibujo técnico», hace la misma cuenta en
      la pág. 8-9: puedes cotejarla allí.

  - id: ej-juegos-100-h11-d9
    titulo: Los juegos del ajuste Ø100 H11/d9
    fuente: Ejemplo introductorio · Road to Ingeniería, sobre la designación que pone de ejemplo el «Tema 7. Tolerancias dimensionales» (pág. 19) · Dpto. de Expresión Gráfica y Proyectos de Ingeniería, UPV/EHU. No es de examen ni de la hoja de ejercicios.
    nivel: ejemplo
    enunciado: |
      Un eje y un agujero se montan con el ajuste Ø100 H11/d9. ¿Qué juego queda entre los dos, como
      mucho y como poco?

      **Notas nuestras.** Las filas de la UNE-EN ISO 286-1:2011 que hacen falta: Tabla 1 (pág. 30
      de la norma), fila de 80 a 120 mm, IT9 = 87 µm e IT11 = 220 µm; Tabla 4 (pág. 34), ejes, fila
      de 80 a 100 mm, d = −120 µm, que es la diferencia superior. La H tiene la diferencia inferior
      nula. Son las págs. 1 y 5 de «Tablas ISO – Tolerancias dimensionales», el PDF de la
      asignatura.
    pide: El tipo de ajuste, y sus juegos máximo y mínimo en µm.
    pasos:
      - tipo: reconocer
        pregunta: |
          H11 arranca en la línea cero y sube; la d del eje tiene su diferencia superior en −120 µm.
          ¿Qué tipo de ajuste es?
        opciones:
          - texto: Móvil, porque la zona del agujero queda entera por encima de la del eje
            correcta: true
            mensaje: |
              Eso es. El agujero no baja de la nominal y el eje no sube de 120 µm por debajo de
              ella: entre las dos zonas siempre queda hueco, y el ajuste siempre tiene juego.
          - texto: Indeterminado, porque con calidades tan bastas, 11 y 9, las zonas se pisan
            mensaje: |
              La calidad dice **cuánto mide** la zona, no dónde está. El tipo lo decide la posición:
              la d deja el eje entero por debajo de la línea cero, y la H arranca en ella.
          - texto: Con apriete, porque el eje es más grande que el agujero
            mensaje: |
              Al revés. De la a a la h los ejes quedan por debajo de la línea cero, y cuanto más
              cerca de la a, más abajo: un eje d es más delgado que la nominal.
          - texto: No se puede saber sin calcular las cotas de las dos piezas
            mensaje: |
              Se ve sin cotas. La H empieza en la línea cero hacia arriba y la d termina 120 µm por
              debajo: las dos zonas no se tocan.

      - tipo: calcular
        titulo: El juego máximo
        pregunta: |
          ¿Cuánto vale el juego máximo, $J_{\max}$?
        respuesta:
          tipo: numero
          valor: '427'
          tolerancia: 1
          formato: un número, en µm
        distractores:
          - valor: '307'
            mensaje: |
              Has sumado las dos tolerancias, 220 + 87. Esa es la tolerancia del ajuste, lo que
              **varía** el juego. El juego máximo es mayor, porque el eje además empieza 120 µm por
              debajo de la línea cero.
          - valor: '340'
            mensaje: |
              Has restado las dos diferencias superiores, $D_s - d_s = 220 - (-120)$. El juego
              máximo junta el agujero **más grande** con el eje **más pequeño**: $D_s - d_i$, y el
              eje más pequeño es su diferencia inferior, −207.
          - valor: '187'
            mensaje: |
              Has tomado la d con signo más, +120. De la a a la h los ejes quedan por debajo de la
              línea cero: la d vale −120, y entonces $d_i = -120 - 87 = -207$. La tabla del libro
              (pág. 8-8) pone + delante de todas las cifras de los ejes; la norma, no: de la a a la
              h van por debajo de la línea cero.
          - valor: '0.427'
            mensaje: |
              Eso son 427 µm escritos en milímetros. Los juegos se dan en micras, como las tablas.
        pista: |
          El agujero va de 0 a +220 µm. El eje d9 va de $d_s = -120$ a $d_i = -120 - 87 = -207$ µm.
          El juego máximo junta el agujero más grande con el eje más pequeño.
        desarrollo: |
          $$
          J_{\max} = D_s - d_i = 220 - (-207) = 427
          $$

          Son micras: como mucho, el agujero es 0,427 mm más ancho que el eje.

      - tipo: calcular
        titulo: El juego mínimo
        pregunta: |
          ¿Y el juego mínimo, $J_{\min}$?
        respuesta:
          tipo: numero
          valor: '120'
          tolerancia: 1
          formato: un número, en µm
        distractores:
          - valor: '-120'
            mensaje: |
              Un juego negativo sería un apriete, y este ajuste es móvil. Has restado al revés, o
              has tomado la d como +120: $J_{\min} = D_i - d_s = 0 - (-120)$.
          - valor: '207'
            mensaje: |
              Has restado $D_i - d_i$. El juego mínimo junta el agujero **más pequeño** con el eje
              **más grande**: $D_i - d_s$, y el eje más grande es su diferencia superior, −120.
          - valor: '0.12'
            mensaje: |
              Eso son 120 µm escritos en milímetros. Los juegos se dan en micras, como las tablas.
        pista: |
          Agujero lo más pequeño, $D_i = 0$; eje lo más grande, $d_s = -120$ µm.
        desarrollo: |
          $$
          J_{\min} = D_i - d_s = 0 - (-120) = 120
          $$

          Y la tolerancia del ajuste, $T_J = J_{\max} - J_{\min} = 427 - 120 = 307$ µm, es la suma
          de las dos zonas, $220 + 87$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza no debe entrar.
        piezas:
          - texto: En la fila de 80 a 120 mm, IT11 = 220 µm, así que el agujero H11 va de 0 a +220 µm.
          - texto: En la fila de 80 a 100 mm, la d vale −120 µm; con IT9 = 87 µm, el eje d9 va de −120 a −207 µm.
          - texto: 'El juego máximo es Ds − di = 220 + 207 = 427 µm, y el mínimo, Di − ds = 0 + 120 = 120 µm.'
          - texto: 'Su diferencia, 307 µm, es la tolerancia del ajuste: la suma de las dos zonas, 220 + 87.'
          - texto: 'El juego máximo es Ds − ds = 220 + 120 = 340 µm: lo que se separan los dos bordes de arriba.'
            trampa: true
            mensaje: |
              Lo que se separan los dos bordes de arriba no es ningún juego. El juego máximo junta
              los extremos **opuestos**: el agujero en su máximo y el eje en su mínimo, $D_s - d_i$.
    resolucion: |
      **El agujero.** H11: la H tiene $D_i = 0$, y en la fila de 80 a 120 mm IT11 = 220 µm, así que
      $D_s = +220$ µm. Va de 100,000 a 100,220 mm.

      **El eje.** d9: en la Tabla 4, fila de 80 a 100 mm, la d da la diferencia superior,
      $d_s = -120$ µm; con IT9 = 87 µm, $d_i = -120 - 87 = -207$ µm. Va de 99,793 a 99,880 mm.

      **El tipo.** La zona del agujero queda entera por encima de la del eje: ajuste móvil.

      **Los juegos.**

      $$
      J_{\max} = D_s - d_i = 220 - (-207) = 427 \qquad J_{\min} = D_i - d_s = 0 - (-120) = 120
      $$

      Son micras. Con las cotas se llega a lo mismo: $100{,}220 - 99{,}793 = 0{,}427$ mm y
      $100{,}000 - 99{,}880 = 0{,}120$ mm.

      **La comprobación.** $T_J = 427 - 120 = 307$ µm, y $T + t = 220 + 87 = 307$ µm: la
      tolerancia del ajuste es la suma de las dos zonas.

  # Decisión: ningún paso pide la designación como respuesta. La solución
  # oficial da solo «Ø150 H8/f7 – Ø150 F8/h7», y con las mismas tablas cumplen
  # 23 ajustes de agujero único y 23 de eje único (guiones/ajustes.salida.txt);
  # los calcular piden los juegos del ajuste oficial, y el «¿cuál no sirve?»
  # tiene una sola respuesta aunque haya varios válidos.
  # Decisión: el d) (el dibujo) no tiene paso: su generador llega con la
  # unidad que dibuja las tres figuras. Sus cifras van en la resolución.
  - id: ajustes-1-un-ajuste-movil-de-150
    titulo: Un ajuste móvil de Ø150 con juego entre 40 y 150 µm
    fuente: Ejercicio 1 · «Ajustes – Tolerancias dimensionales», hoja de ejercicios de Expresión Gráfica, EIG · UPV/EHU. Solución oficial en la hoja de soluciones de la asignatura (fichero «Ejercicios – Solución»), que da solo las designaciones, Ø150 H8/f7 y Ø150 F8/h7.
    nivel: practica
    enunciado: |
      En un ajuste móvil el eje y el agujero tienen diámetros nominales de 150 mm. Si el juego debe
      estar comprendido entre 150 µm y 40 µm, calcula:

      a. La tolerancia del ajuste.

      b. Las dimensiones normalizadas del ajuste ISO, según el sistema de agujero único.

      c. Las dimensiones normalizadas del ajuste ISO, según el sistema de eje único.

      d. El dibujo del conjunto, indicando las zonas de tolerancia, dimensiones, cotas mínima y
      máxima y diferencias superior e inferior.

      **Notas nuestras.** Las filas de la UNE-EN ISO 286-1:2011 que hacen falta para 150 mm: Tabla 1
      (pág. 30 de la norma), fila de 120 a 180 mm, IT6 = 25 µm, IT7 = 40 µm, IT8 = 63 µm e
      IT9 = 100 µm; Tabla 2
      (pág. 31), agujeros, fila de 140 a 160 mm, F = +43 µm, que es la diferencia inferior; Tabla 4
      (pág. 34), ejes, la misma fila, e = −85 µm, f = −43 µm y g = −14 µm, que son la diferencia
      superior. La H y la h arrancan en la línea cero. Son las págs. 1, 2 y 5 de «Tablas ISO –
      Tolerancias dimensionales», el PDF de la asignatura. El dibujo del d) va contado en cifras en
      la resolución.
    pide: La tolerancia del ajuste, los juegos máximo y mínimo del ajuste de agujero único y el juego máximo del de eje único, en µm.
    pasos:
      - tipo: reconocer
        pregunta: El juego tiene que quedar entre 40 y 150 µm. ¿Qué dice eso de las dos zonas de tolerancia?
        opciones:
          - texto: Que la zona del agujero queda entera por encima de la del eje, y nunca a menos de 40 µm de ella
            correcta: true
            mensaje: |
              Eso es. Hasta el peor caso deja 40 µm de juego, así que nunca hay apriete: es un
              ajuste móvil, y sus juegos salen de $J_{\max} = D_s - d_i$ y $J_{\min} = D_i - d_s$.
          - texto: Que el agujero tiene 150 µm de tolerancia y el eje, 40 µm
            mensaje: |
              150 y 40 son **juegos**: lo que sobra entre agujero y eje en los dos casos extremos.
              Las tolerancias de cada pieza las eliges tú, y entre las dos tienen que caber en lo que
              va de un juego al otro.
          - texto: Que las dos zonas se pisan, y unas veces habrá juego y otras apriete
            mensaje: |
              Eso es un ajuste **indeterminado**, como el 2 de la misma hoja. Aquí el juego mínimo es
              positivo: las zonas no llegan a tocarse.
          - texto: Que la diferencia entre los dos juegos es la tolerancia del agujero
            mensaje: |
              Esa diferencia es lo que pueden sumar **las dos** piezas: la tolerancia del ajuste,
              $T + t$. Si se la das entera al agujero, el eje tendría que salir exacto.

      - tipo: calcular
        titulo: La tolerancia del ajuste
        pregunta: |
          Apartado a). ¿Cuánto vale la tolerancia del ajuste, $T_J$?
        respuesta:
          tipo: numero
          valor: '110'
          tolerancia: 1
          formato: un número, en µm
        distractores:
          - valor: '0.11'
            mensaje: |
              Eso son 110 µm escritos en milímetros. Las tolerancias y los juegos se dan en micras
              (1 µm = 0,001 mm), que es como vienen en las tablas.
          - valor: '190'
            mensaje: |
              Has sumado los dos juegos. Una suma, $J_{\max} + A_{\max}$, es la tolerancia de un
              ajuste **indeterminado**; en uno móvil es la diferencia, $J_{\max} - J_{\min}$.
          - valor: '103'
            mensaje: |
              103 es $T + t$ del H8/f7 que sale después, 63 + 40: la tolerancia del ajuste
              **elegido**. El a) pide la que permite el enunciado, 150 − 40, y la del elegido tiene
              que caber dentro.
        pista: |
          En un ajuste móvil, $T_J = J_{\max} - J_{\min}$, y el enunciado da los dos juegos.
        desarrollo: |
          $$
          T_J = J_{\max} - J_{\min} = 150 - 40 = 110
          $$

          Son micras. Es lo más que pueden sumar la tolerancia del agujero y la del eje,
          $T + t \le 110$.

      - tipo: reconocer
        pregunta: |
          Hay que repartir esos 110 µm entre el agujero y el eje, con calidades normalizadas. En la
          fila de 120 a 180 mm, IT6 = 25, IT7 = 40 e IT8 = 63 µm. ¿Qué reparto sale del
          procedimiento?
        opciones:
          - texto: IT8 para el agujero e IT7 para el eje, que suman 103 µm
            correcta: true
            mensaje: |
              Eso es. Es la mayor suma que cabe en 110, las dos calidades se llevan un punto y la
              tolerancia mayor es la del agujero. Queda un agujero H8 y un eje de calidad 7.
          - texto: IT7 para el agujero e IT8 para el eje, que también suman 103 µm
            mensaje: |
              Suma lo mismo, pero da la tolerancia mayor al eje. La diapositiva (pág. 17, $T > t$) y
              el libro («siempre que sea posible», pág. 8-20) piden la mayor para el agujero.
          - texto: IT8 para los dos, que suman 126 µm
            mensaje: |
              Se pasa: 126 > 110. Pongas la posición que pongas, el juego variaría 126 µm, y entre
              40 y 150 solo caben 110.
          - texto: IT7 para los dos, que suman 80 µm
            mensaje: |
              Cabe, y H7/f7 cumple: juego de 43 a 123 µm. Pero es más precisión de la necesaria, y
              la precisión es cara: el libro pide tolerancias «tan amplias como sea posible».

      - tipo: calcular
        titulo: El juego máximo en agujero único
        pregunta: |
          Apartado b). En agujero único el agujero es H8. La letra del eje que deja el juego mínimo
          más cerca de 40 µm sin quedarse corto es la f, con $d_s = -43$ µm, y la solución oficial
          da Ø150 H8/f7. ¿Cuánto vale su juego máximo?
        respuesta:
          tipo: numero
          valor: '146'
          tolerancia: 1
          formato: un número, en µm
        distractores:
          - valor: '103'
            mensaje: |
              Has sumado las dos tolerancias, 63 + 40. Esa es la tolerancia del ajuste, lo que
              **varía** el juego. El juego máximo es mayor, porque el eje además empieza 43 µm por
              debajo de la línea cero.
          - valor: '106'
            mensaje: |
              Has restado $D_s - d_s = 63 - (-43)$. El juego máximo junta el agujero **más grande**
              con el eje **más pequeño**: $D_s - d_i$, y el eje más pequeño es su diferencia
              inferior, $d_i = -83$.
          - valor: '60'
            mensaje: |
              Has tomado la f con signo más, +43. De la a a la h los ejes quedan por debajo de la
              línea cero: la f vale −43, y entonces $d_i = -43 - 40 = -83$. La tabla del libro
              (pág. 8-8) pone + delante de todas las cifras de los ejes; la norma, no: de la a a la
              h van por debajo de la línea cero.
          - valor: '123'
            mensaje: |
              Has tomado IT7 = 40 para el agujero. H8 es calidad 8: IT8 = 63 en la fila de 120
              a 180. Con 40 sale el juego de H7/f7, que también cumple, pero no es el ajuste del
              que se pregunta.
          - valor: '0.146'
            mensaje: |
              Eso son 146 µm escritos en milímetros. Los juegos se dan en micras, como las tablas.
        pista: |
          H8 va de 0 a +63 µm. El eje f7 va de $d_s = -43$ a $d_i = -43 - 40 = -83$ µm. El juego
          máximo junta el agujero más grande con el eje más pequeño.
        desarrollo: |
          $$
          J_{\max} = D_s - d_i = 63 - (-83) = 146
          $$

          Son micras, y no pasan de los 150 que permite el enunciado.

      - tipo: calcular
        titulo: El juego mínimo en agujero único
        pregunta: |
          ¿Y el juego mínimo del mismo H8/f7, $J_{\min}$?
        respuesta:
          tipo: numero
          valor: '43'
          tolerancia: 1
          formato: un número, en µm
        distractores:
          - valor: '0.043'
            mensaje: |
              Eso son 43 µm escritos en milímetros. Los juegos se dan en micras, como las tablas.
          - valor: '-43'
            mensaje: |
              Un juego negativo sería un apriete, y el ajuste es móvil. Has tomado la f como +43, o
              has restado al revés: $J_{\min} = D_i - d_s = 0 - (-43)$. La tabla del libro
              (pág. 8-8) pone + delante de todas las cifras de los ejes; la norma, no: de la a a la
              h van por debajo de la línea cero.
          - valor: '83'
            mensaje: |
              Has restado $D_i - d_i$. El juego mínimo junta el agujero **más pequeño** con el eje
              **más grande**: $D_i - d_s$, y el eje más grande es su diferencia superior, −43.
        pista: |
          Agujero lo más pequeño, $D_i = 0$; eje lo más grande, $d_s = -43$ µm.
        desarrollo: |
          $$
          J_{\min} = D_i - d_s = 0 - (-43) = 43
          $$

          Los dos juegos caen dentro de lo pedido: $43 \ge 40$ y $146 \le 150$.

      - tipo: calcular
        titulo: El juego máximo en eje único
        pregunta: |
          Apartado c). En eje único el eje es h7, de 0 a −40 µm, y la solución oficial da Ø150 F8/h7.
          La F de la Tabla 2 vale +43 µm en la fila de 140 a 160 mm. ¿Cuánto vale el juego máximo?
        respuesta:
          tipo: numero
          valor: '146'
          tolerancia: 1
          formato: un número, en µm
        distractores:
          - valor: '83'
            mensaje: |
              Has tomado +43 como la diferencia **superior** de F8. De la A a la H, la tabla de
              agujeros da la **inferior**: $D_i = +43$ y $D_s = 43 + 63 = 106$. Leída al revés, el
              juego mínimo saldría −20, un apriete en un ajuste móvil.
          - valor: '60'
            mensaje: |
              Has tomado la F con signo menos, −43, como la f del eje. La F mayúscula está en la
              tabla de agujeros, y deja el agujero **por encima** de la línea cero: +43.
          - valor: '103'
            mensaje: |
              Has sumado las dos tolerancias, 63 + 40. Esa es la tolerancia del ajuste; el juego
              máximo es mayor, porque el agujero además empieza 43 µm por encima de la línea cero.
          - valor: '0.146'
            mensaje: |
              Eso son 146 µm escritos en milímetros. Los juegos se dan en micras, como las tablas.
        pista: |
          F8 va de $D_i = +43$ a $D_s = 43 + 63 = 106$ µm; h7, de $d_s = 0$ a $d_i = -40$ µm.
        desarrollo: |
          $$
          J_{\max} = D_s - d_i = 106 - (-40) = 146
          $$

          $$
          J_{\min} = D_i - d_s = 43 - 0 = 43
          $$

          Los mismos juegos que H8/f7. Con las letras de la A a la H, la F del agujero es la f del
          eje con el signo cambiado, y F8/h7 es H8/f7 desplazado 43 µm: cada pieza conserva su
          calidad.

      # Decisión: la opción que no sirve es F8/h9, la que la tabla de ajustes
      # recomendados (Tema 7, pág. 18; Tablas ISO, pág. 7) pone en la fila de
      # H8/f7: es el error que el propio material tiene a mano.
      - tipo: reconocer
        pregunta: |
          La solución oficial no es el único ajuste que cumple. De estos cuatro, ¿cuál **no** deja
          el juego entre 40 y 150 µm?
        opciones:
          - texto: H7/f7
            mensaje: |
              Este cumple los juegos: de 43 a 123 µm, y es de los ajustes preferentes del tema
              (pág. 18). Pero es más preciso de lo necesario, y el procedimiento, por el criterio 1,
              elige H8/f7.
          - texto: F8/h7
            mensaje: |
              Este sirve: es la solución oficial del c), con los mismos juegos que H8/f7, de 43 a
              146 µm.
          - texto: H8/f6
            mensaje: |
              Este sirve: f6 va de −43 a −68 µm, y el juego, de 43 a 131 µm.
          - texto: F8/h9
            correcta: true
            mensaje: |
              Eso es. Es la pareja que da para H8/f7 la tabla de ajustes recomendados del tema
              (pág. 18), pero h9 baja hasta −100 µm, y el juego máximo llega a 106 + 100 = 206 µm,
              por encima de 150. El eje único que cumple es F8/h7, que conserva las calidades de
              H8/f7.

      - tipo: justificar
        pregunta: Ordena la resolución del ejercicio. Una pieza no debe entrar.
        piezas:
          - texto: 'La tolerancia del ajuste es Jmáx − Jmín = 150 − 40 = 110 µm: lo más que pueden sumar T y t.'
          - texto: 'En la fila de 120 a 180 mm, IT8 + IT7 = 63 + 40 = 103 µm: la mayor suma que cabe, con la tolerancia mayor para el agujero.'
          - texto: 'En agujero único, H8 va de 0 a +63 µm; la f, con ds = −43 µm, deja el juego mínimo más cerca de 40, y el eje f7 va de −43 a −83 µm.'
          - texto: 'Jmáx = 63 + 83 = 146 µm y Jmín = 43 µm, dentro de lo pedido; en eje único, F8/h7 da los mismos juegos.'
          - texto: Y como la solución oficial es H8/f7, ningún otro ajuste ISO deja el juego entre 40 y 150 µm.
            trampa: true
            mensaje: |
              No: H7/f7 (juego de 43 a 123 µm) y H8/f6 (de 43 a 131) también lo dejan dentro. H8/f7
              es el que sale del procedimiento, el más holgado de los que caben con la tolerancia
              mayor para el agujero, y es el que coincide con la solución oficial. Los otros dan un
              montaje que funciona, pero más caro de fabricar.
    resolucion: |
      **a) La tolerancia del ajuste.** En un ajuste móvil,
      $T_J = J_{\max} - J_{\min} = 150 - 40 = 110$ µm. Es lo más que pueden sumar la tolerancia del
      agujero y la del eje.

      **Las calidades.** En la fila de 120 a 180 mm de la Tabla 1, la mayor suma de dos IT que cabe
      en 110 es IT8 + IT7 = 63 + 40 = 103 µm. La tolerancia mayor va al agujero, y las calidades se
      llevan un punto.

      **b) Agujero único.** El agujero es H8: $D_i = 0$, $D_s = +63$ µm. La letra del eje que deja
      el juego mínimo más cerca de 40 µm sin quedarse corto es la f: en la Tabla 4, fila de 140 a
      160 mm, $d_s = -43$ µm. La g, −14, se queda corta: dejaría 14 µm de juego mínimo. La e, −85,
      se pasa por arriba: con estas calidades, H8/e7 llega a 188 µm de juego máximo. Con IT7,
      $d_i = -43 - 40 = -83$ µm. El ajuste es **Ø150 H8/f7**:

      $$
      J_{\max} = D_s - d_i = 63 - (-83) = 146 \qquad J_{\min} = D_i - d_s = 0 - (-43) = 43
      $$

      Los dos, en micras, dentro de 40 a 150.

      **c) Eje único.** El eje es h7: $d_s = 0$, $d_i = -40$ µm. La F de la Tabla 2, en la misma
      fila, da la diferencia inferior del agujero, $D_i = +43$ µm, y con IT8, $D_s = 106$ µm. El
      ajuste es **Ø150 F8/h7**, con los mismos juegos: $J_{\max} = 106 + 40 = 146$ µm y
      $J_{\min} = 43 - 0 = 43$ µm. Es H8/f7 desplazado 43 µm, con las mismas calidades. La tabla
      de ajustes recomendados del tema pone F8/h9 en la fila de H8/f7, y ese no cumple: h9 baja
      hasta −100 µm y el juego máximo llega a 206.

      **d) Las cifras del dibujo.** Con la nominal de 150 mm:

      - H8: diferencias 0 y +63 µm, cotas 150,000 y 150,063 mm.
      - f7: diferencias −43 y −83 µm, cotas 149,957 y 149,917 mm.
      - F8: diferencias +43 y +106 µm, cotas 150,043 y 150,106 mm.
      - h7: diferencias 0 y −40 µm, cotas 150,000 y 149,960 mm.

      En los dos dibujos la zona del agujero queda por encima de la del eje, separadas 43 µm.

      **No es el único ajuste que cumple.** Con las mismas tablas, H7/f7 deja el juego entre 43 y
      123 µm y H8/f6, entre 43 y 131. H8/f7 es el que sale de pedir las tolerancias más amplias que
      caben, con la mayor para el agujero, y es el que coincide con la solución oficial.
