      **Notas nuestras.** Es la pieza que ponen de ejemplo las diapositivas de acabados en la
      pág. 8, redibujada. La tabla de la pág. 6 da la clase de cada Ra, en micras: N12, 50; N11,
      25; N10, 12,5; N9, 6,3; N8, 3,2; N7, 1,6; N6, 0,8; N5, 0,4; N4, 0,2; N3, 0,1; N2, 0,05; y
      N1, 0,025.
    pide: El Ra de cada cara de la pieza 1, en micras, y el de una cara marcada N7.
    pasos:
      - tipo: reconocer
        pregunta: ¿Qué dice lo que va escrito junto a la marca 1?
        opciones:
          - texto: Que cada cara puede salir con cualquier rugosidad entre 3,2 y 12,5 micras, como en una tolerancia
            mensaje: |
              No es un intervalo. El primer símbolo es el acabado general, y el de entre
              paréntesis, el particular de las caras que lo llevan dibujado (pág. 8).
          - texto: Ra 12,5 en toda la pieza, salvo las caras marcadas aparte con 3,2
            correcta: true
            mensaje: |
              Eso es. El general va junto a la marca, y entre paréntesis, detrás, los
              particulares, que también se dibujan sobre su cara. En la diapositiva: «Toda la Pieza
              1 tiene una rugosidad de 12,5 mm. Excepto las dos superficies indicadas» (pág. 8),
              con la unidad mal: son micras.
          - texto: Toda la pieza a 12,5 mm, menos dos caras a 3,2 mm
            mensaje: |
              La lectura es esa, pero la unidad no. Ra va en micras (pág. 6). La diapositiva escribe
              «12,5 mm», y es una errata: serían surcos de más de un centímetro.
          - texto: Que el taller elige 12,5 o 3,2 para cada cara
            mensaje: |
              El plano no deja nada a elegir: lo que no lleva símbolo propio va a 12,5, y las dos
              caras de la ranura, que lo llevan, a 3,2.

      - tipo: reconocer
        pregunta: Los símbolos de la pieza 1 son la V cerrada con una raya. ¿Qué dicen de la superficie?
        opciones:
          - texto: Que se queda en bruto, sin mecanizar
            mensaje: |
              Ese es el de la V con un círculo dentro: superficie en bruto, o mecanizada sin
              arranque de viruta (pág. 5).
          - texto: Que va pulida, porque es el acabado más fino
            mensaje: |
              El símbolo dice cómo se hace la cara, no cómo de fina queda: eso lo dice el número.
              Y el pulido es un mecanizado especial, no de arranque de viruta (pág. 4).
          - texto: Que se mecaniza arrancando viruta, torneada, fresada o limada
            correcta: true
            mensaje: |
              Eso es. La raya que cierra la V es la de la superficie mecanizada por arranque de
              viruta (pág. 5), y la pág. 4 da esos tres procesos.
          - texto: Que requiere unas características especiales, que van en el trazo de arriba
            mensaje: |
              Ese es el de la V abierta, sin raya ni círculo (pág. 5). Lo que va en el trazo de
              arriba, cuando lo hay, es el proceso o el tratamiento, el dato b (pág. 6).

      - tipo: calcular
        titulo: El Ra de una cara marcada N7
        pregunta: |
          En el cuadro «BIEN / MAL» de la misma pág. 8 las caras van marcadas N7. Si copias ese
          acabado en tu plano, ¿qué número escribes en el símbolo?
        respuesta:
          tipo: numero
          valor: '1.6'
          tolerancia: 0.01
          formato: un número, el Ra en µm
        distractores:
          - valor: '0.8'
            mensaje: |
              Eso es N6, la fila de abajo. La clase sube cuando la cara es más rugosa: N7 es la
              siguiente a N6, 1,6 µm.
          - valor: '3.2'
            mensaje: |
              Eso es N8, la fila de arriba. N7 es 1,6 µm.
          - valor: '63'
            mensaje: |
              Has leído la columna de las micropulgadas, que la pág. 6 tacha. En el plano va Ra en
              micras: 1,6.
          - valor: '7'
            mensaje: |
              El 7 es el número de la clase, no un Ra. N7 corresponde a Ra 1,6 µm, y eso es lo que
              va en tu plano: la pág. 6 tacha las clases.
        pista: |
          Busca N7 en la tabla de las notas y lee su Ra en micras.
        desarrollo: |
          En la tabla de la pág. 6, N7 está en la fila de Ra = 1,6 µm. En el símbolo se escribe
          1,6, sin unidad: el número es Ra, en micras.

      - tipo: reconocer
        pregunta: Las dos caras de la ranura van a 3,2. En la clasificación de la pág. 9, ¿qué clase de superficie es esa?
        opciones:
          - texto: 'Funcional: toca otra pieza y se mueve sobre ella'
            mensaje: |
              La funcional lleva 0,8: hay movimiento relativo, y pide un acabado muy fino. El 3,2
              es de la de apoyo.
          - texto: 'De apoyo: toca otra pieza del mecanismo, pero sin movimiento relativo entre las dos'
            correcta: true
            mensaje: |
              Eso es: Ra 3,2 es el de la superficie de apoyo (pág. 9), la que toca otra pieza
              sin moverse respecto de ella. La diapositiva no dice qué toca la ranura: lo dice el
              número.
          - texto: 'Libre: su función es estética'
            mensaje: |
              La libre lleva 12,5, y es la que no toca ninguna otra pieza: aquí, el acabado
              general de la pieza 1.
          - texto: Ninguna, porque el 3,2 no depende de la función de la cara
            mensaje: |
              Depende: la pág. 9 da un Ra a cada tipo de superficie según su función, 12,5, 3,2 y
              0,8.

      - tipo: justificar
        pregunta: Ordena cómo se lee el acabado de la pieza 1. Una pieza no debe entrar.
        piezas:
          - texto: 'Junto a la marca 1, el primer símbolo da el acabado general: Ra 12,5 µm en toda la pieza.'
          - texto: Entre paréntesis va el particular, 3,2, que además está dibujado sobre las dos caras de la ranura.
          - texto: Esas dos caras van a Ra 3,2 µm, que es el de una superficie de apoyo, y las demás a 12,5.
          - texto: Una cara marcada N7 en otro plano pide Ra 1,6 µm, y en el tuyo se escribe 1,6.
          - texto: Las caras de la ranura llevan los dos acabados a la vez, 12,5 y 3,2, porque el general vale para toda la pieza.
            trampa: true
            mensaje: |
              El general vale para toda la pieza menos donde hay otro: «Excepto las dos
              superficies indicadas» (pág. 8). En la ranura manda el 3,2. Una cara tiene un solo
              acabado.
    resolucion: |
      **El general.** Junto a la marca 1 va el símbolo de superficie mecanizada por arranque de
      viruta, la V cerrada con una raya (pág. 5), con 12,5: Ra 12,5 µm en toda la pieza.

      **Los particulares.** Entre paréntesis, detrás, el mismo símbolo con 3,2. Es el acabado de
      las caras que lo llevan dibujado: las dos de la ranura, que van a Ra 3,2 µm. Las demás, a
      12,5 (pág. 8). La diapositiva escribe «12,5 mm», y es una errata: Ra va en micras (pág. 6).

      **Por qué esos números.** En la clasificación de la pág. 9, 12,5 es el de una superficie
      libre, que no toca nada, y 3,2 el de una de apoyo, que toca otra pieza sin moverse respecto
      de ella.

      **La cara marcada N7.** En la tabla de la pág. 6, N7 es Ra 1,6 µm. En tu plano se escribe
      1,6: la pág. 6 tacha las clases y deja solo la columna de las micras.

  # Decisión: ningún paso pide la designación como respuesta. La solución
  # oficial da solo «Ø150 H8/f7 – Ø150 F8/h7», y con las mismas tablas cumplen
  # 23 ajustes de agujero único y 23 de eje único (guiones/ajustes.salida.txt);
  # los calcular piden los juegos del ajuste oficial, y el «¿cuál no sirve?»
  # tiene una sola respuesta aunque haya varios válidos.
  # Decisión: el d) (el dibujo) es un paso `dibujar`, el penúltimo, con la
  # figura de las zonas de los dos sistemas a la misma escala (generador
  # t12-zonas-ajustes.mjs, el mismo para los tres ajustes). Sus cifras siguen
  # también en la resolución.
  - id: ajustes-1-un-ajuste-movil-de-150
    titulo: Un ajuste móvil de Ø150 con juego entre 40 y 150 µm
    fuente: Ejercicio 1 · «Ajustes – Tolerancias dimensionales», hoja de ejercicios de Expresión Gráfica, EIG · UPV/EHU. Solución oficial en la hoja de soluciones de la asignatura (fichero «Ejercicios – Solución»), que da solo las designaciones, Ø150 H8/f7 y Ø150 F8/h7.
    nivel: practica
    enunciado: |
      En un ajuste móvil el eje y el agujero tienen diámetros nominales de 150 mm. Si el juego debe
      estar comprendido entre 150 µm y 40 µm, calcula:

      a. La tolerancia del ajuste.

      b. Las dimensiones normalizadas del ajuste ISO, según el sistema de agujero único.

      c. Las dimensiones normalizadas del ajuste ISO, según el sistema de eje único.

      d. El dibujo del conjunto, indicando las zonas de tolerancia, dimensiones, cotas mínima y
      máxima y diferencias superior e inferior.

      **Notas nuestras.** Las filas de la UNE-EN ISO 286-1:2011 que hacen falta para 150 mm: Tabla 1
      (pág. 30 de la norma), fila de 120 a 180 mm, IT6 = 25 µm, IT7 = 40 µm, IT8 = 63 µm e
      IT9 = 100 µm; Tabla 2
      (pág. 31), agujeros, fila de 140 a 160 mm, F = +43 µm, que es la diferencia inferior; Tabla 4
      (pág. 34), ejes, la misma fila, e = −85 µm, f = −43 µm y g = −14 µm, que son la diferencia
      superior. La H y la h arrancan en la línea cero. Son las págs. 1, 2 y 5 de «Tablas ISO –
      Tolerancias dimensionales», el PDF de la asignatura. El d) se dibuja en papel y se compara
      en el penúltimo paso; sus cifras van también en la resolución.
    pide: La tolerancia del ajuste, los juegos máximo y mínimo del ajuste de agujero único y el juego máximo del de eje único, en µm.
    pasos:
      - tipo: reconocer
        pregunta: El juego tiene que quedar entre 40 y 150 µm. ¿Qué dice eso de las dos zonas de tolerancia?
        opciones:
          - texto: Que la zona del agujero queda entera por encima de la del eje, y nunca a menos de 40 µm de ella
            correcta: true
            mensaje: |
              Eso es. Hasta el peor caso deja 40 µm de juego, así que nunca hay apriete: es un
              ajuste móvil, y sus juegos salen de $J_{\max} = D_s - d_i$ y $J_{\min} = D_i - d_s$.
          - texto: Que el agujero tiene 150 µm de tolerancia y el eje, 40 µm
            mensaje: |
              150 y 40 son **juegos**: lo que sobra entre agujero y eje en los dos casos extremos.
              Las tolerancias de cada pieza las eliges tú, y entre las dos tienen que caber en lo que
              va de un juego al otro.
          - texto: Que las dos zonas se pisan, y unas veces habrá juego y otras apriete
            mensaje: |
              Eso es un ajuste **indeterminado**, como el 2 de la misma hoja. Aquí el juego mínimo es
              positivo: las zonas no llegan a tocarse.
          - texto: Que la diferencia entre los dos juegos es la tolerancia del agujero
            mensaje: |
              Esa diferencia es lo que pueden sumar **las dos** piezas: la tolerancia del ajuste,
              $T + t$. Si se la das entera al agujero, el eje tendría que salir exacto.

      - tipo: calcular
        titulo: La tolerancia del ajuste
        pregunta: |
          Apartado a). ¿Cuánto vale la tolerancia del ajuste, $T_J$?
        respuesta:
          tipo: numero
          valor: '110'
          tolerancia: 1
          formato: un número, en µm
        distractores:
          - valor: '0.11'
            mensaje: |
              Eso son 110 µm escritos en milímetros. Las tolerancias y los juegos se dan en micras
              (1 µm = 0,001 mm), que es como vienen en las tablas.
          - valor: '190'
            mensaje: |
              Has sumado los dos juegos. Una suma, $J_{\max} + A_{\max}$, es la tolerancia de un
              ajuste **indeterminado**; en uno móvil es la diferencia, $J_{\max} - J_{\min}$.
          - valor: '103'
            mensaje: |
              103 es $T + t$ del H8/f7 que sale después, 63 + 40: la tolerancia del ajuste
              **elegido**. El a) pide la que permite el enunciado, 150 − 40, y la del elegido tiene
              que caber dentro.
        pista: |
          En un ajuste móvil, $T_J = J_{\max} - J_{\min}$, y el enunciado da los dos juegos.
        desarrollo: |
          $$
          T_J = J_{\max} - J_{\min} = 150 - 40 = 110
          $$

          Son micras. Es lo más que pueden sumar la tolerancia del agujero y la del eje,
          $T + t \le 110$.

      - tipo: reconocer
        pregunta: |
          Hay que repartir esos 110 µm entre el agujero y el eje, con calidades normalizadas. En la
          fila de 120 a 180 mm, IT6 = 25, IT7 = 40 e IT8 = 63 µm. ¿Qué reparto sale del
          procedimiento?
        opciones:
          - texto: IT8 para el agujero e IT7 para el eje, que suman 103 µm
            correcta: true
            mensaje: |
              Eso es. Es la mayor suma que cabe en 110, las dos calidades se llevan un punto y la
              tolerancia mayor es la del agujero. Queda un agujero H8 y un eje de calidad 7.
          - texto: IT7 para el agujero e IT8 para el eje, que también suman 103 µm
            mensaje: |
              Suma lo mismo, pero da la tolerancia mayor al eje. La diapositiva (pág. 17, $T > t$) y
              el libro («siempre que sea posible», pág. 8-20) piden la mayor para el agujero.
          - texto: IT8 para los dos, que suman 126 µm
            mensaje: |
              Se pasa: 126 > 110. Pongas la posición que pongas, el juego variaría 126 µm, y entre
              40 y 150 solo caben 110.
          - texto: IT7 para los dos, que suman 80 µm
            mensaje: |
              Cabe, y H7/f7 cumple: juego de 43 a 123 µm. Pero es más precisión de la necesaria, y
              la precisión es cara: el libro pide tolerancias «tan amplias como sea posible».

      - tipo: calcular
        titulo: El juego máximo en agujero único
        pregunta: |
          Apartado b). En agujero único el agujero es H8. La letra del eje que deja el juego mínimo
          más cerca de 40 µm sin quedarse corto es la f, con $d_s = -43$ µm, y la solución oficial
          da Ø150 H8/f7. ¿Cuánto vale su juego máximo?
        respuesta:
          tipo: numero
          valor: '146'
          tolerancia: 1
          formato: un número, en µm
        distractores:
          - valor: '103'
            mensaje: |
              Has sumado las dos tolerancias, 63 + 40. Esa es la tolerancia del ajuste, lo que
              **varía** el juego. El juego máximo es mayor, porque el eje además empieza 43 µm por
              debajo de la línea cero.
          - valor: '106'
            mensaje: |
              Has restado $D_s - d_s = 63 - (-43)$. El juego máximo junta el agujero **más grande**
              con el eje **más pequeño**: $D_s - d_i$, y el eje más pequeño es su diferencia
              inferior, $d_i = -83$.
          - valor: '60'
            mensaje: |
              Has tomado la f con signo más, +43. De la a a la h los ejes quedan por debajo de la
              línea cero: la f vale −43, y entonces $d_i = -43 - 40 = -83$. La tabla del libro
              (pág. 8-8) pone + delante de todas las cifras de los ejes; la norma, no: de la a a la
              h van por debajo de la línea cero.
          - valor: '123'
            mensaje: |
              Has tomado IT7 = 40 para el agujero. H8 es calidad 8: IT8 = 63 en la fila de 120
              a 180. Con 40 sale el juego de H7/f7, que también cumple, pero no es el ajuste del
              que se pregunta.
          - valor: '0.146'
            mensaje: |
              Eso son 146 µm escritos en milímetros. Los juegos se dan en micras, como las tablas.
        pista: |
          H8 va de 0 a +63 µm. El eje f7 va de $d_s = -43$ a $d_i = -43 - 40 = -83$ µm. El juego
          máximo junta el agujero más grande con el eje más pequeño.
        desarrollo: |
          $$
          J_{\max} = D_s - d_i = 63 - (-83) = 146
          $$

          Son micras, y no pasan de los 150 que permite el enunciado.

      - tipo: calcular
        titulo: El juego mínimo en agujero único
        pregunta: |
          ¿Y el juego mínimo del mismo H8/f7, $J_{\min}$?
        respuesta:
          tipo: numero
          valor: '43'
          tolerancia: 1
          formato: un número, en µm
        distractores:
          - valor: '0.043'
            mensaje: |
              Eso son 43 µm escritos en milímetros. Los juegos se dan en micras, como las tablas.
          - valor: '-43'
            mensaje: |
              Un juego negativo sería un apriete, y el ajuste es móvil. Has tomado la f como +43, o
              has restado al revés: $J_{\min} = D_i - d_s = 0 - (-43)$. La tabla del libro
              (pág. 8-8) pone + delante de todas las cifras de los ejes; la norma, no: de la a a la
              h van por debajo de la línea cero.
          - valor: '83'
            mensaje: |
              Has restado $D_i - d_i$. El juego mínimo junta el agujero **más pequeño** con el eje
              **más grande**: $D_i - d_s$, y el eje más grande es su diferencia superior, −43.
        pista: |
          Agujero lo más pequeño, $D_i = 0$; eje lo más grande, $d_s = -43$ µm.
        desarrollo: |
          $$
          J_{\min} = D_i - d_s = 0 - (-43) = 43
          $$

          Los dos juegos caen dentro de lo pedido: $43 \ge 40$ y $146 \le 150$.

      - tipo: calcular
        titulo: El juego máximo en eje único
        pregunta: |
          Apartado c). En eje único el eje es h7, de 0 a −40 µm, y la solución oficial da Ø150 F8/h7.
          La F de la Tabla 2 vale +43 µm en la fila de 140 a 160 mm. ¿Cuánto vale el juego máximo?
        respuesta:
          tipo: numero
          valor: '146'
          tolerancia: 1
          formato: un número, en µm
        distractores:
          - valor: '83'
            mensaje: |
              Has tomado +43 como la diferencia **superior** de F8. De la A a la H, la tabla de
              agujeros da la **inferior**: $D_i = +43$ y $D_s = 43 + 63 = 106$. Leída al revés, el
              juego mínimo saldría −20, un apriete en un ajuste móvil.
          - valor: '60'
            mensaje: |
              Has tomado la F con signo menos, −43, como la f del eje. La F mayúscula está en la
              tabla de agujeros, y deja el agujero **por encima** de la línea cero: +43.
          - valor: '103'
            mensaje: |
              Has sumado las dos tolerancias, 63 + 40. Esa es la tolerancia del ajuste; el juego
              máximo es mayor, porque el agujero además empieza 43 µm por encima de la línea cero.
          - valor: '0.146'
            mensaje: |
              Eso son 146 µm escritos en milímetros. Los juegos se dan en micras, como las tablas.
        pista: |
          F8 va de $D_i = +43$ a $D_s = 43 + 63 = 106$ µm; h7, de $d_s = 0$ a $d_i = -40$ µm.
        desarrollo: |
          $$
          J_{\max} = D_s - d_i = 106 - (-40) = 146
          $$

          $$
          J_{\min} = D_i - d_s = 43 - 0 = 43
          $$

          Los mismos juegos que H8/f7. Con las letras de la A a la H, la F del agujero es la f del
          eje con el signo cambiado, y F8/h7 es H8/f7 desplazado 43 µm: cada pieza conserva su
          calidad.

      # Decisión: la opción que no sirve es F8/h9, la que la tabla de ajustes
      # recomendados (Tema 7, pág. 18; Tablas ISO, pág. 7) pone en la fila de
      # H8/f7: es el error que el propio material tiene a mano.
      - tipo: reconocer
        pregunta: |
          La solución oficial no es el único ajuste que cumple. De estos cuatro, ¿cuál **no** deja
          el juego entre 40 y 150 µm?
        opciones:
          - texto: H7/f7
            mensaje: |
              Este cumple los juegos: de 43 a 123 µm, y es de los ajustes preferentes del tema
              (pág. 18). Pero es más preciso de lo necesario, y el procedimiento, por el criterio 1,
              elige H8/f7.
          - texto: F8/h7
            mensaje: |
              Este sirve: es la solución oficial del c), con los mismos juegos que H8/f7, de 43 a
              146 µm.
          - texto: H8/f6
            mensaje: |
              Este sirve: f6 va de −43 a −68 µm, y el juego, de 43 a 131 µm.
          - texto: F8/h9
            correcta: true
            mensaje: |
              Eso es. Es la pareja que da para H8/f7 la tabla de ajustes recomendados del tema
              (pág. 18), pero h9 baja hasta −100 µm, y el juego máximo llega a 106 + 100 = 206 µm,
              por encima de 150. El eje único que cumple es F8/h7, que conserva las calidades de
              H8/f7.

      - tipo: dibujar
        consigna: |
          Apartado d). Dibuja en papel las zonas de tolerancia de los dos ajustes de la solución,
          Ø150 H8/f7 y Ø150 F8/h7: la línea cero, la zona del agujero y la del eje a una escala de
          micras que quepa en el folio, y en cada borde su diferencia y su cota. Cuando lo tengas,
          compáralo con la figura y con la lista.
        comprueba:
          - punto: Una línea cero horizontal, que es la cota nominal, 150, y las dos zonas como rectángulos a su altura, el agujero a un lado y el eje al otro.
            porque: |
              Las diferencias se cuentan desde la línea cero (Tema 7, págs. 7 y 8): sin ella no hay
              desde dónde poner ningún borde. Es el esquema de las diapositivas de los tipos de
              ajuste y de los dos sistemas (págs. 15 y 16), y el de las figuras 8.15 a 8.17 del
              libro (págs. 8-21 y 8-22).
          - punto: En agujero único, H8 de 0 a +63 por encima de la línea cero y f7 de −43 a −83 por debajo; en eje único, F8 de +43 a +106 y h7 de 0 a −40.
            porque: |
              Es lo que dice que el ajuste es móvil: la zona del agujero, entera por encima de la del
              eje. El hueco entre las dos, 43 µm en los dos dibujos, es el juego mínimo; de la
              punta de arriba del agujero a la de abajo del eje van los 146 µm del juego máximo.
          - punto: Cada pieza con la misma altura de zona en los dos dibujos, 63 µm el agujero y 40 µm el eje.
            porque: |
              La altura de la zona es la tolerancia, el IT de su calidad, y no cambia al pasar de un
              sistema a otro: F8/h7 es H8/f7 subido 43 µm. Si una zona te sale de otro tamaño, has
              cambiado una calidad.
          - punto: En cada borde, su diferencia en micras con su signo y su cota en milímetros, 150,063 y 150,000 para H8, 149,957 y 149,917 para f7, 150,106 y 150,043 para F8, y 150,000 y 149,960 para h7.
            porque: |
              El apartado pide las dos cosas: «cotas mínima y máxima y diferencias superior e
              inferior». De una a otra hay tres decimales: +63 µm son 0,063 mm, y la cota es
              150,063, no 150,63.
        figura: |
          <svg viewBox="0 0 380 421" role="img" width="380" height="421" aria-labelledby="t12zonas1-t t12zonas1-d">
            <title id="t12zonas1-t">Las zonas de tolerancia del ajuste 1: Ø150 H8/f7 y F8/h7</title>
