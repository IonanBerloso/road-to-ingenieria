      - tipo: justificar
        pregunta: Ordena la resolución del ejercicio. Una pieza no debe entrar.
        piezas:
          - texto: 'La tolerancia del ajuste es Jmáx − Jmín = 150 − 40 = 110 µm: lo más que pueden sumar T y t.'
          - texto: 'En la fila de 120 a 180 mm, IT8 + IT7 = 63 + 40 = 103 µm: la mayor suma que cabe, con la tolerancia mayor para el agujero.'
          - texto: 'En agujero único, H8 va de 0 a +63 µm; la f, con ds = −43 µm, deja el juego mínimo más cerca de 40, y el eje f7 va de −43 a −83 µm.'
          - texto: 'Jmáx = 63 + 83 = 146 µm y Jmín = 43 µm, dentro de lo pedido; en eje único, F8/h7 da los mismos juegos.'
          - texto: Y como la solución oficial es H8/f7, ningún otro ajuste ISO deja el juego entre 40 y 150 µm.
            trampa: true
            mensaje: |
              No: H7/f7 (juego de 43 a 123 µm) y H8/f6 (de 43 a 131) también lo dejan dentro. H8/f7
              es el que sale del procedimiento, el más holgado de los que caben con la tolerancia
              mayor para el agujero, y es el que coincide con la solución oficial. Los otros dan un
              montaje que funciona, pero más caro de fabricar.
    resolucion: |
      **a) La tolerancia del ajuste.** En un ajuste móvil,
      $T_J = J_{\max} - J_{\min} = 150 - 40 = 110$ µm. Es lo más que pueden sumar la tolerancia del
      agujero y la del eje.

      **Las calidades.** En la fila de 120 a 180 mm de la Tabla 1, la mayor suma de dos IT que cabe
      en 110 es IT8 + IT7 = 63 + 40 = 103 µm. La tolerancia mayor va al agujero, y las calidades se
      llevan un punto.

      **b) Agujero único.** El agujero es H8: $D_i = 0$, $D_s = +63$ µm. La letra del eje que deja
      el juego mínimo más cerca de 40 µm sin quedarse corto es la f: en la Tabla 4, fila de 140 a
      160 mm, $d_s = -43$ µm. La g, −14, se queda corta: dejaría 14 µm de juego mínimo. La e, −85,
      se pasa por arriba: con estas calidades, H8/e7 llega a 188 µm de juego máximo. Con IT7,
      $d_i = -43 - 40 = -83$ µm. El ajuste es **Ø150 H8/f7**:

      $$
      J_{\max} = D_s - d_i = 63 - (-83) = 146 \qquad J_{\min} = D_i - d_s = 0 - (-43) = 43
      $$

      Los dos, en micras, dentro de 40 a 150.

      **c) Eje único.** El eje es h7: $d_s = 0$, $d_i = -40$ µm. La F de la Tabla 2, en la misma
      fila, da la diferencia inferior del agujero, $D_i = +43$ µm, y con IT8, $D_s = 106$ µm. El
      ajuste es **Ø150 F8/h7**, con los mismos juegos: $J_{\max} = 106 + 40 = 146$ µm y
      $J_{\min} = 43 - 0 = 43$ µm. Es H8/f7 desplazado 43 µm, con las mismas calidades. La tabla
      de ajustes recomendados del tema pone F8/h9 en la fila de H8/f7, y ese no cumple: h9 baja
      hasta −100 µm y el juego máximo llega a 206.

      **d) Las cifras del dibujo.** Con la nominal de 150 mm:

      - H8: diferencias 0 y +63 µm, cotas 150,000 y 150,063 mm.
      - f7: diferencias −43 y −83 µm, cotas 149,957 y 149,917 mm.
      - F8: diferencias +43 y +106 µm, cotas 150,043 y 150,106 mm.
      - h7: diferencias 0 y −40 µm, cotas 150,000 y 149,960 mm.

      En los dos dibujos la zona del agujero queda por encima de la del eje, separadas 43 µm.

      **No es el único ajuste que cumple.** Con las mismas tablas, H7/f7 deja el juego entre 43 y
      123 µm y H8/f6, entre 43 y 131. H8/f7 es el que sale de pedir las tolerancias más amplias que
      caben, con la mayor para el agujero, y es el que coincide con la solución oficial.

  # Decisión: el reparto se pregunta por la regla que siguen las soluciones de
  # la hoja (index.mdx, «La regla que siguen las soluciones de la hoja»): la
  # mayor suma de dos IT, a no más de dos puntos, que deja alguna letra dentro
  # de los límites. En el 2 eso da 174, aunque iguale las calidades y no cumpla
  # T > t (guiones/ajustes.salida.txt: 194 no deja letra y 175 salta tres).
  # Decisión: H9/k9 empata con H9/m9: la misma suma, y cumple (juego y apriete
  # máximos de 87 µm). Ningún criterio del material elige entre las dos, así
  # que un reconocer pregunta qué letras cumplen —la k y la m— y la k sale como
  # opción que sirve en el «¿cuál no sirve?». Los calcular piden los juegos del
  # ajuste oficial, que son una cuenta, no una elección.
  - id: ajustes-2-un-ajuste-indeterminado-de-100
    titulo: Un ajuste indeterminado de Ø100 con juego y apriete máximos de 100 µm
    fuente: Ejercicio 2 · «Ajustes – Tolerancias dimensionales», hoja de ejercicios de Expresión Gráfica, EIG · UPV/EHU. Solución oficial en la hoja de soluciones de la asignatura (fichero «Ejercicios – Solución»), que da solo las designaciones, Ø100 H9/m9 y Ø100 M9/h9.
    nivel: practica
    enunciado: |
      En un ajuste indeterminado, el diámetro nominal del eje y del orificio es de 100 mm, con
      juego máximo de 100 µm y apriete máximo de 100 µm. Calcular:

      a. La tolerancia del ajuste.

      b. Las dimensiones normalizadas del ajuste ISO, según el sistema de agujero único.

      c. Las dimensiones normalizadas del ajuste ISO, según el sistema de eje único.

      d. El dibujo del conjunto, indicando las zonas de tolerancia, dimensiones, cotas mínima y
      máxima y diferencias superior e inferior.

      **Notas nuestras.** Las filas de la UNE-EN ISO 286-1:2011 que hacen falta para 100 mm:
      Tabla 1 (pág. 30 de la norma), fila de 80 a 120 mm, IT7 = 35 µm, IT8 = 54 µm, IT9 = 87 µm
      e IT10 = 140 µm; Tabla 2 (pág. 31), agujeros, fila de 80 a 120 mm, M = −13 + Δ hasta IT8
      incluido y −13 µm por encima, que es la diferencia superior, con Δ = 19 µm para IT8
      (Tabla 3, pág. 32); Tabla 3, la misma fila, N = 0 por encima de IT8; Tabla 5 (pág. 35),
      ejes, fila de 80 a 100 mm, k = 0 por encima de IT7, m = +13 µm, n = +23 µm, p = +37 µm y
      r = +51 µm, que son la diferencia inferior. La H y la h arrancan en la línea cero. Son las
      págs. 1, 2, 3 y 6 de «Tablas ISO – Tolerancias dimensionales», el PDF de la asignatura. El
      d) se dibuja en papel y se compara en el penúltimo paso.
    pide: La tolerancia del ajuste, el juego y el apriete máximos del ajuste de agujero único y el juego máximo del de eje único, en µm.
    pasos:
      - tipo: reconocer
        pregunta: Juego máximo de 100 µm y apriete máximo de 100 µm. ¿Qué dice eso de las dos zonas de tolerancia?
        opciones:
          - texto: Que se pisan, y según qué piezas se junten el montaje sale con juego o con apriete
            correcta: true
            mensaje: |
              Eso es. Es un ajuste indeterminado: el juego máximo junta el agujero más grande con
              el eje más pequeño, $J_{\max} = D_s - d_i$, y el apriete máximo, el eje más grande
              con el agujero más pequeño, $A_{\max} = d_s - D_i$.
          - texto: Que la zona del agujero queda entera por encima de la del eje
            mensaje: |
              Eso sería un ajuste móvil, como el 1 de la misma hoja: siempre con juego. Aquí el
              enunciado admite también apriete, así que el eje puede pasar del agujero.
          - texto: Que el agujero y el eje tienen 100 µm de tolerancia cada uno
            mensaje: |
              Los dos 100 son el juego y el apriete de los dos montajes extremos, no las
              tolerancias de cada pieza. Las tolerancias las eliges tú, y entre las dos tienen
              que caber en lo que va de un extremo al otro.
          - texto: Que el juego y el apriete se compensan, y el montaje sale justo
            mensaje: |
              No pasan a la vez: son dos montajes distintos, uno con el agujero en su máximo y el
              eje en su mínimo, y otro al revés. Cada montaje sale con uno o con otro, y ninguno
              anula al otro.

      - tipo: calcular
        titulo: La tolerancia del ajuste
        pregunta: |
          Apartado a). ¿Cuánto vale la tolerancia del ajuste, $T_I$?
        respuesta:
          tipo: numero
          valor: '200'
          tolerancia: 1
          formato: un número, en µm
        distractores:
          - valor: '0'
            mensaje: |
              Has restado los dos, 100 − 100. Eso se hace con los dos juegos de un ajuste móvil,
              $J_{\max} - J_{\min}$. En uno indeterminado el apriete es un juego negativo,
              $J_{\min} = -A_{\max}$, y la resta se convierte en suma:
              $T_I = J_{\max} + A_{\max}$. Y si has escrito 0,2, son los 200 µm en milímetros:
              las tolerancias van en micras.
          - valor: '174'
            mensaje: |
              174 es $T + t$ del H9/m9 que sale después, 87 + 87: la tolerancia del ajuste
              **elegido**. El a) pide la que permite el enunciado, y la del elegido tiene que
              caber dentro.
        pista: |
          En un ajuste indeterminado, $T_I = J_{\max} + A_{\max}$ (Tema 7, pág. 15), y el
          enunciado da los dos.
        desarrollo: |
          $$
          T_I = J_{\max} + A_{\max} = 100 + 100 = 200
          $$

          Son micras. Es lo más que pueden sumar la tolerancia del agujero y la del eje,
          $T + t \le 200$.

      - tipo: reconocer
        pregunta: |
          Hay que repartir esos 200 µm entre dos calidades de la fila de 80 a 120 mm: IT7 = 35,
          IT8 = 54, IT9 = 87 e IT10 = 140 µm. ¿Con qué reparto se quedan las soluciones de la
          hoja?
        opciones:
          - texto: IT10 para el agujero e IT8 para el eje, que suman 194 µm
            mensaje: |
              Cabe en 200, y es el primero que se prueba, pero no deja ninguna letra. Con H10, de
              0 a +140 µm, el juego máximo pide que el eje no empiece por debajo de +40 µm, y el
              apriete máximo, que no empiece por encima de +46. En la fila de 80 a 100 mm la m da
              +13, la n +23, la p +37 y la r +51: ninguna cae entre 40 y 46.
          - texto: IT10 para el agujero e IT7 para el eje, que suman 175 µm
            mensaje: |
              Cabe, y con la r cumple: H10/r7 deja 89 µm de juego máximo y 86 de apriete máximo.
              Pero las dos calidades se llevan tres puntos, y la diapositiva de los criterios
              (pág. 17) y el libro (pág. 8-20) piden uno o dos.
          - texto: IT9 para el agujero e IT8 para el eje, que suman 141 µm
            mensaje: |
              Cabe, deja letras que cumplen —H9/m8, por ejemplo— y respeta $T > t$. Pero hay una
              suma mayor que también deja letra, la de IT9 con IT9, y las soluciones de la hoja se
              quedan con la mayor: la tolerancia más amplia que cabe.
          - texto: IT9 para los dos, que suman 174 µm
            correcta: true
            mensaje: |
              Eso es. Es la mayor suma que cabe a no más de dos puntos y deja alguna letra dentro
              de los dos límites. Iguala las calidades, así que no cumple $T > t$: el libro lo pide
              «siempre que sea posible» (pág. 8-20), y la solución se queda con la tolerancia más
              amplia.

      - tipo: reconocer
        pregunta: |
          Con H9, de 0 a +87 µm, y un eje de calidad 9, con 87 µm de zona, ¿qué letras del eje
          dejan el juego máximo y el apriete máximo en 100 µm o menos?
        opciones:
          - texto: La k y la m, porque hace falta una diferencia inferior entre −13 y +13 µm, y la k da 0 y la m +13
            correcta: true
            mensaje: |
              Eso es. El juego máximo, $87 - d_i \le 100$, pide $d_i \ge -13$; el apriete máximo,
              $d_i + 87 \le 100$, pide $d_i \le 13$. H9/k9 deja el juego y el apriete máximos en
              87 µm, y H9/m9, en 74 y 100. La solución oficial da la m; el material no dice por qué
              esa y no la k, y las dos cumplen los mismos criterios del tema.
          - texto: Solo la m, que es la de la solución oficial
            mensaje: |
              La m cumple, pero no es la única. Con la k, de 0 a +87 µm, el juego máximo es
              87 − 0 = 87 y el apriete máximo, 87 − 0 = 87: los dos por debajo de 100.
          - texto: La m y la n
            mensaje: |
              La n se pasa: empieza en +23 µm y llega a +110, así que el apriete máximo sería
              110 − 0 = 110 µm, más de los 100 que permite el enunciado.
          - texto: La js, que deja el juego y el apriete iguales
            mensaje: |
              La js reparte la zona a partes iguales, de −43,5 a +43,5 µm, y entonces el juego
              máximo es 87 + 43,5 = 130,5 µm: se pasa de 100.

      - tipo: calcular
        titulo: El juego máximo en agujero único
        pregunta: |
          Apartado b). La solución oficial da Ø100 H9/m9: H9 de 0 a +87 µm, y la m de la Tabla 5,
          $d_i = +13$ µm en la fila de 80 a 100 mm. ¿Cuánto vale su juego máximo?
        respuesta:
          tipo: numero
          valor: '74'
          tolerancia: 1
          formato: un número, en µm
        distractores:
          - valor: '174'
            mensaje: |
              Has sumado las dos tolerancias, 87 + 87. Esa es la tolerancia del ajuste, lo que va
              del juego máximo al apriete máximo. El juego máximo es solo uno de los dos
              extremos.
          - valor: '100'
            mensaje: |
              Has tomado la m como −13 µm. −13 es la M mayúscula de los agujeros, en la Tabla 2;
              la m minúscula de los ejes está en la Tabla 5 y vale +13, por encima de la línea
              cero. Con $d_i = +13$, el juego máximo es $87 - 13$. Y si has hecho
              $d_s - D_i = 100 - 0$, eso es el apriete máximo, el otro extremo: el juego máximo
              junta el agujero más grande con el eje más pequeño, $D_s - d_i$.
          - valor: '-13'
            mensaje: |
              Has restado $D_s - d_s = 87 - 100$. El juego máximo junta el agujero **más grande**
              con el eje **más pequeño**: $D_s - d_i$, y el eje más pequeño es su diferencia
              inferior, $d_i = +13$.
          - valor: '0.074'
            mensaje: |
              Eso son 74 µm escritos en milímetros. Los juegos se dan en micras, como las tablas.
        pista: |
          H9 va de 0 a +87 µm. El eje m9 va de $d_i = +13$ a $d_s = 13 + 87 = 100$ µm. El juego
          máximo junta el agujero más grande con el eje más pequeño.
        desarrollo: |
          $$
          J_{\max} = D_s - d_i = 87 - 13 = 74
          $$

          Son micras, y no pasan de los 100 que permite el enunciado.

      - tipo: calcular
        titulo: El apriete máximo en agujero único
        pregunta: |
          ¿Y el apriete máximo del mismo H9/m9, $A_{\max}$?
        respuesta:
          tipo: numero
          valor: '100'
          tolerancia: 1
          formato: un número, en µm
        distractores:
          - valor: '13'
            mensaje: |
              Has restado $d_i - D_i = 13 - 0$. El apriete máximo junta el eje **más grande** con
              el agujero **más pequeño**: $d_s - D_i$, y el eje más grande es su diferencia
              superior, $d_s = 13 + 87 = 100$.
          - valor: '87'
            mensaje: |
              Es como si el eje fuera de 0 a +87 µm, sin la m que lo sube. La zona mide 87, pero
              empieza en $d_i = +13$: el eje llega a +100.
          - valor: '174'
            mensaje: |
              Has sumado las dos tolerancias, 87 + 87. Esa es la tolerancia del ajuste; el
              apriete máximo es solo uno de los dos extremos.
          - valor: '0.1'
            mensaje: |
              Eso son 100 µm escritos en milímetros. Los aprietes se dan en micras, como las
              tablas.
        pista: |
          El eje más grande, $d_s = +100$ µm; el agujero más pequeño, $D_i = 0$.
        desarrollo: |
          $$
          A_{\max} = d_s - D_i = 100 - 0 = 100
          $$

          Justo el límite del enunciado, que lo admite: «apriete máximo de 100 µm». Y los dos
          extremos juntos dan la tolerancia del ajuste: $74 + 100 = 174 = T + t$.

      - tipo: calcular
        titulo: El juego máximo en eje único
        pregunta: |
          Apartado c). En eje único el eje es h9, de 0 a −87 µm, y la solución oficial da Ø100
          M9/h9. La M de la Tabla 2 vale −13 µm por encima de IT8, y es la diferencia superior.
          ¿Cuánto vale el juego máximo?
        respuesta:
          tipo: numero
          valor: '74'
          tolerancia: 1
          formato: un número, en µm
        distractores:
          - valor: '161'
            mensaje: |
              Has tomado −13 como la diferencia **inferior** de M9. De la J a la ZC, la tabla de
              agujeros da la **superior**: $D_s = -13$ y $D_i = -13 - 87 = -100$.
          - valor: '100'
            mensaje: |
              Has tomado la M con el signo de la m de los ejes, +13. La M mayúscula deja el
              agujero por debajo de la línea cero: −13. Y 100 también es el apriete máximo,
              $d_s - D_i = 0 - (-100)$: si has calculado ese, te has ido al otro extremo, y el
              juego máximo es $D_s - d_i$.
          - valor: '93'
            mensaje: |
              Le has sumado el Δ de IT8, 19 µm, y te ha salido $D_s = +6$. La Tabla 2 da para la M
              dos columnas, −13 + Δ hasta IT8 incluido y −13 por encima, y un agujero de calidad 9
              va con la segunda, sin Δ.
          - valor: '174'
            mensaje: |
              Has sumado las dos tolerancias, 87 + 87. Esa es la tolerancia del ajuste; el juego
              máximo es solo uno de los dos extremos.
          - valor: '0.074'
            mensaje: |
              Eso son 74 µm escritos en milímetros. Los juegos se dan en micras, como las tablas.
        pista: |
          M9 va de $D_s = -13$ a $D_i = -13 - 87 = -100$ µm; h9, de $d_s = 0$ a $d_i = -87$ µm.
        desarrollo: |
          $$
          J_{\max} = D_s - d_i = -13 - (-87) = 74
          $$

          $$
          A_{\max} = d_s - D_i = 0 - (-100) = 100
          $$

          Los mismos que H9/m9: M9/h9 es H9/m9 bajado 100 µm, con las dos calidades iguales.

      - tipo: reconocer
        pregunta: |
          La solución oficial no es el único ajuste que cumple. De estos cuatro, ¿cuál **no** deja
          el juego máximo y el apriete máximo en 100 µm o menos?
        opciones:
          - texto: H9/k9
            mensaje: |
              Este sirve: 87 µm de juego máximo y 87 de apriete máximo. Suma lo mismo que H9/m9, y
              aunque la solución oficial no lo dé, cumple los dos límites.
          - texto: N9/h9
            mensaje: |
              Este sirve: por encima de IT8 la N vale 0, así que N9 va de 0 a −87 µm, y con h9
              deja 87 de juego máximo y 87 de apriete máximo. Es H9/k9 bajado 87 µm.
          - texto: H9/m8
            mensaje: |
              Este sirve: m8 va de +13 a +67 µm, y deja 74 de juego máximo y 67 de apriete
              máximo. Es el que respetaría $T > t$, con menos tolerancia.
          - texto: H10/m8
            correcta: true
            mensaje: |
              Eso es. Es lo que sale de quedarse con la primera suma, IT10 + IT8 = 194, sin
              comprobar: H10 llega a +140 µm y la m8 empieza en +13, así que el juego máximo es
              140 − 13 = 127 µm, más de 100. Por eso el procedimiento termina comprobando.

      - tipo: dibujar
        consigna: |
          Apartado d). Dibuja en papel las zonas de tolerancia de los dos ajustes de la solución,
          Ø100 H9/m9 y Ø100 M9/h9: la línea cero, la zona del agujero y la del eje a una escala de
          micras que quepa en el folio, y en cada borde su diferencia y su cota. Cuando lo tengas,
          compáralo con la figura y con la lista.
        comprueba:
          - punto: Una línea cero horizontal, que es la cota nominal, 100, y las dos zonas como rectángulos a su altura, el agujero a un lado y el eje al otro.
            porque: |
              Las diferencias se cuentan desde la línea cero (Tema 7, págs. 7 y 8): sin ella no hay
              desde dónde poner ningún borde. Es el esquema de las diapositivas de los tipos de
              ajuste y de los dos sistemas (págs. 15 y 16), y el de las figuras 8.15 a 8.17 del
              libro (págs. 8-21 y 8-22).
          - punto: En agujero único, H9 de 0 a +87 y m9 de +13 a +100, las dos por encima de la línea cero y solapadas; en eje único, M9 de −13 a −100 y h9 de 0 a −87, las dos por debajo.
            porque: |
              Que se pisen es lo que hace el ajuste indeterminado. Del borde de arriba del eje al
              de abajo del agujero van los 100 µm del apriete máximo, y del borde de arriba del
              agujero al de abajo del eje, los 74 del juego máximo, en los dos dibujos.
          - punto: Las cuatro zonas con la misma altura, 87 µm, porque las dos calidades son 9.
            porque: |
              En este ajuste agujero y eje tienen la misma calidad, así que sus zonas miden lo
              mismo. Si dibujas una más alta que otra, has puesto otra calidad. Y si la M9 te sale
              de +6 a −81, la altura es buena, pero le has sumado un Δ que con IT9 no lleva: la
              zona queda 19 µm más arriba.
          - punto: En cada borde, su diferencia en micras con su signo y su cota en milímetros, 100,000 y 100,087 para H9, 100,013 y 100,100 para m9, 99,987 y 99,900 para M9, y 100,000 y 99,913 para h9.
            porque: |
              El apartado pide las dos cosas: «cotas mínima y máxima y diferencias superior e
              inferior». Una diferencia negativa es una cota por debajo de la nominal: −13 µm son
              99,987 mm.
        figura: |
