      - tipo: justificar
        pregunta: Ordena la resolución del ejercicio. Una pieza no debe entrar.
        piezas:
          - texto: 'La tolerancia del ajuste es Jmáx + Amáx = 100 + 100 = 200 µm: lo más que pueden sumar T y t.'
          - texto: IT10 + IT8 = 194 cabe, pero con H10 ninguna letra deja los dos límites, e IT10 + IT7 salta tres calidades; queda IT9 + IT9 = 174.
          - texto: Con H9, la diferencia inferior del eje tiene que quedar entre −13 y +13 µm, y valen la k y la m; la solución oficial da la m.
          - texto: H9/m9 deja Jmáx = 87 − 13 = 74 µm y Amáx = 100 − 0 = 100 µm, y en eje único M9/h9 da los mismos.
          - texto: Como la solución oficial es H9/m9, H9/k9 no cumple el enunciado.
            trampa: true
            mensaje: |
              Sí lo cumple: deja 87 µm de juego máximo y 87 de apriete máximo, los dos por debajo
              de 100, y suma lo mismo, 174. La solución da la m, pero el enunciado no la exige.
    resolucion: |
      **a) La tolerancia del ajuste.** En un ajuste indeterminado,
      $T_I = J_{\max} + A_{\max} = 100 + 100 = 200$ µm. Es lo más que pueden sumar la tolerancia
      del agujero y la del eje.

      **Las calidades.** En la fila de 80 a 120 mm de la Tabla 1, IT10 + IT8 = 140 + 54 = 194 µm
      cabe en 200, pero no deja letra: con H10 el eje tendría que empezar entre +40 y +46 µm, y en
      la fila de 80 a 100 mm la p da +37 y la r +51. IT10 + IT7 = 175 cabe y deja la r, pero salta
      tres calidades. La siguiente es IT9 + IT9 = 87 + 87 = 174 µm, con las dos calidades iguales.

      **b) Agujero único.** El agujero es H9: $D_i = 0$, $D_s = +87$ µm. El eje de calidad 9
      cumple si su diferencia inferior queda entre −13 y +13 µm, y en la Tabla 5 eso lo hacen la
      k, con 0, y la m, con +13. La solución oficial da **Ø100 H9/m9**: el eje va de $d_i = +13$
      a $d_s = +100$ µm.

      $$
      J_{\max} = D_s - d_i = 87 - 13 = 74 \qquad A_{\max} = d_s - D_i = 100 - 0 = 100
      $$

      Los dos, en micras, dentro de lo pedido.

      **c) Eje único.** El eje es h9: $d_s = 0$, $d_i = -87$ µm. La M de la Tabla 2, por encima de
      IT8, da la diferencia superior del agujero, $D_s = -13$ µm, y con IT9, $D_i = -100$ µm. El
      ajuste es **Ø100 M9/h9**, con los mismos juegos: $J_{\max} = -13 + 87 = 74$ µm y
      $A_{\max} = 0 + 100 = 100$ µm. Es H9/m9 bajado 100 µm, con las mismas calidades.

      **d) Las cifras del dibujo.** Con la nominal de 100 mm:

      - H9: diferencias 0 y +87 µm, cotas 100,000 y 100,087 mm.
      - m9: diferencias +13 y +100 µm, cotas 100,013 y 100,100 mm.
      - M9: diferencias −13 y −100 µm, cotas 99,987 y 99,900 mm.
      - h9: diferencias 0 y −87 µm, cotas 100,000 y 99,913 mm.

      En los dos dibujos las zonas se pisan: eso es un ajuste indeterminado.

      **No es el único ajuste que cumple.** H9/k9 deja 87 µm de juego máximo y 87 de apriete
      máximo, suma lo mismo que H9/m9, y su eje único es N9/h9; el material no dice por qué la
      solución elige la m. H9/m8 también cumple, con menos tolerancia. H10/m8, que es quedarse con
      la suma de 194 sin comprobar, no: su juego máximo llega a 127 µm.

  # Decisión: el reparto, por la misma regla que en el 2 (IT8 + IT7 = 76 cabe y
  # no deja letra; queda IT8 + IT6 = 65). Y un reconocer con el agujero del eje
  # único, porque aquí la letra cambia (H8/u6 → T8/h6), y copiarla, U8/h6, se
  # pasa del apriete máximo (guiones/ajustes.salida.txt).
  # Decisión: la opción que no sirve es H8/u8, la que la tabla de ajustes
  # recomendados del tema pone para el «prensado duro» (Tema 7, pág. 18): es
  # el error que el material tiene a mano, como F8/h9 en el ajuste 1.
  - id: ajustes-3-un-ajuste-con-apriete-de-70
    titulo: Un ajuste con apriete de Ø70, entre 50 y 130 µm
    fuente: Ejercicio 3 · «Ajustes – Tolerancias dimensionales», hoja de ejercicios de Expresión Gráfica, EIG · UPV/EHU. Solución oficial en la hoja de soluciones de la asignatura (fichero «Ejercicios – Solución»), que da solo las designaciones, Ø70 T8/h6 y Ø70 H8/u6.
    nivel: practica
    enunciado: |
      En un ajuste con apriete, el diámetro nominal del eje y del orificio es de 70 mm, y el
      apriete debe estar comprendido entre 130 µm y 50 µm. Calcular:

      a. La tolerancia del ajuste.

      b. Las dimensiones normalizadas del ajuste ISO, según el sistema de agujero único.

      c. Las dimensiones normalizadas del ajuste ISO, según el sistema de eje único.

      d. El dibujo del conjunto, indicando las zonas de tolerancia, dimensiones, cotas mínima y
      máxima y diferencias superior e inferior.

      **Notas nuestras.** Las filas de la UNE-EN ISO 286-1:2011 que hacen falta para 70 mm:
      Tabla 1 (pág. 30 de la norma), fila de 50 a 80 mm, IT6 = 19 µm, IT7 = 30 µm e IT8 = 46 µm;
      Tabla 3 (pág. 32), agujeros, fila de 65 a 80 mm, P = −32 µm, R = −43 µm, S = −59 µm,
      T = −75 µm, U = −102 µm y V = −120 µm por encima de IT7, que son la diferencia superior, y
      hasta IT7 incluido se les suma Δ, que en esa fila vale 11 µm para IT7 (la columna de IT8,
      16 µm, es para K, M y N); Tabla 5 (pág. 35), ejes, la misma fila,
      t = +75 µm y u = +102 µm, que son la diferencia inferior. La H y la h arrancan en la línea
      cero. Son las págs. 1, 3 y 6 de «Tablas ISO – Tolerancias dimensionales», el PDF de la
      asignatura. El d) se dibuja en papel y se compara en el penúltimo paso.
    pide: La tolerancia del ajuste, los aprietes máximo y mínimo del ajuste de agujero único y el apriete máximo del de eje único, en µm.
    pasos:
      - tipo: reconocer
        pregunta: El apriete tiene que quedar entre 50 y 130 µm. ¿Qué dice eso de las dos zonas de tolerancia?
        opciones:
          - texto: Que la zona del agujero queda entera por debajo de la del eje, y nunca a menos de 50 µm de ella
            correcta: true
            mensaje: |
              Eso es. Hasta el peor caso deja 50 µm de apriete, así que nunca hay juego: es un
              ajuste fijo, y sus aprietes salen de $A_{\max} = d_s - D_i$ y $A_{\min} = d_i - D_s$.
          - texto: Que la zona del agujero queda entera por encima de la del eje
            mensaje: |
              Eso es un ajuste móvil, como el 1 de la misma hoja: siempre con juego. Con apriete
              es al revés, el eje siempre más grande que el agujero.
          - texto: Que las dos zonas se pisan, y unas veces habrá juego y otras apriete
            mensaje: |
              Eso es un ajuste **indeterminado**, como el 2. Aquí el apriete mínimo es positivo:
              las zonas no llegan a tocarse.
          - texto: Que el agujero tiene 130 µm de tolerancia y el eje, 50 µm
            mensaje: |
              130 y 50 son **aprietes**: lo que el eje pasa del agujero en los dos casos
              extremos. Las tolerancias de cada pieza las eliges tú, y entre las dos tienen que
              caber en lo que va de un apriete al otro.

      - tipo: calcular
        titulo: La tolerancia del ajuste
        pregunta: |
          Apartado a). ¿Cuánto vale la tolerancia del ajuste, $T_A$?
        respuesta:
          tipo: numero
          valor: '80'
          tolerancia: 1
          formato: un número, en µm
        distractores:
          - valor: '180'
            mensaje: |
              Has sumado los dos aprietes. Una suma, $J_{\max} + A_{\max}$, es la tolerancia de un
              ajuste **indeterminado**; en uno con apriete es la diferencia,
              $A_{\max} - A_{\min}$.
          - valor: '0.08'
            mensaje: |
              Eso son 80 µm escritos en milímetros. Las tolerancias y los aprietes se dan en
              micras, que es como vienen en las tablas.
          - valor: '65'
            mensaje: |
              65 es $T + t$ del H8/u6 que sale después, 46 + 19: la tolerancia del ajuste
              **elegido**. El a) pide la que permite el enunciado, y la del elegido tiene que
              caber dentro.
        pista: |
          En un ajuste con apriete, $T_A = A_{\max} - A_{\min}$ (Tema 7, pág. 15), y el
          enunciado da los dos.
        desarrollo: |
          $$
          T_A = A_{\max} - A_{\min} = 130 - 50 = 80
          $$

          Son micras. Es lo más que pueden sumar la tolerancia del agujero y la del eje,
          $T + t \le 80$.

      - tipo: reconocer
        pregunta: |
          Hay que repartir esos 80 µm entre dos calidades de la fila de 50 a 80 mm: IT6 = 19,
          IT7 = 30 e IT8 = 46 µm. ¿Con qué reparto se quedan las soluciones de la hoja?
        opciones:
          - texto: IT8 para el agujero e IT7 para el eje, que suman 76 µm
            mensaje: |
              Cabe en 80, y es el primero que se prueba, pero no deja ninguna letra. Con H8, de 0 a
              +46 µm, y un eje de 30 µm de zona, el apriete mínimo pide que el eje empiece en +96
              µm o más, y el máximo, que no empiece por encima de +100. En la fila de 65 a 80 mm la
              t da +75 y la u +102: ninguna cae entre 96 y 100.
          - texto: IT8 para el agujero e IT6 para el eje, que suman 65 µm
            correcta: true
            mensaje: |
              Eso es. Es la mayor suma que cabe a no más de dos puntos y deja letra: con H8 y un eje
              de 19 µm de zona, la u, que empieza en +102, deja el apriete entre 56 y 121 µm. La
              tolerancia mayor va al agujero.
          - texto: IT8 para los dos, que suman 92 µm
            mensaje: |
              Se pasa: 92 > 80. Pongas la letra que pongas, el apriete variaría 92 µm, y entre 50
              y 130 solo caben 80.
          - texto: IT7 para el agujero e IT6 para el eje, que suman 49 µm
            mensaje: |
              Cabe, y H7/u6 cumple: apriete de 72 a 121 µm. Pero hay una suma mayor que también
              deja letra, 65, y la precisión es cara: el libro pide tolerancias «tan amplias como
              sea posible» (pág. 8-19).

      - tipo: calcular
        titulo: El apriete máximo en agujero único
        pregunta: |
          Apartado b). En agujero único el agujero es H8, de 0 a +46 µm. La letra del eje que deja
          el apriete mínimo más cerca de 50 µm sin quedarse corto es la u, con $d_i = +102$ µm, y
          la solución oficial da Ø70 H8/u6. ¿Cuánto vale su apriete máximo?
        respuesta:
          tipo: numero
          valor: '121'
          tolerancia: 1
          formato: un número, en µm
        distractores:
          - valor: '65'
            mensaje: |
              Has sumado las dos tolerancias, 46 + 19. Esa es la tolerancia del ajuste, lo que
              **varía** el apriete. El apriete máximo es mayor: como las dos zonas no se tocan,
              a esa variación se le suma el apriete mínimo que queda entre ellas.
          - valor: '102'
            mensaje: |
              Has restado $d_i - D_i = 102 - 0$. El apriete máximo junta el eje **más grande** con
              el agujero **más pequeño**: $d_s - D_i$, y el eje más grande es su diferencia
              superior, $d_s = 102 + 19 = 121$.
          - valor: '56'
            mensaje: |
              Ese es el apriete **mínimo**, $d_i - D_s = 102 - 46$: el eje más pequeño en el
              agujero más grande. El máximo es el contrario, $d_s - D_i$.
          - valor: '148'
            mensaje: |
              Has dado al eje la calidad del agujero: u8 llegaría a 102 + 46 = 148 µm. El reparto
              da IT6 al eje, y u6 va de +102 a +121 µm.
          - valor: '0.121'
            mensaje: |
              Eso son 121 µm escritos en milímetros. Los aprietes se dan en micras, como las
              tablas.
        pista: |
          H8 va de 0 a +46 µm. El eje u6 va de $d_i = +102$ a $d_s = 102 + 19 = 121$ µm. El
          apriete máximo junta el eje más grande con el agujero más pequeño.
        desarrollo: |
          $$
          A_{\max} = d_s - D_i = 121 - 0 = 121
          $$

          Son micras, y no pasan de los 130 que permite el enunciado.

      - tipo: calcular
        titulo: El apriete mínimo en agujero único
        pregunta: |
          ¿Y el apriete mínimo del mismo H8/u6, $A_{\min}$?
        respuesta:
          tipo: numero
          valor: '56'
          tolerancia: 1
          formato: un número, en µm
        distractores:
          - valor: '102'
            mensaje: |
              Has restado $d_i - D_i = 102 - 0$, como si el agujero no tuviera zona. El apriete
              mínimo junta el eje **más pequeño** con el agujero **más grande**: $d_i - D_s$, y el
              agujero más grande llega a $D_s = +46$.
          - valor: '75'
            mensaje: |
              Has restado los dos bordes de arriba, $d_s - D_s = 121 - 46$. El apriete mínimo
              junta los extremos **opuestos**: el eje en su mínimo y el agujero en su máximo,
              $d_i - D_s$.
          - valor: '-56'
            mensaje: |
              −56 es el juego máximo, $D_s - d_i$, que en un ajuste con apriete sale negativo. Lo
              que se pide es el apriete mínimo, $d_i - D_s$, que es el mismo número con el signo
              cambiado.
          - valor: '0.056'
            mensaje: |
              Eso son 56 µm escritos en milímetros. Los aprietes se dan en micras, como las
              tablas.
        pista: |
          Eje lo más pequeño, $d_i = +102$ µm; agujero lo más grande, $D_s = +46$ µm.
        desarrollo: |
          $$
          A_{\min} = d_i - D_s = 102 - 46 = 56
          $$

          Los dos aprietes caen dentro de lo pedido: $56 \ge 50$ y $121 \le 130$.

      - tipo: reconocer
        pregunta: |
          Apartado c). En eje único el eje es h6, de 0 a −19 µm. ¿Qué agujero de calidad 8 deja el
          apriete entre 50 y 130 µm?
        opciones:
          - texto: T8, de −75 a −121 µm
            correcta: true
            mensaje: |
              Eso es. Con h6 deja el apriete entre 56 y 121 µm, los mismos que H8/u6: en esta fila,
              T8/h6 es H8/u6 bajado 121 µm, con las calidades conservadas. Fíjate en que la letra
              **cambia**: la u del eje no pasa a U en el agujero.
          - texto: U8, la misma letra que llevaba el eje
            mensaje: |
              U8 va de −102 a −148 µm, y con h6 el apriete iría de 83 a 148: se pasa de 130.
              Aquí copiar la letra no conserva el montaje. Lo que se hace es buscar, con h6 y
              calidad 8, la letra del agujero que deja el apriete dentro; en esta fila, bajar H8/u6
              entero 121 µm da justo la T.
          - texto: S8, de −59 a −105 µm
            mensaje: |
              Con h6, el apriete mínimo sería −19 − (−59) = 40 µm, por debajo de los 50 que pide
              el enunciado.
          - texto: Cualquiera que quede entera por debajo de la línea cero
            mensaje: |
              Quedar por debajo de la línea cero solo dice que hay apriete, no cuánto. Con h6 y un
              agujero de calidad 8, de todas las letras de la tabla solo la T deja el apriete
              entre 50 y 130 µm.

      - tipo: calcular
        titulo: El apriete máximo en eje único
        pregunta: |
          La solución oficial da Ø70 T8/h6. La T de la Tabla 3 vale −75 µm en la fila de 65 a
          80 mm por encima de IT7, y es la diferencia superior. ¿Cuánto vale el apriete máximo?
        respuesta:
          tipo: numero
          valor: '121'
          tolerancia: 1
          formato: un número, en µm
        distractores:
          - valor: '75'
            mensaje: |
              Has tomado −75 como la diferencia **inferior** de T8. De la J a la ZC, la tabla de
              agujeros da la **superior**: $D_s = -75$ y $D_i = -75 - 46 = -121$.
          - valor: '-29'
            mensaje: |
              Has tomado la T con el signo de la t de los ejes, +75. La T mayúscula deja el
              agujero por debajo de la línea cero, −75. Con +75 el agujero quedaría por encima del
              eje, y saldría juego.
          - valor: '105'
            mensaje: |
              Le has sumado el Δ de IT8, 16 µm, y te ha salido $D_s = -59$. La Tabla 3 solo suma Δ
              hasta IT7 incluido; T8 va sin él.
          - valor: '65'
            mensaje: |
              Has sumado las dos tolerancias, 46 + 19. Esa es la tolerancia del ajuste; el apriete
              máximo es mayor, porque se le suma el apriete mínimo que queda entre las dos zonas.
          - valor: '0.121'
            mensaje: |
              Eso son 121 µm escritos en milímetros. Los aprietes se dan en micras, como las
              tablas.
        pista: |
          T8 va de $D_s = -75$ a $D_i = -75 - 46 = -121$ µm; h6, de $d_s = 0$ a $d_i = -19$ µm.
        desarrollo: |
          $$
          A_{\max} = d_s - D_i = 0 - (-121) = 121
          $$

          $$
          A_{\min} = d_i - D_s = -19 - (-75) = 56
          $$

          Los mismos que H8/u6.

      - tipo: reconocer
        pregunta: |
          La solución oficial no es el único ajuste que cumple. De estos cuatro, ¿cuál **no** deja
          el apriete entre 50 y 130 µm?
        opciones:
          - texto: H7/u6
            mensaje: |
              Este sirve: H7 va de 0 a +30 µm, y con u6 el apriete va de 72 a 121 µm. Es más
              preciso de lo necesario, pero cumple.
          - texto: U7/h7
            mensaje: |
              Este sirve: U7, de calidad 7, lleva el Δ, así que su diferencia superior es
              −102 + 11 = −91 µm y la inferior −121. Con h7 el apriete va de 61 a 121 µm.
          - texto: T8/h6
            mensaje: |
              Este sirve: es la solución oficial del c), con los mismos aprietes que H8/u6, de 56
              a 121 µm.
          - texto: H8/u8
            correcta: true
            mensaje: |
              Eso es. Es la pareja que la tabla de ajustes recomendados del tema pone para el
              «prensado duro» (pág. 18), pero u8 llega a 102 + 46 = 148 µm, y el apriete máximo
              pasa de 130. El eje que cumple con H8 es u6.

      - tipo: dibujar
        consigna: |
          Apartado d). Dibuja en papel las zonas de tolerancia de los dos ajustes de la solución,
          Ø70 H8/u6 y Ø70 T8/h6: la línea cero, la zona del agujero y la del eje a una escala de
          micras que quepa en el folio, y en cada borde su diferencia y su cota. Cuando lo tengas,
          compáralo con la figura y con la lista.
        comprueba:
          - punto: Una línea cero horizontal, que es la cota nominal, 70, y las dos zonas como rectángulos a su altura, el agujero a un lado y el eje al otro.
            porque: |
              Las diferencias se cuentan desde la línea cero (Tema 7, págs. 7 y 8): sin ella no hay
              desde dónde poner ningún borde. Es el esquema de las diapositivas de los tipos de
              ajuste y de los dos sistemas (págs. 15 y 16), y el de las figuras 8.15 a 8.17 del
              libro (págs. 8-21 y 8-22).
          - punto: En agujero único, H8 de 0 a +46 y u6 de +102 a +121, con el eje entero por encima del agujero; en eje único, T8 de −75 a −121 y h6 de 0 a −19, con el agujero entero por debajo.
            porque: |
              Es lo que hace el ajuste fijo: el eje, siempre más grande que el agujero. El hueco
              entre las dos zonas, 56 µm en los dos dibujos, es el apriete mínimo, y de la punta de
              arriba del eje a la de abajo del agujero van los 121 µm del máximo.
          - punto: Cada pieza con la misma altura de zona en los dos dibujos, 46 µm el agujero y 19 µm el eje.
            porque: |
              Las dos soluciones conservan las calidades, así que cada zona conserva su altura; en
              esta fila, además, T8/h6 es H8/u6 bajado 121 µm. Si el agujero de abajo te sale con
              otra altura, has cambiado una calidad.
          - punto: En cada borde, su diferencia en micras con su signo y su cota en milímetros, 70,000 y 70,046 para H8, 70,102 y 70,121 para u6, 69,925 y 69,879 para T8, y 70,000 y 69,981 para h6.
            porque: |
              El apartado pide las dos cosas: «cotas mínima y máxima y diferencias superior e
              inferior». Una diferencia negativa es una cota por debajo de la nominal: −75 µm son
              69,925 mm.
        figura: |
          <svg viewBox="0 0 380 376" role="img" width="380" height="376" aria-labelledby="t12zonas3-t t12zonas3-d">
            <title id="t12zonas3-t">Las zonas de tolerancia del ajuste 3: Ø70 H8/u6 y T8/h6</title>
