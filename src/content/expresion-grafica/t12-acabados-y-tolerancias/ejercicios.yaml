      - tipo: justificar
        pregunta: Ordena la resolución, de A a D. Una pieza es falsa.
        piezas:
          - texto: 'A: una coaxialidad de Ø0,05, con la flecha en línea con la cota de Ø100 y la referencia A en línea con la cota de Ø140.'
          - texto: 'B: una perpendicularidad de 0,1 respecto de A, con la flecha en la base E o en su prolongación, lejos de las cotas.'
          - texto: 'C: dos marcos de cilindricidad de 0,05, sin letra, uno en la superficie B y otro en la C.'
          - texto: 'D: un paralelismo de 0,04 en el techo D, respecto de la base E, que lleva su triángulo y su letra.'
          - texto: 'C: un solo marco de cilindricidad de 0,05 en la superficie C, con la superficie B de referencia, porque la hoja la pide «entre las superficies B y C».'
            trampa: true
            mensaje: |
              La cilindricidad es de forma, y las de forma van sin referencia (pág. 7): controla
              cómo de cilíndrica es una superficie sola. Pedirla «entre B y C» es pedirla en las
              dos, cada una con su marco.
    resolucion: |
      **No hay solución oficial.** La hoja trae la pieza y los cuatro apartados, sin resolver. Lo
      que sigue es nuestro, y donde hay más de una forma buena se dice.

      **La referencia común.** A y B relacionan algo con el diámetro Ø140, y tomamos su eje
      como referencia de los dos: un triángulo en línea con la cota de Ø140 y la letra A. En
      línea con la cota señala el eje, no la superficie (tabla resumen, figura 4).

      **A.** Coaxialidad, el símbolo de las dos circunferencias, con **Ø0,05**: «de diámetro»
      quiere decir que la zona es un cilindro (descripción, pág. 1, impresa 195). La hoja dice
      «cocentricidad»; entre dos cilindros es coaxialidad, con el mismo símbolo (descripción,
      págs. 16 y 17). Marco: coaxialidad, Ø0,05, A, con la flecha en línea con la cota de Ø100.
      Si tomas de referencia el agujero y controlas el Ø140, también vale; nosotros
      reaprovechamos la referencia de B.

      **B.** Perpendicularidad de la base E respecto del eje A: marco con perpendicularidad, 0,1
      y A, y la flecha en E o en su prolongación, separada de las cotas. La zona son dos planos
      a 0,1, perpendiculares al eje (descripción, pág. 10, impresa 204). La hoja no dice cuál
      de los dos es la referencia. Al revés también vale: la base E de referencia, y el eje de
      Ø140 perpendicular a ella, con la flecha en línea con la cota de Ø140. Tomamos el eje
      porque ya sirve a A, y porque B, a diferencia de A, no dice «de diámetro», que es lo
      que lleva un eje perpendicular a un plano en la descripción (pág. 10, impresa 204:
      Ø0,01).

      **C.** Cilindricidad, de forma, sin referencia: un marco con cilindricidad y 0,05 en la
      superficie B y otro igual en la C, cada uno con la flecha en su superficie. La zona de cada
      uno son dos cilindros coaxiales cuyos radios se diferencian en 0,05 (diapositivas,
      pág. 12).

      **D.** Paralelismo de 0,04 entre dos caras planas, con una de ellas de referencia; la hoja
      no dice cuál. Tomamos la base E, que ya está atada al eje por B: un triángulo en E con la
      letra E, y en D un marco con paralelismo, 0,04 y E. La zona son dos planos a 0,04
      paralelos a E (descripción, pág. 7, impresa 201). Con la referencia en D y el marco en E
      también cumple.

      **Las letras.** La figura ya llama B, C, D y E a cuatro superficies. Por eso el eje es A y
      la referencia de la base es la propia E: una B en el eje se leería como la superficie B.

  # Orden (§04): ejercicio nuestro de práctica que no es la entrada del tema,
  # así que va al final, detrás de los tres de la hoja.
  # Decisión: no tiene enunciado impreso (INSTRUCCIONES-K, «De clase sin
  # enunciado impreso»). La figura es el despiece sin cotas de las marcas 2 y
  # 8 que reparte la asignatura, redibujado por k-fig-marcas y copiado con
  # reetiqueta() (figuras/t12-acotalas-marcas.mjs); lo que se pide va en
  # `pide` y en «Notas nuestras.», sin imitar un texto de la escuela.
  # Decisión: en la pantalla no se mide (1 px no es 1 mm). Las medidas van en
  # «Notas nuestras.» como lecturas sobre el original a 1:1, redondeadas
  # (k-fig-marcas, comprobaciones/medidas-salida.txt; los diámetros y las
  # distancias entre centros, rehechos en guiones/mide-marcas.py). No son
  # cotas del profesor: el material no trae la solución.
  # Decisión: el COMP2 son dos pasos con una sola respuesta que se comprueba:
  # qué cotas llevan Ø, un `conjunto` sobre ocho cotas numeradas en el texto
  # que se decide con la geometría (circunferencia entera, arco de menos de
  # media vuelta, rosca o distancia entre caras), y la diferencia superior de
  # Ø15 H7, de una fila de la Tabla 1. Qué cotas poner y dónde no tiene una
  # sola respuesta, y no se finge: va en el `dibujar`, sin figura de solución
  # y con la lista sacada de los Criterios, citados tal cual.
  - id: acota-las-marcas-2-y-8
    titulo: Acota las marcas 2 y 8 de la polea directriz, con una tolerancia y un acabado
    fuente: Ejercicio nuestro · Road to Ingeniería, sobre el despiece sin cotas de las marcas 2 y 8 de la «Polea directriz» que reparte la asignatura (fichero «Marcas 2 y 8 sin cotas»), Dpto. de Expresión Gráfica y Proyectos de Ingeniería, UPV/EHU. El material no trae enunciado ni solución; la lista de comprobación sale de los «Criterios para la corrección de ejercicios y exámenes».
    nivel: practica
    enunciado: |
      <figure class="figura-examen">
      <svg viewBox="0 0 376.96 458.12" role="img" width="376.96" height="458.12" aria-labelledby="kt12b-m8-t kt12b-m8-d">
        <title id="kt12b-m8-t">La marca 8 de la polea directriz, el cuerpo auxiliar, en alzado, perfil y planta, sin cotas</title>
        <desc id="kt12b-m8-d">Despiece de la marca 8 de la polea directriz, redibujado del original sin cotas, a escala 1:1 y en el método europeo. La marca 8, el cuerpo auxiliar, es una escuadra en T: una placa vertical rectangular con las esquinas redondeadas y cuatro agujeros pasantes, de cuya cara sale, en su mitad inferior pero no desde el borde, una placa horizontal, también con cuatro agujeros pasantes y las esquinas del extremo redondeadas. Encima de la placa horizontal, un nervio central la une a la vertical: su borde superior sale horizontal de la placa vertical y luego baja en línea inclinada hasta la cara superior de la placa horizontal, a la que llega antes del extremo, entre sus dos filas de agujeros. Se ve en alzado (arriba a la izquierda), perfil (a su derecha) y planta (debajo del alzado). El perfil lleva un corte parcial en el extremo de la placa horizontal, y la planta otro en la placa vertical; los dos enseñan un agujero, van rayados y acaban en una línea de rotura. Las aristas vistas van en línea gruesa, los ejes en trazo y punto, las aristas ocultas en trazos y los cortes rayados. No lleva ninguna cota: la geometría está a la escala del original.</desc>
