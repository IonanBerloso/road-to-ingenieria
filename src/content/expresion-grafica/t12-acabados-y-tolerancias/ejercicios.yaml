      - tipo: justificar
        pregunta: Ordena la resolución del ejercicio. Una pieza no debe entrar.
        piezas:
          - texto: 'La tolerancia del ajuste es Amáx − Amín = 130 − 50 = 80 µm: lo más que pueden sumar T y t.'
          - texto: IT8 + IT7 = 76 cabe, pero con H8 ninguna letra deja el apriete entre 50 y 130; queda IT8 + IT6 = 65, con la mayor para el agujero.
          - texto: En agujero único, H8 va de 0 a +46 µm y la u, con di = +102 µm, deja el apriete mínimo más cerca de 50; el eje u6 va de +102 a +121.
          - texto: Amáx = 121 − 0 = 121 µm y Amín = 102 − 46 = 56 µm, dentro de lo pedido; en eje único, T8/h6 da los mismos.
          - texto: En eje único se conserva la letra, así que de H8/u6 sale U8/h6.
            trampa: true
            mensaje: |
              U8/h6 deja el apriete entre 83 y 148 µm, y se pasa de 130. En eje único se busca, con
              las mismas calidades, la letra del agujero que deja el apriete dentro, y aquí es la T:
              T8/h6, que es lo que pone la solución oficial.
    resolucion: |
      **a) La tolerancia del ajuste.** En un ajuste con apriete,
      $T_A = A_{\max} - A_{\min} = 130 - 50 = 80$ µm. Es lo más que pueden sumar la tolerancia del
      agujero y la del eje.

      **Las calidades.** En la fila de 50 a 80 mm de la Tabla 1, IT8 + IT7 = 46 + 30 = 76 µm cabe
      en 80, pero no deja letra: con H8 el eje tendría que empezar entre +96 y +100 µm, y en la
      fila de 65 a 80 mm la t da +75 y la u +102. La siguiente es IT8 + IT6 = 46 + 19 = 65 µm, con
      la tolerancia mayor para el agujero.

      **b) Agujero único.** El agujero es H8: $D_i = 0$, $D_s = +46$ µm. La letra del eje que deja
      el apriete mínimo más cerca de 50 µm sin quedarse corto es la u: en la Tabla 5, fila de 65 a
      80 mm, $d_i = +102$ µm. La t, +75, se queda corta: dejaría 29 µm de apriete mínimo. Con IT6,
      $d_s = 102 + 19 = 121$ µm. El ajuste es **Ø70 H8/u6**:

      $$
      A_{\max} = d_s - D_i = 121 - 0 = 121 \qquad A_{\min} = d_i - D_s = 102 - 46 = 56
      $$

      Los dos, en micras, dentro de 50 a 130.

      **c) Eje único.** El eje es h6: $d_s = 0$, $d_i = -19$ µm. Con IT8, el agujero que deja el
      apriete entre 50 y 130 µm es el de la T, que por encima de IT7 da $D_s = -75$ µm, y
      $D_i = -121$ µm. En esta fila coincide con bajar H8/u6 entero 121 µm. El ajuste es
      **Ø70 T8/h6**, con los mismos aprietes: $A_{\max} = 0 + 121 = 121$ µm y
      $A_{\min} = -19 + 75 = 56$ µm. La letra cambia: U8/h6 llevaría el apriete de 83 a 148 µm, y
      S8/h6 lo dejaría en 40 de mínimo.

      **d) Las cifras del dibujo.** Con la nominal de 70 mm:

      - H8: diferencias 0 y +46 µm, cotas 70,000 y 70,046 mm.
      - u6: diferencias +102 y +121 µm, cotas 70,102 y 70,121 mm.
      - T8: diferencias −75 y −121 µm, cotas 69,925 y 69,879 mm.
      - h6: diferencias 0 y −19 µm, cotas 70,000 y 69,981 mm.

      En los dos dibujos el eje queda entero por encima del agujero, separados 56 µm.

      **No es el único ajuste que cumple.** H7/u6 deja el apriete entre 72 y 121 µm, y U7/h7,
      entre 61 y 121. H8/u8, la pareja de la tabla de ajustes recomendados para el prensado duro,
      no: su apriete máximo llega a 148 µm.

  # Decisión (k-t12b): la pág. 3 de «Tolerancias geométricas – Ejercicios para
  # imprimir», con su enunciado tal cual y sus erratas («cocentricidad»,
  # «perpendicularid»). El dibujo del PDF es una imagen: se redibuja desde sus
  # cotas impresas (figuras-t12b.mjs, t12tg3-enun), y lo único que no está
  # impreso, que el agujero llega a 51 = 56 − 5, es cuenta nuestra. El
  # material no trae solución: la resolución y la figura del `dibujar`
  # (t12tg3-sol) son nuestras, y donde hay elección —qué es referencia en A y
  # en D, qué letras— se dice.
  # Decisión: las págs. 1 y 2 de la misma hoja no entran en esta unidad. Sus
  # dibujos no están acotados del todo, y redibujarlos pide medir la imagen;
  # la 2, además, tiene una sección A-A que no enseña el taladro que corta.
  - id: tolgeo-pag3-cuatro-tolerancias
    titulo: Cuatro tolerancias geométricas en una pieza de Ø140
    fuente: Ejercicio de la pág. 3 · «Tolerancias geométricas – Ejercicios para imprimir», hoja de ejercicios de Expresión Gráfica, EIG · UPV/EHU. El material no trae la solución; la resolución es nuestra.
    nivel: practica
    enunciado: |
      Se pide asegurar:

      A. Una cocentricidad de 0,05 mm de diámetro entre los diámetros Ø100 y Ø140.

      B. Una perpendicularid de 0,1 mm entre la superficie E y el diámetro Ø140.

      C. Cilindricidad de 0,05 mm entre las superficies B y C.

      D. Paralelismo entre las superficies E y D de 0,04 mm.

