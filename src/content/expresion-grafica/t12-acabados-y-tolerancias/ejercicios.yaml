      <svg viewBox="0 0 387.6 421.9" role="img" width="387.6" height="421.9" aria-labelledby="kt12b-m2-t kt12b-m2-d">
        <title id="kt12b-m2-t">La marca 2 de la polea directriz, el cuerpo principal, en alzado y perfil, con el detalle B a 5:1, sin cotas</title>
        <desc id="kt12b-m2-d">Despiece de la marca 2 de la polea directriz, redibujado del original sin cotas, a escala 1:1 con un detalle a 5:1 y en el método europeo. La marca 2, el cuerpo principal, es una horquilla: una brida rectangular con las esquinas redondeadas y cuatro agujeros, de la que salen dos orejas paralelas, de extremo redondeado en media circunferencia y unidas a la brida por tramos rectos, cada una con un taladro para el eje de la polea; en la cara exterior de la oreja delantera hay dos agujeros roscados ciegos, uno a cada lado del taladro y un poco por debajo. Se ve en alzado, con un corte parcial en la brida, y en perfil, con un corte parcial en la oreja trasera que enseña el taladro con sus chaflanes y, en la delantera, una circunferencia rotulada B con otro corte parcial pequeño que enseña los agujeros roscados, que en esa vista caen uno detrás del otro. Debajo, el detalle B a escala 5:1: el agujero roscado ciego en corte, con la punta cónica del taladro, el fondo de la rosca y el rayado alrededor, limitado por una línea de rotura. Las aristas vistas van en línea gruesa, los ejes en trazo y punto, las aristas ocultas en trazos y los cortes rayados. No lleva ninguna cota: la geometría está a la escala del original.</desc>
