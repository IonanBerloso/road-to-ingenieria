        <text class="kt12b-m2-l" x="9.9" y="14" text-anchor="middle" fill="var(--ink)">2</text>
        <text class="kt12b-m2-l" x="344" y="123.1" text-anchor="middle" fill="var(--ink)">B</text>
        <text class="kt12b-m2-l" x="226.6" y="258.1" text-anchor="middle" fill="var(--ink)">B (5:1)</text>
      </svg>
      </figure>

      **Notas nuestras.** Este ejercicio no tiene enunciado impreso: es nuestro, sobre el
      despiece sin cotas de las marcas 2 y 8 de la polea directriz, dibujado a escala 1:1 con el
      detalle B a 5:1. Lo que se pide es acotar las dos piezas para que se puedan fabricar, y
      poner en ellas una tolerancia dimensional y un acabado superficial con sentido mecánico,
      que es lo que piden seis de los diez mínimos de la hoja de criterios de corrección: los
      cuatro de acotación y los dos de tolerancias.

      En el plano de conjunto de la polea directriz, el eje, marca 1, entra en el taladro de 15
      de las dos orejas de la marca 2, y la polea gira entre ellas. El listón, marca 5, se
      atornilla en la cara de una oreja con dos tornillos M4 × 6 que entran en sus agujeros
      roscados. Las marcas 2 y 8 se atornillan entre sí, brida contra placa, con cuatro tornillos
      M6 × 40 y sus tuercas.

      En la pantalla no se puede medir: el dibujo se escala con el ancho de la columna. Estas son
      las medidas del plano a 1:1, leídas sobre el original y redondeadas; no son cotas del
      profesor.

      - **Marca 8.** Placa vertical de 60 × 90 y 15 de espesor, con las esquinas redondeadas de
        radio 10 y cuatro agujeros de 8 a 40 × 70 entre centros, a 10 de los bordes. Placa
        horizontal de 15 de espesor y 60 de ancho, como la vertical, que sale 70 de la cara de
        la vertical, con las esquinas del extremo de radio 10 y su cara de arriba a 50 de la
        arista de arriba de la vertical; cuatro agujeros de 10 a 40 × 50 entre centros, a 10 de
        los bordes laterales y el primero a 10 de la cara de la vertical. Nervio central de 10
        de espesor, que sube 20 sobre la placa horizontal y la recorre 50, con su borde
        inclinado a 60° con la horizontal.
      - **Marca 2.** Brida de 15 de espesor, 90 de alto y 60 de ancho, con las esquinas de radio
        10 y cuatro agujeros de 8 a 40 × 70 entre centros. El eje del taladro está a 45 de la
        cara interior de la brida, y las orejas se unen a ella con un acuerdo de radio 5. Taladro
        del eje de 15, con un chaflán de 1 × 45°, hasta 17. Orejas de 11 de espesor, con 42 de
        hueco entre ellas, 64 por fuera, 2 más que la brida a cada lado, y el extremo redondo de
        50. En una oreja, dos agujeros roscados de 4 de diámetro
        exterior, a 20 entre centros y 7,5 por debajo del eje del taladro, con 5 de rosca y 7 de
        taladro.

      Y de las diapositivas de acabados superficiales (pág. 9): una superficie libre, que no toca
      ninguna otra pieza, Ra = 12,5; de apoyo, en contacto con otra pieza pero sin movimiento
      entre las dos, Ra = 3,2; funcional, en contacto y con movimiento relativo, Ra = 0,8. Ra va
      en micras. Qué es Ra, cómo se dibuja el símbolo, dónde se pone y cómo se elige están en
      [Acabados superficiales](/road-to-ingenieria/expresion-grafica/t12-acabados-y-tolerancias/#acabados-superficiales), en la página de este tema.

      El material no da la clase de ninguna cota. La H7 que usa el paso de la tolerancia es un
      ejemplo nuestro: es el agujero de varios ajustes de la tabla de recomendados del tema
      (pág. 18).
    pide: La acotación de las dos piezas en papel, con una tolerancia dimensional y un acabado superficial; aquí, qué cotas llevan Ø, la diferencia superior de Ø15 H7 y el acabado de la cara de apoyo de la brida.
    pasos:
      - tipo: reconocer
        pregunta: Hay que poner una tolerancia dimensional «con sentido mecánico». ¿En qué cota de estas dos piezas la tiene?
        opciones:
          - texto: En el taladro de 15 de las orejas de la marca 2, donde entra el eje
            correcta: true
            mensaje: |
              Eso es. Ahí encajan dos piezas con la misma cota nominal, el eje en las orejas, y eso
              es un ajuste (Tema 7, pág. 14): cuánto juego o cuánto apriete queda lo decide la
              tolerancia de las dos. Es la cota que pide una clase ISO.
          - texto: En los agujeros de 8 de la brida, por los que pasan los tornillos M6
            mensaje: |
              Un tornillo M6 pasa por un agujero de 8 con holgura de sobra: no hay ajuste que
              proteger. Para esas cotas basta la tolerancia general que da el cajetín, ISO 2768-m.
          - texto: En el radio 10 de las esquinas, que se ve en las dos piezas
            mensaje: |
              Es una superficie libre: no toca ninguna otra pieza, y lo que se desvíe no cambia
              nada del montaje. La tolerancia general del cajetín la cubre.
          - texto: En todas, para que las piezas salgan exactas
            mensaje: |
              El primer criterio de la diapositiva es «Evitar todo exceso de precisión», porque la
              precisión es cara (Tema 7, pág. 17). Lo que no lleva tolerancia propia lleva la
              general del cajetín.

      - tipo: dibujar
        consigna: |
          Copia las dos piezas en un folio, a escala 1:1, y acótalas con las medidas de las notas:
          las cotas que hacen falta para fabricarlas, cada una una sola vez y en la vista donde
          mejor se ve su elemento. Pon además una tolerancia dimensional ISO y un acabado
          superficial donde tengan sentido mecánico. Después repasa la lista: cada punto es una
          línea de la hoja de criterios.
        comprueba:
          - punto: Cada cifra, centrada encima de su línea de cota y legible desde abajo o desde la derecha, en todas o casi todas las cotas.
            porque: |
              Es uno de los mínimos para que te corrijan: «Colocar correctamente el número de cota
              en la mayoría de los casos (80% o más).»
          - punto: Ø delante de los diámetros, como el taladro del eje y los agujeros de 8 y de 10, y R delante de los radios, como las esquinas y el acuerdo.
            porque: |
              Otro mínimo: «Indicar los símbolos de diámetro y radio en la mayoría de los casos
              (80% o más)». Un arco de menos de media vuelta se acota por su radio, y uno de más,
              por su diámetro; y uno de media vuelta justa, como el extremo de las orejas, con R y
              el ancho (diapositivas de acotación, pág. 21).
          - punto: Los dos agujeros roscados, acotados con M4 y no con Ø4, con su longitud de rosca, 5, y, como son ciegos, con la profundidad del taladro, 7.
            porque: |
              Es un mínimo: «Al acotar una rosca, utilizar el símbolo M y no el símbolo de
              diámetro Ø (puede que el valor de cota no sea válido, pero al menos se utiliza el
              símbolo M).» Y la longitud la cobra la hoja aparte: «No acotar la longitud/profundidad
              de la rosca: -0,5 por cada caso.» Un agujero ciego roscado lleva además la
              profundidad del agujero («Tema 6. Uniones», pág. 9): aquí, los 7 del taladro.
          - punto: Todas las cotas en milímetros, también las del detalle B, que llevan la medida real y no la del dibujo a 5:1.
            porque: |
              Un mínimo: «En los planos de despiece acotar en mm, NO utilizar otras unidades.» Y
              las cifras de cota dan el valor real de la dimensión, se dibuje a la escala que se
              dibuje (diapositivas de acotación, pág. 7): acotar el detalle con 20 en vez de 4 es el
              error muy grave «Acotar y/o dibujar sin tener en cuenta la escala.»
          - punto: Ninguna cota sobre una línea discontinua; los agujeros se acotan donde se ven como circunferencias o cortados.
            porque: |
              Es uno de los errores muy graves de la hoja, a −2: «Acotar rayas discontinuas.»
          - punto: Las cotas funcionales, puestas de forma expresa, como el taladro del eje y los 40 × 70 entre centros de los agujeros que atornillan las dos piezas, que tienen que coincidir en una y en otra.
            porque: |
              La hoja lo cobra por cota: «Faltan cotas funcionales: -0,5 por cada una (máximo -1,5
              por pieza).» Y van expresas, sin tener que sumar otras para sacarlas (diapositivas de
              acotación, pág. 7).
          - punto: Nada que falte para fabricar, con cada agujero situado y cada espesor dado.
            porque: |
              También se cobra por cota: «Faltan cotas no funcionales: -0,25 por cada una (máximo
              -1 por pieza).»
          - punto: Una tolerancia ISO donde hay un ajuste, en el taladro del eje, por ejemplo Ø15 H7.
            porque: |
              Es un mínimo: «Colocar correctamente y con sentido mecánico una de las tolerancias
              dimensionales requeridas.» Con sentido mecánico: donde otra pieza encaja con la misma
              cota nominal. En un agujero por el que pasa un tornillo con holgura, no lo tiene.
          - punto: Un acabado en una superficie que trabaja, como la cara de la brida que apoya en la marca 8, con su Ra, y el de las demás caras junto a la marca.
            porque: |
              El último mínimo: «Indicar correctamente y con sentido mecánico alguno de los
              acabados superficiales requeridos.» El general se escribe una vez al lado de la
              marca, y entre paréntesis los particulares, que van también sobre el dibujo
              (diapositivas de acabados, pág. 8). El símbolo, con su figura, está en
              [El símbolo](/road-to-ingenieria/expresion-grafica/t12-acabados-y-tolerancias/#el-símbolo),
              y dónde se pone, en
              [Dónde va en el dibujo](/road-to-ingenieria/expresion-grafica/t12-acabados-y-tolerancias/#dónde-va-en-el-dibujo).

      - tipo: calcular
        titulo: Las cotas que llevan el símbolo de diámetro
        pregunta: |
          Estas son ocho cotas de las dos piezas, con su medida y sin símbolo:

          1. el taladro del eje, 15;
          2. los cuatro agujeros de la brida, 8;
          3. las esquinas de la brida, 10;
          4. los dos agujeros roscados de la oreja, 4;
          5. el acuerdo entre las orejas y la brida, 5;
          6. el espesor de la brida, 15;
          7. los cuatro agujeros de la placa horizontal de la marca 8, 10;
          8. el espesor del nervio de la marca 8, 10.

          ¿Cuáles se escriben con Ø delante?
        respuesta:
          tipo: conjunto
          valor: '1, 2, 7'
          tolerancia: 0.1
          formato: los números de las cotas, separados por comas
        distractores:
          - valor: '1, 2, 4, 7'
            mensaje: |
              La 4 es una rosca, y una rosca se acota con M: M4, no Ø4. Es uno de los mínimos de la
              hoja de criterios: «Al acotar una rosca, utilizar el símbolo M y no el símbolo de
              diámetro Ø (puede que el valor de cota no sea válido, pero al menos se utiliza el
              símbolo M).» Y la hoja avisa: «Si se cumplen estos mínimos, se corregirá el
              ejercicio.»
          - valor: '1, 2, 3, 5, 7'
            mensaje: |
              La 3 y la 5 son radios. Las esquinas de la brida y el acuerdo son arcos de un cuarto
              de vuelta, y un arco de menos de media vuelta se acota por su radio, con R delante:
              R10 y R5 (diapositivas de acotación, pág. 21).
          - valor: '1, 2, 3, 7'
            mensaje: |
              La 3 es un radio: las esquinas de la brida son arcos de un cuarto de vuelta, y un
              arco de menos de media vuelta se acota con R, R10 (diapositivas de acotación,
              pág. 21).
          - valor: '1, 2, 6, 7'
            mensaje: |
              La 6 mide 15, como el taladro, pero es un espesor: la distancia entre las dos caras
              planas de la brida. No lleva símbolo. El Ø dice que lo medido es un cilindro.
          - valor: '2, 7'
            mensaje: |
              Te falta la 1. El taladro del eje es una circunferencia entera en el alzado de la
              marca 2, y se acota Ø15; es además la cota que lleva la tolerancia.
        pista: |
          Ø para una circunferencia entera o un cilindro; R para un arco de menos de media vuelta;
          M para una rosca; y nada para la distancia entre dos caras planas.
        desarrollo: |
          - **Con Ø**: la 1, el taladro del eje, Ø15; la 2, los agujeros de la brida, Ø8; la 7,
            los agujeros de la placa horizontal, Ø10. Las tres son circunferencias enteras en la
            vista donde se acotan.
          - **Con R**: la 3, las esquinas, R10; la 5, el acuerdo, R5.
          - **Con M**: la 4, los roscados, M4.
          - **Sin símbolo**: la 6 y la 8, dos espesores.

          Se escriben con Ø la 1, la 2 y la 7.

      - tipo: calcular
        titulo: La diferencia superior del taladro del eje
        pregunta: |
          Pones en el taladro del eje Ø15 H7, que es el agujero de varios ajustes de la tabla de
          ajustes recomendados del tema (pág. 18). En la Tabla 1 de la UNE-EN ISO 286-1 (pág. 30),
          fila de 10 a 18 mm, IT6 = 11, IT7 = 18 e IT8 = 27 µm. ¿Cuánto vale su diferencia
          superior, $D_s$?
        respuesta:
          tipo: numero
          valor: '18'
          tolerancia: 1
          formato: un número, en µm
        distractores:
          - valor: '11'
            mensaje: |
              Eso es IT6. H7 es calidad 7: en la fila de 10 a 18 mm, IT7 = 18 µm, y como la H
              arranca en la línea cero, la diferencia superior es la zona entera.
          - valor: '27'
            mensaje: |
              Eso es IT8. H7 es calidad 7: en la fila de 10 a 18 mm, IT7 = 18 µm.
          - valor: '-18'
            mensaje: |
              −18 es el borde de abajo de la h7 de un eje, que va de 0 a −18 µm. La H mayúscula
              es el agujero, y arranca en la línea cero hacia arriba: de 0 a +18.
          - valor: '0.018'
            mensaje: |
              Eso son 18 µm escritos en milímetros. Aquí se pide en micras; en la cota sí va en
              milímetros, 15,018.
        pista: |
          La H tiene $D_i = 0$, y la zona mide IT7 en la fila de la cota nominal.
        desarrollo: |
          $$
          D_s = D_i + IT7 = 0 + 18 = 18
          $$

          Son micras: el taladro va de 15,000 a 15,018 mm. En el plano se escribe Ø15 H7, o con las
          dos diferencias junto a la cota, como en la diapositiva de la acotación de tolerancias
          (Tema 7, pág. 9).

      - tipo: reconocer
        pregunta: |
          La cara de la brida de la marca 2 que apoya en la placa vertical de la marca 8, ¿qué
          acabado lleva según la clasificación de las diapositivas de acabados (pág. 9)?
        opciones:
          - texto: Ra = 3,2, porque es una superficie de apoyo, en contacto con otra pieza y sin movimiento entre las dos
            correcta: true
            mensaje: |
              Eso es. Las dos piezas van atornilladas con cuatro M6 × 40: se tocan, pero no se mueven
              una respecto de la otra.
          - texto: Ra = 0,8, porque es una superficie funcional
            mensaje: |
              Funcional es la que está en contacto con otra pieza y además se mueve respecto de
              ella. Estas dos van atornilladas: no hay movimiento relativo.
          - texto: Ra = 12,5, porque es una superficie libre
            mensaje: |
              Libre es la que no toca ninguna otra pieza. Esta apoya en la marca 8 con toda su
              cara.
          - texto: El más fino, y el mismo en todas las caras de la pieza
            mensaje: |
              Mejorar el acabado encarece la pieza (diapositivas de acabados, pág. 2). El fino va
              donde trabaja, y las caras libres se quedan con el general, que se escribe junto a
              la marca (pág. 8).

      - tipo: justificar
        pregunta: Ordena por qué y cómo se pone la tolerancia del taladro del eje. Una pieza es falsa.
        piezas:
          - texto: Una tolerancia ISO tiene sentido mecánico donde dos piezas ajustan con la misma cota nominal (Tema 7, pág. 14).
          - texto: 'En estas dos piezas eso pasa en el taladro de 15 de las orejas, donde entra el eje: por los agujeros de 8 y de 10 pasan tornillos con holgura.'
          - texto: Con H7, IT7 = 18 µm en la fila de 10 a 18 mm, y como la H arranca en la línea cero, Ds = +18 µm.
          - texto: El taladro va de 15,000 a 15,018 mm, y en el plano se escribe Ø15 H7.
          - texto: Para que todo encaje mejor, se pone también H7 en los agujeros de 8 de la brida.
            trampa: true
            mensaje: |
              Por esos agujeros pasan tornillos M6 con holgura de sobra: no hay ajuste que
              proteger. El primer criterio de la diapositiva es «Evitar todo exceso de precisión»
              (Tema 7, pág. 17), y lo que no lleva tolerancia propia lleva la general del cajetín,
              ISO 2768-m.
    resolucion: |
      **No hay solución oficial.** El material trae las dos piezas sin cotas, y ninguna acotación
      es la única buena: lo que se corrige es que cumpla los mínimos y que no le falte nada. Lo
      que sí tiene una sola respuesta está en los pasos.

      **Las cotas y sus símbolos.** Ø para lo que es una circunferencia entera en la vista donde
      se acota: el taladro del eje, Ø15, y los agujeros, 4×Ø8 en la brida y en la placa vertical
      y 4×Ø10 en la placa horizontal. R para los arcos de menos de media vuelta: las esquinas,
      R10, y el acuerdo de las orejas, R5. M para la rosca: M4, con su longitud de 5 y, como el
      agujero es ciego, los 7 de profundidad del taladro. Todo en
      milímetros, también en el detalle B, que lleva las medidas reales aunque esté a 5:1.

      **Lo que no puede faltar.** Las funcionales, expresas: el taladro del eje y la posición de
      los cuatro agujeros que atornillan las dos piezas, 40 × 70 entre centros en las dos. Y lo
      que hace falta para fabricar: los tamaños de cada placa, los espesores, dónde está cada
      agujero y el nervio. Ninguna cota sobre una línea discontinua.

      **La tolerancia.** En el taladro de 15, donde entra el eje: ahí otra pieza ajusta en esta con
      la misma cota nominal, y eso es un ajuste. Con H7, la Tabla 1 da IT7 = 18 µm
      en la fila de 10 a 18 mm, y el taladro va de 15,000 a 15,018 mm. Los agujeros de 8 y de 10,
      por los que pasan tornillos con holgura, se quedan con la tolerancia general del cajetín,
      ISO 2768-m.

      **El acabado.** En una superficie que trabaja. La cara de la brida que apoya en la marca 8
      es de apoyo, Ra = 3,2: se tocan y no se mueven. Las caras libres llevan el general, Ra =
      12,5, escrito junto a la marca.
