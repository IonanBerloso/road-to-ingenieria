              P₂, donde la vertical de P₁ corta la prolongación de T₂O₂.
          - con: marca
            traza: proy_alzado(S)
            rotulo: S₂
            porque: |
              S₂, donde la vertical de S₁ corta la prolongación de N₂O₂, a la altura de P₂.
          - con: escuadra-cartabon
            traza: '[segmento2(figura.punto("M1"), solucion.L_Mp1), segmento2(proy_planta(N), solucion.L_Np1), segmento2(proy_planta(P), solucion.L_Pp1), segmento2(proy_planta(Q), solucion.L_Qp1), segmento2(proy_planta(S), solucion.L_Sp1), segmento2(proy_planta(T), solucion.L_Tp1)]'
            guia: figura.segmento("e1")
            porque: |
              **La otra base.** Cada arista lateral es paralela al eje y mide lo que el eje, de O a O′. Por cada
              vértice de la planta, la paralela a e₁, hacia la izquierda, larga.
          - con: compas
            traza: '[arco(figura.punto("M1"), por: proy_planta(Mp), desde: desplaza(proy_planta(Mp), dx: 1.2, dy: -4.85), hasta: desplaza(proy_planta(Mp), dx: -1.2, dy: 4.85)), arco(proy_planta(N), por: proy_planta(Np), desde: desplaza(proy_planta(Np), dx: 1.2, dy: -4.85), hasta: desplaza(proy_planta(Np), dx: -1.2, dy: 4.85)), arco(proy_planta(P), por: proy_planta(Pp), desde: desplaza(proy_planta(Pp), dx: 1.2, dy: -4.85), hasta: desplaza(proy_planta(Pp), dx: -1.2, dy: 4.85)), arco(proy_planta(Q), por: proy_planta(Qp), desde: desplaza(proy_planta(Qp), dx: 1.2, dy: -4.85), hasta: desplaza(proy_planta(Qp), dx: -1.2, dy: 4.85)), arco(proy_planta(S), por: proy_planta(Sp), desde: desplaza(proy_planta(Sp), dx: 1.2, dy: -4.85), hasta: desplaza(proy_planta(Sp), dx: -1.2, dy: 4.85)), arco(proy_planta(T), por: proy_planta(Tp), desde: desplaza(proy_planta(Tp), dx: 1.2, dy: -4.85), hasta: desplaza(proy_planta(Tp), dx: -1.2, dy: 4.85))]'
            toma: segmento2(proy_planta(O), proy_planta(Op))
            porque: |
              Con el compás, **O₁O′₁**, la longitud del eje: e es horizontal, y la planta la da en verdadera
              magnitud. Desde cada vértice, sobre su paralela, hacia la izquierda.
          - con: marca
            traza: proy_planta(Mp)
            rotulo: M′₁
            porque: |
              M′₁, nombre nuestro, donde el arco corta la paralela a e₁ por M₁.
          - con: marca
            traza: proy_planta(Np)
            rotulo: N′₁
            porque: |
              N′₁, nombre nuestro, donde el arco corta la paralela a e₁ por N₁.
          - con: marca
            traza: proy_planta(Pp)
            rotulo: P′₁
            porque: |
              P′₁, nombre nuestro, donde el arco corta la paralela a e₁ por P₁.
          - con: marca
            traza: proy_planta(Qp)
            rotulo: Q′₁
            porque: |
              Q′₁, nombre nuestro, donde el arco corta la paralela a e₁ por Q₁.
          - con: marca
            traza: proy_planta(Sp)
            rotulo: S′₁
            porque: |
              S′₁, nombre nuestro, donde el arco corta la paralela a e₁ por S₁.
          - con: marca
            traza: proy_planta(Tp)
            rotulo: T′₁
            porque: |
              T′₁, nombre nuestro, donde el arco corta la paralela a e₁ por T₁.
          - con: escuadra-cartabon
            traza: '[segmento2(figura.punto("M2"), solucion.L_hM2), segmento2(proy_alzado(N), solucion.L_hN2i), segmento2(proy_alzado(P), solucion.L_hP2), segmento2(proy_alzado(Q), solucion.L_hQ2)]'
            guia: figura.segmento("e2")
            porque: |
              En el alzado, las aristas laterales son horizontales: por M₂, N₂, P₂ y Q₂, las paralelas a e₂ hacia
              la izquierda. La de N₂ pasa también por T₂, y la de P₂ por S₂: tienen la misma cota.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(Mp), solucion.L_vMp), segmento2(proy_planta(Np), solucion.L_vNp), segmento2(proy_planta(Pp), solucion.L_vPp), segmento2(proy_planta(Qp), solucion.L_vQp), segmento2(proy_planta(Sp), solucion.L_vSp), segmento2(proy_planta(Tp), solucion.L_vTp)]'
            porque: |
              Por cada vértice de la otra base en la planta, la vertical hasta el alzado.
          - con: marca
            traza: proy_alzado(Mp)
            rotulo: M′₂
            porque: |
              M′₂, donde la vertical de M′₁ corta la horizontal de M₂.
          - con: marca
            traza: proy_alzado(Np)
            rotulo: N′₂
            porque: |
              N′₂, donde la vertical de N′₁ corta la horizontal de N₂.
          - con: marca
            traza: proy_alzado(Pp)
            rotulo: P′₂
            porque: |
              P′₂, donde la vertical de P′₁ corta la horizontal de P₂.
          - con: marca
            traza: proy_alzado(Qp)
            rotulo: Q′₂
            porque: |
              Q′₂, donde la vertical de Q′₁ corta la horizontal de Q₂.
          - con: marca
            traza: proy_alzado(Sp)
            rotulo: S′₂
            porque: |
              S′₂, donde la vertical de S′₁ corta la horizontal de S₂.
          - con: marca
            traza: proy_alzado(Tp)
            rotulo: T′₂
            porque: |
              T′₂, donde la vertical de T′₁ corta la horizontal de T₂.
          - con: arista-vista
            traza: '[segmento2(figura.punto("M1"), proy_planta(N)), segmento2(proy_planta(S), proy_planta(T)), segmento2(proy_planta(T), figura.punto("M1")), segmento2(proy_planta(Mp), proy_planta(Np)), segmento2(proy_planta(Np), proy_planta(Pp)), segmento2(proy_planta(Pp), proy_planta(Qp)), segmento2(proy_planta(Qp), proy_planta(Sp)), segmento2(proy_planta(Sp), proy_planta(Tp)), segmento2(proy_planta(Tp), proy_planta(Mp)), segmento2(figura.punto("M1"), proy_planta(Mp)), segmento2(proy_planta(N), proy_planta(Np)), segmento2(proy_planta(S), proy_planta(Sp)), segmento2(proy_planta(T), proy_planta(Tp))]'
            porque: |
              **Lo visto y lo oculto, en la planta.** Desde arriba se ven la base M′N′P′Q′S′T′, que mira hacia
              arriba, y las caras MNN′M′, STT′S′ y TMM′T′: sus aristas, en continua.
          - con: arista-oculta
            traza: '[segmento2(proy_planta(N), proy_planta(P)), segmento2(proy_planta(P), proy_planta(Q)), segmento2(proy_planta(Q), proy_planta(S)), segmento2(proy_planta(P), proy_planta(Pp)), segmento2(proy_planta(Q), proy_planta(Qp))]'
            porque: |
              La base MNPQST mira hacia abajo, y también las caras NPP′N′, PQQ′P′ y QSS′Q′: lo que solo es suyo,
              NP, PQ, QS, PP′ y QQ′, queda tapado, a trazos.
          - con: arista-vista
            traza: '[segmento2(figura.punto("M2"), proy_alzado(N)), segmento2(proy_alzado(N), proy_alzado(P)), segmento2(proy_alzado(P), proy_alzado(Q)), segmento2(proy_alzado(Q), proy_alzado(S)), segmento2(proy_alzado(S), proy_alzado(T)), segmento2(proy_alzado(T), figura.punto("M2")), segmento2(proy_alzado(Mp), proy_alzado(Np)), segmento2(proy_alzado(Np), proy_alzado(Pp)), segmento2(proy_alzado(Pp), proy_alzado(Qp)), segmento2(figura.punto("M2"), proy_alzado(Mp)), segmento2(proy_alzado(N), proy_alzado(Np)), segmento2(proy_alzado(P), proy_alzado(Pp)), segmento2(proy_alzado(Q), proy_alzado(Qp))]'
            porque: |
              **En el alzado** se ven la base MNPQST, que mira hacia delante, y las caras MNN′M′, NPP′N′ y
              PQQ′P′: sus aristas, en continua.
          - con: arista-oculta
            traza: '[segmento2(proy_alzado(Qp), proy_alzado(Sp)), segmento2(proy_alzado(Sp), proy_alzado(Tp)), segmento2(proy_alzado(Tp), proy_alzado(Mp)), segmento2(proy_alzado(S), proy_alzado(P)), segmento2(proy_alzado(T), proy_alzado(N))]'
            porque: |
              La base M′N′P′Q′S′T′ y las caras QSS′Q′, STT′S′ y TMM′T′ miran hacia atrás: Q′S′, S′T′ y T′M′ quedan
              tapadas, a trazos. SS′ y TT′ también, pero en el alzado caen en la misma recta que PP′ y que NN′, que
              se ven: a trazos solo va lo que asoma, de S₂ a P₂ y de T₂ a N₂.
        pista: |
          (1) La paralela a r por M corta e en O. (2) U, donde e₂ prolongada corta r₂; por U₁, la perpendicular
          a r₁ corta e₁ en O′₁. (3) Vista 4: O₄ en la primera línea; M₄ a lo que M₂ está por encima de e₂.
          (4) Vista 5: O₅ y M₅ en la segunda línea; con el radio O₅M₅, desde O₅ y desde M₅, N₅ y T₅. (5) N₄ ≡
          T₄ en el canto; de vuelta, desde Y₁ y a los dos lados, lo que N₅ dista de la segunda línea; las
          alturas, desde e₂, lo que N₄ dista de la primera. (6) P, Q y S, simétricos de T, M y N respecto de O.
          (7) La otra base: paralelas a e₁ con la abertura O₁O′₁, y en el alzado, a la misma altura. (8) En
          el alzado, SS′ y TT′ caen sobre PP′ y NN′, que se ven: a trazos solo de S₂ a P₂ y de T₂ a N₂.
        desarrollo: |
          En verde claro, las dos vistas nuevas y el prisma en las dos vistas, con lo oculto a trazos. La base
          de M es un hexágono regular de 25,10 mm de lado, en un plano a 29,0° del horizontal; las aristas
          laterales son horizontales, de 89,43 mm, y el prisma es oblicuo: el eje forma 21,0° con las bases.

      - tipo: calcular
        titulo: Las aristas laterales
        pregunta: ¿Cuánto mide cada arista lateral del prisma, como MM′?
        respuesta:
          tipo: numero
          valor: '89.43'
          receta: arista_mm
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '86.81'
            receta: en_mm(vm_alzado(M, Mp))
            mensaje: |
              Eso es **M₂M′₂ en el alzado**. La arista es horizontal, pero no frontal: el alzado la acorta. Una
              recta horizontal está en verdadera magnitud en la planta.
          - valor: '32.02'
            receta: en_mm(distancia_a_plano(M, pi))
            mensaje: |
              Esa es la **altura** del prisma, la distancia entre los planos de las dos bases. En un prisma recto
              coincidiría con la arista; en este, oblicuo, la arista es más larga.
          - valor: '25.10'
            receta: en_mm(vm(M, N))
            mensaje: |
              Ese es el **lado de la base**, O₅M₅ en la vista 5. La arista lateral es la que une las dos bases,
              paralela al eje.
        pista: |
          Las aristas laterales son paralelas a e, que es horizontal: mide una en la planta, o mide O₁O′₁.
        desarrollo: |
          Cada arista lateral es paralela al eje y mide lo que él, de O a O′. Es horizontal, y la planta la da
          en verdadera magnitud:

          $$ \overline{MM'} = \overline{O_1O'_1} \approx 89{,}43 \text{ mm} $$

          La línea de referencia de O′, de O′₂ a O′₁, mide 89,01 mm, a 0,4 mm de la arista por casualidad: no
          es ninguna longitud del prisma, solo lo que separan las dos vistas en el papel.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: 'Las bases de un prisma son paralelas: la de M está en el plano paralelo a π por M, y como M es su vértice más alto, la paralela a r por M corta e en su centro O.'
          - texto: 'El centro de la otra base es donde e corta π: la horizontal de π con la cota de e, por U, corta e en O′.'
          - texto: 'Con dos cambios de plano la base de M se ve en verdadera magnitud, un hexágono de radio OM, y sus vértices vuelven a las dos vistas.'
          - texto: 'La otra base es la de M trasladada de O a O′: las aristas laterales son paralelas al eje e iguales a él.'
          - texto: 'O es el pie de la perpendicular desde M a e, porque el radio de la base es perpendicular al eje.'
            trampa: true
            mensaje: |
              Solo en un prisma recto, con las bases perpendiculares al eje. Aquí las bases son paralelas a π,
              que forma 21,0° con e: el pie de esa perpendicular cae 16,2 mm más allá de O.
    resolucion: |
      **Los centros.** Las dos bases son paralelas: la de M está en el plano paralelo a π por M, cuya recta
      de máxima pendiente por M es la paralela a r. M es el vértice más alto de su base, así que esa paralela
      pasa por el centro y corta e en el mismo punto en las dos vistas: O, el centro de la base de M. El de
      la otra base, O′, es donde e corta π: e₂ prolongada corta r₂ en U₂,
      U₁ está en r₁, y la horizontal de π por U, perpendicular a r₁, corta e₁ en O′₁.

      **La base de M.** Con la primera línea nueva paralela a r₁ y O de referencia, M₄ se aparta de la línea
      lo que M₂ está por encima de e₂, y O₄M₄ es el canto del plano. Con la segunda, paralela al canto, O₅ y
      M₅ caen en ella, y la base se ve en verdadera magnitud: un hexágono de radio O₅M₅, 25,10 mm. N₅ y T₅
      salen con el compás, y vuelven: N₄ ≡ T₄ en el canto; N₁ y T₁ a los dos lados de Y₁, lo que N₅ dista de
      la segunda línea; N₂ y T₂, por encima de e₂, lo que N₄ dista de la primera. P, Q y S son los opuestos de
      T, M y N, simétricos respecto de O en las dos vistas.

      **La otra base y lo que se ve.** Cada vértice se traslada de O a O′: en la planta, por la paralela a
      e₁ y con la abertura O₁O′₁, la arista en verdadera magnitud (89,43 mm); en el alzado, a la misma altura.
      En la planta se ocultan NP, PQ, QS, PP′ y QQ′; en el alzado, Q′S′, S′T′, T′M′, SS′ y TT′.

  - id: sd67b-la-seccion-del-prisma-por-el-plano-a-60
    titulo: La sección del prisma por el plano proyectante vertical a 60°, en verdadera magnitud
    fuente: Ejercicio 51 (SD67), apartado b · Colección de ejercicios de Geometría Descriptiva, Sistema Diédrico Directo · Dpto. de Expresión Gráfica y Proyectos de Ingeniería, EIG · UPV/EHU
    nivel: practica
    # Decisión: el apartado b) de la pág. 52 tal cual. Su lámina, sd67b, es
    # nuestra: la de la página con el prisma del apartado a) ya resuelto, que
    # aquí es un dato. De los dos planos proyectantes verticales a 60° por el
    # punto medio del eje se toma el que sube hacia la derecha en el alzado, y
    # las Notas dicen qué saldría con el otro.
    enunciado: |
      b) Determinar la verdadera magnitud de la sección producida por un plano proyectante vertical que pasa por el punto medio del eje del prisma y forma 60º con el plano horizontal.

      **Notas nuestras.** Es el apartado b) del Ejercicio 51, y parte del prisma del apartado a), que la
      lámina trae ya resuelto: el prisma hexagonal regular oblicuo de vértice M, con la base MNPQST, la
      otra base M′N′P′Q′S′T′ en el plano de la recta de máxima pendiente r, y el eje OO′ sobre la
      horizontal e. Un plano proyectante vertical es perpendicular al plano vertical de proyección: el
      alzado lo ve de canto, en una recta, su traza, que forma con la horizontal el ángulo que el plano
      forma con el plano horizontal. Por el punto medio del eje, que llamamos G, pasan **dos** planos así,
      uno con la traza subiendo hacia la derecha y otro hacia la izquierda; el enunciado no dice cuál. Aquí
      tomamos **el que sube hacia la derecha**, como r₂. Con el otro, la sección es otro hexágono, de la
      misma área, 697 mm², pero de otra forma: sus lados miden 12,03, 19,51 y 24,32 mm, en vez de 10,67,
      22,06 y 25,99, y su diagonal mayor, 48,65 mm, en vez de 51,98. Llamamos 1, 2, 3, 4, 5 y 6 a los
      puntos donde el plano corta las aristas laterales MM′, NN′, PP′, QQ′, SS′ y TT′, y W y Z a los dos
      puntos con que se trazan los 60°.
    pide: G, el punto medio del eje; la traza del plano; los seis puntos de la sección en las dos vistas; y la sección en verdadera magnitud, con un cambio de plano, y, como pregunta nuestra, su diagonal mayor.
    receta:
      lamina: sd67b
      escena:
        M: 'punto3(alzado: figura.punto("M2"), planta: figura.punto("M1"))'
        N: 'punto3(alzado: figura.punto("N2"), planta: figura.punto("N1"))'
        P: 'punto3(alzado: figura.punto("P2"), planta: figura.punto("P1"))'
        Q: 'punto3(alzado: figura.punto("Q2"), planta: figura.punto("Q1"))'
        S: 'punto3(alzado: figura.punto("S2"), planta: figura.punto("S1"))'
        T: 'punto3(alzado: figura.punto("T2"), planta: figura.punto("T1"))'
        Mp: 'punto3(alzado: figura.punto("Mp2"), planta: figura.punto("Mp1"))'
        Np: 'punto3(alzado: figura.punto("Np2"), planta: figura.punto("Np1"))'
        Pp: 'punto3(alzado: figura.punto("Pp2"), planta: figura.punto("Pp1"))'
        Qp: 'punto3(alzado: figura.punto("Qp2"), planta: figura.punto("Qp1"))'
        Sp: 'punto3(alzado: figura.punto("Sp2"), planta: figura.punto("Sp1"))'
        Tp: 'punto3(alzado: figura.punto("Tp2"), planta: figura.punto("Tp1"))'
        O: 'punto3(alzado: figura.punto("O2"), planta: figura.punto("O1"))'
        Op: 'punto3(alzado: figura.punto("Op2"), planta: figura.punto("Op1"))'
        Ri: 'punto3(alzado: figura.punto("Ri2"), planta: figura.punto("Ri1"))'
        Rd: 'punto3(alzado: figura.punto("Rd2"), planta: figura.punto("Rd1"))'
        pi: plano_por_lmp(recta3(Ri, Rd))
      solucion:
        # G, el punto medio del eje OO′; el plano de la sección, proyectante
        # vertical por G, con la traza a 60° de la horizontal subiendo hacia la
        # derecha: Z₂ es el vértice del triángulo equilátero G₂W₂Z₂ sobre e₂.
        G: punto_medio(segmento3(O, Op))
        W2: 'desplaza(proy_alzado(G), dx: 60)'
        Z2: 'desplaza(proy_alzado(G), dx: 30, dy: 0 - 30 * raiz(3))'
        Z: 'punto3(alzado: Z2, planta: desplaza(proy_planta(G), dx: 30))'
        Gy: 'punto3(alzado: proy_alzado(G), planta: desplaza(proy_planta(G), dy: 10))'
        sec: plano(G, Z, Gy)
        K1: corte_recta_plano(recta3(M, Mp), sec)
        K2: corte_recta_plano(recta3(N, Np), sec)
        K3: corte_recta_plano(recta3(P, Pp), sec)
        K4: corte_recta_plano(recta3(Q, Qp), sec)
        K5: corte_recta_plano(recta3(S, Sp), sec)
        K6: corte_recta_plano(recta3(T, Tp), sec)
        diag_mm: en_mm(vm(K2, K5))
        # Decisión: la verdadera magnitud, con un cambio de plano horizontal
        # (sale del alzado y lleva alejamientos) con la línea nueva de la
        # lámina, paralela a la traza, y 5 de referencia, el punto de menor
        # alejamiento: todos caen hacia fuera.
        K1_4: 'cambio_plano_horizontal(K1, figura.segmento("nueva"), ref: K5)'
        K2_4: 'cambio_plano_horizontal(K2, figura.segmento("nueva"), ref: K5)'
        K3_4: 'cambio_plano_horizontal(K3, figura.segmento("nueva"), ref: K5)'
        K4_4: 'cambio_plano_horizontal(K4, figura.segmento("nueva"), ref: K5)'
        K5_4: 'cambio_plano_horizontal(K5, figura.segmento("nueva"), ref: K5)'
        K6_4: 'cambio_plano_horizontal(K6, figura.segmento("nueva"), ref: K5)'
        # Lo que se traza en el papel: la mediatriz de O₂O′₂, la horizontal de
        # 5₁ y los pies de las perpendiculares en la línea nueva.
        hm: 'raiz(140 * 140 - vm_alzado(O, G) * vm_alzado(O, G))'
        MedA: 'desplaza(proy_alzado(G), dy: 0 - hm)'
        MedB: 'desplaza(proy_alzado(G), dy: hm)'
        traza: segmento2(proy_alzado(G), Z2)
        hor5: 'perpendicular(por: proy_planta(K5), a: segmento2(proy_planta(K5), proy_alzado(K5)))'
        h1: 'cruce_aparente(hor5, segmento2(proy_alzado(K1), proy_planta(K1)))'
        h2: 'cruce_aparente(hor5, segmento2(proy_alzado(K2), proy_planta(K2)))'
        h3: 'cruce_aparente(hor5, segmento2(proy_alzado(K3), proy_planta(K3)))'
        h4: 'cruce_aparente(hor5, segmento2(proy_alzado(K4), proy_planta(K4)))'
        h6: 'cruce_aparente(hor5, segmento2(proy_alzado(K6), proy_planta(K6)))'
        p1: 'pie_perpendicular(proy_alzado(K1), figura.segmento("nueva"))'
        p2: 'pie_perpendicular(proy_alzado(K2), figura.segmento("nueva"))'
        p3: 'pie_perpendicular(proy_alzado(K3), figura.segmento("nueva"))'
        p4: 'pie_perpendicular(proy_alzado(K4), figura.segmento("nueva"))'
        p5: 'pie_perpendicular(proy_alzado(K5), figura.segmento("nueva"))'
        p6: 'pie_perpendicular(proy_alzado(K6), figura.segmento("nueva"))'
        d1: 'vm_planta(punto3(alzado: proy_planta(K1), planta: proy_planta(K1)), punto3(alzado: h1, planta: h1))'
        d2: 'vm_planta(punto3(alzado: proy_planta(K2), planta: proy_planta(K2)), punto3(alzado: h2, planta: h2))'
        d3: 'vm_planta(punto3(alzado: proy_planta(K3), planta: proy_planta(K3)), punto3(alzado: h3, planta: h3))'
        d4: 'vm_planta(punto3(alzado: proy_planta(K4), planta: proy_planta(K4)), punto3(alzado: h4, planta: h4))'
        d6: 'vm_planta(punto3(alzado: proy_planta(K6), planta: proy_planta(K6)), punto3(alzado: h6, planta: h6))'
        # Los errores. El otro plano a 60°, el que sube hacia la izquierda; el
        # plano a 30° de la horizontal (60° medidos desde la vertical); G en el
        # punto medio del trozo de e₂ que dibuja la hoja; en la verdadera
        # magnitud, la cota en vez del alejamiento, o hacia el lado del alzado.
        Zi: 'punto3(alzado: desplaza(proy_alzado(G), dx: -20, dy: 0 - 20 * raiz(3)), planta: desplaza(proy_planta(G), dx: -20))'
        seci: plano(G, Zi, Gy)
        Z30: 'punto3(alzado: desplaza(proy_alzado(G), dx: 20 * raiz(3), dy: -20), planta: desplaza(proy_planta(G), dx: 20 * raiz(3)))'
        sec30: plano(G, Z30, Gy)
        Ki1: proy_alzado(corte_recta_plano(recta3(M, Mp), seci))
        K30_1: proy_alzado(corte_recta_plano(recta3(M, Mp), sec30))
        Ki2: proy_alzado(corte_recta_plano(recta3(N, Np), seci))
        K30_2: proy_alzado(corte_recta_plano(recta3(N, Np), sec30))
        Ki3: proy_alzado(corte_recta_plano(recta3(P, Pp), seci))
        K30_3: proy_alzado(corte_recta_plano(recta3(P, Pp), sec30))
        Ki4: proy_alzado(corte_recta_plano(recta3(Q, Qp), seci))
        K30_4: proy_alzado(corte_recta_plano(recta3(Q, Qp), sec30))
        G2_e: 'punto_medio(figura.segmento("e2"))'
        K1_cota: 'uno(medir_sobre(segmento2(proy_alzado(K1), p1), desde: p1, distancia: diferencia_de_cotas(K1, K5)), 1)'
        K2_cota: 'uno(medir_sobre(segmento2(proy_alzado(K2), p2), desde: p2, distancia: diferencia_de_cotas(K2, K5)), 1)'
        K6_cota: 'uno(medir_sobre(segmento2(proy_alzado(K6), p6), desde: p6, distancia: diferencia_de_cotas(K6, K5)), 1)'
        K1_dentro: 'uno(medir_sobre(segmento2(proy_alzado(K1), p1), desde: p1, distancia: d1), 2)'
        K2_dentro: 'uno(medir_sobre(segmento2(proy_alzado(K2), p2), desde: p2, distancia: d2), 2)'
        K3_dentro: 'uno(medir_sobre(segmento2(proy_alzado(K3), p3), desde: p3, distancia: d3), 2)'
        K4_dentro: 'uno(medir_sobre(segmento2(proy_alzado(K4), p4), desde: p4, distancia: d4), 2)'
        K6_dentro: 'uno(medir_sobre(segmento2(proy_alzado(K6), p6), desde: p6, distancia: d6), 2)'
        # Los extremos de las rectas largas de la construcción.
        L_ta: 'uno(medir_sobre(traza, desde: Z2, distancia: mm(3)), 1)'
        L_tb: 'uno(medir_sobre(traza, desde: proy_alzado(K4), distancia: mm(4)), 2)'
        L_h5: 'desplaza(proy_planta(K5), dx: 40)'
        L_h5i: 'desplaza(proy_planta(K5), dx: -20)'
        L_v1: 'desplaza(proy_planta(K1), dy: mm(4))'
        L_n1: 'uno(medir_sobre(segmento2(proy_alzado(K1), p1), desde: K1_4, distancia: mm(4)), 1)'
        L_v2: 'desplaza(proy_planta(K2), dy: mm(4))'
        L_n2: 'uno(medir_sobre(segmento2(proy_alzado(K2), p2), desde: K2_4, distancia: mm(4)), 1)'
        L_v3: 'desplaza(proy_planta(K3), dy: mm(4))'
        L_n3: 'uno(medir_sobre(segmento2(proy_alzado(K3), p3), desde: K3_4, distancia: mm(4)), 1)'
        L_v4: 'desplaza(proy_planta(K4), dy: mm(4))'
        L_n4: 'uno(medir_sobre(segmento2(proy_alzado(K4), p4), desde: K4_4, distancia: mm(4)), 1)'
      comprueba:
        - en_plano(Mp, pi)
        - en_plano(Tp, pi)
        - en_plano(K1, sec)
        - en_plano(K4, sec)
    pasos:
      - tipo: reconocer
        pregunta: El plano de la sección es proyectante vertical. ¿Dónde se ve la sección en verdadera magnitud?
        opciones:
          - texto: En el alzado, que ve el plano de canto, y por eso enseña la sección entera, sin acortar ninguna de sus medidas
            mensaje: |
              De canto, el plano se ve como una recta: la sección es en el alzado un segmento, el trozo de la
              traza entre 1₂ y 4₂, que no dice nada de su forma. De canto se ve el plano, no su verdadera
              magnitud.
          - texto: Con un cambio de plano de línea paralela a la traza, que deja el plano paralelo
            correcta: true
            mensaje: |
              Eso es. Con un cambio de plano horizontal y la línea nueva paralela a la traza, el plano de la
              sección es paralelo al plano de proyección nuevo, y la sección sale en verdadera magnitud. Cada
              punto se aparta de la línea lo que su alejamiento supera al de la referencia.
          - texto: En la planta, porque las aristas laterales son horizontales y la planta las enseña en verdadera magnitud
            mensaje: |
              Las aristas laterales sí están en verdadera magnitud en la planta, pero la sección no es
              horizontal: el plano forma 60° con el horizontal, y la planta la acorta a la mitad en esa
              dirección.

      # Decisión: un solo paso construir: G, la traza, los seis puntos en las
      # dos vistas y la verdadera magnitud. La línea nueva y la referencia las
      # fija el intro.
      - tipo: construir
        titulo: La traza, la sección y su verdadera magnitud
        intro: |
          El prisma del apartado a) ya está dibujado, con sus centros O y O′. Primero, G, el punto medio del
          eje: con la mediatriz de O₂O′₂, que corta e₂ en G₂. Después, la traza del plano, a 60° de la
          horizontal y subiendo hacia la derecha, como decimos en las Notas: los 60° salen con el compás, con
          el triángulo equilátero G₂W₂Z₂ sobre e₂. Las aristas laterales son horizontales en el alzado, y la
          traza las corta en los puntos de la sección: 2₂ y 6₂ caen juntos, y 3₂ y 5₂ también, porque N y T, y
          P y S, tienen la misma cota. Bájalos a la planta, cada uno a su arista. Por último, la verdadera
          magnitud, con un cambio de plano horizontal: la línea nueva ya está dibujada, de trazo y punto,
          paralela a la traza, y la referencia es 5, el punto de menor alejamiento, que cae en ella. Marca G₂,
          los cuatro puntos del alzado, los seis de la planta y los seis de la vista 4. Las verticales de los
          puntos cruzan las seis aristas en la planta, y en el alzado hay cruces a 3,5 mm de los puntos: amplía
          con la lupa (×4) para escoger el bueno.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, transportador, borrar]
        tolerancia: 1
        objetivos:
          - nombre: G2
            pide: G, el punto medio del eje, en el alzado
            es: proy_alzado(G)
            bien: |
              G₂ está en e₂, en la mediatriz de O₂O′₂: a medio camino entre los centros de las dos bases.
            diagnosticos:
              - si: cerca_de(solucion.G2_e)
                mensaje: |
                  Ese es el punto medio del trozo de e₂ que dibuja la hoja. El eje del prisma va de O a O′, los
                  centros de las bases: su punto medio está en la mediatriz de O₂O′₂.
                ejemplo: solucion.G2_e
              - si: '!en_recta(figura.segmento("e2"))'
                mensaje: |
                  G está en el eje: G₂ va **en e₂**, donde la corta la mediatriz de O₂O′₂.
                ejemplo: 'desplaza(proy_alzado(G), dy: mm(5))'
              - si: siempre
                mensaje: |
                  Estás en e₂, pero no en el punto medio de O₂O′₂: con el compás, dos arcos iguales desde O₂ y
                  desde O′₂, y la recta que une sus cortes.
          - nombre: c1a
            rotulo: 1₂
            pide: el punto de la sección en MM′, en el alzado
            es: proy_alzado(K1)
            bien: |
              1₂ está donde la traza corta la arista MM′, horizontal en el alzado: el punto más alto de la sección.
            diagnosticos:
              - si: cerca_de(solucion.Ki1)
                mensaje: |
                  Ese punto es de la traza que **sube hacia la izquierda**. Los dos planos valen para el
                  enunciado, pero aquí tomamos el que sube hacia la derecha, como r₂ (lo dicen las Notas).
                ejemplo: solucion.Ki1
              - si: cerca_de(solucion.K30_1)
                mensaje: |
                  Esa traza forma 30° con la horizontal: los 60° se han medido desde la vertical. El plano forma
                  60° con el plano horizontal, y su traza, 60° con la horizontal del papel.
                ejemplo: solucion.K30_1
              - si: '!en_recta(figura.segmento("MMp2"))'
                mensaje: |
                  El punto está en la arista MM′: en el alzado, en su recta horizontal.
                ejemplo: 'uno(medir_sobre(solucion.traza, desde: proy_alzado(K1), distancia: mm(5)), 1)'
              - si: siempre
                mensaje: |
                  Estás en la arista, pero no en la traza: la recta de G₂ por Z₂, prolongada.
          - nombre: c2a
            rotulo: 2₂ ≡ 6₂
            pide: el punto de la sección en NN′ y TT′, en el alzado
            es: proy_alzado(K2)
            bien: |
              2₂ ≡ 6₂ está donde la traza corta la arista NN′ y TT′, horizontal en el alzado: N y T tienen la misma cota, y sus aristas laterales caen en la misma recta del alzado.
            diagnosticos:
              - si: cerca_de(solucion.Ki2)
                mensaje: |
                  Ese punto es de la traza que **sube hacia la izquierda**. Los dos planos valen para el
                  enunciado, pero aquí tomamos el que sube hacia la derecha, como r₂ (lo dicen las Notas).
                ejemplo: solucion.Ki2
              - si: cerca_de(solucion.K30_2)
                mensaje: |
                  Esa traza forma 30° con la horizontal: los 60° se han medido desde la vertical. El plano forma
                  60° con el plano horizontal, y su traza, 60° con la horizontal del papel.
                ejemplo: solucion.K30_2
              - si: '!en_recta(figura.segmento("NNp2"))'
                mensaje: |
                  El punto está en la arista NN′ y TT′: en el alzado, en su recta horizontal.
                ejemplo: 'uno(medir_sobre(solucion.traza, desde: proy_alzado(K2), distancia: mm(5)), 1)'
              - si: siempre
                mensaje: |
                  Estás en la arista, pero no en la traza: la recta de G₂ por Z₂, prolongada.
          - nombre: c3a
            rotulo: 3₂ ≡ 5₂
            pide: el punto de la sección en PP′ y SS′, en el alzado
            es: proy_alzado(K3)
            bien: |
              3₂ ≡ 5₂ está donde la traza corta la arista PP′ y SS′, horizontal en el alzado: P y S tienen la misma cota.
            diagnosticos:
              - si: cerca_de(solucion.Ki3)
                mensaje: |
                  Ese punto es de la traza que **sube hacia la izquierda**. Los dos planos valen para el
                  enunciado, pero aquí tomamos el que sube hacia la derecha, como r₂ (lo dicen las Notas).
                ejemplo: solucion.Ki3
              - si: cerca_de(solucion.K30_3)
                mensaje: |
                  Esa traza forma 30° con la horizontal: los 60° se han medido desde la vertical. El plano forma
                  60° con el plano horizontal, y su traza, 60° con la horizontal del papel.
                ejemplo: solucion.K30_3
              - si: '!en_recta(figura.segmento("PPp2"))'
                mensaje: |
                  El punto está en la arista PP′ y SS′: en el alzado, en su recta horizontal.
                ejemplo: 'uno(medir_sobre(solucion.traza, desde: proy_alzado(K3), distancia: mm(5)), 1)'
              - si: siempre
                mensaje: |
                  Estás en la arista, pero no en la traza: la recta de G₂ por Z₂, prolongada.
          - nombre: c4a
            rotulo: 4₂
            pide: el punto de la sección en QQ′, en el alzado
            es: proy_alzado(K4)
            bien: |
              4₂ está donde la traza corta la arista QQ′, horizontal en el alzado: el punto más bajo de la sección.
            diagnosticos:
              - si: cerca_de(solucion.Ki4)
                mensaje: |
                  Ese punto es de la traza que **sube hacia la izquierda**. Los dos planos valen para el
                  enunciado, pero aquí tomamos el que sube hacia la derecha, como r₂ (lo dicen las Notas).
                ejemplo: solucion.Ki4
              - si: cerca_de(solucion.K30_4)
                mensaje: |
                  Esa traza forma 30° con la horizontal: los 60° se han medido desde la vertical. El plano forma
                  60° con el plano horizontal, y su traza, 60° con la horizontal del papel.
                ejemplo: solucion.K30_4
              - si: '!en_recta(figura.segmento("QQp2"))'
                mensaje: |
                  El punto está en la arista QQ′: en el alzado, en su recta horizontal.
                ejemplo: 'uno(medir_sobre(solucion.traza, desde: proy_alzado(K4), distancia: mm(5)), 1)'
              - si: siempre
                mensaje: |
                  Estás en la arista, pero no en la traza: la recta de G₂ por Z₂, prolongada.
          - nombre: c1p
            rotulo: 1₁
            pide: el punto 1 de la sección, en la arista MM′, en la planta
            es: proy_planta(K1)
            bien: |
              1₁ está en la vertical de 1₂, donde corta M₁M′₁.
            diagnosticos:
              - si: '!en_vertical_de(c1a)'
                mensaje: |
                  1₁ va en la **vertical** del punto del alzado: es el mismo punto visto desde arriba.
                ejemplo: 'uno(medir_sobre(figura.segmento("MMp1"), desde: proy_planta(K1), distancia: mm(5)), 1)'
              - si: '!en_recta(figura.segmento("MMp1"))'
                mensaje: |
                  1 está en la arista MM′: 1₁ va en **M₁M′₁**. La vertical cruza en la planta las seis
                  aristas laterales, y vale la suya.
                ejemplo: 'desplaza(proy_planta(K1), dy: mm(5))'
              - si: siempre
                mensaje: |
                  1₁ está donde la vertical corta M₁M′₁.
          - nombre: c2p
            rotulo: 2₁
            pide: el punto 2 de la sección, en la arista NN′, en la planta
            es: proy_planta(K2)
            bien: |
              2₁ está en la vertical de 2₂ ≡ 6₂, donde corta N₁N′₁.
            diagnosticos:
              - si: cerca_de(proy_planta(K6))
                mensaje: |
                  Ese es 6₁, en la arista TT′. En el alzado 2₂ y 6₂ caen juntos; en la planta,
                  cada uno va en su arista: 2 en N₁N′₁.
                ejemplo: proy_planta(K6)
              - si: '!en_vertical_de(c2a)'
                mensaje: |
                  2₁ va en la **vertical** del punto del alzado: es el mismo punto visto desde arriba.
                ejemplo: 'uno(medir_sobre(figura.segmento("NNp1"), desde: proy_planta(K2), distancia: mm(5)), 1)'
              - si: '!en_recta(figura.segmento("NNp1"))'
                mensaje: |
                  2 está en la arista NN′: 2₁ va en **N₁N′₁**. La vertical cruza en la planta las seis
                  aristas laterales, y vale la suya.
                ejemplo: 'desplaza(proy_planta(K2), dy: mm(5))'
              - si: siempre
                mensaje: |
                  2₁ está donde la vertical corta N₁N′₁.
          - nombre: c3p
            rotulo: 3₁
            pide: el punto 3 de la sección, en la arista PP′, en la planta
            es: proy_planta(K3)
            bien: |
              3₁ está en la vertical de 3₂ ≡ 5₂, donde corta P₁P′₁.
            diagnosticos:
              - si: cerca_de(proy_planta(K5))
                mensaje: |
                  Ese es 5₁, en la arista SS′. En el alzado 3₂ y 5₂ caen juntos; en la planta,
                  cada uno va en su arista: 3 en P₁P′₁.
                ejemplo: proy_planta(K5)
              - si: '!en_vertical_de(c3a)'
                mensaje: |
                  3₁ va en la **vertical** del punto del alzado: es el mismo punto visto desde arriba.
                ejemplo: 'uno(medir_sobre(figura.segmento("PPp1"), desde: proy_planta(K3), distancia: mm(5)), 1)'
              - si: '!en_recta(figura.segmento("PPp1"))'
                mensaje: |
                  3 está en la arista PP′: 3₁ va en **P₁P′₁**. La vertical cruza en la planta las seis
                  aristas laterales, y vale la suya.
                ejemplo: 'desplaza(proy_planta(K3), dy: mm(5))'
              - si: siempre
                mensaje: |
                  3₁ está donde la vertical corta P₁P′₁.
          - nombre: c4p
            rotulo: 4₁
            pide: el punto 4 de la sección, en la arista QQ′, en la planta
            es: proy_planta(K4)
            bien: |
              4₁ está en la vertical de 4₂, donde corta Q₁Q′₁.
            diagnosticos:
              - si: '!en_vertical_de(c4a)'
                mensaje: |
