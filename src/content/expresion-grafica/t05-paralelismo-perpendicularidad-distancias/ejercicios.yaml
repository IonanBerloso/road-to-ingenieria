ejercicios:
  # Decisión: el tema 5 abre con el Ejercicio 38 (SD54) porque es, a 2 de
  # octubre de 2026, el único de los suyos escrito. Los demás de la colección
  # que son de este tema entran cada uno en su sitio del orden de la colección
  # (§04): el 12, el 33 y del 35 al 37, delante de este; del 39 al 42 y el 51,
  # detrás.
  - id: sd15-la-chapa-soldada-en-la-arista-be
    titulo: La chapa de 20 × 30 cm soldada en la arista BE de la campana
    fuente: Ejercicio 12 (SD15) · Colección de ejercicios de Geometría Descriptiva, Sistema Diédrico Directo · Dpto. de Expresión Gráfica y Proyectos de Ingeniería, EIG · UPV/EHU
    nivel: practica
    # Decisión: el texto impreso tal cual, cotejado con la página (pág. 13), con
    # su único apartado, a), en su párrafo. La página trae además una
    # perspectiva de la campana y un dibujo de la chapa acotado: son
    # ilustración, no datos, y la lámina no los dibuja; las Notas nuestras
    # dicen lo que enseñan. G, M, K, L, R, S, U, V, Q, N, T, W, X e Y son
    # nombres nuestros.
    enunciado: |
      Una campana extractora de humos tiene una grieta, tal como la señalada en la perspectiva. Se
      dispone de una chapa rectangular de 20 x 30 cm para soldarla en la zona afectada, de forma que
      la mediana menor de dicha chapa quede alineada y centrada con la arista BE. Se pide:

      a) Representar el conjunto con la chapa soldada. Escala: 1:10.

      **Notas nuestras.** La figura es la campana en el alzado, arriba, y en la planta, debajo: un
      conducto de sección cuadrada, ABCG, y debajo la campana, cuya base es un rectángulo con F, E, D y
      un cuarto vértice debajo de G. G, el vértice de atrás del conducto, en el rincón de las dos
      paredes, no está rotulado. Las caras de delante son ABEF y BCDE, y su arista común es BE; las de
      atrás son verticales, contra las paredes. La perspectiva de la página, que aquí no se dibuja,
      enseña la grieta a media altura de BE y la chapa doblada por BE, con una mitad en cada cara; el
      dibujo acotado de la chapa señala la mediana menor, la de 20 cm. Esa es nuestra lectura: la mediana de 20 cm va sobre
      BE, con su punto medio en el de BE, y la chapa se dobla por ella, con media chapa de 20 × 15 cm
      soldada por fuera en cada cara. Las otras lecturas no dejan soldarla: plana, con la mediana sobre
      BE, solo tocaría la campana en la arista; y entera en una cara, la mitad quedaría en el aire,
      fuera de la campana. A escala 1:10, un milímetro del papel es un centímetro real: la mediana mide
      20 mm en la lámina, y cada media chapa se aparta 15 mm de BE. Llamamos M al punto medio de BE, K y
      L a los extremos de la mediana (K, el del lado de B), R y S a los otros dos vértices de la mitad
      de ABEF y U y V a los de la mitad de BCDE (R y U, los del lado de K).
    pide: Las proyecciones de la chapa doblada por BE —K, L y los vértices R, S, U y V, en la planta y en el alzado—, cada mitad abatida con su cara; y, como pregunta nuestra, la longitud real de BE, en centímetros.
    receta:
      lamina: sd15
      escena:
        A: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("A1"))'
        B: 'punto3(alzado: figura.punto("B2"), planta: figura.punto("B1"))'
        C: 'punto3(alzado: figura.punto("C2"), planta: figura.punto("C1"))'
        D: 'punto3(alzado: figura.punto("D2"), planta: figura.punto("D1"))'
        E: 'punto3(alzado: figura.punto("E2"), planta: figura.punto("E1"))'
        F: 'punto3(alzado: figura.punto("F2"), planta: figura.punto("F1"))'
        cara1: plano(A, B, E)
        cara2: plano(B, C, E)
        BE: recta3(B, E)
        # Las charnelas: las aristas de la base de cada cara, que son
        # horizontales. Orientadas así, la primera rama de cada abatimiento es
        # la de fuera de la campana.
        ch1: recta3(F, E)
        ch2: recta3(E, D)
      solucion:
        # Decisión: la chapa, doblada por BE. La mediana menor, KL, de 20 cm
        # (20 mm en el papel), sobre BE y centrada en M; cada mitad, de 15 cm,
        # perpendicular a BE dentro de su cara, por fuera. F − F′, con F′ el pie
        # de F en BE, es perpendicular a BE y está en la cara ABEF: da la
        # dirección de KR. Lo mismo con D en BCDE. Las cuatro esquinas caen
        # dentro de sus caras (la más justa, V, a 3,35 mm de la arista ED).
        M: punto_medio(segmento3(B, E))
        KL: 'punto_a_distancia(BE, desde: M, distancia: mm(10))'
        K: rama(KL, 2)
        L: rama(KL, 1)
        Fp: pie_perpendicular(F, BE)
        Dp: pie_perpendicular(D, BE)
        RR: 'punto_a_distancia(recta3(K, simetrico(Fp, respecto: punto_medio(segmento3(K, F)))), desde: K, distancia: mm(15))'
        R: rama(RR, 1)
        S: 'simetrico(K, respecto: punto_medio(segmento3(R, L)))'
        UU: 'punto_a_distancia(recta3(K, simetrico(Dp, respecto: punto_medio(segmento3(K, D)))), desde: K, distancia: mm(15))'
        U: rama(UU, 1)
        V: 'simetrico(K, respecto: punto_medio(segmento3(U, L)))'
        # W: donde el lado RS (o UV), paralelo a BE, corta la charnela. Es un
        # punto fijo del abatimiento, y por él pasa R₁S₁, paralela a B₁E₁.
        W_c1: pie_comun(recta3(R, S), ch1)
        W_c2: pie_comun(recta3(U, V), ch2)
        # La cota de B sobre la base, en el alzado: de B₂ a Q₂.
        Q_2: 'cruce_aparente(segmento2(figura.punto("B2"), figura.punto("B1")), figura.segmento("FD2"))'
        cotaB: diferencia_de_cotas(B, E)
        # Decisión: el abatimiento de cada cara sobre el plano horizontal de la
        # base, con su arista de abajo de charnela, como en la hoja de
        # abatimientos: B se abate con su triángulo (la cota sobre la base y lo
        # que B₁ dista de la charnela), y lo demás con el mismo giro. Vale
        # abatir hacia cualquiera de los dos lados: el objetivo B₀ acepta los
        # dos abatidos de B, y los que vienen detrás no dependen del lado. La
        # construcción abate hacia fuera de la campana, donde hay sitio (la
        # primera rama, con las charnelas orientadas de F a E y de E a D).
        perp1: 'perpendicular(por: figura.punto("B1"), a: figura.segmento("FE1"))'
        N_c1: 'pie_perpendicular(figura.punto("B1"), figura.segmento("FE1"))'
        # El triángulo del radio, rectángulo en N: la cota de B llevada desde N
        # sobre la charnela, hacia E (prolongada más allá de E₁), da T; B₁T es
        # el radio, y el compás lo lleva desde N a la perpendicular.
        T_c1: 'uno(medir_sobre(figura.segmento("FE1"), desde: N_c1, distancia: cotaB), 1)'
        Bab1_ambos: abatido(B, ch1, cara1)
        Bab1: 'uno(Bab1_ambos, 1)'
        Mab1: 'abatido_junto(M, ch1, cara1, con: Bab1, de: B)'
        Kab1: 'abatido_junto(K, ch1, cara1, con: Bab1, de: B)'
        Lab1: 'abatido_junto(L, ch1, cara1, con: Bab1, de: B)'
        Rab1: 'abatido_junto(R, ch1, cara1, con: Bab1, de: B)'
        Sab1: 'abatido_junto(S, ch1, cara1, con: Bab1, de: B)'
        perp2: 'perpendicular(por: figura.punto("B1"), a: figura.segmento("ED1"))'
        N_c2: 'pie_perpendicular(figura.punto("B1"), figura.segmento("ED1"))'
        T_c2: 'uno(medir_sobre(figura.segmento("ED1"), desde: N_c2, distancia: cotaB), 2)'
        Bab2_ambos: abatido(B, ch2, cara2)
        Bab2: 'uno(Bab2_ambos, 1)'
        Mab2: 'abatido_junto(M, ch2, cara2, con: Bab2, de: B)'
        Kab2: 'abatido_junto(K, ch2, cara2, con: Bab2, de: B)'
        Lab2: 'abatido_junto(L, ch2, cara2, con: Bab2, de: B)'
        Uab2: 'abatido_junto(U, ch2, cara2, con: Bab2, de: B)'
        Vab2: 'abatido_junto(V, ch2, cara2, con: Bab2, de: B)'
        # La mediatriz de B₀E: dos arcos de 32 mm, una abertura cualquiera
        # mayor que la mitad de BE, desde B₀ y desde E₁; se cortan en X e Y.
        hX: 'raiz(mm(32) * mm(32) - vm(B, E) * vm(B, E) / 4)'
        bis1: 'perpendicular(por: proy_planta(Mab1), a: segmento2(proy_planta(Bab1), figura.punto("E1")))'
        X_c1: 'uno(medir_sobre(bis1, desde: proy_planta(Mab1), distancia: hX), 1)'
        Y_c1: 'uno(medir_sobre(bis1, desde: proy_planta(Mab1), distancia: hX), 2)'
        bis2: 'perpendicular(por: proy_planta(Mab2), a: segmento2(proy_planta(Bab2), figura.punto("E1")))'
        X_c2: 'uno(medir_sobre(bis2, desde: proy_planta(Mab2), distancia: hX), 1)'
        Y_c2: 'uno(medir_sobre(bis2, desde: proy_planta(Mab2), distancia: hX), 2)'
        BE01: segmento2(proy_planta(Bab1), figura.punto("E1"))
        BE02: segmento2(proy_planta(Bab2), figura.punto("E1"))
        pK1: 'perpendicular(por: proy_planta(Kab1), a: BE01)'
        pL1: 'perpendicular(por: proy_planta(Lab1), a: BE01)'
        pK2: 'perpendicular(por: proy_planta(Kab2), a: BE02)'
        pL2: 'perpendicular(por: proy_planta(Lab2), a: BE02)'
        # El desabatimiento: cada punto vuelve por la perpendicular a la
        # charnela; R₁S₁ y U₁V₁, por las paralelas a B₁E₁ por W₁; R₂S₂ y U₂V₂,
        # por las paralelas a B₂E₂ por W₂, que está en la recta de la base.
        dK1: 'perpendicular(por: proy_planta(K), a: figura.segmento("FE1"))'
        dL1: 'perpendicular(por: proy_planta(L), a: figura.segmento("FE1"))'
        dR1: 'perpendicular(por: proy_planta(R), a: figura.segmento("FE1"))'
        dS1: 'perpendicular(por: proy_planta(S), a: figura.segmento("FE1"))'
        dK2: 'perpendicular(por: proy_planta(K), a: figura.segmento("ED1"))'
        dL2: 'perpendicular(por: proy_planta(L), a: figura.segmento("ED1"))'
        dU2: 'perpendicular(por: proy_planta(U), a: figura.segmento("ED1"))'
        dV2: 'perpendicular(por: proy_planta(V), a: figura.segmento("ED1"))'
        parW1: 'perpendicular(por: proy_planta(W_c1), a: perpendicular(por: proy_planta(W_c1), a: figura.segmento("BE1")))'
        parW2: 'perpendicular(por: proy_planta(W_c2), a: perpendicular(por: proy_planta(W_c2), a: figura.segmento("BE1")))'
        parW1a: 'perpendicular(por: proy_alzado(W_c1), a: perpendicular(por: proy_alzado(W_c1), a: figura.segmento("BE2")))'
        parW2a: 'perpendicular(por: proy_alzado(W_c2), a: perpendicular(por: proy_alzado(W_c2), a: figura.segmento("BE2")))'
        lado: en_mm(vm(B, E))
        # Los errores. El radio de B, solo con la cota o solo con lo que dista
        # en la planta (hacia fuera); los 10 mm medidos sobre B₁E₁ en la
        # planta, que acorta; y la media chapa dibujada en la planta tal cual,
        # 15 mm perpendiculares a B₁E₁.
        Bcat1: 'uno(medir_sobre(perp1, desde: N_c1, distancia: cotaB), 1)'
        Bpl1: 'uno(medir_sobre(perp1, desde: N_c1, distancia: vm_planta(B, punto3(alzado: N_c1, planta: N_c1))), 1)'
        Bcat2: 'uno(medir_sobre(perp2, desde: N_c2, distancia: cotaB), 1)'
        Bpl2: 'uno(medir_sobre(perp2, desde: N_c2, distancia: vm_planta(B, punto3(alzado: N_c2, planta: N_c2))), 1)'
        Kpl: 'uno(medir_sobre(figura.segmento("BE1"), desde: proy_planta(M), distancia: mm(10)), 2)'
        Lpl: 'uno(medir_sobre(figura.segmento("BE1"), desde: proy_planta(M), distancia: mm(10)), 1)'
        Rpl: 'uno(medir_sobre(perpendicular(por: proy_planta(K), a: figura.segmento("BE1")), desde: proy_planta(K), distancia: mm(15)), 1)'
        Spl: 'uno(medir_sobre(perpendicular(por: proy_planta(L), a: figura.segmento("BE1")), desde: proy_planta(L), distancia: mm(15)), 1)'
        Upl: 'uno(medir_sobre(perpendicular(por: proy_planta(K), a: figura.segmento("BE1")), desde: proy_planta(K), distancia: mm(15)), 2)'
        Vpl: 'uno(medir_sobre(perpendicular(por: proy_planta(L), a: figura.segmento("BE1")), desde: proy_planta(L), distancia: mm(15)), 2)'
        # Los extremos de las rectas largas de la construcción.
        L_vB: 'desplaza(Q_2, dy: mm(2))'
        L_p1: 'uno(medir_sobre(perp1, desde: proy_planta(Bab1), distancia: mm(2)), 1)'
        L_p2: 'uno(medir_sobre(perp2, desde: proy_planta(Bab2), distancia: mm(2)), 1)'
        L_q1: 'uno(medir_sobre(figura.segmento("FE1"), desde: T_c1, distancia: mm(2)), 1)'
        L_R0: 'uno(medir_sobre(pK1, desde: proy_planta(Rab1), distancia: mm(2)), 2)'
        L_S0: 'uno(medir_sobre(pL1, desde: proy_planta(Sab1), distancia: mm(2)), 2)'
        L_U0: 'uno(medir_sobre(pK2, desde: proy_planta(Uab2), distancia: mm(2)), 1)'
        L_V0: 'uno(medir_sobre(pL2, desde: proy_planta(Vab2), distancia: mm(2)), 1)'
        L_W1: 'uno(medir_sobre(segmento2(proy_planta(Rab1), proy_planta(Sab1)), desde: proy_planta(W_c1), distancia: mm(2)), 1)'
        L_W2: 'uno(medir_sobre(segmento2(proy_planta(Uab2), proy_planta(Vab2)), desde: proy_planta(W_c2), distancia: mm(2)), 1)'
        L_dK1: 'uno(medir_sobre(dK1, desde: proy_planta(K), distancia: mm(2)), 2)'
        L_dL1: 'uno(medir_sobre(dL1, desde: proy_planta(L), distancia: mm(2)), 2)'
        L_dR1: 'uno(medir_sobre(dR1, desde: proy_planta(R), distancia: mm(2)), 2)'
        L_dS1: 'uno(medir_sobre(dS1, desde: proy_planta(S), distancia: mm(2)), 2)'
        L_dK2: 'uno(medir_sobre(dK2, desde: proy_planta(K), distancia: mm(2)), 2)'
        L_dL2: 'uno(medir_sobre(dL2, desde: proy_planta(L), distancia: mm(2)), 2)'
        L_dU2: 'uno(medir_sobre(dU2, desde: proy_planta(U), distancia: mm(2)), 2)'
        L_dV2: 'uno(medir_sobre(dV2, desde: proy_planta(V), distancia: mm(2)), 2)'
        L_pW1: 'uno(medir_sobre(parW1, desde: proy_planta(R), distancia: mm(2)), 1)'
        L_pW2: 'uno(medir_sobre(parW2, desde: proy_planta(U), distancia: mm(2)), 1)'
        L_pW1a: 'uno(medir_sobre(parW1a, desde: proy_alzado(R), distancia: mm(2)), 1)'
        L_pW2a: 'uno(medir_sobre(parW2a, desde: proy_alzado(U), distancia: mm(2)), 1)'
        L_vK: 'desplaza(proy_alzado(K), dy: mm(-2))'
        L_vL: 'desplaza(proy_alzado(L), dy: mm(-2))'
        L_vW1: 'desplaza(proy_alzado(W_c1), dy: mm(-2))'
        L_vW2: 'desplaza(proy_alzado(W_c2), dy: mm(-2))'
        L_vR: 'desplaza(proy_alzado(R), dy: mm(-2))'
        L_vS: 'desplaza(proy_alzado(S), dy: mm(-2))'
        L_vU: 'desplaza(proy_alzado(U), dy: mm(-2))'
        L_vV: 'desplaza(proy_alzado(V), dy: mm(-2))'
      comprueba:
        - en_plano(R, cara1)
        - en_plano(S, cara1)
        - en_plano(U, cara2)
        - en_plano(V, cara2)
        - en_recta(W_c1, ch1)
        - en_recta(W_c2, ch2)
    pasos:
      - tipo: reconocer
        pregunta: 'La mediana menor de la chapa va alineada y centrada con BE. ¿Cómo queda la chapa?'
        opciones:
          - texto: Doblada por BE, con media chapa de 20 × 15 cm soldada en cada cara
            correcta: true
            mensaje: |
              Eso es. La mediana menor, de 20 cm, va sobre BE y con su punto medio en el de BE; los lados de
              30 cm le son perpendiculares y quedan partidos por BE, 15 cm a cada lado. Para que las dos
              mitades se apoyen en la campana, la chapa se dobla por BE, como en la perspectiva.
          - texto: Plana, en la cara ABEF, con la mediana menor sobre BE
            mensaje: |
              Con la mediana sobre BE y la chapa plana en ABEF, la mitad de la chapa quedaría del otro lado
              de BE, en el plano de ABEF prolongado: fuera de la campana, en el aire. La grieta está en la
              arista, y la chapa la tapa doblada, media en cada cara.
          - texto: Doblada por BE, pero con la mediana de 30 cm sobre la arista y media chapa de 30 × 10 cm en cada cara
            mensaje: |
              Esa es la mediana mayor. La menor es la de 20 cm, la que une los puntos medios de los lados de
              30: es la que va sobre BE, y cada mitad mide 20 × 15 cm.

      # Decisión: dos pasos construir, uno por cara: el reproductor arranca
      # cada paso desde la lámina, y cada mitad de la chapa se dibuja con el
      # abatimiento de su cara. K y L, en BE, son objetivos en el primero; en el
      # segundo se vuelven a construir, pero no se corrigen otra vez.
      - tipo: construir
        titulo: La mitad de la chapa en la cara ABEF
        intro: |
          La cara ABEF se abate sobre el plano horizontal de la base, con la charnela FE, que es su
          arista de abajo: E no se mueve, y B se abate con su triángulo, cuyos catetos son lo que B₂ está
          por encima de la base y lo que B₁ dista de F₁E₁. Hacia cualquiera de los dos lados vale, pero
          hacia dentro B₀ cae casi encima de C₁: abate hacia fuera de la campana, donde hay sitio. Con B₀E en verdadera magnitud, su punto medio M₀ sale de la mediatriz, con
          dos arcos iguales desde B₀ y desde E₁ (de 32 mm, por ejemplo). La mediana de la chapa mide 20 mm
          en el papel, a escala 1:10: K₀ y L₀, a 10 mm de M₀. La mitad de la chapa se aparta 15 mm de BE,
          perpendicular a ella, hacia el lado de F: R₀ y S₀. Para desabatir, R₀S₀ se prolonga hasta la
          charnela, en W, que no se mueve; R₁S₁ es la paralela a B₁E₁ por W. Marca B₀, K y L en las dos
          vistas, y R y S en las dos vistas; después, pasa a limpio los tres lados de esta mitad con
          «arista vista». R₁ y S₁ caen a 4 mm, y L₂ a 3 mm, de cruces de la construcción: amplía con la
          lupa (×4) antes de marcarlos.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, visto, oculto, borrar]
        tolerancia: 1
        objetivos:
          - nombre: B0
            pide: B, abatido con la cara ABEF sobre el plano de la base
            es: proy_planta(solucion.Bab1_ambos)
            bien: |
              B₀ está en la perpendicular a F₁E₁ por B₁, a la distancia real de B a la charnela: 53,8 mm, la
              hipotenusa de lo que B₁ dista de F₁E₁ (42,0 mm) y de lo que B está por encima de la base (33,6
              mm). B₀E es la arista BE en verdadera magnitud.
            diagnosticos:
              - si: cerca_de(solucion.Bcat1)
                mensaje: |
                  Vas por la perpendicular a la charnela, pero has llevado solo **lo que B está más alto que
                  la base**: es un cateto. El radio es la hipotenusa de ese cateto y de lo que B₁ dista de
                  F₁E₁ en la planta.
                ejemplo: solucion.Bcat1
              - si: cerca_de(solucion.Bpl1)
                mensaje: |
                  Has llevado al otro lado de la charnela lo que B₁ dista de ella **en la planta**, y la
                  planta acorta: B está además 33,6 mm por encima de la base. Con las dos cosas se forma el
                  triángulo cuya hipotenusa es el radio.
                ejemplo: solucion.Bpl1
              - si: '!en_recta(solucion.perp1)'
                mensaje: |
                  B gira alrededor de la charnela en un plano perpendicular a ella, que es vertical porque la
                  charnela es horizontal: en la planta, B₀ va por la **perpendicular a F₁E₁ que pasa por B₁**.
                ejemplo: 'desplaza(proy_planta(solucion.Bab1), dy: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular a F₁E₁ por B₁, pero no a la distancia buena. El radio es B₁T, la
                  hipotenusa del triángulo con lo que B₁ dista de la charnela y la cota de B sobre la base.
          - nombre: K1
            pide: K, el extremo de la mediana del lado de B, en la planta
            es: proy_planta(K)
            bien: |
              K₁ está en B₁E₁, donde la corta la perpendicular a la charnela que sale de K₀. K₀ está a 10 mm
              de M₀ sobre B₀E, en verdadera magnitud; en la planta, K₁ queda a 8,2 mm del punto medio de B₁E₁,
              porque la planta acorta.
            diagnosticos:
              - si: cerca_de(solucion.Kpl)
                mensaje: |
                  Has medido los 10 mm sobre **B₁E₁, en la planta**. BE no es horizontal, y la planta la
                  acorta: los 10 mm se miden en verdadera magnitud, sobre B₀E, y K₁ se trae de K₀.
                ejemplo: solucion.Kpl
              - si: '!en_recta(figura.segmento("BE1"))'
                mensaje: |
                  K está en la arista BE: K₁ va **en B₁E₁**, donde la corta la perpendicular a la charnela que
                  sale de K₀.
                ejemplo: 'uno(medir_sobre(solucion.dK1, desde: proy_planta(K), distancia: mm(5)), 1)'
              - si: '!en_recta(solucion.dK1)'
                mensaje: |
                  Al desabatir, K vuelve por la **perpendicular a la charnela F₁E₁ que pasa por K₀**, hasta
                  B₁E₁.
                ejemplo: 'uno(medir_sobre(figura.segmento("BE1"), desde: proy_planta(K), distancia: mm(4)), 2)'
              - si: siempre
                mensaje: |
                  K₁ está donde la perpendicular a F₁E₁ que sale de K₀ corta B₁E₁.
          - nombre: L1
            pide: L, el extremo de la mediana del lado de E, en la planta
            es: proy_planta(L)
            bien: |
              L₁ está en B₁E₁, donde la corta la perpendicular a la charnela que sale de L₀. K₁L₁ es la
              mediana de la chapa en la planta: mide 16,5 mm, y no 20, porque la planta acorta.
            diagnosticos:
              - si: cerca_de(solucion.Lpl)
                mensaje: |
                  Has medido los 10 mm sobre **B₁E₁, en la planta**, que acorta. Se miden sobre B₀E, en
                  verdadera magnitud, y L₁ se trae de L₀.
                ejemplo: solucion.Lpl
              - si: '!en_recta(figura.segmento("BE1"))'
                mensaje: |
                  L está en la arista BE: L₁ va **en B₁E₁**.
                ejemplo: 'uno(medir_sobre(solucion.dL1, desde: proy_planta(L), distancia: mm(5)), 1)'
              - si: '!en_recta(solucion.dL1)'
                mensaje: |
                  Al desabatir, L vuelve por la **perpendicular a la charnela que pasa por L₀**, hasta B₁E₁.
                ejemplo: 'uno(medir_sobre(figura.segmento("BE1"), desde: proy_planta(L), distancia: mm(4)), 1)'
              - si: siempre
                mensaje: |
                  L₁ está donde la perpendicular a F₁E₁ que sale de L₀ corta B₁E₁.
          - nombre: R1
            pide: R, el vértice de la chapa en la cara ABEF del lado de K, en la planta
            es: proy_planta(R)
            bien: |
              R₁ está en la paralela a B₁E₁ por W, donde la corta la perpendicular a la charnela que sale de
              R₀. K₁R₁ no se ve perpendicular a B₁E₁: BE no es horizontal.
            diagnosticos:
              - si: cerca_de(solucion.Rpl)
                mensaje: |
                  Has dibujado la media chapa **en la planta, tal cual**: 15 mm perpendiculares a B₁E₁. La
                  planta acorta la cara, y el ángulo recto con BE no se ve recto en ella. La chapa se dibuja en
                  la cara abatida, en verdadera magnitud, y se desabate.
                ejemplo: solucion.Rpl
              - si: '!en_recta(solucion.dR1)'
                mensaje: |
                  R₁ vuelve de R₀ por la **perpendicular a la charnela F₁E₁**.
                ejemplo: 'uno(medir_sobre(solucion.parW1, desde: proy_planta(R), distancia: mm(4)), 1)'
              - si: '!en_recta(solucion.parW1)'
                mensaje: |
                  RS es paralelo a BE, así que R₁S₁ es **paralela a B₁E₁**, y pasa por W, donde R₀S₀ prolongada
                  corta la charnela: W no se mueve al desabatir. R₁ está en esa paralela.
                ejemplo: 'uno(medir_sobre(solucion.dR1, desde: proy_planta(R), distancia: mm(4)), 2)'
              - si: siempre
                mensaje: |
                  R₁ está donde la perpendicular a F₁E₁ que sale de R₀ corta la paralela a B₁E₁ por W.
          - nombre: S1
            pide: S, el vértice de la chapa en la cara ABEF del lado de L, en la planta
            es: proy_planta(S)
            bien: |
              S₁ está en la paralela a B₁E₁ por W, donde la corta la perpendicular a la charnela que sale de
              S₀. K₁R₁S₁L₁ es la mitad de la chapa en la planta.
            diagnosticos:
              - si: cerca_de(solucion.Spl)
                mensaje: |
                  Has dibujado la media chapa **en la planta, tal cual**: 15 mm perpendiculares a B₁E₁. La
                  planta la acorta; se dibuja en la cara abatida y se desabate.
                ejemplo: solucion.Spl
              - si: '!en_recta(solucion.dS1)'
                mensaje: |
                  S₁ vuelve de S₀ por la **perpendicular a la charnela F₁E₁**.
                ejemplo: 'uno(medir_sobre(solucion.parW1, desde: proy_planta(S), distancia: mm(4)), 1)'
              - si: '!en_recta(solucion.parW1)'
                mensaje: |
                  S₁ está en la **paralela a B₁E₁ por W**, como R₁: RS es paralelo a BE.
                ejemplo: 'uno(medir_sobre(solucion.dS1, desde: proy_planta(S), distancia: mm(4)), 2)'
              - si: siempre
                mensaje: |
                  S₁ está donde la perpendicular a F₁E₁ que sale de S₀ corta la paralela a B₁E₁ por W.
          - nombre: K2
            pide: K, en el alzado
            es: proy_alzado(K)
            bien: |
              K₂ está en B₂E₂, en la vertical de K₁.
            diagnosticos:
              - si: '!en_vertical_de(K1)'
                mensaje: |
                  K₂ va en la **vertical de K₁**: es el mismo punto visto de frente.
                ejemplo: 'uno(medir_sobre(figura.segmento("BE2"), desde: proy_alzado(K), distancia: mm(5)), 1)'
              - si: '!en_recta(figura.segmento("BE2"))'
                mensaje: |
                  K está en BE: K₂ va donde la vertical de K₁ corta **B₂E₂**.
                ejemplo: 'desplaza(proy_alzado(K), dy: mm(5))'
              - si: siempre
                mensaje: |
                  K₂ está en B₂E₂, en la vertical de K₁.
          - nombre: L2
            pide: L, en el alzado
            es: proy_alzado(L)
            bien: |
              L₂ está en B₂E₂, en la vertical de L₁.
            diagnosticos:
              - si: '!en_vertical_de(L1)'
                mensaje: |
                  L₂ va en la **vertical de L₁**.
                ejemplo: 'uno(medir_sobre(figura.segmento("BE2"), desde: proy_alzado(L), distancia: mm(5)), 1)'
              - si: '!en_recta(figura.segmento("BE2"))'
                mensaje: |
                  L está en BE: L₂ va donde la vertical de L₁ corta **B₂E₂**.
                ejemplo: 'desplaza(proy_alzado(L), dy: mm(-5))'
              - si: siempre
                mensaje: |
                  L₂ está en B₂E₂, en la vertical de L₁.
          - nombre: R2
            pide: R, en el alzado
            es: proy_alzado(R)
            bien: |
              R₂ está en la vertical de R₁, sobre la paralela a B₂E₂ por W₂, que está en la recta de la base:
              W es de la charnela, y tiene la cota de la base.
            diagnosticos:
              - si: '!en_vertical_de(R1)'
                mensaje: |
                  R₂ va en la **vertical de R₁**.
                ejemplo: 'uno(medir_sobre(solucion.parW1a, desde: proy_alzado(R), distancia: mm(5)), 1)'
              - si: '!en_recta(solucion.parW1a)'
                mensaje: |
                  RS es paralelo a BE: R₂S₂ es la **paralela a B₂E₂ por W₂**, el punto de la recta de la base en
                  la vertical de W. R₂ está donde la corta la vertical de R₁.
                ejemplo: 'desplaza(proy_alzado(R), dy: mm(5))'
              - si: siempre
                mensaje: |
                  R₂ está en la vertical de R₁, sobre la paralela a B₂E₂ por W₂.
          - nombre: S2
            pide: S, en el alzado
            es: proy_alzado(S)
            bien: |
              S₂ está en la vertical de S₁, sobre la paralela a B₂E₂ por W₂. K₂R₂S₂L₂ es la mitad de la
              chapa en el alzado.
            diagnosticos:
              - si: '!en_vertical_de(S1)'
                mensaje: |
                  S₂ va en la **vertical de S₁**.
                ejemplo: 'uno(medir_sobre(solucion.parW1a, desde: proy_alzado(S), distancia: mm(5)), 1)'
              - si: '!en_recta(solucion.parW1a)'
                mensaje: |
                  S₂ está en la **paralela a B₂E₂ por W₂**, como R₂.
                ejemplo: 'desplaza(proy_alzado(S), dy: mm(-5))'
              - si: siempre
                mensaje: |
                  S₂ está en la vertical de S₁, sobre la paralela a B₂E₂ por W₂.
        # Decisión: la chapa va soldada por fuera, y las caras ABEF y BCDE miran
        # hacia arriba y hacia delante: se ve entera en las dos vistas, y el
        # conducto no la tapa (cálculo de líneas ocultas aparte, por rayos). El
        # pliegue KL va sobre BE, que ya está dibujada: no es un tramo.
        tramos:
          - traza: segmento2(proy_planta(R), proy_planta(S))
            tipo: visto
            porque: 'La cara ABEF mira hacia arriba y la chapa está soldada por fuera: desde arriba nada tapa R₁S₁, y el conducto queda lejos, sobre ABCG.'
          - traza: segmento2(proy_planta(K), proy_planta(R))
            tipo: visto
            porque: 'K₁R₁ es lado de la chapa, que está por fuera de la cara ABEF, mirando hacia arriba: nada la tapa.'
          - traza: segmento2(proy_planta(L), proy_planta(S))
            tipo: visto
            porque: 'L₁S₁ es lado de la chapa, por fuera de la cara ABEF: desde arriba nada lo tapa.'
          - traza: segmento2(proy_alzado(R), proy_alzado(S))
            tipo: visto
            porque: 'La cara ABEF mira también hacia delante, y la chapa le queda delante: en el alzado nada tapa R₂S₂.'
          - traza: segmento2(proy_alzado(K), proy_alzado(R))
            tipo: visto
            porque: 'K₂R₂ es lado de la chapa, delante de la cara ABEF: nada lo tapa en el alzado.'
          - traza: segmento2(proy_alzado(L), proy_alzado(S))
            tipo: visto
            porque: 'L₂S₂ es lado de la chapa, delante de la cara ABEF: nada lo tapa en el alzado.'
        construccion:
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("B2"), solucion.L_vB)
            porque: |
              **El radio de B.** La charnela, FE, está en la base, y B se abate a la distancia real que lo
              separa de ella. Uno de sus catetos es lo que B está más alto que la base: por B₂, la vertical
              hasta pasar la recta de la base.
          - con: marca
            traza: solucion.Q_2
            rotulo: Q₂
            porque: |
              Q₂, nombre nuestro, donde la vertical de B₂ corta la recta de la base: B₂Q₂, 33,6 mm, es lo que B
              está por encima de la charnela.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("B1"), solucion.L_p1)
            guia: figura.segmento("FE1")
            porque: |
              Por B₁, la **perpendicular a la charnela** F₁E₁, larga, hasta muy fuera de la campana: al
              abatirse, B gira en un plano vertical perpendicular a la charnela, y en la planta se mueve por
              esta recta.
          - con: marca
            traza: solucion.N_c1
            rotulo: N
            porque: |
              N, nombre nuestro, donde la perpendicular corta F₁E₁: el pie de B en la charnela.
          - con: regla
            traza: segmento2(figura.punto("E1"), solucion.L_q1)
            porque: |
              F₁E₁, la charnela, prolongada con la regla más allá de E₁: el triángulo del radio se hace sobre
              ella, rectángulo en N.
          - con: compas
            traza: 'arco(solucion.N_c1, por: solucion.T_c1, desde: uno(medir_sobre(perpendicular(por: solucion.T_c1, a: figura.segmento("FE1")), desde: solucion.T_c1, distancia: mm(2)), 1), hasta: uno(medir_sobre(perpendicular(por: solucion.T_c1, a: figura.segmento("FE1")), desde: solucion.T_c1, distancia: mm(2)), 2))'
            toma: segmento2(figura.punto("B2"), solucion.Q_2)
            porque: |
              Con el compás, B₂Q₂, la cota de B, y centro en N: el arco corta la charnela prolongada, más allá
              de E₁.
          - con: marca
            traza: solucion.T_c1
            rotulo: T
            porque: |
              T, nombre nuestro, donde el arco corta la charnela prolongada: NT es la cota de B, y NB₁ lo que
              B₁ dista de la charnela, en ángulo recto.
          - con: regla
            traza: segmento2(figura.punto("B1"), solucion.T_c1)
            porque: |
              B₁T, la hipotenusa: la **distancia real de B a la charnela**, 53,8 mm, el radio con que B se
              abate.
          - con: compas
            traza: 'arco(solucion.N_c1, por: proy_planta(solucion.Bab1), desde: uno(medir_sobre(perpendicular(por: proy_planta(solucion.Bab1), a: solucion.perp1), desde: proy_planta(solucion.Bab1), distancia: mm(2)), 1), hasta: uno(medir_sobre(perpendicular(por: proy_planta(solucion.Bab1), a: solucion.perp1), desde: proy_planta(solucion.Bab1), distancia: mm(2)), 2))'
            toma: segmento2(figura.punto("B1"), solucion.T_c1)
            porque: |
              Con el compás, B₁T, y centro en N: el arco corta la perpendicular por fuera de la campana. B cae
              al plano de la base girando alrededor de la charnela.
          - con: marca
            traza: proy_planta(solucion.Bab1)
            rotulo: B₀
            porque: |
              B₀, donde el arco corta la perpendicular a F₁E₁ por B₁, por fuera: B abatido.
          - con: regla
            traza: solucion.BE01
            porque: |
              B₀E, la arista BE abatida, en **verdadera magnitud**: E está en la charnela y no se mueve.
          - con: compas
            traza: '[arco(proy_planta(solucion.Bab1), por: solucion.X_c1, desde: desplaza(solucion.X_c1, dx: mm(-3)), hasta: desplaza(solucion.X_c1, dx: mm(3))), arco(proy_planta(solucion.Bab1), por: solucion.Y_c1, desde: desplaza(solucion.Y_c1, dx: mm(-3)), hasta: desplaza(solucion.Y_c1, dx: mm(3))), arco(figura.punto("E1"), por: solucion.X_c1, desde: desplaza(solucion.X_c1, dx: mm(-3)), hasta: desplaza(solucion.X_c1, dx: mm(3))), arco(figura.punto("E1"), por: solucion.Y_c1, desde: desplaza(solucion.Y_c1, dx: mm(-3)), hasta: desplaza(solucion.Y_c1, dx: mm(3)))]'
            porque: |
              **El punto medio, por la mediatriz.** Con una abertura cualquiera mayor que la mitad de B₀E,
              32 mm por ejemplo, dos arcos desde B₀ y dos desde E, por encima y por debajo de B₀E.
          - con: marca
            traza: solucion.X_c1
            rotulo: X
            porque: |
              X, nombre nuestro, donde se cortan los arcos de debajo de B₀E.
          - con: marca
            traza: solucion.Y_c1
            rotulo: Y
            porque: |
              Y, nombre nuestro, donde se cortan los arcos de encima de B₀E.
          - con: regla
            traza: segmento2(solucion.X_c1, solucion.Y_c1)
            porque: |
              XY, la mediatriz de B₀E: corta B₀E en su punto medio.
          - con: marca
            traza: proy_planta(solucion.Mab1)
            rotulo: M₀
            porque: |
              M₀, donde la mediatriz XY corta B₀E: el punto medio de BE, abatido. La grieta, y el centro de la
              chapa, están aquí.
          - con: compas
            traza: '[arco(proy_planta(solucion.Mab1), por: proy_planta(solucion.Kab1), desde: desplaza(proy_planta(solucion.Kab1), dy: mm(-2)), hasta: desplaza(proy_planta(solucion.Kab1), dy: mm(2))), arco(proy_planta(solucion.Mab1), por: proy_planta(solucion.Lab1), desde: desplaza(proy_planta(solucion.Lab1), dy: mm(-2)), hasta: desplaza(proy_planta(solucion.Lab1), dy: mm(2)))]'
            porque: |
              Con el compás abierto 10 mm, la mitad de la mediana de 20 cm a escala 1:10, y centro en M₀: los
              arcos cortan B₀E a los dos lados de M₀.
          - con: marca
            traza: proy_planta(solucion.Kab1)
            rotulo: K₀
            porque: |
              K₀, donde el arco corta B₀E del lado de B₀: un extremo de la mediana, abatido.
          - con: marca
            traza: proy_planta(solucion.Lab1)
            rotulo: L₀
            porque: |
              L₀, donde el arco corta B₀E del lado de E: el otro extremo de la mediana.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(solucion.Kab1), solucion.L_R0), segmento2(proy_planta(solucion.Lab1), solucion.L_S0)]'
            guia: solucion.BE01
            porque: |
              Por K₀ y por L₀, las **perpendiculares a B₀E**, hacia el lado de la cara, el de F: los lados de
              30 cm de la chapa son perpendiculares a la mediana, y en el abatimiento el ángulo recto se ve
              recto.
          - con: compas
            traza: '[arco(proy_planta(solucion.Kab1), por: proy_planta(solucion.Rab1), desde: desplaza(proy_planta(solucion.Rab1), dx: mm(-2)), hasta: desplaza(proy_planta(solucion.Rab1), dx: mm(2))), arco(proy_planta(solucion.Lab1), por: proy_planta(solucion.Sab1), desde: desplaza(proy_planta(solucion.Sab1), dx: mm(-2)), hasta: desplaza(proy_planta(solucion.Sab1), dx: mm(2)))]'
            porque: |
              Con el compás abierto 15 mm, media chapa de 30 cm a escala 1:10, y centro en K₀ y en L₀: los
              arcos cortan las perpendiculares.
          - con: marca
            traza: proy_planta(solucion.Rab1)
            rotulo: R₀
            porque: |
              R₀, donde el arco de centro K₀ corta su perpendicular: un vértice de la chapa, abatido.
          - con: marca
            traza: proy_planta(solucion.Sab1)
            rotulo: S₀
            porque: |
              S₀, donde el arco de centro L₀ corta su perpendicular. K₀R₀S₀L₀ es la media chapa en verdadera
              magnitud, 20 × 15 mm.
          - con: regla
            traza: segmento2(proy_planta(solucion.Rab1), solucion.L_W1)
            porque: |
              R₀S₀, prolongada con la regla hasta pasar la charnela F₁E₁.
          - con: marca
            traza: proy_planta(solucion.W_c1)
            rotulo: W
            porque: |
              W, nombre nuestro, donde R₀S₀ prolongada corta la charnela: está en ella, y no se mueve al
              desabatir.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(solucion.Kab1), solucion.L_dK1), segmento2(proy_planta(solucion.Lab1), solucion.L_dL1), segmento2(proy_planta(solucion.Rab1), solucion.L_dR1), segmento2(proy_planta(solucion.Sab1), solucion.L_dS1)]'
            guia: figura.segmento("FE1")
            porque: |
              **El desabatimiento.** Por K₀, L₀, R₀ y S₀, las perpendiculares a la charnela, de vuelta a la
              planta: cada punto vuelve por el camino por el que se abatió. Las de K₀ y L₀, hasta pasar B₁E₁;
              las de R₀ y S₀, más allá, hasta la zona de la cara ABEF.
          - con: marca
            traza: proy_planta(K)
            rotulo: K₁
            porque: |
              K₁, donde la perpendicular que sale de K₀ corta B₁E₁.
          - con: marca
            traza: proy_planta(L)
            rotulo: L₁
            porque: |
              L₁, donde la perpendicular que sale de L₀ corta B₁E₁.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.W_c1), solucion.L_pW1)
            guia: figura.segmento("BE1")
            porque: |
              Por W, la **paralela a B₁E₁**: RS es paralelo a BE, y en la planta también; y pasa por W, que es
              suyo y no se ha movido.
          - con: marca
            traza: proy_planta(R)
            rotulo: R₁
            porque: |
              R₁, donde la paralela a B₁E₁ por W corta la perpendicular que sale de R₀.
          - con: marca
            traza: proy_planta(S)
            rotulo: S₁
            porque: |
              S₁, donde la paralela a B₁E₁ por W corta la perpendicular que sale de S₀.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(K), solucion.L_vK), segmento2(proy_planta(L), solucion.L_vL), segmento2(proy_planta(solucion.W_c1), solucion.L_vW1), segmento2(proy_planta(R), solucion.L_vR), segmento2(proy_planta(S), solucion.L_vS)]'
            porque: |
              **El alzado.** Por K₁, L₁, W, R₁ y S₁, las verticales: las de K₁ y L₁ hasta pasar B₂E₂; la de W
              hasta pasar la recta de la base, porque W está en la charnela; las de R₁ y S₁, hasta la altura de
              B₂E₂.
          - con: marca
            traza: proy_alzado(K)
            rotulo: K₂
            porque: |
              K₂, donde la vertical de K₁ corta B₂E₂.
          - con: marca
            traza: proy_alzado(L)
            rotulo: L₂
            porque: |
              L₂, donde la vertical de L₁ corta B₂E₂.
          - con: marca
            traza: proy_alzado(solucion.W_c1)
            rotulo: W₂
            porque: |
              W₂, donde la vertical de W corta la recta de la base: W tiene la cota de la charnela.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(solucion.W_c1), solucion.L_pW1a)
            guia: figura.segmento("BE2")
            porque: |
              Por W₂, la **paralela a B₂E₂**: R₂S₂ va por ella, porque RS es paralelo a BE.
          - con: marca
            traza: proy_alzado(R)
            rotulo: R₂
            porque: |
              R₂, donde la vertical de R₁ corta la paralela a B₂E₂ por W₂.
          - con: marca
            traza: proy_alzado(S)
            rotulo: S₂
            porque: |
              S₂, donde la vertical de S₁ corta la paralela a B₂E₂ por W₂.
          - con: arista-vista
            traza: '[segmento2(proy_planta(R), proy_planta(S)), segmento2(proy_planta(K), proy_planta(R)), segmento2(proy_planta(L), proy_planta(S)), segmento2(proy_alzado(R), proy_alzado(S)), segmento2(proy_alzado(K), proy_alzado(R)), segmento2(proy_alzado(L), proy_alzado(S))]'
            porque: |
              **La media chapa**, en continua en las dos vistas: está soldada por fuera de la cara ABEF, que
              mira hacia arriba y hacia delante, y nada la tapa. El cuarto lado, KL, es el pliegue, y va sobre
              BE, que ya está dibujada.
        pista: |
          (1) B₂Q₂, la cota de B, llevada sobre la charnela desde N, da T; la hipotenusa B₁T es el radio. (2) Con centro
          en N, B₀ en la perpendicular a F₁E₁ por B₁. (3) La mediatriz de B₀E da M₀; a 10 mm, K₀ y L₀. (4) Las
          perpendiculares a B₀E por K₀ y L₀, 15 mm hacia F: R₀ y S₀. (5) R₀S₀ corta la charnela en W. (6)
          Desabate por las perpendiculares a F₁E₁: K₁ y L₁ en B₁E₁; R₁ y S₁ en la paralela a B₁E₁ por W. (7)
          En el alzado, K₂ y L₂ en B₂E₂, y R₂ y S₂ en la paralela a B₂E₂ por W₂.
        desarrollo: |
          En verde claro, la cara ABEF abatida con la media chapa en verdadera magnitud, K₀R₀S₀L₀, y la
          media chapa en la planta, K₁R₁S₁L₁, y en el alzado, K₂R₂S₂L₂. Las dos proyecciones son
          paralelogramos: RS es paralelo a BE, pero KR no se ve perpendicular a BE en ninguna de las dos.

      - tipo: construir
        titulo: La otra mitad, en la cara BCDE
        intro: |
          Lo mismo con la cara BCDE, abatida sobre el plano de la base con la charnela ED: E no se mueve, y
          B se abate con su triángulo, ahora con lo que B₁ dista de E₁D₁. La mediatriz de B₀E da M₀; K₀ y L₀,
          a 10 mm, son otra vez los extremos de la mediana, y la media chapa se aparta 15 mm de B₀E hacia el
          lado de D: U₀ y V₀. U₀V₀ corta la charnela en W, y U₁V₁ es la paralela a B₁E₁ por W. K₁ y L₁
          vuelven a salir en B₁E₁, en los mismos puntos que con la otra cara. Marca B₀, y U y V en las dos
          vistas; después, pasa a limpio los tres lados de esta mitad con «arista vista». Abate hacia fuera
          de la campana: hacia dentro también valdría, pero cae entre las líneas del conducto. V₁ cae a 2 mm
          de un cruce de la construcción y V₂ a 2,7 mm de la recta de la base: amplía con la lupa (×4) antes
          de marcarlos.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, visto, oculto, borrar]
        tolerancia: 1
        objetivos:
          - nombre: B0
            pide: B, abatido con la cara BCDE sobre el plano de la base
            es: proy_planta(solucion.Bab2_ambos)
            bien: |
              B₀ está en la perpendicular a E₁D₁ por B₁, a 42,0 mm de N: la hipotenusa de lo que B₁ dista de
              E₁D₁ (25,2 mm) y de lo que B está por encima de la base (33,6 mm). B₀E vuelve a ser BE en
              verdadera magnitud.
            diagnosticos:
              - si: cerca_de(solucion.Bcat2)
                mensaje: |
                  Vas por la perpendicular a la charnela, pero has llevado solo **lo que B está más alto que
                  la base**: un cateto. El radio es la hipotenusa de ese cateto y de lo que B₁ dista de E₁D₁.
                ejemplo: solucion.Bcat2
              - si: cerca_de(solucion.Bpl2)
                mensaje: |
                  Has llevado al otro lado lo que B₁ dista de la charnela **en la planta**, y la planta acorta:
                  falta la cota de B sobre la base, 33,6 mm, el otro cateto.
                ejemplo: solucion.Bpl2
              - si: '!en_recta(solucion.perp2)'
                mensaje: |
                  B gira alrededor de la charnela en un plano vertical perpendicular a ella: en la planta, B₀
                  va por la **perpendicular a E₁D₁ que pasa por B₁**.
                ejemplo: 'desplaza(proy_planta(solucion.Bab2), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular a E₁D₁ por B₁, pero no a la distancia buena. El radio es B₁T, la
                  hipotenusa del triángulo con lo que B₁ dista de E₁D₁ y la cota de B sobre la base.
          - nombre: U1
            pide: U, el vértice de la chapa en la cara BCDE del lado de K, en la planta
            es: proy_planta(U)
            bien: |
              U₁ está en la paralela a B₁E₁ por W, donde la corta la perpendicular a la charnela que sale de
              U₀.
            diagnosticos:
              - si: cerca_de(solucion.Upl)
                mensaje: |
                  Has dibujado la media chapa **en la planta, tal cual**: 15 mm perpendiculares a B₁E₁. La
                  planta acorta la cara; la chapa se dibuja en la cara abatida y se desabate.
                ejemplo: solucion.Upl
              - si: '!en_recta(solucion.dU2)'
                mensaje: |
                  U₁ vuelve de U₀ por la **perpendicular a la charnela E₁D₁**.
                ejemplo: 'uno(medir_sobre(solucion.parW2, desde: proy_planta(U), distancia: mm(4)), 1)'
              - si: '!en_recta(solucion.parW2)'
                mensaje: |
                  UV es paralelo a BE: U₁V₁ es la **paralela a B₁E₁ por W**, el punto donde U₀V₀ prolongada
                  corta la charnela.
                ejemplo: 'uno(medir_sobre(solucion.dU2, desde: proy_planta(U), distancia: mm(4)), 2)'
              - si: siempre
                mensaje: |
                  U₁ está donde la perpendicular a E₁D₁ que sale de U₀ corta la paralela a B₁E₁ por W.
          - nombre: V1
            pide: V, el vértice de la chapa en la cara BCDE del lado de L, en la planta
            es: proy_planta(V)
            bien: |
              V₁ está en la paralela a B₁E₁ por W, donde la corta la perpendicular a la charnela que sale de
              V₀. K₁U₁V₁L₁ es esta mitad de la chapa en la planta.
            diagnosticos:
              - si: cerca_de(solucion.Vpl)
                mensaje: |
                  Has dibujado la media chapa **en la planta, tal cual**: la planta la acorta. Se dibuja en la
                  cara abatida y se desabate.
                ejemplo: solucion.Vpl
              - si: '!en_recta(solucion.dV2)'
                mensaje: |
                  V₁ vuelve de V₀ por la **perpendicular a la charnela E₁D₁**.
                ejemplo: 'uno(medir_sobre(solucion.parW2, desde: proy_planta(V), distancia: mm(4)), 1)'
              - si: '!en_recta(solucion.parW2)'
                mensaje: |
                  V₁ está en la **paralela a B₁E₁ por W**, como U₁.
                ejemplo: 'uno(medir_sobre(solucion.dV2, desde: proy_planta(V), distancia: mm(4)), 2)'
              - si: siempre
                mensaje: |
                  V₁ está donde la perpendicular a E₁D₁ que sale de V₀ corta la paralela a B₁E₁ por W.
          - nombre: U2
            pide: U, en el alzado
            es: proy_alzado(U)
            bien: |
              U₂ está en la vertical de U₁, sobre la paralela a B₂E₂ por W₂.
            diagnosticos:
              - si: '!en_vertical_de(U1)'
                mensaje: |
                  U₂ va en la **vertical de U₁**.
                ejemplo: 'uno(medir_sobre(solucion.parW2a, desde: proy_alzado(U), distancia: mm(5)), 1)'
              - si: '!en_recta(solucion.parW2a)'
                mensaje: |
                  UV es paralelo a BE: U₂V₂ es la **paralela a B₂E₂ por W₂**, en la recta de la base.
                ejemplo: 'desplaza(proy_alzado(U), dy: mm(-5))'
              - si: siempre
                mensaje: |
                  U₂ está en la vertical de U₁, sobre la paralela a B₂E₂ por W₂.
          - nombre: V2
            pide: V, en el alzado
            es: proy_alzado(V)
            bien: |
              V₂ está en la vertical de V₁, sobre la paralela a B₂E₂ por W₂, cerca de la recta de la base: V
              es el vértice de la chapa que más baja, a 3,4 mm de la arista ED.
            diagnosticos:
              - si: '!en_vertical_de(V1)'
                mensaje: |
                  V₂ va en la **vertical de V₁**.
                ejemplo: 'uno(medir_sobre(solucion.parW2a, desde: proy_alzado(V), distancia: mm(5)), 1)'
              - si: '!en_recta(solucion.parW2a)'
                mensaje: |
                  V₂ está en la **paralela a B₂E₂ por W₂**, como U₂.
                ejemplo: 'desplaza(proy_alzado(V), dy: mm(-5))'
              - si: siempre
                mensaje: |
                  V₂ está en la vertical de V₁, sobre la paralela a B₂E₂ por W₂.
        tramos:
          - traza: segmento2(proy_planta(U), proy_planta(V))
            tipo: visto
            porque: 'La cara BCDE mira hacia arriba y la chapa está soldada por fuera: desde arriba nada tapa U₁V₁.'
          - traza: segmento2(proy_planta(K), proy_planta(U))
            tipo: visto
            porque: 'K₁U₁ es lado de la chapa, por fuera de la cara BCDE: nada lo tapa desde arriba.'
          - traza: segmento2(proy_planta(L), proy_planta(V))
            tipo: visto
            porque: 'L₁V₁ es lado de la chapa, por fuera de la cara BCDE: nada lo tapa desde arriba.'
          - traza: segmento2(proy_alzado(U), proy_alzado(V))
            tipo: visto
            porque: 'La cara BCDE mira también hacia delante, y la chapa le queda delante: nada tapa U₂V₂.'
          - traza: segmento2(proy_alzado(K), proy_alzado(U))
            tipo: visto
            porque: 'K₂U₂ es lado de la chapa, delante de la cara BCDE: nada lo tapa en el alzado.'
          - traza: segmento2(proy_alzado(L), proy_alzado(V))
            tipo: visto
            porque: 'L₂V₂ es lado de la chapa, delante de la cara BCDE: nada lo tapa en el alzado.'
        construccion:
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("B2"), solucion.L_vB)
            porque: |
              **El radio de B.** La charnela es ahora ED, también en la base. Por B₂, la vertical hasta pasar
              la recta de la base: un cateto es lo que B está más alto que ella.
          - con: marca
            traza: solucion.Q_2
            porque: |
              Q₂, nombre nuestro, donde la vertical de B₂ corta la recta de la base: B₂Q₂, 33,6 mm. Va sin
              rótulo, porque el de V₂, que cae cerca, lo pisaría.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("B1"), solucion.L_p2)
            guia: figura.segmento("ED1")
            porque: |
              Por B₁, la **perpendicular a la charnela** E₁D₁, larga, hasta fuera de la campana, por abajo a
              la derecha.
          - con: marca
            traza: solucion.N_c2
            rotulo: N
            porque: |
              N, nombre nuestro, donde la perpendicular corta E₁D₁: el pie de B en esta charnela.
          - con: compas
            traza: 'arco(solucion.N_c2, por: solucion.T_c2, desde: uno(medir_sobre(perpendicular(por: solucion.T_c2, a: figura.segmento("ED1")), desde: solucion.T_c2, distancia: mm(2)), 1), hasta: uno(medir_sobre(perpendicular(por: solucion.T_c2, a: figura.segmento("ED1")), desde: solucion.T_c2, distancia: mm(2)), 2))'
            toma: segmento2(figura.punto("B2"), solucion.Q_2)
            porque: |
              Con el compás, B₂Q₂, la cota de B, y centro en N: el arco corta la charnela E₁D₁ del lado de
              E₁. El triángulo del radio se hace sobre la charnela, rectángulo en N.
          - con: marca
            traza: solucion.T_c2
            rotulo: T
            porque: |
              T, nombre nuestro, donde el arco corta la charnela: NT es la cota de B, y NB₁ lo que B₁ dista de
              la charnela.
          - con: regla
            traza: segmento2(figura.punto("B1"), solucion.T_c2)
            porque: |
              B₁T, la hipotenusa: la **distancia real de B a la charnela ED**, 42,0 mm.
          - con: compas
            traza: 'arco(solucion.N_c2, por: proy_planta(solucion.Bab2), desde: uno(medir_sobre(perpendicular(por: proy_planta(solucion.Bab2), a: solucion.perp2), desde: proy_planta(solucion.Bab2), distancia: mm(2)), 1), hasta: uno(medir_sobre(perpendicular(por: proy_planta(solucion.Bab2), a: solucion.perp2), desde: proy_planta(solucion.Bab2), distancia: mm(2)), 2))'
            toma: segmento2(figura.punto("B1"), solucion.T_c2)
            porque: |
              Con el compás, B₁T, y centro en N: el arco corta la perpendicular por fuera de la campana.
          - con: marca
            traza: proy_planta(solucion.Bab2)
            rotulo: B₀
            porque: |
              B₀, donde el arco corta la perpendicular a E₁D₁ por B₁, por fuera: B abatido con esta cara.
          - con: regla
            traza: solucion.BE02
            porque: |
              B₀E, la arista BE abatida con la cara BCDE, en **verdadera magnitud**: mide lo mismo que con la
              otra cara.
          - con: compas
            traza: '[arco(proy_planta(solucion.Bab2), por: solucion.X_c2, desde: desplaza(solucion.X_c2, dx: mm(-3)), hasta: desplaza(solucion.X_c2, dx: mm(3))), arco(proy_planta(solucion.Bab2), por: solucion.Y_c2, desde: desplaza(solucion.Y_c2, dx: mm(-3)), hasta: desplaza(solucion.Y_c2, dx: mm(3))), arco(figura.punto("E1"), por: solucion.X_c2, desde: desplaza(solucion.X_c2, dx: mm(-3)), hasta: desplaza(solucion.X_c2, dx: mm(3))), arco(figura.punto("E1"), por: solucion.Y_c2, desde: desplaza(solucion.Y_c2, dx: mm(-3)), hasta: desplaza(solucion.Y_c2, dx: mm(3)))]'
            porque: |
              **El punto medio, por la mediatriz.** Con 32 mm de abertura, dos arcos desde B₀ y dos desde E,
              a los dos lados de B₀E.
          - con: marca
            traza: solucion.X_c2
            rotulo: X
            porque: |
              X, nombre nuestro, donde se cortan los arcos de encima de B₀E.
          - con: marca
            traza: solucion.Y_c2
            rotulo: Y
            porque: |
              Y, nombre nuestro, donde se cortan los arcos de debajo de B₀E.
          - con: regla
            traza: segmento2(solucion.X_c2, solucion.Y_c2)
            porque: |
              XY, la mediatriz de B₀E.
          - con: marca
            traza: proy_planta(solucion.Mab2)
            rotulo: M₀
            porque: |
              M₀, donde la mediatriz corta B₀E: el punto medio de BE, abatido con esta cara.
          - con: compas
            traza: '[arco(proy_planta(solucion.Mab2), por: proy_planta(solucion.Kab2), desde: desplaza(proy_planta(solucion.Kab2), dy: mm(-2)), hasta: desplaza(proy_planta(solucion.Kab2), dy: mm(2))), arco(proy_planta(solucion.Mab2), por: proy_planta(solucion.Lab2), desde: desplaza(proy_planta(solucion.Lab2), dy: mm(-2)), hasta: desplaza(proy_planta(solucion.Lab2), dy: mm(2)))]'
            porque: |
              Con el compás abierto 10 mm y centro en M₀, los arcos que cortan B₀E a los dos lados.
          - con: marca
            traza: proy_planta(solucion.Kab2)
            rotulo: K₀
            porque: |
              K₀, donde el arco corta B₀E del lado de B₀.
          - con: marca
            traza: proy_planta(solucion.Lab2)
            rotulo: L₀
            porque: |
              L₀, donde el arco corta B₀E del lado de E.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(solucion.Kab2), solucion.L_U0), segmento2(proy_planta(solucion.Lab2), solucion.L_V0)]'
            guia: solucion.BE02
            porque: |
              Por K₀ y por L₀, las **perpendiculares a B₀E**, hacia el lado de D, el de la cara.
          - con: compas
            traza: '[arco(proy_planta(solucion.Kab2), por: proy_planta(solucion.Uab2), desde: desplaza(proy_planta(solucion.Uab2), dx: mm(-2)), hasta: desplaza(proy_planta(solucion.Uab2), dx: mm(2))), arco(proy_planta(solucion.Lab2), por: proy_planta(solucion.Vab2), desde: desplaza(proy_planta(solucion.Vab2), dx: mm(-2)), hasta: desplaza(proy_planta(solucion.Vab2), dx: mm(2)))]'
            porque: |
              Con el compás abierto 15 mm y centro en K₀ y en L₀: los arcos cortan las perpendiculares.
          - con: marca
            traza: proy_planta(solucion.Uab2)
            rotulo: U₀
            porque: |
              U₀, donde el arco de centro K₀ corta su perpendicular.
          - con: marca
            traza: proy_planta(solucion.Vab2)
            rotulo: V₀
            porque: |
              V₀, donde el arco de centro L₀ corta su perpendicular. K₀U₀V₀L₀ es la media chapa en verdadera
              magnitud.
          - con: regla
            traza: segmento2(proy_planta(solucion.Uab2), solucion.L_W2)
            porque: |
              U₀V₀, prolongada con la regla hasta pasar la charnela E₁D₁.
          - con: marca
            traza: proy_planta(solucion.W_c2)
            porque: |
              W, nombre nuestro, donde U₀V₀ prolongada corta la charnela: no se mueve al desabatir. Va sin
              rótulo, porque V₁, que cae encima, lo taparía.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(solucion.Kab2), solucion.L_dK2), segmento2(proy_planta(solucion.Lab2), solucion.L_dL2), segmento2(proy_planta(solucion.Uab2), solucion.L_dU2), segmento2(proy_planta(solucion.Vab2), solucion.L_dV2)]'
            guia: figura.segmento("ED1")
            porque: |
              **El desabatimiento.** Por K₀, L₀, U₀ y V₀, las perpendiculares a la charnela, de vuelta a la
              planta: las de K₀ y L₀, hasta pasar B₁E₁; las de U₀ y V₀, hasta la zona de la cara BCDE.
          - con: marca
            traza: proy_planta(K)
            rotulo: K₁
            porque: |
              K₁, donde la perpendicular que sale de K₀ corta B₁E₁: el mismo punto que con la otra cara.
          - con: marca
            traza: proy_planta(L)
            rotulo: L₁
            porque: |
              L₁, donde la perpendicular que sale de L₀ corta B₁E₁.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.W_c2), solucion.L_pW2)
            guia: figura.segmento("BE1")
            porque: |
              Por W, la **paralela a B₁E₁**: UV es paralelo a BE.
          - con: marca
            traza: proy_planta(U)
            rotulo: U₁
            porque: |
              U₁, donde la paralela a B₁E₁ por W corta la perpendicular que sale de U₀.
          - con: marca
            traza: proy_planta(V)
            rotulo: V₁
            porque: |
              V₁, donde la paralela a B₁E₁ por W corta la perpendicular que sale de V₀.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(K), solucion.L_vK), segmento2(proy_planta(L), solucion.L_vL), segmento2(proy_planta(solucion.W_c2), solucion.L_vW2), segmento2(proy_planta(U), solucion.L_vU), segmento2(proy_planta(V), solucion.L_vV)]'
            porque: |
              **El alzado.** Por K₁, L₁, W, U₁ y V₁, las verticales: las de K₁ y L₁ hasta pasar B₂E₂; la de W
              hasta pasar la recta de la base; las de U₁ y V₁, hasta la altura de la chapa.
          - con: marca
            traza: proy_alzado(K)
            rotulo: K₂
            porque: |
              K₂, donde la vertical de K₁ corta B₂E₂.
          - con: marca
            traza: proy_alzado(L)
            rotulo: L₂
            porque: |
              L₂, donde la vertical de L₁ corta B₂E₂.
          - con: marca
            traza: proy_alzado(solucion.W_c2)
            porque: |
              W₂, donde la vertical de W corta la recta de la base. Va sin rótulo, porque V₂ y Q₂, que caen al
              lado, lo taparían.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(solucion.W_c2), solucion.L_pW2a)
            guia: figura.segmento("BE2")
            porque: |
              Por W₂, la **paralela a B₂E₂**: U₂V₂ va por ella.
          - con: marca
            traza: proy_alzado(U)
            rotulo: U₂
            porque: |
              U₂, donde la vertical de U₁ corta la paralela a B₂E₂ por W₂.
          - con: marca
            traza: proy_alzado(V)
            rotulo: V₂
            porque: |
              V₂, donde la vertical de V₁ corta la paralela a B₂E₂ por W₂, junto a la recta de la base.
          - con: arista-vista
            traza: '[segmento2(proy_planta(U), proy_planta(V)), segmento2(proy_planta(K), proy_planta(U)), segmento2(proy_planta(L), proy_planta(V)), segmento2(proy_alzado(U), proy_alzado(V)), segmento2(proy_alzado(K), proy_alzado(U)), segmento2(proy_alzado(L), proy_alzado(V))]'
            porque: |
              **La otra media chapa**, en continua en las dos vistas: está por fuera de la cara BCDE, que mira
              hacia arriba y hacia delante, y nada la tapa. Con la del paso anterior, la chapa entera, doblada
              por BE.
        pista: |
          (1) B₂Q₂, la cota de B, sobre la charnela desde N, da T; B₁T es el radio. (2) B₀, en la perpendicular a
          E₁D₁ por B₁. (3) La mediatriz de B₀E da M₀; a 10 mm, K₀ y L₀. (4) Las perpendiculares a B₀E, 15 mm
          hacia D: U₀ y V₀. (5) U₀V₀ corta la charnela en W. (6) Desabate: U₁ y V₁ en la paralela a B₁E₁ por
          W; U₂ y V₂ en la paralela a B₂E₂ por W₂.
        desarrollo: |
          En verde claro, la cara BCDE abatida con su media chapa, K₀U₀V₀L₀, y esa media chapa en la planta y
          en el alzado. Con la del paso anterior, la chapa doblada por BE: en las dos vistas, dos
          paralelogramos que comparten el lado KL, sobre BE.

      - tipo: calcular
        titulo: La arista BE, de verdad
        pregunta: ¿Cuánto mide de verdad la arista BE de la campana, en centímetros?
        respuesta:
          tipo: numero
          valor: '59.41'
          receta: lado
          tolerancia: 1
          formato: un número, en cm reales
        distractores:
          - valor: '48.98'
            receta: en_mm(vm_planta(B, E))
            mensaje: |
              Es lo que mide **B₁E₁ en la planta**, en mm, que a escala 1:10 son cm reales. Pero BE baja de B a
              E, y la planta la acorta. Su verdadera magnitud es B₀E, en el abatimiento.
          - valor: '41.17'
            receta: en_mm(vm_alzado(B, E))
            mensaje: |
              Es **B₂E₂ en el alzado**, que también acorta: BE se acerca hacia delante mientras baja. La
              verdadera magnitud es B₀E.
          - valor: '5.94'
            receta: en_mm(vm(B, E)) / 10
            mensaje: |
              Eso son los **centímetros del papel**: B₀E mide 59,41 mm en la lámina, 5,94 cm. A escala 1:10,
              cada milímetro del papel son 10 mm de verdad, un centímetro: la arista mide 59,4 cm.
        pista: |
          Mide B₀E con «medir», en cualquiera de los dos abatimientos: es BE en verdadera magnitud, en mm del
          papel. A escala 1:10, un milímetro del papel es un centímetro real.
        desarrollo: |
          B₀E, la arista abatida, está en verdadera magnitud: mide 59,41 mm **en el papel**. A escala 1:10,
          cada milímetro del papel son 10 mm reales, un centímetro, así que la arista mide **59,4 cm reales**.
          Con esta escala los milímetros del papel y los centímetros reales son el mismo número; lo que cambia
          es la unidad. Por otro camino:

          $$ \overline{BE} = \sqrt{\overline{B_1E_1}^{\,2} + \Delta z^{2}} = \sqrt{48{,}98^{2} + 33{,}63^{2}} \approx 59{,}41 \text{ mm del papel} = 59{,}4 \text{ cm} $$

          La chapa, de 20 cm de mediana, cabe: a cada lado le sobran (59,4 − 20) / 2 ≈ 19,7 cm de arista.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: 'La mediana menor, de 20 cm, va sobre BE y centrada en su punto medio: la chapa se dobla por BE, con media chapa de 20 × 15 cm en cada cara.'
          - texto: 'A escala 1:10, la mediana mide 20 mm en el papel, y cada mitad se aparta 15 mm de BE, perpendicular a ella.'
          - texto: 'Cada cara se abate sobre el plano de la base, con su arista de abajo de charnela: B₀E y la media chapa quedan en verdadera magnitud.'
          - texto: 'Al desabatir, K y L caen en B₁E₁, y los otros dos vértices de cada mitad en la paralela a B₁E₁ por W, porque su lado es paralelo a BE.'
          - texto: 'Como la escala ya está aplicada, la media chapa se dibuja en la planta tal cual: 20 × 15 mm, perpendicular a B₁E₁.'
            trampa: true
            mensaje: |
              La escala da las medidas reales, pero la planta acorta las caras, que están inclinadas, y el
              ángulo recto con BE no se ve recto en ella. La chapa se dibuja en verdadera magnitud, en la cara
              abatida, y se desabate.
    resolucion: |
      **Cómo va la chapa.** La mediana menor, la de 20 cm, va sobre BE, con su punto medio en el de BE, y
      la chapa se dobla por ella: media chapa de 20 × 15 cm en cada cara, ABEF y BCDE, soldada por fuera.
      A escala 1:10 son 20 mm de mediana y 15 mm a cada lado. Las cuatro esquinas caen dentro de sus
      caras; la más justa, V, a 3,35 mm de la arista ED.

      **Cada mitad, con su cara abatida.** La cara ABEF se abate sobre el plano de la base con la charnela
      FE: B, con el triángulo de su cota sobre la base, 33,6 mm, y lo que B₁ dista de F₁E₁, 42,0 mm, cae
      en B₀, a 53,8 mm de la charnela. B₀E es BE en verdadera magnitud, 59,41 mm. Su mediatriz da M₀; K₀ y
      L₀ a 10 mm, y R₀ y S₀ a 15 mm, perpendiculares, hacia F. Al desabatir, K₁ y L₁ caen en B₁E₁, y R₁ y
      S₁ en la paralela a B₁E₁ por W, donde R₀S₀ corta la charnela; en el alzado, K₂ y L₂ en B₂E₂, y R₂ y S₂
      en la paralela a B₂E₂ por W₂. La cara BCDE, igual con la charnela ED: B₀ a 42,0 mm de ella, y U y V
      del lado de D.

      **Lo visto.** La chapa está por fuera de dos caras que miran hacia arriba y hacia delante: se ve
      entera en las dos vistas. BE mide 59,4 cm reales.

  - id: sd47-el-tubo-perpendicular-al-fondo-de-la-tolva
    titulo: El tubo perpendicular al fondo de la tolva, de P al suelo
    fuente: Ejercicio 33 (SD47) · Colección de ejercicios de Geometría Descriptiva, Sistema Diédrico Directo · Dpto. de Expresión Gráfica y Proyectos de Ingeniería, EIG · UPV/EHU
    nivel: practica
    # Decisión: el texto impreso tal cual, cotejado con la página (pág. 34).
    # Lo que el enunciado no dice —qué es el suelo, que P está en el fondo,
    # hacia dónde va el tubo, la escala y desde dónde se mira el alzado— va en
    # las Notas nuestras. Los nombres M, N, S y Q son nuestros.
    enunciado: |
      Se representa una tolva. El plano ABCD es el fondo de la misma. Representar un tubo
      perpendicular al fondo que pase por P y que alcance el suelo.

      **Notas nuestras.** La figura es la tolva en el alzado, arriba, y en la planta, debajo: cuatro
      paredes verticales, cortadas arriba por una línea ondulada, y el fondo ABCD, inclinado, que baja
      de AB a DC. Debajo del alzado, una recta horizontal rotulada «zorua», que en euskera es
      «suelo»: el suelo es el plano horizontal que el alzado ve de canto en esa recta, 8,4 mm por
      debajo de D₂C₂. P es un punto del fondo: queda a 0,2 mm de su plano, menos que el grueso de la
      línea. El tubo sale de P hacia abajo, por debajo del
      fondo, porque hacia arriba se mete en la tolva y no llega nunca al suelo. La lámina no da
      escala: se mide en el papel, en milímetros. Llamamos M y N a los extremos de la frontal del
      fondo por P, S al punto donde el tubo llega al suelo y Q al punto del tubo que en el alzado cae
      sobre A₂D₂. El alzado se mira desde delante, desde el lado de la planta que queda abajo en el
      papel, como en todo el curso; la lámina dibuja a trazos la arista vertical de D y en continua
      B₂C₂, como si se mirara desde atrás, y con esa lectura el tubo se vería entero en el alzado.
    pide: S₂ y S₁, donde el tubo perpendicular al fondo por P llega al suelo, con la frontal MN que hace falta para trazarlo, el tubo pasado a limpio con lo visto y lo oculto, y, como pregunta nuestra, su longitud.
    receta:
      lamina: sd47
      escena:
        A: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("A1"))'
        B: 'punto3(alzado: figura.punto("B2"), planta: figura.punto("B1"))'
        C: 'punto3(alzado: figura.punto("C2"), planta: figura.punto("C1"))'
        D: 'punto3(alzado: figura.punto("D2"), planta: figura.punto("D1"))'
        P: 'punto3(alzado: figura.punto("P2"), planta: figura.punto("P1"))'
        fondo: plano(A, B, D)
        # El suelo: el plano horizontal de la recta «zorua» del alzado. Tres
        # puntos suyos, con las x de sus extremos y plantas cualesquiera.
        Za: 'punto3(alzado: figura.punto("Zi"), planta: desplaza(figura.punto("Zi"), dy: 300))'
        Zb: 'punto3(alzado: figura.punto("Zd"), planta: desplaza(figura.punto("Zd"), dy: 300))'
        Zc: 'punto3(alzado: figura.punto("Zi"), planta: desplaza(figura.punto("Zi"), dy: 400))'
        suelo: plano(Za, Zb, Zc)
      solucion:
        # El tubo, la perpendicular al fondo por P, hasta el suelo. P está en el
        # fondo (a 0,20 mm, el grueso de la línea): el pie es P mismo, y cae
        # dentro de ABCD. Hacia arriba la recta entra en la tolva y no llega al
        # suelo; hacia abajo lo corta en S.
        tubo: perpendicular_a_plano(P, fondo)
        S: corte_recta_plano(tubo, suelo)
        H: pie_en_plano(P, fondo)
        # La construcción en el papel. AB es horizontal (A₂B₂ lo es en el
        # papel): A₁B₁ es h₁, y la planta del tubo, t₁, le es perpendicular. La
        # frontal por P: la horizontal del papel por P₁ corta A₁D₁ en M₁ y B₁C₁
        # en N₁, que suben a A₂D₂ y B₂C₂; t₂, perpendicular a M₂N₂ por P₂.
        hor1: 'perpendicular(por: figura.punto("P1"), a: segmento2(figura.punto("P1"), figura.punto("P2")))'
        M_1: 'cruce_aparente(hor1, figura.segmento("DA1"))'
        N_1: 'cruce_aparente(hor1, figura.segmento("BC1"))'
        M_2: 'cruce_aparente(perpendicular(por: M_1, a: hor1), figura.segmento("DA2"))'
        N_2: 'cruce_aparente(perpendicular(por: N_1, a: hor1), figura.segmento("BC2"))'
        f2: segmento2(M_2, N_2)
        t2: 'perpendicular(por: figura.punto("P2"), a: f2)'
        t1: 'perpendicular(por: figura.punto("P1"), a: figura.segmento("AB1"))'
        # Donde cambia la visibilidad en el alzado: el cruce aparente del tubo
        # con A₂D₂.
        Q_2: 'cruce_aparente(segmento2(figura.punto("P2"), proy_alzado(S)), figura.segmento("DA2"))'
        # Los errores. La frontal tomada como la horizontal del alzado por P₂.
        horP2: 'perpendicular(por: figura.punto("P2"), a: segmento2(figura.punto("P1"), figura.punto("P2")))'
        XM: 'cruce_aparente(horP2, figura.segmento("DA2"))'
        XN: 'cruce_aparente(horP2, figura.segmento("BC2"))'
        # El alzado del tubo perpendicular a A₂D₂, o vertical (perpendicular a
        # A₂B₂), hasta el suelo.
        S2_AD: 'cruce_aparente(perpendicular(por: figura.punto("P2"), a: figura.segmento("DA2")), figura.segmento("suelo"))'
        S2_vert: 'cruce_aparente(segmento2(figura.punto("P1"), figura.punto("P2")), figura.segmento("suelo"))'
        # La planta del tubo en la horizontal de P₁ (un tubo frontal), o
        # perpendicular a A₁D₁, cortada con la vertical de S₂.
        vS: 'segmento2(proy_alzado(S), proy_planta(S))'
        S1_front: cruce_aparente(hor1, vS)
        S1_AD: 'cruce_aparente(perpendicular(por: figura.punto("P1"), a: figura.segmento("DA1")), vS)'
        # Las longitudes: la buena y las de sus errores.
        largo: en_mm(vm(P, S))
        # Los extremos de las rectas largas de la construcción.
        L_hi: 'desplaza(M_1, dx: mm(-2))'
        L_hd: 'desplaza(N_1, dx: mm(2))'
        L_vM: 'desplaza(M_2, dy: mm(-2))'
        L_vN: 'desplaza(N_2, dy: mm(-2))'
        L_t2: 'uno(medir_sobre(t2, desde: proy_alzado(S), distancia: mm(2)), 1)'
        L_t1: 'uno(medir_sobre(t1, desde: proy_planta(S), distancia: mm(2)), 2)'
        L_vS: 'desplaza(proy_planta(S), dy: mm(2))'
      comprueba:
        - en_plano(H, fondo)
        - en_recta(S, tubo)
        - en_plano(S, suelo)
    pasos:
      - tipo: reconocer
        pregunta: Las proyecciones del tubo se trazan con la escuadra, perpendiculares a las de dos rectas del fondo. ¿A cuáles?
        opciones:
          - texto: La planta, perpendicular a A₁B₁, porque AB es horizontal; el alzado, a una frontal del fondo que hay que trazar
            correcta: true
            mensaje: |
              Eso es. A₂B₂ es horizontal en el papel: AB es una horizontal del fondo, y la planta del
              tubo es perpendicular a A₁B₁. Ninguna arista del fondo es frontal —ninguna tiene la planta
              horizontal en el papel—, así que la frontal se traza: por P, con la planta horizontal.
          - texto: La planta, perpendicular a A₁D₁, que es la arista que baja; y el alzado, perpendicular a A₂D₂, la misma arista vista de frente
            mensaje: |
              AD baja por el fondo de AB a DC, y en el espacio sí es perpendicular al tubo, como toda
              recta del fondo, pero no es horizontal ni frontal, y el ángulo recto con ella no se ve recto
              en ninguna de las dos vistas. La planta va contra la de una horizontal, A₁B₁; el alzado,
              contra la de una frontal.
          - texto: 'Las dos contra AB, que es horizontal: la planta, perpendicular a A₁B₁, y el alzado, perpendicular a A₂B₂, que sale vertical'
            mensaje: |
              Contra AB solo vale la planta: AB está en verdadera magnitud en la planta, no en el alzado.
              Un alzado vertical sería el de una recta de perfil o vertical, y el tubo no es ninguna de
              las dos. El alzado va perpendicular al de una frontal del fondo.

      # Decisión: un solo paso construir: la frontal, el tubo hasta el suelo y
      # su visibilidad. M₂ y N₂ son objetivos para que la frontal se corrija
      # antes de usarla; el intro la fija por P. El suelo se ve de canto en el
      # alzado, así que S₂ sale directamente, sin intersección auxiliar.
      - tipo: construir
        titulo: El tubo, de P al suelo
        intro: |
          El tubo es la perpendicular al fondo por P. Su planta es perpendicular a la de una horizontal
          del fondo, y AB lo es: A₁B₁. Su alzado es perpendicular al de una frontal, que no está
          dibujada: trázala por P. En la planta, la horizontal del papel por P₁ corta A₁D₁ en M₁ y B₁C₁
          en N₁; súbelos a A₂D₂ y B₂C₂, y M₂N₂ pasará por P₂, porque P está en el fondo. El suelo es el
          plano horizontal de la recta «zorua», que el alzado ve de canto. El tubo va hacia abajo, por
          debajo del fondo, hasta el suelo, en S. Marca M₂, N₂, S₂ y S₁. Después pásalo a limpio con
          «arista vista» y «arista oculta»: en la planta lo tapa el fondo; en el alzado, mirado desde
          delante, el fondo lo tapa hasta que el tubo sale por debajo de A₂D₂, en Q. Los bordes de la
          tolva se dejan como los trae la lámina, mirada desde atrás (lo dicen las Notas). S₂ cae a 5 mm de donde la vertical de M₁ cruza el suelo: amplía con la
          lupa (×4) antes de marcarlo.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, visto, oculto, borrar]
        tolerancia: 1
        objetivos:
          - nombre: M2
            pide: M, el extremo izquierdo de la frontal del fondo por P, en el alzado
            es: solucion.M_2
            bien: |
              M₂ está en A₂D₂, en la vertical de M₁, donde la horizontal del papel por P₁ corta A₁D₁. La
              frontal tiene la planta horizontal: todos sus puntos tienen el alejamiento de P.
            diagnosticos:
              - si: cerca_de(solucion.XM)
                mensaje: |
                  Has llevado la **horizontal por P₂** en el alzado: eso da una horizontal del fondo, no
                  una frontal. Lo horizontal de una frontal es su **planta**: la horizontal del papel por
                  P₁, que corta A₁D₁ en M₁. M₂ está en su vertical.
                ejemplo: solucion.XM
              - si: '!en_vertical_de(solucion.M_1)'
                mensaje: |
                  M₂ va en la **vertical de M₁**, el punto donde la horizontal del papel por P₁ corta A₁D₁.
                ejemplo: 'uno(medir_sobre(figura.segmento("DA2"), desde: solucion.M_2, distancia: mm(5)), 1)'
              - si: '!en_recta(figura.segmento("DA2"))'
                mensaje: |
                  M está en la arista AD: M₂ va donde la vertical de M₁ corta **A₂D₂**.
                ejemplo: 'desplaza(solucion.M_2, dy: mm(5))'
              - si: siempre
                mensaje: |
                  M₂ está en A₂D₂, en la vertical de M₁.
          - nombre: N2
            pide: N, el extremo derecho de la frontal del fondo por P, en el alzado
            es: solucion.N_2
            bien: |
              N₂ está en B₂C₂, en la vertical de N₁. M₂N₂ es f₂, el alzado de la frontal, y pasa por P₂:
              P está en el fondo.
            diagnosticos:
              - si: cerca_de(solucion.XN)
                mensaje: |
                  Ese punto está en B₂C₂ a la altura de P₂: has tomado la **horizontal del alzado** por
                  P₂, que es una horizontal del fondo. La frontal tiene horizontal la planta: N₁ está en
                  la horizontal del papel por P₁, y N₂ en su vertical.
                ejemplo: solucion.XN
              - si: '!en_vertical_de(solucion.N_1)'
                mensaje: |
                  N₂ va en la **vertical de N₁**, el punto donde la horizontal del papel por P₁ corta B₁C₁.
                ejemplo: 'uno(medir_sobre(figura.segmento("BC2"), desde: solucion.N_2, distancia: mm(5)), 1)'
              - si: '!en_recta(figura.segmento("BC2"))'
                mensaje: |
                  N está en la arista BC: N₂ va donde la vertical de N₁ corta **B₂C₂**.
                ejemplo: 'desplaza(solucion.N_2, dy: mm(5))'
              - si: siempre
                mensaje: |
                  N₂ está en B₂C₂, en la vertical de N₁.
          - nombre: S2
            pide: S, donde el tubo llega al suelo, en el alzado
            es: proy_alzado(S)
            bien: |
              S₂ está en la recta del suelo, donde la corta la perpendicular a f₂ por P₂, 11,6 mm a la
              izquierda de la vertical de P: el tubo baja hacia la izquierda y hacia atrás, por debajo del
              fondo.
            diagnosticos:
              - si: cerca_de(solucion.S2_AD)
                mensaje: |
                  Has trazado el alzado del tubo perpendicular a **A₂D₂**. AD baja por el fondo, pero no es
                  frontal, y el ángulo recto con ella no se ve en el alzado. El alzado del tubo va
                  perpendicular a **f₂**, el de la frontal M₂N₂.
                ejemplo: solucion.S2_AD
              - si: cerca_de(solucion.S2_vert)
                mensaje: |
                  Has bajado **en vertical** desde P₂: es el alzado perpendicular a A₂B₂. AB es horizontal,
                  y contra ella va la planta, no el alzado. El alzado va perpendicular a f₂, y baja
                  inclinado hacia la izquierda.
                ejemplo: solucion.S2_vert
              - si: '!en_recta(figura.segmento("suelo"))'
                mensaje: |
                  El tubo tiene que **llegar al suelo**: el suelo es horizontal y el alzado lo ve de canto,
                  en la recta «zorua». S₂ es donde t₂ la corta, ni antes ni después.
                ejemplo: 'uno(medir_sobre(solucion.t2, desde: proy_alzado(S), distancia: mm(6)), 2)'
              - si: '!en_recta(solucion.t2)'
                mensaje: |
                  Estás en el suelo, pero no en el alzado del tubo. t₂ pasa por P₂ y es **perpendicular a
                  f₂**, la recta M₂N₂: con la escuadra apoyada en f₂, la perpendicular por P₂ hasta el
                  suelo.
                ejemplo: 'desplaza(proy_alzado(S), dx: mm(6))'
              - si: siempre
                mensaje: |
                  S₂ está donde la perpendicular a f₂ por P₂ corta la recta del suelo.
          - nombre: S1
            pide: S, donde el tubo llega al suelo, en la planta
            es: proy_planta(S)
            bien: |
              S₁ está en la vertical de S₂, sobre t₁, la perpendicular a A₁B₁ por P₁. Cae dentro de la
              planta del fondo: el tubo entero queda debajo de la tolva.
            diagnosticos:
              - si: cerca_de(solucion.S1_front)
                mensaje: |
                  Has dejado S₁ en la **horizontal de P₁**, como si el tubo fuera frontal. No lo es: su
                  planta es perpendicular a A₁B₁, la de la horizontal AB del fondo, y va hacia arriba a la
                  izquierda.
                ejemplo: solucion.S1_front
              - si: cerca_de(solucion.S1_AD)
                mensaje: |
                  Has trazado la planta del tubo perpendicular a **A₁D₁**. AD no es horizontal, y el
                  ángulo recto con ella no se ve en la planta: la planta va perpendicular a A₁B₁, porque
                  AB es horizontal.
                ejemplo: solucion.S1_AD
              - si: '!en_vertical_de(S2)'
                mensaje: |
                  S₁ va en la **vertical de S₂**: es el mismo punto visto desde arriba.
                ejemplo: 'uno(medir_sobre(solucion.t1, desde: proy_planta(S), distancia: mm(5)), 1)'
              - si: '!en_recta(solucion.t1)'
                mensaje: |
                  Estás en la vertical de S₂, pero no en la planta del tubo. t₁ pasa por P₁ y es
                  **perpendicular a A₁B₁**: donde corta la vertical de S₂ está S₁.
                ejemplo: 'desplaza(proy_planta(S), dy: mm(6))'
              - si: siempre
                mensaje: |
                  S₁ está donde la perpendicular a A₁B₁ por P₁ corta la vertical de S₂.
        # Decisión: el fondo y las paredes son opacos, y el alzado se mira desde
        # delante (+y, el lado de la planta que queda abajo en el papel), como
        # en el resto del sitio, aunque la lámina dibuje la tolva como mirada
        # desde atrás (lo dicen las Notas nuestras). La visibilidad sale de un
        # cálculo de líneas ocultas aparte, por rayos contra el fondo y las
        # cuatro paredes; el cambio, en el cruce aparente con A₂D₂.
        tramos:
          - traza: segmento2(figura.punto("P1"), proy_planta(S))
            tipo: oculto
            porque: 'El tubo va por debajo del fondo, y su planta cae entera dentro de A₁B₁C₁D₁: desde arriba lo tapa el fondo, de P₁ a S₁.'
          - traza: segmento2(figura.punto("P2"), solucion.Q_2)
            tipo: oculto
            porque: 'De P₂ a A₂D₂ el tubo está debajo del fondo y detrás de él: el fondo baja hacia delante, hacia DC, y la pared AD también le queda delante. Lo tapan.'
          - traza: segmento2(solucion.Q_2, proy_alzado(S))
            tipo: visto
            porque: 'Pasada A₂D₂, el tubo sale por debajo de la tolva: entre él y quien mira el alzado ya no hay nada. El suelo queda debajo, de canto.'
        construccion:
          - con: escuadra-cartabon
            traza: '[segmento2(figura.punto("P1"), solucion.L_hi), segmento2(figura.punto("P1"), solucion.L_hd)]'
            guia: figura.segmento("suelo")
            rotulo: f₁
            porque: |
              **La frontal del fondo por P.** Ninguna arista del fondo es frontal, así que se traza una.
              Su planta es horizontal en el papel: por P₁, la paralela a la recta del suelo, larga, hasta
              pasar A₁D₁ y B₁C₁.
          - con: marca
            traza: solucion.M_1
            rotulo: M₁
            porque: |
              M₁, nombre nuestro, donde f₁ corta A₁D₁: el punto de la arista AD con el alejamiento de P.
          - con: marca
            traza: solucion.N_1
            rotulo: N₁
            porque: |
              N₁, nombre nuestro, donde f₁ corta B₁C₁.
          - con: escuadra-cartabon
            traza: '[segmento2(solucion.M_1, solucion.L_vM), segmento2(solucion.N_1, solucion.L_vN)]'
            porque: |
              Por M₁ y por N₁, las verticales hasta el alzado: la de M₁ hasta pasar A₂D₂, y la de N₁
              hasta pasar B₂C₂, porque M está en AD y N en BC.
          - con: marca
            traza: solucion.M_2
            rotulo: M₂
            porque: |
              M₂, donde la vertical de M₁ corta A₂D₂.
          - con: marca
            traza: solucion.N_2
            rotulo: N₂
            porque: |
              N₂, donde la vertical de N₁ corta B₂C₂.
          - con: regla
            traza: solucion.f2
            rotulo: f₂
            porque: |
              f₂, de M₂ a N₂: el alzado de la frontal, que el alzado enseña en verdadera magnitud. Pasa
              por P₂, a 0,2 mm: P está en el fondo.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("P2"), solucion.L_t2)
            guia: solucion.f2
            rotulo: t₂
            porque: |
              **El alzado del tubo.** Por P₂, la perpendicular a f₂, hacia abajo, hasta pasar la recta
              del suelo: el ángulo recto con la frontal se ve recto en el alzado, porque la frontal está
              ahí en verdadera magnitud.
          - con: marca
            traza: proy_alzado(S)
            rotulo: S₂
            porque: |
              S₂, nombre nuestro, donde t₂ corta la recta del suelo: el suelo es horizontal, el alzado lo
              ve de canto, y el tubo llega a él en ese punto.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("P1"), solucion.L_t1)
            guia: figura.segmento("AB1")
            rotulo: t₁
            porque: |
              **La planta del tubo.** Por P₁, la perpendicular a A₁B₁, hacia arriba a la izquierda,
              larga: AB es horizontal, está en verdadera magnitud en la planta, y el ángulo recto con
              ella se ve recto.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(S), solucion.L_vS)
            porque: |
              Por S₂, la vertical hasta la planta, hasta pasar t₁.
          - con: marca
            traza: proy_planta(S)
            rotulo: S₁
            porque: |
              S₁, donde la vertical de S₂ corta t₁: dentro de la planta del fondo.
          - con: arista-oculta
            traza: '[segmento2(figura.punto("P1"), proy_planta(S)), segmento2(figura.punto("P2"), solucion.Q_2)]'
            porque: |
              **Lo visto y lo oculto.** El tubo está debajo del fondo. En la planta, de P₁ a S₁, cae
              entero dentro de A₁B₁C₁D₁, y el fondo lo tapa: a trazos. En el alzado, mirado desde
              delante, el fondo baja hacia DC y queda delante del tubo hasta su cruce con A₂D₂, en Q₂: de
              P₂ a Q₂, a trazos.
          - con: arista-vista
            traza: segmento2(solucion.Q_2, proy_alzado(S))
            porque: |
              De Q₂ a S₂ el tubo ya está por debajo de la tolva, y nada lo tapa: en continua.
        pista: |
          (1) A₁B₁ es la planta de una horizontal del fondo. (2) La frontal por P: la horizontal del papel
          por P₁ corta A₁D₁ y B₁C₁ en M₁ y N₁; súbelos a A₂D₂ y B₂C₂, y M₂N₂ es f₂. (3) Por P₂, la
          perpendicular a f₂ hasta la recta del suelo: S₂. (4) Por P₁, la perpendicular a A₁B₁; S₁ está
          en ella, en la vertical de S₂. (5) En la planta el fondo tapa el tubo entero; en el alzado,
          hasta A₂D₂.
        desarrollo: |
          En verde claro, la frontal M₂N₂ y el tubo, de P al suelo, con lo oculto a trazos. En la planta
          el tubo va de P₁ hacia arriba a la izquierda, perpendicular a A₁B₁, y S₁ cae dentro del fondo;
          en el alzado baja hacia la izquierda, perpendicular a M₂N₂, hasta la recta del suelo.

      - tipo: calcular
        titulo: La longitud del tubo
        pregunta: ¿Cuánto mide el tubo, de P al suelo?
        respuesta:
          tipo: numero
          valor: '28.96'
          receta: largo
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '16.01'
            receta: en_mm(vm_planta(P, S))
            mensaje: |
              Eso es lo que mide **P₁S₁ en la planta**. El tubo baja de P al suelo, y la planta lo acorta:
              es un cateto. El otro es lo que P está por encima del suelo, y el tubo es la hipotenusa.
          - valor: '26.79'
            receta: en_mm(vm_alzado(P, S))
            mensaje: |
              Eso es **P₂S₂ en el alzado**, que también acorta: el tubo no es frontal, porque se va hacia
              atrás mientras baja (S₁ queda por encima de P₁ en la planta).
          - valor: '24.13'
            receta: en_mm(diferencia_de_cotas(P, S))
            mensaje: |
              Eso es lo que **P está por encima del suelo**, la altura que baja el tubo: el tubo sería así
              de largo si fuera vertical. Va inclinado, perpendicular al fondo, y mide más.
        pista: |
          El tubo no está en verdadera magnitud en ninguna de las dos vistas. Mide P₁S₁ en la planta y lo
          que P₂ está por encima de la recta del suelo en el alzado: son los dos catetos de su triángulo.
        desarrollo: |
          El tubo PS es la hipotenusa del triángulo que tiene por catetos su planta, P₁S₁, y lo que baja,
          la altura de P sobre el suelo:

          $$ \overline{PS} = \sqrt{16{,}01^{2} + 24{,}13^{2}} \approx 28{,}96 \text{ mm} $$

          Por otro camino sale lo mismo: el tubo forma con la vertical el ángulo que el fondo forma con el
          suelo, 33,56°, y 24,13 / cos 33,56° ≈ 28,96 mm.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: 'A₂B₂ es horizontal: AB es una horizontal del fondo, y la planta del tubo es perpendicular a A₁B₁.'
          - texto: 'La frontal del fondo por P tiene la planta horizontal; subida al alzado es M₂N₂, y el alzado del tubo le es perpendicular.'
          - texto: 'El suelo es horizontal y el alzado lo ve de canto: S₂ es donde el alzado del tubo corta esa recta, y S₁ está en su vertical, sobre la planta del tubo.'
          - texto: 'El tubo va por debajo del fondo: en la planta lo tapa entero, y en el alzado, hasta que sale por A₂D₂.'
          - texto: 'El alzado del tubo es perpendicular a A₂D₂, porque AD es la arista por la que baja el fondo.'
            trampa: true
            mensaje: |
              AD baja por el fondo, pero no es frontal: el ángulo recto con ella no se ve recto en el
              alzado. Con t₂ perpendicular a A₂D₂, el tubo llegaría al suelo 11 mm más a la izquierda y no
              sería perpendicular al fondo.
    resolucion: |
      **Lo que dan los datos.** El fondo ABCD baja de AB a DC, y AB es horizontal: A₂B₂ lo es en el
      papel. P es un punto del fondo, y el suelo es el plano horizontal de la recta «zorua», que el
      alzado ve de canto 8,4 mm por debajo de D₂C₂.

      **El tubo.** Una recta es perpendicular a un plano si su planta es perpendicular a la de una
      horizontal del plano y su alzado a la de una frontal. La horizontal es AB: t₁ es la
      perpendicular a A₁B₁ por P₁. La frontal se traza por P: la horizontal del papel por P₁ corta A₁D₁
      y B₁C₁ en M₁ y N₁, que suben a A₂D₂ y B₂C₂, y M₂N₂ pasa por P₂; t₂ es la perpendicular a M₂N₂ por
      P₂. Hacia arriba el tubo se mete en la tolva, así que va hacia abajo: t₂ corta la recta del suelo
      en S₂, y S₁ está en su vertical, sobre t₁, dentro de la planta del fondo.

      **Lo visto y lo oculto.** El tubo va por debajo del fondo. En la planta, el fondo lo tapa entero.
      En el alzado, mirado desde delante, el fondo queda delante del tubo hasta que este sale por
      debajo de A₂D₂, en Q₂: de P₂ a Q₂ va a trazos, y de Q₂ a S₂ en continua.

      **La longitud.** P₁S₁ mide 16,01 mm y P está 24,13 mm por encima del suelo: el tubo mide 28,96 mm.

  - id: sd50-el-cuadrado-paralelo-a-abc-por-p
    titulo: El cuadrado de 35 mm paralelo al plano ABC, con P a 20 mm por encima
    fuente: Ejercicio 35 (SD50) · Colección de ejercicios de Geometría Descriptiva, Sistema Diédrico Directo · Dpto. de Expresión Gráfica y Proyectos de Ingeniería, EIG · UPV/EHU
    nivel: practica
    # Decisión: el texto impreso tal cual, cotejado con la página (pág. 36),
    # con su «proyección horizontal de punto P». «20 mm por encima» se lee
    # como distancia entre planos (por la perpendicular a ABC), y las Notas
    # nuestras dicen qué saldría en vertical. Q, R, S, G, H y J son nombres
    # nuestros.
    enunciado: |
      Se presentan las proyecciones diédricas del plano ABC y la proyección horizontal de punto P,
      que queda a 20 mm por encima del mismo. Representar el cuadrado de lado 35 mm paralelo al plano
      ABC sabiendo que el punto P es el vértice de mayor cota y que dos de sus lados son paralelos al
      lado CB.

      **Notas nuestras.** «de punto P», sin artículo, es errata de la hoja por «del punto P», y se deja
      tal como está impresa. La figura es el triángulo ABC, con el alzado arriba y la planta debajo, y
      la planta de P, con su cruz, dentro de la planta del triángulo. Escala 1:1: lo que mides en la
      lámina, en milímetros, es el resultado. «Queda a 20 mm por encima del mismo» lo leemos como una
      distancia entre planos: P está en el plano paralelo a ABC a 20 mm, medidos por la perpendicular
      a ABC, del lado hacia el que sube la cota. Es como se lee la distancia de un punto a un plano, y
      como la 52·4 lee los 25 mm de su chapa. Si se leyera «20 mm más alto que el punto de ABC de su
      vertical», P₂ quedaría 6,06 mm más abajo, el plano del cuadrado a 15,35 mm de ABC, y el cuadrado,
      con la misma planta, 6,06 mm más abajo en el alzado. El cuadrado está en ese plano paralelo, y P
      es uno de sus vértices: con dos lados paralelos a CB, los dos que salen de P van uno paralelo a
      CB y otro perpendicular, y como P es el de mayor cota, los dos bajan. Eso deja un solo cuadrado.
      Llamamos Q al vértice que sigue a P en el lado paralelo a CB, S al que sigue a P en el otro y R
      al cuarto; y G, H y J son puntos de la construcción. Todos, nombres nuestros. El triángulo y el
      cuadrado se toman como placas opacas, como en el Ejercicio 38, para lo visto y lo oculto.
    pide: P₂, con el plano ABC de canto en un cambio de plano; el cuadrado en verdadera magnitud en un segundo cambio y sus dos proyecciones, con lo visto y lo oculto; y, como pregunta nuestra, lo que P está más alto que el plano en su vertical.
    receta:
      lamina: sd50
      escena:
        A: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("A1"))'
        B: 'punto3(alzado: figura.punto("B2"), planta: figura.punto("B1"))'
        C: 'punto3(alzado: figura.punto("C2"), planta: figura.punto("C1"))'
        abc: plano(A, B, C)
      solucion:
        # Decisión: «20 mm por encima», por la perpendicular al plano, del lado
        # al que sube la cota (normalQueSube). Con la otra lectura, Pv.
        pi: 'paralelo_a_distancia(abc, mm(20), sentido: ascendente)'
        P: 'punto_en_plano(planta: figura.punto("P1"), plano: pi)'
        Pabc: 'punto_en_plano(planta: figura.punto("P1"), plano: abc)'
        Pv: 'punto3(alzado: desplaza(proy_alzado(Pabc), dy: mm(-20)), planta: figura.punto("P1"))'
        Pb: 'punto_en_plano(planta: figura.punto("P1"), plano: paralelo_a_distancia(abc, mm(20), sentido: descendente))'
        subida_mm: en_mm(diferencia_de_cotas(P, Pabc))
        # El cuadrado. PQ, paralelo a CB: la recta por P con la dirección de C
        # menos B (T = P + C − B). PS, perpendicular a CB en el plano: por P,
        # paralela a W − W′, con W un punto del plano y W′ su pie en PQ. De los
        # dos puntos a 35 mm, el que baja (rama 1 para Q, hacia C; rama 2 para
        # S): P es el vértice de mayor cota. Los otros dos son errores.
        T: 'simetrico(B, respecto: punto_medio(segmento3(P, C)))'
        pq: recta3(P, T)
        QQ: 'punto_a_distancia(pq, desde: P, distancia: mm(35))'
        Q: rama(QQ, 1)
        Qmal: rama(QQ, 2)
        W: 'punto_en_plano(planta: figura.punto("A1"), plano: pi)'
        Wp: pie_perpendicular(W, pq)
        ps: 'recta3(P, simetrico(Wp, respecto: punto_medio(segmento3(P, W))))'
        SS: 'punto_a_distancia(ps, desde: P, distancia: mm(35))'
        S: rama(SS, 2)
        Smal: rama(SS, 1)
        R: 'simetrico(P, respecto: punto_medio(segmento3(Q, S)))'
        # Decisión: dos cambios de plano, con las líneas nuevas en la lámina. El
        # primero, vertical, con «nueva1» perpendicular a las horizontales del
        # plano y C, el vértice más bajo, de referencia: ABC sale de canto, y el
        # plano paralelo a 20 mm es la paralela al canto a 20 mm. El segundo,
        # con «nueva2» paralela al canto y B de referencia: los dos planos en
        # verdadera magnitud.
        C_4: 'cambio_plano_vertical(C, figura.segmento("nueva1"), ref: C)'
        A_4: 'cambio_plano_vertical(A, figura.segmento("nueva1"), ref: C)'
        B_4: 'cambio_plano_vertical(B, figura.segmento("nueva1"), ref: C)'
        P_4: 'cambio_plano_vertical(P, figura.segmento("nueva1"), ref: C)'
        Q_4: 'cambio_plano_vertical(Q, figura.segmento("nueva1"), ref: C)'
        R_4: 'cambio_plano_vertical(R, figura.segmento("nueva1"), ref: C)'
        S_4: 'cambio_plano_vertical(S, figura.segmento("nueva1"), ref: C)'
        Pabc_4: 'cambio_plano_vertical(Pabc, figura.segmento("nueva1"), ref: C)'
        Pv_4: 'cambio_plano_vertical(Pv, figura.segmento("nueva1"), ref: C)'
        Pb_4: 'cambio_plano_vertical(Pb, figura.segmento("nueva1"), ref: C)'
        B_5: 'cambio_plano_vertical(B, figura.segmento("nueva1"), ref: C, luego: figura.segmento("nueva2"), ref2: B)'
        C_5: 'cambio_plano_vertical(C, figura.segmento("nueva1"), ref: C, luego: figura.segmento("nueva2"), ref2: B)'
        P_5: 'cambio_plano_vertical(P, figura.segmento("nueva1"), ref: C, luego: figura.segmento("nueva2"), ref2: B)'
        Q_5: 'cambio_plano_vertical(Q, figura.segmento("nueva1"), ref: C, luego: figura.segmento("nueva2"), ref2: B)'
        R_5: 'cambio_plano_vertical(R, figura.segmento("nueva1"), ref: C, luego: figura.segmento("nueva2"), ref2: B)'
        S_5: 'cambio_plano_vertical(S, figura.segmento("nueva1"), ref: C, luego: figura.segmento("nueva2"), ref2: B)'
        Qmal_5: 'cambio_plano_vertical(Qmal, figura.segmento("nueva1"), ref: C, luego: figura.segmento("nueva2"), ref2: B)'
        Smal_5: 'cambio_plano_vertical(Smal, figura.segmento("nueva1"), ref: C, luego: figura.segmento("nueva2"), ref2: B)'
        canto: segmento2(C_4, A_4)
        # G, a 20 mm de B₄ por la perpendicular al canto, del lado de más cota
        # (lejos de la línea nueva); pi4, la paralela al canto por G.
        G: 'uno(medir_sobre(perpendicular(por: B_4, a: canto), desde: B_4, distancia: mm(20)), 2)'
        pi4: 'perpendicular(por: G, a: perpendicular(por: G, a: canto))'
        # Los pies en la primera línea nueva (centros del compás) y las
        # referencias desde la planta.
        K_A: 'pie_perpendicular(figura.punto("A1"), figura.segmento("nueva1"))'
        K_B: 'pie_perpendicular(figura.punto("B1"), figura.segmento("nueva1"))'
        K_P: 'pie_perpendicular(figura.punto("P1"), figura.segmento("nueva1"))'
        refA: 'perpendicular(por: figura.punto("A1"), a: figura.segmento("nueva1"))'
        refB: 'perpendicular(por: figura.punto("B1"), a: figura.segmento("nueva1"))'
        refP: 'perpendicular(por: figura.punto("P1"), a: figura.segmento("nueva1"))'
        # La horizontal de C₂ y donde corta las verticales de A, B y P (J): lo
        # que A₂ y B₂ están por encima es lo que A y B están más altos que C; y
        # desde J se lleva la cota de P.
        A_c: 'cruce_aparente(segmento2(figura.punto("C2"), desplaza(figura.punto("C2"), dx: 10)), segmento2(figura.punto("A2"), figura.punto("A1")))'
        B_c: 'cruce_aparente(segmento2(figura.punto("C2"), desplaza(figura.punto("C2"), dx: 10)), segmento2(figura.punto("B2"), figura.punto("B1")))'
        J: 'cruce_aparente(segmento2(figura.punto("C2"), desplaza(figura.punto("C2"), dx: 10)), segmento2(figura.punto("P1"), desplaza(figura.punto("P1"), dy: -10)))'
        dyAC: 'raiz(vm(A, C) * vm(A, C) - vm_alzado(A, C) * vm_alzado(A, C))'
        # El segundo cambio: la paralela a la primera línea nueva por B₁ (pB);
        # lo que cada planta está más lejos de esa línea que B₁ es su distancia a
        # pB, por su referencia: de C₁ a MC y de P₁ a MP.
        pB: 'perpendicular(por: figura.punto("B1"), a: perpendicular(por: figura.punto("B1"), a: figura.segmento("nueva1")))'
        MC: 'cruce_aparente(perpendicular(por: figura.punto("C1"), a: figura.segmento("nueva1")), pB)'
        MP: 'cruce_aparente(refP, pB)'
        K2C: 'pie_perpendicular(C_4, figura.segmento("nueva2"))'
        K2P: 'pie_perpendicular(P_4, figura.segmento("nueva2"))'
        ref5P: 'perpendicular(por: P_4, a: figura.segmento("nueva2"))'
        lleva_P5: 'vm_planta(P, punto3(alzado: MP, planta: MP))'
        b5c5: segmento2(B_5, C_5)
        parP5: 'perpendicular(por: P_5, a: perpendicular(por: P_5, a: b5c5))'
        perpP5: 'perpendicular(por: P_5, a: b5c5)'
        parS5: 'perpendicular(por: S_5, a: perpendicular(por: S_5, a: b5c5))'
        perpQ5: 'perpendicular(por: Q_5, a: b5c5)'
        # La vuelta: de la vista 5 a la paralela al canto (vista 4), de ahí a la
        # planta por las referencias, a la distancia de pB que da la vista 5, y al
        # alzado por las verticales; Q₂ y R₂, en las paralelas a C₂B₂ por P₂ y
        # por S₂, porque PQ y SR son paralelos a CB.
        refQ: 'perpendicular(por: Q_4, a: figura.segmento("nueva1"))'
        refR: 'perpendicular(por: R_4, a: figura.segmento("nueva1"))'
        refS: 'perpendicular(por: S_4, a: figura.segmento("nueva1"))'
        MQ: cruce_aparente(refQ, pB)
        MR: cruce_aparente(refR, pB)
        MS: cruce_aparente(refS, pB)
        K2Q: 'pie_perpendicular(Q_5, figura.segmento("nueva2"))'
        K2R: 'pie_perpendicular(R_5, figura.segmento("nueva2"))'
        K2S: 'pie_perpendicular(S_5, figura.segmento("nueva2"))'
        lleva_Q1: 'vm_planta(Q, punto3(alzado: MQ, planta: MQ))'
        lleva_R1: 'vm_planta(R, punto3(alzado: MR, planta: MR))'
        lleva_S1: 'vm_planta(S, punto3(alzado: MS, planta: MS))'
        JS: 'cruce_aparente(segmento2(figura.punto("C2"), desplaza(figura.punto("C2"), dx: 10)), segmento2(proy_planta(S), proy_alzado(S)))'
        K1S: 'pie_perpendicular(S_4, figura.segmento("nueva1"))'
        parP2: 'perpendicular(por: proy_alzado(P), a: perpendicular(por: proy_alzado(P), a: figura.segmento("BC2")))'
        parS2: 'perpendicular(por: proy_alzado(S), a: perpendicular(por: proy_alzado(S), a: figura.segmento("BC2")))'
        # Lo visto y lo oculto: los cruces aparentes donde cambia.
        x_QR2: 'cruce_aparente(segmento2(proy_alzado(Q), proy_alzado(R)), figura.segmento("CA2"))'
        x_RS2: 'cruce_aparente(segmento2(proy_alzado(R), proy_alzado(S)), figura.segmento("AB2"))'
        y_QR1: 'cruce_aparente(figura.segmento("BC1"), segmento2(proy_planta(Q), proy_planta(R)))'
        y_SP1: 'cruce_aparente(figura.segmento("BC1"), segmento2(proy_planta(S), proy_planta(P)))'
        # Los extremos de las rectas largas de la construcción.
        L_hC: 'uno(medir_sobre(segmento2(figura.punto("C2"), B_c), desde: B_c, distancia: mm(4)), 1)'
        L_C4: 'uno(medir_sobre(segmento2(figura.punto("C1"), C_4), desde: C_4, distancia: mm(4)), 1)'
        L_A4: 'uno(medir_sobre(segmento2(figura.punto("A1"), A_4), desde: A_4, distancia: mm(4)), 1)'
        L_B4: 'uno(medir_sobre(segmento2(figura.punto("B1"), B_4), desde: B_4, distancia: mm(4)), 1)'
        L_P4: 'uno(medir_sobre(segmento2(figura.punto("P1"), P_4), desde: P_4, distancia: mm(4)), 1)'
        L_canto: 'uno(medir_sobre(segmento2(C_4, A_4), desde: A_4, distancia: mm(4)), 1)'
        L_G: 'uno(medir_sobre(segmento2(B_4, G), desde: G, distancia: mm(3)), 1)'
        L_piP: 'uno(medir_sobre(pi4, desde: P_4, distancia: mm(4)), 2)'
        L_piR: 'uno(medir_sobre(pi4, desde: R_4, distancia: mm(4)), 1)'
        L_P2: 'uno(medir_sobre(segmento2(figura.punto("P1"), proy_alzado(P)), desde: proy_alzado(P), distancia: mm(4)), 1)'
        L_pBa: 'uno(medir_sobre(segmento2(figura.punto("B1"), MR), desde: MR, distancia: mm(4)), 1)'
        L_pBb: 'uno(medir_sobre(segmento2(figura.punto("B1"), MP), desde: MP, distancia: mm(4)), 1)'
        L_B5: 'uno(medir_sobre(segmento2(B_4, B_5), desde: B_5, distancia: mm(4)), 1)'
        L_C5: 'uno(medir_sobre(segmento2(C_4, C_5), desde: C_5, distancia: mm(4)), 1)'
        L_P5: 'uno(medir_sobre(segmento2(P_4, P_5), desde: P_5, distancia: mm(4)), 1)'
        L_Q5: 'uno(medir_sobre(segmento2(P_5, Q_5), desde: Q_5, distancia: mm(4)), 1)'
        L_S5: 'uno(medir_sobre(segmento2(P_5, S_5), desde: S_5, distancia: mm(4)), 1)'
        L_R5a: 'uno(medir_sobre(segmento2(S_5, R_5), desde: R_5, distancia: mm(4)), 1)'
        L_R5b: 'uno(medir_sobre(segmento2(Q_5, R_5), desde: R_5, distancia: mm(4)), 1)'
        L_Q4: 'uno(medir_sobre(segmento2(Q_5, Q_4), desde: Q_4, distancia: mm(3)), 1)'
        L_R4: 'uno(medir_sobre(segmento2(R_5, R_4), desde: R_4, distancia: mm(3)), 1)'
        L_S4: 'uno(medir_sobre(segmento2(S_5, S_4), desde: S_4, distancia: mm(3)), 1)'
        L_Q1: 'uno(medir_sobre(segmento2(Q_4, proy_planta(Q)), desde: proy_planta(Q), distancia: mm(4)), 1)'
        L_R1: 'uno(medir_sobre(segmento2(R_4, proy_planta(R)), desde: proy_planta(R), distancia: mm(4)), 1)'
        L_S1: 'uno(medir_sobre(segmento2(S_4, proy_planta(S)), desde: proy_planta(S), distancia: mm(4)), 1)'
        L_Q2: 'uno(medir_sobre(segmento2(proy_planta(Q), proy_alzado(Q)), desde: proy_alzado(Q), distancia: mm(4)), 1)'
        L_R2: 'uno(medir_sobre(segmento2(proy_planta(R), proy_alzado(R)), desde: proy_alzado(R), distancia: mm(4)), 1)'
        L_S2: 'uno(medir_sobre(segmento2(proy_planta(S), proy_alzado(S)), desde: proy_alzado(S), distancia: mm(4)), 1)'
        L_Q2p: 'uno(medir_sobre(segmento2(proy_alzado(P), proy_alzado(Q)), desde: proy_alzado(Q), distancia: mm(3)), 1)'
        L_R2p: 'uno(medir_sobre(segmento2(proy_alzado(S), proy_alzado(R)), desde: proy_alzado(R), distancia: mm(3)), 1)'
      comprueba:
        - en_plano(P, pi)
        - en_plano(Q, pi)
        - en_plano(R, pi)
        - en_plano(S, pi)
    pasos:
      - tipo: reconocer
        pregunta: El cuadrado es paralelo al plano ABC y P es uno de sus vértices. ¿En qué plano está?
        opciones:
          - texto: En el paralelo a ABC que pasa por P
            correcta: true
            mensaje: |
              Eso es. Un cuadrado paralelo a ABC está en un plano paralelo a ABC, y si P es un vértice, es el
              que pasa por P. Con ABC de canto en un cambio de plano, ese plano es la paralela al canto por
              P₄, y los 20 mm se miden entre las dos, en verdadera magnitud.
          - texto: En el propio plano ABC, porque una figura paralela a un plano tiene que estar dentro de él
            mensaje: |
              P no está en ABC: queda 20 mm por encima. Una figura paralela a un plano está en un plano
              paralelo a él, y ese plano pasa por P. Si fuera ABC mismo, P estaría en él.
          - texto: En el plano horizontal de P, porque P es el vértice de mayor cota y los demás se apoyan en él
            mensaje: |
              Si el cuadrado estuviera en el horizontal de P, los cuatro vértices tendrían la cota de P y
              ninguno sería el de mayor cota. Además, ese plano no es paralelo a ABC, que está inclinado
              39,9° respecto del horizontal.

      # Decisión: dos pasos construir. El primero, P₂, con el plano de canto: la
      # distancia, que es lo propio del tema. El segundo, el cuadrado, rehace
      # el canto y P₄ (el reproductor arranca cada paso desde la lámina) y añade
      # el segundo cambio, el cuadrado en verdadera magnitud y la vuelta.
      - tipo: construir
        titulo: P₂, con el plano ABC de canto
        intro: |
          Un cambio de plano vertical con la línea nueva perpendicular a las horizontales del plano pone
          ABC de canto: sus horizontales se ven de punta. El enunciado no dice dónde va la línea nueva: la
          hemos dibujado ya, de trazo y punto, a la derecha de la planta, perpendicular a la horizontal
          del plano por B, que corta AC en un punto de la cota de B. C, el vértice más bajo, es la
          referencia: C₄ cae en la línea, y cada punto sale de su planta por la perpendicular a la línea y
          se aparta de ella, hacia fuera, lo que está más alto que C, que se lee en el alzado sobre la
          horizontal de C₂. A₄, B₄ y C₄ salen en línea: el canto. El plano del cuadrado, paralelo a ABC
          a 20 mm por encima, es la paralela al canto a 20 mm, del lado de fuera, que es el de más cota;
          P₄ está en ella, en la perpendicular a la línea nueva por P₁. Y P₂, en la vertical de P₁, a lo
          que P₄ dista de la línea nueva por encima de la horizontal de C₂. Marca A₄, B₄, P₄ y P₂.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, borrar]
        tolerancia: 1
        objetivos:
          - nombre: A4
            pide: A en la vista nueva
            es: solucion.A_4
            bien: |
              A₄ está en la perpendicular a la línea nueva por A₁, a 36,03 mm de ella, hacia fuera: lo que A₂
              está por encima de la horizontal de C₂.
            diagnosticos:
              - si: cerca_de(solucion.K_A)
                mensaje: |
                  Has dejado A₄ en la línea nueva, como si A fuera la referencia. La referencia es C: A se
                  aparta lo que está más alto que C, de A₂ a la horizontal de C₂.
                ejemplo: solucion.K_A
              - si: 'en_recta(solucion.refA) && a_distancia(de: solucion.K_A, d: solucion.dyAC)'
                mensaje: |
                  Has llevado lo que A está **más cerca** que C, la diferencia de alejamientos. Un cambio de
                  plano vertical sale de la planta y lleva **cotas**: lo que A₂ está por encima de la
                  horizontal de C₂.
                ejemplo: 'uno(medir_sobre(solucion.refA, desde: solucion.K_A, distancia: solucion.dyAC), 2)'
              - si: 'cerca_de(uno(medir_sobre(solucion.refA, desde: solucion.K_A, distancia: diferencia_de_cotas(A, C)), 1))'
                mensaje: |
                  La distancia es la buena, pero **hacia la planta**. A es más alto que la referencia, y se
                  aparta de la línea nueva hacia fuera, al lado contrario de la planta.
                ejemplo: 'uno(medir_sobre(solucion.refA, desde: solucion.K_A, distancia: diferencia_de_cotas(A, C)), 1)'
              - si: '!en_recta(solucion.refA)'
                mensaje: |
                  A₄ sale de A₁ por la **perpendicular a la línea nueva**.
                ejemplo: 'desplaza(solucion.A_4, dy: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular a la línea nueva por A₁, pero no a la distancia buena: lo que A₂
                  está por encima de la horizontal de C₂.
          - nombre: B4
            pide: B en la vista nueva
            es: solucion.B_4
            bien: |
              B₄ está en la perpendicular a la línea nueva por B₁, a 12,40 mm de ella: lo que B₂ está por
              encima de la horizontal de C₂. C₄, B₄ y A₄ quedan en línea: el plano, de canto.
            diagnosticos:
              - si: cerca_de(solucion.K_B)
                mensaje: |
                  Has dejado B₄ en la línea nueva, como si B fuera la referencia. La referencia es C: B se
                  aparta lo que B₂ está por encima de la horizontal de C₂.
                ejemplo: solucion.K_B
              - si: 'cerca_de(uno(medir_sobre(solucion.refB, desde: solucion.K_B, distancia: diferencia_de_cotas(B, C)), 1))'
                mensaje: |
                  La distancia es la buena, pero **hacia la planta**. B es más alto que C, y va hacia fuera,
                  como A.
                ejemplo: 'uno(medir_sobre(solucion.refB, desde: solucion.K_B, distancia: diferencia_de_cotas(B, C)), 1)'
              - si: '!en_recta(solucion.refB)'
                mensaje: |
                  B₄ sale de B₁ por la **perpendicular a la línea nueva**.
                ejemplo: 'desplaza(solucion.B_4, dy: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular a la línea nueva por B₁, pero no a la distancia buena: lo que B₂
                  está por encima de la horizontal de C₂.
          - nombre: P4
            pide: P en la vista nueva
            es: solucion.P_4
            bien: |
              P₄ está en la perpendicular a la línea nueva por P₁ y en la paralela al canto a 20 mm, del lado
              de más cota: a 43,31 mm de la línea nueva.
            diagnosticos:
              - si: cerca_de(solucion.Pabc_4)
                mensaje: |
                  Ese es el punto del **plano ABC** que tiene la planta de P: está en el canto. P queda 20 mm
                  por encima del plano, en la paralela al canto a 20 mm.
                ejemplo: solucion.Pabc_4
              - si: cerca_de(solucion.Pv_4)
                mensaje: |
                  Has subido 20 mm desde el canto **por la perpendicular a la línea nueva**, que en esta vista
                  es la vertical: es la otra lectura del enunciado, «20 mm más alto que el plano en la vertical
                  de P». Aquí los 20 mm son la distancia de P al plano, por la perpendicular al canto: P₄ va en
                  la paralela al canto a 20 mm.
                ejemplo: solucion.Pv_4
              - si: cerca_de(solucion.Pb_4)
                mensaje: |
                  Ese P queda 20 mm **por debajo** del plano: has trazado la paralela al canto del lado de la
                  línea nueva. Por encima es hacia más cota, y en esta vista la cota crece hacia fuera.
                ejemplo: solucion.Pb_4
              - si: '!en_recta(solucion.refP)'
                mensaje: |
                  P₄ sale de P₁ por la **perpendicular a la línea nueva**, como los vértices del triángulo.
                ejemplo: 'uno(medir_sobre(solucion.pi4, desde: solucion.P_4, distancia: mm(6)), 1)'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular a la línea nueva por P₁, pero no en la paralela al canto a 20 mm:
                  P₄ está donde se cortan.
          - nombre: P2
            pide: P en el alzado
            es: proy_alzado(P)
            bien: |
              P₂ está en la vertical de P₁, a 43,31 mm por encima de la horizontal de C₂, que es lo que P₄
              dista de la línea nueva. Queda por encima del triángulo: 26,06 mm por encima del punto del plano
              que está en su vertical.
            diagnosticos:
              - si: '!en_vertical_de(figura.punto("P1"))'
                mensaje: |
                  P₂ va en la **vertical de P₁**.
                ejemplo: 'desplaza(proy_alzado(P), dx: mm(6))'
              - si: 'cerca_de(proy_alzado(Pabc))'
                mensaje: |
                  Ese es el punto del **plano ABC** en la vertical de P. P está por encima del plano, y su cota
                  sale de P₄: lo que P₄ dista de la línea nueva, sobre la horizontal de C₂.
                ejemplo: proy_alzado(Pabc)
              - si: 'cerca_de(proy_alzado(Pv))'
                mensaje: |
                  Has subido P₂ 20 mm en vertical sobre el plano: es la otra lectura del enunciado. Con la
                  nuestra, los 20 mm van por la perpendicular al plano, y en vertical salen 26,06 mm.
                ejemplo: proy_alzado(Pv)
              - si: siempre
                mensaje: |
                  Estás en la vertical de P₁, pero no a la altura buena: P₂ está por encima de la horizontal de
                  C₂ lo que P₄ dista de la línea nueva.
        construccion:
          - con: regla
            traza: '[segmento2(figura.punto("A2"), figura.punto("A1")), segmento2(figura.punto("B2"), figura.punto("B1"))]'
            porque: |
              Las líneas de referencia de A y de B, con la regla, de cada alzado a su planta: sobre ellas se
              miden las cotas.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("C2"), solucion.L_hC)
            guia: segmento2(figura.punto("A2"), figura.punto("A1"))
            porque: |
              Por C₂, la horizontal, perpendicular a las verticales, hasta pasar la de B. C es el vértice más
              bajo y la referencia: lo que A₂ y B₂ están por encima de esta recta es lo que A y B están más
              altos que C.
          - con: escuadra-cartabon
            traza: '[segmento2(figura.punto("C1"), solucion.L_C4), segmento2(figura.punto("A1"), solucion.L_A4), segmento2(figura.punto("B1"), solucion.L_B4), segmento2(figura.punto("P1"), solucion.L_P4)]'
            guia: figura.segmento("nueva1")
            porque: |
              Por C₁, A₁, B₁ y P₁, las perpendiculares a la línea nueva, largas: la de C₁ hasta la línea, y
              las de A₁, B₁ y P₁ más allá, porque esos puntos están más altos que C.
          - con: marca
            traza: solucion.C_4
            rotulo: C₄
            porque: |
              C₄, donde la perpendicular por C₁ corta la línea nueva: C es la referencia, y su cota cuenta
              como cero.
          - con: compas
            traza: 'arco(solucion.K_A, por: solucion.A_4, desde: uno(medir_sobre(perpendicular(por: solucion.A_4, a: solucion.refA), desde: solucion.A_4, distancia: mm(3)), 1), hasta: uno(medir_sobre(perpendicular(por: solucion.A_4, a: solucion.refA), desde: solucion.A_4, distancia: mm(3)), 2))'
            toma: segmento2(figura.punto("A2"), solucion.A_c)
            porque: |
              Con el compás, lo que A₂ está por encima de la horizontal de C₂, y centro donde la
              perpendicular por A₁ corta la línea nueva: hacia fuera, al lado contrario de la planta.
          - con: marca
            traza: solucion.A_4
            rotulo: A₄
            porque: |
              A₄, donde el arco corta la perpendicular por A₁, por fuera de la línea nueva.
          - con: compas
            traza: 'arco(solucion.K_B, por: solucion.B_4, desde: uno(medir_sobre(perpendicular(por: solucion.B_4, a: solucion.refB), desde: solucion.B_4, distancia: mm(3)), 1), hasta: uno(medir_sobre(perpendicular(por: solucion.B_4, a: solucion.refB), desde: solucion.B_4, distancia: mm(3)), 2))'
            toma: segmento2(figura.punto("B2"), solucion.B_c)
            porque: |
              Lo mismo con B: de B₂ a la horizontal de C₂, desde la línea nueva sobre la perpendicular por
              B₁, hacia fuera.
          - con: marca
            traza: solucion.B_4
            rotulo: B₄
            porque: |
              B₄, donde el arco corta la perpendicular por B₁, por fuera de la línea nueva.
          - con: regla
            traza: segmento2(solucion.C_4, solucion.L_canto)
            porque: |
              El **canto**: de C₄ por B₄ hasta pasar A₄. Los tres en línea son el plano ABC visto de canto; si
              no salieran en línea, alguna cota estaría mal llevada.
          - con: escuadra-cartabon
            traza: segmento2(solucion.B_4, solucion.L_G)
            guia: solucion.canto
            porque: |
              Por B₄, la perpendicular al canto, hacia fuera, que es el lado de más cota: en esta vista la
              cota crece al alejarse de la línea nueva.
          - con: compas
            traza: 'arco(solucion.B_4, por: solucion.G, desde: uno(medir_sobre(solucion.pi4, desde: solucion.G, distancia: mm(3)), 1), hasta: uno(medir_sobre(solucion.pi4, desde: solucion.G, distancia: mm(3)), 2))'
            porque: |
              Con el compás abierto 20 mm, los del enunciado, y centro en B₄, el arco que corta esa
              perpendicular: la distancia de P al plano, en verdadera magnitud, porque el canto la enseña.
          - con: marca
            traza: solucion.G
            rotulo: G
            porque: |
              G, nombre nuestro, donde el arco corta la perpendicular al canto por B₄, a 20 mm de él.
          - con: escuadra-cartabon
            traza: segmento2(solucion.G, solucion.L_piP)
            guia: solucion.canto
            porque: |
              Por G, la paralela al canto, hasta pasar la perpendicular por P₁: es el plano paralelo a ABC a
              20 mm por encima, de canto, y el cuadrado está en él.
          - con: marca
            traza: solucion.P_4
            rotulo: P₄
            porque: |
              P₄, donde la perpendicular a la línea nueva por P₁ corta la paralela al canto: P está en el
              plano del cuadrado.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("P1"), solucion.L_P2)
            guia: segmento2(figura.punto("A2"), figura.punto("A1"))
            porque: |
              Por P₁, la vertical, paralela a las líneas de referencia, hasta el alzado y más arriba del
              triángulo: corta la horizontal de C₂ en J.
          - con: marca
            traza: solucion.J
            rotulo: J
            porque: |
              J, nombre nuestro, donde la vertical de P₁ corta la horizontal de C₂: desde aquí se lleva lo que
              P está más alto que C.
          - con: compas
            traza: 'arco(solucion.J, por: proy_alzado(P), desde: desplaza(proy_alzado(P), dx: mm(-3)), hasta: desplaza(proy_alzado(P), dx: mm(3)))'
            toma: segmento2(solucion.P_4, solucion.K_P)
            porque: |
              Con el compás, lo que P₄ dista de la línea nueva, por su perpendicular, y centro en J: hacia
              arriba, por la vertical de P₁.
          - con: marca
            traza: proy_alzado(P)
            rotulo: P₂
            porque: |
              P₂, donde el arco corta la vertical de P₁, por encima del triángulo: 43,31 mm más alto que C.
        pista: |
          (1) Por C₂, la horizontal: la referencia es C. (2) Por C₁, A₁, B₁ y P₁, las perpendiculares a la
          línea nueva; A y B, hacia fuera, lo que están más altos que C. (3) El canto, C₄B₄A₄. (4) La
          paralela al canto a 20 mm, hacia fuera; P₄, donde la corta la perpendicular por P₁. (5) P₂, en la
          vertical de P₁, a lo que P₄ dista de la línea nueva sobre la horizontal de C₂.
        desarrollo: |
          En verde claro, el canto C₄A₄, la paralela a 20 mm y P₄ en ella, y P₂ por encima del triángulo.
          P está 26,06 mm por encima del punto del plano que tiene su planta: 20 mm por la perpendicular
          al plano, que forma 39,9° con la vertical, son más en vertical.
        trazado:
          - solucion.canto
          - segmento2(solucion.G, solucion.P_4)

      - tipo: construir
        titulo: El cuadrado, en verdadera magnitud y en sus dos proyecciones
        intro: |
          Empieza como en el paso anterior: el canto C₄B₄A₄, la paralela a 20 mm por G y P₄, y P₂. El
          segundo cambio sale de la vista 4, con la línea nueva paralela al canto, ya dibujada debajo de la
          planta, y B de referencia: B₅ cae en ella, y cada punto sale de la vista 4 por la perpendicular a
          la línea y se aparta de ella, hacia fuera, lo que su planta está más lejos de la primera línea
          nueva que B₁, que se mide desde la paralela a la primera línea por B₁. En la vista 5, ABC y el
          plano del cuadrado están en verdadera magnitud. Desde P₅, un lado paralelo a B₅C₅, de 35 mm,
          hacia C, y otro perpendicular, hacia el lado contrario a A₅: los dos bajan, porque C es más bajo
          que B y A es el vértice más alto del triángulo. Después se vuelve: a la paralela al canto, a la
          planta y al alzado. Marca P₅, Q₅, S₅ y R₅, los tres vértices nuevos en las dos vistas, y pasa a
          limpio con «arista vista» y «arista oculta»: el triángulo y el cuadrado son opacos. R₁ y R₂ caen a
          1,5 mm de la vertical de A, R₅ a 1,4 mm de un cruce de rectas de la construcción y S₂ a 3,3 mm de
          A₂B₂: amplía con la lupa (×4) antes de marcarlos.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, visto, oculto, borrar]
        tolerancia: 1
        objetivos:
          - nombre: P5
            pide: P en la vista del segundo cambio
            es: solucion.P_5
            bien: |
              P₅ está en la perpendicular a la segunda línea nueva por P₄, a 20,27 mm de ella, hacia fuera: lo
              que P₁ está más lejos de la primera línea nueva que B₁.
            diagnosticos:
              - si: cerca_de(solucion.K2P)
                mensaje: |
                  Te has quedado en la línea nueva. Ahí caería P si su planta estuviera tan lejos de la primera
                  línea nueva como B₁; P₁ está más lejos lo que dista de la paralela a esa línea por B₁.
                ejemplo: solucion.K2P
              - si: 'cerca_de(uno(medir_sobre(solucion.ref5P, desde: solucion.K2P, distancia: solucion.lleva_P5), 2))'
                mensaje: |
                  La distancia es la buena, pero **hacia la vista 4**. P₁ está más lejos de la primera línea
                  nueva que B₁, y P₅ se aparta de la segunda hacia fuera.
                ejemplo: 'uno(medir_sobre(solucion.ref5P, desde: solucion.K2P, distancia: solucion.lleva_P5), 2)'
              - si: '!en_recta(solucion.ref5P)'
                mensaje: |
                  P₅ sale de P₄ por la **perpendicular a la segunda línea nueva**.
                ejemplo: 'desplaza(solucion.P_5, dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular a la segunda línea nueva por P₄, pero no a la distancia buena: lo que
                  P₁ dista de la paralela a la primera línea nueva por B₁.
          - nombre: Q5
            pide: Q, el vértice que sigue a P en el lado paralelo a CB, en la vista 5
            es: solucion.Q_5
            bien: |
              Q₅ está en la paralela a B₅C₅ por P₅, a 35 mm de P₅, hacia el lado de C₅: Q queda 5,30 mm más
              bajo que P.
            diagnosticos:
              - si: cerca_de(solucion.Qmal_5)
                mensaje: |
                  Has llevado el lado **hacia B**. B es más alto que C, y por ahí Q quedaría más alto que P,
                  que tiene que ser el vértice de mayor cota. El lado va hacia C.
                ejemplo: solucion.Qmal_5
              - si: '!en_recta(solucion.parP5)'
                mensaje: |
                  PQ es paralelo a CB, y en la vista 5 los dos están en verdadera magnitud: Q₅ va en la
                  **paralela a B₅C₅ por P₅**.
                ejemplo: 'uno(medir_sobre(solucion.perpQ5, desde: solucion.Q_5, distancia: mm(6)), 1)'
              - si: siempre
                mensaje: |
                  Estás en la paralela a B₅C₅ por P₅, pero no a 35 mm de P₅: el compás, con el lado del
                  enunciado.
          - nombre: S5
            pide: S, el vértice que sigue a P en el lado perpendicular a CB, en la vista 5
            es: solucion.S_5
            bien: |
              S₅ está en la perpendicular a B₅C₅ por P₅, a 35 mm, del lado contrario a A₅: S queda 21,80 mm
              más bajo que P.
            diagnosticos:
              - si: cerca_de(solucion.Smal_5)
                mensaje: |
                  Has llevado el lado **hacia A₅**. A es el vértice más alto del triángulo, y del lado de A la
                  cota sube: S quedaría más alto que P. El lado va hacia el otro lado.
                ejemplo: solucion.Smal_5
              - si: '!en_recta(solucion.perpP5)'
                mensaje: |
                  PS es perpendicular a CB, y en la vista 5 el ángulo recto se ve: S₅ va en la
                  **perpendicular a B₅C₅ por P₅**.
                ejemplo: 'uno(medir_sobre(solucion.parS5, desde: solucion.S_5, distancia: mm(6)), 1)'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular a B₅C₅ por P₅, pero no a 35 mm de P₅.
          - nombre: R5
            pide: R, el cuarto vértice, en la vista 5
            es: solucion.R_5
            bien: |
              R₅ cierra el cuadrado: en la paralela a B₅C₅ por S₅ y en la perpendicular por Q₅. P₅Q₅R₅S₅ es
              el cuadrado en verdadera magnitud, y R es su vértice más bajo, 27,09 mm por debajo de P.
            diagnosticos:
              - si: '!en_recta(solucion.parS5)'
                mensaje: |
                  RS es el lado opuesto a PQ, paralelo a CB: R₅ va en la **paralela a B₅C₅ por S₅**.
                ejemplo: 'uno(medir_sobre(solucion.perpQ5, desde: solucion.R_5, distancia: mm(6)), 2)'
              - si: '!en_recta(solucion.perpQ5)'
                mensaje: |
                  QR es perpendicular a CB, como PS: R₅ va en la **perpendicular a B₅C₅ por Q₅**.
                ejemplo: 'uno(medir_sobre(solucion.parS5, desde: solucion.R_5, distancia: mm(6)), 2)'
              - si: siempre
                mensaje: |
                  R₅ está donde la paralela a B₅C₅ por S₅ corta la perpendicular por Q₅.
          - nombre: Q1
            pide: Q en la planta
            es: proy_planta(Q)
            bien: |
              Q₁ está en la perpendicular a la primera línea nueva por Q₄, a lo que Q₅ dista de la segunda
              línea nueva, contado desde la paralela por B₁, hacia la planta.
            diagnosticos:
              - si: cerca_de(solucion.MQ)
                mensaje: |
                  Te has quedado en la paralela a la primera línea nueva por B₁. Q₁ se aparta de ella lo que Q₅
                  dista de la segunda línea nueva.
                ejemplo: solucion.MQ
              - si: '!en_recta(solucion.refQ)'
                mensaje: |
                  Q₁ vuelve de Q₄ por la **perpendicular a la primera línea nueva**.
                ejemplo: 'desplaza(proy_planta(Q), dy: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular a la primera línea nueva por Q₄, pero no a la distancia buena: lo
                  que Q₅ dista de la segunda línea nueva, desde la paralela por B₁.
          - nombre: S1
            pide: S en la planta
            es: proy_planta(S)
            bien: |
              S₁ está en la perpendicular a la primera línea nueva por S₄, a lo que S₅ dista de la segunda
              línea nueva, contado desde la paralela por B₁.
            diagnosticos:
              - si: cerca_de(solucion.MS)
                mensaje: |
                  Te has quedado en la paralela a la primera línea nueva por B₁. S₁ se aparta de ella lo que S₅
                  dista de la segunda línea nueva.
                ejemplo: solucion.MS
              - si: '!en_recta(solucion.refS)'
                mensaje: |
                  S₁ vuelve de S₄ por la **perpendicular a la primera línea nueva**.
                ejemplo: 'desplaza(proy_planta(S), dy: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular a la primera línea nueva por S₄, pero no a la distancia buena.
          - nombre: R1
            pide: R en la planta
            es: proy_planta(R)
            bien: |
              R₁ está en la perpendicular a la primera línea nueva por R₄, a lo que R₅ dista de la segunda
              línea nueva, contado desde la paralela por B₁. P₁Q₁R₁S₁ es un paralelogramo: la planta del
              cuadrado.
            diagnosticos:
              - si: cerca_de(solucion.MR)
                mensaje: |
                  Te has quedado en la paralela a la primera línea nueva por B₁. R₁ se aparta de ella lo que R₅
                  dista de la segunda línea nueva.
                ejemplo: solucion.MR
              - si: '!en_recta(solucion.refR)'
                mensaje: |
                  R₁ vuelve de R₄ por la **perpendicular a la primera línea nueva**.
                ejemplo: 'desplaza(proy_planta(R), dy: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular a la primera línea nueva por R₄, pero no a la distancia buena.
          - nombre: S2
            pide: S en el alzado
            es: proy_alzado(S)
            bien: |
              S₂ está en la vertical de S₁, a lo que S₄ dista de la primera línea nueva por encima de la
              horizontal de C₂.
            diagnosticos:
              - si: '!en_vertical_de(S1)'
                mensaje: |
                  S₂ va en la **vertical de S₁**.
                ejemplo: 'desplaza(proy_alzado(S), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la vertical de S₁, pero no a la altura buena: lo que S₄ dista de la primera línea
                  nueva, por encima de la horizontal de C₂.
          - nombre: Q2
            pide: Q en el alzado
            es: proy_alzado(Q)
            bien: |
              Q₂ está en la vertical de Q₁ y en la paralela a C₂B₂ por P₂: PQ es paralelo a CB, y sus alzados
              también lo son.
            diagnosticos:
              - si: '!en_vertical_de(Q1)'
                mensaje: |
                  Q₂ va en la **vertical de Q₁**.
                ejemplo: 'desplaza(proy_alzado(Q), dx: mm(6))'
              - si: '!en_recta(solucion.parP2)'
                mensaje: |
                  PQ es paralelo a CB, así que P₂Q₂ es paralela a C₂B₂: Q₂ va donde la vertical de Q₁ corta la
                  **paralela a C₂B₂ por P₂**.
                ejemplo: 'desplaza(proy_alzado(Q), dy: mm(-6))'
              - si: siempre
                mensaje: |
                  Q₂ está donde la vertical de Q₁ corta la paralela a C₂B₂ por P₂.
          - nombre: R2
            pide: R en el alzado
            es: proy_alzado(R)
            bien: |
              R₂ está en la vertical de R₁ y en la paralela a C₂B₂ por S₂. P₂Q₂R₂S₂ es el alzado del
              cuadrado.
            diagnosticos:
              - si: '!en_vertical_de(R1)'
                mensaje: |
                  R₂ va en la **vertical de R₁**.
                ejemplo: 'desplaza(proy_alzado(R), dx: mm(6))'
              - si: '!en_recta(solucion.parS2)'
                mensaje: |
                  SR es paralelo a CB: R₂ va donde la vertical de R₁ corta la **paralela a C₂B₂ por S₂**.
                ejemplo: 'desplaza(proy_alzado(R), dy: mm(6))'
              - si: siempre
                mensaje: |
                  R₂ está donde la vertical de R₁ corta la paralela a C₂B₂ por S₂.
        tramos:
          - traza: segmento2(proy_planta(P), proy_planta(Q))
            tipo: visto
            porque: 'El cuadrado está 26 mm por encima de ABC en la vertical: en la planta, nada lo tapa.'
          - traza: segmento2(proy_planta(Q), proy_planta(R))
            tipo: visto
            porque: 'El cuadrado está por encima del triángulo: en la planta, nada lo tapa.'
          - traza: segmento2(proy_planta(R), proy_planta(S))
            tipo: visto
            porque: 'El cuadrado está por encima del triángulo: en la planta, nada lo tapa.'
          - traza: segmento2(proy_planta(S), proy_planta(P))
            tipo: visto
            porque: 'El cuadrado está por encima del triángulo: en la planta, nada lo tapa.'
          - traza: segmento2(figura.punto("C1"), solucion.y_QR1)
            tipo: visto
            porque: 'De C₁ hasta que entra bajo el cuadrado, cruzando Q₁R₁, nada tapa el lado CB por arriba.'
          - traza: segmento2(solucion.y_QR1, solucion.y_SP1)
            tipo: oculto
            porque: 'Entre Q₁R₁ y S₁P₁, el lado CB pasa por debajo del cuadrado, que es opaco y está más alto: desde arriba lo tapa.'
          - traza: segmento2(solucion.y_SP1, figura.punto("B1"))
            tipo: visto
            porque: 'De S₁P₁ a B₁, CB sale de debajo del cuadrado: nada lo tapa.'
          - traza: segmento2(proy_alzado(P), proy_alzado(Q))
            tipo: visto
            porque: 'P₂Q₂ queda por encima del alzado del triángulo: delante no hay nada que lo tape.'
          - traza: segmento2(proy_alzado(Q), solucion.x_QR2)
            tipo: visto
            porque: 'De Q₂ hasta A₂C₂, el lado QR queda fuera del alzado del triángulo: nada lo tapa.'
          - traza: segmento2(solucion.x_QR2, proy_alzado(R))
            tipo: oculto
            porque: 'Al cruzar A₂C₂, QR entra detrás del triángulo: el plano del cuadrado está detrás de ABC (más lejos de quien mira), y el triángulo, opaco, lo tapa.'
          - traza: segmento2(proy_alzado(R), solucion.x_RS2)
            tipo: oculto
            porque: 'De R₂ hasta A₂B₂, el lado RS va detrás del triángulo, que lo tapa.'
          - traza: segmento2(solucion.x_RS2, proy_alzado(S))
            tipo: visto
            porque: 'Al cruzar A₂B₂, RS sale del alzado del triángulo: nada lo tapa.'
          - traza: segmento2(proy_alzado(S), proy_alzado(P))
            tipo: visto
            porque: 'S₂P₂ queda entero fuera del alzado del triángulo, por encima de A₂B₂: nada lo tapa.'
        trazado:
          - solucion.canto
          - segmento2(solucion.R_4, solucion.P_4)
          - segmento2(solucion.P_5, solucion.Q_5)
          - segmento2(solucion.Q_5, solucion.R_5)
          - segmento2(solucion.R_5, solucion.S_5)
          - segmento2(solucion.S_5, solucion.P_5)
        construccion:
          - con: regla
            traza: '[segmento2(figura.punto("A2"), figura.punto("A1")), segmento2(figura.punto("B2"), figura.punto("B1"))]'
            porque: |
              **Como en el paso anterior.** Las líneas de referencia de A y de B, con la regla, de cada alzado
              a su planta.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("C2"), solucion.L_hC)
            guia: segmento2(figura.punto("A2"), figura.punto("A1"))
            porque: |
              Por C₂, la horizontal, hasta pasar la vertical de B: las cotas se cuentan desde ella, porque C
              es la referencia.
          - con: escuadra-cartabon
            traza: '[segmento2(figura.punto("C1"), solucion.L_C4), segmento2(figura.punto("A1"), solucion.L_A4), segmento2(figura.punto("B1"), solucion.L_B4), segmento2(figura.punto("P1"), solucion.L_P4)]'
            guia: figura.segmento("nueva1")
            porque: |
              Por C₁, A₁, B₁ y P₁, las perpendiculares a la primera línea nueva, largas.
          - con: marca
            traza: solucion.C_4
            rotulo: C₄
            porque: |
              C₄, donde la perpendicular por C₁ corta la primera línea nueva: la referencia.
          - con: compas
            traza: 'arco(solucion.K_A, por: solucion.A_4, desde: uno(medir_sobre(perpendicular(por: solucion.A_4, a: solucion.refA), desde: solucion.A_4, distancia: mm(3)), 1), hasta: uno(medir_sobre(perpendicular(por: solucion.A_4, a: solucion.refA), desde: solucion.A_4, distancia: mm(3)), 2))'
            toma: segmento2(figura.punto("A2"), solucion.A_c)
            porque: |
              Lo que A₂ está por encima de la horizontal de C₂, desde la línea nueva, hacia fuera.
          - con: marca
            traza: solucion.A_4
            rotulo: A₄
            porque: |
              A₄, donde el arco corta la perpendicular por A₁.
          - con: compas
            traza: 'arco(solucion.K_B, por: solucion.B_4, desde: uno(medir_sobre(perpendicular(por: solucion.B_4, a: solucion.refB), desde: solucion.B_4, distancia: mm(3)), 1), hasta: uno(medir_sobre(perpendicular(por: solucion.B_4, a: solucion.refB), desde: solucion.B_4, distancia: mm(3)), 2))'
            toma: segmento2(figura.punto("B2"), solucion.B_c)
            porque: |
              Lo que B₂ está por encima de la horizontal de C₂, sobre la perpendicular por B₁.
          - con: marca
            traza: solucion.B_4
            rotulo: B₄
            porque: |
              B₄, donde el arco corta la perpendicular por B₁.
          - con: regla
            traza: segmento2(solucion.C_4, solucion.L_canto)
            porque: |
              El canto, de C₄ por B₄ hasta pasar A₄.
          - con: escuadra-cartabon
            traza: segmento2(solucion.B_4, solucion.L_G)
            guia: solucion.canto
            porque: |
              Por B₄, la perpendicular al canto, hacia fuera, el lado de más cota.
          - con: compas
            traza: 'arco(solucion.B_4, por: solucion.G, desde: uno(medir_sobre(solucion.pi4, desde: solucion.G, distancia: mm(3)), 1), hasta: uno(medir_sobre(solucion.pi4, desde: solucion.G, distancia: mm(3)), 2))'
            porque: |
              Con el compás abierto 20 mm y centro en B₄, el arco que corta esa perpendicular.
          - con: marca
            traza: solucion.G
            rotulo: G
            porque: |
              G, donde el arco corta la perpendicular al canto por B₄.
          - con: escuadra-cartabon
            traza: '[segmento2(solucion.G, solucion.L_piR), segmento2(solucion.G, solucion.L_piP)]'
            guia: solucion.canto
            porque: |
              Por G, la paralela al canto, larga hacia los dos lados: el plano del cuadrado, de canto. Ahí
              caerán también Q₄, R₄ y S₄ a la vuelta.
          - con: marca
            traza: solucion.P_4
            rotulo: P₄
            porque: |
              P₄, donde la perpendicular por P₁ corta la paralela al canto.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("P1"), solucion.L_P2)
            guia: segmento2(figura.punto("A2"), figura.punto("A1"))
            porque: |
              Por P₁, la vertical hasta más arriba del triángulo; corta la horizontal de C₂ en J.
          - con: compas
            traza: 'arco(solucion.J, por: proy_alzado(P), desde: desplaza(proy_alzado(P), dx: mm(-3)), hasta: desplaza(proy_alzado(P), dx: mm(3)))'
            toma: segmento2(solucion.P_4, solucion.K_P)
            porque: |
              Lo que P₄ dista de la primera línea nueva, desde J, hacia arriba por la vertical de P₁.
          - con: marca
            traza: proy_alzado(P)
            rotulo: P₂
            porque: |
              P₂, donde el arco corta la vertical de P₁, por encima del triángulo.
          - con: escuadra-cartabon
            traza: '[segmento2(figura.punto("B1"), solucion.L_pBa), segmento2(figura.punto("B1"), solucion.L_pBb)]'
            guia: figura.segmento("nueva1")
            porque: |
              **El segundo cambio.** En la planta, por B₁, la paralela a la primera línea nueva, larga hacia
              los dos lados: B es la referencia del segundo cambio, y lo que cada planta está más lejos de la
              primera línea que B₁ es su distancia a esta paralela, por su perpendicular.
          - con: escuadra-cartabon
            traza: '[segmento2(solucion.C_4, solucion.L_C5), segmento2(solucion.B_4, solucion.L_B5), segmento2(solucion.P_4, solucion.L_P5)]'
            guia: figura.segmento("nueva2")
            porque: |
              Por C₄, B₄ y P₄, las perpendiculares a la segunda línea nueva, que es paralela al canto, largas,
              más allá de ella.
          - con: marca
            traza: solucion.B_5
            rotulo: B₅
            porque: |
              B₅, donde la perpendicular por B₄ corta la segunda línea nueva: B es la referencia.
          - con: compas
            traza: 'arco(solucion.K2C, por: solucion.C_5, desde: uno(medir_sobre(perpendicular(por: solucion.C_5, a: segmento2(solucion.C_4, solucion.C_5)), desde: solucion.C_5, distancia: mm(3)), 1), hasta: uno(medir_sobre(perpendicular(por: solucion.C_5, a: segmento2(solucion.C_4, solucion.C_5)), desde: solucion.C_5, distancia: mm(3)), 2))'
            toma: segmento2(figura.punto("C1"), solucion.MC)
            porque: |
              Con el compás, de C₁ a la paralela por B₁, por la perpendicular de C₁, y centro donde la
              perpendicular por C₄ corta la segunda línea nueva: hacia fuera.
          - con: marca
            traza: solucion.C_5
            rotulo: C₅
            porque: |
              C₅, donde el arco corta la perpendicular por C₄, por fuera de la segunda línea nueva.
          - con: compas
            traza: 'arco(solucion.K2P, por: solucion.P_5, desde: uno(medir_sobre(perpendicular(por: solucion.P_5, a: solucion.ref5P), desde: solucion.P_5, distancia: mm(3)), 1), hasta: uno(medir_sobre(perpendicular(por: solucion.P_5, a: solucion.ref5P), desde: solucion.P_5, distancia: mm(3)), 2))'
            toma: segmento2(figura.punto("P1"), solucion.MP)
            porque: |
              Lo mismo con P: de P₁ a la paralela por B₁, llevado desde la segunda línea nueva por la
              perpendicular de P₄, hacia fuera.
          - con: marca
            traza: solucion.P_5
            rotulo: P₅
            porque: |
              P₅, donde el arco corta la perpendicular por P₄.
          - con: regla
            traza: solucion.b5c5
            porque: |
              B₅C₅, el lado CB en verdadera magnitud: los dos lados del cuadrado que le son paralelos se
              trazan con esta guía.
          - con: escuadra-cartabon
            traza: '[segmento2(solucion.P_5, solucion.L_Q5), segmento2(solucion.P_5, solucion.L_S5)]'
            guia: solucion.b5c5
            porque: |
              Por P₅, la paralela a B₅C₅, hacia el lado de C₅, y la perpendicular, hacia el lado contrario a
              A₅: los dos lados del cuadrado que salen de P, que bajan.
          - con: compas
            traza: 'arco(solucion.P_5, por: solucion.Q_5, desde: solucion.Q_5, hasta: solucion.S_5)'
            porque: |
              Con el compás abierto 35 mm, el lado del enunciado, y centro en P₅, un cuarto de vuelta, de la
              paralela a la perpendicular.
          - con: marca
            traza: solucion.Q_5
            rotulo: Q₅
            porque: |
              Q₅, donde el arco corta la paralela a B₅C₅ por P₅.
          - con: marca
            traza: solucion.S_5
            rotulo: S₅
            porque: |
              S₅, donde el arco corta la perpendicular a B₅C₅ por P₅.
          - con: escuadra-cartabon
            traza: '[segmento2(solucion.S_5, solucion.L_R5a), segmento2(solucion.Q_5, solucion.L_R5b)]'
            guia: solucion.b5c5
            porque: |
              Por S₅, la paralela a B₅C₅, y por Q₅, la perpendicular: los otros dos lados del cuadrado.
          - con: marca
            traza: solucion.R_5
            rotulo: R₅
            porque: |
              R₅, donde se cortan la paralela por S₅ y la perpendicular por Q₅: P₅Q₅R₅S₅, el cuadrado en
              verdadera magnitud.
          - con: escuadra-cartabon
            traza: '[segmento2(solucion.Q_5, solucion.L_Q4), segmento2(solucion.R_5, solucion.L_R4), segmento2(solucion.S_5, solucion.L_S4)]'
            guia: figura.segmento("nueva2")
            porque: |
              **La vuelta.** Por Q₅, R₅ y S₅, las perpendiculares a la segunda línea nueva, de vuelta a la
              vista 4, hasta pasar la paralela al canto: los tres vértices están en el plano del cuadrado.
          - con: marca
            traza: solucion.Q_4
            rotulo: Q₄
            porque: |
              Q₄, donde la perpendicular por Q₅ corta la paralela al canto.
          - con: marca
            traza: solucion.R_4
            rotulo: R₄
            porque: |
              R₄, donde la perpendicular por R₅ corta la paralela al canto, cerca de su extremo.
          - con: marca
            traza: solucion.S_4
            rotulo: S₄
            porque: |
              S₄, donde la perpendicular por S₅ corta la paralela al canto.
          - con: escuadra-cartabon
            traza: '[segmento2(solucion.Q_4, solucion.L_Q1), segmento2(solucion.R_4, solucion.L_R1), segmento2(solucion.S_4, solucion.L_S1)]'
            guia: figura.segmento("nueva1")
            porque: |
              Por Q₄, R₄ y S₄, las perpendiculares a la primera línea nueva, hacia la planta, largas: cruzan
              la paralela por B₁ y siguen.
          - con: compas
            traza: 'arco(solucion.MQ, por: proy_planta(Q), desde: uno(medir_sobre(perpendicular(por: proy_planta(Q), a: solucion.refQ), desde: proy_planta(Q), distancia: mm(3)), 1), hasta: uno(medir_sobre(perpendicular(por: proy_planta(Q), a: solucion.refQ), desde: proy_planta(Q), distancia: mm(3)), 2))'
            toma: segmento2(solucion.Q_5, solucion.K2Q)
            porque: |
              Con el compás, lo que Q₅ dista de la segunda línea nueva, y centro donde la perpendicular por
              Q₄ corta la paralela por B₁: hacia la planta.
          - con: marca
            traza: proy_planta(Q)
            rotulo: Q₁
            porque: |
              Q₁, donde el arco corta la perpendicular que vuelve de Q₄.
          - con: compas
            traza: 'arco(solucion.MR, por: proy_planta(R), desde: uno(medir_sobre(perpendicular(por: proy_planta(R), a: solucion.refR), desde: proy_planta(R), distancia: mm(3)), 1), hasta: uno(medir_sobre(perpendicular(por: proy_planta(R), a: solucion.refR), desde: proy_planta(R), distancia: mm(3)), 2))'
            toma: segmento2(solucion.R_5, solucion.K2R)
            porque: |
              Lo mismo con R: lo que R₅ dista de la segunda línea nueva, desde la paralela por B₁.
          - con: marca
            traza: proy_planta(R)
            rotulo: R₁
            porque: |
              R₁, donde el arco corta la perpendicular que vuelve de R₄, por encima de C₁B₁.
          - con: compas
            traza: 'arco(solucion.MS, por: proy_planta(S), desde: uno(medir_sobre(perpendicular(por: proy_planta(S), a: solucion.refS), desde: proy_planta(S), distancia: mm(3)), 1), hasta: uno(medir_sobre(perpendicular(por: proy_planta(S), a: solucion.refS), desde: proy_planta(S), distancia: mm(3)), 2))'
            toma: segmento2(solucion.S_5, solucion.K2S)
            porque: |
              Y con S: lo que S₅ dista de la segunda línea nueva, desde la paralela por B₁.
          - con: marca
            traza: proy_planta(S)
            rotulo: S₁
            porque: |
              S₁, donde el arco corta la perpendicular que vuelve de S₄.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(Q), solucion.L_Q2), segmento2(proy_planta(R), solucion.L_R2), segmento2(proy_planta(S), solucion.L_S2)]'
            guia: segmento2(figura.punto("A2"), figura.punto("A1"))
            porque: |
              Por Q₁, R₁ y S₁, las verticales hasta el alzado, por encima del triángulo.
          - con: compas
            traza: 'arco(solucion.JS, por: proy_alzado(S), desde: desplaza(proy_alzado(S), dx: mm(-3)), hasta: desplaza(proy_alzado(S), dx: mm(3)))'
            toma: segmento2(solucion.S_4, solucion.K1S)
            porque: |
              Con el compás, lo que S₄ dista de la primera línea nueva, y centro donde la vertical de S₁ corta
              la horizontal de C₂: hacia arriba.
          - con: marca
            traza: proy_alzado(S)
            rotulo: S₂
            porque: |
              S₂, donde el arco corta la vertical de S₁.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_alzado(P), solucion.L_Q2p), segmento2(proy_alzado(S), solucion.L_R2p)]'
            guia: figura.segmento("BC2")
            porque: |
              Por P₂ y por S₂, las paralelas a C₂B₂ hacia la izquierda: PQ y SR son paralelos a CB, y sus
              alzados lo son a C₂B₂.
          - con: marca
            traza: proy_alzado(Q)
            rotulo: Q₂
            porque: |
              Q₂, donde la vertical de Q₁ corta la paralela a C₂B₂ por P₂.
          - con: marca
            traza: proy_alzado(R)
            rotulo: R₂
            porque: |
              R₂, donde la vertical de R₁ corta la paralela a C₂B₂ por S₂, dentro del alzado del triángulo.
          - con: arista-vista
            traza: '[segmento2(proy_planta(P), proy_planta(Q)), segmento2(proy_planta(Q), proy_planta(R)), segmento2(proy_planta(R), proy_planta(S)), segmento2(proy_planta(S), proy_planta(P)), segmento2(figura.punto("C1"), solucion.y_QR1), segmento2(solucion.y_SP1, figura.punto("B1"))]'
            porque: |
              **A limpio, la planta.** El cuadrado está por encima del triángulo y se ve entero, y C₁B₁ se ve
              hasta que entra debajo de él y desde que sale.
          - con: arista-oculta
            traza: segmento2(solucion.y_QR1, solucion.y_SP1)
            porque: |
              A trazos, el trozo de C₁B₁ que queda debajo del cuadrado, de Q₁R₁ a S₁P₁.
          - con: arista-vista
            traza: '[segmento2(proy_alzado(P), proy_alzado(Q)), segmento2(proy_alzado(Q), solucion.x_QR2), segmento2(solucion.x_RS2, proy_alzado(S)), segmento2(proy_alzado(S), proy_alzado(P))]'
            porque: |
              **El alzado.** En continua, lo que del cuadrado queda fuera del alzado del triángulo.
          - con: arista-oculta
            traza: '[segmento2(solucion.x_QR2, proy_alzado(R)), segmento2(proy_alzado(R), solucion.x_RS2)]'
            porque: |
              A trazos, lo que queda dentro: el cuadrado está detrás del triángulo, que lo tapa, de A₂C₂ a
              R₂ y de R₂ a A₂B₂.
        pista: |
          (1) Como en el paso anterior, el canto, la paralela a 20 mm y P₄. (2) La paralela a la primera
          línea nueva por B₁; C₅ y P₅, hacia fuera, lo que C₁ y P₁ distan de ella. (3) Desde P₅, 35 mm
          paralelos a B₅C₅ hacia C₅ y 35 mm perpendiculares, lejos de A₅: Q₅ y S₅; R₅ cierra. (4) De vuelta,
          a la paralela al canto; a la planta, desde la paralela por B₁, lo que cada punto dista de la
          segunda línea nueva; al alzado, S₂ con su cota, y Q₂ y R₂ en las paralelas a C₂B₂.
        desarrollo: |
          En verde claro, el cuadrado en verdadera magnitud en la vista 5 y en la paralela al canto de la
          vista 4, y sus dos proyecciones. En la planta se ve entero, por encima del triángulo, y tapa un
          trozo de C₁B₁. En el alzado queda detrás del triángulo, y se ve lo que cae fuera de él: Q₂R₂ y
          R₂S₂ van a trazos dentro.

      - tipo: calcular
        titulo: Lo que P está más alto que el plano
        pregunta: ¿Cuánto más alto está P que el punto del plano ABC que tiene su misma planta?
        respuesta:
          tipo: numero
          valor: '26.06'
          receta: subida_mm
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '20.00'
            receta: en_mm(distancia_a_plano(P, abc))
            mensaje: |
              20 mm es la distancia de P al plano, por la perpendicular. La vertical no es esa
              perpendicular: el plano forma 39,9° con el horizontal, y en vertical la distancia sale mayor.
              Con la otra lectura del enunciado, «20 mm en vertical», sí saldrían 20.
          - valor: '15.35'
            receta: en_mm(distancia_a_plano(Pv, abc))
            mensaje: |
              Has multiplicado los 20 mm por el coseno de 39,9° en vez de dividir. La vertical por P es la
              hipotenusa del triángulo que forma con la perpendicular al plano, y es mayor que ella.
          - valor: '43.31'
            receta: en_mm(diferencia_de_cotas(P, C))
            mensaje: |
              Eso es lo que P₄ dista de la línea nueva: lo que P está más alto que C, la referencia, no que el
              plano en su vertical.
        pista: |
          En la vista 4, la perpendicular a la línea nueva por P₁ es la vertical de P: mide en ella de P₄ al
          canto. O en el alzado, de P₂ al punto del plano en su vertical.
        desarrollo: |
          En la vista 4, la vertical de P es la perpendicular a la línea nueva, y la distancia al plano, la
          perpendicular al canto, que forma 39,9° con ella:

          $$ \Delta z = \frac{20}{\cos 39{,}86^\circ} \approx 26{,}06 \text{ mm} $$

          En el alzado sale lo mismo: de P₂ al punto del plano en su vertical hay 26,06 mm.
      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: El cuadrado está en el plano paralelo a ABC por P, a 20 mm de ABC por la perpendicular.
          - texto: Con ABC de canto, ese plano es la paralela al canto a 20 mm, del lado de más cota, y P₄ está en ella.
          - texto: En un segundo cambio, paralelo al canto, los dos planos están en verdadera magnitud, y el cuadrado se dibuja desde P₅ con un lado paralelo a B₅C₅.
          - texto: Los dos lados que salen de P bajan, hacia C y lejos de A, porque P es el vértice de mayor cota; un solo cuadrado cumple.
          - texto: Como el cuadrado es paralelo a ABC, está dentro del plano ABC y P₂ cae en el triángulo.
            trampa: true
            mensaje: |
              Paralelo a ABC no es dentro de ABC: el cuadrado está en un plano paralelo, 20 mm por encima, y
              P₂ queda por encima del triángulo.
    resolucion: |
      **La lectura.** «20 mm por encima del plano» es una distancia entre planos: el cuadrado está en el
      plano paralelo a ABC a 20 mm, medidos por la perpendicular, hacia donde sube la cota. P es uno de
      sus vértices y el de mayor cota, y dos lados son paralelos a CB: los que salen de P son uno paralelo
      a CB, hacia C, que es más bajo que B, y otro perpendicular, hacia el lado contrario a A, el vértice
      más alto. Un solo cuadrado.

      **P₂.** Con la línea nueva perpendicular a las horizontales del plano y C de referencia, ABC sale de
      canto. La paralela al canto a 20 mm, hacia fuera, es el plano del cuadrado; la perpendicular a la
      línea nueva por P₁ la corta en P₄, a 43,31 mm de la línea: P₂ está 43,31 mm por encima de la
      horizontal de C₂, y 26,06 mm por encima del punto del plano en su vertical.

      **El cuadrado.** Un segundo cambio, con la línea nueva paralela al canto y B de referencia, pone los
      dos planos en verdadera magnitud. Desde P₅, 35 mm paralelos a B₅C₅ hacia C₅ dan Q₅, y 35 mm
      perpendiculares, lejos de A₅, S₅; R₅ cierra el cuadrado. De vuelta, cada vértice va a la paralela
      al canto, a la planta y al alzado; Q₂ y R₂ caen en las paralelas a C₂B₂ por P₂ y por S₂. Q está
      5,30 mm por debajo de P, S 21,80 y R 27,09.

      **Lo que se ve.** En la planta el cuadrado está por encima del triángulo: se ve entero, y tapa el
      trozo de C₁B₁ que pasa debajo. En el alzado está detrás: el triángulo tapa lo que del cuadrado cae
      dentro de él, la mitad de Q₂R₂ y casi todo R₂S₂.

      **Con la otra lectura**, 20 mm en vertical, P₂ quedaría 6,06 mm más abajo, el plano del cuadrado a
      15,35 mm de ABC, y el cuadrado, con la misma planta, 6,06 mm más abajo en el alzado.

  - id: sd51-la-piramide-recta-de-base-rectangular
    titulo: La pirámide recta de base rectangular, con el vértice en el plano α
    fuente: Ejercicio 36 (SD51) · Colección de ejercicios de Geometría Descriptiva, Sistema Diédrico Directo · Dpto. de Expresión Gráfica y Proyectos de Ingeniería, EIG · UPV/EHU
    nivel: practica
    # Decisión: el texto impreso tal cual, cotejado con la página (pág. 37),
    # con su «segmento AB» aunque la figura rotule B y C: es una errata de la
    # hoja, y se señala en las Notas nuestras sin corregir el enunciado (§08).
    # Los nombres D, E, F y V son nuestros; A no se usa.
    enunciado: |
      Dibujar las proyecciones diédricas de una pirámide recta. Datos: la base es rectangular de centro el punto O y uno de los lados es el segmento AB. El vértice que define la altura de la pirámide se sitúa en el plano α.

      **Notas nuestras.** La figura son el alzado, arriba, y la planta, debajo: el punto O, el
      segmento BC y la recta α₂, horizontal en el papel. **La figura rotula B y C, no A y B**: el lado
      dado es BC, y el «AB» del enunciado es una errata de la hoja, que se deja como está impresa. A
      ningún vértice lo llamamos A, para no confundirlo. B₂C₂ es horizontal: BC es una recta
      horizontal, y su planta, B₁C₁, está en verdadera magnitud (49,70 mm). α₂ es una recta horizontal
      del papel sin planta: α es un plano horizontal, que el alzado ve de canto. Llamamos D y E a los
      otros dos vértices de la base, D el opuesto a B y E el opuesto a C, así que la base es BCDE; V al
      vértice de la pirámide, y F al punto de BC que usa la construcción. La lámina no da escala: se
      mide en el papel, en milímetros. Con las cruces de la página, O no queda exactamente a la misma
      distancia de B que de C: está 0,66 mm corrido hacia C a lo largo de BC, y los datos no cierran un
      rectángulo exacto. Hay dos lecturas razonables. La que construimos toma O como centro, tal cual: D
      y E son los simétricos de B y de C respecto de O, y la base sale con ángulos de 91,7° y 88,3°; en
      la planta, C₁D₁ forma 92,7° con B₁C₁, y no 90°. La otra es el rectángulo exacto de lado BC: como BC
      es horizontal, su planta es un rectángulo, con C₁D₁ y B₁E₁ perpendiculares a B₁C₁, y su centro
      queda 0,66 mm corrido de O. Con ella, D₁ y E₁ caen 1,3 mm corridos en la dirección de C₁B₁, fuera
      de la tolerancia, y D₂, E₂ y V se mueven 0,7 mm como mucho. El Taller construye con la primera: si
      marcas el rectángulo exacto, te lo dice.
    pide: Las proyecciones de los vértices D y E de la base y del vértice V, con la frontal por O que hace falta para trazar la altura; la pirámide pasada a limpio con lo visto y lo oculto; y, como pregunta nuestra, la altura en verdadera magnitud.
    receta:
      lamina: sd51
      escena:
        B: 'punto3(alzado: figura.punto("B2"), planta: figura.punto("B1"))'
        C: 'punto3(alzado: figura.punto("C2"), planta: figura.punto("C1"))'
        O: 'punto3(alzado: figura.punto("O2"), planta: figura.punto("O1"))'
        base: plano(B, C, O)
        # α, el plano horizontal de α₂: tres puntos suyos, con las x de los
        # extremos de α₂ y plantas cualesquiera.
        alfa_i: 'punto3(alzado: figura.punto("Ai"), planta: desplaza(figura.punto("Ai"), dy: 400))'
        alfa_d: 'punto3(alzado: figura.punto("Ad"), planta: desplaza(figura.punto("Ad"), dy: 400))'
        alfa_f: 'punto3(alzado: figura.punto("Ai"), planta: desplaza(figura.punto("Ai"), dy: 500))'
        alfa: plano(alfa_i, alfa_d, alfa_f)
      solucion:
        # La base: O es su centro, así que cada vértice tiene su opuesto en el
        # simétrico respecto de O. Las proyecciones conservan los puntos
        # medios: D₁ y E₁ son los simétricos de B₁ y C₁ respecto de O₁.
        D: 'simetrico(B, respecto: O)'
        E: 'simetrico(C, respecto: O)'
        # La otra lectura, el rectángulo exacto de lado BC: su centro es O
        # llevado a la mediatriz de BC (0,66 mm a lo largo de BC), y D₁ y E₁
        # caen 1,3 mm en la dirección de C₁B₁. Se reconoce, no se acepta: los
        # tramos van a los D y E de la primera lectura.
        O_rect: pie_en_plano(O, plano_mediador(B, C))
        D_rect: 'simetrico(B, respecto: O_rect)'
        E_rect: 'simetrico(C, respecto: O_rect)'
        # El vértice: en la perpendicular a la base por su centro (la pirámide
        # es recta), donde corta α. Queda por debajo de la base.
        eje: perpendicular_a_plano(O, base)
        V: corte_recta_plano(eje, alfa)
        altura_mm: en_mm(vm(O, V))
        # La construcción en el papel. BC es horizontal: la planta de la
        # perpendicular es perpendicular a B₁C₁. La frontal por O: la
        # horizontal del papel por O₁ corta B₁C₁ en F₁, que sube a B₂C₂; el
        # alzado de la perpendicular es perpendicular a F₂O₂.
        hor1: 'perpendicular(por: figura.punto("O1"), a: segmento2(figura.punto("O1"), figura.punto("O2")))'
        F_1: 'cruce_aparente(hor1, figura.segmento("BC1"))'
        F_2: 'cruce_aparente(perpendicular(por: F_1, a: hor1), figura.segmento("BC2"))'
        f2: 'segmento2(F_2, figura.punto("O2"))'
        eje2: 'perpendicular(por: figura.punto("O2"), a: f2)'
        eje1: 'perpendicular(por: figura.punto("O1"), a: figura.segmento("BC1"))'
        BO1: 'segmento2(figura.punto("B1"), figura.punto("O1"))'
        BO2: 'segmento2(figura.punto("B2"), figura.punto("O2"))'
        CO1: 'segmento2(figura.punto("C1"), figura.punto("O1"))'
        CO2: 'segmento2(figura.punto("C2"), figura.punto("O2"))'
        # Los errores. El alzado de la altura trazado en vertical
        # (perpendicular a B₂C₂, que es horizontal) o perpendicular a B₂O₂; V₁
        # en la horizontal de O₁, como si la altura fuera frontal, o con su
        # planta perpendicular a O₁B₁.
        V2_vertical: 'cruce_aparente(CO2, figura.segmento("alfa2"))'
        V2_BO: 'cruce_aparente(perpendicular(por: figura.punto("O2"), a: BO2), figura.segmento("alfa2"))'
        vV: 'segmento2(proy_alzado(V), proy_planta(V))'
        V1_hor: cruce_aparente(hor1, vV)
        V1_BO: 'cruce_aparente(perpendicular(por: figura.punto("O1"), a: BO1), vV)'
        # Los extremos de las rectas largas de la construcción.
        L_D1: 'uno(medir_sobre(BO1, desde: proy_planta(D), distancia: mm(4)), 1)'
        L_E1: 'uno(medir_sobre(CO1, desde: proy_planta(E), distancia: mm(4)), 1)'
        L_vD: 'desplaza(proy_alzado(D), dy: mm(-4))'
        L_D2: 'uno(medir_sobre(BO2, desde: proy_alzado(D), distancia: mm(4)), 1)'
        L_E2: 'desplaza(proy_alzado(E), dy: mm(-4))'
        L_hE: 'desplaza(proy_alzado(E), dx: mm(-4))'
        L_F1: 'desplaza(F_1, dx: mm(-4))'
        L_vF: 'desplaza(F_2, dy: mm(-4))'
        L_alfa: 'desplaza(proy_alzado(V), dx: mm(4))'
        L_e2: 'uno(medir_sobre(eje2, desde: proy_alzado(V), distancia: mm(4)), 1)'
        L_e1: 'uno(medir_sobre(eje1, desde: proy_planta(V), distancia: mm(4)), 2)'
        L_vV: 'desplaza(proy_planta(V), dy: mm(4))'
      comprueba:
        - en_plano(D, base)
        - en_plano(E, base)
        - en_recta(V, eje)
        - en_plano(V, alfa)
    pasos:
      - tipo: reconocer
        pregunta: La pirámide es recta, y el vértice V está en el plano α. ¿Dónde está V?
        opciones:
          - texto: En la vertical de O, a la altura de α₂, porque la altura de una pirámide recta se mide en vertical
            mensaje: |
              La altura de una pirámide recta es la perpendicular **a su base** por el centro, y la base no es
              horizontal: sube de BC hacia DE. La vertical por O solo sería la altura si la base fuera
              horizontal. Aquí V₂ cae 43,8 mm a la derecha de la vertical de O₂.
          - texto: En la perpendicular a la base por O, donde corta α, que el alzado ve de canto en α₂
            correcta: true
            mensaje: |
              Eso es. En una pirámide recta el vértice está en la perpendicular a la base por su centro. Se
              traza con la regla de siempre: la planta, perpendicular a B₁C₁, porque BC es horizontal; el
              alzado, perpendicular al de una frontal de la base. α es horizontal, y su alzado α₂ es una
              recta: donde la corta el alzado de la perpendicular está V₂.
          - texto: En la perpendicular a BC por O, en el alzado perpendicular a B₂C₂ y en la planta a B₁C₁
            mensaje: |
              La planta va bien, perpendicular a B₁C₁, pero el alzado no: perpendicular a B₂C₂ es la
              vertical, y BC, que es horizontal, solo deja ver el ángulo recto en la planta. Para el alzado
              hace falta una frontal de la base. Y de rectas perpendiculares a BC por O hay muchas: la altura
              es la única perpendicular a toda la base.

      # Decisión: un solo paso construir, como la 55·2: la base, el vértice y
      # la visibilidad. D y E salen por simetría respecto de O en cada vista,
      # sin verdadera magnitud; V, con la frontal por O, que el intro fija.
      - tipo: construir
        titulo: La base, el vértice y lo que se ve
        intro: |
          O es el centro del rectángulo, así que cada vértice tiene su opuesto al otro lado de O, a la
          misma distancia: D, el opuesto a B, y E, el opuesto a C. Las proyecciones conservan los puntos
          medios, y eso se hace en cada vista con la regla y el compás. Marca D₁, E₁, D₂ y E₂. Después,
          la altura: la perpendicular a la base por O. BC es horizontal, y su planta da la de la
          perpendicular. Para el alzado hace falta una frontal de la base: trázala por O, con la planta
          horizontal en el papel, hasta B₁C₁, en F, y súbela. α es horizontal y el alzado lo ve de canto
          en α₂: prolóngala hacia la derecha, porque V₂ cae más allá de su extremo. Marca V₂ y V₁. Por
          último, pasa la pirámide a limpio con «arista vista» y «arista oculta», en las dos vistas: V
          queda por debajo de la base. B₁C₁ y B₂C₂ se ven enteras y ya están dibujadas.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, visto, oculto, borrar]
        tolerancia: 1
        objetivos:
          - nombre: D1
            pide: el vértice D, el opuesto a B, en la planta
            es: proy_planta(D)
            bien: |
              D₁ está en la prolongación de B₁O₁, a O₁B₁ de O₁: O₁ es el punto medio de B₁D₁, porque la
              planta conserva los puntos medios.
            diagnosticos:
              - si: cerca_de(proy_planta(E))
                mensaje: |
                  Ese es E, el opuesto a **C**: está en la prolongación de C₁O₁. D es el opuesto a B, en la
                  prolongación de B₁O₁.
                ejemplo: proy_planta(E)
              - si: cerca_de(proy_planta(D_rect))
                mensaje: |
                  Has dibujado el **rectángulo exacto** de lado BC, con C₁D₁ perpendicular a B₁C₁: es la otra
                  lectura de las Notas, y la geometría es buena. Pero la hoja tiene O corrido 0,66 mm de la
                  mediatriz de BC, y aquí se construye con O como centro, tal cual: D₁ va en la prolongación
                  de B₁O₁, a O₁B₁ de O₁, a 1,3 mm de donde lo has puesto.
                ejemplo: proy_planta(D_rect)
              - si: '!en_recta(solucion.BO1)'
                mensaje: |
                  D es el opuesto a B, al otro lado del centro: D₁ va en la **prolongación de B₁O₁**, más
                  allá de O₁.
                ejemplo: 'desplaza(proy_planta(D), dx: mm(5))'
              - si: siempre
                mensaje: |
                  Estás en la prolongación de B₁O₁, pero no a la distancia buena: con centro en O₁ y radio
                  O₁B₁, el arco la corta en D₁.
          - nombre: E1
            pide: el vértice E, el opuesto a C, en la planta
            es: proy_planta(E)
            bien: |
              E₁ está en la prolongación de C₁O₁, que es vertical en el papel, a O₁C₁ por encima de O₁.
            diagnosticos:
              - si: cerca_de(proy_planta(D))
                mensaje: |
                  Ese es D, el opuesto a B. E es el opuesto a **C**: en la prolongación de C₁O₁, hacia
                  arriba.
                ejemplo: proy_planta(D)
              - si: cerca_de(proy_planta(E_rect))
                mensaje: |
                  Has dibujado el **rectángulo exacto** de lado BC, con B₁E₁ perpendicular a B₁C₁: es la otra
                  lectura de las Notas, y la geometría es buena. Pero la hoja tiene O corrido 0,66 mm de la
                  mediatriz de BC, y aquí se construye con O como centro, tal cual: E₁ va en la prolongación
                  de C₁O₁, a O₁C₁ de O₁, a 1,3 mm de donde lo has puesto.
                ejemplo: proy_planta(E_rect)
              - si: '!en_recta(solucion.CO1)'
                mensaje: |
                  E es el opuesto a C: E₁ va en la **prolongación de C₁O₁**, más allá de O₁, que aquí es
                  vertical en el papel.
                ejemplo: 'desplaza(proy_planta(E), dx: mm(5))'
              - si: siempre
                mensaje: |
                  Estás en la prolongación de C₁O₁, pero no a la distancia buena: con centro en O₁ y radio
                  O₁C₁, el arco la corta en E₁.
          - nombre: D2
            pide: el vértice D, en el alzado
            es: proy_alzado(D)
            bien: |
              D₂ está en la vertical de D₁ y en la prolongación de B₂O₂: también en el alzado O₂ es el punto
              medio de B₂D₂.
            diagnosticos:
              - si: '!en_vertical_de(D1)'
                mensaje: |
                  D₂ va en la **vertical de D₁**: son el mismo punto visto dos veces.
                ejemplo: 'uno(medir_sobre(solucion.BO2, desde: proy_alzado(D), distancia: mm(5)), 1)'
              - si: '!en_recta(solucion.BO2)'
                mensaje: |
                  Estás en la vertical de D₁, pero no en la **prolongación de B₂O₂**: D es el simétrico de B
                  respecto de O, y eso se ve también en el alzado.
                ejemplo: 'desplaza(proy_alzado(D), dy: mm(5))'
              - si: siempre
                mensaje: |
                  D₂ está donde la vertical de D₁ corta la prolongación de B₂O₂.
          - nombre: E2
            pide: el vértice E, en el alzado
            es: proy_alzado(E)
            bien: |
              E₂ está en la prolongación de C₂O₂, a la altura de D₂: DE es el lado opuesto a BC, y es
              horizontal como él.
            diagnosticos:
              - si: '!en_vertical_de(E1)'
                mensaje: |
                  E₂ va en la **vertical de E₁**, que es la misma recta que C₂O₂.
                ejemplo: 'desplaza(proy_alzado(E), dx: mm(5))'
              - si: siempre
                mensaje: |
                  Estás en la vertical de E₁, pero no a la altura buena. DE es paralelo a BC, y BC es
                  horizontal: E₂ está a la altura de D₂, en la horizontal que pasa por él.
          - nombre: V2
            pide: el vértice V de la pirámide, en el alzado
            es: proy_alzado(V)
            bien: |
              V₂ está en α₂, prolongada, donde la corta la perpendicular a F₂O₂ por O₂: el alzado de la
              altura, perpendicular al de la frontal.
            diagnosticos:
              - si: cerca_de(solucion.V2_vertical)
                mensaje: |
                  Has bajado **en vertical** desde O₂, perpendicular a B₂C₂. BC es horizontal, y contra ella
                  va la planta de la altura, no el alzado. El alzado va perpendicular a **f₂**, el alzado de
                  la frontal F₂O₂.
                ejemplo: solucion.V2_vertical
              - si: cerca_de(solucion.V2_BO)
                mensaje: |
                  Has trazado el alzado de la altura perpendicular a **B₂O₂**. BO no es frontal, y el ángulo
                  recto con ella no se ve en el alzado: hace falta una frontal de la base, F₂O₂.
                ejemplo: solucion.V2_BO
              - si: '!en_recta(figura.segmento("alfa2"))'
                mensaje: |
                  V está en **α**, que es horizontal y el alzado ve de canto: V₂ va en α₂, prolongada hacia
                  la derecha.
                ejemplo: 'uno(medir_sobre(solucion.eje2, desde: proy_alzado(V), distancia: mm(6)), 1)'
              - si: siempre
                mensaje: |
                  Estás en α₂, pero no en el alzado de la altura. Traza por O₂ la perpendicular a F₂O₂, la
                  frontal, y córtala con α₂ prolongada.
          - nombre: V1
            pide: el vértice V, en la planta
            es: proy_planta(V)
            bien: |
              V₁ está en la vertical de V₂, sobre la perpendicular a B₁C₁ por O₁: la planta de la altura.
            diagnosticos:
              - si: cerca_de(solucion.V1_hor)
                mensaje: |
                  Has dejado V₁ en la **horizontal de O₁**, como si la altura fuera frontal. No lo es: su
                  planta es perpendicular a B₁C₁, la de la horizontal BC, y sube hacia la derecha.
                ejemplo: solucion.V1_hor
              - si: cerca_de(solucion.V1_BO)
                mensaje: |
                  Has trazado la planta de la altura perpendicular a **O₁B₁**. BO no es horizontal, y el
                  ángulo recto con ella no se ve en la planta: la planta va perpendicular a B₁C₁, porque BC
                  es horizontal.
                ejemplo: solucion.V1_BO
              - si: '!en_vertical_de(V2)'
                mensaje: |
                  V₁ va en la **vertical de V₂**: es el mismo punto visto desde arriba.
                ejemplo: 'uno(medir_sobre(solucion.eje1, desde: proy_planta(V), distancia: mm(5)), 1)'
              - si: siempre
                mensaje: |
                  V₁ está donde la perpendicular a B₁C₁ por O₁ corta la vertical de V₂.
        # Decisión: la base y las caras son opacas, la planta se mira desde
        # arriba y el alzado desde delante (+y, el lado de la planta que queda
        # abajo en el papel), como en el resto del sitio. La visibilidad sale
        # de un cálculo de líneas ocultas aparte, por rayos contra las cinco
        # caras: ninguna arista cambia de visibilidad a medio camino.
        tramos:
          - traza: segmento2(figura.punto("C1"), proy_planta(D))
            tipo: visto
            porque: 'La base mira hacia arriba (sube de BC a DE) y V queda por debajo de ella: desde arriba nada tapa sus lados. C₁D₁ es además contorno de la planta.'
          - traza: segmento2(proy_planta(D), proy_planta(E))
            tipo: visto
            porque: 'DE es un lado de la base, que mira hacia arriba: desde arriba nada lo tapa.'
          - traza: segmento2(proy_planta(E), figura.punto("B1"))
            tipo: visto
            porque: 'EB es un lado de la base, y contorno de la planta: desde arriba nada lo tapa.'
          - traza: segmento2(proy_planta(V), proy_planta(D))
            tipo: visto
            porque: 'VD es contorno de la planta: V₁ cae fuera de la base, y de V₁ salen hacia D₁ y E₁ las dos aristas que la cierran. Nada la tapa desde arriba.'
          - traza: segmento2(proy_planta(V), proy_planta(E))
            tipo: visto
            porque: 'VE es contorno de la planta, como VD: desde arriba nada la tapa.'
          - traza: segmento2(proy_planta(V), figura.punto("B1"))
            tipo: oculto
            porque: 'VB va por debajo de la base, que mira hacia arriba, y de la cara VDE: su planta cae dentro del contorno, y desde arriba la tapan.'
          - traza: segmento2(proy_planta(V), figura.punto("C1"))
            tipo: oculto
            porque: 'VC va por debajo de la base y de la cara VDE, como VB: desde arriba la tapan.'
          - traza: segmento2(figura.punto("C2"), proy_alzado(D))
            tipo: visto
            porque: 'La base mira hacia delante (sube y se aleja de BC a DE, con V detrás y debajo): en el alzado nada tapa sus lados.'
          - traza: segmento2(proy_alzado(D), proy_alzado(E))
            tipo: visto
            porque: 'DE es un lado de la base, y contorno del alzado: nada lo tapa por delante.'
          - traza: segmento2(proy_alzado(E), figura.punto("B2"))
            tipo: visto
            porque: 'EB es un lado de la base, y contorno del alzado: nada lo tapa por delante.'
          - traza: segmento2(proy_alzado(V), figura.punto("B2"))
            tipo: visto
            porque: 'VB es contorno del alzado, de B₂ a V₂: nada la tapa por delante.'
          - traza: segmento2(proy_alzado(V), proy_alzado(D))
            tipo: visto
            porque: 'VD es contorno del alzado, de D₂ a V₂: nada la tapa por delante.'
          - traza: segmento2(proy_alzado(V), figura.punto("C2"))
            tipo: visto
            porque: 'VC separa las caras VBC y VCD, que miran las dos hacia delante: su alzado cae dentro del contorno, pero nada la tapa.'
          - traza: segmento2(proy_alzado(V), proy_alzado(E))
            tipo: oculto
            porque: 'VE va por detrás de la base, que mira hacia delante, y de la cara VCD: su alzado cae dentro del contorno, y las dos la tapan.'
        construccion:
          - con: regla
            traza: segmento2(figura.punto("B1"), solucion.L_D1)
            porque: |
              **La base.** O es el centro del rectángulo: D, el vértice opuesto a B, está al otro lado de O y
              a la misma distancia. En la planta, la recta de B₁ por O₁, prolongada más allá de O₁.
          - con: compas
            traza: 'arco(figura.punto("O1"), por: proy_planta(D), desde: desplaza(proy_planta(D), dx: -4, dy: 3), hasta: desplaza(proy_planta(D), dx: 4, dy: -3))'
            toma: segmento2(figura.punto("O1"), figura.punto("B1"))
            porque: |
              Con centro en O₁ y radio O₁B₁, el arco al otro lado de O₁, sobre la prolongación: la planta
              conserva los puntos medios, y O₁ es el de B₁D₁.
          - con: marca
            traza: proy_planta(D)
            rotulo: D₁
            porque: |
              D₁, nombre nuestro, donde el arco corta la prolongación de B₁O₁.
          - con: regla
            traza: segmento2(figura.punto("C1"), solucion.L_E1)
            porque: |
              Lo mismo con C: la recta de C₁ por O₁, que sale vertical en el papel, prolongada hacia arriba,
              más allá de O₁.
          - con: compas
            traza: 'arco(figura.punto("O1"), por: proy_planta(E), desde: desplaza(proy_planta(E), dx: -5, dy: 0.3), hasta: desplaza(proy_planta(E), dx: 5, dy: 0.3))'
            toma: segmento2(figura.punto("O1"), figura.punto("C1"))
            porque: |
              Con centro en O₁ y radio O₁C₁, el arco por encima de O₁, sobre la prolongación.
          - con: marca
            traza: proy_planta(E)
            rotulo: E₁
            porque: |
              E₁, nombre nuestro, donde el arco corta la prolongación de C₁O₁.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(D), solucion.L_vD)
            porque: |
              Por D₁, la vertical hasta el alzado, más arriba que O₂: D₂ estará en ella.
          - con: regla
            traza: segmento2(figura.punto("B2"), solucion.L_D2)
            porque: |
              En el alzado, la recta de B₂ por O₂, prolongada hasta pasar la vertical de D₁: también aquí
              O₂ es el punto medio de B₂D₂.
          - con: marca
            traza: proy_alzado(D)
            rotulo: D₂
            porque: |
              D₂, donde la vertical de D₁ corta la prolongación de B₂O₂.
          - con: regla
            traza: segmento2(figura.punto("C2"), solucion.L_E2)
            porque: |
              La recta de C₂ por O₂, prolongada hacia arriba: es vertical en el papel, y es también la
              vertical de E₁. E₂ está en ella.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(D), solucion.L_hE)
            guia: figura.segmento("BC2")
            porque: |
              Por D₂, la paralela a B₂C₂, hacia la izquierda, hasta pasar la recta de C₂O₂: DE es el lado
              opuesto a BC, paralelo a él, y BC es horizontal.
          - con: marca
            traza: proy_alzado(E)
            rotulo: E₂
            porque: |
              E₂, donde la horizontal de D₂ corta la prolongación de C₂O₂. O₂ queda en el punto medio de
              C₂E₂, como debe.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("O1"), solucion.L_F1)
            guia: figura.segmento("BC2")
            rotulo: f₁
            porque: |
              **La altura.** Es la perpendicular a la base por O. Para su alzado hace falta una frontal de la
              base, y ninguno de los lados lo es: se traza por O. Su planta es horizontal en el papel: por
              O₁, la paralela a B₂C₂, hacia la izquierda, hasta pasar B₁C₁.
          - con: marca
            traza: solucion.F_1
            rotulo: F₁
            porque: |
              F₁, nombre nuestro, donde f₁ corta B₁C₁: el punto de BC con el alejamiento de O.
          - con: escuadra-cartabon
            traza: segmento2(solucion.F_1, solucion.L_vF)
            porque: |
              Por F₁, la vertical hasta pasar B₂C₂: F está en BC.
          - con: marca
            traza: solucion.F_2
            rotulo: F₂
            porque: |
              F₂, donde la vertical de F₁ corta B₂C₂.
          - con: regla
            traza: solucion.f2
            rotulo: f₂
            porque: |
              f₂, de F₂ a O₂: el alzado de la frontal, que el alzado enseña en verdadera magnitud.
          - con: regla
            traza: segmento2(figura.punto("Ad"), solucion.L_alfa)
            porque: |
              α₂, prolongada hacia la derecha con la regla: α es un plano horizontal, y el alzado lo ve de
              canto en esa recta entera, no solo en el trozo dibujado.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("O2"), solucion.L_e2)
            guia: solucion.f2
            porque: |
              Por O₂, la perpendicular a f₂, hacia abajo a la derecha, hasta pasar α₂: el alzado de la
              altura. El ángulo recto con la frontal se ve recto en el alzado.
          - con: marca
            traza: proy_alzado(V)
            rotulo: V₂
            porque: |
              V₂, nombre nuestro, donde el alzado de la altura corta α₂ prolongada: V está en α, por debajo
              de la base.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("O1"), solucion.L_e1)
            guia: figura.segmento("BC1")
            porque: |
              Por O₁, la perpendicular a B₁C₁, hacia arriba a la derecha, larga: la planta de la altura. BC
              es horizontal, está en verdadera magnitud en la planta, y el ángulo recto con ella se ve
              recto.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(V), solucion.L_vV)
            porque: |
              Por V₂, la vertical hasta pasar la planta de la altura.
          - con: marca
            traza: proy_planta(V)
            rotulo: V₁
            porque: |
              V₁, donde la vertical de V₂ corta la planta de la altura.
          - con: arista-vista
            traza: '[segmento2(figura.punto("C1"), proy_planta(D)), segmento2(proy_planta(D), proy_planta(E)), segmento2(proy_planta(E), figura.punto("B1")), segmento2(proy_planta(V), proy_planta(D)), segmento2(proy_planta(V), proy_planta(E))]'
            porque: |
              **Lo visto y lo oculto, en la planta.** La base sube de BC a DE y V queda por debajo: desde
              arriba se ve la base entera, en continua. V₁ cae fuera de ella, y VD y VE cierran el contorno:
              también en continua.
          - con: arista-oculta
            traza: '[segmento2(proy_planta(V), figura.punto("B1")), segmento2(proy_planta(V), figura.punto("C1"))]'
            porque: |
              VB y VC van por debajo de la base: sus plantas caen dentro del contorno, y van a trazos.
          - con: arista-vista
            traza: '[segmento2(figura.punto("C2"), proy_alzado(D)), segmento2(proy_alzado(D), proy_alzado(E)), segmento2(proy_alzado(E), figura.punto("B2")), segmento2(proy_alzado(V), figura.punto("B2")), segmento2(proy_alzado(V), proy_alzado(D)), segmento2(proy_alzado(V), figura.punto("C2"))]'
            porque: |
              **En el alzado**, la base mira hacia delante, y se ve entera. VB y VD cierran el contorno, y VC
              separa dos caras que miran hacia delante: las tres en continua.
          - con: arista-oculta
            traza: segmento2(proy_alzado(V), proy_alzado(E))
            porque: |
              VE queda detrás de la base y de la cara VCD: a trazos.
        pista: |
          (1) D₁ y E₁: las prolongaciones de B₁O₁ y C₁O₁, a O₁B₁ y O₁C₁ de O₁; en el alzado, igual, o con
          las verticales. (2) La frontal por O: la horizontal del papel por O₁ corta B₁C₁ en F₁; súbelo a
          B₂C₂. (3) Por O₂, la perpendicular a F₂O₂ hasta α₂ prolongada: V₂. (4) Por O₁, la perpendicular a
          B₁C₁; V₁ está en ella, en la vertical de V₂. (5) La base mira hacia arriba y hacia delante: se ve
          entera en las dos vistas, y V queda por debajo.
        desarrollo: |
          En verde claro, la base BCDE, la frontal F₂O₂, la altura y la pirámide en las dos vistas, con lo
          oculto a trazos: VB y VC en la planta, VE en el alzado. V queda por debajo de la base, en α, a
          la derecha de la figura dada.

      - tipo: calcular
        titulo: La altura de la pirámide
        pregunta: ¿Cuánto mide la altura de la pirámide, de O a V, en verdadera magnitud?
        respuesta:
          tipo: numero
          valor: '65.83'
          receta: altura_mm
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '50.69'
            receta: en_mm(vm_planta(O, V))
            mensaje: |
              Eso es lo que mide **O₁V₁ en la planta**. La altura baja de O a V, y la planta la acorta: es un
              cateto. El otro es lo que O está por encima de α, y la altura es la hipotenusa.
          - valor: '60.70'
            receta: en_mm(vm_alzado(O, V))
            mensaje: |
              Eso es **O₂V₂ en el alzado**, que también acorta: la altura no es frontal, porque se acerca al
              plano vertical mientras baja (V₁ queda por encima de O₁ en la planta: V tiene menos alejamiento
              que O).
          - valor: '41.99'
            receta: en_mm(diferencia_de_cotas(O, V))
            mensaje: |
              Eso es lo que **O está por encima de α**, de O₂ a α₂: la altura mediría eso si fuera vertical.
              Va inclinada, perpendicular a la base, y mide más.
          - valor: '73.96'
            receta: en_mm(vm(V, B))
            mensaje: |
              Esa es una **arista lateral**, VB, en verdadera magnitud. La altura va de V al centro de la
              base, y es más corta que cualquier arista.
        pista: |
          La altura no está en verdadera magnitud en ninguna de las dos vistas. Mide O₁V₁ en la planta y lo
          que O₂ está por encima de α₂ en el alzado: son los dos catetos de su triángulo.
        desarrollo: |
          La altura OV es la hipotenusa del triángulo que tiene por catetos su planta, O₁V₁, y lo que O está
          por encima de α:

          $$ \overline{OV} = \sqrt{50{,}69^{2} + 41{,}99^{2}} \approx 65{,}83 \text{ mm} $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: 'O es el centro del rectángulo: D y E son los simétricos de B y de C respecto de O, y las dos proyecciones lo conservan.'
          - texto: 'La pirámide es recta: V está en la perpendicular a la base por O.'
          - texto: 'BC es horizontal, así que la planta de la perpendicular es perpendicular a B₁C₁; el alzado, a F₂O₂, una frontal de la base por O.'
          - texto: 'α es horizontal y el alzado lo ve de canto: V₂ es donde el alzado de la perpendicular corta α₂, y V₁ está en su vertical.'
          - texto: 'V está en la vertical de O, a la altura de α₂, porque la altura de una pirámide se mide en vertical.'
            trampa: true
            mensaje: |
              La altura de una pirámide recta es perpendicular a la base, y la base no es horizontal: forma
              50,4° con el plano horizontal. Con la vertical por O, V₂ caería 43,8 mm a la izquierda del bueno,
              y la pirámide no sería recta.
    resolucion: |
      **Lo que dan los datos.** BC es un lado de la base y O su centro. B₂C₂ es horizontal: BC es una
      recta horizontal, en verdadera magnitud en la planta. α es un plano horizontal, de canto en α₂. El
      enunciado dice «AB», y la figura rotula B y C: es una errata de la hoja.

      **La base.** Cada vértice tiene su opuesto al otro lado de O: D₁ y E₁ están en las prolongaciones
      de B₁O₁ y C₁O₁, a O₁B₁ y O₁C₁ de O₁, y lo mismo en el alzado. DE sale horizontal, paralela a BC.
      Los datos no cierran un rectángulo exacto (O está 0,66 mm fuera de la mediatriz de BC), y la base
      sale con ángulos de 91,7° y 88,3°; con el rectángulo exacto de lado BC, la otra lectura de las
      Notas, D₁ y E₁ caerían 1,3 mm corridos en la dirección de C₁B₁.

      **El vértice.** V está en la perpendicular a la base por O. Su planta es perpendicular a B₁C₁. Para
      el alzado, la frontal por O: la horizontal del papel por O₁ corta B₁C₁ en F₁, que sube a B₂C₂, y el
      alzado de la perpendicular es perpendicular a F₂O₂. Corta α₂, prolongada, en V₂, y V₁ está en su
      vertical. V queda por debajo de la base.

      **Lo visto y lo oculto.** La base mira hacia arriba y hacia delante, y se ve entera en las dos
      vistas. En la planta, VB y VC van por debajo de ella; en el alzado, VE queda detrás.

      **La altura.** O₁V₁ mide 50,69 mm y O está 41,99 mm por encima de α: la altura mide 65,83 mm.

  - id: sd53-la-piramide-recta-de-eje-e
    titulo: La pirámide recta de base triangular y eje e, con la base vista de punta a e
    fuente: Ejercicio 37 (SD53) · Colección de ejercicios de Geometría Descriptiva, Sistema Diédrico Directo · Dpto. de Expresión Gráfica y Proyectos de Ingeniería, EIG · UPV/EHU
    nivel: practica
    # Decisión: el texto impreso tal cual, cotejado con la página (pág. 38).
    # Lo que no dice —que la base es un triángulo equilátero centrado en e—
    # es una lectura nuestra y va en las Notas. Los nombres B, C, O, K y Q, y
    # las dos líneas nuevas con su referencia, son nuestros.
    enunciado: |
      Dibujar las proyecciones diédricas de una pirámide recta de base triangular. Datos: el eje e representa la altura de la pirámide, el vértice V fija la altura de la misma y el punto A es un vértice de la base.

      **Notas nuestras.** La figura son el alzado, arriba, y la planta, debajo: el eje e, de trazo y
      punto, que acaba arriba en V, y el punto A. La lámina no da escala: se mide en el papel, en
      milímetros. «Pirámide recta de base triangular» solo fija una pirámide si la base es un
      **triángulo equilátero** con el centro en el eje: es la lectura que tomamos, la de una pirámide
      regular, porque con un triángulo cualquiera A no bastaría para dibujarlo. La base está en el
      plano perpendicular a e por A, y su centro O es donde ese plano corta e; V queda por encima. Con
      otro triángulo que tuviera su baricentro en el eje haría falta un dato más, que la hoja no da.
      Llamamos B y C a los otros dos vértices de la base, B el de más cota; O al centro de la base; K
      al extremo de abajo de e, y Q al punto de e que tiene la cota de A.
    pide: Los vértices B y C de la base, en las dos vistas, por dos cambios de plano que dejan e de punta y la base en verdadera magnitud; la pirámide pasada a limpio con lo visto y lo oculto; y, como pregunta nuestra, el lado de la base.
    receta:
      lamina: sd53
      escena:
        V: 'punto3(alzado: figura.punto("V2"), planta: figura.punto("V1"))'
        A: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("A1"))'
        K: 'punto3(alzado: figura.punto("K2"), planta: figura.punto("K1"))'
        e: recta3(V, K)
      solucion:
        # La base: el plano perpendicular a e por A; su centro O, donde corta e.
        # B y C, A girado 120° a cada lado alrededor de e: B el de más cota.
        base: plano_perpendicular_a_recta(A, e)
        O: corte_recta_plano(e, base)
        B: 'gira(A, e, angulo: 120, sentido: ascendente)'
        C: 'gira(A, e, angulo: 120, sentido: descendente)'
        lado_mm: en_mm(vm(B, C))
        # Q, el punto de e con la cota de A: la horizontal de A₂ corta e₂.
        horA: 'plano(A, punto3(alzado: desplaza(figura.punto("A2"), dx: 10), planta: desplaza(figura.punto("A1"), dx: 10)), punto3(alzado: figura.punto("A2"), planta: desplaza(figura.punto("A1"), dy: 10)))'
        Q: corte_recta_plano(e, horA)
        # Decisión: dos cambios de plano con las líneas nuevas de la lámina, que
        # fija el ejercicio, y V de referencia en los dos. El primero,
        # horizontal (sale del alzado y lleva alejamientos), con la línea
        # paralela a e₂: e sale en verdadera magnitud en la vista 4, y la base,
        # perpendicular a e, de canto. El segundo, con la línea perpendicular a
        # e₄: e sale de punta en la vista 5, y la base en verdadera magnitud.
        V_4: 'cambio_plano_horizontal(V, figura.segmento("nueva1"), ref: V)'
        Q_4: 'cambio_plano_horizontal(Q, figura.segmento("nueva1"), ref: V)'
        A_4: 'cambio_plano_horizontal(A, figura.segmento("nueva1"), ref: V)'
        B_4: 'cambio_plano_horizontal(B, figura.segmento("nueva1"), ref: V)'
        C_4: 'cambio_plano_horizontal(C, figura.segmento("nueva1"), ref: V)'
        V_5: 'cambio_plano_horizontal(V, figura.segmento("nueva1"), ref: V, luego: figura.segmento("nueva2"))'
        A_5: 'cambio_plano_horizontal(A, figura.segmento("nueva1"), ref: V, luego: figura.segmento("nueva2"))'
        B_5: 'cambio_plano_horizontal(B, figura.segmento("nueva1"), ref: V, luego: figura.segmento("nueva2"))'
        C_5: 'cambio_plano_horizontal(C, figura.segmento("nueva1"), ref: V, luego: figura.segmento("nueva2"))'
        R: vm(O, A)
        # Lo que se traza en el papel. La horizontal de V₁, desde la que se
        # cuentan los alejamientos; los pies de las perpendiculares en las dos
        # líneas nuevas y en e₂, que es paralela a la primera y pasa por V₂.
        hV1: 'perpendicular(por: figura.punto("V1"), a: segmento2(figura.punto("V1"), figura.punto("V2")))'
        vQ: segmento2(proy_alzado(Q), proy_planta(Q))
        Qh: cruce_aparente(hV1, vQ)
        Ah: 'cruce_aparente(hV1, segmento2(figura.punto("A2"), figura.punto("A1")))'
        pQ: 'pie_perpendicular(proy_alzado(Q), figura.segmento("nueva1"))'
        pA: 'pie_perpendicular(figura.punto("A2"), figura.segmento("nueva1"))'
        eA: 'pie_perpendicular(figura.punto("A2"), figura.segmento("e2"))'
        e4: segmento2(V_4, Q_4)
        canto: 'perpendicular(por: A_4, a: e4)'
        p2A: 'pie_perpendicular(A_4, figura.segmento("nueva2"))'
        Aop: 'uno(medir_sobre(segmento2(A_5, V_5), desde: V_5, distancia: R), 1)'
        p2B: 'pie_perpendicular(B_5, figura.segmento("nueva2"))'
        p2C: 'pie_perpendicular(C_5, figura.segmento("nueva2"))'
        p1B: 'pie_perpendicular(B_4, figura.segmento("nueva1"))'
        p1C: 'pie_perpendicular(C_4, figura.segmento("nueva1"))'
        eB: 'pie_perpendicular(B_4, figura.segmento("e2"))'
        eC: 'pie_perpendicular(C_4, figura.segmento("e2"))'
        Bh: 'cruce_aparente(hV1, segmento2(proy_alzado(B), proy_planta(B)))'
        Ch: 'cruce_aparente(hV1, segmento2(proy_alzado(C), proy_planta(C)))'
        perpA1: 'perpendicular(por: figura.punto("A2"), a: figura.segmento("nueva1"))'
        perpA2: 'perpendicular(por: A_4, a: figura.segmento("nueva2"))'
        perpB: segmento2(B_4, eB)
        perpC: segmento2(C_4, eC)
        # Las distancias que lleva el compás, como números: lo que A₁ está por
        # debajo de la horizontal de V₁, y lo que B₅ y C₅ distan de la segunda
        # línea nueva (en el papel, con vm_planta de dos puntos de la lámina).
        dA1: 'vm_planta(punto3(alzado: figura.punto("A1"), planta: figura.punto("A1")), punto3(alzado: Ah, planta: Ah))'
        dB5: 'vm_planta(punto3(alzado: B_5, planta: B_5), punto3(alzado: p2B, planta: p2B))'
        dC5: 'vm_planta(punto3(alzado: C_5, planta: C_5), punto3(alzado: p2C, planta: p2C))'
        # Los errores. A₄ con la cota en vez del alejamiento, o hacia el lado
        # del alzado; A₅ con lo mismo que llevó A₄, o hacia la vista 4; los
        # vértices del hexágono, a 60° de A, en vez de los del triángulo; B₂ y
        # C₂ medidos desde la línea nueva en vez de desde e₂, o al otro lado de
        # e₂; B₁ con lo que B₅ dista de la segunda línea; C₁ por debajo de la
        # horizontal de V₁.
        A4_cota: 'uno(medir_sobre(segmento2(figura.punto("A2"), pA), desde: pA, distancia: diferencia_de_cotas(V, A)), 1)'
        A4_dentro: 'uno(medir_sobre(segmento2(figura.punto("A2"), pA), desde: pA, distancia: dA1), 2)'
        A5_mismo: 'uno(medir_sobre(segmento2(A_4, p2A), desde: p2A, distancia: dA1), 1)'
        A5_dentro: 'uno(medir_sobre(segmento2(A_4, p2A), desde: p2A, distancia: vm_planta(punto3(alzado: figura.punto("A2"), planta: figura.punto("A2")), punto3(alzado: eA, planta: eA))), 2)'
        H60b: 'gira(A, e, angulo: 60, sentido: ascendente)'
        H60c: 'gira(A, e, angulo: 60, sentido: descendente)'
        H60b_5: 'cambio_plano_horizontal(H60b, figura.segmento("nueva1"), ref: V, luego: figura.segmento("nueva2"))'
        H60c_5: 'cambio_plano_horizontal(H60c, figura.segmento("nueva1"), ref: V, luego: figura.segmento("nueva2"))'
        B2_nueva: 'uno(medir_sobre(perpB, desde: p1B, distancia: dB5), 1)'
        B2_fuera: 'uno(medir_sobre(perpB, desde: eB, distancia: dB5), 1)'
        C2_nueva: 'uno(medir_sobre(perpC, desde: p1C, distancia: dC5), 1)'
        C2_fuera: 'uno(medir_sobre(perpC, desde: eC, distancia: dC5), 1)'
        B1_mal: 'desplaza(Bh, dy: dB5)'
        dC4: 'vm_planta(punto3(alzado: C_4, planta: C_4), punto3(alzado: p1C, planta: p1C))'
        C1_mal: 'desplaza(Ch, dy: dC4)'
        # Los extremos de las rectas largas de la construcción.
        L_hVi: 'desplaza(figura.punto("V1"), dx: -150)'
        L_hVd: 'desplaza(figura.punto("V1"), dx: 24)'
        L_hA: 'desplaza(proy_alzado(Q), dx: mm(4))'
        L_vQ: 'desplaza(proy_planta(Q), dy: mm(4))'
        L_V4: 'uno(medir_sobre(segmento2(figura.punto("V2"), V_4), desde: V_4, distancia: mm(3)), 1)'
        L_Q4: 'uno(medir_sobre(segmento2(proy_alzado(Q), Q_4), desde: Q_4, distancia: mm(4)), 1)'
        L_A4: 'uno(medir_sobre(segmento2(figura.punto("A2"), A_4), desde: A_4, distancia: mm(4)), 1)'
        L_e4: 'uno(medir_sobre(e4, desde: V_5, distancia: mm(4)), 1)'
        L_cB: 'uno(medir_sobre(canto, desde: B_4, distancia: mm(4)), 2)'
        L_cC: 'uno(medir_sobre(canto, desde: C_4, distancia: mm(4)), 1)'
        L_A5: 'uno(medir_sobre(segmento2(A_4, A_5), desde: A_5, distancia: mm(4)), 1)'
        L_Aop: 'uno(medir_sobre(segmento2(A_5, V_5), desde: Aop, distancia: mm(4)), 1)'
        L_B4: 'uno(medir_sobre(segmento2(B_5, B_4), desde: B_4, distancia: mm(4)), 1)'
        L_C4: 'uno(medir_sobre(segmento2(C_5, C_4), desde: C_4, distancia: mm(4)), 1)'
        L_p2B: 'uno(medir_sobre(segmento2(B_4, B_5), desde: p2B, distancia: mm(3)), 1)'
        L_p2C: 'uno(medir_sobre(segmento2(C_4, C_5), desde: p2C, distancia: mm(3)), 1)'
        L_eB: 'uno(medir_sobre(perpB, desde: eB, distancia: mm(3)), 1)'
        L_eC: 'uno(medir_sobre(perpC, desde: eC, distancia: mm(3)), 1)'
        L_p1C: 'uno(medir_sobre(perpC, desde: p1C, distancia: mm(3)), 2)'
        L_vB: 'desplaza(proy_planta(B), dy: mm(4))'
        L_vC: 'desplaza(Ch, dy: mm(3))'
      comprueba:
        - en_plano(B, base)
        - en_plano(C, base)
        - en_recta(Q, e)
        - en_recta(O, e)
    pasos:
      - tipo: reconocer
        pregunta: La base es perpendicular al eje e, que no es horizontal ni frontal. ¿En qué vista se dibuja el triángulo de la base con su forma verdadera?
        opciones:
          - texto: En la planta, donde e₁ se ve más corta, porque la base es casi horizontal
            mensaje: |
              La base es perpendicular a e, y e forma 54° con el plano horizontal: la base forma 36° con él, y
              la planta la acorta. Un triángulo equilátero dibujado en la planta no sale equilátero en el
              espacio.
          - texto: En una vista con e de punta, que pide dos cambios de plano, porque la base le es perpendicular
            correcta: true
            mensaje: |
              Eso es. Un plano perpendicular a una recta se ve en verdadera magnitud donde la recta se ve de
              punta. Con un primer cambio, paralelo a e₂, e sale en verdadera magnitud y la base de canto;
              con un segundo, perpendicular a e₄, e sale de punta, y ahí el triángulo se dibuja con el compás.
          - texto: En la vista 4 del primer cambio, la que deja e en verdadera magnitud, porque ahí se ve la altura de la pirámide entera
            mensaje: |
              En esa vista e está en verdadera magnitud, y por eso la base, que le es perpendicular, se ve **de
              canto**, como una recta. Sirve para hallar el centro O, pero el triángulo se ve con su forma en
              la vista siguiente, con e de punta.

      # Decisión: un solo paso construir: los dos cambios, la base, la vuelta
      # a las dos vistas y la visibilidad. Las líneas nuevas y V de referencia
      # los fija el intro; Q es el segundo punto de e para la vista 4.
      - tipo: construir
        titulo: Dos cambios de plano, la base y lo que se ve
        intro: |
          La base está en el plano perpendicular a e por A, y ese plano se ve en verdadera magnitud donde e
          se ve de punta: hacen falta dos cambios, como en la distancia de un punto a una recta. El
          enunciado no da las líneas nuevas ni la referencia: las fijamos nosotros, y las dos ya están
          dibujadas, de trazo y punto. La primera, a la derecha del alzado, es paralela a e₂: con un cambio
          horizontal, que lleva alejamientos, e sale en verdadera magnitud en la vista 4. La segunda, debajo
          de la planta, es perpendicular a esa e₄: con el segundo cambio, que lleva lo que el alzado de
          cada punto distaba de la primera línea, e sale de punta en la vista 5. V es la referencia de los
          dos cambios. Para e₄ hace falta otro punto de e: toma Q, el que tiene la cota de A, con la
          horizontal de A₂. En la vista 5 la base está en verdadera magnitud: llamamos B al vértice que
          queda a la derecha de V₅, que es el de más cota, y C al otro. Marca A₄, V₅, A₅, los dos
          vértices nuevos en la vista 5, en la 4 y en las dos vistas, y pasa la pirámide a limpio con
          «arista vista» y «arista oculta». B₂ cae a 3 mm de la primera línea nueva, y C₄, C₂ y C₁, a 4 o
          5 mm de la vertical de Q₂: amplía con la lupa (×4) antes de marcarlos.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, visto, oculto, borrar]
        tolerancia: 1
        objetivos:
          - nombre: A4
            pide: el vértice A, en la vista 4
            es: solucion.A_4
            bien: |
              A₄ está en la perpendicular a la primera línea nueva que sale de A₂, 30,0 mm más allá de la
              línea: lo que A₁ está por debajo de la horizontal de V₁, porque A está más cerca que V.
            diagnosticos:
              - si: cerca_de(solucion.A4_cota)
                mensaje: |
                  Has llevado lo que A₂ está por debajo de V₂, la **cota**. Un cambio de plano horizontal sale
                  del alzado y lleva **alejamientos**: lo que A₁ está por debajo de la horizontal de V₁.
                ejemplo: solucion.A4_cota
              - si: cerca_de(solucion.A4_dentro)
                mensaje: |
                  La distancia es la buena, pero hacia el lado del alzado. A está más cerca que V, que es la
                  referencia: se aparta de la línea nueva hacia fuera, lejos del alzado.
                ejemplo: solucion.A4_dentro
              - si: '!en_recta(solucion.perpA1)'
                mensaje: |
                  A₄ sale de A₂ por la **perpendicular a la línea nueva**, como en todo cambio de plano.
                ejemplo: 'uno(medir_sobre(figura.segmento("nueva1"), desde: solucion.pA, distancia: mm(6)), 1)'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular buena, pero no a la distancia buena. A₄ se aparta de la línea nueva
                  lo que A₁ está por debajo de la horizontal de V₁, hacia fuera.
          - nombre: V5
            pide: el eje e, de punta, en la vista 5
            es: solucion.V_5
            bien: |
              V₅ está en la segunda línea nueva, donde la corta e₄ prolongada: V es la referencia, y e, de
              punta, es ese punto. Q₅, O₅ y K₅ caen en él.
            diagnosticos:
              - si: '!en_recta(figura.segmento("nueva2"))'
                mensaje: |
                  V es la referencia del segundo cambio: V₅ cae **en la segunda línea nueva**, al pie de la
                  perpendicular que sale de V₄.
                ejemplo: 'desplaza(solucion.V_5, dy: mm(5))'
              - si: siempre
                mensaje: |
                  Estás en la segunda línea nueva, pero no al pie de V₄. La perpendicular a la línea que sale
                  de V₄ es e₄ misma, prolongada: donde la corta está V₅.
          - nombre: A5
            pide: el vértice A, en la vista 5
            es: solucion.A_5
            bien: |
              A₅ está en la perpendicular a la segunda línea nueva que sale de A₄, 34,8 mm por debajo de la
              línea: lo que A₂ dista de e₂. La base está en verdadera magnitud, y V₅A₅ es su radio.
            diagnosticos:
              - si: cerca_de(solucion.A5_mismo)
                mensaje: |
                  Has llevado otra vez lo que A₁ está por debajo de la horizontal de V₁. El segundo cambio sale
                  de la vista 4 y lleva lo que **el alzado** distaba de la primera línea nueva: para A, lo que
                  A₂ dista de e₂, que es paralela a la línea y pasa por V₂.
                ejemplo: solucion.A5_mismo
              - si: cerca_de(solucion.A5_dentro)
                mensaje: |
                  La distancia es la buena, pero hacia la vista 4. A₂ está más lejos de la primera línea nueva
                  que V₂, así que A₅ se aparta de la segunda hacia fuera.
                ejemplo: solucion.A5_dentro
              - si: '!en_recta(solucion.perpA2)'
                mensaje: |
                  A₅ sale de A₄ por la **perpendicular a la segunda línea nueva**.
                ejemplo: 'desplaza(solucion.A_5, dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular buena, pero no a la distancia buena: lo que A₂ dista de e₂, medido
                  sobre la perpendicular que sale de A₂.
          - nombre: B5
            pide: el vértice B, el de la derecha, en la vista 5
            es: solucion.B_5
            bien: |
              B₅ está en la circunferencia de centro V₅ y radio V₅A₅, a 120° de A₅: el arco de centro A₅′,
              el punto opuesto a A₅, la corta en B₅ y en C₅.
            diagnosticos:
              - si: cerca_de(solucion.C_5)
                mensaje: |
                  Ese es C, el de la izquierda. Los dos están en la circunferencia, a 120° de A₅; B es el que
                  queda a la derecha de V₅.
                ejemplo: solucion.C_5
              - si: cerca_de(solucion.H60b_5)
                mensaje: |
                  Has pinchado el compás en **A₅**: ese punto está a 60° de A₅, y es un vértice del hexágono,
                  no del triángulo. El arco va con centro en A₅′, el punto opuesto a A₅ en la circunferencia.
                ejemplo: solucion.H60b_5
              - si: '!a_distancia(de: solucion.V_5, d: solucion.R)'
                mensaje: |
                  Los tres vértices de la base están a la misma distancia del eje: B₅ va en la
                  **circunferencia de centro V₅ y radio V₅A₅**.
                ejemplo: 'desplaza(solucion.B_5, dx: mm(5))'
              - si: siempre
                mensaje: |
                  Estás en la circunferencia, pero no a 120° de A₅. Prolonga A₅V₅ hasta A₅′, al otro lado, y
                  con centro en A₅′ y el mismo radio corta la circunferencia.
          - nombre: C5
            pide: el vértice C, el de la izquierda, en la vista 5
            es: solucion.C_5
            bien: |
              C₅ es el otro corte del arco de centro A₅′ con la circunferencia. A₅B₅C₅ es la base en
              verdadera magnitud: un triángulo equilátero.
            diagnosticos:
              - si: cerca_de(solucion.H60c_5)
                mensaje: |
                  Has pinchado el compás en **A₅**: ese punto está a 60° de A₅, un vértice del hexágono. El
                  arco va con centro en A₅′.
                ejemplo: solucion.H60c_5
              - si: '!a_distancia(de: solucion.V_5, d: solucion.R)'
                mensaje: |
                  C₅ va en la **circunferencia de centro V₅ y radio V₅A₅**, como A₅ y B₅.
                ejemplo: 'desplaza(solucion.C_5, dx: mm(-5))'
              - si: siempre
                mensaje: |
                  Estás en la circunferencia, pero no a 120° de A₅: C₅ es el otro corte del arco de centro A₅′.
          - nombre: B4
            pide: el vértice B, de vuelta en la vista 4
            es: solucion.B_4
            bien: |
              B₄ está en el canto de la base, la perpendicular a e₄ por A₄, en la perpendicular a la segunda
              línea nueva que sale de B₅.
            diagnosticos:
              - si: cerca_de(solucion.C_4)
                mensaje: |
                  Ese es C₄. B₄ está en la perpendicular a la segunda línea nueva que sale de **B₅**.
                ejemplo: solucion.C_4
              - si: '!en_recta(solucion.canto)'
                mensaje: |
                  En la vista 4 la base se ve **de canto**: B₄ va en la perpendicular a e₄ que pasa por A₄.
                ejemplo: 'uno(medir_sobre(segmento2(solucion.B_5, solucion.B_4), desde: solucion.B_4, distancia: mm(5)), 1)'
              - si: siempre
                mensaje: |
                  Estás en el canto, pero no en la perpendicular a la segunda línea nueva que sale de B₅.
          - nombre: C4
            pide: el vértice C, de vuelta en la vista 4
            es: solucion.C_4
            bien: |
              C₄ está en el canto, en la perpendicular a la segunda línea nueva que sale de C₅. Cae del lado
              del alzado de la primera línea nueva: C está más lejos que V.
            diagnosticos:
              - si: '!en_recta(solucion.canto)'
                mensaje: |
                  C₄ va en el **canto** de la base, la perpendicular a e₄ por A₄, prolongada hacia la
                  izquierda.
                ejemplo: 'uno(medir_sobre(segmento2(solucion.C_5, solucion.C_4), desde: solucion.C_4, distancia: mm(5)), 1)'
              - si: siempre
                mensaje: |
                  Estás en el canto, pero no en la perpendicular a la segunda línea nueva que sale de C₅.
          - nombre: B2
            pide: el vértice B, en el alzado
            es: proy_alzado(B)
            bien: |
              B₂ está en la perpendicular a la primera línea nueva que sale de B₄, a lo que B₅ dista de la
              segunda línea medido desde e₂, hacia la línea nueva: 23,5 mm.
            diagnosticos:
              - si: cerca_de(solucion.B2_nueva)
                mensaje: |
                  Has medido desde la **línea nueva**. La referencia es V, y V₂ está en e₂, que es paralela a la
                  línea: la distancia que lleva B₅ se cuenta desde e₂.
                ejemplo: solucion.B2_nueva
              - si: cerca_de(solucion.B2_fuera)
                mensaje: |
                  La distancia es la buena, pero al otro lado de e₂. B₅ quedaba hacia la vista 4, del lado de
                  la segunda línea: B₂ queda entre e₂ y la primera línea nueva.
                ejemplo: solucion.B2_fuera
              - si: '!en_recta(solucion.perpB)'
                mensaje: |
                  De vuelta, B₂ está en la **perpendicular a la primera línea nueva** que sale de B₄.
                ejemplo: 'desplaza(proy_alzado(B), dy: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular que sale de B₄, pero no a la distancia buena: lo que B₅ dista de la
                  segunda línea nueva, llevado desde e₂ hacia la primera.
          - nombre: C2
            pide: el vértice C, en el alzado
            es: proy_alzado(C)
            bien: |
              C₂ está en la perpendicular a la primera línea nueva que sale de C₄, a 11,2 mm de e₂, hacia la
              línea nueva: lo que C₅ dista de la segunda.
            diagnosticos:
              - si: cerca_de(solucion.C2_nueva)
                mensaje: |
                  Has medido desde la **línea nueva**: la distancia que lleva C₅ se cuenta desde e₂, la paralela
                  a la línea por V₂, porque V es la referencia.
                ejemplo: solucion.C2_nueva
              - si: cerca_de(solucion.C2_fuera)
                mensaje: |
                  La distancia es la buena, pero al otro lado de e₂: C₂ queda entre e₂ y la primera línea nueva.
                ejemplo: solucion.C2_fuera
              - si: '!en_recta(solucion.perpC)'
                mensaje: |
                  C₂ está en la **perpendicular a la primera línea nueva** que sale de C₄.
                ejemplo: 'desplaza(proy_alzado(C), dy: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular que sale de C₄, pero no a la distancia buena: lo que C₅ dista de la
                  segunda línea nueva, desde e₂.
          - nombre: B1
            pide: el vértice B, en la planta
            es: proy_planta(B)
            bien: |
              B₁ está en la vertical de B₂, 47,4 mm por debajo de la horizontal de V₁: lo que B₄ dista de la
              primera línea nueva.
            diagnosticos:
              - si: cerca_de(solucion.B1_mal)
                mensaje: |
                  Has llevado lo que B₅ dista de la segunda línea nueva. Para volver a la planta, B₁ se aparta
                  de la horizontal de V₁ lo que **B₄** dista de la primera: es su alejamiento sobre el de V.
                ejemplo: solucion.B1_mal
              - si: '!en_vertical_de(B2)'
                mensaje: |
                  B₁ va en la **vertical de B₂**: es el mismo punto visto desde arriba.
                ejemplo: 'desplaza(proy_planta(B), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la vertical de B₂, pero no a la distancia buena: lo que B₄ dista de la primera línea
                  nueva, por debajo de la horizontal de V₁.
          - nombre: C1
            pide: el vértice C, en la planta
            es: proy_planta(C)
            bien: |
              C₁ está en la vertical de C₂, 6,4 mm **por encima** de la horizontal de V₁: C₄ quedaba del lado
              del alzado de la primera línea nueva, y C está más lejos que V.
            diagnosticos:
              - si: cerca_de(solucion.C1_mal)
                mensaje: |
                  La distancia es la buena, pero por debajo de la horizontal de V₁. C₄ quedaba del lado del
                  alzado de la primera línea nueva: C está más lejos que V, y C₁ queda por encima.
                ejemplo: solucion.C1_mal
              - si: '!en_vertical_de(C2)'
                mensaje: |
                  C₁ va en la **vertical de C₂**.
                ejemplo: 'desplaza(proy_planta(C), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la vertical de C₂, pero no a la distancia buena: lo que C₄ dista de la primera línea
                  nueva, por encima de la horizontal de V₁.
        # Decisión: la base y las caras son opacas, la planta se mira desde
        # arriba y el alzado desde delante, como en el resto del sitio. La
        # visibilidad sale de un cálculo de líneas ocultas aparte, por rayos
        # contra las cuatro caras: ninguna arista cambia a medio camino.
        tramos:
          - traza: segmento2(figura.punto("A1"), proy_planta(B))
            tipo: visto
            porque: 'AB es contorno de la planta y arista de la cara VAB, que mira hacia arriba: desde arriba nada la tapa.'
          - traza: segmento2(proy_planta(B), proy_planta(C))
            tipo: oculto
            porque: 'BC va por debajo: su planta cruza el contorno por dentro, y la base y la cara VBC miran hacia abajo. Desde arriba la tapan las caras VAB y VCA.'
          - traza: segmento2(proy_planta(C), figura.punto("A1"))
            tipo: visto
            porque: 'CA es contorno de la planta: desde arriba nada la tapa.'
          - traza: segmento2(figura.punto("V1"), figura.punto("A1"))
            tipo: visto
            porque: 'VA separa las caras VAB y VCA, las dos que miran hacia arriba: desde arriba se ve.'
          - traza: segmento2(figura.punto("V1"), proy_planta(B))
            tipo: visto
            porque: 'VB es contorno de la planta: desde arriba nada la tapa.'
          - traza: segmento2(figura.punto("V1"), proy_planta(C))
            tipo: visto
            porque: 'VC es contorno de la planta: desde arriba nada la tapa.'
          - traza: segmento2(figura.punto("A2"), proy_alzado(B))
            tipo: visto
            porque: 'AB es arista de la base y de la cara VAB, que miran las dos hacia delante: nada la tapa.'
          - traza: segmento2(proy_alzado(B), proy_alzado(C))
            tipo: visto
            porque: 'BC es un lado de la base, que mira hacia delante, y contorno del alzado: nada lo tapa.'
          - traza: segmento2(proy_alzado(C), figura.punto("A2"))
            tipo: visto
            porque: 'CA es un lado de la base, que mira hacia delante, y contorno del alzado: nada lo tapa.'
          - traza: segmento2(figura.punto("V2"), figura.punto("A2"))
            tipo: visto
            porque: 'VA es contorno del alzado, de A₂ a V₂: nada la tapa por delante.'
          - traza: segmento2(figura.punto("V2"), proy_alzado(B))
            tipo: visto
            porque: 'VB es contorno del alzado, de B₂ a V₂: nada la tapa por delante.'
          - traza: segmento2(figura.punto("V2"), proy_alzado(C))
            tipo: oculto
            porque: 'VC separa las caras VBC y VCA, que miran hacia atrás: su alzado cae dentro del contorno, y por delante la tapan la base y la cara VAB.'
        construccion:
          - con: regla
            traza: segmento2(figura.punto("V2"), figura.punto("V1"))
            porque: |
              **La vista 4.** El primer cambio es horizontal: sale del alzado y lleva alejamientos, contados
              desde el de V, la referencia. Para medirlos, la línea de referencia de V, de V₂ a V₁.
          - con: escuadra-cartabon
            traza: '[segmento2(figura.punto("V1"), solucion.L_hVi), segmento2(figura.punto("V1"), solucion.L_hVd)]'
            guia: segmento2(figura.punto("V2"), figura.punto("V1"))
            porque: |
              Por V₁, la perpendicular a la línea de referencia: la horizontal de V₁, larga hacia los dos
              lados. Lo que cada planta está por debajo de ella es lo que su punto está más cerca que V.
          - con: regla
            traza: segmento2(figura.punto("A2"), figura.punto("A1"))
            porque: |
              La línea de referencia de A, de A₂ a A₁: corta la horizontal de V₁ por encima de A₁.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("A2"), solucion.L_hA)
            guia: segmento2(figura.punto("V2"), figura.punto("V1"))
            porque: |
              Para e₄ hacen falta dos puntos de e. Uno es V. Otro cualquiera: por A₂, la horizontal hasta
              pasar e₂.
          - con: marca
            traza: proy_alzado(Q)
            rotulo: Q₂
            porque: |
              Q₂, nombre nuestro, donde la horizontal de A₂ corta e₂: el punto de e con la cota de A.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(Q), solucion.L_vQ)
            porque: |
              Por Q₂, la vertical hasta pasar e₁. Cruza por el camino la horizontal de V₁.
          - con: marca
            traza: proy_planta(Q)
            rotulo: Q₁
            porque: |
              Q₁, donde la vertical de Q₂ corta e₁.
          - con: escuadra-cartabon
            traza: '[segmento2(figura.punto("V2"), solucion.L_V4), segmento2(proy_alzado(Q), solucion.L_Q4), segmento2(figura.punto("A2"), solucion.L_A4)]'
            guia: figura.segmento("nueva1")
            porque: |
              Desde V₂, Q₂ y A₂, las perpendiculares a la primera línea nueva, y más allá. La de A₂ cruza e₂
              por el camino, en ángulo recto, porque e₂ es paralela a la línea.
          - con: marca
            traza: solucion.V_4
            rotulo: V₄
            porque: |
              V₄, donde la perpendicular de V₂ corta la línea nueva: V es la referencia, y cae en ella.
          - con: compas
            traza: 'arco(solucion.pQ, por: solucion.Q_4, desde: desplaza(solucion.Q_4, dx: -2.1, dy: 4.5), hasta: desplaza(solucion.Q_4, dx: 2.1, dy: -4.5))'
            toma: segmento2(proy_planta(Q), solucion.Qh)
            porque: |
              Con el compás, en la planta, **lo que Q₁ está por debajo de la horizontal de V₁**: Q está más
              cerca que V. Se lleva desde la línea nueva hacia fuera, lejos del alzado.
          - con: marca
            traza: solucion.Q_4
            rotulo: Q₄
            porque: |
              Q₄, donde el arco corta la perpendicular que sale de Q₂.
          - con: compas
            traza: 'arco(solucion.pA, por: solucion.A_4, desde: desplaza(solucion.A_4, dx: -2.1, dy: 4.5), hasta: desplaza(solucion.A_4, dx: 2.1, dy: -4.5))'
            toma: segmento2(figura.punto("A1"), solucion.Ah)
            porque: |
              Lo mismo con A: lo que A₁ está por debajo de la horizontal de V₁, desde la línea nueva hacia
              fuera.
          - con: marca
            traza: solucion.A_4
            rotulo: A₄
            porque: |
              A₄, donde el arco corta la perpendicular que sale de A₂.
          - con: regla
            traza: segmento2(solucion.V_4, solucion.L_e4)
            rotulo: e₄
            porque: |
              e₄, de V₄ por Q₄, prolongada hacia abajo hasta pasar la segunda línea nueva: el eje en
              verdadera magnitud. La segunda línea es perpendicular a ella.
          - con: escuadra-cartabon
            traza: '[segmento2(solucion.A_4, solucion.L_cB), segmento2(solucion.A_4, solucion.L_cC)]'
            guia: solucion.e4
            rotulo: canto
            porque: |
              Por A₄, la perpendicular a e₄, larga hacia los dos lados: la base es perpendicular a e, y aquí,
              con e en verdadera magnitud, se ve **de canto**. Corta e₄ en O₄, el centro de la base.
          - con: marca
            traza: solucion.V_5
            rotulo: V₅
            porque: |
              **La vista 5.** V₅, donde e₄ corta la segunda línea nueva: V es la referencia y cae en la línea,
              y e, perpendicular a ella, se ve de punta. Q₅, O₅ y K₅ caen en el mismo punto.
          - con: escuadra-cartabon
            traza: segmento2(solucion.A_4, solucion.L_A5)
            guia: figura.segmento("nueva2")
            porque: |
              Desde A₄, la perpendicular a la segunda línea nueva, hasta pasarla bastante.
          - con: compas
            traza: 'arco(solucion.p2A, por: solucion.A_5, desde: desplaza(solucion.A_5, dx: -5, dy: 0.15), hasta: desplaza(solucion.A_5, dx: 5, dy: -0.15))'
            toma: segmento2(figura.punto("A2"), solucion.eA)
            porque: |
              El segundo cambio lleva lo que el alzado de cada punto distaba de la primera línea nueva, contado
              desde el de V. V₂ está en e₂, que es paralela a la línea: para A, **lo que A₂ dista de e₂**, el
              trozo de su perpendicular entre A₂ y e₂. Se lleva desde la segunda línea hacia fuera.
          - con: marca
            traza: solucion.A_5
            rotulo: A₅
            porque: |
              A₅, donde el arco corta la perpendicular que sale de A₄. V₅A₅ es el radio de la base en
              verdadera magnitud.
          - con: regla
            traza: segmento2(solucion.A_5, solucion.L_Aop)
            porque: |
              La recta de A₅ por V₅, prolongada al otro lado de V₅: por ella va el punto opuesto a A₅.
          - con: compas
            traza: 'arco(solucion.V_5, por: solucion.A_5, desde: desplaza(solucion.B_5, dx: 10.85, dy: 13.76), hasta: desplaza(solucion.C_5, dx: -3.55, dy: 17.16))'
            toma: segmento2(solucion.V_5, solucion.A_5)
            porque: |
              Con centro en V₅ y radio V₅A₅, el arco de la circunferencia de la base al otro lado de V₅: los
              tres vértices están a la misma distancia del eje.
          - con: marca
            traza: solucion.Aop
            rotulo: A₅′
            porque: |
              A₅′, nombre nuestro, donde el arco corta la prolongación de A₅V₅: el punto opuesto a A₅.
          - con: compas
            traza: 'arco(solucion.Aop, por: solucion.V_5, desde: desplaza(solucion.B_5, dx: 3.54, dy: -17.17), hasta: desplaza(solucion.C_5, dx: -10.86, dy: -13.75))'
            toma: segmento2(solucion.V_5, solucion.A_5)
            porque: |
              Con centro en A₅′ y el mismo radio, el arco que pasa por V₅: corta la circunferencia en los dos
              vértices que faltan, a 120° de A₅ cada uno.
          - con: marca
            traza: solucion.B_5
            rotulo: B₅
            porque: |
              B₅, nombre nuestro, el corte de la derecha de los dos arcos.
          - con: marca
            traza: solucion.C_5
            rotulo: C₅
            porque: |
              C₅, nombre nuestro, el corte de la izquierda de los dos arcos.
          - con: regla
            traza: '[segmento2(solucion.A_5, solucion.B_5), segmento2(solucion.B_5, solucion.C_5), segmento2(solucion.C_5, solucion.A_5)]'
            porque: |
              A₅B₅C₅, la base en verdadera magnitud: un triángulo equilátero de centro V₅.
          - con: escuadra-cartabon
            traza: '[segmento2(solucion.B_5, solucion.L_B4), segmento2(solucion.B_5, solucion.L_p2B), segmento2(solucion.C_5, solucion.L_C4), segmento2(solucion.C_5, solucion.L_p2C)]'
            guia: figura.segmento("nueva2")
            porque: |
              **La vuelta.** Por B₅ y por C₅, las perpendiculares a la segunda línea nueva: hacia arriba, hasta
              pasar el canto de la vista 4, porque los dos vértices están en la base y en la vista 4 la base es
              esa recta; hacia abajo, hasta pasar la línea, porque lo que distan de ella se lleva después. La de
              C₅ cruza la planta por el camino.
          - con: marca
            traza: solucion.B_4
            rotulo: B₄
            porque: |
              B₄, donde la perpendicular de B₅ corta el canto.
          - con: marca
            traza: solucion.C_4
            rotulo: C₄
            porque: |
              C₄, donde la perpendicular de C₅ corta el canto, del lado del alzado de la primera línea nueva.
          - con: escuadra-cartabon
            traza: '[segmento2(solucion.B_4, solucion.L_eB), segmento2(solucion.C_4, solucion.L_eC), segmento2(solucion.C_4, solucion.L_p1C)]'
            guia: figura.segmento("nueva1")
            porque: |
              Por B₄ y por C₄, las perpendiculares a la primera línea nueva, hacia el alzado, hasta pasar e₂.
              La de C₄ se prolonga también hacia el otro lado, hasta pasar la línea, porque C₄ queda del lado
              del alzado y lo que dista de ella se lleva después.
          - con: compas
            traza: 'arco(solucion.eB, por: proy_alzado(B), desde: desplaza(proy_alzado(B), dx: -2.1, dy: 4.5), hasta: desplaza(proy_alzado(B), dx: 2.1, dy: -4.5))'
            toma: segmento2(solucion.B_5, solucion.p2B)
            porque: |
              Con el compás, **lo que B₅ dista de la segunda línea nueva**. B₅ quedaba hacia la vista 4: B₂
              está más cerca de la primera línea que V₂. Se lleva desde e₂ hacia la línea nueva, sobre la
              perpendicular de B₄.
          - con: marca
            traza: proy_alzado(B)
            rotulo: B₂
            porque: |
              B₂, donde el arco corta la perpendicular que sale de B₄, entre e₂ y la primera línea nueva.
          - con: compas
            traza: 'arco(solucion.eC, por: proy_alzado(C), desde: desplaza(proy_alzado(C), dx: -2.1, dy: 4.5), hasta: desplaza(proy_alzado(C), dx: 2.1, dy: -4.5))'
            toma: segmento2(solucion.C_5, solucion.p2C)
            porque: |
              Lo mismo con C: lo que C₅ dista de la segunda línea nueva, desde e₂ hacia la línea.
          - con: marca
            traza: proy_alzado(C)
            rotulo: C₂
            porque: |
              C₂, donde el arco corta la perpendicular que sale de C₄.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_alzado(B), solucion.L_vB), segmento2(proy_alzado(C), solucion.L_vC)]'
            porque: |
              Por B₂ y por C₂, las verticales hasta la planta: la de B₂, hasta pasar bastante la horizontal de
              V₁; la de C₂, hasta pasarla un poco.
          - con: compas
            traza: 'arco(solucion.Bh, por: proy_planta(B), desde: desplaza(proy_planta(B), dx: -5), hasta: desplaza(proy_planta(B), dx: 5))'
            toma: segmento2(solucion.B_4, solucion.p1B)
            porque: |
              Con el compás, **lo que B₄ dista de la primera línea nueva**: lo que B está más cerca que V. Se
              lleva desde la horizontal de V₁ hacia abajo, sobre la vertical de B₂.
          - con: marca
            traza: proy_planta(B)
            rotulo: B₁
            porque: |
              B₁, donde el arco corta la vertical de B₂.
          - con: compas
            traza: 'arco(solucion.Ch, por: proy_planta(C), desde: desplaza(proy_planta(C), dx: -5), hasta: desplaza(proy_planta(C), dx: 5))'
            toma: segmento2(solucion.C_4, solucion.p1C)
            porque: |
              Lo que C₄ dista de la primera línea nueva. C₄ quedaba del lado del alzado: C está más lejos que
              V, y se lleva desde la horizontal de V₁ hacia **arriba**.
          - con: marca
            traza: proy_planta(C)
            rotulo: C₁
            porque: |
              C₁, donde el arco corta la vertical de C₂, por encima de la horizontal de V₁.
          - con: arista-vista
            traza: '[segmento2(figura.punto("A1"), proy_planta(B)), segmento2(proy_planta(C), figura.punto("A1")), segmento2(figura.punto("V1"), figura.punto("A1")), segmento2(figura.punto("V1"), proy_planta(B)), segmento2(figura.punto("V1"), proy_planta(C))]'
            porque: |
              **Lo visto y lo oculto, en la planta.** Desde arriba se ven las caras VAB y VCA, que miran
              hacia arriba: sus aristas AB, CA, VA, VB y VC, en continua.
          - con: arista-oculta
            traza: segmento2(proy_planta(B), proy_planta(C))
            porque: |
              BC queda debajo de esas dos caras, entre las que la base y la cara VBC miran hacia abajo: a
              trazos.
          - con: arista-vista
            traza: '[segmento2(figura.punto("A2"), proy_alzado(B)), segmento2(proy_alzado(B), proy_alzado(C)), segmento2(proy_alzado(C), figura.punto("A2")), segmento2(figura.punto("V2"), figura.punto("A2")), segmento2(figura.punto("V2"), proy_alzado(B))]'
            porque: |
              **En el alzado** se ven la base y la cara VAB, que miran hacia delante: la base entera, VA y VB,
              en continua.
          - con: arista-oculta
            traza: segmento2(figura.punto("V2"), proy_alzado(C))
            porque: |
              VC queda detrás de la base y de la cara VAB: a trazos.
        pista: |
          (1) Vista 4: perpendiculares a la primera línea nueva desde V₂, Q₂ y A₂; V₄ en la línea, y Q₄ y A₄
          a lo que Q₁ y A₁ están por debajo de la horizontal de V₁. (2) El canto: la perpendicular a e₄ por
          A₄. (3) Vista 5: V₅ donde e₄ corta la segunda línea; A₅ a lo que A₂ dista de e₂. (4) Circunferencia
          de centro V₅ y radio V₅A₅; con centro en el opuesto de A₅, B₅ y C₅. (5) Vuelta: al canto, al
          alzado (desde e₂ lo que distan de la segunda línea) y a la planta (desde la horizontal de V₁ lo que
          distan de la primera).
        desarrollo: |
          En verde claro, las vistas 4 y 5 y la pirámide en las dos vistas, con lo oculto a trazos: BC en la
          planta y VC en el alzado. En la vista 4, e está en verdadera magnitud y la base de canto; en la 5,
          e de punta y la base en verdadera magnitud, un triángulo equilátero de 61,44 mm de lado.

      - tipo: calcular
        titulo: El lado de la base
        pregunta: ¿Cuánto mide el lado de la base en verdadera magnitud?
        respuesta:
          tipo: numero
          valor: '61.44'
          receta: lado_mm
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '59.13'
            receta: en_mm(vm_planta(A, B))
            mensaje: |
              Eso es lo que mide **A₁B₁ en la planta**. La base no es horizontal, y la planta acorta sus
              lados, unos más que otros: en la planta el triángulo no es equilátero.
          - valor: '29.75'
            receta: en_mm(vm_alzado(B, C))
            mensaje: |
              Eso es **B₂C₂ en el alzado**, que acorta mucho: BC forma 61° con el plano vertical, y el
              alzado la deja en menos de la mitad.
          - valor: '35.47'
            receta: en_mm(vm(O, A))
            mensaje: |
              Eso es el **radio**, V₅A₅ en la vista 5: la distancia del centro a un vértice. El lado del
              triángulo equilátero es el radio por raíz de tres.
          - valor: '63.44'
            receta: en_mm(vm(V, A))
            mensaje: |
              Esa es una **arista lateral**, VA, en verdadera magnitud. El lado es una arista de la base, que
              se ve entera en la vista 5.
        pista: |
          En la vista 5 la base está en verdadera magnitud: mide B₅C₅, o el radio V₅A₅ por raíz de tres.
        desarrollo: |
          La base es un triángulo equilátero inscrito en la circunferencia de radio V₅A₅ = 35,47 mm:

          $$ \ell = \sqrt{3}\; r = \sqrt{3} \cdot 35{,}47 \approx 61{,}44 \text{ mm} $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: 'La pirámide es recta y la base es un triángulo equilátero con el centro en e, en el plano perpendicular a e por A.'
          - texto: 'Con un cambio de plano paralelo a e₂, e sale en verdadera magnitud y la base, perpendicular a ella, de canto.'
          - texto: 'Con un segundo cambio, perpendicular a e₄, e sale de punta y la base en verdadera magnitud: ahí se dibuja el triángulo con el compás.'
          - texto: 'B y C vuelven por el mismo camino: al canto de la vista 4, al alzado y a la planta.'
          - texto: 'La base es perpendicular a e, así que se dibuja en la vista 4, la que deja e en verdadera magnitud.'
            trampa: true
            mensaje: |
              En la vista 4 la base es perpendicular a una recta en verdadera magnitud, y por eso se ve de
              canto, como una recta: ahí no cabe el triángulo. Se ve con su forma donde e se ve de punta.
    resolucion: |
      **Lo que dan los datos.** e es el eje de la pirámide, con V en su extremo de arriba, y A un vértice
      de la base. La base es un triángulo equilátero con el centro en e, en el plano perpendicular a e por
      A: es la lectura que tomamos (Notas nuestras).

      **Dos cambios de plano.** Con la primera línea nueva paralela a e₂ y V de referencia, cada punto
      sale de su alzado por la perpendicular a la línea y se aparta de ella lo que su planta está por
      debajo de la horizontal de V₁: e₄, por V₄ y Q₄, está en verdadera magnitud, y la base, perpendicular
      a ella por A₄, de canto. Con la segunda línea perpendicular a e₄, e se ve de punta en V₅, y A₅ se
      aparta de la línea lo que A₂ dista de e₂.

      **La base.** En la vista 5 está en verdadera magnitud: la circunferencia de centro V₅ y radio V₅A₅,
      y el arco de centro A₅′, el opuesto de A₅, dan B₅ y C₅. De vuelta, B₄ y C₄ en el canto; B₂ y C₂,
      desde e₂, a lo que B₅ y C₅ distan de la segunda línea; B₁ y C₁, desde la horizontal de V₁, a lo que
      B₄ y C₄ distan de la primera, C₁ por encima, porque C está más lejos que V.

      **Lo visto y lo oculto.** En la planta se ven las caras VAB y VCA, y BC va a trazos; en el alzado,
      la base y la cara VAB, y VC va a trazos.

      **El lado.** V₅A₅ mide 35,47 mm, y el lado, raíz de tres veces eso: 61,44 mm.

  - id: sd54-la-recta-paralela-al-plano-y-su-distancia
    titulo: La recta r paralela al plano ABC por P, y su distancia al plano
    fuente: Ejercicio 38 (SD54) · Colección de ejercicios de Geometría Descriptiva, Sistema Diédrico Directo · Dpto. de Expresión Gráfica y Proyectos de Ingeniería, EIG · UPV/EHU
    nivel: practica
    # Decisión: el texto impreso tal cual, cotejado con la página (pág. 39).
    # Cada apartado en su párrafo, para que el Markdown no los junte. Los
    # nombres M, N, D, E, F, G, H y los puntos 1, 2 y 3 son nuestros.
    enunciado: |
      Se presentan las proyecciones diédricas del plano ABC y el punto P, así como la proyección
      horizontal de la recta r que pasa por P. Se pide:

      a) Representar la recta r paralela al plano que pase por el punto P.

      b) Calcular la distancia entre la recta r y el plano ABC.

      **Notas nuestras.** La figura es el triángulo ABC, con el alzado arriba y la planta debajo, y el punto P, con su cruz en las dos vistas, por encima del triángulo en las dos. r₁, la
      planta de r, es una recta horizontal en el papel que pasa por P₁, por encima de la planta del
      triángulo; r₂ no está dibujada, y es lo que pide a). Escala 1:1: lo que mides en la lámina, en
      milímetros, es el resultado. Llamamos M₁ y N₁ a los extremos izquierdo y derecho de r₁, y M y N a
      los puntos de r que tienen esas plantas: r₂ se representa de M₂ a N₂. Los nombres M, N, D, E, F,
      G y H, y los de los puntos 1, 2 y 3, son nuestros.
    pide: r₂, de M₂ a N₂; el plano de canto en la vista nueva de un cambio de plano, con A₄, B₄ y C₄, y el pie H₄ de la perpendicular desde P₄; la distancia de r al plano, en mm.
    receta:
      lamina: sd54
      escena:
        A: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("A1"))'
        B: 'punto3(alzado: figura.punto("B2"), planta: figura.punto("B1"))'
        C: 'punto3(alzado: figura.punto("C2"), planta: figura.punto("C1"))'
        P: 'punto3(alzado: figura.punto("P2"), planta: figura.punto("P1"))'
        abc: plano(A, B, C)
      solucion:
        # a) r₁ es horizontal: r es frontal, con el alejamiento de P. Paralela
        # al plano, tiene la dirección de las frontales del plano. Se construye
        # con la frontal por C, que corta AB en D (la horizontal del papel por
        # C₁ corta A₁B₁ en D₁). Para la receta, r es la recta del plano
        # paralelo a ABC por P que tiene la planta r₁: M y N, sus puntos sobre
        # los extremos de r₁.
        f: frontal_por(C, abc)
        D: pie_comun(recta3(A, B), f)
        par: plano_perpendicular_a_recta(P, perpendicular_a_plano(P, abc))
        M: 'punto_en_plano(planta: figura.punto("M1"), plano: par)'
        N: 'punto_en_plano(planta: figura.punto("N1"), plano: par)'
        r: recta3(M, N)
        r2: segmento2(proy_alzado(M), proy_alzado(N))
        f2: segmento2(figura.punto("C2"), proy_alzado(D))
        # b) La distancia de r al plano es la de cualquier punto de r, P.
        H: pie_en_plano(P, abc)
        d_mm: en_mm(distancia_a_plano(P, abc))
        # Decisión: el método es el de las diapositivas de distancias (pág. 9):
        # el plano proyectante con un cambio de plano. Como r es frontal y
        # paralela a las frontales del plano, un cambio HORIZONTAL con la línea
        # nueva perpendicular a r₂ deja de punta a r y a la frontal CD, y de
        # canto al plano. El enunciado no dice dónde va la línea nueva: la
        # fijamos en el intro perpendicular a r₂ por el punto de r₂ prolongada
        # que está 10 mm más allá de N₂, con P de referencia, que cae en ese
        # mismo punto: P₄. Más cerca, la vertical de N₁ cortaría el canto junto
        # a B₄.
        P_4: 'uno(medir_sobre(r2, desde: proy_alzado(N), distancia: mm(10)), 1)'
        nueva: 'perpendicular(por: P_4, a: r2)'
        A_4: 'cambio_plano_horizontal(A, nueva, ref: P)'
        B_4: 'cambio_plano_horizontal(B, nueva, ref: P)'
        C_4: 'cambio_plano_horizontal(C, nueva, ref: P)'
        D_4: 'cambio_plano_horizontal(D, nueva, ref: P)'
        canto: segmento2(B_4, A_4)
        H_4: pie_perpendicular(P_4, canto)
        # Los pies de C₂, A₂ y B₂ en la línea nueva (los puntos 1, 2 y 3), desde
        # los que el compás lleva lo que cada alejamiento supera al de P. Como
        # r es frontal, ese exceso se lee en la planta: de C₁, A₁ y B₁ a r₁, por
        # su vertical (E, F y G).
        K1: 'pie_perpendicular(figura.punto("C2"), nueva)'
        K2: 'pie_perpendicular(figura.punto("A2"), nueva)'
        K3: 'pie_perpendicular(figura.punto("B2"), nueva)'
        E: 'pie_perpendicular(figura.punto("C1"), figura.segmento("r1"))'
        F: 'pie_perpendicular(figura.punto("A1"), figura.segmento("r1"))'
        G: 'pie_perpendicular(figura.punto("B1"), figura.segmento("r1"))'
        lleva_C: 'vm_planta(C, punto3(alzado: E, planta: E))'
        lleva_A: 'vm_planta(A, punto3(alzado: F, planta: F))'
        lleva_B: 'vm_planta(B, punto3(alzado: G, planta: G))'
        projA: 'perpendicular(por: figura.punto("A2"), a: nueva)'
        projB: 'perpendicular(por: figura.punto("B2"), a: nueva)'
        perpP: 'perpendicular(por: P_4, a: canto)'
        # Los errores. r₂ paralela a C₂B₂, que es lo que sale si D₁ se sube a
        # C₂B₂ en vez de a A₂B₂.
        parCB: 'perpendicular(por: figura.punto("P2"), a: perpendicular(por: figura.punto("P2"), a: figura.segmento("CB2")))'
        # P₄ llevado al canto por la paralela a r₂ (en alejamiento): el punto
        # del plano con el alzado de P, en la vista nueva.
        Y: 'punto_en_plano(alzado: figura.punto("P2"), plano: abc)'
        X_4: 'cambio_plano_horizontal(Y, nueva, ref: P)'
        # La separación de r₂ y f₂ en el alzado: el pie de P₂ en f₂, como punto
        # del plano, para medirla con vm_alzado.
        Xg: 'punto_en_plano(alzado: pie_perpendicular(figura.punto("P2"), f2), plano: abc)'
        # Los extremos de las rectas largas de la construcción: en el papel se
        # trazan más allá del punto que van a dar, y no paran en él.
        L_f1: 'desplaza(proy_planta(D), dx: mm(4))'
        L_vD: 'desplaza(proy_alzado(D), dy: mm(-4))'
        L_rI: 'uno(medir_sobre(r2, desde: proy_alzado(M), distancia: mm(4)), 2)'
        L_rD: 'uno(medir_sobre(r2, desde: P_4, distancia: mm(4)), 1)'
        L_vM: 'desplaza(proy_alzado(M), dy: mm(-4))'
        L_vN: 'desplaza(proy_alzado(N), dy: mm(-4))'
        n_a: 'uno(medir_sobre(nueva, desde: P_4, distancia: mm(4)), 2)'
        n_b: 'uno(medir_sobre(nueva, desde: K3, distancia: mm(4)), 1)'
        L_pC: 'uno(medir_sobre(f2, desde: C_4, distancia: mm(3)), 1)'
        L_pA: 'uno(medir_sobre(segmento2(figura.punto("A2"), A_4), desde: A_4, distancia: mm(3)), 1)'
        L_pB: 'uno(medir_sobre(segmento2(figura.punto("B2"), B_4), desde: B_4, distancia: mm(3)), 1)'
        L_E: 'desplaza(E, dy: mm(-3))'
        L_F: 'desplaza(F, dy: mm(-3))'
        L_G: 'desplaza(G, dy: mm(-3))'
        L_H: 'uno(medir_sobre(segmento2(P_4, H_4), desde: H_4, distancia: mm(2)), 1)'
      comprueba:
        # D está en AB y en el plano; P, en r; H, en el plano.
        - en_plano(D, abc)
        - en_recta(P, r)
        - en_plano(H, abc)
    pasos:
      - tipo: reconocer
        pregunta: r₁ es horizontal en el papel. ¿Qué dice eso de r, y a qué rectas del plano tiene que ser paralela para serlo al plano?
        opciones:
          - texto: r es frontal, y tiene que ser paralela a las frontales del plano; r₂ va paralela a f₂
            correcta: true
            mensaje: |
              Eso es. Con r₁ horizontal en el papel, todos los puntos de r tienen el mismo alejamiento: es
              una frontal. Una recta es paralela a un plano si lo es a una recta del plano, y una frontal
              solo puede serlo a otra frontal, porque las demás rectas del plano no tienen la planta
              horizontal. r₂ va, por tanto, paralela a f₂, el alzado de una frontal del plano.
          - texto: r es horizontal, y tiene que ser paralela a las horizontales del plano; r₂ va horizontal, como h₂
            mensaje: |
              Una horizontal tiene horizontal el **alzado**, porque lo que no cambia es la cota. Aquí lo
              horizontal es la planta: lo que no cambia es el alejamiento, y r es frontal. Las
              horizontales de este plano tienen la planta inclinada, y r₁ no puede ser paralela a ellas.
          - texto: Basta con que r₂ sea paralela a un lado del triángulo en el alzado, por ejemplo a C₂B₂, porque r₁ ya viene dada
            mensaje: |
              Para que r sea paralela a un lado, tiene que serlo en las dos vistas: r₁ también tendría que
              ser paralela a la planta de ese lado, y ninguno de los tres tiene la planta horizontal, como
              r₁. La recta del plano que sí la tiene es la frontal, y esa hay que construirla.

      # Decisión: un solo paso construir, con r₂ y el cambio de plano. El
      # reproductor arranca cada paso desde la lámina, y la línea nueva se
      # traza perpendicular a r₂ y se fija desde N₂. P₄ no es objetivo: lo
      # fija el intro (P es la referencia y cae en el punto que fija la línea
      # nueva), y va como marca de la construcción. Sin paso dibujar: r no se
      # cruza con el triángulo en ninguna de las dos vistas (segundo camino),
      # así que no hay tramo oculto.
      - tipo: construir
        titulo: r₂, y el plano de canto en un cambio de plano
        intro: |
          a) r₁ es horizontal: r es frontal, y paralela al plano solo si lo es a sus frontales. Traza la
          frontal del plano por C, que corta AB en D, y por P₂ la paralela a f₂ = C₂D₂: es r₂. Marca sus
          extremos M₂ y N₂, en las verticales de M₁ y N₁, los extremos de r₁. b) Para la distancia, el
          plano se pone proyectante con un cambio de plano horizontal: con la línea nueva perpendicular a
          r₂, la vista nueva deja de punta a r y a las frontales del plano, y de canto al plano. El
          enunciado no dice dónde va: la fijamos perpendicular a r₂ por el punto de r₂ prolongada que está
          10 mm más allá de N₂, y P es la referencia, así que P₄ cae ahí mismo. Cada punto sale de su
          alzado por la paralela a r₂ y se aparta de la línea nueva, hacia fuera, lo que su alejamiento
          supera al de P, que es el de toda r: en la planta, lo que el punto está por debajo de r₁. Marca
          C₄ (que es también D₄), A₄ y B₄, y H₄, el pie de la perpendicular desde P₄ al canto. Avisos para
          el imán: H₄ cae a 3,8 mm de C₄; B₄, a 3,3 mm de donde la paralela a r₂ por B₂ corta la línea nueva, y la paralela a r₂ por
          A₂ cruza la vertical de N₁ a 4,9 mm de N₂. Amplía con la lupa (×4) antes de marcarlos.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, borrar]
        tolerancia: 1
        objetivos:
          - nombre: M2
            pide: el extremo izquierdo de r₂, en la vertical de M₁
            es: proy_alzado(solucion.M)
            bien: |
              M₂ está en la vertical de M₁, sobre la paralela a f₂ por P₂. r₂ baja hacia la derecha a
              30,7° en el papel, como f₂, y r₁ es horizontal, como f₁: r y la frontal CD son paralelas.
            diagnosticos:
              - si: en_recta(solucion.parCB)
                mensaje: |
                  Has trazado r₂ paralela a **C₂B₂**, que es lo que sale si D₁ se sube a C₂B₂. D₁ está en
                  A₁B₁, y su alzado, en A₂B₂. Además, para que r fuera paralela a CB, r₁ tendría que ser
                  paralela a C₁B₁, y es horizontal: la recta del plano con la planta horizontal es la
                  **frontal** CD.
                ejemplo: 'uno(medir_sobre(solucion.parCB, desde: figura.punto("P2"), distancia: mm(39)), 1)'
              - si: 'en_horizontal_de(figura.punto("P2"))'
                mensaje: |
                  Con r₂ horizontal, r sería paralela a los dos planos de proyección, y el plano ABC no tiene
                  ninguna recta así: no sería paralela al plano. Lo horizontal de r es la planta; el alzado
                  va paralelo a f₂, el de la frontal del plano.
                ejemplo: 'desplaza(figura.punto("P2"), dx: mm(-28))'
              - si: '!en_vertical_de(figura.punto("M1"))'
                mensaje: |
                  M₂ va en la **vertical de M₁**: es el punto de r que tiene por planta el extremo izquierdo
                  de r₁.
                ejemplo: 'uno(medir_sobre(solucion.r2, desde: proy_alzado(solucion.M), distancia: mm(5)), 1)'
              - si: siempre
                mensaje: |
                  Estás en la vertical de M₁, pero no en r₂. r₂ pasa por P₂, paralela a f₂: donde corta esa
                  vertical está M₂.
          - nombre: N2
            pide: el extremo derecho de r₂, en la vertical de N₁
            es: proy_alzado(solucion.N)
            bien: |
              N₂ está en la vertical de N₁, sobre la paralela a f₂ por P₂. M₂N₂ es r₂: con r₁, la recta r,
              paralela al plano ABC.
            diagnosticos:
              - si: en_recta(solucion.parCB)
                mensaje: |
                  Has trazado r₂ paralela a **C₂B₂**, que es lo que sale si D₁ se sube a C₂B₂. D₁ está en
                  A₁B₁, y su alzado, en A₂B₂. Para que r fuera paralela a CB, r₁ tendría que ser paralela a
                  C₁B₁, y es horizontal: la recta del plano con la planta horizontal es la **frontal** CD.
                ejemplo: 'uno(medir_sobre(solucion.parCB, desde: figura.punto("P2"), distancia: mm(65)), 2)'
              - si: 'en_horizontal_de(figura.punto("P2"))'
                mensaje: |
                  Con r₂ horizontal, r sería paralela a los dos planos de proyección, y el plano ABC no tiene
                  ninguna recta así. Lo horizontal de r es la planta; el alzado va paralelo a f₂.
                ejemplo: 'desplaza(figura.punto("P2"), dx: mm(49))'
              - si: '!en_vertical_de(figura.punto("N1"))'
                mensaje: |
                  N₂ va en la **vertical de N₁**: es el punto de r que tiene por planta el extremo derecho de
                  r₁.
                ejemplo: 'uno(medir_sobre(solucion.r2, desde: proy_alzado(solucion.N), distancia: mm(5)), 2)'
              - si: siempre
                mensaje: |
                  Estás en la vertical de N₁, pero no en r₂. r₂ pasa por P₂, paralela a f₂: donde corta esa
                  vertical está N₂.
          - nombre: C4
            pide: C en la vista nueva, que es también D, porque la frontal CD se ve de punta
            es: solucion.C_4
            bien: |
              C₄ ≡ D₄ está en f₂ prolongada, que es la paralela a r₂ por C₂ y por D₂, a 15,24 mm de la línea
              nueva, hacia fuera: lo que C₁ está por debajo de r₁, C₁E. La frontal CD se ve de punta, como r.
            diagnosticos:
              - si: cerca_de(solucion.K1)
                mensaje: |
                  Has dejado C₄ en la línea nueva, como si C fuera la referencia. La referencia es P: C se
                  aparta de la línea lo que su alejamiento supera al de P, que en la planta es C₁E.
                ejemplo: solucion.K1
              - si: 'en_recta(solucion.f2) && a_distancia(de: solucion.K1, d: diferencia_de_cotas(C, P))'
                mensaje: |
                  Has llevado lo que C está **más bajo** que P, su diferencia de cotas. En un cambio de plano
                  horizontal la vista nueva sale del alzado, y lo que se lleva es lo que el alzado no enseña:
                  el **alejamiento**, que está en la planta.
                ejemplo: 'uno(medir_sobre(solucion.f2, desde: solucion.K1, distancia: diferencia_de_cotas(C, P)), 1)'
              - si: 'cerca_de(uno(medir_sobre(solucion.f2, desde: solucion.K1, distancia: solucion.lleva_C), 2))'
                mensaje: |
                  Llevas bien lo que C supera a P en alejamiento, pero **hacia el alzado**. Cada punto se
                  aparta de la línea nueva hacia fuera, al lado contrario del alzado, lo que su alejamiento
                  supera al de la referencia; C tiene más que P, y va hacia fuera.
                ejemplo: 'uno(medir_sobre(solucion.f2, desde: solucion.K1, distancia: solucion.lleva_C), 2)'
              - si: '!en_recta(solucion.f2)'
                mensaje: |
                  C₄ sale de C₂ por la perpendicular a la línea nueva, que es la paralela a r₂ por C₂: f₂
                  prolongada, porque f₂ es paralela a r₂. D₄ sale por la misma recta, y cae en el mismo punto.
                ejemplo: 'desplaza(solucion.C_4, dy: mm(-6))'
              - si: siempre
                mensaje: |
                  Estás en f₂ prolongada, pero no a la distancia buena de la línea nueva: lo que C₁ está por
                  debajo de r₁, C₁E, con el compás desde el punto 1, hacia fuera.
          - nombre: A4
            pide: A en la vista nueva
            es: solucion.A_4
            bien: |
              A₄ está en la paralela a r₂ por A₂, a 32,68 mm de la línea nueva, hacia fuera: lo que A₁ está
              por debajo de r₁, A₁F.
            diagnosticos:
              - si: cerca_de(solucion.K2)
                mensaje: |
                  Has dejado A₄ en la línea nueva, como si A fuera la referencia. La referencia es P: A se
                  aparta lo que su alejamiento supera al de P, A₁F en la planta.
                ejemplo: solucion.K2
              - si: 'en_recta(solucion.projA) && a_distancia(de: solucion.K2, d: diferencia_de_cotas(A, P))'
                mensaje: |
                  Has llevado lo que A está más bajo que P, su diferencia de cotas. En un cambio horizontal se
                  lleva el **alejamiento**, que se mide en la planta: A₁F.
                ejemplo: 'uno(medir_sobre(solucion.projA, desde: solucion.K2, distancia: diferencia_de_cotas(A, P)), 2)'
              - si: 'cerca_de(uno(medir_sobre(solucion.projA, desde: solucion.K2, distancia: solucion.lleva_A), 1))'
                mensaje: |
                  Llevas bien A₁F, pero **hacia el alzado**. A tiene más alejamiento que P, y se aparta de la
                  línea nueva hacia fuera, al lado contrario del alzado.
                ejemplo: 'uno(medir_sobre(solucion.projA, desde: solucion.K2, distancia: solucion.lleva_A), 1)'
              - si: '!en_recta(solucion.projA)'
                mensaje: |
                  A₄ sale de A₂ por la **perpendicular a la línea nueva**, que es la paralela a r₂ por A₂.
                ejemplo: 'desplaza(solucion.A_4, dy: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la paralela a r₂ por A₂, pero no a la distancia buena: A₁F, con el compás desde el
                  punto 2, hacia fuera.
          - nombre: B4
            pide: B en la vista nueva
            es: solucion.B_4
            bien: |
              B₄ está en la paralela a r₂ por B₂, a 3,26 mm de la línea nueva, hacia fuera: lo que B₁ está por
              debajo de r₁, B₁G. A₄, B₄ y C₄ quedan en línea: el plano, de canto.
            diagnosticos:
              - si: cerca_de(solucion.K3)
                mensaje: |
                  Ese es el punto 3, en la línea nueva: B quedaría con el alejamiento de P. B₁ está 3,26 mm por
                  debajo de r₁, y B₄ se aparta eso de la línea, hacia fuera.
                ejemplo: solucion.K3
              - si: 'en_recta(solucion.projB) && a_distancia(de: solucion.K3, d: diferencia_de_cotas(B, P))'
                mensaje: |
                  Has llevado lo que B está más bajo que P, su diferencia de cotas, 58,8 mm. En un cambio
                  horizontal se lleva el **alejamiento**: B₁G, en la planta.
                ejemplo: 'uno(medir_sobre(solucion.projB, desde: solucion.K3, distancia: diferencia_de_cotas(B, P)), 2)'
              - si: 'cerca_de(uno(medir_sobre(solucion.projB, desde: solucion.K3, distancia: solucion.lleva_B), 1))'
                mensaje: |
                  Llevas bien B₁G, pero **hacia el alzado**. B tiene más alejamiento que P, y va hacia fuera,
                  como A y C: los tres quedan del mismo lado de la línea nueva.
                ejemplo: 'uno(medir_sobre(solucion.projB, desde: solucion.K3, distancia: solucion.lleva_B), 1)'
              - si: '!en_recta(solucion.projB)'
                mensaje: |
                  B₄ sale de B₂ por la **perpendicular a la línea nueva**, que es la paralela a r₂ por B₂.
                ejemplo: 'desplaza(solucion.B_4, dy: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la paralela a r₂ por B₂, pero no a la distancia buena: B₁G, con el compás desde el
                  punto 3, hacia fuera.
          - nombre: H4
            pide: el pie de la perpendicular desde P₄ al canto del plano
            es: solucion.H_4
            bien: |
              H₄ está en el canto B₄A₄, al pie de la perpendicular desde P₄. P₄ es la recta r entera y el canto,
              el plano entero: P₄H₄ es su distancia en verdadera magnitud, 25,76 mm.
            diagnosticos:
              - si: cerca_de(solucion.X_4)
                mensaje: |
                  Has ido de P₄ al canto prolongado por la paralela a r₂, que es la dirección en que se llevan
                  los alejamientos. Así se mide la distancia de frente, no la más corta: esa va por la
                  **perpendicular al canto**.
                ejemplo: solucion.X_4
              - si: en_recta(solucion.canto)
                mensaje: |
                  Estás en el canto, pero no al pie de la perpendicular desde P₄. Con la escuadra apoyada en el
                  canto, la perpendicular por P₄: donde lo corta está H₄.
                ejemplo: 'uno(medir_sobre(solucion.canto, desde: solucion.H_4, distancia: mm(6)), 1)'
              - si: en_recta(solucion.perpP)
                mensaje: |
                  Vas por la perpendicular al canto desde P₄, pero H₄ es donde lo corta, ni antes ni después.
                ejemplo: punto_medio(segmento2(solucion.P_4, solucion.H_4))
              - si: siempre
                mensaje: |
                  H₄ está en el canto B₄A₄, que pasa por C₄, y en la perpendicular a él que pasa por P₄.
        trazado:
          - solucion.r2
          - solucion.canto
          - segmento2(solucion.P_4, solucion.H_4)
        construccion:
          - con: marca
            traza: figura.punto("M1")
            rotulo: M₁
            porque: |
              **a) r₂.** M₁ y N₁, nombres nuestros, son los extremos de r₁. M₁, el izquierdo: r₂ se dibujará
              entre las verticales de los dos.
          - con: marca
            traza: figura.punto("N1")
            rotulo: N₁
            porque: |
              N₁, el extremo derecho de r₁. r₁ es horizontal en el papel: todos los puntos de r tienen el
              alejamiento de P, y r es una frontal.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("C1"), solucion.L_f1)
            guia: figura.segmento("r1")
            rotulo: f₁
            porque: |
              r es frontal, y una frontal solo es paralela a otra frontal, así que hace falta una **frontal del plano**. f₁,
              su planta por C₁: la paralela a r₁, horizontal en el papel, hasta pasar A₁B₁.
          - con: marca
            traza: proy_planta(solucion.D)
            rotulo: D₁
            porque: |
              D₁, nombre nuestro, donde f₁ corta A₁B₁: D es el punto de AB con el alejamiento de C.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.D), solucion.L_vD)
            guia: figura.segmento("r1")
            porque: |
              Por D₁, la vertical hasta el alzado, más allá de A₂B₂: D está en AB, y su alzado, en A₂B₂.
          - con: marca
            traza: proy_alzado(solucion.D)
            rotulo: D₂
            porque: |
              D₂, donde la vertical de D₁ corta A₂B₂.
          - con: regla
            traza: solucion.f2
            rotulo: f₂
            porque: |
              f₂, de C₂ a D₂: el alzado de la frontal CD del plano, que el alzado enseña en verdadera
              magnitud. r tiene que ser paralela a ella.
          - con: escuadra-cartabon
            traza: '[segmento2(figura.punto("P2"), solucion.L_rI), segmento2(figura.punto("P2"), solucion.L_rD)]'
            guia: solucion.f2
            rotulo: r₂
            porque: |
              Por P₂, la paralela a f₂: es r₂. r₁ es paralela a f₁ y r₂ a f₂, así que r es paralela a la
              frontal CD, que está en el plano. Larga hacia los dos lados: a la derecha hará falta prolongada.
          - con: escuadra-cartabon
            traza: '[segmento2(figura.punto("M1"), solucion.L_vM), segmento2(figura.punto("N1"), solucion.L_vN)]'
            guia: figura.segmento("r1")
            porque: |
              Por M₁ y por N₁, las verticales hasta pasar r₂: los extremos de r₂ están encima de los de r₁.
          - con: marca
            traza: proy_alzado(solucion.M)
            rotulo: M₂
            porque: |
              M₂, donde la vertical de M₁ corta r₂.
          - con: marca
            traza: proy_alzado(solucion.N)
            rotulo: N₂
            porque: |
              N₂, donde la vertical de N₁ corta r₂. M₂N₂ y M₁N₁ son r, paralela al plano ABC.
          - con: compas
            traza: 'arco(proy_alzado(solucion.N), por: solucion.P_4, desde: uno(medir_sobre(solucion.nueva, desde: solucion.P_4, distancia: mm(1.5)), 1), hasta: uno(medir_sobre(solucion.nueva, desde: solucion.P_4, distancia: mm(1.5)), 2))'
            porque: |
              **b) La distancia.** El plano se pone proyectante con un cambio de plano horizontal, y la
              línea nueva va perpendicular a r₂. Donde va lo fijamos: con el compás abierto 10 mm sobre la
              regla y centro en N₂, el arco que corta r₂ prolongada, más allá de N₂.
          - con: marca
            traza: solucion.P_4
            rotulo: P₄
            porque: |
              P₄, donde el arco corta r₂ prolongada. P es la referencia, así que P₄ cae en la línea nueva; y sale de P₂ por
              la paralela a r₂, que es r₂ misma: P₄ es este punto.
          - con: escuadra-cartabon
            traza: '[segmento2(solucion.P_4, solucion.n_a), segmento2(solucion.P_4, solucion.n_b)]'
            guia: solucion.r2
            rotulo: línea nueva
            porque: |
              La **línea nueva**, perpendicular a r₂ por P₄, larga hacia abajo. La vista nueva mira a lo largo de r₂,
              perpendicular a la línea nueva: r se reduce a un punto, y las frontales del plano también, así que el plano se
              verá de canto.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_alzado(solucion.D), solucion.L_pC), segmento2(figura.punto("A2"), solucion.L_pA), segmento2(figura.punto("B2"), solucion.L_pB)]'
            guia: solucion.r2
            porque: |
              Desde el alzado, las perpendiculares a la línea nueva, que son las paralelas a r₂: la de C y D
              es f₂ prolongada desde D₂, y las otras dos, por A₂ y por B₂. Largas, más allá de la línea nueva.
          - con: marca
            traza: solucion.K1
            rotulo: '1'
            porque: |
              1, nombre nuestro, donde f₂ prolongada corta la línea nueva: desde aquí se llevará el
              alejamiento de C, y el de D, que es el mismo.
          - con: marca
            traza: solucion.K2
            porque: |
              2, nombre nuestro, donde la paralela a r₂ por A₂ corta la línea nueva. Va sin rótulo, porque
              P₄, a 4,2 mm, lo taparía.
          - con: marca
            traza: solucion.K3
            rotulo: '3'
            porque: |
              3, nombre nuestro, donde la paralela a r₂ por B₂ corta la línea nueva.
          - con: escuadra-cartabon
            traza: '[segmento2(figura.punto("C1"), solucion.L_E), segmento2(figura.punto("A1"), solucion.L_F), segmento2(figura.punto("B1"), solucion.L_G)]'
            guia: figura.segmento("r1")
            porque: |
              Lo que lleva cada punto es su alejamiento contado desde el de P, que es el de toda r: en la
              planta, lo que está por debajo de r₁. Por C₁, A₁ y B₁, las verticales hasta pasar r₁.
          - con: marca
            traza: solucion.E
            rotulo: E
            porque: |
              E, nombre nuestro, donde la vertical de C₁ corta r₁: C₁E es lo que el alejamiento de C supera al
              de P, 15,24 mm.
          - con: marca
            traza: solucion.F
            rotulo: F
            porque: |
              F, nombre nuestro, donde la vertical de A₁ corta r₁: A₁F, 32,68 mm.
          - con: marca
            traza: solucion.G
            rotulo: G
            porque: |
              G, nombre nuestro, donde la vertical de B₁ corta r₁: B₁G, 3,26 mm. B es el vértice con menos
              alejamiento, el que más se acerca a r en la planta.
          - con: compas
            traza: 'arco(solucion.K1, por: solucion.C_4, desde: uno(medir_sobre(perpendicular(por: solucion.C_4, a: solucion.f2), desde: solucion.C_4, distancia: mm(2)), 1), hasta: uno(medir_sobre(perpendicular(por: solucion.C_4, a: solucion.f2), desde: solucion.C_4, distancia: mm(2)), 2))'
            toma: segmento2(figura.punto("C1"), solucion.E)
            porque: |
              Con el compás, C₁E, y centro en 1: el arco corta f₂ prolongada a los dos lados de la línea
              nueva, y vale el de fuera, el contrario al alzado, porque C tiene más alejamiento que P.
          - con: marca
            traza: solucion.C_4
            porque: |
              C₄ ≡ D₄, donde el arco corta f₂ prolongada por fuera: la frontal CD, vista de punta. Va sin
              rótulo, porque H₄ caerá a 3,8 mm.
          - con: compas
            traza: 'arco(solucion.K2, por: solucion.A_4, desde: uno(medir_sobre(perpendicular(por: solucion.A_4, a: solucion.projA), desde: solucion.A_4, distancia: mm(3)), 1), hasta: uno(medir_sobre(perpendicular(por: solucion.A_4, a: solucion.projA), desde: solucion.A_4, distancia: mm(3)), 2))'
            toma: segmento2(figura.punto("A1"), solucion.F)
            porque: |
              Con el compás, A₁F, y centro en 2, por fuera: A también tiene más alejamiento que P.
          - con: marca
            traza: solucion.A_4
            rotulo: A₄
            porque: |
              A₄, donde el arco corta la paralela a r₂ por A₂, por fuera de la línea nueva.
          - con: compas
            traza: 'arco(solucion.K3, por: solucion.B_4, desde: uno(medir_sobre(perpendicular(por: solucion.B_4, a: solucion.projB), desde: solucion.B_4, distancia: mm(0.5)), 1), hasta: uno(medir_sobre(perpendicular(por: solucion.B_4, a: solucion.projB), desde: solucion.B_4, distancia: mm(0.5)), 2))'
            toma: segmento2(figura.punto("B1"), solucion.G)
            porque: |
              Con el compás, B₁G, que es corto, y centro en 3, por fuera, como los otros dos.
          - con: marca
            traza: solucion.B_4
            rotulo: B₄
            porque: |
              B₄, donde el arco corta la paralela a r₂ por B₂, por fuera de la línea nueva.
          - con: regla
            traza: solucion.canto
            porque: |
              B₄A₄, y pasa por C₄: los tres vértices en línea son el plano visto **de canto**. Si no salieran
              en línea, algún alejamiento estaría mal llevado.
          - con: escuadra-cartabon
            traza: segmento2(solucion.P_4, solucion.L_H)
            guia: solucion.canto
            porque: |
              Por P₄, la perpendicular al canto, hasta pasarlo. En esta vista P₄ es toda la recta r y el canto
              es todo el plano, y la perpendicular entre los dos está en verdadera magnitud.
          - con: marca
            traza: solucion.H_4
            rotulo: H₄
            porque: |
              H₄, nombre nuestro, donde la perpendicular corta el canto: P₄H₄ es la distancia de r al plano,
              25,76 mm, la que se mide con la regla.
        pista: |
          (1) Por C₁, la horizontal hasta A₁B₁: D₁; súbelo a A₂B₂ y une C₂D₂, que es f₂. (2) Por P₂, la
          paralela a f₂: r₂, entre las verticales de M₁ y N₁. (3) La línea nueva, perpendicular a r₂ 10 mm
          más allá de N₂: ahí cae P₄. (4) Por D₂, A₂ y B₂, las paralelas a r₂; desde la línea nueva, hacia
          fuera, lo que cada planta está por debajo de r₁. (5) A₄, B₄ y C₄ salen en línea: el canto. (6) Por
          P₄, la perpendicular al canto: H₄.
        desarrollo: |
          En verde, r₂ entre M₂ y N₂, el canto B₄A₄, con C₄ ≡ D₄ en él, y P₄H₄, la distancia en verdadera
          magnitud. r₂ es paralela a f₂ y r₁ a f₁: r y la frontal CD son paralelas en el espacio, y por eso r
          es paralela al plano.

      - tipo: calcular
        titulo: La distancia de r al plano
        pregunta: ¿Cuánto mide la distancia entre la recta r y el plano ABC?
        respuesta:
          tipo: numero
          valor: '25.76'
          receta: d_mm
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '21.11'
            receta: en_mm(vm_alzado(P, Xg))
            mensaje: |
              Es lo que separa r₂ de f₂ **en el alzado**. Las dos son frontales, pero cada una con su alejamiento: r está
              15,24 mm más cerca del plano vertical que la frontal CD, y el alzado no lo enseña. Y aun contándolo saldría lo
              que separa r de la frontal CD, 26,04 mm, que tampoco es la distancia al plano: esa va por la perpendicular al
              plano, P₄H₄ en la vista nueva.
          - valor: '18.48'
            receta: en_mm(vm_alzado(P, H))
            mensaje: |
              Es lo que mide **en el alzado** PH, la perpendicular desde P al plano: H₂ está en la
              perpendicular a f₂ por P₂. PH no es frontal, y el alzado la acorta. Su verdadera magnitud es la
              hipotenusa de P₁H₁ y de la diferencia de cotas, o P₄H₄ en la vista nueva.
          - valor: '36.98'
            receta: en_mm(vm_planta(P, Y))
            mensaje: |
              Has llevado P₄ al canto prolongado por la paralela a r₂, la dirección en que se llevan los
              alejamientos. Eso es la distancia de P al plano medida de frente, en alejamiento; la más corta
              va por la perpendicular al canto, P₄H₄.
        pista: |
          Mide P₄H₄ con «medir»: en la vista nueva, P₄ es la recta r entera y el canto es el plano entero, y la
          perpendicular entre ellos está en verdadera magnitud.
        desarrollo: |
          En la vista 4, r se ve como el punto P₄ y el plano como la recta B₄A₄. La distancia es la
          perpendicular de P₄ al canto, en verdadera magnitud, porque la vista nueva es paralela a ella:

          $$ d = \overline{P_4H_4} \approx 25{,}76 \text{ mm} $$

          Por otro camino sale lo mismo: el pie H de la perpendicular desde P al plano está a 20,28 mm de P
          en la planta y 15,89 mm más bajo, y la hipotenusa de esos dos catetos es 25,76 mm.

          Dos cifras que la casilla no distingue, dentro de la tolerancia. De P₄ a C₄ hay 26,04 mm, solo 0,28 más: es la
          distancia de r a la frontal CD, no al plano; C₄ queda a 3,78 mm de H₄, y la que manda es la perpendicular al
          canto. Y de D₂ al punto 1, sobre f₂ prolongada, hay 25,07 mm, 0,69 menos: es solo lo que D₂ dista de la línea
          nueva, una casualidad del sitio donde la hemos puesto, y no mide nada del espacio.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: 'r₁ es horizontal en el papel: todos los puntos de r tienen el alejamiento de P, y r es una frontal.'
          - texto: 'Paralela al plano, r lo es a una recta del plano con la planta horizontal, como r₁: la frontal CD. Por eso r₂ va paralela a f₂.'
          - texto: 'Con la línea nueva perpendicular a r₂, la vista nueva mira a lo largo de las frontales: r se ve como el punto P₄ y el plano, como el canto B₄A₄.'
          - texto: 'La perpendicular de P₄ al canto está en verdadera magnitud: P₄H₄, 25,76 mm, es la distancia.'
          - texto: 'Como r₂ y f₂ son paralelas en el papel, la distancia es la separación de las dos en el alzado.'
            trampa: true
            mensaje: |
              r₂ y f₂ son paralelas, pero la separación del papel, 21,11 mm, es una proyección: el alzado no enseña los
              15,24 mm que r y la frontal CD se separan en alejamiento. Y aun contándolos saldría lo que separa r de la
              frontal CD, 26,04 mm, no la distancia al plano, que va por la perpendicular al plano: P₄H₄, 25,76 mm.
    resolucion: |
      **Lo que dan los datos.** r₁ es horizontal en el papel: todos los puntos de r tienen el mismo
      alejamiento, el de P, y r es una recta frontal. Una recta es paralela a un plano si lo es a una recta
      del plano, y una frontal solo puede serlo a otra frontal.

      **a) r₂.** La frontal del plano por C tiene la planta horizontal: corta A₁B₁ en D₁, y D₂ está en
      A₂B₂, en su vertical. C₂D₂ es f₂, y baja hacia la derecha a 30,7° en el papel. r₂ es la paralela a
      f₂ por P₂, y se representa entre M₂ y N₂, en las verticales de los extremos de r₁. r no corta al
      triángulo en ninguna de las dos vistas, así que no hay nada oculto.

      **b) La distancia.** La distancia de r al plano es la de cualquier punto de r, P. Con un cambio de
      plano horizontal y la línea nueva perpendicular a r₂, r y las frontales del plano se ven de punta, y
      el plano, de canto. Cada punto lleva lo que su alejamiento supera al de P, que se lee en la planta
      por debajo de r₁: C, 15,24 mm; A, 32,68, y B, 3,26. A₄, B₄ y C₄ salen en línea, y la perpendicular de
      P₄ a esa recta, P₄H₄, mide 25,76 mm. Es la distancia en verdadera magnitud. La separación de r₂ y f₂ en el alzado, 21,11 mm, no es su proyección (la
      de PH en el alzado mide 18,48): es la de lo que separa r de la frontal CD, 26,04 mm, y la distancia a una recta
      del plano no es la distancia al plano.

  - id: sd55-la-tuberia-mas-corta-de-p-a-ab
    titulo: La tubería más corta de P a la tubería AB, y su distancia
    fuente: Ejercicio 39 (SD55) · Colección de ejercicios de Geometría Descriptiva, Sistema Diédrico Directo · Dpto. de Expresión Gráfica y Proyectos de Ingeniería, EIG · UPV/EHU
    nivel: practica
    # Decisión: el texto impreso tal cual, cotejado con la página (pág. 40),
    # con «deposito» sin tilde, como en el original. El croquis de la página
    # es el propio alzado y planta de las dos construcciones: no hay
    # perspectiva aparte. H, K, J, G y los puntos 1, 2 y 3 son nombres
    # nuestros.
    enunciado: |
      En el croquis se muestran dos construcciones. En el de la izquierda el deposito interior se
      conecta a través de una tubería AB con el suelo exterior. En el de la derecha se identifica una
      posición por medio del punto P. Conectar el punto P con la tubería AB mediante otra tubería de
      menor distancia posible y calcular la distancia correspondiente.

      **Notas nuestras.** «deposito», sin tilde, es errata de la hoja por «depósito», y se deja tal como está impresa. El croquis es el alzado, arriba, y la planta, debajo, de las dos
      construcciones. A la izquierda, un edificio con un depósito cilíndrico dentro; la tubería sale
      del depósito, baja recta de A a B y en B se dobla y baja en vertical hasta el suelo, la recta
      horizontal de abajo del alzado. A la derecha, un muro, en L en la planta, y P en la cara del
      muro que mira a la tubería. A y B son las cruces del eje de la tubería, que va de trazo y punto,
      y P la cruz del muro. La tubería AB es el tramo recto entre A y B, y como en la lámina se trabaja
      con los ejes: la tubería nueva se dibuja por su eje, de P al eje de AB, y la distancia es la de P
      a ese eje. Hasta la superficie de la tubería AB, que tiene 1,8 mm de radio en el papel, saldrían unos 30,6 mm. La lámina no da escala: se mide en el papel, en milímetros. H es el punto de AB donde
      llega la tubería nueva, y K, J, G y los puntos 1, 2 y 3, puntos de la construcción.
    pide: El eje de la tubería más corta, de P a H en AB, en las dos vistas, con AB en verdadera magnitud y de punta en dos cambios de plano; y su longitud.
    receta:
      lamina: sd55
      escena:
        A: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("A1"))'
        B: 'punto3(alzado: figura.punto("B2"), planta: figura.punto("B1"))'
        P: 'punto3(alzado: figura.punto("P2"), planta: figura.punto("P1"))'
        AB: recta3(A, B)
      solucion:
        # La tubería más corta es la perpendicular desde P a la recta AB, y su
        # pie H cae dentro del segmento AB: a 34,17 mm de A, en un tramo de
        # 52,06 mm. Si cayera fuera, iría al extremo más cercano.
        H: pie_perpendicular(P, AB)
        d_mm: en_mm(vm(P, H))
        # Decisión: el método es el de las diapositivas de distancias (pág. 4):
        # la recta, de punta, con dos cambios de plano. El primero, vertical,
        # con la línea nueva paralela a A₁B₁, deja AB en verdadera magnitud, y
        # en esa vista el ángulo recto con PH se ve recto: da H₄, y con él la
        # posición. El segundo, horizontal, con la línea nueva perpendicular a
        # A₄B₄, deja AB de punta y PH en verdadera magnitud. Las dos líneas
        # nuevas van en la lámina, de tipo «e», porque el enunciado no las da:
        # la primera, 10,6 mm por debajo de A₁B₁; la segunda, 8,8 mm más allá de
        # A₄. La referencia es B, el más bajo, en los dos cambios.
        A_4: 'cambio_plano_vertical(A, figura.segmento("nueva1"), ref: B)'
        B_4: 'cambio_plano_vertical(B, figura.segmento("nueva1"), ref: B)'
        P_4: 'cambio_plano_vertical(P, figura.segmento("nueva1"), ref: B)'
        H_4: 'cambio_plano_vertical(H, figura.segmento("nueva1"), ref: B)'
        A_5: 'cambio_plano_vertical(A, figura.segmento("nueva1"), ref: B, luego: figura.segmento("nueva2"))'
        P_5: 'cambio_plano_vertical(P, figura.segmento("nueva1"), ref: B, luego: figura.segmento("nueva2"))'
        AB4: segmento2(A_4, B_4)
        # En el alzado, lo que A y P están más altos que B: K₂ y J₂, en la
        # horizontal de B₂, bajo A₂ y bajo P₂ (la vertical de P₂ es la cara del
        # muro).
        horB2: 'perpendicular(por: figura.punto("B2"), a: segmento2(figura.punto("B1"), figura.punto("B2")))'
        K_2: 'cruce_aparente(horB2, segmento2(figura.punto("A1"), figura.punto("A2")))'
        J_2: 'cruce_aparente(horB2, figura.segmento("muro2"))'
        # En la planta: los pies en la primera línea nueva (1, de A₁, y 2, de
        # P₁), y G, donde la perpendicular por P₁ corta A₁B₁: P₁G es lo que el
        # segundo cambio lleva para P.
        refA: 'perpendicular(por: figura.punto("A1"), a: figura.segmento("nueva1"))'
        refP: 'perpendicular(por: figura.punto("P1"), a: figura.segmento("nueva1"))'
        refH: 'perpendicular(por: H_4, a: figura.segmento("nueva1"))'
        N1: 'pie_perpendicular(figura.punto("A1"), figura.segmento("nueva1"))'
        N2: 'pie_perpendicular(figura.punto("P1"), figura.segmento("nueva1"))'
        G_1: 'pie_perpendicular(figura.punto("P1"), figura.segmento("AB1"))'
        perpP4: 'perpendicular(por: P_4, a: AB4)'
        ref5: 'perpendicular(por: P_4, a: figura.segmento("nueva2"))'
        N3: 'pie_perpendicular(P_4, figura.segmento("nueva2"))'
        # Los errores. Las cotas llevadas hacia el lado de la planta; el punto
        # de AB con la cota de P (la tubería horizontal); los pies de P en AB
        # tomados en la planta y en el alzado; y P₅ del lado de la vista 4.
        A4dentro: 'uno(medir_sobre(refA, desde: N1, distancia: diferencia_de_cotas(A, B)), 2)'
        P4dentro: 'uno(medir_sobre(refP, desde: N2, distancia: diferencia_de_cotas(P, B)), 2)'
        Px: 'punto3(alzado: desplaza(figura.punto("P2"), dx: 50), planta: desplaza(figura.punto("P1"), dx: 50))'
        Py: 'punto3(alzado: figura.punto("P2"), planta: desplaza(figura.punto("P1"), dy: 50))'
        X: corte_recta_plano(AB, plano(P, Px, Py))
        X_4: 'cambio_plano_vertical(X, figura.segmento("nueva1"), ref: B)'
        H2_alz: 'pie_perpendicular(figura.punto("P2"), figura.segmento("AB2"))'
        dPG: 'vm_planta(punto3(alzado: G_1, planta: G_1), punto3(alzado: figura.punto("P1"), planta: figura.punto("P1")))'
        P5dentro: 'uno(medir_sobre(ref5, desde: N3, distancia: dPG), 2)'
        # Los extremos de las rectas largas de la construcción.
        L_hA: 'uno(medir_sobre(horB2, desde: K_2, distancia: mm(2)), 2)'
        L_hP: 'uno(medir_sobre(horB2, desde: J_2, distancia: mm(2)), 1)'
        L_vA: 'desplaza(K_2, dy: mm(2))'
        L_rA: 'uno(medir_sobre(refA, desde: A_4, distancia: mm(2)), 1)'
        L_rB: 'uno(medir_sobre(perpendicular(por: figura.punto("B1"), a: figura.segmento("nueva1")), desde: B_4, distancia: mm(2)), 1)'
        L_rP: 'uno(medir_sobre(refP, desde: P_4, distancia: mm(2)), 1)'
        L_AB4: 'uno(medir_sobre(AB4, desde: A_5, distancia: mm(2)), 2)'
        L_H4: 'uno(medir_sobre(perpP4, desde: H_4, distancia: mm(2)), 2)'
        L_rH: 'uno(medir_sobre(refH, desde: proy_planta(H), distancia: mm(2)), 2)'
        L_vH: 'desplaza(proy_alzado(H), dy: mm(-2))'
        L_r5: 'uno(medir_sobre(ref5, desde: P_5, distancia: mm(2)), 1)'
      comprueba:
        - en_recta(H, AB)
        - en_recta(X, AB)
    pasos:
      - tipo: reconocer
        pregunta: La tubería más corta de P a la tubería AB, ¿dónde llega?
        opciones:
          - texto: Al pie de la perpendicular desde P a la recta AB, después de comprobar que ese pie cae entre A y B, dentro del tramo
            correcta: true
            mensaje: |
              Eso es. La distancia más corta de un punto a una recta es la perpendicular. Pero AB es un
              tramo, y hay que comprobar que el pie cae dentro: aquí cae a dos tercios de A hacia B. Si
              cayera fuera, la tubería iría al extremo más cercano.
          - texto: Al extremo B, que es el más cercano a P
            mensaje: |
              B está más cerca de P que A, pero no es el punto de AB más cercano: PB es oblicua a AB, y la
              perpendicular desde P es más corta. Solo se va a un extremo si el pie de la perpendicular cae
              fuera del tramo, y aquí cae dentro.
          - texto: Al punto de AB que tiene la cota de P, para que la tubería sea horizontal y vaya lo más recta
            mensaje: |
              Una tubería horizontal no es la más corta: el camino más corto a una recta es la
              perpendicular, y esta no tiene por qué ser horizontal. Aquí la perpendicular baja de P a H.

      # Decisión: un solo paso construir con los dos cambios de plano: el
      # primero da H₄ y la vuelta de H a las dos vistas; el segundo, P₅ y la
      # distancia en verdadera magnitud.
      - tipo: construir
        titulo: AB en verdadera magnitud y de punta, y la tubería
        intro: |
          Dos cambios de plano, con las líneas nuevas ya dibujadas, de trazo y punto: el enunciado no las
          da, y las hemos puesto nosotros. La referencia es B, el más bajo, en los dos. El primero,
          vertical, con la línea nueva paralela a A₁B₁, por debajo: cada punto sale de su planta por la
          perpendicular a la línea y se aparta de ella, hacia fuera, lo que está más alto que B, que se
          lee en el alzado. Ahí AB está en verdadera magnitud, y la perpendicular desde P₄ a A₄B₄ se ve
          perpendicular: da H₄, que vuelve a la planta y al alzado. El segundo, horizontal, con la línea
          nueva perpendicular a A₄B₄, más allá de A₄: AB se ve de punta, y P₅ se aparta de la línea lo
          que P₁ dista de A₁B₁. Marca A₄, P₄, H₄, H₁, H₂ y P₅, y pasa la tubería a limpio con «arista
          vista». H₁ y H₂ caen en el eje de AB, a 2 mm de donde las rectas de la construcción cruzan los
          bordes de la tubería: amplía con la lupa (×4) antes de marcarlos.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, visto, oculto, borrar]
        tolerancia: 1
        objetivos:
          - nombre: A4
            pide: A en la vista nueva del primer cambio
            es: solucion.A_4
            bien: |
              A₄ está en la perpendicular a la primera línea nueva por A₁, a 33,0 mm por fuera: lo que A
              está más alto que B. A₄B₄ es AB en verdadera magnitud.
            diagnosticos:
              - si: cerca_de(solucion.N1)
                mensaje: |
                  Te has quedado en la línea nueva. Ahí cae B, que es la referencia; A está más alto que B, y
                  se aparta de la línea, hacia fuera, lo que A₂ está por encima de la horizontal de B₂.
                ejemplo: solucion.N1
              - si: cerca_de(solucion.A4dentro)
                mensaje: |
                  La distancia es la buena, pero hacia el lado de la planta. La vista nueva queda al otro lado
                  de la línea, y un punto más alto que la referencia se aparta hacia fuera.
                ejemplo: solucion.A4dentro
              - si: '!en_recta(solucion.refA)'
                mensaje: |
                  A₄ sale de A₁ por la **perpendicular a la línea nueva**.
                ejemplo: 'desplaza(solucion.A_4, dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular buena, pero no a la distancia buena: A₂K₂, lo que A₂ está por
                  encima de la horizontal de B₂, con el compás desde el punto 1, hacia fuera.
          - nombre: P4
            pide: P en la vista nueva del primer cambio
            es: solucion.P_4
            bien: |
              P₄ está en la perpendicular a la línea nueva por P₁, a 21,6 mm por fuera: lo que P está más alto
              que B.
            diagnosticos:
              - si: cerca_de(solucion.N2)
                mensaje: |
                  Te has quedado en la línea nueva, como si P tuviera la cota de B. P está 21,6 mm más alto, lo
                  que P₂ está por encima de la horizontal de B₂.
                ejemplo: solucion.N2
              - si: cerca_de(solucion.P4dentro)
                mensaje: |
                  La distancia es la buena, pero hacia el lado de la planta. P está más alto que B, y se aparta
                  de la línea nueva hacia fuera.
                ejemplo: solucion.P4dentro
              - si: '!en_recta(solucion.refP)'
                mensaje: |
                  P₄ sale de P₁ por la **perpendicular a la línea nueva**.
                ejemplo: 'desplaza(solucion.P_4, dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular buena, pero no a la distancia buena: P₂J₂, con el compás desde el
                  punto 2, hacia fuera.
          - nombre: H4
            pide: H, el pie de la perpendicular desde P₄ a A₄B₄
            es: solucion.H_4
            bien: |
              H₄ está en A₄B₄, al pie de la perpendicular desde P₄, entre A₄ y B₄: el pie cae dentro de la
              tubería. El ángulo recto se ve recto porque AB está en verdadera magnitud en esta vista.
            diagnosticos:
              - si: cerca_de(solucion.X_4)
                mensaje: |
                  Has ido de P₄ a A₄B₄ en paralelo a la línea nueva, a la altura de P: es la tubería
                  **horizontal**, y no es la más corta. La más corta es la perpendicular a A₄B₄.
                ejemplo: solucion.X_4
              - si: cerca_de(solucion.B_4)
                mensaje: |
                  Ese es B₄, el extremo B. El pie de la perpendicular desde P₄ cae entre A₄ y B₄, así que la
                  tubería más corta no va al extremo.
                ejemplo: solucion.B_4
              - si: en_recta(solucion.AB4)
                mensaje: |
                  Estás en A₄B₄, pero no al pie de la perpendicular desde P₄. Con la escuadra apoyada en A₄B₄,
                  la perpendicular por P₄.
                ejemplo: 'uno(medir_sobre(solucion.AB4, desde: solucion.H_4, distancia: mm(6)), 2)'
              - si: en_recta(solucion.perpP4)
                mensaje: |
                  Vas por la perpendicular a A₄B₄ desde P₄, pero H₄ es donde la corta, ni antes ni después.
                ejemplo: punto_medio(segmento2(solucion.P_4, solucion.H_4))
              - si: siempre
                mensaje: |
                  H₄ está en A₄B₄ y en la perpendicular a ella que pasa por P₄.
          - nombre: H1
            pide: H, de vuelta en la planta
            es: proy_planta(H)
            bien: |
              H₁ está en A₁B₁, donde la corta la perpendicular a la línea nueva que sale de H₄. P₁H₁ no se ve
              perpendicular a A₁B₁: AB no es horizontal.
            diagnosticos:
              - si: cerca_de(solucion.G_1)
                mensaje: |
                  Ese es G, el pie de la perpendicular a A₁B₁ por P₁ **en la planta**. AB no es horizontal, y el
                  ángulo recto con ella no se ve recto en la planta: el pie de verdad sale de la vista nueva,
                  de H₄.
                ejemplo: solucion.G_1
              - si: '!en_recta(solucion.refH)'
                mensaje: |
                  H₁ vuelve de H₄ por la **perpendicular a la línea nueva**, hasta A₁B₁.
                ejemplo: 'uno(medir_sobre(figura.segmento("AB1"), desde: proy_planta(H), distancia: mm(5)), 1)'
              - si: '!en_recta(figura.segmento("AB1"))'
                mensaje: |
                  H está en la tubería AB: H₁ va **en A₁B₁**, donde la corta la perpendicular que sale de H₄.
                ejemplo: 'uno(medir_sobre(solucion.refH, desde: proy_planta(H), distancia: mm(5)), 1)'
              - si: siempre
                mensaje: |
                  H₁ está donde la perpendicular a la línea nueva que sale de H₄ corta A₁B₁.
          - nombre: H2
            pide: H, en el alzado
            es: proy_alzado(H)
            bien: |
              H₂ está en A₂B₂, en la vertical de H₁. P₂H₂ tampoco se ve perpendicular a A₂B₂: AB no es frontal.
            diagnosticos:
              - si: cerca_de(solucion.H2_alz)
                mensaje: |
                  Ese es el pie de la perpendicular a A₂B₂ por P₂ **en el alzado**. AB no es frontal, y el
                  ángulo recto no se ve en el alzado. H₂ está en la vertical de H₁.
                ejemplo: solucion.H2_alz
              - si: '!en_vertical_de(H1)'
                mensaje: |
                  H₂ va en la **vertical de H₁**: es el mismo punto visto de frente.
                ejemplo: 'uno(medir_sobre(figura.segmento("AB2"), desde: proy_alzado(H), distancia: mm(5)), 1)'
              - si: '!en_recta(figura.segmento("AB2"))'
                mensaje: |
                  H está en la tubería AB: H₂ va donde la vertical de H₁ corta **A₂B₂**.
                ejemplo: 'desplaza(proy_alzado(H), dy: mm(5))'
              - si: siempre
                mensaje: |
                  H₂ está en A₂B₂, en la vertical de H₁.
          - nombre: P5
            pide: P en la vista nueva del segundo cambio, con AB de punta
            es: solucion.P_5
            bien: |
              P₅ está en la perpendicular a la segunda línea nueva por P₄, a 29,5 mm por fuera: lo que P₁ dista
              de A₁B₁. AB se ve de punta en A₅, donde A₄B₄ prolongada corta la segunda línea, y P₅A₅ es la
              tubería en verdadera magnitud.
            diagnosticos:
              - si: cerca_de(solucion.N3)
                mensaje: |
                  Te has quedado en la segunda línea nueva. Ahí cae B, la referencia, y con él toda AB, que se
                  ve de punta. P está más lejos de la primera línea nueva que B, lo que P₁ dista de A₁B₁, y se
                  aparta eso, hacia fuera.
                ejemplo: solucion.N3
              - si: cerca_de(solucion.P5dentro)
                mensaje: |
                  La distancia es la buena, pero hacia el lado de la vista 4. P₁ está más lejos de la primera
                  línea nueva que B₁, y P₅ se aparta de la segunda hacia fuera, lejos de A₄B₄.
                ejemplo: solucion.P5dentro
              - si: '!en_recta(solucion.ref5)'
                mensaje: |
                  P₅ sale de P₄ por la **perpendicular a la segunda línea nueva**, que es la paralela a A₄B₄ por
                  P₄.
                ejemplo: 'desplaza(solucion.P_5, dy: mm(-6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular buena, pero no a la distancia buena: P₁G, lo que P₁ dista de A₁B₁,
                  con el compás desde el punto 3, hacia fuera.
        # Decisión: el eje de la tubería se ve entero en las dos vistas (cálculo
        # de líneas ocultas aparte, por rayos contra el muro, el edificio y el
        # suelo): va de la cara del muro que mira a la tubería AB, por delante
        # del muro y por fuera del edificio, y nada se le pone delante.
        tramos:
          - traza: segmento2(figura.punto("P1"), proy_planta(H))
            tipo: visto
            porque: 'Desde arriba, entre la cara del muro y la tubería AB no hay nada: el edificio queda a la izquierda y el muro empieza en P₁.'
          - traza: segmento2(figura.punto("P2"), proy_alzado(H))
            tipo: visto
            porque: 'De frente, la tubería nueva queda a la izquierda del muro y a la derecha del edificio, por encima del suelo: nada la tapa.'
        construccion:
          - con: escuadra-cartabon
            traza: '[segmento2(figura.punto("B2"), solucion.L_hA), segmento2(figura.punto("B2"), solucion.L_hP)]'
            guia: figura.segmento("suelo")
            porque: |
              **Las cotas, desde B.** B es la referencia, y cada punto lleva lo que está más alto que B. Por
              B₂, la horizontal, larga hacia los dos lados: a la izquierda hasta pasar la vertical de A₂, y
              a la derecha hasta pasar la cara del muro, que es la vertical de P₂.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("A2"), solucion.L_vA)
            porque: |
              Por A₂, la vertical hasta pasar la horizontal de B₂.
          - con: marca
            traza: solucion.K_2
            rotulo: K₂
            porque: |
              K₂, nombre nuestro, donde la vertical de A₂ corta la horizontal de B₂: A₂K₂, 33,0 mm, es lo que A
              está más alto que B.
          - con: marca
            traza: solucion.J_2
            rotulo: J₂
            porque: |
              J₂, nombre nuestro, donde la horizontal de B₂ corta la cara del muro, que pasa por P₂: P₂J₂, 21,6
              mm, es lo que P está más alto que B.
          - con: escuadra-cartabon
            traza: '[segmento2(figura.punto("A1"), solucion.L_rA), segmento2(figura.punto("B1"), solucion.L_rB), segmento2(figura.punto("P1"), solucion.L_rP)]'
            guia: figura.segmento("nueva1")
            porque: |
              **El primer cambio.** Por A₁, B₁ y P₁, las perpendiculares a la primera línea nueva, más allá de
              ella: la de B₁, poco, porque B es la referencia; las de A₁ y P₁, largas. La de P₁ cruza A₁B₁ por
              el camino.
          - con: marca
            traza: solucion.B_4
            rotulo: B₄
            porque: |
              B₄, donde la perpendicular por B₁ corta la primera línea nueva: B es la referencia y cae en ella.
          - con: marca
            traza: solucion.N1
            rotulo: '1'
            porque: |
              1, nombre nuestro, donde la perpendicular por A₁ corta la primera línea nueva.
          - con: marca
            traza: solucion.N2
            rotulo: '2'
            porque: |
              2, nombre nuestro, donde la perpendicular por P₁ corta la primera línea nueva.
          - con: marca
            traza: solucion.G_1
            rotulo: G
            porque: |
              G, nombre nuestro, donde la perpendicular por P₁ cruza A₁B₁: P₁G es lo que P₁ está más lejos de
              la línea nueva que la tubería, y hará falta en el segundo cambio.
          - con: compas
            traza: 'arco(solucion.N1, por: solucion.A_4, desde: uno(medir_sobre(perpendicular(por: solucion.A_4, a: solucion.refA), desde: solucion.A_4, distancia: mm(2)), 1), hasta: uno(medir_sobre(perpendicular(por: solucion.A_4, a: solucion.refA), desde: solucion.A_4, distancia: mm(2)), 2))'
            toma: segmento2(figura.punto("A2"), solucion.K_2)
            porque: |
              Con el compás, A₂K₂, y centro en 1: el arco corta la perpendicular por fuera de la línea nueva,
              lejos de la planta, porque A es más alto que B.
          - con: marca
            traza: solucion.A_4
            rotulo: A₄
            porque: |
              A₄, donde el arco corta la perpendicular que sale de A₁, por fuera.
          - con: compas
            traza: 'arco(solucion.N2, por: solucion.P_4, desde: uno(medir_sobre(perpendicular(por: solucion.P_4, a: solucion.refP), desde: solucion.P_4, distancia: mm(2)), 1), hasta: uno(medir_sobre(perpendicular(por: solucion.P_4, a: solucion.refP), desde: solucion.P_4, distancia: mm(2)), 2))'
            toma: segmento2(figura.punto("P2"), solucion.J_2)
            porque: |
              Con el compás, P₂J₂, y centro en 2, por fuera: P también es más alto que B.
          - con: marca
            traza: solucion.P_4
            rotulo: P₄
            porque: |
              P₄, donde el arco corta la perpendicular que sale de P₁, por fuera.
          - con: regla
            traza: segmento2(solucion.B_4, solucion.L_AB4)
            porque: |
              A₄B₄, la tubería AB en **verdadera magnitud**, prolongada con la regla más allá de A₄ hasta
              pasar la segunda línea nueva.
          - con: marca
            traza: solucion.A_5
            rotulo: A₅
            porque: |
              A₅, donde A₄B₄ prolongada corta la segunda línea nueva, que le es perpendicular. B es la
              referencia, y A y B tienen la misma distancia a la primera línea nueva: los dos caen aquí. AB se
              ve de punta, y H, que está en ella, también.
          - con: escuadra-cartabon
            traza: segmento2(solucion.P_4, solucion.L_H4)
            guia: solucion.AB4
            porque: |
              Por P₄, la perpendicular a A₄B₄, hasta pasarla: AB está en verdadera magnitud en esta vista, y el
              ángulo recto con la tubería más corta se ve recto.
          - con: marca
            traza: solucion.H_4
            rotulo: H₄
            porque: |
              H₄, nombre nuestro, donde la perpendicular corta A₄B₄, entre A₄ y B₄: el pie cae dentro de la
              tubería AB.
          - con: escuadra-cartabon
            traza: segmento2(solucion.H_4, solucion.L_rH)
            guia: figura.segmento("nueva1")
            porque: |
              **La vuelta.** Por H₄, la perpendicular a la primera línea nueva, de vuelta a la planta, hasta
              pasar A₁B₁.
          - con: marca
            traza: proy_planta(H)
            rotulo: H₁
            porque: |
              H₁, donde la perpendicular que sale de H₄ corta A₁B₁.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(H), solucion.L_vH)
            porque: |
              Por H₁, la vertical hasta el alzado, más allá de A₂B₂.
          - con: marca
            traza: proy_alzado(H)
            rotulo: H₂
            porque: |
              H₂, donde la vertical de H₁ corta A₂B₂.
          - con: escuadra-cartabon
            traza: segmento2(solucion.P_4, solucion.L_r5)
            guia: figura.segmento("nueva2")
            porque: |
              **El segundo cambio.** Por P₄, la perpendicular a la segunda línea nueva, que es la paralela a
              A₄B₄, larga, más allá de la línea.
          - con: marca
            traza: solucion.N3
            rotulo: '3'
            porque: |
              3, nombre nuestro, donde esa perpendicular corta la segunda línea nueva.
          - con: compas
            traza: 'arco(solucion.N3, por: solucion.P_5, desde: uno(medir_sobre(perpendicular(por: solucion.P_5, a: solucion.ref5), desde: solucion.P_5, distancia: mm(2)), 1), hasta: uno(medir_sobre(perpendicular(por: solucion.P_5, a: solucion.ref5), desde: solucion.P_5, distancia: mm(2)), 2))'
            toma: segmento2(figura.punto("P1"), solucion.G_1)
            porque: |
              Con el compás, P₁G, lo que P₁ está más lejos de la primera línea nueva que A₁B₁, y centro en 3:
              el arco corta la perpendicular por fuera de la segunda línea, lejos de la vista 4.
          - con: marca
            traza: solucion.P_5
            rotulo: P₅
            porque: |
              P₅, donde el arco corta la perpendicular que sale de P₄, por fuera de la segunda línea.
          - con: regla
            traza: segmento2(solucion.P_5, solucion.A_5)
            porque: |
              P₅A₅: con AB de punta, la tubería más corta va de P₅ al punto A₅, y está en verdadera magnitud.
              Es la distancia.
          - con: arista-vista
            traza: '[segmento2(figura.punto("P1"), proy_planta(H)), segmento2(figura.punto("P2"), proy_alzado(H))]'
            porque: |
              **La tubería**, de P a H, en continua en las dos vistas: va de la cara del muro a la tubería AB
              por fuera del edificio, y nada la tapa.
        pista: |
          (1) La horizontal de B₂ da lo que A y P están más altos que B: A₂K₂ y P₂J₂. (2) Por A₁, B₁ y P₁,
          las perpendiculares a la primera línea nueva; B₄ en ella, A₄ y P₄ por fuera. (3) La perpendicular
          desde P₄ a A₄B₄ da H₄; de vuelta, H₁ en A₁B₁ y H₂ en A₂B₂. (4) A₄B₄ prolongada corta la segunda
          línea en A₅; P₅, por la paralela a A₄B₄ desde P₄, a P₁G por fuera. P₅A₅ es la distancia.
        desarrollo: |
          En verde claro, A₄B₄, la tubería AB en verdadera magnitud, con P₄H₄ perpendicular a ella; la
          tubería nueva, de P a H, en las dos vistas; y P₅A₅, la distancia en verdadera magnitud, con AB de
          punta.

      - tipo: calcular
        titulo: La distancia de P a la tubería AB
        pregunta: ¿Cuánto mide la tubería más corta, de P a la tubería AB?
        respuesta:
          tipo: numero
          valor: '32.37'
          receta: d_mm
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '13.25'
            receta: 'en_mm(vm_planta(punto3(alzado: P_4, planta: P_4), punto3(alzado: H_4, planta: H_4)))'
            mensaje: |
              Es **P₄H₄**, en la vista del primer cambio. Ahí AB está en verdadera magnitud, y por eso el ángulo
              recto se ve, pero la tubería PH no: P₄H₄ la acorta. La verdadera magnitud es P₅A₅, con AB de
              punta.
          - valor: '23.14'
            receta: en_mm(vm_alzado(P, H))
            mensaje: |
              Es **P₂H₂ en el alzado**, que acorta la tubería: PH no es frontal, porque se aleja del plano del
              alzado mientras baja (H₁ queda más abajo que P₁ en la planta).
          - valor: '30.70'
            receta: en_mm(vm_planta(P, H))
            mensaje: |
              Es **P₁H₁ en la planta**, que acorta la tubería: H está 10,25 mm más bajo que P.
          - valor: '36.98'
            receta: en_mm(vm(P, B))
            mensaje: |
              Es **PB**, la distancia al extremo B. B está cerca, pero el pie de la perpendicular cae entre A y
              B, y la tubería más corta va a H.
        pista: |
          Mide P₅A₅ con «medir»: con AB de punta, la tubería más corta está en verdadera magnitud.
        desarrollo: |
          En la vista del segundo cambio AB se ve de punta, en A₅, y la tubería más corta es P₅A₅, en
          verdadera magnitud:

          $$ d = \overline{P_5A_5} \approx 32{,}37 \text{ mm} $$

          Por otro camino sale lo mismo: H₁ está a 30,70 mm de P₁ en la planta y H, 10,25 mm más bajo que P;
          la hipotenusa de esos dos catetos es 32,37 mm.

          Hay medidas del dibujo que caen dentro de la tolerancia y no son la distancia: A₂H₂ en el alzado
          (32,06 mm), lo que A está más alto que B, A₂K₂, que es también lo que A₄ dista de la primera línea
          nueva (33,02 mm), y de G a P₄ (32,17 mm). La casilla no las distingue; la distancia es P₅A₅.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: 'La tubería más corta de P a la recta AB es la perpendicular, y su pie H cae entre A y B: no hay que ir a un extremo.'
          - texto: 'Con la primera línea nueva paralela a A₁B₁, AB sale en verdadera magnitud, A₄B₄, y el ángulo recto con PH se ve recto: la perpendicular desde P₄ da H₄.'
          - texto: 'H₄ vuelve a la planta por la perpendicular a la línea nueva, hasta A₁B₁, y al alzado por la vertical, hasta A₂B₂.'
          - texto: 'Con la segunda línea nueva perpendicular a A₄B₄, AB se ve de punta en A₅, y P₅A₅, la tubería en verdadera magnitud, mide 32,37 mm.'
          - texto: 'H es el pie de la perpendicular a A₁B₁ por P₁, en la planta, y H₂ está en su vertical.'
            trampa: true
            mensaje: |
              En la planta el ángulo recto con AB no se ve, porque AB no es horizontal: ese pie, G, queda a
              8,4 mm de H₁. El pie de verdad sale de la vista donde AB está en verdadera magnitud, H₄.
    resolucion: |
      **Dónde llega.** La tubería más corta de P a la recta AB es la perpendicular. AB es un tramo, y su
      pie H cae dentro: a 34,17 mm de A, en un tramo de 52,06 mm. Si cayera fuera, iría al extremo más
      cercano.

      **El primer cambio.** Con la línea nueva paralela a A₁B₁ y B de referencia, cada punto se aparta de
      ella lo que está más alto que B, que se lee en el alzado bajo la horizontal de B₂: A, 33,0 mm, y P,
      21,6. A₄B₄ es AB en verdadera magnitud, y en esa vista el ángulo recto con la tubería se ve recto:
      la perpendicular desde P₄ da H₄. De vuelta, H₁ está en A₁B₁ y H₂ en A₂B₂. En las vistas de partida
      el ángulo recto no se ve: AB no es horizontal ni frontal.

      **El segundo cambio.** Con la línea nueva perpendicular a A₄B₄, AB se ve de punta en A₅, y P₅ se
      aparta de la línea lo que P₁ dista de A₁B₁, 29,5 mm. P₅A₅ es la tubería en verdadera magnitud: 32,37
      mm. La tubería, de P a H, se ve entera en las dos vistas.

  - id: sd56-la-tuberia-mas-corta-entre-ab-y-cd
    titulo: La tubería más corta entre las tuberías AB y CD, con CD de punta
    fuente: Ejercicio 40 (SD56) · Colección de ejercicios de Geometría Descriptiva, Sistema Diédrico Directo · Dpto. de Expresión Gráfica y Proyectos de Ingeniería, EIG · UPV/EHU
    nivel: practica
    # Decisión: el texto impreso tal cual, cotejado con la página (pág. 41),
    # con su «En el de la izquierda». La planta rotula «D2» la cruz de la
    # derecha, que es D₁: errata de la hoja, que la lámina corrige y las Notas
    # nuestras dicen. Q, P, F, G y los puntos 1 y 2 son nombres nuestros.
    enunciado: |
      En el croquis de la figura se representan dos construcciones. En el de la izquierda se
      encuentra un depósito que se conecta con el exterior a través de la tubería AB y la tubería CD
      conecta ambas construcciones. Representar la tubería de menor longitud posible que une las
      tuberías AB y CD.

      **Notas nuestras.** «En el de la izquierda», en masculino, es errata de la hoja por «en la de la
      izquierda», la construcción, y se deja tal como está impresa. El croquis es el alzado, arriba, y
      la planta, debajo, de las dos construcciones: a la izquierda, un edificio con un depósito cilíndrico dentro, del que sale la
      tubería AB, que baja recta de A a B y en B se dobla y baja en vertical hasta el suelo; a la
      derecha, otra construcción, y entre las dos, la tubería CD, de muro a muro. A, B, C y D son las
      cruces de los ejes de las tuberías, que van de trazo y punto, y como en la lámina se trabaja con
      los ejes: la tubería nueva se dibuja por su eje, del eje de AB al de CD. Entre las superficies
      de las dos tuberías, que tienen 1,8 mm de radio en el papel, saldrían 3,6 mm menos. En la planta,
      la página rotula «D₂» la cruz de la derecha; es D₁ —está en la vertical de D₂ y en el eje de
      CD—, y aquí va D₁: es una errata de la hoja. La lámina no da escala: se mide en el papel, en
      milímetros. Llamamos Q al extremo de la tubería nueva que está en AB y P al que está en CD, y F,
      G y los puntos 1 y 2 son puntos de la construcción: todos, nombres nuestros.
    pide: Los extremos de la tubería más corta, Q en AB y P en CD, en las dos vistas, con CD de punta en un cambio de plano; la tubería pasada a limpio, y, como pregunta nuestra, su longitud.
    receta:
      lamina: sd56
      escena:
        A: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("A1"))'
        B: 'punto3(alzado: figura.punto("B2"), planta: figura.punto("B1"))'
        C: 'punto3(alzado: figura.punto("C2"), planta: figura.punto("C1"))'
        D: 'punto3(alzado: figura.punto("D2"), planta: figura.punto("D1"))'
        ab: recta3(A, B)
        cd: recta3(C, D)
      solucion:
        # La tubería más corta es la perpendicular común de AB y CD, que se
        # cruzan. Sus pies caen dentro de las dos tuberías (segundo camino): Q a
        # 0,505 de AB desde A, y P a 0,373 de CD desde C.
        Q: pie_comun(ab, cd)
        P: pie_comun(cd, ab)
        d_mm: en_mm(distancia_rectas(ab, cd))
        # Decisión: C₁D₁ es horizontal en el papel, así que CD es frontal y
        # C₂D₂ está en verdadera magnitud: basta UN cambio de plano, horizontal,
        # con la línea nueva perpendicular a C₂D₂, para dejar CD de punta (las
        # diapositivas de distancias, pág. 8, usan dos porque su recta es
        # oblicua). La línea nueva está en la lámina («nueva»), perpendicular a
        # C₂D₂ por el punto de C₂D₂ prolongada 45 mm más allá de D₂, por encima
        # del tejado de la derecha; C es la referencia, y C₄ ≡ D₄ cae en ella.
        C_4: 'cambio_plano_horizontal(C, figura.segmento("nueva"), ref: C)'
        A_4: 'cambio_plano_horizontal(A, figura.segmento("nueva"), ref: C)'
        B_4: 'cambio_plano_horizontal(B, figura.segmento("nueva"), ref: C)'
        Q_4: 'cambio_plano_horizontal(Q, figura.segmento("nueva"), ref: C)'
        ab4: segmento2(A_4, B_4)
        # Los puntos 1 y 2, donde las paralelas a C₂D₂ por A₂ y B₂ cortan la
        # línea nueva; y F y G, donde las verticales de A₁ y B₁ cortan C₁D₁
        # (prolongada, la de A): A₁F y B₁G son lo que el alejamiento de A y el de
        # B superan al de C, el de toda CD.
        K_A: 'pie_perpendicular(figura.punto("A2"), figura.segmento("nueva"))'
        K_B: 'pie_perpendicular(figura.punto("B2"), figura.segmento("nueva"))'
        F_A: 'pie_perpendicular(figura.punto("A1"), figura.segmento("CD1"))'
        F_B: 'pie_perpendicular(figura.punto("B1"), figura.segmento("CD1"))'
        lleva_A: 'vm_planta(A, punto3(alzado: F_A, planta: F_A))'
        lleva_B: 'vm_planta(B, punto3(alzado: F_B, planta: F_B))'
        projA: 'perpendicular(por: figura.punto("A2"), a: figura.segmento("nueva"))'
        projB: 'perpendicular(por: figura.punto("B2"), a: figura.segmento("nueva"))'
        perpC4: 'perpendicular(por: C_4, a: ab4)'
        parQ: 'perpendicular(por: Q_4, a: figura.segmento("nueva"))'
        perpQ2: 'perpendicular(por: proy_alzado(Q), a: figura.segmento("CD2"))'
        # Los errores: el cruce aparente de A₂B₂ y C₂D₂ en el alzado, y P₂ bajado
        # de Q₂ en vertical, como si la tubería fuera vertical.
        X2: 'cruce_aparente(figura.segmento("AB2"), figura.segmento("CD2"))'
        Pvert: 'cruce_aparente(segmento2(proy_alzado(Q), proy_planta(Q)), figura.segmento("CD2"))'
        # La perpendicular desde C a AB, el extremo más cercano a la otra
        # tubería: perpendicular a AB pero no a CD.
        QC: pie_perpendicular(C, ab)
        # Lo visto y lo oculto del alzado: la tubería AB, opaca, pasa por delante
        # del trozo de PQ que cae en su banda, porque P está más atrás que Q. El
        # borde de A₂B₂ del lado de P₂, a 1,8 mm del eje, y donde lo cruza P₂Q₂.
        bordeAB2: 'perpendicular(por: uno(medir_sobre(perpendicular(por: figura.punto("A2"), a: figura.segmento("AB2")), desde: figura.punto("A2"), distancia: mm(1.8)), 1), a: perpendicular(por: figura.punto("A2"), a: figura.segmento("AB2")))'
        x_PQ2: 'cruce_aparente(segmento2(proy_alzado(Q), proy_alzado(P)), bordeAB2)'
        # Los extremos de las rectas largas de la construcción: en el papel se
        # trazan más allá del punto que van a dar.
        L_E: 'uno(medir_sobre(figura.segmento("CD2"), desde: C_4, distancia: mm(4)), 1)'
        L_A: 'uno(medir_sobre(projA, desde: A_4, distancia: mm(4)), 2)'
        L_B: 'uno(medir_sobre(projB, desde: B_4, distancia: mm(4)), 2)'
        L_C1: 'uno(medir_sobre(figura.segmento("CD1"), desde: F_A, distancia: mm(4)), 2)'
        L_FA: 'uno(medir_sobre(segmento2(figura.punto("A1"), F_A), desde: F_A, distancia: mm(4)), 1)'
        L_FB: 'uno(medir_sobre(segmento2(figura.punto("B1"), F_B), desde: F_B, distancia: mm(4)), 1)'
        L_AB4: 'uno(medir_sobre(ab4, desde: B_4, distancia: mm(4)), 1)'
        L_Q4: 'uno(medir_sobre(segmento2(C_4, Q_4), desde: Q_4, distancia: mm(3)), 1)'
        L_Q2: 'uno(medir_sobre(parQ, desde: proy_alzado(Q), distancia: mm(4)), 1)'
        L_P2: 'uno(medir_sobre(segmento2(proy_alzado(Q), proy_alzado(P)), desde: proy_alzado(P), distancia: mm(3)), 1)'
        L_Q1: 'desplaza(proy_planta(Q), dy: mm(4))'
        L_P1: 'desplaza(proy_planta(P), dy: mm(4))'
      comprueba:
        - en_recta(Q, ab)
        - en_recta(P, cd)
    pasos:
      - tipo: reconocer
        pregunta: AB y CD se cruzan sin cortarse. ¿Cuál es la tubería más corta de las que las unen?
        opciones:
          - texto: La que va por donde se cruzan A₂B₂ y C₂D₂ en el alzado, porque ahí las dos tuberías se tocan
            mensaje: |
              Ese cruce es solo del papel: ahí AB pasa por delante de CD, 25,56 mm más cerca de quien
              mira, y las dos no se tocan. Una tubería que las uniera en ese cruce iría de punta, de atrás
              hacia delante, y mediría esos 25,56 mm, más que la más corta.
          - texto: La perpendicular desde C a AB, porque C es el extremo que queda más cerca de la otra tubería
            mensaje: |
              Esa es perpendicular a AB, pero no a CD, y mide 27,99 mm. La más corta tiene que ser
              perpendicular a las dos a la vez, y sus extremos no tienen por qué ser A, B, C ni D.
          - texto: La perpendicular común, la única que corta a las dos tuberías y es perpendicular a ambas; con una de las dos de punta se ve en verdadera magnitud
            correcta: true
            mensaje: |
              Eso es. Con CD de punta, todo lo que es perpendicular a CD se ve en verdadera magnitud, y la
              perpendicular común es la perpendicular desde ese punto a la otra tubería. Aquí CD ya es
              frontal, y basta un cambio de plano para ponerla de punta.

      # Decisión: un solo paso construir, con el cambio de plano, los dos pies y
      # la tubería pasada a limpio. La tubería va entera en el hueco entre las
      # dos construcciones: ningún muro ni tejado la tapa. En la planta se ve
      # entera; en el alzado, de Q₂ al borde de A₂B₂ la tapa la tubería AB, que
      # va por delante (P está más atrás que Q), y ese trozo va a trazos.
      - tipo: construir
        titulo: La tubería más corta, con CD de punta
        intro: |
          C₁D₁ es horizontal en el papel: CD es frontal, y C₂D₂ está en verdadera magnitud. Basta un
          cambio de plano horizontal para dejarla de punta: con la línea nueva perpendicular a C₂D₂, la
          vista nueva mira a lo largo de CD. El enunciado no dice dónde va: la hemos dibujado ya, de
          trazo y punto, arriba a la derecha, perpendicular a C₂D₂ por el punto de C₂D₂ prolongada que
          está 45 mm más allá de D₂. C es la referencia, así que C₄ y D₄ caen en ese punto. Cada punto
          sale de su alzado por la paralela a C₂D₂ y se aparta de la línea nueva, hacia fuera, lo que su
          alejamiento supera al de C, que es el de toda CD: en la planta, lo que el punto está por debajo
          de C₁D₁. En la vista nueva, la perpendicular desde C₄ a A₄B₄ es la tubería en verdadera
          magnitud, y su pie es Q₄. Marca A₄, B₄ y Q₄; después Q y P en el alzado y en la planta, y pasa
          la tubería a limpio con «arista vista» y «arista oculta»: las tuberías son opacas. Q₂, Q₁, P₂ y P₁ caen en los ejes, a unos 2 mm de donde
          las rectas de la construcción cruzan los bordes de las tuberías, y P₂ a 0,6 mm de donde el eje de
          CD cruza el borde de AB: amplía con la lupa (×4) antes de marcarlos.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, visto, oculto, borrar]
        tolerancia: 1
        objetivos:
          - nombre: A4
            pide: A en la vista nueva
            es: solucion.A_4
            bien: |
              A₄ está en la paralela a C₂D₂ por A₂, a 13,17 mm de la línea nueva, hacia fuera: lo que A₁
              está por debajo de C₁D₁ prolongada, A₁F.
            diagnosticos:
              - si: cerca_de(solucion.K_A)
                mensaje: |
                  Has dejado A₄ en la línea nueva, como si A fuera la referencia. La referencia es C: A se
                  aparta de la línea lo que su alejamiento supera al de C, que en la planta es A₁F.
                ejemplo: solucion.K_A
              - si: 'en_recta(solucion.projA) && a_distancia(de: solucion.K_A, d: diferencia_de_cotas(A, C))'
                mensaje: |
                  Has llevado lo que A está **más alto** que C, su diferencia de cotas. En un cambio de plano
                  horizontal la vista nueva sale del alzado, y se lleva lo que el alzado no enseña: el
                  **alejamiento**, que está en la planta.
                ejemplo: 'uno(medir_sobre(solucion.projA, desde: solucion.K_A, distancia: diferencia_de_cotas(A, C)), 2)'
              - si: 'cerca_de(uno(medir_sobre(solucion.projA, desde: solucion.K_A, distancia: solucion.lleva_A), 1))'
                mensaje: |
                  Llevas bien A₁F, pero **hacia el alzado**. A tiene más alejamiento que C, y se aparta de la
                  línea nueva hacia fuera, al lado contrario del alzado.
                ejemplo: 'uno(medir_sobre(solucion.projA, desde: solucion.K_A, distancia: solucion.lleva_A), 1)'
              - si: '!en_recta(solucion.projA)'
                mensaje: |
                  A₄ sale de A₂ por la **perpendicular a la línea nueva**, que es la paralela a C₂D₂ por A₂.
                ejemplo: 'desplaza(solucion.A_4, dy: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la paralela a C₂D₂ por A₂, pero no a la distancia buena: A₁F, con el compás desde
                  el punto 1, hacia fuera.
          - nombre: B4
            pide: B en la vista nueva
            es: solucion.B_4
            bien: |
              B₄ está en la paralela a C₂D₂ por B₂, a 31,20 mm de la línea nueva, hacia fuera: lo que B₁
              está por debajo de C₁D₁, B₁G. A₄B₄ es la tubería AB en la vista nueva.
            diagnosticos:
              - si: cerca_de(solucion.K_B)
                mensaje: |
                  Has dejado B₄ en la línea nueva, como si B fuera la referencia. La referencia es C: B se
                  aparta lo que su alejamiento supera al de C, B₁G en la planta.
                ejemplo: solucion.K_B
              - si: 'cerca_de(uno(medir_sobre(solucion.projB, desde: solucion.K_B, distancia: solucion.lleva_B), 1))'
                mensaje: |
                  Llevas bien B₁G, pero **hacia el alzado**. B tiene más alejamiento que C, y va hacia fuera,
                  como A.
                ejemplo: 'uno(medir_sobre(solucion.projB, desde: solucion.K_B, distancia: solucion.lleva_B), 1)'
              - si: '!en_recta(solucion.projB)'
                mensaje: |
                  B₄ sale de B₂ por la **perpendicular a la línea nueva**, que es la paralela a C₂D₂ por B₂.
                ejemplo: 'desplaza(solucion.B_4, dy: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la paralela a C₂D₂ por B₂, pero no a la distancia buena: B₁G, con el compás desde
                  el punto 2, hacia fuera.
          - nombre: Q4
            pide: el pie de la tubería en AB, en la vista nueva
            es: solucion.Q_4
            bien: |
              Q₄ está en A₄B₄, al pie de la perpendicular desde C₄. C₄ es toda la tubería CD, y C₄Q₄ es la
              tubería más corta en verdadera magnitud: 23,86 mm.
            diagnosticos:
              - si: '!en_recta(solucion.ab4)'
                mensaje: |
                  Q es el extremo que está en AB: Q₄ va **en A₄B₄**, donde la corta la perpendicular que sale
                  de C₄.
                ejemplo: 'uno(medir_sobre(solucion.perpC4, desde: solucion.Q_4, distancia: mm(6)), 2)'
              - si: '!en_recta(solucion.perpC4)'
                mensaje: |
                  Estás en A₄B₄, pero no al pie de la **perpendicular desde C₄**. Con CD de punta, la
                  tubería más corta es la perpendicular desde ese punto a A₄B₄: la escuadra, apoyada en
                  A₄B₄, por C₄.
                ejemplo: 'uno(medir_sobre(solucion.ab4, desde: solucion.Q_4, distancia: mm(6)), 1)'
              - si: siempre
                mensaje: |
                  Q₄ está donde la perpendicular a A₄B₄ por C₄ corta A₄B₄.
          - nombre: Q2
            pide: el extremo de la tubería en AB, en el alzado
            es: proy_alzado(Q)
            bien: |
              Q₂ está en A₂B₂, donde la corta la paralela a C₂D₂ que vuelve de Q₄: casi a la mitad de AB.
            diagnosticos:
              - si: cerca_de(solucion.X2)
                mensaje: |
                  Ese es el **cruce de A₂B₂ y C₂D₂** en el alzado, que no es un punto común: ahí AB va por
                  delante de CD. Q sale de la vista nueva, de Q₄.
                ejemplo: solucion.X2
              - si: '!en_recta(figura.segmento("AB2"))'
                mensaje: |
                  Q está en AB: Q₂ va **en A₂B₂**, donde la corta la paralela a C₂D₂ que sale de Q₄.
                ejemplo: 'uno(medir_sobre(solucion.parQ, desde: proy_alzado(Q), distancia: mm(6)), 1)'
              - si: '!en_recta(solucion.parQ)'
                mensaje: |
                  Q₂ vuelve de Q₄ por la **perpendicular a la línea nueva**, que es la paralela a C₂D₂ por
                  Q₄, hasta A₂B₂.
                ejemplo: 'uno(medir_sobre(figura.segmento("AB2"), desde: proy_alzado(Q), distancia: mm(6)), 2)'
              - si: siempre
                mensaje: |
                  Q₂ está donde la paralela a C₂D₂ por Q₄ corta A₂B₂.
          - nombre: Q1
            pide: el extremo de la tubería en AB, en la planta
            es: proy_planta(Q)
            bien: |
              Q₁ está en A₁B₁, en la vertical de Q₂.
            diagnosticos:
              - si: '!en_vertical_de(Q2)'
                mensaje: |
                  Q₁ va en la **vertical de Q₂**: son el mismo punto visto dos veces.
                ejemplo: 'desplaza(proy_planta(Q), dx: mm(6))'
              - si: '!en_recta(figura.segmento("AB1"))'
                mensaje: |
                  Q está en AB: Q₁ va donde la vertical de Q₂ corta **A₁B₁**.
                ejemplo: 'desplaza(proy_planta(Q), dy: mm(-8))'
              - si: siempre
                mensaje: |
                  Q₁ está en la vertical de Q₂, sobre A₁B₁.
          - nombre: P2
            pide: el extremo de la tubería en CD, en el alzado
            es: proy_alzado(P)
            bien: |
              P₂ está en C₂D₂, al pie de la perpendicular desde Q₂: PQ es perpendicular a CD, y CD es
              frontal, así que el ángulo recto se ve en el alzado.
            diagnosticos:
              - si: cerca_de(solucion.X2)
                mensaje: |
                  Ese es el **cruce de A₂B₂ y C₂D₂**, que no es un punto común: ahí CD va por detrás de AB. P
                  sale de Q₂ por la perpendicular a C₂D₂.
                ejemplo: solucion.X2
              - si: cerca_de(solucion.Pvert)
                mensaje: |
                  Has bajado de Q₂ **en vertical**, como si la tubería fuera vertical, y no lo es. PQ es
                  perpendicular a CD, y como CD es frontal, el ángulo recto se ve en el alzado: P₂ es el pie
                  de la perpendicular a C₂D₂ por Q₂.
                ejemplo: solucion.Pvert
              - si: '!en_recta(figura.segmento("CD2"))'
                mensaje: |
                  P está en CD: P₂ va **en C₂D₂**, al pie de la perpendicular que sale de Q₂.
                ejemplo: 'uno(medir_sobre(solucion.perpQ2, desde: proy_alzado(P), distancia: mm(6)), 1)'
              - si: '!en_recta(solucion.perpQ2)'
                mensaje: |
                  Estás en C₂D₂, pero no al pie de la **perpendicular desde Q₂**. CD es frontal: el ángulo
                  recto de PQ con CD se ve en el alzado, con la escuadra apoyada en C₂D₂.
                ejemplo: 'uno(medir_sobre(figura.segmento("CD2"), desde: proy_alzado(P), distancia: mm(6)), 1)'
              - si: siempre
                mensaje: |
                  P₂ está donde la perpendicular a C₂D₂ por Q₂ corta C₂D₂.
          - nombre: P1
            pide: el extremo de la tubería en CD, en la planta
            es: proy_planta(P)
            bien: |
              P₁ está en C₁D₁, en la vertical de P₂. P₁Q₁ y P₂Q₂ son la tubería más corta.
            diagnosticos:
              - si: '!en_vertical_de(P2)'
                mensaje: |
                  P₁ va en la **vertical de P₂**, sobre C₁D₁.
                ejemplo: 'desplaza(proy_planta(P), dx: mm(6))'
              - si: '!en_recta(figura.segmento("CD1"))'
                mensaje: |
                  P está en CD: P₁ va donde la vertical de P₂ corta **C₁D₁**.
                ejemplo: 'desplaza(proy_planta(P), dy: mm(8))'
              - si: siempre
                mensaje: |
                  P₁ está en la vertical de P₂, sobre C₁D₁.
        tramos:
          - traza: segmento2(proy_planta(P), proy_planta(Q))
            tipo: visto
            porque: 'La tubería va por el hueco entre las dos construcciones, sin techo encima: desde arriba nada la tapa.'
          - traza: segmento2(proy_alzado(Q), solucion.x_PQ2)
            tipo: oculto
            porque: 'De Q₂ hasta el borde de A₂B₂, la tubería AB le pasa por delante: P está más atrás que Q, y la tubería nueva sale de AB hacia atrás. AB es opaca, y la tapa.'
          - traza: segmento2(solucion.x_PQ2, proy_alzado(P))
            tipo: visto
            porque: 'Desde que sale de detrás de AB hasta P₂, delante no hay tubería, muro ni tejado: va entre los dos muros, y nada la tapa.'
        trazado:
          - solucion.ab4
          - segmento2(solucion.C_4, solucion.Q_4)
        construccion:
          - con: regla
            traza: segmento2(figura.punto("D2"), solucion.L_E)
            porque: |
              C₁D₁ es horizontal en el papel, así que CD es **frontal**: C₂D₂ está en verdadera magnitud.
              Con la regla, C₂D₂ prolongada más allá de D₂, hasta pasar la línea nueva, que es
              perpendicular a ella.
          - con: marca
            traza: solucion.C_4
            rotulo: C₄≡D₄
            porque: |
              C₄ ≡ D₄, donde C₂D₂ prolongada corta la línea nueva. C es la referencia, así que C₄ cae en la
              línea; D tiene el mismo alejamiento y cae en el mismo punto: CD, de punta.
          - con: escuadra-cartabon
            traza: '[segmento2(figura.punto("A2"), solucion.L_A), segmento2(figura.punto("B2"), solucion.L_B)]'
            guia: figura.segmento("CD2")
            porque: |
              Desde A₂ y B₂, las perpendiculares a la línea nueva, que son las paralelas a C₂D₂, con la
              escuadra apoyada en ella. Largas, más allá de la línea nueva.
          - con: marca
            traza: solucion.K_A
            rotulo: '1'
            porque: |
              1, nombre nuestro, donde la paralela a C₂D₂ por A₂ corta la línea nueva: desde aquí se
              llevará el alejamiento de A.
          - con: marca
            traza: solucion.K_B
            rotulo: '2'
            porque: |
              2, nombre nuestro, donde la paralela a C₂D₂ por B₂ corta la línea nueva.
          - con: regla
            traza: segmento2(figura.punto("C1"), solucion.L_C1)
            porque: |
              En la planta, C₁D₁ prolongada con la regla hacia la izquierda, más allá de la vertical de A₁:
              todos los puntos de CD tienen el alejamiento de C, y lo que cada punto está por debajo de esta
              recta es lo que su alejamiento supera al de C.
          - con: escuadra-cartabon
            traza: '[segmento2(figura.punto("A1"), solucion.L_FA), segmento2(figura.punto("B1"), solucion.L_FB)]'
            guia: figura.segmento("CD1")
            porque: |
              Por A₁ y B₁, las verticales, perpendiculares a C₁D₁, hasta pasarla. La de A₁ va por el eje del
              tramo que sube al depósito.
          - con: marca
            traza: solucion.F_A
            rotulo: F
            porque: |
              F, nombre nuestro, donde la vertical de A₁ corta C₁D₁ prolongada: A₁F, 13,17 mm, es lo que el
              alejamiento de A supera al de C.
          - con: marca
            traza: solucion.F_B
            rotulo: G
            porque: |
              G, nombre nuestro, donde la vertical de B₁ corta C₁D₁: B₁G, 31,20 mm.
          - con: compas
            traza: 'arco(solucion.K_A, por: solucion.A_4, desde: uno(medir_sobre(perpendicular(por: solucion.A_4, a: solucion.projA), desde: solucion.A_4, distancia: mm(3)), 1), hasta: uno(medir_sobre(perpendicular(por: solucion.A_4, a: solucion.projA), desde: solucion.A_4, distancia: mm(3)), 2))'
            toma: segmento2(figura.punto("A1"), solucion.F_A)
            porque: |
              Con el compás, A₁F, y centro en 1: el arco corta la paralela a C₂D₂ por A₂ a los dos lados de
              la línea nueva, y vale el de fuera, el contrario al alzado, porque A tiene más alejamiento que C.
          - con: marca
            traza: solucion.A_4
            rotulo: A₄
            porque: |
              A₄, donde el arco corta la paralela a C₂D₂ por A₂, por fuera de la línea nueva.
          - con: compas
            traza: 'arco(solucion.K_B, por: solucion.B_4, desde: uno(medir_sobre(perpendicular(por: solucion.B_4, a: solucion.projB), desde: solucion.B_4, distancia: mm(3)), 1), hasta: uno(medir_sobre(perpendicular(por: solucion.B_4, a: solucion.projB), desde: solucion.B_4, distancia: mm(3)), 2))'
            toma: segmento2(figura.punto("B1"), solucion.F_B)
            porque: |
              Con el compás, B₁G, y centro en 2, también por fuera: B tiene más alejamiento que C.
          - con: marca
            traza: solucion.B_4
            rotulo: B₄
            porque: |
              B₄, donde el arco corta la paralela a C₂D₂ por B₂, por fuera de la línea nueva.
          - con: regla
            traza: segmento2(solucion.A_4, solucion.L_AB4)
            porque: |
              A₄B₄, la tubería AB en la vista nueva, de A₄ a B₄ y un poco más allá. En esta vista CD es el
              punto C₄.
          - con: escuadra-cartabon
            traza: segmento2(solucion.C_4, solucion.L_Q4)
            guia: solucion.ab4
            porque: |
              Por C₄, la **perpendicular a A₄B₄**, con la escuadra apoyada en A₄B₄, hasta pasarla. CD se ve
              de punta, así que todo lo que le es perpendicular se ve en verdadera magnitud, y esta es la
              perpendicular común.
          - con: marca
            traza: solucion.Q_4
            rotulo: Q₄
            porque: |
              Q₄, donde la perpendicular por C₄ corta A₄B₄. C₄Q₄ es la tubería más corta en verdadera
              magnitud: 23,86 mm.
          - con: escuadra-cartabon
            traza: segmento2(solucion.Q_4, solucion.L_Q2)
            guia: figura.segmento("CD2")
            porque: |
              De vuelta al alzado: por Q₄, la paralela a C₂D₂, perpendicular a la línea nueva, hasta pasar
              A₂B₂, porque Q está en AB.
          - con: marca
            traza: proy_alzado(Q)
            rotulo: Q₂
            porque: |
              Q₂, donde la paralela a C₂D₂ que vuelve de Q₄ corta A₂B₂.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(Q), solucion.L_P2)
            guia: figura.segmento("CD2")
            porque: |
              Por Q₂, la **perpendicular a C₂D₂**, hasta pasarla. PQ es perpendicular a CD, y CD es frontal:
              el ángulo recto se ve en el alzado.
          - con: marca
            traza: proy_alzado(P)
            rotulo: P₂
            porque: |
              P₂, donde la perpendicular por Q₂ corta C₂D₂.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_alzado(Q), solucion.L_Q1), segmento2(proy_alzado(P), solucion.L_P1)]'
            guia: figura.segmento("CD1")
            porque: |
              Las verticales de Q₂ y de P₂, hasta la planta: la de Q₂ hasta pasar A₁B₁, y la de P₂ hasta
              pasar C₁D₁.
          - con: marca
            traza: proy_planta(Q)
            rotulo: Q₁
            porque: |
              Q₁, donde la vertical de Q₂ corta A₁B₁.
          - con: marca
            traza: proy_planta(P)
            rotulo: P₁
            porque: |
              P₁, donde la vertical de P₂ corta C₁D₁.
          - con: arista-vista
            traza: '[segmento2(proy_planta(P), proy_planta(Q)), segmento2(solucion.x_PQ2, proy_alzado(P))]'
            porque: |
              **La tubería**, de P a Q, en continua en la planta, donde nada la tapa, y en el alzado desde
              que sale de detrás de AB, en el borde de A₂B₂, hasta P₂.
          - con: arista-oculta
            traza: segmento2(proy_alzado(Q), solucion.x_PQ2)
            porque: |
              A trazos, en el alzado, el trozo de Q₂ al borde de A₂B₂: P está más atrás que Q, y la
              tubería AB, opaca, le pasa por delante.
        pista: |
          (1) C₁D₁ es horizontal: CD es frontal. Prolonga C₂D₂ hasta la línea nueva: ahí caen C₄ y D₄.
          (2) Por A₂ y B₂, las paralelas a C₂D₂; desde la línea nueva, hacia fuera, lo que A₁ y B₁ están
          por debajo de C₁D₁. (3) Por C₄, la perpendicular a A₄B₄: Q₄. (4) De Q₄, la paralela a C₂D₂
          hasta A₂B₂: Q₂. (5) De Q₂, la perpendicular a C₂D₂: P₂. (6) Las verticales dan Q₁ y P₁.
        desarrollo: |
          En verde claro, A₄B₄ y C₄Q₄ en la vista nueva, y la tubería PQ en las dos vistas: de A₂B₂ a C₂D₂
          en el alzado, perpendicular a C₂D₂, y de A₁B₁ a C₁D₁ en la planta. Q cae casi a la mitad de AB
          y P, a algo más de un tercio de CD desde C: los dos dentro de las tuberías. En el alzado, de Q₂
          al borde de A₂B₂ la tubería va a trazos: sale de AB hacia atrás, y AB, que es opaca, la tapa.

      - tipo: calcular
        titulo: La longitud de la tubería
        pregunta: ¿Cuánto mide la tubería más corta entre AB y CD?
        respuesta:
          tipo: numero
          valor: '23.86'
          receta: d_mm
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '22.70'
            receta: en_mm(vm_planta(P, Q))
            mensaje: |
              Eso es lo que mide **P₁Q₁ en la planta**. La tubería sube de P a Q, y la planta la acorta;
              en verdadera magnitud se ve en la vista nueva, C₄Q₄.
          - valor: '8.56'
            receta: en_mm(vm_alzado(P, Q))
            mensaje: |
              Eso es **P₂Q₂ en el alzado**, que acorta mucho: la tubería va sobre todo de atrás hacia
              delante.
          - valor: '27.99'
            receta: en_mm(vm(C, QC))
            mensaje: |
              Esa es la distancia de **C a la tubería AB**: perpendicular a AB, pero no a CD. La más corta
              es la perpendicular común, que no sale de C.
        pista: |
          Mide C₄Q₄ con «medir» del Taller, en el paso anterior, o en tu lámina de papel: con CD de punta,
          la perpendicular común está en verdadera magnitud.
        desarrollo: |
          Con CD de punta, la tubería se ve en verdadera magnitud:

          $$ \overline{PQ} = \overline{C_4Q_4} \approx 23{,}86 \text{ mm} $$

          Por otro camino sale lo mismo: P₁Q₁ mide 22,70 mm en la planta y Q está 7,33 mm más alto que P,
          y la hipotenusa de esos dos catetos es 23,86 mm.

          Dos medidas del dibujo caen dentro de la tolerancia por casualidad: A₂Q₂, 24,66 mm, y Q₂B₂,
          24,21. Son las dos mitades de A₂B₂ en el alzado, porque Q cae casi a la mitad de AB, y no miden
          nada de la tubería.
      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: AB y CD se cruzan; la tubería más corta entre ellas es su perpendicular común.
          - texto: C₁D₁ es horizontal, así que CD es frontal, y un cambio de plano con la línea nueva perpendicular a C₂D₂ la deja de punta.
          - texto: Con CD de punta, la perpendicular desde C₄ a A₄B₄ está en verdadera magnitud y da Q₄.
          - texto: Q vuelve al alzado por la paralela a C₂D₂ hasta A₂B₂, y P₂ es el pie de la perpendicular a C₂D₂ por Q₂, porque el ángulo recto con la frontal CD se ve en el alzado.
          - texto: La tubería va por donde se cruzan A₂B₂ y C₂D₂ en el alzado, porque ahí las dos tuberías se tocan.
            trampa: true
            mensaje: |
              Ese cruce es solo del papel: ahí AB va por delante de CD, 25,56 mm más cerca de quien mira.
              La más corta es la perpendicular común, de 23,86 mm.
    resolucion: |
      **Qué se pide.** AB y CD se cruzan: no son paralelas ni se cortan, aunque sus alzados se crucen en
      el papel. La tubería más corta que las une es su perpendicular común, que corta a las dos y es
      perpendicular a ambas.

      **Cómo se construye.** C₁D₁ es horizontal en el papel, así que CD es frontal y C₂D₂ está en
      verdadera magnitud. Un cambio de plano horizontal con la línea nueva perpendicular a C₂D₂ deja CD
      de punta: C₄ ≡ D₄. Cada punto se aparta de la línea nueva lo que su alejamiento supera al de CD,
      que en la planta es lo que está por debajo de C₁D₁: A, 13,17 mm, y B, 31,20. En la vista nueva, la
      perpendicular desde C₄ a A₄B₄ da Q₄. Q vuelve al alzado por la paralela a C₂D₂, y P₂ es el pie de la
      perpendicular a C₂D₂ por Q₂: el ángulo recto con una frontal se ve en el alzado. Las verticales dan
      Q₁ en A₁B₁ y P₁ en C₁D₁.

      **El resultado.** La tubería mide 23,86 mm. Q está casi a la mitad de AB, y P a algo más de un
      tercio de CD desde C: los dos pies caen dentro de las tuberías, y la tubería va por el hueco entre
      las dos construcciones. En la planta se ve entera; en el alzado, de Q₂ al borde de A₂B₂ va a
      trazos, porque sale de AB hacia atrás y AB la tapa. En la planta mide 22,70 mm y en el alzado 8,56:
      va sobre todo de atrás hacia delante.

  - id: sd57-la-tuberia-mas-corta-entre-ab-y-cd-paralelas
    titulo: La tubería más corta entre AB y CD, cuando son paralelas
    fuente: Ejercicio 41 (SD57) · Colección de ejercicios de Geometría Descriptiva, Sistema Diédrico Directo · Dpto. de Expresión Gráfica y Proyectos de Ingeniería, EIG · UPV/EHU
    nivel: practica
    # Decisión: el texto impreso tal cual, cotejado con la página (pág. 42),
    # que tiene capa de texto para el enunciado. Difiere del Ejercicio 40 solo
    # en «a través de la tubería AB. En cambio, la tubería CD conecta…», donde
    # el 40 dice «a través de la tubería AB y la tubería CD conecta…». La
    # figura es una imagen: las coordenadas se miden sobre ella (lámina sd57,
    # con sus notas). Q y H son nombres nuestros.
    enunciado: |
      En el croquis de la figura se representan dos construcciones. En el de la izquierda se
      encuentra un depósito que se conecta con el exterior a través de la tubería AB. En cambio, la
      tubería CD conecta ambas construcciones. Representar la tubería de menor longitud posible que
      une las tuberías AB y CD.

      **Notas nuestras.** «En el de la izquierda», en masculino, es errata de la hoja por «en la de la
      izquierda», la construcción, y se deja tal como está impresa. Es el croquis del Ejercicio 40 con
      otra tubería CD: va de lo alto del muro de la izquierda al muro de la derecha, y ya no cruza a AB
      en ninguna vista. A, B, C y D son las cruces de los ejes de las tuberías, de trazo y punto, y se
      trabaja con los ejes. La figura de esta página es una imagen: sus puntos se han medido sobre
      ella, con un error de una décima de milímetro. AB y CD son paralelas —sus proyecciones lo son en
      las dos vistas—, así que la tubería más corta no es única: cualquier perpendicular a las dos que
      caiga entre las dos tuberías mide lo mismo, la distancia entre ellas. Hay que escoger una, y la
      escogemos nosotros: la que sale de D, en el muro de la derecha, y llega a AB cerca de B. La que
      saliera de A cruzaría la esquina del muro de la izquierda; las que salen de AB desde algo menos
      de un sexto de su longitud, contado desde A, hasta la que sale de D pasan todas por el hueco
      entre las dos construcciones, y las que salen más cerca de B ya no llegan a CD, que acaba en D.
      La lámina no da escala: se mide en el papel, en milímetros. Llamamos Q al punto de AB donde
      llega la tubería, y H a un punto de la construcción.
    pide: Q, donde la tubería que sale de D llega a AB, en las dos vistas, con las dos tuberías en verdadera magnitud y luego de punta en dos cambios de plano; la tubería pasada a limpio, y, como pregunta nuestra, su longitud.
    receta:
      lamina: sd57
      escena:
        A: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("A1"))'
        B: 'punto3(alzado: figura.punto("B2"), planta: figura.punto("B1"))'
        C: 'punto3(alzado: figura.punto("C2"), planta: figura.punto("C1"))'
        D: 'punto3(alzado: figura.punto("D2"), planta: figura.punto("D1"))'
        ab: recta3(A, B)
        cd: recta3(C, D)
      solucion:
        # AB y CD forman 0,04°: son paralelas con lo que da la medida. La
        # perpendicular común de dos paralelas no es una: no se usa pie_comun
        # (con 0,04° la daría lejísimos, fuera de las tuberías) sino la
        # perpendicular desde D a AB.
        # Decisión: la tubería sale de D (nuestra elección, en las Notas): su pie
        # Q cae en AB a 0,915 desde A. Desde A, el pie caería en CD a 0,05, y la
        # tubería atravesaría la esquina del muro de la izquierda en la planta.
        Q: pie_perpendicular(D, ab)
        d_mm: en_mm(vm(D, Q))
        # Decisión: dos cambios de plano, como las diapositivas de distancias
        # (pág. 8), con las líneas nuevas en la lámina y B, el punto más bajo,
        # de referencia en los dos. El primero, vertical, con «nueva1» paralela
        # a A₁B₁: AB y CD, en verdadera magnitud y paralelas. El segundo, con
        # «nueva2» perpendicular a A₄B₄: las dos, de punta a la vez.
        A_4: 'cambio_plano_vertical(A, figura.segmento("nueva1"), ref: B)'
        B_4: 'cambio_plano_vertical(B, figura.segmento("nueva1"), ref: B)'
        C_4: 'cambio_plano_vertical(C, figura.segmento("nueva1"), ref: B)'
        D_4: 'cambio_plano_vertical(D, figura.segmento("nueva1"), ref: B)'
        Q_4: 'cambio_plano_vertical(Q, figura.segmento("nueva1"), ref: B)'
        A_5: 'cambio_plano_vertical(A, figura.segmento("nueva1"), ref: B, luego: figura.segmento("nueva2"))'
        C_5: 'cambio_plano_vertical(C, figura.segmento("nueva1"), ref: B, luego: figura.segmento("nueva2"))'
        ab4: segmento2(A_4, B_4)
        cd4: segmento2(C_4, D_4)
        # Las líneas de referencia del primer cambio, desde la planta,
        # perpendiculares a «nueva1», y sus pies en ella (los centros del compás).
        refA1: 'perpendicular(por: figura.punto("A1"), a: figura.segmento("nueva1"))'
        refC1: 'perpendicular(por: figura.punto("C1"), a: figura.segmento("nueva1"))'
        refD1: 'perpendicular(por: figura.punto("D1"), a: figura.segmento("nueva1"))'
        K_A: 'pie_perpendicular(figura.punto("A1"), figura.segmento("nueva1"))'
        K_C: 'pie_perpendicular(figura.punto("C1"), figura.segmento("nueva1"))'
        K_D: 'pie_perpendicular(figura.punto("D1"), figura.segmento("nueva1"))'
        # La horizontal de B₂ en el alzado, donde corta las verticales de A, C y
        # D: lo que A₂, C₂ y D₂ están por encima es lo que A, C y D están más
        # altos que B.
        A_b: 'cruce_aparente(segmento2(figura.punto("B2"), desplaza(figura.punto("B2"), dx: 10)), segmento2(figura.punto("A2"), figura.punto("A1")))'
        C_b: 'cruce_aparente(segmento2(figura.punto("B2"), desplaza(figura.punto("B2"), dx: 10)), segmento2(figura.punto("C2"), figura.punto("C1")))'
        D_b: 'cruce_aparente(segmento2(figura.punto("B2"), desplaza(figura.punto("B2"), dx: 10)), segmento2(figura.punto("D2"), figura.punto("D1")))'
        perpD4: 'perpendicular(por: D_4, a: ab4)'
        refQ: 'perpendicular(por: Q_4, a: figura.segmento("nueva1"))'
        # El segundo cambio: C₄D₄ prolongada corta «nueva2» en K5, y C₅ ≡ D₅ se
        # aparta de ella lo que C₁ dista de A₁B₁ (que es la paralela a «nueva1»
        # por B₁, la referencia): C₁H.
        K5: 'cruce_aparente(cd4, figura.segmento("nueva2"))'
        H: 'pie_perpendicular(figura.punto("C1"), figura.segmento("AB1"))'
        lleva_C5: 'vm_planta(C, punto3(alzado: H, planta: H))'
        # Los errores: lo que A, C y D se acercan respecto de B (la diferencia de
        # alejamientos, en vez de cotas), por Pitágoras, como en SD22.
        dyAB: 'raiz(vm(A, B) * vm(A, B) - vm_alzado(A, B) * vm_alzado(A, B))'
        # Lo visto y lo oculto del alzado: junto a Q₂, la tubería nueva sale de AB
        # hacia atrás (D está más atrás que Q), y AB la tapa hasta su borde, del
        # lado de D₂, a 5,22 pt (1,84 mm) del eje.
        bordeAB2: 'perpendicular(por: uno(medir_sobre(perpendicular(por: figura.punto("A2"), a: figura.segmento("AB2")), desde: figura.punto("A2"), distancia: mm(1.84)), 2), a: perpendicular(por: figura.punto("A2"), a: figura.segmento("AB2")))'
        x_DQ2: 'cruce_aparente(segmento2(proy_alzado(Q), figura.punto("D2")), bordeAB2)'
        # Los extremos de las rectas largas de la construcción.
        L_hI: 'desplaza(A_b, dx: mm(-4))'
        L_hD: 'desplaza(D_b, dx: mm(4))'
        L_A4: 'uno(medir_sobre(refA1, desde: A_4, distancia: mm(4)), 1)'
        L_C4: 'uno(medir_sobre(refC1, desde: C_4, distancia: mm(4)), 1)'
        L_D4: 'uno(medir_sobre(refD1, desde: D_4, distancia: mm(4)), 1)'
        L_B4: 'uno(medir_sobre(perpendicular(por: figura.punto("B1"), a: figura.segmento("nueva1")), desde: B_4, distancia: mm(4)), 1)'
        L_ab4: 'uno(medir_sobre(ab4, desde: A_5, distancia: mm(4)), 2)'
        L_cd4: 'uno(medir_sobre(cd4, desde: C_5, distancia: mm(4)), 2)'
        L_Q4: 'uno(medir_sobre(perpD4, desde: Q_4, distancia: mm(3)), 2)'
        L_Q1: 'uno(medir_sobre(refQ, desde: proy_planta(Q), distancia: mm(4)), 2)'
        L_Q2: 'desplaza(proy_alzado(Q), dy: mm(-4))'
      comprueba:
        - en_recta(Q, ab)
    pasos:
      - tipo: reconocer
        pregunta: Compara A₁B₁ con C₁D₁ y A₂B₂ con C₂D₂. ¿Qué cambia respecto del Ejercicio 40?
        opciones:
          - texto: Nada importante; se cruzan, y la más corta es una sola
            mensaje: |
              Mira las dos vistas: A₁B₁ y C₁D₁ son paralelas, y A₂B₂ y C₂D₂ también. Dos rectas que no son
              de perfil y tienen las dos proyecciones paralelas son paralelas, y no se cruzan: la
              perpendicular común de dos paralelas no es una sola.
          - texto: Que AB y CD son paralelas, y cualquier perpendicular a las dos mide lo mismo
            correcta: true
            mensaje: |
              Eso es. Sus proyecciones son paralelas en las dos vistas, y ninguna es de perfil: las rectas
              son paralelas. La distancia entre ellas es la misma en todas partes, y cualquier
              perpendicular a las dos que caiga entre las tuberías es una tubería más corta. Con una de
              las dos de punta, las dos lo están, y la distancia se mide entre los dos puntos.
          - texto: Que se cortarían si se prolongaran, porque las dos bajan hacia la derecha en las dos vistas, y la tubería más corta tendría longitud cero
            mensaje: |
              Bajar hacia el mismo lado no basta: para cortarse tendrían que tener un punto común, con los
              dos alzados y las dos plantas cortándose en la misma vertical. Aquí las proyecciones son
              paralelas y no se cortan nunca: AB y CD son paralelas.

      # Decisión: un solo paso construir, con los dos cambios, el pie Q y la
      # tubería pasada a limpio. La tubería va por el hueco entre las dos
      # construcciones, vista entera en las dos vistas (segundo camino).
      - tipo: construir
        titulo: La tubería que sale de D, con AB y CD de punta
        intro: |
          AB y CD son paralelas. Dos cambios de plano, con las líneas nuevas ya dibujadas, de trazo y
          punto: el enunciado no las da, y las hemos puesto nosotros. La referencia es B, el punto más
          bajo, en los dos. El primero, vertical, con la línea nueva paralela a A₁B₁, por debajo de la
          planta: cada punto sale de su planta por la perpendicular a la línea y se aparta de ella, hacia
          fuera, lo que está más alto que B, que se lee en el alzado sobre la horizontal de B₂. Ahí AB y
          CD están en verdadera magnitud, y paralelas: la perpendicular desde D₄ a A₄B₄ se ve
          perpendicular y da Q₄, que vuelve a la planta y al alzado. El segundo, con la línea nueva
          perpendicular a A₄B₄, más allá de A₄: AB se ve de punta, y CD también, porque es paralela; cada
          una es un punto, y lo que los separa es la longitud de la tubería. Marca A₄, C₄, D₄, Q₄, Q₁,
          Q₂, A₅ y C₅, y pasa la tubería a limpio con «arista vista» y «arista oculta»: las tuberías son
          opacas. Q₄ cae a 4,5 mm de B₄ y a 3 mm de un cruce de rectas, A₄ también a 3 mm de otro, y Q₁ y Q₂ en el eje de AB, a menos de 2 mm de donde
          las rectas de la construcción cruzan los bordes de la tubería: amplía con la lupa (×4) antes de
          marcarlos.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, visto, oculto, borrar]
        tolerancia: 1
        objetivos:
          - nombre: A4
            pide: A en la vista nueva del primer cambio
            es: solucion.A_4
            bien: |
              A₄ está en la perpendicular a la línea nueva por A₁, a 33,77 mm de ella, hacia fuera: lo que A₂
              está por encima de la horizontal de B₂.
            diagnosticos:
              - si: cerca_de(solucion.K_A)
                mensaje: |
                  Has dejado A₄ en la línea nueva, como si A fuera la referencia. La referencia es B: A se
                  aparta de la línea lo que está más alto que B, de A₂ a la horizontal de B₂.
                ejemplo: solucion.K_A
              - si: 'en_recta(solucion.refA1) && a_distancia(de: solucion.K_A, d: solucion.dyAB)'
                mensaje: |
                  Has llevado lo que A está **más cerca** que B, la diferencia de alejamientos. Un cambio de
                  plano vertical sale de la planta y lleva **cotas**: lo que A₂ está por encima de la
                  horizontal de B₂.
                ejemplo: 'uno(medir_sobre(solucion.refA1, desde: solucion.K_A, distancia: solucion.dyAB), 1)'
              - si: 'cerca_de(uno(medir_sobre(solucion.refA1, desde: solucion.K_A, distancia: diferencia_de_cotas(A, B)), 2))'
                mensaje: |
                  La distancia es la buena, pero **hacia la planta**. La vista nueva queda al otro lado de la
                  línea nueva, y un punto más alto que la referencia se aparta de ella hacia fuera.
                ejemplo: 'uno(medir_sobre(solucion.refA1, desde: solucion.K_A, distancia: diferencia_de_cotas(A, B)), 2)'
              - si: '!en_recta(solucion.refA1)'
                mensaje: |
                  A₄ sale de A₁ por la **perpendicular a la línea nueva**.
                ejemplo: 'desplaza(solucion.A_4, dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular a la línea nueva por A₁, pero no a la distancia buena: lo que A₂
                  está por encima de la horizontal de B₂, desde la línea, hacia fuera.
          - nombre: C4
            pide: C en la vista nueva del primer cambio
            es: solucion.C_4
            bien: |
              C₄ está en la perpendicular a la línea nueva por C₁, a 41,41 mm de ella, hacia fuera: C es el
              punto más alto de los cuatro.
            diagnosticos:
              - si: cerca_de(solucion.K_C)
                mensaje: |
                  Has dejado C₄ en la línea nueva, como si C fuera la referencia. La referencia es B: C se
                  aparta lo que C₂ está por encima de la horizontal de B₂.
                ejemplo: solucion.K_C
              - si: 'cerca_de(uno(medir_sobre(solucion.refC1, desde: solucion.K_C, distancia: diferencia_de_cotas(C, B)), 2))'
                mensaje: |
                  La distancia es la buena, pero **hacia la planta**. C es más alto que B, y se aparta de la
                  línea nueva hacia fuera.
                ejemplo: 'uno(medir_sobre(solucion.refC1, desde: solucion.K_C, distancia: diferencia_de_cotas(C, B)), 2)'
              - si: '!en_recta(solucion.refC1)'
                mensaje: |
                  C₄ sale de C₁ por la **perpendicular a la línea nueva**.
                ejemplo: 'desplaza(solucion.C_4, dx: mm(-6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular a la línea nueva por C₁, pero no a la distancia buena: lo que C₂
                  está por encima de la horizontal de B₂.
          - nombre: D4
            pide: D en la vista nueva del primer cambio
            es: solucion.D_4
            bien: |
              D₄ está en la perpendicular a la línea nueva por D₁, a 8,82 mm de ella, hacia fuera. C₄D₄ es
              paralela a A₄B₄: las dos tuberías, en verdadera magnitud.
            diagnosticos:
              - si: cerca_de(solucion.K_D)
                mensaje: |
                  Has dejado D₄ en la línea nueva, como si D fuera la referencia. La referencia es B: D se
                  aparta lo que D₂ está por encima de la horizontal de B₂.
                ejemplo: solucion.K_D
              - si: 'cerca_de(uno(medir_sobre(solucion.refD1, desde: solucion.K_D, distancia: diferencia_de_cotas(D, B)), 2))'
                mensaje: |
                  La distancia es la buena, pero **hacia la planta**. D es más alto que B, y se aparta de la
                  línea nueva hacia fuera, como A y C.
                ejemplo: 'uno(medir_sobre(solucion.refD1, desde: solucion.K_D, distancia: diferencia_de_cotas(D, B)), 2)'
              - si: '!en_recta(solucion.refD1)'
                mensaje: |
                  D₄ sale de D₁ por la **perpendicular a la línea nueva**.
                ejemplo: 'desplaza(solucion.D_4, dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular a la línea nueva por D₁, pero no a la distancia buena: lo que D₂
                  está por encima de la horizontal de B₂.
          - nombre: Q4
            pide: Q, el pie de la tubería en AB, en la vista nueva del primer cambio
            es: solucion.Q_4
            bien: |
              Q₄ está en A₄B₄, al pie de la perpendicular desde D₄: AB está en verdadera magnitud en esta
              vista, y el ángulo recto se ve recto.
            diagnosticos:
              - si: '!en_recta(solucion.ab4)'
                mensaje: |
                  Q está en AB: Q₄ va **en A₄B₄**, donde la corta la perpendicular que sale de D₄.
                ejemplo: 'uno(medir_sobre(solucion.perpD4, desde: solucion.Q_4, distancia: mm(6)), 1)'
              - si: '!en_recta(solucion.perpD4)'
                mensaje: |
                  Estás en A₄B₄, pero no al pie de la **perpendicular desde D₄**. AB está en verdadera magnitud
                  en esta vista, así que la perpendicular a ella se traza con la escuadra apoyada en A₄B₄.
                ejemplo: 'uno(medir_sobre(solucion.ab4, desde: solucion.Q_4, distancia: mm(8)), 2)'
              - si: siempre
                mensaje: |
                  Q₄ está donde la perpendicular a A₄B₄ por D₄ corta A₄B₄.
          - nombre: Q1
            pide: Q en la planta
            es: proy_planta(Q)
            bien: |
              Q₁ está en A₁B₁, en la perpendicular a la línea nueva que vuelve de Q₄, cerca de B₁.
            diagnosticos:
              - si: '!en_recta(solucion.refQ)'
                mensaje: |
                  Q₁ vuelve de Q₄ por la **perpendicular a la línea nueva**, hasta A₁B₁.
                ejemplo: 'uno(medir_sobre(figura.segmento("AB1"), desde: proy_planta(Q), distancia: mm(6)), 2)'
              - si: '!en_recta(figura.segmento("AB1"))'
                mensaje: |
                  Q está en AB: Q₁ va **en A₁B₁**, donde la corta la perpendicular que vuelve de Q₄.
                ejemplo: 'uno(medir_sobre(solucion.refQ, desde: proy_planta(Q), distancia: mm(6)), 1)'
              - si: siempre
                mensaje: |
                  Q₁ está donde la perpendicular a la línea nueva que sale de Q₄ corta A₁B₁.
          - nombre: Q2
            pide: Q en el alzado
            es: proy_alzado(Q)
            bien: |
              Q₂ está en A₂B₂, en la vertical de Q₁. D₂Q₂ y D₁Q₁ son la tubería.
            diagnosticos:
              - si: '!en_vertical_de(Q1)'
                mensaje: |
                  Q₂ va en la **vertical de Q₁**: son el mismo punto visto dos veces.
                ejemplo: 'desplaza(proy_alzado(Q), dx: mm(6))'
              - si: '!en_recta(figura.segmento("AB2"))'
                mensaje: |
                  Q está en AB: Q₂ va donde la vertical de Q₁ corta **A₂B₂**.
                ejemplo: 'desplaza(proy_alzado(Q), dy: mm(-8))'
              - si: siempre
                mensaje: |
                  Q₂ está en la vertical de Q₁, sobre A₂B₂.
          - nombre: A5
            pide: A en la vista del segundo cambio, que es también B y Q
            es: solucion.A_5
            bien: |
              A₅ ≡ B₅ está en la línea nueva, donde la corta A₄B₄ prolongada: B es la referencia, y A₁ está
              tan lejos de la primera línea nueva como B₁. AB se ve de punta, y Q₅ cae en el mismo punto.
            diagnosticos:
              - si: '!en_recta(solucion.ab4)'
                mensaje: |
                  En el segundo cambio, las referencias van paralelas a A₄B₄: la de A₄ y B₄ es A₄B₄ misma,
                  prolongada más allá de A₄ hasta la línea nueva.
                ejemplo: 'uno(medir_sobre(figura.segmento("nueva2"), desde: solucion.A_5, distancia: mm(6)), 2)'
              - si: siempre
                mensaje: |
                  Estás en A₄B₄ prolongada, pero no en la línea nueva. B es la referencia y cae en ella, y A
                  con B, porque A₁B₁ es paralela a la primera línea nueva.
          - nombre: C5
            pide: C en la vista del segundo cambio, que es también D
            es: solucion.C_5
            bien: |
              C₅ ≡ D₅ está en C₄D₄ prolongada, a 16,46 mm de la línea nueva, hacia fuera: lo que C₁ dista de
              A₁B₁, C₁H. CD también se ve de punta, y A₅C₅ es la distancia entre las dos tuberías: 18,16 mm
              en la lámina, lo mismo que DQ salvo las dos centésimas de error de la medida.
            diagnosticos:
              - si: cerca_de(solucion.K5)
                mensaje: |
                  Te has quedado en la línea nueva. Ahí caería C si estuviera tan lejos de la primera línea
                  nueva como B; C₁ está más lejos lo que dista de A₁B₁, C₁H.
                ejemplo: solucion.K5
              - si: 'cerca_de(uno(medir_sobre(solucion.cd4, desde: solucion.K5, distancia: solucion.lleva_C5), 1))'
                mensaje: |
                  La distancia es la buena, pero **hacia la vista anterior**. C₁ está más lejos de la primera
                  línea nueva que B₁, y C₅ se aparta de la segunda hacia fuera.
                ejemplo: 'uno(medir_sobre(solucion.cd4, desde: solucion.K5, distancia: solucion.lleva_C5), 1)'
              - si: '!en_recta(solucion.cd4)'
                mensaje: |
                  C₅ sale de C₄ por la paralela a A₄B₄, que es C₄D₄ prolongada: CD es paralela a AB.
                ejemplo: 'desplaza(solucion.C_5, dy: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en C₄D₄ prolongada, pero no a la distancia buena: C₁H, desde la línea nueva, hacia
                  fuera.
        tramos:
          - traza: segmento2(figura.punto("D1"), proy_planta(Q))
            tipo: visto
            porque: 'La tubería va por el hueco entre las dos construcciones, sin techo encima: desde arriba nada la tapa.'
          - traza: segmento2(proy_alzado(Q), solucion.x_DQ2)
            tipo: oculto
            porque: 'De Q₂ al borde de A₂B₂, unos 2 mm: la tubería sale de AB hacia atrás, porque D está más atrás que Q, y AB, opaca, la tapa.'
          - traza: segmento2(solucion.x_DQ2, figura.punto("D2"))
            tipo: visto
            porque: 'Desde el borde de A₂B₂ hasta D₂ va entre los dos muros, y delante no hay tubería, muro ni tejado: nada la tapa.'
        trazado:
          - solucion.ab4
          - solucion.cd4
          - segmento2(solucion.D_4, solucion.Q_4)
          - segmento2(solucion.A_5, solucion.C_5)
        construccion:
          - con: regla
            traza: '[segmento2(figura.punto("A2"), figura.punto("A1")), segmento2(figura.punto("C2"), figura.punto("C1")), segmento2(figura.punto("D2"), figura.punto("D1"))]'
            porque: |
              Las líneas de referencia de A, de C y de D, con la regla, de cada alzado a su planta: sobre
              ellas se miden las cotas.
          - con: escuadra-cartabon
            traza: '[segmento2(figura.punto("B2"), solucion.L_hI), segmento2(figura.punto("B2"), solucion.L_hD)]'
            guia: segmento2(figura.punto("A2"), figura.punto("A1"))
            porque: |
              Por B₂, la horizontal, perpendicular a las verticales, hasta pasar la de A por la izquierda
              y la de D por la derecha; por el camino corta la de C. B es el punto más bajo y es la
              referencia: lo que hay de A₂, C₂ y D₂ a esta horizontal es lo que están más altos que B.
          - con: escuadra-cartabon
            traza: '[segmento2(figura.punto("A1"), solucion.L_A4), segmento2(figura.punto("C1"), solucion.L_C4), segmento2(figura.punto("D1"), solucion.L_D4), segmento2(figura.punto("B1"), solucion.L_B4)]'
            guia: figura.segmento("nueva1")
            porque: |
              **Primer cambio de plano.** Por A₁, C₁, D₁ y B₁, las perpendiculares a la primera línea
              nueva, que es paralela a A₁B₁, largas, más allá de ella.
          - con: marca
            traza: solucion.B_4
            rotulo: B₄
            porque: |
              B₄, donde la perpendicular por B₁ corta la línea nueva: B es la referencia, y su cota cuenta
              como cero.
          - con: compas
            traza: 'arco(solucion.K_A, por: solucion.A_4, desde: uno(medir_sobre(perpendicular(por: solucion.A_4, a: solucion.refA1), desde: solucion.A_4, distancia: mm(3)), 1), hasta: uno(medir_sobre(perpendicular(por: solucion.A_4, a: solucion.refA1), desde: solucion.A_4, distancia: mm(3)), 2))'
            toma: segmento2(figura.punto("A2"), solucion.A_b)
            porque: |
              Con el compás, lo que A₂ está por encima de la horizontal de B₂, y centro donde la
              perpendicular por A₁ corta la línea nueva: hacia fuera, al lado contrario de la planta.
          - con: marca
            traza: solucion.A_4
            rotulo: A₄
            porque: |
              A₄, donde el arco corta la perpendicular por A₁, por fuera de la línea nueva.
          - con: compas
            traza: 'arco(solucion.K_C, por: solucion.C_4, desde: uno(medir_sobre(perpendicular(por: solucion.C_4, a: solucion.refC1), desde: solucion.C_4, distancia: mm(3)), 1), hasta: uno(medir_sobre(perpendicular(por: solucion.C_4, a: solucion.refC1), desde: solucion.C_4, distancia: mm(3)), 2))'
            toma: segmento2(figura.punto("C2"), solucion.C_b)
            porque: |
              Lo mismo con C: de C₂ a la horizontal de B₂, desde la línea nueva sobre la perpendicular por
              C₁, hacia fuera.
          - con: marca
            traza: solucion.C_4
            rotulo: C₄
            porque: |
              C₄, donde el arco corta la perpendicular por C₁, por fuera de la línea nueva.
          - con: compas
            traza: 'arco(solucion.K_D, por: solucion.D_4, desde: uno(medir_sobre(perpendicular(por: solucion.D_4, a: solucion.refD1), desde: solucion.D_4, distancia: mm(3)), 1), hasta: uno(medir_sobre(perpendicular(por: solucion.D_4, a: solucion.refD1), desde: solucion.D_4, distancia: mm(3)), 2))'
            toma: segmento2(figura.punto("D2"), solucion.D_b)
            porque: |
              Y con D: de D₂ a la horizontal de B₂, que es poco, sobre la perpendicular por D₁, hacia
              fuera.
          - con: marca
            traza: solucion.D_4
            rotulo: D₄
            porque: |
              D₄, donde el arco corta la perpendicular por D₁, por fuera de la línea nueva.
          - con: regla
            traza: '[segmento2(solucion.B_4, solucion.L_ab4), segmento2(solucion.D_4, solucion.L_cd4)]'
            porque: |
              A₄B₄ y C₄D₄, las dos tuberías en verdadera magnitud, prolongadas más allá de A₄ y de C₄ hasta
              pasar la segunda línea nueva. Salen paralelas: AB y CD lo son.
          - con: escuadra-cartabon
            traza: segmento2(solucion.D_4, solucion.L_Q4)
            guia: solucion.ab4
            porque: |
              Por D₄, la **perpendicular a A₄B₄**, con la escuadra apoyada en A₄B₄, hasta pasarla: AB está en
              verdadera magnitud, y el ángulo recto de la tubería con ella se ve recto.
          - con: marca
            traza: solucion.Q_4
            porque: |
              Q₄, donde la perpendicular por D₄ corta A₄B₄: el extremo de la tubería en AB. Va sin rótulo,
              porque B₄, a 4,5 mm, lo taparía.
          - con: escuadra-cartabon
            traza: segmento2(solucion.Q_4, solucion.L_Q1)
            guia: figura.segmento("nueva1")
            porque: |
              De vuelta a la planta: por Q₄, la perpendicular a la primera línea nueva, hasta pasar A₁B₁,
              porque Q está en AB.
          - con: marca
            traza: proy_planta(Q)
            porque: |
              Q₁, donde la perpendicular que vuelve de Q₄ corta A₁B₁, a 3,5 mm de B₁. Va sin rótulo: el de B₁
              lo pisaría.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(Q), solucion.L_Q2)
            guia: segmento2(figura.punto("A2"), figura.punto("A1"))
            porque: |
              Por Q₁, la vertical, paralela a las líneas de referencia, hasta pasar A₂B₂.
          - con: marca
            traza: proy_alzado(Q)
            porque: |
              Q₂, donde la vertical de Q₁ corta A₂B₂, justo antes del codo de B₂. Va sin rótulo: el de B₂ lo
              pisaría.
          - con: marca
            traza: solucion.A_5
            rotulo: A₅
            porque: |
              **Segundo cambio de plano**, con la línea nueva perpendicular a A₄B₄. Sus referencias van
              paralelas a A₄B₄, y la de A₄ y B₄ es A₄B₄ prolongada. A₅ ≡ B₅, donde corta la segunda línea
              nueva: B es la referencia, y A₁ está tan lejos de la primera línea como B₁. AB, de punta.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("C1"), solucion.H)
            guia: figura.segmento("nueva1")
            porque: |
              En la planta, por C₁, la perpendicular a A₁B₁ hasta A₁B₁: es la perpendicular a la primera
              línea nueva, la que ya pasa por C₁, en el trozo que va de C₁ a A₁B₁.
          - con: marca
            traza: solucion.H
            porque: |
              H, nombre nuestro, donde la perpendicular por C₁ corta A₁B₁, junto a A₁: C₁H, 16,46 mm, es lo
              que C₁ está más lejos de la primera línea nueva que B₁, porque A₁B₁ es paralela a ella y pasa
              por B₁. Va sin rótulo: el de A₁ lo pisaría.
          - con: compas
            traza: 'arco(solucion.K5, por: solucion.C_5, desde: uno(medir_sobre(perpendicular(por: solucion.C_5, a: solucion.cd4), desde: solucion.C_5, distancia: mm(3)), 1), hasta: uno(medir_sobre(perpendicular(por: solucion.C_5, a: solucion.cd4), desde: solucion.C_5, distancia: mm(3)), 2))'
            toma: segmento2(figura.punto("C1"), solucion.H)
            porque: |
              Con el compás, C₁H, y centro donde C₄D₄ prolongada corta la segunda línea nueva: hacia fuera,
              lejos de la vista anterior.
          - con: marca
            traza: solucion.C_5
            rotulo: C₅
            porque: |
              C₅ ≡ D₅, donde el arco corta C₄D₄ prolongada: CD también se ve de punta. A₅C₅, 18,16 mm, es la
              distancia entre las dos tuberías, la longitud de cualquier tubería más corta.
          - con: arista-vista
            traza: '[segmento2(figura.punto("D1"), proy_planta(Q)), segmento2(solucion.x_DQ2, figura.punto("D2"))]'
            porque: |
              **La tubería**, de D a Q, en continua: entera en la planta, y en el alzado desde el borde de
              A₂B₂ hasta D₂. Va por el hueco entre las dos construcciones.
          - con: arista-oculta
            traza: segmento2(proy_alzado(Q), solucion.x_DQ2)
            porque: |
              A trazos, en el alzado, los 2 mm de Q₂ al borde de A₂B₂: la tubería sale de AB hacia atrás,
              y AB, opaca, la tapa.
        pista: |
          (1) La horizontal de B₂ da lo que A, C y D están más altos que B. (2) Primer cambio: cada punto,
          por la perpendicular a la línea nueva, hacia fuera, su altura sobre B; A₄B₄ y C₄D₄ salen
          paralelas. (3) Por D₄, la perpendicular a A₄B₄: Q₄; vuelve a A₁B₁ y, por la vertical, a A₂B₂.
          (4) Segundo cambio: A₄B₄ prolongada corta la línea nueva en A₅ ≡ B₅; C₄D₄ prolongada, a C₁H de la
          línea, da C₅ ≡ D₅.
        desarrollo: |
          En verde claro, A₄B₄ y C₄D₄ paralelas, D₄Q₄ perpendicular a las dos, y A₅C₅ con las dos tuberías
          de punta; y la tubería DQ en las dos vistas. Q cae en AB a 3,5 mm de B en la planta. Otra
          tubería perpendicular a las dos, más cerca de A, mediría lo mismo.

      - tipo: calcular
        titulo: La longitud de la tubería
        pregunta: ¿Cuánto mide la tubería más corta entre AB y CD?
        respuesta:
          tipo: numero
          valor: '18.18'
          receta: d_mm
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '13.15'
            receta: en_mm(vm_alzado(D, Q))
            mensaje: |
              Eso es **D₂Q₂ en el alzado**, que acorta: la tubería va de delante hacia atrás. En verdadera
              magnitud se ve con las dos tuberías de punta, A₅C₅.
          - valor: '7.70'
            receta: 'en_mm(vm_planta(punto3(alzado: D_4, planta: D_4), punto3(alzado: Q_4, planta: Q_4)))'
            mensaje: |
              Eso es **D₄Q₄ en la vista del primer cambio**. Ahí las tuberías están en verdadera magnitud,
              y el ángulo recto se ve, pero la tubería DQ no es paralela a esa vista y sale acortada. Su
              verdadera magnitud está en el segundo cambio, con las dos de punta.
          - valor: '16.46'
            receta: 'en_mm(vm_planta(C, punto3(alzado: H, planta: H)))'
            mensaje: |
              Eso es lo que separa A₁B₁ de C₁D₁ **en la planta**, C₁H. La planta no enseña que CD está más
              alta que AB: C₁H es solo una de las dos componentes de la distancia.
        pista: |
          Mide A₅C₅ con «medir» del Taller, en el paso anterior, o en tu lámina de papel: con las dos
          tuberías de punta, la distancia está en verdadera magnitud.
        desarrollo: |
          Con las dos tuberías de punta, la distancia entre ellas se ve en verdadera magnitud:

          $$ \overline{DQ} = \overline{A_5C_5} \approx 18{,}18 \text{ mm} $$

          En la lámina, A₅C₅ sale 18,16 mm y DQ, 18,18: los puntos se han medido sobre una imagen, y esas
          dos centésimas son el error de la medida, no una diferencia entre las tuberías. Ninguna regla
          las distingue. Por otro camino: D₁Q₁ mide 17,18 mm en la planta y D está 5,95 mm más alto que Q, y
          la hipotenusa de esos dos catetos es 18,18 mm.

          Una medida del dibujo cae dentro de la tolerancia por casualidad: D₁Q₁, la planta de la
          tubería, 17,18 mm, justo en el borde. No es la longitud de la tubería: la planta la acorta, poco,
          porque la tubería sube poco.
      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: A₁B₁ y C₁D₁ son paralelas, y A₂B₂ y C₂D₂ también, así que AB y CD son paralelas.
          - texto: La tubería más corta es cualquier perpendicular a las dos; la que sale de D llega a AB cerca de B, por el hueco entre las construcciones.
          - texto: Con un cambio de plano las dos tuberías quedan en verdadera magnitud, y la perpendicular desde D₄ a A₄B₄ da Q₄.
          - texto: Con otro cambio, las dos quedan de punta a la vez, y la distancia entre los dos puntos es la longitud de la tubería.
          - texto: Como en el Ejercicio 40, la tubería más corta es una sola, la perpendicular común, y sale de un pie que hay que buscar.
            trampa: true
            mensaje: |
              En el 40, AB y CD se cruzan, y su perpendicular común es una. Aquí son paralelas: todas las
              perpendiculares a las dos miden lo mismo, 18,18 mm, y hay que escoger una.
    resolucion: |
      **Qué cambia respecto del Ejercicio 40.** A₁B₁ y C₁D₁ son paralelas, y A₂B₂ y C₂D₂ también: AB y
      CD son paralelas, y la tubería más corta no es una sola. Cualquier perpendicular a las dos que
      caiga entre las tuberías mide lo mismo, la distancia entre las dos. Escogemos la que sale de D,
      en el muro de la derecha: la que saliera de A cruzaría la esquina del muro de la izquierda.

      **Cómo se construye.** Dos cambios de plano, con B de referencia. El primero, con la línea nueva
      paralela a A₁B₁, pone las dos tuberías en verdadera magnitud: cada punto se aparta de ella lo que
      está más alto que B (A, 33,77 mm; C, 41,41; D, 8,82). Ahí la perpendicular desde D₄ a A₄B₄ da Q₄,
      que vuelve a A₁B₁ por la perpendicular a la línea nueva y a A₂B₂ por la vertical. El segundo, con
      la línea nueva perpendicular a A₄B₄, deja AB de punta y, con ella, CD: A₅ ≡ B₅ y C₅ ≡ D₅.

      **El resultado.** La tubería DQ mide 18,18 mm, la distancia entre las dos tuberías. Q cae en AB
      cerca de B, y la tubería va por el hueco entre las dos construcciones, vista entera. En la planta
      mide 17,18 mm y en el alzado 13,15.

  - id: sd58-la-tuberia-mas-corta-hasta-la-tolva
    titulo: La tubería más corta de P a la tolva
    fuente: Ejercicio 42 (SD58) · Colección de ejercicios de Geometría Descriptiva, Sistema Diédrico Directo · Dpto. de Expresión Gráfica y Proyectos de Ingeniería, EIG · UPV/EHU
    nivel: practica
    # Decisión: el texto impreso tal cual, cotejado con la página (pág. 43). La
    # figura no nombra nada más que P: los nombres de los vértices, T, K, J y
    # los puntos 1, 2 y 3 son nuestros, y las Notas nuestras dicen dónde está
    # cada uno.
    enunciado: |
      Se presenta el alzado y la planta de una tolva. Se quiere instalar una tubería de mínima
      distancia desde el punto P exterior hasta la tolva. Representar el eje de la tubería.

      **Notas nuestras.** La tolva es un tronco de pirámide con la base grande abajo y la boca
      pequeña arriba, de la que sale un tubo vertical cortado por una línea ondulada. La figura solo
      nombra P. Llamamos A, B, C y D a los vértices de la base, el cuadrado grande: A, el de la
      izquierda de la planta; B, el de abajo; C, el de la derecha, y D, el de arriba. E, F, G y H son
      los de la boca, cada uno en la arista que sube de A, B, C y D. En el alzado, la base es la recta
      de abajo, con A₂, B₂, D₂ y C₂ de izquierda a derecha, y la boca la de arriba, con E₂, F₂, H₂ y
      G₂. P₂ está a la altura de la boca, y P₁, fuera de la planta, abajo a la izquierda. La lámina no
      da escala: se mide en el papel, en milímetros. T es el punto donde la tubería llega a la tolva,
      y K, J y los puntos 1, 2 y 3 son puntos de la construcción, también nombres nuestros.
    pide: El eje de la tubería, de P a T, en las dos vistas, con el plano de la cara ABFE de canto en un cambio de plano; y, como pregunta nuestra, su longitud.
    receta:
      lamina: sd58
      escena:
        A: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("A1"))'
        B: 'punto3(alzado: figura.punto("B2"), planta: figura.punto("B1"))'
        C: 'punto3(alzado: figura.punto("C2"), planta: figura.punto("C1"))'
        D: 'punto3(alzado: figura.punto("D2"), planta: figura.punto("D1"))'
        E: 'punto3(alzado: figura.punto("E2"), planta: figura.punto("E1"))'
        F: 'punto3(alzado: figura.punto("F2"), planta: figura.punto("F1"))'
        G: 'punto3(alzado: figura.punto("G2"), planta: figura.punto("G1"))'
        H: 'punto3(alzado: figura.punto("H2"), planta: figura.punto("H1"))'
        P: 'punto3(alzado: figura.punto("P2"), planta: figura.punto("P1"))'
        cara: plano(A, B, E)
      solucion:
        # El tronco de la tolva es convexo, y P está fuera. La distancia mínima
        # es a la cara cuyo plano, con P del lado de fuera, recibe el pie de la
        # perpendicular dentro de la cara: entonces todo el tronco queda al otro
        # lado de ese plano y ningún punto suyo está más cerca. Es ABFE (pie a 3,3 mm de
        # BF, dentro). Los planos de BCGF y DAEH pasan más cerca de P (2,89 y
        # 10,08 mm), pero sus pies caen fuera de las caras; los de CDHG, la
        # base y la boca, también. El tubo de la boca, que sale del tronco, queda
        # a 32,1 mm como poco (segundo camino, guiones/segundo-camino.mjs, que
        # busca además el mínimo por fuerza bruta en toda la superficie).
        T: pie_en_plano(P, cara)
        d_mm: en_mm(distancia_a_plano(P, cara))
        # Decisión: el método es el de las diapositivas de distancias (pág. 5):
        # la cara se pone proyectante con un cambio de plano vertical, con la
        # línea nueva perpendicular a A₁B₁ (AB es una horizontal de la cara). Va
        # en la lámina, de tipo «e», 7 mm más allá de B₁, porque el enunciado
        # no la da; la referencia es A, de la base, que cae en la línea.
        A_4: 'cambio_plano_vertical(A, figura.segmento("nueva"), ref: A)'
        E_4: 'cambio_plano_vertical(E, figura.segmento("nueva"), ref: A)'
        P_4: 'cambio_plano_vertical(P, figura.segmento("nueva"), ref: A)'
        T_4: 'cambio_plano_vertical(T, figura.segmento("nueva"), ref: A)'
        canto: segmento2(A_4, E_4)
        # Los pies en la línea nueva (los puntos 1, 2 y 3), y en la recta de la
        # base del alzado, K₂ bajo P₂ y J₂ bajo T₂.
        N1: 'pie_perpendicular(figura.punto("E1"), figura.segmento("nueva"))'
        N2: 'pie_perpendicular(figura.punto("P1"), figura.segmento("nueva"))'
        N3: 'pie_perpendicular(proy_planta(T), figura.segmento("nueva"))'
        K_2: 'cruce_aparente(segmento2(figura.punto("P2"), figura.punto("P1")), figura.segmento("AC2"))'
        J_2: 'cruce_aparente(segmento2(proy_alzado(T), proy_planta(T)), figura.segmento("AC2"))'
        refE: 'perpendicular(por: figura.punto("E1"), a: figura.segmento("nueva"))'
        refP: 'perpendicular(por: figura.punto("P1"), a: figura.segmento("nueva"))'
        refT: 'perpendicular(por: T_4, a: figura.segmento("nueva"))'
        perpP4: 'perpendicular(por: P_4, a: canto)'
        # t₁, la planta de la tubería: perpendicular a A₁B₁, que es paralela a
        # la línea nueva.
        t1: 'perpendicular(por: figura.punto("P1"), a: figura.segmento("AB1"))'
        cotaE: diferencia_de_cotas(E, A)
        cotaT: diferencia_de_cotas(T, A)
        # Los errores. La cota llevada hacia el lado de la planta.
        E4dentro: 'uno(medir_sobre(refE, desde: N1, distancia: cotaE), 2)'
        P4dentro: 'uno(medir_sobre(refP, desde: N2, distancia: cotaE), 2)'
        # T₁ tomado en A₁B₁, el pie de P₁ en la planta, y T₂ a la altura de P₂.
        T1_AB: 'pie_perpendicular(figura.punto("P1"), figura.segmento("AB1"))'
        T2_altoP: 'cruce_aparente(segmento2(proy_alzado(T), proy_planta(T)), figura.segmento("EG2"))'
        # Los extremos de las rectas largas de la construcción.
        L_vP: 'desplaza(K_2, dy: mm(2))'
        L_AB: 'uno(medir_sobre(figura.segmento("AB1"), desde: A_4, distancia: mm(3)), 1)'
        L_E: 'uno(medir_sobre(refE, desde: E_4, distancia: mm(2)), 1)'
        L_P: 'uno(medir_sobre(refP, desde: P_4, distancia: mm(2)), 1)'
        L_T4: 'uno(medir_sobre(perpP4, desde: T_4, distancia: mm(2)), 2)'
        L_rT: 'uno(medir_sobre(refT, desde: proy_planta(T), distancia: mm(3)), 2)'
        L_t1: 'uno(medir_sobre(t1, desde: proy_planta(T), distancia: mm(3)), 2)'
        L_vT: 'desplaza(proy_alzado(T), dy: mm(-2))'
      comprueba:
        - en_plano(T, cara)
        - en_plano(F, cara)
    pasos:
      - tipo: reconocer
        pregunta: La tubería más corta va de P a un punto de la tolva. ¿A cuál?
        opciones:
          - texto: Al pie de la perpendicular a la cara ABFE, porque cae dentro de esa cara
            correcta: true
            mensaje: |
              Eso es. P está fuera, del lado de fuera del plano de ABFE, y todo el tronco de la tolva queda
              al otro lado de ese plano. Si el pie de la perpendicular cae dentro de la cara, ningún punto
              del tronco puede estar más cerca, y el tubo de la boca queda más lejos. Hay que comprobarlo: si cayera fuera, esa cara no daría la más corta, y habría que buscarla en las otras caras, en sus aristas o en sus vértices; es lo que pasa con el plano de BCGF.
          - texto: Al pie de la perpendicular al plano de la cara BCGF, el de las caras laterales que pasa más cerca de P
            mensaje: |
              El plano de BCGF pasa a menos de 3 mm de P, pero el pie de esa perpendicular cae muy fuera de
              la cara, del lado de A: ahí no hay tolva. Una distancia a un plano solo es distancia a la
              cara si el pie cae dentro. La cara que lo cumple es ABFE.
          - texto: 'Al punto más cercano de la arista AB: P₁ queda junto a A₁B₁'
            mensaje: |
              Que P₁ esté junto a A₁B₁ en la planta no dice nada de la altura: P está a la altura de la boca,
              y AB es la arista de abajo. El pie de la perpendicular a la cara ABFE cae dentro de la cara, a
              dos tercios de la subida, y está más cerca que cualquier punto de AB.

      # Decisión: un solo paso construir, con el cambio de plano, el pie y su
      # vuelta a las dos vistas. T₁ sale de cortar la referencia de T₄ con t₁
      # (perpendicular a A₁B₁ por P₁), y T₂, de llevar la cota de T con el
      # compás desde la recta de la base: así no hace falta una frontal.
      - tipo: construir
        titulo: La cara ABFE de canto, y la tubería
        intro: |
          AB es una horizontal de la cara ABFE. Con un cambio de plano vertical y la línea nueva
          perpendicular a A₁B₁, la cara se ve de canto, y la perpendicular desde P está en verdadera
          magnitud. La línea nueva ya está dibujada, de trazo y punto, 7 mm más allá de B₁: el enunciado
          no la da, y la hemos puesto nosotros. La referencia es A, de la base, que cae en la línea: cada
          punto sale de su planta por la perpendicular a la línea nueva y se aparta de ella, hacia fuera,
          lo que está más alto que la base, que se lee en el alzado. E y F están a la altura de la boca,
          y P también. Marca E₄, P₄ y T₄, el pie de la perpendicular desde P₄ al canto; y después T en
          la planta y en el alzado. Pasa la tubería a limpio con «arista vista». T₁ y T₂ caen junto a la
          arista BF, a 3,7 y 1,8 mm de un cruce: amplía con la lupa (×4) antes de marcarlos.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, visto, oculto, borrar]
        tolerancia: 1
        objetivos:
          - nombre: E4
            pide: E, el vértice de la boca en la arista que sube de A, en la vista nueva
            es: solucion.E_4
            bien: |
              E₄ está en la perpendicular a la línea nueva que pasa por E₁ y F₁, a 38,5 mm por fuera: lo que
              la boca está más alta que la base. F₄ cae en el mismo punto, y A₄E₄ es la cara ABFE de canto.
            diagnosticos:
              - si: cerca_de(solucion.N1)
                mensaje: |
                  Te has quedado en la línea nueva. Ahí cae A, que es la referencia; E está más alto que A,
                  lo que la boca está por encima de la base, y se aparta eso de la línea, hacia fuera.
                ejemplo: solucion.N1
              - si: cerca_de(solucion.E4dentro)
                mensaje: |
                  La distancia es la buena, pero hacia el lado de la planta. La vista nueva queda al otro
                  lado de la línea nueva, y un punto más alto que la referencia se aparta de ella hacia fuera.
                ejemplo: solucion.E4dentro
              - si: '!en_recta(solucion.refE)'
                mensaje: |
                  E₄ sale de E₁ por la **perpendicular a la línea nueva**, que es la paralela a A₁B₁ por E₁, y
                  pasa por F₁: E y F tienen la misma cota y caen en el mismo punto.
                ejemplo: 'desplaza(solucion.E_4, dx: mm(5))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular buena, pero no a la distancia buena. E₄ se aparta de la línea nueva
                  lo que la boca está más alta que la base: en el alzado, de P₂ o E₂ a la recta de abajo.
          - nombre: P4
            pide: P en la vista nueva
            es: solucion.P_4
            bien: |
              P₄ está en la perpendicular a la línea nueva por P₁, a la misma distancia de ella que E₄: P
              está a la altura de la boca.
            diagnosticos:
              - si: cerca_de(solucion.N2)
                mensaje: |
                  Te has quedado en la línea nueva, como si P tuviera la cota de A. P está a la altura de la
                  boca, 38,5 mm por encima de la base, y se aparta eso de la línea, hacia fuera.
                ejemplo: solucion.N2
              - si: cerca_de(solucion.P4dentro)
                mensaje: |
                  La distancia es la buena, pero hacia el lado de la planta. P está más alto que A, la
                  referencia, y se aparta de la línea nueva hacia fuera, como E₄.
                ejemplo: solucion.P4dentro
              - si: '!en_recta(solucion.refP)'
                mensaje: |
                  P₄ sale de P₁ por la **perpendicular a la línea nueva**, la paralela a A₁B₁ por P₁.
                ejemplo: 'desplaza(solucion.P_4, dx: mm(5))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular buena, pero no a la distancia buena: la cota de P sobre la base,
                  la misma que llevaste para E₄.
          - nombre: T4
            pide: T, el pie de la perpendicular desde P₄ al canto de la cara
            es: solucion.T_4
            bien: |
              T₄ está en el canto A₄E₄, al pie de la perpendicular desde P₄, y cae entre A₄ y E₄: el pie
              está dentro de la cara, entre la arista de abajo y la de arriba. P₄T₄ es la tubería en
              verdadera magnitud.
            diagnosticos:
              - si: en_recta(solucion.canto)
                mensaje: |
                  Estás en el canto, pero no al pie de la perpendicular desde P₄. Con la escuadra apoyada en
                  el canto, la perpendicular por P₄: donde lo corta está T₄.
                ejemplo: 'uno(medir_sobre(solucion.canto, desde: solucion.T_4, distancia: mm(6)), 1)'
              - si: en_recta(solucion.perpP4)
                mensaje: |
                  Vas por la perpendicular al canto desde P₄, pero T₄ es donde lo corta, ni antes ni después.
                ejemplo: punto_medio(segmento2(solucion.P_4, solucion.T_4))
              - si: siempre
                mensaje: |
                  T₄ está en el canto A₄E₄ y en la perpendicular a él que pasa por P₄. Ir de P₄ al canto en
                  paralelo a la línea nueva, a la altura de P, lleva a E₄, y ese no es el camino más corto.
          - nombre: T1
            pide: T, el pie, de vuelta en la planta
            es: proy_planta(T)
            bien: |
              T₁ está donde la perpendicular a la línea nueva que sale de T₄ corta t₁, la perpendicular a
              A₁B₁ por P₁. Cae dentro de A₁B₁F₁E₁, a 2,5 mm de B₁F₁: el pie está dentro de la cara.
            diagnosticos:
              - si: cerca_de(solucion.T1_AB)
                mensaje: |
                  Ese es el pie de P₁ en A₁B₁, en la planta: el punto de la arista de abajo más cercano en
                  planta. P está a la altura de la boca, y la tubería no va a la base: va a T, que en la vista
                  nueva queda a dos tercios del canto.
                ejemplo: solucion.T1_AB
              - si: '!en_recta(solucion.t1)'
                mensaje: |
                  La planta de la tubería, t₁, es **perpendicular a A₁B₁**, la horizontal de la cara, y pasa por
                  P₁: es paralela a la línea nueva. T₁ está en ella.
                ejemplo: 'uno(medir_sobre(solucion.refT, desde: proy_planta(T), distancia: mm(5)), 1)'
              - si: '!en_recta(solucion.refT)'
                mensaje: |
                  T₁ vuelve de T₄ por la **perpendicular a la línea nueva**, hasta t₁.
                ejemplo: 'uno(medir_sobre(solucion.t1, desde: proy_planta(T), distancia: mm(5)), 1)'
              - si: siempre
                mensaje: |
                  T₁ está donde la perpendicular a la línea nueva que sale de T₄ corta t₁.
          - nombre: T2
            pide: T, el pie, en el alzado
            es: proy_alzado(T)
            bien: |
              T₂ está en la vertical de T₁, 25,5 mm por encima de la base: lo que T₄ dista de la línea nueva.
              P₂T₂ baja hacia la derecha, y T₂ cae dentro de la cara ABFE, junto a su arista B₂F₂.
            diagnosticos:
              - si: cerca_de(solucion.T2_altoP)
                mensaje: |
                  Has dejado T₂ a la altura de la boca, como P₂. La tubería baja: T está más bajo que P, y su
                  cota sobre la base es lo que T₄ dista de la línea nueva.
                ejemplo: solucion.T2_altoP
              - si: '!en_vertical_de(T1)'
                mensaje: |
                  T₂ va en la **vertical de T₁**: es el mismo punto visto de frente.
                ejemplo: 'desplaza(proy_alzado(T), dx: mm(5))'
              - si: siempre
                mensaje: |
                  Estás en la vertical de T₁, pero no a la altura buena. T está por encima de la base lo que
                  T₄ dista de la línea nueva: con el compás, desde J₂, en la recta de la base, hacia arriba.
        # Decisión: la tubería se ve entera en las dos vistas (cálculo de líneas
        # ocultas por rayos contra las caras y el tubo de la boca, en el
        # segundo camino). Va de P, fuera, a la cara ABFE, que mira hacia arriba
        # y hacia delante: en las dos vistas queda por delante de la cara.
        tramos:
          - traza: segmento2(figura.punto("P1"), proy_planta(T))
            tipo: visto
            porque: 'La tubería va por encima de la cara ABFE, que mira hacia arriba, y fuera de la tolva: desde arriba nada la tapa.'
          - traza: segmento2(figura.punto("P2"), proy_alzado(T))
            tipo: visto
            porque: 'La cara ABFE mira también hacia delante, y la tubería le queda delante: en el alzado T₂ cae en esa cara, y nada la tapa.'
        construccion:
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("P2"), solucion.L_vP)
            porque: |
              **Lo que lleva cada punto.** La referencia es A, de la base: cada punto lleva lo que está más
              alto que la base. P₂ está a la altura de la boca, en la recta de arriba prolongada. Por P₂, la
              vertical hasta pasar la recta de la base.
          - con: marca
            traza: solucion.K_2
            rotulo: K₂
            porque: |
              K₂, nombre nuestro, donde la vertical de P₂ corta la recta de la base: P₂K₂, 38,5 mm, es lo
              que P, y la boca entera, están más altos que la base.
          - con: regla
            traza: segmento2(figura.punto("B1"), solucion.L_AB)
            porque: |
              **El cambio de plano.** A₁B₁, prolongada con la regla más allá de B₁, hasta pasar la línea
              nueva: es perpendicular a ella, así que es por donde salen A y B.
          - con: marca
            traza: solucion.A_4
            rotulo: A₄
            porque: |
              A₄, donde A₁B₁ prolongada corta la línea nueva: A es la referencia y cae en ella. B tiene su
              misma cota y cae en el mismo punto: AB se ve de punta.
          - con: escuadra-cartabon
            traza: '[segmento2(figura.punto("E1"), solucion.L_E), segmento2(figura.punto("P1"), solucion.L_P)]'
            guia: figura.segmento("nueva")
            porque: |
              Por E₁ y por P₁, las perpendiculares a la línea nueva, largas, más allá de ella. La de E₁ pasa
              por F₁: E₁F₁ es paralela a A₁B₁, y E y F caerán juntos.
          - con: marca
            traza: solucion.N1
            rotulo: '1'
            porque: |
              1, nombre nuestro, donde la perpendicular por E₁ corta la línea nueva: desde aquí se lleva la
              cota de E.
          - con: marca
            traza: solucion.N2
            rotulo: '2'
            porque: |
              2, nombre nuestro, donde la perpendicular por P₁ corta la línea nueva.
          - con: compas
            traza: 'arco(solucion.N1, por: solucion.E_4, desde: uno(medir_sobre(perpendicular(por: solucion.E_4, a: solucion.refE), desde: solucion.E_4, distancia: mm(2)), 1), hasta: uno(medir_sobre(perpendicular(por: solucion.E_4, a: solucion.refE), desde: solucion.E_4, distancia: mm(2)), 2))'
            toma: segmento2(figura.punto("P2"), solucion.K_2)
            porque: |
              Con el compás, P₂K₂, lo que la boca está más alta que la base, y centro en 1: el arco corta la
              perpendicular por fuera de la línea nueva, lejos de la planta, porque E es más alto que A.
          - con: marca
            traza: solucion.E_4
            rotulo: E₄
            porque: |
              E₄ ≡ F₄, donde el arco corta la perpendicular que sale de E₁, por fuera.
          - con: compas
            traza: 'arco(solucion.N2, por: solucion.P_4, desde: uno(medir_sobre(perpendicular(por: solucion.P_4, a: solucion.refP), desde: solucion.P_4, distancia: mm(2)), 1), hasta: uno(medir_sobre(perpendicular(por: solucion.P_4, a: solucion.refP), desde: solucion.P_4, distancia: mm(2)), 2))'
            toma: segmento2(figura.punto("P2"), solucion.K_2)
            porque: |
              Con la misma abertura y centro en 2, el arco por fuera: P está a la altura de la boca.
          - con: marca
            traza: solucion.P_4
            rotulo: P₄
            porque: |
              P₄, donde el arco corta la perpendicular que sale de P₁, por fuera.
          - con: regla
            traza: solucion.canto
            rotulo: canto
            porque: |
              A₄E₄ es la **cara ABFE de canto**: con AB de punta, el plano de la cara se ve como una recta.
          - con: escuadra-cartabon
            traza: segmento2(solucion.P_4, solucion.L_T4)
            guia: solucion.canto
            porque: |
              Por P₄, la perpendicular al canto, hasta pasarlo. En esta vista el plano de la cara es una
              recta, y la perpendicular a él está en verdadera magnitud.
          - con: marca
            traza: solucion.T_4
            rotulo: T₄
            porque: |
              T₄, nombre nuestro, donde la perpendicular corta el canto, entre A₄ y E₄: el pie cae dentro de
              la cara, entre la arista AB y la EF. P₄T₄ es la tubería en verdadera magnitud.
          - con: escuadra-cartabon
            traza: segmento2(solucion.T_4, solucion.L_rT)
            guia: figura.segmento("nueva")
            porque: |
              **La vuelta.** Por T₄, la perpendicular a la línea nueva, de vuelta a la planta, hasta pasar la
              planta de la tolva.
          - con: marca
            traza: solucion.N3
            rotulo: '3'
            porque: |
              3, nombre nuestro, donde esa perpendicular corta la línea nueva: de 3 a T₄ es lo que T está más
              alto que la base.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("P1"), solucion.L_t1)
            guia: figura.segmento("AB1")
            rotulo: t₁
            porque: |
              Por P₁, la perpendicular a A₁B₁, hacia la tolva: es la planta de la tubería, porque AB es una
              horizontal de la cara y el ángulo recto con ella se ve recto en la planta.
          - con: marca
            traza: proy_planta(T)
            rotulo: T₁
            porque: |
              T₁, donde t₁ corta la perpendicular que vuelve de T₄. Cae dentro de A₁B₁F₁E₁, junto a B₁F₁:
              el pie está dentro de la cara también en el otro sentido.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(T), solucion.L_vT)
            porque: |
              Por T₁, la vertical hasta el alzado, más allá de donde caerá T₂.
          - con: marca
            traza: solucion.J_2
            rotulo: J₂
            porque: |
              J₂, nombre nuestro, donde la vertical de T₁ corta la recta de la base.
          - con: compas
            traza: 'arco(solucion.J_2, por: proy_alzado(T), desde: desplaza(proy_alzado(T), dx: mm(-2)), hasta: desplaza(proy_alzado(T), dx: mm(2)))'
            toma: segmento2(solucion.N3, solucion.T_4)
            porque: |
              Con el compás, de 3 a T₄, lo que T está más alto que la base, y centro en J₂: el arco corta la
              vertical por encima de la base.
          - con: marca
            traza: proy_alzado(T)
            rotulo: T₂
            porque: |
              T₂, donde el arco corta la vertical de T₁: dentro de la cara A₂B₂F₂E₂ del alzado.
          - con: arista-vista
            traza: '[segmento2(figura.punto("P1"), proy_planta(T)), segmento2(figura.punto("P2"), proy_alzado(T))]'
            porque: |
              **La tubería**, de P a T, en continua en las dos vistas: va por fuera de la tolva, por encima
              y por delante de la cara ABFE, y nada la tapa.
        pista: |
          (1) La referencia es A: P₂K₂, lo que la boca está más alta que la base. (2) A₁B₁ prolongada da A₄
          en la línea nueva; por E₁ y por P₁, las perpendiculares a la línea, y P₂K₂ por fuera: E₄ y P₄.
          (3) A₄E₄ es el canto; la perpendicular desde P₄ da T₄, entre A₄ y E₄. (4) T₁, donde la
          perpendicular a la línea nueva por T₄ corta la perpendicular a A₁B₁ por P₁. (5) T₂, en la
          vertical de T₁, a la altura que T₄ dista de la línea.
        desarrollo: |
          En verde claro, el canto A₄E₄ con P₄T₄, la tubería en verdadera magnitud, y la tubería en la
          planta y en el alzado. T₄ cae entre A₄ y E₄ y T₁ dentro de A₁B₁F₁E₁: el pie está dentro de la
          cara, y la tubería más corta es esta.

      - tipo: calcular
        titulo: La longitud de la tubería
        pregunta: ¿Cuánto mide la tubería, de P a la tolva?
        respuesta:
          tipo: numero
          valor: '28.47'
          receta: d_mm
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '2.89'
            receta: en_mm(distancia_a_plano(P, plano(B, C, G)))
            mensaje: |
              Es la distancia al **plano** de la cara BCGF, el de las cuatro caras laterales que pasa más cerca de P. Pero el pie de
              esa perpendicular cae fuera de la cara, del lado de A: no llega a la tolva. Solo vale la
              cara cuyo pie cae dentro, ABFE.
          - valor: '10.08'
            receta: en_mm(distancia_a_plano(P, plano(D, A, E)))
            mensaje: |
              Es la distancia al plano de la cara DAEH, la de arriba a la izquierda de la planta. Su pie
              también cae fuera de la cara: la tubería tiene que llegar a la tolva, y la que llega por el
              camino más corto va a ABFE.
          - valor: '12.26'
            receta: en_mm(vm_planta(P, pie_perpendicular(P, recta3(A, B))))
            mensaje: |
              Es lo que separa P₁ de A₁B₁ **en la planta**. La planta no enseña la altura: P está a la altura
              de la boca, y la tubería sube y baja por la cara. Se mide en la vista nueva, P₄T₄.
          - valor: '25.33'
            receta: en_mm(vm_planta(P, T))
            mensaje: |
              Es **P₁T₁ en la planta**: la tubería baja de P a T, y la planta la acorta. Su verdadera magnitud
              es P₄T₄, en la vista nueva.
        pista: |
          Mide P₄T₄ con «medir»: en la vista nueva la cara es una recta, y la perpendicular a ella está en
          verdadera magnitud.
        desarrollo: |
          En la vista nueva, la cara ABFE se ve como el canto A₄E₄, y la tubería es la perpendicular desde
          P₄, en verdadera magnitud:

          $$ d = \overline{P_4T_4} \approx 28{,}47 \text{ mm} $$

          Por otro camino sale lo mismo: T₁ está a 25,33 mm de P₁ en la planta y T, 12,99 mm más bajo que
          P; la hipotenusa de esos dos catetos es 28,47 mm. La arista BF pasa a 28,65 mm de P, casi lo
          mismo, porque T cae junto a ella; pero el punto más cercano de BF está más lejos que T.

          Varias medidas del dibujo caen dentro de la tolerancia y no son la tubería: las aristas
          laterales en la planta, A₁E₁, B₁F₁, C₁G₁ y D₁H₁ (27,91; 28,46; 28,16 y 27,56 mm), lo que hay de F₁
          al punto 1 (27,58 mm) y A₄T₄ en el canto (28,65 mm). La tubería es P₄T₄: la casilla no las
          distingue, pero solo P₄T₄ es la distancia de P a la tolva.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: 'El tronco de la tolva es convexo: si el pie de la perpendicular a una cara cae dentro de ella, con P del lado de fuera, ningún punto del tronco está más cerca.'
          - texto: 'AB es una horizontal de la cara ABFE: con la línea nueva perpendicular a A₁B₁, la cara se ve de canto, A₄E₄.'
          - texto: 'La perpendicular de P₄ al canto da T₄, entre A₄ y E₄; de vuelta, T₁ cae dentro de A₁B₁F₁E₁: el pie está dentro de la cara.'
          - texto: 'P₄T₄ está en verdadera magnitud: la tubería mide 28,47 mm, y se dibuja de P a T en las dos vistas.'
          - texto: 'La tubería va a la cara BCGF, porque su plano es, de los de las caras laterales, el que pasa más cerca de P.'
            trampa: true
            mensaje: |
              El plano de BCGF pasa a 2,89 mm de P, pero el pie de la perpendicular cae fuera de la cara: ahí
              no hay tolva. La distancia a un plano solo es la distancia a la cara si el pie cae dentro.
    resolucion: |
      **Qué cara.** La tolva es un tronco de pirámide, convexo, y P está fuera. La tubería más corta va
      a la cara cuyo plano deja P del lado de fuera y recibe el pie de la perpendicular dentro de la
      cara: entonces el tronco entero queda al otro lado de ese plano. Es ABFE, la de abajo a la
      izquierda de la planta. Los planos de BCGF y DAEH pasan más cerca de P, a 2,89 y 10,08 mm, pero
      sus pies caen fuera de las caras; los de CDHG, la base y la boca, también. El tubo vertical que
      sale de la boca queda más lejos, a 32,1 mm como poco.

      **El cambio de plano.** AB es una horizontal de la cara: con la línea nueva perpendicular a A₁B₁ y
      A de referencia, A₄ ≡ B₄ cae en la línea, y E₄ ≡ F₄ y P₄ a 38,5 mm, porque la boca y P están a la
      misma altura. A₄E₄ es la cara de canto, y la perpendicular desde P₄ da T₄, entre A₄ y E₄.

      **La vuelta.** T₁ está en la perpendicular a A₁B₁ por P₁, que es la planta de la tubería, donde la
      corta la perpendicular a la línea nueva por T₄; cae dentro de A₁B₁F₁E₁, junto a B₁F₁. T₂ está en
      su vertical, 25,5 mm por encima de la base. La tubería, de P a T, se ve entera en las dos vistas, y
      mide 28,47 mm.

  - id: sd67a-el-prisma-hexagonal-oblicuo
    titulo: El prisma hexagonal regular oblicuo, de eje sobre la horizontal e y una base en el plano de r
    fuente: Ejercicio 51 (SD67), apartado a · Colección de ejercicios de Geometría Descriptiva, Sistema Diédrico Directo · Dpto. de Expresión Gráfica y Proyectos de Ingeniería, EIG · UPV/EHU
    nivel: practica
    # Decisión: el apartado a) de la pág. 52 tal cual, con sus comillas; la
    # «Nota:» impresa va entera a `notas` (§04). El b) es el ejercicio
    # siguiente, sd67b, con su propia lámina: un paso construir no hereda lo
    # marcado en otro, y la sección necesita el prisma entero dibujado.
    enunciado: |
      a) Determinar las proyecciones de un prisma hexagonal regular, del que se conoce el vértice “M”. Se sabe que la otra base se encuentra situada en el plano determinado por la recta de máxima pendiente “r” y que el eje está sobre la horizontal “e”.

      **Notas nuestras.** La figura son la recta r, la recta e y el punto M, en alzado (arriba) y en
      planta (abajo), en una hoja A3 apaisada. La doble raya de r₁ dice que r es una recta de máxima
      pendiente: el plano que determina, al que llamamos π, tiene sus horizontales perpendiculares a r₁.
      e₂ es horizontal en el papel: e es una recta horizontal, a la cota de e₂. La hoja no da escala: se
      mide en el papel, en milímetros. Las dos bases de un prisma son paralelas, así que la base de M
      está en el plano paralelo a π por M; el centro de cada base es donde e corta su plano. El prisma
      es oblicuo: e no es perpendicular a π, y las aristas laterales, paralelas a e, son horizontales.
      Llamamos O al centro de la base de M y O′ al de la otra; N, P, Q, S y T a los demás vértices de la
      base de M, siguiendo a M (Q es el opuesto a M), y M′, N′, P′, Q′, S′ y T′ a los de la otra base; U
      al punto de r con la cota de e, e Y al punto de la planta que usa la vuelta de N y T. El croquis
      en perspectiva de arriba a la derecha es ilustración, y no se copia en la lámina. El apartado b),
      la sección, es el ejercicio siguiente.
    notas:
      - 'Nota: un prisma es regular si sus bases son polígonos regulares.'
    pide: Los centros O y O′ de las dos bases, los vértices de la base de M, por dos cambios de plano, y los de la otra base, en las dos vistas; el prisma pasado a limpio con lo visto y lo oculto; y, como pregunta nuestra, lo que miden sus aristas laterales.
    receta:
      lamina: sd67
      escena:
        M: 'punto3(alzado: figura.punto("M2"), planta: figura.punto("M1"))'
        Ri: 'punto3(alzado: figura.punto("Ri2"), planta: figura.punto("Ri1"))'
        Rd: 'punto3(alzado: figura.punto("Rd2"), planta: figura.punto("Rd1"))'
        r: recta3(Ri, Rd)
        Ei: 'punto3(alzado: figura.punto("Ei2"), planta: figura.punto("Ei1"))'
        Ed: 'punto3(alzado: figura.punto("Ed2"), planta: figura.punto("Ed1"))'
        e: recta3(Ei, Ed)
        pi: plano_por_lmp(r)
      solucion:
        # La base de M está en el plano paralelo a π por M, cuya recta de
        # máxima pendiente por M es la paralela a r: M más el vector de r, con
        # dos simetrías (no hay traslación en la receta). Su centro O es donde
        # corta e; el de la otra base, O′, donde e corta π.
        Mr: 'simetrico(simetrico(M, respecto: Ri), respecto: punto_medio(segmento3(Ri, Rd)))'
        rM: recta3(M, Mr)
        piM: plano_por_lmp(rM)
        O: corte_recta_plano(e, piM)
        Op: corte_recta_plano(e, pi)
        G: punto_medio(segmento3(O, Op))
        # La base de M: el hexágono regular de centro O y vértice M; los
        # demás, girando 60° cada vez alrededor de la normal que sube.
        base1: 'poligono_regular(piM, O, M, lados: 6)'
        N: uno(base1, 2)
        P: uno(base1, 3)
        Q: uno(base1, 4)
        S: uno(base1, 5)
        T: uno(base1, 6)
        # La otra base: la de M trasladada de O a O′ (dos simetrías, por O y
        # por el punto medio del eje). Cada arista lateral es paralela a e.
        Mp: 'simetrico(simetrico(M, respecto: O), respecto: G)'
        Np: 'simetrico(simetrico(N, respecto: O), respecto: G)'
        Pp: 'simetrico(simetrico(P, respecto: O), respecto: G)'
        Qp: 'simetrico(simetrico(Q, respecto: O), respecto: G)'
        Sp: 'simetrico(simetrico(S, respecto: O), respecto: G)'
        Tp: 'simetrico(simetrico(T, respecto: O), respecto: G)'
        arista_mm: en_mm(vm(M, Mp))
        R: vm(O, M)
        # U, el punto de r con la cota de e: la horizontal de π por U corta e
        # en O′.
        horE: 'plano(Ei, Ed, punto3(alzado: figura.punto("Ei2"), planta: desplaza(figura.punto("Ei1"), dy: 50)))'
        U: corte_recta_plano(r, horE)
        # Decisión: dos cambios de plano con las líneas nuevas de la lámina, y
        # O de referencia en los dos. El primero, vertical (sale de la planta y
        # lleva cotas), con la línea paralela a r₁: los planos de las bases se
        # ven de canto. El segundo, con la línea paralela al canto: la base de
        # M en verdadera magnitud. M₁O₁ es paralela a la primera línea, así que
        # M₅ cae, como O₅, en la segunda.
        O_4: 'cambio_plano_vertical(O, figura.segmento("nueva1"), ref: O)'
        M_4: 'cambio_plano_vertical(M, figura.segmento("nueva1"), ref: O)'
        N_4: 'cambio_plano_vertical(N, figura.segmento("nueva1"), ref: O)'
        O_5: 'cambio_plano_vertical(O, figura.segmento("nueva1"), ref: O, luego: figura.segmento("nueva2"))'
        M_5: 'cambio_plano_vertical(M, figura.segmento("nueva1"), ref: O, luego: figura.segmento("nueva2"))'
        N_5: 'cambio_plano_vertical(N, figura.segmento("nueva1"), ref: O, luego: figura.segmento("nueva2"))'
        T_5: 'cambio_plano_vertical(T, figura.segmento("nueva1"), ref: O, luego: figura.segmento("nueva2"))'
        # Lo que se traza en el papel.
        parM1: 'segmento2(figura.punto("M1"), proy_planta(O))'
        parM2: 'segmento2(figura.punto("M2"), proy_alzado(O))'
        Mh: 'cruce_aparente(segmento2(figura.punto("M2"), figura.punto("M1")), figura.segmento("e2"))'
        pM1: 'pie_perpendicular(figura.punto("M1"), figura.segmento("nueva1"))'
        vuelta: 'perpendicular(por: N_4, a: figura.segmento("nueva1"))'
        Yq: 'pie_perpendicular(N_5, figura.segmento("nueva2"))'
        Y1: cruce_aparente(vuelta, parM1)
        pN1: 'pie_perpendicular(N_4, figura.segmento("nueva1"))'
        Nh: 'cruce_aparente(segmento2(proy_alzado(N), proy_planta(N)), figura.segmento("e2"))'
        lNS1: segmento2(proy_planta(N), proy_planta(O))
        lTP1: segmento2(proy_planta(T), proy_planta(O))
        lNS2: segmento2(proy_alzado(N), proy_alzado(O))
        lTP2: segmento2(proy_alzado(T), proy_alzado(O))
        # Los errores. O′ en el cruce de r₁ con e₁ (r y e se cruzan sin
        # cortarse), o U bajado a e₁ en vez de a r₁; O en el pie de la
        # perpendicular desde M a e, como si el prisma fuera recto; N₁ y T₁
        # con la cota de N en vez de su distancia en la vista 5; N₂ por debajo
        # de e₂; la otra base trasladada con O₂O′₂, del alzado.
        Op1_re: 'cruce_aparente(figura.segmento("r1"), figura.segmento("e1"))'
        Op1_U: 'cruce_aparente(segmento2(proy_alzado(U), proy_planta(U)), figura.segmento("e1"))'
        O1_recto: proy_planta(pie_perpendicular(M, e))
        N1_cota: 'uno(medir_sobre(segmento2(Y1, proy_planta(N)), desde: Y1, distancia: diferencia_de_cotas(N, O)), 1)'
        T1_cota: 'uno(medir_sobre(segmento2(Y1, proy_planta(T)), desde: Y1, distancia: diferencia_de_cotas(T, O)), 1)'
        N2_bajo: 'desplaza(Nh, dy: diferencia_de_cotas(N, O))'
        Mp1_alz: 'uno(medir_sobre(segmento2(figura.punto("M1"), proy_planta(Mp)), desde: figura.punto("M1"), distancia: vm_alzado(O, Op)), 1)'
        Np1_alz: 'uno(medir_sobre(segmento2(proy_planta(N), proy_planta(Np)), desde: proy_planta(N), distancia: vm_alzado(O, Op)), 1)'
        Pp1_alz: 'uno(medir_sobre(segmento2(proy_planta(P), proy_planta(Pp)), desde: proy_planta(P), distancia: vm_alzado(O, Op)), 1)'
        Qp1_alz: 'uno(medir_sobre(segmento2(proy_planta(Q), proy_planta(Qp)), desde: proy_planta(Q), distancia: vm_alzado(O, Op)), 1)'
        Sp1_alz: 'uno(medir_sobre(segmento2(proy_planta(S), proy_planta(Sp)), desde: proy_planta(S), distancia: vm_alzado(O, Op)), 1)'
        Tp1_alz: 'uno(medir_sobre(segmento2(proy_planta(T), proy_planta(Tp)), desde: proy_planta(T), distancia: vm_alzado(O, Op)), 1)'
        # Los extremos de las rectas largas de la construcción.
        L_Q1: 'uno(medir_sobre(parM1, desde: proy_planta(Q), distancia: mm(4)), 1)'
        L_Q2: 'uno(medir_sobre(parM2, desde: proy_alzado(Q), distancia: mm(4)), 1)'
        L_U2: 'desplaza(proy_alzado(U), dx: mm(-4))'
        L_e2d: 'desplaza(figura.punto("Ed2"), dx: 66)'
        L_vU: 'desplaza(proy_planta(U), dy: mm(4))'
        L_hU: 'uno(medir_sobre(segmento2(proy_planta(U), proy_planta(Op)), desde: proy_planta(Op), distancia: mm(4)), 1)'
        L_vOp: 'desplaza(proy_alzado(Op), dy: mm(-4))'
        L_Mh: 'desplaza(Mh, dy: mm(3))'
        L_O4: 'uno(medir_sobre(segmento2(proy_planta(O), O_4), desde: O_4, distancia: mm(3)), 1)'
        L_M4: 'uno(medir_sobre(segmento2(figura.punto("M1"), M_4), desde: M_4, distancia: mm(4)), 1)'
        L_canto: 'uno(medir_sobre(segmento2(O_4, M_4), desde: M_4, distancia: mm(4)), 1)'
        L_O5: 'uno(medir_sobre(segmento2(O_4, O_5), desde: O_5, distancia: mm(3)), 1)'
        L_M5: 'uno(medir_sobre(segmento2(M_4, M_5), desde: M_5, distancia: mm(3)), 1)'
        L_N4: 'uno(medir_sobre(segmento2(N_5, N_4), desde: N_4, distancia: mm(4)), 1)'
        L_N1: 'uno(medir_sobre(segmento2(N_4, proy_planta(N)), desde: proy_planta(N), distancia: mm(4)), 1)'
        L_vN: 'desplaza(proy_alzado(N), dy: mm(-4))'
        L_vT: 'desplaza(proy_alzado(T), dy: mm(-4))'
        L_hN2: 'desplaza(proy_alzado(T), dx: mm(4))'
        L_S1: 'uno(medir_sobre(lNS1, desde: proy_planta(S), distancia: mm(4)), 1)'
        L_P1: 'uno(medir_sobre(lTP1, desde: proy_planta(P), distancia: mm(4)), 1)'
        L_S2: 'uno(medir_sobre(lNS2, desde: proy_alzado(S), distancia: mm(4)), 1)'
        L_P2: 'uno(medir_sobre(lTP2, desde: proy_alzado(P), distancia: mm(4)), 1)'
        L_vQ: 'desplaza(proy_alzado(Q), dy: mm(-4))'
        L_vP: 'desplaza(proy_alzado(P), dy: mm(-4))'
        L_vS: 'desplaza(proy_alzado(S), dy: mm(-4))'
        L_Mp1: 'uno(medir_sobre(segmento2(figura.punto("M1"), proy_planta(Mp)), desde: proy_planta(Mp), distancia: mm(4)), 1)'
        L_Np1: 'uno(medir_sobre(segmento2(proy_planta(N), proy_planta(Np)), desde: proy_planta(Np), distancia: mm(4)), 1)'
        L_Pp1: 'uno(medir_sobre(segmento2(proy_planta(P), proy_planta(Pp)), desde: proy_planta(Pp), distancia: mm(4)), 1)'
        L_Qp1: 'uno(medir_sobre(segmento2(proy_planta(Q), proy_planta(Qp)), desde: proy_planta(Qp), distancia: mm(4)), 1)'
        L_Sp1: 'uno(medir_sobre(segmento2(proy_planta(S), proy_planta(Sp)), desde: proy_planta(Sp), distancia: mm(4)), 1)'
        L_Tp1: 'uno(medir_sobre(segmento2(proy_planta(T), proy_planta(Tp)), desde: proy_planta(Tp), distancia: mm(4)), 1)'
        L_vMp: 'desplaza(proy_alzado(Mp), dy: mm(-4))'
        L_vNp: 'desplaza(proy_alzado(Np), dy: mm(-4))'
        L_vPp: 'desplaza(proy_alzado(Pp), dy: mm(-4))'
        L_vQp: 'desplaza(proy_alzado(Qp), dy: mm(-4))'
        L_vSp: 'desplaza(proy_alzado(Sp), dy: mm(-4))'
        L_vTp: 'desplaza(proy_alzado(Tp), dy: mm(-4))'
        L_hM2: 'desplaza(proy_alzado(Mp), dx: mm(-4))'
        L_hN2i: 'desplaza(proy_alzado(Np), dx: mm(-4))'
        L_hP2: 'desplaza(proy_alzado(Pp), dx: mm(-4))'
        L_hQ2: 'desplaza(proy_alzado(Qp), dx: mm(-4))'
      comprueba:
        - en_recta(O, rM)
        - en_plano(N, piM)
        - en_plano(Mp, pi)
        - en_plano(Sp, pi)
        - en_recta(U, r)
    pasos:
      - tipo: reconocer
        pregunta: ¿Dónde está O, el centro de la base que contiene a M?
        opciones:
          - texto: En el pie de la perpendicular desde M a e, porque el radio del hexágono es perpendicular al eje
            mensaje: |
              Eso sería en un prisma **recto**, con las bases perpendiculares al eje. Aquí no lo son: la otra
              base está en π, y e no es perpendicular a π (forma 21,0° con él). Ese pie cae 16,2 mm más allá
              de O, fuera de la base.
          - texto: En el punto medio de e, porque el eje del prisma está sobre e y su centro también
            mensaje: |
              e es solo la recta que lleva el eje; el segmento de e₂ y e₁ que dibuja la hoja no es el eje del
              prisma. El eje va de O a O′, los centros de las dos bases, y su punto medio es el que pide el
              apartado b).
          - texto: Donde e corta el plano paralelo a π por M, porque las dos bases de un prisma son siempre paralelas entre sí
            correcta: true
            mensaje: |
              Eso es. La otra base está en π, así que la de M está en el plano paralelo a π que pasa por M, y
              su centro es donde ese plano corta el eje. Aquí sale directo, porque M es el vértice más alto de
              su base: la paralela a r por M, la recta de máxima pendiente de ese plano, pasa por el centro y
              corta e en O, en las dos vistas. Con otro vértice, O saldría como O′, con la horizontal de ese
              plano que tiene la cota de e.

      # Decisión: un solo paso construir para todo el apartado a): los centros,
      # la base de M por dos cambios de plano, su vuelta, la otra base y la
      # visibilidad. Las líneas nuevas y la referencia las fija el intro.
      - tipo: construir
        titulo: Los centros, las dos bases y lo que se ve
        intro: |
          Primero los centros. La base de M está en el plano paralelo a π por M, y su recta de máxima
          pendiente por M es la paralela a r: traza la paralela a r₂ por M₂ y la paralela a r₁ por M₁. En
          esta hoja las dos cortan e en la misma vertical, así que esa recta corta e de verdad, en O, el
          centro de la base de M: M es el vértice más alto de su base, y está en la recta de máxima
          pendiente que pasa por el centro. Si no lo estuviera, O saldría como O′, con la horizontal del
          plano que tiene la cota de e. La otra base está en π: su centro,
          O′, es donde e corta π, con la horizontal de π que tiene la cota de e. Después, la base de M en
          verdadera magnitud, con dos cambios de plano. El enunciado no da las líneas nuevas ni la
          referencia: las fijamos nosotros, ya dibujadas de trazo y punto a la derecha de la planta, con O
          de referencia en los dos cambios. La primera es paralela a r₁: con un cambio vertical, que lleva
          cotas, los planos de las bases se ven de canto en la vista 4. La segunda es paralela a ese canto:
          en la vista 5, la base está en verdadera magnitud, con O₅ y M₅ en la línea. Llamamos N al vértice
          contiguo a M que en la vista 5 queda al otro lado de la segunda línea, y T al que queda entre la
          línea y el canto; P, Q y S son los opuestos de T, M y N. N y T vuelven a las vistas; P, Q y S
          salen por simetría respecto de O. La otra base es la de M trasladada de O a O′: en la planta, por
          paralelas a e₁ y con la abertura O₁O′₁; en el alzado, a la misma altura. Marca O y O′ en las dos
          vistas, N₅, T₅ y los once vértices nuevos en las dos vistas, y pasa el prisma a limpio con «arista
          vista» y «arista oculta». En el alzado, SS′ y TT′ van ocultas, pero caen en la misma recta que PP′ y
          NN′, que se ven: a trazos solo va el trozo que asoma, de S₂ a P₂ y de T₂ a N₂. Las verticales de N y
          de Q casi coinciden, y también las de M y de S. O₁ y O₂ caen a 4 mm de las rayas de referencia del
          extremo de e, y P′₁ y P′₂ a 2,5 mm de la vertical de U: amplía con la lupa (×4) antes de marcarlos.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, visto, oculto, borrar]
        tolerancia: 1
        objetivos:
          - nombre: O1
            pide: O, el centro de la base de M, en la planta
            es: proy_planta(O)
            bien: |
              O₁ está en e₁, donde la corta la paralela a r₁ por M₁: la recta de máxima pendiente del plano
              de la base de M, que es paralelo a π.
            diagnosticos:
              - si: cerca_de(solucion.O1_recto)
                mensaje: |
                  Ese es el pie de la perpendicular desde M a e: el centro si el prisma fuera **recto**. No lo es:
                  la base de M es paralela a π, y su centro es donde e corta ese plano.
                ejemplo: solucion.O1_recto
              - si: cerca_de(proy_planta(Op))
                mensaje: |
                  Ese es O′, el centro de la **otra** base, la que está en π. La de M está en el plano paralelo a
                  π por M.
                ejemplo: proy_planta(Op)
              - si: '!en_recta(figura.segmento("e1"))'
                mensaje: |
                  El eje está sobre e: O₁ va **en e₁**, donde la corta la paralela a r₁ por M₁.
                ejemplo: 'uno(medir_sobre(solucion.parM1, desde: proy_planta(O), distancia: mm(6)), 1)'
              - si: siempre
                mensaje: |
                  Estás en e₁, pero no en el centro de la base de M: traza por M₁ la paralela a r₁ y córtala con
                  e₁.
          - nombre: O2
            pide: O, en el alzado
            es: proy_alzado(O)
            bien: |
              O₂ está en e₂, donde la corta la paralela a r₂ por M₂, y en la vertical de O₁: la paralela a r
              por M corta e de verdad, no solo en el papel.
            diagnosticos:
              - si: '!en_vertical_de(O1)'
                mensaje: |
                  O₂ va en la **vertical de O₁**, sobre e₂. La paralela a r₂ por M₂ la corta ahí mismo.
                ejemplo: 'desplaza(proy_alzado(O), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la vertical de O₁, pero no en e₂: O está en el eje, y e₂ es su alzado.
          - nombre: Op1
            rotulo: O′₁
            pide: O′, el centro de la otra base, en la planta
            es: proy_planta(Op)
            bien: |
              O′₁ está en e₁, donde la corta la horizontal de π por U₁, perpendicular a r₁: U es el punto de r
              con la cota de e, y esa horizontal tiene la misma cota que e.
            diagnosticos:
              - si: cerca_de(solucion.Op1_re)
                mensaje: |
                  Ese es el cruce de r₁ y e₁ en la planta. r y e no se cortan: se cruzan, a distinta cota. e corta
                  π en el punto de π que tiene su cota, sobre la horizontal de π por U.
                ejemplo: solucion.Op1_re
              - si: cerca_de(solucion.Op1_U)
                mensaje: |
                  Has bajado U₂ hasta e₁. U es un punto de r: su planta va en **r₁**, y desde U₁ sale la
                  horizontal de π, perpendicular a r₁, hasta e₁.
                ejemplo: solucion.Op1_U
              - si: '!en_recta(figura.segmento("e1"))'
                mensaje: |
                  O′ está en el eje: O′₁ va **en e₁**.
                ejemplo: 'desplaza(proy_planta(Op), dy: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en e₁, pero no donde la corta π. Por U₁, en r₁, la perpendicular a r₁ es la horizontal de π
                  con la cota de e: donde corta e₁ está O′₁.
          - nombre: Op2
            rotulo: O′₂
            pide: O′, en el alzado
            es: proy_alzado(Op)
            bien: |
              O′₂ está en e₂, en la vertical de O′₁.
            diagnosticos:
              - si: '!en_vertical_de(Op1)'
                mensaje: |
                  O′₂ va en la **vertical de O′₁**.
                ejemplo: 'desplaza(proy_alzado(Op), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la vertical de O′₁, pero no en e₂: O′ está en el eje.
          - nombre: N5
            pide: el vértice N, en la vista 5
            es: solucion.N_5
            bien: |
              N₅ está a O₅M₅ de O₅ y de M₅, al otro lado de la segunda línea nueva: en la vista 5 la base es un
              hexágono regular de radio O₅M₅, y el lado mide lo mismo que el radio.
            diagnosticos:
              - si: cerca_de(solucion.T_5)
                mensaje: |
                  Ese es T₅, el que queda entre la segunda línea nueva y el canto. N es el otro vértice contiguo a
                  M, al otro lado de la línea.
                ejemplo: solucion.T_5
              - si: '!a_distancia(de: solucion.O_5, d: solucion.R)'
                mensaje: |
                  Los vértices están en la **circunferencia de centro O₅ y radio O₅M₅**: el arco con ese radio,
                  pinchado en O₅.
                ejemplo: 'desplaza(solucion.N_5, dx: mm(5))'
              - si: siempre
                mensaje: |
                  Estás en la circunferencia, pero no a 60° de M₅: con el mismo radio, pinchado en M₅, el arco la
                  corta en N₅ y en T₅.
          - nombre: T5
            pide: el vértice T, en la vista 5
            es: solucion.T_5
            bien: |
              T₅ es el otro corte de los dos arcos, entre la segunda línea nueva y el canto.
            diagnosticos:
              - si: '!a_distancia(de: solucion.O_5, d: solucion.R)'
                mensaje: |
                  T₅ está en la **circunferencia de centro O₅ y radio O₅M₅**, como N₅.
                ejemplo: 'desplaza(solucion.T_5, dy: mm(5))'
              - si: siempre
                mensaje: |
                  Estás en la circunferencia, pero no a 60° de M₅: es el otro corte del arco pinchado en M₅.
          - nombre: N1
            pide: el vértice N, de vuelta en la planta
            es: proy_planta(N)
            bien: |
              N₁ está en la perpendicular a la primera línea nueva que sale de N₄, a lo que N₅ dista de la
              segunda línea, contado desde Y₁ y alejándose de la línea: 21,7 mm.
            diagnosticos:
              - si: cerca_de(proy_planta(T))
                mensaje: |
                  Ese es T₁: N₅ quedaba al otro lado de la segunda línea, así que N₁ queda **más lejos** de la
                  primera línea nueva que Y₁, no más cerca.
                ejemplo: proy_planta(T)
              - si: cerca_de(solucion.N1_cota)
                mensaje: |
                  Has llevado lo que N₄ dista de la primera línea nueva, que es la **cota** de N sobre O. Para
                  volver a la planta se lleva lo que N₅ dista de la segunda línea, desde Y₁.
                ejemplo: solucion.N1_cota
              - si: '!en_recta(solucion.vuelta)'
                mensaje: |
                  De vuelta, N₁ está en la **perpendicular a la primera línea nueva que sale de N₄**.
                ejemplo: 'desplaza(proy_planta(N), dx: mm(5))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular buena, pero no a la distancia buena: lo que N₅ dista de la segunda
                  línea nueva, desde Y₁, donde la perpendicular corta la paralela a r₁ por M₁.
          - nombre: T1
            pide: el vértice T, de vuelta en la planta
            es: proy_planta(T)
            bien: |
              T₁ está en la misma perpendicular que N₁, a la misma distancia de Y₁, del lado de la primera
              línea nueva: N y T tienen la misma cota, y NT es una horizontal de la base.
            diagnosticos:
              - si: cerca_de(solucion.T1_cota)
                mensaje: |
                  Has llevado la **cota** de T, lo que N₄ dista de la primera línea nueva. Se lleva lo que T₅
                  dista de la segunda, desde Y₁ y hacia la primera línea.
                ejemplo: solucion.T1_cota
              - si: '!en_recta(solucion.vuelta)'
                mensaje: |
                  T₄ coincide con N₄: T₁ está en la **misma perpendicular** a la primera línea nueva que N₁.
                ejemplo: 'desplaza(proy_planta(T), dx: mm(5))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular buena, pero no a la distancia buena: la misma que N₁, al otro lado
                  de Y₁.
          - nombre: N2
            pide: el vértice N, en el alzado
            es: proy_alzado(N)
            bien: |
              N₂ está en la vertical de N₁, por encima de e₂ lo que N₄ dista de la primera línea nueva: 6,1 mm,
              la mitad de lo que M está por encima de O.
            diagnosticos:
              - si: cerca_de(solucion.N2_bajo)
                mensaje: |
                  La distancia es la buena, pero por debajo de e₂. N₄ queda más allá de la primera línea nueva
                  que O₄, la referencia: N es más alto que O, y N₂ queda por encima de e₂.
                ejemplo: solucion.N2_bajo
              - si: '!en_vertical_de(N1)'
                mensaje: |
                  N₂ va en la **vertical de N₁**.
                ejemplo: 'desplaza(proy_alzado(N), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la vertical de N₁, pero no a la altura buena: lo que N₄ dista de la primera línea nueva,
                  por encima de e₂.
          - nombre: T2
            pide: el vértice T, en el alzado
            es: proy_alzado(T)
            bien: |
              T₂ está en la vertical de T₁, a la altura de N₂: N y T tienen la misma cota.
            diagnosticos:
              - si: '!en_vertical_de(T1)'
                mensaje: |
                  T₂ va en la **vertical de T₁**.
                ejemplo: 'desplaza(proy_alzado(T), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la vertical de T₁, pero no a la altura buena: N₄ y T₄ coinciden, así que N y T tienen la
                  misma cota, y T₂ está en la horizontal de N₂.
          - nombre: Q1
            pide: el vértice Q, el opuesto a M, en la planta
            es: proy_planta(Q)
            bien: |
              Q₁ está en la prolongación de M₁O₁, a O₁M₁ de O₁: O es el centro del hexágono, y la planta
              conserva los puntos medios.
            diagnosticos:
              - si: '!en_recta(solucion.parM1)'
                mensaje: |
                  Q es el opuesto a M: Q₁ va en la **prolongación de M₁O₁**, al otro lado de O₁.
                ejemplo: 'desplaza(proy_planta(Q), dx: mm(5))'
              - si: siempre
                mensaje: |
                  Estás en la prolongación de M₁O₁, pero no a la distancia buena: con centro en O₁ y radio O₁M₁.
          - nombre: S1
            pide: el vértice S, el opuesto a N, en la planta
            es: proy_planta(S)
            bien: |
              S₁ está en la prolongación de N₁O₁, a O₁N₁ de O₁. Cae casi en la vertical de M₁.
            diagnosticos:
              - si: cerca_de(proy_planta(P))
                mensaje: |
                  Ese es P, el opuesto a **T**. S es el opuesto a N: en la prolongación de N₁O₁.
                ejemplo: proy_planta(P)
              - si: '!en_recta(solucion.lNS1)'
                mensaje: |
                  S es el opuesto a N: S₁ va en la **prolongación de N₁O₁**.
                ejemplo: 'desplaza(proy_planta(S), dx: mm(-5))'
              - si: siempre
                mensaje: |
                  Estás en la prolongación de N₁O₁, pero no a la distancia buena: con centro en O₁ y radio O₁N₁.
          - nombre: P1
            pide: el vértice P, el opuesto a T, en la planta
            es: proy_planta(P)
            bien: |
              P₁ está en la prolongación de T₁O₁, a O₁T₁ de O₁.
            diagnosticos:
              - si: '!en_recta(solucion.lTP1)'
                mensaje: |
                  P es el opuesto a T: P₁ va en la **prolongación de T₁O₁**.
                ejemplo: 'desplaza(proy_planta(P), dy: mm(5))'
              - si: siempre
                mensaje: |
                  Estás en la prolongación de T₁O₁, pero no a la distancia buena: con centro en O₁ y radio O₁T₁.
          - nombre: Q2
            pide: el vértice Q, en el alzado
            es: proy_alzado(Q)
            bien: |
              Q₂ está en la vertical de Q₁, en la prolongación de M₂O₂: también en el alzado O₂ es el punto
              medio de M₂Q₂.
            diagnosticos:
              - si: '!en_vertical_de(Q1)'
                mensaje: |
                  Q₂ va en la **vertical de Q₁**.
                ejemplo: 'uno(medir_sobre(solucion.parM2, desde: proy_alzado(Q), distancia: mm(5)), 1)'
              - si: siempre
                mensaje: |
                  Estás en la vertical de Q₁, pero no en la prolongación de M₂O₂.
          - nombre: P2
            pide: el vértice P, en el alzado
            es: proy_alzado(P)
            bien: |
              P₂ está en la vertical de P₁, en la prolongación de T₂O₂.
            diagnosticos:
              - si: '!en_vertical_de(P1)'
                mensaje: |
                  P₂ va en la **vertical de P₁**.
                ejemplo: 'uno(medir_sobre(solucion.lTP2, desde: proy_alzado(P), distancia: mm(5)), 1)'
              - si: siempre
                mensaje: |
                  Estás en la vertical de P₁, pero no en la prolongación de T₂O₂.
          - nombre: S2
            pide: el vértice S, en el alzado
            es: proy_alzado(S)
            bien: |
              S₂ está en la vertical de S₁, en la prolongación de N₂O₂, a la altura de P₂.
            diagnosticos:
              - si: '!en_vertical_de(S1)'
                mensaje: |
                  S₂ va en la **vertical de S₁**.
                ejemplo: 'uno(medir_sobre(solucion.lNS2, desde: proy_alzado(S), distancia: mm(5)), 1)'
              - si: siempre
                mensaje: |
                  Estás en la vertical de S₁, pero no en la prolongación de N₂O₂.
          - nombre: Mp1
            rotulo: M′₁
            pide: el vértice M′ de la otra base, en la planta
            es: proy_planta(Mp)
            bien: |
              M′₁ está en la paralela a e₁ por M₁, a O₁O′₁ de M₁: la arista lateral MM′ es paralela al eje
              e, y como es horizontal está en verdadera magnitud en la planta.
            diagnosticos:
              - si: cerca_de(solucion.Mp1_alz)
                mensaje: |
                  Has llevado O₂O′₂, del **alzado**. e es horizontal, y está en verdadera magnitud en la planta:
                  la abertura es O₁O′₁.
                ejemplo: solucion.Mp1_alz
              - si: '!en_recta(segmento2(figura.punto("M1"), proy_planta(Mp)))'
                mensaje: |
                  La arista lateral es paralela al eje: M′₁ va en la **paralela a e₁ por M₁**.
                ejemplo: 'desplaza(proy_planta(Mp), dy: mm(5))'
              - si: siempre
                mensaje: |
                  Estás en la paralela a e₁ por M₁, pero no a la distancia buena: con centro en M₁ y radio O₁O′₁,
                  hacia la izquierda.
          - nombre: Np1
            rotulo: N′₁
            pide: el vértice N′ de la otra base, en la planta
            es: proy_planta(Np)
            bien: |
              N′₁ está en la paralela a e₁ por N₁, a O₁O′₁ de N₁: la arista lateral NN′ es paralela al eje
              e, y como es horizontal está en verdadera magnitud en la planta.
            diagnosticos:
              - si: cerca_de(solucion.Np1_alz)
                mensaje: |
                  Has llevado O₂O′₂, del **alzado**. e es horizontal, y está en verdadera magnitud en la planta:
                  la abertura es O₁O′₁.
                ejemplo: solucion.Np1_alz
              - si: '!en_recta(segmento2(proy_planta(N), proy_planta(Np)))'
                mensaje: |
                  La arista lateral es paralela al eje: N′₁ va en la **paralela a e₁ por N₁**.
                ejemplo: 'desplaza(proy_planta(Np), dy: mm(5))'
              - si: siempre
                mensaje: |
                  Estás en la paralela a e₁ por N₁, pero no a la distancia buena: con centro en N₁ y radio O₁O′₁,
                  hacia la izquierda.
          - nombre: Pp1
            rotulo: P′₁
            pide: el vértice P′ de la otra base, en la planta
            es: proy_planta(Pp)
            bien: |
              P′₁ está en la paralela a e₁ por P₁, a O₁O′₁ de P₁: la arista lateral PP′ es paralela al eje
              e, y como es horizontal está en verdadera magnitud en la planta.
            diagnosticos:
              - si: cerca_de(solucion.Pp1_alz)
                mensaje: |
                  Has llevado O₂O′₂, del **alzado**. e es horizontal, y está en verdadera magnitud en la planta:
                  la abertura es O₁O′₁.
                ejemplo: solucion.Pp1_alz
              - si: '!en_recta(segmento2(proy_planta(P), proy_planta(Pp)))'
                mensaje: |
                  La arista lateral es paralela al eje: P′₁ va en la **paralela a e₁ por P₁**.
                ejemplo: 'desplaza(proy_planta(Pp), dy: mm(5))'
              - si: siempre
                mensaje: |
                  Estás en la paralela a e₁ por P₁, pero no a la distancia buena: con centro en P₁ y radio O₁O′₁,
                  hacia la izquierda.
          - nombre: Qp1
            rotulo: Q′₁
            pide: el vértice Q′ de la otra base, en la planta
            es: proy_planta(Qp)
            bien: |
              Q′₁ está en la paralela a e₁ por Q₁, a O₁O′₁ de Q₁: la arista lateral QQ′ es paralela al eje
              e, y como es horizontal está en verdadera magnitud en la planta.
            diagnosticos:
              - si: cerca_de(solucion.Qp1_alz)
                mensaje: |
                  Has llevado O₂O′₂, del **alzado**. e es horizontal, y está en verdadera magnitud en la planta:
                  la abertura es O₁O′₁.
                ejemplo: solucion.Qp1_alz
              - si: '!en_recta(segmento2(proy_planta(Q), proy_planta(Qp)))'
                mensaje: |
                  La arista lateral es paralela al eje: Q′₁ va en la **paralela a e₁ por Q₁**.
                ejemplo: 'desplaza(proy_planta(Qp), dy: mm(5))'
              - si: siempre
                mensaje: |
                  Estás en la paralela a e₁ por Q₁, pero no a la distancia buena: con centro en Q₁ y radio O₁O′₁,
                  hacia la izquierda.
          - nombre: Sp1
            rotulo: S′₁
            pide: el vértice S′ de la otra base, en la planta
            es: proy_planta(Sp)
            bien: |
              S′₁ está en la paralela a e₁ por S₁, a O₁O′₁ de S₁: la arista lateral SS′ es paralela al eje
              e, y como es horizontal está en verdadera magnitud en la planta.
            diagnosticos:
              - si: cerca_de(solucion.Sp1_alz)
                mensaje: |
                  Has llevado O₂O′₂, del **alzado**. e es horizontal, y está en verdadera magnitud en la planta:
                  la abertura es O₁O′₁.
                ejemplo: solucion.Sp1_alz
              - si: '!en_recta(segmento2(proy_planta(S), proy_planta(Sp)))'
                mensaje: |
                  La arista lateral es paralela al eje: S′₁ va en la **paralela a e₁ por S₁**.
                ejemplo: 'desplaza(proy_planta(Sp), dy: mm(5))'
              - si: siempre
                mensaje: |
                  Estás en la paralela a e₁ por S₁, pero no a la distancia buena: con centro en S₁ y radio O₁O′₁,
                  hacia la izquierda.
          - nombre: Tp1
            rotulo: T′₁
            pide: el vértice T′ de la otra base, en la planta
            es: proy_planta(Tp)
            bien: |
              T′₁ está en la paralela a e₁ por T₁, a O₁O′₁ de T₁: la arista lateral TT′ es paralela al eje
              e, y como es horizontal está en verdadera magnitud en la planta.
            diagnosticos:
              - si: cerca_de(solucion.Tp1_alz)
                mensaje: |
                  Has llevado O₂O′₂, del **alzado**. e es horizontal, y está en verdadera magnitud en la planta:
                  la abertura es O₁O′₁.
                ejemplo: solucion.Tp1_alz
              - si: '!en_recta(segmento2(proy_planta(T), proy_planta(Tp)))'
                mensaje: |
                  La arista lateral es paralela al eje: T′₁ va en la **paralela a e₁ por T₁**.
                ejemplo: 'desplaza(proy_planta(Tp), dy: mm(5))'
              - si: siempre
                mensaje: |
                  Estás en la paralela a e₁ por T₁, pero no a la distancia buena: con centro en T₁ y radio O₁O′₁,
                  hacia la izquierda.
          - nombre: Mp2
            rotulo: M′₂
            pide: el vértice M′ de la otra base, en el alzado
            es: proy_alzado(Mp)
            bien: |
              M′₂ está en la vertical de M′₁, a la altura de M₂: la arista MM′ es horizontal.
            diagnosticos:
              - si: '!en_vertical_de(Mp1)'
                mensaje: |
                  M′₂ va en la **vertical de M′₁**.
                ejemplo: 'desplaza(proy_alzado(Mp), dx: mm(5))'
              - si: '!en_horizontal_de(figura.punto("M2"))'
                mensaje: |
                  La arista lateral MM′ es paralela a e, que es horizontal: M′₂ va **a la altura de M₂**.
                ejemplo: 'desplaza(proy_alzado(Mp), dy: mm(5))'
              - si: siempre
                mensaje: |
                  M′₂ está donde la vertical de M′₁ corta la horizontal de M₂.
          - nombre: Np2
            rotulo: N′₂
            pide: el vértice N′ de la otra base, en el alzado
            es: proy_alzado(Np)
            bien: |
              N′₂ está en la vertical de N′₁, a la altura de N₂: la arista NN′ es horizontal.
            diagnosticos:
              - si: '!en_vertical_de(Np1)'
                mensaje: |
                  N′₂ va en la **vertical de N′₁**.
                ejemplo: 'desplaza(proy_alzado(Np), dx: mm(5))'
              - si: '!en_horizontal_de(N2)'
                mensaje: |
                  La arista lateral NN′ es paralela a e, que es horizontal: N′₂ va **a la altura de N₂**.
                ejemplo: 'desplaza(proy_alzado(Np), dy: mm(5))'
              - si: siempre
                mensaje: |
                  N′₂ está donde la vertical de N′₁ corta la horizontal de N₂.
          - nombre: Pp2
            rotulo: P′₂
            pide: el vértice P′ de la otra base, en el alzado
            es: proy_alzado(Pp)
            bien: |
              P′₂ está en la vertical de P′₁, a la altura de P₂: la arista PP′ es horizontal.
            diagnosticos:
              - si: '!en_vertical_de(Pp1)'
                mensaje: |
                  P′₂ va en la **vertical de P′₁**.
                ejemplo: 'desplaza(proy_alzado(Pp), dx: mm(5))'
              - si: '!en_horizontal_de(P2)'
                mensaje: |
                  La arista lateral PP′ es paralela a e, que es horizontal: P′₂ va **a la altura de P₂**.
                ejemplo: 'desplaza(proy_alzado(Pp), dy: mm(5))'
              - si: siempre
                mensaje: |
                  P′₂ está donde la vertical de P′₁ corta la horizontal de P₂.
          - nombre: Qp2
            rotulo: Q′₂
            pide: el vértice Q′ de la otra base, en el alzado
            es: proy_alzado(Qp)
            bien: |
              Q′₂ está en la vertical de Q′₁, a la altura de Q₂: la arista QQ′ es horizontal.
            diagnosticos:
              - si: '!en_vertical_de(Qp1)'
                mensaje: |
                  Q′₂ va en la **vertical de Q′₁**.
                ejemplo: 'desplaza(proy_alzado(Qp), dx: mm(5))'
              - si: '!en_horizontal_de(Q2)'
                mensaje: |
                  La arista lateral QQ′ es paralela a e, que es horizontal: Q′₂ va **a la altura de Q₂**.
                ejemplo: 'desplaza(proy_alzado(Qp), dy: mm(5))'
              - si: siempre
                mensaje: |
                  Q′₂ está donde la vertical de Q′₁ corta la horizontal de Q₂.
          - nombre: Sp2
            rotulo: S′₂
            pide: el vértice S′ de la otra base, en el alzado
            es: proy_alzado(Sp)
            bien: |
              S′₂ está en la vertical de S′₁, a la altura de S₂: la arista SS′ es horizontal.
            diagnosticos:
              - si: '!en_vertical_de(Sp1)'
                mensaje: |
                  S′₂ va en la **vertical de S′₁**.
                ejemplo: 'desplaza(proy_alzado(Sp), dx: mm(5))'
              - si: '!en_horizontal_de(S2)'
                mensaje: |
                  La arista lateral SS′ es paralela a e, que es horizontal: S′₂ va **a la altura de S₂**.
                ejemplo: 'desplaza(proy_alzado(Sp), dy: mm(5))'
              - si: siempre
                mensaje: |
                  S′₂ está donde la vertical de S′₁ corta la horizontal de S₂.
          - nombre: Tp2
            rotulo: T′₂
            pide: el vértice T′ de la otra base, en el alzado
            es: proy_alzado(Tp)
            bien: |
              T′₂ está en la vertical de T′₁, a la altura de T₂: la arista TT′ es horizontal.
            diagnosticos:
              - si: '!en_vertical_de(Tp1)'
                mensaje: |
                  T′₂ va en la **vertical de T′₁**.
                ejemplo: 'desplaza(proy_alzado(Tp), dx: mm(5))'
              - si: '!en_horizontal_de(T2)'
                mensaje: |
                  La arista lateral TT′ es paralela a e, que es horizontal: T′₂ va **a la altura de T₂**.
                ejemplo: 'desplaza(proy_alzado(Tp), dy: mm(5))'
              - si: siempre
                mensaje: |
                  T′₂ está donde la vertical de T′₁ corta la horizontal de T₂.
        # Decisión: las bases y las caras son opacas, la planta se mira desde
        # arriba y el alzado desde delante, como en el resto del sitio. La
        # visibilidad sale de un cálculo de líneas ocultas aparte, por rayos
        # contra las ocho caras: ninguna arista cambia a medio camino.
        tramos:
          - traza: segmento2(figura.punto("M1"), proy_planta(N))
            tipo: visto
            porque: 'MN es arista de la cara MNN′M′, que mira hacia arriba, y contorno de la planta: desde arriba nada la tapa.'
          - traza: segmento2(proy_planta(N), proy_planta(P))
            tipo: oculto
            porque: 'NP separa la base MNPQST de la cara NPP′N′, que miran las dos hacia abajo: desde arriba la tapan las caras MNN′M′ y TMM′T′.'
          - traza: segmento2(proy_planta(P), proy_planta(Q))
            tipo: oculto
            porque: 'PQ separa la base MNPQST de la cara PQQ′P′, que miran las dos hacia abajo: desde arriba la tapan las caras STT′S′ y TMM′T′.'
          - traza: segmento2(proy_planta(Q), proy_planta(S))
            tipo: oculto
            porque: 'QS separa la base MNPQST de la cara QSS′Q′, que miran las dos hacia abajo: desde arriba la tapa la cara STT′S′.'
          - traza: segmento2(proy_planta(S), proy_planta(T))
            tipo: visto
            porque: 'ST es arista de la cara STT′S′, que mira hacia arriba, y contorno de la planta: desde arriba nada la tapa.'
          - traza: segmento2(proy_planta(T), figura.punto("M1"))
            tipo: visto
            porque: 'TM es arista de la cara TMM′T′, que mira hacia arriba, y contorno de la planta: desde arriba nada la tapa.'
          - traza: segmento2(proy_planta(Mp), proy_planta(Np))
            tipo: visto
            porque: 'M′N′ es un lado de la base M′N′P′Q′S′T′, que mira hacia arriba: desde arriba nada lo tapa.'
          - traza: segmento2(proy_planta(Np), proy_planta(Pp))
            tipo: visto
            porque: 'N′P′ es un lado de la base M′N′P′Q′S′T′, que mira hacia arriba: desde arriba nada lo tapa.'
          - traza: segmento2(proy_planta(Pp), proy_planta(Qp))
            tipo: visto
            porque: 'P′Q′ es un lado de la base M′N′P′Q′S′T′, que mira hacia arriba: desde arriba nada lo tapa.'
          - traza: segmento2(proy_planta(Qp), proy_planta(Sp))
            tipo: visto
            porque: 'Q′S′ es un lado de la base M′N′P′Q′S′T′, que mira hacia arriba: desde arriba nada lo tapa.'
          - traza: segmento2(proy_planta(Sp), proy_planta(Tp))
            tipo: visto
            porque: 'S′T′ es un lado de la base M′N′P′Q′S′T′, que mira hacia arriba: desde arriba nada lo tapa.'
          - traza: segmento2(proy_planta(Tp), proy_planta(Mp))
            tipo: visto
            porque: 'T′M′ es un lado de la base M′N′P′Q′S′T′, que mira hacia arriba: desde arriba nada lo tapa.'
          - traza: segmento2(figura.punto("M1"), proy_planta(Mp))
            tipo: visto
            porque: 'MM′ separa las caras MNN′M′ y TMM′T′, que miran las dos hacia arriba: desde arriba nada la tapa.'
          - traza: segmento2(proy_planta(N), proy_planta(Np))
            tipo: visto
            porque: 'NN′ es contorno de la planta: separa la cara MNN′M′, que mira hacia arriba, de la NPP′N′, que mira hacia abajo. Desde arriba nada la tapa.'
          - traza: segmento2(proy_planta(P), proy_planta(Pp))
            tipo: oculto
            porque: 'PP′ separa las caras NPP′N′ y PQQ′P′, que miran las dos hacia abajo: desde arriba la tapan la base M′N′P′Q′S′T′ y la cara TMM′T′.'
          - traza: segmento2(proy_planta(Q), proy_planta(Qp))
            tipo: oculto
            porque: 'QQ′ separa las caras PQQ′P′ y QSS′Q′, que miran las dos hacia abajo: desde arriba la tapan la base M′N′P′Q′S′T′ y la cara STT′S′.'
          - traza: segmento2(proy_planta(S), proy_planta(Sp))
            tipo: visto
            porque: 'SS′ es contorno de la planta: separa la cara QSS′Q′, que mira hacia abajo, de la STT′S′, que mira hacia arriba. Desde arriba nada la tapa.'
          - traza: segmento2(proy_planta(T), proy_planta(Tp))
            tipo: visto
            porque: 'TT′ separa las caras STT′S′ y TMM′T′, que miran las dos hacia arriba: desde arriba nada la tapa.'
          - traza: segmento2(figura.punto("M2"), proy_alzado(N))
            tipo: visto
            porque: 'MN es un lado de la base MNPQST, que mira hacia delante: nada lo tapa.'
          - traza: segmento2(proy_alzado(N), proy_alzado(P))
            tipo: visto
            porque: 'NP es un lado de la base MNPQST, que mira hacia delante: nada lo tapa.'
          - traza: segmento2(proy_alzado(P), proy_alzado(Q))
            tipo: visto
            porque: 'PQ es un lado de la base MNPQST, que mira hacia delante: nada lo tapa.'
          - traza: segmento2(proy_alzado(Q), proy_alzado(S))
            tipo: visto
            porque: 'QS es un lado de la base MNPQST, que mira hacia delante: nada lo tapa.'
          - traza: segmento2(proy_alzado(S), proy_alzado(T))
            tipo: visto
            porque: 'ST es un lado de la base MNPQST, que mira hacia delante: nada lo tapa.'
          - traza: segmento2(proy_alzado(T), figura.punto("M2"))
            tipo: visto
            porque: 'TM es un lado de la base MNPQST, que mira hacia delante: nada lo tapa.'
          - traza: segmento2(proy_alzado(Mp), proy_alzado(Np))
            tipo: visto
            porque: 'M′N′ es arista de la cara MNN′M′, que mira hacia delante, y contorno del alzado: nada la tapa.'
          - traza: segmento2(proy_alzado(Np), proy_alzado(Pp))
            tipo: visto
            porque: 'N′P′ es arista de la cara NPP′N′, que mira hacia delante: nada la tapa.'
          - traza: segmento2(proy_alzado(Pp), proy_alzado(Qp))
            tipo: visto
            porque: 'P′Q′ es arista de la cara PQQ′P′, que mira hacia delante, y contorno del alzado: nada la tapa.'
          - traza: segmento2(proy_alzado(Qp), proy_alzado(Sp))
            tipo: oculto
            porque: 'Q′S′ separa la base M′N′P′Q′S′T′ de la cara QSS′Q′, que miran las dos hacia atrás: por delante la tapa la cara PQQ′P′.'
          - traza: segmento2(proy_alzado(Sp), proy_alzado(Tp))
            tipo: oculto
            porque: 'S′T′ separa la base M′N′P′Q′S′T′ de la cara STT′S′, que miran las dos hacia atrás: por delante la tapa la cara NPP′N′.'
          - traza: segmento2(proy_alzado(Tp), proy_alzado(Mp))
            tipo: oculto
            porque: 'T′M′ separa la base M′N′P′Q′S′T′ de la cara TMM′T′, que miran las dos hacia atrás: por delante la tapa la cara MNN′M′.'
          - traza: segmento2(figura.punto("M2"), proy_alzado(Mp))
            tipo: visto
            porque: 'MM′ es contorno del alzado, la arista de arriba: separa la cara MNN′M′, que mira hacia delante, de la TMM′T′, que mira hacia atrás.'
          - traza: segmento2(proy_alzado(N), proy_alzado(Np))
            tipo: visto
            porque: 'NN′ separa las caras MNN′M′ y NPP′N′, que miran las dos hacia delante: nada la tapa.'
          - traza: segmento2(proy_alzado(P), proy_alzado(Pp))
            tipo: visto
            porque: 'PP′ separa las caras NPP′N′ y PQQ′P′, que miran las dos hacia delante: nada la tapa.'
          - traza: segmento2(proy_alzado(Q), proy_alzado(Qp))
            tipo: visto
            porque: 'QQ′ es contorno del alzado, la arista de abajo: separa la cara PQQ′P′, que mira hacia delante, de la QSS′Q′, que mira hacia atrás.'
          - traza: segmento2(proy_alzado(S), proy_alzado(P))
            tipo: oculto
            porque: 'SS′ separa las caras QSS′Q′ y STT′S′, que miran las dos hacia atrás: por delante la tapan la base MNPQST y la cara NPP′N′. S y P tienen la misma cota, y de P₂ a S′₂ va por detrás de PP′, en la misma recta del alzado: ese trozo es de PP′, que se ve. El tramo oculto va de S₂ a P₂.'
          - traza: segmento2(proy_alzado(T), proy_alzado(N))
            tipo: oculto
            porque: 'TT′ separa las caras STT′S′ y TMM′T′, que miran las dos hacia atrás: por delante la tapan la base MNPQST y la cara MNN′M′. T y N tienen la misma cota, y de N₂ a T′₂ va por detrás de NN′, en la misma recta del alzado: ese trozo es de NN′, que se ve. El tramo oculto va de T₂ a N₂.'
        construccion:
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("M1"), solucion.L_Q1)
            guia: figura.segmento("r1")
            porque: |
              **Los centros.** La base de M está en el plano paralelo a π por M, y la recta de máxima pendiente
              de ese plano por M es la paralela a r. En la planta, por M₁, la paralela a r₁, larga hacia arriba
              a la izquierda, más allá de e₁.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("M2"), solucion.L_Q2)
            guia: figura.segmento("r2")
            porque: |
              En el alzado, por M₂, la paralela a r₂, hacia abajo a la izquierda, más allá de e₂.
          - con: marca
            traza: proy_alzado(O)
            rotulo: O₂
            porque: |
              O₂, nombre nuestro, donde la paralela a r₂ corta e₂: el punto de esa recta que tiene la cota de e.
          - con: marca
            traza: proy_planta(O)
            rotulo: O₁
            porque: |
              O₁, donde la paralela a r₁ corta e₁, en la vertical de O₂: la recta de máxima pendiente por M corta
              e de verdad. Es O, el centro de la base de M, donde e corta su plano.
          - con: regla
            traza: '[segmento2(figura.punto("Ei2"), solucion.L_U2), segmento2(figura.punto("Ed2"), solucion.L_e2d)]'
            porque: |
              e₂, prolongada con la regla hacia los dos lados: a la izquierda hasta pasar r₂, y a la derecha
              hasta pasar la vertical de M, porque las cotas se van a contar desde ella.
          - con: marca
            traza: proy_alzado(U)
            rotulo: U₂
            porque: |
              U₂, nombre nuestro, donde e₂ prolongada corta r₂: U es el punto de r que tiene la cota de e.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(U), solucion.L_vU)
            porque: |
              Por U₂, la vertical hasta pasar r₁: U está en r.
          - con: marca
            traza: proy_planta(U)
            rotulo: U₁
            porque: |
              U₁, donde la vertical de U₂ corta r₁.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(U), solucion.L_hU)
            guia: figura.segmento("r1")
            porque: |
              Por U₁, la perpendicular a r₁, hasta pasar e₁: es la horizontal de π que tiene la cota de e,
              porque r es la recta de máxima pendiente de π y sus horizontales le son perpendiculares en la planta.
          - con: marca
            traza: proy_planta(Op)
            rotulo: O′₁
            porque: |
              O′₁, nombre nuestro, donde esa horizontal corta e₁: el punto donde e corta π, el centro de la otra
              base.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(Op), solucion.L_vOp)
            porque: |
              Por O′₁, la vertical hasta pasar e₂.
          - con: marca
            traza: proy_alzado(Op)
            rotulo: O′₂
            porque: |
              O′₂, donde la vertical de O′₁ corta e₂.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("M2"), solucion.L_Mh)
            porque: |
              **La vista 4.** El primer cambio es vertical: lleva cotas, contadas desde la de O, la referencia,
              que es la de e. Por M₂, la vertical hasta pasar e₂ prolongada: el trozo entre M₂ y e₂ es lo que M
              está más alto que O.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(O), solucion.L_O4), segmento2(figura.punto("M1"), solucion.L_M4)]'
            guia: figura.segmento("nueva1")
            porque: |
              Por O₁ y por M₁, las perpendiculares a la primera línea nueva, la de M₁ larga, más allá de la
              línea. Son paralelas a las horizontales de π.
          - con: marca
            traza: solucion.O_4
            rotulo: O₄
            porque: |
              O₄, donde la perpendicular de O₁ corta la línea nueva: O es la referencia, y cae en ella.
          - con: compas
            traza: 'arco(solucion.pM1, por: solucion.M_4, desde: desplaza(solucion.M_4, dx: -2.77, dy: -4.16), hasta: desplaza(solucion.M_4, dx: 2.77, dy: 4.16))'
            toma: segmento2(figura.punto("M2"), solucion.Mh)
            porque: |
              Con el compás, **lo que M₂ está por encima de e₂**. Se lleva desde la línea nueva hacia fuera, lejos
              de la planta: M es más alto que O.
          - con: marca
            traza: solucion.M_4
            rotulo: M₄
            porque: |
              M₄, donde el arco corta la perpendicular que sale de M₁.
          - con: regla
            traza: segmento2(solucion.O_4, solucion.L_canto)
            rotulo: canto
            porque: |
              O₄M₄, prolongada: el **canto** del plano de la base de M. Con sus horizontales de punta, el plano
              entero se ve como esta recta, y la base está en ella.
          - con: escuadra-cartabon
            traza: '[segmento2(solucion.O_4, solucion.L_O5), segmento2(solucion.M_4, solucion.L_M5)]'
            guia: figura.segmento("nueva2")
            porque: |
              **La vista 5.** Por O₄ y por M₄, las perpendiculares a la segunda línea nueva, que es paralela al
              canto.
          - con: marca
            traza: solucion.O_5
            rotulo: O₅
            porque: |
              O₅, donde la perpendicular de O₄ corta la segunda línea: O es también la referencia del segundo
              cambio.
          - con: marca
            traza: solucion.M_5
            rotulo: M₅
            porque: |
              M₅, donde la perpendicular de M₄ corta la segunda línea: M₁ está tan lejos de la primera línea como
              O₁, porque M₁O₁ es paralela a ella, y cae también en la línea. O₅M₅ es el radio de la base en
              verdadera magnitud.
          - con: compas
            traza: '[arco(solucion.O_5, por: solucion.N_5, desde: desplaza(solucion.N_5, dx: -2.7, dy: -4.21), hasta: desplaza(solucion.N_5, dx: 2.7, dy: 4.21)), arco(solucion.O_5, por: solucion.T_5, desde: desplaza(solucion.T_5, dx: 4.99, dy: -0.24), hasta: desplaza(solucion.T_5, dx: -4.99, dy: 0.24))]'
            toma: segmento2(solucion.O_5, solucion.M_5)
            porque: |
              Con centro en O₅ y radio O₅M₅, dos arcos, a un lado y a otro de la segunda línea: la
              circunferencia de la base, donde están sus seis vértices.
          - con: compas
            traza: '[arco(solucion.M_5, por: solucion.N_5, desde: desplaza(solucion.N_5, dx: -4.99, dy: 0.24), hasta: desplaza(solucion.N_5, dx: 4.99, dy: -0.24)), arco(solucion.M_5, por: solucion.T_5, desde: desplaza(solucion.T_5, dx: 2.7, dy: 4.21), hasta: desplaza(solucion.T_5, dx: -2.7, dy: -4.21))]'
            toma: segmento2(solucion.O_5, solucion.M_5)
            porque: |
              Con centro en M₅ y el mismo radio, dos arcos más: en un hexágono regular el lado mide lo mismo que
              el radio, así que los dos vértices contiguos a M están a O₅M₅ de M₅.
          - con: marca
            traza: solucion.N_5
            rotulo: N₅
            porque: |
              N₅, nombre nuestro, donde se cortan los arcos al otro lado de la segunda línea nueva.
          - con: marca
            traza: solucion.T_5
            rotulo: T₅
            porque: |
              T₅, nombre nuestro, donde se cortan los arcos entre la segunda línea nueva y el canto.
          - con: escuadra-cartabon
            traza: segmento2(solucion.N_5, solucion.L_N4)
            guia: figura.segmento("nueva2")
            porque: |
              **La vuelta.** Por N₅, la perpendicular a la segunda línea nueva, hasta pasar el canto: pasa también
              por T₅, porque N₅ y T₅ son simétricos respecto de la línea, y corta la línea en el punto medio de
              O₅M₅.
          - con: marca
            traza: solucion.N_4
            rotulo: N₄
            porque: |
              N₄, donde esa perpendicular corta el canto. T₄ cae en el mismo punto: N y T están a la misma
              distancia de O por la recta de máxima pendiente y tienen la misma cota.
          - con: escuadra-cartabon
            traza: segmento2(solucion.N_4, solucion.L_N1)
            guia: figura.segmento("nueva1")
            porque: |
              Por N₄, la perpendicular a la primera línea nueva, de vuelta a la planta, larga: cruza la paralela a
              r₁ por M₁ y sigue. Es la planta de la horizontal de la base que pasa por N y por T.
          - con: marca
            traza: solucion.Y1
            rotulo: Y₁
            porque: |
              Y₁, nombre nuestro, donde la perpendicular que sale de N₄ corta la paralela a r₁ por M₁: el punto
              medio de O₁M₁.
          - con: compas
            traza: '[arco(solucion.Y1, por: proy_planta(N), desde: desplaza(proy_planta(N), dx: -2.77, dy: -4.16), hasta: desplaza(proy_planta(N), dx: 2.77, dy: 4.16)), arco(solucion.Y1, por: proy_planta(T), desde: desplaza(proy_planta(T), dx: -2.77, dy: -4.16), hasta: desplaza(proy_planta(T), dx: 2.77, dy: 4.16))]'
            toma: segmento2(solucion.N_5, solucion.Yq)
            porque: |
              Con el compás, **lo que N₅ dista de la segunda línea nueva**, que es lo mismo que T₅. Desde Y₁, a los
              dos lados sobre la perpendicular: N₁ se aleja de la primera línea, porque N₅ quedaba al otro lado
              de la segunda; T₁ se acerca.
          - con: marca
            traza: proy_planta(N)
            rotulo: N₁
            porque: |
              N₁, donde el arco corta la perpendicular, lejos de la primera línea nueva.
          - con: marca
            traza: proy_planta(T)
            rotulo: T₁
            porque: |
              T₁, donde el otro arco corta la perpendicular, del lado de la primera línea nueva.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(N), solucion.L_vN), segmento2(proy_planta(T), solucion.L_vT)]'
            porque: |
              Por N₁ y por T₁, las verticales hasta el alzado, más arriba que e₂.
          - con: compas
            traza: 'arco(solucion.Nh, por: proy_alzado(N), desde: desplaza(proy_alzado(N), dx: -5), hasta: desplaza(proy_alzado(N), dx: 5))'
            toma: segmento2(solucion.N_4, solucion.pN1)
            porque: |
              Con el compás, **lo que N₄ dista de la primera línea nueva**: lo que N está más alto que O. Desde
              e₂, hacia arriba, sobre la vertical de N₁.
          - con: marca
            traza: proy_alzado(N)
            rotulo: N₂
            porque: |
              N₂, donde el arco corta la vertical de N₁.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(N), solucion.L_hN2)
            guia: figura.segmento("e2")
            porque: |
              Por N₂, la paralela a e₂, hacia la derecha, hasta pasar la vertical de T₁: T tiene la cota de N.
