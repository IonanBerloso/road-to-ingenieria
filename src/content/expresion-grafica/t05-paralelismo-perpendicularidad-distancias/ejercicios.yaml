        trazado:
          - segmento2(proy_alzado(K1), proy_alzado(K4))
          - segmento2(proy_planta(K1), proy_planta(K2))
          - segmento2(proy_planta(K2), proy_planta(K3))
          - segmento2(proy_planta(K3), proy_planta(K4))
          - segmento2(proy_planta(K4), proy_planta(K5))
          - segmento2(proy_planta(K5), proy_planta(K6))
          - segmento2(proy_planta(K6), proy_planta(K1))
          - segmento2(solucion.K1_4, solucion.K2_4)
          - segmento2(solucion.K2_4, solucion.K3_4)
          - segmento2(solucion.K3_4, solucion.K4_4)
          - segmento2(solucion.K4_4, solucion.K5_4)
          - segmento2(solucion.K5_4, solucion.K6_4)
          - segmento2(solucion.K6_4, solucion.K1_4)
        construccion:
          - con: compas
            traza: '[arco(proy_alzado(O), por: solucion.MedA, desde: desplaza(solucion.MedA, dx: 6), hasta: desplaza(solucion.MedA, dx: -6)), arco(proy_alzado(O), por: solucion.MedB, desde: desplaza(solucion.MedB, dx: 6), hasta: desplaza(solucion.MedB, dx: -6))]'
            porque: |
              **G, el punto medio del eje.** El eje va de O a O′. Con centro en O₂ y una abertura cualquiera
              mayor que la mitad de O₂O′₂, dos arcos, por encima y por debajo de e₂, hacia O′₂.
          - con: compas
            traza: '[arco(proy_alzado(Op), por: solucion.MedA, desde: desplaza(solucion.MedA, dx: -6), hasta: desplaza(solucion.MedA, dx: 6)), arco(proy_alzado(Op), por: solucion.MedB, desde: desplaza(solucion.MedB, dx: -6), hasta: desplaza(solucion.MedB, dx: 6))]'
            porque: |
              Con centro en O′₂ y la misma abertura, otros dos arcos, que cortan a los primeros.
          - con: regla
            traza: segmento2(solucion.MedA, solucion.MedB)
            porque: |
              La recta que une los dos cortes: la mediatriz de O₂O′₂.
          - con: marca
            traza: proy_alzado(G)
            rotulo: G₂
            porque: |
              G₂, nombre nuestro, donde la mediatriz corta e₂: el punto medio del eje.
          - con: compas
            traza: 'arco(proy_alzado(G), por: solucion.W2, desde: desplaza(solucion.W2, dy: 6), hasta: solucion.Z2)'
            porque: |
              **La traza, a 60°.** Con centro en G₂ y una abertura cualquiera, el arco desde un poco por debajo
              de e₂, a la derecha, hasta pasar los 60° hacia arriba.
          - con: marca
            traza: solucion.W2
            rotulo: W₂
            porque: |
              W₂, nombre nuestro, donde el arco corta e₂, a la derecha de G₂.
          - con: compas
            traza: 'arco(solucion.W2, por: solucion.Z2, desde: desplaza(solucion.Z2, dx: 5, dy: 2.9), hasta: desplaza(solucion.Z2, dx: -5, dy: -2.9))'
            toma: segmento2(proy_alzado(G), solucion.W2)
            porque: |
              Con centro en W₂ y la misma abertura, el arco que corta al primero por arriba: el triángulo G₂W₂Z₂
              es equilátero, y su ángulo en G₂ mide 60°.
          - con: marca
            traza: solucion.Z2
            rotulo: Z₂
            porque: |
              Z₂, nombre nuestro, donde se cortan los dos arcos, por encima de e₂.
          - con: regla
            traza: '[segmento2(proy_alzado(G), solucion.L_ta), segmento2(proy_alzado(G), solucion.L_tb)]'
            rotulo: traza
            porque: |
              La recta de G₂ por Z₂, prolongada hacia los dos lados hasta pasar las aristas de arriba y de abajo:
              la traza del plano, a 60° de la horizontal y subiendo hacia la derecha. El alzado lo ve de canto
              en ella.
          - con: marca
            traza: proy_alzado(K1)
            rotulo: 1₂
            porque: |
              **La sección en el alzado.** 1₂, donde la traza corta M₂M′₂, la arista más alta. Los números
              1 a 6 de los puntos de la sección son nuestros.
          - con: marca
            traza: proy_alzado(K2)
            rotulo: 2₂ ≡ 6₂
            porque: |
              2₂ ≡ 6₂, donde la traza corta la recta de N₂N′₂ y T₂T′₂: N y T tienen la misma cota.
          - con: marca
            traza: proy_alzado(K3)
            rotulo: 3₂ ≡ 5₂
            porque: |
              3₂ ≡ 5₂, donde la traza corta la recta de P₂P′₂ y S₂S′₂: P y S tienen la misma cota.
          - con: marca
            traza: proy_alzado(K4)
            rotulo: 4₂
            porque: |
              4₂, donde la traza corta Q₂Q′₂, la arista más baja.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_alzado(K1), solucion.L_v1), segmento2(proy_alzado(K2), solucion.L_v2), segmento2(proy_alzado(K3), solucion.L_v3), segmento2(proy_alzado(K4), solucion.L_v4)]'
            porque: |
              **En la planta.** Por cada punto del alzado, la vertical hasta la planta, larga: la de 2₂ ≡ 6₂ lleva
              a dos puntos, y la de 3₂ ≡ 5₂ también.
          - con: marca
            traza: proy_planta(K1)
            rotulo: 1₁
            porque: |
              1₁, donde la vertical corta M₁M′₁, la arista lateral en la que está 1.
          - con: marca
            traza: proy_planta(K2)
            rotulo: 2₁
            porque: |
              2₁, donde la vertical corta N₁N′₁, la arista lateral en la que está 2.
          - con: marca
            traza: proy_planta(K3)
            rotulo: 3₁
            porque: |
              3₁, donde la vertical corta P₁P′₁, la arista lateral en la que está 3.
          - con: marca
            traza: proy_planta(K4)
            rotulo: 4₁
            porque: |
              4₁, donde la vertical corta Q₁Q′₁, la arista lateral en la que está 4.
          - con: marca
            traza: proy_planta(K5)
            rotulo: 5₁
            porque: |
              5₁, donde la vertical corta S₁S′₁, la arista lateral en la que está 5.
          - con: marca
            traza: proy_planta(K6)
            rotulo: 6₁
            porque: |
              6₁, donde la vertical corta T₁T′₁, la arista lateral en la que está 6.
          - con: regla
            traza: '[segmento2(proy_planta(K1), proy_planta(K2)), segmento2(proy_planta(K2), proy_planta(K3)), segmento2(proy_planta(K3), proy_planta(K4)), segmento2(proy_planta(K4), proy_planta(K5)), segmento2(proy_planta(K5), proy_planta(K6)), segmento2(proy_planta(K6), proy_planta(K1))]'
            porque: |
              La sección en la planta: el hexágono 1₁2₁3₁4₁5₁6₁. Sus lados opuestos son paralelos, porque las caras
              opuestas del prisma lo son.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(K5), solucion.L_h5), segmento2(proy_planta(K5), solucion.L_h5i)]'
            guia: figura.segmento("e2")
            porque: |
              **La verdadera magnitud.** El cambio de plano es horizontal: lleva alejamientos, contados desde el
              de 5, la referencia, que es el menor. Por 5₁, la horizontal del papel hacia los dos lados, hasta
              pasar las verticales de 4₂ y de 1₂: lo que cada planta está por debajo de ella es lo que su punto
              está más cerca que 5.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_alzado(K1), solucion.L_n1), segmento2(proy_alzado(K2), solucion.L_n2), segmento2(proy_alzado(K3), solucion.L_n3), segmento2(proy_alzado(K4), solucion.L_n4)]'
            guia: figura.segmento("nueva")
            porque: |
              Por 1₂, 2₂ ≡ 6₂, 3₂ ≡ 5₂ y 4₂, las perpendiculares a la línea nueva, largas, más allá de la línea.
          - con: marca
            traza: solucion.K5_4
            rotulo: 5₄
            porque: |
              5₄, donde la perpendicular de 3₂ ≡ 5₂ corta la línea nueva: 5 es la referencia.
          - con: compas
            traza: 'arco(solucion.p1, por: solucion.K1_4, desde: desplaza(solucion.K1_4, dx: -2.5, dy: 4.33), hasta: desplaza(solucion.K1_4, dx: 2.5, dy: -4.33))'
            toma: segmento2(proy_planta(K1), solucion.h1)
            porque: |
              Con el compás, **lo que 1₁ está por debajo de la horizontal de 5₁**, desde la línea nueva hacia
              fuera, sobre la perpendicular que sale de 1₂.
          - con: marca
            traza: solucion.K1_4
            rotulo: 1₄
            porque: |
              1₄, donde el arco corta la perpendicular que sale de 1₂.
          - con: compas
            traza: 'arco(solucion.p2, por: solucion.K2_4, desde: desplaza(solucion.K2_4, dx: -2.5, dy: 4.33), hasta: desplaza(solucion.K2_4, dx: 2.5, dy: -4.33))'
            toma: segmento2(proy_planta(K2), solucion.h2)
            porque: |
              Con el compás, **lo que 2₁ está por debajo de la horizontal de 5₁**, desde la línea nueva hacia
              fuera, sobre la perpendicular que sale de 2₂ ≡ 6₂.
          - con: marca
            traza: solucion.K2_4
            rotulo: 2₄
            porque: |
              2₄, donde el arco corta la perpendicular que sale de 2₂ ≡ 6₂.
          - con: compas
            traza: 'arco(solucion.p3, por: solucion.K3_4, desde: desplaza(solucion.K3_4, dx: -2.5, dy: 4.33), hasta: desplaza(solucion.K3_4, dx: 2.5, dy: -4.33))'
            toma: segmento2(proy_planta(K3), solucion.h3)
            porque: |
              Con el compás, **lo que 3₁ está por debajo de la horizontal de 5₁**, desde la línea nueva hacia
              fuera, sobre la perpendicular que sale de 3₂ ≡ 5₂.
          - con: marca
            traza: solucion.K3_4
            rotulo: 3₄
            porque: |
              3₄, donde el arco corta la perpendicular que sale de 3₂ ≡ 5₂.
          - con: compas
            traza: 'arco(solucion.p4, por: solucion.K4_4, desde: desplaza(solucion.K4_4, dx: -2.5, dy: 4.33), hasta: desplaza(solucion.K4_4, dx: 2.5, dy: -4.33))'
            toma: segmento2(proy_planta(K4), solucion.h4)
            porque: |
              Con el compás, **lo que 4₁ está por debajo de la horizontal de 5₁**, desde la línea nueva hacia
              fuera, sobre la perpendicular que sale de 4₂.
          - con: marca
            traza: solucion.K4_4
            rotulo: 4₄
            porque: |
              4₄, donde el arco corta la perpendicular que sale de 4₂.
          - con: compas
            traza: 'arco(solucion.p2, por: solucion.K6_4, desde: desplaza(solucion.K6_4, dx: -2.5, dy: 4.33), hasta: desplaza(solucion.K6_4, dx: 2.5, dy: -4.33))'
            toma: segmento2(proy_planta(K6), solucion.h6)
            porque: |
              Con el compás, **lo que 6₁ está por debajo de la horizontal de 5₁**, desde la línea nueva hacia
              fuera, sobre la perpendicular que sale de 2₂ ≡ 6₂.
          - con: marca
            traza: solucion.K6_4
            rotulo: 6₄
            porque: |
              6₄, donde el arco corta la perpendicular que sale de 2₂ ≡ 6₂.
          - con: regla
            traza: '[segmento2(solucion.K1_4, solucion.K2_4), segmento2(solucion.K2_4, solucion.K3_4), segmento2(solucion.K3_4, solucion.K4_4), segmento2(solucion.K4_4, solucion.K5_4), segmento2(solucion.K5_4, solucion.K6_4), segmento2(solucion.K6_4, solucion.K1_4)]'
            porque: |
              La sección en verdadera magnitud: el hexágono 1₄2₄3₄4₄5₄6₄, con los lados opuestos iguales y
              paralelos.
        pista: |
          (1) La mediatriz de O₂O′₂ corta e₂ en G₂. (2) Con el compás, el triángulo equilátero G₂W₂Z₂ sobre e₂:
          G₂Z₂ forma 60° con la horizontal. (3) La traza corta las aristas laterales en el alzado: 1₂, 2₂ ≡ 6₂,
          3₂ ≡ 5₂ y 4₂. (4) Sus verticales, cada una a su arista en la planta. (5) Vista 4: perpendiculares a la
          línea nueva; 5₄ en ella, y los demás, a lo que su planta está por debajo de la horizontal de 5₁.
        desarrollo: |
          En verde claro, la traza, la sección en las dos vistas y su verdadera magnitud: un hexágono con los
          lados opuestos iguales y paralelos, de 10,67, 22,06 y 25,99 mm. En el alzado la sección es el trozo de
          la traza entre 1₂ y 4₂; en la planta, un hexágono acortado en la dirección de la traza, dibujado
          entero como construcción: con el prisma entero, 2₁3₁, 3₁4₁ y 4₁5₁ irían a trazos, porque están en
          las caras NPP′N′, PQQ′P′ y QSS′Q′, que miran hacia abajo.

      - tipo: calcular
        titulo: La diagonal mayor de la sección
        pregunta: ¿Cuánto mide en verdadera magnitud la diagonal mayor de la sección, la que va de 2 a 5?
        respuesta:
          tipo: numero
          valor: '51.98'
          receta: diag_mm
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '50.54'
            receta: en_mm(vm_planta(K2, K5))
            mensaje: |
              Eso es **2₁5₁ en la planta**. 2 está más alto que 5, y la planta acorta la diagonal: la verdadera
              magnitud está en la vista 4, 2₄5₄.
          - valor: '14.05'
            receta: en_mm(vm_alzado(K2, K5))
            mensaje: |
              Eso es **2₂5₂ en el alzado**, sobre la traza. El alzado ve el plano de canto: de la diagonal solo
              enseña lo que sube, no lo que avanza.
          - valor: '44.12'
            receta: en_mm(vm(K1, K4))
            mensaje: |
              Esa es la diagonal **de 1 a 4**, la que une las aristas MM′ y QQ′, también en verdadera magnitud.
              La mayor es la de 2 a 5.
          - valor: '48.65'
            receta: en_mm(vm(corte_recta_plano(recta3(N, Np), seci), corte_recta_plano(recta3(S, Sp), seci)))
            mensaje: |
              Esa es la diagonal mayor con el **otro** plano a 60°, el que sube hacia la izquierda. Para el
              enunciado vale también, pero aquí tomamos el que sube hacia la derecha, como r₂ (lo dicen las
              Notas), y con él la diagonal de 2 a 5 mide 51,98 mm.
        pista: |
          Mide 2₄5₄ en la vista 4, con «medir» del Taller o en tu lámina de papel.
        desarrollo: |
          En la vista 4, la sección está en verdadera magnitud, y la diagonal de 2 a 5 es la mayor:

          $$ \overline{2\,5} = \overline{2_4 5_4} \approx 51{,}98 \text{ mm} $$

          Por otro camino: la diagonal es la hipotenusa de lo que 2 y 5 se separan en la planta, 2₁5₁ = 50,54
          mm, y de lo que 2 está más alto que 5, 12,16 mm. En la vista 4, el trozo de perpendicular de 2₂ ≡ 6₂ a
          6₄ mide 52,28 mm, a 0,3 mm de la diagonal por casualidad: no es ninguna medida de la sección.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: 'El plano es proyectante vertical: el alzado lo ve de canto, en una recta que pasa por G₂ y forma 60° con la horizontal.'
          - texto: 'Las aristas laterales son horizontales: la traza las corta en el alzado, y cada punto baja a su arista en la planta.'
          - texto: 'Con un cambio de plano horizontal y la línea nueva paralela a la traza, el plano queda paralelo al plano nuevo, y la sección sale en verdadera magnitud.'
          - texto: 'La sección es un hexágono con los lados opuestos paralelos, porque las caras opuestas del prisma lo son.'
          - texto: 'La sección ya está en verdadera magnitud en el alzado, porque el alzado ve el plano de canto.'
            trampa: true
            mensaje: |
              De canto, el plano se ve como una recta, y la sección como un segmento de 28,1 mm: es lo contrario
              de la verdadera magnitud. Hace falta una vista con el plano paralelo al plano de proyección.
    resolucion: |
      **El plano.** G, el punto medio del eje OO′, está en la mediatriz de O₂O′₂. Por G pasan dos planos
      proyectantes verticales a 60° del horizontal; tomamos el que sube hacia la derecha (Notas). Su traza
      sale con el triángulo equilátero G₂W₂Z₂ sobre e₂.

      **La sección.** Las aristas laterales son horizontales, y la traza las corta en el alzado en 1₂, 2₂ ≡
      6₂, 3₂ ≡ 5₂ y 4₂. Sus verticales llevan cada punto a su arista en la planta.

      **La verdadera magnitud.** Con la línea nueva paralela a la traza y 5 de referencia, cada punto sale de
      su alzado por la perpendicular a la línea y se aparta de ella lo que su planta está por debajo de la
      horizontal de 5₁. La sección es un hexágono de lados 10,67, 22,06 y 25,99 mm, con los opuestos iguales
      y paralelos, y su diagonal mayor, de 2 a 5, mide 51,98 mm.
