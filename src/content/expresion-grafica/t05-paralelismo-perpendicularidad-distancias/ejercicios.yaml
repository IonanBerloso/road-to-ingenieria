            traza: proy_alzado(T)
            rotulo: T₂
            porque: |
              T₂, donde esa horizontal corta la vertical de T₁.
          - con: regla
            traza: '[segmento2(proy_planta(N), solucion.L_S1), segmento2(proy_planta(T), solucion.L_P1)]'
            porque: |
              **Los opuestos.** O es el centro del hexágono, y la planta conserva los puntos medios: las rectas de
              N₁ y de T₁ por O₁, prolongadas al otro lado de O₁. La de M₁ ya está trazada.
          - con: compas
            traza: 'arco(proy_planta(O), por: proy_planta(Q), desde: desplaza(proy_planta(Q), dx: -4.16, dy: 2.77), hasta: desplaza(proy_planta(Q), dx: 4.16, dy: -2.77))'
            toma: segmento2(proy_planta(O), figura.punto("M1"))
            porque: |
              Con centro en O₁ y radio O₁M₁, el arco al otro lado de O₁, sobre la paralela a r₁.
          - con: marca
            traza: proy_planta(Q)
            rotulo: Q₁
            porque: |
              Q₁, nombre nuestro, el opuesto a M₁, donde el arco corta la paralela a r₁ por M₁ más allá de O₁.
          - con: compas
            traza: 'arco(proy_planta(O), por: proy_planta(S), desde: desplaza(proy_planta(S), dx: -4.35, dy: -2.47), hasta: desplaza(proy_planta(S), dx: 4.35, dy: 2.47))'
            toma: segmento2(proy_planta(O), proy_planta(N))
            porque: |
              Con centro en O₁ y radio O₁N₁, el arco sobre la prolongación de N₁O₁.
          - con: marca
            traza: proy_planta(S)
            rotulo: S₁
            porque: |
              S₁, nombre nuestro, el opuesto a N₁, donde el arco corta la prolongación de N₁O₁. Cae casi en la vertical de M₁.
          - con: compas
            traza: 'arco(proy_planta(O), por: proy_planta(P), desde: desplaza(proy_planta(P), dx: 0.6, dy: 4.96), hasta: desplaza(proy_planta(P), dx: -0.6, dy: -4.96))'
            toma: segmento2(proy_planta(O), proy_planta(T))
            porque: |
              Con centro en O₁ y radio O₁T₁, el arco sobre la prolongación de T₁O₁.
          - con: marca
            traza: proy_planta(P)
            rotulo: P₁
            porque: |
              P₁, nombre nuestro, el opuesto a T₁, donde el arco corta la prolongación de T₁O₁.
          - con: regla
            traza: '[segmento2(proy_alzado(N), solucion.L_S2), segmento2(proy_alzado(T), solucion.L_P2)]'
            porque: |
              En el alzado, igual: las rectas de N₂ y de T₂ por O₂, prolongadas. La de M₂ ya está trazada.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(Q), solucion.L_vQ), segmento2(proy_planta(P), solucion.L_vP), segmento2(proy_planta(S), solucion.L_vS)]'
            porque: |
              Por Q₁, P₁ y S₁, las verticales hasta el alzado.
          - con: marca
            traza: proy_alzado(Q)
            rotulo: Q₂
            porque: |
              Q₂, donde la vertical de Q₁ corta la prolongación de M₂O₂.
          - con: marca
            traza: proy_alzado(P)
            rotulo: P₂
