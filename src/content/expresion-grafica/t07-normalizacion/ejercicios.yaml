ejercicios:
  # Orden (§04): los cinco son nuestros. Delante, los tres de entrada
  # (`ejemplo`); detrás, los dos de práctica. No hay ejercicios de la colección
  # ni de examen sobre normalización: se comprobó en el material (LEEME).
  - id: norm-escala-de-una-arista
    titulo: Una arista a escala 1:2, y su cota
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni de la colección de ejercicios.
    nivel: ejemplo
    enunciado: |
      Un plano está dibujado a escala 1:2. Una arista mide 37 mm en el papel.

      a) ¿Cuánto mide la arista en la pieza, y qué número se escribe en su cota?

      b) En el mismo plano, un detalle va a escala 5:1 y enseña una rosca M4, de 4 mm de diámetro.
      ¿Cuánto mide ese diámetro en el papel?
    pide: La medida real de la arista, la cota que se escribe y el diámetro dibujado en el detalle.
    pasos:
      - tipo: reconocer
        pregunta: ¿Qué dice la escala 1:2?
        opciones:
          - texto: Que 1 mm del dibujo son 2 mm de la pieza, así que el dibujo es la mitad
            correcta: true
            mensaje: |
              Eso es. La escala es lo que mide el dibujo partido por lo que mide la pieza, y se
              escribe con el dibujo delante: 1:2 es una reducción a la mitad.
          - texto: Que 2 mm del dibujo son 1 mm de la pieza
            mensaje: |
              Eso es 2:1, una ampliación. En una escala, el primer número es siempre el del
              dibujo.
          - texto: Que la cota se escribe a la mitad de la medida real
            mensaje: |
              La escala cambia lo que mide el dibujo, nunca la cota. La cota es siempre la medida
              de la pieza, y escribirla a escala es un error muy grave de la hoja de criterios.

      - tipo: calcular
        titulo: La arista en la pieza
        pregunta: ¿Cuánto mide la arista en la pieza?
        respuesta:
          tipo: numero
          valor: '74'
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '18.5'
            mensaje: |
              Has dividido entre 2. A 1:2 el dibujo es la mitad de la pieza, así que la pieza es el
              doble del dibujo: se multiplica.
          - valor: '37'
            mensaje: |
              Eso es lo que mide en el papel. A 1:2, la pieza mide el doble.
        pista: |
          1 mm del papel son 2 mm de la pieza.
        desarrollo: |
          $$
          37 \cdot 2 = 74 \text{ mm}
          $$

          Y la cota dice 74, la medida de la pieza.

      - tipo: calcular
        titulo: El diámetro en el detalle
        pregunta: En el detalle a 5:1, ¿cuánto mide en el papel el diámetro de la rosca M4?
        respuesta:
          tipo: numero
          valor: '20'
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '0.8'
            mensaje: |
              Has dividido entre 5. A 5:1 el dibujo es cinco veces la pieza: se multiplica.
          - valor: '4'
            mensaje: |
              Esos 4 mm son la medida real, la que se lee en la cota. El dibujo, a 5:1, la amplía
              cinco veces.
        pista: |
          A 5:1, 5 mm del papel son 1 mm de la pieza.
        desarrollo: |
          $$
          4 \cdot 5 = 20 \text{ mm}
          $$

          La cota del diámetro sigue diciendo M4, y la escala 5:1 se escribe junto al detalle.

      - tipo: justificar
        pregunta: Ordena cómo se dibuja y se acota la arista. Una pieza es falsa.
        piezas:
          - texto: La escala 1:2 dice que cada milímetro del papel son dos de la pieza.
          - texto: La arista mide 37 mm en el papel, así que en la pieza mide 2 · 37 = 74 mm.
          - texto: En la cota se escribe 74, la medida de la pieza, sea cual sea la escala.
          - texto: En la cota se escribe 37, que es lo que mide la línea dibujada.
            trampa: true
            mensaje: |
              Es el error muy grave «Acotar y/o dibujar sin tener en cuenta la escala», que cuesta
              2 puntos. La cota dice cómo es la pieza, no cómo es el dibujo.
    resolucion: |
      **La escala.** 1:2 es dibujo partido por realidad: el dibujo es la mitad de la pieza.

      **La arista.** En la pieza mide el doble que en el papel, $37 \cdot 2 = 74$ mm, y su cota
      dice 74. La cota es siempre la medida real.

      **El detalle.** A 5:1 el dibujo es cinco veces la pieza, así que el diámetro de 4 mm se
      dibuja de $4 \cdot 5 = 20$ mm. Su cota sigue diciendo M4, y la escala del detalle se
      escribe junto a él; la principal, 1:2, va en el cajetín.

  - id: norm-del-a0-al-a3
    titulo: Del A0 al A3, sin tabla
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni de la colección de ejercicios.
    nivel: ejemplo
    enunciado: |
      El formato A0 tiene 1 m² de superficie, y la proporción de sus lados es la que hace que la
      mitad de la hoja, cortada paralela a su lado corto, sea semejante a la hoja entera.

      a) ¿Cuánto mide el lado corto del A0?

      b) ¿Cuánto mide el lado largo del A3?
    pide: El lado corto del A0 y, partiendo de él, el lado largo del A3, los dos en mm.
    pasos:
      - tipo: reconocer
        pregunta: ¿Por qué los lados de un formato A están en la razón $\sqrt{2}$ y no en otra?
        opciones:
          - texto: Porque es la única razón con la que la mitad de la hoja tiene la misma forma que la hoja entera
            correcta: true
            mensaje: |
              Eso es. Si la mitad es semejante, $x/y = y/(x/2)$, y de ahí $x = \sqrt{2}\,y$. Por eso
              un dibujo pasa de un formato al siguiente sin deformarse.
          - texto: Porque así el A0 tiene exactamente un metro cuadrado
            mensaje: |
              El metro cuadrado fija el tamaño, no la forma: un cuadrado de 1 m de lado también tiene
              1 m². La razón sale de la otra condición, la de la mitad semejante.
          - texto: Porque 297 entre 210 da raíz de 2, y la serie se construyó a partir del A4
            mensaje: |
              Es al revés: el A4 sale del A0 a fuerza de partirlo por la mitad, y la razón viene de
              exigir que cada mitad sea semejante a la hoja de la que sale.

      - tipo: calcular
        titulo: El lado corto del A0
        pregunta: |
          Con $x \cdot y = 1\ \text{m}^2$ y $x = \sqrt{2}\, y$, ¿cuánto mide el lado corto $y$?
        respuesta:
          tipo: numero
          valor: '841'
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '707'
            mensaje: |
              Te has quedado en $y^{2} = 1/\sqrt{2} \approx 0{,}707$ y lo has tomado por $y$. Falta
              la raíz cuadrada.
          - valor: '1000'
            mensaje: |
              Eso sería un A0 cuadrado, de 1 m de lado. Tiene 1 m², pero su mitad no sería
              semejante a él.
          - valor: '1189'
            mensaje: |
              Ese es el lado largo, $x = \sqrt{2}\, y$. Aquí se pide el corto.
        pista: |
          Sustituye $x = \sqrt{2}\,y$ en $x \cdot y = 1$: queda $\sqrt{2}\,y^{2} = 1$.
        desarrollo: |
          $$
          \sqrt{2}\,y^{2} = 1 \;\Longrightarrow\; y = \frac{1}{\sqrt[4]{2}}\ \text{m}
          $$

          $$
          y \approx 0{,}841\ \text{m} = 841\ \text{mm}
          $$

          Y el lado largo, $x = \sqrt{2}\,y \approx 1189$ mm.

      - tipo: calcular
        titulo: El lado largo del A3
        pregunta: Partiendo del A0 de 841 × 1189 mm, ¿cuánto mide el lado largo del A3?
        respuesta:
          tipo: numero
          valor: '420'
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '594'
            mensaje: |
              Ese es el lado largo del A2: te ha faltado una partición. Del A0 al A3 hay tres.
          - valor: '297'
            mensaje: |
              Ese es el lado corto del A3. El largo es el corto del A2.
          - valor: '148.6'
            mensaje: |
              Has partido tres veces el mismo lado, 1189 entre 8. Cada partición corta el lado largo,
              y el lado corto del formato anterior pasa a ser el largo del siguiente.
        pista: |
          Cada formato es el anterior partido por la mitad: su lado largo es el lado corto del
          anterior.
        desarrollo: |
          A0, 841 × 1189 → A1, 594 × 841 → A2, 420 × 594 → A3, 297 × 420. El lado largo del A3 es
          el corto del A2, 420 mm. Cuando la mitad no es entera, como los 594,5 de partir 1189, la
          tabla se queda con el milímetro de abajo.

      - tipo: justificar
        pregunta: Ordena de dónde salen las medidas del A3. Una pieza es falsa.
        piezas:
          - texto: El A0 tiene 1 m², y su mitad tiene que ser semejante a él.
          - texto: La semejanza obliga a que el lado largo sea √2 veces el corto, y con 1 m² salen 841 × 1189 mm.
          - texto: 'Cada formato es el anterior partido por la mitad: su lado largo es el corto del anterior.'
          - texto: Tres particiones después del A0, el A3 mide 297 × 420 mm.
          - texto: Cada formato tiene los dos lados la mitad que el anterior.
            trampa: true
            mensaje: |
              Con los dos lados a la mitad, la superficie se divide entre cuatro, no entre dos: del
              A0 saldría 594,5 × 420,5, que es un A2. Cada partición corta solo el lado largo.
    resolucion: |
      **La forma.** Que la mitad del A0 sea semejante a él obliga a
      $x/y = y/(x/2)$, es decir, $x = \sqrt{2}\,y$.

      **El tamaño.** Con $x \cdot y = 1\ \text{m}^2$ queda $\sqrt{2}\,y^{2} = 1$, y
      $y = 1/\sqrt[4]{2}\ \text{m} \approx 841$ mm; el lado largo, $x \approx 1189$ mm.

      **La serie.** Cada partición corta el lado largo, así que el lado corto de un formato es el
      largo del siguiente: A1, 594 × 841; A2, 420 × 594; A3, 297 × 420. El lado largo del A3
      mide 420 mm.

  - id: norm-lineas-que-coinciden
    titulo: Seis cruces de líneas, y cuál se dibuja
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni de la colección de ejercicios.
    nivel: ejemplo
    enunciado: |
      En una vista hay seis sitios donde dos líneas caen una encima de otra:

      1. una arista vista y el eje de un agujero;
      2. una arista oculta y un eje de simetría;
      3. una arista vista y una arista oculta;
      4. la traza de un plano de corte y una arista oculta;
      5. la traza de un plano de corte y un eje de simetría;
      6. una línea de centros de gravedad y un eje de revolución.

      En cada cruce se dibuja una sola línea. ¿En cuáles es la línea de trazos de las aristas
      ocultas?
    pide: Con qué línea se dibuja un eje, y en qué cruces se dibuja la línea de trazos.
    pasos:
      - tipo: reconocer
        pregunta: ¿Con qué línea se dibuja el eje de un agujero?
        opciones:
          - texto: Fina de trazo y punto
            correcta: true
            mensaje: |
              Eso es: ejes de revolución, trazas de planos de simetría y trayectorias. Y al menos un
              eje de simetría y uno de agujero son un mínimo de la hoja de criterios: sin ellos, el
              ejercicio no se corrige.
          - texto: Fina de trazos
            mensaje: |
              Esa es la de los contornos y las aristas ocultos. Un eje no es una arista: ahí no hay
              nada de la pieza.
          - texto: Fina de trazo y dos puntos
            mensaje: |
              Esa es la de las piezas vecinas, las posiciones extremas de una pieza que se mueve y
              las líneas de centros de gravedad. El eje lleva un solo punto entre trazo y trazo.
          - texto: Gruesa continua
            mensaje: |
              La gruesa continua es para lo que se ve, contornos y aristas. Un eje es una línea de
              referencia y va en fina.

      # Decisión: COMP2 con `conjunto` sobre elementos numerados (PLAN-K §4.5).
      # La elección es real —seis cruces, y en cada uno hay que aplicar la
      # prioridad— y se verifica contra la lista de las diapositivas de
      # normalización (pág. 4). El cruce 4 está a propósito: que la oculta tape
      # a la traza de corte es lo que menos se espera, y la lista lo dice.
      - tipo: calcular
        titulo: Los cruces donde manda la oculta
        pregunta: Escribe los números de los cruces en los que se dibuja la línea de trazos.
        respuesta:
          tipo: conjunto
          valor: '2, 4'
          tolerancia: 0.1
          formato: los números de los cruces, separados por comas
        distractores:
          - valor: '2'
            mensaje: |
              Te falta el 4. La traza de un plano de corte va detrás de las ocultas en el orden de
              prioridad: las ocultas van segundas y el corte, tercero.
          - valor: '2, 3, 4'
            mensaje: |
              En el 3 manda la arista vista. Lo que se ve va primero y tapa a cualquier otra línea,
              también a una oculta que caiga debajo.
          - valor: '4'
            mensaje: |
              Te falta el 2. La oculta va antes que el eje de simetría, así que lo tapa.
        pista: |
          El orden es: vistas, ocultas, trazas de corte, ejes y simetrías, centros de gravedad,
          proyección. En cada cruce gana la que va antes.
        desarrollo: |
          Cruce a cruce, con el orden de prioridad de las diapositivas (pág. 4):

          - 1: la vista (primera) tapa al eje (cuarto).
          - 2: la oculta (segunda) tapa al eje (cuarto).
          - 3: la vista (primera) tapa a la oculta (segunda).
          - 4: la oculta (segunda) tapa a la traza de corte (tercera).
          - 5: la traza de corte (tercera) tapa al eje (cuarto).
          - 6: el eje (cuarto) tapa a la línea de centros de gravedad (quinta).

          La línea de trazos sale en el 2 y en el 4.

      - tipo: justificar
        pregunta: Ordena la regla de las líneas que coinciden. Una pieza es falsa.
        piezas:
          - texto: En cada cruce se dibuja una sola línea, la que va antes en el orden de prioridad.
          - texto: Lo que se ve va primero, y una arista vista tapa a cualquier otra línea.
          - texto: Después van las ocultas, que tapan incluso la traza de un plano de corte.
          - texto: Los ejes y las simetrías van detrás del corte, y delante de las líneas de centros de gravedad y de proyección.
          - texto: El eje gana siempre, porque es un mínimo de la hoja de criterios.
            trampa: true
            mensaje: |
              El mínimo pide que el eje esté dibujado, no que tape una arista vista. Donde
              coinciden se dibuja la arista, y el eje se ve en el resto de su recorrido.
    resolucion: |
      **El eje.** Va en fina de trazo y punto, como los planos de simetría y las trayectorias.

      **El orden.** Cuando dos líneas coinciden se dibuja la que va antes en esta lista: vistas,
      ocultas, trazas de corte, ejes y simetrías, centros de gravedad, proyección.

      **Los seis cruces.** En el 1 y el 3 gana la vista; en el 2, la oculta sobre el eje; en el 4,
      la oculta sobre el corte; en el 5, el corte sobre el eje; en el 6, el eje sobre la línea de
      centros de gravedad. La línea de trazos se dibuja en el 2 y en el 4.

  - id: norm-recuadro-y-escala
    titulo: El recuadro de un A3, y la escala con la que cabe una pieza
    fuente: Ejercicio propio · Road to Ingeniería. Con los márgenes de las láminas A3 de la escuela, medidos sobre su PDF. No es de examen ni de la colección de ejercicios.
    nivel: practica
    enunciado: |
      Vas a dibujar una pieza en una hoja A3 apaisada como las de la escuela, con un margen de
      archivo de 20 mm a la izquierda y de 10 mm en los otros tres lados.

      a) ¿Cuánto mide de ancho el recuadro?

      b) La pieza mide 520 mm de largo y 90 de alto, y va en una sola vista, a lo largo de la hoja.
      ¿Cuál es la mayor escala recomendada con la que cabe en el recuadro?
    pide: El ancho del recuadro, en mm, y la escala, escrita como el número x de la escala 1:x.
    pasos:
      - tipo: reconocer
        pregunta: ¿Por qué el margen de la izquierda es más ancho que los otros tres?
        opciones:
          - texto: Porque es el margen de archivo, el de los taladros o la encuadernación, y va en el lado opuesto al cajetín
            correcta: true
            mensaje: |
              Eso es. El cajetín va en la esquina inferior derecha del recuadro; el lado izquierdo es
              el que se taladra o se encuaderna, y necesita más sitio.
          - texto: Porque el cajetín va a la izquierda y necesita sitio
            mensaje: |
              El cajetín va en la esquina inferior derecha, y dentro del recuadro. El margen ancho
              está en el lado contrario.
          - texto: Porque la hoja se pliega por ese lado
            mensaje: |
              La tabla de la pág. 1-11 del libro rotula ese margen «plegado», pero el texto de esa
              misma página habla de «márgenes de protección y archivado», y la pág. 1-29 lo llama
              margen de archivo: es la tira que queda para taladrar o encuadernar el plano, ya
              plegado. Los pliegues de un A3 caen a 125 y a 230 mm del borde, no en el margen.

      # Decisión: márgenes de 20 (archivo) y 10, los de las diapositivas
      # (pág. 6) y los del libro en sus págs. 1-28 y 1-29, y los que miden las tres
      # láminas A3 de la escuela (polipasto, polea directriz, hoja 54: recuadro
      # de 390,0 × 277,0, guiones/mide-recuadro.py). La tabla de la pág. 1-11 del
      # libro da 30 de archivo para un A3: es el distractor 380, no la respuesta.
      - tipo: calcular
        titulo: El ancho del recuadro
        pregunta: ¿Cuánto mide de ancho el recuadro de la hoja A3 apaisada?
        respuesta:
          tipo: numero
          valor: '390'
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '380'
            mensaje: |
              Has tomado 30 mm de margen izquierdo, el de la tabla de la pág. 1-11 del libro. Las
              láminas de la escuela y las diapositivas usan 20.
          - valor: '400'
            mensaje: |
              Has quitado 10 a cada lado, o solo los 20 del margen de archivo. Hay que quitar los dos
              márgenes: 20 a la izquierda y 10 a la derecha.
          - valor: '410'
            mensaje: |
              Has quitado un solo margen. El recuadro deja margen a los dos lados, 20 a la
              izquierda y 10 a la derecha.
        pista: |
          Al ancho de la hoja, 420 mm, hay que quitarle los dos márgenes laterales.
        desarrollo: |
          $$
          420 - 20 - 10 = 390 \text{ mm}
          $$

          Y de alto, $297 - 10 - 10 = 277$ mm. Es lo que miden los recuadros de las láminas de la
          escuela.

      # Decisión: la escala se contesta como el número x de 1:x, porque el
      # lector `numero` no lee «1:2». La lista de escalas recomendadas es la del
      # libro (pág. 1-26); las diapositivas (pág. 5) añaden 1:2500, que aquí no
      # cambia nada.
      - tipo: calcular
        titulo: La mayor escala con la que cabe
        pregunta: |
          ¿Cuál es la mayor escala recomendada con la que la vista cabe en el recuadro? Escribe el
          número x de la escala 1:x.
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.1
          formato: el número x de la escala 1:x
        distractores:
          - valor: '1.33'
            mensaje: |
              Con 1:1,33 la vista llena el recuadro justo, pero no es una de las escalas
              recomendadas. Las de reducción son 1:2, 1:5, 1:10… y la primera que cabe es 1:2.
          - valor: '1'
            mensaje: |
              A 1:1 la vista mide 520 mm, y el recuadro tiene 390. No cabe.
          - valor: '5'
            mensaje: |
              A 1:5 cabe, con 104 mm, pero a 1:2 también cabe y se dibuja dos veces y media más
              grande. Se elige la mayor que quepa.
        pista: |
          Divide el largo de la pieza entre el ancho del recuadro, y sube a la primera escala
          recomendada que deje la vista por debajo de 390 mm.
        desarrollo: |
          $$
          \frac{520}{390} \approx 1{,}33
          $$

          Hay que reducir al menos 1,33 veces, y la primera escala recomendada que reduce más es
          1:2. La vista mide $520/2 = 260$ por $90/2 = 45$ mm, y cabe también encima del cajetín,
          que ocupa los 40 mm de abajo. La escala, 1:2, se escribe en el cajetín.

      - tipo: justificar
        pregunta: Ordena cómo se elige la escala. Una pieza es falsa.
        piezas:
          - texto: El recuadro de un A3 apaisado deja 20 mm a la izquierda y 10 en los demás lados, y mide 390 × 277 mm.
          - texto: La pieza mide 520 mm, así que a 1:1 no cabe a lo largo.
          - texto: La mayor escala recomendada que la deja por debajo de 390 es 1:2, y la vista mide 260 × 45 mm.
          - texto: La escala elegida se escribe en el cajetín, en la esquina inferior derecha.
          - texto: Se dibuja a 1:1,33, que llena el recuadro y se ve más grande.
            trampa: true
            mensaje: |
              1:1,33 no es una de las escalas recomendadas, que en la lista del libro son un 1, un 2
              o un 5 seguidos de ceros, como 1:2, 1:5 o 1:10. El libro solo admite escalas
              intermedias en casos excepcionales, y este no lo es: 1:2 cabe.
    resolucion: |
      **El recuadro.** Al A3 apaisado, de 420 × 297 mm, se le quitan 20 mm a la izquierda y 10 en
      los otros tres lados: $420 - 20 - 10 = 390$ de ancho y $297 - 10 - 10 = 277$ de alto.

      **La escala.** La pieza mide 520 mm y el recuadro 390, así que hay que reducir al menos
      $520/390 \approx 1{,}33$ veces. Entre las escalas recomendadas, la mayor que reduce eso o más
      es 1:2: la vista mide 260 × 45 mm y cabe, también por encima del cajetín. La escala 1:2 va
      en el cajetín.

  # Decisión: la graduación mide 71 mm en la copia, el 70,7 % de A3 a A4
  # (1/√2) redondeado a lo que se lee con una regla. El plano va a 1:5, no a
  # 1:2: con 1:2, como 0,71² ≈ 1/2, aplicar la copia al revés caía en los
  # distractores de otros errores y recibía el mensaje equivocado (revisión,
  # M1). Las tolerancias aceptan la cuenta con 0,71 y con 1/√2 exacto: 338 o
  # 339,4 mm (tolerancia 1,5) y 3,55, 3,6 o 3,54 mm (tolerancia 0,2); lo
  # comprueban guiones/cifras-t07.py y guiones/rehace-revision.mjs.
  - id: norm-la-copia-reducida
    titulo: Medir en una fotocopia reducida
    fuente: Ejercicio propio · Road to Ingeniería. No es de examen ni de la colección de ejercicios.
    nivel: practica
    enunciado: |
      Tienes una fotocopia en A4 de un plano A3 dibujado a escala 1:5. En el margen del original
      había una graduación métrica de referencia de 100 mm, y en la copia mide 71 mm.

      a) Una arista mide 48 mm en la copia. ¿Cuánto mide en la pieza?

      b) Las cotas del original estaban rotuladas a 5 mm de altura. ¿A qué altura salen en la
      copia?
    pide: La medida real de la arista, en mm, y la altura de las cotas en la copia.
    pasos:
      - tipo: reconocer
        pregunta: ¿Para qué sirve la graduación métrica de referencia que lleva el margen de un plano?
        opciones:
          - texto: Para saber a qué escala está una copia, que puede no ser la del original
            correcta: true
            mensaje: |
              Eso es. La escala del cajetín es la del original. Si el plano se reduce o se amplía al
              copiarlo, la graduación, que mide 100 mm en el original, dice cuánto.
          - texto: Para medir la pieza directamente, sin tener en cuenta la escala
            mensaje: |
              La graduación mide el papel, no la pieza. Para pasar a la pieza sigue haciendo falta
              la escala del plano.
          - texto: Para centrar la hoja al reproducirla
            mensaje: |
              Eso lo hacen las señales de centrado, en los extremos de los ejes de la hoja. La
              graduación es para medir.

      - tipo: calcular
        titulo: La arista en la pieza
        pregunta: Una arista mide 48 mm en la copia. ¿Cuánto mide en la pieza?
        respuesta:
          tipo: numero
          valor: '338'
          tolerancia: 1.5
          formato: un número, en mm
        distractores:
          - valor: '240'
            mensaje: |
              Has aplicado la escala del cajetín a la copia. La copia está reducida al 71 %, y
              primero hay que volver al tamaño del original.
          - valor: '67.6'
            mensaje: |
              Eso es lo que mide la arista en el original. Falta la escala del plano: a 1:5, la
              pieza mide cinco veces más.
          - valor: '13.5'
            mensaje: |
              Has dividido entre 5. A 1:5 el original es la quinta parte de la pieza, así que la
              pieza mide cinco veces el original.
          - valor: '170.4'
            mensaje: |
              Has multiplicado por 0,71 en vez de dividir: has aplicado la copia al revés. La copia
              es más pequeña que el original, así que para volver al original se divide entre 0,71.
        pista: |
          Primero, de la copia al original: divide entre 0,71. Después, del original a la pieza:
          multiplica por 5.
        desarrollo: |
          En el original, la arista mide

          $$
          \frac{48}{0{,}71} \approx 67{,}6 \text{ mm}
          $$

          y en la pieza, a 1:5, cinco veces más:

          $$
          67{,}6 \cdot 5 \approx 338 \text{ mm}
          $$

      - tipo: calcular
        titulo: La altura de las cotas en la copia
        pregunta: Las cotas del original estaban rotuladas a 5 mm. ¿A qué altura salen en la copia?
        respuesta:
          tipo: numero
          valor: '3.5'
          tolerancia: 0.2
          formato: un número, en mm
        distractores:
          - valor: '7.04'
            mensaje: |
              Has dividido entre 0,71 en vez de multiplicar. La copia es más pequeña que el
              original, y la letra también encoge.
          - valor: '2.5'
            mensaje: |
              Un A4 es la mitad de un A3 en superficie, no en longitud. Cada medida se reduce en la
              razón 1/√2, al 71 %, no a la mitad.
        pista: |
          La copia reduce todas las medidas en la misma razón que la graduación: 71 de cada 100.
        desarrollo: |
          $$
          5 \cdot 0{,}71 \approx 3{,}5 \text{ mm}
          $$

          Es otra altura de la serie normalizada. Las alturas de letra van en razón $\sqrt{2}$
          precisamente para que una reducción de A3 a A4 deje la letra en una altura de la serie.

      - tipo: justificar
        pregunta: Ordena cómo se mide en la copia. Una pieza es falsa.
        piezas:
          - texto: 'La graduación mide 100 mm en el original y 71 en la copia: la copia está al 71 %.'
          - texto: Los 48 mm de la copia son 48 / 0,71 ≈ 67,6 mm en el original.
          - texto: El original está a 1:5, así que la pieza mide 5 · 67,6 ≈ 338 mm.
          - texto: Como el cajetín dice 1:5, la pieza mide 5 · 48 = 240 mm.
            trampa: true
            mensaje: |
              La escala del cajetín es la del original. La de una copia puede ser otra, y para eso
              está la graduación: esta copia está al 71 %.
    resolucion: |
      **La escala de la copia.** La graduación, de 100 mm en el original, mide 71 en la copia: la
      copia está al 71 %, que es $1/\sqrt{2}$, la reducción de A3 a A4.

      **La arista.** En el original mide $48/0{,}71 \approx 67{,}6$ mm, y en la pieza, a 1:5,
      cinco veces más: unos 338 mm.

      **Las cotas.** Toda la copia encoge en la misma razón, así que la letra de 5 mm sale de
      $5 \cdot 0{,}71 \approx 3{,}5$ mm, otra altura de la serie normalizada.
