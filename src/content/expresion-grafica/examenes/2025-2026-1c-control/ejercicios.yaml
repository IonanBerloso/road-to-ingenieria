        pista: |
          (1) La paralela a las aristas por V perfora la base en W. (2) La traza de cada arista va de W₁ por su extremo
          de abajo y corta dos lados del cuadrado; unidos con V₁, dan los cortes en esa arista. (3) CC′ se hace en el
