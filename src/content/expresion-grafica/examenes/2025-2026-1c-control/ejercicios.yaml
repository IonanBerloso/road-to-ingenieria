                  5₂ va en la **vertical de 5₁**: son el mismo punto visto dos veces.
                ejemplo: 'desplaza(proy_alzado(solucion.P5), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la vertical de 5₁, pero no sobre la arista: 5₂ cae en V₂D₂.
          - nombre: N2a
            pide: 2 en el alzado
            es: proy_alzado(solucion.P2)
            bien: |
              2₂ está en la vertical de 2₁, sobre V₂D₂.
            diagnosticos:
              - si: '!en_vertical_de(N2p)'
                mensaje: |
                  2₂ va en la **vertical de 2₁**: son el mismo punto visto dos veces.
                ejemplo: 'desplaza(proy_alzado(solucion.P2), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la vertical de 2₁, pero no sobre la arista: 2₂ cae en V₂D₂.
          - nombre: N9p
            pide: 9, donde VF entra en el prisma, por su cara BCC′B′, en la planta
            es: proy_planta(solucion.P9)
            bien: |
              9₁ está en V₁F₁, donde la corta la paralela a las aristas del prisma que sale de la traza del plano por VF.
            diagnosticos:
              - si: cerca_de(proy_planta(solucion.P7))
                mensaje: |
                  Ese es 7₁, el otro corte de VF con el prisma. 9 es el de la cara BCC′B′.
                ejemplo: proy_planta(solucion.P7)
              - si: '!en_recta(figura.segmento("DF1"))'
                mensaje: |
                  9 es un punto de VF: va **en su planta**, en la recta ya dibujada.
                ejemplo: 'desplaza(proy_planta(solucion.P9), dx: mm(4), dy: mm(5))'
              - si: siempre
                mensaje: |
                  Estás en V₁F₁, pero no en el corte: la traza del plano por VF corta el lado de la base del prisma de la cara BCC′B′, y de ahí la paralela a las aristas del prisma da 9₁.
          - nombre: N7p
            pide: 7, donde VF sale del prisma, por su cara ABB′A′, en la planta
            es: proy_planta(solucion.P7)
            bien: |
              7₁ está en V₁F₁, donde la corta la paralela a las aristas del prisma que sale de la traza del plano por VF.
            diagnosticos:
              - si: cerca_de(proy_planta(solucion.P9))
                mensaje: |
                  Ese es 9₁, el otro corte de VF con el prisma. 7 es el de la cara ABB′A′.
                ejemplo: proy_planta(solucion.P9)
              - si: '!en_recta(figura.segmento("DF1"))'
                mensaje: |
                  7 es un punto de VF: va **en su planta**, en la recta ya dibujada.
                ejemplo: 'desplaza(proy_planta(solucion.P7), dx: mm(4), dy: mm(5))'
              - si: siempre
                mensaje: |
                  Estás en V₁F₁, pero no en el corte: la traza del plano por VF corta el lado de la base del prisma de la cara ABB′A′, y de ahí la paralela a las aristas del prisma da 7₁.
          - nombre: N9a
            pide: 9 en el alzado
            es: proy_alzado(solucion.P9)
            bien: |
              9₂ está en la vertical de 9₁, sobre V₂F₂.
            diagnosticos:
              - si: '!en_vertical_de(N9p)'
                mensaje: |
                  9₂ va en la **vertical de 9₁**: son el mismo punto visto dos veces.
                ejemplo: 'desplaza(proy_alzado(solucion.P9), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la vertical de 9₁, pero no sobre la arista: 9₂ cae en V₂F₂.
          - nombre: N7a
            pide: 7 en el alzado
            es: proy_alzado(solucion.P7)
            bien: |
              7₂ está en la vertical de 7₁, sobre V₂F₂.
            diagnosticos:
              - si: '!en_vertical_de(N7p)'
                mensaje: |
                  7₂ va en la **vertical de 7₁**: son el mismo punto visto dos veces.
                ejemplo: 'desplaza(proy_alzado(solucion.P7), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la vertical de 7₁, pero no sobre la arista: 7₂ cae en V₂F₂.
        tramos:
          - traza: segmento2(figura.punto("A2"), proy_alzado(solucion.P1))
            tipo: visto
            porque: 'De A₂ a 1₂: AA′ es la arista de delante del prisma, la de A₁, con más alejamiento que B₁ y C₁, y fuera de la pirámide nada se le pone delante.'
          - traza: segmento2(proy_alzado(solucion.P6), figura.punto("A2p"))
            tipo: visto
            porque: 'De 6₂ a A′₂: AA′ sale por la cara de delante VEF, y sigue siendo la arista de delante del prisma.'
          - traza: segmento2(figura.punto("B2"), proy_alzado(solucion.P3))
            tipo: oculto
            porque: 'De B₂ a 3₂: BB′ es la arista de atrás del prisma, con B₁ de menos alejamiento, y la tapa la cara CAA′C′, la de delante.'
          - traza: segmento2(proy_alzado(solucion.P8), figura.punto("B2p"))
            tipo: oculto
            porque: 'De 8₂ a B′₂: BB′ sigue siendo la arista de atrás, tapada por la cara CAA′C′.'
          - traza: segmento2(figura.punto("C2"), solucion.k_C_VD2)
            tipo: visto
            porque: 'De C₂ al cruce con V₂D₂: CC′ es contorno del prisma en el alzado, y aún no ha llegado detrás de la pirámide.'
          - traza: segmento2(solucion.k_C_VD2, proy_alzado(solucion.P4))
            tipo: oculto
            porque: 'Del cruce con V₂D₂ a 4₂: CC′ entra por la cara de atrás, VGD, así que ese trozo va detrás de la cara VDE.'
          - traza: segmento2(proy_alzado(solucion.P10), figura.punto("C2p"))
            tipo: visto
            porque: 'De 10₂ a C′₂: CC′ sale por la cara de delante VEF, y es contorno del prisma: nada la tapa.'
          - traza: segmento2(figura.punto("A2"), figura.punto("C2"))
            tipo: visto
            porque: 'A₂C₂: el lado de delante de la base de arriba del prisma; B₂ cae en medio, y su lado va detrás.'
          - traza: segmento2(figura.punto("V2"), proy_alzado(solucion.P5))
            tipo: visto
            porque: 'De V₂ a 5₂: VD es contorno de la pirámide, y hasta el prisma nada se le pone delante.'
          - traza: segmento2(proy_alzado(solucion.P2), solucion.k_VD_A2)
            tipo: oculto
            porque: 'De 2₂ al cruce con A₂A′₂: VD acaba de salir por la cara ABB′A′, la de atrás del prisma, y el prisma le pasa por delante.'
          - traza: segmento2(solucion.k_VD_A2, figura.punto("D2"))
            tipo: visto
            porque: 'Del cruce con A₂A′₂ a D₂: VD queda fuera del contorno del prisma, y es contorno de la pirámide.'
          - traza: segmento2(figura.punto("V2"), solucion.k_VF_C2)
            tipo: visto
            porque: 'De V₂ al cruce con C₂C′₂: VF es contorno de la pirámide, y por encima del prisma nada la tapa.'
          - traza: segmento2(solucion.k_VF_C2, proy_alzado(solucion.P9))
            tipo: oculto
            porque: 'Del cruce con C₂C′₂ a 9₂: VF entra por la cara BCC′B′, la de atrás, así que el prisma le pasa por delante.'
          - traza: segmento2(proy_alzado(solucion.P7), figura.punto("F2"))
            tipo: oculto
            porque: 'De 7₂ a F₂: VF sale por la cara ABB′A′, la de atrás, y el prisma aún le pasa por delante hasta la base.'
          - traza: segmento2(proy_alzado(solucion.P1), proy_alzado(solucion.P2))
            tipo: oculto
            porque: '1₂2₂ está en la cara ABB′A′, la de atrás del prisma.'
          - traza: segmento2(proy_alzado(solucion.P2), proy_alzado(solucion.P3))
            tipo: oculto
            porque: '2₂3₂ está en la cara de atrás del prisma, y en la VGD, también de atrás.'
          - traza: segmento2(proy_alzado(solucion.P3), proy_alzado(solucion.P4))
            tipo: oculto
            porque: '3₂4₂ está en la cara BCC′B′, de atrás, y en la VGD, también de atrás.'
          - traza: segmento2(proy_alzado(solucion.P4), proy_alzado(solucion.P5))
            tipo: oculto
            porque: '4₂5₂ está en la cara de atrás de la pirámide, VGD: la tapa la VDE.'
          - traza: segmento2(proy_alzado(solucion.P5), proy_alzado(solucion.P1))
            tipo: visto
            porque: '5₂1₂ está en la cara CAA′C′, la de delante del prisma, y en la VDE, la de delante de la pirámide: las dos miran a quien ve el alzado.'
          - traza: segmento2(proy_alzado(solucion.P6), proy_alzado(solucion.P7))
            tipo: oculto
            porque: '6₂7₂ está en la cara ABB′A′, la de atrás del prisma.'
          - traza: segmento2(proy_alzado(solucion.P7), proy_alzado(solucion.P8))
            tipo: oculto
            porque: '7₂8₂ está en la cara ABB′A′ y en la VFG: las dos de atrás.'
          - traza: segmento2(proy_alzado(solucion.P8), proy_alzado(solucion.P9))
            tipo: oculto
            porque: '8₂9₂ está en la cara BCC′B′ y en la VFG: las dos de atrás.'
          - traza: segmento2(proy_alzado(solucion.P9), proy_alzado(solucion.P10))
            tipo: oculto
            porque: '9₂10₂ está en la cara BCC′B′, la de atrás del prisma.'
          - traza: segmento2(proy_alzado(solucion.P10), proy_alzado(solucion.P6))
            tipo: visto
            porque: '10₂6₂ está en la cara CAA′C′ y en la VEF: las dos de delante.'
          - traza: segmento2(figura.punto("A1"), proy_planta(solucion.P1))
            tipo: visto
            porque: 'De A₁ a 1₁: AA′ es contorno de la planta del prisma, y por encima no le pasa nada.'
          - traza: segmento2(proy_planta(solucion.P6), figura.punto("A1p"))
            tipo: visto
            porque: 'De 6₁ a A′₁: AA′ sale por la VEF, que baja hacia ese lado: la arista va por encima de ella.'
          - traza: segmento2(figura.punto("B1"), proy_planta(solucion.P3))
            tipo: visto
            porque: 'De B₁ a 3₁: BB′ es contorno de la planta del prisma, y fuera de la pirámide nada le pasa por encima.'
          - traza: segmento2(proy_planta(solucion.P8), figura.punto("B1p"))
            tipo: visto
            porque: 'De 8₁ a B′₁: BB′ sale por la VFG y sigue por encima de ella, y es contorno de la planta del prisma.'
          - traza: segmento2(figura.punto("C1"), proy_planta(solucion.P4))
            tipo: visto
            porque: 'De C₁ a 4₁: CC′ va por las caras de arriba del prisma, por encima de todo.'
          - traza: segmento2(proy_planta(solucion.P10), figura.punto("C1p"))
            tipo: visto
            porque: 'De 10₁ a C′₁: CC′ sale por la VEF, y es la arista de arriba del prisma.'
          - traza: segmento2(figura.punto("A1p"), figura.punto("B1p"))
            tipo: oculto
            porque: 'A′₁B′₁: el lado de la base de abajo que queda bajo el cuerpo del prisma, que baja hacia él desde arriba.'
          - traza: segmento2(figura.punto("B1p"), figura.punto("C1p"))
            tipo: visto
            porque: 'B′₁C′₁: acaba la cara BCC′B′, una de las de arriba: desde arriba se ve.'
          - traza: segmento2(figura.punto("C1p"), figura.punto("A1p"))
            tipo: visto
            porque: 'C′₁A′₁: acaba la cara CAA′C′, una de las de arriba: desde arriba se ve.'
          - traza: segmento2(figura.punto("A1"), figura.punto("B1"))
            tipo: visto
            porque: 'A₁B₁: un lado de la base de arriba del prisma, fuera de la planta de la pirámide: nada le pasa por encima.'
          - traza: segmento2(figura.punto("B1"), figura.punto("C1"))
            tipo: visto
            porque: 'B₁C₁: un lado de la base de arriba del prisma: nada le pasa por encima.'
          - traza: segmento2(figura.punto("C1"), figura.punto("A1"))
            tipo: visto
            porque: 'C₁A₁: un lado de la base de arriba del prisma: nada le pasa por encima.'
          - traza: segmento2(figura.punto("V1"), proy_planta(solucion.P5))
            tipo: visto
            porque: 'De V₁ a 5₁: VD va por encima del prisma hasta que entra en él: nada la tapa.'
          - traza: segmento2(proy_planta(solucion.P2), figura.punto("D1"))
            tipo: oculto
            porque: 'De 2₁ a D₁: VD ya está por debajo del prisma, que le pasa por encima.'
          - traza: segmento2(figura.punto("V1"), proy_planta(solucion.P9))
            tipo: visto
            porque: 'De V₁ a 9₁: VF va por encima del prisma hasta que entra en él: nada la tapa.'
          - traza: segmento2(proy_planta(solucion.P7), figura.punto("F1"))
            tipo: oculto
            porque: 'De 7₁ a F₁: VF ya está por debajo del prisma, que le pasa por encima.'
          - traza: segmento2(figura.punto("D1"), solucion.k_DE_A1)
            tipo: oculto
            porque: 'De D₁ al cruce con A₁A′₁: D₁ queda bajo la planta del prisma, que pasa por encima de ese trozo de base.'
          - traza: segmento2(solucion.k_DE_A1, figura.punto("E1"))
            tipo: visto
            porque: 'Del cruce con A₁A′₁ a E₁: DE sale de debajo del prisma, y es contorno de la planta de la pirámide.'
          - traza: segmento2(figura.punto("E1"), solucion.k_EF_A1)
            tipo: visto
            porque: 'De E₁ al cruce con A₁A′₁: EF aún no ha llegado bajo el prisma.'
          - traza: segmento2(solucion.k_EF_A1, figura.punto("F1"))
            tipo: oculto
            porque: 'Del cruce con A₁A′₁ a F₁: el prisma pasa por encima de ese trozo de base.'
          - traza: segmento2(figura.punto("F1"), solucion.k_FG_B1)
            tipo: oculto
            porque: 'De F₁ al cruce con B₁B′₁: F₁ queda bajo la planta del prisma.'
          - traza: segmento2(solucion.k_FG_B1, figura.punto("G1"))
            tipo: visto
            porque: 'Del cruce con B₁B′₁ a G₁: FG sale de debajo del prisma.'
          - traza: segmento2(figura.punto("G1"), solucion.k_GD_B1)
            tipo: visto
            porque: 'De G₁ al cruce con B₁B′₁: GD aún no ha llegado bajo el prisma.'
          - traza: segmento2(solucion.k_GD_B1, figura.punto("D1"))
            tipo: oculto
            porque: 'Del cruce con B₁B′₁ a D₁: el prisma pasa por encima de ese trozo de base.'
          - traza: segmento2(proy_planta(solucion.P1), proy_planta(solucion.P2))
            tipo: oculto
            porque: '1₁2₁ está en la cara ABB′A′, la de abajo del prisma.'
          - traza: segmento2(proy_planta(solucion.P2), proy_planta(solucion.P3))
            tipo: oculto
            porque: '2₁3₁ está en la cara ABB′A′, la de abajo del prisma.'
          - traza: segmento2(proy_planta(solucion.P3), proy_planta(solucion.P4))
            tipo: visto
            porque: '3₁4₁ está en la cara BCC′B′, de arriba, y en la VGD, que también mira hacia arriba.'
          - traza: segmento2(proy_planta(solucion.P4), proy_planta(solucion.P5))
            tipo: visto
            porque: '4₁5₁ está en la cara CAA′C′, de arriba, y en la VGD.'
          - traza: segmento2(proy_planta(solucion.P5), proy_planta(solucion.P1))
            tipo: visto
            porque: '5₁1₁ está en la cara CAA′C′, de arriba, y en la VDE.'
          - traza: segmento2(proy_planta(solucion.P6), proy_planta(solucion.P7))
            tipo: oculto
            porque: '6₁7₁ está en la cara ABB′A′, la de abajo del prisma.'
          - traza: segmento2(proy_planta(solucion.P7), proy_planta(solucion.P8))
            tipo: oculto
            porque: '7₁8₁ está en la cara ABB′A′, la de abajo del prisma.'
          - traza: segmento2(proy_planta(solucion.P8), proy_planta(solucion.P9))
            tipo: visto
            porque: '8₁9₁ está en la cara BCC′B′, de arriba, y en la VFG.'
          - traza: segmento2(proy_planta(solucion.P9), proy_planta(solucion.P10))
            tipo: visto
            porque: '9₁10₁ está en la cara BCC′B′, de arriba, y en la VEF.'
          - traza: segmento2(proy_planta(solucion.P10), proy_planta(solucion.P6))
            tipo: visto
            porque: '10₁6₁ está en la cara CAA′C′, de arriba, y en la VEF.'
        trazado:
          - segmento2(solucion.W1, solucion.L_a1)
          - segmento2(solucion.W1, solucion.L_b3)
          - segmento2(figura.punto("V1"), solucion.a1)
          - segmento2(figura.punto("V1"), solucion.a6)
          - segmento2(figura.punto("V1"), solucion.b3)
          - segmento2(figura.punto("V1"), solucion.b8)
          - segmento2(solucion.W1, figura.punto("D1"))
          - segmento2(solucion.W1, figura.punto("F1"))
          - segmento2(figura.punto("V2"), solucion.c4a)
          - segmento2(figura.punto("V2"), solucion.c10a)
          - segmento2(figura.punto("V2"), solucion.W2)
          - segmento2(figura.punto("V1"), solucion.W1)
        construccion:
          - con: regla
            traza: '[segmento2(figura.punto("A2"), figura.punto("A2p")), segmento2(figura.punto("B2"), figura.punto("B2p")), segmento2(figura.punto("C2"), figura.punto("C2p"))]'
            porque: |
              **Las aristas del prisma, en el alzado.** Completas, con trazo fino: la lámina las trae cortadas, y solo se pasa a limpio lo que queda fuera de la pirámide.
          - con: regla
            traza: '[segmento2(figura.punto("A1"), figura.punto("A1p")), segmento2(figura.punto("B1"), figura.punto("B1p")), segmento2(figura.punto("C1"), figura.punto("C1p"))]'
            porque: |
              Las mismas aristas en la planta, completas y finas. Fíjate: C₁C′₁ pasa por V₁.
          - con: regla
            traza: segmento2(figura.punto("C2p"), solucion.L_W2)
            porque: |
              **El punto W.** La recta de la base, en el alzado, prolongada hacia la derecha hasta pasar donde caerá W₂.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("V2"), solucion.L_W2v)
            guia: segmento2(figura.punto("A2"), figura.punto("A2p"))
            porque: |
              Por V₂, la paralela a las aristas del prisma, hasta la recta de la base: es la recta de todos los planos auxiliares, los que pasan por V y son paralelos a las aristas.
          - con: marca
            traza: solucion.W2
            rotulo: W₂
            porque: |
              W₂, donde esa paralela corta la recta de la base. Nombre nuestro: W es donde esa recta perfora el plano de la base.
          - con: escuadra-cartabon
            traza: segmento2(solucion.W2, solucion.L_W1)
            porque: |
              Por W₂, la vertical hacia la planta.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("V1"), solucion.L_W1v)
            guia: segmento2(figura.punto("A1"), figura.punto("A1p"))
            porque: |
              Por V₁, la paralela a las aristas del prisma en la planta, hasta la vertical de W₂.
          - con: marca
            traza: solucion.W1
            rotulo: W₁
            porque: |
              W₁, donde se cortan. Toda traza de un plano auxiliar, en la base, pasa por W₁.
          - con: regla
            traza: segmento2(solucion.W1, solucion.L_a1)
            porque: |
              **AA′.** La traza de su plano auxiliar, de W₁ por A′₁, hasta cortar los lados de la base: E₁F₁ y D₁E₁.
          - con: marca
            traza: solucion.a6
            porque: |
              El corte de la traza con E₁F₁. Sin rótulo: es un punto de paso.
          - con: marca
            traza: solucion.a1
            porque: |
              El corte de la traza con D₁E₁. Sin rótulo: es un punto de paso.
          - con: regla
            traza: segmento2(figura.punto("V1"), solucion.a1)
            porque: |
              De V₁ a ese punto de D₁E₁: es la recta en que el plano auxiliar corta la cara VDE.
          - con: marca
            traza: proy_planta(solucion.P1)
            rotulo: 1₁
            porque: |
              1₁, donde esa recta corta A₁A′₁: AA′ entra por la cara VDE. Los números 1 a 10 son nombres nuestros.
          - con: regla
            traza: segmento2(figura.punto("V1"), solucion.a6)
            porque: |
              De V₁ al punto de E₁F₁: la recta en que el plano auxiliar corta la cara VEF.
          - con: marca
            traza: proy_planta(solucion.P6)
            rotulo: 6₁
            porque: |
              6₁, donde esa recta corta A₁A′₁: AA′ sale por la cara VEF.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(solucion.P1), proy_alzado(solucion.P1)), segmento2(proy_planta(solucion.P6), proy_alzado(solucion.P6))]'
            porque: |
              Por 1₁ y 6₁, las verticales hasta A₂A′₂.
          - con: marca
            traza: proy_alzado(solucion.P1)
