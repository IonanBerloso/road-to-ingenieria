      - tipo: calcular
        titulo: Lo que de VD queda dentro del prisma
        pregunta: Como pregunta nuestra, ¿cuánto mide de verdad el trozo de la arista VD que queda dentro del prisma, en metros?
        respuesta:
          tipo: numero
          valor: '1.15'
          receta: vd_dentro
          tolerancia: 0.05
          formato: un número, en metros
        distractores:
          - valor: '0.52'
            receta: en_mm(vm_planta(P5, P2)) / 10
            mensaje: |
              Eso es **5₁2₁ en la planta**. VD baja de 5 a 2, y la planta la acorta. La verdadera magnitud sale del
              triángulo: la planta de un cateto y la diferencia de cotas del otro.
          - valor: '1.02'
            receta: en_mm(diferencia_de_cotas(P5, P2)) / 10
            mensaje: |
              Eso es la **diferencia de cotas** de 5 y 2, un cateto del triángulo. Falta el otro, la planta 5₁2₁.
          - valor: '11.46'
            receta: en_mm(vm(P5, P2))
            mensaje: |
              Eso es lo que mide en la lámina, en milímetros. El dibujo está a 1:100: cada milímetro son 0,1 m.
        pista: |
          Con la planta 5₁2₁ de un cateto y la diferencia de cotas de 5₂ y 2₂ del otro, la hipotenusa es la verdadera
          magnitud. A 1:100, divide los milímetros entre 10.
        desarrollo: |
          Con el triángulo de la verdadera magnitud:

          $$ \overline{52} = \sqrt{\overline{5_1 2_1}^{\,2} + \Delta z^{2}} = \sqrt{5{,}17^{2} + 10{,}23^{2}} \approx 11{,}46 \text{ mm} $$

          A 1:100, 1,15 m. En el dibujo hay una medida que cae dentro de la tolerancia casi por casualidad: 5₂2₂, en el
          alzado, 11,39 mm. VD casi es frontal, porque su planta solo forma 15° con la horizontal, pero no lo es del todo.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: Los planos por V paralelos a las aristas contienen la paralela a las aristas por V, y sus trazas en el plano de la base pasan por W₁.
          - texto: La traza del plano de cada arista corta dos lados del cuadrado, y unidos con V₁ dan en la arista la entrada y la salida.
          - texto: VD y VF también atraviesan el prisma, y la traza de su plano, de W₁ a D₁ o a F₁, corta el triángulo A′₁B′₁C′₁, de donde sale la paralela a las aristas.
          - texto: Salen dos poligonales, y se ve lo que va por las caras que miran a quien mira; lo que queda dentro del otro sólido no se dibuja.
          - texto: Cada arista del prisma entra en la pirámide donde su planta cruza el contorno de la base, porque la base de abajo del prisma está en ese plano.
            trampa: true
            mensaje: |
              El contorno de la base está a la altura de la base, y las aristas del prisma entran más arriba, donde la
              pirámide es más estrecha. Que la base del prisma esté en ese plano sirve para las trazas, no para esto.
    resolucion: |
      **El plano auxiliar.** Cada arista oblicua se corta con la pirámide con un plano que la contenga y pase por V. Ese
      plano la corta en dos rectas que salen de V. Todos esos planos contienen la paralela a las aristas por V, que
      perfora el plano de la base en W. La base del prisma está en ese mismo plano, y las trazas salen de W₁ por A′₁, por
      B′₁ y por C′₁.

      **AA′ y BB′.** Cada traza corta dos lados del cuadrado: unidos con V₁, dan 1 y 6 en A₁A′₁, y 3 y 8 en B₁B′₁. Sus
      verticales los llevan al alzado.

      **CC′.** C₁C′₁ pasa por V₁, así que su plano es vertical y en la planta todo se confunde. Se sube a la recta de la
      base lo que corta en G₁D₁ y E₁F₁, se une con V₂, y C₂C′₂ da 4 y 10. Sus verticales los bajan a la planta.

      **VD y VF.** Atraviesan el prisma. La traza de W₁ a D₁ corta A′₁C′₁ y A′₁B′₁; las paralelas a las aristas dan 5 y 2 en
      V₁D₁. La de W₁ a F₁ corta B′₁C′₁ y A′₁B′₁, y dan 9 y 7 en V₁F₁. VE y VG no se cortan.

      **Lo que se ve.** Hay dos poligonales, 1 2 3 4 5 y 6 7 8 9 10. En el alzado se ve lo que va por CAA′C′, la cara de
      delante del prisma, y a la vez por una cara de delante de la pirámide: 5₂1₂ y 10₂6₂. En la planta se oculta lo que va por la ABB′A′, la de abajo. Leemos los dos sólidos como
      una sola pieza: lo que de una arista queda dentro del otro no se dibuja. Con los dos sólidos por separado, esos
      trozos irían a trazos.
