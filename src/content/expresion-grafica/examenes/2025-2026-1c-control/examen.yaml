# El examen de diédrico del primer bloque, de Ingeniería Industrial, Modelo A: lo
# puso el departamento en la carpeta «dibujo» que llegó el 2 de noviembre de 2026.
# Son dos PDF, enunciado (dos páginas A4, bilingüe) y láminas (dos A3); aquí van
# unidos en uno, sin metadatos de autor, cada página comparada píxel a píxel.
#
# Tres cosas, dichas antes de que nadie las deduzca:
#
# 1. **LA FECHA ES LA DEL ENUNCIADO.** El enunciado y el nombre del fichero dicen
#    2025/11/24; el cajetín de las láminas dice 2024/11/25, que no encaja con el
#    curso. Manda el enunciado.
#
# 2. **LAS LÁMINAS NUMERAN MAL LOS APARTADOS.** La figura 2 dice «Apartado 3»,
#    pero es la del 2, y la figura 3 dice «Apartados 4 y 5», pero es la del 3, el 4
#    y el 5. Se sigue el enunciado.
#
# 3. **SOLO ESTÁ EL MODELO A.** Si hubo otros, no están en el material.
#
# La convocatoria: el fichero se llama «ohiko azterketa» (examen ordinario), pero
# es de noviembre, y solo entra diédrico. Es el control del primer bloque.
pdf: 2025-2026-1c-control.pdf
duracion:
  minutos: 80
  impresa: false
  fuente: dato de quien mantiene el proyecto, 9 de octubre de 2026, de unos 40 minutos por cada lámina A3 del examen; este tiene dos, y no imprime su duración
puntosImpresos:
  fuente: >-
    impresos junto a cada apartado del enunciado: «1,5 puntos» en los apartados 1
    a 4 y «4 puntos» en el 5
  reparto:
    - { n: 1, puntos: 1.5 }
    - { n: 2, puntos: 1.5 }
    - { n: 3, puntos: 1.5 }
    - { n: 4, puntos: 1.5 }
    - { n: 5, puntos: 4 }

