        veredicto: >-
          Si tu dibujo tiene ocultas FH, HE y VH en la planta, y en el alzado VE y lo que
          queda dentro de la lámina, la visibilidad está bien. Si has tomado ABCD como un
          plano transparente, en el alzado solo VE va oculta: la hoja no lo precisa, y aquí
          se toma opaca.

      - tipo: calcular
        titulo: La altura
        pregunta: La altura de la pirámide.
        respuesta:
          tipo: numero
          valor: '108.03'
          receta: altura_mm
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '54.02'
            receta: en_mm(vm(B, C))
            mensaje: |
              Eso es BC, sin doblar; y también lo que sale doblando B₂C₂ del alzado, que es la
              mitad de BC. BC es horizontal: su longitud está en la planta, B₁C₁, y la altura es
              el doble.
          - valor: '111.74'
            receta: en_mm(vm(solucion.V, E))
            mensaje: |
              Esa es una **arista lateral**, de V a un vértice de la base. La altura es la
              distancia de V al plano de la base, por la perpendicular al centro.
        pista: |
          BC es horizontal —B₂C₂ es horizontal en el alzado—, así que se ve en verdadera
          magnitud en la planta. La altura es el doble.
        desarrollo: |
          $$ h = 2\,\overline{BC} = 2\,\overline{B_1C_1} = 2 \cdot 54{,}016 \approx 108{,}03 \text{ mm} $$

      - tipo: calcular
        titulo: El lado de la base
        pregunta: El lado de la base cuadrada, en verdadera magnitud.
        respuesta:
          tipo: numero
          valor: '40.37'
          receta: lado_mm
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '57.10'
            receta: en_mm(vm(E, F))
            mensaje: |
              Esa es la **diagonal** EF, en verdadera magnitud. El lado es la diagonal partida
              por raíz de dos.
          - valor: '34.73'
            receta: en_mm(vm_planta(E, solucion.G))
            mensaje: |
              Eso es lo que mide **E₁G₁ en la planta**. El lado EG no es horizontal, y la planta
              lo acorta.
          - valor: '39.09'
            receta: en_mm(vm_planta(solucion.G, F))
            mensaje: |
              Eso es lo que mide **G₁F₁ en la planta**: se parece al lado, pero GF no es
              horizontal y la planta la acorta.
          - valor: '26.68'
            receta: en_mm(vm_alzado(E, solucion.G))
            mensaje: |
              Eso es lo que mide **E₂G₂ en el alzado**, que también acorta: EG no es frontal.
        pista: |
          Con el plano en verdadera magnitud, EF es la diagonal del cuadrado: el lado es EF
          partido por raíz de dos.
        desarrollo: |
          $$ \ell = \frac{\overline{EF}}{\sqrt{2}} = \frac{57{,}095}{\sqrt{2}} \approx 40{,}37 \text{ mm} $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: 'AD y BC son horizontales del plano: con un cambio de plano perpendicular a A₁D₁ el plano queda de canto, o se abate con charnela AD.'
          - texto: Con el plano en verdadera magnitud se dibuja el cuadrado de diagonal EF, y G y H se devuelven a las dos vistas.
          - texto: BC es horizontal, así que su longitud se mide en la planta, y la altura es el doble, 108,03 mm.
          - texto: V está en la perpendicular al plano por el centro de la base, del lado de mayor cota.
          - texto: El cuadrado se dibuja en la planta sobre E₁F₁, porque la planta da EF casi en verdadera magnitud.
            trampa: true
            mensaje: |
              Casi no basta: E₁F₁ mide 56,12 mm y EF, 57,10. Y sobre todo, el ángulo recto de las
              diagonales solo se vería recto en la planta si una de las dos fuera horizontal, y
              ninguna lo es: en la planta forman unos 83°. Además G₁H₁ sale aún más corta,
              48,16 mm. El cuadrado dibujado en la planta no está en el plano.

    resolucion: |
      **El plano.** A₂D₂ y B₂C₂ son horizontales: AD y BC son horizontales del plano ABCD, y en
      la planta A₁D₁ y B₁C₁ son paralelas. El plano es oblicuo, y ni la planta ni el alzado
      lo dan en verdadera magnitud.

      **La base.** Con un cambio de plano de línea de tierra perpendicular a A₁D₁ el plano queda
      de canto —basta uno, porque AD es horizontal—, y con otro, o abatiéndolo con charnela
      AD, en verdadera magnitud. Ahí EF mide 57,10 mm, y el cuadrado tiene la otra diagonal
      perpendicular a EF por su punto medio O, del mismo largo: el lado mide 40,37 mm. G y H
      se devuelven a las dos vistas; en la planta, cada uno sobre su horizontal del plano.
      Llamamos G al de mayor cota y H al de menor. Los dos caen fuera de la lámina ABCD: G al
      otro lado de AD y H al otro lado de BC.

      **La altura y el vértice.** BC es horizontal, y su longitud se mide en la planta: 54,02 mm.
      La altura es el doble, 108,03 mm. V está en la perpendicular al plano por O —en la
      planta, perpendicular a A₁D₁; en el alzado, perpendicular a las frontales— y del lado de
      mayor cota, que es el de arriba. En la vista con el plano de canto la perpendicular está
      en verdadera magnitud, y ahí se lleva la altura. La de menor cota tendría el vértice
      abajo, fuera del marco de la hoja.

      **La visibilidad.** En la planta se ven las caras que miran hacia arriba: V₁ cae fuera de la
      base y H₁ queda dentro del contorno, así que FH, HE y VH van ocultas, y la pirámide tapa
      parte de los bordes B₁C₁ y D₁A₁ de la lámina. En el alzado, el lado de mayor cota del
      plano mira hacia atrás, y la pirámide queda detrás de la lámina: con la lámina opaca, lo
      que de la pirámide cae dentro de A₂B₂C₂D₂ va oculto, y VE queda además detrás de la cara
      VGF. Si se toma el plano como transparente, en el alzado solo VE va oculta.

  # ── 3 · Las dos tuberías. Lo que enseña: el lugar de los puntos que
  #    equidistan de dos puntos es el plano mediador, no la mediatriz de una
  #    proyección; y un punto de una recta en un plano sale por intersección.
  - id: exeg-h55-3-dos-tuberias-iguales-hasta-el-colector
    titulo: Dos tuberías de igual longitud hasta un colector
    fuente: >-
      Ejercicio 55, apartado 3 · Colección de ejercicios de Geometría
      Descriptiva, Sistema Diédrico Directo · Dpto. de Expresión Gráfica y
      Proyectos de Ingeniería, EIG · UPV/EHU. El 55 (págs. 64-66; este
      apartado, en las 64 y 66) es uno de los cuatro ejercicios de varios
      apartados con que cierra la colección, todos sin fecha, y de ellos solo el
      54 se titula «Examen». Se transcribe el castellano; la figura se redibuja
      desde sus coordenadas.
    nivel: examen
    # Decisión: el castellano de la pág. 64 tal cual, sin el «3.». La «Nota:»
    # impresa va entera a `notas` (§04), con su frase en negrita.
    enunciado: |
      Se desean unir dos depósitos de agua representados por los puntos A y B, mediante sendas tuberías rectas de igual longitud, que concurran en un punto P del colector definido por la recta r.

      Dibujar las proyecciones diédricas de las dos tuberías.

      **Notas nuestras.** La figura es la mitad derecha de la tercera página del
      Ejercicio 55: los depósitos A y B, dados por sus cruces, y el colector r, en
      alzado (arriba) y en planta (abajo). La hoja no da escala para este
      apartado: las longitudes se dan en milímetros de la lámina.
    notas:
      - >-
        Nota: Para que dos segmentos (tuberías) tengan la misma longitud y se
        unan en un punto común sobre una recta (punto P), ese punto debe cumplir
        con una condición de equidistancia respecto a los puntos A y B. **Esto
        significa que la solución se encuentra en la intersección entre la recta
        r y un plano equidistante a los puntos A y B.**
    pide: El punto P del colector en las dos vistas, y lo que mide cada tubería.
    receta:
      lamina: ex55-3
      escena:
        A: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("A1"))'
        B: 'punto3(alzado: figura.punto("B2"), planta: figura.punto("B1"))'
        r: 'recta3(alzado: figura.segmento("r2"), planta: figura.segmento("r1"))'
      solucion:
        mediador: plano_mediador(A, B)
        P: corte_recta_plano(r, mediador)
        largo_mm: en_mm(vm(P, A))
        # Los errores: la mediatriz de A₁B₁ en la planta (el plano mediador de A
        # y de B llevado a la cota de A, que es vertical) y la de A₂B₂ en el
        # alzado (B llevado al alejamiento de A: el plano es de canto).
        horizontal_A: 'plano(A, punto3(alzado: figura.punto("A2"), planta: desplaza(figura.punto("A1"), dy: 10)), punto3(alzado: desplaza(figura.punto("A2"), dx: 10), planta: desplaza(figura.punto("A1"), dx: 10)))'
        B_a_cota_de_A: 'punto_en_plano(planta: figura.punto("B1"), plano: horizontal_A)'
        P_mediatriz_planta: corte_recta_plano(r, plano_mediador(A, B_a_cota_de_A))
        frontal_A: 'plano(A, punto3(alzado: desplaza(figura.punto("A2"), dy: -10), planta: figura.punto("A1")), punto3(alzado: desplaza(figura.punto("A2"), dx: 10), planta: desplaza(figura.punto("A1"), dx: 10)))'
        B_a_alejamiento_de_A: 'punto_en_plano(alzado: figura.punto("B2"), plano: frontal_A)'
        P_mediatriz_alzado: corte_recta_plano(r, plano_mediador(A, B_a_alejamiento_de_A))
        pie_desde_M: pie_perpendicular(punto_medio(segmento3(A, B)), r)
      comprueba:
        - en_plano(P, mediador)
        - en_recta(P, r)
    pasos:
      - tipo: reconocer
        pregunta: ¿Dónde están los puntos del espacio que equidistan de A y de B?
        opciones:
          - texto: En el plano mediador de AB, perpendicular a AB por su punto medio
            correcta: true
            mensaje: |
              Eso es: es lo que dice la nota del enunciado con otras palabras. P está en ese plano
              y en r, así que es el corte de los dos.
          - texto: En la mediatriz de A₁B₁, dibujada en la planta
            mensaje: |
              Esa mediatriz es la traza del plano vertical que equidista de las **plantas** de A y
              de B, y solo coincide con el plano mediador si AB es horizontal. Aquí A y B tienen
              distinta cota.
          - texto: En la recta AB, a mitad de camino
            mensaje: |
              En AB solo hay un punto que equidiste de A y de B, el punto medio. Los demás están
              fuera de AB: forman un plano, perpendicular a AB por ese punto medio.

      - tipo: construir
        titulo: El punto P
        intro: |
          Marca P, el punto del colector r que equidista de A y de B, en el alzado y en la
          planta. Las tuberías son PA y PB.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, borrar]
        tolerancia: 1
        objetivos:
          - nombre: P2
            pide: el punto P del colector, en el alzado
            es: proy_alzado(solucion.P)
            bien: |
              P₂ está en r₂, donde r corta al plano mediador de AB.
            diagnosticos:
              - si: cerca_de(proy_alzado(solucion.P_mediatriz_alzado))
                mensaje: |
                  Has cortado r₂ con la mediatriz de A₂B₂, dibujada en el alzado. El plano mediador
                  no se ve así: A₂B₂ no está en verdadera magnitud, porque AB no es frontal. El
                  plano mediador se da por una horizontal y una frontal por el punto medio de AB.
                ejemplo: proy_alzado(solucion.P_mediatriz_alzado)
              - si: cerca_de(proy_alzado(solucion.pie_desde_M))
                mensaje: |
                  Ese es el punto de r más cercano al punto medio de AB. P no es el más cercano:
                  es el que está a la misma distancia de A que de B, el corte de r con el plano
                  mediador.
                ejemplo: proy_alzado(solucion.pie_desde_M)
              - si: en_recta(figura.segmento("r2"))
                mensaje: |
                  P está en r, pero en un punto concreto: donde r corta al plano mediador de AB.
                  El corte se encuentra con un plano auxiliar proyectante que contenga a r.
                ejemplo: pie_perpendicular(figura.punto("A2"), figura.segmento("r2"))
              - si: siempre
                mensaje: |
                  P es un punto de r: P₂ tiene que estar en r₂, donde r corta al plano mediador.
          - nombre: P1
            pide: el punto P del colector, en la planta
            es: proy_planta(solucion.P)
            bien: |
              P₁ está en r₁, en la vertical de P₂.
            diagnosticos:
              - si: cerca_de(proy_planta(solucion.P_mediatriz_planta))
                mensaje: |
                  Has cortado r₁ con la mediatriz de A₁B₁, dibujada en la planta. Eso solo valdría
                  si AB fuera horizontal: A y B tienen distinta cota, y la planta acorta AB.
                ejemplo: proy_planta(solucion.P_mediatriz_planta)
              - si: cerca_de(proy_planta(solucion.pie_desde_M))
                mensaje: |
                  Ese es el punto de r más cercano al punto medio de AB, y no el que equidista de A
                  y de B.
                ejemplo: proy_planta(solucion.pie_desde_M)
              - si: '!en_vertical_de(P2)'
                mensaje: |
                  P₁ va en la **vertical de P₂**: son el mismo punto visto dos veces.
                ejemplo: 'desplaza(proy_planta(solucion.P), dx: mm(8))'
              - si: siempre
                mensaje: |
                  Si ya tienes P₂: P₁ está en su vertical, sobre r₁.
        trazado:
          - proy_alzado(segmento3(A, solucion.P))
          - proy_alzado(segmento3(B, solucion.P))
          - proy_planta(segmento3(A, solucion.P))
          - proy_planta(segmento3(B, solucion.P))
        pista: |
          (1) El punto medio M de AB, en las dos vistas. (2) El plano mediador, por una
          horizontal y una frontal que pasen por M: la horizontal, perpendicular a A₁B₁ en la
          planta; la frontal, perpendicular a A₂B₂ en el alzado. (3) El corte de r con ese
          plano, con un plano auxiliar proyectante que contenga a r: ahí está P.
        desarrollo: |
          En verde claro, las dos tuberías PA y PB en las dos vistas. P queda casi a mitad del
          tramo de r dibujado.

      - tipo: calcular
        titulo: Lo que mide cada tubería
        pregunta: Las dos tuberías miden lo mismo. ¿Cuánto, en milímetros de la lámina?
        respuesta:
          tipo: numero
          valor: '49.02'
          receta: largo_mm
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '33.58'
            receta: en_mm(vm_alzado(solucion.P, A))
            mensaje: |
              Eso es lo que mide **P₂A₂ en el alzado**. PA cambia mucho de alejamiento —casi
              36 mm— y apenas de cota: no es frontal, y el alzado la acorta. Hace falta su
              verdadera magnitud.
          - valor: '17.17'
            receta: en_mm(vm_planta(solucion.P, B))
            mensaje: |
              Eso es lo que mide **P₁B₁ en la planta**. PB sube mucho, y la planta la acorta.
        pista: |
          Es la verdadera magnitud de PA, o de PB, que sale igual: abate uno de los dos
          segmentos, con su planta y su diferencia de cotas.
        desarrollo: |
          $$ \overline{PA} = \overline{PB} \approx 49{,}02 \text{ mm} $$

          PA es casi horizontal y PB casi frontal, así que P₁A₁ (48,85 mm) y P₂B₂ (48,84 mm)
          miden casi lo mismo que la verdadera magnitud: es una casualidad de esta figura.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: Los puntos que equidistan de A y de B forman el plano mediador de AB, perpendicular a AB por su punto medio.
          - texto: 'El plano mediador se da por una horizontal y una frontal por el punto medio: la horizontal, perpendicular a A₁B₁ en la planta, y la frontal, perpendicular a A₂B₂ en el alzado.'
          - texto: P es el corte de r con ese plano, y se encuentra con un plano auxiliar proyectante que contenga a r.
          - texto: Las tuberías son PA y PB, y miden lo mismo, 49,02 mm.
          - texto: P está donde la mediatriz de A₁B₁ corta a r₁ en la planta.
            trampa: true
            mensaje: |
              Eso valdría si AB fuera horizontal. A y B tienen distinta cota, y esa mediatriz
              corta a r en otro punto, a unos 36 mm del bueno en la planta.

    resolucion: |
      **Dónde está P.** P está a la misma distancia de A que de B, así que está en el plano
      mediador de AB, el perpendicular a AB por su punto medio M. Y está en r. Es el corte de
      r con ese plano, que es lo que dice la nota del enunciado.

      **El plano mediador.** Se da por dos rectas suyas que pasan por M. Su horizontal es
      perpendicular a AB, y el ángulo recto se ve en la planta, donde ella está en verdadera
      magnitud: perpendicular a A₁B₁ por M₁. Su frontal, igual en el alzado: perpendicular a
      A₂B₂ por M₂.

      **El corte con r.** El plano vertical que contiene a r corta al plano mediador en una
      recta; su alzado corta a r₂ en P₂, y P₁ baja por la vertical hasta r₁. P queda casi a
      mitad del tramo de r dibujado.

      **Las tuberías.** PA y PB miden lo mismo, 49,02 mm en verdadera magnitud. PA es casi
      horizontal y PB casi frontal, así que P₁A₁ y P₂B₂ salen casi iguales a esa cifra, pero
      es una casualidad de la figura: P₂A₂ mide 33,58 mm y P₁B₁, 17,17 mm.

      **Lo que no es P.** La mediatriz de A₁B₁ en la planta solo equidista de las plantas: daría
      un punto de r a unos 36 mm del bueno. Y el punto de r más cercano a M tampoco es P.
