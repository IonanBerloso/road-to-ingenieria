ejercicios:
  # ── 1 a y b · El prisma de bases horizontales. Lo que enseña: α no pide
  #    abatir nada, porque AB y BC están en un plano horizontal; β sí, porque
  #    BB′ no está en verdadera magnitud en ninguna vista.
  - id: exeg-h55-1ab-dos-angulos-del-prisma-oblicuo
    titulo: Dos ángulos de un prisma oblicuo, y cuál de los dos pide abatir
    fuente: >-
      Ejercicio 55, apartado 1 (a y b) · Colección de ejercicios de Geometría
      Descriptiva, Sistema Diédrico Directo · Dpto. de Expresión Gráfica y
      Proyectos de Ingeniería, EIG · UPV/EHU. El 55 (págs. 64-66; este
      apartado, en las 64 y 65) es uno de los cuatro ejercicios de varios
      apartados con que cierra la colección, todos sin fecha, y de ellos solo el
      54 se titula «Examen». Se transcribe el castellano; la figura se redibuja
      desde sus coordenadas.
    nivel: examen
    # Decisión: el castellano de la pág. 64 tal cual, con la cabecera del
    # apartado 1 en las dos piezas y sin su «1.» (el número lo dice la fuente,
    # y un «1.» a principio de línea el Markdown lo convierte en lista). Las
    # primas van como ′: la capa de texto las guarda como ’, pero la página
    # dibuja una prima. α, β, d y t van en $…$ porque la hoja los compone como
    # variables, en cursiva. El volcado pone «(α )» con un espacio que la
    # página no tiene.
    enunciado: |
      En la figura en escala 1:1 que se muestra, se pide determinar gráficamente:

      a. El ángulo entre las rectas AB y BC ($\alpha$).

      b. El ángulo entre el plano A′B′C′ y la recta BB′ ($\beta$).

      **Notas nuestras.** La figura es la de arriba de la segunda página del
      Ejercicio 55: un prisma triangular, con las bases ABC y A′B′C′ y las aristas
      laterales AA′, BB′ y CC′, en alzado (arriba) y en planta (abajo). La hoja
      dibuja todas las aristas en continua; en la planta, A′₁C′₁ quedaría oculta.
      La hoja trae arriba a la derecha una casilla para escribir $\alpha$,
      $\beta$, $d$ y $t$. Escala 1:1 quiere decir que lo que mides en la lámina,
      en milímetros, es el resultado. La hoja no dice cuál de los dos ángulos
      suplementarios que forman AB y BC es $\alpha$: aquí se da el menor, que es
      el convenio del ángulo entre dos rectas; el del triángulo en B es su
      suplementario.
    pide: El ángulo α entre AB y BC y el ángulo β de la arista BB′ con la base A′B′C′, en grados, con el abatimiento que da β.
    receta:
      lamina: ex55-1ab
      escena:
        A: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("A1"))'
        B: 'punto3(alzado: figura.punto("B2"), planta: figura.punto("B1"))'
        C: 'punto3(alzado: figura.punto("C2"), planta: figura.punto("C1"))'
        Ap: 'punto3(alzado: figura.punto("A2p"), planta: figura.punto("A1p"))'
        Bp: 'punto3(alzado: figura.punto("B2p"), planta: figura.punto("B1p"))'
        Cp: 'punto3(alzado: figura.punto("C2p"), planta: figura.punto("C1p"))'
        base_inferior: plano(Ap, Bp, Cp)
      solucion:
        alfa: angulo_rectas(segmento3(A, B), segmento3(B, C))
        beta: angulo_recta_plano(segmento3(B, Bp), base_inferior)
        # El punto con el alzado de B′ y el alejamiento de B: B y él forman un
        # segmento frontal con el mismo alzado que BB′, y su ángulo con el
        # plano horizontal es el que se lee en el alzado (un distractor de β).
        Bp_frontal: 'punto3(alzado: figura.punto("B2p"), planta: pie_perpendicular(figura.punto("B1"), perpendicular(por: figura.punto("B2p"), a: figura.segmento("ApBpCp2"))))'
        # La horizontal por B perpendicular a B₁B′₁ en la planta (la horizontal
        # del plano perpendicular a BB′), y sobre ella los puntos a lo que mide
        # B₂B′₂: el ejemplo del error de llevar el alzado en vez de la
        # diferencia de cotas, por la perpendicular buena.
        horizontal_por_B: horizontal_por(B, plano_perpendicular_a_recta(B, segmento3(B, Bp)))
        B_a_vm_alzado: 'punto_a_distancia(horizontal_por_B, desde: B, distancia: vm_alzado(B, Bp))'
    pasos:
      - tipo: reconocer
        pregunta: A₂, B₂ y C₂ caen en una misma horizontal del alzado. ¿Dónde se mide α, el ángulo entre AB y BC?
        opciones:
          - texto: En la planta, directamente, porque el plano ABC es horizontal y se ve en verdadera magnitud desde arriba
            correcta: true
            mensaje: |
              Eso es. Un ángulo está en verdadera magnitud en la vista donde lo está el plano
              de sus dos rectas, y un plano horizontal lo está en la planta. Se mide en B₁, sin
              construir nada.
          - texto: Abatiendo el plano ABC, porque dos rectas que no son ni horizontales ni frontales no dan su ángulo en ninguna vista
            mensaje: |
              Abatir sirve cuando el plano de las dos rectas está inclinado. Aquí AB y BC son
              horizontales —sus alzados están a la misma altura—, así que el plano ABC ya está
              en verdadera magnitud en la planta: abatirlo sobre un plano horizontal lo deja
              donde está.
          - texto: En el alzado, que es donde se ven A₂, B₂ y C₂
            mensaje: |
              En el alzado el plano ABC se ve **de canto**: A₂, B₂ y C₂ caen en una recta, y el
              ángulo se aplasta a 0° o a 180°. Un plano horizontal, que en el alzado se ve de
              canto, está en verdadera magnitud en la planta.

      - tipo: construir
        titulo: Abatir la arista BB′
        intro: |
          α no necesita construcción: se mide en la planta. Para β, abate sobre la planta el
          plano proyectante de BB′: por B₁ o por B′₁, perpendicular a B₁B′₁, lleva la
          diferencia de cotas de B y B′, que se mide en el alzado, y marca el extremo
          abatido. Vale por cualquiera de los dos extremos y a cualquiera de los dos lados.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, transportador, borrar]
        tolerancia: 1
        objetivos:
          - nombre: BBp
            rotulo: (B) o (B′)
            pide: un extremo de BB′, abatido sobre la planta
            es: '[abatido_planta(Bp, B), abatido_planta(B, Bp)]'
            bien: |
              Ese es un extremo abatido de BB′: la recta que lo une con el otro extremo de la
              planta es BB′ en verdadera magnitud, y el ángulo que forma con B₁B′₁ es β.
            diagnosticos:
              # Decisión: el ejemplo va en cifras (pt) porque la receta no tiene una
              # función que dé un solo extremo abatido sobre el alzado; es el de B′,
              # el único de los cuatro que cae dentro del encuadre. Sale de un
              # cálculo aparte, con álgebra de vectores sobre las coordenadas de la
              # lámina, y tests/geometria/hoja-55.test.ts comprueba ese punto.
              - si: 'cerca_de([abatido_alzado(B, Bp), abatido_alzado(Bp, B)])'
                mensaje: |
                  Has abatido **sobre el alzado**, llevando la diferencia de alejamientos. Ese
                  triángulo da el ángulo de BB′ con el plano vertical. β se mide contra A′B′C′,
                  que es horizontal: el triángulo va en la planta, con la diferencia de cotas.
                ejemplo: 'desplaza(figura.punto("B2p"), dx: -159.91, dy: 64.53)'
              - si: 'a_distancia(de: [figura.punto("B1"), figura.punto("B1p")], d: vm_alzado(B, Bp))'
                mensaje: |
                  Has llevado lo que mide **B₂B′₂ en el alzado**, y el alzado también acorta: BB′
                  no es frontal. El cateto que va en la perpendicular es la **diferencia de
                  cotas** de B y B′, la distancia vertical entre las dos horizontales del alzado.
                ejemplo: proy_planta(rama(solucion.B_a_vm_alzado, 1))
              - si: 'a_distancia(de: [figura.punto("B1"), figura.punto("B1p")], d: diferencia_de_cotas(B, Bp))'
                mensaje: |
                  La distancia es la buena, pero va en la **perpendicular a B₁B′₁**: el triángulo
                  de la verdadera magnitud es rectángulo en el extremo de la planta.
                ejemplo: 'desplaza(figura.punto("B1"), dy: diferencia_de_cotas(B, Bp))'
              - si: 'en_recta(perpendicular(por: figura.punto("B1"), a: figura.segmento("BB1")))'
                mensaje: |
                  Vas por la perpendicular a B₁B′₁ en B₁, pero a otra distancia. Lo que se lleva
                  es la diferencia de cotas de B y B′, que se mide en el alzado entre la
                  horizontal de A₂B₂C₂ y la de A′₂B′₂C′₂.
                ejemplo: 'pie_perpendicular(desplaza(figura.punto("B1"), dx: mm(15)), perpendicular(por: figura.punto("B1"), a: figura.segmento("BB1")))'
              - si: 'en_recta(perpendicular(por: figura.punto("B1p"), a: figura.segmento("BB1")))'
                mensaje: |
                  Vas por la perpendicular a B₁B′₁ en B′₁, pero a otra distancia. Lo que se lleva
                  es la diferencia de cotas de B y B′, que se mide en el alzado entre las dos
                  horizontales de las bases.
                ejemplo: 'pie_perpendicular(desplaza(figura.punto("B1p"), dx: mm(15)), perpendicular(por: figura.punto("B1p"), a: figura.segmento("BB1")))'
              - si: siempre
                mensaje: |
                  El extremo abatido está en la perpendicular a B₁B′₁ por B₁ o por B′₁, a la
                  diferencia de cotas de B y B′.
        pista: |
          (1) En el alzado, mide la diferencia de cotas de B y B′: la distancia entre las dos
          horizontales de las bases. (2) Por B₁ —o por B′₁—, traza la perpendicular a B₁B′₁.
          (3) Lleva sobre ella esa diferencia con el compás: ahí está el extremo abatido.
        desarrollo: |
          El extremo abatido está a 40,39 mm de B₁ (o de B′₁), en la perpendicular a B₁B′₁. Con
          el otro extremo de la planta forma BB′ en verdadera magnitud, 74,82 mm, y el ángulo
          del triángulo en el extremo que no se ha movido es β.

      - tipo: calcular
        titulo: El ángulo α
        # Decisión: dos rectas que se cortan forman dos ángulos suplementarios, y se
        # pide el menor, que es el convenio de «ángulo entre rectas» (y el de
        # angulo_rectas, de 0 a 90°). El ángulo del triángulo en B, 110,77°, va de
        # distractor con un mensaje que reconoce que la construcción es la misma.
        # La hoja no dice cuál de los dos espera el corrector, y el ejercicio lo
        # declara en las «Notas nuestras», en ese mensaje, en la resolución y en
        # el justificar. Es una pregunta abierta para Ionan (tasks/pendiente.md).
        pregunta: α, el ángulo entre las rectas AB y BC; de los dos que forman, el menor.
        respuesta:
          tipo: numero
          valor: '69.23'
          receta: alfa
          tolerancia: 0.5
          formato: un número, en grados
        distractores:
          - valor: '110.77'
            receta: 180 - alfa
            mensaje: |
              Ese es el ángulo del triángulo ABC en B, de B₁A₁ a B₁C₁, y la construcción es la
              buena. La hoja no dice cuál de los dos ángulos suplementarios espera; aquí se pide
              el menor, que es el convenio del ángulo entre dos rectas: 180° − 110,8° = 69,2°.
          - valor: '20.77'
            receta: 90 - alfa
            mensaje: |
              Ese es el **complementario** de α, lo que le falta para 90°. α se mide entre B₁A₁
              y B₁C₁, o sus prolongaciones, no contra la perpendicular a una de ellas.
        pista: |
          AB y BC son horizontales: mide el ángulo en la planta, en B₁. Si sale más de 90°, el
          de las rectas es su suplementario.
        desarrollo: |
          B₁ está en la mediatriz de A₁C₁, 11,98 mm por debajo de ese lado, que mide 34,71 mm,
          así que el triángulo tiene en B un ángulo de $2\arctan\frac{17{,}36}{11{,}98} = 110{,}77^{\circ}$, y las rectas forman
          $$ \alpha = 180^{\circ} - 110{,}77^{\circ} = 69{,}23^{\circ} $$

      - tipo: calcular
        titulo: El ángulo β
        pregunta: β, el ángulo entre el plano A′B′C′ y la recta BB′.
        respuesta:
          tipo: numero
          valor: '32.67'
          receta: beta
          tolerancia: 0.5
          formato: un número, en grados
        distractores:
          - valor: '57.33'
            receta: 90 - beta
            mensaje: |
              Ese es el ángulo de BB′ con la **vertical**, la perpendicular al plano A′B′C′: el
              complementario de β. En el triángulo abatido, β es el ángulo del extremo que no
              se ha movido, entre la planta y la verdadera magnitud.
          - valor: '68.02'
            receta: angulo_con_ph(segmento3(B, solucion.Bp_frontal))
            mensaje: |
              Es lo que forma **B₂B′₂ con la recta A′₂C′₂ en el alzado**. Ahí el plano A′B′C′ se
              ve de canto, pero BB′ no es frontal y el alzado deforma su ángulo: solo sería β
              si BB′ fuera paralela al plano vertical.
          - valor: '54.40'
            receta: angulo_con_pv(segmento3(B, Bp))
            mensaje: |
              Ese es el ángulo de BB′ con el **plano vertical**, el que da el triángulo abatido
              sobre el alzado. β se mide contra A′B′C′, que es horizontal: el triángulo va en la
              planta, con la diferencia de cotas.
        pista: |
          Es el ángulo del triángulo abatido en el extremo que no se ha movido: su tangente es
          la diferencia de cotas partida por lo que mide la planta de BB′.
        desarrollo: |
          $$ \beta = \arctan\frac{\Delta z}{\overline{B_1B'_1}} = \arctan\frac{40{,}39}{62{,}98} \approx 32{,}67^{\circ} $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: 'A₂, B₂ y C₂ están en una horizontal del alzado: el plano ABC es horizontal, y la planta lo da en verdadera magnitud.'
          - texto: α se mide en la planta, en B₁; de los dos ángulos suplementarios que forman las rectas se da el menor, que es el convenio del ángulo entre rectas.
          - texto: A′B′C′ también es horizontal, así que el ángulo de BB′ con ese plano es el que forma BB′ con el plano horizontal.
          - texto: Se abate el plano proyectante de BB′ sobre la planta, con la diferencia de cotas de B y B′ en la perpendicular a B₁B′₁, y el ángulo del triángulo en el extremo fijo es β.
          - texto: β se mide en el alzado, entre B₂B′₂ y la recta A′₂C′₂, porque ahí el plano A′B′C′ se ve de canto.
            trampa: true
            mensaje: |
              Que el plano se vea de canto no basta: hace falta además que BB′ esté en
              verdadera magnitud en esa vista, y BB′ no es frontal. Ese ángulo mide 68,0°, y β,
              32,7°.

    resolucion: |
      **Qué es horizontal.** A₂, B₂ y C₂ están en una misma horizontal del alzado, y A′₂, B′₂
      y C′₂ en otra: las dos bases del prisma son planos horizontales. Las aristas laterales
      son paralelas entre sí y oblicuas: no son horizontales ni frontales.

      **α, en la planta.** AB y BC están en la base ABC, que es horizontal, así que la planta
      da el triángulo en verdadera magnitud y el ángulo se mide en B₁, sin construir nada.
      El triángulo tiene en B 110,8°. Dos rectas que se cortan forman dos ángulos
      suplementarios, y el ángulo entre las rectas es el menor: α = 69,2°. La hoja no
      precisa cuál de los dos quiere: el menor es el convenio del ángulo entre rectas, y es
      el que se pide aquí; el del triángulo, 110,8°, sale de la misma medida.

      **β, abatiendo.** BB′ corta a la base A′B′C′ en B′, y como esa base es horizontal, el
      ángulo de BB′ con ella es el que forma con el plano horizontal. Ni el alzado ni la
      planta dan BB′ en verdadera magnitud: se abate su plano proyectante sobre la planta,
      llevando en la perpendicular a B₁B′₁ la diferencia de cotas de B y B′, 40,39 mm, que se
      mide en el alzado. El triángulo rectángulo tiene por catetos la planta, 62,98 mm, y esa
      diferencia; su hipotenusa es BB′ en verdadera magnitud, 74,82 mm, y su ángulo en el
      extremo fijo es β = 32,7°.

      **Lo que no es β.** En el alzado, B₂B′₂ forma 68,0° con la recta A′₂C′₂, pero BB′ no es
      frontal y ese ángulo está deformado. Abatiendo sobre el alzado sale 54,4°, que es el
      ángulo de BB′ con el plano vertical, y 57,3° es el que forma con la vertical.

  # ── 1 c y d · Las dos distancias. Lo que enseña: la perpendicular a un
  #    plano se traza contra sus horizontales y sus frontales, no contra una
  #    arista; y dos rectas cuyas proyecciones se cortan pueden cruzarse.
  - id: exeg-h55-1cd-distancias-a-una-cara-y-entre-dos-rectas
    titulo: La distancia de un punto a una cara, y la de dos rectas que se cruzan
    fuente: >-
      Ejercicio 55, apartado 1 (c y d) · Colección de ejercicios de Geometría
      Descriptiva, Sistema Diédrico Directo · Dpto. de Expresión Gráfica y
      Proyectos de Ingeniería, EIG · UPV/EHU. El 55 (págs. 64-66; este
      apartado, en las 64 y 65) es uno de los cuatro ejercicios de varios
      apartados con que cierra la colección, todos sin fecha, y de ellos solo el
      54 se titula «Examen». Se transcribe el castellano; la figura se redibuja
      desde sus coordenadas.
    nivel: examen
    # Decisión: como en la pieza de a y b. «ente» es errata de la hoja, y se
    # conserva (§08).
    enunciado: |
      En la figura en escala 1:1 que se muestra, se pide determinar gráficamente:

      c. La distancia mínima entre el punto Z′ y el plano BCB′C′ ($d$) indicando posición y magnitud.

      d. La distancia mínima ente las rectas BB′ y ZZ′ ($t$) indicando posición y magnitud.

      **Notas nuestras.** La figura es la de abajo de la segunda página del
      Ejercicio 55: el mismo prisma de 1 a y 1 b, con la recta ZZ′ añadida, en
      alzado (arriba) y en planta (abajo). La hoja dibuja todas las aristas en
      continua; en la planta, A′₁C′₁ quedaría oculta. «Posición» quiere decir
      dónde está el segmento de la distancia mínima en las dos vistas; la versión
      en euskera de 1 c lo dice aparte: que se señale en las vistas
      dadas. La hoja trae arriba a la derecha, junto a la figura de 1 a y
      1 b, la casilla de $\alpha$, $\beta$, $d$ y $t$. Escala 1:1: lo que mides
      en la lámina, en milímetros, es el resultado. «ente», en 1 d, es
      errata de la hoja por «entre», y se deja tal como está impresa.
    pide: El pie de la perpendicular desde Z′ a la cara BCB′C′ y la distancia d; los extremos de la perpendicular común a BB′ y ZZ′ y la distancia t; todo en las dos vistas.
    receta:
      lamina: ex55-1cd
      escena:
        B: 'punto3(alzado: figura.punto("B2"), planta: figura.punto("B1"))'
        C: 'punto3(alzado: figura.punto("C2"), planta: figura.punto("C1"))'
        Bp: 'punto3(alzado: figura.punto("B2p"), planta: figura.punto("B1p"))'
        Cp: 'punto3(alzado: figura.punto("C2p"), planta: figura.punto("C1p"))'
        Z: 'punto3(alzado: figura.punto("Z2"), planta: figura.punto("Z1"))'
        Zp: 'punto3(alzado: figura.punto("Z2p"), planta: figura.punto("Z1p"))'
        cara: plano(B, C, Bp)
        BBp: recta3(B, Bp)
        ZZp: recta3(Z, Zp)
      solucion:
        perp: perpendicular_a_plano(Zp, cara)
        H: pie_en_plano(Zp, cara)
        d_mm: en_mm(distancia_a_plano(Zp, cara))
        N: pie_comun(ZZp, BBp)
        M: pie_comun(BBp, ZZp)
        t_mm: en_mm(distancia_rectas(BBp, ZZp))
        # El plano vertical que contiene BB′: su corte con ZZ′ es el punto de ZZ′
        # cuya planta cae en B₁B′₁, el cruce aparente de las dos plantas.
        vertical_de_BB: 'plano(B, Bp, punto3(alzado: desplaza(figura.punto("B2"), dy: mm(-10)), planta: figura.punto("B1")))'
        cruce: corte_recta_plano(ZZp, vertical_de_BB)
      comprueba:
        - en_plano(Cp, cara)
    pasos:
      - tipo: reconocer
        pregunta: ¿Cómo se trazan las proyecciones de la perpendicular desde Z′ al plano BCB′C′?
        opciones:
          - texto: En la planta, perpendicular a las horizontales del plano; en el alzado, perpendicular a sus frontales
            correcta: true
            mensaje: |
              Eso es. Una perpendicular a un plano lo es a todas sus rectas, y el ángulo recto
              se ve recto en la vista donde la recta del plano está en verdadera magnitud: la
              horizontal en la planta y la frontal en el alzado. Aquí BC es una horizontal del
              plano, así que en la planta va perpendicular a B₁C₁.
          - texto: En las dos vistas, perpendicular a las proyecciones de la arista BB′
            mensaje: |
              BB′ no es horizontal ni frontal, y el ángulo recto con ella no se ve recto en
              ninguna de las dos vistas. Se usan las rectas del plano que sí están en verdadera
              magnitud en cada vista: una horizontal y una frontal.
          - texto: En la planta, perpendicular a B₁C₁, y en el alzado, perpendicular a B₂C₂
            mensaje: |
              En la planta, sí: BC es horizontal. En el alzado una horizontal se ve como una
              recta horizontal, y su perpendicular sería vertical, que no es la buena. En el
              alzado manda la **frontal** del plano, no la horizontal.

      - tipo: construir
        titulo: Los pies de las dos distancias
        intro: |
          Llamamos H al pie de la perpendicular desde Z′ al plano BCB′C′, y M y N a los
          extremos de la perpendicular común, M en BB′ y N en ZZ′. Marca H en el alzado y en la
          planta, y después N y M en las dos vistas.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, borrar]
        tolerancia: 1
        objetivos:
          - nombre: H2
            pide: el pie de la perpendicular desde Z′ al plano, en el alzado
            es: proy_alzado(solucion.H)
            bien: |
              H₂ está en la perpendicular al plano por Z′₂, donde corta al plano. H cae fuera de
              la cara, al otro lado de la arista BB′: el plano no se acaba en sus aristas.
            diagnosticos:
              - si: cerca_de(proy_alzado(pie_perpendicular(Zp, BBp)))
                mensaje: |
                  Ese es el pie de la perpendicular desde Z′ a la **arista BB′**, no al plano.
                  Aquí caen cerca, porque H queda muy cerca de esa arista, pero no son el mismo
                  punto: la perpendicular a una recta de la cara no es la perpendicular a la cara.
                ejemplo: proy_alzado(pie_perpendicular(Zp, BBp))
              - si: en_vertical_de(figura.punto("Z2p"))
                mensaje: |
                  Has trazado en el alzado la perpendicular a B₂C₂, que es horizontal, y te ha
                  salido vertical. En el alzado la perpendicular va contra las **frontales** del
                  plano: busca dos puntos de BB′ y de CC′ con el mismo alejamiento.
                ejemplo: 'desplaza(figura.punto("Z2p"), dy: mm(-20))'
              - si: en_recta(proy_alzado(solucion.perp))
                mensaje: |
                  Vas por la perpendicular al plano, pero H es donde esa perpendicular **corta**
                  al plano, ni antes ni después. El corte se encuentra con un plano auxiliar
                  proyectante que la contenga, o poniendo el plano de canto con un cambio de plano.
                ejemplo: punto_medio(proy_alzado(segmento3(Zp, solucion.H)))
              - si: siempre
                mensaje: |
                  H₂ está en la perpendicular al plano por Z′₂ —perpendicular a las frontales del
                  plano— y en el plano: donde esa recta lo corta.
          - nombre: H1
            pide: el pie de la perpendicular desde Z′ al plano, en la planta
            es: proy_planta(solucion.H)
            bien: |
              H₁ está en la vertical de H₂, sobre la perpendicular a B₁C₁ por Z′₁.
            diagnosticos:
              - si: 'es_pie_perpendicular(desde: figura.punto("Z1p"), sobre: figura.segmento("CB1"))'
                mensaje: |
                  Ese es el pie sobre la **prolongación de B₁C₁**, en la planta. La perpendicular
                  va bien, perpendicular a B₁C₁, pero H no es donde toca la planta de esa
                  horizontal: es donde la perpendicular corta al plano, y eso lo dice H₂.
                ejemplo: pie_perpendicular(figura.punto("Z1p"), figura.segmento("CB1"))
              - si: '!en_vertical_de(H2)'
                mensaje: |
                  H₁ va en la **vertical de H₂**: son el mismo punto visto dos veces.
                ejemplo: 'desplaza(proy_planta(solucion.H), dx: mm(8))'
              - si: siempre
                mensaje: |
                  Si ya tienes H₂: H₁ está en su vertical, sobre la perpendicular a B₁C₁ que pasa
                  por Z′₁.
          - nombre: N1
            pide: el extremo de la perpendicular común sobre ZZ′, en la planta
            es: proy_planta(solucion.N)
            bien: |
              N₁ está en Z₁Z′₁, al pie de la perpendicular común: la recta que corta a BB′ y a
              ZZ′ formando ángulo recto con las dos.
            diagnosticos:
              - si: cerca_de(proy_planta(solucion.cruce))
                mensaje: |
                  Ahí se cortan B₁B′₁ y Z₁Z′₁ en la planta, pero ese cruce es **aparente**: en el
                  alzado las dos rectas se cortan en otra vertical. BB′ y ZZ′ se cruzan, no tienen
                  ningún punto común, y la distancia mínima es la de la perpendicular común.
                ejemplo: proy_planta(solucion.cruce)
              - si: cerca_de(proy_planta(pie_perpendicular(Bp, ZZp)))
                mensaje: |
                  Esa es la perpendicular desde **B′** a ZZ′, desde un punto cualquiera de BB′. La
                  común tiene que ser perpendicular a las dos rectas a la vez; con BB′ de punta
                  —dos cambios de plano— se ve en verdadera magnitud.
                ejemplo: proy_planta(pie_perpendicular(Bp, ZZp))
              - si: en_segmento(figura.segmento("ZZ1"))
                mensaje: |
                  N está en ZZ′, pero en un punto concreto: el pie de la perpendicular común.
                  Pon BB′ de punta con dos cambios de plano; desde ese punto, la perpendicular a
                  la nueva proyección de ZZ′ da N.
                ejemplo: punto_medio(figura.segmento("ZZ1"))
              - si: siempre
                mensaje: |
                  N es un punto de ZZ′: N₁ tiene que estar en Z₁Z′₁, al pie de la perpendicular
                  común.
          - nombre: N2
            pide: el extremo de la perpendicular común sobre ZZ′, en el alzado
            es: proy_alzado(solucion.N)
            bien: |
              N₂ está en Z₂Z′₂, en la vertical de N₁.
            diagnosticos:
              - si: '!en_vertical_de(N1)'
                mensaje: |
                  N₂ va en la **vertical de N₁**: son el mismo punto visto dos veces.
                ejemplo: 'desplaza(proy_alzado(solucion.N), dx: mm(8))'
              - si: siempre
                mensaje: |
                  Si ya tienes N₁: N₂ está en su vertical, donde esa vertical corta a Z₂Z′₂.
          - nombre: M1
            pide: el extremo de la perpendicular común sobre BB′, en la planta
            es: proy_planta(solucion.M)
            bien: |
              M₁ está en B₁B′₁, al otro extremo de la perpendicular común. MN es perpendicular a
              BB′ y a ZZ′, y su verdadera magnitud es t.
            diagnosticos:
              - si: cerca_de(proy_planta(solucion.cruce))
                mensaje: |
                  Ahí se cortan B₁B′₁ y Z₁Z′₁ en la planta, pero el cruce es **aparente**: en el
                  alzado se cortan en otra vertical. BB′ y ZZ′ se cruzan, y M es el pie de la
                  perpendicular común, no un punto común.
                ejemplo: proy_planta(solucion.cruce)
              - si: cerca_de(proy_planta(pie_perpendicular(Zp, BBp)))
                mensaje: |
                  Esa es la perpendicular desde **Z′** a BB′, desde un extremo de ZZ′. La común es
                  perpendicular a las dos rectas, y sale de N, no de Z′.
                ejemplo: proy_planta(pie_perpendicular(Zp, BBp))
              - si: en_segmento(figura.segmento("BB1"))
                mensaje: |
                  M está en BB′, pero en un punto concreto: el otro extremo de la perpendicular
                  común. Sale de N, perpendicular a BB′ en la vista donde BB′ está en verdadera
                  magnitud.
                ejemplo: punto_medio(figura.segmento("BB1"))
              - si: siempre
                mensaje: |
                  M es un punto de BB′: M₁ tiene que estar en B₁B′₁, al pie de la perpendicular
                  común.
          - nombre: M2
            pide: el extremo de la perpendicular común sobre BB′, en el alzado
            es: proy_alzado(solucion.M)
            bien: |
              M₂ está en B₂B′₂, en la vertical de M₁.
            diagnosticos:
              - si: '!en_vertical_de(M1)'
                mensaje: |
                  M₂ va en la **vertical de M₁**: son el mismo punto visto dos veces.
                ejemplo: 'desplaza(proy_alzado(solucion.M), dx: mm(8))'
              - si: siempre
                mensaje: |
                  Si ya tienes M₁: M₂ está en su vertical, donde esa vertical corta a B₂B′₂.
        trazado:
          - proy_alzado(segmento3(Zp, solucion.H))
          - proy_planta(segmento3(Zp, solucion.H))
          - proy_alzado(segmento3(solucion.M, solucion.N))
          - proy_planta(segmento3(solucion.M, solucion.N))
        pista: |
          (1) Para H: un cambio de plano con la línea de tierra nueva perpendicular a B₁C₁ pone
          el plano de canto, porque BC es horizontal; ahí la perpendicular desde Z′ se ve en
          verdadera magnitud, y su pie se devuelve a las dos vistas. (2) Para M y N: dos cambios
          de plano ponen BB′ de punta; desde ese punto, la perpendicular a la nueva proyección de
          ZZ′ da N y mide t; M sale de N, perpendicular a BB′.
        desarrollo: |
          En verde claro, Z′H y MN en las dos vistas. H queda fuera de la cara, al otro lado de
          BB′; M, en BB′ a algo más de un cuarto desde B; N, en ZZ′ a unos tres quintos desde Z.

      - tipo: calcular
        titulo: La distancia d
        pregunta: d, la distancia mínima entre el punto Z′ y el plano BCB′C′.
        respuesta:
          tipo: numero
          valor: '30.85'
          receta: d_mm
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '17.36'
            receta: en_mm(vm_planta(Zp, solucion.H))
            mensaje: |
              Eso es lo que mide **Z′₁H₁ en la planta**. Z′H no es horizontal —Z′ y H tienen
              distinta cota—, así que la planta lo acorta: hace falta su verdadera magnitud.
          - valor: '27.34'
            receta: en_mm(vm_alzado(Zp, solucion.H))
            mensaje: |
              Eso es lo que mide **Z′₂H₂ en el alzado**, que también acorta: Z′H no es frontal.
              Su verdadera magnitud sale abatiéndolo, o leída en la vista del cambio de plano
              donde el plano está de canto.
        pista: |
          Es la verdadera magnitud de Z′H. En la vista del cambio de plano, con el plano de
          canto, se lee directamente; si no, abate Z′H como cualquier segmento.
        desarrollo: |
          $$ d = \overline{Z'H} = \sqrt{\overline{Z'_1H_1}^{\,2} + \Delta z^{2}} = \sqrt{17{,}36^{2} + 25{,}50^{2}} \approx 30{,}85 \text{ mm} $$

          Hasta la arista BB′ sale 30,94 mm, casi lo mismo por casualidad: no es d, y su pie
          está a más de 2 mm de H.

      - tipo: calcular
        titulo: La distancia t
        pregunta: t, la distancia mínima entre las rectas BB′ y ZZ′.
        respuesta:
          tipo: numero
          valor: '20.20'
          receta: t_mm
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '14.45'
            receta: en_mm(vm_planta(solucion.M, solucion.N))
            mensaje: |
              Eso es lo que mide **M₁N₁ en la planta**. La perpendicular común no es horizontal,
              y la planta la acorta.
          - valor: '16.50'
            receta: en_mm(vm_alzado(solucion.M, solucion.N))
            mensaje: |
              Eso es lo que mide **M₂N₂ en el alzado**, que también acorta. En verdadera magnitud
              está en la vista con BB′ de punta.
          - valor: '30.94'
            receta: en_mm(vm(Zp, pie_perpendicular(Zp, BBp)))
            mensaje: |
              Esa es una distancia desde **Z′**, un extremo de ZZ′: hasta la arista BB′ mide
              30,94 mm, y hasta la cara BCB′C′, 30,85 mm, que es d. Ninguna es la mínima entre
              las rectas: esa va por la perpendicular común, que es perpendicular a las dos y no
              tiene por qué pasar por Z′.
        pista: |
          Con BB′ de punta, la perpendicular común se ve en verdadera magnitud: es la distancia
          del punto en que se ve BB′ a la proyección de ZZ′ en esa vista.
        desarrollo: |
          $$ t = \overline{MN} = \sqrt{\overline{M_1N_1}^{\,2} + \Delta z^{2}} = \sqrt{14{,}45^{2} + 14{,}12^{2}} \approx 20{,}20 \text{ mm} $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: La perpendicular al plano por Z′ se traza en la planta perpendicular a B₁C₁, porque BC es una horizontal del plano, y en el alzado perpendicular a sus frontales.
          - texto: H es donde esa perpendicular corta al plano, y d es la verdadera magnitud de Z′H, que no está en ninguna de las dos vistas.
          - texto: 'B₁B′₁ y Z₁Z′₁ se cortan en la planta, y B₂B′₂ y Z₂Z′₂ en el alzado, pero en verticales distintas: las rectas se cruzan.'
          - texto: La distancia mínima es la de la perpendicular común MN, que corta a las dos rectas en ángulo recto, y t es su verdadera magnitud.
          - texto: El punto donde se cortan B₁B′₁ y Z₁Z′₁ en la planta es común a las dos rectas, así que la distancia mínima entre ellas es cero.
            trampa: true
            mensaje: |
              Ese cruce es aparente: en el alzado las dos rectas se cortan en otra vertical, así
              que no es el mismo punto del espacio. Las rectas se cruzan, y su distancia es la de
              la perpendicular común, 20,2 mm.

    resolucion: |
      **El plano y su perpendicular.** BC es una horizontal del plano BCB′C′ —B₂C₂ está en la
      horizontal de arriba del alzado—, así que la planta de la perpendicular por Z′ es
      perpendicular a B₁C₁. En el alzado va perpendicular a una frontal del plano, que se
      obtiene uniendo dos puntos de BB′ y de CC′ con el mismo alejamiento.

      **H, el pie.** Con un cambio de plano de línea de tierra perpendicular a B₁C₁, el plano
      queda de canto —BC es horizontal, así que basta uno— y la perpendicular desde Z′ se ve
      en verdadera magnitud; su pie se devuelve a la planta, sobre la perpendicular a B₁C₁
      por Z′₁, y al alzado con su cota. Sin cambio de plano se llega igual: el plano vertical
      que contiene la planta de la perpendicular corta a BB′ y a la prolongación de CC′, más
      allá de C′, en dos puntos del plano,
      la recta que los une corta el alzado de la perpendicular en H₂, y H₁ baja por su
      vertical. H cae fuera de la cara, al otro lado de la arista BB′: el plano no se acaba
      en sus aristas.

      **d.** Z′H mide 17,36 mm en la planta y 27,34 mm en el alzado, y en verdadera magnitud
      d = 30,85 mm. La distancia de Z′ a la arista BB′ sale casi igual, 30,94 mm, porque H
      queda muy cerca de esa arista; pero no es la que se pide, y su pie está a más de 2 mm
      de H en cada vista.

      **Las rectas se cruzan.** B₁B′₁ y Z₁Z′₁ se cortan en la planta, y B₂B′₂ y Z₂Z′₂ en el
      alzado, pero los dos cruces no están en la misma vertical: no hay un punto común. La
      distancia mínima es la de la perpendicular común MN, que corta a las dos en ángulo
      recto.

      **t.** Con dos cambios de plano, BB′ queda de punta: se ve como un punto, y la
      perpendicular desde él a la nueva proyección de ZZ′ es la perpendicular común en
      verdadera magnitud, t = 20,20 mm. Su pie es N; M sale de N, perpendicular a BB′ en la
      vista donde BB′ está en verdadera magnitud, y los dos se devuelven a las vistas dadas.
      M queda en BB′ a algo más de un cuarto desde B, y N en ZZ′ a unos tres quintos desde Z;
      MN mide 14,45 mm en la planta y 16,50 mm en el alzado.

  # ── 2 · La pirámide de mayor cota sobre un plano oblicuo. Lo que enseña:
  #    el cuadrado se construye con el plano en verdadera magnitud, la altura
  #    sale de una horizontal (BC), y en el alzado la lámina tapa la pirámide,
  #    que queda detrás de ella.
  - id: exeg-h55-2-la-piramide-de-mayor-cota
    titulo: La pirámide de mayor cota sobre un plano oblicuo, y lo que tapa la lámina
    fuente: >-
      Ejercicio 55, apartado 2 · Colección de ejercicios de Geometría
      Descriptiva, Sistema Diédrico Directo · Dpto. de Expresión Gráfica y
      Proyectos de Ingeniería, EIG · UPV/EHU. El 55 (págs. 64-66; este
      apartado, en las 64 y 66) es uno de los cuatro ejercicios de varios
      apartados con que cierra la colección, todos sin fecha, y de ellos solo el
      54 se titula «Examen». Se transcribe el castellano; la figura se redibuja
      desde sus coordenadas.
    nivel: examen
    # Decisión: el castellano de la pág. 64 tal cual, sin el «2.» del apartado
    # (lo dice la fuente). «se haya» es errata de la hoja, y se conserva (§08).
    enunciado: |
      Dibujar la pirámide cuya base cuadrada se haya en el plano ABCD. Una diagonal de la base cuadrada es la recta EF. La altura de la pirámide es el doble de la longitud de la recta BC. Dibujar la pirámide de mayor cota, diferenciando zonas visibles y ocultas.

      **Notas nuestras.** La figura es la mitad izquierda de la tercera página
      del Ejercicio 55: el plano ABCD y la recta EF, que va de AB a DC, en alzado
      (arriba) y en planta (abajo). AD y BC son horizontales. «Se haya» es
      errata de la hoja por «se halla», y se deja tal como está impresa. La
      hoja no da escala para este apartado: las longitudes se dan en
      milímetros de la lámina. La hoja tampoco dice si el plano ABCD es una
      lámina opaca o solo un plano; aquí se toma como lámina opaca, y eso
      cambia la visibilidad del alzado.
    pide: Los dos vértices de la base que faltan y el vértice de la pirámide, en las dos vistas; la pirámide con sus aristas vistas y ocultas; su altura y el lado de la base.
    receta:
      lamina: ex55-2
      escena:
        A: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("A1"))'
        B: 'punto3(alzado: figura.punto("B2"), planta: figura.punto("B1"))'
        C: 'punto3(alzado: figura.punto("C2"), planta: figura.punto("C1"))'
        D: 'punto3(alzado: figura.punto("D2"), planta: figura.punto("D1"))'
        E: 'punto3(alzado: figura.punto("E2"), planta: figura.punto("E1"))'
        F: 'punto3(alzado: figura.punto("F2"), planta: figura.punto("F1"))'
        cara: plano(A, B, D)
      solucion:
        base: cuadrado_por_diagonal(cara, E, F)
        O: punto_medio(segmento3(E, F))
        eje: perpendicular_a_plano(O, cara)
        # cuadrado_por_diagonal da [E, G, F, H]: en esta lámina el segundo es el
        # vértice de mayor cota de los dos que faltan (G) y el cuarto el de menor
        # (H). tests/geometria/hoja-55.test.ts comprueba esas posiciones.
        G: uno(base, 2)
        H: uno(base, 4)
        altura: 2 * vm(B, C)
        V: 'apice(base, altura: altura, sentido: ascendente)'
        altura_mm: en_mm(altura)
        lado_mm: en_mm(vm(E, G))
        # Los errores. La pirámide de menor cota; la altura sin doblar; y el
        # cuadrado dibujado en la planta sobre E₁F₁, como si EF estuviera en
        # verdadera magnitud: el de diagonal EF₀ en el plano horizontal de E,
        # con F₀ la planta de F a la cota de E (dos posiciones, una elección).
        V_baja: 'apice(base, altura: altura, sentido: descendente)'
        V_altura_BC: 'apice(base, altura: vm(B, C), sentido: ascendente)'
        V_tres_cuartos: 'apice(base, altura: altura * 0.75, sentido: ascendente)'
        horizontal_E: 'plano(E, punto3(alzado: figura.punto("E2"), planta: desplaza(figura.punto("E1"), dy: 10)), punto3(alzado: desplaza(figura.punto("E2"), dx: 10), planta: desplaza(figura.punto("E1"), dx: 10)))'
        F_a_cota_de_E: 'punto_en_plano(planta: figura.punto("F1"), plano: horizontal_E)'
        cuadrado_en_planta: 'gira(F_a_cota_de_E, perpendicular_a_plano(punto_medio(segmento3(E, F_a_cota_de_E)), horizontal_E), angulo: 90)'
      comprueba:
        - en_plano(C, cara)
        - en_plano(E, cara)
        - en_plano(F, cara)
    pasos:
      - tipo: reconocer
        pregunta: El plano ABCD es oblicuo. ¿Dónde se dibuja el cuadrado de diagonal EF con su forma verdadera?
        opciones:
          - texto: Con el plano en verdadera magnitud, abatido o en una vista nueva, y después se devuelve a las dos vistas
            correcta: true
            mensaje: |
              Eso es. AD y BC son horizontales del plano, así que basta un cambio de plano con
              la línea de tierra perpendicular a A₁D₁ para ponerlo de canto, o abatirlo con
              charnela AD. Con el plano en verdadera magnitud, el cuadrado se dibuja como en
              un papel, y G y H se devuelven a las vistas.
          - texto: En la planta, sobre E₁F₁, porque ahí se ve el ángulo recto de las diagonales
            mensaje: |
              El ángulo recto entre las diagonales solo se ve recto en la planta si una de las
              dos es horizontal, y aquí ninguna lo es. Además E₁F₁ está acortada: mide
              56,12 mm, y EF, 57,10. Un cuadrado dibujado sobre E₁F₁ no está en el plano.
          - texto: En el alzado, porque A₂D₂ y B₂C₂ salen horizontales
            mensaje: |
              Que A₂D₂ y B₂C₂ sean horizontales dice que AD y BC son horizontales del plano:
              se ven en verdadera magnitud en la planta, no en el alzado. El alzado acorta EF
              hasta 17,34 mm.

      - tipo: construir
        titulo: La base y el vértice
        intro: |
          Llamamos G y H a los dos vértices de la base que faltan, G el de mayor cota y H el
          de menor, y V al vértice de la pirámide. Marca G, H y V en la planta y en el
          alzado. La pirámide es la de mayor cota: V queda por encima del plano ABCD.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, transportador, borrar]
        tolerancia: 1
        objetivos:
          - nombre: G1
            pide: el vértice G de la base, el de mayor cota, en la planta
            es: proy_planta(solucion.G)
            bien: |
              G₁ es el vértice de la base del lado de A₁D₁. G cae fuera de la lámina ABCD, al
              otro lado de AD: el cuadrado no cabe entero en ella.
            diagnosticos:
              - si: cerca_de(proy_planta(solucion.H))
                mensaje: |
                  Ese es el otro vértice que falta, H, el de menor cota. Aquí G es el de mayor
                  cota: el que queda más arriba en el alzado.
                ejemplo: proy_planta(solucion.H)
              - si: cerca_de(proy_planta(solucion.cuadrado_en_planta))
                mensaje: |
                  Has dibujado el cuadrado en la planta, sobre E₁F₁, como si EF estuviera en
                  verdadera magnitud y el plano fuera horizontal. El plano ABCD está inclinado:
                  el cuadrado se construye con el plano abatido o de canto, y se devuelve.
                ejemplo: proy_planta(rama(solucion.cuadrado_en_planta, 1))
              - si: siempre
                mensaje: |
                  G está en el plano ABCD, en la otra diagonal del cuadrado: perpendicular a EF
                  por su punto medio y del mismo largo, medido con el plano en verdadera
                  magnitud.
          - nombre: G2
            pide: el vértice G de la base, en el alzado
            es: proy_alzado(solucion.G)
            bien: |
              G₂ está en la vertical de G₁ y en el plano: sale con la horizontal del plano que
              pasa por G₁, paralela a A₁D₁ en la planta y horizontal en el alzado.
            diagnosticos:
              - si: '!en_vertical_de(G1)'
                mensaje: |
                  G₂ va en la **vertical de G₁**: son el mismo punto visto dos veces.
                ejemplo: 'desplaza(proy_alzado(solucion.G), dx: mm(8))'
              - si: siempre
                mensaje: |
                  Si ya tienes G₁: G₂ está en su vertical y en el plano. Traza por G₁ una
                  paralela a A₁D₁, que es una horizontal del plano, y súbela al alzado.
          - nombre: H1
            pide: el vértice H de la base, el de menor cota, en la planta
            es: proy_planta(solucion.H)
            bien: |
              H₁ es el vértice de la base del lado de B₁C₁. H también cae fuera de la lámina,
              al otro lado de BC.
            diagnosticos:
              - si: cerca_de(proy_planta(solucion.G))
                mensaje: |
                  Ese es G, el de mayor cota, que ya tienes. H es el otro extremo de la misma
                  diagonal, al otro lado de EF.
                ejemplo: proy_planta(solucion.G)
              - si: cerca_de(proy_planta(solucion.cuadrado_en_planta))
                mensaje: |
                  Has dibujado el cuadrado en la planta, sobre E₁F₁, como si EF estuviera en
                  verdadera magnitud. El plano está inclinado: el cuadrado se construye con el
                  plano abatido o de canto.
                ejemplo: proy_planta(rama(solucion.cuadrado_en_planta, 2))
              - si: siempre
                mensaje: |
                  H está en el plano, en la otra diagonal del cuadrado, al otro lado de EF que G
                  y a la misma distancia del centro.
          - nombre: H2
            pide: el vértice H de la base, en el alzado
            es: proy_alzado(solucion.H)
            bien: |
              H₂ está en la vertical de H₁, sobre la horizontal del plano que pasa por H.
            diagnosticos:
              - si: '!en_vertical_de(H1)'
                mensaje: |
                  H₂ va en la **vertical de H₁**: son el mismo punto visto dos veces.
                ejemplo: 'desplaza(proy_alzado(solucion.H), dx: mm(8))'
              - si: siempre
                mensaje: |
                  Si ya tienes H₁: H₂ está en su vertical y en el plano, sobre la horizontal del
                  plano que pasa por H₁.
          - nombre: V1
            pide: el vértice de la pirámide, en la planta
            es: proy_planta(solucion.V)
            bien: |
              V₁ está en la perpendicular al plano por el centro de la base —perpendicular a
              A₁D₁ en la planta—, a la altura de dos veces BC y del lado de arriba del plano.
            diagnosticos:
              - si: cerca_de(proy_planta(solucion.V_baja))
                mensaje: |
                  Esa es la pirámide de **menor cota**: la perpendicular al plano, pero hacia
                  abajo. El enunciado pide la de mayor cota, con V por encima del plano ABCD.
                ejemplo: proy_planta(solucion.V_baja)
              - si: cerca_de(proy_planta(solucion.V_altura_BC))
                mensaje: |
                  Has llevado BC como altura, y la altura es **el doble** de BC: 108,03 mm.
                ejemplo: proy_planta(solucion.V_altura_BC)
              - si: en_recta(proy_planta(solucion.eje))
                mensaje: |
                  Vas por la perpendicular al plano por el centro, pero a otra distancia. La
                  altura, dos veces BC, se lleva donde esa perpendicular está en verdadera
                  magnitud: en la vista con el plano de canto.
                ejemplo: proy_planta(solucion.V_tres_cuartos)
              - si: siempre
                mensaje: |
                  V está en la perpendicular al plano ABCD por el centro de la base: en la planta,
                  perpendicular a las horizontales del plano, que son paralelas a A₁D₁.
          - nombre: V2
            pide: el vértice de la pirámide, en el alzado
            es: proy_alzado(solucion.V)
            bien: |
              V₂ está en la vertical de V₁, sobre la perpendicular al plano por el centro de la
              base, que en el alzado es perpendicular a las frontales del plano.
            diagnosticos:
              - si: cerca_de(proy_alzado(solucion.V_baja))
                mensaje: |
                  Esa es la pirámide de **menor cota**. El enunciado pide la de mayor cota: V queda
                  por encima del plano, y en el alzado, arriba.
                ejemplo: proy_alzado(solucion.V_baja)
              - si: '!en_vertical_de(V1)'
                mensaje: |
                  V₂ va en la **vertical de V₁**: son el mismo punto visto dos veces.
                ejemplo: 'desplaza(proy_alzado(solucion.V), dx: mm(8))'
              - si: siempre
                mensaje: |
                  Si ya tienes V₁: V₂ está en su vertical, sobre la perpendicular al plano por el
                  centro de la base, que en el alzado va perpendicular a las frontales.
        trazado:
          - proy_planta(segmento3(E, solucion.G))
          - proy_planta(segmento3(solucion.G, F))
          - proy_planta(segmento3(F, solucion.H))
          - proy_planta(segmento3(solucion.H, E))
          - proy_planta(segmento3(solucion.V, E))
          - proy_planta(segmento3(solucion.V, solucion.G))
          - proy_planta(segmento3(solucion.V, F))
          - proy_planta(segmento3(solucion.V, solucion.H))
          - proy_alzado(segmento3(E, solucion.G))
          - proy_alzado(segmento3(solucion.G, F))
          - proy_alzado(segmento3(F, solucion.H))
          - proy_alzado(segmento3(solucion.H, E))
          - proy_alzado(segmento3(solucion.V, E))
          - proy_alzado(segmento3(solucion.V, solucion.G))
          - proy_alzado(segmento3(solucion.V, F))
          - proy_alzado(segmento3(solucion.V, solucion.H))
        pista: |
          (1) AD y BC son horizontales: un cambio de plano con la línea de tierra
          perpendicular a A₁D₁ pone el plano de canto, o se abate con charnela AD. (2) Con el
          plano en verdadera magnitud, la otra diagonal del cuadrado: perpendicular a EF por
          su punto medio O y del mismo largo. (3) Devuelve G y H a las dos vistas. (4) BC es
          horizontal: mídela en la planta; la altura es el doble. (5) V está en la
          perpendicular al plano por O, del lado de arriba, a esa altura.
        desarrollo: |
          En verde claro, la base EGFH y las cuatro aristas que suben a V, en las dos vistas.
          G cae fuera de la lámina ABCD por el lado de AD, y H por el de BC.

      # Decisión: la hoja no dice si ABCD es lámina opaca; se toma opaca (con el
      # plano transparente, en el alzado solo VE iría oculta). Pregunta abierta
      # para Ionan (tasks/pendiente.md).
      - tipo: dibujar
        consigna: |
          Repasa la pirámide en la planta y en el alzado, con las aristas vistas en continua y
          las ocultas en discontinua, y también los bordes de la lámina ABCD. Toma el plano
          ABCD como una lámina opaca.
        comprueba:
          - punto: En la planta, ocultas FH, HE y VH; vistas VE, VG, VF, EG y GF.
            porque: >-
              Desde arriba se ven las caras que miran hacia arriba. V₁ cae fuera de la base,
              a la derecha, y H₁ queda dentro del contorno de la pirámide: las tres aristas
              que llegan a H van por debajo de las caras VEG y VGF. En el cruce aparente de
              V₁G₁ con H₁E₁, VG va 60,8 mm por encima.
          - punto: En la planta, la pirámide tapa la mayor parte de B₁C₁ y un tramo de D₁A₁ cerca de G₁.
            porque: >-
              La pirámide está encima de la lámina, del lado que mira hacia arriba, así que lo
              que de los bordes de ABCD queda debajo de ella va en discontinua.
          - punto: En el alzado, la lámina tapa las aristas de la base que caen dentro de A₂B₂C₂D₂, y un tramo corto de V₂H₂ junto a C₂.
            porque: >-
              El lado de mayor cota del plano ABCD mira hacia atrás, lejos del observador del
              alzado, así que la pirámide entera queda detrás de la lámina. Lo que de ella cae
              dentro del contorno de la lámina, en el alzado, no se ve.
          - punto: En el alzado, VE oculta; VG, VF y VH vistas, salvo ese tramo de VH.
            porque: >-
              VE queda detrás de la cara VGF: en el cruce aparente de V₂E₂ con G₂F₂, GF va
              50,2 mm por delante.
          - punto: Los cuatro bordes de la lámina, vistos en el alzado.
            porque: >-
              La pirámide está detrás de la lámina: nada la tapa por delante.
