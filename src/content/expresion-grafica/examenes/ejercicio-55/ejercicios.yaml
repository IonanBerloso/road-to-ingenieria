ejercicios:
  # ── 1 a y b · El prisma de bases horizontales. Lo que enseña: α no pide
  #    abatir nada, porque AB y BC están en un plano horizontal; β sí, porque
  #    BB′ no está en verdadera magnitud en ninguna vista.
  - id: exeg-h55-1ab-dos-angulos-del-prisma-oblicuo
    titulo: Dos ángulos de un prisma oblicuo, y cuál de los dos pide abatir
    fuente: >-
      Ejercicio 55, apartado 1 (a y b) · Colección de ejercicios de Geometría
      Descriptiva, Sistema Diédrico Directo · Dpto. de Expresión Gráfica y
      Proyectos de Ingeniería, EIG · UPV/EHU. El 55 (págs. 64-66; este
      apartado, en las 64 y 65) es uno de los cuatro ejercicios de varios
      apartados con que cierra la colección, todos sin fecha, y de ellos solo el
      54 se titula «Examen». Se transcribe el castellano; la figura se redibuja
      desde sus coordenadas.
    nivel: examen
    # Decisión: el castellano de la pág. 64 tal cual, con la cabecera del
    # apartado 1 en las dos piezas y sin su «1.» (el número lo dice la fuente,
    # y un «1.» a principio de línea el Markdown lo convierte en lista). Las
    # primas van como ′: la capa de texto las guarda como ’, pero la página
    # dibuja una prima. α, β, d y t van en $…$ porque la hoja los compone como
    # variables, en cursiva. El volcado pone «(α )» con un espacio que la
    # página no tiene.
    enunciado: |
      En la figura en escala 1:1 que se muestra, se pide determinar gráficamente:

      a. El ángulo entre las rectas AB y BC ($\alpha$).

      b. El ángulo entre el plano A′B′C′ y la recta BB′ ($\beta$).

      **Notas nuestras.** La figura es la de arriba de la segunda página del
      Ejercicio 55: un prisma triangular, con las bases ABC y A′B′C′ y las aristas
      laterales AA′, BB′ y CC′, en alzado (arriba) y en planta (abajo). La hoja
      dibuja todas las aristas en continua; en la planta, A′₁C′₁ quedaría oculta.
      La hoja trae arriba a la derecha una casilla para escribir $\alpha$,
      $\beta$, $d$ y $t$. Escala 1:1 quiere decir que lo que mides en la lámina,
      en milímetros, es el resultado. La hoja no dice cuál de los dos ángulos
      suplementarios que forman AB y BC es $\alpha$: aquí se da el menor, que es
      el convenio del ángulo entre dos rectas; el del triángulo en B es su
      suplementario.
    pide: El ángulo α entre AB y BC y el ángulo β de la arista BB′ con la base A′B′C′, en grados, con el abatimiento que da β.
    receta:
      lamina: ex55-1ab
      escena:
        A: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("A1"))'
        B: 'punto3(alzado: figura.punto("B2"), planta: figura.punto("B1"))'
        C: 'punto3(alzado: figura.punto("C2"), planta: figura.punto("C1"))'
        Ap: 'punto3(alzado: figura.punto("A2p"), planta: figura.punto("A1p"))'
        Bp: 'punto3(alzado: figura.punto("B2p"), planta: figura.punto("B1p"))'
        Cp: 'punto3(alzado: figura.punto("C2p"), planta: figura.punto("C1p"))'
        base_inferior: plano(Ap, Bp, Cp)
      solucion:
        alfa: angulo_rectas(segmento3(A, B), segmento3(B, C))
        beta: angulo_recta_plano(segmento3(B, Bp), base_inferior)
        # El punto con el alzado de B′ y el alejamiento de B: B y él forman un
        # segmento frontal con el mismo alzado que BB′, y su ángulo con el
        # plano horizontal es el que se lee en el alzado (un distractor de β).
        Bp_frontal: 'punto3(alzado: figura.punto("B2p"), planta: pie_perpendicular(figura.punto("B1"), perpendicular(por: figura.punto("B2p"), a: figura.segmento("ApBpCp2"))))'
        # La horizontal por B perpendicular a B₁B′₁ en la planta (la horizontal
        # del plano perpendicular a BB′), y sobre ella los puntos a lo que mide
        # B₂B′₂: el ejemplo del error de llevar el alzado en vez de la
        # diferencia de cotas, por la perpendicular buena.
        horizontal_por_B: horizontal_por(B, plano_perpendicular_a_recta(B, segmento3(B, Bp)))
        B_a_vm_alzado: 'punto_a_distancia(horizontal_por_B, desde: B, distancia: vm_alzado(B, Bp))'
        # Para la construcción paso a paso de β. H, donde la línea de referencia
        # de B corta A′₂C′₂ en el alzado: B₂H es la diferencia de cotas de B y
        # B′, que se toma con el compás.
        H_B: 'pie_perpendicular(figura.punto("B2"), figura.segmento("ApBpCp2"))'
        # El extremo de la perpendicular a B₁B′₁ por B₁: en el papel se traza
        # más allá del extremo abatido, hacia la derecha, y no para en él.
        L_B: 'uno(medir_sobre(perpendicular(por: figura.punto("B1"), a: figura.segmento("BB1")), desde: figura.punto("B1"), distancia: diferencia_de_cotas(B, Bp) + mm(8)), 2)'
        # El extremo abatido que dibuja la construcción: B, girado hasta la cota
        # de B′ alrededor de la horizontal de B′, hacia la derecha.
        B_ab: uno(abatido_planta(Bp, B), 1)
    pasos:
      - tipo: reconocer
        pregunta: A₂, B₂ y C₂ caen en una misma horizontal del alzado. ¿Dónde se mide α, el ángulo entre AB y BC?
        opciones:
          - texto: En la planta, directamente, porque el plano ABC es horizontal y se ve en verdadera magnitud desde arriba
            correcta: true
            mensaje: |
              Eso es. Un ángulo está en verdadera magnitud en la vista donde lo está el plano
              de sus dos rectas, y un plano horizontal lo está en la planta. Se mide en B₁, sin
              construir nada.
          - texto: Abatiendo el plano ABC, porque dos rectas que no son ni horizontales ni frontales no dan su ángulo en ninguna vista
            mensaje: |
              Abatir sirve cuando el plano de las dos rectas está inclinado. Aquí AB y BC son
              horizontales —sus alzados están a la misma altura—, así que el plano ABC ya está
              en verdadera magnitud en la planta: abatirlo sobre un plano horizontal lo deja
              donde está.
          - texto: En el alzado, que es donde se ven A₂, B₂ y C₂
            mensaje: |
              En el alzado el plano ABC se ve **de canto**: A₂, B₂ y C₂ caen en una recta, y el
              ángulo se aplasta a 0° o a 180°. Un plano horizontal, que en el alzado se ve de
              canto, está en verdadera magnitud en la planta.

      - tipo: construir
        titulo: Abatir la arista BB′
        intro: |
          α no necesita construcción: se mide en la planta. Para β, abate sobre la planta el
          plano proyectante de BB′: por B₁ o por B′₁, perpendicular a B₁B′₁, lleva la
          diferencia de cotas de B y B′, que se mide en el alzado, y marca el extremo
          abatido. Vale por cualquiera de los dos extremos y a cualquiera de los dos lados.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, transportador, borrar]
        tolerancia: 1
        objetivos:
          - nombre: BBp
            rotulo: (B) o (B′)
            pide: un extremo de BB′, abatido sobre la planta
            es: '[abatido_planta(Bp, B), abatido_planta(B, Bp)]'
            bien: |
              Ese es un extremo abatido de BB′: la recta que lo une con el otro extremo de la
              planta es BB′ en verdadera magnitud, y el ángulo que forma con B₁B′₁ es β.
            diagnosticos:
              # Decisión: el ejemplo va en cifras (pt) porque la receta no tiene una
              # función que dé un solo extremo abatido sobre el alzado; es el de B′,
              # el único de los cuatro que cae dentro del encuadre. Sale de un
              # cálculo aparte, con álgebra de vectores sobre las coordenadas de la
              # lámina, y tests/geometria/hoja-55.test.ts comprueba ese punto.
              - si: 'cerca_de([abatido_alzado(B, Bp), abatido_alzado(Bp, B)])'
                mensaje: |
                  Has abatido **sobre el alzado**, llevando la diferencia de alejamientos. Ese
                  triángulo da el ángulo de BB′ con el plano vertical. β se mide contra A′B′C′,
                  que es horizontal: el triángulo va en la planta, con la diferencia de cotas.
                ejemplo: 'desplaza(figura.punto("B2p"), dx: -159.91, dy: 64.53)'
              - si: 'a_distancia(de: [figura.punto("B1"), figura.punto("B1p")], d: vm_alzado(B, Bp))'
                mensaje: |
                  Has llevado lo que mide **B₂B′₂ en el alzado**, y el alzado también acorta: BB′
                  no es frontal. El cateto que va en la perpendicular es la **diferencia de
                  cotas** de B y B′, la distancia vertical entre las dos horizontales del alzado.
                ejemplo: proy_planta(rama(solucion.B_a_vm_alzado, 1))
              - si: 'a_distancia(de: [figura.punto("B1"), figura.punto("B1p")], d: diferencia_de_cotas(B, Bp))'
                mensaje: |
                  La distancia es la buena, pero va en la **perpendicular a B₁B′₁**: el triángulo
                  de la verdadera magnitud es rectángulo en el extremo de la planta.
                ejemplo: 'desplaza(figura.punto("B1"), dy: diferencia_de_cotas(B, Bp))'
              - si: 'en_recta(perpendicular(por: figura.punto("B1"), a: figura.segmento("BB1")))'
                mensaje: |
                  Vas por la perpendicular a B₁B′₁ en B₁, pero a otra distancia. Lo que se lleva
                  es la diferencia de cotas de B y B′, que se mide en el alzado entre la
                  horizontal de A₂B₂C₂ y la de A′₂B′₂C′₂.
                ejemplo: 'pie_perpendicular(desplaza(figura.punto("B1"), dx: mm(15)), perpendicular(por: figura.punto("B1"), a: figura.segmento("BB1")))'
              - si: 'en_recta(perpendicular(por: figura.punto("B1p"), a: figura.segmento("BB1")))'
                mensaje: |
                  Vas por la perpendicular a B₁B′₁ en B′₁, pero a otra distancia. Lo que se lleva
                  es la diferencia de cotas de B y B′, que se mide en el alzado entre las dos
                  horizontales de las bases.
                ejemplo: 'pie_perpendicular(desplaza(figura.punto("B1p"), dx: mm(15)), perpendicular(por: figura.punto("B1p"), a: figura.segmento("BB1")))'
              - si: siempre
                mensaje: |
                  El extremo abatido está en la perpendicular a B₁B′₁ por B₁ o por B′₁, a la
                  diferencia de cotas de B y B′.
        bloques:
          - nombre: Abatimiento del proyectante de BB′
            explica: |
              La base A′B′C′ es horizontal, así que β es el ángulo de BB′ con el plano horizontal; la
              hoja no fija método, y lo sacamos abatiendo el plano proyectante de BB′, el vertical que
              la contiene
              ([tema 3](/road-to-ingenieria/expresion-grafica/t03-metodos-descriptivos/#el-abatimiento-tumbar-el-plano)).
              Ese plano se tumba sobre el de la base, girándolo alrededor de su horizontal por B′, la
              charnela, cuya planta es B₁B′₁. B′ no se mueve, y B gira en un plano perpendicular a la
              charnela: en la planta va por la perpendicular a B₁B′₁ por B₁. Como el plano es
              vertical, B está en la vertical de un punto de la charnela, y su radio es solo lo que
              está más alto que B′: no hace falta triángulo para el radio. Abatido, B′₁(B) es BB′ en
              verdadera magnitud, y su ángulo con B′₁B₁ es β.
        construccion:
          - con: escuadra-cartabon
            traza: 'segmento2(figura.punto("B2"), desplaza(solucion.H_B, dy: mm(2)))'
            guia: figura.segmento("ABC2")
            bloque: Abatimiento del proyectante de BB′
            porque: |
              β es el ángulo de BB′ con la base A′B′C′, y esa base es horizontal: es el ángulo de
              BB′ con el plano horizontal, y se ve en el triángulo de la verdadera magnitud de BB′.
              Para él hace falta la **diferencia de cotas** de B y B′, la distancia entre las dos
              horizontales de las bases. Por B₂, la vertical —perpendicular a A₂C₂—, que es la
              línea de referencia de B, hasta pasar A′₂C′₂.
          - con: marca
            traza: solucion.H_B
            rotulo: H
            bloque: Abatimiento del proyectante de BB′
            porque: |
              H, donde la vertical de B₂ corta A′₂C′₂, la base de abajo, a 1 mm de A′₂: B₂H es lo
              que B está más alto que B′, 40,4 mm.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("B1"), solucion.L_B)
            guia: figura.segmento("BB1")
            bloque: Abatimiento del proyectante de BB′
            porque: |
              Se **abate el plano proyectante** de BB′, el plano vertical que la contiene, sobre el
              plano de la base A′B′C′: la charnela es la horizontal de ese plano que pasa por B′, y
              su planta es B₁B′₁. B cae en la **perpendicular a B₁B′₁ por B₁**: la escuadra,
              apoyada en B₁B′₁, la da. Larga, hacia la derecha, donde hay sitio fuera del prisma.
          - con: compas
            traza: 'arco(figura.punto("B1"), por: solucion.B_ab, desde: desplaza(solucion.B_ab, dx: -3.70, dy: -11.40), hasta: desplaza(solucion.B_ab, dx: 2.49, dy: 11.72))'
            toma: segmento2(figura.punto("B2"), solucion.H_B)
            bloque: Abatimiento del proyectante de BB′
            porque: |
              Con el compás, B₂H, la diferencia de cotas, llevada desde B₁ sobre la perpendicular.
              Al otro lado de B₁ valdría igual: el triángulo saldría reflejado, con el mismo ángulo.
          - con: marca
            traza: solucion.B_ab
            rotulo: (B)
            bloque: Abatimiento del proyectante de BB′
            porque: |
              (B), donde el arco corta la perpendicular por B₁: B abatido sobre el plano de A′B′C′,
              el extremo que se pide, a la diferencia de cotas de B y B′ desde B₁.
          - con: regla
            traza: segmento2(figura.punto("B1p"), solucion.B_ab)
            bloque: Abatimiento del proyectante de BB′
            porque: |
              B′₁(B) es BB′ en **verdadera magnitud**, 74,8 mm. B′ es el extremo que no se ha movido,
              y el ángulo del triángulo en B′₁, entre B′₁B₁ y B′₁(B), es **β**: 32,7°.
        pista: |
          (1) En el alzado, mide la diferencia de cotas de B y B′: la distancia entre las dos
          horizontales de las bases. (2) Por B₁ —o por B′₁—, traza la perpendicular a B₁B′₁.
          (3) Lleva sobre ella esa diferencia con el compás: ahí está el extremo abatido.
        desarrollo: |
          El extremo abatido está a 40,39 mm de B₁ (o de B′₁), en la perpendicular a B₁B′₁. Con
          el otro extremo de la planta forma BB′ en verdadera magnitud, 74,82 mm, y el ángulo
          del triángulo en el extremo que no se ha movido es β.

      - tipo: calcular
        titulo: El ángulo α
        # Decisión: dos rectas que se cortan forman dos ángulos suplementarios, y se
        # pide el menor, que es el convenio de «ángulo entre rectas» (y el de
        # angulo_rectas, de 0 a 90°). El ángulo del triángulo en B, 110,77°, va de
        # distractor con un mensaje que reconoce que la construcción es la misma.
        # La hoja no dice cuál de los dos espera el corrector, y el ejercicio lo
        # declara en las «Notas nuestras», en ese mensaje, en la resolución y en
        # el justificar. Es una pregunta abierta para Ionan (tasks/pendiente.md).
        pregunta: α, el ángulo entre las rectas AB y BC; de los dos que forman, el menor.
        respuesta:
          tipo: numero
          valor: '69.23'
          receta: alfa
          tolerancia: 0.5
          formato: un número, en grados
        distractores:
          - valor: '110.77'
            receta: 180 - alfa
            mensaje: |
              Ese es el ángulo del triángulo ABC en B, de B₁A₁ a B₁C₁, y la construcción es la
              buena. La hoja no dice cuál de los dos ángulos suplementarios espera; aquí se pide
              el menor, que es el convenio del ángulo entre dos rectas: 180° − 110,8° = 69,2°.
          - valor: '20.77'
            receta: 90 - alfa
            mensaje: |
              Ese es el **complementario** de α, lo que le falta para 90°. α se mide entre B₁A₁
              y B₁C₁, o sus prolongaciones, no contra la perpendicular a una de ellas.
        pista: |
          AB y BC son horizontales: mide el ángulo en la planta, en B₁. Si sale más de 90°, el
          de las rectas es su suplementario.
        desarrollo: |
          B₁ está en la mediatriz de A₁C₁, 11,98 mm por debajo de ese lado, que mide 34,71 mm,
          así que el triángulo tiene en B un ángulo de $2\arctan\frac{17{,}36}{11{,}98} = 110{,}77^{\circ}$, y las rectas forman
          $$ \alpha = 180^{\circ} - 110{,}77^{\circ} = 69{,}23^{\circ} $$

      - tipo: calcular
        titulo: El ángulo β
        pregunta: β, el ángulo entre el plano A′B′C′ y la recta BB′.
        respuesta:
          tipo: numero
          valor: '32.67'
          receta: beta
          tolerancia: 0.5
          formato: un número, en grados
        distractores:
          - valor: '57.33'
            receta: 90 - beta
            mensaje: |
              Ese es el ángulo de BB′ con la **vertical**, la perpendicular al plano A′B′C′: el
              complementario de β. En el triángulo abatido, β es el ángulo del extremo que no
              se ha movido, entre la planta y la verdadera magnitud.
          - valor: '68.02'
            receta: angulo_con_ph(segmento3(B, solucion.Bp_frontal))
            mensaje: |
              Es lo que forma **B₂B′₂ con la recta A′₂C′₂ en el alzado**. Ahí el plano A′B′C′ se
              ve de canto, pero BB′ no es frontal y el alzado deforma su ángulo: solo sería β
              si BB′ fuera paralela al plano vertical.
          - valor: '54.40'
            receta: angulo_con_pv(segmento3(B, Bp))
            mensaje: |
              Ese es el ángulo de BB′ con el **plano vertical**, el que da el triángulo abatido
              sobre el alzado. β se mide contra A′B′C′, que es horizontal: el triángulo va en la
              planta, con la diferencia de cotas.
        pista: |
          Es el ángulo del triángulo abatido en el extremo que no se ha movido: su tangente es
          la diferencia de cotas partida por lo que mide la planta de BB′.
        desarrollo: |
          $$ \beta = \arctan\frac{\Delta z}{\overline{B_1B'_1}} = \arctan\frac{40{,}39}{62{,}98} \approx 32{,}67^{\circ} $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: 'A₂, B₂ y C₂ están en una horizontal del alzado: el plano ABC es horizontal, y la planta lo da en verdadera magnitud.'
          - texto: α se mide en la planta, en B₁; de los dos ángulos suplementarios que forman las rectas se da el menor, que es el convenio del ángulo entre rectas.
          - texto: A′B′C′ también es horizontal, así que el ángulo de BB′ con ese plano es el que forma BB′ con el plano horizontal.
          - texto: Se abate el plano proyectante de BB′ sobre la planta, con la diferencia de cotas de B y B′ en la perpendicular a B₁B′₁, y el ángulo del triángulo en el extremo fijo es β.
          - texto: β se mide en el alzado, entre B₂B′₂ y la recta A′₂C′₂, porque ahí el plano A′B′C′ se ve de canto.
            trampa: true
            mensaje: |
              Que el plano se vea de canto no basta: hace falta además que BB′ esté en
              verdadera magnitud en esa vista, y BB′ no es frontal. Ese ángulo mide 68,0°, y β,
              32,7°.

    resolucion: |
      **Qué es horizontal.** A₂, B₂ y C₂ están en una misma horizontal del alzado, y A′₂, B′₂
      y C′₂ en otra: las dos bases del prisma son planos horizontales. Las aristas laterales
      son paralelas entre sí y oblicuas: no son horizontales ni frontales.

      **α, en la planta.** AB y BC están en la base ABC, que es horizontal, así que la planta
      da el triángulo en verdadera magnitud y el ángulo se mide en B₁, sin construir nada.
      El triángulo tiene en B 110,8°. Dos rectas que se cortan forman dos ángulos
      suplementarios, y el ángulo entre las rectas es el menor: α = 69,2°. La hoja no
      precisa cuál de los dos quiere: el menor es el convenio del ángulo entre rectas, y es
      el que se pide aquí; el del triángulo, 110,8°, sale de la misma medida.

      **β, abatiendo.** BB′ corta a la base A′B′C′ en B′, y como esa base es horizontal, el
      ángulo de BB′ con ella es el que forma con el plano horizontal. Ni el alzado ni la
      planta dan BB′ en verdadera magnitud: se abate su plano proyectante sobre la planta,
      llevando en la perpendicular a B₁B′₁ la diferencia de cotas de B y B′, 40,39 mm, que se
      mide en el alzado. El triángulo rectángulo tiene por catetos la planta, 62,98 mm, y esa
      diferencia; su hipotenusa es BB′ en verdadera magnitud, 74,82 mm, y su ángulo en el
      extremo fijo es β = 32,7°.

      **Lo que no es β.** En el alzado, B₂B′₂ forma 68,0° con la recta A′₂C′₂, pero BB′ no es
      frontal y ese ángulo está deformado. Abatiendo sobre el alzado sale 54,4°, que es el
      ángulo de BB′ con el plano vertical, y 57,3° es el que forma con la vertical.

  # ── 1 c y d · Las dos distancias. Lo que enseña: la perpendicular a un
  #    plano se traza contra sus horizontales y sus frontales, no contra una
  #    arista; y dos rectas cuyas proyecciones se cortan pueden cruzarse.
  - id: exeg-h55-1cd-distancias-a-una-cara-y-entre-dos-rectas
    titulo: La distancia de un punto a una cara, y la de dos rectas que se cruzan
    fuente: >-
      Ejercicio 55, apartado 1 (c y d) · Colección de ejercicios de Geometría
      Descriptiva, Sistema Diédrico Directo · Dpto. de Expresión Gráfica y
      Proyectos de Ingeniería, EIG · UPV/EHU. El 55 (págs. 64-66; este
      apartado, en las 64 y 65) es uno de los cuatro ejercicios de varios
      apartados con que cierra la colección, todos sin fecha, y de ellos solo el
      54 se titula «Examen». Se transcribe el castellano; la figura se redibuja
      desde sus coordenadas.
    nivel: examen
    # Decisión: como en la pieza de a y b. «ente» es errata de la hoja, y se
    # conserva (§08).
    enunciado: |
      En la figura en escala 1:1 que se muestra, se pide determinar gráficamente:

      c. La distancia mínima entre el punto Z′ y el plano BCB′C′ ($d$) indicando posición y magnitud.

      d. La distancia mínima ente las rectas BB′ y ZZ′ ($t$) indicando posición y magnitud.

      **Notas nuestras.** La figura es la de abajo de la segunda página del
      Ejercicio 55: el mismo prisma de 1 a y 1 b, con la recta ZZ′ añadida, en
      alzado (arriba) y en planta (abajo). La hoja dibuja todas las aristas en
      continua; en la planta, A′₁C′₁ quedaría oculta. «Posición» quiere decir
      dónde está el segmento de la distancia mínima en las dos vistas; la versión
      en euskera de 1 c lo dice aparte: que se señale en las vistas
      dadas. La hoja trae arriba a la derecha, junto a la figura de 1 a y
      1 b, la casilla de $\alpha$, $\beta$, $d$ y $t$. Escala 1:1: lo que mides
      en la lámina, en milímetros, es el resultado. «ente», en 1 d, es
      errata de la hoja por «entre», y se deja tal como está impresa.
    pide: El pie de la perpendicular desde Z′ a la cara BCB′C′ y la distancia d; los extremos de la perpendicular común a BB′ y ZZ′ y la distancia t; todo en las dos vistas.
    receta:
      lamina: ex55-1cd
      escena:
        B: 'punto3(alzado: figura.punto("B2"), planta: figura.punto("B1"))'
        C: 'punto3(alzado: figura.punto("C2"), planta: figura.punto("C1"))'
        Bp: 'punto3(alzado: figura.punto("B2p"), planta: figura.punto("B1p"))'
        Cp: 'punto3(alzado: figura.punto("C2p"), planta: figura.punto("C1p"))'
        Z: 'punto3(alzado: figura.punto("Z2"), planta: figura.punto("Z1"))'
        Zp: 'punto3(alzado: figura.punto("Z2p"), planta: figura.punto("Z1p"))'
        cara: plano(B, C, Bp)
        BBp: recta3(B, Bp)
        ZZp: recta3(Z, Zp)
      solucion:
        perp: perpendicular_a_plano(Zp, cara)
        H: pie_en_plano(Zp, cara)
        d_mm: en_mm(distancia_a_plano(Zp, cara))
        N: pie_comun(ZZp, BBp)
        M: pie_comun(BBp, ZZp)
        t_mm: en_mm(distancia_rectas(BBp, ZZp))
        # El plano vertical que contiene BB′: su corte con ZZ′ es el punto de ZZ′
        # cuya planta cae en B₁B′₁, el cruce aparente de las dos plantas.
        vertical_de_BB: 'plano(B, Bp, punto3(alzado: desplaza(figura.punto("B2"), dy: mm(-10)), planta: figura.punto("B1")))'
        cruce: corte_recta_plano(ZZp, vertical_de_BB)
        # Para la construcción paso a paso. H, sin cambio de plano: el plano
        # vertical que contiene la perpendicular desde Z′ (H_alto está encima
        # de H y lo fija) corta a la cara en la recta que une I1, en BB′, e I2,
        # en B′C′; esa recta, prolongada, corta el alzado de la perpendicular
        # en H₂.
        H_alto: 'punto3(alzado: desplaza(proy_alzado(H), dy: mm(-10)), planta: proy_planta(H))'
        aux: plano(Zp, H, H_alto)
        I1: corte_recta_plano(BBp, aux)
        I2: corte_recta_plano(recta3(Bp, Cp), aux)
        # K, el punto de BB′ con el alejamiento de C′: KC′ es una frontal de la
        # cara, y en el alzado la perpendicular va perpendicular a ella. El
        # plano frontal de C′ se fija con dos puntos corridos desde C′.
        Cp_lado: 'punto3(alzado: desplaza(figura.punto("C2p"), dx: mm(-10)), planta: desplaza(figura.punto("C1p"), dx: mm(-10)))'
        Cp_alto: 'punto3(alzado: desplaza(figura.punto("C2p"), dy: mm(-10)), planta: figura.punto("C1p"))'
        K: corte_recta_plano(BBp, plano(Cp, Cp_lado, Cp_alto))
        # t, con dos cambios de plano que ponen BB′ de punta. La primera línea
        # nueva, paralela a B₁B′₁ y a 48 mm de ella, a la derecha de la planta;
        # P, donde la corta la proyectante de B₁; n1_a y n1_b, los extremos de
        # lo que se dibuja de ella. La referencia del primer cambio es B′, y la
        # del segundo, B.
        prB1: 'perpendicular(por: figura.punto("B1"), a: figura.segmento("BB1"))'
        P: 'uno(medir_sobre(prB1, desde: figura.punto("B1"), distancia: mm(48)), 2)'
        nueva1: 'perpendicular(por: P, a: prB1)'
        n1_a: 'uno(medir_sobre(nueva1, desde: P, distancia: mm(6)), 1)'
        arcP_a: 'uno(medir_sobre(nueva1, desde: P, distancia: mm(4)), 1)'
        arcP_b: 'uno(medir_sobre(nueva1, desde: P, distancia: mm(4)), 2)'
        n1_b: 'uno(medir_sobre(nueva1, desde: P, distancia: vm_planta(B, Bp) + mm(6)), 2)'
        B_4: 'cambio_plano_vertical(B, nueva1, ref: Bp)'
        Bp_4: 'cambio_plano_vertical(Bp, nueva1, ref: Bp)'
        Z_4: 'cambio_plano_vertical(Z, nueva1, ref: Bp)'
        Zp_4: 'cambio_plano_vertical(Zp, nueva1, ref: Bp)'
        N_4: 'cambio_plano_vertical(N, nueva1, ref: Bp)'
        M_4: 'cambio_plano_vertical(M, nueva1, ref: Bp)'
        # J, al pie de la vertical de B₂ en A′₂C′₂: B₂J es lo que B está más
        # alto que B′, la cota que lleva B₄.
        J: 'pie_perpendicular(figura.punto("B2"), figura.segmento("ApBpCp2"))'
        # La segunda línea nueva, perpendicular a B₄B′₄, 15 mm más allá de B₄;
        # B5 es donde la corta B₄B′₄ prolongada.
        B5: 'uno(medir_sobre(segmento2(Bp_4, B_4), desde: B_4, distancia: mm(15)), 1)'
        nueva2: 'perpendicular(por: B5, a: segmento2(Bp_4, B_4))'
        arcB5_a: 'uno(medir_sobre(nueva2, desde: B5, distancia: mm(3)), 1)'
        arcB5_b: 'uno(medir_sobre(nueva2, desde: B5, distancia: mm(3)), 2)'
        Z_5: 'cambio_plano_vertical(Z, nueva1, ref: Bp, luego: nueva2, ref2: B)'
        Zp_5: 'cambio_plano_vertical(Zp, nueva1, ref: Bp, luego: nueva2, ref2: B)'
        N_5: 'cambio_plano_vertical(N, nueva1, ref: Bp, luego: nueva2, ref2: B)'
        # R y S, los pies de Z₄ y de Z′₄ en la segunda línea nueva, desde donde
        # el compás lleva lo que Z y Z′ están más cerca o más lejos de la
        # primera línea que B. Lo de Z se mide en la proyectante de B₁, de B₁
        # a G, con la paralela a B₁B′₁ por Z₁; lo de Z′, en la suya, de Z′₁ a
        # F, en B₁B′₁.
        R: 'pie_perpendicular(Z_4, nueva2)'
        S: 'pie_perpendicular(Zp_4, nueva2)'
        G: 'pie_perpendicular(figura.punto("B1"), perpendicular(por: figura.punto("Z1"), a: prB1))'
        F: 'pie_perpendicular(figura.punto("Z1p"), figura.segmento("BB1"))'
        # Los extremos de las rectas largas de la construcción: en el papel se
        # trazan más allá del punto que van a dar, y no paran en él.
        L_ppA: 'uno(medir_sobre(perpendicular(por: figura.punto("Z1p"), a: figura.segmento("CB1")), desde: proy_planta(I2), distancia: mm(5)), 2)'
        L_vI1: 'desplaza(proy_alzado(I1), dy: mm(-4))'
        L_vI2: 'desplaza(proy_alzado(I2), dy: mm(-3))'
        L_12: 'uno(medir_sobre(segmento2(proy_alzado(I2), proy_alzado(I1)), desde: proy_alzado(H), distancia: mm(5)), 1)'
        L_vK: 'desplaza(proy_alzado(K), dy: mm(-4))'
        L_pa: 'uno(medir_sobre(proy_alzado(segmento3(Zp, H)), desde: proy_alzado(H), distancia: mm(6)), 1)'
        L_vH: 'desplaza(proy_planta(H), dy: mm(5))'
        L_pB: 'uno(medir_sobre(prB1, desde: B_4, distancia: mm(5)), 2)'
        L_pBp: 'uno(medir_sobre(perpendicular(por: figura.punto("B1p"), a: figura.segmento("BB1")), desde: Bp_4, distancia: mm(5)), 2)'
        L_pZ: 'uno(medir_sobre(perpendicular(por: figura.punto("Z1"), a: figura.segmento("BB1")), desde: Z_4, distancia: mm(5)), 2)'
        L_pZp: 'uno(medir_sobre(perpendicular(por: figura.punto("Z1p"), a: figura.segmento("BB1")), desde: Zp_4, distancia: mm(5)), 2)'
        L_J: 'desplaza(J, dy: mm(2))'
        L_par4: 'uno(medir_sobre(perpendicular(por: B_4, a: prB1), desde: Z_4, distancia: mm(5)), 2)'
        L_BB5: 'uno(medir_sobre(segmento2(Bp_4, B_4), desde: B5, distancia: mm(5)), 1)'
        n2_a: 'uno(medir_sobre(nueva2, desde: R, distancia: mm(4)), 1)'
        n2_b: 'uno(medir_sobre(nueva2, desde: S, distancia: mm(4)), 2)'
        L_pRa: 'uno(medir_sobre(perpendicular(por: Z_4, a: nueva2), desde: R, distancia: mm(4)), 2)'
        L_pRb: 'uno(medir_sobre(perpendicular(por: Z_4, a: nueva2), desde: Z_5, distancia: mm(4)), 1)'
        L_pS: 'uno(medir_sobre(perpendicular(por: Zp_4, a: nueva2), desde: Zp_5, distancia: mm(4)), 2)'
        L_parZ: 'uno(medir_sobre(perpendicular(por: figura.punto("Z1"), a: prB1), desde: G, distancia: mm(4)), 1)'
        L_t: 'uno(medir_sobre(segmento2(B5, N_5), desde: N_5, distancia: mm(5)), 1)'
        L_N5: 'uno(medir_sobre(segmento2(N_5, N_4), desde: N_4, distancia: mm(5)), 1)'
        L_NM4: 'uno(medir_sobre(segmento2(N_4, M_4), desde: M_4, distancia: mm(5)), 1)'
        L_N1: 'uno(medir_sobre(segmento2(N_4, proy_planta(N)), desde: proy_planta(N), distancia: mm(5)), 1)'
        L_M1: 'uno(medir_sobre(segmento2(M_4, proy_planta(M)), desde: proy_planta(M), distancia: mm(5)), 1)'
        L_N2: 'desplaza(proy_alzado(N), dy: mm(-5))'
        L_M2: 'desplaza(proy_alzado(M), dy: mm(-5))'
      comprueba:
        - en_plano(Cp, cara)
    pasos:
      - tipo: reconocer
        pregunta: ¿Cómo se trazan las proyecciones de la perpendicular desde Z′ al plano BCB′C′?
        opciones:
          - texto: En la planta, perpendicular a las horizontales del plano; en el alzado, perpendicular a sus frontales
            correcta: true
            mensaje: |
              Eso es. Una perpendicular a un plano lo es a todas sus rectas, y el ángulo recto
              se ve recto en la vista donde la recta del plano está en verdadera magnitud: la
              horizontal en la planta y la frontal en el alzado. Aquí BC es una horizontal del
              plano, así que en la planta va perpendicular a B₁C₁.
          - texto: En las dos vistas, perpendicular a las proyecciones de la arista BB′, que es una recta del plano
            mensaje: |
              BB′ no es horizontal ni frontal, y el ángulo recto con ella no se ve recto en
              ninguna de las dos vistas. Se usan las rectas del plano que sí están en verdadera
              magnitud en cada vista: una horizontal y una frontal.
          - texto: En la planta, perpendicular a B₁C₁, y en el alzado, perpendicular a B₂C₂
            mensaje: |
              En la planta, sí: BC es horizontal. En el alzado una horizontal se ve como una
              recta horizontal, y su perpendicular sería vertical, que no es la buena. En el
              alzado manda la **frontal** del plano, no la horizontal.

      - tipo: construir
        titulo: Los pies de las dos distancias
        intro: |
          Llamamos H al pie de la perpendicular desde Z′ al plano BCB′C′, y M y N a los
          extremos de la perpendicular común, M en BB′ y N en ZZ′. Marca H en el alzado y en la
          planta, y después N y M en las dos vistas.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, borrar]
        tolerancia: 1
        objetivos:
          - nombre: H2
            pide: el pie de la perpendicular desde Z′ al plano, en el alzado
            es: proy_alzado(solucion.H)
            bien: |
              H₂ está en la perpendicular al plano por Z′₂, donde corta al plano. H cae fuera de
              la cara, al otro lado de la arista BB′: el plano no se acaba en sus aristas.
            diagnosticos:
              - si: cerca_de(proy_alzado(pie_perpendicular(Zp, BBp)))
                mensaje: |
                  Ese es el pie de la perpendicular desde Z′ a la **arista BB′**, no al plano.
                  Aquí caen cerca, porque H queda muy cerca de esa arista, pero no son el mismo
                  punto: la perpendicular a una recta de la cara no es la perpendicular a la cara.
                ejemplo: proy_alzado(pie_perpendicular(Zp, BBp))
              - si: en_vertical_de(figura.punto("Z2p"))
                mensaje: |
                  Has trazado en el alzado la perpendicular a B₂C₂, que es horizontal, y te ha
                  salido vertical. En el alzado la perpendicular va contra las **frontales** del
                  plano: busca dos puntos de BB′ y de CC′ con el mismo alejamiento.
                ejemplo: 'desplaza(figura.punto("Z2p"), dy: mm(-20))'
              - si: en_recta(proy_alzado(solucion.perp))
                mensaje: |
                  Vas por la perpendicular al plano, pero H es donde esa perpendicular **corta**
                  al plano, ni antes ni después. El corte se encuentra con un plano auxiliar
                  proyectante que la contenga, o poniendo el plano de canto con un cambio de plano.
                ejemplo: punto_medio(proy_alzado(segmento3(Zp, solucion.H)))
              - si: siempre
                mensaje: |
                  H₂ está en la perpendicular al plano por Z′₂ —perpendicular a las frontales del
                  plano— y en el plano: donde esa recta lo corta.
          - nombre: H1
            pide: el pie de la perpendicular desde Z′ al plano, en la planta
            es: proy_planta(solucion.H)
            bien: |
              H₁ está en la vertical de H₂, sobre la perpendicular a B₁C₁ por Z′₁.
            diagnosticos:
              - si: 'es_pie_perpendicular(desde: figura.punto("Z1p"), sobre: figura.segmento("CB1"))'
                mensaje: |
                  Ese es el pie sobre la **prolongación de B₁C₁**, en la planta. La perpendicular
                  va bien, perpendicular a B₁C₁, pero H no es donde toca la planta de esa
                  horizontal: es donde la perpendicular corta al plano, y eso lo dice H₂.
                ejemplo: pie_perpendicular(figura.punto("Z1p"), figura.segmento("CB1"))
              - si: '!en_vertical_de(H2)'
                mensaje: |
                  H₁ va en la **vertical de H₂**: son el mismo punto visto dos veces.
                ejemplo: 'desplaza(proy_planta(solucion.H), dx: mm(8))'
              - si: siempre
                mensaje: |
                  Si ya tienes H₂: H₁ está en su vertical, sobre la perpendicular a B₁C₁ que pasa
                  por Z′₁.
          - nombre: N1
            pide: el extremo de la perpendicular común sobre ZZ′, en la planta
            es: proy_planta(solucion.N)
            bien: |
              N₁ está en Z₁Z′₁, al pie de la perpendicular común: la recta que corta a BB′ y a
              ZZ′ formando ángulo recto con las dos.
            diagnosticos:
              - si: cerca_de(proy_planta(solucion.cruce))
                mensaje: |
                  Ahí se cortan B₁B′₁ y Z₁Z′₁ en la planta, pero ese cruce es **aparente**: en el
                  alzado las dos rectas se cortan en otra vertical. BB′ y ZZ′ se cruzan, no tienen
                  ningún punto común, y la distancia mínima es la de la perpendicular común.
                ejemplo: proy_planta(solucion.cruce)
              - si: cerca_de(proy_planta(pie_perpendicular(Bp, ZZp)))
                mensaje: |
                  Esa es la perpendicular desde **B′** a ZZ′, desde un punto cualquiera de BB′. La
                  común tiene que ser perpendicular a las dos rectas a la vez; con BB′ de punta
                  —dos cambios de plano— se ve en verdadera magnitud.
                ejemplo: proy_planta(pie_perpendicular(Bp, ZZp))
              - si: en_segmento(figura.segmento("ZZ1"))
                mensaje: |
                  N está en ZZ′, pero en un punto concreto: el pie de la perpendicular común.
                  Pon BB′ de punta con dos cambios de plano; desde ese punto, la perpendicular a
                  la nueva proyección de ZZ′ da N.
                ejemplo: punto_medio(figura.segmento("ZZ1"))
              - si: siempre
                mensaje: |
                  N es un punto de ZZ′: N₁ tiene que estar en Z₁Z′₁, al pie de la perpendicular
                  común.
          - nombre: N2
            pide: el extremo de la perpendicular común sobre ZZ′, en el alzado
            es: proy_alzado(solucion.N)
            bien: |
              N₂ está en Z₂Z′₂, en la vertical de N₁.
            diagnosticos:
              - si: '!en_vertical_de(N1)'
                mensaje: |
                  N₂ va en la **vertical de N₁**: son el mismo punto visto dos veces.
                ejemplo: 'desplaza(proy_alzado(solucion.N), dx: mm(8))'
              - si: siempre
                mensaje: |
                  Si ya tienes N₁: N₂ está en su vertical, donde esa vertical corta a Z₂Z′₂.
          - nombre: M1
            pide: el extremo de la perpendicular común sobre BB′, en la planta
            es: proy_planta(solucion.M)
            bien: |
              M₁ está en B₁B′₁, al otro extremo de la perpendicular común. MN es perpendicular a
              BB′ y a ZZ′, y su verdadera magnitud es t.
            diagnosticos:
              - si: cerca_de(proy_planta(solucion.cruce))
                mensaje: |
                  Ahí se cortan B₁B′₁ y Z₁Z′₁ en la planta, pero el cruce es **aparente**: en el
                  alzado se cortan en otra vertical. BB′ y ZZ′ se cruzan, y M es el pie de la
                  perpendicular común, no un punto común.
                ejemplo: proy_planta(solucion.cruce)
              - si: cerca_de(proy_planta(pie_perpendicular(Zp, BBp)))
                mensaje: |
                  Esa es la perpendicular desde **Z′** a BB′, desde un extremo de ZZ′. La común es
                  perpendicular a las dos rectas, y sale de N, no de Z′.
                ejemplo: proy_planta(pie_perpendicular(Zp, BBp))
              - si: en_segmento(figura.segmento("BB1"))
                mensaje: |
                  M está en BB′, pero en un punto concreto: el otro extremo de la perpendicular
                  común. Sale de N, perpendicular a BB′ en la vista donde BB′ está en verdadera
                  magnitud.
                ejemplo: punto_medio(figura.segmento("BB1"))
              - si: siempre
                mensaje: |
                  M es un punto de BB′: M₁ tiene que estar en B₁B′₁, al pie de la perpendicular
                  común.
          - nombre: M2
            pide: el extremo de la perpendicular común sobre BB′, en el alzado
            es: proy_alzado(solucion.M)
            bien: |
              M₂ está en B₂B′₂, en la vertical de M₁.
            diagnosticos:
              - si: '!en_vertical_de(M1)'
                mensaje: |
                  M₂ va en la **vertical de M₁**: son el mismo punto visto dos veces.
                ejemplo: 'desplaza(proy_alzado(solucion.M), dx: mm(8))'
              - si: siempre
                mensaje: |
                  Si ya tienes M₁: M₂ está en su vertical, donde esa vertical corta a B₂B′₂.
        trazado:
          - proy_alzado(segmento3(Zp, solucion.H))
          - proy_planta(segmento3(Zp, solucion.H))
          - proy_alzado(segmento3(solucion.M, solucion.N))
          - proy_planta(segmento3(solucion.M, solucion.N))
        bloques:
          - nombre: 1.er cambio de plano
            explica: |
              Para t hace falta ver BB′ de punta, y eso pide dos cambios de plano; el enunciado no
              fija método, y los cambios y el sitio de sus líneas nuevas son nuestros. En el primero
              se cambia el plano vertical por uno paralelo a BB′: la línea nueva va paralela a B₁B′₁,
              y en la vista 4 BB′ sale en verdadera magnitud. La planta no cambia y cada punto
              conserva su cota
              ([tema 3](/road-to-ingenieria/expresion-grafica/t03-metodos-descriptivos/#el-cambio-de-plano-una-vista-nueva)),
              contada desde la de B′, la referencia, que cae en la línea nueva. Z′ está a la cota de
              B′ y cae también en ella; B y Z, a la de B, se apartan hacia fuera lo que B está más
              alto que B′. Z₄Z′₄ es ZZ′ en la vista 4, y hace falta para el segundo cambio.
          - nombre: 2.º cambio de plano
            explica: |
              El segundo cambio parte de la vista 4 y deja atrás la planta. Su línea nueva va
              perpendicular a B₄B′₄: BB′ está en verdadera magnitud en la vista 4, y así en la vista 5
              se ve de punta, B₅ ≡ B′₅. Cada punto sale de la vista 4 por la paralela a B₄B′₄ y lleva
              lo que su planta está más lejos o más cerca de la primera línea nueva que B₁, porque
              ahora la referencia es B
              ([tema 3](/road-to-ingenieria/expresion-grafica/t03-metodos-descriptivos/#un-plano-en-dos-cambios));
              en la planta, B₁G para Z y Z′₁F para Z′. Con BB′ de punta, toda recta perpendicular a
              BB′ se ve en verdadera magnitud, y la perpendicular común es la perpendicular desde B₅ a
              Z₅Z′₅: B₅N₅ es t.
          - nombre: Vuelta a las vistas de la hoja
            explica: |
              N y M vuelven deshaciendo los dos cambios, del último al primero. De la vista 5 a la 4,
              N₅ va por su referencia, paralela a B₄B′₄, hasta Z₄Z′₄, porque N está en ZZ′; en la
              vista 4 BB′ está en verdadera magnitud, así que el ángulo recto de MN con BB′ se ve
              recto, y la perpendicular a B₄B′₄ por N₄ da M₄, que en la vista 5 caía en el punto B₅.
              De la vista 4 a la planta se va por las perpendiculares a la primera línea nueva, y de
              la planta al alzado, por las verticales.
        construccion:
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("Z1p"), solucion.L_ppA)
            guia: figura.segmento("CB1")
            porque: |
              **La distancia d.** La pista la saca con un cambio de plano; aquí va por el segundo
              camino de la resolución, el **plano auxiliar**, porque la franja libre de la derecha es
              para los dos cambios de plano de t. La perpendicular desde Z′ a la cara se traza contra
              las rectas de la cara que están en verdadera magnitud: una horizontal en la planta y una
              frontal en el alzado. BC es una **horizontal** de la cara —B₂C₂ está en la horizontal de
              arriba del alzado—: por Z′₁, la **planta de la perpendicular**, perpendicular a B₁C₁,
              larga, hasta cruzar B₁B′₁ y B′₁C′₁.
          - con: marca
            traza: proy_planta(solucion.I1)
            rotulo: 1₁
            porque: |
              1₁, donde la planta de la perpendicular corta B₁B′₁. El punto 1 está en la cara y en el
              plano vertical que contiene la perpendicular.
          - con: marca
            traza: proy_planta(solucion.I2)
            rotulo: 2₁
            porque: |
              2₁, donde la planta de la perpendicular corta B′₁C′₁: el punto 2, otro punto de la cara
              y de ese plano vertical.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(solucion.I1), solucion.L_vI1), segmento2(proy_planta(solucion.I2), solucion.L_vI2)]'
            guia: figura.segmento("AC1")
            porque: |
              Por 1₁ y por 2₁, las líneas de referencia hasta el alzado, perpendiculares a A₁C₁: 1 es
              un punto de BB′ y 2, de B′C′.
          - con: marca
            traza: proy_alzado(solucion.I1)
            rotulo: 1₂
            porque: |
              1₂, donde la vertical de 1₁ corta B₂B′₂.
          - con: marca
            traza: proy_alzado(solucion.I2)
            rotulo: 2₂
            porque: |
              2₂, donde la vertical de 2₁ corta A′₂C′₂: B′C′ es horizontal, y su alzado está en esa
              recta.
          - con: regla
            traza: segmento2(proy_alzado(solucion.I2), solucion.L_12)
            porque: |
              2₂1₂ es la **intersección** del plano vertical con la cara, vista en el alzado. La
              perpendicular está en ese plano vertical, así que corta a la cara en un punto de esta
              recta. Con la regla, de 2₂ por 1₂ y más allá, larga: el pie cae fuera de la cara.
          - con: marca
            traza: proy_planta(solucion.K)
            rotulo: K₁
            porque: |
              K₁, donde A′₁C′₁ corta B₁B′₁. A′₁C′₁ es horizontal en la planta, así que K tiene el
              alejamiento de C′, y KC′ es una **frontal** de la cara.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.K), solucion.L_vK)
            guia: figura.segmento("AC1")
            porque: |
              Por K₁, la línea de referencia hasta B₂B′₂: K es un punto de BB′.
          - con: marca
            traza: proy_alzado(solucion.K)
            rotulo: K₂
            porque: |
              K₂, donde la vertical de K₁ corta B₂B′₂.
          - con: regla
            traza: segmento2(proy_alzado(solucion.K), figura.punto("C2p"))
            rotulo: f₂
            porque: |
              f₂, de K₂ a C′₂: la frontal de la cara en el alzado, donde está en verdadera magnitud.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(Zp), solucion.L_pa)
            guia: segmento2(proy_alzado(solucion.K), figura.punto("C2p"))
            porque: |
              Por Z′₂, el **alzado de la perpendicular**: perpendicular a f₂, porque el ángulo recto con
              una frontal se ve recto en el alzado. Larga, hasta pasar 2₂1₂ prolongada.
          - con: marca
            traza: proy_alzado(solucion.H)
            porque: |
              H₂, donde el alzado de la perpendicular corta 2₂1₂ prolongada: el pie de la
              perpendicular en la cara. Cae a la izquierda de B₂B′₂, fuera de la cara dibujada: el
              plano no se acaba en sus aristas. Va sin rótulo, que tocaría el punto M₂, que sale
              después.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(solucion.H), solucion.L_vH)
            guia: figura.segmento("AC1")
            porque: |
              Por H₂, la línea de referencia hasta la planta de la perpendicular, larga.
          - con: marca
            traza: proy_planta(solucion.H)
            rotulo: H₁
            porque: |
              H₁, donde esa vertical corta la planta de la perpendicular. Z′H es la distancia d, que
              no está en verdadera magnitud en ninguna de las dos vistas: mide 30,85 mm.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("B1"), solucion.L_pB)
            guia: figura.segmento("BB1")
            bloque: 1.er cambio de plano
            porque: |
              **La distancia t.** BB′ y ZZ′ se cruzan, y la distancia mínima va por su perpendicular
              común, que se ve en verdadera magnitud con BB′ de punta: hacen falta dos **cambios de
              plano**. El primero, vertical, sale de la planta y lleva cotas. Su línea nueva va
              paralela a B₁B′₁, para que BB′ salga en verdadera magnitud, y a la derecha de la
              planta, donde hay sitio. Antes, la perpendicular a B₁B′₁ por B₁, larga: sobre ella se
              mide lo que la línea nueva dista de B₁, y en ella caerá B₄.
          - con: compas
            traza: 'arco(figura.punto("B1"), por: solucion.P, desde: solucion.arcP_a, hasta: solucion.arcP_b)'
            bloque: 1.er cambio de plano
            porque: |
              Con el compás, la punta en B₁ y abierto 48 mm, un arco que corta esa perpendicular: es
              lo que la línea nueva va a distar de B₁B′₁. Los 48 mm son nuestros: dejan la vista
              nueva a la derecha de la planta, donde hay sitio.
          - con: marca
            traza: solucion.P
            rotulo: P
            bloque: 1.er cambio de plano
            porque: |
              P, donde el arco corta la perpendicular de B₁: a 48 mm de B₁, sobre la proyectante de B.
              Por P pasa la línea nueva, y desde él se lleva la cota de B.
          - con: escuadra-cartabon
            traza: '[segmento2(solucion.P, solucion.n1_a), segmento2(solucion.P, solucion.n1_b)]'
            guia: figura.segmento("BB1")
            rotulo: primera línea nueva
            bloque: 1.er cambio de plano
            porque: |
              La **primera línea nueva**, por P y paralela a B₁B′₁ (perpendicular a la proyectante de
              B₁): un poco más allá de P, y larga hacia abajo, hasta pasar las proyectantes de B′₁ y
              de Z′₁, que se trazan ahora.
          - con: escuadra-cartabon
            traza: '[segmento2(figura.punto("B1p"), solucion.L_pBp), segmento2(figura.punto("Z1"), solucion.L_pZ), segmento2(figura.punto("Z1p"), solucion.L_pZp)]'
            guia: figura.segmento("BB1")
            bloque: 1.er cambio de plano
            porque: |
              Desde la planta, las perpendiculares a la línea nueva por B′₁, Z₁ y Z′₁, largas, más
              allá de ella; la de B₁ ya está. La de Z′₁ pasa a 1 mm de Z₁, casi encima de Z₁Z′₁: en la
              planta, ZZ′ es casi perpendicular a BB′.
          - con: marca
            traza: solucion.Bp_4
            rotulo: B′₄
            bloque: 1.er cambio de plano
            porque: |
              B′₄, donde la perpendicular de B′₁ corta la línea nueva: B′ es la **referencia** del
              primer cambio, y cae en ella.
          - con: marca
            traza: solucion.Zp_4
            rotulo: Z′₄
            bloque: 1.er cambio de plano
            porque: |
              Z′₄, donde la perpendicular de Z′₁ corta la línea nueva: Z′ tiene la cota de B′, porque
              Z′₂ está a la altura de A′₂C′₂, y cae en ella como la referencia.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("B2"), solucion.L_J)
            guia: figura.segmento("ABC2")
            bloque: 1.er cambio de plano
            porque: |
              En el alzado, por B₂, la vertical, perpendicular a A₂C₂, hasta pasar A′₂C′₂.
          - con: marca
            traza: solucion.J
            rotulo: J
            bloque: 1.er cambio de plano
            porque: |
              J, al pie de esa vertical en A′₂C′₂: B₂J es lo que B está más alto que B′, 40,4 mm.
          - con: compas
            traza: 'arco(solucion.P, por: solucion.B_4, desde: desplaza(solucion.B_4, dx: -3.00, dy: -9.52), hasta: desplaza(solucion.B_4, dx: 2.16, dy: 9.75))'
            toma: segmento2(figura.punto("B2"), solucion.J)
            bloque: 1.er cambio de plano
            porque: |
              Con el compás, B₂J, llevada desde P sobre la perpendicular de B₁, hacia fuera, lejos de
              la planta: B está más alto que la referencia.
          - con: marca
            traza: solucion.B_4
            rotulo: B₄
            bloque: 1.er cambio de plano
            porque: |
              B₄, donde el arco corta la perpendicular de B₁, lejos de la planta: a la cota de B
              contada desde la de B′.
          - con: escuadra-cartabon
            traza: segmento2(solucion.B_4, solucion.L_par4)
            guia: segmento2(solucion.n1_a, solucion.n1_b)
            bloque: 1.er cambio de plano
            porque: |
              Z tiene la cota de B, porque Z₂ está a la altura de A₂C₂: Z₄ está en la paralela a la
              línea nueva por B₄, que se traza hasta pasar la perpendicular de Z₁.
          - con: marca
            traza: solucion.Z_4
            rotulo: Z₄
            bloque: 1.er cambio de plano
            porque: |
              Z₄, donde esa paralela corta la perpendicular de Z₁.
          - con: regla
            traza: segmento2(solucion.Bp_4, solucion.L_BB5)
            bloque: 1.er cambio de plano
            porque: |
              B₄B′₄ es BB′ en **verdadera magnitud**, 74,8 mm. Con la regla, de B′₄ a B₄ y más allá,
              larga: en el segundo cambio hace de perpendicular a la segunda línea nueva.
          - con: regla
            traza: segmento2(solucion.Zp_4, solucion.Z_4)
            bloque: 1.er cambio de plano
            porque: |
              Z₄Z′₄, la recta ZZ′ en la vista nueva.
          - con: compas
            traza: 'arco(solucion.B_4, por: solucion.B5, desde: solucion.arcB5_a, hasta: solucion.arcB5_b)'
            bloque: 2.º cambio de plano
            porque: |
              El segundo cambio sale de esta vista y lleva lo que cada planta distaba de la primera
              línea nueva. Su línea nueva va perpendicular a B₄B′₄, para ver BB′ de punta, y a
              15 mm de B₄: con el compás, la punta en B₄ y abierto 15 mm, un arco que corta B₄B′₄
              prolongada. Los 15 mm son nuestros.
          - con: marca
            traza: solucion.B5
            rotulo: B₅
            bloque: 2.º cambio de plano
            porque: |
              B₅, donde el arco corta B₄B′₄ prolongada, a 15 mm de B₄. B es la referencia del segundo
              cambio, y B′ cae en el mismo punto, porque BB′ se ve **de punta**; M, que es de BB′,
              también: B₅ ≡ B′₅ ≡ M₅.
          - con: escuadra-cartabon
            traza: '[segmento2(solucion.B5, solucion.n2_a), segmento2(solucion.B5, solucion.n2_b)]'
            guia: segmento2(solucion.Bp_4, solucion.B_4)
            rotulo: segunda línea nueva
            bloque: 2.º cambio de plano
            porque: |
              La **segunda línea nueva**, por B₅ y perpendicular a B₄B′₄, larga hacia los dos lados: ha
              de llegar a las paralelas a B₄B′₄ que se trazan ahora por Z₄ y por Z′₄.
          - con: escuadra-cartabon
            traza: '[segmento2(solucion.Z_4, solucion.L_pRa), segmento2(solucion.Z_4, solucion.L_pRb), segmento2(solucion.Zp_4, solucion.L_pS)]'
            guia: segmento2(solucion.Bp_4, solucion.B_4)
            bloque: 2.º cambio de plano
            porque: |
              Por Z₄ y por Z′₄, las paralelas a B₄B′₄, perpendiculares a la segunda línea nueva,
              largas; la de Z₄, hacia los dos lados.
          - con: marca
            traza: solucion.R
            rotulo: R
            bloque: 2.º cambio de plano
            porque: |
              R, donde la paralela de Z₄ corta la segunda línea nueva.
          - con: marca
            traza: solucion.S
            rotulo: S
            bloque: 2.º cambio de plano
            porque: |
              S, donde la paralela de Z′₄ corta la segunda línea nueva.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("Z1"), solucion.L_parZ)
            guia: figura.segmento("BB1")
            bloque: 2.º cambio de plano
            porque: |
              Ahora, lo que lleva cada punto, que se mide en la planta. Z₁ está más cerca de la
              primera línea nueva que B₁: por Z₁, la paralela a B₁B′₁, hasta la perpendicular de B₁.
              Lo que separa las dos paralelas es la diferencia.
          - con: marca
            traza: solucion.G
            rotulo: G
            bloque: 2.º cambio de plano
            porque: |
              G, donde esa paralela corta la perpendicular de B₁: B₁G es lo que Z₁ está más cerca de la
              primera línea nueva que B₁, 43,2 mm.
          - con: marca
            traza: solucion.F
            rotulo: F
            bloque: 2.º cambio de plano
            porque: |
              F, donde la perpendicular de Z′₁ corta B₁B′₁, que es la paralela a la línea nueva por
              B₁: Z′₁F es lo que Z′₁ está más lejos de ella que B₁, 8,2 mm. Por la casualidad de
              antes, la perpendicular de Z′₁ casi encima de Z₁Z′₁, F casi coincide con el cruce
              aparente de B₁B′₁ y Z₁Z′₁; no es un punto común de las dos rectas.
          - con: compas
            traza: 'arco(solucion.R, por: solucion.Z_5, desde: desplaza(solucion.Z_5, dx: 10.31, dy: 2.79), hasta: desplaza(solucion.Z_5, dx: -10.02, dy: -3.68))'
            toma: segmento2(figura.punto("B1"), solucion.G)
            bloque: 2.º cambio de plano
            porque: |
              Con el compás, B₁G, desde R, hacia la vista de B₄: Z está más cerca de la primera línea
              nueva que B, la referencia.
          - con: marca
            traza: solucion.Z_5
            rotulo: Z₅
            bloque: 2.º cambio de plano
            porque: |
              Z₅, donde el arco corta la paralela de Z₄.
          - con: compas
            traza: 'arco(solucion.S, por: solucion.Zp_5, desde: desplaza(solucion.Zp_5, dx: -3.55, dy: -0.83), hasta: desplaza(solucion.Zp_5, dx: 3.38, dy: 1.38))'
            toma: segmento2(figura.punto("Z1p"), solucion.F)
            bloque: 2.º cambio de plano
            porque: |
              Con el compás, Z′₁F, desde S, hacia fuera, al otro lado de la vista de B₄: Z′ está más
              lejos de la primera línea nueva que B.
          - con: marca
            traza: solucion.Zp_5
            rotulo: Z′₅
            bloque: 2.º cambio de plano
            porque: |
              Z′₅, donde el arco corta la paralela de Z′₄.
          - con: regla
            traza: segmento2(solucion.Z_5, solucion.Zp_5)
            bloque: 2.º cambio de plano
            porque: |
              Z₅Z′₅ es la recta ZZ′ vista en la dirección de BB′.
          - con: escuadra-cartabon
            traza: segmento2(solucion.B5, solucion.L_t)
            guia: segmento2(solucion.Z_5, solucion.Zp_5)
            bloque: 2.º cambio de plano
            porque: |
              Por B₅, la perpendicular a Z₅Z′₅: con BB′ de punta, la perpendicular común se ve en
              **verdadera magnitud**.
          - con: marca
            traza: solucion.N_5
            rotulo: N₅
            bloque: 2.º cambio de plano
            porque: |
              N₅, el pie de esa perpendicular en Z₅Z′₅: B₅N₅ es t, 20,2 mm.
          - con: escuadra-cartabon
            traza: segmento2(solucion.N_5, solucion.L_N5)
            guia: segmento2(solucion.Bp_4, solucion.B_4)
            bloque: Vuelta a las vistas de la hoja
            porque: |
              De vuelta: por N₅, la paralela a B₄B′₄, hasta pasar Z₄Z′₄.
          - con: marca
            traza: solucion.N_4
            rotulo: N₄
            bloque: Vuelta a las vistas de la hoja
            porque: |
              N₄, donde esa paralela corta Z₄Z′₄.
          - con: escuadra-cartabon
            traza: segmento2(solucion.N_4, solucion.L_NM4)
            guia: segmento2(solucion.Bp_4, solucion.B_4)
            bloque: Vuelta a las vistas de la hoja
            porque: |
              MN es perpendicular a BB′, y BB′ está en verdadera magnitud en esta vista, así que el
              ángulo recto se ve recto: por N₄, la perpendicular a B₄B′₄.
          - con: marca
            traza: solucion.M_4
            rotulo: M₄
            bloque: Vuelta a las vistas de la hoja
            porque: |
              M₄, el pie de esa perpendicular en B₄B′₄.
          - con: escuadra-cartabon
            traza: '[segmento2(solucion.N_4, solucion.L_N1), segmento2(solucion.M_4, solucion.L_M1)]'
            guia: figura.segmento("BB1")
            bloque: Vuelta a las vistas de la hoja
            porque: |
              Por N₄ y por M₄, las perpendiculares a la primera línea nueva, de vuelta a la planta,
              largas.
          - con: marca
            traza: proy_planta(solucion.N)
            rotulo: N₁
            bloque: Vuelta a las vistas de la hoja
            porque: |
              N₁, donde la perpendicular de N₄ corta Z₁Z′₁.
          - con: marca
            traza: proy_planta(solucion.M)
            rotulo: M₁
            bloque: Vuelta a las vistas de la hoja
            porque: |
              M₁, donde la perpendicular de M₄ corta B₁B′₁. Cae casi en la vertical de H₁, a 0,5 mm.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(solucion.N), solucion.L_N2), segmento2(proy_planta(solucion.M), solucion.L_M2)]'
            guia: figura.segmento("AC1")
            bloque: Vuelta a las vistas de la hoja
            porque: |
              Por N₁ y por M₁, las líneas de referencia hasta el alzado. La de M₁ va casi encima de la
              de H₁, y la de N₁, encima de la de K₁, a 0,1 mm.
          - con: marca
            traza: proy_alzado(solucion.N)
            rotulo: N₂
            bloque: Vuelta a las vistas de la hoja
            porque: |
              N₂, donde la vertical de N₁ corta Z₂Z′₂.
          - con: marca
            traza: proy_alzado(solucion.M)
            rotulo: M₂
            bloque: Vuelta a las vistas de la hoja
            porque: |
              M₂, donde la vertical de M₁ corta B₂B′₂.
          - con: regla
            traza: '[segmento2(proy_planta(solucion.M), proy_planta(solucion.N)), segmento2(proy_alzado(solucion.M), proy_alzado(solucion.N))]'
            porque: |
              MN, la perpendicular común, en las dos vistas: M₁N₁ mide 14,45 mm y M₂N₂, 16,50 mm, y
              su verdadera magnitud es t, 20,2 mm.
        pista: |
          (1) Para H: un cambio de plano con la línea nueva perpendicular a B₁C₁ pone
          el plano de canto, porque BC es horizontal; ahí la perpendicular desde Z′ se ve en
          verdadera magnitud, y su pie se devuelve a las dos vistas. (2) Para M y N: dos cambios
          de plano ponen BB′ de punta; desde ese punto, la perpendicular a la nueva proyección de
          ZZ′ da N y mide t; M sale de N, perpendicular a BB′.
        desarrollo: |
          En verde claro, Z′H y MN en las dos vistas. H queda fuera de la cara, al otro lado de
          BB′; M, en BB′ a algo más de un cuarto desde B; N, en ZZ′ a unos tres quintos desde Z.

      - tipo: calcular
        titulo: La distancia d
        pregunta: d, la distancia mínima entre el punto Z′ y el plano BCB′C′.
        respuesta:
          tipo: numero
          valor: '30.85'
          receta: d_mm
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '17.36'
            receta: en_mm(vm_planta(Zp, solucion.H))
            mensaje: |
              Eso es lo que mide **Z′₁H₁ en la planta**. Z′H no es horizontal —Z′ y H tienen
              distinta cota—, así que la planta lo acorta: hace falta su verdadera magnitud.
          - valor: '27.34'
            receta: en_mm(vm_alzado(Zp, solucion.H))
            mensaje: |
              Eso es lo que mide **Z′₂H₂ en el alzado**, que también acorta: Z′H no es frontal.
              Su verdadera magnitud sale abatiéndolo, o leída en la vista del cambio de plano
              donde el plano está de canto.
        pista: |
          Es la verdadera magnitud de Z′H. En la vista del cambio de plano, con el plano de
          canto, se lee directamente; si no, abate Z′H como cualquier segmento.
        desarrollo: |
          $$ d = \overline{Z'H} = \sqrt{\overline{Z'_1H_1}^{\,2} + \Delta z^{2}} = \sqrt{17{,}36^{2} + 25{,}50^{2}} \approx 30{,}85 \text{ mm} $$

          Hasta la arista BB′ sale 30,94 mm, casi lo mismo por casualidad: no es d, y su pie
          está a más de 2 mm de H.

          Otras tres longitudes del dibujo caen también dentro de la tolerancia, por casualidad, y
          ninguna es d. En el alzado, B′₂M₂ mide 31,72 mm, el alzado de B′M; en la planta, B₁1₁ mide 30,72,
          la planta del trozo de BB′ que va de B al punto 1, y 1₁2₁, 30,41, la del segmento 12. Ninguna
          está en verdadera magnitud, porque las tres son de rectas inclinadas. d es Z′H, y sale de Z′₁H₁
          y de la diferencia de cotas, como arriba.

      - tipo: calcular
        titulo: La distancia t
        pregunta: t, la distancia mínima entre las rectas BB′ y ZZ′.
        respuesta:
          tipo: numero
          valor: '20.20'
          receta: t_mm
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '14.45'
            receta: en_mm(vm_planta(solucion.M, solucion.N))
            mensaje: |
              Eso es lo que mide **M₁N₁ en la planta**. La perpendicular común no es horizontal,
              y la planta la acorta.
          - valor: '16.50'
            receta: en_mm(vm_alzado(solucion.M, solucion.N))
            mensaje: |
              Eso es lo que mide **M₂N₂ en el alzado**, que también acorta. En verdadera magnitud
              está en la vista con BB′ de punta.
          - valor: '30.94'
            receta: en_mm(vm(Zp, pie_perpendicular(Zp, BBp)))
            mensaje: |
              Esa es una distancia desde **Z′**, un extremo de ZZ′: hasta la arista BB′ mide
              30,94 mm, y hasta la cara BCB′C′, 30,85 mm, que es d. Ninguna es la mínima entre
              las rectas: esa va por la perpendicular común, que es perpendicular a las dos y no
              tiene por qué pasar por Z′.
        pista: |
          Con BB′ de punta, la perpendicular común se ve en verdadera magnitud: es la distancia
          del punto en que se ve BB′ a la proyección de ZZ′ en esa vista.
        desarrollo: |
          $$ t = \overline{MN} = \sqrt{\overline{M_1N_1}^{\,2} + \Delta z^{2}} = \sqrt{14{,}45^{2} + 14{,}12^{2}} \approx 20{,}20 \text{ mm} $$

          Hay en el dibujo otras longitudes a menos de 1 mm de t, por casualidad, y ninguna es t. En la
          planta, los lados de las bases, que ahí están en verdadera magnitud: A₁B₁ y B₁C₁ miden 21,09 mm;
          B′₁C′₁, 21,07, y A′₁B′₁, 21,03. También en la planta, 1₁K₁ mide 19,90 mm, C′₁K₁ 20,56 y Z′₁N₁
          19,46: son las plantas de un trozo inclinado de BB′, de la frontal KC′ y del trozo Z′N de ZZ′, y
          la planta los acorta. En la vista con BB′ en verdadera magnitud, B₄M₄ mide 20,33 mm: es BM, el
          trozo de BB′ hasta el pie M, no la perpendicular MN; y Z₄Z₅, 20,91 mm, es lo que separan las
          dos vistas nuevas de Z sobre su línea de referencia. t se mide con BB′ de punta, de B₅ a N₅.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: La perpendicular al plano por Z′ se traza en la planta perpendicular a B₁C₁, porque BC es una horizontal del plano, y en el alzado perpendicular a sus frontales.
          - texto: H es donde esa perpendicular corta al plano, y d es la verdadera magnitud de Z′H, que no está en ninguna de las dos vistas.
          - texto: 'B₁B′₁ y Z₁Z′₁ se cortan en la planta, y B₂B′₂ y Z₂Z′₂ en el alzado, pero en verticales distintas: las rectas se cruzan.'
          - texto: La distancia mínima es la de la perpendicular común MN, que corta a las dos rectas en ángulo recto, y t es su verdadera magnitud.
          - texto: El punto donde se cortan B₁B′₁ y Z₁Z′₁ en la planta es común a las dos rectas, así que la distancia mínima entre ellas es cero.
            trampa: true
            mensaje: |
              Ese cruce es aparente: en el alzado las dos rectas se cortan en otra vertical, así
              que no es el mismo punto del espacio. Las rectas se cruzan, y su distancia es la de
              la perpendicular común, 20,2 mm.

    resolucion: |
      **El plano y su perpendicular.** BC es una horizontal del plano BCB′C′ —B₂C₂ está en la
      horizontal de arriba del alzado—, así que la planta de la perpendicular por Z′ es
      perpendicular a B₁C₁. En el alzado va perpendicular a una frontal del plano, que se
      obtiene uniendo dos puntos de BB′ y de CC′ con el mismo alejamiento.

      **H, el pie.** Con un cambio de plano, con la línea nueva perpendicular a B₁C₁, el plano
      queda de canto —BC es horizontal, así que basta uno— y la perpendicular desde Z′ se ve
      en verdadera magnitud; su pie se devuelve a la planta, sobre la perpendicular a B₁C₁
      por Z′₁, y al alzado con su cota. Sin cambio de plano se llega igual: el plano vertical
      que contiene la planta de la perpendicular corta a BB′ y a la prolongación de CC′, más
      allá de C′, en dos puntos del plano,
      la recta que los une corta el alzado de la perpendicular en H₂, y H₁ baja por su
      vertical. H cae fuera de la cara, al otro lado de la arista BB′: el plano no se acaba
      en sus aristas.

      **d.** Z′H mide 17,36 mm en la planta y 27,34 mm en el alzado, y en verdadera magnitud
      d = 30,85 mm. La distancia de Z′ a la arista BB′ sale casi igual, 30,94 mm, porque H
      queda muy cerca de esa arista; pero no es la que se pide, y su pie está a más de 2 mm
      de H en cada vista.

      **Las rectas se cruzan.** B₁B′₁ y Z₁Z′₁ se cortan en la planta, y B₂B′₂ y Z₂Z′₂ en el
      alzado, pero los dos cruces no están en la misma vertical: no hay un punto común. La
      distancia mínima es la de la perpendicular común MN, que corta a las dos en ángulo
      recto.

      **t.** Con dos cambios de plano, BB′ queda de punta: se ve como un punto, y la
      perpendicular desde él a la nueva proyección de ZZ′ es la perpendicular común en
      verdadera magnitud, t = 20,20 mm. Su pie es N; M sale de N, perpendicular a BB′ en la
      vista donde BB′ está en verdadera magnitud, y los dos se devuelven a las vistas dadas.
      M queda en BB′ a algo más de un cuarto desde B, y N en ZZ′ a unos tres quintos desde Z;
      MN mide 14,45 mm en la planta y 16,50 mm en el alzado.

  # ── 2 · La pirámide de mayor cota sobre un plano oblicuo. Lo que enseña:
  #    el cuadrado se construye con el plano en verdadera magnitud, la altura
  #    sale de una horizontal (BC), y en el alzado la lámina tapa la pirámide,
  #    que queda detrás de ella.
  - id: exeg-h55-2-la-piramide-de-mayor-cota
    titulo: La pirámide de mayor cota sobre un plano oblicuo, y lo que tapa la lámina
    fuente: >-
      Ejercicio 55, apartado 2 · Colección de ejercicios de Geometría
      Descriptiva, Sistema Diédrico Directo · Dpto. de Expresión Gráfica y
      Proyectos de Ingeniería, EIG · UPV/EHU. El 55 (págs. 64-66; este
      apartado, en las 64 y 66) es uno de los cuatro ejercicios de varios
      apartados con que cierra la colección, todos sin fecha, y de ellos solo el
      54 se titula «Examen». Se transcribe el castellano; la figura se redibuja
      desde sus coordenadas.
    nivel: examen
    # Decisión: el castellano de la pág. 64 tal cual, sin el «2.» del apartado
    # (lo dice la fuente). «se haya» es errata de la hoja, y se conserva (§08).
    enunciado: |
      Dibujar la pirámide cuya base cuadrada se haya en el plano ABCD. Una diagonal de la base cuadrada es la recta EF. La altura de la pirámide es el doble de la longitud de la recta BC. Dibujar la pirámide de mayor cota, diferenciando zonas visibles y ocultas.

      **Notas nuestras.** La figura es la mitad izquierda de la tercera página
      del Ejercicio 55: el plano ABCD y la recta EF, que va de AB a DC, en alzado
      (arriba) y en planta (abajo). AD y BC son horizontales. «Se haya» es
      errata de la hoja por «se halla», y se deja tal como está impresa. La
      hoja no da escala para este apartado: las longitudes se dan en
      milímetros de la lámina. La hoja tampoco dice si el plano ABCD es una
      lámina opaca o solo un plano; aquí se toma como lámina opaca, y eso
      cambia la visibilidad del alzado.
    pide: Los dos vértices de la base que faltan y el vértice de la pirámide, en las dos vistas; la pirámide con sus aristas vistas y ocultas; su altura y el lado de la base.
    receta:
      lamina: ex55-2
      escena:
        A: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("A1"))'
        B: 'punto3(alzado: figura.punto("B2"), planta: figura.punto("B1"))'
        C: 'punto3(alzado: figura.punto("C2"), planta: figura.punto("C1"))'
        D: 'punto3(alzado: figura.punto("D2"), planta: figura.punto("D1"))'
        E: 'punto3(alzado: figura.punto("E2"), planta: figura.punto("E1"))'
        F: 'punto3(alzado: figura.punto("F2"), planta: figura.punto("F1"))'
        cara: plano(A, B, D)
      solucion:
        base: cuadrado_por_diagonal(cara, E, F)
        O: punto_medio(segmento3(E, F))
        eje: perpendicular_a_plano(O, cara)
        # cuadrado_por_diagonal da [E, G, F, H]: en esta lámina el segundo es el
        # vértice de mayor cota de los dos que faltan (G) y el cuarto el de menor
        # (H). tests/geometria/hoja-55.test.ts comprueba esas posiciones.
        G: uno(base, 2)
        H: uno(base, 4)
        altura: 2 * vm(B, C)
        V: 'apice(base, altura: altura, sentido: ascendente)'
        altura_mm: en_mm(altura)
        lado_mm: en_mm(vm(E, G))
        # Los errores. La pirámide de menor cota; la altura sin doblar; y el
        # cuadrado dibujado en la planta sobre E₁F₁, como si EF estuviera en
        # verdadera magnitud: el de diagonal EF₀ en el plano horizontal de E,
        # con F₀ la planta de F a la cota de E (dos posiciones, una elección).
        V_baja: 'apice(base, altura: altura, sentido: descendente)'
        V_altura_BC: 'apice(base, altura: vm(B, C), sentido: ascendente)'
        V_tres_cuartos: 'apice(base, altura: altura * 0.75, sentido: ascendente)'
        horizontal_E: 'plano(E, punto3(alzado: figura.punto("E2"), planta: desplaza(figura.punto("E1"), dy: 10)), punto3(alzado: desplaza(figura.punto("E2"), dx: 10), planta: desplaza(figura.punto("E1"), dx: 10)))'
        F_a_cota_de_E: 'punto_en_plano(planta: figura.punto("F1"), plano: horizontal_E)'
        cuadrado_en_planta: 'gira(F_a_cota_de_E, perpendicular_a_plano(punto_medio(segmento3(E, F_a_cota_de_E)), horizontal_E), angulo: 90)'
        # Para la construcción paso a paso. La base, abatiendo el plano ABCD con
        # la charnela AD sobre su plano horizontal, hacia el lado de B: E0 y F0,
        # E y F abatidos; O0, el centro abatido; H0, H abatido. AB y DC son
        # líneas de máxima pendiente, perpendiculares a AD, así que E0 cae en
        # A₁B₁ y F0 en D₁C₁.
        E0: uno(abatido(E, recta3(A, D), cara), 2)
        F0: uno(abatido(F, recta3(A, D), cara), 2)
        O0: punto_medio(segmento3(E0, F0))
        H0: uno(abatido(H, recta3(A, D), cara), 2)
        # Kp y Lp, en A₂D₂ (prolongada, en el caso de Lp) en la vertical de E₂
        # y de F₂: E₂Kp y F₂Lp son lo que E y F están más bajos que AD. Te y
        # Uf, el otro extremo de esos catetos, por E₁ y por F₁ paralelos a
        # A₁D₁: A₁Te y D₁Uf son AE y DF en verdadera magnitud.
        Kp: 'pie_perpendicular(figura.punto("E2"), figura.segmento("AD2"))'
        Lp: 'pie_perpendicular(figura.punto("F2"), figura.segmento("AD2"))'
        parE: 'perpendicular(por: figura.punto("E1"), a: perpendicular(por: figura.punto("E1"), a: figura.segmento("AD1")))'
        parF: 'perpendicular(por: figura.punto("F1"), a: perpendicular(por: figura.punto("F1"), a: figura.segmento("AD1")))'
        Te: 'uno(medir_sobre(parE, desde: figura.punto("E1"), distancia: diferencia_de_cotas(A, E)), 1)'
        Uf: 'uno(medir_sobre(parF, desde: figura.punto("F1"), distancia: diferencia_de_cotas(D, F)), 1)'
        # Mm y Nm, los vértices de los dos triángulos equiláteros sobre E0F0: la
        # recta que los une es la mediatriz de E0F0, la otra diagonal abatida.
        mediatriz: 'perpendicular(por: proy_planta(O0), a: segmento2(proy_planta(E0), proy_planta(F0)))'
        Mm: 'uno(medir_sobre(mediatriz, desde: proy_planta(O0), distancia: vm(E0, F0) * raiz(3) / 2), 1)'
        Nm: 'uno(medir_sobre(mediatriz, desde: proy_planta(O0), distancia: vm(E0, F0) * raiz(3) / 2), 2)'
        # X, donde la diagonal GH corta la charnela: no se mueve al abatir, y la
        # recta XO₁ es la planta de GH (afinidad). Como X está en AD, su alzado
        # cae en A₂D₂, y X₂O₂ es el alzado de GH, que lleva a H₂ y a G₂.
        X: pie_comun(recta3(G, H), recta3(A, D))
        # El vértice. S, donde la planta de la perpendicular por O corta A₁D₁;
        # Wp, en la vertical de O₂ sobre A₂D₂ prolongada: O₂Wp es lo que AD está
        # más alta que O. S0, S abatido con el plano vertical de la
        # perpendicular, cuya charnela es la horizontal de ese plano por O: S0O₁
        # es el plano ABCD de canto, y la perpendicular a él por O₁ está en
        # verdadera magnitud. Ym y V0, a una y a dos veces BC de O₁.
        S: 'pie_perpendicular(proy_planta(O), figura.segmento("AD1"))'
        Wp: 'pie_perpendicular(proy_alzado(O), figura.segmento("AD2"))'
        S0: 'uno(medir_sobre(figura.segmento("AD1"), desde: S, distancia: diferencia_de_cotas(A, O)), 2)'
        eje0: 'perpendicular(por: proy_planta(O), a: segmento2(S0, proy_planta(O)))'
        Ym: 'uno(medir_sobre(eje0, desde: proy_planta(O), distancia: vm(B, C)), 2)'
        V0: 'uno(medir_sobre(eje0, desde: proy_planta(O), distancia: altura), 2)'
        # P, el punto de BC con el alejamiento de E: EP es una frontal del plano,
        # y en el alzado la perpendicular va perpendicular a ella.
        fr_E: 'plano(E, punto3(alzado: desplaza(figura.punto("E2"), dx: 10), planta: desplaza(figura.punto("E1"), dx: 10)), punto3(alzado: desplaza(figura.punto("E2"), dy: -10), planta: figura.punto("E1")))'
        P: corte_recta_plano(recta3(B, C), fr_E)
        # Los extremos de las rectas largas de la construcción: en el papel se
        # trazan más allá del punto que van a dar, y no paran en él.
        perpO: 'perpendicular(por: proy_planta(O0), a: figura.segmento("AD1"))'
        parV: 'perpendicular(por: V0, a: perpendicular(por: V0, a: figura.segmento("AD1")))'
        L_vE: 'desplaza(Kp, dy: mm(-3))'
        L_AD2: 'desplaza(Lp, dx: mm(4))'
        L_vF: 'desplaza(Lp, dy: mm(-3))'
        L_parE: 'uno(medir_sobre(parE, desde: Te, distancia: mm(4)), 1)'
        L_parF: 'uno(medir_sobre(parF, desde: Uf, distancia: mm(4)), 1)'
        L_pO_S: 'uno(medir_sobre(perpO, desde: S, distancia: mm(4)), 1)'
        L_pO_V: 'uno(medir_sobre(perpO, desde: proy_planta(V), distancia: mm(5)), 2)'
        L_XH: 'uno(medir_sobre(segmento2(proy_planta(X), proy_planta(O)), desde: proy_planta(H), distancia: mm(4)), 1)'
        L_XG: 'uno(medir_sobre(segmento2(proy_planta(X), proy_planta(O)), desde: proy_planta(G), distancia: mm(4)), 2)'
        L_pH: 'uno(medir_sobre(perpendicular(por: proy_planta(H0), a: figura.segmento("AD1")), desde: proy_planta(H), distancia: mm(4)), 1)'
        L_vH: 'desplaza(proy_alzado(H), dy: mm(-2.5))'
        L_vO: 'desplaza(Wp, dy: mm(-3))'
        L_vX: 'desplaza(proy_alzado(X), dy: mm(-3))'
        L_XG2: 'uno(medir_sobre(segmento2(proy_alzado(X), proy_alzado(O)), desde: proy_alzado(G), distancia: mm(4)), 2)'
        L_XH2: 'uno(medir_sobre(segmento2(proy_alzado(X), proy_alzado(O)), desde: proy_alzado(H), distancia: mm(4)), 1)'
        L_vG: 'desplaza(proy_alzado(G), dy: mm(-4))'
        L_eje0: 'uno(medir_sobre(eje0, desde: V0, distancia: mm(5)), 2)'
        L_parV: 'uno(medir_sobre(parV, desde: proy_planta(V), distancia: mm(5)), 2)'
        L_fr1: 'desplaza(proy_planta(P), dx: mm(4))'
        L_vP: 'desplaza(proy_alzado(P), dy: mm(-3))'
        L_eje2: 'uno(medir_sobre(proy_alzado(segmento3(O, V)), desde: proy_alzado(V), distancia: mm(5)), 1)'
        L_vV: 'desplaza(proy_alzado(V), dy: mm(-5))'
        # La visibilidad: los cruces aparentes donde una arista pasa de vista a
        # oculta, cada uno con la arista que lo da (k_<borde>_<arista>).
        k_BC_VE: 'cruce_aparente(figura.segmento("BC1"), segmento2(proy_planta(V), figura.punto("E1")))'
        k_BC_VF: 'cruce_aparente(figura.segmento("BC1"), segmento2(proy_planta(V), figura.punto("F1")))'
        k_AD_GF: 'cruce_aparente(figura.segmento("AD1"), segmento2(proy_planta(G), figura.punto("F1")))'
        k_AD_EG: 'cruce_aparente(figura.segmento("AD1"), segmento2(figura.punto("E1"), proy_planta(G)))'
        k_VH_DC: 'cruce_aparente(segmento2(proy_alzado(V), proy_alzado(H)), figura.segmento("DC2"))'
        k_VH_BC: 'cruce_aparente(segmento2(proy_alzado(V), proy_alzado(H)), figura.segmento("BC2"))'
        k_EG_AD: 'cruce_aparente(segmento2(figura.punto("E2"), proy_alzado(G)), figura.segmento("AD2"))'
        k_GF_AD: 'cruce_aparente(segmento2(proy_alzado(G), figura.punto("F2")), figura.segmento("AD2"))'
        k_FH_BC: 'cruce_aparente(segmento2(figura.punto("F2"), proy_alzado(H)), figura.segmento("BC2"))'
        k_HE_BC: 'cruce_aparente(segmento2(proy_alzado(H), figura.punto("E2")), figura.segmento("BC2"))'
      comprueba:
        - en_plano(C, cara)
        - en_plano(E, cara)
        - en_plano(F, cara)
    pasos:
      - tipo: reconocer
        pregunta: El plano ABCD es oblicuo. ¿Dónde se dibuja el cuadrado de diagonal EF con su forma verdadera?
        opciones:
          - texto: Con el plano en verdadera magnitud, abatido o en una vista nueva, y después se devuelve a las dos vistas
            correcta: true
            mensaje: |
              Eso es. AD y BC son horizontales del plano, así que basta un cambio de plano con
              la línea nueva perpendicular a A₁D₁ para ponerlo de canto, o abatirlo con
              charnela AD. Con el plano en verdadera magnitud, el cuadrado se dibuja como en
              un papel, y G y H se devuelven a las vistas.
          - texto: En la planta, sobre E₁F₁, porque ahí se ve el ángulo recto de las diagonales
            mensaje: |
              El ángulo recto entre las diagonales solo se ve recto en la planta si una de las
              dos es horizontal, y aquí ninguna lo es. Además E₁F₁ está acortada: mide
              56,12 mm, y EF, 57,10. Un cuadrado dibujado sobre E₁F₁ no está en el plano.
          - texto: En el alzado, porque A₂D₂ y B₂C₂ salen horizontales y eso deja al plano ABCD paralelo al plano del alzado, con todo en verdadera magnitud
            mensaje: |
              Que A₂D₂ y B₂C₂ sean horizontales dice que AD y BC son horizontales del plano:
              se ven en verdadera magnitud en la planta, no en el alzado. El alzado acorta EF
              hasta 17,34 mm.

      - tipo: construir
        titulo: La base, el vértice y lo que se ve
        intro: |
          Llamamos G y H a los dos vértices de la base que faltan, G el de mayor cota y H el
          de menor, y V al vértice de la pirámide. Marca G, H y V en la planta y en el
          alzado. La pirámide es la de mayor cota: V queda por encima del plano ABCD.

          Después, pásala a limpio en las dos vistas con «arista vista» y «arista oculta», y
          también los bordes de la lámina que la pirámide tapa en parte, B₁C₁ y D₁A₁ en la
          planta; los demás bordes se ven enteros y ya están dibujados. Cada arista se corta
          solo donde cambia su visibilidad: para tener ese punto, traza antes con la recta la
          arista que la cruza. Tomamos ABCD como una lámina opaca, que la hoja no lo precisa;
          con el plano transparente, en el alzado solo VE iría oculta. El tramo oculto de VH,
          junto a C₂, mide 1,8 mm: amplía con la lupa.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, transportador, visto, oculto, borrar]
        tolerancia: 1
        objetivos:
          - nombre: G1
            pide: el vértice G de la base, el de mayor cota, en la planta
            es: proy_planta(solucion.G)
            bien: |
              G₁ es el vértice de la base del lado de A₁D₁. G cae fuera de la lámina ABCD, al
              otro lado de AD: el cuadrado no cabe entero en ella.
            diagnosticos:
              - si: cerca_de(proy_planta(solucion.H))
                mensaje: |
                  Ese es el otro vértice que falta, H, el de menor cota. Aquí G es el de mayor
                  cota: el que queda más arriba en el alzado.
                ejemplo: proy_planta(solucion.H)
              - si: cerca_de(proy_planta(solucion.cuadrado_en_planta))
                mensaje: |
                  Has dibujado el cuadrado en la planta, sobre E₁F₁, como si EF estuviera en
                  verdadera magnitud y el plano fuera horizontal. El plano ABCD está inclinado:
                  el cuadrado se construye con el plano abatido o de canto, y se devuelve.
                ejemplo: proy_planta(rama(solucion.cuadrado_en_planta, 1))
              - si: siempre
                mensaje: |
                  G está en el plano ABCD, en la otra diagonal del cuadrado: perpendicular a EF
                  por su punto medio y del mismo largo, medido con el plano en verdadera
                  magnitud.
          - nombre: G2
            pide: el vértice G de la base, en el alzado
            es: proy_alzado(solucion.G)
            bien: |
              G₂ está en la vertical de G₁ y en el plano: sale con la horizontal del plano que
              pasa por G₁, paralela a A₁D₁ en la planta y horizontal en el alzado.
            diagnosticos:
              - si: '!en_vertical_de(G1)'
                mensaje: |
                  G₂ va en la **vertical de G₁**: son el mismo punto visto dos veces.
                ejemplo: 'desplaza(proy_alzado(solucion.G), dx: mm(8))'
              - si: siempre
                mensaje: |
                  Si ya tienes G₁: G₂ está en su vertical y en el plano. Traza por G₁ una
                  paralela a A₁D₁, que es una horizontal del plano, y súbela al alzado.
          - nombre: H1
            pide: el vértice H de la base, el de menor cota, en la planta
            es: proy_planta(solucion.H)
            bien: |
              H₁ es el vértice de la base del lado de B₁C₁. H también cae fuera de la lámina,
              al otro lado de BC.
            diagnosticos:
              - si: cerca_de(proy_planta(solucion.G))
                mensaje: |
                  Ese es G, el de mayor cota, que ya tienes. H es el otro extremo de la misma
                  diagonal, al otro lado de EF.
                ejemplo: proy_planta(solucion.G)
              - si: cerca_de(proy_planta(solucion.cuadrado_en_planta))
                mensaje: |
                  Has dibujado el cuadrado en la planta, sobre E₁F₁, como si EF estuviera en
                  verdadera magnitud. El plano está inclinado: el cuadrado se construye con el
                  plano abatido o de canto.
                ejemplo: proy_planta(rama(solucion.cuadrado_en_planta, 2))
              - si: siempre
                mensaje: |
                  H está en el plano, en la otra diagonal del cuadrado, al otro lado de EF que G
                  y a la misma distancia del centro.
          - nombre: H2
            pide: el vértice H de la base, en el alzado
            es: proy_alzado(solucion.H)
            bien: |
              H₂ está en la vertical de H₁, sobre la horizontal del plano que pasa por H.
            diagnosticos:
              - si: '!en_vertical_de(H1)'
                mensaje: |
                  H₂ va en la **vertical de H₁**: son el mismo punto visto dos veces.
                ejemplo: 'desplaza(proy_alzado(solucion.H), dx: mm(8))'
              - si: siempre
                mensaje: |
                  Si ya tienes H₁: H₂ está en su vertical y en el plano, sobre la horizontal del
                  plano que pasa por H₁.
          - nombre: V1
            pide: el vértice de la pirámide, en la planta
            es: proy_planta(solucion.V)
            bien: |
              V₁ está en la perpendicular al plano por el centro de la base —perpendicular a
              A₁D₁ en la planta—, a la altura de dos veces BC y del lado de arriba del plano.
            diagnosticos:
              - si: cerca_de(proy_planta(solucion.V_baja))
                mensaje: |
                  Esa es la pirámide de **menor cota**: la perpendicular al plano, pero hacia
                  abajo. El enunciado pide la de mayor cota, con V por encima del plano ABCD.
                ejemplo: proy_planta(solucion.V_baja)
              - si: cerca_de(proy_planta(solucion.V_altura_BC))
                mensaje: |
                  Has llevado BC como altura, y la altura es **el doble** de BC: 108,03 mm.
                ejemplo: proy_planta(solucion.V_altura_BC)
              - si: en_recta(proy_planta(solucion.eje))
                mensaje: |
                  Vas por la perpendicular al plano por el centro, pero a otra distancia. La
                  altura, dos veces BC, se lleva donde esa perpendicular está en verdadera
                  magnitud: en la vista con el plano de canto.
                ejemplo: proy_planta(solucion.V_tres_cuartos)
              - si: siempre
                mensaje: |
                  V está en la perpendicular al plano ABCD por el centro de la base: en la planta,
                  perpendicular a las horizontales del plano, que son paralelas a A₁D₁.
          - nombre: V2
            pide: el vértice de la pirámide, en el alzado
            es: proy_alzado(solucion.V)
            bien: |
              V₂ está en la vertical de V₁, sobre la perpendicular al plano por el centro de la
              base, que en el alzado es perpendicular a las frontales del plano.
            diagnosticos:
              - si: cerca_de(proy_alzado(solucion.V_baja))
                mensaje: |
                  Esa es la pirámide de **menor cota**. El enunciado pide la de mayor cota: V queda
                  por encima del plano, y en el alzado, arriba.
                ejemplo: proy_alzado(solucion.V_baja)
              - si: '!en_vertical_de(V1)'
                mensaje: |
                  V₂ va en la **vertical de V₁**: son el mismo punto visto dos veces.
                ejemplo: 'desplaza(proy_alzado(solucion.V), dx: mm(8))'
              - si: siempre
                mensaje: |
                  Si ya tienes V₁: V₂ está en su vertical, sobre la perpendicular al plano por el
                  centro de la base, que en el alzado va perpendicular a las frontales.
        # Decisión: la hoja no dice si ABCD es una lámina opaca; se toma opaca (con el
        # plano transparente, en el alzado solo VE iría oculta). Pregunta abierta
        # para Ionan (tasks/pendiente.md). La visibilidad sale de un cálculo de
        # líneas ocultas aparte, por rayos contra las caras, con la base apoyada
        # sobre la lámina; cada cambio, en el cruce aparente que dice su tramo.
        tramos:
          - traza: segmento2(proy_planta(solucion.V), figura.punto("E1"))
            tipo: visto
            porque: 'VE es contorno de la planta: separa la cara VEG, que mira hacia arriba, de la VHE, que mira hacia abajo. Desde arriba nada la tapa.'
          - traza: segmento2(proy_planta(solucion.V), proy_planta(solucion.G))
            tipo: visto
            porque: 'VG separa las caras VEG y VGF, las dos que miran hacia arriba: desde arriba se ve. En el cruce aparente de V₁G₁ con H₁E₁, VG va 60,8 mm por encima.'
          - traza: segmento2(proy_planta(solucion.V), figura.punto("F1"))
            tipo: visto
            porque: 'VF es contorno de la planta: separa la cara VGF, que mira hacia arriba, de la VFH, que mira hacia abajo. Desde arriba nada la tapa.'
          - traza: segmento2(figura.punto("E1"), proy_planta(solucion.G))
            tipo: visto
            porque: 'EG es contorno de la planta, arista de la cara VEG, que mira hacia arriba: desde arriba nada la tapa.'
          - traza: segmento2(proy_planta(solucion.G), figura.punto("F1"))
            tipo: visto
            porque: 'GF es contorno de la planta, arista de la cara VGF, que mira hacia arriba: desde arriba nada la tapa.'
          - traza: segmento2(proy_planta(solucion.V), proy_planta(solucion.H))
            tipo: oculto
            porque: 'H₁ cae dentro del contorno de la planta: VH separa dos caras que miran hacia abajo, VFH y VHE, y desde arriba la tapa la cara VGF.'
          - traza: segmento2(proy_planta(solucion.H), figura.punto("E1"))
            tipo: oculto
            porque: 'HE va por debajo de las caras VEG y VGF: sus dos caras, la base y VHE, miran hacia abajo. En el cruce aparente de H₁E₁ con V₁G₁, VG va 60,8 mm por encima.'
          - traza: segmento2(figura.punto("F1"), proy_planta(solucion.H))
            tipo: oculto
            porque: 'FH va por debajo de la cara VGF: sus dos caras, la base y VFH, miran hacia abajo, y H₁ cae dentro del contorno de la planta.'
          - traza: segmento2(figura.punto("B1"), solucion.k_BC_VE)
            tipo: visto
            porque: 'De B₁ al cruce con V₁E₁, el borde BC queda fuera de la planta de la pirámide: desde arriba nada lo tapa.'
          - traza: segmento2(solucion.k_BC_VE, solucion.k_BC_VF)
            tipo: oculto
            porque: 'Entre los cruces con V₁E₁ y V₁F₁, el contorno de la planta, BC queda debajo de la pirámide, que está apoyada encima de la lámina, del lado que mira hacia arriba.'
          - traza: segmento2(solucion.k_BC_VF, figura.punto("C1"))
            tipo: visto
            porque: 'Del cruce con V₁F₁ a C₁, el borde BC vuelve a quedar fuera de la planta de la pirámide: desde arriba nada lo tapa.'
          - traza: segmento2(figura.punto("D1"), solucion.k_AD_GF)
            tipo: visto
            porque: 'De D₁ al cruce con G₁F₁, el borde DA queda fuera de la planta de la pirámide: desde arriba nada lo tapa.'
          - traza: segmento2(solucion.k_AD_GF, solucion.k_AD_EG)
            tipo: oculto
            porque: 'Entre los cruces con G₁F₁ y E₁G₁, DA queda debajo de la base, cerca de G: la pirámide está encima de la lámina.'
          - traza: segmento2(solucion.k_AD_EG, figura.punto("A1"))
            tipo: visto
            porque: 'Del cruce con E₁G₁ a A₁, el borde DA queda fuera de la planta de la pirámide: desde arriba nada lo tapa.'
          - traza: segmento2(proy_alzado(solucion.V), proy_alzado(solucion.G))
            tipo: visto
            porque: 'VG queda entera por encima de A₂D₂, fuera del alzado de la lámina, y es contorno del alzado de la pirámide: nada la tapa por delante.'
          - traza: segmento2(proy_alzado(solucion.V), figura.punto("F2"))
            tipo: visto
            porque: 'VF separa las caras VGF y VFH, que miran las dos hacia delante, y su alzado queda fuera del de la lámina: nada la tapa.'
          - traza: segmento2(proy_alzado(solucion.V), figura.punto("E2"))
            tipo: oculto
            porque: 'VE separa dos caras que miran hacia atrás, VEG y VHE, y queda detrás de la cara VGF: en el cruce aparente de V₂E₂ con G₂F₂, GF va 50,2 mm por delante. Cerca de E, la tapa además la lámina.'
          - traza: segmento2(proy_alzado(solucion.V), solucion.k_VH_DC)
            tipo: visto
            porque: 'De V₂ a C₂D₂, VH queda fuera del alzado de la lámina, y es contorno del alzado de la pirámide: nada la tapa.'
          - traza: segmento2(solucion.k_VH_DC, solucion.k_VH_BC)
            tipo: oculto
            porque: 'Entre C₂D₂ y B₂C₂, VH cae dentro del alzado de la lámina, y la pirámide está detrás de ella: la lámina tapa ese tramo corto, junto a C₂.'
          - traza: segmento2(solucion.k_VH_BC, proy_alzado(solucion.H))
            tipo: visto
            porque: 'Por debajo de B₂C₂, VH sale del alzado de la lámina, camino de H, que está fuera de ella: nada la tapa.'
          - traza: segmento2(figura.punto("E2"), solucion.k_EG_AD)
            tipo: oculto
            porque: 'De E₂ a A₂D₂, EG cae dentro del alzado de la lámina, y la base está detrás, en el plano ABCD, del lado de la pirámide: la lámina la tapa.'
          - traza: segmento2(solucion.k_EG_AD, proy_alzado(solucion.G))
            tipo: visto
            porque: 'Pasada A₂D₂, EG sale del alzado de la lámina, porque G queda fuera de ella, y nada la tapa por delante.'
          - traza: segmento2(proy_alzado(solucion.G), solucion.k_GF_AD)
            tipo: visto
            porque: 'De G₂ a A₂D₂, GF queda fuera del alzado de la lámina, y nada la tapa por delante.'
          - traza: segmento2(solucion.k_GF_AD, figura.punto("F2"))
            tipo: oculto
            porque: 'De A₂D₂ a F₂, GF cae dentro del alzado de la lámina, y está detrás de ella: la lámina la tapa.'
          - traza: segmento2(figura.punto("F2"), solucion.k_FH_BC)
            tipo: oculto
            porque: 'De F₂ a B₂C₂, FH cae dentro del alzado de la lámina, y está detrás de ella: la lámina la tapa.'
          - traza: segmento2(solucion.k_FH_BC, proy_alzado(solucion.H))
            tipo: visto
            porque: 'Pasada B₂C₂, FH sale del alzado de la lámina, porque H queda fuera de ella, y nada la tapa por delante.'
          - traza: segmento2(proy_alzado(solucion.H), solucion.k_HE_BC)
            tipo: visto
            porque: 'De H₂ a B₂C₂, HE queda fuera del alzado de la lámina, y es contorno del alzado de la pirámide: nada la tapa.'
          - traza: segmento2(solucion.k_HE_BC, figura.punto("E2"))
            tipo: oculto
            porque: 'De B₂C₂ a E₂, HE cae dentro del alzado de la lámina, y está detrás de ella: la lámina la tapa.'
        bloques:
          - nombre: Abatimiento de ABCD con charnela AD
            explica: |
              El enunciado no fija método: abatir es elección nuestra, y dos cambios de plano darían
              el mismo cuadrado. El plano ABCD gira alrededor de AD, una horizontal suya que hace de
              charnela, hasta quedar sobre el plano horizontal de AD
              ([tema 3](/road-to-ingenieria/expresion-grafica/t03-metodos-descriptivos/#el-abatimiento-tumbar-el-plano)).
              Cada punto gira en un plano vertical perpendicular a AD, y en la planta se mueve por la
              perpendicular a A₁D₁: E por A₁B₁ y F por D₁C₁, que son líneas de máxima pendiente. El
              radio de E es AE en verdadera magnitud, la hipotenusa de A₁E₁ y de lo que E está más
              bajo que AD; el de F es DF, y los dos van al mismo lado de la charnela. Abatido, el
              plano está en verdadera magnitud, y el cuadrado de diagonal E₀F₀ se dibuja con regla y
              compás.
          - nombre: Vuelta de G y H a las vistas
            explica: |
              Para devolver G y H a la planta se deshace el giro
              ([tema 3](/road-to-ingenieria/expresion-grafica/t03-metodos-descriptivos/#la-vuelta-dibujar-en-verdadera-magnitud-y-desabatir)):
              cada punto vuelve por la perpendicular a la charnela A₁D₁, y así O₀ da O₁ y H₀ da H₁. La
              recta que los lleva sale por afinidad: GH abatida y GH en la planta se cortan en X,
              sobre la charnela, porque los puntos de la charnela no se mueven. O sigue siendo el
              punto medio de GH en la planta, y G₁ queda al otro lado de O₁, a la misma distancia que
              H₁. Los alzados salen después con una recta del plano, como en el tema 2: X₂O₂, el
              alzado de GH.
          - nombre: Abatimiento del plano del eje
            explica: |
              V está en la perpendicular al plano ABCD por O, y para llevar la altura en verdadera
              magnitud abatimos, por elección nuestra, el plano vertical que la contiene. En la planta
              ese plano es la recta O₁S, perpendicular a A₁D₁, porque la perpendicular a un plano se
              ve en la planta perpendicular a sus horizontales; su charnela es su horizontal por O, y
              se tumba sobre el plano horizontal de O. Como el plano es vertical, cada punto suyo está
              en la vertical de un punto de la charnela, y su radio es solo su diferencia de cotas con
              O: S se aparta de la charnela lo que AD está más alta que O. Abatido, S₀O₁ es el plano
              ABCD de canto, y la perpendicular a S₀O₁ por O₁ es la del plano sin deformar: ahí se
              llevan dos veces BC, del lado de S₀, que es el de las cotas mayores. V₀ vuelve a la
              planta por la perpendicular a la charnela, paralela a A₁D₁, y da V₁.
        construccion:
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("E2"), solucion.L_vE)
            guia: figura.segmento("AD2")
            bloque: Abatimiento de ABCD con charnela AD
            porque: |
              **La base.** El plano ABCD es oblicuo, y el cuadrado se dibuja con el plano en
              verdadera magnitud: se **abate** con la charnela AD, que es una horizontal del plano,
              sobre su plano horizontal. E está en AB, y A₁B₁ es perpendicular a A₁D₁: AB es una
              línea de máxima pendiente, y E se abate sobre ella. Para su radio hace falta lo que E
              está más bajo que AD: en el alzado, por E₂, la vertical hasta pasar A₂D₂.
          - con: marca
            traza: solucion.Kp
            rotulo: K
            bloque: Abatimiento de ABCD con charnela AD
            porque: |
              K, donde la vertical de E₂ corta A₂D₂: E₂K es lo que E está más bajo que AD, 17,9 mm.
          - con: regla
            traza: segmento2(figura.punto("D2"), solucion.L_AD2)
            bloque: Abatimiento de ABCD con charnela AD
            porque: |
              A₂D₂, prolongada con la regla más allá de D₂, larga: F₂ queda a la derecha de D₂.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("F2"), solucion.L_vF)
            guia: figura.segmento("AD2")
            bloque: Abatimiento de ABCD con charnela AD
            porque: |
              Por F₂, la vertical hasta pasar A₂D₂ prolongada.
          - con: marca
            traza: solucion.Lp
            rotulo: L
            bloque: Abatimiento de ABCD con charnela AD
            porque: |
              L, donde la vertical de F₂ corta A₂D₂ prolongada: F₂L es lo que F está más bajo que AD,
              7,4 mm.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("E1"), solucion.L_parE)
            guia: figura.segmento("AD1")
            bloque: Abatimiento de ABCD con charnela AD
            porque: |
              El triángulo del radio de E, rectángulo en E₁: un cateto es A₁E₁, sobre la línea de
              máxima pendiente; el otro, E₂K, va por E₁ paralelo a A₁D₁. Hacia arriba, donde hay
              sitio, y larga.
          - con: compas
            traza: 'arco(figura.punto("E1"), por: solucion.Te, desde: desplaza(solucion.Te, dx: -3.74, dy: 2.38), hasta: desplaza(solucion.Te, dx: 3.93, dy: -2.04))'
            toma: segmento2(figura.punto("E2"), solucion.Kp)
            bloque: Abatimiento de ABCD con charnela AD
            porque: |
              Con el compás, E₂K, llevada desde E₁ sobre esa paralela.
          - con: marca
            traza: solucion.Te
            rotulo: T
            bloque: Abatimiento de ABCD con charnela AD
            porque: |
              T, donde el arco corta la paralela a A₁D₁ por E₁: el otro extremo del cateto. A₁T es la
              hipotenusa: AE en verdadera magnitud, 31,5 mm.
          - con: compas
            traza: 'arco(figura.punto("A1"), por: solucion.Te, desde: desplaza(proy_planta(solucion.E0), dx: -5.10, dy: -7.85), hasta: desplaza(proy_planta(solucion.E0), dx: 4.25, dy: 8.34))'
            toma: segmento2(figura.punto("A1"), solucion.Te)
            bloque: Abatimiento de ABCD con charnela AD
            porque: |
              Con el compás abierto de A₁ a T y la punta en A₁, el arco corta A₁B₁: E gira alrededor de la
              charnela y, en la planta, cae en la línea de máxima pendiente, a la verdadera magnitud
              de AE desde A₁. Se abate hacia B; al otro lado de A₁D₁ valdría igual, pero se saldría
              del dibujo.
          - con: marca
            traza: proy_planta(solucion.E0)
            bloque: Abatimiento de ABCD con charnela AD
            porque: |
              E₀, donde el arco corta A₁B₁: E abatido, un poco más allá de E₁. Va sin rótulo, que
              pisaría el de B₁.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("F1"), solucion.L_parF)
            guia: figura.segmento("AD1")
            bloque: Abatimiento de ABCD con charnela AD
            porque: |
              Lo mismo con F, que está en DC, otra línea de máxima pendiente: por F₁, la paralela a
              A₁D₁, larga.
          - con: compas
            traza: 'arco(figura.punto("F1"), por: solucion.Uf, desde: desplaza(solucion.Uf, dx: -2.43, dy: 1.64), hasta: desplaza(solucion.Uf, dx: 2.63, dy: -1.28))'
            toma: segmento2(figura.punto("F2"), solucion.Lp)
            bloque: Abatimiento de ABCD con charnela AD
            porque: |
              Con el compás, F₂L, llevada desde F₁ sobre esa paralela.
          - con: marca
            traza: solucion.Uf
            rotulo: U
            bloque: Abatimiento de ABCD con charnela AD
            porque: |
              U, donde el arco corta la paralela a A₁D₁ por F₁: el otro extremo del cateto. D₁U es DF
              en verdadera magnitud, 13,0 mm.
          - con: compas
            traza: 'arco(figura.punto("D1"), por: solucion.Uf, desde: desplaza(proy_planta(solucion.F0), dx: -3.27, dy: -4.79), hasta: desplaza(proy_planta(solucion.F0), dx: 2.48, dy: 5.24))'
            toma: segmento2(figura.punto("D1"), solucion.Uf)
            bloque: Abatimiento de ABCD con charnela AD
            porque: |
              Con el compás abierto de D₁ a U y la punta en D₁, el arco corta D₁C₁, hacia el mismo lado que E₀: el
              plano gira entero, como una tapa.
          - con: marca
            traza: proy_planta(solucion.F0)
            rotulo: F₀
            bloque: Abatimiento de ABCD con charnela AD
            porque: |
              F₀, donde el arco corta D₁C₁: F abatido.
          - con: regla
            traza: segmento2(proy_planta(solucion.E0), proy_planta(solucion.F0))
            bloque: Abatimiento de ABCD con charnela AD
            porque: |
              E₀F₀ es la diagonal EF en **verdadera magnitud**, 57,1 mm. Con el plano abatido, el
              cuadrado se dibuja como en un papel.
          - con: compas
            traza: '[arco(proy_planta(solucion.E0), por: solucion.Mm, desde: desplaza(solucion.Mm, dx: 7.72, dy: 8.25), hasta: desplaza(solucion.Mm, dx: -7.12, dy: -8.77)), arco(proy_planta(solucion.E0), por: solucion.Nm, desde: desplaza(solucion.Nm, dx: 3.29, dy: -10.81), hasta: desplaza(solucion.Nm, dx: -4.03, dy: 10.55))]'
            toma: segmento2(proy_planta(solucion.E0), proy_planta(solucion.F0))
            bloque: Abatimiento de ABCD con charnela AD
            porque: |
              La otra diagonal es la **mediatriz** de E₀F₀: perpendicular por su punto medio. Con el
              compás abierto lo que mide E₀F₀ y la punta en E₀, dos arcos, uno a cada lado.
          - con: compas
            traza: '[arco(proy_planta(solucion.F0), por: solucion.Mm, desde: desplaza(solucion.Mm, dx: -3.29, dy: 10.81), hasta: desplaza(solucion.Mm, dx: 4.03, dy: -10.55)), arco(proy_planta(solucion.F0), por: solucion.Nm, desde: desplaza(solucion.Nm, dx: -7.72, dy: -8.25), hasta: desplaza(solucion.Nm, dx: 7.12, dy: 8.77))]'
            toma: segmento2(proy_planta(solucion.E0), proy_planta(solucion.F0))
            bloque: Abatimiento de ABCD con charnela AD
            porque: |
              Con la misma abertura y la punta en F₀, otros dos arcos, que cortan a los anteriores.
          - con: marca
            traza: solucion.Mm
            rotulo: M
            bloque: Abatimiento de ABCD con charnela AD
            porque: |
              M, donde se cortan los arcos de la izquierda: está a la misma distancia de E₀ que de F₀.
          - con: marca
            traza: solucion.Nm
            rotulo: N
            bloque: Abatimiento de ABCD con charnela AD
            porque: |
              N, donde se cortan los de la derecha, también a la misma distancia de los dos.
          - con: regla
            traza: segmento2(solucion.Mm, solucion.Nm)
            bloque: Abatimiento de ABCD con charnela AD
            porque: |
              MN es la mediatriz de E₀F₀: la diagonal GH abatida, perpendicular a EF por su centro.
              Corta la charnela A₁D₁.
          - con: marca
            traza: proy_planta(solucion.O0)
            rotulo: O₀
            bloque: Abatimiento de ABCD con charnela AD
            porque: |
              O₀, donde MN corta E₀F₀: el centro del cuadrado, abatido.
          - con: compas
            traza: 'arco(proy_planta(solucion.O0), por: proy_planta(solucion.H0), desde: desplaza(proy_planta(solucion.H0), dx: -1.28, dy: -5.50), hasta: desplaza(proy_planta(solucion.H0), dx: 0.89, dy: 5.58))'
            toma: segmento2(proy_planta(solucion.O0), proy_planta(solucion.E0))
            bloque: Abatimiento de ABCD con charnela AD
            porque: |
              Las dos diagonales de un cuadrado miden lo mismo y se cortan en su punto medio: con el
              compás abierto de O₀ a E₀ y la punta en O₀, el arco corta MN. La circunferencia corta MN a los dos
              lados de O₀; del lado de B₁C₁ está H, el vértice de menor cota, que es el que se lleva
              aquí. El otro, G, cae casi encima de su planta, y se saca de H.
          - con: marca
            traza: proy_planta(solucion.H0)
            rotulo: H₀
            bloque: Abatimiento de ABCD con charnela AD
            porque: |
              H₀, donde el arco corta MN del lado de B₁C₁: H abatido, el vértice de la base más lejos
              de la charnela, el más bajo.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(solucion.O0), solucion.L_pO_S), segmento2(proy_planta(solucion.O0), solucion.L_pO_V)]'
            guia: figura.segmento("AD1")
            bloque: Vuelta de G y H a las vistas
            porque: |
              **De vuelta a la planta.** Al deshacer el abatimiento, cada punto vuelve por la
              perpendicular a la charnela: por O₀, la perpendicular a A₁D₁, larga hacia los dos
              lados. Corta E₁F₁ en O₁, y es también la planta de la perpendicular al plano por O,
              porque es perpendicular a las horizontales: ahí va a estar V₁.
          - con: marca
            traza: proy_planta(solucion.O)
            bloque: Vuelta de G y H a las vistas
            porque: |
              O₁, donde esa perpendicular corta E₁F₁: el centro de la base en la planta, que es el
              punto medio de E₁F₁. Va sin rótulo: caería debajo del punto O₀.
          - con: marca
            traza: proy_planta(solucion.X)
            rotulo: X
            bloque: Vuelta de G y H a las vistas
            porque: |
              X, donde MN corta la charnela A₁D₁. Está en la charnela y no se mueve, así que la
              diagonal GH pasa por él también en la planta: es la **afinidad** del abatimiento.
          - con: regla
            traza: '[segmento2(proy_planta(solucion.X), solucion.L_XH), segmento2(proy_planta(solucion.X), solucion.L_XG)]'
            bloque: Vuelta de G y H a las vistas
            porque: |
              XO₁ es la planta de la diagonal GH: con la regla, por X y por O₁, larga hacia los dos
              lados.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.H0), solucion.L_pH)
            guia: figura.segmento("AD1")
            bloque: Vuelta de G y H a las vistas
            porque: |
              Por H₀, la perpendicular a la charnela, hacia ella, hasta pasar XO₁.
          - con: marca
            traza: proy_planta(solucion.H)
            rotulo: H₁
            bloque: Vuelta de G y H a las vistas
            porque: |
              H₁, donde esa perpendicular corta XO₁: H en la planta, fuera de la lámina, al otro lado
              de B₁C₁.
          - con: compas
            traza: 'arco(proy_planta(solucion.O), por: proy_planta(solucion.G), desde: desplaza(proy_planta(solucion.G), dx: 0.78, dy: 4.70), hasta: desplaza(proy_planta(solucion.G), dx: -0.45, dy: -4.74))'
            toma: segmento2(proy_planta(solucion.O), proy_planta(solucion.H))
            bloque: Vuelta de G y H a las vistas
            porque: |
              O es el punto medio de GH, y lo sigue siendo en la planta: con el compás abierto de O₁ a
              H₁, al otro lado de O₁, sobre la misma recta.
          - con: marca
            traza: proy_planta(solucion.G)
            bloque: Vuelta de G y H a las vistas
            porque: |
              G₁, donde el arco corta XO₁ al otro lado de O₁: el vértice de mayor cota, fuera de la
              lámina, al otro lado de A₁D₁. Va sin rótulo, que caería encima del punto X.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.X), solucion.L_vX)
            guia: figura.segmento("AD2")
            bloque: Vuelta de G y H a las vistas
            porque: |
              **Al alzado.** Un punto del plano se sube con una recta del plano que pase por él, y la
              diagonal GH sirve para los dos. X está en AD, así que X₂ cae en A₂D₂, en la vertical de
              X₁: por X₁, la línea de referencia, hasta pasar A₂D₂.
          - con: marca
            traza: proy_alzado(solucion.X)
            rotulo: X₂
            bloque: Vuelta de G y H a las vistas
            porque: |
              X₂, donde la vertical de X₁ corta A₂D₂: X en el alzado.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.O), solucion.L_vO)
            guia: figura.segmento("AD2")
            bloque: Vuelta de G y H a las vistas
            porque: |
              Por O₁, la línea de referencia, larga, hasta pasar A₂D₂ prolongada.
          - con: marca
            traza: proy_alzado(solucion.O)
            rotulo: O₂
            bloque: Vuelta de G y H a las vistas
            porque: |
              O₂, donde la vertical de O₁ corta E₂F₂: el centro de la base en el alzado, punto medio de
              E₂F₂.
          - con: regla
            traza: '[segmento2(proy_alzado(solucion.X), solucion.L_XG2), segmento2(proy_alzado(solucion.X), solucion.L_XH2)]'
            bloque: Vuelta de G y H a las vistas
            porque: |
              X₂O₂ es el alzado de la diagonal GH: una recta del plano trazada por dos puntos que ya
              tienes, X₂ y O₂. Con la regla, larga hacia los dos lados: G₂ y H₂ están en ella.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.H), solucion.L_vH)
            guia: figura.segmento("AD2")
            bloque: Vuelta de G y H a las vistas
            porque: |
              Por H₁, la línea de referencia, hasta pasar X₂O₂.
          - con: marca
            traza: proy_alzado(solucion.H)
            bloque: Vuelta de G y H a las vistas
            porque: |
              H₂, donde la vertical de H₁ corta X₂O₂: por debajo de B₂C₂, porque H es más bajo que BC.
              Va sin rótulo, que se juntaría con el de C₂.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.G), solucion.L_vG)
            guia: figura.segmento("AD2")
            bloque: Vuelta de G y H a las vistas
            porque: |
              Por G₁, la línea de referencia, hasta pasar X₂O₂ prolongada.
          - con: marca
            traza: proy_alzado(solucion.G)
            rotulo: G₂
            bloque: Vuelta de G y H a las vistas
            porque: |
              G₂, donde la vertical de G₁ corta X₂O₂ prolongada más allá de X₂: por encima de A₂D₂,
              porque G es más alto que AD.
          - con: marca
            traza: solucion.Wp
            bloque: Abatimiento del plano del eje
            porque: |
              **El vértice.** El punto donde la vertical de O₂ corta A₂D₂ prolongada: de O₂ a él va lo
              que AD está más alta que O, 12,7 mm. Va sin rótulo, que se juntaría con el de D₂. El punto
              roza por debajo ese rótulo de la lámina.
          - con: marca
            traza: solucion.S
            rotulo: S
            bloque: Abatimiento del plano del eje
            porque: |
              S, donde la perpendicular a A₁D₁ por O₁ corta A₁D₁. V está en la perpendicular al plano
              por O, y para llevar la altura en verdadera magnitud se **abate el plano vertical** que
              la contiene, con la charnela en su horizontal por O, que en la planta es esa misma recta.
              S es el punto de AD que está en ese plano vertical.
          - con: compas
            traza: 'arco(solucion.S, por: solucion.S0, desde: desplaza(solucion.S0, dx: -4.15, dy: 2.80), hasta: desplaza(solucion.S0, dx: 4.50, dy: -2.19))'
            toma: segmento2(proy_alzado(solucion.O), solucion.Wp)
            bloque: Abatimiento del plano del eje
            porque: |
              Abatido, S se aparta de la charnela O₁S lo que AD está más alta que O: el compás toma la
              distancia de O₂ a A₂D₂ prolongada y la lleva desde S sobre A₁D₁, que es perpendicular a
              O₁S. El arco corta A₁D₁ a los dos lados de S; vale cualquiera, y aquí se toma el de A₁,
              porque hacia D₁ el vértice abatido se saldría del dibujo por abajo.
          - con: marca
            traza: solucion.S0
            rotulo: S₀
            bloque: Abatimiento del plano del eje
            porque: |
              S₀, donde el arco corta A₁D₁, del lado de A₁: S abatido. S₀O₁ es la línea de máxima
              pendiente del plano por O, en verdadera magnitud: el plano ABCD **de canto**, como en un
              cambio de plano.
          - con: regla
            traza: segmento2(solucion.S0, proy_planta(solucion.O))
            bloque: Abatimiento del plano del eje
            porque: |
              S₀O₁, el canto del plano.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.O), solucion.L_eje0)
            guia: segmento2(solucion.S0, proy_planta(solucion.O))
            bloque: Abatimiento del plano del eje
            porque: |
              Por O₁, la perpendicular a S₀O₁: la perpendicular al plano, abatida y en verdadera
              magnitud. Hacia el lado de S₀, que es el de las cotas mayores: la pirámide es la de
              mayor cota. Larga.
          - con: compas
            traza: 'arco(proy_planta(solucion.O), por: solucion.Ym, desde: desplaza(solucion.Ym, dx: -10.68, dy: -0.49), hasta: desplaza(solucion.Ym, dx: 10.62, dy: 1.23))'
            toma: figura.segmento("BC1")
            bloque: Abatimiento del plano del eje
            porque: |
              BC es horizontal, así que B₁C₁ es su verdadera magnitud, 54,0 mm. Con esa abertura,
              desde O₁, sobre la perpendicular.
          - con: marca
            traza: solucion.Ym
            rotulo: Y
            bloque: Abatimiento del plano del eje
            porque: |
              Y, donde el arco corta la perpendicular a S₀O₁: a una vez BC de O₁.
          - con: compas
            traza: 'arco(solucion.Ym, por: solucion.V0, desde: desplaza(solucion.V0, dx: -10.68, dy: -0.49), hasta: desplaza(solucion.V0, dx: 10.62, dy: 1.23))'
            toma: figura.segmento("BC1")
            bloque: Abatimiento del plano del eje
            porque: |
              Otra vez la misma abertura, desde Y y más allá, lejos de O₁: la altura es el doble de
              BC, 108,0 mm.
          - con: marca
            traza: solucion.V0
            rotulo: V₀
            bloque: Abatimiento del plano del eje
            porque: |
              V₀, donde el arco corta la perpendicular a S₀O₁, más allá de Y: el vértice abatido, a
              dos veces BC de O₁.
          - con: escuadra-cartabon
            traza: segmento2(solucion.V0, solucion.L_parV)
            guia: figura.segmento("AD1")
            bloque: Abatimiento del plano del eje
            porque: |
              Al deshacer el abatimiento, V₀ vuelve por la perpendicular a la charnela O₁S, que es
              paralela a A₁D₁, hasta la planta de la perpendicular.
          - con: marca
            traza: proy_planta(solucion.V)
            rotulo: V₁
            bloque: Abatimiento del plano del eje
            porque: |
              V₁, donde esa paralela corta la perpendicular a A₁D₁ por O₁: el vértice en la planta, a
              la derecha de la base.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("E1"), solucion.L_fr1)
            guia: figura.segmento("AD2")
            porque: |
              V₂ va en la perpendicular al plano por O₂, que en el alzado es perpendicular a las
              **frontales**. Una frontal: por E₁, la paralela a A₂D₂, que es la dirección de las
              frontales en la planta, hasta pasar B₁C₁.
          - con: marca
            traza: proy_planta(solucion.P)
            rotulo: P₁
            porque: |
              P₁, donde esa paralela corta B₁C₁: P tiene el alejamiento de E, y EP es una frontal del
              plano.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.P), solucion.L_vP)
            guia: figura.segmento("AD2")
            porque: |
              Por P₁, la línea de referencia hasta pasar B₂C₂.
          - con: marca
            traza: proy_alzado(solucion.P)
            rotulo: P₂
            porque: |
              P₂, donde la vertical de P₁ corta B₂C₂.
          - con: regla
            traza: segmento2(figura.punto("E2"), proy_alzado(solucion.P))
            rotulo: f₂
            porque: |
              f₂, de E₂ a P₂: la frontal en el alzado, donde está en verdadera magnitud.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(solucion.O), solucion.L_eje2)
            guia: segmento2(figura.punto("E2"), proy_alzado(solucion.P))
            porque: |
              Por O₂, la perpendicular a f₂: el alzado de la perpendicular al plano por O, larga hacia
              arriba.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.V), solucion.L_vV)
            guia: figura.segmento("AD2")
            porque: |
              Por V₁, la línea de referencia, hasta pasar el alzado de la perpendicular.
          - con: marca
            traza: proy_alzado(solucion.V)
            rotulo: V₂
            porque: |
              V₂, donde la vertical de V₁ corta el alzado de la perpendicular: arriba del todo, porque
              V es el vértice de la pirámide de mayor cota.
          - con: arista-vista
            traza: '[segmento2(proy_planta(solucion.V), figura.punto("E1")), segmento2(proy_planta(solucion.V), proy_planta(solucion.G)), segmento2(proy_planta(solucion.V), figura.punto("F1")), segmento2(figura.punto("E1"), proy_planta(solucion.G)), segmento2(proy_planta(solucion.G), figura.punto("F1"))]'
            porque: |
              **Lo visto y lo oculto, en la planta.** Desde arriba se ven las caras que miran hacia
              arriba, VEG y VGF: sus aristas VE, VG, VF, EG y GF, en continua. VE, VF, EG y GF son
              además el contorno de la planta.
          - con: arista-oculta
            traza: '[segmento2(proy_planta(solucion.V), proy_planta(solucion.H)), segmento2(proy_planta(solucion.H), figura.punto("E1")), segmento2(figura.punto("F1"), proy_planta(solucion.H))]'
            porque: |
              H₁ cae dentro del contorno de la planta, y las tres aristas que llegan a H van por debajo
              de las caras VEG y VGF: VH, HE y FH, a trazos.
          - con: arista-oculta
            traza: '[segmento2(solucion.k_BC_VE, solucion.k_BC_VF), segmento2(solucion.k_AD_GF, solucion.k_AD_EG)]'
            porque: |
              Lo que de los bordes de la lámina queda debajo de la pirámide, a trazos: B₁C₁ entre los
              cruces con V₁E₁ y V₁F₁, y D₁A₁ entre los cruces con G₁F₁ y E₁G₁.
          - con: arista-vista
            traza: '[segmento2(figura.punto("B1"), solucion.k_BC_VE), segmento2(solucion.k_BC_VF, figura.punto("C1")), segmento2(figura.punto("D1"), solucion.k_AD_GF), segmento2(solucion.k_AD_EG, figura.punto("A1"))]'
            porque: |
              Y el resto de esos dos bordes, en continua: queda fuera de la planta de la pirámide.
              A₁B₁ y C₁D₁ se ven enteros, y ya están dibujados.
          - con: arista-vista
            traza: '[segmento2(proy_alzado(solucion.V), proy_alzado(solucion.G)), segmento2(proy_alzado(solucion.V), figura.punto("F2")), segmento2(proy_alzado(solucion.V), solucion.k_VH_DC), segmento2(solucion.k_VH_BC, proy_alzado(solucion.H)), segmento2(solucion.k_EG_AD, proy_alzado(solucion.G)), segmento2(proy_alzado(solucion.G), solucion.k_GF_AD), segmento2(solucion.k_FH_BC, proy_alzado(solucion.H)), segmento2(proy_alzado(solucion.H), solucion.k_HE_BC)]'
            porque: |
              **En el alzado**, la pirámide queda detrás de la lámina, y se ve lo que cae fuera del
              contorno de A₂B₂C₂D₂: VG y VF enteras, VH salvo un tramo corto junto a C₂, y los tramos
              de la base que salen de la lámina por G y por H.
          - con: arista-oculta
            traza: '[segmento2(proy_alzado(solucion.V), figura.punto("E2")), segmento2(solucion.k_VH_DC, solucion.k_VH_BC), segmento2(figura.punto("E2"), solucion.k_EG_AD), segmento2(solucion.k_GF_AD, figura.punto("F2")), segmento2(figura.punto("F2"), solucion.k_FH_BC), segmento2(solucion.k_HE_BC, figura.punto("E2"))]'
            porque: |
              Y a trazos: VE, que queda detrás de la cara VGF; el tramo corto de VH entre C₂D₂ y B₂C₂;
              y lo que de la base cae dentro de la lámina. Los cuatro bordes de la lámina se ven
              enteros.
        pista: |
          (1) AD y BC son horizontales: un cambio de plano con la línea nueva
          perpendicular a A₁D₁ pone el plano de canto, o se abate con charnela AD. (2) Con el
          plano en verdadera magnitud, la otra diagonal del cuadrado: perpendicular a EF por
          su punto medio O y del mismo largo. (3) Devuelve G y H a las dos vistas. (4) BC es
          horizontal: mídela en la planta; la altura es el doble. (5) V está en la
          perpendicular al plano por O, del lado de arriba, a esa altura. (6) En la planta se
          ven las caras que miran hacia arriba; en el alzado, la pirámide queda detrás de la
          lámina, y se ve lo que cae fuera de su contorno.
        desarrollo: |
          En verde claro, la pirámide en las dos vistas, con lo oculto a trazos, y los tramos de
          los bordes de la lámina que tapa. G cae fuera de la lámina ABCD por el lado de AD, y H
          por el de BC. En la planta van ocultas FH, HE y VH, que quedan debajo de las caras VEG
          y VGF, y lo que de B₁C₁ y D₁A₁ queda debajo de la pirámide. En el alzado van ocultas VE,
          detrás de la cara VGF, y lo que de la pirámide cae dentro de la lámina.

      - tipo: calcular
        titulo: La altura
        pregunta: La altura de la pirámide.
        respuesta:
          tipo: numero
          valor: '108.03'
          receta: altura_mm
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '54.02'
            receta: en_mm(vm(B, C))
            mensaje: |
              Eso es BC, sin doblar; y también lo que sale doblando B₂C₂ del alzado, que es la
              mitad de BC. BC es horizontal: su longitud está en la planta, B₁C₁, y la altura es
              el doble.
          - valor: '111.74'
            receta: en_mm(vm(solucion.V, E))
            mensaje: |
              Esa es una **arista lateral**, de V a un vértice de la base. La altura es la
              distancia de V al plano de la base, por la perpendicular al centro.
        pista: |
          BC es horizontal —B₂C₂ es horizontal en el alzado—, así que se ve en verdadera
          magnitud en la planta. La altura es el doble.
        desarrollo: |
          $$ h = 2\,\overline{BC} = 2\,\overline{B_1C_1} = 2 \cdot 54{,}016 \approx 108{,}03 \text{ mm} $$

          En el alzado, la arista V₂H₂ mide 108,29 mm, a 0,26 mm de la altura por casualidad: es el
          alzado de la arista lateral VH, que mide 111,74 mm, no la altura. La altura es el doble de
          B₁C₁, y en el dibujo está de O₁ a V₀, en el abatimiento del eje.

      - tipo: calcular
        titulo: El lado de la base
        pregunta: El lado de la base cuadrada, en verdadera magnitud.
        respuesta:
          tipo: numero
          valor: '40.37'
          receta: lado_mm
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '57.10'
            receta: en_mm(vm(E, F))
            mensaje: |
              Esa es la **diagonal** EF, en verdadera magnitud. El lado es la diagonal partida
              por raíz de dos.
          - valor: '34.73'
            receta: en_mm(vm_planta(E, solucion.G))
            mensaje: |
              Eso es lo que mide **E₁G₁ en la planta**. El lado EG no es horizontal, y la planta
              lo acorta.
          - valor: '39.09'
            receta: en_mm(vm_planta(solucion.G, F))
            mensaje: |
              Eso es lo que mide **G₁F₁ en la planta**: se parece al lado, pero GF no es
              horizontal y la planta la acorta.
          - valor: '26.68'
            receta: en_mm(vm_alzado(E, solucion.G))
            mensaje: |
              Eso es lo que mide **E₂G₂ en el alzado**, que también acorta: EG no es frontal.
        pista: |
          Con el plano en verdadera magnitud, EF es la diagonal del cuadrado: el lado es EF
          partido por raíz de dos.
        desarrollo: |
          $$ \ell = \frac{\overline{EF}}{\sqrt{2}} = \frac{57{,}095}{\sqrt{2}} \approx 40{,}37 \text{ mm} $$

          En la planta hay dos longitudes que caen dentro de la tolerancia por casualidad. H₁V₁, la
          planta de la arista HV, mide 40,19 mm, y D₁S₀, sobre la charnela, 39,63 mm. Ninguna es el lado:
          HV no está en verdadera magnitud, y D₁S₀ no es un lado de la base, sino lo que queda de la
          charnela entre D₁ y el punto S₀ del abatimiento de la altura. El lado sale de la diagonal
          abatida E₀F₀, partida por raíz de dos.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: 'AD y BC son horizontales del plano: con un cambio de plano perpendicular a A₁D₁ el plano queda de canto, o se abate con charnela AD.'
          - texto: Con el plano en verdadera magnitud se dibuja el cuadrado de diagonal EF, y G y H se devuelven a las dos vistas.
          - texto: BC es horizontal, así que su longitud se mide en la planta, y la altura es el doble, 108,03 mm.
          - texto: V está en la perpendicular al plano por el centro de la base, del lado de mayor cota.
          - texto: El cuadrado se dibuja en la planta sobre E₁F₁, porque la planta da EF casi en verdadera magnitud.
            trampa: true
            mensaje: |
              Casi no basta: E₁F₁ mide 56,12 mm y EF, 57,10. Y sobre todo, el ángulo recto de las
              diagonales solo se vería recto en la planta si una de las dos fuera horizontal, y
              ninguna lo es: en la planta forman unos 83°. Además G₁H₁ sale aún más corta,
              48,16 mm. El cuadrado dibujado en la planta no está en el plano.

    resolucion: |
      **El plano.** A₂D₂ y B₂C₂ son horizontales: AD y BC son horizontales del plano ABCD, y en
      la planta A₁D₁ y B₁C₁ son paralelas. El plano es oblicuo, y ni la planta ni el alzado
      lo dan en verdadera magnitud.

      **La base.** Con un cambio de plano, con la línea nueva perpendicular a A₁D₁ el plano queda
      de canto —basta uno, porque AD es horizontal—, y con otro, o abatiéndolo con charnela
      AD, en verdadera magnitud. Ahí EF mide 57,10 mm, y el cuadrado tiene la otra diagonal
      perpendicular a EF por su punto medio O, del mismo largo: el lado mide 40,37 mm. G y H
      se devuelven a las dos vistas; en la planta, cada uno sobre su horizontal del plano.
      Llamamos G al de mayor cota y H al de menor. Los dos caen fuera de la lámina ABCD: G al
      otro lado de AD y H al otro lado de BC.

      **La altura y el vértice.** BC es horizontal, y su longitud se mide en la planta: 54,02 mm.
      La altura es el doble, 108,03 mm. V está en la perpendicular al plano por O —en la
      planta, perpendicular a A₁D₁; en el alzado, perpendicular a las frontales— y del lado de
      mayor cota, que es el de arriba. En la vista con el plano de canto la perpendicular está
      en verdadera magnitud, y ahí se lleva la altura. La de menor cota tendría el vértice
      abajo, fuera del marco de la hoja.

      **La visibilidad.** En la planta se ven las caras que miran hacia arriba: V₁ cae fuera de la
      base y H₁ queda dentro del contorno, así que FH, HE y VH van ocultas, y la pirámide tapa
      parte de los bordes B₁C₁ y D₁A₁ de la lámina. En el alzado, el lado de mayor cota del
      plano mira hacia atrás, y la pirámide queda detrás de la lámina: con la lámina opaca, lo
      que de la pirámide cae dentro de A₂B₂C₂D₂ va oculto, y VE queda además detrás de la cara
      VGF. Si se toma el plano como transparente, en el alzado solo VE va oculta.

  # ── 3 · Las dos tuberías. Lo que enseña: el lugar de los puntos que
  #    equidistan de dos puntos es el plano mediador, no la mediatriz de una
  #    proyección; y un punto de una recta en un plano sale por intersección.
  - id: exeg-h55-3-dos-tuberias-iguales-hasta-el-colector
    titulo: Dos tuberías de igual longitud hasta un colector
    fuente: >-
      Ejercicio 55, apartado 3 · Colección de ejercicios de Geometría
      Descriptiva, Sistema Diédrico Directo · Dpto. de Expresión Gráfica y
      Proyectos de Ingeniería, EIG · UPV/EHU. El 55 (págs. 64-66; este
      apartado, en las 64 y 66) es uno de los cuatro ejercicios de varios
      apartados con que cierra la colección, todos sin fecha, y de ellos solo el
      54 se titula «Examen». Se transcribe el castellano; la figura se redibuja
      desde sus coordenadas.
    nivel: examen
    # Decisión: el castellano de la pág. 64 tal cual, sin el «3.». La «Nota:»
    # impresa va entera a `notas` (§04), con su frase en negrita.
    enunciado: |
      Se desean unir dos depósitos de agua representados por los puntos A y B, mediante sendas tuberías rectas de igual longitud, que concurran en un punto P del colector definido por la recta r.

      Dibujar las proyecciones diédricas de las dos tuberías.

      **Notas nuestras.** La figura es la mitad derecha de la tercera página del
      Ejercicio 55: los depósitos A y B, dados por sus cruces, y el colector r, en
      alzado (arriba) y en planta (abajo). La hoja no da escala para este
      apartado: las longitudes se dan en milímetros de la lámina.
    notas:
      - >-
        Nota: Para que dos segmentos (tuberías) tengan la misma longitud y se
        unan en un punto común sobre una recta (punto P), ese punto debe cumplir
        con una condición de equidistancia respecto a los puntos A y B. **Esto
        significa que la solución se encuentra en la intersección entre la recta
        r y un plano equidistante a los puntos A y B.**
    pide: El punto P del colector en las dos vistas, y lo que mide cada tubería.
    receta:
      lamina: ex55-3
      escena:
        A: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("A1"))'
        B: 'punto3(alzado: figura.punto("B2"), planta: figura.punto("B1"))'
        r: 'recta3(alzado: figura.segmento("r2"), planta: figura.segmento("r1"))'
      solucion:
        mediador: plano_mediador(A, B)
        P: corte_recta_plano(r, mediador)
        largo_mm: en_mm(vm(P, A))
        # Los errores: la mediatriz de A₁B₁ en la planta (el plano mediador de A
        # y de B llevado a la cota de A, que es vertical) y la de A₂B₂ en el
        # alzado (B llevado al alejamiento de A: el plano es de canto).
        horizontal_A: 'plano(A, punto3(alzado: figura.punto("A2"), planta: desplaza(figura.punto("A1"), dy: 10)), punto3(alzado: desplaza(figura.punto("A2"), dx: 10), planta: desplaza(figura.punto("A1"), dx: 10)))'
        B_a_cota_de_A: 'punto_en_plano(planta: figura.punto("B1"), plano: horizontal_A)'
        P_mediatriz_planta: corte_recta_plano(r, plano_mediador(A, B_a_cota_de_A))
        frontal_A: 'plano(A, punto3(alzado: desplaza(figura.punto("A2"), dy: -10), planta: figura.punto("A1")), punto3(alzado: desplaza(figura.punto("A2"), dx: 10), planta: desplaza(figura.punto("A1"), dx: 10)))'
        B_a_alejamiento_de_A: 'punto_en_plano(alzado: figura.punto("B2"), plano: frontal_A)'
        P_mediatriz_alzado: corte_recta_plano(r, plano_mediador(A, B_a_alejamiento_de_A))
        pie_desde_M: pie_perpendicular(punto_medio(segmento3(A, B)), r)
        # Para la construcción paso a paso. M, el punto medio de AB; h y f, la
        # horizontal y la frontal del plano mediador que pasan por M.
        M: punto_medio(segmento3(A, B))
        h: horizontal_por(M, mediador)
        f: frontal_por(M, mediador)
        # Im y Jm, los vértices de los dos triángulos equiláteros sobre A₁B₁: la
        # recta que los une es la mediatriz de A₁B₁, que es h₁, la planta de h.
        h1: 'perpendicular(por: proy_planta(M), a: segmento2(figura.punto("A1"), figura.punto("B1")))'
        Im: 'uno(medir_sobre(h1, desde: proy_planta(M), distancia: vm_planta(A, B) * raiz(3) / 2), 2)'
        Jm: 'uno(medir_sobre(h1, desde: proy_planta(M), distancia: vm_planta(A, B) * raiz(3) / 2), 1)'
        # El plano vertical que contiene a r (P_alto está encima de P) corta a
        # h en I1 y a f en I2: la recta I1I2 es su intersección con el plano
        # mediador, y su alzado corta a r₂ en P₂.
        P_alto: 'punto3(alzado: desplaza(proy_alzado(P), dy: mm(-10)), planta: proy_planta(P))'
        vert_r: plano(P, pie_desde_M, P_alto)
        I1: corte_recta_plano(h, vert_r)
        I2: corte_recta_plano(f, vert_r)
        # Los extremos de las rectas largas de la construcción: en el papel se
        # trazan más allá del punto que van a dar, y no paran en él.
        L_vM: 'desplaza(proy_alzado(M), dy: mm(-4))'
        L_h2: 'desplaza(proy_alzado(I1), dx: mm(-4))'
        L_f2: 'uno(medir_sobre(perpendicular(por: proy_alzado(M), a: segmento2(figura.punto("A2"), figura.punto("B2"))), desde: proy_alzado(I2), distancia: mm(4)), 1)'
        L_f1: 'desplaza(proy_planta(I2), dx: mm(4))'
        L_v1: 'desplaza(proy_alzado(I1), dy: mm(-4))'
        L_v2: 'desplaza(proy_alzado(I2), dy: mm(-4))'
        L_vP: 'desplaza(proy_planta(P), dy: mm(4))'
      comprueba:
        - en_plano(P, mediador)
        - en_recta(P, r)
    pasos:
      - tipo: reconocer
        pregunta: ¿Dónde están los puntos del espacio que equidistan de A y de B?
        opciones:
          - texto: En el plano mediador de AB, perpendicular a AB por su punto medio
            correcta: true
            mensaje: |
              Eso es: es lo que dice la nota del enunciado con otras palabras. P está en ese plano
              y en r, así que es el corte de los dos.
          - texto: En la mediatriz de A₁B₁, dibujada en la planta, como en geometría plana
            mensaje: |
              Esa mediatriz es la traza del plano vertical que equidista de las **plantas** de A y
              de B, y solo coincide con el plano mediador si AB es horizontal. Aquí A y B tienen
              distinta cota.
          - texto: En la recta AB, a mitad de camino entre A y B, porque los puntos que equidistan de los dos extremos están sobre el segmento que los une
            mensaje: |
              En AB solo hay un punto que equidiste de A y de B, el punto medio. Los demás están
              fuera de AB: forman un plano, perpendicular a AB por ese punto medio.

      - tipo: construir
        titulo: El punto P
        intro: |
          Marca P, el punto del colector r que equidista de A y de B, en el alzado y en la
          planta. Las tuberías son PA y PB.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, borrar]
        tolerancia: 1
        objetivos:
          - nombre: P2
            pide: el punto P del colector, en el alzado
            es: proy_alzado(solucion.P)
            bien: |
              P₂ está en r₂, donde r corta al plano mediador de AB.
            diagnosticos:
              - si: cerca_de(proy_alzado(solucion.P_mediatriz_alzado))
                mensaje: |
                  Has cortado r₂ con la mediatriz de A₂B₂, dibujada en el alzado. El plano mediador
                  no se ve así: A₂B₂ no está en verdadera magnitud, porque AB no es frontal. El
                  plano mediador se da por una horizontal y una frontal por el punto medio de AB.
                ejemplo: proy_alzado(solucion.P_mediatriz_alzado)
              - si: cerca_de(proy_alzado(solucion.pie_desde_M))
                mensaje: |
                  Ese es el punto de r más cercano al punto medio de AB. P no es el más cercano:
                  es el que está a la misma distancia de A que de B, el corte de r con el plano
                  mediador.
                ejemplo: proy_alzado(solucion.pie_desde_M)
              - si: en_recta(figura.segmento("r2"))
                mensaje: |
                  P está en r, pero en un punto concreto: donde r corta al plano mediador de AB.
                  El corte se encuentra con un plano auxiliar proyectante que contenga a r.
                ejemplo: pie_perpendicular(figura.punto("A2"), figura.segmento("r2"))
              - si: siempre
                mensaje: |
                  P es un punto de r: P₂ tiene que estar en r₂, donde r corta al plano mediador.
          - nombre: P1
            pide: el punto P del colector, en la planta
            es: proy_planta(solucion.P)
            bien: |
              P₁ está en r₁, en la vertical de P₂.
            diagnosticos:
              - si: cerca_de(proy_planta(solucion.P_mediatriz_planta))
                mensaje: |
                  Has cortado r₁ con la mediatriz de A₁B₁, dibujada en la planta. Eso solo valdría
                  si AB fuera horizontal: A y B tienen distinta cota, y la planta acorta AB.
                ejemplo: proy_planta(solucion.P_mediatriz_planta)
              - si: cerca_de(proy_planta(solucion.pie_desde_M))
                mensaje: |
                  Ese es el punto de r más cercano al punto medio de AB, y no el que equidista de A
                  y de B.
                ejemplo: proy_planta(solucion.pie_desde_M)
              - si: '!en_vertical_de(P2)'
                mensaje: |
                  P₁ va en la **vertical de P₂**: son el mismo punto visto dos veces.
                ejemplo: 'desplaza(proy_planta(solucion.P), dx: mm(8))'
              - si: siempre
                mensaje: |
                  Si ya tienes P₂: P₁ está en su vertical, sobre r₁.
        trazado:
          - proy_alzado(segmento3(A, solucion.P))
          - proy_alzado(segmento3(B, solucion.P))
          - proy_planta(segmento3(A, solucion.P))
          - proy_planta(segmento3(B, solucion.P))
        construccion:
          - con: regla
            traza: segmento2(figura.punto("A1"), figura.punto("B1"))
            porque: |
              **El plano mediador.** Los puntos que equidistan de A y de B forman el plano mediador de
              AB, el perpendicular a AB por su punto medio M. Se da por dos rectas suyas que pasan por
              M, una horizontal y una frontal, y para M hace falta AB: con la regla, A₁B₁.
          - con: regla
            traza: segmento2(figura.punto("A2"), figura.punto("B2"))
            porque: |
              Y A₂B₂ en el alzado.
          - con: compas
            traza: '[arco(figura.punto("A1"), por: solucion.Im, desde: desplaza(solucion.Im, dx: -5.01, dy: -11.63), hasta: desplaza(solucion.Im, dx: 4.19, dy: 11.95)), arco(figura.punto("A1"), por: solucion.Jm, desde: desplaza(solucion.Jm, dx: 12.58, dy: 1.48), hasta: desplaza(solucion.Jm, dx: -12.44, dy: -2.35))]'
            toma: segmento2(figura.punto("A1"), figura.punto("B1"))
            porque: |
              La horizontal del plano mediador es perpendicular a AB, y el ángulo recto se ve en la
              planta, donde ella está en verdadera magnitud: su planta es la perpendicular a A₁B₁ por
              M₁, la **mediatriz** de A₁B₁. Con el compás abierto lo que mide A₁B₁ y la punta en A₁,
              dos arcos, uno a cada lado.
          - con: compas
            traza: '[arco(figura.punto("B1"), por: solucion.Im, desde: desplaza(solucion.Im, dx: -12.58, dy: -1.48), hasta: desplaza(solucion.Im, dx: 12.44, dy: 2.35)), arco(figura.punto("B1"), por: solucion.Jm, desde: desplaza(solucion.Jm, dx: 1.42, dy: 3.53), hasta: desplaza(solucion.Jm, dx: -5.10, dy: -14.98))]'
            toma: segmento2(figura.punto("A1"), figura.punto("B1"))
            porque: |
              Con la misma abertura y la punta en B₁, otros dos arcos, que cortan a los anteriores.
          - con: marca
            traza: solucion.Im
            rotulo: S
            porque: |
              S, donde se cortan los arcos de arriba: está a la misma distancia de A₁ que de B₁.
          - con: marca
            traza: solucion.Jm
            rotulo: T
            porque: |
              T, donde se cortan los de abajo, también a la misma distancia de los dos.
          - con: regla
            traza: segmento2(solucion.Im, solucion.Jm)
            rotulo: h₁
            porque: |
              ST es la mediatriz de A₁B₁: h₁, la planta de la horizontal del plano mediador por M. No
              es el plano mediador, que no es vertical: es solo una recta suya.
          - con: marca
            traza: proy_planta(solucion.M)
            rotulo: M₁
            porque: |
              M₁, donde h₁ corta A₁B₁: el punto medio de A₁B₁, que es la planta del punto medio de AB.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.M), solucion.L_vM)
            guia: segmento2(figura.punto("A1"), figura.punto("A2"))
            porque: |
              Por M₁, la línea de referencia, paralela a la de A, que no está dibujada: la escuadra se
              alinea con las cruces A₁ y A₂, que están en la misma vertical, y se desliza sobre el
              cartabón hasta M₁. Hasta pasar A₂B₂.
          - con: marca
            traza: proy_alzado(solucion.M)
            rotulo: M₂
            porque: |
              M₂, donde la vertical de M₁ corta A₂B₂: el punto medio de AB en el alzado.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(solucion.M), solucion.L_h2)
            guia: segmento2(figura.punto("A1"), figura.punto("A2"))
            rotulo: h₂
            porque: |
              h₂, el alzado de esa horizontal: por M₂, perpendicular a las líneas de referencia, hacia
              la izquierda, larga.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(solucion.M), solucion.L_f2)
            guia: segmento2(figura.punto("A2"), figura.punto("B2"))
            rotulo: f₂
            porque: |
              La frontal del plano mediador por M también es perpendicular a AB, y el ángulo recto se
              ve en el alzado, donde ella está en verdadera magnitud: f₂, por M₂, perpendicular a
              A₂B₂, larga hacia abajo.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.M), solucion.L_f1)
            guia: segmento2(figura.punto("A1"), figura.punto("A2"))
            rotulo: f₁
            porque: |
              f₁, la planta de esa frontal: por M₁, perpendicular a las líneas de referencia, hacia la
              derecha, hasta pasar r₁.
          - con: marca
            traza: proy_planta(solucion.I1)
            rotulo: 1₁
            porque: |
              **El corte con r.** El plano vertical que contiene a r tiene su planta en r₁, y corta al
              plano mediador en una recta. Un punto de ella: 1₁, donde r₁ corta h₁.
          - con: marca
            traza: proy_planta(solucion.I2)
            porque: |
              Otro punto de esa recta: 2₁, donde r₁ corta f₁. Va sin rótulo, que tocaría el de r₁.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(solucion.I1), solucion.L_v1), segmento2(proy_planta(solucion.I2), solucion.L_v2)]'
            guia: segmento2(figura.punto("A1"), figura.punto("A2"))
            porque: |
              Por 1₁ y por 2₁, las líneas de referencia hasta el alzado: 1 es un punto de h y 2, de f.
              La de 1₁ pasa muy cerca de A₁ y de A₂.
          - con: marca
            traza: proy_alzado(solucion.I1)
            rotulo: 1₂
            porque: |
              1₂, donde la vertical de 1₁ corta h₂.
          - con: marca
            traza: proy_alzado(solucion.I2)
            rotulo: 2₂
            porque: |
              2₂, donde la vertical de 2₁ corta f₂.
          - con: regla
            traza: segmento2(proy_alzado(solucion.I1), proy_alzado(solucion.I2))
            porque: |
              1₂2₂ es el alzado de la recta en que el plano vertical de r corta al plano mediador. r
              está en ese plano vertical, así que corta al plano mediador en un punto de esta recta.
          - con: marca
            traza: proy_alzado(solucion.P)
            rotulo: P₂
            porque: |
              P₂, donde 1₂2₂ corta r₂: el punto del colector que equidista de A y de B.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(solucion.P), solucion.L_vP)
            guia: segmento2(figura.punto("A1"), figura.punto("A2"))
            porque: |
              Por P₂, la línea de referencia hasta pasar r₁.
          - con: marca
            traza: proy_planta(solucion.P)
            rotulo: P₁
            porque: |
              P₁, donde esa vertical corta r₁.
          - con: regla
            traza: '[segmento2(proy_alzado(solucion.P), figura.punto("A2")), segmento2(proy_alzado(solucion.P), figura.punto("B2")), segmento2(proy_planta(solucion.P), figura.punto("A1")), segmento2(proy_planta(solucion.P), figura.punto("B1"))]'
            porque: |
              Las dos tuberías, PA y PB, en las dos vistas. Miden lo mismo, 49,0 mm, y ninguna de las
              cuatro proyecciones está en verdadera magnitud: P₂A₂ mide 33,6 mm y P₁B₁, 17,2 mm. P₁A₁ y
              P₂B₂ se quedan cerca, por casualidad.
        pista: |
          (1) El punto medio M de AB, en las dos vistas. (2) El plano mediador, por una
          horizontal y una frontal que pasen por M: la horizontal, perpendicular a A₁B₁ en la
          planta; la frontal, perpendicular a A₂B₂ en el alzado. (3) El corte de r con ese
          plano, con un plano auxiliar proyectante que contenga a r: ahí está P.
        desarrollo: |
          En verde claro, las dos tuberías PA y PB en las dos vistas. P queda casi a mitad del
          tramo de r dibujado.

      - tipo: calcular
        titulo: Lo que mide cada tubería
        pregunta: Las dos tuberías miden lo mismo. ¿Cuánto, en milímetros de la lámina?
        respuesta:
          tipo: numero
          valor: '49.02'
          receta: largo_mm
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '33.58'
            receta: en_mm(vm_alzado(solucion.P, A))
            mensaje: |
              Eso es lo que mide **P₂A₂ en el alzado**. PA cambia mucho de alejamiento —casi
              36 mm— y apenas de cota: no es frontal, y el alzado la acorta. Hace falta su
              verdadera magnitud.
          - valor: '17.17'
            receta: en_mm(vm_planta(solucion.P, B))
            mensaje: |
              Eso es lo que mide **P₁B₁ en la planta**. PB sube mucho, y la planta la acorta.
        pista: |
          Es la verdadera magnitud de PA, o de PB, que sale igual: abate uno de los dos
          segmentos, con su planta y su diferencia de cotas.
        desarrollo: |
          $$ \overline{PA} = \overline{PB} \approx 49{,}02 \text{ mm} $$

          PA es casi horizontal y PB casi frontal, así que P₁A₁ (48,85 mm) y P₂B₂ (48,84 mm)
          miden casi lo mismo que la verdadera magnitud: es una casualidad de esta figura.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: Los puntos que equidistan de A y de B forman el plano mediador de AB, perpendicular a AB por su punto medio.
          - texto: 'El plano mediador se da por una horizontal y una frontal por el punto medio: la horizontal, perpendicular a A₁B₁ en la planta, y la frontal, perpendicular a A₂B₂ en el alzado.'
          - texto: P es el corte de r con ese plano, y se encuentra con un plano auxiliar proyectante que contenga a r.
          - texto: Las tuberías son PA y PB, y miden lo mismo, 49,02 mm.
          - texto: P está donde la mediatriz de A₁B₁ corta a r₁ en la planta.
            trampa: true
            mensaje: |
              Eso valdría si AB fuera horizontal. A y B tienen distinta cota, y esa mediatriz
              corta a r en otro punto, a unos 36 mm del bueno en la planta.

    resolucion: |
      **Dónde está P.** P está a la misma distancia de A que de B, así que está en el plano
      mediador de AB, el perpendicular a AB por su punto medio M. Y está en r. Es el corte de
      r con ese plano, que es lo que dice la nota del enunciado.

      **El plano mediador.** Se da por dos rectas suyas que pasan por M. Su horizontal es
      perpendicular a AB, y el ángulo recto se ve en la planta, donde ella está en verdadera
      magnitud: perpendicular a A₁B₁ por M₁. Su frontal, igual en el alzado: perpendicular a
      A₂B₂ por M₂.

      **El corte con r.** El plano vertical que contiene a r corta al plano mediador en una
      recta; su alzado corta a r₂ en P₂, y P₁ baja por la vertical hasta r₁. P queda casi a
      mitad del tramo de r dibujado.

      **Las tuberías.** PA y PB miden lo mismo, 49,02 mm en verdadera magnitud. PA es casi
      horizontal y PB casi frontal, así que P₁A₁ y P₂B₂ salen casi iguales a esa cifra, pero
      es una casualidad de la figura: P₂A₂ mide 33,58 mm y P₁B₁, 17,17 mm.

      **Lo que no es P.** La mediatriz de A₁B₁ en la planta solo equidista de las plantas: daría
      un punto de r a unos 36 mm del bueno. Y el punto de r más cercano a M tampoco es P.
