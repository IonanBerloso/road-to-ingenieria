asignatura: expresion-grafica
convocatoria: hoja
hoja: 55
# El Ejercicio 55 de la Colección de ejercicios de diédrico: «EJERCICIO 55»,
# págs. 64-66 de Coleccin_de_ejercicios.pdf. Del 1 al 51 la colección son las
# láminas SD, y del 52 al 55, cuatro ejercicios de varios apartados. El
# enunciado (pág. 64) es bilingüe, euskera arriba y castellano abajo, con capa
# de texto; las figuras están en la 65 (A3 vertical: el apartado 1, a-b arriba
# y c-d abajo) y en la 66 (A3 girado: el apartado 2 a la izquierda y el 3 a la
# derecha). El PDF rotula los apartados «Ejercicio 1», «Ejercicio 2» y
# «Ejercicio 3» dentro del 55.
#
# Lo interno sigue con el nombre de antes: `convocatoria: hoja`, `hoja: 55`,
# la carpeta `hoja-55` y los ids `exeg-h55-…`.
#
# Tres cosas, dichas antes de que nadie las deduzca:
#
# 1. **ES UN EJERCICIO DE EXAMEN SIN FECHA.** No dice curso ni día, y de los
#    cuatro ejercicios de varios apartados con que cierra la colección (52-55)
#    solo el 54 se titula «Examen» («Azterketa / Examen» en su enunciado y en
#    el cajetín de sus láminas; en las págs. 53-66 no sale en ningún otro).
#    Este lleva el cajetín «NOMBRE Y APELLIDOS · CURSO · FECHA · NOTA» en
#    blanco, que no se transcribe, y la casilla «α = · β = · d = · t =» de las
#    respuestas del apartado 1.
#
# 2. **LOS TRES APARTADOS ESTÁN, EN CUATRO PIEZAS.** El 1 va en dos, con su
#    `n`: los ángulos (a y b, t06) y las distancias (c y d, t05); sus dos
#    figuras son el mismo prisma, y la de c-d añade la recta ZZ′. El 2 (la
#    pirámide) y el 3 (las tuberías) van enteros, los dos de t05. Por eso no
#    hay `fuera`.
#
# 3. **LA VISIBILIDAD DEL 2 TOMA EL PLANO ABCD COMO LÁMINA OPACA.** La hoja no
#    lo precisa, y el apartado lo dice en sus «Notas nuestras»: con el plano
#    transparente, en el alzado solo VE iría oculta.
sinFecha: >-
  Es el Ejercicio 55 de la Colección de ejercicios de diédrico, uno de los
  cuatro ejercicios de varios apartados con que cierra la colección, del 52 al
  55, y ninguno dice de qué curso ni de qué día es. Los cuatro son bilingües, y
  de ellos solo el 54 se titula «Examen». Por eso va sin fecha y sin curso.
# Decisión (8 de octubre de 2026): el PDF de la colección se publica sin
# metadatos de autor, en public/examenes/expresion-grafica/; lo declara la
# colección (src/content/coleccion), y cada apartado enlaza su página junto a
# su fuente. Esta hoja no lleva `pdf` propio: ese PDF son las 66 páginas.
sinPdf: >-
  No se enlaza un PDF propio de esta hoja: está en la Colección de ejercicios,
  cuyo PDF original se abre desde cada apartado en su página, junto a su
  fuente, y desde la página de la colección. El enunciado está transcrito tal
  cual, en su versión en castellano, y cada figura se redibuja desde sus
  coordenadas exactas en la lámina de su apartado.

