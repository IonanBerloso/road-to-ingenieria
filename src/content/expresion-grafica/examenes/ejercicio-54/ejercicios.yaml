      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: Las aristas del prisma son horizontales, y el plano horizontal de cada una corta la pirámide en un cuadrado con el centro en V₁, que la planta da sin deformar.
          - texto: La planta de cada arista corta su cuadrado en dos puntos, la entrada y la salida, que se suben al alzado a la altura de la arista.
          - texto: VB y VD atraviesan el prisma; el plano de canto de cada una lo corta en un triángulo, y la arista corta dos de sus lados en la planta.
          - texto: Se unen los puntos que están a la vez en una misma cara de la pirámide y en una misma cara del prisma, y salen dos polígonos de cinco vértices.
          - texto: Un lado de la intersección va en continua si está en una cara vista de la pirámide y en una cara vista del prisma.
          - texto: Las tres aristas del prisma entran y salen, así que la intersección es un solo polígono con los seis puntos de las aristas.
            trampa: true
            mensaje: |
              Un solo polígono sale cuando el prisma muerde la pirámide sin atravesarla. Aquí la
              atraviesa entera: hay un polígono por donde entra y otro por donde sale, y cada uno
              lleva además los dos cortes de VB o de VD.
    resolucion: |
      **Qué es la figura.** Una pirámide regular de base cuadrada horizontal y un prisma de base
      triangular con las tres aristas horizontales, que la atraviesa de lado a lado: sus dos
      extremos quedan fuera de la pirámide, uno a cada lado. Es una penetración, y la
      intersección son dos polígonos cerrados, uno por donde entra el prisma y otro por donde
      sale.

      **Las aristas del prisma.** Cada una es horizontal, y su plano horizontal corta la pirámide
      en un cuadrado con el centro en V₁: sus vértices están en las aristas laterales, a la
      altura de la arista, y en la planta se ve sin deformar. El de e mide 23,7 mm de lado; el de
      f, 31,5 mm, y el de g, 36,0 mm. La planta de cada arista corta su cuadrado en dos puntos: e
      entra por la cara VBC en H y sale por la VCD en N; f entra por la VAB en K y sale por la VDA
      en Q; g entra por la VBC en M y sale por la VCD en T. Los seis se suben al alzado, cada uno
      a la altura de su arista.

      **Las aristas de la pirámide.** VA y VC no tocan el prisma; VB y VD lo atraviesan, entrando
      por la cara de e a f y saliendo por la de f a g. El plano de canto de VB, que en el alzado
      es V₂B₂, corta e₂, f₂ y g₂; bajados a la planta, esos tres puntos forman un triángulo, y
      V₁B₁ corta sus lados en J₁ y L₁. Con VD salen P₁ y R₁. Se suben a V₂B₂ y a V₂D₂.

      **Los polígonos.** Se unen los puntos que comparten una cara de cada sólido: H J K L M por la
      entrada (HJ y JK en la cara de e a f; KL y LM en la de f a g; MH en la de g a e) y N P Q R T
      por la salida, igual.

      **Lo que se ve.** Los dos sólidos son una sola pieza. Desde arriba se ven las caras de e a f
      y de g a e del prisma, y todas las laterales de la pirámide: en la planta van en
      discontinua KL, LM, QR y RT, y los tramos de la base y de VB y VD que el prisma tapa por
      encima. Desde delante se ven las caras de e a f y de f a g del prisma y las caras VAB y VDA
      de la pirámide: en el alzado van en continua JK, KL, PQ y QR, y en discontinua el resto de
      los dos polígonos, los tramos de e y g que van por detrás de la pirámide y E₂G₂.

  # ── 1 b · El ángulo de AB y AV, por abatimiento. Lo que enseña: que la
  #    planta no da el ángulo aunque AB sea horizontal, y que la distancia de V a
  #    la charnela es una hipotenusa.
  - id: exeg-h54-1b-el-angulo-de-ab-y-av-por-abatimiento
    titulo: El ángulo entre AB y AV, abatiendo la cara de la pirámide
    fuente: >-
      Ejercicio 54, apartado 1 b · Colección de ejercicios de Geometría
      Descriptiva, Sistema Diédrico Directo (EJERCICIO 54, págs. 61-63; el
      apartado 1, en las 61 y 62) · Dpto. de Expresión Gráfica y Proyectos de
      Ingeniería, EIG · UPV/EHU. Sin fecha: es uno de los cuatro ejercicios
      bilingües, del 52 al 55, con que cierra la colección, y el único que se
      titula «Examen» («Azterketa / Examen» en su enunciado, y cajetín de examen
      en sus láminas). Se transcribe el castellano; la figura se redibuja desde
      sus coordenadas.
    nivel: examen
    # Decisión: el castellano de la pág. 61 tal cual, con la cabecera del
    # apartado 1, la negrita y las mayúsculas de «ABATIMIENTO» como en la página.
    enunciado: |
      Dados los dos prismas, calcular gráficamente:

      b. Ángulo entre las rectas AB y AV (por **ABATIMIENTO**).

      **Notas nuestras.** La figura es la misma del apartado 1 a: una pirámide regular de base
      cuadrada y un prisma triangular que la atraviesa, aunque el enunciado diga «los dos
      prismas» (y el euskera, «Bi prisma»). Este apartado solo usa la pirámide. La base ABCD
      es un cuadrado horizontal de 50 mm de lado, y V está 100 mm por encima de su centro,
      medidos en la lámina (5 m y 10 m a la escala del cajetín): AB es un lado de la base y
      AV una arista lateral. Un ángulo no cambia con la escala.
    pide: El vértice V abatido con AB de charnela y el ángulo entre AB y AV, en grados.
    receta:
      lamina: ex54-1
      escena:
        V: 'punto3(alzado: figura.punto("V2"), planta: figura.punto("V1"))'
        A: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("A1"))'
        B: 'punto3(alzado: figura.punto("B2"), planta: figura.punto("B1"))'
        cara: plano(V, A, B)
        # El centro de la base, debajo de V.
        O: 'punto3(alzado: pie_perpendicular(figura.punto("V2"), figura.segmento("base2")), planta: figura.punto("V1"))'
      solucion:
        charnela: recta3(A, B)
        pie: pie_perpendicular(V, charnela)
        # Decisión: (V) hacia el lado de V₁, el primero de los dos que da
        # abatido() (lo comprueba tests/geometria/hoja-54.test.ts). Hacia fuera
        # también valdría, y el ángulo sería el mismo, pero cae en x = 163, y = 716
        # y no cabe en la lámina; abrirla hasta allí la haría un 50 % más ancha.
        # El intro fija el lado.
        V_ab: uno(abatido(V, charnela, cara), 1)
        angulo: angulo_rectas(charnela, segmento3(A, V))
        # Los errores. (V) a la diferencia de cotas de V y AB, el cateto que se lee
        # en el alzado, en vez de la hipotenusa; y (V) con A(V) igual a lo que mide
        # A₂V₂ en el alzado, como si AV fuera frontal.
        perpendicular_por_pie: horizontal_por(pie, plano_perpendicular_a_recta(pie, charnela))
        Vdz: 'punto_a_distancia(perpendicular_por_pie, desde: pie, distancia: diferencia_de_cotas(V, pie))'
        Valz: 'punto_a_distancia(perpendicular_por_pie, desde: pie, distancia: raiz(vm_alzado(A, V) * vm_alzado(A, V) - vm(A, pie) * vm(A, pie)))'
        # Los ángulos que no son: el de las plantas (A₁V₁ va por la diagonal del
        # cuadrado, hacia O) y el de los alzados, que se lee con B y V llevados
        # al alejamiento de A, donde los dos lados son frontales.
        horizontal_A1: 'perpendicular(por: figura.punto("A1"), a: segmento2(figura.punto("V2"), figura.punto("V1")))'
        B_frontal: 'punto3(alzado: figura.punto("B2"), planta: pie_perpendicular(figura.punto("B1"), horizontal_A1))'
        V_frontal: 'punto3(alzado: figura.punto("V2"), planta: pie_perpendicular(figura.punto("V1"), horizontal_A1))'
    pasos:
      - tipo: reconocer
        pregunta: AB es un lado de la base, y AV una arista lateral. ¿Qué se abate, y alrededor de qué, para ver el ángulo de AB y AV?
        opciones:
          - texto: La cara VAB, alrededor de AB, que es horizontal; A y B no se mueven, y el ángulo en A sale sin deformar en la planta
            correcta: true
            mensaje: |
              Eso es. Un ángulo se ve en verdadera magnitud cuando su plano está paralelo al de
              proyección. Abatir la cara VAB alrededor de una horizontal suya la deja sobre un
              plano horizontal, y AB es la más cómoda: está en la base, y A y B se quedan donde
              están. Solo hay que llevar V.
          - texto: Nada, porque AB es horizontal y el ángulo se mide en la planta, entre A₁B₁ y A₁V₁
            mensaje: |
              AB es horizontal, pero AV no: sube 100 mm desde A hasta V. La planta acorta AV y
              cambia el ángulo: entre A₁B₁ y A₁V₁ salen 45,0°, porque A₁V₁ va por la diagonal del
              cuadrado. El plano de las dos rectas está inclinado, y hay que abatirlo.
          - texto: La cara VAB, alrededor de AV, para que V no se mueva
            mensaje: |
              AV no es horizontal ni frontal, y una cara abatida alrededor de ella no cae sobre
              ningún plano de proyección: no se vería sin deformar en ninguna vista. La charnela
              tiene que ser una horizontal (o una frontal) del plano.

      - tipo: construir
        titulo: La cara VAB, abatida sobre la base
        intro: |
          Abate la cara VAB alrededor de AB: A y B no se mueven, y V cae sobre el plano de la
          base. Lleva V por la perpendicular a A₁B₁ que pasa por V₁, a su distancia real de AB, y
          hacia el lado de V₁: hacia el otro también valdría, y el ángulo sería el mismo, pero no
          cabe en la lámina. Marca (V).
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, transportador, borrar]
        tolerancia: 1
        objetivos:
          - nombre: Vab
            rotulo: (V)
            pide: el vértice V, abatido con AB de charnela
            es: proy_planta(solucion.V_ab)
            bien: |
              (V) está en la perpendicular a A₁B₁ por V₁, a la distancia real de V a AB: la
              hipotenusa del triángulo que tiene por catetos lo que separa V₁ de A₁B₁ en la planta
              y la diferencia de cotas de V y AB, que se mide en el alzado. A₁(V) mide lo mismo que
              AV.
            diagnosticos:
              - si: 'a_distancia(de: proy_planta(solucion.pie), d: vm_planta(V, solucion.pie))'
                mensaje: |
                  Has llevado desde el pie lo que separa V₁ de A₁B₁ **en la planta**, y la planta
                  acorta: V está 100 mm más alto que AB. Si has caído en V₁, esa es la planta de V, no
                  su abatido. La distancia real es la hipotenusa del triángulo con ese cateto y la
                  diferencia de cotas.
                ejemplo: figura.punto("V1")
              - si: '!en_recta(perpendicular(por: figura.punto("V1"), a: figura.segmento("AB1")))'
                mensaje: |
                  Al abatir, V gira alrededor de AB en un plano perpendicular a AB, y ese plano es
                  vertical: en la planta, (V) se mueve por la **perpendicular a A₁B₁ que pasa por
                  V₁**.
                ejemplo: 'desplaza(proy_planta(solucion.V_ab), dx: mm(6), dy: mm(6))'
              - si: 'a_distancia(de: proy_planta(solucion.pie), d: diferencia_de_cotas(V, solucion.pie))'
                mensaje: |
                  Has llevado la **diferencia de cotas** de V y AB, que se lee en el alzado: es solo
                  un cateto. Falta el otro, lo que separa V₁ de A₁B₁ en la planta; la distancia real
                  es la hipotenusa.
                ejemplo: proy_planta(rama(solucion.Vdz, 2))
              - si: 'a_distancia(de: figura.punto("A1"), d: vm_alzado(A, V))'
                mensaje: |
                  A₁ y tu (V) están a lo que mide **A₂V₂ en el alzado**, y el alzado también acorta:
                  AV no es frontal. Si construyes el triángulo por sus lados, A(V) tiene que medir AV
                  de verdad, y eso pide abatir o un triángulo aparte.
                ejemplo: proy_planta(rama(solucion.Valz, 2))
              - si: siempre
                mensaje: |
                  (V) está en la perpendicular a A₁B₁ por V₁, a la distancia real de V a AB: con lo
                  que separa V₁ de A₁B₁ en la planta y la diferencia de cotas de V y AB, la
                  hipotenusa.
        trazado:
          - 'segmento2(figura.punto("A1"), proy_planta(solucion.V_ab))'
          - 'segmento2(figura.punto("B1"), proy_planta(solucion.V_ab))'
          - 'segmento2(figura.punto("V1"), proy_planta(solucion.V_ab))'
        pista: |
          (1) Por V₁, la perpendicular a A₁B₁; su pie es el punto medio de A₁B₁, porque la pirámide
          es regular. (2) La distancia real de V a AB: un triángulo rectángulo con lo que separa V₁
          de A₁B₁ en la planta y la diferencia de cotas de V₂ y A₂B₂ en el alzado. (3) Llévala con
          el compás desde el pie, por esa perpendicular, hacia V₁.
        desarrollo: |
          En verde claro, la cara abatida, A₁ B₁ (V): un triángulo isósceles. V₁ queda a 25,0 mm de
          A₁B₁ y V está 100,0 mm más alto, así que (V) cae a 103,1 mm de A₁B₁, y A₁(V) mide
          106,1 mm, lo que mide AV.

      # Decisión: la tolerancia es la de un ángulo, 0,5°, y no se estrecha por un
      # distractor (§17). El error del cateto, (V) a la diferencia de cotas en vez de
      # la hipotenusa, da 75,99°, a 0,40° del bueno: aquí se da por bueno, y solo lo
      # atrapa el `construir`, donde ese (V) queda a 3,08 mm del bueno. El de A(V)
      # igual a A₂V₂ da 75,61°, a 0,78°, y sí va de distractor.
      - tipo: calcular
        titulo: El ángulo entre AB y AV
        pregunta: ¿Cuánto mide el ángulo entre las rectas AB y AV?
        respuesta:
          tipo: numero
          valor: '76.39'
          receta: angulo
          tolerancia: 0.5
          formato: un número, en grados
        distractores:
          - valor: '45.04'
            receta: angulo_rectas(charnela, segmento3(A, O))
            mensaje: |
              Ese es el ángulo **en la planta**, entre A₁B₁ y A₁V₁. A₁V₁ va por la diagonal del
              cuadrado, y por eso sale casi 45°. AV sube hasta V, y la planta deforma el ángulo: el
              de verdad está en la cara abatida, entre A₁B₁ y A₁(V).
          - valor: '95.22'
            receta: 180 - angulo_rectas(segmento3(A, solucion.B_frontal), segmento3(A, solucion.V_frontal))
            mensaje: |
              Ese es el ángulo **en el alzado**, entre A₂B₂ y A₂V₂. Ni AB ni AV son frontales, y
              el alzado también deforma: el ángulo de verdad se mide en la cara abatida.
          - valor: '84.78'
            receta: angulo_rectas(segmento3(A, solucion.B_frontal), segmento3(A, solucion.V_frontal))
            mensaje: |
              Ese es el ángulo agudo que forman **A₂B₂ y A₂V₂ en el alzado**, el suplementario
              del de 95,2°. Ni AB ni AV son frontales, y el alzado deforma: el ángulo de verdad
              está en la cara abatida, entre A₁B₁ y A₁(V).
          - valor: '27.25'
            receta: angulo_rectas(segmento3(V, A), segmento3(V, B))
            mensaje: |
              Ese es el ángulo de la cara en **V**, entre VA y VB. El que se pide es el de AB con
              AV, que está en **A**: entre A₁B₁ y A₁(V).
          - valor: '103.61'
            receta: 180 - angulo
            mensaje: |
              Has medido el ángulo del otro lado de A, entre A₁(V) y la prolongación de A₁B₁. Dos
              rectas que se cortan forman dos ángulos suplementarios, y el ángulo entre ellas es el
              menor: 180° − 103,6° = 76,4°.
          - valor: '75.61'
            receta: angulo_rectas(charnela, segmento3(A, rama(solucion.Valz, 2)))
            mensaje: |
              Has construido la cara con A(V) igual a lo que mide **A₂V₂ en el alzado**,
              100,45 mm, como si AV fuera frontal. No lo es, y el alzado la acorta: A(V) tiene
              que medir AV de verdad, 106,09 mm, y entonces el ángulo en A sale mayor.
        pista: |
          Mídelo en la cara abatida, en A₁, entre A₁B₁ y A₁(V): A no se ha movido al abatir.
        desarrollo: |
          En la cara abatida, el pie de V₁ en A₁B₁ está a 24,96 mm de A₁, y (V) a 103,11 mm de A₁B₁:
          $$ \tan\alpha = \frac{103{,}11}{24{,}96} \;\Longrightarrow\; \alpha \approx 76{,}39^{\circ} $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: AB está en la base, que es horizontal; sirve de charnela, y A y B no se mueven al abatir la cara VAB.
          - texto: V gira alrededor de AB en un plano perpendicular a AB, que es vertical; en la planta, (V) va por la perpendicular a A₁B₁ que pasa por V₁.
          - texto: La distancia de V a AB es la hipotenusa de un triángulo con lo que separa V₁ de A₁B₁ en la planta y la diferencia de cotas de V y AB.
          - texto: Abatida, la cara está en verdadera magnitud, y el ángulo en A₁ entre A₁B₁ y A₁(V) es el que forman AB y AV.
          - texto: El ángulo se mide en la planta, entre A₁B₁ y A₁V₁, porque AB es horizontal.
            trampa: true
            mensaje: |
              AB es horizontal, pero AV no: sube 100 mm. En la planta el ángulo sale de 45,0°, y el
              de verdad mide 76,4°.
    resolucion: |
      **Qué plano.** AB y AV se cortan en A y definen la cara VAB, que está inclinada: ninguna
      vista da su ángulo. AB es un lado de la base, horizontal, y sirve de charnela para abatir la
      cara sobre el plano de la base.

      **El abatimiento.** A y B no se mueven. V gira alrededor de AB en un plano perpendicular a AB,
      que es vertical, así que (V) va por la perpendicular a A₁B₁ que pasa por V₁. Su pie es el
      punto medio de A₁B₁, porque la pirámide es regular. La distancia de V a AB es la hipotenusa
      de un triángulo con 25,0 mm de planta (de V₁ a A₁B₁) y 100,0 mm de diferencia de cotas:
      103,1 mm. (V) queda a esa distancia del pie, hacia V₁, y A₁(V) mide 106,1 mm, lo mismo que AV.
      Hacia el otro lado de A₁B₁ también valdría, y el ángulo sería el mismo; aquí se lleva hacia
      V₁ porque es donde cabe en la lámina.

      **El ángulo.** En la cara abatida, el ángulo en A₁ entre A₁B₁ y A₁(V) mide 76,4°. La planta
      daría 45,0° y el alzado 95,2°: los dos deforman, porque AV no es ni horizontal ni frontal.

  # ── 2 a · La planta del trapecio. Lo que enseña: un plano dado por su línea de
  #    máxima pendiente trae sus horizontales dibujadas sin dibujarlas: van
  #    perpendiculares a r₁ en la planta. AB y DC lo son, porque A₂B₂ y D₂C₂ son
  #    horizontales en el alzado.
  - id: exeg-h54-2a-la-planta-del-trapecio-en-el-plano-de-r
    titulo: La planta de un trapecio en el plano de su línea de máxima pendiente
    fuente: >-
      Ejercicio 54, apartado 2 a · Colección de ejercicios de Geometría
      Descriptiva, Sistema Diédrico Directo (EJERCICIO 54, págs. 61-63; el
      apartado 2, en las 61 y 63) · Dpto. de Expresión Gráfica y Proyectos de
      Ingeniería, EIG · UPV/EHU. Sin fecha: es uno de los cuatro ejercicios
      bilingües, del 52 al 55, con que cierra la colección, y el único que se
      titula «Examen» («Azterketa / Examen» en su enunciado, y cajetín de examen
      en sus láminas). Se transcribe el castellano; la figura se redibuja desde
      sus coordenadas.
    nivel: examen
    # Decisión: el castellano de la pág. 61 tal cual, con la cabecera del
    # apartado 2 en las dos piezas y sin su «2.» (lo dice la fuente). «está el en
    # plano» es errata de la página, y se conserva (§08); lo dicen las notas.
    enunciado: |
      El trapecio ABCD está el en plano definido por la línea de máxima pendiente r.

      a. Completar su proyección en el plano horizontal.

      **Notas nuestras.** «Está el en plano» es errata de la página por «está en el plano», y
      se deja como está impresa. La figura es la mitad izquierda de la segunda lámina del
      Ejercicio 54: la recta r en sus dos proyecciones, r₂ arriba y r₁ abajo, y el trapecio
      ABCD solo en el alzado. Lo que falta es su planta. El cajetín de la lámina dice escala
      1:100, y aquí no cambia nada: se piden puntos.
    pide: La planta de los cuatro vértices del trapecio, A₁, B₁, C₁ y D₁.
    receta:
      lamina: ex54-2
      escena:
        r: 'recta3(alzado: figura.segmento("r2"), planta: figura.segmento("r1"))'
        plano_t: plano_por_lmp(r)
      solucion:
        A: 'punto_en_plano(alzado: figura.punto("A2"), plano: plano_t)'
        B: 'punto_en_plano(alzado: figura.punto("B2"), plano: plano_t)'
        C: 'punto_en_plano(alzado: figura.punto("C2"), plano: plano_t)'
        D: 'punto_en_plano(alzado: figura.punto("D2"), plano: plano_t)'
        # La construcción: los planos horizontales de AB y de DC cortan a r en el
        # punto de r a esa cota, y por él va la horizontal del plano.
        horizontal_AB: horizontal_por(A, plano_t)
        horizontal_DC: horizontal_por(D, plano_t)
        cota_AB: 'plano(A, B, punto3(alzado: figura.punto("A2"), planta: desplaza(proy_planta(A), dy: 10)))'
        cota_DC: 'plano(D, C, punto3(alzado: figura.punto("D2"), planta: desplaza(proy_planta(D), dy: 10)))'
        R_AB: corte_recta_plano(r, cota_AB)
        R_DC: corte_recta_plano(r, cota_DC)
        # El error de dibujar la horizontal del plano horizontal en el papel: la
        # recta horizontal del papel por el punto de r₁ a esa cota.
        vertical_papel: 'segmento2(figura.punto("A2"), desplaza(figura.punto("A2"), dy: 10))'
        papel_AB: 'perpendicular(por: proy_planta(R_AB), a: vertical_papel)'
        papel_DC: 'perpendicular(por: proy_planta(R_DC), a: vertical_papel)'
      comprueba:
        - en_recta(B, horizontal_por(A, plano_t))
        - en_recta(C, horizontal_por(D, plano_t))
    pasos:
      - tipo: reconocer
        pregunta: r es la línea de máxima pendiente del plano. ¿Cómo van, en la planta, las horizontales de ese plano?
        opciones:
          - texto: Perpendiculares a r₁, porque la línea de máxima pendiente es perpendicular a las horizontales y el ángulo recto se ve en la planta
            correcta: true
            mensaje: |
              Eso es. La línea de máxima pendiente es perpendicular a las horizontales del plano,
              y un ángulo recto con un lado horizontal se ve recto en la planta. Así que cada
              horizontal sale del punto de r a su cota, perpendicular a r₁.
          - texto: Horizontales en el papel, perpendiculares a las líneas de referencia, porque son horizontales
            mensaje: |
              «Horizontal» es de cota constante, y eso se ve en el **alzado**: ahí sí van
              horizontales en el papel. En la planta una horizontal puede ir en cualquier
              dirección; la del plano va perpendicular a r₁.
          - texto: Paralelas a r₁, porque están en el mismo plano que r
            mensaje: |
              Dos rectas de un mismo plano no tienen por qué ser paralelas. r sube con la mayor
              pendiente del plano, y las horizontales no suben nada: son las perpendiculares a r,
              y en la planta, a r₁.

      - tipo: construir
        titulo: Los cuatro vértices en la planta
        intro: |
          Marca A₁, B₁, C₁ y D₁. A₂B₂ y D₂C₂ son horizontales en el alzado: AB y DC son dos
          horizontales del plano. La de AB corta a r₂ a la altura de A₂; baja ese punto a r₁ y
          traza por él la perpendicular a r₁. A₁ y B₁ están en ella, en la vertical de A₂ y de B₂.
          Con DC, igual.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, medir, borrar]
        tolerancia: 1
        objetivos:
          - nombre: A1
            pide: el vértice A, en la planta
            es: proy_planta(solucion.A)
            bien: |
              A₁ está en la vertical de A₂, sobre la horizontal del plano que pasa por A: la
              perpendicular a r₁ por el punto de r₁ que está a la cota de A₂.
            diagnosticos:
              - si: 'en_recta(solucion.papel_AB) && en_vertical_de(figura.punto("A2"))'
                mensaje: |
                  Has trazado la horizontal del plano por A como una horizontal del papel. En la
                  planta, las horizontales de este plano van **perpendiculares a r₁**, porque r es
                  su línea de máxima pendiente.
                ejemplo: 'pie_perpendicular(figura.punto("A2"), solucion.papel_AB)'
              - si: '!en_vertical_de(figura.punto("A2"))'
                mensaje: |
                  A₁ va en la **vertical de A₂**: es el mismo punto visto desde arriba.
                ejemplo: 'desplaza(proy_planta(solucion.A), dx: mm(6))'
              - si: en_recta(proy_planta(solucion.horizontal_DC))
                mensaje: |
                  Esa es la horizontal de D y C, la de abajo en el alzado. A está en la de A y B:
                  la que corta a r₂ a la altura de A₂.
                ejemplo: 'proy_planta(punto_en_plano(alzado: pie_perpendicular(figura.punto("A2"), figura.segmento("DC2")), plano: plano_t))'
              - si: siempre
                mensaje: |
                  A₁ está en la vertical de A₂, sobre la perpendicular a r₁ que pasa por el punto de
                  r₁ a la cota de A. Ese punto se busca en el alzado, donde r₂ corta la horizontal
                  de A₂B₂.
          - nombre: B1
            pide: el vértice B, en la planta
            es: proy_planta(solucion.B)
            bien: |
              B₁ está en la misma horizontal que A₁, perpendicular a r₁, en la vertical de B₂.
            diagnosticos:
              - si: 'en_recta(solucion.papel_AB) && en_vertical_de(figura.punto("B2"))'
                mensaje: |
                  Has trazado la horizontal del plano por B como una horizontal del papel. En la
                  planta va **perpendicular a r₁**: B₁ está en la misma que A₁.
                ejemplo: 'pie_perpendicular(figura.punto("B2"), solucion.papel_AB)'
              - si: '!en_vertical_de(figura.punto("B2"))'
                mensaje: |
                  B₁ va en la **vertical de B₂**.
                ejemplo: 'desplaza(proy_planta(solucion.B), dx: mm(6))'
              - si: en_recta(proy_planta(solucion.horizontal_DC))
                mensaje: |
                  Esa es la horizontal de D y C. B está en la de A y B, la misma que A₁.
                ejemplo: 'proy_planta(punto_en_plano(alzado: pie_perpendicular(figura.punto("B2"), figura.segmento("DC2")), plano: plano_t))'
              - si: siempre
                mensaje: |
                  B₁ está en la vertical de B₂, sobre la horizontal de A₁: la perpendicular a r₁ a
                  la cota de AB.
          - nombre: C1
            pide: el vértice C, en la planta
            es: proy_planta(solucion.C)
            bien: |
              C₁ está en la vertical de C₂, sobre la horizontal del plano por D y C: la
              perpendicular a r₁ por el punto de r₁ que está a la cota de D₂C₂.
            diagnosticos:
              - si: 'en_recta(solucion.papel_DC) && en_vertical_de(figura.punto("C2"))'
                mensaje: |
                  Has trazado la horizontal del plano por C como una horizontal del papel. En la
                  planta va **perpendicular a r₁**.
                ejemplo: 'pie_perpendicular(figura.punto("C2"), solucion.papel_DC)'
              - si: '!en_vertical_de(figura.punto("C2"))'
                mensaje: |
                  C₁ va en la **vertical de C₂**.
                ejemplo: 'desplaza(proy_planta(solucion.C), dx: mm(6))'
              - si: en_recta(proy_planta(solucion.horizontal_AB))
                mensaje: |
                  Esa es la horizontal de A y B, la de arriba en el alzado. C está en la de D y C:
                  la que corta a r₂ a la altura de D₂C₂.
                ejemplo: 'proy_planta(punto_en_plano(alzado: pie_perpendicular(figura.punto("C2"), figura.segmento("AB2")), plano: plano_t))'
              - si: siempre
                mensaje: |
                  C₁ está en la vertical de C₂, sobre la perpendicular a r₁ que pasa por el punto de
                  r₁ a la cota de D₂C₂.
          - nombre: D1
            pide: el vértice D, en la planta
            es: proy_planta(solucion.D)
            bien: |
              D₁ está en la misma horizontal que C₁, perpendicular a r₁, en la vertical de D₂. A₁B₁
              y D₁C₁ salen paralelas, como tienen que salir los lados paralelos de un trapecio.
            diagnosticos:
              - si: 'en_recta(solucion.papel_DC) && en_vertical_de(figura.punto("D2"))'
                mensaje: |
                  Has trazado la horizontal del plano por D como una horizontal del papel. En la
                  planta va **perpendicular a r₁**: D₁ está en la misma que C₁.
                ejemplo: 'pie_perpendicular(figura.punto("D2"), solucion.papel_DC)'
              - si: '!en_vertical_de(figura.punto("D2"))'
                mensaje: |
                  D₁ va en la **vertical de D₂**.
                ejemplo: 'desplaza(proy_planta(solucion.D), dx: mm(6))'
              - si: en_recta(proy_planta(solucion.horizontal_AB))
                mensaje: |
                  Esa es la horizontal de A y B. D está en la de D y C, la misma que C₁.
                ejemplo: 'proy_planta(punto_en_plano(alzado: pie_perpendicular(figura.punto("D2"), figura.segmento("AB2")), plano: plano_t))'
              - si: siempre
                mensaje: |
                  D₁ está en la vertical de D₂, sobre la horizontal de C₁: la perpendicular a r₁ a la
                  cota de DC.
        trazado:
          - 'proy_planta([segmento3(solucion.A, solucion.B), segmento3(solucion.B, solucion.C), segmento3(solucion.C, solucion.D), segmento3(solucion.D, solucion.A)])'
          - proy_planta(segmento3(solucion.R_AB, solucion.B))
          - proy_planta(segmento3(solucion.R_DC, solucion.C))
        pista: |
          (1) En el alzado, prolonga A₂B₂ hasta r₂, y D₂C₂ también. (2) Baja esos dos puntos a r₁. (3)
          Por cada uno, la perpendicular a r₁: son las plantas de las horizontales AB y DC. (4) Baja
          cada vértice por su vertical hasta su horizontal.
        desarrollo: |
          En verde claro, la planta del trapecio y las dos horizontales desde r₁. A₁B₁ y D₁C₁ son
          perpendiculares a r₁ y paralelas entre sí; miden 30,0 y 60,0 mm, en verdadera magnitud,
          porque son horizontales.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: A₂B₂ y D₂C₂ son horizontales en el alzado, así que AB y DC son horizontales del plano.
          - texto: Cada horizontal corta a r en el punto de r que está a su cota, y eso se ve en el alzado, donde r₂ corta la prolongación de A₂B₂ o de D₂C₂.
          - texto: r es la línea de máxima pendiente, perpendicular a las horizontales; en la planta, las horizontales van perpendiculares a r₁.
          - texto: Cada vértice baja por su vertical hasta la planta de su horizontal.
          - texto: Las horizontales van en la planta horizontales en el papel, igual que en el alzado.
            trampa: true
            mensaje: |
              En el alzado una horizontal va horizontal en el papel porque no cambia de cota. En la
              planta no hay nada que la obligue: la de este plano va perpendicular a r₁.
    resolucion: |
      **Qué dice la figura.** r es la línea de máxima pendiente del plano, y el trapecio solo
      tiene alzado. A₂B₂ y D₂C₂ son horizontales: AB y DC son horizontales del plano, y por eso
      paralelas.

      **Las horizontales en la planta.** La línea de máxima pendiente es perpendicular a las
      horizontales del plano, y como el ángulo recto tiene un lado horizontal, se ve recto en la
      planta: las horizontales van perpendiculares a r₁. La de AB pasa por el punto de r a la cota
      de A₂B₂: en el alzado, donde la prolongación de A₂B₂ corta a r₂; bajado a r₁, la
      perpendicular a r₁ por él es la planta de AB. Con DC, igual.

      **Los vértices.** Cada uno baja por su vertical hasta su horizontal: A₁ y B₁ en la de AB, C₁ y
      D₁ en la de DC. A₁B₁ mide 30,0 mm y D₁C₁ 60,0 mm, en verdadera magnitud, porque son
      horizontales.

  # ── 2 b · El rectángulo perpendicular al trapecio. Lo que enseña: la
  #    perpendicular a un plano se dibuja contra sus horizontales (en la planta) y
  #    sus frontales (en el alzado), y una longitud sobre ella se lleva en
  #    verdadera magnitud. Y que «en la parte superior» fija un lado.
  - id: exeg-h54-2b-el-rectangulo-perpendicular-sobre-la-diagonal
    titulo: El rectángulo perpendicular al trapecio, sobre la diagonal AC
    fuente: >-
      Ejercicio 54, apartado 2 b · Colección de ejercicios de Geometría
      Descriptiva, Sistema Diédrico Directo (EJERCICIO 54, págs. 61-63; el
      apartado 2, en las 61 y 63) · Dpto. de Expresión Gráfica y Proyectos de
      Ingeniería, EIG · UPV/EHU. Sin fecha: es uno de los cuatro ejercicios
      bilingües, del 52 al 55, con que cierra la colección, y el único que se
      titula «Examen» («Azterketa / Examen» en su enunciado, y cajetín de examen
      en sus láminas). Se transcribe el castellano; la figura se redibuja desde
      sus coordenadas.
    nivel: examen
    # Decisión: los 30 mm son milímetros de la lámina, no reales. El cajetín dice
    # 1:100, y 30 mm reales serían 0,3 mm de papel; además, el propio trapecio
    # está dibujado en esas medidas: AB mide 30,0 mm y DC 60,0 mm en verdadera
    # magnitud (A₁B₁ y D₁C₁, que son horizontales). Lo dicen las notas. Y «en la
    # parte superior del trapecio» es del lado del plano hacia donde sube la cota:
    # una sola posición (el de debajo, un diagnóstico). El euskera lo dice igual:
    # «Laukizuzena trapezioaren gainetik kokatzen da», encima del trapecio.
    enunciado: |
      El trapecio ABCD está el en plano definido por la línea de máxima pendiente r.

      b. Dibujar un plano rectangular que es perpendicular al trapecio. Datos: un lado es la diagonal AC y el otro lado mide 30 mm. El rectángulo se sitúa en la parte superior del trapecio.

      **Notas nuestras.** «Está el en plano» es errata de la página por «está en el plano». La
      figura es la del apartado 2 a: r en sus dos proyecciones y el trapecio en el alzado; su
      planta es lo que pide el apartado 2 a, y aquí se vuelven a marcar A₁ y C₁. Llamamos E y F a
      los otros dos vértices del rectángulo, E el que va con A y F el que va con C. Los 30 mm son
      de la lámina, aunque el cajetín diga 1:100: el propio trapecio está dibujado en esas
      medidas (A₁B₁ mide 30,0 mm y D₁C₁, 60,0 mm), y 30 mm reales serían 0,3 mm de papel. «En
      la parte superior» es del lado del trapecio hacia donde sube la cota.
    pide: A₁ y C₁, y los otros dos vértices del rectángulo, E y F, en las dos vistas.
    receta:
      lamina: ex54-2
      escena:
        r: 'recta3(alzado: figura.segmento("r2"), planta: figura.segmento("r1"))'
        plano_t: plano_por_lmp(r)
        A: 'punto_en_plano(alzado: figura.punto("A2"), plano: plano_t)'
        B: 'punto_en_plano(alzado: figura.punto("B2"), plano: plano_t)'
        C: 'punto_en_plano(alzado: figura.punto("C2"), plano: plano_t)'
        D: 'punto_en_plano(alzado: figura.punto("D2"), plano: plano_t)'
      solucion:
        perp_A: perpendicular_a_plano(A, plano_t)
        perp_C: perpendicular_a_plano(C, plano_t)
        arriba: 'paralelo_a_distancia(plano_t, mm(30), sentido: ascendente)'
        abajo: 'paralelo_a_distancia(plano_t, mm(30), sentido: descendente)'
        E: corte_recta_plano(perp_A, arriba)
        F: corte_recta_plano(perp_C, arriba)
        E_abajo: corte_recta_plano(perp_A, abajo)
        F_abajo: corte_recta_plano(perp_C, abajo)
        # Los errores de llevar los 30 mm sobre una proyección de la perpendicular,
        # hacia arriba (el primero de los dos que da medir_sobre).
        E_30_planta: 'uno(medir_sobre(proy_planta(perp_A), desde: proy_planta(A), distancia: mm(30)), 1)'
        E_30_alzado: 'uno(medir_sobre(proy_alzado(perp_A), desde: figura.punto("A2"), distancia: mm(30)), 1)'
        F_30_planta: 'uno(medir_sobre(proy_planta(perp_C), desde: proy_planta(C), distancia: mm(30)), 1)'
        F_30_alzado: 'uno(medir_sobre(proy_alzado(perp_C), desde: figura.punto("C2"), distancia: mm(30)), 1)'
        # Para A₁ y C₁: el error de la horizontal del papel, como en el apartado 2 a.
        cota_AB: 'plano(A, B, punto3(alzado: figura.punto("A2"), planta: desplaza(proy_planta(A), dy: 10)))'
        cota_DC: 'plano(D, C, punto3(alzado: figura.punto("D2"), planta: desplaza(proy_planta(D), dy: 10)))'
        vertical_papel: 'segmento2(figura.punto("A2"), desplaza(figura.punto("A2"), dy: 10))'
        papel_AB: 'perpendicular(por: proy_planta(corte_recta_plano(r, cota_AB)), a: vertical_papel)'
        papel_DC: 'perpendicular(por: proy_planta(corte_recta_plano(r, cota_DC)), a: vertical_papel)'
    pasos:
      - tipo: reconocer
        pregunta: ¿Cómo se ven en las dos vistas las rectas perpendiculares al plano del trapecio, como AE y CF?
        opciones:
          - texto: En la planta, paralelas a r₁, perpendiculares a las horizontales; en el alzado, perpendiculares a las frontales del plano
            correcta: true
            mensaje: |
              Eso es. Una recta perpendicular a un plano es perpendicular a todas sus rectas, y el
              ángulo recto solo se ve recto en la vista donde la otra recta está en verdadera
              magnitud: en la planta, contra las horizontales; en el alzado, contra las frontales.
              Como r es la línea de máxima pendiente, en la planta la perpendicular va paralela a
              r₁.
          - texto: Perpendiculares a la diagonal AC en las dos vistas, porque el rectángulo tiene un ángulo recto en A
            mensaje: |
              El ángulo recto en A es entre AE y AC, pero AC no es horizontal ni frontal, y ese
              ángulo no se ve recto en ninguna vista. Además, AE no solo es perpendicular a AC:
              es perpendicular al plano entero, y eso se dibuja contra las horizontales y las
              frontales.
          - texto: En la planta, perpendiculares a r₁, como las horizontales
            mensaje: |
              Perpendiculares a r₁ son las horizontales del plano, que están dentro de él. La
              perpendicular al plano es perpendicular a ellas, así que en la planta va paralela a
              r₁.

      - tipo: construir
        titulo: Los otros dos vértices del rectángulo
        intro: |
          Marca primero A₁ y C₁, como en el apartado 2 a. Después, E y F en las dos vistas: por A y
          por C, la perpendicular al plano, y sobre ella 30 mm en verdadera magnitud, hacia donde
          sube la cota. Para llevar los 30 mm, abate la perpendicular sobre la planta con el
          triángulo de su planta y su diferencia de cotas, o haz un cambio de plano con la línea
          nueva paralela a r₁, que deja el plano de canto.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, borrar]
        tolerancia: 1
        objetivos:
          - nombre: A1
            pide: el vértice A, en la planta
            es: proy_planta(A)
            bien: |
              A₁ está en la vertical de A₂, sobre la horizontal del plano por A, perpendicular a r₁.
            diagnosticos:
              - si: 'en_recta(solucion.papel_AB) && en_vertical_de(figura.punto("A2"))'
                mensaje: |
                  Has trazado la horizontal del plano por A como una horizontal del papel. En la
                  planta va **perpendicular a r₁**.
                ejemplo: 'pie_perpendicular(figura.punto("A2"), solucion.papel_AB)'
              - si: '!en_vertical_de(figura.punto("A2"))'
                mensaje: |
                  A₁ va en la **vertical de A₂**.
                ejemplo: 'desplaza(proy_planta(A), dx: mm(6))'
              - si: siempre
                mensaje: |
                  A₁ está en la vertical de A₂, sobre la perpendicular a r₁ que pasa por el punto de
                  r₁ a la cota de A₂B₂.
          - nombre: C1
            pide: el vértice C, en la planta
            es: proy_planta(C)
            bien: |
              C₁ está en la vertical de C₂, sobre la horizontal del plano por D y C.
            diagnosticos:
              - si: 'en_recta(solucion.papel_DC) && en_vertical_de(figura.punto("C2"))'
                mensaje: |
                  Has trazado la horizontal del plano por C como una horizontal del papel. En la
                  planta va **perpendicular a r₁**.
                ejemplo: 'pie_perpendicular(figura.punto("C2"), solucion.papel_DC)'
              - si: '!en_vertical_de(figura.punto("C2"))'
                mensaje: |
                  C₁ va en la **vertical de C₂**.
                ejemplo: 'desplaza(proy_planta(C), dx: mm(6))'
              - si: siempre
                mensaje: |
                  C₁ está en la vertical de C₂, sobre la perpendicular a r₁ que pasa por el punto de
                  r₁ a la cota de D₂C₂.
          - nombre: E1
            pide: el vértice E, el que va con A, en la planta
            es: proy_planta(solucion.E)
            bien: |
              E₁ está en la paralela a r₁ por A₁, hacia donde baja el plano, a 16,0 mm de A₁: lo que
              ocupan en la planta 30 mm de una recta que forma 57,7° con el plano horizontal.
            diagnosticos:
              - si: cerca_de(proy_planta(solucion.E_abajo))
                mensaje: |
                  Ese es el vértice del rectángulo de **debajo** del trapecio. El enunciado lo quiere
                  en la parte superior: la perpendicular, desde A, hacia donde sube la cota.
                ejemplo: proy_planta(solucion.E_abajo)
              - si: 'a_distancia(de: proy_planta(A), d: mm(30)) && en_recta(proy_planta(solucion.perp_A))'
                mensaje: |
                  Has llevado los 30 mm **en la planta**, y la planta acorta la perpendicular: no
                  es horizontal. Los 30 mm van en verdadera magnitud; en la planta se quedan en
                  16,0 mm.
                ejemplo: solucion.E_30_planta
              - si: '!en_recta(proy_planta(solucion.perp_A))'
                mensaje: |
                  En la planta, la perpendicular al plano por A va **paralela a r₁**: es
                  perpendicular a las horizontales del plano, A₁B₁ y D₁C₁.
                ejemplo: 'desplaza(proy_planta(solucion.E), dx: mm(6), dy: mm(6))'
              - si: siempre
                mensaje: |
                  E₁ está en la paralela a r₁ por A₁, pero a otra distancia. Lleva los 30 mm en
                  verdadera magnitud: con el triángulo de la perpendicular (su planta y su diferencia
                  de cotas) o con un cambio de plano paralelo a r₁.
          - nombre: E2
            pide: el vértice E, en el alzado
            es: proy_alzado(solucion.E)
            bien: |
              E₂ está en la vertical de E₁, 25,4 mm por encima de A₂: lo que sube un segmento de
              30 mm que forma 57,7° con el plano horizontal.
            diagnosticos:
              - si: cerca_de(proy_alzado(solucion.E_abajo))
                mensaje: |
                  Ese es el vértice del rectángulo de **debajo**. Va en la parte superior: E queda
                  más alto que A.
                ejemplo: proy_alzado(solucion.E_abajo)
              - si: 'a_distancia(de: figura.punto("A2"), d: mm(30)) && en_recta(proy_alzado(solucion.perp_A))'
                mensaje: |
                  Has llevado los 30 mm **en el alzado**, y el alzado también acorta: la
                  perpendicular no es frontal. A₂E₂ mide 26,1 mm.
                ejemplo: solucion.E_30_alzado
              - si: '!en_vertical_de(E1)'
                mensaje: |
                  E₂ va en la **vertical de E₁**.
                ejemplo: 'proy_alzado(punto_medio(segmento3(A, solucion.E)))'
              - si: siempre
                mensaje: |
                  E₂ va en la vertical de E₁ y 25,4 mm por encima de A₂: lo que sube AE, que da el
                  triángulo de la verdadera magnitud.
                ejemplo: 'desplaza(proy_alzado(solucion.E), dy: mm(-6))'
          - nombre: F1
            pide: el vértice F, el que va con C, en la planta
            es: proy_planta(solucion.F)
            bien: |
              F₁ está en la paralela a r₁ por C₁, a 16,0 mm, igual que E₁ de A₁: E₁F₁ sale igual y
              paralela a A₁C₁.
            diagnosticos:
              - si: cerca_de(proy_planta(solucion.F_abajo))
                mensaje: |
                  Ese es el vértice del rectángulo de **debajo** del trapecio. Va en la parte
                  superior, como E.
                ejemplo: proy_planta(solucion.F_abajo)
              - si: 'a_distancia(de: proy_planta(C), d: mm(30)) && en_recta(proy_planta(solucion.perp_C))'
                mensaje: |
                  Has llevado los 30 mm **en la planta**, que acorta. En la planta se quedan en
                  16,0 mm, como de A₁ a E₁.
                ejemplo: solucion.F_30_planta
              - si: '!en_recta(proy_planta(solucion.perp_C))'
                mensaje: |
                  En la planta, la perpendicular al plano por C va **paralela a r₁**, como la de A.
                ejemplo: 'desplaza(proy_planta(solucion.F), dx: mm(6), dy: mm(6))'
              - si: siempre
                mensaje: |
                  F₁ está en la paralela a r₁ por C₁, a lo mismo que E₁ de A₁: el rectángulo tiene
                  AE igual y paralelo a CF.
          - nombre: F2
            pide: el vértice F, en el alzado
            es: proy_alzado(solucion.F)
            bien: |
              F₂ está en la vertical de F₁, 25,4 mm por encima de C₂.
            diagnosticos:
              - si: cerca_de(proy_alzado(solucion.F_abajo))
                mensaje: |
                  Ese es el vértice del rectángulo de **debajo**. F queda más alto que C.
                ejemplo: proy_alzado(solucion.F_abajo)
              - si: 'a_distancia(de: figura.punto("C2"), d: mm(30)) && en_recta(proy_alzado(solucion.perp_C))'
                mensaje: |
                  Has llevado los 30 mm **en el alzado**, que también acorta: C₂F₂ mide 26,1 mm.
                ejemplo: solucion.F_30_alzado
              - si: '!en_vertical_de(F1)'
                mensaje: |
                  F₂ va en la **vertical de F₁**.
                ejemplo: 'proy_alzado(punto_medio(segmento3(C, solucion.F)))'
              - si: siempre
                mensaje: |
                  F₂ va en la vertical de F₁ y 25,4 mm por encima de C₂, como E₂ sobre A₂.
                ejemplo: 'desplaza(proy_alzado(solucion.F), dy: mm(-6))'
        trazado:
          - 'proy_planta([segmento3(A, B), segmento3(B, C), segmento3(C, D), segmento3(D, A)])'
          - 'proy_planta([segmento3(A, C), segmento3(C, solucion.F), segmento3(solucion.F, solucion.E), segmento3(solucion.E, A)])'
          - 'proy_alzado([segmento3(A, C), segmento3(C, solucion.F), segmento3(solucion.F, solucion.E), segmento3(solucion.E, A)])'
        pista: |
          (1) A₁ y C₁, como en el apartado 2 a. (2) Por A₁, la paralela a r₁; por A₂, la
          perpendicular a las frontales del plano. (3) Toma un punto cualquiera de esa perpendicular,
          y con su planta y su diferencia de cotas con A, el triángulo de la verdadera magnitud:
          sobre su hipotenusa, 30 mm desde A, hacia arriba. (4) Devuelve ese punto a la planta y al
          alzado: es E. (5) Con C, igual: F.
        desarrollo: |
          En verde claro, el rectángulo A C F E en las dos vistas, sobre la planta del trapecio.
          El plano forma 32,3° con el horizontal, y sus perpendiculares, 57,7°: los 30 mm de AE
          ocupan 16,0 mm en la planta y suben 25,4 mm. AC mide 57,1 mm: el rectángulo es de
          57,1 por 30 mm.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: El rectángulo es perpendicular al trapecio y tiene un lado en AC, así que AE y CF son perpendiculares al plano del trapecio.
          - texto: En la planta, una perpendicular al plano va perpendicular a sus horizontales, es decir, paralela a r₁; en el alzado, perpendicular a sus frontales.
          - texto: Los 30 mm se llevan en verdadera magnitud, con el triángulo de la perpendicular o con un cambio de plano, porque la perpendicular no es horizontal ni frontal.
          - texto: «En la parte superior» fija el lado, hacia donde sube la cota, y F se lleva desde C igual que E desde A.
          - texto: En las dos vistas, AE va perpendicular a la proyección de AC, porque el rectángulo tiene un ángulo recto en A.
            trampa: true
            mensaje: |
              El ángulo recto entre AE y AC no se ve recto en ninguna vista, porque AC no es
              horizontal ni frontal. La perpendicular al plano se dibuja contra las horizontales y
              las frontales.
    resolucion: |
      **La planta del trapecio**, primero, como en el apartado 2 a: A₁ y C₁ en las horizontales de
      AB y de DC, perpendiculares a r₁.

      **Las perpendiculares.** El rectángulo es perpendicular al trapecio y tiene el lado AC, así
      que AE y CF son perpendiculares al plano. En la planta van perpendiculares a las
      horizontales, paralelas a r₁; en el alzado, perpendiculares a las frontales.

      **Los 30 mm.** Son de la lámina, como las medidas del trapecio. La perpendicular forma 57,7°
      con el plano horizontal (el plano, 32,3°), así que hay que llevarlos en verdadera magnitud:
      con el triángulo de la perpendicular o con un cambio de plano paralelo a r₁, que deja el
      plano de canto y la perpendicular paralela a la vista nueva. En la planta ocupan 16,0 mm y en
      altura suben 25,4 mm.

      **El lado.** «En la parte superior» es hacia donde sube la cota: E y F quedan por encima del
      trapecio. El rectángulo A C F E mide 57,1 por 30 mm.

  # ── 3 · El tren y el cable. Lo que enseña: la distancia entre dos rectas que se
  #    cruzan, cuando una es paralela a las dos vistas; que el tren no es su
  #    trayectoria; y a pasar de la lámina a metros.
  - id: exeg-h54-3-el-tren-y-el-cable
    titulo: El tren bajo el cable de electricidad, a escala 1:100
    fuente: >-
      Ejercicio 54, apartado 3 · Colección de ejercicios de Geometría
      Descriptiva, Sistema Diédrico Directo (EJERCICIO 54, págs. 61-63; el
      apartado 3, en las 61 y 63) · Dpto. de Expresión Gráfica y Proyectos de
      Ingeniería, EIG · UPV/EHU. Sin fecha: es uno de los cuatro ejercicios
      bilingües, del 52 al 55, con que cierra la colección, y el único que se
      titula «Examen» («Azterketa / Examen» en su enunciado, y cajetín de examen
      en sus láminas). Se transcribe el castellano; la figura se redibuja desde
      sus coordenadas.
    nivel: examen
    # Decisión: el castellano de la pág. 61 tal cual, sin el «3.». «A 4 metros de
    # su trayectoria» se lee en vertical: el punto más alto del tren está 4 m por
    # encima de t, que es por donde van las ruedas. El euskera lo zanja: «trenaren
    # puntu altuena ibilbidetik 4 metrotako altueran dagoela», a 4 metros de altura
    # de su trayectoria. Lo dicen las notas.
    enunciado: |
      La trayectoria de un tren lo define la recta t. La recta s es un cable de electricidad. Para cumplir con la ley de seguridad, el punto más alto del tren no debe pasar a menos de 3 metros de distancia del cable.

      Para simplificar los cálculos, se considera que el punto más alto del tren está situado a 4 metros de su trayectoria. La escala del dibujo es 1:100.

      a. ¿Cumple la ley de seguridad? ¿A qué distancia pasa?

      b. En la situación más cercana, definir el punto del tren más alto y el punto del cable más cercano a él.

      **Notas nuestras.** La figura es la mitad derecha de la segunda lámina del Ejercicio 54:
      la trayectoria t y el cable s, en alzado (arriba) y en planta (abajo). t₂ y t₁ son
      horizontales en el papel: t es horizontal y frontal a la vez, y va de izquierda a derecha.
      Los 4 m se toman en vertical: el punto más alto del tren va 4 m por encima de su
      trayectoria, que a escala 1:100 son 40 mm de la lámina por encima de t₂, con la misma
      planta. A 1:100, cada milímetro de la lámina son 0,1 m. Llamamos P al punto más alto del
      tren y Q al del cable en la situación más cercana; los nombres son nuestros.
    pide: Si cumple la ley y a qué distancia pasa, en metros, y el punto más alto del tren y el del cable más cercano a él, en las dos vistas.
    receta:
      lamina: ex54-3
      escena:
        s: 'recta3(alzado: figura.segmento("s2"), planta: figura.segmento("s1"))'
        t: 'recta3(alzado: figura.segmento("t2"), planta: figura.segmento("t1"))'
      solucion:
        # La recta que recorre el punto más alto del tren: t, 40 mm más arriba en
        # el alzado (4 m a 1:100), con la misma planta.
        Ti: 'punto3(alzado: desplaza(punto_medio(figura.segmento("t2")), dy: mm(-40)), planta: punto_medio(figura.segmento("t1")))'
        Td: 'punto3(alzado: desplaza(punto_medio(figura.segmento("t2")), dx: mm(20), dy: mm(-40)), planta: desplaza(punto_medio(figura.segmento("t1")), dx: mm(20)))'
        t_alta: recta3(Ti, Td)
        P: pie_comun(t_alta, s)
        Q: pie_comun(s, t_alta)
        distancia_m: en_mm(distancia_rectas(t_alta, s)) / 10
        # Los errores: la trayectoria sin subir, y el punto de s a la altura de la
        # recta alta, donde s₂ cruza t′₂ en el alzado.
        P0: pie_comun(t, s)
        Q0: pie_comun(s, t)
        cota_alta: 'plano(Ti, Td, punto3(alzado: desplaza(punto_medio(figura.segmento("t2")), dy: mm(-40)), planta: desplaza(punto_medio(figura.segmento("t1")), dy: 10)))'
        cruce: corte_recta_plano(s, cota_alta)
      comprueba:
        - en_plano(Td, cota_alta)
    pasos:
      - tipo: reconocer
        pregunta: ¿Qué distancia hay que comparar con los 3 m de la ley?
        opciones:
          - texto: La mínima entre el cable s y la recta que recorre el punto más alto del tren, que es t subida 4 m
            correcta: true
            mensaje: |
              Eso es. La ley habla del punto más alto, no de las ruedas: ese punto recorre una
              paralela a t, 4 m más arriba (40 mm en la lámina). Y «pasar a menos de 3 m» es la
              distancia mínima, la de la perpendicular común a esa recta y a s.
          - texto: La mínima entre s y t, y luego se le restan los 4 m del tren
            mensaje: |
              Restar no funciona: la perpendicular común de s y t no es vertical, y subir t 4 m no
              acorta la distancia 4 m. Hay que subir la recta primero y medir después.
          - texto: La que se ve en el alzado entre s₂ y t₂, porque el alzado da las alturas
            mensaje: |
              El alzado da la diferencia de cotas, no la distancia: s y t se apartan también en
              alejamiento, y eso solo se ve en la planta. La distancia mínima mezcla las dos, y se
              mide en verdadera magnitud.

      - tipo: construir
        titulo: Los dos puntos más cercanos
        intro: |
          Traza t′₂, la paralela a t₂ 40 mm más arriba: es la recta del punto más alto del tren (t′₁
          es t₁). Como t va de izquierda a derecha, en una vista de perfil, o con un cambio de plano
          con la línea nueva perpendicular a t₁, t′ se ve como un punto: el pie de la perpendicular
          desde él a s es Q, y la perpendicular común es de perfil, así que P está en la vertical de
          Q. Marca Q y P en las dos vistas.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, borrar]
        tolerancia: 1
        objetivos:
          - nombre: Q1
            pide: el punto del cable más cercano, en la planta
            es: proy_planta(solucion.Q)
            bien: |
              Q₁ está en s₁, en la vertical por donde pasa la perpendicular común, que es de perfil.
            diagnosticos:
              - si: cerca_de(proy_planta(solucion.Q0))
                mensaje: |
                  Ese es el punto del cable más cercano a la **trayectoria** t, sin subirla. El punto
                  más alto del tren va 4 m más arriba, 40 mm en la lámina, y su punto más cercano del
                  cable está mucho más a la derecha.
                ejemplo: proy_planta(solucion.Q0)
              - si: cerca_de(proy_planta(solucion.cruce))
                mensaje: |
                  Ese es el punto de s que está a la misma altura que el punto más alto del tren,
                  donde s₂ cruza t′₂ en el alzado. Estar a la misma altura no es estar lo más cerca:
                  ahí s está lejos en alejamiento.
                ejemplo: proy_planta(solucion.cruce)
              - si: en_recta(figura.segmento("s1"))
                mensaje: |
                  Estás en s₁, pero no en el punto más cercano. En una vista de perfil (o con un
                  cambio de plano perpendicular a t₁), t′ es un punto: traza desde él la
                  perpendicular a s, y su pie, devuelto a s₁, es Q₁.
                ejemplo: proy_planta(punto_medio(segmento3(solucion.Q, solucion.cruce)))
              - si: siempre
                mensaje: |
                  Q₁ está en s₁: es el pie, en el cable, de la perpendicular común a s y a la recta
                  del punto más alto del tren.
          - nombre: Q2
            pide: el punto del cable más cercano, en el alzado
            es: proy_alzado(solucion.Q)
            bien: |
              Q₂ está en s₂, en la vertical de Q₁.
            diagnosticos:
              - si: cerca_de(proy_alzado(solucion.cruce))
                mensaje: |
                  Ese es donde s₂ cruza t′₂: en el alzado se cruzan, pero en el espacio no se tocan,
                  porque s va por delante. No es el punto más cercano.
                ejemplo: proy_alzado(solucion.cruce)
              - si: cerca_de(proy_alzado(solucion.Q0))
                mensaje: |
                  Ese es el punto del cable más cercano a t sin subirla 4 m.
                ejemplo: proy_alzado(solucion.Q0)
              - si: '!en_vertical_de(Q1)'
                mensaje: |
                  Q₂ va en la **vertical de Q₁**.
                ejemplo: proy_alzado(punto_medio(segmento3(solucion.Q, solucion.cruce)))
              - si: siempre
                mensaje: |
                  Q₂ va en s₂, porque Q está en el cable, y en la vertical de Q₁.
                ejemplo: 'desplaza(proy_alzado(solucion.Q), dy: mm(-6))'
          - nombre: P1
            pide: el punto más alto del tren en la situación más cercana, en la planta
            es: proy_planta(solucion.P)
            bien: |
              P₁ está en t₁, en la vertical de Q₁: la perpendicular común a una recta que va de
              izquierda a derecha es de perfil.
            diagnosticos:
              - si: cerca_de(proy_planta(solucion.P0))
                mensaje: |
                  Ese es el punto de t más cercano al cable sin subir los 4 m. Con la recta del punto
                  más alto, la situación más cercana es otra, en la vertical de Q₁.
                ejemplo: proy_planta(solucion.P0)
              - si: '!en_vertical_de(Q1)'
                mensaje: |
                  P va en la **vertical de Q₁**: t′ va de izquierda a derecha, y la perpendicular
                  común a ella es de perfil, así que P y Q tienen la misma vertical.
                ejemplo: proy_planta(punto_medio(segmento3(solucion.P, solucion.P0)))
              - si: siempre
                mensaje: |
                  P₁ va en t₁ (el punto más alto del tren tiene la misma planta que la trayectoria) y
                  en la vertical de Q₁.
                ejemplo: 'desplaza(proy_planta(solucion.P), dy: mm(6))'
          - nombre: P2
            pide: el punto más alto del tren en la situación más cercana, en el alzado
            es: proy_alzado(solucion.P)
            bien: |
              P₂ está en t′₂, 40 mm por encima de t₂, en la vertical de P₁ y de Q₁.
            diagnosticos:
              - si: en_recta(figura.segmento("t2"))
                mensaje: |
                  Estás en t₂, la trayectoria. El punto más alto del tren va 4 m por encima, 40 mm en
                  la lámina a 1:100: en la paralela a t₂ 40 mm más arriba.
                ejemplo: 'pie_perpendicular(proy_alzado(solucion.P), figura.segmento("t2"))'
              - si: '!en_vertical_de(P1)'
                mensaje: |
                  P₂ va en la **vertical de P₁**.
                ejemplo: proy_alzado(punto_medio(segmento3(solucion.P, Ti)))
              - si: siempre
                mensaje: |
                  P₂ va en t′₂, 40 mm por encima de t₂, y en la vertical de P₁.
                ejemplo: 'desplaza(proy_alzado(solucion.P), dy: mm(-6))'
        trazado:
          - 'segmento2(desplaza(punto_medio(figura.segmento("t2")), dx: -81.48, dy: mm(-40)), desplaza(punto_medio(figura.segmento("t2")), dx: 81.48, dy: mm(-40)))'
          - proy_alzado(segmento3(solucion.P, solucion.Q))
          - proy_planta(segmento3(solucion.P, solucion.Q))
        pista: |
          (1) t′₂, la paralela a t₂ 40 mm más arriba. (2) Una vista de perfil: t′ se ve como un punto
          y s como una recta. (3) Desde el punto, la perpendicular a s: su pie es Q en esa vista. (4)
          Devuelve Q a s₁ y a s₂. (5) P, en la misma vertical, en t₁ y en t′₂.
        desarrollo: |
          En verde claro, t′₂ y la perpendicular común PQ en las dos vistas, vertical en el papel
          porque es de perfil. Su verdadera magnitud, en la vista de perfil, es 24,2 mm de la
          lámina: 2,42 m.

      - tipo: calcular
        titulo: La distancia del tren al cable
        pregunta: ¿A qué distancia pasa el punto más alto del tren del cable, en metros?
        respuesta:
          tipo: numero
          valor: '2.42'
          receta: distancia_m
          tolerancia: 0.1
          formato: un número, en metros
        distractores:
          - valor: '5.03'
            receta: en_mm(distancia_rectas(t, s)) / 10
            mensaje: |
              Esa es la distancia de la **trayectoria** al cable, sin subirla. La ley habla del
              punto más alto del tren, que va 4 m por encima: esa recta pasa más cerca.
          - valor: '1.03'
            receta: en_mm(distancia_rectas(t, s)) / 10 - 4
            mensaje: |
              Has restado los 4 m a la distancia de t a s. No vale: la perpendicular común no es
              vertical, y subir la recta 4 m no la acerca 4 m. Sube t primero y mide después.
          - valor: '1.83'
            receta: en_mm(vm_planta(solucion.P, solucion.Q)) / 10
            mensaje: |
              Eso es lo que mide **P₁Q₁ en la planta**: solo la diferencia de alejamientos. PQ es
              de perfil y no es horizontal; su verdadera magnitud junta esa diferencia y la de cotas.
          - valor: '1.58'
            receta: en_mm(vm_alzado(solucion.P, solucion.Q)) / 10
            mensaje: |
              Eso es lo que mide **P₂Q₂ en el alzado**: solo la diferencia de cotas. Falta la de
              alejamientos; la distancia es la hipotenusa.
          - valor: '24.17'
            receta: en_mm(distancia_rectas(t_alta, s))
            mensaje: |
              Eso es lo que mide en la lámina, en milímetros. El dibujo está a 1:100: cada
              milímetro son 0,1 m.
        pista: |
          En la vista de perfil, la distancia del punto t′ a la recta s está en verdadera magnitud.
          Mídela en mm y pásala a metros: a 1:100, divide entre 10.
        desarrollo: |
          En la vista de perfil, el punto t′ queda a 24,17 mm de la recta s; a escala 1:100:
          $$ d = 24{,}17 \text{ mm} \times 100 = 2417 \text{ mm} \approx 2{,}42 \text{ m} $$

      - tipo: reconocer
        pregunta: Con eso, ¿cumple la ley de seguridad?
        opciones:
          - texto: No; el punto más alto del tren pasa a menos de los 3 m que pide la ley
            correcta: true
            mensaje: |
              Eso es. 2,42 m es menos de 3 m: el tren no cumple. La situación más cercana es la de
              P y Q, en la misma vertical.
          - texto: Sí; pasa a más de los 3 m
            mensaje: |
              5,03 m es la distancia de la trayectoria, no la del punto más alto del tren. Con los
              4 m del tren, la distancia baja a 2,42 m, y no cumple.
          - texto: No; en el alzado s₂ corta a t′₂, así que el cable toca el tren
            mensaje: |
              Cortarse en el alzado no es tocarse: en ese punto s va por delante, a otro alejamiento.
              El cable no toca el tren, pero pasa a 2,42 m, y por eso no cumple.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: El punto más alto del tren recorre una paralela a t, 4 m más arriba, que a 1:100 son 40 mm por encima de t₂.
          - texto: t va de izquierda a derecha, paralela a las dos vistas; en una vista de perfil, la recta del punto más alto se ve como un punto.
          - texto: La distancia mínima es la de ese punto a la proyección de s en la vista de perfil, y la perpendicular común es de perfil, con P y Q en la misma vertical.
          - texto: Su verdadera magnitud, en la vista de perfil, es 24,2 mm de la lámina, 2,42 m de verdad, menos de 3 m, así que no cumple.
          - texto: Basta medir la distancia entre s y t y restarle los 4 m del tren.
            trampa: true
            mensaje: |
              La perpendicular común de s y t no es vertical, y restarle 4 m no da la distancia a la
              recta alta: saldría 1,03 m, y son 2,42.
    resolucion: |
      **Qué se compara.** La ley mira el punto más alto del tren, que va 4 m por encima de su
      trayectoria: recorre la paralela a t 4 m más arriba, 40 mm en la lámina a 1:100, con la misma
      planta que t. Hay que medir la distancia mínima de esa recta, t′, al cable s.

      **La perpendicular común.** t es horizontal y frontal a la vez: va de izquierda a derecha. En
      una vista de perfil (o con un cambio de plano con la línea nueva perpendicular a t₁), t′ se
      ve como un punto y s como una recta, y la distancia del punto a la recta está en verdadera
      magnitud. Su pie es Q, en el cable; la perpendicular común es de perfil, así que P, en t′,
      está en la misma vertical que Q.

      **La distancia.** Su verdadera magnitud, en la vista de perfil, es 24,17 mm de la lámina:
      2,42 m. Es menos de 3 m, y el tren **no
      cumple** la ley de seguridad. Sin subir los 4 m saldrían 5,03 m, y restándolos después,
      1,03 m: los dos están mal. P₁Q₁ y P₂Q₂ miden 1,83 y 1,58 m a escala: son sus proyecciones.
