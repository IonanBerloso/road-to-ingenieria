        # Decisión: la visibilidad toma los dos sólidos como una sola pieza maciza:
        # lo que de una arista queda dentro del otro sólido no se dibuja. El
        # enunciado no lo dice, y el tema de intersecciones del curso solo trata
        # plano-plano y recta-plano. Lo apoyan los restos de una solución que trae
        # la pág. 62 debajo de los trazos del enunciado: V₂B₂ y V₂D₂ van partidas
        # justo en J₂ y L₂ y en P₂ y R₂, y en la planta V₁B₁ va de V₁ a J₁, deja un
        # hueco y sigue en discontinua de L₁ a B₁; los tramos ocultos de la base
        # acaban donde f₁ y g₁ la cruzan. Con una excepción: esos restos no traen
        # guiones en V₁D₁ entre R₁ y D₁, y ese tramo va oculto, porque D₁ cae 4,3 mm
        # dentro de la franja del prisma, desde g₁. Aquí va en discontinua. No se ha
        # decidido a ojo: sale de un cálculo de líneas ocultas aparte (8 de octubre
        # de 2026), con rayos contra las caras de los dos sólidos y «dentro» para lo
        # que de una arista cae dentro del otro; da la misma que el paso dibujar que
        # había antes. Los tramos van en este paso, el último, aunque H, N, K, Q, M
        # y T se marcan en el anterior: la construcción los rehace. V₂A₂, la base
        # del alzado, V₁A₁, V₁C₁ y los extremos del prisma se ven enteros y ya están
        # en la lámina, y V₂C₂ y E₂G₂, enteras ocultas, ya vienen a trazos: no son
        # tramos.
        tramos:
          - traza: segmento2(proy_planta(solucion.H), proy_planta(solucion.J))
            tipo: visto
            porque: 'HJ está en la cara de e a f del prisma y en la VBC de la pirámide, que miran las dos hacia arriba: desde arriba nada lo tapa.'
          - traza: segmento2(proy_planta(solucion.J), proy_planta(solucion.K))
            tipo: visto
            porque: 'JK está en la cara de e a f del prisma y en la VAB de la pirámide, que miran las dos hacia arriba: desde arriba nada lo tapa.'
          - traza: segmento2(proy_planta(solucion.K), proy_planta(solucion.L))
            tipo: oculto
            porque: 'KL está en la cara de f a g, la de abajo del prisma, que mira hacia abajo: desde arriba la tapa la cara de e a f.'
          - traza: segmento2(proy_planta(solucion.L), proy_planta(solucion.M))
            tipo: oculto
            porque: 'LM está en la cara de f a g, que mira hacia abajo: desde arriba lo tapa el propio prisma, con sus caras de e a f y de g a e.'
          - traza: segmento2(proy_planta(solucion.M), proy_planta(solucion.H))
            tipo: visto
            porque: 'MH está en la cara de g a e del prisma y en la VBC de la pirámide, que miran las dos hacia arriba: desde arriba nada lo tapa.'
          - traza: segmento2(proy_planta(solucion.N), proy_planta(solucion.P))
            tipo: visto
            porque: 'NP está en la cara de e a f del prisma y en la VCD de la pirámide, que miran las dos hacia arriba: desde arriba nada lo tapa.'
          - traza: segmento2(proy_planta(solucion.P), proy_planta(solucion.Q))
            tipo: visto
            porque: 'PQ está en la cara de e a f del prisma y en la VDA de la pirámide, que miran las dos hacia arriba: desde arriba nada lo tapa.'
          - traza: segmento2(proy_planta(solucion.Q), proy_planta(solucion.R))
            tipo: oculto
            porque: 'QR está en la cara de f a g, que mira hacia abajo: desde arriba la tapa la cara de e a f.'
          - traza: segmento2(proy_planta(solucion.R), proy_planta(solucion.T))
            tipo: oculto
            porque: 'RT está en la cara de f a g, que mira hacia abajo: desde arriba lo tapa el propio prisma, con sus caras de e a f y de g a e.'
          - traza: segmento2(proy_planta(solucion.T), proy_planta(solucion.N))
            tipo: visto
            porque: 'TN está en la cara de g a e del prisma y en la VCD de la pirámide, que miran las dos hacia arriba: desde arriba nada lo tapa.'
          - traza: segmento2(figura.punto("E1"), proy_planta(solucion.H))
            tipo: visto
            porque: 'e es la arista de arriba del prisma, y fuera de la pirámide nada le pasa por encima.'
          - traza: segmento2(proy_planta(solucion.N), figura.punto("E1p"))
            tipo: visto
            porque: 'De N a E′, e sale de la pirámide y es la arista de arriba del prisma: nada le pasa por encima.'
          - traza: segmento2(figura.punto("F1"), proy_planta(solucion.K))
            tipo: visto
            porque: 'f es contorno de la planta del prisma, y fuera de la pirámide nada le pasa por encima.'
          - traza: segmento2(proy_planta(solucion.Q), figura.punto("F1p"))
            tipo: visto
            porque: 'De Q a F′, f sale de la pirámide y es contorno de la planta del prisma: nada le pasa por encima.'
          - traza: segmento2(figura.punto("G1"), proy_planta(solucion.M))
            tipo: visto
            porque: 'g es contorno de la planta del prisma, entre la cara de g a e, que mira hacia arriba, y la de f a g; fuera de la pirámide nada le pasa por encima.'
          - traza: segmento2(proy_planta(solucion.T), figura.punto("G1p"))
            tipo: visto
            porque: 'De T a G′, g sale de la pirámide y es contorno de la planta del prisma: nada le pasa por encima.'
          - traza: segmento2(figura.punto("V1"), proy_planta(solucion.J))
            tipo: visto
            porque: 'De V a J, VB separa dos caras de la pirámide que miran hacia arriba, VAB y VBC, y va por encima del prisma: nada la tapa.'
          - traza: segmento2(proy_planta(solucion.L), figura.punto("B1"))
            tipo: oculto
            porque: 'De L a B, VB va por debajo del prisma, que le pasa por encima: lo tapan sus caras de e a f y de f a g.'
          - traza: segmento2(figura.punto("V1"), proy_planta(solucion.P))
            tipo: visto
            porque: 'De V a P, VD separa dos caras de la pirámide que miran hacia arriba, VCD y VDA, y va por encima del prisma: nada la tapa.'
          - traza: segmento2(proy_planta(solucion.R), figura.punto("D1"))
