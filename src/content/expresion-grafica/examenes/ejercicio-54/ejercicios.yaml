            tipo: oculto
            porque: 'Del cruce con V₂B₂ a H₂, e va por detrás de la pirámide: en ese cruce aparente, VB va 10,6 mm por delante de e.'
          - traza: segmento2(proy_alzado(solucion.N), proy_alzado(solucion.TeD))
            tipo: oculto
            porque: 'De N₂ al cruce con V₂D₂, e sigue por detrás de la pirámide: en ese cruce aparente, VD va 4,2 mm por delante de e.'
          - traza: segmento2(proy_alzado(solucion.TeD), figura.punto("E2p"))
            tipo: visto
            porque: 'Pasado su cruce con V₂D₂, e sale del alzado de la pirámide: nada la tapa.'
          - traza: segmento2(figura.punto("F2"), proy_alzado(solucion.K))
            tipo: visto
            porque: 'f es la arista de delante del prisma, y entra por la cara VAB, que mira hacia delante: en su cruce aparente con V₂B₂ va 9,9 mm por delante de VB. Nada la tapa.'
          - traza: segmento2(proy_alzado(solucion.Q), figura.punto("F2p"))
            tipo: visto
            porque: 'f sale por la cara VDA, que mira hacia delante, y en su cruce aparente con V₂D₂ va 18,4 mm por delante de VD: nada la tapa.'
          - traza: segmento2(figura.punto("G2"), proy_alzado(solucion.TgB))
            tipo: visto
            porque: 'De G₂ al cruce con V₂B₂, g queda fuera del alzado de la pirámide: nada la tapa.'
          - traza: segmento2(proy_alzado(solucion.TgB), proy_alzado(solucion.M))
            tipo: oculto
            porque: 'Del cruce con V₂B₂ a M₂, g va por detrás de la pirámide: en ese cruce aparente, VB va 16,4 mm por delante de g.'
          - traza: segmento2(proy_alzado(solucion.T), proy_alzado(solucion.TgD))
            tipo: oculto
            porque: 'De T₂ al cruce con V₂D₂, g va por detrás de la pirámide: en ese cruce aparente, VD va 6,6 mm por delante de g.'
          - traza: segmento2(proy_alzado(solucion.TgD), figura.punto("G2p"))
            tipo: visto
            porque: 'Pasado su cruce con V₂D₂, g sale del alzado de la pirámide: nada la tapa.'
          - traza: segmento2(figura.punto("V2"), proy_alzado(solucion.J))
            tipo: visto
            porque: 'De V a J, VB es contorno del alzado de la pirámide, y por delante no le pasa nada: en su cruce con e₂, e va 10,6 mm por detrás.'
          - traza: segmento2(proy_alzado(solucion.L), figura.punto("B2"))
            tipo: visto
            porque: 'De L a B, VB sigue siendo contorno del alzado, y en su cruce con g₂, g va 16,4 mm por detrás: nada la tapa.'
          - traza: segmento2(figura.punto("V2"), proy_alzado(solucion.P))
            tipo: visto
            porque: 'De V a P, VD es contorno del alzado de la pirámide, y en su cruce con e₂, e va 4,2 mm por detrás: nada la tapa.'
          - traza: segmento2(proy_alzado(solucion.R), figura.punto("D2"))
            tipo: visto
            porque: 'De R a D, VD sigue siendo contorno del alzado, y en su cruce con g₂, g va 6,6 mm por detrás: nada la tapa.'
        trazado:
          - 'proy_planta([segmento3(solucion.TeB, solucion.TfB), segmento3(solucion.TfB, solucion.TgB), segmento3(solucion.TgB, solucion.TeB)])'
          - 'proy_planta([segmento3(solucion.TeD, solucion.TfD), segmento3(solucion.TfD, solucion.TgD), segmento3(solucion.TgD, solucion.TeD)])'
        construccion:
          - con: regla
            traza: '[segmento2(figura.punto("E2"), figura.punto("E2p")), segmento2(figura.punto("F2"), figura.punto("F2p")), segmento2(figura.punto("G2"), figura.punto("G2p"))]'
            porque: |
              El Taller no guarda los trazos del paso anterior, y aquí hacen falta las aristas del prisma
              enteras: en el alzado, e₂, f₂ y g₂ con la regla, de un extremo al otro.
          - con: regla
            traza: '[segmento2(figura.punto("E1"), figura.punto("E1p")), segmento2(figura.punto("F1"), figura.punto("F1p")), segmento2(figura.punto("G1"), figura.punto("G1p"))]'
            porque: |
              Y en la planta, e₁, f₁ y g₁.
          - con: marca
            traza: proy_alzado(solucion.TeB)
            rotulo: 10₂
            porque: |
              VB atraviesa el prisma. Para cortarla con sus caras, un plano auxiliar que la contenga: el
              de canto, perpendicular al alzado, que en el alzado es la propia V₂B₂. Ese plano corta la
              arista e donde e₂ cruza V₂B₂: 10₂. Es un nombre nuestro.
          - con: marca
            traza: proy_alzado(solucion.TfB)
            rotulo: 11₂
            porque: |
              11₂, donde f₂ cruza V₂B₂: el corte del plano de canto con la arista f. Es un nombre nuestro.
          - con: marca
            traza: proy_alzado(solucion.TgB)
            rotulo: 12₂
            porque: |
              12₂, donde g₂ cruza V₂B₂: el corte con la arista g. Es un nombre nuestro. Su rótulo
              quedará justo debajo de L₂, que va sin rótulo: el rótulo 12₂ es de este punto, el de g₂.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_alzado(solucion.TeB), proy_planta(solucion.TeB)), segmento2(proy_alzado(solucion.TfB), proy_planta(solucion.TfB)), segmento2(proy_alzado(solucion.TgB), proy_planta(solucion.TgB))]'
            guia: figura.segmento("base2")
            porque: |
              Se bajan a la planta por sus líneas de referencia, cada uno hasta la planta de su arista: 10
              está en e, 11 en f y 12 en g. No se paran en V₁B₁: son puntos del prisma, no de VB.
          - con: marca
            traza: proy_planta(solucion.TeB)
            porque: |
              10₁, donde la vertical de 10₂ corta e₁. Va sin rótulo: el punto M₁, que se marca más
              adelante, caería encima.
          - con: marca
            traza: proy_planta(solucion.TfB)
            rotulo: 11₁
            porque: |
              11₁, donde la vertical de 11₂ corta f₁.
          - con: marca
            traza: proy_planta(solucion.TgB)
            rotulo: 12₁
            porque: |
              12₁, donde la vertical de 12₂ corta g₁.
          - con: regla
            traza: '[segmento2(proy_planta(solucion.TeB), proy_planta(solucion.TfB)), segmento2(proy_planta(solucion.TfB), proy_planta(solucion.TgB)), segmento2(proy_planta(solucion.TgB), proy_planta(solucion.TeB))]'
            porque: |
              Unidos con la regla, son el triángulo que el plano de canto corta en el prisma. VB está en
              ese plano, así que atraviesa el prisma donde V₁B₁ cruza el triángulo.
          - con: marca
            traza: proy_planta(solucion.J)
            rotulo: J₁
            porque: |
              J₁, donde V₁B₁ corta el lado de 10₁ a 11₁, el de la cara de e a f: VB entra en el prisma por la
              cara de arriba.
          - con: marca
            traza: proy_planta(solucion.L)
            porque: |
              L₁, donde V₁B₁ corta el lado de 11₁ a 12₁, el de la cara de f a g: VB sale por la de abajo. Va sin
              rótulo, porque pisaría el de J₁: de los dos cortes de V₁B₁, L₁ es el más cercano a B₁.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(solucion.J), proy_alzado(solucion.J)), segmento2(proy_planta(solucion.L), proy_alzado(solucion.L))]'
            guia: figura.segmento("base2")
            porque: |
              Se suben J y L por sus líneas de referencia hasta V₂B₂, porque están en la arista VB.
          - con: marca
            traza: proy_alzado(solucion.J)
            rotulo: J₂
            porque: |
              J₂, donde la vertical de J₁ corta V₂B₂, entre e₂ y f₂.
          - con: marca
            traza: proy_alzado(solucion.L)
            porque: |
              L₂, donde la vertical de L₁ corta V₂B₂, entre f₂ y g₂, justo debajo de 11₂: va sin rótulo,
              porque el punto 11₂ lo taparía. El rótulo que tiene debajo es el de 12₂, el punto de g₂.
          - con: marca
            traza: proy_alzado(solucion.TeD)
            porque: |
              Con VD, igual: su plano de canto es V₂D₂ en el alzado, y corta la arista e donde e₂ cruza
              V₂D₂, en 13₂. Es un nombre nuestro, y va sin rótulo porque pisaría el de P₂, que cae justo
              debajo.
          - con: marca
            traza: proy_alzado(solucion.TfD)
            rotulo: 14₂
            porque: |
              14₂, donde f₂ cruza V₂D₂. Es un nombre nuestro.
          - con: marca
            traza: proy_alzado(solucion.TgD)
            porque: |
              15₂, donde g₂ cruza V₂D₂. Es un nombre nuestro, y va sin rótulo porque pisaría el de R₂, que
              cae justo encima.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_alzado(solucion.TeD), proy_planta(solucion.TeD)), segmento2(proy_alzado(solucion.TfD), proy_planta(solucion.TfD)), segmento2(proy_alzado(solucion.TgD), proy_planta(solucion.TgD))]'
            guia: figura.segmento("base2")
            porque: |
              Sus líneas de referencia, cada una hasta la planta de su arista: 13 a e₁, 14 a f₁ y 15 a g₁.
          - con: marca
            traza: proy_planta(solucion.TeD)
            porque: |
              13₁, donde la vertical de 13₂ corta e₁. Va sin rótulo: el punto T₁, que se marca más
              adelante, caería encima.
          - con: marca
            traza: proy_planta(solucion.TfD)
            rotulo: 14₁
            porque: |
              14₁, donde la vertical de 14₂ corta f₁.
          - con: marca
            traza: proy_planta(solucion.TgD)
            rotulo: 15₁
            porque: |
              15₁, donde la vertical de 15₂ corta g₁.
          - con: regla
            traza: '[segmento2(proy_planta(solucion.TeD), proy_planta(solucion.TfD)), segmento2(proy_planta(solucion.TfD), proy_planta(solucion.TgD)), segmento2(proy_planta(solucion.TgD), proy_planta(solucion.TeD))]'
            porque: |
              El triángulo que el plano de canto de VD corta en el prisma, con la regla: VD está en ese
              plano, así que atraviesa el prisma donde V₁D₁ cruza el triángulo.
          - con: marca
            traza: proy_planta(solucion.P)
            rotulo: P₁
            porque: |
              P₁, donde V₁D₁ corta el lado de 13₁ a 14₁, el de la cara de e a f: VD entra en el prisma por arriba.
          - con: marca
            traza: proy_planta(solucion.R)
            rotulo: R₁
            porque: |
              R₁, donde V₁D₁ corta el lado de 14₁ a 15₁, el de la cara de f a g: VD sale por abajo.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(solucion.P), proy_alzado(solucion.P)), segmento2(proy_planta(solucion.R), proy_alzado(solucion.R))]'
            guia: figura.segmento("base2")
            porque: |
              Se suben P y R por sus líneas de referencia hasta V₂D₂, porque están en la arista VD.
          - con: marca
            traza: proy_alzado(solucion.P)
            rotulo: P₂
            porque: |
              P₂, donde la vertical de P₁ corta V₂D₂, entre e₂ y f₂. De los dos puntos juntos, P₂ es el
              de abajo, el del rótulo; el de arriba, sin rótulo y sobre e₂, es 13₂.
          - con: marca
            traza: proy_alzado(solucion.R)
            rotulo: R₂
            porque: |
              R₂, donde la vertical de R₁ corta V₂D₂, entre f₂ y g₂. Entre J y L, y entre P y R, las
              aristas van por dentro del prisma.
          - con: marca
            traza: proy_alzado(solucion.Ce)
            rotulo: 2₂
            porque: |
              **Los seis puntos del paso anterior.** Para unir los polígonos hacen falta también H, N, K,
              Q, M y T, y el Taller no los guarda: se rehacen con la sección horizontal de cada arista
              del prisma, un cuadrado semejante a la base. Basta un vértice de cada cuadrado, y aquí se
              toma en la arista de la pirámide que no se ha usado: 2₂, donde e₂ cruza V₂C₂, es el punto
              de VC a la altura de e. Es el punto 2 del paso anterior, que allí salía con paralelas.
          - con: marca
            traza: proy_alzado(solucion.Cg)
            rotulo: 8₂
            porque: |
              8₂, donde g₂ cruza V₂C₂: el punto de VC a la altura de g, el 8 del paso anterior.
          - con: marca
            traza: proy_alzado(solucion.Af)
            rotulo: 5₂
            porque: |
              5₂, donde f₂ cruza V₂A₂: f pasa por delante de V₁, y su cuadrado se saca desde VA. Es el
              punto 5 del paso anterior.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_alzado(solucion.Ce), proy_planta(solucion.Ce)), segmento2(proy_alzado(solucion.Cg), proy_planta(solucion.Cg)), segmento2(proy_alzado(solucion.Af), proy_planta(solucion.Af))]'
            guia: figura.segmento("base2")
            porque: |
              Se bajan por sus líneas de referencia, 2 y 8 hasta V₁C₁ y 5 hasta V₁A₁, porque están en esas
              aristas.
          - con: marca
            traza: proy_planta(solucion.Ce)
            rotulo: 2₁
            porque: |
              2₁, donde la vertical de 2₂ corta V₁C₁: un vértice del cuadrado de e.
          - con: marca
            traza: proy_planta(solucion.Cg)
            rotulo: 8₁
            porque: |
              8₁, donde la vertical de 8₂ corta V₁C₁: un vértice del cuadrado de g, más cerca de C₁.
          - con: marca
            traza: proy_planta(solucion.Af)
            rotulo: 5₁
            porque: |
              5₁, donde la vertical de 5₂ corta V₁A₁: un vértice del cuadrado de f.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(solucion.Ce), solucion.L_H), segmento2(proy_planta(solucion.Cg), solucion.L_M)]'
            guia: figura.segmento("BC1")
            porque: |
              Los lados de cada cuadrado son paralelos a los de la base. Por 2₁ y por 8₁, la paralela a
              B₁C₁, hacia B, hasta pasar e₁ y g₁: los lados en la cara VBC, por donde e y g entran.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(solucion.Ce), solucion.L_N), segmento2(proy_planta(solucion.Cg), solucion.L_T)]'
            guia: figura.segmento("CD1")
            porque: |
              Por 2₁ y por 8₁, la paralela a C₁D₁, hacia D, hasta pasar e₁ y g₁: los lados en la cara VCD,
              por donde salen.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.Af), solucion.L_K)
            guia: figura.segmento("AB1")
            porque: |
              Por 5₁, la paralela a A₁B₁, hasta pasar f₁: el lado del cuadrado de f en la cara VAB.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.Af), solucion.L_Q)
            guia: figura.segmento("DA1")
            porque: |
              Y por 5₁, la paralela a D₁A₁, hasta pasar f₁: el lado en la cara VDA.
          - con: marca
            traza: proy_planta(solucion.H)
            rotulo: H₁
            porque: |
              H₁, donde e₁ corta la paralela a B₁C₁ por 2₁: e entra en la pirámide por la cara VBC.
          - con: marca
            traza: proy_planta(solucion.N)
            rotulo: N₁
            porque: |
              N₁, donde e₁ corta la paralela a C₁D₁ por 2₁: e sale por la cara VCD.
          - con: marca
            traza: proy_planta(solucion.M)
            rotulo: M₁
            porque: |
              M₁, donde g₁ corta la paralela a B₁C₁ por 8₁: g entra por la cara VBC.
          - con: marca
            traza: proy_planta(solucion.T)
            rotulo: T₁
            porque: |
              T₁, donde g₁ corta la paralela a C₁D₁ por 8₁: g sale por la cara VCD.
          - con: marca
            traza: proy_planta(solucion.K)
            rotulo: K₁
            porque: |
              K₁, donde f₁ corta la paralela a A₁B₁ por 5₁: f entra por la cara VAB.
          - con: marca
            traza: proy_planta(solucion.Q)
            rotulo: Q₁
            porque: |
              Q₁, donde f₁ corta la paralela a D₁A₁ por 5₁: f sale por la cara VDA.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(solucion.H), proy_alzado(solucion.H)), segmento2(proy_planta(solucion.N), proy_alzado(solucion.N)), segmento2(proy_planta(solucion.K), proy_alzado(solucion.K)), segmento2(proy_planta(solucion.Q), proy_alzado(solucion.Q)), segmento2(proy_planta(solucion.M), proy_alzado(solucion.M)), segmento2(proy_planta(solucion.T), proy_alzado(solucion.T))]'
            guia: figura.segmento("base2")
            porque: |
              Se suben los seis por sus líneas de referencia, cada uno hasta su arista: H y N hasta e₂, K y
              Q hasta f₂, M y T hasta g₂.
          - con: marca
            traza: proy_alzado(solucion.H)
            rotulo: H₂
            porque: |
              H₂, donde la vertical de H₁ corta e₂.
          - con: marca
            traza: proy_alzado(solucion.N)
            porque: |
              N₂, donde la vertical de N₁ corta e₂, un poco antes de 13₂. Va sin rótulo: caería sobre
              el punto 13₂.
          - con: marca
            traza: proy_alzado(solucion.K)
            rotulo: K₂
            porque: |
              K₂, donde la vertical de K₁ corta f₂.
          - con: marca
            traza: proy_alzado(solucion.Q)
            rotulo: Q₂
            porque: |
              Q₂, donde la vertical de Q₁ corta f₂.
          - con: marca
            traza: proy_alzado(solucion.M)
            rotulo: M₂
            porque: |
              M₂, donde la vertical de M₁ corta g₂.
          - con: marca
            traza: proy_alzado(solucion.T)
            porque: |
              T₂, donde la vertical de T₁ corta g₂, un poco antes de 15₂. Va sin rótulo: caería sobre los
              puntos 15₂ y R₂.
          - con: arista-vista
            traza: '[segmento2(proy_planta(solucion.H), proy_planta(solucion.J)), segmento2(proy_planta(solucion.J), proy_planta(solucion.K)), segmento2(proy_planta(solucion.M), proy_planta(solucion.H)), segmento2(proy_planta(solucion.N), proy_planta(solucion.P)), segmento2(proy_planta(solucion.P), proy_planta(solucion.Q)), segmento2(proy_planta(solucion.T), proy_planta(solucion.N))]'
            porque: |
              **Lo visto y lo oculto, en la planta.** Los dos sólidos son una sola pieza. Desde arriba se
              ven las caras de e a f y de g a e del prisma y las cuatro laterales de la pirámide, y un
              lado de la intersección se ve si está en una cara vista de cada sólido: HJ, JK y MH, y NP,
              PQ y TN, en continua.
          - con: arista-oculta
            traza: '[segmento2(proy_planta(solucion.K), proy_planta(solucion.L)), segmento2(proy_planta(solucion.L), proy_planta(solucion.M)), segmento2(proy_planta(solucion.Q), proy_planta(solucion.R)), segmento2(proy_planta(solucion.R), proy_planta(solucion.T))]'
            porque: |
              KL, LM, QR y RT están en la cara de f a g, que mira hacia abajo: a trazos.
          - con: arista-vista
            traza: '[segmento2(figura.punto("E1"), proy_planta(solucion.H)), segmento2(proy_planta(solucion.N), figura.punto("E1p")), segmento2(figura.punto("F1"), proy_planta(solucion.K)), segmento2(proy_planta(solucion.Q), figura.punto("F1p")), segmento2(figura.punto("G1"), proy_planta(solucion.M)), segmento2(proy_planta(solucion.T), figura.punto("G1p"))]'
            porque: |
              Las aristas del prisma, fuera de la pirámide, en continua: e, la de arriba, y f y g, el
              contorno de la planta del prisma. Dentro de la pirámide no se dibujan.
          - con: arista-vista
            traza: '[segmento2(figura.punto("V1"), proy_planta(solucion.J)), segmento2(figura.punto("V1"), proy_planta(solucion.P))]'
            porque: |
              VB y VD, de V₁ a J₁ y a P₁, van por encima del prisma: en continua. De J a L y de P a R van
              por dentro del prisma, y no se dibujan.
          - con: arista-oculta
            traza: '[segmento2(proy_planta(solucion.L), figura.punto("B1")), segmento2(proy_planta(solucion.R), figura.punto("D1"))]'
            porque: |
              De L₁ a B₁ y de R₁ a D₁, el prisma les pasa por encima: a trazos. D₁ cae 4,3 mm dentro de la
              franja del prisma, desde g₁.
          - con: arista-oculta
            traza: '[segmento2(solucion.k_AB_f, figura.punto("B1")), segmento2(figura.punto("B1"), solucion.k_BC_g), segmento2(solucion.k_CD_g, figura.punto("D1")), segmento2(figura.punto("D1"), solucion.k_DA_f)]'
            porque: |
              La base, donde le pasa el prisma por encima: A₁B₁ y B₁C₁ desde B₁, y C₁D₁ y D₁A₁ desde D₁,
              cada una hasta donde la cruza f₁ o g₁, el contorno del prisma. A trazos.
          - con: arista-vista
            traza: '[segmento2(figura.punto("A1"), solucion.k_AB_f), segmento2(solucion.k_BC_g, figura.punto("C1")), segmento2(figura.punto("C1"), solucion.k_CD_g), segmento2(solucion.k_DA_f, figura.punto("A1"))]'
            porque: |
              Y el resto de la base, fuera de la planta del prisma, en continua. V₁A₁ y V₁C₁ se ven
              enteras, y ya están dibujadas.
          - con: arista-vista
            traza: '[segmento2(proy_alzado(solucion.J), proy_alzado(solucion.K)), segmento2(proy_alzado(solucion.K), proy_alzado(solucion.L)), segmento2(proy_alzado(solucion.P), proy_alzado(solucion.Q)), segmento2(proy_alzado(solucion.Q), proy_alzado(solucion.R))]'
            porque: |
              **En el alzado.** Desde delante se ven las caras de e a f y de f a g del prisma y las caras
              VAB y VDA de la pirámide: JK, KL, PQ y QR, en continua.
          - con: arista-oculta
            traza: '[segmento2(proy_alzado(solucion.H), proy_alzado(solucion.J)), segmento2(proy_alzado(solucion.L), proy_alzado(solucion.M)), segmento2(proy_alzado(solucion.M), proy_alzado(solucion.H)), segmento2(proy_alzado(solucion.N), proy_alzado(solucion.P)), segmento2(proy_alzado(solucion.R), proy_alzado(solucion.T)), segmento2(proy_alzado(solucion.T), proy_alzado(solucion.N))]'
            porque: |
              El resto de los dos polígonos está en las caras de atrás de la pirámide, VBC y VCD: la
              pirámide lo tapa, y va a trazos.
          - con: arista-vista
            traza: '[segmento2(figura.punto("E2"), proy_alzado(solucion.TeB)), segmento2(proy_alzado(solucion.TeD), figura.punto("E2p")), segmento2(figura.punto("F2"), proy_alzado(solucion.K)), segmento2(proy_alzado(solucion.Q), figura.punto("F2p")), segmento2(figura.punto("G2"), proy_alzado(solucion.TgB)), segmento2(proy_alzado(solucion.TgD), figura.punto("G2p"))]'
            porque: |
              Las aristas del prisma, fuera del alzado de la pirámide, en continua: e₂ y g₂ hasta sus
              cruces con V₂B₂ y desde los de V₂D₂, y f₂ hasta K₂ y desde Q₂.
          - con: arista-oculta
            traza: '[segmento2(proy_alzado(solucion.TeB), proy_alzado(solucion.H)), segmento2(proy_alzado(solucion.N), proy_alzado(solucion.TeD)), segmento2(proy_alzado(solucion.TgB), proy_alzado(solucion.M)), segmento2(proy_alzado(solucion.T), proy_alzado(solucion.TgD))]'
            porque: |
              e y g entran y salen por las caras de atrás, VBC y VCD: entre 10₂ y H₂, N₂ y 13₂, 12₂ y M₂, y
              T₂ y 15₂, van por detrás de la pirámide, a trazos.
          - con: arista-vista
            traza: '[segmento2(figura.punto("V2"), proy_alzado(solucion.J)), segmento2(proy_alzado(solucion.L), figura.punto("B2")), segmento2(figura.punto("V2"), proy_alzado(solucion.P)), segmento2(proy_alzado(solucion.R), figura.punto("D2"))]'
            porque: |
              VB y VD, el contorno del alzado de la pirámide, en continua, salvo de J₂ a L₂ y de P₂ a R₂,
              por dentro del prisma, que no se dibuja. V₂A₂ y la base se ven enteras, y V₂C₂ y E₂G₂ ya
              vienen a trazos.
        pista: |
          (1) En el alzado, V₂B₂ cruza e₂, f₂ y g₂. (2) Baja cada cruce a la planta de su arista: e₁,
          f₁ y g₁. (3) Une los tres: es el triángulo que el plano de canto de VB corta en el prisma.
          (4) V₁B₁ corta su lado de e a f en J₁ y el de f a g en L₁; súbelos a V₂B₂. (5) Con V₂D₂,
          lo mismo, para P y R. (6) Rehaz H, N, K, Q, M y T: baja a V₁C₁ los cruces de e₂ y g₂ con
          V₂C₂, y a V₁A₁ el de f₂ con V₂A₂; por cada uno, las paralelas a los lados de la base
          cortan e₁, g₁ o f₁ en los dos puntos. (7) Una sola pieza: un lado de la intersección se ve
          si está en una cara vista de los dos sólidos. Desde arriba se ven las caras de e a f y de
          g a e; desde delante, las de e a f y de f a g, y VAB y VDA.
        desarrollo: |
          En verde claro, en la planta, los dos triángulos de los planos de canto: el de VB, a la
          izquierda, y el de VD, a la derecha. V₁B₁ y V₁D₁ cortan cada uno en dos lados, el de e a
          f y el de f a g. Entre J y L, y entre P y R, las aristas van por dentro del prisma.

          Y los dos polígonos, con lo que se ve de los dos sólidos, una sola pieza. En la planta van
          ocultos KL, LM, QR y RT, en la cara de f a g, que mira hacia abajo; los tramos de la base
          que el prisma tapa por encima, junto a B₁ y a D₁, hasta f₁ o g₁; y VB de L₁ a B₁ y VD de
          R₁ a D₁. En el alzado se ven JK, KL, PQ y QR, en las caras de delante, y el resto de los
          polígonos va oculto; e₂ y g₂ van a trazos entre el contorno de la pirámide y sus cortes,
          porque pasan por detrás, y f₂ se ve entera fuera de la pirámide.

          V₂C₂ y E₂G₂ ya venían a trazos en la lámina: VC es la arista de atrás de la pirámide,
          y el extremo izquierdo del prisma mira hacia atrás, porque las aristas se acercan a ti
          al ir hacia la derecha; el extremo derecho mira hacia delante, y va entero en
          continua.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: Las aristas del prisma son horizontales, y el plano horizontal de cada una corta la pirámide en un cuadrado con el centro en V₁, que la planta da sin deformar.
          - texto: La planta de cada arista corta su cuadrado en dos puntos, la entrada y la salida, que se suben al alzado a la altura de la arista.
          - texto: VB y VD atraviesan el prisma; el plano de canto de cada una lo corta en un triángulo, y la arista corta dos de sus lados en la planta.
          - texto: Se unen los puntos que están a la vez en una misma cara de la pirámide y en una misma cara del prisma, y salen dos polígonos de cinco vértices.
          - texto: Un lado de la intersección va en continua si está en una cara vista de la pirámide y en una cara vista del prisma.
          - texto: Las tres aristas del prisma entran y salen, así que la intersección es un solo polígono con los seis puntos de las aristas.
            trampa: true
            mensaje: |
              Un solo polígono sale cuando el prisma muerde la pirámide sin atravesarla. Aquí la
              atraviesa entera: hay un polígono por donde entra y otro por donde sale, y cada uno
              lleva además los dos cortes de VB o de VD.
    resolucion: |
      **Qué es la figura.** Una pirámide regular de base cuadrada horizontal y un prisma de base
      triangular con las tres aristas horizontales, que la atraviesa de lado a lado: sus dos
      extremos quedan fuera de la pirámide, uno a cada lado. Es una penetración, y la
      intersección son dos polígonos cerrados, uno por donde entra el prisma y otro por donde
      sale.

      **Las aristas del prisma.** Cada una es horizontal, y su plano horizontal corta la pirámide
      en un cuadrado con el centro en V₁: sus vértices están en las aristas laterales, a la
      altura de la arista, y en la planta se ve sin deformar. El de e mide 23,7 mm de lado; el de
      f, 31,5 mm, y el de g, 36,0 mm. La planta de cada arista corta su cuadrado en dos puntos: e
      entra por la cara VBC en H y sale por la VCD en N; f entra por la VAB en K y sale por la VDA
      en Q; g entra por la VBC en M y sale por la VCD en T. Los seis se suben al alzado, cada uno
      a la altura de su arista.

      **Las aristas de la pirámide.** VA y VC no tocan el prisma; VB y VD lo atraviesan, entrando
      por la cara de e a f y saliendo por la de f a g. El plano de canto de VB, que en el alzado
      es V₂B₂, corta e₂, f₂ y g₂; bajados a la planta, esos tres puntos forman un triángulo, y
      V₁B₁ corta sus lados en J₁ y L₁. Con VD salen P₁ y R₁. Se suben a V₂B₂ y a V₂D₂.

      **Los polígonos.** Se unen los puntos que comparten una cara de cada sólido: H J K L M por la
      entrada (HJ y JK en la cara de e a f; KL y LM en la de f a g; MH en la de g a e) y N P Q R T
      por la salida, igual.

      **Lo que se ve.** Tomamos los dos sólidos como una sola pieza maciza, que el enunciado no lo
      dice: lo que de una arista queda dentro del otro no se dibuja. Desde arriba se ven las caras
      de e a f y de g a e del prisma, y todas las laterales de la pirámide: en la planta van en
      discontinua KL, LM, QR y RT, y los tramos de la base y de VB y VD que el prisma tapa por
      encima. Desde delante se ven las caras de e a f y de f a g del prisma y las caras VAB y VDA
      de la pirámide: en el alzado van en continua JK, KL, PQ y QR, y en discontinua el resto de
      los dos polígonos, los tramos de e y g que van por detrás de la pirámide y E₂G₂.

  # ── 1 b · El ángulo de AB y AV, por abatimiento. Lo que enseña: que la
  #    planta no da el ángulo aunque AB sea horizontal, y que la distancia de V a
  #    la charnela es una hipotenusa.
  - id: exeg-h54-1b-el-angulo-de-ab-y-av-por-abatimiento
    titulo: El ángulo entre AB y AV, abatiendo la cara de la pirámide
    fuente: >-
      Ejercicio 54, apartado 1 b · Colección de ejercicios de Geometría
      Descriptiva, Sistema Diédrico Directo (EJERCICIO 54, págs. 61-63; el
      apartado 1, en las 61 y 62) · Dpto. de Expresión Gráfica y Proyectos de
      Ingeniería, EIG · UPV/EHU. Sin fecha: es uno de los cuatro ejercicios
      bilingües, del 52 al 55, con que cierra la colección, y el único que se
      titula «Examen» («Azterketa / Examen» en su enunciado, y cajetín de examen
      en sus láminas). Se transcribe el castellano; la figura se redibuja desde
      sus coordenadas.
    nivel: examen
    # Decisión: el castellano de la pág. 61 tal cual, con la cabecera del
    # apartado 1, la negrita y las mayúsculas de «ABATIMIENTO» como en la página.
    enunciado: |
      Dados los dos prismas, calcular gráficamente:

      b. Ángulo entre las rectas AB y AV (por **ABATIMIENTO**).

      **Notas nuestras.** La figura es la misma del apartado 1 a: una pirámide regular de base
      cuadrada y un prisma triangular que la atraviesa, aunque el enunciado diga «los dos
      prismas» (y el euskera, «Bi prisma»). Este apartado solo usa la pirámide. La base ABCD
      es un cuadrado horizontal de 50 mm de lado, y V está 100 mm por encima de su centro,
      medidos en la lámina (5 m y 10 m a la escala del cajetín): AB es un lado de la base y
      AV una arista lateral. Un ángulo no cambia con la escala.
    pide: El vértice V abatido con AB de charnela y el ángulo entre AB y AV, en grados.
    receta:
      lamina: ex54-1
      escena:
        V: 'punto3(alzado: figura.punto("V2"), planta: figura.punto("V1"))'
        A: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("A1"))'
        B: 'punto3(alzado: figura.punto("B2"), planta: figura.punto("B1"))'
        cara: plano(V, A, B)
        # El centro de la base, debajo de V.
        O: 'punto3(alzado: pie_perpendicular(figura.punto("V2"), figura.segmento("base2")), planta: figura.punto("V1"))'
      solucion:
        charnela: recta3(A, B)
        pie: pie_perpendicular(V, charnela)
        # Decisión: (V) hacia el lado de V₁, el primero de los dos que da
        # abatido() (lo comprueba tests/geometria/hoja-54.test.ts). Hacia fuera
        # también valdría, y el ángulo sería el mismo, pero cae en x = 163, y = 716
        # y no cabe en la lámina; abrirla hasta allí la haría un 50 % más ancha.
        # El intro fija el lado.
        V_ab: uno(abatido(V, charnela, cara), 1)
        angulo: angulo_rectas(charnela, segmento3(A, V))
        # Los errores. (V) a la diferencia de cotas de V y AB, el cateto que se lee
        # en el alzado, en vez de la hipotenusa; y (V) con A(V) igual a lo que mide
        # A₂V₂ en el alzado, como si AV fuera frontal.
        perpendicular_por_pie: horizontal_por(pie, plano_perpendicular_a_recta(pie, charnela))
        Vdz: 'punto_a_distancia(perpendicular_por_pie, desde: pie, distancia: diferencia_de_cotas(V, pie))'
        Valz: 'punto_a_distancia(perpendicular_por_pie, desde: pie, distancia: raiz(vm_alzado(A, V) * vm_alzado(A, V) - vm(A, pie) * vm(A, pie)))'
        # Los ángulos que no son: el de las plantas (A₁V₁ va por la diagonal del
        # cuadrado, hacia O) y el de los alzados, que se lee con B y V llevados
        # al alejamiento de A, donde los dos lados son frontales.
        horizontal_A1: 'perpendicular(por: figura.punto("A1"), a: segmento2(figura.punto("V2"), figura.punto("V1")))'
        B_frontal: 'punto3(alzado: figura.punto("B2"), planta: pie_perpendicular(figura.punto("B1"), horizontal_A1))'
        V_frontal: 'punto3(alzado: figura.punto("V2"), planta: pie_perpendicular(figura.punto("V1"), horizontal_A1))'
        # Para la construcción paso a paso: T, en la línea de la base del alzado, a
        # lo que separa V₁ de A₁B₁ en la planta desde O₂. Con V₂ y O₂ forma el
        # triángulo rectángulo cuya hipotenusa, V₂T, es la distancia real de V a AB.
        # Decisión: el triángulo se dibuja en el alzado, sobre el eje V₂O₂ de la
        # pirámide, que ya es el cateto de 100 mm. En la planta, esos 100 mm
        # llevados desde V₁ por la paralela a A₁B₁ se salen de la lámina hacia
        # abajo, o se meten en el alzado hacia arriba. T va a la derecha de O₂, del
        # lado de (V); a la izquierda valdría igual.
        T_hip: 'uno(medir_sobre(figura.segmento("base2"), desde: proy_alzado(O), distancia: vm_planta(V, pie)), 1)'
        # Los extremos de la perpendicular a A₁B₁ por V₁ en la construcción paso a
        # paso: en el papel se traza más allá de (V) y de A₁B₁, y no para en ellos.
        L_Vab: 'uno(medir_sobre(segmento2(proy_planta(pie), figura.punto("V1")), desde: proy_planta(pie), distancia: vm(V, pie) + mm(6)), 1)'
        L_pie: 'uno(medir_sobre(segmento2(proy_planta(pie), figura.punto("V1")), desde: proy_planta(pie), distancia: mm(4)), 2)'
    pasos:
      - tipo: reconocer
        pregunta: AB es un lado de la base, y AV una arista lateral. ¿Qué se abate, y alrededor de qué, para ver el ángulo de AB y AV?
        opciones:
          - texto: La cara VAB, alrededor de AB, que es horizontal; A y B no se mueven, y el ángulo en A sale sin deformar en la planta
            correcta: true
            mensaje: |
              Eso es. Un ángulo se ve en verdadera magnitud cuando su plano está paralelo al de
              proyección. Abatir la cara VAB alrededor de una horizontal suya la deja sobre un
              plano horizontal, y AB es la más cómoda: está en la base, y A y B se quedan donde
              están. Solo hay que llevar V.
          - texto: Nada, porque AB es horizontal y el ángulo se mide en la planta, entre A₁B₁ y A₁V₁, ya que un lado horizontal basta para ver el ángulo sin deformar
            mensaje: |
              AB es horizontal, pero AV no: sube 100 mm desde A hasta V. La planta acorta AV y
              cambia el ángulo: entre A₁B₁ y A₁V₁ salen 45,0°, porque A₁V₁ va por la diagonal del
              cuadrado. El plano de las dos rectas está inclinado, y hay que abatirlo.
          - texto: La cara VAB, alrededor de la arista AV, para que V, el punto que más cuesta llevar, se quede quieto y baste con llevar B
            mensaje: |
              AV no es horizontal ni frontal, y una cara abatida alrededor de ella no cae sobre
              ningún plano de proyección: no se vería sin deformar en ninguna vista. La charnela
              tiene que ser una horizontal (o una frontal) del plano.

      - tipo: construir
        titulo: La cara VAB, abatida sobre la base
        intro: |
          Abate la cara VAB alrededor de AB: A y B no se mueven, y V cae sobre el plano de la
          base. Lleva V por la perpendicular a A₁B₁ que pasa por V₁, a su distancia real de AB, y
          hacia el lado de V₁: hacia el otro también valdría, y el ángulo sería el mismo, pero no
          cabe en la lámina. Marca (V).
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, transportador, borrar]
        tolerancia: 1
        objetivos:
          - nombre: Vab
            rotulo: (V)
            pide: el vértice V, abatido con AB de charnela
            es: proy_planta(solucion.V_ab)
            bien: |
              (V) está en la perpendicular a A₁B₁ por V₁, a la distancia real de V a AB: la
              hipotenusa del triángulo que tiene por catetos lo que separa V₁ de A₁B₁ en la planta
              y la diferencia de cotas de V y AB, que se mide en el alzado. A₁(V) mide lo mismo que
              AV.
            diagnosticos:
              - si: 'a_distancia(de: proy_planta(solucion.pie), d: vm_planta(V, solucion.pie))'
                mensaje: |
                  Has llevado desde el pie lo que separa V₁ de A₁B₁ **en la planta**, y la planta
                  acorta: V está 100 mm más alto que AB. Si has caído en V₁, esa es la planta de V, no
                  su abatido. La distancia real es la hipotenusa del triángulo con ese cateto y la
                  diferencia de cotas.
                ejemplo: figura.punto("V1")
              - si: '!en_recta(perpendicular(por: figura.punto("V1"), a: figura.segmento("AB1")))'
                mensaje: |
                  Al abatir, V gira alrededor de AB en un plano perpendicular a AB, y ese plano es
                  vertical: en la planta, (V) se mueve por la **perpendicular a A₁B₁ que pasa por
                  V₁**.
                ejemplo: 'desplaza(proy_planta(solucion.V_ab), dx: mm(6), dy: mm(6))'
              - si: 'a_distancia(de: proy_planta(solucion.pie), d: diferencia_de_cotas(V, solucion.pie))'
                mensaje: |
                  Has llevado la **diferencia de cotas** de V y AB, que se lee en el alzado: es solo
                  un cateto. Falta el otro, lo que separa V₁ de A₁B₁ en la planta; la distancia real
                  es la hipotenusa.
                ejemplo: proy_planta(rama(solucion.Vdz, 2))
              - si: 'a_distancia(de: figura.punto("A1"), d: vm_alzado(A, V))'
                mensaje: |
                  A₁ y tu (V) están a lo que mide **A₂V₂ en el alzado**, y el alzado también acorta:
                  AV no es frontal. Si construyes el triángulo por sus lados, A(V) tiene que medir AV
                  de verdad, y eso pide abatir o un triángulo aparte.
                ejemplo: proy_planta(rama(solucion.Valz, 2))
              - si: siempre
                mensaje: |
                  (V) está en la perpendicular a A₁B₁ por V₁, a la distancia real de V a AB: con lo
                  que separa V₁ de A₁B₁ en la planta y la diferencia de cotas de V y AB, la
                  hipotenusa.
        trazado:
          - 'segmento2(figura.punto("A1"), proy_planta(solucion.V_ab))'
          - 'segmento2(figura.punto("B1"), proy_planta(solucion.V_ab))'
          - 'segmento2(figura.punto("V1"), proy_planta(solucion.V_ab))'
        bloques:
          - nombre: Abatimiento de VAB por la charnela AB
            explica: |
              El enunciado pide el ángulo por
              [abatimiento](/road-to-ingenieria/expresion-grafica/t03-metodos-descriptivos/#el-abatimiento-tumbar-el-plano):
              se tumba la cara VAB, que contiene las dos rectas, sobre el plano de la base,
              alrededor de AB, que es horizontal y está en ese plano. AB es la charnela: A y B no se
              mueven, y V gira en un plano perpendicular a AB, que es vertical, así que en la planta
              va por la perpendicular a A₁B₁ que pasa por V₁, con centro en M₁. El radio es la
              distancia real de V a AB, que no da ninguna vista: la hipotenusa del triángulo de
              catetos V₁M₁, en la planta, y lo que V está más alto que AB, en el alzado. Aquí ese
              triángulo se arma en el alzado, sobre el eje V₂O₂, que ya es el segundo cateto.
              A₁B₁(V) es la cara en verdadera magnitud, y el ángulo en A₁ es el de AB y AV.
        construccion:
          - con: escuadra-cartabon
            traza: '[segmento2(figura.punto("V1"), solucion.L_Vab), segmento2(figura.punto("V1"), solucion.L_pie)]'
            guia: figura.segmento("AB1")
            bloque: Abatimiento de VAB por la charnela AB
            porque: |
              La cara VAB se abate alrededor de AB, que es horizontal: A y B no se mueven, y V gira en
              un plano perpendicular a AB, que es vertical. En la planta, (V) se mueve por la
              **perpendicular a A₁B₁ que pasa por V₁**. Se traza con la escuadra apoyada en el
              cartabón, larga hacia los dos lados: hasta pasar A₁B₁, donde está el centro del giro, y
              mucho más allá de V₁, que es hacia donde se abate.
          - con: marca
            traza: proy_planta(solucion.pie)
            rotulo: M₁
            bloque: Abatimiento de VAB por la charnela AB
            porque: |
              M₁, donde la perpendicular corta A₁B₁: el pie de V en la charnela, el centro del giro.
              Cae en el punto medio de A₁B₁, porque la pirámide es regular. Es un nombre nuestro.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("V2"), proy_alzado(O))
            guia: figura.segmento("base2")
            bloque: Abatimiento de VAB por la charnela AB
            porque: |
              El radio del giro es la **distancia real de V a AB**, y la planta no la da: V está mucho
              más alto que AB. Lo que sube se lee en el alzado: por V₂, la perpendicular a la línea de
              la base, hasta cortarla. Es el eje de la pirámide.
          - con: marca
            traza: proy_alzado(O)
            rotulo: O₂
            bloque: Abatimiento de VAB por la charnela AB
            porque: |
              O₂, donde el eje corta la línea de la base: el centro de la base, visto de frente. V₂O₂
              mide lo que V está más alto que AB, 100 mm, porque AB está en la base. Es un nombre
              nuestro.
          - con: compas
            traza: 'arco(proy_alzado(O), por: solucion.T_hip, desde: desplaza(solucion.T_hip, dy: -12), hasta: desplaza(solucion.T_hip, dy: 12))'
            toma: segmento2(figura.punto("V1"), proy_planta(solucion.pie))
            bloque: Abatimiento de VAB por la charnela AB
            porque: |
              Con el compás se toma en la planta lo que separa V₁ de A₁B₁, de V₁ a M₁, y se lleva
              desde O₂ sobre la línea de la base: es el otro cateto. La circunferencia corta esa línea
              a los dos lados de O₂, y cualquiera vale; se toma el de la derecha, del lado de (V).
          - con: marca
            traza: solucion.T_hip
            rotulo: T
            bloque: Abatimiento de VAB por la charnela AB
            porque: |
              T, donde el arco corta la línea de la base. El triángulo V₂ O₂ T es rectángulo en O₂: un
              cateto es lo que V está más alto que AB y el otro, lo que V₁ se aparta de A₁B₁ en la
              planta. Es un nombre nuestro.
          - con: regla
            traza: segmento2(figura.punto("V2"), solucion.T_hip)
            bloque: Abatimiento de VAB por la charnela AB
            porque: |
              La hipotenusa V₂T es la **distancia real de V a la charnela**, 103,1 mm: el radio con que
              V se abate. No es una arista, aunque vaya por dentro del alzado de la pirámide. La planta
              sola daría el cateto V₁M₁, 25,0 mm.
          - con: compas
            traza: 'arco(proy_planta(solucion.pie), por: proy_planta(solucion.V_ab), desde: desplaza(proy_planta(solucion.V_ab), dx: -6, dy: -10.4), hasta: desplaza(proy_planta(solucion.V_ab), dx: 6, dy: 10.4))'
            toma: segmento2(figura.punto("V2"), solucion.T_hip)
            bloque: Abatimiento de VAB por la charnela AB
            porque: |
              Con el compás abierto a V₂T y el centro en M₁, que está en la charnela, el arco hasta la
              perpendicular. La circunferencia la corta dos veces, una a cada lado de A₁B₁, y las dos
              darían el mismo ángulo. Se toma la del lado de V₁, como pide el paso: la otra cae fuera
              de la lámina.
          - con: marca
            traza: proy_planta(solucion.V_ab)
            rotulo: (V)
            bloque: Abatimiento de VAB por la charnela AB
            porque: |
              (V), donde el arco corta la perpendicular a A₁B₁: V abatido, a 103,1 mm de la charnela.
              A₁ B₁ (V) es la cara VAB en verdadera magnitud, y el ángulo en A₁, entre A₁B₁ y A₁(V), es
              el que forman AB y AV.
        pista: |
          (1) Por V₁, la perpendicular a A₁B₁; su pie es el punto medio de A₁B₁, porque la pirámide
          es regular. (2) La distancia real de V a AB: un triángulo rectángulo con lo que separa V₁
          de A₁B₁ en la planta y la diferencia de cotas de V₂ y A₂B₂ en el alzado. (3) Llévala con
          el compás desde el pie, por esa perpendicular, hacia V₁.
        desarrollo: |
          En verde claro, la cara abatida, A₁ B₁ (V): un triángulo isósceles. V₁ queda a 25,0 mm de
          A₁B₁ y V está 100,0 mm más alto, así que (V) cae a 103,1 mm de A₁B₁, y A₁(V) mide
          106,1 mm, lo que mide AV.

      # Decisión: la tolerancia es la de un ángulo, 0,5°, y no se estrecha por un
      # distractor (§17). El error del cateto, (V) a la diferencia de cotas en vez de
      # la hipotenusa, da 75,99°, a 0,40° del bueno: aquí se da por bueno, y solo lo
      # atrapa el `construir`, donde ese (V) queda a 3,08 mm del bueno. El de A(V)
      # igual a A₂V₂ da 75,61°, a 0,78°, y sí va de distractor.
      - tipo: calcular
        titulo: El ángulo entre AB y AV
        pregunta: ¿Cuánto mide el ángulo entre las rectas AB y AV?
        respuesta:
          tipo: numero
          valor: '76.39'
          receta: angulo
          tolerancia: 0.5
          formato: un número, en grados
        distractores:
          - valor: '45.04'
            receta: angulo_rectas(charnela, segmento3(A, O))
            mensaje: |
              Ese es el ángulo **en la planta**, entre A₁B₁ y A₁V₁. A₁V₁ va por la diagonal del
              cuadrado, y por eso sale casi 45°. AV sube hasta V, y la planta deforma el ángulo: el
              de verdad está en la cara abatida, entre A₁B₁ y A₁(V).
          - valor: '95.22'
            receta: 180 - angulo_rectas(segmento3(A, solucion.B_frontal), segmento3(A, solucion.V_frontal))
            mensaje: |
              Ese es el ángulo **en el alzado**, entre A₂B₂ y A₂V₂. Ni AB ni AV son frontales, y
              el alzado también deforma: el ángulo de verdad se mide en la cara abatida.
          - valor: '84.78'
            receta: angulo_rectas(segmento3(A, solucion.B_frontal), segmento3(A, solucion.V_frontal))
            mensaje: |
              Ese es el ángulo agudo que forman **A₂B₂ y A₂V₂ en el alzado**, el suplementario
              del de 95,2°. Ni AB ni AV son frontales, y el alzado deforma: el ángulo de verdad
              está en la cara abatida, entre A₁B₁ y A₁(V).
          - valor: '27.25'
            receta: angulo_rectas(segmento3(V, A), segmento3(V, B))
            mensaje: |
              Ese es el ángulo de la cara en **V**, entre VA y VB. El que se pide es el de AB con
              AV, que está en **A**: entre A₁B₁ y A₁(V).
          - valor: '103.61'
            receta: 180 - angulo
            mensaje: |
              Has medido el ángulo del otro lado de A, entre A₁(V) y la prolongación de A₁B₁. Dos
              rectas que se cortan forman dos ángulos suplementarios, y el ángulo entre ellas es el
              menor: 180° − 103,6° = 76,4°.
          - valor: '75.61'
            receta: angulo_rectas(charnela, segmento3(A, rama(solucion.Valz, 2)))
            mensaje: |
              Has construido la cara con A(V) igual a lo que mide **A₂V₂ en el alzado**,
              100,45 mm, como si AV fuera frontal. No lo es, y el alzado la acorta: A(V) tiene
              que medir AV de verdad, 106,09 mm, y entonces el ángulo en A sale mayor.
        pista: |
          Mídelo en la cara abatida, en A₁, entre A₁B₁ y A₁(V): A no se ha movido al abatir.
        desarrollo: |
          En la cara abatida, el pie de V₁ en A₁B₁ está a 24,96 mm de A₁, y (V) a 103,11 mm de A₁B₁:
          $$ \tan\alpha = \frac{103{,}11}{24{,}96} \;\Longrightarrow\; \alpha \approx 76{,}39^{\circ} $$

          En el alzado, el triángulo V₂O₂T tiene en T un ángulo de 75,97°, a 0,42° de la respuesta por
          casualidad: es el que forma el radio V₂T con la línea de la base, no el que forman AB y AV, y
          medirlo ahí no se distingue de medirlo bien. El ángulo de AB y AV está en A₁, entre A₁B₁ y
          A₁(V), en la cara abatida.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: AB está en la base, que es horizontal; sirve de charnela, y A y B no se mueven al abatir la cara VAB.
          - texto: V gira alrededor de AB en un plano perpendicular a AB, que es vertical; en la planta, (V) va por la perpendicular a A₁B₁ que pasa por V₁.
          - texto: La distancia de V a AB es la hipotenusa de un triángulo con lo que separa V₁ de A₁B₁ en la planta y la diferencia de cotas de V y AB.
          - texto: Abatida, la cara está en verdadera magnitud, y el ángulo en A₁ entre A₁B₁ y A₁(V) es el que forman AB y AV.
          - texto: El ángulo se mide en la planta, entre A₁B₁ y A₁V₁, porque AB es horizontal.
            trampa: true
            mensaje: |
              AB es horizontal, pero AV no: sube 100 mm. En la planta el ángulo sale de 45,0°, y el
              de verdad mide 76,4°.
    resolucion: |
      **Qué plano.** AB y AV se cortan en A y definen la cara VAB, que está inclinada: ninguna
      vista da su ángulo. AB es un lado de la base, horizontal, y sirve de charnela para abatir la
      cara sobre el plano de la base.

      **El abatimiento.** A y B no se mueven. V gira alrededor de AB en un plano perpendicular a AB,
      que es vertical, así que (V) va por la perpendicular a A₁B₁ que pasa por V₁. Su pie es el
      punto medio de A₁B₁, porque la pirámide es regular. La distancia de V a AB es la hipotenusa
      de un triángulo con 25,0 mm de planta (de V₁ a A₁B₁) y 100,0 mm de diferencia de cotas:
      103,1 mm. (V) queda a esa distancia del pie, hacia V₁, y A₁(V) mide 106,1 mm, lo mismo que AV.
      Hacia el otro lado de A₁B₁ también valdría, y el ángulo sería el mismo; aquí se lleva hacia
      V₁ porque es donde cabe en la lámina.

      **El ángulo.** En la cara abatida, el ángulo en A₁ entre A₁B₁ y A₁(V) mide 76,4°. La planta
      daría 45,0° y el alzado 95,2°: los dos deforman, porque AV no es ni horizontal ni frontal.

  # ── 2 a · La planta del trapecio. Lo que enseña: un plano dado por su línea de
  #    máxima pendiente trae sus horizontales dibujadas sin dibujarlas: van
  #    perpendiculares a r₁ en la planta. AB y DC lo son, porque A₂B₂ y D₂C₂ son
  #    horizontales en el alzado.
  - id: exeg-h54-2a-la-planta-del-trapecio-en-el-plano-de-r
    titulo: La planta de un trapecio en el plano de su línea de máxima pendiente
    fuente: >-
      Ejercicio 54, apartado 2 a · Colección de ejercicios de Geometría
      Descriptiva, Sistema Diédrico Directo (EJERCICIO 54, págs. 61-63; el
      apartado 2, en las 61 y 63) · Dpto. de Expresión Gráfica y Proyectos de
      Ingeniería, EIG · UPV/EHU. Sin fecha: es uno de los cuatro ejercicios
      bilingües, del 52 al 55, con que cierra la colección, y el único que se
      titula «Examen» («Azterketa / Examen» en su enunciado, y cajetín de examen
      en sus láminas). Se transcribe el castellano; la figura se redibuja desde
      sus coordenadas.
    nivel: examen
    # Decisión: el castellano de la pág. 61 tal cual, con la cabecera del
    # apartado 2 en las dos piezas y sin su «2.» (lo dice la fuente). «está el en
    # plano» es errata de la página, y se conserva (§08); lo dicen las notas.
    enunciado: |
      El trapecio ABCD está el en plano definido por la línea de máxima pendiente r.

      a. Completar su proyección en el plano horizontal.

      **Notas nuestras.** «Está el en plano» es errata de la página por «está en el plano», y
      se deja como está impresa. La figura es la mitad izquierda de la segunda lámina del
      Ejercicio 54: la recta r en sus dos proyecciones, r₂ arriba y r₁ abajo, y el trapecio
      ABCD solo en el alzado. Lo que falta es su planta. El cajetín de la lámina dice escala
      1:100, y aquí no cambia nada: se piden puntos.
    pide: La planta de los cuatro vértices del trapecio, A₁, B₁, C₁ y D₁.
    receta:
      lamina: ex54-2
      escena:
        r: 'recta3(alzado: figura.segmento("r2"), planta: figura.segmento("r1"))'
        plano_t: plano_por_lmp(r)
      solucion:
        A: 'punto_en_plano(alzado: figura.punto("A2"), plano: plano_t)'
        B: 'punto_en_plano(alzado: figura.punto("B2"), plano: plano_t)'
        C: 'punto_en_plano(alzado: figura.punto("C2"), plano: plano_t)'
        D: 'punto_en_plano(alzado: figura.punto("D2"), plano: plano_t)'
        # La construcción: los planos horizontales de AB y de DC cortan a r en el
        # punto de r a esa cota, y por él va la horizontal del plano.
        horizontal_AB: horizontal_por(A, plano_t)
        horizontal_DC: horizontal_por(D, plano_t)
        cota_AB: 'plano(A, B, punto3(alzado: figura.punto("A2"), planta: desplaza(proy_planta(A), dy: 10)))'
        cota_DC: 'plano(D, C, punto3(alzado: figura.punto("D2"), planta: desplaza(proy_planta(D), dy: 10)))'
        R_AB: corte_recta_plano(r, cota_AB)
        R_DC: corte_recta_plano(r, cota_DC)
        # El error de dibujar la horizontal del plano horizontal en el papel: la
        # recta horizontal del papel por el punto de r₁ a esa cota.
        vertical_papel: 'segmento2(figura.punto("A2"), desplaza(figura.punto("A2"), dy: 10))'
        papel_AB: 'perpendicular(por: proy_planta(R_AB), a: vertical_papel)'
        papel_DC: 'perpendicular(por: proy_planta(R_DC), a: vertical_papel)'
        # Los extremos de las plantas de las dos horizontales en la construcción
        # paso a paso: en el papel se trazan más allá de B₁ y de C₁, y no paran en
        # ellos.
        L_hAB: 'uno(medir_sobre(segmento2(proy_planta(R_AB), proy_planta(B)), desde: proy_planta(B), distancia: mm(4)), 1)'
        L_hDC: 'uno(medir_sobre(segmento2(proy_planta(R_DC), proy_planta(C)), desde: proy_planta(C), distancia: mm(4)), 1)'
      comprueba:
        - en_recta(B, horizontal_por(A, plano_t))
        - en_recta(C, horizontal_por(D, plano_t))
    pasos:
      - tipo: reconocer
        pregunta: r es la línea de máxima pendiente del plano. ¿Cómo van, en la planta, las horizontales de ese plano?
        opciones:
          - texto: Perpendiculares a r₁, porque la línea de máxima pendiente es perpendicular a las horizontales y el ángulo recto se ve en la planta
            correcta: true
            mensaje: |
              Eso es. La línea de máxima pendiente es perpendicular a las horizontales del plano,
              y un ángulo recto con un lado horizontal se ve recto en la planta. Así que cada
              horizontal sale del punto de r a su cota, perpendicular a r₁.
          - texto: Horizontales en el papel, perpendiculares a las líneas de referencia, porque son horizontales
            mensaje: |
              «Horizontal» es de cota constante, y eso se ve en el **alzado**: ahí sí van
              horizontales en el papel. En la planta una horizontal puede ir en cualquier
              dirección; la del plano va perpendicular a r₁.
          - texto: Paralelas a r₁, porque están en el mismo plano que r y todas las rectas de un plano se proyectan paralelas entre sí en la planta
            mensaje: |
              Dos rectas de un mismo plano no tienen por qué ser paralelas. r sube con la mayor
              pendiente del plano, y las horizontales no suben nada: son las perpendiculares a r,
              y en la planta, a r₁.

      - tipo: construir
        titulo: Los cuatro vértices en la planta
        intro: |
          Marca A₁, B₁, C₁ y D₁. A₂B₂ y D₂C₂ son horizontales en el alzado: AB y DC son dos
          horizontales del plano. La de AB corta a r₂ a la altura de A₂; baja ese punto a r₁ y
          traza por él la perpendicular a r₁. A₁ y B₁ están en ella, en la vertical de A₂ y de B₂.
          Con DC, igual.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, radio, medir, borrar]
        tolerancia: 1
        objetivos:
          - nombre: A1
            pide: el vértice A, en la planta
            es: proy_planta(solucion.A)
            bien: |
              A₁ está en la vertical de A₂, sobre la horizontal del plano que pasa por A: la
              perpendicular a r₁ por el punto de r₁ que está a la cota de A₂.
            diagnosticos:
              - si: 'en_recta(solucion.papel_AB) && en_vertical_de(figura.punto("A2"))'
                mensaje: |
                  Has trazado la horizontal del plano por A como una horizontal del papel. En la
                  planta, las horizontales de este plano van **perpendiculares a r₁**, porque r es
                  su línea de máxima pendiente.
                ejemplo: 'pie_perpendicular(figura.punto("A2"), solucion.papel_AB)'
              - si: '!en_vertical_de(figura.punto("A2"))'
                mensaje: |
                  A₁ va en la **vertical de A₂**: es el mismo punto visto desde arriba.
                ejemplo: 'desplaza(proy_planta(solucion.A), dx: mm(6))'
              - si: en_recta(proy_planta(solucion.horizontal_DC))
                mensaje: |
                  Esa es la horizontal de D y C, la de abajo en el alzado. A está en la de A y B:
                  la que corta a r₂ a la altura de A₂.
                ejemplo: 'proy_planta(punto_en_plano(alzado: pie_perpendicular(figura.punto("A2"), figura.segmento("DC2")), plano: plano_t))'
              - si: siempre
                mensaje: |
                  A₁ está en la vertical de A₂, sobre la perpendicular a r₁ que pasa por el punto de
                  r₁ a la cota de A. Ese punto se busca en el alzado, donde r₂ corta la horizontal
                  de A₂B₂.
          - nombre: B1
            pide: el vértice B, en la planta
            es: proy_planta(solucion.B)
            bien: |
              B₁ está en la misma horizontal que A₁, perpendicular a r₁, en la vertical de B₂.
            diagnosticos:
              - si: 'en_recta(solucion.papel_AB) && en_vertical_de(figura.punto("B2"))'
                mensaje: |
                  Has trazado la horizontal del plano por B como una horizontal del papel. En la
                  planta va **perpendicular a r₁**: B₁ está en la misma que A₁.
                ejemplo: 'pie_perpendicular(figura.punto("B2"), solucion.papel_AB)'
              - si: '!en_vertical_de(figura.punto("B2"))'
                mensaje: |
                  B₁ va en la **vertical de B₂**.
                ejemplo: 'desplaza(proy_planta(solucion.B), dx: mm(6))'
              - si: en_recta(proy_planta(solucion.horizontal_DC))
                mensaje: |
                  Esa es la horizontal de D y C. B está en la de A y B, la misma que A₁.
                ejemplo: 'proy_planta(punto_en_plano(alzado: pie_perpendicular(figura.punto("B2"), figura.segmento("DC2")), plano: plano_t))'
              - si: siempre
                mensaje: |
                  B₁ está en la vertical de B₂, sobre la horizontal de A₁: la perpendicular a r₁ a
                  la cota de AB.
          - nombre: C1
            pide: el vértice C, en la planta
            es: proy_planta(solucion.C)
            bien: |
              C₁ está en la vertical de C₂, sobre la horizontal del plano por D y C: la
              perpendicular a r₁ por el punto de r₁ que está a la cota de D₂C₂.
            diagnosticos:
              - si: 'en_recta(solucion.papel_DC) && en_vertical_de(figura.punto("C2"))'
                mensaje: |
                  Has trazado la horizontal del plano por C como una horizontal del papel. En la
                  planta va **perpendicular a r₁**.
                ejemplo: 'pie_perpendicular(figura.punto("C2"), solucion.papel_DC)'
              - si: '!en_vertical_de(figura.punto("C2"))'
                mensaje: |
                  C₁ va en la **vertical de C₂**.
                ejemplo: 'desplaza(proy_planta(solucion.C), dx: mm(6))'
              - si: en_recta(proy_planta(solucion.horizontal_AB))
                mensaje: |
                  Esa es la horizontal de A y B, la de arriba en el alzado. C está en la de D y C:
                  la que corta a r₂ a la altura de D₂C₂.
                ejemplo: 'proy_planta(punto_en_plano(alzado: pie_perpendicular(figura.punto("C2"), figura.segmento("AB2")), plano: plano_t))'
              - si: siempre
                mensaje: |
                  C₁ está en la vertical de C₂, sobre la perpendicular a r₁ que pasa por el punto de
                  r₁ a la cota de D₂C₂.
          - nombre: D1
            pide: el vértice D, en la planta
            es: proy_planta(solucion.D)
            bien: |
              D₁ está en la misma horizontal que C₁, perpendicular a r₁, en la vertical de D₂. A₁B₁
              y D₁C₁ salen paralelas, como tienen que salir los lados paralelos de un trapecio.
            diagnosticos:
              - si: 'en_recta(solucion.papel_DC) && en_vertical_de(figura.punto("D2"))'
                mensaje: |
                  Has trazado la horizontal del plano por D como una horizontal del papel. En la
                  planta va **perpendicular a r₁**: D₁ está en la misma que C₁.
                ejemplo: 'pie_perpendicular(figura.punto("D2"), solucion.papel_DC)'
              - si: '!en_vertical_de(figura.punto("D2"))'
                mensaje: |
                  D₁ va en la **vertical de D₂**.
                ejemplo: 'desplaza(proy_planta(solucion.D), dx: mm(6))'
              - si: en_recta(proy_planta(solucion.horizontal_AB))
                mensaje: |
                  Esa es la horizontal de A y B. D está en la de D y C, la misma que C₁.
                ejemplo: 'proy_planta(punto_en_plano(alzado: pie_perpendicular(figura.punto("D2"), figura.segmento("AB2")), plano: plano_t))'
              - si: siempre
                mensaje: |
                  D₁ está en la vertical de D₂, sobre la horizontal de C₁: la perpendicular a r₁ a la
                  cota de DC.
        trazado:
          - 'proy_planta([segmento3(solucion.A, solucion.B), segmento3(solucion.B, solucion.C), segmento3(solucion.C, solucion.D), segmento3(solucion.D, solucion.A)])'
          - proy_planta(segmento3(solucion.R_AB, solucion.B))
          - proy_planta(segmento3(solucion.R_DC, solucion.C))
        construccion:
          - con: regla
            traza: segmento2(figura.punto("A2"), proy_alzado(solucion.R_AB))
            porque: |
              A₂B₂ es horizontal en el alzado: AB es una **horizontal del plano**, y corta a r en el
              punto de r que está a su cota. Se prolonga A₂B₂ con la regla, desde A₂ hacia la
              izquierda, hasta r₂.
          - con: marca
            traza: proy_alzado(solucion.R_AB)
            rotulo: 1₂
            porque: |
              1₂, donde la prolongación de A₂B₂ corta r₂: el punto de r que está a la cota de AB. Es
              un nombre nuestro.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(solucion.R_AB), proy_planta(solucion.R_AB))
            guia: figura.segmento("AB2")
            porque: |
              Se baja a la planta por su línea de referencia, perpendicular a A₂B₂, hasta r₁: 1 está en
              r, así que 1₁ cae en r₁.
          - con: marca
            traza: proy_planta(solucion.R_AB)
            rotulo: 1₁
            porque: |
              1₁, donde la vertical de 1₂ corta r₁: por ahí pasa, en la planta, la horizontal AB.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.R_AB), solucion.L_hAB)
            guia: figura.segmento("r1")
            porque: |
              r es la línea de máxima pendiente, perpendicular a las horizontales del plano, y ese
              ángulo recto se ve en la planta, donde la horizontal está en verdadera magnitud. Por 1₁,
              la **perpendicular a r₁**, con la escuadra apoyada en el cartabón: es la planta de la
              horizontal AB. Larga, hasta pasar la vertical de B₂.
          - con: escuadra-cartabon
            traza: '[segmento2(figura.punto("A2"), proy_planta(solucion.A)), segmento2(figura.punto("B2"), proy_planta(solucion.B))]'
            guia: figura.segmento("AB2")
            porque: |
              A y B están en esa horizontal: por A₂ y por B₂, sus líneas de referencia, hasta cortarla.
          - con: marca
            traza: proy_planta(solucion.A)
            rotulo: A₁
            porque: |
              A₁, donde la vertical de A₂ corta la planta de la horizontal AB.
          - con: marca
            traza: proy_planta(solucion.B)
            rotulo: B₁
            porque: |
              B₁, donde la vertical de B₂ corta la misma horizontal. A₁B₁ mide 30,0 mm, en verdadera
              magnitud, porque AB es horizontal.
          - con: regla
            traza: segmento2(figura.punto("D2"), proy_alzado(solucion.R_DC))
            porque: |
              Con DC, igual: D₂C₂ también es horizontal en el alzado, y DC es otra horizontal del
              plano. Se prolonga con la regla desde D₂ hasta r₂.
          - con: marca
            traza: proy_alzado(solucion.R_DC)
            rotulo: 2₂
            porque: |
              2₂, donde la prolongación de D₂C₂ corta r₂: el punto de r que está a la cota de DC. Es
              un nombre nuestro.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(solucion.R_DC), proy_planta(solucion.R_DC))
            guia: figura.segmento("AB2")
            porque: |
              Su línea de referencia, hasta r₁, porque 2 también está en r.
          - con: marca
            traza: proy_planta(solucion.R_DC)
            rotulo: 2₁
            porque: |
              2₁, donde la vertical de 2₂ corta r₁: por ahí pasa, en la planta, la horizontal DC.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.R_DC), solucion.L_hDC)
            guia: figura.segmento("r1")
            porque: |
              Por 2₁, la perpendicular a r₁: la planta de la horizontal DC, paralela a la de AB porque
              las dos son perpendiculares a r₁. Larga, hasta pasar la vertical de C₂.
          - con: escuadra-cartabon
            traza: '[segmento2(figura.punto("D2"), proy_planta(solucion.D)), segmento2(figura.punto("C2"), proy_planta(solucion.C))]'
            guia: figura.segmento("AB2")
            porque: |
              D y C están en esa horizontal: por D₂ y por C₂, sus líneas de referencia, hasta cortarla.
          - con: marca
            traza: proy_planta(solucion.D)
            rotulo: D₁
            porque: |
              D₁, donde la vertical de D₂ corta la planta de la horizontal DC.
          - con: marca
            traza: proy_planta(solucion.C)
            rotulo: C₁
            porque: |
              C₁, donde la vertical de C₂ corta la misma horizontal. D₁C₁ mide 60,0 mm, también en
              verdadera magnitud.
          - con: regla
            traza: '[segmento2(proy_planta(solucion.B), proy_planta(solucion.C)), segmento2(proy_planta(solucion.D), proy_planta(solucion.A))]'
            porque: |
              La planta del trapecio se cierra con la regla, B₁C₁ y D₁A₁; los otros dos lados ya están,
              sobre las horizontales. A₁B₁ y D₁C₁ salen paralelas, como los lados paralelos de un
              trapecio.
        pista: |
          (1) En el alzado, prolonga A₂B₂ hasta r₂, y D₂C₂ también. (2) Baja esos dos puntos a r₁. (3)
          Por cada uno, la perpendicular a r₁: son las plantas de las horizontales AB y DC. (4) Baja
          cada vértice por su vertical hasta su horizontal.
        desarrollo: |
          En verde claro, la planta del trapecio y las dos horizontales desde r₁. A₁B₁ y D₁C₁ son
          perpendiculares a r₁ y paralelas entre sí; miden 30,0 y 60,0 mm, en verdadera magnitud,
          porque son horizontales.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: A₂B₂ y D₂C₂ son horizontales en el alzado, así que AB y DC son horizontales del plano.
          - texto: Cada horizontal corta a r en el punto de r que está a su cota, y eso se ve en el alzado, donde r₂ corta la prolongación de A₂B₂ o de D₂C₂.
          - texto: r es la línea de máxima pendiente, perpendicular a las horizontales; en la planta, las horizontales van perpendiculares a r₁.
          - texto: Cada vértice baja por su vertical hasta la planta de su horizontal.
          - texto: Las horizontales van en la planta horizontales en el papel, igual que en el alzado.
            trampa: true
            mensaje: |
              En el alzado una horizontal va horizontal en el papel porque no cambia de cota. En la
              planta no hay nada que la obligue: la de este plano va perpendicular a r₁.
    resolucion: |
      **Qué dice la figura.** r es la línea de máxima pendiente del plano, y el trapecio solo
      tiene alzado. A₂B₂ y D₂C₂ son horizontales: AB y DC son horizontales del plano, y por eso
      paralelas.

      **Las horizontales en la planta.** La línea de máxima pendiente es perpendicular a las
      horizontales del plano, y como el ángulo recto tiene un lado horizontal, se ve recto en la
      planta: las horizontales van perpendiculares a r₁. La de AB pasa por el punto de r a la cota
      de A₂B₂: en el alzado, donde la prolongación de A₂B₂ corta a r₂; bajado a r₁, la
      perpendicular a r₁ por él es la planta de AB. Con DC, igual.

      **Los vértices.** Cada uno baja por su vertical hasta su horizontal: A₁ y B₁ en la de AB, C₁ y
      D₁ en la de DC. A₁B₁ mide 30,0 mm y D₁C₁ 60,0 mm, en verdadera magnitud, porque son
      horizontales.

  # ── 2 b · El rectángulo perpendicular al trapecio. Lo que enseña: la
  #    perpendicular a un plano se dibuja contra sus horizontales (en la planta) y
  #    sus frontales (en el alzado), y una longitud sobre ella se lleva en
  #    verdadera magnitud. Y que «en la parte superior» fija un lado.
  - id: exeg-h54-2b-el-rectangulo-perpendicular-sobre-la-diagonal
    titulo: El rectángulo perpendicular al trapecio, sobre la diagonal AC
    fuente: >-
      Ejercicio 54, apartado 2 b · Colección de ejercicios de Geometría
      Descriptiva, Sistema Diédrico Directo (EJERCICIO 54, págs. 61-63; el
      apartado 2, en las 61 y 63) · Dpto. de Expresión Gráfica y Proyectos de
      Ingeniería, EIG · UPV/EHU. Sin fecha: es uno de los cuatro ejercicios
      bilingües, del 52 al 55, con que cierra la colección, y el único que se
      titula «Examen» («Azterketa / Examen» en su enunciado, y cajetín de examen
      en sus láminas). Se transcribe el castellano; la figura se redibuja desde
      sus coordenadas.
    nivel: examen
    # Decisión: los 30 mm son milímetros de la lámina, no reales. El cajetín dice
    # 1:100, y 30 mm reales serían 0,3 mm de papel; además, el propio trapecio
    # está dibujado en esas medidas: AB mide 30,0 mm y DC 60,0 mm en verdadera
    # magnitud (A₁B₁ y D₁C₁, que son horizontales). Lo dicen las notas. Y «en la
    # parte superior del trapecio» es del lado del plano hacia donde sube la cota:
    # una sola posición (el de debajo, un diagnóstico). El euskera lo dice igual:
    # «Laukizuzena trapezioaren gainetik kokatzen da», encima del trapecio.
    enunciado: |
      El trapecio ABCD está el en plano definido por la línea de máxima pendiente r.

      b. Dibujar un plano rectangular que es perpendicular al trapecio. Datos: un lado es la diagonal AC y el otro lado mide 30 mm. El rectángulo se sitúa en la parte superior del trapecio.

      **Notas nuestras.** «Está el en plano» es errata de la página por «está en el plano». La
      figura es la del apartado 2 a: r en sus dos proyecciones y el trapecio en el alzado; su
      planta es lo que pide el apartado 2 a, y aquí se vuelven a marcar A₁ y C₁. Llamamos E y F a
      los otros dos vértices del rectángulo, E el que va con A y F el que va con C. Los 30 mm son
      de la lámina, aunque el cajetín diga 1:100: el propio trapecio está dibujado en esas
      medidas (A₁B₁ mide 30,0 mm y D₁C₁, 60,0 mm), y 30 mm reales serían 0,3 mm de papel. «En
      la parte superior» es del lado del trapecio hacia donde sube la cota.
    pide: A₁ y C₁, y los otros dos vértices del rectángulo, E y F, en las dos vistas.
    receta:
      lamina: ex54-2
      escena:
        r: 'recta3(alzado: figura.segmento("r2"), planta: figura.segmento("r1"))'
        plano_t: plano_por_lmp(r)
        A: 'punto_en_plano(alzado: figura.punto("A2"), plano: plano_t)'
        B: 'punto_en_plano(alzado: figura.punto("B2"), plano: plano_t)'
        C: 'punto_en_plano(alzado: figura.punto("C2"), plano: plano_t)'
        D: 'punto_en_plano(alzado: figura.punto("D2"), plano: plano_t)'
      solucion:
        perp_A: perpendicular_a_plano(A, plano_t)
        perp_C: perpendicular_a_plano(C, plano_t)
        arriba: 'paralelo_a_distancia(plano_t, mm(30), sentido: ascendente)'
        abajo: 'paralelo_a_distancia(plano_t, mm(30), sentido: descendente)'
        E: corte_recta_plano(perp_A, arriba)
        F: corte_recta_plano(perp_C, arriba)
        E_abajo: corte_recta_plano(perp_A, abajo)
        F_abajo: corte_recta_plano(perp_C, abajo)
        # Los errores de llevar los 30 mm sobre una proyección de la perpendicular,
        # hacia arriba (el primero de los dos que da medir_sobre).
        E_30_planta: 'uno(medir_sobre(proy_planta(perp_A), desde: proy_planta(A), distancia: mm(30)), 1)'
        E_30_alzado: 'uno(medir_sobre(proy_alzado(perp_A), desde: figura.punto("A2"), distancia: mm(30)), 1)'
        F_30_planta: 'uno(medir_sobre(proy_planta(perp_C), desde: proy_planta(C), distancia: mm(30)), 1)'
        F_30_alzado: 'uno(medir_sobre(proy_alzado(perp_C), desde: figura.punto("C2"), distancia: mm(30)), 1)'
        # Para A₁ y C₁: el error de la horizontal del papel, como en el apartado 2 a.
        cota_AB: 'plano(A, B, punto3(alzado: figura.punto("A2"), planta: desplaza(proy_planta(A), dy: 10)))'
        cota_DC: 'plano(D, C, punto3(alzado: figura.punto("D2"), planta: desplaza(proy_planta(D), dy: 10)))'
        vertical_papel: 'segmento2(figura.punto("A2"), desplaza(figura.punto("A2"), dy: 10))'
        papel_AB: 'perpendicular(por: proy_planta(corte_recta_plano(r, cota_AB)), a: vertical_papel)'
        papel_DC: 'perpendicular(por: proy_planta(corte_recta_plano(r, cota_DC)), a: vertical_papel)'
        # Para la construcción paso a paso: los puntos de r a la cota de AB y a la de
        # DC, por donde pasan, en la planta, las dos horizontales (como en el
        # apartado 2 a).
        R_AB: corte_recta_plano(r, cota_AB)
        R_DC: corte_recta_plano(r, cota_DC)
        # Para la construcción paso a paso: dónde corta A₂ su vertical a D₂C₂. De A₂
        # a ese punto, lo que A está más alto que DC.
        A_DC: 'proy_alzado(vertical_hasta(A, linea(figura.segmento("DC2"))))'
        # Para la construcción paso a paso, el camino de la pista: la frontal del
        # plano por A, que da en el alzado la dirección de la perpendicular, y un
        # punto de la perpendicular con su triángulo. Z es donde la frontal de A
        # corta r (el punto 3 de la construcción): frontal_A es el plano frontal
        # que pasa por A.
        frontal_A: 'plano(A, punto3(alzado: desplaza(figura.punto("A2"), dx: 10), planta: desplaza(proy_planta(A), dx: 10)), punto3(alzado: desplaza(figura.punto("A2"), dy: -10), planta: proy_planta(A)))'
        Z: corte_recta_plano(r, frontal_A)
        # Decisión: el punto cualquiera de la perpendicular por A que pide la pista
        # es X, el que está a la cota de DC (el punto 4 de la construcción): en el
        # alzado cae donde la perpendicular corta D₂C₂, y su diferencia de cotas
        # con A ya está medida en la vertical de A₂. Está por debajo de A, así que
        # los 30 mm se llevan al otro lado de A₁, hacia arriba. Xab es X en el
        # triángulo, a esa diferencia de cotas de X₁ por la perpendicular a r₁,
        # hacia la derecha, para que (E) caiga a la izquierda, donde la lámina está
        # libre; y Eab, E en el triángulo, en la prolongación de Xab A₁, a 30 mm
        # de A₁.
        X: corte_recta_plano(perp_A, cota_DC)
        Xab: 'uno(medir_sobre(perpendicular(por: proy_planta(X), a: figura.segmento("r1")), desde: proy_planta(X), distancia: diferencia_de_cotas(A, X)), 1)'
        Eab: 'uno(medir_sobre(segmento2(Xab, proy_planta(A)), desde: proy_planta(A), distancia: mm(30)), 1)'
        # Los extremos de las rectas largas de la construcción paso a paso: en el
        # papel se trazan más allá del punto que van a dar, y no paran en él.
        L_hA: 'uno(medir_sobre(segmento2(proy_planta(R_AB), proy_planta(A)), desde: proy_planta(A), distancia: mm(4)), 1)'
        L_hC: 'uno(medir_sobre(segmento2(proy_planta(R_DC), proy_planta(C)), desde: proy_planta(C), distancia: mm(4)), 1)'
        L_pA_bajo: 'uno(medir_sobre(segmento2(figura.punto("A2"), proy_alzado(X)), desde: proy_alzado(X), distancia: mm(4)), 1)'
        L_pA_alto: 'uno(medir_sobre(segmento2(figura.punto("A2"), proy_alzado(E)), desde: proy_alzado(E), distancia: mm(4)), 1)'
        L_A_X: 'uno(medir_sobre(segmento2(proy_planta(A), proy_planta(X)), desde: proy_planta(X), distancia: mm(4)), 1)'
        L_A_E: 'uno(medir_sobre(segmento2(proy_planta(A), proy_planta(E)), desde: proy_planta(E), distancia: mm(4)), 1)'
        L_Xab: 'uno(medir_sobre(segmento2(proy_planta(X), Xab), desde: Xab, distancia: mm(4)), 1)'
        L_Eab: 'uno(medir_sobre(segmento2(Xab, Eab), desde: Eab, distancia: mm(6)), 1)'
        L_rC: 'uno(medir_sobre(segmento2(proy_planta(C), proy_planta(F)), desde: proy_planta(F), distancia: mm(4)), 1)'
        L_pC: 'uno(medir_sobre(segmento2(figura.punto("C2"), proy_alzado(F)), desde: proy_alzado(F), distancia: mm(4)), 1)'
    pasos:
      - tipo: reconocer
        pregunta: ¿Cómo se ven en las dos vistas las rectas perpendiculares al plano del trapecio, como AE y CF?
        opciones:
          - texto: En la planta, paralelas a r₁, perpendiculares a las horizontales; en el alzado, perpendiculares a las frontales del plano
            correcta: true
            mensaje: |
              Eso es. Una recta perpendicular a un plano es perpendicular a todas sus rectas, y el
              ángulo recto solo se ve recto en la vista donde la otra recta está en verdadera
              magnitud: en la planta, contra las horizontales; en el alzado, contra las frontales.
              Como r es la línea de máxima pendiente, en la planta la perpendicular va paralela a
              r₁.
          - texto: Perpendiculares a la diagonal AC en las dos vistas, porque el rectángulo tiene un ángulo recto en A y los ángulos rectos se dibujan rectos en cualquier vista
            mensaje: |
              El ángulo recto en A es entre AE y AC, pero AC no es horizontal ni frontal, y ese
              ángulo no se ve recto en ninguna vista. Además, AE no solo es perpendicular a AC:
              es perpendicular al plano entero, y eso se dibuja contra las horizontales y las
              frontales.
          - texto: En la planta, perpendiculares a r₁, como las horizontales, porque las dos son perpendiculares a la línea de máxima pendiente r
            mensaje: |
              Perpendiculares a r₁ son las horizontales del plano, que están dentro de él. La
              perpendicular al plano es perpendicular a ellas, así que en la planta va paralela a
              r₁.

      - tipo: construir
        titulo: Los otros dos vértices del rectángulo
        intro: |
          Marca primero A₁ y C₁, como en el apartado 2 a. Después, E y F en las dos vistas: por A y
          por C, la perpendicular al plano, y sobre ella 30 mm en verdadera magnitud, hacia donde
          sube la cota. Para llevar los 30 mm, abate la perpendicular sobre la planta con el
          triángulo de su planta y su diferencia de cotas, o haz un cambio de plano con la línea
          nueva paralela a r₁, que deja el plano de canto.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, borrar]
        tolerancia: 1
        objetivos:
          - nombre: A1
            pide: el vértice A, en la planta
            es: proy_planta(A)
            bien: |
              A₁ está en la vertical de A₂, sobre la horizontal del plano por A, perpendicular a r₁.
            diagnosticos:
              - si: 'en_recta(solucion.papel_AB) && en_vertical_de(figura.punto("A2"))'
                mensaje: |
                  Has trazado la horizontal del plano por A como una horizontal del papel. En la
                  planta va **perpendicular a r₁**.
                ejemplo: 'pie_perpendicular(figura.punto("A2"), solucion.papel_AB)'
              - si: '!en_vertical_de(figura.punto("A2"))'
                mensaje: |
                  A₁ va en la **vertical de A₂**.
                ejemplo: 'desplaza(proy_planta(A), dx: mm(6))'
              - si: siempre
                mensaje: |
                  A₁ está en la vertical de A₂, sobre la perpendicular a r₁ que pasa por el punto de
                  r₁ a la cota de A₂B₂.
          - nombre: C1
            pide: el vértice C, en la planta
            es: proy_planta(C)
            bien: |
              C₁ está en la vertical de C₂, sobre la horizontal del plano por D y C.
            diagnosticos:
              - si: 'en_recta(solucion.papel_DC) && en_vertical_de(figura.punto("C2"))'
                mensaje: |
                  Has trazado la horizontal del plano por C como una horizontal del papel. En la
                  planta va **perpendicular a r₁**.
                ejemplo: 'pie_perpendicular(figura.punto("C2"), solucion.papel_DC)'
              - si: '!en_vertical_de(figura.punto("C2"))'
                mensaje: |
                  C₁ va en la **vertical de C₂**.
                ejemplo: 'desplaza(proy_planta(C), dx: mm(6))'
              - si: siempre
                mensaje: |
                  C₁ está en la vertical de C₂, sobre la perpendicular a r₁ que pasa por el punto de
                  r₁ a la cota de D₂C₂.
          - nombre: E1
            pide: el vértice E, el que va con A, en la planta
            es: proy_planta(solucion.E)
            bien: |
              E₁ está en la paralela a r₁ por A₁, hacia donde baja el plano, a 16,0 mm de A₁: lo que
              ocupan en la planta 30 mm de una recta que forma 57,7° con el plano horizontal.
            diagnosticos:
              - si: cerca_de(proy_planta(solucion.E_abajo))
                mensaje: |
                  Ese es el vértice del rectángulo de **debajo** del trapecio. El enunciado lo quiere
                  en la parte superior: la perpendicular, desde A, hacia donde sube la cota.
                ejemplo: proy_planta(solucion.E_abajo)
              - si: 'a_distancia(de: proy_planta(A), d: mm(30)) && en_recta(proy_planta(solucion.perp_A))'
                mensaje: |
                  Has llevado los 30 mm **en la planta**, y la planta acorta la perpendicular: no
                  es horizontal. Los 30 mm van en verdadera magnitud; en la planta se quedan en
                  16,0 mm.
                ejemplo: solucion.E_30_planta
              - si: '!en_recta(proy_planta(solucion.perp_A))'
                mensaje: |
                  En la planta, la perpendicular al plano por A va **paralela a r₁**: es
                  perpendicular a las horizontales del plano, A₁B₁ y D₁C₁.
                ejemplo: 'desplaza(proy_planta(solucion.E), dx: mm(6), dy: mm(6))'
              - si: siempre
                mensaje: |
                  E₁ está en la paralela a r₁ por A₁, pero a otra distancia. Lleva los 30 mm en
                  verdadera magnitud: con el triángulo de la perpendicular (su planta y su diferencia
                  de cotas) o con un cambio de plano paralelo a r₁.
          - nombre: E2
            pide: el vértice E, en el alzado
            es: proy_alzado(solucion.E)
            bien: |
              E₂ está en la vertical de E₁, 25,4 mm por encima de A₂: lo que sube un segmento de
              30 mm que forma 57,7° con el plano horizontal.
            diagnosticos:
              - si: cerca_de(proy_alzado(solucion.E_abajo))
                mensaje: |
                  Ese es el vértice del rectángulo de **debajo**. Va en la parte superior: E queda
                  más alto que A.
                ejemplo: proy_alzado(solucion.E_abajo)
              - si: 'a_distancia(de: figura.punto("A2"), d: mm(30)) && en_recta(proy_alzado(solucion.perp_A))'
                mensaje: |
                  Has llevado los 30 mm **en el alzado**, y el alzado también acorta: la
                  perpendicular no es frontal. A₂E₂ mide 26,1 mm.
                ejemplo: solucion.E_30_alzado
              - si: '!en_vertical_de(E1)'
                mensaje: |
                  E₂ va en la **vertical de E₁**.
                ejemplo: 'proy_alzado(punto_medio(segmento3(A, solucion.E)))'
              - si: siempre
                mensaje: |
                  E₂ va en la vertical de E₁ y 25,4 mm por encima de A₂: lo que sube AE, que da el
                  triángulo de la verdadera magnitud.
                ejemplo: 'desplaza(proy_alzado(solucion.E), dy: mm(-6))'
          - nombre: F1
            pide: el vértice F, el que va con C, en la planta
            es: proy_planta(solucion.F)
            bien: |
              F₁ está en la paralela a r₁ por C₁, a 16,0 mm, igual que E₁ de A₁: E₁F₁ sale igual y
              paralela a A₁C₁.
            diagnosticos:
              - si: cerca_de(proy_planta(solucion.F_abajo))
                mensaje: |
                  Ese es el vértice del rectángulo de **debajo** del trapecio. Va en la parte
                  superior, como E.
                ejemplo: proy_planta(solucion.F_abajo)
              - si: 'a_distancia(de: proy_planta(C), d: mm(30)) && en_recta(proy_planta(solucion.perp_C))'
                mensaje: |
                  Has llevado los 30 mm **en la planta**, que acorta. En la planta se quedan en
                  16,0 mm, como de A₁ a E₁.
                ejemplo: solucion.F_30_planta
              - si: '!en_recta(proy_planta(solucion.perp_C))'
                mensaje: |
                  En la planta, la perpendicular al plano por C va **paralela a r₁**, como la de A.
                ejemplo: 'desplaza(proy_planta(solucion.F), dx: mm(6), dy: mm(6))'
              - si: siempre
                mensaje: |
                  F₁ está en la paralela a r₁ por C₁, a lo mismo que E₁ de A₁: el rectángulo tiene
                  AE igual y paralelo a CF.
          - nombre: F2
            pide: el vértice F, en el alzado
            es: proy_alzado(solucion.F)
            bien: |
              F₂ está en la vertical de F₁, 25,4 mm por encima de C₂.
            diagnosticos:
              - si: cerca_de(proy_alzado(solucion.F_abajo))
                mensaje: |
                  Ese es el vértice del rectángulo de **debajo**. F queda más alto que C.
                ejemplo: proy_alzado(solucion.F_abajo)
              - si: 'a_distancia(de: figura.punto("C2"), d: mm(30)) && en_recta(proy_alzado(solucion.perp_C))'
                mensaje: |
                  Has llevado los 30 mm **en el alzado**, que también acorta: C₂F₂ mide 26,1 mm.
                ejemplo: solucion.F_30_alzado
              - si: '!en_vertical_de(F1)'
                mensaje: |
                  F₂ va en la **vertical de F₁**.
                ejemplo: 'proy_alzado(punto_medio(segmento3(C, solucion.F)))'
              - si: siempre
                mensaje: |
                  F₂ va en la vertical de F₁ y 25,4 mm por encima de C₂, como E₂ sobre A₂.
                ejemplo: 'desplaza(proy_alzado(solucion.F), dy: mm(-6))'
        trazado:
          - 'proy_planta([segmento3(A, B), segmento3(B, C), segmento3(C, D), segmento3(D, A)])'
          - 'proy_planta([segmento3(A, C), segmento3(C, solucion.F), segmento3(solucion.F, solucion.E), segmento3(solucion.E, A)])'
          - 'proy_alzado([segmento3(A, C), segmento3(C, solucion.F), segmento3(solucion.F, solucion.E), segmento3(solucion.E, A)])'
        bloques:
          - nombre: Abatimiento del plano vertical de AE
            explica: |
              AE, perpendicular al plano del trapecio, no es horizontal ni frontal, y los 30 mm no
              se pueden llevar en ninguna vista; de los dos caminos que propone el paso, aquí se
              [abate](/road-to-ingenieria/expresion-grafica/t03-metodos-descriptivos/#el-abatimiento-tumbar-el-plano)
              el plano vertical que contiene a AE sobre el plano horizontal de A. La charnela es la
              horizontal de ese plano que pasa por A, cuya planta es la paralela a r₁ por A₁: A no
              se mueve, y cada punto gira en un plano perpendicular a ella, así que en la planta va
              por la perpendicular a A₁4₁. Como el plano es vertical, el radio de 4 es solo lo que
              está más bajo que A, de A₂ a D₂C₂ en el alzado, y A₁(4) es la perpendicular en
              verdadera magnitud. Sobre ella se llevan los 30 mm, al otro lado de A₁, porque 4 está
              por debajo de A y E va por encima. (E) se desabate por la perpendicular a la charnela
              hasta la planta de AE, y ahí está E₁.
        construccion:
          - con: regla
            traza: segmento2(figura.punto("A2"), proy_alzado(solucion.R_AB))
            porque: |
              Primero A₁, como en el apartado 2 a. A₂B₂ es horizontal: AB es una horizontal del plano y
              corta a r en el punto de r que está a su cota. Se prolonga A₂B₂ con la regla, desde A₂
              hasta r₂.
          - con: marca
            traza: proy_alzado(solucion.R_AB)
            rotulo: 1₂
            porque: |
              1₂, donde la prolongación de A₂B₂ corta r₂: el punto de r a la cota de AB. Es un nombre
              nuestro.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(solucion.R_AB), proy_planta(solucion.R_AB))
            guia: figura.segmento("AB2")
            porque: |
              Su línea de referencia, perpendicular a A₂B₂, hasta r₁: 1 está en r, así que 1₁ cae en r₁.
          - con: marca
            traza: proy_planta(solucion.R_AB)
            rotulo: 1₁
            porque: |
              1₁, donde la vertical de 1₂ corta r₁: por ahí pasa, en la planta, la horizontal AB.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.R_AB), solucion.L_hA)
            guia: figura.segmento("r1")
            porque: |
              Por 1₁, la **perpendicular a r₁**: r es la línea de máxima pendiente, perpendicular a las
              horizontales, y el ángulo recto se ve en la planta. Es la planta de la horizontal AB, y se
              traza hasta pasar la vertical de A₂.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("A2"), proy_planta(A))
            guia: figura.segmento("AB2")
            porque: |
              Por A₂, su línea de referencia, hasta la horizontal de AB. Por el camino corta D₂C₂, y lo
              que hay de A₂ a ese cruce es lo que A está más alto que DC: se va a usar más adelante.
          - con: marca
            traza: proy_planta(A)
            rotulo: A₁
            porque: |
              A₁, donde la vertical de A₂ corta la planta de la horizontal AB.
          - con: regla
            traza: segmento2(figura.punto("D2"), proy_alzado(solucion.R_DC))
            porque: |
              C₁, igual, con la horizontal DC: se prolonga D₂C₂ con la regla, desde D₂ hasta r₂.
          - con: marca
            traza: proy_alzado(solucion.R_DC)
            rotulo: 2₂
            porque: |
              2₂, donde la prolongación de D₂C₂ corta r₂: el punto de r a la cota de DC. Es un nombre
              nuestro.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(solucion.R_DC), proy_planta(solucion.R_DC))
            guia: figura.segmento("AB2")
            porque: |
              Su línea de referencia, hasta r₁, porque 2 también está en r.
          - con: marca
            traza: proy_planta(solucion.R_DC)
            rotulo: 2₁
            porque: |
              2₁, donde la vertical de 2₂ corta r₁: por ahí pasa, en la planta, la horizontal DC.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.R_DC), solucion.L_hC)
            guia: figura.segmento("r1")
            porque: |
              Por 2₁, la perpendicular a r₁: la planta de la horizontal DC. Larga, hasta pasar la
              vertical de C₂.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("C2"), proy_planta(C))
            guia: figura.segmento("AB2")
            porque: |
              Por C₂, su línea de referencia, hasta la horizontal de DC, porque C está en ella.
          - con: marca
            traza: proy_planta(C)
            rotulo: C₁
            porque: |
              C₁, donde la vertical de C₂ corta la planta de la horizontal DC.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(A), proy_planta(solucion.Z))
            guia: figura.segmento("AB2")
            porque: |
              Ahora la perpendicular al plano por A. En el alzado va perpendicular a las **frontales** del
              plano, así que hace falta una. Una frontal está a alejamiento constante, y en la planta va
              horizontal en el papel: por A₁, la paralela a A₂B₂, hacia la izquierda, hasta r₁.
          - con: marca
            traza: proy_planta(solucion.Z)
            rotulo: 3₁
            porque: |
              3₁, donde esa frontal corta r₁: el punto de r que está en la frontal de A. Es un nombre
              nuestro.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.Z), proy_alzado(solucion.Z))
            guia: figura.segmento("AB2")
            porque: |
              Su línea de referencia, hasta r₂, porque 3 está en r.
          - con: marca
            traza: proy_alzado(solucion.Z)
            rotulo: 3₂
            porque: |
              3₂, donde la vertical de 3₁ corta r₂.
          - con: regla
            traza: segmento2(figura.punto("A2"), proy_alzado(solucion.Z))
            porque: |
              A₂3₂ es la frontal de A en el alzado, en verdadera magnitud, porque es frontal.
          - con: escuadra-cartabon
            traza: '[segmento2(figura.punto("A2"), solucion.L_pA_alto), segmento2(figura.punto("A2"), solucion.L_pA_bajo)]'
            guia: segmento2(figura.punto("A2"), proy_alzado(solucion.Z))
            porque: |
              La perpendicular al plano es perpendicular a la frontal, y el ángulo recto se ve en el
              alzado, donde la frontal está en verdadera magnitud. Por A₂, la perpendicular a A₂3₂, con
              la escuadra apoyada en ella: hacia arriba, larga, porque E va a estar en ella, y hacia
              abajo, hasta pasar D₂C₂.
          - con: marca
            traza: proy_alzado(solucion.X)
            rotulo: 4₂
            porque: |
              4₂, donde la perpendicular corta D₂C₂: un punto cualquiera de la perpendicular, elegido a
              la cota de DC para que su diferencia de cotas con A ya esté medida, de A₂ a D₂C₂. Es un
              nombre nuestro.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(A), solucion.L_A_X), segmento2(proy_planta(A), solucion.L_A_E)]'
            guia: figura.segmento("r1")
            porque: |
              En la planta, la perpendicular al plano va **paralela a r₁**, porque es perpendicular a las
              horizontales: por A₁, con la escuadra, larga hacia los dos lados.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(solucion.X), proy_planta(solucion.X))
            guia: figura.segmento("AB2")
            porque: |
              Por 4₂, su línea de referencia, hasta la paralela a r₁ por A₁, porque 4 está en la
              perpendicular.
          - con: marca
            traza: proy_planta(solucion.X)
            rotulo: 4₁
            porque: |
              4₁, donde la vertical de 4₂ corta la paralela a r₁ por A₁.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.X), solucion.L_Xab)
            guia: figura.segmento("r1")
            bloque: Abatimiento del plano vertical de AE
            porque: |
              El triángulo de la verdadera magnitud del tramo de A a 4: un cateto es A₁4₁, su planta, y
              el otro, lo que 4 está más bajo que A, en perpendicular. Por 4₁, la perpendicular a A₁4₁,
              con la escuadra, hacia la derecha, para que lo que salga al otro lado de A₁ caiga donde la
              lámina está libre.
          - con: compas
            traza: 'arco(proy_planta(solucion.X), por: solucion.Xab, desde: desplaza(solucion.Xab, dx: 2.6, dy: -6), hasta: desplaza(solucion.Xab, dx: -2.6, dy: 6))'
            toma: segmento2(figura.punto("A2"), solucion.A_DC)
            bloque: Abatimiento del plano vertical de AE
            porque: |
              Con el compás se toma en el alzado lo que 4 está más bajo que A, de A₂ a D₂C₂, y se lleva
              desde 4₁ sobre esa perpendicular: es el otro cateto. Hacia la izquierda también valdría,
              pero la perpendicular solo se ha trazado hacia la derecha, y el arco la corta una vez.
          - con: marca
            traza: solucion.Xab
            rotulo: (4)
            bloque: Abatimiento del plano vertical de AE
            porque: |
              (4), donde el arco corta la perpendicular: el tercer vértice del triángulo, rectángulo en
              4₁.
          - con: regla
            traza: segmento2(solucion.Xab, solucion.L_Eab)
            bloque: Abatimiento del plano vertical de AE
            porque: |
              La hipotenusa (4)A₁ es la perpendicular al plano en verdadera magnitud, abatida sobre la
              planta. Se traza con la regla y se prolonga más allá de A₁, porque 4 está por debajo de A y
              E va por encima, al otro lado de A.
          - con: compas
            traza: 'arco(proy_planta(A), por: solucion.Eab, desde: desplaza(solucion.Eab, dx: -1.6, dy: -10), hasta: desplaza(solucion.Eab, dx: 1.6, dy: 10))'
            bloque: Abatimiento del plano vertical de AE
            porque: |
              Los 30 mm del enunciado, con el compás, desde A₁ sobre la prolongación. La circunferencia
              corta la recta a los dos lados de A₁; vale el de la izquierda, el que se aleja de (4),
              porque el rectángulo va en la parte superior del trapecio.
          - con: marca
            traza: solucion.Eab
            rotulo: (E)
            bloque: Abatimiento del plano vertical de AE
            porque: |
              (E), E abatido, donde el arco corta la prolongación: a 30 mm de A₁ en verdadera magnitud.
          - con: escuadra-cartabon
            traza: segmento2(solucion.Eab, proy_planta(solucion.E))
            guia: figura.segmento("r1")
            bloque: Abatimiento del plano vertical de AE
            porque: |
              Se deshace el abatimiento: E vuelve por la perpendicular a A₁4₁, hasta la paralela a r₁
              por A₁, que es la planta de AE.
          - con: marca
            traza: proy_planta(solucion.E)
            rotulo: E₁
            bloque: Abatimiento del plano vertical de AE
            porque: |
              E₁, donde esa perpendicular corta la paralela a r₁ por A₁: a 16,0 mm de A₁, porque la planta
              acorta la perpendicular al plano.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.E), proy_alzado(solucion.E))
            guia: figura.segmento("AB2")
            porque: |
              Por E₁, su línea de referencia hacia el alzado, hasta la perpendicular por A₂, porque E
              está en ella.
          - con: marca
            traza: proy_alzado(solucion.E)
            rotulo: E₂
            porque: |
              E₂, donde la vertical de E₁ corta la perpendicular por A₂: 25,4 mm por encima de A₂B₂.
          - con: regla
            traza: segmento2(proy_planta(A), proy_planta(C))
            porque: |
              F se saca del rectángulo: AE y CF son iguales y paralelas, así que E₁F₁ es igual y paralela
              a A₁C₁. Repetir el triángulo en C, como dice la pista, también vale; con las paralelas se ahorra.
              Primero la diagonal A₁C₁, el lado del rectángulo, con la regla.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(C), solucion.L_rC)
            guia: figura.segmento("r1")
            porque: |
              Por C₁, la paralela a r₁, hacia abajo y larga: la planta de la perpendicular al plano por
              C, donde está F₁.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.E), proy_planta(solucion.F))
            guia: segmento2(proy_planta(A), proy_planta(C))
            porque: |
              Por E₁, la paralela a A₁C₁, deslizando la escuadra sobre el cartabón, hasta la paralela a
              r₁ por C₁.
          - con: marca
            traza: proy_planta(solucion.F)
            rotulo: F₁
            porque: |
              F₁, donde la paralela a A₁C₁ por E₁ corta la paralela a r₁ por C₁. C₁F₁ es igual a A₁E₁.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("C2"), solucion.L_pC)
            guia: segmento2(figura.punto("A2"), solucion.L_pA_alto)
            porque: |
              En el alzado, la perpendicular al plano por C es paralela a la de A: por C₂, la paralela a
              A₂E₂, hacia arriba y larga.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.F), proy_alzado(solucion.F))
            guia: figura.segmento("AB2")
            porque: |
              Por F₁, su línea de referencia hacia el alzado, hasta la perpendicular por C₂, porque F está
              en ella.
          - con: marca
            traza: proy_alzado(solucion.F)
            rotulo: F₂
            porque: |
              F₂, donde la vertical de F₁ corta la perpendicular por C₂. A₂C₂F₂E₂ es el alzado del
              rectángulo, un paralelogramo: E₂F₂ sale igual y paralela a A₂C₂, pero el ángulo recto no se
              ve, porque el rectángulo no es frontal.
        pista: |
          (1) A₁ y C₁, como en el apartado 2 a. (2) Por A₁, la paralela a r₁; por A₂, la
          perpendicular a las frontales del plano. (3) Toma un punto cualquiera de esa perpendicular,
          y con su planta y su diferencia de cotas con A, el triángulo de la verdadera magnitud:
          sobre su hipotenusa, 30 mm desde A, hacia arriba. (4) Devuelve ese punto a la planta y al
          alzado: es E. (5) Con C, igual: F.
        desarrollo: |
          En verde claro, el rectángulo A C F E en las dos vistas, sobre la planta del trapecio.
          El plano forma 32,3° con el horizontal, y sus perpendiculares, 57,7°: los 30 mm de AE
          ocupan 16,0 mm en la planta y suben 25,4 mm. AC mide 57,1 mm: el rectángulo es de
          57,1 por 30 mm.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: El rectángulo es perpendicular al trapecio y tiene un lado en AC, así que AE y CF son perpendiculares al plano del trapecio.
          - texto: En la planta, una perpendicular al plano va perpendicular a sus horizontales, es decir, paralela a r₁; en el alzado, perpendicular a sus frontales.
          - texto: Los 30 mm se llevan en verdadera magnitud, con el triángulo de la perpendicular o con un cambio de plano, porque la perpendicular no es horizontal ni frontal.
          - texto: «En la parte superior» fija el lado, hacia donde sube la cota, y F se lleva desde C igual que E desde A.
          - texto: En las dos vistas, AE va perpendicular a la proyección de AC, porque el rectángulo tiene un ángulo recto en A.
            trampa: true
            mensaje: |
              El ángulo recto entre AE y AC no se ve recto en ninguna vista, porque AC no es
              horizontal ni frontal. La perpendicular al plano se dibuja contra las horizontales y
              las frontales.
    resolucion: |
      **La planta del trapecio**, primero, como en el apartado 2 a: A₁ y C₁ en las horizontales de
      AB y de DC, perpendiculares a r₁.

      **Las perpendiculares.** El rectángulo es perpendicular al trapecio y tiene el lado AC, así
      que AE y CF son perpendiculares al plano. En la planta van perpendiculares a las
      horizontales, paralelas a r₁; en el alzado, perpendiculares a las frontales.

      **Los 30 mm.** Son de la lámina, como las medidas del trapecio. La perpendicular forma 57,7°
      con el plano horizontal (el plano, 32,3°), así que hay que llevarlos en verdadera magnitud:
      con el triángulo de la perpendicular o con un cambio de plano paralelo a r₁, que deja el
      plano de canto y la perpendicular paralela a la vista nueva. En la planta ocupan 16,0 mm y en
      altura suben 25,4 mm.

      **El lado.** «En la parte superior» es hacia donde sube la cota: E y F quedan por encima del
      trapecio. El rectángulo A C F E mide 57,1 por 30 mm.

  # ── 3 · El tren y el cable. Lo que enseña: la distancia entre dos rectas que se
  #    cruzan, cuando una es paralela a las dos vistas; que el tren no es su
  #    trayectoria; y a pasar de la lámina a metros.
  - id: exeg-h54-3-el-tren-y-el-cable
    titulo: El tren bajo el cable de electricidad, a escala 1:100
    fuente: >-
      Ejercicio 54, apartado 3 · Colección de ejercicios de Geometría
      Descriptiva, Sistema Diédrico Directo (EJERCICIO 54, págs. 61-63; el
      apartado 3, en las 61 y 63) · Dpto. de Expresión Gráfica y Proyectos de
      Ingeniería, EIG · UPV/EHU. Sin fecha: es uno de los cuatro ejercicios
      bilingües, del 52 al 55, con que cierra la colección, y el único que se
      titula «Examen» («Azterketa / Examen» en su enunciado, y cajetín de examen
      en sus láminas). Se transcribe el castellano; la figura se redibuja desde
      sus coordenadas.
    nivel: examen
    # Decisión: el castellano de la pág. 61 tal cual, sin el «3.». «A 4 metros de
    # su trayectoria» se lee en vertical: el punto más alto del tren está 4 m por
    # encima de t, que es por donde van las ruedas. El euskera lo zanja: «trenaren
    # puntu altuena ibilbidetik 4 metrotako altueran dagoela», a 4 metros de altura
    # de su trayectoria. Lo dicen las notas.
    enunciado: |
      La trayectoria de un tren lo define la recta t. La recta s es un cable de electricidad. Para cumplir con la ley de seguridad, el punto más alto del tren no debe pasar a menos de 3 metros de distancia del cable.

      Para simplificar los cálculos, se considera que el punto más alto del tren está situado a 4 metros de su trayectoria. La escala del dibujo es 1:100.

      a. ¿Cumple la ley de seguridad? ¿A qué distancia pasa?

      b. En la situación más cercana, definir el punto del tren más alto y el punto del cable más cercano a él.

      **Notas nuestras.** La figura es la mitad derecha de la segunda lámina del Ejercicio 54:
      la trayectoria t y el cable s, en alzado (arriba) y en planta (abajo). t₂ y t₁ son
      horizontales en el papel: t es horizontal y frontal a la vez, y va de izquierda a derecha.
      Los 4 m se toman en vertical: el punto más alto del tren va 4 m por encima de su
      trayectoria, que a escala 1:100 son 40 mm de la lámina por encima de t₂, con la misma
      planta. A 1:100, cada milímetro de la lámina son 0,1 m. Llamamos P al punto más alto del
      tren y Q al del cable en la situación más cercana; los nombres son nuestros.
    pide: Si cumple la ley y a qué distancia pasa, en metros, y el punto más alto del tren y el del cable más cercano a él, en las dos vistas.
    receta:
      lamina: ex54-3
      escena:
        s: 'recta3(alzado: figura.segmento("s2"), planta: figura.segmento("s1"))'
        t: 'recta3(alzado: figura.segmento("t2"), planta: figura.segmento("t1"))'
      solucion:
        # La recta que recorre el punto más alto del tren: t, 40 mm más arriba en
        # el alzado (4 m a 1:100), con la misma planta.
        Ti: 'punto3(alzado: desplaza(punto_medio(figura.segmento("t2")), dy: mm(-40)), planta: punto_medio(figura.segmento("t1")))'
        Td: 'punto3(alzado: desplaza(punto_medio(figura.segmento("t2")), dx: mm(20), dy: mm(-40)), planta: desplaza(punto_medio(figura.segmento("t1")), dx: mm(20)))'
        t_alta: recta3(Ti, Td)
        P: pie_comun(t_alta, s)
        Q: pie_comun(s, t_alta)
        distancia_m: en_mm(distancia_rectas(t_alta, s)) / 10
        # Los errores: la trayectoria sin subir, y el punto de s a la altura de la
        # recta alta, donde s₂ cruza t′₂ en el alzado.
        P0: pie_comun(t, s)
        Q0: pie_comun(s, t)
        cota_alta: 'plano(Ti, Td, punto3(alzado: desplaza(punto_medio(figura.segmento("t2")), dy: mm(-40)), planta: desplaza(punto_medio(figura.segmento("t1")), dy: 10)))'
        cruce: corte_recta_plano(s, cota_alta)
        # Para la construcción paso a paso. Los extremos izquierdos de t₂ y de t₁
        # (en cifras, pt, desde sus puntos medios), y E₂, 40 mm por encima del de
        # t₂: un punto de t′₂, la recta del punto más alto del tren.
        T2i: 'desplaza(punto_medio(figura.segmento("t2")), dx: -81.48)'
        T1i: 'desplaza(punto_medio(figura.segmento("t1")), dx: -81.48)'
        E2: 'desplaza(T2i, dy: mm(-40))'
        # S, el extremo derecho del cable, el de la lámina (en cifras, pt, desde los
        # puntos medios de s₂ y s₁); y G, en la vertical de S a la altura de t′: de
        # S₂ a G₂, lo que S está más alto que t′.
        S: 'punto3(alzado: desplaza(punto_medio(figura.segmento("s2")), dx: 107.4, dy: -40.44), planta: desplaza(punto_medio(figura.segmento("s1")), dx: 107.4, dy: -34.8))'
        G: 'vertical_hasta(S, linea(segmento2(E2, desplaza(E2, dx: 10))))'
        # Decisión: el cambio de plano de la construcción paso a paso, con la
        # línea nueva perpendicular a t₁ como dice el intro, va a la izquierda de
        # la planta, a 236,49 pt (83,4 mm) de S₁, y S es la referencia: es el punto
        # más alto de los que se usan, así que todo lo demás cae hacia la planta,
        # en el hueco entre t₁ y s₁, y nada se sale de la lámina. Con la
        # referencia en t′, el punto más cercano del cable caería fuera; y a la
        # derecha de la planta no hay sitio. El segundo punto de s en la vista
        # nueva es el cruce, que está a la altura de t′ y se lleva con la misma
        # abertura del compás.
        S4pos: 'desplaza(proy_planta(S), dx: -236.49)'
        nueva: 'perpendicular(por: S4pos, a: figura.segmento("t1"))'
        # Las proyecciones en la vista nueva, la de perfil: t′ de punta (Ti es un
        # punto suyo), S en la línea nueva, el cruce y Q.
        S_4: 'cambio_plano_vertical(S, nueva, ref: S)'
        t_4: 'cambio_plano_vertical(Ti, nueva, ref: S)'
        C_4: 'cambio_plano_vertical(cruce, nueva, ref: S)'
        Q_4: 'cambio_plano_vertical(Q, nueva, ref: S)'
        # Donde las referencias de t′ y del cruce cortan la línea nueva: los
        # centros del compás.
        F_t: 'pie_perpendicular(proy_planta(Ti), nueva)'
        F_C: 'pie_perpendicular(proy_planta(cruce), nueva)'
        # Los extremos de las rectas largas de la construcción paso a paso: en el
        # papel se trazan más allá del punto que van a dar, y no paran en él.
        L_perpE: 'desplaza(T2i, dy: mm(-46))'
        L_tpd: 'desplaza(proy_alzado(G), dx: mm(2))'
        L_nueva_arr: 'desplaza(S4pos, dy: mm(-16))'
        L_nueva_ab: 'desplaza(S4pos, dy: mm(20))'
      comprueba:
        - en_plano(Td, cota_alta)
    pasos:
      - tipo: reconocer
        pregunta: ¿Qué distancia hay que comparar con los 3 m de la ley?
        opciones:
          - texto: La mínima entre el cable s y la recta que recorre el punto más alto del tren, que es t subida 4 m
            correcta: true
            mensaje: |
              Eso es. La ley habla del punto más alto, no de las ruedas: ese punto recorre una
              paralela a t, 4 m más arriba (40 mm en la lámina). Y «pasar a menos de 3 m» es la
              distancia mínima, la de la perpendicular común a esa recta y a s.
          - texto: La mínima entre s y t, y luego se le restan los 4 m del tren
            mensaje: |
              Restar no funciona: la perpendicular común de s y t no es vertical, y subir t 4 m no
              acorta la distancia 4 m. Hay que subir la recta primero y medir después.
          - texto: La que se mide en el alzado entre s₂ y t₂ subida 4 m, porque el alzado da las alturas y la ley habla de la separación en altura entre el tren y el cable
            mensaje: |
              El alzado da la diferencia de cotas, no la distancia: s y la recta del punto más
              alto se apartan también en alejamiento, y eso solo se ve en la planta. La distancia
              mínima mezcla las dos, y se mide en verdadera magnitud.

      - tipo: construir
        titulo: Los dos puntos más cercanos
        intro: |
          Traza t′₂, la paralela a t₂ 40 mm más arriba: es la recta del punto más alto del tren (t′₁
          es t₁). Como t va de izquierda a derecha, en una vista de perfil, o con un cambio de plano
          con la línea nueva perpendicular a t₁, t′ se ve como un punto: el pie de la perpendicular
          desde él a s es Q, y la perpendicular común es de perfil, así que P está en la vertical de
          Q. Marca Q y P en las dos vistas.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, borrar]
        tolerancia: 1
        objetivos:
          - nombre: Q1
            pide: el punto del cable más cercano, en la planta
            es: proy_planta(solucion.Q)
            bien: |
              Q₁ está en s₁, en la vertical por donde pasa la perpendicular común, que es de perfil.
            diagnosticos:
              - si: cerca_de(proy_planta(solucion.Q0))
                mensaje: |
                  Ese es el punto del cable más cercano a la **trayectoria** t, sin subirla. El punto
                  más alto del tren va 4 m más arriba, 40 mm en la lámina, y su punto más cercano del
                  cable está mucho más a la derecha.
                ejemplo: proy_planta(solucion.Q0)
              - si: cerca_de(proy_planta(solucion.cruce))
                mensaje: |
                  Ese es el punto de s que está a la misma altura que el punto más alto del tren,
                  donde s₂ cruza t′₂ en el alzado. Estar a la misma altura no es estar lo más cerca:
                  ahí s está lejos en alejamiento.
                ejemplo: proy_planta(solucion.cruce)
              - si: en_recta(figura.segmento("s1"))
                mensaje: |
                  Estás en s₁, pero no en el punto más cercano. En una vista de perfil (o con un
                  cambio de plano perpendicular a t₁), t′ es un punto: traza desde él la
                  perpendicular a s, y su pie, devuelto a s₁, es Q₁.
                ejemplo: proy_planta(punto_medio(segmento3(solucion.Q, solucion.cruce)))
              - si: siempre
                mensaje: |
                  Q₁ está en s₁: es el pie, en el cable, de la perpendicular común a s y a la recta
                  del punto más alto del tren.
          - nombre: Q2
            pide: el punto del cable más cercano, en el alzado
            es: proy_alzado(solucion.Q)
            bien: |
              Q₂ está en s₂, en la vertical de Q₁.
            diagnosticos:
              - si: cerca_de(proy_alzado(solucion.cruce))
                mensaje: |
                  Ese es donde s₂ cruza t′₂: en el alzado se cruzan, pero en el espacio no se tocan,
                  porque s va por delante. No es el punto más cercano.
                ejemplo: proy_alzado(solucion.cruce)
              - si: cerca_de(proy_alzado(solucion.Q0))
                mensaje: |
                  Ese es el punto del cable más cercano a t sin subirla 4 m.
                ejemplo: proy_alzado(solucion.Q0)
              - si: '!en_vertical_de(Q1)'
                mensaje: |
                  Q₂ va en la **vertical de Q₁**.
                ejemplo: proy_alzado(punto_medio(segmento3(solucion.Q, solucion.cruce)))
              - si: siempre
                mensaje: |
                  Q₂ va en s₂, porque Q está en el cable, y en la vertical de Q₁.
                ejemplo: 'desplaza(proy_alzado(solucion.Q), dy: mm(-6))'
          - nombre: P1
            pide: el punto más alto del tren en la situación más cercana, en la planta
            es: proy_planta(solucion.P)
            bien: |
              P₁ está en t₁, en la vertical de Q₁: la perpendicular común a una recta que va de
              izquierda a derecha es de perfil.
            diagnosticos:
              - si: cerca_de(proy_planta(solucion.P0))
                mensaje: |
                  Ese es el punto de t más cercano al cable sin subir los 4 m. Con la recta del punto
                  más alto, la situación más cercana es otra, en la vertical de Q₁.
                ejemplo: proy_planta(solucion.P0)
              - si: '!en_vertical_de(Q1)'
                mensaje: |
                  P va en la **vertical de Q₁**: t′ va de izquierda a derecha, y la perpendicular
                  común a ella es de perfil, así que P y Q tienen la misma vertical.
                ejemplo: proy_planta(punto_medio(segmento3(solucion.P, solucion.P0)))
              - si: siempre
                mensaje: |
                  P₁ va en t₁ (el punto más alto del tren tiene la misma planta que la trayectoria) y
                  en la vertical de Q₁.
                ejemplo: 'desplaza(proy_planta(solucion.P), dy: mm(6))'
          - nombre: P2
            pide: el punto más alto del tren en la situación más cercana, en el alzado
            es: proy_alzado(solucion.P)
            bien: |
              P₂ está en t′₂, 40 mm por encima de t₂, en la vertical de P₁ y de Q₁.
            diagnosticos:
              - si: en_recta(figura.segmento("t2"))
                mensaje: |
                  Estás en t₂, la trayectoria. El punto más alto del tren va 4 m por encima, 40 mm en
                  la lámina a 1:100: en la paralela a t₂ 40 mm más arriba.
                ejemplo: 'pie_perpendicular(proy_alzado(solucion.P), figura.segmento("t2"))'
              - si: '!en_vertical_de(P1)'
                mensaje: |
                  P₂ va en la **vertical de P₁**.
                ejemplo: proy_alzado(punto_medio(segmento3(solucion.P, Ti)))
              - si: siempre
                mensaje: |
                  P₂ va en t′₂, 40 mm por encima de t₂, y en la vertical de P₁.
                ejemplo: 'desplaza(proy_alzado(solucion.P), dy: mm(-6))'
        trazado:
          - 'segmento2(desplaza(punto_medio(figura.segmento("t2")), dx: -81.48, dy: mm(-40)), desplaza(punto_medio(figura.segmento("t2")), dx: 81.48, dy: mm(-40)))'
          - proy_alzado(segmento3(solucion.P, solucion.Q))
          - proy_planta(segmento3(solucion.P, solucion.Q))
        bloques:
          - nombre: Cambio de plano vertical
            explica: |
              El enunciado no dice cómo: aquí un [cambio de
              plano](/road-to-ingenieria/expresion-grafica/t03-metodos-descriptivos/#el-cambio-de-plano-una-vista-nueva)
              vertical pone de punta t′, la recta del punto más alto del tren, que es horizontal: la
              línea nueva va perpendicular a su planta, t₁, y la vista nueva es de perfil. La vista
              sale de la planta: cada punto va por su referencia, paralela a t₁, y se aparta de la
              línea nueva lo que su cota difiere de la de S, la referencia, que cae en ella; los que
              se usan, todos más bajos que S, hacia la planta. t′ se ve como un punto, t′₄, y el
              cable como una recta, s₄, que sale de dos puntos: S y C, el de s a la altura de t′.
              Con t′ de punta, la perpendicular común a t′ y a s es la perpendicular desde t′₄ a s₄,
              y se ve en verdadera magnitud: su pie, Q₄, es el punto del cable más cercano. Q vuelve
              a la planta por su referencia, hasta s₁.
        construccion:
          - con: escuadra-cartabon
            traza: segmento2(solucion.T2i, solucion.L_perpE)
            guia: figura.segmento("t2")
            porque: |
              El punto más alto del tren va 4 m por encima de su trayectoria: a escala 1:100, 40 mm por
              encima de t₂, con la misma planta. Para llevar esa distancia, por el extremo izquierdo de
              t₂, la perpendicular a t₂, con la escuadra apoyada en el cartabón, hacia arriba y larga,
              más allá de los 40 mm.
          - con: compas
            traza: 'arco(solucion.T2i, por: solucion.E2, desde: desplaza(solucion.E2, dx: -10), hasta: desplaza(solucion.E2, dx: 10))'
            porque: |
              Con el compás abierto a 40 mm, los 4 m del enunciado a escala, y el centro en el extremo
              de t₂, el arco sobre la perpendicular. La cortaría también por debajo de t₂; vale el corte
              de arriba, porque el punto más alto del tren va por encima de las ruedas.
          - con: marca
            traza: solucion.E2
            rotulo: E₂
            porque: |
              E₂, donde el arco corta la perpendicular: 40 mm por encima del extremo de t₂, un punto de
              la recta que recorre el punto más alto del tren. Es un nombre nuestro.
          - con: escuadra-cartabon
            traza: segmento2(solucion.E2, solucion.L_tpd)
            guia: figura.segmento("t2")
            rotulo: t′₂
            porque: |
              Por E₂, la **paralela a t₂**, deslizando la escuadra sobre el cartabón: es t′₂, el alzado
              de t′, la recta del punto más alto del tren. Su planta es t₁. Se traza hacia la derecha,
              hasta pasar la vertical del extremo derecho de s₂.
          - con: marca
            traza: proy_alzado(solucion.cruce)
            rotulo: C₂
            porque: |
              C₂, donde s₂ corta t′₂. C es el punto del cable que está a la altura de t′, y va a servir
              de segundo punto de s en la vista nueva; no es el más cercano, porque ahí el cable va por
              delante. Es un nombre nuestro.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(solucion.cruce), proy_planta(solucion.cruce))
            guia: figura.segmento("t2")
            porque: |
              Por C₂, su línea de referencia hasta s₁, porque C está en el cable.
          - con: marca
            traza: proy_planta(solucion.cruce)
            rotulo: C₁
            porque: |
              C₁, donde la vertical de C₂ corta s₁.
          - con: regla
            traza: segmento2(proy_alzado(solucion.S), proy_planta(solucion.S))
            bloque: Cambio de plano vertical
            porque: |
              Llamamos S al extremo derecho del cable, el punto más alto de los que se van a usar. Su
              línea de referencia, con la regla, del extremo de s₂ al de s₁. Corta t′₂.
          - con: marca
            traza: proy_alzado(solucion.G)
            rotulo: G₂
            bloque: Cambio de plano vertical
            porque: |
              G₂, donde la vertical de S corta t′₂. Lo que hay de S₂ a G₂ es lo que S está más alto que
              t′: se va a llevar con el compás. Es un nombre nuestro.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.S), solucion.S4pos)
            guia: figura.segmento("t1")
            bloque: Cambio de plano vertical
            porque: |
              **El cambio de plano**: con la línea nueva perpendicular a t₁, t′ queda de punta y la vista
              nueva es una vista de perfil. Las referencias van paralelas a t₁. Por S₁, la de S, hacia la
              izquierda, hasta el sitio de la línea nueva, que fijamos nosotros a la izquierda de la
              planta.
          - con: marca
            traza: solucion.S_4
            rotulo: S₄
            bloque: Cambio de plano vertical
            porque: |
              S₄, el extremo de la referencia de S: ahí va la línea nueva, y S es la referencia, así que S₄
              cae en ella. S es un nombre nuestro.
          - con: escuadra-cartabon
            traza: '[segmento2(solucion.S4pos, solucion.L_nueva_arr), segmento2(solucion.S4pos, solucion.L_nueva_ab)]'
            guia: figura.segmento("t1")
            bloque: Cambio de plano vertical
            porque: |
              Por S₄, la línea nueva, perpendicular a t₁, larga hacia arriba y hacia abajo. Cada punto
              irá en la vista nueva por su referencia, apartado de la línea nueva lo que está más alto o
              más bajo que S: hacia la planta, porque todos están más bajos.
          - con: regla
            traza: segmento2(solucion.T1i, solucion.F_t)
            bloque: Cambio de plano vertical
            porque: |
              Las referencias van paralelas a t₁, y la de t′ pasa por su planta, que es t₁: es la propia
              t₁. Se prolonga con la regla, desde su extremo izquierdo hasta la línea nueva.
          - con: compas
            traza: 'arco(solucion.F_t, por: solucion.t_4, desde: desplaza(solucion.t_4, dy: -10), hasta: desplaza(solucion.t_4, dy: 10))'
            toma: segmento2(proy_alzado(solucion.S), proy_alzado(solucion.G))
            bloque: Cambio de plano vertical
            porque: |
              Con el compás se toma de S₂ a G₂ lo que t′ está más baja que S, y se lleva desde la línea
              nueva sobre t₁. La circunferencia corta la recta de t₁ a los dos lados de la línea nueva;
              vale el corte de la derecha, hacia la planta, porque t′ está más baja que S.
          - con: marca
            traza: solucion.t_4
            rotulo: t′₄
            bloque: Cambio de plano vertical
            porque: |
              t′₄, donde el arco corta t₁: t′ vista de punta, como un punto. Cae sobre t₁ porque t₁ es su
              referencia. El punto P del tren, que está en t′, también cae aquí.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.cruce), solucion.F_C)
            guia: figura.segmento("t1")
            bloque: Cambio de plano vertical
            porque: |
              Por C₁, la referencia de C, paralela a t₁, hasta la línea nueva.
          - con: compas
            traza: 'arco(solucion.F_C, por: solucion.C_4, desde: desplaza(solucion.C_4, dy: -10), hasta: desplaza(solucion.C_4, dy: 10))'
            toma: segmento2(proy_alzado(solucion.S), proy_alzado(solucion.G))
            bloque: Cambio de plano vertical
            porque: |
              C está a la misma altura que t′, así que se aparta de la línea nueva lo mismo: con la misma
              abertura del compás, desde la línea nueva sobre la referencia de C. Vale el corte de la
              derecha, hacia la planta, como el de t′₄.
          - con: marca
            traza: solucion.C_4
            rotulo: C₄
            bloque: Cambio de plano vertical
            porque: |
              C₄, donde el arco corta la referencia de C: justo debajo de t′₄, porque C y t′ están a la
              misma altura.
          - con: regla
            traza: segmento2(solucion.S_4, solucion.C_4)
            bloque: Cambio de plano vertical
            porque: |
              S₄C₄ es el cable en la vista de perfil: s₄. Desde ahí, t′ es un punto y s una recta, y la
              distancia entre los dos se ve en verdadera magnitud.
          - con: escuadra-cartabon
            traza: segmento2(solucion.t_4, solucion.Q_4)
            guia: segmento2(solucion.S_4, solucion.C_4)
            bloque: Cambio de plano vertical
            porque: |
              La perpendicular común a t′ y a s es la **perpendicular desde t′₄ a s₄**: con t′ de punta,
              toda recta perpendicular a t′ se ve en verdadera magnitud. Con la escuadra apoyada en s₄,
              hasta cortarla.
          - con: marca
            traza: solucion.Q_4
            rotulo: Q₄
            bloque: Cambio de plano vertical
            porque: |
              Q₄, el pie de esa perpendicular en s₄: el punto del cable más cercano. t′₄Q₄ mide 24,2 mm,
              2,42 m a escala: menos de los 3 m de la ley.
          - con: escuadra-cartabon
            traza: segmento2(solucion.Q_4, proy_planta(solucion.Q))
            guia: figura.segmento("t1")
            bloque: Cambio de plano vertical
            porque: |
              Se vuelve a la planta por la referencia de Q₄, paralela a t₁, hasta s₁, porque Q está en el
              cable.
          - con: marca
            traza: proy_planta(solucion.Q)
            rotulo: Q₁
            bloque: Cambio de plano vertical
            porque: |
              Q₁, donde la referencia de Q₄ corta s₁.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.Q), proy_alzado(solucion.Q))
            guia: figura.segmento("t1")
            porque: |
              La perpendicular común es de perfil, perpendicular a t₁, así que P y Q tienen la misma
              vertical. Por Q₁, la línea de referencia hacia arriba, hasta s₂: corta t₁, t′₂ y s₂.
          - con: marca
            traza: proy_planta(solucion.P)
            rotulo: P₁
            porque: |
              P₁, donde la vertical de Q₁ corta t₁: el punto más alto del tren tiene la planta de la
              trayectoria.
          - con: marca
            traza: proy_alzado(solucion.P)
            rotulo: P₂
            porque: |
              P₂, donde la misma vertical corta t′₂, 40 mm por encima de t₂.
          - con: marca
            traza: proy_alzado(solucion.Q)
            rotulo: Q₂
            porque: |
              Q₂, donde la vertical corta s₂. P₂Q₂ y P₁Q₁ van en la misma vertical del papel, porque PQ
              es de perfil.
        pista: |
          (1) t′₂, la paralela a t₂ 40 mm más arriba. (2) Una vista de perfil: t′ se ve como un punto
          y s como una recta. (3) Desde el punto, la perpendicular a s: su pie es Q en esa vista. (4)
          Devuelve Q a s₁ y a s₂. (5) P, en la misma vertical, en t₁ y en t′₂.
        desarrollo: |
          En verde claro, t′₂ y la perpendicular común PQ en las dos vistas, vertical en el papel
          porque es de perfil. Su verdadera magnitud, en la vista de perfil, es 24,2 mm de la
          lámina: 2,42 m.

      - tipo: calcular
        titulo: La distancia del tren al cable
        pregunta: ¿A qué distancia pasa el punto más alto del tren del cable, en metros?
        respuesta:
          tipo: numero
          valor: '2.42'
          receta: distancia_m
          tolerancia: 0.1
          formato: un número, en metros
        distractores:
          - valor: '5.03'
            receta: en_mm(distancia_rectas(t, s)) / 10
            mensaje: |
              Esa es la distancia de la **trayectoria** al cable, sin subirla. La ley habla del
              punto más alto del tren, que va 4 m por encima: esa recta pasa más cerca.
          - valor: '1.03'
            receta: en_mm(distancia_rectas(t, s)) / 10 - 4
            mensaje: |
              Has restado los 4 m a la distancia de t a s. No vale: la perpendicular común no es
              vertical, y subir la recta 4 m no la acerca 4 m. Sube t primero y mide después.
          - valor: '1.83'
            receta: en_mm(vm_planta(solucion.P, solucion.Q)) / 10
            mensaje: |
              Eso es lo que mide **P₁Q₁ en la planta**: solo la diferencia de alejamientos. PQ es
              de perfil y no es horizontal; su verdadera magnitud junta esa diferencia y la de cotas.
          - valor: '1.58'
            receta: en_mm(vm_alzado(solucion.P, solucion.Q)) / 10
            mensaje: |
              Eso es lo que mide **P₂Q₂ en el alzado**: solo la diferencia de cotas. Falta la de
              alejamientos; la distancia es la hipotenusa.
          - valor: '24.17'
            receta: en_mm(distancia_rectas(t_alta, s))
            mensaje: |
              Eso es lo que mide en la lámina, en milímetros. El dibujo está a 1:100: cada
              milímetro son 0,1 m.
        pista: |
          En la vista de perfil, la distancia del punto t′ a la recta s está en verdadera magnitud.
          Mídela en mm y pásala a metros: a 1:100, divide entre 10.
        desarrollo: |
          En la vista de perfil, el punto t′ queda a 24,17 mm de la recta s; a escala 1:100:
          $$ d = 24{,}17 \text{ mm} \times 100 = 2417 \text{ mm} \approx 2{,}42 \text{ m} $$

      - tipo: reconocer
        pregunta: Con eso, ¿cumple la ley de seguridad?
        opciones:
          - texto: No; el punto más alto del tren pasa a menos de los 3 m que pide la ley
            correcta: true
            mensaje: |
              Eso es. 2,42 m es menos de 3 m: el tren no cumple. La situación más cercana es la de
              P y Q, en la misma vertical.
          - texto: Sí; pasa a más de los 3 m
            mensaje: |
              5,03 m es la distancia de la trayectoria, no la del punto más alto del tren. Con los
              4 m del tren, la distancia baja a 2,42 m, y no cumple.
          - texto: No; en el alzado s₂ corta a t′₂, así que el cable toca el tren
            mensaje: |
              Cortarse en el alzado no es tocarse: en ese punto s va por delante, a otro alejamiento.
              El cable no toca el tren, pero pasa a 2,42 m, y por eso no cumple.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: El punto más alto del tren recorre una paralela a t, 4 m más arriba, que a 1:100 son 40 mm por encima de t₂.
          - texto: t va de izquierda a derecha, paralela a las dos vistas; en una vista de perfil, la recta del punto más alto se ve como un punto.
          - texto: La distancia mínima es la de ese punto a la proyección de s en la vista de perfil, y la perpendicular común es de perfil, con P y Q en la misma vertical.
          - texto: Su verdadera magnitud, en la vista de perfil, es 24,2 mm de la lámina, 2,42 m de verdad, menos de 3 m, así que no cumple.
          - texto: Basta medir la distancia entre s y t y restarle los 4 m del tren.
            trampa: true
            mensaje: |
              La perpendicular común de s y t no es vertical, y restarle 4 m no da la distancia a la
              recta alta: saldría 1,03 m, y son 2,42.
    resolucion: |
      **Qué se compara.** La ley mira el punto más alto del tren, que va 4 m por encima de su
      trayectoria: recorre la paralela a t 4 m más arriba, 40 mm en la lámina a 1:100, con la misma
      planta que t. Hay que medir la distancia mínima de esa recta, t′, al cable s.

      **La perpendicular común.** t es horizontal y frontal a la vez: va de izquierda a derecha. En
      una vista de perfil (o con un cambio de plano con la línea nueva perpendicular a t₁), t′ se
      ve como un punto y s como una recta, y la distancia del punto a la recta está en verdadera
      magnitud. Su pie es Q, en el cable; la perpendicular común es de perfil, así que P, en t′,
      está en la misma vertical que Q.

      **La distancia.** Su verdadera magnitud, en la vista de perfil, es 24,17 mm de la lámina:
      2,42 m. Es menos de 3 m, y el tren **no
      cumple** la ley de seguridad. Sin subir los 4 m saldrían 5,03 m, y restándolos después,
      1,03 m: los dos están mal. P₁Q₁ y P₂Q₂ miden 1,83 y 1,58 m a escala: son sus proyecciones.
