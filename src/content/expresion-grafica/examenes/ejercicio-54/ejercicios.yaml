ejercicios:
  # ── 1 a · La pirámide atravesada por el prisma. Lo que enseña: elegir el
  #    plano auxiliar. Las aristas del prisma son horizontales, y el plano
  #    horizontal de cada una corta la pirámide en un cuadrado que la planta da
  #    sin deformar; las aristas VB y VD se buscan con su plano de canto, que
  #    corta el prisma en un triángulo pequeño. Y que una penetración da dos
  #    polígonos, no uno.
  - id: exeg-h54-1a-la-piramide-atravesada-por-el-prisma
    titulo: La pirámide atravesada por el prisma, y qué se ve de cada uno
    fuente: >-
      Ejercicio 54, apartado 1 a · Colección de ejercicios de Geometría
      Descriptiva, Sistema Diédrico Directo (EJERCICIO 54, págs. 61-63; el
      apartado 1, en las 61 y 62) · Dpto. de Expresión Gráfica y Proyectos de
      Ingeniería, EIG · UPV/EHU. Sin fecha: es uno de los cuatro ejercicios
      bilingües, del 52 al 55, con que cierra la colección, y el único que se
      titula «Examen» («Azterketa / Examen» en su enunciado, y cajetín de examen
      en sus láminas). Se transcribe el castellano; la figura se redibuja desde
      sus coordenadas.
    nivel: examen
    # Decisión: el castellano de la pág. 61 tal cual (casi toda es imagen: se ha
    # leído renderizada a 150 y a 300 ppp), con la cabecera del apartado 1 en las dos
    # piezas y sin su «1.» (el número lo dice la fuente, y un «1.» a principio de
    # línea el Markdown lo convierte en lista). «Los dos prismas» también va tal
    # cual, aunque la figura es una pirámide y un prisma: lo dicen las «Notas
    # nuestras», no una corrección dentro de la frase impresa.
    enunciado: |
      Dados los dos prismas, calcular gráficamente:

      a. Intersección entre los dos prismas.

      **Notas nuestras.** La figura es la primera lámina del Ejercicio 54: el alzado arriba y
      la planta abajo. Aunque el enunciado dice «los dos prismas» (y el euskera, «Bi
      prisma»), es una pirámide y un prisma. La pirámide es regular: la base ABCD es un
      cuadrado horizontal de 50 mm de lado, y el vértice V está 100 mm por encima de su
      centro, medidos en la lámina (5 m y 10 m a la escala del cajetín). La lámina solo
      rotula A, B y V; llamamos C al vértice de atrás de la base (su arista VC va en
      discontinua en el alzado) y D al de la derecha. El prisma es de base triangular, con las
      tres aristas horizontales: las llamamos e (la de arriba), f (la de en medio, que es la
      de delante) y g (la de abajo), y a sus extremos, E, F y G a la izquierda y E′, F′ y G′
      a la derecha, cada uno en su arista. La lámina dibuja los dos extremos y solo el
      arranque de cada arista: el resto lo completas tú. Los puntos de la intersección
      también llevan nombres nuestros: H, J, K, L y M por donde entra el prisma, del lado de
      B, y N, P, Q, R y T por donde sale, del lado de D. La escala 1:100 del cajetín aquí no
      cambia nada: se piden puntos, no medidas.
    pide: Los diez puntos donde se cortan la pirámide y el prisma, en las dos vistas, y qué se ve y qué se oculta de los dos polígonos de la intersección y de las aristas.
    receta:
      lamina: ex54-1
      escena:
        V: 'punto3(alzado: figura.punto("V2"), planta: figura.punto("V1"))'
        A: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("A1"))'
        B: 'punto3(alzado: figura.punto("B2"), planta: figura.punto("B1"))'
        C: 'punto3(alzado: figura.punto("C2"), planta: figura.punto("C1"))'
        D: 'punto3(alzado: figura.punto("D2"), planta: figura.punto("D1"))'
        E: 'punto3(alzado: figura.punto("E2"), planta: figura.punto("E1"))'
        F: 'punto3(alzado: figura.punto("F2"), planta: figura.punto("F1"))'
        G: 'punto3(alzado: figura.punto("G2"), planta: figura.punto("G1"))'
        Ep: 'punto3(alzado: figura.punto("E2p"), planta: figura.punto("E1p"))'
        Fp: 'punto3(alzado: figura.punto("F2p"), planta: figura.punto("F1p"))'
        Gp: 'punto3(alzado: figura.punto("G2p"), planta: figura.punto("G1p"))'
        # Las aristas del prisma, de un extremo al otro: los arranques de la lámina
        # son cortos y su pendiente baila un cuanto de 0,12 pt.
        e: segmento3(E, Ep)
        f: segmento3(F, Fp)
        g: segmento3(G, Gp)
        cara_VAB: plano(V, A, B)
        cara_VBC: plano(V, B, C)
        cara_VCD: plano(V, C, D)
        cara_VDA: plano(V, D, A)
        cara_ef: plano(E, F, Ep)
        cara_fg: plano(F, G, Fp)
        # El centro de la base, debajo de V: VO es vertical, y da los planos
        # horizontales de las aristas del prisma.
        O: 'punto3(alzado: pie_perpendicular(figura.punto("V2"), figura.segmento("base2")), planta: figura.punto("V1"))'
      solucion:
        # Los diez puntos: cada arista del prisma contra dos caras de la pirámide,
        # y VB y VD contra las caras ef y fg del prisma.
        H: corte_recta_plano(e, cara_VBC)
        N: corte_recta_plano(e, cara_VCD)
        K: corte_recta_plano(f, cara_VAB)
        Q: corte_recta_plano(f, cara_VDA)
        M: corte_recta_plano(g, cara_VBC)
        T: corte_recta_plano(g, cara_VCD)
        J: corte_recta_plano(segmento3(V, B), cara_ef)
        L: corte_recta_plano(segmento3(V, B), cara_fg)
        P: corte_recta_plano(segmento3(V, D), cara_ef)
        R: corte_recta_plano(segmento3(V, D), cara_fg)
        # La construcción de los seis primeros: el plano horizontal de cada arista
        # corta las aristas laterales en los vértices de un cuadrado.
        horizontal_e: plano_perpendicular_a_recta(E, segmento3(V, O))
        horizontal_f: plano_perpendicular_a_recta(F, segmento3(V, O))
        horizontal_g: plano_perpendicular_a_recta(G, segmento3(V, O))
        Ae: corte_recta_plano(segmento3(V, A), horizontal_e)
        Be: corte_recta_plano(segmento3(V, B), horizontal_e)
        Ce: corte_recta_plano(segmento3(V, C), horizontal_e)
        De: corte_recta_plano(segmento3(V, D), horizontal_e)
        Af: corte_recta_plano(segmento3(V, A), horizontal_f)
        Bf: corte_recta_plano(segmento3(V, B), horizontal_f)
        Cf: corte_recta_plano(segmento3(V, C), horizontal_f)
        Df: corte_recta_plano(segmento3(V, D), horizontal_f)
        Ag: corte_recta_plano(segmento3(V, A), horizontal_g)
        Bg: corte_recta_plano(segmento3(V, B), horizontal_g)
        Cg: corte_recta_plano(segmento3(V, C), horizontal_g)
        Dg: corte_recta_plano(segmento3(V, D), horizontal_g)
        # La de los cuatro últimos: el plano de canto (perpendicular al alzado)
        # que contiene VB, o VD, corta las aristas del prisma en los vértices de
        # un triángulo. Vy es V corrido hacia delante: da la dirección de canto.
        Vy: 'punto3(alzado: figura.punto("V2"), planta: desplaza(figura.punto("V1"), dy: mm(20)))'
        canto_VB: plano(V, B, Vy)
        canto_VD: plano(V, D, Vy)
        TeB: corte_recta_plano(e, canto_VB)
        TfB: corte_recta_plano(f, canto_VB)
        TgB: corte_recta_plano(g, canto_VB)
        TeD: corte_recta_plano(e, canto_VD)
        TfD: corte_recta_plano(f, canto_VD)
        TgD: corte_recta_plano(g, canto_VD)
        # Los errores de tomar el contorno de la base, en la planta, por el de la
        # pirámide a la altura de la arista: el plano vertical de cada lado de la
        # base. Como la base es un cuadrado, el de BC es el perpendicular a AB por B.
        vertical_AB: plano_perpendicular_a_recta(A, segmento3(A, D))
        vertical_BC: plano_perpendicular_a_recta(B, segmento3(B, A))
        vertical_CD: plano_perpendicular_a_recta(C, segmento3(C, B))
        vertical_DA: plano_perpendicular_a_recta(D, segmento3(D, C))
      comprueba:
        - en_plano(D, plano(A, B, C))
        - en_plano(Fp, plano(E, Ep, F))
        - en_plano(Gp, plano(F, Fp, G))
    pasos:
      - tipo: reconocer
        pregunta: e₂, f₂ y g₂ son horizontales en el alzado. ¿Cómo se buscan los puntos donde cada arista del prisma entra en la pirámide y sale de ella?
        opciones:
          - texto: Con el plano horizontal de la arista, que corta la pirámide en un cuadrado; la planta de la arista corta ese cuadrado en los dos puntos
            correcta: true
            mensaje: |
              Eso es. Las tres aristas son horizontales, así que cada una está en un plano
              horizontal. Ese plano corta las cuatro aristas laterales a la altura de la arista,
              y los cuatro puntos, bajados a la planta, forman un cuadrado con el centro en V₁:
              la sección de la pirámide, sin deformar. Donde la planta de la arista lo corta
              están la entrada y la salida, que luego se suben al alzado.
          - texto: Donde e₂, f₂ y g₂ cruzan V₂B₂ y V₂D₂, el contorno de la pirámide en el alzado
            mensaje: |
              Cruzarse en el alzado no es cortarse: la arista puede pasar por delante o por
              detrás de la pirámide sin tocarla. e, por ejemplo, cruza V₂B₂ 10,6 mm por detrás
              de VB, y entra en la pirámide más a la derecha, por la cara de atrás, VBC. Un corte
              tiene que cuadrar en las dos vistas.
          - texto: Con el plano horizontal de la arista, cortando su planta con la base A₁B₁C₁D₁
            mensaje: |
              El plano es el bueno, pero la sección no es la base. A la altura de la arista la
              pirámide es más estrecha: el plano corta VA, VB, VC y VD más arriba, y el
              cuadrado que forman en la planta es más pequeño que A₁B₁C₁D₁, con el mismo centro.
              La base solo vale para lo que está a su altura.

      - tipo: construir
        titulo: Dónde entran y salen las aristas del prisma
        intro: |
          Marca los dos cortes de cada arista del prisma con la pirámide: H y N en e, K y Q en f,
          M y T en g; H, K y M son los de la izquierda, del lado de B. Las aristas solo están
          empezadas: complétalas de un extremo al otro. El plano horizontal de cada arista corta
          VA, VB, VC y VD a su altura; bájalos a la planta y únelos, que forman un cuadrado. La
          planta de la arista corta ese cuadrado en sus dos puntos, y se suben al alzado.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, medir, borrar]
        tolerancia: 1
        objetivos:
          - nombre: H1
            pide: la entrada de la arista e, en la planta
            es: proy_planta(solucion.H)
            bien: |
              H₁ está en e₁, donde corta el lado del cuadrado que cae en la cara VBC. Ese cuadrado
              es la sección de la pirámide por el plano horizontal de e: tiene el centro en V₁ y
              los vértices en V₁A₁, V₁B₁, V₁C₁ y V₁D₁.
            diagnosticos:
              - si: 'en_recta(figura.segmento("BC1")) && en_recta(proy_planta(e))'
                mensaje: |
                  Estás donde e₁ corta B₁C₁, el contorno de la base. Ese sería el corte si e
                  estuviera a la altura de la base, y va mucho más arriba, donde la pirámide es
                  más estrecha. Corta con el plano horizontal de e: sus cortes con las aristas
                  laterales, bajados a la planta, dan un cuadrado más pequeño, y e₁ lo corta más
                  adentro.
                ejemplo: proy_planta(corte_recta_plano(e, solucion.vertical_BC))
              - si: cerca_de(proy_planta(solucion.N))
                mensaje: |
                  Ese es N₁, el otro corte de e, por donde sale del lado de D. H es el de la
                  entrada, en la cara VBC.
                ejemplo: proy_planta(solucion.N)
              - si: en_recta(proy_planta(e))
                mensaje: |
                  Estás en e₁, pero no en el corte. El plano horizontal de e corta VA, VB, VC y VD
                  a la altura de e₂; baja esos cuatro puntos a la planta y únelos: H₁ es donde e₁
                  corta el lado del cuadrado que va de la arista VB a la VC.
                ejemplo: proy_planta(punto_medio(segmento3(solucion.H, solucion.N)))
              - si: siempre
                mensaje: |
                  H₁ está en e₁, la planta de la arista de arriba del prisma, donde corta el
                  cuadrado de la sección horizontal de la pirámide a la altura de e.
          - nombre: H2
            pide: la entrada de la arista e, en el alzado
            es: proy_alzado(solucion.H)
            bien: |
              H₂ está en e₂, en la vertical de H₁, y queda dentro del contorno de la pirámide.
            diagnosticos:
              - si: cerca_de(proy_alzado(solucion.Be))
                mensaje: |
                  Ese es el punto donde e₂ cruza V₂B₂, el contorno de la pirámide en el alzado.
                  Cruzarse en una vista no es cortarse: ahí e pasa 10,6 mm por detrás de VB. El
                  corte está en la vertical de H₁, más a la derecha.
                ejemplo: proy_alzado(solucion.Be)
              - si: '!en_vertical_de(H1)'
                mensaje: |
                  H₂ va en la vertical de H₁: es el mismo punto visto desde delante. Sube H₁
                  hasta e₂.
                ejemplo: proy_alzado(punto_medio(segmento3(solucion.H, solucion.N)))
              - si: siempre
                mensaje: |
                  Está en la vertical de H₁, pero no en e₂. H está en la arista e, que es
                  horizontal: H₂ va a la altura de e₂.
                ejemplo: 'desplaza(proy_alzado(solucion.H), dy: mm(-6))'
          - nombre: N1
            pide: la salida de la arista e, en la planta
            es: proy_planta(solucion.N)
            bien: |
              N₁ está en e₁, donde corta el lado del mismo cuadrado que cae en la cara VCD.
            diagnosticos:
              - si: 'en_recta(figura.segmento("CD1")) && en_recta(proy_planta(e))'
                mensaje: |
                  Estás donde e₁ corta C₁D₁, el contorno de la base. A la altura de e la pirámide
                  es más estrecha: el corte está en el cuadrado de la sección horizontal de e, que
                  es más pequeño y tiene el mismo centro.
                ejemplo: proy_planta(corte_recta_plano(e, solucion.vertical_CD))
              - si: cerca_de(proy_planta(solucion.H))
                mensaje: |
                  Ese es H₁, por donde entra e del lado de B. N es la salida, en la cara VCD.
                ejemplo: proy_planta(solucion.H)
              - si: en_recta(proy_planta(e))
                mensaje: |
                  Estás en e₁, pero no en el corte. N₁ es donde e₁ corta el lado del cuadrado de la
                  sección horizontal de e que va de la arista VC a la VD.
                ejemplo: proy_planta(punto_medio(segmento3(solucion.H, solucion.N)))
              - si: siempre
                mensaje: |
                  N₁ está en e₁, donde sale del cuadrado de la sección horizontal de la pirámide a
                  la altura de e.
          - nombre: N2
            pide: la salida de la arista e, en el alzado
            es: proy_alzado(solucion.N)
            bien: |
              N₂ está en e₂, en la vertical de N₁.
            diagnosticos:
              - si: cerca_de(proy_alzado(solucion.De))
                mensaje: |
                  Ese es el punto donde e₂ cruza V₂D₂, el contorno de la pirámide. Ahí e pasa
                  4,2 mm por detrás de VD, sin tocarla. El corte está en la vertical de N₁, un poco
                  más a la izquierda.
                ejemplo: proy_alzado(solucion.De)
              - si: '!en_vertical_de(N1)'
                mensaje: |
                  N₂ va en la vertical de N₁. Sube N₁ hasta e₂.
                ejemplo: proy_alzado(punto_medio(segmento3(solucion.H, solucion.N)))
              - si: siempre
                mensaje: |
                  Está en la vertical de N₁, pero no en e₂: N₂ va a la altura de e₂.
                ejemplo: 'desplaza(proy_alzado(solucion.N), dy: mm(-6))'
          - nombre: K1
            pide: la entrada de la arista f, en la planta
            es: proy_planta(solucion.K)
            bien: |
              K₁ está en f₁, donde corta el lado del cuadrado de la sección horizontal de f que
              cae en la cara VAB. Ese cuadrado es mayor que el de e, porque f va más baja.
            diagnosticos:
              - si: 'en_recta(figura.segmento("AB1")) && en_recta(proy_planta(f))'
                mensaje: |
                  Estás donde f₁ corta A₁B₁, el contorno de la base. f va por encima de la base, y
                  a su altura la pirámide es más estrecha: corta con el plano horizontal de f, y
                  usa el cuadrado de esa sección.
                ejemplo: proy_planta(corte_recta_plano(f, solucion.vertical_AB))
              - si: cerca_de(proy_planta(solucion.Q))
                mensaje: |
                  Ese es Q₁, el otro corte de f, por donde sale del lado de D. K es la entrada, en
                  la cara VAB.
                ejemplo: proy_planta(solucion.Q)
              - si: en_recta(proy_planta(f))
                mensaje: |
                  Estás en f₁, pero no en el corte. El plano horizontal de f corta las aristas
                  laterales a la altura de f₂; bajados a la planta, dan un cuadrado, y K₁ es donde
                  f₁ corta su lado de la arista VA a la VB.
                ejemplo: proy_planta(punto_medio(segmento3(solucion.K, solucion.Q)))
              - si: siempre
                mensaje: |
                  K₁ está en f₁, la planta de la arista de en medio, donde entra en el cuadrado de
                  la sección horizontal de la pirámide a la altura de f.
          - nombre: K2
            pide: la entrada de la arista f, en el alzado
            es: proy_alzado(solucion.K)
            bien: |
              K₂ está en f₂, en la vertical de K₁.
            diagnosticos:
              - si: cerca_de(proy_alzado(solucion.Bf))
                mensaje: |
                  Ese es el punto donde f₂ cruza V₂B₂, el contorno de la pirámide. Ahí f pasa
                  9,9 mm por delante de VB, sin tocarla. El corte está en la vertical de K₁.
                ejemplo: proy_alzado(solucion.Bf)
              - si: '!en_vertical_de(K1)'
                mensaje: |
                  K₂ va en la vertical de K₁. Sube K₁ hasta f₂.
                ejemplo: proy_alzado(punto_medio(segmento3(solucion.K, solucion.Q)))
              - si: siempre
                mensaje: |
                  Está en la vertical de K₁, pero no en f₂: K₂ va a la altura de f₂.
                ejemplo: 'desplaza(proy_alzado(solucion.K), dy: mm(-6))'
          - nombre: Q1
            pide: la salida de la arista f, en la planta
            es: proy_planta(solucion.Q)
            bien: |
              Q₁ está en f₁, donde corta el lado del cuadrado de la sección horizontal de f que
              cae en la cara VDA.
            diagnosticos:
              - si: 'en_recta(figura.segmento("DA1")) && en_recta(proy_planta(f))'
                mensaje: |
                  Estás donde f₁ corta D₁A₁, el contorno de la base. A la altura de f la pirámide
                  es más estrecha: el corte está en el cuadrado de la sección horizontal de f.
                ejemplo: proy_planta(corte_recta_plano(f, solucion.vertical_DA))
              - si: cerca_de(proy_planta(solucion.K))
                mensaje: |
                  Ese es K₁, por donde entra f del lado de B. Q es la salida, en la cara VDA.
                ejemplo: proy_planta(solucion.K)
              - si: en_recta(proy_planta(f))
                mensaje: |
                  Estás en f₁, pero no en el corte. Q₁ es donde f₁ corta el lado del cuadrado de
                  la sección horizontal de f que va de la arista VD a la VA.
                ejemplo: proy_planta(punto_medio(segmento3(solucion.K, solucion.Q)))
              - si: siempre
                mensaje: |
                  Q₁ está en f₁, donde sale del cuadrado de la sección horizontal de la pirámide a
                  la altura de f.
          - nombre: Q2
            pide: la salida de la arista f, en el alzado
            es: proy_alzado(solucion.Q)
            bien: |
              Q₂ está en f₂, en la vertical de Q₁.
            diagnosticos:
              - si: cerca_de(proy_alzado(solucion.Df))
                mensaje: |
                  Ese es el punto donde f₂ cruza V₂D₂, el contorno de la pirámide. Ahí f pasa
                  18,4 mm por delante de VD. El corte está en la vertical de Q₁, mucho más a la
                  izquierda.
                ejemplo: proy_alzado(solucion.Df)
              - si: '!en_vertical_de(Q1)'
                mensaje: |
                  Q₂ va en la vertical de Q₁. Sube Q₁ hasta f₂.
                ejemplo: proy_alzado(punto_medio(segmento3(solucion.K, solucion.Q)))
              - si: siempre
                mensaje: |
                  Está en la vertical de Q₁, pero no en f₂: Q₂ va a la altura de f₂.
                ejemplo: 'desplaza(proy_alzado(solucion.Q), dy: mm(-6))'
          - nombre: M1
            pide: la entrada de la arista g, en la planta
            es: proy_planta(solucion.M)
            bien: |
              M₁ está en g₁, donde corta el lado del cuadrado de la sección horizontal de g que
              cae en la cara VBC. Es el mayor de los tres cuadrados: g es la arista más baja.
            diagnosticos:
              - si: 'en_recta(figura.segmento("BC1")) && en_recta(proy_planta(g))'
                mensaje: |
                  Estás donde g₁ corta B₁C₁, el contorno de la base. g va por encima de la base:
                  corta con su plano horizontal y usa el cuadrado de esa sección, que es más
                  pequeño.
                ejemplo: proy_planta(corte_recta_plano(g, solucion.vertical_BC))
              - si: cerca_de(proy_planta(solucion.T))
                mensaje: |
                  Ese es T₁, el otro corte de g, por donde sale del lado de D. M es la entrada, en
                  la cara VBC.
                ejemplo: proy_planta(solucion.T)
              - si: en_recta(proy_planta(g))
                mensaje: |
                  Estás en g₁, pero no en el corte. M₁ es donde g₁ corta el lado del cuadrado de
                  la sección horizontal de g que va de la arista VB a la VC.
                ejemplo: proy_planta(punto_medio(segmento3(solucion.M, solucion.T)))
              - si: siempre
                mensaje: |
                  M₁ está en g₁, la planta de la arista de abajo, donde entra en el cuadrado de la
                  sección horizontal de la pirámide a la altura de g.
          - nombre: M2
            pide: la entrada de la arista g, en el alzado
            es: proy_alzado(solucion.M)
            bien: |
              M₂ está en g₂, en la vertical de M₁.
            diagnosticos:
              - si: cerca_de(proy_alzado(solucion.Bg))
                mensaje: |
                  Ese es el punto donde g₂ cruza V₂B₂, el contorno de la pirámide. Ahí g pasa
                  16,4 mm por detrás de VB. El corte está en la vertical de M₁, más a la derecha.
                ejemplo: proy_alzado(solucion.Bg)
              - si: '!en_vertical_de(M1)'
                mensaje: |
                  M₂ va en la vertical de M₁. Sube M₁ hasta g₂.
                ejemplo: proy_alzado(punto_medio(segmento3(solucion.M, solucion.T)))
              - si: siempre
                mensaje: |
                  Está en la vertical de M₁, pero no en g₂: M₂ va a la altura de g₂.
                ejemplo: 'desplaza(proy_alzado(solucion.M), dy: mm(-6))'
          - nombre: T1
            pide: la salida de la arista g, en la planta
            es: proy_planta(solucion.T)
            bien: |
              T₁ está en g₁, donde corta el lado del cuadrado de la sección horizontal de g que
              cae en la cara VCD.
            diagnosticos:
              - si: 'en_recta(figura.segmento("CD1")) && en_recta(proy_planta(g))'
                mensaje: |
                  Estás donde g₁ corta C₁D₁, el contorno de la base. A la altura de g la pirámide
                  es más estrecha: el corte está en el cuadrado de su sección horizontal.
                ejemplo: proy_planta(corte_recta_plano(g, solucion.vertical_CD))
              - si: cerca_de(proy_planta(solucion.M))
                mensaje: |
                  Ese es M₁, por donde entra g del lado de B. T es la salida, en la cara VCD.
                ejemplo: proy_planta(solucion.M)
              - si: en_recta(proy_planta(g))
                mensaje: |
                  Estás en g₁, pero no en el corte. T₁ es donde g₁ corta el lado del cuadrado de
                  la sección horizontal de g que va de la arista VC a la VD.
                ejemplo: proy_planta(punto_medio(segmento3(solucion.M, solucion.T)))
              - si: siempre
                mensaje: |
                  T₁ está en g₁, donde sale del cuadrado de la sección horizontal de la pirámide a
                  la altura de g.
          - nombre: T2
            pide: la salida de la arista g, en el alzado
            es: proy_alzado(solucion.T)
            bien: |
              T₂ está en g₂, en la vertical de T₁.
            diagnosticos:
              - si: cerca_de(proy_alzado(solucion.Dg))
                mensaje: |
                  Ese es el punto donde g₂ cruza V₂D₂, el contorno de la pirámide. Ahí g pasa
                  6,6 mm por detrás de VD. El corte está en la vertical de T₁, a la izquierda.
                ejemplo: proy_alzado(solucion.Dg)
              - si: '!en_vertical_de(T1)'
                mensaje: |
                  T₂ va en la vertical de T₁. Sube T₁ hasta g₂.
                ejemplo: proy_alzado(punto_medio(segmento3(solucion.M, solucion.T)))
              - si: siempre
                mensaje: |
                  Está en la vertical de T₁, pero no en g₂: T₂ va a la altura de g₂.
                ejemplo: 'desplaza(proy_alzado(solucion.T), dy: mm(-6))'
        trazado:
          - proy_alzado(e)
          - proy_alzado(f)
          - proy_alzado(g)
          - proy_planta(e)
          - proy_planta(f)
          - proy_planta(g)
          - 'proy_planta([segmento3(solucion.Ae, solucion.Be), segmento3(solucion.Be, solucion.Ce), segmento3(solucion.Ce, solucion.De), segmento3(solucion.De, solucion.Ae)])'
          - 'proy_planta([segmento3(solucion.Af, solucion.Bf), segmento3(solucion.Bf, solucion.Cf), segmento3(solucion.Cf, solucion.Df), segmento3(solucion.Df, solucion.Af)])'
          - 'proy_planta([segmento3(solucion.Ag, solucion.Bg), segmento3(solucion.Bg, solucion.Cg), segmento3(solucion.Cg, solucion.Dg), segmento3(solucion.Dg, solucion.Ag)])'
        pista: |
          (1) En el alzado, la horizontal de e₂ corta V₂A₂, V₂B₂, V₂C₂ y V₂D₂. (2) Baja esos cuatro
          puntos a la planta, cada uno a su arista, y únelos: es un cuadrado con el centro en V₁.
          (3) e₁ lo corta en H₁ y en N₁; súbelos a e₂. (4) Lo mismo con f y con g, cada una con su
          cuadrado.
        desarrollo: |
          En verde claro, las aristas del prisma completas y, en la planta, los tres cuadrados de
          las secciones horizontales: el de e, el más pequeño, con 23,7 mm de lado; el de f, con
          31,5 mm, y el de g, con 36,0 mm. Cada arista entra por la izquierda y sale por la
          derecha: e y g por las caras de atrás, VBC y VCD; f por las de delante, VAB y VDA.

      - tipo: construir
        titulo: Dónde atraviesan el prisma las aristas VB y VD
        intro: |
          VB y VD son las dos aristas de la pirámide que atraviesan el prisma: entran por la cara
          de arriba, la de e a f, y salen por la de abajo, la de f a g. J y L son los cortes de
          VB; P y R, los de VD. El plano de canto que contiene VB (en el alzado, la propia
          V₂B₂) corta e₂, f₂ y g₂ en tres puntos; bajados a e₁, f₁ y g₁, forman un triángulo, y
          V₁B₁ corta dos de sus lados en J₁ y L₁, que se suben a V₂B₂. Con VD, igual.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, medir, borrar]
        tolerancia: 1
        objetivos:
          - nombre: J1
            pide: el corte de VB con la cara ef del prisma, en la planta
            es: proy_planta(solucion.J)
            bien: |
              J₁ está en V₁B₁, donde la corta el lado de e a f del triángulo que el plano de canto
              de VB corta en el prisma.
            diagnosticos:
              - si: 'cerca_de([proy_planta(solucion.TeB), proy_planta(solucion.TfB), proy_planta(solucion.TgB)])'
                mensaje: |
                  Ese es un vértice del triángulo auxiliar: donde el plano de canto de VB corta una
                  arista del prisma. Los cortes de VB están en los lados del triángulo, donde los
                  cruza V₁B₁.
                ejemplo: proy_planta(solucion.TeB)
              - si: cerca_de(proy_planta(solucion.L))
                mensaje: |
                  Ese es L₁, el otro corte de VB, el de la cara de f a g. J es el de la cara de
                  arriba, de e a f.
                ejemplo: proy_planta(solucion.L)
              - si: cerca_de(proy_planta(solucion.P))
                mensaje: |
                  Ese es P₁, el corte de VD con la cara de arriba, no el de VB: está en V₁D₁, al
                  otro lado de V₁. J es el corte de VB con esa misma cara, en V₁B₁.
                ejemplo: proy_planta(solucion.P)
              - si: en_segmento(figura.segmento("VB1"))
                mensaje: |
                  Estás en V₁B₁, pero no en el corte. Baja a la planta los tres puntos donde V₂B₂
                  cruza e₂, f₂ y g₂, cada uno a su arista: forman un triángulo, y J₁ es donde V₁B₁
                  corta su lado de e a f.
                ejemplo: proy_planta(punto_medio(segmento3(solucion.J, V)))
              - si: siempre
                mensaje: |
                  J₁ está en V₁B₁, la planta de la arista VB, donde la corta el lado de e a f del
                  triángulo del plano de canto.
          - nombre: J2
            pide: el corte de VB con la cara ef del prisma, en el alzado
            es: proy_alzado(solucion.J)
            bien: |
              J₂ está en V₂B₂, en la vertical de J₁, entre e₂ y f₂.
            diagnosticos:
              - si: 'cerca_de([proy_alzado(solucion.TeB), proy_alzado(solucion.TfB), proy_alzado(solucion.TgB)])'
                mensaje: |
                  Ese es un cruce de V₂B₂ con e₂, f₂ o g₂: en el alzado se cruzan, pero en el
                  espacio no se tocan. Es un vértice del triángulo auxiliar, no el corte. J₂ está
                  en V₂B₂, en la vertical de J₁.
                ejemplo: proy_alzado(solucion.TeB)
              - si: '!en_vertical_de(J1)'
                mensaje: |
                  J₂ va en la vertical de J₁, sobre V₂B₂. Sube J₁ hasta V₂B₂.
                ejemplo: proy_alzado(punto_medio(segmento3(solucion.J, V)))
              - si: siempre
                mensaje: |
                  Está en la vertical de J₁, pero no en V₂B₂: J está en la arista VB.
                ejemplo: 'desplaza(proy_alzado(solucion.J), dy: mm(-8))'
          - nombre: L1
            pide: el corte de VB con la cara fg del prisma, en la planta
            es: proy_planta(solucion.L)
            bien: |
              L₁ está en V₁B₁, donde la corta el lado de f a g del triángulo del plano de canto
              de VB.
            diagnosticos:
              - si: 'cerca_de([proy_planta(solucion.TeB), proy_planta(solucion.TfB), proy_planta(solucion.TgB)])'
                mensaje: |
                  Ese es un vértice del triángulo auxiliar, donde el plano de canto de VB corta una
                  arista del prisma. L₁ está en un lado del triángulo, el de f a g, donde lo cruza
                  V₁B₁.
                ejemplo: proy_planta(solucion.TfB)
              - si: cerca_de(proy_planta(solucion.J))
                mensaje: |
                  Ese es J₁, el corte de VB con la cara de arriba. L es el de la cara de abajo, de f
                  a g, más cerca de B₁.
                ejemplo: proy_planta(solucion.J)
              - si: cerca_de(proy_planta(solucion.R))
                mensaje: |
                  Ese es R₁, el corte de VD con la cara de abajo, no el de VB: está en V₁D₁, al
                  otro lado de V₁. L es el corte de VB con esa misma cara, en V₁B₁.
                ejemplo: proy_planta(solucion.R)
              - si: en_segmento(figura.segmento("VB1"))
                mensaje: |
                  Estás en V₁B₁, pero no en el corte. L₁ es donde V₁B₁ corta el lado de f a g del
                  triángulo que forman, en la planta, los cruces de V₂B₂ con e₂, f₂ y g₂ bajados a
                  sus aristas.
                ejemplo: proy_planta(punto_medio(segmento3(solucion.L, B)))
              - si: siempre
                mensaje: |
                  L₁ está en V₁B₁, donde la corta el lado de f a g del triángulo del plano de canto.
          - nombre: L2
            pide: el corte de VB con la cara fg del prisma, en el alzado
            es: proy_alzado(solucion.L)
            bien: |
              L₂ está en V₂B₂, en la vertical de L₁, entre f₂ y g₂.
            diagnosticos:
              - si: 'cerca_de([proy_alzado(solucion.TeB), proy_alzado(solucion.TfB), proy_alzado(solucion.TgB)])'
                mensaje: |
                  Ese es un cruce de V₂B₂ con una arista del prisma en el alzado: no es un corte, es
                  un vértice del triángulo auxiliar. L₂ está en V₂B₂, en la vertical de L₁.
                ejemplo: proy_alzado(solucion.TfB)
              - si: '!en_vertical_de(L1)'
                mensaje: |
                  L₂ va en la vertical de L₁, sobre V₂B₂.
                ejemplo: proy_alzado(punto_medio(segmento3(solucion.L, B)))
              - si: siempre
                mensaje: |
                  Está en la vertical de L₁, pero no en V₂B₂: L está en la arista VB.
                ejemplo: 'desplaza(proy_alzado(solucion.L), dy: mm(-8))'
          - nombre: P1
            pide: el corte de VD con la cara ef del prisma, en la planta
            es: proy_planta(solucion.P)
            bien: |
              P₁ está en V₁D₁, donde la corta el lado de e a f del triángulo que el plano de canto
              de VD corta en el prisma.
            diagnosticos:
              - si: 'cerca_de([proy_planta(solucion.TeD), proy_planta(solucion.TfD), proy_planta(solucion.TgD)])'
                mensaje: |
                  Ese es un vértice del triángulo auxiliar: donde el plano de canto de VD corta una
                  arista del prisma. P₁ está en un lado del triángulo, el de e a f, donde lo cruza
                  V₁D₁.
                ejemplo: proy_planta(solucion.TeD)
              - si: cerca_de(proy_planta(solucion.R))
                mensaje: |
                  Ese es R₁, el otro corte de VD, el de la cara de f a g. P es el de la cara de
                  arriba, de e a f.
                ejemplo: proy_planta(solucion.R)
              - si: cerca_de(proy_planta(solucion.J))
                mensaje: |
                  Ese es J₁, el corte de VB con la cara de arriba, no el de VD: está en V₁B₁, al
                  otro lado de V₁. P es el corte de VD con esa misma cara, en V₁D₁.
                ejemplo: proy_planta(solucion.J)
              - si: en_segmento(figura.segmento("VD1"))
                mensaje: |
                  Estás en V₁D₁, pero no en el corte. Baja a la planta los cruces de V₂D₂ con e₂, f₂
                  y g₂, cada uno a su arista: forman un triángulo, y P₁ es donde V₁D₁ corta su lado
                  de e a f.
                ejemplo: proy_planta(punto_medio(segmento3(solucion.P, V)))
              - si: siempre
                mensaje: |
                  P₁ está en V₁D₁, la planta de la arista VD, donde la corta el lado de e a f del
                  triángulo del plano de canto.
          - nombre: P2
            pide: el corte de VD con la cara ef del prisma, en el alzado
            es: proy_alzado(solucion.P)
            bien: |
              P₂ está en V₂D₂, en la vertical de P₁, entre e₂ y f₂.
            diagnosticos:
              - si: 'cerca_de([proy_alzado(solucion.TeD), proy_alzado(solucion.TfD), proy_alzado(solucion.TgD)])'
                mensaje: |
                  Ese es un cruce de V₂D₂ con e₂, f₂ o g₂: en el alzado se cruzan, pero en el
                  espacio no se tocan. P₂ está en V₂D₂, en la vertical de P₁.
                ejemplo: proy_alzado(solucion.TeD)
              - si: '!en_vertical_de(P1)'
                mensaje: |
                  P₂ va en la vertical de P₁, sobre V₂D₂.
                ejemplo: proy_alzado(punto_medio(segmento3(solucion.P, V)))
              - si: siempre
                mensaje: |
                  Está en la vertical de P₁, pero no en V₂D₂: P está en la arista VD.
                ejemplo: 'desplaza(proy_alzado(solucion.P), dy: mm(-8))'
          - nombre: R1
            pide: el corte de VD con la cara fg del prisma, en la planta
            es: proy_planta(solucion.R)
            bien: |
              R₁ está en V₁D₁, donde la corta el lado de f a g del triángulo del plano de canto
              de VD.
            diagnosticos:
              - si: 'cerca_de([proy_planta(solucion.TeD), proy_planta(solucion.TfD), proy_planta(solucion.TgD)])'
                mensaje: |
                  Ese es un vértice del triángulo auxiliar, donde el plano de canto de VD corta una
                  arista del prisma. R₁ está en el lado de f a g, donde lo cruza V₁D₁.
                ejemplo: proy_planta(solucion.TgD)
              - si: cerca_de(proy_planta(solucion.P))
                mensaje: |
                  Ese es P₁, el corte de VD con la cara de arriba. R es el de la cara de abajo, de f
                  a g, más cerca de D₁.
                ejemplo: proy_planta(solucion.P)
              - si: cerca_de(proy_planta(solucion.L))
                mensaje: |
                  Ese es L₁, el corte de VB con la cara de abajo, no el de VD: está en V₁B₁, al
                  otro lado de V₁. R es el corte de VD con esa misma cara, en V₁D₁.
                ejemplo: proy_planta(solucion.L)
              - si: en_segmento(figura.segmento("VD1"))
                mensaje: |
                  Estás en V₁D₁, pero no en el corte. R₁ es donde V₁D₁ corta el lado de f a g del
                  triángulo que forman los cruces de V₂D₂ con e₂, f₂ y g₂ bajados a la planta.
                ejemplo: proy_planta(punto_medio(segmento3(solucion.R, D)))
              - si: siempre
                mensaje: |
                  R₁ está en V₁D₁, donde la corta el lado de f a g del triángulo del plano de canto.
          - nombre: R2
            pide: el corte de VD con la cara fg del prisma, en el alzado
            es: proy_alzado(solucion.R)
            bien: |
              R₂ está en V₂D₂, en la vertical de R₁, entre f₂ y g₂.
            diagnosticos:
              - si: 'cerca_de([proy_alzado(solucion.TeD), proy_alzado(solucion.TfD), proy_alzado(solucion.TgD)])'
                mensaje: |
                  Ese es un cruce de V₂D₂ con una arista del prisma en el alzado: no es un corte, es
                  un vértice del triángulo auxiliar. R₂ está en V₂D₂, en la vertical de R₁.
                ejemplo: proy_alzado(solucion.TgD)
              - si: '!en_vertical_de(R1)'
                mensaje: |
                  R₂ va en la vertical de R₁, sobre V₂D₂.
                ejemplo: proy_alzado(punto_medio(segmento3(solucion.R, D)))
              - si: siempre
                mensaje: |
                  Está en la vertical de R₁, pero no en V₂D₂: R está en la arista VD.
                ejemplo: 'desplaza(proy_alzado(solucion.R), dy: mm(-8))'
        trazado:
          - 'proy_planta([segmento3(solucion.TeB, solucion.TfB), segmento3(solucion.TfB, solucion.TgB), segmento3(solucion.TgB, solucion.TeB)])'
          - 'proy_planta([segmento3(solucion.TeD, solucion.TfD), segmento3(solucion.TfD, solucion.TgD), segmento3(solucion.TgD, solucion.TeD)])'
        pista: |
          (1) En el alzado, V₂B₂ cruza e₂, f₂ y g₂. (2) Baja cada cruce a la planta de su arista: e₁,
          f₁ y g₁. (3) Une los tres: es el triángulo que el plano de canto de VB corta en el prisma.
          (4) V₁B₁ corta su lado de e a f en J₁ y el de f a g en L₁; súbelos a V₂B₂. (5) Con V₂D₂,
          lo mismo, para P y R.
        desarrollo: |
          En verde claro, en la planta, los dos triángulos de los planos de canto: el de VB, a la
          izquierda, y el de VD, a la derecha. V₁B₁ y V₁D₁ cortan cada uno en dos lados, el de e a
          f y el de f a g. Entre J y L, y entre P y R, las aristas van por dentro del prisma.

      # Decisión: la visibilidad toma los dos sólidos como una sola pieza maciza:
      # lo que de una arista queda dentro del otro sólido no se dibuja. El
      # enunciado no lo dice, y el tema de intersecciones del curso solo trata
      # plano-plano y recta-plano. Lo apoyan los restos de una solución que trae
      # la pág. 62 debajo de los trazos del enunciado: V₂B₂ y V₂D₂ van partidas
      # justo en J₂ y L₂ y en P₂ y R₂, y en la planta V₁B₁ va de V₁ a J₁, deja un
      # hueco y sigue en discontinua de L₁ a B₁; los tramos ocultos de la base
      # acaban donde f₁ y g₁ la cruzan. Con una excepción: esos restos no traen
      # guiones en V₁D₁ entre R₁ y D₁, y ese tramo va oculto, porque D₁ cae 4,3 mm
      # dentro de la franja del prisma, desde g₁. Aquí va en discontinua. No se ha
      # decidido a ojo: la sacó un guion aparte, sin la lib, con un rayo hacia el
      # observador desde cada punto de cada línea, recortado contra la pirámide y
      # contra el prisma (los dos convexos), y con una holgura de roce de 0,05 pt.
      - tipo: dibujar
        consigna: |
          Une los diez puntos en los dos polígonos de la intersección, H J K L M y N P Q R T, y
          repasa la pirámide y el prisma en las dos vistas, con lo que se ve en continua y lo que
          se oculta en discontinua. Cuenta los dos sólidos como una sola pieza maciza: lo que de
          una arista queda dentro del otro no se dibuja.
        comprueba:
          - punto: >-
              En la planta, del polígono de la entrada, H₁J₁, J₁K₁ y M₁H₁ van en continua, y
              K₁L₁ y L₁M₁ en discontinua; del de la salida, N₁P₁, P₁Q₁ y T₁N₁ en continua, y
              Q₁R₁ y R₁T₁ en discontinua.
            porque: >-
              Desde arriba se ven la cara de e a f y la de g a e del prisma; la de f a g mira
              hacia abajo. Las cuatro caras laterales de la pirámide se ven desde arriba. Un
              lado de la intersección se ve si está en una cara vista de los dos sólidos, y KL,
              LM, QR y RT están en la cara de abajo del prisma.
          - punto: >-
              En la planta, la base va en discontinua donde le pasa el prisma por encima: A₁B₁ y
              B₁C₁ desde B₁, y C₁D₁ y D₁A₁ desde D₁, cada una hasta donde la cruza f₁ o g₁. Y
              también V₁B₁ de L₁ a B₁ y V₁D₁ de R₁ a D₁.
            porque: >-
              El prisma va por encima de la base y de esos tramos de arista, y su planta los
              tapa. El contorno del prisma en la planta son f₁ y g₁, la arista de delante y la de
              detrás.
          - punto: >-
              VB no se dibuja entre J y L, ni VD entre P y R; tampoco e entre H y N, f entre K y Q
              ni g entre M y T.
            porque: >-
              Esos tramos quedan dentro del otro sólido, y una pieza maciza no tiene aristas por
              dentro.
          - punto: >-
              En el alzado, del polígono de la entrada, J₂K₂ y K₂L₂ van en continua, y H₂J₂, L₂M₂
              y M₂H₂ en discontinua; del de la salida, P₂Q₂ y Q₂R₂ en continua, y N₂P₂, R₂T₂ y
              T₂N₂ en discontinua.
            porque: >-
              Desde delante se ven las caras de e a f y de f a g del prisma, y las caras VAB y
              VDA de la pirámide; la cara de g a e y las caras VBC y VCD miran hacia atrás. JK y
              KL están en VAB, y PQ y QR en VDA.
          - punto: >-
              En el alzado, e₂ va en discontinua desde donde cruza V₂B₂ hasta H₂, y desde N₂
              hasta donde cruza V₂D₂; g₂, igual, de V₂B₂ a M₂ y de T₂ a V₂D₂. f₂ va en continua
              hasta K₂ y desde Q₂.
            porque: >-
              e y g entran y salen por las caras de atrás de la pirámide, VBC y VCD, y antes de
              llegar a ellas van por detrás de la pirámide. f entra y sale por las de delante.
          - punto: >-
              En el alzado, el extremo izquierdo del prisma lleva E₂G₂ en discontinua, como en la
              lámina del ejercicio, y el derecho va entero en continua; V₂C₂ sigue en discontinua.
            porque: >-
              El extremo izquierdo y la cara de g a e miran hacia atrás, y el extremo derecho,
              hacia delante: las aristas se acercan a ti al ir hacia la derecha. VC es la arista
              de atrás de la pirámide.
