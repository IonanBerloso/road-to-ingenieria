            porque: 'De R a D, VD va por debajo del prisma, que le pasa por encima: D₁ cae 4,3 mm dentro de la franja del prisma, desde g₁.'
          - traza: segmento2(figura.punto("A1"), solucion.k_AB_f)
            tipo: visto
