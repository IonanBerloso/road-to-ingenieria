            <title id="egex541-t">La pirámide atravesada por el prisma: la intersección y lo que se ve</title>
            <desc id="egex541-d">Alzado arriba y planta abajo, en las mismas verticales. La pirámide regular de base cuadrada ABCD y vértice V, y el prisma triangular de aristas horizontales e (arriba), f (en medio, delante) y g (abajo), que la atraviesa de izquierda a derecha. En verde, los dos polígonos de la intersección: H J K L M por la entrada, del lado de B, y N P Q R T por la salida, del lado de D. Los dos sólidos son una sola pieza: VB no se dibuja entre J y L, ni VD entre P y R, ni las aristas del prisma dentro de la pirámide. En la planta van en discontinua K₁L₁, L₁M₁, Q₁R₁ y R₁T₁, que están en la cara de abajo del prisma, y los tramos de la base y de V₁B₁ y V₁D₁ que el prisma tapa por encima, junto a B₁ y a D₁. En el alzado van en continua J₂K₂, K₂L₂, P₂Q₂ y Q₂R₂, en las caras de delante, y en discontinua el resto de los dos polígonos; e₂ y g₂ van en discontinua entre el contorno de la pirámide y sus cortes, porque pasan por detrás; f₂ se ve entera fuera de la pirámide; V₂C₂ y E₂G₂ van en discontinua.</desc>
