hoja: 54
# El Ejercicio 54 de la Colección de ejercicios de diédrico: «EJERCICIO 54»,
# págs. 61-63 de Coleccin_de_ejercicios.pdf. El enunciado (pág. 61) es
# bilingüe, «Azterketa» arriba y «Examen» abajo, y casi todo es imagen: solo
# son texto la cabecera y los nombres de puntos y rectas. Se ha transcrito
# desde la página renderizada. Las figuras están en la 62 (A3 apaisado: el
# apartado 1) y en la 63 (el 2 a la izquierda y el 3 a la derecha), con el
# cajetín «AZTERKETA / EXAMEN» a escala 1:100.
#
# Tres cosas, dichas antes de que nadie las deduzca:
#
# 1. **ES EL ÚNICO DE LA COLECCIÓN TITULADO «EXAMEN».** Del 1 al 51 son las
#    láminas SD; del 52 al 55, cuatro ejercicios de varios apartados, bilingües
#    y sin fecha. Solo el 54 dice «Azterketa / Examen», en el enunciado y en el
#    cajetín de sus láminas. La clave interna sigue siendo `hoja`, y la carpeta
#    es la que da `slugExamen`.
#
# 2. **NO TRAE NINGUNA «Nota:» IMPRESA.** Ningún apartado usa `notas`. El
#    castellano del apartado 2 trae una errata, «está el en plano», que se
#    conserva.
#
# 3. **LOS TRES APARTADOS ESTÁN, EN CINCO PIEZAS.** El 1, en dos: la
#    intersección (t04) y el ángulo por abatimiento (t06). El 2, en dos: la
#    planta del trapecio (t02) y el rectángulo perpendicular (t05), que vuelve a
#    pedir A₁ y C₁ para valer solo. El 3, entero (t05). Por eso no hay `fuera`.
sinFecha: >-
  Es el Ejercicio 54 de la Colección de ejercicios de diédrico, uno de los
  cuatro, del 52 al 55, con que cierra la colección, y ninguno dice de qué
  curso ni de qué día es. Los cuatro son bilingües y traen varios apartados;
  el 54 es el único que se titula «Examen», y sus láminas llevan cajetín de
  examen. Por eso va sin fecha y sin curso.
# Decisión: la colección lleva metadatos de autor rellenos, y hasta que se
# decida cómo publicar un PDF limpio, no se enlaza el PDF.
sinPdf: >-
  No se enlaza el PDF de la colección: el original lleva metadatos que hay que
  limpiar antes de publicarlo. El enunciado está transcrito tal cual, en su
  versión en castellano, y cada figura se redibuja desde sus coordenadas
  exactas, en la lámina de cada apartado.

# Cada entrada lleva su `n`, el número del apartado: si unas lo llevaran y otras
# no, `ejerciciosDelCuadernillo` (lib/cuadernillo.ts) contaría solo los que hay.
