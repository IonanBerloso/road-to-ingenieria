asignatura: expresion-grafica
curso: '2025-2026'
convocatoria: ordinaria
fecha: 29 de mayo de 2026
# La convocatoria ordinaria de Ingeniería Industrial: la puso el departamento en la
# carpeta «dibujo» que llegó el 2 de noviembre de 2026. Son dos PDF, enunciado (dos
# páginas A4, bilingüe) y láminas (dos A3); aquí van unidos en uno, sin metadatos de
# autor, cada página comparada píxel a píxel.
#
# Tres cosas, dichas antes de que nadie las deduzca:
#
# 1. **EL ENUNCIADO Y LAS LÁMINAS TIENEN NOMBRES DISTINTOS.** El fichero del
#    enunciado dice «b2» y el de las láminas, «b1». Son del mismo examen: los datos
#    y las figuras encajan, y el cajetín da la misma fecha, escrita «2026/05/29 -
#    29/05/29».
#
# 2. **LA PRIMERA LÁMINA NO TRAE ESCALA.** La segunda da una cota de 100 m entre dos
#    vértices de la base, que mide 50 mm: 1:2000. En los ejercicios 1 y 2 las
#    medidas se dan en el papel.
#
# 3. **LOS PUNTOS SUMAN 10 CON ESTOS TRES EJERCICIOS.** Lo que hay en el material es
#    diédrico. Si la convocatoria tuvo otra parte, no está aquí.
pdf: 2025-2026-ord.pdf
duracion:
  minutos: 80
  impresa: false
  fuente: dato de quien mantiene el proyecto, 9 de octubre de 2026, de unos 40 minutos por cada lámina A3 del examen; este tiene dos, y no imprime su duración
puntosImpresos:
  fuente: >-
    impresos junto a cada ejercicio del enunciado: 4 puntos en el 1 (2 y 2), 1,5 en
    el 2 y 4,5 en el 3 (3 y 1,5)
  reparto:
    - { n: 1, puntos: 4 }
    - { n: 2, puntos: 1.5 }
    - { n: 3, puntos: 4.5 }

# El 3 va en dos piezas con `n: 3`, como la hoja 53.
