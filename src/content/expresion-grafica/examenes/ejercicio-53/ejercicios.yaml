ejercicios:
  # ── 1 · La columna cortada por el plano de dos horizontales. Lo que enseña:
  #    mirar la planta antes de construir. B₁, C₁, E₁ e I₁ caen sobre s₁, así que
  #    la cara BCEI es vertical y contiene a s: dos vértices de la sección están
  #    en s sin hacer nada, y con s de charnela no se mueven al abatir.
  - id: exeg-h53-1-la-columna-cortada-por-el-plano-de-r-y-s
    titulo: La columna cortada por el plano de r y s, y su sección en verdadera magnitud
    fuente: >-
      Apartado 1 · Ejercicio 53 de la Colección de ejercicios de
      Geometría Descriptiva, Sistema Diédrico Directo (págs. 58-60; el apartado
      1, en las 58 y 59) · Dpto. de Expresión Gráfica y Proyectos de
      Ingeniería, EIG · UPV/EHU. Sin fecha: es uno de los cuatro ejercicios
      bilingües con que cierra la colección, del 52 al 55, y de ellos solo el 54
      se titula «Examen»; el 53 lleva cajetín de lámina. Se transcribe el
      castellano; la figura se redibuja desde sus coordenadas.
    nivel: examen
    # Decisión: el castellano de la pág. 58 tal cual (es texto en trazos: se ha
    # leído renderizado a 150 y a 300 ppp), con la negrita que imprime en
    # «método de abatimientos» y sin la cabecera «ARIKETA 1 / EJERCICIO 1»: la
    # fuente ya dice que es el apartado 1 del Ejercicio 53. Sus partes van con su
    # letra, «A.» y «B.», como en la página.
    enunciado: |
      El plano definido por las rectas paralelas r y s secciona la columna que tiene por bases
      los rectángulos ABCD y EFGI. Se pide dibujar:

      A. La intersección entre el plano y la columna.

      B. La verdadera magnitud de la intersección mediante el **método de abatimientos**.

      **Notas nuestras.** La figura es la mitad izquierda de la primera página de figuras del
      ejercicio: el alzado arriba y la planta abajo. La columna va de la base ABCD, abajo, a la
      EFGI, arriba, y sus aristas laterales son AG, BI, CE y DF; la figura solo dibuja el
      arranque de cada una junto a su base, y el resto lo completas tú. El plano se dibuja
      como una franja entre r y s, cortada a los lados con líneas de rotura onduladas que
      aquí no están: dicen que sigue, no son datos. Llamamos K, L, M y N a los puntos donde
      el plano corta las aristas AG, BI, CE y DF; esos nombres son nuestros.
    pide: Los cuatro vértices de la sección en las dos vistas, sus abatidos con s de charnela, lo que mide de verdad el lado KL y qué se ve y qué se oculta de la columna y la placa.
    receta:
      lamina: ex53-1
      escena:
        A: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("A1"))'
        B: 'punto3(alzado: figura.punto("B2"), planta: figura.punto("B1"))'
        C: 'punto3(alzado: figura.punto("C2"), planta: figura.punto("C1"))'
        D: 'punto3(alzado: figura.punto("D2"), planta: figura.punto("D1"))'
        E: 'punto3(alzado: figura.punto("E2"), planta: figura.punto("E1"))'
        F: 'punto3(alzado: figura.punto("F2"), planta: figura.punto("F1"))'
        G: 'punto3(alzado: figura.punto("G2"), planta: figura.punto("G1"))'
        I: 'punto3(alzado: figura.punto("I2"), planta: figura.punto("I1"))'
        r: 'recta3(alzado: figura.segmento("r2"), planta: figura.segmento("r1"))'
        s: 'recta3(alzado: figura.segmento("s2"), planta: figura.segmento("s1"))'
        # El plano de r y s por tres de sus puntos: dos de r y uno de s. Los pies
        # desde A y G son solo una manera de tener puntos de esas rectas; cualquier
        # otro daría el mismo plano.
        plano_rs: plano(pie_perpendicular(A, r), pie_perpendicular(G, r), pie_perpendicular(A, s))
      solucion:
        K: corte_recta_plano(segmento3(A, G), plano_rs)
        L: corte_recta_plano(segmento3(B, I), plano_rs)
        M: corte_recta_plano(segmento3(C, E), plano_rs)
        N: corte_recta_plano(segmento3(D, F), plano_rs)
        # Decisión: la charnela es s, aunque r también valdría. L y M están en s (la
        # cara BCEI la contiene: lo comprueba `comprueba`), así que no se mueven, y
        # solo hay que abatir K y N. (K) sale por su definición —en la horizontal
        # perpendicular a s por el pie, a la distancia real de K a s—, y es una
        # elección: la primera marca fija el lado. (N) sale con el mismo giro que
        # llevó K a (K), así que hereda esa elección y la figura abatida cae junta.
        pieK: pie_perpendicular(K, s)
        pieN: pie_perpendicular(N, s)
        Ka: 'punto_a_distancia(horizontal_por(pieK, plano_perpendicular_a_recta(K, s)), desde: pieK, distancia: vm(K, pieK))'
        Na: 'abatido_junto(N, s, plano_rs, con: Ka, de: K)'
        # El error de llevar la diferencia de cotas en vez de la distancia real:
        # solo para escribir su ejemplo.
        Kdz: 'punto_a_distancia(horizontal_por(pieK, plano_perpendicular_a_recta(K, s)), desde: pieK, distancia: diferencia_de_cotas(K, pieK))'
        vm_KL_mm: en_mm(vm(K, L))
      comprueba:
        - en_recta(L, s)
        - en_recta(M, s)
        # KN es una horizontal del plano: lo dicen el paso 2 y la resolución.
        - en_recta(N, horizontal_por(K, plano_rs))
    pasos:
      - tipo: reconocer
        pregunta: r₂ y s₂ son dos horizontales del alzado, y r₁ y s₁ dos rectas paralelas de la planta. ¿Qué dice eso del plano?
        opciones:
          - texto: Que r y s son horizontales del plano, y cualquiera de las dos sirve de charnela para abatirlo sobre un plano horizontal
            correcta: true
            mensaje: |
              Eso es. Una recta con el alzado horizontal no cambia de cota: es una horizontal,
              y se ve en verdadera magnitud en la planta. Abatir el plano alrededor de una
              horizontal suya lo deja sobre el plano horizontal que la contiene, y lo abatido
              se ve sin deformar en la planta.
          - texto: Que el plano es horizontal, porque las dos rectas lo son
            mensaje: |
              Para eso r y s tendrían que estar a la misma cota, y r₂ va más arriba que s₂.
              Son dos horizontales a distinta altura: el plano sube de s hacia r, y está
              inclinado.
          - texto: Que el plano es de canto sobre el alzado, porque sus rectas se ven horizontales
            mensaje: |
              Un plano de canto se ve en el alzado como **una sola** recta: todos sus puntos
              caen en ella. Aquí r₂ y s₂ son dos rectas distintas, y los puntos de la franja
              ocupan todo lo que hay entre ellas.

      - tipo: construir
        titulo: Los cuatro vértices de la sección
        intro: |
          Marca, en las dos vistas, los puntos donde el plano corta las aristas laterales: L en
          BI, M en CE, K en AG y N en DF. Las aristas solo están empezadas, y r₂ y s₂ tienen un
          hueco donde va la columna: prolonga lo que haga falta, cada arista hasta el vértice de
          la otra base. Antes de trazar nada, mira dónde caen B₁, C₁, E₁ e I₁.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, medir, borrar]
        tolerancia: 1
        objetivos:
          - nombre: L2
            pide: el corte de la arista BI, en el alzado
            es: proy_alzado(solucion.L)
            bien: |
              L₂ está donde B₂I₂ corta a s₂. B₁ e I₁ caen sobre s₁: la arista BI está en el
              plano vertical de s, y corta al plano de la franja en un punto de s.
            diagnosticos:
              - si: en_recta(figura.segmento("BI2"))
                mensaje: |
                  Estás en la arista B₂I₂, pero a otra altura. Mira la planta: B₁ e I₁ están
                  sobre s₁, así que BI y s están en el mismo plano vertical y se cortan. El
                  corte con el plano es ese punto, a la altura de s₂.
                ejemplo: 'pie_perpendicular(desplaza(proy_alzado(solucion.L), dy: mm(-10)), figura.segmento("BI2"))'
              - si: en_recta(figura.segmento("s2"))
                mensaje: |
                  Estás en s₂, pero no en la arista BI. Prolonga el arranque que sale de B₂
                  hasta I₂: L₂ es donde esa arista corta a s₂. Cuidado con D₂F₂, que también
                  cruza s₂ en el alzado: DF va por detrás y no toca a s.
                ejemplo: 'desplaza(proy_alzado(solucion.L), dx: mm(5))'
              - si: siempre
                mensaje: |
                  L₂ tiene que estar a la vez en la arista B₂I₂ y en s₂: BI está en el plano
                  vertical de s, y lo corta en un punto de s.
          - nombre: L1
            pide: el corte de la arista BI, en la planta
            es: proy_planta(solucion.L)
            bien: |
              L₁ está sobre s₁, en la vertical de L₂: B₁I₁ cae entera sobre s₁.
            diagnosticos:
              - si: '!en_vertical_de(L2)'
                mensaje: |
                  L₁ va en la **vertical de L₂**: son el mismo punto visto dos veces. Sobre s₁
                  hay muchos puntos; el tuyo es el que está debajo de L₂.
                ejemplo: 'desplaza(proy_planta(solucion.L), dx: mm(6), dy: mm(-6))'
              - si: siempre
                mensaje: |
                  Si ya tienes L₂: está en su vertical, pero no sobre s₁. L está en la arista BI, y
                  B₁I₁ está sobre s₁: L₁ también.
                ejemplo: 'desplaza(proy_planta(solucion.L), dy: mm(-8))'
          - nombre: M2
            pide: el corte de la arista CE, en el alzado
            es: proy_alzado(solucion.M)
            bien: |
              M₂ está donde C₂E₂ corta a s₂: C₁ y E₁ también caen sobre s₁, y CE corta al plano
              en s, igual que BI.
            diagnosticos:
              - si: en_recta(figura.segmento("CE2"))
                mensaje: |
                  Estás en la arista C₂E₂, pero a otra altura. C₁ y E₁ están sobre s₁: CE y s
                  están en el mismo plano vertical, y el corte con el plano es el de CE con s,
                  a la altura de s₂.
                ejemplo: 'pie_perpendicular(desplaza(proy_alzado(solucion.M), dy: mm(-10)), figura.segmento("CE2"))'
              - si: en_recta(figura.segmento("s2"))
                mensaje: |
                  Estás en s₂, pero no en la arista CE. Prolonga el arranque que sale de C₂
                  hasta E₂: M₂ es donde corta a s₂.
                ejemplo: 'desplaza(proy_alzado(solucion.M), dx: mm(-5))'
              - si: siempre
                mensaje: |
                  M₂ tiene que estar a la vez en la arista C₂E₂ y en s₂.
          - nombre: M1
            pide: el corte de la arista CE, en la planta
            es: proy_planta(solucion.M)
            bien: |
              M₁ está sobre s₁, en la vertical de M₂. El lado LM de la sección está sobre s, y
              en la planta se ve en verdadera magnitud: s es horizontal.
            diagnosticos:
              - si: '!en_vertical_de(M2)'
                mensaje: |
                  M₁ va en la **vertical de M₂**: el mismo punto, visto desde arriba.
                ejemplo: 'desplaza(proy_planta(solucion.M), dx: mm(-6), dy: mm(6))'
              - si: siempre
                mensaje: |
                  Si ya tienes M₂: está en su vertical, pero no sobre s₁. C₁E₁ está sobre s₁: M₁
                  también.
                ejemplo: 'desplaza(proy_planta(solucion.M), dy: mm(-8))'
          - nombre: K2
            pide: el corte de la arista AG, en el alzado
            es: proy_alzado(solucion.K)
            bien: |
              K₂ está en A₂G₂, donde la corta la recta que une los puntos en que el plano
              vertical de AG corta a r y a s. Es el método general: una arista, un plano
              auxiliar que la contenga, y su recta común con el plano dado.
            diagnosticos:
              - si: en_recta(figura.segmento("s2"))
                mensaje: |
                  K no está en s. Solo BI y CE están en el plano vertical de s; A₁G₁ se aparta
                  de s₁, y AG corta al plano más arriba. Haz pasar por AG un plano vertical:
                  corta a r y a s en dos puntos, y la recta que los une corta a A₂G₂ en K₂.
                ejemplo: 'proy_alzado(vertical_hasta(solucion.K, linea(figura.segmento("s2"))))'
              - si: en_recta(figura.segmento("r2"))
                mensaje: |
                  K no está en r: A₁G₁ no toca a r₁, y r va por detrás de la columna. El corte
                  se busca con un plano vertical por AG, que corta a r y a s en dos puntos que
                  se suben al alzado.
                ejemplo: 'proy_alzado(vertical_hasta(solucion.K, linea(figura.segmento("r2"))))'
              - si: en_recta(figura.segmento("AG2"))
                mensaje: |
                  Estás en la arista A₂G₂, pero no en el corte. En la planta, prolonga A₁G₁
                  hasta r₁ y hasta s₁; sube esos dos puntos a r₂ y a s₂ y únelos. Esa recta es
                  la común del plano dado y el plano vertical de AG, y corta a A₂G₂ en K₂.
                ejemplo: 'pie_perpendicular(desplaza(proy_alzado(solucion.K), dy: mm(-12)), figura.segmento("AG2"))'
              - si: siempre
                mensaje: |
                  K₂ está en la arista A₂G₂. Para saber dónde, el plano vertical que contiene a
                  AG: sus cortes con r y con s, subidos al alzado, dan una recta que corta a
                  A₂G₂ en K₂.
          - nombre: K1
            pide: el corte de la arista AG, en la planta
            es: proy_planta(solucion.K)
            bien: |
              K₁ está en A₁G₁, en la vertical de K₂.
            diagnosticos:
              - si: '!en_vertical_de(K2)'
                mensaje: |
                  K₁ va en la **vertical de K₂**: baja K₂ con una vertical hasta A₁G₁.
                ejemplo: 'desplaza(proy_planta(solucion.K), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Si ya tienes K₂: está en su vertical, pero no en la arista. Prolonga el arranque que
                  sale de A₁ hasta G₁: K₁ está sobre esa recta.
                ejemplo: 'desplaza(proy_planta(solucion.K), dy: mm(-8))'
          - nombre: N2
            pide: el corte de la arista DF, en el alzado
            es: proy_alzado(solucion.N)
            bien: |
              N₂ está en D₂F₂ y a la altura de K₂. La cara ADFG tiene dos horizontales
              paralelas a r, AD y GF, así que el plano la corta según otra horizontal: KN.
            diagnosticos:
              - si: en_recta(figura.segmento("s2"))
                mensaje: |
                  N no está en s. DF está detrás, y su planta se aparta de s₁: corta al plano
                  más arriba. Hazlo como con AG, o fíjate en que N está a la altura de K₂.
                ejemplo: 'proy_alzado(vertical_hasta(solucion.N, linea(figura.segmento("s2"))))'
              - si: en_recta(figura.segmento("r2"))
                mensaje: |
                  N no está en r. Con un plano vertical por DF: sus cortes con r y con s, subidos
                  al alzado, dan la recta que corta a D₂F₂ en N₂.
                ejemplo: 'proy_alzado(vertical_hasta(solucion.N, linea(figura.segmento("r2"))))'
              - si: en_recta(figura.segmento("DF2"))
                mensaje: |
                  Estás en la arista D₂F₂, pero no en el corte. AD y GF son paralelas a r₁ en la
                  planta y horizontales en el alzado: el plano corta la cara ADFG por una
                  horizontal, y N₂ está a la altura de K₂.
                ejemplo: 'pie_perpendicular(desplaza(proy_alzado(solucion.N), dy: mm(-12)), figura.segmento("DF2"))'
              - si: siempre
                mensaje: |
                  N₂ está en la arista D₂F₂, a la altura de K₂: KN es una horizontal del plano.
          - nombre: N1
            pide: el corte de la arista DF, en la planta
            es: proy_planta(solucion.N)
            bien: |
              N₁ está en D₁F₁, en la vertical de N₂, y K₁N₁ sale paralela a r₁ y a s₁: es una
              horizontal del plano.
            diagnosticos:
              - si: '!en_vertical_de(N2)'
                mensaje: |
                  N₁ va en la **vertical de N₂**: baja N₂ hasta D₁F₁.
                ejemplo: 'desplaza(proy_planta(solucion.N), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Si ya tienes N₂: está en su vertical, pero no en la arista. Prolonga el arranque que
                  sale de D₁ hacia F₁: N₁ está sobre esa recta, y K₁N₁ queda paralela a s₁.
                ejemplo: 'desplaza(proy_planta(solucion.N), dy: mm(8))'
        trazado:
          - proy_alzado(segmento3(solucion.K, solucion.L))
          - proy_alzado(segmento3(solucion.L, solucion.M))
          - proy_alzado(segmento3(solucion.M, solucion.N))
          - proy_alzado(segmento3(solucion.N, solucion.K))
          - proy_planta(segmento3(solucion.K, solucion.L))
          - proy_planta(segmento3(solucion.L, solucion.M))
          - proy_planta(segmento3(solucion.M, solucion.N))
          - proy_planta(segmento3(solucion.N, solucion.K))
        pista: |
          (1) B₁, C₁, E₁ e I₁ caen sobre s₁: BI y CE cortan al plano en s, y L₂ y M₂ son sus
          cortes con s₂. (2) Para AG, prolonga A₁G₁ hasta r₁ y s₁, sube los dos puntos a r₂ y s₂
          y únelos: esa recta corta a A₂G₂ en K₂. (3) N₂ está en D₂F₂ a la altura de K₂.
          (4) Baja los cuatro a la planta, cada uno a su arista.
        desarrollo: |
          En verde claro, la sección en las dos vistas: un trapecio con el lado LM sobre s y el
          lado KN horizontal, paralelo a s, a la altura de K₂.

      - tipo: construir
        titulo: La sección abatida, con s de charnela
        intro: |
          Abate la sección sobre el plano horizontal de s, con s de charnela: L y M están en s y
          no se mueven. Lleva K y N por la perpendicular a s₁ que pasa por K₁ y por N₁, a su
          distancia real a s. Vale a cualquiera de los dos lados de s₁, pero los dos al mismo.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, borrar]
        tolerancia: 1
        objetivos:
          - nombre: Kab
            rotulo: (K)
            pide: el vértice K, abatido
            es: proy_planta(solucion.Ka)
            bien: |
              (K) está en la perpendicular a s₁ por K₁, a la distancia real de K a s: la
              hipotenusa del triángulo que tiene por catetos lo que separa K₁ de s₁ en la
              planta y la diferencia de cotas de K y s, que se mide en el alzado.
            diagnosticos:
              - si: cerca_de(proy_planta(abatido(solucion.K, r, plano_rs)))
                mensaje: |
                  Ese es K abatido con **r** de charnela. En un examen también valdría, pero
                  aquí la charnela es s: así L y M se quedan donde están y solo hay que mover K
                  y N.
                ejemplo: 'proy_planta(gira(solucion.K, r, angulo: angulo_con_ph(plano_rs), sentido: ascendente))'
              - si: '!en_recta(perpendicular(por: proy_planta(solucion.K), a: figura.segmento("s1")))'
                mensaje: |
                  Al abatir, K gira alrededor de s en un plano perpendicular a s, y ese plano es
                  vertical: en la planta, (K) se mueve por la **perpendicular a s₁ que pasa por
                  K₁**.
                ejemplo: 'desplaza(proy_planta(rama(solucion.Ka, 1)), dx: mm(6), dy: mm(-6))'
              - si: cerca_de(proy_planta(solucion.K))
                mensaje: |
                  Ese es K₁, sin abatir. Al abatir, K gira alrededor de s y se aparta de s₁ hasta
                  su distancia real, 25,6 mm, por la perpendicular a s₁.
                ejemplo: proy_planta(solucion.K)
              - si: 'a_distancia(de: proy_planta(solucion.pieK), d: vm_planta(solucion.K, solucion.pieK))'
                mensaje: |
                  Has llevado lo que separa K₁ de s₁ **en la planta**, y la planta acorta: K está
                  más alto que s. La distancia real es la hipotenusa del triángulo con ese
                  cateto y la diferencia de cotas de K y s.
                ejemplo: 'proy_planta(simetrico(solucion.K, respecto: solucion.pieK))'
              - si: 'a_distancia(de: proy_planta(solucion.pieK), d: diferencia_de_cotas(solucion.K, solucion.pieK))'
                mensaje: |
                  Has llevado la **diferencia de cotas** de K y s, que se lee en el alzado: es solo
                  un cateto. Falta el otro, lo que separa K₁ de s₁ en la planta; la distancia
                  real es la hipotenusa.
                ejemplo: proy_planta(rama(solucion.Kdz, 1))
              - si: siempre
                mensaje: |
                  (K) está en la perpendicular a s₁ por K₁, a la distancia real de K a s: con la
                  separación de K₁ y s₁ en la planta y la diferencia de cotas de K y s, la
                  hipotenusa.
          - nombre: Nab
            rotulo: (N)
            pide: el vértice N, abatido
            es: proy_planta(solucion.Na)
            bien: |
              (N) está en la perpendicular a s₁ por N₁, al mismo lado que (K), y (K)(N) sale
              paralela a s₁: KN es horizontal y paralela a la charnela, y eso no cambia al
              abatir.
            diagnosticos:
              - si: cerca_de(otra_rama(proy_planta(solucion.Na)))
                mensaje: |
                  Ese es N abatido **al otro lado** de s₁: (K) lo has llevado al contrario. Toda la
                  figura abatida va al mismo lado de la charnela, o deja de ser la sección.
                ejemplo: proy_planta(rama(solucion.Na, 2))
              - si: cerca_de(proy_planta(abatido(solucion.N, r, plano_rs)))
                mensaje: |
                  Ese es N abatido con **r** de charnela. Aquí la charnela es s, la misma que has
                  usado para K.
                ejemplo: 'proy_planta(gira(solucion.N, r, angulo: angulo_con_ph(plano_rs), sentido: ascendente))'
              - si: '!en_recta(perpendicular(por: proy_planta(solucion.N), a: figura.segmento("s1")))'
                mensaje: |
                  (N) se mueve por la **perpendicular a s₁ que pasa por N₁**, como (K) por la de
                  K₁. Y hay un atajo: (N) está también en la paralela a s₁ que pasa por (K).
                ejemplo: 'desplaza(proy_planta(rama(solucion.Na, 1)), dx: mm(6), dy: mm(-6))'
              - si: cerca_de(proy_planta(solucion.N))
                mensaje: |
                  Ese es N₁, sin abatir. Al abatir, N gira alrededor de s y se aparta de s₁ hasta
                  su distancia real, 25,6 mm, por la perpendicular a s₁, al mismo lado que (K).
                ejemplo: proy_planta(solucion.N)
              - si: 'a_distancia(de: proy_planta(solucion.pieN), d: vm_planta(solucion.N, solucion.pieN))'
                mensaje: |
                  Has llevado lo que separa N₁ de s₁ en la planta, que acorta. N está a la misma
                  altura que K y a la misma distancia de s: (N) va a la altura de (K), en la
                  paralela a s₁.
                ejemplo: 'proy_planta(simetrico(solucion.N, respecto: solucion.pieN))'
              - si: siempre
                mensaje: |
                  (N) está en la perpendicular a s₁ por N₁ y en la paralela a s₁ por (K): KN es
                  paralela a la charnela, y al abatir sigue siéndolo.
        trazado:
          - proy_planta(segmento3(solucion.Ka, solucion.L))
          - proy_planta(segmento3(solucion.L, solucion.M))
          - proy_planta(segmento3(solucion.M, solucion.Na))
          - proy_planta(segmento3(solucion.Na, solucion.Ka))
        pista: |
          (1) Por K₁, la perpendicular a s₁; su pie en s₁ es el centro del giro. (2) La distancia
          real de K a s: un triángulo con la separación de K₁ y s₁ en la planta y la diferencia de
          cotas de K₂ y s₂ en el alzado. (3) Llévala con el compás desde el pie, por esa
          perpendicular. (4) (N), en la perpendicular por N₁ y en la paralela a s₁ por (K).
        desarrollo: |
          En verde claro, la sección abatida, (K) L₁ M₁ (N): un trapecio con (K)(N) paralela a s₁.
          K y N quedan a 25,6 mm de la charnela.

      - tipo: calcular
        titulo: El lado KL, en verdadera magnitud
        pregunta: ¿Cuánto mide de verdad el lado KL de la sección?
        respuesta:
          tipo: numero
          valor: '25.67'
          receta: vm_KL_mm
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '17.47'
            receta: en_mm(vm_planta(K, L))
            mensaje: |
              Eso es lo que mide **K₁L₁ en la planta**. KL sube de L a K, y la planta lo acorta;
              en verdadera magnitud está en el abatimiento, de (K) a L₁. Si has medido algo más
              de 18, puede que sea la diferencia de cotas de K y L, 18,81: tampoco es el lado.
          - valor: '21.52'
            receta: en_mm(vm_alzado(K, L))
            mensaje: |
              Eso es **K₂L₂ en el alzado**, que también acorta: KL no es frontal, porque K y L no
              están a la misma distancia del plano vertical (K₁L₁ no sale horizontal en el papel).
          - valor: '18.81'
            receta: en_mm(diferencia_de_cotas(K, L))
            mensaje: |
              Eso es la **diferencia de cotas** de K y L, lo que sube el lado: un cateto, no el
              lado.
        pista: |
          Mídelo en la sección abatida, de (K) a L₁: L está en la charnela y no se ha movido.
        desarrollo: |
          En la sección abatida, de (K) a L₁ se miden 25,7 mm: 25,69 a un lado de s₁ y 25,80 al
          otro, porque L se aparta de s 0,08 mm, el redondeo del dibujo. El triángulo lo
          confirma, con K₁L₁ de la planta y la diferencia de cotas del alzado:
          $$ \overline{KL} = \sqrt{\overline{K_1L_1}^{\,2} + \Delta z^{2}} = \sqrt{17{,}47^{2} + 18{,}81^{2}} \approx 25{,}67 \text{ mm} $$

      # Decisión: la visibilidad toma la franja entre r y s como una placa opaca que
      # sigue a los lados (eso dicen las líneas de rotura), y la columna como un sólido.
      # No se ha decidido a ojo: sale de un segundo camino, con un rayo hacia el
      # observador desde cada punto de cada línea, recortado contra la columna (seis
      # caras planas, convexa) y contra la franja. El enunciado no pide la visibilidad: el
      # paso es nuestro, y la consigna lo dice.
      - tipo: dibujar
        consigna: |
          El enunciado no pide la visibilidad con estas palabras: este paso es nuestro. En las
          diapositivas de intersecciones del curso, cada intersección se termina situándola con
          líneas continuas y discontinuas, y aquí se decide con una convención que fijamos
          nosotros: la franja entre r y s es una placa opaca. Dibuja en las dos vistas la
          columna entera, la franja y la sección, con lo que se ve en continua y lo que se
          oculta en discontinua. La placa tapa lo que queda debajo en la planta y lo que queda
          detrás en el alzado.
        comprueba:
          - punto: >-
              En la planta, la base ABCD y los tramos de las aristas laterales que van de la
              base a la sección están ocultos: en discontinua, salvo los que caen sobre s₁ (el
              punto siguiente).
            porque: >-
              Toda la planta de la columna cae dentro de la franja, entre r₁ y s₁, y lo que está
              por debajo del plano queda tapado por la placa. Del corte para arriba la columna
              asoma por el agujero y se ve, con la base EFGI entera.
          - punto: >-
              En la planta, B₁C₁, B₁L₁ y C₁M₁ caen sobre s₁, y van en continua.
            porque: >-
              Están ocultas, pero en la misma recta que s₁, que se ve: lo visto manda. Es la cara
              BCEI, vertical, vista de canto.
          - punto: >-
              En el alzado, A₂G₂ en continua hasta s₂, en discontinua de s₂ a K₂ y otra vez en
              continua de K₂ a G₂.
            porque: >-
              Entre s y K, la arista AG está por debajo del plano, y la placa, que baja hacia el
              observador, le pasa por delante. Por debajo de s ya no hay placa, y por encima de K
              la arista ha salido del plano.
          - punto: >-
              En el alzado, D₂F₂ entera en discontinua, y de la sección K₂L₂ y L₂M₂ en continua,
              M₂N₂ y N₂K₂ en discontinua.
            porque: >-
              DF es la arista de atrás y la tapa la propia columna. Los lados MN y NK están en las
              caras de atrás, CDFE y DAGF; KL y LM, en las de delante.
          - punto: >-
              En el alzado, r₂ en discontinua entre A₂G₂ y C₂E₂, y s₂ en continua de punta a
              punta.
            porque: >-
              r es el borde de atrás de la placa y pasa por detrás de la columna. s es el borde de
              delante, y el lado LM de la sección está en él.
        figura: |
          <figure>
          <svg viewBox="0 0 340 590" role="img" width="340" height="590" aria-labelledby="egex531-t egex531-d">
            <title id="egex531-t">La columna cortada por el plano de r y s: lo que se ve y lo que se oculta</title>
            <desc id="egex531-d">Alzado arriba y planta abajo, en las mismas verticales. La columna va de la base ABCD, abajo, a la EFGI, arriba, con las aristas AG, BI, CE y DF; el plano es la franja entre las horizontales r y s. La sección es el trapecio KLMN, en verde: L y M sobre s, K y N a la misma altura. En la planta, la base ABCD y las aristas hasta la sección quedan ocultas, en discontinua, salvo lo que cae sobre s₁; de la sección para arriba, en continua. En el alzado, la arista AG va en continua hasta s, en discontinua de s a K y en continua de K a G; la arista DF va entera en discontinua, y también los lados MN y NK de la sección; r va en discontinua por detrás de la columna, y s en continua. Por delante de s₁, abajo a la derecha, en violeta, la sección abatida con s de charnela: L y M no se mueven, y K y N llegan por la perpendicular a s₁, con (K)(N) paralela a s₁.</desc>
