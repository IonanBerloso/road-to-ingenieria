asignatura: expresion-grafica
convocatoria: hoja
hoja: 53
# El Ejercicio 53 de la Colección de ejercicios de diédrico, págs. 58-60 de
# Coleccin_de_ejercicios.pdf (del 1 al 51 son las láminas SD; del 52 al 55,
# cuatro ejercicios bilingües de varios apartados, que el sitio publica con la
# convocatoria interna `hoja`). El enunciado (pág. 58) es bilingüe, euskera
# arriba y castellano abajo en cada ejercicio, y está dibujado en trazos: no
# tiene capa de texto, y se ha transcrito desde la página renderizada. Las
# figuras están en la 59 (A3 apaisado: el apartado 1 a la izquierda y el 2 a
# la derecha) y en la 60 (el apartado 3, la figura A a la izquierda y la B a
# la derecha, que son la misma).
#
# Tres cosas, dichas antes de que nadie las deduzca:
#
# 1. **NO TIENE FECHA, Y NO SE TITULA EXAMEN.** No dice curso ni día, y de los
#    cuatro ejercicios con que cierra la colección (52-55) solo el 54 se titula
#    «Examen». Este lleva en sus figuras el cajetín de una lámina de clase, en
#    blanco, que no se transcribe. Se publica igual que los otros tres, sin
#    fecha.
#
# 2. **NO TRAE NINGUNA «Nota:» IMPRESA.** Ninguno de sus tres apartados usa
#    `notas`.
#
# 3. **LOS TRES APARTADOS ESTÁN TRANSCRITOS.** Ninguno va en `fuera`.
sinFecha: >-
  Es el Ejercicio 53 de la Colección de ejercicios de diédrico, uno de los
  cuatro con que cierra la colección (del 52 al 55), y ninguno dice de qué
  curso ni de qué día es. Los cuatro son bilingües y traen varios apartados;
  solo el 54 se titula «Examen», y el 53 lleva cajetín de lámina. Por eso va
  sin fecha y sin curso.
# Decisión (8 de octubre de 2026): el PDF de la colección se publica sin
# metadatos de autor, en public/examenes/expresion-grafica/; lo declara la
# colección (src/content/coleccion), y cada apartado enlaza su página junto a
# su fuente. Esta hoja no lleva `pdf` propio: ese PDF son las 66 páginas.
sinPdf: >-
  No se enlaza un PDF propio de esta hoja: está en la Colección de ejercicios,
  cuyo PDF original se abre desde cada apartado en su página, junto a su
  fuente, y desde la página de la colección. El enunciado está transcrito tal
  cual, en su versión en castellano, y cada figura se redibuja desde sus
  coordenadas exactas, a escala 1:1, en la lámina de cada apartado.

# Decisión (9 de octubre de 2026): el reloj del simulacro. La hoja no
# imprime cuánto dura; el dato es de Ionan: unos 40 minutos por cada
# lámina A3 del examen. Esta hoja tiene dos (págs. 59 y 60 del PDF de la
# colección), así que 80. `impresa: false` hace que la página no diga «el
# cuadernillo imprime». La hoja 52 no lo lleva: sus cuatro apartados van
# en cuatro páginas A4, no en láminas A3, y el dato no dice cuánto es eso.
duracion:
  minutos: 80
  impresa: false
  fuente: dato de Ionan, 9 de octubre de 2026, de unos 40 minutos por cada lámina A3 del examen; esta hoja tiene dos, y no imprime su duración

# Cada entrada lleva su `n`, también las que son la única pieza de su
# apartado: el 3 va en dos piezas con `n: 3`, y si unas entradas lo llevaran y
# otras no, `ejerciciosDelCuadernillo` (lib/cuadernillo.ts) contaría solo los `n`
# que hay y la página diría que el ejercicio tiene un solo apartado.
ejercicios:
  - id: exeg-h53-1-la-columna-cortada-por-el-plano-de-r-y-s
    tema: t04-intersecciones
    n: 1
  - id: exeg-h53-2-la-ventana-que-gira-sobre-ab
    tema: t03-metodos-descriptivos
    n: 2
  - id: exeg-h53-3a-el-angulo-entre-los-dos-planos-del-tejado
    tema: t06-angulos
    n: 3
  - id: exeg-h53-3b-el-refuerzo-entre-ad-y-bc
    tema: t05-paralelismo-perpendicularidad-distancias
    n: 3
