asignatura: expresion-grafica
convocatoria: hoja
hoja: 52
# El Ejercicio 52 de la Colección de ejercicios de diédrico: «EJERCICIO 52»,
# págs. 53-57 de Coleccin_de_ejercicios.pdf. Del 1 al 51 la colección son las
# láminas SD, y del 52 al 55, cuatro ejercicios de varios apartados; este es el
# primero. El enunciado (pág. 53) es bilingüe, euskera arriba y castellano
# abajo en cada apartado, con capa de texto; las figuras están en las págs. 54
# a 57, una por apartado, todas A4 sin girar y sin línea de tierra.
#
# Tres cosas, dichas antes de que nadie las deduzca:
#
# 1. **NO TIENE FECHA, Y NO SE TITULA EXAMEN.** No dice curso ni día, y de los
#    cuatro ejercicios de varios apartados con que cierra la colección (52-55)
#    solo el 54 se titula «Examen». Sus figuras llevan la tira «IZENA ABIZENAK /
#    NOMBRE APELLIDOS · DATA / FECHA · NOTA», en blanco, que no se transcribe.
#
# 2. **NO TRAE NINGUNA «Nota:» IMPRESA.** Ningún apartado usa `notas`.
#
# 3. **LOS CUATRO APARTADOS ESTÁN, UNA PIEZA CADA UNO.** El 3 y el 4 se
#    publicaron el 7 de octubre de 2026 con el 1 y el 2 en `fuera`; el 8, la
#    unidad k-ex52b escribió el 1 (el agujero de sección cuadrada
#    perpendicular a la cara ABC, y la cara en verdadera magnitud) y el 2 (el
#    cuadrado que se completa desde su alzado, y el tronco de pirámide), y
#    quitó los dos `fuera`. El 1, el 2 y el 4 son de t05; el 3, de t06.
sinFecha: >-
  Es el Ejercicio 52 de la Colección de ejercicios de diédrico, el primero de
  los cuatro ejercicios de varios apartados con que cierra la colección, del 52
  al 55, y ninguno dice de qué curso ni de qué día es. Los cuatro son
  bilingües, y de ellos solo el 54 se titula «Examen». Por eso va sin fecha y
  sin curso.
# Decisión (8 de octubre de 2026): el PDF de la colección se publica sin
# metadatos de autor, en public/examenes/expresion-grafica/; lo declara la
# colección (src/content/coleccion), y cada apartado enlaza su página junto a
# su fuente. Esta hoja no lleva `pdf` propio: ese PDF son las 66 páginas.
sinPdf: >-
  No se enlaza un PDF propio de esta hoja: está en la Colección de ejercicios,
  cuyo PDF original se abre desde cada apartado en su página, junto a su
  fuente, y desde la página de la colección. El enunciado está transcrito tal
  cual, en su versión en castellano, y la figura de cada apartado publicado se
  redibuja desde sus coordenadas exactas en su lámina.

# Cada entrada lleva su `n`, el número del apartado: si unas lo llevaran y otras
# no, `ejerciciosDelCuadernillo` (lib/cuadernillo.ts) contaría solo los que hay.
ejercicios:
  - id: exeg-h52-1-el-agujero-perpendicular-a-la-cara-abc
    tema: t05-paralelismo-perpendicularidad-distancias
    n: 1
  - id: exeg-h52-2-el-cuadrado-y-el-tronco-de-piramide
    tema: t05-paralelismo-perpendicularidad-distancias
    n: 2
  - id: exeg-h52-3-cuatro-angulos-de-una-piramide
