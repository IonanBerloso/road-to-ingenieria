asignatura: expresion-grafica
convocatoria: hoja
hoja: 52
# El Ejercicio 52 de la Colección de ejercicios de diédrico: «EJERCICIO 52»,
# págs. 53-57 de Coleccin_de_ejercicios.pdf. Del 1 al 51 la colección son las
# láminas SD, y del 52 al 55, cuatro ejercicios de varios apartados; este es el
# primero. El enunciado (pág. 53) es bilingüe, euskera arriba y castellano
# abajo en cada apartado, con capa de texto; las figuras están en las págs. 54
# a 57, una por apartado, todas A4 sin girar y sin línea de tierra.
#
# Tres cosas, dichas antes de que nadie las deduzca:
#
# 1. **NO TIENE FECHA, Y NO SE TITULA EXAMEN.** No dice curso ni día, y de los
#    cuatro ejercicios de varios apartados con que cierra la colección (52-55)
#    solo el 54 se titula «Examen». Sus figuras llevan la tira «IZENA ABIZENAK /
#    NOMBRE APELLIDOS · DATA / FECHA · NOTA», en blanco, que no se transcribe.
#
# 2. **NO TRAE NINGUNA «Nota:» IMPRESA.** Ningún apartado usa `notas`.
#
# 3. **LOS APARTADOS 1 Y 2 VAN EN `fuera`.** El 1 (el agujero de sección
#    cuadrada perpendicular a la cara ABC) y el 2 (el cuadrado que se completa
#    desde su alzado y el tronco de pirámide) los escribe otra unidad de la fase
#    K, k-ex52b, que parte de estas copias y quita los dos `fuera`. El motivo es
#    de calendario: el corrector ya construye lo que piden (el cuadrado en un
#    plano oblicuo, como en la 53·2; las aristas que atraviesan un sólido, como
#    en la 54·1a). Se publica antes, el 7 de octubre de 2026, porque el 3 y el
#    4 entran en el examen de noviembre, y los motivos lo dicen así. El 3 (t06)
#    y el 4 (t05) van enteros, una pieza cada uno.
sinFecha: >-
  Es el Ejercicio 52 de la Colección de ejercicios de diédrico, el primero de
  los cuatro ejercicios de varios apartados con que cierra la colección, del 52
  al 55, y ninguno dice de qué curso ni de qué día es. Los cuatro son
  bilingües, y de ellos solo el 54 se titula «Examen». Por eso va sin fecha y
  sin curso.
# Decisión: la colección lleva metadatos de autor rellenos, y hasta que se
# decida cómo publicar un PDF limpio, los ejercicios 52-55 no enlazan PDF.
sinPdf: >-
  No se enlaza el PDF de la colección: el original lleva metadatos que hay que
  limpiar antes de publicarlo. El enunciado está transcrito tal cual, en su
  versión en castellano, y la figura de cada apartado publicado se redibuja
  desde sus coordenadas exactas en su lámina.

# Cada entrada lleva su `n`, el número del apartado: si unas lo llevaran y otras
# no, `ejerciciosDelCuadernillo` (lib/cuadernillo.ts) contaría solo los que hay.
ejercicios:
  - id: exeg-h52-3-cuatro-angulos-de-una-piramide
    tema: t06-angulos
    n: 3
  - id: exeg-h52-4-la-chapa-paralela-a-25-mm
    tema: t05-paralelismo-perpendicularidad-distancias
    n: 4
fuera:
  - n: 1
    motivo: >-
      Pide dibujar el agujero que atraviesa la pieza de un lado a otro,
      perpendicular a la cara oblicua ABC, de sección cuadrada y con un lado,
      DE, dado, y la verdadera magnitud de esa cara. Hay que completar el
      cuadrado en la cara y seguir cada arista del agujero a través del sólido
      hasta donde sale. Aún no está escrito: llegará junto con el apartado 2.
  - n: 2
    motivo: >-
      Pide completar las proyecciones de un cuadrado del que se da el alzado
      entero y, en la planta, solo el lado AB, el más alejado del plano
      vertical; y después las del tronco de pirámide regular que lo tiene por
      base inferior, con la base superior de lado mitad y 40 mm de altura. Aún
      no está escrito: llegará junto con el apartado 1.
