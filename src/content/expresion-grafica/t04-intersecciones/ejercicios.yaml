          - segmento2(proy_planta(solucion.i3), proy_alzado(solucion.i3))
          - segmento2(proy_planta(solucion.i4), proy_alzado(solucion.i4))
          - segmento2(proy_planta(solucion.i5), proy_alzado(solucion.i5))
          - segmento2(proy_planta(solucion.i6), proy_alzado(solucion.i6))
          - segmento2(proy_planta(solucion.i7), proy_alzado(solucion.i7))
          - segmento2(proy_planta(solucion.i8), proy_alzado(solucion.i8))
        construccion:
          - con: regla
            traza: '[segmento2(figura.punto("Kx1"), figura.punto("Px1")), segmento2(figura.punto("Lx1"), figura.punto("Qx1")), segmento2(figura.punto("Mx1"), figura.punto("Rx1")), segmento2(figura.punto("Nx1"), figura.punto("Sx1")), segmento2(figura.punto("Bx1"), figura.punto("Fx1")), segmento2(figura.punto("Cx1"), figura.punto("Gx1"))]'
            porque: |
              **Las aristas, completas.** En la planta, con la regla, cada arista del canal y las dos de la coronación
