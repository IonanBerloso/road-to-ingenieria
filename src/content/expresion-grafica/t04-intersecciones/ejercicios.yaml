            tipo: visto
            porque: 'De D₂ a I₂ nada tapa DE: hasta C₂A₂ queda fuera del alzado de ABC, y de ahí a I va por delante de esa placa. En el cruce aparente con C₂A₂, DE va 19,0 mm más cerca de quien mira.'
          - traza: segmento2(proy_alzado(solucion.I), solucion.x_DE_AB2)
            tipo: oculto
            porque: 'En I, DE pasa detrás de ABC, que la tapa hasta su borde, A₂B₂: en el cruce aparente, AB va 13,0 mm más cerca de quien mira.'
          - traza: segmento2(solucion.x_DE_AB2, figura.punto("E2"))
            tipo: visto
            porque: 'Del cruce con A₂B₂ a E₂, DE sale del alzado de ABC: nada la tapa.'
        trazado:
          - segmento2(solucion.M2, solucion.N2)
          - segmento2(solucion.P2, solucion.Q2)
        construccion:
          - con: marca
            traza: solucion.M1
            rotulo: M₁
            porque: |
              **El extremo I.** El plano vertical que contiene la arista DE se ve, en la planta, como la
              recta D₁E₁, y corta los lados de ABC donde D₁E₁ los cruza. M₁, donde D₁E₁ cruza A₁B₁: M es el
              punto de AB que está en ese plano. M, N, P y Q son nombres nuestros, como I y J.
          - con: marca
            traza: solucion.N1
            rotulo: N₁
            porque: |
              N₁, donde D₁E₁ cruza C₁A₁: N es el punto de CA que está en el plano vertical de DE.
          - con: escuadra-cartabon
            traza: '[segmento2(solucion.M1, solucion.L_M2), segmento2(solucion.N1, solucion.L_N2)]'
            porque: |
              Por M₁ y por N₁, las verticales hacia el alzado, largas, hasta pasar A₂B₂ y C₂A₂: M está en AB
              y N en CA, y sus alzados caen en esos lados.
          - con: marca
            traza: solucion.M2
            rotulo: M₂
            porque: |
              M₂, donde la vertical de M₁ corta A₂B₂.
          - con: marca
            traza: solucion.N2
            rotulo: N₂
            porque: |
              N₂, donde la vertical de N₁ corta C₂A₂.
          - con: regla
            traza: segmento2(solucion.M2, solucion.N2)
            porque: |
              M₂N₂ es el alzado de la recta en que el plano vertical de DE corta a ABC. Esa recta y DE están
              en el mismo plano vertical, así que se cortan de verdad, y no en un cruce aparente.
          - con: marca
            traza: proy_alzado(solucion.I)
            rotulo: I₂
            porque: |
              I₂, donde M₂N₂ corta D₂E₂: el punto donde la arista DE atraviesa el triángulo ABC.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(solucion.I), solucion.L_I1)
            porque: |
              Por I₂, la vertical hacia la planta, hasta pasar D₁E₁.
          - con: marca
            traza: proy_planta(solucion.I)
            rotulo: I₁
            porque: |
              I₁, donde la vertical de I₂ corta D₁E₁.
          - con: marca
            traza: solucion.P1
            rotulo: P₁
            porque: |
              **El extremo J**, igual, con el plano vertical que contiene la arista BC: en la planta es la
              recta B₁C₁. P₁, donde B₁C₁ cruza F₁D₁: P es el punto de FD que está en ese plano.
          - con: marca
            traza: solucion.Q1
            rotulo: Q₁
            porque: |
              Q₁, donde B₁C₁ cruza E₁F₁: Q es el punto de EF que está en el plano vertical de BC.
          - con: escuadra-cartabon
            traza: '[segmento2(solucion.P1, solucion.L_P2), segmento2(solucion.Q1, solucion.L_Q2)]'
            porque: |
              Por P₁ y por Q₁, las verticales hacia el alzado, largas, hasta pasar F₂D₂ y E₂F₂.
          - con: marca
            traza: solucion.P2
            rotulo: P₂
            porque: |
              P₂, donde la vertical de P₁ corta F₂D₂.
          - con: marca
            traza: solucion.Q2
            rotulo: Q₂
            porque: |
              Q₂, donde la vertical de Q₁ corta E₂F₂.
          - con: regla
            traza: segmento2(solucion.P2, solucion.Q2)
            porque: |
              P₂Q₂, el alzado de la recta en que el plano vertical de BC corta a DEF.
          - con: marca
            traza: proy_alzado(solucion.J)
            rotulo: J₂
            porque: |
              J₂, donde P₂Q₂ corta B₂C₂: el punto donde la arista BC atraviesa el triángulo DEF.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(solucion.J), solucion.L_J1)
            porque: |
              Por J₂, la vertical hacia la planta, hasta pasar B₁C₁.
          - con: marca
            traza: proy_planta(solucion.J)
            rotulo: J₁
            porque: |
              J₁, donde la vertical de J₂ corta B₁C₁.
          - con: arista-vista
            traza: '[segmento2(proy_planta(solucion.I), proy_planta(solucion.J)), segmento2(figura.punto("B1"), proy_planta(solucion.J)), segmento2(solucion.Q1, figura.punto("C1")), segmento2(figura.punto("C1"), solucion.x_CA_EF1), segmento2(solucion.N1, figura.punto("A1")), segmento2(figura.punto("D1"), solucion.M1), segmento2(proy_planta(solucion.I), figura.punto("E1")), segmento2(figura.punto("F1"), solucion.P1), segmento2(solucion.x_FD_AB1, figura.punto("D1"))]'
            porque: |
              **A limpio, la planta.** Desde arriba se ve lo que va más alto. I₁J₁, en continua: está en las
              dos placas. Y en continua lo que de cada arista queda fuera de la otra placa o por encima de
              ella: DE de I a E, que en I atraviesa ABC hacia arriba, y BC de B a J, que en J atraviesa DEF
              hacia abajo.
          - con: arista-oculta
            traza: '[segmento2(proy_planta(solucion.J), solucion.Q1), segmento2(solucion.x_CA_EF1, solucion.N1), segmento2(solucion.M1, proy_planta(solucion.I)), segmento2(solucion.P1, solucion.x_FD_AB1)]'
            porque: |
              A trazos, lo que queda debajo de la otra placa: BC de J hasta E₁F₁ y CA entre E₁F₁ y D₁E₁,
              debajo de DEF; DE de A₁B₁ hasta I y FD entre B₁C₁ y A₁B₁, debajo de ABC. Cada tramo empieza y
              acaba en un cruce aparente o en I o J.
          - con: arista-vista
            traza: '[segmento2(proy_alzado(solucion.I), proy_alzado(solucion.J)), segmento2(figura.punto("B2"), proy_alzado(solucion.J)), segmento2(solucion.x_BC_FD2, figura.punto("C2")), segmento2(figura.punto("C2"), solucion.x_CA_FD2), segmento2(solucion.x_CA_DE2, figura.punto("A2")), segmento2(figura.punto("D2"), proy_alzado(solucion.I)), segmento2(solucion.x_DE_AB2, figura.punto("E2"))]'
            porque: |
              **El alzado.** Se ve lo que va más cerca de quien mira, lo de más alejamiento. I₂J₂, en
              continua; BC de B a J, por delante de DEF; DE de D a I, por delante de ABC; y lo que de BC, CA
              y DE queda fuera de la otra placa.
          - con: arista-oculta
            traza: '[segmento2(proy_alzado(solucion.J), solucion.x_BC_FD2), segmento2(solucion.x_CA_FD2, solucion.x_CA_DE2), segmento2(proy_alzado(solucion.I), solucion.x_DE_AB2)]'
            porque: |
              A trazos, lo que queda detrás: BC de J hasta F₂D₂ y CA entre F₂D₂ y D₂E₂, detrás de DEF; y DE
              de I hasta A₂B₂, detrás de ABC. AB, EF y FD se ven enteras en el alzado, y ya están
              dibujadas.
        pista: |
          (1) En la planta, D₁E₁ cruza A₁B₁ en M₁ y C₁A₁ en N₁: es el plano vertical de DE cortando ABC.
          (2) Sube M y N a A₂B₂ y C₂A₂; M₂N₂ corta D₂E₂ en I₂, e I₁ está debajo, en D₁E₁. (3) Igual con BC:
          B₁C₁ cruza F₁D₁ en P₁ y E₁F₁ en Q₁; P₂Q₂ corta B₂C₂ en J₂. (4) Para lo que se ve: en cada cruce
          aparente, mira cuál de las dos aristas va más alta (planta) o más cerca de ti (alzado); y en I y
          en J la arista atraviesa la otra placa y cambia de lado.
        desarrollo: |
          En verde claro, las dos rectas auxiliares del alzado, M₂N₂ y P₂Q₂, y el segmento IJ en las dos
          vistas, con lo oculto a trazos. Las dos placas se atraviesan: en la planta, ABC va por encima de
          DEF del lado de AB, y DEF por encima de ABC del lado de EF; en el alzado, DE y BC pasan de delante
          a detrás de la otra placa en I y en J.

      - tipo: calcular
        titulo: La longitud del segmento de intersección
        pregunta: Como pregunta nuestra, ¿cuánto mide de verdad IJ, el segmento en que se cortan las dos placas?
        respuesta:
          tipo: numero
          valor: '28.94'
          receta: largo_mm
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '44.57'
            receta: en_mm(vm(solucion.K, solucion.J))
            mensaje: |
              Eso es KJ, lo que de la recta común de los dos planos está dentro de ABC. K, donde AB corta el
              plano DEF, cae fuera del triángulo DEF: ahí las placas no se tocan. El segmento común empieza
              en I, donde DE atraviesa ABC.
          - valor: '64.95'
            receta: en_mm(vm(solucion.I, solucion.L))
            mensaje: |
              Eso es IL, lo que de la recta común está dentro de DEF. L, donde EF corta el plano ABC, cae
              fuera del triángulo ABC: el segmento común se acaba antes, en J.
          - valor: '80.58'
            receta: en_mm(vm(solucion.K, solucion.L))
            mensaje: |
              Eso es KL, de donde AB corta el plano DEF a donde EF corta el plano ABC. Los dos puntos están en
              la recta común de los planos, pero fuera del otro triángulo. Los extremos del segmento común
              son I y J.
        pista: |
          IJ no es horizontal ni frontal: su verdadera magnitud sale del triángulo del tema 2, con I₁J₁ de
          un cateto y la diferencia de cotas de I₂ y J₂ del otro.
        desarrollo: |
          Con el triángulo de la verdadera magnitud, la planta y la diferencia de cotas:

          $$ \overline{IJ} = \sqrt{\overline{I_1J_1}^{\,2} + \Delta z^{2}} = \sqrt{28{,}85^{2} + 2{,}38^{2}} \approx 28{,}94 \text{ mm} $$

          Aquí medir en una vista da casi lo mismo, por casualidad: I₁J₁ mide 28,85 mm, e I₂J₂, 28,93, y
          los dos caen dentro de la tolerancia. Es porque IJ es casi horizontal y casi frontal: baja 2,38 mm
          y se aleja 0,92 mm de quien mira. En general, una proyección acorta, y la longitud se saca con el
          triángulo. En la construcción hay otras dos medidas que dan lo mismo sin serlo: P₁Q₁, en la
          planta, 28,94 mm, y de D₁ a N₁, 29,20. Ninguna es IJ.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: Los extremos del segmento común están donde una arista de un triángulo atraviesa el otro triángulo, por dentro; aquí, DE atraviesa ABC, y BC atraviesa DEF.
          - texto: El plano vertical que contiene cada arista corta al otro triángulo en una recta, que en la planta va sobre la arista y se sube al alzado por sus dos puntos en los lados.
          - texto: Esa recta y la arista están en el mismo plano y se cortan de verdad, en I₂ y en J₂; I₁ y J₁ bajan por su vertical.
          - texto: Una arista cambia de vista a oculta solo en un cruce aparente, donde manda la que va delante, o donde atraviesa la otra placa, en I o en J.
          - texto: I₂ es el cruce de D₂E₂ con A₂B₂, porque ahí se cortan en el alzado la arista DE y el borde de ABC.
            trampa: true
            mensaje: |
              Ese es un cruce aparente: en el espacio AB pasa 13,0 mm por delante de DE, y no se tocan. I sale
              de la recta auxiliar M₂N₂, que sí está en el plano de DE.
    resolucion: |
      **Qué se busca.** Los dos triángulos se cortan en un segmento de la recta común de sus planos.
      Sobre esa recta, ABC ocupa el tramo de K, donde AB corta el plano DEF, a J, donde BC lo corta; y
      DEF, el de I, donde DE corta el plano ABC, a L, donde lo corta EF. El segmento común es el tramo
      que comparten, IJ: la recta sale de ABC por J antes de salir de DEF, y entra en DEF por I después
      de haber entrado en ABC. Sus extremos son los puntos donde una arista de un triángulo atraviesa el
      otro: DE atraviesa ABC en I, y BC atraviesa DEF en J.

      **Los extremos.** Cada uno, con el plano vertical que contiene la arista. El de DE corta los lados
      de ABC donde D₁E₁ los cruza en la planta, en M₁ y N₁; subidos a A₂B₂ y C₂A₂, M₂N₂ corta D₂E₂ en
      I₂. El de BC corta DEF en P₁ y Q₁; P₂Q₂ corta B₂C₂ en J₂. I₁ y J₁ bajan por su vertical.

      **Lo que se ve.** Tomamos las dos placas opacas. Una arista solo cambia de vista a oculta en un
      cruce aparente con otra, donde se ve la que va delante (más cota en la planta, más alejamiento en
      el alzado), o donde atraviesa la otra placa. En la planta, DE y FD pasan por debajo de ABC del lado
      de AB, y BC y CA por debajo de DEF del lado de EF. En el alzado, BC y CA quedan en parte detrás de
      DEF, y DE detrás de ABC de I a A₂B₂. Con planos transparentes, todo iría en continua.

      **La longitud.** IJ mide 28,94 mm en verdadera magnitud. Por casualidad, su planta y su alzado
      miden casi lo mismo, 28,85 y 28,93 mm, porque IJ es casi horizontal y casi frontal.

  - id: sd33-la-interseccion-con-una-arista-de-perfil
    titulo: La intersección de los triángulos ABC y DEF, con la arista FD de perfil
    fuente: Ejercicio 25 (SD33) · Colección de ejercicios de Geometría Descriptiva, Sistema Diédrico Directo · Dpto. de Expresión Gráfica y Proyectos de Ingeniería, EIG · UPV/EHU
    nivel: practica
    # Decisión: el texto impreso tal cual, cotejado con la página (pág. 26): es
    # palabra por palabra el del Ejercicio 24, con otra figura. Los triángulos se
    # toman opacos, como allí. I, J, K, M, N, P, R y S son nombres nuestros.
    enunciado: |
      Representar la intersección entre los planos ABC y DEF.

      **Notas nuestras.** El enunciado es el mismo que el del Ejercicio 24, con otra figura: los
      triángulos ABC y DEF en el alzado, arriba, y en la planta, debajo, sin línea de tierra. La hoja
      no da escala: las longitudes van en milímetros de la lámina. D₁F₁ y D₂F₂ caen en la misma
      vertical: FD es una recta de perfil. DE es frontal, D₁E₁ es horizontal en el papel, y A₁ está en
      su prolongación: A tiene el alejamiento de D y de E. Llamamos I y J a los extremos del segmento
      en que se cortan los triángulos. Como en el Ejercicio 24, tomamos los dos triángulos como placas
      opacas, que el enunciado no lo dice; con planos transparentes, todas las aristas irían en
      continua. K, M, N, P, R y S, los demás puntos de la construcción, también son nombres nuestros. Si se leyeran como planos sin borde, su intersección sería la
      recta entera, de la que IJ es el trozo que comparten los dos triángulos.
    pide: Los dos extremos del segmento en que se cortan los triángulos, en las dos vistas, y lo visto y lo oculto de los dos, que tomamos opacos; y, como pregunta nuestra, la longitud de ese segmento en verdadera magnitud.
    receta:
      lamina: sd33
      escena:
        A: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("A1"))'
        B: 'punto3(alzado: figura.punto("B2"), planta: figura.punto("B1"))'
        C: 'punto3(alzado: figura.punto("C2"), planta: figura.punto("C1"))'
        D: 'punto3(alzado: figura.punto("D2"), planta: figura.punto("D1"))'
        E: 'punto3(alzado: figura.punto("E2"), planta: figura.punto("E1"))'
        F: 'punto3(alzado: figura.punto("F2"), planta: figura.punto("F1"))'
        abc: plano(A, B, C)
        def: plano(D, E, F)
      solucion:
        # Los extremos: EF y FD atraviesan ABC, en I y en J; DEF asoma por el
        # otro lado de ABC con su vértice F. En la recta común de los dos
        # planos, ABC va de S, en CA, a K, en AB, y DEF de I a J, que están
        # entre los dos: el tramo común es IJ, entero dentro de DEF. K cae a
        # 1,4 mm de J, fuera de DEF.
        I: corte_recta_plano(recta3(E, F), abc)
        J: corte_recta_plano(recta3(F, D), abc)
        K: corte_recta_plano(recta3(A, B), def)
        S: corte_recta_plano(recta3(C, A), def)
        largo_mm: en_mm(vm(I, J))
        # Decisión: I, con el plano vertical que contiene EF, que corta a ABC en
        # MN (M en AB y N en CA). El plano vertical de FD es el de perfil y no
        # da J: su recta de corte con ABC cae en el alzado encima de D₂F₂. J
        # sale de la recta común IK, con K por el plano vertical de AB, que
        # corta a DEF en RP: P en EF, con la planta de M (M₁ es el cruce de
        # A₁B₁ con E₁F₁), y R en la recta DE prolongada, en la vertical de A,
        # porque A₁ está en la prolongación de D₁E₁. I₂K₂ corta D₂F₂ en J₂, e
        # I₁K₁ corta D₁F₁ en J₁: la recta común y FD están las dos en DEF.
        M1: 'cruce_aparente(figura.segmento("EF1"), figura.segmento("AB1"))'
        N1: 'cruce_aparente(figura.segmento("EF1"), figura.segmento("CA1"))'
        M2: 'cruce_aparente(segmento2(M1, desplaza(M1, dy: -10)), figura.segmento("AB2"))'
        N2: 'cruce_aparente(segmento2(N1, desplaza(N1, dy: -10)), figura.segmento("CA2"))'
        P2: 'cruce_aparente(segmento2(M1, desplaza(M1, dy: -10)), figura.segmento("EF2"))'
        R2: 'cruce_aparente(figura.segmento("DE2"), segmento2(figura.punto("A2"), desplaza(figura.punto("A2"), dy: -10)))'
        # La visibilidad: los cruces aparentes donde una arista cambia de vista
        # a oculta; los demás cambios son I y J. M1 y N1 también lo son.
        x_CA_FD1: 'cruce_aparente(figura.segmento("CA1"), figura.segmento("FD1"))'
        x_FD_AB1: 'cruce_aparente(figura.segmento("FD1"), figura.segmento("AB1"))'
        x_AB_FD2: 'cruce_aparente(figura.segmento("AB2"), figura.segmento("FD2"))'
        x_AB_DE2: 'cruce_aparente(figura.segmento("AB2"), figura.segmento("DE2"))'
        x_BC_DE2: 'cruce_aparente(figura.segmento("BC2"), figura.segmento("DE2"))'
        x_BC_EF2: 'cruce_aparente(figura.segmento("BC2"), figura.segmento("EF2"))'
        x_EF_CA2: 'cruce_aparente(figura.segmento("EF2"), figura.segmento("CA2"))'
        x_FD_CA2: 'cruce_aparente(figura.segmento("FD2"), figura.segmento("CA2"))'
        # Los extremos de las rectas largas.
        L_M2: 'desplaza(M2, dy: mm(-4))'
        L_N2: 'desplaza(N2, dy: mm(-4))'
        L_I1: 'desplaza(proy_planta(I), dy: mm(4))'
        L_R: 'uno(medir_sobre(figura.segmento("DE2"), desde: R2, distancia: mm(4)), 2)'
        L_RA: 'desplaza(R2, dy: mm(-4))'
        L_K1: 'desplaza(proy_planta(K), dy: mm(4))'
      comprueba:
        - en_plano(I, abc)
        - en_plano(I, def)
        - en_plano(J, abc)
        - en_plano(J, def)
        - en_plano(K, def)
        - en_recta(I, recta3(E, F))
        - en_recta(J, recta3(F, D))
        - en_recta(K, recta3(A, B))
        - en_recta(J, recta3(I, K))
    pasos:
      - tipo: reconocer
        pregunta: FD es una recta de perfil, con D₁F₁ y D₂F₂ en la misma vertical. Con solo el alzado y la planta, ¿sirve el plano vertical que contiene FD para hallar dónde atraviesa FD el triángulo ABC?
        opciones:
          - texto: Sí, como con cualquier arista, subiendo al alzado los cruces de D₁F₁ con A₁B₁ y C₁A₁
            mensaje: |
              Con una arista cualquiera, sí; con esta, no. El plano vertical de FD es un plano de perfil, y
              los alzados de esos dos puntos caen en la vertical de D₂F₂, encima de ella. Su recta es la
              propia D₂F₂, y no la corta en un punto.
          - texto: No, porque ese plano es el de perfil, y la recta en que corta a ABC cae en el alzado encima de D₂F₂, sin cortarla en un punto
            correcta: true
            mensaje: |
              Eso es. El plano proyectante de una recta de perfil es el de perfil, que se ve como la misma
              vertical en las dos vistas: la recta que corta en ABC cae encima de D₂F₂. J sale de otra
              manera, con la recta común de los dos planos: pasa por I y por otro punto, y corta FD en J.
          - texto: No hace falta ningún plano, porque J₂ es el cruce de D₂F₂ con A₂B₂ y J₁, el de D₁F₁ con A₁B₁
            mensaje: |
              Esos son cruces aparentes. Los dos son las vistas de un mismo punto de AB, el que está en el
              plano de perfil de FD, pero ese punto no es de FD: en la planta AB pasa 3,9 mm por encima de
              FD, y en el alzado, 3,8 mm por detrás.

      - tipo: construir
        titulo: Los extremos del segmento, y lo que se ve
        intro: |
          Llamamos I al punto donde la arista EF atraviesa ABC, y J al punto donde lo atraviesa FD: los
          dos extremos del segmento común están en aristas de DEF. I sale como en el Ejercicio 24, con
          el plano vertical que contiene EF, que corta a ABC en la recta MN. Con FD no sirve: es de
          perfil, y su plano vertical también, y la recta que corta en ABC cae en el alzado encima de
          D₂F₂. J sale de la recta común de los dos planos, que pasa por I y por K, el punto donde AB
          corta el plano DEF. K, con el plano vertical de AB: corta a DEF en la recta RP, con P en EF, en
          la vertical de M₁, y R en la recta DE prolongada, en la vertical de A, porque A₁ cae en la
          prolongación de D₁E₁. Marca I y J en las dos vistas.

          Después, pasa a limpio con «arista vista» y «arista oculta» el segmento IJ y los tramos de las
          aristas que cambian de vista a oculta; las que se ven enteras ya están dibujadas: AB, BC y DE en
          la planta, y CA y DE en el alzado. Tomamos los dos triángulos como placas opacas, que el
          enunciado no lo dice. J₁ cae a 1,3 mm de K₁ y a 1,7 del cruce aparente de D₁F₁ con A₁B₁, y J₂ a
          1,4 mm de K₂ y a 2,2 del cruce aparente de D₂F₂ con A₂B₂: amplía con la lupa (×4) antes de
          marcarlos. El tramo oculto de FD en la planta
          mide 1,7 mm.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, visto, oculto, borrar]
        tolerancia: 1
        objetivos:
          - nombre: I2
            pide: I, donde la arista EF atraviesa el triángulo ABC, en el alzado
            es: proy_alzado(solucion.I)
            bien: |
              I₂ está en E₂F₂, donde la corta M₂N₂: la recta en que el plano vertical de EF corta a ABC.
            diagnosticos:
              - si: cerca_de(solucion.x_EF_CA2)
                mensaje: |
                  Ese es el cruce aparente de E₂F₂ con C₂A₂: en el alzado se tapan, pero en el espacio CA pasa
                  37,2 mm por delante de EF sin tocarla. I sale del plano auxiliar: la recta M₂N₂.
                ejemplo: solucion.x_EF_CA2
              - si: cerca_de(solucion.x_BC_EF2)
                mensaje: |
                  Ese es el cruce aparente de E₂F₂ con B₂C₂: EF pasa ahí 28,9 mm por delante de BC, sin
                  tocarla. I está donde E₂F₂ corta M₂N₂.
                ejemplo: solucion.x_BC_EF2
              - si: '!en_recta(figura.segmento("EF2"))'
                mensaje: |
                  I es un punto de la arista EF: I₂ va **en E₂F₂**, donde la corta la recta M₂N₂.
                ejemplo: 'desplaza(proy_alzado(solucion.I), dy: mm(-6))'
              - si: siempre
                mensaje: |
                  Estás en E₂F₂, pero no donde la corta M₂N₂. M₂ y N₂ son los alzados de los puntos donde
                  E₁F₁ cruza A₁B₁ y C₁A₁ en la planta, subidos por su vertical hasta A₂B₂ y C₂A₂.
          - nombre: I1
            pide: I, en la planta
            es: proy_planta(solucion.I)
            bien: |
              I₁ está en E₁F₁, en la vertical de I₂.
            diagnosticos:
              - si: cerca_de(solucion.M1)
                mensaje: |
                  Ese es M₁, donde E₁F₁ cruza A₁B₁: un cruce aparente de la planta, y el punto de AB que corta
                  el plano auxiliar. I₁ baja de I₂ por su vertical.
                ejemplo: solucion.M1
              - si: cerca_de(solucion.N1)
                mensaje: |
                  Ese es N₁, donde E₁F₁ cruza C₁A₁: otro cruce aparente, y el punto de CA que corta el plano
                  auxiliar. I₁ baja de I₂ por su vertical.
                ejemplo: solucion.N1
              - si: '!en_vertical_de(I2)'
                mensaje: |
                  I₁ va en la **vertical de I₂**: es el mismo punto visto dos veces.
                ejemplo: 'desplaza(proy_planta(solucion.I), dx: mm(6))'
              - si: '!en_recta(figura.segmento("EF1"))'
                mensaje: |
                  I está en la arista EF: I₁ va donde la vertical de I₂ corta **E₁F₁**.
                ejemplo: 'desplaza(proy_planta(solucion.I), dy: mm(8))'
              - si: siempre
                mensaje: |
                  I₁ está donde la vertical de I₂ corta E₁F₁.
          - nombre: J2
            pide: J, donde la arista FD atraviesa el triángulo ABC, en el alzado
            es: proy_alzado(solucion.J)
            bien: |
              J₂ está en D₂F₂, donde la corta I₂K₂, la recta común de los dos planos. Esa recta y FD están
              las dos en el plano DEF, así que se cortan de verdad.
            diagnosticos:
              - si: cerca_de(proy_alzado(solucion.K))
                mensaje: |
                  Ese es K₂, donde AB corta el plano DEF. Está en la recta común de los dos planos, a 1,4 mm de
                  J, pero fuera del triángulo DEF, al otro lado de FD. J está en FD: donde I₂K₂ corta D₂F₂.
                ejemplo: proy_alzado(solucion.K)
              - si: cerca_de(solucion.x_AB_FD2)
                mensaje: |
                  Ese es el cruce aparente de D₂F₂ con A₂B₂: FD pasa ahí 3,8 mm por delante de AB, sin tocarla.
                  J está donde D₂F₂ corta I₂K₂, la recta común de los dos planos.
                ejemplo: solucion.x_AB_FD2
              - si: cerca_de(solucion.x_FD_CA2)
                mensaje: |
                  Ese es el cruce aparente de D₂F₂ con C₂A₂: CA pasa ahí 44,0 mm por delante de FD. J está donde
                  D₂F₂ corta I₂K₂.
                ejemplo: solucion.x_FD_CA2
              - si: '!en_recta(figura.segmento("FD2"))'
                mensaje: |
                  J es un punto de la arista FD: J₂ va **en D₂F₂**, donde la corta la recta común I₂K₂.
                ejemplo: 'desplaza(proy_alzado(solucion.J), dx: mm(5))'
              - si: siempre
                mensaje: |
                  Estás en D₂F₂, pero no donde la corta I₂K₂. K es el punto donde AB corta el plano DEF: con el
                  plano vertical de AB, que corta DEF en la recta R₂P₂.
          - nombre: J1
            pide: J, en la planta
            es: proy_planta(solucion.J)
            bien: |
              J₁ está en D₁F₁, donde la corta I₁K₁. No sale de la vertical de J₂: con FD de perfil, esa
              vertical es D₁F₁ entera.
            diagnosticos:
              - si: cerca_de(proy_planta(solucion.K))
                mensaje: |
                  Ese es K₁, donde AB corta el plano DEF, a 1,3 mm de J₁ pero fuera del triángulo DEF. J está en
                  FD: donde I₁K₁ corta D₁F₁.
                ejemplo: proy_planta(solucion.K)
              - si: cerca_de(solucion.x_FD_AB1)
                mensaje: |
                  Ese es el cruce aparente de D₁F₁ con A₁B₁: AB pasa ahí 3,9 mm por encima de FD, sin tocarla.
                  J₁ está donde D₁F₁ corta I₁K₁.
                ejemplo: solucion.x_FD_AB1
              - si: cerca_de(solucion.x_CA_FD1)
                mensaje: |
                  Ese es el cruce aparente de D₁F₁ con C₁A₁: FD pasa ahí 44,7 mm por encima de CA. J₁ está donde
                  D₁F₁ corta I₁K₁.
                ejemplo: solucion.x_CA_FD1
              - si: '!en_recta(figura.segmento("FD1"))'
                mensaje: |
                  J está en la arista FD: J₁ va **en D₁F₁**.
                ejemplo: 'desplaza(proy_planta(solucion.J), dx: mm(5))'
              - si: siempre
                mensaje: |
                  Estás en D₁F₁, pero J₁ no se saca bajando J₂ por su vertical: FD es de perfil, y esa vertical
                  es D₁F₁ entera. J₁ está donde I₁K₁, la planta de la recta común, corta D₁F₁.
        # Decisión: los triángulos, opacos (lo dicen las Notas nuestras). La
        # visibilidad sale de un cálculo de líneas ocultas aparte, por rayos
        # contra las dos placas; cada cambio, en el cruce aparente que dice su
        # tramo o en I o J. Las aristas que se ven enteras y ya están en la
        # lámina no son tramos: AB, BC y DE en la planta, y CA y DE en el
        # alzado.
        tramos:
          - traza: segmento2(proy_planta(solucion.I), proy_planta(solucion.J))
            tipo: visto
            porque: 'IJ está en las dos placas a la vez: desde arriba no la tapa ninguna.'
          - traza: segmento2(figura.punto("C1"), solucion.N1)
            tipo: visto
            porque: 'De C₁ al cruce con E₁F₁, CA queda fuera de la planta de DEF: desde arriba nada la tapa.'
          - traza: segmento2(solucion.N1, solucion.x_CA_FD1)
            tipo: oculto
            porque: 'Entre los cruces con E₁F₁ y F₁D₁, CA pasa por debajo de DEF, que la tapa desde arriba: en el primero EF va 15,4 mm más alta, y en el segundo FD, 44,7.'
          - traza: segmento2(solucion.x_CA_FD1, figura.punto("A1"))
            tipo: visto
            porque: 'Del cruce con F₁D₁ a A₁, CA queda fuera de la planta de DEF: desde arriba nada la tapa.'
          - traza: segmento2(figura.punto("E1"), proy_planta(solucion.I))
            tipo: visto
            porque: 'De E₁ a I₁ nada tapa EF desde arriba: hasta C₁A₁ queda fuera de la planta de ABC, y de ahí a I va por encima de esa placa. En el cruce aparente con C₁A₁, EF va 15,4 mm más alta que CA.'
          - traza: segmento2(proy_planta(solucion.I), solucion.M1)
            tipo: oculto
            porque: 'En I, EF atraviesa ABC y pasa por debajo: de I₁ al cruce con A₁B₁, el borde de ABC, la tapa esa placa. En el cruce aparente, AB va 35,6 mm más alta que EF.'
          - traza: segmento2(solucion.M1, figura.punto("F1"))
            tipo: visto
            porque: 'Del cruce con A₁B₁ a F₁, EF sale de debajo de ABC: desde arriba nada la tapa.'
          - traza: segmento2(figura.punto("F1"), solucion.x_FD_AB1)
            tipo: visto
            porque: 'De F₁ al cruce con A₁B₁, FD queda fuera de la planta de ABC: desde arriba nada la tapa.'
          - traza: segmento2(solucion.x_FD_AB1, proy_planta(solucion.J))
            tipo: oculto
            porque: 'Del cruce con A₁B₁ hasta J, FD va por debajo de ABC, que la tapa desde arriba: en el cruce aparente, AB va 3,9 mm más alta que FD. Es un tramo corto, de 1,7 mm.'
          - traza: segmento2(proy_planta(solucion.J), figura.punto("D1"))
            tipo: visto
            porque: 'En J, FD atraviesa ABC y pasa por encima: de J₁ a D₁ desde arriba nada la tapa. En el cruce aparente con C₁A₁, FD va 44,7 mm más alta que CA.'
          - traza: segmento2(proy_alzado(solucion.I), proy_alzado(solucion.J))
            tipo: visto
            porque: 'IJ está en las dos placas a la vez: por delante no la tapa ninguna.'
          - traza: segmento2(figura.punto("A2"), solucion.x_AB_FD2)
            tipo: visto
            porque: 'De A₂ al cruce con D₂F₂, AB queda fuera del alzado de DEF: nada la tapa.'
          - traza: segmento2(solucion.x_AB_FD2, solucion.x_AB_DE2)
            tipo: oculto
            porque: 'Entre los cruces con D₂F₂ y D₂E₂, AB va detrás de DEF, que la tapa: en el primero FD va 3,8 mm más cerca de quien mira, y en el segundo DE, 51,7.'
          - traza: segmento2(solucion.x_AB_DE2, figura.punto("B2"))
            tipo: visto
            porque: 'Del cruce con D₂E₂ a B₂, AB queda fuera del alzado de DEF: nada la tapa.'
          - traza: segmento2(figura.punto("B2"), solucion.x_BC_DE2)
            tipo: visto
            porque: 'De B₂ al cruce con D₂E₂, BC queda fuera del alzado de DEF: nada la tapa.'
          - traza: segmento2(solucion.x_BC_DE2, solucion.x_BC_EF2)
            tipo: oculto
            porque: 'Entre los cruces con D₂E₂ y E₂F₂, BC va detrás de DEF, que la tapa: en el primero DE va 50,5 mm más cerca de quien mira, y en el segundo EF, 28,9.'
          - traza: segmento2(solucion.x_BC_EF2, figura.punto("C2"))
            tipo: visto
            porque: 'Del cruce con E₂F₂ a C₂, BC queda fuera del alzado de DEF: nada la tapa.'
          - traza: segmento2(figura.punto("E2"), proy_alzado(solucion.I))
            tipo: visto
            porque: 'De E₂ a I₂ nada tapa EF: hasta B₂C₂ queda fuera del alzado de ABC, y de ahí a I va por delante de esa placa. En el cruce aparente con B₂C₂, EF va 28,9 mm más cerca de quien mira.'
          - traza: segmento2(proy_alzado(solucion.I), solucion.x_EF_CA2)
            tipo: oculto
            porque: 'En I, EF pasa detrás de ABC, que la tapa hasta su borde, C₂A₂: en el cruce aparente, CA va 37,2 mm más cerca de quien mira.'
          - traza: segmento2(solucion.x_EF_CA2, figura.punto("F2"))
            tipo: visto
            porque: 'Del cruce con C₂A₂ a F₂, EF sale del alzado de ABC: nada la tapa.'
          - traza: segmento2(figura.punto("F2"), solucion.x_FD_CA2)
            tipo: visto
            porque: 'De F₂ al cruce con C₂A₂, FD queda fuera del alzado de ABC: nada la tapa.'
          - traza: segmento2(solucion.x_FD_CA2, proy_alzado(solucion.J))
            tipo: oculto
            porque: 'Del cruce con C₂A₂ hasta J, FD va detrás de ABC, que la tapa: en el cruce aparente, CA va 44,0 mm más cerca de quien mira.'
          - traza: segmento2(proy_alzado(solucion.J), figura.punto("D2"))
            tipo: visto
            porque: 'En J, FD atraviesa ABC y pasa por delante: de J₂ a D₂ nada la tapa. En el cruce aparente con A₂B₂, FD va 3,8 mm más cerca de quien mira.'
        trazado:
          - segmento2(solucion.M2, solucion.N2)
          - segmento2(solucion.R2, solucion.P2)
        construccion:
          - con: marca
            traza: solucion.M1
            rotulo: M₁
            porque: |
              **El extremo I.** El plano vertical que contiene EF se ve, en la planta, como la recta E₁F₁, y
              corta los lados de ABC donde E₁F₁ los cruza. M₁, donde E₁F₁ cruza A₁B₁: M es el punto de AB
              que está en ese plano. M, N, P, R, K y S son nombres nuestros, como I y J.
          - con: marca
            traza: solucion.N1
            rotulo: N₁
            porque: |
              N₁, donde E₁F₁ cruza C₁A₁: N es el punto de CA que está en el plano vertical de EF.
          - con: escuadra-cartabon
            traza: '[segmento2(solucion.M1, solucion.L_M2), segmento2(solucion.N1, solucion.L_N2)]'
            porque: |
              Por M₁ y por N₁, las verticales hacia el alzado, largas, hasta pasar A₂B₂ y C₂A₂. La de M₁
              cruza antes E₂F₂: servirá para K.
          - con: marca
            traza: solucion.M2
            rotulo: M₂
            porque: |
              M₂, donde la vertical de M₁ corta A₂B₂.
          - con: marca
            traza: solucion.N2
            rotulo: N₂
            porque: |
              N₂, donde la vertical de N₁ corta C₂A₂.
          - con: regla
            traza: segmento2(solucion.M2, solucion.N2)
            porque: |
              M₂N₂, el alzado de la recta en que el plano vertical de EF corta a ABC. Esa recta y EF están en
              el mismo plano, así que se cortan de verdad.
          - con: marca
            traza: proy_alzado(solucion.I)
            rotulo: I₂
            porque: |
              I₂, donde M₂N₂ corta E₂F₂: el punto donde la arista EF atraviesa el triángulo ABC.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(solucion.I), solucion.L_I1)
            porque: |
              Por I₂, la vertical hacia la planta, hasta pasar E₁F₁.
          - con: marca
            traza: proy_planta(solucion.I)
            rotulo: I₁
            porque: |
              I₁, donde la vertical de I₂ corta E₁F₁.
          - con: regla
            traza: segmento2(figura.punto("D1"), figura.punto("A1"))
            porque: |
              **K, para la recta común.** FD es de perfil y su plano vertical no da J. Se busca otro punto de
              la recta común: K, donde AB corta el plano DEF, con el plano vertical de AB. Ese plano corta
              DEF en una recta que hay que sacar de EF y de DE, porque FD no sirve. Primero, D₁E₁ prolongada
              hacia la izquierda: pasa justo por A₁, porque A tiene el alejamiento de D y de E.
          - con: regla
            traza: segmento2(figura.punto("E2"), solucion.L_R)
            porque: |
              En el alzado, D₂E₂ prolongada hacia la izquierda con la regla, larga, más allá de la vertical de
              A₂.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("A2"), solucion.L_RA)
            porque: |
              Por A₂, la vertical hacia arriba, hasta pasar la prolongación de D₂E₂: la recta DE corta el
              plano vertical de AB en el punto de su vertical, porque A₁ está en D₁E₁ prolongada.
          - con: marca
            traza: solucion.R2
            rotulo: R₂
            porque: |
              R₂, donde la vertical de A₂ corta la prolongación de D₂E₂: R es el punto de la recta DE que
              está en el plano vertical de AB, y su planta es A₁.
          - con: marca
            traza: solucion.P2
            rotulo: P₂
            porque: |
              P₂, donde la vertical de M₁ corta E₂F₂. M₁ es también el cruce de A₁B₁ con E₁F₁: P es el punto
              de EF que está en el plano vertical de AB.
          - con: regla
            traza: segmento2(solucion.R2, solucion.P2)
            porque: |
              R₂P₂, el alzado de la recta en que el plano vertical de AB corta a DEF. Esa recta y AB están en
              el mismo plano, y se cortan de verdad.
          - con: marca
            traza: proy_alzado(solucion.K)
            porque: |
              K₂, donde R₂P₂ corta A₂B₂: el punto donde AB corta el plano DEF. Cae fuera del triángulo DEF,
              al otro lado de F₂D₂, pero está en la recta común de los dos planos. Va sin rótulo: el de J₂,
              que se marca después a 1,4 mm, lo pisaría.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(solucion.K), solucion.L_K1)
            porque: |
              Por K₂, la vertical hacia la planta, hasta pasar A₁B₁.
          - con: marca
            traza: proy_planta(solucion.K)
            porque: |
              K₁, donde la vertical de K₂ corta A₁B₁. Va sin rótulo: J₁, que se marca después, lo taparía.
          - con: regla
            traza: segmento2(proy_alzado(solucion.I), proy_alzado(solucion.K))
            porque: |
              **El extremo J.** I y K son de los dos planos, así que IK es su recta común. I₂K₂ y FD están
              las dos en el plano DEF: donde se cortan en el alzado, se cortan de verdad.
          - con: marca
            traza: proy_alzado(solucion.J)
            rotulo: J₂
            porque: |
              J₂, donde I₂K₂ corta D₂F₂, muy cerca de K₂: el punto donde la arista FD atraviesa ABC.
          - con: regla
            traza: segmento2(proy_planta(solucion.I), proy_planta(solucion.K))
            porque: |
              En la planta, I₁K₁, la planta de la recta común. J₁ no se saca bajando J₂: con FD de perfil, la
              vertical de J₂ es toda D₁F₁.
          - con: marca
            traza: proy_planta(solucion.J)
            rotulo: J₁
            porque: |
              J₁, donde I₁K₁ corta D₁F₁, a 1,3 mm de K₁.
          - con: arista-vista
            traza: '[segmento2(proy_planta(solucion.I), proy_planta(solucion.J)), segmento2(figura.punto("C1"), solucion.N1), segmento2(solucion.x_CA_FD1, figura.punto("A1")), segmento2(figura.punto("E1"), proy_planta(solucion.I)), segmento2(solucion.M1, figura.punto("F1")), segmento2(figura.punto("F1"), solucion.x_FD_AB1), segmento2(proy_planta(solucion.J), figura.punto("D1"))]'
            porque: |
              **A limpio, la planta.** Desde arriba se ve lo que va más alto. I₁J₁, en continua: está en las
              dos placas. EF y FD se ven de E y de D hasta I y J, por encima de ABC, y desde los cruces con
              A₁B₁ hasta F; CA, fuera de la planta de DEF.
          - con: arista-oculta
            traza: '[segmento2(solucion.N1, solucion.x_CA_FD1), segmento2(proy_planta(solucion.I), solucion.M1), segmento2(solucion.x_FD_AB1, proy_planta(solucion.J))]'
            porque: |
              A trazos, lo que queda debajo de la otra placa: CA entre E₁F₁ y F₁D₁, debajo de DEF, y EF y FD
              entre I o J y A₁B₁, debajo de ABC. El de FD es corto, 1,7 mm. AB, BC y DE se ven enteras en la
              planta, y ya están dibujadas.
          - con: arista-vista
            traza: '[segmento2(proy_alzado(solucion.I), proy_alzado(solucion.J)), segmento2(figura.punto("A2"), solucion.x_AB_FD2), segmento2(solucion.x_AB_DE2, figura.punto("B2")), segmento2(figura.punto("B2"), solucion.x_BC_DE2), segmento2(solucion.x_BC_EF2, figura.punto("C2")), segmento2(figura.punto("E2"), proy_alzado(solucion.I)), segmento2(solucion.x_EF_CA2, figura.punto("F2")), segmento2(figura.punto("F2"), solucion.x_FD_CA2), segmento2(proy_alzado(solucion.J), figura.punto("D2"))]'
            porque: |
              **El alzado.** Se ve lo que va más cerca de quien mira. I₂J₂, en continua; EF y FD de E y de
              D hasta I y J, por delante de ABC; y lo que de cada arista queda fuera de la otra placa.
          - con: arista-oculta
            traza: '[segmento2(solucion.x_AB_FD2, solucion.x_AB_DE2), segmento2(solucion.x_BC_DE2, solucion.x_BC_EF2), segmento2(proy_alzado(solucion.I), solucion.x_EF_CA2), segmento2(solucion.x_FD_CA2, proy_alzado(solucion.J))]'
            porque: |
              A trazos, lo que queda detrás: AB y BC donde pasan por detrás de DEF, y EF y FD de I o J hasta
              C₂A₂, detrás de ABC. CA y DE se ven enteras en el alzado, y ya están dibujadas.
        pista: |
          (1) En la planta, E₁F₁ cruza A₁B₁ en M₁ y C₁A₁ en N₁; súbelos a A₂B₂ y C₂A₂: M₂N₂ corta E₂F₂ en
          I₂. (2) FD es de perfil: busca otro punto de la recta común, K, donde AB corta el plano DEF. (3) El
          plano vertical de AB corta EF en P (vertical de M₁) y la recta DE en R (vertical de A, porque A₁
          está en D₁E₁ prolongada): R₂P₂ corta A₂B₂ en K₂. (4) I₂K₂ corta D₂F₂ en J₂, e I₁K₁ corta D₁F₁ en J₁.
          (5) Para lo que se ve, en cada cruce aparente, la que va más alta (planta) o más cerca (alzado).
        desarrollo: |
          En verde claro, las dos rectas auxiliares del alzado, M₂N₂ y R₂P₂, y el segmento IJ en las dos
          vistas, con lo oculto a trazos. DEF atraviesa ABC con su vértice F: EF y FD pasan de un lado a
          otro de la placa ABC en I y en J, y la recta común sale de DEF por las dos aristas antes de salir
          de ABC. Por eso el segmento común es entero de DEF, de I a J.

      - tipo: calcular
        titulo: La longitud del segmento de intersección
        pregunta: Como pregunta nuestra, ¿cuánto mide de verdad IJ, el segmento en que se cortan las dos placas?
        respuesta:
          tipo: numero
          valor: '24.02'
          receta: largo_mm
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '22.24'
            receta: en_mm(vm_planta(solucion.I, solucion.J))
            mensaje: |
              Eso es I₁J₁, la planta. IJ sube 9,09 mm de I a J, y la planta la acorta. La verdadera magnitud
              sale del triángulo: la planta de un cateto y la diferencia de cotas del otro.
          - valor: '25.42'
            receta: en_mm(vm(solucion.I, solucion.K))
            mensaje: |
              Eso es IK. K, donde AB corta el plano DEF, está en la recta común, pero fuera del triángulo DEF,
              1,4 mm más allá de FD. El segmento común acaba en J, en FD.
          - valor: '46.40'
            receta: en_mm(vm(solucion.S, solucion.K))
            mensaje: |
              Eso es SK, lo que de la recta común está dentro de ABC: de S, donde CA corta el plano DEF, a K, en AB. DEF no llega tan lejos: la
              recta sale de DEF por EF y por FD antes de salir de ABC, y el segmento común es IJ.
        pista: |
          IJ no es horizontal ni frontal: su verdadera magnitud sale del triángulo del tema 2, con I₁J₁ de
          un cateto y la diferencia de cotas de I₂ y J₂ del otro.
        desarrollo: |
          Con el triángulo de la verdadera magnitud, la planta y la diferencia de cotas:

          $$ \overline{IJ} = \sqrt{\overline{I_1J_1}^{\,2} + \Delta z^{2}} = \sqrt{22{,}24^{2} + 9{,}09^{2}} \approx 24{,}02 \text{ mm} $$

          El alzado, I₂J₂, mide 23,99 mm, y cae dentro de la tolerancia por casualidad: IJ es casi frontal,
          porque J está solo 1,21 mm más lejos de quien mira que I. La planta sí acorta, a 22,24 mm. En la
          construcción hay otras tres medidas que caen dentro de la tolerancia sin ser IJ: P₂K₂, 23,66 mm;
          I₁K₁, 23,53, y de A₁ a D₁, en la prolongación de D₁E₁, 25,02.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: El plano vertical que contiene EF corta a ABC en la recta MN, y M₂N₂ corta E₂F₂ en I₂, donde EF atraviesa ABC.
          - texto: FD es de perfil, y su plano vertical también, así que la recta que corta en ABC cae encima de D₂F₂ y no da J.
          - texto: El plano vertical de AB corta a DEF en RP, con R en la recta DE prolongada, en la vertical de A, y P en EF; R₂P₂ corta A₂B₂ en K₂.
          - texto: I y K son de la recta común de los dos planos, que está en DEF como FD; I₂K₂ corta D₂F₂ en J₂, e I₁K₁ corta D₁F₁ en J₁.
          - texto: J₁ baja de J₂ por su vertical, como cualquier punto.
            trampa: true
            mensaje: |
              Con FD de perfil, la vertical de J₂ es D₁F₁ entera, y no fija ningún punto. J₁ sale de cortar
              D₁F₁ con I₁K₁, la planta de la recta común.
    resolucion: |
      **Qué se busca.** El mismo enunciado que el Ejercicio 24, con otra figura. Los dos triángulos se
      cortan en un segmento de la recta común de sus planos. Sobre esa recta, ABC va de S, en CA, a K,
      en AB, y DEF de I, en EF, a J, en FD, que caen entre los dos: la recta sale de DEF por EF y por FD
      antes de salir de ABC, y el segmento común es IJ, el tramo que está dentro de DEF. DEF atraviesa
      ABC con su vértice F.

      **I.** Con el plano vertical que contiene EF, que corta los lados de ABC donde E₁F₁ los cruza, en
      M₁ y N₁. Subidos a A₂B₂ y C₂A₂, M₂N₂ corta E₂F₂ en I₂, e I₁ baja por su vertical.

      **J.** FD es una recta de perfil: D₁F₁ y D₂F₂ están en la misma vertical. Su plano vertical es el
      de perfil, y la recta que corta en ABC cae en el alzado encima de D₂F₂: no da J. Se busca otro
      punto de la recta común, K, donde AB corta el plano DEF, con el plano vertical de AB. Ese plano
      corta EF en P, en la vertical de M₁, y la recta DE prolongada en R, en la vertical de A, porque
      A₁ está en la prolongación de D₁E₁. R₂P₂ corta A₂B₂ en K₂, y K₁ baja a A₁B₁. La recta común es
      IK, y como está en DEF, igual que FD, I₂K₂ corta D₂F₂ en J₂ e I₁K₁ corta D₁F₁ en J₁. K cae a 1,4
      mm de J, fuera de DEF.

      **Lo que se ve.** Tomamos las dos placas opacas. En la planta, CA pasa por debajo de DEF, y EF y
      FD por debajo de ABC de I y de J hasta A₁B₁. En el alzado, AB y BC quedan en parte detrás de DEF,
      y EF y FD detrás de ABC de I y de J hasta C₂A₂. Con planos transparentes, todo iría en continua.

      **La longitud.** IJ mide 24,02 mm en verdadera magnitud; la planta, 22,24, y el alzado, 23,99,
      casi igual por casualidad, porque IJ es casi frontal.

  - id: sd34-el-plano-mnop-y-la-chapa-abfe-bcgf
    titulo: El plano MNOP y la chapa de caras ABFE y BCGF
    fuente: Ejercicio 26 (SD34) · Colección de ejercicios de Geometría Descriptiva, Sistema Diédrico Directo · Dpto. de Expresión Gráfica y Proyectos de Ingeniería, EIG · UPV/EHU
    nivel: practica
    # Decisión: el texto impreso tal cual, cotejado con la página (pág. 27).
    # La hoja rotula todos los vértices. MNOP se toma como una placa opaca,
    # como la chapa; las Notas dicen qué saldría con las otras lecturas. P
    # queda a 0,03 mm del plano de M, N y O (el redondeo del PDF), y B, E y G
    # tienen 0,24 pt de diferencia de x entre el alzado y la planta.
    enunciado: |
      Se presenta una chapa formada por las caras ABFE y BCGF, y el plano MNOP. Representar la
      intersección entre el plano y la chapa.

      **Notas nuestras.** La figura es la chapa y el plano MNOP en el alzado, arriba, y en la planta,
      debajo, sin línea de tierra. La hoja no da escala: las longitudes van en milímetros de la lámina.
      Las dos caras comparten la arista BF, el doblez, y EA, BF y CG son paralelas. MN y OP son
      frontales: en la planta, M₁N₁ y O₁P₁ son horizontales. La chapa se dobla de forma que, en la
      planta, la cara ABFE, que es la de más cota, cae encima de parte de la BCGF. La intersección es la
      quebrada IJK, con I en EA, J en el doblez y K en CG: un tramo en cada cara. Ningún lado de MNOP toca
      la chapa: el plano es más grande que ella, y la quebrada la cruza de borde a borde. Por eso, si
      MNOP fuera solo un trozo dibujado de un plano sin borde, la intersección sería la misma; lo que se
      ve, no, y aquí MNOP es una placa. El enunciado no dice si las piezas son opacas: las tomamos opacas, y por eso se dibuja también lo
      que tapa cada una de la otra, y lo que la chapa se tapa a sí misma en la planta. Con piezas
      transparentes, todo iría en continua. I, J y K, y R, S, T y U, los puntos de la construcción, son
      nombres nuestros.
    pide: Los tres puntos de la quebrada en que el plano MNOP corta la chapa, en las dos vistas, y lo visto y lo oculto de las dos piezas, que tomamos opacas; y, como pregunta nuestra, la longitud real de la quebrada.
    receta:
      lamina: sd34
      escena:
        A: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("A1"))'
        B: 'punto3(alzado: figura.punto("B2"), planta: figura.punto("B1"))'
        C: 'punto3(alzado: figura.punto("C2"), planta: figura.punto("C1"))'
        E: 'punto3(alzado: figura.punto("E2"), planta: figura.punto("E1"))'
        F: 'punto3(alzado: figura.punto("F2"), planta: figura.punto("F1"))'
        G: 'punto3(alzado: figura.punto("G2"), planta: figura.punto("G1"))'
        M: 'punto3(alzado: figura.punto("M2"), planta: figura.punto("M1"))'
        N: 'punto3(alzado: figura.punto("N2"), planta: figura.punto("N1"))'
        O: 'punto3(alzado: figura.punto("O2"), planta: figura.punto("O1"))'
        P: 'punto3(alzado: figura.punto("P2"), planta: figura.punto("P1"))'
        # El plano, por M, N y O; P queda a 0,03 mm.
        mnop: plano(M, N, O)
        abfe: plano(B, F, A)
        bcgf: plano(B, F, C)
      solucion:
        # La quebrada: las tres aristas paralelas de la chapa atraviesan MNOP
        # dentro de él, EA en I, BF en J y CG en K. Los lados de MNOP cortan
        # los planos de las caras fuera de ellas.
        I: corte_recta_plano(recta3(E, A), mnop)
        J: corte_recta_plano(recta3(B, F), mnop)
        K: corte_recta_plano(recta3(C, G), mnop)
        # Decisión: J, con el plano de canto que contiene BF: en el alzado es
        # B₂F₂, que corta M₂N₂ en R₂ y, prolongada, O₂P₂ en S₂; R₁S₁ corta B₁F₁ en
        # J₁, a 83°. EA y CG son paralelas a BF: sus planos de canto son
        # paralelos al de BF y cortan MNOP en paralelas a RS, que se trazan
        # por un punto cada una, T (de E₂A₂ con O₂P₂) y U (de C₂G₂ con M₂N₂). Con
        # dos puntos propios, el plano de canto de EA cortaría P₂M₂ a 0,7 mm de
        # M₂, y el de CG, O₂P₂ a 1,7 mm de O₂.
        R2: 'cruce_aparente(figura.segmento("BF2"), figura.segmento("MN2"))'
        S2: 'cruce_aparente(figura.segmento("BF2"), figura.segmento("OP2"))'
        R1: 'cruce_aparente(segmento2(R2, desplaza(R2, dy: 10)), figura.segmento("MN1"))'
        S1: 'cruce_aparente(segmento2(S2, desplaza(S2, dy: 10)), figura.segmento("OP1"))'
        T2: 'cruce_aparente(figura.segmento("EA2"), figura.segmento("OP2"))'
        T1: 'cruce_aparente(segmento2(T2, desplaza(T2, dy: 10)), figura.segmento("OP1"))'
        U2: 'cruce_aparente(figura.segmento("CG2"), figura.segmento("MN2"))'
        U1: 'cruce_aparente(segmento2(U2, desplaza(U2, dy: 10)), figura.segmento("MN1"))'
        parT: 'perpendicular(por: T1, a: perpendicular(por: T1, a: segmento2(R1, S1)))'
        parU: 'perpendicular(por: U1, a: perpendicular(por: U1, a: segmento2(R1, S1)))'
        # La visibilidad: los cruces aparentes donde una arista cambia de vista
        # a oculta (los demás cambios son I, J y K). T₂ es el de E₂A₂ con O₂P₂.
        x_BF_PM1: 'cruce_aparente(figura.segmento("BF1"), figura.segmento("PM1"))'
        x_EA_PM1: 'cruce_aparente(figura.segmento("EA1"), figura.segmento("PM1"))'
        x_CG_OP1: 'cruce_aparente(figura.segmento("CG1"), figura.segmento("OP1"))'
        x_GF_OP1: 'cruce_aparente(figura.segmento("GF1"), figura.segmento("OP1"))'
        x_JK_EA1: 'cruce_aparente(segmento2(proy_planta(J), proy_planta(K)), figura.segmento("EA1"))'
        x_MN_FE2: 'cruce_aparente(figura.segmento("MN2"), figura.segmento("FE2"))'
        x_MN_CG2: 'cruce_aparente(figura.segmento("MN2"), figura.segmento("CG2"))'
        x_AB_OP2: 'cruce_aparente(figura.segmento("AB2"), figura.segmento("OP2"))'
        # Para los diagnósticos: el error de unir T₁ con R₁, y el de unir U₁
        # con S₁ (mezclar los dos planos de canto).
        x_TR_EA1: 'cruce_aparente(segmento2(T1, R1), figura.segmento("EA1"))'
        x_US_CG1: 'cruce_aparente(segmento2(U1, S1), figura.segmento("CG1"))'
        # Los extremos de las rectas largas.
        L_S2: 'uno(medir_sobre(figura.segmento("BF2"), desde: S2, distancia: mm(4)), 2)'
        L_R1: 'desplaza(R1, dy: mm(4))'
        L_S1: 'desplaza(S1, dy: mm(4))'
        L_J2: 'desplaza(proy_alzado(J), dy: mm(-4))'
        L_T1: 'desplaza(T1, dy: mm(4))'
        L_I1: 'uno(medir_sobre(parT, desde: proy_planta(I), distancia: mm(4)), 1)'
        L_I2: 'desplaza(proy_alzado(I), dy: mm(-4))'
        L_U1: 'desplaza(U1, dy: mm(4))'
        L_K1: 'uno(medir_sobre(parU, desde: proy_planta(K), distancia: mm(4)), 2)'
        L_K2: 'desplaza(proy_alzado(K), dy: mm(-4))'
        largo_mm: en_mm(vm(I, J) + vm(J, K))
      comprueba:
        - en_plano(P, mnop)
        - en_plano(E, abfe)
        - en_plano(G, bcgf)
        - en_plano(I, abfe)
        - en_plano(K, bcgf)
    pasos:
      - tipo: reconocer
        pregunta: ¿Qué puntos dan la quebrada en que el plano MNOP corta la chapa?
        opciones:
          - texto: Los cruces de los lados de MNOP con las aristas de la chapa, en el alzado
            mensaje: |
              Son cruces aparentes: en esa vista las dos se tapan, pero en el espacio se cruzan sin tocarse.
              En el de A₂B₂ con O₂P₂, por ejemplo, OP pasa 32,5 mm por delante de AB.
          - texto: Los puntos donde los lados MN y OP atraviesan las caras
            mensaje: |
              Ningún lado de MNOP toca la chapa: MN, NO, OP y PM cortan los planos de las caras fuera de
              ellas. El plano es más grande que la chapa, y la quebrada va de un borde de la chapa al otro,
              de EA a CG.
          - texto: Los puntos donde las aristas EA, BF y CG de la chapa atraviesan el plano MNOP, por dentro de él, uno en cada arista
            correcta: true
            mensaje: |
              Eso es. Las tres aristas paralelas de la chapa atraviesan MNOP dentro de él: EA en I, BF en J y
              CG en K. I y J están en la cara ABFE, y J y K en la BCGF: la quebrada es IJ más JK.

      - tipo: construir
        titulo: La quebrada de intersección, y lo que se ve
        intro: |
          Llamamos I, J y K a los puntos donde las aristas EA, BF y CG atraviesan el plano MNOP, nombres
          nuestros: la intersección es la quebrada IJK. Cada uno sale con el plano de canto que contiene la
          arista, que en el alzado se ve como la propia arista. Empieza por J: B₂F₂, prolongada, corta M₂N₂
          en R₂ y O₂P₂ en S₂; bajados a M₁N₁ y O₁P₁, R₁S₁ corta B₁F₁ en J₁. EA y CG son paralelas a BF, y sus
          planos de canto son paralelos al de BF: cortan MNOP en paralelas a R₁S₁. Basta un punto de cada
          una: T, donde E₂A₂ cruza O₂P₂, y U, donde C₂G₂ cruza M₂N₂. R, S, T y U también son nombres
          nuestros. Marca I, J y K en las dos vistas.

          Después, pasa a limpio con «arista vista» y «arista oculta» la quebrada y los tramos de las
          aristas que cambian. Tomamos las dos piezas opacas, que el enunciado no lo dice. Ojo en la planta:
          la cara ABFE, la de más cota, cae encima de parte de la BCGF, y tapa un trozo de JK y de GF. La
          vertical de T pasa a 1,2 mm de J₁ y de J₂: amplía con la lupa (×4) antes de marcarlos.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, visto, oculto, borrar]
        tolerancia: 1
        objetivos:
          - nombre: J1
            pide: J, donde el doblez BF atraviesa el plano MNOP, en la planta
            es: proy_planta(solucion.J)
            bien: |
              J₁ está en B₁F₁, donde la corta R₁S₁: la recta en que el plano de canto de BF corta MNOP. Esa
              recta y BF están en el mismo plano, así que se cortan de verdad.
            diagnosticos:
              - si: cerca_de(solucion.x_BF_PM1)
                mensaje: |
                  Ese es el cruce aparente de B₁F₁ con P₁M₁: PM pasa ahí 40,3 mm por encima de BF, sin tocarla.
                  J está donde B₁F₁ corta R₁S₁.
                ejemplo: solucion.x_BF_PM1
              - si: '!en_recta(figura.segmento("BF1"))'
                mensaje: |
                  J es un punto del doblez: J₁ va **en B₁F₁**, donde la corta R₁S₁.
                ejemplo: 'desplaza(proy_planta(solucion.J), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en B₁F₁, pero no donde la corta R₁S₁. R₂ y S₂ son los cruces de B₂F₂, prolongada, con
                  M₂N₂ y O₂P₂; R₁ y S₁ bajan por su vertical a M₁N₁ y O₁P₁.
          - nombre: J2
            pide: J, en el alzado
            es: proy_alzado(solucion.J)
            bien: |
              J₂ está en B₂F₂, en la vertical de J₁.
            diagnosticos:
              - si: cerca_de(solucion.R2)
                mensaje: |
                  Ese es R₂, el cruce de B₂F₂ con M₂N₂: un cruce aparente, porque BF pasa ahí 27,7 mm por
                  delante de MN. Es el punto de MN en el plano de canto de BF, y sirve para la recta R₁S₁, pero
                  no es J.
                ejemplo: solucion.R2
              - si: '!en_vertical_de(J1)'
                mensaje: |
                  J₂ va en la **vertical de J₁**: es el mismo punto visto dos veces.
                ejemplo: 'desplaza(proy_alzado(solucion.J), dx: mm(6))'
              - si: '!en_recta(figura.segmento("BF2"))'
                mensaje: |
                  J está en el doblez: J₂ va donde la vertical de J₁ corta **B₂F₂**.
                ejemplo: 'desplaza(proy_alzado(solucion.J), dy: mm(-6))'
              - si: siempre
                mensaje: |
                  J₂ está donde la vertical de J₁ corta B₂F₂.
          - nombre: I1
            pide: I, donde la arista EA atraviesa el plano MNOP, en la planta
            es: proy_planta(solucion.I)
            bien: |
              I₁ está en E₁A₁, donde la corta la paralela a R₁S₁ que pasa por T₁: la recta en que el plano de
              canto de EA corta MNOP.
            diagnosticos:
              - si: cerca_de(solucion.x_TR_EA1)
                mensaje: |
                  Has unido T₁ con R₁, y R es del plano de canto de BF, no del de EA. Los dos planos de canto
                  son paralelos, y cortan MNOP en dos rectas paralelas: por T₁ va la paralela a R₁S₁.
                ejemplo: solucion.x_TR_EA1
              - si: cerca_de(solucion.x_EA_PM1)
                mensaje: |
                  Ese es el cruce aparente de E₁A₁ con P₁M₁: PM pasa ahí 19,4 mm por encima de EA, sin tocarla.
                  I está donde E₁A₁ corta la paralela a R₁S₁ por T₁.
                ejemplo: solucion.x_EA_PM1
              - si: '!en_recta(figura.segmento("EA1"))'
                mensaje: |
                  I es un punto de la arista EA: I₁ va **en E₁A₁**.
                ejemplo: 'desplaza(proy_planta(solucion.I), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en E₁A₁, pero no donde la corta la paralela a R₁S₁ que pasa por T₁. T₂ es el cruce de
                  E₂A₂ con O₂P₂, y T₁ baja por su vertical a O₁P₁.
          - nombre: I2
            pide: I, en el alzado
            es: proy_alzado(solucion.I)
            bien: |
              I₂ está en E₂A₂, en la vertical de I₁.
            diagnosticos:
              - si: cerca_de(solucion.T2)
                mensaje: |
                  Ese es T₂, el cruce de E₂A₂ con O₂P₂: un cruce aparente, porque OP pasa ahí 22,4 mm por
                  delante de EA. Sirve para la recta del plano de canto de EA, pero no es I.
                ejemplo: solucion.T2
              - si: '!en_vertical_de(I1)'
                mensaje: |
                  I₂ va en la **vertical de I₁**.
                ejemplo: 'desplaza(proy_alzado(solucion.I), dx: mm(6))'
              - si: '!en_recta(figura.segmento("EA2"))'
                mensaje: |
                  I está en la arista EA: I₂ va donde la vertical de I₁ corta **E₂A₂**.
                ejemplo: 'desplaza(proy_alzado(solucion.I), dy: mm(6))'
              - si: siempre
                mensaje: |
                  I₂ está donde la vertical de I₁ corta E₂A₂.
          - nombre: K1
            pide: K, donde la arista CG atraviesa el plano MNOP, en la planta
            es: proy_planta(solucion.K)
            bien: |
              K₁ está en C₁G₁, donde la corta la paralela a R₁S₁ que pasa por U₁: la recta en que el plano de
              canto de CG corta MNOP.
            diagnosticos:
              - si: cerca_de(solucion.x_US_CG1)
                mensaje: |
                  Has unido U₁ con S₁, y S es del plano de canto de BF, no del de CG. Por U₁ va la paralela a
                  R₁S₁: los dos planos de canto son paralelos.
                ejemplo: solucion.x_US_CG1
              - si: cerca_de(solucion.x_CG_OP1)
                mensaje: |
                  Ese es el cruce aparente de C₁G₁ con O₁P₁: OP pasa ahí 41,3 mm por encima de CG, sin tocarla.
                  K está donde C₁G₁ corta la paralela a R₁S₁ por U₁.
                ejemplo: solucion.x_CG_OP1
              - si: '!en_recta(figura.segmento("CG1"))'
                mensaje: |
                  K es un punto de la arista CG: K₁ va **en C₁G₁**.
                ejemplo: 'desplaza(proy_planta(solucion.K), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en C₁G₁, pero no donde la corta la paralela a R₁S₁ que pasa por U₁. U₂ es el cruce de
                  C₂G₂ con M₂N₂, y U₁ baja por su vertical a M₁N₁.
          - nombre: K2
            pide: K, en el alzado
            es: proy_alzado(solucion.K)
            bien: |
              K₂ está en C₂G₂, en la vertical de K₁.
            diagnosticos:
              - si: cerca_de(solucion.U2)
                mensaje: |
                  Ese es U₂, el cruce de C₂G₂ con M₂N₂: un cruce aparente, porque CG pasa ahí 42,3 mm por
                  delante de MN. Sirve para la recta del plano de canto de CG, pero no es K.
                ejemplo: solucion.U2
              - si: '!en_vertical_de(K1)'
                mensaje: |
                  K₂ va en la **vertical de K₁**.
                ejemplo: 'desplaza(proy_alzado(solucion.K), dx: mm(6))'
              - si: '!en_recta(figura.segmento("CG2"))'
                mensaje: |
                  K está en la arista CG: K₂ va donde la vertical de K₁ corta **C₂G₂**.
                ejemplo: 'desplaza(proy_alzado(solucion.K), dy: mm(6))'
              - si: siempre
                mensaje: |
                  K₂ está donde la vertical de K₁ corta C₂G₂.
        # Decisión: las dos piezas, opacas (lo dicen las Notas nuestras). La
        # visibilidad sale de un cálculo de líneas ocultas aparte, por rayos
        # contra las caras de la chapa y MNOP; cada cambio, en un cruce aparente
        # o en I, J o K. La quebrada no la tapa su propia cara, pero JK, en la
        # planta, queda debajo de la cara ABFE hasta E₁A₁. Las aristas que se
        # ven enteras y ya están dibujadas no son tramos: los lados de MNOP en
        # la planta, y NO, OP y PM en el alzado; AB, FE y BC en la planta, y
        # FE y GF en el alzado.
        tramos:
          - traza: segmento2(proy_planta(solucion.I), proy_planta(solucion.J))
            tipo: visto
            porque: 'IJ está en la cara ABFE, que en la planta va por encima de la BCGF, y en MNOP: desde arriba nada la tapa.'
          - traza: segmento2(proy_planta(solucion.J), solucion.x_JK_EA1)
            tipo: oculto
            porque: 'JK está en la cara BCGF, y en la planta la cara ABFE le cae encima: de J₁ al cruce con E₁A₁, el borde de ABFE, la tapa esa cara. En el cruce aparente, EA va 28,2 mm más alta que JK.'
          - traza: segmento2(solucion.x_JK_EA1, proy_planta(solucion.K))
            tipo: visto
            porque: 'Del cruce con E₁A₁ a K₁, JK sale de debajo de la cara ABFE: desde arriba nada la tapa.'
          - traza: segmento2(figura.punto("B1"), proy_planta(solucion.J))
            tipo: visto
            porque: 'De B₁ hasta J, BF va por encima de MNOP, que atraviesa en J: desde arriba nada la tapa.'
          - traza: segmento2(proy_planta(solucion.J), solucion.x_BF_PM1)
            tipo: oculto
            porque: 'En J, BF atraviesa MNOP y pasa por debajo: hasta el cruce con P₁M₁, el borde de MNOP, la tapa ese plano. En el cruce aparente, PM va 40,3 mm más alta que BF.'
          - traza: segmento2(solucion.x_BF_PM1, figura.punto("F1"))
            tipo: visto
            porque: 'Del cruce con P₁M₁ a F₁, BF sale de debajo de MNOP: desde arriba nada la tapa.'
          - traza: segmento2(figura.punto("E1"), solucion.x_EA_PM1)
            tipo: visto
            porque: 'De E₁ al cruce con P₁M₁, EA queda fuera de la planta de MNOP: desde arriba nada la tapa.'
          - traza: segmento2(solucion.x_EA_PM1, proy_planta(solucion.I))
            tipo: oculto
            porque: 'Del cruce con P₁M₁ hasta I, EA va por debajo de MNOP, que la tapa desde arriba: en el cruce aparente, PM va 19,4 mm más alta que EA. En I, EA lo atraviesa.'
          - traza: segmento2(proy_planta(solucion.I), figura.punto("A1"))
            tipo: visto
            porque: 'En I, EA atraviesa MNOP y pasa por encima: de I₁ a A₁ desde arriba nada la tapa.'
          - traza: segmento2(figura.punto("C1"), proy_planta(solucion.K))
            tipo: visto
            porque: 'De C₁ hasta K, CG va por encima de MNOP, que atraviesa en K: desde arriba nada la tapa.'
          - traza: segmento2(proy_planta(solucion.K), solucion.x_CG_OP1)
            tipo: oculto
            porque: 'En K, CG pasa por debajo de MNOP, que la tapa hasta su borde, O₁P₁: en el cruce aparente, OP va 41,3 mm más alta que CG.'
          - traza: segmento2(solucion.x_CG_OP1, figura.punto("G1"))
            tipo: visto
            porque: 'Del cruce con O₁P₁ a G₁, CG sale de debajo de MNOP: desde arriba nada la tapa.'
          - traza: segmento2(figura.punto("G1"), solucion.x_GF_OP1)
            tipo: visto
            porque: 'De G₁ al cruce con O₁P₁, GF queda fuera de la planta de MNOP y de la de la cara ABFE: desde arriba nada la tapa.'
          - traza: segmento2(solucion.x_GF_OP1, figura.punto("F1"))
            tipo: oculto
            porque: 'Del cruce con O₁P₁ a F₁, GF va por debajo de MNOP, que la tapa (en el cruce aparente, OP va 48,4 mm más alta), y desde E₁A₁, también por debajo de la cara ABFE, que le cae encima hasta F₁: en el cruce con E₁A₁, EA va 28,2 mm más alta.'
          - traza: segmento2(proy_alzado(solucion.I), proy_alzado(solucion.J))
            tipo: visto
            porque: 'IJ está en la cara ABFE y en MNOP a la vez: por delante no la tapa nada.'
          - traza: segmento2(proy_alzado(solucion.J), proy_alzado(solucion.K))
            tipo: visto
            porque: 'JK está en la cara BCGF y en MNOP a la vez, y en el alzado la cara ABFE no le cae delante: nada la tapa.'
          - traza: segmento2(figura.punto("M2"), solucion.x_MN_FE2)
            tipo: visto
            porque: 'De M₂ al cruce con F₂E₂, MN queda fuera del alzado de la chapa: nada la tapa.'
          - traza: segmento2(solucion.x_MN_FE2, solucion.x_MN_CG2)
            tipo: oculto
            porque: 'Entre los cruces con F₂E₂ y C₂G₂, MN va detrás de la chapa, que la tapa: en el primero FE va 44,3 mm más cerca de quien mira, y en el segundo CG, 42,3.'
          - traza: segmento2(solucion.x_MN_CG2, figura.punto("N2"))
            tipo: visto
            porque: 'Del cruce con C₂G₂ a N₂, MN sale del alzado de la chapa: nada la tapa.'
          - traza: segmento2(figura.punto("A2"), solucion.x_AB_OP2)
            tipo: visto
            porque: 'De A₂ al cruce con O₂P₂, AB queda fuera del alzado de MNOP: nada la tapa.'
          - traza: segmento2(solucion.x_AB_OP2, figura.punto("B2"))
            tipo: oculto
            porque: 'Del cruce con O₂P₂ a B₂, AB va detrás de MNOP, que la tapa: en el cruce aparente, OP va 32,5 mm más cerca de quien mira.'
          - traza: segmento2(figura.punto("B2"), proy_alzado(solucion.J))
            tipo: oculto
            porque: 'De B₂ hasta J, BF va detrás de MNOP, que la tapa: en B, el plano le pasa 24,2 mm por delante. En J, BF lo atraviesa y pasa por delante.'
          - traza: segmento2(proy_alzado(solucion.J), figura.punto("F2"))
            tipo: visto
            porque: 'De J a F₂, BF va por delante de MNOP: nada la tapa. En el cruce aparente con M₂N₂, BF va 27,7 mm más cerca de quien mira.'
          - traza: segmento2(figura.punto("E2"), proy_alzado(solucion.I))
            tipo: visto
            porque: 'De E₂ hasta I, EA va por delante de MNOP, que atraviesa en I: nada la tapa.'
          - traza: segmento2(proy_alzado(solucion.I), solucion.T2)
            tipo: oculto
            porque: 'En I, EA pasa detrás de MNOP, que la tapa hasta su borde, O₂P₂: en el cruce aparente, OP va 22,4 mm más cerca de quien mira.'
          - traza: segmento2(solucion.T2, figura.punto("A2"))
            tipo: visto
            porque: 'Del cruce con O₂P₂ a A₂, EA sale del alzado de MNOP: nada la tapa.'
          - traza: segmento2(figura.punto("B2"), figura.punto("C2"))
            tipo: oculto
            porque: 'BC va entera detrás de MNOP: su alzado cae dentro del de MNOP, y el plano le pasa por delante, 24,2 mm en B y 14,3 en C.'
          - traza: segmento2(figura.punto("C2"), proy_alzado(solucion.K))
            tipo: oculto
            porque: 'De C₂ hasta K, CG va detrás de MNOP, que la tapa; en K lo atraviesa y pasa por delante.'
          - traza: segmento2(proy_alzado(solucion.K), figura.punto("G2"))
            tipo: visto
            porque: 'De K a G₂, CG va por delante de MNOP, y desde M₂N₂ fuera de su alzado: nada la tapa. En el cruce aparente con M₂N₂, CG va 42,3 mm más cerca de quien mira.'
        trazado:
          - segmento2(solucion.R1, solucion.S1)
          - segmento2(solucion.T1, proy_planta(solucion.I))
          - segmento2(solucion.U1, proy_planta(solucion.K))
        construccion:
          - con: regla
            traza: segmento2(figura.punto("B2"), solucion.L_S2)
            porque: |
              **J, en el doblez.** El plano de canto que contiene la arista BF se ve, en el alzado, como la
              propia B₂F₂, y corta el plano MNOP donde B₂F₂ cruza sus lados. B₂F₂ cruza M₂N₂, pero para llegar
              a O₂P₂ hay que prolongarla con la regla más allá de B₂.
          - con: marca
            traza: solucion.R2
            rotulo: R₂
            porque: |
              R₂, donde B₂F₂ cruza M₂N₂: R es el punto de MN que está en el plano de canto de BF. R, S, T, U,
              I, J y K son nombres nuestros.
          - con: marca
            traza: solucion.S2
            rotulo: S₂
            porque: |
              S₂, donde B₂F₂ prolongada cruza O₂P₂: S es el punto de OP que está en ese plano.
          - con: escuadra-cartabon
            traza: '[segmento2(solucion.R2, solucion.L_R1), segmento2(solucion.S2, solucion.L_S1)]'
            porque: |
              Por R₂ y por S₂, las verticales hacia la planta, largas, hasta pasar M₁N₁ y O₁P₁: R está en MN y
              S en OP.
          - con: marca
            traza: solucion.R1
            rotulo: R₁
            porque: |
              R₁, donde la vertical de R₂ corta M₁N₁.
          - con: marca
            traza: solucion.S1
            rotulo: S₁
            porque: |
              S₁, donde la vertical de S₂ corta O₁P₁.
          - con: regla
            traza: segmento2(solucion.R1, solucion.S1)
            porque: |
              R₁S₁, la planta de la recta en que el plano de canto de BF corta MNOP. Esa recta y BF están en
              el mismo plano, así que donde R₁S₁ corta B₁F₁, se cortan de verdad.
          - con: marca
            traza: proy_planta(solucion.J)
            rotulo: J₁
            porque: |
              J₁, donde R₁S₁ corta B₁F₁: el punto donde el doblez atraviesa MNOP.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.J), solucion.L_J2)
            porque: |
              Por J₁, la vertical hacia el alzado, hasta pasar B₂F₂.
          - con: marca
            traza: proy_alzado(solucion.J)
            rotulo: J₂
            porque: |
              J₂, donde la vertical de J₁ corta B₂F₂.
          - con: marca
            traza: solucion.T2
            rotulo: T₂
            porque: |
              **I, en EA.** EA es paralela a BF, y su plano de canto, paralelo al de BF: corta MNOP en una
              paralela a RS, y basta un punto suyo. T₂, donde E₂A₂ cruza O₂P₂: T es el punto de OP que está
              en el plano de canto de EA.
          - con: escuadra-cartabon
            traza: segmento2(solucion.T2, solucion.L_T1)
            porque: |
              Por T₂, la vertical hacia la planta, larga, hasta pasar O₁P₁.
          - con: marca
            traza: solucion.T1
            rotulo: T₁
            porque: |
              T₁, donde la vertical de T₂ corta O₁P₁.
          - con: escuadra-cartabon
            traza: segmento2(solucion.T1, solucion.L_I1)
            guia: segmento2(solucion.R1, solucion.S1)
            porque: |
              Por T₁, la **paralela a R₁S₁**, hasta pasar E₁A₁: es la planta de la recta en que el plano de
              canto de EA corta MNOP.
          - con: marca
            traza: proy_planta(solucion.I)
            rotulo: I₁
            porque: |
              I₁, donde la paralela por T₁ corta E₁A₁: el punto donde EA atraviesa MNOP.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.I), solucion.L_I2)
            porque: |
              Por I₁, la vertical hacia el alzado, hasta pasar E₂A₂.
          - con: marca
            traza: proy_alzado(solucion.I)
            rotulo: I₂
            porque: |
              I₂, donde la vertical de I₁ corta E₂A₂.
          - con: marca
            traza: solucion.U2
            rotulo: U₂
            porque: |
              **K, en CG**, igual: U₂, donde C₂G₂ cruza M₂N₂. U es el punto de MN que está en el plano de
              canto de CG, también paralelo al de BF.
          - con: escuadra-cartabon
            traza: segmento2(solucion.U2, solucion.L_U1)
            porque: |
              Por U₂, la vertical hacia la planta, hasta pasar M₁N₁.
          - con: marca
            traza: solucion.U1
            rotulo: U₁
            porque: |
              U₁, donde la vertical de U₂ corta M₁N₁.
          - con: escuadra-cartabon
            traza: segmento2(solucion.U1, solucion.L_K1)
            guia: segmento2(solucion.R1, solucion.S1)
            porque: |
              Por U₁, la paralela a R₁S₁, hasta pasar C₁G₁.
          - con: marca
            traza: proy_planta(solucion.K)
            rotulo: K₁
            porque: |
              K₁, donde la paralela por U₁ corta C₁G₁: el punto donde CG atraviesa MNOP.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.K), solucion.L_K2)
            porque: |
              Por K₁, la vertical hacia el alzado, hasta pasar C₂G₂.
          - con: marca
            traza: proy_alzado(solucion.K)
            rotulo: K₂
            porque: |
              K₂, donde la vertical de K₁ corta C₂G₂.
          - con: arista-vista
            traza: '[segmento2(proy_planta(solucion.I), proy_planta(solucion.J)), segmento2(solucion.x_JK_EA1, proy_planta(solucion.K)), segmento2(figura.punto("B1"), proy_planta(solucion.J)), segmento2(solucion.x_BF_PM1, figura.punto("F1")), segmento2(figura.punto("E1"), solucion.x_EA_PM1), segmento2(proy_planta(solucion.I), figura.punto("A1")), segmento2(figura.punto("C1"), proy_planta(solucion.K)), segmento2(solucion.x_CG_OP1, figura.punto("G1")), segmento2(figura.punto("G1"), solucion.x_GF_OP1)]'
            porque: |
              **A limpio, la planta.** Desde arriba se ve lo que va más alto. I₁J₁, en continua, y J₁K₁ desde
              E₁A₁; y de las aristas de la chapa, lo que va por encima de MNOP o fuera de él.
          - con: arista-oculta
            traza: '[segmento2(proy_planta(solucion.J), solucion.x_JK_EA1), segmento2(proy_planta(solucion.J), solucion.x_BF_PM1), segmento2(solucion.x_EA_PM1, proy_planta(solucion.I)), segmento2(proy_planta(solucion.K), solucion.x_CG_OP1), segmento2(solucion.x_GF_OP1, figura.punto("F1"))]'
            porque: |
              A trazos, lo que queda debajo: BF, EA y CG donde pasan por debajo de MNOP, entre J, I o K y su
              borde; GF, debajo de MNOP y de la cara ABFE; y JK hasta E₁A₁, debajo de la cara ABFE, que en la
              planta le cae encima.
          - con: arista-vista
            traza: '[segmento2(proy_alzado(solucion.I), proy_alzado(solucion.J)), segmento2(proy_alzado(solucion.J), proy_alzado(solucion.K)), segmento2(figura.punto("M2"), solucion.x_MN_FE2), segmento2(solucion.x_MN_CG2, figura.punto("N2")), segmento2(figura.punto("A2"), solucion.x_AB_OP2), segmento2(proy_alzado(solucion.J), figura.punto("F2")), segmento2(figura.punto("E2"), proy_alzado(solucion.I)), segmento2(solucion.T2, figura.punto("A2")), segmento2(proy_alzado(solucion.K), figura.punto("G2"))]'
            porque: |
              **El alzado.** Se ve lo que va más cerca de quien mira. La quebrada I₂J₂K₂, en continua; y de
              cada arista, lo que va por delante de la otra pieza o fuera de ella.
          - con: arista-oculta
            traza: '[segmento2(solucion.x_MN_FE2, solucion.x_MN_CG2), segmento2(solucion.x_AB_OP2, figura.punto("B2")), segmento2(figura.punto("B2"), proy_alzado(solucion.J)), segmento2(proy_alzado(solucion.I), solucion.T2), segmento2(figura.punto("B2"), figura.punto("C2")), segmento2(figura.punto("C2"), proy_alzado(solucion.K))]'
            porque: |
              A trazos, lo que queda detrás: MN, detrás de la chapa; y AB, BF, EA, BC y CG donde MNOP les pasa
              por delante. BC va entera a trazos. FE y GF se ven enteras, y ya están dibujadas.
        pista: |
          (1) B₂F₂, prolongada, corta M₂N₂ en R₂ y O₂P₂ en S₂; bájalos a M₁N₁ y O₁P₁: R₁S₁ corta B₁F₁ en J₁.
          (2) E₂A₂ corta O₂P₂ en T₂, y C₂G₂ corta M₂N₂ en U₂; bájalos. (3) Por T₁ y por U₁, las paralelas a
          R₁S₁ cortan E₁A₁ en I₁ y C₁G₁ en K₁. (4) Sube I, J y K a sus aristas en el alzado. (5) Para lo que se
          ve, en cada cruce aparente mira en la otra vista cuál va delante o encima.
        desarrollo: |
          En verde claro, las tres rectas auxiliares de la planta, R₁S₁ y sus paralelas por T₁ y U₁, y la
          quebrada IJK en las dos vistas, con lo oculto a trazos. La chapa atraviesa MNOP con sus tres
          aristas paralelas, y cada pieza tapa de la otra lo que le queda debajo, en la planta, o detrás,
          en el alzado. En la planta, además, la chapa se tapa a sí misma: la cara ABFE cae encima de JK,
          de J₁ a E₁A₁, y del final de GF.

      - tipo: calcular
        titulo: La longitud de la quebrada
        pregunta: Como pregunta nuestra, ¿cuánto mide de verdad la quebrada de intersección, IJ más JK?
        respuesta:
          tipo: numero
          valor: '48.81'
          receta: largo_mm
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '37.53'
            receta: en_mm(vm(solucion.I, solucion.K))
            mensaje: |
              Eso es **IK**, la recta de I a K. La intersección no va en línea recta: se dobla en J, en el
              doblez, y es más larga.
          - valor: '40.77'
            receta: en_mm(vm_planta(solucion.I, solucion.J) + vm_planta(solucion.J, solucion.K))
            mensaje: |
              Eso es **I₁J₁ más J₁K₁**, en la planta. IJ baja 18,8 mm de I a J, y la planta la acorta: mide
              18,9 mm, y de verdad, 26,7.
          - valor: '26.70'
            receta: en_mm(vm(solucion.I, solucion.J))
            mensaje: |
              Eso es solo **IJ**, el tramo de la cara ABFE. Falta JK, el de la cara BCGF, 22,1 mm.
        pista: |
          Cada tramo con su triángulo de la verdadera magnitud: su planta de un cateto y su diferencia de
          cotas del otro.
        desarrollo: |
          Cada tramo, con el triángulo de la verdadera magnitud:

          $$ \overline{IJ} = \sqrt{18{,}94^{2} + 18{,}82^{2}} \approx 26{,}70 \text{ mm}, \qquad \overline{JK} = \sqrt{21{,}83^{2} + 3{,}52^{2}} \approx 22{,}11 \text{ mm} $$

          La quebrada mide 26,70 + 22,11 ≈ 48,81 mm. Ni la planta ni el alzado la dan: en la planta mide
          40,77 mm, y en el alzado, 41,26.

          Algún trozo de recta auxiliar del dibujo mide por casualidad casi lo mismo (de K₂ a donde su vertical cruza B₁C₁, 49,00 mm), pero no es la quebrada.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: Las aristas EA, BF y CG atraviesan el plano MNOP por dentro de él, en I, J y K; los lados de MNOP no tocan la chapa.
          - texto: El plano de canto de BF corta MNOP en la recta RS, y R₁S₁ corta B₁F₁ en J₁; J₂ sube a B₂F₂.
          - texto: EA y CG son paralelas a BF, y sus planos de canto cortan MNOP en paralelas a RS, por T y por U, que dan I₁ y K₁.
          - texto: La quebrada está en la chapa y en el plano; en la planta, la cara ABFE, que va por encima, tapa el trozo de JK que le queda debajo.
          - texto: J₂ es R₂, el cruce de B₂F₂ con M₂N₂ en el alzado, porque ahí el doblez toca el plano.
            trampa: true
            mensaje: |
              R₂ es un cruce aparente: BF pasa ahí 27,7 mm por delante de MN, sin tocarla. R es el punto de MN
              en el plano de canto de BF, y sirve para la recta RS; J sale de cortar R₁S₁ con B₁F₁.
    resolucion: |
      **Qué se busca.** Las tres aristas paralelas de la chapa, EA, BF y CG, atraviesan el plano MNOP
      por dentro de él, en I, J y K, y los lados de MNOP no tocan la chapa. La intersección es la quebrada
      IJK: IJ en la cara ABFE, JK en la BCGF.

      **J.** Con el plano de canto que contiene BF, que en el alzado es B₂F₂: corta M₂N₂ en R₂ y, prolongada,
      O₂P₂ en S₂. Bajados a M₁N₁ y O₁P₁, R₁S₁ corta B₁F₁ en J₁, y J₂ sube a B₂F₂.

      **I y K.** Los planos de canto de EA y de CG son paralelos al de BF, y cortan MNOP en paralelas a RS.
      La de EA pasa por T, donde E₂A₂ cruza O₂P₂, y corta E₁A₁ en I₁; la de CG pasa por U, donde C₂G₂ cruza
      M₂N₂, y corta C₁G₁ en K₁. I₂ y K₂ suben a sus aristas.

      **Lo que se ve.** Tomamos las dos piezas opacas. En la planta, BF, EA y CG pasan por debajo de MNOP
      entre su punto de la quebrada y el borde de MNOP, y GF va debajo de MNOP y de la cara ABFE, que en la
      planta cae encima de parte de la BCGF; por eso JK va a trazos de J₁ hasta E₁A₁. En el alzado, MN va
      detrás de la chapa, y MNOP tapa BC entera y parte de AB, BF, EA y CG. Con piezas transparentes, todo
      iría en continua.

      **La longitud.** IJ mide 26,70 mm y JK 22,11: la quebrada, 48,81 mm.

  - id: sd35-la-seccion-del-prisma-por-el-plano-mnop
    titulo: La sección del prisma ABCD-EFGH por el plano MNOP, con las vistas completadas
    fuente: Ejercicio 27 (SD35) · Colección de ejercicios de Geometría Descriptiva, Sistema Diédrico Directo · Dpto. de Expresión Gráfica y Proyectos de Ingeniería, EIG · UPV/EHU
    nivel: practica
    # Decisión: el texto impreso tal cual, cotejado con la página (pág. 28). Las
    # vistas incompletas son las del enunciado: del plano, solo las cruces de sus
    # cuatro vértices; del prisma, cada base en una sola vista y una arista
    # lateral en cada una. Se completan en el mismo `construir`, antes de la
    # sección, porque el Taller no guarda las marcas de un paso a otro. La placa
    # MNOP y el prisma se toman opacos (lectura nuestra, en las Notas). I, J, K,
    # L y los puntos 1 a 5 son nombres nuestros.
    enunciado: |
      Se presentan las vistas incompletas del plano MNOP y el prisma formado por las caras ABCD y
      EFGH. Representar la intersección que genera el plano en el prisma.

      **Notas nuestras.** La figura es el alzado, arriba, y la planta, debajo, sin línea de tierra. La
      hoja no da escala: las longitudes van en milímetros de la lámina. Lo que da la lámina y lo que
      falta: del plano MNOP, solo sus cuatro vértices, como cruces, en las dos vistas; del prisma, la
      base ABCD y la arista lateral AH en el alzado, y la base EFGH y la arista lateral BG en la
      planta, con H₂ y B₁ como cruces sueltas. Faltan, en el alzado, E₂, F₂, G₂, la base EFGH y las
      aristas BG, CF y DE; en la planta, A₁, C₁, D₁, la base ABCD y las aristas AH, CF y DE; y en las
      dos, los lados del plano. Como H es la de A y G la de B, las otras dos aristas laterales son CF y
      DE. El enunciado dice «plano MNOP» y da cuatro vértices: lo leemos como una placa de lados MN,
      NO, OP y PM, y tomamos la placa y el prisma como piezas opacas, por eso se dibuja también lo
      que cada una tapa de la otra. La sección cae entera dentro de MNOP, así que con un plano sin
      borde saldría la misma; y con las piezas transparentes todo iría en continua. Llamamos I, J, K
      y L a los puntos donde las aristas AH, BG, CF y DE atraviesan la placa.

      Dos cosas del dibujo. M₁ está 0,25 mm a la izquierda de la vertical de M₂: tomamos M por su
      alzado, que cae en el plano de N, O y P a menos de 0,01 mm, y el lado P₁M₁ va hasta la cruz de
      la lámina. Y las dos bases no son del todo iguales: de H₁ a G₁ hay 0,34 mm más de ancho que de
      A₂ a B₂, y las aristas laterales miden de 66,8 mm (AH) a 68,0 (CF). Por eso las vistas se
      completan con paralelas y verticales, que usan solo la dirección de las aristas: copiar A₂H₂
      desde C₂ con su largo dejaría F₂ a 0,9 mm de la vertical de F₁.
    pide: Los puntos que faltan del prisma en cada vista, los cuatro vértices de la sección en las dos vistas, y lo visto y lo oculto del prisma, de la placa MNOP y de la sección, que tomamos opacos; y, como pregunta nuestra, la medida real de uno de sus lados.
    receta:
      lamina: sd35
      escena:
        N: 'punto3(alzado: figura.punto("N2"), planta: figura.punto("N1"))'
        O: 'punto3(alzado: figura.punto("O2"), planta: figura.punto("O1"))'
        P: 'punto3(alzado: figura.punto("P2"), planta: figura.punto("P1"))'
        mnop: plano(N, O, P)
        # M₁ y M₂ no están en la misma vertical (0,72 pt): M, por su alzado, en
        # el plano de los otros tres.
        M: 'punto_en_plano(alzado: figura.punto("M2"), plano: mnop)'
        B: 'punto3(alzado: figura.punto("B2"), planta: figura.punto("B1"))'
        H: 'punto3(alzado: figura.punto("H2"), planta: figura.punto("H1"))'
      solucion:
        # Las vistas que faltan. Las aristas laterales son paralelas: en el
        # alzado, a A₂H₂; en la planta, a B₁G₁. Cada punto que falta, donde la
        # paralela por el vértice de su arista corta la vertical del punto dado.
        # (La paralela, como perpendicular a la perpendicular.)
        parB2: 'perpendicular(por: figura.punto("B2"), a: perpendicular(por: figura.punto("B2"), a: figura.segmento("AH2")))'
        parC2: 'perpendicular(por: figura.punto("C2"), a: perpendicular(por: figura.punto("C2"), a: figura.segmento("AH2")))'
        parD2: 'perpendicular(por: figura.punto("D2"), a: perpendicular(por: figura.punto("D2"), a: figura.segmento("AH2")))'
        parH1: 'perpendicular(por: figura.punto("H1"), a: perpendicular(por: figura.punto("H1"), a: figura.segmento("BG1")))'
        parF1: 'perpendicular(por: figura.punto("F1"), a: perpendicular(por: figura.punto("F1"), a: figura.segmento("BG1")))'
        parE1: 'perpendicular(por: figura.punto("E1"), a: perpendicular(por: figura.punto("E1"), a: figura.segmento("BG1")))'
        G2p: 'cruce_aparente(parB2, segmento2(figura.punto("G1"), desplaza(figura.punto("G1"), dy: -10)))'
        F2p: 'cruce_aparente(parC2, segmento2(figura.punto("F1"), desplaza(figura.punto("F1"), dy: -10)))'
        E2p: 'cruce_aparente(parD2, segmento2(figura.punto("E1"), desplaza(figura.punto("E1"), dy: -10)))'
        A1p: 'cruce_aparente(parH1, segmento2(figura.punto("A2"), desplaza(figura.punto("A2"), dy: 10)))'
        C1p: 'cruce_aparente(parF1, segmento2(figura.punto("C2"), desplaza(figura.punto("C2"), dy: 10)))'
        D1p: 'cruce_aparente(parE1, segmento2(figura.punto("D2"), desplaza(figura.punto("D2"), dy: 10)))'
        A: 'punto3(alzado: figura.punto("A2"), planta: A1p)'
        C: 'punto3(alzado: figura.punto("C2"), planta: C1p)'
        D: 'punto3(alzado: figura.punto("D2"), planta: D1p)'
        E: 'punto3(alzado: E2p, planta: figura.punto("E1"))'
        F: 'punto3(alzado: F2p, planta: figura.punto("F1"))'
        G: 'punto3(alzado: G2p, planta: figura.punto("G1"))'
        # Los errores de completar: la paralela a la dirección de la otra vista
        # (a B₁G₁ en el alzado, o a A₂H₂ en la planta), o la de otro vértice.
        G2mal1: 'cruce_aparente(perpendicular(por: figura.punto("B2"), a: perpendicular(por: figura.punto("B2"), a: figura.segmento("BG1"))), segmento2(figura.punto("G1"), desplaza(figura.punto("G1"), dy: -10)))'
        G2mal2: 'cruce_aparente(figura.segmento("AH2"), segmento2(figura.punto("G1"), desplaza(figura.punto("G1"), dy: -10)))'
        F2mal1: 'cruce_aparente(perpendicular(por: figura.punto("C2"), a: perpendicular(por: figura.punto("C2"), a: figura.segmento("BG1"))), segmento2(figura.punto("F1"), desplaza(figura.punto("F1"), dy: -10)))'
        F2mal2: 'cruce_aparente(parD2, segmento2(figura.punto("F1"), desplaza(figura.punto("F1"), dy: -10)))'
        E2mal1: 'cruce_aparente(perpendicular(por: figura.punto("D2"), a: perpendicular(por: figura.punto("D2"), a: figura.segmento("BG1"))), segmento2(figura.punto("E1"), desplaza(figura.punto("E1"), dy: -10)))'
        A1mal1: 'cruce_aparente(perpendicular(por: figura.punto("H1"), a: perpendicular(por: figura.punto("H1"), a: figura.segmento("AH2"))), segmento2(figura.punto("A2"), desplaza(figura.punto("A2"), dy: 10)))'
        C1mal1: 'cruce_aparente(perpendicular(por: figura.punto("F1"), a: perpendicular(por: figura.punto("F1"), a: figura.segmento("AH2"))), segmento2(figura.punto("C2"), desplaza(figura.punto("C2"), dy: 10)))'
        D1mal1: 'cruce_aparente(perpendicular(por: figura.punto("E1"), a: perpendicular(por: figura.punto("E1"), a: figura.segmento("AH2"))), segmento2(figura.punto("D2"), desplaza(figura.punto("D2"), dy: 10)))'
        # La sección: cada arista lateral atraviesa la placa. Las cuatro cortan
        # su plano (ABCD queda a un lado y EFGH al otro), y la sección es el
        # paralelogramo IJKL.
        I: corte_recta_plano(recta3(A, H), mnop)
        J: corte_recta_plano(recta3(B, G), mnop)
        K: corte_recta_plano(recta3(C, F), mnop)
        L: corte_recta_plano(recta3(D, E), mnop)
        # Decisión: el plano auxiliar de cada arista, el de canto que la
        # contiene, que en el alzado es la propia arista: corta MN y OP, dos
        # frontales del plano, y en la planta esos puntos caen en M₁N₁ y O₁P₁. La
        # recta auxiliar corta la arista a 85,7° en la planta (con el plano
        # vertical, a 80,2°). Los planos de canto de las cuatro aristas son
        # paralelos, y sus rectas auxiliares también: la de BG sale de dos
        # puntos, 1 (en MN) y 2 (en OP, con B₂G₂ prolongada), y las otras tres
        # de un punto y la paralela: 3 en MN para AH, 4 y 5 en OP para CF y DE.
        q1_2: 'cruce_aparente(segmento2(figura.punto("B2"), G2p), segmento2(figura.punto("M2"), figura.punto("N2")))'
        q2_2: 'cruce_aparente(segmento2(figura.punto("B2"), G2p), segmento2(figura.punto("O2"), figura.punto("P2")))'
        q3_2: 'cruce_aparente(figura.segmento("AH2"), segmento2(figura.punto("M2"), figura.punto("N2")))'
        q4_2: 'cruce_aparente(segmento2(figura.punto("C2"), F2p), segmento2(figura.punto("O2"), figura.punto("P2")))'
        q5_2: 'cruce_aparente(segmento2(figura.punto("D2"), E2p), segmento2(figura.punto("O2"), figura.punto("P2")))'
        q1_1: 'cruce_aparente(segmento2(q1_2, desplaza(q1_2, dy: 10)), segmento2(figura.punto("M1"), figura.punto("N1")))'
        q2_1: 'cruce_aparente(segmento2(q2_2, desplaza(q2_2, dy: 10)), segmento2(figura.punto("O1"), figura.punto("P1")))'
        q3_1: 'cruce_aparente(segmento2(q3_2, desplaza(q3_2, dy: 10)), segmento2(figura.punto("M1"), figura.punto("N1")))'
        q4_1: 'cruce_aparente(segmento2(q4_2, desplaza(q4_2, dy: 10)), segmento2(figura.punto("O1"), figura.punto("P1")))'
        q5_1: 'cruce_aparente(segmento2(q5_2, desplaza(q5_2, dy: 10)), segmento2(figura.punto("O1"), figura.punto("P1")))'
        # Los errores de la sección: el cruce aparente de la arista con un lado
        # de la placa en el alzado, bajado a la planta de la arista.
        I1mal: 'cruce_aparente(segmento2(q3_2, desplaza(q3_2, dy: 10)), segmento2(figura.punto("H1"), A1p))'
        J1mal: 'cruce_aparente(segmento2(q1_2, desplaza(q1_2, dy: 10)), figura.segmento("BG1"))'
        K1mal: 'cruce_aparente(segmento2(q4_2, desplaza(q4_2, dy: 10)), segmento2(figura.punto("F1"), C1p))'
        L1mal: 'cruce_aparente(segmento2(q5_2, desplaza(q5_2, dy: 10)), segmento2(figura.punto("E1"), D1p))'
        jk_mm: en_mm(vm(J, K))
        # La visibilidad: los cruces aparentes donde una arista cambia de vista
        # a oculta (k_<arista>_<la que la cruza><vista>); los demás cambios son
        # I, J, K y L, y en el alzado q1_2, q3_2 y q4_2, que ya están.
        k_AH_PM1: 'cruce_aparente(segmento2(A1p, figura.punto("H1")), segmento2(figura.punto("P1"), figura.punto("M1")))'
        k_BG_MN1: 'cruce_aparente(figura.segmento("BG1"), segmento2(figura.punto("M1"), figura.punto("N1")))'
        k_DE_PM1: 'cruce_aparente(segmento2(D1p, figura.punto("E1")), segmento2(figura.punto("P1"), figura.punto("M1")))'
        k_NO_FG1: 'cruce_aparente(segmento2(figura.punto("N1"), figura.punto("O1")), figura.segmento("FG1"))'
        k_NO_EF1: 'cruce_aparente(segmento2(figura.punto("N1"), figura.punto("O1")), figura.segmento("EF1"))'
        k_CF_NO1: 'cruce_aparente(segmento2(C1p, figura.punto("F1")), segmento2(figura.punto("N1"), figura.punto("O1")))'
        k_FG_MN2: 'cruce_aparente(segmento2(F2p, G2p), segmento2(figura.punto("M2"), figura.punto("N2")))'
        k_OP_DA2: 'cruce_aparente(segmento2(figura.punto("O2"), figura.punto("P2")), figura.segmento("DA2"))'
        # Los extremos de las rectas largas: se trazan más allá del punto que van
        # a dar.
        L_G2: 'uno(medir_sobre(segmento2(figura.punto("B2"), G2p), desde: G2p, distancia: mm(4)), 1)'
        L_q2: 'uno(medir_sobre(segmento2(G2p, figura.punto("B2")), desde: q2_2, distancia: mm(4)), 1)'
        L_F2: 'uno(medir_sobre(segmento2(figura.punto("C2"), F2p), desde: F2p, distancia: mm(4)), 1)'
        L_E2: 'uno(medir_sobre(segmento2(figura.punto("D2"), E2p), desde: E2p, distancia: mm(4)), 1)'
        L_G2v: 'desplaza(G2p, dy: mm(-4))'
        L_F2v: 'desplaza(F2p, dy: mm(-4))'
        L_E2v: 'desplaza(E2p, dy: mm(-4))'
        L_A1: 'uno(medir_sobre(segmento2(figura.punto("H1"), A1p), desde: A1p, distancia: mm(4)), 1)'
        L_C1: 'uno(medir_sobre(segmento2(figura.punto("F1"), C1p), desde: C1p, distancia: mm(4)), 1)'
        L_D1: 'uno(medir_sobre(segmento2(figura.punto("E1"), D1p), desde: D1p, distancia: mm(4)), 1)'
        L_A1v: 'desplaza(A1p, dy: mm(4))'
        L_C1v: 'desplaza(C1p, dy: mm(4))'
        L_D1v: 'desplaza(D1p, dy: mm(4))'
        L_q1_1: 'desplaza(q1_1, dy: mm(4))'
        L_q2_1: 'desplaza(q2_1, dy: mm(4))'
        L_q3_1: 'desplaza(q3_1, dy: mm(4))'
        L_q4_1: 'desplaza(q4_1, dy: mm(4))'
        L_q5_1: 'desplaza(q5_1, dy: mm(4))'
        L_I1: 'uno(medir_sobre(segmento2(q3_1, proy_planta(I)), desde: proy_planta(I), distancia: mm(4)), 1)'
        L_K1: 'uno(medir_sobre(segmento2(q4_1, proy_planta(K)), desde: proy_planta(K), distancia: mm(4)), 1)'
        L_L1: 'uno(medir_sobre(segmento2(q5_1, proy_planta(L)), desde: proy_planta(L), distancia: mm(4)), 1)'
        L_I2: 'desplaza(proy_alzado(I), dy: mm(-4))'
        L_J2: 'desplaza(proy_alzado(J), dy: mm(-4))'
        L_K2: 'desplaza(proy_alzado(K), dy: mm(-4))'
        L_L2: 'desplaza(proy_alzado(L), dy: mm(-4))'
      comprueba:
        - en_plano(M, mnop)
        - en_plano(D, plano(A, B, C))
        - en_plano(H, plano(E, F, G))
        - en_plano(I, mnop)
        - en_plano(J, mnop)
        - en_plano(K, mnop)
        - en_plano(L, mnop)
        - en_recta(I, recta3(A, H))
        - en_recta(K, recta3(C, F))
    pasos:
      - tipo: reconocer
        pregunta: Ni las aristas laterales del prisma ni el plano MNOP son proyectantes. ¿Cómo se busca el punto donde una arista lateral, como BG, atraviesa la placa?
        opciones:
          - texto: Donde B₂G₂ cruza M₂N₂ en el alzado, porque ahí se tocan la arista y un lado de la placa, y ese punto se baja por su vertical hasta B₁G₁
            mensaje: |
              Ese es un cruce aparente: en el alzado se tapan, pero en el espacio MN pasa 7,6 mm por
              delante de BG, sin tocarla. Sirve para saber qué se ve, no para la intersección: el punto
              donde BG atraviesa la placa queda 4,6 mm más hacia B₂, en la misma B₂G₂.
          - texto: Con el plano de canto que contiene BG; corta MN y OP en dos puntos, y la recta que los une corta B₁G₁ en la planta
            correcta: true
            mensaje: |
              Eso es. El plano de canto que contiene BG se ve en el alzado como la propia B₂G₂, prolongada,
              y corta los lados MN y OP de la placa donde B₂G₂ los cruza. Bajados a M₁N₁ y O₁P₁, la recta
              que los une es su corte con la placa: está en el mismo plano que BG, y la corta de verdad.
          - texto: Donde B₁G₁ entra en la planta de la placa, cruzando M₁N₁
            mensaje: |
              Ese también es un cruce aparente: ahí MN pasa 12,0 mm por encima de BG. La arista entra
              debajo de la placa por ese cruce, pero la atraviesa más allá, en un punto que sale del plano
              auxiliar.

      - tipo: construir
        titulo: Las vistas completas, la sección y lo que se ve
        intro: |
          Primero, completa las vistas. Las aristas laterales de un prisma son paralelas: en el alzado,
          las de B, C y D van paralelas a A₂H₂, y G₂, F₂ y E₂ están donde cortan las verticales de G₁, F₁ y
          E₁; en la planta, las de H, F y E van paralelas a B₁G₁, y A₁, C₁ y D₁ están en las verticales de
          A₂, C₂ y D₂. Dibuja también los lados de la placa, que en la lámina son solo cruces.

          Después, la sección. Cada arista lateral atraviesa la placa, y su plano auxiliar es el de canto
          que la contiene: en el alzado se ve como la propia arista. El de BG corta M₂N₂ en 1₂ y, con
          B₂G₂ prolongada, O₂P₂ en 2₂; bájalos a M₁N₁ y O₁P₁, y 1₁2₁ corta B₁G₁ en J₁. Los planos de canto
          de las otras tres aristas son paralelos a ese, y cortan la placa en rectas paralelas a 1₁2₁: A₂H₂
          corta M₂N₂ en 3₂, y C₂F₂ y D₂E₂ cortan O₂P₂ en 4₂ y 5₂; la paralela a 1₁2₁ por 3₁, 4₁ o 5₁ da
          I₁, K₁ o L₁. Sube los cuatro al alzado. I, J, K y L y los puntos 1 a 5 son nombres nuestros.

          Por último, pasa a limpio con «arista vista» y «arista oculta» la placa, el prisma y la sección
          IJKL. Lo que de la lámina se ve entero no hace falta: la base ABCD en el alzado y la EFGH en la
          planta. Tomamos la placa y el prisma como piezas opacas, que el enunciado no lo dice. Algunos
          puntos quedan muy cerca de otros trazos: C₁, a 0,7 mm de M₁N₁; I₁, a 3,5 mm de donde A₁H₁ cruza
          la vertical de C₂; J₁, a 4,8 mm de la vertical de 1₂ sobre B₁G₁, y J₂ a 4,6 mm de 1₂. Amplía con la
          lupa (×4).
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, medir, visto, oculto, borrar]
        tolerancia: 1
        objetivos:
          - nombre: G2
            pide: G, el vértice de la base EFGH que va con B, en el alzado
            es: solucion.G2p
            bien: |
              G₂ está en la vertical de G₁, en la paralela a A₂H₂ que pasa por B₂: BG es una arista lateral,
              y en el alzado va paralela a A₂H₂.
            diagnosticos:
              - si: cerca_de(solucion.G2mal1)
                mensaje: |
                  Has trazado por B₂ la paralela a B₁G₁. Esa es la dirección de las aristas laterales en la
                  planta; en el alzado su dirección es la de A₂H₂.
                ejemplo: solucion.G2mal1
              - si: cerca_de(solucion.G2mal2)
                mensaje: |
                  Ese punto está en la recta A₂H₂, prolongada: es la arista de A. La de G sale de B, como dice
                  B₁G₁ en la planta: por B₂, la paralela a A₂H₂.
                ejemplo: solucion.G2mal2
              - si: '!en_vertical_de(figura.punto("G1"))'
                mensaje: |
                  G₂ va en la **vertical de G₁**: es el mismo punto visto dos veces.
                ejemplo: 'desplaza(solucion.G2p, dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la vertical de G₁, pero no en la arista: G₂ está donde la corta la paralela a A₂H₂
                  que pasa por B₂.
          - nombre: F2
            pide: F, el vértice de la base EFGH que va con C, en el alzado
            es: solucion.F2p
            bien: |
              F₂ está en la vertical de F₁, en la paralela a A₂H₂ por C₂.
            diagnosticos:
              - si: cerca_de(solucion.F2mal1)
                mensaje: |
                  Has trazado por C₂ la paralela a B₁G₁, la dirección de las aristas en la planta. En el
                  alzado, la arista CF va paralela a A₂H₂.
                ejemplo: solucion.F2mal1
              - si: cerca_de(solucion.F2mal2)
                mensaje: |
                  Esa es la paralela por D₂. F va con C: si H es la de A y G la de B, F es la de C, y la arista
                  sale de C₂.
                ejemplo: solucion.F2mal2
              - si: '!en_vertical_de(figura.punto("F1"))'
                mensaje: |
                  F₂ va en la **vertical de F₁**.
                ejemplo: 'desplaza(solucion.F2p, dx: mm(-6))'
              - si: siempre
                mensaje: |
                  Estás en la vertical de F₁, pero no en la arista: F₂ está donde la corta la paralela a A₂H₂
                  que pasa por C₂.
          - nombre: E2
            pide: E, el vértice de la base EFGH que va con D, en el alzado
            es: solucion.E2p
            bien: |
              E₂ está en la vertical de E₁, en la paralela a A₂H₂ por D₂. E₂F₂G₂H₂ es el alzado de la otra
              base.
            diagnosticos:
              - si: cerca_de(solucion.E2mal1)
                mensaje: |
                  Has trazado por D₂ la paralela a B₁G₁, que es la dirección de las aristas en la planta. En
                  el alzado, DE va paralela a A₂H₂.
                ejemplo: solucion.E2mal1
              - si: '!en_vertical_de(figura.punto("E1"))'
                mensaje: |
                  E₂ va en la **vertical de E₁**.
                ejemplo: 'desplaza(solucion.E2p, dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la vertical de E₁, pero no en la arista: E₂ está donde la corta la paralela a A₂H₂
                  que pasa por D₂.
          - nombre: A1
            pide: A, en la planta
            es: solucion.A1p
            bien: |
              A₁ está en la vertical de A₂, en la paralela a B₁G₁ que pasa por H₁: AH es una arista lateral.
            diagnosticos:
              - si: cerca_de(solucion.A1mal1)
                mensaje: |
                  Has trazado por H₁ la paralela a A₂H₂, que es la dirección de las aristas en el alzado. En la
                  planta van paralelas a B₁G₁.
                ejemplo: solucion.A1mal1
              - si: '!en_vertical_de(figura.punto("A2"))'
                mensaje: |
                  A₁ va en la **vertical de A₂**.
                ejemplo: 'desplaza(solucion.A1p, dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la vertical de A₂, pero no en la arista: A₁ está donde la corta la paralela a B₁G₁
                  que pasa por H₁.
          - nombre: C1
            pide: C, en la planta
            es: solucion.C1p
            bien: |
              C₁ está en la vertical de C₂, en la paralela a B₁G₁ por F₁.
            diagnosticos:
              - si: cerca_de(solucion.C1mal1)
                mensaje: |
                  Has trazado por F₁ la paralela a A₂H₂, la dirección del alzado. En la planta, CF va paralela a
                  B₁G₁.
                ejemplo: solucion.C1mal1
              - si: '!en_vertical_de(figura.punto("C2"))'
                mensaje: |
                  C₁ va en la **vertical de C₂**.
                ejemplo: 'desplaza(solucion.C1p, dx: mm(-6))'
              - si: siempre
                mensaje: |
                  Estás en la vertical de C₂, pero no en la arista: C₁ está donde la corta la paralela a B₁G₁
                  que pasa por F₁.
          - nombre: D1
            pide: D, en la planta
            es: solucion.D1p
            bien: |
              D₁ está en la vertical de D₂, en la paralela a B₁G₁ por E₁. A₁B₁C₁D₁ es la planta de la base
              ABCD.
            diagnosticos:
              - si: cerca_de(solucion.D1mal1)
                mensaje: |
                  Has trazado por E₁ la paralela a A₂H₂, la dirección del alzado. En la planta, DE va paralela a
                  B₁G₁.
                ejemplo: solucion.D1mal1
              - si: '!en_vertical_de(figura.punto("D2"))'
                mensaje: |
                  D₁ va en la **vertical de D₂**.
                ejemplo: 'desplaza(solucion.D1p, dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la vertical de D₂, pero no en la arista: D₁ está donde la corta la paralela a B₁G₁
                  que pasa por E₁.
          - nombre: J1
            pide: J, donde la arista BG atraviesa la placa, en la planta
            es: proy_planta(solucion.J)
            bien: |
              J₁ está en B₁G₁, donde la corta 1₁2₁: la recta en que el plano de canto de BG corta a la placa.
              Esa recta y BG están en el mismo plano, así que se cortan de verdad.
            diagnosticos:
              - si: cerca_de(solucion.k_BG_MN1)
                mensaje: |
                  Ese es el cruce aparente de B₁G₁ con M₁N₁: ahí MN pasa 12,0 mm por encima de BG, sin tocarla.
                  J₁ está donde B₁G₁ corta 1₁2₁, la recta auxiliar.
                ejemplo: solucion.k_BG_MN1
              - si: cerca_de(solucion.J1mal)
                mensaje: |
                  Has bajado a B₁G₁ el punto 1₂, el cruce de B₂G₂ con M₂N₂. Es un cruce aparente: 1 es un punto
                  de MN, no de BG. Bájalo a M₁N₁, y une 1₁ con 2₁.
                ejemplo: solucion.J1mal
              - si: '!en_recta(figura.segmento("BG1"))'
                mensaje: |
                  J es un punto de la arista BG: J₁ va **en B₁G₁**, donde la corta la recta 1₁2₁.
                ejemplo: 'desplaza(proy_planta(solucion.J), dx: mm(-5))'
              - si: siempre
                mensaje: |
                  Estás en B₁G₁, pero no donde la corta 1₁2₁. 1₂ y 2₂ son los cruces de B₂G₂, prolongada, con
                  M₂N₂ y O₂P₂; bajados a M₁N₁ y O₁P₁, dan 1₁ y 2₁.
          - nombre: J2
            pide: J, en el alzado
            es: proy_alzado(solucion.J)
            bien: |
              J₂ está en B₂G₂, en la vertical de J₁.
            diagnosticos:
              - si: cerca_de(solucion.q1_2)
                mensaje: |
                  Ese es 1₂, donde B₂G₂ cruza M₂N₂: un cruce aparente, porque MN pasa ahí 7,6 mm por delante de
                  BG. J₂ sube de J₁ por su vertical.
                ejemplo: solucion.q1_2
              - si: '!en_vertical_de(J1)'
                mensaje: |
                  J₂ va en la **vertical de J₁**.
                ejemplo: 'desplaza(proy_alzado(solucion.J), dx: mm(-6))'
              - si: '!en_recta(segmento2(figura.punto("B2"), solucion.G2p))'
                mensaje: |
                  J está en BG: J₂ va donde la vertical de J₁ corta **B₂G₂**.
                ejemplo: 'desplaza(proy_alzado(solucion.J), dy: mm(6))'
              - si: siempre
                mensaje: |
                  J₂ está en la vertical de J₁, sobre B₂G₂.
          - nombre: I1
            pide: I, donde la arista AH atraviesa la placa, en la planta
            es: proy_planta(solucion.I)
            bien: |
              I₁ está en A₁H₁, donde la corta la paralela a 1₁2₁ que pasa por 3₁: el plano de canto de AH es
              paralelo al de BG, y corta a la placa en una recta paralela.
            diagnosticos:
              - si: cerca_de(solucion.k_AH_PM1)
                mensaje: |
                  Ese es el cruce aparente de A₁H₁ con P₁M₁: PM pasa ahí 27,3 mm por encima de AH. I₁ está
                  donde A₁H₁ corta la paralela a 1₁2₁ por 3₁.
                ejemplo: solucion.k_AH_PM1
              - si: cerca_de(solucion.I1mal)
                mensaje: |
                  Has bajado a A₁H₁ el punto 3₂, donde A₂H₂ cruza M₂N₂. Es un punto de MN, no de AH: bájalo a
                  M₁N₁, y por 3₁ traza la paralela a 1₁2₁.
                ejemplo: solucion.I1mal
              - si: '!en_recta(segmento2(figura.punto("H1"), solucion.A1p))'
                mensaje: |
                  I es un punto de la arista AH: I₁ va **en A₁H₁**.
                ejemplo: 'desplaza(proy_planta(solucion.I), dx: mm(5))'
              - si: siempre
                mensaje: |
                  Estás en A₁H₁, pero no donde la corta la paralela a 1₁2₁ que pasa por 3₁.
          - nombre: I2
            pide: I, en el alzado
            es: proy_alzado(solucion.I)
            bien: |
              I₂ está en A₂H₂, en la vertical de I₁.
            diagnosticos:
              - si: cerca_de(solucion.q3_2)
                mensaje: |
                  Ese es 3₂, donde A₂H₂ cruza M₂N₂: un cruce aparente, porque MN pasa ahí 23,8 mm por delante de
                  AH. I₂ sube de I₁ por su vertical.
                ejemplo: solucion.q3_2
              - si: '!en_vertical_de(I1)'
                mensaje: |
                  I₂ va en la **vertical de I₁**.
                ejemplo: 'desplaza(proy_alzado(solucion.I), dx: mm(6))'
              - si: '!en_recta(figura.segmento("AH2"))'
                mensaje: |
                  I está en AH: I₂ va donde la vertical de I₁ corta **A₂H₂**.
                ejemplo: 'desplaza(proy_alzado(solucion.I), dy: mm(6))'
              - si: siempre
                mensaje: |
                  I₂ está en la vertical de I₁, sobre A₂H₂.
          - nombre: K1
            pide: K, donde la arista CF atraviesa la placa, en la planta
            es: proy_planta(solucion.K)
            bien: |
              K₁ está en C₁F₁, donde la corta la paralela a 1₁2₁ que pasa por 4₁.
            diagnosticos:
              - si: cerca_de(solucion.k_CF_NO1)
                mensaje: |
                  Ese es el cruce aparente de C₁F₁ con N₁O₁: CF pasa ahí 18,5 mm por encima de NO, fuera de la
                  placa. K₁ está donde C₁F₁ corta la paralela a 1₁2₁ por 4₁.
                ejemplo: solucion.k_CF_NO1
              - si: cerca_de(solucion.K1mal)
                mensaje: |
                  Has bajado a C₁F₁ el punto 4₂, donde C₂F₂ cruza O₂P₂. Es un punto de OP: bájalo a O₁P₁, y por
                  4₁ traza la paralela a 1₁2₁.
                ejemplo: solucion.K1mal
              - si: '!en_recta(segmento2(figura.punto("F1"), solucion.C1p))'
                mensaje: |
                  K es un punto de la arista CF: K₁ va **en C₁F₁**.
                ejemplo: 'desplaza(proy_planta(solucion.K), dx: mm(-5))'
              - si: siempre
                mensaje: |
                  Estás en C₁F₁, pero no donde la corta la paralela a 1₁2₁ que pasa por 4₁.
          - nombre: K2
            pide: K, en el alzado
            es: proy_alzado(solucion.K)
            bien: |
              K₂ está en C₂F₂, en la vertical de K₁.
            diagnosticos:
              - si: cerca_de(solucion.q4_2)
                mensaje: |
                  Ese es 4₂, donde C₂F₂ cruza O₂P₂: un cruce aparente, porque CF pasa ahí 49,7 mm por delante de
                  OP. K₂ sube de K₁ por su vertical.
                ejemplo: solucion.q4_2
              - si: '!en_vertical_de(K1)'
                mensaje: |
                  K₂ va en la **vertical de K₁**.
                ejemplo: 'desplaza(proy_alzado(solucion.K), dx: mm(-6))'
              - si: '!en_recta(segmento2(figura.punto("C2"), solucion.F2p))'
                mensaje: |
                  K está en CF: K₂ va donde la vertical de K₁ corta **C₂F₂**.
                ejemplo: 'desplaza(proy_alzado(solucion.K), dy: mm(6))'
              - si: siempre
                mensaje: |
                  K₂ está en la vertical de K₁, sobre C₂F₂.
          - nombre: L1
            pide: L, donde la arista DE atraviesa la placa, en la planta
            es: proy_planta(solucion.L)
            bien: |
              L₁ está en D₁E₁, donde la corta la paralela a 1₁2₁ que pasa por 5₁. I₁J₁K₁L₁ es la planta de la
              sección: un paralelogramo, porque las caras opuestas del prisma son paralelas.
            diagnosticos:
              - si: cerca_de(solucion.k_DE_PM1)
                mensaje: |
                  Ese es el cruce aparente de D₁E₁ con P₁M₁: PM pasa ahí 50,7 mm por encima de DE. L₁ está donde
                  D₁E₁ corta la paralela a 1₁2₁ por 5₁.
                ejemplo: solucion.k_DE_PM1
              - si: cerca_de(solucion.L1mal)
                mensaje: |
                  Has bajado a D₁E₁ el punto 5₂, donde D₂E₂ cruza O₂P₂. Es un punto de OP: bájalo a O₁P₁, y por
                  5₁ traza la paralela a 1₁2₁.
                ejemplo: solucion.L1mal
              - si: '!en_recta(segmento2(figura.punto("E1"), solucion.D1p))'
                mensaje: |
                  L es un punto de la arista DE: L₁ va **en D₁E₁**.
                ejemplo: 'desplaza(proy_planta(solucion.L), dx: mm(5))'
              - si: siempre
                mensaje: |
                  Estás en D₁E₁, pero no donde la corta la paralela a 1₁2₁ que pasa por 5₁.
          - nombre: L2
            pide: L, en el alzado
            es: proy_alzado(solucion.L)
            bien: |
              L₂ está en D₂E₂, en la vertical de L₁. I₂J₂K₂L₂ es el alzado de la sección.
            diagnosticos:
              - si: cerca_de(solucion.q5_2)
                mensaje: |
                  Ese es 5₂, donde D₂E₂ cruza O₂P₂: un cruce aparente, porque DE pasa ahí 33,6 mm por delante de
                  OP. L₂ sube de L₁ por su vertical.
                ejemplo: solucion.q5_2
              - si: '!en_vertical_de(L1)'
                mensaje: |
                  L₂ va en la **vertical de L₁**.
                ejemplo: 'desplaza(proy_alzado(solucion.L), dx: mm(6))'
              - si: '!en_recta(segmento2(figura.punto("D2"), solucion.E2p))'
                mensaje: |
                  L está en DE: L₂ va donde la vertical de L₁ corta **D₂E₂**.
                ejemplo: 'desplaza(proy_alzado(solucion.L), dy: mm(6))'
              - si: siempre
                mensaje: |
                  L₂ está en la vertical de L₁, sobre D₂E₂.
        # Decisión: la placa y el prisma, opacos (lo dicen las Notas nuestras).
        # La visibilidad sale de KIT\visibilidad.mjs (rayos contra las seis caras
        # del prisma y la placa, vis\sd35): cada cambio, en el cruce aparente que
        # dice su tramo o en I, J, K o L. Lo que dibuja el alumno va entero, en
        # tramos; de lo que ya está en la lámina, solo lo que cambia: A₂H₂ y
        # B₁G₁. La base ABCD en el alzado y la EFGH en la planta se ven enteras.
        tramos:
          - traza: segmento2(solucion.A1p, figura.punto("B1"))
            tipo: visto
            porque: 'AB es borde de la planta del prisma y queda fuera de la planta de la placa: desde arriba nada la tapa.'
          - traza: segmento2(figura.punto("B1"), solucion.C1p)
            tipo: oculto
            porque: 'BC va por debajo del prisma: desde arriba la tapa su cara ABGH, que sube hacia la base EFGH, y junto a C también la placa.'
          - traza: segmento2(solucion.C1p, solucion.D1p)
            tipo: oculto
            porque: 'CD es la arista más baja del prisma: desde arriba la tapan sus caras ABGH y DAHE, y la placa.'
          - traza: segmento2(solucion.D1p, solucion.A1p)
            tipo: visto
            porque: 'DA es borde de la planta del prisma, a la izquierda de P₁M₁, fuera de la planta de la placa: nada la tapa.'
          - traza: segmento2(solucion.A1p, solucion.k_AH_PM1)
            tipo: visto
            porque: 'De A₁ al cruce con P₁M₁, AH queda fuera de la planta de la placa: desde arriba nada la tapa.'
          - traza: segmento2(solucion.k_AH_PM1, proy_planta(solucion.I))
            tipo: oculto
            porque: 'Del cruce con P₁M₁ hasta I, AH va por debajo de la placa, que la tapa desde arriba: en el cruce aparente, PM va 27,3 mm más alta que AH.'
          - traza: segmento2(proy_planta(solucion.I), figura.punto("H1"))
            tipo: visto
            porque: 'En I, AH atraviesa la placa y sale por encima: de I₁ a H₁ nada la tapa.'
          - traza: segmento2(figura.punto("B1"), solucion.k_BG_MN1)
            tipo: visto
            porque: 'De B₁ al cruce con M₁N₁, BG queda fuera de la planta de la placa: desde arriba nada la tapa.'
          - traza: segmento2(solucion.k_BG_MN1, proy_planta(solucion.J))
            tipo: oculto
            porque: 'Del cruce con M₁N₁ hasta J, BG va por debajo de la placa: en el cruce aparente, MN va 12,0 mm más alta que BG.'
          - traza: segmento2(proy_planta(solucion.J), figura.punto("G1"))
            tipo: visto
            porque: 'En J, BG atraviesa la placa y sale por encima: de J₁ a G₁ nada la tapa.'
          - traza: segmento2(solucion.C1p, figura.punto("F1"))
            tipo: oculto
            porque: 'CF es la arista de abajo del prisma: desde arriba la tapan la cara ABGH y la base EFGH, y de C a K también la placa.'
          - traza: segmento2(solucion.D1p, solucion.k_DE_PM1)
            tipo: visto
            porque: 'De D₁ al cruce con P₁M₁, DE queda fuera de la planta de la placa, y es borde de la planta del prisma: nada la tapa.'
          - traza: segmento2(solucion.k_DE_PM1, proy_planta(solucion.L))
            tipo: oculto
            porque: 'Del cruce con P₁M₁ hasta L, DE va por debajo de la placa: en el cruce aparente, PM va 50,7 mm más alta que DE.'
          - traza: segmento2(proy_planta(solucion.L), figura.punto("E1"))
            tipo: visto
            porque: 'En L, DE atraviesa la placa y sale por encima: de L₁ a E₁ nada la tapa.'
          - traza: segmento2(figura.punto("M1"), figura.punto("N1"))
            tipo: visto
            porque: 'MN es el lado más alto de la placa, y por encima no le pasa nada del prisma.'
          - traza: segmento2(figura.punto("N1"), solucion.k_NO_FG1)
            tipo: visto
            porque: 'De N₁ al cruce con F₁G₁, NO queda fuera de la planta del prisma: nada la tapa.'
          - traza: segmento2(solucion.k_NO_FG1, solucion.k_NO_EF1)
            tipo: oculto
            porque: 'Entre los cruces con F₁G₁ y E₁F₁, NO pasa por debajo de la base EFGH del prisma: en el primero FG va 23,3 mm más alta, y en el segundo EF, 24,6.'
          - traza: segmento2(solucion.k_NO_EF1, figura.punto("O1"))
            tipo: visto
            porque: 'Del cruce con E₁F₁ a O₁, NO sale de debajo del prisma: nada la tapa.'
          - traza: segmento2(figura.punto("O1"), figura.punto("P1"))
            tipo: visto
            porque: 'OP, el lado de atrás de la placa, queda fuera de la planta del prisma: nada la tapa.'
          - traza: segmento2(figura.punto("P1"), figura.punto("M1"))
            tipo: visto
            porque: 'PM va por encima de las aristas del prisma que cruza, AH, DE y CD: nada la tapa.'
          - traza: segmento2(proy_planta(solucion.I), proy_planta(solucion.J))
            tipo: visto
            porque: 'IJ está en la cara ABGH, la de arriba del prisma, y en la placa: desde arriba nada la tapa.'
          - traza: segmento2(proy_planta(solucion.J), proy_planta(solucion.K))
            tipo: oculto
            porque: 'JK está en la cara BCFG, que mira hacia abajo: desde arriba la tapan la parte del prisma que queda por encima de la placa, con la cara ABGH y la base EFGH.'
          - traza: segmento2(proy_planta(solucion.K), proy_planta(solucion.L))
            tipo: oculto
            porque: 'KL está en la cara CDEF, la de abajo del prisma: desde arriba la tapan la base EFGH y la cara DAHE.'
          - traza: segmento2(proy_planta(solucion.L), proy_planta(solucion.I))
            tipo: visto
            porque: 'LI está en la cara DAHE, que mira hacia arriba, y en la placa: desde arriba nada la tapa.'
          - traza: segmento2(solucion.E2p, solucion.F2p)
            tipo: oculto
            porque: 'EF es arista de la base de atrás: por delante la tapan la cara BCFG del prisma y la placa.'
          - traza: segmento2(solucion.F2p, solucion.k_FG_MN2)
            tipo: oculto
            porque: 'De F₂ al cruce con M₂N₂, FG queda detrás de la placa: en el cruce aparente, MN va 26,5 mm más cerca de quien mira.'
          - traza: segmento2(solucion.k_FG_MN2, solucion.G2p)
            tipo: visto
            porque: 'Del cruce con M₂N₂ a G₂, FG sale del alzado de la placa, y es borde del alzado del prisma: nada la tapa.'
          - traza: segmento2(solucion.G2p, figura.punto("H2"))
            tipo: visto
            porque: 'GH es la arista más alta del prisma, borde de su alzado, y por encima de la placa: nada la tapa.'
          - traza: segmento2(figura.punto("H2"), solucion.E2p)
            tipo: oculto
            porque: 'HE es arista de la base de atrás: por delante la tapan la cara ABGH del prisma y la placa; en el cruce aparente con M₂N₂, MN va 39,5 mm más cerca de quien mira.'
          - traza: segmento2(figura.punto("A2"), proy_alzado(solucion.I))
            tipo: visto
            porque: 'De A₂ a I₂, AH va por delante de la placa, que atraviesa en I: nada la tapa.'
          - traza: segmento2(proy_alzado(solucion.I), solucion.q3_2)
            tipo: oculto
            porque: 'En I, AH pasa detrás de la placa, que la tapa hasta su borde, M₂N₂: en el cruce aparente, MN va 23,8 mm más cerca de quien mira.'
          - traza: segmento2(solucion.q3_2, figura.punto("H2"))
            tipo: visto
            porque: 'Del cruce con M₂N₂ a H₂, AH sale del alzado de la placa, y es borde del alzado del prisma: nada la tapa.'
          - traza: segmento2(figura.punto("B2"), proy_alzado(solucion.J))
            tipo: visto
            porque: 'De B₂ a J₂, BG va por delante de la placa, que atraviesa en J: nada la tapa.'
          - traza: segmento2(proy_alzado(solucion.J), solucion.q1_2)
            tipo: oculto
            porque: 'En J, BG pasa detrás de la placa hasta su borde, M₂N₂: en el cruce aparente, MN va 7,6 mm más cerca de quien mira.'
          - traza: segmento2(solucion.q1_2, solucion.G2p)
            tipo: visto
            porque: 'Del cruce con M₂N₂ a G₂, BG sale del alzado de la placa: nada la tapa.'
          - traza: segmento2(figura.punto("C2"), proy_alzado(solucion.K))
            tipo: visto
            porque: 'De C₂ a K₂, CF va por delante de la placa, y es borde del alzado del prisma: nada la tapa. En el cruce aparente con O₂P₂, CF va 49,7 mm más cerca de quien mira.'
          - traza: segmento2(proy_alzado(solucion.K), solucion.F2p)
            tipo: oculto
            porque: 'En K, CF atraviesa la placa y pasa detrás: de K₂ a F₂ la tapa esa placa.'
          - traza: segmento2(figura.punto("D2"), solucion.E2p)
            tipo: oculto
            porque: 'DE es la arista de atrás del prisma: por delante la tapan su base ABCD y su cara BCFG, y de L a E también la placa.'
          - traza: segmento2(figura.punto("M2"), figura.punto("N2"))
            tipo: visto
            porque: 'MN es el lado de delante de la placa, y pasa por delante de las aristas del prisma que cruza: nada la tapa.'
          - traza: segmento2(figura.punto("N2"), figura.punto("O2"))
            tipo: visto
            porque: 'NO queda fuera del alzado del prisma: nada la tapa.'
          - traza: segmento2(figura.punto("O2"), solucion.q4_2)
            tipo: visto
            porque: 'De O₂ al cruce con C₂F₂, OP queda fuera del alzado del prisma: nada la tapa.'
          - traza: segmento2(solucion.q4_2, solucion.k_OP_DA2)
            tipo: oculto
            porque: 'Entre los cruces con C₂F₂ y D₂A₂, OP, el lado de atrás de la placa, va detrás del prisma: en el primero CF va 49,7 mm más cerca de quien mira, y en el segundo DA, 55,3.'
          - traza: segmento2(solucion.k_OP_DA2, figura.punto("P2"))
            tipo: visto
            porque: 'Del cruce con D₂A₂ a P₂, OP sale del alzado del prisma: nada la tapa.'
          - traza: segmento2(figura.punto("P2"), figura.punto("M2"))
            tipo: visto
            porque: 'PM queda fuera del alzado del prisma: nada la tapa.'
          - traza: segmento2(proy_alzado(solucion.I), proy_alzado(solucion.J))
            tipo: visto
            porque: 'IJ está en la cara ABGH, que mira hacia delante, y en la placa: nada la tapa.'
          - traza: segmento2(proy_alzado(solucion.J), proy_alzado(solucion.K))
            tipo: visto
            porque: 'JK está en la cara BCFG, que mira hacia delante, y en la placa: nada la tapa.'
          - traza: segmento2(proy_alzado(solucion.K), proy_alzado(solucion.L))
            tipo: oculto
            porque: 'KL está en la cara CDEF, que mira hacia atrás: por delante la tapa la cara BCFG.'
          - traza: segmento2(proy_alzado(solucion.L), proy_alzado(solucion.I))
            tipo: oculto
            porque: 'LI está en la cara DAHE, que mira hacia atrás: por delante la tapan las caras BCFG y ABGH.'
        trazado:
          - segmento2(solucion.q1_1, solucion.q2_1)
          - segmento2(solucion.q3_1, proy_planta(solucion.I))
          - segmento2(solucion.q4_1, proy_planta(solucion.K))
          - segmento2(solucion.q5_1, proy_planta(solucion.L))
        construccion:
          - con: regla
            traza: '[segmento2(figura.punto("M2"), figura.punto("N2")), segmento2(figura.punto("N2"), figura.punto("O2")), segmento2(figura.punto("O2"), figura.punto("P2")), segmento2(figura.punto("P2"), figura.punto("M2")), segmento2(figura.punto("M1"), figura.punto("N1")), segmento2(figura.punto("N1"), figura.punto("O1")), segmento2(figura.punto("O1"), figura.punto("P1")), segmento2(figura.punto("P1"), figura.punto("M1"))]'
            porque: |
              **Las vistas que faltan.** Los lados de la placa, de cruz a cruz, en las dos vistas. M₁N₁ y
              O₁P₁ salen horizontales en el papel: MN y OP son frontales de la placa.
          - con: escuadra-cartabon
            traza: '[segmento2(figura.punto("B2"), solucion.L_G2), segmento2(figura.punto("B2"), solucion.L_q2), segmento2(figura.punto("C2"), solucion.L_F2), segmento2(figura.punto("D2"), solucion.L_E2)]'
            guia: figura.segmento("AH2")
            porque: |
              En el alzado, por B₂, C₂ y D₂, las paralelas a A₂H₂: las aristas laterales de un prisma son
              paralelas. Largas, hasta pasar las verticales de G₁, F₁ y E₁; la de B₂, también al otro lado de
              B₂, hasta pasar O₂P₂, porque servirá para la sección.
          - con: escuadra-cartabon
            traza: '[segmento2(figura.punto("G1"), solucion.L_G2v), segmento2(figura.punto("F1"), solucion.L_F2v), segmento2(figura.punto("E1"), solucion.L_E2v)]'
            porque: |
              Por G₁, F₁ y E₁, las verticales hacia el alzado, hasta pasar las paralelas.
          - con: marca
            traza: solucion.G2p
            rotulo: G₂
            porque: |
              G₂, donde la vertical de G₁ corta la paralela que sale de B₂: G es el vértice que va con B.
          - con: marca
            traza: solucion.F2p
            rotulo: F₂
            porque: |
              F₂, donde la vertical de F₁ corta la paralela que sale de C₂.
          - con: marca
            traza: solucion.E2p
            rotulo: E₂
            porque: |
              E₂, donde la vertical de E₁ corta la paralela que sale de D₂.
          - con: regla
            traza: '[segmento2(solucion.E2p, solucion.F2p), segmento2(solucion.F2p, solucion.G2p), segmento2(solucion.G2p, figura.punto("H2")), segmento2(figura.punto("H2"), solucion.E2p)]'
            porque: |
              El alzado de la base EFGH, de vértice a vértice: un paralelogramo, como el de ABCD.
          - con: escuadra-cartabon
            traza: '[segmento2(figura.punto("H1"), solucion.L_A1), segmento2(figura.punto("F1"), solucion.L_C1), segmento2(figura.punto("E1"), solucion.L_D1)]'
            guia: figura.segmento("BG1")
            porque: |
              En la planta, por H₁, F₁ y E₁, las paralelas a B₁G₁, largas, hasta pasar las verticales de A₂,
              C₂ y D₂.
          - con: escuadra-cartabon
            traza: '[segmento2(figura.punto("A2"), solucion.L_A1v), segmento2(figura.punto("C2"), solucion.L_C1v), segmento2(figura.punto("D2"), solucion.L_D1v)]'
            porque: |
              Por A₂, C₂ y D₂, las verticales hacia la planta, hasta pasar las paralelas.
          - con: marca
            traza: solucion.A1p
            rotulo: A₁
            porque: |
              A₁, donde la vertical de A₂ corta la paralela que sale de H₁.
          - con: marca
            traza: solucion.C1p
            rotulo: C₁
            porque: |
              C₁, donde la vertical de C₂ corta la paralela que sale de F₁.
          - con: marca
            traza: solucion.D1p
            rotulo: D₁
            porque: |
              D₁, donde la vertical de D₂ corta la paralela que sale de E₁.
          - con: regla
            traza: '[segmento2(solucion.A1p, figura.punto("B1")), segmento2(figura.punto("B1"), solucion.C1p), segmento2(solucion.C1p, solucion.D1p), segmento2(solucion.D1p, solucion.A1p)]'
            porque: |
              La planta de la base ABCD, de vértice a vértice.
          - con: marca
            traza: solucion.q1_2
            rotulo: 1₂
            porque: |
              **La sección.** El plano de canto que contiene BG se ve en el alzado como B₂G₂, y corta los
              lados de la placa donde B₂G₂ los cruza. 1₂, donde B₂G₂ cruza M₂N₂: el punto de MN que está en
              ese plano. Los puntos 1 a 5 son nombres nuestros, como I, J, K y L.
          - con: marca
            traza: solucion.q2_2
            rotulo: 2₂
            porque: |
              2₂, donde B₂G₂, prolongada más allá de B₂, cruza O₂P₂: el punto de OP en ese plano.
          - con: escuadra-cartabon
            traza: '[segmento2(solucion.q1_2, solucion.L_q1_1), segmento2(solucion.q2_2, solucion.L_q2_1)]'
            porque: |
              Por 1₂ y 2₂, las verticales hacia la planta, hasta pasar M₁N₁ y O₁P₁.
          - con: marca
            traza: solucion.q1_1
            rotulo: 1₁
            porque: |
              1₁, donde la vertical de 1₂ corta M₁N₁.
          - con: marca
            traza: solucion.q2_1
            rotulo: 2₁
            porque: |
              2₁, donde la vertical de 2₂ corta O₁P₁.
          - con: regla
            traza: segmento2(solucion.q1_1, solucion.q2_1)
            porque: |
              1₁2₁, la planta de la recta en que el plano de canto de BG corta a la placa. Esa recta y BG
              están en el mismo plano, así que se cortan de verdad.
          - con: marca
            traza: proy_planta(solucion.J)
            rotulo: J₁
            porque: |
              J₁, donde 1₁2₁ corta B₁G₁: el punto donde la arista BG atraviesa la placa.
          - con: marca
            traza: solucion.q3_2
            rotulo: 3₂
            porque: |
              Para las otras tres aristas basta un punto: sus planos de canto son paralelos al de BG, y
              cortan a la placa en rectas paralelas a 1₁2₁. 3₂, donde A₂H₂ cruza M₂N₂.
          - con: marca
            traza: solucion.q4_2
            rotulo: 4₂
            porque: |
              4₂, donde C₂F₂ cruza O₂P₂.
          - con: marca
            traza: solucion.q5_2
            rotulo: 5₂
            porque: |
              5₂, donde D₂E₂ cruza O₂P₂.
          - con: escuadra-cartabon
            traza: '[segmento2(solucion.q3_2, solucion.L_q3_1), segmento2(solucion.q4_2, solucion.L_q4_1), segmento2(solucion.q5_2, solucion.L_q5_1)]'
            porque: |
              Por 3₂, 4₂ y 5₂, las verticales hacia la planta, hasta pasar M₁N₁ o O₁P₁.
          - con: marca
            traza: solucion.q3_1
            rotulo: 3₁
            porque: |
              3₁, donde la vertical de 3₂ corta M₁N₁.
          - con: marca
            traza: solucion.q4_1
            rotulo: 4₁
            porque: |
              4₁, donde la vertical de 4₂ corta O₁P₁.
          - con: marca
            traza: solucion.q5_1
            rotulo: 5₁
            porque: |
              5₁, donde la vertical de 5₂ corta O₁P₁.
          - con: escuadra-cartabon
            traza: '[segmento2(solucion.q3_1, solucion.L_I1), segmento2(solucion.q4_1, solucion.L_K1), segmento2(solucion.q5_1, solucion.L_L1)]'
            guia: segmento2(solucion.q1_1, solucion.q2_1)
            porque: |
              Por 3₁, 4₁ y 5₁, las paralelas a 1₁2₁, hasta pasar A₁H₁, C₁F₁ y D₁E₁: son los cortes de la
              placa con los planos de canto de AH, CF y DE.
          - con: marca
            traza: proy_planta(solucion.I)
            rotulo: I₁
            porque: |
              I₁, donde la paralela que sale de 3₁ corta A₁H₁.
          - con: marca
            traza: proy_planta(solucion.K)
            rotulo: K₁
            porque: |
              K₁, donde la paralela que sale de 4₁ corta C₁F₁.
          - con: marca
            traza: proy_planta(solucion.L)
            rotulo: L₁
            porque: |
              L₁, donde la paralela que sale de 5₁ corta D₁E₁.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(solucion.I), solucion.L_I2), segmento2(proy_planta(solucion.J), solucion.L_J2), segmento2(proy_planta(solucion.K), solucion.L_K2), segmento2(proy_planta(solucion.L), solucion.L_L2)]'
            porque: |
              Por I₁, J₁, K₁ y L₁, las verticales hacia el alzado, hasta pasar cada una su arista.
          - con: marca
            traza: proy_alzado(solucion.I)
            rotulo: I₂
            porque: |
              I₂, donde la vertical de I₁ corta A₂H₂.
          - con: marca
            traza: proy_alzado(solucion.J)
            porque: |
              J₂, donde la vertical de J₁ corta B₂G₂, 4,6 mm a la izquierda de 1₂. Va sin rótulo: el punto
              1₂ lo taparía.
          - con: marca
            traza: proy_alzado(solucion.K)
            rotulo: K₂
            porque: |
              K₂, donde la vertical de K₁ corta C₂F₂.
          - con: marca
            traza: proy_alzado(solucion.L)
            rotulo: L₂
            porque: |
              L₂, donde la vertical de L₁ corta D₂E₂.
          - con: arista-vista
            traza: '[segmento2(solucion.A1p, figura.punto("B1")), segmento2(solucion.D1p, solucion.A1p), segmento2(solucion.A1p, solucion.k_AH_PM1), segmento2(proy_planta(solucion.I), figura.punto("H1")), segmento2(figura.punto("B1"), solucion.k_BG_MN1), segmento2(proy_planta(solucion.J), figura.punto("G1")), segmento2(solucion.D1p, solucion.k_DE_PM1), segmento2(proy_planta(solucion.L), figura.punto("E1")), segmento2(figura.punto("M1"), figura.punto("N1")), segmento2(figura.punto("N1"), solucion.k_NO_FG1), segmento2(solucion.k_NO_EF1, figura.punto("O1")), segmento2(figura.punto("O1"), figura.punto("P1")), segmento2(figura.punto("P1"), figura.punto("M1")), segmento2(proy_planta(solucion.I), proy_planta(solucion.J)), segmento2(proy_planta(solucion.L), proy_planta(solucion.I))]'
            porque: |
              **A limpio, la planta.** Desde arriba se ve lo que va más alto. La base ABCD queda abajo y la
              EFGH arriba, y la placa pasa entre las dos: en continua, AB y DA, las aristas laterales hasta
              que entran debajo de la placa y desde que salen por encima, en I, J y L, la placa salvo donde
              NO pasa bajo la base EFGH, y los lados IJ y LI de la sección, en las caras de arriba.
          - con: arista-oculta
            traza: '[segmento2(figura.punto("B1"), solucion.C1p), segmento2(solucion.C1p, solucion.D1p), segmento2(solucion.k_AH_PM1, proy_planta(solucion.I)), segmento2(solucion.k_BG_MN1, proy_planta(solucion.J)), segmento2(solucion.C1p, figura.punto("F1")), segmento2(solucion.k_DE_PM1, proy_planta(solucion.L)), segmento2(solucion.k_NO_FG1, solucion.k_NO_EF1), segmento2(proy_planta(solucion.J), proy_planta(solucion.K)), segmento2(proy_planta(solucion.K), proy_planta(solucion.L))]'
            porque: |
              A trazos, lo que queda debajo: BC y CD, bajo el propio prisma; CF entera, la arista de abajo;
              AH, BG y DE bajo la placa, desde su borde hasta I, J y L; NO bajo la base EFGH, y JK y KL, en
              las caras de abajo.
          - con: arista-vista
            traza: '[segmento2(solucion.k_FG_MN2, solucion.G2p), segmento2(solucion.G2p, figura.punto("H2")), segmento2(figura.punto("A2"), proy_alzado(solucion.I)), segmento2(solucion.q3_2, figura.punto("H2")), segmento2(figura.punto("B2"), proy_alzado(solucion.J)), segmento2(solucion.q1_2, solucion.G2p), segmento2(figura.punto("C2"), proy_alzado(solucion.K)), segmento2(figura.punto("M2"), figura.punto("N2")), segmento2(figura.punto("N2"), figura.punto("O2")), segmento2(figura.punto("O2"), solucion.q4_2), segmento2(solucion.k_OP_DA2, figura.punto("P2")), segmento2(figura.punto("P2"), figura.punto("M2")), segmento2(proy_alzado(solucion.I), proy_alzado(solucion.J)), segmento2(proy_alzado(solucion.J), proy_alzado(solucion.K))]'
            porque: |
              **El alzado.** Se ve lo que va más cerca de quien mira. La base ABCD va delante, y la placa
              pasa por delante de la parte de arriba del prisma: en continua, las aristas laterales hasta I,
              J y K y desde M₂N₂ hasta la base de atrás, GH y el trozo de FG que asoma por encima de la
              placa, la placa salvo donde OP pasa detrás del prisma, y IJ y JK, en las caras de delante.
          - con: arista-oculta
            traza: '[segmento2(solucion.E2p, solucion.F2p), segmento2(solucion.F2p, solucion.k_FG_MN2), segmento2(figura.punto("H2"), solucion.E2p), segmento2(proy_alzado(solucion.I), solucion.q3_2), segmento2(proy_alzado(solucion.J), solucion.q1_2), segmento2(proy_alzado(solucion.K), solucion.F2p), segmento2(figura.punto("D2"), solucion.E2p), segmento2(solucion.q4_2, solucion.k_OP_DA2), segmento2(proy_alzado(solucion.K), proy_alzado(solucion.L)), segmento2(proy_alzado(solucion.L), proy_alzado(solucion.I))]'
            porque: |
              A trazos, lo que queda detrás: EF y HE, de la base de atrás; FG hasta M₂N₂; AH, BG y CF desde
              que pasan detrás de la placa; DE entera; OP detrás del prisma, y KL y LI, en las caras de
              atrás.
        pista: |
          (1) Por B₂, C₂ y D₂, paralelas a A₂H₂; con las verticales de G₁, F₁ y E₁, dan G₂, F₂ y E₂. (2) Por
          H₁, F₁ y E₁, paralelas a B₁G₁; con las verticales de A₂, C₂ y D₂, dan A₁, C₁ y D₁. (3) B₂G₂ corta
          M₂N₂ en 1₂ y, prolongada, O₂P₂ en 2₂; bájalos a M₁N₁ y O₁P₁: 1₁2₁ corta B₁G₁ en J₁. (4) A₂H₂ corta
          M₂N₂ en 3₂; C₂F₂ y D₂E₂ cortan O₂P₂ en 4₂ y 5₂: por 3₁, 4₁ y 5₁, paralelas a 1₁2₁, que dan I₁, K₁ y
          L₁. (5) Sube los cuatro. (6) Para lo que se ve, en cada cruce aparente, la que va más alta
          (planta) o más cerca de ti (alzado); en I, J, K y L la arista cambia de lado de la placa.
        desarrollo: |
          En verde claro, la recta auxiliar 1₁2₁ y sus tres paralelas, y en las dos vistas las aristas que
          faltaban, la placa y la sección IJKL, con lo oculto a trazos. La sección es un paralelogramo: sus
          lados opuestos están en caras paralelas del prisma. La placa deja la base ABCD debajo y delante, y
          la EFGH encima y detrás.

      - tipo: calcular
        titulo: Un lado de la sección
        pregunta: Como pregunta nuestra, ¿cuánto mide de verdad JK, el lado de la sección que va por la cara BCFG?
        respuesta:
          tipo: numero
          valor: '34.69'
          receta: jk_mm
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '23.86'
            receta: en_mm(vm_planta(solucion.J, solucion.K))
            mensaje: |
              Eso es **J₁K₁ en la planta**. JK baja de J a K, y la planta la acorta. Su verdadera magnitud sale
              del triángulo: la planta de un cateto y la diferencia de cotas del otro.
          - valor: '26.43'
            receta: en_mm(vm_alzado(solucion.J, solucion.K))
            mensaje: |
              Eso es **J₂K₂ en el alzado**, que también acorta: JK se aleja del plano vertical de K a J.
          - valor: '29.08'
            receta: en_mm(vm(solucion.I, solucion.J))
            mensaje: |
              Eso es IJ en verdadera magnitud, el lado de la cara ABGH (KL, el de la CDEF, mide lo mismo).
              JK es el de la cara BCFG, el contiguo: en esta sección, los lados contiguos no miden lo mismo.
        pista: |
          JK no es horizontal ni frontal: su verdadera magnitud sale del triángulo del tema 2, con J₁K₁ de un
          cateto y la diferencia de cotas de J₂ y K₂ del otro.
        desarrollo: |
          Con el triángulo de la verdadera magnitud, la planta y la diferencia de cotas:

          $$ \overline{JK} = \sqrt{\overline{J_1K_1}^{\,2} + \Delta z^{2}} = \sqrt{23{,}86^{2} + 25{,}18^{2}} \approx 34{,}69 \text{ mm} $$

          LI, el lado opuesto, mide lo mismo; IJ y KL, 29,08 mm. En el dibujo hay tres medidas que caen
          dentro de la tolerancia por casualidad, sin ser JK: de D₂ a L₂, sobre D₂E₂, 35,53 mm; de A₁ a I₁,
          sobre A₁H₁, 33,79, y la vertical de 4₂ a 4₁, 34,65. Ninguna es JK.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: Las aristas laterales del prisma son paralelas, a A₂H₂ en el alzado y a B₁G₁ en la planta, y con ellas y las verticales se completan las dos vistas.
          - texto: El plano de canto que contiene BG corta MN y OP en dos puntos, y la recta que los une corta B₁G₁ en J₁, donde BG atraviesa la placa.
          - texto: Los planos de canto de AH, CF y DE son paralelos al de BG, y cortan la placa en rectas paralelas a 1₁2₁, que dan I₁, K₁ y L₁.
          - texto: I, J, K y L se suben al alzado por sus verticales, y se unen de cara en cara del prisma.
          - texto: J₂ es el cruce de B₂G₂ con M₂N₂, porque ahí se tocan en el alzado la arista y el borde de la placa.
            trampa: true
            mensaje: |
              Ese es un cruce aparente: en el espacio MN pasa 7,6 mm por delante de BG, y no se tocan. J sale
              de la recta auxiliar 1₁2₁, que sí está en el plano de canto de BG.
    resolucion: |
      **Las vistas.** El prisma tiene cada base en una sola vista y una arista lateral en cada una, AH en
      el alzado y BG en la planta. Como sus aristas laterales son paralelas, en el alzado las de B, C y D
      van paralelas a A₂H₂ hasta las verticales de G₁, F₁ y E₁, y en la planta las de H, F y E van
      paralelas a B₁G₁ hasta las verticales de A₂, C₂ y D₂. La placa se completa uniendo sus cruces; MN
      y OP son frontales.

      **La sección.** Las cuatro aristas laterales atraviesan la placa: la base ABCD queda a un lado y la
      EFGH al otro. Cada punto sale con el plano de canto de su arista, que en el alzado es la propia
      arista y corta MN y OP. El de BG da 1 y 2, y 1₁2₁ corta B₁G₁ en J₁. Los planos de canto de las
      otras aristas son paralelos, y sus rectas auxiliares también: por 3₁, 4₁ y 5₁, las paralelas a
      1₁2₁ cortan A₁H₁, C₁F₁ y D₁E₁ en I₁, K₁ y L₁. IJKL es un paralelogramo, de lados 29,08 y 34,69 mm.

      **Lo que se ve.** Tomamos la placa y el prisma opacos. En la planta, AH, BG y DE van bajo la placa
      desde su borde hasta I, J y L; CF, BC y CD quedan bajo el prisma, y NO pasa bajo la base EFGH. En
      el alzado, AH, BG y CF pasan detrás de la placa desde I, J y K; la base EFGH queda detrás salvo GH
      y un trozo de FG, y OP pasa detrás del prisma. De la sección se ven IJ en las dos vistas, LI en la
      planta y JK en el alzado. Con las piezas transparentes, todo iría en continua.

  - id: sd38-el-cuadrado-de-centro-o-y-su-interseccion-con-abcd
    titulo: El cuadrado de centro O con un lado en r, y su intersección con el plano ABCD
    fuente: Ejercicio 28 (SD38) · Colección de ejercicios de Geometría Descriptiva, Sistema Diédrico Directo · Dpto. de Expresión Gráfica y Proyectos de Ingeniería, EIG · UPV/EHU
    nivel: practica
    # Decisión: el texto impreso tal cual, cotejado con la página (pág. 29), con
    # sus dos apartados. El cuadrado sale único: el lado que va sobre r tiene su
    # punto medio al pie de la perpendicular desde O, y mide el doble de esa
    # distancia; no hay elección. El enunciado no dice si el cuadrado y ABCD son
    # placas opacas: se toman opacas, como en los Ejercicios 24 y 25, y las Notas
    # dicen qué saldría con planos transparentes. E, F, G, H, M, T, I, J, K, L y
    # los puntos 1 a 4 son nombres nuestros.
    enunciado: |
      Se presenta el centro O de un cuadrado y la recta r que contiene un lado del mismo. Se pide:

      a) Dibujar las proyecciones diédricas del cuadrado.

      b) Representar la intersección entre el cuadrado y el plano ABCD.

      **Notas nuestras.** La figura es el paralelogramo ABCD, el punto O y la recta r, en el alzado,
      arriba, y en la planta, debajo, sin línea de tierra. La hoja no da escala: las longitudes van en
      milímetros de la lámina. r₂ es horizontal en el papel, así que r es una recta horizontal; A₂B₂ y
      C₂D₂ también lo son, y AB y CD son las horizontales del plano ABCD. Llamamos E y F a los
      vértices del cuadrado que van sobre r (E, el de la derecha), G al opuesto a E y H al opuesto a
      F, y M al punto medio de EF. El enunciado dice «plano ABCD» y dibuja un paralelogramo, y no dice
      si las dos figuras son placas opacas o solo trozos de plano: aquí las tomamos como dos placas
      opacas, y por eso también se dibuja lo que cada una tapa de la otra. Con planos transparentes,
      todas las aristas irían en continua. I y J son los extremos del segmento que comparten las dos
      placas; K, L, T y los puntos 1 a 4 de la construcción también son nombres nuestros. Si ABCD se
      leyera como un plano sin borde, la intersección sería toda la cuerda del cuadrado, de K, en el
      lado EF, a J, 60,04 mm; con la placa, el segmento empieza más arriba, en I, donde CD atraviesa el
      cuadrado, y mide 45,07.
    pide: a) Las proyecciones de los cuatro vértices del cuadrado; b) los extremos del segmento en que se cortan el cuadrado y la placa ABCD, en las dos vistas, y lo visto y lo oculto de las dos, que tomamos opacas; y, como pregunta nuestra, la medida real del lado.
    receta:
      lamina: sd38
      escena:
        O: 'punto3(alzado: figura.punto("O2"), planta: figura.punto("O1"))'
        A: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("A1"))'
        B: 'punto3(alzado: figura.punto("B2"), planta: figura.punto("B1"))'
        C: 'punto3(alzado: figura.punto("C2"), planta: figura.punto("C1"))'
        D: 'punto3(alzado: figura.punto("D2"), planta: figura.punto("D1"))'
        r: 'recta3(alzado: figura.segmento("r2"), planta: figura.segmento("r1"))'
        abcd: plano(A, B, C)
      solucion:
        # a) El cuadrado. M, el punto medio del lado que va sobre r, es el pie de
        # la perpendicular desde O; OM es medio lado. E y F van sobre r a esa
        # distancia de M, uno a cada lado (E, el de la derecha: rama 1), y G y H
        # son sus simétricos respecto de O, el centro. Un solo cuadrado.
        M: pie_perpendicular(O, r)
        mitad: vm(O, M)
        EF: 'punto_a_distancia(r, desde: M, distancia: mitad)'
        E: rama(EF, 1)
        F: rama(EF, 2)
        G: 'simetrico(E, respecto: O)'
        H: 'simetrico(F, respecto: O)'
        efgh: plano(E, F, G)
        lado_mm: en_mm(vm(E, F))
        # El triángulo de OM: r es horizontal, y el ángulo recto entre OM y r se
        # ve recto en la planta. Un cateto es O₁M₁; el otro, lo que O está más
        # alto que r, llevado sobre r₁ desde M₁ hacia E: da T, y O₁T es OM.
        dz: diferencia_de_cotas(O, M)
        dpl: vm_planta(O, M)
        Ov2: 'cruce_aparente(segmento2(figura.punto("O2"), figura.punto("O1")), figura.segmento("r2"))'
        T: 'uno(medir_sobre(figura.segmento("r1"), desde: proy_planta(M), distancia: dz), 1)'
        # Los errores de M y de E: M en la vertical de O (la perpendicular trazada
        # en el alzado); E a O₁M₁ de M₁ (la planta en vez de la verdadera
        # magnitud), o a medio OM (OM tomado por el lado entero); G y H con O en
        # el lado opuesto, en vez de en el centro.
        Mv: 'cruce_aparente(segmento2(figura.punto("O1"), desplaza(figura.punto("O1"), dy: 10)), figura.segmento("r1"))'
        Eplanta: 'uno(medir_sobre(figura.segmento("r1"), desde: proy_planta(M), distancia: dpl), 1)'
        Fplanta: 'uno(medir_sobre(figura.segmento("r1"), desde: proy_planta(M), distancia: dpl), 2)'
        Emitad: 'uno(medir_sobre(figura.segmento("r1"), desde: proy_planta(M), distancia: mitad * 0.5), 1)'
        Gmal: 'simetrico(M, respecto: punto_medio(segmento3(F, O)))'
        Hmal: 'simetrico(M, respecto: punto_medio(segmento3(E, O)))'
        # b) La intersección. I: CD atraviesa el cuadrado; su plano auxiliar es
        # el horizontal de CD, que en el alzado es la propia C₂D₂ y corta FG en 1
        # y EH en 2. J: GH atraviesa ABCD; el horizontal de GH corta DA en 3 y CB
        # en 4. K (EF con el plano ABCD) y L (AB con el plano del cuadrado) están
        # en la recta común, fuera de la otra placa: sobre esa recta el cuadrado
        # va de K a J y ABCD de I a L, y el tramo común es IJ.
        I: corte_recta_plano(recta3(C, D), efgh)
        J: corte_recta_plano(recta3(G, H), abcd)
        K: corte_recta_plano(recta3(E, F), abcd)
        L: corte_recta_plano(recta3(A, B), efgh)
        largo_IJ: en_mm(vm(I, J))
        p1_2: 'cruce_aparente(figura.segmento("CD2"), segmento2(proy_alzado(F), proy_alzado(G)))'
        p2_2: 'cruce_aparente(figura.segmento("CD2"), segmento2(proy_alzado(E), proy_alzado(H)))'
        p1_1: 'cruce_aparente(segmento2(p1_2, desplaza(p1_2, dy: 10)), segmento2(proy_planta(F), proy_planta(G)))'
        p2_1: 'cruce_aparente(segmento2(p2_2, desplaza(p2_2, dy: 10)), segmento2(proy_planta(E), proy_planta(H)))'
        p3_2: 'cruce_aparente(segmento2(proy_alzado(G), proy_alzado(H)), figura.segmento("DA2"))'
        p4_2: 'cruce_aparente(segmento2(proy_alzado(G), proy_alzado(H)), figura.segmento("BC2"))'
        p3_1: 'cruce_aparente(segmento2(p3_2, desplaza(p3_2, dy: 10)), figura.segmento("DA1"))'
        p4_1: 'cruce_aparente(segmento2(p4_2, desplaza(p4_2, dy: 10)), figura.segmento("BC1"))'
        # La visibilidad: los cruces aparentes donde una arista cambia de vista
        # a oculta (k_<arista>_<la que la cruza><vista>); los demás cambios son
        # I y J, y en el alzado p1_2 (C₂D₂ con F₂G₂) y p3_2 (G₂H₂ con D₂A₂).
        k_EF_BC1: 'cruce_aparente(segmento2(proy_planta(E), proy_planta(F)), figura.segmento("BC1"))'
        k_EF_CD1: 'cruce_aparente(segmento2(proy_planta(E), proy_planta(F)), figura.segmento("CD1"))'
        k_HE_BC1: 'cruce_aparente(segmento2(proy_planta(H), proy_planta(E)), figura.segmento("BC1"))'
        k_CD_FG1: 'cruce_aparente(figura.segmento("CD1"), segmento2(proy_planta(F), proy_planta(G)))'
        k_HE_BC2: 'cruce_aparente(segmento2(proy_alzado(H), proy_alzado(E)), figura.segmento("BC2"))'
        k_DA_FG2: 'cruce_aparente(figura.segmento("DA2"), segmento2(proy_alzado(F), proy_alzado(G)))'
        # Los extremos de las rectas largas: se trazan más allá del punto que van
        # a dar.
        L_M1: 'uno(medir_sobre(segmento2(figura.punto("O1"), proy_planta(M)), desde: proy_planta(M), distancia: mm(4)), 1)'
        L_M2: 'desplaza(proy_alzado(M), dy: mm(-4))'
        L_Ov2: 'desplaza(Ov2, dy: mm(4))'
        L_E2: 'desplaza(proy_alzado(E), dy: mm(-4))'
        L_F2: 'desplaza(proy_alzado(F), dy: mm(-4))'
        L_G1: 'uno(medir_sobre(segmento2(proy_planta(E), figura.punto("O1")), desde: proy_planta(G), distancia: mm(4)), 1)'
        L_H1: 'uno(medir_sobre(segmento2(proy_planta(F), figura.punto("O1")), desde: proy_planta(H), distancia: mm(4)), 1)'
        L_G2: 'uno(medir_sobre(segmento2(proy_alzado(E), figura.punto("O2")), desde: proy_alzado(G), distancia: mm(4)), 1)'
        L_H2: 'uno(medir_sobre(segmento2(proy_alzado(F), figura.punto("O2")), desde: proy_alzado(H), distancia: mm(4)), 1)'
        L_G2v: 'desplaza(proy_alzado(G), dy: mm(-4))'
        L_H2v: 'desplaza(proy_alzado(H), dy: mm(-4))'
        L_p2_2: 'desplaza(p2_2, dx: mm(4))'
        L_p1_1: 'desplaza(p1_1, dy: mm(4))'
        L_p2_1: 'desplaza(p2_1, dy: mm(4))'
        L_I2: 'desplaza(proy_alzado(I), dy: mm(-4))'
        L_p4_2: 'desplaza(p4_2, dx: mm(4))'
        L_p3_1: 'desplaza(p3_1, dy: mm(4))'
        L_p4_1: 'desplaza(p4_1, dy: mm(4))'
        L_J2: 'desplaza(proy_alzado(J), dy: mm(-4))'
      comprueba:
        - en_recta(M, r)
        - en_recta(E, r)
        - en_recta(F, r)
        - en_plano(O, efgh)
        - en_plano(H, efgh)
        - en_plano(I, abcd)
        - en_plano(I, efgh)
        - en_plano(J, abcd)
        - en_plano(J, efgh)
    pasos:
      - tipo: reconocer
        pregunta: El lado que va sobre r tiene su punto medio M al pie de la perpendicular que baja de O a r. ¿En qué vista se ve recto ese ángulo, para trazarla?
        opciones:
          - texto: En la planta, porque r es horizontal; M₁ es el pie de la perpendicular a r₁ por O₁
            correcta: true
            mensaje: |
              Eso es. Un ángulo recto se ve recto en una vista cuando uno de sus lados es paralelo a ese
              plano de proyección, y r es horizontal: r₂ es horizontal en el papel. Así que en la planta
              O₁M₁ es perpendicular a r₁, y M₁ sale con la escuadra y el cartabón. M₂ sube por su
              vertical hasta r₂.
          - texto: En el alzado, porque r₂ es horizontal en el papel; M₂ es el pie de la vertical que baja de O₂ hasta r₂
            mensaje: |
              r₂ horizontal quiere decir que r es horizontal, no frontal: r₁ va inclinada, y el ángulo
              recto entre OM y r no se conserva en el alzado. La vertical de O₂ da un punto de r 5,0 mm a
              la izquierda de M. El ángulo recto se ve en la planta, donde r está en verdadera magnitud.
          - texto: En ninguna de las dos vistas, y para trazar la perpendicular hay que abatir antes el plano de O y r
            mensaje: |
              Abatir también lo daría, pero no hace falta. r es horizontal, paralela al plano horizontal,
              y un ángulo recto con un lado así se ve recto en la planta: M₁ es el pie de la perpendicular
              a r₁ por O₁.

      - tipo: construir
        titulo: El cuadrado, y dónde lo atraviesa la placa ABCD
        intro: |
          Primero, el apartado a. Marca M₁, el pie de la perpendicular a r₁ por O₁, y M₂, en r₂. OM es
          medio lado, y su verdadera magnitud sale del triángulo: sobre r₁, desde M₁ hacia la derecha,
          lleva con el compás lo que O₂ está por encima de r₂; ese punto es T, y O₁T es OM. Con centro en
          M₁ y radio O₁T, E₁ y F₁ en r₁, a un lado y al otro (E, el de la derecha), y sus alzados en r₂.
          G y H son los opuestos a E y a F: en cada vista, en la diagonal que pasa por O, al otro lado y
          a la misma distancia.

          Después, el apartado b. CD atraviesa el cuadrado en I, y GH atraviesa ABCD en J. Las dos son
          horizontales, y su plano auxiliar es el horizontal: en el alzado se ve como la propia C₂D₂ o
          G₂H₂, prolongadas. El de CD corta F₂G₂ en 1₂ y E₂H₂ en 2₂; bájalos, y 1₁2₁ corta C₁D₁ en I₁.
          El de GH corta D₂A₂ en 3₂ y C₂B₂ en 4₂; 3₁4₁ corta G₁H₁ en J₁. Marca I y J en las dos vistas.

          Por último, pasa a limpio con «arista vista» y «arista oculta» el cuadrado, el segmento IJ y
          los tramos de CD que cambian; AB, BC y DA ya están dibujadas, y se dan por vistas enteras.
          Tomamos las dos figuras como placas opacas, que el enunciado no lo dice. M, T, E, F, G, H, I, J
          y los puntos 1 a 4 son nombres nuestros. En el alzado, D₂A₂ pasa a 0,8 mm de G₂, y queda
          detrás de esa esquina del cuadrado en un trocito de 1,3 mm: con la regla no se distingue de la
          esquina, y aquí no se pide; en tu lámina de papel, ese trocito iría a trazos. Hay puntos muy
          juntos: I₁ cae a 0,7 mm de donde C₁D₁ cruza la diagonal F₁O₁, e I₂ a 1,1 mm de donde C₂D₂ cruza
          F₂O₂; H₂, a 2,1 mm de 4₂. Amplía con la lupa (×4).
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, visto, oculto, borrar]
        tolerancia: 1
        objetivos:
          - nombre: M1
            pide: M, el punto medio del lado que va sobre r, en la planta
            es: proy_planta(solucion.M)
            bien: |
              M₁ está en r₁, al pie de la perpendicular que baja de O₁. r es horizontal, y el ángulo recto
              entre OM y r se ve recto en la planta.
            diagnosticos:
              - si: cerca_de(solucion.Mv)
                mensaje: |
                  Ese punto de r₁ está en la vertical de O₁: es el de la perpendicular a r₂ trazada en el
                  alzado. r no es frontal, y ahí el ángulo recto no se ve. Se ve en la planta, porque r es
                  horizontal: M₁ es el pie de la perpendicular a r₁ por O₁.
                ejemplo: solucion.Mv
              - si: '!en_recta(figura.segmento("r1"))'
                mensaje: |
                  M está en r: M₁ va **en r₁**, al pie de la perpendicular que baja de O₁.
                ejemplo: 'desplaza(proy_planta(solucion.M), dx: mm(-3), dy: mm(-6))'
              - si: siempre
                mensaje: |
                  Estás en r₁, pero no al pie de la perpendicular. Con la escuadra y el cartabón, apoyados
                  en r₁, la perpendicular que pasa por O₁: donde corta r₁ está M₁.
          - nombre: E1
            pide: E, el vértice de la derecha de los que van sobre r, en la planta
            es: proy_planta(solucion.E)
            bien: |
              E₁ está en r₁, a 23,24 mm de M₁ hacia la derecha: la verdadera magnitud de OM, que es medio
              lado. r es horizontal, y en la planta sus distancias se ven sin acortar.
            diagnosticos:
              - si: cerca_de(proy_planta(solucion.F))
                mensaje: |
                  Ese es el vértice de la izquierda, el que llamamos F. E es el de la derecha de M₁.
                ejemplo: proy_planta(solucion.F)
              - si: cerca_de(solucion.T)
                mensaje: |
                  Ese es T: lo que O está más alto que r, 18,0 mm, llevado desde M₁. Es un cateto del
                  triángulo. Medio lado es la hipotenusa, O₁T: con centro en M₁ y ese radio, el arco corta
                  r₁ más allá.
                ejemplo: solucion.T
              - si: cerca_de(solucion.Eplanta)
                mensaje: |
                  Has llevado O₁M₁, lo que O dista de r en la planta, 14,7 mm. OM no es horizontal, y la
                  planta lo acorta: su verdadera magnitud es la hipotenusa O₁T, 23,24 mm.
                ejemplo: solucion.Eplanta
              - si: cerca_de(solucion.Emitad)
                mensaje: |
                  Has tomado OM por el lado entero, y has llevado su mitad. O es el centro del cuadrado:
                  OM ya es medio lado, y se lleva entero desde M₁ hacia cada lado.
                ejemplo: solucion.Emitad
              - si: '!en_recta(figura.segmento("r1"))'
                mensaje: |
                  E está en r: E₁ va **en r₁**, donde la corta el arco de centro M₁ y radio O₁T.
                ejemplo: 'desplaza(proy_planta(solucion.E), dx: mm(-2), dy: mm(-6))'
              - si: siempre
                mensaje: |
                  Estás en r₁, pero no a la distancia buena. Medio lado es OM en verdadera magnitud: O₁T,
                  la hipotenusa del triángulo de O₁M₁ y de lo que O₂ está por encima de r₂.
          - nombre: F1
            pide: F, el otro vértice que va sobre r, en la planta
            es: proy_planta(solucion.F)
            bien: |
              F₁ está en r₁, al otro lado de M₁ y a la misma distancia que E₁: el mismo arco de centro M₁.
              E₁F₁ es el lado en verdadera magnitud, 46,47 mm.
            diagnosticos:
              - si: cerca_de(solucion.Fplanta)
                mensaje: |
                  Has llevado O₁M₁, que es lo que OM mide en la planta, acortado. El radio es O₁T, la
                  hipotenusa del triángulo, igual que para E₁.
                ejemplo: solucion.Fplanta
              - si: '!en_recta(figura.segmento("r1"))'
                mensaje: |
                  F está en r: F₁ va **en r₁**, al otro lado de M₁.
                ejemplo: 'desplaza(proy_planta(solucion.F), dx: mm(2), dy: mm(6))'
              - si: siempre
                mensaje: |
                  F₁ está en r₁, al otro lado de M₁, a la misma distancia que E₁: M es el punto medio de EF.
          - nombre: E2
            pide: E, en el alzado
            es: proy_alzado(solucion.E)
            bien: |
              E₂ está en r₂, en la vertical de E₁.
            diagnosticos:
              - si: '!en_vertical_de(E1)'
                mensaje: |
                  E₂ va en la **vertical de E₁**: es el mismo punto visto dos veces.
                ejemplo: 'desplaza(proy_alzado(solucion.E), dx: mm(6))'
              - si: '!en_recta(figura.segmento("r2"))'
                mensaje: |
                  E está en r: E₂ va donde la vertical de E₁ corta **r₂**.
                ejemplo: 'desplaza(proy_alzado(solucion.E), dy: mm(-6))'
              - si: siempre
                mensaje: |
                  E₂ está en la vertical de E₁, sobre r₂.
          - nombre: F2
            pide: F, en el alzado
            es: proy_alzado(solucion.F)
            bien: |
              F₂ está en r₂, en la vertical de F₁.
            diagnosticos:
              - si: '!en_vertical_de(F1)'
                mensaje: |
                  F₂ va en la **vertical de F₁**.
                ejemplo: 'desplaza(proy_alzado(solucion.F), dx: mm(-6))'
              - si: '!en_recta(figura.segmento("r2"))'
                mensaje: |
                  F está en r: F₂ va donde la vertical de F₁ corta **r₂**.
                ejemplo: 'desplaza(proy_alzado(solucion.F), dy: mm(-6))'
              - si: siempre
                mensaje: |
                  F₂ está en la vertical de F₁, sobre r₂.
          - nombre: G1
            pide: G, el vértice opuesto a E, en la planta
            es: proy_planta(solucion.G)
            bien: |
              G₁ está en la diagonal E₁O₁, prolongada: O es el centro y el punto medio de EG, y la planta
              conserva el punto medio.
            diagnosticos:
              - si: cerca_de(proy_planta(solucion.H))
                mensaje: |
                  Ese es el opuesto a F, el que llamamos H. G es el opuesto a E: en la diagonal que sale de E₁
                  y pasa por O₁.
                ejemplo: proy_planta(solucion.H)
              - si: cerca_de(proy_planta(solucion.Gmal))
                mensaje: |
                  Has puesto O en el lado GH, a OM de r. O es el centro del cuadrado: el lado opuesto a EF va
                  al doble, y G está en la diagonal E₁O₁, al otro lado de O₁.
                ejemplo: proy_planta(solucion.Gmal)
              - si: '!en_recta(segmento2(proy_planta(solucion.E), figura.punto("O1")))'
                mensaje: |
                  G está en la diagonal EG, que pasa por el centro: G₁ va en la recta E₁O₁, prolongada más
                  allá de O₁.
                ejemplo: 'desplaza(proy_planta(solucion.G), dx: mm(5))'
              - si: siempre
                mensaje: |
                  Estás en la diagonal, pero no a la distancia buena: O₁ es el punto medio de E₁G₁. Con
                  centro en O₁ y radio O₁E₁, el arco corta la diagonal al otro lado.
          - nombre: H1
            pide: H, el vértice opuesto a F, en la planta
            es: proy_planta(solucion.H)
            bien: |
              H₁ está en la diagonal F₁O₁, prolongada, a O₁F₁ de O₁. E₁F₁G₁H₁ es la planta del cuadrado.
            diagnosticos:
              - si: cerca_de(proy_planta(solucion.G))
                mensaje: |
                  Ese es G₁, el opuesto a E. H es el opuesto a F: en la diagonal que sale de F₁ y pasa por O₁.
                ejemplo: proy_planta(solucion.G)
              - si: cerca_de(proy_planta(solucion.Hmal))
                mensaje: |
                  Has puesto O en el lado GH. O es el centro: H está en la diagonal F₁O₁, al otro lado de O₁ y
                  a O₁F₁ de él.
                ejemplo: proy_planta(solucion.Hmal)
              - si: '!en_recta(segmento2(proy_planta(solucion.F), figura.punto("O1")))'
                mensaje: |
                  H está en la diagonal FH, que pasa por el centro: H₁ va en la recta F₁O₁, prolongada.
                ejemplo: 'desplaza(proy_planta(solucion.H), dx: mm(5))'
              - si: siempre
                mensaje: |
                  Estás en la diagonal, pero no a la distancia buena: O₁ es el punto medio de F₁H₁.
          - nombre: G2
            pide: G, en el alzado
            es: proy_alzado(solucion.G)
            bien: |
              G₂ está en la vertical de G₁, en la diagonal E₂O₂ prolongada. Está el doble de alto sobre r₂
              que O₂.
            diagnosticos:
              - si: '!en_vertical_de(G1)'
                mensaje: |
                  G₂ va en la **vertical de G₁**.
                ejemplo: 'desplaza(proy_alzado(solucion.G), dx: mm(-6))'
              - si: '!en_recta(segmento2(proy_alzado(solucion.E), figura.punto("O2")))'
                mensaje: |
                  G₂ va donde la vertical de G₁ corta la diagonal **E₂O₂**, prolongada: en el alzado, O₂ también
                  es el punto medio de E₂G₂.
                ejemplo: 'desplaza(proy_alzado(solucion.G), dy: mm(6))'
              - si: siempre
                mensaje: |
                  G₂ está en la vertical de G₁, sobre la diagonal E₂O₂ prolongada.
          - nombre: H2
            pide: H, en el alzado
            es: proy_alzado(solucion.H)
            bien: |
              H₂ está en la vertical de H₁, en la diagonal F₂O₂ prolongada. G₂H₂ es horizontal: GH es
              paralela a r.
            diagnosticos:
              - si: '!en_vertical_de(H1)'
                mensaje: |
                  H₂ va en la **vertical de H₁**.
                ejemplo: 'desplaza(proy_alzado(solucion.H), dx: mm(-6))'
              - si: '!en_recta(segmento2(proy_alzado(solucion.F), figura.punto("O2")))'
                mensaje: |
                  H₂ va donde la vertical de H₁ corta la diagonal **F₂O₂**, prolongada.
                ejemplo: 'desplaza(proy_alzado(solucion.H), dy: mm(6))'
              - si: siempre
                mensaje: |
                  H₂ está en la vertical de H₁, sobre la diagonal F₂O₂ prolongada.
          - nombre: I1
            pide: I, donde la arista CD atraviesa el cuadrado, en la planta
            es: proy_planta(solucion.I)
            bien: |
              I₁ está en C₁D₁, donde la corta 1₁2₁: la horizontal en que el plano horizontal de CD corta al
              cuadrado. Esa horizontal y CD están en el mismo plano, así que se cortan de verdad.
            diagnosticos:
              - si: cerca_de(solucion.k_EF_CD1)
                mensaje: |
                  Ese es el cruce aparente de C₁D₁ con r₁: en la planta se tapan, pero CD pasa ahí 9,0 mm por
                  encima de EF, sin tocarla. I sale del plano auxiliar: la recta 1₁2₁.
                ejemplo: solucion.k_EF_CD1
              - si: cerca_de(solucion.k_CD_FG1)
                mensaje: |
                  Ese es el cruce aparente de C₁D₁ con F₁G₁: FG pasa ahí 15,5 mm por encima de CD. I está
                  donde C₁D₁ corta 1₁2₁.
                ejemplo: solucion.k_CD_FG1
              - si: '!en_recta(figura.segmento("CD1"))'
                mensaje: |
                  I es un punto de la arista CD: I₁ va **en C₁D₁**, donde la corta la recta 1₁2₁.
                ejemplo: 'desplaza(proy_planta(solucion.I), dx: mm(2), dy: mm(-6))'
              - si: siempre
                mensaje: |
                  Estás en C₁D₁, pero no donde la corta 1₁2₁. 1₂ y 2₂ son los cruces de C₂D₂, prolongada,
                  con F₂G₂ y E₂H₂; bajados por su vertical a F₁G₁ y a E₁H₁, dan 1₁ y 2₁.
          - nombre: I2
            pide: I, en el alzado
            es: proy_alzado(solucion.I)
            bien: |
              I₂ está en C₂D₂, en la vertical de I₁.
            diagnosticos:
              - si: cerca_de(solucion.p1_2)
                mensaje: |
                  Ese es 1₂, donde C₂D₂ cruza F₂G₂: un cruce aparente, porque FG pasa ahí 9,9 mm por delante
                  de CD. Es un punto del plano auxiliar, no el corte. I₂ sube de I₁ por su vertical.
                ejemplo: solucion.p1_2
              - si: '!en_vertical_de(I1)'
                mensaje: |
                  I₂ va en la **vertical de I₁**.
                ejemplo: 'desplaza(proy_alzado(solucion.I), dx: mm(6))'
              - si: '!en_recta(figura.segmento("CD2"))'
                mensaje: |
                  I está en CD: I₂ va donde la vertical de I₁ corta **C₂D₂**.
                ejemplo: 'desplaza(proy_alzado(solucion.I), dy: mm(-6))'
              - si: siempre
                mensaje: |
                  I₂ está en la vertical de I₁, sobre C₂D₂.
          - nombre: J1
            pide: J, donde el lado GH atraviesa la placa ABCD, en la planta
            es: proy_planta(solucion.J)
            bien: |
              J₁ está en G₁H₁, donde la corta 3₁4₁: la horizontal en que el plano horizontal de GH corta a
              ABCD, paralela a A₁B₁. I₁J₁ es la planta del segmento común.
            diagnosticos:
              - si: cerca_de(proy_planta(solucion.L))
                mensaje: |
                  Ese es el punto donde AB corta el plano del cuadrado. Está en la recta común de los dos
                  planos, pero fuera del cuadrado: las placas no llegan a tocarse ahí. El extremo de ese lado
                  es J, donde GH atraviesa ABCD.
                ejemplo: proy_planta(solucion.L)
              - si: '!en_recta(segmento2(proy_planta(solucion.G), proy_planta(solucion.H)))'
                mensaje: |
                  J es un punto del lado GH: J₁ va **en G₁H₁**, donde la corta la recta 3₁4₁.
                ejemplo: 'desplaza(proy_planta(solucion.J), dx: mm(-2), dy: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en G₁H₁, pero no donde la corta 3₁4₁. 3₂ y 4₂ son los cruces de G₂H₂, prolongada, con
                  D₂A₂ y C₂B₂; bajados a D₁A₁ y a C₁B₁, dan 3₁ y 4₁.
          - nombre: J2
            pide: J, en el alzado
            es: proy_alzado(solucion.J)
            bien: |
              J₂ está en G₂H₂, en la vertical de J₁. I₂J₂ es el alzado del segmento común.
            diagnosticos:
              - si: cerca_de(solucion.p4_2)
                mensaje: |
                  Ese es 4₂, donde G₂H₂, prolongada, cruza C₂B₂: un punto del plano auxiliar, y fuera del
                  cuadrado. J₂ sube de J₁ por su vertical.
                ejemplo: solucion.p4_2
              - si: '!en_vertical_de(J1)'
                mensaje: |
                  J₂ va en la **vertical de J₁**.
                ejemplo: 'desplaza(proy_alzado(solucion.J), dx: mm(-6))'
              - si: '!en_recta(segmento2(proy_alzado(solucion.G), proy_alzado(solucion.H)))'
                mensaje: |
                  J está en GH: J₂ va donde la vertical de J₁ corta **G₂H₂**.
                ejemplo: 'desplaza(proy_alzado(solucion.J), dy: mm(6))'
              - si: siempre
                mensaje: |
                  J₂ está en la vertical de J₁, sobre G₂H₂.
        # Decisión: las dos figuras, opacas (lo dicen las Notas nuestras). La
        # visibilidad sale de KIT\visibilidad.mjs (rayos contra las dos placas,
        # vis\sd38): cada cambio, en el cruce aparente que dice su tramo o en I o
        # J. Los lados del cuadrado los dibuja el alumno y van todos; de ABCD, solo
        # CD, que cambia en las dos vistas. AB y BC se ven enteras y ya están en la
        # lámina. DA también, salvo un trocito de 1,3 mm en el alzado, detrás de la
        # esquina G (del cruce de D₂A₂ con F₂G₂, k_DA_FG2, al de G₂H₂, p3_2): queda
        # a menos de la tolerancia del tramo F₂G₂ (el build dice que se pisan), y
        # no se pide; lo dicen el intro y el desarrollo.
        tramos:
          - traza: segmento2(proy_planta(solucion.E), solucion.k_EF_BC1)
            tipo: visto
            porque: 'De E₁ al cruce con B₁C₁, EF queda fuera de la planta de ABCD: desde arriba nada la tapa.'
          - traza: segmento2(solucion.k_EF_BC1, solucion.k_EF_CD1)
            tipo: oculto
            porque: 'Entre los cruces con B₁C₁ y C₁D₁, EF pasa por debajo de ABCD, que la tapa desde arriba: en el primero BC va 13,8 mm más alta, y en el segundo CD, 9,0.'
          - traza: segmento2(solucion.k_EF_CD1, proy_planta(solucion.F))
            tipo: visto
            porque: 'Del cruce con C₁D₁ a F₁, EF sale de debajo de ABCD: desde arriba nada la tapa.'
          - traza: segmento2(proy_planta(solucion.F), proy_planta(solucion.G))
            tipo: visto
            porque: 'FG va entera por encima de ABCD o fuera de su planta: en el cruce aparente con C₁D₁, FG va 15,5 mm más alta que CD.'
          - traza: segmento2(proy_planta(solucion.G), proy_planta(solucion.J))
            tipo: visto
            porque: 'De G₁ a J₁, GH va por encima de ABCD, que atraviesa en J: desde arriba nada la tapa.'
          - traza: segmento2(proy_planta(solucion.J), proy_planta(solucion.H))
            tipo: oculto
            porque: 'En J, GH atraviesa ABCD y pasa por debajo: de J₁ a H₁ la tapa esa placa.'
          - traza: segmento2(proy_planta(solucion.H), solucion.k_HE_BC1)
            tipo: oculto
            porque: 'De H₁ al cruce con B₁C₁, HE sigue por debajo de ABCD: en ese cruce aparente, BC va 6,7 mm más alta que HE.'
          - traza: segmento2(solucion.k_HE_BC1, proy_planta(solucion.E))
            tipo: visto
            porque: 'Del cruce con B₁C₁ a E₁, HE queda fuera de la planta de ABCD: desde arriba nada la tapa.'
          - traza: segmento2(proy_planta(solucion.I), proy_planta(solucion.J))
            tipo: visto
            porque: 'IJ está en las dos placas a la vez: desde arriba no la tapa ninguna.'
          - traza: segmento2(figura.punto("C1"), proy_planta(solucion.I))
            tipo: visto
            porque: 'De C₁ a I₁ nada tapa CD desde arriba: hasta r₁ queda fuera de la planta del cuadrado, y de ahí a I va por encima de esa placa. En el cruce aparente con r₁, CD va 9,0 mm más alta que EF.'
          - traza: segmento2(proy_planta(solucion.I), solucion.k_CD_FG1)
            tipo: oculto
            porque: 'En I, CD atraviesa el cuadrado y pasa por debajo: hasta F₁G₁, su borde, la tapa esa placa. En el cruce aparente, FG va 15,5 mm más alta que CD.'
          - traza: segmento2(solucion.k_CD_FG1, figura.punto("D1"))
            tipo: visto
            porque: 'Del cruce con F₁G₁ a D₁, CD sale de debajo del cuadrado: desde arriba nada la tapa.'
          - traza: segmento2(proy_alzado(solucion.E), proy_alzado(solucion.F))
            tipo: visto
            porque: 'EF va entera por debajo del alzado de ABCD, en r₂: por delante nada la tapa.'
          - traza: segmento2(proy_alzado(solucion.F), proy_alzado(solucion.G))
            tipo: visto
            porque: 'FG va por delante de ABCD donde se cruzan: en el cruce aparente con C₂D₂, FG va 9,9 mm más cerca de quien mira.'
          - traza: segmento2(proy_alzado(solucion.G), proy_alzado(solucion.J))
            tipo: visto
            porque: 'De G₂ a J₂, GH va por delante de ABCD, que atraviesa en J: nada la tapa.'
          - traza: segmento2(proy_alzado(solucion.J), proy_alzado(solucion.H))
            tipo: oculto
            porque: 'En J, GH pasa detrás de ABCD: de J₂ a H₂ la tapa esa placa.'
          - traza: segmento2(proy_alzado(solucion.H), solucion.k_HE_BC2)
            tipo: oculto
            porque: 'De H₂ al cruce con B₂C₂, HE sigue detrás de ABCD: en ese cruce aparente, BC va 6,7 mm más cerca de quien mira.'
          - traza: segmento2(solucion.k_HE_BC2, proy_alzado(solucion.E))
            tipo: visto
            porque: 'Del cruce con B₂C₂ a E₂, HE sale del alzado de ABCD: nada la tapa.'
          - traza: segmento2(proy_alzado(solucion.I), proy_alzado(solucion.J))
            tipo: visto
            porque: 'IJ está en las dos placas a la vez: por delante no la tapa ninguna.'
          - traza: segmento2(figura.punto("C2"), proy_alzado(solucion.I))
            tipo: visto
            porque: 'De C₂ a I₂, CD va por delante del cuadrado, que atraviesa en I: nada la tapa.'
          - traza: segmento2(proy_alzado(solucion.I), solucion.p1_2)
            tipo: oculto
            porque: 'En I, CD pasa detrás del cuadrado, que la tapa hasta su borde, F₂G₂: en el cruce aparente, FG va 9,9 mm más cerca de quien mira.'
          - traza: segmento2(solucion.p1_2, figura.punto("D2"))
            tipo: visto
            porque: 'Del cruce con F₂G₂ a D₂, CD sale del alzado del cuadrado: nada la tapa.'
        trazado:
          - segmento2(figura.punto("O1"), solucion.T)
          - segmento2(solucion.p1_1, solucion.p2_1)
          - segmento2(solucion.p3_1, solucion.p4_1)
        construccion:
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("O1"), solucion.L_M1)
            guia: figura.segmento("r1")
            porque: |
              **a) El cuadrado.** Por O₁, la **perpendicular a r₁**, hasta pasarla. r es horizontal, y el
              ángulo recto entre OM y r se ve recto en la planta: es el que la teoría del tema 2 llama el
              ángulo recto que sí se ve.
          - con: marca
            traza: proy_planta(solucion.M)
            rotulo: M₁
            porque: |
              M₁, donde la perpendicular corta r₁: el pie de O en r, y el punto medio del lado que va sobre
              r. M es un nombre nuestro, como T, los vértices E, F, G y H y los extremos I y J.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.M), solucion.L_M2)
            porque: |
              Por M₁, la vertical hacia el alzado, hasta pasar r₂.
          - con: marca
            traza: proy_alzado(solucion.M)
            rotulo: M₂
            porque: |
              M₂, donde la vertical de M₁ corta r₂.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("O2"), solucion.L_Ov2)
            porque: |
              Por O₂, la vertical hacia abajo, hasta pasar r₂: el trozo de O₂ a r₂ es lo que O está más alto
              que r, uno de los catetos de OM.
          - con: compas
            traza: 'arco(proy_planta(solucion.M), por: solucion.T, desde: desplaza(solucion.T, dx: -2.05, dy: -5.64), hasta: desplaza(solucion.T, dx: 2.05, dy: 5.64))'
            toma: segmento2(figura.punto("O2"), solucion.Ov2)
            porque: |
              Con el compás, en el alzado, lo que O está más alto que r: de O₂ a r₂, por su vertical. Se
              lleva sobre r₁ desde M₁, hacia la derecha: como r₁ es perpendicular a O₁M₁, el triángulo de
              catetos O₁M₁ y esa altura es rectángulo en M₁.
          - con: marca
            traza: solucion.T
            rotulo: T
            porque: |
              T, donde el arco corta r₁: el tercer vértice del triángulo. Es un nombre nuestro.
          - con: regla
            traza: segmento2(figura.punto("O1"), solucion.T)
            porque: |
              O₁T, la hipotenusa: la **verdadera magnitud de OM**, 23,24 mm, que es medio lado.
          - con: compas
            traza: '[arco(proy_planta(solucion.M), por: proy_planta(solucion.E), desde: desplaza(proy_planta(solucion.E), dx: -2.05, dy: -5.64), hasta: desplaza(proy_planta(solucion.E), dx: 2.05, dy: 5.64)), arco(proy_planta(solucion.M), por: proy_planta(solucion.F), desde: desplaza(proy_planta(solucion.F), dx: 2.05, dy: 5.64), hasta: desplaza(proy_planta(solucion.F), dx: -2.05, dy: -5.64))]'
            toma: segmento2(figura.punto("O1"), solucion.T)
            porque: |
              Con centro en M₁ y radio O₁T, dos arcos sobre r₁, uno a cada lado de M₁: r es horizontal, y
              sus distancias se ven en la planta sin acortar. Los dos cortes valen: son E y F.
          - con: marca
            traza: proy_planta(solucion.E)
            rotulo: E₁
            porque: |
              E₁, donde el arco de la derecha corta r₁.
          - con: marca
            traza: proy_planta(solucion.F)
            rotulo: F₁
            porque: |
              F₁, donde el arco de la izquierda corta r₁.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(solucion.E), solucion.L_E2), segmento2(proy_planta(solucion.F), solucion.L_F2)]'
            porque: |
              Por E₁ y F₁, las verticales hacia el alzado, hasta pasar r₂.
          - con: marca
            traza: proy_alzado(solucion.E)
            rotulo: E₂
            porque: |
              E₂, donde la vertical de E₁ corta r₂.
          - con: marca
            traza: proy_alzado(solucion.F)
            rotulo: F₂
            porque: |
              F₂, donde la vertical de F₁ corta r₂.
          - con: regla
            traza: '[segmento2(proy_planta(solucion.E), solucion.L_G1), segmento2(proy_planta(solucion.F), solucion.L_H1)]'
            porque: |
              Las diagonales en la planta: E₁O₁ y F₁O₁, prolongadas más allá de O₁. O es el centro, y G y H
              están al otro lado.
          - con: compas
            traza: '[arco(figura.punto("O1"), por: proy_planta(solucion.G), desde: desplaza(proy_planta(solucion.G), dx: -1.28, dy: 5.86), hasta: desplaza(proy_planta(solucion.G), dx: 1.28, dy: -5.86)), arco(figura.punto("O1"), por: proy_planta(solucion.H), desde: desplaza(proy_planta(solucion.H), dx: -4.75, dy: -3.67), hasta: desplaza(proy_planta(solucion.H), dx: 4.75, dy: 3.67))]'
            toma: segmento2(figura.punto("O1"), proy_planta(solucion.E))
            porque: |
              Con centro en O₁ y radio O₁E₁, que es el mismo que O₁F₁, un arco sobre cada diagonal, al otro
              lado de O₁: O₁ es el punto medio de cada diagonal, también en la planta.
          - con: marca
            traza: proy_planta(solucion.G)
            rotulo: G₁
            porque: |
              G₁, donde el arco corta la diagonal que sale de E₁.
          - con: marca
            traza: proy_planta(solucion.H)
            rotulo: H₁
            porque: |
              H₁, donde el arco corta la diagonal que sale de F₁.
          - con: regla
            traza: '[segmento2(proy_alzado(solucion.E), solucion.L_G2), segmento2(proy_alzado(solucion.F), solucion.L_H2)]'
            porque: |
              En el alzado, las diagonales E₂O₂ y F₂O₂, prolongadas más allá de O₂.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(solucion.G), solucion.L_G2v), segmento2(proy_planta(solucion.H), solucion.L_H2v)]'
            porque: |
              Por G₁ y H₁, las verticales hacia el alzado, hasta pasar las diagonales.
          - con: marca
            traza: proy_alzado(solucion.G)
            rotulo: G₂
            porque: |
              G₂, donde la vertical de G₁ corta la diagonal E₂O₂ prolongada.
          - con: marca
            traza: proy_alzado(solucion.H)
            porque: |
              H₂, donde la vertical de H₁ corta la diagonal F₂O₂ prolongada. G₂H₂ queda horizontal, el doble
              de alto sobre r₂ que O₂. Va sin rótulo: el punto 4₂, que se marca después a 2,1 mm, lo
              taparía.
          - con: regla
            traza: segmento2(figura.punto("D2"), solucion.L_p2_2)
            porque: |
              **b) El extremo I.** El plano auxiliar de CD es el horizontal que la contiene: en el alzado se
              ve como C₂D₂, prolongada con la regla hacia la derecha hasta pasar la recta de E₂ a H₂.
          - con: regla
            traza: '[segmento2(proy_alzado(solucion.F), proy_alzado(solucion.G)), segmento2(proy_alzado(solucion.E), proy_alzado(solucion.H))]'
            porque: |
              Los lados F₂G₂ y E₂H₂, de un vértice al otro: los corta ese plano horizontal.
          - con: marca
            traza: solucion.p1_2
            rotulo: 1₂
            porque: |
              1₂, donde C₂D₂ cruza F₂G₂: el punto de FG que está a la altura de CD. Los puntos 1 a 4 son
              nombres nuestros.
          - con: marca
            traza: solucion.p2_2
            rotulo: 2₂
            porque: |
              2₂, donde C₂D₂ prolongada cruza E₂H₂: el punto de EH a la altura de CD.
          - con: escuadra-cartabon
            traza: '[segmento2(solucion.p1_2, solucion.L_p1_1), segmento2(solucion.p2_2, solucion.L_p2_1)]'
            porque: |
              Por 1₂ y 2₂, las verticales hacia la planta, hasta pasar F₁G₁ y E₁H₁.
          - con: regla
            traza: '[segmento2(proy_planta(solucion.F), proy_planta(solucion.G)), segmento2(proy_planta(solucion.E), proy_planta(solucion.H))]'
            porque: |
              En la planta, los lados F₁G₁ y E₁H₁, de un vértice al otro.
          - con: marca
            traza: solucion.p1_1
            rotulo: 1₁
            porque: |
              1₁, donde la vertical de 1₂ corta F₁G₁.
          - con: marca
            traza: solucion.p2_1
            rotulo: 2₁
            porque: |
              2₁, donde la vertical de 2₂ corta E₁H₁.
          - con: regla
            traza: segmento2(solucion.p1_1, solucion.p2_1)
            porque: |
              1₁2₁, la planta de la recta en que el plano horizontal de CD corta al cuadrado: una horizontal
              del cuadrado, y por eso paralela a r₁. Esa recta y CD están en el mismo plano horizontal, así
              que se cortan de verdad.
          - con: marca
            traza: proy_planta(solucion.I)
            rotulo: I₁
            porque: |
              I₁, donde 1₁2₁ corta C₁D₁: el punto donde la arista CD atraviesa el cuadrado.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.I), solucion.L_I2)
            porque: |
              Por I₁, la vertical hacia el alzado, hasta pasar C₂D₂.
          - con: marca
            traza: proy_alzado(solucion.I)
            rotulo: I₂
            porque: |
              I₂, donde la vertical de I₁ corta C₂D₂.
          - con: regla
            traza: segmento2(proy_alzado(solucion.G), solucion.L_p4_2)
            porque: |
              **El extremo J**, igual, con el plano horizontal de GH: en el alzado es G₂H₂, prolongada hacia
              la derecha hasta pasar C₂B₂.
          - con: marca
            traza: solucion.p3_2
            porque: |
              3₂, donde G₂H₂ cruza D₂A₂: el punto de DA a la altura de GH. Cae a 0,8 mm de G₂, y va sin
              rótulo, porque el de G₂ lo pisaría.
          - con: marca
            traza: solucion.p4_2
            rotulo: 4₂
            porque: |
              4₂, donde G₂H₂ prolongada cruza C₂B₂: el punto de CB a la altura de GH.
          - con: escuadra-cartabon
            traza: '[segmento2(solucion.p3_2, solucion.L_p3_1), segmento2(solucion.p4_2, solucion.L_p4_1)]'
            porque: |
              Por 3₂ y 4₂, las verticales hacia la planta, hasta pasar D₁A₁ y C₁B₁.
          - con: marca
            traza: solucion.p3_1
            rotulo: 3₁
            porque: |
              3₁, donde la vertical de 3₂ corta D₁A₁.
          - con: marca
            traza: solucion.p4_1
            rotulo: 4₁
            porque: |
              4₁, donde la vertical de 4₂ corta C₁B₁.
          - con: regla
            traza: segmento2(solucion.p3_1, solucion.p4_1)
            porque: |
              3₁4₁, la planta de la horizontal en que el plano horizontal de GH corta a ABCD: paralela a
              A₁B₁, porque AB es otra horizontal de ABCD.
          - con: regla
            traza: segmento2(proy_planta(solucion.G), proy_planta(solucion.H))
            porque: |
              El lado G₁H₁, de un vértice al otro.
          - con: marca
            traza: proy_planta(solucion.J)
            porque: |
              J₁, donde 3₁4₁ corta G₁H₁: el punto donde el lado GH atraviesa la placa ABCD. Va sin rótulo:
              H₁, a 5,1 mm, lo taparía.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.J), solucion.L_J2)
            porque: |
              Por J₁, la vertical hacia el alzado, hasta pasar G₂H₂.
          - con: marca
            traza: proy_alzado(solucion.J)
            porque: |
              J₂, donde la vertical de J₁ corta G₂H₂. Va sin rótulo: H₂, a 4,8 mm, lo taparía.
          - con: arista-vista
            traza: '[segmento2(proy_planta(solucion.E), solucion.k_EF_BC1), segmento2(solucion.k_EF_CD1, proy_planta(solucion.F)), segmento2(proy_planta(solucion.F), proy_planta(solucion.G)), segmento2(proy_planta(solucion.G), proy_planta(solucion.J)), segmento2(solucion.k_HE_BC1, proy_planta(solucion.E)), segmento2(proy_planta(solucion.I), proy_planta(solucion.J)), segmento2(figura.punto("C1"), proy_planta(solucion.I)), segmento2(solucion.k_CD_FG1, figura.punto("D1"))]'
            porque: |
              **A limpio, la planta.** Desde arriba se ve lo que va más alto. I₁J₁, en continua: está en las
              dos placas. El cuadrado va por encima de ABCD del lado de FG, y CD del lado de C: en continua,
              FG entera, GH de G a J, CD de C a I, y lo que de EF, HE y CD queda fuera de la otra placa.
          - con: arista-oculta
            traza: '[segmento2(solucion.k_EF_BC1, solucion.k_EF_CD1), segmento2(proy_planta(solucion.J), proy_planta(solucion.H)), segmento2(proy_planta(solucion.H), solucion.k_HE_BC1), segmento2(proy_planta(solucion.I), solucion.k_CD_FG1)]'
            porque: |
              A trazos, lo que queda debajo de la otra placa: EF entre B₁C₁ y C₁D₁, y la esquina H del
              cuadrado, de J₁ a H₁ y de H₁ a B₁C₁, debajo de ABCD; y CD de I₁ a F₁G₁, debajo del cuadrado.
              Cada tramo empieza y acaba en un cruce aparente o en I o J.
          - con: arista-vista
            traza: '[segmento2(proy_alzado(solucion.E), proy_alzado(solucion.F)), segmento2(proy_alzado(solucion.F), proy_alzado(solucion.G)), segmento2(proy_alzado(solucion.G), proy_alzado(solucion.J)), segmento2(solucion.k_HE_BC2, proy_alzado(solucion.E)), segmento2(proy_alzado(solucion.I), proy_alzado(solucion.J)), segmento2(figura.punto("C2"), proy_alzado(solucion.I)), segmento2(solucion.p1_2, figura.punto("D2"))]'
            porque: |
              **El alzado.** Se ve lo que va más cerca de quien mira, lo de más alejamiento. I₂J₂, en
              continua; EF y FG enteras, GH de G a J, CD de C a I, y lo que de HE y CD queda fuera de la
              otra placa.
          - con: arista-oculta
            traza: '[segmento2(proy_alzado(solucion.J), proy_alzado(solucion.H)), segmento2(proy_alzado(solucion.H), solucion.k_HE_BC2), segmento2(proy_alzado(solucion.I), solucion.p1_2)]'
            porque: |
              A trazos, lo que queda detrás: la esquina H del cuadrado, de J₂ a H₂ y de H₂ a B₂C₂, detrás de
              ABCD, y CD de I₂ a F₂G₂, detrás del cuadrado. AB, BC y DA ya están dibujadas: DA solo pasa
              detrás de la esquina G en un trocito de 1,3 mm, que la regla no distingue de la esquina.
        pista: |
          (1) M₁: la perpendicular a r₁ por O₁. (2) Sobre r₁, desde M₁, lo que O₂ está por encima de r₂: T;
          O₁T es medio lado. (3) Con centro M₁ y radio O₁T, E₁ y F₁ en r₁; G₁ y H₁, al otro lado de O₁ en
          las diagonales; los alzados, por las verticales y las diagonales E₂O₂ y F₂O₂. (4) C₂D₂ prolongada
          corta F₂G₂ en 1₂ y E₂H₂ en 2₂; 1₁2₁ corta C₁D₁ en I₁. (5) G₂H₂ prolongada corta D₂A₂ en 3₂ y C₂B₂
          en 4₂; 3₁4₁ corta G₁H₁ en J₁. (6) Para lo que se ve, en cada cruce aparente, la que va más alta
          (planta) o más cerca de ti (alzado); en I y en J, la arista cambia de lado.
        desarrollo: |
          En verde claro, el triángulo de OM (la hipotenusa O₁T), las dos horizontales auxiliares de la
          planta, 1₁2₁ y 3₁4₁, y el cuadrado y el segmento IJ en las dos vistas, con lo oculto a trazos.
          El cuadrado atraviesa la placa ABCD: la esquina H queda debajo y detrás de ella, y CD pasa por
          debajo y por detrás del cuadrado entre I y el lado FG. I cae casi en la diagonal FH (a 0,9 mm, y
          su planta a 0,6 mm de F₁H₁): es casualidad, porque la recta común de los dos planos pasa a 0,7 mm
          de O y a 6° de esa diagonal, y no sirve para hallarlo; I sale del plano horizontal de CD. En el
          alzado, D₂A₂ pasa a 0,8 mm de G₂ y queda detrás de esa esquina en un trocito de 1,3 mm, entre
          los cruces con F₂G₂ y con G₂H₂; en el papel iría a trazos, pero queda a menos de un milímetro
          del lado F₂G₂, y la regla no lo distingue de él: aquí no se ha pedido.

      - tipo: calcular
        titulo: El lado del cuadrado
        pregunta: Como pregunta nuestra, ¿cuánto mide de verdad el lado del cuadrado?
        respuesta:
          tipo: numero
          valor: '46.47'
          receta: lado_mm
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '23.24'
            receta: en_mm(solucion.mitad)
            mensaje: |
              Eso es OM, la distancia real de O a r. O es el centro del cuadrado, y OM es medio lado: el lado
              es el doble.
          - valor: '29.41'
            receta: en_mm(vm_planta(solucion.F, solucion.G))
            mensaje: |
              Eso es **F₁G₁ en la planta**, el doble de O₁M₁. FG sube de F a G, y la planta lo acorta. El
              lado en verdadera magnitud es E₁F₁, sobre r₁, o el doble de O₁T.
          - valor: '43.67'
            receta: en_mm(vm_alzado(solucion.E, solucion.F))
            mensaje: |
              Eso es **E₂F₂ en el alzado**. EF es horizontal, pero no frontal: se aleja del plano vertical de
              E a F, y el alzado la acorta. Su verdadera magnitud se ve en la planta.
        pista: |
          El lado es el doble de OM. O mídelo directamente en la planta, en E₁F₁: EF va sobre r, que es
          horizontal.
        desarrollo: |
          Medio lado es OM, con el triángulo de su planta y de lo que O está más alto que r:

          $$ \overline{EF} = 2\,\overline{OM} = 2\sqrt{\overline{O_1M_1}^{\,2} + \Delta z^{2}} = 2\sqrt{14{,}70^{2} + 17{,}99^{2}} \approx 46{,}47 \text{ mm} $$

          E₁F₁ y G₁H₁ miden eso mismo en la planta, y no por casualidad: EF y GH son horizontales, y la
          planta las da en verdadera magnitud. También 1₁2₁, la horizontal del cuadrado a la altura de CD,
          que va de FG a EH paralela a EF. Los otros dos lados, FG y HE, suben, y su planta mide 29,41 mm.
          En el dibujo hay tres medidas que caen dentro de la tolerancia por casualidad, sin ser el lado:
          B₁C₁ y A₁D₁, los lados de la planta de ABCD, 45,83 mm, y de G₂ a 4₂, en el alzado, 45,81.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: r es horizontal, así que el ángulo recto entre r y OM se ve recto en la planta, y M₁ es el pie de la perpendicular a r₁ por O₁.
          - texto: OM es medio lado; su verdadera magnitud es la hipotenusa del triángulo de O₁M₁ y de lo que O está más alto que r.
          - texto: Sobre r₁, que no acorta, ese medio lado se lleva a cada lado de M₁, y da E₁ y F₁; G y H son los simétricos de E y F respecto de O.
          - texto: El plano horizontal de CD corta el cuadrado en una horizontal que corta CD en I, y el de GH corta ABCD en una horizontal que corta GH en J.
          - texto: M₂ es el pie de la perpendicular a r₂ por O₂, y M₁ baja por su vertical hasta r₁.
            trampa: true
            mensaje: |
              r₂ es horizontal en el papel, pero r no es frontal, y en el alzado el ángulo recto entre OM y r
              no se ve. Esa vertical da un punto de r 5,0 mm a la izquierda de M. Se ve en la planta, porque r
              es horizontal.
    resolucion: |
      **El cuadrado.** r es horizontal, así que el ángulo recto entre r y la perpendicular que baja de O
      se ve recto en la planta: M₁, el pie de la perpendicular a r₁ por O₁, es el punto medio del lado
      que va sobre r. OM es medio lado, y su verdadera magnitud sale del triángulo de O₁M₁, 14,70 mm, y
      de lo que O está más alto que r, 17,99: 23,24 mm. Sobre r₁, que no acorta, da E₁ y F₁ a cada lado
      de M₁, y el lado mide 46,47 mm. G y H son los simétricos de E y F respecto de O, en las dos vistas;
      GH es la otra horizontal del cuadrado, el doble de alta sobre r que O.

      **La intersección.** Las dos placas se cortan en un segmento de la recta común de sus planos. Sobre
      esa recta, el cuadrado va de K, en EF, a J, en GH, y ABCD de I, en CD, a L, en AB; el tramo común
      es IJ. CD es horizontal: su plano horizontal corta el cuadrado en la horizontal 1₁2₁, paralela a
      r₁, que corta C₁D₁ en I₁. GH también: su plano horizontal corta ABCD en la horizontal 3₁4₁,
      paralela a A₁B₁, que corta G₁H₁ en J₁. I₂ y J₂ suben por sus verticales.

      **Lo que se ve.** Tomamos las dos placas opacas. En la planta, EF pasa por debajo de ABCD entre
      B₁C₁ y C₁D₁, la esquina H queda debajo de ABCD de J a B₁C₁, y CD pasa por debajo del cuadrado de I
      a F₁G₁. En el alzado, la esquina H queda detrás de ABCD, CD detrás del cuadrado de I a F₂G₂, y un
      trocito de DA, de 1,3 mm, detrás de la esquina G, que en el papel iría a trazos. Con planos
      transparentes, todo iría en continua.

  - id: sd41-la-chimenea-a-traves-de-la-cubierta-piramidal
    titulo: La chimenea a través de la cubierta piramidal, y el desarrollo de la cubierta
    fuente: Ejercicio 29 (SD41) · Colección de ejercicios de Geometría Descriptiva, Sistema Diédrico Directo · Dpto. de Expresión Gráfica y Proyectos de Ingeniería, EIG · UPV/EHU
    nivel: practica
    # Decisión: el texto impreso tal cual, cotejado con la página (pág. 30),
    # con su «Chimenea» en mayúscula, que es del original. La hoja no rotula
    # nada: todos los nombres son nuestros. Las piezas se toman opacas, como
    # lectura nuestra. b) se resuelve con el desarrollo de la cubierta, un
    # método nuestro: la vertiente de la derecha, de canto, se abate sobre el
    # plano horizontal de su alero, y las otras dos giran alrededor de VB y de
    # VC hasta quedar en ese plano.
    enunciado: |
      La cubierta de una torre de planta cuadrada tiene tres vertientes triangulares y adopta la forma de
      una pirámide oblicua. Una Chimenea prismática de planta triangular atraviesa la cubierta piramidal.
      Se pide:

      a) Intersección de las caras de la chimenea con la pirámide.

      b) Obtener gráficamente la verdadera magnitud de las caras de la cubierta recortadas por el hueco de
      la chimenea.

      **Notas nuestras.** La figura es la cubierta y la chimenea en el alzado, arriba, y en la planta,
      debajo, sin línea de tierra. La hoja no da escala: las longitudes van en milímetros de la lámina. La
      mayúscula de «Chimenea» es del original. La hoja no rotula nada, y todos los nombres son nuestros:
      V, el vértice de la cubierta, que en la planta cae en el punto medio del lado izquierdo del
      cuadrado; A, B, C y D, las esquinas del cuadrado (A atrás a la izquierda, B atrás a la derecha, C
      delante a la derecha, D delante a la izquierda); P, Q y R, las aristas de la chimenea (P atrás a la
      izquierda, Q atrás a la derecha, R delante). Las tres vertientes son VAB, la de atrás; VBC, la de la
      derecha, que es de canto, porque contiene BC, que es de punta: en el alzado se ve como la recta V₂B₂;
      y VCD, la de delante. El cuarto lado, VDA, es vertical: es la pared de la torre, que sube hasta V. En
      el alzado, A₂ ≡ D₂ y B₂ ≡ C₂. La hoja dibuja las aristas de la chimenea y V₂B₂ a medias: completarlas
      es parte de a). E, F, G, H, I, J, K y L, los puntos de la construcción, también son nombres nuestros.
      El enunciado no dice si las piezas son opacas: las tomamos opacas, y por eso se dibuja lo que cada
      una tapa de la otra; con piezas transparentes, todo iría en continua. Para b) usamos el desarrollo
      de la cubierta, un método nuestro: la vertiente de la derecha se abate sobre el plano horizontal de
      su alero, y las otras dos giran alrededor de VB y de VC hasta quedar a su lado; cualquier otro método
      que lleve cada vertiente a verdadera magnitud da las mismas caras.
    pide: Los siete vértices de la intersección de la chimenea con la cubierta en el alzado, con lo visto y lo oculto, y las tres vertientes con el hueco en verdadera magnitud, en su desarrollo; y, como pregunta nuestra, la longitud real del borde JG del hueco.
    receta:
      lamina: sd41
      escena:
        V: 'punto3(alzado: figura.punto("V2"), planta: figura.punto("V1"))'
        A: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("A1"))'
        B: 'punto3(alzado: figura.punto("B2"), planta: figura.punto("B1"))'
        # A₂ ≡ D₂ y B₂ ≡ C₂: el cuadrado es horizontal.
        C: 'punto3(alzado: figura.punto("B2"), planta: figura.punto("C1"))'
        D: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("D1"))'
        # La chimenea: sus aristas, de la cara de arriba (P, Q, R) al extremo
        # de abajo que dibuja la hoja (Pb, Qb, Rb).
        P: 'punto3(alzado: figura.punto("P2"), planta: figura.punto("P1"))'
        Q: 'punto3(alzado: figura.punto("Q2"), planta: figura.punto("Q1"))'
        R: 'punto3(alzado: figura.punto("R2"), planta: figura.punto("R1"))'
        Pb: 'punto3(alzado: figura.punto("Pb2"), planta: figura.punto("P1"))'
        Qb: 'punto3(alzado: figura.punto("Qb2"), planta: figura.punto("Q1"))'
        Rb: 'punto3(alzado: figura.punto("Rb2"), planta: figura.punto("R1"))'
        vab: plano(V, A, B)
        vbc: plano(V, B, C)
        vcd: plano(V, C, D)
        cpq: plano(P, Q, Pb)
        cqr: plano(Q, R, Qb)
        crp: plano(R, P, Rb)
      solucion:
        # La intersección: las aristas de la chimenea atraviesan cada una una
        # vertiente (P la de atrás, Q la de la derecha, R la de delante), y las
        # aristas VB y VC de la cubierta atraviesan las caras de la chimenea.
        E: corte_recta_plano(recta3(P, Pb), vab)
        F: corte_recta_plano(recta3(Q, Qb), vbc)
        G: corte_recta_plano(recta3(R, Rb), vcd)
        H: corte_recta_plano(recta3(V, B), crp)
        I: corte_recta_plano(recta3(V, B), cpq)
        J: corte_recta_plano(recta3(V, C), crp)
        K: corte_recta_plano(recta3(V, C), cqr)
        # Decisión: E, con la horizontal de VAB que pasa por P, paralela a la
        # línea de tierra: es la recta de P₁Q₁, y corta V₁B₁ en I₁; E está a la
        # altura de I. G, con la horizontal de VCD que pasa por R, que corta
        # V₁C₁ en L₁; G está a la altura de L.
        Lp: 'cruce_aparente(segmento2(figura.punto("V1"), figura.punto("C1")), segmento2(figura.punto("R1"), desplaza(figura.punto("R1"), dx: 10)))'
        L: 'punto_en_plano(planta: Lp, plano: vcd)'
        # La visibilidad en el alzado: la arista P pasa por detrás de la
        # vertiente de delante donde cruza V₂B₂.
        x_P_VB: 'cruce_aparente(figura.segmento("aristaP2"), figura.segmento("VB2a"))'
        x_R_VB: 'cruce_aparente(figura.segmento("aristaR2"), figura.segmento("VB2a"))'
        # Para los diagnósticos: la altura de H llevada a la arista P (el error
        # de tomar la horizontal que no es) y el extremo de abajo de lo que la
        # hoja dibuja de la arista Q.
        E_conH: 'cruce_aparente(figura.segmento("aristaP2"), segmento2(proy_alzado(H), desplaza(proy_alzado(H), dx: 10)))'
        # Los extremos de las rectas largas.
        L_H2: 'desplaza(proy_alzado(H), dy: mm(-4))'
        L_I2: 'desplaza(proy_alzado(I), dy: mm(-4))'
        L_J2: 'desplaza(proy_alzado(J), dy: mm(-4))'
        L_K2: 'desplaza(proy_alzado(K), dy: mm(-4))'
        L_L2: 'desplaza(proy_alzado(L), dy: mm(-4))'
        L_Lp: 'desplaza(Lp, dx: mm(3))'
        L_E2: 'desplaza(proy_alzado(E), dx: mm(-3))'
        L_G2: 'desplaza(proy_alzado(G), dx: mm(-3))'
        # b) Decisión: el desarrollo de la cubierta. VBC, de canto, se abate
        # sobre el plano horizontal de su alero BC: en el alzado, cada punto
        # dista de BC lo que dista de B₂ sobre V₂B₂, y en la planta se aparta de
        # B₁C₁ eso por la horizontal de su planta. Los dos lados valen (una
        # elección); la construcción va hacia la derecha, donde hay sitio. VAB y
        # VCD giran alrededor de VB y de VC hasta el plano de VBC, al otro lado
        # de cada arista, y caen con ella: A₀ y D₀ salen con dos arcos, de AB (o
        # CD) y de la verdadera magnitud de VA (o VD), y E₀ y G₀ por las
        # paralelas a B₁A₀ y a C₁D₀, que son las horizontales de esas caras.
        cb: recta3(C, B)
        V_ab: abatido_a_elegir(V, cb, vbc)
        H_ab: 'abatido_junto(H, cb, vbc, con: V_ab, de: V)'
        I_ab: 'abatido_junto(I, cb, vbc, con: V_ab, de: V)'
        F_ab: 'abatido_junto(F, cb, vbc, con: V_ab, de: V)'
        K_ab: 'abatido_junto(K, cb, vbc, con: V_ab, de: V)'
        J_ab: 'abatido_junto(J, cb, vbc, con: V_ab, de: V)'
        L_ab: 'abatido_junto(L, cb, vbc, con: V_ab, de: V)'
        dVB: angulo_diedro(A, recta3(V, B), C)
        dVC: angulo_diedro(D, recta3(V, C), B)
        A_g: 'gira(A, recta3(V, B), angulo: 180 - dVB, sentido: ascendente)'
        E_g: 'gira(E, recta3(V, B), angulo: 180 - dVB, sentido: ascendente)'
        D_g: 'gira(D, recta3(V, C), angulo: 180 - dVC, sentido: ascendente)'
        G_g: 'gira(G, recta3(V, C), angulo: 180 - dVC, sentido: ascendente)'
        A_ab: 'abatido_junto(A_g, cb, vbc, con: V_ab, de: V)'
        E_ab: 'abatido_junto(E_g, cb, vbc, con: V_ab, de: V)'
        D_ab: 'abatido_junto(D_g, cb, vbc, con: V_ab, de: V)'
        G_ab: 'abatido_junto(G_g, cb, vbc, con: V_ab, de: V)'
        # Las caras de atrás y de delante dobladas encima de la de la derecha
        # (el otro corte de los dos arcos): en verdadera magnitud, pero no es
        # el desarrollo.
        A_do: 'abatido_junto(gira(A, recta3(V, B), angulo: dVB, sentido: descendente), cb, vbc, con: V_ab, de: V)'
        D_do: 'abatido_junto(gira(D, recta3(V, C), angulo: dVC, sentido: descendente), cb, vbc, con: V_ab, de: V)'
        # Los pies en B₁C₁ de las horizontales de la planta, y las horizontales.
        mV: 'cruce_aparente(figura.segmento("BC1"), segmento2(figura.punto("V1"), desplaza(figura.punto("V1"), dx: 10)))'
        mH: 'cruce_aparente(figura.segmento("BC1"), segmento2(proy_planta(H), desplaza(proy_planta(H), dx: 10)))'
        mI: 'cruce_aparente(figura.segmento("BC1"), figura.segmento("PQ1"))'
        mJ: 'cruce_aparente(figura.segmento("BC1"), segmento2(proy_planta(J), desplaza(proy_planta(J), dx: 10)))'
        mK: 'cruce_aparente(figura.segmento("BC1"), segmento2(proy_planta(K), desplaza(proy_planta(K), dx: 10)))'
        mL: 'cruce_aparente(figura.segmento("BC1"), segmento2(figura.punto("R1"), Lp))'
        hV: 'perpendicular(por: figura.punto("V1"), a: figura.segmento("BC1"))'
        hH: 'perpendicular(por: proy_planta(H), a: figura.segmento("BC1"))'
        hI: 'perpendicular(por: proy_planta(I), a: figura.segmento("BC1"))'
        hJ: 'perpendicular(por: proy_planta(J), a: figura.segmento("BC1"))'
        hK: 'perpendicular(por: proy_planta(K), a: figura.segmento("BC1"))'
        # La verdadera magnitud de VA (y de VD): la hipotenusa de V₂A₂ y de V₁A₁,
        # que se lleva sobre la base del alzado desde A₂ hasta U₂.
        U2: 'uno(medir_sobre(figura.segmento("AB2"), desde: figura.punto("A2"), distancia: vm_planta(V, A)), 1)'
        # Las paralelas por I₀ y L₀ a B₁A₀ y a C₁D₀, y los errores de llevar E₁I₁ o
        # R₁L₁ hacia el otro lado.
        A0r: proy_planta(rama(A_ab, 1))
        D0r: proy_planta(rama(D_ab, 1))
        I0r: proy_planta(rama(I_ab, 1))
        L0r: proy_planta(rama(L_ab, 1))
        parI: 'perpendicular(por: I0r, a: perpendicular(por: I0r, a: segmento2(figura.punto("B1"), A0r)))'
        parL: 'perpendicular(por: L0r, a: perpendicular(por: L0r, a: segmento2(figura.punto("C1"), D0r)))'
        E_mal: 'uno(medir_sobre(parI, desde: I0r, distancia: vm(E, I)), 1)'
        G_mal: 'uno(medir_sobre(parL, desde: L0r, distancia: vm(G, L)), 1)'
        # Los extremos de las rectas largas del desarrollo.
        L_V0: 'desplaza(proy_planta(rama(V_ab, 1)), dx: mm(3))'
        L_H0: 'desplaza(proy_planta(rama(H_ab, 1)), dx: mm(3))'
        L_I0: 'desplaza(proy_planta(rama(I_ab, 1)), dx: mm(3))'
        L_J0: 'desplaza(proy_planta(rama(J_ab, 1)), dx: mm(3))'
        L_K0: 'desplaza(proy_planta(rama(K_ab, 1)), dx: mm(3))'
        L_L0: 'desplaza(proy_planta(rama(L_ab, 1)), dx: mm(3))'
        L_E0: 'uno(medir_sobre(parI, desde: proy_planta(rama(E_ab, 1)), distancia: mm(3)), 2)'
        L_G0: 'uno(medir_sobre(parL, desde: proy_planta(rama(G_ab, 1)), distancia: mm(3)), 2)'
        # Los dos errores del radio de cada punto de la vertiente de la derecha:
        # lo que su planta dista de B₁C₁, o solo lo que sube sobre el alero.
        pV: pie_perpendicular(V, cb)
        pH: pie_perpendicular(H, cb)
        pI: pie_perpendicular(I, cb)
        pF: pie_perpendicular(F, cb)
        pJ: pie_perpendicular(J, cb)
        pK: pie_perpendicular(K, cb)
        hF: 'perpendicular(por: figura.punto("Q1"), a: figura.segmento("BC1"))'
        jg_mm: en_mm(vm(J, G))
      comprueba:
        - en_plano(L, vbc)
        - en_plano(H, vab)
        - en_plano(J, vcd)
        - en_plano(A_g, vbc)
        - en_plano(E_g, vbc)
        - en_plano(D_g, vbc)
        - en_plano(G_g, vbc)
    pasos:
      - tipo: reconocer
        pregunta: En el alzado, la vertiente de la derecha, VBC, se ve como la recta V₂B₂. ¿Qué dice eso de los puntos de la intersección que caen en ella, como F, en la arista Q, o H, en la arista VB?
        opciones:
          - texto: 'Que no se ven en el alzado: una cara de canto esconde sus puntos detrás de la recta V₂B₂'
            mensaje: |
              Se ven, y fácil: una cara de canto no esconde sus puntos, los junta todos en una recta. F, H, I, J y
              K tienen su alzado en V₂B₂; lo que hay que mirar después es si algo les pasa por delante.
          - texto: 'Que su alzado cae en V₂B₂: suben en vertical desde su planta, sin plano auxiliar'
            correcta: true
            mensaje: |
              Eso es. VBC contiene BC, que es de punta, así que es un plano de canto: en el alzado, todos sus
              puntos están en V₂B₂. F, en la vertical de Q₁; H e I, en las de H₁ e I₁, que están en V₁B₁; J y K, en
              las de J₁ y K₁, en V₁C₁. E y G, en cambio, están en vertientes que no son de canto, y cada uno pide la
              horizontal de su vertiente.
          - texto: Que hacen falta planos auxiliares, como en un plano cualquiera
            mensaje: |
              El plano auxiliar sirve cuando el plano no es proyectante. VBC sí lo es: es de canto, porque
              contiene BC, que es de punta, y en el alzado es la recta V₂B₂. Sus puntos suben en vertical hasta ella.

      - tipo: construir
        titulo: La intersección de la chimenea con la cubierta, y lo que se ve
        intro: |
          La chimenea es un prisma vertical: en la planta, sus caras se ven como los lados del triángulo
          P₁Q₁R₁, y la intersección está toda sobre ellos. Lo que falta es el alzado. Cada arista de la chimenea
          atraviesa una vertiente: P, la de atrás, en E; Q, la de la derecha, en F; R, la de delante, en G. Y
          las aristas VB y VC de la cubierta atraviesan las caras de la chimenea: VB en H (cara RP) y en I (cara
          PQ), y VC en J (cara RP) y en K (cara QR). En la planta, H₁, I₁, J₁ y K₁ son los extremos de los trozos
          de V₁B₁ y de V₁C₁ que dibuja la hoja. Todos estos nombres son nuestros.

          VBC es de canto: F, H, I, J y K suben en vertical hasta V₂B₂. E y G no: E está en la vertiente de atrás,
          a la altura de I, porque P₁Q₁ es la horizontal de esa vertiente que pasa por P; G está en la de
          delante, a la altura de L, el punto donde la horizontal de R₁ corta V₁C₁. Marca H₂, I₂, J₂, K₂, F₂, E₂ y
          G₂.

          Después, pasa a limpio con «arista vista» y «arista oculta» lo que falta del alzado: lo que falta de
          las aristas de la chimenea y de V₂B₂, y la intersección. Tomamos las piezas opacas, que el enunciado no
          lo dice. I₂ y J₂ quedan a 1,2 mm, y E₂ y G₂, a unos 3 mm de cruces de rectas de la construcción:
          amplía con la lupa (×4) antes de marcarlos.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, visto, oculto, borrar]
        tolerancia: 1
        objetivos:
          - nombre: H2
            pide: H, donde la arista VB entra en la chimenea (cara RP), en el alzado
            es: proy_alzado(solucion.H)
            bien: |
              H₂ está en V₂B₂, en la vertical de H₁: H es de la arista VB, que está en la vertiente de la derecha,
              de canto.
            diagnosticos:
              - si: '!en_recta(figura.segmento("VB2a"))'
                mensaje: |
                  H es un punto de la arista VB: su alzado está **en V₂B₂**, la recta en que se ve de canto la
                  vertiente de la derecha. Prolonga los trozos que dibuja la hoja.
                ejemplo: 'desplaza(proy_alzado(solucion.H), dy: mm(6))'
              - si: '!en_recta(segmento2(proy_planta(solucion.H), solucion.L_H2))'
                mensaje: |
                  H₂ va en la **vertical de H₁**, el extremo del trozo de V₁B₁ que llega a la chimenea por la
                  izquierda.
                ejemplo: 'uno(medir_sobre(figura.segmento("VB2a"), desde: proy_alzado(solucion.H), distancia: mm(6)), 1)'
              - si: siempre
                mensaje: |
                  H₂ está donde la vertical de H₁ corta V₂B₂.
          - nombre: I2
            pide: I, donde la arista VB sale de la chimenea (cara PQ), en el alzado
            es: proy_alzado(solucion.I)
            bien: |
              I₂ está en V₂B₂, en la vertical de I₁, a 1,2 mm de J₂.
            diagnosticos:
              - si: cerca_de(proy_alzado(solucion.J))
                mensaje: |
                  Ese es J₂, a 1,2 mm: el punto de la arista VC en la cara RP. I es de la arista VB, en la cara PQ, y
                  está en la vertical de I₁, en P₁Q₁.
                ejemplo: proy_alzado(solucion.J)
              - si: '!en_recta(figura.segmento("VB2a"))'
                mensaje: |
                  I es un punto de la arista VB: su alzado está **en V₂B₂**.
                ejemplo: 'desplaza(proy_alzado(solucion.I), dy: mm(6))'
              - si: siempre
                mensaje: |
                  I₂ está donde la vertical de I₁ corta V₂B₂.
          - nombre: J2
            pide: J, donde la arista VC entra en la chimenea (cara RP), en el alzado
            es: proy_alzado(solucion.J)
            bien: |
              J₂ está en V₂B₂, en la vertical de J₁: en el alzado, VC se ve sobre la misma recta que VB, porque las
              dos están en la vertiente de la derecha.
            diagnosticos:
              - si: cerca_de(proy_alzado(solucion.I))
                mensaje: |
                  Ese es I₂, a 1,2 mm: el punto de la arista VB en la cara PQ. J es de la arista VC, y está en la
                  vertical de J₁.
                ejemplo: proy_alzado(solucion.I)
              - si: '!en_recta(figura.segmento("VB2a"))'
                mensaje: |
                  J es un punto de la arista VC, y VC también está en la vertiente de la derecha, de canto: su
                  alzado está **en V₂B₂**.
                ejemplo: 'desplaza(proy_alzado(solucion.J), dy: mm(6))'
              - si: siempre
                mensaje: |
                  J₂ está donde la vertical de J₁ corta V₂B₂.
          - nombre: K2
            pide: K, donde la arista VC sale de la chimenea (cara QR), en el alzado
            es: proy_alzado(solucion.K)
            bien: |
              K₂ está en V₂B₂, en la vertical de K₁.
            diagnosticos:
              - si: '!en_recta(figura.segmento("VB2a"))'
                mensaje: |
                  K es un punto de la arista VC: su alzado está **en V₂B₂**.
                ejemplo: 'desplaza(proy_alzado(solucion.K), dy: mm(6))'
              - si: '!en_recta(segmento2(proy_planta(solucion.K), solucion.L_K2))'
                mensaje: |
                  K₂ va en la **vertical de K₁**, el extremo del trozo de V₁C₁ que sale de la chimenea por la derecha.
                ejemplo: 'uno(medir_sobre(figura.segmento("VB2a"), desde: proy_alzado(solucion.K), distancia: mm(6)), 1)'
              - si: siempre
                mensaje: |
                  K₂ está donde la vertical de K₁ corta V₂B₂.
          - nombre: F2
            pide: F, donde la arista Q de la chimenea toca la vertiente de la derecha, en el alzado
            es: proy_alzado(solucion.F)
            bien: |
              F₂ está en la arista Q, donde llega a V₂B₂: la vertiente de la derecha es de canto.
            diagnosticos:
              - si: cerca_de(figura.punto("Qb2"))
                mensaje: |
                  Ahí acaba lo que la hoja dibuja de la arista Q, pero la arista sigue. F está más abajo, donde la
                  arista llega a V₂B₂, el alzado de la vertiente de la derecha.
                ejemplo: figura.punto("Qb2")
              - si: '!en_recta(figura.segmento("aristaQ2"))'
                mensaje: |
                  F es un punto de la arista Q de la chimenea: va **en su vertical**, la de Q₁.
                ejemplo: 'desplaza(proy_alzado(solucion.F), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la arista Q, pero no en V₂B₂: F₂ está donde la vertical de Q₁ corta V₂B₂.
          - nombre: E2
            pide: E, donde la arista P de la chimenea toca la vertiente de atrás, en el alzado
            es: proy_alzado(solucion.E)
            bien: |
              E₂ está en la arista P, a la altura de I₂: P₁Q₁ es la horizontal de la vertiente de atrás que pasa
              por P, y corta V₁B₁ en I₁.
            diagnosticos:
              - si: cerca_de(solucion.x_P_VB)
                mensaje: |
                  Ese es el cruce aparente de la arista P con V₂B₂: ahí P pasa por detrás de la arista VC, sin
                  tocarla. E está en la vertiente de atrás, más abajo, a la altura de I₂.
                ejemplo: solucion.x_P_VB
              - si: cerca_de(solucion.E_conH)
                mensaje: |
                  Has llevado la altura de H₂. La horizontal de la vertiente de atrás que pasa por P es P₁Q₁, que
                  corta V₁B₁ en I₁, no en H₁: E está a la altura de I₂.
                ejemplo: solucion.E_conH
              - si: '!en_recta(figura.segmento("aristaP2"))'
                mensaje: |
                  E es un punto de la arista P de la chimenea: va **en su vertical**, la de P₁.
                ejemplo: 'desplaza(proy_alzado(solucion.E), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la arista P, pero no a la altura buena: la de I₂. La vertiente de atrás contiene rectas
                  paralelas a la línea de tierra, y la que pasa por P es P₁Q₁, que corta V₁B₁ en I₁.
          - nombre: G2
            pide: G, donde la arista R de la chimenea toca la vertiente de delante, en el alzado
            es: proy_alzado(solucion.G)
            bien: |
              G₂ está en la arista R, a la altura de L₂: la horizontal de la vertiente de delante que pasa por R
              corta V₁C₁ en L₁.
            diagnosticos:
              - si: cerca_de(solucion.x_R_VB)
                mensaje: |
                  Ese es el cruce aparente de la arista R con V₂B₂: R pasa ahí por delante de la cubierta, sin
                  tocarla. G está más abajo, a la altura de L₂.
                ejemplo: solucion.x_R_VB
              - si: '!en_recta(figura.segmento("aristaR2"))'
                mensaje: |
                  G es un punto de la arista R de la chimenea: va **en su vertical**, la de R₁.
                ejemplo: 'desplaza(proy_alzado(solucion.G), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la arista R, pero no a la altura buena. Por R₁, la paralela a la línea de tierra hasta
                  V₁C₁ da L₁; L₂ sube a V₂B₂, y su horizontal corta la arista R en G₂.
        # Decisión: las piezas, opacas (lo dicen las Notas). La visibilidad sale
        # de un cálculo de líneas ocultas aparte, por rayos contra las caras de
        # la chimenea y las tres vertientes con su hueco. En la planta no falta
        # nada: la chimenea va por encima, y la intersección son los lados del
        # triángulo. En el alzado, la vertiente de delante tapa lo que la
        # chimenea tiene detrás de ella; FI, FK y HJ caen sobre V₂B₂ y no son
        # tramos aparte.
        tramos:
          - traza: segmento2(figura.punto("Pb2"), solucion.x_P_VB)
            tipo: visto
            porque: 'Por encima de V₂B₂, la arista P queda fuera del alzado de la cubierta: nada le pasa por delante.'
          - traza: segmento2(solucion.x_P_VB, proy_alzado(solucion.E))
            tipo: oculto
            porque: 'En el cruce aparente con V₂B₂, la arista P pasa por detrás de VC, que va 15,1 mm más cerca de quien mira; desde ahí la tapa la vertiente de delante hasta E, donde P entra en la de atrás.'
          - traza: segmento2(figura.punto("Qb2"), proy_alzado(solucion.F))
            tipo: visto
            porque: 'La arista Q baja hasta F, en la vertiente de la derecha, que es de canto; toda ella queda por encima de V₂B₂, fuera del alzado de la cubierta, y nada la tapa.'
          - traza: segmento2(figura.punto("Rb2"), proy_alzado(solucion.G))
            tipo: visto
            porque: 'La arista R es la de delante de la chimenea y, hasta G, va por fuera de la cubierta y por delante de la vertiente de delante: nada la tapa.'
          - traza: segmento2(proy_alzado(solucion.E), proy_alzado(solucion.H))
            tipo: oculto
            porque: 'EH es la intersección de la cara RP de la chimenea con la vertiente de atrás, y la vertiente de delante le pasa por delante: en la planta, V₁C₁ va más abajo que todo E₁H₁, con más alejamiento.'
          - traza: segmento2(proy_alzado(solucion.E), proy_alzado(solucion.I))
            tipo: oculto
            porque: 'EI es la intersección de la cara de atrás de la chimenea, PQ, con la vertiente de atrás: la tapan la propia chimenea y la vertiente de delante, que le pasan por delante.'
          - traza: segmento2(proy_alzado(solucion.J), proy_alzado(solucion.G))
            tipo: visto
            porque: 'JG está en la cara RP de la chimenea, que mira hacia quien mira el alzado, y en la vertiente de delante: nada le pasa por delante.'
          - traza: segmento2(proy_alzado(solucion.G), proy_alzado(solucion.K))
            tipo: visto
            porque: 'GK está en la cara QR de la chimenea, que también mira hacia delante, y en la vertiente de delante: nada la tapa.'
          - traza: segmento2(figura.punto("M2"), proy_alzado(solucion.J))
            tipo: visto
            porque: 'Este trozo de V₂B₂ es VC, el borde de la vertiente de delante, que va por delante de la chimenea hasta J, donde entra en ella: nada lo tapa. VB va detrás, en la misma recta del alzado.'
          - traza: segmento2(proy_alzado(solucion.I), proy_alzado(solucion.K))
            tipo: oculto
            porque: 'Entre I y K, VC está dentro de la chimenea, y lo que queda en esta recta del alzado es VB, que sale de la chimenea en I y va por detrás de ella: la tapa. En la planta, las caras RP y QR de la chimenea van más abajo que V₁B₁, con más alejamiento.'
          - traza: segmento2(proy_alzado(solucion.K), figura.punto("N2"))
            tipo: visto
            porque: 'Desde K, VC sale de la chimenea y vuelve a ser el borde de delante de la cubierta: nada la tapa.'
        trazado:
          - segmento2(figura.punto("R1"), solucion.Lp)
          - segmento2(solucion.Lp, proy_alzado(solucion.L))
          - segmento2(proy_alzado(solucion.L), proy_alzado(solucion.G))
          - segmento2(proy_alzado(solucion.I), proy_alzado(solucion.E))
          - segmento2(proy_planta(solucion.H), proy_alzado(solucion.H))
          - segmento2(proy_planta(solucion.I), proy_alzado(solucion.I))
          - segmento2(proy_planta(solucion.J), proy_alzado(solucion.J))
          - segmento2(proy_planta(solucion.K), proy_alzado(solucion.K))
        construccion:
          - con: marca
            traza: '[figura.punto("P1"), figura.punto("Q1"), figura.punto("R1")]'
            porque: |
              P₁, Q₁ y R₁, en los vértices del triángulo de la planta: las aristas de la chimenea, P atrás a la
              izquierda, Q atrás a la derecha y R delante. Nombres nuestros.
          - con: marca
            traza: '[proy_planta(solucion.H), proy_planta(solucion.I), proy_planta(solucion.J), proy_planta(solucion.K)]'
            porque: |
              H₁ e I₁, en los extremos de los dos trozos de V₁B₁ que dibuja la hoja, donde la arista VB entra en la
              chimenea por la cara RP y sale por la PQ; J₁ y K₁, en los de V₁C₁, por las caras RP y QR. Nombres
              nuestros.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("R1"), solucion.L_Lp)
            porque: |
              **G, en la vertiente de delante.** Esa vertiente contiene rectas paralelas a la línea de tierra,
              como su alero CD. Por R₁, la horizontal hacia la derecha, hasta pasar V₁C₁: es la de esa vertiente
              que pasa por R.
          - con: marca
            traza: solucion.Lp
            rotulo: L₁
            porque: |
              L₁, donde la horizontal de R₁ corta V₁C₁: el punto de la arista VC con la cota de G. Nombre nuestro.
          - con: regla
            traza: segmento2(figura.punto("M2"), figura.punto("N2"))
            porque: |
              V₂B₂, completada con la regla entre los dos trozos que dibuja la hoja: es el alzado de toda la
              vertiente de la derecha, y por ella van los puntos que faltan. Se traza fino: después se pasa a limpio
              lo que se ve y lo que no.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(solucion.H), solucion.L_H2), segmento2(proy_planta(solucion.I), solucion.L_I2), segmento2(proy_planta(solucion.J), solucion.L_J2), segmento2(proy_planta(solucion.K), solucion.L_K2), segmento2(solucion.Lp, solucion.L_L2), segmento2(figura.punto("Q1"), figura.punto("Qb2"))]'
            porque: |
              **Las verticales.** Por H₁, I₁, J₁, K₁ y L₁, las verticales hasta pasar V₂B₂; y por Q₁, la vertical
              hasta el extremo de la arista Q que dibuja la hoja, que prolonga. Todos son puntos de la vertiente de
              la derecha, que es de canto: su alzado está en V₂B₂.
          - con: marca
            traza: proy_alzado(solucion.H)
            rotulo: H₂
            porque: |
              H₂, donde la vertical de H₁ corta V₂B₂, sobre el primer trozo que dibuja la hoja, 4,2 mm antes de
              donde acaba.
          - con: marca
            traza: proy_alzado(solucion.I)
            porque: |
              I₂, donde la vertical de I₁ corta V₂B₂. Va sin rótulo: J₂, a 1,2 mm, lo taparía.
          - con: marca
            traza: proy_alzado(solucion.J)
            rotulo: J₂
            porque: |
              J₂, donde la vertical de J₁ corta V₂B₂, 1,2 mm antes que I₂.
          - con: marca
            traza: proy_alzado(solucion.K)
            rotulo: K₂
            porque: |
              K₂, donde la vertical de K₁ corta V₂B₂.
          - con: marca
            traza: proy_alzado(solucion.L)
            rotulo: L₂
            porque: |
              L₂, donde la vertical de L₁ corta V₂B₂: a la altura de G.
          - con: marca
            traza: proy_alzado(solucion.F)
            rotulo: F₂
            porque: |
              F₂, donde la vertical de Q₁, la arista Q prolongada, corta V₂B₂: F es de la vertiente de la derecha.
              F, como E y G, es nombre nuestro.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_alzado(solucion.I), solucion.L_E2), segmento2(proy_alzado(solucion.L), solucion.L_G2)]'
            porque: |
              **E y G.** En el alzado, por I₂ y por L₂, las horizontales hacia la izquierda, hasta pasar las aristas
              P y R: E está a la altura de I, en la vertiente de atrás, y G a la de L, en la de delante.
          - con: escuadra-cartabon
            traza: '[segmento2(figura.punto("P1"), figura.punto("Pb2")), segmento2(figura.punto("R1"), figura.punto("Rb2"))]'
            porque: |
              Por P₁ y por R₁, las verticales hasta lo que la hoja dibuja de las aristas P y R: las prolongan, y
              cruzan las horizontales de I₂ y de L₂.
          - con: marca
            traza: proy_alzado(solucion.E)
            rotulo: E₂
            porque: |
              E₂, donde la arista P cruza la horizontal de I₂. Nombre nuestro.
          - con: marca
            traza: proy_alzado(solucion.G)
            rotulo: G₂
            porque: |
              G₂, donde la arista R cruza la horizontal de L₂. Nombre nuestro.
          - con: arista-vista
            traza: '[segmento2(figura.punto("Pb2"), solucion.x_P_VB), segmento2(figura.punto("Qb2"), proy_alzado(solucion.F)), segmento2(figura.punto("Rb2"), proy_alzado(solucion.G)), segmento2(proy_alzado(solucion.J), proy_alzado(solucion.G)), segmento2(proy_alzado(solucion.G), proy_alzado(solucion.K)), segmento2(figura.punto("M2"), proy_alzado(solucion.J)), segmento2(proy_alzado(solucion.K), figura.punto("N2"))]'
            porque: |
              **A limpio, el alzado.** En continua, lo que va por delante: la arista P hasta V₂B₂, las Q y R hasta
              F₂ y G₂, la intersección con la vertiente de delante, J₂G₂K₂, y VC hasta J₂ y desde K₂.
          - con: arista-oculta
            traza: '[segmento2(solucion.x_P_VB, proy_alzado(solucion.E)), segmento2(proy_alzado(solucion.E), proy_alzado(solucion.H)), segmento2(proy_alzado(solucion.E), proy_alzado(solucion.I)), segmento2(proy_alzado(solucion.I), proy_alzado(solucion.K))]'
            porque: |
              A trazos, lo que tapa la vertiente de delante o la propia chimenea: la arista P desde V₂B₂, la
              intersección con la vertiente de atrás, H₂E₂I₂, y VB de I₂ a K₂, detrás de la chimenea.
        pista: |
          (1) H₁, I₁, J₁ y K₁ son los extremos de los trozos de V₁B₁ y V₁C₁. (2) Con ellos y con Q₁, verticales
          hasta V₂B₂: la vertiente de la derecha es de canto. (3) E, a la altura de I₂: P₁Q₁ es la horizontal de la
          vertiente de atrás por P. (4) G, a la altura de L₂: la horizontal de R₁ corta V₁C₁ en L₁. (5) Para lo que
          se ve, mira qué va delante en la planta: la vertiente de delante tapa lo que la chimenea tiene detrás.
        desarrollo: |
          En verde claro, las verticales de H₁, I₁, J₁ y K₁ hasta V₂B₂, la horizontal de R₁ hasta L₁, y las
          horizontales de I₂ y L₂ que dan E₂ y G₂. La intersección es la línea cerrada EIFKGJH: EI y HE en la
          vertiente de atrás, IF, FK y JH en la de la derecha (en el alzado, sobre V₂B₂), y KG y GJ en la de
          delante. En el alzado se ve la parte de delante; la de atrás, a trazos.

      - tipo: construir
        titulo: Las tres vertientes, con el hueco, en su desarrollo
        intro: |
          El desarrollo de la cubierta, un método nuestro: las tres vertientes en verdadera magnitud, una al lado
          de otra, unidas por las aristas que comparten. VBC, que es de canto, se abate sobre el plano horizontal
          de su alero BC: en el alzado, cada uno de sus puntos dista de BC lo que dista de B₂ sobre V₂B₂, y en la
          planta se aparta eso de B₁C₁, por la paralela a la línea de tierra que pasa por su planta. Vale
          cualquiera de los dos lados de B₁C₁, pero toda la vertiente al mismo; aquí, a la derecha, donde la
          lámina tiene sitio. En la hoja de papel, a la derecha no cabe: V₀ queda unos 7 mm fuera del borde de la
          hoja. En el papel, hazlo hacia la izquierda, encima de la planta y del alzado (A₀ cae dentro del
          alzado), que también vale. Marca V₀, H₀, I₀, F₀, J₀ y K₀; también hace falta L₀, para G.

          Las otras dos giran alrededor de VB y de VC hasta quedar en ese plano, al otro lado de cada arista,
          sin pisar la de la derecha. Los dos arcos de A₀, y los de D₀, se cortan a los dos lados de la arista:
          el corte del otro lado es el desarrollo; el del mismo lado también deja la vertiente en verdadera
          magnitud, pero doblada encima de la de la derecha, y eso no es el desarrollo que se pide aquí. A₀
          está a A₁B₁ de B₁ (AB se ve en verdadera magnitud en la planta) y a la
          verdadera magnitud de VA de V₀; VA es de perfil, y su verdadera magnitud es la hipotenusa de V₂A₂ y de
          V₁A₁, que se lleva sobre la base del alzado hasta U₂, nombre nuestro: es V₂U₂. D₀, igual, desde C₁ y V₀.
          E₀ y G₀ salen de las horizontales de sus vertientes: EI es paralela a AB, y GL a CD. Marca A₀, D₀, E₀ y
          G₀.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, borrar]
        tolerancia: 1
        objetivos:
          - nombre: V0
            pide: V, abatido con la vertiente de la derecha
            es: proy_planta(solucion.V_ab)
            bien: |
              V₀ está en la horizontal de V₁, a B₂V₂ de B₁C₁: 84,3 mm. La vertiente es de canto, y en el alzado V₂B₂
              es una de sus rectas de máxima pendiente en verdadera magnitud.
            diagnosticos:
              - si: cerca_de(figura.punto("V1"))
                mensaje: |
                  Ese es V₁, sin abatir. Al abatir la vertiente de la derecha sobre el plano horizontal de su
                  alero, V gira alrededor de BC y, en la planta, se aparta de B₁C₁ por la horizontal de V₁.
                ejemplo: figura.punto("V1")
              - si: 'en_recta(solucion.hV) && a_distancia(de: solucion.mV, d: vm_planta(V, solucion.pV))'
                mensaje: |
                  Has llevado lo que V₁ dista de B₁C₁ **en la planta**, y la planta acorta: V está además 65,4 mm
                  más alto que el alero. La distancia real es B₂V₂, en el alzado, donde la vertiente es una recta.
                ejemplo: 'uno(medir_sobre(solucion.hV, desde: solucion.mV, distancia: vm_planta(V, solucion.pV)), 2)'
              - si: 'en_recta(solucion.hV) && a_distancia(de: solucion.mV, d: diferencia_de_cotas(V, B))'
                mensaje: |
                  Has llevado solo lo que V está más alto que el alero, un cateto. La distancia real de V a BC es
                  la hipotenusa: B₂V₂, en el alzado.
                ejemplo: 'uno(medir_sobre(solucion.hV, desde: solucion.mV, distancia: diferencia_de_cotas(V, B)), 2)'
              - si: '!en_recta(solucion.hV)'
                mensaje: |
                  V se abate por la **perpendicular a la charnela que pasa por V₁**: B₁C₁ es de punta, así que es
                  la horizontal del papel.
                ejemplo: 'desplaza(proy_planta(rama(solucion.V_ab, 1)), dy: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la horizontal de V₁, pero no a la distancia buena: la de B₂ a V₂ en el alzado, llevada
                  desde B₁C₁.
          - nombre: H0
            pide: H, abatido con la vertiente de la derecha
            es: proy_planta(solucion.H_ab)
            bien: |
              H₀ está en la horizontal de H₁, a B₂H₂ de B₁C₁, y en V₀B₁: H es de la arista VB.
            diagnosticos:
              - si: cerca_de(otra_rama(proy_planta(solucion.H_ab)))
                mensaje: |
                  Ese es H abatido **al otro lado** de la charnela. La vertiente gira entera: H₀ cae al lado de V₀.
                ejemplo: proy_planta(rama(solucion.H_ab, 2))
              - si: 'en_recta(solucion.hH) && a_distancia(de: solucion.mH, d: vm_planta(solucion.H, solucion.pH))'
                mensaje: |
                  Has llevado lo que H₁ dista de B₁C₁ **en la planta**. La distancia real es B₂H₂, en el alzado.
                ejemplo: 'uno(medir_sobre(solucion.hH, desde: solucion.mH, distancia: vm_planta(solucion.H, solucion.pH)), 2)'
              - si: '!en_recta(solucion.hH)'
                mensaje: |
                  H se abate por la **horizontal de H₁**, la perpendicular a la charnela.
                ejemplo: 'desplaza(proy_planta(rama(solucion.H_ab, 1)), dy: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la horizontal de H₁, pero no a la distancia de B₂H₂. H₀ cae también en V₀B₁.
          - nombre: I0
            pide: I, abatido con la vertiente de la derecha
            es: proy_planta(solucion.I_ab)
            bien: |
              I₀ está en la horizontal de I₁, que es la de P₁Q₁, a B₂I₂ de B₁C₁, y en V₀B₁.
            diagnosticos:
              - si: cerca_de(otra_rama(proy_planta(solucion.I_ab)))
                mensaje: |
                  Ese es I abatido **al otro lado** de la charnela: va al lado de V₀.
                ejemplo: proy_planta(rama(solucion.I_ab, 2))
              - si: cerca_de(proy_planta(solucion.F_ab))
                mensaje: |
                  Ese es F₀, el de la arista Q, en la misma horizontal. I está más arriba en V₂B₂, más lejos de B₂, y
                  abatido cae más lejos de B₁C₁, en V₀B₁.
                ejemplo: proy_planta(rama(solucion.F_ab, 1))
              - si: 'en_recta(solucion.hI) && a_distancia(de: solucion.mI, d: vm_planta(solucion.I, solucion.pI))'
                mensaje: |
                  Has llevado lo que I₁ dista de B₁C₁ **en la planta**. La distancia real es B₂I₂, en el alzado.
                ejemplo: 'uno(medir_sobre(solucion.hI, desde: solucion.mI, distancia: vm_planta(solucion.I, solucion.pI)), 2)'
              - si: '!en_recta(solucion.hI)'
                mensaje: |
                  I se abate por la **horizontal de I₁**, la de P₁Q₁.
                ejemplo: 'desplaza(proy_planta(rama(solucion.I_ab, 1)), dy: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la horizontal de I₁, pero no a la distancia de B₂I₂.
          - nombre: F0
            pide: F, abatido con la vertiente de la derecha
            es: proy_planta(solucion.F_ab)
            bien: |
              F₀ está en la misma horizontal, la de P₁Q₁, a B₂F₂ de B₁C₁: F es el punto del hueco más cerca del
              alero.
            diagnosticos:
              - si: cerca_de(otra_rama(proy_planta(solucion.F_ab)))
                mensaje: |
                  Ese es F abatido **al otro lado** de la charnela: va al lado de V₀.
                ejemplo: proy_planta(rama(solucion.F_ab, 2))
              - si: cerca_de(proy_planta(solucion.I_ab))
                mensaje: |
                  Ese es I₀, en la misma horizontal. F está muy cerca de B₂ en V₂B₂, y abatido cae cerca de B₁C₁.
                ejemplo: proy_planta(rama(solucion.I_ab, 1))
              - si: cerca_de(figura.punto("Q1"))
                mensaje: |
                  Ese es Q₁, la planta de F sin abatir: se aparta de B₁C₁ hacia la derecha.
                ejemplo: figura.punto("Q1")
              - si: '!en_recta(solucion.hF)'
                mensaje: |
                  F se abate por la **horizontal de Q₁**, la de P₁Q₁ prolongada.
                ejemplo: 'desplaza(proy_planta(rama(solucion.F_ab, 1)), dy: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la horizontal de Q₁, pero no a la distancia de B₂F₂.
          - nombre: J0
            pide: J, abatido con la vertiente de la derecha
            es: proy_planta(solucion.J_ab)
            bien: |
              J₀ está en la horizontal de J₁, a B₂J₂ de B₁C₁, y en V₀C₁: J es de la arista VC.
            diagnosticos:
              - si: cerca_de(otra_rama(proy_planta(solucion.J_ab)))
                mensaje: |
                  Ese es J abatido **al otro lado** de la charnela: va al lado de V₀.
                ejemplo: proy_planta(rama(solucion.J_ab, 2))
              - si: 'en_recta(solucion.hJ) && a_distancia(de: solucion.mJ, d: vm_planta(solucion.J, solucion.pJ))'
                mensaje: |
                  Has llevado lo que J₁ dista de B₁C₁ **en la planta**. La distancia real es B₂J₂, en el alzado.
                ejemplo: 'uno(medir_sobre(solucion.hJ, desde: solucion.mJ, distancia: vm_planta(solucion.J, solucion.pJ)), 2)'
              - si: '!en_recta(solucion.hJ)'
                mensaje: |
                  J se abate por la **horizontal de J₁**.
                ejemplo: 'desplaza(proy_planta(rama(solucion.J_ab, 1)), dy: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la horizontal de J₁, pero no a la distancia de B₂J₂. J₀ cae también en V₀C₁.
          - nombre: K0
            pide: K, abatido con la vertiente de la derecha
            es: proy_planta(solucion.K_ab)
            bien: |
              K₀ está en la horizontal de K₁, a B₂K₂ de B₁C₁, y en V₀C₁.
            diagnosticos:
              - si: cerca_de(otra_rama(proy_planta(solucion.K_ab)))
                mensaje: |
                  Ese es K abatido **al otro lado** de la charnela: va al lado de V₀.
                ejemplo: proy_planta(rama(solucion.K_ab, 2))
              - si: 'en_recta(solucion.hK) && a_distancia(de: solucion.mK, d: vm_planta(solucion.K, solucion.pK))'
                mensaje: |
                  Has llevado lo que K₁ dista de B₁C₁ **en la planta**. La distancia real es B₂K₂, en el alzado.
                ejemplo: 'uno(medir_sobre(solucion.hK, desde: solucion.mK, distancia: vm_planta(solucion.K, solucion.pK)), 2)'
              - si: '!en_recta(solucion.hK)'
                mensaje: |
                  K se abate por la **horizontal de K₁**.
                ejemplo: 'desplaza(proy_planta(rama(solucion.K_ab, 1)), dy: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la horizontal de K₁, pero no a la distancia de B₂K₂.
          - nombre: A0
            pide: A, con la vertiente de atrás girada hasta el desarrollo
            es: proy_planta(solucion.A_ab)
            bien: |
              A₀ está a A₁B₁ de B₁ y a V₂U₂ de V₀, por encima de V₀B₁: la vertiente de atrás, girada alrededor de VB
              hasta el plano de la de la derecha, al otro lado de VB.
            diagnosticos:
              - si: cerca_de(otra_rama(proy_planta(solucion.A_ab)))
                mensaje: |
                  Ese es A en el desarrollo hecho **al otro lado** de B₁C₁. Todo va con la vertiente de la derecha:
                  A₀ cae al lado de V₀.
                ejemplo: proy_planta(rama(solucion.A_ab, 2))
              - si: cerca_de(proy_planta(solucion.A_do))
                mensaje: |
                  Ese es el otro corte de los dos arcos: la vertiente de atrás, en verdadera magnitud, pero doblada
                  encima de la de la derecha. En el desarrollo queda al otro lado de V₀B₁, sin pisarla.
                ejemplo: proy_planta(rama(solucion.A_do, 1))
              - si: '!a_distancia(de: figura.punto("B1"), d: vm(A, B))'
                mensaje: |
                  A₀ está a **A₁B₁ de B₁**: B está en la charnela y no se mueve, y AB, paralela a la línea de tierra,
                  se ve en verdadera magnitud en la planta.
                ejemplo: 'desplaza(proy_planta(rama(solucion.A_ab, 1)), dy: mm(-6))'
              - si: siempre
                mensaje: |
                  Estás a A₁B₁ de B₁, pero no a la distancia buena de V₀: la verdadera magnitud de VA, la hipotenusa
                  de V₂A₂ y de V₁A₁, que es V₂U₂.
          - nombre: D0
            pide: D, con la vertiente de delante girada hasta el desarrollo
            es: proy_planta(solucion.D_ab)
            bien: |
              D₀ está a D₁C₁ de C₁ y a V₂U₂ de V₀, por debajo de V₀C₁: VD mide lo mismo que VA.
            diagnosticos:
              - si: cerca_de(otra_rama(proy_planta(solucion.D_ab)))
                mensaje: |
                  Ese es D en el desarrollo hecho **al otro lado** de B₁C₁: D₀ cae al lado de V₀.
                ejemplo: proy_planta(rama(solucion.D_ab, 2))
              - si: cerca_de(proy_planta(solucion.D_do))
                mensaje: |
                  Ese es el otro corte de los dos arcos: la vertiente de delante, en verdadera magnitud, pero
                  doblada encima de la de la derecha. En el desarrollo queda al otro lado de V₀C₁, sin pisarla.
                ejemplo: proy_planta(rama(solucion.D_do, 1))
              - si: '!a_distancia(de: figura.punto("C1"), d: vm(C, D))'
                mensaje: |
                  D₀ está a **D₁C₁ de C₁**: C está en la charnela, y CD se ve en verdadera magnitud en la planta.
                ejemplo: 'desplaza(proy_planta(rama(solucion.D_ab, 1)), dy: mm(6))'
              - si: siempre
                mensaje: |
                  Estás a D₁C₁ de C₁, pero no a la distancia buena de V₀: la verdadera magnitud de VD, V₂U₂.
          - nombre: E0
            pide: E, el punto del hueco en la vertiente de atrás, en el desarrollo
            es: proy_planta(solucion.E_ab)
            bien: |
              E₀ está en la paralela a B₁A₀ por I₀, a E₁I₁ de I₀, hacia A₀: EI es paralela a AB, y las dos se ven en
              verdadera magnitud en la planta.
            diagnosticos:
              - si: cerca_de(otra_rama(proy_planta(solucion.E_ab)))
                mensaje: |
                  Ese es E en el desarrollo hecho **al otro lado** de B₁C₁.
                ejemplo: proy_planta(rama(solucion.E_ab, 2))
              - si: cerca_de(solucion.E_mal)
                mensaje: |
                  Has llevado E₁I₁ hacia el lado de B. E está a la izquierda de I, del lado de A: en el desarrollo,
                  E₀ va de I₀ hacia A₀.
                ejemplo: solucion.E_mal
              - si: '!en_recta(solucion.parI)'
                mensaje: |
                  E₀ va en la **paralela a B₁A₀ que pasa por I₀**: EI es una horizontal de la vertiente de atrás,
                  paralela a AB, y en el desarrollo sigue siéndolo.
                ejemplo: 'desplaza(proy_planta(rama(solucion.E_ab, 1)), dy: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la paralela a B₁A₀ por I₀, pero no a E₁I₁ de I₀.
          - nombre: G0
            pide: G, el punto del hueco en la vertiente de delante, en el desarrollo
            es: proy_planta(solucion.G_ab)
            bien: |
              G₀ está en la paralela a C₁D₀ por L₀, a R₁L₁ de L₀, hacia D₀: GL es paralela a CD. J₀G₀ mide 29,2 mm, la
              longitud real de JG.
            diagnosticos:
              - si: cerca_de(otra_rama(proy_planta(solucion.G_ab)))
                mensaje: |
                  Ese es G en el desarrollo hecho **al otro lado** de B₁C₁.
                ejemplo: proy_planta(rama(solucion.G_ab, 2))
              - si: cerca_de(solucion.G_mal)
                mensaje: |
                  Has llevado R₁L₁ hacia el lado de C. G está a la izquierda de L, del lado de D: en el desarrollo,
                  G₀ va de L₀ hacia D₀.
                ejemplo: solucion.G_mal
              - si: '!en_recta(solucion.parL)'
                mensaje: |
                  G₀ va en la **paralela a C₁D₀ que pasa por L₀**: GL es una horizontal de la vertiente de delante,
                  paralela a CD.
                ejemplo: 'desplaza(proy_planta(rama(solucion.G_ab, 1)), dy: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la paralela a C₁D₀ por L₀, pero no a R₁L₁ de L₀.
        trazado:
          - segmento2(proy_planta(rama(solucion.V_ab, 1)), figura.punto("B1"))
          - segmento2(proy_planta(rama(solucion.V_ab, 1)), figura.punto("C1"))
          - segmento2(proy_planta(rama(solucion.V_ab, 1)), solucion.A0r)
          - segmento2(solucion.A0r, figura.punto("B1"))
          - segmento2(proy_planta(rama(solucion.V_ab, 1)), solucion.D0r)
          - segmento2(solucion.D0r, figura.punto("C1"))
          - segmento2(proy_planta(rama(solucion.E_ab, 1)), solucion.I0r)
          - segmento2(solucion.I0r, proy_planta(rama(solucion.F_ab, 1)))
          - segmento2(proy_planta(rama(solucion.F_ab, 1)), proy_planta(rama(solucion.K_ab, 1)))
          - segmento2(proy_planta(rama(solucion.K_ab, 1)), proy_planta(rama(solucion.G_ab, 1)))
          - segmento2(proy_planta(rama(solucion.G_ab, 1)), proy_planta(rama(solucion.J_ab, 1)))
          - segmento2(proy_planta(rama(solucion.J_ab, 1)), proy_planta(rama(solucion.H_ab, 1)))
          - segmento2(proy_planta(rama(solucion.H_ab, 1)), proy_planta(rama(solucion.E_ab, 1)))
        bloques:
          - nombre: Abatimiento de VBC
            explica: |
              La vertiente de la derecha, VBC, contiene el alero BC, que es de punta, y por eso es
              de canto: en el alzado todos sus puntos están en V₂B₂, y BC se ve como el punto B₂. El
              desarrollo, que es nuestro, empieza abatiéndola sobre el plano horizontal de su alero,
              con BC de charnela. Cada punto gira en un plano perpendicular a BC, que es frontal, y
              su distancia real a BC se ve en el alzado: es lo que dista de B₂ sobre V₂B₂. En la
              planta, el punto se aparta de B₁C₁ esa distancia, por la horizontal del papel que pasa
              por su planta. Por eso, antes, los puntos del hueco que están en ella, H, I, J, K y F,
              suben a V₂B₂, y también L, el de VC a la cota de G, que hace falta para G₀.
          - nombre: Verdadera magnitud de VA
            explica: |
              Para girar las otras dos vertientes hasta el desarrollo hace falta lo que mide de
              verdad VA, y VA es de perfil: la planta y el alzado la acortan. Es el triángulo del
              tema 2, rectángulo en A₂ y dibujado sobre el alzado: un cateto es V₂A₂, lo que baja, y
              el otro, V₁A₁, lo que avanza, llevado por la base del alzado. Equivale a girar VA
              alrededor de la vertical de V hasta dejarla frontal: A conserva su cota y su alzado va
              a U₂, y VA, ya frontal, se ve entera, V₂U₂. VD mide lo mismo, porque V₁ está en el
              punto medio de A₁D₁ y A y D tienen la misma cota.
          - nombre: Giros alrededor de VB y de VC
            explica: |
              Las vertientes de atrás y de delante giran alrededor de las aristas que comparten con
              la de la derecha, VB y VC, hasta quedar en el plano del desarrollo, al otro lado de
              cada arista. VB y VC, ya abatidas en V₀B₁ y V₀C₁, son los ejes y no se mueven, y una
              cara que gira no se deforma: cada vértice conserva sus distancias reales a los de la
              arista. Por eso A₀ está a AB de B₁ y a VA de V₀, y D₀ a CD de C₁ y a VD de V₀; los dos
              arcos se cortan dos veces, y el corte del otro lado de la arista es el que despliega
              la cubierta. E₀ y G₀, los puntos del hueco en estas vertientes, salen de sus
              horizontales, que siguen paralelas a su alero: EI, a A₀B₁, y GL, a D₀C₁, las dos con
              su verdadera magnitud en la planta.
        construccion:
          - con: marca
            traza: '[figura.punto("V1"), figura.punto("P1"), figura.punto("Q1"), figura.punto("R1")]'
            porque: |
              V₁, en el punto medio del lado izquierdo del cuadrado, donde salen V₁B₁ y V₁C₁; P₁, Q₁ y R₁, en los
              vértices del triángulo de la chimenea. Nombres nuestros, como en el paso anterior.
          - con: marca
            traza: '[proy_planta(solucion.H), proy_planta(solucion.I), proy_planta(solucion.J), proy_planta(solucion.K)]'
            porque: |
              H₁ e I₁, en los extremos de los trozos de V₁B₁ junto a la chimenea; J₁ y K₁, en los de V₁C₁. Nombres
              nuestros.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("R1"), solucion.L_L0)
            bloque: Abatimiento de VBC
            porque: |
              Por R₁, la horizontal hacia la derecha, larga, más allá de B₁C₁: es la de la vertiente de delante
              que pasa por R, y por ella se abatirá L.
          - con: marca
            traza: solucion.Lp
            rotulo: L₁
            bloque: Abatimiento de VBC
            porque: |
              L₁, donde la horizontal de R₁ corta V₁C₁. Nombre nuestro.
          - con: regla
            traza: segmento2(figura.punto("M2"), figura.punto("N2"))
            bloque: Abatimiento de VBC
            porque: |
              V₂B₂, completada con la regla entre los dos trozos que dibuja la hoja: el alzado de la vertiente de la
              derecha.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(solucion.H), solucion.L_H2), segmento2(proy_planta(solucion.I), solucion.L_I2), segmento2(proy_planta(solucion.J), solucion.L_J2), segmento2(proy_planta(solucion.K), solucion.L_K2), segmento2(solucion.Lp, solucion.L_L2), segmento2(figura.punto("Q1"), figura.punto("Qb2"))]'
            bloque: Abatimiento de VBC
            porque: |
              **Los alzados en V₂B₂.** Por H₁, I₁, J₁, K₁, L₁ y Q₁, las verticales hasta V₂B₂, como en el paso
              anterior: todos son de la vertiente de la derecha, de canto.
          - con: marca
            traza: '[proy_alzado(solucion.H), proy_alzado(solucion.I), proy_alzado(solucion.J), proy_alzado(solucion.K), proy_alzado(solucion.L), proy_alzado(solucion.F)]'
            bloque: Abatimiento de VBC
            porque: |
              H₂, I₂, J₂, K₂, L₂ y F₂, donde esas verticales cortan V₂B₂. La distancia de cada uno a B₂, sobre V₂B₂,
              es su distancia real al alero BC.
          - con: escuadra-cartabon
            traza: '[segmento2(figura.punto("V1"), solucion.L_V0), segmento2(proy_planta(solucion.H), solucion.L_H0), segmento2(figura.punto("P1"), solucion.L_I0), segmento2(proy_planta(solucion.J), solucion.L_J0), segmento2(proy_planta(solucion.K), solucion.L_K0)]'
            bloque: Abatimiento de VBC
            porque: |
              **La vertiente de la derecha.** En la planta, por V₁, H₁, J₁ y K₁, las horizontales hacia la derecha,
              largas, más allá de B₁C₁; y la de P₁Q₁, prolongada, que sirve para I y para F. Son las perpendiculares
              a la charnela, B₁C₁, que es de punta.
          - con: compas
            traza: 'arco(solucion.mV, por: proy_planta(rama(solucion.V_ab, 1)), desde: desplaza(proy_planta(rama(solucion.V_ab, 1)), dy: -6), hasta: desplaza(proy_planta(rama(solucion.V_ab, 1)), dy: 6))'
            toma: segmento2(figura.punto("B2"), figura.punto("V2"))
            bloque: Abatimiento de VBC
            porque: |
              Con el compás, en el alzado, **B₂V₂**: la distancia real de V al alero, porque la vertiente es de
              canto. Con centro donde la horizontal de V₁ corta B₁C₁, sobre esa horizontal, a la derecha.
          - con: marca
            traza: proy_planta(rama(solucion.V_ab, 1))
            rotulo: V₀
            bloque: Abatimiento de VBC
            porque: |
              V₀, donde el arco corta la horizontal de V₁: V abatido. Al otro lado de B₁C₁ también valdría, con toda
              la vertiente al mismo lado.
          - con: compas
            traza: 'arco(solucion.mH, por: proy_planta(rama(solucion.H_ab, 1)), desde: desplaza(proy_planta(rama(solucion.H_ab, 1)), dy: -6), hasta: desplaza(proy_planta(rama(solucion.H_ab, 1)), dy: 6))'
            toma: segmento2(figura.punto("B2"), proy_alzado(solucion.H))
            bloque: Abatimiento de VBC
            porque: |
              B₂H₂, desde donde la horizontal de H₁ corta B₁C₁, sobre esa horizontal.
          - con: marca
            traza: proy_planta(rama(solucion.H_ab, 1))
            rotulo: H₀
            bloque: Abatimiento de VBC
            porque: |
              H₀, donde el arco corta la horizontal de H₁.
          - con: compas
            traza: 'arco(solucion.mI, por: proy_planta(rama(solucion.I_ab, 1)), desde: desplaza(proy_planta(rama(solucion.I_ab, 1)), dy: -6), hasta: desplaza(proy_planta(rama(solucion.I_ab, 1)), dy: 6))'
            toma: segmento2(figura.punto("B2"), proy_alzado(solucion.I))
            bloque: Abatimiento de VBC
            porque: |
              B₂I₂, desde donde P₁Q₁ prolongada corta B₁C₁, sobre ella.
          - con: marca
            traza: proy_planta(rama(solucion.I_ab, 1))
            rotulo: I₀
            bloque: Abatimiento de VBC
            porque: |
              I₀, donde el arco corta la prolongación de P₁Q₁.
          - con: compas
            traza: 'arco(solucion.mI, por: proy_planta(rama(solucion.F_ab, 1)), desde: desplaza(proy_planta(rama(solucion.F_ab, 1)), dy: -6), hasta: desplaza(proy_planta(rama(solucion.F_ab, 1)), dy: 6))'
            toma: segmento2(figura.punto("B2"), proy_alzado(solucion.F))
            bloque: Abatimiento de VBC
            porque: |
              B₂F₂, desde el mismo punto de B₁C₁, sobre la misma recta: F está en la horizontal de Q₁, que es la de
              P₁Q₁.
          - con: marca
            traza: proy_planta(rama(solucion.F_ab, 1))
            rotulo: F₀
            bloque: Abatimiento de VBC
            porque: |
              F₀, donde el arco corta la prolongación de P₁Q₁, cerca de B₁C₁.
          - con: compas
            traza: 'arco(solucion.mJ, por: proy_planta(rama(solucion.J_ab, 1)), desde: desplaza(proy_planta(rama(solucion.J_ab, 1)), dy: -6), hasta: desplaza(proy_planta(rama(solucion.J_ab, 1)), dy: 6))'
            toma: segmento2(figura.punto("B2"), proy_alzado(solucion.J))
            bloque: Abatimiento de VBC
            porque: |
              B₂J₂, desde donde la horizontal de J₁ corta B₁C₁.
          - con: marca
            traza: proy_planta(rama(solucion.J_ab, 1))
            rotulo: J₀
            bloque: Abatimiento de VBC
            porque: |
              J₀, donde el arco corta la horizontal de J₁.
          - con: compas
            traza: 'arco(solucion.mK, por: proy_planta(rama(solucion.K_ab, 1)), desde: desplaza(proy_planta(rama(solucion.K_ab, 1)), dy: -6), hasta: desplaza(proy_planta(rama(solucion.K_ab, 1)), dy: 6))'
            toma: segmento2(figura.punto("B2"), proy_alzado(solucion.K))
            bloque: Abatimiento de VBC
            porque: |
              B₂K₂, desde donde la horizontal de K₁ corta B₁C₁.
          - con: marca
            traza: proy_planta(rama(solucion.K_ab, 1))
            rotulo: K₀
            bloque: Abatimiento de VBC
            porque: |
              K₀, donde el arco corta la horizontal de K₁.
          - con: compas
            traza: 'arco(solucion.mL, por: solucion.L0r, desde: desplaza(solucion.L0r, dy: -6), hasta: desplaza(solucion.L0r, dy: 6))'
            toma: segmento2(figura.punto("B2"), proy_alzado(solucion.L))
            bloque: Abatimiento de VBC
            porque: |
              B₂L₂, desde donde la horizontal de R₁ corta B₁C₁.
          - con: marca
            traza: solucion.L0r
            rotulo: L₀
            bloque: Abatimiento de VBC
            porque: |
              L₀, donde el arco corta la horizontal de R₁: L es de la arista VC.
          - con: regla
            traza: '[segmento2(proy_planta(rama(solucion.V_ab, 1)), figura.punto("B1")), segmento2(proy_planta(rama(solucion.V_ab, 1)), figura.punto("C1"))]'
            bloque: Abatimiento de VBC
            porque: |
              V₀B₁ y V₀C₁: las aristas VB y VC abatidas. B y C están en la charnela y no se mueven. H₀ e I₀ caen en
              V₀B₁, y J₀, K₀ y L₀ en V₀C₁: es la comprobación.
          - con: compas
            traza: 'arco(figura.punto("A2"), por: solucion.U2, desde: desplaza(solucion.U2, dy: -6), hasta: desplaza(solucion.U2, dy: 6))'
            toma: segmento2(figura.punto("V1"), figura.punto("A1"))
            bloque: Verdadera magnitud de VA
            porque: |
              **La verdadera magnitud de VA.** VA es de perfil: en el alzado mide V₂A₂, lo que baja, y en la planta
              V₁A₁, lo que avanza. Con el compás, V₁A₁, llevado desde A₂ sobre la base del alzado.
          - con: marca
            traza: solucion.U2
            rotulo: U₂
            bloque: Verdadera magnitud de VA
            porque: |
              U₂, donde el arco corta la base del alzado. V₂U₂ es la hipotenusa del triángulo rectángulo en A₂: la
              verdadera magnitud de VA, y también la de VD. Nombre nuestro.
          - con: compas
            traza: 'arco(figura.punto("B1"), por: solucion.A0r, desde: desplaza(solucion.A0r, dx: -6), hasta: desplaza(solucion.A0r, dx: 6))'
            toma: segmento2(figura.punto("A1"), figura.punto("B1"))
            bloque: Giros alrededor de VB y de VC
            porque: |
              **La vertiente de atrás.** Con el compás, en la planta, A₁B₁: AB es paralela a la línea de tierra y
              se ve en verdadera magnitud. Con centro en B₁, el arco por encima de V₀B₁.
          - con: compas
            traza: 'arco(proy_planta(rama(solucion.V_ab, 1)), por: solucion.A0r, desde: desplaza(solucion.A0r, dx: -6), hasta: desplaza(solucion.A0r, dx: 6))'
            toma: segmento2(figura.punto("V2"), solucion.U2)
            bloque: Giros alrededor de VB y de VC
            porque: |
              Con el compás, V₂U₂, la verdadera magnitud de VA; con centro en V₀, el arco que corta el anterior. Se
              cortan a los dos lados de V₀B₁: para el desarrollo, el de arriba, al otro lado de la vertiente de la
              derecha; el de abajo también da la vertiente en verdadera magnitud, pero doblada encima de la otra.
          - con: marca
            traza: solucion.A0r
            rotulo: A₀
            bloque: Giros alrededor de VB y de VC
            porque: |
              A₀, donde se cortan los dos arcos por encima de V₀B₁: A, con la vertiente de atrás girada alrededor
              de VB hasta el plano del desarrollo. A, B, C, D y V son nombres nuestros, como los del hueco.
          - con: compas
            traza: 'arco(figura.punto("C1"), por: solucion.D0r, desde: desplaza(solucion.D0r, dx: -6), hasta: desplaza(solucion.D0r, dx: 6))'
            toma: segmento2(figura.punto("D1"), figura.punto("C1"))
            bloque: Giros alrededor de VB y de VC
            porque: |
              **La vertiente de delante**, igual: con el compás, D₁C₁, que es CD en verdadera magnitud; con centro
              en C₁, el arco por debajo de V₀C₁.
          - con: compas
            traza: 'arco(proy_planta(rama(solucion.V_ab, 1)), por: solucion.D0r, desde: desplaza(solucion.D0r, dx: -6), hasta: desplaza(solucion.D0r, dx: 6))'
            toma: segmento2(figura.punto("V2"), solucion.U2)
            bloque: Giros alrededor de VB y de VC
            porque: |
              Con el compás, V₂U₂, que también es VD; con centro en V₀, el arco que corta el anterior. Para el
              desarrollo, el corte de abajo, al otro lado de V₀C₁; el de arriba dobla la vertiente encima de la de la
              derecha.
          - con: marca
            traza: solucion.D0r
            rotulo: D₀
            bloque: Giros alrededor de VB y de VC
            porque: |
              D₀, donde se cortan los dos arcos por debajo de V₀C₁.
          - con: regla
            traza: '[segmento2(proy_planta(rama(solucion.V_ab, 1)), solucion.A0r), segmento2(solucion.A0r, figura.punto("B1")), segmento2(proy_planta(rama(solucion.V_ab, 1)), solucion.D0r), segmento2(solucion.D0r, figura.punto("C1"))]'
            bloque: Giros alrededor de VB y de VC
            porque: |
              V₀A₀, A₀B₁, V₀D₀ y D₀C₁: los bordes de las vertientes de atrás y de delante en el desarrollo.
          - con: escuadra-cartabon
            traza: segmento2(solucion.I0r, solucion.L_E0)
            guia: segmento2(figura.punto("B1"), solucion.A0r)
            bloque: Giros alrededor de VB y de VC
            porque: |
              **E.** Por I₀, la paralela a B₁A₀, hacia el lado de A₀: EI es una horizontal de la vertiente de
              atrás, paralela a AB, y en el desarrollo sigue paralela a A₀B₁.
          - con: compas
            traza: 'arco(solucion.I0r, por: proy_planta(rama(solucion.E_ab, 1)), desde: uno(medir_sobre(perpendicular(por: proy_planta(rama(solucion.E_ab, 1)), a: solucion.parI), desde: proy_planta(rama(solucion.E_ab, 1)), distancia: 6), 1), hasta: uno(medir_sobre(perpendicular(por: proy_planta(rama(solucion.E_ab, 1)), a: solucion.parI), desde: proy_planta(rama(solucion.E_ab, 1)), distancia: 6), 2))'
            toma: segmento2(figura.punto("P1"), proy_planta(solucion.I))
            bloque: Giros alrededor de VB y de VC
            porque: |
              Con el compás, en la planta, P₁I₁, que es E₁I₁: EI es paralela a la línea de tierra y se ve en
              verdadera magnitud. Desde I₀, sobre la paralela.
          - con: marca
            traza: proy_planta(rama(solucion.E_ab, 1))
            rotulo: E₀
            bloque: Giros alrededor de VB y de VC
            porque: |
              E₀, donde el arco corta la paralela a B₁A₀ que sale de I₀.
          - con: escuadra-cartabon
            traza: segmento2(solucion.L0r, solucion.L_G0)
            guia: segmento2(figura.punto("C1"), solucion.D0r)
            bloque: Giros alrededor de VB y de VC
            porque: |
              **G.** Por L₀, la paralela a C₁D₀, hacia el lado de D₀: GL es una horizontal de la vertiente de
              delante, paralela a CD.
          - con: compas
            traza: 'arco(solucion.L0r, por: proy_planta(rama(solucion.G_ab, 1)), desde: uno(medir_sobre(perpendicular(por: proy_planta(rama(solucion.G_ab, 1)), a: solucion.parL), desde: proy_planta(rama(solucion.G_ab, 1)), distancia: 6), 1), hasta: uno(medir_sobre(perpendicular(por: proy_planta(rama(solucion.G_ab, 1)), a: solucion.parL), desde: proy_planta(rama(solucion.G_ab, 1)), distancia: 6), 2))'
            toma: segmento2(figura.punto("R1"), solucion.Lp)
            bloque: Giros alrededor de VB y de VC
            porque: |
              R₁L₁, que es G₁L₁, en verdadera magnitud en la planta. Desde L₀, sobre la paralela.
          - con: marca
            traza: proy_planta(rama(solucion.G_ab, 1))
            rotulo: G₀
            bloque: Giros alrededor de VB y de VC
            porque: |
              G₀, donde el arco corta la paralela a C₁D₀ que sale de L₀.
          - con: regla
            traza: '[segmento2(proy_planta(rama(solucion.F_ab, 1)), proy_planta(rama(solucion.K_ab, 1))), segmento2(proy_planta(rama(solucion.K_ab, 1)), proy_planta(rama(solucion.G_ab, 1))), segmento2(proy_planta(rama(solucion.G_ab, 1)), proy_planta(rama(solucion.J_ab, 1))), segmento2(proy_planta(rama(solucion.J_ab, 1)), proy_planta(rama(solucion.H_ab, 1))), segmento2(proy_planta(rama(solucion.H_ab, 1)), proy_planta(rama(solucion.E_ab, 1)))]'
            porque: |
              El hueco de la chimenea en el desarrollo: E₀I₀ y I₀F₀ ya están sobre las rectas trazadas; faltan F₀K₀,
              K₀G₀, G₀J₀, J₀H₀ y H₀E₀. Es un solo polígono, que cruza las aristas VB y VC.
        pista: |
          (1) Sube H₁, I₁, J₁, K₁, L₁ y Q₁ a V₂B₂. (2) Por V₁, H₁, J₁, K₁ y P₁Q₁, las horizontales hacia la derecha;
          en cada una, desde B₁C₁, lo que su punto dista de B₂ en V₂B₂: V₀, H₀, I₀, F₀, J₀, K₀ y L₀. (3) V₁A₁ sobre la
          base del alzado da U₂, y V₂U₂ es la verdadera magnitud de VA y de VD. (4) A₀: arcos de B₁ (A₁B₁) y de V₀
          (V₂U₂); D₀: de C₁ (D₁C₁) y de V₀. (5) E₀, en la paralela a B₁A₀ por I₀, a P₁I₁; G₀, en la paralela a C₁D₀
          por L₀, a R₁L₁.
        desarrollo: |
          En verde claro, el desarrollo de la cubierta: la vertiente de la derecha, V₀B₁C₁, y las otras dos, V₀A₀B₁
          y V₀D₀C₁, con el hueco de la chimenea, E₀I₀F₀K₀G₀J₀H₀, que cruza las aristas VB y VC. Cada vertiente queda
          en verdadera magnitud, recortada por el hueco: la de atrás pierde la muesca E₀H₀I₀, la de delante la
          J₀G₀K₀, y la de la derecha queda partida en dos, la punta V₀H₀J₀ y el resto.

      - tipo: calcular
        titulo: La longitud real de JG
        pregunta: Como pregunta nuestra, ¿cuánto mide de verdad JG, el borde del hueco en la vertiente de delante que va por la cara RP de la chimenea?
        respuesta:
          tipo: numero
          valor: '29.16'
          receta: jg_mm
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '27.05'
            receta: en_mm(vm_alzado(solucion.J, solucion.G))
            mensaje: |
              Eso es **J₂G₂, en el alzado**. JG avanza hacia quien mira mientras baja, y el alzado lo acorta. En
              verdadera magnitud es J₀G₀, en el desarrollo.
          - valor: '12.56'
            receta: en_mm(vm_planta(solucion.J, solucion.G))
            mensaje: |
              Eso es **J₁G₁, en la planta**, que acorta mucho: JG baja 26,3 mm de J a G.
        pista: |
          Mide J₀G₀ con «medir» del Taller, en el paso anterior, o en tu lámina de papel.
        desarrollo: |
          JG está en la vertiente de delante, y su verdadera magnitud es la de cualquier segmento: la hipotenusa
          de su planta y de lo que baja.

          $$ \overline{JG} = \sqrt{\overline{J_1G_1}^{\,2} + \Delta z^{2}} = \sqrt{12{,}56^{2} + 26{,}32^{2}} \approx 29{,}16 \text{ mm} $$

          Es lo que mide J₀G₀ en el desarrollo. Algunos trozos de rectas del dibujo miden por casualidad casi lo
          mismo, y no son JG: L₁L₀, sobre la horizontal de R₁, 29,02 mm, y cada vertical de la construcción entre la
          base del alzado y la recta de P₁Q₁, 29,29 mm.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: La vertiente de la derecha es de canto, así que F, H, I, J y K tienen su alzado en V₂B₂, en la vertical de su planta.
          - texto: E y G están en vertientes que no son de canto, y salen de la horizontal de su vertiente que pasa por ellos, cortada con VB o con VC.
          - texto: En el alzado, la vertiente de delante tapa lo que la chimenea tiene detrás de ella, y eso va a trazos.
          - texto: En el desarrollo, la vertiente de la derecha se abate sobre su alero, y cada punto se aparta de B₁C₁ lo que dista de B₂ sobre V₂B₂.
          - texto: Las otras dos vertientes giran alrededor de VB y de VC hasta el desarrollo, y A₀ y D₀ salen con dos arcos cada uno.
          - texto: E está donde la arista P cruza V₂B₂ en el alzado, porque ahí la chimenea toca la cubierta.
            trampa: true
            mensaje: |
              Ese cruce es aparente: ahí la arista P pasa por detrás de la arista VC, 15,1 mm más lejos de quien
              mira, sin tocarla. E está en la vertiente de atrás, más abajo, a la altura de I₂.
    resolucion: |
      **Qué hay.** Una cubierta de tres vertientes con el vértice V encima del punto medio del lado izquierdo
      del cuadrado (la cuarta cara, VDA, es la pared vertical de la torre), y una chimenea de planta
      triangular, vertical, que la atraviesa. La vertiente de la derecha, VBC, es de canto: su alzado es la
      recta V₂B₂. Las de atrás y de delante contienen rectas paralelas a la línea de tierra.

      **La intersección.** En la planta, la chimenea va por encima y la intersección son los lados de su
      triángulo. En el alzado, F, H, I, J y K están en la vertiente de la derecha y suben en vertical a V₂B₂. E, en
      la arista P y en la vertiente de atrás, está a la altura de I, porque P₁Q₁ es la horizontal de esa
      vertiente que pasa por P; G, en la arista R y en la vertiente de delante, a la de L, donde la horizontal
      de R₁ corta V₁C₁. La intersección es la línea cerrada EIFKGJH. Con las piezas opacas, la vertiente de
      delante tapa la arista P desde V₂B₂ y la intersección con la vertiente de atrás, H₂E₂I₂, y la chimenea
      tapa VB entre I₂ y K₂; lo de delante, J₂G₂K₂ y las aristas Q y R, se ve.

      **El desarrollo.** La vertiente de la derecha se abate sobre el plano horizontal de su alero: cada punto
      se aparta de B₁C₁, por su horizontal, lo que dista de B₂ sobre V₂B₂. Las de atrás y de delante giran
      alrededor de VB y de VC hasta quedar a su lado: A₀ y D₀ salen con arcos de AB y CD, que se ven en
      verdadera magnitud en la planta, y de V₂U₂, la verdadera magnitud de VA y de VD; E₀ y G₀, por las
      horizontales de sus vertientes. El hueco es el polígono E₀I₀F₀K₀G₀J₀H₀. JG mide 12,56 mm en la planta,
      27,05 en el alzado y 29,16 en verdadera magnitud.

  - id: sd42-el-prisma-triangular-que-atraviesa-la-piramide
    titulo: El prisma triangular que atraviesa la pirámide, y sus dos poligonales
    fuente: Ejercicio 30 (SD42) · Colección de ejercicios de Geometría Descriptiva, Sistema Diédrico Directo · Dpto. de Expresión Gráfica y Proyectos de Ingeniería, EIG · UPV/EHU
    nivel: practica
    # Decisión: el texto impreso tal cual, cotejado con la página (pág. 31). La
    # lámina no rotula nada: todos los nombres son nuestros, y se añaden a la
    # lámina como puntos sin marca (lo dice su revisión). Las aristas del
    # prisma son de punta, así que en el alzado todo cae en el contorno del
    # triángulo, y lo que hay que construir está en la planta. Los dos sólidos
    # se leen como una sola pieza maciza, como en el apartado 1 a del Ejercicio
    # 54: lo que de una arista queda dentro del otro no se dibuja.
    enunciado: |
      A través de las proyecciones diédricas incompletas se insinúa que un prisma de sección
      triangular atraviesa una pirámide. Representar la intersección que genera el prisma en la
      pirámide.

      **Notas nuestras.** La figura es el alzado, arriba, y la planta, debajo, sin línea de tierra.
      La hoja no da escala: las longitudes van en milímetros de la lámina. No rotula nada; los nombres
      son nuestros. La pirámide tiene el vértice V y la base horizontal ABC: A, el vértice de la base
      de la izquierda; B, el de delante, que en la planta es el de abajo, y C, el de la derecha. El
      prisma tiene sus tres aristas de punta, perpendiculares al plano vertical: en el alzado se ven
      como los vértices del triángulo, D₂ abajo a la izquierda, E₂ arriba y F₂ a la derecha, y en la
      planta como tres rectas verticales del papel. Llamamos D, E y F a sus extremos de atrás, los de
      arriba en la planta, y D′, E′ y F′ a los de delante. Lo incompleto es la planta, donde el prisma
      solo trae sus dos extremos y el arranque de cada arista; el alzado ya está entero, con V₂B₂
      cortada donde VB va por dentro del prisma.

      Leemos los dos sólidos como una sola pieza maciza y opaca: lo que de una arista queda dentro
      del otro sólido no se dibuja, y con los sólidos transparentes todo iría en continua. Con los
      dos sólidos por separado, cada uno entero, esos trozos irían a trazos, y lo demás no
      cambiaría. Por eso, en tu lámina de papel, V₁B₁, que viene entera, se borra entre los dos
      puntos donde VB entra en el prisma y sale de él. G, H, I, J, K, L, M, N y los puntos 1 a 3 de
      la construcción también son nombres nuestros.
    pide: Los ocho puntos de la intersección en la planta, las dos poligonales que forman, y qué se ve y qué se oculta de ellas y de las aristas de los dos sólidos; y, como pregunta nuestra, cuánto mide de verdad el trozo de VB que queda dentro del prisma.
    receta:
      lamina: sd42
      escena:
        V: 'punto3(alzado: figura.punto("V2"), planta: figura.punto("V1"))'
        A: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("A1"))'
        B: 'punto3(alzado: figura.punto("B2"), planta: figura.punto("B1"))'
        C: 'punto3(alzado: figura.punto("C2"), planta: figura.punto("C1"))'
        D: 'punto3(alzado: figura.punto("D2"), planta: figura.punto("D1"))'
        E: 'punto3(alzado: figura.punto("E2"), planta: figura.punto("E1"))'
        F: 'punto3(alzado: figura.punto("F2"), planta: figura.punto("F1"))'
        Dp: 'punto3(alzado: figura.punto("D2"), planta: figura.punto("D1p"))'
        Ep: 'punto3(alzado: figura.punto("E2"), planta: figura.punto("E1p"))'
        Fp: 'punto3(alzado: figura.punto("F2"), planta: figura.punto("F1p"))'
        vab: plano(V, A, B)
        vbc: plano(V, B, C)
        vca: plano(V, C, A)
        de: plano(D, E, Dp)
        fd: plano(F, D, Fp)
      solucion:
        # La entrada, por delante: DD′ por la cara VAB (G), EE′ y FF′ por la VBC
        # (H e I), y la arista VB, que atraviesa el prisma, por sus caras DE (M)
        # y FD (N). La salida, por detrás, las tres por la cara VCA (J, K y L).
        # Dos poligonales: G M H I N, de cinco puntos, y J K L.
        G: corte_recta_plano(recta3(D, Dp), vab)
        H: corte_recta_plano(recta3(E, Ep), vbc)
        I: corte_recta_plano(recta3(F, Fp), vbc)
        J: corte_recta_plano(recta3(D, Dp), vca)
        K: corte_recta_plano(recta3(E, Ep), vca)
        L: corte_recta_plano(recta3(F, Fp), vca)
        M: corte_recta_plano(recta3(V, B), de)
        N: corte_recta_plano(recta3(V, B), fd)
        mn_mm: en_mm(vm(M, N))
        # Decisión: cada arista del prisma es horizontal, y su plano auxiliar es
        # el horizontal que la contiene: corta la pirámide en un triángulo
        # semejante a la base, con los lados paralelos a los de la base. Basta un
        # vértice suyo, el que está en los dos lados que corta la arista: para
        # DD′, el de VA (1), porque entra por VAB y sale por VCA; para EE′ y FF′,
        # el de VC (2 y 3), porque entran por VBC y salen por VCA. Por él, las
        # paralelas a los dos lados de la base.
        s1_2: 'cruce_aparente(segmento2(figura.punto("D2"), desplaza(figura.punto("D2"), dx: -10)), figura.segmento("VA2"))'
        s2_2: 'cruce_aparente(segmento2(figura.punto("E2"), desplaza(figura.punto("E2"), dx: 10)), figura.segmento("VC2"))'
        s3_2: 'cruce_aparente(segmento2(figura.punto("F2"), desplaza(figura.punto("F2"), dx: 10)), figura.segmento("VC2"))'
        s1_1: 'cruce_aparente(segmento2(s1_2, desplaza(s1_2, dy: 10)), figura.segmento("VA1"))'
        s2_1: 'cruce_aparente(segmento2(s2_2, desplaza(s2_2, dy: 10)), figura.segmento("VC1"))'
        s3_1: 'cruce_aparente(segmento2(s3_2, desplaza(s3_2, dy: 10)), figura.segmento("VC1"))'
        # Los errores: el cruce de la planta de la arista con el contorno de la
        # base (como si la arista fuera a la altura de la base), y los cruces
        # aparentes de EE′ y FF′ con V₁C₁, que pasa por encima del prisma.
        H1mal: 'cruce_aparente(segmento2(figura.punto("E1"), figura.punto("E1p")), figura.segmento("BC1"))'
        K1mal: 'cruce_aparente(segmento2(figura.punto("E1"), figura.punto("E1p")), figura.segmento("CA1"))'
        EVC1: 'cruce_aparente(segmento2(figura.punto("E1"), figura.punto("E1p")), figura.segmento("VC1"))'
        FVC1: 'cruce_aparente(segmento2(figura.punto("F1"), figura.punto("F1p")), figura.segmento("VC1"))'
        # La visibilidad: los cruces aparentes de la planta donde un lado de la
        # base pasa de visto a oculto bajo el prisma (k_<lado>_<arista>1). Son
        # también los errores de G, J, I y L.
        k_AB_D1: 'cruce_aparente(figura.segmento("AB1"), segmento2(figura.punto("D1"), figura.punto("D1p")))'
        k_BC_F1: 'cruce_aparente(figura.segmento("BC1"), segmento2(figura.punto("F1"), figura.punto("F1p")))'
        k_CA_F1: 'cruce_aparente(figura.segmento("CA1"), segmento2(figura.punto("F1"), figura.punto("F1p")))'
        k_CA_D1: 'cruce_aparente(figura.segmento("CA1"), segmento2(figura.punto("D1"), figura.punto("D1p")))'
        # Los extremos de las rectas largas.
        L_s1_2: 'desplaza(s1_2, dx: mm(-4))'
        L_s2_2: 'desplaza(s2_2, dx: mm(4))'
        L_s3_2: 'desplaza(s3_2, dx: mm(4))'
        L_s1_1: 'desplaza(s1_1, dy: mm(4))'
        L_s2_1: 'desplaza(s2_1, dy: mm(4))'
        L_s3_1: 'desplaza(s3_1, dy: mm(4))'
        L_G: 'uno(medir_sobre(segmento2(s1_1, proy_planta(G)), desde: proy_planta(G), distancia: mm(4)), 1)'
        L_J: 'uno(medir_sobre(segmento2(s1_1, proy_planta(J)), desde: proy_planta(J), distancia: mm(4)), 1)'
        L_H: 'uno(medir_sobre(segmento2(s2_1, proy_planta(H)), desde: proy_planta(H), distancia: mm(4)), 1)'
        L_K: 'uno(medir_sobre(segmento2(s2_1, proy_planta(K)), desde: proy_planta(K), distancia: mm(4)), 1)'
        L_I: 'uno(medir_sobre(segmento2(s3_1, proy_planta(I)), desde: proy_planta(I), distancia: mm(4)), 1)'
        L_L: 'uno(medir_sobre(segmento2(s3_1, proy_planta(L)), desde: proy_planta(L), distancia: mm(4)), 1)'
        L_M: 'desplaza(proy_planta(M), dy: mm(4))'
        L_N: 'desplaza(proy_planta(N), dy: mm(4))'
      comprueba:
        - en_plano(G, de)
        - en_plano(G, fd)
        - en_plano(H, de)
        - en_plano(K, vca)
        - en_plano(M, vab)
        - en_plano(M, vbc)
        - en_plano(N, vab)
        - en_recta(N, recta3(V, B))
    pasos:
      - tipo: reconocer
        pregunta: Las aristas del prisma son de punta, y en el alzado se ven como los puntos D₂, E₂ y F₂. ¿Cómo se busca en la planta dónde entra cada una en la pirámide y dónde sale?
        opciones:
          - texto: Donde la planta de la arista cruza el contorno de la base, A₁B₁C₁
            mensaje: |
              Ese sería el corte si la arista fuera a la altura de la base, y va más arriba, donde la
              pirámide es más estrecha. DD′, por ejemplo, cruza A₁B₁ 6,5 mm por encima de AB, sin tocarla,
              y entra en la pirámide 5,1 mm más atrás.
          - texto: Con el plano horizontal de la arista, que corta la pirámide en un triángulo de lados paralelos a los de la base; la planta de la arista corta ese triángulo en la entrada y en la salida
            correcta: true
            mensaje: |
              Eso es. Cada arista es horizontal, y su plano horizontal corta las aristas laterales de la
              pirámide a su altura: en la planta, un triángulo semejante a la base, con los lados
              paralelos. Donde la planta de la arista corta ese triángulo están la entrada, por una cara de
              delante, y la salida, por la de atrás.
          - texto: Donde la planta de la arista cruza las aristas de la pirámide, como D₁D′₁ cruza V₁A₁
            mensaje: |
              Esos son cruces aparentes: ahí VA pasa 6,1 mm por encima de DD′, sin tocarla. Aquí cada arista
              del prisma solo toca la pirámide donde atraviesa una de sus caras, y un cruce aparente no lo dice.

      - tipo: construir
        titulo: Las dos poligonales, en la planta, y lo que se ve
        intro: |
          Primero, completa en la planta las tres aristas del prisma, de D₁ a D′₁, de E₁ a E′₁ y de F₁ a
          F′₁, con trazo fino: luego solo se pasa a limpio lo que queda fuera de la pirámide.

          Cada arista es horizontal, y su plano auxiliar es el horizontal que la contiene: en el alzado,
          la paralela a la base por D₂, E₂ o F₂. Corta la pirámide en un triángulo semejante a la base,
          con un vértice en cada arista lateral y los lados paralelos a los de la base. Basta un vértice:
          para DD′, el de V₂A₂, que llamamos 1; para EE′ y FF′, los de V₂C₂, 2 y 3. Bájalos a V₁A₁ y V₁C₁,
          y por cada uno traza las paralelas a los dos lados de la base que corta la arista: DD′ entra
          por VAB y sale por VCA; EE′ y FF′ entran por VBC y salen por VCA. Llamamos G, H e I a las
          entradas de DD′, EE′ y FF′, y J, K y L a sus salidas. VB atraviesa el prisma: entra por su
          cara DE, en M, y sale por la FD, en N, que en el alzado son los dos extremos del hueco de V₂B₂;
          bájalos a V₁B₁.

          Por último, pasa a limpio con «arista vista» y «arista oculta» las dos poligonales, G M H I N y
          J K L, las aristas del prisma fuera de la pirámide, VB y los lados de la base que pasan bajo el
          prisma. VA y VC se ven enteras, y el alzado ya está completo. Leemos los dos sólidos como una
          sola pieza: lo que de una arista queda dentro del otro no se dibuja. Hay cortes muy juntos: J₁
          cae a 1,9 mm de donde D₁D′₁ cruza V₁A₁ y a 2,1 mm de donde cruza C₁A₁, y L₁ a 1,7 mm de donde la
          vertical de 2₂ cruza la paralela que sale de 3₁. Amplía con la lupa (×4).
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, medir, visto, oculto, borrar]
        tolerancia: 1
        objetivos:
          - nombre: G1
            pide: G, donde la arista DD′ entra en la pirámide, por la cara VAB, en la planta
            es: proy_planta(solucion.G)
            bien: |
              G₁ está en D₁D′₁, donde la corta la paralela a A₁B₁ que pasa por 1₁: el lado de la sección
              horizontal de la pirámide, a la altura de D, que va por la cara VAB.
            diagnosticos:
              - si: cerca_de(solucion.k_AB_D1)
                mensaje: |
                  Estás donde D₁D′₁ cruza A₁B₁, el contorno de la base. Ese sería el corte si DD′ fuera a la
                  altura de la base, y va 6,5 mm más arriba, donde la pirámide es más estrecha. Corta con el
                  plano horizontal de la arista: la paralela a A₁B₁ por 1₁.
                ejemplo: solucion.k_AB_D1
              - si: cerca_de(proy_planta(solucion.J))
                mensaje: |
                  Ese es J₁, por donde DD′ sale de la pirámide, por la cara de atrás, VCA. G es la entrada, por
                  la cara VAB: más adelante, en la planta más abajo.
                ejemplo: proy_planta(solucion.J)
              - si: '!en_recta(segmento2(figura.punto("D1"), figura.punto("D1p")))'
                mensaje: |
                  G es un punto de la arista DD′: G₁ va **en su planta**, la vertical que une D₁ con D′₁.
                ejemplo: 'desplaza(proy_planta(solucion.G), dx: mm(5))'
              - si: siempre
                mensaje: |
                  Estás en D₁D′₁, pero no en el corte. La paralela a la base por D₂ corta V₂A₂ en 1₂; bájalo a
                  V₁A₁, y la paralela a A₁B₁ por 1₁ corta D₁D′₁ en G₁.
          - nombre: J1
            pide: J, donde DD′ sale de la pirámide, por la cara VCA, en la planta
            es: proy_planta(solucion.J)
            bien: |
              J₁ está en D₁D′₁, donde la corta la paralela a A₁C₁ que pasa por 1₁: el lado de la misma sección
              que va por la cara VCA.
            diagnosticos:
              - si: cerca_de(solucion.k_CA_D1)
                mensaje: |
                  Estás donde D₁D′₁ cruza C₁A₁, el contorno de la base: a esa altura la pirámide es más ancha
                  que a la de DD′. La salida está en la paralela a A₁C₁ por 1₁, 2,1 mm más adelante.
                ejemplo: solucion.k_CA_D1
              - si: cerca_de(proy_planta(solucion.G))
                mensaje: |
                  Ese es G₁, la entrada de DD′. J es la salida, por la cara de atrás, VCA.
                ejemplo: proy_planta(solucion.G)
              - si: '!en_recta(segmento2(figura.punto("D1"), figura.punto("D1p")))'
                mensaje: |
                  J es un punto de la arista DD′: J₁ va **en D₁D′₁**.
                ejemplo: 'desplaza(proy_planta(solucion.J), dx: mm(-5))'
              - si: siempre
                mensaje: |
                  Estás en D₁D′₁, pero no en el corte: J₁ está donde la corta la paralela a A₁C₁ que pasa por 1₁.
          - nombre: H1
            pide: H, donde la arista EE′ entra en la pirámide, por la cara VBC, en la planta
            es: proy_planta(solucion.H)
            bien: |
              H₁ está en E₁E′₁, donde la corta la paralela a C₁B₁ que pasa por 2₁: el lado de la sección
              horizontal a la altura de E que va por la cara VBC.
            diagnosticos:
              - si: cerca_de(solucion.H1mal)
                mensaje: |
                  Estás donde E₁E′₁ cruza B₁C₁, el contorno de la base. EE′ es la arista más alta del prisma, y a
                  su altura la pirámide es mucho más estrecha: corta con la paralela a C₁B₁ por 2₁.
                ejemplo: solucion.H1mal
              - si: cerca_de(solucion.EVC1)
                mensaje: |
                  Ese es el cruce aparente de E₁E′₁ con V₁C₁: VC pasa ahí 20,5 mm por encima de EE′, sin tocarla.
                  H₁ está más adelante, en la paralela a C₁B₁ por 2₁.
                ejemplo: solucion.EVC1
              - si: cerca_de(proy_planta(solucion.K))
                mensaje: |
                  Ese es K₁, la salida de EE′ por la cara de atrás. H es la entrada, por la cara VBC.
                ejemplo: proy_planta(solucion.K)
              - si: '!en_recta(segmento2(figura.punto("E1"), figura.punto("E1p")))'
                mensaje: |
                  H es un punto de la arista EE′: H₁ va **en E₁E′₁**.
                ejemplo: 'desplaza(proy_planta(solucion.H), dx: mm(5))'
              - si: siempre
                mensaje: |
                  Estás en E₁E′₁, pero no en el corte. La paralela a la base por E₂ corta V₂C₂ en 2₂; bájalo a
                  V₁C₁, y la paralela a C₁B₁ por 2₁ corta E₁E′₁ en H₁.
          - nombre: K1
            pide: K, donde EE′ sale de la pirámide, por la cara VCA, en la planta
            es: proy_planta(solucion.K)
            bien: |
              K₁ está en E₁E′₁, donde la corta la paralela a C₁A₁ que pasa por 2₁.
            diagnosticos:
              - si: cerca_de(solucion.K1mal)
                mensaje: |
                  Estás donde E₁E′₁ cruza C₁A₁, el contorno de la base. A la altura de EE′ la pirámide es más
                  estrecha: la salida está en la paralela a C₁A₁ por 2₁.
                ejemplo: solucion.K1mal
              - si: cerca_de(proy_planta(solucion.H))
                mensaje: |
                  Ese es H₁, la entrada de EE′. K es la salida, por la cara de atrás, VCA.
                ejemplo: proy_planta(solucion.H)
              - si: '!en_recta(segmento2(figura.punto("E1"), figura.punto("E1p")))'
                mensaje: |
                  K es un punto de la arista EE′: K₁ va **en E₁E′₁**.
                ejemplo: 'desplaza(proy_planta(solucion.K), dx: mm(-5))'
              - si: siempre
                mensaje: |
                  Estás en E₁E′₁, pero no en el corte: K₁ está donde la corta la paralela a C₁A₁ que pasa por 2₁.
          - nombre: I1
            pide: I, donde la arista FF′ entra en la pirámide, por la cara VBC, en la planta
            es: proy_planta(solucion.I)
            bien: |
              I₁ está en F₁F′₁, donde la corta la paralela a C₁B₁ que pasa por 3₁.
            diagnosticos:
              - si: cerca_de(solucion.k_BC_F1)
                mensaje: |
                  Estás donde F₁F′₁ cruza B₁C₁, el contorno de la base. FF′ va 15,0 mm más arriba, donde la
                  pirámide es más estrecha: corta con la paralela a C₁B₁ por 3₁.
                ejemplo: solucion.k_BC_F1
              - si: cerca_de(proy_planta(solucion.L))
                mensaje: |
                  Ese es L₁, la salida de FF′ por la cara de atrás. I es la entrada, por la cara VBC.
                ejemplo: proy_planta(solucion.L)
              - si: '!en_recta(segmento2(figura.punto("F1"), figura.punto("F1p")))'
                mensaje: |
                  I es un punto de la arista FF′: I₁ va **en F₁F′₁**.
                ejemplo: 'desplaza(proy_planta(solucion.I), dx: mm(5))'
              - si: siempre
                mensaje: |
                  Estás en F₁F′₁, pero no en el corte. La paralela a la base por F₂ corta V₂C₂ en 3₂; bájalo a
                  V₁C₁, y la paralela a C₁B₁ por 3₁ corta F₁F′₁ en I₁.
          - nombre: L1
            pide: L, donde FF′ sale de la pirámide, por la cara VCA, en la planta
            es: proy_planta(solucion.L)
            bien: |
              L₁ está en F₁F′₁, donde la corta la paralela a C₁A₁ que pasa por 3₁. J₁K₁L₁ es la planta de la
              poligonal de salida: un triángulo, porque las tres aristas salen por la misma cara.
            diagnosticos:
              - si: cerca_de(solucion.k_CA_F1)
                mensaje: |
                  Estás donde F₁F′₁ cruza C₁A₁, el contorno de la base. La salida está a la altura de FF′, en la
                  paralela a C₁A₁ por 3₁.
                ejemplo: solucion.k_CA_F1
              - si: cerca_de(solucion.FVC1)
                mensaje: |
                  Ese es el cruce aparente de F₁F′₁ con V₁C₁: VC pasa ahí 22,4 mm por encima de FF′, sin tocarla.
                ejemplo: solucion.FVC1
              - si: cerca_de(proy_planta(solucion.I))
                mensaje: |
                  Ese es I₁, la entrada de FF′. L es la salida, por la cara de atrás, VCA.
                ejemplo: proy_planta(solucion.I)
              - si: '!en_recta(segmento2(figura.punto("F1"), figura.punto("F1p")))'
                mensaje: |
                  L es un punto de la arista FF′: L₁ va **en F₁F′₁**.
                ejemplo: 'desplaza(proy_planta(solucion.L), dx: mm(-5))'
              - si: siempre
                mensaje: |
                  Estás en F₁F′₁, pero no en el corte: L₁ está donde la corta la paralela a C₁A₁ que pasa por 3₁.
          - nombre: M1
            pide: M, donde la arista VB entra en el prisma, por su cara DE, en la planta
            es: proy_planta(solucion.M)
            bien: |
              M₁ está en V₁B₁, en la vertical de M₂, el extremo de arriba del hueco de V₂B₂. Como el prisma es
              de punta, su cara DE se ve en el alzado como D₂E₂, y VB la atraviesa donde V₂B₂ la cruza.
            diagnosticos:
              - si: cerca_de(proy_planta(solucion.N))
                mensaje: |
                  Ese es N₁, por donde VB sale del prisma, por la cara de abajo. M es la entrada, por la cara DE:
                  baja el extremo de arriba del hueco de V₂B₂.
                ejemplo: proy_planta(solucion.N)
              - si: '!en_vertical_de(proy_alzado(solucion.M))'
                mensaje: |
                  M₁ va en la **vertical de M₂**, el punto donde V₂B₂ cruza D₂E₂: el extremo de arriba del hueco
                  de V₂B₂.
                ejemplo: 'desplaza(proy_planta(solucion.M), dx: mm(5))'
              - si: siempre
                mensaje: |
                  Estás en la vertical de M₂, pero no en V₁B₁: M está en la arista VB.
          - nombre: N1
            pide: N, donde VB sale del prisma, por su cara FD, en la planta
            es: proy_planta(solucion.N)
            bien: |
              N₁ está en V₁B₁, en la vertical de N₂, el extremo de abajo del hueco de V₂B₂: ahí V₂B₂ cruza
              F₂D₂, la cara de abajo del prisma vista de canto.
            diagnosticos:
              - si: cerca_de(proy_planta(solucion.M))
                mensaje: |
                  Ese es M₁, la entrada de VB en el prisma. N es la salida, por la cara de abajo: baja el extremo
                  de abajo del hueco de V₂B₂.
                ejemplo: proy_planta(solucion.M)
              - si: '!en_vertical_de(proy_alzado(solucion.N))'
                mensaje: |
                  N₁ va en la **vertical de N₂**, donde V₂B₂ cruza F₂D₂.
                ejemplo: 'desplaza(proy_planta(solucion.N), dx: mm(-5))'
              - si: siempre
                mensaje: |
                  Estás en la vertical de N₂, pero no en V₁B₁: N está en la arista VB.
        # Decisión: los dos sólidos, una sola pieza maciza (lo dicen las Notas
        # nuestras): lo que de una arista queda dentro del otro no se dibuja,
        # como en el apartado 1 a del Ejercicio 54. La visibilidad sale de
        # KIT\visibilidad.mjs (rayos contra las cuatro caras de la pirámide y las
        # cinco del prisma, vis\sd42), con cada arista partida donde entra en el
        # otro sólido. Todos los tramos son de la planta: en el alzado, las
        # poligonales caen encima del contorno del triángulo D₂E₂F₂, que es el
        # extremo de delante del prisma, y lo demás ya está dibujado como va. VA
        # y VC se ven enteras en la planta y ya están; V₁B₁ y los lados de la
        # base cambian.
        tramos:
          - traza: segmento2(figura.punto("D1"), proy_planta(solucion.J))
            tipo: visto
            porque: 'De D₁ a J₁, DD′ va por fuera de la pirámide, detrás de ella y por encima de su cara VCA, y es borde de la planta del prisma: desde arriba nada la tapa.'
          - traza: segmento2(proy_planta(solucion.G), figura.punto("D1p"))
            tipo: visto
            porque: 'De G₁ a D′₁, DD′ sale por la cara VAB, que baja hacia delante por debajo de ella: desde arriba nada la tapa.'
          - traza: segmento2(figura.punto("E1"), proy_planta(solucion.K))
            tipo: visto
            porque: 'EE′ es la arista de arriba del prisma: de E₁ a K₁, por detrás de la pirámide, nada le pasa por encima.'
          - traza: segmento2(proy_planta(solucion.H), figura.punto("E1p"))
            tipo: visto
            porque: 'De H₁ a E′₁, EE′ sale por la cara VBC, que baja hacia delante: nada le pasa por encima.'
          - traza: segmento2(figura.punto("F1"), proy_planta(solucion.L))
            tipo: visto
            porque: 'De F₁ a L₁, FF′ va por fuera de la pirámide, detrás de ella, y es borde de la planta del prisma: desde arriba nada la tapa.'
          - traza: segmento2(proy_planta(solucion.I), figura.punto("F1p"))
            tipo: visto
            porque: 'De I₁ a F′₁, FF′ sale por la cara VBC, que baja hacia delante por debajo de ella: nada la tapa.'
          - traza: segmento2(proy_planta(solucion.G), proy_planta(solucion.M))
            tipo: visto
            porque: 'GM está en la cara DE del prisma y en la VAB de la pirámide, que miran las dos hacia arriba: desde arriba nada lo tapa.'
          - traza: segmento2(proy_planta(solucion.M), proy_planta(solucion.H))
            tipo: visto
            porque: 'MH está en la cara DE del prisma y en la VBC de la pirámide, que miran las dos hacia arriba: nada lo tapa.'
          - traza: segmento2(proy_planta(solucion.H), proy_planta(solucion.I))
            tipo: visto
            porque: 'HI está en la cara EF del prisma y en la VBC, que miran las dos hacia arriba: nada lo tapa.'
          - traza: segmento2(proy_planta(solucion.I), proy_planta(solucion.N))
            tipo: oculto
            porque: 'IN está en la cara FD, la de abajo del prisma: desde arriba la tapan sus caras DE y EF.'
          - traza: segmento2(proy_planta(solucion.N), proy_planta(solucion.G))
            tipo: oculto
            porque: 'NG está en la cara FD, la de abajo: desde arriba la tapa la cara DE del propio prisma.'
          - traza: segmento2(proy_planta(solucion.J), proy_planta(solucion.K))
            tipo: visto
            porque: 'JK está en la cara DE del prisma y en la VCA de la pirámide, que miran las dos hacia arriba: nada lo tapa.'
          - traza: segmento2(proy_planta(solucion.K), proy_planta(solucion.L))
            tipo: visto
            porque: 'KL está en la cara EF del prisma y en la VCA: nada lo tapa.'
          - traza: segmento2(proy_planta(solucion.L), proy_planta(solucion.J))
