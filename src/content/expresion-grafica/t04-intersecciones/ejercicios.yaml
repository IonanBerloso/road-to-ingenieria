          - con: marca
            traza: proy_planta(solucion.i2)
            rotulo: 2₁
            porque: |
              2₁, donde L₁Q₁ cruza la paralela por T₁: LQ y esa horizontal están las dos a la cota del fondo, y se
              cortan de verdad.
          - con: marca
            traza: proy_planta(solucion.i3)
            rotulo: 3₁
            porque: |
              3₁, donde M₁R₁ cruza la paralela por T₁.
          - con: marca
            traza: proy_planta(solucion.i6)
            rotulo: 6₁
            porque: |
              6₁, donde L₁Q₁ cruza la paralela por U₁.
          - con: marca
            traza: proy_planta(solucion.i7)
            rotulo: 7₁
            porque: |
              7₁, donde M₁R₁ cruza la paralela por U₁.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(solucion.i1), solucion.L_a1), segmento2(proy_planta(solucion.i4), solucion.L_a4), segmento2(proy_planta(solucion.i5), solucion.L_a5), segmento2(proy_planta(solucion.i8), solucion.L_a8), segmento2(proy_planta(solucion.i2), solucion.L_a2), segmento2(proy_planta(solucion.i3), solucion.L_a3), segmento2(proy_planta(solucion.i6), solucion.L_a6), segmento2(proy_planta(solucion.i7), solucion.L_a7)]'
            porque: |
              **El alzado.** Por los ocho puntos, las verticales hasta el alzado: las de 1, 4, 5 y 8 hasta pasar la
              coronación, y las de 2, 3, 6 y 7 hasta pasar la recta del fondo.
          - con: marca
            traza: '[proy_alzado(solucion.i1), proy_alzado(solucion.i4), proy_alzado(solucion.i5), proy_alzado(solucion.i8)]'
            porque: |
              1₂, 4₂, 5₂ y 8₂, donde sus verticales cortan la coronación: son puntos de KP y de NS, a esa cota.
          - con: marca
            traza: '[proy_alzado(solucion.i2), proy_alzado(solucion.i3), proy_alzado(solucion.i6), proy_alzado(solucion.i7)]'
            porque: |
              2₂, 3₂, 6₂ y 7₂, donde sus verticales cortan la recta del fondo: son puntos de LQ y de MR.
          - con: arista-vista
            traza: '[segmento2(figura.punto("Kx1"), figura.punto("Px1")), segmento2(figura.punto("Nx1"), figura.punto("Sx1")), segmento2(figura.punto("Lx1"), figura.punto("Qx1")), segmento2(figura.punto("Mx1"), figura.punto("Rx1")), segmento2(figura.punto("Ax1"), solucion.x_AE_KP), segmento2(solucion.x_AE_NS, figura.punto("Ex1")), segmento2(figura.punto("Dx1"), solucion.x_DH_KP), segmento2(solucion.x_DH_NS, figura.punto("Hx1")), segmento2(figura.punto("Bx1"), proy_planta(solucion.i1)), segmento2(proy_planta(solucion.i4), figura.punto("Fx1")), segmento2(figura.punto("Cx1"), proy_planta(solucion.i5)), segmento2(proy_planta(solucion.i8), figura.punto("Gx1"))]'
            porque: |
              **A limpio, la planta.** En continua, las aristas del canal enteras, que desde arriba se ven todas
              porque es una artesa abierta; la base de los taludes fuera del canal, y la coronación hasta el borde del
              canal.
          - con: arista-oculta
            traza: '[segmento2(solucion.x_AE_KP, solucion.x_AE_NS), segmento2(solucion.x_DH_KP, solucion.x_DH_NS)]'
            porque: |
              A trazos, la base de los dos taludes donde el canal le pasa por encima.
          - con: arista-vista
            traza: '[segmento2(proy_planta(solucion.i1), proy_planta(solucion.i2)), segmento2(proy_planta(solucion.i2), proy_planta(solucion.i3)), segmento2(proy_planta(solucion.i3), proy_planta(solucion.i4)), segmento2(proy_planta(solucion.i5), proy_planta(solucion.i6)), segmento2(proy_planta(solucion.i6), proy_planta(solucion.i7)), segmento2(proy_planta(solucion.i7), proy_planta(solucion.i8))]'
            porque: |
              La intersección, 1234 en el talud de atrás y 5678 en el de delante, en continua: el canal abierto la deja
              ver desde arriba.
          - con: arista-vista
            traza: '[segmento2(figura.punto("Kx2"), figura.punto("B2")), segmento2(figura.punto("G2"), figura.punto("Px2")), segmento2(figura.punto("Lx2"), solucion.T2p), segmento2(proy_alzado(solucion.i6), figura.punto("Qx2")), segmento2(proy_alzado(solucion.i5), proy_alzado(solucion.i6)), segmento2(solucion.x_GH_LQ, figura.punto("H2"))]'
            porque: |
              **A limpio, el alzado.** En continua, lo que va por delante: las rectas del canal fuera del terraplén, la
              intersección de su pared de delante con el talud de delante, 5₂6₂, y GH por debajo del canal.
          - con: arista-oculta
            traza: '[segmento2(solucion.T2p, proy_alzado(solucion.i6)), segmento2(proy_alzado(solucion.i1), proy_alzado(solucion.i2)), segmento2(proy_alzado(solucion.i3), proy_alzado(solucion.i4)), segmento2(proy_alzado(solucion.i7), proy_alzado(solucion.i8)), segmento2(figura.punto("G2"), solucion.x_GH_LQ)]'
            porque: |
              A trazos, lo que queda detrás: LQ de T₂ a 6₂, detrás del terraplén o dentro de él; la intersección con el
              talud de atrás y la de la pared de atrás con el de delante; y GH, detrás del canal.
        pista: |
          (1) Completa con la regla las aristas del canal y las de la coronación en la planta: KP y NS cortan B₁F₁ y
          C₁G₁ en 1₁, 4₁, 5₁ y 8₁. (2) En el alzado, L₂M₂ prolongada corta A₂B₂ en T₂ y D₂C₂ en U₂; bájalos a A₁D₁. (3)
          Por T₁ y U₁, paralelas a las aristas del terraplén: cortan L₁Q₁ y M₁R₁ en 2₁, 3₁, 6₁ y 7₁. (4) Sube los ocho
          puntos: los de arriba a la coronación, los del fondo a la recta del fondo. (5) Desde arriba, el canal abierto
          se ve por dentro; desde delante, su pared de delante tapa lo que tiene detrás.
        desarrollo: |
          En verde claro, las verticales de T₂ y U₂ hasta A₁D₁, las horizontales de los taludes a la cota del fondo, y
          las verticales de los ocho puntos. La intersección son dos líneas abiertas, una en cada talud: 1234, por
          donde entra el canal, y 5678, por donde sale. En cada una, los dos tramos de los lados son de las paredes
          del canal, y el del medio, de su fondo.

      - tipo: calcular
        titulo: La pendiente de los taludes
        pregunta: ¿Qué ángulo forman los taludes del terraplén con el suelo horizontal? Es su pendiente, que leemos como ángulo; los dos dan lo mismo, porque la sección es un trapecio isósceles.
        respuesta:
          tipo: numero
          valor: '46.87'
          receta: pendiente_atras
          tolerancia: 1
          formato: un número, en grados
        distractores:
          - valor: '64.95'
            receta: aparente
            mensaje: |
              Eso es el ángulo de **A₂B₂ en el alzado**. El extremo del terraplén no es frontal: forma 60° con el plano
              vertical, y el alzado estrecha lo que AB avanza, a la mitad. El ángulo del talud sale del triángulo de AB
              en verdadera magnitud.
          - valor: '43.13'
            receta: complemento
            mensaje: |
              Eso es el ángulo del talud con la **vertical**, el complementario. La pendiente respecto del suelo es el
              otro ángulo agudo del triángulo: el de enfrente de la altura.
        pista: |
          El extremo del terraplén es su sección recta, y AB, su lado, es una recta de máxima pendiente del talud.
          Dibuja su triángulo, en el paso anterior o en tu lámina: A₁B₁, de la planta, de un cateto, y la altura del
          terraplén, de la base a la coronación en el alzado, del otro. Mide con el transportador el ángulo de enfrente
          de la altura.
        desarrollo: |
          AB es perpendicular a las aristas del terraplén, porque el extremo es su sección recta: es la recta de
          máxima pendiente del talud de atrás. En la planta avanza A₁B₁ = 15,25 mm, y sube la altura del terraplén,
          16,28 mm:

          $$ \tan \alpha = \frac{16{,}28}{15{,}25} \approx 1{,}068 \quad\Rightarrow\quad \alpha \approx 46{,}87^{\circ} $$

          Es una pendiente del 107 %. El talud de delante da lo mismo con su lado DC, 15,22 mm en la planta: 46,93°,
          la misma pendiente con el redondeo de la hoja, como corresponde a un trapecio isósceles.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: Las aristas de arriba del canal, KP y NS, van a la cota de la coronación, y cortan los taludes en sus bordes de arriba, BF y CG.
          - texto: Las del fondo, LQ y MR, cortan cada talud en su horizontal a la cota del fondo, que sale del extremo del terraplén por T y por U.
          - texto: Cada pared del canal corta el talud en el segmento que une sus dos puntos, y el fondo, en el que une los dos de abajo.
          - texto: Desde arriba, el canal abierto se ve por dentro y tapa el pie de los taludes; desde delante, su pared de delante tapa lo que tiene detrás.
          - texto: La pendiente de los taludes es el ángulo de AB con el suelo, porque el extremo del terraplén es su sección recta.
          - texto: El fondo del canal entra en el talud de atrás donde L₁Q₁ cruza A₁E₁, la base del talud.
            trampa: true
            mensaje: |
              Ese cruce es aparente: el canal va en el aire, con el fondo 4,0 mm por encima del suelo, y sobre A₁E₁ pasa
              por encima del pie del talud. Entra más adentro, en la horizontal del talud a la cota del fondo.
    resolucion: |
      **Qué hay.** Un terraplén, prisma tendido en el suelo con sección de trapecio isósceles, y un canal, una artesa
      de sección también trapecial, más ancha arriba, abierta, que lo cruza a 60°: entra por el talud de atrás, ABFE,
      y sale por el de delante, CDHG. La coronación del terraplén y el borde de arriba del canal están a la misma
      cota; fuera del terraplén, el canal va en el aire, con el fondo 4,0 mm por encima del suelo.

      **La intersección.** KP y NS, las aristas de arriba del canal, cortan los taludes en sus bordes de arriba: en
      la planta, 1₁ y 4₁ en B₁F₁, y 5₁ y 8₁ en C₁G₁. LQ y MR, las del fondo, cortan cada talud en su horizontal a la
      cota del fondo, que sale del extremo izquierdo del terraplén, su sección recta: en el alzado, la recta del
      fondo corta A₂B₂ en T₂ y D₂C₂ en U₂, y las paralelas a las aristas del terraplén por T₁ y U₁ dan 2₁, 3₁, 6₁ y 7₁.
      En el alzado, los de arriba van en la coronación y los del fondo en la recta del fondo. La intersección son dos
      líneas abiertas: 1234 y 5678.

      **Lo que se ve.** En la planta, el canal se ve por dentro, con sus cuatro aristas y la intersección enteras, y
      tapa la base de los dos taludes por donde pasa por encima. En el alzado, la pared de delante del canal tapa lo
      que el canal tiene detrás (7₂8₂ y el trozo de arriba de G₂H₂), y el terraplén, lo que el canal lleva detrás de su
      extremo o dentro (LQ de T₂ a 6₂, 1₂2₂ y 3₂4₂); se ve 5₂6₂.

      **La pendiente.** AB, el lado del extremo, es una recta de máxima pendiente del talud de atrás: avanza 15,25 mm y
      sube 16,28. El talud forma 46,87° con el suelo, una pendiente del 107 %; el de delante, 46,93°.

  - id: sd49-el-tunel-del-funicular
    titulo: El túnel del funicular a través de la montaña
    fuente: Ejercicio 34 (SD49) · Colección de ejercicios de Geometría Descriptiva, Sistema Diédrico Directo · Dpto. de Expresión Gráfica y Proyectos de Ingeniería, EIG · UPV/EHU
    nivel: practica
    # Decisión: el texto impreso tal cual, cotejado con la página (pág. 35). La
    # lámina solo rotula los bloques, 1 y 2: los demás nombres son nuestros, y se
    # añaden a la lámina como puntos sin marca (lo dice su revisión). Las
    # «aristas laterales» del funicular son las de GG′, la única de sus tres
    # direcciones que lo lleva a través de la montaña (comprobado aparte: según
    # GH o GI no la toca); lo dicen las Notas. Las paredes del túnel son
    # verticales, y cada una es el plano auxiliar de las dos aristas que lleva.
    enunciado: |
      En el bloque prismático (2-montaña) quiere practicarse un agujero (túnel) con las dimensiones
      mínimas para que permita pasar al bloque paralelepípedo rectangular (1-funicular) desplazándose
      en la dirección de sus aristas laterales. Dibujar, en las vistas dadas, las aristas del orificio.

      **Notas nuestras.** La figura es el alzado, arriba, y la planta, debajo, sin línea de tierra. La
      hoja no da escala: las longitudes van en milímetros de la lámina. Solo rotula los bloques; los
      nombres son nuestros. La montaña es un prisma con las aristas horizontales, en la dirección de los
      lados largos de su planta, y con este perfil en el extremo de atrás, el lado corto de arriba de la
      planta: A, al pie de la primera ladera; B y C, los dos bordes del rellano; D, arriba de la segunda
      ladera, y E y F, arriba y abajo del cortado de la derecha, que en la planta caen en el mismo punto.
      Sus aristas son AA′, BB′, CC′, DD′, EE′ y FF′, con A′, B′… en el extremo de delante. El funicular
      es una caja de 36 × 31,5 × 31,5 mm; llamamos G, H, I y J a los vértices de su cara de la izquierda
      (G y H arriba, G e I detrás) y G′, H′, I′ y J′ a los de la derecha.

      El enunciado no dice cuáles son las aristas laterales del funicular. De sus tres direcciones, la
      única que lo hace pasar por la montaña es la de GG′, que sube 20° hacia la derecha, como sube un
      funicular: moviéndose según GH o según GI, la cabina pasa sin tocarla, y no haría falta túnel. Así
      que el túnel es el prisma que barre la cabina: sus aristas son las rectas GG′, HH′, II′ y JJ′
      prolongadas, y su sección, la cara GHJI. Entra por las dos laderas y sale por el cortado. Llamamos
      K y L a las entradas de GG′ y HH′, M y N a las de II′ y JJ′, y P, Q, R y S a sus salidas; T, U, X
      e Y son los puntos donde las paredes del túnel cortan los bordes del rellano, y 1, 2, 4 y 5, otros
      puntos de la construcción, también nuestros. Tomamos la montaña opaca, como el funicular; con la
      montaña transparente, todas las aristas del orificio irían en continua.
    pide: Los puntos donde las cuatro aristas del túnel entran en la montaña y salen de ella, en las dos vistas, y las aristas del orificio, con lo que se ve y lo que no; y, como pregunta nuestra, lo alta que sale la boca en el cortado.
    receta:
      lamina: sd49
      escena:
        A: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("A1"))'
        B: 'punto3(alzado: figura.punto("B2"), planta: figura.punto("B1"))'
        C: 'punto3(alzado: figura.punto("C2"), planta: figura.punto("C1"))'
        D: 'punto3(alzado: figura.punto("D2"), planta: figura.punto("D1"))'
        E: 'punto3(alzado: figura.punto("E2"), planta: figura.punto("E1"))'
        F: 'punto3(alzado: figura.punto("F2"), planta: figura.punto("E1"))'
        Ap: 'punto3(alzado: figura.punto("A2p"), planta: figura.punto("A1p"))'
        Bp: 'punto3(alzado: figura.punto("B2p"), planta: figura.punto("B1p"))'
        Cp: 'punto3(alzado: figura.punto("C2p"), planta: figura.punto("C1p"))'
        Dp: 'punto3(alzado: figura.punto("D2p"), planta: figura.punto("D1p"))'
        Ep: 'punto3(alzado: figura.punto("E2p"), planta: figura.punto("E1p"))'
        Fp: 'punto3(alzado: figura.punto("F2p"), planta: figura.punto("E1p"))'
        G: 'punto3(alzado: figura.punto("G2"), planta: figura.punto("G1"))'
        H: 'punto3(alzado: figura.punto("H2"), planta: figura.punto("H1"))'
        I: 'punto3(alzado: figura.punto("I2"), planta: figura.punto("I1"))'
        J: 'punto3(alzado: figura.punto("J2"), planta: figura.punto("J1"))'
        Gp: 'punto3(alzado: figura.punto("G2p"), planta: figura.punto("G1p"))'
        Hp: 'punto3(alzado: figura.punto("H2p"), planta: figura.punto("H1p"))'
        Ip: 'punto3(alzado: figura.punto("I2p"), planta: figura.punto("I1p"))'
        Jp: 'punto3(alzado: figura.punto("J2p"), planta: figura.punto("J1p"))'
        ladera1: plano(A, B, Ap)
        ladera2: plano(C, D, Cp)
        cortado: plano(E, F, Ep)
        # Las paredes del túnel: las caras GG′I′I y HH′J′J del funicular, que
        # son verticales (G₁G′₁ pasa por I₁, y H₁H′₁ por J₁, a menos de 0,1 pt).
        atras: plano(G, Gp, I)
        delante: plano(H, Hp, J)
      solucion:
        # Las entradas y las salidas: las aristas de arriba, GG′ y HH′, entran por
        # la segunda ladera; las de abajo, II′ y JJ′, por la primera; las cuatro
        # salen por el cortado.
        K: corte_recta_plano(recta3(G, Gp), ladera2)
        L: corte_recta_plano(recta3(H, Hp), ladera2)
        M: corte_recta_plano(recta3(I, Ip), ladera1)
        N: corte_recta_plano(recta3(J, Jp), ladera1)
        P: corte_recta_plano(recta3(G, Gp), cortado)
        Q: corte_recta_plano(recta3(H, Hp), cortado)
        R: corte_recta_plano(recta3(I, Ip), cortado)
        S: corte_recta_plano(recta3(J, Jp), cortado)
        # Donde las paredes cortan los bordes del rellano: la boca de entrada
        # cruza el rellano de lado a lado.
        T: corte_recta_plano(recta3(B, Bp), atras)
        U: corte_recta_plano(recta3(C, Cp), atras)
        X: corte_recta_plano(recta3(B, Bp), delante)
        Y: corte_recta_plano(recta3(C, Cp), delante)
        alto_PR_mm: en_mm(vm(P, R))
        # Decisión: el plano auxiliar de cada pared es la propia pared, que es
        # vertical: en la planta, la recta G₁G′₁ (o H₁H′₁) prolongada. Corta las
        # aristas de la montaña en 1 (AA′), T, U, 2 (DD′) y P₁ (el cortado); en
        # el alzado, esos puntos suben a la altura de su arista, y las rectas
        # 1₂T₂ y U₂2₂ son los cortes de la pared con las dos laderas, y la
        # vertical de P₁, con el cortado. Ahí cortan G₂G′₂ e I₂I′₂ prolongadas.
        # Con la pared de delante, 4, X, Y, 5 y Q₁.
        w1_Z1: 'cruce_aparente(figura.segmento("GG1"), figura.segmento("AA1"))'
        w1_T: 'cruce_aparente(figura.segmento("GG1"), figura.segmento("BB1"))'
        w1_U: 'cruce_aparente(figura.segmento("GG1"), figura.segmento("CC1"))'
        w1_Z2: 'cruce_aparente(figura.segmento("GG1"), figura.segmento("DD1"))'
        w4_Z4: 'cruce_aparente(figura.segmento("HH1"), figura.segmento("AA1"))'
        w4_X: 'cruce_aparente(figura.segmento("HH1"), figura.segmento("BB1"))'
        w4_Y: 'cruce_aparente(figura.segmento("HH1"), figura.segmento("CC1"))'
        w4_Z5: 'cruce_aparente(figura.segmento("HH1"), figura.segmento("DD1"))'
        Z1_2: 'cruce_aparente(segmento2(w1_Z1, desplaza(w1_Z1, dy: -10)), figura.segmento("AA2"))'
        T_2: 'cruce_aparente(segmento2(w1_T, desplaza(w1_T, dy: -10)), figura.segmento("BB2"))'
        U_2: 'cruce_aparente(segmento2(w1_U, desplaza(w1_U, dy: -10)), figura.segmento("BB2"))'
        Z2_2: 'cruce_aparente(segmento2(w1_Z2, desplaza(w1_Z2, dy: -10)), figura.segmento("DD2"))'
        Z4_2: 'cruce_aparente(segmento2(w4_Z4, desplaza(w4_Z4, dy: -10)), figura.segmento("AA2"))'
        X_2: 'cruce_aparente(segmento2(w4_X, desplaza(w4_X, dy: -10)), figura.segmento("BB2"))'
        Y_2: 'cruce_aparente(segmento2(w4_Y, desplaza(w4_Y, dy: -10)), figura.segmento("BB2"))'
        Z5_2: 'cruce_aparente(segmento2(w4_Z5, desplaza(w4_Z5, dy: -10)), figura.segmento("DD2"))'
        # Los errores: el cruce aparente de una arista del túnel con una arista
        # de los extremos de la montaña en el alzado (C₂D₂, A₂B₂, E₂F₂ detrás;
        # C′₂D′₂, A′₂B′₂, E′₂F′₂ delante).
        K_CD: 'cruce_aparente(figura.segmento("GG2"), figura.segmento("CD2"))'
        L_CDp: 'cruce_aparente(figura.segmento("HH2"), figura.segmento("CD2p"))'
        M_AB: 'cruce_aparente(figura.segmento("II2"), segmento2(figura.punto("A2"), figura.punto("B2")))'
        N_ABp: 'cruce_aparente(figura.segmento("JJ2"), figura.segmento("AB2p"))'
        P_EF: 'cruce_aparente(figura.segmento("GG2"), figura.segmento("EF2"))'
        R_EF: 'cruce_aparente(figura.segmento("II2"), figura.segmento("EF2"))'
        Q_EFp: 'cruce_aparente(figura.segmento("HH2"), figura.segmento("EF2p"))'
        S_EFp: 'cruce_aparente(figura.segmento("JJ2"), figura.segmento("EF2p"))'
        # La visibilidad: el único cambio a mitad de una arista es el de II′ en
        # el alzado, que se ve por la boca hasta que pasa detrás del borde N₂X₂.
        k_IR_NX2: 'cruce_aparente(figura.segmento("II2"), segmento2(proy_alzado(N), proy_alzado(X)))'
        # Los extremos de las rectas largas.
        L_w1: 'uno(medir_sobre(figura.segmento("GG1"), desde: proy_planta(P), distancia: mm(4)), 1)'
        L_w4: 'uno(medir_sobre(figura.segmento("HH1"), desde: proy_planta(Q), distancia: mm(4)), 1)'
        L_Z1_2: 'desplaza(Z1_2, dy: mm(-4))'
        L_T_2: 'desplaza(T_2, dy: mm(-4))'
        L_U_2: 'desplaza(U_2, dy: mm(-4))'
        L_Z2_2: 'desplaza(Z2_2, dy: mm(-4))'
        L_P_2: 'desplaza(cruce_aparente(segmento2(proy_planta(P), desplaza(proy_planta(P), dy: -10)), figura.segmento("DD2")), dy: mm(-4))'
        L_Z4_2: 'desplaza(Z4_2, dy: mm(-4))'
        L_X_2: 'desplaza(X_2, dy: mm(-4))'
        L_Y_2: 'desplaza(Y_2, dy: mm(-4))'
        L_Z5_2: 'desplaza(Z5_2, dy: mm(-4))'
        L_Q_2: 'desplaza(cruce_aparente(segmento2(proy_planta(Q), desplaza(proy_planta(Q), dy: -10)), figura.segmento("DE2p")), dy: mm(-4))'
        L_g2: 'uno(medir_sobre(figura.segmento("GG2"), desde: proy_alzado(P), distancia: mm(4)), 1)'
        L_i2: 'uno(medir_sobre(figura.segmento("II2"), desde: proy_alzado(R), distancia: mm(4)), 1)'
        L_h2: 'uno(medir_sobre(figura.segmento("HH2"), desde: proy_alzado(Q), distancia: mm(4)), 1)'
        L_j2: 'uno(medir_sobre(figura.segmento("JJ2"), desde: proy_alzado(S), distancia: mm(4)), 1)'
        L_K1: 'desplaza(proy_planta(K), dy: mm(4))'
        L_M1: 'desplaza(proy_planta(M), dy: mm(4))'
        L_L1: 'desplaza(proy_planta(L), dy: mm(4))'
        L_N1: 'desplaza(proy_planta(N), dy: mm(4))'
      comprueba:
        - en_plano(K, atras)
        - en_plano(M, atras)
        - en_plano(P, atras)
        - en_plano(L, delante)
        - en_plano(N, delante)
        - en_plano(S, delante)
        - en_plano(T, ladera1)
        - en_plano(U, ladera2)
        - en_plano(Y, ladera2)
    pasos:
      - tipo: reconocer
        pregunta: En la planta, G₁G′₁ pasa también por I₁ e I′₁, y H₁H′₁ por J₁ y J′₁. ¿Qué quiere decir eso para buscar dónde entran en la montaña las aristas del túnel?
        opciones:
          - texto: Que GG′ e II′ van en un mismo plano vertical, la pared de atrás del túnel, y un solo plano auxiliar sirve para las dos
            correcta: true
            mensaje: |
              Eso es. Las caras GG′I′I y HH′J′J del funicular son verticales, y son las paredes del túnel. El
              plano vertical de una pared, que en la planta es la recta G₁G′₁, corta la montaña en una
              poligonal; donde G₂G′₂ e I₂I′₂ la cortan en el alzado están las dos entradas y las dos salidas.
          - texto: Que GG′ e II′ son la misma arista vista dos veces, y entran en la montaña por un mismo punto, el que da la planta donde esa recta cruza A₁A′₁
            mensaje: |
              En la planta coinciden, pero en el alzado no: G₂G′₂ va unos 33,5 mm por encima de I₂I′₂, medido en
              vertical. Son las dos aristas de la pared de atrás, la de arriba y la de abajo, y entran por
              laderas distintas. Y donde la pared cruza A₁A′₁ no entra ninguna: es el pie de la ladera.
          - texto: Que los cruces de esa recta con las aristas de la montaña en la planta ya son las entradas y las salidas del túnel, y no hace falta subirlos al alzado
            mensaje: |
              Esos cruces son puntos de la pared, no de las aristas del túnel: dicen dónde corta la pared a
              cada arista de la montaña. Subidos al alzado, a la altura de su arista, dan la poligonal del
              corte, y las entradas están donde G₂G′₂ e I₂I′₂ la cortan.

      - tipo: construir
        titulo: Las aristas del túnel, de la entrada a la salida, y lo que se ve
        intro: |
          Las paredes del túnel son verticales, y cada una es el plano auxiliar de sus dos aristas. Primero
          la de atrás: en la planta, prolonga G₁G′₁ hacia la derecha hasta pasar el cortado, E₁E′₁. Corta
          A₁A′₁ en 1₁, B₁B′₁ en T₁, C₁C′₁ en U₁, D₁D′₁ en 2₁ y el cortado en P₁, que es también R₁: la pared
          y el cortado son verticales, y se cortan en una vertical. Sube cada punto a la altura de su arista
          en el alzado (1₂ abajo, T₂ y U₂ en el rellano, 2₂ arriba) y la vertical de P₁ entera. 1₂T₂ es el
          corte de la pared con la primera ladera; U₂2₂, con la segunda, y la vertical de P₁, con el
          cortado. Prolonga G₂G′₂ e I₂I′₂: GG′ entra en K₂, en U₂2₂, e II′ en M₂, en 1₂T₂; las dos salen
          en la vertical de P₁, en P₂ y R₂. Baja K₂ y M₂ a la recta G₁G′₁. Después, igual con la pared de
          delante, la de H₁H′₁: 4, X, Y, 5 y Q₁, y las entradas L y N y las salidas Q y S.

          Por último, pasa a limpio con «arista vista» y «arista oculta» las aristas del túnel y las bocas.
          La de entrada va de M y N, abajo, a K y L, arriba, por las paredes; la de salida, de P a S, en el
          cortado. En la planta, la de salida cae encima de E₁E′₁, y en el alzado, los trozos de las paredes
          por el rellano, T₂U₂ y X₂Y₂, encima de la recta del rellano: ya están. En tu lámina de papel, borra
          lo que el túnel se lleva: B₁B′₁ entre T₁ y X₁, C₁C′₁ entre U₁ e Y₁, y en el alzado la recta del
          rellano entre U₂ y X₂. Tomamos la montaña opaca. P₁, R₁, Q₁ y S₁ caen dos a dos en un punto. Hay
          trazos muy juntos: la vertical de 5₁ pasa a 0,6 mm de la de P₁, junto a P₂ y R₂; M₂ queda a 1,0 mm
          del borde del funicular, H′₂J′₂, y N₂ a 1,2 mm de donde la vertical de 2₁ cruza J₂J′₂. Amplía con
          la lupa (×4).
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, medir, visto, oculto, borrar]
        tolerancia: 1
        objetivos:
          - nombre: P1
            pide: P, donde la arista GG′ sale por el cortado, en la planta (es también R₁)
            es: proy_planta(solucion.P)
            bien: |
              P₁ está donde G₁G′₁ prolongada corta E₁E′₁. La pared de atrás y el cortado son verticales, y se
              cortan en una vertical: P y R, las salidas de GG′ y de II′, tienen la misma planta.
            diagnosticos:
              - si: '!en_recta(figura.segmento("EE1"))'
                mensaje: |
                  P está en el cortado, que es vertical: en la planta es la recta E₁E′₁, y P₁ va en ella.
                ejemplo: 'desplaza(proy_planta(solucion.P), dx: mm(-5))'
              - si: '!en_recta(figura.segmento("GG1"))'
                mensaje: |
                  P está en la arista GG′, y su planta en G₁G′₁ prolongada, que es la pared de atrás del túnel.
                ejemplo: 'uno(medir_sobre(figura.segmento("EE1"), desde: proy_planta(solucion.P), distancia: mm(6)), 1)'
              - si: siempre
                mensaje: |
                  P₁ está donde G₁G′₁, prolongada hacia la derecha, corta E₁E′₁.
          - nombre: K2
            pide: K, donde la arista GG′ entra en la montaña, en el alzado
            es: proy_alzado(solucion.K)
            bien: |
              K₂ está en G₂G′₂ prolongada, donde la corta U₂2₂: el corte de la pared de atrás con la segunda
              ladera. GG′ y esa recta están en la misma pared, así que se cortan de verdad.
            diagnosticos:
              - si: cerca_de(solucion.K_CD)
                mensaje: |
                  Ese es el cruce aparente de G₂G′₂ con C₂D₂, la arista de la segunda ladera en el extremo de
                  atrás: ahí GG′ pasa 11,5 mm por delante de ella, todavía fuera de la montaña. La pared corta la
                  ladera en U₂2₂.
                ejemplo: solucion.K_CD
              - si: '!en_recta(figura.segmento("GG2"))'
                mensaje: |
                  K es un punto de la arista GG′: K₂ va **en G₂G′₂**, prolongada, donde la corta U₂2₂.
                ejemplo: 'desplaza(proy_alzado(solucion.K), dx: mm(-4), dy: mm(-5))'
              - si: siempre
                mensaje: |
                  Estás en G₂G′₂ prolongada, pero no donde la corta U₂2₂. U₂ y 2₂ suben de U₁ y 2₁, donde G₁G′₁
                  cruza C₁C′₁ y D₁D′₁, a la altura del rellano y de la cima.
          - nombre: M2
            pide: M, donde la arista II′ entra en la montaña, en el alzado
            es: proy_alzado(solucion.M)
            bien: |
              M₂ está en I₂I′₂ prolongada, donde la corta 1₂T₂: el corte de la pared de atrás con la primera
              ladera.
            diagnosticos:
              - si: cerca_de(solucion.M_AB)
                mensaje: |
                  Ese es el cruce aparente de I₂I′₂ con A₂B₂, la arista de la primera ladera en el extremo de
                  atrás: II′ pasa ahí 7,3 mm por delante de ella. La pared corta la ladera en 1₂T₂.
                ejemplo: solucion.M_AB
              - si: '!en_recta(figura.segmento("II2"))'
                mensaje: |
                  M es un punto de la arista II′: M₂ va **en I₂I′₂**, prolongada, donde la corta 1₂T₂.
                ejemplo: 'desplaza(proy_alzado(solucion.M), dx: mm(4), dy: mm(5))'
              - si: siempre
                mensaje: |
                  Estás en I₂I′₂ prolongada, pero no donde la corta 1₂T₂. 1₂ y T₂ suben de 1₁ y T₁, donde G₁G′₁
                  cruza A₁A′₁ y B₁B′₁, a la altura del pie y del rellano.
          - nombre: P2
            pide: P, donde GG′ sale por el cortado, en el alzado
            es: proy_alzado(solucion.P)
            bien: |
              P₂ está en G₂G′₂ prolongada, en la vertical de P₁: es el corte de la pared con el cortado.
            diagnosticos:
              - si: cerca_de(solucion.P_EF)
                mensaje: |
                  Esa es la arista de atrás del cortado, E₂F₂, la vertical de trazos. GG′ pasa ahí 17,8 mm por
                  delante de ella, por dentro de la montaña. Sale por el cortado más a la derecha, en la vertical
                  de P₁.
                ejemplo: solucion.P_EF
              - si: '!en_recta(figura.segmento("GG2"))'
                mensaje: |
                  P es un punto de la arista GG′: P₂ va **en G₂G′₂**, prolongada.
                ejemplo: 'desplaza(proy_alzado(solucion.P), dy: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en G₂G′₂ prolongada, pero no en la vertical de P₁, que es el corte de la pared con el
                  cortado.
          - nombre: R2
            pide: R, donde II′ sale por el cortado, en el alzado
            es: proy_alzado(solucion.R)
            bien: |
              R₂ está en I₂I′₂ prolongada, en la vertical de P₁, 33,4 mm por debajo de P₂.
            diagnosticos:
              - si: cerca_de(solucion.R_EF)
                mensaje: |
                  Esa es la arista de atrás del cortado, E₂F₂: II′ pasa ahí 17,8 mm por delante de ella. Sale más
                  a la derecha, en la vertical de P₁.
                ejemplo: solucion.R_EF
              - si: '!en_recta(figura.segmento("II2"))'
                mensaje: |
                  R es un punto de la arista II′: R₂ va **en I₂I′₂**, prolongada.
                ejemplo: 'desplaza(proy_alzado(solucion.R), dy: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en I₂I′₂ prolongada, pero no en la vertical de P₁.
          - nombre: K1
            pide: K, en la planta
            es: proy_planta(solucion.K)
            bien: |
              K₁ está en G₁G′₁ prolongada, en la vertical de K₂.
            diagnosticos:
              - si: '!en_vertical_de(K2)'
                mensaje: |
                  K₁ va en la **vertical de K₂**: es el mismo punto visto dos veces.
                ejemplo: 'desplaza(proy_planta(solucion.K), dx: mm(5))'
              - si: siempre
                mensaje: |
                  Estás en la vertical de K₂, pero no en la pared: K₁ va en G₁G′₁ prolongada.
          - nombre: M1
            pide: M, en la planta
            es: proy_planta(solucion.M)
            bien: |
              M₁ está en la misma recta, G₁G′₁, en la vertical de M₂.
            diagnosticos:
              - si: '!en_vertical_de(M2)'
                mensaje: |
                  M₁ va en la **vertical de M₂**.
                ejemplo: 'desplaza(proy_planta(solucion.M), dx: mm(-5))'
              - si: siempre
                mensaje: |
                  Estás en la vertical de M₂, pero no en la pared: M₁ va en G₁G′₁, la misma recta que I₁I′₁.
          - nombre: Q1
            pide: Q, donde la arista HH′ sale por el cortado, en la planta (es también S₁)
            es: proy_planta(solucion.Q)
            bien: |
              Q₁ está donde H₁H′₁ prolongada corta E₁E′₁: la pared de delante y el cortado se cortan en una
              vertical, y Q y S tienen la misma planta.
            diagnosticos:
              - si: '!en_recta(figura.segmento("EE1"))'
                mensaje: |
                  Q está en el cortado: Q₁ va en E₁E′₁.
                ejemplo: 'desplaza(proy_planta(solucion.Q), dx: mm(-5))'
              - si: '!en_recta(figura.segmento("HH1"))'
                mensaje: |
                  Q está en la arista HH′, y su planta en H₁H′₁ prolongada, la pared de delante.
                ejemplo: 'uno(medir_sobre(figura.segmento("EE1"), desde: proy_planta(solucion.Q), distancia: mm(6)), 1)'
              - si: siempre
                mensaje: |
                  Q₁ está donde H₁H′₁, prolongada hacia la derecha, corta E₁E′₁.
          - nombre: L2
            pide: L, donde la arista HH′ entra en la montaña, en el alzado
            es: proy_alzado(solucion.L)
            bien: |
              L₂ está en H₂H′₂ prolongada, donde la corta Y₂5₂: el corte de la pared de delante con la segunda
              ladera.
            diagnosticos:
              - si: cerca_de(solucion.L_CDp)
                mensaje: |
                  Ese es el cruce aparente de H₂H′₂ con C′₂D′₂, la arista de la segunda ladera en el extremo de
                  delante: ahí C′D′ pasa 18,0 mm por delante de HH′. La pared de delante corta la ladera en Y₂5₂.
                ejemplo: solucion.L_CDp
              - si: '!en_recta(figura.segmento("HH2"))'
                mensaje: |
                  L es un punto de la arista HH′: L₂ va **en H₂H′₂**, prolongada, donde la corta Y₂5₂.
                ejemplo: 'desplaza(proy_alzado(solucion.L), dx: mm(-4), dy: mm(-5))'
              - si: siempre
                mensaje: |
                  Estás en H₂H′₂ prolongada, pero no donde la corta Y₂5₂. Y₂ y 5₂ suben de Y₁ y 5₁, donde H₁H′₁
                  cruza C₁C′₁ y D₁D′₁.
          - nombre: N2
            pide: N, donde la arista JJ′ entra en la montaña, en el alzado
            es: proy_alzado(solucion.N)
            bien: |
              N₂ está en J₂J′₂ prolongada, donde la corta 4₂X₂: el corte de la pared de delante con la primera
              ladera. M₂N₂ es el suelo de la boca de entrada, y K₂L₂ el techo.
            diagnosticos:
              - si: cerca_de(solucion.N_ABp)
                mensaje: |
                  Ese es el cruce aparente de J₂J′₂ con A′₂B′₂, la arista de la primera ladera en el extremo de
                  delante: A′B′ pasa ahí 22,2 mm por delante de JJ′. La pared corta la ladera en 4₂X₂.
                ejemplo: solucion.N_ABp
              - si: '!en_recta(figura.segmento("JJ2"))'
                mensaje: |
                  N es un punto de la arista JJ′: N₂ va **en J₂J′₂**, prolongada, donde la corta 4₂X₂.
                ejemplo: 'desplaza(proy_alzado(solucion.N), dx: mm(4), dy: mm(5))'
              - si: siempre
                mensaje: |
                  Estás en J₂J′₂ prolongada, pero no donde la corta 4₂X₂. 4₂ y X₂ suben de 4₁ y X₁, donde H₁H′₁
                  cruza A₁A′₁ y B₁B′₁.
          - nombre: Q2
            pide: Q, donde HH′ sale por el cortado, en el alzado
            es: proy_alzado(solucion.Q)
            bien: |
              Q₂ está en H₂H′₂ prolongada, en la vertical de Q₁.
            diagnosticos:
              - si: cerca_de(solucion.Q_EFp)
                mensaje: |
                  Esa es la arista de delante del cortado, E′₂F′₂, el borde derecho del alzado: ahí E′F′ pasa
                  12,5 mm por delante de HH′, que ya ha salido de la montaña. HH′ sale por el cortado antes, en
                  la vertical de Q₁.
                ejemplo: solucion.Q_EFp
              - si: '!en_recta(figura.segmento("HH2"))'
                mensaje: |
                  Q es un punto de la arista HH′: Q₂ va **en H₂H′₂**, prolongada.
                ejemplo: 'desplaza(proy_alzado(solucion.Q), dy: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en H₂H′₂ prolongada, pero no en la vertical de Q₁.
          - nombre: S2
            pide: S, donde JJ′ sale por el cortado, en el alzado
            es: proy_alzado(solucion.S)
            bien: |
              S₂ está en J₂J′₂ prolongada, en la vertical de Q₁. P₂Q₂S₂R₂ es la boca de salida.
            diagnosticos:
              - si: cerca_de(solucion.S_EFp)
                mensaje: |
                  Esa es la arista de delante del cortado, E′₂F′₂: E′F′ pasa ahí 12,5 mm por delante de JJ′. JJ′
                  sale por el cortado antes, en la vertical de Q₁.
                ejemplo: solucion.S_EFp
              - si: '!en_recta(figura.segmento("JJ2"))'
                mensaje: |
                  S es un punto de la arista JJ′: S₂ va **en J₂J′₂**, prolongada.
                ejemplo: 'desplaza(proy_alzado(solucion.S), dy: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en J₂J′₂ prolongada, pero no en la vertical de Q₁.
          - nombre: L1
            pide: L, en la planta
            es: proy_planta(solucion.L)
            bien: |
              L₁ está en H₁H′₁ prolongada, en la vertical de L₂. K₁L₁ es la planta del techo de la boca.
            diagnosticos:
              - si: '!en_vertical_de(L2)'
                mensaje: |
                  L₁ va en la **vertical de L₂**.
                ejemplo: 'desplaza(proy_planta(solucion.L), dx: mm(5))'
              - si: siempre
                mensaje: |
                  Estás en la vertical de L₂, pero no en la pared: L₁ va en H₁H′₁ prolongada.
          - nombre: N1
            pide: N, en la planta
            es: proy_planta(solucion.N)
            bien: |
              N₁ está en H₁H′₁, en la vertical de N₂. M₁N₁ es la planta del suelo de la boca.
            diagnosticos:
              - si: '!en_vertical_de(N2)'
                mensaje: |
                  N₁ va en la **vertical de N₂**.
                ejemplo: 'desplaza(proy_planta(solucion.N), dx: mm(-5))'
              - si: siempre
                mensaje: |
                  Estás en la vertical de N₂, pero no en la pared: N₁ va en H₁H′₁, la misma recta que J₁J′₁.
        # Decisión: la montaña y el funicular, opacos. La visibilidad sale de
        # KIT\visibilidad.mjs (rayos contra las caras de los dos bloques, la
        # montaña con el túnel hecho, partida en piezas convexas, vis\sd49). Lo
        # que cae encima de algo ya dibujado y visto no es tramo: la boca de
        # salida en la planta (encima de E₁E′₁) y los trozos de las paredes por
        # el rellano en el alzado (encima de la recta del rellano). En la planta,
        # GG′ e II′ caen una encima de otra, y HH′ y JJ′ también: de M₁ a K₁ se ve
        # el borde de la boca, y de K₁ a P₁ las dos aristas van ocultas.
        tramos:
          - traza: segmento2(proy_planta(solucion.M), proy_planta(solucion.K))
            tipo: visto
            porque: 'De M₁ a K₁, la pared de atrás corta la primera ladera, el rellano y la segunda: es el borde de la boca, en caras que miran hacia arriba, y nada lo tapa. II′ va justo debajo, en la misma vertical.'
          - traza: segmento2(proy_planta(solucion.K), proy_planta(solucion.P))
            tipo: oculto
            porque: 'De K₁ a P₁, GG′ e II′, que en la planta caen una encima de otra, van por dentro de la montaña: desde arriba las tapan la segunda ladera y la cima.'
          - traza: segmento2(proy_planta(solucion.N), proy_planta(solucion.L))
            tipo: visto
            porque: 'De N₁ a L₁, la pared de delante corta las dos laderas y el rellano: es el borde de la boca, y nada lo tapa.'
          - traza: segmento2(proy_planta(solucion.L), proy_planta(solucion.Q))
            tipo: oculto
            porque: 'De L₁ a Q₁, HH′ y JJ′ van por dentro de la montaña: desde arriba las tapan la segunda ladera y la cima.'
          - traza: segmento2(proy_planta(solucion.K), proy_planta(solucion.L))
            tipo: visto
            porque: 'KL, el techo de la boca de entrada, está en la segunda ladera, que mira hacia arriba: nada lo tapa.'
          - traza: segmento2(proy_planta(solucion.M), proy_planta(solucion.N))
            tipo: visto
            porque: 'MN, el suelo de la boca, está en la primera ladera, que mira hacia arriba: nada lo tapa.'
          - traza: segmento2(proy_alzado(solucion.K), proy_alzado(solucion.P))
            tipo: oculto
            porque: 'GG′ va por dentro de la montaña de K a P: por delante la tapa la segunda ladera, que en ese tramo queda delante del túnel.'
          - traza: segmento2(proy_alzado(solucion.L), proy_alzado(solucion.Q))
            tipo: oculto
            porque: 'HH′ va por dentro de la montaña: por delante la tapan la segunda ladera y el extremo de delante de la montaña.'
          - traza: segmento2(proy_alzado(solucion.M), solucion.k_IR_NX2)
            tipo: visto
            porque: 'II′ es la arista de abajo de la pared de atrás: desde M se ve por la boca de entrada, que mira hacia delante, hasta que pasa detrás del borde de la pared de delante, N₂X₂.'
          - traza: segmento2(solucion.k_IR_NX2, proy_alzado(solucion.R))
            tipo: oculto
            porque: 'Desde el cruce con N₂X₂, II′ queda detrás de la pared de delante del túnel, que en ese cruce aparente va 37,2 mm más cerca de quien mira, y de la montaña: oculta hasta R.'
          - traza: segmento2(proy_alzado(solucion.N), proy_alzado(solucion.S))
            tipo: oculto
            porque: 'JJ′ es la arista de abajo de la pared de delante: desde N la tapa la primera ladera, que queda delante de esa pared, y luego el extremo de delante de la montaña.'
          - traza: segmento2(proy_alzado(solucion.K), proy_alzado(solucion.L))
            tipo: visto
            porque: 'KL, el techo de la boca, está en la segunda ladera, que mira hacia delante: nada lo tapa.'
          - traza: segmento2(proy_alzado(solucion.M), proy_alzado(solucion.N))
            tipo: visto
            porque: 'MN, el suelo de la boca, está en la primera ladera, que mira hacia delante; el funicular queda a su izquierda: nada lo tapa.'
          - traza: segmento2(proy_alzado(solucion.M), proy_alzado(solucion.T))
            tipo: visto
            porque: 'MT, el borde de la boca por la pared de atrás en la primera ladera: la ladera mira hacia delante, y nada lo tapa.'
          - traza: segmento2(proy_alzado(solucion.U), proy_alzado(solucion.K))
            tipo: visto
            porque: 'UK, el mismo borde en la segunda ladera: nada lo tapa.'
          - traza: segmento2(proy_alzado(solucion.N), proy_alzado(solucion.X))
            tipo: visto
            porque: 'NX, el borde de la boca por la pared de delante en la primera ladera: nada lo tapa.'
          - traza: segmento2(proy_alzado(solucion.Y), proy_alzado(solucion.L))
            tipo: visto
            porque: 'YL, el mismo borde en la segunda ladera: nada lo tapa.'
          - traza: segmento2(proy_alzado(solucion.P), proy_alzado(solucion.Q))
            tipo: oculto
            porque: 'La boca de salida está en el cortado, que mira hacia atrás: PQ, su techo, lo tapan la segunda ladera y el extremo de delante de la montaña.'
          - traza: segmento2(proy_alzado(solucion.Q), proy_alzado(solucion.S))
            tipo: oculto
            porque: 'QS, el lado de la boca de salida por la pared de delante: lo tapa el extremo de delante de la montaña.'
          - traza: segmento2(proy_alzado(solucion.S), proy_alzado(solucion.R))
            tipo: oculto
            porque: 'SR, el suelo de la boca de salida: lo tapan la pared de delante del túnel y el extremo de delante de la montaña.'
          - traza: segmento2(proy_alzado(solucion.R), proy_alzado(solucion.P))
            tipo: oculto
            porque: 'RP, el lado de la boca de salida por la pared de atrás, la más lejana: lo tapan la pared de delante y el techo del túnel, y la montaña por delante.'
        trazado:
          - segmento2(solucion.Z1_2, solucion.T_2)
          - segmento2(solucion.U_2, solucion.Z2_2)
          - segmento2(solucion.Z4_2, solucion.X_2)
          - segmento2(solucion.Y_2, solucion.Z5_2)
        construccion:
          - con: regla
            traza: segmento2(figura.punto("G1"), solucion.L_w1)
            porque: |
              **La pared de atrás.** La cara GG′I′I del funicular es vertical, y en la planta se ve como la
              recta G₁G′₁, que pasa también por I₁ e I′₁. Prolongada con la regla hacia la derecha, hasta pasar
              E₁E′₁, es el plano auxiliar de las aristas GG′ e II′.
          - con: marca
            traza: solucion.w1_Z1
            porque: |
              1₁, donde la recta de la pared cruza A₁A′₁: el pie de la primera ladera. Los puntos 1, 2, 4 y 5,
              como T, U, X e Y y las entradas y salidas, de K a S, son nombres nuestros; la lámina solo rotula
              los bloques. Va sin rótulo: M₁, a 2,8 mm, lo taparía.
          - con: marca
            traza: solucion.w1_T
            porque: |
              T₁, donde la pared cruza B₁B′₁, el borde de abajo del rellano. Va sin rótulo: U₁, a 5,6 mm, lo taparía.
          - con: marca
            traza: solucion.w1_U
            porque: |
              U₁, donde la pared cruza C₁C′₁, el borde de arriba del rellano. Va sin rótulo: K₁, a 5,3 mm, lo taparía.
          - con: marca
            traza: solucion.w1_Z2
            rotulo: 2₁
            porque: |
              2₁, donde la pared cruza D₁D′₁, arriba de la segunda ladera.
          - con: marca
            traza: proy_planta(solucion.P)
            rotulo: P₁
            porque: |
              P₁, donde la pared cruza E₁E′₁, el cortado. La pared y el cortado son verticales: se cortan en
              una vertical, y las dos aristas de la pared salen por ella. P₁ es también R₁.
          - con: escuadra-cartabon
            traza: '[segmento2(solucion.w1_Z1, solucion.L_Z1_2), segmento2(solucion.w1_T, solucion.L_T_2), segmento2(solucion.w1_U, solucion.L_U_2), segmento2(solucion.w1_Z2, solucion.L_Z2_2), segmento2(proy_planta(solucion.P), solucion.L_P_2)]'
            porque: |
              Por 1₁, T₁, U₁, 2₁ y P₁, las verticales hacia el alzado: cada una hasta pasar la altura de su
              arista (el pie, el rellano o la cima), y la de P₁, el cortado entero.
          - con: marca
            traza: solucion.Z1_2
            rotulo: 1₂
            porque: |
              1₂, donde la vertical de 1₁ corta A₂A′₂, la recta del pie.
          - con: marca
            traza: solucion.T_2
            porque: |
              T₂, donde la vertical de T₁ corta la recta del rellano. Va sin rótulo: U₂, a 5,4 mm, lo taparía.
          - con: marca
            traza: solucion.U_2
            rotulo: U₂
            porque: |
              U₂, donde la vertical de U₁ corta la recta del rellano.
          - con: marca
            traza: solucion.Z2_2
            rotulo: 2₂
            porque: |
              2₂, donde la vertical de 2₁ corta la recta de la cima, D₂D′₂.
          - con: regla
            traza: '[segmento2(solucion.Z1_2, solucion.T_2), segmento2(solucion.U_2, solucion.Z2_2)]'
            porque: |
              1₂T₂ y U₂2₂: los cortes de la pared de atrás con la primera ladera y con la segunda. Con el trozo
              T₂U₂, por el rellano, y la vertical de P₁, por el cortado, son la poligonal en que la pared
              corta la montaña.
          - con: regla
            traza: '[segmento2(figura.punto("G2"), solucion.L_g2), segmento2(figura.punto("I2"), solucion.L_i2)]'
            porque: |
              G₂G′₂ e I₂I′₂, prolongadas con la regla hacia la derecha hasta pasar la vertical de P₁: las
              aristas GG′ e II′ del túnel. Están en la pared, como la poligonal, así que donde la cortan en el
              alzado la cortan de verdad.
          - con: marca
            traza: proy_alzado(solucion.K)
            rotulo: K₂
            porque: |
              K₂, donde G₂G′₂ corta U₂2₂: GG′ entra en la montaña por la segunda ladera.
          - con: marca
            traza: proy_alzado(solucion.M)
            rotulo: M₂
            porque: |
              M₂, donde I₂I′₂ corta 1₂T₂: II′ entra por la primera ladera.
          - con: marca
            traza: proy_alzado(solucion.P)
            rotulo: P₂
            porque: |
              P₂, donde G₂G′₂ corta la vertical de P₁: GG′ sale por el cortado.
          - con: marca
            traza: proy_alzado(solucion.R)
            rotulo: R₂
            porque: |
              R₂, donde I₂I′₂ corta la vertical de P₁: II′ sale por el cortado.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_alzado(solucion.K), solucion.L_K1), segmento2(proy_alzado(solucion.M), solucion.L_M1)]'
            porque: |
              Por K₂ y M₂, las verticales hacia la planta, hasta pasar la recta de la pared.
          - con: marca
            traza: proy_planta(solucion.K)
            porque: |
              K₁, donde la vertical de K₂ corta G₁G′₁ prolongada. Va sin rótulo: 2₁, a 4,9 mm, lo taparía.
          - con: marca
            traza: proy_planta(solucion.M)
            porque: |
              M₁, donde la vertical de M₂ corta la misma recta de la pared. Va sin rótulo: T₁, a 5,6 mm, lo taparía.
          - con: regla
            traza: segmento2(figura.punto("H1"), solucion.L_w4)
            porque: |
              **La pared de delante**, igual: la recta H₁H′₁, que pasa por J₁ y J′₁, prolongada hasta pasar
              E₁E′₁.
          - con: marca
            traza: solucion.w4_Z4
            porque: |
              4₁, donde la pared de delante cruza A₁A′₁. Va sin rótulo: N₁, a 3,9 mm, lo taparía.
          - con: marca
            traza: solucion.w4_X
            porque: |
              X₁, donde cruza B₁B′₁. Va sin rótulo: Y₁, a 5,6 mm, lo taparía.
          - con: marca
            traza: solucion.w4_Y
            porque: |
              Y₁, donde cruza C₁C′₁. Va sin rótulo: L₁, a 6,4 mm, lo taparía.
          - con: marca
            traza: solucion.w4_Z5
            rotulo: 5₁
            porque: |
              5₁, donde la pared de delante cruza D₁D′₁, arriba de la segunda ladera.
          - con: marca
            traza: proy_planta(solucion.Q)
            rotulo: Q₁
            porque: |
              Q₁, donde la pared de delante cruza E₁E′₁, el cortado. Es también S₁.
          - con: escuadra-cartabon
            traza: '[segmento2(solucion.w4_Z4, solucion.L_Z4_2), segmento2(solucion.w4_X, solucion.L_X_2), segmento2(solucion.w4_Y, solucion.L_Y_2), segmento2(solucion.w4_Z5, solucion.L_Z5_2), segmento2(proy_planta(solucion.Q), solucion.L_Q_2)]'
            porque: |
              Por 4₁, X₁, Y₁, 5₁ y Q₁, las verticales hacia el alzado, hasta la altura de su arista; la de Q₁,
              el cortado entero.
          - con: marca
            traza: solucion.Z4_2
            rotulo: 4₂
            porque: |
              4₂, donde la vertical de 4₁ corta la recta del pie.
          - con: marca
            traza: solucion.X_2
            porque: |
              X₂, donde la vertical de X₁ corta la recta del rellano. Va sin rótulo: Y₂, a 5,4 mm, lo taparía.
          - con: marca
            traza: solucion.Y_2
            rotulo: Y₂
            porque: |
              Y₂, donde la vertical de Y₁ corta la recta del rellano.
          - con: marca
            traza: solucion.Z5_2
            rotulo: 5₂
            porque: |
              5₂, donde la vertical de 5₁ corta la recta de la cima.
          - con: regla
            traza: '[segmento2(solucion.Z4_2, solucion.X_2), segmento2(solucion.Y_2, solucion.Z5_2)]'
            porque: |
              4₂X₂ e Y₂5₂, los cortes de la pared de delante con las dos laderas.
          - con: regla
            traza: '[segmento2(figura.punto("H2"), solucion.L_h2), segmento2(figura.punto("J2"), solucion.L_j2)]'
            porque: |
              H₂H′₂ y J₂J′₂, prolongadas hasta pasar la vertical de Q₁: las aristas HH′ y JJ′ del túnel.
          - con: marca
            traza: proy_alzado(solucion.L)
            porque: |
              L₂, donde H₂H′₂ corta Y₂5₂: HH′ entra por la segunda ladera. Va sin rótulo: P₂, a 5,6 mm, lo taparía.
          - con: marca
            traza: proy_alzado(solucion.N)
            rotulo: N₂
            porque: |
              N₂, donde J₂J′₂ corta 4₂X₂: JJ′ entra por la primera ladera.
          - con: marca
            traza: proy_alzado(solucion.Q)
            rotulo: Q₂
            porque: |
              Q₂, donde H₂H′₂ corta la vertical de Q₁: HH′ sale por el cortado.
          - con: marca
            traza: proy_alzado(solucion.S)
            rotulo: S₂
            porque: |
              S₂, donde J₂J′₂ corta la vertical de Q₁: JJ′ sale por el cortado.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_alzado(solucion.L), solucion.L_L1), segmento2(proy_alzado(solucion.N), solucion.L_N1)]'
            porque: |
              Por L₂ y N₂, las verticales hacia la planta, hasta pasar la recta de la pared de delante.
          - con: marca
            traza: proy_planta(solucion.L)
            porque: |
              L₁, donde la vertical de L₂ corta H₁H′₁ prolongada. Va sin rótulo: 5₁, a 3,9 mm, lo taparía.
          - con: marca
            traza: proy_planta(solucion.N)
            porque: |
              N₁, donde la vertical de N₂ corta la misma recta. Va sin rótulo: X₁, a 4,5 mm, lo taparía.
          - con: arista-vista
            traza: '[segmento2(proy_planta(solucion.M), proy_planta(solucion.K)), segmento2(proy_planta(solucion.N), proy_planta(solucion.L)), segmento2(proy_planta(solucion.K), proy_planta(solucion.L)), segmento2(proy_planta(solucion.M), proy_planta(solucion.N))]'
            porque: |
              **A limpio, la planta.** Desde arriba se ve la boca de entrada, que está en las laderas y el
              rellano: sus bordes por las dos paredes, de M a K y de N a L, el techo KL y el suelo MN.
          - con: arista-oculta
            traza: '[segmento2(proy_planta(solucion.K), proy_planta(solucion.P)), segmento2(proy_planta(solucion.L), proy_planta(solucion.Q))]'
            porque: |
              A trazos, las aristas del túnel por dentro de la montaña, de K y L hasta el cortado: dos rectas,
              porque cada pared lleva dos aristas una encima de la otra. La boca de salida cae encima de
              E₁E′₁, que ya está.
          - con: arista-vista
            traza: '[segmento2(proy_alzado(solucion.K), proy_alzado(solucion.L)), segmento2(proy_alzado(solucion.M), proy_alzado(solucion.N)), segmento2(proy_alzado(solucion.M), proy_alzado(solucion.T)), segmento2(proy_alzado(solucion.U), proy_alzado(solucion.K)), segmento2(proy_alzado(solucion.N), proy_alzado(solucion.X)), segmento2(proy_alzado(solucion.Y), proy_alzado(solucion.L)), segmento2(proy_alzado(solucion.M), solucion.k_IR_NX2)]'
            porque: |
              **El alzado.** Las laderas miran hacia delante, y la boca de entrada se ve entera: el techo, el
              suelo y sus bordes por las dos paredes; los trozos del rellano caen encima de su recta. Por la
              boca se ve también la arista de abajo de la pared de atrás, II′, hasta que pasa detrás de la
              pared de delante.
          - con: arista-oculta
            traza: '[segmento2(proy_alzado(solucion.K), proy_alzado(solucion.P)), segmento2(proy_alzado(solucion.L), proy_alzado(solucion.Q)), segmento2(solucion.k_IR_NX2, proy_alzado(solucion.R)), segmento2(proy_alzado(solucion.N), proy_alzado(solucion.S)), segmento2(proy_alzado(solucion.P), proy_alzado(solucion.Q)), segmento2(proy_alzado(solucion.Q), proy_alzado(solucion.S)), segmento2(proy_alzado(solucion.S), proy_alzado(solucion.R)), segmento2(proy_alzado(solucion.R), proy_alzado(solucion.P))]'
            porque: |
              A trazos, lo que queda dentro de la montaña o detrás: las cuatro aristas del túnel, salvo el
              trozo de II′ que se ve por la boca, y la boca de salida entera, porque el cortado mira hacia
              atrás.
        pista: |
          (1) En la planta, G₁G′₁ prolongada es la pared de atrás: corta A₁A′₁, B₁B′₁, C₁C′₁, D₁D′₁ y E₁E′₁.
          (2) Sube cada cruce a la altura de su arista; 1₂T₂ y U₂2₂ son los cortes con las laderas, y la
          vertical de P₁, con el cortado. (3) G₂G′₂ e I₂I′₂ prolongadas cortan esa poligonal en K₂ y M₂, y la
          vertical en P₂ y R₂; baja K₂ y M₂ a la pared. (4) Igual con H₁H′₁: L, N, Q y S. (5) La boca de
          entrada se ve en las dos vistas; la de salida, en el alzado, queda detrás.
        desarrollo: |
          En verde claro, en el alzado, los cortes de las dos paredes con las laderas, y en las dos vistas
          las aristas del túnel y las bocas, con lo oculto a trazos. El túnel entra por las laderas, con la
          boca de entrada atravesando el rellano, y sale por el cortado. En el papel, el agujero se lleva el
          trozo de los bordes del rellano que queda entre las dos paredes: en la planta, B₁B′₁ entre T₁ y
          X₁, y C₁C′₁ entre U₁ e Y₁; en el alzado, la recta del rellano entre U₂ y X₂, por donde se ve el
          interior del túnel. Esos trozos se borran.

      - tipo: calcular
        titulo: La altura de la boca de salida
        pregunta: Como pregunta nuestra, ¿qué altura tiene la boca de salida en el cortado, de P a R?
        respuesta:
          tipo: numero
          valor: '33.43'
          receta: alto_PR_mm
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '31.53'
            receta: en_mm(vm(G, I))
            mensaje: |
              Eso es lo que mide la arista GI del funicular, la altura de la cabina perpendicular a sus
              aristas. El cortado es vertical y el túnel sube, así que lo corta de refilón, y la boca sale más
              alta que la cabina.
          - valor: '35.99'
            receta: en_mm(vm(G, H))
            mensaje: |
              Eso es GH, el ancho de la cabina, de una pared del túnel a la otra. PR es el lado de la boca que
              va por la pared de atrás: su altura.
          - valor: '37.39'
            receta: en_mm(vm(solucion.P, solucion.Q))
            mensaje: |
              Eso es PQ, el techo de la boca de salida, de una pared a otra: su ancho, no su altura.
        pista: |
          PR está en el cortado y en la pared de atrás, que son verticales: es una recta vertical, y en el
          alzado se ve en verdadera magnitud.
        desarrollo: |
          P y R están en la misma vertical, la de P₁, así que PR es vertical y el alzado lo da sin acortar:
          es lo que P₂ está por encima de R₂, 33,43 mm. La cabina mide 31,53 mm de alto, perpendicular a sus
          aristas; como el túnel sube 20° y el cortado es vertical, la boca sale más alta: 31,53 / cos 20° ≈
          33,5 mm. Q₂S₂, el otro lado de la boca, mide lo mismo, 33,45. Y en el alzado hay otras medidas
          que caen dentro de la tolerancia por casualidad, sin ser PR: las aristas de la montaña, A₂A′₂,
          B₂B′₂ y las demás, miden 33,74 mm.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: El funicular sube en la dirección de GG′, la única de sus aristas que lo lleva a través de la montaña, y el túnel es el prisma de aristas GG′, HH′, II′ y JJ′ prolongadas.
          - texto: Las caras GG′I′I y HH′J′J del funicular son verticales, porque G₁G′₁ pasa por I₁ y H₁H′₁ por J₁, y son las paredes del túnel.
          - texto: El plano vertical de cada pared corta la montaña en una poligonal, que sale de subir al alzado los cruces de la pared con las aristas de la montaña en la planta.
          - texto: Donde G₂G′₂ e I₂I′₂, o H₂H′₂ y J₂J′₂, cortan esa poligonal están la entrada, en una ladera, y la salida, en el cortado, y se bajan a la pared en la planta.
          - texto: Las entradas están donde G₂G′₂ e I₂I′₂ cruzan en el alzado las aristas de la montaña, como C₂D₂ o A₂B₂.
            trampa: true
            mensaje: |
              Esos son cruces aparentes con las aristas del extremo de atrás de la montaña: GG′ pasa 11,5 mm
              por delante de CD, todavía fuera. La pared corta la ladera más adelante, y la entrada sale del
              corte de la pared, U₂2₂.
    resolucion: |
      **El túnel.** El funicular se mueve en la dirección de GG′, que sube 20° hacia la derecha: es la única
      de sus aristas que lo lleva a través de la montaña. El túnel es el prisma que barre: de aristas GG′,
      HH′, II′ y JJ′, prolongadas, y sección GHJI, de 36 × 31,5 mm. Sus caras GG′I′I y HH′J′J son
      verticales: en la planta, cada una es una recta, y lleva dos aristas una encima de otra.

      **Las entradas y las salidas.** El plano auxiliar de cada pared es la propia pared. En la planta,
      la pared de atrás, G₁G′₁ prolongada, corta las aristas de la montaña en 1, T, U, 2 y P; subidos al
      alzado a su altura, 1₂T₂ y U₂2₂ son los cortes con las dos laderas, y la vertical de P₁, con el
      cortado. G₂G′₂ entra en K₂, en la segunda ladera, e I₂I′₂ en M₂, en la primera; las dos salen por
      el cortado, en P₂ y R₂. Con la pared de delante salen L, N, Q y S. La boca de entrada atraviesa el
      rellano, y la de salida es un paralelogramo en el cortado.

      **Lo que se ve.** En la planta se ve la boca de entrada, y las aristas van ocultas por dentro de la
      montaña hasta el cortado; la boca de salida cae en E₁E′₁. En el alzado se ve la boca de entrada y,
      por ella, un trozo de II′; lo demás va oculto, y la boca de salida también, porque el cortado mira
      hacia atrás. En el papel, el agujero se lleva los trozos de los bordes del rellano que quedan entre
      las dos paredes.
