ejercicios:
  # Decisión: delante, el ejemplo de entrada del tema, nuestro (§04, §08,
  # §15). Después, los ejercicios de la colección de este tema, cada uno en su
  # sitio del orden de la colección (§04). A 8 de octubre de 2026 están todos:
  # del 22 al 32 (SD29, SD30, SD32, SD33, SD34, SD35, SD38, SD41, SD42, SD43 y
  # SD44) y el 34 (SD49). El 33 (SD47), el tubo perpendicular al fondo de una
  # tolva, es del tema 5, y el apartado 1 del 53 y el 1 a del 54 están en sus
  # páginas de examen.
  - id: ri3-la-varilla-que-atraviesa-la-placa
    titulo: Dónde atraviesa la varilla la placa
    fuente: Ejemplo introductorio · Road to Ingeniería. La figura y los datos son nuestros. No es de examen ni de la colección de ejercicios.
    nivel: ejemplo
    # Decisión: el ejemplo de entrada del tema (§04, §08, §15), nuestro y
    # delante de los de la colección. Entrena lo primero que explica la prosa:
    # el punto donde una recta atraviesa un plano dado por tres puntos, con el
    # plano vertical auxiliar que contiene la recta, y por qué el cruce de las
    # proyecciones no es el punto. Sin visibilidad: viene después en el tema
    # («Lo que se ve»), y la lámina dibuja la varilla entera en continua. La
    # lámina, RI3, es nuestra; I cae en un punto redondo, 25 mm más alto que A.
    enunciado: |
      Una varilla recta, PQ, atraviesa una placa triangular, ABC. Las dos vienen dadas en alzado, arriba,
      y en planta, debajo, sin línea de tierra. Hallar las dos proyecciones del punto I en que la varilla
      atraviesa la placa, con un plano auxiliar, y decir cuánto más alto que A está.

      **Notas nuestras.** El ejercicio y la figura son nuestros, a escala 1:1: las medidas son milímetros
      de la lámina, que se toman con «medir» en el Taller o con la regla en el papel. r₂ y r₁ son las dos
      proyecciones de la varilla. Llamamos 1 y 2 a los puntos donde el plano vertical que contiene la
      varilla corta los lados CA y BC, como en la figura del tema. No se pregunta qué trozo de la varilla
      tapa la placa: la lámina la dibuja entera, en continua.
    pide: Por qué los cruces de las proyecciones no son el punto, 1₂, 2₂, I₂ e I₁, y cuánto más alto que A está I.
    receta:
      lamina: ri3
      escena:
        A: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("A1"))'
        B: 'punto3(alzado: figura.punto("B2"), planta: figura.punto("B1"))'
        C: 'punto3(alzado: figura.punto("C2"), planta: figura.punto("C1"))'
        P: 'punto3(alzado: figura.punto("P2"), planta: figura.punto("P1"))'
        Q: 'punto3(alzado: figura.punto("Q2"), planta: figura.punto("Q1"))'
        placa: plano(A, B, C)
        # El plano vertical que contiene la varilla: P, Q y P bajado 10 mm.
        Pb: 'punto3(alzado: desplaza(figura.punto("P2"), dy: mm(10)), planta: figura.punto("P1"))'
        pv: plano(P, Q, Pb)
      solucion:
        I: corte_recta_plano(segmento3(P, Q), placa)
        # 1 y 2: donde el plano vertical de la varilla corta los lados CA y BC.
        U: corte_recta_plano(segmento3(C, A), pv)
        V: corte_recta_plano(segmento3(B, C), pv)
        cota_mm: en_mm(diferencia_de_cotas(I, A))
        # Los dos cruces aparentes de r₂ con el contorno del alzado, y su cota
        # sobre A: un punto con ese alzado y cualquier planta en su vertical.
        X: 'cruce_aparente(figura.segmento("r2"), figura.segmento("CA2"))'
        Y: 'cruce_aparente(figura.segmento("r2"), figura.segmento("AB2"))'
        horA1: 'perpendicular(por: figura.punto("A1"), a: segmento2(figura.punto("A1"), figura.punto("A2")))'
        Xr: 'punto3(alzado: X, planta: pie_perpendicular(X, horA1))'
        Yr: 'punto3(alzado: Y, planta: pie_perpendicular(Y, horA1))'
        cotaX_mm: en_mm(diferencia_de_cotas(Xr, A))
        cotaY_mm: en_mm(diferencia_de_cotas(Yr, A))
        # Lo que I₁ está por debajo de A₁: la diferencia de alejamientos, el
        # error de leer la altura en la planta.
        Ialej: 'punto3(alzado: proy_alzado(I), planta: pie_perpendicular(proy_planta(I), horA1))'
        alej_mm: en_mm(vm_planta(I, Ialej))
        # Donde las verticales de 1₁ y de 2₁ cruzan A₂B₂: el error de pararse en
        # el primer lado que se encuentra.
        U_AB: 'cruce_aparente(segmento2(proy_planta(U), proy_alzado(U)), figura.segmento("AB2"))'
        V_AB: 'cruce_aparente(segmento2(proy_planta(V), proy_alzado(V)), figura.segmento("AB2"))'
        recta12: segmento2(proy_alzado(U), proy_alzado(V))
      comprueba:
        - en_plano(I, pv)
        - en_plano(U, placa)
        - en_plano(V, placa)
    pasos:
      - tipo: reconocer
        pregunta: En el alzado, r₂ cruza el contorno de la placa por C₂A₂ y por A₂B₂; en la planta, r₁ cruza C₁A₁ y B₁C₁. ¿Dónde atraviesa la varilla la placa?
        opciones:
          - texto: Donde r₂ entra en el triángulo cruzando C₂A₂; I₁ se baja luego por su vertical
            mensaje: |
              Ese cruce es aparente: en el alzado, la varilla y el lado CA caen uno encima del otro, pero en el
              espacio no se tocan, porque el lado pasa 8 mm por delante. El punto que se busca está dentro de
              la placa, no en su borde.
          - texto: En ninguno de esos cruces, sino donde la corta un plano auxiliar que contiene la varilla
            correcta: true
            mensaje: |
              Eso es. Los cruces de las proyecciones son aparentes. El plano vertical que contiene la varilla
              corta la placa en una recta, la 12, y esa recta y la varilla, que están en el mismo plano, sí se
              cortan: ahí está I.
          - texto: Donde r₁ cruza C₁A₁ en la planta, que es donde la varilla pasa por encima de ese lado de la placa
            mensaje: |
              También es un cruce aparente, ahora en la planta: la varilla pasa 26 mm por encima del lado CA,
              sin tocarlo. Ese cruce sirve, pero de otra cosa: es 1₁, el punto donde el plano auxiliar corta el
              lado.
          - texto: En el punto medio de los dos cruces de r₂ con el contorno del alzado, porque la varilla entra por uno y sale por el otro
            mensaje: |
              La varilla no entra por un borde y sale por otro: atraviesa la placa en un solo punto, porque la
              placa es plana. Y ese punto no tiene por qué estar a medio camino de nada.

      - tipo: construir
        titulo: El punto I, con el plano vertical de la varilla
        intro: |
          El plano vertical que contiene la varilla se ve en la planta como la propia r₁. Corta los lados de
          la placa donde r₁ los cruza: en 1₁, sobre C₁A₁, y en 2₁, sobre B₁C₁ (nombres nuestros). Sube 1₁ y 2₁
          por sus verticales a los alzados de esos mismos lados: 1₂ en C₂A₂ y 2₂ en B₂C₂. La recta 1₂2₂ y r₂
          están en el mismo plano, y se cortan de verdad en I₂; I₁ baja por su vertical hasta r₁. Marca 1₂,
          2₂, I₂ e I₁. Ojo: las dos verticales cruzan antes A₂B₂.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, borrar]
        tolerancia: 1
        objetivos:
          - nombre: uno2
            rotulo: 1₂
            pide: 1₂, el alzado del punto donde el plano vertical de la varilla corta el lado CA
            es: proy_alzado(solucion.U)
            bien: |
              1₂ está en C₂A₂, en la vertical de 1₁: el punto 1 es del lado CA, y está en el plano vertical de
              la varilla.
            diagnosticos:
              - si: cerca_de(solucion.U_AB)
                mensaje: |
                  Te has parado en A₂B₂. En la planta, r₁ cruza el lado **CA**, así que 1 es un punto de CA: 1₂ va
                  donde la vertical de 1₁ corta C₂A₂, más arriba.
                ejemplo: solucion.U_AB
              - si: '!en_vertical_de(proy_planta(solucion.U))'
                mensaje: |
                  1₂ va en la **vertical de 1₁**, el cruce de r₁ con C₁A₁: es el mismo punto, visto en las dos
                  vistas.
                ejemplo: 'desplaza(proy_alzado(solucion.U), dx: mm(5))'
              - si: siempre
                mensaje: |
                  Estás en la vertical de 1₁, pero no en C₂A₂: 1₂ es donde esa vertical corta el alzado del lado
                  CA.
          - nombre: dos2
            rotulo: 2₂
            pide: 2₂, el alzado del punto donde el plano vertical de la varilla corta el lado BC
            es: proy_alzado(solucion.V)
            bien: |
              2₂ está en B₂C₂, en la vertical de 2₁: el punto 2 es del lado BC, y está en el plano vertical de
              la varilla.
            diagnosticos:
              - si: cerca_de(solucion.V_AB)
                mensaje: |
                  Te has parado en A₂B₂. En la planta, r₁ cruza el lado **BC**, así que 2 es un punto de BC: 2₂ va
                  donde la vertical de 2₁ corta B₂C₂, más arriba.
                ejemplo: solucion.V_AB
              - si: '!en_vertical_de(proy_planta(solucion.V))'
                mensaje: |
                  2₂ va en la **vertical de 2₁**, el cruce de r₁ con B₁C₁.
                ejemplo: 'desplaza(proy_alzado(solucion.V), dx: mm(-5))'
              - si: siempre
                mensaje: |
                  Estás en la vertical de 2₁, pero no en B₂C₂: 2₂ es donde esa vertical corta el alzado del lado
                  BC.
          - nombre: I2
            pide: el alzado de I, el punto en que la varilla atraviesa la placa
            es: proy_alzado(solucion.I)
            bien: |
              I₂ está donde r₂ corta 1₂2₂: la varilla y la recta 12 están en el plano vertical de la varilla, y
              ahí se cortan de verdad.
            diagnosticos:
              - si: cerca_de(solucion.X)
                mensaje: |
                  Ese es el cruce de r₂ con C₂A₂: un **cruce aparente**. En el espacio, la varilla y el lado CA no
                  se tocan: el lado pasa 8 mm por delante. I₂ está donde r₂ corta la recta 1₂2₂.
                ejemplo: solucion.X
              - si: cerca_de(solucion.Y)
                mensaje: |
                  Ese es el cruce de r₂ con A₂B₂, otro cruce aparente: ahí la varilla pasa 22 mm por delante del
                  lado AB, sin tocarlo. I₂ está donde r₂ corta la recta 1₂2₂.
                ejemplo: solucion.Y
              - si: '!en_recta(figura.segmento("r2"))'
                mensaje: |
                  I es un punto de la varilla: I₂ va en **r₂**, donde la corta 1₂2₂.
                ejemplo: 'desplaza(proy_alzado(solucion.I), dx: mm(5))'
              - si: siempre
                mensaje: |
                  Estás en r₂, pero no donde la corta 1₂2₂, la recta que el plano vertical de la varilla deja en
                  la placa.
          - nombre: I1
            pide: la planta de I
            es: proy_planta(solucion.I)
            bien: |
              I₁ está en r₁, en la vertical de I₂. Por el camino, esa vertical atraviesa la planta de la placa:
              I₁ cae dentro de ella, entre 1₁ y 2₁.
            diagnosticos:
              - si: cerca_de(proy_planta(solucion.U))
                mensaje: |
                  Ese es 1₁, el cruce de r₁ con C₁A₁: ahí el plano auxiliar corta el lado CA, pero la varilla pasa
                  26 mm por encima del lado, sin tocarlo. I₁ baja de I₂ por su vertical.
                ejemplo: proy_planta(solucion.U)
              - si: cerca_de(proy_planta(solucion.V))
                mensaje: |
                  Ese es 2₁, el cruce de r₁ con B₁C₁, otro cruce de la planta: ahí la varilla pasa 28 mm por
                  debajo del lado BC. I₁ baja de I₂ por su vertical.
                ejemplo: proy_planta(solucion.V)
              - si: '!en_vertical_de(I2)'
                mensaje: |
                  I₁ va en la **vertical de I₂**: son el mismo punto, visto dos veces.
                ejemplo: 'desplaza(proy_planta(solucion.I), dx: mm(5))'
              - si: '!en_recta(figura.segmento("r1"))'
                mensaje: |
                  I es de la varilla: I₁ va donde la vertical de I₂ corta **r₁**.
                ejemplo: 'desplaza(proy_planta(solucion.I), dy: mm(5))'
              - si: siempre
                mensaje: |
                  I₁ está donde la vertical de I₂ corta r₁.
        trazado:
          - segmento2(proy_planta(solucion.U), proy_alzado(solucion.U))
          - segmento2(proy_planta(solucion.V), proy_alzado(solucion.V))
          - segmento2(proy_alzado(solucion.U), proy_alzado(solucion.V))
          - segmento2(proy_alzado(solucion.I), proy_planta(solucion.I))
        construccion:
          - con: marca
            traza: proy_planta(solucion.U)
            rotulo: 1₁
            porque: |
              1₁ (nombre nuestro), donde r₁ cruza C₁A₁: el plano vertical que contiene la varilla, que en la
              planta se ve como r₁, corta ahí el lado CA.
          - con: marca
            traza: proy_planta(solucion.V)
            rotulo: 2₁
            porque: |
              2₁ (nombre nuestro), donde r₁ cruza B₁C₁: ahí ese mismo plano corta el lado BC.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(solucion.U), proy_alzado(solucion.U)), segmento2(proy_planta(solucion.V), proy_alzado(solucion.V))]'
            porque: |
              Por 1₁ y 2₁, las verticales hacia arriba, hasta C₂A₂ y hasta B₂C₂: 1 está en el lado CA y 2 en el
              BC. Las dos cruzan antes A₂B₂, y ahí no hay que pararse.
          - con: marca
            traza: proy_alzado(solucion.U)
            rotulo: 1₂
            porque: |
              1₂, donde la vertical de 1₁ corta C₂A₂.
          - con: marca
            traza: proy_alzado(solucion.V)
            rotulo: 2₂
            porque: |
              2₂, donde la vertical de 2₁ corta B₂C₂.
          - con: regla
            traza: segmento2(proy_alzado(solucion.U), proy_alzado(solucion.V))
            porque: |
              1₂2₂, el alzado de la recta en que el plano vertical de la varilla corta la placa. Esa recta y la
              varilla están en el mismo plano, así que se cortan de verdad.
          - con: marca
            traza: proy_alzado(solucion.I)
            rotulo: I₂
            porque: |
              I₂ (nombre nuestro, el de la figura del tema), donde 1₂2₂ corta r₂: el punto en que la varilla
              atraviesa la placa, 25 mm por encima de la horizontal de A₂.
          - con: escuadra-cartabon
            traza: segmento2(proy_alzado(solucion.I), proy_planta(solucion.I))
            porque: |
              Por I₂, la vertical hacia abajo, hasta r₁.
          - con: marca
            traza: proy_planta(solucion.I)
            rotulo: I₁
            porque: |
              I₁, donde la vertical de I₂ corta r₁, dentro de la planta de la placa.
        pista: |
          (1) En la planta, r₁ cruza C₁A₁ en 1₁ y B₁C₁ en 2₁. (2) Sus verticales, hasta C₂A₂ y B₂C₂: 1₂ y 2₂.
          (3) 1₂2₂ corta r₂ en I₂. (4) La vertical de I₂ corta r₁ en I₁.
        desarrollo: |
          En verde claro, las verticales de 1 y de 2, la recta 1₂2₂ y la vertical de I. I₂ está a 6,8 mm del cruce
          aparente de r₂ con C₂A₂: el cruce de las proyecciones no es el punto.

      - tipo: calcular
        titulo: La altura del punto I
        pregunta: ¿Cuánto más alto que A atraviesa la varilla la placa?
        respuesta:
          tipo: numero
          valor: '25.00'
          receta: cota_mm
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '30.17'
            receta: cotaX_mm
            mensaje: |
              Esa es la altura del cruce de r₂ con **C₂A₂**, un cruce aparente: ahí la varilla no toca la placa.
              El punto I está donde r₂ corta 1₂2₂, más abajo.
          - valor: '11.08'
            receta: cotaY_mm
            mensaje: |
              Esa es la altura del cruce de r₂ con **A₂B₂**, otro cruce aparente. El punto I está donde r₂
              corta 1₂2₂.
          - valor: '13.00'
            receta: alej_mm
            mensaje: |
              Has medido en la **planta** lo que I₁ está por debajo de A₁: eso es la diferencia de
              alejamientos, lo que I está más lejos del plano vertical. La altura se mide en el alzado.
        pista: |
          Mide en el alzado, en vertical, lo que I₂ queda por encima de la horizontal de A₂.
        desarrollo: |
          I₂ está 25 mm por encima de la horizontal de A₂: I tiene 25 mm más de cota que A. Los cruces
          aparentes de r₂ con el contorno darían 30,17 mm (con C₂A₂) y 11,08 (con A₂B₂), y en la planta I₁ queda
          13 mm por debajo de A₁, que es otra cosa: lo que I está más lejos del plano vertical.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: 'El cruce de r₂ con el contorno del alzado no es el punto: ahí la varilla y un lado de la placa se cruzan sin tocarse.'
          - texto: El plano vertical que contiene la varilla se ve en la planta como r₁, y corta los lados CA y BC en 1 y 2, donde r₁ los cruza.
          - texto: 1₂ y 2₂ suben por sus verticales a C₂A₂ y B₂C₂, y 1₂2₂ es el alzado de la recta en que ese plano corta la placa.
          - texto: 'La varilla y la recta 12 están en el mismo plano y se cortan de verdad: en I₂, donde r₂ corta 1₂2₂; I₁ baja por su vertical a r₁.'
          - texto: I₁ es 1₁, el cruce de r₁ con C₁A₁, porque en la planta es ahí donde la varilla entra en la placa.
            trampa: true
            mensaje: |
              En la planta, r₁ cruza C₁A₁ en 1₁, pero la varilla pasa 26 mm por encima del lado CA, sin tocarlo:
              es un cruce aparente, como el del alzado. I₁ está en la vertical de I₂, unos 15 mm más allá sobre r₁.
    resolucion: |
      **Por qué no vale un cruce.** r₂ cruza C₂A₂ y A₂B₂, y r₁ cruza C₁A₁ y B₁C₁, pero en ninguno de esos
      sitios se tocan la varilla y la placa: son cruces aparentes, dos puntos distintos que en esa vista caen
      uno encima del otro.

      **El plano auxiliar.** El plano vertical que contiene la varilla se ve en la planta como r₁, y corta los
      lados CA y BC en 1₁ y 2₁. Por sus verticales, 1₂ cae en C₂A₂ y 2₂ en B₂C₂, y 1₂2₂ es el alzado de la
      recta en que ese plano corta la placa. Esa recta y la varilla están en el mismo plano, así que se cortan
      de verdad: en I₂. I₁ baja por su vertical hasta r₁.

      **La altura.** I₂ está 25 mm por encima de la horizontal de A₂: la varilla atraviesa la placa 25 mm más
      alto que A. El cruce aparente de r₂ con C₂A₂ queda a 6,8 mm de I₂, y a 30,17 mm sobre A.

  - id: sd29-la-recta-r-a-traves-de-la-chapa-doblada
    titulo: La recta r a través de la chapa doblada, y la chapa en verdadera magnitud
    fuente: Ejercicio 22 (SD29) · Colección de ejercicios de Geometría Descriptiva, Sistema Diédrico Directo · Dpto. de Expresión Gráfica y Proyectos de Ingeniería, EIG · UPV/EHU
    nivel: practica
    # Decisión: el texto impreso tal cual, cotejado con la página (pág. 23),
    # con sus dos apartados en párrafos. La hoja no nombra ningún vértice: A,
    # B, C, E, F y G son nombres nuestros, con las caras ABFE y BCGF, como las
    # llama el Ejercicio 26 (SD34). La recta atraviesa las dos caras: el
    # apartado a) son dos puntos, I y J, también nombres nuestros. La chapa se
    # toma opaca, como da a entender la figura (FE a trazos en el alzado).
    enunciado: |
      Se presenta una chapa doblada y la recta r. Se pide:

      a) Representar la intersección que genera la recta en la chapa.

      b) Calcular gráficamente la verdadera magnitud de la chapa.

      **Notas nuestras.** La figura es la chapa y la recta r en el alzado, arriba, y en la planta,
      debajo, sin línea de tierra. La hoja no da escala: las longitudes van en milímetros de la lámina.
      Tampoco nombra los vértices de la chapa: los nombres son nuestros. La chapa son dos rectángulos,
      las caras ABFE y BCGF, unidos por el doblez BF, que es horizontal (B₂F₂ es horizontal en el
      papel) y es lo más alto de la chapa; desde él, las dos caras bajan hasta la misma cota, la de AE
      y CG, como un tejado a dos aguas. ABFE baja hacia el plano vertical, y BCGF hacia quien mira el
      alzado. r atraviesa las dos caras: entra por ABFE y sale por BCGF, por debajo del doblez. A esos
      dos puntos los llamamos I y J. El enunciado no dice si la chapa es opaca, pero la figura lo da a
      entender, porque dibuja a trazos el trozo de FE que tapa la cara BCGF en el alzado: la tomamos
      opaca, y por eso se dibuja también lo que tapa de r. Con una chapa transparente, r iría entera en
      continua. La verdadera magnitud la sacamos abatiendo las dos caras alrededor del doblez, cada
      una a un lado, y así la chapa queda desplegada: el método es nuestro. Con cambios de plano
      saldría cada cara por separado, con las mismas medidas. M, N y P, los demás puntos de la
      construcción, y los abatidos A₀, C₀, E₀ y G₀, también son nombres nuestros.
    pide: Los dos puntos donde r atraviesa la chapa, en las dos vistas, y lo visto y lo oculto de r, con la chapa opaca; la chapa desplegada en verdadera magnitud; y, como pregunta nuestra, su largo desplegado.
    receta:
      lamina: sd29
      escena:
        A: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("A1"))'
        B: 'punto3(alzado: figura.punto("B2"), planta: figura.punto("B1"))'
        C: 'punto3(alzado: figura.punto("C2"), planta: figura.punto("C1"))'
        E: 'punto3(alzado: figura.punto("E2"), planta: figura.punto("E1"))'
        F: 'punto3(alzado: figura.punto("F2"), planta: figura.punto("F1"))'
        G: 'punto3(alzado: figura.punto("G2"), planta: figura.punto("G1"))'
        r: 'recta3(alzado: figura.segmento("r2"), planta: figura.segmento("r1"))'
        # Cada cara, por el doblez y un vértice suyo: así la charnela está en
        # las dos. E y G quedan a 0,05 mm de su plano (el redondeo del PDF).
        abfe: plano(B, F, A)
        bcgf: plano(B, F, C)
        # El doblez, de F a B: con este sentido, la rama 1 de los abatidos es
        # la de cada cara hacia fuera.
        bf: recta3(F, B)
      solucion:
        # a) r atraviesa la chapa dos veces: entra por ABFE en I y sale por
        # BCGF en J, por debajo del doblez. Cada punto, con el plano vertical
        # que contiene r: en la planta es r₁, y corta EA en M, BF en N y CG en
        # P. La quebrada M₂N₂P₂ y r₂ están en ese plano.
        I: corte_recta_plano(r, abfe)
        J: corte_recta_plano(r, bcgf)
        M1: 'cruce_aparente(figura.segmento("r1"), segmento2(figura.punto("A1"), figura.punto("E1")))'
        N1: 'cruce_aparente(figura.segmento("r1"), segmento2(figura.punto("B1"), figura.punto("F1")))'
        P1: 'cruce_aparente(figura.segmento("r1"), segmento2(figura.punto("C1"), figura.punto("G1")))'
        M2: 'cruce_aparente(segmento2(M1, desplaza(M1, dy: -10)), segmento2(figura.punto("A2"), figura.punto("E2")))'
        N2: 'cruce_aparente(segmento2(N1, desplaza(N1, dy: -10)), segmento2(figura.punto("B2"), figura.punto("F2")))'
        P2: 'cruce_aparente(segmento2(P1, desplaza(P1, dy: -10)), segmento2(figura.punto("C2"), figura.punto("G2")))'
        # La visibilidad de r: los cruces aparentes donde cambia en el
        # alzado; los demás cambios son I y J. El de r₂ con F₂G₂, solo para los
        # diagnósticos; el de F₂E₂ cae a 0,9 mm del de B₂C₂, y un mismo
        # diagnóstico habla de los dos.
        x_r_AB2: 'cruce_aparente(figura.segmento("r2"), segmento2(figura.punto("A2"), figura.punto("B2")))'
        x_r_BC2: 'cruce_aparente(figura.segmento("r2"), segmento2(figura.punto("B2"), figura.punto("C2")))'
        x_r_FG2: 'cruce_aparente(figura.segmento("r2"), segmento2(figura.punto("F2"), figura.punto("G2")))'
        # Los extremos de las rectas largas.
        L_M2: 'desplaza(M2, dy: mm(-4))'
        L_N2: 'desplaza(N2, dy: mm(-4))'
        L_P2: 'desplaza(P2, dy: mm(-4))'
        L_I1: 'desplaza(proy_planta(I), dy: mm(4))'
        L_J1: 'desplaza(proy_planta(J), dy: mm(4))'
        # b) Decisión: la chapa, desplegada. Cada cara gira alrededor del
        # doblez BF, que es horizontal, hasta el plano horizontal que lo
        # contiene, y cada una cae a un lado de B₁F₁. La primera cara, a
        # elegir; la otra, al contrario: C se abate como lo que A₀ deja al
        # otro lado de B (simetrico de A₀ respecto de B, que está en el plano
        # horizontal de la charnela; abatido_junto solo toma de él el lado).
        A_ab: abatido_a_elegir(A, bf, abfe)
        E_ab: 'abatido_junto(E, bf, abfe, con: A_ab, de: A)'
        C_ab: 'abatido_junto(C, bf, bcgf, con: simetrico(A_ab, respecto: B), de: C)'
        G_ab: 'abatido_junto(G, bf, bcgf, con: C_ab, de: C)'
        # El radio de A: el triángulo con A₁ y el pie de A en la charnela, que
        # está a 0,03 mm de B₁ (la cara es un rectángulo en el dibujo), y lo
        # que B está más alto que A, llevado por la charnela desde el pie.
        pieA: pie_perpendicular(A, bf)
        pieE: pie_perpendicular(E, bf)
        pieG: pie_perpendicular(G, bf)
        dz: diferencia_de_cotas(B, A)
        H2: 'cruce_aparente(segmento2(figura.punto("B2"), desplaza(figura.punto("B2"), dy: 10)), segmento2(figura.punto("A2"), figura.punto("E2")))'
        L_H: 'desplaza(H2, dx: mm(3))'
        L_H2: 'desplaza(H2, dy: mm(3))'
        T: 'uno(medir_sobre(segmento2(figura.punto("B1"), figura.punto("F1")), desde: proy_planta(pieA), distancia: dz), 1)'
        L_T: 'uno(medir_sobre(segmento2(figura.punto("B1"), figura.punto("F1")), desde: T, distancia: mm(4)), 1)'
        # Con el mismo radio, al otro lado del pie, C₀: las dos caras tienen el
        # mismo ancho (55,13 y 55,09 mm, el redondeo del dibujo).
        Cx: 'proy_planta(simetrico(A_ab, respecto: pieA))'
        L_A0: 'uno(medir_sobre(segmento2(figura.punto("C1"), figura.punto("A1")), desde: figura.punto("A1"), distancia: vm(A, pieA) - vm_planta(A, pieA) + mm(3)), 1)'
        L_C0: 'uno(medir_sobre(segmento2(figura.punto("A1"), figura.punto("C1")), desde: figura.punto("C1"), distancia: vm(A, pieA) - vm_planta(C, pieA) + mm(3)), 1)'
        L_E0: 'uno(medir_sobre(segmento2(figura.punto("G1"), figura.punto("E1")), desde: figura.punto("E1"), distancia: vm(E, pieE) - vm_planta(E, pieE) + mm(3)), 1)'
        L_G0: 'uno(medir_sobre(segmento2(figura.punto("E1"), figura.punto("G1")), desde: figura.punto("G1"), distancia: vm(G, pieG) - vm_planta(G, pieG) + mm(3)), 1)'
        # Las paralelas a la charnela por A₀ y por C₀, hasta pasar E₀ y G₀.
        perpA0: 'perpendicular(por: proy_planta(A_ab), a: segmento2(figura.punto("B1"), figura.punto("F1")))'
        parA0: 'perpendicular(por: proy_planta(A_ab), a: perpA0)'
        perpC0: 'perpendicular(por: proy_planta(C_ab), a: segmento2(figura.punto("B1"), figura.punto("F1")))'
        parC0: 'perpendicular(por: proy_planta(C_ab), a: perpC0)'
        L_E0p: 'uno(medir_sobre(parA0, desde: proy_planta(A_ab), distancia: vm(A, E) + mm(3)), 2)'
        L_G0p: 'uno(medir_sobre(parC0, desde: proy_planta(C_ab), distancia: vm(C, G) + mm(3)), 2)'
        # Los errores del radio de A: solo lo que B está más alto que A (un
        # cateto) o lo que mide A₂B₂ en el alzado, llevados desde B₁ por la
        # perpendicular a la charnela.
        A_dz: 'uno(medir_sobre(segmento2(figura.punto("B1"), figura.punto("A1")), desde: figura.punto("B1"), distancia: dz), 1)'
        A_alz: 'uno(medir_sobre(segmento2(figura.punto("B1"), figura.punto("A1")), desde: figura.punto("B1"), distancia: vm_alzado(A, B)), 1)'
        C_dz: 'uno(medir_sobre(segmento2(figura.punto("B1"), figura.punto("C1")), desde: figura.punto("B1"), distancia: dz), 1)'
        largo_mm: en_mm(vm(A, B) + vm(B, C))
      comprueba:
        - en_plano(E, abfe)
        - en_plano(G, bcgf)
        - en_plano(I, abfe)
        - en_plano(J, bcgf)
        - en_recta(I, r)
        - en_recta(J, r)
    pasos:
      - tipo: reconocer
        pregunta: En el alzado, r₂ cruza el contorno de la chapa, y en la planta r₁ cruza B₁F₁, el doblez. ¿Por dónde atraviesa r la chapa?
        opciones:
          - texto: Por el doblez, en el punto donde r₁ cruza B₁F₁ en la planta
            mensaje: |
              Ese cruce es aparente: en su vertical, el doblez BF va 21,8 mm más alto que r. La recta pasa
              por debajo del doblez, sin tocarlo, por dentro de la chapa.
          - texto: Por las dos caras, en dos puntos, I y J; r entra por ABFE y sale por BCGF, por debajo del doblez
            correcta: true
            mensaje: |
              Eso es. La chapa es como un tejado a dos aguas, y r pasa por debajo del caballete: atraviesa
              la cara ABFE en I y la BCGF en J. Cada punto sale del plano vertical que contiene r, que corta
              la chapa en una quebrada, una recta en cada cara.
          - texto: Por la cara ABFE y en un solo punto, el cruce de r₂ con A₂B₂, que es en el alzado donde r entra en el contorno de la chapa
            mensaje: |
              Ese cruce también es aparente: ahí AB va 8,6 mm más cerca de quien mira que r, sin tocarla.
              r atraviesa ABFE más adelante, en I, y vuelve a salir de la chapa por la otra cara, en J.

      - tipo: construir
        titulo: Dónde atraviesa r la chapa, y lo que se ve de r
        intro: |
          El plano vertical que contiene r se ve en la planta como la propia r₁, y corta la chapa en una
          quebrada: una recta en cada cara, que se doblan en el doblez. Sus tres puntos están donde r₁
          cruza las aristas EA, BF y CG; los llamamos M, N y P, nombres nuestros como I y J. Súbelos al
          alzado: donde r₂ corta la quebrada están I₂, en la cara ABFE, y J₂, en la BCGF. Marca I y J en
          las dos vistas.

          Después, pasa a limpio r con «arista vista» y «arista oculta», tramo a tramo: pártela solo donde
          cambia, en I, en J o en un cruce aparente con el borde de una cara. La chapa la tomamos opaca,
          como da a entender la figura, que dibuja a trazos lo que la cara BCGF tapa de FE en el alzado;
          esa arista ya está en la lámina, y r no la cambia.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, visto, oculto, borrar]
        tolerancia: 1
        objetivos:
          - nombre: I2
            pide: I, donde r atraviesa la cara ABFE, en el alzado
            es: proy_alzado(solucion.I)
            bien: |
              I₂ está en r₂, donde la corta M₂N₂: la recta en que el plano vertical de r corta la cara ABFE.
              Esa recta y r están en el mismo plano, así que se cortan de verdad.
            diagnosticos:
              - si: cerca_de(solucion.x_r_AB2)
                mensaje: |
                  Ese es el cruce aparente de r₂ con A₂B₂: en el alzado se tapan, pero en el espacio AB pasa
                  8,6 mm por delante de r, sin tocarla. I sale del plano auxiliar: la recta M₂N₂.
                ejemplo: solucion.x_r_AB2
              - si: '!en_recta(figura.segmento("r2"))'
                mensaje: |
                  I es un punto de r: I₂ va **en r₂**, donde la corta la recta M₂N₂.
                ejemplo: 'desplaza(proy_alzado(solucion.I), dy: mm(5))'
              - si: siempre
                mensaje: |
                  Estás en r₂, pero no donde la corta M₂N₂. M₂ y N₂ son los alzados de los puntos donde r₁
                  cruza A₁E₁ y B₁F₁ en la planta, subidos por su vertical hasta A₂E₂ y B₂F₂.
          - nombre: I1
            pide: I, en la planta
            es: proy_planta(solucion.I)
            bien: |
              I₁ está en r₁, en la vertical de I₂.
            diagnosticos:
              - si: cerca_de(solucion.M1)
                mensaje: |
                  Ese es M₁, donde r₁ cruza A₁E₁: un cruce aparente de la planta, y el punto de EA que corta el
                  plano auxiliar. I₁ baja de I₂ por su vertical.
                ejemplo: solucion.M1
              - si: '!en_vertical_de(I2)'
                mensaje: |
                  I₁ va en la **vertical de I₂**: es el mismo punto visto dos veces.
                ejemplo: 'desplaza(proy_planta(solucion.I), dx: mm(6))'
              - si: '!en_recta(figura.segmento("r1"))'
                mensaje: |
                  I está en r: I₁ va donde la vertical de I₂ corta **r₁**.
                ejemplo: 'desplaza(proy_planta(solucion.I), dy: mm(8))'
              - si: siempre
                mensaje: |
                  I₁ está donde la vertical de I₂ corta r₁.
          - nombre: J2
            pide: J, donde r atraviesa la cara BCGF, en el alzado
            es: proy_alzado(solucion.J)
            bien: |
              J₂ está en r₂, donde la corta N₂P₂: la recta en que el plano vertical de r corta la cara BCGF.
            diagnosticos:
              - si: cerca_de(solucion.x_r_BC2)
                mensaje: |
                  Ahí r₂ cruza B₂C₂ y, 0,9 mm a la derecha, F₂E₂: dos cruces aparentes. BC pasa 20,3 mm por delante
                  de r, y FE, 21,1 mm por detrás; ninguna la toca. J está donde r₂ corta N₂P₂, la recta auxiliar
                  de la cara BCGF.
                ejemplo: solucion.x_r_BC2
              - si: cerca_de(solucion.x_r_FG2)
                mensaje: |
                  Ese es el cruce aparente de r₂ con F₂G₂: FG pasa ahí 14,5 mm por detrás de r. J está antes,
                  donde r₂ corta N₂P₂.
                ejemplo: solucion.x_r_FG2
              - si: '!en_recta(figura.segmento("r2"))'
                mensaje: |
                  J es un punto de r: J₂ va **en r₂**, donde la corta la recta N₂P₂.
                ejemplo: 'desplaza(proy_alzado(solucion.J), dy: mm(-6))'
              - si: siempre
                mensaje: |
                  Estás en r₂, pero no donde la corta N₂P₂. N₂ está en el doblez, B₂F₂, y P₂ en C₂G₂: son los
                  alzados de los puntos donde r₁ cruza B₁F₁ y C₁G₁.
          - nombre: J1
            pide: J, en la planta
            es: proy_planta(solucion.J)
            bien: |
              J₁ está en r₁, en la vertical de J₂. Entre I₁ y J₁, r va por dentro de la chapa.
            diagnosticos:
              - si: cerca_de(solucion.N1)
                mensaje: |
                  Ese es N₁, donde r₁ cruza el doblez: un cruce aparente, porque BF va ahí 21,8 mm más alto que
                  r. J₁ baja de J₂ por su vertical.
                ejemplo: solucion.N1
              - si: cerca_de(solucion.P1)
                mensaje: |
                  Ese es P₁, donde r₁ cruza C₁G₁: otro cruce aparente, y el punto de CG que corta el plano
                  auxiliar. J₁ baja de J₂ por su vertical.
                ejemplo: solucion.P1
              - si: '!en_vertical_de(J2)'
                mensaje: |
                  J₁ va en la **vertical de J₂**.
                ejemplo: 'desplaza(proy_planta(solucion.J), dx: mm(-6))'
              - si: '!en_recta(figura.segmento("r1"))'
                mensaje: |
                  J está en r: J₁ va donde la vertical de J₂ corta **r₁**.
                ejemplo: 'desplaza(proy_planta(solucion.J), dy: mm(8))'
              - si: siempre
                mensaje: |
                  J₁ está donde la vertical de J₂ corta r₁.
        # Decisión: la chapa, opaca (lo dicen las Notas nuestras, y la figura
        # lo da a entender con FE a trazos). La visibilidad de r sale de un
        # cálculo de líneas ocultas aparte, por rayos contra las dos caras;
        # cada cambio, en un cruce aparente o en I o J. FE ya está en la
        # lámina con su tramo oculto, y r, que es una línea, no la cambia.
        tramos:
          - traza: segmento2(figura.punto("r1a"), proy_planta(solucion.I))
            tipo: visto
            porque: 'Desde su extremo izquierdo hasta I, r va por fuera de la chapa: primero fuera de su planta y, desde el cruce con A₁E₁, por encima de la cara ABFE, que atraviesa en I. En ese cruce, r va 8,5 mm más alta que EA. Desde arriba nada la tapa.'
          - traza: segmento2(proy_planta(solucion.I), proy_planta(solucion.J))
            tipo: oculto
            porque: 'Entre I y J, r va por dentro de la chapa, por debajo del doblez: desde arriba la tapa la cara ABFE hasta el cruce con B₁F₁, y la BCGF desde ahí. En ese cruce, BF va 21,8 mm más alto que r.'
          - traza: segmento2(proy_planta(solucion.J), figura.punto("r1b"))
            tipo: visto
            porque: 'En J, r sale de la chapa por la cara BCGF y pasa por encima de ella: hasta su extremo derecho nada la tapa. En el cruce con C₁G₁, r va 39,9 mm más alta que CG.'
          - traza: segmento2(figura.punto("r2a"), solucion.x_r_AB2)
            tipo: visto
            porque: 'De su extremo izquierdo al cruce con A₂B₂, r queda fuera del alzado de la chapa: nada la tapa.'
          - traza: segmento2(solucion.x_r_AB2, proy_alzado(solucion.I))
            tipo: oculto
            porque: 'Del cruce con A₂B₂ hasta I, r va detrás de la cara ABFE, que la tapa: en el cruce aparente, AB va 8,6 mm más cerca de quien mira. En I, r la atraviesa y pasa por delante de ella.'
          - traza: segmento2(proy_alzado(solucion.I), solucion.x_r_BC2)
            tipo: visto
            porque: 'De I al cruce con B₂C₂, r va por dentro de la chapa, delante de la cara ABFE, que acaba de atravesar, y fuera del alzado de la BCGF: nada la tapa.'
          - traza: segmento2(solucion.x_r_BC2, proy_alzado(solucion.J))
            tipo: oculto
            porque: 'Del cruce con B₂C₂ hasta J, r va detrás de la cara BCGF, que la tapa: en el cruce aparente, BC va 20,3 mm más cerca de quien mira.'
          - traza: segmento2(proy_alzado(solucion.J), figura.punto("r2b"))
            tipo: visto
            porque: 'En J, r atraviesa la cara BCGF y sale por delante de ella: de J₂ a su extremo derecho nada la tapa.'
        trazado:
          - segmento2(solucion.M2, solucion.N2)
          - segmento2(solucion.N2, solucion.P2)
        construccion:
          - con: marca
            traza: solucion.M1
            rotulo: M₁
            porque: |
              **El plano auxiliar.** El plano vertical que contiene r se ve, en la planta, como la propia r₁,
              y corta la chapa donde r₁ cruza sus aristas. M₁, donde r₁ cruza A₁E₁: M es el punto de la arista
              EA que está en ese plano. M, N, P, I y J son nombres nuestros.
          - con: marca
            traza: solucion.N1
            rotulo: N₁
            porque: |
              N₁, donde r₁ cruza B₁F₁: N es el punto del doblez que está en el plano vertical de r.
          - con: marca
            traza: solucion.P1
            rotulo: P₁
            porque: |
              P₁, donde r₁ cruza C₁G₁: P es el punto de CG que está en el plano vertical de r.
          - con: escuadra-cartabon
            traza: '[segmento2(solucion.M1, solucion.L_M2), segmento2(solucion.N1, solucion.L_N2), segmento2(solucion.P1, solucion.L_P2)]'
            porque: |
              Por M₁, N₁ y P₁, las verticales hacia el alzado, largas, hasta pasar A₂E₂, B₂F₂ y C₂G₂: M está
              en EA, N en BF y P en CG. Por el camino, la de N₁ cruza r₂ y B₂C₂ casi en el mismo punto, y
              ninguno de los dos es N₂: N₂ está arriba, en el doblez.
          - con: marca
            traza: solucion.M2
            rotulo: M₂
            porque: |
              M₂, donde la vertical de M₁ corta A₂E₂, el borde de abajo de la cara ABFE.
          - con: marca
            traza: solucion.N2
            rotulo: N₂
            porque: |
              N₂, donde la vertical de N₁ corta B₂F₂, el doblez.
          - con: marca
            traza: solucion.P2
            rotulo: P₂
            porque: |
              P₂, donde la vertical de P₁ corta C₂G₂, el borde de abajo de la cara BCGF.
          - con: regla
            traza: '[segmento2(solucion.M2, solucion.N2), segmento2(solucion.N2, solucion.P2)]'
            porque: |
              M₂N₂ y N₂P₂, el alzado de la quebrada en que el plano vertical de r corta la chapa: una recta en
              cada cara, que se doblan en N, en el doblez. Están en el mismo plano que r, así que donde r₂ las
              corta, las corta de verdad.
          - con: marca
            traza: proy_alzado(solucion.I)
            rotulo: I₂
            porque: |
              I₂, donde M₂N₂ corta r₂: el punto donde r atraviesa la cara ABFE.
          - con: marca
            traza: proy_alzado(solucion.J)
            rotulo: J₂
            porque: |
              J₂, donde N₂P₂ corta r₂: el punto donde r atraviesa la cara BCGF.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_alzado(solucion.I), solucion.L_I1), segmento2(proy_alzado(solucion.J), solucion.L_J1)]'
            porque: |
              Por I₂ y por J₂, las verticales hacia la planta, hasta pasar r₁.
          - con: marca
            traza: proy_planta(solucion.I)
            rotulo: I₁
            porque: |
              I₁, donde la vertical de I₂ corta r₁.
          - con: marca
            traza: proy_planta(solucion.J)
            rotulo: J₁
            porque: |
              J₁, donde la vertical de J₂ corta r₁.
          - con: arista-vista
            traza: '[segmento2(figura.punto("r1a"), proy_planta(solucion.I)), segmento2(proy_planta(solucion.J), figura.punto("r1b"))]'
            porque: |
              **A limpio, la planta.** Desde arriba se ve lo que va más alto. r, en continua hasta I y desde
              J: va por encima de la chapa o fuera de ella.
          - con: arista-oculta
            traza: segmento2(proy_planta(solucion.I), proy_planta(solucion.J))
            porque: |
              A trazos, de I₁ a J₁: r va por dentro de la chapa, debajo de las dos caras. El cruce con B₁F₁
              no cambia nada: ahí solo pasa de estar debajo de una cara a estar debajo de la otra.
          - con: arista-vista
            traza: '[segmento2(figura.punto("r2a"), solucion.x_r_AB2), segmento2(proy_alzado(solucion.I), solucion.x_r_BC2), segmento2(proy_alzado(solucion.J), figura.punto("r2b"))]'
            porque: |
              **El alzado.** Se ve lo que va más cerca de quien mira, lo de más alejamiento. r, en continua
              hasta A₂B₂, de I hasta B₂C₂, por dentro de la chapa y delante de ABFE, y desde J.
          - con: arista-oculta
            traza: '[segmento2(solucion.x_r_AB2, proy_alzado(solucion.I)), segmento2(solucion.x_r_BC2, proy_alzado(solucion.J))]'
            porque: |
              A trazos, lo que queda detrás de una cara: de A₂B₂ hasta I, detrás de ABFE, y de B₂C₂ hasta J,
              detrás de BCGF.
        pista: |
          (1) En la planta, r₁ cruza A₁E₁ en M₁, B₁F₁ en N₁ y C₁G₁ en P₁: es el plano vertical de r
          cortando la chapa. (2) Sube M a A₂E₂, N a B₂F₂ y P a C₂G₂; r₂ corta M₂N₂ en I₂ y N₂P₂ en J₂. (3) I₁ y
          J₁ bajan por su vertical a r₁. (4) Para lo que se ve: en cada cruce aparente, mira en la otra
          vista qué va delante (alzado) o encima (planta); en I y en J, r atraviesa una cara y cambia de
          lado.
        desarrollo: |
          En verde claro, la quebrada M₂N₂P₂ del plano auxiliar, I y J en las dos vistas, y r con lo
          oculto a trazos. r pasa por debajo del doblez, por dentro de la chapa: en la planta va oculta
          de I a J, y en el alzado, detrás de la cara de atrás hasta I y detrás de la de delante hasta J.

      - tipo: construir
        titulo: La chapa en verdadera magnitud, desplegada
        intro: |
          Para ver la chapa entera en verdadera magnitud, la desplegamos: cada cara gira alrededor del
          doblez BF, que es horizontal, hasta el plano horizontal que lo contiene, y cae a un lado de
          B₁F₁. El enunciado no dice cómo: el método y la charnela son nuestros. B y F no se mueven. Cada
          cara es un rectángulo y el doblez es horizontal, así que A₁B₁ es perpendicular a la charnela, y A₀
          va por la prolongación de C₁A₁; su distancia a B₁ es AB en verdadera magnitud, la hipotenusa de
          A₁B₁ y de lo que B está más alto que A. Las dos caras tienen el mismo ancho, y con el mismo radio sale C₀. Vale empezar
          por el lado que quieras, pero la otra cara va al contrario: si abates las dos al mismo lado, cada
          una sale en verdadera magnitud, pero una encima de la otra. Marca A₀, C₀, E₀ y G₀. La chapa
          desplegada no cabe entera en el hueco de la planta: hacia fuera, E₀ cae dentro del alzado, a 0,3
          mm de A₂B₂ y a 1,2 de r₂ (hacia dentro, le pasa a G₀). Amplía con la lupa (×4) antes de marcarlo.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, borrar]
        tolerancia: 1
        objetivos:
          - nombre: A0
            rotulo: A₀
            pide: A, abatido con el doblez de charnela
            es: proy_planta(solucion.A_ab)
            bien: |
              A₀ está en la prolongación de C₁A₁, la perpendicular a la charnela por A₁, a 55,1 mm de B₁: AB
              en verdadera magnitud, la hipotenusa de A₁B₁ (30,4 mm) y de lo que B está más alto que A (46,0).
            diagnosticos:
              - si: cerca_de(figura.punto("A1"))
                mensaje: |
                  Ese es A₁, la planta de A sin abatir. Al abatir, A gira alrededor del doblez hasta la cota
                  de B y F, y en la planta se aparta de la charnela por la perpendicular.
                ejemplo: figura.punto("A1")
              - si: cerca_de(solucion.A_dz)
                mensaje: |
                  Vas por la perpendicular a la charnela, pero has llevado solo **lo que B está más alto que
                  A**, 46,0 mm. Eso es un cateto. El radio es la hipotenusa de ese cateto y de A₁B₁.
                ejemplo: solucion.A_dz
              - si: cerca_de(solucion.A_alz)
                mensaje: |
                  Has llevado A₂B₂, lo que mide AB en el alzado, 50,8 mm. AB no es frontal, y el alzado la
                  acorta: en verdadera magnitud mide 55,1 mm.
                ejemplo: solucion.A_alz
              - si: '!en_recta(segmento2(figura.punto("C1"), figura.punto("A1")))'
                mensaje: |
                  A gira alrededor del doblez en un plano perpendicular a él, que es vertical porque el doblez
                  es horizontal: en la planta, A₀ va por la **perpendicular a la charnela que pasa por A₁**, que
                  es la prolongación de C₁A₁.
                ejemplo: 'desplaza(proy_planta(rama(solucion.A_ab, 1)), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular a la charnela por A₁, pero no a la distancia buena. El radio es AB
                  en verdadera magnitud: la hipotenusa de A₁B₁ y de lo que B₂ está por encima de la horizontal
                  de A₂.
          - nombre: C0
            rotulo: C₀
            pide: C, abatido con el doblez de charnela, al otro lado
            es: proy_planta(solucion.C_ab)
            bien: |
              C₀ está en la prolongación de A₁C₁, al otro lado de la charnela que A₀, y a la misma distancia
              de B₁: BC mide lo mismo que AB. A₀, B₁ y C₀ quedan en línea, porque AB y BC son las dos
              perpendiculares al doblez.
            diagnosticos:
              - si: cerca_de(otra_rama(proy_planta(solucion.C_ab)))
                mensaje: |
                  Has abatido la cara BCGF **al mismo lado** que la ABFE: cae encima de ella. Así cada cara
                  sale en verdadera magnitud, pero la chapa no se ve entera. Para desplegarla, cada cara va a
                  un lado de la charnela.
                ejemplo: proy_planta(rama(solucion.C_ab, 2))
              - si: cerca_de(figura.punto("C1"))
                mensaje: |
                  Ese es C₁, la planta de C sin abatir. C gira alrededor del doblez, como A, y se aparta de la
                  charnela por la perpendicular.
                ejemplo: figura.punto("C1")
              - si: cerca_de(solucion.C_dz)
                mensaje: |
                  Has llevado solo lo que B está más alto que C, 46,0 mm: un cateto. El radio es BC en
                  verdadera magnitud, la hipotenusa, que mide lo mismo que AB.
                ejemplo: solucion.C_dz
              - si: '!en_recta(segmento2(figura.punto("A1"), figura.punto("C1")))'
                mensaje: |
                  C₀ va por la **perpendicular a la charnela que pasa por C₁**: la prolongación de A₁C₁.
                ejemplo: 'desplaza(proy_planta(rama(solucion.C_ab, 1)), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la prolongación de A₁C₁, pero no a la distancia buena: C₀ está a lo mismo de B₁ que
                  A₀, al otro lado.
          - nombre: E0
            rotulo: E₀
            pide: E, abatido, en la cara de A₀
            es: proy_planta(solucion.E_ab)
            bien: |
              E₀ está en la perpendicular a la charnela por E₁ —la prolongación de G₁E₁— y en la paralela a la
              charnela por A₀: AE es paralela al doblez, y abatida lo sigue siendo.
            diagnosticos:
              - si: cerca_de(otra_rama(proy_planta(solucion.E_ab)))
                mensaje: |
                  Ese E ha caído **al otro lado** de la charnela que A₀. La cara ABFE gira entera, como una tapa
                  sobre su bisagra: E₀ va al lado de A₀.
                ejemplo: proy_planta(rama(solucion.E_ab, 2))
              - si: cerca_de(figura.punto("E1"))
                mensaje: |
                  Ese es E₁, sin abatir. E se aparta de la charnela como A, por la perpendicular que pasa por
                  E₁.
                ejemplo: figura.punto("E1")
              - si: '!en_recta(segmento2(figura.punto("G1"), figura.punto("E1")))'
                mensaje: |
                  E₀ va por la **perpendicular a la charnela que pasa por E₁**, que es la prolongación de G₁E₁.
                ejemplo: 'desplaza(proy_planta(rama(solucion.E_ab, 1)), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la prolongación de G₁E₁, pero no donde la corta la paralela a la charnela por A₀. AE
                  es paralela al doblez, y A₀E₀ también.
          - nombre: G0
            rotulo: G₀
            pide: G, abatido, en la cara de C₀
            es: proy_planta(solucion.G_ab)
            bien: |
              G₀ está en la prolongación de E₁G₁, la perpendicular a la charnela por G₁, y en la paralela a la
              charnela por C₀. A₀C₀G₀E₀ es la chapa desplegada, con el doblez B₁F₁ en medio.
            diagnosticos:
              - si: cerca_de(otra_rama(proy_planta(solucion.G_ab)))
                mensaje: |
                  Ese G ha caído **al otro lado** de la charnela que C₀: la cara BCGF gira entera, y G₀ va al
                  lado de C₀.
                ejemplo: proy_planta(rama(solucion.G_ab, 2))
              - si: cerca_de(figura.punto("G1"))
                mensaje: |
                  Ese es G₁, sin abatir: G se aparta de la charnela por la perpendicular que pasa por G₁.
                ejemplo: figura.punto("G1")
              - si: '!en_recta(segmento2(figura.punto("E1"), figura.punto("G1")))'
                mensaje: |
                  G₀ va por la **perpendicular a la charnela que pasa por G₁**, la prolongación de E₁G₁.
                ejemplo: 'desplaza(proy_planta(rama(solucion.G_ab, 1)), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la prolongación de E₁G₁, pero no donde la corta la paralela a la charnela por C₀.
        trazado:
          - segmento2(proy_planta(solucion.A_ab), proy_planta(solucion.E_ab))
          - segmento2(proy_planta(solucion.C_ab), proy_planta(solucion.G_ab))
          - segmento2(proy_planta(solucion.A_ab), proy_planta(solucion.C_ab))
          - segmento2(proy_planta(solucion.E_ab), proy_planta(solucion.G_ab))
        bloques:
          - nombre: Despliegue de la chapa
            explica: |
              Para ver la chapa entera la desplegamos, con un método nuestro: cada cara gira
              alrededor del doblez BF, que es horizontal, hasta el plano horizontal que lo contiene,
              cada una a un lado de B₁F₁. Son dos abatimientos con la misma charnela, y B y F no se
              mueven. Cada punto gira en un plano perpendicular al doblez, que es vertical: en la
              planta se aparta de B₁F₁ por la perpendicular, y su radio es su distancia real al
              doblez. Las caras son rectángulos, así que esa distancia, para A, es AB en verdadera
              magnitud, la hipotenusa de A₁B₁ y de lo que B está más alto que A; BC mide lo mismo, y
              C cae con el mismo radio al otro lado. AE y CG son paralelas al doblez, y abatidas lo
              siguen siendo: de ahí salen E₀ y G₀.
        construccion:
          - con: regla
            traza: segmento2(figura.punto("E2"), solucion.L_H)
            bloque: Despliegue de la chapa
            porque: |
              **Lo que baja cada cara.** En el alzado, A₂E₂, el borde de abajo de la cara ABFE, prolongado
              con la regla hacia la derecha, hasta pasar la vertical de B₂. Es la horizontal de la cota de A.
          - con: escuadra-cartabon
            traza: segmento2(figura.punto("B2"), solucion.L_H2)
            bloque: Despliegue de la chapa
            porque: |
              Por B₂, la vertical hacia abajo, hasta pasar la prolongación de A₂E₂.
          - con: marca
            traza: solucion.H2
            bloque: Despliegue de la chapa
            porque: |
              Donde la vertical de B₂ corta la prolongación de A₂E₂, a 0,6 mm de E₂: E y B no están en la
              misma vertical. Lo que va de B₂ a este punto, 46,0 mm, es lo que B está más alto que A, y que
              C, que tiene la cota de A. Va sin rótulo.
          - con: regla
            traza: segmento2(figura.punto("B1"), solucion.L_T)
            rotulo: charnela
            bloque: Despliegue de la chapa
            porque: |
              En la planta, la **charnela**: el doblez, B₁F₁, prolongado con la regla más allá de F₁. B y F
              no se mueven al abatir.
          - con: compas
            traza: 'arco(proy_planta(solucion.pieA), por: solucion.T, desde: desplaza(solucion.T, dx: -4.25, dy: -4.24), hasta: desplaza(solucion.T, dx: 4.25, dy: 4.24))'
            toma: segmento2(figura.punto("B2"), solucion.H2)
            bloque: Despliegue de la chapa
            porque: |
              Con el compás, en el alzado, lo que B está más alto que A: de B₂ a la prolongación de A₂E₂. Con
              centro en B₁, que es el pie de A en la charnela, se lleva por ella, más allá de F₁.
          - con: marca
            traza: solucion.T
            bloque: Despliegue de la chapa
            porque: |
              Donde el arco corta la charnela prolongada, a 46,0 mm de B₁: con A₁B₁, que es perpendicular a
              la charnela, forma el triángulo rectángulo que da AB en verdadera magnitud. Va sin rótulo.
          - con: regla
            traza: segmento2(figura.punto("A1"), solucion.T)
            rotulo: radio
            bloque: Despliegue de la chapa
            porque: |
              La hipotenusa, de A₁ al punto que acabas de marcar: AB en verdadera magnitud, 55,1 mm. Es la
              distancia real de A a la charnela, el radio con que A se abate.
          - con: regla
            traza: '[segmento2(figura.punto("A1"), solucion.L_A0), segmento2(figura.punto("C1"), solucion.L_C0)]'
            bloque: Despliegue de la chapa
            porque: |
              C₁A₁ prolongada con la regla hacia los dos lados, larga: es la perpendicular a la charnela por
              A₁ y por C₁, porque AB y BC son perpendiculares al doblez. Por ella giran A y C.
          - con: compas
            traza: 'arco(proy_planta(solucion.pieA), por: proy_planta(solucion.A_ab), desde: desplaza(proy_planta(solucion.A_ab), dx: -4.24, dy: 4.24), hasta: desplaza(proy_planta(solucion.A_ab), dx: 4.24, dy: -4.24))'
            toma: segmento2(figura.punto("A1"), solucion.T)
            bloque: Despliegue de la chapa
            porque: |
              Con centro en B₁ y la hipotenusa de radio, el arco hasta la prolongación de C₁A₁, más allá de
              A₁: A cae al plano horizontal del doblez girando alrededor de él.
          - con: marca
            traza: proy_planta(solucion.A_ab)
            rotulo: A₀
            bloque: Despliegue de la chapa
            porque: |
              A₀, donde el arco corta la prolongación de C₁A₁: A abatido. A₀, C₀, E₀ y G₀ son nombres
              nuestros. Aquí la cara ABFE cae hacia fuera, a su lado de la charnela; al otro también valdría,
              con la otra cara al contrario.
          - con: compas
            traza: 'arco(proy_planta(solucion.pieA), por: solucion.Cx, desde: desplaza(solucion.Cx, dx: -4.24, dy: 4.24), hasta: desplaza(solucion.Cx, dx: 4.24, dy: -4.24))'
            toma: segmento2(figura.punto("A1"), solucion.T)
            bloque: Despliegue de la chapa
            porque: |
              Con el mismo centro y el mismo radio, el arco hasta la prolongación de A₁C₁, más allá de C₁: BC
              mide lo mismo que AB (55,09 y 55,13 mm, el redondeo del dibujo), y la cara BCGF cae al otro lado.
          - con: marca
            traza: proy_planta(solucion.C_ab)
            rotulo: C₀
            bloque: Despliegue de la chapa
            porque: |
              C₀, donde el arco corta la prolongación de A₁C₁: C abatido, al otro lado de la charnela que A₀.
          - con: regla
            traza: '[segmento2(figura.punto("E1"), solucion.L_E0), segmento2(figura.punto("G1"), solucion.L_G0)]'
            bloque: Despliegue de la chapa
            porque: |
              G₁E₁ prolongada con la regla hacia los dos lados: es la perpendicular a la charnela por E₁ y por
              G₁. Por ella giran E y G.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.A_ab), solucion.L_E0p)
            guia: segmento2(figura.punto("B1"), figura.punto("F1"))
            bloque: Despliegue de la chapa
            porque: |
              Por A₀, la **paralela a la charnela**, hasta pasar la prolongación de G₁E₁: AE es paralela al
              doblez, y abatida lo sigue siendo.
          - con: marca
            traza: proy_planta(solucion.E_ab)
            rotulo: E₀
            bloque: Despliegue de la chapa
            porque: |
              E₀, donde la paralela por A₀ corta la prolongación de G₁E₁. A₀B₁F₁E₀ es la cara ABFE en
              verdadera magnitud.
          - con: escuadra-cartabon
            traza: segmento2(proy_planta(solucion.C_ab), solucion.L_G0p)
            guia: segmento2(figura.punto("B1"), figura.punto("F1"))
            bloque: Despliegue de la chapa
            porque: |
              Por C₀, la paralela a la charnela, hasta pasar la prolongación de E₁G₁.
          - con: marca
            traza: proy_planta(solucion.G_ab)
            rotulo: G₀
            bloque: Despliegue de la chapa
            porque: |
              G₀, donde la paralela por C₀ corta la prolongación de E₁G₁. A₀C₀G₀E₀ es la chapa desplegada, con
              el doblez B₁F₁ en medio.
        pista: |
          (1) En el alzado, lo que B está más alto que A: de B₂ a la prolongación de A₂E₂. (2) En la planta,
          llévalo por la charnela, B₁F₁ prolongada, desde B₁: con A₁ forma un triángulo rectángulo cuya
          hipotenusa es AB en verdadera magnitud. (3) Con centro en B₁ y ese radio, corta la prolongación de
          C₁A₁ más allá de A₁ (A₀) y más allá de C₁ (C₀). (4) Por A₀ y C₀, las paralelas a la charnela cortan
          las prolongaciones de G₁E₁ en E₀ y G₀.
        desarrollo: |
          En verde claro, la chapa desplegada: A₀B₁F₁E₀ y B₁C₀G₀F₁, dos rectángulos de 55,1 por 29,5 mm,
          unidos por el doblez. Juntos son un rectángulo de 110,2 por 29,5 mm. En la figura, la chapa se
          dobla con 66,8° entre las dos caras.

      - tipo: calcular
        titulo: El largo de la chapa desplegada
        pregunta: Como pregunta nuestra, ¿cuánto mide la chapa desplegada, de A₀ a C₀?
        respuesta:
          tipo: numero
          valor: '110.22'
          receta: largo_mm
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '60.65'
            receta: en_mm(vm_planta(A, C))
            mensaje: |
              Eso es **A₁C₁**, la planta de la chapa de A a C. Las dos caras bajan desde el doblez, y la
              planta las acorta: A₁B₁ mide 30,4 mm, y AB, 55,1.
          - valor: '101.53'
            receta: en_mm(vm_alzado(A, B) + vm_alzado(B, C))
            mensaje: |
              Eso es **A₂B₂ más B₂C₂**, en el alzado. Tampoco es verdadera magnitud: AB y BC no son frontales,
              y el alzado las acorta, a 50,8 mm cada una.
          - valor: '92.03'
            receta: en_mm(2 * diferencia_de_cotas(B, A))
            mensaje: |
              Eso son **dos veces lo que baja cada cara**, 46,0 mm: un cateto del triángulo. El ancho de cada
              cara es la hipotenusa, con A₁B₁ de otro cateto.
        pista: |
          Mide A₀C₀ con «medir» del Taller, en el paso anterior, o en tu lámina de papel: es el ancho de las
          dos caras en verdadera magnitud, uno detrás de otro.
        desarrollo: |
          Cada cara, abatida, conserva su ancho real, y las dos quedan en línea por el doblez:

          $$ \overline{A_0C_0} = \overline{AB} + \overline{BC} = \sqrt{30{,}35^{2} + 46{,}02^{2}} + \sqrt{30{,}29^{2} + 46{,}02^{2}} \approx 55{,}13 + 55{,}09 \approx 110{,}22 \text{ mm} $$

          E₀G₀, el otro lado largo de la chapa desplegada, mide lo mismo: la chapa es un rectángulo.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: El plano vertical que contiene r corta la chapa en una quebrada MNP, una recta en cada cara, que se dobla en N, en el doblez.
          - texto: En el alzado, r₂ corta M₂N₂ en I₂ y N₂P₂ en J₂, porque están en el mismo plano; I₁ y J₁ bajan por su vertical.
          - texto: Con la chapa opaca, r va oculta entre I y J en la planta, por dentro de la chapa, y en el alzado donde una cara le pasa por delante.
          - texto: Cada cara gira alrededor del doblez hasta el plano horizontal que lo contiene, una a cada lado, y la chapa queda desplegada en verdadera magnitud.
          - texto: r atraviesa la chapa por el doblez, en el punto donde r₁ cruza B₁F₁ en la planta.
            trampa: true
            mensaje: |
              Ese cruce es aparente: ahí el doblez va 21,8 mm más alto que r. r pasa por debajo del doblez y
              atraviesa las dos caras, en I y en J.
    resolucion: |
      **Qué se busca.** La chapa es un tejado a dos aguas: dos rectángulos, ABFE y BCGF, que bajan desde
      el doblez BF, horizontal, hasta la misma cota. r pasa por debajo del doblez y atraviesa la chapa
      dos veces: entra por la cara ABFE en I y sale por la BCGF en J.

      **I y J.** El plano vertical que contiene r se ve en la planta como r₁, y corta las aristas EA, BF y
      CG en M, N y P. Subidos a A₂E₂, B₂F₂ y C₂G₂, la quebrada M₂N₂P₂ corta r₂ en I₂ y en J₂, e I₁ y J₁ bajan
      por su vertical a r₁.

      **Lo que se ve.** Tomamos la chapa opaca, como da a entender la figura. En la planta, r va oculta de
      I a J, por debajo del doblez. En el alzado va detrás de la cara ABFE del cruce con A₂B₂ hasta I, y
      detrás de la BCGF del cruce con B₂C₂ hasta J. Con una chapa transparente, todo iría en continua.

      **La verdadera magnitud.** Desplegamos la chapa: cada cara gira alrededor del doblez hasta el plano
      horizontal que lo contiene, una a cada lado de B₁F₁. AB es la hipotenusa de A₁B₁, 30,35 mm, y de lo
      que B está más alto que A, 46,02: 55,13 mm. BC mide lo mismo. A₀ y C₀ caen en la prolongación de
      A₁C₁, a ese radio de B₁, y E₀ y G₀ en la de E₁G₁, en las paralelas a la charnela. La chapa desplegada
      es un rectángulo de 110,22 por 29,55 mm.

  - id: sd30-el-triangulo-y-la-chapa-de-caras-verticales
    titulo: El triángulo y la chapa de dos caras verticales
    fuente: Ejercicio 23 (SD30) · Colección de ejercicios de Geometría Descriptiva, Sistema Diédrico Directo · Dpto. de Expresión Gráfica y Proyectos de Ingeniería, EIG · UPV/EHU
    nivel: practica
    # Decisión: el texto impreso tal cual, cotejado con la página (pág. 24).
    # La hoja no rotula nada: la chapa se nombra como en el Ejercicio 26
    # (caras ABFE y BCGF, doblez BF) y el triángulo MNO, nombres nuestros. Las
    # dos piezas se toman opacas, como en los Ejercicios 24 y 25, y el
    # triángulo como una placa, no como un plano sin borde: las Notas dicen
    # qué saldría con las otras lecturas.
    enunciado: |
      Se presenta una chapa formada por dos caras y un plano triangular. Representar la intersección
      entre el plano y la chapa.

      **Notas nuestras.** La figura es la chapa y el triángulo en el alzado, arriba, y en la planta,
      debajo, sin línea de tierra. La hoja no da escala: las longitudes van en milímetros de la lámina.
      Tampoco nombra nada: los nombres son nuestros. La chapa son dos rectángulos verticales, las caras
      ABFE, a la izquierda, y BCGF, unidos por el doblez BF, que también es vertical: en la planta, la
      chapa es la quebrada A₁B₁C₁, y A₁ coincide con E₁, B₁ con F₁ y C₁ con G₁. El trazo de esa planta
      está recortado en la hoja, y acaba 0,2 y 0,5 mm antes de las verticales de A₂E₂ y C₂G₂: tomamos
      la chapa hasta ellas. El triángulo es MNO, con M a la izquierda, N arriba en el alzado y O a la
      derecha. Lo tomamos como una placa, y la intersección es la quebrada IJK: I, donde el lado MN
      atraviesa la cara ABFE; J, donde el doblez atraviesa el triángulo; y K, donde el lado NO atraviesa
      la cara BCGF. Si el triángulo fuera solo un trozo dibujado de un plano sin borde, la quebrada
      cruzaría la chapa entera, desde AE hasta el borde de arriba de BCGF. El enunciado no dice si las
      piezas son opacas: las tomamos opacas, y por eso se dibuja también lo que tapa cada una de la
      otra. Con piezas transparentes, todo iría en continua. I, J, K y Q, el punto de la construcción,
      también son nombres nuestros.
    pide: Los tres puntos de la quebrada en que el triángulo corta la chapa, en las dos vistas, y lo visto y lo oculto de las dos piezas, que tomamos opacas; y, como pregunta nuestra, la longitud real de la quebrada.
    receta:
      lamina: sd30
      escena:
        A: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("A1"))'
        B: 'punto3(alzado: figura.punto("B2"), planta: figura.punto("B1"))'
        C: 'punto3(alzado: figura.punto("C2"), planta: figura.punto("C1"))'
        E: 'punto3(alzado: figura.punto("E2"), planta: figura.punto("E1"))'
        F: 'punto3(alzado: figura.punto("F2"), planta: figura.punto("F1"))'
        G: 'punto3(alzado: figura.punto("G2"), planta: figura.punto("G1"))'
        M: 'punto3(alzado: figura.punto("M2"), planta: figura.punto("M1"))'
        N: 'punto3(alzado: figura.punto("N2"), planta: figura.punto("N1"))'
        O: 'punto3(alzado: figura.punto("O2"), planta: figura.punto("O1"))'
        abfe: plano(A, B, E)
        bcgf: plano(B, C, F)
        mno: plano(M, N, O)
      solucion:
        # La quebrada: MN atraviesa la cara ABFE en I, el doblez atraviesa
        # MNO en J, y NO atraviesa la cara BCGF en K. OM no toca la chapa, y
        # MN y NO cortan el plano de la otra cara fuera de ella.
        I: corte_recta_plano(recta3(M, N), abfe)
        J: corte_recta_plano(recta3(B, F), mno)
        K: corte_recta_plano(recta3(N, O), bcgf)
        # Decisión: I y K, en la planta, donde las caras, que son verticales,
        # cruzan MN y NO; J, con el plano vertical de la cara ABFE, que corta
        # MNO en la recta IQ (Q en OM, donde A₁B₁ prolongada cruza O₁M₁).
        # Con la cara BCGF saldría lo mismo, con R en OM: I₂Q₂ corta el doblez
        # casi en ángulo recto, y K₂R₂ a 38°.
        Q1: 'cruce_aparente(segmento2(figura.punto("A1"), figura.punto("B1")), segmento2(figura.punto("O1"), figura.punto("M1")))'
        Q2: 'cruce_aparente(segmento2(Q1, desplaza(Q1, dy: -10)), segmento2(figura.punto("O2"), figura.punto("M2")))'
        # La visibilidad: los cruces aparentes donde una arista cambia de vista
        # a oculta en el alzado (los demás cambios son I, J y K); el de B₂F₂
        # con O₂M₂, y el corte de I₂K₂ con B₂F₂, para los diagnósticos.
        x_AB_MN2: 'cruce_aparente(segmento2(figura.punto("A2"), figura.punto("B2")), segmento2(figura.punto("M2"), figura.punto("N2")))'
        x_BC_NO2: 'cruce_aparente(segmento2(figura.punto("B2"), figura.punto("C2")), segmento2(figura.punto("N2"), figura.punto("O2")))'
        x_NO_CG2: 'cruce_aparente(segmento2(figura.punto("N2"), figura.punto("O2")), segmento2(figura.punto("C2"), figura.punto("G2")))'
        x_OM_CG2: 'cruce_aparente(segmento2(figura.punto("O2"), figura.punto("M2")), segmento2(figura.punto("C2"), figura.punto("G2")))'
        x_BF_OM2: 'cruce_aparente(segmento2(figura.punto("B2"), figura.punto("F2")), segmento2(figura.punto("O2"), figura.punto("M2")))'
        x_IK_BF2: 'cruce_aparente(segmento2(proy_alzado(I), proy_alzado(K)), segmento2(figura.punto("B2"), figura.punto("F2")))'
        # Los extremos de las rectas largas.
        L_I2: 'desplaza(proy_alzado(I), dy: mm(-4))'
        L_K2: 'desplaza(proy_alzado(K), dy: mm(-4))'
        L_Q1: 'uno(medir_sobre(segmento2(figura.punto("A1"), figura.punto("B1")), desde: Q1, distancia: mm(4)), 1)'
        L_Q2: 'desplaza(Q2, dy: mm(-4))'
        largo_mm: en_mm(vm(I, J) + vm(J, K))
      comprueba:
        - en_plano(I, mno)
        - en_plano(J, abfe)
        - en_plano(J, bcgf)
        - en_plano(K, mno)
    pasos:
      - tipo: reconocer
        pregunta: Las dos caras de la chapa son verticales, y en la planta cada una es una recta. ¿Qué da eso para la intersección con el triángulo?
        opciones:
          - texto: Que en la planta la intersección cae sobre esas rectas, y ahí se leen I₁ y K₁
            correcta: true
            mensaje: |
              Eso es. Una cara vertical es un plano proyectante: todo lo que hay en ella cae en la planta
              sobre su recta. Donde A₁B₁ cruza M₁N₁ está I₁, y donde B₁C₁ cruza N₁O₁, K₁; se suben a M₂N₂ y
              a N₂O₂. El doblez, que también es vertical, es en la planta un punto, B₁, y su alzado sale de
              la recta en que la cara ABFE corta el triángulo.
          - texto: Nada especial; cada punto de la intersección se busca con un plano auxiliar, como si las caras fueran oblicuas
            mensaje: |
              Se puede, pero no hace falta: cada cara ya es un plano proyectante, el plano auxiliar mismo.
              Sus puntos con el triángulo se leen directamente en la planta.
          - texto: Que la intersección es una sola recta, la que une en la planta los puntos donde el triángulo entra en la chapa y sale de ella, subida al alzado
            mensaje: |
              La chapa se dobla, y su intersección con el triángulo también: es una quebrada, un tramo en
              cada cara, que se doblan en J, en el doblez. Uniendo I₂ con K₂ en línea recta, el punto del
              doblez saldría 11,0 mm más arriba.

      - tipo: construir
        titulo: La quebrada de intersección, y lo que se ve
        intro: |
          Las dos caras de la chapa son verticales: en la planta, cada una es una recta, A₁B₁ y B₁C₁, y
          todo lo que hay en ella cae ahí. Llamamos I al punto donde el lado MN del triángulo atraviesa la
          cara ABFE, K al punto donde NO atraviesa la BCGF, y J al punto donde el doblez BF atraviesa el
          triángulo: la intersección es la quebrada IJK, un tramo en cada cara. I₁ y K₁ se leen en la
          planta y se suben al alzado. El doblez es vertical, y en la planta es un punto, B₁, que es
          también J₁: J₂ sale con el plano de la cara ABFE, que corta el triángulo en una recta de I a Q,
          un punto del lado OM que llamamos así, donde A₁B₁ prolongada cruza O₁M₁. Marca I y K en las dos
          vistas, y J₂.

          Después, pasa a limpio con «arista vista» y «arista oculta» la quebrada y, en el alzado, los
          tramos de las aristas que cambian. En la planta las caras se ven de canto, no tapan nada, y la
          chapa se ve por su borde de arriba: ahí todo va en continua. Tomamos las dos piezas opacas, que
          el enunciado no lo dice. K₂ cae a 1,2 mm de B₂C₂ y a 2,2 mm del cruce aparente de N₂O₂ con B₂C₂:
          amplía con la lupa (×4) antes de marcarlo.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, visto, oculto, borrar]
        tolerancia: 1
        objetivos:
          - nombre: I1
            pide: I, donde el lado MN atraviesa la cara ABFE, en la planta
            es: proy_planta(solucion.I)
            bien: |
              I₁ está donde A₁B₁ cruza M₁N₁: la cara ABFE es vertical, y en la planta todo lo suyo cae en
              A₁B₁.
            diagnosticos:
              - si: '!en_recta(segmento2(figura.punto("A1"), figura.punto("B1")))'
                mensaje: |
                  I es un punto de la cara ABFE, que es vertical y en la planta se ve como la recta **A₁B₁**:
                  I₁ va en ella.
                ejemplo: 'desplaza(proy_planta(solucion.I), dy: mm(6))'
              - si: '!en_recta(segmento2(figura.punto("M1"), figura.punto("N1")))'
                mensaje: |
                  I es un punto del lado MN: I₁ va en **M₁N₁**, donde la cruza A₁B₁.
                ejemplo: 'uno(medir_sobre(segmento2(figura.punto("A1"), figura.punto("B1")), desde: proy_planta(solucion.I), distancia: mm(6)), 1)'
              - si: siempre
                mensaje: |
                  I₁ está donde A₁B₁ cruza M₁N₁.
          - nombre: K1
            pide: K, donde el lado NO atraviesa la cara BCGF, en la planta
            es: proy_planta(solucion.K)
            bien: |
              K₁ está donde B₁C₁ cruza N₁O₁: la cara BCGF también es vertical.
            diagnosticos:
              - si: '!en_recta(segmento2(figura.punto("B1"), figura.punto("C1")))'
                mensaje: |
                  K es un punto de la cara BCGF, que en la planta se ve como la recta **B₁C₁**: K₁ va en ella.
                ejemplo: 'desplaza(proy_planta(solucion.K), dy: mm(6))'
              - si: '!en_recta(segmento2(figura.punto("N1"), figura.punto("O1")))'
                mensaje: |
                  K es un punto del lado NO: K₁ va en **N₁O₁**, donde la cruza B₁C₁.
                ejemplo: 'uno(medir_sobre(segmento2(figura.punto("B1"), figura.punto("C1")), desde: proy_planta(solucion.K), distancia: mm(6)), 1)'
              - si: siempre
                mensaje: |
                  K₁ está donde B₁C₁ cruza N₁O₁.
          - nombre: I2
            pide: I, en el alzado
            es: proy_alzado(solucion.I)
            bien: |
              I₂ está en M₂N₂, en la vertical de I₁.
            diagnosticos:
              - si: cerca_de(solucion.x_AB_MN2)
                mensaje: |
                  Ese es el cruce aparente de M₂N₂ con A₂B₂, el borde de arriba de la chapa: MN pasa ahí 19,3
                  mm por delante de AB, sin tocarla. I₂ está más abajo, en la vertical de I₁.
                ejemplo: solucion.x_AB_MN2
              - si: '!en_vertical_de(I1)'
                mensaje: |
                  I₂ va en la **vertical de I₁**: es el mismo punto visto dos veces.
                ejemplo: 'desplaza(proy_alzado(solucion.I), dx: mm(6))'
              - si: '!en_recta(segmento2(figura.punto("M2"), figura.punto("N2")))'
                mensaje: |
                  I está en el lado MN: I₂ va donde la vertical de I₁ corta **M₂N₂**.
                ejemplo: 'desplaza(proy_alzado(solucion.I), dy: mm(8))'
              - si: siempre
                mensaje: |
                  I₂ está donde la vertical de I₁ corta M₂N₂.
          - nombre: K2
            pide: K, en el alzado
            es: proy_alzado(solucion.K)
            bien: |
              K₂ está en N₂O₂, en la vertical de K₁, 1,2 mm por debajo del borde de arriba de la chapa.
            diagnosticos:
              - si: cerca_de(solucion.x_BC_NO2)
                mensaje: |
                  Ese es el cruce aparente de N₂O₂ con B₂C₂, el borde de arriba de la cara BCGF: NO pasa ahí
                  4,0 mm por delante de BC, sin tocarla. K₂ está un poco más abajo, en la vertical de K₁.
                ejemplo: solucion.x_BC_NO2
              - si: cerca_de(solucion.x_NO_CG2)
                mensaje: |
                  Ese es el cruce aparente de N₂O₂ con C₂G₂: CG pasa ahí 25,6 mm por delante de NO. K₂ está en
                  la vertical de K₁.
                ejemplo: solucion.x_NO_CG2
              - si: '!en_vertical_de(K1)'
                mensaje: |
                  K₂ va en la **vertical de K₁**.
                ejemplo: 'desplaza(proy_alzado(solucion.K), dx: mm(6))'
              - si: '!en_recta(segmento2(figura.punto("N2"), figura.punto("O2")))'
                mensaje: |
                  K está en el lado NO: K₂ va donde la vertical de K₁ corta **N₂O₂**.
                ejemplo: 'desplaza(proy_alzado(solucion.K), dy: mm(8))'
              - si: siempre
                mensaje: |
                  K₂ está donde la vertical de K₁ corta N₂O₂.
          - nombre: J2
            pide: J, donde el doblez atraviesa el triángulo, en el alzado
            es: proy_alzado(solucion.J)
            bien: |
              J₂ está en B₂F₂, donde la corta I₂Q₂: la recta en que el plano de la cara ABFE corta el
              triángulo. Esa recta y el doblez están en el mismo plano, el de la cara, y se cortan de verdad.
            diagnosticos:
              - si: cerca_de(solucion.x_IK_BF2)
                mensaje: |
                  Has unido I₂ con K₂ en línea recta. La intersección no es una recta: la chapa se dobla, y
                  IJ va en una cara y JK en la otra. J sale de la recta I₂Q₂, que está en la cara ABFE.
                ejemplo: solucion.x_IK_BF2
              - si: cerca_de(solucion.x_BF_OM2)
                mensaje: |
                  Ese es el cruce aparente de B₂F₂ con O₂M₂: el doblez pasa ahí 9,2 mm por delante de OM, sin
                  tocarlo. J está donde B₂F₂ corta I₂Q₂.
                ejemplo: solucion.x_BF_OM2
              - si: '!en_recta(segmento2(figura.punto("B2"), figura.punto("F2")))'
                mensaje: |
                  J es un punto del doblez: J₂ va **en B₂F₂**, donde la corta la recta I₂Q₂.
                ejemplo: 'desplaza(proy_alzado(solucion.J), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en B₂F₂, pero no donde la corta I₂Q₂. Q₂ es el alzado del punto de OM que está en el
                  plano de la cara ABFE: en la planta, donde A₁B₁ prolongada cruza O₁M₁.
        # Decisión: las dos piezas, opacas (lo dicen las Notas nuestras). La
        # visibilidad sale de un cálculo de líneas ocultas aparte, por rayos
        # contra las dos caras y el triángulo; cada cambio, en un cruce
        # aparente o en I, J o K. En la planta las caras se ven de canto y no
        # tapan nada; EF y FG, que el triángulo tapa en parte, caen debajo de AB
        # y BC, que se ven enteras: allí solo la quebrada es tramo. En el
        # alzado se ven enteras, y ya están dibujadas, EA, FE, CG y GF.
        tramos:
          - traza: segmento2(proy_planta(solucion.I), proy_planta(solucion.J))
            tipo: visto
            porque: 'IJ está en la cara ABFE, que en la planta se ve de canto, sobre A₁B₁, y en el triángulo: desde arriba no la tapa nada.'
          - traza: segmento2(proy_planta(solucion.J), proy_planta(solucion.K))
            tipo: visto
            porque: 'JK está en la cara BCGF, de canto en la planta, sobre B₁C₁, y en el triángulo: desde arriba no la tapa nada.'
          - traza: segmento2(proy_alzado(solucion.I), proy_alzado(solucion.J))
            tipo: visto
            porque: 'IJ está en la cara ABFE y en el triángulo a la vez: por delante no la tapa ninguno de los dos.'
          - traza: segmento2(proy_alzado(solucion.J), proy_alzado(solucion.K))
            tipo: visto
            porque: 'JK está en la cara BCGF y en el triángulo a la vez: por delante no la tapa ninguno de los dos.'
          - traza: segmento2(figura.punto("A2"), solucion.x_AB_MN2)
            tipo: visto
            porque: 'De A₂ al cruce con M₂N₂, el borde de arriba de la cara ABFE queda fuera del alzado del triángulo: nada lo tapa.'
          - traza: segmento2(solucion.x_AB_MN2, figura.punto("B2"))
            tipo: oculto
            porque: 'Del cruce con M₂N₂ a B₂, AB va detrás del triángulo, que la tapa: en el cruce aparente, MN va 19,3 mm más cerca de quien mira.'
          - traza: segmento2(figura.punto("B2"), proy_alzado(solucion.J))
            tipo: oculto
            porque: 'De B₂ hasta J, el doblez va detrás del triángulo, que lo tapa: B₂ cae dentro de su alzado. En J el doblez lo atraviesa y pasa por delante.'
          - traza: segmento2(proy_alzado(solucion.J), figura.punto("F2"))
            tipo: visto
            porque: 'De J a F₂, el doblez va por delante del triángulo, que acaba de atravesar, y desde O₂M₂ fuera de su alzado: nada lo tapa. En el cruce aparente con O₂M₂, BF va 9,2 mm más cerca de quien mira.'
          - traza: segmento2(figura.punto("B2"), solucion.x_BC_NO2)
            tipo: oculto
            porque: 'De B₂ al cruce con N₂O₂, el borde de arriba de la cara BCGF va detrás del triángulo, que lo tapa: en el cruce aparente, NO va 4,0 mm más cerca de quien mira.'
          - traza: segmento2(solucion.x_BC_NO2, figura.punto("C2"))
            tipo: visto
            porque: 'Del cruce con N₂O₂ a C₂, BC queda fuera del alzado del triángulo: nada la tapa.'
          - traza: segmento2(figura.punto("M2"), proy_alzado(solucion.I))
            tipo: oculto
            porque: 'De M₂ hasta I, MN va detrás de la cara ABFE, que la tapa: M₂ cae dentro del alzado de la chapa. En I, MN la atraviesa y pasa por delante.'
          - traza: segmento2(proy_alzado(solucion.I), figura.punto("N2"))
            tipo: visto
            porque: 'De I a N₂, MN va por delante de la cara ABFE, que acaba de atravesar, y desde A₂B₂ por encima de la chapa: nada la tapa.'
          - traza: segmento2(figura.punto("N2"), proy_alzado(solucion.K))
            tipo: visto
            porque: 'De N₂ hasta K, NO va por encima de la chapa y luego por delante de la cara BCGF: nada la tapa. En el cruce aparente con B₂C₂, NO va 4,0 mm más cerca de quien mira.'
          - traza: segmento2(proy_alzado(solucion.K), solucion.x_NO_CG2)
            tipo: oculto
            porque: 'En K, NO atraviesa la cara BCGF y pasa detrás de ella, que la tapa hasta su borde, C₂G₂: en el cruce aparente, CG va 25,6 mm más cerca de quien mira.'
          - traza: segmento2(solucion.x_NO_CG2, figura.punto("O2"))
            tipo: visto
            porque: 'Del cruce con C₂G₂ a O₂, NO sale del alzado de la chapa: nada la tapa.'
          - traza: segmento2(figura.punto("O2"), solucion.x_OM_CG2)
            tipo: visto
            porque: 'De O₂ al cruce con C₂G₂, OM queda fuera del alzado de la chapa: nada la tapa.'
          - traza: segmento2(solucion.x_OM_CG2, figura.punto("M2"))
            tipo: oculto
            porque: 'Del cruce con C₂G₂ a M₂, OM va detrás de la chapa, que la tapa: en el cruce aparente con C₂G₂, CG va 37,3 mm más cerca de quien mira, y en el del doblez, BF va 9,2.'
        trazado:
          - segmento2(proy_alzado(solucion.I), solucion.Q2)
        construccion:
          - con: marca
            traza: proy_planta(solucion.I)
            rotulo: I₁
            porque: |
              **I y K, en la planta.** La cara ABFE es vertical y se ve, en la planta, como la recta A₁B₁:
              todo lo que hay en ella cae ahí. I₁, donde A₁B₁ cruza M₁N₁: I es el punto donde el lado MN
              atraviesa la cara. I, J, K y Q son nombres nuestros, como los de los vértices.
          - con: marca
            traza: proy_planta(solucion.K)
            rotulo: K₁
            porque: |
              K₁, donde B₁C₁ cruza N₁O₁: el punto donde el lado NO atraviesa la cara BCGF, que también es
              vertical.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_planta(solucion.I), solucion.L_I2), segmento2(proy_planta(solucion.K), solucion.L_K2)]'
            porque: |
              Por I₁ y por K₁, las verticales hacia el alzado, largas, hasta pasar M₂N₂ y N₂O₂: I está en MN
              y K en NO.
          - con: marca
            traza: proy_alzado(solucion.I)
            rotulo: I₂
            porque: |
              I₂, donde la vertical de I₁ corta M₂N₂.
          - con: marca
            traza: proy_alzado(solucion.K)
            rotulo: K₂
            porque: |
              K₂, donde la vertical de K₁ corta N₂O₂, 1,2 mm por debajo de B₂C₂: K está en la cara, muy cerca
              de su borde de arriba.
          - con: regla
            traza: segmento2(figura.punto("B1"), solucion.L_Q1)
            porque: |
              **J, en el doblez.** El doblez es vertical, y su punto con el triángulo se busca con un plano
              vertical que lo contenga: el de la cara ABFE. En la planta es A₁B₁, que se prolonga con la regla
              más allá de B₁, hasta pasar O₁M₁.
          - con: marca
            traza: solucion.Q1
            rotulo: Q₁
            porque: |
              Q₁, donde A₁B₁ prolongada cruza O₁M₁: Q es el punto del lado OM que está en el plano de la cara
              ABFE, fuera de la cara.
          - con: escuadra-cartabon
            traza: segmento2(solucion.Q1, solucion.L_Q2)
            porque: |
              Por Q₁, la vertical hacia el alzado, hasta pasar O₂M₂.
          - con: marca
            traza: solucion.Q2
            rotulo: Q₂
            porque: |
              Q₂, donde la vertical de Q₁ corta O₂M₂.
          - con: regla
            traza: segmento2(proy_alzado(solucion.I), solucion.Q2)
            porque: |
              I₂Q₂, el alzado de la recta en que el plano de la cara ABFE corta el triángulo: I y Q son de los
              dos. El doblez está en ese plano, así que donde B₂F₂ corta I₂Q₂ se cortan de verdad.
          - con: marca
            traza: proy_alzado(solucion.J)
            rotulo: J₂
            porque: |
              J₂, donde I₂Q₂ corta B₂F₂: el punto donde el doblez atraviesa el triángulo. J₁ es B₁, porque el
              doblez es vertical.
          - con: arista-vista
            traza: '[segmento2(proy_planta(solucion.I), proy_planta(solucion.J)), segmento2(proy_planta(solucion.J), proy_planta(solucion.K))]'
            porque: |
              **A limpio, la planta.** La quebrada I₁J₁K₁, en continua, sobre A₁B₁ y B₁C₁: está en la chapa y
              en el triángulo. Las caras se ven de canto y no tapan nada, y la chapa se ve por su borde de
              arriba: todo lo demás va en continua, como ya está.
          - con: arista-vista
            traza: '[segmento2(proy_alzado(solucion.I), proy_alzado(solucion.J)), segmento2(proy_alzado(solucion.J), proy_alzado(solucion.K)), segmento2(figura.punto("A2"), solucion.x_AB_MN2), segmento2(proy_alzado(solucion.J), figura.punto("F2")), segmento2(solucion.x_BC_NO2, figura.punto("C2")), segmento2(proy_alzado(solucion.I), figura.punto("N2")), segmento2(figura.punto("N2"), proy_alzado(solucion.K)), segmento2(solucion.x_NO_CG2, figura.punto("O2")), segmento2(figura.punto("O2"), solucion.x_OM_CG2)]'
            porque: |
              **El alzado.** Se ve lo que va más cerca de quien mira. La quebrada I₂J₂K₂, en continua; el
              triángulo, donde va por delante de la chapa o fuera de ella; y la chapa, donde va por delante
              del triángulo o fuera de él.
          - con: arista-oculta
            traza: '[segmento2(solucion.x_AB_MN2, figura.punto("B2")), segmento2(figura.punto("B2"), proy_alzado(solucion.J)), segmento2(figura.punto("B2"), solucion.x_BC_NO2), segmento2(figura.punto("M2"), proy_alzado(solucion.I)), segmento2(proy_alzado(solucion.K), solucion.x_NO_CG2), segmento2(solucion.x_OM_CG2, figura.punto("M2"))]'
            porque: |
              A trazos, lo que queda detrás: de la chapa, el borde de arriba cerca de B₂ y el doblez hasta J,
              detrás del triángulo; del triángulo, MN hasta I, NO desde K hasta C₂G₂ y OM desde C₂G₂, detrás
              de la chapa. EA, FE, CG y GF se ven enteras, y ya están dibujadas.
        pista: |
          (1) En la planta, A₁B₁ cruza M₁N₁ en I₁, y B₁C₁ cruza N₁O₁ en K₁: las caras son verticales. (2)
          Súbelos a M₂N₂ y N₂O₂. (3) Para J: prolonga A₁B₁ hasta O₁M₁, en Q₁, y sube Q a O₂M₂; I₂Q₂ corta
          B₂F₂ en J₂. (4) Para lo que se ve, en cada cruce aparente mira en la planta cuál va delante; en I,
          J y K una pieza atraviesa la otra y cambia de lado.
        desarrollo: |
          En verde claro, la recta auxiliar I₂Q₂ y la quebrada IJK en las dos vistas, con lo oculto a
          trazos. El triángulo atraviesa la chapa con su vértice N por delante: entra por la cara ABFE en I,
          corta el doblez en J y sale por la BCGF en K. En la planta, la quebrada cae sobre la chapa misma.

      - tipo: calcular
        titulo: La longitud de la quebrada
        pregunta: Como pregunta nuestra, ¿cuánto mide de verdad la quebrada de intersección, IJ más JK?
        respuesta:
          tipo: numero
          valor: '50.11'
          receta: largo_mm
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '39.26'
            receta: en_mm(vm(solucion.I, solucion.K))
            mensaje: |
              Eso es **IK**, la recta de I a K. La intersección no va en línea recta: se dobla en J, en el
              doblez, y es más larga.
          - valor: '43.62'
            receta: en_mm(vm_planta(solucion.I, solucion.J) + vm_planta(solucion.J, solucion.K))
            mensaje: |
              Eso es **I₁J₁ más J₁K₁**, en la planta. JK sube 16,8 mm de J a K, y la planta la acorta: mide
              18,6 mm, y de verdad, 25,0.
          - valor: '25.07'
            receta: en_mm(vm(solucion.I, solucion.J))
            mensaje: |
              Eso es **un solo tramo**: IJ, el de la cara ABFE, mide 25,07 mm, y JK, el de la BCGF, 25,04,
              casi lo mismo. La quebrada son los dos, uno detrás de otro.
        pista: |
          Cada tramo con su triángulo de la verdadera magnitud: su planta de un cateto y su diferencia de
          cotas del otro.
        desarrollo: |
          Cada tramo, con el triángulo de la verdadera magnitud:

          $$ \overline{IJ} = \sqrt{25{,}05^{2} + 0{,}96^{2}} \approx 25{,}07 \text{ mm}, \qquad \overline{JK} = \sqrt{18{,}57^{2} + 16{,}79^{2}} \approx 25{,}04 \text{ mm} $$

          La quebrada mide 25,07 + 25,04 ≈ 50,11 mm. IJ es casi horizontal, y su planta mide casi lo mismo,
          25,05 mm; JK no, porque sube 16,8 mm.

          Algún trozo de recta auxiliar del dibujo mide por casualidad casi lo mismo (de Q₁ a donde la vertical de I cruza O₁M₁, 49,33 mm), pero no es la quebrada.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: Las dos caras son verticales, y todo lo que hay en cada una cae en la planta sobre su recta, A₁B₁ o B₁C₁.
          - texto: I₁, donde A₁B₁ cruza M₁N₁, y K₁, donde B₁C₁ cruza N₁O₁, se suben por su vertical a M₂N₂ y a N₂O₂.
          - texto: El doblez es vertical; el plano de la cara ABFE lo contiene y corta el triángulo en la recta IQ, y I₂Q₂ corta B₂F₂ en J₂.
          - texto: La quebrada IJK está en las dos piezas y se ve entera; lo demás cambia de vista a oculta en I, J, K o en un cruce aparente.
          - texto: J₂ es donde I₂K₂ corta B₂F₂, porque la intersección es la recta que une I con K.
            trampa: true
            mensaje: |
              La chapa se dobla en BF, y la intersección también: IJ está en una cara y JK en la otra, y no van
              en línea. I₂K₂ corta B₂F₂ 11,0 mm más arriba que J₂.
    resolucion: |
      **Qué se busca.** La chapa son dos caras verticales unidas por el doblez BF, también vertical, y el
      triángulo MNO la atraviesa con el vértice N por delante. La intersección es una quebrada: un tramo
      en cada cara, IJ y JK, que se doblan en J, en el doblez. I es donde el lado MN atraviesa la cara
      ABFE, y K donde NO atraviesa la BCGF.

      **I y K.** Las caras son planos proyectantes: en la planta, A₁B₁ cruza M₁N₁ en I₁, y B₁C₁ cruza N₁O₁
      en K₁. Subidos por su vertical, I₂ cae en M₂N₂ y K₂ en N₂O₂, 1,2 mm por debajo del borde de arriba
      de la chapa.

      **J.** El doblez es vertical: en la planta es el punto B₁, que es J₁. El plano de la cara ABFE lo
      contiene y corta el triángulo en una recta que pasa por I y por Q, el punto de OM donde A₁B₁
      prolongada cruza O₁M₁. I₂Q₂ corta B₂F₂ en J₂. Unir I₂ con K₂ en línea recta daría un punto 11,0 mm
      más arriba: la quebrada no es una recta.

      **Lo que se ve.** Tomamos las dos piezas opacas. En la planta las caras se ven de canto, y todo va
      en continua. En el alzado, el triángulo tapa el doblez de B₂ a J y el borde de arriba de la chapa
      cerca de B₂; la chapa tapa MN hasta I, NO desde K hasta C₂G₂ y OM desde C₂G₂ hasta M₂. Con piezas
      transparentes, todo iría en continua.

      **La longitud.** IJ mide 25,07 mm y JK 25,04: la quebrada, 50,11 mm.

  - id: sd32-la-interseccion-de-los-triangulos-abc-y-def
    titulo: La intersección de los triángulos ABC y DEF, y lo que tapa cada uno
    fuente: Ejercicio 24 (SD32) · Colección de ejercicios de Geometría Descriptiva, Sistema Diédrico Directo · Dpto. de Expresión Gráfica y Proyectos de Ingeniería, EIG · UPV/EHU
    nivel: practica
    # Decisión: el texto impreso tal cual, cotejado con la página (pág. 25). El
    # enunciado no dice si los triángulos son placas opacas o solo planos: se
    # toman opacos, como en el Ejercicio 38, y las Notas nuestras dicen qué
    # saldría con planos transparentes. I, J, K, L, M, N, P y Q son nombres
    # nuestros.
    enunciado: |
      Representar la intersección entre los planos ABC y DEF.

      **Notas nuestras.** La figura son los triángulos ABC y DEF en el alzado, arriba, y en la planta,
      debajo, sin línea de tierra. La hoja no da escala: las longitudes van en milímetros de la lámina.
      Los dos triángulos se cortan, y lo que se pide es el segmento que comparten; llamamos I y J a sus
      extremos. El enunciado dice «planos», pero no si los triángulos son placas opacas o solo un trozo
      de plano dibujado: aquí los tomamos como dos placas opacas, y por eso también se dibuja lo que
      cada una tapa de la otra. Con planos transparentes todas las aristas irían en continua. K, L, M,
      N, P y Q, los demás puntos de la construcción, también son nombres nuestros. Si se leyeran como planos sin borde, su intersección sería la
      recta entera, de la que IJ es el trozo que comparten los dos triángulos.
    pide: Los dos extremos del segmento en que se cortan los triángulos, en las dos vistas, y lo visto y lo oculto de los dos, que tomamos opacos; y, como pregunta nuestra, la longitud de ese segmento en verdadera magnitud.
    receta:
      lamina: sd32
      escena:
        A: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("A1"))'
        B: 'punto3(alzado: figura.punto("B2"), planta: figura.punto("B1"))'
        C: 'punto3(alzado: figura.punto("C2"), planta: figura.punto("C1"))'
        D: 'punto3(alzado: figura.punto("D2"), planta: figura.punto("D1"))'
        E: 'punto3(alzado: figura.punto("E2"), planta: figura.punto("E1"))'
        F: 'punto3(alzado: figura.punto("F2"), planta: figura.punto("F1"))'
        abc: plano(A, B, C)
        def: plano(D, E, F)
      solucion:
        # Los extremos: DE atraviesa ABC en I, y BC atraviesa DEF en J. Las
        # otras aristas cortan el plano del otro triángulo fuera de él: AB en
        # K, fuera de DEF, y EF en L, fuera de ABC (CA y FD, fuera de la
        # arista). En la recta común, K, I, J y L van en ese orden: ABC la
        # ocupa de K a J, DEF de I a L, y el tramo común es IJ.
        I: corte_recta_plano(recta3(D, E), abc)
        J: corte_recta_plano(recta3(B, C), def)
        K: corte_recta_plano(recta3(A, B), def)
        L: corte_recta_plano(recta3(E, F), abc)
        largo_mm: en_mm(vm(I, J))
        # Decisión: cada extremo, con el plano vertical que contiene la arista,
        # que en la planta se ve como la propia arista (el que las diapositivas
        # llaman proyectante horizontal). El de DE corta a ABC en MN (M en AB y
        # N en CA); el de BC corta a DEF en PQ (P en FD y Q en EF). Con el
        # plano de canto de DE, la recta auxiliar cortaría la arista a 19°, y
        # con el vertical, a 36°: se toma el vertical.
        M1: 'cruce_aparente(figura.segmento("DE1"), figura.segmento("AB1"))'
        N1: 'cruce_aparente(figura.segmento("DE1"), figura.segmento("CA1"))'
        M2: 'cruce_aparente(segmento2(M1, desplaza(M1, dy: -10)), figura.segmento("AB2"))'
        N2: 'cruce_aparente(segmento2(N1, desplaza(N1, dy: -10)), figura.segmento("CA2"))'
        P1: 'cruce_aparente(figura.segmento("BC1"), figura.segmento("FD1"))'
        Q1: 'cruce_aparente(figura.segmento("BC1"), figura.segmento("EF1"))'
        P2: 'cruce_aparente(segmento2(P1, desplaza(P1, dy: -10)), figura.segmento("FD2"))'
        Q2: 'cruce_aparente(segmento2(Q1, desplaza(Q1, dy: -10)), figura.segmento("EF2"))'
        # La visibilidad: los cruces aparentes donde una arista cambia de vista
        # a oculta (x_<arista>_<la que la cruza><vista>); los demás cambios
        # son I y J, donde la arista atraviesa la otra placa. M1, N1, P1 y Q1
        # también son cruces aparentes de la planta.
        x_CA_EF1: 'cruce_aparente(figura.segmento("CA1"), figura.segmento("EF1"))'
        x_FD_AB1: 'cruce_aparente(figura.segmento("FD1"), figura.segmento("AB1"))'
        x_BC_FD2: 'cruce_aparente(figura.segmento("BC2"), figura.segmento("FD2"))'
        x_CA_FD2: 'cruce_aparente(figura.segmento("CA2"), figura.segmento("FD2"))'
        x_CA_DE2: 'cruce_aparente(figura.segmento("CA2"), figura.segmento("DE2"))'
        x_DE_AB2: 'cruce_aparente(figura.segmento("DE2"), figura.segmento("AB2"))'
        # Los extremos de las rectas largas: se trazan más allá del punto que
        # van a dar.
        L_M2: 'desplaza(M2, dy: mm(-4))'
        L_N2: 'desplaza(N2, dy: mm(-4))'
        L_P2: 'desplaza(P2, dy: mm(-4))'
        L_Q2: 'desplaza(Q2, dy: mm(-4))'
        L_I1: 'desplaza(proy_planta(I), dy: mm(4))'
        L_J1: 'desplaza(proy_planta(J), dy: mm(4))'
      comprueba:
        - en_plano(I, abc)
        - en_plano(I, def)
        - en_plano(J, abc)
        - en_plano(J, def)
        - en_recta(I, recta3(D, E))
        - en_recta(J, recta3(B, C))
    pasos:
      - tipo: reconocer
        pregunta: Los dos triángulos se cortan en un segmento. ¿Qué da sus dos extremos?
        opciones:
          - texto: Los cruces de las proyecciones de las aristas, como el de D₂E₂ con A₂B₂ en el alzado o el de B₁C₁ con F₁D₁ en la planta
            mensaje: |
              Esos son cruces aparentes: en esa vista las dos aristas se tapan, pero en el espacio se
              cruzan sin tocarse, una delante de la otra. En el de D₂E₂ con A₂B₂, AB va 13,0 mm más cerca
              de quien mira que DE. Sirven para lo visto y lo oculto, no para la intersección.
          - texto: Los puntos donde una arista de un triángulo atraviesa el otro triángulo, por dentro de él
            correcta: true
            mensaje: |
              Eso es. Un extremo del segmento común está en los dos triángulos y en el borde de uno de
              ellos: donde una arista de uno pasa a través del otro. Aquí son dos aristas distintas: DE
              atraviesa ABC, en I, y BC atraviesa DEF, en J. AB y EF también cortan el plano del otro
              triángulo, pero fuera de él.
          - texto: El punto donde AB corta el plano DEF y el punto donde EF corta el plano ABC
            mensaje: |
              AB corta el plano DEF, y EF el de ABC, pero los dos puntos caen fuera del otro triángulo: están
              en la recta común de los dos planos, no en el segmento que comparten las placas. Con ellos, el
              segmento mediría 80,58 mm, y mide 28,94.

      - tipo: construir
        titulo: Los extremos del segmento, y lo que se ve
        intro: |
          Llamamos I al punto donde la arista DE atraviesa ABC, y J al punto donde BC atraviesa DEF: son
          los extremos del segmento que comparten los dos triángulos. Cada uno sale con un plano
          auxiliar, el vertical que contiene la arista: en la planta se ve como la propia arista, y corta
          al otro triángulo en una recta cuyos extremos están en sus lados. Esa recta se sube al alzado, y
          donde corta la arista está el punto. Marca I y J en las dos vistas.

          Después, pasa a limpio con «arista vista» y «arista oculta» el segmento IJ y los tramos de las
          aristas que cambian de vista a oculta; AB y EF se ven enteras en las dos vistas, y FD en el
          alzado, y ya están dibujadas. Cada arista se corta solo donde cambia: en un cruce aparente con
          otra, o en I o en J. Tomamos los dos triángulos como placas opacas, que el enunciado no lo dice.
          I₂ cae a 4,4 mm de M₂ y a 4,7 del cruce aparente de D₂E₂ con A₂B₂: amplía con la lupa (×4) antes
          de marcarlo.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, visto, oculto, borrar]
        tolerancia: 1
        objetivos:
          - nombre: I2
            pide: I, donde la arista DE atraviesa el triángulo ABC, en el alzado
            es: proy_alzado(solucion.I)
            bien: |
              I₂ está en D₂E₂, donde la corta M₂N₂: la recta en que el plano vertical de DE corta a ABC. Esa
              recta y DE están en el mismo plano, así que se cortan de verdad, y ese punto es de los dos
              triángulos.
            diagnosticos:
              - si: cerca_de(proy_alzado(solucion.K))
                mensaje: |
                  Ese es el punto donde la arista AB corta el plano DEF. Está en la recta común de los dos
                  planos, pero fuera del triángulo DEF: las dos placas no llegan a tocarse ahí. El extremo de
                  ese lado es I, donde DE atraviesa ABC.
                ejemplo: proy_alzado(solucion.K)
              - si: cerca_de(solucion.x_DE_AB2)
                mensaje: |
                  Ese es el cruce aparente de D₂E₂ con A₂B₂: en el alzado se tapan, pero en el espacio AB pasa
                  13,0 mm por delante de DE sin tocarla. El punto donde DE atraviesa ABC sale del plano
                  auxiliar: la recta M₂N₂.
                ejemplo: solucion.x_DE_AB2
              - si: cerca_de(solucion.x_CA_DE2)
                mensaje: |
                  Ese es el cruce aparente de D₂E₂ con C₂A₂: DE pasa ahí 19,0 mm por delante de CA, sin
                  tocarla. I está donde D₂E₂ corta M₂N₂, la recta auxiliar.
                ejemplo: solucion.x_CA_DE2
              - si: '!en_recta(figura.segmento("DE2"))'
                mensaje: |
                  I es un punto de la arista DE: I₂ va **en D₂E₂**, donde la corta la recta M₂N₂.
                ejemplo: 'desplaza(proy_alzado(solucion.I), dx: mm(5))'
              - si: siempre
                mensaje: |
                  Estás en D₂E₂, pero no donde la corta M₂N₂. M₂ y N₂ son los alzados de los puntos donde
                  D₁E₁ cruza A₁B₁ y C₁A₁ en la planta, subidos por su vertical hasta A₂B₂ y C₂A₂.
          - nombre: I1
            pide: I, en la planta
            es: proy_planta(solucion.I)
            bien: |
              I₁ está en D₁E₁, en la vertical de I₂.
            diagnosticos:
              - si: cerca_de(solucion.M1)
                mensaje: |
                  Ese es M₁, donde D₁E₁ cruza A₁B₁: un cruce aparente de la planta, y el punto de AB que corta
                  el plano auxiliar. I₁ baja de I₂ por su vertical.
                ejemplo: solucion.M1
              - si: '!en_vertical_de(I2)'
                mensaje: |
                  I₁ va en la **vertical de I₂**: es el mismo punto visto dos veces.
                ejemplo: 'desplaza(proy_planta(solucion.I), dx: mm(6))'
              - si: '!en_recta(figura.segmento("DE1"))'
                mensaje: |
                  I está en la arista DE: I₁ va donde la vertical de I₂ corta **D₁E₁**.
                ejemplo: 'desplaza(proy_planta(solucion.I), dy: mm(10))'
              - si: siempre
                mensaje: |
                  I₁ está donde la vertical de I₂ corta D₁E₁.
          - nombre: J2
            pide: J, donde la arista BC atraviesa el triángulo DEF, en el alzado
            es: proy_alzado(solucion.J)
            bien: |
              J₂ está en B₂C₂, donde la corta P₂Q₂: la recta en que el plano vertical de BC corta a DEF.
            diagnosticos:
              - si: cerca_de(proy_alzado(solucion.L))
                mensaje: |
                  Ese es el punto donde la arista EF corta el plano ABC. Está en la recta común de los dos
                  planos, pero fuera del triángulo ABC: el segmento común se acaba antes, en J, donde BC
                  atraviesa DEF.
                ejemplo: proy_alzado(solucion.L)
              - si: cerca_de(solucion.x_BC_FD2)
                mensaje: |
                  Ese es el cruce aparente de B₂C₂ con F₂D₂: FD pasa ahí 19,2 mm por delante de BC, sin
                  tocarla. J está donde B₂C₂ corta P₂Q₂, la recta auxiliar.
                ejemplo: solucion.x_BC_FD2
              - si: '!en_recta(figura.segmento("BC2"))'
                mensaje: |
                  J es un punto de la arista BC: J₂ va **en B₂C₂**, donde la corta la recta P₂Q₂.
                ejemplo: 'desplaza(proy_alzado(solucion.J), dy: mm(-6))'
              - si: siempre
                mensaje: |
                  Estás en B₂C₂, pero no donde la corta P₂Q₂. P₂ y Q₂ son los alzados de los puntos donde
                  B₁C₁ cruza F₁D₁ y E₁F₁ en la planta, subidos por su vertical hasta F₂D₂ y E₂F₂.
          - nombre: J1
            pide: J, en la planta
            es: proy_planta(solucion.J)
            bien: |
              J₁ está en B₁C₁, en la vertical de J₂. I₁J₁ es la planta del segmento común.
            diagnosticos:
              - si: cerca_de(solucion.Q1)
                mensaje: |
                  Ese es Q₁, donde B₁C₁ cruza E₁F₁: un cruce aparente de la planta, y el punto de EF que corta
                  el plano auxiliar. J₁ baja de J₂ por su vertical.
                ejemplo: solucion.Q1
              - si: cerca_de(solucion.P1)
                mensaje: |
                  Ese es P₁, donde B₁C₁ cruza F₁D₁: otro cruce aparente, y el punto de FD que corta el plano
                  auxiliar. J₁ baja de J₂ por su vertical.
                ejemplo: solucion.P1
              - si: '!en_vertical_de(J2)'
                mensaje: |
                  J₁ va en la **vertical de J₂**.
                ejemplo: 'desplaza(proy_planta(solucion.J), dx: mm(-6))'
              - si: '!en_recta(figura.segmento("BC1"))'
                mensaje: |
                  J está en la arista BC: J₁ va donde la vertical de J₂ corta **B₁C₁**.
                ejemplo: 'desplaza(proy_planta(solucion.J), dy: mm(8))'
              - si: siempre
                mensaje: |
                  J₁ está donde la vertical de J₂ corta B₁C₁.
        # Decisión: los triángulos, opacos (lo dicen las Notas nuestras). La
        # visibilidad sale de un cálculo de líneas ocultas aparte, por rayos
        # contra las dos placas; cada cambio, en el cruce aparente que dice su
        # tramo o en I o J. Las aristas que se ven enteras y ya están en la
        # lámina no son tramos: AB y EF en las dos vistas, y FD en el alzado.
        tramos:
          - traza: segmento2(proy_planta(solucion.I), proy_planta(solucion.J))
            tipo: visto
            porque: 'IJ está en las dos placas a la vez: desde arriba no la tapa ninguna.'
          - traza: segmento2(figura.punto("B1"), proy_planta(solucion.J))
            tipo: visto
            porque: 'De B₁ a J₁ nada tapa BC desde arriba: hasta F₁D₁ queda fuera de la planta de DEF, y de ahí a J va por encima de esa placa. En el cruce aparente con F₁D₁, BC va 16,3 mm más alta que FD.'
          - traza: segmento2(proy_planta(solucion.J), solucion.Q1)
            tipo: oculto
            porque: 'En J, BC atraviesa DEF y pasa por debajo: de J₁ al cruce con E₁F₁, el borde de DEF, la tapa esa placa. En el cruce aparente, EF va 19,7 mm más alta que BC.'
          - traza: segmento2(solucion.Q1, figura.punto("C1"))
            tipo: visto
            porque: 'Del cruce con E₁F₁ a C₁, BC sale de debajo de DEF: desde arriba nada la tapa.'
          - traza: segmento2(figura.punto("C1"), solucion.x_CA_EF1)
            tipo: visto
            porque: 'De C₁ al cruce con E₁F₁, CA queda fuera de la planta de DEF: desde arriba nada la tapa.'
          - traza: segmento2(solucion.x_CA_EF1, solucion.N1)
            tipo: oculto
            porque: 'Entre los cruces con E₁F₁ y D₁E₁, CA pasa por debajo de DEF, que la tapa desde arriba: en el primero EF va 31,4 mm más alta, y en el segundo DE, 24,1.'
          - traza: segmento2(solucion.N1, figura.punto("A1"))
            tipo: visto
            porque: 'Del cruce con D₁E₁ a A₁, CA queda fuera de la planta de DEF: desde arriba nada la tapa.'
          - traza: segmento2(figura.punto("D1"), solucion.M1)
            tipo: visto
            porque: 'De D₁ al cruce con A₁B₁, DE queda fuera de la planta de ABC: desde arriba nada la tapa.'
          - traza: segmento2(solucion.M1, proy_planta(solucion.I))
            tipo: oculto
            porque: 'Del cruce con A₁B₁ hasta I, DE va por debajo de ABC, que la tapa desde arriba: en el cruce aparente, AB va 12,8 mm más alta que DE.'
          - traza: segmento2(proy_planta(solucion.I), figura.punto("E1"))
            tipo: visto
            porque: 'En I, DE atraviesa ABC y pasa por encima: de I₁ a E₁ desde arriba nada la tapa.'
          - traza: segmento2(figura.punto("F1"), solucion.P1)
            tipo: visto
            porque: 'De F₁ al cruce con B₁C₁, FD queda fuera de la planta de ABC: desde arriba nada la tapa.'
          - traza: segmento2(solucion.P1, solucion.x_FD_AB1)
            tipo: oculto
            porque: 'Entre los cruces con B₁C₁ y A₁B₁, FD pasa por debajo de ABC, que la tapa desde arriba: en el primero BC va 16,3 mm más alta, y en el segundo AB, 20,6.'
          - traza: segmento2(solucion.x_FD_AB1, figura.punto("D1"))
            tipo: visto
            porque: 'Del cruce con A₁B₁ a D₁, FD sale de debajo de ABC: desde arriba nada la tapa.'
          - traza: segmento2(proy_alzado(solucion.I), proy_alzado(solucion.J))
            tipo: visto
            porque: 'IJ está en las dos placas a la vez: por delante no la tapa ninguna.'
          - traza: segmento2(figura.punto("B2"), proy_alzado(solucion.J))
            tipo: visto
            porque: 'De B₂ a J₂, BC va por delante de DEF, que atraviesa en J: nada la tapa.'
          - traza: segmento2(proy_alzado(solucion.J), solucion.x_BC_FD2)
            tipo: oculto
            porque: 'En J, BC pasa detrás de DEF, que la tapa hasta su borde, F₂D₂: en el cruce aparente, FD va 19,2 mm más cerca de quien mira.'
          - traza: segmento2(solucion.x_BC_FD2, figura.punto("C2"))
            tipo: visto
            porque: 'Del cruce con F₂D₂ a C₂, BC sale del alzado de DEF: nada la tapa.'
          - traza: segmento2(figura.punto("C2"), solucion.x_CA_FD2)
            tipo: visto
            porque: 'De C₂ al cruce con F₂D₂, CA queda fuera del alzado de DEF: nada la tapa.'
