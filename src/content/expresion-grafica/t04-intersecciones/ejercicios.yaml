          - con: escuadra-cartabon
            traza: segmento2(figura.punto("D2"), solucion.L_s1_2)
            guia: figura.segmento("base2")
            porque: |
              **DD′.** Su plano horizontal, en el alzado, es la paralela a la base por D₂, hacia la izquierda,
              hasta pasar V₂A₂: corta la pirámide a la altura de DD′.
          - con: marca
            traza: solucion.s1_2
            rotulo: 1₂
            porque: |
              1₂, donde esa paralela corta V₂A₂: el punto de VA a la altura de DD′. Los puntos 1 a 3 son
              nombres nuestros, como G, H, I, J, K, L, M y N; la lámina no rotula nada, y los de la pirámide
