        construccion:
          - con: escuadra-cartabon
            traza: '[segmento2(figura.punto("D1"), figura.punto("D1p")), segmento2(figura.punto("E1"), figura.punto("E1p")), segmento2(figura.punto("F1"), figura.punto("F1p"))]'
            porque: |
              **Las aristas del prisma, en la planta.** De punta, se ven como verticales del papel: de D₁ a
              D′₁, de E₁ a E′₁ y de F₁ a F′₁, de un extremo al otro. Finas: dentro de la pirámide no van, y se
