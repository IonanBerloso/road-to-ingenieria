          - con: marca
            traza: solucion.s3_2
            rotulo: 3₂
            porque: |
              3₂, donde la paralela por F₂ corta V₂C₂: el punto de VC a la altura de FF′.
          - con: escuadra-cartabon
            traza: '[segmento2(solucion.s2_2, solucion.L_s2_1), segmento2(solucion.s3_2, solucion.L_s3_1)]'
            porque: |
              Por 2₂ y 3₂, las verticales hacia la planta, hasta pasar V₁C₁.
          - con: marca
            traza: solucion.s2_1
            rotulo: 2₁
            porque: |
              2₁, donde la vertical de 2₂ corta V₁C₁: un vértice de la sección horizontal a la altura de EE′.
          - con: marca
            traza: solucion.s3_1
            rotulo: 3₁
            porque: |
              3₁, donde la vertical de 3₂ corta V₁C₁: un vértice de la sección horizontal a la altura de FF′.
          - con: escuadra-cartabon
            traza: '[segmento2(solucion.s2_1, solucion.L_H), segmento2(solucion.s3_1, solucion.L_I)]'
            guia: figura.segmento("BC1")
            porque: |
              Por 2₁ y 3₁, las paralelas a C₁B₁, hasta pasar E₁E′₁ y F₁F′₁: los lados de esas secciones que
              van por la cara VBC, por donde entran EE′ y FF′.
          - con: escuadra-cartabon
            traza: '[segmento2(solucion.s2_1, solucion.L_K), segmento2(solucion.s3_1, solucion.L_L)]'
            guia: figura.segmento("CA1")
            porque: |
              Y las paralelas a C₁A₁, hasta pasar E₁E′₁ y F₁F′₁: los lados que van por la cara VCA, por donde
              salen.
          - con: marca
            traza: proy_planta(solucion.H)
            rotulo: H₁
            porque: |
              H₁, donde la paralela a C₁B₁ que sale de 2₁ corta E₁E′₁: la entrada de EE′.
          - con: marca
            traza: proy_planta(solucion.K)
            rotulo: K₁
            porque: |
              K₁, donde la paralela a C₁A₁ que sale de 2₁ corta E₁E′₁: la salida de EE′.
          - con: marca
            traza: proy_planta(solucion.I)
            rotulo: I₁
            porque: |
              I₁, donde la paralela a C₁B₁ que sale de 3₁ corta F₁F′₁: la entrada de FF′.
          - con: marca
            traza: proy_planta(solucion.L)
            rotulo: L₁
            porque: |
              L₁, donde la paralela a C₁A₁ que sale de 3₁ corta F₁F′₁: la salida de FF′.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_alzado(solucion.M), solucion.L_M), segmento2(proy_alzado(solucion.N), solucion.L_N)]'
            porque: |
              **VB.** Atraviesa el prisma: en el alzado, V₂B₂ cruza D₂E₂ y F₂D₂, las caras DE y FD vistas de
              canto, en los dos extremos de su hueco. Por esos dos puntos, M₂ y N₂, las verticales hacia la
              planta, hasta pasar V₁B₁.
          - con: marca
            traza: proy_planta(solucion.M)
            rotulo: M₁
            porque: |
              M₁, donde la vertical de M₂, el extremo de arriba del hueco, corta V₁B₁: la entrada de VB en el
              prisma, por la cara DE.
          - con: marca
            traza: proy_planta(solucion.N)
            rotulo: N₁
            porque: |
              N₁, donde la vertical de N₂, el extremo de abajo del hueco, corta V₁B₁: la salida de VB, por la
              cara FD.
          - con: arista-vista
            traza: '[segmento2(figura.punto("D1"), proy_planta(solucion.J)), segmento2(proy_planta(solucion.G), figura.punto("D1p")), segmento2(figura.punto("E1"), proy_planta(solucion.K)), segmento2(proy_planta(solucion.H), figura.punto("E1p")), segmento2(figura.punto("F1"), proy_planta(solucion.L)), segmento2(proy_planta(solucion.I), figura.punto("F1p")), segmento2(proy_planta(solucion.G), proy_planta(solucion.M)), segmento2(proy_planta(solucion.M), proy_planta(solucion.H)), segmento2(proy_planta(solucion.H), proy_planta(solucion.I)), segmento2(proy_planta(solucion.J), proy_planta(solucion.K)), segmento2(proy_planta(solucion.K), proy_planta(solucion.L)), segmento2(figura.punto("V1"), proy_planta(solucion.M)), segmento2(figura.punto("A1"), solucion.k_AB_D1), segmento2(solucion.k_BC_F1, figura.punto("C1")), segmento2(figura.punto("C1"), solucion.k_CA_F1), segmento2(solucion.k_CA_D1, figura.punto("A1"))]'
            porque: |
              **A limpio.** Desde arriba se ve lo que va más alto. En continua, las tres aristas del prisma
              fuera de la pirámide; de las poligonales, lo que va por las caras de arriba del prisma, DE y
              EF; VB de V a M, por encima del prisma, y lo que de la base queda fuera de la planta del prisma.
          - con: arista-oculta
            traza: '[segmento2(proy_planta(solucion.I), proy_planta(solucion.N)), segmento2(proy_planta(solucion.N), proy_planta(solucion.G)), segmento2(proy_planta(solucion.L), proy_planta(solucion.J)), segmento2(proy_planta(solucion.N), figura.punto("B1")), segmento2(solucion.k_AB_D1, figura.punto("B1")), segmento2(figura.punto("B1"), solucion.k_BC_F1), segmento2(solucion.k_CA_F1, solucion.k_CA_D1)]'
            porque: |
              A trazos, lo que queda debajo del prisma: los tramos de las poligonales que van por su cara de
              abajo, FD; VB de N a B, y los trozos de AB, BC y CA que el prisma cubre. De VB, entre M y N, no
              se dibuja nada: va por dentro del prisma.
        pista: |
          (1) Completa en la planta las aristas del prisma, de D₁ a D′₁, de E₁ a E′₁ y de F₁ a F′₁. (2) La
          paralela a la base por D₂ corta V₂A₂ en 1₂; bájalo a V₁A₁, y por 1₁ las paralelas a A₁B₁ y a A₁C₁
          cortan D₁D′₁ en G₁ y J₁. (3) Las paralelas a la base por E₂ y F₂ cortan V₂C₂ en 2₂ y 3₂; bájalos a
          V₁C₁, y las paralelas a C₁B₁ y a C₁A₁ dan H₁ y K₁, e I₁ y L₁. (4) Los extremos del hueco de V₂B₂
          bajan a V₁B₁: M₁ y N₁. (5) Las caras de arriba del prisma, DE y EF, se ven; la de abajo, FD, no.
        desarrollo: |
          En verde claro, los lados de las tres secciones horizontales que dan los cortes, y en la planta
          las dos poligonales, G M H I N por delante y J K L por detrás, con lo oculto a trazos. La de
          delante tiene cinco puntos porque el prisma abraza la arista VB: entra por las dos caras de
          delante, a un lado y a otro de VB. La de detrás es un triángulo, porque las tres aristas salen
          por la misma cara, VCA. En el alzado no hay nada nuevo: las dos poligonales caen encima del
          contorno del triángulo D₂E₂F₂. En tu lámina de papel, V₁B₁, que viene entera, se borra entre M₁
          y N₁: ese trozo de VB va por dentro del prisma.

      - tipo: calcular
        titulo: Lo que de VB queda dentro del prisma
        pregunta: Como pregunta nuestra, ¿cuánto mide de verdad MN, el trozo de la arista VB que queda dentro del prisma?
        respuesta:
          tipo: numero
          valor: '19.19'
          receta: mn_mm
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '9.25'
            receta: en_mm(vm_planta(solucion.M, solucion.N))
            mensaje: |
              Eso es **M₁N₁ en la planta**. VB baja mucho de M a N, y la planta la acorta. La verdadera
              magnitud sale del triángulo: la planta de un cateto y la diferencia de cotas del otro.
          - valor: '12.98'
            receta: 'en_mm(raiz(vm_planta(solucion.M, solucion.N) * vm_planta(solucion.M, solucion.N) + vm(solucion.M, solucion.N) * vm(solucion.M, solucion.N) - vm_alzado(solucion.M, solucion.N) * vm_alzado(solucion.M, solucion.N)))'
            mensaje: |
              Has hecho el triángulo con M₁N₁ y con lo que N está **más cerca** que M, la diferencia de
              alejamientos. Con la planta de un cateto, el otro es la diferencia de **cotas**, que se mide en
              el alzado.
          - valor: '16.90'
            receta: en_mm(vm_alzado(solucion.M, solucion.N))
            mensaje: |
              Eso es **M₂N₂ en el alzado**, el largo del hueco de V₂B₂. VB no es frontal: N está más cerca de
              quien mira que M, y el alzado la acorta.
        pista: |
          MN es un trozo de VB, que no es horizontal ni frontal: su verdadera magnitud sale del triángulo,
          con M₁N₁ de un cateto y la diferencia de cotas de M₂ y N₂ del otro.
        desarrollo: |
          Con el triángulo de la verdadera magnitud, la planta y la diferencia de cotas:

          $$ \overline{MN} = \sqrt{\overline{M_1N_1}^{\,2} + \Delta z^{2}} = \sqrt{9{,}25^{2} + 16{,}81^{2}} \approx 19{,}19 \text{ mm} $$

          En el dibujo hay una medida que cae dentro de la tolerancia por casualidad: V₁M₁, en la planta,
          18,25 mm. No es MN: es la planta del trozo de VB que va por encima del prisma.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: Las aristas del prisma son de punta, así que sus caras se ven de canto en el alzado, y la intersección cae allí encima del triángulo D₂E₂F₂; lo que hay que buscar está en la planta.
          - texto: Cada arista es horizontal, y su plano horizontal corta la pirámide en un triángulo de lados paralelos a los de la base, con un vértice en cada arista lateral.
          - texto: La planta de la arista corta ese triángulo dos veces, en la entrada, por una cara de delante, y en la salida, por la de atrás, VCA.
          - texto: VB atraviesa el prisma por sus caras DE y FD, en los extremos del hueco de V₂B₂, que bajan por su vertical a V₁B₁.
          - texto: Cada arista del prisma entra en la pirámide donde su planta cruza el contorno de la base, A₁B₁ o B₁C₁.
            trampa: true
            mensaje: |
              El contorno de la base está a la altura de la base, y las aristas del prisma van más arriba,
              donde la pirámide es más estrecha. DD′ cruza A₁B₁ 6,5 mm por encima de AB, y entra en la
              pirámide 5,1 mm más atrás.
    resolucion: |
      **Lo que se ve en el alzado.** Las aristas del prisma son de punta: sus caras se ven de canto, como
      los lados del triángulo D₂E₂F₂, y todo lo que el prisma corta en la pirámide cae ahí. El alzado ya
      está completo; V₂B₂ va cortada donde VB pasa por dentro del prisma.

      **Las aristas del prisma.** Cada una es horizontal, y su plano horizontal corta la pirámide en un
      triángulo semejante a la base. DD′ entra por la cara VAB y sale por la VCA: por 1₁, en V₁A₁ a su
      altura, las paralelas a A₁B₁ y a A₁C₁ cortan D₁D′₁ en G₁ y J₁. EE′ y FF′ entran por la VBC y salen
      por la VCA: por 2₁ y 3₁, en V₁C₁, las paralelas a C₁B₁ y a C₁A₁ dan H₁ y K₁, e I₁ y L₁.

      **La arista VB.** Pasa por dentro del prisma: entra por la cara DE y sale por la FD, en M y N, los
      extremos del hueco de V₂B₂, que bajan a V₁B₁. MN mide 19,19 mm.

      **Lo que se ve.** Leemos los dos sólidos como una sola pieza: lo que de una arista queda dentro
      del otro no se dibuja. De las dos poligonales, G M H I N por delante y J K L por detrás, se ve en la
      planta lo que va por las caras de arriba del prisma, DE y EF, y se oculta lo que va por la de
      abajo, FD. VB se ve de V a M y va oculta de N a B, bajo el prisma, y lo mismo los trozos de AB, BC y
      CA que el prisma cubre. Con los dos sólidos por separado, los trozos interiores irían a trazos.

  - id: sd43-la-torre-hexagonal-sobre-los-faldones
    titulo: La torre hexagonal sobre los faldones α y β
    fuente: Ejercicio 31 (SD43) · Colección de ejercicios de Geometría Descriptiva, Sistema Diédrico Directo · Dpto. de Expresión Gráfica y Proyectos de Ingeniería, EIG · UPV/EHU
    nivel: practica
    # Decisión: el texto impreso tal cual, cotejado con la página (pág. 32),
    # con su numeración doble («b) 2.», «c) 3.»), que es del original. La hoja
    # rotula A, B, α y β; las aristas de la torre, las esquinas de los faldones
    # y los puntos de la construcción son nombres nuestros. Las piezas se toman
    # opacas, como lectura nuestra.
    enunciado: |
      Se presenta una torre prismática con cubierta piramidal cimentada sobre un tejado definido por los
      faldones α y β. Se pide:

      a) Completar la vista de alzado.

      b) 2. Representar la intersección que genera la torre en los faldones α y β.

      c) 3. Representar la intersección en verdadera magnitud.

      **Notas nuestras.** La figura es el tejado y la torre en el alzado, arriba, y en la planta, debajo,
      sin línea de tierra. La hoja no da escala: las longitudes van en milímetros de la lámina. La
      numeración doble de b) y c) es del original. AB es la limahoya, la recta en que se cortan los dos
      faldones. α, el de delante a la izquierda en la planta, es de canto: sus esquinas de delante, K y L,
      tienen el mismo alzado que A y B, así que todo α se ve en el alzado como A₂B₂. β contiene rectas
      paralelas a la línea de tierra: su borde de atrás, A₁M₁, va a la cota de A, y su alero, B₁N₁, a la de
      B. La torre es un prisma hexagonal vertical, el hexágono de trazos de la planta, que va a trazos
      porque la cubierta, más ancha, lo tapa desde arriba. Llamamos C, D, E, F, G y H a sus seis aristas,
      empezando por la de atrás a la izquierda y siguiendo el reloj en la planta, y también al punto donde
      cada una se apoya en el tejado; I y J, a los puntos donde la limahoya cruza el hexágono. K, L, M, N, I,
      J y los puntos 1, 2 y 3 de la construcción también son nombres nuestros. Leemos «completar el
      alzado» como dibujar la torre hasta el tejado y el trozo del borde de atrás de β que la torre tapa. El
      enunciado no dice si las piezas son opacas: las tomamos opacas, como da a entender la hoja, que
      dibuja a trazos el hexágono de la torre y deja sin dibujar el borde de atrás de β detrás de la torre.
      Con piezas transparentes, todo iría en continua.
    pide: El alzado de la torre hasta los faldones, con lo que tapa; los ocho vértices de su intersección con α y β; y las dos piezas de esa intersección en verdadera magnitud, con, como pregunta nuestra, la longitud real del tramo EF.
    receta:
      lamina: sd43
      escena:
        A: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("A1"))'
        B: 'punto3(alzado: figura.punto("B2"), planta: figura.punto("B1"))'
        # Las esquinas de delante de α: sus alzados son A₂ y B₂, porque α es de
        # canto. Las de la derecha de β, M y N.
        K: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("K1"))'
        L: 'punto3(alzado: figura.punto("B2"), planta: figura.punto("L1"))'
        M: 'punto3(alzado: figura.punto("M2"), planta: figura.punto("M1"))'
        N: 'punto3(alzado: figura.punto("N2"), planta: figura.punto("N1"))'
        alfa: plano(A, B, K)
        beta: plano(A, B, M)
      solucion:
        # Los pies de las aristas de la torre: C, D, E y F caen en β, G y H en α
        # (la planta lo dice: A₁B₁ separa los dos faldones).
        C: 'punto_en_plano(planta: figura.punto("C1"), plano: beta)'
        D: 'punto_en_plano(planta: figura.punto("D1"), plano: beta)'
        E: 'punto_en_plano(planta: figura.punto("E1"), plano: beta)'
        F: 'punto_en_plano(planta: figura.punto("F1"), plano: beta)'
        G: 'punto_en_plano(planta: figura.punto("G1"), plano: alfa)'
        H: 'punto_en_plano(planta: figura.punto("H1"), plano: alfa)'
        # I y J: donde la limahoya cruza el hexágono, en los lados HC y FG.
        Ip: 'cruce_aparente(figura.segmento("AB1b"), figura.segmento("HC1"))'
        Jp: 'cruce_aparente(figura.segmento("AB1b"), figura.segmento("FG1"))'
        I: 'punto_en_plano(planta: Ip, plano: alfa)'
        J: 'punto_en_plano(planta: Jp, plano: alfa)'
        # Decisión: la cota de un punto de β, con la horizontal de β que pasa
        # por él (paralela a la línea de tierra), hasta A₁B₁; de ahí sube a
        # A₂B₂ y vuelve en horizontal. 1, por C y E; 2, por D; 3, por F.
        uno1: 'cruce_aparente(figura.segmento("AB1a"), segmento2(figura.punto("C1"), figura.punto("E1")))'
        dos1: 'cruce_aparente(figura.segmento("AB1a"), segmento2(figura.punto("D1"), desplaza(figura.punto("D1"), dx: 10)))'
        tres1: 'cruce_aparente(figura.segmento("AB1b"), segmento2(figura.punto("H1"), figura.punto("F1")))'
        uno2: 'cruce_aparente(figura.segmento("AB2"), segmento2(uno1, desplaza(uno1, dy: -10)))'
        dos2: 'cruce_aparente(figura.segmento("AB2"), segmento2(dos1, desplaza(dos1, dy: -10)))'
        tres2: 'cruce_aparente(figura.segmento("AB2"), segmento2(tres1, desplaza(tres1, dy: -10)))'
        # La visibilidad en el alzado: el borde de atrás de β pasa detrás de la
        # torre entre las aristas H (con C) y F (con E).
        x_AM_H: 'cruce_aparente(figura.segmento("AM2a"), figura.segmento("aristaH2"))'
        x_AM_F: 'cruce_aparente(figura.segmento("AM2b"), figura.segmento("aristaF2"))'
        # Para los diagnósticos: el error de subir un pie de β en vertical hasta
        # A₂B₂, como si estuviera en α (para E y F, A₂B₂ prolongada).
        C_alfa: 'cruce_aparente(figura.segmento("AB2"), segmento2(figura.punto("C1"), figura.punto("Hs2")))'
        D_alfa: 'cruce_aparente(figura.segmento("AB2"), segmento2(figura.punto("D1"), figura.punto("Gs2")))'
        E_alfa: 'cruce_aparente(figura.segmento("AB2"), segmento2(figura.punto("E1"), figura.punto("Fs2")))'
        # Y el de llevar un pie de β a la cota del borde de atrás.
        D_atras: 'cruce_aparente(figura.segmento("AM2a"), segmento2(figura.punto("D1"), figura.punto("Gs2")))'
        # Los extremos de las rectas largas.
        L_J2: 'desplaza(proy_alzado(J), dy: mm(-4))'
        L_uno1: 'desplaza(uno1, dx: mm(-3))'
        L_dos1: 'desplaza(dos1, dx: mm(-3))'
        L_tres1: 'desplaza(tres1, dx: mm(-3))'
        L_uno2: 'desplaza(uno2, dy: mm(-4))'
        L_dos2: 'desplaza(dos2, dy: mm(-4))'
        L_tres2: 'desplaza(tres2, dy: mm(-4))'
        L_E2: 'desplaza(proy_alzado(E), dx: mm(3))'
        L_D2: 'desplaza(proy_alzado(D), dx: mm(3))'
        L_F2: 'desplaza(proy_alzado(F), dx: mm(3))'
        # c) Decisión: cada pieza de la intersección está en un faldón, y se
        # abate con él. α, de canto, sobre el plano frontal de su borde de
        # delante, KL, que es frontal (su alzado es A₂B₂): cada punto se aparta
        # de A₂B₂, por la perpendicular, lo que su planta dista de K₁L₁. β,
        # sobre el plano horizontal de su alero BN, que es horizontal: A con su
        # triángulo, y los demás por la limahoya abatida, A₀B₁. Los dos lados de
        # cada charnela valen (una elección); la construcción baja α hacia la
        # izquierda, al hueco de debajo de A₂B₂, y β hacia delante.
        kl: recta3(K, L)
        bn: recta3(B, N)
        H_ab: abatido_a_elegir(H, kl, alfa)
        I_abf: 'abatido_junto(I, kl, alfa, con: H_ab, de: H)'
        G_abf: 'abatido_junto(G, kl, alfa, con: H_ab, de: H)'
        J_abf: 'abatido_junto(J, kl, alfa, con: H_ab, de: H)'
        A_ab: abatido_a_elegir(A, bn, beta)
        C_ab: 'abatido_junto(C, bn, beta, con: A_ab, de: A)'
        D_ab: 'abatido_junto(D, bn, beta, con: A_ab, de: A)'
        E_ab: 'abatido_junto(E, bn, beta, con: A_ab, de: A)'
        F_ab: 'abatido_junto(F, bn, beta, con: A_ab, de: A)'
        I_ab: 'abatido_junto(I, bn, beta, con: A_ab, de: A)'
        J_ab: 'abatido_junto(J, bn, beta, con: A_ab, de: A)'
        # Lo que cada punto de α dista de la charnela KL (en la planta, de K₁L₁).
        dH: vm(H, pie_perpendicular(H, kl))
        dI: vm(I, pie_perpendicular(I, kl))
        dG: vm(G, pie_perpendicular(G, kl))
        dJ: vm(J, pie_perpendicular(J, kl))
        # Y lo que dista del borde de atrás de β, A₁M₁: el error de medir desde
        # la recta que no es.
        dHmal: vm_planta(H, pie_perpendicular(H, recta3(A, M)))
        perpH2: 'perpendicular(por: proy_alzado(H), a: figura.segmento("AB2"))'
        perpG2: 'perpendicular(por: proy_alzado(G), a: figura.segmento("AB2"))'
        perpJ2: 'perpendicular(por: proy_alzado(J), a: figura.segmento("AB2"))'
        # β: Q, el pie de A en la charnela (donde A₁K₁, que es la perpendicular
        # a la charnela por A₁, corta B₁N₁ prolongada), y el triángulo de su
        # radio: lo que A está más alto que B, que es M₂N₂, llevado desde A₁ por
        # A₁M₁, paralela a la charnela, hasta T₁.
        Q1: 'cruce_aparente(figura.segmento("AK1"), figura.segmento("BN1"))'
        T1: 'uno(medir_sobre(figura.segmento("AM1"), desde: figura.punto("A1"), distancia: diferencia_de_cotas(A, B)), 1)'
        A0: proy_planta(rama(A_ab, 1))
        ab0: segmento2(A0, figura.punto("B1"))
        uno0: 'cruce_aparente(ab0, segmento2(uno1, desplaza(uno1, dy: 10)))'
        dos0: 'cruce_aparente(ab0, segmento2(dos1, desplaza(dos1, dy: 10)))'
        tres0: 'cruce_aparente(ab0, segmento2(tres1, desplaza(tres1, dy: 10)))'
        # Los pies en la charnela, para los dos errores del radio: llevar solo
        # lo que dista la planta, o solo lo que sube el punto.
        pC: pie_perpendicular(C, bn)
        pD: pie_perpendicular(D, bn)
        pE: pie_perpendicular(E, bn)
        pF: pie_perpendicular(F, bn)
        pI: pie_perpendicular(I, bn)
        pJ: pie_perpendicular(J, bn)
        perpC1: 'perpendicular(por: figura.punto("C1"), a: figura.segmento("BN1"))'
        perpD1: 'perpendicular(por: figura.punto("D1"), a: figura.segmento("BN1"))'
        perpE1: 'perpendicular(por: figura.punto("E1"), a: figura.segmento("BN1"))'
        perpF1: 'perpendicular(por: figura.punto("F1"), a: figura.segmento("BN1"))'
        perpI1: 'perpendicular(por: Ip, a: figura.segmento("BN1"))'
        perpJ1: 'perpendicular(por: Jp, a: figura.segmento("BN1"))'
        # α: los pies en K₁L₁ de las perpendiculares por H₁ (e I₁), G₁ y J₁.
        fH: 'cruce_aparente(figura.segmento("KL1"), segmento2(figura.punto("H1"), figura.punto("C1")))'
        fG: 'cruce_aparente(figura.segmento("KL1"), segmento2(figura.punto("G1"), figura.punto("D1")))'
        fJ: 'cruce_aparente(figura.segmento("KL1"), segmento2(Jp, desplaza(Jp, dy: 10)))'
        # Los extremos de las rectas largas del paso c).
        L_H2: 'desplaza(proy_alzado(H), dy: mm(-4))'
        L_G2: 'desplaza(proy_alzado(G), dy: mm(-4))'
        L_BN1: 'uno(medir_sobre(figura.segmento("BN1"), desde: figura.punto("B1"), distancia: mm(50)), 2)'
        A0mas: 'desplaza(A0, dy: mm(3))'
        L_C0: 'desplaza(proy_planta(rama(C_ab, 1)), dy: mm(3))'
        L_D0: 'desplaza(proy_planta(rama(D_ab, 1)), dy: mm(3))'
        L_E0: 'desplaza(proy_planta(rama(E_ab, 1)), dy: mm(3))'
        L_J0: 'desplaza(fJ, dy: mm(3))'
        L_uno0: 'desplaza(proy_planta(rama(E_ab, 1)), dx: mm(3))'
        L_dos0: 'desplaza(proy_planta(rama(D_ab, 1)), dx: mm(3))'
        L_tres0: 'desplaza(proy_planta(rama(F_ab, 1)), dx: mm(3))'
        L_I0f: 'uno(medir_sobre(perpH2, desde: proy_alzado(rama(I_abf, 1)), distancia: mm(3)), 1)'
        L_G0f: 'uno(medir_sobre(perpG2, desde: proy_alzado(rama(G_abf, 1)), distancia: mm(3)), 1)'
        L_J0f: 'uno(medir_sobre(perpJ2, desde: proy_alzado(rama(J_abf, 1)), distancia: mm(3)), 1)'
        ef_mm: en_mm(vm(E, F))
      comprueba:
        - en_plano(L, alfa)
        - en_plano(N, beta)
        - en_plano(I, beta)
        - en_plano(J, beta)
    pasos:
      - tipo: reconocer
        pregunta: Los pies de G y de H caen en α y se suben en vertical hasta A₂B₂. ¿Y el de una arista que cae en β, como D?
        opciones:
          - texto: También en vertical hasta A₂B₂, porque la torre es vertical
            mensaje: |
              La torre es vertical, y por eso el pie de D está en la vertical de D₁, pero no en A₂B₂. A₂B₂ es el
              alzado de α, que es de canto; β no lo es, y en el alzado ocupa todo el cuadrilátero de A₂ a N₂.
              Subir D₁ hasta A₂B₂ daría el punto de α que tiene esa planta, 26 mm más abajo que el pie de D.
          - texto: Con la horizontal de β que pasa por D, que corta A₁B₁ en la planta y da la cota en A₂B₂
            correcta: true
            mensaje: |
              Eso es. β contiene rectas paralelas a la línea de tierra: su borde de atrás y su alero lo son.
              La que pasa por D, en la planta, es la horizontal de D₁, y corta A₁B₁ en un punto que también es
              de α. Ese punto sube en vertical a A₂B₂, y su altura es la de D: la horizontal del alzado por él
              corta la vertical de D₁ en D₂.
          - texto: Con la vertical de D₁ hasta el borde de atrás de β, A₂M₂, porque la torre se apoya en él
            mensaje: |
              El borde de atrás de β está a la cota de A, y D está más adelante, en β, más abajo: el faldón baja
              hacia delante. El pie de D queda 3,1 mm por debajo de A₂M₂. Su cota sale de la horizontal de β que
              pasa por él, cortada con A₁B₁.

      - tipo: construir
        titulo: La torre hasta el tejado, y su intersección con α y β
        intro: |
          Los apartados a) y b) a la vez: completar el alzado es dibujar las aristas de la torre hasta donde
          se apoyan en el tejado, y esos puntos son la intersección. Llamamos C, D, E, F, G y H a las aristas
          de la torre, nombres nuestros, en los vértices del hexágono de trazos de la planta, empezando por
          el de arriba a la izquierda y siguiendo el reloj. En la planta, la intersección es ese mismo
          hexágono, que ya está dibujado: las paredes de la torre son verticales. Falta en el alzado.

          G y H caen en α, que es de canto: su alzado es A₂B₂, y se suben en vertical hasta ella. C, D, E y F
          caen en β: su cota sale de la horizontal de β que pasa por cada uno, paralela a la línea de tierra,
          que en la planta corta A₁B₁ en 1₁ (la de C y E), 2₁ (la de D) y 3₁ (la de F). I y J, también nombres
          nuestros, son los puntos donde la limahoya A₁B₁ cruza el hexágono: ahí la intersección pasa de α a β.
          I₂ cae en H₂. Marca I₁ y J₁, y los alzados de los pies, de H a F.

          Después, pasa a limpio con «arista vista» y «arista oculta» lo que falta del alzado. Tomamos las
          piezas opacas, que el enunciado no lo dice. 3₂ queda a 1,3 mm de G₂, C₂ a 3,4 de H₂, J₂ a 3,5 de B₂, e I₁
          y J₁ a unos 3 mm de donde A₁B₁ pasa a trazos o vuelve a continua: amplía con la lupa (×4) antes de
          marcarlos.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, visto, oculto, borrar]
        tolerancia: 1
        objetivos:
          - nombre: I1
            pide: I, donde la limahoya cruza el lado HC del hexágono, en la planta
            es: solucion.Ip
            bien: |
              I₁ está donde A₁B₁, a trazos bajo la cubierta, corta H₁C₁. I es de los dos faldones: de I a H la
              intersección va por α, y de I a C, por β.
            diagnosticos:
              - si: '!en_recta(figura.segmento("AB1b"))'
                mensaje: |
                  I es un punto de la limahoya: I₁ va **en A₁B₁**, el tramo a trazos que pasa bajo la cubierta.
                ejemplo: 'desplaza(solucion.Ip, dx: mm(5))'
              - si: '!en_recta(figura.segmento("HC1"))'
                mensaje: |
                  I está en la pared HC de la torre: I₁ va **en H₁C₁**, el lado izquierdo del hexágono de trazos.
                ejemplo: 'uno(medir_sobre(figura.segmento("AB1b"), desde: solucion.Ip, distancia: mm(6)), 1)'
              - si: siempre
                mensaje: |
                  I₁ está donde A₁B₁ corta H₁C₁.
          - nombre: J1
            pide: J, donde la limahoya cruza el lado FG del hexágono, en la planta
            es: solucion.Jp
            bien: |
              J₁ está donde A₁B₁ corta F₁G₁, cerca de B₁. De G a J la intersección va por α, y de J a F, por β.
            diagnosticos:
              - si: cerca_de(figura.punto("B1"))
                mensaje: |
                  Ese es B₁, el extremo de la limahoya. J está antes, donde A₁B₁ cruza el lado F₁G₁ del hexágono.
                ejemplo: figura.punto("B1")
              - si: '!en_recta(figura.segmento("AB1b"))'
                mensaje: |
                  J es un punto de la limahoya: J₁ va **en A₁B₁**.
                ejemplo: 'desplaza(solucion.Jp, dy: mm(5))'
              - si: '!en_recta(figura.segmento("FG1"))'
                mensaje: |
                  J está en la pared FG de la torre: J₁ va **en F₁G₁**, el lado de abajo a la derecha del
                  hexágono.
                ejemplo: 'uno(medir_sobre(figura.segmento("AB1b"), desde: solucion.Jp, distancia: mm(6)), 2)'
              - si: siempre
                mensaje: |
                  J₁ está donde A₁B₁ corta F₁G₁.
          - nombre: H2
            pide: el pie de la arista H, en el alzado (cae en el mismo punto que I₂)
            es: proy_alzado(solucion.H)
            bien: |
              H₂ está en A₂B₂, en la vertical de H₁: H cae en α, que es de canto. I₂ cae en el mismo punto,
              porque I está en la misma vertical del papel y también en α.
            diagnosticos:
              - si: cerca_de(proy_alzado(solucion.C))
                mensaje: |
                  Ese es C₂, el pie de la arista de atrás, que cae en β, 3,4 mm más arriba. H es la de delante, y
                  cae en α: su pie está en A₂B₂.
                ejemplo: proy_alzado(solucion.C)
              - si: '!en_recta(segmento2(figura.punto("H1"), figura.punto("Hs2")))'
                mensaje: |
                  El pie de H está en la **vertical de H₁**, la que sigue la arista de la izquierda de la torre en
                  el alzado.
                ejemplo: 'desplaza(proy_alzado(solucion.H), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la vertical de H₁, pero no en A₂B₂. α es de canto: todos sus puntos se ven en el alzado
                  sobre A₂B₂, y el pie de H también.
          - nombre: G2
            pide: el pie de la arista G, en el alzado
            es: proy_alzado(solucion.G)
            bien: |
              G₂ está en A₂B₂, en la vertical de G₁, la arista de delante de la torre.
            diagnosticos:
              - si: cerca_de(solucion.tres2)
                mensaje: |
                  Ese es 3₂, el punto de A₂B₂ que da la cota de F, a 1,3 mm de G₂. G₂ está en la vertical de G₁, la
                  arista de delante.
                ejemplo: solucion.tres2
              - si: cerca_de(solucion.D_atras)
                mensaje: |
                  Has llevado G al borde de atrás de β. G cae en α, que es de canto, y su pie está en A₂B₂, mucho
                  más abajo.
                ejemplo: solucion.D_atras
              - si: '!en_recta(segmento2(figura.punto("G1"), figura.punto("Gs2")))'
                mensaje: |
                  El pie de G está en la **vertical de G₁**, la que sigue la arista de delante de la torre en el
                  alzado.
                ejemplo: 'desplaza(proy_alzado(solucion.G), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la vertical de G₁, pero no en A₂B₂: G cae en α, y su pie se ve sobre A₂B₂.
          - nombre: J2
            pide: J, en el alzado
            es: proy_alzado(solucion.J)
            bien: |
              J₂ está en A₂B₂, en la vertical de J₁: J es de la limahoya.
            diagnosticos:
              - si: cerca_de(figura.punto("B2"))
                mensaje: |
                  Ese es B₂. J está en la vertical de J₁, un poco antes, sobre A₂B₂.
                ejemplo: figura.punto("B2")
              - si: '!en_vertical_de(J1)'
                mensaje: |
                  J₂ va en la **vertical de J₁**: es el mismo punto visto dos veces.
                ejemplo: 'desplaza(proy_alzado(solucion.J), dx: mm(6))'
              - si: siempre
                mensaje: |
                  J₂ está donde la vertical de J₁ corta A₂B₂.
          - nombre: C2
            pide: el pie de la arista C, en el alzado
            es: proy_alzado(solucion.C)
            bien: |
              C₂ está en la vertical de C₁, a la altura de 1₂: C y E están en la misma horizontal de β, la que
              corta A₁B₁ en 1₁.
            diagnosticos:
              - si: cerca_de(solucion.C_alfa)
                mensaje: |
                  Ese es H₂: has subido C₁ hasta A₂B₂, como si C cayera en α. C cae en β, y su cota sale de la
                  horizontal de β que pasa por C₁ y corta A₁B₁ en 1₁; 1₂ sube a A₂B₂, y la horizontal de 1₂ corta la
                  vertical de C₁.
                ejemplo: solucion.C_alfa
              - si: cerca_de(solucion.x_AM_H)
                mensaje: |
                  Has llevado C a la cota del borde de atrás de β. C₁ está más adelante que A₁M₁, y β baja hacia
                  delante: su pie queda más abajo, a la altura de 1₂.
                ejemplo: solucion.x_AM_H
              - si: '!en_recta(segmento2(figura.punto("H1"), figura.punto("Hs2")))'
                mensaje: |
                  El pie de C está en la **vertical de C₁**, que es la misma de H₁: las dos aristas se ven juntas en
                  el alzado.
                ejemplo: 'desplaza(proy_alzado(solucion.C), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la vertical de C₁, pero no a la altura buena. Por C₁, la paralela a la línea de tierra
                  hasta A₁B₁ da 1₁; súbelo a A₂B₂, y la horizontal de 1₂ corta la vertical de C₁ en C₂.
          - nombre: E2
            pide: el pie de la arista E, en el alzado
            es: proy_alzado(solucion.E)
            bien: |
              E₂ está en la vertical de E₁, a la altura de C₂: C y E están en la misma horizontal de β.
            diagnosticos:
              - si: cerca_de(proy_alzado(solucion.F))
                mensaje: |
                  Ese es F₂, el pie de la arista de delante a la derecha. E es la de atrás, más alta: su
                  horizontal de β es la de C, la de 1.
                ejemplo: proy_alzado(solucion.F)
              - si: cerca_de(solucion.E_alfa)
                mensaje: |
                  Has subido E₁ hasta A₂B₂ prolongada, como si E cayera en α. E cae en β: su cota es la de C, la
                  de la horizontal por 1₂.
                ejemplo: solucion.E_alfa
              - si: '!en_recta(segmento2(figura.punto("E1"), figura.punto("Fs2")))'
                mensaje: |
                  El pie de E está en la **vertical de E₁**, que es la misma de F₁.
                ejemplo: 'desplaza(proy_alzado(solucion.E), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la vertical de E₁, pero no a la altura buena: la de C₂, la horizontal de 1₂.
          - nombre: D2
            pide: el pie de la arista D, en el alzado
            es: proy_alzado(solucion.D)
            bien: |
              D₂ está en la vertical de D₁, a la altura de 2₂: la horizontal de β por D corta A₁B₁ en 2₁. Es el
              punto más alto de la intersección, porque D es la arista de más atrás.
            diagnosticos:
              - si: cerca_de(solucion.D_alfa)
                mensaje: |
                  Ese es G₂: has subido D₁ hasta A₂B₂, como si D cayera en α. D cae en β: por D₁, la paralela a la
                  línea de tierra hasta A₁B₁ da 2₁; 2₂ sube a A₂B₂, y su horizontal da D₂.
                ejemplo: solucion.D_alfa
              - si: cerca_de(solucion.D_atras)
                mensaje: |
                  Has llevado D a la cota del borde de atrás de β. D₁ está un poco más adelante que A₁M₁, y β baja
                  hacia delante: D₂ queda 3,1 mm más abajo.
                ejemplo: solucion.D_atras
              - si: '!en_recta(segmento2(figura.punto("D1"), figura.punto("Gs2")))'
                mensaje: |
                  El pie de D está en la **vertical de D₁**, que es la misma de G₁.
                ejemplo: 'desplaza(proy_alzado(solucion.D), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la vertical de D₁, pero no a la altura de 2₂.
          - nombre: F2
            pide: el pie de la arista F, en el alzado
            es: proy_alzado(solucion.F)
            bien: |
              F₂ está en la vertical de F₁, a la altura de 3₂: la horizontal de β por F corta A₁B₁ en 3₁, bajo la
              cubierta.
            diagnosticos:
              - si: cerca_de(proy_alzado(solucion.E))
                mensaje: |
                  Ese es E₂, el pie de la arista de atrás a la derecha. F está más adelante, y β baja hacia
                  delante: su pie queda más abajo, a la altura de 3₂.
                ejemplo: proy_alzado(solucion.E)
              - si: '!en_recta(segmento2(figura.punto("F1"), figura.punto("Fs2")))'
                mensaje: |
                  El pie de F está en la **vertical de F₁**, la del lado derecho del hexágono.
                ejemplo: 'desplaza(proy_alzado(solucion.F), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la vertical de F₁, pero no a la altura buena. Por F₁, la paralela a la línea de tierra
                  hasta A₁B₁, a trazos, da 3₁; 3₂ sube a A₂B₂, y su horizontal corta la vertical de F₁ en F₂.
        # Decisión: las piezas, opacas (lo dicen las Notas). La visibilidad sale
        # de un cálculo de líneas ocultas aparte, por rayos contra las paredes
        # de la torre y los faldones. En el alzado, las aristas de delante, G, H
        # y F, tapan a las de atrás, D, C y E, que caen en su misma vertical; la
        # intersección de las paredes de atrás (E a D a C) queda detrás de la
        # torre, y también el borde de atrás de β entre H y F. H₂G₂J₂ cae sobre
        # A₂B₂, ya dibujada, y C₂I₂ y E₂F₂, sobre las aristas H y F: no son
        # tramos aparte. En la planta no falta nada: la intersección es el
        # hexágono de trazos.
        tramos:
          - traza: segmento2(figura.punto("Hs2"), proy_alzado(solucion.H))
            tipo: visto
            porque: 'La arista H, de delante a la izquierda, baja hasta su pie en α: por delante no la tapa nada, y α, que es de canto, no tapa nada en el alzado. Detrás, en la misma vertical, va la arista C, que acaba antes.'
          - traza: segmento2(figura.punto("Gs2"), proy_alzado(solucion.G))
            tipo: visto
            porque: 'La arista G es la de más delante de la torre, y baja hasta su pie en α: nada la tapa. La D, la de más atrás, va detrás en la misma vertical.'
          - traza: segmento2(figura.punto("Fs2"), proy_alzado(solucion.F))
            tipo: visto
            porque: 'La arista F, de delante a la derecha, baja hasta su pie en β: el trozo de β que tiene delante queda más abajo que F₂, porque β baja hacia delante, y no la tapa. La E va detrás, en la misma vertical.'
          - traza: segmento2(proy_alzado(solucion.J), proy_alzado(solucion.F))
            tipo: visto
            porque: 'JF es la intersección de la pared de delante a la derecha de la torre con β: esa pared mira hacia quien mira el alzado, y nada le pasa por delante.'
          - traza: segmento2(proy_alzado(solucion.E), proy_alzado(solucion.D))
            tipo: oculto
            porque: 'ED es la intersección de la pared de atrás a la derecha con β, y la pared de delante a la derecha, FG, le pasa por delante y la tapa: en la planta, F₁G₁ va entre 21,2 y 42,5 mm más cerca de quien mira.'
          - traza: segmento2(proy_alzado(solucion.D), proy_alzado(solucion.C))
            tipo: oculto
            porque: 'DC es la intersección de la pared de atrás a la izquierda con β, y la pared de delante a la izquierda, GH, le pasa por delante y la tapa: en la planta, G₁H₁ va entre 21,2 y 42,5 mm más cerca de quien mira.'
          - traza: segmento2(solucion.x_AM_H, solucion.x_AM_F)
            tipo: oculto
            porque: 'Entre las aristas H y F, la torre le pasa por delante al borde de atrás de β y lo tapa: en los cruces aparentes con las aristas H y F, cada una va 35,8 mm más cerca de quien mira. Por eso la hoja lo deja sin dibujar ahí.'
        trazado:
          - segmento2(figura.punto("E1"), solucion.uno1)
          - segmento2(figura.punto("D1"), solucion.dos1)
          - segmento2(figura.punto("F1"), solucion.tres1)
          - segmento2(solucion.uno1, solucion.uno2)
          - segmento2(solucion.dos1, solucion.dos2)
          - segmento2(solucion.tres1, solucion.tres2)
          - segmento2(solucion.uno2, proy_alzado(solucion.E))
          - segmento2(solucion.dos2, proy_alzado(solucion.D))
          - segmento2(solucion.tres2, proy_alzado(solucion.F))
          - segmento2(solucion.Jp, proy_alzado(solucion.J))
        construccion:
          - con: marca
            traza: figura.punto("C1")
            rotulo: C₁
            porque: |
              C₁, el vértice de arriba a la izquierda del hexágono de trazos: la arista de atrás a la izquierda de
              la torre. C, D, E, F, G y H son nombres nuestros, siguiendo el reloj en la planta.
          - con: marca
            traza: figura.punto("D1")
            rotulo: D₁
            porque: |
              D₁, en el vértice de arriba del hexágono de trazos: la arista de más atrás. Nombre nuestro.
          - con: marca
            traza: figura.punto("E1")
            rotulo: E₁
            porque: |
              E₁, en el vértice de arriba a la derecha del hexágono de trazos. Nombre nuestro.
          - con: marca
            traza: figura.punto("F1")
            rotulo: F₁
            porque: |
              F₁, en el vértice de abajo a la derecha del hexágono de trazos. Nombre nuestro.
          - con: marca
            traza: figura.punto("G1")
            rotulo: G₁
            porque: |
              G₁, en el vértice de abajo del hexágono de trazos: la arista de más delante. Nombre nuestro.
          - con: marca
            traza: figura.punto("H1")
            rotulo: H₁
            porque: |
              H₁, en el vértice de abajo a la izquierda del hexágono de trazos. Nombre nuestro.
          - con: marca
            traza: solucion.Ip
            rotulo: I₁
            porque: |
              I₁, donde A₁B₁, a trazos, corta H₁C₁: el punto de la limahoya que está en la pared HC. Nombre nuestro.
          - con: marca
            traza: solucion.Jp
            porque: |
              J₁, donde A₁B₁ corta F₁G₁, cerca de B₁: el punto de la limahoya que está en la pared FG. Nombre
              nuestro. Va sin rótulo, que pisaría el de B₁.
          - con: escuadra-cartabon
            traza: '[segmento2(figura.punto("H1"), figura.punto("Hs2")), segmento2(figura.punto("G1"), figura.punto("Gs2")), segmento2(figura.punto("F1"), figura.punto("Fs2")), segmento2(solucion.Jp, solucion.L_J2)]'
            porque: |
              **Las verticales.** Por H₁, G₁ y F₁, las verticales hasta los pies de la torre del alzado, que
              prolongan: son las aristas de la torre. La de H₁ pasa por C₁ e I₁; la de G₁, por D₁, y la de F₁, por
              E₁, porque cada par está en la misma vertical del papel. Y por J₁, la vertical hasta pasar A₂B₂.
          - con: marca
            traza: proy_alzado(solucion.H)
            rotulo: H₂
            porque: |
              **G y H, en α.** α es de canto: su alzado es A₂B₂. H₂, donde la vertical de H₁ corta A₂B₂. I₂ cae en el
              mismo punto, porque I está en la misma vertical y también en α.
          - con: marca
            traza: proy_alzado(solucion.G)
            rotulo: G₂
            porque: |
              G₂, donde la vertical de G₁ corta A₂B₂.
          - con: marca
            traza: proy_alzado(solucion.J)
            porque: |
              J₂, donde la vertical de J₁ corta A₂B₂, cerca de B₂. Va sin rótulo, que pisaría el de B₂.
          - con: escuadra-cartabon
            traza: '[segmento2(figura.punto("E1"), solucion.L_uno1), segmento2(figura.punto("D1"), solucion.L_dos1), segmento2(figura.punto("F1"), solucion.L_tres1)]'
            porque: |
              **C, D, E y F, en β.** β contiene rectas paralelas a la línea de tierra, y la que pasa por un pie
              tiene su cota. En la planta, por E₁ (que pasa por C₁), por D₁ y por F₁, las horizontales hacia la
              izquierda, hasta pasar A₁B₁: la de F₁ la corta en su tramo de trazos, bajo la cubierta.
          - con: marca
            traza: solucion.uno1
            porque: |
              1₁, donde la horizontal de C₁ y E₁ corta A₁B₁: un punto de la limahoya con la cota de C y de E. 1, 2
              y 3 son nombres nuestros. Va sin rótulo, que C₁ taparía.
          - con: marca
            traza: solucion.dos1
            rotulo: 2₁
            porque: |
              2₁, donde la horizontal de D₁ corta A₁B₁, cerca de A₁.
          - con: marca
            traza: solucion.tres1
            porque: |
              3₁, donde la horizontal de F₁ corta A₁B₁ a trazos, bajo la cubierta. Va sin rótulo: la arista de
              la cubierta que baja por G₁, a 1 mm, lo taparía.
          - con: escuadra-cartabon
            traza: '[segmento2(solucion.uno1, solucion.L_uno2), segmento2(solucion.dos1, solucion.L_dos2), segmento2(solucion.tres1, solucion.L_tres2)]'
            porque: |
              Por 1₁, 2₁ y 3₁, las verticales hasta pasar A₂B₂: son puntos de la limahoya, y su alzado está en A₂B₂.
          - con: marca
            traza: solucion.uno2
            porque: |
              1₂, donde la vertical de 1₁ corta A₂B₂: a la altura de C y de E. Va sin rótulo, que C₂ taparía.
          - con: marca
            traza: solucion.dos2
            rotulo: 2₂
            porque: |
              2₂, donde la vertical de 2₁ corta A₂B₂: a la altura de D.
          - con: marca
            traza: solucion.tres2
            porque: |
              3₂, donde la vertical de 3₁ corta A₂B₂, a la altura de F, 1,3 mm antes de G₂. Va sin rótulo, que
              pisaría el de G₂.
          - con: escuadra-cartabon
            traza: '[segmento2(solucion.uno2, solucion.L_E2), segmento2(solucion.dos2, solucion.L_D2), segmento2(solucion.tres2, solucion.L_F2)]'
            porque: |
              En el alzado, por 1₂, 2₂ y 3₂, las horizontales hacia la derecha: la de 1₂ hasta pasar la vertical de
              E₁ (corta antes la de C₁), la de 2₂ hasta pasar la de D₁, y la de 3₂ hasta pasar la de F₁.
          - con: marca
            traza: proy_alzado(solucion.C)
            rotulo: C₂
            porque: |
              C₂, donde la horizontal de 1₂ corta la vertical de C₁, 3,4 mm por encima de H₂.
          - con: marca
            traza: proy_alzado(solucion.E)
            rotulo: E₂
            porque: |
              E₂, donde la horizontal de 1₂ corta la vertical de E₁.
          - con: marca
            traza: proy_alzado(solucion.D)
            rotulo: D₂
            porque: |
              D₂, donde la horizontal de 2₂ corta la vertical de D₁.
          - con: marca
            traza: proy_alzado(solucion.F)
            rotulo: F₂
            porque: |
              F₂, donde la horizontal de 3₂ corta la vertical de F₁.
          - con: arista-vista
            traza: '[segmento2(figura.punto("Hs2"), proy_alzado(solucion.H)), segmento2(figura.punto("Gs2"), proy_alzado(solucion.G)), segmento2(figura.punto("Fs2"), proy_alzado(solucion.F)), segmento2(proy_alzado(solucion.J), proy_alzado(solucion.F))]'
            porque: |
              **A limpio, el alzado.** Las aristas de delante, H, G y F, hasta sus pies, y J₂F₂, en la pared de
              delante a la derecha. H₂G₂J₂ ya está: cae sobre A₂B₂.
          - con: arista-oculta
            traza: '[segmento2(proy_alzado(solucion.E), proy_alzado(solucion.D)), segmento2(proy_alzado(solucion.D), proy_alzado(solucion.C)), segmento2(solucion.x_AM_H, solucion.x_AM_F)]'
            porque: |
              A trazos, lo que la torre tapa: E₂D₂C₂, en las paredes de atrás, y el borde de atrás de β entre las
              aristas H y F.
        pista: |
          (1) Marca los vértices del hexágono de trazos, C₁ a H₁, e I₁ y J₁ donde A₁B₁ lo cruza. (2) G y H caen
          en α, de canto: sus verticales cortan A₂B₂ en G₂ y H₂. (3) C, D, E y F caen en β: por cada uno, la
          paralela a la línea de tierra hasta A₁B₁; sube ese punto a A₂B₂ y vuelve en horizontal a la vertical
          del pie. (4) Las paredes de atrás y lo que queda detrás de la torre, a trazos.
        desarrollo: |
          En verde claro, las horizontales de β por los pies de la torre hasta A₁B₁, sus verticales hasta A₂B₂ y
          sus horizontales en el alzado. La intersección es la línea cerrada IHGJFEDC: de I a J por α, que en el
          alzado cae sobre A₂B₂, y de J a I por β. En la planta es el hexágono de la torre, que la cubierta tapa
          desde arriba.

      - tipo: construir
        titulo: La intersección en verdadera magnitud
        intro: |
          La intersección no es plana: es una pieza en cada faldón, IHGJ en α y JFEDCI en β. Cada una se ve en
          verdadera magnitud abatiendo su faldón; el método y las charnelas son nuestros. También valdría
          desarrollar las paredes de la torre, una al lado de otra: la intersección saldría como una sola
          quebrada, con cada tramo en verdadera magnitud en su pared, y EF mediría lo mismo. α, que es de canto, se abate
          sobre el plano frontal de su borde de delante, KL: K y L, nombres nuestros, son sus esquinas de
          delante, y K₂ y L₂ caen en A₂ y B₂, así que en el alzado la charnela es la propia A₂B₂. Cada punto de α
          se aparta de A₂B₂, por la perpendicular, lo que su planta dista de K₁L₁, el borde de abajo de la
          planta de α. Marca H₀′, I₀′, G₀′ y J₀′: la prima es nuestra, y distingue los abatidos con α de los
          abatidos con β, porque I y J están en los dos faldones y cada abatimiento los lleva a otro sitio.

          β se abate sobre el plano horizontal de su alero, BN (N, nombre nuestro, es su esquina de delante a
          la derecha), prolongado hacia la izquierda. A, con su triángulo: lo que A está más alto que B es M₂N₂
          (M y N son las esquinas de la derecha de β). La limahoya abatida, A₀B₁, da I₀ y J₀; y las horizontales
          de β de C y E, de D y de F, que cortan A₁B₁ en 1₁, 2₁ y 3₁, dan C₀, E₀, D₀ y F₀. Marca I₀, J₀, C₀, E₀, D₀
          y F₀. Cada faldón puede abatirse a cualquiera de los dos lados de su charnela, pero todo él al mismo;
          aquí, α hacia la izquierda, al hueco de debajo de A₂B₂, y β hacia delante, donde hay sitio. J₀ cae a
          3,5 mm del alero y del lado del hexágono de la cubierta, y C₀ a 4,4 de 1₀: amplía con la lupa (×4) antes
          de marcarlos.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, borrar]
        tolerancia: 1
        objetivos:
          - nombre: H0p
            rotulo: H₀′
            pide: el pie de H, abatido con α
            es: proy_alzado(solucion.H_ab)
            bien: |
              H₀′ está en la perpendicular a A₂B₂ que pasa por H₂, a lo que H₁ dista de K₁L₁: 29,0 mm. Como H
              está en α, que es de canto, su alzado ya está en la charnela, y esa es toda su distancia real a ella.
            diagnosticos:
              - si: cerca_de(proy_alzado(solucion.H))
                mensaje: |
                  Ese es H₂, sin abatir. Al abatir α sobre el plano frontal de KL, H gira alrededor de la charnela
                  y, en el alzado, se aparta de A₂B₂ por la perpendicular.
                ejemplo: proy_alzado(solucion.H)
              - si: 'en_recta(solucion.perpH2) && a_distancia(de: proy_alzado(solucion.H), d: solucion.dHmal)'
                mensaje: |
                  Vas por la perpendicular, pero has medido lo que H₁ dista de A₁M₁, el borde de atrás de β. La
                  charnela es KL, el borde de **delante** de α: la distancia se mide de H₁ a K₁L₁.
                ejemplo: 'uno(medir_sobre(solucion.perpH2, desde: proy_alzado(solucion.H), distancia: solucion.dHmal), 1)'
              - si: 'cerca_de(desplaza(proy_alzado(solucion.H), dy: solucion.dH))'
                mensaje: |
                  Has bajado H₂ en vertical. Al abatir sobre el plano frontal, el punto gira alrededor de la
                  charnela en un plano perpendicular a ella: en el alzado se mueve por la **perpendicular a A₂B₂**.
                ejemplo: 'desplaza(proy_alzado(solucion.H), dy: solucion.dH)'
              - si: '!en_recta(solucion.perpH2)'
                mensaje: |
                  H₀′ está en la **perpendicular a A₂B₂ que pasa por H₂**: la charnela, en el alzado, es A₂B₂.
                ejemplo: 'desplaza(proy_alzado(rama(solucion.H_ab, 1)), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular a A₂B₂ por H₂, pero no a la distancia buena: la de H₁ a K₁L₁, en la
                  planta.
          - nombre: I0p
            rotulo: I₀′
            pide: I, abatido con α
            es: proy_alzado(solucion.I_abf)
            bien: |
              I₀′ está en la misma perpendicular que H₀′, porque I₂ es H₂, pero más lejos: I₁ dista de K₁L₁ 45,9 mm.
              IH es de punta, y abatida se ve entera.
            diagnosticos:
              - si: cerca_de(otra_rama(proy_alzado(solucion.I_abf)))
                mensaje: |
                  Ese es I abatido **al otro lado** de la charnela. El faldón gira entero, como una tapa sobre su
                  bisagra: I₀′ cae al lado de H₀′.
                ejemplo: proy_alzado(rama(solucion.I_abf, 2))
              - si: cerca_de(proy_alzado(solucion.H_ab))
                mensaje: |
                  Ese es H₀′. I tiene el mismo alzado que H, pero está más atrás: su planta dista más de K₁L₁, y
                  abatido queda más lejos de A₂B₂.
                ejemplo: proy_alzado(rama(solucion.H_ab, 1))
              - si: '!en_recta(solucion.perpH2)'
                mensaje: |
                  I₂ es H₂: I₀′ va en la **perpendicular a A₂B₂ que pasa por H₂**, la misma de H₀′.
                ejemplo: 'desplaza(proy_alzado(rama(solucion.I_abf, 1)), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular a A₂B₂ por H₂, pero no a la distancia buena: la de I₁ a K₁L₁.
          - nombre: G0p
            rotulo: G₀′
            pide: el pie de G, abatido con α
            es: proy_alzado(solucion.G_abf)
            bien: |
              G₀′ está en la perpendicular a A₂B₂ por G₂, a lo que G₁ dista de K₁L₁, 18,4 mm.
            diagnosticos:
              - si: cerca_de(otra_rama(proy_alzado(solucion.G_abf)))
                mensaje: |
                  Ese es G abatido **al otro lado** de la charnela: va al lado de H₀′.
                ejemplo: proy_alzado(rama(solucion.G_abf, 2))
              - si: cerca_de(proy_alzado(solucion.G))
                mensaje: |
                  Ese es G₂, sin abatir: se aparta de A₂B₂ por la perpendicular.
                ejemplo: proy_alzado(solucion.G)
              - si: '!en_recta(solucion.perpG2)'
                mensaje: |
                  G₀′ va en la **perpendicular a A₂B₂ que pasa por G₂**.
                ejemplo: 'desplaza(proy_alzado(rama(solucion.G_abf, 1)), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular a A₂B₂ por G₂, pero no a la distancia de G₁ a K₁L₁.
          - nombre: J0p
            rotulo: J₀′
            pide: J, abatido con α
            es: proy_alzado(solucion.J_abf)
            bien: |
              J₀′ está en la perpendicular a A₂B₂ por J₂, a lo que J₁ dista de K₁L₁, 21,9 mm. I₀′H₀′G₀′J₀′ es la
              pieza de α en verdadera magnitud.
            diagnosticos:
              - si: cerca_de(otra_rama(proy_alzado(solucion.J_abf)))
                mensaje: |
                  Ese es J abatido **al otro lado** de la charnela: va al lado de H₀′.
                ejemplo: proy_alzado(rama(solucion.J_abf, 2))
              - si: cerca_de(proy_alzado(solucion.J))
                mensaje: |
                  Ese es J₂, sin abatir: se aparta de A₂B₂ por la perpendicular.
                ejemplo: proy_alzado(solucion.J)
              - si: '!en_recta(solucion.perpJ2)'
                mensaje: |
                  J₀′ va en la **perpendicular a A₂B₂ que pasa por J₂**.
                ejemplo: 'desplaza(proy_alzado(rama(solucion.J_abf, 1)), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular a A₂B₂ por J₂, pero no a la distancia de J₁ a K₁L₁.
          - nombre: I0
            rotulo: I₀
            pide: I, abatido con β
            es: proy_planta(solucion.I_ab)
            bien: |
              I₀ está en A₀B₁, la limahoya abatida, en la perpendicular a la charnela que pasa por I₁: I es de la
              limahoya.
            diagnosticos:
              - si: cerca_de(solucion.Ip)
                mensaje: |
                  Ese es I₁, sin abatir. Al abatir β, I gira alrededor del alero y, en la planta, se aparta de él
                  por la perpendicular.
                ejemplo: solucion.Ip
              - si: 'en_recta(solucion.perpI1) && a_distancia(de: proy_planta(solucion.pI), d: vm_planta(solucion.I, solucion.pI))'
                mensaje: |
                  Has llevado al otro lado de la charnela solo lo que I₁ dista de ella **en la planta**, y la
                  planta acorta: I está además 21,1 mm más alto que el alero. El radio es la hipotenusa de las
                  dos; con A₀ bien abatido, I₀ cae en A₀B₁.
                ejemplo: 'uno(medir_sobre(solucion.perpI1, desde: proy_planta(solucion.pI), distancia: vm_planta(solucion.I, solucion.pI)), 1)'
              - si: '!en_recta(solucion.perpI1)'
                mensaje: |
                  I se abate por la **perpendicular a la charnela que pasa por I₁**: la vertical del papel, porque
                  el alero es horizontal en la planta.
                ejemplo: 'desplaza(proy_planta(rama(solucion.I_ab, 1)), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular a la charnela por I₁, pero no en A₀B₁. A₀ sale del triángulo de A: lo
                  que A₁ dista del alero, de un cateto, y M₂N₂, lo que A está más alto que B, del otro.
          - nombre: J0
            rotulo: J₀
            pide: J, abatido con β
            es: proy_planta(solucion.J_ab)
            bien: |
              J₀ está en A₀B₁, en la perpendicular a la charnela por J₁, muy cerca de ella: J casi está en el
              alero.
            diagnosticos:
              - si: cerca_de(otra_rama(proy_planta(solucion.J_ab)))
                mensaje: |
                  Ese es J abatido **al otro lado** de la charnela. β gira entero: J₀ cae al lado de I₀.
                ejemplo: proy_planta(rama(solucion.J_ab, 2))
              - si: '!en_recta(solucion.perpJ1)'
                mensaje: |
                  J se abate por la **perpendicular a la charnela que pasa por J₁**.
                ejemplo: 'desplaza(proy_planta(rama(solucion.J_ab, 1)), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular a la charnela por J₁, pero no en A₀B₁, la limahoya abatida.
          - nombre: C0
            rotulo: C₀
            pide: el pie de C, abatido con β
            es: proy_planta(solucion.C_ab)
            bien: |
              C₀ está en la perpendicular a la charnela por C₁, en la paralela al alero que pasa por 1₀: C está en
              la horizontal de β de 1, y esa horizontal, abatida, sigue paralela a la charnela.
            diagnosticos:
              - si: cerca_de(otra_rama(proy_planta(solucion.C_ab)))
                mensaje: |
                  Ese es C abatido **al otro lado** de la charnela: va al lado de I₀ y J₀.
                ejemplo: proy_planta(rama(solucion.C_ab, 2))
              - si: cerca_de(proy_planta(solucion.I_ab))
                mensaje: |
                  Ese es I₀: has bajado C₁ hasta A₀B₁. C no está en la limahoya; está en la horizontal de β que la
                  corta en 1. Baja 1₁ hasta A₀B₁, y la paralela al alero por 1₀ corta la perpendicular de C₁ en C₀.
                ejemplo: proy_planta(rama(solucion.I_ab, 1))
              - si: 'en_recta(solucion.perpC1) && a_distancia(de: proy_planta(solucion.pC), d: vm_planta(solucion.C, solucion.pC))'
                mensaje: |
                  Has llevado solo lo que C₁ dista del alero **en la planta**, y la planta acorta: C está 24,5 mm
                  más alto que el alero. El radio es la hipotenusa de las dos.
                ejemplo: 'uno(medir_sobre(solucion.perpC1, desde: proy_planta(solucion.pC), distancia: vm_planta(solucion.C, solucion.pC)), 1)'
              - si: 'en_recta(solucion.perpC1) && a_distancia(de: proy_planta(solucion.pC), d: diferencia_de_cotas(solucion.C, B))'
                mensaje: |
                  Has llevado solo lo que C está más alto que el alero, un cateto. El radio es la hipotenusa de esa
                  cota y de lo que C₁ dista del alero en la planta.
                ejemplo: 'uno(medir_sobre(solucion.perpC1, desde: proy_planta(solucion.pC), distancia: diferencia_de_cotas(solucion.C, B)), 1)'
              - si: '!en_recta(solucion.perpC1)'
                mensaje: |
                  C se abate por la **perpendicular a la charnela que pasa por C₁**, la vertical del papel.
                ejemplo: 'desplaza(proy_planta(rama(solucion.C_ab, 1)), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular por C₁, pero no a la distancia buena: en la paralela al alero que pasa
                  por 1₀, donde la perpendicular de 1₁ corta la limahoya abatida.
          - nombre: E0
            rotulo: E₀
            pide: el pie de E, abatido con β
            es: proy_planta(solucion.E_ab)
            bien: |
              E₀ está en la misma paralela al alero que C₀, en la perpendicular a la charnela por E₁: C y E
              están en la misma horizontal de β.
            diagnosticos:
              - si: cerca_de(otra_rama(proy_planta(solucion.E_ab)))
                mensaje: |
                  Ese es E abatido **al otro lado** de la charnela: va al lado de C₀.
                ejemplo: proy_planta(rama(solucion.E_ab, 2))
              - si: cerca_de(proy_planta(solucion.F_ab))
                mensaje: |
                  Ese es F₀. E es la arista de atrás de las dos de la derecha, y abatida queda más lejos del alero:
                  en la paralela de C₀.
                ejemplo: proy_planta(rama(solucion.F_ab, 1))
              - si: 'en_recta(solucion.perpE1) && a_distancia(de: proy_planta(solucion.pE), d: vm_planta(solucion.E, solucion.pE))'
                mensaje: |
                  Has llevado solo lo que E₁ dista del alero **en la planta**. El radio es mayor: E está además
                  24,5 mm más alto que el alero.
                ejemplo: 'uno(medir_sobre(solucion.perpE1, desde: proy_planta(solucion.pE), distancia: vm_planta(solucion.E, solucion.pE)), 1)'
              - si: '!en_recta(solucion.perpE1)'
                mensaje: |
                  E se abate por la **perpendicular a la charnela que pasa por E₁**.
                ejemplo: 'desplaza(proy_planta(rama(solucion.E_ab, 1)), dx: mm(-6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular por E₁, pero no en la paralela al alero de C₀.
          - nombre: D0
            rotulo: D₀
            pide: el pie de D, abatido con β
            es: proy_planta(solucion.D_ab)
            bien: |
              D₀ está en la perpendicular a la charnela por D₁, en la paralela al alero que pasa por 2₀: el punto
              más lejano de la pieza, porque D es la arista de más atrás.
            diagnosticos:
              - si: cerca_de(otra_rama(proy_planta(solucion.D_ab)))
                mensaje: |
                  Ese es D abatido **al otro lado** de la charnela: va al lado de C₀.
                ejemplo: proy_planta(rama(solucion.D_ab, 2))
              - si: 'en_recta(solucion.perpD1) && a_distancia(de: proy_planta(solucion.pD), d: vm_planta(solucion.D, solucion.pD))'
                mensaje: |
                  Has llevado solo lo que D₁ dista del alero **en la planta**: D está además 32,8 mm más alto que el
                  alero, y el radio es la hipotenusa de las dos.
                ejemplo: 'uno(medir_sobre(solucion.perpD1, desde: proy_planta(solucion.pD), distancia: vm_planta(solucion.D, solucion.pD)), 1)'
              - si: '!en_recta(solucion.perpD1)'
                mensaje: |
                  D se abate por la **perpendicular a la charnela que pasa por D₁**, que es la vertical de G₁.
                ejemplo: 'desplaza(proy_planta(rama(solucion.D_ab, 1)), dx: mm(6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular por D₁, pero no en la paralela al alero que pasa por 2₀.
          - nombre: F0
            rotulo: F₀
            pide: el pie de F, abatido con β
            es: proy_planta(solucion.F_ab)
            bien: |
              F₀ está en la perpendicular a la charnela por F₁, en la paralela al alero que pasa por 3₀.
              J₀F₀E₀D₀C₀I₀ es la pieza de β en verdadera magnitud.
            diagnosticos:
              - si: cerca_de(otra_rama(proy_planta(solucion.F_ab)))
                mensaje: |
                  Ese es F abatido **al otro lado** de la charnela: va al lado de E₀.
                ejemplo: proy_planta(rama(solucion.F_ab, 2))
              - si: cerca_de(figura.punto("F1"))
                mensaje: |
                  Ese es F₁, sin abatir: se aparta del alero por la perpendicular.
                ejemplo: figura.punto("F1")
              - si: 'en_recta(solucion.perpF1) && a_distancia(de: proy_planta(solucion.pF), d: vm_planta(solucion.F, solucion.pF))'
                mensaje: |
                  Has llevado solo lo que F₁ dista del alero **en la planta**: F está además 7,7 mm más alto que el
                  alero.
                ejemplo: 'uno(medir_sobre(solucion.perpF1, desde: proy_planta(solucion.pF), distancia: vm_planta(solucion.F, solucion.pF)), 1)'
              - si: '!en_recta(solucion.perpF1)'
                mensaje: |
                  F se abate por la **perpendicular a la charnela que pasa por F₁**.
                ejemplo: 'desplaza(proy_planta(rama(solucion.F_ab, 1)), dx: mm(-6))'
              - si: siempre
                mensaje: |
                  Estás en la perpendicular por F₁, pero no en la paralela al alero que pasa por 3₀.
        trazado:
          - segmento2(proy_alzado(rama(solucion.I_abf, 1)), proy_alzado(rama(solucion.H_ab, 1)))
          - segmento2(proy_alzado(rama(solucion.H_ab, 1)), proy_alzado(rama(solucion.G_abf, 1)))
          - segmento2(proy_alzado(rama(solucion.G_abf, 1)), proy_alzado(rama(solucion.J_abf, 1)))
          - segmento2(solucion.A0, figura.punto("B1"))
          - segmento2(proy_planta(rama(solucion.J_ab, 1)), proy_planta(rama(solucion.F_ab, 1)))
          - segmento2(proy_planta(rama(solucion.F_ab, 1)), proy_planta(rama(solucion.E_ab, 1)))
          - segmento2(proy_planta(rama(solucion.E_ab, 1)), proy_planta(rama(solucion.D_ab, 1)))
          - segmento2(proy_planta(rama(solucion.D_ab, 1)), proy_planta(rama(solucion.C_ab, 1)))
          - segmento2(proy_planta(rama(solucion.C_ab, 1)), proy_planta(rama(solucion.I_ab, 1)))
        bloques:
          - nombre: Abatimiento de α
            explica: |
              α es de canto: sus esquinas de delante, K y L, tienen el alzado de A y de B, y todo α
              se ve como A₂B₂. Lo abatimos, con método y charnela nuestros, sobre el plano frontal
              de su borde de delante, KL, que es frontal y en el alzado es la propia A₂B₂. Cada
              punto gira en un plano perpendicular a KL, y en el alzado se aparta de A₂B₂ por la
              perpendicular que pasa por su alzado. Como α es de canto, ese alzado ya está sobre la
              charnela, y la distancia real del punto a KL es solo su diferencia de alejamiento con
              KL: lo que su planta dista de K₁L₁. Abatida, la pieza IHGJ queda en verdadera magnitud
              en el hueco de debajo de A₂B₂.
          - nombre: Abatimiento de β
            explica: |
              β contiene rectas paralelas a la línea de tierra, y su alero BN es una: lo abatimos
              sobre el plano horizontal del alero, con BN de charnela, también por elección nuestra.
              En la planta, cada punto se aparta del alero por la perpendicular, que aquí es la
              vertical del papel, y su radio es la hipotenusa de lo que su planta dista de la
              charnela y de lo que el punto está más alto que ella. Basta hacerlo con un punto, A,
              con su triángulo: la limahoya abatida, A₀B₁, pasa por B, que está en la charnela y no
              se mueve, y en ella caen I₀ y J₀. Las horizontales de β son paralelas al alero, y
              abatidas lo siguen siendo: cada pie, C, D, E o F, sale de la paralela a la charnela
              que pasa por el punto de su horizontal en la limahoya abatida.
        construccion:
          - con: marca
            traza: '[figura.punto("C1"), figura.punto("D1"), figura.punto("E1"), figura.punto("F1"), figura.punto("G1"), figura.punto("H1")]'
            porque: |
              Los vértices del hexágono de trazos, C₁ a H₁, como en el paso anterior: las aristas de la torre,
              nombres nuestros, de la de atrás a la izquierda siguiendo el reloj.
          - con: marca
            traza: '[solucion.Ip, solucion.Jp]'
            porque: |
              I₁ y J₁, donde A₁B₁ corta H₁C₁ y F₁G₁: los puntos de la limahoya que están en las paredes de la torre.
          - con: escuadra-cartabon
            traza: '[segmento2(figura.punto("Hs2"), solucion.L_C0), segmento2(figura.punto("Gs2"), solucion.L_D0), segmento2(figura.punto("E1"), solucion.L_E0), segmento2(solucion.L_J2, solucion.Jp), segmento2(solucion.Jp, solucion.L_J0)]'
            porque: |
              **Las verticales**, largas, de una vez: la de H₁ (que pasa por C₁ e I₁) y la de G₁ (que pasa por D₁),
              desde el pie de la torre del alzado hasta muy por debajo de K₁L₁; la de E₁ (que pasa por F₁), solo
              hacia abajo; y la de J₁, desde encima de A₂B₂ hasta pasar K₁L₁. En la planta, son también las perpendiculares a
              la charnela de β.
          - con: marca
            traza: proy_alzado(solucion.H)
            rotulo: H₂
            bloque: Abatimiento de α
            porque: |
              **α.** H₂, donde la vertical de H₁ corta A₂B₂: α es de canto, y su alzado es A₂B₂. I₂ cae en el mismo
              punto.
          - con: marca
            traza: proy_alzado(solucion.G)
            rotulo: G₂
            bloque: Abatimiento de α
            porque: |
              G₂, donde la vertical de G₁ corta A₂B₂.
          - con: marca
            traza: proy_alzado(solucion.J)
            bloque: Abatimiento de α
            porque: |
              J₂, donde la vertical de J₁ corta A₂B₂, cerca de B₂. Va sin rótulo, que pisaría el de B₂.
          - con: escuadra-cartabon
            traza: '[segmento2(proy_alzado(solucion.H), solucion.L_I0f), segmento2(proy_alzado(solucion.G), solucion.L_G0f), segmento2(proy_alzado(solucion.J), solucion.L_J0f)]'
            guia: figura.segmento("AB2")
            bloque: Abatimiento de α
            porque: |
              Por H₂, G₂ y J₂, las **perpendiculares a A₂B₂**, hacia abajo a la izquierda, largas: al abatir α
              sobre el plano frontal de KL, cada punto gira alrededor de la charnela, y en el alzado se mueve
              por la perpendicular a ella.
          - con: compas
            traza: 'arco(proy_alzado(solucion.H), por: proy_alzado(rama(solucion.H_ab, 1)), desde: uno(medir_sobre(perpendicular(por: proy_alzado(rama(solucion.H_ab, 1)), a: solucion.perpH2), desde: proy_alzado(rama(solucion.H_ab, 1)), distancia: 6), 1), hasta: uno(medir_sobre(perpendicular(por: proy_alzado(rama(solucion.H_ab, 1)), a: solucion.perpH2), desde: proy_alzado(rama(solucion.H_ab, 1)), distancia: 6), 2))'
            toma: segmento2(figura.punto("H1"), solucion.fH)
            bloque: Abatimiento de α
            porque: |
              Con el compás, en la planta, lo que H₁ dista de K₁L₁: de H₁ a donde su vertical corta K₁L₁. H está
              en α, y su alzado ya está en la charnela: esa distancia es toda la que lo separa de KL. Desde H₂,
              sobre la perpendicular.
          - con: marca
            traza: proy_alzado(rama(solucion.H_ab, 1))
            rotulo: H₀′
            bloque: Abatimiento de α
            porque: |
              H₀′, donde el arco corta la perpendicular de H₂: H abatido con α. Al otro lado de A₂B₂ también
              valdría, con toda la pieza al mismo lado. La prima es nuestra: separa los abatidos con α de los
              abatidos con β.
          - con: compas
            traza: 'arco(proy_alzado(solucion.H), por: proy_alzado(rama(solucion.I_abf, 1)), desde: uno(medir_sobre(perpendicular(por: proy_alzado(rama(solucion.I_abf, 1)), a: solucion.perpH2), desde: proy_alzado(rama(solucion.I_abf, 1)), distancia: 6), 1), hasta: uno(medir_sobre(perpendicular(por: proy_alzado(rama(solucion.I_abf, 1)), a: solucion.perpH2), desde: proy_alzado(rama(solucion.I_abf, 1)), distancia: 6), 2))'
            toma: segmento2(solucion.Ip, solucion.fH)
            bloque: Abatimiento de α
            porque: |
              Lo que I₁ dista de K₁L₁, por la misma vertical, desde H₂, que es también I₂: I está más atrás que H,
              y cae más lejos.
          - con: marca
            traza: proy_alzado(rama(solucion.I_abf, 1))
            rotulo: I₀′
            bloque: Abatimiento de α
            porque: |
              I₀′, donde el arco corta la perpendicular de H₂, más allá de H₀′.
          - con: compas
            traza: 'arco(proy_alzado(solucion.G), por: proy_alzado(rama(solucion.G_abf, 1)), desde: uno(medir_sobre(perpendicular(por: proy_alzado(rama(solucion.G_abf, 1)), a: solucion.perpG2), desde: proy_alzado(rama(solucion.G_abf, 1)), distancia: 6), 1), hasta: uno(medir_sobre(perpendicular(por: proy_alzado(rama(solucion.G_abf, 1)), a: solucion.perpG2), desde: proy_alzado(rama(solucion.G_abf, 1)), distancia: 6), 2))'
            toma: segmento2(figura.punto("G1"), solucion.fG)
            bloque: Abatimiento de α
            porque: |
              Lo que G₁ dista de K₁L₁, por su vertical, desde G₂.
          - con: marca
            traza: proy_alzado(rama(solucion.G_abf, 1))
            rotulo: G₀′
            bloque: Abatimiento de α
            porque: |
              G₀′, donde el arco corta la perpendicular de G₂.
          - con: compas
            traza: 'arco(proy_alzado(solucion.J), por: proy_alzado(rama(solucion.J_abf, 1)), desde: uno(medir_sobre(perpendicular(por: proy_alzado(rama(solucion.J_abf, 1)), a: solucion.perpJ2), desde: proy_alzado(rama(solucion.J_abf, 1)), distancia: 6), 1), hasta: uno(medir_sobre(perpendicular(por: proy_alzado(rama(solucion.J_abf, 1)), a: solucion.perpJ2), desde: proy_alzado(rama(solucion.J_abf, 1)), distancia: 6), 2))'
            toma: segmento2(solucion.Jp, solucion.fJ)
            bloque: Abatimiento de α
            porque: |
              Lo que J₁ dista de K₁L₁, por su vertical, desde J₂.
          - con: marca
            traza: proy_alzado(rama(solucion.J_abf, 1))
            rotulo: J₀′
            bloque: Abatimiento de α
            porque: |
              J₀′, donde el arco corta la perpendicular de J₂.
          - con: regla
            traza: '[segmento2(proy_alzado(rama(solucion.I_abf, 1)), proy_alzado(rama(solucion.H_ab, 1))), segmento2(proy_alzado(rama(solucion.H_ab, 1)), proy_alzado(rama(solucion.G_abf, 1))), segmento2(proy_alzado(rama(solucion.G_abf, 1)), proy_alzado(rama(solucion.J_abf, 1)))]'
            bloque: Abatimiento de α
            porque: |
              I₀′H₀′G₀′J₀′, la pieza de α en verdadera magnitud: IH, en la pared de la izquierda; HG y GJ, en la de
              delante.
          - con: regla
            traza: segmento2(figura.punto("N1"), solucion.L_BN1)
            bloque: Abatimiento de β
            porque: |
              **β.** La charnela: el alero B₁N₁, prolongado con la regla hacia la izquierda, largo, más allá de
              A₁K₁.
          - con: marca
            traza: solucion.Q1
            rotulo: Q₁
            bloque: Abatimiento de β
            porque: |
              Q₁, donde la charnela corta A₁K₁, el borde izquierdo de la planta: A₁K₁ es la perpendicular a la
              charnela que pasa por A₁, y Q es el pie de A en la charnela. Nombre nuestro.
          - con: regla
            traza: segmento2(figura.punto("K1"), solucion.A0mas)
            bloque: Abatimiento de β
            porque: |
              A₁K₁, prolongada hacia abajo con la regla, larga: por ella se abate A.
          - con: compas
            traza: 'arco(figura.punto("A1"), por: solucion.T1, desde: desplaza(solucion.T1, dy: -6), hasta: desplaza(solucion.T1, dy: 6))'
            toma: segmento2(figura.punto("M2"), figura.punto("N2"))
            bloque: Abatimiento de β
            porque: |
              Con el compás, en el alzado, **M₂N₂**: lo que el borde de atrás de β, el de A, está más alto que el
              alero, el de B. Desde A₁, sobre A₁M₁, que es paralela a la charnela: el triángulo del radio de A,
              rectángulo en A₁.
          - con: marca
            traza: solucion.T1
            rotulo: T₁
            bloque: Abatimiento de β
            porque: |
              T₁, donde el arco corta A₁M₁. Q₁T₁ es la hipotenusa: la distancia real de A a la charnela. Nombre
              nuestro.
          - con: compas
            traza: 'arco(solucion.Q1, por: solucion.A0, desde: desplaza(solucion.A0, dx: -6), hasta: desplaza(solucion.A0, dx: 6))'
            toma: segmento2(solucion.Q1, solucion.T1)
            bloque: Abatimiento de β
            porque: |
              Con centro en Q₁ y radio Q₁T₁, el arco sobre A₁K₁ prolongada, por debajo de la charnela: A cae al
              plano horizontal del alero girando alrededor de él.
          - con: marca
            traza: solucion.A0
            rotulo: A₀
            bloque: Abatimiento de β
            porque: |
              A₀, donde el arco corta A₁K₁ prolongada: A abatido. Hacia arriba también valdría, con todo β al
              mismo lado.
          - con: regla
            traza: segmento2(solucion.A0, figura.punto("B1"))
            bloque: Abatimiento de β
            porque: |
              A₀B₁, la limahoya abatida: B está en la charnela y no se mueve.
          - con: marca
            traza: proy_planta(rama(solucion.I_ab, 1))
            rotulo: I₀
            bloque: Abatimiento de β
            porque: |
              I₀, donde la vertical de I₁ corta A₀B₁: I es de la limahoya.
          - con: marca
            traza: proy_planta(rama(solucion.J_ab, 1))
            bloque: Abatimiento de β
            porque: |
              J₀, donde la vertical de J₁ corta A₀B₁, justo debajo de la charnela. Va sin rótulo, que pisaría la
              charnela y el lado del hexágono de la cubierta.
          - con: escuadra-cartabon
            traza: '[segmento2(figura.punto("E1"), solucion.L_uno1), segmento2(figura.punto("D1"), solucion.L_dos1), segmento2(figura.punto("F1"), solucion.L_tres1)]'
            bloque: Abatimiento de β
            porque: |
              Las horizontales de β de los pies, como en el paso anterior: por E₁ (que pasa por C₁), por D₁ y por
              F₁, hasta pasar A₁B₁.
          - con: marca
            traza: solucion.uno1
            bloque: Abatimiento de β
            porque: |
              1₁, donde la horizontal de C₁ y E₁ corta A₁B₁. Va sin rótulo, que C₁ taparía.
          - con: marca
            traza: solucion.dos1
            rotulo: 2₁
            bloque: Abatimiento de β
            porque: |
              2₁, donde la horizontal de D₁ corta A₁B₁.
          - con: marca
            traza: solucion.tres1
            bloque: Abatimiento de β
            porque: |
              3₁, donde la horizontal de F₁ corta A₁B₁, a trazos. Va sin rótulo: la arista de la cubierta que baja
              por G₁, a 1 mm, lo taparía.
          - con: escuadra-cartabon
            traza: '[segmento2(solucion.uno1, solucion.uno0), segmento2(solucion.dos1, solucion.dos0), segmento2(solucion.tres1, solucion.tres0)]'
            bloque: Abatimiento de β
            porque: |
              Por 1₁, 2₁ y 3₁, las perpendiculares a la charnela, las verticales del papel, hasta A₀B₁: son puntos
              de la limahoya, y abatidos caen en ella.
          - con: marca
            traza: solucion.uno0
            bloque: Abatimiento de β
            porque: |
              1₀, donde la vertical de 1₁ corta A₀B₁. Va sin rótulo, que C₀ taparía.
          - con: marca
            traza: solucion.dos0
            rotulo: 2₀
            bloque: Abatimiento de β
            porque: |
              2₀, donde la vertical de 2₁ corta A₀B₁.
          - con: marca
            traza: solucion.tres0
            rotulo: 3₀
            bloque: Abatimiento de β
            porque: |
              3₀, donde la vertical de 3₁ corta A₀B₁.
          - con: escuadra-cartabon
            traza: '[segmento2(solucion.uno0, solucion.L_uno0), segmento2(solucion.dos0, solucion.L_dos0), segmento2(solucion.tres0, solucion.L_tres0)]'
            guia: segmento2(figura.punto("N1"), solucion.L_BN1)
            bloque: Abatimiento de β
            porque: |
              Por 1₀, 2₀ y 3₀, las paralelas a la charnela, hacia la derecha: una horizontal de β, abatida, sigue
              paralela a la charnela. La de 1₀ hasta pasar la vertical de E₁, la de 2₀ hasta pasar la de D₁ y la de
              3₀ hasta pasar la de F₁.
          - con: marca
            traza: proy_planta(rama(solucion.C_ab, 1))
            rotulo: C₀
            bloque: Abatimiento de β
            porque: |
              C₀, donde la paralela de 1₀ corta la vertical de C₁.
          - con: marca
            traza: proy_planta(rama(solucion.E_ab, 1))
            rotulo: E₀
            bloque: Abatimiento de β
            porque: |
              E₀, donde la paralela de 1₀ corta la vertical de E₁.
          - con: marca
            traza: proy_planta(rama(solucion.D_ab, 1))
            rotulo: D₀
            bloque: Abatimiento de β
            porque: |
              D₀, donde la paralela de 2₀ corta la vertical de D₁.
          - con: marca
            traza: proy_planta(rama(solucion.F_ab, 1))
            rotulo: F₀
            bloque: Abatimiento de β
            porque: |
              F₀, donde la paralela de 3₀ corta la vertical de F₁.
          - con: regla
            traza: '[segmento2(proy_planta(rama(solucion.J_ab, 1)), proy_planta(rama(solucion.F_ab, 1))), segmento2(proy_planta(rama(solucion.F_ab, 1)), proy_planta(rama(solucion.E_ab, 1))), segmento2(proy_planta(rama(solucion.E_ab, 1)), proy_planta(rama(solucion.D_ab, 1))), segmento2(proy_planta(rama(solucion.D_ab, 1)), proy_planta(rama(solucion.C_ab, 1))), segmento2(proy_planta(rama(solucion.C_ab, 1)), proy_planta(rama(solucion.I_ab, 1)))]'
            bloque: Abatimiento de β
            porque: |
              J₀F₀E₀D₀C₀I₀, la pieza de β en verdadera magnitud. Con la de α, es la intersección entera: las dos
              piezas se unen en I y en J.
        pista: |
          (1) α: sube H₁, G₁ y J₁ a A₂B₂; por H₂, G₂ y J₂, la perpendicular a A₂B₂, y en ella lo que cada planta
          dista de K₁L₁ (la de I, desde H₂ también). (2) β: la charnela es el alero B₁N₁ prolongado; Q₁, el pie de
          A. M₂N₂ llevado desde A₁ por A₁M₁ da T₁, y con radio Q₁T₁, A₀ en A₁K₁ prolongada. (3) A₀B₁ da I₀ y J₀; las
          horizontales de β de los pies cortan A₁B₁ en 1₁, 2₁ y 3₁, que bajan a A₀B₁, y sus paralelas al alero
          cortan las verticales de los pies.
        desarrollo: |
          En verde claro, las dos piezas en verdadera magnitud: I₀′H₀′G₀′J₀′, abatida con α, en el hueco de debajo
          de A₂B₂, y J₀F₀E₀D₀C₀I₀, abatida con β, delante de la planta, con la limahoya abatida, A₀B₁. E₀F₀ mide
          27,0 mm: la longitud real de EF.

      - tipo: calcular
        titulo: La longitud real del tramo EF
        pregunta: Como pregunta nuestra, ¿cuánto mide de verdad EF, el tramo de la intersección en la pared derecha de la torre?
        respuesta:
          tipo: numero
          valor: '27.02'
          receta: ef_mm
          tolerancia: 1
          formato: un número, en mm
        distractores:
          - valor: '21.21'
            receta: en_mm(vm_planta(solucion.E, solucion.F))
            mensaje: |
              Eso es **E₁F₁, en la planta**. EF baja de E a F, porque β baja hacia delante, y la planta lo acorta.
              En verdadera magnitud es E₀F₀, en el abatimiento de β.
          - valor: '16.74'
            receta: en_mm(vm_alzado(solucion.E, solucion.F))
            mensaje: |
              Eso es **E₂F₂, en el alzado**, que es solo lo que baja: EF es de perfil, y el alzado también lo
              acorta.
        pista: |
          Mide E₀F₀ con «medir» del Taller, en el paso anterior, o en tu lámina de papel.
        desarrollo: |
          EF es de perfil: en la planta mide lo que avanza, y en el alzado, lo que baja. Su verdadera magnitud es
          la hipotenusa:

          $$ \overline{EF} = \sqrt{\overline{E_1F_1}^{\,2} + \overline{E_2F_2}^{\,2}} = \sqrt{21{,}21^{2} + 16{,}74^{2}} \approx 27{,}02 \text{ mm} $$

          Es también lo que mide E₀F₀ en el abatimiento de β, y lo mismo el trozo de la vertical de D₁ entre las
          paralelas de 1₀ y de 3₀, que son las de E₀ y F₀. Otros trozos de rectas del dibujo miden por casualidad
          casi lo mismo, y no son EF: de 1₂ a 3₂, sobre A₂B₂, 27,46 mm; de I₀ a 3₀, sobre la limahoya abatida, 27,66;
          y algunos de las verticales de la construcción, entre 26,2 y 28,0.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza no debe entrar.
        piezas:
          - texto: G y H caen en α, que es de canto, y sus pies se suben en vertical hasta A₂B₂, el alzado de α.
          - texto: C, D, E y F caen en β, y su cota sale de la horizontal de β que pasa por cada uno, cortada con la limahoya.
          - texto: I y J, donde la limahoya cruza el hexágono, son de los dos faldones; ahí la intersección pasa de α a β.
          - texto: En el alzado, las paredes de atrás y el borde de atrás de β quedan detrás de la torre, y van a trazos.
          - texto: Cada pieza de la intersección se ve en verdadera magnitud abatiendo su faldón, α sobre el plano frontal de KL y β sobre el horizontal de su alero.
          - texto: Todos los pies se suben en vertical hasta A₂B₂, porque la torre es vertical.
            trampa: true
            mensaje: |
              La torre es vertical, y cada pie está en la vertical de su vértice; pero A₂B₂ es solo el alzado de α.
              Los pies de C, D, E y F caen en β, que no es de canto: el de D, por ejemplo, queda 26 mm por encima
              del punto de A₂B₂ de su vertical.
    resolucion: |
      **Qué hay.** Dos faldones que se cortan en la limahoya AB: α, de canto, que en el alzado se ve como A₂B₂, y
      β, que contiene rectas paralelas a la línea de tierra y baja hacia delante. La torre es un prisma
      hexagonal vertical, con aristas C a H (nombres nuestros); en la planta, sus paredes son el hexágono de
      trazos, que la cubierta tapa desde arriba.

      **El alzado y la intersección.** G y H caen en α: sus verticales cortan A₂B₂ en G₂ y H₂. C, D, E y F caen
      en β: la horizontal de β de cada uno corta A₁B₁ en 1₁, 2₁ o 3₁, que suben a A₂B₂, y sus horizontales dan
      C₂, E₂, D₂ y F₂. La limahoya cruza el hexágono en I y J, que son de los dos faldones; I₂ cae en H₂. La
      intersección es la línea cerrada IHGJFEDC. En el alzado, con las piezas opacas, las aristas de delante,
      H, G y F, se ven hasta sus pies; E₂D₂C₂ y el borde de atrás de β entre H y F van a trazos, detrás de la
      torre.

      **En verdadera magnitud.** La intersección no es plana: una pieza en cada faldón. α se abate sobre el
      plano frontal de su borde de delante, KL, cuyo alzado es A₂B₂: cada punto se aparta de A₂B₂ lo que su
      planta dista de K₁L₁. β se abate sobre el plano horizontal de su alero BN: A, con el triángulo de M₂N₂ y
      su distancia al alero, cae en A₀; la limahoya abatida A₀B₁ da I₀ y J₀, y las horizontales de β, C₀, D₀, E₀
      y F₀. EF, en la pared derecha, mide 21,21 mm en la planta y 16,74 en el alzado, y 27,02 en verdadera
      magnitud.

  - id: sd44-el-canal-a-traves-del-terraplen
    titulo: El canal de riego a través del terraplén
    fuente: Ejercicio 32 (SD44) · Colección de ejercicios de Geometría Descriptiva, Sistema Diédrico Directo · Dpto. de Expresión Gráfica y Proyectos de Ingeniería, EIG · UPV/EHU
    nivel: practica
    # Decisión: el texto impreso tal cual, cotejado con la página (pág. 33).
    # La hoja no rotula nada: todos los nombres son nuestros. El canal es
    # hueco y abierto por arriba (la planta dibuja en continua su fondo); las
    # piezas se toman opacas, como lectura nuestra.
    enunciado: |
      En la perspectiva se puede apreciar un terraplén de relleno (un prisma cuya sección recta es un trapecio
      isósceles) que es intersecado por un canal de riego (un prisma hueco cuya sección recta también es un
      trapecio isósceles).

      Se pide determinar la intersección entre el terraplén y el canal, indicando partes vistas y ocultas.
      También determinar gráficamente la pendiente respecto del suelo horizontal de las caras laterales
      (taludes) del terraplén.

      **Notas nuestras.** La figura es el terraplén y el canal en el alzado, arriba, y en la planta, debajo, sin
      línea de tierra; la perspectiva de la hoja no está en la lámina. La hoja no da escala: las longitudes van
      en milímetros de la lámina. El terraplén apoya en el suelo, y su coronación está a la misma altura que el
      borde de arriba del canal, que es una artesa abierta por arriba, más ancha arriba que en el fondo: la
      planta dibuja en continua las aristas de su fondo, que desde arriba se ven por dentro. Fuera del
      terraplén, el canal va en el aire, con el fondo por encima del suelo. Todos los nombres son nuestros:
      A, B, C y D, los vértices del extremo izquierdo del terraplén (A y D en la base, B y C en la coronación,
      de atrás adelante), y E, F, G y H, los del derecho; K, L, M y N, los del extremo izquierdo del canal (K y N
      arriba, L y M en el fondo, de delante atrás), y P, Q, R y S, los del derecho. Los taludes son ABFE, el de
      atrás, y CDHG, el de delante. 1 a 8 son los puntos de la intersección, y T y U, dos de la construcción.
      La hoja dibuja las aristas a trozos, interrumpidas donde se cruzan las piezas: completarlas es parte del
      ejercicio. El enunciado pide lo visto y lo oculto, así que las piezas son opacas; leemos el canal como
      una artesa de paredes delgadas, sin tapa, que es lo que dicen la planta y la perspectiva de la hoja: si
      estuviera cerrado por arriba, como un tubo, en la planta la tapa dejaría a trazos las aristas del fondo y
      las dos líneas de la intersección, y cada una se cerraría por arriba con el trozo de la coronación que
      ahora se lleva el canal, de 1 a 4 y de 5 a 8; el alzado no cambiaría.
    pide: Los ocho puntos de la intersección del canal con los taludes, en las dos vistas, con lo visto y lo oculto; y la pendiente de los taludes respecto del suelo, en grados.
    receta:
      lamina: sd44
      escena:
        A: 'punto3(alzado: figura.punto("A2"), planta: figura.punto("A1"))'
        B: 'punto3(alzado: figura.punto("B2"), planta: figura.punto("B1"))'
        C: 'punto3(alzado: figura.punto("C2"), planta: figura.punto("C1"))'
        D: 'punto3(alzado: figura.punto("D2"), planta: figura.punto("D1"))'
        E: 'punto3(alzado: figura.punto("E2"), planta: figura.punto("E1"))'
        F: 'punto3(alzado: figura.punto("F2"), planta: figura.punto("F1"))'
        G: 'punto3(alzado: figura.punto("G2"), planta: figura.punto("G1"))'
        H: 'punto3(alzado: figura.punto("H2"), planta: figura.punto("H1"))'
        K: 'punto3(alzado: figura.punto("K2"), planta: figura.punto("K1"))'
        L: 'punto3(alzado: figura.punto("L2"), planta: figura.punto("L1"))'
        M: 'punto3(alzado: figura.punto("M2"), planta: figura.punto("M1"))'
        N: 'punto3(alzado: figura.punto("N2"), planta: figura.punto("N1"))'
        P: 'punto3(alzado: figura.punto("P2"), planta: figura.punto("P1"))'
        Q: 'punto3(alzado: figura.punto("Q2"), planta: figura.punto("Q1"))'
        R: 'punto3(alzado: figura.punto("R2"), planta: figura.punto("R1"))'
        S: 'punto3(alzado: figura.punto("S2"), planta: figura.punto("S1"))'
        atras: plano(A, E, B)
        delante: plano(D, H, C)
        fondo: plano(L, Q, M)
      solucion:
        # La intersección: las cuatro aristas del canal atraviesan los dos
        # taludes. Las de arriba, KP y NS, a la altura de la coronación, sobre
        # BF y CG; las del fondo, LQ y MR, a su altura, por dentro de cada talud.
        i1: corte_recta_plano(recta3(K, P), atras)
        i2: corte_recta_plano(recta3(L, Q), atras)
        i3: corte_recta_plano(recta3(M, R), atras)
        i4: corte_recta_plano(recta3(N, S), atras)
        i5: corte_recta_plano(recta3(K, P), delante)
        i6: corte_recta_plano(recta3(L, Q), delante)
        i7: corte_recta_plano(recta3(M, R), delante)
        i8: corte_recta_plano(recta3(N, S), delante)
        # Decisión: 2, 3, 6 y 7, con la horizontal de cada talud a la altura del
        # fondo del canal. El extremo izquierdo del terraplén da su sección:
        # en el alzado, la recta del fondo, L₂M₂ prolongada, corta A₂B₂ en T₂ y
        # D₂C₂ en U₂; bajados a A₁D₁, las paralelas a las aristas del terraplén
        # por T₁ y U₁ son esas horizontales.
        T: corte_recta_plano(recta3(A, B), fondo)
        U: corte_recta_plano(recta3(D, C), fondo)
        # Los puntos de la planta y del alzado de la construcción.
        T1p: proy_planta(T)
        U1p: proy_planta(U)
        T2p: proy_alzado(T)
        U2p: proy_alzado(U)
        parT: 'perpendicular(por: T1p, a: perpendicular(por: T1p, a: figura.segmento("DH1a")))'
        parU: 'perpendicular(por: U1p, a: perpendicular(por: U1p, a: figura.segmento("DH1a")))'
        # La visibilidad: AE y DH pasan por debajo del canal entre KP y NS; en
        # el alzado, LQ se esconde detrás del extremo del terraplén en T₂, y GH
        # detrás del canal hasta la recta del fondo.
        x_AE_KP: 'cruce_aparente(figura.segmento("AE1a"), figura.segmento("KP1a"))'
        x_AE_NS: 'cruce_aparente(figura.segmento("AE1a"), figura.segmento("NS1a"))'
        x_DH_KP: 'cruce_aparente(figura.segmento("DH1a"), figura.segmento("KP1a"))'
        x_DH_NS: 'cruce_aparente(figura.segmento("DH1a"), figura.segmento("NS1a"))'
        x_GH_LQ: 'cruce_aparente(figura.segmento("GH2"), figura.segmento("LM2"))'
        # Para los diagnósticos: los cruces de las aristas del canal con las de
        # los taludes que no son.
        x_LQ_AE: 'cruce_aparente(figura.segmento("LQ1a"), figura.segmento("AE1a"))'
        x_LQ_BF: 'cruce_aparente(figura.segmento("LQ1a"), figura.segmento("BF1a"))'
        x_MR_AE: 'cruce_aparente(figura.segmento("MR1a"), figura.segmento("AE1a"))'
        x_MR_BF: 'cruce_aparente(figura.segmento("MR1a"), figura.segmento("BF1a"))'
        x_LQ_DH: 'cruce_aparente(figura.segmento("LQ1a"), figura.segmento("DH1a"))'
        x_LQ_CG: 'cruce_aparente(figura.segmento("LQ1a"), figura.segmento("CG1a"))'
        x_MR_DH: 'cruce_aparente(figura.segmento("MR1a"), figura.segmento("DH1a"))'
        x_MR_CG: 'cruce_aparente(figura.segmento("MR1a"), figura.segmento("CG1a"))'
        # Y en el alzado, cada punto a la altura que no es (arriba en vez de en
        # el fondo, o al revés).
        a1mal: 'cruce_aparente(figura.segmento("LM2"), segmento2(proy_alzado(i1), desplaza(proy_alzado(i1), dy: 10)))'
        a2mal: 'cruce_aparente(figura.segmento("CG2"), segmento2(proy_alzado(i2), desplaza(proy_alzado(i2), dy: 10)))'
        a3mal: 'cruce_aparente(figura.segmento("CG2"), segmento2(proy_alzado(i3), desplaza(proy_alzado(i3), dy: 10)))'
        a4mal: 'cruce_aparente(figura.segmento("LM2"), segmento2(proy_alzado(i4), desplaza(proy_alzado(i4), dy: 10)))'
        a5mal: 'cruce_aparente(figura.segmento("LM2"), segmento2(proy_alzado(i5), desplaza(proy_alzado(i5), dy: 10)))'
        a6mal: 'cruce_aparente(figura.segmento("CG2"), segmento2(proy_alzado(i6), desplaza(proy_alzado(i6), dy: 10)))'
        a7mal: 'cruce_aparente(figura.segmento("CG2"), segmento2(proy_alzado(i7), desplaza(proy_alzado(i7), dy: 10)))'
        a8mal: 'cruce_aparente(figura.segmento("LM2"), segmento2(proy_alzado(i8), desplaza(proy_alzado(i8), dy: 10)))'
        # Los extremos de las rectas largas.
        L_T1: 'desplaza(T1p, dy: mm(3))'
        L_U1: 'desplaza(U1p, dy: mm(3))'
        L_3: 'uno(medir_sobre(parT, desde: proy_planta(i3), distancia: mm(3)), 2)'
        L_7: 'uno(medir_sobre(parU, desde: proy_planta(i7), distancia: mm(3)), 2)'
        L_a1: 'desplaza(proy_alzado(i1), dy: mm(-3))'
        L_a2: 'desplaza(proy_alzado(i2), dy: mm(-3))'
        L_a3: 'desplaza(proy_alzado(i3), dy: mm(-3))'
        L_a4: 'desplaza(proy_alzado(i4), dy: mm(-3))'
        L_a5: 'desplaza(proy_alzado(i5), dy: mm(-3))'
        L_a6: 'desplaza(proy_alzado(i6), dy: mm(-3))'
        L_a7: 'desplaza(proy_alzado(i7), dy: mm(-3))'
        L_a8: 'desplaza(proy_alzado(i8), dy: mm(-3))'
        # La pendiente de los taludes: el ángulo de cada uno con el plano
        # horizontal. AB, en el extremo, es su recta de máxima pendiente, porque
        # el extremo es la sección recta del terraplén. Los errores: el ángulo
        # que se ve en el alzado de A₂B₂ (Bv tiene el alzado de B y el
        # alejamiento de A) y el que forma el talud con la vertical.
        pendiente_atras: angulo_con_ph(atras)
        pendiente_delante: angulo_con_ph(delante)
        Bv: 'punto3(alzado: figura.punto("B2"), planta: cruce_aparente(segmento2(figura.punto("B1"), desplaza(figura.punto("B1"), dy: 10)), segmento2(figura.punto("A1"), desplaza(figura.punto("A1"), dx: 10))))'
        aparente: angulo_con_ph(segmento3(A, Bv))
        complemento: 90 - pendiente_atras
      comprueba:
        - en_plano(F, atras)
        - en_plano(G, delante)
        - en_plano(P, plano(K, L, Q))
        - en_plano(S, plano(N, M, R))
    pasos:
      - tipo: reconocer
        pregunta: ¿Dónde atraviesa el talud de atrás la arista del fondo del canal, LQ?
        opciones:
          - texto: Donde LQ cruza la horizontal del talud a la cota del fondo
            correcta: true
            mensaje: |
              Eso es. LQ es horizontal, a la cota del fondo del canal, y el talud contiene una horizontal a esa misma
              cota, paralela a las aristas del terraplén. Las dos están en el plano horizontal del fondo, así que se
              cortan de verdad: ahí está 2. Esa horizontal sale del extremo del terraplén, que es su sección recta.
          - texto: En la arista de arriba del talud, BF, porque ahí empieza el terraplén por arriba
            mensaje: |
              BF está a la cota de la coronación, que es la del borde de arriba del canal: ahí entran KP y NS, las
              aristas de arriba. El fondo está 12,2 mm más abajo, y entra en el talud más abajo, donde el talud tiene
              su cota.
          - texto: Donde LQ cruza en la planta la base del talud, AE, porque el terraplén empieza en el suelo
            mensaje: |
              Ese cruce es aparente. El canal va en el aire, con el fondo 4,0 mm por encima del suelo: sobre AE, pasa
              por encima del pie del talud sin tocarlo, y entra en el talud más adentro, donde el talud sube hasta la
              cota del fondo.

      - tipo: construir
        titulo: La intersección del canal con los taludes, y lo que se ve
        intro: |
          El canal atraviesa el terraplén: entra por el talud de atrás, ABFE, y sale por el de delante, CDHG. Cada
          una de sus cuatro aristas atraviesa los dos taludes: KP en 1 y 5, LQ en 2 y 6, MR en 3 y 7, y NS en 4 y 8,
          nombres nuestros. KP y NS, las de arriba, están a la cota de la coronación, y cortan los taludes en BF y
          en CG: en la planta, 1₁, 4₁, 5₁ y 8₁ son cruces de esas aristas, que hay que prolongar. LQ y MR, las del
          fondo, cortan cada talud en su horizontal a la cota del fondo. Esa horizontal sale del extremo
          izquierdo del terraplén, que es su sección recta: en el alzado, la recta del fondo, L₂M₂ prolongada,
          corta A₂B₂ en T₂ y D₂C₂ en U₂; bajados a A₁D₁, las paralelas a las aristas del terraplén por T₁ y por U₁ son
          las dos horizontales. T y U también son nombres nuestros. Marca los ocho puntos en la planta, y luego en
          el alzado: los de arriba, en la coronación; los del fondo, en L₂M₂ prolongada.

          Después, pasa a limpio con «arista vista» y «arista oculta» lo que falta: las aristas que la hoja deja a
          trozos y la intersección, en las dos vistas. También G₂H₂, que la hoja da entera en continua: el canal le
          pasa por delante, y va a trazos de G₂ a la recta del fondo. El canal es hueco y abierto por arriba: desde
          arriba se ve por dentro. Varios puntos caen a menos de 5 mm de otros cruces: 1₁ a 2 mm, 7₂ a 2,4 de donde E₂F₂, a trazos,
          cruza la recta del fondo, y 2₂, 3₂ y 6₂ a unos 4: amplía con la lupa (×4) antes de marcarlos.
        herramientas: [punto, recta, paralela, perpendicular, vertical, horizontal, compas, radio, medir, transportador, visto, oculto, borrar]
        tolerancia: 1
        objetivos:
          - nombre: p1
            rotulo: 1₁
            pide: 1, donde la arista de arriba de delante del canal, KP, atraviesa el talud de atrás, en la planta
            es: proy_planta(solucion.i1)
            bien: |
              1₁ está donde K₁P₁ cruza B₁F₁: KP está a la cota de la coronación, y entra en el talud de atrás por su
              borde de arriba.
            diagnosticos:
              - si: cerca_de(solucion.x_AE_KP)
                mensaje: |
                  Ese es el cruce de K₁P₁ con A₁E₁, la base del talud: un cruce aparente. KP va a la cota de la
                  coronación, 16,3 mm por encima del suelo, y entra en el talud por arriba, en B₁F₁.
                ejemplo: solucion.x_AE_KP
              - si: '!en_recta(figura.segmento("KP1a"))'
                mensaje: |
                  1 es un punto de la arista KP: 1₁ va **en K₁P₁**, prolongada con la regla por el hueco que deja la
                  hoja.
                ejemplo: 'desplaza(proy_planta(solucion.i1), dx: mm(5))'
              - si: siempre
                mensaje: |
                  Estás en K₁P₁, pero no donde la corta B₁F₁, prolongada.
          - nombre: p4
            rotulo: 4₁
            pide: 4, donde la arista de arriba de atrás del canal, NS, atraviesa el talud de atrás, en la planta
            es: proy_planta(solucion.i4)
            bien: |
              4₁ está donde N₁S₁ cruza B₁F₁. Entre 1 y 4, la coronación queda cortada por el hueco del canal.
            diagnosticos:
              - si: cerca_de(solucion.x_AE_NS)
                mensaje: |
                  Ese es el cruce de N₁S₁ con A₁E₁, la base: un cruce aparente. NS está a la cota de la coronación, y
                  entra en el talud por B₁F₁.
                ejemplo: solucion.x_AE_NS
              - si: '!en_recta(figura.segmento("NS1a"))'
                mensaje: |
                  4 es un punto de la arista NS: 4₁ va **en N₁S₁**, prolongada.
                ejemplo: 'desplaza(proy_planta(solucion.i4), dx: mm(5))'
              - si: siempre
                mensaje: |
                  Estás en N₁S₁, pero no donde la corta B₁F₁.
          - nombre: p5
            rotulo: 5₁
            pide: 5, donde KP sale por el talud de delante, en la planta
            es: proy_planta(solucion.i5)
            bien: |
              5₁ está donde K₁P₁ cruza C₁G₁, la arista de arriba del talud de delante.
            diagnosticos:
              - si: cerca_de(solucion.x_DH_KP)
                mensaje: |
                  Ese es el cruce de K₁P₁ con D₁H₁, la base del talud de delante: aparente. KP sale por arriba, por C₁G₁.
                ejemplo: solucion.x_DH_KP
              - si: '!en_recta(figura.segmento("KP1a"))'
                mensaje: |
                  5 es un punto de la arista KP: 5₁ va **en K₁P₁**.
                ejemplo: 'desplaza(proy_planta(solucion.i5), dx: mm(5))'
              - si: siempre
                mensaje: |
                  Estás en K₁P₁, pero no donde la corta C₁G₁, prolongada.
          - nombre: p8
            rotulo: 8₁
            pide: 8, donde NS sale por el talud de delante, en la planta
            es: proy_planta(solucion.i8)
            bien: |
              8₁ está donde N₁S₁ cruza C₁G₁.
            diagnosticos:
              - si: cerca_de(solucion.x_DH_NS)
                mensaje: |
                  Ese es el cruce de N₁S₁ con D₁H₁, la base: aparente. NS sale por arriba, por C₁G₁.
                ejemplo: solucion.x_DH_NS
              - si: '!en_recta(figura.segmento("NS1a"))'
                mensaje: |
                  8 es un punto de la arista NS: 8₁ va **en N₁S₁**.
                ejemplo: 'desplaza(proy_planta(solucion.i8), dx: mm(-5))'
              - si: siempre
                mensaje: |
                  Estás en N₁S₁, pero no donde la corta C₁G₁.
          - nombre: p2
            rotulo: 2₁
            pide: 2, donde la arista del fondo de delante del canal, LQ, atraviesa el talud de atrás, en la planta
            es: proy_planta(solucion.i2)
            bien: |
              2₁ está donde L₁Q₁ cruza la paralela a las aristas del terraplén que pasa por T₁: la horizontal del talud
              de atrás a la cota del fondo.
            diagnosticos:
              - si: cerca_de(solucion.x_LQ_AE)
                mensaje: |
                  Ese es el cruce de L₁Q₁ con A₁E₁, la base del talud: aparente. El fondo del canal va 4,0 mm por encima
                  del suelo, y entra en el talud más adentro, en su horizontal a la cota del fondo.
                ejemplo: solucion.x_LQ_AE
              - si: cerca_de(solucion.x_LQ_BF)
                mensaje: |
                  Ese es el cruce de L₁Q₁ con B₁F₁, la coronación: aparente. Ahí entran las aristas de arriba; el fondo
                  está 12,2 mm más abajo y entra antes, en la horizontal del talud por T₁.
                ejemplo: solucion.x_LQ_BF
              - si: '!en_recta(figura.segmento("LQ1a"))'
                mensaje: |
                  2 es un punto de la arista LQ: 2₁ va **en L₁Q₁**, prolongada.
                ejemplo: 'desplaza(proy_planta(solucion.i2), dx: mm(-5))'
              - si: siempre
                mensaje: |
                  Estás en L₁Q₁, pero no en la horizontal del talud a la cota del fondo: la paralela a las aristas del
                  terraplén por T₁, el punto de A₁D₁ que baja de T₂.
          - nombre: p3
            rotulo: 3₁
            pide: 3, donde la arista del fondo de atrás del canal, MR, atraviesa el talud de atrás, en la planta
            es: proy_planta(solucion.i3)
            bien: |
              3₁ está donde M₁R₁ cruza la misma paralela por T₁.
            diagnosticos:
              - si: cerca_de(solucion.x_MR_AE)
                mensaje: |
                  Ese es el cruce de M₁R₁ con A₁E₁, la base: aparente. El fondo entra en el talud en su horizontal a la
                  cota del fondo.
                ejemplo: solucion.x_MR_AE
              - si: cerca_de(solucion.x_MR_BF)
                mensaje: |
                  Ese es el cruce de M₁R₁ con B₁F₁, la coronación: aparente. El fondo está más abajo.
                ejemplo: solucion.x_MR_BF
              - si: '!en_recta(figura.segmento("MR1a"))'
                mensaje: |
                  3 es un punto de la arista MR: 3₁ va **en M₁R₁**, prolongada.
                ejemplo: 'desplaza(proy_planta(solucion.i3), dx: mm(5))'
              - si: siempre
                mensaje: |
                  Estás en M₁R₁, pero no en la paralela a las aristas del terraplén por T₁.
          - nombre: p6
            rotulo: 6₁
            pide: 6, donde LQ sale por el talud de delante, en la planta
            es: proy_planta(solucion.i6)
            bien: |
              6₁ está donde L₁Q₁ cruza la paralela a las aristas del terraplén por U₁, la horizontal del talud de
              delante a la cota del fondo.
            diagnosticos:
              - si: cerca_de(solucion.x_LQ_DH)
                mensaje: |
                  Ese es el cruce de L₁Q₁ con D₁H₁, la base del talud de delante: aparente. El fondo sale por la
                  horizontal del talud a su cota, la paralela por U₁.
                ejemplo: solucion.x_LQ_DH
              - si: cerca_de(solucion.x_LQ_CG)
                mensaje: |
                  Ese es el cruce de L₁Q₁ con C₁G₁, la coronación: aparente. El fondo está más abajo.
                ejemplo: solucion.x_LQ_CG
              - si: '!en_recta(figura.segmento("LQ1a"))'
                mensaje: |
                  6 es un punto de la arista LQ: 6₁ va **en L₁Q₁**.
                ejemplo: 'desplaza(proy_planta(solucion.i6), dx: mm(-5))'
              - si: siempre
                mensaje: |
                  Estás en L₁Q₁, pero no en la paralela a las aristas del terraplén por U₁.
          - nombre: p7
            rotulo: 7₁
            pide: 7, donde MR sale por el talud de delante, en la planta
            es: proy_planta(solucion.i7)
            bien: |
              7₁ está donde M₁R₁ cruza la paralela por U₁.
            diagnosticos:
              - si: cerca_de(solucion.x_MR_DH)
                mensaje: |
                  Ese es el cruce de M₁R₁ con D₁H₁, la base: aparente.
                ejemplo: solucion.x_MR_DH
              - si: cerca_de(solucion.x_MR_CG)
                mensaje: |
                  Ese es el cruce de M₁R₁ con C₁G₁, la coronación: aparente. El fondo está más abajo.
                ejemplo: solucion.x_MR_CG
              - si: '!en_recta(figura.segmento("MR1a"))'
                mensaje: |
                  7 es un punto de la arista MR: 7₁ va **en M₁R₁**.
                ejemplo: 'desplaza(proy_planta(solucion.i7), dx: mm(5))'
              - si: siempre
                mensaje: |
                  Estás en M₁R₁, pero no en la paralela a las aristas del terraplén por U₁.
          - nombre: a1
            rotulo: 1₂
            pide: 1, en el alzado
            es: proy_alzado(solucion.i1)
            bien: |
              1₂ está en la coronación, en la vertical de 1₁.
            diagnosticos:
              - si: cerca_de(solucion.a1mal)
                mensaje: |
                  Has bajado 1 a la recta del fondo. 1 está en KP, una arista de arriba del canal: su alzado va en la
                  coronación, la recta de arriba.
                ejemplo: solucion.a1mal
              - si: '!en_vertical_de(p1)'
                mensaje: |
                  1₂ va en la **vertical de 1₁**.
                ejemplo: 'desplaza(proy_alzado(solucion.i1), dx: mm(5))'
              - si: siempre
                mensaje: |
                  1₂ está donde la vertical de 1₁ corta la coronación.
          - nombre: a4
            rotulo: 4₂
            pide: 4, en el alzado
            es: proy_alzado(solucion.i4)
            bien: |
              4₂ está en la coronación, en la vertical de 4₁.
            diagnosticos:
              - si: cerca_de(solucion.a4mal)
                mensaje: |
                  Has bajado 4 a la recta del fondo. 4 está en NS, arriba: su alzado va en la coronación.
                ejemplo: solucion.a4mal
              - si: '!en_vertical_de(p4)'
                mensaje: |
                  4₂ va en la **vertical de 4₁**.
                ejemplo: 'desplaza(proy_alzado(solucion.i4), dx: mm(5))'
              - si: siempre
                mensaje: |
                  4₂ está donde la vertical de 4₁ corta la coronación.
          - nombre: a5
            rotulo: 5₂
            pide: 5, en el alzado
            es: proy_alzado(solucion.i5)
            bien: |
              5₂ está en la coronación, en la vertical de 5₁.
            diagnosticos:
              - si: cerca_de(solucion.a5mal)
                mensaje: |
                  Has bajado 5 a la recta del fondo. 5 está en KP, arriba: su alzado va en la coronación.
                ejemplo: solucion.a5mal
              - si: '!en_vertical_de(p5)'
                mensaje: |
                  5₂ va en la **vertical de 5₁**.
                ejemplo: 'desplaza(proy_alzado(solucion.i5), dx: mm(5))'
              - si: siempre
                mensaje: |
                  5₂ está donde la vertical de 5₁ corta la coronación.
          - nombre: a8
            rotulo: 8₂
