        # Decisión: las piezas, opacas, y el canal, una artesa abierta por arriba
        # de paredes delgadas (lo dicen las Notas). La visibilidad sale de un
        # cálculo de líneas ocultas aparte, por rayos contra las paredes y el
        # fondo del canal y las caras del terraplén con el hueco. En la planta,
        # el canal se ve por dentro y tapa el pie de los taludes por donde pasa
        # por encima. En el alzado, la pared de delante del canal tapa lo que el
        # canal tiene detrás, y el terraplén, lo que el canal lleva detrás de él o
        # dentro. 2₂3₂ y 6₂7₂ caen sobre la recta del fondo, y no son tramos aparte;
        # KP, NS, BF y CG, entre B₂ y G₂, sobre la coronación, que se ve entera.
        tramos:
          - traza: segmento2(figura.punto("Kx1"), figura.punto("Px1"))
            tipo: visto
            porque: 'KP, una arista de arriba del canal, va a la cota de la coronación: desde arriba nada la tapa, ni fuera ni dentro del terraplén.'
          - traza: segmento2(figura.punto("Nx1"), figura.punto("Sx1"))
            tipo: visto
            porque: 'NS, la otra arista de arriba, también va a la cota de la coronación: desde arriba nada la tapa.'
          - traza: segmento2(figura.punto("Lx1"), figura.punto("Qx1"))
            tipo: visto
            porque: 'LQ es una arista del fondo, pero el canal es hueco y abierto por arriba, y sus paredes se abren hacia arriba: desde arriba se ve por dentro, también donde va metido en el terraplén.'
          - traza: segmento2(figura.punto("Mx1"), figura.punto("Rx1"))
            tipo: visto
            porque: 'MR, la otra arista del fondo, se ve como LQ: el canal es hueco y abierto, y desde arriba nada la tapa.'
          - traza: segmento2(figura.punto("Ax1"), solucion.x_AE_KP)
            tipo: visto
            porque: 'Hasta el cruce con K₁P₁, la base del talud de atrás queda fuera del canal: desde arriba nada la tapa.'
          - traza: segmento2(solucion.x_AE_KP, solucion.x_AE_NS)
            tipo: oculto
            porque: 'Entre K₁P₁ y N₁S₁, el canal pasa por encima de la base del talud, en el aire (su fondo va 4,0 mm por encima del suelo), y la tapa desde arriba.'
          - traza: segmento2(solucion.x_AE_NS, figura.punto("Ex1"))
            tipo: visto
            porque: 'Desde el cruce con N₁S₁, la base sale de debajo del canal: desde arriba nada la tapa.'
          - traza: segmento2(figura.punto("Dx1"), solucion.x_DH_KP)
            tipo: visto
            porque: 'Hasta el cruce con K₁P₁, la base del talud de delante queda fuera del canal: nada la tapa.'
          - traza: segmento2(solucion.x_DH_KP, solucion.x_DH_NS)
            tipo: oculto
            porque: 'Entre K₁P₁ y N₁S₁, el canal, que sale del terraplén en el aire, pasa por encima de la base del talud de delante y la tapa desde arriba.'
          - traza: segmento2(solucion.x_DH_NS, figura.punto("Hx1"))
            tipo: visto
            porque: 'Desde el cruce con N₁S₁, la base sale de debajo del canal: nada la tapa.'
          - traza: segmento2(figura.punto("Bx1"), proy_planta(solucion.i1))
            tipo: visto
            porque: 'La coronación sigue entera hasta 1, donde la corta el borde del canal: desde arriba nada la tapa. De 1 a 4, el hueco del canal se la lleva.'
          - traza: segmento2(proy_planta(solucion.i4), figura.punto("Fx1"))
            tipo: visto
            porque: 'Desde 4, la coronación vuelve a estar entera, fuera del canal: nada la tapa.'
          - traza: segmento2(figura.punto("Cx1"), proy_planta(solucion.i5))
            tipo: visto
            porque: 'La otra arista de la coronación sigue entera hasta 5, donde la corta el borde del canal: nada la tapa.'
          - traza: segmento2(proy_planta(solucion.i8), figura.punto("Gx1"))
            tipo: visto
            porque: 'Desde 8, la coronación vuelve a estar entera: nada la tapa.'
          - traza: segmento2(proy_planta(solucion.i1), proy_planta(solucion.i2))
            tipo: visto
            porque: 'De 1 a 2, la pared de delante del canal corta el talud de atrás. El canal es hueco y abierto, y su pared se abre hacia arriba: desde arriba se ve por dentro, y nada tapa esa línea.'
          - traza: segmento2(proy_planta(solucion.i2), proy_planta(solucion.i3))
            tipo: visto
            porque: 'De 2 a 3, el fondo del canal corta el talud de atrás: el canal, abierto por arriba, deja ver su fondo.'
          - traza: segmento2(proy_planta(solucion.i3), proy_planta(solucion.i4))
            tipo: visto
            porque: 'De 3 a 4, la pared de atrás del canal corta el talud de atrás; como se abre hacia arriba, desde arriba se ve por dentro y nada la tapa.'
          - traza: segmento2(proy_planta(solucion.i5), proy_planta(solucion.i6))
            tipo: visto
            porque: 'De 5 a 6, la pared de delante del canal corta el talud de delante: desde arriba, dentro del canal abierto, nada la tapa.'
          - traza: segmento2(proy_planta(solucion.i6), proy_planta(solucion.i7))
            tipo: visto
            porque: 'De 6 a 7, el fondo del canal corta el talud de delante: se ve por la boca del canal.'
          - traza: segmento2(proy_planta(solucion.i7), proy_planta(solucion.i8))
            tipo: visto
            porque: 'De 7 a 8, la pared de atrás corta el talud de delante: desde arriba se ve por dentro del canal.'
          - traza: segmento2(figura.punto("Kx2"), figura.punto("B2"))
            tipo: visto
            porque: 'La recta de arriba del canal, KP con NS detrás, va fuera del alzado del terraplén hasta B₂: nada le pasa por delante.'
          - traza: segmento2(figura.punto("G2"), figura.punto("Px2"))
            tipo: visto
            porque: 'Desde G₂, la recta de arriba del canal sale del alzado del terraplén, y el canal va por delante de él: nada la tapa.'
          - traza: segmento2(figura.punto("Lx2"), solucion.T2p)
            tipo: visto
            porque: 'Hasta T₂, LQ, la arista del fondo de delante, va fuera del alzado del terraplén: nada la tapa.'
          - traza: segmento2(solucion.T2p, proy_alzado(solucion.i6))
            tipo: oculto
            porque: 'En T₂, LQ pasa por detrás del extremo izquierdo del terraplén (en el cruce aparente con A₂B₂, T va 13,8 mm más cerca de quien mira); de 2 a 6 va metida en el terraplén. En 6 sale por el talud de delante.'
          - traza: segmento2(proy_alzado(solucion.i6), figura.punto("Qx2"))
            tipo: visto
            porque: 'Desde 6, LQ va fuera del terraplén y por delante de él: nada la tapa.'
          - traza: segmento2(proy_alzado(solucion.i1), proy_alzado(solucion.i2))
            tipo: oculto
            porque: 'De 1 a 2, la pared de delante del canal corta el talud de atrás: el terraplén, su extremo izquierdo y su talud de delante, le pasa por delante y la tapa.'
          - traza: segmento2(proy_alzado(solucion.i3), proy_alzado(solucion.i4))
            tipo: oculto
            porque: 'De 3 a 4, la pared de atrás del canal corta el talud de atrás: la tapan el terraplén y la pared de delante del canal, que va por delante.'
          - traza: segmento2(proy_alzado(solucion.i5), proy_alzado(solucion.i6))
            tipo: visto
            porque: 'De 5 a 6, la pared de delante del canal corta el talud de delante: los dos miran hacia quien mira el alzado, y nada le pasa por delante.'
          - traza: segmento2(proy_alzado(solucion.i7), proy_alzado(solucion.i8))
            tipo: oculto
            porque: 'De 7 a 8, la pared de atrás del canal corta el talud de delante: el canal es hueco, pero su pared de delante, que es opaca, le pasa por delante y la tapa.'
          - traza: segmento2(figura.punto("G2"), solucion.x_GH_LQ)
            tipo: oculto
            porque: 'De G₂ a la recta del fondo, la arista GH del extremo derecho del terraplén va detrás del canal: en el cruce aparente con L₂Q₂, LQ va 28,1 mm más cerca de quien mira.'
          - traza: segmento2(solucion.x_GH_LQ, figura.punto("H2"))
            tipo: visto
            porque: 'Por debajo de la recta del fondo, GH sale de detrás del canal, que va en el aire, por encima del suelo: nada la tapa.'
        trazado:
          - segmento2(solucion.T2p, solucion.T1p)
          - segmento2(solucion.U2p, solucion.U1p)
          - segmento2(solucion.T1p, proy_planta(solucion.i3))
