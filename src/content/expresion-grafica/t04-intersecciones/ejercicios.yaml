            porque: |
              **Las aristas de arriba.** 1₁, donde K₁P₁ cruza B₁F₁: KP está a la cota de la coronación, y entra en el
              talud de atrás por su borde de arriba. 1 a 8, T y U son nombres nuestros.
          - con: marca
            traza: proy_planta(solucion.i4)
            rotulo: 4₁
            porque: |
              4₁, donde N₁S₁ cruza B₁F₁.
          - con: marca
            traza: proy_planta(solucion.i5)
            rotulo: 5₁
            porque: |
              5₁, donde K₁P₁ cruza C₁G₁: KP sale por el borde de arriba del talud de delante.
          - con: marca
            traza: proy_planta(solucion.i8)
            rotulo: 8₁
            porque: |
              8₁, donde N₁S₁ cruza C₁G₁.
          - con: regla
            traza: segmento2(figura.punto("Lx2"), figura.punto("Qx2"))
            porque: |
              **Las aristas del fondo.** En el alzado, la recta del fondo del canal, L₂M₂, prolongada con la regla
              hasta el trozo de la derecha: cruza A₂B₂ y D₂C₂, los lados del extremo izquierdo del terraplén.
          - con: marca
            traza: solucion.T2p
            rotulo: T₂
            porque: |
              T₂, donde la recta del fondo cruza A₂B₂: el punto de AB que tiene la cota del fondo.
          - con: marca
            traza: solucion.U2p
            porque: |
              U₂, donde la recta del fondo cruza D₂C₂. Va sin rótulo: 3₂, que se marca después, lo tocaría.
          - con: escuadra-cartabon
            traza: '[segmento2(solucion.T2p, solucion.L_T1), segmento2(solucion.U2p, solucion.L_U1)]'
            porque: |
              Por T₂ y U₂, las verticales hasta pasar A₁D₁, el extremo izquierdo del terraplén en la planta: T está en
              AB y U en DC, y sus plantas caen en A₁D₁.
          - con: marca
            traza: solucion.T1p
            rotulo: T₁
            porque: |
              T₁, donde la vertical de T₂ corta A₁D₁, entre A₁ y B₁.
          - con: marca
            traza: solucion.U1p
            rotulo: U₁
            porque: |
              U₁, donde la vertical de U₂ corta A₁D₁, entre C₁ y D₁.
          - con: escuadra-cartabon
            traza: '[segmento2(solucion.T1p, solucion.L_3), segmento2(solucion.U1p, solucion.L_7)]'
            guia: figura.segmento("DH1a")
            porque: |
              Por T₁ y por U₁, las paralelas a las aristas del terraplén, largas, hasta pasar M₁R₁: son las
              horizontales de los taludes a la cota del fondo, porque el extremo es la sección recta y las aristas
