          - con: escuadra-cartabon
            traza: segmento2(solucion.s1_2, solucion.L_s1_1)
            porque: |
              Por 1₂, la vertical hacia la planta, hasta pasar V₁A₁.
          - con: marca
            traza: solucion.s1_1
            porque: |
              1₁, donde la vertical de 1₂ corta V₁A₁: un vértice de la sección horizontal de la pirámide a la
              altura de DD′, un triángulo de lados paralelos a los de la base. Va sin rótulo: J₁, que se marca
              después a 2,5 mm, lo taparía.
          - con: escuadra-cartabon
            traza: '[segmento2(solucion.s1_1, solucion.L_G), segmento2(solucion.s1_1, solucion.L_J)]'
            guia: figura.segmento("AB1")
            porque: |
              Por 1₁, las paralelas a A₁B₁ y a A₁C₁, hasta pasar D₁D′₁: son los lados de esa sección que van
              por las caras VAB y VCA, las dos que corta DD′.
          - con: marca
            traza: proy_planta(solucion.G)
            rotulo: G₁
            porque: |
              G₁, donde la paralela a A₁B₁ corta D₁D′₁: por ahí entra DD′ en la pirámide, por la cara VAB.
          - con: marca
            traza: proy_planta(solucion.J)
            rotulo: J₁
            porque: |
              J₁, donde la paralela a A₁C₁ corta D₁D′₁, 6,7 mm más atrás que G₁: por ahí sale DD′, por la cara
              de atrás, VCA.
          - con: escuadra-cartabon
            traza: '[segmento2(figura.punto("E2"), solucion.L_s2_2), segmento2(figura.punto("F2"), solucion.L_s3_2)]'
            guia: figura.segmento("base2")
            porque: |
              **EE′ y FF′.** En el alzado, las paralelas a la base por E₂ y por F₂, hacia la derecha, hasta
