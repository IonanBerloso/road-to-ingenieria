          - traza: segmento2(solucion.k_CA_D1, figura.punto("A1"))
            tipo: visto
            porque: 'Del cruce con D₁D′₁ a A₁, CA queda fuera de la planta del prisma: nada la tapa.'
        trazado:
          - segmento2(solucion.s1_1, proy_planta(solucion.G))
          - segmento2(solucion.s1_1, proy_planta(solucion.J))
          - segmento2(solucion.s2_1, proy_planta(solucion.H))
          - segmento2(solucion.s2_1, proy_planta(solucion.K))
