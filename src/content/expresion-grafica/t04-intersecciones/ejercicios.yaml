            porque: 'LJ está en la cara FD, la de abajo del prisma: desde arriba la tapan sus caras DE y EF.'
          - traza: segmento2(figura.punto("V1"), proy_planta(solucion.M))
            tipo: visto
            porque: 'De V a M, VB va por encima del prisma, hasta que lo atraviesa en M: nada la tapa.'
          - traza: segmento2(proy_planta(solucion.N), figura.punto("B1"))
