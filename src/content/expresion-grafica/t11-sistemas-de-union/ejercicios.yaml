ejercicios:
  # Orden (§04): primero los dos ejemplos nuestros de entrada; después, los tres de práctica
  # nuestros sobre la lista de piezas del polipasto, que en este tema no tienen colección delante.
  # Decisión: entre ellos, de lo más directo a lo que junta más reglas: la ranura del anillo (una
  # fila de tabla), los rodamientos (la designación y la regla de la carga) y el pasador (la
  # designación y las desviaciones ISO, que son del tema de ajustes).
  #
  # Decisión: las cifras en mm de este tema salen de tablas, no de medir sobre una lámina, así
  # que no llevan la tolerancia de 1 mm de la regla: llevan 0,01, porque los datos son exactos
  # (valores de tabla o restas exactas de ellos) y eso es lo que el enunciado deja calcular
  # (§17, «una tolerancia se elige por lo que el enunciado deja calcular»). Las cifras en µm
  # llevan 1 µm, la de los ajustes (INSTRUCCIONES-K).
  - id: tornillo-m6x40-paso-y-fondo
    titulo: Leer un tornillo de la lista, el M6 x 40 y el M4x25
    fuente: Ejemplo introductorio · Road to Ingeniería, con dos líneas de las listas de piezas de los planos «Polea directriz» y «Gancho de polipasto» de Expresión Gráfica, UPV/EHU. Los planos no preguntan esto, y no es de examen.
    nivel: ejemplo
    enunciado: |
      Dos líneas de dos listas de piezas de la asignatura. En el plano «Polea directriz», la
      marca 6 son cuatro piezas de «Tornillo hexagonal M6 x 40 DIN 931». En el plano «Gancho de
      polipasto» (Conjunto 14), la marca 3 son seis de «Tornillo avellanado M4x25 DIN 963».

      **Notas nuestras.** Los planos no piden nada de esto: lo pedimos nosotros. Qué significa
      cada cifra de las dos designaciones, cuál es el paso de la rosca del M6, a qué diámetro va
      su fondo, y cómo se dibuja y se acota su extremo roscado. Las filas que hacen falta, del
      libro de normalización del departamento, tema V: en la tabla de la rosca métrica de paso
      normal (pág. 5-10, Tabla 2.20), la columna de $d = 6$ da $P = 1$, $d_3 = 4{,}8$ y
      $h_3 = 0{,}6$, todo en mm; y en la del DIN 931 (pág. 5-29), la columna M6 da $b = 15$ mm de
      rosca para tornillos de hasta 125 mm de largo (el libro escribe «125 cm»; la tabla va en
      mm). La ISO 4014, que hoy sustituye al DIN 931, da 18 ($b = 2d + 6$), y lo mismo el DIN 931
      en su edición de 1987; eso no lo trae el material, y aquí se dibuja con los 15 del libro.
    pide: Qué es cada cifra de las dos designaciones, el paso y el diámetro del fondo del M6, y el dibujo acotado de su extremo roscado.
    pasos:
      - tipo: reconocer
        pregunta: En «Tornillo avellanado M4x25 DIN 963», ¿qué es el 25?
        opciones:
          - texto: El paso de la rosca, en mm
            mensaje: |
              Un paso de 25 en un tornillo de 4 mm de diámetro no se puede tallar: cada vuelta del
              hilo avanzaría seis veces lo que mide el tornillo de ancho. El paso solo se escribe
              en una rosca fina, y entonces es una cifra pequeña detrás del diámetro, como en
              M 6 x 0,75 (libro, pág. 5-19).
          - texto: La longitud nominal del tornillo, en mm
            correcta: true
            mensaje: |
              Eso es. En la designación de un tornillo, detrás de la rosca va la longitud: el
              libro lo desglosa en «M 20 x 2 x 60», donde 60 es la longitud y el 2 del medio es el
              paso de una rosca fina (pág. 5-26). En un tornillo de cabeza hexagonal o cilíndrica
              esa longitud no cuenta la cabeza; en uno avellanado, que queda enrasado, sí: el libro
              la mide desde la cara plana de la cabeza (DIN 87, pág. 5-30).
          - texto: La longitud de la parte roscada, en mm
            mensaje: |
              La parte roscada no se escribe en la designación: la fija la norma del tornillo. En el
              DIN 931 M6 x 40 de la polea, por ejemplo, van roscados 15 de los 40 mm según la tabla
              del libro (pág. 5-29), y 18 según las tablas de la norma (la ISO 4014 que hoy lo
              sustituye, y el DIN 931 en su edición de 1987).
          - texto: La medida de la cabeza, en mm
            mensaje: |
              La cabeza tampoco se escribe: la da la norma, DIN 963 en este caso. Una cabeza de
              25 mm en un tornillo de 4 sería seis veces más ancha que el tornillo.

      - tipo: calcular
        titulo: El paso del M6
        pregunta: |
          Paso de la rosca del «Tornillo hexagonal M6 x 40 DIN 931».
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número, en mm
        distractores:
          - valor: '40'
            mensaje: |
              Ese 40 es la **longitud** del vástago, no el paso. Detrás de la M solo va el paso si
              la rosca es fina, y entonces es una cifra pequeña: M 6 x 0,75.
          - valor: '0.75'
            mensaje: |
              Ese es el paso del ejemplo de rosca **fina** del libro, M 6 x 0,75. La designación
              de la polea dice M6 a secas, y eso es paso normal: el de la tabla, 1 mm.
          - valor: '6'
            mensaje: |
              Eso es el **diámetro nominal**, lo que dice la M6. El paso es la distancia entre dos
              vértices seguidos del hilo, y en el M6 normal es mucho menor.
        pista: |
          Si detrás de M6 no va «x» y un número pequeño, la rosca es de paso normal, y el paso
          normal de cada diámetro lo da la tabla de la rosca métrica.
        desarrollo: |
          «M6» sin nada más es rosca métrica de paso normal de 6 mm (libro, pág. 5-19). La
          Tabla 2.20 (pág. 5-10) da, para $d = 6$, un paso $P = 1$ mm. El «x 40» de detrás es la
          longitud del tornillo.

      - tipo: calcular
        titulo: El diámetro del fondo del M6
        pregunta: |
          Al dibujar la rosca del tornillo M6, ¿a qué diámetro va la línea fina del fondo?
        respuesta:
          tipo: numero
          valor: '4.8'
          tolerancia: 0.01
          formato: un número, en mm
        distractores:
          - valor: '5.4'
            mensaje: |
              Has restado la altura del filete, 0,6 mm, **una sola vez**. El filete está a los dos
              lados del eje: el diámetro pierde dos alturas, $6 - 2 \cdot 0{,}6$.
          - valor: '5'
            mensaje: |
              Has restado el **paso** al diámetro. El paso se mide a lo largo del eje, no hacia
              dentro; hacia dentro baja la altura del filete, por los dos lados.
          - valor: '6'
            mensaje: |
              Ese es el diámetro del **vértice**, que en una rosca exterior es el nominal y va en
              línea gruesa. El fondo va por dentro, en línea fina.
        pista: |
          En una rosca exterior el vértice está en el diámetro nominal y el fondo en el del núcleo,
          $d_3$. Si solo recuerdas la altura del filete, $h_3$, réstala por los dos lados.
        desarrollo: |
          El fondo de una rosca exterior está en el diámetro del núcleo, que la Tabla 2.20 da
          directamente:

          $$
          d_3 = d - 2\,h_3 = 6 - 2 \cdot 0{,}6 = 4{,}8 \text{ mm}
          $$

      - tipo: dibujar
        consigna: |
          Dibuja el extremo roscado del tornillo M6 x 40 DIN 931, sin la cabeza: el vástago visto
          de lado, cortado con una línea de rotura, y la vista frontal desde el extremo. Acótalo
          como se acota una rosca exterior. Hazlo a escala 5:1, que a 1:1 un M6 no se lee. La rosca
          útil, la de la tabla del libro: 15 mm (con una tabla de la norma, la ISO 4014 o el DIN 931
          de 1987, serían 18).
        comprueba:
          - punto: El contorno, a 6 mm de diámetro, en línea continua gruesa.
            porque: |
              En una rosca exterior vista, el vértice es el contorno de la pieza y va en gruesa
              («Tema 6. Uniones», pág. 6). Es el diámetro nominal, el de la M.
          - punto: El fondo, en línea continua fina, a 4,8 mm de diámetro y solo a lo largo de la rosca útil.
            porque: |
              El fondo va en fina, y su diámetro es el núcleo de la tabla. Si la fina se alarga
              hasta la rotura, el dibujo dice que el tornillo va roscado entero, y el DIN 931 M6 x 40
              solo lo va en 15 mm, según la tabla del libro (pág. 5-29).
          - punto: El final de la rosca útil, a 15 mm del extremo (los de la tabla del libro), en una línea gruesa de lado a lado.
            porque: |
              El final de la rosca útil, en una rosca vista, va en continua gruesa («Tema 6. Uniones»,
              pág. 6). Sin él no se sabe dónde acaba la rosca.
          - punto: En la vista frontal, la circunferencia gruesa del vértice y un arco fino de unos tres cuartos de vuelta para el fondo.
            porque: |
              Es el mínimo de los Criterios para empezar a corregir: «Dibujar bien, al menos, una
              rosca (3/4 en la vista frontal, diferenciar el tipo de línea…)». Una circunferencia
              fina entera, si el grosor no se distingue bien, se lee como otra arista (libro,
              pág. 5-15).
          - punto: La cota del diámetro escrita M6, no Ø6, y la cota de 15 de la rosca útil.
            porque: |
              Otro mínimo de los Criterios: «Al acotar una rosca, utilizar el símbolo M y no el
              símbolo de diámetro Ø». Y no acotar la longitud de la rosca les cuesta «−0,5 por cada
              caso».
        figura: |
          <svg viewBox="0 0 380 150" role="img" width="380" height="150" aria-labelledby="eg-t11-rosca-m6-t eg-t11-rosca-m6-d">
            <title id="eg-t11-rosca-m6-t">El extremo roscado del tornillo M6 x 40, en vista y en vista frontal, acotado</title>
            <desc id="eg-t11-rosca-m6-d">A la izquierda, el extremo del vástago visto de lado, con su eje horizontal de trazo y punto. El contorno exterior, de 6 mm de diámetro, va en línea gruesa y termina a la derecha en una línea fina ondulada de rotura. En el extremo libre, a la izquierda, un chaflán a 45 grados baja del contorno hasta el fondo. Una línea gruesa vertical marca dónde empieza el chaflán. Desde el extremo libre y a lo largo de 15 mm, dos líneas finas paralelas al eje, a 4,8 mm de diámetro, marcan el fondo de la rosca. A 15 mm del extremo, una línea gruesa vertical de lado a lado del contorno marca el final de la rosca útil. Debajo, una cota horizontal de 15 va del extremo libre a esa línea. A la izquierda, una cota vertical del diámetro dice M6. A la derecha, la vista frontal: una circunferencia gruesa de 6 mm de diámetro, con dos ejes de trazo y punto, y dentro un arco fino de 4,8 mm de diámetro que da tres cuartos de vuelta y deja abierto el cuarto de arriba a la derecha.</desc>
