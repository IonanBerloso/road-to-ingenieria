      - tipo: justificar
        pregunta: Ordena la lectura del «Tornillo hexagonal M6 x 40 DIN 931». Una pieza es falsa.
        piezas:
          - texto: «M6» es rosca métrica de 6 mm de diámetro nominal, que en un tornillo está en el vértice del hilo.
          - texto: Como entre M6 y la longitud no hay un «x paso», el paso es el normal, 1 mm según la tabla.
          - texto: El «x 40» es la longitud del vástago, sin la cabeza.
          - texto: «DIN 931» fija la forma, cabeza hexagonal, y con ella la longitud roscada, 15 mm en la tabla del libro.
          - texto: El 40 es el paso, porque en una rosca métrica lo que va detrás de la x es siempre el paso.
            trampa: true
            mensaje: |
              Detrás de la x de una **rosca** va el paso fino (M 6 x 0,75); detrás de la x de un
              **tornillo** va la longitud (M6 x 40). Un paso de 40 en un tornillo de 6 mm no existe:
              el hilo avanzaría casi siete diámetros por vuelta.
    resolucion: |
      **Las cifras.** «Tornillo hexagonal M6 x 40 DIN 931» se lee de izquierda a derecha: la
      denominación, la rosca (métrica, de 6 mm de diámetro nominal), la longitud del vástago
      (40 mm) y la norma que fija todo lo demás, cabeza incluida (libro, págs. 5-26 y 5-29). En
      «M4x25» pasa lo mismo: el 25 es la longitud, no el paso.

      **El paso.** Sin «x paso» detrás de la M, la rosca es de paso normal. Para $d = 6$ la
      Tabla 2.20 da $P = 1$ mm.

      **El fondo.** En una rosca exterior el vértice es el diámetro nominal y el fondo, el del
      núcleo:

      $$
      d_3 = d - 2\,h_3 = 6 - 2 \cdot 0{,}6 = 4{,}8 \text{ mm}
      $$

      **El dibujo.** Contorno de 6 mm en gruesa; fondo de 4,8 mm en fina a lo largo de los 15 mm
      de rosca útil; el final de la rosca útil, en gruesa; en la vista frontal, la circunferencia
      gruesa y el arco fino de tres cuartos. Se acota «M6» y «15».

      **El 15.** Es el de la tabla del libro (pág. 5-29), que es la del material. La ISO 4014,
      que hoy sustituye al DIN 931, da $b = 2d + 6 = 18$ mm para un M6 de hasta 125 mm de largo,
      y lo mismo daba el DIN 931 en su edición de 1987: con esas tablas, la fina del fondo y el
      final de la rosca útil irían a 18 del extremo, y la cota diría 18. Eso no lo trae el
      material: lo añadimos nosotros.

  - id: pasador-conico-5x50
    titulo: El pasador cónico 5 x 50, por el extremo grueso
    fuente: Ejemplo introductorio · Road to Ingeniería, con la designación de ejemplo del libro «Normalización básica. Dibujo técnico» del Dpto. de Expresión Gráfica y Proyectos de Ingeniería (tema V, pág. 5-50). No es de examen.
    nivel: ejemplo
    enunciado: |
      El libro de normalización del departamento da, como ejemplo de designación de un pasador
      cónico, «Pasador cónico ordinario 5 x 50 acero dulce DIN 1». Los pasadores cónicos tienen
      una conicidad de 1:50.

      **Notas nuestras.** Se pide qué diámetro es el 5 y cuánto mide el pasador en el otro
      extremo; el 50 es su longitud. Del mismo libro: en un tronco de cono, la conicidad es la
      diferencia de diámetros partida por la longitud, $\frac{D - d}{h} = \frac{1}{x}$ (tema IV,
      pág. 4-19).
    pide: Qué extremo mide 5 mm y el diámetro del otro extremo.
    pasos:
      - tipo: reconocer
        pregunta: En «Pasador cónico 5 x 50», ¿dónde mide el pasador 5 mm?
        opciones:
          - texto: En el extremo delgado
            correcta: true
            mensaje: |
              Eso es: la medida nominal es la del extremo de menor diámetro, que es la del
              agujero donde entra (libro, pág. 5-50). El otro extremo es más grueso.
          - texto: En el extremo grueso
            mensaje: |
              Al revés. El nominal es el diámetro menor, el del agujero: el pasador entra por ahí y
              se acuña al apretarlo, y el extremo que queda fuera es el más grueso.
          - texto: En el centro, a 25 mm de cada extremo
            mensaje: |
              El nominal no es un diámetro medio. Se da el del extremo delgado porque es la medida
              del agujero que hay que taladrar.
          - texto: En toda su longitud, porque un pasador es cilíndrico
            mensaje: |
              El cilíndrico sí, y por eso su designación lleva tolerancia de diámetro (m6, h8,
              h11). Este es cónico: su diámetro crece a lo largo.

      - tipo: calcular
        titulo: El diámetro del extremo grueso
        pregunta: Diámetro del pasador cónico 5 x 50 en su extremo grueso.
        respuesta:
          tipo: numero
          valor: '6'
          tolerancia: 0.01
          formato: un número, en mm
        distractores:
          - valor: '7'
            mensaje: |
              Has aplicado el 1:50 a **cada lado**, como si fuera la pendiente de una generatriz, y
              has sumado dos veces el milímetro. La conicidad mide lo que cambia el **diámetro**
              entero: 1 mm de diámetro por cada 50 de largo.
          - valor: '4'
            mensaje: |
              Has tomado el 5 como el extremo **grueso** y has restado. El nominal es el extremo
              delgado, el del agujero: el otro mide más.
          - valor: '5.02'
            mensaje: |
              Has sumado la conicidad, 1/50 = 0,02, como si fueran milímetros. La conicidad hay que
              multiplicarla por la longitud: son 0,02 mm de diámetro **por cada milímetro** de
              largo, y el pasador mide 50.
        pista: |
          Despeja $D$ de $\frac{D - d}{h} = \frac{1}{50}$, con $d = 5$ y $h = 50$.
        desarrollo: |
          $$
          D = d + \frac{h}{50} = 5 + \frac{50}{50} = 6 \text{ mm}
          $$

      - tipo: justificar
        pregunta: Ordena el cálculo del extremo grueso. Una pieza es falsa.
        piezas:
          - texto: El 5 de la designación es el diámetro del extremo delgado, el del agujero.
          - texto: El 50 es la longitud del pasador.
          - texto: 'Conicidad 1:50 quiere decir que el diámetro crece 1 mm por cada 50 de largo.'
          - texto: En 50 mm el diámetro crece 1 mm, así que el extremo grueso mide 6 mm.
          - texto: La conicidad es la inclinación de cada generatriz, así que cada lado sube 1 mm y el extremo grueso mide 7.
            trampa: true
            mensaje: |
              La conicidad se define con el **diámetro**: $\frac{D - d}{h}$ (libro, pág. 4-19).
              Cada generatriz sube la mitad, medio milímetro en los 50 mm del pasador.
    resolucion: |
      **Qué es el 5.** En un pasador cónico la medida nominal es el diámetro del extremo
      delgado, que es el del agujero (libro, pág. 5-50). El 50 es la longitud.

      **El extremo grueso.** La conicidad de un tronco de cono es la diferencia de diámetros
      partida por la longitud (pág. 4-19). Con 1:50:

      $$
      \frac{D - 5}{50} = \frac{1}{50} \;\Longrightarrow\; D = 6 \text{ mm}
      $$

      El diámetro crece 1 mm en los 50 mm del pasador; cada generatriz, medio milímetro.

  - id: polipasto-anillo-a30-din-471
    titulo: La ranura del anillo A30 DIN 471 del polipasto
    fuente: Ejercicio propio · Road to Ingeniería, sobre la lista de piezas del plano «Gancho de polipasto» (Conjunto 14) de Expresión Gráfica, UPV/EHU. El plano pide el despiece de sus piezas; esta pregunta es nuestra y no ha caído en examen.
    nivel: practica
    enunciado: |
      En la lista de piezas del plano «Gancho de polipasto» (Conjunto 14), la marca 12 son dos
      piezas de «Anillo elástico de eje A30 DIN 471». El plano pide dibujar las piezas 1, 2, 5 y
      9, y la 5 es el eje.

      **Notas nuestras.** Se pide qué pieza lleva la ranura del anillo y qué medidas tiene esa
      ranura en el dibujo del eje. La fila de la tabla de DIN 471 que hace falta, como la da la
      diapositiva «Uniones desmontables – Circlip» (pág. 2): para $d_1 = 30$, $d_2 = 28{,}6$,
      $d_3 = 27{,}9$, $s = 1{,}5$, $a \approx 4{,}8$ y $b \approx 3{,}5$, con el ancho de la ranura
      $m = s + 0{,}1$. Ahí $d_1$ es el diámetro del eje, $d_2$ el del fondo de la ranura, $d_3$ el
      interior del anillo suelto y $s$ su espesor. La lista escribe «A30»: la «A» no la explica el
      material, y para la ranura basta el 30.
    pide: Qué pieza lleva la ranura, su ancho y su profundidad.
    pasos:
      - tipo: reconocer
        pregunta: Un anillo DIN 471, ¿dónde va?
        opciones:
          - texto: En una ranura tallada por fuera del eje, que aquí es la pieza 5
            correcta: true
            mensaje: |
              Eso es. DIN 471 es el anillo de seguridad para **ejes**, el circlip exterior: se mete
              en una ranura del eje y frena lo que va montado en él, aquí el anillo interior del
              rodamiento. La ranura la dibujas tú en el despiece del eje.
          - texto: En una ranura tallada por dentro del agujero de la polea, la pieza 1
            mensaje: |
              Ese es el anillo para **agujeros**, el circlip interior, que es DIN 472. La lista dice
              «de eje» y DIN 471.
          - texto: En ninguna ranura, porque el anillo se aprieta contra el eje liso
            mensaje: |
              Sin ranura no frena nada: lo que impide que lo montado se salga del eje es que el
              anillo encaja en un escalón tallado en él (diapositiva, pág. 1: «se coloca en la
              ranura exterior de un eje»).

      - tipo: calcular
        titulo: El ancho de la ranura
        pregunta: Ancho de la ranura que hay que dibujar en el eje para el anillo A30 DIN 471.
        respuesta:
          tipo: numero
          valor: '1.6'
          tolerancia: 0.01
          formato: un número, en mm
        distractores:
          - valor: '1.5'
            mensaje: |
              Ese es el **espesor del anillo**, $s$. La ranura es una décima más ancha,
              $m = s + 0{,}1$, para que el anillo entre.
          - valor: '1.4'
            mensaje: |
              Has restado la décima en vez de sumarla. Una ranura más estrecha que el anillo no lo
              deja entrar: $m = s + 0{,}1$.
        pista: |
          La tabla da el espesor del anillo, $s$, en la fila de $d_1 = 30$, y el ancho de la ranura
          se saca de él.
        desarrollo: |
          $$
          m = s + 0{,}1 = 1{,}5 + 0{,}1 = 1{,}6 \text{ mm}
          $$

      - tipo: calcular
        titulo: La profundidad de la ranura
        pregunta: Profundidad de la ranura, medida desde la superficie del eje.
        respuesta:
          tipo: numero
          valor: '0.7'
          tolerancia: 0.01
          formato: un número, en mm
        distractores:
          - valor: '1.4'
            mensaje: |
              Eso es la diferencia de **diámetros**, $30 - 28{,}6$. La profundidad es la mitad: la
              ranura rodea el eje y se come esa diferencia repartida entre los dos lados.
          - valor: '1.05'
            mensaje: |
              Has usado $d_3 = 27{,}9$, que es el diámetro interior del anillo **suelto**. El fondo
              de la ranura es $d_2 = 28{,}6$; el anillo es más pequeño para quedarse apretado en él.
          - valor: '2.1'
            mensaje: |
              Has restado $30 - 27{,}9$: el anillo suelto en vez del fondo de la ranura, y sin
              partir entre dos. Son dos errores a la vez.
        pista: |
          La ranura va del diámetro del eje, $d_1$, al del fondo de la ranura, $d_2$, y esa
          diferencia de diámetros se reparte entre los dos lados.
        desarrollo: |
          $$
          \frac{d_1 - d_2}{2} = \frac{30 - 28{,}6}{2} = 0{,}7 \text{ mm}
          $$

      - tipo: justificar
        pregunta: Ordena cómo se saca la ranura del anillo. Una pieza es falsa.
        piezas:
          - texto: DIN 471 es el anillo para ejes, así que la ranura va en el eje, la pieza 5.
          - texto: El 30 es el diámetro del eje, d1, y da la fila de la tabla.
          - texto: En esa fila, el anillo tiene 1,5 de espesor y la ranura, 1,6 de ancho.
          - texto: El fondo de la ranura está a 28,6 de diámetro, así que tiene 0,7 de hondo.
          - texto: El fondo de la ranura está en d3 = 27,9, el diámetro interior del anillo.
            trampa: true
            mensaje: |
              $d_3$ es el anillo **suelto**, más pequeño que la ranura para que quede apretado
              contra su fondo. El fondo de la ranura es $d_2 = 28{,}6$.
    resolucion: |
      **Dónde va.** DIN 471 es el anillo de seguridad para ejes, el circlip exterior: va en una
      ranura del eje, la pieza 5, y frena axialmente lo que lleva montado.

      **La ranura.** En la fila de $d_1 = 30$ de la tabla de DIN 471:

      $$
      m = s + 0{,}1 = 1{,}5 + 0{,}1 = 1{,}6 \text{ mm}, \qquad \frac{d_1 - d_2}{2} = \frac{30 - 28{,}6}{2} = 0{,}7 \text{ mm}
      $$

      En el despiece del eje se dibuja una ranura de 1,6 mm de ancho y fondo a 28,6 mm de
      diámetro. El anillo no se dibuja en el despiece: va en la lista de piezas.

  - id: polipasto-rodamientos-6306
    titulo: Los rodamientos 6306 de las poleas del polipasto
    fuente: Ejercicio propio · Road to Ingeniería, sobre el plano «Gancho de polipasto» (Conjunto 14) de Expresión Gráfica, UPV/EHU, y la regla del ajuste de la diapositiva «Rodamientos». El plano pide el despiece de sus piezas; esta pregunta es nuestra y no ha caído en examen.
    nivel: practica
    enunciado: |
      En la lista de piezas del plano «Gancho de polipasto» (Conjunto 14), la marca 6 son dos
      piezas de «Rodamiento radial de bolas 6306». El plano pide dibujar, entre otras, la pieza 1
      (la polea) y la pieza 5 (el eje).

      **Notas nuestras.** Lo que enseña el plano: cada polea (1) gira sobre su rodamiento (6)
      alrededor del eje (5), y el eje no gira, porque lo atraviesa el vástago del gancho (7); la
      tensión del cable tira siempre hacia el mismo lado. Se pide qué anillo del rodamiento
      necesita ajuste forzado, el diámetro del agujero del 6306 y la desviación inferior del eje en
      ese asiento si se elige h6. De la diapositiva «Rodamientos»: los dos últimos dígitos son el
      tamaño, «d/5» (pág. 4); y en el caso «alojamiento giratorio, carga estacionaria» el eje va
      con h6 o g6 (pág. 12, la 16 impresa). De la UNE-EN ISO 286-1 (Tablas ISO del material): para
      dimensiones de más de 18 hasta 30 mm, IT6 = 13 µm (Tabla 1, pág. 1), y la desviación
      superior de h es 0 (Tabla 4, pág. 5).
    pide: Qué anillo va forzado, el diámetro del agujero del rodamiento y la desviación inferior de su asiento en el eje con h6.
    pasos:
      - tipo: reconocer
        pregunta: En la polea del polipasto, ¿qué anillo del rodamiento necesita un ajuste forzado?
        opciones:
          - texto: El exterior, el que va en la polea
            correcta: true
            mensaje: |
              Eso es. El anillo exterior gira con la polea y la carga del cable no: respecto de él,
              la carga da vueltas, y un anillo con carga giratoria «debe tener un ajuste forzado»
              para no deslizar (diapositiva, pág. 8). Es el caso que la diapositiva pone de
              ejemplo con una polea (pág. 9).
          - texto: El interior, el que va en el eje
            mensaje: |
              El eje no gira y la carga tampoco: para el anillo interior la carga está siempre en
              el mismo sitio, es estacionaria, y entonces «puede tener un ajuste de juego». Por eso
              el eje va con h6 o g6.
          - texto: Los dos, porque un rodamiento siempre va apretado por dentro y por fuera
            mensaje: |
              No hace falta, y estorba al montarlo. La regla es de cada anillo por separado: forzado
              solo el que tiene la carga girando respecto de él.
          - texto: 'Ninguno: con la carga de un cable basta con juego en los dos'
            mensaje: |
              Sin apriete, el anillo que ve girar la carga desliza sobre su asiento, el «creep» de
              la diapositiva: ese anillo «debe tener un ajuste forzado (indeterminado también se
              admite)» (pág. 8).

      - tipo: calcular
        titulo: El agujero del 6306
        pregunta: Diámetro del agujero del rodamiento 6306.
        respuesta:
          tipo: numero
          valor: '30'
          tolerancia: 0.01
          formato: un número, en mm
        distractores:
          - valor: '6'
            mensaje: |
              Has leído el 06 tal cual. Los dos últimos dígitos son el tamaño, que es el diámetro
              **partido por cinco**: hay que multiplicar por 5.
          - valor: '1.2'
            mensaje: |
              Has dividido el 06 entre cinco. La diapositiva escribe el tamaño como «d/5»: el 06 ya
              es el diámetro partido por cinco, y para volver a $d$ se multiplica.
        pista: |
          En 6306, el 6 es el tipo, el 3 la serie y el 06 el tamaño, que es $d/5$. Comprueba con el
          ejemplo de la diapositiva: 6205 tiene $d = 25$.
        desarrollo: |
          El tamaño es $d/5$, así que

          $$
          d = 5 \cdot 06 = 30 \text{ mm}
          $$

          Cuadra con el eje del mismo plano: el anillo de la marca 12 es «A30 DIN 471», para un eje
          de 30 mm.

      - tipo: calcular
        titulo: La desviación inferior del eje h6
        pregunta: Desviación inferior del asiento del rodamiento en el eje, Ø30 h6.
        respuesta:
          tipo: numero
          valor: '-13'
          tolerancia: 1
          formato: un número, en µm, con su signo
        distractores:
          - valor: '13'
            mensaje: |
              El valor es el bueno y el signo no. En h la desviación **superior** es 0, así que
              toda la tolerancia queda por debajo de la cota nominal: la inferior es negativa.
          - valor: '-16'
            mensaje: |
              Has tomado la fila de 30 a 50 mm. La buena es la fila de más de 18 hasta 30, con el 30
              incluido: IT6 = 13.
          - valor: '-21'
            mensaje: |
              Eso es IT7 en la fila de 18 a 30. El asiento es h**6**: calidad 6, IT6 = 13 µm.
          - valor: '-0.013'
            mensaje: |
              Es la cifra buena en **milímetros**. Se pide en micras, como la da la tabla: −13 µm.
        pista: |
          En h, la desviación superior es 0; la inferior es la superior menos IT6, que sale de la
          fila de 18 a 30 mm.
        desarrollo: |
          $$
          ei = es - IT6 = 0 - 13 = -13 \ \mu\text{m}
          $$

          El asiento va de 30,000 a 29,987 mm.

      - tipo: justificar
        pregunta: Ordena el razonamiento del asiento del rodamiento en el eje. Una pieza es falsa.
        piezas:
          - texto: La polea gira y el cable tira siempre hacia el mismo lado, así que el anillo exterior ve la carga girar.
          - texto: El eje no gira, así que para el anillo interior la carga está quieta, y puede ir con juego.
          - texto: El 06 del 6306 es d/5, así que el agujero mide 30 mm, como el eje del anillo A30.
          - texto: Con h6, el asiento va de 0 a −13 µm, porque IT6 vale 13 en la fila de 18 a 30.
          - texto: El anillo interior va forzado porque está montado sobre el eje, y el eje es lo que aguanta la carga.
            trampa: true
            mensaje: |
              Lo que decide no es qué pieza aguanta la carga, sino si la carga **gira respecto del
              anillo**. Para el anillo interior, sobre un eje que no gira, la carga está quieta:
              juego (diapositiva, págs. 8 y 12).
    resolucion: |
      **Qué anillo se aprieta.** La polea gira alrededor del eje fijo y la tensión del cable no
      cambia de dirección. Para el anillo exterior la carga gira: va forzado en la polea (M7 o N7
      según la tabla de la diapositiva). Para el interior la carga está quieta: puede ir con juego,
      y el eje lleva h6 o g6.

      **El agujero.** El tamaño es $d/5$: $d = 5 \cdot 06 = 30$ mm, el mismo eje del anillo A30
      DIN 471.

      **El asiento con h6.** En la fila de más de 18 hasta 30 mm, IT6 = 13 µm, y en h la
      desviación superior es 0:

      $$
      es = 0, \qquad ei = 0 - 13 = -13 \ \mu\text{m}
      $$

      En el despiece del eje se escribe Ø30 h6; el asiento queda entre 30,000 y 29,987 mm.

  - id: polipasto-pasador-6m6x60
    titulo: Las desviaciones del pasador 6m6x60 del polipasto
    fuente: Ejercicio propio · Road to Ingeniería, sobre la lista de piezas del plano «Gancho de polipasto» (Conjunto 14) de Expresión Gráfica, UPV/EHU. El plano pide el despiece de sus piezas; esta pregunta es nuestra y no ha caído en examen.
    nivel: practica
    enunciado: |
      En la lista de piezas del plano «Gancho de polipasto» (Conjunto 14), la marca 10 es una
      pieza de «Pasador cilíndrico 6m6x60 DIN 7».

      **Notas nuestras.** Se pide qué significa cada parte de la designación y entre qué
      desviaciones está el diámetro del pasador. Del libro de normalización del departamento:
      «Pasador cilíndrico 8 x 30 DIN 7» es un pasador de $d = 8$ mm y longitud $l = 30$ mm
      (tema V, pág. 5-51). De la UNE-EN ISO 286-1 (Tablas ISO del material): para dimensiones de
      más de 3 hasta 6 mm, IT6 = 8 µm (Tabla 1, pág. 1), y la desviación fundamental de m es la
      inferior, $ei = +4$ µm (Tabla 5, pág. 6).
    pide: Qué es cada parte de la designación y las dos desviaciones del diámetro.
    pasos:
      - tipo: reconocer
        pregunta: En «Pasador cilíndrico 6m6x60 DIN 7», ¿qué es «m6»?
        opciones:
          - texto: La tolerancia del diámetro de 6 mm, posición m y calidad 6
            correcta: true
            mensaje: |
              Eso es. Minúscula, como un eje: la posición m queda por encima de la cota nominal y la
              calidad 6 fija el ancho de la tolerancia. Es una de las tres tolerancias del pasador
              cilíndrico, con h8 y h11 (apuntes «Pasadores y chavetas», pág. 2; libro, pág. 5-50).
          - texto: Una rosca métrica de 6 mm
            mensaje: |
              Una rosca métrica se escribe con M mayúscula y un pasador cilíndrico no lleva rosca.
              La m minúscula detrás de una cota es una posición de tolerancia.
          - texto: La longitud, 6 mm, con 60 de diámetro
            mensaje: |
              Al revés: en un pasador DIN 7 la designación es diámetro por longitud, «8 x 30» en el
              ejemplo del libro. Aquí, 6 de diámetro y 60 de largo.
          - texto: La clase de resistencia del acero
            mensaje: |
              La clase de resistencia es la de los tornillos, con un punto en medio: 8.8, 5.6. Aquí
              no hay ninguna.

      - tipo: calcular
        titulo: La desviación inferior de 6 m6
        pregunta: Desviación inferior del diámetro del pasador, Ø6 m6.
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 1
          formato: un número, en µm, con su signo
        distractores:
          - valor: '0'
            mensaje: |
              Ese es el cero de la posición **h**. La m está por encima: su desviación fundamental
              es la inferior, +4 µm en la fila de 3 a 6 mm.
          - valor: '-4'
            mensaje: |
              El valor es el bueno y el signo no. De k en adelante los ejes quedan por encima de la
              cota nominal, o como mucho tocándola: la desviación inferior de m es **positiva**.
          - valor: '12'
            mensaje: |
              Esa es la desviación **superior**, ya sumada la tolerancia. La inferior es la que da
              la tabla directamente: +4.
        pista: |
          En los ejes de k a zc, la tabla da la desviación inferior, $ei$. Busca la columna m en la
          fila de 3 a 6 mm.
        desarrollo: |
          La Tabla 5 da, para m y más de 3 hasta 6 mm, $ei = +4$ µm. El 6 entra en esa fila,
          «hasta e incluido».

      - tipo: calcular
        titulo: La desviación superior de 6 m6
        pregunta: Desviación superior del diámetro del pasador, Ø6 m6.
        respuesta:
          tipo: numero
          valor: '12'
          tolerancia: 1
          formato: un número, en µm, con su signo
        distractores:
          - valor: '8'
            mensaje: |
              Ese es **IT6**, el ancho de la tolerancia, no una desviación. La superior es la
              inferior más ese ancho: $4 + 8$.
          - valor: '-4'
            mensaje: |
              Has restado la tolerancia a la desviación inferior. La superior está **por encima**:
              $es = ei + IT6$.
          - valor: '0.012'
            mensaje: |
              Es la cifra buena en **milímetros**. Se pide en micras, como la da la tabla: +12 µm.
        pista: |
          La superior es la inferior más el ancho de la tolerancia: $es = ei + IT6$.
        desarrollo: |
          $$
          es = ei + IT6 = 4 + 8 = 12 \ \mu\text{m}
          $$

          El diámetro del pasador queda entre 6,004 y 6,012 mm.

      - tipo: justificar
        pregunta: Ordena la lectura del pasador. Una pieza es falsa.
        piezas:
          - texto: En un pasador DIN 7, la designación es diámetro por longitud, así que mide 6 de diámetro y 60 de largo.
          - texto: m6 es la tolerancia del diámetro, la de un eje, porque va en minúscula.
          - texto: El 6 entra en la fila de 3 a 6 mm, con m en ei = +4 µm e IT6 = 8 µm.
          - texto: La desviación superior es 4 + 8 = 12 µm, y el pasador va de 6,004 a 6,012 mm.
          - texto: m6 quiere decir que el diámetro puede apartarse 6 µm de la cota nominal, por encima o por debajo.
            trampa: true
            mensaje: |
              El 6 de m6 es la **calidad**, no las micras: su ancho, IT6, lo da la tabla según el
              diámetro (8 µm aquí). Y la m no reparte por arriba y por abajo: deja las dos
              desviaciones por encima de la cota, de +4 a +12.
    resolucion: |
      **La designación.** «Pasador cilíndrico 6m6x60 DIN 7»: diámetro 6 mm con tolerancia m6,
      longitud 60 mm, norma DIN 7, que es la de los pasadores cilíndricos (libro, pág. 5-51).

      **Las desviaciones.** En la fila de más de 3 hasta 6 mm, m tiene $ei = +4$ µm (Tabla 5) e
      IT6 = 8 µm (Tabla 1):

      $$
      es = ei + IT6 = 4 + 8 = 12 \ \mu\text{m}
      $$

      El diámetro va de 6,004 a 6,012 mm: siempre por encima de 6.
